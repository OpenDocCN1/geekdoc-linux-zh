- pgno: 39
  md: '# ## Touring the Desktop


    The first time you run KDE, it appears with a basic desktop configuration (refer
    to Figure 1-1). (And yes, it sure does look a heck of a lot like Windows 95, doesn’t
    it?)


    If you don’t like the default look, don’t worry. Chapters 6 and 7 are all about
    desktop design, theme management, and doing heavy-duty cosmetic surgery on your
    desktop. For now, though, work with the default KDE desktop.


    That gray horizontal bar running along the bottom of the screen is the *panel*.
    Use the buttons on the panel to start programs, which find files, launch applications,
    or control KDE itself. You will get to know the panel very well, because it’s
    the central nervous system of KDE. Read Chapter 5 for more information about the
    panel and how to customize it.


    KDE also puts some icons along the left side of your desktop. These icons enable
    you to run some common *utility programs*, or little programs that do important
    tasks behind the scenes. You can use the icons to create new files, remove old
    ones you don’t want any more, print, or move files between CDs, ROMs, diskettes,
    and your hard drive. See the “What Are All These Icons For?” section of this chapter
    for a description of each icon and its basic function.


    Along the top of the screen, you see the *taskbar*. If you’ve used Windows 95
    or Windows 98, you’re already familiar with taskbars. We discuss the KDE taskbar
    in the “Hanging Out at the (Task) Bar” section of this chapter. Basically, you
    can use the taskbar to manage various applications and windows that you have open
    at the same time.


    All of these facets are customizable. You can move them to different places on
    the screen, collapse them so you don’t have to see them, or line them up neatly.
    Chapters 5, 6, and 7 contain a lot of information and ideas to help you tailor
    KDE to your own tastes.


    One other feature that we should mention at this point is KFM, the KDE File Manager.
    KFM works like Windows Explorer or the Mac OS Finder. KFM is a graphical representation
    of the computer’s file system, and it shows all the files in your *home directory*,
    the directory associated with your user account. Like Explorer or Finder, KFM
    shows your directory as a collection of folders and files. Think of KFM as an
    electronic file cabinet, because that’s the way it was designed to work. You can
    drag files from one folder to another, or open windows that show the contents
    of various folders.'
  merge: -1
  img_proc: true
- pgno: 40
  md: "Chapter 1: Getting Your Hands Dirty\n\n15\n\n# ## What Are All These Icons\
    \ For?\n\nTake a closer look at the desktop. Along the left side, you see six\
    \ icons (refer back to Figure 1-1). These icons are super-duper shortcuts to some\
    \ frequently used commands, and using them well can really speed up your desktop\
    \ management skills (one of those fancy terms that really means “keeping your\
    \ desk clean”).\n\nYou can also create your own icons for programs that you use\
    \ frequently by clicking the Template icon. Creating your own icons eliminates\
    \ some of the searching that you have to do if you start programs from the KDE\
    \ menu.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_40_0.png)\n\nDouble-clicking\
    \ the Autostart icon pops open a window where you can put links to programs on\
    \ your hard drive. KDE makes sure that, after you start KDE, all the programs\
    \ linked to the Autostart folder start automatically.\n\nYou need to remember\
    \ two important aspects about Autostart, though.\n\n+   - If you’re running a\
    \ Linux system, and you’re the only user, you simply may not restart KDE very\
    \ frequently.  \n+     UNX-based computers have amazing *uptimes* compared to\
    \ Windows computers. It’s not unusual for a machine running Linux to go for a\
    \ month or two without needing to be restarted. So, if you’re putting programs\
    \ here that you need every day, you’re probably going to need to open them manually\
    \ anyway. (If you don’t live alone, or you have multiple users on this machine,\
    \ you log out of KDE every time you end a session, so that Autostart is more helpful\
    \ for you. Logging out is a good habit anyway — you never know when your cat is\
    \ going to learn to type and send spam out under your e-mail address.)\n\n+  \
    \ - You don’t have to link every single program to Autostart.  \n+     We’ve heard\
    \ of people who set up Autostart that way. Every time they launch KDE, the poor\
    \ machine spends time just opening programs . . . the word processor, the calendar,\
    \ the accounting program, the graphics program, all the utility programs, the\
    \ database, all the games, and so forth. You can always open programs just by\
    \ finding them in the panel and clicking, so that you really don’t need to add\
    \ much to Autostart — maybe Netscape and your calendar, if those are the two programs\
    \ you always open after you start a new session anyway.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_40_1.png)\n\
    \nDouble-clicking the Printer icon opens the printer configuration screen. On\
    \ that screen, you can set up your printer for various kinds of paper, the direction\
    \ you want text to print, and other basic printer information. Despite its name,\
    \ the Printer icon doesn’t actually send your files to be printed. Commands such\
    \ as that are usually sent from inside a particular program. For example, if you’re\
    \ working on a letter or report, you tell the computer to print it by issuing\
    \ the word processor’s print command."
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Part I: Getting Started


    If you want to create new desktop icons to speed up the process of opening your
    favorite programs, you’ll love the Template icon. Clicking the Template icon opens
    a window that contains a bunch of sample files for different kinds of desktop
    icons. You can use these samples to create new desktop icons that look and act
    like the sample files, and then edit the new icons by right-clicking on them and
    using the context menus.


    Here’s a basic one. Trash can equals garbage, right? Yep! KDE puts a Trash icon
    on your desktop so that you have a convenient place to put files you want to delete.
    Just like a Macintosh Trashcan or a Windows Recycle Bin, the KDE trash icon provides
    a convenient link to a folder that holds files until you delete them permanently.
    You can drag file icons from open windows and drop them on the trash icon, or
    you can double-click the trash icon to open the Trash folder window and drag files
    between any open window and the Trash window. Files will remain in the Trash folder
    until you empty it. See Chapter 4 for more information on deleting files.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_41_0.png)


    Linux handles deleted files differently than Mac or Windows. You can use a special
    utility program to recover deleted files from Mac or Windows machines, even after
    you’ve emptied the Trash can or Recycle Bin. This is not true for Linux and other
    UNIX-based systems! As soon as you empty the KDE trash folder, those files are
    permanently erased from your hard drive, and you have no way to get them back.
    If you’re not sure you really want to toss something, put a copy on a diskette.
    You can always clean the diskette later.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_41_1.png)


    The final two icons work only if you are logged in as root. Yes, we told you to
    use this chapter in your regular user account and not as root. However, the Linux
    default settings allow only the root account to mount CD-ROM or floppy disk drives.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_41_2.png)


    Mounting is a UNIX term that means making the file system on a disk available
    to the whole system. Unlike Windows or Mac, you can’t just shove a disk into the
    floppy drive and use it in Linux. You need to mount the floppy drive first.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_41_3.png)


    If you want to change the default settings so that regular user accounts can mount
    drives, go to Chapter 13, where mounting file systems is discussed in exquisitely
    correct detail. Changing your default setting will save you some time if you use
    lots of CDs or floppies in your user account.


    Double-click the CD icon to mount the CD-ROM drive. If you’re not logged in as
    root, an error message pops up telling you to go away until you’re root.'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'Like the CD icon, the Diskette icon lets you mount the 3.5" floppy disk drive.
    Remember, if you''re not root, KDE won''t let you do this.


    # # Getting to Know the Panel


    Some of the greatest books written for kids feature old houses with secret panels
    everywhere, so that the reader can imagine hiding behind the wall or sneaking
    through the house without anyone knowing. Unfortunately, the KDE panel isn''t
    a way to creep through your computer without being noticed, but the panel is sure
    a handy way to run programs and get KDE set up. If you want more information about
    the panel than this brief introduction contains, refer to Chapter 5.


    The panel, shown in Figure 1-2, is the heart of KDE. You can use the panel to
    launch just about any program that you have loaded on your computer, and you can
    customize it as much as you want. The panel is that long gray bar that runs along
    the bottom of the desktop. If you don''t like the panel there, you can move it.
    Remember, you can easily change things in KDE.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_42_0.png)


    If you read this chapter and wonder why your panel doesn''t have all these buttons,
    check to see that you have fully extended the panel. If your monitor is too small
    for the default KDE desktop size, KDE automatically hides some panel icons under
    others without telling you.


    > *To collapse the panel, look for narrow textured bars with arrows. If you click
    one of these bars, the panel disappears behind it. Click the bar again to bring
    the panel back. You''ve just collapsed your panel, which means that you''ve hidden
    it temporarily. Hiding your panel is really useful if the panel just keeps getting
    in your way and you''re about ready to scream. Collapse the panel, do your work,
    and bring it back after you''re done.*'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 18 Part I: Getting Started


    The KDE logo icon is right next to the left-hand textured bar. If you click this
    button, KDE displays the main KDE menu, shown in Figure 1-3. The KDE menu works
    like the Start menu in Windows 95 or Windows 98, so the KDE menu may already be
    a familiar sight to you.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_43_0.png)


    Throughout the book, we refer to the KDE menu as the first step in a series of
    actions. When you see the phrase “open the KDE menu,” use this button to do so.


    At the top of the KDE menu, you see items with arrows pointed to the right. The
    arrow means that item has a submenu, or additional choices that appear to the
    right of the KDE menu if you hold the mouse pointer over the arrowed item. Move
    your mouse pointer over one of the items with a submenu and take a look at what’s
    there. Items without an arrow don’t have submenus; if you hold your mouse pointer
    over a non-arrowed item, nothing happens. You need to click that item, which starts
    the named program. These items are usually programs that you use so frequently
    that you need one-click access instead of burrowing through a bunch of folders
    to find the right program.


    If you forget what a particular desktop icon or command does, let your mouse tell
    you. Put the mouse pointer over the icon and just let it sit there for a moment.
    Don’t click. A little box appears with the icon’s label, which is usually enough
    of a reminder.


    Move on and check out some of the other items in the menu. The KDE menu divides
    program items into convenient categories to make it easy for you to browse and
    find them.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'The *Window List icon* has three windows on it. Click the icon to make the
    Window List appear on your screen. The Window List shows all the open windows
    on your screen, and makes it easier to manage a large number of open windows than
    trying to drag them around the screen so that you can see all the titlebars. To
    manage your open windows, click the icon to open the Window List, select the name
    of the window you want to work on from the list, and then click OK. The window
    you choose moves to the top of your pile of open windows.


    The *KFM icon* has a file folder and a tiny little house on it. This button opens
    KFM, or the KDE File Manager. KFM is a graphical directory of all the files in
    your home directory. KFM works like Windows Explorer in Windows 95 or the Mac
    OS Finder. In Linux, each user keeps personal files in an individual home directory,
    which is the part of the computer''s landscape that''s all yours. You can imagine
    white picket fences and climbing roses if you want, or barbed wire and "Do Not
    Trespass" signs. It''s up to you.


    To *customize KDE* to fit your needs perfectly, use the Control Center icon to
    open the Control Center. The Control Center handles all the changes to KDE''s
    basic configuration, including functions such as moving the panel or changing
    the look of the desktop. See Part II for detailed coverage of the many options
    you find in the Control Center.


    The *Find Utility icon* is recognizable by the cute little pawprints. Find is
    a really useful button. Just pop Find open, type the name of the file or program
    you''re looking for, and let Find, well, find it for you. Find is covered in more
    depth in Chapter 4.


    The *Toolbar icon* contains links to a bunch of system utilities, which are described
    in more detail in Chapter 10. These system utilities are little programs that
    affect how your computer works. You don''t have to use these, although you can
    do some pretty neat things inside the Toolbar.


    If you''re running KDE on a machine that''s part of a network, and you''re not
    the network administrator, ask before you start fooling around in the Toolbar.
    Some networks are really picky, and changes to one machine can affect everyone''s
    computer. Your network administrator will appreciate you asking.


    Next to the Find Utility icon, you see two tiny buttons stacked on top of each
    other. The Logout button is the one on top. If you click this button, your KDE
    session ends, and you end up at a command-line prompt in your home directory.
    See the "*So Long, Farewell: Exiting KDE*" section of this chapter.'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'The button below the Logout button activates screenlock, which is a souped-up
    version of a screensaver. If you click the Screenlock button, your screen-saver
    starts up right away. Unlike the regular screensaver, though, you have to type
    your screenlock password to get back to the desktop. See Chapter 10 for a discussion
    of screenlock and whether it''s an option you need.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_45_0.png)


    The Payer icon is really a series of four buttons marked One, Two, Three, and
    (bet you can''t guess it) Four. The Pager controls your virtual desktops. Usually,
    the One button is pressed down, because the One desktop is the basic one everyone
    uses. You read about virtual desktops in the "I Have How Many Desktops?" section
    of this chapter, and we discuss multiple desktops in more detail in Chapter 3.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_45_1.png)


    You click the Terminal icon if, for any reason, you need to issue commands directly
    to the operating system. A terminal window appears, which is a window that contains
    a shell prompt. Terminal windows emulate plain old character-based interfaces;
    you can use them to work directly with Linux, or you can use them to run programs
    that are purely character-based. Chapter 12 includes some tips about running text-based
    programs and using terminal windows. You generally won''t use this icon much,
    because KDE makes it easy to handle operating system commands through other interfaces.
    However, knowing this button is there if you need it is good.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_45_2.png)


    Clicking the Online Help icon opens the KDE help browser, which includes answers
    to hundreds of common problems and topics. If you run into a problem or have a
    burning question, click this icon to activate the help browser, and use the browser
    links to get to the answer you need. You should know, though, that the KDE online
    help does not allow you to search or use a comprehensive index to the help files.
    You may have to poke around a bit before you find the answer you''re searching
    for. Chapter 2 discusses the online help system in more detail.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_45_3.png)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_45_4.png)


    The very last feature you see on the panel is the current date and time. KDE gets
    this information from your system settings, so if your system''s confused about
    the date or time, the panel will be confused, too. We discuss setting the clock
    in Chapter 5.


    # Hanging Out at the (Task) Bar


    In the default desktop shown in Figure 1-1, the KDE taskbar appears at the top
    of the screen. If you''ve ever seen or used Windows 95 or Windows 98, you''ve
    seen a similar tool. The taskbar allows you to see, with a quick glance, what
    programs are currently running on your computer. The taskbar does this by displaying
    a button for each open application. Take a look at Figure 1-4 to see the taskbar
    in action. Because you have a button for each open program, you can close all
    your windows, or layer them directly on top of each other, without losing track
    of what''s running.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_46_0.png)


    Figure 1-4:

    The KDE

    taskbar is

    a quick

    shortcut.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_46_1.png)


    Whenever you start an application or open a new window, KDE places a corresponding
    button on the taskbar. That new button carries a small icon and the application''s
    name. Refer to Figure 1-4 to see the open KRN''s button on the taskbar. If you
    want to bring that window to the top of the windows on the desktop, click the
    corresponding button in the taskbar. The window magically appears.


    One of the most helpful uses of the taskbar is for people who like to have multiple
    applications running, but only one window visible at a time: Click the small dot
    in the window''s titlebar to close all the windows (except the one you want to
    work in.) The window disappears from the desktop, leaving only its button in the
    taskbar to remind you that it exists. Figure 1-5 shows a desktop with three running
    programs, all visible only in the taskbar. If you need a program again, just click
    the correct button in the taskbar to reopen it. You can get a reminder of what
    you''ve got running just by looking at the taskbar.'
