- pgno: 129
  md: "# Window dressing — color schemes\n\nWhen you start redecorating your KDE desktop,\
    \ you don't have to stop with the desktop background. Although the desktop background\
    \ is the largest piece of screen real estate you can recolor, it's certainly not\
    \ the only one. You can also control the colors KDE uses to draw application windows,\
    \ dialog boxes, and the like. You can exercise individual control over details\
    \ such as the titlebar color, titlebar text color, and window background. You\
    \ can select the colors of each element individually, or you can choose one of\
    \ several pre-defined color schemes. The choice is yours.\n\nTo select your window\
    \ colors, follow these steps:\n\n+   1. **Right-click the desktop and choose Display\
    \ Properties from the pop-up menu that appears.**\n+   \n+   The Display Settings\
    \ dialog box appears. (The step isn't necessary if the Display Settings dialog\
    \ box is already open.)\n+   2. **Click the Colors tab.**\n+   \n+   KDE displays\
    \ the settings shown in Figure 6-5.\n+   3. **Select a predefined color scheme\
    \ from the Color Scheme list box.**\n+   \n+   The preview box in the top of the\
    \ Colors tab shows a sample of the selected color scheme. The preview box makes\
    \ it easy to check out the individual schemes without having to apply each one\
    \ to your desktop. If you find a color scheme that you like, you can click the\
    \ Apply button to apply it to your desktop, and skip the rest of this procedure."
  merge: -1
  img_proc: true
