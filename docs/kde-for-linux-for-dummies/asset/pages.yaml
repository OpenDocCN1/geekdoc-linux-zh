  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_114_0.png)


    Figure 5-3: The Auto Hide feature reduces the screen space devoted to the panel
    or taskbar.


    +   3. Select (or deselect) the Show Menu Tooltips option and then adjust the
    Delay slider.


    If you select the Show Menu Tooltips option, KDE displays a small pop-up box giving
    a short description of the button under the mouse pointer anytime you let the
    mouse pointer hover on a button for a second or so. The Delay slider controls
    how long the mouse pointer must hover on a button before the Tooltip box appears.
    Drag the Delay slider to the left to cause the Tooltip box to pop up quicker or
    drag the slider to the right to lengthen the delay before the Tooltip appears.


    +   4. Select (or deselect) the Auto Hide Panel option and then adjust the Delay
    and Speed sliders.


    If you select the Auto Hide Panel option, KDE automatically collapses the KDE
    panel into the side of the desktop to which it is attached after you move the
    mouse pointer away from the panel. The panel becomes just a thin line at the edge
    of the desktop. This hiding action occurs after a short delay, the length of which
    is controlled by the Delay slider. KDE animates the hiding action, showing the
    panel slip into the side of the screen. The Speed slider controls the duration
    of the animation.


    To restore the hidden panel to its normal position on your desktop, simply move
    your mouse pointer over the thin line at the edge of the screen. The KDE panel
    resumes its normal size immediately.


    TIP


    +   5. Select (or deselect) the Auto Hide Taskbar option and then adjust the Delay
    and Speed sliders.


    The Auto Hide Taskbar option works the same as the Auto Hide Panel option described
    in Step 4.'
