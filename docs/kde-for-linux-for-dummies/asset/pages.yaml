    # Finding Themes Online


    KDE comes with a small assortment of themes preinstalled. But you’re not confined
    to that meager selection of themes. You have access to an active community of
    KDE users who are developing new themes and refining and updating the existing
    library of themes, then making those themes available to other KDE users. In keeping
    with the open source spirit of the Linux and KDE projects, most themes are freely
    distributed and you can legally copy, use, and modify them.


    The Themes.org Web site exists as a clearinghouse for the exchange of themes.
    Theme developers post new themes on the site and other users can view, download,
    and comment on the themes. You can search for themes by keyword or by several
    other criteria. After you find a theme you like, you can'
