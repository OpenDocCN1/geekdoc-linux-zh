- pgno: 118
  md: '# # Panel Ploys


    The KDE panel starts out with a default assortment of buttons that provide one-click
    access to several useful utility programs. But the odds are that those buttons
    don’t represent the programs and utilities that you use the most. You need to
    replace the default button selection with buttons you can use to launch the programs
    you use every day.


    Only after you customize the panel with buttons for your favorite programs does
    the panel begin to live up to its potential for making your day-to-day computer
    use faster and easier. Fortunately, adding and rearranging panel buttons are among
    the fastest and easiest KDE customization tasks.


    # ## Adding buttons to the panel


    KDE makes it very easy to add buttons to the panel. If you can access a program
    from the KDE menu, you can add its button to the panel. (To find out how to add
    a program to the KDE menu, see the “Adding Applications to the KDE Menu” section
    in this chapter.) To add an application button to the panel, follow these steps:


    +   1. Click the KDE Menu button and then choose Panel Add Application.

    +   KDE displays a submenu that duplicates the menu structure of your main KDE
    menu.


    +   2. Choose the application that you want to add from the submenu.

    +   For example, to add a button for the Reversi game to the panel, the full menu
    selection is: KDE Menu Panel Add Application Games Reversi. The new button appears
    on the panel between the desktop buttons and the clock.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_118_0.png)


    The Windowlist and Disk Navigator buttons have their own separate menu commands
    that you can use to add or remove those buttons on the panel. Choose KDE Menu
    Panel Add Windowlist to add the Windowlist button to the panel. Choosing the command
    again removes the button. Similarly, you can use the Add Disk Navigator command
    to add or remove the Disk Navigator button.


    # ## Rearranging panel buttons


    If you don’t like the arrangement of the buttons on the KDE panel, move ‘em. It’s
    easy to do. Here are the simple steps for moving a panel button:'
  merge: -1
  img_proc: true
- pgno: 119
  md: '1. Right-click the panel button and choose Move from the pop-up menu that appears.

    The pointer changes to a four-headed arrow.


    2. Move the mouse to drag the button around on the panel and then click the mouse
    button to drop the button in its new location.

    KDE automatically rearranges other buttons on the panel, scooting them over to
    make room for the button you moved.


    +   To remove a button from the panel, right-click the panel button you want to
    delete and choose Remove from the pop-up menu that appears. KDE deletes the button
    from the panel immediately.


    # Docking maneuvers


    Some applications have the capability to dock in the panel — that is, an icon
    for the application appears in a special part of the panel next to the clock.
    Figure 5-6 shows several icons in the dock area. Usually, the docked application
    is really a mini-application (called an applet) that needs to run in the background
    but remains accessible.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_119_0.png)'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'Docking ability must be programmed into utility, because it''s not something
    you can control. Normally, a program places an icon into the panel dock automatically
    after you start the application. KNotes and the KOrganizer Control Applet are
    examples.


    Sometimes docking is an optional feature of a program or utility, and you invoke
    it by selecting an option in a dialog box. For example, if you select the Dock
    into The Panel option in the lower-left corner of the Background tab of the Display
    Settings dialog box, KDE adds the Display Settings icon to dock. To open the Display
    Settings dialog box, you simply click the icon in the dock.


    # Adding Applications to the KDE Menu


    Unquestionably, the most versatile button on the KDE panel is the KDE Menu button.
    Other panel buttons enable you to launch individual programs and utilities. The
    KDE Menu button, on the other hand, enables you to launch any of the many programs
    that are installed on the menu. That''s one powerful button.


    The KDE menu comes preconfigured with menu items for all the standard KDE components.
    Other KDE-aware programs automatically add themselves to the KDE menu after you
    install the program. That means that most, if not all, of your KDE-specific programs
    are available on the KDE menu. However, you undoubtedly have other programs installed
    on your Linux/UNIX system that deserve a place on the KDE menu as well. After
    all, the KDE menu can''t fulfill its promise as your one-stop command center for
    starting applications unless the KDE menu includes all your applications.


    Like nearly everything else on the KDE desktop, you can customize the KDE menu
    to adapt it to your own needs. You can add and delete menu items and submenus
    and you can rearrange the menu to suit your preferences.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_120_0.png)


    If you have already created a desktop icon or other `.kdnk` file icon to launch
    an application, you can simply drag that icon from the desktop or from a KFM window
    and drop it on the KDE Menu button in the panel. KDE immediately adds the new
    menu item to the Personal submenu to launch that application. Later, you can use
    the Menu Editor to move the menu item to another location on the KDE menu.


    # Adding applications automatically


    After you first install KDE, the idea of having to manually add a long list of
    your non-KDE programs to the KDE menu may seem like a daunting task. Fortunately,
    the KDE developers anticipated this scenario and created a utility program that
    will do the job for you automatically. Here''s how:'
  merge: -1
  img_proc: true
- pgno: 121
  md: '+   1. Click the **KDE Menu button** and choose **System** **Appfinder**.


    KDE opens a Terminal window and runs a script that scans your system looking for
    a long list of known applications. Depending on the size and speed of your system,
    the process can require anywhere from a few seconds to a few minutes. The Appfinder
    utility creates a Personal submenu on the KDE menu and automatically adds menu
    items to that submenu for the applications it finds on your system.


    That’s all there is to it. One simple step and you’re done!


    Appfinder may not find every executable program on your system, but it does a
    pretty good job of locating most of the standard inventory of applications included
    with the popular Linux distributions. After running Appfinder, you should be left
    with a fairly short list of applications that you need to manually add to the
    KDE menu.


    # ### Manipulating menus with the menu editor utility


    The Appfinder utility is a fast and easy way to add applications to the KDE menu,
    but it doesn’t provide any opportunity to really customize the menu. For that,
    you need to use the KDE Menu Editor utility. With it, you cannot only add applications
    to the menu, you can also add submenus and rearrange menu items. Menu Editor gives
    you complete control over the contents and arrangement of the KDE menu’s Personal
    submenu and lets you make some changes to the KDE default menu as well.


    To open the KDE Menu Editor utility, use the following technique:


    +   1. Click the **KDE Menu button** and choose **Panel** **Edit Menus**.


    The Menu Editor window appears. Two menus appear in the window. The one on the
    left is the Personal submenu and the one on the right is the KDE Default menu.
    The standard menu items that appear at the bottom of the KDE menu (Disk Navigator,
    Panel, Lock Screen, and Logout) do not appear in the Menu Editor window because
    those items are permanent parts of the KDE menu and you can’t edit them.


    As you work with the Menu Editor, keep the following factors in mind:


    > > * Click a submenu name to open or close the submenu.

    > > * Pointing to a menu item or submenu causes it to look like a raised button.
    This indicates the item that will be changed or the location where a new item
    will be inserted.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Right-click a menu item or submenu to pop up a menu of commands you can use
    on that item.


    # **Building your own menus**


    You can use Menu Editor to add submenus to the Personal menu and to its submenus,
    but not to the KDE default menu. To add a submenu, follow these steps:


    +   1.  **Right-click anywhere on the Personal menu and choose New from the pop-up
    menu that appears.**

    +       A KMenuEdit dialog box appears

    +   2.  **Select SubMenu in the Type drop-down list box.**

    +       The unneeded options in the lower half of the dialog box disappear.

    +       You can use this same technique to create a new menu item for an application.
    In that case, you''d probably need some of those lower options. But these options
    don''t apply to submenus, so they disappear after you choose the SubMenu type.

    +   3.  **Click the Name text box and type a name for the new submenu.**

    +       This is the menu name that appears in the KDE menu.

    +   4.  **To specify an icon for the submenu, type the icon''s filename in the
    Icon text box.**

    +   5.  **Type an alternate description in the Comment text box.**

    +       This is the text that KDE displays in the pop-up Tooltip, which appears
    if you point to the submenu without clicking it.

    +   6.  **Click OK.**

    +       The Menu Editor closes the dialog box and adds the new submenu to the
    Personal menu in the Menu Editor window. You can click the submenu name to open
    the new submenu.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_122_0.png)


    # **Adding applications with KFM**


    You can add applications to the KDE menu by simply dragging icons from a KFM window.
    Here''s how:


    +   1.  **Open the Menu Editor window and display the contents of the menu and
    submenu where you want to add a new menu item.**

    +       You may need to open one or more submenus to get the target location of
    the new menu item visible. Move the Menu Editor window and/or the menus within
    the Menu Editor so that the target submenu won''t be obscured by the KFM window
    that you open in the next step.

    +   2.  **Open a KFM window and position it so that the target submenu is visible
    in the Menu Editor window.**'
  merge: -1
  img_proc: true
- pgno: 123
  md: '+   3. **Display the application file in the KFM window.**

    +      Navigate through the directory structure to display the filename and icon
    for the application''s executable file.

    +   4. **Click and drag the file from the KFM window and drop it on the target
    submenu in the Menu Editor window.**

    +      The filename appears as an entry on the submenu in the Menu Editor window.


    # **Rearranging menus**


    In addition to adding applications to the KDE menu, you can rearrange the menus
    to change the order of the items on a submenu, move items from one submenu to
    another, and delete submenus and menu items.


    +   ‹ To move a menu item within the same submenu, right-click a menu item (or
    submenu) and choose **Select Item For Moving** from the pop-up menu that appears.
    After the **cross-hair cursor** appears, use it to drag the selected item up or
    down the submenu list and drop the item in its new location. Menu Editor moves
    the other menu items to make room.


    +   ‹ To delete a menu item, right-click a menu item or submenu and choose **Delete**
    from the pop-up menu that appears. Menu Editor removes the item from the menu.
    If you Delete a submenu, you also delete its contents.


    +   ‹ To move a menu item from one submenu to another, right-click a menu item
    you want to move and choose **Cut** from the pop-up menu that appears. Then open
    the submenu to which you want to move the item, right-click the submenu where
    you want to insert the item, and choose **Paste** from the pop-up menu that appears.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_123_0.png)


    After editing your KDE menu with the Menu Editor, don''t forget to save your changes
    before closing the Menu Editor window. Choose **File→Save** or click the Save
    button on the Menu Editor toolbar.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# ## Chapter 6

    # Desktop Design


    # **In This Chapter**


    +   - Redecorating your desktop

    +   - Having fun with screensavers

    +   - Sounding off with system sounds

    +   - Language lessons for KDE keyboards


    Most people like to customize their office environment with personal touches of
    some kind.


    Most people? What are we saying? Everybody does it! If you walk down the hall
    and find an occupied office or cubicle that doesn''t have at least some personalized
    decorations, check the occupant''s pulse.


    KDE caters to this universal need to customize and control our environment by
    providing plenty of ways to tailor the KDE desktop to individual tastes and preferences.
    You can change the color of almost everything on the desktop, and you can select
    the sounds associated with various actions. You can customize the keyboard to
    work with your native language, and you can change the position of the buttons
    in the window titlebars. This chapter shows you how to do all of these things
    and more.


    # ## Redecorating the Desktop


    Wouldn''t it be nice if you could change the color of the walls in your office
    to fit your mood? While you''re at it, you could plop down some new carpet, move
    in a different style desk, and replace all your desk accessories. When you''re
    feeling like a traditionalist, you could surround yourself with hand-rubbed mahogany
    wood furniture and then switch instantly to a high-tech industrial style after
    you wake up from the dream (or was that a nightmare).


    Unless you have a magic wand (and an unlimited budget), such changes aren''t possible
    in the real world. But changes are possible in the virtual world of your computer
    desktop. KDE not only enables you to customize nearly'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'every aspect of your desktop, the changes are so quick and easy to do that
    you can completely redecorate your desktop on a whim, anytime the mood strikes
    you.


    # ## Designing desktop color and wallpaper


    KDE provides you with many ways to customize your desktop environment. Perhaps
    the single most striking change you can make is to select a different background
    for the KDE desktop. You can select a solid color, a two-color gradation or pattern;
    or you can use an image file to create the computer equivalent of wallpaper. If
    you choose the wallpaper option, you can use a single large image to cover your
    desktop, such as a mural (as shown in Figure 6-1), or you can repeat a smaller
    image many times to create a pattern.


    To adjust your desktop background settings, follow these steps:


    +   1. Right-click the desktop and choose Display Properties from the pop-up menu
    that appears.


    KDE opens the Display Settings dialog box. Normally, the Background tab is selected
    by default. If not, click the Background tab to display the options shown in Figure
    6-2.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_125_0.png)'
  merge: -1
  img_proc: true
- pgno: 126
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_126_0.png)


    **Figure 6-2:** The Background tab of the Display Settings dialog box gives you
    lots of options.


    You can also access the same Background settings by choosing KDE Menu->KDE Control
    Center to open the KDE Control Center dialog box and select Desktop and then Background
    in the list box on the left side of dialog box. The Background tab then appears
    on the right side of the KDE Control Center dialog box.


    +   2. Select a **desktop name** in the Desktop list box or select the **Common
    Background** checkbox.


    If you select a specific desktop, all the other settings on the Background tab
    will apply to that desktop and not to the other desktops. This enables you to
    create separate backgrounds for each desktop. If, on the other hand, you select
    the Common Background option, the background settings will apply to all the desktops
    — all your desktops will be identical.


    +   3. Select **One Color** or **Two Color** in the Colors area.


    Select **One Color** to create a desktop background that is all one solid color.
    Select **Two Color** to create a graduated background effect that blends from
    one color to another or a two-color pattern. If you select the Two Color option,
