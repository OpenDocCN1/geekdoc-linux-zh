    # Finding Lost Files


    KFM can do an admirable job of managing any files you can display in a KFM window.
    However, locating a certain file in the complex directory structure of a typical
    Linux/UNIX system can be a real challenge. If you don''t know where a file is
    located, the maze of nested directories-within-directories can make finding that
    file manually (by opening every directory in a KFM window and scanning its contents)
    an exercise in frustration.


    But what is impractical (if not impossible) to do manually, the Find Files utility
    can do automatically. Find Files can methodically search through your file system
    looking for a given file specification and then display a list of the matches
    it finds.


    To use the Find Files utility, follow these steps:


    +   1.  Open the KDE menu and choose Utilities>>Find Files.


    The Find Files window appears as shown in Figure 4-15.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_105_0.png)


    +   2.  Type a file specification in the Named box.


    You can enter a specific filename or use wildcards (* and ?) to define a search
    specification that may match multiple files.'
  merge: -1
  img_proc: true
- pgno: 106
  md: '+   3. **Type the path name in the Look In box.**

    +   Enter a path name for a single directory or *define the highest level of a
    directory tree branch* that you want to search. To search the entire file system,
    enter the slash character (/).


    +   4. **Select (or clear) the Include Subfolders option.**

    +   As you probably guessed, this option controls whether Find Files confines
    its search to the specified folder or extends the search to all the subfolders
    as well.


    +   5. **If you need to further refine the search parameters, click the *Date
