- pgno: 317
  md: '# ## Lending a Hand


    Now that you have ten sources of help, here are two bonus resources that flow
    in the other direction. If you are interested in contributing to the KDE project,
    there are several other ways you can help.


    +   The KDE team welcomes contributions from programmers, artists, multi-lingual
    translators, and people with a variety of other skills. Start out by looking through
    the project list at www.kde.org/jobs.html. You can also browse the archives of
    some mailing lists that focus on particular aspects of the project: kde-artists,
    kde-look, or k-devel are good places to start.


    +   If you don''t program or can''t find something to do, but you still want to
    help, consider making a donation to defray some of the costs involved in keeping
    the KDE project going. The software will likely always be free and its code open
    source, but the Web site and hardware that support the development of KDE aren''t
    free. You can find out more about this kind of assistance at www.kde.org/support.html.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Chapter 17


    # Ten Cool Toys


    # In This Chapter


    +   ▸ Five business boosters

    +   ▸ Five fun programs and games

    +   ▸ One cool thing that’s not for your computer


    Now that you’ve spent a lot of time setting up KDE, tweaking configurations, and
    doing a good chunk of work, it’s time to play. (Yes, play! What good is a computer
    if it doesn’t make you smile once in a while?) If you’re not up for sharing your
    crayons, at least organize your work habits so that you have that time to goof
    off later.


    One of the great things about using open source software is that many people concentrate
    their contributions on small programs. These programs can be games, information
    gatherers, helpers for your work habits, or themes for your desktop. Themes get
    their very own section of this book in Chapter 18, which focuses on the other
    small programs that make using KDE easy and fun.


    The ten programs described in this chapter are included on the CD at the back
    of this book.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_318_0.png)


    Because KDE itself is so new, third-party programs written for KDE are also new.
    Most of the programs described here, and those available in KDE file archives
    on the Internet, are beta software. This means that they may not work on your
    machine or that they may crash. As KDE grows more robust, so will the programs
    written for it.


    # KDE Keeps You Working


    Use a few of the business-related KDE programs to automate things you do every
    day. You can save some time if you let your computer find certain information,
    and you can simplify a complicated process by installing a program that does only
    one thing — but does it well.'
  merge: -1
  img_proc: true
- pgno: 319
  md: 'Here are five small work-related KDE programs to get you started. If you want
    to find more, look at some of the sites listed in Appendix B for programs released
    after the printing of this book.


    # ## WebMaker


    Do you want to create good-looking and professional Web pages without having to
    code each and every HTML tag by hand? If so, you might benefit from a full-featured
    HTML editor like WebMaker. WebMaker has an attractive GUI interface and helps
    you keep track of your HTML tags with color coding and a nested layout. It previews
    all your image tags to make sure you''re calling the right image file. Best of
    all, it''s fully HTML 4.0-compliant, which means it meets the rigorous guidelines
    of the latest HTML standard.


    Interested in WebMaker? There''s more information at the program''s Web page —
    created in WebMaker, of course:


    www.services.ru:8101/linux/webmaker/


    # ## KStocks


    A lot of investors like to keep right on top of their portfolio, checking stock
    prices and news throughout the day. KStocks brings some organization to that habit,
    letting you select up to 30 stocks to check at the same time. KStocks compares
    the stocks you enter against a Web stock ticker like the one offered by Yahoo!,
    imports the data, and displays it to you as a chart.


    Learn more about KStocks and keep up with new versions at its home page:


    http://mitglied.tripod.de/AndreasWuest/kstocks/indexstocks.html


    # ## KPIlot


    If you''re a techno-gadget kind of person, you probably carry a PalmPilot everywhere.
    However, you''ve probably noticed that Palm Desktop and HotSync software is primarily
    a Macintosh and Windows thing. No longer: Now there''s KPIlot. KPIlot HotSyncs
    maintains your Palm Desktop calendar and contacts and runs under KDE. It even
    looks like Palm Desktop.


    Be sure to check out the nifty animation on the first page of the KPIlot Web site:


    www.s1ac.com/p1one/kpilot_home/'
  merge: -1
  img_proc: true
- pgno: 320
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_320_0.png)


    Like all programs in active development, there are some things that Kpilot doesn''t
    quite have right yet. You may feel more comfortable using a development version
    with a personal Pilot, rather than a corporate palmtop. The developer lists all
    known bugs on the Web site; you can also download patches and updated versions
    there.


    # Kuickshow


    Nothing is more frustrating than having a bunch of graphics files on your computer
    yet not remembering what each file depicts. (Especially if you didn''t give them
    clear names when they were saved) Kuickshow is a handy utility that displays your
    graphics files. It has some basic graphic editing capabilities, its own file manager,
    and intelligent resizing for display. You can choose to show the files in a desktop
    window, or you can view them against a black background in full-screen mode.


    Check out the Kuickshow Web page:


    http://www.millennix.de/kuickshow.html


    # Empath


    If you work with Microsoft products at your office or home (as well as at your
    Linux machine, of course), you may rely on Outlook to handle your e-mail. Empath
    is a fully configurable KDE program that handles your e-mail in a format just
    like the Outlook interface. You can change almost everything about Empath''s appearance;
    you can have it run just the way you like.


    The Empath home page is here:


    http://without.netpedia.net/empath.html


    # Are We Having Fun Yet?


    Whether it''s because they''re easier to write or because the world just needs
    to have more fun, entertainment programs are extremely popular among the KDE developer
    community. Here are five toys that will occupy your time in a most pleasant manner.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# KVoicecontrol


    If you’re interested in speech-recognition software, whether for fun or for physical
    accessibility, KVoicecontrol allows you to try this powerful new interface on
    your KDE box. Attach a microphone to your machine, configure KVoicecontrol, and
    start talking. The current version supports only standard UNIX commands; with
    time, it may become robust enough to handle full speech input. For now, it’s an
    interesting and different way to run your system.


    To learn more about KVoicecontrol, visit its home page:


    > www.kiezca.de/daniel/kde/


    # KFortune


    One of the traditional UNIX entertainment programs is a fortune-telling program.
    KFortune is the KDE version of fortune. Every time you run KFortune, it displays
    a random quote from its messages file. You can edit the messages file to include
    your favorite quotes, whether inspirational or just downright funny.


    Visit the KFortune Web page:


    > www.fys.ruu.nl/~eendebak/kde/kfortune.html


    # Katchit


    Do you like to play small games that don’t take over your entire desktop? Do you
    enjoy chasing penguins? If you answer yes to either of those questions (if you
    answered yes to the second one, don’t worry — we’ll never tell), give Katchit
    a whirl. Katchit is a cute little game in which you have to reach Tux, the Linux
    penguin, before you’re caught by whirling enemy beings. It requires the QwSpriteLibrary,
    which is also included on this book’s CD.


    Learn more about Katchit at its Web page:


    > http://perso.club-internet.fr/p_george/katchit.html'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'Is the multimedia content of the Internet just not enough sensory input for
    you? Do you long to watch television at the same time you''re surfing the Web
    or playing video games? If so, KwinTV is your application, you multitasking genius.


    If you have a TV card in your computer that''s supported by a *video4linux* driver,
    you can run KwinTV, which places a small television window on your desktop and
    pipes TV straight into your computer. It also gives you an easy way to create
    screen and audio capture files. It even supports an infrared remote control if
    you install the right packages.


    Learn more about KwinTV at its home page:


    www.mathematik.uni-kl.de/~wenk/kwintv/what.html


    KWebwatch is a neat little utility that scans the Web for pages you''ve selected.
    When it finds that a page has updated, it moves that page to the top of its list
    and highlights it. Using KWebwatch means that you don''t have to waste a lot of
    time reloading pages to see if anything has been changed since the last time you
    looked.


    The KWebwatch Web page is found here:


    http://personal.atl.bellsouth.net/atl/s/h/shuttoon/kwebwatch.html


    # Tell the World that You Love a Dragon


    The last item in this chapter isn''t a program. In fact, it''s not even something
    that you can load onto your computer. Instead, it''s a way to show the world that
    you''re a KDE fan. (It''s also the only KDE-related thing in this book that you
    have to pay for, but it''s so cool that we couldn''t resist.)


    What could this strange thing be? KDE clothing, of course. MieTerra has available
    two official KDE T-shirts at its online store (www.mieterra.com/cgi-bin/store/web_store.cgi).
    At the time this book was printed, each preshrunk 100% cotton shirt cost $14.99
    U.S. plus shipping and handling.'
  merge: -1
  img_proc: true
- pgno: 323
  md: 'The best part about buying a KDE shirt from MieTerra is that the company donates
    half the purchase price to the KDE project. Such a good deal: Get a great-looking
    shirt and support your favorite desktop at the same time!'
  merge: -1
  img_proc: true
- pgno: 324
  md: '# Chapter 18


    # Ten Great Themes


    # In This Chapter


    +   - Soothing themes for nature lovers

    +   - Industrial themes for the mechanically inclined

    +   - Dark themes for lovers of the macabre


    If you get in the mood to do a little redecorating in your home or office, you
    may start your project by perusing some magazines for ideas before heading out
    to the paint and wallpaper store for supplies. Without that advance preparation,
    the vast array of colors and decorating treatments that are available can easily
    overwhelm you. Similarly, this chapter provides a sampling of the many great KDE
    themes that you can find online (and on the CD included with this book), so that
    you can get an idea of the range of effects you can achieve by applying themes
    to your KDE desktop environment. Use the illustrations presented here to help
    you select a theme that you may want to use, or to get ideas for creating your
    own theme by combining elements from several themes.


    All the themes shown in this chapter are available on the CD included with this
    book. You can also find all these themes, and many more besides, at the Themes.org
    Web site (http://kde.themes.org).


    # Are You Ready for the Arctic?


    The Arctic theme (shown in Figure 18-1) features a cool, light blue color scheme
    and a full-sized photo of arctic scenery for your desktop wallpaper. The titlebar
    buttons exhibit clean, simple graphic designs, which contrast with the heavy snowcap
