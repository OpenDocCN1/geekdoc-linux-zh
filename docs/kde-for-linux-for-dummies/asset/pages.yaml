- pgno: 155
  md: '# Creating your own themes


    Creating a theme from scratch isn''t exactly rocket science, but it isn''t a simple
    process either. Designing window borders, buttons, and icons to use in a theme
    requires tedious work with the KDE Icon Editor program on numerous files. The
    only effective way to build a theme configuration file is by hand-editing a template.
    Then you need to gather all the components of the theme together and package them
    into a compressed archive file to create a theme you can use with Theme Manager.


    Creating a theme by assembling components from other existing themes is somewhat
    simpler than building a new theme from scratch. However, as of this writing, creating
    a theme still requires hand-editing the theme configuration file and then assembling
    all the theme components into a compressed archive file with a utility such as
    Archiver. Again, this assembly is beyond the scope of this book. But the process
    should be getting easier soon. Plans are for Theme Manager to be able to create
    a new theme by saving your current desktop configuration. Who knows, by the time
    you read this, the feature may even be working in a new version of Theme Manager.
    One of the great things about KDE is that it''s constantly being updated and enhanced
    by the army of developers working on the project.


    The whole process is sufficiently complicated so that it''s beyond the scope of
    this book. However, if you''re really interested in creating themes and determined
    to give it a try, you can find some information on the Themes.org Web site that
    can get you started. Go to the http://kde.themes.org site and follow the links
    to Documentation and the KDE Guide, and then peruse the section on creating themes.


    Using a theme that emulates the look of another window manager is only a superficial
    change. For a UNIX command-line veteran, no GUI can completely replace the power
    of the command line. But never fear, KDE offers two command-line windows — Console
    and KVT — that give you instant access to the Linux command prompt. The default
    installation even includes a panel button for convenient one-click access to Console.'
  merge: -1
  img_proc: true
