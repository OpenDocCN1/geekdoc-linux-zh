  md: '# KDE For Linux® For Dummies


    # Cheat Sheet


    # Standard Keyboard Shortcuts


    To do this:


    Press this key combination:


    +   * Close the window  Ctrl+W

    +   * Copy selected text or object to the clipboard  Ctrl+C

    +   * Create a New document or file  Ctrl+N

    +   * Cut the selected text or object and place it on the clipboard  Ctrl+X

    +   * Move cursor to the beginning of the current document.  Ctrl+Home

    +   * Move cursor to the end of the current document  Ctrl+End

    +   * Open the file Open dialog box  Ctrl+O

    +   * Open the Find dialog box or feature  Ctrl+F

    +   * Paste the contents of the clipboard into the current document at the cursor
    location  Ctrl+V

    +   * Print the current document  Ctrl+P

    +   * Quit the current document or application  Ctrl+Q

    +   * Save the current document or file  Ctrl+S

    +   * Scroll to the next page  PageDown

    +   * Scroll to the previous page  PageUp

    +   * Undo the last operation  Ctrl+Z


