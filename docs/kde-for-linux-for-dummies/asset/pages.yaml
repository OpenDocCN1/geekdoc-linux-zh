  img_proc: true
- pgno: 104
  md: '3. **Right-click the application icon and choose Properties from the pop-up
    menu that appears.**

    A dialog box appears where you can edit the properties of the application link.


    4. **Click the Application tab.**

    The settings shown in Figure 4-14 appear. The links between the application and
