- pgno: 244
  md: '# Chapter 12


    # Working with Non-KDE Applications


    # In This Chapter


    +   KDE versus non-KDE: What’s the difference?

    +   Utilizing the top four non-KDE applications

    +   Running programs that aren’t on the KDE menu

    +   Running text-based programs

    +   Adding non-KDE programs to the panel

    +   Keeping KDE from muscling in on other programs


    Although you can find tons of programs written specifically for KDE, you’re being
    happy running nothing but KDE-specific programs from now until the end of time
    is unlikely. Two major types of non-KDE programs are covered in this chapter —
    graphical programs written for the general Linux platform and text-based programs
    written for the original nongraphical UNIX and Linux environments.


    Many of the programs mentioned in this chapter have been covered more closely
    in other chapters of the book (peek at the Index to see exactly where). We’re
    not planning to give you the absolute rundown on Netscape, StarOffice, or pico
    here. Rather, we want to give you an understanding of the difference between programs
    that are written specifically for KDE and programs that are not, and when that
    distinction may matter.


    # So, What’s the Difference?


    Here’s the difference between using a KDE program versus a non-KDE, in a nutshell.
    (Almond, if you were wondering.) KDE applications are programs that were written
    with KDE specifically in mind. That is, some programmer sat down and said, “You
    know, the KDE world needs a program that calculates the mileage you’ve put on
    your mouse,” and thus Mousespedometer was born.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '(Don''t believe us? Look on the KDE menu, under Utilities::Mousepedometer.)
    More practically, developers may think that they have a better idea for an office
    suite of applications than what''s available already. That''s how KOffice, a KDE
    application, got started (you can learn more about KOffice in Chapter 10).


    KDE applications have a unique look and feel. After you open a series of KDE applications
    on your desktop, the windows all look similar: same titlebar, same kind of menu
    bar, and so on. Even the help pages are standardized across most KDE applications.
    KDE developers pay pretty close to the accepted visual standards for their programs,
    so that you get a consistent "feel" as you use multiple KDE programs.


    Non-KDE programs, however, don''t share that feel. A non-KDE program is simply
    one that wasn''t originally written to run under KDE. The program can be a Linux
    version of a popular program, such as Netscape. If you download and install Netscape,
    you won''t find a special KDE version. You just grab the latest Linux version
    and get going. The program can also be a standard UNIX application, such as the
    text editor, emacs. Emacs looks about much the same no matter what platform it
    runs on: emacs is not a graphical program, so it doesn''t need to be reworked
    for the KDE platform.


    To reiterate, the distinction between KDE programs and non-KDE programs is small.
    The biggest difference is in the look of the program window. Non-KDE programs
    don''t automatically get an icon in the panel, although you can easily make one.
    Don''t let the lack of a A stop you from installing non-KDE software, though.
    If the program runs on Linux, it runs on your KDE box.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_245_0.png)


    This seems like a good time for a reminder that KDE is a graphical interface to
    a regular Linux environment. You''re not running a special distribution of Linux
    called KLinux, you''re running Red Hat, Debian, Yellow Dog, or Corel distributions
    of the Linux operating system, and then using KDE as your desktop. If you find
    a Linux program that you want to run, installation is easier if you can find a
    package tailored to your distribution, but it doesn''t matter whether you plan
    to run the program with KDE or in text mode. The Linux operating system doesn''t
    care.


    # Our Four Faves


    You probably notice that, throughout this book, we mention several non-KDE programs.
    In some cases — The GIMP and Netscape, in particular — we go a little overboard
    and talk about them a lot. Because this chapter is concerned with programs written
    for a general Linux environment, this is a good place to showcase those programs,
    let you know where to get the programs, and explain why we love them so. The next
    section of this chapter explains how to run these non-KDE programs and how to
    install the programs into your panel.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Netscape


    Netscape is, hands down, the best Web browser for Linux. Sure, you have times
    where you want to use KFM over Netscape, especially if you''re downloading files.
    Still, Netscape is the way to go for general Web browsing needs. As you see in
    Figure 12-1, Netscape looks the same in KDE as it does on Windows or on a Macintosh.
    Just as KDE programs have a consistent feel, Netscape feels the same across platforms.


    We figure that, if you''ve used the Web in the last three or four years, you know
    about Netscape. If you''ve managed to live this long without it (either because
    you''ve been running Microsoft Explorer or you''ve been browsing in text-mode
    with Lynx), you can find out more about Netscape, or download Linux versions,
    at www.netscape.com.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_246_0.png)


    +   Figure 12-1:

    +   With its familiar look, you have a hard time telling what platform Netscape
    is running on.'
  merge: -1
  img_proc: true
- pgno: 247
  md: 'If you don''t want to run Netscape for some reason, you have two other alternatives
    besides KFM.


    +   Lynx is the text-based UNIX Web browser; you won''t see the pretty pictures
    or the advanced graphics, but Lynx is fast, and you get the information you need.
    Not all Web pages are Lynx-compatible, unfortunately. You still need to have a
    graphical browser available for those cases. Most Linux distributions include
    a package for Lynx; check your directories to see if you have it installed already.
    If not, you can certainly obtain Lynx from just about any UNIX file archive on
    the Internet.


    +   Opera is a newer browser from Scandinavia. Opera is not free (the license
    fee is $35), and it''s not yet available for Linux (although a development team
    is working busily to get it to your desktop); but it has an interesting slant
    on the Web. Opera only displays pages that are wholly compliant with the HTML
    standards set by the WWW3 Consortium. This means that you won''t see pages that
    are improperly coded. (The drawback, of course, is that your favorite site may
    code badly — it''s a trade-off you have to be ready to make.) Find out more at
    www.operasoftware.com.


    # The GIMP


    If you read Chapter 11, you know we''re high on The GIMP. A full-featured graphics
    program, The GIMP gives high-quality results and is free. You can use The GIMP
    for everything from touching up photographs to creating your own anime-style illustrations.
    Professional graphic designers use The GIMP, as do ordinary schlubs like us. The
    basic GIMP window is shown in Figure 12-2, but it''s impossible to show all the
    program''s features in one look.


    The GIMP''s Web page is located at www.gimp.org; you find FAQs, downloads, and
    much more. You also find an art gallery of unbelievable complex images created
    with The GIMP. If you''re interested in Linux-specific info, you can even find
    a link to the how to draw Linux, the Linux penguin page. (Useful if you ever want
    to get a Tux tattoo. Don''t laugh — we know someone who has one.)


    Mystified by The GIMP? Don''t worry — most folks are, at first glance. We strongly
    recommend that you pick up a good reference guide if you plan to do much work
    in this program. The GIMP for Linux Bible, by Stephanie Cottrell Bryant from IDG
    Books Worldwide, is a good place to start.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_248_0.png)


    Figure 12-2:


    The GIMP is so powerful, it’s hard to believe that it’s free.


    # StarOffice


    KOffice, the KDE office suite, is covered in Chapter 10. KOffice is a great suite
    of office applications with lots of options; however, KOffice is still very young,
    and not all the bells and whistles are fully functional yet. (The developers even
    warn you not to use some of the applications for critical materials yet, given
    their stage of development.) So, what’s a Linux-lover to do for an office suite
    if you need something stable and integrated? We suggest giving StarOffice a try.


    StarOffice is an integrated office suite, originally developed by StarDivision
    GmbH of Germany and now owned by Sun. The suite includes a word processor, a database
    program, a spreadsheet, a presentation/slideshow program (shown in Figure 12-3),
    an organizer and calendar, and an e-mail client. StarOffice was originally written
    for Linux, but recently expanded to the Windows platform (isn’t it nice to see
    platform expansions going in the other direction for once?).


    ![](img/8dd43d91b80664e771e0c0a824d7392d_248_1.png)


    We admit that we’re biased — all three of us as authors have written about StarOffice,
    and naturally we think our books are pretty darn good references on the subject.
    If you’re curious about running this office suite, we humbly suggest *StarOffice
    5.1 for Linux Bible* or *StarOffice For Linux For Dummies*, both published by
    IDG Books Worldwide.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 224


    Part III: Getting Down to Business


    ![](img/8dd43d91b80664e771e0c0a824d7392d_249_0.png)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_249_1.png)


    Okay, so maybe you''re not interested in StarOffice. You need an office suite
    that includes programs your boss has heard of in order to convince her that you
    can run Linux at work and still coexist happily with the Microsoft and Mac users.
    By the time this book is published, the WordPerfect Suite 2000 for Linux should
    be available from Corel. This suite is the Linux version of the wildly popular
    WordPerfect Suite 2000 for those other operating systems, and will include WordPerfect,
    QuattroPro, Presentations, and Paradox.


    # RealPlayer


    As recently as two or three years ago, thinking that someday local radio and TV
    stations would be able to broadcast worldwide via the Internet was a nice fantasy.
    With the advent of streaming technology, that fantasy has come true in an explosive
    way. (In fact, the soundtrack to this chapter is WFMT, the Chicago classical radio
    station that Kate listened to in college; even though she''s 2,000 miles away,
    the magic of streaming audio brings Chicago traffic reports to her desktop.)


    RealPlayer is a wonderful program that handles all sorts of input. You can use
    it to listen to streamed audio (as in Figure 12-4), watch video clips, or just
    listen to sound files stored in the .mp3 format. Visit the RealPlayer Web site
    at www.real.com to learn more.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_250_0.png)


    Figure 12-4: Use RealPlayer to listen to your college radio station at your desk.


    **REMEMBER** You need a sound card and speakers in order to process audio files
    properly. For streamed audio and video, you also need a fast and reliable connection
    to the Internet. A 56K modem is considered somewhat slow for streamed files; you
    need a larger buffer if you''re listening over a dial-up 56K link. Far better
    is a cable modem, DSL, or ISDN connection. These full-time connections over a
    separate cable make streaming files a pleasure.


    # Waiter, Where''s the Program I Ordered?


    If you''re new to Linux, you may be befuddled by the KDE menu system. Even if
    you have installed all the programs in the previous section of this chapter, the
    programs won''t automatically appear in the KDE menu. This can be a shock for
    folks used to the Windows 95 or 98 installation process, which almost always includes
    the query "Include program icon in Start Menu?" But fear not -- you can easily
    get to all the other great programs that you''ve installed. You even have a couple
    of choices for starting the programs or a way to avoid the choice altogether.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# # File manager launches


    You can always start your programs from KFM, whether programs are KDE or not.
    If you know the location of the file in the directory structure, open KFM and
    navigate to the file. After you find the file, start the program by simply double-clicking
    on the filename. Figure 12-5 shows the KFM method of starting StarOffice.


    If you don''t know where the program lives on your hard drive, use the handy Find
    utility to locate it.


    +   1. **Click the Find icon in the panel.**

    +      The Find window appears.

    +   2. **Enter the program''s name in the text entry box of the Find window.**

    +      You only have to enter the program''s name, not a specific filename. Figure
    12-6 shows a search for RealPlayer.

    +   3. **Click Find.**

    +      The utility searches the hard drive and reports the file''s location.

    +   4. **Click the X at the right end of the titlebar to close Find.**


    ![](img/8dd43d91b80664e771e0c0a824d7392d_251_0.png)


    Figure 12-5:

    Locate the program in

    KFM and launch it

    easily.'
  merge: -1
