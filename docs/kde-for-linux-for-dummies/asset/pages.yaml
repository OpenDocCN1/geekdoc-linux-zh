  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_302_0.png)


    # Alt+drag to Move a Window


    Normally, to move a window on the KDE desktop, you simply click and drag the window''s
    titlebar with the mouse pointer. KDE deposits the window in its new location after
    you release the mouse button. But what if the window''s titlebar is inaccessible
    — hidden behind the taskbar or panel, or the window extends off the desktop —
    how do you move the window if you can''t drag the titlebar?


    If a window''s titlebar is inaccessible, you can press and hold the Alt key as
    you click and drag the mouse pointer anywhere on the window or dialog box you
    want to move. KDE moves the window, just as when you drag the titlebar. Release
    the mouse button to drop the window in a new location.


    This technique comes in especially handy if you need to use KDE on a lower-resolution
    display such as a laptop computer. Some of the standard KDE windows and dialog
    boxes are too large to fit on the screen at lower resolutions and you must move
    the window or dialog box around to bring options and buttons in different areas
    into view.'
  merge: -1
  img_proc: true
