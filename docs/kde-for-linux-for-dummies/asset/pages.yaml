  md: "+   5. **Click Test (Do Not Install).**\n+   \n+   This option lets the machine\
    \ perform a dry run through the installation procedure. It informs you if there\
    \ is a problem with the package. It's a good idea to use the test option so that\
    \ you don't accidentally cause system problems during a corrupted installation.\n\
    +   \n+   6. **If the test was successful, click Install.**\n+   \n+   Package\
    \ automatically performs the installation.\n+   \n+   7. **Repeat this process\
    \ for each package you want to install.**\n+   \n+   8. **Choose File > Exit after\
    \ you have finished working with KPackage.**\n\n# # It's a Server, It's a Workstation...\n\
    \nLike any operating system, Linux runs a lot of programs in the background, meaning\
    \ that you don't see windows or meters showing them in progress. These programs\
    \ include the mouse driver, a program that handles e-mail, network utilities,\
    \ and so on: all the little programs that keep your computer running properly.\n\
    \nBecause Linux is Linux, you have the ability to work with these programs and\
    \ decide how (or if) they run. That's all part of the UNIX philosophy! Not only\
    \ that, but you can select one of several ways for these programs to run and shift\
    \ between these ways as you need. It's highly flexible and configurable, and that's\
    \ one of the best reasons for choosing Linux in the first place.\n\nHow does this\
    \ all work? Through the magic of run levels. *A run level* is, in very simple\
    \ terms, a shortcut. That is, each run level can be defined to contain a certain\
    \ set of actions. When you invoke that run level, the actions contained within\
    \ it either start or stop. For the purposes here, that's a complete enough definition.\
    \ If you become enamored with run levels, you've moved beyond the scope of this\
    \ book and need to check out an intermediate Linux book.\n\nIn keeping with traditional\
    \ UNIX conventions, there are seven run levels. Run Levels 0, 1, and 6 have specialized\
    \ functions, while Run Levels 2, 3, 4, and 5 are levels that you can define. See\
    \ the “Run, level, run!” sidebar for specific information about each run level.\
    \ The most important Run Levels here are 3 and 5; they are the modes in which\
    \ most Linux computers run most of the time.\n\nRun Level 3 is a standard multiuser\
    \ mode that starts out in text mode. When you boot up and log in, you start out\
    \ at a command prompt. In order for graphical elements like KDE to begin working,\
    \ you need to start the X"
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Window System by hand. Run Level 5, however, invokes the X Window System when
    it boots up. If your first sight after booting up is a graphical login screen
    or KDE itself, you''re running in Run Level 5. (You need to know the difference
    between these two levels when reading Chapter 14 and the discussion of the graphical
    login screen.)


    # Run, run level, run!


    Although you could manually start and stop each individual function that Linux
    uses in operating your computer, it makes sense to automate the process as much
    as possible. Not only is it more convenient (and requires less typing), but using
    run levels guarantees that you won''t forget to start a critical process as you
    work through your list. Traditionally, each run level has a different function;
    in ordinary use, you don''t need to shift between them very often.


    **Note:** The run level functions described here are the standard functions for
    Red Hat Linux. They''re similar in all Linux systems. If you want to see how your
    distribution defines run levels, take a look at the file /etc/inittab. Do not
    edit inittab! Just look at it.


    Run Level 0 is a specialized level that puts the computer into shutdown mode.
    When this mode is invoked, all processes currently running close themselves. When
    the processes are completely stopped, Linux shuts itself down.


    Run Level 1 is another specialized level, this one defined as single-user mode.
    This level is usually used as a diagnostic mode when something is drastically
    wrong with the system. Run Level 1 starts the minimum number of functions, those
    necessary for the core operation of Linux, and lets you handle every other function
    manually. If you''re lucky, you''ll never need Run Level 1.


    Run Level 2 starts the computer in multiuser text mode, like Run Level 3, but
    does not start NFS (network file service). If you''re using a stand-alone machine,
    you won''t notice a difference because you don''t have a need for NFS. If you''re
    part of a network, Run Level 2 causes your machine to behave like a standalone
    without any network services available.


    Run Level 3 is one of the two standard run levels that you''re likely to use.
    Run Level 3 starts the computer in multiuser mode, but doesn''t start the X Window
    System. That is, you can operate everything on the machine that''s in text mode
    without doing anything else. If you need anything graphical, you need to start
    the X Window System by hand (or switch to Run Level 5).


    Run Level 4 is not currently designated for a particular purpose.


    Run Level 5 is the other standard run level that you''re likely to see. Like Run
    Level 3, Run Level 5 boots in multiuser mode. However, in 5, the X Window System
    starts automatically, so you need to use KDE terminal windows to get to text mode.
    This is the mode to use if you want KDE to start automatically when you boot up.


    Run Level 6 is the final level, and it''s another specialized one; this is the
    reboot level. Like Run Level 0, invoking this level causes all the running programs
    to close down; unlike Run Level 0, when the programs have stopped, Linux reboots
    itself and powers back up.'
  merge: -1
  img_proc: true
- pgno: 271
  md: "What if you want to add a certain function to a given run level? Perhaps you\
    \ want to have Linux installed on a machine that uses PCMCIA cards to provide\
    \ certain devices. (PCMCIA cards are those small, heavy cards that many laptops\
    \ use for modems; they also can be used for networking and for extra hard drive\
    \ space.) Because you use a PCMCIA card to handle your network needs, you want\
    \ to make sure that the pcmcia configuration script runs automatically at bootup.\
    \ You boot in Run Level 3, so you want to add the pcmcia script to that level.\n\
    \n+   1.  **Log in as root.**\n+   \n+   You can either log out of your user account\
    \ entirely or use the KFM supeuser mode described in the “Using KFM as the superuser”\
    \ section of this chapter.\n\n+   2.  **Open the KDE menu and select System→SysV\
    \ Init Editor.**\n+   \n+   The run level editor screen appears, as shown in Figure\
    \ 13-7. There are two windows for each run level just below the toolbar; the top\
    \ window contains programs that are started when that run level is invoked and\
    \ the bottom window contains programs that are stopped when the run level is invoked.\n\
    \nTo the left is a window labeled Available Services. This window contains all\
    \ the background programs available for you to install.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_271_0.png)\n\
    \n![](img/8dd43d91b80664e771e0c0a824d7392d_271_1.png)"
  merge: -1
  img_proc: true
- pgno: 272
  md: '+   The Available Services window lists the files that are contained in the
    directory /etc/rc/init.d. You won''t need to memorize that, but it''s useful to
    know in case you want to talk about run levels to someone used to working with
    them in text mode, rather than with a graphical run level editor.


    +   2. Locate the program you want to add.


    +   3. Use your mouse to click and drag the program from the Available Services
    window to the appropriate run level window.


    Remember to use the top window for programs you want to start and to use the bottom
    window for programs you want to stop.


    For this example, you would drag the pcmcia script from the Available Services
    window to the top window under Run Level 3.


    +   4. Click the Save icon (which looks like a floppy diskette).


    The new configuration saves to disk. The next time you start your computer in
    this run level, the new program starts automatically.


    +   5. If you want to start the program immediately without rebooting, right-click
    the program in the Available Services window.


    +   6. Select Start from the pop-up menu.


    As you can see in Figure 13-8, the pop-up menu allows you to start and stop services
    from within the run level manager.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_272_0.png)'
