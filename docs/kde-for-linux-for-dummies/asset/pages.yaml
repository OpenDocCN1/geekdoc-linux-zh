    # ## Setting System Sounds


    Using KDE does not have to be a silent experience. If you have a properly configured
    sound card and speakers, KDE gives you auditory feedback whenever system events
    occur. System events that trigger sounds include actions such as starting KDE,
    changing desktops, opening and closing windows, and logging out of KDE.


    Like nearly everything else in KDE, you can customize the KDE sounds. You can
    choose what sound is associated with each of the many KDE system events. To adjust
    the sound settings, follow these steps:


    +   1. **Choose KDE Menu→KDE Control Panel or click the KDE Control Panel button
    on the panel.**


    The KDE Control Panel window appears.


    +   2. **Click the plus sign beside Sound and then select System Sounds in the
    list box on the left side of the KDE Control Panel window.**


    The Sound tab appears, as shown in Figure 6-9.


    +   3. **Select the Enable System Sounds option.**


    You can use this option to enable (or silence) the KDE system sounds.


    +   4. **Select a system event from the Events list box.**


    +   5. **Select a sound file from the Sounds list box.**


    KDE plays the selected sound whenever the system event you selected in the Events
    list occurs. If you don’t want a sound associated with the selected system event,
    select (none) in the Sounds list.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_137_0.png)


    If you have other sound files that you want to use, open a KFM window and navigate
    to the directory where those sound files are stored, and then drag the sound files
    from the KFM window and drop them on the Sounds list. KDE adds the sounds to the
    list where they are available for your selection.


    +   6. **Repeat Steps 4 and 5 as needed to define sounds for other system events.**


    +   7. **Click the OK button.**


    The Sound tab disappears from the KDE Control Panel window and KDE updates your
    system sound settings. Whenever a system event occurs, KDE plays the associated
    sound file.'
  merge: -1
