- pgno: 200
  md: "# # Chapter 10\n\n# # Applications and Utilities, Part 1 — Work\n\n+   **In\
    \ This Chapter**\n+   \n+   - Editing text with KDE text editors\n+   - Keeping\
    \ up with a busy schedule\n+   - Utilizing utilities\n+   - Looking at the future:\
    \ KOffice\n\nW hen you start work at a new job, you are usually assigned an office\
    \ (or cubicle) equipped with a desk, chair, file drawer, phone, and other obvious\
    \ workstation components. Despite that, your new office usually starts out as\
    \ a pretty barren space. To work efficiently, you need additional tools such as\
    \ pencils and pads of paper, letter trays to organize those papers, a calculator,\
    \ pads of yellow sticky notes, and a long list of other supplies and accessories.\
    \ Often, your first task when you start a new job or move into a new office is\
    \ to make a trip to the supply room or office supply store to procure all the\
    \ miscellaneous stuff you need.\n\nThe KDE desktop provides a working environment\
    \ that is analogous to your physical office or cubicle. In addition, KDE includes\
    \ an assortment of accessories and utilities that provide the computer equivalent\
    \ of accessories such as a calculator, pads of paper, and even those ubiquitous\
    \ yellow sticky notes. After you install KDE, you may not need to run to the virtual\
    \ supply room. Using KDE is like moving into a new office that is already supplied\
    \ with well-stocked drawers and shelves containing most of the tools and supplies\
    \ you need.\n\nTogether, this chapter and Chapter 11 provide an overview of the\
    \ accessory programs and utilities that are included as part of a typical KDE\
    \ installation. The utility programs mentioned here may not be essential components\
    \ of the core KDE system, but they go a long way toward making your experience\
    \ using KDE more productive and enjoyable. All the KDE utility programs are designed\
    \ specifically for the KDE environment to ensure compatibility with KDE and other\
    \ KDE programs."
  merge: -1
  img_proc: true
- pgno: 201
  md: 'A lot of utility programs are packaged with KDE — that''s why it takes two
    chapters to cover them all. This chapter covers the serious side of the KDE accessory
    programs, such as productivity tools and miscellaneous utility programs. Chapter
    11 covers the fun stuff, such as games and multimedia accessories.


    # # Getting It Down—Using KDE''s

    # Text Editors


    KDE includes not one, but two, text editors among its assortment of standard accessory
    programs. Of course, a *text editor* program does exactly what its name implies
    — it enables you to create and edit text files. And both KEdit and KWrite can
    perform that basic task with aplomb.


    KEdit and KWrite are similar, but not quite identical. Both provide a basic text
    editor window where you can edit text files by using the same time-tested techniques
    for selecting and editing text with mouse or keyboard that you use in virtually
    every modern word processor program. Both programs offer easy-to-use alternatives
    to working with traditional command-line text editors (such as vi or emacs) in
    a terminal emulation window. You can use either KEdit or KWrite to create and
    edit KDE and Linux configuration files, shell scripts, HTML documents, and other
    text files and to view *readme* files and other online documentation stored as
    plain text files.


    +   - **Opening KEdit:** Click the KDE Menu button and choose Applications**2:**
    Text Editor. Figure 10-1 shows KEdit at work with an e-mail message.

    +   - **Opening a text file for viewing or editing in KEdit:** Right-click the
    file''s icon in a KFM window and choose Text Editor from the pop-up menu that
    appears.

    +   - **Opening KWrite:** Click the KDE Menu button on the panel and choose Applications**2:**
    Advanced Editor. Figure 10-2 shows a KWrite window displaying a configuration
    file for editing.


    Despite their similarities, KEdit and KWrite are two separate and distinct programs.
    Although the basic purpose of both programs is the same and the basic functions
    are remarkably similar, each program includes a slightly different set of supporting
    features. For example, KEdit can open and save to a URL, and the program also
    has a link to the KDE e-mail client to facilitate using KEdit to compose e-mail
    messages. KWrite, on the other hand, includes an Undo and Redo feature, plus indents,
    bookmarks, and more extensive configuration and formatting options.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_202_0.png)


    **Figure 10-1:** Editing a text file with KEdit.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_202_1.png)


    **Figure 10-2:** The KWrite window sports a slightly different set of toolbar
    buttons than does KEdit.


    # Scheduling Events and Appointments with KOrganizer


    In today’s busy world, nearly everyone needs an appointment calendar of some kind.
    If you are spoiled by the convenience of using a computer-based personal information
    manager (PIM) in another computing environment, you may be concerned about how
    you will do without your favorite PIM when you’re using KDE. Never fear: KOrganizer
    is here and it delivers all the essential features you’ve come to expect from
    a Personal Information Manager.


    KOrganizer is a multipurpose program that includes an appointment calendar, appointment
    and event scheduling, reminder alarms, and a prioritized to-do list. The program
    can set up recurring appointments with very flexible'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'scheduling options. For advanced users, KOrganizer supports group scheduling
    features, vCalendar data interchange with other programs, and synchronizing your
    KOrganizer data with your 3Com PalmPilot. (The KPilot utility is required for
    PalmPilot synchronization.)


    To start KOrganizer, click the KDE Menu button and choose Applications→ Organizer.
    The KOrganizer window opens and displays the appointments and to-do items in your
    most recently used calendar file. (If you''re opening KOrganizer for the first
    time, the program displays a blank New Calendar file.) KOrganizer can put on a
    number of faces with which to display your calendar information. The Day view,
    as shown in Figure 10-3, shows a small calendar display for the current month,
    a to-do list, and an appointment calendar for the current date with one-hour time
    blocks.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_203_0.png)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_203_1.png)


    When you start KOrganizer, the program also launches a control applet that is
    docked into the KDE panel. The KOrganizer applet enables you to close the main
    KOrganizer program and still get reminder alarms for your scheduled appointments.
    You can double-click the KOrganizer applet icon to quickly reopen KOrganizer without
    going through the KDE menu.


    # # Creating an appointment or event


    KOrganizer enables you to schedule two kinds of date-dependent activities: appointments
    and events. An *appointment* is an activity that you schedule to'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'occur at a specific date and time — for example, a meeting, an interview, or
    a doctor''s appointment. An *event*, on the other hand, occurs on a specific date
    but does not involve a set time. You use events to track all-day occurrences —
    such as holidays, vacation days, and birthdays — and to note project deadlines.


    To add an appointment or event to your KOrganizer calendar file, follow these
    steps:


    +   1. Click the **New Appointment** button on the KOrganizer toolbar or choose
    **Actions→New Appointment**.


    KOrganizer opens the New Appointment dialog box with the General tab selected,
    as shown in Figure 10-4.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_204_0.png)


    You can also open the New Appointment dialog box by right-clicking anywhere in
    the appointment calendar portion of the KOrganizer window and choosing New Appointment
    from the pop-up menu that appears.


    +   2. Enter a short description of the appointment or event in the **Summary**
    text box.


    The text you enter here is what appears in the appointment calendar display in
    KOrganizer. A very brief entry, such as "Staff Meeting," usually works best. If
    you need to record more detailed information about the appointment, click the
    large unlabeled text box in the lower half of the New Appointment dialog box and
    type the supplemental information there.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '+   3. For an appointment, enter or select the date and time in the Start Time
    and End Time text boxes. For an event, click the No Time Associated option.


    By default, KÖrganizer enters the currently selected date in the date portion
    of the Start Time and End Time boxes. You can change those dates by typing a new
    date or by clicking the button at the right end of the text boxes to display a
    date picker calendar and selecting the date by using the arrow to scroll to the
    correct month and then clicking the desired date. Similarly, you can enter starting
    and ending times for the appointment by typing the time in the appropriate text
    box or by clicking the button in the time box and selecting a time from the drop-down
    list.


    To create an event instead of an appointment, click the No Time Associated option.
    When you do, the Start Time and End Time boxes disappear from the New Appointment
    dialog box.


    +   4. (Optional) Click the Reminder option; then enter a number and select a
    unit of time.


    This sets an alarm to go off in advance of your appointment, at the time you’ve
    indicated here. If you select the Reminder option, KÖrganizer automatically displays
    a message on-screen (and optionally plays a sound and/or runs a program) before
    the appointment’s start time. If you don’t want a reminder alarm associated with
    this appointment, just leave the Reminder checkbox unselected.


    When you set up a reminder alarm, you set it to go off a specified length of time
    before the appointment’s start time. For example, the reminder for a 3:00 appointment
    appears at 2:45 if you keep the default setting of 15 minutes before the appointment.
    You can enter a different number in the text box beside the Reminder option and
    select minutes, hours, or days from the adjacent drop-down list box to change
    how far in advance of the appointment the alarm is set. You can also change the
    sound KÖrganizer plays by clicking the button that looks like a musical note and
    selecting a sound file from the Open dialog box that appears. Similarly, you can
    select a program or script for KÖrganizer to run; click the button with a running
    stick figure on it and select a file from the Open dialog box.


    +   5. Select Busy or Free in the Show Time As drop-down list box.


    Select Free to instruct KÖrganizer to accept without complaint other appointments
    and meeting requests that conflict with this appointment. Typically, you select
    Busy for most appointments and Free is most often for events.


    +   6. (Optional) Click Categories and either select or enter a category in the
    KÖrganizer Categories dialog box that appears; then click the OK button.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Categories are a convenient way to classify appointments and events by the
    kind of activity they represent or to associate them with a project.

    When you click the Categories button in the New Appointment dialog box, KOrganizer
    opens the KOrganizer Categories dialog box, as shown in Figure 10-5. To select
    an existing category, simply click the category name in the Available Categories
    list box and then click Add. To create a new category, type the category name
    into the New Category text box and then click Add. In either case, clicking Add
    adds the category to the Selected Categories list. You can select multiple categories
    for an appointment or event. Clicking OK closes the KOrganizer Categories dialog
    box and adds the selected categories to the text box beside the Categories button
    at the bottom of the New Appointment dialog box.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_206_0.png)


    +   7. **Click Save and Close.**

    +   KOrganizer closes the New Appointment dialog box and adds the appointment
    or event to the schedule calendar display. A new appointment appears in the appointment
    calendar portion of the KOrganizer window and occupies the block of time corresponding
    to its scheduled start and end times. An event appears at the top of the appointment
    calendar with no time beside it. Refer to Figure 10-3 to see examples of both
    appointments and an event displayed on the appointment calendar.

    +   The Details tab of the New Appointment dialog box enables you to create a
    list of attendees at a meeting, complete with their e-mail addresses and meeting
    roles. If you''re part of a network that includes compatible e-mail and group
    scheduling services, KOrganizer can invite attendees to your meeting and track
    their acceptance.'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'If you''re like most people, many of your appointments and activities are on
    a recurring schedule. Whether it''s for the Monday morning staff meeting at work
    or the Saturday afternoon soccer game with the kids, you need a convenient way
    to enter a series of appointments without having to create each appointment individually.


    K\Organizer makes it easy to define recurring appointments and events. You can
    create an appointment just once and make it a recurring appointment by defining
    how often it repeats. K\Organizer automatically creates additional appointments
    and adds them to your calendar at the interval you specify.


    The easiest way to create a recurring appointment is to start by creating a regular
    appointment for the first occurrence. (See the steps outlined in the “Creating
    an appointment or event” section of this chapter.) You transform the regular appointment
    or event into a recurring appointment by following these steps:


    +   1. Select an appointment or event in the appointment calendar and then choose
    Actions:: Edit Appointment or right-click the appointment and choose Edit from
    the pop-up menu that appears.


    K\Organizer opens the Edit Appointment dialog box, which displays the settings
    for the selected appointment. By the way, Although the commands and dialog boxes
    refer to editing an appointment, you use exactly the same commands and dialog
    boxes to edit an event.


    +   2. Click the Recurring Event option on the General tab.


    A check mark appears in the Recurring Event checkbox and the date portion of the
    Start Time and End Time options disappear from the General tab. The Recurrence
    tab, which was previously grayed out, becomes active.


    +   3. Click the Recurrence tab.


    K\Organizer displays the recurrence scheduling options, as shown in Figure 10-6.


    +   4. Select Daily, Weekly, Monthly, or Yearly in the Recurrence Rule area.


    When you select a basic recurrence rule type, the options on the right side of
    the Recurrence Rule area change to reflect the settings appropriate to the selected
    rule.


    +   5. Adjust the detail settings in the right side of the Recurrence Rule area
    to define the frequency of the recurrence.


    For example, if you select Daily in Step 4, you can specify the number of days
    between appointments. If you select Weekly in Step 4, you can specify how many
    weeks should pass between appointments and on what days of the week the appointments
    occur.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Chapter 10: Applications and Utilities, Part 1 — Work


    ![](img/8dd43d91b80664e771e0c0a824d7392d_208_0.png)


    Figure 10-6: Settings on the Recurrence tab enable you to define the rules for
    recurring appointments.


    +   6. **Adjust the settings in the Recurrence Range area to define the beginning
    and ending dates for the series of recurring appointments or events.**


    By default, the Begin On setting shows the original start date for the appointment.
    Normally, you can just accept that date, but you can change it if necessary by
    clicking the button at the right end of the text box and selecting a new date
    from the pop-up date picker calendar that appears.


    To continue your series of recurring appointments indefinitely, click the No Ending
    Date option. If you want to define an ending date for your series of appointments,
    you can click End After and enter a number of occurrences in the adjacent text
    box, or you can click End By and specify the date for the final appointment in
    the series.


    +   7. **(Optional) Select a date and click Add, which is in the Exceptions area.**


    This step defines exceptions to the Recurrence Rule. When you select a date and
    click Add, the selected date appears in the list box in the Exceptions area. Use
    this list to specify dates on which the recurring appointment should *not* occur
    even though the dates meet the recurrence rule. For example, that weekly staff
    meeting that normally occurs on Monday mornings shouldn''t be scheduled for Monday
    holidays such as Memorial Day and Labor Day. Adding those dates to the Exceptions
    list prevents Organizer from creating recurring appointments on those days. Of
    course, that means you need to manually enter appointments that are rescheduled
    rather than canceled.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '8. **After defining the recurrence pattern, click Save and Close.**


    KOrganizer closes the Edit Appointment dialog box and enters the series of appointments
    you just defined into your appointment calendar. You can easily tell which appointments
    and events are part of a series on recurring appointments because KOrganizer marks
    recurring appointments with a symbol composed of two curved arrows. Figure 10-7
    shows both recurring appointments and one-time appointments.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_209_0.png)


    +   **Figure 10-7:** KOrganizer clearly marks recurring appointments.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_209_1.png)


    Never forget a birthday or anniversary again! Enter those important dates into
    KOrganizer as events, with a reminder alarm set to alert you a few days ahead
    of the special day (so you have time to go shopping or make reservations). Make
    them recurring events with a recurrence rule set for Yearly. On This Date to get
    the same reminder again next year, and the year after, and so on. Use the same
    technique to remind yourself of due dates for things such as quarterly tax payments
    and annual insurance premiums.


    # Working with the to-do list


    In addition to date-related occurrences such as appointments and events, you probably
    need to keep track of tasks — things you need to do but that'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'aren’t tied to a specific date or time. Instead of jotting down a list of tasks
    on a scrap of paper and then misplacing it, let KOrganizer help you maintain your
    to-do list.


    +   ☑ **Adding details to a to-do list task:** Right-click the task in the to-do
    list and choose Edit To Do from the pop-up menu that appears. KOrganizer opens
    the Edit To Do dialog box. Edit the settings, add a detailed description, and
    assign categories as needed; click Save and Close to record your changes and close
    the dialog box.


    +   ☑ **Adding a new task to the to-do list:** Right-click the to-do list and
    choose New To Do from the pop-up menu that appears. KOrganizer adds a line to
    the to-do list and selects it for editing. Type a short description of your task
    and press Enter.


    +   ☑ **Arranging the to-do list by priority:** Right-click anywhere on the to-do
    list and choose Sort by Priority from the pop-up menu that appears. KOrganizer
    rearranges the list with the priority 1 items on top and other tasks arranged
    in decreasing priority order.


    +   ☑ **Marking a task as completed:** Simply click the item’s checkbox in the
    to-do list.


    +   ☑ **Prioritizing a to-do list item:** Click once on the item in the to-do
    list to select it and then click the number to the left of the checkbox. A drop-down
    list of numbers appears. Click a number on the list to assign that priority level
    to the task.


    +   ☑ **Removing completed tasks from the To Do list:** Right-click anywhere on
    the to-do list and choose Purge Completed from the pop-up menu that appears.


    # ## Changing views in KOrganizer


    The standard KOrganizer window presents the appointment calendar for one day on
    the right side of the window and your to-do list and a small monthly calendar
    on the other. Click a date in the calendar to display appointments for that day.
    Use the arrow buttons at the top of the calendar to display other months.


    The Day view is only one of six different ways to view your calendar data in KOrganizer.
    Here’s a summary of the views that are available:


    +   ☑ **List:** Replaces the appointment calendar with a simple list, one appointment
    or event per line.


    +   ☑ **Day:** The standard view (refer to Figures 10-3 and 10-7).


    +   ☑ **Work Week:** The appointment calendar portion of the standard view is
    divided into five columns — one for each day of a typical work week (Monday through
    Friday).'
  merge: -1
  img_proc: true
- pgno: 211
  md: '**Week**: Like the Work Week view except that the appointment calendar section
    displays an entire week in seven columns.


    **Month**: The entire KOrganizer window is devoted to a monthly calendar in the
    traditional block or grid style as shown in Figure 10-8.


    **To-Do List**: This view expands the to-do list to fill the whole KOrganizer
    window.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_211_0.png)


    **Figure 10-8:** The Month view gives you an overview of your schedule.


    # Making Your Life a Little Easier—KDE Utilities


    In addition to the text editors and organizer programs on the Applications menu,
    KDE comes with an assortment of utility programs that perform a variety of specialty
    functions. You can find all the programs covered in this section on KDE’s Utilities
    menu. (To start any of these programs, click the KDE Menu button on the panel,
    choose Utilities, and then select the program name.) The KDE utilities are a mixed
    bag. They range from serious system maintenance tools to frivolous amusements.'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# Address Book


    With a name like KDE Address Book, you can probably guess what this utility does
    — it''s a small database for storing names and associated contact information
    such as street addresses, e-mail addresses, and phone numbers.


    +   - **Adding an entry to the Address Book:** Choose Edit->Add Entry. The Edit
    Current Entry dialog box appears. Fill in the information on the various tabs
    of the dialog box. (*Tip*. The contents of the Formatted Name box is what appears
    in the list of Address Book names.) Click OK to close the Edit Current Entry dialog
    box and add the entry to the Address Book database.

    +   - **Opening the Address Book:** Click the KDE Menu button and choose Utilities->Address
    Book. The KAB window appears.

    +   - **Viewing information about an entry in the KAB window:** Select the desired
    entry from the drop-down list box at the top of the window. Address Book displays
    the entry''s data in the window as shown in Figure 10-9.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_212_0.png)


    # Archiver


    The Archiver utility (also called Ark) enables you to create and maintain compressed
    archive files (*.tar, *.gz).


    +   - **Adding files to the archive:** Drag file icons from a KFM window and drop
    them on the Archiver window.

    +   - **Creating a new archive file:** Choose File->New, enter a filename in the
    Save As dialog box, and then click OK.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '+   - **Opening the Ark utility:** Click the KDE Menu button and choose Utilities->Archiver.

    +   - **Viewing the contents of an existing archive file:** Choose File->Open
    and click OK. The contents of the archive file appear in the Archiver window.
    Right-click a filename in the Archiver window and then make a selection from the
    pop-up menu that appears to extract, view, or delete the selected file from the
    archive.


    # # Calculator


    If you need to do some number crunching on a scientific calculator, just open
    KCalc (KDE Menu->Utilities->Calculator). When the KCalc utility appears on-screen
    (as shown in Figure 10-10), just use your mouse pointer to click on-screen calculator
    buttons instead of using your finger to press the buttons of a handheld calculator.
    Clicking the large KCalc button beside the answer opens the KCalc Configuration
    dialog box, where you can adjust settings that change the precision and switch
    between trigonometry or statistical modes or select a different font to display
    the results.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_213_0.png)


    # # Cut & Paste History


    If you do a lot of cutting and pasting, you''ll love the KClipper utility. When
    you launch the KClipper utility, the program docks a small icon into the panel
    and begins tracking your cut, copy, and paste activities. KClipper expands the
    standard KDE Clipboard to make room for multiple items. As a result, you can cut
    or copy multiple text passages before stopping to paste any of them to a new location.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '+   ‒ **Launching Klipper**: Click the KDE Menu button and choose Utilities↓Cut
    & Paste History.


    +   ‒ **Using the text stored on the Klipper Clipboard**: Click the Klipper icon
    docked in the panel and select the clipped text you want to use from the pop-up
    menu that appears. Press Ctrl-V or choose Edit↓Paste to paste the selected text
    into your application.


    # # Find Files


    Clicking the KDE Menu button and choosing Utilities↓Find Files is another way
    to launch the KDE Find Files utility — the same one you can launch by clicking
    the Find Files button on the panel (as explained in Chapter 4).


    # # Hex Editor


    If you need a hexadecimal editor to view and edit the contents of binary files,
    KHexdit is ready to oblige. But remember, unless you know what you''re doing,
    binary files are strictly "look, don''t touch."


    +   ‒ To launch the hex editor utility, click the KDE Menu button and choose Utilities↓Hex
    Editor.


    +   ‒ To use the utility to view a binary file, choose File↓Open and select the
    file you want to view in the Open dialog box; then click OK. The contents of the
    file appear in the Hex Editor window.


    # # HP LaserJet Control Panel


    The HP LaserJet Control Panel is a simple little utility that enables you to send
    configuration commands to your HP LaserJet printer. Choose KDE Menu↓Utilities↓HP
    LaserJet Control Panel to open the LJnet Tool dialog box where you can select
    options, such as the paper size, printer resolution, end-of-line mode, font, and
    more. Select the settings you want and click OK to send the appropriate configurations
    to the printer. It''s simple, convenient, and works with most of the popular HP
    LaserJet series of printers.


    # # KFloppy


    The KFloppy utility makes formatting floppy disks a simple task. Choose KDE Menu↓Utilities↓KFloppy
    to open the KDE Floppy Formatter dialog box as shown in Figure 10-11. You can
    then select the floppy drive, the disk density, and the file system (DOS or ext2fs),
    and choose between a quick erase and a'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'full format. After you click OK, KFloppy formats the floppy disk and even displays
    a progress bar for constant status updates during the process. Hey, it''s more
    convenient than typing a long command at the command line. With KFloppy, you don''t
    need to pop open the man page to check on some hard-to-remember parameters before
    you can issue the command.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_215_0.png)


    # KJots


    KJots is an interesting utility that enables you to jot down notes and scraps
    of text and keep them organized for future reference or reuse. You can create
    multiple "books" of notes with multiple "pages" in each book even though the KJots
    window displays only one page of notes at a time.


    +   - **Adding a book to the hlist:** Select the book and then choose Hottist→Add
    Current Book to Hottist. A *hottist* is the row of buttons just above the status
    bar at the bottom of the KJots window.

    +   - **Adding a new page to a book:** Choose Edit→New Page or click the New Page
    button on the toolbar.

    +   - **Adding text to a page:** Type in the large text box in the middle of the
    KJots window.

    +   - **Creating a new book of notes:** Choose File→New Book. KJots prompts you
    to supply a name for the book. After you enter the book name, the name appears
    in the status bar at the bottom of the KJots window. This indicates that it is
    the active book.

    +   - **Naming a page of notes:** Type a name in the text box beside the book
    name at the bottom of the KJots window.

    +   - **Opening KJots:** Choose KDE Menu→Utilities→KJots. The KJots window appears,
    as shown in Figure 10-12.'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'Figure 10-12: Create and organize scraps of text with KJots.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_216_0.png)


    +   - Selecting a different book: Choose Book Bookname, where Bookname is the
    name you assigned to the book you want to open. If the book is on the hotlist,
    you can just click the Hotlist button for the book.

    +   - Selecting a different page in the current book: Use the horizontal scroll
    bar below the text box to scroll from page to page.


    # KNotes


    Those little yellow sticky notes are everywhere! There’s even an on-screen version
    of them in KDE — KNotes. When you choose KDE Menu Utilities KNotes, a little yellow
    KNote window materializes on the screen (as shown in Figure 10-13) and the KNotes
    Control Applet icon appears docked in the panel. Just start typing to create a
    note.


    Figure 10-13: KNotes creates an on-screen version of those yellow sticky notes
    that are so handy on your physical desk.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_216_1.png)


    The KNotes window isn’t a standard KDE window — it lacks a window border, menu
    bar, and the usual inventory of titlebar buttons. However, there is a titlebar
    that you can drag to move the note to a different location and a Close button
    that you can click to close the note. Closing the note doesn’t remove the KNotes
    Control Applet that is docked in the panel.'
  merge: -1
  img_proc: true
