  md: 'After you configure the International Keyboard settings and restart KDE to
    activate the keyboard switching feature, notice a small box or button docked in
    the KDE panel or lodged in one of the four corners of your desktop. To switch
    from your default keyboard layout to another keyboard layout, click that button
