- pgno: 70
  md: '# ## Chapter 3

    # Managing Windows with KWM


    # ### In This Chapter


    +   - What is a window manager anyway?

    +   - Getting to know the parts of a KDE window

    +   - Customizing your window settings

    +   - Spreading out onto multiple desktops


    Imagine, if you will, a large castle or manor house with scores of windows. In
    the days before central air conditioning, one member of the household staff might
    be assigned the responsibility for managing all those windows: opening some for
    ventilation, closing others to keep out drafts and rain, shuttering the windows
    against a storm, and opening drapes to welcome the warmth and light of the sun.


    But the windows on your KDE desktop are very different from the windows in a building
    — they show views of computer programs instead of the countryside surrounding
    the house, and information flows through your KDE windows instead of air and light.
    Still, when the number of windows gets large enough, you need a staff member devoted
    to managing them. The KDE Window Manager, or KWM, is the member of the KDE staff
    that has that responsibility.


    KWM does its work quietly, working unobtrusively in the background. You don''t
    see KWM anywhere on your desktop, but you see the effects of KWM''s work everywhere
    on your desktop. KWM controls the placement and appearance of every window. KWM
    gives KDE much of its distinctive look and feel.


    Like a good household staff member, KWM performs most tasks routinely, but also
    dutifully takes instructions from the lord of the manor. In this chapter, you
    discover how to issue those instructions to KWM.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'Unlike monolithic operating systems, such as Windows and Mac OS, the desktop
    environment you are coming to know as KDE is composed of several layers of mix-and-match
    components. Your Linux (or UNIX) operating system kernel and its supporting drivers
    and programs create the foundation layer. The next layer is the X Window System
    server and client software that creates a basic graphical interface for your system.
    Then come the KDE components that complete the graphical user interface and give
    it the look and feel that you experience as the K Desktop Environment. These components
    include KWM, the KDE Window Manager; KPanel, which creates the KDE panel; KFM,
    the KDE File Manager; and a bunch of miscellaneous components collectively known
    as the KDE extensions.


    A *window manager* is an X Window program that handles drawing window components
    such as borders, titlebars, and buttons. It also handles moving and sizing windows,
    manages their placement on the desktop, and controls much of the appearance of
    that desktop.


    The window manager really provides a service to applications and to application
    developers. Thanks to the window manager, each application doesn’t have to include
    separate code for handling user details of window sizing, borders, and so on.
    As a result, applications can be smaller and almost all the windows you see on
    your desktop look and act the same. As a bonus, you can customize window details
    such as the color of the active window’s titlebar in a central location instead
    of having those attributes set by each program individually.


    KWM does all the tasks expected of a standard X Window manager, plus it provides
    multiple desktops to work on and enables features such as dragging files to and
    from the desktop and between windows. Of course, KWM is designed specifically
    to work with KDE and other KDE components. Together they create the complete KDE
    environment.


    Because KWM is a separate program, you can use another window manager (such as
    Enlightenment or After Step) if you really want to. However, other window managers
    don’t have the tight integration with the rest of KDE that KWM enjoys. Conversely,
    you could theoretically use KWM as a generic window manager for X Window, but
    KWM can’t really perform up to its potential without the rest of KDE.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_71_0.png)


    You don’t have to change window managers to change the appearance of your desktop.
    You can customize KWM in many ways, and you can use themes to make major changes
    quickly and easily. If you like the looks of a different window manager, you may
    be able to emulate it with a KDE theme. (See Chapter 7 for more information on
    using themes.)


    # # What’s a Window Manager?


    # ## Part 1: Getting Started


    46'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# # Anatomy of a KDE Window


    The key elements of a graphical user interface — program windows with titlebars,
    and so on — are pretty standard and familiar to most computer users. A KDE window,
    such as the one shown in Figure 3-1, may look a little different from its counterpart
    in Windows or Mac OS, but most of the parts are easily recognizable.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_72_0.png)


    Figure 3-1: Taking inventory of window parts.


    Here''s a quick rundown on the main parts of a KDE window:


    +   ✓ **Titlebar:** The colored bar that runs across the top of the window normally
    displays the name of the program and/or the filename of the document that appears
    in the window. The titlebar also serves as a “handle” that you can drag with the
    mouse pointer to move the window.

    +   ✓ **Border:** Defines the edge of the window. The border also serves as a
    sizing handle that you can drag with the mouse pointer to expand or contract the
    size of the window on a given side.

    +   ✓ **Close button:** Click this button to close the window and exit the application
    or document that is running within the window.

    +   ✓ **Maximize button:** Click this button to automatically expand the size
    of the window to fill all the available space on your desktop. If the window is
    already maximized, the complementary Restore button replaces this button (usually
    labeled with two stacked rectangles). Clicking the Restore button returns the
    window to its previous unmaximized size and position.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '+   * **Minimize button**: Also known as the Iconify button. Click this button
    to remove the window from your desktop without exiting the program within the
    window. After you click the Minimize button, the program continues to run, but
    is represented only by a button on the KDE taskbar and a listing in the Window
    List, not by an open window on any desktop.


    +   * **Sticky button**: Click this button to toggle Sticky mode on or off. If
    you make a window sticky, it appears in the same place on all of your virtual
    desktops instead of being available on only one virtual desktop.


    +   * **Menu button**: Click this button to open a menu of window management commands.
    The default Menu button (labeled with a plain horizontal line) is normally replaced
    by an icon for the program running within the window. But regardless of the appearance
    of the Menu button, clicking it has the same effect.


    +   * **Sizing handle**: Click and drag the sizing handle at the lower-right corner
    of the window to resize the window along both the horizontal and vertical axis
    at the same time.


    +   * **Window background**: The interior of the window is the domain of the program
    running within the window. The application controls everything that appears within
    the window including the menus, toolbar buttons, status bar, and the contents
    of the main work area. KWM doesn''t do anything except set the default colors
    for the window background, text, menu text, and selected items.


    KDE is a highly customizable environment, and that customization extends to the
    appearance of the buttons and other components of the KDE windows. Figure 3-1
    shows a KDE window using the default KWM settings. Your windows may look very
    different — especially if you use themes to modify the appearance of your KDE
    desktop. The window borders may be rendered to look like thick metal pipes and
    the titlebar buttons may carry different symbols. However, despite cosmetic differences,
    the KDE window components still work the same.


    # The KDE Custom Window Shop


    You may be quite content to stick with the default settings of KDE for controlling
    the appearance and behavior of KDE windows and desktop. For the most part, the
    KDE developers have done an excellent job of selecting sensible defaults that
    create a highly usable windowing system. However, if you''re the type who just
    loves to tinker with your system, KDE gives you ample opportunity to do so. You
    can manipulate an amazing array of settings to control almost every imaginable
    detail of window management. Although a few aspects of window design (such as
    specifying the image files used to render window borders and buttons) require
    hand-editing arcane configuration files (and are those beyond the scope of this
    book), most of the custom window settings are readily available in a series of
    convenient dialog boxes.'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'You can find most of the custom window controls on various tabs of the KDE
    Control Center in dialog box. To open the KDE Control Center dialog box, use one
    of the following techniques:


    +   - Click the KDE Menu button and then choose KDE Control Center.

    +   - Click the KDE Control Center button on the panel.


    After the KDE Control Center dialog box appears, you can use the index tree on
    the left side of the dialog box to select the tab you want to work on. The following
    sections of this chapter detail the settings you can adjust on each of the tabs.


    # Configuring the titlebar


    Perhaps the most prominent feature of any window is its titlebar. You can adjust
    several aspects of the titlebar appearance by following these steps:


    +   1. Open the KDE Control Center dialog box. Click the KDE Control Center button
    on the panel or choose KDE Menu->KDE Control Center. The KDE Control Center dialog
    box appears.

    +   2. Choose Windows::Titlebar. The Titlebar tab appears, as shown in Figure
    3-2.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_74_0.png)'
  merge: -1
  img_proc: true
- pgno: 75
  md: '3. **Adjust the settings on the Titlebar tab as needed.**

    You can adjust the following settings:


    +   - **Title Alignment**: The three radio buttons in this area enable you to
    select the alignment of the title within the titlebar. You can select Left (the
    default), Middle, or Right.


    +   - **Appearance**: The options in this area define the kind of back-ground
    that appears in the titlebar. Select Shaded Vertically to specify a color blend
    from top to bottom in the titlebar. Select Shaded Horizontally (the default) to
    make the color blend go left to right. Select Plain to specify a solid color titlebar
    and selectPixmap to display an image as the background of the titlebar.


    +   - **Pixmap**: If you select the Pixmap option in the Appearance area, the
    options in the Pixmap area become available. Click the Active Pixmap and Inactive
    Pixmap buttons to open dialog boxes where you can select image files to use for
    the background of the active and inactive window titlebars. Select the No Pixmap
    Under Text option to suppress display of the image as the background for the title
    text.


    +   - **Mouse Action**: Select an action from the Left Button Double-Click Does
    drop-down list box to define what happens if you double-click the titlebar. The
    default, (Un)Shade, causes the window to collapse so that only the titlebar remains
    visible, thus occupying less space on the desktop. Double-click the collapsed
    window titlebar to reverse the effect and restore the window to its normal size.


    +   - **Title Animation**: If a window title is too long to fit in the titlebar,
    KWM automatically scrolls the title back and forth in the titlebar. You can control
    the speed of the scrolling action by dragging the Title Animation slider left
    or right.


    4. **Click the Apply button.**

    KDE applies the settings to your desktop and windows.


    # # Configuring the buttons


    The titlebar buttons are an important feature of KDE windows. They provide quick
    access to the most-used window controls. You can rearrange the buttons to place
    the buttons in the positions that are most convenient for you. Here''s how:


    1. **Open the KDE Control Center dialog box.**

    Click the KDE Control Center button on the panel or choose KDE Menu->KDE Control
    Center. The KDE Control Center dialog box appears.'
  merge: -1
  img_proc: true
- pgno: 76
  md: '2. Select **Windows→Buttons**.


    The **Buttons** tab appears, as shown in Figure 3-3.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_76_0.png)


    Figure 3-3: Controlling which titlebar buttons go where.


    3. Select the position for each of the **titlebar** buttons.


    You can set the position for each of the five titlebar buttons (**Minimize**,
    **Maximize**, **Sticky**, **Close**, **Menu**) by selecting one of three radio
    buttons (**Left**, **Right**, **Off**). The sample titlebar near the top of the
    **Buttons** tab previews your selections.


    You can’t put more than three buttons at either end of the titlebar. If you attempt
    to place a fourth button on one end, KWM automatically turns off one of the other
    buttons at that end. You need to reselect another location for the disabled button.


    4. Click the **Apply** button.


    KDE applies the settings to your desktop and windows.


    # Configuring mouse button actions


    KWM provides a multitude of options for controlling what happens when you click
    a window with the mouse pointer. Depending on which mouse button you click, where
    you click the window, and whether the window is active or inactive, the mouse
    click can raise a window to the foreground or lower it to the background, move
    or resize the window, or pass the click to the application within the window.
    And all these details are configurable. Follow these steps to change the mouse
    settings:'
