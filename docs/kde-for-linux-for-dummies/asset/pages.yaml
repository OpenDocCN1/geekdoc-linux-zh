  md: '+   1. Click the KDE Menu button and then choose Settings → Desktop → Theme
    Manager.


    KDE opens the KDE Theme Manager dialog box as shown in Figure 7-2. By default,
    the Theme Manager displays the Installer tab, with its list of available themes
    on the left and its preview box on the right. A short description of the selected
    theme appears below the preview box.


    +   2. Click a theme name in the list box on the left side of the Installer tab
