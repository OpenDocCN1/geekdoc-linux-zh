- pgno: 337
  md: '# In this part...


    Nobody knows what the human appendix was originally for, but there’s no doubt
    what this one’s for—hooking you up to more resources for making contact with the
    KDE/Linux community. Here you’ll find tips on how to get hold of and install KDE,
    where to find more know-how and know-who on the Internet, and a catalog of the
    goodies you’ll find on the CD-ROM that accompanies this book. With these resources
    and KDE For Linux For Dummies, you’re ready to rock.'
  merge: -1
