- pgno: 218
  md: '# Menu Editor


    The KDE Menu Editor utility is available from the Utilities menu (KDE Menu→Utilities→Menu
    Editor), as well as from the Panel menu. As its name implies, this is the utility
    that you use to edit and add to the menus that appear when you click the KDE Menu
    button on the panel. We cover this utility in detail in Chapter 5.


    # MoonPhase


    MoonPhase is a novel application of computer technology. When you choose KDE Menu→Utilities→MoonPhase,
    the MoonPhase icon appears docked in the KDE panel. Naturally, the icon looks
    like a full moon. When you point to the MoonPhase icon with your mouse, a pop-up
    tip box displays the current phase of the moon. It’s a handy reference for those
    times when you’re stuck inside or are disoriented because the moon isn’t visible
    in the sky.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_218_0.png)


    If you see a very bright celestial object when you venture outside and your first
    thought is that the moon is on fire, you may want to consider a short vacation
    to reacquaint yourself with sunlight.


    # Mouspedometa


    Do you ever wonder how far you move your mouse in a day? Sure, you’re moving it
    around in the same 8-inch square all the time, but going back and forth so much
    must add up to lots of feet, yards, and even miles. The Mouspedometa utility seeks
    to answer this burning question by monitoring mouse movement and displaying the
    results on-screen.


    +   - **Closing Mouspedometa:** Right-click the counter display and choose Quit
    from the pop-up menu that appears.

    +   - **Resetting the counter:** Right-click the counter display and choose Reset
    Odometer from the pop-up menu that appears.

    +   - **Starting Mouspedometa:** Choose KDE Menu→Utilities→Mouspedometa. A pair
    of counters appear on-screen, looking much like the odometer in an automobile
    dashboard. One counter tracks the mouse position relative to its starting point.
    The other tracks cumulative distance traveled.


    # Personal Time Tracker


    If you need to keep track of time spent working on various computer projects,
    you’ll really like the *Personal Time Tracker* utility (also known as'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'Karm). It enables you to create a list of tasks and then track the time you
    spend on each task with a built-in stopwatch that you can start, stop, and restart
    as needed. The Personal Time Tracker always shows the cumulative time recorded
    for each task, no matter how many times you start and stop the clock.


    ➤ **Creating a new task:** Choose Task->New, enter a name into the Task Name text
    box in the dialog box that appears, and then click OK. The task appears on the
    task list in the Personal Time Tracker window.


    ➤ **Recording time spent on a task:** Select the task and then choose Clock->Start
    or click the Start Clock button on the toolbar. Personal Time Tracker begins timing
    the task. When you finish working on the task, choose Clock->Stop or click the
    Stop Clock button in the toolbar. You can stop and restart the clock and switch
    tasks as often as needed.


    ➤ **Selecting a task:** Click the task name in the Personal Time Tracker window.


    ➤ **Starting Personal Time Tracker:** Choose KDE Menu->Utilities->Personal Time
    Tracker. The Personal Time Tracker window appears, as shown in Figure 10-14, displaying
    a list of tasks and the cumulative time spent on each one. (When you first open
    Personal Time Tracker, the window is empty until you create a task.)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_219_0.png)


    # Printer Queue


    The KDE Printer Queue provides a graphical interface for your Linux print spooler,
    which makes it easy to manage print jobs waiting in the queue to be printed.


    ➤ **Moving a print job to the top of the list in the printer queue:** Select the
    print job by clicking it; then click Move to Top.


    ➤ **Selecting a different printer queue:** Select the print spool from the Printer
    drop-down list box.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Starting the Printer Queue utility: Choose KDE Menü►Utilities►Printer Queue.
    The Printer Queue window shows the status of the print jobs in the selected printer
    queue.


    Updating the status of the print queue display: Click Update.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_220_0.png)


    Your printer must be set up to work properly in the Linux operating system before
    the KDE Printer Queue can do its job. That usually means running a separate printer
    configuration utility to install drivers and set up print spool directories before
    you attempt to use Printer Queue for the first time.


    # ## Process Management


    The KDE Process Management utility enables you to view and manage the processes
    running on your system. It´s a powerful tool for experienced system administrators,
    but it´s not something the average user should mess with. Choose KDE Menü►Utilities►Process
    Management to open the KPM window (as shown in Figure 10-15). The window displays
    a graphical representation of CPU load, memory, and swap space usage, plus a complete
    list of the running processes and their status. Right-click a process and choose
    from the commands on the pop-up menu to do things such as kill, terminate, or
    hang up the selected process. Be careful and make sure you know what effect your
    actions will have.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_220_1.png)


    # ## Tape Backup Tool


    If you have a tape drive installed on your system, you´ll want to investigate
    the KDE Tape Backup Tool, also known as KDAT. The program provides a single graphical
    interface where you can mount, unmount, and format tapes, back up files to tape
    by using the tar tape archive format, verify archived files against local files,
    and restore files from tape. KDAT supports multiple archives on the same tape,
    selectively restoring files from tape, and creating backup profiles to simplify
    the process of selecting and creating backups. In short, KDAT'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'includes all the features you expect to find in a backup utility program. KDAT
    is too complex to cover in detail here, but the following steps should give you
    a general idea of how you may use KDAT to create a simple backup:


    +   1. **Choose KDE Menu> Utilities> Tape Backup Tool.**

    +      The KDAT window appears.

    +   2. **Choose File> Mount Tape;** follow the prompts to format the tape if necessary.

    +   3. **Select the files to back up by expanding the directory tree display on
    the left side of the KDAT window and clicking a file or directory to highlight
    it.**

    +      You can also select files for backup by clicking the checkbox beside file
    or directory names in the directory tree. KDAT backs up only the selected files.

    +   4. **Choose File> Backup.**

    +      KDAT displays the Backup Options dialog box, where you can review and edit
    file selections and backup options.

    +   5. **Edit or accept the backup options and click OK.**

    +      KDAT starts backing up the selected files to tape. The program displays
    a progress report in the Backup dialog box to show throughput and estimated time
    remaining.


    # World Watch


    The World Watch utility is a simple little program that shows the current time
    and also displays an approximation of the current daylight and dark areas projected
    onto a world map. To start the program, choose KDE Menu> Utilities> World Watch.
    The world map in the KDE World Wide Watch window says it all (see Figure 10-16).
    Let''s see, if it''s 8 p.m. in Texas, what time is it in Sydney, Australia?


    Figure 10-16:

    World

    Watch

    helps you

    visualize the

    march of

    time across

    the globe.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_221_0.png)'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Previewing KOffice


    KOffice is the collective name for a group of office productivity programs currently
    under development. The goal of the KOffice project is to create a complete office
    suite that is built on the same foundations as KDE and has capabilities comparable
    to the popular office suites for other platforms.


    KOffice is a work in progress. As this book goes to press, KOffice is under intensive
    development, but it’s still in the *alpha stage* (a sort of programmer’s equivalent
    of a rough draft). Although preliminary versions of some of the KOffice component
    programs are available for preview, none of the KOffice components are ready for
    serious *beta testing* (like the final editing and proofreading of a manuscript),
    much less complete and ready for general use. Consequently, it’s too early to
    tell exactly what features the various KOffice components will have. The plans
    for KOffice call for the office suite to include the following components:


    +   ✓ **Katabase** — The KOffice database component — it’s similar to Paradox
    or Microsoft Access.


    +   ✓ **KChart** — A program for drawing charts and graphs.


    +   ✓ **KFormula** — A program for drawing properly formatted scientific formulas
    (see Figure 10-17), which you can then incorporate into presentations and documents
    you create with other KOffice programs.


    +   ✓ **KIllustrator** — A vector drawing program (along the lines of Adobe Illustrator
    or CorelDRAW) for creating diagrams, illustrations, logos, and such.


    +   ✓ **KImage** — An image viewer application.


    +   ✓ **KImageShop** — An image editor for creating and manipulating bitmapped
    images, such as digital camera pictures, scanned images, and screen captures.
    See Figure 10-18 for a sample.


    +   ✓ **KPresenter** — A presentation graphics application with capabilities roughly
    comparable to Microsoft PowerPoint or Lotus Freelance Graphics. See Figure 10-19
    for a preview.


    +   ✓ **KWord** — A word-processing program with FrameMaker-like desktop-publishing
    capabilities. See Figure 10-20 for a sneak peek at what KWord looks like at the
    alpha stage of the process.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_223_0.png)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_223_1.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_224_0.png)


    When you compare KOffice to some of the popular commercial office suites, certain
    component applications seem conspicuous by their absence. For example, KOffice
    doesn’t include a Web browser component. But then, KOffice doesn’t need a separate
    Web browser because KFM fills that niche in KDE. Similarly, there’s no need for
    e-mail and news clients in KOffice because KMail and KRN are already part of KDE;
    KOrganizer handles appointment scheduling and to-do lists, so you won’t find that
    function duplicated in KOffice, either. So, when all is said and done, KOffice,
    combined with other utilities already available in KDE, will provide a comprehensive
    office productivity solution that is a completely free and open source.'
  merge: -1
  img_proc: true
