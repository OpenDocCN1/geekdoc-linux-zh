- pgno: 310
  md: "# Chapter 16\n\n# Ten Sources of Help\n\n+   In This Chapter\n+   \n+   * \
    \  Ten good places to go when you're tearing your hair out\n+   *   Finding \"\
    official\" help — as official as it gets with a volunteer project\n+   *   Collections\
    \ of helpful information, as well as places where KDE people hang out\n+   * \
    \  Two ways to give help rather than get it\n\nUnless you are some sort of KDE\
    \ superhuman, you're probably going to have questions that aren't covered in this\
    \ book. (Alas! It's true!) As mentioned frequently, KDE is an international volunteer\
    \ project. That means your best help is going to come from the same place that\
    \ fostered the project in the first place: the Internet.\n\nKDE help on the Internet\
    \ comes in several flavors. You'll find a lot of good information collected on\
    \ various Web pages, whether it's a formal help document or a collection of previous\
    \ questions and answers on a given topic. You'll find talkative mailing lists,\
    \ where users and developers chat via e-mail about their problems and neat ideas.\
    \ You'll find newsgroups that talk about KDE, and you'll even find real-time chat\
    \ on IRC. If you've found yourself interested in contributing to the project,\
    \ there's help for you, too.\n\n# Jumping In with the Quick Start Guide\n\nThe\
    \ Quick Start Guide is a Web resource that does exactly what its name implies.\
    \ It's a very basic KDE introduction, which covers installation, window management,\
    \ launching and using applications, configuring your desktop, and logging out.\
    \ Fire up a Web browser or KFM and head over to\n\n```\nwww.kde.org/documentation/quickstart/index.html\n\
    ```\n\n> You should be aware that the Quick Start Guide uses the term *Application\
    \ Starter* to refer to the button we call the **KDE menu** throughout this book.\
    \ That's the term that KDE developers used a while back, which is when the Quick\
    \ Start Guide was written. If the guide is revised when new versions are released,\
    \ that term will likely change to something people actually use.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_310_0.png)"
  merge: -1
  img_proc: true
- pgno: 311
  md: 'Although this book is more comprehensive than the Quick Start Guide, you may
    not always be able to lug a book around. Print out the Quick Start Guide and put
    it next to your terminal, or give it to a friend who may not be quite as convinced
    about the utter coolness of KDE as you are.


    # # Using the User''s Guide to KDE


    If the Quick Start Guide is too basic for you, give the User''s Guide to KDE a
    try. The User''s Guide is written from, obviously, a user''s perspective. The
    guide covers installation requirements, window and desktop management, some cool
    games and graphics viewers, and a few hints for better use of KDE. You can find
    it at the following address:


    www.kde.org/documentation/userguide/index.html


    Again, you''ll find more detailed information in this book than you do in the
    User''s Guide, but it''s a helpful URL to keep bookmarked in case you have a quick
    question and don''t want to flip through the book lest you be sidetracked by a
    funny cartoon.


    # # Getting the Facts with the KDE FAQ


    If you''ve spent much time on the Internet, you''re probably familiar with the
    term *FAQ*. It stands for Frequently Asked Questions and is a compilation of the
    answers to questions that are asked, well, frequently. Finding and using the FAQ
    is a good first step for almost any problem you may need an answer to, and the
    KDE FAQ is no exception. Find the KDE FAQ here:


    www.kde.org/documentation/faq/index.html


    ![](img/8dd43d91b80664e771e0c0a824d7392d_311_0.png)


    If you want to sound in the know when you''re talking about FAQs, pronounce it
    *fack* instead of spelling it out as *eff-ay-cue*.


    The KDE FAQ is the document that is updated most often of the three listed so
    far. The authors expect you to have a reasonably good understanding of your UNIX-based
    operating system, and the answers often send you off to work in a terminal window.
    Even if you re a die-hard non-techie, you''ll find much of interest and help in
    the KDE FAQ, and the technical information will become easier to understand as
    you work more with your operating system.'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Signing Up for the *kde* Mailing List


    If you like to get a lot of e-mail about subjects that interest you, consider
    joining one of the many *kde* mailing lists. The granddaddy of all is the *kde*
    mailing list. It’s a general discussion list, which means that just about any
    KDE-related topic is fair game. Because there are specific lists for other KDE
    topics, you may be asked to post your questions to a more appropriate list. Still,
    the *kde* list is quite active; if you subscribe, expect to receive anywhere from
    600 to 1,000 posts a month (an average of 20 or 30 a day).


    Not familiar with lists? A *mailing list* is a way for all the people subscribed
    to that list to send e-mail to one central address. The computer at that address
    redistributes the messages to all the subscribers. It’s good netiquette to stay
    quiet and just read the messages for a few days until you get a feel for the group.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_312_0.png)


    Subscribe to the *kde* list by sending e-mail to the automated request handler
    software at the list’s email server:


    +   1. Address your message to

    +      kde-request@kde.org

    +   2. Leave the Subject line blank.

    +   3. Type the following line in the body of your message:

    +      subscribe kde your-email1-address

    +   4. Replace the term *your-email1-address* with your actual e-mail address.
    Don’t put anything else in the message; a computer is going to read it, not a
    person.


    # Finding Your Peers at *kde-user*


    A mailing list populated mostly by users like you, the *kde-user* list is a good
    place to seek help from other folks using KDE. You may be able to get a simpler
    explanation of a troubling issue on *kde-user* than you would on the *kde* list
    or in the KDE FAQ. The main drawback of the *kde-user* mailing list is the volume
    of e-mail that it generates. In 1999, the list has averaged over 1,400 posts a
    month, or more than 40 a day. In some months, the list receives nearly 2,000 posts.


    Subscribe to the *kde-user* list by sending e-mail to the automated request handler
    software at the list’s e-mail server:'
  merge: -1
  img_proc: true
- pgno: 313
  md: '+   ✓ Address your message to

    +   `kde-user-request@kde.org`

    +   ✓ Leave the Subject line blank.

    +   ✓ Type the following line in the body of your message:

    +   `subscribe kde-user your-email-address`

    +   ✓ Replace the term your-email-address with your actual e-mail address. Don’t
    put anything else in the message; a computer is going to read it, not a person.


    # ## Getting the Headlines at kde-announce


    You can subscribe to a mailing list that sends much, much less e-mail than either
    the kde list or kde-user. The kde-announce list is moderated, which means that
    only approved posts are sent to subscribers. The only messages that you receive
    from kde-announce are formal announcements from the KDE team. It’s rare for a
    month to go by in which the list has received more than 60 messages.


    Subscribe to the kde-announce list by sending e-mail to the automated request
    handler software at the list’s email server:


    +   ✓ Address your message to

    +   `kde-announce-request@kde.org`

    +   ✓ Leave the Subject line blank.

    +   ✓ Type the following line in the body of your message:

    +   `subscribe kde-announce your-email-address`

    +   ✓ Replace the term your-email-address with your actual e-mail address. Don’t
    put anything else in the message; a computer is going to read it, not a person.


    # ## Fighting Overload with the List Archives


    Although mailing lists are fabulous ways to get information to a large number
    of people in a straightforward fashion, they can be problematic—especially for
    people who don’t like to get a lot of e-mail or whose mailbox space is limited.
    There is a solution! All the KDE-related mailing lists are *archived*. This means
    that all the posts to those lists have been saved and are available to anyone
    who wants to read them. Find the KDE mailing list archives at this address:'
  merge: -1
  img_proc: true
- pgno: 314
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_314_0.png)


    http://lists.kde.org


    Select the file folder next to the list that you''re interested in; the file tree
    expands and shows you a list of the posts archived by month. Pick a month and
    start reading. If you want to search, select a list and then enter the term you
    want to search for into the text box at the top of the page and click the Search
    button. Take a look at the archive layout as shown in Figure 16-1.


    # # Protecting Yourself with Bug Reports


    Sure, we can pretend that KDE is a perfect program — but who''s ever heard of
    truly perfect software? Even the best programs have problems. For software that''s
    in the early stages of its career, like KDE, those problems usually surface as
    bugs, or glitches that result from inadvertent programming mistakes.


    KDE bug reports are archived at http://bugs.kde.org. A sample bug report is shown
    in Figure 16-2. Bugs are sorted into critical, grave, and normal categories. Critical
    bugs either prevent KDE from running or cause serious damage to your machine;
    grave bugs are serious but not as harmful; normal bugs are merely annoying. The
    bug report page also houses the wishlist items: things that users and developers
    would like to see in future releases.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_315_0.png)


    Figure 16-2: If you report a bug, the developers post your e-mail to the bug report
    archive.


    # Checking Out comp.windows.x.kde


    If you prefer newsgroups to e-mail or you want more interaction than a Web page
    can provide, there’s the USENET newsgroup comp.windows.x.kde. Although most people
    using this newsgroup are KDE users, not developers, they can offer quick solutions
    to pressing problems. At the least, they can point you to other resources. It’s
    a good place to start — especially if you’re on a pretty basic level. Take a look
    at the message subjects for a random day in comp.windows.x.kde, as shown in Figure
    16-3.


    Most of the posts to comp.windows.x.kde (and, in fact, most posts to USENET groups
    regardless of hierarchy) are archived at most.deja.com. If you have a specific
    question and you’d like to see if it’s been addressed somewhere on USENET, you
    can search the archives at Deja to find out.'
  merge: -1
  img_proc: true
- pgno: 316
  md: "![](img/8dd43d91b80664e771e0c0a824d7392d_316_0.png)\n\n# Figure 16-3: Subject\
    \ lines can often give you a good idea of what’s being discussed in each thread.\n\
    \n# Hanging Out on #kde\n\nFinally, if you like an equal part of chat with your\
    \ technical discussion, join the conversation at #kde, an IRC channel found regularly\
    \ on various IRC networks. If you’re looking for a server, try the following network\
    \ home pages for a list of available machines:\n\n+   - EFnet is the oldest of\
    \ the IRC networks. Find a list of EFnet servers here:  \n+   `www.efnet.org`\n\
    +   - IRCnet is mostly European. A list of servers is here:  \n+   `www.ludd.luth.se/irc/servers.html`\n\
    +   - Undernet is another of the major IRC nets. Its servers can be found here:\
    \  \n+   `http://servers.undernet.org`"
  merge: -1
