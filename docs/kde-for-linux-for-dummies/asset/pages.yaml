    the One button. Something really did happen, though. You’re looking at desktop
    2 instead of desktop 1, and they just happen to be exactly the same.


    +   2. **From the KDE menu, choose Utilities::KNotes.**

    +   A small yellow window labeled *knote 1* appears, as shown in Figure 1-6. This
    window is an electronic version of those yellow sticky notes we all have plastered
    over our desks, phones, books, walls, and any other surface they’ll stick to.


    +   3. **Click inside the note and type “Hi, I’m Desktop Two.”**


    +   4. **Click the One button in the Pager icon.**

    +   The note disappears, because you’re back on desktop 1. The note still exists
    — just not here.


    +   5. **Click the Window List icon on the panel.**

    +   A list of all your desktops appears. See there, under Desktop 2? It says “Note:
    knote 1.”


    ![](img/8dd43d91b80664e771e0c0a824d7392d_49_0.png)


    Desktop Two’s Pager button pressed down.


    Figure 1-6:

    Those darn sticky notes are everywhere, even in KDE.'
