- pgno: 50
  md: "+   6. **Click The Two button in the Pager.**\n+   \n+   The note is there,\
    \ just where you left it. You can get rid of it, if you like, by clicking the\
    \ X button in the title bar.\n+   \n+   7. **Click the One button in the Pager\
    \ icon to return to desktop 1.**\n+   \n+   The taskbar contains items for all\
    \ the programs you have open, regardless of which desktop they’re on. If you click\
    \ the item for a program that’s on a different desktop, the taskbar automatically\
    \ takes you to that desktop. Using the taskbar is a quick and easy way to shift\
    \ between desktops without having to cycle through them with the Pager buttons.\n\
    \n# So Long, Farewell: Exiting KDE\n\nAfter you’re done with this session of KDE\
    \ fun, you need to exit out of the desktop environment to get back to a shell\
    \ prompt so that you can log out of the machine, or back to a graphical login\
    \ if you’ve set one up.\n\n+   1. **Log out of KDE using one of the following\
    \ options:**\n+   \n+      • Click the **Logout** button on the panel.\n+   \n\
    +      • Click the K button on the panel and choose **Logout** from the KDE menu\
    \ that appears.\n+   \n+      • **Right-click the desktop** and then choose **Logout**\
    \ from the pop-up menu that appears.\n+   \n+   KDE displays the **Session prepared\
    \ for logout** dialog box. This dialog box lists the programs that are running\
    \ and gives you the opportunity to abort the logout, return to those programs\
    \ and save your work.\n+   \n+   2. **Click Logout to confirm that you want to\
    \ close KDE.**\n+   \n+   KDE disappears from your screen and returns you to the\
    \ plain text environment of the Linux shell prompt.\n\nDon’t forget to log out\
    \ of your shell account after you exit KDE! Leaving KDE doesn’t mean that you’ve\
    \ logged out. Leaving yourself logged in is an invitation to cruel hjinks and\
