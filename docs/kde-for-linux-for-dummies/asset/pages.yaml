- pgno: 260
  md: '# # Chapter 13


    # ## It May Look Different, but It’s Still Linux


    **In This Chapter**


    +   * The multiuser environment

    +   * Setting up user accounts

    +   * Using KFM as the superuser

    +   * Package management

    +   * Shifting gears with the run level editor

    +   * Mounting file systems

    +   * Security: Keeping private stuff private


    I t’s easy to forget, sometimes, that KDE is simply the user interface to the
    powerful and flexible Linux operating system. After all, KDE succeeds at its goal
    of making the use of a Linux computer something that’s simple and comprehensible
    for everyone, not just for people who write code for fun and memorize arcane commands
    like the rest of us try to remember the grocery list.


    Part of the reason the masses haven’t converted to Linux — even though there’s
    a general feeling of interest and benevolence toward the operating system among
    the computer-savvy public — is that the administration of a Linux machine is perceived
    as strange. Complicated. Technical. Described in documentation that appears to
    have been written by yaks at midnight. Filled with stuff you have to do or otherwise
    send your machine into a fit of exploding flames.


    Some of that is true, and some of it isn’t. (We’re not going to make a call on
    the yaks.) Linux administration can be quite complex. Some of the things you need
    to keep an eye on may slip your mind, but that’s true of almost anything, whether
    involving computers or not. Much of the documentation doesn’t do a very good job
    of explaining why you need to do something.'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'This is where KDE comes in. We won''t tell you that KDE tools make it as

    simple to run a Linux system as it is to run an iMac, because that''s not true.

    You have much more control over the **operating system** in a Linux environ-

    ment than you do over the Macintosh operating system. More control means

    more effort, in computing as in life. This chapter provides you with two

    things: an understanding of the administrative tasks you have to perform

    because you''re running Linux and a guide to the KDE tools that make those

    tasks a little easier.


    # # The Multiuser Environment


    The key concept to keep in mind as you work with your Linux machine is that

    you''re in charge of a *multiuser environment*. Linux provides a way for several

    people — or one person pretending to be several people — to use a single

    computer. Users share the applications and system resources, but each indi-

    vidual account is private and has its own storage area. The system adminis-

    trator can see what the users are doing or what they''ve stored on the hard

    drive, but users can''t see anything related to other users'' activities. Oh,
    the

    power! Oh, the possibilities!


    When you installed Linux on your system, you created a special account

    called *root*, and you probably also created a personal account for yourself.
    As

    soon as you completed those account creations, you had a multiuser system.

    Yep, as easy as that! Yes, you''re both root and trixie-belle, but your computer

    doesn''t know that. Your computer sees the two as separate entities, and

    gives root complete access to everything on the machine, but requires trix-

    ie-belle to follow the rules.


    As you go through this section, remember that the multiuser information

    applies to you even if you are the only human using your machine. Because

    you have access both to root and to your user account, you have multiuser

    concerns as much as if you also created accounts for your partner or room-

    mate. If you do have other users on your machine, you have some interper-

    sonal concerns as well. Those are mentioned later in the chapter, and there

    are some ideas about being a good system administrator as well as a good

    friend.


    > Let''s talk for a moment about root. That root account you created for your-

    > self is pretty darn special. Any time that you need to make changes to your
    op-

    > erating system, you likely need to do them as root. Root has access to all files

    > on the system — even the personal ones in user accounts — and root can run

    > any program; even the programs that will completely destroy your computer.

    > Using your root account for day-to-day business is a bad idea. Use your user

    > account for everything you''d usually use your computer to do. If you need to

    > do something as root, you can log in specially to take care of the issue, and

    > then log back out.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_261_0.png)'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# ## Creating user accounts


    Because you created a user account for yourself when you installed Linux the first
    time around, you''ve probably done this already. However, depending on your distribution,
    you may have created a user account within the installation procedure and not
    as a regular root activity.


    Adding users is an extremely simple procedure. In fact, you''ll think longer about
    whether to give your nephew Larry an account on your machine than you will spend
    actually adding him.


    +   1. **Log in as root.**

    +      If you''re logged in to your user account, you can either log out and log
    in again as root, or you can use the KFM superuser mode described in the “Using
    KFM as the superuser” section later in this chapter.

    +   2. **Open a terminal window.**

    +   3. **Type adduser <username> at the command prompt.**

    +      Obviously, substitute your user''s choice of login ID for <username>. Add
    Lulu with the command adduser lulu.

    +   4. **Type passwd <username> at the command prompt.**

    +      You are prompted for a new password.

    +   5. **Enter a password.**

    +      This initial password can be anything you like and can violate all rules
    of correct passwording.

    +      You are prompted to verify the password.

    +   6. **Enter the same password again.**

    +      The user has been successfully added.

    +   7. **Exit the terminal window.**

    +   8. **Inform the new user of her username and password.**

    +      The new user should change her password immediately upon logging in for
    the first time. She can do this by typing passwd at a command prompt.


    # ## Using KFM as the superuser


    Assume you know that root is a powerful thing (as described in the section earlier
    in “The Multiuser Environment” earlier in this chapter) and that you''re happily
    logged in to your user account, doing whatever it is you like to do on your computer.
    You have this book open nearby, and as you scan through it, you realize there’s
    something you need to check while wearing your root hat.'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# Part IV: Under The Hood


    How do you get to root if you''re logged in as a user? Sure, you can log out of
    your user account and come back in as root, but that means shutting down all your
    active programs. That can be a little tricky if you''re chatting with Ksirc or
    listening to a CD.


    The trick lies in KFM. Use the file manager''s *superuser mode* to access root
    capabilities, get your task done, and then get back to whatever it was you were
    doing before:


    +   1. Open the KDE menu and choose **System:: File Manager (Super User Mode)**.


    A terminal window appears; it is not the regular KFM window. The terminal window
    contains a prompt for the *root* password, as shown in Figure 13-1.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_263_0.png)


    +   2. Enter the **root password** and press **Enter**.


    KFM appears. Notice that it''s showing the */root* directory, which it doesn''t
    do when in regular mode.


    +   3. Access the file or run the program for which you need root access.

    +   4. Choose **File::Close** to exit KFM.


    This is a useful way to check something quickly - a configuration file, for instance.


    # The perils of multiple users


    Let''s face it. People can be weird. Sometimes they can even be offensive. More
    often, they can get themselves into trouble without even knowing it.'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'That’s really quite easy in a Linux environment, especially if your users are
    new to Linux in general.


    What’s the systems administrator to do? Educate and inform. With proper explanations,
    your users are likely to feel more comfortable working on your system. You should
    also decide on some system policies and let your users know what they are. Better
    safe than sorry, right? Here are some ideas:


    +   ✓ Control password choice and change frequency. (See “Keeping Your Privacy
    Intact” at the end of this chapter for more ideas about passwords.) Make sure
    your users know that you will not tolerate sharing passwords.


    +   ✓ If you set a size limit on user accounts, let users know.


    +   ✓ Encourage your users to learn more about Linux, perhaps by working through
    Linux For Dummies, 2nd Edition (IDG Books Worldwide, Inc.) or a book specific
    to your Linux distribution (Red Hat Linux For Dummies, Caldera OpenLinux For Dummies,
    and the like). If you have a budding programmer on your machine, be clear about
    what kinds of programs you will and will not permit to be run.


    +   ✓ Offer help with file permissions and check over user accounts regularly
    to make sure permissions are set properly. (You don’t have to read the files,
    just check the permissions.)


    +   ✓ Explain to users how to check what programs are running in the user account
    (*hint*: type `ps x` at a command prompt — see Figure 13-2 for an example of the
    output) and how to get rid of processes that aren’t being used (`kill -9 processnumber`).
    This is especially useful if your machine has a tendency to crash.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_264_0.png)'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'Consider using the Message of the Day feature to inform your users of certain
    things. The message appears when using a text-based login; the user logs in and
    the message scrolls up the screen. You could provide a Tip of the Day, notice
    of impending downtime, or a reminder of system policy. If you use a graphical
    login, users can access the Message of the Day by opening a terminal window and
    typing **motd** at the prompt. Here’s how to set up a Message of the Day, or MOTD:


    +   1. **Log in as root.**

    +   If you’re logged in to your user account, you can either log out and log in
    again as root, or you can use the KFM superuser mode described in the “Using KFM
    as the superuser” section earlier in this chapter.

    +   2. **Create the file** /etc/motd .

    +   You can do this in a terminal window or with KFM.

    +   3. **In the file** /etc/motd , enter whatever text you’d like to display to
    your viewers.

    +   This file may contain a joke, a system downtime warning, or a reminder like
    “Change your password today.”

    +   4. **Save and exit the file.**


    Now that you’ve created the /etc/motd file, it is displayed whenever a user (including
    you) logs in using a text-based login. If you want to change the message, just
    edit the file. Encourage your users to pay attention to the MOTD. A sample MOTD
    is shown in Figure 13-3.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_265_0.png)'
  merge: -1
  img_proc: true
- pgno: 266
  md: "# Package Management\n\nIn the Linux world, packages aren’t something that\
    \ Federal Express or United Parcel Service employees bring to your door. Rather,\
    \ packages are a handy way to bundle together programs that you need in order\
    \ to install software on your computer. With the advent of multiple distributions\
    \ of the Linux software, several specialized package formats have appeared, including\
    \ the Red Hat RPM format and the Debian deb package format.\n\nWay back when the\
    \ earth was still cooling, when geeks were geeks and wrote assembly code for coffee-break\
    \ fun, all Linux software had to be installed by compiling it directly from raw\
    \ source code. Although it’s still a good idea to have a clue about installing\
    \ software in this way, it’s certainly a bit more complicated than many people\
    \ liked. It also takes some time to install from source code.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_266_0.png)\n\
    \n> **TECHNICAL STUFF**\n> \n> Interested in learning about source code installation?\
    \ Check out Appendix A. Although the appendix describes installing KDE source\
    \ code itself, you can get a pretty good idea of the process by reading through\
    \ it. You use much the same method to install any software that needs to be installed\
    \ directly from source code.\n\nA couple of the better-known Linux distributors\
    \ (the aforementioned Red Hat and Debian) had a bright idea. “Wouldn’t it be easier\
    \ for our users,” they thought, “if we had a specialized software that did most\
    \ of that tedious work automatically?” Thus, the package was born.\n\nPackages\
    \ contain precompiled binary software, software libraries, and other things required\
    \ to provide a complete and functioning installation of the given program. If\
    \ you installed Red Hat or Debian Linux, you also have a program that lets you\
    \ deal with their specialized package formats. Probably the best known of these\
    \ management programs is the Red Hat Package Manager, or RPM. RPM allows you to\
    \ install, uninstall, upgrade, and obtain information about a package. Package\
    \ managers for other distributions that use them have similar features, so the\
    \ Red Hat manager is focused on here.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_266_1.png)\n\
    \n> **TECHNICAL STUFF**\n> \n> If you’re not running Red Hat, it’s a good idea\
    \ to check out the specs for your particular package manager at the distribution\
    \ Web site. If you run a distribution that doesn’t use package managers, just\
    \ skip this section and move smoothly to the next.\n\nFor your package-management\
    \ needs, KDE provides a neat little tool called Kpackage. Kpackage gives you an\
    \ easy-to-use graphical interface to RPM, dselect (the Debian package manager),\
    \ and other, less well-known managers."
  merge: -1
  img_proc: true
