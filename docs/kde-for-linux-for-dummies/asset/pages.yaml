- pgno: 148
  md: 'Occasionally, remnants of an old theme stubbornly remain on your desktop, even
    after you apply a new theme or try to revert to the default desktop. The problem
    is usually caused by icon files in some of your local directories over-riding
    the systemwide default icons stored elsewhere. To cure the problem, follow these
    steps:


    +   1. Use Theme Manager to apply the Default theme.


    +   2. Use KFM to locate and delete any .xpm files you find in the following subdirectories
    of your home directory:


    ```

    ~/ .kde/share/icons

    ~/ .kde/share/icons/mini

    ~/ .kde/apps/kdeui

    ~/ .kde/apps/kfm

    ~/ .kde/apps/konsole

    ~/ .kde/apps/kpanel/pics

    ~/ .kde/apps/kpanel/pics/mini

    ~/ .kde/apps/kwm/pics

    ```


    +   3. Restart the KDE panel by clicking the KDE Menu button and choosing Panel::Restart.


    +   4. Redraw the desktop by right-clicking the desktop and choosing Refresh Desktop
    from the pop-up menu that appears.


    KDE should redraw your panel and desktop with the default icons.


    # Adding themes to Theme Manager


    The standard KDE installation includes a handful of themes that provide something
    for you to experiment with in Theme Manager. You find some nice themes in the
    standard assortment, but many more themes are available. KDE users around the
    world have been busy developing and sharing themes that can give your desktop
    dramatically different looks. You have a sizable collection of themes available
    for your use and new themes are being developed all the time. All you need is
    a copy of the theme file, which you can get by downloading it from the Internet.
    And you can easily add the new themes to Theme Manager to try on your own desktop.


    Theme Manager works with two kinds of themes — global themes and local themes.
    Global themes are available to all KDE users on your system, while local themes
    are available only to an individual user ID.'
  merge: -1
  img_proc: true
- pgno: 149
  md: "![](img/8dd43d91b80664e771e0c0a824d7392d_149_0.png)\n\n> **TECHNICAL STUFF**\n\
    > The only real difference between global themes and local themes is the location\
    \ of the theme files:\n> \n> Global themes are stored in the shared KDE directory\
    \ tree that is accessible by all users.\n> \n> Local themes are stored in a subdirectory\
    \ of the user's home directory, which is inaccessible by other users.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_149_1.png)\n\
    \n> **TIP**\n> If a local and a global theme have exactly the same name, the local\
    \ theme overrides the global theme in Theme Manager.\n\nAdding a global theme\
    \ to Theme Manager is a simple matter of copying the compressed archive file containing\
    \ the theme to the main, shared Themes directory—usually, *usr/share/apps/kthememgr/Themes*\
    \ or */opt/kde/share/apps/kthememgr/Themes*. (You need to be logged in as root\
    \ to do this.) After you copy the theme file to the global Themes directory, the\
    \ new theme appears in the theme list of all users the next time they open Theme\
    \ Manager.\n\nSimilarly, you can add local themes for an individual user by copying\
    \ theme files to the Themes directory located under the user's home directory\
    \ (*~/.kde/share/apps/kthememgr/Themes*). Or, you can add a local theme to Theme\
    \ Manager by following these steps:\n\n+   1. Click the KDE Menu button and choose\
    \ **Settings > Desktop > Theme Manager**.\n+   \n+      The Theme Manager dialog\
    \ box appears.\n+   \n+   2. Click **Add**.\n+   \n+      The Add Theme dialog\
    \ box appears, as shown in Figure 7-4.\n+   \n+   3. Navigate to the directory\
    \ where the new theme is stored and select the theme file you want to add to Theme\
    \ Manager.\n+   \n+      You can double-click folder icons in the Add Theme dialog\
    \ box's list box to navigate the directory tree and then select a theme file by\
    \ clicking it. Or you can type the path and filename of the desired theme file\
    \ in the Location text box.\n+   \n+   4. Click **OK**.\n+   \n+      Theme Manager\
    \ closes the Add Theme dialog box and copies the theme file into the local Themes\
    \ directory for the current user. The new theme appears on the list on the Installer\
    \ page of the Theme Manager dialog box, where you can select and apply it to your\
    \ desktop just like any other theme available in Theme Manager."
  merge: -1
  img_proc: true
