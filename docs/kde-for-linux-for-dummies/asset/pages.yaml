  md: '# # If you''re coming from a Mac . . .


    If you''re a longtime Mac OS user, you may want to incorporate some of the familiar
    appearance and features of your old fruit-flavored friend in your new KDE desktop.


    +   1. Use **Theme Manager** to apply the Nostalgia theme. Use all the available
    components.


    +   2. Open the **Display Settings** dialog box (right-click the desktop and choose
    **Display Properties** from the pop-up menu that appears), click the **Style**
    tab, select the **Draw Widgets** option and also select the **Menu Bar At Top**
    option. Click **OK** to close the dialog box and apply the settings.


    +   3. Open the **KPanel Configuration** dialog box (right-click the panel and
    choose **Configure** from the pop-up menu that appears) and, on the **Panel**
    tab, select **Bottom** as the location for the panel and select **Hide the taskbar**
    area. Click **OK** to close the dialog box and apply the settings.


    +   4. Hide the panel by clicking the **Collapse** button at either end of the
    panel.


    +   5. Drag the **Trash** icon to the lower-right corner of your screen.


    A fan of the Mac OS would probably be comfortable working on a KDE desktop configured
    similar to the one shown in **Figure 7-6**. Notice the application menu bar positioned
    at the top of the screen instead of inside the application window. To make the
    desktop even more Mac-like, you can populate the desktop with icons for all the
    programs and folders you use frequently.'
  merge: -1
