- pgno: 52
  md: '# Chapter 2

    Getting Around the Desktop


    +   In This Chapter

    +   * Running your programs in KDE

    +   * Using the icons on your KDE desktop

    +   * Working with the KDE equivalent of a Start menu

    +   * Using the Window List to find the right window

    +   * Helping yourself to KDE Help


    In the physical world, your office desk is the work surface where you spread out
    the projects you''re working on. The KDE desktop serves a similar purpose — it''s
    the work surface where you spread out the tools and documents you work with on
    your computer. Over the years, you''ve no doubt discovered the appropriate ways
    to use the tools available on your office desk. (You''ve probably discovered a
    few ways to use some of the things on your desk as fun distractions as well.)
    In this chapter, you discover how to use the tools you find on the KDE desktop.


    # Launching Applications


    KDE provides a convenient working environment for your Linux computer by furnishing
    a graphical user interface for the operating system. But for desktop workstations
    (as opposed to servers), it''s the application software, not the operating system,
    that really does the day-to-day work you use a computer for. For example, word-processing
    programs enable you to create letters, reports, proposals, and other documents;
    spreadsheets enable you to create budgets and statistical analysis and do other
    number-crunching projects; database programs keep track of everything from client
    lists to product inventories; Web browsers and e-mail programs enable you to access
    information and communicate on the Internet. Therefore, one of the most important
    functions of KDE is to provide convenient ways to launch the application programs
    you use every day.'
  merge: -1
  img_proc: true
- pgno: 53
  md: "KDE does, indeed, make launching applications easy. The primary KDE program\
    \ launch pad is the KDE menu, accessible by clicking the panel button with the\
    \ KDE logo on it. But choosing a program from the menu isn't the only way to launch\
    \ applications in KDE. In fact, you can use several techniques. Here's a summary\
    \ of the techniques:\n\n+   ✓ Choose a program from the KDE menu. (We explain\
    \ this technique in detail in this section.)\n+   ✓ Double-click the program's\
    \ desktop icon. (Program icons are covered in the next section of this chapter.)\n\
    +   ✓ Click the program's panel button. (For more information, just keep reading.)\n\
    +   ✓ Double-click an icon for a program file or a document file in a KFM window.\
    \ (See Chapter 4 for information on launching programs and opening document files\
    \ with the KDE file manager, KFM.)\n+   ✓ Execute a command from the KDE desktop.\
    \ (Read on to find out how.)\n+   ✓ Access the Linux command line from a terminal\
    \ window and type the commands to start the program. (See Chapter 12 for the details\
    \ on accessing the Linux command line from a terminal window.)\n\n# Running programs\
    \ from the KDE menu\n\nOne of the prominent features of the KDE desktop panel\
    \ is a button that you can click to display a menu of the applications available\
    \ to run in KDE. It works very much like the Windows 95 or 98 Start button, complete\
    \ with the cascading submenus that are so familiar to Windows users. The KDE menu\
    \ enables you to conveniently start a program with just a couple of mouse clicks.\n\
    \n> **REMEMBER**\n> \n> The KDE panel button with the KDE logo on it goes by a\
    \ variety of names, such as *K button*, *KDE button*, and *KDE logo button*; but\
    \ we just call it the *KDE Menu button* because that's what appears when you click\
    \ it. The menu itself is sometimes referred to as the *KDE application starter\
    \ menu*, but *KDE menu* seems so succinct, so we use that term in this book.\n\
    \nBefore you start criticizing the KDE menu as being too Windows-like, consider\
    \ how simple and efficient it is at organizing a large assortment of programs\
    \ and making them easily accessible. After all, why not use the successful features\
    \ of other user interfaces — especially when it makes learning KDE easier for\
    \ multitudes who have previously used Windows. And don't forget that KDE offers\
    \ several other ways to launch programs, so you don't have to use the KDE menu\
    \ if you don't want to."
  merge: -1
  img_proc: true
- pgno: 54
  md: 'To launch a program using the KDE menu, follow these simple steps:


    +   1. **Click the KDE Menu button in the panel.**

    +   The KDE Menu button is the one with the KDE logo (a big K and a gear) on it.
    The button is normally located at the left end of the panel. When you click the
    KDE Menu button, the KDE application starter menu appears.

    +   2. **Point to a menu item (such as Applications) with a right-facing arrow.**

    +   Pointing means to move the mouse pointer over the menu item and let it rest
    there for a second or so. A cascading submenu appears, as shown in Figure 2-1.

    +   3. **Click the desired program in the submenu.**

    +   KDE closes the menu and launches the selected program. Normally, the program
    appears in its own window on your desktop although some utilities might show up
    in the panel or other locations. Depending on the speed of your system and the
    size of the selected program, the program may appear immediately or it may take
    nearly a minute to show up on your desktop.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_54_0.png)'
  merge: -1
  img_proc: true
- pgno: 55
  md: "This technique works for all the standard KDE utilities, games, and other applications\
    \ listed on the default KDE menu. It also works for applications that you add\
    \ to the KDE menu manually or with the AppFinder utility (more on customizing\
    \ the KDE menu in Chapter 5). In some cases, choosing an item from the KDE menu\
    \ or one of its submenus doesn’t really launch a true application, but rather\
    \ opens a KDE configuration dialog box, issues a system command, or does something\
    \ of that sort instead.\n\nA few items on the KDE menu don’t have arrows indicating\
    \ the presence of submenus. Examples on the default KDE menu include KDE Help,\
    \ Home Directory, Lock Screen, and Logout. Clicking one of these menu items invokes\
    \ an action immediately instead of opening a submenu.\n\n# ## Launching a program\
    \ with a desktop icon\n\nIn your physical office, you probably keep most of your\
    \ tools and materials stored in your desk drawers, where they remain out of sight\
    \ but are relatively easy to access when you need them. But the stuff you use\
    \ the most is sitting out on your desktop where it’s instantly available.\n\n\
    KDE enables you to organize your computer desktop in much the same way. Most of\
    \ your programs are accessible from the KDE menu—out of sight but accessible with\
    \ about three mouse movements (click the KDE Menu button, point to expand the\
    \ appropriate submenu, and then click a menu item to launch the program). However,\
    \ for the programs you use the most, you can create desktop icons that sit in\
    \ full view on your computer desktop and are available with a single click of\
    \ the mouse.\n\nDesktop icons are simply links to files and resources stored elsewhere.\
    \ The icon can link to a program file, a shell script, a directory, a document\
    \ file, an Internet URL, or a file system device. If the link is to a document\
    \ file and KDE knows what application is associated with the document type, it\
    \ can automatically launch the appropriate program to open the file.\n\nUsing\
    \ a desktop icon to launch a program is simplicity itself; there’s only one step\
    \ involved:\n\n+   1. Click the desktop icon for the item you want to open.\n\
    +   \n+   KDE immediately takes the appropriate action to open the item associated\
    \ with the desktop icon.\n\nFor example, the Trash icon on your desktop is a link\
    \ to a special subfolder of your home directory where KDE temporarily stores files\
    \ that you want to delete. Clicking the Trash icon launches the KFM file manager\
    \ program and displays the contents of the Trash folder."
  merge: -1
  img_proc: true
- pgno: 56
  md: 'The default KDE desktop starts out with an assortment of desktop icons — mostly
    links to special-purpose folders (such as Autostart) and system devices (such
    as cdrom). However, you’re not stuck with this meager selection of icons. You
    can create your own desktop icons for the programs and documents you use the most.
    We show you how in the “Working with Desktop Icons” section of this chapter.


    # Launching a program with a panel button


    Icons on your desktop aren’t the only way you can instantly access your applications
    in KDE. You can also use panel buttons to launch programs. In addition to the
    KDE Menu button and the other special buttons such as the Window List, Toolbox,
    and virtual desktop buttons, the KDE panel is home to an assortment of buttons
    for individual applications and utilities.


    When you install KDE, it typically starts out with the panel that is populated
    with a set of program buttons for utilities such as KVT, Konsole, Khelp, KCalc,
    KNotes, Kedit, and KMail. Like so many other things in KDE, the selection of panel
    buttons is customizable. You can easily remove program buttons from the panel,
    add buttons for other applications, and move or rearrange the buttons on the panel.
    We show you how in Chapter 5.


    Launching a program with a panel button couldn’t be any simpler. You just click
    the button, and KDE instantly launches the associated application or utility.
    There are no menus to navigate or other selections to make — KDE just opens the
    program as fast as your system can access the related files.


    There’s a real advantage to launching programs from panel buttons as opposed to
    desktop icons. Desktop icons are often obscured behind the various windows that
    might be open on your desktop, whereas the panel usually remains visible on top
    of any open windows. Having the panel always visible makes panel buttons accessible
    without the need to first move or minimize (iconify) windows in order to uncover
    desktop icons. On the other hand, this advantage may not be as pronounced if you
    have your panel collapsed or configured to autohide (slip out of sight when it’s
    not in use). If the panel isn’t visible, you need an extra mouse action to bring
    the panel into view before you can click a panel button to launch your application.
    (Collapsing and expanding the panel is covered in Chapter 1, and setting the panel
    to Autohide is covered in Chapter 5.)


    # Instant access to typed commands


    Sometimes the fastest way to launch a program is to just issue a typed command.
    This is especially true if you’re a veteran Linux/UNIX command line user or if
    you need to launch an infrequently used program for which you haven’t set up a
    KDE icon, button, or menu item. Of course, you could launch'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'one of the KDE terminal emulation utilities (KVT or Konsole) and use it to
    interact with the operating system command line. (See Chapter 12 for more information
    on using the command line in a terminal window.)


    Issuing commands in a terminal window works, but KDE offers a simpler alternative
    for issuing commands that you can type on a single line. Just follow these steps:


    +   1. **Right-click the desktop and choose Execute Command from the pop-up menu
    that appears.**


    KDE opens the Command box as shown in Figure 2-2.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_57_0.png)


    +   2. **Type the command to launch your program and then press Enter.**


    KDE closes the Command box and passes the command to the operating system. Linux
    executes the command and launches your application. If you properly typed the
    command to launch a KDE or X Window program, the program window appears.


    **WARNING!** Be careful with commands you type in the Command box. Any command
    you enter is executed immediately and, unlike typing a command in a terminal window,
    you won''t see any error messages or other warnings that your command generates.
    The results of mistyping a command to launch a program are usually harmless (it
    doesn''t work and you have to try again), but using the Command box to enter system
    commands or to launch command-line programs may have unpredictable results.


    # Working with Desktop Icons


    Desktop icons are those little symbols, such as folders and a trash can, that
    start out on the left side of the default KDE desktop. Chapter 1 identifies the
    desktop icons you find on the default KDE desktop. They include icons for the
    Autostart and Templates folders, the Trash folder, and the CD-ROM and Floppy drives.
    But, as Figure 2-3 shows, you''re not stuck with that limited'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'assortment of icons. Just as you have an assortment of tools and papers on
    your physical desk, you can have an assortment of desktop icons on your KDE desktop
    so the files, folders, and programs represented by those icons are always within
    easy reach.


    When you click a desktop icon, the effect is the same as if you clicked the icon
    for the file or other resource represented by the icon — KDE launches the program
    and/or opens the file or folder. For example, if you click a desktop icon for
    a folder, KDE opens a KFM window and displays the contents of the linked folder.
    If you click an icon for a World Wide Web URL, KDE opens your Web browser (usually
    KFM), which then retrieves and displays the Web page found at the address recorded
    in the icon''s link file. If you click a desktop icon for a text file, KDE launches
    your text editor and loads the text file for editing.


    # TECHNICAL STUFF


    How does KDE know what program to use to open your file when you click a desktop
    icon for a text file or other file type? It identifies the file''s MIME type by
    its extension and uses the application that is associated with that MIME type
    to open the file. See Chapter 4 for information about associating specific programs
    with file types.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_58_0.png)


    # Figure 2-3: You can populate your desktop with a wide range of icons.'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'You can create desktop icons for all sorts of files and system resources, including
    the following:


    +   Files: A link to any document or other file on your system. Clicking a file
    icon opens the file in the appropriate program.


    +   Folders: A link to a directory anywhere in the file system. Clicking a folder
    icon opens a KFM window displaying the contents of the folder. Of course, to use
    the link, the target directory must be part of a mounted file system and you must
    have the proper access permission.


    +   File System Device: A link to a mountable device or directory such as floppy
    disk, CD-ROM drive, hard disks, and file systems from other machines. Clicking
    a device icon opens a KFM window and displays the contents of the device — if
    the device is already mounted. Otherwise KDE attempts to mount the device first
    and displays an error message if you lack the proper permissions to mount the
    device.


    +   FTP URL: The Internet address for the directory on an FTP (File Transfer Protocol)
    server. Clicking an FTP icon launches your FTP program and attempts to access
    the FTP address.


    +   Application: A link to an executable program (including shell scripts). Clicking
    an application icon launches the program.


    +   Internet Address URL: The address for a generic Internet resource. Clicking
    an Internet Address icon launches the appropriate program and attempts to access
    the URL.


    +   World Wide Web URL: The Internet address for a Web page. Clicking a Web address
    icon launches your Web browser and loads the Web page.


    The KDE desktop icons are actually graphic representations of link files stored
    in the Desktop subfolder of your home directory. The KDE link file specifies what
    icon to display and defines a link between the desktop icon and the file, program,
    or system resource the icon represents, but KDE doesn''t actually store the target
    of the link (or even a copy of it) on your desktop.


    # Arranging icons


    KDE starts out with the default desktop icons arranged in a neat column on the
    left side of your desktop. But you don''t have to leave the icons there any more
    than you have to leave the items on your real-world desk arranged the way they
    were when you first walked into your new office. You can rearrange your desktop
    icons any time you want.


    +   To move an icon, just click the icon and hold the left mouse button down as
    you drag the icon to a new location. Release the mouse button to deposit the icon
    at its new home.'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# # Chapter 2: Getting Around the Desktop


    ![](img/8dd43d91b80664e771e0c0a824d7392d_60_0.png)


    When you move an icon on your desktop, it may not stay exactly where you put it.
    KDE sets up an invisible grid on the desktop, and the icon automatically jumps
    to the nearest grid intersection when you move it. The grid helps keep icons from
    overlapping and makes it easy to maintain some semblance of order on your desktop.
    See Chapter 6 for information on adjusting the desktop grid setting.


    To have KDE automatically arrange your desktop icons for you, right-click the
    desktop and choose *Arrange Icons* from the pop-up menu that appears; then click
    **Yes** to confirm that you really want to rearrange your desktop icons. KDE arranges
    your icons into neat columns starting at the upper-left corner of the desktop.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_60_1.png)


    You may get a bit of a surprise when you let KDE arrange your desktop icons for
    you. The columns of icons may start farther out from the edge of the desktop than
    you expect. KDE positions the icons to leave room along the edges of the desktop
    for the panel and taskbar; therefore, if you configured the KDE panel or taskbar
    to be positioned on the left side of the desktop, the icons will be displaced
    to the right, toward the center of the desktop, even if the panel and taskbar
    are hidden at the time you rearrange the icons.


    # ## Creating your own desktop icons


    The desktop icons that appear on the default KDE desktop merely hint at what you
    can do with icons on your desktop. You can freely create, edit, and remove desktop
    icons to build a custom desktop environment that matches your own working style,
    complete with icons for the programs you use, the files you''re working on, and
    the Web sites you visit daily.


    # ### Creating a new desktop icon


    The technique you use to create a desktop icon varies somewhat depending on the
    kind of *icon* (or rather, on the kind of item the icon is linked to). Perhaps
    the simplest kind of desktop icon to create is a shortcut link to a file or folder.
    To create such an icon, follow these steps:


    +   1.  Open a KFM window and navigate to the directory containing the file to
    which you want to create a link.


    Make sure the file that you want to access with the desktop icon is displayed
    in the KFM window. (See Chapter 4 for information on using the KFM file manager
    utility.) The file can be a word-processing document, a spreadsheet file, a text
    file, or anything else you want. It can even be a folder. Also make sure that
    some portion of the KDE desktop is visible — don''t maximize the KFM window or
    allow all the KDE desktop to be obscured by other open windows. Minimize, resize,
    or move windows as needed to have access to both the contents of the KFM window
    and the desktop.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '+   2. Click the file icon and drag it out of the KFM window while holding
    the mouse button down. Release the mouse button to drop the file icon on a blank
    portion of the desktop.

    +   A pop-up menu appears, giving you the choice of Copy, Move, or Link.


    +   3. Choose Link.

    +   KDE creates a desktop icon linked to the selected file. The icon displays
    a small arrow in the lower-left corner to indicate that it’s a shortcut or link
    instead of the original file. The text label beneath the icon is a copy of the
    name of the file or folder to which the link points. Figure 2-4 shows a newly
    created desktop icon.


    In addition to a simple link to a file or folder, you can create several other
    kinds of desktop icons, such as icons for Web pages and other Internet resources
    and icons for file system resources. The following steps describe the process
    for creating a desktop icon for a Web page URL:


    +   1. Right-click the desktop and choose New World Wide Web URL from the pop-up
    menu that appears.

    +   A dialog box appears as shown in Figure 2-5 prompting you for the name of
    the New World Wide Web URL. The default is WWWURL.kdelink — the default filename
    of the link file that makes the desktop icon work.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_61_0.png)


    **Figure 2-4:**

    You can create a desktop icon for a file with a simple drag-and-drop operation.'
  merge: -1
