    # Using filters to adjust your photo


    If you’ve ever used a fancy 35mm single-lens reflex camera or watched some-one
    use one, you’ve probably seen the wide variety of *lens filters* — small round
    circles of colored glass or film — that photographers use to manipulate the way
    the image imprints on the film. Lens filters can adjust brightness, color, intensity,
    and so on.


    KView’s filter options can do many of the same things lens filters can, and some
    things that lens filters can’t. With KView’s filters, you can make many alterations
    to your photo that improve its appearance or make it seem like something completely
    other than it is. The basic uses of each of the KView filters are covered here,
    but spend some time experimenting with this fun option! You’ll find some strange
    and odd effects that may make your photo even more fun than the original.


    All of these options are located in KView’s Filter menu:


    +   1. Filter->Intensity->Brightness

    +      This filter is a brightness control. The base level of brightness is 100
    percent. If you enter a number smaller than 100, the image dims. If you enter
    a number larger than 100, the image brightens. Too much on either side results
    in a flat black or white image.


    +   2. Filter->Intensity->Gamma Correction

    +      This filter is a contrast control. (That’s not technically what gamma correction
    is, but it’s what most people use the filter to do.) The base level is 1. Enter
    a number larger than 1, and the image appears *washed out*, without much contrast.
    Enter a number smaller than 1 (you can use negative numbers), and the image looks
    darker, less colorful, and more “contrasty.”


    +   3. Filter->Grayscale

    +      This filter removes color from the image. If you have a scanned color photo
    that you’d like to have as a black and white image, use this filter to strip the
    color. Colors change into shades of grey. For obvious reasons, you won’t see any
    effect if you apply this filter to an image that is already in grayscale.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '`Filter:\u003eSmooth`


    This filter removes minute variations from the image. It''s great to make surfaces
    look more uniform, but be careful if there are a lot of edges in the image. Smooth
    tends to make edges blurry. Give it a try to see if you can live with the blurriness
    in order to make the rest of the image smoother.


    The filters provided in Kview are basic ones, though you can have a great deal
    of fun using them to transform your original picture to something quite different.
    They help you make a regular photo looking a bit better, so that you can e-mail
    it to a friend or put it on your Web page for the whole world to view. Think of
    Kview''s image-editing options as basic cable; you can get by just fine with the
    offerings included, but there may be some extra channels that would make you happy
    to have.


    If you really want to upgrade to the expanded cable of image-editing software
    for KDE, we suggest that you try The GIMP or another professional image-editing
    program. The filters and options available to you in such programs permit much
    more exact and specialized work with your images than does a basic viewer/editor
    like Kview.


    However, for most of us, doing photo editing in The GIMP is like putting a pig
    in a dress; no matter how much silk you drape over the pig, you still have a pig.
    The kind of photos that we want to share with friends and family are the pictures
    that we take at family events or on our vacations; they''re an amateur record
    of our lives, not a professionally designed portrait shot. Be proud of your pictures:
    Use Kview''s filters to fix the most glaring problems (over- and underexposure,
    lack of contrast, and so on) and get those photos to people who want to see them.


    # **Finishing up**


    After you have a version of your image just the way you want it, save it by using
    File>\u003cSave As. You can save multiple versions of the same image as long as
    you select a different name for each saved version. Try using the original image''s
    name with a version number: grandpa1, grandpa2, and so on.


    A quick word about image file formats: No matter how many options your image scanning
    software gives you, it''s best to save photos as JPG or GIF files. These are the
    two most popular image formats and those most likely to be readable in any given
    viewer. You may be perfectly capable of viewing TIFF (an uncompressed format)
    or PNG (a newer format) in your browser, but your Aunt Maylene may be using a
    very old version of Netscape that can only handle GIF or JPG. It''s always safe
    to use these formats when you''re sharing an electronic version of your images,
    whether as e-mail attachments or on Web pages.'
  merge: -1
  img_proc: true
- pgno: 236
  md: "# Posing for a Screenshot\n\nThere’s an urban legend that’s popular among techie-types:\
    \ the help-desk guy who asked the customer on the phone to take a screenshot and\
    \ send it to him so he could help her diagnose a computer problem. A week later,\
    \ a 3××-5 photograph arrived for him in the morning mail. Like most urban legends,\
    \ though, it’s easy to see where the confusion comes in.\n\nScreenshot sounds\
    \ a lot like snapshot, and it’s really much the same thing. A *screenshot* is\
    \ an image file created using specialized software “takes a picture” of whatever’s\
    \ on your monitor — no cameras needed. You may not need to use screenshots much,\
    \ if at all, in your daily life. There may come a time, though, when you need\
    \ to provide a screenshot to someone trying to solve a software problem. You may\
    \ even find yourself writing a computer book in a popular line of black and yellow\
    \ books — all the pictures in this book are screenshots from our computers.\n\n\
    For the screenshots in this book, we used a special little program that’s built\
    \ directly into KDE, called KSnapshot. (Yes, this does keep that confusion about\
    \ the difference between screenshots and snapshots. Rest assured that *you* know\
    \ the difference.)\n\nTo use KSnapshot, first get your desktop looking the way\
    \ you want it to look. Perhaps you want to take a shot of a new theme you built,\
    \ or you have a particular problem you want to document. After you have your desktop\
    \ in order, use the following procedure to take a screenshot:\n\n+   1. **Open\
    \ the KDE menu and select Graphics:Snapshot.**\n+   \n+   The KSnapshot window\
    \ appears, as shown in Figure 11-8.\n\n+   2. **Enter a name for the snapshot\
    \ in the Filename field.**\n+   \n+   As always, be as descriptive as you can.\
    \ “goldberg-theme” is better than “wrestling-theme,” which is better than “theme4.”\n\
    \n![](img/8dd43d91b80664e771e0c0a824d7392d_236_0.png)"
  merge: -1
  img_proc: true
- pgno: 237
  md: "3. Click the **Grab** button.  \nYour hard drive whirs as KSnapshot records\
    \ the image of your desktop. Depending on the amount of memory in your computer,\
    \ this may be a nearly instantaneous process or it may take a few seconds.\n\n\
    4. Click the **Save** button.  \nYour screenshot is saved under the filename you\
    \ selected in Step 2. If you’d like to look at it, open KView and view it as you\
    \ would any other image file.\n\n5. Click the **Close** button to leave KSnapshot.\n\
    \n![](img/8dd43d91b80664e771e0c0a824d7392d_237_0.png)\n\nWant to take a screenshot\
    \ but don’t want to take a picture of your entire desktop? You can take a screenshot\
    \ of a single window on your desktop. Just open KSnapshot, and select the Only\
    \ Grab the Window Containing the Cursor option; move the cursor onto the window\
    \ that you want to grab. This works best when you set a delay between the time\
    \ you click Grab and the time the computer actually takes the screenshot. Set\
    \ a delay by entering a number in the Delay field; if you enter a 2, KSnapshot\
    \ waits two seconds before grabbing, and so on. You can see the KSnapshot window\
    \ set up for a single-window grab in Figure 11-9.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_237_1.png)\n\
    \n# Grooving to the Music\n\nIf you like to type and tap your toes at the same\
    \ time, you’re not alone. Lots of people love to listen to music while they’re\
    \ on the computer. As you’ve probably noticed, a lot of popular music is composed\
    \ on the computer instead of on traditional instruments! There are several types\
    \ of sound files, just as there are several kinds of image files. Unlike image\
    \ viewers, though, sound utilities tend to be written for specific kinds of sound\
    \ file formats."
  merge: -1
  img_proc: true
- pgno: 238
  md: 'KDE sound utilities include Kscd, which allows you to play an audio CD in your
    computer’s CD-ROM drive; Kmedia, which plays files saved in the .wav format; and
    KMIDI Player, which plays MIDI files (as the alert reader probably guessed).


    Just like you can’t use mouse shortcuts if you don’t have a mouse, you won’t be
    able to listen to music via your computer if you don’t have both a sound card
    and a set of speakers. Sound cards range from low-priced basic cards to high-powered
    cards with their own on-board memory, designed for com-posers and audiophiles.
    It’s the same with speakers. Do some comparison shopping and see what best fits
    your desire and budget.


    # Kscd: For your massive music collection


    Wouldn’t it be convenient to plop your favorite CDs right into your computer to
    accompany your computing, without having to get up and slog across the living
    room to your stereo? KDE programmers thought so, and the result is Kscd, the KDE
    CD player. Use the following procedure to add a soundtrack to your hours in front
    of the monitor:


    +   1. Open your CD-ROM drive and insert an audio CD.


    +   2. Close the CD drive.


    You don’t need to mount the CD-ROM drive, as you would if you were using files
    on the disk. Kscd merely sends the audio data directly to your sound card, rather
    than interpreting it as a file structure.


    +   3. Open the KDE menu and choose Multimedia:CD-Player.


    The Kscd CD Player window opens, as shown in Figure 11-10.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_238_0.png)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_238_1.png)


    +   4. Use the familiar CD player buttons to manage the music.


    +   5. Click the X in the upper-right corner when you’re done to close Kscd.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Kmedia: For system sounds

    and riding the .wav


    The traditional sound file format for system sounds is .wav. System sounds are
    those little sound files that accompany various actions or results: e-mail arrival,
    closing a window, and so on. You can associate .wav files with actions on your
    computer or you can turn them off. If you want to listen to some .wav files to
    see if you want to use them, use Kmedia to check them out.


    +   1.  Open the KDE menu and choose Multimedia:Media Player.


    The Kmedia Media Player screen resembles a plain old tape deck, with Play, Stop,
    Rewind, Fast Forward, Beginning, and End buttons; see it in Figure 11-11.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_239_0.png)


    +   2.  Choose File:Open to select the .wav file you want to hear.

    +   3.  Use the Kmedia buttons to control how the file plays.

    +   4.  Choose File:Exit to leave Kmedia.


    # KMIDI Player: For the composer in you


    If you''re involved at all in musical composition on your computer, you likely
    have hardware that allows you to record MIDI files (Musical Instrument Digital
    Interface). If you are an aficionado of computer-composed music, you may have
    a source of MIDI files that contain the sounds you love.


    The KMIDI Player handles the MIDI sound file format with ease. Open the KDE menu
    and select Multimedia:MIDI Player to open it; the program operates much like Kscd,
    with standard CD-player buttons and functions. See Figure 11-12 for a glimpse
    of the KMIDI Player screen.'
  merge: -1
  img_proc: true
- pgno: 240
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_240_0.png)


    Chances are that if you''ve been hanging around the Internet long enough, you''re
    interested in _mp3 files_, which is a new compact file format that reproduces
    sound faithfully and is easy to create from prerecorded compact discs. The KDE
    .mp3 player utility is called Kmp3, and you can get it at `http://areas51.mfh-iserlohn.de/kmp3/`
    or via one of the file archives described in Appendix B. Kmp3 is not covered here
    because it''s still a fairly young program, and it''s single-use. Chapter 12 discusses
    RealPlayer, a multipurpose non-KDE program that handles .mp3 files with ease.
    If you''re determined to use a KDE program, Kmp3 is the one you want; if you also
    want to handle streaming audio and video from the Web, you want RealPlayer.


    # # Fun and Games


    Whether it''s a quick five-minute break from your work, or a multihour war against
    the computer, games are the secret friend of almost every computer user. The most
    effective games are often the simplest. Although it''s fun to blast through dungeons
    in a rousing game of Quake, it''s kind of hard to mask your bloodthirsty glee
    under a spreadsheeet when your boss (or spouse) walks by — and that doesn''t even
    take the blaring game sound into consideration!


    The KDE installation that''s included on this book''s CD-ROM includes the KDE
    games package. This package houses 15 small games, ranging from the traditional
    computer game, Solitaire, to more complex games of logic and multiplayer strategy
    games. Give each a try; you''re likely to find both old favorites and new obsessions
    in the basic games package.


    If these 15 games aren''t enough for you, remember to check out the file archives
    described in Appendix B. New KDE games are released frequently, at various levels
    of stability, and come in all flavors of entertainment.'
  merge: -1
  img_proc: true
- pgno: 241
  md: "Here's a quick introduction to the games included in the KDE games package:\n\
    \n+   • **Abalone**\n+   \n+   Abalone is a computer version of a popular German\
    \ board game. It's based on Chinese Checkers and involves the strategic positioning\
    \ of colored marbles on a hexagonal board.\n\n+   • **Asteroids**\n+   \n+   If\
    \ you're in your 30s, you lost part of your youth playing Asteroids in the video\
    \ arcade. (Yes, you did. Confession is good for the soul.) This is pretty much\
    \ the same game, although adapted for the mouse rather than the huge trackball\
    \ of the arcade version.\n\n+   • **KBlackBox**\n+   \n+   Those of you coming\
    \ to KDE from more traditional UNIX backgrounds may recognize a new interpretation\
    \ of the traditional emacs game BlackBox. It's kind of like Minesweeper: There\
    \ are hidden objects in black boxes and you must use the minimum number of laser\
    \ shots to locate them.\n\n+   • **Konquest**\n+   \n+   Konquest is a multiplayer\
    \ strategy game. The plot is that you and your buddies are all trying to gain\
    \ control of the galaxy and build an interstellar empire.\n\n+   • **Mah-jongg**\n\
    +   \n+   A computer version of the traditional Chinese tabletop tile game. Match\
    \ identical tiles to remove them from the pile. If you remove all the tiles, you\
    \ win.\n\n+   • **Minesweeper**\n+   \n+   A classic Windows game, redesigned\
    \ for KDE. Bombs hide under the tiles; use the hints to defuse the bombs and clear\
    \ large tiled areas. The difficulty level determines the number of tiles and bombs.\n\
    \n+   • **Patience**\n+   \n+   Basic Solitaire, with the remaining cards in a\
    \ turn-up pack at the side. This version has several levels of difficulty.\n\n\
    +   • **Poker**\n+   \n+   KDE Poker is the same five-card game that you find\
