- pgno: 226
  md: '# Chapter 11

    # Applications and Utilities, Part 2 — Play


    +   * Getting the picture with graphics utilities

    +   * Viewing and editing graphics

    +   * Taking screenshots

    +   * Playing some tunes with sound utilities

    +   * Having some fun with KDE games


    You work on your computer every day — you need a little time to relax and play!
    KDE offers several ways to bring that fun into your computing life — who knows,
    you may even find handy ways to use these great programs to enhance your work
    productivity!


    Some of the most popular software programs are those that allow you to edit images,
    like photographs or drawings, and those that let you play music through your computer
    speakers. (Of course, games are the real reason we all buy computers, aren’t they?)
    KDE has all of these things for you — yes, even the games — as part of the basic
    distribution. If you’re longing for a little more, search through the various
    Web sites described in Appendix B; you’ll find new games and programs designed
    to make your leisure time more electronically enhanced.


    > This chapter discusses various programs that work with image and sound files.
    In all cases, it’s assumed that you’ll use these programs in conjunction with
    your own creative efforts or with files you’ve obtained legally. Copyright law
    applies to digital media as much as it does to print or broadcast media; you really
    don’t want to get into trouble for altering a copyrighted image and claiming it
    as your own, or for obtaining a copyrighted file illegally. Trust us and the fine
    lawyers at IDG Books.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# ## Getting the Picture


    You’ve definitely seen the TV ads. You know, the ones for slobby new computers
    and last Internet access? The ones that say, “Our computer is perfect for sending
    pictures of little Leroy to Grandma and Grandpa”? Well, you don’t need a special
    kind of computer to play with graphics; you simply need good software. Luckily
    for you, KDE has some good basic graphics software built right in to its basic
    distribution.


    You should remember, though, that working with graphics is a memory-intensive
    thing. The more you ask of your computer, the slower it works. If you find working
    with graphics to be an indescribably boring task because you have to wait five
    minutes for every silly action, you definitely need more memory. You’ll also benefit
    from a larger hard drive, because graphics files are big, with some formats (like
    .tiff) producing astonishingly huge file sizes.


    The KDE graphics software is competent and useful for daily graphic fun. If you’re
    a professional, you’ll probably already have specific products that you use to
    generate the files that pay your bills, such as Adobe PhotoShop, Macromedia Fireworks,
    or the freeware program The GIMP. Some of us, though, are hopelessly unartistic,
    and are really, really happy to figure out how to get an overexposed photo’s contrast
    back to decent levels. It is for us that the KDE graphics programs exist.


    Have a lot of time to play with? Want to let your inner graphic artist out to
    play for a while? Check out The GIMP. You can find it, along with FAQs and tutorials,
    at www.gimp.org. GIMP stands for Graphic Image Manipulation Program; it’s basically
    a freeware version of Adobe PhotoShop. Be aware, though, that The GIMP and programs
    like it take a while to learn.


    # ### Viewing graphics


    Most of the time, all you want to do is view a graphics file. Maybe you got that
    photo of Leroy in your e-mail and you’d like to see what the little squirt is
    planning for Halloween, or perhaps your boss handed you a disk with the company’s
    new logo. No matter what format the file is saved in, you need to view the image
    with an image viewer.


    The KDE image viewer is called, imaginatively enough, KView. It’s a simple program;
    it opens images from your computer and shows them to you in a new window, as shown
    in Figure 11-1. It’s different from something like a Web browser in that you just
    see the image. Even if there’s something that looks like a hyperlink, you can’t
    click it. KView is the electronic version of the slide projector.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Figure 11-1:

    Sneak a peek with the KDE image viewer.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_228_0.png)


    To use KView, make sure you know the location of the graphics file you want to
    view, whether it’s on your hard drive or on a mounted CD or floppy. Follow these
    steps from there:


    +   1.  Open the KDE menu and choose **Graphics:: Image Viewer**.

    +       The KView window appears.

    +   2.  Choose **File:: Open**.

    +       Specify the file you want to open. (This is where you need to know the
    location of the image file.)

    +   3.  **KView displays the file.**

    +   4.  Choose either **File:: Open** to view another image file or **File:: Exit**
    to leave KView.


    # Editing graphics


    KView is a fantastic way to see image files. It also has some basic graphic editing
    functions, including crop, zoom, orientation, and a few filters. These are all
    the tools most people need to clean up their pictures. If you need more, or you
    feel constrained and limited by the range of KView’s offerings, you should definitely
    check out The GIMP or similar programs.


    This section talks about KView’s graphic editing tools as they apply to snapshots.
    Most people who use their computers for photographs are trying to get a finished
    product that will work on the Web or one that is good enough to send to family.
    Even the junkest photograph can often be improved a great deal with some judicious
    editing. Who knows? You may be so impressed by your skills at graphic editing
    that you’ll finally be able to share all those ugly vacation snaps that live in
    the shoebox in the hall closet.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_229_0.png)


    You can’t use your computer to work on a photo if it’s still on paper. In order
    to edit the image, you must have a digital version of the photograph. There are
    three ways to get digitized image files of your pictures:


    +   Go out and buy a digital camera.\nHave the photo shop put your images on a
    CD. (Kodak is interested in advancing this technology, so any Kodak affiliate
    will be able to get your photos put onto a CD.)\nScan the printed photo with a
    scanner. If you don’t want to buy a scanner yourself, ask local photocopy stores
    if they’ll scan your images to a floppy disk.


    # Resizing your photo


    There are two ways to resize an image: make it smaller or make it bigger. KView
    offers crop tools to cut an image’s size and zoom tools to enlarge it.


    # Cropping an image


    *Cropping* is the most effective way to fix an uninspiring photograph. Who hasn’t
    taken a shot that needed cropping? Perhaps the classic example is the “child at
    a famous place” shot, where little Tanya fits neatly to the lower-right corner
    of the picture while the Disneyland Matterhorn looms overhead. You have two choices
    with a picture like this: leave it as it is to prove that you actually were at
    Disneyland or crop it so you have a picture of Tanya on the happiest day of her
    four-year-old life. (Here’s a hint: There are millions of pictures of the Matterhorn,
    but only one of that grinning little girl.)


    Figure 11-2 is a photograph of a metal fish because we don’t actually know any
    four-year-olds named Tanya. Here’s how to crop an image with KView:


    +   1. Open the image file in KView, as described in the “Viewing graphics” section
    of this chapter.


    See Figure 11-2 for the original photo.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_229_1.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: '2. **Click one corner of the image** and simultaneously **drag the mouse diagonally.**


    A rectangular box follows your mouse''s path; the area contained in the box will
    be saved when you crop, and everything else will disappear.


    3. **Release the mouse button when you''ve selected the portion you want to save.**


    A shimmering line surrounds the selected area.


    4. **Choose Edit: Crop.**


    The selected portion of the image moves to the upper-left corner of the KView
    window and everything else disappears, as shown in Figure 11-3.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_230_0.png)


    **Figure 11-3:** The cropped picture puts all the emphasis on the fish.


    5. **To undo your crop, choose Edit: Reset.**


    The original image is restored.


    6. **Choose File: Save as after you have an image you''re happy with.**


    7. **Choose either File: Open to open another image file or choose File: Exit
    to leave KView.**


    **WARNING!**


    Before you start working with an image file, be sure to save a copy of it and
    work from the copy. If you make an irreparable mistake, you can make another copy
    from the original. If you work from the original and make an error, you have to
    rescan the image. (If you are using a digital camera, the photo opportunity may
    be long over.)


    # *Zooming an image*


    You can also change the size of an image by *zooming*, or expanding, certain portions
    of the image to a larger size. You should experiment with both crop and zoom to
    see which technique works best for your particular photograph or image. There
    are six types of zoom available in KView, which are described in Table 11-1.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Table 11-1 Zoom Types in KView


    | **Zoom Type** | **Effect** | |---|---| | Zoom in 10% | Increases the size of
    the image by 10 percent. Makes items in the photo appear larger. | | Zoom out
    10% | Reduces the size of the image by 10 percent. Makes items in the photo appear
    smaller. | | Double Size | Doubles the size of the image. | | Half Size | Cuts
    the image size in half. | | Max Size | Enlarges the size of the image to the size
    of the KView window. May stretch or squash the image, depending on the size of
    the KView window. | | Max Aspect | Enlarges the image to the size of the KView
    window, while retaining the height-to-width ratio of the original image. |


    To use the KView zoom feature, follow this procedure:


    +   1. **Open the image in KView.**

    +   2. **Choose Zoom→Zoom in 10%.**

    +   The photograph enlarges by 10 percent, making the objects in the image appear
    larger, as seen in Figure 11-4.

    +   3. **Choose Edit→Reset if you don’t like the result.**

    +   Your original image reappears.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_231_0.png)'
  merge: -1
  img_proc: true
- pgno: 232
  md: '+   4. Choose File:: Save As when you''ve zoomed the image to your liking.

    +   5. Choose either File:: Open to open another image file or File:: Exit to
    leave KView.


    # Crop or zoom? You make the call!


    Sometimes it''s not clear whether you would be better off cropping an image or
    zooming in on part of it. Keep in mind that both kinds of edits change the size
    of the image, but neither changes the picture quality. If you zoom in at a tremendous
    rate, eventually your picture will blur — due either to the quality of the original
    photo or the way it was scanned. Low-resolution scans, like 72 dpi (which is a
    good resolution for photos destined for the Web), appear blurry and pixeleted
    when zoomed too far.


    A good alternative is to crop the image judiciously and then zoom or resize it.
    That way, you can keep precisely what you want, delete the rest, and then decide
    how to handle the remaining image.


    # Transforming your photo


    Despite the menu''s neat name, KView''s Transform menu controls the image''s orientation.
    (Wouldn''t it be neat if it really did transform the images? It would bring a
    whole new level of swimsuit satisfaction to summer beach pictures.) You may not
    use this type of photo edit a lot, but it''s very useful when you do need it.
    See Figures 11-5, 11-6, and 11-7 for an idea of what the Transform menu does.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_232_0.png)


    Figure 11-5:

    The original image is a picture of the KDE mascot, Konqi.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_233_0.png)


    **Figure 11-6:**

    The original image of Kongi has been flipped vertically.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_233_1.png)


    **Figure 11-7:**

    The original image of Kongi has been rotated one quarter-turn clockwise.


    The Transform menu has four options, described in Table 11-2. Regardless of how
    you choose to alter the image’s orientation, we suggest that you work from a saved
    copy rather than the original.


    | Table 11-2 | Transform Options in KView |

    |---|---|

    | **Menu Selection** | **Effect** |

    | Flip Horizontal | The image flips from right to left: for example, the right
    side of the picture flips to the left. |

    | Flip Vertical | The image flips from top to bottom: for example, the top of
    the image is now the bottom. See Figure 11-6 for an example. |'
  merge: -1
  img_proc: true
- pgno: 234
  md: '| Menu Selection | Effect |

    |---|---|

    | Rotate Clockwise | The image rotates one quarter-turn clockwise (to the right).
    Select this option again to continue rotating in quarter turns. See Figure 11-7
    for an example. |

    | Rotate Counter-Clockwise | The image rotates one quarter-turn counterclock-wise
    (to the left). Select this option again to continue rotating in quarter turns.
