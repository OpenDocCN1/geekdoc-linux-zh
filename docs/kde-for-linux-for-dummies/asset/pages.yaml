- pgno: 259
  md: '# In this part . . .


    Here’s an easy riddle: How do you know someone is stranded on the freeway? Answer:
    The car’s hood is up, saying (in effect), There’s an engine in here — how am I
    supposed to know what to do with it? Well, not everybody has access to a shade-tree
    mechanic who can demonstrate which loose wire to connect, but as technology users
    go, the Linux crowd is made of harder stuff. They’re more like the European drivers
    who carry a toolkit in the trunk.


    Even as you enjoy the creature comforts of KDE, it’s wise to know what’s going
    on under that well-appointed surface. So this section gives you some handy pointers
    on how Linux actually works — and how you can take command of its workings when
    you need to. Talk about empowerment.'
  merge: -1
