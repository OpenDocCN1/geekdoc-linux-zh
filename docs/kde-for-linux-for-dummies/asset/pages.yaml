- pgno: 110
  md: '# Chapter 5


    Playing with the Panel


    # In This Chapter


    +   - Playing the panel shuffle

    +   - Add your most-used programs to the panel

    +   - Manipulating the menu


    If you settle into the driver''s seat of a well-designed car, you find all the
    controls you need to drive the car arranged within easy reach on the wheel or
    the dashboard. The steering wheel and gearshift are not only at your fingertips—but
    the lights, turn signals, cruise control, heater, and even the radio are all readily
    accessible.


    The KDE panel provides you with a similar level of convenient access to the command
    and control functions of your computer desktop. The panel enables you to launch
    programs, explore the file system, open virtual desktops, or log out with the
    click of a button. Just as the automotive dashboard, the panel even includes a
    convenient clock. You can use the taskbar to figuratively change gears by switching
    to another open window.


    One big difference between a computer and automobile is that the computer is a
    much more versatile device. The tasks and tools required to drive a car are highly
    predictable, which enables engineers to develop a standard dashboard that is functional
    for nearly everyone. However, you perform a much wider variety of activities with
    the computer, such as checking e-mail, browsing the Web, writing letters and proposals,
    creating graphics, and much more. So, your computer dashboard—the KDE panel—needs
    to be customized to fit the way that you use it in order to make the panel the
    powerful and convenient tool that it should be.


    As you discover in this chapter, KDE provides plenty of ways for you to customize
    the KDE panel and taskbar to tailor them to your preferences and working style.'
  merge: -1
  img_proc: true
- pgno: 111
  md: "# # Configuring the Panel and Taskbar\n\nThe KDE panel and taskbar start out\
    \ in a standard location and configuration that is determined by the KDE developers.\
    \ But you don’t have to stick with the default setup. You can move both the panel\
    \ and taskbar; you can hide them when they are not in use. You can change the\
    \ size of the icons in the panel; you can edit the names that appear on the virtual\
    \ desktop buttons. You can do all this and more.\n\nA few simple changes in the\
    \ panel and taskbar configuration can make a big difference in the appearance\
    \ and usability of your KDE desktop.\n\n# ## Positioning the panel and taskbar\n\
    \nPerhaps the most obvious change you can make to the KDE panel and taskbar is\
    \ to move them to another location on your desktop. The panel doesn’t have to\
    \ stay anchored to the bottom edge of the screen and the taskbar doesn’t have\
    \ to stay attached to the top. You can attach the panel to any one of the four\
    \ sides of the screen. You can move the taskbar to the top, bottom, or top-left\
    \ corner — or you can hide the taskbar completely. The choice is yours.\n\nTo\
    \ reposition the KDE panel and taskbar, follow these steps:\n\n+   1. **Click\
    \ the KDE Menu button and choose Panel: Configure, or right-click the panel and\
    \ choose Configure from the pop-up menu that appears.**\n+   \tThe KPanel Configuration\
    \ dialog box appears, as shown in Figure 5–1. The Panel tab is normally selected\
    \ after you first open the KPanel Configuration dialog box. If not, click the\
    \ Panel tab.\n\n+   2. **Select one of the four radio buttons in the Location\
    \ area.**\n+   \tThis specifies the location of the KDE panel. You can position\
    \ the panel on any one of the four sides of the desktop: top, bottom, left, or\
    \ right. The default panel location is Bottom.\n\n+   3. **Select one of the three\
    \ size options in the Style area.**\n+   \tThis option controls the size of the\
    \ buttons in the KDE panel. You can choose the default size, Normal; a smaller,\
    \ button size, Tiny; or a larger button size, ingeniously named Large.\n+   \n\
    +   \tThis option also indirectly controls the thickness of the KDE panel because\
    \ the panel thickness adjusts automatically to accommodate the button size."
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_112_0.png)


    +   4. Select **one of four radio buttons in the Taskbar area.**


    This option controls the location of the KDE taskbar. You have four choices:


    +   * **Hidden**: Suppresses display of the taskbar. If you don''t like the taskbar,
    you don''t have to use it. This is the choice for people who are using KDE on
    a low-resolution screen and can afford to devote screen space to the taskbar.
    (Hiding the taskbar is also the preferred option for KDE users who consider the
    taskbar just a little too Windows-like.)


    +   * **Top**: Positions the taskbar at the top edge of the screen (the default
    location).


    +   * **Bottom**: Positions the taskbar at the bottom edge of the screen or, if
    the panel is also located at the bottom, adjacent to the panel.


    +   * **Top/Left**: Positions the taskbar buttons in a column starting at the
    upper-left corner of the screen and continuing as far down the left side of the
    screen as necessary to accommodate a button for each running application.


    +   5. Click the **Apply** button.


    KDE redraws the panel using the settings you specify.


    Figure 5-2 shows a KDE desktop with the panel on the right side of the screen
    and taskbar in the top-left position. This is just one of the many combinations
    of panel and taskbar locations you can select. (Note that KDE automatically moves
    the desktop icons to the right to make room for the taskbar buttons.)'
