    | Russian | www.kde.org/international/russia/index.html |

    | Slovakian | www.kde.org/international/slovakia/index.html |


    # Treasures Waiting to Be Found


    The KDE site is not the only place you can find new applications or upgrades of
    your KDE package. Most of the major Linux download sites now have areas for KDE
    programs, and some even have areas devoted to KDE themes.


    # freshmeat.net


    When you''re looking for Linux software, the best place to start your search is
    at Freshmeat, which you can find at www.freshmeat.net.


    Freshmeat is the most popular repository for Linux programs on the Web. To narrow
    the archives to KDE-specific programs, just type **KDE** into the search box at
    the top of the home page and click Search.'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# linuxberg.com


    Linuxberg is the Linux side of the most popular Windows software archive, Tucows.
    Find Linuxberg and its chilly penguins at www.linuxberg.com.


    After you select your geographic region (to speed download times), you see the
    Linuxberg home page. Wander through the site, search for KDE programs, or look
    for packages that match your Linux distribution. Linuxberg even offers a full
    array of KDE themes, with subjects ranging from religious topics to military scenes.
    After you begin downloading, you''ll find that it is faster than downloading from
    sites that use a single machine.


    # kde.tdyc.com


    Looking for a KDE program packaged specifically for a Red Hat or Linux machine?
    Head to the KDE Linux Packaging Project at http://kde.tdyc.com.


    The Packaging Project takes the files uploaded to various KDE file archives and
    reformats them. The result is a collection of KDE programs compressed in the formats
    most easily installed by Red Hat (rpm) and Debian (deb). This is a good place
    to look if you''re having trouble installing a program that''s not specifically
    packaged for your system.


    # kde.themes.org


    This site contains nothing but KDE themes. You can find news about KDE themes,
    and the themes themselves at http://kde.themes.org.


    If you make a theme you really like and want to share, upload it so that others
    can join in and use your creative idea. You can view screenshots from any of the
    themes before you begin to download; there''s also an extensive how-to page, which
    includes a couple of automatic theme installation scripts.


    # Self-Proclaimed News for Nerds


    The main source for Linux and Linux-related conversation on the Web is Slashdot,
    which you can find at www.slashdot.org. Any discussion about KDE on the Net is
    going to find its way to Slashdot sooner or later.


    You don''t have to be a geek to read Slashdot, but it helps. The volume of messages
    can be overwhelming; pick and choose what you want to read.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_351_0.png)'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# ## Appendix C


    # # What’s on the CD-ROM


    # *In This Appendix*


    +   ▷ Hardware you need

    +   ▷ Software you want

    +   ▷ Guidance you can’t live without


    **B**ecause we’re such helpful folks, here’s a little dog-and-pony show to tell
    you about that flying-saucer thingy at the back of the book. Enjoy!


    # ## *System Requirements*


    Make sure your computer meets the minimum system requirements listed below.


    +   ✓ A PC with a 486 or faster processor.

    +   ✓ A working installation of Linux.

    +   ✓ A working installation of X Window System (this may have been installed
    when you installed Linux).

    +   ✓ At least 16MB of total RAM installed on your computer.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_352_0.png)


    Because KDE is a graphical interface, it will work much better the more RAM you
    have installed, and the better chip you have. A Pentium, Pentium-II, or PentiumPro
    class processor with 64MB of RAM or more will work much better than the minimum
    requirements outlined above.


    +   ✓ At least 150MB of hard drive space available to install all the software
    from this CD.

    +      You’ll need less hard drive space if you don’t install every program.

    +   ✓ A CD-ROM drive — double-speed (2×) or faster.

    +   ✓ A sound card.

    +   ✓ A monitor capable of displaying at least 256 colors or grayscale.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_352_1.png)'
  merge: -1
  img_proc: true
- pgno: 353
  md: "If you need more information on the basics, check out *PCs For Dummies*, 7th\
    \ Edition, by Dan Gookin (IDG Books Worldwide, Inc.).\n\nFor more basic Linux\
    \ information, you can also check out *Linux For Dummies*, 2nd Edition, by Jon\
    \ “Maddog” Hall (IDG Books Worldwide, Inc.).\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_353_0.png)\n\
    \nIf your computer doesn’t match up to most of these requirements, you may have\
    \ problems in using the contents of the CD.\n\n# How to Use the CD\n\nTo install\
    \ KDE or the other software on this CD, you will need to mount the CD-ROM drive.\
    \ The installation process for KDE itself is described in Appendix A. To install\
    \ the programs on this disk, use the following process and the information in\
    \ Appendix A as complementary references.\n\n# General installation from source\
    \ code\n\n+   1.  **Insert the CD-ROM into your computer’s CD-ROM drive.**\n\n\
    +   2.  **Make sure you are logged in as root.**\n+   \n+   If you are not logged\
    \ in as root, you may log out of your user account and log back in as root, or\
    \ use the Kfm superuser method described in Part IV.\n\n+   3.  **As root, issue\
    \ the command mount -t iso9660 /dev/cdrom /mnt/cdrom.**\n+   \n+   This command\
    \ mounts the CD-ROM drive, giving you access to the files on the book’s CD.\n\n\
    +   4.  **Issue the command mkdir /usr/src/KDE.**\n+   \n+   This command creates\
    \ a new directory for your source code packages.\n\n+   5.  **Issue the command\
    \ cp /mnt/cdrom/TGZ/* /usr/src/KDE.**\n+   \n+   This command copies the files\
    \ from the CD-ROM drive to the directory you created in Step 4.\n\n+   6.  **Use\
    \ the procedure in Appendix A to install the packages.**"
  merge: -1
  img_proc: true
- pgno: 354
  md: "# # Installation from .rpm (Red Hat and compatible distributions)\n\nIf your\
    \ Linux distribution is either a Red Hat Linux distribution or uses the Red Hat\
    \ .rpm packaging standard, you may use this process instead of the source code\
    \ process described above.\n\n+   1. Insert the CD-ROM into your computer's CD-ROM\
    \ drive.\n+   2. Make sure you are logged in as root.\n+   \tIf you are not logged\
    \ in as root, you may log out of your user account and log back in as root, or\
    \ use the Kfm superuser method described in Part IV.\n+   3. As root, issue the\
    \ command mount -t iso9660 /dev/cdrom /mnt/cdrom.\n+   \tThis command mounts the\
    \ CD-ROM drive, giving you access to the files on the book's CD.\n+   4. Issue\
    \ the command cd /mnt/cdrom/RPM.\n+   \tThis command moves you to the RPM directory.\n\
    +   5. Use the .rpm procedure in Appendix A to install the packages.\n\n# ## What\
    \ You'll Find\n\nAll of these programs are freeware and released under either\
    \ the GNU Public License (GPL) or Qt Public License (QPL). As a Linux user, you\
    \ should be familiar with the GPL and its derivatives, and with the implications\
    \ for your use of the software. Copyright ownership of, and distribution terms\
    \ for, each program are stated in each program's primary directory and/or primary\
    \ file archive. You can learn more about the GPL at http://www.gnu.org.\n\nWhere\
    \ possible, we've mentioned each program's home page at the point where the package\
    \ was discussed in the text. See especially Chapter 17 and Appendix A for more\
    \ information about each of these packages.\n\n# ## Basic KDE packages\n\nThe\
    \ basic KDE packages are described in Appendix A. The following packages are required\
    \ in order to install KDE: kdebase, kdelibs, and kdesupport if you're running\
    \ Debian Linux or don't have the included libraries already installed. The other\
    \ KDE packages are recommended, because you'll need them in order to try out various\
    \ things we describe throughout the book: kdeadmin, kdegames, kdegraphics, kdemultimedia,\
    \ kdenetwork, kdeutils, and korganizer."
  merge: -1
  img_proc: true
- pgno: 355
  md: '# Non-KDE programs


    You also find all the programs described in Chapter 17: WebMaker, Kstocks, Kpilot,
    Empath, Quickshow, KVoicecontrol, Kfortune, Katchit, Kwintv, and KWebwatch.


    # Koffice


    As described in Part II, Koffice is an array of fully featured office programs.
    We''ve included Koffice on this disk; you''ll probably want to download an updated
    version from http://www.kde.org if one is available, as Koffice is only available
    as an alpha release at the time of writing. The Koffice team predicts a beta release
    in the winter of 2000.


    # If You''ve Got Problems (Of the CD Kind)


    If you follow the procedures outlined in Appendix A and in this appendix, you
    should have little trouble installing these programs. Of course, there is no guarantee
    of anything in the Linux world, especially when discussing youthful software like
    KDE and even younger programs like those written as additions to the basic KDE
    packages.


    We selected programs for this CD that were generally regarded as stable enough
    for general user installation. You''ll find a great many more programs written
    for KDE in various Internet archives; while we use some of them, we chose not
    to include those that may require a more advanced understanding of Linux or basic
    programming to operate safely on your individual computer.


    If you have the basic minimum requirements described earlier in this appendix,
    these packages should work for you. Individual oddities can cause trouble, though;
    your computer may have an unusual architecture, or your Linux distribution may
    not like the packages very well. You may also simply need more RAM.


    If you have bad luck with the CD, we suggest that you consider downloading the
    packages from http://www.kde.org directly; packages may have been improved or
    debugged in the time between this book''s deadline and the day you purchased it.
    If you''re having trouble with general Linux installation, you''ll probably want
    to consult your local Linux guru or a good Linux reference text.


    If you know that the trouble lies with installing the items from the CD, and not
    from KDE, please call the IDG Books Worldwide Customer Service phone number: 800-762-2974
    (outside the United States: 317-572-3342).'
  merge: -1
  img_proc: true
