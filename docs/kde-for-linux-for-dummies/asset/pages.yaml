- pgno: 96
  md: 'principal exception is running a program from an archive. In order to run a
    program, you must first copy the program file and its supporting files from the
    archive to a regular folder on your hard drive so the operating system can find
    and access all the necessary files.


    # Changing the appearance of the file manager


    As with most KDE features, you can customize the appearance of the KFM window.
    The preceding sections of this chapter show you how to change the view, show thumbnails,
    and add the tree panel to the KFM window. But that''s not all you can do. Check
    out these configuration options:


    ![](img/8dd43d91b80664e771e0c0a824d7392d_96_0.png)


    +   * Choose Options→Show Menubar to remove the menus from the KFM window.


    There is no easy way to restore the menu bar to a KFM window after you turn it
    off. Your best bet is to close the menuless KFM window and open another KFM window
    with its default settings intact.


    +   * Choose Options→Show Statusbar to remove the status bar from the bottom of
    the KFM window. Choose the command again to restore the status bar.


    +   * Choose Options→Show Locationbar to toggle the Location bar (the one with
    the big Location or address box) on or off.


    +   * Choose Options→Show Toolbar to remove the toolbar from the KFM window. Choose
    the command again to restore the toolbar.


    +   * Choose Options→Configure File Manager to open the KFM Configuration dialog
    box. The settings on the Font and Color tabs enable you to select the fonts and
    colors KFM uses to display file lists in the KFM window.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_96_1.png)


    The most interesting settings are on the Other tab, shown in Figure 4-9. There
    you can specify the default programs to use as your terminal emulator and text
    editor. Another useful setting is the Tree View Follows Navigation option. Select
    this option to force KFM to automatically update the Tree panel to show the current
    directory selection, even when you navigate to a different directory by clicking
    a folder in the right panel of the KFM window. (Personally, I don''t understand
    why this option isn''t enabled by default. It should be!) After adjusting the
    settings, click OK to close the KFM Configuration dialog box and apply the settings.'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'Figure 4-9:

    The KFM Configuration dialog box contains some important settings.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_97_0.png)


    When you get KFM configured the way you like it, choose Options Save Settings
    to make the current KFM configuration the default. New KFM windows will then appear
    with the same view and other configuration settings as the current KFM window,
    instead of the original installation defaults.


    # ## Creating a New Folder


    Creating new document files is something that you probably do in your various
    application programs. But creating the folders in which to store those documents
    is a job for KFM. To create a new folder, follow these steps:


    +   1. Open KFM and navigate to the location where you want to create the new
    folder.


    You can use any of the techniques mentioned elsewhere in this chapter to open
    a KFM window and to navigate to the directory in which you want to create the
    new subfolder.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_97_1.png)


    In order to create a new folder, you must have appropriate access permissions
    for the directory where you are creating it. If you are logged on under a regular
    user name, you are generally restricted to creating new folders in your home directory
    and its subdirectories. If you are logged on as the superuser, root, then you
    can create folders anywhere in the file system.


    +   2. Choose File New Folder or right-click the KFM window and choose New Folder
    from the pop-up window that appears.


    KFM opens the dialog box shown in Figure 4-10, prompting you for the name of your
    new folder.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/8dd43d91b80664e771e0c0a824d7392d_98_0.png)


    +   3. **Type a name for the new folder** and then click the **OK** button.


    KFM closes the dialog box and creates the new folder. The folder name and icon
    appear in the KFM window.


    After you create a new folder, you can copy and move files into it (see the “Copying
    and Moving Files” section of this chapter) and use the folder as the location
    in which you create new document files.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_98_1.png)


    When you create a new folder, it starts out with the access permissions set to
    allow you, the owner, full access and to prevent all other users (except the superuser)
    from accessing the directory. If you want to allow others to access your new folder,
    you must change its permission settings. To do that, follow these steps.


    +   1. **Right-click** the folder name or icon in the KFM window and choose **Properties**
    from the pop-up menu that appears.


    KFM opens a dialog box where you can edit the properties of the selected folder.
    (You can use the same technique to edit the properties — including access permissions
    — for files as well as folders.)


    +   2. Click the **Permissions** tab.


    KFM displays the options shown in Figure 4-11.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_98_2.png)'
