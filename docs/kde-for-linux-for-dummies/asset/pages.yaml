- pgno: 343
  md: '✓ **kdemultimedia (RECOMMENDED):** In this package you find the various sound
    and multimedia-related applications. The sound utilities described in Chapter
    11, such as KsCD, are in this package.


    ✓ **kdeadmin (RECOMMENDED):** These are the various system administration programs.
    More will be added to this package as KDE matures. It currently contains the user
    manager and the System V run level editor.


    ✓ **kdegames (RECOMMENDED):** If you want to play the games described at the end
    of Chapter 11, such as Asteroids or Mah-jongg, you need this package. Yes, it’s
    optional on a purely technical level, but it’s required for fun.


    ✓ **kdtoys (RECOMMENDED):** This package contains fun little surprises that don’t
    do anything critical, but can get you to crack a smile on a bad day. For example,
    this package contains Mouspeedometer, which is basically an odometer for your
    mouse. Odd, but funny.


    ✓ **KOrganizer (OPTIONAL):** If you want to take advantage of the KOrganizer,
    as described in Chapter 10, you need to install this package.


    By now, you’ve probably figured out that the authors of this book think it’s best
    to install everything at once. That way, you can work through the book at your
    own pace, but you won’t have to delay trying something out until you find and
    install the requisite package.


    # # Installing the Software


    Now that you’ve downloaded all the packages, you can begin installing them. This
    section contains instructions for installing Red Hat `.rpm` files, Debian `.deb`
    packages, and straight source code.


    Install kdesupport first, if you need it; then install kdelibs. You can install
    the remaining packages in any order, but they require functions from the libraries
    contained in the first two packages.


    # ## Installing KDE on a Red Hat Linux system


    In order to install Red Hat RPM packages, you should run Red Hat Linux. Other
    distributions may have a utility that permits using `.rpm` files, but when you’re
    installing software that affects your operating system, it’s best to be safe.
    Use the procedure described in this section to install KDE to a Red Hat system.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'In order to install packages on a Red Hat Linux system, you need to be root.
    If you''re logged into a user account, you need to log out and log again as root.
    You also need to be at a command prompt; if you''re in some sort of windowed system,
    you need to either exit to a command prompt, or open a terminal window.


    +   1.  At the command prompt, type the following command:

    +       rpm -ivh <package name>.rpm

    +       The v and h flags are optional, but they give you some visual feedback
    that lets you keep track of how your installation is going.

    +   2.  Repeat the command for each package you want to install.

    +   3.  Log out of the root account.

    +   4.  Log back in to your user account.

    +   5.  Type *usekde* at the command prompt.

    +       A couple of system messages show up on your screen while your computer
    sets KDE as your default user interface. As soon as the messages stop, you''re
    ready to test.

    +   6.  Type *startx* to start the X Window System.

    +       If you''re already running X Windows for some reason, shut it down and
    restart it.

    +       If KDE opens, you''ve successfully installed it! Congratulations!


    If KDE is not running, something went wrong during the installation. Try re-installing,
    following this procedure to the letter. If it still fails, go back a step, re-download
    the packages, and reinstall. If that doesn''t work, consult Chapter 16 for more
    advanced sources of help.


    # Installing KDE on a Debian Linux system


    Debian packages install according to the FHS, or File Hierarchy Standard.

    As with Red Hat, Debian installations require that you work from a command line
    and that you be logged in as root. If you are currently logged into a user account,
    log out and back in again with your root password.


    +   1.  At the command prompt, type the following command:

    +       dpkg -i <package name>.deb

    +   2.  Repeat the command for each package you want to install.

    +   3.  Log out of the root account.

    +   4.  Log back into your user account.'
  merge: -1
  img_proc: true
- pgno: 345
  md: '+   5. Type `usekde` at the command prompt.

    +   A couple of system messages appear on your screen while your computer sets
    KDE as your default user interface. When the messages stop, you''re ready to test.


    +   6. Type `startx` to start the X Window System.

    +   If you''re already running X Windows for some reason, shut it down and restart
    it.

    +   If KDE opens, you''ve successfully installed it! Congratulations!


    If KDE is not running, something went wrong during the installation. Try reinstalling,
    following this procedure to the letter. If it still fails, go back a step, re-download
    the packages, and reinstall. If that doesn''t work, consult Chapter 16 for more
    advanced sources of help.


    # ## Installing KDE from source code


    Installing KDE from source code is a bit more involved, but it''s not at all difficult.
    In fact, you will probably find it helpful to understand how to install programs
    from source code packages. There will not necessarily be a specialized distribution-specific
    package for whatever distribution you use, for whatever program you want. Learning
    to install from source code means that you will always have the ability to get
    the software onto your computer from the basic format.


    As Martha Stewart would say, "It''s a good thing."


    The process of installing from source code is a three-parter. First, unpack the
    source files; second, install them; third, start KDE. Follow along with the sequence
    given here to get KDE installed in a jiffy.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_345_0.png)


    You need to be at a command-line prompt to use this method. If you''re logged
    in to a window manager or another desktop program, exit it and work in regular
    text mode. You need to be logged in as root, so exit any user account you''re
    using now and log in again as root.


    +   1. Locate the KDE packages you downloaded.

    +   If you made a note of the location when you downloaded, good for you. You
    may also want to establish the habit of always downloading into the same directory,
    perhaps using the ingenious directory name of `download`. (If you upload a lot
    of files, you may want to create a sister directory called `upload` as the natural
    home for those items.)


    +   2. Move the package files into an appropriate directory.

    +   The choice is yours, but common places for this are either `/tmp` or `/usr/src`.'
  merge: -1
  img_proc: true
- pgno: 346
  md: "+   3. **Type** `tar xvfz kdesupport.tgz` **at the prompt.**\n+   \n+   You\
    \ must install the kdesupport package first in order to install libraries needed\
    \ by future packages.\n+   \n+   When you use the `tar` command with the `xvfz`\
    \ flags, you're decompressing the files. Source files usually come in compressed\
    \ formats so that they take up less space during download and on the FTP server.\n\
    +   \n+   The package creates its own subdirectory with the same name as the **package**:\
    \ in this case, the **subdirectory** `kdesupport`.\n\n+   4. **Type** `tar xvfk\
    \ kdelibs.tgz` **at the prompt.**\n+   \n+   This unpacks the kdelibs libraries\
    \ package and creates a `kdelibs` subdirectory.\n\n+   5. **Continue to unpack\
    \ the source packages with the command** `tar xvfk <packagename>.tgz`.\n\n+  \
    \ 6. **Move into the subdirectory housing the kdesupport package.**\n+   \n+ \
    \  To change directories, type `cd <packagename>`.\n\n+   7. **Configure kdesupport\
    \ by typing** `./configure` **at the prompt.**\n\n+   8. **Type** `make` **at\
    \ the prompt.**\n+   \n+   `make` is the **main** command that starts the compiler\
    \ and builds the binary package. Many messages scroll up your screen as you do\
    \ this; this is just the compiler letting you know what it's doing. You won't\
    \ need to worry about this unless you get a rare error message.\n+   \n+   If\
    \ you get an error message, read it. It will often alert you to what you need\
    \ to do.\n\n![](img/8dd43d91b80664e771e0c0a824d7392d_346_0.png)\n\n+   9. **Type**\
    \ `make install` **at the prompt.**\n+   \n+   This command moves the binary packages\
    \ into their new and proper directories.\n\n+   10. **Return to the previous level\
    \ of directories by typing** `cd ..` **at the prompt.**\n\n+   11. **Move into\
    \ the** `kdelibs` **subdirectory by typing** `cd kdelibs`.\n\n+   12. **Configure**\
    \ `kdelibs` **by typing** `./configure` **at the prompt.**\n\n+   13. **Type**\
    \ `make` **at the prompt.**\n\n+   14. **Type** `make install` **at the prompt.**\n\
    +   \n+   This command moves the binary packages into their new and proper directories.\n\
    \n+   15. **Return to the previous level of directories by typing** `cd ..` **at\
    \ the prompt.**\n\n+   16. **Move into the subdirectory housing the kdbase package\
    \ by typing** `cd kdbase`."
  merge: -1
  img_proc: true
- pgno: 347
  md: '+   17. Learn about kdbase''s options by typing ./configure -- help at the
    prompt.


    The kdbase package has some special configuration options that may be applicable
    to your installation. When you''ve determined what options you want to use, move
    to the next step.


    +   18. Configure kdbase by typing ./configure at the prompt.


    +   19. Type make at the prompt.


    +   20. Type make install at the prompt.


    +   21. Return to the previous level of directories by typing cd .. at the prompt.


    +   22. Use the same procedure for each of the recommended, but optional, packages
    that you want to install.


    +   23. Change into the subdirectory containing the package by using cd <subdirectory-name>.


    +   24. Configure the package by typing ./configure at the prompt.


    Check with ./configure -- help to see if there are special options for your particular
    installation.


    +   25. Type make at the prompt.


    +   26. Type make install at the prompt.


    +   27. Return to the previous level of directories by typing cd .. at the prompt.


    +   28. Log out of the root account.


    +   29. Log back in to your user account.


    +   30. Type usekde at the command prompt.


