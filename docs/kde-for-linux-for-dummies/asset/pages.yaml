- pgno: 64
  md: '+   7. Click OK.

    +   KDE closes the properties dialog box and records the settings for the desktop
    icon. The desktop icon is ready to use. You can simply click the icon to begin
    loading the target Web page into your Web browser.


    You can use essentially the same technique to create other kinds of desktop icons
    such as icons for file system devices, applications, or other Internet resources.
    Just select the appropriate icon type in place of the World Wide Web URL in Step
    1. You can choose File System Device, FTP URL, Application, or Internet Address
    URL. Then, in Steps 4 and 5, select the corresponding tab in the properties dialog
    box and fill in the appropriate settings as prompted.


    Naturally, the settings for a link to a file system device or an application are
    a little different from the settings for a Web page or other Internet URL, but
    the basic idea of defining a link is the same. In order to define an icon for
    a file system device, you need to be familiar with device addresses and mount
    points. And to define all the settings for an application, you need to know a
    little about MIME types and the files associated with the application, in addition
    to the name of application''s executable file.


    # Editing a desktop icon


    You can make changes to desktop icons any time you want. For example, you can
    select a different icon for display on the desktop. Simply right-click the icon
    you want to change and choose Properties from the pop-up menu that appears. A
    dialog box appears, where you can edit all the same settings you used to define
    the icon and its link in the first place. (See Steps 3 through 6 in the procedure
    for creating a desktop icon.) Edit the settings as needed and then click OK to
    close the dialog box and record your changes.


    # Removing desktop icons


    If you have too many icons cluttering your desktop, it''s easy to get rid of a
    few of them. To remove an icon from your desktop, just drag it onto the Trash
    icon. The icon disappears from the desktop and the link file is stored in the
    Trash folder until you delete it permanently by emptying the trash. To remove
    an icon permanently in one step, right-click the icon and choose Delete from the
    pop-up menu that appears, and then confirm the action by clicking Yes in the KFM
    Warning box that appears.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_64_0.png)


    Removing a desktop icon only removes the icon and its link file — it doesn''t
    affect the original file, folder, file system device, or URL referenced by the
    link.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Getting Around with the Window List


    If you’re like most people, your real world desk soon gets cluttered with books,
    folders, and papers for your various projects. Finding the item you want often
    takes a little shuffling to excavate it from a stack of other items.


    Similarly, your KDE desktop can quickly get cluttered with numerous open windows
    that often obscure other windows. In addition, you might have mini- mized some
    windows so that they aren’t visible on your desktop at all. Add the prospect of
    multiple virtual desktops that may be lurking out of sight, each populated with
    its own assortment of windows, and you have a situa- tion that could make locating
    a particular window a challenge.


    Fortunately, KDE provides a tool that greatly simplifies the job of finding any
    window on any of your KDE desktops. The Window List button in the panel gives
    you instant access to any window—it’s a sort of index of all the open windows
    on your KDE system. To use the Window List, follow these steps:


    +   1. **Click the Windows List button in the panel.**


    KDE displays a pop-up menu listing all the open windows, organized by desktop.
    (See Figure 2-9.)


    ![](img/8dd43d91b80664e771e0c0a824d7392d_65_0.png)


    +   2. **Select a window name from the Window List menu.**


    KDE instantly brings that window to the foreground, switching desktops if necessary.


    The Window List and the taskbar both perform similar functions. You can select
    an open window by clicking its button on the taskbar or by selecting the window
    name from the Window List menu.'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'The taskbar (described in Chapter 1) has the advantage of being visible on-screen
    all the time (if you choose to configure it that way instead of hiding it from
    view). As a result, you can select a window with the taskbar with a single click
    on the corresponding taskbar button. However, as the taskbar gets crowded with
    buttons for numerous windows, the button labels are often truncated due to lack
    of space, which can make it difficult to identify which button is linked to which
    window.


    The Window List, on the other hand, provides a much more complete description
    of each window, even when the menu is populated with numerous windows. On a crowded
    desktop, the better descriptions shown in the Window List make identifying the
    window you want much easier and more than offset the extra click required to pop
    up the Window List and then select the window from the menu.


    # # Getting Help


    Help is never far away when you''re using KDE. Even if you''re using your laptop
    computer on a deserted island and you don''t have this book, you can still get
    instant advice on how to use KDE and its many features. That''s because the KDE
    online documentation is never more than a couple of mouse clicks away.


    If you''re an experienced Linux/UNIX user, you''re undoubtedly accustomed to having
    online documentation available in the form of man pages. And a few man pages are
    devoted to KDE. However, the bulk of the KDE documentation is available in a much
    more attractive and accessible form. The KDE online help files are stored in HTML
    format (the same format used for Web pages), and a special Kdehelp utility is
    included to display both traditional UNIX-style man pages and the HTML-formatted
    KDE Help documents. The Kdehelp utility (shown in Figure 2-10) is accessible from
    many places within the K Desktop Environment and using it to view help documents
    is as simple as viewing Web pages in your browser.


    +   - To open Kdehelp from the desktop, right-click the desktop and choose Help
    On Desktop from the pop-up menu that appears.

    +   - To open Kdehelp from the panel, click the KDE Help button.

    +   - To open Kdehelp from the KDE menu, choose KDE Menu K\u00c6†: KDE Help.

    +   - To open Kdehelp from almost any program window, choose Help K\u00c6†: Contents.'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'Regardless of how you access the Kdehelp utility, the result is the same: The
    Kdehelp window appears, displaying the help document associated with the part
    of KDE you were using when you opened kdemenu. For example, if you access Kdehelp
    from the desktop, you get the generic KDE Help index, but if you access help from
    within a KFM window, you see the help files for the KFM file manager utility.


    +   - To navigate within a KDE Help document, click on an underlined link to view
    the related information. It’s just like following links on a Web page displayed
    in your Web browser.


    +   - To move back or forward through the Help pages you’ve viewed, click the
    Previous or Next buttons in the Kdehelp toolbar.


    +   - To display the Contents page, click the Contents button in the Kdehelp toolbar.


    +   - To load another help file, choose Files→Open, select a file from the Open
    dialog box that appears, and then click OK to close the dialog box and display
    the file.


    +   - To search for a help topic by keyword, choose Files→Search to display the
    KDE Help Search page shown in Figure 2-11, enter the search term in the Enter
    Keywords box, select the checkboxes to define the scope of the search, and then
    click Submit Search. Kdehelp displays the results of your search as a list of
    links. Click a link to display the related page.


    ![](img/8dd43d91b80664e771e0c0a824d7392d_67_0.png)


