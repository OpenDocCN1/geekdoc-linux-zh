  md: "# Quick Access to Web Addresses\n\nIf you want a quick way to open your browser\
    \ and load a Web page for viewing, try this:\n\n+   1. **Right-click the desktop\
    \ and choose Execute Command from the pop-up menu that appears.**\n+   \n+   \
    \    KDE opens the Command box.\n+       2. **Type the Web page URL and press\
    \ Enter.**\n+   \n+       KDE closes the Command box, opens your browser (usually\
    \ KFM), and then loads and displays the Web page you requested. Of course, if\
    \ the Web address is located beyond your local file system or network, you must\
    \ have an Internet connection active or else have your system configured to automatically\
    \ initiate a dial-up connection.\n\nIf the server name portion of your Web address\
    \ starts with www, you can omit the http:// part of the URL.\n\n# Getting to the\
    \ Root of the Matter\n\nIf you find yourself often needing to switch user modes\
    \ between a regular user and the superuser after you perform command-line operations,\
    \ you can appreciate the Konsole utility's Root Console feature. It's very useful\
    \ for mounting CDs and floppv disks and other such tasks. To use the Root Console,\
    \ follow these steps:\n\n+   1. **Open Konsole. (Choose KDE Menu->Utilities->Konsole\
    \ or click the Konsole button on the panel.)**\n+   \n+       KDE opens a Konsole\
    \ terminal emulation window and the command line prompt appears. At this point\
    \ you log on under your normal user name.\n+       2. **Choose File->Root Console.**\n\
    +   \n+       Konsole starts a second terminal session as the superuser, root,\
    \ and prompts for your root password. The new session is running in the same Konsole\
    \ window."
  merge: -1
