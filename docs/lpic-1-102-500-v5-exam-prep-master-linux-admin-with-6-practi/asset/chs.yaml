  * D) `cancel`\n\n**解释**\n`lpmove` 命令用于将 CUPS 中的打印任务从一个打印队列移动到另一个。\n\n## 问题 63\n\
  哪种传输协议确保所有数据包都正确交付，并验证数据包的完整性和顺序？选项有：\n\n* A) `TCP` (正确)\n* B) `UDP`\n* C) `ICMP`\n\
  * D) `HTTP`\n\n**解释**\n传输控制协议 (TCP) 通过提供错误检查和数据包排序机制，确保数据包可靠且有序的交付。\n\n## 问题 64\n\
