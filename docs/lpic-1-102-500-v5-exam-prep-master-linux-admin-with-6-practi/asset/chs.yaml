  \n### 解释\n选项 B 通过 `env` 命令列出所有环境变量，并将输出通过给 `grep` 来过滤变量名，从而在整个环境中搜索变量 `mammal`。\n\
  \n---\n\n## 问题 7\n\n通过两个连续命令创建一个名为 `BIRD` 值为 `penguin` 的环境变量：哪些命令可以创建一个名为 `BIRD`\
