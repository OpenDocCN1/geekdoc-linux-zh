  \n* 将所有来自邮件设施（mail facility）且优先级/严重性为 `crit`（及以上）的消息发送到 `/var/log/mail.crit`：`mail.*;mail.crit\
  \ /var/log/mail.crit`\n* 将所有来自邮件设施且优先级为 `alert` 和 `emergency`（紧急））的消息发送到 `/var/log/mail.urgent`：`mail.alert,mail.emerg\
  \ /var/log/mail.urgent`\n* 除来自 `cron` 和 `ntp` 设施的消息外，将所有消息（无论其设施和优先级如何）发送到 `/var/log/allmessages`：`!cron,\
  \ !ntp /var/log/allmessages`\n* 在先配置好所有必要设置的情况下，使用 TCP 并指定默认端口将所有来自邮件设施的消息发送到 IP\
  \ 地址为 `192.168.1.88` 的远程主机：`mail.* @@192.168.1.88:514`\n* 无论其设施如何，将所有优先级为 `warning`（仅限警告优先级）的消息发送到\
  \ `/var/log/warnings`，以防止过度写入磁盘：`*.warning /var/log/warnings`\n\n* A) 是\n* (正确)\n\
  * B) 否\n\n## 问题 51\n\n检查针对 `/etc/logrotate.d/samba` 以下段落的解释是否正确。\n\n| 段落 | 解析 |\n\
  | :--- | :--- |\n| `weekly` | 指定日志轮转频率为每周一次。 |\n| `missingok` | 如果日志文件缺失则忽略错误。 |\n\
  | `rotate 7` | 仅保留 7 个轮转日志文件。 |\n| `postrotate` | 在日志轮之后执行后续块中的命令。 |\n| `endscript`\
  \ | 标记日志轮配置中脚本部分的结束。 |\n| `compress` | 启用对轮转日志文件的压缩。 |\n| `delaycompress` | 延迟压缩到下一个轮转周期。\
  \ |\n| `notifempty` | 不轮转空日志文件。 |\n\n* A) 正确\n* (正确)\n* B) 不正确\n\n## 问题 52\n\n在“模板和过滤条件”部分中，我们探索了基于表达式的过滤器作为过滤条件。另一种\
  \ `rsyslogd` 特有的过滤器类型是基于属性的过滤器。将基于表达式的过滤器转换为基于属性的过滤器：\n\n| 基于表达式的过滤器 | 基于属性的过滤器\
  \ |\n| :--- | :--- |\n| `if $FROMHOST-IP=='192.168.1.4' then ?RemoteLogs` | `?`\
  \ |\n\n选项为：\n\na) `if $syslogfacility-text == 'remote' then ?RemoteLogs`\nb) `if\
  \ $fromhost-ip == '192.168.1.4' then ?RemoteLogs`\nc) `if $hostname == '192.168.1.4'\
  \ then ?RemoteLogs`\nd) `if $msg contains 'RemoteLogs' then ?RemoteLogs`\n\n* a)\
  \ `if $syslogfacility-text == 'remote' then ?RemoteLogs`\n* b) `if $fromhost-ip\
  \ == '192.168.1.4' then ?RemoteLogs`\n* (正确)\n* c) `if $hostname == '192.168.1.4'\
  \ then ?RemoteLogs`\n* d) `if $msg contains 'RemoteLogs' then ?RemoteLogs`\n\n####\
  \ 解析\n\n- 基于属性的过滤器是 `if $fromhost-ip == '192.168.1.4' then ?RemoteLogs`。\n- 基于表达式的过滤器使用变量\
  \ `$FROMHOST-IP`。\n- 基于属性的过滤器使用特定的属性 `$fromhost-ip`。\n\n\n\n\n\n### A) CIDR 表示法：`/27`,\
  \ 网络地址：`172.16.30.224`, 广播地址：`172.16.30.255`, IP 数量： 30\n\n### B) CIDR 表示法：`/26`,\
  \ 网络地址：`172.16.30.192`, 广播地址：`172.16.30.255`, IP 数量： 62\n\n### C) CIDR 表示法：`/28`,\
  \ 网络地址：`172.16.30.192`, 广播地址：`172.16.30.223`, IP 数量： 32\n\n### D) CIDR 表示法：`/27`,\
  \ 网络地址：`172.16.30.192`, 广播地址：`172.16.30.255`, IP 数量： 32\n\n* A) CIDR 表示法：`/27`,\
  \ 网络地址：`172.16.30.224`, 广播地址：`172.16.30.255`, IP 数量： 30\n* (正确)\n* B) CIDR 表示法：`/26`,\
  \ 网络地址：`172.16.30.192`, 广播地址：`172.16.30.255`, IP 数量： 62\n* C) CIDR 表示法：`/28`, 网络地址：`172.16.30.192`,\
  \ 广播地址：`172.16.30.223`, IP 数量： 32\n* D) CIDR 表示法：`/27`, 网络地址：`172.16.30.192`, 广播地址：`172.16.30.255`,\
  \ IP 数量： 32\n\n### 解释\nCIDR 表示法由子网掩码中前导 1 位的数量决定。网络地址通过对 IP 和子网掩码进行按位与（AND）操作得到的。广播地址通过将网络地址中的所有主机位都设置为\
  \ 1 得到的。主机可用的 IP 数量通过从子网中的地址总数减去 2（网络地址和广播地址）计算得出。\n\n## 问题 62\n主机上需要什么设置才能允许与不同逻辑网络中的主机进行\
  \ IP 通信？选项：\n* A) 默认网关\n* (正确)\n* B) 子网掩码\n* C) MAC 地址\n* D) DNS 服务器\n\n### 解释\n\
  默认网关用于将流量从主机路由到本地网络之外的目标。\n\n## 问题 63\n为什么以 127 开头的 IP 范围以及 224 之后的范围没有包含在 IP 类\
  \ A、B 或 C 中？选项：\n* A) 它们分别保留用于回环地址和组播地址\n* (正确)\n* B) 它们保留用于私有网络\n* C) 它们保留用于广播地址\n\
  * D) 它们保留用于特殊用途地址\n\n### 解释\n以 127 开头的 IP 范围保留用于回环地址，224 之后的范围保留用于组播地址。\n\n## 问题\
