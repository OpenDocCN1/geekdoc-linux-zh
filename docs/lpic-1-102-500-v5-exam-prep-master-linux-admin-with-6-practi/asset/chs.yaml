  * C) 将用户的密码设为空\n* D) 从 sudoers 文件中移除该用户\n\n### 解释\n将用户的 shell 更改为 `/sbin/nologin`\
  \ 可以防止他们登录。\n\n## 问题 75\n通常使用哪个超级守护进程（superdaemon）来管理网络服务并按需启动？\n\n* A) init\n*\
  \ B) systemd\n* C) xinetd\n* (Correct)\n* D) cron\n\n### 解释\n`xinetd` 是一种常用的管理网络服务并按需启动的超级守护进程。\n\
  \n## 问题 76\n哪种类型的端口转发允许外部访问你私有网络上的主机？\n\n* A) 本地端口隧道\n* B) 远程端口隧道\n* (Correct)\n\
