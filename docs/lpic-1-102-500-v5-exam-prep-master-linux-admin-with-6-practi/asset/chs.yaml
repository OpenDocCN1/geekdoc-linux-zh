  * `BIRD=penguin`\n* `set BIRD`\n* C)\n* `set BIRD=penguin`\n* D)\n* `export BIRD=penguin`\n\
  \n### 解释\n选项 A 将变量 `BIRD` 的值设置为 \"penguin\"，然后使用 `export` 命令将其导出到环境中。\n\n---\n\n\
