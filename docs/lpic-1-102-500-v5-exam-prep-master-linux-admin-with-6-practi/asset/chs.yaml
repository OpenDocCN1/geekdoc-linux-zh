  \ Linux 能力并获得 LPIC-1 认证的极佳工具。\n\n## 问题 1：\n在 Bash 中如何将局部变量转换为环境变量？\n\n* A) 使用 `declare`\
  \ 命令\n* B) 使用 `export` 命令\n* (正确)\n* C) 使用 `set` 命令\n* D) 使用 `env` 命令\n\n### 解释\n\
  `export` 命令用于将 Bash 中的局部变量变为环境变量。\n\n## 问题 2：\nBash 中使用哪个命令来取消变量？\n\n* A) `delete`\n\
  * B) `remove`\n* C) `unset`\n* (正确)\n* D) `clear`\n\n### 解释\n`unset` 命令用于在 Bash\
  \ 中取消或删除变量。\n\n## 问题 3：\nBash 中 `env` 命令的目的是什么？\n\n* A) 列出所有环境变量\n* B) 设置环境变量\n\
  * C) 在修改后的环境中执行程序\n* D) 以上所有\n* (正确)\n\n### 解释\n`env` 命令可以用于列出所有环境变量、设置环境变量以及在修改后的环境中执行程序。\n\
  \n## 问题 4：\n哪个环境变量存储了当前用户主目录的绝对路径？\n\n* A) `USER`\n* B) `HOME`\n* (正确)\n* C) `PATH`\n\
  * D) `SHELL`\n\n### 解释\n`HOME` 环境变量存储了当前用户主目录的绝对路径。\n\n## 问题 5：\nBash 中的环境变量 `HISTCONTROL`\
  \ 控制什么？\n\n* A) 存储在内存中的命令数量\n* B) 检查新邮件的频率\n* C) 哪些命令被保存到历史文件中\n* (正确)\n* D) 系统的区域设置（locale）\n\
  \n### 解释\n`HISTCONTROL` 环境变量控制 Bash 中哪些命令会被保存到历史文件中。\n\n## 问题 6：\n哪个环境变量存储了 Bash\
  \ 提示符的值？\n\n* A) `PS1`\n* (正确)\n* B) `PS2`\n* C) `PS3`\n* D) `PS4`\n\n### 解释\n`PS1`\
  \ 环境变量存储了 Bash 提示符的值，控制其外观。\n\n## 问题 7：\n观察“命令(s)”列下的变量赋值，并检查提供的结果变量是“True（正确）”还是“False（错误）：\n\
