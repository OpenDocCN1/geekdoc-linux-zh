  \ `uptime` 使用点作为小数点分隔符。\n\n## 问题 29\n\n`iconv` 命令将所有目标字符集之外的字符替换为问号。如果向目标编码后附加 `//TRANSLIT`，则目标字符集中未表示的字符将用一个或多个外观相似的字符替换（转写）。如何使用此方法将一个名为\
