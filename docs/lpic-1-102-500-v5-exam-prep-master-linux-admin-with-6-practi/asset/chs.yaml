  \n* A) `usermod`\n* (正确)\n* B) `chuser`\n* C) `erexpiry`\n* D) `passwd`\n\n### 解释\n\
  选项 A 是更改过期的正确命令。`chage` 命令用于查看和修改过期信息。\n\n## 问题 37\n添加一个名为 emma 的新用户，UID 为 1050，并将\
