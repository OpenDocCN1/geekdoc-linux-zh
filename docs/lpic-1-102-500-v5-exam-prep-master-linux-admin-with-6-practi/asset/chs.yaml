  \n通过编辑用户家目录下的 `.forward` 文件并添加转发地址，用户可以自动转发入站邮件。\n\n## 问题 41\n\n名为 office-mgr 的本地工作站上刚安装了一个新打印机。使用哪个命令可以将该打印机设置为该工作站的默认打印机？选项：\n\
