  \n## 问题 34\n按照习惯，哪些 ID 被分配给系统账户，哪些分配给普通用户？选项有：\n\n* A) 系统账户拥有小于 1000 的 UID，普通用户拥有大于\
  \ 1000 的 UID\n* (正确)\n* B) 系统账户拥有小于 1000 的 GID，普通用户拥有大于 1000 的 GID\n* C) 系统账户拥有大于\
  \ 1000 的 UID，普通用户拥有小于 1000 的 UID\n* D) 系统账户拥有大于 1000 的 GID，普通用户拥有小于 1000 的 GID\n\
  \n### 解释\n选项 A 准确描述了习惯。\n\n## 问题 35\n如何确定一个之前可以访问系统的用户账户现在已锁定？假设你的系统使用影子密码。选项有：\n\
  \n* A) 检查 `/etc/passwd` 文件开头是否有感叹号（!）\n* B) 检查 `/etc/shadow` 文件开头是否有感叹号（!）\n* (正确)\n\
  * C) 使用 `passwd -S` 命令检查用户账户状态。\n* D) 使用 `chage -l` 命令检查密码过期信息。\n\n### 解释\n选项 B\
  \ 是正确的，因为在 `/etc/shadow` 文件中，密码开头的感叹号（!）表示账户已锁定。\n\n## 问题 36\n使用 `useradd -m` 命令创建一个名为\
  \ christian 的用户账户，并识别其用户 ID（UID）、组 ID（GID）和 shell。选项有：\n\n* A) UID 自动分配，GID 为 1000，shell\
  \ 为 `/bin/bash`\n* (正确)\n* B) UID 自动分配，GID 为 1001，shell 为 `/bin/bash`\n* C) UID\
  \ 自动分配，GID 为 1000，shell 为 `/bin/sh`\n* D) UID 自动分配，GID 为 1001，shell 为 `/bin/sh`\n\
  \n### 解释\n选项 A 是正确的，因为 `useradd -m` 命令会自动分配 UID，将 GID 设置为 1000（通常是主用户用户组），并将默认 shell\
  \ 设置为 `/bin/bash`。\n\n## 问题 37\n识别 christian 的主组名称。你可以推导出什么？选项有：\n\n* A) christian\n\
  * (正确)\n* B) users\n* C) christian\n\n\n\n\n\n- D) users\n\n### 解释\n选项 A 正确识别了用户\
  \ `christian` 的主组，按照惯例，该组通常与用户名相同。\n\n## 问题 38\n使用 `getent` 命令查看 `christian` 用户账户的密码过期信息。选项：\n\
  \n* A) `getent passwd christian`\n* B) `getent shadow christian`\n* (正确)\n* C) `chage\
  \ -l christian`\n* D) `passwd -S christian`\n\n### 解释\n选项 B 正确，因为 `getent` 命令用于查询\
  \ `/etc/nsswitch.conf` 中配置的数据库条目，而 `shadow` 是存储密码过期信息的数据库。\n\n## 问题 39\n一旦你使用 `at`\
  \ 调度了一个任务，如何查看其执行命令？选项：\n\n* A) `atq`\n* (正确)\n* B) `at -l`\n* C) `at -v`\n* D)\
  \ `at -c`\n\n### 解释\n选项 A (`atq`) 用于列出用户待处理的 `at` 任务。\n\n## 问题 40\n你可以哪些哪些命令来查看待处理的\
  \ `at` 任务？你会使用哪些命令来删除它们？选项：\n\n* A) 使用 `atq` 查看，使用 `atrm` 删除。\n* (正确)\n* B) 使用 `at\
  \ -l` 查看，使用 `at -r` 删除。\n* C) 使用 `at -v` 查看，使用 `at -d` 删除。\n* D) 使用 `at -c` 查看，使用\
  \ `at -x` 删除。\n\n### 解释\n选项 A 正确。`atq` 列出待处理任务，`atrm` 移除它们。\n\n## 问题 41\n在 systemd\
  \ 中，哪个命令作为 `at` 的替代方案？选项：\n\n* A) `timed`\n* B) `timerctl`\n* C) `systemctl`\n*\
  \ (正确)\n* D) `timedatectl`\n\n### 解释\n选项 C 正确。`systemctl` 为使用 systemd 调度任务提供了 `at`\
  \ 的替代方案。\n\n## 问题 42\n创建一个 `at` 任务，在在今年 10 月 31 日上午 10:30 运行位于主目录下的 `foo.sh` 脚本。假设你以普通用户的身份操作。\n\
  \n* A) `echo \"/path/to/foo.sh\" | at 10:30 AM October 31`\n* (正确)\n* B) `cat \"\
  /path/to/foo.sh\" | at 10:30 AM October 31`\n* C) `grep \"/path/to/foo.sh\" | at\
  \ 10:30 AM October 31`\n* D) `list \"/path/to/foo.sh\" | at 10:30 AM October 31`\n\
  \n## 问题 43\n以普通用户登录系统，并创建一个在明天上午 10:00 运行 `bar.sh` 脚本的 `at` 任务。假设脚本位于用户的家目录下。\n\n\
  * A) True\n* (正确)\n* B) 错误\n\n## 问题 44\n作为普通用户，创建一个在明天上午 10:00 运行 `bar.sh` 脚本的 `at`\
  \ 任务。假设脚本位于用户的家目录下：`echo \"~/bar.sh\" | at 10:00 AM tomorrow`\n\n* A) 正确\n* (正确)\n\
  * B) 错误\n\n## 问题 45\n根据命令 `date` 的以下输出，系统在 GMT 表示法下的时区是什么？\n\n```\n$ date\nMon Oct\
  \ 21 18:45:21 +05 2019\n```\n\n选项：\n\n* A) GMT+5\n* B) GMT+4\n* C) GMT-5\n* D) GMT-4\n\
  * A) GMT+5\n* (正确)\n* B) GMT+4\n* C) GMT-5\n* D) GMT-4\n\n### 解释\n`date` 命令显示时区偏移，在本例中为\
  \ `+05`，表示时区为 GMT+5。\n\n## 问题 46\n为了让 Europe/Brussels 成为系统的默认本地时间，符号链接 `/etc/localtime`\
  \ 应该指向哪个文件？选项：\n\n* A) `/usr/share/zoneinfo/Europe/Brussels`\n* (正确)\n* B) `/etc/zoneinfo/Europe/Brussels`\n\
  * C) `/etc/local/zoneinfo/Europe/Brussels`\n* D) `/etc/timezone/Europe/Brussels`\n\
  \n### 解释\n符号链接 `/etc/localtime` 应该指向 zoneinfo 目录下的时区文件，该通常位于 `/usr/share/zoneinfo/Europe/Brussels`。\n\
  \n## 问题 47\n如果系统的字符编码与文本文件使用的编码不同，文本文件中的字符可能无法正确渲染。如何使用 `iconv` 将 WINDOWS-1252 编码的文件\
  \ `old.txt` 转换为 UTF-8 编码的文件 `new.txt`？选项：\n\n* A) `iconv -f WINDOWS-1252 -t UTF-8\
  \ old.txt > new.txt`\n* (正确)\n* B) `iconv -f UTF-8 -t WINDOWS-1252 old.txt > new.txt`\n\
  * C) `iconv -f WINDOWS-1252 -t UTF-8 new.txt > old.txt`\n* D) `iconv -f UTF-8 -t\
  \ WINDOWS-1252 new.txt`\n\n### 解释\n选项 A 正确。它指定了源编码 `-f WINDOWS-1252` 和目标编码 `-t UTF-8`，输入文件\
  \ `old.txt` 并输出到 `new.txt`。\n\n## 问题 48\n以下显示系统时间或修改硬件时间的命令是 True 还是 False：\n\n\
  | 命令 | 系统 | 硬件 |\n| :--- | :--- | :--- |\n| `date -u` | 是 | 否 |\n| `hwclock --set\
  \ \"12:00\"` | 否 | 是 |\n| `timedatectl` | 是 | 否 |\n| `timedatectl` | 是 | 否 |\n|\
  \ `hwclock --h` | 否 | 是 |\n| `date +%T -s \"08:00\"` | 是 | 否 |\n| `timedatectl settime1980-01-10`\
  \ | 是 | 否 |\n\n* A) True\n* (正确)\n* B) False\n\n## 问题 49\n观察以下输出，修正参数格式使命令成功：\n\n\
  ```\n$ date --debug \"20/20/12:10\"\ndate: warning: 20/20 has less than 4 digits.\n\
  date: parsed date: 00220\ndate: parsed time part: 00:10\ndate: input timezone: -03\n\
  date: using specified time as value: '00:10:00'\ndate: error: invalid date/time\
  \ value:\ndate: user provided time: 00220 00:10\ndate: normalized time: (Y-M-D)\
  \ 00220 TZ=-03\ndate: ----\ndate: possible reasons:\ndate: numeric overflow;\ndate:\
  \ incorrect timezone\ndate: invalid date ‘20/20/2:10’\n```\n\n修正格式：`2020-12-20 00:10-03`\n\
  * (正确)\n* 修正格式：`2020-12-20 10:00-03`\n* 修正格式：`2020-12-20 00:10-0030`\n* 修正格式：`2020-12-20\
  \ 00:10-3000`\n\n## 问题 50\n哪个命令会将 Pacific/Auckland 设置为当前会话的默认时区？选项：\n\n* A) `export\
  \ TZ=Pacific/Auckland`\n* (正确)\n* B) `setenv TZ Pacific/Auckland`\n* C) `TZ=Pacific/Auckland`\n\
  * D) `set TZ Pacific/Auckland`\n\n### 解释\n选项 A 正确地为当前会话设置 `TZ` 环境变量 `Pacific/Auckland`。\n\
  \n## 问题 51\n`journalctl` 中的 `--vacuum-time` 选项的作用是什么？\n\n* A) 根据大小删除日志文件。\n* B)\
  \ 删除指定之前的日志文件。\n* (正确)\n* C) 合并所有可用日志条目。\n* D) 将运行中的日志刷新到持久化存储。\n\n### 解释\n`journalctl`\
  \ 中的 `--vacuum-time` 选项用于删除早于指定时间的日志文件。\n\n## 问题 52\n`journald.conf` 中的哪个选项控制日志文件的最大大小？\n\
  \n* A) `MaxRetentionSec`\n* B) `MaxFileSize`\n* (正确)\n* C) `SystemMaxUse`\n* D)\
  \ `SystemKeepFree`\n\n### 解释\n`journald.conf` 中的 `MaxFileSize` 选项控制日志文件的最大大小。\n\n\
  ## 问题 53\n如果 `/var/log/journal/` 不存在，默认行为是什么？\n\n* A) 日志将存储在 `/var/log/journal/`\
  \ 中。\n* B) 日志将存储在内存 `/run/log/journal/` 中。\n* (正确)\n* C) 日志将被丢弃。\n* D) 日志将转发到控制台或\
  \ syslog 等目标。\n\n### 解释\n如果 `/var/log/journal/` 不存在，日志将存储在内存的 `/run/log/journal/`\
  \ 中。\n\n## 问题 54\n如何将日志数据转发到传统的 syslog 守护进程？\n\n* A) 通过启用 `ForwardToKMsg` 选项。\n\
  * B) 通过将消息到套接文件 `/run/systemd/journal/syslog`。\n* (正确)\n* C) 通过使用 `journalctl` 的\
  \ `--flush` 选项。\n* D) 通过清理归日志文件。\n\n### 解释\n通过将消息转发到套接字 `/run/systemd/journal/syslog`，可以使传统的\
  \ syslog 守护进程可以使用日志数据。\n\n## 问题 55\n使用哪个命令根据指定的大小清理归日志文件？\n\n* A) `journalctl --vacuum-time`\n\
  * B) `journalctl --vacuum-size`\n* (正确)\n* C) `journalctl --vacuum-files`\n\n\n\n\
  \n\n## D) `journalctl --rotate`\n\n### 解释\n`journalctl --vacuum-size` 命令用于根据指定的大小清理归档的日志文件。\n\
  \n## 问题 56\n`journald.conf` 中的哪个选项控制日志文件可以占用的磁盘空间？\n\n* A) `MaxRetentionSec`\n*\
  \ B) `MaxUse`\n* (正确)\n* C) `SystemKeepFree`\n* D) `MaxFiles`\n\n### 解释\n`journald.conf`\
  \ 中的 `MaxUse` 选项控制日志文件可以占用的磁盘空间。\n\n## 问题 57\n修改 `/etc/aliases` 文件后，使用哪个命令更新 MTA\
  \ 的别名数据库？\n\n* A) `newaliases`\n* (正确)\n* B) `mailq`\n* C) `sendmail -bi`\n* D)\
  \ `mail`\n\n### 解释\n`newaliases` 命令用于在修改 `/etc/aliases` 文件后更新 MTA 的别名数据库。\n\n##\
  \ 问题 58\n邮件客户端应用程序通常使用哪种协议从远程服务器检索消息？\n\n* A) `SMTP`\n* B) `POP3`\n* C) `IMAP`\n\
  * (正确)\n* D) `SSH`\n\n### 解释\n`IMAP`（Internet 消息访问协议）通常用于邮件客户端应用程序从远程服务器检索消息，同时保持多个设备之间的消息同步。\n\
  \n### 问题 59\n在名为 `office-mgr` 的本地工作站上刚安装了一个新打印机。可以使用哪个命令将此打印机设置为该工作站的默认打印机？选项：\n\
  \n* A) `lpadmin -d office-mgr`\n* (正确)\n* B) `lpoptions -d office-mgr`\n* C) `lp\
  \ -d office-mgr`\n* D) `lpoptions -d default=office-mgr`\n\n### 解释\n`lpadmin -d\
  \ office-mgr` 命令用于将默认打印机设置为 `office-mgr`。\n\n 问题 60\n使用哪个命令和选项可以确定工作站上有哪些可用的打印机？选项：\n\
  \n* A) `lpq -a`\n* B) `lpstat -p`\n* C) `lpoptions -l`\n* D) `lpstat -a`\n* (正确)\n\
  \n### 解释\n`lpstat -a` 命令用于显示所有可用打印机。\n\n## 问题 61\n使用 `cancel` 命令，如何删除 ID 为 15 且阻塞名为\
  \ `office-mgr` 的打印机队列中的打印作业？选项：\n\n* A) `cancel 15`\n* B) `cancel office-mgr 15`\n\
  * (正确)\n* C) `cancel -H office-mgr 15`\n* D) `cancel -u office-mgr 15`\n\n### 解释\n\
  在 `cancel` 命令后加上打印机名称和作业 ID，用于从队列中删除特定的打印作业。\n\n## 问题 62\n哪种类型的 IPv6 地址用于向属于主机组的所有接口发送数据包？选项：\n\
  \n* A) `Unicast`\n* B) `Multicast`\n* (正确)\n* C) `Anycast`\n* D) `Broadcast`\n\n\
  ### 解释\nIPv6 组播地址用于向多个接口发送数据包，这些接口属于由单个组播地址标识的主机组。\n\n## 问题 63\n列举 4 个默认使用 TCP 协议的服务示例。选项：\n\
  \n* A) `SSH, FTP, HTTP, Telnet`\n* (正确)\n* B) `DNS, DHCP, SNMP, TFTP`\n* C) `SMTP,\
  \ POP3, IMAP, SNMP`\n* D) `FTP, TFTP, HTTP, DNS`\n\n### 解释\n`SSH`（安全 Shell）、`FTP`（文件传输协议）、`HTTP`（超文本传输协议）和\
  \ `Telnet` 是默认使用 TCP 进行可靠数据传输的服务示例。\n\n## 问题 64\nIPv6 头部包中实现与 IPv4 中 TTL 相同资源的字段名称是什么？选项：\n\
  \n* A) `Hop Limit`\n* (正确)\n* B) `Time To Live`\n* C) `Time To Destination`\n* D)\
  \ `Destination Limit`\n\n### 解释\nIPv6 头部中的 `Hop Limit` 字段与 IPv4 中的 `Time To Live`\
  \ (`TTL`) 字段的作用相同，用于确定数据包在被丢弃之前可以经过的最大跳数。\n\n## 问题 65\n邻居发现协议（NDP）能够发现什么类型的信息？选项：\n\
  \n* A) `MAC addresses and link-local addresses`\n* B) `IP addresses and MAC addresses`\n\
  * (正确)\n* C) `Subnet masks and default gateways`\n* D) `DNS server addresses and\
  \ DHCP lease durations`\n\n### 解释\n`NDP` 是 ICMPv6 协议族的一部分，用于 IPv6 网络发现各种信息，包括同一链路上邻居节点的\
  \ IP 地址和 MAC 地址。\n\n## 问题 66\n在 `nmcli general status` 命令输出的 CONNECTIVITY 列中 `Portal`\
  \ 一词的含义是什么？选项：\n\n* A) 设备连接到了强制门户网络（captive portal network）。\n* (正确)\n* B) 设备连接到了\
  \ VPN。\n* C) 设备连接到了网网（mesh network）。\n* D) 设备连接到了虚拟私有网络（virtual private network）。\n\
  \n### 解释\n在 `nmcli` 命令的语文中，“Portal”表示设备连接到了强制门户网络。\n\n## 问题 67\n在 `nmcli general\
  \ status` 命令输出的 CONNECTIVITY 列中 `Portal` 一词的含义是什么？选项：\n\n* A) 设备连接到了强制门户网络。\n* (正确)\n\
  * B) 设备连接到了 VPN。\n* C) 设备连接到了网网。\n* D) 设备连接到了虚拟私有网络。\n\n### 解释\n在 `nmcli` 命令的语文中，“Portal”表示设备连接到了强制门户网络。\n\
  \n## 问题 67\n在终端中，如何使用 `nmcli` 命令连接无线网络？选项：\n\n* A) `nmcli add type wifi`\n* B) `nmcli\
  \ device connect wifi`\n* (正确)\n* C) `nmcli connect MyWifi`\n* D) `nmcli up MyWifi`\n\
  \n### 解释\n连接无线网络的正确语法是 `nmcli connect MyWifi`。\n\n## 问题 68\n使用哪个命令可以开启之前被禁用的无线适配器？选项：\n\
  \n* A) `nmcli on`\n* B) `nmcli device wifi`\n* C) `nmcli radio on`\n* (正确)\n* D)\
  \ `nmcli up`\n\n### 解释\n该命令用于开启无线适配器。\n\n## 问题 69\n当使用 systemd-network 管理网络时，自定义文件应该放在哪个目录？选项：\n\
  \n* A) `/etc/network.d/`\n* B) `/etc/systemd/network/`\n* (正确)\n* C) `/etc/netplan/`\n\
  * D) `/etc/wpa_supplicant/`\n\n### 解释\nsystemd-network 的自定义文件应该放在 `/etc/systemd/network/`。\n\
  \n## 问题 70\n用户如何运行运行命令来删除名为 `HotelInternet` 的未使用连接？\n\n* A) `nmcli connection delete\
  \ HotelInternet`\n* (正确)\n* B) `nmcli connection del HotelInternet`\n* C) `nmcli\
  \ con delete HotelInternet`\n* D) `nmcli con del HotelInternet`\n\n### 解释\n使用 `nmcli`\
  \ 删除连接的正确语法是 `connection delete`。\n\n## 问题 71\nNetworkManager 定期扫描 wi-fi 网络，`nmcli\
  \ device list` 仅列出上次扫描到的访问点。如何使用 `nmcli` 命令让 NetworkManager 立即扫描所有可用访问点？选项：\n\n\
  * A) `nmcli device wifi rescan`\n* B) `nmcli device wifi refresh`\n* C) `nmcli device\
  \ wifi scan`\n* (正确)\n* D) `nmcli device wifi reload`\n\n### 解释\n`nmcli device wifi\
  \ scan` 命令指示 NetworkManager 立即扫描所有可用访问点。\n\n## 问题 72\n在 systemd-networkd 配置文件的 [Match]\
  \ 节中，使用哪个名称项可以匹配所有太网接口？选项：\n\n* A) `Type=ethernet`\n* B) `Name=*`\n* C) `Name=eth*`\n\
  * (正确)\n* D) `Type=ether`\n\n### 解释\nsystemd-networkd 配置文件中 [Match] 节中的 `Name=eth*`\
  \ 项匹配所有以 \"eth\" 开头的以太网接口。\n\n\n\n\n## 问题 74\n\n哪个命令可以显示是否有进程正在 TCP 端口 80 上进行监听？\n\
  \n* A) `netstat -tuln`\n* B) `lsof -i :80`\n* C) `ss -tulw`\n* D) 以上全部\n* (正确)\n\
  \n### 解释\n列出的所有命令（`netstat -tuln`, `lsof -i :80`, `ss -tulw`）都可以用于显示在 TCP 端口 80\
  \ 上的进程。\n\n## 问题 75\n\n你如何找到哪个进程正在监听某个端口？\n\n* A) `ps aux | grep PORT`\n* B) `lsof\
  \ -i :PORT`\n* (正确)\n* C) `netstat -tuln`\n* D) 以上全部\n\n### 解释\n使用 `lsof` 命令配合 `-i`\
  \ 选项以及端口号，可以找到哪个进程正在监听特定的端口。\n\n## 问题 76\n\n你如何确定网络路径的最大 MTU？\n\n* A) `traceroute\
  \ -m`\n* B) `ping -M do -s MTU HOST`\n* (正确)\n* C) `netstat -i`\n* D) `ip route\
  \ get HOST`\n\n### 解释\n通过使用 `ping` 命令配合 `-M do` 选项并通过 `-s` 选项指定所需的 MTU 大，你可以确定网络路径的最大\
  \ MTU。\n\n## 问题 77\n\n你如何使用 netcat 向 Web 服务器发送 HTTP 请求？\n\n* A) `nc -l 80`\n* B)\
  \ `nc -u 80`\n* C) `nc -w3 google.com 80`\n* D) `echo -e \"GET / HTTP/1.1\\r\\nHost:\
  \ google.com\\r\\n\\r\\n\" | nc google.com 80`\n* (正确)\n\n### 解释\n该命令使用 netcat 向\
  \ `google.com` 的 80 端口发送了一个 HTTP GET 请求。\n\n## 问题 78\n\nping 主机失败的常见原因有哪些？\n\n*\
  \ A) 防火墙拦截 ICMP 流量、主机离线、IP 地址错误\n* (正确)\n* B) DNS 解析失败、子网掩码错误、网络拥塞\n* C) 路由表错误、DNS\
  \ 缓存损坏、MTU 不匹配\n* D) 以上全部\n\n### 解释\n这些都是 ping 主机失败的常见原因。\n\n## 问题 79\n\n名称一个用于查看到达或离开\
  \ Linux 主机的网络包工具工具\n\n* A) `tcpdump`\n* (正确)\n* B) `netstat`\n* C) `traceroute`\n\
  * D) `nslookup`\n\n### 解释\n`tcpdump` 是用于捕获和分析网络包的工具。\n\n## 问题 80\n\nLinux 中 `host`\
  \ 命令的作用是什么？\n\n* A) 显示名称服务数据库中的条目\n* B) 查询 DNS 服务器的 DNS 条目\n* (正确)\n* C) 配置本地名称解析\n\
  * D) 设置解析器选项\n\n### 解释\nLinux 中的 `host` 命令用于查询 DNS 服务器以获取 DNS 条目。\n\n## 问题 81\n\n\
  哪个命令更适合排查 Linux 中 DNS 服务器的配置？\n\n* A) `getent`\n* B) `host`\n* C) `dig`\n* (正确)\n\
  * D) `nslookup`\n\n### 解释\n`dig` 命令提供详细的输出，更适合排查 Linux 中 DNS 服务器的配置。\n\n## 问题 82\n\
  \n命令 `getent group openldap` 会执行什么？\n\n* A) 显示关于 openldap 组的信息。\n* B 从 `/etc/group`\
  \ 文件中检索 openldap 组的条目。\n* C 从系统组数据库中检索属于 openldap 组的用户信息。\n* (正确)\n* D) 检查系统中是否存在\
  \ openldap 组。\n\n### 解释\n`getent group openldap` 命令从系统组数据库中检索关于 openldap 组的信息。\n\
  \n## 问题 83\n\n`getent` 与其他工具 `host` 和 `dig` 之间最大的区别是什么？\n\n* A) `getent` 从系统数据库检索信息，而\
  \ `host` 和 `dig` 执行 DNS 查询。\n* (正确)\n* B) `getent` 用于查询网络信息，而 `host` 和 `dig` 用于检索\
  \ DNS 记录。\n* C) `getent` 专门用于查询用户和组信息，而 `host` 和 `dig` 用于 DNS 查询。\n* D) `getent`\
  \ 与 `host`/`dig` 之间没有显著区别。\n\n### 解释\n`getent` 用于从 `/etc/passwd`、`/etc/group` 等系统数据库中检索条目，而\
  \ `host` 和 `dig` 专门用于 DNS 查询。\n\n## 问题 84\n\n`dig` 和 `host` 的哪个选项用于指定你想要检索的记录类型？\n\
  \n* A) `-t`\n* (正确)\n* B) `-r`\n* C) `-q`\n* D) `-s`\n\n### 解释\n`dig` 和 `host` 中的\
  \ `-t` 选项用于指定你想要检索的 DNS 记录类型。\n\n## 问题 85\n\n如何解锁之前被锁定的账户 emma？\n\n* A) 使用 `usermod\
  \ -U emma`\n* B) `passwd -u emma`\n* (正确)\n* C) `passwd -l emma`\n* D) `chage -E\
  \ emma`\n\n### 解释\n`passwd -u` 命令用于解锁锁定的账户。\n\n## 问题 86\n\n如何将账户过期日期设置为永不过？\n\n\
  * A) `chage -E 0 emma`\n* B) `chage -l emma`\n* (正确)\n* C) `chage -d \"\" emma`\n\
  * D) `passwd -e emma`\n\n### 解释\n`chage -E 0` 命令将过期日期设置为永不过。\n\n## 问题 87\n\n假设 CUPS\
  \ 打印服务正在运行。如何永久禁用它？\n\n* A) `systemctl stop cups`\n* B) `systemctl disable cups`\n\
  * C) `systemctl mask cups`\n* (正确)\n* D) `systemctl restart cups`\n\n### 解释\n`systemctl\
  \ mask` 命令防止服务被启动。\n\n## 问题 88\n\nGPG 中撤销证书的作用是什么？\n\n* A) 撤销公钥\n* (正确)\n* B) 撤销私钥\n\
  * C) 撤销信任数据库\n* D) 撤销密钥对\n\n### 解释\n撤销证书用于公钥泄露或不再需要时将其撤销。\n\n## 问题 89\n\n用户如何通过\
  \ GPG 导出其公钥以便分发？\n\n* A) `gpg --export-public-key`\n* B) `gpg --send-keys`\n* C)\
  \ `gpg --export`\n* (正确)\n* D) `gpg --share-key`\n\n### 解释\n`gpg --export` 命令用于导出公钥以便分发。\n\
  \n## 问题 90\n\nGPG 中 ASCII 护装输出的作用是什么？\n\n* A) 压缩加密数据\n* B) 增加加密安全性\n* C) 生成用于分发的类可读格式\n\
  * (正确)\n* D) 提高解密性能\n\n### 解释\nASCII 护装输出将二进制加密数据转换为人类可读的格式，便于通过电子邮件或其他文本方式进行分发。\n\
  \n\n\n\n\n- 选项 A：`kernel_info` 被正确赋值给 `uname -r`，提供了内核信息。\n\n- 选项 B：`b` 被正确赋值给 `bash`，创建了调用\
  \ Bash 壳的快捷方式。\n\n- 选项 C：`bash_info` 赋值错误。该别名旨在显示 Bash 版本，但使用了错误的语法。修正后的版本可以是 `bash_info=\"\
  bash --version\"` 或 `bash_info=\"echo $BASH_VERSION\"`。\n\n- 选项 D：`greet` 被正确赋值给\
  \ `echo Hi, $USER!`，生成了个性化的问候语。\n\n- 选项 E：`computer` 赋值错误。其意图似乎将变量 `pc` 赋值为 \"slimbook\"\
  \ 然后回一条消息。然而，语法是错误的。修正后的版本可以是 `computer=\"pc=slimbook && echo My computer is a $pc\"\
  `。\n\n## 问题 2:\n\n要使函数变为只读，需要使用 `readonly` 命令并配合 `-f` 选项，后跟函数名，例如 `readonly -f my_fun`。这防止了对函数定义的任何修改。要列出所有只读函数，可以使用命令\
  \ `declare -f | grep 'readonly'`。该命令使用 `declare -f` 获取所有函数定义，然后通过 `grep 'readonly'`\
  \ 过滤输出，只显示只读函数。\n\n- A) 正确\n(正确)\n- B) 错误\n\n## 问题 3:\n\n以下任务涉及修改 `PS1` 变量（该变量控制\
  \ Bash 中的提示符格式），并创建一个回显各种系统信息的函数。检查函数 `fyi` 实现是否正确：\n\n```bash\nfyi() {\necho \"\
  User: $USER\"\necho \"Home directory: $HOME\"\necho \"Host: $HOSTNAME\"\necho \"\
  Operating system: $(uname -s)\"\necho \"Search path for executables: $PATH\"\necho\
  \ \"Mail directory: $MAIL\"\necho \"Mail check interval: $(grep -i '^[[:space:]]*MAILCHECK'\
  \ /etc/profile)\"\necho \"Shell depth: $SHLVL\"\n}\n```\n\n# 修改 `PS1` 以显示 `<user>@<host-date>`\n\
  \n`PS1=\"\\[\\e[1;32m\\]\\u@\\h-\\d\\[ee0m\\]:\\w\\$ \"`\n\n- A) 正确\n(正确)\n- B)\
  \ 错误\n\n### 解释\n\n此函数可以添加到类似 `.bashrc` 或 `.bash_profile` 的启动脚本中，为用户提供指定的系统信息并相应修改提示符。`PS1`\
  \ 的修改确保提示符显示用户名，随后是主机名和日期。\n\n## 问题 4:\n\n用户如何临时将默认字段分隔符更改为换行符，同时仍能恢复其原始内容？选项有：\n\
  \n- A) 使用 `IFS=$'\\n'` 更改，使用 `unset IFS` 恢复\n(正确)\n- B) 使用 `IFS='\\n'` 更改，使用 `IFS='\
  \ '` 恢复\n- C) 使用 `IFS=$'\\n'` 更改，使用 `IFS='\\t'` 恢复\n- D) 使用 `IFS='\\n'` 更改，使用 `unset\
  \ IFS` 恢复\n\n### 解释\n\n选项 A 是正确的。要临时将默认字段分隔符更改为换行符，可以将 `IFS` 设置为 `$'\\n'`，要恢复到原始内容，可以取消\
  \ `IFS`（`unset IFS`）。\n\n## 问题 5:\n\n在使用 `X` 命令时使用哪个命令行开关来创建新的 `xorg.conf` 配置文件？选项有：\n\
  \n- A) `-configure`\n(正确)\n- B) `-createconfig`\n- C) `-newconfig`\n- D) `-xorgconf`\n\
  \n### 解释\n\n选项 A 是正确的。`X` 命令的 `-configure` 开关用于根据当前硬件配置自动生成新的 `xorg.conf` 文件。\n\n\
  ## 问题 6:\n\n在名为 `lab01` 使用单显示配置的系统上，`DISPLAY` 环境变量的内容是什么？假设 `DISPLAY` 环境变量正在第三个独立屏幕的终端模拟器中查看。选项有：\n\
  \n- A) `:0.2`\n(正确)\n- B) `lab01:0.2`\n- C) `:3`\n- D) `lab01:3`\n\n### 解释\n\n选项\
  \ A 是正确的。在单显示配置中，`DISPLAY` 环境变量通常遵循 `:<display_number>.<screen_number>` 格式，因此在第三个独立屏幕上，屏幕编号为\
  \ 2，结果为 `:0.2`。\n\n## 问题 7:\n\n可以使用什么命令来为 X Window 系统创建键盘配置文件？选项有：\n\n- A) `xset`\n\
  - B) `setxkbmap`\n- C) `xmodmap`\n- D) `xkbcomp`\n(正确)\n\n### 解释\n\n选项 D 是正确的。`xkbcomp`\
  \ 命令用于将 XKB（X 键盘扩展）描述编译为键映射文件，这些文件可以被 X Window 系统作为键盘配置文件。\n\n## 问题 8:\n\n在典型的 Linux\
  \ 安装中，用户可以通过按下键盘上的 `Ctrl + Alt + F1 - F6` 键切换到虚拟终端。你被要求建立一个带有图形界面的亭机系统，并且需要禁用此功能以防止对系统未经授权的篡改。你决定创建一个\
  \ `/etc/X11/xorg.conf.d/10-kiosk.conf` 配置文件。使用 `ServerFlags` 部分（用于设置服务器上的全局 Xorg\
  \ 选项），应使用哪个选项？\n\n- A) 正确\n(正确)\n- B) 错误\n- C) 自动\n- D) 禁用\n\n### 解释\n\n选项 A 是正确的。`X`\
  \ 命令的 `-configure` 开关用于根据当前硬件配置自动生成新的 `xorg.conf` 文件。\n\n## 问题 9:\n\n哪种远程桌面协议是平台无关并使用帧缓冲区（RFB）的？\n\
  \n- A) VNC\n(正确)\n- B) RDP\n- C) XDM\n- D) Spice\n\n### 解释\n\n虚拟网络计算（VNC）是平台无关的，并使用帧缓冲区查看和控制桌面环境。\n\
  \n## 问题 10:\n\n桌面环境中的哪个组件负责显示内置和第三方应用程序？\n\n- A) 窗口管理器\n- B) 文件管理器\n- C) 应用启动器\n\
  (正确)\n- D) 任务栏\n\n### 解释\n\n应用启动器负责显示内置和第三方应用程序，为用户提供便利。\n\n## 问题 11:\n\n什么类型的应用程序在桌面环境中提供窗口化会话？\n\
  \n- A) 终端模拟器\n(正确)\n- B) 文件管理器\n- C) 浏览器\n- D) 文本编辑器\n\n### 解释\n\n选项 A 是正确的。终端模拟器在桌面环境中提供窗口化会话，允许用户在窗口内与命令行交互。\n\
  \n## 问题 12:\n\n由于 Linux 桌面环境的多样性，同一个应用程序可能有多个版本，每个版本最适合特定的工具包。例如，比特流客户端 `Transmission`\
  \ 有两个版本：`transmission-gtk` 和 `transmission-qt`。安装哪一个可以确保与 KDE 的最大集成？\n\n- A) `transmission-gtk`\n\
  - B) `transmission-qt`\n(正确)\n- C) `transmission-cli`\n- D) `transmission-core`\n\
  \n### 解释\n\n选项 B 是正确的。KDE 使用 Qt 工具包，因此安装 `transmission-qt` 版本可以确保与 KDE 的最大集成。\n\n\
