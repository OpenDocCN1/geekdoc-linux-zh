    How can you send the output and errors of your scheduled job to the emma user
    account via email? And how can you avoid sending the standard output and error
    via e-mail? Options:


    * A) `* * * * * /path/to/foobar.sh 2>&1 | mail -s "Output" emma@example.com`

    * (Correct)

    * B) `* * * * * /path/to/foobar.sh 2> /dev/null | mail -s "Output" emma@example.com`

    * C) `* * * * * /path/to/foobar.sh > /dev/null 2>&1 | mail -s "Output" emma@example.com`

    * D) `* * * * * /path/to/foobar.sh | mail -s "Output" emma@example.com`


    ### Explanation

    Option A correctly sends both standard output and error to the emma user via email.
    Option B sends only errors to emma, while option C sends nothing (redirects all
    output to `/dev/null`).


    ### Question 44:

    Execute the command `ls -l /usr/bin/crontab`. Which special bit is set and what
    is its meaning? Options:


    * A) Setuid (s) - It allows users to run the crontab command with the permissions
    of the file owner.

    * (Correct)

    * B) Setgid (s) - It allows users to run the crontab command with the permissions
    of the file group.

    * C) Sticky bit (t) - It allows users to run the crontab command with restricted
    permissions.

    * D) Regular file (-) - It indicates that `/usr/bin/crontab` is a standard executable
    file.


    ### Explanation

    Option A is correct. The setuid (s) bit allows the `crontab` command to be executed
    with the permissions of the file owner, which is necessary to edit the user''s
    crontab file.


    ### Question 45:

    For each of the following time specifications, indicate which is valid and which
    is invalid for `at`:


    1. `at 08:30 AM next week`

    Valid: This specifies a time for 08:30 AM next week.

    2. `at midday`

    Invalid: "midday" is not a valid time format.

    3. `at 01-01-2020 07:30 PM`

    Valid: This specifies a time for January 1st, 2020, at 07:30 PM.

    4. `at 21:50 01.01.20`

    Valid: This specifies a time for January 1st, 2020, at 21:50.

    5. `at now +4 days`

    Valid: This specifies a time 4 days from the current time.

    6. `at 10:15 PM 31/03/2021`

    Invalid: The date format should be in the format MM/DD/YYYY or DD-MM-YYYY.

    7. `at tomorrow 08:30 AM`

    Invalid: "tomorrow" is not a valid time specifier.


    * 1. Valid, 2. Invalid, 3. Valid, 4. Valid, 5. Valid, 6. Invalid, 7. Invalid

    * (Correct)

    * 1. Invalid, 2. Invalid, 3. Valid, 4. Valid, 5. Valid, 6. Invalid, 7. Invalid

    * 1. Valid, 2. Invalid, 3. Invalid, 4. Valid, 5. Valid, 6. Invalid, 7. Invalid

    * 1. Valid, 2. Invalid, 3. Valid, 4. Valid, 5. Valid, 6. Valid, 7. Invalid


    ### Explanation

    1. `at 08:30 AM next week`

    Valid: This specifies a time for 08:30 AM next week.

    2. `at midday`

    Invalid: "midday" is not a valid time format.

    3. `at 01-01-2020 07:30 PM`

    Valid: This specifies a time for January 1st, 2020, at 07:30 PM.

    4. `at 21:50 01.01.20`

    Valid: This specifies a time for January 1st, 2020, at 21:50.

    5. `at now +4 days`

    Valid: This specifies a time 4 days from the current time.

    6. `at 10:15 PM 31/03/2021`

    Invalid: The date format should be in the format MM/DD/YYYY or DD-MM-YYYY.

    7. `at tomorrow 08:30 AM`

    Invalid: "tomorrow" is not a valid time specifier.


