    Which transport protocol ensures that all packets are delivered properly, verifying
    the integrity and the order of the packets? Options:


    * A) `TCP` (Correct)

    * B) `UDP`

    * C) `ICMP`

    * D) `HTTP`


    **Explanation**

    Transmission Control Protocol (TCP) ensures reliable and ordered delivery of packets
    by providing mechanisms for error checking and packet sequencing.


