    * B) `deluser kevin developers`

    * C) `userdel -G developers kevin`

    * D) `usermod -G developers kevin`


    ### Explanation

    Option A demonstrates the correct usage of the `gpasswd` command to remove the
    developers group from the secondary groups of the user kevin.


    ## Question 35

    Set the password for the kevin user account. Options:


    * A) `passwd kevin`

    * (Correct)

    * B) `chpasswd kevin`

    * C) `userpasswd kevin`

    * D) `setpasswd kevin`


    ### Explanation

    Option A correctly identifies the `passwd` command as the appropriate tool.


    ## Question 36

    Using the `chage` command, first check the expiry date of the kevin user account.
    What other command can you use to change it to December 31st? Options:


    * A) `usermod`

    * (Correct)

    * B) `chuser`

    * C) `userexpiry`

    * D) `chpasswd`


    ### Explanation

    Option A is the correct command (`usermod`) to change the expiration date. The
    `chage` command is used to view and modify user account aging information.


    ## Question 37

    Add a new user account named emma with UID 1050 and set administrators as its
    primary group and developers and web-designers as its secondary groups. Options:


    * A) `useradd -u 1050 -G developers,web-designers emma`

    * B) `useradd -g administrators -G developers,web-designers -u 1050 emma`

    * (Correct)

    * C) `useradd -u 1050 -g administrators -G developers -G web-designers emma`

    * D) `useradd -G administrators,developers-designers -u 1050 emma`


    ### Explanation

    Option B correctly specifies the primary group (administrators) and secondary
    groups (developers and web-designers) for the new user account emma with UID 1050.


    ## Question 38

    Change the login shell of emma to `/bin/sh`. Options:


    * A) `usermod -s /bin/sh emma`

    * (Correct)

    * B) `chsh /bin/sh emma`

    * C) `usershell /bin/sh emma`

    * D) `setshell /bin/sh emma`


    ### Explanation

    Option A demonstrates the correct usage of the `usermod` command to change the
    login shell of a user account.


    ## Question 39

    Delete the emma and kevin user accounts and the administrators, developers, and
    web-designers groups. Options:


    * A) `userdel emma kevin && groupdel administrators developers web-designers`

    * B) `userdel emma kevin && delgroup administrators developers web-designers`

    * C) `deluser emma kevin && groupdel administrators developers web-designers`

    * (Correct)

    * D) `deluser emma kevin && delgroup administrators developers web-designers`


    ### Explanation

    Option C correctly combines the `deluser` command to delete user accounts (emma
    and kevin) with the `groupdel` command to delete groups (administrators, developers,
    and web-designers).


    ## Question 40

    Create another scheduled job that executes the foobar.sh script every minute,
    redirecting the output to the output.log file in your home directory so that only
    standard error is sent to you by e-mail. Options:


    * A) `* * * * * /path/to/foobar.sh > ~/output.log 2>&1`

    * B) `* * * * * /path/to/foobar.sh > ~/output.log`

    * (Correct)

    * C) `* * * * * /path/to/foobar.sh 2> ~/output.log`

    * D) `* * * * * /path/to/foobar.sh | tee ~/output.log`


    ### Explanation

    Option B correctly schedules the job to run every minute, redirecting standard
    output to output.log in the user''s home directory.


