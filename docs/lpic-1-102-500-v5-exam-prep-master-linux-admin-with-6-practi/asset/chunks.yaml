    ### Question 49:

    Which command is used to verify NTP status using the `chrony` service?


    * A) `chronyc status`

    * (Correct)

    * B) `ntpstatus`

    * C) `chronycheck`

    * D) `ntpq -p`


    ### Explanation

    The `chronyc status` command is used to verify NTP status using the `chrony` service.


    ### Question 50:

    What does the term "Stratum" refer to in the context of NTP?


    * A) The absolute difference between system time and NTP time

    * B) The number of hops to a computer with an attached clock

    * (Correct)

    * C) The rate by which the system’s clock would be wrong if chronyd is not it

    * D) The total of the network path delays to the stratum from which the computer
