    * A) MouseTweaks

    * (正确)

    * B) Onboard

    * C) Orca

    * D) Screen reader


    ### 解释

    选项 A 是正确的。在 KDE 中，`MouseTweaks` 是在鼠标光标短暂暂停时点击鼠标来帮助患有重复性劳损损伤应用程序。


