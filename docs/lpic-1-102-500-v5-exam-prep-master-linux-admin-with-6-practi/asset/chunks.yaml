    ## 问题 82

    `cron` 在 Linux 系统管理中的作用是什么？


    * A) 在特定时间调度一次性任务。

    * B) 管理系统服务和守护进程。

    * C) 自动化周期性作业调度。

    * (正确)

    * D) 控制用户对系统资源的访问。


    ### 解释

    `cron` 用于在特定间隔调度循环执行的任务或作业。


    ## 问题 83

