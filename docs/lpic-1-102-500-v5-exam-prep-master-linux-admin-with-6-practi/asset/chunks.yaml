    section is appropriate for configuring input devices like mice.


    ## Question 26

    What component of a Linux installation is responsible for keeping an X server
    running? Options:


    * A) Xinit

    * B) X Window System

    * C) Display Manager

    * (Correct)

    * D) Window Manager


    ### Explanation

    Option C is correct. The Display Manager, such as `lightdm` or `gdm`, is responsible
    for starting and managing the X server during system boot.


    ## Question 27

    Which remote desktop protocol provides native features to integrate local and
    remote systems, such as accessing local devices from the remote machine?


    * A) VNC

    * B) RDP

    * C) XDMCP

    * D) Spice

    * (Correct)


    ### Explanation

    Spice comprises a suite of tools aimed at accessing the desktop environment of
    virtualized systems, offering native features to integrate local and remote systems,
    such as accessing local devices from the remote machine and file sharing between
    the two systems.


