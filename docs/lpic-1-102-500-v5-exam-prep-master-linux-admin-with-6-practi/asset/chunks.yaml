    ### Question 36:


    Check if the corresponding time specifications for each of the mentioned crontab
    shortcuts "True" or "False":


    1. `@hourly`: This runs once an hour, at the beginning of the hour. Time specification:
    `0 * * *`

    2. `@daily`: This runs once a day, at midnight (00:00). Time specification: `0
    0 * *`

    3. `@weekly`: This runs once a week, on Sunday at midnight (00:00). Time specification:
    `0 0 * 0`

    4. `@monthly`: This runs once a month, on the first day of the month at midnight
    (00:00). Time specification: `0 0 1 *`

    5. `@annually`: This runs once a year, on January 1st at midnight (00:00). Time
    specification: `0 0 1 *1`


    * A) True

    * (Correct)

    * B) False


    #### Explanation

    Let’s break down the crontab shortcuts and their corresponding time specifications:

    1. `@hourly`: `0 * * *` — runs the job every hour at zeroth minute (i.e., at the
    start of each hour).

    2. `@daily`: `0 0 * *` — runs the job once a day at midnight (00:00).

    3. `@weekly`: `0 0 * 0` — runs the job once a week on Sunday (since Sunday is
    represented by 0 in the fifth field).

    4. `@monthly`: `0 0 1 *` — runs the job once a month on the first day of the month.

    5. `@annually`: `0 0 1 1` — runs the job once a year on January 1st.


    Remember that the first five columns represent the minutes, hours, days of the
    month, months, and days of the week, respectively. The asterisks (`*`) indicate
    that the job should run for all possible values.


    ### Question 37:


    Check if the corresponding time specifications (the longer normalized form) for
    each of the mentioned OnCalendar shortcuts are "True" or "False":


    1. `hourly`: `*-*- *:00/1:00` runs once an hour, at the beginning of the hour.

    2. `daily`: `*-*-* 00:00:00` runs once a day, at midnight (00:00).

    3. `weekly`: `Mon *-*-* 00:00:00` runs once a week, on Monday at midnight (00:00).

    4. `monthly`: `*-01 *-* 00:00:00` runs once a month, on the first day of the month
    at midnight (00:00).

    5. `yearly`: `Jan 1 *-* 00:00:00` runs once a year, on January 1st at midnight
    (00:00).


    * A) True

    * (Correct)

    * B) False


    #### Explanation

    The longer normalized form refers to the expanded version of the OnCalendar expressions,
    which provides a more detailed breakdown of the timing. It includes the specific
    values for each component of the schedule: year, month, day, hour, minute, and
    second.


    Breakdown of the longer normalized form:

    - Year: Four digits (e.g., 2024).

    - Month: Two digits (01 for January, 02 for February, etc.).

    - Day: Two digits (01 for the first day, 02 for the second day, etc.).

    - Hour: Two digits in 24-hour format (00 for midnight, 01 for 1:00 AM, etc.).

    - Minute: Two digits (00 through 59).

    - Second: Two digits (00 through 59).


    Examples:

    - `*-*-* *:00/1:00` translates to every hour (`*` for every possible value in
    year, month, and day) at the beginning of the hour (`*:00`), with a step size
    of 1 hour (`/1:00`).

    - `*-*-* 00:00:00` translates to every day (`*` for every possible value in year,
    month, and day) at midnight (`00:00:00`).

    - `Mon *-*-* 00:00:00` translates to every Monday (`Mon`) at midnight (`00:00:00`).

    - `*-01 *-* 00:00:00` translates to every month on the first day (`*-01`) at midnight
    (`00:00:00`).

    - `Jan 1 *-* 00:00:00` translates to every January 1st (`Jan 1`) at midnight (`00:00:00`).


