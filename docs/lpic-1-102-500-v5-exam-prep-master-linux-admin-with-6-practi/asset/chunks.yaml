    Look at the crontab entry of the newly created scheduled job. Why is it not necessary
    to specify the absolute path of the file in which the standard output is saved?
    And why can you use the `./foobar.sh` command to execute the script? Options:


    * A) Because cron automatically redirects output to the user''s mailbox, and the
    current directory is included in the `PATH` environment variable.

    * (Correct)

    * B) Because cron automatically redirects output to the `/var/log/cron.log` file,
    and the current directory is included in the `PATH` environment variable.

    * C) Because cron automatically redirects output to the `/var/log/cron.log` file,
    and the current directory is not included in the `PATH` environment variable.

    * D) Because cron automatically redirects output to the user''s mailbox, and the
    current directory is not included in the `PATH` environment variable.


    ### Explanation

    Option A is correct because cron by default sends output via email to the user
    who owns the crontab, and the current directory is usually included in the `PATH`
    environment variable.


    ### Question 42:

    Edit the previous crontab entry by removing the output redirection and disable
    the first cron job you have created. Options:


    * A) Comment out the line with a `#`

    * (Correct)

    * B) Delete the line

    * C) Add the entry to `/etc/cron.deny`

    * D) Add the entry to `/etc/cron.allow`


    ### Explanation

    Option A is correct as commenting out the line with a `#` disables the cron job
    without deleting it.


