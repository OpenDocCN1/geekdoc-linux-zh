    * D) `/etc/passwd` 和 `/etc/group` 所有用户可读；`/etc/shadow` 和 `/etc/gshadow` 仅 root
    可读写。


    #### 解释

    选项 A 准确描述了文件权限，其中 `/etc/passwd` 和 `/etc/group` 所有用户可读，但 `/etc/shadow` 和 `/etc/gshadow`
    仅 root 可读，为敏感密码信息提供了更强的安全性。


