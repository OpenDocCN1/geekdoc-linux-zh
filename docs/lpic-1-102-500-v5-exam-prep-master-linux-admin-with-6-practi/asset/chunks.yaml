    `/etc/xinetd.d/` directory.


    ### Question 84:

    How can you restart the xinetd service after making configuration changes?


    *   A) `systemctl reload xinetd`

    *   B) `service xinetd restart`

    *   C) `systemctl restart xinetd`

    * (Correct)

    *   D) `restart xinetd`


    #### Explanation

