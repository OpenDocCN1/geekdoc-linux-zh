    ### Question 85:

    What command can be used to list all running services on a systemd-based system?


    *   A) `systemctl list-services`

    *   B) `service --status-all`

    *   C) `systemctl list-units --type service`

    * (Correct)

    *   D) `ps -ef | grep service`


    #### Explanation

    `systemctl list-units --type service` lists all running services on a systemd-based
    system.


    ### Question 86:

    What is the default directory for user-specific configuration and authentication
    information in SSH?


    *   A) `/etc/ssh/`

    *   B) `/usr/local/ssh/`

    *   C) `~/.ssh/`

    * (Correct)

    *   D) `/var/lib/ssh/`


    #### Explanation

    The `~/.ssh/` directory is the default location for user-specific configuration
    and authentication information in SSH.


    ### Question 87:

    Which SSH authentication method allows users to log in without providing a password
    but using public keys instead?


    *   A) Password-based authentication

    *   B) Public key authentication

    * (Correct)

    *   C) Host-based authentication

    *   D) Challenge-response authentication


    #### Explanation

    Public key authentication allows users to log in without providing a password
    by using their corresponding private keys for authentication.


    ### Question 88:

    How can the previously locked account emma be unlocked?


    *   A) Run `passwd -u emma`.

    * (Correct)

    *   B) Edit `/etc/passwd` file to remove the `!` symbol from emma''s password
    field.

    *   C) Use `usermod -U emma`.

    *   D) There is no way to unlock a locked account without root access.


    #### Explanation

    The `passwd -u emma` command unlocks the account emma by removing the `!` symbol
    from her password field in the `/etc/shadow` file.


    ### Question 89:

    Previously the account emma had an expiration date set. How can the expiration
    date get set to never?


    *   A) Run `chage -E -1 emma`.

    * (Correct)

    *   B) Edit `/etc/passwd` file to remove the expiration date field for emma.

    *   C) Use `usermod -e '''' emma`.

    *   D) There is no way to remove the expiration date for an account.


    #### Explanation

    The `chage -E -1 emma` command sets the expiration date for the account emma to
    never expire.


    ### Question 90:

    Imagine the CUPS printing service handling print jobs is not needed on your server.
    How can you disable the service permanently? How can you check the appropriate
    port is not active anymore?


    *   A) Run `systemctl disable cups` and check with `netstat -tuln` for port 631.

    * (Correct)

    *   B) Edit `/etc/cups/cupsd.conf` to set `Listen 0.0.0.0:0` and check with `nmap
    localhost` for port.

    *   C) Use `service stop` and check with `ps | grep cups`.

    *   D) There is no way to disable the service permanently.


    #### Explanation

    Using `systemctl disable cups` ensures the service does not start on boot. `netstat
    -tuln` confirms that port 631 is no longer active.

