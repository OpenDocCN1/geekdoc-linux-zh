    How would a user temporarily change the default field separator to the newline
    character only, while still being able to revert it to its original content? Options:


    - A) `IFS=$''\n''` to change, `unset IFS` to revert

    (Correct)

    - B) `IFS=''\n''` to change, `IFS='' ''` to revert

    - C) `IFS=$''\n''` to change, `IFS=''\t''` to revert

    - D) `IFS=''\n''` to change, `unset IFS` to revert


