    Which command is used to move a print job from one print queue to another in CUPS?


    * A) `lprm`

    * B) `lpmove` (Correct)

    * C) `lpadmin`

    * D) `cancel`


    **Explanation**

    The `lpmove` command is used to move a print job from one print queue to another
    in CUPS.


