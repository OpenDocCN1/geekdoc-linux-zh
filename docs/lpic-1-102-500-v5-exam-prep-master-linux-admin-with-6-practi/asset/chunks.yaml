    * C) `/var/spool/cron`

    * D) `/etc`


    ### 解释

    系统 crontab 文件位于 `/etc/cron` 目录。


    ## 问题 85

    以下哪项不是 `cron` 中有效的的时间指定规范？


    * A) `0 0 * * *`

    * B) `30 12 * * 1-5`

    * C) `0 25 * * *`

    * (正确)

    * D) `*/5 * * * *`


    ### 解释

    分钟字段只接受 `0` 到 `59` 之间的值，因此 `25` 不是一个有效值。


    ## 问题 86

