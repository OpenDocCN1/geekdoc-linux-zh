    选项 A 是正确的。`/etc/X11/xorg.conf.d/` 目录通常用于存储特定设备或输入类的配置文件，`InputClass` 段适用于配置鼠标等输入设备。


    ## 问题 26

    Linux 安装中的哪种组件负责保持 X 服务器的运行？选项有：


    * A) Xinit

    * B) X Window System

