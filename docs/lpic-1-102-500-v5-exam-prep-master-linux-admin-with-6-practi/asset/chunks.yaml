    ### Question 32:


    Check if the commands provided are related to the purposes:


    Command: Purpose


    `usermod -L`: Locks a user account by placing a `!` character in front of the
    encrypted password in the `/etc/shadow` file, effectively preventing the user
    from logging in.

    `passwd -u`: Unlocks a previously locked user account by removing the `!` character
    from the encrypted password in the `/etc/shadow` file.

    `chage -E`: Sets the expiration date for an account. This command is often used
    to define a specific end date for a user account''s validity.

    `groupdel`: Deletes a specified group from the system, removing it from the `/etc/group`
    file and disassociating it from any users who were members of the group.

    `useradd -s`: Adds a new user account with the specified login shell, defining
    the shell that the user will interact with upon logging in.

    `groupadd -g`: Adds a new group with a specific GID (Group ID), ensuring that
    the group is created with a particular numerical identifier.

    `userdel -r`: Deletes a user account and removes associated files, including the
    user''s home directory and any files stored within it.

    `usermod -l`: Modifies the login name of an existing user account, changing the
    username that the user must provide to log in.

    `groupmod -n`: Renames an existing group, allowing administrators to change the
    name of a group without altering its GID or associated user memberships.

    `useradd -m`: Adds a new user account along with a home directory, creating the
    specified user''s home directory if it does not already exist.


