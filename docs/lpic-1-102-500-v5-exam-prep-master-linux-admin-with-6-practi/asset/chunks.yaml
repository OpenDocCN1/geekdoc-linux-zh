    ### Question 81:

    Which option is used with the `passwd` command to view password aging information
    for a user?


    *   A) `-a`

    *   B) `-s`

    *   C) `-l`

    *   D) `-S`

    * (Correct)


    #### Explanation

    The `-S` option is used with the `passwd` command to view password aging information
    for a user.


    ### Question 82:

    Which command is used to lock a user''s password?


    *   A) `lock`

    *   B) `passwd -l`

    * (Correct)

    *   C) `usermod -L`

    *   D) `chage -l`


    #### Explanation

    The `passwd -l` command is used to lock a user''s password.


    ### Question 83:

    Which file is used to configure individual services managed by xxinetd?


    *   A) `/etc/xinetd.conf`

    *   B) `/etc/services`

    *   C) `/etc/xinetd.d/`

    * (Correct)

    *   D) `/etc/inetd.conf`


    #### Explanation

