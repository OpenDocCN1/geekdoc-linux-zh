    * (正确)

    * B) 目录：`/usr/share/X11/xorg.conf.d/`；段：`ServerLayout`

    * C) 目录：`/etc/X11/`；段：`InputDevice`

    * D) 目录：`/usr/lib/X11/`；段：`Device`


