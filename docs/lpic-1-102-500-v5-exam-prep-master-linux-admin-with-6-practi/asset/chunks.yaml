    \n#### 解释\n在 `cancel` 命令后加上打印机名称和作业 ID，用于从队列中删除特定的打印作业。\n\n### 问题 62\n哪种类型的 IPv6\
    \ 地址用于向属于主机组的所有接口发送数据包？选项：\n\n* A) `Unicast`\n* B) `Multicast`\n* (正确)\n* C) `Anycast`\n\
    * D) `Broadcast`\n\n#### 解释\nIPv6 组播地址用于向多个接口发送数据包，这些接口属于由单个组播地址标识的主机组。\n\n###\
    \ 问题 63\n列举 4 个默认使用 TCP 协议的服务示例。选项：\n\n* A) `SSH, FTP, HTTP, Telnet`\n* (正确)\n\
    * B) `DNS, DHCP, SNMP, TFTP`\n* C) `SMTP, POP3, IMAP, SNMP`\n* D) `FTP, TFTP,\
    \ HTTP, DNS`\n\n#### 解释\n`SSH`（安全 Shell）、`FTP`（文件传输协议）、`HTTP`（超文本传输协议）和 `Telnet`\
    \ 是默认使用 TCP 进行可靠数据传输的服务示例。\n\n### 问题 64\nIPv6 头部包中实现与 IPv4 中 TTL 相同资源的字段名称是什么？选项：\n\
    \n* A) `Hop Limit`\n* (正确)\n* B) `Time To Live`\n* C) `Time To Destination`\n\
    * D) `Destination Limit`\n\n#### 解释\nIPv6 头部中的 `Hop Limit` 字段与 IPv4 中的 `Time To\
    \ Live` (`TTL`) 字段的作用相同，用于确定数据包在被丢弃之前可以经过的最大跳数。\n\n### 问题 65\n邻居发现协议（NDP）能够发现什么类型的信息？选项：\n\
    \n* A) `MAC addresses and link-local addresses`\n* B) `IP addresses and MAC addresses`\n\
    * (正确)\n* C) `Subnet masks and default gateways`\n* D) `DNS server addresses and\
    \ DHCP lease durations`\n\n#### 解释\n`NDP` 是 ICMPv6 协议族的一部分，用于 IPv6 网络发现各种信息，包括同一链路上邻居节点的\
    \ IP 地址和 MAC 地址。\n\n### 问题 66\n在 `nmcli general status` 命令输出的 CONNECTIVITY 列中\
    \ `Portal` 一词的含义是什么？选项：\n\n* A) 设备连接到了强制门户网络（captive portal network）。\n* (正确)\n\
    * B) 设备连接到了 VPN。\n* C) 设备连接到了网网（mesh network）。\n* D) 设备连接到了虚拟私有网络（virtual private\
    \ network）。\n\n#### 解释\n在 `nmcli` 命令的语文中，“Portal”表示设备连接到了强制门户网络。\n\n### 问题 67\n\
    在 `nmcli general status` 命令输出的 CONNECTIVITY 列中 `Portal` 一词的含义是什么？选项：\n\n* A) 设备连接到了强制门户网络。\n\
    * (正确)\n* B) 设备连接到了 VPN。\n* C) 设备连接到了网网。\n* D) 设备连接到了虚拟私有网络。\n\n#### 解释\n在 `nmcli`\
    \ 命令的语文中，“Portal”表示设备连接到了强制门户网络。\n\n### 问题 67\n在终端中，如何使用 `nmcli` 命令连接无线网络？选项：\n\
    \n* A) `nmcli add type wifi`\n* B) `nmcli device connect wifi`\n* (正确)\n* C) `nmcli\
    \ connect MyWifi`\n* D) `nmcli up MyWifi`\n\n#### 解释\n连接无线网络的正确语法是 `nmcli connect\
    \ MyWifi`。\n\n### 问题 68\n使用哪个命令可以开启之前被禁用的无线适配器？选项：\n\n* A) `nmcli on`\n* B) `nmcli\
    \ device wifi`\n* C) `nmcli radio on`\n* (正确)\n* D) `nmcli up`\n\n#### 解释\n该命令用于开启无线适配器。\n\
    \n### 问题 69\n当使用 systemd-network 管理网络时，自定义文件应该放在哪个目录？选项：\n\n* A) `/etc/network.d/`\n\
    * B) `/etc/systemd/network/`\n* (正确)\n* C) `/etc/netplan/`\n* D) `/etc/wpa_supplicant/`\n\
    \n#### 解释\nsystemd-network 的自定义文件应该放在 `/etc/systemd/network/`。\n\n### 问题 70\n\
    用户如何运行运行命令来删除名为 `HotelInternet` 的未使用连接？\n\n* A) `nmcli connection delete HotelInternet`\n\
    * (正确)\n* B) `nmcli connection del HotelInternet`\n* C) `nmcli con delete HotelInternet`\n\
    * D) `nmcli con del HotelInternet`\n\n#### 解释\n使用 `nmcli` 删除连接的正确语法是 `connection\
    \ delete`。\n\n### 问题 71\nNetworkManager 定期扫描 wi-fi 网络，`nmcli device list` 仅列出上次扫描到的访问点。如何使用\
    \ `nmcli` 命令让 NetworkManager 立即扫描所有可用访问点？选项：\n\n* A) `nmcli device wifi rescan`\n\
    * B) `nmcli device wifi refresh`\n* C) `nmcli device wifi scan`\n* (正确)\n* D)\
    \ `nmcli device wifi reload`\n\n#### 解释\n`nmcli device wifi scan` 命令指示 NetworkManager\
    \ 立即扫描所有可用访问点。\n\n### 问题 72\n在 systemd-networkd 配置文件的 [Match] 节中，使用哪个名称项可以匹配所有太网接口？选项：\n\
    \n* A) `Type=ethernet`\n* B) `Name=*`\n* C) `Name=eth*`\n* (正确)\n* D) `Type=ether`\n\
    \n#### 解释\nsystemd-networkd 配置文件中 [Match] 节中的 `Name=eth*` 项匹配所有以 \"eth\" 开头的以太网接口。\n"
