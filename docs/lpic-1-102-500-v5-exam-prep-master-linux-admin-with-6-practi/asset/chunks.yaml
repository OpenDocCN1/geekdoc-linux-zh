    ### 问题 17


    脚本中使用哪个运算符表示逻辑或？


    * A) `&&`

    * B) `||`

    * (Correct)

    * C) `|`

    * D) `|&`


    #### 解释


    在脚本条件语句中，`||` 用于逻辑或，这意味着只有在第一个命令失败时才会执行第二个命令。


    ### 问题 18


    脚本脚本中 `test` 命令的目的是什么？


