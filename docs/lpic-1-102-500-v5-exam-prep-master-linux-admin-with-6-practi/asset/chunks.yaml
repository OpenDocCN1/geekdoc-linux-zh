- fmt: "\n## Which command is used to view the time maintained on the hardware clock\
    \ in Linux?\n\n* A) `rtc`\n* B) `systime`\n* C) `hwclock`\n* (Correct)\n* D) `clocksync`\n\
    \n### Explanation\nThe `hwclock` command is used to view and manage the hardware\
    \ clock in Linux.\n\n## Question 10: What is the primary purpose of system logging\
    \ in Linux?\n\n* A) To monitor network bandwidth\n* B) To keep track of system\
    \ and network events\n* (Correct)\n* C) To optimize CPU usage\n* D) To manage\
    \ disk space\n\n### Explanation\nSystem logging in Linux is crucial for keeping\
    \ track of various system and network events, including authentication processes,\
    \ service errors, and more. It helps in troubleshooting, security monitoring,\
    \ and system analysis.\n\n## Question 11: Which logging facility is commonly used\
    \ in modern GNU/Linux distributions?\n\n* A) `syslog-ng`\n* B) `syslog`\n* C)\
    \ `rsyslog`\n* (Correct)\n* D) `systemd-journald`\n\n### Explanation\n`rsyslog`\
    \ is the most commonly used logging facility in modern GNU/Linux distributions\
    \ due to its advanced features and reliability.\n\n## Question 12: Which file\
    \ contains centralized logs for practically all captured logs by rsyslogd?\n\n\
    * A) `/var/log/messages`\n* B) `/var/log/syslog`\n* (Correct)\n* C) `/var/log/auth.log`\n\
    * D) `/var/log/debug`\n\n### Explanation\nThe `/var/log/syslog` file typically\
    \ contains centralized logs for practically all captured logs by `rsyslogd`.\n\
    \n## Question 13: What command is used to read the last lines of a log file in\
    \ real-time?\n\n* A) `head`\n* B) `zless`\n* C) `tail`\n* (Correct)\n* D) `grep`\n\
    \n### Explanation\nThe `tail` command is used to display the last few lines of\
    \ a file, and with the `-f` option, it can be used to follow the growth of a log\
    \ file in real-time.\n\n## Question 14: What is the purpose of the logger command\
    \ in Linux?\n\n* A) To compress log files\n* B) To rotate log files\n* C) To manually\
    \ enter messages into the system log\n* (Correct)\n* D) To delete log files\n\n\
    ### Explanation\nThe `logger` command is used to manually enter messages into\
    \ the system log, allowing users to add custom messages or events for logging\
    \ purposes.\n\n## Question 15: Which directive in the logrotate configuration\
    \ file specifies the number of weeks worth of backlogs to keep?\n\n* A) `daily`\n\
    * B) `rotate`\n* (Correct)\n* C) `weekly`\n* D) `compress`\n\n### Explanation\n\
    The `rotate` directive in the `logrotate` configuration file specifies the number\
    \ of log files to keep before rotating them.\n\n## Question 16: What is the primary\
    \ function of a Mail Transfer Agent (MTA) in a Unix-like operating system?\n\n\
    * A) Storing email messages in individual inboxes\n* B) Forwarding messages between\
    \ local and remote users\n* (Correct)\n* C) Authenticating users for remote email\
    \ access\n* D) Filtering spam and malicious emails\n\n### Explanation\nMTAs are\
    \ responsible for collecting, forwarding, and delivering email messages between\
    \ local user accounts as well as remote user accounts.\n\n## Question 17: Which\
    \ protocol is commonly used by MTAs to transfer email messages over the network?\n\
    \n* A) `FTP`\n* B) `SMTP`\n* (Correct)\n* C) `HTTP`\n* D) `SSH`\n\n### Explanation\n\
    `SMTP` (Simple Mail Transfer Protocol) is the standard protocol used by MTAs for\
    \ sending and receiving email messages over the Internet.\n\n## Question 18: What\
