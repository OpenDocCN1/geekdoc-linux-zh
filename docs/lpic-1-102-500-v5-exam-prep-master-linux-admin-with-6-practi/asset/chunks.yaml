    * B) `addgroup`

    * C) `newgrp`

    * (Correct)

    * D) `userjoin`


    ### Explanation

    The `newgrp` command allows users to temporarily join a group if they know the
    password.


    ### Question 35

    What command is used to filter entries from databases supported by the Name Switch
    (NSS) libraries in Linux?


    * A) `search`

    * B) `lookup`

    * C) `getent`

    * (Correct)

    * D) `find`


    ### Explanation

    The `getent` command is used to filter entries from databases supported by the
    Name Switch (NSS) libraries in Linux.


    ### Question 36

    Which daemon is commonly used to implement NTP in Linux systems?


    * A) `timed`

    * B) `ntptime`

    * C) `ntpd`

    * (Correct)

    * D) `timesyncd`


    ### Explanation

    The `ntpd` daemon is commonly used to implement NTP (Network Time Protocol) in
    Linux systems.


    ### Question 37

    What is the purpose of the `ntpq -p` command?


