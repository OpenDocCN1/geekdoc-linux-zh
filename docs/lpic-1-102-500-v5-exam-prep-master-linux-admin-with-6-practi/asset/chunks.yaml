    * A) `nmcli connection up`

    * B) `nmcli device connect`

    * C) `nmcli connection up MyConnection` (Correct)

    * D) `nmcli device up`


    **Explanation**

    The `nmcli connection up MyConnection` command is used to reconnect a specific
    network connection.

    ### Question 71

    How can you turn off the radio using `nmcli`?


    * A) `nmcli radio off` (Correct)

    * B) `nmcli device off`

