    ## Question 74


    What command would show you if any processes are listening on TCP port 80?


    * A) `netstat -tuln`

    * B) `lsof -i :80`

    * C) `ss -tulw`

    * D) All of the above

    * (Correct)


    ### Explanation

    All of the listed commands (`netstat -tuln`, `lsof -i :80`, `ss -tulw`) can be
    used to show processes listening on TCP port 80.


    ## Question 75


    How could you find which process is listening on a port?


    * A) `ps aux | grep PORT`

    * B) `lsof -i :PORT`

    * (Correct)

    * C) `netstat -tuln`

    * D) All of the above


    ### Explanation

    The `lsof` command with the `-i` option followed by the port number can be used
    to find which process is listening on a specific port.


    ## Question 76


    How could you determine the max MTU of a network path?


    * A) `traceroute -m`

    * B) `ping -M do -s MTU HOST`

    * (Correct)

    * C) `netstat -i`

    * D) `ip route get HOST`


    ### Explanation

    By using the `ping` command with the `-M do` option and specifying the desired
    MTU size with the `-s` option, you can determine the maximum MTU of a network
    path.


    ## Question 77


    How could you use netcat to send an HTTP request to a web server?


    * A) `nc -l 80`

    * B) `nc -u 80`

    * C) `nc -w3 google.com 80`

    * D) `echo -e "GET / HTTP/1.1\r\nHost: google.com\r\n\r\n" | nc google.com 80`

    * (Correct)


    ### Explanation

    This command sends an HTTP GET request to `google.com` on port 80 using netcat.


    ## Question 78


    What are a few reasons pinging a host can fail?


    * A) Firewall blocking ICMP traffic, host offline, incorrect IP address

    * (Correct)

    * B) DNS resolution failure, incorrect subnet mask, network congestion

    * C) Incorrect routing table, DNS cache corruption, MTU mismatch

    * D) All of the above


    ### Explanation

    These are common reasons why pinging a host can fail.


    ## Question 79


    Name a tool you could use to see network packets reaching or leaving a Linux host?


    * A) `tcpdump`

    * (Correct)

    * B) `netstat`

    * C) `traceroute`

    * D) `nslookup`


    ### Explanation

    `tcpdump` is a tool used to capture and analyze network packets.


    ## Question 80


    What is the purpose of the host command in Linux?


    * A) To display entries from name service databases

    * B) To query DNS servers for DNS entries

    * (Correct)

    * C) To configure local name resolution

    * D) To set resolver options


    ### Explanation

    The `host` command is used to query DNS servers for DNS entries in Linux.


    ## Question 81


    Which command is more suited for troubleshooting DNS server configuration in Linux?


    * A) `getent`

    * B) `host`

    * C) `dig`

    * (Correct)

    * D) `nslookup`


    ### Explanation

    The `dig` command provides verbose output and is more suited for troubleshooting
    DNS server configuration in Linux.


    ## Question 82


    What will the command `getent group openldap` do?


    * A) Display information about the openldap group.

    * B) Retrieve the entry for the openldap group from the `/etc/group` file.

    * C) Retrieve information about users belonging to the openldap group from the
    system''s group database.

    * (Correct)

    * D) Check if the openldap group exists on the system.


    ### Explanation

    The `getent group openldap` command retrieves information about the openldap group
    from the system''s group database.


    ## Question 83


    What is the biggest difference between `getent` and the other tools covered, `host`
    and `dig`?


    * A) `getent` retrieves information from the system''s databases while `host`
    and `dig` perform DNS queries.

    * (Correct)

    * B) `getent` is used for querying network information while `host` and `dig`
    are used for retrieving DNS records.

    * C) `getent` is specific to querying user and group information while `host`
    and `dig` are used for DNS queries.

    * D) There is no significant difference between `getent` and `host`/`dig`.


    ### Explanation

    `getent` is used to retrieve entries from the system''s databases like `/etc/passwd`,
    `/etc/group`, etc., while `host` and `dig` are specifically used for DNS queries.


    ## Question 84


    Which option to `dig` and `host` is used to specify the type of record you wish
    to retrieve?


    * A) `-t`

    * (Correct)

    * B) `-r`

    * C) `-q`

    * D) `-s`


    ### Explanation

    The `-t` option in both `dig` and `host` is used to specify the type of DNS record
    you want to retrieve.


    ## Question 85


    How can the previously locked account emma be unlocked?


    * A) Using `usermod -U emma`

    * B) `passwd -u emma`

    * (Correct)

    * C) `passwd -l emma`

    * D) `chage -E emma`


    ### Explanation

    The `passwd -u` command is used to unlock a locked account.


    ## Question 86


    How can the account expiration date be set to never?


    * A) `chage -E 0 emma`

    * B) `chage -l emma`

    * (Correct)

    * C) `chage -d "" emma`

    * D) `passwd -e emma`


    ### Explanation

    The `chage -E 0` command sets the account expiration date to never.


    ## Question 87


    Imagine the CUPS printing service is running. How can you disable it permanently?


    * A) `systemctl stop cups`

    * B) `systemctl disable cups`

    * C) `systemctl mask cups`

    * (Correct)

    * D) `systemctl restart cups`


    ### Explanation

    The `systemctl mask` command prevents the service from being started manually
    or by other services.


    ## Question 88


    What is the purpose of the revocation certificate in GPG?


    * A) To revoke the public key

    * (Correct)

    * B) To revoke the private key

    * C) To revoke the trust database

    * D) To revoke the key pair


    ### Explanation

    A revocation certificate is used to revoke a public key in case it is compromised
    or no longer needed.


    ## Question 89


    How can a user export their public key in GPG for distribution to others?


    * A) `gpg --export-public-key`

    * B) `gpg --send-keys`

    * C) `gpg --export`

    * (Correct)

    * D) `gpg --share-key`


    ### Explanation

    The `gpg --export` command is used to export the public key for distribution to
    others.


    ## Question 90


    What is the purpose of ASCII armored output in GPG?


    * A) To compress the encrypted data

    * B) To increase the security of encryption

    * C) To generate a human-readable format for distribution

    * (Correct)

    * D) To improve decryption performance


    ### Explanation

    ASCII armored output converts the binary encrypted data into a human-readable
    format, which is useful for distribution via email or other text-based methods.

