    by pressing and holding the left mouse button.


    ## Question 32

    What accessibility feature can assist users with reduced eyesight by zooming in
    on parts of the screen?


    * A) Sticky keys

    * B) Slow keys

    * C) Bounce keys

    * D) Screen magnifier

    * (Correct)


    ### Explanation

    The screen magnifier is an accessibility feature that can assist users with reduced
    eyesight by zooming in on parts of the screen, making it easier to see details.


    ## Question 33

    What accessibility feature could help a user to alternate between open windows
    using the keyboard, considering that the user is unable to press the `Alt` and
    `Tab` keys at the same time? Options:


    * A) Sticky keys

    * (Correct)

    * B) Mouse keys

    * C) Bounce keys

    * D) Slow keys


    ### Explanation

    Option A is correct. Sticky keys allow users to press one key at a time for keyboard
    shortcuts that usually require simultaneous key presses, such as `Alt` + `Tab`
    to switch between open windows.


    ## Question 34

    Remove only the developers group from the secondary groups of kevin. Options:


