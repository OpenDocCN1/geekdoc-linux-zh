    How can you filter journal data to display messages from the current boot?


    * A) `journalctl -b` (Correct)

    * B) `journalctl -b -1`

    * C) `journalctl --since "today"`

    * D) `journalctl -u ssh.service`


    **Explanation**

    The `-b` option in `journalctl` is used to display messages from the current boot.


    ### Question 57

    Which option is used to navigate through matches in forward and backward searches
    while using `journalctl`?


    * A) `N` (Correct)

    * B) `Shift + N`

    * C) `/`

    * D) `?`


    **Explanation**

    The `N` key is used to navigate to the next occurrence of a match during searches
    in `journalctl`.


    ### Question 58

    Which file is commonly used to configure email aliases in a Unix-like operating
    system?


    * A) `/etc/mail/aliases` (Correct)

    * B) `~/.forward`

    * C) `/etc/postfix/main.cf`

    * D) `/etc/sendmail.cf`


    **Explanation**

    The `/etc/mail/aliases` file is commonly used to configure email aliases, redirecting
    email messages to specific users or destinations.


    ### Question 59

    What happens if an MTA is configured as an open relay?


    * A) It rejects all incoming email messages.

    * B) It forwards email messages to external addresses without proper authentication.
    (Correct)

    * C) It encrypts all outgoing email messages.

    * D) It filters spam and malicious emails.


    **Explanation**

    An open relay MTA can be abused by attackers to send spam or malicious emails
    by bypassing proper authentication, posing security risks.


