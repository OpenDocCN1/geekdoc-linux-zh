    ### Question 4


    Have a look at the following basic, Hello world! bash script:


    ```bash

    #!/bin/bash


    #hello_world: a simple bash script to discuss interaction in scripts.


    echo "Hello world!"

    ```


    1. Suppose we make the script executable and run it. Would that be an interactive
    script? Why?


    A) Yes, because it prompts the user for input.

    B) No, because it doesn''t interact with the user.

    C) Yes, because it interacts with the environment.

    D) No, because it''s not run in a terminal.


    2. What makes a script interactive?


    A) It runs in a terminal window.

    B) It prompts the user for input.

    C) It executes commands automatically.

    D) It is run by multiple users simultaneously.


    * 1. B, 2. B

    * (Correct)

    * 1. A, 2. B

    * 1. B, 2. A

    * 1. B, 2. C


    #### Explanation


    **Answer: 1. B) No, because it doesn''t interact with the user.**

    **Explanation:** An interactive script requires interaction with the user, such
    as prompting for input or responding to user actions. This script simply prints
    "Hello world!" without any user interaction.


    **Answer: 2. B) It prompts the user for input.**

    **Explanation:** An interactive script engages with the user by prompting for
    input, displaying messages, or requiring user interaction.


    ### Question 5


    Imagine you have changed the values of some variables in `~/.bashrc` and want
    those changes to take effect without a reboot. From your home directory, how could
    you achieve that in two different ways?


    * A) Run `source ~/.bashrc` or restart the terminal.

    * (Correct)

    * B) Run `exec ~/.bashrc` or logout and log back in.

    * C) Run `reload ~/.bashrc` or open a new terminal window.

    * D) Run `update ~/.bashrc` or reset the computer.


    #### Explanation


    Running `source ~/.bashrc` reloads the `.bashrc` file in the current shell, applying
    any changes immediately. Restarting the terminal achieves the same effect by starting
    a new shell session.


    ### Question 6


    1. John has just started an X Window session on a Linux server. He opens a terminal
    emulator to carry out some administrative tasks but, surprisingly, the session
    freezes and he needs to open a text shell. How can he open that tty shell?


    A) Press Ctrl + Alt + F1.

    B) Use the terminal emulator''s menu to switch to a text shell.

    C) Use the graphical interface to open a new terminal window.

    D) Click on the desktop and choose "Open Terminal."


    2. What startup files will get sourced?


    A) `~/.bashrc`

    B) `~/.bash_profile`

    C) `~/.profile`

    D) All of the above


    * 1. A, 2. C

    * 1. C, 2. B

    * 1. B, 2. C

    * 1. A, 2. B

    * (Correct)


    #### Explanation


    **Answer: 1. A) Press Ctrl + Alt + F1.**

    **Explanation:** Pressing Ctrl + Alt + F1 switches to the first virtual terminal,
    which typically presents a text-based login prompt.


    **Answer: 2. B) ~/.bash_profile\**

    **Explanation:** When switching to a text-based terminal, the shell typically
    runs as a login shell, so it sources the `~/.bash_profile` file.


    ### Question 7


    Linda is a user of a Linux server. She kindly asks the administrator to have a
    `~/.bash_login` file so she can have the time and date printed on the screen when
    she logs in. Other users like the idea and follow suit. The administrator has
    a hard time creating the file for all other users on the server so he decides
    to add a new policy and have `~/.bash_login` created for all potential new users.
    How can the administrator accomplish that task?


    * A) Edit `/etc/bash.bashrc` to include commands to create `~/.bash_login` for
    new users.

    * B) Edit `/etc/skel/.bash_login` to include the desired commands.

    * (Correct)

    * C) Run `chmod +x ~/.bash_login` to make the file executable for all users.

    * D) Add a line in `/etc/passwd` specifying `~/.bash_login` as the login shell
    for new users.


    #### Explanation


    The `/etc/skel/` directory contains files and directories that are automatically
    copied to a new user''s home directory when the user is created. By editing `~/.bash_login`
    in `/etc/skel/`, the administrator ensures that all new users will have this file
    created with the desired commands when their accounts are set up.


    ### Question 8


    What is the purpose of a variable in a shell environment?


    * A) To execute commands

    * B) To store and manipulate data temporarily

    * (Correct)

    * C) To display system information

    * D) To control user permissions


    #### Explanation


    Variables in a shell environment are used to store and manipulate data temporarily,
    providing a way to reference and reuse information within scripts or commands.


    ### Question 9


    Which command is used to assign a value to a variable in Bash?


    * A) `set`

    * B) `define`

    * C) `assign`

    * D) `export`

    * (Correct)


    #### Explanation


    The `export` command is used to assign a value to a variable and make it available
    to child processes.


    ### Question 10


    What is the syntax for referencing a variable in Bash?


    * A) `$variable_name`

    * (Correct)

    * B) `%variable_name%`

    * C) `#variable_name#`

    * D) `&variable_name&`


    #### Explanation


    In Bash, variables are referenced by prefixing the variable name with a dollar
    sign (`$`).


    ### Question 11


    Which of the following characters are allowed in variable names in Bash?


    * A) Spaces

    * B) Special characters like `@` and `#`

    * C) Underscores (`_`) and numbers

    * (Correct)

    * D) All of the above


    #### Explanation


    Variable names in Bash can contain letters (a-z, A-Z), numbers (0-9), and underscores
    (`_`).


    ### Question 12


    What happens if a variable assignment has spaces on either side of the equal sign
    in Bash?


    * A) Bash interprets it as a command

    * (Correct)

    * B) Bash throws an error

    * C) The variable is assigned the value within quotes

    * D) Spaces are ignored


    #### Explanation


    If there are spaces on either side of the equal sign in a variable assignment,
    Bash interprets it as a command.


    ### Question 13


    Which command is used to make a local variable immutable in Bash?


    * A) `readonly`

    * (Correct)

    * B) `immutable`

    * C) `lock`

    * D) `protect`


    #### Explanation


    The `readonly` command is used to make a local variable immutable.


    ### Question 14


    How do you declare an array variable in Bash?


    * A) `array`

    * B) `set`

    * C) `declare -a`

    * (Correct)

    * D) `define`


    #### Explanation


    Arrays are declared using the `declare -a` command.


    ### Question 15


