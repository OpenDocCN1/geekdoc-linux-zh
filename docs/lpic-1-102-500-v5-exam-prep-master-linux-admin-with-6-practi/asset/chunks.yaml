    Which of the following commands is used to display the contents of a file in reverse
    order in Linux?


    - A) `cat`

    - B) `more`

    - C) `tail`

    - D) `tac`

    - (Correct)


    ### Explanation

    The `tac` command is similar to `cat` but displays the contents of a file in reverse
    order, line by line.


    ### Question 83

    You have a shell script that takes a filename as input. You need to make the script
    extract just the filename (without the directory path) from the provided input.
    Which of the following commands would accomplish this?


    - A) `echo $filename | cut -d ''/'' -f1`

    - B) `dirname $filename`

    - C) `head -n1 $filename`

    - D) `basename $filename`

    - (Correct)


    ### Explanation

    - `echo $filename | cut -d ''/'' -f1` would give you the first field if delimited
    by `/`, but might not be the filename if the path is complex.

    - `dirname $filename` extracts the directory portion of the path, not the filename.

    - `head -n1 $filename` outputs the first line of the file''s contents, not the
    filename itself.

    - `basename $filename` is a utility specifically designed to strip directory information
    and output the filename.


    ### Question 84

    You want to configure a web server to start automatically when your Linux system
    boots. Which of the following commands (or tools) would you likely use?


    - A) `crontab`

    - B) `systemctl enable httpd.service` (or `service httpd start`)

    - (Correct)

    - C) `inittab`

    - D) `at`


    ### Explanation

    - `crontab` is used for scheduling tasks, not managing system services at boot.

    - `systemctl` (for systemd-based systems) or `service` (for older systems) are
    used to manage system services, including enabling/disabling them at startup.

    - `inittab` is used on legacy SysV init systems, not as common in modern distributions.

    - `at` is for scheduling tasks for one-time execution, not for managing startup
    services.


    ### Question 85

    You need to temporarily set a static IP address of 192.168.1.100 with a netmask
    of 255.255.255.0 on interface `eth0`. Which command accomplishes this?


    - A) `route add default gw 192.168.1.1 eth0`

    - B) `ifconfig eth0 192.168.1.100 netmask 255.255.255.0`

    - C) `ip addr add 192.168.1.100/24 dev eth0`

    - (Correct)

    - D) `dhclient eth0`


    ### Explanation

    - `route add default gw...` configures a default gateway, not a static IP.

    - `ifconfig` is used in older systems, while `ip` is the modern tool.

    - Using `/24` subnet notation with `ip addr` sets the right netmask.

    - `dhclient` automates IP address assignment via DHCP, not for static configuration.


    ### Question 86

    Which configuration file stores the IP addresses of the DNS servers that your
    system uses for name resolution?


    - A) `/etc/hosts`

    - B) `/etc/resolv.conf`

    - (Correct)

    - C) `/etc/hostname`

    - D) `/etc/nsswitch.conf`


    ### Explanation

    - `/etc/hosts` provides static hostname to IP mappings.

    - `/etc/resolv.conf` lists DNS servers your system queries for resolving addresses.

    - `/etc/hostname` only contains your system''s hostname

    - `/etc/nsswitch.conf` determines the order in which services (like DNS) are consulted.


    ### Question 87

    Which of the following commands will change the ownership of a file?


    - A) `chown`

    - (Correct)

    - B) `chmod`

    - C) `chgrp`

    - D) `chuser`


    ### Explanation

    The `chown` command in Linux is used to change the owner of a file or directory.
    The `chmod` command changes the permissions of a file or directory, `chgrp` changes
    the group ownership, and `chuser` is not a valid command.


    ### Question 88

    Which of the following commands can be used to view the contents of a compressed
    file without decompressing it?


    - A) `cat`

    - B) `zcat`

    - (Correct)

    - C) `less`

    - D) `more`


    ### Explanation

    The `zcat` command in Linux is used to view the contents of a compressed file
    without decompressing it. The `cat`, `less`, and `more` commands can be used to
    view the contents of a file, but they do not work with compressed files without
    the help of other commands.


    ### Question 89

    Which of the following commands will display the last part of a file?


    - A) `head`

    - B) `tail`

    - (Correct)

    - C) `cat`

    - D) `less`


    ### Explanation

    The `tail` command in Linux is used to display the last part of a file. The `head`
    command displays the first part of a file, and the `cat` and `less` commands can
    be used to view the entire contents of a file.


    ### Question 90

    Which command would allow a user named "john" to create files and directories
    owned by the "accounting" group, without changing the default group for new files
    created by "john"?


    - A) `newgrp accounting`

    - B) `chgrp accounting /home/john`

    - C) `usermod -a -G accounting john`

    - (Correct)

    - D) `chown accounting /home/john`


    ### Explanation

    - `newgrp accounting` would temporarily switch "john" to the "accounting" group,
    but doesn''t change the default.

    - `chgrp accounting /home/john` would change the group ownership of the directory
    itself.

    - `usermod -a -G accounting john` adds the "accounting" group to "john"''s supplementary
    groups.

    - `chown accounting /home/john` would change the owner to "accounting".


    ### Epilogue

    Congratulations! You''ve reached the culmination of your journey. By diligently
    working through the practice exams, mastering the key concepts, and leveraging
    the provided resources, you''ve equipped yourself with the essential knowledge
    to confidently approach the LPIC-1 "LPIC-1 102-500 V5 Exam Prep: Master Linux
    Admin with 6 Practice Tests." Remember, the LPIC-1 certification is merely the
    first step on your exciting path to becoming a proficient Linux administrator.
    The world of Linux is vast and continuously evolving. Embrace the spirit of lifelong
