    about available desktop applications and how to use them.


    ## Question 30

    How could the Bounce keys accessibility feature help users whose involuntary hand
    tremors disturb their typing? Options:


    * A) By repeating a keystroke if it is held down for a certain period

    * B) By slowing down the keyboard repeat rate

    * C) By delaying keystrokes to filter out unintentional multiple key presses

    * (Correct)

    * D) By activating a key after it has been pressed twice in quick succession


    ### Explanation

    Option C is correct. Bounce keys delay keystrokes to filter out unintentional
    multiple key presses, which can help users with hand tremors type more accurately.


