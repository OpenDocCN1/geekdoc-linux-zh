    * 1. 有效, 2. 无效, 3. 有效, 4. 有效, 5. 有效, 6. 有效, 7. 无效


    ### 解释

    1. `at 08:30 AM next week`

    有效：这指定了下周上午 08:30 的时间。

    2. `at midday`

    无效：“midday”不是一个有效的时间格式。

    3. `at 01-01-2020 07:30 PM`

    有效：这指定了 2020 年 1 月 1 日晚上 07:30 的时间。

