    # Encryption—Not Just for Breakfast Anyone


    You need to use encryption of the tools/commands when communicating sensitive

    (or not so sensitive) information, or you put yourself at risk of having your
    passwords,

    files, and anything that moves across the network, copied, and redistributed.

    Let''s talk about the application encryption protocols that are generally available
    on

    OpenVMS and Linux systems.


    # SSH (V1 and V2)


    SSH, or secure shell, features are well known and have been available for many
    years

    between many different hosts in the TCP/IP world. SSH has the ability to create
    an

    enrypted session between two hosts. You can open an encrypted SSH client terminal

    connection to an SSH server. All the terminal communications are encrypted

    between the client and server. Both Linux and OpenVMS can be clients and servers
    in

    this arrangement, allowing secure terminal sessions to and from both systems.

    MultiNet uses this protocol and a file transfer application, SCP, for OpenVMS

    using this protocol. (VMS TCP/IP engineering has been requested for SSH for

    some time, but they have their attention distracted by other TCP/IP directions).


    In the rest of the Open Source and Linux world, SSH is usually a terminal or shell

    command tool that comes with the operating system, but does not do file transfer

    (FTP) by itself. Additional applications have been written to use the SSH protocol
    for

    file transfer, such as MultiNet''s SCP product for OpenVMS and SFTP (Secure FTP)
    for

    Linux and UNIX users.


    HP''s TCP/IP services for OpenVMS does not have SSH capabilities, but with the

    addition of the MultiNet SSH layered product, SSH protocols work with TCP/IP

    services (5.3 TCP/IP EAK from HP), making SSH work between Linux and

    OpenVM. You would use SSH if you needed secure terminal access between Linux or

    OpenVM systems in a public or private network that had to support interactive

    terminal or shell command logins and not be view password exchange and data

    exchange in plain text.


    Software for this type of encryption application can be found at the following


    +   • For Linux: OpenSource available in the Linux standard distributions or at

    http://www.openssh.org/'
