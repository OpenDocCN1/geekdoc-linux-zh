- img_proc: true
  md: '# Back at the Treasure Hunt


    Arriving home with the new treasure for your collection check out the hardware
    and supplying the missing pieces for your new system—maybe a monitor or ASCII
    terminal, power cord, keyboard, or mouse; perhaps you need to tighten a few screws
    or install a disk. The power cords are in place, all the cards have been reset
    in their slots, the network card is plugged in, the monitor is connected to what
    looks like a VGA port, and the moment of truth arrives. You apply power to the
    system! The monitor makes a sound like a loose string guitar and symbols appear
    on your screen:


    +   * 16, 32, 64, 96, 128 Mbytes of memory count down (the system is looking better
    and better).


    +   * The floppy groans, the CD-ROM blinks, and the BIOS firmware shows it''s
    loaded with options.


    +   * The hard drive starts to boot Linux, or OpenVMS—quick, what are you going
    to do?


    By the time you are to ask the boot messages have flashed by, the X Windows banner
    login comes up and you are stuck with a multiuser system without a user name or
    login.


    An X Windows login banner hides secrets! Was this a system that managed a nuclear
    plant, hospital, bank, or ISP? Maybe part of the deal with the person who gave
    you the system was that you would scratch the disk to remove all of that valuable,
    proprietary data; but here blinks the cursor—mocking you from a small screen.


    So you resolve to break in, peek under the covers, and then scratch the drives—as
    any good system administrator knows his or her weekly ration might. Ethics aside,
    there are many legitimate reasons for breaking in and taking control of Linux
    or OpenVMS systems, even if you''re not the system owner!


    # Legitimate Reasons for Breaking into Linux or OpenVMS Computers


    +   * The system admin has left the company with no transition to the new system
    administrator.


    +   * The system has been compromised and you have to take control and rebuild/
    security. No one knows what is on the system anymore. No one knows what the current
    system is doing! No one remembers the System (OpenVMS SysAdmin ) or root (Linux
    SysAdmin ) password.'
