    Hardware and software standards make computer communications possible, and while
    looking at another OSI chart (Happy Mnemonic: All People See to Need Data Processing!)
    may not seem useful, you will need to know where TCP/IP applications and protocols
    operate when you are troubleshooting network applications! If you can''t tell
    the network manager why the problem is in Layer 3 or below, he will always blame
    it on your book or application—so you better get used to it.


    # The Importance of a Network Manager


    Always remember that the network manager is your best friend in the network and
    can get you TCP/IP addresses, cables, and Ethernet cards and software! The network
    manager knows where the routers are and which numbers to get ***(domain) Digital
    Name Service (DNS), as well as the gateway numbers to other networks. You should
    remember and mark well that your new best friend will be a snarling beast, who''ll
    insult your lineage, choice of OS, or computer knowledge, if you ever occasion
    to question the network''s current status or ask why your system can''t communicate
    with the other network.


    So let''s get over some questions that you or your network manager will need to
    answer for both machines before you can even start to connect a VMS and a Linux
    system to a TCP/IP network.'
