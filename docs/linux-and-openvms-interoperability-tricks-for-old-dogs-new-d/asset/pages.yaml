  md: '# Foreword


    For the last twenty-five years, HP OpenVM™, a proven enterprise-class operating
    system, has been supporting customers'' most demanding business-critical requirements
    for reliability, availability, scalability, and security.


    In the last five years, Linux and the open source movement have moved from a small-system
    operating system on the technology fringe to to a serious contender in corporate
    computing.


    Both operating systems have have much in common with UNIX and Windows servers.
    OpenVMS is a general-purpose operating system that has many standard interfaces
    and APIs Linux is a customizable operating system that shares its APIs with UNIX.
    APIs common to both operating systems allow OpenVMS and Linux to interoperate
    easily.


    OpenVMS and Linux operating in the same enterprise environment let you combine
    the low per-unit cost structure of Linux and its huge open source libraries of
    software with the proven high availability, security, and scalability and exceptional
    robustness of OpenVMS.


    I''ve found this book to be a practical, hands-on manual that explains how OpenVMS
    system managers can integrate their systems with Linux, allowing the two platforms
    to work cooperatively and extend the processing capability of a computing environment.
    John clearly describes the features and benefits of both operating systems, so
    that you can evaluate which one is best for any given task. The hints, tips, and
    techniques you''ll find here will help you create a heterogeneous OpenVMS and
    Linux computing environment to meet your needs today and tomorrow.


    Martin R. Fink

    Vice-President and Chief Technology Officer

    Hewlett-Packard'
  merge: -1
  pgno: 0
- img_proc: true
  md: '# Preface


    This book began many years ago when Linux was only a dream of Mr. Torvald''s.
    Its germs were in the DECWindows Cookbook, DFWCUG Longwords Newsletter articles,
    and hints and techniques shared at a hundred DECUS sessions that connected Open-VMS
    and Unix systems together in some way over the years.


    From all of these ideas, plus Linux''s evolution with the number of times Linux
    and OpenVMS were being used in the Datacenters, I felt a need to better understand
    the things that Linux and OpenVMS could do together. I also felt that if I needed
    to understand this type of interoperability, many other people might need the
    same understanding too. Today Linux and OpenVMS using Open Source programs have
    an identical look and feel for many of their applications and interfaces . Despite
    the similarity of look and feel, configurations, installations, and scripts vary
    between operating systems (OSs)


    This book identifies areas of interoperability, and more importantly provides
    a step-by-step process to those areas. Products, configurations, scripts, are
    all in this book with one goal: To make something happen between Linux and OpenVMS.
    No matter if you''re a VMS admin or a Linux admin, this book will allow you to
    enable interoperability between Linux and OpenVMS.


    I can also add that you learn to use the local editors, which are not covered
    in this book. Learn the terminal or Command Line Interface (CLI) editor like "vi"
    for Linux and "edit" for VMS; they are essential to any system manager''s tool
    bag. X Windows-based editors are also available, but if you learn the CLI editor,
    you will be able to work on these systems without a windowing system (or startup
    procedures). After you''ve learned the editors for Linux and OpenVMS, the rest
    of the procedures in this book should be easy to accomplish.


    You may also want to load clean versions of each OS before trying to configure
    the tools in this book. I used OpenVMS version 7.3-1 and RedHat 7.3 for all the
    procedures described in this book. You may want to visit Chapter 2 first to learn
    how to break into Linux and OpenVMS if you''ve inherited your systems, and if
    you need to reuse the existing installations!


    This book is an adventure in Open Source, TCP/IP, X Windows, security, and much
    more. I hope it broadens your understanding of both OpenVMS and Linux and helps
    you to understand what two great OSSs can do together.


    All my best,

    John Robert Wisniewski

    March 2003


    Publisher''s Note: There is considerable variation in the usage of the phrase
    Open Source; the majority view seems to be that both words are capitalized. However,
    others consistently use lower case. We have chosen to follow the most common usage
    and capitalize both words throughout the body of the book.'
  merge: -1
