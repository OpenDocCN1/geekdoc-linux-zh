    Figure 5-1 X Windows display paths.


    2000), and the beginnings of DCE. OpenVMS and many UNIXes adopted X Windows, because,
    unlike display-list managers or other local GUIs that could only display graphics
    and control the local system, X Windows was designed and optimized to have its
    graphical interface networked. X Windows was designed for local or remote application
    display across many standard network protocols (TCP/IP, LAT, DCNet, SNA). In X
    Windows (unlike window managers that controlled only local hardware, such as a
    local plotter), graphical output was architected and optimized for transmission
    across networks to other X Windows displays on any X Windows computer in the network!
    This makes easy to display between multiple systems or made it easier to have
    many different graphics brought to a single graphics regardless of operating system
    of origin! That level of Open Systems interoperability is why DCE chose X Windows
    as its GUI OpenVMS workstations and servers in 1988 and why HP continues to support
    X Windows to its day!


    Fast forward 17 years and 6 major X Windows software releases, and also to this
    tested graphical-display system''s security, new graphical cards, Alpha system
    computational performance, and faster and faster network connections. It''s easy
    to see why a low-cost Linux system would make a perfect, inexpensive integrated
    workstation to display graphics and applications from an OpenVMS server using
    standard X Windows tools!


