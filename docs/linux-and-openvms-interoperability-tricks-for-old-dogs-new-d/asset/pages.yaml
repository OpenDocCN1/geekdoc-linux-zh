  md: '# Compaq Secure Web Browser - CBWB (V1.0)


    # Compaq Secure Web Browser for OpenVMS™ Alpha™


    Congratulations for successfully installing CBWB V1.0!


    Compaq is pleased to provide the first customer release of CBWB for OpenVMS Alpha,
    based on the Mozilla 1.0 (M1) release.


    # What is CBWB?


    The Compaq Secure Web Browser is based on the Mozilla open-source project started
    in 1998 by Netscape Communications Corporation. Mozilla Web Browser is designed
