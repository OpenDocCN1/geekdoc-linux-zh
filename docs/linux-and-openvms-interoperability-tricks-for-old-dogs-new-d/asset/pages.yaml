  md: "You are about to be asked to enter information that will be incorporated\n\
    in your certificate request.\nWhat you are about to enter is what called a Distinguished\
    \ Name or a CN.\nThere are quite a few fields where you can leave some blank\n\
    For some fields there will be a default value,\nIf you enter '..' the field will\
    \ be left blank.\n\n```\n$ stunnel/stunnel-3.22\nCountry Name (2 letter code)\
    \ [US]\nState or Province (full name) [State-Name]:Texas\nLocality (eg, city)\
    \ [Mesquite]\nOrganization (eg, company) [Shanghai]:Defcon-VMS\nOrganizational\
    \ Unit Name (section) [cflug]\nCommon Name (of your server) [localhost]:\ntest\
    \ -1 eq 1 -f /dev/urandom || /dev/random 512 stunnel.pem\ntest -1 eq 1 -f /dev/urandom\
    \ || \\\n/usr/bin/openssl x509 -dates -fingerprint -nout \\\n||\nsubject=C=US/ST=Texas/L=Mesquite/O=Defcon-VMS/OU=cflug/CN=localhost\n\
    notBefore=Aug 27 01:51:24 2023 GMT\nnotAfter=Aug 27 01:51:24 2024 GMT\nM256 fingerprint:F1:B9:17:6B:C5:7E:A0:32:12:60:F5:42:E46\n\
    [root@stunnel-3.22]# \n```\n\nFigure 4-3 Answer the questions from the market\
    \ so you can create a stunnel file for the Linux system.\n\n```\n$ stunnel/stunnel-3.22\n\
    test -1 eq 1 -f /dev/urandom || \\\n/usr/bin/openssl genrand 512 >> stunnel.pem\n\
