    # First the Rush, Then the Letdown


    You log in as root or System and look around the box. Data is missing, and shards
    of pointers hint at what the system''s duties once were. There are disk commands
    that point at nonexistent volumes, and that no one has used in five years stand
    ready to do your bidding. A gem from a past job emerges and reminds you of something
    you did. Then you realize it''s time to scratch the disks and put together a configuration
    that better suits your purposes, rather than trying to salvage the existing system
    disk and its dated software.


    You are tempted to do a backup of your new system and save the work from an elder
    system, but you stop and consider privacy and who left resumes, personal budgets,
    and e-mail on the system you now have full dominion of. Nothing appeared illegal,
    immoral, or fattening, so there is no reason to keep a copy of another person’s
