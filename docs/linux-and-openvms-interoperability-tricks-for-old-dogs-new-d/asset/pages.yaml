  md: '# Chapter 4 — Security Tools for OpenVMS and Linux


    ## Ever Been Hacked?


    It was summer’s end, 1999. I was a seasoned, tough, and experienced SE preparing
    my customers for the Y2K nonevent with firmware, software, and professional advice.
    She was a tough dame from the wrong side of the pews from the local church group
    but she could since decipher COBOL during those months. The computer world felt
    like it was self-destructing before our very fingers, and then I decided to build
    a Linux box.


    A Linux box. Oh, I had loaded several times before, but it was time. Time to have
    a Linux box on my home network configured the way I liked it, time to have a Linux
    box on the Internet as a symbol of my prowess. Beside, all of you know how women
    digs who run Linux,


    Well, that’s how I all started. I built a 450MHz workstation/server from junk
    I had laying around, installed a 40GB disk, 256MB disk, and 10/100 Ethernet. I
    built Linux from a “red” distribution I bought for $3 per disk from cheapbytes.com.
    I loaded everything. Not a few tools, but everything. I had compilers (FORTRAN,
    COBOL, C++, CPlusC, and more) graphical tools such as graph, hypersnap, and ASCII
    art; games and more games, X Windows, and SAMBA, MySQL, YOURSQL, NFS, NSA, UBU.
    Anything I could find in RPM format, I loaded.


    Oh, it was a fine box. A system built by a professional for his amusement. It
    would be my personal Linux playground. Then I sat in front of my creation and
    booted it for the first time connected to the Internet. I had OpenVMS server for
    the Internet for almost 10 years without incident (if you could count being tied
    to via UICP), so I felt safe and secure a Linux OS would be safe enough for me
    against the ravages of the Internet. First things first: I configured Apache and
    created a SAMBA SMB pointer to my home directory and an MP3 file share. I loaded
    10 gigabytes of nap files on that file share and began to explore the tools and
    things that were now available to my home network.


    Four Days Later


    The newness of the Linux box had faded somewhat, and I was back on my OpenVMS
    system reading my mail in Netscape. A strange-e address appeared in my inbox that
    looked like it was from “Down Under.” I opened the letter and realized immediately
    from the headers it was from an OZ domain and began to read.

    “Greetings,” I could almost hear the Aussie accent through the wires “Why are
    you probing and scanning my entire Class C address space?”'
  merge: -1
  pgno: 29
- img_proc: true
  md: 'I was stunned. I wasn''t running any port scans on Pacific Rim Class Cs, was
    I? Then I saw the logs he sent me. It wasn''t me, it couldn''t be me! Remember
    all the phases—denial, anger, bargaining, depression, acceptance. I went through
    them all that first 24-hour period after being hacked.


    It looked like these pings and scans were from my new Linux box! It was late and
    I was in total denial and sent a mail message back to this brute, “Couldn''t be
    me” Then I went to bed.


    The next morning my friend from Australia had sent me more logs, proving my system''s
    complexity in probing: “Greetings Mate, I believe the script kiddies control of
    your box and you should really find out what they''re doing.”


    Script kiddies—the name terror into my four-day-old Linux install. How could they
    find me in the huge expanse of the Internet. I was only up for four days! Feeling
    like a stranger in a land, I did what any OpenVMS system manager would do when
    confronted by a problem with a Linux box. I called another OpenVMS system manager!
    Not just any system administrator, but my good friend Davidhey, chairman of the
    DECUS/VMS SIG and president of the Dallas–Ft. Local user group. David had Linux
    experience than I quickly pointed out that we should look for strange files on
    the system.


    Dave came over and we looked for temporary files. Seek and you will find; I had
    all the parents of finding their child infested with lice! The Linux box was not
    only hacked, but there were logs of port scans, scan executables, and logs with
    entire file conversations between two miscreants about cracking boxes and using
    to find new boxes to attack. David and I watched and waited and captured the session
    information as superuser—one was looped through AOL so it wouldn''t get caught,
    and the other was looped through the University of Korea.


    I did what red-blooded system administrator do: take the logs, copied the files,
    called and gave AOL the user ID of the perp who had ravaged me for fiendish purposes.


    Of course, AOL wanted nothing to do with my evidence I had had the FBI or at least
    local law enforcement! I thought about the $42 million in IT charges I could bill
    for my production Linux box being attacked and compromised by an AOL script kiddie,
    though better about wasting the authorities'' time.


    My postmortem on the Linux box consisted of taking it off the Net and identifying
    how the crackers had just walked right in and had my machine doing grunt work
    like the mule. The answer was in the password file—I had loaded everything, every
    RPM I could! A database loaded and a privileged user account by default could
    create other accounts—WITH A DEFAULT PASSWORD!'
