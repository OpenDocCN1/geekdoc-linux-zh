  md: 'code handling such data (short of a corporate HR directive about these types
    of files), but there is an ethical code. Just as Congress wrote the law that radio
    scanners can listen to cellular and other communications but not reveal what they''ve
    heard, system administrators have a similar responsibility. Corporate rules regarding
    privacy and personal files complicate the issue, but unless there is a very good
    reason (such as suspecting illegal activity was caused by the system) a system
    administrator should never reveal or copy a user''s personal files or information
    or what was found to anyone else.


    You''re asked specifically, but professional courtesy to the previous owner or
    administrator demands that you erase the data (not necessarily the system programs)
    from the old system you acquired. If you believe in karma, then perhaps someone
    will do the same for you one day. When you''re running late and just to get rid
    of a machine without throwing it away and give it a good home, perhaps you could
    give to an up-and-coming young professional who needs a good used system to practice
    with.


    Of course, it''s never going to happen that you give away systems without remembering
    what''s on them, and you''ll always delete all the data from all the disks you
    scrap, erase CD-ROMs in the microwave, bulk magnetic tapes, shred personal data
    and procedures, and destroy all ID cards you find in the boxes of surplus donation.
    We''re just talking about a hypothetical situation here and not anything I''ve
    ever found in/on/with systems I''ve seen.


    There are many reasons to break into a system; in your tool bag for OpenVMS and
    Alpha should always have an OpenVMS boot disk (the CD-ROM that loads OpenVMS)
    at the latest version (7, 7.3-1) you can find, and a RedHat Linux 7.2 or 7.3 boot
    disk. These tools will help you when opening up systems when you need to do so.


    From treasure hunt to salvage, corporate rescue, to recovered systems, breaking
    into systems is everything admin folks should be able to do.


    You may find interesting things in the systems you overpower, and remember with
    great power come great responsibilities. Ethically, morally, and professionally
    you don''t break into systems just because they are there or how a way in. That
    way leads to the dark side of the profession.


    I grant you this knowledge to help and not to hinder. I also want that, and then
