    +   - /TRANSPORT=(use TCP/IP if you''ve installed LAT or DECnet in your Linux
    kernel).

    - /EXECUTIVE_MODE (optional) creates an executive mode WSAx: device for all processes
    on your system to use (must have privileges to this).

    - /SUPERVISOR_MODE (optional, default) creates a supervisor mode WSAx: device
    for your current processes (and subprocesses).

    - /USER_MODE (optional) restricts the next command.


    This command will not change running X Windows display from an OpenVMS server,
    but it will change where the output is for all new programs that are run!'
