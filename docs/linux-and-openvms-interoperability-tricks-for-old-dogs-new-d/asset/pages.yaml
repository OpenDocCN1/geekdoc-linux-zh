    # Security in an Insecure World


    All the OpenVMS engineers I know take TMS very seriously. I believe that Open
    Source software becomes more and more utilized by all systems, the winners (from
    a security standpoint) will be the companies that pay attention to the details
    and look for security holes and how to fix them in Open Source software before
    it gets distributed to customers and users. Commercial SSL implementation will
    be one of the directions for security and tools today—for commercial systems and
    Open Source systems such as Linux.


    In the OpenVMS 7.3-1 documentation there are three volumes available about system
    security. One is the updated Guide to Systems Security, which has kept OpenVMS
    protected for the last 25 years. The other two are new. They are Open Source Security
    for OpenVMS Alpha Volume 1—Common Data Security Architecture and Volume 2—Compa
    SSL (Secure Socket Layer) for OpenVMS Alpha. That''s how important Source is going
    to become over the next few years regarding security and authentication. OpenVMS
    already has two volumes in its doc set devoted to the use and security of Open
    Source tools. It''s my recommendation that OpenVMS


