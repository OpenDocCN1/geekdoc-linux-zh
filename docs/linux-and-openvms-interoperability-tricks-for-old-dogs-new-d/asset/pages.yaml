  md: 'If you do an "NSLOOKUP" from a Linux or OpenVMS system and plug in a valid
    DNS name, you get an address such as 209.39.152.33. If you convert the TCP/IPs
    octets to their binary representations (with the help of a scientific calculator),
    you get


    ```

    209 = 110100201

    39 = 00100111

    ```


    Be sure to add the padded 0s in front for an 8-byte / character binary!


    ```

    152 = 10011000

    33 = 00100001

    ```


    Add the binary (base 2) strings together


    ```

    209.39.152.133 = 11010001001111100110000100001 (base2)

    = 3509032993 (base10)

    ```


    From Netscape Internet Explorer or your favorite Web browser, try these numbers:


    ```

    http://3509032993

    http://1094769874

    ```


    Which is easier to remember a 10 digit number or a URL name on the Web? You do
    the math.'
  merge: -1
