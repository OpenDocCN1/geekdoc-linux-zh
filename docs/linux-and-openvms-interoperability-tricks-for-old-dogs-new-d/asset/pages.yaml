    Regarding other DECwindow applications: Some of the applications are straightforward
    (such as DECW$CLOCK), but others are not clear. DECW$TERMINAL, DECW$WINMGR, and
    others look like they could start window managers or create a new terminal (and
    process). In fact, that is what programs are for, but they are accessed by the
    VMS startup programs to run Windows on a VMS server, while others are used by
    the VMS Command Line Interpreter to create terminals or begin Windows sessions;
    this is similar to xit or x86config on Linux.


    > Note: Do not run window manager programs directly, since they could mess up
    your Windows sessions on both machines!


    One way to gain easy access to the OpenVMS X Windows applications is to either
    DECW$SESSION.EXE or DTS$SESSION.EXE session manager. DECW$SESSION is the older
