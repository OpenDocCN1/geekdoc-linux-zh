- img_proc: true
  md: '# Linux and OpenVMS—The Future


    In my day I''ve seen PDP 16-bit systems, VAX 32-bit systems, Alpha 64-bit systems,
    and now Itanium 64-bit systems. No doubt there will be a few more hardware platforms
    and systems in the general-purpose computing before I''m ready to retire. Already
    Itanium supports 64-bit Linux, and the plan is to have OpenVMS and its layered
    products ported to Itanium by early 2004. What platform do we use when Windows,
    Linux, UNIX, VMS, NSK, and a host of other operating systems all run on the same
    hardware? As hard as it is to hear for many folks, one operating system isn''t
    the answer for all computing jobs.


    As we move forward with our industry, we need to look for the right tool for the
    right job and not be hung up every computer being the same. Same interfaces, some
    applications, same tools? Certainly! Not the same operating environment.


    We have needs for desktops, mid-range servers, super servers, clusters, and disastrous
    clusters; these aren''t deployed just on a single OS–it''s interoperability that
    gives us more choices, less cost, and better solutions for computer needs across
    our industry.


    The features that are hallmarks for Linux simply don''t add value at the high
    end of commercial systems, and without specific funding for that market niche,
    they may never become part of the Open Source and GNU world. The OpenVMS features
    that make it the best tool for 24/7/365 operations won''t win any friends down
    the desktop because that''s simply not its forte.


    Common ground, common applications, and common server applications are a great
    start to solving new problems, but learning about all the computing options that
    are available today lets solve future problems that we couldn''t solve using a
    single technology.


    Linux, OpenVMS, and Open Source will be around for at least the next 20 years.
    I hope that we can all learn from today and make interoperability between systems
    and people that much better in the future.


    See you in the future. It''s where we''re all destined to spend the rest of our
    lives!'
