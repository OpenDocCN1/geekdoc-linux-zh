- img_proc: true
  md: '# Stunnel


    SSL requires an application to map and remap local host ports, and that remapping
    tool is called Stunnel.


    Stunnel is an application that allows you to encrypt TCP connections within SSL.
    This is a very new and useful approach to encryption applications, because instead
    of reprogramming nonencrypted application protocols (such as Telnet, POP, IMAP,
    LDAP), you can just use Stunnel to provide the encryption.


    Just how useful is Stunnel? With the introduction of OpenSSL and Stunnel on OpenVMS,
    a system administrator has another tool that can now securely manage the OpenVMS
    systems from a Linux workstation or even a Windows workstation! And, of course,
    it works for the OpenVMS system administrator who wants to securely manage or
    her Stunnel tools!


    Stunnel distributions include the following:


    +   - Open Source Stunnel sources for Linux and Windows may be found at http://www.stunnel.org
    /


    +   - OpenVMS Stunnel kits are available with the OpenVMS 7.3-1 distribution from
    HP and should be on the Web at http://www.openvms.compaq.com


    # Stunnel Server Installation on OpenVMS


    I had just built my first OpenVMS 7.3-1 system in my garage and looked at all
    the new Open Source tools that were beginning to be integrated into OpenVMS. Wanting
    to install Stunnel between a Linux system and an OpenVMS system, I called on another
    OpenVMS expert, Steve Smiley. Now Steve has been a strong advocate for SSH for
    years and continually asked for SSH on OpenVMS. Asking him for some doing Stunnel
    was more than an acid test for encrypted Telnet and how it was going to work across
    the Stunnel. Figures 4-1 through 4.26 illustrate a Stunnel server installation
    on OpenVMS.'
