  md: 'Tested and supported features, lowest cost of ownership and deployment in the
    industry, highest availability and scalability, and a 25-year track record with
    interoperability with all the latest Internet and e-business software and tools—that’s
    why you will use OpenVMS for the next 10 years.


    # Why Linux?


    When Linus Torvald started his project, he dreamed of an OS unencumbered by source-restrictions
    and copyrights. In just a few years, Linux workstations and servers began to emerge
    as a powerful Open Source alternative to Windows desktops and many UNIX servers.
    Productivity tools such as Star Office, WordPerfect, and many other application
    ports were available. Games were also available on these new Open Source boxes.
    As the desktop functionality grew, many saw computer server functions as Linux’s
    destiny. Linux is a workstation and a server with a graphical user interface for
    management (Gnome and KDE are the two interfaces of choice). With HP and others
    beginning to offer certification as Linux Accredited Systems Engineers, support
    and services are beginning to mature.


    Where does Linux fit in today''s IT strategy? Let’s review some of its features.


    +   * Laptop: With Sun’s Star Office or Corel’s WordPerfect 2000 suite, a Linux
    installation offers the users less disk space consumption than a comparable Windows
    OS and Office suite. Linux also offers the ability to reuse two-to-year-old laptops
    that are now underpowered to run the latest versions of Windows products, but
    it can also run the latest versions of Linux and many personal productivity tools
    that run on the platform. For Microsoft interoperability Binari Systems also offer
    bug-free compatibility with Windows Exchange Clients (Outlook) and Windows-compatible
    Exchange Servers for Linux and UNIX systems to integrate directly into Exchange
    E-mail Server infrastructures. Alternatively, Linux and other users can if they
    have POP3 or IMAP servers already in place (http://www.binari.com/; http://www.sun.com/staroffice/,
    http://linux.corel.com/).

    * Workstation: What goes on for Linux desktops. A few-year-old 300-500MHz workstation
    or even Alpha workstation can run Linux and its applications blazing fast. Instead
    of using new workstations with 50 percent more memory and disk space, recycling
    your used desktop saves money and upgrades easily to Linux with as much ease of
    use as Windows desktops. And while there have been some demands for enhanced Linux
    security, it’s nothing like the defense that must be mounted against the


    Chapter 1 – Assessing OpenVMS and Linux: The Right Tool for the Right Job 5'
