    # X Windows, VMS, Linux, and a Bit of History


    In 1988, 10-year-old VMS operating system was migrated from a display list window
    manager, “VWS,” to the X Windows-based “DECwindows” for all of its OpenVMS graphical
    workstations. Then, as Windows continued to evolve, VMS added the Motif Window
    Manager and by 1997 even had the UNIX CDE (Common Desktop Environment). Linux
    evolved in the 1990s, building to these already established by standards: X Windows
    for interoperability, Motif for standard-style management of X processes and sessions,
    and CDE for a common look and feel in the UNIX and X Windows workstation community.


    Today, we take these standards for granted in the workstation and Open Systems
    world, and multipatform, multimedia internet browsers were, in fact, the final
    word on the merits of X Windows versus Linux Graphical User Interfaces (GUIs).
    If we look back, it might be worth noting why OpenVMS changed from a display-list-based
    GUI to an X Windows-based GUI for its workstation displays.


    During the 1980s, display-list window managers enjoyed their flower. By the mid-1980s
    graphics handlers were still standalone with display connected to a computer system
    that required graphical/Windows output. These two specialized computers communicated
    (usually) across serial or parallel cables, just as if the primary computer system
    were talking to a printer or plotter. Plotter is the key to understanding this
    relationship, because the same commands that drive plotter pens to draw lines
    and automatically fill areas on paper became the basis for commands to plot graphics
    on the display-list computer heads of the 1980s. As the first workstation driving
    graphics emerged, less less than Pen Plotters were reduced to many chips with
    a display screen, the commands that drive graphics continued to be the same local
    plotting commands and languages that ran the previous generation of displays.
    Each company had its own standards, chip sets, and commands and had little regard
    for any hardware or network abstraction for graphical commands. Graphical libraries
    for developers (such as GKS and PHIGS) were designed to help in developing programs
    that could run on a variety of hardware, but that wasn''t enough. There needed
    to be a standard way of displaying process graphics across networks and different
    computers.


    Then, in 1985, DEC funded MIT to research “Project Athena.” Out of research came
    X Windows, Kerberos (the security model now being adopted by Windows'
