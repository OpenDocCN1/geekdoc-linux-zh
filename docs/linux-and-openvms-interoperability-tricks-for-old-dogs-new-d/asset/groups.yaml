    \nFigure 5-12 Then just click on your new pull down!\n\n![](img/a26aae01e7657faca13785a7eb03624a_66_1.png)\n\
    \nFigure 5-13 Hey! Where did all these VMS applications and menus come from! I\
    \ thought this was a Linux Box!\n\n66 Linux & OpenVMS Interoperability\n\nNotice\
    \ that these applications came from the VMS CDE/DTSESSION manager program at the\
    \ same time the DEC$$SESSION manager program and the Linux KDE session manager\
    \ are running! Be careful, because any of the session managers can now log you\
    \ out.\n\n## Displaying Your Linux Windows Applications on OpenVM\n\nBack in the\
    \ mid-1980s, when VMS workstations were state-of-the-art graphical chip set, you\
    \ were likely to have a VMS workstation on your desk as your primary workstation.\
    \ Today, Alpha workstations are just likely to use Linux or True-64 UNIX as OpenVMS.\
    \ PCs are as likely to run Linux for the operations staff, and today's $30 PCI\
    \ graphics card under Linux or Windows is quite possibly a better display engine\
    \ than three-year-old graphics running in your Alpha workstation. The nice thing\
    \ about X Windows is that you are not tied to your computer engine or tired old\
    \ graphics cards; you can just redirect the graphics to enjoy the application\
    \ with new eyes!\n\nBut let's assume you are lucky enough to have the latest state-of-the-art\
    \ Alpha workstation running VMS on your desk (instead of a GS320 cluster in your\
    \ computer room) and your Linux box's graphical card is aging a little. You can\
    \ simply redirect your Linux application to your new OpenVMS display.\n\nThe procedure\
    \ is exactly like the VMS to Linux redirection except that Linux commands must\
    \ be issued to redirect the output to the VMS workstation, instead of the xhost\
    \ command, OpenVMS uses a Security menu under the session manager.\n\nFirst you\
    \ must authorize VMS to use TCP/IP as a transport for X Windows (inbound to VMS),\
    \ because it's not turned on default.\n\nEither you or your VMS systems manager\
    \ should add this one little command line (see Figure 5-14):\n\n```\nSYS$$MANAGER:DEC$$STARTSERVER.COM\n\
    ```\n\nIf you are uncomfortable changing this file, you can put the logical definition\
    \ line in your SYS$$MANAGER:SYSTARTUP_VMS.COM. I put it in DEC$$STARTSERVER.COM\
    \ because TCP/IP should be turned on (with security) by default!\n\n```\n#define_server_logicals:\
    \ decu*server'p1'*table decdefine_server False\n$sys@manager:decu*logicals **\
    \ **\n# If define default values for symbols which might be set up in\n# private_server_setup.\
    \ (Other defaults are set in DECU*DEVICE.COM).\n# Any of these may be modified\
    \ in DECU*PRIVATE_SERVER_SETUP.\n# decu/Argument_manual_install.tcip 6/01 b -\
    \ For t t.-support\n# tchip=\n# if ftrn \"decu*install.tcip\" then tchip = \"\
    tcip\"\n# decu*server_transports = decu.local.*tcip\"\n# decu*server_correct_log\
    \ = -F - client correct/disconnect log mode\n# decu*server_bug_compatibility =\
    \ -Y - bug compatibility mode\n# decu*server_error_log_to_keep = 2 # of error\
    \ logs files to keep\n# Check for user specified server setup command procedure\n\
    # decu*server_device_setup = =\n$sys@manager:decu*server_device_setup.* = F*EXTRACT(0.2,decu*device)\
    \ + \".co\n# if exists(decu*server_device_setup) .nes.\nthen @decu*server_device_setup\n\
    ```\n\nFigure 5-14 Do not modify this file in any way or you may make windows\
    \ unstartable.\n\nNow let's set security using the VMS session manager on the\
    \ VMS workstation (see Figure 5-15).\n\n![](img/a26aae01e7657faca13785a7eb03624a_68_0.png)\n\
    \nFigure 5-15 Click on the Security and you'll get into the Authorization box.\n\
    \n![](img/a26aae01e7657faca13785a7eb03624a_68_1.png)\n\nFigure 5-16 Click on Add\
    \ and you'll be able to fill in your Linux/Unix information.\n\nFor TCP/IP as\
    \ a transport, always use \"*\" for the user name or it won't (see Figures 5-17\
    \ through 5-19!)\n\n![](img/a26aae01e7657faca13785a7eb03624a_69_0.png)\n\nFigure\
    \ 5-17 You are now ready to telnet to your Linux system and send back X Windows\
    \ applications.\n\n![](img/a26aae01e7657faca13785a7eb03624a_69_1.png)\n\nFigure\
    \ 5-18\n\n![](img/a26aae01e7657faca13785a7eb03624a_69_2.png)\n\n```\nFile Edit\
    \ Commands Print Help\n$ telnet inx.vmsone.com 23\n-TELNET-TRYING, Connecting\
    \ to Session 0 on host inx.vmsone.com. \n-TELNET-ESCAPE: Escape character is '^'\n\
    Red Hat Linux release 7.0 (Guinness)\nKernel 2.4.22 on i386\nlogin: john\npassword:\n\
    Last login: Wed on Jun 20 09:29:04 from vmsone.com\njohn@vmsone.com $ DISPLAY=\
    \ export DISPLAY\n```\n\nFigure 5-19 Congratulations, your VMS display will have\
    \ an X clock on it! You might want to use xterm or xterm (background) or any other\
    \ applications from your Linux box too!\n\nChapter 5 - Windows Applications: X\
    \ Windows Interoperability with VMS and Linux 69\n\nThe arguments about which\
    \ is better and what style of computing should be for rage on discussion groups\
    \ and wherever a few computer people compare notes. One thing is clear: All of\
    \ these styles of computing are here to stay, and interoperability between multiple\
    \ operating systems will be the hallmark of all future workstations and servers.\n\
    \n# Chapter 6 — Using E-mail with OpenVMS and Linux\n\n## Back in the Old Days\n\
    \nWay back in the early 1980s computer users could send e-mail to each other through\
    \ electronic BBSs with ASCII graphics and unencoded binary objects across 1,200-baud\
    \ modems. And (with apologies to SNL's Old Man) we liked it that way—no matter\
    \ painful it was or how long it took, and we were grateful for the technology!\n\
    \nBy the time I finally switched from the ASCII communications I had used in my\
    \ younger days to the e-mail client/server graphics revolution of PCs and workstations,\
    \ I used embedded graphics, attachments, and binary transfer music and video through\
    \ e-mail. I also found (while transferring ASCII e-mail to TK50 tape) that it\
    \ took me 10 years of e-mail correspondence and daily use to have created a scant\
    \ 1MB of data (using English as a communication protocol).\n\nAs I filled and\
    \ filled the two-thirds loaded floppy disk (after changing my mind about the 95MB\
    \ TK50) with 10 years of e-mail history, I received my first real attachment from\
    \ someone on DEC via the new client/server graphics interface to my shiny new\
    \ DEC 320p laptop computer.\n\nI marveled that the 12 PowerPoint slides that had\
    \ attached to the message (the text of which was written in MS Word) were 1.5MB\
    \ of data—they wouldn’t even fit on the $10 1.44MB floppy disk I had just filled\
    \ with the last ten years of history.\n\nHow had I managed without the ability\
    \ to send graphics to everyone I knew? How much more space was needed in the brave\
    \ new world? The horizons seemed endless too, but I knew I was glad that my company\
    \ was bringing something called StorageWorks in the near future.\n"
