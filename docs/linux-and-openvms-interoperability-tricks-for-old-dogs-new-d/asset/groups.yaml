    ## 今日的网络标准


    今天（在网络协议战争爆发 10 多年后），TCP/IP 协议已经非常健壮，并被商业 IT 团体和个人所充分理解。现在行业正在向 IPv6 演进（目前 IPv4
    已用于更多的实现）。该协议正在扩展和改进，以在路由和安全应用中加入更多功能——这一切都是通过基于标准的网络协议实现的。


    OpenVMS 和 Linux 的联网（任何两台或更多台计算机器）必须基于相同的标准。如今首选的网络标准是 TCP/IP 软件协议和以太网硬件协议。在过去的几年里，跨终端线、视频以及直接同步和异步连接（如
    RS-232 线缆）的交换也曾非常重要；对旧类型连接的需求正在减少，但尚未完全过时。今天的工作站继续使用拨号连接模型，通过点对点协议对 TCP/IP 进行封装以便在两台计算机之间进行传输。随着越来越多的工作站和服务器连接到
    DSL 或电缆模式、路由器甚至防火墙，以太网网络（甚至是无线以太网网络）已成为可能的互联方式。


    请注意，所有 IEEE 802.X 标准均指向 OSI 模型中的底部两层（所有硬件）（[http://standards.ieee.org/](）（见表 3-1）。


    ## 表 3-1：带有 TCP/IP 位置的标准 OSI 模型


    | OSI 网络模型 | TCP/IP Internet 模型 | IEEE 标准 | |

    |---|---|---|

    | 第 7 层—应用层 | Netscape、Xterm、电子邮件阅读器、基于 FTP 的工具以及其他用于显示数据的应用程序 | | |

    | 第 6 层—表示层 | Telnet、FTP、SMTP、其他 TCP/IP 协议 | | |

    | 第 5 层—会话层 | Telnet、FTP、SMTP、其他 TCP/IP 协议 | | |

    | 第 4 层—传输层 | 传输控制协议 (TCP)、用户数据报协议 (UDP) | | |

    | 第 3 层—网络层 | IP Internet 协议 | | |


