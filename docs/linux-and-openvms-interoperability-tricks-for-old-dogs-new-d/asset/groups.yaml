    OpenVMS and Linux TCP/IP applications work together because both applications
    adhere to industry-standard definitions for their functions. It might be a little
    too easy to say that it works! Most of the time it''s exactly what it does work!
    FTP works to copy files on both systems and will determine if you are sending
    a binary file (compiled, zipped, or object file) or a text file and will transfer/
    copy file correctly between machines. The same is true for X Windows, e-mail clients,
    Finger, Telnet and all the other standard TCP/IP applications.


    # URL Tricks and More


    TCP/IP tools are built in part of the Linux and OpenVMS operating system. You
    can copy files, send e-mail, and much more. Interprocess communications make the
    client/ server resolution possible, and the World Wide Web and IP ports keep applications
    working while new applications can be tested and run on the same server before
    moving a new application into production.


    The future of all of this is, of course, new, and we should see more applications
    with enhancements and continuing increases in encryption and the use of encryption
    tools.


    One more TCP/IP trick before we move on to security in the next chapter: A good
    friend of mine, Steve Smiley from the DFWLUG in Dallas, showed me this little
    trick and did an article for the DFWLUG Quadroads newsletter based on this conversion.'
  - '[PAGE 28]


    If you do an "NSLOOKUP" from a Linux or OpenVMS system and plug in a valid DNS
    name, you get an address such as 209.39.152.33. If you convert the TCP/IPs octets
    to their binary representations (with the help of a scientific calculator), you
    get


    ```

    209 = 110100201

    39 = 00100111

    ```


    Be sure to add the padded 0s in front for an 8-byte / character binary!


    ```

    152 = 10011000

    33 = 00100001

    ```


    Add the binary (base 2) strings together


    ```

    209.39.152.133 = 11010001001111100110000100001 (base2)

    = 3509032993 (base10)

    ```


    From Netscape Internet Explorer or your favorite Web browser, try these numbers:


    ```

    http://3509032993

    http://1094769874

    ```


    Which is easier to remember a 10 digit number or a URL name on the Web? You do
    the math.'
