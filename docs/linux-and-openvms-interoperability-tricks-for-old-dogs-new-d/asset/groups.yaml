    ## 网络管理员重要性


    始终记住，网络管理员是你网络中最好的朋友，他们可以为你提供 TCP/IP 地址、线缆以及以太网卡和软件！网络管理员知道路由器在哪里，以及应该获取哪些数字***(域名)
