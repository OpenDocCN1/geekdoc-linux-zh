    # 前言


    在过去的二十五年里，HP OpenVM™ 作为一种经久证明的企业级操作系统，一直支持着客户在可靠性、可用性、可扩展性和安全性方面最严苛的关键业务需求。


    在过去的五年里，Linux 和开源运动已经从技术边缘的小型系统操作系统，转变为企业计算领域的强有力竞争者。


    这两种操作系统都与 UNIX 和 Windows 服务器器有许多共同之处。OpenVMS 是一个通用型操作系统，拥有许多标准接口和 API。Linux 是一个可定制的操作系统，与
    UNIX 共享其 API。这两个操作系统通用的 API 让 OpenVMS 和 Linux 能够轻松地互操作。


    在同一个企业环境中运行 OpenVMS 和 Linux，可以让你能够结合 Linux 的低单机成本结构、及其海量的开源软件库，以及 OpenVMS 经证明的高可用性、安全性、可扩展性以及卓越的健壮性。


    我发现这本书是一份实用的、手手操作的手手册，它解释了 OpenVMS 系统管理员如何将他们的系统与 Linux 集成，让两个平台协作工作并扩展计算环境的处理能力。John
    清晰地描述了这两种操作系统的功能和优势，以便你可以评估哪一个对于任何特定任务都是。你在这里看到的提示、技巧和技术将帮助你创建一个异构的 OpenVMS 和
    Linux 计算环境，以满足你现在和未来的需求。


    Martin R. Fink

    副总裁兼首席技术官

    惠普 (Hewlett-Packard)


    # 序言


    这本书始于多年前，当时 Linux 仅仅是 Torvald 先生的一个梦想。它的萌芽源于《DECWindows Cookbook》、DFWCU Longwords
    Newsletter 的文章，以及在数百场 DECUS 会上分享的提示和技术，这些会议多年来以某种方式将 Open-VMS 和 Unix 系统连接在一起。


    从所有这些想法，加上 Linux 和 OpenVMS 在数据中心使用次数的增加而带来的演进，我觉得有必要更好地理解 Linux 和 OpenVMS 能够共同做的事情。我也觉得，如果我需要理解这种互操作性，许多其他人可能也需要同样的理解。今天，使用开源程序的
    Linux 和 OpenVMS 在许多应用程序和接口上具有相同的视觉效果和感受。尽管视觉效果和感受相似，但不同操作系统（OS）之间的配置、安装和脚本是存在差异。


    本书识别了互操作领域，更重要的是为这些领域提供了一个分步实施的流程。产品、配置、脚本都在书中，其目标只有一个：就是让 Linux 和 OpenVMS 之间发生某些事情。无论你是
    VMS 管理员还是 Linux 管理员，这本书都允许你开启 Linux 和 OpenVMS 之间的互操作性。


    我还可以补充一点，你将学习使用本地编辑器，这些在书中并未被涵盖。学习终端或命令行界面（CLI）编辑器，例如 Linux 的“vi”和 VMS 的“edit”；它们对于任何系统管理员的工具箱都是至关重要的。也有基于
    X Windows 的编辑器，但如果你学习了 CLI 编辑器，你将能够在没有窗口系统（或启动程序）的情况下在这些系统上工作。在你学会了 Linux 和 OpenVMS
    的编辑器后，书中的其余步骤应该很容易完成。


    你可能想在尝试配置书中的工具之前，先加载每个操作系统的干净版本。我在书中描述的所有过程中都使用了 OpenVMS 7.3-1 版本和 RedHat 7.3
    版本。如果你是继承了现有的系统，并且需要重用现有的安装，你可能想先访问第 2 章，学习如何进入 Linux 和 OpenVMS！


    本书是一场关于开源、TCP/IP、X Windows、安全等领域的冒险。我希望它能拓宽你对 OpenVMS 和 Linux 的理解，并帮助你理解这两个伟大的开源软件（OSS）可以共同做什么。


    最好的祝愿，

    John Robert Wisniewski

    2003年3月


    出版者注：“Open Source（开源）”一词的使用存在很大差异；大多数观点似乎是这两个单词都要大写。然而，另一些人始终使用小写。我们选择遵循最常用的用法，在书正文中对这两个单词均大写。


    ## 第 1 章 — 评估 OpenVMS 和 Linux：工欲善其器


    **好、优、卓越**


    欢迎阅读这本书，它解答了：为什么是 OpenVMS？为什么是 Linux？以及你如何让这两个计算机操作系统（OS）协同工作？


    在这个世界上，你为什么想让它们协同工作呢？让我尝试简短地回答：有些客户非常迷 OpenVMS——它的集群技术和全方位支持。而 Linux 则热衷开源，有成千上万的编码者在精进此项技能。多么疯狂的合奏！但尽管如此，它们仍然是亲戚——开源系统的亲戚。


    现在，在不继续唱剩下的 Patty Duke 主题曲之前；这些操作系统有许多共同点：开放系统的亲戚；行业标准；X Windows；以及用于加密通信的安全性工具。既然
    Linux 和 OpenVMS 已经可以协同工作，你为什么还要继续使用不同的操作系统呢？仅仅因为 OpenVMS 拥有其他操作系统都难以实现的特性。


    OpenVMS 提供了某些功能，由于它在 25 年中经过了测试。Linux 为这个领域带来了什么？今天，Linux 是开源的，有成千上万的程序员在其中工作，并带来全球范围内的解决方案。与此同时，OpenVMS
    和 Linux 提供了许多应用程序的商业工具，以及实际的部署选择：客户端/服务器、多路数据库。


    在计算的高端和低端之间，各种部署策略在现在是需要的，未来也是需要的。OpenVMS 和 Linux 之间的界限在需要的地方划定。系统架构师和系统分析师需要理解
    OpenVMS 和 Linux 的所有特性，包括实际工作站的部署。你可以描述这两种操作系统的特性，以便你可以评估哪一个对于任何特定任务都是最好的。


    无论你是 VMS 管理员还是 Linux 管理员，这本书都允许你开启 Linux 和 OpenVMS 之间的互操作性。


    我还可以补充一点，你将学习使用本地编辑器，这些在书中并未被涵盖。学习终端或命令行界面（CLI）编辑器，例如 Linux 的“vi”和 VMS 的“edit”；它们对于任何系统管理员的工具箱都是至关重要的。也有基于
    X Windows 的编辑器，但如果你学习了 CLI 编辑器，你将能够在没有窗口系统（或启动程序）的情况下在这些系统上工作。在你学会了 Linux 和 OpenVMS
    的编辑器后，书中的其余步骤应该很容易完成。


    你可能想在尝试配置书中的工具之前，先加载每个操作系统的干净版本。我在书中描述的所有过程中都使用了 OpenVMS 7.3-1 版本和 RedHat 7.3
    版本。如果你是继承了现有的系统，并且需要重用现有的安装，你可能想先访问第 2 章，学习如何进入 Linux 和 OpenVMS！


    本书是一场关于开源、TCP/IP、X Windows、安全等领域的冒险。我希望它能拓宽你对 OpenVMS 和 Linux 的理解，并帮助你理解这两个伟大的开源软件（OSS）可以共同做什么。


    最好的祝愿，

    John Robert Wisniewski

    2003年3月


