    # Encryption—Not Just for Breakfast Anyone


    You need to use encryption of the tools/commands when communicating sensitive

    (or not so sensitive) information, or you put yourself at risk of having your
    passwords,

    files, and anything that moves across the network, copied, and redistributed.

    Let''s talk about the application encryption protocols that are generally available
    on

    OpenVMS and Linux systems.


    # SSH (V1 and V2)


    SSH, or secure shell, features are well known and have been available for many
    years

    between many different hosts in the TCP/IP world. SSH has the ability to create
    an

    enrypted session between two hosts. You can open an encrypted SSH client terminal

    connection to an SSH server. All the terminal communications are encrypted

    between the client and server. Both Linux and OpenVMS can be clients and servers
    in

    this arrangement, allowing secure terminal sessions to and from both systems.

    MultiNet uses this protocol and a file transfer application, SCP, for OpenVMS

    using this protocol. (VMS TCP/IP engineering has been requested for SSH for

    some time, but they have their attention distracted by other TCP/IP directions).


    In the rest of the Open Source and Linux world, SSH is usually a terminal or shell

    command tool that comes with the operating system, but does not do file transfer

    (FTP) by itself. Additional applications have been written to use the SSH protocol
    for

    file transfer, such as MultiNet''s SCP product for OpenVMS and SFTP (Secure FTP)
    for

    Linux and UNIX users.


    HP''s TCP/IP services for OpenVMS does not have SSH capabilities, but with the

    addition of the MultiNet SSH layered product, SSH protocols work with TCP/IP

    services (5.3 TCP/IP EAK from HP), making SSH work between Linux and

    OpenVM. You would use SSH if you needed secure terminal access between Linux or

    OpenVM systems in a public or private network that had to support interactive

    terminal or shell command logins and not be view password exchange and data

    exchange in plain text.


    Software for this type of encryption application can be found at the following


    +   • For Linux: OpenSource available in the Linux standard distributions or at

    http://www.openssh.org/'
  - '[PAGE 36]


    +   - For OpenVMS: Process software (MultiNet) at http://www.process.com/


    +   - For HP: TCP/IP services for OpenVMS V5.3 at http://www.openvms.compaq.com/


    # SSL


    SSL, or secure sockets layer, has been around since before 1996, and it all still
    isn''t at Version 1.0. That''s not to say that it''s not functional—just that''s
    taking its time becoming a V1.0 release. If you ever doubt SSL''s functionality,
    just check your Web browser''s lock icon on the bottom of your favorite browser
    when you connect to your bank account or try to buy something on the Web. SSL
    is invoked anytime your lock is closed!


    SSL''s roll as an encryption protocol is expanding, with new and more sophisticated
    tools and applications tied to its authentication mechanism and communications
    style. Today, SSL can be used for Web, terminal sessions, file transfer, POP and
    IMAP, and virtually any TCP/IP application that uses a known port of host addressing
    also needs encryption for its communications. Course, SSL needs a little help
    to do some of these tasks and is now available for OpenVMS and Linux!


    OpenSSL consists only of a toolkit with programs and programming interfaces. Either
    you have to modify programs to use SSL (as your favorite Web browser) or you need
    to have another tool that goes between standard TCP/IP application programs and
    SSL programming interfaces. That tool, for Linux and OpenVMS, is called a "Stunnel,"
    or secure tunnel.


    Before we use the Stunnel to encrypt port-to-port communications, we must have
    SSL libraries installed on both systems to do encryption and authentication between
    systems.


    # SSL Distributions


    OpenSSL for Linux is Open Source and usually comes with a standard Linux distribution
    or from http://www.opensslorg/


    OpenSSL for OpenVMS is available from HP and is included in the standard OpenVMS
    distribution, or it can be pulled from the Web at http:// www.openvms.compaq.com/


    Note that OpenSSL for OpenVMS will work on OpenVMS versions V7.2-2 through 7.3-1
    as of this writing.'
  - '[PAGE 37]


    # Stunnel


    SSL requires an application to map and remap local host ports, and that remapping
    tool is called Stunnel.


    Stunnel is an application that allows you to encrypt TCP connections within SSL.
    This is a very new and useful approach to encryption applications, because instead
    of reprogramming nonencrypted application protocols (such as Telnet, POP, IMAP,
    LDAP), you can just use Stunnel to provide the encryption.


    Just how useful is Stunnel? With the introduction of OpenSSL and Stunnel on OpenVMS,
    a system administrator has another tool that can now securely manage the OpenVMS
    systems from a Linux workstation or even a Windows workstation! And, of course,
    it works for the OpenVMS system administrator who wants to securely manage or
    her Stunnel tools!


    Stunnel distributions include the following:


    +   - Open Source Stunnel sources for Linux and Windows may be found at http://www.stunnel.org
    /


    +   - OpenVMS Stunnel kits are available with the OpenVMS 7.3-1 distribution from
    HP and should be on the Web at http://www.openvms.compaq.com


    # Stunnel Server Installation on OpenVMS


    I had just built my first OpenVMS 7.3-1 system in my garage and looked at all
    the new Open Source tools that were beginning to be integrated into OpenVMS. Wanting
    to install Stunnel between a Linux system and an OpenVMS system, I called on another
    OpenVMS expert, Steve Smiley. Now Steve has been a strong advocate for SSH for
    years and continually asked for SSH on OpenVMS. Asking him for some doing Stunnel
    was more than an acid test for encrypted Telnet and how it was going to work across
    the Stunnel. Figures 4-1 through 4.26 illustrate a Stunnel server installation
    on OpenVMS.'
