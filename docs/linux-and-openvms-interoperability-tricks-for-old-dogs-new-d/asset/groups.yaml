    ## Encryption—Not Just for Breakfast Anyone


    You need to use encryption of the tools/commands when communicating sensitive
    (or not so sensitive) information, or you put yourself at risk of having your
    passwords, files, and anything that moves across the network, copied, and redistributed.
    Let''s talk about the application encryption protocols that are generally available
    on OpenVMS and Linux systems.


    ## SSH (V1 and V2)


    SSH, or secure shell, features are well known and have been available for many
    years between many different hosts in the TCP/IP world. SSH has the ability to
    create an encrypted session between two hosts. You can open an encrypted SSH client
    terminal connection to an SSH server. All the terminal communications are encrypted
    between the client and server. Both Linux and OpenVMS can be clients and servers
    in this arrangement, allowing secure terminal sessions to and from both systems.
    MultiNet uses this protocol and a file transfer application, SCP, for OpenVMS
    using this protocol. (VMS TCP/IP engineering has been requested for SSH for some
    time, but they have their attention distracted by other TCP/IP directions).


    In the rest of the Open Source and Linux world, SSH is usually a terminal or shell
    command tool that comes with the operating system, but does not do file transfer
    (FTP) by itself. Additional applications have been written to use the SSH protocol
    for file transfer, such as MultiNet''s SCP product for OpenVMS and SFTP (Secure
    FTP) for Linux and UNIX users.


    HP''s TCP/IP services for OpenVMS does not have SSH capabilities, but with the
    addition of the MultiNet SSH layered product, SSH protocols work with TCP/IP services
    (5.3 TCP/IP EAK from HP), making SSH work between Linux and OpenVMS. You would
    use SSH if you needed secure terminal access between Linux or OpenVMS systems
    in a public or private network that had to support interactive terminal or shell
    command logins and not be view password exchange and data exchange in plain text.


    Software for this type of encryption application can be found at the following:


    - For Linux: OpenSource available in the Linux standard distributions or at http://www.openssh.org/

    - For OpenVMS: Process software (MultiNet) at http://www.process.com/

    - For HP: TCP/IP services for OpenVMS V5.3 at http://www.openvms.compaq.com/


    ## SSL


    SSL, or secure sockets layer, has been around since before 1996, and it all still
    isn''t at Version 1.0. That''s not to say that it''s not functional—just that''s
    taking its time becoming a V1.0 release. If you ever doubt SSL''s functionality,
    just check your Web browser''s lock icon on the bottom of your favorite browser
    when you connect to your bank account or try to buy something on the Web. SSL
    is invoked anytime your lock is closed!


    SSL''s roll as an encryption protocol is expanding, with new and more sophisticated
    tools and applications tied to its authentication mechanism and communications
    style. Today, SSL can be used for Web, terminal sessions, file transfer, POP and
    IMAP, and virtually any TCP/IP application that uses a known port of host addressing
    also needs encryption for its communications. Course, SSL needs a little help
    to do some of these tasks and is now available for OpenVMS and Linux!


    OpenSSL consists only of a toolkit with programs and programming interfaces. Either
    you have to modify programs to use SSL (as your favorite Web browser) or you need
    to have another tool that goes between standard TCP/IP application programs and
    SSL.


