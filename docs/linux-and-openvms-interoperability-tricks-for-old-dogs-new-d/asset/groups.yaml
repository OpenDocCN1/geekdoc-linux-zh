    refrigerators, and cars'' hubcaps needing an IP address, IP addresses have become
    a scarce commodity.


    To alleviate the scarcity of routable IP addresses (routable means able to traverse
    the Internet), network administrators are using a technology called NAT.


    So, most likely, you will be assigned a nonroutable IP address if you are at work
    or setting up a private local area network at home behind a cable/DSL connection.
    The nonroutable (private) IP addresses are 10.0.0.0, 172.168.0.0, and 192.168.0.0,
    depending on how many hosts are on the network.


    NAT technology allows you to have many nonroutable IP addresses behind a single
    routable address, which connects all the nonroutable addresses to the entire Internet.


    # Q2: What is my subnet mask for the network I''m currently on?


    Sub masks divide TCP/IP class addresses into multiple networks. This allows networks
    to use more addresses and limits the number of TCP/IP nodes on these subnets.


    Usually your network administrator will provide you with a subnet mask, and there
    are exact calculations for dividing different TCP/IP classes into subnets.


    # Q3: What are my host and domain names?


    Remember in Q1, where I asked which was easier to remember, the base 10 or the
    base 2 IP address? Well, it''s even easier for you to remember names.


    VMSONE is easier to remember than 65.65.113.10. Domain names are used to group
    hosts on specific subnets of an IP address. It''s much easy to identify a group
    of hosts that are related if they all have the same Internet domain.


    Host names have to be unique within their domain. Domain and host names with their
    corresponding IP addresses are recorded in domain name service (DNS/BIND) servers
    on your network. OpenVMS and Linux can be DNS servers, but if you are connecting
    to a TCP/IP network, DNS setup and service are best left to your network administrator
    or ISP. DNS servers are not for the novice network hack and require the cooperation
    of other DNS servers in a network to work properly.


    # Q4: What is my DNS server address?


    The network administrator or ISP should provide the TCP/IP addresses of a primary
    DNS server and its backup (known as secondary). As mentioned previously, host
    and domain names are stored in a DNS server. A phone book and a DNS server are
    used in a similar manner.'
