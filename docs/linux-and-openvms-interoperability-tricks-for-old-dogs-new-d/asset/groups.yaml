    如今，随着免费电子邮件账户的普及，以及对于拥有电脑的人来说，拨号上网的每月费用低于 10 美元，大多数人认为这种类型的电子邮件已经古老且过时了。UUCP 邮件的实用性已经减退；有趣的是，该协议在业余无线电（数据包）/系统间邮件，以及世界上其他由于互联网拨号接入（POTS——普通电话服务）仍难以获取的地方仍在使用。


    # 从网络时代的黎明到今天


    在《维多利亚时代的互联网》（*The Victorian Internet*）中，汤姆·阶段（Tom Stage）描述了19世纪的世界是如何通过技术通信奇迹——电报来缩小并交付的。汤姆在书中引用了塞缪尔·莫尔斯（Samuel
    Morse）1872年的诗作《胜利》：


    “科学已从这一岸，向另一岸宣告，

    时间与空间不再受其支配。”


    如果在过去的 150 年里，电报、电话和卫星缩短了人们交流的距离，那么在过去的 15 年里，互联网和电子邮件通过压缩技术和近乎普及的访问，将这些工具再次缩小了
    10 倍。既然两行的邮件就能解释需要做什么，为什么还要打电话呢？既然一张图片就能解决问题，为什么还要对话呢？为什么要发送带有指向 URL 的图片来参考网络的共同现实呢？现在还有人会通过传真给任何人发送多份论文吗？


    这对生产力非常有好处，但人与人之间的接触是如何通过导师和学徒制让我们不断学习并加深理解的？关于电子通信如何影响我们的学习方式和实职培训（OJT），目前尚无定论。我们这一代拥有家庭办公室、数字手机、远程办公、万维网和电缆，因此我们要么成为与同类最亲密、连接最紧密的一代，要么就有足够的冒险精神去支付电力、蛋白饮料和维生素费用以维持运转的一代。


    简练、简洁、高效，无论好坏，这些都是电子邮件作为业务工具带给我们的品质。


    当然，如果你仍然想在网上聊天，你现在可以使用各种即时通讯程序消磨时间，就像发现 19 世纪的电报员将空闲时间的 50% 用于跨越 19 世纪的以太与其他电报员说话、聊天和八卦一样（但对于今天生活在线的人来说，50%
    听起来是一个很低的百分比）。尽管技术发生了巨大的变化，但人类在过去的 150 年里并没有多少。许多人仍然有着非常人性的欲望，只想放下工作，靠在后院围栏上或聚集在办公室的茶水旁，和其他人聊聊当天发生的事情。


    # 电子邮件程序的兴起与衰落


    1987 年，当我加入 Digital 公司时，它的邮件系统 ALL-IN-1 全球有 800 万用户。ALL-IN-1 具有全文本文字处理和共享日历（用于会议室、演示室等资源），这让人们的时间更容易安排和跟踪。它还包含了那个时代所有文字处理文档的文件交换、附件、邮件列表以及指向各种其他邮件系统（IBM
    和当时的标准）的网关。


    此外，ALL-IN-1 运行在 OpenVMS 集群上（谁会想要冗余系统呢），它的客户端/服务器前端链接仍然存在。然而，尽管拥有卓越的技术实力和 PC 集成，Digital
    公司在 1996 年选择了一个新系统。DEC 放弃了 ALL-IN-1 的根源，选择了一个强有力的邮件系统——一个可以在邮件中发送文字处理文档、图片、视频和二进制文件的邮件系统，就像其他其他有
    20 年历史的邮件系统一样。


    新的电子邮件系统额外优势是可以在 Windows NT 操作系统上运行，在 1996 年，大家都知道这是在千年虫（Y2K）之后唯一能生存的系统平台。


    Microsoft Exchange 比开源、基于标准的电子邮件贵得多，但话又回来，微软的营销做得好得多。剩下的就是历史了，直到人们意识到 Exchange
    的安装和维护耗费大量资金——而开源产品是免费的！


    # 开源开放标准的互联网邮件


    开放标准完全围绕着 TCP/IP 标准和控制它们的 RFC（意见请求）过程展开。需要注意的是，当前的电子邮件协议正在演进，并随着它们的改进不断添加新功能。终端用户不会担心这些标准，但为
    VMS 或 Linux 等操作系统进行实现工作的人会担心。用户需要知道的是，他们可以从各种客户端平台使用哪些基于标准的电子邮件客户端，以及可以设置哪些邮件服务器来从网络上的
    OpenVMS 和 Linux 服务器检索他们的邮件。


    互联网电子邮件应用程序基本上都在做相同的事情，但某些程序具有比其他程序更多的功能。在电子邮件系统中，你应该在客户端中寻找哪些功能？字符单元或图形电子邮件应用程序应该是首要考虑。像
    PINE 这样的程序是基于字符单元的，但可以发送附件并在 OpenVMS 和 Linux 上作为客户端运行。其他程序，如 Mozilla（现在源自 Netscape
    的开源项目），也运行在 OpenVMS 和 Linux 上，但需要 Windows 图形显示才能显示。图形显示为你提供了一个“所见即所得”（WYSIWYG）的邮件窗口，而字符客户端允许你从网络任何地方通过
    telnet 读取你的邮件——至少是邮件的内容部分！


    今天在配置电子邮件服务器时，需要检查的重要标准包括：


    - POP3–邮局局协议：如果你的服务器支持此项，你的客户端就可以从服务器下载消息。

    - IMAP–互联网消息访问协议：如果你的服务器支持此项，你的客户端可以访问消息并决定是否删除。


    好消息是，OpenVMS 和 Linux 都能让电子邮件客户端使用 POP3 或 IMAP 访问邮件。你只需要在系统上启用电子邮件，账户就会集成到邮件中。远程电子邮件客户端就可以从不同位置通过
    POP3 或 IMAP 访问这些标准账户。


