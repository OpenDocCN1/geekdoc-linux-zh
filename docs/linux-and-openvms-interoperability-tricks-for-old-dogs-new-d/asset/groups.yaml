    ## Today’s Networking Standards


    Today (10 plus years after the network protocol wars) TCP/IP is robust and well
    understood by commercial IT groups and individuals. Now the industry is evolving
    into IPv6 (currently IPv4 is used for more implementations). The protocol is expanding
    and improving to incorporate even more features in routing and secure applications—all
    with a standards-based networking protocol.


    Networking for OpenVMS and Linux (any two or more computing machines) has to be
    based on the same standards. Today’s networking standards of choice are TCP/IP
    software protocols and Ethernet hardware protocols. In previous years it was also
    important to be able to exchange across terminal lines, video, and direct synchronous
    and asynchronous connections (such as RS-232 cables); the need for the older types
    of connections is waning but not quite obsolete. Today’s workstations continue
    to use models for dial-up with point-to-point protocols that encapsulate TCP/IP
    for transmission between two computers. With more and more workstations and servers
    tied to DSL, or cable modes, routers, and even firewalls, Ethernet networks (even
    Ethernet wireless networks) are the kind of interconnection possible.


    Notice that all the IEEE 802.X standards refer to the bottom two layers (all hardware)
    of the OSI model (http://standards.ieee.org/) (See Table 3-1).


    ## Table 3-1: Standard OSI Model with TCP/IP Positions


    | OSI Network Model | TCP/IP Internet Model | IEEE Standards |

    |---|---|---|

    | Layer 7—Application | Netscape, Xterm, E-mail Readers, FTP-based tools, and
    other application programs for displaying data | | |

    | Layer 6—Presentation | Telnet, FTP, SMTP, other TCP/IP protocols | | |

    | Layer 5—Session | Telnet, FTP, SMTP, other TCP/IP protocols | | |

    | Layer 4—Transport | Transmission Control Protocol (TCP) Unacknowledged Datagram
    Protocol (UDP) | | |

    | Layer 3—Network | IP Internet protocol | | |


    ## Table 3-1: Standard OSI Model with TCP/IP Positions (continued)


    | OSI Network Model | TCP/IP Internet Model | IEEE Standards |

    |---|---|---|

    | Layer 2—Data Link | Network interface cards: Ethernet twisted pair, coax, Big
    Orange Cable (AUI), Token Ring, FDDI, ATM, ODI (Open Datalink Interface), NDIS
    (Network Independent Specification) | 802.1<br>802.2<br>802.3<br>802.4<br>802.5<br>802.6
    | Interworking LLC Log C Ethernet CSMA/CD Token Ring Metropolitan Networks | |
    |

    | Layer 1—Physical | Network transmission media: twisted pair, coax, fiber, wireless
    | 802.7<br>802.8<br>802.9<br>802.10<br>802.11<br>802.12 | Broadband Advisory Fiber
    Tech Advisory Integrated Voice /Data Network Security Wireless Networks Priority
    |


    Hardware and software standards make computer communications possible, and while
    looking at another OSI chart (Happy Mnemonic: All People See to Need Data Processing!)
    may not seem useful, you will need to know where TCP/IP applications and protocols
    operate when you are troubleshooting network applications! If you can''t tell
    the network manager why the problem is in Layer 3 or below, he will always blame
    it on your book or application—so you better get used to it.


    ## The Importance of a Network Manager


    Always remember that the network manager is your best friend in the network and
    can get you TCP/IP addresses, cables, and Ethernet cards and software! The network
    manager knows where the routers are and which numbers to get ***(domain) Digital
    Name Service (DNS), as well as the gateway numbers to other networks. You should
    remember and mark well that your new best friend will be a snarling beast, who''ll
    insult your lineage, choice of OS, or computer knowledge, if you ever occasion
    to question the network''s current status or ask why your system can''t communicate
    with the other network.


    So let''s get over some questions that you or your network manager will need to
    answer for both machines before you can even start to connect a VMS and a Linux
    system to a TCP/IP network.


    ## Questions for Network Setup

    (Questions You Must Ask to Set up a TCP/IP Network)


