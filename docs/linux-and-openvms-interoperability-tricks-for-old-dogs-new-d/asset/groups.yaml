    # # Chapter 1 — Assessing OpenVMS and Linux: The Right Tool for the Right Job


    **Good, Better, Best**


    Welcome to the book that answers the questions why OpenVMS? Linux? and just how
    you get these two computer operating systems (OSs) to work together?


    Why in the world would you want to have them work together? Let me try to answer
    by briefly saying that there are customers who adore OpenVMS—its cluster technology
    and full-service support. Linux is into Open Source, with tens of thousands of
    coders in their craft. What a wild duet! But still, they’re cousins—open systems
    cousins.


    Now, without singing the rest of the Patty Duke theme music; the operating systems
    have much in common: their network interface protocols; Open Source tools; industry
    standards; commercial databases; X Windows; and industry-standard security tools
    for encryption, tunneling, and secure communications. If general tools are on
    both Linux and OpenVMS, why continue to use two different OSs? Simply because
    OpenVMS has features and abilities that Linux or any other OS would be hard to
    deliver.


    What does OpenVMS have? OpenVMS provides something that you only get with 25 years
    of testing and use—enterprise-class stability and reliability in almost every
    configuration it''s used in.


    What does Linux bring to the table? Today Linux is Open Source, with thousands
    of programmers working on new and exciting applications worldwide, sharing base
    source codes, and delivering low-cost tools and software that improve the entire
    software industry.


    Together, OpenVMS and Linux provide the best of Open Source and the best of commercial
    applications, giving users a choice about how to deploy various computing styles:
    client/server, multitied database servers, or large transaction processing environments.


    Between the high end and the low end of computing, various deployment strategies
    are needed today and will be needed in the future. The line between OpenVMS and
    Linux deployment decisions should be drawn wherever it needs to be.


    Solution architects and system analysts need to understand the best features of
    both operating systems, as well as their realistic limits, and measure the actual
    cost of deployment of Linux and OpenVMS systems, utilizing the best tools for
    the system or'
  - '[PAGE 3]


    work at hand. OpenVMS can run on workstations to mainframes. Linux runs on mainframes
    to workstations, drawing a hard line in the sand that limits what will be deployed
    and limits the types of deployment an organization can decide. Why not use the
    best of both worlds to solving problems? I know do!


    # # OpenVMS?


    After 25 years in a constantly changing computer industry—spanning the PC revolution,
    DEC buying Digital, VMS becoming OpenVMS, Compaq buying out Digital, HP buying
    out Compaq, and OpenVMS migrating from VAX 32-bit CPUs to Alpha 64-bit CPUs, as
    well as HP migrating from OpenVMS to IA64 Intel''s 64-bit CPU, and the advent
    of Microsoft products, Open Source and Linux products, the IBM pantheon of operating
    systems, and fault-tolerant products such as NSK—an industry watcher and career
    participant to ask the following question: Why should companies use OpenVMS over
    the next 5 to 10 years? Considering that OpenVMS has the lowest cost of deployment
    and maintenance in the industry today, you might ask, why wouldn''t you use OpenVMS?
    Lowest cost is one factor, but technology decisions seem to drive many decisions.
    Let''s review OpenVMS''s current abilities.


    +   - Clustering: OpenVMS has acknowledged the clusters and scaling in the industry
    since 1993. Its features include single system disk, unified file system view
    across all cluster members (even with multiple file systems), shared tapes, shared
    disks, and up to 96 clustered member systems of desktop to mainframe-size systems,
    with as many as 32 SMP CPUs each and as much as 10 Tbytes of main memory (RAM)
    in the entire cluster. All systems are managed as a single system and a single
    work domain. OpenVMS clusters work out of the box across Ethernet, SANs, and high-speed
    memory channel connections, with minimal configuration and setup. You can literally
    add a new member system to an OpenVMS cluster in as little as five minutes (the
    hardware has been plugged in).


    +   - Disaster-Tolerant Clusters: Data centers can be completely duplicated (all
    disks, all resources, all transactions) in an active-active cluster at distances
    up to 540 miles apart. (Note: Everyone else just asks for hot/warm or hot/cold
    site technology; OpenVMS uses both sites in an active-active configuration, which
    uses much less hardware than other active-passive cluster configurations—up to
    50 percent!)


    +   - Oracle 8: This deploys larger, runs better, and runs faster on OpenVMS clusters.
    Oracle Rdb continues to be one of the fastest databases in the world, fully'
- md: '

    integrated into OpenVMS and OpenVMS clusters, with new customers every year.


    - Timeshare: As the Internet continues to grow and server consolidation continues,
    systems will be measured by their ability to handle many, many small jobs in a
    predictable time slot while sharing resources evenly. OpenVMS and its scheduler
    have been providing and polishing predictable, even real-time, performance since
    the 1970s. With today’s web server, transaction-servers, and application-server
    requirements, capacity planning and predictable response for every job is already
    becoming a prerequisite for deploying a prototype application.


    - Security: OpenVMS/VMS has less than 45 CERT security advisories in the last
    13 years. (Windows 2000, 484; Linux, 546; Solaris, 490; AIX, 377 as of June 2002:
    http://www.cert.org/).


    Deploying other servers in your production environment, you will spend considerably
    more system-management dollars securing your servers and making sure all the CERT
    advisories are plugged in than you would if you just deployed OpenVMS out of the
    box! If you checked all the CERT advisories, it could take hundreds of hours to
    review various security holes in other operating systems.


    Out-of-the-box OpenVMS is virtually unhackable (or so say the gods/judges from
    the DEFCON 9 Hacker Convention, July 2001 http://www.dfwcug.org/dfwcug_newsletters/201007.PDF).


    Kevin Mitnick, celebrity hacker, just testified before Congress that he was defeated
    the first time in life when he recently tried to break into an OpenVMS system
    in England (http://www.zdnet.com/zdnn/stories/news/0,4586,2454737,00.html).


    - Diico: Defense Information Infrastructure Common Operating Environment certification
    means that Compaq/HP has signed (in 2001) an agreement with the U.S. government
    to support OpenVMS for the next 20 years. This allows HP to continue selling OpenVMS
    to the U.S. government (one of OpenVMS’s largest user bases), and it must maintain
    support for the next 20 years on products to the U.S. government.


    - Shared File Systems: OpenVMS offers integration with Windows 2000 and NT 4.0
    SMB file systems via Advanced Server (code from Microsoft). From the Open Systems
    (UNIX) side of the house, OpenVMS integrates with NFS (V3.0). OpenVMS can also
    offer a single directory, which is viewed, coordinated, and accessed by both Windows
    systems and UNIX systems at the same time!


    - E-business Infrastructure: Atturity''s XML and database gateways are included
    with the OpenVMS license. Apache, SSH, Java, Microsoft''s COM (object-classing
    standard), CORBA (Open Systems object-classing standard), DCE, and X Windows are
    all included with OpenVMS with the base license.


    - Service and Support: For a business that deploys an OS for years at a time,
    support for past products and previous versions of the OS is critical. HP and
    OpenVMS continue to support VAX systems (even though they haven''t shipped a new
    VAX in almost 2 years!), and they support previous stable versions of the OpenVMS
    operating systems as far back as 10 years for customers. It''s hard to imagine
    a 10-year deployment of our latest PC of the house. Businesses don''t enjoy changing
    applications that are running, once and running, tend not to get offline, which
    is one of OpenVMS''s most famous hallmarks.


    - High Availability: Many companies choose OpenVMS because it''s one of the few
    operating systems that can deliver on its claim of 99.9999 percent (about three
    minutes downtime per year). If OpenVMS had just started claiming this feat, it
    might be suspect; but customers have been getting this much service from their
    machines since the early 1990s (in a properly configured and maintained OpenVMS
    cluster). Rolling upgrades of software and the OS, and continuous processing for
    years at a time, are other milestones that OpenVMS pioneered.


    After 25 years as a computer, application, and database server, few of the other
    operating systems can even begin to match OpenVMS as a deployment platform. While
    OpenVMS will never be the best desktop, it has already proved itself the finest,
    most robust, secure, and most clusterable OS in our industry today. Wait: Don''t
    touch that dial, there''s more! If OpenVMS was just another OS with the most features
    in our industry what would you pay for such a fantastic tool? Two times or four
    times the cost of an average UNIX server? How about if OpenVMS gave you all this
    capability and had the lowest cost of ownership in the industry compared with
    all other UNIX systems and cost of mainframes? Well, don''t believe me—check out
    the Techwise Research did on OpenVMS in 2001, where they found that OpenVMS had
    the lowest cost of any server deployment over a five year period (http://www.openvms.compaq.com/openvms/whitepapers/techwise.html).


    Tested and supported features, lowest cost of ownership and deployment in the
    industry, highest availability and scalability, and a 25-year track record with
    interoperability with all the latest Internet and e-business software and tools—that’s
    why you will use OpenVMS for the next 10 years.


    # Why Linux?


    When Linus Torvald started his project, he dreamed of OS unencumbered by copyrights.
    In a few years, Linux emerged as a powerful alternative to Windows and OpenVMS.
    Where does Linux fit?


    - Linux Server: As a bottom-tier server (in the standard-tier client/server model),
    Linux is as good or better than any single NT, UNIX or OpenVMS server. Linux servers
    support SAMBA for disk shares with Windows servers and clients, NFS for disk points
    for UNIX and OpenVMS machines, Java, Apache, and all the major computer languages
    and scripting tools. The problem is that Linux servers no matter how functional,
    live within mean time between failures of their hardware. Sooner or later a deployed
    single server will have a failure that takes out critical data or programs, and
    then the system will have to be restored or rebuilt. Commercial clustering for
    Linux servers is in its infancy, as automatic failover environments for Linux
    support, cluster technology, and shared storage (SAN, networked storage) continue
    to mature, so will the use of Linux servers for data-center applications.


    - Linux Terminal: Linux workstations and laptops make excellent terminals. Linux,
    UNIX, and OpenVMS all use X Windows and various managers to redirect output to
    remote machines. Today, Microsoft has programs to perform this, but Linux has
    built-in Windows features as its larger cousins. Therefore, bringing all your
    OpenVMS applications down to a single low-cost, high-quality desktop with a great
    choice of graphics and sound is a wonderful alternative to purchasing expensive
    workstations. (Although, just like driving a Ferrari, once you''ve worked on a
    full-blown UNIX or OpenVMS workstation, it''s hard to go back—no matter how "sporty"
    the Chevy comes.)


    # The Bottom Line


    OpenVMS systems and Linux systems have much in common with UNIX and Windows servers,
    with some distinct advantages for each. Given our heterogeneous computing environments
    of today and looking towards the future, OpenVMS and Linux will find a use in
    our data centers and professional information services (IS) deployments for many
    years to come—OpenVMS for its high availability and scalability and Linux for
    its low per-unit cost structure and its huge Open Source libraries of software.

