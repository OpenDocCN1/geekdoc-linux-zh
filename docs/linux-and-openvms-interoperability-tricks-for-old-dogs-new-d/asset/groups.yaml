    随着我们迈入这个千纪年，我们的口号应该是：为每种计算风格找到成本最低、合适的工具。在 OpenVMS 和 Linux 操作系统之间，计算光谱的很大一部分已经得到了实现，而且是以极具成本效益的方式。现在，让我们探索
    Linux 和 OpenVMS 今日能做的各种事情吧！


    本书的其余章节是一系列“操作指南”过程，旨在以不同的方式利用你的 OpenVMS 和 Linux 设备（TCP/IP、电子邮件、X Windows 等）。这些步骤简单且直击要点。它们也应该是成为你探索这些功能以进行更高级的使用和部署的良好起点！你不需要从头到尾读完这本书；每个章节应该是相互独立的，而且我希望，它们能为你解决特定的
    Linux 和 OpenVMS 互操作性问题提供良好的参考。


    本书的其余部分假设你已经有一个正在运行并配置了 TCP/IP 的 OpenVMS 和 Linux 系统，并且作为用户和操作员对这两个操作系统都有了了解。（你还需要两个系统上拥有系统权限；别担心，第
    2 章将向你如何在你的设备上获取 System 和 root 权限。但不要在你的生产机器上进行实验；在学习将 OpenVMS 和 Linux 连接在一起时，同一网络中的两台小型工作站将是一个很好的测试平台。


    ## 第 2 章 — 破解 OpenVMS 和 Linux


    ### 为没有任何设备的人准备的设备


    从前有三个计算机收藏家——如果你听过这个故事请停止我。


    噢，当然，花几百美元你可以买到旧的 Alpha 64 位系统或基于 Intel 的 32 位系统，它们可以运行 OpenVMS 或 Linux，但请考虑，许多公司（甚至某些用户）每
    18 个月或更短就会升级最新的硬件。与其直接扔掉这些旧设备，所有者宁愿给它们一个好人家，有人可以使用旧硬件用于学习目的或用户组。IT 专业人士对于获得完全“老旧”的设备感到很内疚，所以你应该在当地的用户组会议上告知大家你需要/将处理老旧设备。寻找吧，你就会找到。敲敲门，也许有人会为你打开装货平台的后门！


    你去了一场周六特卖，接到了 IT 朋友的电话，或者公司办公室后门有人向你提供设备。在你谈好这些设备的最终交易后，你发现自己正开车回家，感到很高兴，因为你现在个人收藏中拥有曾经价值数千甚至几十万美元的设备，而你现在只需一箱油的钱（或更少）就获得了这些设备。


    ### 现实在回家的路上


    当然，当你开车回家时，你意识到这是一台 OpenVMS 机器，你需要产品授权密钥（PAKs）才能让软件运行。机器上可能已经有了许可证（如果系统管理员没有擦除磁盘），但拥有你自己的许可证才能让你感觉真的拥有了这台机器。等一下，不要给
    HP 购买新许可证。如果你的机器注定用于家庭使用和个人教育，你可以免费获得一个 OpenVMS 爱好者许可证，包含基础 VMS、集群（clustering）以及超过
    105 个分层产品 PAKs！只需访问 OpenVMS 爱好者网页：http://www.montagar/~hobbyist 即可。


    在网页上注册，你将会在几分钟内通过电子邮件收到你所需要的所有 PAKs。你应该注意，这些许可证是供个人或爱好者使用的；如果你打算将其用于你或他人的业务，就必须致电
    HP 为你的新系统获取商业许可证！


    ### 回到宝藏猎


    带着新收藏的新藏回到家，检查硬件并为你的新系统补齐缺失的部件——也许是显示器或 ASCII 终端、电源线、键盘或鼠标；也许你需要拧紧几颗螺丝或安装一个磁盘。电源线已就位，所有卡都已在槽中重置，网卡已插入，显示器连接到一个看起来像
    VGA 端口的地方，真理时刻来临。你为系统通了电！显示器发出了类似松动的吉他琴弦的声音，符号出现在你的屏幕上：


    - * 16, 32, 64, 96, 128 Mbytes 内存正在倒计时（系统看起来越来越棒了）。

    - * 软驱发出呻鸣，CD-ROM 闪烁，BIOS 固件显示已加载了许多选项。

    - * 硬盘开始启动 Linux 或 OpenVMS——快，你打算怎么办？


    当你准备询问启动信息时，启动提示信息已经一闪而过，X Windows 登录横幅出现了，你被困在一个没有用户名或登录信息的多用户系统里。


    X Windows 登录横幅隐藏着秘密！这台系统是管理核电站、医院、银行还是 ISP（互联网服务提供商）的？也许与给你系统的人达成交易之一就是让你擦除磁盘以删除所有那些昂贵的专有数据；但这里光标在闪烁——从一个小小的屏幕上嘲弄着你。


    于是你决定破解它，窥探其内部，然后擦除硬盘——正如任何优秀的系统管理员所知，他的每周配额可能如此。抛开道德不谈，有许多合法的理由去破解并控制 Linux 或
    OpenVMS 系统，即使你不是该系统的所有者！


    ### 破解 Linux 或 OpenVMS 计算机的合法理由


    - * 系统管理员离开了公司，没有向新的系统管理员交接。

    - * 系统已被攻破，你必须接管控制并重建安全性。已经没有人知道系统上还有什么了。

    '
