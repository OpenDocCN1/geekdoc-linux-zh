    集成到 OpenVMS 和 OpenVMS 集群中，每年都有新客户。


    - **分时共享（Timeshare）**：随着互联网的持续增长和服务器整合的持续，系统的衡量标准将是能够在可预测的时间段内处理大量微小任务并均匀共享资源的能力。自20
    世纪 70 年代以来，OpenVMS 及其调度器一直在提供并完善可预测的甚至实时的性能。针对当今 Web 服务器、事务服务器和应用程序服务器的需求，对每个任务进行容量规划和可预测响应已成为部署原型应用的先决条件。


    - **安全（Security）**：在过去的13 年里，OpenVMS/VMS 的 CERT 安全公告少于 45 条。（截至 2002 年 6 月：Windows
    2000 为 484 条，Linux 为 546 条，Solaris 为 490 条，AIX 为 377 条：http://www.cert.org/）。


    在生产环境中部署其他服务器，为了确保安全以及修补所有 CERT 公告，花费的系统管理费用将远高于直接开箱即用部署 OpenVMS 的费用！如果你检查了所有的
    CERT 公告，可能需要花费数百小时来审查其他操作系统中的各种安全漏洞。


    开箱即用的 OpenVMS 几乎是不可破解的（2001年7月 DEFCON 9 黑客大会的神灵/法官是这么说的：http://www.dfwcug.org/dfwcug_newsletters/201007.PDF）。


    著名黑客 Kevin Mitnick 最近向国会作证，当他最近尝试侵入英国一个 OpenVMS 系统时，遭遇了人生中的第一次击败（http://www.zdnet.com/zdnn/stories/news/0,4586,2454737,00.html）。


    - **Diico**：国防信息基础设施通用操作环境（DIICCOE）认证意味着 Compaq/HP 已于 2001 年与美国政府签署协议，在未来 20 年内支持
    OpenVMS。这允许 HP 继续向美国政府销售 OpenVMS（OpenVMS 最大的用户群之一），并且必须在未来 20 年内对向美国政府的产品维持支持。


    - **共享文件系统（Shared File Systems）**：OpenVMS 通过 Advanced Server（微软的代码）提供与 Windows
    2000 和 NT 4.0 SMB 文件系统的集成。从开放系统（UNIX）侧来看，OpenVMS 与 NFS (V3.0) 集成。OpenVMS 还可以提供单一目录，供
    Windows 系统和 UNIX 系统同时查看、协调和访问！


    - **电子商务基础设施（E-business Infrastructure）**：Atturity 的 XML 和数据库网关包含在 OpenVMS 许可中。Apache、SSH、Java、微软的
    COM（对象类标准）、CORBA（开放系统对象类标准）、DCE 和 X Windows 均包含在 OpenVMS 的基础许可中。


    - **服务与支持（Service and Support）**：对于一个运行操作系统长达数年的企业来说，对过去产品和操作系统以前版本的支持至关重要。HP
    和 OpenVMS 继续支持 VAX 系统（尽管他们已经近 2 年没有交付过新的 VAX 了！），并且他们为客户支持追溯到 10 年之前的 OpenVMS
    操作系统稳定版本。很难想象我们最新的 PC 能够部署 10 年。企业不喜欢更换正在运行的应用，一旦运行，往往倾向于不离线，这是 OpenVMS 最著名的标志之一。


    - **高可用性（High Availability）**： 许多公司选择 OpenVMS 是因为它是少数能够实现其 99.9999%（每年停机时间约 3
    分钟）承诺的操作系统之一。如果 OpenVMS 才开始声称实现这一壮举，它可能会引起怀疑；但客户自 20 世纪 90 年代初以来，一直从他们的机器上获得如此水平的服务（在配置配置和维护良好的
    OpenVMS 集群中）。软件和操作系统的滚动升级，以及长达数年的持续处理，是 OpenVMS 开创的其他里程碑。


    在作为计算机、应用程序和数据库服务器运行了 25 年后，很少有其他操作系统在部署平台方面能与 OpenVMS 相提并论，甚至开始比拟。虽然 OpenVMS
    永远不会是最好的桌面系统，但它已经证明自己是当今行业中最优秀、最健壮、最安全且最易集群化的操作系统。等一下：别走，还有精彩的！如果 OpenVMS 只是我们行业中功能最多的另一个操作系统，你愿意为这样一个天才工具付多少钱？平均
    UNIX 服务器成本的两倍或四倍吗？如果 OpenVMS 给你所有这些能力，并且与所有其他 UNIX 系统和大型机相比，具有业内最低的拥有成本又如何？嗯，不要听我的——看看
    Techwise Research 在 2001 年对 OpenVMS 进行的调研，他们发现在五年内，OpenVMS 是任何服务器部署中成本最低的（http://www.openvms.compaq.com/openvms/whitepapers/techwise.html）。


    经过测试和支持的功能、行业最低的拥有成本和部署成本、最高的可用性和可扩展性，以及与所有最新互联网和电子商务软件工具的互操作性方面的 25 年战绩——这就是为什么你在未来
    10 年将继续使用 OpenVMS 的原因。


    # 为什么选择 Linux？


    当 Linus Torvald 启动他的项目时，他梦想着一种不受版权限制的操作系统。几年后，Linux 成为 Windows 和 OpenVMS 的强力替代方案。Linux
    处于何种位置？


    - **Linux 服务器（Linux Server）**：作为底层服务器（在标准的客户端/服务器模型中），Linux 与任何单机 NT、UNIX 或 OpenVMS
    服务器相当甚至更好。Linux 服务器支持通过 SAMBA 与 Windows 服务器和客户端共享磁盘，通过 NFS 与 UNIX 和 OpenVMS 共享，支持
    Java、Apache 以及所有主流编程语言和脚本工具。问题在于，无论 Linux 服务器功能多么强大，都受限于硬件的故障间隔。早晚某个部署的单服务器会出现会导致关键数据或程序的故障，届时系统必须恢复或重建。Linux
    服务器的商业集群处于婴儿阶段，随着 Linux 故障转移环境、集群技术和共享存储（SAN、网络存储）的成熟，Linux 用于数据中心的应用也将成熟。


    - **Linux 终端（Linux Terminal）**：Linux 工作站和笔记本电脑是极好的终端。Linux、UNIX 和 OpenVMS 都使用
    X Windows 和各种管理器输出输出到远程机器。今天，微软拥有此类功能的程序，但 Linux 作为其大兄弟内置了 Windows 功能。因此，将所有的
    OpenVMS 应用带到具有优秀图形和音的低成本高质量桌面，是购买昂贵工作站的绝佳替代方案。（尽管就像驾驶法拉利，一旦你用过真正的 UNIX 或 OpenVMS
    工作站，就很难再用别的——无论那辆雪佛看起来有多“运动”。）


    # 总结（The Bottom Line）


    OpenVMS 和 Linux 系统与 UNIX 和 Windows 服务器有许多共同点，且各有独特优势。考虑到我们如今的异构计算环境并展望未来，OpenVMS
    和 Linux 在未来多年里将在我们的数据中心和专业信息服务（IS）部署中有一席之地——OpenVMS 凭借其高可用性和可扩展性，而 Linux 则凭借其低廉的单位成本结构和庞大的开源软件库。


