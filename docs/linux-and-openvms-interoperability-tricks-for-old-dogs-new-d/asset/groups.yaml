  mdcn: "\n\n# Web 管理者的 Apache 迈进\n\n我永远不会忘记第一台 Web 服务器，而今天我们已经将 Web 服务器工具视为理所当然（而且是免费的），例如来自开源的\
    \ Apache。有人很快就说 Linux 的第一个杀手级/突破性应用是 Apache，它让 Linux 在许多人心中成为了 Web 服务器的代名词。在某一段时间内，几乎所有被引入的\
    \ Linux 机器其主要目的都是为了共享万维网页面。\n\n今天，65% 或比例的 Web 服务器是基于 Apache 的。RedHat 现在随 Linux\
    \ 提供了 Apache（尽管你必须进行最少的配置、启动 Apache 服务器，并将其设置为开机自启动）。OpenVMS 工程也提供了一个基于 Apache\
    \ 的 Web 服务器，该服务器已通过 OpenVMS 工程的商业支持和性能测试。\n\n这两款 Web 服务器都可以在网络上找到：\n\n```\nhttp://www.apache.org\n\
    http://www.openvms.compaq.com\n```\n\n今天 Apache 有许多理由被推荐为 Linux 和 OpenVMS 系统的主导\
    \ Web 服务器。它易于安装，性能卓越，并且是开源的（这使得变得容易得多，而且所有那些新的开源功能似乎都出现在代码库中！），而且它们源自相同，学习使用其中一个可以让你对目录结构、配置文件以及其他设置值有所了解，这些值在各种平台上运行的\
    \ Apache 中是通用的。\n\n虽然多年来 Web 管理者有许多选择，但他们工作中最困难的部分仍然和多年前一样：找到足够的内容来满足满足饥渴的用户。对于\
    \ Apache 来说，Linux 还是 OpenVMS 哪种服务器更好？答案取决于哪些应用程序需要 Apache Web 界面？运行了 20 多年的旧式\
