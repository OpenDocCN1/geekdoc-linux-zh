    OpenVMS 系统管理员在遇到 Linux 机器问题时会采取的行动。我给另一个 OpenVMS 系统管理员打了电话！不只是普通的系统管理员，而是我的好朋友
    David，DECUS/VMS SIG 主席兼达拉斯-斯顿当地用户小组主席。David 有 Linux 经验，所以我很快指出我们应该在系统上寻找奇怪的文件。


    Dave 走了过来，我们寻找了临时文件。寻找就会发现；我简直就像是所有发现孩子身上爬满虱子的父母一样！那台 Linux 机器不仅被黑了，而且还有端口扫描日志、扫描执行程序，以及两个坏蛋之间关于破解机器以及利用其寻找新目标进行攻击的完整对话日志。David
    和我观察、等待，并以超级用户的身份捕获了会话信息——其中一个连接通过 AOL 跳转以防被发现，另一个则通过韩国某所大学跳转。


    我做了铁血系统管理员会做的事：获取日志，复制文件，打电话并给 AOL 提供了那个为了邪恶目的肆虐我的作案者的用户 ID。


    当然，AOL 不想和我的证据有任何关系——我有 FBI 或者至少有当地执法部门！我考虑过由于我的生产环境 Linux 机器被一个 AOL 脚本小子攻击并破解，我可以开出
    4200 万美元的 IT 费用，尽管浪费当局的时间不太好。


    我对 Linux 机器的死后分析包括将其断开网络，并识别破解者是如何直接溜入，并让我的机器像骡子一样干体力活的。答案在密码文件中——我加载了所有东西，我能加载每一个
    RPM！加载了一个数据库，默认特权用户账户可以创建其他账户——使用默认密码！


    我变得很谦卑，不再那么自信，我清理了我的 Linux 系统，只加载了我将要使用并立即理解的 RPM。从这里我学到了关于系统安全的巨大教训：


    如果你不知道某个软件是做什么，就不要在你的系统上加载它，并将任何默认设置更改为更安全的设置。


    当然，我也学会了对澳大利亚人多信任一点，对 AOL 和韩国某大学的计算机账户少信任一点。


    ## 为风暴做准备


    Steven Smiley 和我在一个著名的安全会议上休息，观看那天晚的电影节双片放映（《福比计划巨人》和《黑暗之星》）。教室后方传来阵阵笑声，因为有人在做些很酷的事。Steve
    自己去参加一个深夜问答环节了，但我走向最后，和那群最吵闹的顾问坐在一起。


    当我听着时，观众围坐着一个年轻人，他坐在地板上，笔记本电脑无线线连接到网络。


    > “嗅探了他的即时通讯软件密码，现在我正在和他妈妈聊天”——坐在周围的人爆发出阵阵大笑。


    > “但是妈妈，我会留在拉斯维加斯在赌场工作。我找到了我的真归宿！”那个键盘侠一边给目标的妈妈发字，一边大声念读道。


    > “你不会毁掉那个可怜事儿对他自己的印象的，对吧？”我问道。


    > “不会，”键盘侠说，“我只是为了确保他学会网络通信中加密的价值！”


    每个人都为这个笑话大笑起来。


    简单的真理是，如果你是一个开放网络，网络上的任何人都有可能嗅探数据包并扫描明文密码，扫描所有 TCP/IP 端口，并寻找已知的后门或更糟的东西。你能做什么？防火墙？入侵检测工具？加固操作系统？完全拔掉网络连接？


    我们不太可能直接退出网络通信，因为这对于如今的计算机和便携式设备来说是前提条件。所以今天的主要解决方案之一（也是未来重要性日益增加的解决方案）是在建立连接时在客户端和服务器之间使用加密链路——任何连接！


    现在记住，标准的 TCP/IP 工具如 Telnet 和 FTP 完全没有加密，你通过这些工具发送的任何数据都可以被检查密码、PIN 码、代码、信用卡号、社会安全号，甚至是位于传输文件内部的数据。现在问问自己：谁会花时间在你的网络上扫描这些东西？你会感到惊讶的。大多数计算机犯罪
    60/40% 为内部人员。这比去年有所下降，去年的常态是内部人员占 70%。互联网和其他网络路径是计算机犯罪增长最快的访问方式！


    考虑一下，每个运行标准程序的服务器都使用相同的端口，因此你不仅知道服务器在运行什么，你可能还可以利用这些端口作为这些服务器的后门。


    ## TCP/IP 已知端口


    由于它们是标准应用程序，TCP/IP 为服务器定义了“已知端口”，它们随时准备与尝试通信的客户端连接进行通信。


    也许最为人知的端口是 80 端口，或者说是万维网（WWW）协议通信的端口。从带有 Web浏览器的客户端连接，WWW 协议通过此链路使用 TCP/IP 连接到
    Web 服务器上的 80 端口——所有所有的超文本、图片、图形、电影、Java 和其他 Web 信息。


    已知端口还告诉我们服务器目前正在提供哪些服务。许多应用程序有自己的 TCP/IP 端口号，它们在默认安装时总是使用。这些应用程序有时可以更改端口号，但很少这样做。服务器管理员可以更改这些端口，但其他客户端应用程序将无法与它们通信。


    好消息是，这些端口现在提供了一种查看 TCP/IP 节点上提供的所有服务的方法。坏消息是，这些端口现在提供了一种查看 TCP/IP 节点上提供的所有服务的方法！只需通过探测这些应用程序的已知密码和已知后门，就可以打开这些节点的安全性。


    网络服务器观察者的首选工具是一种名为端口扫描器的软件。互联网上可以找到端口扫描器；费用从免费到数千美元不等。这些工具中的许多会检查服务器从 1 到 80,000+
    的每一个端口。许多已知的软件端口带有横幅（banners），可以告诉你许多关于端口应用程序、服务器操作系统、甚至是谁拥有该系统的大量信息！一个优秀甚至平庸的端口扫描器都会保存这些信息以供搜索或稍后查看。


    使用端口扫描器最简单最直接的方法当然是 TCP/IP 应用程序。你可以使用 Telnet 检查甚至与服务器上的任何已知端口或应用程序端口进行交互！通常你使用
    Telnet 客户端连接到服务器端口（默认数字 23），大多数 Telnet 应用程序会更改你的端口以连接到你想要的任何端口。从 VMS 或 Linux 提示符简单输入：


    ```

    telnet/port=25 yourhost.domain.com

    ```


    从终端窗口执行。你的交互式终端会话将连接到 25 端口（服务器上的电子邮件端口），如果它是激活状态的话！输入


    ```

    helo\help

    ```


    你就进入了一个交互式电子邮件系统，它允许你在这样一项被称为“电子邮件欺骗”（e-mail spoofing）的古老运动中发送 SMTP 邮件。你可以 Telnet
    到已知端口，并直接与控制这些端口的应用程序对话。


    许多应用程序有安全性。但很多没有。这并不是你用来攻击他人系统的方法，而是确认服务器的 TCP/IP 应用程序已配置、安装并运行的极佳方法。


    当你在操作你的 Linux 或 OpenVMS 系统时，遍历已知端口是一种实验性和学习工具。但当你从他人的 Linux 系统遍历澳大利亚和新西兰的所有已知端口，并在通过
    AOL 和海外大学账户跳转的同时将其作为引导启动（进行你的工作）时，我相信这属于犯罪活动领域。


    我包含了一份已知端口列表；还有其他端口，且每个网络应用程序都可能包含自己的已知端口。这些是我查看应用程序是否正在运行的端口；更彻底的端口扫描可以识别未知的后门、安全漏洞以及你没有安装的应用程序。你应该定期扫描服务器上的
    1-80,000 端口以确保万无。


    Linux 和 OpenVMS 系统的 TCP/IP 已知端口（并非全部）包括以下内容：


    | 端口 | 服务 |

    | :--- | :--- |

    | 7 | echo |

    | 11 | systat.Active Users |

    | 21 | ftp |

    | 22 | ash |

    | 23 | telnet |


