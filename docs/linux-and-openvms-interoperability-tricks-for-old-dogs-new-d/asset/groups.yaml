    As we move forward in this millennium the battle cry should be for the lowest-cost,
    right tool for every style of computing. Between OpenVMS and Linux operating systems,
    a very large part of the computing spectrum is being delivered, and in a most
    cost-effective way. Now let''s explore the types of things both Linux and OpenVMS
    can do today!


    The rest of the chapters in this book are a series of how-to-processes designed
    to utilize both your OpenVMS and Linux box in different ways (TCP/IP, E-mail,
    X Windows, and more). The procedures are easy and to the point. They should also
    be a good starting point for you to explore these functions for more advanced
    use and deployment! You won''t need to read this book cover to cover; the chapters
    should be self-contained and, I hope, a good reference for your specific Linux
    and OpenVMS interoperability issues.


    The rest of this book assumes that you have a running OpenVMS and Linux system
    configured with TCP/IP and a working knowledge of both OSs as a user and operator.
    (You''ll also need system privileges on both systems; don''t worry, Chapter 2
    shows you how to get System and root on your boxes. But don''t experiment on your
    production machines; two small workstations in the same network would be a great
    test bed as you learn to connect OpenVMS and Linux together.


    ## Chapter 2 — Breaking into OpenVMS and Linux


    ### Equipment for Those Who Have None


    Once upon a time there were these three computer collectors—stop me if you''ve
    heard this one.


    Oh sure, for a few hundred dollars you can get older Alpha 64-bit systems or Intel-based
    32-bit systems that will run OpenVMS or Linux, but consider that many companies
    (and even some users) are trading up to the latest hardware every 18 months or
    less. Rather than just throwing out this older equipment, owners would rather
    give it to a good home, someone could use older hardware for learning purposes
    or for user groups. IT professionals have lot of guilt about getting perfectly
    “old” equipment, so you should make it known at local user group meetings that
    you need/will work on older equipment. Seek and you will find. Knock and someone
    might open the back door of a loading dock for you!


    You have gone to a Saturday sale, gotten a call from an IT friend, or had someone
    at the back door of a corporate office offering you equipment. After you negotiate
    your final deal for the gear, you find yourself driving home, pleased that you
    now have in your personal collection equipment that once paid thousands and hundreds
    of thousands of dollars for, and you have now obtained this equipment for the
    cost of a tank of gas (or less)


    ### Reality Sets in the Way Home


    Of course, as you''re driving home you realize that it''s an OpenVMS machine,
    you need license product authorization keys (PAKs) to make the software work.
    There may be licenses already on the machine (if the system admin didn''t erase
    the disk), but there is really nothing having your own licenses to make you feel
    like you own the box. Wait, don''t call HP and buy new licenses. If your machine
    is destined for home use and personal education, you can get an OpenVMS hobbyist
    license with base VMS, clustering, and over 105 layered product PAKs for free!
    Just go to the OpenVMS hobbyist Web page at http://www.montagar/~hobbyist.


    Register on the Web, and you will have all the PAKs you need to via e-mail in
    a matter of minutes. You should note that these licenses are for personal or hobbyist
    use; you would have to call HP and get commercial licenses for your new system
    if you were going to use it for your or someone else’s business!


    ### Back at the Treasure Hunt


    Arriving home with the new treasure for your collection check out the hardware
    and supplying the missing pieces for your new system—maybe a monitor or ASCII
    terminal, power cord, keyboard, or mouse; perhaps you need to tighten a few screws
    or install a disk. The power cords are in place, all the cards have been reset
    in their slots, the network card is plugged in, the monitor is connected to what
    looks like a VGA port, and the moment of truth arrives. You apply power to the
    system! The monitor makes a sound like a loose string guitar and symbols appear
    on your screen:


    - * 16, 32, 64, 96, 128 Mbytes of memory count down (the system is looking better
    and better).

    - * The floppy groans, the CD-ROM blinks, and the BIOS firmware shows it''s loaded
    with options.

    - * The hard drive starts to boot Linux, or OpenVMS—quick, what are you going
    to do?


    By the time you are to ask the boot messages have flashed by, the X Windows banner
    login comes up and you are stuck with a multiuser system without a user name or
    login.


    An X Windows login banner hides secrets! Was this a system that managed a nuclear
    plant, hospital, bank, or ISP? Maybe part of the deal with the person who gave
    you the system was that you would scratch the disk to remove all of that valuable,
    proprietary data; but here blinks the cursor—mocking you from a small screen.


    So you resolve to break in, peek under the covers, and then scratch the drives—as
    any good system administrator knows his or her weekly ration might. Ethics aside,
    there are many legitimate reasons for breaking in and taking control of Linux
    or OpenVMS systems, even if you''re not the system owner!


    ### Legitimate Reasons for Breaking into Linux or OpenVMS Computers


    - * The system admin has left the company with no transition to the new system
    administrator.

    - * The system has been compromised and you have to take control and rebuild/
    security. No one knows what is on the system anymore. No one knows what the current
    system is doing! No one remembers the System (OpenVMS SysAdmin ) or root (Linux
    SysAdmin ) password.


    I have seen the need for breaking systems so often in professional IT situations
    that whenever I tackle a new operating system or computer, learning how to break
    into it is right up there with learning the local text editor!


    As for breaking OpenVMS, there are few known cracks for this purpose, and even
    Linux is resistant to many remote attacks as well (when properly configured).
    The professional system administrator, hacks and cracks are not the way to open
    a system. The zero-damage, professional method of breaking into a Linux or OpenVMS
    system is the only acceptable way to take over a system if you have a legitimate
    (legal) need to do so. Let''s look at the standard methods for resetting root
    or System passwords for Linux or OpenVMS.


    ### Ten-Step Process for Changing a Linux System''s Root Password


    Software required: V7.2 or 7.3 RedHat CD-ROM #1


    - 1. Have physical access to the Linux system.

    - 2. Boot RedHat 7.2/7.3 CD-ROM distribution.

    - 3. Type in "rescue" as the boot choice.

    - 4. Choose English (or your language).

    - 5. Choose "Continue" when asked to mount your installation (don''t choose read-only).

    - 6. Enter a shell.

    - 7. Change root to the mounted file system.

    - 8. Change password.

    - 9. Exit the shell and shutdown the system.

    - 10. Remove the RedHat CD-ROM and reboot from the hard drive. When the Linux
    system reboots, login as root. The root password will now be Welcome1. Congratulations,
    you''ve just broken into a Linux system!


    ### Ten-Step Process for changing an OpenVMS System Password


    Software Required: None


    - 1. Have physical access to the OpenVMS system.

    - 2. Reboot/halt the boot process (find the reset button on your Alpha) and find
    yourself at a three chevron prompt ">>>

    - 3. For most Alphas, but with the "Conversational Boot" flag set (0 refers to
    the "cluster software" directory you want to boot from).

    - 4. At the SYSBOUT> prompt you can change any VMS sysgen parameters before the
    system runs.

    - 5. Because you''ve set the uafternate to 1, the user and password files are
    wide open.

    - 6. Prepare to modify the old VMS password file.

    '
