    # Displaying Your Linux Windows Applications on OpenVM


    Back in the mid-1980s, when VMS workstations were state-of-the-art graphical chip
    set, you were likely to have a VMS workstation on your desk as your primary workstation.
    Today, Alpha workstations are just likely to use Linux or Tru-64 UNIX as OpenVMS.
    PCs are as likely to run Linux for the operations staff, and today''s $30 PCI
    or/ graphics card under Linux or Windows is quite possibly a better display engine
    than three-year-old graphics running in your Alpha workstation. The nice thing
    about X Windows is that you are not tied to your computer engine or tired old
    graphics cards; you can just redirect the graphics to enjoy the application with
    new eyes!


    But let''s assume you are lucky enough to have the latest state-of-the-art Alpha
    workstation running VMS on your desk (instead of a GS320 cluster in your computer
    room) and your Linux box''s graphical card is aging a little. You can simply redirect
    your Linux application to your new OpenVMS display.


