    编辑配置选项：为你的系统启用或禁用 TCP/IP 服务器应用程序。记住，如果你需要 NFS、POP3、IMAP 邮件或其他功能，它们必须能够运行！


    # TCP/IP 应用


    OpenVMS 和 Linux 网络通过使用跨越 TCP/IP 的相似应用程序共同协同工作。表 3-2 是协议以及一些常用应用程序的列表，并对它们执行的功能进行了简要描述。


    表 3-2：OpenVMS 和 Linux 之间的 TCP/IP 应用


    | 应用 | 描述 | 配置时 |

    |---|---|---|

    | BIND/DNS | 互联网名称服务 | 通常与你的 ISP 配合 |

    | FTP | 文件传输协议—系统之间的网络复制 | 初始系统安装 |

    | LPD | 打印机守护进程—用于打印到打印机 | |

    | SMB | 系统块—磁盘共享 | 当你添加网络 |


    表 3-2：OpenVMS 和 Linux 之间的 TCP/IP 应用（继续）


    | 应用 | 描述 | 配置时 |

    |---|---|---|

    | Telnet | 终端仿真决定了如何使用它；TCP/IP 提供连接 | 初始系统安装 |

    | SMTP, POP3, IMAP | 电子邮件、邮局协议、简单邮件传输协议 | 查看第 6 章 |

    | SSL | 使用套接的安全层 | 查看第 4 章 |

    | X Windows | 网络系统的 X Windows | 查看第 5 章 |


    OpenVMS 和 Linux 网络因为应用程序遵循行业标准定义而共同工作。说这完全可行可能太简单了！大多数时候确实如此！FTP 在两个系统之间复制文件，无论你发送的是二进制文件（编译过的或对象文件）还是文本文件。X
    Windows、电子邮件客户端、Finger、Telnet 以及所有其他应用也是如此。


    # URL 技巧及更多


    TCP/IP 工具构建在 Linux 和 OpenVMS 操作系统的内部。你可以复制文件、发送电子邮件以及更多内容。进程间通信使得客户端/服务器成为可能，而万维网和
    IP 端口可以在新应用程序投入生产之前在同一服务器上进行测试和运行。


    所有这些内容的未来都是新的，我们应该看到更多具有增强功能且加密不断增加的应用。


    在进入下一章安全之前，最后一个 TCP/IP 技巧：我的一个好朋友，来自 DFWLUG 的 Steve Smiley 向我展示了这个小技巧，并据此为 DFWLUG
    季刊撰写了一篇文章。


    如果你在 Linux 或 OpenVMS 系统上执行“NSLOOKUP”并输入有效的 DNS 名称，你会得到类似 209.39.152.33 的地址。如果你将
    TCP/IP 字节转换为二进制表示（借助科学计算器的帮助），你会得到


    ```

    209 = 11010101

    39 = 00100111

    ```


    确保在前面补 0 以形成 8 字节字符二进制！


    ```

    152 = 10011000

    33 = 00100001

    ```


    将二进制（2 进制）字符串相加


    ```

    209.39.152.33 = 1101000100111110011100000100001 (base2)

    ```


