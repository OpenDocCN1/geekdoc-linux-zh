    # Preparing for the Storm


    Steven Smiley and I were taking a break at a well-known security convention watching
    the evening’s film-festival double feature (Colossus for the Forbin Project and
    Dark Star). From the back of the room came waves of laughter that someone was
    doing something cool. Steve wandered off to see a late night Q&A session, but
    I went to the back and sat with the loudest crowd of consultants.


    As I listened, the audience was arrayed around a young man who was sitting with
    his laptop wirelessly connected to the network as he sat on the floor.


    > “Sniffed his instant messenger password and now I’m talking to his mother”—roars
    of laughter from the folks sitting around.


    > “But Mom, I’m going to stay in Vegas and work at a casino. I’ve found my true
    calling!” said the keyboardist out loud as he typed to the mark’s mother.


    > “You’re not going to destroy poor guy’s opinion of him are are you?” I asked.


    > “Nah” said the keyboardist, “I’m just going to make sure he learns the value
    of encryption in network communications!


    Everyone laughed at the joke.


    The simple truth is that if you are an open network, anyone on the network can
    potentially sniff packets and scan for plain-text passwords, scan all TCP/IP ports,
    and look for known back doors or worse. What do you do? Firewalls? Intrusion detection
    tools? Harden the operating system? Unplug from the network completely?


    It’s not likely we can just retreat from network communications, since they are
    a prerequisite for computers and portable devices these days. So one of the main'
  - '[PAGE 32]


    solutions today and increasing in importance in the future is to use an encrypted
    link between your client and server when making a connection—ANY CONNECTION!


    Now remember that standard TCP/IP tools such as Telnet and FTP aren''t encrypted
    at all, any data you send across those tools can be examined for passwords, PINS,
    codes, credit card numbers, social security numbers, and even the data that resides
    inside a transferred file. Now ask yourself: Who would take the time to scan for
    these things on your network? You''d surprised. Most computer crime is an inside
    job by 60/40 percent. This is down from last year when the norm was 70 percent
    inside jobs. The Internet and other network paths are the fastest growing access
    method for computer crime!


    Consider that each server that runs standard applications uses the same ports,
    so that not only do you know what the server is running, but you might be able
    to use these ports as back doors to these servers.


    # TCP/IP Known Ports


    Because they are standard applications, TCP/IP defines for servers “known ports,”
    which stand ready to communicate with client connections that try to communicate
    with them.


    Perhaps the best known port is port 80 or the port that the Wide Wide Web protocol
    communicates on. Connecting from a client with a Web browser, the WWW protocol
    connects to port 80 on a Web server using TCP/IP across this link—all hypertext,
    pictures, graphics, movies, Java, and other Web information.


    Known ports also tell us what services a server is currently offering. Many applications
    have their own TCP/IP port number, which they always use for a default installation.
    These applications can sometimes change port numbers but rarely do. A server administrator
    can change these ports, but then other client applications can’t communicate with
    them.


    The good news is that these ports now give a way to look up all services being
    offered on a TCP/IP node. The bad news is that these ports now give a way to look
    up all services being offered on a TCP/IP node! Security can be opened up these
    nodes by simply probing for known passwords and known back doors for these applications.


    The tool of choice for network server watchers is a piece of software called a
    port scanner. Port scanners are available on the Internet; costs vary from free
    to thousands of dollars. Many of these tools will check a server for every port
    from 1 to 80,000+. Many known software ports have banners that will tell you a
    great deal about'
  - '[PAGE 33]


    port''s application, the server''s operating system, and even who owns the system!
    A good or even a mediocre port scanner will save all this for search or later
    review.


    The simplest and easiest way to use the port scanner is, of course, the TCP/IP
    application. You can use Telnet to check and even interact with any known port
    or application port on a server! Usually you use your Telnet client to connect
    to a server port (number 23 by default), most Telnet applications will change
    your port to connect with any port you wish. Simple type from a VMS or Linux prompt


    ```

    telnet/port=25 yourhost.domain.com

    ```


    from a terminal window. Your interactive terminal session will be connected to
    port 25 (the e-mail port on server), if it''s active! Type


    ```

    helo\help

    ```


    and you''re on your way to an interactive e-mail system that will allow you to
    even send SMTP mail in an age-old sport call e-mail spoofing. You can Telnet to
    known ports and talk directly with the applications that can control those ports.


    Many applications have security. Many do not. This is not something you use to
    attack other people''s systems, but is a great way to confirm that a server''s
    TCP/IP applications are configured, installed, and are running when your client
    application isn''t working or talking to the server.


    When you are working on your Linux or OpenVMS system, walking known ports is experimental
    and a learning tool. But when you are walking all the known ports of Australia
    and New Zealand from someone else''s Linux system and using it as a grant boot
    (doing your work) while looped through AOL and offshore university accounts, I
    believe that falls into the criminal-activity realm


    I''ve included a list of known ports; there are others and each network application
    may include its own known port. These are the ports I look to see if applications
    are running; more thorough, port scans could identify unknown back doors, security
    holes, and applications you didn''t install. You should regularly scan ports 1-80,000
    on your servers just to make sure.


    TCP/IP known ports (some not all) for Linux and OpenVMS systems include the following:


    ```

    7,echo, Echo

    11,systat.Active Users

    21,ftp,File Transfer

    22,ash, SSH Remote Login Protocol

    23,telnet,Telnet

    ```'
