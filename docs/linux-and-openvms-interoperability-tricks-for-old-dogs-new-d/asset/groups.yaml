    # Questions for Network Setup

    (Questions You Must Ask to Set up a TCP/IP Network)


    Q1: What is my TCP/IP address and how do I get one?


    An IP address is a unique representation of a host system number for either your
    Linux or VMS box.


    TCP/IP uses the IP address to communicate with other hosts across a TCP/IP network.
    An IP number works like a street address. If I am given the address 666 Halloween
    Lane, I will be able to find the host represented by that address. If I give your
    TCP/IP networked Linux or VMS box an IP address, other hosts will be able to find
    it and your box will be able to find other hosts across the network.


    Your network administrator or Internet Service Provider (ISP) will issue you an
    IP address that looks something like: 10.0.0.1. This number is a decimal representation
    of a binary number.


    If you are over 40 years old, you may remember being taught about base systems.
    People use a base 10 numbering system for obvious reasons (count your fingers
    to figure out why!). Is any of this returning from your dank, dark memories of
    yesterday? No? Okay, let''s explain in slightly more detail. There are several
    base systems used in the computer field.


    Binary (base 2), hexadecimal (base 16), and decimal (base 10) are used most often.
    While the IP address you use is in base 10, the hosts running TCP/IP see it in
    base 2. So an IP address of 10.0.0.1 in base 10 is 00001010000000000000000000000001.


    Now, which number is easier to remember?


    Certainly, if you''re a programmer 00001010000000000000000000000001 is much easier,
    just remember all the 0s and 1s. With the end and future Microsoft Certified Professionals
    in mind, the standards committees use the base 10 representation of a binary (base
    2) address. What is represented here is a simplification of TCP/IP and computer
    technologies.


    Just one thing about IP addresses before moving to the next question. IP addresses
    are divided into classes. Think of classes as large groups of IP addresses, nominated
    in numeric order. Class A IP addresses are grouped from 0–126, Class B is grouped
    from 128–191, and Class C is grouped from 193–233. We can determine what Class
    IP address belongs to by examining the first set of numbers on the far left side.
    An address of 205.165.160.1 is Class C, because 205 is between 193 and 233.


    Okay, really, this will be the very last thing about IP addresses. Due to the
    explosion of the Internet, with servers, routers, handheld telephones,


    Chapter 3 – TCP/IP for OpenVMS and Linux 19'
