    # Foreword


    For the last twenty-five years, HP OpenVM™, a proven enterprise-class operating
    system, has been supporting customers'' most demanding business-critical requirements
    for reliability, availability, scalability, and security.


    In the last five years, Linux and the open source movement have moved from a small-system
    operating system on the technology fringe to a serious contender in corporate
    computing.


    Both operating systems have much in common with UNIX and Windows servers. OpenVMS
    is a general-purpose operating system that has many standard interfaces and APIs.
    Linux is a customizable operating system that shares its APIs with UNIX. APIs
    common to both operating systems allow OpenVMS and Linux to interoperate easily.


    OpenVMS and Linux operating in the same enterprise environment let you combine
    the low per-unit cost structure of Linux and its huge open source libraries of
    software with the proven high availability, security, and scalability and exceptional
    robustness of OpenVMS.


    I''ve found this book to be a practical, hands-on manual that explains how OpenVMS
    system managers can integrate their systems with Linux, allowing the two platforms
    to work cooperatively and extend the processing capability of a computing environment.
    John clearly describes the features and benefits of both operating systems, so
    that you can evaluate which one is best for any given task. The hints, tips, and
    techniques you''ll find here will help you create a heterogeneous OpenVMS and
    Linux computing environment to meet your needs today and tomorrow.


    Martin R. Fink

    Vice-President and Chief Technology Officer

    Hewlett-Packard


    # Preface


    This book began many years ago when Linux was only a dream of Mr. Torvald''s.
    Its germs were in the DECWindows Cookbook, DFWCU Longwords Newsletter articles,
    and hints and techniques shared at a hundred DECUS sessions that connected Open-VMS
    and Unix systems together in some way over the years.


    From all of these ideas, plus Linux''s evolution with the number of times Linux
    and OpenVMS were being used in the Datacenters, I felt a need to better understand
    the things that Linux and OpenVMS could do together. I also felt that if I needed
    to understand this type of interoperability, many other people might need the
    same understanding too. Today Linux and OpenVMS using Open Source programs have
    an identical look and feel for many of their applications and interfaces. Despite
    the similarity of look and feel, configurations, installations, and scripts vary
    between operating systems (OSs).


    This book identifies areas of interoperability, and more importantly provides
    a step-by-step process to those areas. Products, configurations, scripts, are
    all in this book with one goal: To make something happen between Linux and OpenVMS.
    No matter if you''re a VMS admin or a Linux admin, this book will allow you to
    enable interoperability between Linux and OpenVMS.


    I can also add that you learn to use the local editors, which are not covered
    in this book. Learn the terminal or Command Line Interface (CLI) editor like "vi"
    for Linux and "edit" for VMS; they are essential to any system manager''s tool
    bag. X Windows-based editors are also available, but if you learn the CLI editor,
    you will be able to work on these systems without a windowing system (or startup
    procedures). After you''ve learned the editors for Linux and OpenVMS, the rest
    of the procedures in this book should be easy to accomplish.


    You may also want to load clean versions of each OS before trying to configure
    the tools in this book. I used OpenVMS version 7.3-1 and RedHat 7.3 for all the
    procedures described in this book. You may want to visit Chapter 2 first to learn
    how to break into Linux and OpenVMS if you''ve inherited your systems, and if
    you need to reuse the existing installations!


    This book is an adventure in Open Source, TCP/IP, X Windows, security, and much
    more. I hope it broadens your understanding of both OpenVMS and Linux and helps
    you to understand what two great OSSs can do together.


    All my best,

    John Robert Wisniewski

    March 2003


    Publisher''s Note: There is considerable variation in the usage of the phrase
    Open Source; the majority view seems to be that both words are capitalized. However,
    others consistently use lower case. We have chosen to follow the most common usage
    and capitalize both words throughout the body of the book.


    ## Chapter 1 — Assessing OpenVMS and Linux: The Right Tool for the Right Job


    **Good, Better, Best**


    Welcome to the book that answers the questions why OpenVMS? Linux? and just how
    you get these two computer operating systems (OSs) to work together?


    Why in the world would you want to have them work together? Let me try to answer
    by briefly saying that there are customers who adore OpenVMS—its cluster technology
    and full-service support. Linux is into Open Source, with tens of thousands of
    coders in their craft. What a wild duet! But still, they’re cousins—open systems
    cousins.


    Now, without singing the rest of the Patty Duke theme music; the operating systems
    have much in common: their network interface protocols; Open Source tools; industry
    standards; commercial databases; X Windows; and industry-standard security tools
    for encryption, tunneling, and secure communications. If general tools are on
    both Linux and OpenVMS, why continue to use two different OSs? Simply because
    OpenVMS has features and abilities that Linux or any other OS would be hard to
    deliver.


    What does OpenVMS have? OpenVMS provides something that you only get with 25 years
    of testing and use—enterprise-class stability and reliability in almost every
    configuration it''s used in.


    What does Linux bring to the table? Today Linux is Open Source, with thousands
    of programmers working on new and exciting applications worldwide, sharing base
    source codes, and delivering low-cost tools and software that improve the entire
    software industry.


    Together, OpenVMS and Linux provide the best of Open Source and the best of commercial
    applications, giving users a choice about how to deploy various computing styles:
    client/server, multitied database servers, or large transaction processing environments.


    Between the high end and the low end of computing, various deployment strategies
    are needed today and will be needed in the future. The line between OpenVMS and
    Linux deployment decisions should be drawn wherever it needs to be.


    Solution architects and system analysts need to understand the best features of
    both operating systems, as well as their realistic limits, and measure the actual
    cost of deployment of Linux and OpenVMS systems, utilizing the best tools for
    the system or work at hand. OpenVMS can run on workstations to mainframes. Linux
    runs on mainframes to workstations, drawing a hard line in the sand that limits
    what will be deployed and limits the types of deployment an organization can decide.
    Why not use the best of both worlds to solving problems? I know do!


    ## OpenVMS?


    After 25 years in a constantly changing computer industry—spanning the PC revolution,
    DEC buying Digital, VMS becoming OpenVMS, Compaq buying out Digital, HP buying
    out Compaq, and OpenVMS migrating from VAX 32-bit CPUs to Alpha 64-bit CPUs, as
    well as HP migrating from OpenVMS to IA64 Intel''s 64-bit CPU, and the advent
    of Microsoft products, Open Source and Linux products, the IBM pantheon of operating
    systems, and fault-tolerant products such as NSK—an industry watcher and career
    participant to ask the following question: Why should companies use OpenVMS over
    the next 5 to 10 years? Considering that OpenVMS has the lowest cost of deployment
    and maintenance in the industry today, you might ask, why wouldn''t you use OpenVMS?
    Lowest cost is one factor, but technology decisions seem to drive many decisions.
    Let''s review OpenVMS''s current abilities.


    - Clustering: OpenVMS has acknowledged the clusters and scaling in the industry
    since 1993. Its features include single system disk, unified file system view
    across all cluster members (even with multiple file systems), shared tapes, shared
    disks, and up to 96 clustered member systems of desktop to mainframe-size systems,
    with as many as 32 SMP CPUs each and as much as 10 Tbytes of main memory (RAM)
    in the entire cluster. All systems are managed as a single system and a single
    work domain. OpenVMS clusters work out of the box across Ethernet, SANs, and high-speed
    memory channel connections, with minimal configuration and setup. You can literally
    add a new member system to an OpenVMS cluster in as little as five minutes (the
    hardware has been plugged in).


    - Disaster-Tolerant Clusters: Data centers can be completely duplicated (all disks,
    all resources, all transactions) in an active-active cluster at distances up to
    540 miles apart. (Note: Everyone else just asks for hot/warm or hot/cold site
    technology; OpenVMS uses both sites in an active-active configuration, which uses
    much less hardware than other active-passive cluster configurations—up to 50 percent!)


    - Oracle 8: This deploys larger, runs better, and runs faster on OpenVMS clusters.
    Oracle Rdb continues to be one of the fastest databases in the world, fully.

