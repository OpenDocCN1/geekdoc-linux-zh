    # E-mail Wants to be Free


    E-mail across OpenVMS and RedHat 7.3 is included with the base distribution at
    no additional charge. OpenVMS adds some additional checking and testing of Open
    Source e-mail (seeing as it writes the TCP/IP stack and ports Mozilla to OpenVMS).
    Linux and OpenVMS can use the same standard tools to send e-mail, trade files,
    share disks, and browse each other’s Web sites. E-mail is usually the first application
    to be established in a network—then, knowing that works, the others are easy.
    Well, at least we know e-mail works.


