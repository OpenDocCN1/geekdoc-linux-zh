  - '[PAGE 21]


    If I know a person''s name (host, domain), by using a telephone book, I can locate
    him or her telephone number (IP address). The same process is used with DNS: If
    you want to find VMSONE.com, but don''t know the IP address, the underlying TCP/IP
    system will resolve the issue.


    So, if I point my Web browser to VMSONE.com (a name that I know and remember),
    the underlying TCP/IP system will query the local DNS server, resolving that name
    into the appropriate IP address, which it uses to connect to VMSONE.com.


    Okay, okay, everything I said is a vast simplification of the entire process.
    I realize this, but you don''t have to have a Ph.D. in TCP/IP to set up your nodes
    and get them on the Internet or your local intranet!


    # Q5: What is my default gateway/address?


    The default gateway number is the address that connects to the other networks
    from your local network. It could be the address to your NAT (there''s that again)
    firewall, proxy server, or the router that connects your LAN to the rest of the
    Internet.


    The simplest way to understand this is to note that you will not be able to communicate
    with any other LAN or network unless you have this number defined. For initial
    setup you don''t want routing enabled from your machine (this would mean your
    system have multiple TCP/IP paths enabled) and you don''t export routing information
    to the entire network unless your current system connects two separate TCP/IP
    networks (instead of a router).


    Your host TCP/IP address? Example: 10.0.0.25


    Subnet mask address? Example: 255.255.255.255


    Your host name and domain? Example: Inxone.vmsone.com


    Your remote DNS server address? Example: 10.0.0.8


    Your LAN gateway address? Example: 10.0.0.1


    With the answer to these five questions (from your network administrator or ISP),
    you should be able to configure TCP/IP on a single network and connect both your
    OpenVMS and Linux systems to the network. Let''s look at the process for configuring
    TCP/IP systems.'
