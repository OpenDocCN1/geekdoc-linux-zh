    # Chapter 6 — Using E-mail with OpenVMS and Linux


    # Back in the Old Days


    Way back in the early 1980s computer users could send e-mail to each other through
    electronic BBSs with ASCII graphics and unencoded binary objects across 1,200-baud
    modems. And (with apologies to SNL''s Old Man) we liked it that way—no matter
    painful it was or how long it took, and we were grateful for the technology!


    By the time I finally switched from the ASCII communications I had used in my
    younger days to the e-mail client/server graphic''s revolution of PCs and workstations,
    I used embedded graphics, attachments, and binary transfer music and video through
    e-mail. I also found (while transferring ASCII e-mail to TK50 tape) that it took
    me 10 years of e-mail correspondence and daily use to have created a scant 1MB
    of data (using English as a communication protocol).


    As I filled and filled the two-thirds loaded floppy disk (after changing my mind
    about the 95MB TK50) with 10 years of e-mail history, I received my first real
    attachment from someone on DEC via the new client/server graphics interface to
    my shiny new DEC 320p laptop computer.


    I marveled that the 12 PowerPoint slides that had attached to the message (the
    text of which was written in MS Word) were 1.5MB of data—they wouldn’t even fit
    on the $10 1.44MB floppy disk I had just filled with the last ten years of history.


    How had I managed without the ability to send graphics to everyone I knew? How
    much more space was needed in the brave new world? The horizons seemed endless
    to, but I knew I was glad that my company was bringing something called StorageWorks
    in the near future.


    # We Used to Copy E-mail 2,400-Baud Modems?


    Even with my corporate e-mail connection to the Net, by the mid-1990s I had been
    using UUCP at home to receive Internet e-mail for over five years. UUCP would
    dial up between my OpenVMS server and UNIX to copy batches of e-mail from Linux,
    UNIX, and other BBS servers until the messages found themselves on a machine they
    were destined for or connected to the real Internet! While Internet gateways were
    expensive, UUCP systems were free. The catch was that UUCP nodes might have 20
    or more hops to find a gateway to the Internet. My worst time sending e-mail was
    a little over eight hours from home to my DEC mailbox; my best time was over 15
    minutes before I switched over to a permanent, instantaneous e-mail connection
    in 1997.'
- md: '

    Today, with e-mail accounts free from the Net and dial-up access costing less
    than $10 per month for people with a PC, most folks consider this type of e-mail
    quaint and old-fashioned. The usefulness of UUCP mail has ebbed; it''s interesting
    to note that the protocol is still used in ham radio (packet)/system-to-system
    e-mail and other places around the world where Internet dial-up (POTS)—plain old
    telephone service—is still not easily obtained.


    # From the Dawn of the Network Era to Today


    In *The Victorian Internet*, Tom Stage describes how the nineteenth-century world
    was shrunken and delivered by a technological communications marvel: the telegraph.
    Tom''s book quotes Samuel Morse''s 1872 poem, "The Victory":


    "And science proclaimed, from some to shore

    That time and space ruled no more."


    If in the last 150 years the telegraph, telephone, and satellites shrank the distance
    across which people could communicate, the Internet and e-mail in the last 15
    years have dwarfed those tools by another factor of 10—simply with compression
    and near universal access. Why make a phone call when a two-line e-mail explains
    what needs to be done? Why have conversations when a single picture will do? Why
    send a picture with a URL points to the common reality of the Web for reference?
    Does anyone send multiple copies of any paper to anyone anymore by fax?


    This is great for productivity, but what that human-to-human contact has kept
    us learning and improving our depth of understanding with mentorship and apprenticeship?
    The jury is still out on how electronic communications will impact how we learn
    and do OJT. Our generation has home offices, digital cell phones, telecommuting,
    the World Wide Web, and cable, so we''ll either be the generation most attached,
    the most plugged-in to our fellow man, or venturing out enough to pay for the
    electricity, protein drinks, and vitamins to keep going.


    Terse, concise, and efficient, for good or bad, these are the qualities e-mail
    has delivered to us as a business tool.


    Of course, if you still want to have a conversation online, you can now use a
    variety of instant messenger programs and gossip your time away, just like the
    telegraph operators were found to spend as much as 50 percent of their free time
    talking, chatting, and gossiping with other operators across the nineteenth-century
    ether (but for those who live online today, 50 percent sounds like a very low
    percentage). Though the technology has changed dramatically, people have changed
    very little in the last 150 years. Many still have that quite human desire to
    simply put down their labors, lean across a backyard fence or gather around an
    office watering hole, and just talk with other people about the events of the
    day.


    # E-mail Programs Come and E-mail Programs Go


    In 1987, when I joined Digital, its mail ALL-IN-1 had about eight million users
    worldwide. ALL-IN-1 had full-text word processing and shared calendar (for resources
    such as conference rooms, demo rooms, etc.) that would also make people''s time
    easier to schedule and keep track of. File exchanges for all the word-processing
    documents of the age, attachments, e-mail lists, and gateways to various other
    mail systems (IBM and the standards of the day).


    Also, ALL-IN-1 ran on OpenVMS clusters (who would want a redundant system anyway)
    and its client/server frontend links are still around. Despite all its technological
    prowess and PC integration, however, Digital chose a new system in 1996. Abandoning
    its ALL-IN-1 roots, DEC chose a hearty mail system—a mail system that could send
    word processing documents, pictures, video, and binaries in e-mail, just like
    every other 20-year-old e-mail system.


    The new e-mail system had the added advantage of being able to run on a Windows
    NT operating system, which, in 1996, everyone knew the only system platform that
    would survive after the Y2K.


    Microsoft Exchange was a lot more expensive than Open Source, standards-based
    e-mail, but then again, Microsoft had much better marketing. The rest was history
    until people began to realize that Exchange costs lots of money to install and
    maintain—Open Source products to be free!


    # Open Source Open Standards Internet Mail


    Open standards all revolve around TCP/IP standards and the Request for Comments
    (RFC) process that controls them. The important thing to note is that current
    e-mail protocols are evolving and continue to add functionality as they improve.
    An end user won''t be worried about these standards, but someone doing the implementation
    for an operating system such as VMS or Linux will. What users will need to know
    is what standards-based e-mail clients they can use from their various client
    platforms and what e-mail servers they can set up to retrieve their mail from
    OpenVMS and Linux servers on their network.


    Internet e-mail applications all basically do the same things, but some have more
    features than others. What features should you look for in a client in e-mail
    system? Character cell or graphic e-mail applications should be the first consideration.
    Programs such as PINE are character-cell based, but can send attachments and run
    on both OpenVMS and Linux as clients. Other programs, such as Mozilla (now Open
    Source from its Netscape roots), also run on both OpenVMS and Linux, but require
    a Windows graphical display to show. Graphical displays give you a What You See
    Is What You Get (WYSIWYG) e-mail window, where the character clients allow you
    to telnet from anywhere in your network and read your mail—at least the portions
    of it!


    Today''s important standards to check for when you configure your e-mail server
    include the following:


    - POP3–Post Office Protocol: If your server supports this, your client can download
    messages from the server.

    - IMAP–Internet Message Access Protocol: If your server supports this, your client
    can access messages and decide whether they are deleted or not.


    The good news is that both OpenVMS and Linux are able to let e-mail clients use
    POP3 or IMAP to access messages. All you have to do is activate e-mails on the
    systems, and the user accounts are integrated into e-mail. Remote e-mail clients
    can then be used to access these standard user accounts via POP3 or IMAP from
    different locations.


