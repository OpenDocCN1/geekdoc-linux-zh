    Both OpenVMS and Linux run Mozilla, now Open Source from its old Netscape roots.
    This means that for the price of a download, you can have not only a world-class
    Web browser but a full graphics and network-based e-mail client for your OpenVMS
    or Linux workstation.


    # Linux Mozilla Installation


    Usually, when you install RedHat 7.3, Mozilla just gets installed automatically.
    But what happens when you want to install an update or haven''t had Mozilla installed
    as part of the base installation?


    Install Mozilla by first downloading the Mozilla kit from www.mozilla.org (see
    Figures 6-37 through 6-49).


    ![](img/a26aae01e7657faca13785a7eb03624a_93_0.png)


    > Figure 6-37 Using the root account (is there another?) save the Mozilla kit
    for Linux in a subdirectory, so you can expand it without filling your default
    directory with various files.'
