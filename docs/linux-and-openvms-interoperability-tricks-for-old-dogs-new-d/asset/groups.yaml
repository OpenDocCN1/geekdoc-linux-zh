    ## Setting up E-mail Clients


    Both OpenVMS and Linux run Mozilla, now from its old Netscape roots. This means
    that for the price of a download, you can have not only world-class browser but
    a full graphics and network-based e-mail client for your OpenVMS or Linux workstation.


    ## Linux Installation


    Usually, when you install RedHat 7, Mozilla gets installed automatically. But
    what happens when you want to install an update or haven''t had Mozilla installed
    as part of base installation? Install Mozilla by first downloading the Mozilla
    kit from www.org (see Figures 6-37 through 6-9)(img/a26aae01e7657faca13785a7eb03624a_93_0.png)
