    your screen.

    * xhost - allows no one in your network to send X Windows displays to your screen.

    * xhost+nodename.com allows just "nodename.com" to send X Windows displays to
    your screen.

    * xhost with no arguments tells you who is authorized to send X Windows displays
    to your screen.


    # OpenVMS Commands: SHOW-SET/DISPLAY AND CREATE/TERMINAL


    In your new DECterm on your Linux box, type the information shown in Figure 5-4.


    +   * Device: WSA4: [super] means this OpenVMS terminal (process) will redirect
    its X Windows output to a graphical display device to accept this.

    * [super] means that all X Windows applications run from this process will be
    displayed to WSA4.

    * [user] would mean that only the next X Windows application run from this process
    would be displayed to WSA4.

    * Node: This is the system where the X Windows server display is located.

    * Transport: This is the networking protocol that is being used.

    * Server: Some systems can have multiple instances of X Windows servers running.
    Zero is the default.'
  - '[PAGE 61]


    ```

    show display


    Device: [super]

    Node: LNXONE.VMSONE.COM

    Transport: TCPIP

    Server: 0

    Screen: 0

    ```


    Figure 5-4 The SHOW DISPLAY command tells where X Windows applications run from
    this window (on the OpenVMS server) will try to display.


    +   - Screen: X Windows server displays can have more than one display screen
    either in software or connected to two or more graphical cards with two or more
    monitors attached. Screens are numbered 0 + to as many graphical heads as the
    server contains.


    All of these parameters can be changed/redirected by issuing


    ```

    SET DISPLAY/CREATE/NODE=node.com/transport=tcpip/screen=0

    ```


    +   - /TRANSPORT=(use TCP/IP if you''ve installed LAT or DECnet in your Linux
    kernel).

    - /EXECUTIVE_MODE (optional) creates an executive mode WSAx: device for all processes
    on your system to use (must have privileges to this).

    - /SUPERVISOR_MODE (optional, default) creates a supervisor mode WSAx: device
    for your current processes (and subprocesses).

    - /USER_MODE (optional) restricts the next command.


    This command will not change running X Windows display from an OpenVMS server,
    but it will change where the output is for all new programs that are run!'
  - '[PAGE 62]


    The CREATE/TERMINAL command on VMS can be added to additional functions.


    +   - DETACH will create a detached background process for the terminal similar
    to the UNIX/Linux command xterm;


    +   - NOPROCESS will make the terminal ask you to log in as a VMS user. It is
    useful if you want to log in as a different user while you''re still logged in
    with your other X Windows terminals.


    +   - BIG_FONT / LITTLE_FONT / CLI / WINDOW ATTRIBUTES and many other details
    about your VMS terminal can be modified as the terminal is created. Be sure to
    check out the OpenVMS help utility HELP CREATE/TERMINAL and create a terminal
    that is just right for you.


    # OpenVMS X Windows Applications


    Let''s look at the X applications that come with OpenVMS when you install X Windows
    (see Figure 5-5).


