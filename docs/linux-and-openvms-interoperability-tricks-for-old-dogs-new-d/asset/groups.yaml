    By the mid-1980s for $500 a development software vendor could develop and TCP/IP
    for its operating system, router, bridge, or tool of choice (licensed from AT&T).
    Other network protocols and vendors didn''t want to license their network to other
    vendors, at least SNA and DECnet saw their network technology as added value and
    a distinct solution instead of just the place Berkeley''s Berkeley Standard Distribution
    (BSD) of UNIX and System V drove UNIX and TCP/IP to colleges and universities
    in the late 1980s and early 1990s, but it was (in my opinion) the low development
    cost, with free licensing and the ability to freely so (at no cost to the vendor)
    redistribute TCP/IP protocols for commercial devices, that won the place TCP/IP
    now ensures.


    And, as the story goes, by 1993 IBM had SNA as a leveraging protocol, DEC had
    DEC/OSI, and all other commercial vendors of networking hardware and software
    were using TCP/IP not because it was better, but because it was free ($500 for
    a development license was as free as it got in the 1980s!). This market transition
    event taught me one immutable fact for our industry: Free beats something that
    costs day of the week in the market place.


