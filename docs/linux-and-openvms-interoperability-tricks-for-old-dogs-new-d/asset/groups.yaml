    # Chapter 8 — Apache VMS and Linux Style


    # You Never Really Forget your First Web Server


    You never really forget your first Web server. It was September, the leaves were
    just starting to turn in New England, and I was at a class about Web servers,
    Internet-business, and Web mastering. The week was much too short and the teachers
    too quick with their information, because there was just so much to cover.


    In 1995 and the hot tool of choice was, of course, Netscape (some might say there
    was a rumor of something called Front Page from the Northwest). The browser wars
    were to be fought, by posturing and rumblings of the battles to come in the air.
    Every OS that worked was claiming to be a Web server.


    I flew from Boston on Friday with a full laptop disk of VMS software, PC Web tools,
    and my most precious cargo—the thing that would proudly me my AlphaServer to 2000
    and share the internal network, was Netscape Commerce Server. It was to be my
    first Web server. SSL, user directory, and fast well—at least able to do 10 to
    20 simultaneous requests. I was pumped about the prospects of building a Web server.


    I got home and created user / Web accounts for every CD-ROM that was on my Inf
    (I think I had 21 CD-ROM drives back then) and served all the OpenVMS, PC, and
    then OpenSource CD-ROMs I had to offer to the internal network. It was a glorious
    few days serving out HTTP and HTTPS tools, disks files, and even PowerPoint slides.
    A complete DECUS library of graphics, history files for DEC CD-going back to the
    1970s.


    I remember going back to my cubical the morning when all the Web data was up and
    walking the pages I had added /HTML/ with my own hands. Later I realized that
    raw HTML code on my workstation was even better than having a spreadsheet when
    my boss Dennis Bashore did a little “management by walking around” in those days!


    I was just so proud when the main Web page hit 100 hits later that month—and quadrupled
    number less than a week after that as the DEC file grabbers religiously copied
    my few paltry gigabytes to their increasing plunder. number 8972: You know you''ve
    been plundering file too long when you start finding YOUR directory structures
    on other sites.'
- md: "\n# Web master flash forward with Apache\n\nI'll never forget that first Web\
    \ server, and today we take Web server tools for granted (and for free), such\
    \ as Apache from Open Source. Some are quick to say that Linux's first killer/breakthrough\
    \ application was Apache moving Linux into many people's minds as the very Web\
    \ server. At one point almost all the Linux boxes being brought up were built\
    \ for the primary purpose of sharing Wide Web pages.\n\nToday 65 percent or more\
    \ of all Web servers are Apache based. RedHat ships Apache with Linux now (although\
    \ you must do at least a minimum configuration, start the Apache Server, and set\
    \ it for startup at startup reboot). OpenVMS engineering also ships an Apache-based\
    \ Web server that's been tested by OpenVMS engineering for commercial support\
    \ and performance.\n\nBoth Web servers are available on the Web at:\n\n```\nhttp://www.apache.org\n\
    http://www.openvms.compaq.com\n```\n\nToday Apache has a lot to recommend it as\
    \ the dominant Web server for Linux and OpenVMS systems. It's easy to install,\
    \ performance is great, it's Open Source (which makes much easier, and all those\
    \ new Open Source features seem to show up in the code base!) And because they\
    \ are the same sources, training to use one gives you a feel for the directory\
    \ structure, configuration files, and other set values that are common with Apache\
    \ running on a variety of platforms.\n\nWhile Web masters over the years had many\
    \ choices, the hardest part of their jobs remains much as it was years ago: finding\
    \ enough content to satisfy the hungry user. Which is the better server for Apache\
    \ Linux or OpenVMS? The answer depends on which applications need to have Apache\
    \ Web interfaces? Old crust FORTRAN or COBOL apps that have been running for 20+\
    \ years can be given a new polished interface with Apache and the World Wide Web.\
    \ Databases, user programs, and even DCL can be Webified with Apache on OpenVMS.\
    \ Linux systems can give every desktop or server any easy, standard Web page tool\
    \ that can give cutting-edge features and e-business storefronts.\n\nWhere do\
    \ you start? Just begin by setting up servers on your systems and joining the\
    \ WWW!\n\n# Linux Apache Web server Installation\n\nFigures 8-1 through 8-24 illustrate\
    \ the Linux Apache Web server installation.\n\n# Apache HTTP Project\n\n# Apache\
    \ SERVER PROJECT\n\n# Essentials\n\n# The Number One HTTP Server on the Internet\n\
    \nThe Apache HTTP Server is an effort to develop and maintain open-source operating\
    \ systems including Unix and Windows NT. The goal of this project is to provide\
    \ a secure, efficient and extensible server that provides HTTP services with the\
    \ current HTTP standards.\n\n- About\n- License\n- FAQ\n- Security\n- Features\n\
    \nApache is the most popular web server on the Internet since April of 1996. The\
    \ 2000 Survey found that 63% of the web sites on the are using Apache making it\
    \ more widely used than all other web server competitors.\n\nThe Apache HTTP Server\
    \ is a project of the Apache Software Foundation.\n\n# Download\n\n- from a mirror\n\
    - from here\n\n# Documentation\n\nHave a question? Read the friendly documentation!\n\
    \n- Apache 1.3\n- Apache 2.0\n\nYou have reached the documentation for Apache\
    \ HTTP Server 2.0. If you were wondering whether you want to upgrade to 2.0 or\
    \ if you want to know how to use it\n\nIf you wish to contribute to the documentation\
    \ (help is always welcome) please see the FAQ page for more info\n\n![](img/a26aae01e7657faca13785a7eb03624a_155_0.png)\n\
    \n# Index of/dist/httpd\n\n# Apache HTTP Source Code Distributions\n\nThis page\
    \ includes only the sources to compile and build Apache yourself with the proper\
    \ tools. Download the precompiled distribution for your platforms from binaries/\n\
    \n# Important Notices\n\n- Download from your nearest mirror site\n- Binary Keys\n\
    - Apache 2.0.45 is the best available version.\n- Apache 1.3.7 is also available.\n\
    - PGP Signatures\n- Official Release\n- Contributed Patches/Modules\n\n| Name\
    \ | Last Modified | Description |\n|---|---|---|\n| binary/ | 15-Aug-2002 11:42\
    \ | Binary distributions |\n| contrib/ | 20-Jan-2002 18:22 | Contributed software\
    \ |\n| flood/ | 27-Sep-2002 13:55 | |\n| libraries/ | 22-Kyr-2002 13:04 | |\n\n\
    Figure 8-2 The binaries are located here binaries for many systems-make sure you\
    \ download the Linux one.\n\nChapter 8 – Apache VMS and Linux Style 157\n\n# Binary\
    \ Releases\n\nAvailable in the binaries/; every binary distribution contains an\
    \ install script. README for details.\n\n## Apache 2.0.43 is the best version.\n\
    \nThis release fixes a security problem identified in CVE-2002-0640 on cve.mitre.org;\
    \ it also fixes bugs from 2.0.42 (and earlier) as well as adding additional capability.\
    \ Users of Apache 2.0.42 and prior are urged to upgrade as soon as possible.\n\
    \nFor details see Official Announcement. Check here to see if any patches or special\
    \ instructions are necessary for adding modules, or for running Apache 2.0.43\
    \ on your platform.\n\nApache add-ons are not compatible with modules or compiled\
    \ for Apache 1.3. If you are running third-party modules, you will need to recompile\
    \ them for Apache 2.0 from that party before you attempt to upgrade from Apache\
    \ 1.3\n\nThe-2.0.43 zip binaries are identical to the last versions; however,\
