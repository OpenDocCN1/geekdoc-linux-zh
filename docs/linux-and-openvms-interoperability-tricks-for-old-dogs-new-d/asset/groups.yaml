    # Chapter 3 — TCP/IP for OpenVMS and Linux


    It seems like a lifetime ago, but I remember having an ongoing argument in 1989
    about which was better: IBM''s SNA protocols, DEC''s DECnet and LAT protocols,
    or the up-and-coming TCP/IP protocols for commercial systems.


    The discussion extended to many customers and many in the local DFTLG user group
    joined the discussion with bars and angry youths sniping the other protocols.
    Async transmission is better than sync transmission—it recovers every and let''s
    use lower-cost lines, peer-to-peer networking is the only way to go, standards
    are the way of the future, mine has more features, your protocol is, and so on.


    In the end, all the arguments missed the point. We were all arguing the technical
    merits of peer-to-peer networking, counting the number of terminals that could
    be supported, or how many danced on the end of a 50-ohm cable. Wasn''t the right
    focus at all, and many people missed the real reason for this change in networking
    technology in a short period of time.


    IBM''s SNA could host tens of thousands of terminals in a single network with
    subsecond response time. DECnet provided peer-to-peer networking with over 100,000
    nodes in a single network (when the Internet had almost 15,000 nodes). Novell
    was fastest for PC disk sharing, and the outdated OSI protocol would unite all
    networks into a single, standards-based world that would correct all the shortcomings
    of past protocols. But all of the technological greatness of these and other protocols
    paled against TCP/IP.


    TCP/IP, by 1993, swept away all the competition in the network protocol world
    for any new applications or networks. TCP/IP crushed OSI''s government mandate
    as a protocol of choice for all new network acquisitions. DEC could skip over
    the TCP/IP revolution if it just had the best OSI protocol stack, because TCP/IP
    was waiting (at the time) technologically and the marketplace would have to use
    OSI to solve its networking problems.


    Instead, TCP/IP spawned network companies such as Cisco and built billion dollar
    software companies as TGV (Two Guys and a VAX) just to write and support a TCP/IP
    stack for OpenVMS. Other companies emerged for TCP/IP to SNA gateways, TCP/IP
    terminal servers, and the whole pantheon of TCP/IP.


    Why did this transition occur? Better applications? Better networking? What was
    it about TCP/IP that made it the winner? It was not that it was necessarily better,
    but that it was free. And in the world of business, free is a very powerful motivator.

