    \n关于哪种更好以及应该采用什么样的计算风格的争论会在讨论组和任何计算机爱好者交流的地方引发。但有一点是明确的：所有的计算风格都将长期存在，操作系统之间的互操作性将是未来所有工作站和服务器的标志。\n\
    \n# 第 6 章 —— 在 OpenVMS 和 Linux 使用电子邮件\n\n## 回过去\n\n在早在 20 世纪 80 年代初，计算机用户可以通过带有\
    \ ASCII 图形和未编码二进制对象的电子 BBS，通过 1200 波调制解调器相互发送电子邮件。而且（向 SNL 的老头道歉）我们喜欢那种方式——无论它是多么痛苦或花费多长时间，我们对这项技术表示感谢！\n\
    \n当我终于从年轻时使用的 ASCII 通信切换到 PC 和工作站的电子邮件客户端/服务器图形革命时，我已通过电子邮件使用嵌入式图形、附件以及二进制传输音乐和视频。我还发现（在将\
