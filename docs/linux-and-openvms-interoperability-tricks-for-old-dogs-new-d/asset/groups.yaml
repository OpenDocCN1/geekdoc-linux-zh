    ## 加密——不仅仅是为了早餐


    当你通信敏感（或非敏感）信息时，你需要加密工具/命令，否则你会面临密码、文件以及任何在网络中移动、复制和重新分发的风险。让我们谈谈 OpenVMS 和 Linux
    系统上常用的加密协议。


    ## SSH (V1 和 V2)


    SSH（或安全外壳）的功能是众为人知的，多年来在 TCP/IP 世界的许多主机之间可用。


    SSH 能够在主机之间创建加密的 SSH 会话。你可以打开加密的 SSH 终端连接到 SSH 服务器。Linux 和 OpenVMS 都可以作为客户端和服务器，允许两个系统进行安全的终端会话。MultiNet
    使用此协议和文件传输应用 SCP 用于 OpenVMS（VMS TCP/IP 一直以来请求 SSH，但它们的注意力被其他 TCP/IP 方向所分散了）。


    在开源和 Linux 世界的其他部分，SSH 通常是操作系统自带的终端或 shell 命令，但它本身并不执行文件传输 (FTP)。额外的应用程序已编写为使用
    SSH 协议进行文件传输，例如用于 OpenVMS 的 MultiNet SCP 以及用于 Linux 和 UNIX 用户的 SFTP。


    HP 的 OpenVMS TCP/IP 服务没有 SSH 能力，但通过添加 MultiNet SSH 产品，SSH 协议与 TCP/IP 服务（HP 的 5.3
    TCP/IP）工作，使得 Linux 和 OpenVMS 之间可以使用 SSH。如果你需要在公有或私有的 Linux 或 OpenVMS 系统之间进行安全的终端访问，且该网络支持交互式终端或
    shell 命令登录，而不是明文交换密码和数据，你就会使用 SSH。


    可以在以下位置找到此类加密应用的软件：


    - 对于 Linux：Linux 标准发行版中的开源软件，或访问 http://www.openssh.org/

    - 对于 OpenVMS：http://www.process.com/ 的 Process 软件 (MultiNet)

    - 对于 HP：OpenVMS V5.3 TCP/IP 服务 http://www.openvms.compaq.com/


    ## SSL


    SSL（安全套接层）自 1996 年以前就已经存在，但它仍然还没有版本 1.0。这并不意味着它没有功能——只是它需要时间成为 V1.0 版本。如果你怀疑 SSL
    的功能，只需在你连接银行账户或在 Web 上尝试购买物品时，检查你常用浏览器底部的锁图标。只要你的锁是关闭的，SSL 被调用！


    SSL 作为加密协议的作用正在不断扩大，新的更复杂的工具和应用程序与其身份机制和通信方式相关。今天，SSL 可以用于 Web、终端会话、文件传输、POP 和
    IMAP，几乎任何使用已知主机端口地址的 TCP/IP 应用也需要对其通信进行加密。当然，SSL 需要一些帮助来完成这些任务，而它现在适用于 OpenVMS
    和 Linux！


    OpenSSL 仅包含一个带有程序和编程接口的工具包。你要么必须修改程序以使用 SSL（如你常用的 Web 浏览器），或者你需要另一个位于标准 TCP/IP
    应用程序和 SSL 之间的工具。


    SSL 作为加密协议的作用正在不断扩大，新的更复杂的工具和应用程序与其身份机制和通信方式相关。今天，SSL 可以用于 Web、终端会话、文件传输、POP 和
    IMAP，几乎任何使用已知主机端口地址的 TCP/IP 应用也需要对其通信进行加密。当然，SSL 需要一些帮助来完成这些任务，而它现在适用于 OpenVMS
    和 Linux！


