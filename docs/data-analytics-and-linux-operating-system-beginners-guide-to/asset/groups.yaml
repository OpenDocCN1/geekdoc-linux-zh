    # 管理


    如果你正在寻找某种形式的“控制面板”，你可以在“系统设置”（System Settings）应用程序中找到网络、打印、键盘、外观等其他管理工具的快捷方式。某些
    Ubuntu 变体使用“设置管理器”或直接称为“设置”来实现相同的目的。


    启动后，将会有指向其他默认配置程序的链接；只需点击你需要的程序，即可通过图形界面（GUI）对选项进行设置。但并非所有的管理操作都能通过 GUI 找到。大多数低级设置只能通过命令行进行，因此，你需要确切知道要输入什么来编辑它们。


    例如，在 Ubuntu 中添加新用户需要使用 `adduser` 命令。通过在命令后加上用户名，终端会提示你输入基本信息和密码。将该新用户设置为管理员可以通过
    `usermod -aG sudo username` 完成。此外，可以使用 `deluser` 删除用户。这些选项在 GUI 中很难找到，但在终端中几秒钟即可完成。


    “任务管理器”或对 Ubuntu 内部运行应用程序的管理也是通过终端完成的。`top` 程序在所有发行版中（大部分）都是预安装的，启动它将显示类似于任务管理器的、当前正在运行的所有进程列表。但默认情况下，进程列表会更新并移动，导致可能难以阅读我们所需的数据。按
    `f` 调出排序列表，用方向键导航到 `PID` 并按 `s` 设置该选项。现在使用 `escape` 返回 `top`，我们现在可以使用向上页（page-up）和向下页（page-down）滚动列表来查看任务。例如，假设我们在“Pidgin”无响应时关闭它。在列表中找到它（或使用上述过滤命令进行搜索）并记住
    PID（进程 ID）数字。按 `q` 退出，然后输入 `kill 4653`，显然要将数字替换为 PID。在任何时候你都可以按 `h` 查看各种操作的键盘快捷键列表。如果
    `top` 难以使用，可以考虑安装 `htop`，它是该程序的“人类可读”版本。它实际上显示了整洁的 ASCII 图表，详细列出 CPU、RAM 和其他使用统计数据。使用
    F3 搜索程序，然后使用 F9 和回车将其杀死。


    对于服务，你可能注意到我们使用 `service` 命令来更改它们的状态。因此，启动 Web 服务器可以使用 `service apache2 start`，通过将
    `start` 替换为 `restart` 来重启，通过将其 替换为 `stop` 来停止。使用 `service --status-all` 查找服务列表。服务是守护进程，或持续运行的后台任务。它们可以收集数据、运行蓝牙和
    Wi-Fi 等服务，或等待用户交互。


    # 安全协议


    Linux 整体关注安全性，这促进了它在企业和服务器环境中的应用。利用安全协议意味着你比其他操作系统更安全，计算机被入侵的概率更低。当然，这需要良好的安全原则，并且始终在网上保持安全。没有密码的计算机几乎没有受到保护。


    一个从 UNIX 引入的特性是文件权限。每个文件都有一组权限——所有者、组和权利权限为 `rw-rw-`。`chown` 命令更改文件的所有者，`chgrp`
    更改组，`chmod` 更改与文件相关的权限。通过输入 `ls -l filename` 可以发现文件或文件夹的权限。`R` 表示读（read），`W` 代表写（write），第三个是
    `X` 表示执行（execute）。这三组分别是所有者、组和其他。所以，我们的示例文件为所有者及其所在组设置了读写权限，但对其他用户只有读取权限。这意味着所有者及其所属的组（最可能是
    sudo 用户）有权访问文件并更改其内容，但网络或电脑上的其他用户只能查看内容而不能编辑。脚本文件需要具有 X 权限才能执行，没有它将无法运行。


    大多数人只需要使用 `chmod` 命令更改他们想要使用的文件的权限。我们使用该命令和一组数字来设置文件的权限。`chmod 777 test.sh` 使该文件对任何地方的所有用户都可读、可写且可执行，因为每个规范（所有者、组、其他）都带有数字
    7。数字决定了实体拥有的权限，计算方式如下：


    - 从数字 0 开始。

    - 加 4 增加可读性。

    - 加 2 增加可写性。

    - 加 1 增加执行性。

    - 剩余的数字决定权限。


    6 代表读/写，但 1 仅可执行。5 代表可读和可执行，但不可更改。在我们的 777 示例中，我们将所有者、组和其他都设置为 7。这并不是特别好的安全性，因为这意味着任何地方的任何人都可以弄那个文件。更保守的权限集是
    775。充分利用安全权限来实现安全计算。


    Linux 内部的安全扩展不仅限于权限。确保你实践良好的安全规范，并在安全方面遵循常识——只安装需要的程序，不要遵循所有的网络建议，不要频繁使用 `sudo`，使用密码，使用加密网络，保持软件更新，加密重要文件，并定期备份。最后的建议是，考虑使用带有
    SELinux 的发行版，它是一个支持 AC 和其他安全策略的模块。


    # 脚本


    Bash 是“编程语言”或终端。当我们输入命令时，我们是在 bash 内执行的。脚本是一系列按顺序执行的 bash 命令列表，这意味着我们可以创建一个命令列表并运行它，以自动化通常需要输入的任务。作为中级和高级
    Linux 管理员，可以使用脚本来减少重复任务的工作量。


    要启动脚本，在 nano 中创建一个文件 `script.sh`。第一行必须是 `#!/bin/bash` 以将其标记为 bash 脚本。为你的第一个脚本输入以下行：


    echo “你的名字是什么？”


    read name


    echo “你好，$name。这是你的当前目录。”


    pwd


    ls


    保存脚本。现在我们需要设置权限允许其运行。使用 `sudo chmod 777 script.sh`，然后用 `./script.sh` 运行脚本。只要你完整复制了脚本，它就会询问你的名字并显示目录和文件。在自己的脚本中进一步扩展这一概念。你也可以运行已安装程序的命令，因此你可以编写一个自动加入域或连接到指定网络的脚本。关闭远程计算机也是一个很好的自动化任务。


    脚本可以手动运行，也可以设置为在特定时间执行。要在用户每次登录时运行特定脚本，从 dash 打开“启动应用程序”程序并以脚本为源创建一个应用。现在每当该用户登录时脚本都会运行。这对于设置某些选项或启动后台服务而不需要用户自己操作有用。


    为特定时间调度任务可以使用 Cron 系统守护进程。它在某些系统中默认安装，但如果没有，可以使用 `sudo apt-get install cron`。使用
    `service cron start` 启动服务并通过 `crontab -e` 创建一个新的 crontab 文件。选择 nano 作为你的文本编辑器。在创建的文件底部，添加包含我们调度任务的新行。格式如下：


    分钟，小时，日，月份，星期，命令


    我们通过这些选项对其格式化以指定运行命令的时间。时间数字从 0 开始，所以小时范围是 0 到 23，分钟是 0 到 59。用星号替换任何选项以指定它将在任何值上运行。注意这些示例：


    ```

    0 12 *** ~/script.sh

    ```


    这将在每天中午 12 点运行主目录下的 script.sh。


