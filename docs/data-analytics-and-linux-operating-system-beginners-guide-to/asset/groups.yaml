    3. 库存和产品分析。通过数据分析，公司可以直看到货架上哪些产品很受欢迎，哪些产品需要除尘并移出商店，腾出宝贵的货架空间。为什么杂货店会将利用率最高的产品放在货架的最顶端和底部？他们知道这些产品总是能畅销，但毛利最高的产品正处于消费者的视线水平。


    联想曾为其客户设计一款新键盘，但未能识别出游戏行业中的忠实客户群。在使用了数据分析后，联想改变了设计以纳入游戏者的需求，并推出了一款带来数百万销售额的优质产品。数据分析拯救了他们的产品并增加了利润。


    数据分析绝不仅限于零售业。其他企业也使用数据分析来提高盈利能力和效率。以下是目前行业正在采用的一些用途：


    ## 旅游与酒店业


    客户满意度很难衡量，但它是企业繁荣的关键。大数据分析让管理层在客户办理入住、决策点甚至离开设施时，能够立即获取客户偏好。这让管理层有机会在问题发生时进行纠正，将潜在的客户关系危机转变为所有相关方都满意的体验。


    ## 医疗保健


    在医疗保健行业，大数据正在改变记录保存、研究分析以及患者护理管理的方式。结果是了一种更好的患者护理方法，通过计算机记录无论患者接受何种治疗都能进行追踪。此外，由于查询的即时信息，有时可以立即获得新的流程或药物。医院的人员配置也通过数据分析发生了转型，允许医疗机构在高峰期安排更多人员，在低峰期安排较少人员。


    ## 政府


    当地警方正在利用数据分析来确定犯罪统计数据最高的区域（这些区域增加更多的步行巡逻将是有益的），甚至是入窃和轻微犯罪的峰时段。分析技术可以在不牺牲有限监控人力的情况下，精确定位市郊区或城市的问题区域。


    中小型企业在收集数据方面与大型机构拥有同样的机会，但记住采取的策略将很有帮助：


    - 要进入消费者的主流市场，企业必须具备数字化形象。寻找服务和产品的客户及访客会去网站和社交媒体寻找意见、报告、比较和评论。


    - 网站应该是简单且诚实的。它还应该在不夸大或误导的情况下描述产品或服务的益处。消费者一眼就能看出炒作，并会刻意避开那些作为潜在信息或产品渠道的网站。网站应该能够提供信息并收集信息。


    - 网站分析将收集客户的人口统计数据、他们的兴趣、进入点、无聊点和“点击退出点”，以及他们喜爱的社交媒体网站。


    - 如果网站设计得当并有许多交互点，客户或顾客会在意识到自己被“挖掘”之前就指明他们的需求和愿望。


    ## 小企业示例


    这里有一个使用大数据的小企业的良好示例：


    当地的一家面包店发现巧克力曲干的销量非常火爆，网站和电话订单都有以打为单位的订单。然而，巧克力杯蛋糕的销售速度变得越来越慢。烘焙师阅读了网站上的评论，发现了这条看似无大害的话：“我非常喜欢巧克力杯蛋糕和巧克力曲干，但我只需花2个巧克力杯蛋糕的就能买到12块巧克力曲干。”


    这一数据成为了烘焙师的“顿然大悟”时刻。烘焙师迅速建立了一个专门销售饼干的页面（以延续巧克力曲干的趋势），并将全尺寸杯蛋糕的产品选择改为迷你杯蛋糕。四个迷你杯蛋糕的价格与一打巧克力曲干相同。烘焙师还在
    Facebook 列表上发布了优惠活动：“提及此广告购买一打各种口味饼干即可免费获得一个任选的迷你杯蛋糕。”所有饼干和新产品的销量都增加了。


    ## 第二章 如何处理大数据


    ## 大数据及其问题


    大数据是指由于规模太大、无组织或非结构化，无法使用目前数据管理中使用的传统技术和手段进行分析的挖掘数据。数据量并没有数据如何使用和分类重要。


    大数据分为三个领域：数量（volume）、速度（velocity）和多样性（variety）。公司被海量数据淹没，需要识别和利用这些数据集的方法。


    无论管理如何使用，大数据对企业或组织来说仍然非常有价值。大数据让信息变得透明且可用。现在组织正在收集更大规模的数据，以数字格式存储的成本比以前使用磁带存储要低得多。管理层利用性能数据来探索病假和员工迟到的趋势、产品库存、流转，甚至是存储容量。其他企业正在使用数据探索预算和采购决策的预测。


    大数据有助于公司细分客户群体，以便他们能够根据客户的需求和愿望定制产品供应。更重要的是，大数据正被研发，以改进下一代服务和产品供应。


    ## 捕捉与掌握大数据


    公司现在必须使用新的存储、计算、收集、分析和技术来捕捉并处理大数据。尽管技术挑战甚至各家公司的优先事项有所不同，但它们面临着相同的问题：旧的计算机系统、不兼容的格式以及数据整合不完整，阻碍了对数据库信息的解读。


    现在有新的方法可以处理数据以协助大数据的质量管理。最好的方法是在做出购买决策之前分析数据的数量、多样性和复杂性。


    大数据在数据库管理系统方面有开源技术，包括 Hadoop 和 Cassandra。市场上还有几种商业智能软件产品，可以向所有主报告、展示和分析最终产品。


    ## 利用大数据进行业务


    据估计，企业只使用了其收到的 5% 的信息。这为改进留下了巨大的空间，可以用大数据分析所需的工具堆栈来填充。列表的开头是存储、计算、可视化软件和分析软件。还需要额外的人员可能可能一个
    IT 部门。


    投资大数据能获得投资回报（ROI）吗？简而言之，是积极的。麦肯锡全球研究院预计，正确利用大数据的企业可以将运营率提高 60% 以上，这是一个巨大的数字。


    以下是建议在组织中实施大数据的步骤：


    - 盘点所有数据资产

    - 推动管理层拥抱数据驱动的世界观

    - 开发技术实施

    - 解决政策问题，包括数据安全、隐私和产权

    - 识别机会和风险

