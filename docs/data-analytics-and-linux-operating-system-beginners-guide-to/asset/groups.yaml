    # Prescriptive Analysis


    Prescriptive analysis is the most valuable analysis because it informs the business
    what steps should be taken to improve the situation. The use of this data can
    be the beginning of change for the organization. Even though it is considered
    the most valuable, it is the least used as 3 percent of the organizations reported
    to use big data. Companies could use prescriptive analysis to give specific insights
    to isolated problems, such as in the health industry and the problem of diabetes
    and obesity. Big data could identify obese patients with both diabetes and high
    cholesterol, three contributing factors in the development of heart disease. Patients
    could be targeted immediately to initiate a four-fold attack on the risk factors
    through diet, diabetes education, exercise encouragement and cholesterol monitoring.
    At present, these are addressed by different specialists, if they are addressed
    at all. Combining treatment strategies would be much more effective and the combination
    of information could be compiled through prescriptive analysis.


    # Predictive Analysis


    Predictive analysis is the prediction of possible scenarios derived from the analysis
    of the information. This is usually in the form of a business forecast. This form
    of analysis looks at the past to foretell the future. For example, the business
    might look at the previous Christmas sales to predict the future Christmas sales
    for a particular product. Predictive analysis is especially useful in marketing
    and sales departments to mimic previous campaigns that were successful. Some businesses
    are using predictive analysis to examine the sales process, from customer introduction,
    communications with the customer, the lead to the customer, the sale to the customer,
    the closing of the sale, and the follow-up communications.


    # Diagnostic Analytics


    Diagnostic analysis focuses on past predicaments to discern the who, what and
    why of a situation. This analysis can use an analytic dashboard, or widgets that
    help the reader see at a glance the information at hand. An example of use of
    diagnostic analytics could be being a sales campaign or a social media marketing
    campaign. With the widgets, one could see the number of posts, the number of visitors,
    the quantity of comments and likes, the page views and the feedback from the customer.
    Seeing these analytics at a glance instead of paging through reports brings a
    faster grasp of the salient points of the data. Utilizing diagnostic analytics
    will explain the failure of a marketing campaign to increase sales of a specific
    product.


    # Descriptive Analytics'
