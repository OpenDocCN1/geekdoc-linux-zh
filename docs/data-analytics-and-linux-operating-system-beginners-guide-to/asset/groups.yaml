    ## 管理硬件与软件


    在 Linux 中，管理硬件实际上比在 Windows 上容易得多。你不需要为每个设备单独下载驱动程序，大多数驱动程序已经内置在操作系统本身中了。这意味着大多数流行设备只需安装，无需进行任何额外步骤即可使用。打印机、网络设备、硬盘和其他常见设备都包含在内；在
    Linux 上通常不需要费心调整驱动程序。


    然而，强大的显卡和其他特定硬件需要该公司的专有驱动程序才能发挥全部性能。因为尽管你的显卡在 Linux 下默认可以工作，但其内部的秘密且往往被隐藏的技术只有通过该公司的软件才能被充分利用。在
    Ubuntu 上，这个过程非常简单——打开“附加驱动”（additional drivers）应用程序，让系统为你搜索。在确定你是否拥有这些设备后，它会询问你想使用哪个版本的驱动。按照屏幕上的提示启用第三方驱动。对于任何未出现的设备，可以在制造商网站上进行互联网搜索，确定他们是否发布了你可以下载的特定
    Linux 驱动。


    软件是 Linux 优于 Windows 的另一个方面。类似于苹果电脑，Ubuntu 也有一类应用程序，你可以在其中搜索与你的设备兼容的应用程序库，只需点击几次即可下载并安装。只需搜索“Ubuntu软件中心”（Ubuntu
    Software Center）图标即可打开该程序。从那里，你可以浏览“游戏”、“办公”或“系统”等单独分类的程序列表，也可以直接通过名称搜索。找到程序后，点击它，然后点击“安装”将下载加入队列。身份验证后，软件将自动下载并安装。之后，可以在启动栏中搜索来找到该应用程序。


    安装软件的另一种方法是通过终端，但我们稍后会讨论这一点。Ubuntu 并不完全限于应用商店中的软件，因为从互联网下载的程序也可以安装。同样，我们将在讨论终端后再次提到这个主题。


    总的来说，在 Ubuntu 中管理硬件和软件是非常毫不费力的。无论是安装新硬件设备还是下载流行程序，Linux 发行版都让你的计算体验毫无故障。这并不是说
    Linux 完全是为初学者设计的，因为正如我们将学的，Linux 绝对是高级用户和经验管理员的绝佳选择。


    ## 命令行 / 终端


    在现代计算机出现之前，硬件和软件完全通过键盘进行交互。鼠标引入了图形界面并简化了流程，但许多功能仍然保持纯文本形式，以便向终端用户呈现复杂的选项。在 Linux
    中，这一过程延续到了今天。大多数发行版都存在 GUI（图形界面），但每个 Linux 发行版也内置了一个基于文本的界面，可以在其中输入并执行强大的命令。将终端想象成功能得强大的命令行提示符，因为你可以完全仅通过终端来使用你的计算机。拥有足够的知识，用户实际上可以通过文本浏览互联网、安装程序、管理文件系统等。


    通过从启动栏（dash）启动或使用 `Ctrl+Alt+T` 快捷键来启动终端。一个紫色窗口将打开并等待你的输入。你可以输入命令并按回车键激活它。对于我们的第一个命令，输入
    `ls`。它是 list（列表）的缩写，将显示当前目录下的所有文件。你可以看到 Home（Ubuntu 的主用户文件夹）中的文件和文件夹。如果你迷路了，可以随时输入
    `pwd` 来打印工作目录并显示你当前浏览的文件夹名称。在你学习命令时，将它们写下来有助于更好地记忆它们的用法。


    ## 管理目录


    目录（文件夹的另一个名称）的工作方式与其他操作系统相同。文件夹存放文件，你必须当前访问某个目录才能与其中的文件进行交互。你可以使用终端命令 `cd` 来更改目录并在文件系统中移动。例如，从
    Home 文件夹输入 `cd Desktop` 将带你跳转到该文件夹。现在使用 `ls` 将不会显示任何内容（除非你在桌面添加了文件）。要返回上，输入 `cd
    ..`。练习这种方式在文件系统中导航；`cd` 进入一个目录并使用 `ls` 查看文件。


    由于你输入的是命令，Linux 期望你的输入是精确的。如果你拼错了命令，它将根本无法运行；如果你输入的文件夹或文件名错误，它将尝试引用一个不存在的对象。在使用终端时请仔细检查你的输入。


    打开文件使用一个不同的命令——`./`。点用于启动指定的文件，所以如果你尝试打开一张图片，可以这样操作：`./image.png`。点和斜杠都是必要的，因为它们表示你正在当前目录下运行一个文件。当你运行一个文件时，它将用分配给该文件类型的默认应用程序打开，因此对于图片，它可能会在图像查看器中打开。


    你还可以通过终端创建和删除目录及文件。在此示例中导航到 Home 目录。作为快捷键，你可以输入 `cd ~` 将目录更改到你的 Home，因为波浪键 `~`
    是“当前用户主目录”的缩写。使用 `mkdir` 命令创建一个目录；输入 `mkdir Programming` 创建一个名为该的新文件夹。你可以 `cd`
    进入它，也可以进入 GUI 进入它以证明你确实创建了一个新文件夹。现在通过回到 Home 并输入 `rmdir Programming` 删除该目录。Linux
    将毫不犹豫删除指定的目录。同样，使用 `rm` 将删除指定的文件。


    Linux 有许多用户并不习惯的设计哲学。在 Windows 和 OSX 中，事物通常是被隐藏的，但 Linux 给你完全的控制权。这可能是危险的，但这也是
    Linux 强大之处所在。


    ## Apt


    Apt（高级软件包工具）是与管理 Ubuntu 应用程序相关的命令。其他发行版可能有它们自己的工具，但 apt 因其庞大的存储库和简单的命令而被广泛使用。使用
    `apt-get install` 格式安装软件包，你只需指定要安装的程序名称。在示例中，我们通过包名 `chromium-browser` 指定了 Chromium
    程序。由于你不知道每个包名，还有另一个命令 `apt-cache search` 可用于定位与所提供字符串匹配的包名。因此，`apt-cache search
    chromium` 将显示 `chromium-browser`，你可以指定正确的名称进行安装。


    apt 的用处远不止于，因为你可以使用几条命令来更新系统中的每一个应用程序。使用 `apt-get update` 刷新存储库，然后使用 `apt-get
    upgrade` 让每个应用程序本身更新到最新版本。Windows OS 用户应该对这种简单的流程感到羡慕，因为更新 Windows 需要卸载并重新安装最新版本。


    随着时间的推移，你可能需要更新 Ubuntu 版本。每年都会有一个新版本，并且可以通过 `apt-get dist-upgrade` 进行安装。保持最新状态可以确保你的
    Linux 系统在很一段时间内运行良好。


