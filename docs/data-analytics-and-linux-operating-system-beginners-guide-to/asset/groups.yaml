- md: '

    ## Managing Hardware and Software


    Hardware in Linux is actually much easier to manage hardware than on Windows.
    Instead of downloading individual drivers for devices, most of the drivers are
    built-in to the OS itself. This means that most popular devices can simply be
    installed with no further steps involved before they are usable. Printers, networks,
    hard drives, and other common devices are included; fiddling with drivers is not
    usually needed on Linux.


    However, powerful graphics cards and other specific hardware will need proprietary
    drivers from that company to function to full efficiency. Because although your
    graphics card works by default with Linux, the secret and often hidden technology
    within can only be fully utilized with that company’s software. On Ubuntu the
    process is straightforward—open the “additional drivers” application and let the
    OS search for you. After determining whether you have the devices, it will ask
    which version of the driver to use. Follow any on-screen prompts to enable the
    3rd party drivers. For any devices that do not appear, Internet research on the
    manufacturer’s website to determine whether they released a specific Linux driver
    that you can download.


    Software is another aspect of Linux that excels over Windows. Much like an Apple
    computer, Ubuntu has an app of sorts from which you can search through repositories
    of applications that are compatible with your device to download and install with
    just a few clicks. Just search for the “Ubuntu Software Center” dash to open the
    application. From there you can browse individual categories such as “Games”,
    “Office”, or “System” for a list of programs, or you can search directly by name.
    After finding a program, click on it and then queue the download by clicking “install”.
    After authenticating yourself the software will automatically download and install.
    From there, the application can be found by searching for it in the dash.


    Another method of installing software is available through the terminal, but we
    will discuss that later. Ubuntu is not totally limited to software found in the
    app store, because programs downloaded from the Internet can also be installed.
    Once again, we will touch on that subject after discussing the terminal.


    Overall, managing hardware and software in Ubuntu is effortless. Whether installing
    a new hardware device or downloading a popular program, Linux distributions make
    your computing experience trouble-free. That is not to say that Linux is wholly
    meant for beginners, because as we will learn Linux is definitely a great choice
    for power users and experienced admins.


    ## The Command Line / Terminal


    Before modern computers, hardware and software were interfaced by using keyboards
    exclusively. The mouse brought graphical interfaces and simplified the process,
    but many functions remained text-only as to present complicated options to end
    users. In Linux, this process continues today. There exists the GUI that is present
    on most distributions, but every Linux distro also has a built-in text-based interface
    as well, from which powerful commands can be typed and executed. Think of the
    terminal as a much more powerful command prompt, because you can completely use
    your computer exclusively through the terminal alone. With enough knowledge, a
    user can actually browse the Internet, install programs, manage their file system,
    and more through text.


    Begin the terminal by launching it from dash or by using the Ctrl+Alt+T shortcut.
    A purple window will open and wait for your input. You can type a command and
    press enter to activate it. For our first command, enter “ls”. This is short for
    list, and it will display all of the files within our current directory. You will
    be able to see the files and folders in Home, Ubuntu’s main user folder. If you
    are lost, you can always type in “pwd” to print the working directory and display
    the name of the folder you are currently browsing. As you learn commands, it helps
    to write them down to better internalize their use.


    ## Managing Directories


    Directories, another name for folders, work the same as they do in other operating
    systems. Folders hold files, and you must be currently accessing a directory in
    order to interact with the files inside of it. You can use the terminal command
    “cd” to change directory and move about the file system. As an example, typing
    “cd Desktop” from the Home folder will transfer you to that folder. Now using
    “ls” will not show anything (unless you added files to the desktop). To back out,
    type “cd ..”. Practice navigating around the file system in this fashion; cd into
    a directory and ls to view the files.


    Because you are typing commands, Linux expects your input to be exact. If you
    misspell a command it will simply not work, and if you type a folder or file incorrectly
    it will try to reference something that does not exist. Watch your input carefully
    when using the terminal.


    Opening a file is done with a different command—“./”. The period is used to start
    the specified file, so if you were attempting to open a picture it could be done
    like so: “./image.png”. Both the period and the slash are necessary, as it denotes
    that you are running a file within the current directory. When you run a file
    it will be opened with the default application assigned to the file type, so in
    the case of a picture it will most likely be opened in an image viewer.


    You can also create and remove directories and files through terminal. For this
    example navigate to the Home directory. As a shortcut you can type “cd ~” to change
    the directory to your Home, because the tilde key is short for “the current user’s
    home”. Make a directory with the “mkdir” command; type, “mkdir Programming” to
    create a new folder with that title. You can CD into it, or you can go to the
    GUI and enter it to prove that you indeed created a new folder. Now remove that
    directory by going Home and typing “rmdir Programming”. Without hesitation, Linux
    will remove the specified directory. Similarly, using “rm” will remove the specified
    file.


    Linux has a design philosophy that many users are not used to. In Windows and
    OSX, things are often hidden, but Linux gives you total control. This can be dangerous,
    but it is also what makes Linux powerful. In Windows and OSX, things are often
    hidden, but Linux gives you total control. This can be dangerous, but it is also
    what makes Linux powerful.


    ## Apt


    Apt (advanced packaging tool) is the command associated with managing applications
    in Ubuntu. Other distributions may their own tool, but apt is commonly used for
    its large repositories and simple commands. Packages are installed with the “apt-get
    install” formatting, where you specify the name of the program you wish to install.
    In the example we specify the Chromium program with the package name “chromium-browser”.
    Given that you do not know every package name, there is another command “apt-cache
    search” that can be used to locate package names matching the supplied string.
    So “apt-cache search chromium” would show “chromium-browser”, and you could specify
    the correct name to install.


    The usefulness of apt extends beyond that, as you can use it to update every single
    application on your system with a few commands. Use “apt-get update” to refresh
    the repository, then use “apt-get upgrade” to have every application itself to
    the latest version. Windows OS users should be envious at this easy process, because
    updating a Windows requires uninstalling and reinstalling with the newest version.


    As time goes by, you might need to update the Ubuntu version. Every year there
    is a new release, and it can be installed with “apt-get dist-upgrade”. Staying
    up to date with the newest fixes and ensures your Linux system will be working
    healthy for a long time.

