    essentially a lightweight Linux browser meant for online use. Google has this
    OS preinstalled on their ChromeBooks, which have lower specifications than other
    laptops. But the OS is really only a full screen Chrome browser, so the OS is
    perfect for users wanting an uncomplicated experience or a dedicated Internet
    machine.


    +   - Tiny Core – An OS measured in megabytes, Tiny Core is for antique computers
    or embedded devices. This OS is mostly for intermediate users that have a hobby
    project or dedicated purpose in mind.


    +   - Damn Small Linux – Another minimal Linux variant, this OS is best for quick
    access to a Linux command line.


    +   - openSUSE – This is a distribution for experienced computer users. With many
    tools for administrators and program developers, openSUSE is the best OS for users
    confident in their skills.


    Positively the number of operating systems based off of the Linux kernel is astounding.
    With a huge amount of choices, you might be confused as to where to start and
    how to install it. When in doubt (and as we will demonstrate shortly), install
    Ubuntu or one of its variants. The OS is great for beginners and makes the Linux
    transition smoother. But as you increase in skill and wish to learn more about
    Linux, you can always install another operating system.'
- md: '

    # Booting Into Linux


    If you are ready to take the plunge into a Linux-based distribution, the first
    thing you must is back up your files. Overwriting the OS on your hard drive will
    erase any data contained within, meaning you must back up any pictures, music
    or files you wish to keep after the transition. Use an external hard drive, or
    an online data storage site (such as Google Drive) to temporarily hold your files.
    We are not responsible for you losing something important, back it up!


    Next we will need to choose an OS. This book will use Ubuntu 16.04 as an example,
    and it is recommended you do the same. Navigate to Canonical''s official website
    (http://www.ubuntu.com) and acquire a copy of the OS. You will download the image
    from the site to your computer.


    Next we need to obtain an installation media. This can be a DVD, a USB drive,
    an SD card, or any other writable media that your computer can read. The only
    restriction is that the device must be able to hold an image as large as the OS
    download, so 4GB should be suffice. Remove everything from the drive, as it will
    also be formatted.


    Download a tool for writing the image file. For DVDs install Imgburn, and for
    flash media download Rufus (https://rufus.akeo.io/). The most common method of
    OS installation is to use a 4GB USB drive, and it is more recommended. Insert
    your media, start the appropriate program, select the OS image that was downloaded,
    and begin the writing process. It will take some time, as the image needs to be
    made bootable on the media. When it is finished, you can shut down your computer
    fully.


    This is the point to make double sure you are ready to install Linux. Check that
    your files are backed up, understand that you will be erasing your current OS,
    and preferably have a Windows/OSX install disc handy in case you decide to switch
    back. If you are indeed ready to switch, continue.


    With the installation media still inserted, turn on your computer. The first screen
    that you see is the BIOS / UEFI POST screen, and it will give you a keyboard button
    that you should press to enter setup. This screen shows every pay attention to
    it. Press the indicated key to enter the BIOS setup. If you are too slow, the
    screen will disappear and your usual OS will begin to load. If this happens, simply
    shut the computer back down and try again.


    Once within the BIOS / UEFI, you will have to navigate to the “boot order” settings.
    Every computer’s BIOS / UEFI is slightly different, so we cannot explain the process
    in detail. But generally you can follow prompts at the bottom of the screen to
    understand how to navigate. After arriving at the boot order settings, place your
    boot medium at the top of the list. As an example, if you used a USB drive, then
    you would see its name and have to bring it to the top of the list. These settings
    control the order in which the PC searches for operating systems. With our boot
    medium at the top of the list, it will boot into our downloaded Linux instead
    of our usual OS. Save your settings and restart the computer. If everything was
    done correctly the computer will begin to boot into Ubuntu.


    But if something goes wrong, try troubleshooting with these tips:


    - Primary OS boots instead of Linux – You probably did not save the settings with
    your alternate boot medium at the top of the list. The PC is still defaulting
    to the internal HDD to boot.

    - “No boot media found” – Did you “drag and drop” your Linux image onto the media
    instead of writing it? Without explicitly telling the computer it is bootable,
    it will not know what to do with the data files on the media. Alternatively, you
    could have a corrupted download, or an incomplete write. Try downloading the image
    again and making another installation.

    - Kernel Panic” – Something is wrong with the boot process. See above for the
    possibility of a corrupted installation. Otherwise, the image you are trying to
    install may not be compatible with your hardware. IF you see any error messages,
    do an Internet search on them. For prebuilt computers and laptops, search for
    the model name and Linux to find other user’s experiences. Finally, you might
    have attempted to install a 64-bit image on a 32-bit computer. With your next
    image download, specifically select a 32-bit image.

    - Problem reading data from CD-ROM...” – Try using a different install medium,
    because some distributions no longer support CD and DVD installations. USB drives
    are recommended.

    - PC seems to boot, but there is nothing at all on the screen – If you are using
    a dedicated graphics card (compared to integrated GFX from the CPU), Linux might
    not be recognizing it completely. Plug your monitor into the motherboard directly
    instead of the card.


    But most of those problems are rare or simply to user error. Linux has high compatibility
    and is relatively easy to install/use the initial installation. The typical user
    will have Ubuntu boot successfully at this point, and they will be presented with
    a working computing environment.


    The desktop you see is referred to as a “Live CD”, which is pretty much a demonstration
    of the OS and how it works. You have not actually installed the OS to your hard
    drive yet, as it is still running directly from your boot media. It is a chance
    to test out Linux without actually removing your primary OS, so take the opportunity
    to explore how Linux distributions work.


    # Ubuntu Basics


    Similar to Windows, Ubuntu has a desktop graphical user interface. Applications
    open Windows that can be maximized, minimized, closed, and moved around with the
    top bar. Ubuntu also has a “task bar” of sorts that functions much like its Windows
    counterpart-icons resemble programs that can be launched by clicking on them.
    The “Windows Button” (called the Dash Button) on the task bar is used to open
    a search functionality from which you can type in the name of a program or file
    on your computer to quickly start it.


    Besides a few nominal differences Ubuntu functions is a very familiar way. In
    fact, many of the programs that you may already use on other operating systems,
    such as Firefox, are available and sometimes preinstalled on Linux distributions.
    With enough experimentation and practice, you will be able to navigate the GUI
    of Ubuntu as if you were a professional. Continue exploring the system, and continue
    if you are ready to replace your main operating system with this Linux one.


    # Installing Linux


    On the desktop, you will see an “Install Ubuntu 16.04 LTS” icon. Double clicking
    it will launch an application that makes installation very easy. If you are not
    connected to the Internet, do so now by plugging in an Ethernet cord or connecting
    to Wi-Fi from the top right icon. Select your language and click “continue”. The
    next prompt will ask whether you would like to download updates and install third-party
    software during the OS installation. These options are highly recommended for
    beginners, so check them and click “continue”.


    The application will move on to another screen asking for your install method.
    There are various options, such as erasing the disk altogether, installing alongside
    your primary OS, or updating a previous version of Linux. Select an option that
    works best for you. If you are hesitant about making a full switch, elect to install
    Ubuntu as your secondary OS. That option will allow you to choose which OS to
    boot into after the BIOS screen. Nevertheless, select your option and click “install
    now”.


    While Ubuntu installs, you can specify a few other options, such as your time
    zone, computer name, account name, and password. The entire installation should
    not take too long, but it will take long enough that your computer should be plugged
    in (if it is a laptop). After finishing, the OS will require a reboot. Congratulations,
    you now have a usable Linux system on your computer. Throughout the next chapters
    in this publication we will focus on Linux concepts, how to achieve certain tasks,
    and how to further your knowledge of your system.

    '
