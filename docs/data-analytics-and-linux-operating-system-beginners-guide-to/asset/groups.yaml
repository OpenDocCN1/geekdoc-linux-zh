    # 启动进入 Linux


    如果你已经准备好投入 Linux 发行版，你必须做的第一件事就是备份你的文件。覆盖硬盘上的操作系统将擦除其中包含的所有数据，这意味着你必须在转换后备份任何你想要保留的图片、音乐或文件。请使用外部硬盘或在线数据存储网站（如
    Google Drive）来临时存放你的文件。我们对你丢失重要信息概负责，请务必备份！


    接下来，我们需要选择一个操作系统。本书将使用 Ubuntu 16.04 作为示例，也建议你也这样做。访问 Canonical 的官方网站（http://www.ubuntu.com）并获取该操作系统的副本。你将从该网站下载镜像到你的电脑。


    接下来，我们需要获取安装介质。这可以是 DVD、USB 驱动器、SD 卡或你的电脑可以读取的任何可写介质。唯一的限制是设备必须能够容纳与下载的镜像等大的文件，因此
    4GB 的空间应该足够了。请删除驱动器上的所有内容，因为它也将被格式化。


    下载一个用于写入镜像文件的工具。对于 DVD，安装 Imgburn；对于闪存介质，下载 Rufus（https://rufus.akeo.io/）。最常用的操作系统安装方法是使用
    4GB USB 驱动器，而且更推荐这样做。插入你的介质，启动相应的程序，选择下载好的操作系统镜像，并开始写入过程。这需要一些时间，因为镜像需要在介质上被制作成可启动状态。完成后，你可以完全关闭电脑。


    现在是双重确认你已准备好安装 Linux 的时候了。检查文件是否已备份，理解你将擦除当前的操作系统，并且最好手头留有一个 Windows/OSX 安装光盘，以防你决定切换回来。如果你确实准备好切换了，请继续。


    在安装介质仍然插入的情况下，打开电脑。你看到的第一个屏幕是 BIOS / UEFI POST 屏幕，它会提示你应该按下哪个键盘按键来进入设置。此屏幕会显示每一个细节，请务必注意。按下指定的键进入
    BIOS 设置。如果你操作太慢，屏幕将会消失，你原来的操作系统将开始加载。如果发生这种情况，只需关掉电脑并重试即可。


    一旦进入 BIOS / UEFI，你必须导航到“启动顺序（boot order）”设置。每台电脑的 BIOS / UEFI 都略有不同，因此我们无法详细解释该过程。但通常情况下，你可以按照屏幕底部的提示了解如何导航。到达启动顺序设置后，将你的启动介质置于列表顶部。例如，如果你使用了
    USB 驱动器，你将看到它的名称并必须将其移至列表顶部。这些设置控制 PC 搜索操作系统的顺序。将我们的启动介质置于列表顶部，它将启动我们下载的 Linux
    而不是原来的操作系统。保存设置并重启电脑。如果一切操作正确，电脑将开始启动进入 Ubuntu。


    但如果出现问题，请尝试通过以下提示进行故障排除：


    -   启动了主操作系统而非 Linux – 你可能没有保存将备用启动介质置于顶部的设置。PC 仍然默认从内部硬盘启动。

    -   “未找到启动介质（No boot media found）” – 你是否直接将 Linux 镜像“拖放”到介质上，而不是写入它？如果不显式地告诉电脑它是可启动的，它将不知道如何处理介质上的数据文件。或者，可能是下载的文件损坏或写入不完整。尝试重新下载镜像并再次进行安装。

    -   “内核恐慌（Kernel Panic）” – 启动过程出现问题。请参见上文关于安装损坏的可能性。否则，你尝试安装的镜像可能与你的硬件不兼容。如果你看到任何错误信息，请在互联网上搜索这些信息。对于预装电脑和笔记本电脑，搜索型号名称和
    Linux 以查找其他用户的经验。最后，你可能尝试在 32 位的电脑上安装 64 位镜像。在下次下载镜像时，请特意选择 32 位镜像。

    -   “从 CD-ROM 读取数据出现问题（Problem reading data from CD-ROM...） – 尝试使用不同的安装介质，因为某些发行版不再支持
    CD 和 DVD 安装。推荐使用 USB 驱动器。

    -   PC 似乎启动了，但屏幕上空无所有 – 如果你使用的是独立显卡（相对于 CPU 的集成显卡），Linux 可能无法完全识别它。请将显示器直接插在主板而非显卡上。


    但大多数此类问题都是罕见的，或者仅仅是用户操作错误。Linux 具有很高的兼容性，且初始安装/使用相对简单。典型用户到此时应该已经成功启动 Ubuntu，并获得一个可用的计算环境。


    你看到的桌面被称为“现场光盘（Live CD）”，这基本上是操作系统及其工作方式的演示。你尚未实际将操作系统安装到硬盘上，因为它仍在直接从你的启动介质运行。这是一个在不实际移除主操作系统的情况下测试
    Linux 的机会，所以请利用此机会探索 Linux 发行版是如何工作的。


    # Ubuntu 基础


    与 Windows 类似，Ubuntu 拥有桌面图形用户界面。应用程序打开的窗口可以通过顶栏进行最大化、最小化、关闭和移动。Ubuntu 也有某种类似于“任务栏”，其功能与
    Windows 的对应部分相似——图标代表点击即可启动的程序。任务栏上的“Windows 按钮”（称为 Dash 按钮）用于打开搜索功能，你可以在其中输入电脑上程序或文件的名称来快速启动它们。除了细微的差异，Ubuntu
    的运行方式非常熟悉。事实上，许多你可能在其他操作系统使用的程序（如 Firefox）在 Linux 上都是可用的，有时甚至是预装的。通过实验和练习，你能够像专业人士一样操作
    Ubuntu 界面。继续探索系统，如果你准备好用它替换主操作系统，请继续。


    # 安装 Linux


    在桌面上，你会看到“安装 Ubuntu 16.04 LTS”图标。双击它将启动一个让安装变得非常简单的应用程序。如果你没有连接互联网，请现在通过插入以太线或从右上角连接
    Wi-Fi。选择你的语言并点击“继续”。下一个提示将询问你是否要在安装操作系统期间下载更新并安装第三方软件。这些选项对初学者来说非常有帮助，请勾选它们并点击“继续”。


    在 Ubuntu 安装期间，你可以指定其他选项，例如时区、电脑名称、帐户名称和密码。整个安装过程不会花费太长时间，但长到足以让你的电脑插通电源（如果是笔记本电脑）。完成后，操作系统将需要重启。恭喜，你现在电脑上有了一个可用的
    Linux 系统。


    '
