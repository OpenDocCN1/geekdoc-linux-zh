    ## An Example of Effectual Usage


    A famous mid-sized business owner found $400,000 by using Data Analytics. It seems
    that he had lost track 1,000 items of inventory, which was impeding his most desired
    cash-flow. The first day that he started his inventory, he saw the product that
    had not moved from the shelves.


    He initiated a warehouse sale and sold the entire stock in one weekend, increasing
    his cash flow by $400,000. This than paid for the implementation of the new database
    and peripherals. With the quick and decisive move to sell the new-found inventory,
    the company has utilized their data in a positive fashion with immediate results.


    Previously this company had no IT department and did not have a POS system that
    traced product aging. Had money molding on the shelves. Once the database system
    installed, he was able to reduce older inventory by 40%, in addition to changing
    price points that were overblown, supplier costs, and profit margins. He also
    cleaned the customer base with updated information, saving a substantial sum on
    postage and printing costs. With his new information, he can target the purchasers
    of the product to upgrade their sales rather than broadcasting mail to uninterested
    households. This company also uses their data to offer special discounts to their
    loyal and top customers, which generates income through upelling.


    ## Chapter 5 The Different Types of Data Analytics


    Big data is is such a buzzword there is a misconception of what it is and what
    it does. The uses of Big Data are tremendous: fraud detection, competitive analysis,
    consumer preference analysis, traffic management, call center optimization, managing
    utility power grids, and managing warehouse and inventory, just to name only a
    few. Big data itself is problematic because it is the business intelligence code
    word for data overload.


    There are three V''s of Big data:


    1. Too much data, or volume

    2. Too much speed; the data is moving so quickly it cannot be analyzed, or velocity

    3. Too much information from many sources, or variety.


    Even though the collection and assimilation of big data is daunting, the business
    intelligence that is derived from big data can aid a business immensely.


    ## Four Kinds of Big Data Business Intelligence


    There are four kinds of big data business intelligence that are particularly helpful
    for business owners:


    1. Prescriptive

    2. Predictive

    3. Diagnostic

    4. Descriptive


    ## Prescriptive Analysis


    Prescriptive analysis is the most valuable analysis because it informs the business
    what steps should be taken to improve the situation. The use of this data can
    be the beginning of change for the organization. Even though it is considered
    the most valuable, it is the least used as 3 percent of the organizations reported
    to use big data. Companies could use prescriptive analysis to give specific insights
    to isolated problems, such as in the health industry and the problem of diabetes
    and obesity. Big data could identify obese patients with both diabetes and high
    cholesterol, three contributing factors in the development of heart disease. Patients
    could be targeted immediately to initiate a four-fold attack on the risk factors
    through diet, diabetes education, exercise encouragement and cholesterol monitoring.
    At present, these are addressed by different specialists, if they are addressed
    at all. Combining treatment strategies would be much more effective and the combination
    of information could be compiled through prescriptive analysis.


    ## Predictive Analysis


    Predictive analysis is the prediction of possible scenarios derived from the analysis
    of the information. This is usually in the form of a business forecast. This form
    of analysis looks at the past to foretell the future. For example, the business
    might look at the previous Christmas sales to predict the future Christmas sales
    for a particular product. Predictive analysis is especially useful in marketing
    and sales departments to mimic previous campaigns that were successful. Some businesses
    are using predictive analysis to examine the sales process, from customer introduction,
    communications with the customer, the lead to the customer, the sale to the customer,
    the closing of the sale, and the follow-up communications.


    ## Diagnostic Analytics


    Diagnostic analysis focuses on past predicaments to discern the who, what and
    why of a situation. This analysis can use an analytic dashboard, or widgets that
    help the reader see at a glance the information at hand. An example of use of
    diagnostic analytics could be being a sales campaign or a social media marketing
    campaign. With the widgets, one could see the number of posts, the number of visitors,
    the quantity of comments and the page views. Using these analytics will take all
    the chaos out of the data.


    ## Descriptive Analytics


    Descriptive analytics gives real-time data on the current situation. Instead of
    giving last week''s or even yesterday''s, this information is happening now. An
    example of the usage of descriptive analytics is pulling the credit report for
    a customer desiring to purchase a new car.


    ## Chapter 6 They all Work Together: Data Management, Data Mining, Data Integration
    and Data Warehousing


    The terms for Big Data are many; this section of the book identifies the most
    useful terminology when addressing the logistics of big data.


    **Data management.** Data management is the process of placing restrictions on
    the access and quality of data that flows in and through an organization. Restrictions
    may include limited access, security measures to prevent viruses and corrupted
    data, and maintenance issues.


    **Data mining.** Data mining is the process of sifting through the data to extract
    patterns and relevant information to solve the current issues in the business.
    Using software, data mining will take all the chaos out of the voluminous data.


