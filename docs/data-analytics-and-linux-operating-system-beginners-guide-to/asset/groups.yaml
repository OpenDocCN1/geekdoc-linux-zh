    only a partial assessment; they give no information about the "why" of customer
    rating. Was the customer unhappy because of the product inventory on the shelf,
    a detail about the product, a problem with the atmosphere or in store, the location
    of the store, etc?


    Likewise, when counting specific instances of a behavior, did the counter include
    those who exhibited only partial behaviors (those that hit "like" but did not
    comment on Facebook, for example)?


    Qualitative data can impart particular knowledge that is not available in quantitative
    data, such as why a sales campaign is working, or how the campaign is culturally
    conflicting with the customer base. In 1962, Chevrolet was puzzled why their new
    "Nova" was so popular in the United States but had almost no sales in Mexico.
    Researchers failed to translate the word "Nova" into Spanish, which means "no
    go." The Spanish vernacular for the name of the car was "doesn''t run." No sales
    were down in Mexico! The automobile was renamed to Caribe and sales increased.)


    It is often helpful to evaluate both qualitative and quantitative data sets.


    # What are the steps to collecting and analyzing data?


    +   - Clearly design and define the measurements that are required to answer the
    questions.

    - Conduct the research for the needed period of time in the correct timeframe.

    - Organize the data dependent on the function of the data; how will you use the
    information?

    - If possible and appropriate, change qualitative data into quantitative data.

    - Use graphs and visualization charts (examples are in Chapter 10) to make the
    data easier to assimilate.

    - Visually inspect the patterns of information to identify trends and connections.

    - Seek patterns in the qualitative data, just like the quantitative data. If people
    consistently refer to problems, these may be crucial to understanding the problem
    and a workable solution.


    Interpret the findings by using one of the following categories:


    +   - Your marketing plan is performing on target with no obvious problems.

    - Your marketing plan had no significant effect on sales.'
  - '[PAGE 34]


    +   - Your marketing plan had a negative effect on sales. (Possibly it was offensive
    or deemed silly by consumers.)


    +   - Your marketing plan had mixed results. The promoted product sold well but
    a previously popular product may have decreased sales. For example, Secret deodorant
    offered a new scent category that was very popular but the unscented product sales
    decreased significantly as loyal users just swapped their preferences.


    +   - If the analysis shows your marketing program is working you have a simple
    choice of continuing the program or tweaking it to hopefully increase sales.


    +   - If analysis shows the program isn''t working, interpretation is more convoluted.
    What is missing from the equation? What factor is preventing the desired results?


    Analyzing and interpreting the results brings you full circle in the process;
    now you can use the knowledge you''ve gain to adjust your business and improve
    your service. Continuing to analyze and evaluate the business goals and results
    will keep the business current and an effective presence in the marketplace.'
  - '[PAGE 35]


    # Chapter 8 An Organizational Approach to Data Analytics


    This chapter discusses the framework that needs to be in place in the organization
    that incorporates big data into the corporate culture. A workable analytics governance
    will enable the business to utilize big data for an edge over the competition.


    # The Framework


    To integrate information technology, business intelligence, and analytics four
    dominant questions must be under consideration:


    +   1. Are analytics a key component of the business, in the same categories as
    finance, sales, product development,

    research and marketing?

    2. Are the appropriate personnel in place?

    3. Do the personnel have the ability for deep knowledge of the business needs?

    4. Is there a governance structure in place?


    This framework is referred to as the CSPG framework.


    +   - Culture

    - Does the business revolve around the data analytics or does analytics take a
    backseat to

    marketing, R&D, and sales?'
  - '[PAGE 36]


    +   - Staffing


    +   - Is there adequate staffing and is hiring of qualified staff a priority?
    Does the IT department work on a shoestring budget or do they have the proper
    resources to conduct big data analysis?


    +   - Processes


    +   - If the analytics process is completed correctly, data can be traded with
    like organizations without fear of contamination, allowing multiple streams of
    information.


    +   - Governance


    +   - Governance is a new concept for businesses that have come recently to the
    table of data analytics. The governance needs a structure that encompasses people,
    structure, and salaries that the IT department is not out of variance with the
    other departments.


    # Placement of the Analytics Function in the Business


    There are three models for placement of the Data Analytics function:


    +   1. Placing the analytics department in a central unit. The advantage of this
    location is that it is easy to obtain data, integration into the company culture
    is simpler, and the data retrieval is faster. The challenge for a centralized
    department can be the location (as an add-on department it may be located away
    from the hub of decision makers), there may be confusion as to whom the department
    reports, and the data analysts may be so far away from the corporate culture that
    they cannot anticipate the business needs.


    The second possibility is to decentralize the analytics and place analysts in
    each department throughout the company. This allows the analysts to focus on the
    business sector in which they reside. The challenge is to work together on company-wide
    projects that are not segmented and need all the analysts focused on one problem
    set.


    +   2. The third option is a mix of the two previous scenarios. This places the
    analysts in a centralized location but also'
  - '[PAGE 37]


    deploys analysts throughout the organization. This requires a very large staff
    of analysts, which may be the biggest challenge for the business.


    # The Key Analytics


    Analytics is composed of models, infrastructure and operations. The models are
    statistical or predictive or dataming that are originated from statistical data.
    Key to the analytics process is the building of the models, which is usually performed
    by the analysts or data scientists or statisticians.


    Infrastructure is the software components, applications used and platforms utilized
    for data management, data processing and decision making. The processes connected
    to analytics infrastructure are data management, model deployment and multiple
    analytics that must be incorporated in the business operations.


    Operation are the processes that create the data used for models and actions for
    business use. Data can be purchased, internal, external, or collaborative.


    The Data Analytics team must identify the internal and external relevant data,
    manage the data, buil the analytical models and introduce the models into the
    internal systems. Most businesses organize these functions thusly: The business
    department requests the model, the Analytics team constructs the model, the IT
    department supplies the raw data, and operations launches the model. This brings
    us to the why of analytics governance.


    # Analytics Governance


    The three challenges that businesses face when extracting big data are:


    +   1. Identifying the unique needs for which the data will be used'
  - '[PAGE 38]


    +   2. Obtaining the needed information


    +   3. Deploying the analytics models into the organization


    The analytics manager must have enough authority to negate these challenges. The
    structure of governance needs a mechanism for identification, communications and
    resolution of issues stemming from data analysis problems. The analytics manager
    also needs the flexibility to hire qualified and knowledgeable personnel.'
