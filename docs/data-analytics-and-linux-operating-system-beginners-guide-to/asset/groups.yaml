    3. Inventory and product analysis. Using data analysis, a company can see what
    is popular on the shelves and what products need dusting off and moved out of
    the store and off the valuable shelf space. Why do grocers place the most utilized
    products on the very top and very bottom shelves? They know those products will
    always sell but the products with the highest markup are at eye-level for the
    consumer.


    Lenovo was designing a new keyboard for their customers, but failed to recognize
    their loyal customer base in the gaming industry. After using data analytics,
    Lenovo changed their design to incorporate the gamers'' needs and launched a worthy
    product that brought millions in sales. Data analytics saved their product and
    increased their profits.


    Data analytics is by no means limited to the retail sector. Other businesses use
    data analytics to increase their profitability and efficiency. Here are a few
    uses that are currently being adopted by industries:


    ## Travel and Hospitality


    Customer satisfaction is very hard to measure but the key to a thriving enterprise.
    Big data analytics give the management instant access to customer preferences
    as they check-in, at customer decision points, and even as they leave the facility.
    This gives management the opportunity to rectify grievances as they occur, turning
    a potential customer relations bomb into a satisfactory experience for all parties
    concerned.


    ## Health Care


    In the health care industry, big data is changing the way records are kept, research
    is analyzed, and patient care is managed. The result is a better method of caring
    for the patient with a computerized record that can follow the patient no matter
    treatment is given. In addition, sometimes a new procedure or medicine is available
    immediately because of the instantaneous information of a query. Staffing for
    hospitals has been transformed also with data analysis, allowing the care facilities
    to schedule more personnel in the peak times and less for the slower times.


    ## Government


    Local police forces are using data analytics to determine the areas with the greatest
    crime statistics, where more foot patrols would be advantageous, and even the
    peak times for burglaries and petty crimes. The technology of analysis can pinpoint
    the problem areas in a suburb or city without sacrificing the limited manpower
    for surveillance.


    Small and mid-size businesses have the same opportunities for collecting data
    as large factions, but it will be helpful to keep in mind their strategies:


    - To tap into the mainstream of consumers there must be a digital presence for
    the business. Customers and clients that are shopping for services and products
    go to websites and Social Media for opinions, reports, comparisons and reviews.


    - The website should be straightforward and honest. It should also describe the
    benefits of the product or service without exaggeration or misrepresentation.
    Consumers know hype when they see it, and will studiously avoid those websites
    as potential outlets of information or products. The website should be enabled
    to give information and collect information.


    - Website analytics will gather the demographics of the customer, their interests,
    their entry point, their boredom and "click off" point, and their favorite social
    media sites.


    - If the website is designed correctly with many points of interaction, the client
    or customer will specify their needs and wants before they realize they have been
    ''mined''.


    ## Small Business Example


    Here is a good example of a small business that used big data:


    A local bakery finds the chocolate chip cookie sales are booming, with orders
    by the dozen on both the website and from call-in orders. The chocolate cupcakes,
    however, become slower and slower to move. The baker reads the remarks on the
    website and finds this innocuous remark: "I love the chocolate cupcakes and the
    chocolate chip cookies, but I can buy 12 chocolate chip cookies for the price
    of only 2 cupcakes."


    This data became an "aha" moment for the baker. The baker quickly made a separate
    page for just cookie sales (to continue the chocolate chip cookie trend), but
    also changes the product offering of full-sized cupcakes to mini-cupcakes. Four
    mini-cupcakes were priced the same as the chocolate chip cookies by the dozen.
    The baker also placed a coupon special on the Facebook listing of "buy one dozen
    assorted cookies and receive a free mini-cupcake of your choice, by mentioning
    this ad." Sales of all cookies and the new product increased.


    ## Chapter 2 How to Handle Big Data


    ## Big Data and Its Issues


    Big data is the data mined that is too large, disorganized or unstructured for
    an analysis using the traditional technology and techniques currently used in
    data management. The quantity of data is less important than the how the data
    is used and categorized.


    Big data is divided by three sectors: volume, velocity and variety. Companies
    are inundated with huge amounts of data and need ways to identify and utilize
    the data sets.


    Regardless of the management uses, big data is still very valuable for a business
    or organization. Big data makes information transparent and usable. Now that organizations
    are collecting larger amounts of data, it is much less expensive to store in digital
    formatting than it ever was by tape. Management uses performance data to explore
    trends in sick days and employee tardiness, product inventory, movement, and even
    storage capacity. Other businesses are using data to explore forecasting for budgets
    and purchasing decisions.


    Big data aids companies in segmenting their customer base so that they can tailor
    the product offerings to the customer needs and desires. More importantly, big
    data is being utilized in Research and Development to improve the next generation
    of service and product offerings.


    ## Grabbing and Grasping Big Data


    Companies now have to use new storage, computing, collecting, analysis and techniques
    to capture and crunch the big data. Even though the technology challenges and
    even the priorities of individual firms are different, they all have the same
    issues: older computer systems, incompatible formats, and incomplete integration
    of data that inhibits the interpretation of the database information.


    There are new approaches available for crunching the data to assist with quality
    management of big data. The best approach analyze the volume, variety and complexity
    of the data before making purchasing decisions.


    Big data has open source technologies for the database management systems, including
    Hadoop and Cassandra. There are also several business intelligence software products
    on the market that report, present and analyze the finished product to the business
    owner.


    ## Utilizing Big Data for Business


    It is estimated that businesses use only 5 percent of the information they receive.
    This leaves a big space for improvement, which may be filled with the technological
    stack of implements needed for Big data analysis. There is a requirement of storage,
    computing, visualization software and analytical software, to start the list.
    There will the need for additional personnel and probably an IT department.


    Does investing in big data payoff in the ROI? In a nutshell, positively. The McKinsey
    Global Institute anticipates that a business that correctly utilizes big data
    could increase the operating margin by over 60 percent, a huge sum.


    Here are the steps suggested to implement big data in your organization:


    - Inventory all data related assets

    - Move the management to embrace a data-driven worldview

    - Develop technology implementation

    - Address policy issues including data security, privacy and property

    - Identify opportunities and risks


    Data security is of particular importance. Databases contain confidential information
    that may be trade secrets, personal medical information, and even copyrighted
    materials. Data should be centralized and secure. Encryption is not an option
    due to the large amounts of data and the time and personnel that would be required
    to continue such a practice. Protection of the database begins with the first
    step mentioned, inventory all sources of input. Only when the scope of the contributing
    sources is analyzed can businesses determine which security measures need revamping
    and which particular products will take care of the job.

