- md: '

    # Administration


    If you are looking for a “Control Panel” of sorts, you can find shortcuts to administrative
    tools such as network, printing, keyboard, appearance, and more from within the
    “System Settings” application. Some Ubuntu variants use “Settings Manager” or
    just “Settings” for the same purpose.


    After launching it there will be links to other default configuration applications;
    just click on whichever you need to obtain a GUI for settings a a few options.
    But not everything administrative is found through the GUI. Most low-level settings
    are only available through the command line, and as such you will need to know
    exactly what to type to edit them.


    As an example, adding a new user to Ubuntu requires the “adduser” command. By
    following the command with a username, the terminal will prompt for basic information
    and a password. Setting that new user to be an administrator is done with “usermod
    -aG sudo username”. Moreover a user can be deleted with “deluser”. These options
    are difficult to find through GUI but can be done in seconds with a terminal.


    “Task Manager”, or the administration of running applications within Ubuntu is
    done through the terminal as well. The program “top” is squarely installed on
    all distributions (mostly), and starting it displays a list of all currently running
    processes as per task manager. By default though, the list of processes will be
    updated and moving around in a way that it might be difficult to read the data
    we need. Press the “f” to bring up a sorting list, navigate to “PID” with the
    arrow keys and press “s” to set that option. Now use escape to return to top and
    we can now scroll through the list with page-up and page-down to view the tasks.
    Say, for instance, we want to close the “Pidgin” when it is unresponsive. Find
    it in the list (or search for it with the above filtering commands) and take note
    of the PID (Process ID) number. Press “q” to quit, then type “kill 4653” obviously
    replacing the number with the PID. At any time within you can press “h” to see
    a list of keyboard shortcuts for various actions. If top is difficult to use consider
    installing “htop”, a “human readable” version of the program. It actually shows
    neat ASCII graphs detailing CPU, RAM, and other usage statistics. Search for a
    program with F3, then use F9 and Enter to kill it.


    As for services, you might have noticed we use the “service” command to change
    their status. So starting a web server would be done with “service apache2 start”,
    restarting it by replacing start with restart, and stopping it by replacing start
    with stop. Finding a list of services is done with “service --status-all”. Services
    are daemons, or background tasks that are continuously running. They can be gathering
    data, running a service such as Bluetooth and Wi-Fi, or waiting for user interaction.


    # Security Protocols


    Linux has a focus on security in general, which contributes to its use in corporate
    and server settings. Taking advantage of the security protocols means that you
    are more secure than other operating systems and less likely to have your computer
    compromised. This requires good security principals, of course, and always being
    safe online. A computer without a password is hardly protected at all.


    One feature brought over from UNIX is file permissions. Every file has a set of
    permission - rw-rw- for the owner, group, and rights. The command “chown” changes
    the owner of a file, “chgrp” changes the group, and “chmod” changes the rights
    associated with the file. Discovering them permissions of a file or folder is
    done by typing “ls -l filename”. “R” means read, “W” stands for write, and the
    third online is “X” for execute. The three sets are respectively owner, group,
    and other. So our example file has read and write permissions set for the owner
    and its group, but only read permissions for other users. This means that the
    owner and the group he belongs to (most likely sudo users) have permission to
    access the file and change its contents, but other users on network or PC can
    only view the contents and not edit it. Script files will need to have the X to
    be executed, and without it cannot be run.


    Most people will only need to use the “chmod” command to change the permissions
    of files they wish to use. We use the command and a set of numbers to set the
    permission of the file. “chmod 777 test.sh” makes the file readable, writable,
    and executable by all users anywhere because each specification (owner, group,
    other) has the number 7 attached to it. Numbers determine the permissions that
    entity has, and the number is calculated like so:


    - Start with the number 0.

    - Add 4 for adding readability.

    - Add 2 for write-ability.

    - Add 1 for executable-ness.

    - The number you have left determines the permissions.


    6 would be read/write, but 1 would only be executable. 5 would be readable and
    executable, but not changeable. In our 777 example, we set owner, group, and others
    to all be 7. This is not particularly good security, because that means anybody
    anywhere can mess with that file. A more conservative permission set would be
    775. Use security permissions advantageously for secure computing.


    Security within Linux expands beyond just permissions. Ensure that you practice
    good security practices, and that you are following common sense in regards to
    security- install only needed programs, do not follow all internet advice, do
    not use sudo too often, use passwords, use encrypted networks, keep software up
    to date, encrypt important files, and make regular backups. As a final word of
    advice, look into using a distribution with SELinux, a module that supports AC
    and other security policies.


    # Scripting


    Bash is the “programming language” or the terminal. When we type a command, we
    are doing so within bash. A script is a list of bash commands that execute in
    order, meaning we can create a script with a list of commands and run it to save
    time or automate terminal tasks that we normally have to type. As an intermediate
    and advanced Linux administrator, you can use scripts to greatly shorten the amount
    of work required for repetitive or constantly running tasks.


    To start a script, create a new file “script.sh” within nano. The first line must
    always be “#!/bin/bash” to mark it as a bash script. Type the following lines
    for your first script.


    echo “What is your name?”


    read name


    echo “Hey, $name. Here is your current directory, followed by the files.”


    pwd


    ls


    Save the script. Now we have to set the permissions to allow it to run. Use "sudo
    chmod 777 script.sh", and then run the script with "./script.sh". So long as you
    copied the script exactly, it will ask for your name and show you your directory
    and files. Take the concept and expand it further in your own scripts. You can
    run commands from installed programs as well, so you can write a script that automatically
    joins a domain, or one that connects to the network specified. Shutting down remote
    computers is a great automatic task as well.


    Scripts can either be run manually or set to execute at certain times. To run
    a certain script every time the user logs in, open the "startup applications"
    program from dash and create a new app with the script as the source. Now every
    time that user logs in the script will run automatically. This is useful for setting
    up certain options or starting background services without requiring the user
    to do it themselves.


    Scheduling tasks for a certain time can be done with the Cron system daemon. It
    is installed by default on some systems, but if not "sudo apt-get install cron"
    can be used. Start the service with "service cron start" and create a new crontab
    file with "crontab -e". Select nano as your text editor. At the bottom of the
    created file, add a new line with our scheduled task. The format goes as follows:


    minute, hour, day, month, weekday, command


    And we format it with these options to specify when to run the command. Time numbers
    start with 0, so the hours range from 0 to 23 and minutes are from 0 to 59. Replace
    any option with an asterisk to specify that it will run on any value. Pay attention
    to these examples:


    ```

    0 12 *** ~/script.sh

    ```


    This will run the script.sh found in the Home directory every day at noon.

    '
