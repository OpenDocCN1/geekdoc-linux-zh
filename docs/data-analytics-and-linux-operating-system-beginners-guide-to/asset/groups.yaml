    # 第9章 数据可视化


    可视化让数据对读者而言栩生起来。信息列表在尝试将其转换为可用的数据时可能会非常困难；将数据组转换为易于管理的形式，对于帮助读者区分重要信息和无关信息至关重要。


    使用图形设计软件可以吸引人们对关键数据的关注，通过使用视觉图像，可以发现其他情况下无法检测到的隐藏模式和联系。


    以下是一些可以在网络上轻松访问的免费数据可视化软件列表：


    ### Chart.js


    http://www.chartjs.org/


    该程序提供了 6 种不同的 HTML5 图形，它是最流行的小型图表程序之一。


    ### Dygraphs


    dygraphs.com/


    这是一个可自定义的 JavaScript 图表工具，适用于几乎所有的浏览器，用于处理密集数据集。它对移动设备和平板友好。


    ### FusionCharts


    www.fusioncharts.com/


    FusionCharts Suite XT 提供了 90 多种图表、965 种数据地图以及可自定义的交互式业务仪表板。FusionCharts 适用于 AJAX
    应用程序并可以使用 JavaScript API 使用。


    ### Instant Atlas


    [www.instantatlas.com/]


    Instant Atlas 将统计数据与地图数据相结合，这在人口统计信息方面非常有用。


    ### Raw


    [raw.densitydesign.org/]


    Raw 是可自定义且可修改的，可以从应用程序上传到计算机，导出为 SVG 或 PNG，可以嵌入网页中，并提供基于向量的图像。


    ### Tableau


    [www.tableau.com/]


    Tableau 允许用户拖放数据以立即更新为实时图表。


    ### Timeline


    https://timeline.knightlab.com/


    Timeline 对事件进行详细分析，并提供点击能力，以打开图表获取更具体的信息。


    ### Visual.ly


    [visual.ly/]


    Visual.ly 是一个画廊工具和一个信息图工具。通过 Visual.ly，人们可以构建出惊艳且易于创建的数据表示。


    ### Visualize Free


    https://visualizefree.com/


    Visualize Free 允许你上传自己的数据集并构建 HTML5 交互式图表进行可视化。


    ### ZingChart


    https://www.zingchart.com/


    ZingChart 是另一个 JavaScript 图表程序，具有交互式 Flash 和 HTML5 图表，为你的数据分析提供超过 100 种选择。


    # 第10章 使用社交媒体


    Domo 发布了 2015 年社交媒体用户统计信息图。以下是显示用户现象级增长的统计数据。


    **仅仅在一分钟内，**


    - BuzzFeed 流媒体了 34,000 多张照片

    - Instagram 展示了 170 万多照片

    - Netflix 流媒体了 80,000 小时视频

    - Vine 流媒体了 1,000,000 小时视频

    - YouTube 上传了 300 小时的视频

    - Facebook 帖子拥有超过 410 万个赞（这不等同于帖子数量，因为并不是每个人都会花时间去）

    - Twitter 有 347,000 条从未睡眠的推文


    *来源：Domo，《数据永不睡眠》*


    显然，社交媒体现在是触达消费者的主要参与者。社交媒体与业务实践的成功整合只能增强客户开发的机会。对于企业来说，搜索他们的产品以找到解决棘手故障排除问题的答案是明智的。


    零售相关业务经常被忽视的信息源是 YouTube 视频。客户经常提供演示操作方法的视频，而这些视频在产品用户手册中是找不到的。有时，常见问题（FAQ）编写者会被鲜为人知的产品故障所困扰。如果分析师参与数据挖掘，YouTube
    可能会有作为解决方案的答案。


    # 社交媒体分析


    社交媒体分析是使用从博客和社交媒体网站收集的信息，使业务更成功、更具可见性。拥有网络存在是吸引年轻一代客户的关键。30 岁以下的购买者中有81% 使用互联网来影响他们的购买。与这些购买者的连接点对于业务的增长和发展至关重要。


    社交媒体分析涉及数据挖掘、网站信息分析、数据收集以及利用信息进行业务预测和产品塑造的实践。社交媒体分析的主要用途是评估客户反应，以支持营销进展和客户服务决策。社交分析的第二个主要用途是通过维护网络上的存在感来获得竞争优势。社交媒体分析的第三种用途是衡量客户对产品或服务的态度。社交媒体分析的第四种用途是通过提供仅限网络资源和折扣来增强产品。社交媒体分析的第五种用途是生产违背逻辑（例如跑步者拉出跑步鞋的内里，因为这会让他们的脚太热）但消费者想要的产品。


    社交媒体分析与任何其他数据分析类似，但有特定的考虑需求，如下：


    ### 形成假设


    社交媒体分析更多是关于为什么发生了什么，而不是报告事件本身。从一种情况甚至从一个关于“为什么”的问题开始分析。为什么读者参与了这个问题，但没有回应 Facebook
    或 Twitter 上的类似调查？检查你的发布频率和时间。它们对你的品牌或产品是最优的吗？例如，如果分析师参与数据挖掘，YouTube 可能会有作为解决方案的答案。


    '
