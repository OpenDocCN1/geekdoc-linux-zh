    # Chapter 1: The Importance of Data Analytics and Why Your Business Should Use
    it


    Data analytics is the buzzword of the decade. Everyone is discussing and promoting
    data analytics from healthcare to big business. Small business and mega-corporations
    are touting the advantages of using Big Data to transform their practices. Warehouses,
    trucking companies and suppliers are raving about the money they have saved using
    Data Mining to overhaul their organizations. Or is it hype or is it the new Casino,
    offering cash at every pull of the machine handle?


    Data analytics (DA) is the process of interpreting raw data for the purpose of
    informing the individual (or group) conclusions derived from the data. Data analytics
    are used throughout industry to make business decisions on inventory, cash flow,
    sales projections, customer characteristics, and loss-prevention strategies, just
    to name only a few. In science, data analytics are used to prove and develop theories.


    The concept of business analytics and big data has been around since the 1950s
    to predict insights and trends in the consumer markets. The difference between
    data collection sixty years ago and today is that today''s information set is
    almost in real time. Today businesses can receive the information in minutes or
    less to make an immediate business decision. This gives companies that use data
    analysis a competitive edge over a company that does not.


    - 1. Cost reduction for data storage. In 1981 it cost $700,000 to save 1GB of
    information. In 1996 that cost was $295.00 and in 2014 that same storage cost
    was only $00.03. (source: http://www.mkom.com/cost-per-gigabyte-update)


    - 2. Opportunity for real data for R&D. Customers are now very vocal about their
    wants and needs. A new product launch on Twitter can determine quickly the interest
    in an innovative product design. Data analysis allows immediate feedback for research
    and development of market trends.

