    # 本书预览


    你是否想过使用数据分析来支持你的业务？


    对于许多企业来说，数据分析可能只是增加了负担。它是一个观察运营情况的绝佳系统，你可以通过它收集信息形成结论。但它是如何运作的？它的细微之处何在？这，正是本书的用武之地。


    在书中，你将学习到以下内容：


    - 什么是数据分析

    - 大数据的重要性

    - 如何进行数据分析

    - 为什么业务现在及未来为了成功繁荣需要它


