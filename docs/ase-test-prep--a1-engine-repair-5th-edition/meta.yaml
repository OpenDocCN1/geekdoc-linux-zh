  md: '21. The customer complains of a thump and vibration when accelerating from
    a stop. Which of the following is the most likely cause for the condition?


    +   A. Out of balance tire

    B. Broken or weak motor mount

    C. Spark plug misfire

    D. A warped brake rotor


    ![](bbox=[0.8, 0.08, 0.88, 0.145])


    Answer A is incorrect. A vibration from an out of balance tire would be felt while
    the car is moving, not when accelerating from a stop.


    **Answer B is correct.** A broken or weak motor mount will allow the engine to
    shift under acceleration, causing a thump and a vibration when accelerating from
    a stop.


    Answer C is incorrect. A spark plug misfire can cause a vibration but not a thump
    on acceleration.


    Answer D is incorrect. A warped brake rotor will cause a vibration when stopping,
    not when starting.


