    **17.** The technician has done a compression test on an engine and found cylinders
    #1 and #3 to have low compression. What would be the next test he should do in
    his diagnosis?


    A. Power balance test

    B. Cylinder leakage test

    C. Wet compression test

    D. Dynamic compression test


    Answer A is incorrect. A power balance test would not be done. He is looking for
    a mechanical failure, not an ignition or fuel failure.


    Answer B is incorrect. A cylinder leakage test may need to be done but it is not
    the next test.


    Answer C is correct. A wet compression test will indicate whether the loss of
    compression is through the rings or somewhere else.


    Answer D is incorrect. A dynamic compression test checks for proper breathing
    in an operating engine and would not be the next test.


    **18.** Technician A says a hydraulic lifter in a pushrod engine may pump up during
    very high RPM operation. Technician B says this may cause bent valves. Who is
    correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    Answer C is correct. Both Technicians are correct. During high RPM operation in
    a pushrod engine, the lifter may pump up and hold the valve open due to slight
    amounts of lash in the valve train. When this happens, the valve may be held open
    and hit by the piston; at the very least, the engine will stall.


    Answer D is incorrect. Both Technicians are correct.'
