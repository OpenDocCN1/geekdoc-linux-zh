    rod eye inside the piston, making sure that the parts are oriented correctly.
    Most pistons have a notch or arrow in their crown that must point toward the front
    of the engine. Connecting rod orientation varies according to the engine manufacturer.
    Refer to notes made during disassembly or check the service manual for information.
    On engines with free-floating wrist pins, dip the pin in engine oil and install
    it in its bore. Install new circlips or snaprings. When installing press-fit wrist
    pins, many manufacturers recommend that the rod eye be heated before pin installation.
    Some manufacturers recommend that the piston be heated in a piston heater as well.
