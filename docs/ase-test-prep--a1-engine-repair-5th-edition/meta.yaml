  md: '37. Technician A says the plug wires on a failed ignition coil pack must be
    checked for defects. Technician B says most coil packs are considered waste spark
    systems. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. An open plug wire may cause
    the coil pack to internally arc to the primary winding, causing failure of the
    coil and possibly the module. Most coil packs are waste spark systems in that
    they fire two spark plugs at one time, one for ignition and one for waste spark
    on the exhaust stroke.


    Answer D is incorrect. Both Technicians are correct.


    TASK E.6


    ![](bbox=[0.815, 0.097, 0.928, 0.171])


    38. Technician A says that when adjusting valves on an engine with mechanical
    adjustment, the piston must be at BDC on the exhaust stroke. Technician B says
    some mechanical valve adjustment is done by changing removable lash pads on a
    bucket. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. When mechanically adjusting valves, it must be done with
    the piston at TDC compression stroke to ensure all valves for that cylinder are
    closed.


    **Answer B is correct.** Only Technician B is correct. Some engines'' camshafts
    may act on a lash pad and bucket assembly, which directly contacts the valve tip.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    TASK B.12


    ![](bbox=[0.815, 0.425, 0.928, 0.5])


    39. The engine cranks but will not start. Which of the following is not a requirement
    for the engine to start and run?

    A. Compression

    B. Oil pressure

    C. Fuel pressure

    D. Spark


    Answer A is incorrect. Compression is required for an engine to start.


    **Answer B is correct.** Oil pressure is developed when the engine starts running.


    Answer C is incorrect. Fuel pressure and delivery is required for an engine to
    start.


    Answer D is incorrect. Spark is required to ignite the fuel.


    TASK A.2


    ![](bbox=[0.815, 0.754, 0.928, 0.829])'
