  md: '9. A sweet smell and white smoke in the exhaust of a vehicle with a catalytic
    converter can be an indication of:


    A. A lean fuel mixture.

    B. Coolant leaking into the combustion chamber.

    C. A rich fuel mixture.

    D. A vacuum leak.


    Answer A is incorrect. A lean fuel mixture would not cause a sweet smell.


    **Answer B is correct.** Coolant leaking into the combustion chamber would cause
    white exhaust color with a sweet smell.


    Answer C is incorrect. A rich fuel mixture could cause a strong sulfur smell from
    the exhaust as the extra fuel is burned in the converter.


    Answer D is incorrect. A vacuum leak would cause a rough idle that would decrease
    as engine speed increases.


    ![](bbox=[0.05, 0.05, 0.16, 0.16])


