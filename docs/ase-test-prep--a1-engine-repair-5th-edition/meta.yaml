    journal is worn. Excess side clearance results in an excessive amount of oil on
    the cylinder walls and can contribute to oil consumption.


    # 13. Inspect, reinstall, or replace crankshaft vibration damper (harmonic balancer).


    Special tools are required to remove and install the vibration damper. The use
    of a regular outside gear puller to remove the vibration damper could damage the
    damper.


    Inspect the rubber between the inner hub and outer inertia ring on the vibration
    damper. If this rubber is cracked, oil-soaked, deteriorated, or protruding from
    the damper, replace the damper. If the inertia ring on the damper is loose or
    has shifted forward or rearward on the hub, replace the damper. The inertia ring
    may also have rotated on the hub and the ignition timing reference would be incorrect.
    Inspect the vibration damper hub for cracks or a damaged keyway. If either of
    these conditions is present, replace the damper. Inspect the seal contact area
    on the hub for a wear groove or scoring. If either of these conditions is present,
    replace the damper or install a sleeve on the hub to provide a new seal contact
    area.


    # 14. Inspect crankshaft flange and flywheel mating surfaces; inspect and replace
    crankshaft pilot bearing/bushing (if applicable); inspect flywheel/flexplate for
