  md: '7. All of the following are causes of low engine oil pressure EXCEPT:


    A. Worn camshaft bearings.

    B. Partially plugged oil pickup screen.

    C. Worn crankshaft bearings.

    D. Restricted pushrod passages.


    Answer A is incorrect. Worn camshaft bearings will cause low engine oil pressure
    as there will be more oil runoff.


    Answer B is incorrect. A partially plugged pickup screen will restrict oil flow
    through the pump resulting in low pressure.


    Answer C is incorrect. Worn crankshaft bearings will allow oil runoff resulting
    in low oil pressure.


    **Answer D is correct.** Restricted pushrod passages will only prevent oil from
    reaching the rocker arms and will not result in low oil pressure.


    ![](bbox=[0.07, 0.07, 0.16, 0.15])


    ![](bbox=[0.22, 0.35, 0.57, 0.52])


    8. In the figure above, what is the technician checking?


    A. Head warpage

    B. Piston protrusion

    C. Surface finish

    D. Head bolt hole alignment


    **Answer A is correct.** Using a straightedge and feeler gauge, the technician
    is checking for warpage.


    Answer B is incorrect. Piston protrusion is measured with a depth gauge.


    Answer C is incorrect. Surface finish is checked with a profilometer.


    Answer D is incorrect. Head bolt alignment would require the head to be on the
    block.


    ![](bbox=[0.07, 0.52, 0.16, 0.6])'
