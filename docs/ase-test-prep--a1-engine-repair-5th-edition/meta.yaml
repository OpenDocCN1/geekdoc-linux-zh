  md: '11. A cylinder power balance test is being performed. Technician A says a compression
    gauge is used for a power balance test. Technician B says a misfiring cylinder
    will cause a small RPM decrease or no change at all when it is shorted. Who is
    correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A compression gauge is used for checking compression pressure.


    **Answer B is correct.** Only Technician B is correct. During a power balance
    test, RPM drop is noted as each cylinder is shorted. If all cylinders are producing
    about the same power, the RPM drop should be within +/-10 percent. If a cylinder
    is not producing adequate power, it is not contributing to the performance of
    the engine so there will be a much smaller or no drop in RPM.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    12. Technician A says a rod knock will become quieter as its cylinder is grounded.
    Technician B says a loose piston pin will cause a double click noise. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. When the plug wire to a
    cylinder is grounded, a rod knock will become quieter since it is not subject
    to the pressure of combustion. A loose piston pin will cause a double click as
    the piston reaches TDC or BDC and changes direction.


    Answer D is incorrect. Both Technicians are correct.


    13. A customer says his car will not go over 50 mph. The technician installs a
    vacuum gauge on the engine and notes a normal, steady vacuum at idle. When he
    brings the RPM to 2,000 rpm and holds it there, he notes a steady drop in vacuum.
    Which of the following is the most likely cause?


    +   A. A leaking intake manifold

    B. A misfiring spark plug

    C. A plugged exhaust system

    D. Weak rings


    Answer A is incorrect. A leaking intake manifold will cause low vacuum at idle.


    Answer B is incorrect. A misfiring spark plug would cause a rough idle and a fluctuating
    vacuum.


    **Answer C is correct.** A plugged exhaust system will cause excessive back-pressure
    and the exhaust gases will not be efficiently removed from the cylinder, diluting
    the intake mixture and causing poor power production.


    Answer D is incorrect. Weak rings will cause a low vacuum reading at idle.'
