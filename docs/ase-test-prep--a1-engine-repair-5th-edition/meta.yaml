    Before new piston rings are installed, ring end gap must be checked and adjusted.
    Compress a ring just enough so it fits in a cylinder. Insert a piston in the cylinder
    upside down (crown end first) and push the ring down near the bottom of the cylinder.
    The ring should be about 0.5 inch from the bottom. Use a feeler gauge to measure
    the gap where the piston ring ends meet. If the gap is too small, the ring ends
    must be filed to increase the gap. If the gap is too large, the wrong rings were
    selected or the cylinder was bored/honed incorrectly.


