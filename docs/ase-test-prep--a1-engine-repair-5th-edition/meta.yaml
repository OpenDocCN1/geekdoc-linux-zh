  md: '# Section 6 Answer Keys and Explanations — Engine Repair (A1)


    2. The technician is diagnosing an intermittent no-crank problem. Which of the
    following would be the LEAST LIKELY to cause this problem?


    +   A. A poor connection at the battery positive post

    B. High resistance in the starter ground circuit

    C. Hydro-locked engine

    D. A worn ignition switch


    ![](bbox=[0.8, 0.06, 0.96, 0.14])


    Answer A is incorrect. A poor connection at the battery positive post can cause
    an intermittent no-crank condition due to high resistance.


    Answer B is incorrect. High resistance in the starter ground circuit can cause
    intermittent no-crank conditions.


    **Answer C is correct.** If the engine was hydro-locked, it would not be an intermittent
    problem; it would be a consistent no-crank.


    Answer D is incorrect. A worn ignition switch can cause intermittent continuity
    to the starting circuit.


    3. When preparing an engine for removal, which of the following would be done?


    +   A. Drain engine coolant.

    B. Drain engine oil.

    C. Disconnect fuel lines.

    D. All of the above


    ![](bbox=[0.8, 0.34, 0.96, 0.42])


    Answer A is incorrect. Draining engine coolant, oil, and disconnecting the fuel
    lines would all be done.


    Answer B is incorrect. Draining engine coolant, oil, and disconnecting the fuel
    lines would all be done.


    Answer C is incorrect. Draining engine coolant, oil, and disconnecting the fuel
    lines would all be done.


    **Answer D is correct.** All the fluids should be removed from the engine and
    the fuel lines disconnected.


    4. The customer with a 1994 model vehicle complains of a strong fuel odor when
    he walks past the front of the car. Which of the following would be the LEAST
    LIKELY cause?


    +   A. Leaking injector seals

    B. A saturated evaporative emissions charcoal canister

    C. Cracked fuel line o-rings

    D. A leaking fuel pump


    ![](bbox=[0.8, 0.62, 0.96, 0.7])


    Answer A is incorrect. Leaking injector seals could cause a fuel leak on the intake
    manifold.


    Answer B is incorrect. An evaporative emissions charcoal canister may become saturated
    with raw fuel if the fuel tank is consistently overfilled. Many early canisters
    were located under the hood.


    Answer C is incorrect. Leaking fuel line o-rings at the engine will cause a fuel
    leak under the hood.


    **Answer D is correct.** By 1994, all engines were fuel-injected and the electric
    fuel pump was in the gas tank; a fuel pump leak could not cause a fuel odor.'
