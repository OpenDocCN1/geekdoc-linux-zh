  md: "Answer A is incorrect. A dial indicator is used to measure end-play or run\
    \ out. It would not be useful to measure crankshaft main bearing clearance.\n\n\
    **Answer B is correct.** Plastigauge is the most common method of measuring crankshaft\
    \ main bearing clearance.\n\nAnswer C is incorrect. An outside micrometer is used\
    \ to measure the outside dimension of a part; however, alone it cannot measure\
    \ crankshaft main bearing clearance.\n\nAnswer D is incorrect. A dial caliper\
    \ is used to measure outside depth or inside dimensions, but would not be an effective\
    \ tool to measure crankshaft main bearing clearance.\n\n# COMPLETION QUESTIONS\n\
    \nA completion question is similar to the direct question except the statement\
    \ may be completed by any one of the four options to form a complete sentence.\n\
    \nHere is an example of a completion question:\n\n![](bbox=[0.085, 0.38, 0.17,\
    \ 0.455])\n\n+   2. A diesel engine has an accelerator pedal position diagnostic\
    \ trouble code. The technician wiggles the wiring harness while observing the\
    \ accelerator pedal position sensor voltage with the scan tool. The sensor voltage\
    \ changes. The most likely cause of the diagnostic trouble code is a:\n\n   A.\
    \ Faulty scan tool.\n\n   B. Faulty ECM.\n\n   C. Faulty accelerator pedal position\
    \ sensor wiring.\n\n   D. Faulty ECM power supply.\n\nAnswer A is incorrect. If\
    \ the voltage value changed while moving the wiring harness, there is no reason\
    \ to believe the scan tool is faulty.\n\nAnswer B is incorrect. If the voltage\
    \ value changed while moving the wiring harness, there is no reason to believe\
    \ the ECM is faulty.\n\n**Answer C is correct.** If the voltage value changed\
    \ while moving the wiring harness, the most likely cause is the wiring harness.\n\
    \nAnswer D is incorrect. If all other items associated with the ECM are normal\
    \ and the voltage value changed while moving the wiring harness, the most likely\
    \ cause is the wiring harness.\n\n# TECHNICIAN A, TECHNICIAN B QUESTIONS\n\nThis\
    \ type of question is usually associated with an ASE exam. It is, in fact, two\
    \ true-false statements grouped together, such as: \"Technician A says...\" and\
    \ \"Technician B says...\", followed by \"Who is correct?\"\n\nIn this type of\
    \ question, you must determine whether either, both, or neither of the statements\
    \ are correct. To answer this type of question correctly, you must carefully read\
    \ each technician's statement and judge it on its own merit.\n\nSometimes this\
    \ type of question begins with a statement about some analysis or repair procedure.\
    \ This statement provides the setup or background information required to understand\
    \ the conditions about which Technician A and Technician B are talking, followed\
    \ by two statements about the cause of the concern, proper inspection, identification,\
    \ or repair choices."
