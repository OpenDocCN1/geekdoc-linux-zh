  md: '# Section 4 Task List Overview Engine Repair (A1)


    If you are unable to rotate the crankshaft by hand, the engine may be hydrostatically
    locked or have broken internal components. To check for hydrostatic lock, remove
    all the spark plugs and attempt to rotate the crankshaft again. If oil or coolant
    squirts from the spark plug holes, this indicates a bad head gasket, warped cylinder
    head or block, a cracked cylinder head or block, or the customer ran through deep
    water. Water squirting from the spark plug holes could be an indication the customer
    went through a deep puddle and drew in water through the air intake.


    If the crankshaft cannot be rotated at all with the spark plugs removed, or cannot
    be rotated through at least one complete revolution, the engine may be seized
    or have broken internal parts. Pull the dipstick and check the crankcase oil level.
    If oil does not register on the dipstick, it is possible that the pistons are
    seized in their bores or the connecting rods are seized to the crankshaft. If
    the oil level is sufficient, a broken component may have lodged between moving
    parts inside the cylinder block, thus preventing the parts from rotating.


    Many overhead camshaft (OHC) engines are non-freewheeling or "interference" engines.
    On these engines, a no-crank condition may be caused by piston-to-valve contact.
    This is a common occurrence when a timing belt slips or breaks, but it may also
    occur on engines fitted with a timing chain and sprockets. On many belt-driven
    OHC engines, it is possible to easily loosen or remove part of the timing belt
    cover. Do this, if possible, and check for obvious signs of belt failure.


    If the customer states that the starter cranks the engine but it will not start
    (or takes a long time to start), confirm that the valve train is operating properly
    before attempting to crank the engine yourself. If the timing belt or chain is
    broken or jumped, additional cranking may cause severe engine damage.


    A no-start or hard starting complaint can be caused by a faulty ignition, malfunctioning
    fuel/emission control systems, or severely worn internal engine components. These
    complaints can also be caused by broken or slipped valve train timing components,
    especially on free-wheeling engines. A broken timing device may cause some cylinders
    to have good compression while others have none. A slipped timing device may result
    in all cylinders having low compression. To determine if the belt or chain is
    functioning properly, rotate the crankshaft by hand while observing the distributor
    rotor or camshaft. If these components fail to rotate with the crankshaft, the
    timing belt or chain is broken. It is common for timing belts that have not been
    replaced at original equipment manufacturer (OEM) intervals to have their teeth
    torn off by the crank sprocket. The timing belt will appear normal during the
    visual inspection, but fail to rotate as the engine is turned over. If they do
    rotate with the crankshaft, confirm proper indexing of the rotor or camshaft to
    determine if the belt or chain has slipped. Rotate the crankshaft until the piston
    in cylinder #1 is at top dead center (TDC) on the compression stroke. Then check
    distributor rotor or camshaft position to make sure that it is correct.


    In the real world, most technicians will check for the presence of spark before
    checking for fuel or mechanical issues. The process for checking spark requires
    using a tool called a "spark tester" in place of one of the spark plugs and cranking
    the engine to visually check for spark. Some distributorless ignition systems
    are not compatible with this type of test and may be tested using appropriate
    secondary ignition lab scope procedures.


    Fuel injected engines usually receive high-pressure fuel from an electric pump.
    To verify that the fuel pump is operating and fuel is reaching the engine, locate
    the fuel line that supplies fuel to the throttle body or fuel injector rail. Turn
    the key on/engine off after installing a fuel pressure gauge. Verify that the
    gauge registers adequate pressure. If the gauge does not register any pressure
    or registers very low pressure, proceed with the fuel system diagnosis. If fuel
    pressure is adequate, begin the diagnosis of the fuel injection control system.'
