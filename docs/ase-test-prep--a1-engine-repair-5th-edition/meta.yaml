  md: '# Section 6 Answer Keys and Explanations Engine Repair (A1)


    ![](bbox=[0.08, 0.06, 0.46, 0.19])


    32. Technician A says that in the figure above, the piston diameter is being measured.
    Technician B says the piston should be measured on the skirt just above the bottom.
