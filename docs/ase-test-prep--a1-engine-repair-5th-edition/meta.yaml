  md: '![](bbox=[0.1, 0.07, 0.19, 0.16])


    15. A front-wheel drive vehicle''s engine jumps during acceleration and hits the
    underside of the hood. The motor mounts are inspected and although none of them
    appear to be broken, the front mount is coated with oil. Technician A says the
