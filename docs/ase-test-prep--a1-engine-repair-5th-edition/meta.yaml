  md: '# 5. Inspect valve spring retainers, rotators, locks/keepers, and lock grooves.


    Valve spring retainers and locks/keepers must be checked for wear, scoring, or
    damage. When any of these conditions are present, replace the components.


    Valve rotators can be inspected before cylinder head removal and disassembly since
    they usually cannot be taken apart. Rotators can be located on top of the valve
    spring (built into the spring retainer) or between the valve spring and the cylinder
    head. To test a rotator, mark the top of the spring retainer with a dab of paint.
    Then start the engine and run it at about 1,500 rpm. The retainer should slowly
    rotate. The direction of rotation is not important. If the retainer does not rotate,
    replace the rotator.


    In some cases, a defective rotator can be diagnosed with the cylinder head removed.
    Check the valve stem tip wear pattern. A shallow groove or channel running across
    the tip indicates that the valve has not been rotating. Replace the rotator on
    any valve with this condition.


    Inspect the valve lock/keeper grooves machined into the valve stems. Look for
    damage and wear, particularly for round shoulders. If the shoulders are uneven
    or rounded, replace the valve. Observe the depth of the valve lock/keeper in the
    valve spring retainer. If they are uneven, it may indicate wear that could cause
    them to pull through the retainer. Valve lock/keeper failures can cause severe
    engine damage.


    # 6. Replace valve stem seals.


    It is not necessary to remove the cylinder head to service many valve train components.
    This includes the valve springs, oil seals, retainers, and valve locks. A claw-type
    valve spring compressor can be used to compress the valve spring while the head
    is mounted on the block, but will require that the shop air supply is connected
    to the cylinder through the spark plug hold. This air pressure will hold the valves
    in place when the valve springs are removed, preventing the valves from dropping
    into the cylinder.


    On engines equipped with umbrella-type valve seals, slip the new seals over the
    valve stems. Work carefully to avoid damaging new seals on valve stem lock grooves.
    A damaged seal will cause excessive oil consumption. Some seals come with an installation
    tool. The tool is simply a short plastic sleeve that is slipped over the tip of
    each valve stem before the seal is installed. The sleeve extends down far enough
    to cover the lock grooves. After installing each seal, push it down against the
    top of the valve guide and remove the installation tool.


    On engines equipped with positive-type valve seals, the installation procedure
    is the same with one important difference. Positive-type seals must be pushed
    down over the top of the valve guide. Each seal has some sort of retaining device
    to keep it attached to the guide. Some seals have a flat, circular spring that
    wraps around the seal; some use garter springs to hold the seal in place; others
    have a molded-in ridge on their inner diameter that mates with a groove machined
    onto the valve guide. Whatever the retaining method, be sure that the valve guide
    seal is securely attached to the guide. Some manufacturers specify that a special
    tool should be used to drive the positive seal onto the valve guide. For further
    information, refer to a service manual for the vehicle.


    # 7. Inspect valve guides for wear; check valve stem-to-guide clearance; determine
    needed repairs.


    Valve guides should be measured near the top, center, and bottom using a hole
    gauge. Measure the valve stem diameter with a micrometer in the same three positions,
    and'
