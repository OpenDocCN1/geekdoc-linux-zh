  md: '29. All of the following are causes of low engine oil pressure EXCEPT:


    A. Worn crankshaft main bearings.

    B. Weak oil pump pressure relief valve spring.

    C. Stuck closed pressure relief valve.

    D. Restricted pushrod oil passages.


    ![](bbox=[0.8, 0.08, 0.88, 0.13])


    Answer A is incorrect. Worn crankshaft main bearings will cause low oil pressure.


    Answer B is incorrect. A weak oil pump pressure relief valve spring will not allow
    oil pressure to build to the proper pressure before allowing the oil to return
    to the oil pan from the oil pump.


    Answer C is incorrect. A stuck open pressure relief valve will cause low oil pressure.


    **Answer D is correct.** Restricted pushrod oil passages will affect oil delivery
    to the rocker arms, but will not affect oil pressure.


    30. Technician A says a thermostat rated 180 degrees is fully open at that temperature.
