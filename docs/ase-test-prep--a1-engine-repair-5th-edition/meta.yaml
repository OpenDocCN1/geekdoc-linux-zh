  md: '18. The technician is testing for a restricted catalytic converter. Technician
    A says a vacuum gauge may be used. Technician B says a temperature sensing probe
    can be used. Who is correct?


    ![](bbox=[0.8, 0.078, 0.88, 0.135])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. A vacuum gauge will show
    very low vacuum on an engine with a restricted catalytic converter when the engine
    is run at 2,000 rpm. A temperature sensing probe, which is used to measure inlet
    and outlet temperature of the catalytic converter, can indicate a restricted converter.
    The normal outlet temperature should be about 10 percent higher than the inlet.


    Answer D is incorrect. Both Technicians are correct.


    19. After a vehicle sits overnight, it has a light tapping noise when it is first
    started that disappears after a short time. The most likely cause would be:


    ![](bbox=[0.8, 0.338, 0.88, 0.395])


    +   A. Low oil level.

    B. Worn rod bearings.

    C. Excessive lifter leakdown.

    D. Weak oil pump.


    Answer A is incorrect. If the oil level was low, the noise would not go away.


    Answer B is incorrect. If the rod bearings were making noise, it would be a deeper
    knock and probably would not go away.


    **Answer C is correct.** If the lifters leakdown after sitting, when the oil pressure
    comes up they will pump up quickly and quiet down.


    Answer D is incorrect. If the noise was caused by a weak oil pump, it would not
    go away.


    20. Technician A says a running (dynamic) compression test should be done with
    the spark disabled and the fuel injector for that cylinder unplugged. Technician
    B says that a running compression tests results at idle should be about 50 percent
    of cranking compression results. Who is correct?


    ![](bbox=[0.8, 0.578, 0.88, 0.635])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. A running compression test
    is done with spark and fuel disabled for the cylinder being tested. The compression
    tester will go into the spark plug hole so the coil or plug wire must be grounded
    or unplugged. The injector must be disabled to prevent fuel wash in the cylinder.
    Idle results for a running compression test should be about 50 percent of cranking
    compression results.


    Answer D is incorrect. Both Technicians are correct.'
