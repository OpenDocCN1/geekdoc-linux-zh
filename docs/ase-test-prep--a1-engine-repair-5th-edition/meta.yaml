  md: '# 10. Inspect pushrods, rocker arms, rocker arm pivots, and shafts for wear,
    bending, cracks, looseness, and blocked oil passages; repair or replace as required.


    Pushrods should be inspected for a bent condition and wear on the ends. Roll the
    pushrod on a level surface to check for a bent condition. Bent pushrods usually
    indicate interference in the valve train, such as a sticking valve, improper valve
    adjustment, or mechanical interference due to improper valve timing. If the pushrod
    has an oil passage to provide oil to the rocker arm, make sure that the passage
    is not obstructed.


    Worn rocker arms, shafts, or pivots cause improper valve adjustment and make a
    clicking noise in the valve train. Check rocker arm shafts for wear and scoring
    in the rocker arm contact area. Check the shafts for cracks, bending, and loose/leaking
    oil passage plugs (if fitted). Check rocker arms for scoring at the pivot area
    and valve stem tip contact area. Worn rocker arms should be replaced.


    # 11. Inspect and replace hydraulic or mechanical lifters/lash adjusters.


    Technicians usually diagnose hydraulic valve train problems from the outside in.
    In most cases, the customer is complaining of a ticking or clicking noise in the
    engine. We use our stethoscope to pinpoint the location of the noise and perform
    the necessary disassembly to arrive at the problem component. It is important
    to understand how the hydraulic lash adjuster, this includes the traditional V8-type
    lifter, functions. These components are built to amazingly small tolerances often
    .0001 of an inch. They have a spring in them that holds the valve train components
    in place. This spring is not responsible for controlling valve lash, however;
    this is a function of engine oil pressure. The hydraulic lash adjuster maintains
    a preload on valve train components at all times when the engine is running.


    Hydraulic lash adjusters range in size from about one inch in diameter in cam-in-block
    engines to as small as .25 of an inch in many of the smaller multi-valve engines.
    Due to their very close tolerances, they are not very compatible with dirty oil,
    which is the main cause for failure. In applications where the lifter (lash adjuster)
    rides directly on the camshaft, there are two designs the flat tappet and the
    roller design.


    The flat tappet design starts life with a slightly convex bottom that encourages
    it to spin as the angled face of the camshaft raises and lowers it. This motion
    keeps oil moving over the cam and lifter contact surfaces. When inspecting this
    type for damage, look for dull surfaces, pitting, or concave contact surfaces.
    If this kind of damage is present, the camshaft will have to be replaced as well.


    The roller lifter was originally used in racing engines because of its ability
    to follow large and complex camshaft lobe profiles. Due to the fact that a cylinder
    rolls on the camshaft surface, the contact area between the cam and lifter is
    very small and has significantly less friction than the flat tappet design. OEMs
    began using this design to reduce internal friction and net better gas mileage.
    The hydraulic portion of this design is the same as all the others. The component
    that rolls will generally not fail unless it fails to roll. Here again watch for
    signs of pitting or for components that do not roll easily. The roller dictates
    that the lifter cannot spin so the cam and roller are made of steel. In most applications
    a used roller lifter that has not failed can be installed on a new camshaft. This
    is not possible with a flat tappet design where new'
