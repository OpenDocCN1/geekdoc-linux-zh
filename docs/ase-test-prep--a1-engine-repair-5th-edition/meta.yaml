  md: '+   43. Technician A says that valve train related noise could be caused by
    a low oil level. Technician B says that valve train related noise could be caused
    by valves that need to be adjusted. Who is correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    ![](bbox=[0.86, 0.07, 0.94, 0.16])


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. A low oil level will reduce
    the amount of oil pumped to the top of the engine, leaving the valves with no
    lubrication. If a valve train has excessive clearance between components, it will
    cause noise until corrected.


    Answer D is incorrect. Both Technicians are correct.


    +   44. A technician is changing oil in a customer''s vehicle and needs to know
    what weight oil to put in. Technician A says the weight of oil does not matter
    as long as it is multigrade oil. Technician B says the technician should look
    on the oil filler cap or in the owner''s manual. Who is correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    ![](bbox=[0.86, 0.34, 0.94, 0.43])


    Answer A is incorrect. Refilling the crankcase with the wrong weight oil may cause
    higher than specified oil pressure and void a customer''s warranty on the engine.


    **Answer B is correct.** Only Technician B is correct. Most manufacturers emboss
    the proper oil weight on the oil fill cap and specify oil weight in the owner''s
    manual.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    +   45. Technician A says that when removing a cylinder head from an OHC engine,
    the camshaft may have to be removed first. Technician B says the cylinder head
    should be cold before removal. Who is correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    ![](bbox=[0.86, 0.6, 0.94, 0.7])


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. Many OHC engines require
    removal of the camshaft to access the head bolts. The cylinder head should be
    cold before removal, particularly with an aluminum head, to prevent inducing warpage
    when the head bolts are removed.


    Answer D is incorrect. Both Technicians are correct.'
