  pgno: 22
- img_proc: false
  md: 'If the engine is turbocharged, first perform oil consumption diagnosis as though
    the engine was not turbocharged. While turbos are commonly blamed for excessive
    oil consumption problems, about half of the turbos returned under warranty are
    not defective. If oil is found in the turbo compressor housing or intake manifold,
    check the oil drain from the turbo housing to the block. If it is obstructed,
    oil under pressure will be forced past the turbo seals and into the engine through
    the intake tract. Check the PCV system, too. If the PCV valve does not close during
    "boost" conditions, the crankcase will be pressurized. This may pressurize the
    turbo oil drain passage, forcing oil into the turbo housing.


    Like oil consumption, coolant consumption may be caused by coolant leaking from
    the cooling system or coolant leaking into the engine (or passenger compartment).
    First, eliminate external leaks as the cause of coolant consumption by performing
    cooling system pressure tests (Task D.3). If cooling system pressure drops during
    the tests but no leaks are found, check the engine oil level and condition. Leaks
    into the crankcase will raise the oil level. If coolant is being drawn into the
    combustion chambers, the exhaust will be gray or white. The engine will continue
    to emit this smoke long after the time it usually takes for moisture to be purged
    from the exhaust system. On vehicles equipped with electronic engine controls,
    coolant passing through the exhaust system will "poison" the oxygen sensor.


    Some engine problems can be diagnosed by listening to the exhaust pulses at the
    tailpipe. If all cylinders are firing properly, the exhaust should consist of
    steady pulses. A puffing noise that occurs at regular intervals usually indicates
    a cylinder misfire caused by a compression, ignition, or fuel system defect. Puffing
    noises that occur erratically are usually caused by ignition or fuel system defects.
    Engine idle speed may also be unsteady.


    A high-pitched squealing noise during hard acceleration may be caused by a small
    leak in the exhaust system, particularly in the exhaust manifolds or exhaust pipe.
    The leak may also be noticeable at idle as a ticking noise.


    Another common engine noise is a high-pitched whistle at idle and low engine speeds.
    Check for vacuum leaks at the intake manifold gaskets. Also check for cracked
    or disconnected vacuum hoses. A vacuum leak whistle gradually decreases when the
    engine is accelerated and the intake vacuum decreases.


    A strong sulfur or rotten egg smell coming from the exhaust system of a car fitted
    with a catalytic converter may indicate a rich air/fuel ratio.


    # 6. Perform engine vacuum tests; determine necessary action.


    A vacuum test can be used to help pinpoint the cause of an engine problem. The
    vacuum gauge should be connected directly to the intake manifold.


    On an engine that is performing correctly, the vacuum gauge reading should be
    between 17 and 22 in. Hg (45 and 28 kPa absolute) and steady with the engine idling.
    Some abnormal vacuum gauge readings and typical problems associated with them
    are:


    +   1. A slightly low but steady reading may indicate retarded ignition timing.

    2. A very low but steady reading may indicate that the intake manifold has a significant
    leak.

    3. Burned or leaking valves may cause the vacuum gauge to fluctuate.

    4. Weak valve springs may result in a vacuum gauge fluctuation.

    5. A leaking head gasket may cause a vacuum gauge fluctuation.'
