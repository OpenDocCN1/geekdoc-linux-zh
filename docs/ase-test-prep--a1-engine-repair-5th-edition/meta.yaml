    25. Technician A says a catalytic converter may be legally removed on a vehicle
    that is more than 15 years old. Technician B says the catalytic converter significantly
    restricts exhaust flow. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A vehicle that came equipped with a catalytic converter
    may not have the converter removed except to replace it with a new converter under
    penalty of law.


    Answer B is incorrect. The engine management system is tuned to the exhaust flow
    on a converter equipped vehicle. The restriction in exhaust flow, although the
    restriction is minimal, is taken into account during design of the exhaust system.


    Answer C is incorrect. Neither Technician is correct.


    **Answer D is correct.** Neither Technician is correct. A catalytic converter
    is part of the emissions system of the vehicle and may not be legally removed
    without being replaced with a new one at any time during the vehicle''s service
    life. The engine is tuned to perform properly with the minimal restriction of
    the converter and exhaust modification may cause poor engine performance.'
