    ![](bbox=[0.82, 0.21, 0.9, 0.26])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct. Answer B is incorrect. Technician
    A is also correct. **Answer C is correct.** Both Technicians are correct. The
    piston diameter is measured on the lower part of the skirt 90 degrees from the
    piston pin. Answer D is incorrect. Both Technicians are correct.


    33. An overhead cam engine has overheated and blown a head gasket. The head has
    been removed. All of the following would be inspected EXCEPT:


    ![](bbox=[0.82, 0.46, 0.9, 0.5])


    +   A. Head deck for warpage.

    B. Camshaft bore for warpage.

    C. Camshaft followers for damage.

    D. Head for cracks.


    Answer A is incorrect. The deck surface would be checked for warpage. Answer B
    is incorrect. If the deck was warped, the camshaft bore may also be warped and
    should be inspected. **Answer C is correct.** The camshaft followers would not
    need to be inspected. Answer D is incorrect. The head should be pressure tested
    for cracks which may have been caused by overheating, or may have been the cause
    for overheating.


    34. Technician A says a pushrod engine''s camshaft should be checked for lobe
    wear. Technician B says the camshaft should be checked for warping. Who is correct?


    ![](bbox=[0.82, 0.7, 0.9, 0.75])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct. Answer B is incorrect. Technician
    A is also correct. **Answer C is correct.** Both Technicians are correct. A pushrod
    engine''s camshaft should be checked for both warping and lobe wear. Answer D
    is incorrect. Both Technicians are correct.'
