  md: 'instructions. In a typical sequence, the engine is brought to normal operating
    temperature. The vacuum advance hose (if equipped) is then disconnected and the
    hose is plugged. A stroboscopic timing light is connected to the #1 cylinder spark
    plug cable and the engine is started. Idle speed is adjusted to specifications,
    and the timing light is then pointed at a metal tab attached to the timing cover.
    If necessary, the distributor is rotated to cause a notch in the crankshaft pulley,
    harmonic balancer, or flywheel to align with a timing mark. On DIS inspect coil
    packs, plug wires, and modules for signs of arcing; replace any damaged parts.
    Inspect condition of crank and cam sensors. Cracked or severely oil-soaked components
    should be replaced.


    # 7. Inspect and diagnose exhaust system; determine needed repairs.


    Exhaust manifolds can be made of cast iron or sheet metal. Sheet metal manifolds
    are usually made of stainless steel. Inspect exhaust manifolds for cracks and
    leaks. On vehicles with computer-controlled fuel delivery systems, air entering
    the exhaust system through a crack or leak ahead of the oxygen sensor can cause
    drivability and emission control system problems. Replace a cracked manifold.


    The exhaust manifold on carbureted and TBI engines may be equipped with a manifold
    heat control valve. This valve is closed when the engine is cold to direct hot
    exhaust gases to the underside of the intake manifold, directly under the carburetor
    or TBI unit. The gases heat the manifold, improving fuel vaporization in the cold
    engine. The valve opens as the engine warms up and the added heat is not needed.
    If the manifold heat control valve is stuck open or fails to close when the engine
    is cold, the engine may stumble during acceleration. If the valve is stuck in
    the closed position, engine power will be reduced and the intake manifold will
    overheat. The floor of the intake manifold may crack.


    With the engine cold and shut off, check to see if the valve moves freely. Older
    engines use a bimetal thermostatic spring to operate the valve. Grasp the valve
    counterweight and rotate it back and forth. In some applications, the valve is
    opened and closed using a vacuum actuator. Connect a vacuum pump to the actuator
    and apply vacuum to test the valve. The valve shaft and bushings should be lubricated
    periodically with a special solvent that contains graphite. Check the vehicle
    manufacturer''s service manual for lubricant information.'
