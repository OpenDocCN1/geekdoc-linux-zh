  md: 'Most modern head gaskets are installed dry, without any type of sealer. When
    positioning a head gasket on the block, make sure that any orientation marks (up,
    front, left, right, etc.) are followed.


    After double-checking the cylinder bores for tools, shop towels, dropped fasteners,
    etc., set the cylinder head on the engine block. Check the manufacturer''s recommendation
    regarding thread lubricants or sealers. Bolts that are threaded into blind holes
    are often lubricated with a few drops of engine oil—some on the threads and some
    on the underside of the bolt head. Bolts that thread into the water jacket are
    often coated with a waterproof sealer.


    Insert the head bolts in their holes and hand tighten them. Then tighten the bolts
    to specifications following the procedure and sequence specified by the engine
    manufacturer.


    # C. Engine Block Diagnosis and Repair (10 Questions)


    # 1. Remove and disassemble engine block; clean and prepare components for inspection
    and reassembly.


    Mount the engine on a stand and remove the oil pan drain plug. Allow any oil that
    has accumulated in the pan during engine removal to drain into a pan. Remove the
    lifters from the block and store them in an organizer for later inspection. Turn
    the engine block upside down, remove the oil pan bolts, and remove the pan from
    the block. If the pan is "glued" to the block with room temperature vulcanizing
    (RTV) sealant, strike a strong corner of the pan with a rubber mallet to loosen
    it.


    Check the crankshaft and connecting rod bearing caps to see if they are marked
    for position and direction. Main bearing caps often have numbers and arrows cast
    into each cap. Arrows typically point to the front (timing device end) of the
    engine. Connecting rods are often stamped with the cylinder number on both the
    rod body and cap, near the cap parting line. Take note of the direction that the
    numbers (or rod oil squirt holes) point for all connecting rods. If rod or main
    caps are not marked, mark each one with a number punch, center punch, or scratch
    awl.


    Inspect the top of the cylinder bores for ring ridges. If the ring ridge is severe,
    it should be removed before attempting to remove the piston/connecting rod assemblies.
    Use a ridge reamer to remove the ridge (Task C.4).


    Loosen the connecting rod cap bolts or nuts and remove the caps. Keep used bearing
    inserts with their caps for later inspection. If bolts are held captive in the
    connecting rod bodies, place a short length of fuel line hose over each bolt to
    protect the crankshaft journals during piston/rod removal.


    Carefully push each piston/connecting rod assembly out of its cylinder. When an
    assembly is removed, immediately reinstall its mating rod cap and nuts.


    Remove the harmonic balancer or pulley hub bolt from the crankshaft nose and remove
    the balancer or hub. Some simply slide off the nose, but most are a press fit.
    Use a special harmonic balancer removal/installation tool to remove a press-fit
    balancer. Using a jawed puller to remove a press-fit balancer will permanently
    damage the balancer.


    Remove the timing chain/belt cover bolts and remove the cover. On engines fitted
    with timing chain tensioning devices, compress and lock the tensioner shoe in
    place, if possible. Remove the tensioner and any timing chain guides from the
    front of the block. Remove the oil slinger, if one is present, from the crankshaft
    nose.'
  merge: -1
  pgno: 35
- img_proc: false
  md: 'On camshaft-in-block engines, unbolt and remove a bolted-on camshaft sprocket
    along with the timing chain. Remove the camshaft thrust plate bolts and the thrust
    plate if one is present. If the engine has a balance shaft mounted in the engine
    "V," remove the shaft drive mechanism.


    On engines fitted with a one piece crankshaft rear main oil seal, pry the seal
    out of its bore or unbolt the seal mounting plate and seal from the back of the
    engine. Remove the crankshaft main bearing cap bolts and the bearing caps. Lift
    the crankshaft out of the block.


    On camshaft-in-block engines, carefully withdraw the camshaft from the cylinder
    block, being careful to avoid nicking the bearing bores or the camshaft lobes.
    Use a camshaft bearing installer/remover tool to drive the bearings from their
    bores.


    If the engine has block-mounted balance shafts, remove them now following the
    engine manufacturer''s instructions.


    Knock any core plugs loose by striking one edge with a blunt chisel. Do not strike
    the plug too hard and do not try to drive the plug straight into the water jacket.
    This could cause a bulge in a cylinder wall if the plug is driven into the wall.
    When the core plug tilts in its bore, grab an edge of the plug with pliers and
    pull the plug out of the block. Remove all oil gallery plugs.


    Engine parts can be cleaned several different ways. Iron or steel parts can be
    soaked in a tank full of a heated alkaline solution (i.e., hot-tanked). This will
    remove oil, sludge, hard, baked-on carbon deposits, and mineral deposits in the
    coolant passages. Never put any aluminum parts in a hot tank as the caustic solution
    will corrode aluminum. Removal of all core and oil gallery plugs allows the chemical
    to be completely washed from the internal passages of the block.


    Many shops have cold solvent parts washers. Small to medium size parts can be
    placed in the washer and sprayed with solvent. Brushes or scrapers can be used
    to remove stubborn deposits from the parts.


    Engine parts can also be cleaned in a thermal cleaner. These are actually large
    ovens that heat parts to temperatures between 650 and 800°F (343 and 427°C) to
    oxidize the contaminants. After the thermal cleaning process, the ash is removed
    by shot blasting or washing the parts. The temperature inside a thermal cleaner
    can also be reduced to clean aluminum parts without damaging them.


    Regardless of which cleaning method is used, always perform a careful inspection
    of oil passages in the cylinder block, head, crankshaft, and all other parts.
    This is especially important if the engine suffered a major failure like a spun
    bearing or a severely worn camshaft and lifters. Metal particles will become lodged
    in the oil passages and can be difficult to remove. Rod out all small diameter
    passages to make sure that they are unobstructed. Use a long, slender brush (called
    a rifle brush) to thoroughly clean oil galleries.


    # 2. Visually inspect engine block for cracks, corrosion, the condition of passages,
    core and gallery plug hole condition, surface warpage, and surface finish and
    condition; determine necessary action.


    After disassembly and thorough cleaning, you must make a careful visual inspection
    of the block for cracks. Any areas that are in question can be further inspected
    in a machine shop using dyes and MAGNAFLUX testing. Special attention to areas
    that may have'
  merge: -1
  pgno: 36
- img_proc: false
  md: 'corrosion that would affect good sealing on reassembly is important. Areas
    that seal coolant, such as water pump passages and core plug holes, are vulnerable.
    It is important to look through the core plug holes to the cylinder walls on cast
    iron blocks. If a lot of pitting is present, it may be necessary to replace the
    block to avoid internal leaks after over-boring. Be cautious of conditions like
    this when the cooling system condition is very poor and rusty.


    Next, inspect oil galleries for sludge or casting flash that may break loose and
    damage the engine on reassembly. Check all gasket surfaces for pitting or warpage
    and make sure that they meet surface conditions set by the manufacturer. If in
    doubt, enlist the advice of a good machinist. Most head gaskets used in late model
    engines are not installed with any kind of sealer so the surface condition and
    cleanliness are critical to successful sealing. When checking the head surfaces
    or deck of the block for straightness, if you can measure any warpage with a straightedge
    and feeler gauge the deck should be resurfaced.


    # 3. Inspect and repair damaged threads where allowed; install core and gallery
    plugs.


    Inspect all threaded bolt holes in the cylinder block, especially the cylinder
    head bolt holes. Check holes for sludge or debris that may have been missed during
    cylinder block cleaning. Run the appropriate size thread chaser into each of the
    cylinder head bolt threaded holes to make sure that the threads are clean. Put
    a few drops of oil on a head bolt and thread it into each hole by hand.


    If the threads in a bolt hole are damaged, the hole may be drilled to a larger
    size and rethreaded. A thread repair insert or HeliCoil thread insert can be installed
    in the oversize hole. The result is a threaded hole that is the same size as the
    original. Different types and brands of thread inserts are available. In most
    cases, however, the insert is threaded onto a special installation tool, coated
    with thread locking compound, and then threaded into the oversize hole. The installation
    tool is then removed and a hammer and punch are used to break off a tang at the
    bottom of the insert.


    Inspect oil gallery plug threaded holes for dirt or damage. Do not run a tap very
    far into these holes since they usually have tapered pipe threads. Run a rifle
    brush down the oil galleries to make sure that all debris has been removed. Coat
    the new oil gallery plugs with teflon tape or an oil-resistant sealer and thread
    them into the block. Do not overtighten the plugs. If there are small core plugs
    at the ends of the oil galleries, coat the edges of new plugs with an oil-resistant
    sealer and then drive the plugs into the block. Use a cold chisel and hammer to
    cross stake the end of the bores after the core plugs are installed.


    Clean out core plug bores with emery cloth before installing new plugs. If a bore
    is damaged, it may be repaired by boring it to the next specified oversized plug.
    Oversized core plugs are stamped with the letters OS. Before installing a new
    plug, coat the sealing edge with a nonhardening, water-resistant sealer. Drive
    the plugs into the block using the proper special driving tool. Make sure that
    the plug goes into the bore squarely to prevent leaks.


    # 4. Inspect and measure cylinder walls; hone and clean cylinder walls; determine
    need for further action.


    Use a dial bore gauge to measure the cylinder diameter in three vertical locations.
    These locations are just below the ring ridge at the top of the cylinder, in the
    center of the ring travel, and just above the lowest part of the ring travel.
    Cylinder taper is the difference in the cylinder diameter at the top of the ring
    travel compared to the diameter at the bottom of the ring travel.'
  merge: -1
  pgno: 37
- img_proc: false
  md: 'In each of the three vertical cylinder measurement locations, measure the cylinder
    diameter in the thrust direction and in the axial direction. Cylinder out of round
    is the difference between the cylinder diameter in the thrust and axial directions.
    If cylinder out of round exceeds specifications, rebore the cylinder.


    If cylinder wear, out of round, and taper are within specifications, the cylinders
    may be deglazed. Very mildly worn cylinders should be deglazed with a brush hone,
    which removes material very slowly. Moderately worn cylinders (still within specifications)
    may be deglazed with 220 or 280 grit stones installed on a cylinder hone. When
    the honing operation is completed, the cylinders should have a 50° to 60° crosshatch
    pattern. After deglazing, the cylinder should be cleaned with hot, soapy water
    and a stiff bristle brush. Ordinary solvent will not remove grit from pores in
    the cylinder wall--use hot soapy water. The bores are clean when a clean, lint-free
    cloth is used to wipe them and the cloth does not get dirty. When the bores are
    clean, rinse the block and dry it thoroughly. Coat all machined surfaces with
    a light coating of the manufacturer''s recommended engine oil.


    If one cylinder requires reboring, most manufacturers recommend reboring all the
    cylinders to the same size. Cylinder reboring usually is done with a specialized
    piece of equipment called a boring bar. Cylinders must be honed after boring.
    A honing machine is usually used for this. After cylinder honing, the same procedure
    for block cleaning should be followed as previously discussed in cylinder deglazing.


    # 5. Inspect crankshaft for end-play, journal damage, keyway damage, thrust flange
    and sealing surface condition, and visual surface cracks; check oil passage condition;
    measure journal wear; check crankshaft reluctor ring/tone wheel (where applicable);
    determine necessary action.


    ![](bbox=[0.1, 0.57, 0.5, 0.76])


    Crankshafts must be inspected at several different points to ensure dependable
    engine performance.


    End-play is the amount the crank moves fore and aft in the block. One of the crank
    shaft bearings provides a thrust surface that controls fore and aft movement.
    Crank wear or bearing wear can allow excessive end-play which can affect clutch
    operation in manual transmission equipped vehicles, belt alignment problems, starter
    engagement problems, and even automatic transmission pump or converter damage.
    This measurement is made when the crank and main bearings are assembled in the
    block by using a dial indicator in a horizontal or parallel mount to the crank
    and measuring total fore and aft movement.'
  merge: -1
  pgno: 38
- img_proc: false
  md: 'A crank can be measured for straightness by placing it in a set of V-blocks
    and using a dial indicator to measure the runout of the main bearing surfaces.
    Another good hint of a bent crank is excessive main bearing wear on one or two
    journals compared to others. This is not an indicator by itself as each journal''s
    bearing clearances can be a factor as well.


    The crankshaft bearing surfaces must be inspected for cracks and wear grooves.
    The crank must be replaced, resurfaced, and/or repaired if problems are found
    here. Clean out the oil passages with small gallery brushes to be sure no restrictions
    are present.


    Using the diagram provided, we need to make some measurements to determine if
    it is necessary to resurface the crank. Using a micrometer, we need to determine
    the difference between point A and B. This will tell us if the bearing surface
    is tapered. Comparing A to C and B to D will tell us if we have an out of round
    condition. If the crank is even, you can determine bearing clearance with a standard
    bearing by comparing your measurements to the specs for the crank. If the crank
    is not larger than the minimum specification, it may be necessary to resurface
    the crank to the next undersize and use appropriate bearings.


    # 6. Inspect and measure main bearing bores and cap alignment; mark caps for location
    and direction.


    Check main bearing bore alignment before bearing caps are installed. The block
    should be resting on a flat surface, not hanging from an engine stand by the flywheel
    end. Lay a straightedge across the bores and check alignment using feeler gauges.
    If bearing bores are not aligned, the block can be line bored.


    Check the bearing cap and cylinder block mating surfaces for nicks and burrs.
    These can be removed using a file. Make sure that the caps are marked for proper
    location and direction of installation. If the caps are switched and the correct
    position cannot be positively determined, the block will have to be line bored.


    When measuring main bearing bore diameters, the bearing caps must be installed
    and the bolts properly torqued. Check bore diameter in three directions. The vertical
    measurement should not be larger than any of the others. A larger vertical reading
    indicates the bore is stretched. Out of round measurements less than 0.001 inch
    (0.025 mm) are acceptable, provided that the vertical reading is not the largest.
    Improper bore alignment and bore dimensions can be corrected by line boring. This
    operation, performed by machine shops, involves removing the bearing caps and
    planning a small amount of material from the cap surface that mates with the cylinder
    block. The caps are then reinstalled and torqued to specifications. A specialized
    piece of equipment called a line hone is used to "true up" the main bearing bores
    to their original diameters.


    # 7. Install main bearings and crankshaft; check bearing clearances and end-play;
    replace/torque bolts according to manufacturers'' procedures.


    Clean the main bearing bores in the cylinder block and bearing caps with solvent
    and allow the bore surfaces to dry. Do not oil the bores. Handle new bearing inserts
    being careful to avoid touching the bearing surface with your fingers. Wipe the
    back of the bearing inserts with a solvent-dampened cloth and allow the inserts
    to dry. Install the bearing inserts in the cylinder block and main bearing cap
    bores. The upper bearing halves are usually grooved and each contains an oil supply
    hole. Make sure that the oil hole in the bearing aligns with the oil hole in the
    bearing bore. Make sure that the tab on each bearing insert fits tightly in its
    bearing bore notch.'
  merge: -1
  pgno: 39
- img_proc: false
  md: 'Carefully lay the crankshaft in the cylinder block.


    To measure bearing clearance, install a strip of Plastigauge across each journal.
    Install the bearing caps and bolts, tightening the bearing cap bolts to the specified
    torque. Remove the bearing cap bolts and the bearing caps. Compare the width of
    the crushed Plastigauge strip on the bearing journal to the scale provided on
    the Plastigauge package to determine the bearing clearance.


    Crankshaft end-play may be measured by inserting a feeler gauge between the crankshaft
    thrust journal and the thrust lip on one of the main bearings. On some engines,
    a dial indicator is used to measure crankshaft end-play while moving the crankshaft
    with a pry bar. Excessive end-play may cause premature bearing wear or noise as
    the crank chucks back and forth in the block.


    If bearing clearance and end-play are within specifications, remove the main bearing
    caps and the crankshaft. If a two piece rear main seal is used, install a rope-type
    or split lip seal in its grooves in the block and rear main bearing cap. Oil the
    main bearing inserts, lay the crankshaft in the block, and install the main bearing
    caps.


    Install the bearing cap bolts and torque them to specifications. Some engines
    are fitted with TTY main bearing cap bolts that must be replaced after being loosened.
    Check the manufacturer''s service manual to determine whether the engine you are
    servicing has TTY main bearing cap bolts.


    # 8. Inspect camshaft bearings for excessive wear and alignment; replace bearings
    if necessary; install camshaft, timing chain, and gears; check end-play.


    Inspect the camshaft bearings for scoring, roughness, and wear. Camshaft bearings
    or bearing bores should be measured at two different locations with a telescoping
    gauge. Measure the camshaft journals with a micrometer, and subtract the journal
    diameter from the bearing diameter to obtain the clearance. If the wear exceeds
    specifications, replace the bearings.


    The type of tool needed to remove and install the camshaft bearings depends upon
    the engine design. Most overhead valve (OHV) camshaft-in-block engines will use
    a camshaft bushing driver and hammer. The right size mandrel is selected to fit
    the bearing. Turning the handle tightens the mandrel against the camshaft bearing
    and then the bearing is driven out by hammer blows. The same tool is used to replace
    the bearings. Some OHC engines require a special puller/installer.


    Never attempt to remove and install camshaft bearings in an OHC cylinder head
    using a bushing driver. The bearing supports may be bent or broken due to the
    hammer blows, especially on aluminum heads.


    When installing cam bearings, it is very important that the bearing insert be
    properly positioned in the bearing bore. Be absolutely sure that any oil hole(s)
    in the bearing insert align with oil supply passages in the bearing bore. This
    may mean that the insert is positioned toward the front of the bore, the back
    of the bore, or even in the center of the bore. The position is not important
    as long as the oil holes line up.


    Many overhead cam engines do not have removable camshaft bearings—the camshaft
    journals run directly against bearing bores machined into the aluminum cylinder
    head. Inspect the bearing surfaces on these engines for scoring, roughness, and
    wear. Measure the bearing bores at two different locations with a telescoping
    gauge. Measure the camshaft journals with a micrometer, and subtract the journal
    diameter from the bearing'
  merge: -1
  pgno: 40
- img_proc: false
  md: 'diameter to obtain the clearance. If the wear exceeds specifications, replace
    the cylinder head.


    When the camshaft bearing bores are machined into the cylinder head, the bearing
    caps should be removed and a straightedge positioned across all the bearing bores.
    Insert a feeler gauge between the straightedge and each bearing bore to measure
    any misalignment. Misalignment indicates that the cylinder head may be warped.
    Have a machine shop check for this. Cylinder heads can sometimes be straightened.
    Severely warped heads should be replaced.


    Camshaft end-play is normally checked using a dial indicator. A typical specification
    will be 0.002"-0.008". End-play which is greater than specification can be caused
    by a worn camshaft thrust washer or worn thrust surfaces on the camshaft. If either
    the thrust washer or the cam is worn they are replaced. Camshaft end-play which
    is less than specification is generally caused by a failure of the technician
    to reassemble the components correctly. Excessive camshaft end-play can result
    in camshaft position sensor damage.


    # 9. Inspect auxiliary (balance, intermediate, idler, counterbalance, or silencer)
    shaft(s), drive(s)/gear(s), and support bearings for damage and wear; time balance
    shaft to crankshaft; determine necessary action.


    Balance shafts are found on many 4- and 6-cylinder engines. Some rotate at crankshaft
    speed, while others rotate at twice crankshaft speed. Removal and installation
    procedures can vary widely so refer to the manufacturer''s service manual for
    service information.


    Some balance shafts are mounted to the bottom of the cylinder block and are chain
    driven off the crankshaft. Some are gear driven by a large gear machined into
    a disc that is part of the crankshaft. Belt-driven balance shafts are often mounted
    inside the bottom of the cylinder block, much like camshafts on camshaft-in-block
    engines. On some popular V-type engines, a balance shaft is mounted in the cylinder
    block directly above the camshaft and gear driven off the camshaft.


    Once removed, balance shafts should be checked for runout with the same procedure
    used for measuring camshaft runout. The balance shaft journals should be measured
    for taper with the same procedure for measuring crankshaft journal taper. When
    the balance shafts are installed, they must be properly timed to the crankshaft
    or severe engine vibration may occur upon engine startup.


    # 10. Inspect, measure, service, or replace pistons and piston/wrist pins; identify
    piston and bearing wear patterns caused by connecting rod alignment problems;
    determine necessary action.


    Inspect pistons for cracks and damage from overheating. Pistons with these conditions
    should be replaced. Inspect the piston skirts for uneven wear and scoring. Wear
    on the edges of the piston skirt next to the wrist pin hole may be caused by a
    bent or twisted connecting rod.


    Clean the piston ring grooves using a ring groove cleaning tool. Be careful to
    avoid removing material from the bottom of the groove. Make sure that oil drain
    holes at the bottom of the oil ring groove are not obstructed.'
