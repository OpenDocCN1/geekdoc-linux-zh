  md: '9. The customer is concerned about poor performance at highway speeds. The
    technician talks to the owner about the car''s repair history and is told that
    the timing belt, water pump, and crank seal have recently been replaced, and the
    problem started afterward. What is the most likely cause for poor performance?


    ![](bbox=[0.8, 0.06, 0.95, 0.15])


    +   A. The serpentine belt is loose.

    B. The sparkplug wires were misrouted.

    C. The camshaft and crankshaft are out of sync.

    D. The catalytic converter is restricted.


    Answer A is incorrect. A loose serpentine belt will cause a squeal but not affect
    performance.


    Answer B is incorrect. Misrouted sparkplug wires would cause a misfire and poor
    performance all the time.


    **Answer C is correct.** If the camshaft and crankshaft were not positioned properly
    during timing, belt replacement performance would suffer at higher engine RPM.


    Answer D is incorrect. A restricted convertor would cause performance problems
