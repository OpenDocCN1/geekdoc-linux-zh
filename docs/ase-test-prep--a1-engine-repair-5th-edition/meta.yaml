  md: 'To measure piston ring side clearance, insert a new ring in the piston groove
    and position a feeler gauge between the ring and the groove. If ring side clearance
    is excessive, the piston should be replaced.


    If the piston passes the inspections mentioned previously, check for a worn wrist
    pin bushing. Clamp the connecting rod body lightly in a vise (use soft jaw covers)
    and attempt to rock the piston against the connecting rod sideways at a right
    angle to normal piston/connecting rod motion. If any play is noticeable, the piston
    wrist pin bore, wrist pin, or connecting rod small end bushings are worn and the
    piston and connecting rod must be separated. If no play is noticeable and the
    piston is to be reused, the components need not be separated.


    Pistons must be fitted to their cylinder bores. If piston-to-cylinder wall clearance
    is excessive, piston slap may be noticeable. If there is not enough clearance,
    piston scuffing will occur. Check piston clearance by measuring the cylinder bores
    and the piston diameters.


    To measure piston diameter, position a micrometer to contact the piston thrust
    surfaces (the surfaces at right angles to the piston, or wrist, pin bore). The
    exact measuring location varies according to manufacturer. Most manufacturers,
    however, specify a point about 3/4 inch below the wrist pin centerline.


    Bearing wear patterns can help the technician identify worn or damaged components.
    Bearings that are worn at opposite corners are an indication of bent or twisted
    connecting rods. Bent or twisted connecting rods can be caused by liquid on top
    of the piston resulting in a hydraulic lock. Wear at the outer edges of the bearing
    indicates radius ride. Radius ride generally occurs when the fillet radius was
    not correctly machined into the crankshaft. Normal rod bearing wear will have
    the upper half of the rod bearing wearing faster than the lower half. However,
    if the upper bearing is greatly worn and the lower bearing shows little wear,
    then "lugging" of the engine should be suspected.


    # 11. Inspect connecting rods for damage, bore condition, and pin fit; determine
    necessary action.


    Inspect the connecting rods for cracks and obvious damage. Remove the cap nuts,
    caps, and bearing inserts. Check that the cap bolts are not loose in the rod body.


    Inspect the bearing inserts for uneven wear. If the front and rear edges of a
    bearing are worn more than the center area, the rod may be bent or twisted. If
    the bearing inserts are worn more at the parting line areas, the rod big end bore
    may be stretched. Machine shops have special jigs used to check for bent/twisted
    connecting rods. If rod bend or twist exceeds specifications, replace the connecting
    rod.


    Measure the connecting rod big end bore for taper, out of round, and proper bore
    size. If any of these dimensions are not within specifications, the connecting
    rod should be reconditioned or replaced.


    On piston/connecting rod assemblies with free-floating wrist pins, remove the
    pin retainer circlips or snap rings and slide the wrist pin out of its bores.
    Take note of piston to rod orientation and separate the piston and rod. On piston/connecting
    rod assemblies with press-fit wrist pins, use the appropriate press and adapters
    to remove the wrist pin. Measure the connecting rod small end bore (or "eye")
    diameter. If bore diameter exceeds specifications, it may be possible to ream
    out the bore and install an oversize wrist pin. Some rod eyes have a pressed in
    bushing. If the bore is worn on this type of rod a new bushing can be installed.
    The new bushing must be reamed to fit the wrist pin.'
