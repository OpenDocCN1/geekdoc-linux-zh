    Engines fitted with a timing belt should have the belt replaced at the mileage
    intervals recommended by the engine manufacturer. During belt replacement, the
    crankshaft, camshaft, and idler or other sprockets should be inspected. Check
    the sprocket teeth for wear and damage. Check idler pulleys or sprockets for dry
    or loose bearings.


    Many vehicles with DIS substitute a camshaft position sensor for the distributor
    to find the location of the #1 cylinder. This is most often used to synchronize
    fuel injection events to ignition events. The cam sensor is usually a magnetic
    hall-effect switch that gets a signal from the camshaft via a #1 aligned bump
    or machined surface on the cam or cam drive gear.


    When inspecting camshafts, look for pitting, dull surfaces, or indications of
    poor lubrication. Cam or crank gears on chain drives develop wear that appears
    like the tooth of the chain in reverse. This condition warrants replacement. Chain
    deflection is the primary indicator of timing chain condition. Refer to the manufacturers''
    recommendations to determine chain condition. Many chain driven engines use chain
    guides that are tensioned by the hydraulic chain tensioner. Be sure to check for
    surface wear on these. If the chain has worn a groove in the guide, it will probably
    require replacement. Reassembly of timing components in engines with hydraulic
    tensioners may require that the tensioner be compressed and pinned until all components
    are in place.


    Engines with variable valve timing will have actuation devices that allow oil
    flow and sensors which monitor the location of the camshaft as part of the valve
    train components. These items must be inspected for wear and proper operation
    during cylinder head repair.


    Camshaft end-play is usually measured with a dial indicator. The specifications
    will vary depending on the size of the camshaft. A normal end-play specification
    can be 0.002"-0.008". Excessive camshaft end-play can be the result of a worn
    thrust bearing or worn thrust surfaces on the camshaft itself. Thrust bearings
    are replaced; if the thrust surface on the camshaft is worn, the camshaft is replaced.'
