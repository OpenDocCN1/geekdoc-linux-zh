  md: 'Inspect the flywheel for scoring and cracks in the clutch contact area. Minor
    score marks and ridges may be removed by resurfacing the flywheel. If deep cracks
    or grooves are present, the flywheel should be replaced.


    Mount a dial indicator on the engine block or flywheel housing and position the
    dial indicator stem against the clutch contact area on the flywheel. Rotate the
    flywheel to measure the flywheel runout. If runout exceeds specifications, replace
    the flywheel.


    Insert a finger in the inner pilot bearing race and rotate the race. If the bearing
    feels rough or loose, replace the bearing. Check the pilot bushing to verify that
    it is not loose. A transmission input shaft may be positioned in the pilot bushing
    to check for excessive play. If too much play exists, replace the bushing. A special
    puller may be used to remove the pilot bearing or bushing. The proper driver must
    be used to install the pilot bearing or bushing. Always verify that the transmission
    input shaft fits in a new bushing before attempting to install the engine (or
    transmission).


    Inspect the starter ring gear for excessive wear or damage. On manual transmission
    flywheels, the starter ring gear is often replaceable. Remove the old gear by
    drilling a hole through the gear at the "root" between two teeth. Position a cold
    chisel between the two teeth and strike it with a hammer. Take note of whether
    the gear has a chamfer on one side before removing it. To install the new gear,
    first heat it to about 400°F in an oven, and then slip it over the flywheel body
    and allow it to cool.


    # 15. Inspect and replace pans and covers.


    Always inspect the gasket mounting surfaces on sheet metal pans for warpage and
    look for dished retaining bolt holes. Dished mounting holes and warped mounting
    surfaces must be straightened by hammering them flat again. Use a straightedge
    to verify that gasket surfaces are flat.


    Gaskets are used to seal minor variations between two flat surfaces. Oil pan gaskets
    or rocker arm cover gaskets are usually manufactured from cork, rubber, or a combination
    of rubber and cork or rubber and silicone. Timing cover, water pump, and thermostat
    housing gaskets on older engines were made of specially treated paper. On newer
    engines, these same components are sealed to the block using synthetic rubber
    o-rings or silicone "spaghetti" seals. Some paper gaskets may require the use
    of a nonhardening sealer; always follow OEM and gasket manufacturer''s guidelines
    for sealer usage on gaskets. Synthetic rubber and silicone seals are often installed
    without coatings or cements.


    # 16. Assemble the engine using gaskets, seals, and formed-in-place (tube-applied)
    sealants and thread sealers according to manufacturer''s specifications; reinstall
    engine.


    Gasket sealing technology has changed dramatically in a relatively short period
    of time. This requires the technician to have a large base of knowledge on how
    to seal the many types of gaskets. The newest types of gaskets are the captive
    silicone or rubber gaskets that fit into a channel cut or cast into one of the
    components'' mating surfaces. These gaskets are very reliable and depend on surface
    tension and crush to seal. Many of these gaskets are reusable in low-pressure
    environments. Reusable gaskets for areas such as oil pans are a hybrid version
    of this type of gasket, where the gasket is captive in a high density plastic
    and TTY bolts are used to tension the component. These gaskets are all installed
    dry on very clean surfaces. RTV sealer is used in some applications to actually
    replace the gasket altogether. In these situations, the application is critical.
    Any air bubbles or gaps in the sealer will develop into leaks later on. This type
    of sealer comes in many varieties. In vehicles'
