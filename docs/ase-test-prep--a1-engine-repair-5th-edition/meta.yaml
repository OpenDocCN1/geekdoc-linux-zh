    bearing surface with your fingers. Install the bearing inserts in the rod and
    cap bores. If the rod has an oil squirt hole, make sure that the oil hole in the
    bearing aligns with the oil hole in the rod body. Make sure that the tab on each
    bearing insert fits tightly in its bearing bore notch.


    Before installing the piston/connecting rod assembly in the block, install short
    lengths of fuel line, or "chopsticks," over the rod bolts and position the piston
    ring end gaps according to the manufacturer''s instructions. If no instructions
