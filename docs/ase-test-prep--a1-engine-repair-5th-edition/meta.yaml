    # 7. Perform cylinder power balance tests; determine necessary action.


    In a sound engine, each cylinder contributes equal amounts of power. A common
    method of isolating a power loss that may be occurring in one or more of the cylinders
    is the power balance test. In most engines, this test is performed by disabling
    the spark on a single cylinder for a short time to measure the RPM drop that occurs
    when that cylinder is not contributing. The ignition should be disabled for the
    shortest amount of time possible to prevent catalytic converter damage. Cylinders
    that are not contributing or are weak will show little or no RPM drop when they
    are disabled. On port fuel injected engines many manufacturers include the ability
    to perform cylinder balance tests with the power train control module (PCM) and
    a scanner. Most on-board diagnostics (OBD) II vehicles will quickly pick up on
    and identify an inefficient cylinder, displaying a code directing to the perceived
    problem and the affected cylinder.


    When a particular cylinder or cylinders fail a power balance test, it becomes
    necessary to determine if the cause is mechanical: valves, internal engine efficiency,
    or engine-management related. Engine management issues could include port fuel
    injectors that leak or are electrically damaged (delivering no fuel at all), faulty
    ignition components like spark plugs, distributorless ignition systems (DIS) coils,
    plug wires, etc. The power balance test is usually the precursor to a cylinder
    compression and/or leak down test. These tests will confirm a mechanical issue
    and electrical diagnosis using digital storage oscilloscopes or scanners can determine
    engine management issues.


    # 8. Perform cylinder cranking compression tests; determine necessary action.


    The ignition and fuel injection system must be disabled before proceeding with
    the compression test. During the compression test, the throttle is blocked open
    and the engine is cranked through four compression strokes for each cylinder.
    The compression readings are recorded for each stroke and compared to the manufacturer''s
    specifications. Slightly low compression readings in all cylinders are not cause
    for concern if engine performance is acceptable. Compression readings that vary
    more than 20 percent (from the highest to the lowest) are cause for concern. A
    wet compression test should be performed to help pinpoint causes of low compression.
    To perform a wet test, add several squirts of oil to the cylinder allowing 30
    to 60 seconds for the oil to flow around the rings and then retest the compression.
    If the compression shows great improvement, the most likely causes are piston
    ring and/or cylinder bore wear. A wet test usually will not seal leaking gaskets
    or valves and will show little or no improvement in the compression reading if
    these components are at fault. Compression readings may be interpreted as follows:


    +   - When the compression readings on all the cylinders are about equal, but
    significantly lower than specifications, the piston rings or cylinder walls may
    be worn. If compression in all cylinders is low and the engine spins freely during
    cranking, check the valve timing. The timing belt or sprocket may have jumped.

    - Low compression readings on one or more cylinders indicate worn rings, leaking
    valves, a blown head gasket, flat camshaft, or a cracked cylinder head. Performing
    a leak down test will narrow down the cause of the problem.'
