  md: '**46.** The customer is concerned about his oil pressure gauge dropping after
    the vehicle is driven for about 20 miles, although when he starts up, it is normal.
    When the dipstick is checked after shutdown, it shows below the add mark. When
    the dipstick is checked after sitting, the oil level shows full. Which of the
    following is the most likely cause?


    +   - A. Worn camshaft bearings

    - B. Leaking rear main seal

    - C. Blocked oil return holes in the head

    - D. Weak oil pump


    **Answer A is incorrect.** Worn camshaft bearings may affect oil pressure, but
    not oil level.


    **Answer B is incorrect.** If the rear main seal was leaking, the oil level would
    stay low from oil loss.


    **Answer C is correct.** Blocked return holes in the head will hold the oil in
    the valve cover and slowly allow it to drain back into the pan.


    **Answer D is incorrect.** A weak oil pump will cause low oil pressure, not oil
    use.


    **47.** Technician A says that during engine reassembly, all rod bearing clearances
    should be checked. Technician B says the rod bearing inserts should extend slightly
    above the rod and cap; this is called bearing crush. Who is correct?


    +   - A. A only

    - B. B only

    - C. Both A and B

    - D. Neither A nor B


    **Answer A is incorrect.** Technician B is also correct.


    **Answer B is incorrect.** Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. All rod bearing clearances
    should be checked to ensure proper bearing-to-journal clearance. Bearing crush
    ensures that the bearing fits tight in the rod when assembled and will not rock.


    **Answer D is incorrect.** Both Technicians are correct.


    **48.** While performing a cranking compression test on a 4-cylinder engine, the
    technician notes that one cylinder has a pressure reading of 60 psi, 44 kPa, while
    the others have a reading of 135 psi, 931 kPa. Technician A says performing a
    cylinder leakage test will indicate where the pressure is leaking. Technician
    B says the vehicle has worn valve guides. Who is correct?


    +   - A. A only

    - B. B only

    - C. Both A and B

    - D. Neither A nor B


    **Answer A is correct.** Only Technician A is correct. The next step for narrowing
    down the cause for low compression on one cylinder would be the cylinder leakage
    test.


    **Answer B is incorrect.** Worn valve guides will not cause a loss of compression.


    **Answer C is incorrect.** Only Technician A is correct.


    **Answer D is incorrect.** Technician A is correct.'
  merge: -1
  pgno: 239
