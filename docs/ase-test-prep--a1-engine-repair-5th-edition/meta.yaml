  md: '28. Technician A says that a 13 lb. radiator cap that is being replaced could
    be replaced with a 15 lb. cap for better protection. Technician B says a 13 lb.
    cap that releases pressure at 10 lbs. when being tested is OK to be used. Who
    is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A 13 lb. cap should only be replaced with a cap of the
    same rating.

    Answer B is incorrect. A radiator cap should hold pressure until its rated pressure
    is exceeded.

    Answer C is incorrect. Neither Technician is correct.


    **Answer D is correct.** Neither Technician is correct. The radiator cap rating
    should not be changed; a 13 lb. cap replaced with a 15 lb. cap may cause cooling
    system leaks. A radiator cap which releases pressure before its rating may cause
    the engine to overheat. A radiator cap raises the boiling point of the coolant
    3 degrees for every lb. of cap pressure. A cap that releases at 10 lb. rather
    than its rated 13 lb. will cause the coolant to boil 9 degrees before the proper
    pressure is reached.


    ![](bbox=[0.8, 0.06, 0.88, 0.11])


    29. Technician A says a stuck open thermostat can cause high pressure in the cooling
    system.

    Technician B says a defective radiator pressure cap can cause a burst upper radiator
    tank.

    Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A stuck open thermostat can cause low pressure rather than
    high.


    **Answer B is correct.** Only Technician B is correct. A pressure cap that does
    not release at its specified pressure may cause pressure to build to the point
    that the radiator fails.


    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    ![](bbox=[0.8, 0.39, 0.88, 0.44])'
