- img_proc: false
  md: 'A faulty crankshaft main or rod bearing usually makes a knocking sound that
    is very deep in pitch. Main bearing knock is usually a thumping noise most noticeable
    when the engine is first started. Connecting rod bearings also cause a heavy knocking
    sound, and engine oil pressure may also be low, especially at idle. When the cylinder
    with faulty connecting rod bearings is disabled during a cylinder balance test,
    the knocking sound will diminish. Loose flywheel bolts may cause a thumping noise
    at idle. Camshaft bearings usually do not cause a noise unless severely worn.


    Worn pistons and cylinders cause a rapping noise while accelerating. When performing
    a cylinder balance test, piston noise can increase when the faulty cylinder is
    disabled (the opposite reaction of a bad connecting rod bearing). A piston pin
    with excessive clearance often makes a "double click" noise when the engine is
    idling.


    Lifters also make a distinctive noise, a loud ticking sound. One way to isolate
    lifter (or other valve train) noise from connecting rod noise is to remember that
    the camshaft operates at half of crankshaft speed. It is common for a lifter with
    excessive leak-down to tick for a few seconds after the engine starts. The noise
    goes away once full oil pressure is developed.


    Vibrations can be caused by engine accessory components, but more often are caused
    by internal engine failures such as bearings or pistons. Some vibrations will
    result from a faulty vibration damper. Vibrations caused by faulty vibration dampers
    can be identified as they typically will be present only at certain RPMs, i.e.
    750, 1,500, and 2,250. Vibrations can also be caused by out of time balance shafts.
    These shafts are chain, belt, or gear driven.


    # 5. Diagnose the cause of excessive oil consumption, coolant consumption, unusual
    engine exhaust color, and odor; determine necessary action.


    Excessive oil consumption can be due to oil leaking from the engine or oil being
    drawn into the cylinders and burned. Before blaming internal components, be absolutely
    sure that oil is not leaking from the engine. In some cases, oil leaks only when
    the engine is running. If necessary, raise the vehicle on a lift while the engine
    is running to check for leaks. The radiator and/or coolant recovery jug should
    also be checked for signs of oil leakage into the cooling system.


    Oil can enter the cylinders several different ways, including: worn rings; scored
    cylinder walls; worn valve guides, seals, and stems; worn turbocharger seals;
    and plugged oil drain passages. As a general rule, an engine that is "burning
    oil" will emit blue-gray exhaust. This may be more noticeable on acceleration
    and deceleration. Do not confuse the blue-gray smoke due to oil consumption with
    the black exhaust that occurs when the air/fuel ratio is too rich.


    Plugged oil drain passages in the cylinder head or block can cause excessive oil
    consumption even when rings and guides are in good condition. To check for this,
    remove the oil filler cap or another component fitted to a valve cover and start
    the engine. If the oil level inside the cover rises steadily as the engine runs
    and reaches the top of the valve guides, the drain passages are clogged. While
    these passages can usually be cleared of sludge, the sludge is an indication that
    the engine was poorly maintained. Clearing the passages will probably reduce oil
    consumption, but the engine may experience other problems in the near future.
    Oil found in the cooling system can be leaking from an internal oil cooler (in
    the radiator tank) or from a head gasket on an OHC engine.


    Perform compression tests (Task A.8) and cylinder leakage tests (Task A.9) to
    confirm whether piston rings/cylinders or valve guides are worn.'
