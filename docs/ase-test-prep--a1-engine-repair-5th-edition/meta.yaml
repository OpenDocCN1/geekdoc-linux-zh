  md: '13. The technician installs a vacuum gauge on the engine and notes a normal
    reading at idle, but when the RPM is raised, the needle fluctuates rapidly between
    12 and 24 in. Hg. Which of the following is the most likely cause?


    ![](bbox=[0.091, 0.077, 0.155, 0.135])


    +   A. A leaking intake manifold

    B. A misfiring spark plug

    C. Weak valve springs

    D. Weak rings


    Answer A is incorrect. A leaking intake manifold will cause low vacuum at idle.

    Answer B is incorrect. A misfiring spark plug would cause a rough idle and fluctuating
    vacuum.

    Answer C is correct. Weak valve springs will cause slow or poor seating of the
    valves as the engine RPM increases, creating a fluctuating needle.

    Answer D is incorrect. Weak rings will cause a low vacuum reading at idle.


    14. Technician A says on a vehicle with a map sensor, the air intake ductwork
    is not necessary. Technician B says that intact air intake ductwork is critical
    to engine longevity. Who is correct?


    ![](bbox=[0.091, 0.343, 0.155, 0.401])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Even though a map-equipped engine does not measure airflow
    in the ductwork, the ductwork does affect how well the engine breathes at various
    speeds.

    Answer B is correct. Only Technician B is correct. An air intake system that is
    intact will prevent dust, pollen, etc. from entering the engine and causing accelerated
    wear.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    15. An engine experiences very low oil pressure. Technician A says this may be
    caused by a stuck closed pressure relief valve. Technician B says low oil pressure
    will cause valve train rattle. Who is correct?


    ![](bbox=[0.091, 0.609, 0.155, 0.667])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A stuck closed pressure relief valve will cause high oil
    pressure.

    Answer B is correct. Only Technician B is correct. Low oil pressure will be noticed
    as a rattling, ticking noise from the valve train since this area is the last
    to receive pressurized oil.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.'
