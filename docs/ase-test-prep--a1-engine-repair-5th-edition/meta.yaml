    half the number of teeth as the engine has cylinders. As a tooth (or gap) passes
    by a pickup coil or crankshaft sensor, the magnetic field changes, and a trigger
    signal is sent to an electronic control module.


    +   **Reluctor ring** A gear-like part of the electronic ignition system.


