    D. Neither A nor B


    ![](bbox=[0.78, 0.53, 0.88, 0.59])


    Answer A is correct. Only Technician A is correct. Some older formula RTV fumes
    could damage the oxygen sensor. New formulas will not damage the oxygen sensor,
    and should say so on the packaging.

    Answer B is incorrect. RTV is an aerobic sealer; it requires air to cure.

    Answer C is incorrect. Only Technician A is correct.

    Answer D is incorrect. Technician A is correct.'
