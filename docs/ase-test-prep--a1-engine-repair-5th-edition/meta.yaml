  md: 'with a belt-driven camshaft, the belt tensioner is loosened and the belt is
    slipped off the camshaft sprocket. On other engines, the timing cover and belt
    must be completely removed from the engine. If the timing belt is being removed
    from the engine and will be reused, mark the direction of rotation on the belt.
    Reinstall the belt so it rotates in the same direction. Never crank the engine
    after a timing device has been loosened or removed until the cylinder head has
    also been removed. Cranking an engine while the timing belt is loose or disconnected
    can cause immediate and serious engine damage.


    The basic cylinder head removal procedure varies from manufacturer to manufacturer.
    On some OHC engines the cylinder head, camshaft(s), and rocker arms (if used)
    are removed as an assembly after loosening and removing the cylinder head bolts.
    On some engines the rocker shaft and arm assembly (including the upper half of
    the cam bearings) must first be removed to access cylinder head mounting bolts.
    Refer to the appropriate service manual for information.


    Cleaning the components for reassembly changed dramatically with the advent of
    aluminum heads and blocks. Many of the surfaces of these components are polished
    to near mirror-like qualities. After cleaning these components in the appropriate
    degreasing solution, carbon buildup may be removed by hand with a soft wire wheel
    or in an abrasive cabinet like a glass blaster. In either case, care must be taken
    to insure that gasket surfaces remain in their original condition. Use of refinishing
    wheels on polished surfaces can cause new gaskets to fail prematurely. The head
    must be carefully washed after removing deposits and old gasket material to insure
    that none of the debris restricts passages. Many manufacturers are recommending
    plastic scrapers and gasket softening chemicals to remove old gaskets. Be sure
    to find out what the manufacturer recommends to guarantee a quality repair.


    # 2. Visually inspect cylinder heads for cracks, warpage, corrosion, leakage,
    and the condition of passages; determine needed repairs.


    While the cylinder heads from any engine should be carefully inspected, the heads
    from engines with serious mechanical problems (blown head gasket, coolant consumption,
    overheating, oil sludging, etc.) should receive special attention. First look
    at the old head gaskets to determine if a problem area is visible. If one or more
    is, match the area to the contact area on the cylinder head.


    Check the cylinder head for cracks, paying special attention to the combustion
    chambers and the areas between intake and exhaust valves. An electromagnetic-type
    tester and iron filings (MAGNAFLUX®) may be used to check for cracks in cast iron
    heads. A dye penetrant may be used to locate cracks in aluminum heads. Machine
    shops can usually locate hard-to-find cracks by pressure testing. In this type
    of test, all coolant passages are blocked using metal plates. The coolant jacket
    is then filled with compressed air and the head is submerged in a tank of water.
    Bubbles escaping from the head reveal leak areas.


    Use a straightedge and a feeler gauge to check the cylinder head for warpage at
    several locations. Check the manufacturer''s service manual for exact specifications.
    A cylinder head that is excessively warped must be resurfaced or replaced.


    On OHC engines, be sure to check warpage on the cam side of the head before resurfacing
    and reinstalling the head. If warpage exceeds manufacturer''s specifications,
    the camshaft will bind, flex, and may break.


    Inspect the coolant passages in the cylinder head as thoroughly as possible. Shine
    a flashlight into the passages looking for corrosion, rust, and trapped debris.
    A cylinder head that shows evidence of severe pitting in the cooling jacket should
    be replaced.'
