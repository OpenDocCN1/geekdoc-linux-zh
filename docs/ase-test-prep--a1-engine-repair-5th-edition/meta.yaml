- img_proc: false
  md: 'The fuel rail and pressure regulator usually only require service when a failure
    occurs. During repair or replacement, it is wise to replace injector o-rings to
    avoid leaks that are time consuming after the job is completed. Pressure regulators
    usually have a vacuum source to the manifold either by a line or a passage in
    the throttle body on throttle body injection (TBI) engines. It is critical to
    make sure this line or passage is clear and in good condition to avoid over-fueling
    conditions caused by high fuel pressure.


    Fuel injectors should be checked for evidence of leakage. O-rings should be replaced
    and attention should be given to any wiring that may have deteriorated.


    The last area includes the sensors and actuators that relate to these systems.
    Many vehicles have air and coolant temperature sensors mounted on the intake manifold.
    Thermistor-type air temp sensors should be inspected and replaced if deposits
    have built up on them; cleaning often damages them. The throttle position sensor
    and manifold pressure sensors should be handled with care during service as should
    all electrical wiring. Idle speed control devices that can be cleaned should be
    serviced while the manifold is apart. Many idle speed control devices have air
    hoses that attach to them. These should be inspected for cracks or leaks that
    could allow unfiltered air to enter the air intake tract.


    # 2. Inspect, service, or replace air filters, filter housings, and intake ductwork.


    Inspect the air filter housing and any ductwork directing fresh air to the housing.
    Ductwork often leads from the radiator support or inner fender to the air filter
    housing. Make sure that this ductwork is present and undamaged.


    Check the air filter housing itself. Make sure that the housing is securely mounted
    and hose or duct connections are tight. On carbureted and TBI engines, make sure
    that the gasket between the air filter housing and the carburetor, or TBI, unit
    is present and in good condition. Check the housing lid or cover to make sure
    that it fits properly and that any seals or gasket materials are in good condition.
    Streaks of dust or other debris around a sealing area indicate that the seal is
    leaking. Make sure that all clips or wing nuts securing the lid or cover are present
    and working properly. On engines equipped with an airflow sensor (most multi-point
    injection [MPI] engines) the duct from the air filter housing to the throttle
    body needs to be checked for cracks and leaks. Cracks can allow the engine to
    draw in unmetered air causing drivability problems.


    Check the air filter for damage or excessive dirt. Check the filter or filter
    housing for an instruction label. Follow the manufacturer''s recommendations,
    if present, especially those for filter element replacement intervals.


    # 3. Inspect turbocharger/supercharger; determine necessary action.


    The turbocharger/supercharger and all its mounting brackets, heat shields, and
    ducting should be checked for damage. Replace or repair damaged or missing components.


    Check the air intake side of the turbocharger/supercharger system for leaks. If
    there is a leak in the intake system before the compressor housing, dirt may enter
    the turbocharger and damage either the compressor or turbine wheel blades. When
    a leak is present in the intake system between the compressor wheel housing and
    the cylinders, turbocharger pressure is reduced.


    Turbocharger/supercharger boost pressure may be tested with a pressure gauge connected
    to the intake manifold. Boost pressure should be tested during hard'
  merge: -1
  pgno: 56
- img_proc: false
  md: 'acceleration while driving the vehicle. Excessive boost pressure may be caused
    by a wastegate that is stuck closed, a leaking wastegate diaphragm, or a disconnected
    wastegate linkage. Reduced turbocharger boost pressure may be caused by a wastegate
    that is stuck open.


    When diagnosing the cause of blue exhaust smoke on a turbocharged vehicle, first
    perform oil consumption diagnosis as though the engine was not turbocharged. While
    turbos are commonly blamed for excessive oil consumption problems, about one-half
    of the turbos returned under warranty are not defective. Refer to Task A.5 for
    more information about excessive oil consumption on turbocharged engines.


    # 4. Test engine cranking system; determine needed repairs.


    To determine a battery''s state of charge, measure open circuit voltage. First
    remove the battery surface charge by connecting a 50-ampere load across the battery
    terminals for 10 seconds. Then wait 10 minutes for the battery to stabilize. Disconnect
    both battery cables from the battery and use a voltmeter to measure voltage across
    the terminals. Open circuit voltage will be at least 12.6 volts on a fully charged
    battery after the surface charge has been removed. If open circuit voltage is
    below 12.4 volts, the battery must be charged before further testing.


    The best way to determine a battery''s ability to deliver power is to perform
    a load or capacity test. During a load test, a load tester is used to discharge
    the battery at one-half of its stated cold cranking ampere (CCA) rating for 15
    seconds. Battery voltage is recorded at the end of this time, while the load is
    still applied. If the test is performed with the battery at about 70°F (21°C),
    a battery voltage reading of 9.6V or higher indicates that the battery is in good
    condition.


    A discharged battery can be either fast charged or slow charged. Slow charging
    is always preferable if time is available to do this. Slow charging allows the
    chemical changes that take place during charging to occur throughout the entire
    thickness of the battery plates instead of on the surface of the plates only.
    Slow charging also lessens the chances that the battery will be overheated (and
    permanently damaged) during charging.


    The next item we want to test is the starter. We are looking for current demand
    and for any unusual sounds. Depending on the engine and starter design, most starters
    will require 150-250 amps to turn over the engine. If the starter current draw
    is high, there may be internal problems with it such as a dragging armature or
    worn bushings. External problems such as tight or seized engine-driven accessories,
    or even a front pump in the automatic transmission, can be a cause of higher than
    normal starter current draw. Listen for noise or very loud cranking noises. Some
    vehicles require shims to properly place the starter. If the vehicle had shims
    in it be sure to replace them during reassembly. If the starter current draw is
    low and the engine spins quickly but fails to start, suspect a jumped or broken
    timing chain or belt.


    Battery cables are required to carry high amperage. The most effective method
    of testing a battery cable is with a voltage drop test. The voltmeter is placed
    across the cable and the engine is cranked. The meter is read while the engine
    is cranking. A typical voltage drop specification for the battery cable is 0.3
    volts. The test should be performed on both sides of the circuit. A reading higher
    than specification would indicate higher than acceptable resistance. If the voltage
    drop is occurring at the end of the cable, the terminal may be replaced. If this
    method is chosen, care should be taken to ensure that the cable shortened is enough
    to remove all corrosion. Many technicians will replace the entire cable.'
