  md: '# Glossary


    **Air conditioning** The process of adjusting or regulating, by heating or cooling,
    the quality, temperature, and humidity of air.


    **Aluminum** A nonferrous metal that is light in weight yet can be stronger than
    steel when mixed with the proper alloys. It is easily cast and machined.


    **Balance shaft** A shaft with counterweights designed to prevent vibration of
    rotating parts.


    **Battery** A device for storing electrical energy in chemical form.


    **Bearing crush** Occurs when the bearing cap is tightened, the slightly protruding
    bearing shell ends touch, and are forced together. This provides a tight fit in
    the bore for the bearings and prevents bearing rock.


    **Belt** A device used to drive the water pump and other accessory power-driven
    devices.


    **Block deck** The flat surface of the main casting of an engine on which the
    head attaches.


    **Cam** An abbreviation for camshaft: a device having lobes, driven by the crankshaft
    via gears, a chain, or a belt that opens and closes the intake and exhaust valves.


    **Cam follower** A term used for valve lifter: a hydraulic or mechanical device,
    in the valve train, that rides on the camshaft lobe to lift the valve off its
    seat.


    **Camshaft journal** That part of the camshaft that turns in a bearing.


    **Cast iron** A term used for various cast ferrous alloys containing at least
    2 percent carbon. It is used for many different parts on vehicles.


    **Catalytic converter** An automotive exhaust system component, made of stainless
    steel, containing a catalyst that reduces hydrocarbons, carbon monoxide, and nitrogen
    oxides present in the engine exhaust gases.


    **Coil** A term used to describe a spring or an electrical device using many turns
    (coils) of wire such as springs, ignition coils, solenoids, and relays.


    **Connecting rod bearing** The bearing of a connecting rod that rotates on the
    crankshaft.


    **Cooling system** The system that circulates coolant through the engine to dissipate
    its heat.


    **Counterbalance shafts** One or more rotating shafts found on some engines to
    counteract the natural vibrations of other rotating parts, such as the crankshaft,
    in that engine. This balance, or counterbalance, shaft usually turns at twice
    the crankshaft speed and must be timed properly.


    **Crankshaft** The revolving part of a unit that has the function of delivering
    power or work from the reciprocating motion. Engines have crankshafts, as do air
    conditioning compressors and air compressors.


    **Crankshaft sensor** An electronic device used to send crankshaft rotating information
    to the computer.


    **Cross-firing** A condition whereby spark plugs fire out of turn, usually caused
    by poor spark plug wire insulation.


    **Cylinder head** That part of the engine that covers the cylinders and pistons.


    **Cylinder out of round** The difference in the cylinder inside diameter when
    measured in the same plane, 90 degrees apart.


    **Cylinder taper** The difference in cylinder inside diameter from top to bottom.


    **Cylinder wall** A term used for cylinder bore, the inside diameter of a cylinder.


    **Distributor** A device used on many engines to direct high-voltage electrical
    energy from the coil to the spark plugs.


    **Elongated** Not round, but egg-shaped.


    **End-play** A term used to describe a spacing or clearance involved with a moving
    part. Crankshafts and camshafts require end-play measurements and must be set
    to manufacturer''s specifications during engine assembly.


    **Engine oil** A lubricant formulated for use in an engine.


    **Engine oil cooler** A device used on some high performance engines, police packages,
    taxis, trucks, turbo-equipped engines, and diesel engines to prevent the engine
    oil from overheating. These work by using a heat exchanger exposed to air flow
    or engine coolant.


    **Exhaust conditioning** The burned and unburned gases that remain after combustion.


    **Exhaust pipe** A pipe that connects the exhaust manifold to the muffler or catalytic
    converter. It is made of heavier material than tailpipes, and is sometimes double-layered.


    **Face-to-seat** As in valve face-to-valve seat contact, this refers to the actual
    sealing area of the vailve and seat. It must be the size and angle specified by
    the engine manufacturer to properly seal the combustion chamber and have a long
    service life.


    **Firing order** The order in which the engine cylinders fire and deliver power.


    **Flywheel** A round, heavy metal plate attached to the crankshaft of an engine
    that helps smooth out power strokes and'
