    # 4. Inspect, test, and verify valve springs for squareness, pressure, and free
    height comparison; replace as necessary.


    A valve spring tester is used to measure valve spring pressure or tension. Valve
    springs must be carefully checked to see that the free height of the spring meets
    specifications and that the spring does not lean to one side. The spring must
    stand exactly perpendicular when it sits on a flat surface. The spring must be
    able to attain a specified pressure when at rest. This is called the valve spring
    installed height. It must also be able to attain specific pressure at maximum
    valve lift. A spring tester is used to measure these pressures at their respective
    heights. In most cases, if a spring fails it will not be able to develop adequate
    pressure. This can cause the valves to "float" or bounce when the engine is at
    higher revs. Low spring pressure often leads to a spring breaking and the valve
    falling into the cylinder. In the more unusual event that the spring generates
    too much pressure, it can cause excessive wear on the cam, followers, or lifters.'
