    30. The valve stem installed height is too tall. All of the following may be used
    to correct the installed height EXCEPT:


    +   A. Cutting the tip of the valve.

    B. Replacing the seat.

    C. Shimming the valve.

    D. Replacing the valve.


    Answer A is incorrect. The tip of the valve may be cut to correct installed stem
    height.


    Answer B is incorrect. As the seat is reconditioned, it causes the valve to seat
    deeper into it increasing stem installed height. If the seat has been cut too
    much, it may require replacement of the seat to correct the stem installed height.


    **Answer C is correct.** The valve spring may need to be shimmed, but the valve
    cannot be shimmed.


    Answer D is incorrect. Replacing the valve can be used to correct the stem installed
    height.


