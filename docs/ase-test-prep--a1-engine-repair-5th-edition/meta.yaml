  md: 'Section 6 Answer Keys and Explanations


    Engine Repair (A1)


    37. When a valve spring is checked for warpage, it is:

    A. Rolled on a flat surface.

    B. Compressed to see if it bows out.

    C. Placed on a flat surface standing up against a straightedge and rotated.

    D. Measured for free length.

    Answer A is incorrect. The spring is rotated next to a straightedge.

    Answer B is incorrect. Compressing the spring may not show distortion.

    Answer C is correct. Rotating the standing spring against a straightedge is the
    proper way to check a spring for warpage.

    Answer D is incorrect. Spring free length is a separate spring measurement.


    ![](bbox=[0.8, 0.08, 0.95, 0.15])


    38. When the coolant is being tested, which of the following are the LEAST LIKELY
    to be tested for?

    A. Freeze protection

    B. pH level

    C. Flow volume

    D. Electrical current

    Answer A is incorrect. Freeze protection is always checked.

    Answer B is incorrect. pH level should be checked. This test gives a better idea
    of the condition of the additives in the coolant.

    Answer C is correct. Flow volume is not checked; that is a function of the water
    pump.

    Answer D is incorrect. Checking for stray electrical current is recommended. Electrical
    current flow can cause rapid hose deterioration and reoccurring pinholes in the
    radiator and heater core.


    ![](bbox=[0.8, 0.3, 0.95, 0.38])


    39. Three types of valve stem seals are:

    A. Lip, o-ring, and floating.

    B. O-ring, positive, and box.

    C. Positive, umbrella, and lip.

    D. Positive, o-ring, and umbrella.

    Answer A is incorrect. Only answer D is correct.

    Answer B is incorrect. Only answer D is correct.

    Answer C is incorrect. Only answer D is correct.

    Answer D is correct. The three types of valve stem seals in use are the positive
    lock, o-ring, and umbrella seal.


    ![](bbox=[0.8, 0.54, 0.95, 0.62])


    40. Which of the following would LEAST LIKELY require crankshaft grinding?

    A. An out of round journal

    B. Excessive journal taper

    C. Fine journal scoring

    D. Damaged thrust bearing surface

    Answer A is incorrect. An out of round journal must be trued.

    Answer B is incorrect. Excessive journal taper would require grinding to correct.

    Answer C is correct. Fine journal scoring can be polished with a special belt
    sander.

    Answer D is incorrect. A damaged thrust bearing surface must be repaired.


