  md: '**44.** An engine cranks over slowly and will not start. Technician A says
    the engine has to crank at 450 rpm to start. Technician B says the vehicle may
    have a weak battery. Who is correct?


    ![](bbox=[0.8, 0.05, 0.9, 0.14])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. An engine has to crank at 250 rpm minimum to start.

    **Answer B is correct.** Only Technician B is correct. If the vehicle''s battery
    is weak, it will not supply the current needed to spin the engine at a minimum
    of 250 rpm.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    **45.** There is coolant lost from an engine but the technician cannot tell where
    the leak is. Technician A says to pressurize the cooling system to 25 psi, then
    check for leaks. Technician B says small leaks may only be obvious immediately
    after a hot shutdown. Who is correct?


    ![](bbox=[0.8, 0.31, 0.9, 0.4])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A cooling system should not be pressurized over the radiator
    cap rating.

    **Answer B is correct.** Only Technician B is correct. When an engine is shut
    down after reaching operating temperature, the pressure in the cooling system
    increases. This may cause the leak to become obvious.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    **46.** During a vacuum test, it is noted that the needle oscillates rapidly as
    the engine RPM increases but it is steady and normal at idle. What would be the
    most likely cause?


    ![](bbox=[0.8, 0.59, 0.9, 0.68])


    +   A. Worn rings

    B. Sticky valves

    C. Weak valve springs

    D. A clogged exhaust system


    Answer A is incorrect. Worn rings will cause a low vacuum reading since the cylinder
    is not sealing properly.

    Answer B is incorrect. Sticky valves will show up as a steady and normal vacuum
    reading with occasional sharp flicks down.

    **Answer C is correct.** Weak valve springs will cause rapid needle oscillation
    as RPM increases. The valves will be slow to close causing poor cylinder evacuation.

    Answer D is incorrect. A clogged exhaust system will cause low vacuum readings
    when the RPM is held steady above 1,800 rpm, but at idle, the readings may be
    normal.'
