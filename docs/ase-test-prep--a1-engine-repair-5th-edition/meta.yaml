  md: '![](bbox=[0.105, 0.082, 0.182, 0.147])


    25. Timing belt replacement is being discussed. What is the first thing that should
    be done?

    A. Remove the harmonic balancer.

    B. Remove the water pump.

    C. Align all timing marks.

    D. Release the timing belt tensioner.


    Answer A is incorrect. The balancer would be removed after aligning the timing
    marks.

    Answer B is incorrect. The water pump may not have to be removed.

    **Answer C is correct.** All of the other choices may have to be done but the
    first step should be to align the timing marks.

    Answer D is incorrect. This would only be done after aligning the timing marks.


    ![](bbox=[0.105, 0.3, 0.182, 0.365])


    26. During a power balance test on a port fuel-injected engine, one cylinder is
    found to have virtually no RPM change. Which of these is the most likely cause?

    A. A faulty crankshaft position sensor

    B. A vacuum leak at the throttle body

    C. A defective plug wire

    D. A faulty camshaft position sensor


    Answer A is incorrect. A faulty crankshaft position sensor will affect all cylinders
    rather than just one.

    Answer B is incorrect. A vacuum leak at the throttle body will affect all cylinders.

    **Answer C is correct.** If the plug wire on that cylinder is defective, the cylinder
    will not fire and contribute to power.

    Answer D is incorrect. A faulty camshaft position sensor would affect all cylinders.


    ![](bbox=[0.105, 0.55, 0.182, 0.615])


    27. Technician A says that a cylinder bore that has a deep scratch can be repaired
    using a dingleberry hone. Technician B says that a cylinder bore that has 0.008
    inch taper does not need to be bored. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A deep scratch in the cylinder bore cannot be removed with
    a dingleberry hone; it will require a stone hone or boring.

    Answer B is incorrect. A cylinder bore with 0.008 inch taper must be bored straight
    to ensure proper sealing by the rings.

    Answer C is incorrect. Neither Technician is correct.

    **Answer D is correct.** Neither Technician is correct. Both cylinder bore conditions
    will require the cylinder to be bored.'
