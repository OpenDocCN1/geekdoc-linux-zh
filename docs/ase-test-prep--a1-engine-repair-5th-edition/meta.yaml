  md: '49. The threads in a water pump mounting hole have been damaged. Technician
    A says the threads may be drilled out oversize and tapped with the proper tap
    size and thread pitch to accept a larger diameter bolt. Technician B says the
    threads may be restored using a HeliCoil thread insert. Who is correct?


    ![](bbox=[0.79, 0.08, 0.88, 0.14])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. While a hole can be drilled oversize for a larger diameter
    bolt, the water pump may not have enough surface area around the corresponding
    hole to be drilled oversize. This would not be the preferred method to repair
    the threads.


    **Answer B is correct.** Only Technician B is correct. The preferred method to
    repair the threads would be to use a HeliCoil thread insert to renew the threads
    to the original size and thread pitch.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    50. A running (dynamic) compression test has been performed after a cranking compression
    test was done on a 4-cylinder engine. The results indicated cylinder #3 has substantially
    lower running compression than the other three. Cranking compression was within
    +/- 10 percent for all four cylinders. The running compression test results for
    cylinder #3 indicates:


    ![](bbox=[0.79, 0.39, 0.88, 0.45])


    +   A. A restriction in the exhaust for that cylinder.

    B. A restriction in the intake air on that cylinder.

    C. A stopped-up catalytic converter.

    D. A plugged air filter.


    Answer A is incorrect. A restriction in the exhaust flow from that cylinder would
    create a higher running compression test results. A sticky valve or restriction
    in the exhaust port for cylinder #3 would not allow the emptying of the cylinder,
    and the next intake stroke would increase the pressure in that cylinder.


    **Answer B is correct.** A restriction of intake for cylinder #3 would cause the
    running compression test results to be much lower as that cylinder is not ingesting
    as much air on the intake stroke.


    Answer C is incorrect. A stopped-up catalytic converter would cause higher than
    expected running test compression results since none of the cylinders would empty
    properly.


    Answer D is incorrect. A plugged air filter would restrict air intake to all cylinders,
    not just #3.'
