  md: '# # PREPARATION EXAM 1—EXPLANATIONS


    1. Technician A says that it is important to test drive the customer''s vehicle
    to verify the concern as a part of the diagnosis procedure. Technician B says
    it is always a good idea to check for associated technical service bulletins.
    Who is correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. A test drive lets you confirm
    the customer complaint, and checking for technical service bulletins may save
    diagnostic time.


    Answer D is incorrect. Both Technicians are correct.


    ![](bbox=[0.05, 0.11, 0.17, 0.2])


    2. Technician A says main bearing oil clearance can be checked with Plastigauge®.
    Technician B says main bearing oil clearance can be checked with a feeler gauge.
    Who is correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    **Answer A is correct.** Only Technician A is correct. Main bearing oil clearance
    can be checked with Plastigauge® by placing the Plastigauge® across the journal
    with the bearings installed and torquing the cap. Remove the cap and use the Plastigauge®
    scale; record the clearance.


    Answer B is incorrect. A feeler gauge is not a tool to check main bearing oil
    clearance. It will not conform to the journal to give an accurate reading.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.


    ![](bbox=[0.05, 0.37, 0.17, 0.46])


    3. Technician A says that when the fuel lines are reconnected on a replaced engine,
    the O-ring seals on the fuel lines must be replaced. Technician B says the injector
    O-rings should be replaced when they are reinstalled. Who is correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. Both the fuel line seals
    and injector seals must be replaced to ensure there is no fuel leakage.


    Answer D is incorrect. Both Technicians are correct.


