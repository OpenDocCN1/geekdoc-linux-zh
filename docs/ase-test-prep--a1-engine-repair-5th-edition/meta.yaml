    **Selective thrust washer** A washer or spacer that is furnished in different
    sizes to facilitate end-play and preload settings.


    **Skirt** A term used to describe the lower part of an engine piston. The skirt
    contacts the cylinder wall, helps the piston travel in a straight line, and prevents
    piston slap.


    **Solenoid** An electromechanical device used for a push-pull operation.


    **Span** A term used for the length or space between two parts; as in the span
    between the air conditioner compressor belt pulley and the alternator pulley is
    too great. This condition can cause the belts to fly off at high engine speeds
    or during rapid acceleration.


    **Spark plug** A component of the ignition system that delivers the high-voltage
    spark to the combustion chamber.


    **Starter drive** The part of the starter motor that engages the ring gear or
    the flywheel, flexplate, or torque converter, and rotates the engine on start
    up.


    **Starter motor** The small electric motor that is used to crank (start) an engine.


    **Starter solenoid** The part that causes the starter drive to engage the flywheel
    when starting an engine.


    **Tailpipe** The pipe from the muffler or catalytic converter that carries the
    exhaust gases away from the passenger compartment.


    **Temperature sensor** A term used for various temperature sensing switches or
    variable resistors on today''s vehicles. They can be used to turn cooling fans
    on and off, to operate dash gauges, to control air conditioners, and to furnish
    inputs to engine and transmission control computers.


    **Tensioner** A device used with timing belts and timing chains that maintains
    a constant pressure on the belt or chain to minimize wear and noise, and to take
    up slack or lost motion. They may be fixed and require periodic adjustment, or
    they may be automatically adjusted by spring tension or engine oil pressure. Tensioners
    are also used on accessory drive belts.


    **Timing belt** The belt through which the crankshaft drives the camshaft(s) in
    an overhead cam engine.


    **Torque wrench** A specially designed tightening device that indicates the amount
    of torque being exerted on a fastener to enable threaded parts to be tightened
    to a specified amount.


    **Torque-to-yield (TTY)** A term used to describe a common method of tightening
    fasteners on many of today''s engines. The procedure is to tighten the fasteners
    to a fairly low pounds-feet value, then to turn each fastener (in proper tightening
    sequence) a specified number of degrees. This process is usually used on head
    bolts, main bearing bolts, and rod-bearing bolts. In most cases, new fasteners
    are required for every reassembly.


    **True** A term used in the automotive industry to signify a part or system is
    correct and is within specifications. As in the cylinder head gasket sealing surface
    is true; i.e., it is not warped, scratched, broken, or otherwise damaged.


    **Valve float** A condition that occurs when the valve spring is not capable of
    closing the valve quickly enough. This usually happens at higher engine speeds,
    and is aggravated by the valve spring losing some of its tension. Improper sealing
    of the combustion chamber will occur and the engine will run poorly.


    **Valve lifter** A hydraulic or mechanical device in the valve train that rides
    on the camshaft lobe to lift the valve off of its seat.


    **Valve overlap** The amount of time measured in degrees during which the intake
    and exhaust valves are both open.


    **Valve rotator** A device that rotates the valve while the engine is running.


    **Valve spring installed height** The distance from the underside of the valve
    spring retainer to the cylinder head surface.


    **Valve spring retainer** A device on the valve stem that holds the spring in
    place.


    **Valve train** The parts making up the valve assembly and its operating mechanism.


    **Warpage** As in a cylinder head gasket, the sealing area is no longer being
    straight and true. This condition will require machine shop work on the cylinder
    head or a different cylinder head that is not warped.


    **Water pump** A mechanical device used to circulate coolant through the cooling
    system.


    **Witness marks** Lines scribed on adjacent surfaces of mating parts, before disassembly,
    to ensure proper alignment when reassembled.'
