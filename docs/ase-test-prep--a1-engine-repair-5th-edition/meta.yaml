    +   **No-start** A condition where the engine turns over normally but does not
    start. This could be caused by mechanical problems, fuel system problems, electrical
    problems, or electronic engine control problems.


    +   **Oil cooler** A heat exchanger used to cool transmission or engine oil. Also
    may be used to cool power steering or other fluids.


    +   **Oil filter** A device used to remove impurities, such as abrasive particles,
    from oil.


    +   **Oil pan** A removable part of the engine assembly that contains the oil
    supply.


    +   **Out of square** As in a valve spring that is not within specification when
    checked vertically on a flat surface and measured at a 90-degree angle. If installed
    in an engine, such a spring would cause side pressures on the valve and damage
