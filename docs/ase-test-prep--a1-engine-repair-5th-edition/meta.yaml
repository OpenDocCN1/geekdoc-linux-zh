    8. When preparing an engine for removal, which of the following would be done?


    A. Drain engine coolant.

    B. Drain engine oil.

    C. Disconnect fuel lines.

    D. All of the above


    Answer A is incorrect. Because hoses are connected to the engine, draining the
    engine coolant is necessary.


    Answer B is incorrect. Because the oil pan and filter must be removed after removing
    the engine, the oil must be drained.


    Answer C is incorrect. Because fuel lines are connected to the engine, they must
    be disconnected before the engine can be removed.


    **Answer D is correct.** All the fluids should be removed from the engine and
    fuel lines disconnected.


    ![](bbox=[0.07, 0.35, 0.175, 0.43])


    9. A technician is performing a cylinder leakage test and cylinder #3 has 45 percent
    leakage. Which is the LEAST LIKELY place the technician would look for escaping
    air?


    A. The cooling system

    B. The intake system

    C. The exhaust system

    D. The transmission dipstick


    Answer A is incorrect. The cooling system should be checked.


    Answer B is incorrect. The intake system should be checked.


    Answer C is incorrect. The exhaust system should be checked.


    **Answer D is correct.** The transmission will not show air leakage from a cylinder
    in the engine.


    ![](bbox=[0.07, 0.58, 0.175, 0.66])


