  md: '# 14. Inspect and measure camshaft journals and lobes; measure camshaft lift.


    To check camshaft straightness, rest the camshaft outer bearing journals on V-blocks
    and position a dial indicator against the middle cam bearing journal. Rotate the
    camshaft to determine runout. If the camshaft is not straight, replace it.


    To measure camshaft lobes, use a micrometer to measure from the highest point
    on the lobe to a point on the opposite side of the lobe; record the measurement.
    Measure the lobe again at a position 90° from the first measurement; subtracting
    the second measurement from the first gives camshaft lobe lift. Replace the camshaft
    if lift is not within specifications.


    Use a micrometer to measure the diameter of each camshaft journal. Measure this
    diameter in several locations. If the diameter is less than specified, replace
    the camshaft.


    Camshaft lobe lift can also be measured with the camshaft still in the engine
    by removing the valve cover and mounting a dial indicator on the cylinder head.
    Position the dial indicator so that it contacts the pushrod tip (rocker arm removed)
    or rocker arm directly above the pushrod (rocker arm still in place). The dial
    indicator stem must be parallel with the pushrod. Crank the engine by hand and
    note the highest and lowest dial indicator readings. The difference between these
    two numbers is camshaft lobe lift.


    # 15. Inspect and measure camshaft bore for wear, damage, out-of-round, and alignment;
    determine needed repairs.


    Inspect the camshaft bearing bores on a camshaft-in-block for scoring or other
    damage. Minor nicks or burrs can be removed with emery cloth. If the bearing bores
    are severely damaged, the block should be replaced.


    On overhead cam engines without removable bearing caps, check the bearing bores
    for damage. Minor nicks or burrs can be removed with emery cloth. If the camshaft
    is binding, or the bearing inserts are worn unevenly, use a straightedge to check
    bearing bore alignment. If the bores are out of alignment, the head is warped
    and should be straightened or replaced.


    On overhead cam engines with removable camshaft bearing caps, the camshaft usually
    runs directly against the aluminum head. After removing the bearing caps and the
    cam, place a straightedge across the cam bearing surfaces to measure bearing alignment.
    Measure the clearance between the straightedge and each bearing bore to determine
    the bore alignment. When the camshaft bearing bores are improperly aligned, replace
    the cylinder head. Check the bearing surfaces for scoring and other damage. To
    measure bearing bore out of round, install the bearing caps and torque the retaining
    bolts to specifications. Then measure bore diameter at several locations around
    the bore using a telescoping gauge. If the bearing surfaces and bores are in good
    condition, use Plastigauge® to measure the bearing clearance.


    # 16. Inspect valve timing; time camshaft(s) to crankshaft.


    With the timing belt or chain cover removed, camshaft timing may be checked by
    noting the positions of marks on the camshaft and crankshaft sprockets. These
    marks must be aligned as indicated in the vehicle manufacturer''s service manual.


    On many OHV pushrod engines, the crankshaft sprocket is installed on the crankshaft
    nose and the crankshaft is rotated to position piston #1 at TDC. At this point,
    a mark'
  merge: -1
  pgno: 33
- img_proc: false
  md: 'stamped onto the crankshaft sprocket is pointing directly upward toward the
    camshaft. The camshaft sprocket is then temporarily bolted to the cam and used
    to rotate the cam until a mark stamped on the cam sprocket is pointing directly
    downward toward the crankshaft. The sprocket is then removed from the cam without
    allowing the cam to rotate. The timing chain is looped over the cam gear, the
    mark on the cam gear is positioned directly downward, and the chain is looped
    around the crankshaft sprocket. When the cam sprocket is attached to the cam,
    the timing marks on the crank and cam sprockets should be pointing toward one
    another.


    Single overhead camshaft engines fitted with a timing belt often use a similar
    procedure. After positioning the crankshaft so that piston #1 is at TDC with the
    crank gear timing marks aligned with the timing marks on the block, the camshaft
    is rotated to align a mark on the cam sprocket with a mark on the cylinder head.
    The timing belt is then installed.


    The procedure used to time camshafts on double overhead camshaft (DOHC) engines
    varies from manufacturer to manufacturer. On some engines the cam sprockets are
    friction fitted to the cams. On these engines the cams can be rotated after the
    timing belt is installed. When the cams are rotated to the proper positions, the
    bolts locking the cam sprockets to the cams are tightened. Other DOHC engines
    use a procedure similar to that of many SOHC engines.


    Valve timing may be checked by observing the valve position in relation to the
    piston position. With any piston at TDC on the compression stroke, the intake
    and exhaust valves for that cylinder should be completely closed. When the piston
    is at TDC on the exhaust stroke, the intake valve should be opening and the exhaust
    valve should be closing. This position is called valve overlap. If the valves
    do not open properly in relation to the crankshaft position, the valve timing
    is not right. After timing component replacement, the timing mark alignment should
    be rechecked by turning the crankshaft two complete revolutions, ending on #1
    cylinder TDC compression stroke; all timing marks should line up. If the marks
    fail to line up, the engine must be retimed following OEM procedures. Incorrect
    valve timing may cause low power or, in extreme cases, bent valves due to piston-to-valve
    contact.


    # 17. Inspect cylinder head mating surface condition and finish; reassemble and
    install gasket(s) and cylinder head(s); replace/torque bolts according to manufacturer''s
    procedures.


    Clean and inspect the cylinder block deck in preparation for head installation.
    Make sure that all head positioning dowels, if used, are in place in the block.
    Run a thread chaser into the cylinder head bolt threaded holes. Use compressed
    air to eject any debris from the threaded holes. Always wear eye protection when
    using compressed air to clean surfaces or openings. Allowing debris or fluid to
    remain in threaded holes will cause false torque readings when the head bolts
    are tightened. Coolant or combustion leaks may result. If the holes are blind
    holes, fluid or debris at the bottom of the holes may cause the block to crack
    when the bolts are tightened.


    Many newer engines are fitted with torque-to-yield (TTY) cylinder head bolts.
    These bolts are usually tightened to a specific torque and then rotated tighter
    a specified number of degrees. TTY bolts are permanently stretched as they are
    tightened and produce a more uniform clamping force. Most, but not all, TTY bolts
    must be replaced with new bolts once they are loosened. Check the manufacturer''s
    service manual for information.'
