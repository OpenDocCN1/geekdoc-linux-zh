    11. The catalytic converter is overheating causing it to glow bright red and heat
    the passenger''s floorboard. There is also a strong sulfur odor from the exhaust.
    The cause of this could be:


    A. Improper coolant in the engine.

    B. A vacuum leak.

    C. Too low a fuel octane.

    D. A rich fuel mixture.


    Answer A is incorrect. Improper coolant will not affect the converter.


    Answer B is incorrect. A vacuum leak will not cause an exhaust odor.


    Answer C is incorrect. The wrong fuel octane may cause spark knock but will not
    cause the converter to overheat.


    **Answer D is correct.** Too rich a fuel mixture can cause the excess fuel to
    burn in the converter and overheat it, causing a strong sulfur odor.'
