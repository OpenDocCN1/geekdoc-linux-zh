  md: '# Section 6 Answer Keys and Explanations Engine Repair (A1)


    16. Technician A says that hot tanking an engine block after boring is sufficient
    cleaning before reassembly. Technician B says that cleaning the bores and block
    with hot soapy water and a bore brush ensures that all machining particles are
    removed. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. The bore must be scrubbed with soap and water using a bore
    brush to remove machining particles.


    **Answer B is correct.** Only Technician B is correct. The proper way to clean
    a block and its bores is with soap, water, and a bore brush. The block should
    then be treated with a protective coating to keep it from rusting.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    17. Technician A says a running (dynamic) compression test is used to check cylinder
    breathing. Technician B says a running (dynamic) compression test is used to check
    cylinder sealing. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    **Answer A is correct.** Only Technician A is correct. A running compression test
    is used to check cylinder breathing and a cranking compression test is used to
    check cylinder sealing.


    Answer B is incorrect. A cranking compression test is used to check cylinder sealing,
    not breathing.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.


    18. Technician A says that incorrect valve adjustment may cause bent valves. Technician
    B says incorrect valve adjustment will not affect performance. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    **Answer A is correct.** Only Technician A is correct. Valves that are adjusted
    too tight may cause bent valves.


    Answer B is incorrect. Incorrect valve adjustment will cause engine performance
    problems.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.'
