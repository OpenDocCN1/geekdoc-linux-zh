    16. Reduced turbocharger boost pressure may be caused by a:


    +   A. Wastegate valve stuck open.

    B. Leaking wastegate diaphragm.

    C. Disconnected wastegate linkage.

    D. Wastegate stuck closed.


    **Answer A is correct.** A stuck open wastegate will bypass all exhaust from the
    turbo wheel.


    Answer B is incorrect. A leaking wastegate diaphragm will apply excessive boost.


    Answer C is incorrect. Disconnected wastegate linkage will allow constant boost.


    Answer D is incorrect. A stuck closed wastegate will apply excessive boost.


    ![](bbox=[0.1, 0.61, 0.19, 0.695])


    17. A heater hose is being replaced and the technician finds it is stuck on the
    hose nipple. Which of the following is the best solution to the problem?


    +   A. Use pliers to twist the hose off.

    B. Run a screwdriver between the hose and the nipple and pry it off.

    C. Twist the hose by hand and pull on it at the same time.

    D. Slice the hose lengthwise and peel it off.


    Answer A is incorrect. Using pliers to twist the hose off will damage the hose
    nipple, making it difficult to seal a new hose.


    Answer B is incorrect. The screwdriver will also damage the hose nipple.


    Answer C is incorrect. Twisting the hose by hand may break the hose nipple from
    the heater core. Heater cores are easily damaged.


    **Answer D is correct.** A stuck hose should be split and peeled off to avoid
    damaging the hose nipple or the heater core.'
