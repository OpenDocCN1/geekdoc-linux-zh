    ![](bbox=[0.08, 0.075, 0.175, 0.16])


    **33.** When inspected, the crankshaft bearings that exhibit more wear on the
    bearings the furthest from the oil pump, which is less noticeable as you get closer
    to the oil pump. What is the most likely reason for the wear?


    A. Engine overloading at low RPM

    B. Over-tightened accessory belts

    C. Dry starts

    D. A warped crankshaft


    Answer A is incorrect. Engine overloading would cause wear on all the lower main
    bearings.


    Answer B is incorrect. Wear from over-tightened accessory belts would start at
    the top of main bearing #1 and transfer to the lower bearing on the last journal.


    **Answer C is correct.** A condition known as dry starts occurs when the engine
    has not been operated in a while. If there is no oil on the main bearing surfaces
    and during start up, the last journal to get oil pressure will show more wear.


    Answer D is incorrect. A warped crankshaft will usually show up as excessive wear
    on one or two of the center main bearings.


    ![](bbox=[0.08, 0.355, 0.175, 0.44])


    **34.** An engine idles rough and the technician notes a high-pitch whistle from
    the engine compartment. Which of the following would most likely be the cause?


    A. A slipping fan belt

    B. A leaking exhaust pipe

    C. A defective alternator bearing

    D. A vacuum leak on the intake


    Answer A is incorrect. A slipping fan belt will squeal, not whistle.


    Answer B is incorrect. A leaking exhaust manifold will make a popping noise or
    rumbling.


    Answer C is incorrect. A defective alternator bearing will growl.


    **Answer D is correct.** A vacuum leak on the intake can cause a rough idle if
    it is after the airflow meter. Due to unmetered air entering the engine, it will
    cause a high-pitch whistle as the air is drawn into the engine.


