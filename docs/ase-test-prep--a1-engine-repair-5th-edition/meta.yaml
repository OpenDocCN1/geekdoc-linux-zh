    Rotate the crankshaft to position the crank pin for the piston/rod being installed
    at bottom dead center (BDC). Lubricate the piston, rings, wrist pin, and cylinder
    bore with clean motor oil. Install a ring compressor on the piston and slide the
    piston/rod into the block. Push the rod body against the crank pin, remove the
    rubber protective hose, and temporarily install the rod cap and nuts. Install
