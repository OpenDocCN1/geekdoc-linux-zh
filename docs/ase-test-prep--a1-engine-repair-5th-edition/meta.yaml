  md: '# # SECTION 2 Overview and Introduction


    Participating in the National Institute for Automotive Service Excellence (ASE)
    voluntary certification program provides you with the opportunity to demonstrate
    you are a qualified and skilled professional technician who has the "know-how"
    required to successfully work on today''s modern vehicles.


    # ## EXAM ADMINISTRATION


    > > **Note:** After November 2011, ASE will no longer offer paper and pencil certification
    exams. There will be no Winter testing window in 2012, and ASE will offer and
    support CBT testing exclusively starting in April 2012.


    ASE provides computer-based testing (CBT) exams, which are administered at test
    centers across the nation. It is recommended that you go to the ASE website at
    http://www.ase.com and review the conditions and requirements for this type of
    exam. There is also an exam demonstration page that allows you to personally experience
    how this type of exam operates before you register.


    CBT exams are available four times annually, for two-month windows, with a month
    of no testing in between each testing window:


    +   - January/February—Winter testing window

    - April/May—Spring testing window

    - July/August—Summer testing window

    - October/November—Fall testing window


    Please note, testing windows and timing may change. It is recommended you go to
    the ASE website at http://www.ase.com and review the latest testing schedules.


    # ## UNDERSTANDING TEST QUESTION BASICS


    ASE exam questions are written by service industry experts. Each question on an
    exam is created during an ASE-hosted "item-writing" workshop. During these workshops,
    expert service representatives from manufacturers (domestic and import), aftermarket
    parts and equipment manufacturers, working technicians, and technical educators
    gather to share ideas and convert them into actual exam questions. Each exam question
    written by these experts must then survive review by all members of the group.
    The questions are designed to address the practical application of repair and
    diagnosis knowledge and skills practiced by technicians in their day-to-day work.


    After the item-writing workshop, all questions are pre-tested and quality-checked
    on a national sample of technicians. Those questions that meet ASE standards of
    quality and accuracy are'
  merge: -1
  pgno: 9
- img_proc: false
  md: 'included in the scored sections of the exams; the "rejects" are sent back to
    the drawing board or discarded altogether.


    Depending on the topic of the certification exam, you will be asked between 40
    and 80 multiple-choice questions. You can determine the approximate number of
    questions you can expect to be asked during the Engine Repair (A1) certification
    exam by reviewing the task list in Section 4 of this book. The five-year recertification
    exam will cover this same content; however, the number of questions for each content
    area of the recertification exam will be reduced by approximately one-half.


    > *Note:* Exams may contain questions that are included for statistical research
    purposes only. Your answers to these questions will not affect your score, but
    since you do not know which ones they are, you should answer all questions in
    the exam.


    Using multiple criteria, including cross-sections by age, race, and other background
    information, ASE is able to guarantee that exam questions do not include bias
    for or against any particular group. A question that shows bias toward any particular
    group is discarded.


    # TEST-TAKING STRATEGIES


    Before beginning your exam, quickly look over the exam to determine the total
    number of questions that you will need to answer. Having this knowledge will help
    you manage your time throughout the exam to ensure you have enough available to
    answer all of the questions presented. Read through each question completely before
    marking your answer. Answer the questions in the order they appear on the exam.
    Leave the questions blank that you are not sure of and move on to the next question.
    You can return to those unanswered questions after you have finished the others.
    These questions may actually be easier to answer at a later time once your mind
    has had additional time to consider them on a subconscious level. In addition,
    you might find information in other questions that will help you recall the answers
    to some of them.


    Multiple-choice exams are sometimes challenging because there are often several
    choices that may seem possible, or partially correct, and therefore it may be
    difficult to decide on the most appropriate answer choice. The best strategy,
    in this case, is to first determine the correct answer before looking at the answer
    options. If you see the answer you decided on, you should still be careful to
    examine the other answer options to make sure that none seem more correct than
    yours. If you do not know or are not sure of the answer, read each option very
    carefully and try to eliminate those options that you know are incorrect. That
    way, you can often arrive at the correct choice through a process of elimination.


    If you have gone through the entire exam, and you still do not know the answer
    to some of the questions, *then guess.* Yes, guess. You then have at least a 25
    percent chance of being correct. While your score is based on the number of questions
    answered correctly, any question left blank, or unanswered, is automatically scored
    as incorrect.


    There is a lot of "folk" wisdom on the subject of test taking that you may hear
    about as you prepare for your ASE exam. For example, there are those who would
    advise you to avoid response options that use certain words such as *all, none,
    always, never, must,* and *only*, to name a few. This, they claim, is because
    nothing in life is exclusive. They would advise you to choose response options
    that use words that allow for some exception, such as *sometimes, frequently,
    rarely, often, usually, seldom,* and *normally*. They would also advise you to
    avoid the first and last option (A or D) because exam writers, they feel, are
    more comfortable if they put the correct answer in the middle (B or C) of the
    choices. Another recommendation often offered is to select the option that is
    either shorter or longer than the other three choices because it is more likely
    to be correct. Some would advise you to never change an answer since your first
    intuition is usually correct. Another area of "folk" wisdom focuses specifically
    on any repetitive patterns created by your question responses (e.g., A, B, C,
    A, B, C, A, B, C).'
  merge: -1
  pgno: 10
- img_proc: false
  md: 'Many individuals may say that there are actual grains of truth in this “folk”
    wisdom, and whereas with some exams, this may prove true, it is not relevant in
    regard to the ASE certification exams. ASE validates all exam questions and test
    forms through a national sample of technicians, and only those questions and test
    forms that meet ASE standards of quality and accuracy are included in the scored
    sections of the exams. Any biased questions or patterns are discarded altogether,
    and therefore, it is highly unlikely you will experience any of this “folk” wisdom
    on an actual ASE exam.


    # PREPARING FOR THE EXAM


    Delmar, Cengage Learning wants to make sure we are providing you with the most
    thorough preparation guide possible. To demonstrate this, we have included hundreds
    of preparation questions in this guide. These questions are designed to provide
    as many opportunities as possible to prepare you to successfully pass your ASE
    exam. The preparation approach we recommend and outline in this book is designed
    to help you build confidence in demonstrating what task area content you already
    know well while also outlining what areas you should review in more detail prior
    to the actual exam.


    We recommend that your first step in the preparation process should be to thoroughly
    review Section 3 of this book. This section contains a description and explanation
    of the type of questions you''ll find on an ASE exam.


    Once you understand how the questions will be presented, we then recommend that
    you thoroughly review Section 4 of this book. This section contains information
    that will help you establish an understanding of what the exam will be evaluating,
    and specifically, how many questions to expect in each specific task area.


    As your third preparatory step, we recommend you complete your first preparation
    exam, located in Section 5 of this book. Answer one question at a time. After
    you answer each question, review the answer and question explanation information
    located in Section 6. This section will provide you with instant response feedback,
    allowing you to gauge your progress, one question at a time, throughout this first
    preparation exam. If after reading the question explanation you do not feel you
    understand the reasoning for the correct answer, go back and review the task list
    overview (Section 4) for the task that is related to that question. Included with
    each question explanation is a clear identifier of the task area that is being
    assessed (e.g., Task A.1). If at that point you still do not feel you have a solid
    understanding of the material, identify a good source of information on the topic,
    such as an educational course, textbook, or other related source of topical learning,
    and do some additional studying.


    ![](bbox=[0.51, 0.66, 0.58, 0.71])


    After you have completed your first preparation exam and have reviewed your answers,
    you are ready to complete your next preparation exam. A total of six practice
    exams are available in Section 5 of this book. For your second preparation exam,
    we recommend that you answer the questions as if you were taking the actual exam.
    Do not use any reference material or allow any interruptions in order to get a
    feel for how you will do on the actual exam. Once you have answered all of the
    questions, grade your results using the Answer Key in Section 6. For every question
    that you gave an incorrect answer to, study the explanations to the answers and/or
    the overview of the related task areas. Try to determine the root cause for missing
    the question. The easiest thing to correct is learning the correct technical content.
    The hardest things to correct are behaviors that lead you to an incorrect conclusion.
    If you knew the information but still got the question incorrect, there is likely
    a test-taking behavior that will need to be corrected. An example of this would
    be reading too quickly and skipping over words that affect your reasoning. If
    you can identify what you did that caused you to answer the question incorrectly,
    you can eliminate that cause and improve your score.'
  merge: -1
  pgno: 11
- img_proc: false
  md: 'Here are some basic guidelines to follow while preparing for the exam:


    +   - Focus your studies on those areas you are weak in.

    - Be honest with yourself when determining if you understand something.

    - Study often but for short periods of time.

    - Remove yourself from all distractions when studying.

    - Keep in mind that the goal of studying is not just to pass the exam; the real
    goal is to learn.

    - Prepare physically by getting a good night''s rest before the exam, and eat
    meals that provide energy but do not cause discomfort.

    - Arrive early to the exam site to avoid long waits as test candidates check in.

    - Use all of the time available for your exams. If you finish early, spend the
    remaining time reviewing your answers.

    - Do not leave any questions unanswered. If absolutely necessary, guess. All unanswered
    questions are automatically scored as incorrect.


    Here are some items you will need to bring with you to the exam site:


    +   - A valid government or school-issued photo ID

    - Your test center admissions ticket

    - A watch (not all test sites have clocks)


    > Note: Books, calculators, and other reference materials are not allowed in the
    exam room. The exceptions to this list are English-Foreign dictionaries or glossaries.
    All items will be inspected before and after testing.


    # WHAT TO EXPECT DURING THE EXAM


    When taking a CBT exam, as soon as you are seated in the testing center, you will
    be given a brief tutorial to acquaint you with the computer-delivered test prior
    to taking your certification exam(s). The CBT exams allow you to select only one
    answer per question. You can also change your answers as many times as you like.
    When you select a second answer choice, the CBT will automatically unselect your
    first answer choice. If you want to skip a question to return to later, you can
    utilize the "flag" feature, which will allow you to quickly identify and review
    questions whenever you are ready. Prior to completing your exam, you will also
    be provided with an opportunity to review your answers and address any unanswered
    questions.


    # TESTING TIME


    Each individual ASE CBT exam has a fixed time limit. Individual exam time will
    vary based upon exam area, and will range anywhere from a half hour to two hours.
    You will also be given an additional 30 minutes beyond what is allotted to complete
    your exams to ensure you have adequate time to perform all necessary check-in
    procedures, complete a brief CBT tutorial, and potentially complete a post-test
    survey.


    You can register for and take multiple CBT exams during one testing appointment.
    The maximum time allotment for a CBT appointment is four and a half hours. If
    you happen to register for so many exams that you will require more time than
    this, your exams will be scheduled into multiple'
  merge: -1
  pgno: 12
- img_proc: false
  md: 'appointments. This could mean that you have testing on both the morning and
    afternoon of the same day, or they could be scheduled on different days, depending
    on your personal preference and the test center''s schedule.


    It is important to understand that if you arrive late for your CBT test appointment,
    you will not be able to make up any missed time. You will only have the scheduled
    amount of time remaining in your appointment to complete your exam(s).


    Also, while most people finish their CBT exams within the time allowed, others
    might feel rushed or not be able to finish the test, due to the implied stress
    of a specific, individual time limit allotment. Before you register for the CBT
    exams, you should review the number of exam questions that will be asked along
    with the amount of time allotted for that exam to determine whether you feel comfortable
    with the designated time limitation or not.


    As an overall time management recommendation, you should monitor your progress
    and set a time limit you will follow with regard to how much time you will spend
    on each individual exam question. This should be based on the total number of
    questions you will be answering.


    Also, it is very important to note that if for any reason you wish to leave the
    testing room during an exam, you must first ask permission. If you happen to finish
    your exam(s) early and wish to leave the testing site before your designated session
    appointment is completed, you are permitted to do so only during specified dismissal
    periods.


    # UNDERSTANDING HOW YOUR EXAM IS SCORED


    You can gain a better perspective about the ASE certification exams if you understand
    how they are scored. ASE exams are scored by an independent organization having
    no vested interest in ASE or in the automotive industry. With CBT exams, you will
    receive your exam scores immediately.


    Each question carries the same weight as any other question. For example, if there
    are 50 questions, each is worth 2 percent of the total score.


    Your exam results can tell you:


    +   - Where your knowledge equals or exceeds that needed for competent performance,
    or

    - Where you might need more preparation.


    Your ASE exam score report is divided into content "task" areas; it will show
    the number of questions in each content area and how many of your answers were
    correct. These numbers provide information about your performance in each area
    of the exam. However, because there may be a different number of questions in
    each content area of the exam, a high percentage of correct answers in an area
    with few questions may not offset a low percentage in an area with many questions.


    It should be noted that one does not "fail" an ASE exam. The technician who does
    not pass is simply told "More Preparation Needed." Though large differences in
    percentages may indicate problem areas, it is important to consider how many questions
    were asked in each area. Since each exam evaluates all phases of the work involved
    in a service specialty, you should be prepared in each area. A low score in one
    area could keep you from passing an entire exam. If you do not pass the exam,
    you may take it again at any time it is scheduled to be administered.


    There is no such thing as average. You cannot determine your overall exam score
    by adding the percentages given for each task area and dividing by the number
    of areas. It doesn''t work that way because there generally are not the same number
    of questions in each task area. A task area with 20 questions, for example, counts
    more toward your total score than a task area with 10 questions.


    Your exam report should give you a good picture of your results and a better understanding
    of your strengths and areas needing improvement for each task area.'
