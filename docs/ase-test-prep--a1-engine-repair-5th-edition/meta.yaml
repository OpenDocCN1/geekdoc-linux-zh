  md: 'of the pan will prevent an accurate test. Heat the water while observing the
    thermostat valve and the thermometer. The thermostat valve should begin to open
    when the temperature on the thermometer is equal to the rated temperature stamped
    on the thermostat. Replace the thermostat if it does not open at the rated temperature.


    Always replace a thermostat with one having the correct temperature rating. Do
    not install a "hotter" thermostat in an attempt to speed up engine warm-up time.
    The engine will warm up at the same rate, but operate at a higher temperature.
    Do not remove a functioning thermostat from an engine that is overheating. While
    the engine may stop overheating, coolant will flow through the engine too quickly
    to absorb heat adequately. Hot spots will develop in the cooling system, especially
    in the cylinder heads. A cracked head can result.


    Be sure to install a thermostat in the correct direction and orientation. Many
    thermostats have an arrow indicating which way coolant should flow through the
    thermostat. Some thermostats have a vent hole, "jiggle" pin, or check ball assembly
    mounted toward the edge of the mounting flange. This device, which allows trapped
    air to pass through the thermostat, must be oriented properly. In most cases,
    the device must point upward. Check the engine manufacturer''s service manual
    for instructions.


    Inspect the thermostat housing and by-pass hose (if equipped) for cracks, deterioration,
    and restrictions. Thermostat housings are often made of sheet metal or a light
    alloy that corrodes rapidly when coolant is not changed at the recommended intervals.
    Replace a deteriorated thermostat housing or by-pass hose.


    # 10. Inspect and test coolant; drain, flush, and refill cooling system with recommended
    coolant; bleed air as required.


    Cooling system service is a topic approached differently by technicians in different
    repair venues. We will offer information that should be generic to all repair
    technicians. During an ASE test writing workshop, the participants must all agree
    on the content of the test so manufacturer specific items will not appear in the
    test unless they are considered industry standard. It is very important to keep
    this in mind when taking the test.


    When testing coolant, there are many methods to arrive at results but the ultimate
    results are the same. We want to know the protection levels of the coolant for
    freezing, boiling, PH, corrosion protection, and in some vehicles, nitrites. Let''s
    take a quick look at each area.


    Freezing and boiling protection are linked for the most part. Most manufacturers
    agree that a mixture of 50 per cent water to 50 per cent coolant provides the
    best of both worlds in this area and the best component protection. All manufacturers
    will also agree that you should be sure to use the correct coolant in the vehicle
    without mixing coolant types or changing to one not designed for the vehicle.


    PH is a measurement of the acidity or alkaline qualities of the coolant. As coolant
    becomes older, it drops toward the acid end of the PH scale. Most Asian manufactured
    vehicles aim for around 7–9 and most American and European manufactured vehicles
    aim for 8–9.5 on the scale. Low PH readings can be due to a deteriorated antifreeze
    condition or a water-heavy blend, as water is more toward the acidic side than
    a coolant mix is. Very high numbers can be caused by over adding antifreeze or
    corrosion packages during service.


    In normal use, vehicles with high output ignition systems, particularly DIS systems,
    will cause the coolant to become electrically charged which promotes debris in
    the system to adhere to metal parts and can cause radiator restriction. This can
    really only be corrected by replacing the antifreeze or reversing the charge in
    the system by using some ionizing coolant recovery systems.'
  merge: -1
  pgno: 52
- img_proc: false
  md: 'Corrosion protection is added when servicing the cooling system with recovery/recycling
    equipment and is in the antifreeze to begin with. This is a difficult area to
    test and a bone of contention with manufacturers who do not support coolant recycling.


    The last area that will become more critical as more diesel vehicles enter the
    consumer market is nitrites. When out of balance they cause small bubbles to collect
    on castings while the engine is running. These bubbles act like little cutters
    over time and carve into the casting. The vibration inherent in the diesel combustion
    process has been known to cause bubbles in the system to create leaks in cylinder
    walls. There are test strips available that detect the level of nitrites and currently
    only a couple of manufacturers have any specifications for them.


    On some vehicles, air pockets tend to develop in the cooling system as it is filled.
    If these air pockets are not bled off, engine overheating and even a cracked cylinder
    head can result. Some engines have a bleed fitting installed on the thermostat
    housing or an engine coolant passage to release trapped air. Loosen this fitting
    until all air is removed. On engines that do not have a bleed fitting, locate
    the highest point in the cooling system. If this point is a hose connection, loosen
    the hose to bleed off air. If a high point to bleed the system is not available,
    there are tools available that help to push the coolant from the bottom up, displacing
    any air locks before the vehicle is started.


    # 11. Inspect and replace water pump.


    Check the water pump for leaking hose connections, mounting gaskets, and seals.
    Slow or hard-to-find leaks may be easier to find if a cooling system pressure
    tester is connected to the radiator filler neck.


    Locate and examine the vent, or weep hole, in the water pump housing. The hole
    is usually in the underside of the housing, so use a small inspection mirror if
    necessary. If the water pump seal is leaking, coolant will usually drip from the
    weep hole. A very slow leak may leave only coolant residue around the hole. Replace
    the pump if there is evidence of coolant at the weep hole.


    > A defective water pump bearing may cause a growling noise at idle speed. In
    some cases, the bearing starts to fail after being contaminated by coolant leaking
    past the pump seal.


    > With the engine shut off, grasp the fan blades or the water pump pulley, and
    try to move it from side to side. This will reveal any looseness in the water
    pump bearing. If there is any side-to-side movement in the bearing, the water
    pump should be replaced.


    When replacing a pump, always compare the new pump to the old one. Two pumps may
    look very similar, but their impellers may rotate in opposite directions. In this
    case, the impeller blades will be shaped differently and installing the wrong
    pump will cause the engine to overheat.


    On many engines, some of the water pump mounting bolts extend into the block water
    jacket. Be sure to use the specified sealant on these bolts or coolant may leak
    from the engine. The bolts may also seize in place, making future servicing difficult.
    Refer to the manufacturer''s service manual for information to determine which
    bolts enter the water jacket.


    # 12. Inspect and test fan (both electrical and mechanical), fan clutch, fan shroud,
    air dams, and cooling fan electrical circuits; repair or replace as required.


    On rear-wheel drive vehicles, the engine cooling fan is usually mounted to the
    water pump shaft and belt driven off the crankshaft. Plain, direct-drive fan blade
    assemblies'
  merge: -1
  pgno: 53
- img_proc: false
  md: 'should be checked for loose mounting bolts, cracked blades, and loose rivets
    (if fan blades are riveted to a hub). A fan assembly that has any cracks should
    be replaced immediately.


    Fans with temperature sensitive clutches should be checked for bad bearings, leaking
    fluid, and seized or free-wheeling clutches. With the engine off, try to spin
    the fan by hand. It should spin smoothly with some resistance. If the bearing
    feels rough, or the fan spins without resistance, replace the clutch assembly.
    Grasp the fan blades and try to rock the fan from side to side. Too much play
    indicates a bad bearing and the clutch should be replaced. Check the bimetal coil
    on the front of the clutch. If it is wet or covered with dirt and grime, silicone
    fluid is leaking out of the fluid reservoir and the clutch should be replaced.


    To check for a seized fan clutch, start the engine and observe fan speed. When
    the engine is cold, the fan should not pull much air through the radiator, even
    when the engine is revved. As the engine warms up, fan speed and noise should
    increase noticeably. If fan noise and speed seem excessive, stop the engine and
    put paint marks on the fan pulley and the back of the fan clutch. Hook up an engine
    timing light and start the engine. When the timing light is pointed at the back
    of the fan clutch, the paint marks should move relative to one another. If the
    paint marks stay together as engine speed is varied, the clutch is seized and
    must be replaced.


    Front-wheel drive vehicles are usually fitted with electrically powered fans.
    The fan operates only when necessary. Some fans have both high and low speeds;
    others have just one speed. Fan operation is usually triggered by coolant temperature
    and/or A/C system operation. In some systems, a temperature sensitive fan switch
    is threaded into a radiator tank or an engine part to sense coolant temperature.
    When coolant temperature approaches the upper limit of the normal operating range,
    the switch contacts close to turn on the fan. When coolant temperature drops to
    a preset value, the switch contacts open to turn off the fan. Some switches supply
    power or ground directly to the fan motor; others activate a relay which then
    powers the fan. In other systems, fan operation is controlled by the PCM, which
    obtains coolant temperature information from its engine coolant temperature sensor.
    When coolant temperature reaches a preset value, the computer activates the fan
    and continues to monitor coolant temperature. When the temperature drops to a
    preset value, the computer turns off the fan. Also note that some PCM controlled
    fans operate at variable speeds, dependent on load.


    Coolant temperature switches can be normally open or normally closed, and sensor
    resistance specifications vary. Refer to the vehicle manufacturer''s service manual
    to determine how the system you are working on operates.


    When a vehicle is equipped with air conditioning, turning on the system usually
    activates the engine cooling fan automatically. In some cases, however, the fan
    is not turned on until refrigerant pressure reaches a preset value. Again, refer
    to the vehicle manufacturer''s service manual for information.


    Fan shrouds and air dams are an important part of a vehicle''s cooling system;
    they should be in place and undamaged. The purpose of a fan shroud is to allow
    a round fan to create a low-pressure zone behind the entire radiator core. The
    purpose of an air dam is to create a high-pressure zone in front of the radiator.
    Both components encourage air flow through the radiator under different circumstances.
    The fan shroud supports good air flow at low speeds and the air dam supports good
    air flow at highway speeds. This would lead us to keep in mind that a vehicle
    that overheats at highway speeds may have a problem with the air dam, and a vehicle
    that overheats in traffic could have a problem with the fan shroud. The most common
    problems are that the fan shrouds and/or air dams are broken or missing.'
