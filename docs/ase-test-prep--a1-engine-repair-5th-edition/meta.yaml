  md: '# PREPARATION EXAM 3—EXPLANATIONS


    1. Technician A says a reverse flow cooling system will warm an engine up quicker
    than conventional flow. Technician B says a reverse flow cooling system directs
    coolant to the block and then to the head. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    **Answer A is correct.** Only Technician A is correct. A reverse flow cooling
    system directs the coolant through the head, which is the hottest portion of the
    engine, first and then through the block; the engine warms up quicker and produces
    fewer emissions during warm-up.


    Answer B is incorrect. A reverse flow cooling system directs the coolant to the
    head and then to the block.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.


    2. Technician A says that it is important to test drive the customer''s vehicle
    to verify the concern as a part of the diagnosis procedure. Technician B says
    it is always a good idea to check for associated technical service bulletins.
    Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. A test drive lets you confirm
    the customer''s complaint and checking for technical service bulletins may save
    diagnostic time.


    Answer D is incorrect. Both Technicians are correct.


    3. Technician A says that when measuring piston ring groove-to-ring clearance,
    you should place the ring into the groove and measure clearance with a feeler
    gauge. Technician B says the ring groove clearance is the same as the ring end
    gap clearance. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    **Answer A is correct.** Only Technician A is correct. The clearance between the
    ring and the ring land must be within manufacturer''s specifications. Too wide
    a clearance will cause ring flutter and damage; too small a clearance and the
    ring will bind in the land and seize, causing a loss of compression.


    Answer B is incorrect. The clearance between the ring and ring land is usually
    between 0.0005 and 0.001 inch; ring end gap is much larger. Manufacturer''s specifications
    should be checked for each engine to ensure proper fit.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.'
