  md: '12. All lifters in an overhead valve engine are cupped (concave). Technician
    A says the lifters can be replaced with no further parts replacement. Technician
    B says that they can be replaced with roller lifters for longer life. Who is correct?


    ![](bbox=[0.09, 0.07, 0.18, 0.15])


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A worn lifter indicates a worn camshaft lobe. If the lifter
    is replaced without replacing the camshaft, it will fail in a short time.


    Answer B is incorrect. A roller lifter cannot be used with a flat tappet camshaft.
    The lobe on a flat tappet cam is slightly tapered to cause the lifter to spin;
    a roller camshaft is flat across the lobe.


    Answer C is incorrect. Neither Technician is correct.


    Answer D is correct. Neither Technician is correct. A camshaft and flat tappet
    lifters wear to mate during break-in and normal use. If one is replaced, it is
    recommended to replace both components. Roller lifters would only contact the
    flat tappet cam in one small area. They are not made for use with the profile
    of a flat tappet camshaft.


    ![](bbox=[0.09, 0.41, 0.18, 0.49])


    13. Technician A says a PCV valve hose that is restricted could cause oil accumulation
    in the air cleaner. Technician B says a PCV valve hose that is restricted will
    cause a stumble on acceleration. Who is correct?


