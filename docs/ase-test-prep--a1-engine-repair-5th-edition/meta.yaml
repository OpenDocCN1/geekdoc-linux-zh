    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A defective pressure valve may cause the coolant to boil
    over when the engine is turned off. The resulting loss of coolant could cause
    the engine to overheat.

    **Answer B is correct.** Only Technician B is correct. A defective vacuum valve
    that does not open may cause the upper hose to collapse. As the coolant cools
    and contracts, a vacuum can be formed in the cooling system.

