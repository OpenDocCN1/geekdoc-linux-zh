    ![](bbox=[0.8, 0.34, 0.88, 0.39])


    Answer A is incorrect. A thermostat rated at 180 degrees begins to open at that
    temperature.


    **Answer B is correct.** Only Technician B is correct. A thermostat rated at 180
    degrees begins to open at that temperature and is fully open at about 220 degrees.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    31. Technician A says if a timing belt is removed and is going to be reused, the
    direction of rotation must be marked. Technician B says a timing belt that has
    been contaminated with oil can be cleaned and reused. Who is correct?


