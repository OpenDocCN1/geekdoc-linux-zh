- img_proc: false
  md: 'with computer controls, the use of a sealer complimentary to oxygen sensors
    is important. The gases released during the vulcanizing process, and for some
    time after, will cause the oxygen sensor to fail. Another gasketless environment
    is the anaerobic sealer that dries when oxygen is not present. This is used as
    a sealer in applications where two machined mating surfaces must seal and maintain
    a precision location or clearance when assembled.


    Seals are usually in the form of lip seals that fit over shafts allowing the sealed
    component to move. These seals depend on the oil they seal to provide lubrication.
    Due to this fact, these seals have the highest failure rate. A rear main seal
    is an example of this type of seal whether it be full circle or split type. The
    surfaces these seals mate with are subject to wear that leaves a groove over time.
    These grooves can cause repeated replacements if they are not removed, the component
    replaced, or a repair sleeve installed. When installing a seal, it is recommended
    to lightly lubricate the shaft and the seal surface that contacts the shaft prior
    to installation; this will help prevent premature seal failure.


    In all cases where sealing is the goal, cleanliness is critical to success. It
    is important to use cleaners that do not leave residue behind. Chlorinated cleaners
    or denatured alcohol are the best choices.


    In many applications, a thread sealer is called for to control coolant or oil
    where bolts pass into areas containing fluids. It is important to use the sealer
    designed for the application as some sealers may be oil or coolant soluble.


    When reinstalling the engine, care should be taken to prevent the trapping of
    the wiring harness between the engine and transmission and/or the engine and mounts.
    Wiring harnesses and hoses should have retaining clips reinstalled in the proper
    location. Failure to secure these items properly can result in abrasive wear and
    damage.


    # D. Lubrication and Cooling Systems Diagnosis and Repair (8 Questions)


    # 1. Diagnose engine lubrication system problems; perform oil pressure tests;
    determine necessary action.


    In most cases, diagnosis of engine lubrication problems is more forensic than
    preventive. Oil is critical to lubrication as well as internal engine cooling.
    When a component does not receive adequate oil, it will fail quickly. The most
    common cause of oil related failures is plain old dirty oil. When oil breaks down,
    it can begin to adhere to internal engine surfaces creating sludge or a varnish
    that can restrict oil passages or drains. Lifters and valve lash adjusters are
    particularly sensitive to these problems due to very small passages inside them.
    Something as simple as a stuck open thermostat can cause the engine to not reach
    operating temperature, promoting oil sludging. This sludge can find its way back
    into the oil pan and restrict the oil pump pick-up tube.


    On the diagnostic side of the oil system, technicians are often called on to determine
    the cause of low oil pressure readings. This calls for removing the oil pressure
    sender or switch, and checking oil pressure with a mechanical gauge. Manufacturers
    have their own specs and different RPM readings that they want tests to be conducted
    at, so do not assume that 20 psi is low unless the manufacturer tells you so.
    In the case of complete loss of oil pressure, there are a couple of common causes.
    The pressure relief valve in the oil pump can stick open causing by-pass within
    the pump. The other common cause is blockage of the oil pump pick-up with sludge.
    Both are the result of poor maintenance. Low oil pressure can be caused by the
    aforementioned causes, excessive bearing clearances (high mileage engines fall
    victim to this), an oil filter that was installed too tight, or some'
  merge: -1
  pgno: 46
- img_proc: false
  md: 'other internal leakage. High oil pressure is usually only caused by a stuck
    closed pressure relief valve, higher viscosity oil than called for, or installing
    the incorrect oil pump. This will usually only occur in a situation where a high
    volume or high pressure pump was substituted for the original design.


    If all pressures meet specs and the gauge was reading out of spec, you must consider
    and test the electrical components or the oil pressure warning system.


    # 2. Disassemble and inspect oil pump (includes gears, rotors, housing, and pick-up
    assembly); measure oil pump clearance; inspect pressure relief devices and pump
    drive; determine necessary action.


    Inspect the oil pump pressure relief valve for sticking and wear. If this valve
    sticks in the closed position, oil pressure will be too high. A pressure relief
    valve stuck in the open position results in low oil pressure. A weak pressure
    relief spring will result in excessive return of oil to the pan and possible low
    oil pressure or volume.


    On rotor type oil pumps, measure the thickness of the inner and outer rotors with
    a micrometer. When this thickness is less than specified on either rotor, replace
    the rotors or the oil pump. The following oil pump measurements should be performed
    with a feeler gauge:


    +   1. Measure pump cover flatness with a feeler gauge positioned between a straightedge
    and the cover.

    2. Measure the clearance between the outer rotor and the housing.

    3. Measure the clearance between the inner and outer rotors with the rotors installed.

    4. Measure the clearance between the top of the rotors and a straightedge positioned
    across the top of the oil pump.


    On gear type oil pumps, inspect the gears and housing for scoring and excessive
    wear. When reassembling a gear type pump, be sure to align any match marks stamped
    onto the pump gears.


    Oil pump pick-up tubes should be carefully cleaned or preferably replaced if any
    sludge is present. While it would seem that oil filter replacement is a no-brainer,
    do not forget to rule out that a filter installed too tight can cause oil delivery
    problems.


    # 3. Inspect, test, and replace internal and external engine oil coolers.


    The engine oil cooler helps to remove heat from the engine by removing heat from
    the lubricating oil. There are many different variations of these coolers. Some
    are externally mounted oil-to-air coolers; these are generally mounted in front
    of the radiator and transfer the lubricating oil heat directly to the air. Other
    styles will transfer the heat of the lubricating oil to the engine coolant, and
    the coolant will transfer the heat to the air. This second style can be located
    in an engine block cavity, incorporated into the oil filter mounting base, or
    be incorporated into the radiator. If the oil-to-air cooler leaks, the leak will
    be external and generally easy to diagnose. If the oil-to-coolant style of cooler
    leaks, there will be a mixing of oil and coolant.


    There are many methods to check for oil in coolant such as looking for a milky
    grey sludge in the lube system, or looking for a skim of oil in the coolant. If
    coolant in the oil is'
  merge: -1
  pgno: 47
- img_proc: false
  md: 'suspected, let the engine set overnight, then loosen the oil drain plug. If
    the first drop to appear is coolant-colored (green, red, orange etc.), there is
    coolant in the oil. If the first drop is clear water, the suspected contamination
    is not coolant but water. If the first drop is oil, there is no contamination.
    Oil coolers can be pressurized with shop air and submerged in hot water to check
    for leaks. Normally, leaking oil coolers are replaced not repaired.


    Complete servicing of the oil cooler should be done as part of a major engine
    overhaul, or whenever there is oil in the water, water in the oil pan, or a milky
    gray sludge in the filter. In all of these cases, specific manufacturer''s instructions
    will apply. Look for places where the oil cooler baffles may have vibrated against
    the tubes. This common failure results in leaks. If you find signs of this, replace
    the cooler. Look for gasket particles and debris that is obstructing fluid flow
    and clean thoroughly. If the engine has suffered a major bearing failure, the
    oil cooler will be filled with metal particles. In this case, cleaning the cooler
    should not be attempted, it should be replaced. Check the lines and hoses for
    signs of leaking. Use a small light to inspect the inside of hoses, since they
    deteriorate from the inside first. Replace any hoses with internal cracks.


    # 4. Fill crankcase with oil and install engine oil filter.


    When changing the oil and filter, attention to detail is important. It cannot
    be overemphasized to use the correct viscosity engine oil. Some manufacturers
    now require very specific engine oils, such as 0W-20, or specialized synthetics
    manufactured to such exacting tolerances that there will be only one or two oils
    marketed to meet those specifications. In some instances, the oil will only be
    available from the dealer. Using the incorrect oil can void the warranty and result
    in engine damage. Engine oil should only be poured from clean, sealed containers.
    If the oil is stored in bulk containers and transport cans are used to move the
    oil to the engine, extra care must be used to ensure that these items are kept
    clean.


    Oil filters have come in the spin-on replaceable canister-style for many years.
    In this style, the filter is permanently installed in a canister and the technician
    simply screws the old one off, cleans the seal contact area on the engine, wipes
    clean oil on the new seal, reinstalls the filter, and tightens 3/4 of a turn after
    the seal contacts the base. Many manufacturers have now moved to the replaceable
    cartridge-type filter similar to what was used prior to 1965 on most engines.
    In this system, the filter element is removable from the housing. The only items
    discarded during the oil change are the filter cartridge itself and the sealing
    o-rings. This style of filter produces less waste; however, it does complicate
    oil filter servicing. Since the new filter itself is exposed to dirt during handling,
    care must be taken to ensure that the new filter element is not contaminated.
    The new o-rings must be installed in the appropriate location and lubricated.
    The filter will have a torque specification which must be followed.


