  md: 'Oil pans can be stamped style or aluminum. When reinstalling the oil drain
    plug, it is very important to use a torque wrench. Over-torqueing the oil drain
    plug is a common mistake. Eventually this will result in damaged threads in the
    oil pan which will require repair. Oil drain plugs are typically of the straight
    thread O-ring style, which will use a copper washer or o-ring to obtain a seal.
    This sealing washer, or o-ring, will need to be replaced at each oil change.


    Recommended engine oil change intervals vary widely. Although most technicians
    will recommend 3,000 mile oil changes, factory oil life monitors may extend this
    to as much as 10,000 miles. When making recommendations to the customer, care
    must be taken to explain the advantages and disadvantages of extended oil change
    intervals.


    When installing oil in a new or overhauled engine, the lubrication system must
    be primed. This can be accomplished on some engines by spinning the oil pump with
    a drill; however, this is becoming less likely due to the fact that few new engines
    now have an oil pump driven by the distributor. Another method is to keep the
    engine from starting by preventing fuel delivery and cranking the engine with
    the starter motor until oil pressure is indicated on the gauge. Yet another method
    is to use a specialized lubrication system priming tool which can be contacted
    to an oil passage in the engine, and pressurized engine oil forced through the
    system before the engine is started.


    # 5. Perform cooling system pressure tests; perform coolant dye test; determine
    necessary action.


    Whenever it is necessary to replenish coolant frequently, a pressure test should
    be performed to locate the source of the loss. Pressure testing will easily locate
    most external leaks. Leaks are usually located by a good visual inspection, since
    antifreeze leaves a film wherever there is a leak. Cold leaks occur due to contraction
    of sealing components, especially hose clamps. They often cease to leak at operating
    temperatures. Silicone hoses are frequently used due to their longer service life.
    Use the special clamps they require, and be careful to torque them properly since
    they are sensitive to over-tightening. A cooling system pressure testing kit includes
    a hand-actuated pump and gauge, and the necessary adapters to fit different radiators
    and pressure caps. Attach the pump using the necessary adapters to the radiator
    and pump up pressure to the pressure range of the cooling system. Observe the
    system''s ability to hold pressure while looking for visible signs of leakage.


    The radiator cap may also be tested using the pump and gauge assembly. Radiator
    caps are rated by the pressure to overcome the caps, spring pressure and unseat
    the seal. When this occurs, coolant is routed to the surge tank. When the cooling
    system cools after the engine is shut down, pressure drops. When it falls to a
    point where atmospheric pressure is about 0.25 psi higher than the coolant pressure,
    a vacuum valve in the cap unseats and coolant is forced by atmospheric pressure
    from the surge tank back to the radiator. When this valve fails to open, radiator
    hoses may be "sucked" flat.


    Internal leaks are harder to find and are usually located because coolant is found
    in places where it does not belong, such as in the oil, fuel, or exhaust. A very
    effective method to locate internal coolant leaks is the dye method. Fluorescent
    dye is installed in a cold cooling system, the radiator cap reinstalled, and the
    engine warmed. To locate the leak, the technician then uses a black light and
    yellow glasses to look for the area that glows. Originally, the black light was
    expensive and the bulbs in the light were fragile; now the lights are made much
    like a flashlight and are inexpensive.


    Yet another coolant test method is using a combustion leak tester. This tester
    is installed at the radiator filler neck, a blue test liquid is poured into the
    tester, and then the engine is started. As the engine warms, the vapors from the
    expanding coolant are forced through'
  merge: -1
  pgno: 49
- img_proc: false
  md: 'the tester. The liquid will change from the blue to yellow if the vapors contain
    combustion chamber gases.


    # 6. Inspect and test radiator, heater core, pressure cap, and coolant recovery
    system; replace as required.


    Examine the radiator for obvious damage or defects. Look for bent fins and fins
    clogged with dirt, road debris, or insects. These conditions greatly reduce radiator
    efficiency and can cause engine overheating. If damage is not severe, bent fins
    can usually be straightened using a special comb made for this purpose. Dirt and
    insects can be removed using a stream of low-pressure water or compressed air.


    Check the radiator for leaks or damp spots. Cracked solder seams and corroded
    tubes in copper/brass radiators can allow coolant to leak very slowly without
    leaving puddles of coolant. The same is true for aluminum/plastic radiators with
    cracked plastic tanks and leaking tank gaskets. Hard to find leaks can be located
    by removing the radiator, plugging the inlet and outlet fittings, and pressurizing
    the radiator with a cooling system tester. Submerge the radiator in a tank of
    water and check for bubbles.


    Check the radiator cap for corrosion and damaged or deteriorated gaskets; also
    check the radiator filler neck seat. If the cap gasket or filler neck seat is
    damaged, the cooling system may not pressurize enough to prevent boilover. Coolant
    will be forced out of the cooling system and onto the ground or into the coolant
    recovery tank, if the vehicle has one. The engine may overheat.


    If the vehicle is equipped with a coolant recovery system, check the gasket at
    the very top of the radiator cap. If this gasket is missing or leaking, coolant
    may be forced into the recovery tank when the engine warms up, but may not be
    drawn back into the radiator during cool down. Check the tube that connects the
    radiator filler neck to the reservoir for kinks, damage, or loose connections.
    These conditions may also allow coolant to flow into the tank, but not return
    to the radiator. Check the coolant reservoir for cracks, loose fittings, and other
    damage. Some recovery systems use a reservoir cap that allows a length of tubing
    to hang down into the coolant. If this hose is missing or damaged, coolant cannot
    return to the radiator when the engine cools down.


    # 7. Inspect, replace, and adjust drive belt(s), tensioner(s), and pulleys.


    Inspect the accessory drive belts for condition and tension. On conventional V-belts,
    the sides of the belt are the friction surfaces, so check the sides for cracks,
    glazing, or loose cord material. Replace a belt showing any of these conditions.
    If a V-belt is severely worn, it may contact the bottom of the pulleys. Replace
    severely worn belts. If a belt is severely worn on just one side, check pulley
    alignment. V-belt pulleys must be aligned within 1/16 inch (1.6 mm) per foot of
    belt span. If pulleys are not aligned, check for loose accessory mounting bolts,
    missing spacers, or bent brackets.


    V-belt tension can be checked using a variety of special testers. With one type
    of tester, the tool is placed over the belt at the center of a belt span. Squeezing
    the tool handles causes the tool dial to display belt tension, usually in pounds.
    Belt tension can also be checked by measuring the amount of belt deflection with
    a ruler. Use your thumb to press on the belt at the middle of a span while holding
    the ruler next to the belt. If belt tension is correct, the belt should deflect
    0.5 inch (12.7 mm) for every foot (30.5 cm) of belt span.


    A moderately loose or worn belt may cause a squealing noise when the engine is
    accelerated. A severely worn or loose belt may cause a discharged battery, engine'
