  md: 'Answer A is incorrect. A black light can be used to help locate the source
    of a leak.

    Answer B is incorrect. White powder can be used to help locate the source of a
    leak.

    **Answer C is correct.** A vacuum gauge is not used to locate engine oil leaks.

    Answer D is incorrect. Oil dye can be used to help locate an engine oil leak.


    # LEAST LIKELY QUESTIONS


    LEAST LIKELY questions are similar to EXCEPT questions. Look for the answer choice
    that would be the LEAST LIKELY cause (most incorrect) of the described situation.
    To help easily identify these types of question, whenever they are presented in
    an exam the words "LEAST LIKELY" will always be displayed in capital letters.
    In addition, you will be alerted before a LEAST LIKELY question is posed. Read
    the entire question carefully before choosing your answer.


    An example of this type of question is shown here:


    ![](bbox=[0.06, 0.25, 0.19, 0.31])


    1. A vehicle equipped with a diesel engine overheats when pulling a trailer. Which
    of the following would be the LEAST LIKELY cause?


    A. Slipping fan clutch

    B. Seized fan clutch

    C. Restricted charge air cooler

    D. Restricted radiator


    Answer A is incorrect. A slipping fan clutch may not fully engage and would fail
    to provide sufficient air flow across the radiator to keep the engine cool.

    **Answer B is correct.** A seized fan clutch would run all the time; this may
    cause a low power complaint, but would not cause the engine to overheat.

    Answer C is incorrect. A restricted charge air cooler would also restrict the
    air flow across the radiator. This could result in an engine overheating condition.

    Answer D is incorrect. A restricted radiator could result in an overheated engine.


    # SUMMARY


    The question styles outlined in this section are the only ones you will encounter
    on any ASE certification exam. ASE does not use any other types of question styles,
    such as fill-in-the-blank, true/false, word-matching, or essay. ASE also will
    not require you to draw diagrams or sketches to support any of your answer selections,
    although any of the described question styles may include illustrations, charts,
    or schematics to clarify a question. If a formula or chart is required to answer
    a question, it will be provided for you.'
