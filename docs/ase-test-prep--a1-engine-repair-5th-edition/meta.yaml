  md: '# Section 6 Answer Keys and Explanations


    # Engine Repair (A1)


    19. Crankshaft inspection should include all of the following EXCEPT:

    A. Rod journal diameter and taper.

    B. Main journal diameter and taper.

    C. Dial indicator check for warpage.

    D. Crankshaft length.

    Answer A is incorrect. Rod journals should be checked for wear.

    Answer B is incorrect. Main journals should be checked for wear.

    Answer C is incorrect. The crankshaft should be checked for warpage.

    **Answer D is correct.** Overall crankshaft length will not change and does not
    need to be checked.


    ![](bbox=[0.11, 0.08, 0.18, 0.15])


    20. Technician A says that a timing adjustment check is done with a timing light.
    Technician B says that timing adjustment may require a scan tool. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B

    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    **Answer C is correct.** Both Technicians are correct. Depending on the year of
    manufacture and equipment, the timing may be set using a timing light or through
    the ECM by a scan tool.

    Answer D is incorrect. Both Technicians are correct.


    ![](bbox=[0.11, 0.31, 0.18, 0.38])


    21. The results of a cylinder cranking compression test on a 4-cylinder engine
    shows low compression on cylinder #3. The technician squirts a tablespoon of oil
    in the cylinder and retests. The compression reading increases by 40 percent.
    The increase in compression indicates:

    A. A leaking intake valve.

    B. A blown head gasket.

    C. A burned exhaust valve.

    D. Worn rings.

    Answer A is incorrect. A leaking intake valve will not seal better with oil in
    the cylinder.

    Answer B is incorrect. Oil in the cylinder will not seal a leaking head gasket.

    Answer C is incorrect. Oil put in the cylinder will not seal a burned exhaust
    valve.

    **Answer D is correct.** Oil put into the cylinder will temporarily seal the rings
    and cause an increase in compression readings.


    ![](bbox=[0.11, 0.55, 0.18, 0.62])'
