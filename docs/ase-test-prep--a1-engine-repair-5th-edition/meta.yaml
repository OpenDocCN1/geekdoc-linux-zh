  md: '![](bbox=[0.12, 0.05, 0.88, 0.33])


    # ENGINE REPAIR (TEST A1)


    # A. General Engine Diagnosis (15 Questions)


    # 1. Verify driver''s complaint and/or road test vehicle; determine necessary
    action.


    In the modern automotive repair shop environment, a Customer Service Specialist,
    or Service Consultant, is usually responsible for collecting information from
    the customer to assist the technician in resolving a customer''s concern. Armed
    with this information, his skills, and a fair amount of intuition, the technician
    must determine the cause of the particular concern.


    One of the most important tools a technician can utilize is the pre-test drive.
    During this drive, he may be able to determine the problem and other conditions
    that may contribute to or relate the concern. After verifying the customer''s
    concern, the technician must determine the most efficient diagnostic path to take.
    Most experienced technicians will check with available information systems to
    see if the problem they are diagnosing is described in a technical service bulletin
    or service campaign. In some instances, it may be necessary to have the customer
    drive the vehicle with the technician as a passenger so the customer can create
    the exact scenario for the complaint.


    Once the problem is found and resolved, a final test drive allows the technician
    to confirm that the problem has indeed been resolved and that no other problems
    have come to light after the repair.


    # 2. Determine if no-crank, cranks but will not start, or hard starting condition
    is an engine mechanical problem, or is caused by another vehicle subsystem.


    If the starter fails to crank the engine, the problem may range from a faulty
    starter motor to broken components inside the engine. If no sounds come from the
    starter motor when it is activated, first disable the ignition system, and then
    attempt to rotate the crankshaft pulley by hand in the normal direction of rotation.
    If the crankshaft can be rotated freely through two complete revolutions, a diagnosis
    of the vehicles starting system is the next step.'
