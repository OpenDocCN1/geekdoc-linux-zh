  md: '![](bbox=[0.26, 0.07, 0.57, 0.33])


    30. Measurement B in the figure above is more than specified. Technician A says
    it can be corrected by inserting a washer below the valve spring. Technician B
    says this could cause improper valve seating. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both Technicians are correct. The spring installed height
    is corrected with spring washers. If the tension of the spring acting on the valve
    is not strong enough, the valve will close slower than the rate of cam lobe taper
    and the valve may not seat tightly against its seat.

    Answer D is incorrect. Both Technicians are correct.


    31. Technician A says a serpentine belt with three or more cracks within a one
    inch space should be replaced. Technician B says a smooth surface pulley that
    is uneven on the belt contact surface should be replaced. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both Technicians are correct. A serpentine belt with three
    or more cracks in a one inch span should be replaced. A smooth surface pulley
    that has worn unevenly will cause uneven pressure on the belt, causing it to slip
    or fail early.

    Answer D is incorrect. Both Technicians are correct.'
