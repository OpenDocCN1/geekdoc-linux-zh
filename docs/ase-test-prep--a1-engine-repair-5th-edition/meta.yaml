    necessary action.


    Inspect the crankshaft flange and the flywheel-to-crankshaft mating surface for
    metal burrs. Remove any metal burrs with fine emery paper. Be sure the threads
    in the crankshaft flange are in satisfactory condition. Replace the flywheel bolts
    and retainer (if fitted) if any damage is visible on these components. Install
    the flywheel, retainer, and bolts, and tighten the bolts following the torque
