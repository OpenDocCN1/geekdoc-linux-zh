  md: 'lifters may be installed on an old cam, but used lifters cannot be installed
    on a new cam.


    When a hydraulic failure occurs in any of the three designs, the unit is replaced
    with a new component. In some rare instances, the lash adjuster can fail in such
    a way that it holds the valve open. This can cause valve damage, particularly
    on exhaust valves.


    # 12. Adjust valves on engines with mechanical or hydraulic lifters.


    Valve lash adjusting procedures and mechanisms vary from manufacturer to manufacturer.
    On some engines valves are adjusted while the engine is cold. On others, the engine
    should be at operating temperature. Refer to the appropriate service manual for
    instructions.


    On some engines with mechanical valve lifters, the rocker arms have an adjustment
    screw and a locknut on the valve stem end of the arm. Other engines use an interference
    fit screw without a locknut. The adjustment procedure usually involves rotating
    the crankshaft to position the piston in the cylinder being adjusted at top dead
    center (TDC) on the compression stroke. Feeler gauges are then inserted between
    the adjusting screw and the valve stem. If clearance is excessive, the adjustment
    screw locknut (if equipped) is loosened and the adjustment screw is turned. When
    clearance is correct, a feeler gauge of the correct thickness will slide between
    the adjusting screw and the valve stem with a light push fit. Tighten the locknut
    (if equipped) when clearance is correct.


    Some OHC engines fitted with mechanical valve lifters have removable metal pads
    in each lifter or spring retainer. Clearance is measured by placing feeler gauges
    between the cam lobe and the lifter or spring retainer while the piston is at
    TDC on the compression stroke. Pads are available in various thicknesses to adjust
    the clearance to specifications. Another variation of this method will not have
    removable pads and the entire valve lifter must be replaced with one that has
    the correct thickness.


    Some valve trains have hydraulic valve lifters and individual rocker arm pivots
    retained with self-locking nuts. These valve trains require an initial adjustment
    of the rocker arm nut to position the lifter plunger. With the valve closed, loosen
    the rocker arm nut until there is clearance between the end of the rocker arm
    and the valve stem. Slowly turn the rocker arm nut clockwise until a zero lash
    condition exists. This occurs when the lifter is not preloaded but all of the
    components have just come in contact with each other. The next step is to apply
    the preload specified by the manufacturer. In most applications, this is the equivalent
    of .030–.060 of an inch of lifter preload. It is important to follow the manufacturer''s
    specs here as the lifter must be able to compensate for expansion and contraction
    of valve train components during cold to fully warm engine operation.


    The valve train on engines with hydraulic lifters and stud-mounted rocker arms
    can also be adjusted while the engine is running. After removing the valve covers,
    install oil shrouds on the rocker arms to prevent oil from splashing onto the
    exhaust manifolds and other nearby parts. Start the engine and loosen the rocker
    retaining nut until a clicking noise begins. Then slowly tighten the nut just
    until the clicking noise stops. From this point, slowly tighten the nut about
    ¼ turn at a time for the specified number of turns. Wait a few seconds between
    each ¼ turn to allow the lifter to leak down. Turning the adjusting screw too
    much at one time or too far can cause piston-to-valve contact.'
