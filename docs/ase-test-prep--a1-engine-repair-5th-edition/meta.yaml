  md: '# # Task List Overview

    ## SECTION 4


    # ## INTRODUCTION


    This section of the book outlines the content areas or *task list* for this specific
    certification exam, along with a written overview of the content covered in the
    exam.


    The task list describes the actual knowledge and skills necessary for a technician
    to successfully perform the work associated with each skill area. This task list
    is the fundamental guideline you should use to understand what areas you can expect
    to be tested on, as well as how each individual area is weighted to include the
    approximate number of questions you can expect to be given for that area during
    the ASE certification exam. It is important to note that the number of exam questions
    for a particular area is to be used as a guideline only. ASE advises that the
    questions on the exam may not equal the number listed on the task list. The task
    lists are specifically designed to tell you what ASE expects you to know how to
    do and to help prepare you to be tested.


    Similar to the role this task list will play in regard to the actual ASE exam,
    Delmar, Cengage Learning has developed six preparation exams, located in Section
    5 of this book, using this task list as a guide. It is important to note that
