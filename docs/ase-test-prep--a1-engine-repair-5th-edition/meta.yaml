    +   **Main bearing cap** The structural device that holds the crankshaft in place
    in an engine block.


    +   **Muffler** A device in the exhaust system used to reduce noise.


    +   **No-crank** A condition like a frozen engine, a defective starter, or an
    electrical problem that prevents the engine from rotating when normal attempts
