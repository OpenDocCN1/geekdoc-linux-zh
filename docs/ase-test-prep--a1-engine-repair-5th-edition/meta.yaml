    scale provided on the Plastigauge package to determine the bearing clearance.
    After removing the Plastigauge, lubricate the connecting rod bearing and crankshaft
    journal with engine oil, install the cap, and torque the fasteners to specifications.
    It is a good practice to rotate the crankshaft a few times after the installation
