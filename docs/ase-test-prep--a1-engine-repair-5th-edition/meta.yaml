    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Worn main bearings will make noise but will not allow oil
    to enter the combustion chamber.


    Answer B is incorrect. Excessive fuel in the combustion chamber will produce black
    smoke from the tailpipe.


