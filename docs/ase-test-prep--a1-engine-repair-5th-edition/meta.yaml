  md: '35. The technician is checking the coolant hoses on an engine. Technician A
    says they should be checked for cracks. Technician B says if the hose crunches
    when squeezed, there are deposits inside the hose and it should be replaced. Who
    is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    **Answer C is correct.** Both Technicians are correct. Any deterioration of a
    coolant hose is grounds for replacement. Cracking or crunching when squeezed indicates
    the hose should be replaced immediately and the cooling system flushed.

    Answer D is incorrect. Both Technicians are correct.


    ![](bbox=[0.25, 0.34, 0.75, 0.61])


    36. Technician A says an open in the wiring at point A in the figure above will
    prevent the starter from engaging. Technician B says if the neutral safety switch
    is open, the starter will not engage. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    **Answer C is correct.** Both Technicians are correct. An open at point A will
    prevent current flow to the starter from the battery. An open at the neutral safety
    switch will cause the relay to stay open and will not close the current path from
    the battery to the starter.

    Answer D is incorrect. Both Technicians are correct.'
