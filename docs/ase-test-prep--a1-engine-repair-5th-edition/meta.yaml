  md: '# Section 6 Answer Keys and Explanations


    22. A vehicle with 110,000 miles on it is brought to the shop to be checked for
    low oil pressure. Technician A says the oil pressure should first be checked with
    a mechanical gauge to eliminate the pressure sending unit as the problem. Technician
    B says low oil pressure can be caused by worn crankshaft main bearings. Who is
    correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    ![](bbox=[0.8, 0.06, 0.95, 0.14])


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both Technicians are correct. Oil pressure should first be
    checked with a mechanical oil pressure gauge to eliminate the sending unit or
    the dash gauge as the problem. Worn main bearings will cause low, to extremely
    low, oil pressure.

    Answer D is incorrect. Both Technicians are correct.


    23. An 8-cylinder block is being inspected and it is noted that cylinder #4 has
    a small crack in the middle of the bore. Technician A says that the cylinder can
    be sleeved to be repaired. Technician B says the crack can be welded and bored.
    Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    ![](bbox=[0.8, 0.35, 0.95, 0.43])


    Answer A is incorrect. A cracked cylinder bore cannot be repaired with a sleeve;
    the block must be replaced.

    Answer B is incorrect. A cracked cylinder bore cannot be welded; the block must
    be replaced.

    Answer C is incorrect. Neither Technician is incorrect.

    Answer D is correct. Neither Technician is correct. A cracked cylinder bore cannot
    be repaired. The heat and pressure of combustion will cause the sleeve to shift
    in the bore and the welded bore to crack again. The block must be replaced.


    24. The exhaust outlet of a turbocharger is coated with oil. Which of the following
    is the most likely cause?


    +   A. Leaking valve stem seals

    B. A plugged PCV system

    C. Leaking turbocharger oil seals

    D. Worn engine rings


    ![](bbox=[0.8, 0.63, 0.95, 0.71])


    Answer A is incorrect. Leaking valve stem seals would cause oil to be burned in
    the combustion chamber.

    Answer B is incorrect. A plugged PCV system can cause oil burning in the combustion
    chamber or external leaks.

    Answer C is correct. If the turbocharger oil seals are leaking, liquid oil can
    be drawn into the outlet of a turbocharger.

    Answer D is incorrect. Worn engine rings will cause poor performance and oil burning
    in the combustion chamber.'
