  md: '# Section 3 Types of Questions on an ASE Exam


    Analyzing this type of question is a little easier than the other types because
    there are only two ideas to consider, although there are still four choices for
    an answer.


    Again, Technician A, Technician B questions are really double true-or-false questions.
    The best way to analyze this type of question is to consider each technician''s
    statement separately. Ask yourself, "Is A true or false? Is B true or false?"
    Once you have completed this individual evaluation of each answer choice, you
    will have successfully determined the correct answer choice for the question,
    "Who is correct?".


    An important point to remember is that an ASE Technician A, Technician B question
    will never have Technician A and B directly disagreeing with each other. That
    is why you must evaluate each statement independently.


    An example of a Technician A/Technician B style question looks like this:


    +   1. A noise is coming from the accessory drive on the front of a diesel engine.
    Technician A says the serpentine belt can be removed to help determine if it is
    the source of the noise. Technician B says water dripped on the belt can help
    determine if the belt is the source of the noise. Who is correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    ![](bbox=[0.8, 0.3, 0.9, 0.37])


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    **Answer C is correct.** Both Technicians are correct. The belt can be removed
    and the engine run for a short time to determine if the belt is the source of
    the noise. Also, if the noise disappears when a few drops of water are put on
    the running belt, the technician knows the belt is the source of the noise.

    Answer D is incorrect. Both Technicians are correct.


    # EXCEPT QUESTIONS


    Another type of question type used on the ASE exams contains answer choices that
    are all correct except for one. To help easily identify this type of question,
    whenever it is presented in an exam, the word "EXCEPT" will always be displayed
    in capital letters. Furthermore, a cautionary statement will alert you to the
    fact that the next question is different from the ones otherwise found in the
    exam. With the EXCEPT type of question, only one *incorrect* choice will actually
    be listed among the options, and that incorrect choice will be the key to the
    question. That is, the incorrect statement is counted as the correct answer for
    that question.


    Be careful to read these question types slowly and thoroughly; otherwise, you
    may overlook what the question is actually asking and answer the question by selecting
    the first correct statement.


    An example of this type of question would appear as follows:


    +   1. A diesel engine is being checked for an engine oil leak. All of the following
    could be used to help locate the source of the leak EXCEPT:


    A. Black light.

    B. White powder.

    C. Vacuum gauge.

    D. Oil dye.


    ![](bbox=[0.8, 0.82, 0.9, 0.89])'
