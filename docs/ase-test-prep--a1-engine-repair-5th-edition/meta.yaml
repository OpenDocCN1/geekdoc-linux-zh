    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.


    Answer B is incorrect. Technician A is also correct.


    **Answer C is correct.** Both Technicians are correct. Rust in the coolant is
    an abrasive which may wear the impeller vanes off, causing little or no coolant
