  md: '# Preface


    Delmar, a part of Cengage Learning, is very pleased that you have chosen to use
    our *ASE Test Preparation Guide* to help prepare yourself for the Engine Repair
    (A1) ASE certification examination. This guide is designed to help you prepare
    for your actual exam by providing you with an overview and an introduction of
    the testing process, introducing you to the task list for the Engine Repair (A1)
    certification exam, giving you an understanding of what knowledge and skills you
    are expected to have in order to successfully perform the duties associated with
    each task area, and providing you with several preparation exams designed to emulate
    the live exam content in hopes of accessing your overall exam readiness.


    If you have a basic working knowledge of the discipline you are testing for, you
    will find this book to be an excellent guide, helping you understand the "must
    know" items needed to successfully pass the ASE certification exam. This manual
    is not a textbook. Its objective is to prepare the individual who has the existing
    requisite experience and knowledge to attempt the challenge of the ASE certification
    process. This guide cannot replace the hands-on experience and theoretical knowledge
    required by ASE to master the vehicle repair technology associated with this exam.
    If you are unable to understand more than a few of the preparation questions and
    their corresponding explanations in this book, it could be that you require either
    more shop-floor experience or further study.


    This book begins by providing an overview of, and introduction to, the testing
    process. This section outlines what we recommend you do to prepare, what to expect
    on the actual test day, and overall methodologies for your success. This section
    is followed by a detailed overview of the ASE task list to include explanations
    of the knowledge and skills you must possess to successfully answer questions
    related to each particular task. After the task list, we provide six sample preparation
    exams for you to use as a means of evaluating areas of understanding, as well
    as areas requiring improvement in order to successfully pass the ASE exam. Delmar
    is the first and only test preparation organization to provide so many unique
    preparation exams. We enhanced our guides to include this support as a means of
    providing you with the best preparation product available. Section 6 of this guide
    includes the answer keys for each preparation exam, along with the answer explanations
    for each question. Each answer explanation also contains a reference back to the
    related task or tasks that it assesses. This will provide you with a quick and
    easy method for referring back to the task list whenever needed. The last section
    of this book contains blank answer sheet forms you can use as you attempt each
    preparation exam, along with a glossary of terms.


    # OUR COMMITMENT TO EXCELLENCE


    Thank you for choosing Delmar, Cengage Learning for your ASE test preparation
    needs. All of the writers, editors, and Delmar staff have worked very hard to
    make this test preparation guide second to none. We feel confident that you will
    find this guide easy to use and extremely beneficial as you prepare for your actual
    ASE exam.


    Delmar, Cengage Learning has sought out the best subject-matter experts in the
    country to help with the development of *ASE Test Preparation: Automotive Technician
    Certification Series, Engine*'
