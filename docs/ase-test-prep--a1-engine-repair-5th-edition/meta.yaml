    # B. Cylinder Head and Valve Train Diagnosis and Repair (10 Questions)


    # 1. Remove cylinder heads, disassemble, clean, and prepare for inspection.


    Remove a cylinder head only when the engine is cold. Removing a warm cylinder
    head may cause the head to warp, especially if it is made of aluminum.


    Remove the cylinder head bolts, loosening the bolts in a sequence opposite that
    of the tightening sequence. Note and record the positions of special bolts. Remove
    the cylinder head from the engine. Cylinder heads can be quite heavy, so ask an
    assistant to help you, especially if the engine is still mounted in the vehicle.


    Use a spring compressor to compress the valve springs and then remove the valve
    locks, or "keepers." Release the compressor and remove the retainer, rotator,
    spring, and spring seats from the head. Keep all parts in an organizer so they
    can be returned to their original cylinder. Check the valve stem tips for mushrooming.
    If it is present, the tip must be dressed with a file before the valves are removed
    from the head. Remove the valves from the cylinder head and place them in an organizer.


    When removing the cylinder head from an OHC design engine, the timing belt or
    chain must first be disconnected from the camshaft. The procedure for doing this
    varies from manufacturer to manufacturer. On some engines with a chain-driven
    camshaft, the camshaft sprocket is unbolted from the cam. The cylinder head assembly
    is then removed, leaving the chain and sprockets in position on the engine. On
    some engines'
