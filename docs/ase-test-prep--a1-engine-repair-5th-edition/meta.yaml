  md: "# # Types of Questions on an ASE Exam\n\nUnderstanding not only what content\
    \ areas will be assessed during your exam, but how you can expect exam questions\
    \ to be presented will enable you to gain the confidence you need to successfully\
    \ pass an ASE certification exam. The following examples will help you recognize\
    \ the types of question styles used in ASE exams and assist you in avoiding common\
    \ errors when answering them.\n\nMost initial certification tests are made up\
    \ of between 40 and 80 multiple-choice questions. The five-year recertification\
    \ exams will cover the same content as the initial exam; however, the actual number\
    \ of questions for each content area will be reduced by approximately one-half.\
    \ Refer to Section 4 of this book for specific details regarding the number of\
    \ questions to expect during the initial Engine Repair (A1) certification exam.\n\
    \nMultiple-choice questions are an efficient way to test knowledge. To correctly\
    \ answer them, you must consider each answer choice as a possibility, and then\
    \ choose the answer choice that *best* addresses the question. To do this, read\
    \ each word of the question carefully. Do not assume you know what the question\
    \ is asking until you have finished reading the entire question.\n\nAbout 10 percent\
    \ of the questions on an actual ASE exam will reference an illustration. These\
    \ drawings contain the information needed to correctly answer the question. The\
    \ illustration should be studied carefully before attempting to answer the question.\
    \ When the illustration is showing a system in detail, look over the system and\
    \ try to figure out how the system works before you look at the question and the\
    \ possible answers. This approach will ensure that you do not answer the question\
    \ based upon false assumptions or partial data, but instead have reviewed the\
    \ entire scenario being presented.\n\n# ## MULTIPLE-CHOICE/DIRECT QUESTIONS\n\n\
    The most common type of question used on an ASE exam is the direct multiple-choice\
    \ style question. This type of question contains an introductory statement, called\
    \ a stem, followed by four options: three incorrect answers, called distracters,\
    \ and one correct answer, the key.\n\nWhen the questions are written, the point\
    \ is to make the distracters plausible to draw an inexperienced technician to\
    \ inadvertently select one of them. This type of question gives a clear indication\
    \ of the technician's knowledge.\n\nHere is an example of a direct style question:\n\
    \n+   1. Which of the following would be used to measure crankshaft main bearing\
    \ clearance on diesel engine?\n   A. Dial indicator\n   B. Plastigauge®\n   C.\
    \ Outside micrometer\n   D. Dial caliper\n\n![](bbox=[0.82, 0.815, 0.91, 0.885])"
