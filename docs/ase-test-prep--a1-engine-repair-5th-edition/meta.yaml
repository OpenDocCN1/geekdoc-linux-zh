    ![](bbox=[0.08, 0.44, 0.52, 0.63])


    36. In the figure above, Technician A says if the distance between A and B is
    too wide, it will cause a no-crank condition. Technician B says pickup B is a
    thermistor. Who is correct?


    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Too large a gap between the crankshaft reluctor ring and
    the crankshaft position sensor will cause no-trigger signal and a no-start condition;
    it will not affect cranking.


    Answer B is incorrect. The crankshaft position sensor is a permanent magnet-type
    sensor, not a thermistor.


    Answer C is incorrect. Neither Technician is correct.


    **Answer D is correct.** Neither Technician is correct. The reluctor ring on the
    crankshaft has gaps in it that correspond with piston position. The crankshaft
    position sensor emits a magnetic field that is interrupted when the gap passes
    it, letting the PCM know the position of that cylinder to fire the sparkplug at
    the proper time. If the air gap between the sensor and the reluctor ring is too
    wide, the PCM will receive a weak or no signal and will not fire the sparkplug.'
