  md: '# 5. Inspect and replace crankcase ventilation system components.


    The crankcase ventilation system serves two purposes. First, it removes crankcase
    blow-by and pressure. Second, it introduces the crankcase gases into the engine
    to be burned during the combustion process.


    Inspect the system by looking for hoses that are cracked, swelled, or kinked.
    The side of the system with the crankcase ventilation valve in it is under vacuum;
    the side that connects to the air cleaner or air intake tube is the vent side.
    Air is drawn from the filtered intake side to ventilate the crankcase and then
    drawn through the valve and into the intake stream. If the ventilation valve hose
    is kinked, or clogged, the valve cannot open. This will result in excessive crankcase
    pressure that may cause gaskets and seals to leak. This may also cause an accumulation
    of oil in the air cleaner assembly.


    # 6. Inspect and install ignition system components; adjust timing.


    On engines fitted with a distributor, check for a cracked, worn out, or damaged
    distributor cap. Pull each spark plug wire from the cap one at a time and check
    for burned or corroded terminals. Check the spark plug cables for burned, pinched,
    cut, or oil-soaked insulation. Replace damaged cables. Remove the cap and check
    inside it. If the cap has excessively worn or corroded terminals, replace it.
    Check for carbon tracking and, if found, replace the cap. Check the high tension
    cable leading to the ignition coil. Ignition coils sometimes leak oil, which will
    soften and damage the cable. If oil is found, replace the ignition coil and the
    cable. Check the distributor rotor for a burned, pitted, or excessively worn contact.


    On engines equipped with solid state ignition, check the centrifugal and vacuum
    advance mechanisms, if equipped. Inspect the reluctor, or pole piece, to make
    sure that it is not contacting the magnetic pickup or pickup coil. Replace damaged
    parts. The mechanical advance mechanism advances spark timing as engine speed
    increases. Check that the advance mechanism is not seized by grasping the rotor
    and attempting to turn it in the direction of rotor rotation. The rotor should
    move in the direction of rotation against spring pressure, but not the opposite
    direction. When the rotor moves, pivoted weights under the rotor or breaker plate
    should move outward. The vacuum advance unit controls spark advance in relation
    to engine load. To test the advance unit, connect a hand operated vacuum pump
    to the hose nipple on the unit and watch the breaker plate while operating the
    pump. The breaker plate should rotate in the direction opposite that of the distributor
    rotor as the pump is operated. If the unit will not hold vacuum, the diaphragm
    is damaged and the vacuum advance unit must be replaced. If the unit holds vacuum,
    but the breaker plate does not move, the plate may be seized. Check for a rusted
    pivot point or a foreign object, such as a dropped point retaining screw, that
    may be jammed between the plate and the distributor housing.


    Remove and inspect the spark plugs. Use the appropriate socket to prevent spark
    plug damage. Remove the plugs when the engine is cold, especially if the engine
    has aluminum cylinder heads. Removing plugs from an aluminum head when the engine
    is hot can damage the aluminum threads. If the plugs are in good condition, apply
    a small amount of anti-seize compound to the spark plug threads. Thread the plugs
    into the head by hand to avoid cross-threading. Torque the plugs to specifications.


    On most, but not all, engines fitted with a distributor type ignition system,
    the distributor can be rotated to adjust spark timing. Vehicles produced since
    1972 have an underhood emissions label that outlines the steps necessary to adjust
    spark timing. Follow these'
