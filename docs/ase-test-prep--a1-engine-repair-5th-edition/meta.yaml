  md: '26. Technician A says a serpentine belt that has any cracks in it must be replaced.
    Technician B says that serpentine belts must be retightened after break-in. Who
    is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    ![](bbox=[0.78, 0.08, 0.88, 0.15])


    Answer A is incorrect. Small cracks in the belt are normal unless there are three
    cracks within 1" of belt length.


    Answer B is incorrect. Serpentine belts do not have a break-in period like a V-belt.
    No retensioning is necessary.


    Answer C is incorrect. Neither Technician is correct.


    **Answer D is correct.** Neither Technician is correct. A serpentine belt with
    three cracks within 1" of belt length must be replaced; small cracks not meeting
    this guideline do not require belt replacement. A V-belt will stretch slightly
    during break-in and need retensioning, whereas a serpentine belt will not stretch
    and will not require retensioning.


    27. Florescent dye has been added to the crankcase to help locate an oil leak.
    The dye will glow when it is exposed to:


    +   A. A strobe light.

    B. An infrared light.

    C. A blacklight.

    D. A blue light.


    ![](bbox=[0.78, 0.41, 0.88, 0.48])


    Answer A is incorrect. A strobe light will not cause the dye to glow.


    Answer B is incorrect. An infrared light will not cause the dye to glow.


    **Answer C is correct.** A blacklight (ultraviolet) will cause the dye to glow.


    Answer D is incorrect. A blue light will not cause the dye to glow.


    28. Worn valve guides may cause all of these problems EXCEPT:


    +   A. Leaking of combustion gases.

    B. Excessive oil consumption.

    C. Uneven valve seating.

    D. Blowby.


    ![](bbox=[0.78, 0.63, 0.88, 0.7])


    Answer A is incorrect. Worn valve guides may cause improper valve seating, which
    can cause combustion gases to leak past the valve.


    Answer B is incorrect. Worn valve guides can cause oil consumption as the valve
    tips in the guide; excessive oil will run down the valve stem through the valve
    stem seal.


    Answer C is incorrect. Worn valve guides will allow uneven valve-to-seat contact
    causing the valve seat to wear and the valve to seat unevenly.


    **Answer D is correct.** Worn valve guides will not cause blowby; worn rings will
    cause this.'
