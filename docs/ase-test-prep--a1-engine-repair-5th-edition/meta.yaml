  md: 'subtract the stem readings from the guide measurements to obtain the clearance.
    An alternate method for measuring stem-to-guide clearance is to install the valve
    in the guide with the valve about ⅛ inch (3.18 mm) off its seat. Mount a dial
    indicator against the valve margin or against the valve stem below the lock grooves.
    Move the valve from side to side while observing the clearance reading on the
    dial indicator. Divide the reading by two to obtain stem-to-guide clearance.


    If clearance exceeds specifications, the valve guides may be replaced or bored
    out, and a thin-wall liner installed. Excessive valve stem-to-guide clearance
    may result in an improper valve seating and lower compression. Increased oil consumption
    may result from excessive valve stem-to-guide clearance.


    # 8. Inspect valves and valve seats; determine needed repairs.


    Although most shops no longer perform valve and seat reconditioning, technicians
    still need to be able to inspect the condition of valves and seats to determine
    the cause of failure. Older engines and many large displacement light truck engines
    are more susceptible to wear. The valves in these engines are larger than small
    engines so they tend to have more trouble holding their shape and dissipating
    heat into the valve seats. In these larger valves it is not uncommon to see the
    exhaust valves tulip or crack under hard use. Here again, aluminum heads eliminate
    most of these conditions due to their ability to draw excessive heat out of the
    exhaust valves. The downside is that the conditions that caused the valve damage
    will now, more than likely, damage the cylinder head instead. Engines with multiple
    valves and smaller displacement engines demonstrate excellent valve and seat life.
    In most cases, the valves and seats will last the life of the engine. Common failures
    are valve damage when timing belts break in interference engines and carbon buildup
    on the valve head that causes poor contact with the seat and loss of compression.


    When inspecting valves and seats we are looking for obvious changes in the shape
    of the valve. The seat-to-valve contact area is critical to good sealing. The
    valve train is designed to lift the valve and gently set it down. If excessive
    valve lash occurs in the valve train the result can be accelerated valve seat
    wear. Any irregularity in this surface can cause a valve to not seal, resulting
    in cylinder misfire. The valves must seal completely for the cylinder to reach
    full pressure during both the compression and power strokes.


    # 9. Check valve spring installed (assembled) height and valve stem height; determine
    needed repairs.


    Measure the installed valve stem height from the spring seat surface on the cylinder
    head to the valve stem tip. If the stem installed height is greater than specifications,
    the valve stem is stretched or too much material has been removed from the valve
    face or seat. Install a new valve and measure stem height again. If the measurement
    is still excessive, replace the seat or cylinder head. Excessive valve stem height
    moves the plunger downward in a hydraulic valve lifter and may cause valve train
    components to bottom out.


    Measure the installed valve spring height from the lower edge of the top retainer
    to the spring seat. If this measurement is excessive, install shims between the
    bottom of the valve spring and the top of the spring seat surface on the cylinder
    head. Excessive installed valve spring height reduces valve spring tension, which
    may result in valve float and cylinder misfiring at higher speeds.'
