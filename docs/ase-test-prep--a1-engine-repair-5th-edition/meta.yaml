    # 9. Perform cylinder leakage tests; determine necessary action.


    During a cylinder leakage test, a regulated amount of air from the shop air supply
    is forced into the cylinder while both the exhaust and intake valves are closed.
    The gauge on the leakage tester indicates the percentage of leakage in the cylinder.
    A gauge reading of 0 percent indicates that there is no cylinder leakage. If the
    reading is 100 percent, the cylinder is not holding any air.


    If cylinder leakage exceeds 20 percent, determine the source of the leakage by
    listening for air escaping through the tailpipe, crankcase (via the oil filler
    cap or PCV valve), and/or the intake tract (throttle body or carburetor). Air
    escaping from the tailpipe indicates an exhaust valve leak. When the air is coming
    out of the PCV valve or valve cover opening, the piston rings are leaking. An
    intake valve is leaking if air is escaping from the top of the throttle body or
    carburetor. Remove the radiator cap and check the coolant for bubbles, which indicates
    a leaking head gasket or cracked head. Remove all of the spark plugs. Air escaping
    from an adjacent spark plug hole could indicate a bad head gasket, or crack in
