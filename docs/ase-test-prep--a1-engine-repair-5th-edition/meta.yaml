  md: '# 13. Verify proper operation of engine-related warning indicators.


    Operating temperature can be indicated to the driver either by a gauge or a light.
    The light typically indicates only an overheat condition, while the gauge indicates
    approximate operating temperature. The light will have a temperature-operated
    switch to control it. The gauge will have a thermistor controlling it. To check
    light operation, make sure the light comes on during bulb check, then remove the
    wire from the sensor, ground it, and see if the light comes on. If it does, it
    is operating properly. To test the gauge, remove the wire at the sending unit,
    and install the appropriate resistor as indicated by the service literature, between
    the wire and ground. Check to see that the gauge reading indicates the appropriate
    temperature.


    # E. Fuel, Electrical, Ignition, and Exhaust Systems Inspection and Service (7
    Questions)


    # 1. Inspect, clean, or replace fuel injection system components, intake manifold,
    and gaskets.


    Fuel and air induction system components as they relate to engine repair require
    us to look at maintenance and inspection of items when performing major engine
    repair. Let''s start from the top down.


    On many late model vehicles, the most significant external component of these
    systems is the airflow sensor. Although the air passing through the sensor is
    filtered, they still get dirty and can cause drivability problems for new or repaired
    engines that could be detrimental to ring seating or engine operating temperatures.
    Air meters often require cleaning with a suitable air intake solvent that removes
    debris and dirt that can shroud and insulate the temperature sensing bulb and
    cause the PCM to miscalculate air flow.


    The next component in line is common to throttle body and port fuel injected vehicles
    and it is the throttle body. Typically we are looking for collections of dirt
    inside the throttle body, behind the throttle plates, and in the idle air control
    passages. It is key that manufacturer''s recommendations be followed when servicing
    these because the use of the wrong cleaner could destroy the whole part. It is
    generally safe to wipe them out with a shop towel and in most cases this will
    remove deposits. Carburetor cleaner and even some induction system cleaners could
    remove the coatings that are designed to resist dirt causing high or erratic idle
    speeds.


    Next in the air tract is the intake manifold. When replacing or resealing intake
    manifolds, it is important to check them for warpage or corrosion around water
    passages. Dirt deposits can generally be removed in a parts washer prior to reassembly.
    Always be sure to remove any electrical switches before cleaning. Most intake
    manifold gaskets are intended to be installed without sealers and most are very
    much like cylinder head gaskets. Proper torque is critical to lasting gasket performance.


    The fuel components that are on the engine have to be considered. The fuel rail
    and pressure regulator on fuel injected vehicles, the carburetor on older vehicles,
    the fuel injectors, and the related sensors and actuators are all included.


    Carburetors, for the most part, saw their last application in 1995. Prior to 1985,
    most domestic and Asian manufactured vehicles were carbureted. Carburetors and
    the associated vacuum lines must be checked for leakage or deterioration.'
  merge: -1
