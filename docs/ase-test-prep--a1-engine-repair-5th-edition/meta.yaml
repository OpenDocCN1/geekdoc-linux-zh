- img_proc: false
  md: 'overheating, or a lack of power steering assist. An overtightened belt may
    fail suddenly, or damage the alternator front bearing. An overtightened belt can
    also cause the upper half of the crankshaft front main bearing to wear prematurely.


    When repositioning an accessory device (alternator, power steering pump, etc.)
    to adjust belt tension, always look for the pry points provided by the manufacturer.
    Some devices have slots for inserting a large screwdriver or pry bar. Others have
    built-in square holes to accommodate a 0.5 inch breaker bar or ratchet. Never
    pry on a power steering pump housing to tighten the drive belt. These housings
    are not meant to withstand such abuse and will be damaged, possibly causing a
    fluid leak.


    Inspect serpentine belts for missing ribs, wear on outside edges, cracks closer
    than 2 inches apart, and excessive glazing. Any of these require immediate replacement.


    Serpentine or V-ribbed belts must also be properly tensioned, but these belts
    are usually fitted with automatic tensioners. The tensioner automatically adjusts
    belt tension as the V-ribbed belt stretches. These tensioners often have built-in
    wear indicator scales. As long as an arrow on the tensioner is located between
    two lines, the belt is not excessively stretched. When the arrow moves outside
    the lines, the belt must be replaced.


    Many vehicles are equipped with plastic tensioner and idler pulleys. It is very
    important to inspect these for wear. They will allow belt tension to drop or even
    damage the belt when they wear.


    # 8. Inspect and replace engine cooling system and heater system hoses, pipes,
    and fittings.


    Check all cooling system hoses for loose clamps, leaks, and damage. Look for cracks,
    abrasions, bulges, and swelling. Check for hard spots due to heat damage from
    close proximity to exhaust system components. Also look for shiny spots caused
    by contact with accessory mounting brackets or other components. These spots may
    indicate weak spots that could cause a hose to burst. Check the hoses for soft
    or gummy areas due to contact with engine oil, power steering fluid, or automatic
    transmission fluid.


    Squeeze each hose along its entire length to check for hard or soft areas. Listen
    also for crackling or crunching noises while squeezing which would indicate that
    the reinforcing fabric is faulty or the inner liner has deteriorated. Lower radiator
    hoses often contain a steel spring to prevent the hose from collapsing, so you
    may not be able to perform the squeeze test.


    When in doubt about a hose''s condition, remove it and inspect the inner liner.
    If the liner is cracked or otherwise deteriorated, replace the hose.


    Be careful when removing a faulty hose. Aggressive twisting and pulling can damage
    a heater core or radiator tank. If the hose is stuck to the fitting, slit the
    end of the hose to make removal easier.


    When installing a new hose, make sure that it fits properly. Avoid twisting or
    stretching the hose. A hose that is too short may fail when the engine shifts
    during acceleration.


    # 9. Inspect, test, and replace thermostat, coolant by-pass, and thermostat housing.


    The thermostat may be tested after it has been removed from the engine. Submerge
    the thermostat in a pan of water and put a thermometer in the water. Suspend the
    thermostat and the thermometer above the bottom of the pan. Allowing them to lie
    on the bottom'
