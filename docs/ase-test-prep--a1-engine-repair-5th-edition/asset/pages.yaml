  pgno: 235
- img_proc: true
  md: '# Section 6 Answer Keys and Explanations


    37. Technician A says the plug wires on a failed ignition coil pack must be checked
    for defects.Technician B says most coil packs are considered waste spark systems.
    Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer C is correct. Both Technicians are correct. An open plug wire may cause
    the coil

    pack internally to the primary winding, causing failure of the coil and possibly
    the

    module. Most coil packs are waste spark systems in that they fire two sparks at
    once,

    for ignition and for waste spark on the exhaust stroke.

    Answer D is incorrect. Both Technicians are correct.


    ![](img/95183953b74d7b388b46905691681ee3_236_0.png)


    38. Technician A says this when adjusting valves on an engine with mechanical
    adjustment, the

    piston must be at BDC on the exhaust stroke. Technician B says some mechanical
    valve

    adjustment is done by removing lash pads on a bucket. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. When mechanically adjusting valves, it must be done with
    the piston at

    TDC compression stroke to ensure all valves for that cylinder are closed.

    Answer B is correct. Only Technician B is correct. Some engines'' camshafts may
    act on

    ash pad and bucket assembly, which directly contacts the valve tip.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_236_1.png)


    39. The engine cranks but will not start. Which of the following is not a requirement
    for the

    engine to start and run?


    +   A. Compression

    B. Oil pressure

    C. Fuel pressure

    D. Spark


    Answer A is incorrect. Compression is required for an engine to start.

    Answer B is correct. Oil pressure is developed when the engine starts running.

    Answer C is incorrect. Fuel pressure and delivery is required for an engine to
    start.

    Answer D is incorrect. Spark is required to ignite the fuel.


