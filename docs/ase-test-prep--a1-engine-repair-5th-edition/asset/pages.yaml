    B. B only

    C. Both A and B

    D. Neither nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both Technicians are correct. A vacuum gauge will show low
    value on an engine with a restricted catalytic converter when the engine is run
    at 2,000 rpm. A temperature sensing probe, which is used to measure inlet and
    outlet temperature of the catalytic converter, can indicate a restricted converter.
    The normal outlet temperature should be about 10 percent higher than the inlet.

