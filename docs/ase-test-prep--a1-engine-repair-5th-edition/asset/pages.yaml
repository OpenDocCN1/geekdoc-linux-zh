  md: '# Section 6 Answer Keys and Explanations


    # Engine Repair (A1)


    ![](img/95183953b74d7b388b46905691681ee3_187_0.png)


    15. A front-wheel drive vehicle''s engine jumps during acceleration and hits the
    underside of the hood. The motor mounts are inspected and although none of them
    appear to be broken, the front mount is coated with oil. Technician A says the
    motor mount was not intact and was the cause of engine movement. Technician B
    says the oil from the fluid-filled hydraulic motor mount, which would allow excessive
    engine movement. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    A is incorrect. The front mount is usually broken if the engine rocks out during
    acceleration, causing the engine to hit the hood. The front mount is often a fluid-filled
    hydraulic mount and, if the oil has leaked out, makes it ineffective.


    B is correct. Technician B is correct. Fluid-filled hydraulic engine mounts are
    becoming commonplace. If the fluid leaks out of the mount, it will not control
    movement and on some vehicles, the engine can hit the underside of the hood.


    C is incorrect. Only Technician B is correct.


    D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_187_1.png)


    16. Reduced turbocharger boost pressure be caused by:


    +   A. Wastegate valve stuck open.

    B. Leaking wastegate diaphragm.

    C. Disconnected wastegate linkage.

    D. Wastegate stuck closed.


    A is correct. A stuck open wastegate will bypass all exhaust from the turbo wheel.

    B is incorrect. A leaking wastegate diaphragm will apply excessive boost.

    C is incorrect. Disconnected wastegate linkage will allow constant boost.

    D is incorrect. A stuck closed wastegate will apply excessive boost.


    ![](img/95183953b74d7b388b46905691681ee3_187_2.png)


    17. A heater hose is being replaced and the technician finds it is stuck on the
    hose nipple. Which of the following is the best solution to solve the problem?


    +   A. Use pliers to twist the hose off.

    B. Run a screwdriver between the hose and nipple and pull it off.

    C. Twist the hose by hand and pull on it at the same time.

    D. Slice the hose lengthwise and peel it off.


    A is incorrect. Using pliers to twist the hose off will damage the hose nipple,
    making it difficult to seal a new hose.

    B is incorrect. The screwdriver will also damage the hose nipple.

    C is incorrect. Twisting the hose by hand may break the hose nipple from the heater
    core. Heater cores are easily damaged.

    D is correct. A stuck hose should be split and peeled off to avoid damaging the
    hose nipple or the heater core.'
