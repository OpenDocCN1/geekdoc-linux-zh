  md: '# Section 2 Overview and Introduction


    Here are some basic guidelines to follow while preparing for the exam:


    +   - Focus your studies on those areas you are weak.

    - Be honest with yourself when determining if you understand something.

    - Study often for short periods of time.

    - Remove yourself from all年纪 when studying.

    - Keep in mind that the goal of studying is not just to pass the exam; the real
    goal is to learn.

    - Prepare physically by getting a good night''s rest before the exam, and eat
    meals that provide energy but not cause discomfort.

    - Arrive early to the exam site to avoid long waits as test candidates check.

    - Use all of the time available for your exams. If you finish early, spend the
    remaining time reviewing your answers.

    - Do not leave any questions unanswered. Absolutely necessary, guess. If unanswered
    questions are automatically scored as incorrect.


    Here are some items you will need to bring with you to the exam site:


    +   - A valid government or school-issued photo ID

    - Your test center admissions ticket

    - A watch (not all test sites have clocks)


    > Note: Books, calculators, and other reference materials are not allowed in the
    exam room. The exceptions to this list are English-Foreign dictionaries or glossaries.
    All items will be inspected before and after testing.


    # WHAT TO EXPECT DURING THE EXAM


    When taking a CBT exam, as soon as you are seated in the testing center, you will
    be given a brief tutorial to acquaint you with the computer-delivered test prior
    to taking your certification exam(s). The CBT allows you to select only one answer
    per question. You can change your answers as many times as you like. When you
    select another answer choice, the CBT will automatically unselect your first answer
    choice. If you want to skip a question to return to later, use the "flag" feature,
    which will allow you to quickly identify and review questions whenever you are
    ready. Prior to completing your exam, you will also be provided with an opportunity
    to review your answers and address any unanswered questions.


    # TESTING TIME


    Each individual ASE CBT exam has a fixed time limit. Individual exam time will
    vary based upon exam area, and range anywhere from a half hour to two hours. You
    will also be given an additional 30 minutes whatever is allotted to complete your
    exam to ensure you have adequate time to perform all necessary check-in procedures,
    complete a brief CBT tutorial, and potentially complete a post-test survey.


    You can register and take multiple CBT exams during one testing appointment. The
    maximum time allotment for a CBT appointment is four and a half hours. If you
    happen to register for so many exams that you require more time than this, your
    exams will be scheduled into multiple


    Delmar, Cengage Learning ASE Test Preparation'
  merge: -1
  pgno: 12
- img_proc: true
  md: '# Section 2 Overview and Introduction


    appointments. This could mean that you have testing on both the morning and afternoon
    of the same day, or they could be scheduled on different days, depending on your
    personal preference and the test center''s schedule.


    It is important to understand that if you arrive late for your CBT test appointment,
    you will not be able to make up any missed time. You will only have the scheduled
    amount of time remaining in your appointment to complete your exam(s).


    Also, most people finish their CBT exams within the time allotted, others might
    feel rushed or not be able to finish the test, due to the stress of a specific,
    individual time limit allotment. Before you register for the CBT exams, you should
    review the number of exam questions that will be asked with the amount of time
    allotted for each exam to determine whether you feel comfortable with the designated
    time limit or not.


    As an overall time management recommendation, you should monitor your progress
    and set a limit you will follow regarding how much time you spend on each individual
    exam question. This should be based on the total number of questions you will
    be answering.


    Also, it is very important to note that for any reason you wish to leave the testing
    room during an exam, you must first ask permission. If you happen to finish your
    exam(s) early and leave the testing site before your designated appointment is
    completed, you are permitted to do so only during specified dismissal periods.


    # UNDERSTANDING HOW YOUR EXAM IS SCORED


    You can gain a better perspective about the ASE certification exams if you understand
    how they are scored. ASE exams are scored by an independent organization having
    no vested interest in ASE or in the automotive industry. With CBT exams, you will
    receive your exam scores immediately.


    Each question carries the same weight as any other question. For example, if there
    are 50 questions, each is worth 2 percent of the total score.


    Your exam results can tell you:


    +   - Where your knowledge equals or exceeds that needed for competent performance,

    - Where you need more preparation.


    Your ASE exam score report is divided into content “task” areas; it will show
    the number of questions in each content area and how many of your answers were
    correct. These numbers provide information about your performance in each area
    of the exam. However, because there may be a different number of questions in
    each content area of the exam, a high percentage of correct answers in an area
    with few questions may not offset a low percentage in an area with many questions.


    It should be noted that not one “fail” an ASE exam. The technician who does not
    pass is simply Large differences in percentages may be important to consider how
    many questions were asked in each area. Since each exam evaluates all of the work
    involved in a specialty service, you should be prepared in each area. A low score
    in one area could keep you from passing an entire exam. If you do not pass the
    exam, you may take it again at any time it is scheduled to be administered.


    There is no such thing as average. You cannot determine your overall exam score
    by adding the percentages for each task area and dividing by the number of areas.
    It doesn’t work that way because there are not the same number of questions in
    each task area. A task area with 20 questions, counts more toward your task score
    than a task with 10 questions.


    Your exam report should give you a good picture of your results and a better understanding
    of your strengths and areas needing improvement for each task area.'
