  md: '# # Preface


    Delmar, a part of Cengage Learning, is very pleased that you have chosen to use
    our ASE Test Preparation Guide to help prepare yourself for the Engine Repair
    (A1) ASE certification examination. This guide is designed to help you prepare
    for your actual exam by providing you with an overview of the testing process,
    introducing you to the task list for the Engine Repair (A1) certification exam,
    giving you an understanding of what knowledge and skills you are expected to have
    in order to successfully perform the duties associated with each task, and providing
    you with several preparation exams designed to emulate the live exam content in
    hopes of assuring your overall readiness.


    If you have a basic working knowledge of the discipline you are mastering, you
    will find this book to be an excellent guide, helping you understand “must know”
    to successfully pass the ASE certification exam. This manual is not a textbook.
    Its objective is to prepare the individual who has the requisite experience and
    knowledge to attempt the challenge of the ASE certification process. This guide
    cannot replace experience and theoretical knowledge required by ASE to master
    the vehicle repair technology associated with this exam. If you are unable to
    understand more than a few of the preparation questions and their corresponding
    explanations in this book, it could require you more shop-floor experience or
    further study.


    This book begins by providing an overview of, and introduction to, the testing
    process. This section outlines what we recommend you to prepare, what to expect
    on the actual test day, and overall methodologies for your success. This section
    is followed by a detailed overview of the ASE task list to include explanations
    of the knowledge and skills you must possess to successfully answer questions
    related to each particular task. After the task list, we provide six sample preparation
    exams for your use as a means of evaluating areas of understanding, as well as
    areas requiring improvement in order to pass the exam. Delmar is the first and
    only test organization to provide so many unique preparation exams. We enhanced
    our guides to include this support as This guide includes the answer keys for
    each preparation exam, each answer explanation also contains a reference back
    to the related task or tasks that it assesses. This will provide you with a quick
    and easy method for referring back to the task list whenever you need. The last
    section of this book contains blank answer sheets you can use as you attempt each
    preparation exam, with a glossary of terms.


    # # OUR COMMITMENT TO EXCELLENCE


    Thank you for choosing Delmar, Cengage Learning for your ASE test preparation
