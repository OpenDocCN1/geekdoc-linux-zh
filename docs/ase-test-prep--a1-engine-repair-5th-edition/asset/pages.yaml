  md: '# Section 2 Overview and Introduction


    included in the scored sections of the exam; the “rejects” are sent back to the
    drawing board or discarded altogether.


    Depending on the type of the certification exam, you will be asked between 40
    and 80 multiplechoice questions. You can determine the approximate number of questions
    you can expect to be asked during the Engine Repair (A1) certification exam by
    reviewing the test list in Section 4 of this book. The five-year recertification
    exam will cover this same content; however, the number of questions for each content
    area of the recertification exam will be reduced by approximately one-half.


    > Note: Exams may contain questions that are included for statistical purposes
    only. Your answers to these questions will not affect your score, but since you
    do not know which ones are, you should answer all questions in the exam.


    Using multiple choice, including cross-sections by age, race, and other background
    information, ASE is able to guarantee that exam questions do not include bias
    for or against any particular group. A question that shifts bias toward any particular
    group is discarded.


    # TEST-TAKING STRATEGIES


    Before beginning your exam, quickly look over the exam to determine the total
    number of questions that you will need to answer. This knowledge will help you
    manage your time throughout the exam to ensure you have enough to answer all of
    the questions presented. Read through each question completely before marking
    your answer. Answer the questions in the order they appear on the exam. Leave
    the questions that you are not sure of and move on to the next question. You can
    return to unanswered questions after you have finished the others. These may be
    easier to answer at a later time when your mind had had time to consider them
    on a subconscious level. In addition, you may find information in other questions
    that will help you recall the answers to some of them.


    Multiple-choice exams are sometimes challenging because there are often several
    choices that seem possible, or partially correct, and it may be difficult to decide
    on the most appropriate choice. The best strategy, in fact, is to first determine
    the correct answer before looking at other options. If you see the answer you
    decided on, you should still be careful to examine the other options to make some
    more correct than yours. If you do not know or are not sure of the answer, read
    each option very carefully and to eliminate options that you know are incorrect.
    That way, you can often arrive at the correct answer through a process of elimination.


    If you have gone through the entire exam, and still do not know the answer to
    some of them, guess. Yes, guess. You have at least a 25 percent chance of being
    correct. While your score is based on the number of questions answered correctly,
    any question left blank, or unanswered, is automatically scored as incorrect.

    A little of “folk” wisdom depends on the test taking that you have about as you
    prepare for your ASE exam. For example, there are those who would advise avoiding
    responses that use certain words like all, alone, never, must, and only, to name
    a few. This claim, that nothing in life is exclusive. They would advise you to
    choose response options that use words that allow for exception, like sometimes,
    frequently, often, seldom, and normally. They also suggest answering as the first
    and last option (A or D) because exam writers, feel more comfortable if they put
    the correct answer in the (B or C) of choices. Another recommendation offered
    is to select the option that is shorter or longer than the other three choices
    because it is more likely to be correct. Some would advise you to never change
    an answer since your intuition is usually correct. Another area of “folk” wisdom
    focuses specifically on repetitive patterns created by your question responses
    (e.g., A, B, C, A, B, C, A, B, C).'
