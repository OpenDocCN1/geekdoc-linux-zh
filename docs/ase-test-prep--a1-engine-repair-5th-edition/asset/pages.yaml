  md: '# Types of Questions on an ASE Exam


    Analyzing this type of question is a little easier than the other types because
    there are only two ideas to consider, although there are still four choices for
    an answer.


    Again, Technician A, Technician B questions are double true-or-false questions.
    The best way to analyze this type of question is to consider each technician''s
    statement separately. Ask yourself, "Is A true or false? Once you have completed
    this individual evaluation of each answer choice, you will have successfully determined
    the correct answer for the question, "Who is correct?"


    An important point to remember is that an ASE Technician A, Technician B will
    never have Technician A and B directly disagree with each other. That is why you
    must evaluate each statement independently.


    An example of a Technician A/Technician B style question looks like this:


    +   1. A noise is coming from the accessory device on the front of a diesel engine.
    Technician A says the serpentine belt can be removed to help determine if it is
    the source of the noise. Technician B says water dripped on the belt can help
    determine if the belt is the source of the noise. Who is correct?

    A A only

    B B only

    C. Both A and B

    D Neither A nor B


    ![](img/95183953b74d7b388b46905691681ee3_16_0.png)


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both technicians are correct. The belt can be removed for
    a short time to determine if it is the source of the noise. Also, if the noise
    disappears when a few drops of water are on the running belt, the technician knows
    the belt is the source of the noise.

    Answer D is incorrect. Both technicians are correct.


    # EXCEPT QUESTIONS


    Another type of question type used on the ASE exams contains answer choices that
    are all correct except for one. To help identify this type of question, the word
    "EXCEPT" will always be displayed in capital letters. Furthermore, a cautionary
    statement will alert you to the fact that the next question is different from
    the others found in the exam. With the EXCEPT type of question, only one incorrect
    choice will be listed among the options, and that incorrect choice will be the
    key to the question. That is, the incorrect statement is counted as the answer
    for that question.


    Be careful to read these questions slowly and thoroughly; otherwise you may overlook
    the question is actually asking and answer the question by selecting the first
    correct statement.


    An example of this type of question would appear as follows:


    +   1. A diesel engine is being checked for an engine oil leak. All of the following
    could be used to help locate the source of the leak EXCEPT:

    A. Black light.

    B. White powder.

    C. Vacuum gauge.

    D. Oil dye.


    ![](img/95183953b74d7b388b46905691681ee3_16_1.png)'
