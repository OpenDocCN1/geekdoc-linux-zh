  md: '# Section 4 Task List Overview


    # Engine Repair (A1)


    +   6. If the valves are sticking, the vacuum gauge fluctuates.


    +   7. If, when the engine is accelerated and held steady at a higher speed, the
    vacuum gauge pointer gradually falls, the catalytic converter or other exhaust
    system components are restricted.


    # 7. Perform cylinder balance tests; determine necessary action.


    In a sound engine, each cylinder contributes equal amounts of power. A common
    method of isolating a power loss that may be occurring in one or more of the cylinders
    is the power balance test. In most engines, this test is performed by disabling
    the spark on a single cylinder for a short time to measure the RPM drop that occurs
    when a cylinder is not contributing. The ignition should be disabled for the shortest
    amount of time possible to prevent catalytic converter damage. Cylinders that
    are not contributing or weak will show little or no RPM drop when they are disabled.
    On port injected engines with the power train control module (PCM) and a scanner.
    On-board diagnostics (OBD) II vehicles will quickly pick up and identify an inefficient
    cylinder, displaying a code directing to the perceived problem and affected cylinder.


    When a particular cylinder or cylinders fail a power balance test, it becomes
    necessary to determine if the cause is mechanical: valves, internal engine, or
    management related. Management issues could include fuel injectors that leak or
    are electrically damaged faulty ignition components like spark plugs, distributorless
    (DIS) coils, plugs, etc. The power balance test is usually the precursor to a
    cylinder compression and/or leak test. These tests will confirm a mechanical issue
    and electrical diagnosis using digital storage oscilloscopes or scanners can determine
    engine management issues.


    # 8. Perform cylinder cranking tests; determine necessary action.


    The ignition and fuel injection system must be disabled before proceeding with
