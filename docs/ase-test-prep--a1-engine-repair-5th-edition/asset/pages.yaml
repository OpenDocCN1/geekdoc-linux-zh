  md: '# # The History and Purpose of ASE


    ASE began as the National Institute for Automotive Excellence (NIASE). It was
    founded as a non-profit, independent entity in 1972 by a group of industry leaders
    with the single goal of providing means for consumers to distinguish between incompetent
    and competent technicians. It accomplishes this goal through the testing and certification
    of repair and service professionals. Though it is still known as the National
    Institute for Automotive Excellence, it is now called "ASE" for short.


    Today, ASE offers more than 40 certifications in automotive, medium/heavy duty
    truck, collision repair and refinish, school bus, parts specialist, service consultant,
    and other industry-related areas. At this time, there are more than 385,000 professionals
    nationwide with current ASE certifications. These professionals are employed by
    new car and truck dealerships, independent repair facilities, fleets, service
    stations, and service facilities.


    ASE certification exams are industry-driven and cover practically every-highway
    vehicle service segment. Certification consists of passing at least one exam and
    documenting two years of relevant work experience. To maintain certification,
    those ASE credentials must be re-tested every five years.


    While ASE certifications are a targeted means of acknowledging the skills and
    abilities of an individual technician, ASE also has a program to provide recognition
    for highly qualified repair, support, and parts businesses. The Blue Seal of Excellence
    Recognition Program, allows businesses to showcase their technicians and their
    commitment to excellence. One of the requirements of becoming Blue Seal recognized
    is that the facility must have a minimum of 75 percent of their technicians ASE
    certified. Additional criteria apply, and details can be found on the ASE website.


    ASE recognized educational programs serving the service and repair industry also
    needed a way to be recognized having the facility, facilities, and equipment to
    provide a quality education to students wanting to become service professionals.
    Through the combined efforts of ASE, industry, and education leaders, the non-profit
    organization the National Automotive Technicians Foundation (NATEF) was created
    in 1983 to evaluate and recognize academic programs. Today more than 2,000 educational
    programs are NATEF certified.


    For additional information about ASE, NATEF, or any of their programs, the following
    contact information can be:


    National Institute for Automotive Service Excellence (ASE)

    101 Blue Seal Drive S.E.

    Suite 101

    Leesburg, VA 20175

    Telephone: 703-669-6600

    Fax: 703-669-6123

    Website: www.ase.com'
