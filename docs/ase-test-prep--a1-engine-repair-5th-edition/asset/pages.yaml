  md: '# Section 6 Answer Keys and Explanations


    # Engine Repair (AT)


    4. Technician says that valve springs must be tested at both open height and closed
    height. Technician B says if the pressure is low at the closed height but good
    at the open height, the spring can be reused. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_164_0.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is correct. Only Technician A is correct. The pressure must be tested
    at both open valve height and closed valve height to ensure the proper tension
    on the valve at all times.


    Answer B is incorrect. The pressure must be within specifications at both heights
    to properly control tension on the valve.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician A is correct.


    5. After performing a compression test on a 4-cylinder engine, the results show
    low pressure in cylinders #1 and #3. Technician A says this could be caused by
    a blown head gasket between the cylinders. Technician B says a cylinder leakage
    test would help pinpoint the problem. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_164_1.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Cylinders #1 and #3 are not adjacent cylinders. The head
    gasket cannot be blown between the two.


    Answer B is correct. A cylinder leakage test would help pinpoint the source of
    compression loss.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    6. Technician says a power balance test is used to pinpoint the cause of low compression
    test results. Technician B says a power balance test is used to pinpoint an underperforming
    cylinder. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_164_2.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A cylinder leakage test would be used to pinpoint the cause
    of/low compression.


    Answer B is correct. Only Technician B is correct. During a balance test, each
    cylinder is shorted one at a time. The cylinder with the least amount of RPM drop
    is the underperforming cylinder.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.'
