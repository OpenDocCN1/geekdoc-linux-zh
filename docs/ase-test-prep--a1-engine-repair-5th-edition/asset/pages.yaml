    Some thermostats have a vent, “jiggle” pan, or check assembly mounted toward the
    edge of the mounting flange. This device, which trapped air to pass through the
    thermostat, must be oriented properly. In most cases, the device must point upward.
    Check the engine manufacturer’s service manual for instructions.


    Inspect the thermostat housing and by-pass hose (if equipped) for cracks, deterioration,
    and restrictions. Thermostat housings are often made of sheet metal or a light
    alloy that corrodes rapidly when coolant is not changed at the recommended intervals.
    Replace a deteriorated thermostat housing or by-pass hose.


    # 10. Inspect and test coolant; drain, flush, and refill system with recommended
    coolant; bleed as required.


    Coolant service is a topic addressed differently by technicians in different repair
    venues. We will offer information that would be generic to all repair techniques.
    In an ASE test working, the participants will make all agree on the content of
    the test so manufacturer specific items will not appear in the test unless they
    are considered industry standard. It is very important to keep this in mind when
    taking the test.


    When testing coolant, there are many methods to reach results but the ultimate
    results are the same. We want to know the protection levels of the coolant for
    freezing, boiling, PH, corrosion protection, and in some vehicles, nitrites. Let’s
    take a quick look at each area.


    Freezing and boiling protection is for the most part. Most manufacturers agree
    that a mixture of 50 cent water to 50 percent coolant provides the best of both
    worlds in this area and the best coolant protection. All manufacturers will also
    agree that you should be sure to use the correct coolant in the vehicle without
    mixing coolant types or changing to one not designed for the vehicle.


    PH is a measurement of the acidity or alkalinity of the coolant. As coolant becomes
    older, it tends toward the acidic end of the PH scale. Most Asian vehicles aim
    for 7-9 and most American and European vehicles aim for 8-9.5 on the scale. Low
    PH readings can be due to a deteriorated antifreeze condition or a water-heavy
    blend, as water is more toward the acidic side than a coolant mix. Very high numbers
    can be caused by over adding antifreeze or coolant packages during service.


    In normal use, vehicles with high output ignition systems, particularly DIS systems,
    will cause the coolant to be electrically charged which promotes debris in the
    system to adhere to metal parts and can cause radiator restriction. This can only
    be corrected by replacing the antifreeze or reversing the charge in the system
    by using some ionizing coolant recovery systems.'
