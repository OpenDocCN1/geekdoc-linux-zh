  md: '# # Section 6 Answer Keys and Explanations


    # ## Engine Repair (A1)


    ![](img/95183953b74d7b388b46905691681ee3_207_0.png)


    16. While checking coolant level in the radiator, red oily specs are not noted
    floating on the coolant. Technician A says this is rust and the system should
    be flushed. Technician B says this is probably transmission fluid and the cooler
    built into the radiator is leaking. Who is correct?


    +   - A only

    - B only

    - Both A and B

    - Neither A nor B


    Answer A is incorrect. Rust in the cooling system will usually settle to the bottom
    of the radiator since it is heavier than the coolant.


    Answer B is correct. Only Technician B is correct. Oil floats on liquid and the
    red oily specs in the coolant are probably transmission fluid coming from the
    cooler built into the radiator.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_207_1.png)


    17. The technician has done a compression test on an engine and found cylinders
    #1 and #3 to have low compression. What would the next test he should do in his
    diagnosis?


    +   - Power balance test

    - Cylinder leakage test

    - Wet compression test

    - Dynamic compression test


    Answer A is incorrect. A power balance test would not be done. He is looking for
    a mechanical failure, not an ignition or fuel failure.


    Answer B is incorrect. A cylinder leakage test may need to be done but it is not
    the next test.


    Answer C is correct. A wet compression test will indicate whether the loss of
    compression is through the rings or somewhere else.


    Answer D is incorrect. A dynamic compression test checks for proper breathing
    in an operating engine and would not be the next test.


    ![](img/95183953b74d7b388b46905691681ee3_207_2.png)


    18. Technician A says a hydraulic lifter in a pushrod engine may pump up during
    high RPM operation. Technician B says this may cause bent valves. Who is correct?


    +   - A only

    - B only

    - Both A and B

    - Neither A nor B


    Answer A is incorrect. Technician B is correct.


    Answer B is incorrect. Technician A is correct.


    Answer C is correct. Both Technicians are correct. During high RPM operation in
    a pushrod engine, the lifter may pump up and hold the valve open due to slight
    amounts of lash in the valve train. When this happens, the valve may be open and
    hit by the piston; at the very least, the engine will stall.


    Answer D is incorrect. Both Technicians are correct.'
