    Answer A is incorrect. A lean fuel mixture would not cause a sulfur smell.

    Answer B is incorrect. Cool leaking into the combustion chamber would cause exhaust
    color with a sweet smell.

    Answer C is correct. A rich fuel mixture will cause a strong sulfur smell from
    the exhaust as the extra fuel is burned in the converter.

