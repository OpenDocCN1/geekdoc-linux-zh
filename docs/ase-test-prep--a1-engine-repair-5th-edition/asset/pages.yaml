    D. Neither A nor B\n\nAnswer A is incorrect. Technician B is also correct.\n\n\
    Answer C is correct. Both Technicians are correct. A test drive lets you confirm\
    \ the customer's complaint and checking for technical service bulletins may save\
    \ diagnostic time.\n\nAnswer D is incorrect. Both Technicians are correct. \n\n\
    3. Technician A says that when measuring piston ring to ring clearance, you should\
