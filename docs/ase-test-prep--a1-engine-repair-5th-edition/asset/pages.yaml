- img_proc: true
  md: '# Section 6 Answer Keys and Explanations


    # Engine Repair (A1)


    40. A technician begins his diagnostic procedure to repair a vehicle. Which of
    the following would be the LEAST LIKELY steps he would take?


    +   A. Road test the vehicle.

    B. Question the customer for more information regarding the problem.

    C. Make sure the original complaint is fixed.

    D. Start with the most difficult tests.


    Answer A is incorrect. A technician should test drive the vehicle to verify the
    complaint.

    Answer B is incorrect. It is good practice to question the customer to get all
    the information regarding the problem that can provide.


    Answer C is correct. The original complaint must be fixed to ensure customer satisfaction.

    Answer D is correct. During diagnosis, the technician will start with the simple
    and most his way through to the difficult tests. Most of the problem will be diagnosed
    and corrected before he gets to the difficult tests.


    41. A technician says some bearing bores are correct for alignment with a straightedge
    and a feeler gauge. Technician B says main bearing bores are out of alignment
    can be corrected by line boring. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.


    Answer C is correct. Both Technicians are correct. The proper tools to check bore
    alignment are the straightedge and feeler gauge; line boring would straight out
    of alignment bores.

    Answer D is incorrect. Both Technicians are correct.


    42. A technician says the upper oil galleys in the block may be sealed with pipe
    plugs. Technician B says the oil galley plugs must be removed to properly clean
    the galleys. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.


    Answer C is correct. Many upper oil galleys are sealed with pipe plugs that must
    be removed during cleaning to make sure the galleys are completely clean.

    Answer D is incorrect. Both Technicians are correct.'
