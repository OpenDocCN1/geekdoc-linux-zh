  md: '# Types of Questions on an ASE Exam


    Answer A is incorrect. A dial indicator is used to measure end-play or run out.
    It would not be useful to measure crankshaft main bearing clearance.


    Answer B is correct. Plastigauge is the most common method of measuring crankshaft
    main bearing clearance.


    Answer C is incorrect. An outside micrometer is used to measure the outside dimension
    of a part; however, it cannot measure crankshaft main bearing clearance.


    Answer D is incorrect. A dial caliper is used to measure outside depth or inside
    dimensions, but it would not be an effective tool to measure crankshaft main bearing
    clearance.


    # COMPLETION QUESTIONS


    A completion question is similar to the direct question except the statement may
    be completed by any one of the four options to form a complete sentence.

    Here is an example of a completion question:


    ![](img/95183953b74d7b388b46905691681ee3_15_0.png)


    +   2. A diesel engine has an accelerator pedal position diagnostic trouble code.
    The technician wiggles the wiring harness while observing the accelerator pedal
    position sensor voltage with the scan tool. The sensor voltage changes. The most
    likely cause of the trouble code is:

    A. Faulty scan tool.

    B. Faulty ECM.

    C. Faulty accelerator pedal position sensor wiring.

    D. Faulty ECM power supply.


    Answer A is incorrect. If the voltage value changed while moving the wiring harness,
    there is no reason to believe the scan tool is faulty.


    Answer B is incorrect. If the voltage value changed while moving the wiring harness,
    there is no reason to believe the ECM is faulty.


    Answer C is correct. If the voltage value changed while moving the wiring harness,
    the most likely cause is the wiring harness.


    Answer D is incorrect. If all other items associated with the ECM are normal and
    the voltage value changed while moving the wiring harness, the most likely cause
    is the wiring harness.


    # TECHNICIAN A, TECHNICIAN B QUESTIONS


    This type of question is usually associated with an ASE exam. It is, in fact,
    two true-false statements grouped together, such as: “Technician A says...” and
    “Technician B says...”, followed by “Who is correct?


    In this question, you must determine either both, or neither of the statements
    are correct. To answer this question correctly, you must carefully read each technician''s
    statement and judge it on its merit.


    Sometimes this type of question begins with a statement about some analysis or
    repair procedure. This statement provides the setup or background information
    required to understand the conditions about which Technician A and Technician
    B are talking, by two statements about the cause of the concern, proper inspection,
    identification, or repair choices.'
