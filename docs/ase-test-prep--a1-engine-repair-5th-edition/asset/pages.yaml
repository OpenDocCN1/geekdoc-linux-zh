    In the modern automotive repair shop environment, a Customer Service Specialist,
    or Service Consultant, is usually responsible for collecting information from
    the customer to assist the technician in resolving a customer''s concern. Armed
    with this information, his skills, and a fair amount of intuition, the technician
    must determine the cause of the particular concern.


    One of the most important tools a technician can utilize is the pre-test drive.
    During this, he may be able to determine the problem and other conditions that
    may contribute to relate to the concern. After verifying the customer''s concern,
    the technician must determine the most efficient diagnostic path to take. Most
    experienced technicians will check with available information systems to see if
    the problem they are diagnosing is described in a technical service bulletin or
    service campaign. In some instances, may be necessary to have the customer drive
    the vehicle with the technician as a passenger to create the exact scenario for
    the complaint.


    Once the problem is found and resolved, a final test drive allows the technician
