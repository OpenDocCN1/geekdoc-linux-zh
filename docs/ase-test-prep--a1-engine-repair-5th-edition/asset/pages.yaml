    # ## 12. Adjust valves on engines with mechanical or hydraulic lifters.


    Valve lasting procedures and mechanisms vary from manufacturer to manufacturer.
    On some engines valves are adjusted when the engine is cold. In others, the engine
    should be at operating temperature. Refer to the appropriate service manual for
    instructions.


    On some engines with mechanical valve lifters, the rocker arms move while the
    piston is equipped with a lockout on the valve stem end of. Other engines use
    an interference screw without a lockout. The procedure usually involves rotating
    the crankshaft to position the piston in the cylinder being adjusted at top dead
    center (TDC) on the compression stroke. Feeler gauges are inserted between the
    adjusting screw and the valve stem. If clearance is excess, the adjustment screw
    (if equipped) is loosened and the adjusting screw is turned. When clearance is
    correct, a feeler gauge of the correct thickness will slide between the adjusting
    screw and the valve stem with a light push. Tighten the lockout (if equipped)
    when clearance is correct.


    Some OHC engines fitted with mechanical valve lifters have removable metal pads
    in each lifter or spring retainer. Clearance is measured by placing retainer between
    the cam lobe and the lifter or spring retainer at TDC. Pads are placed in various
    thicknesses to adjust the clearance to specifications. Another variation of this
    method will not have removable pads and the entire valve lifter must be replaced
    with one that has the correct thickness.


    Some valve trains have hydraulic lifters and individual rocker arm pivots with
    self-locking nuts. These valve trains require an initial adjustment of the rocker
    arm nut to position the lifter plunger. With the valve closed, loosen the rocker
    arm nut until there is clearance between the end of the rocker arm and the valve
    stem. Slowly turn the rocker arm clockwise until a zero lash condition exists.
    This occurs when the lifter is not protruded but all of the components come in
    contact with each other. The next step is to apply the preload specified by the
    manufacturer. In most applications, this is the equivalent of .03-.06 of an inch
    of lifter lead. It is important to follow the manufacturer''s specs here as the
    lifter must be able to compensate for expansion and contraction of valve train
    components during cold to fully warm engine operation.


    The valve train on engines with hydraulic lifters and stud-mounted rocker arms
    can also be adjusted while the engine is running. After removing the valve covers,
    install oil shrouds on the rocker arms to prevent oil from splashing into the
    exhaust manifolds and other parts. Start the engine and loosen the rocker retainer
    until a clicking noise stops. From this point, slightly tighten the nut until
    about 1/4 turn or the specified number of turns. Wait a few seconds between each
    1/4 turn to allow the lifter to leak down. Turning the adjusting screw too much
    at one time can cause piston-valve contact.'
