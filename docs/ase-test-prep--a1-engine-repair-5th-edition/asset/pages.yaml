    Technician B uses the thermostat to open at 180 degrees. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A thermostat rated at 180 degrees begins to open at that
    temperature.

    Answer B is correct. Only Technician B is correct. A thermostat rated at 180 degrees
    begins to open at that temperature and is fully open at about 220 degrees.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_212_1.png)


