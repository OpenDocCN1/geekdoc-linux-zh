  md: '# Section 6 Answer Keys and Explanations


    7. All of the following are causes of low engine oil pressure EXCEPT:


    +   A. Worn camshaft bearings.

    B. Partially plugged oil pickup screen.

    C. Worn crankshaft bearings.

    D. Restricted pushrod passages.


    Answer A is incorrect. Worn camshaft bearings will cause low engine pressure as
    there will be more oil runoff.


    Answer B is incorrect. A partially plugged pickup screen will restrict oil flow
    through the pump resulting in low pressure.


    Answer C is incorrect. Worn crankshaft bearings will allow oil runoff resulting
    in low oil pressure.


    Answer D is correct. Restricted pushrod passages will only prevent oil from reaching
    the rocker arms and will not result in low oil pressure.


    ![](img/95183953b74d7b388b46905691681ee3_127_0.png)


    8. In the figure above, what is the technician checking?


    +   A. Head warpage

    B. Piston protrusion

    C. Surface finish

    D. Head bolt hole alignment


    Answer A is correct. Using a straightedge and feeler, the technician is checking
    for warpage.


    Answer B is incorrect. Piston protrusion is measured with a depth gauge.


    Answer C is incorrect. Surface finish is measured with a profilometer.


    Answer D is incorrect. Head bolt alignment would require the head to be on the
    block.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Section 6 Answer Keys and Explanations


    9. The customer is concerned about poor performance at highway speeds. The technician
    talks to the owner about the car''s repair history and is told that the timing
    belt, water pump, and crank seal have been recently replaced, and the problem
    started afterward. What is the most likely cause for poor performance?


    +   A. The serpentine belt is loose.

    B. The spark plug wires were misrouted.

    C. The camshaft and crankshaft are out of sync.

    D. The catalytic converter is restricted.


    Answer A is incorrect. A loose serpentine belt will cause a squeal but not affect
    performance.

    Answer B is incorrect. Misrouted spark plug wires would cause a misery and poor
    performance all the time.


    Answer C is correct. If the camshaft and crankshaft were not positioned properly
    during timing, belt replacement performance would suffer at higher RPM.

    Answer D is incorrect. A restricted converter would cause performance problems
    at any speed.


    10. Technician A says the air intake assembly may cause poor performance if it
    is not properly attached. Technician B says all vehicles use a map sensor to tell
    the electronic control module (ECM) of the amount ingested air. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither nor B


    Answer A is incorrect. Only Technician A is correct. If the air intake assembly
    is poorly attached, it will allow unmetered air into the engine, which may cause
    stumbling and performance.

    Answer B is incorrect. Map sensors are only one of the ways to tell the ECM volume
    of air flow into the intake. Many manufacturers use an air flow sensor in the
    air intake ductwork.

    Answer C is correct. Only Technician A is correct.

    Answer D is incorrect. Technician A is correct.


    11. The customer''s complaint is that there is blue smoke from the tailpipe on
    startup in the morning, which seems to dissipate quickly. Technician A says that
    the blue smoke is caused by oil burning in the combustion chamber. Technician
    B says the oil is probably entering the combustion chamber by deteriorated valve
    stem seals. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct, Both Technicians are correct. Blue smoke that quickly dissipates
    on initial cold start is a sign that valve stem seals are allowing oil to run
    down the valve stem into the combustion chamber after warm shutdown.

    Answer D is incorrect. Both technicians are correct.


    ![](img/95183953b74d7b388b46905691681ee3_128_0.png)


    ![](img/95183953b74d7b388b46905691681ee3_128_1.png)


    ![](img/95183953b74d7b388b46905691681ee3_128_2.png)'
