- img_proc: true
  md: '# Section 6 Answer Keys and Explanations


    34. Technician A says the air intake duct is in the engine compartment. Technician
    B says to check for contaminants in the inlet when checking or replacing the air
    filter. Which is correct?


    ![](img/95183953b74d7b388b46905691681ee3_235_0.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Intake air should come from outside air, not the engine
    compartment. Engine compartment air is higher in temperature than outside air,
    which raises cylinder temperature.


    Answer B is correct. Only Technician B is correct. If the inlet is not cleaned
    when the filter is changed, the contaminants in it may block the new air filter.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    35. Technician A says a stuck or sticky valves may cause bent valves. Technician
    B says a timing belt off by three teeth may cause bent valves. Which is correct?


    ![](img/95183953b74d7b388b46905691681ee3_235_1.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is correct.


    Answer C is correct. Both Technicians are correct. Any time a valve fails to close
    at the proper time, the piston may contact it. A sticky or stuck valve is slow
    to close. If the camshaft and crankshaft are out of synchronization, the piston
    may contact a valve.


    Answer D is incorrect. Both Technicians are correct.


    36. Technician A says an engine oil cooler may be located in one of the radiator
    tanks.

    Technician B says a transmission oil cooler may be located in one of the radiator
    tanks. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_235_2.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is correct.


    Answer C is correct. Both Technicians are correct. An oil cooler tank and/or a
    transmission cooler may be mounted inside the radiator side tanks.


    Answer D is incorrect. Both Technicians are correct.'
