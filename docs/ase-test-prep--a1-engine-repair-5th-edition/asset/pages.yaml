    Answer A is incorrect. An open thermostat will cause the engine to be slow, or
    to reach normal operating temperature, causing the computer to stay in open loop.

    Answer B is incorrect. An open thermostat causing slow engine warm up will cause
    poor fuel economy.

    Answer C is correct. An open thermostat will not cause boil over and loss of coolant.

    Answer D is incorrect. Longer than normal warm-up is a result of a thermostat
    failing in the open position.'
