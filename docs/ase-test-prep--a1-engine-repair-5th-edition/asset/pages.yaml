    If the starter fails to crank the engine, the problem may range from a faulty
    starter motor to broken components inside the engine. If no sounds come from the
    starter motor when it is activated, disable the ignition system, and then attempt
    to rotate the crankshaft by hand in the normal direction of rotation. If the crankshaft
    can be rotated freely by two complete revolutions, a diagnosis of the vehicles
    starting system is the next step.'
