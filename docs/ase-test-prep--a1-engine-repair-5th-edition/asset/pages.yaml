  md: '# Section 4 Task List Overview


    # Engine Repair (A1)


    A faulty crankshaft or rod bearing usually makes a knocking sound that is very
    deep in pitch. Main bearing knock is usually a thumping noise most noticeable
    when the engine is started. Connecting rod bearings also cause a heavy knocking
    sound, and engine oil pressure may also be low, especially at idle. When the cylinder
    with faulty connecting rod is disabled during a cylinder balance test, the knocking
    sound will diminish.


    Loose flywheel bolts may cause a thumping noise at idle. Camshaft bearings do
    not cause a noise unless severely worn.


    Worn pistons and cylinders cause a rising noise while accelerating. When performing
    a cylinder balance test, piston noise increases when the faulty cylinder is disabled
    (the opposite of a bad connecting rod bearing). A piston with excessive clearance
    makes a "double click" noise when the engine is idling.


    Lifters also make a distinctive noise, a loud ticking sound. One way to isolate
    lifter (or other valve train) noise from connecting rod noise is to remember that
    the camshaft operates at half of crankshaft speed. It is common for a excessive
    leak-down to occur for a few seconds after the engine starts. The noise goes away
    once oil pressure is developed.


    Vibrations can be caused by engine accessory components, but more often are caused
    by internal engine failures such as bearings or pistons. Some vibrations will
    result in a vibration damper. Vibrations caused by faulty vibration dampers can
    be identified as they typically be present only at certain RPMs, i.e. 750, 1,500,
    and 2,250. Vibrations can be caused out of time balance shafts. These shafts are
    chain, belt, or gear driven.


    # 5. Diagnose the cause of excessive oil consumption, coolant consumption, unusual
    exhaust color, and odor; determine necessary action.


    Excessive oil consumption can be due to leaking from the engine or oil being into
    the cylinders and burned. Before blaming internal components, be absolutely sure
    that oil is not leaking from the engine. In some cases, oil only leaks when the
    engine is running. If necessary, raise the vehicle on a lift to check for leaks.
    The radiator and/or coolant reservoir should also be checked for signs of oil
    leaking into the coolant.


    Oil can enter the cylinders several ways, including: worn rings; scored cylinders;
    wall guides; seals; and stems; plugged oil drain passages. As a general rule,
    an engine that is "burning oil" will emit blue-gray exhaust. This may be more
    noticeable on acceleration and deceleration. Do not confuse the blue-gray smoke
    due to oil consumption with the black exhaust that occurs when the air/fuel ratio
    is too high.


    Plugged oil drain passages in the cylinder head or block can cause excessive oil
    consumption when rings and guides are in good condition. Remove the oil filter
    cap or another component fitted to a valve cover and start the engine. If the
    oil level inside the cover rises steadily as the engine runs and reaches the top
    of the valve guides, the passages are clogged. While these passages can usually
    be cleared of sludge, the sludge is an indication that the engine was poorly maintained.
    Clearing the passages will properly reduce oil consumption, but the engine may
    experience other problems in the near future. Oil found in the cooling system
    can be leaking from an internal cooler (in the radiator tank) or from a head gasket
    on OHC engine.


    Perform compression tests (Task A.8) and cylinder leakage tests (Task A.9) to
    confirm piston rings/cylinders or valve guides are worn.'
