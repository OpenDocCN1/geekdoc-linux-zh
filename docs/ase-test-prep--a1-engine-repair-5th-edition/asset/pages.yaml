    over.

    Answer B is incorrect. A faulty radiator hose will swell under pressure.

    Answer C is incorrect. A stuck open thermostat will not allow the engine to reaching
    operating temperature as it should.

    Answer D is correct. A defective radiator cap vacuum valve will cause a vacuum
    to be developed in the cooling system when it cools down and may cause the upper
    hose to collapse.


