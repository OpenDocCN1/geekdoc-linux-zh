    # C. Engine Block Diagnosis and Repair (10 Questions)


    +   1. Remove and disassemble engine block; clean and prepare components for inspection
    and reassembly.


    Mount the engine on a stand and remove the oil drain plug. Any oil that has accumulated
    in the pan during engine removal drain into a pan. Remove the lifters from the
    block and store them in an organizer for later inspection. Turn the engine block
    upside down, remove the oil bolts, and remove the pan from the block. If the pan
    is "glued" to the block with room temperature vulcanizing (RTV) sealant, strike
    a stroke corner of the pan with a rubber mallet to loosen it.


    Check the crankshaft and connecting rod caps to see if they are marked for position
    and direction. Main bearing caps often have numbers and arrows point into each
    cap. Arrows typically point to the front (timing device end) of the engine. Connecting
    rods are often stamped with the cylinder number on the bolt body and cap, the
    cap parting line. Take note of the numbers (or oil squirt holes) for all connecting
    rods. If rod or main caps are not marked, mark each with a number punch, center
    punch, or scratch.


    Inspect the cylinder bores for ring edges. If the ring is seized, it should be
    removed before attempting to remove the piston/connecting rod assemblies. Use
    a ridge reamer to remove the ridge (Task C.4).


    Loosen the connecting cap bolts or remove the caps. Keep used bearing inserts
    with their caps for later inspection. If bolts are held captive in the connecting
    rod bodies, place a short length of line hose over each bolt to protect the crankshaft
    journals piston/rod metal.


    Carefully push each piston/connecting rod assembly out of its cylinder. When an
    assembly is removed, immediately reinstall its matching rod and caps.


    Remove the harmonic balancer or pulley hub from the crankshaft nose and remove
    the balancer. Some slide off the nose, but not a press fit. Use a special harmonic
    balancer/installation tool to remove a press-fit balancer. Using a puller to remove
    a press-fit balancer will permanently damage the balancer.


    Remove the timing chain/belt cover bolts and remove the cover. On engines fitted
    with timing chain tensioning devices, compress and lock the tensioner shoe in
    place, if possible. Remove the tensioner and timing chain guides from the front
    of the block. Remove the oil slider, if one is present, from the crankshaft nose.


