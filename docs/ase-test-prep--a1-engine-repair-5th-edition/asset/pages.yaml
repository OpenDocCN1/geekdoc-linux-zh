  md: '# Section 6 Answer Keys and Explanations


    ![](img/95183953b74d7b388b46905691681ee3_201_0.png)


    ![](img/95183953b74d7b388b46905691681ee3_201_1.png)


    The figure above shows the technician:


    +   A. Installing in-block camshaft bearings.

    B. Cleaning the camshaft oil delivery holes.

    C. Removing in-block camshaft bearings.

    D. Checking journal oil hole and cam bearing oil alignment.


    Answer A is incorrect. Camshaft bearings are installed with a driver.

    Answer B is incorrect. The camshaft oil holes would be cleaned with a brush and
    air blow nozzle.

    Answer C is incorrect. The camshaft bearings are removed with a bearing driver
    tool.

    **Answer D is correct.** The camshaft bearings have been installed, and the technician
    is verifying alignment of oil supply hole and cam bearing hole.


    ![](img/95183953b74d7b388b46905691681ee3_201_2.png)


    3. A high-mileage vehicle overheats only at highway speeds. Which of the following
    is most likely to be the cause?


    +   A. A stuck closed thermostat

    B. A defective radiator cap vacuum valve

    C. An inoperative cooling fan

    D. A radiator whose core is clogged with deposits


    Answer A is incorrect. A stuck closed thermostat will cause overheating in city
    or low-speed driving.

    Answer B is incorrect. A radiator cap vacuum valve should only function during
    cooling off periods with the engine off.

    Answer C is incorrect. At highway speeds, the cooling fan function may be replaced
    by ram air effect.

    **Answer D is correct.** At highway speeds, the heat produced in the engine is
    greater. If the radiator cannot transfer extra heat to the core because of blockage,
    it will cause engine overheating.'
