  md: '# Section 4 Task List Overview


    # Engine Repair (A1)


    If the engine is turbocharged, first perform oil consumption diagnosis as though
    the engine was not turbocharged. While turbos are commonly blamed for excessive
    consumption problems, about half of the turbos returned under warranty are not
    defective. If oil is found in the turbo compressor housing or intake manifold,
    check the oil drain from the turbo housing to the engine. If it is obstructed,
    oil pressure will force the past seals into the engine through the intake tract.
    Check the PCV system, if the PCV valve does not close during “boon”, the crankshaft
    will be pressurized. This pressurizes the oil drain passage, forcing oil into
    the turbo engine.


    Some engine noises may be caused by coolant leaking the cooling system or coolant
    into the engine (or passenger compartment). First, eliminate leaks as the cause
    of coolant consumption by performing cooling system tests (Task D.3). If cooling
    pressure drops during the tests but no leaks are found, check the oil level and
    condition. Leaks into the crankshaft will raise the oil level. If coolant is being
    drawn into the combustion chambers, the exhaust will be gray or white. The engine
    will continue to emit this smoke after the time it takes for moisture to be purged
    from the exhaust system. On vehicles with electronic engine controls, coolant
    passing through the exhaust system will “poison” the oxygen sensor.


    If all cylinders are firing properly, the tailpipe exhaust should consist of steady
    pulses. A puffing noise that occurs at regular intervals usually indicates a cylinder
    misfire caused by a compression, ignition, or fuel system defect. Puffing noises
    that occur frequently are usually caused by ignition or fuel system defects. Engine
    idle may also be unsteady.


    A high-pitched squealing noise during high acceleration may be caused by a small
    leak in the exhaust system, particularly in the exhaust manifolds or exhaust pipe.
    The leak may be noticeable at idle as a ticking noise.


    Another engine noise is a high-pitched whistle at idle and low engine speeds.
    Check for vacuum leaks at the intake manifold gaskets. Also check for cracked
    or disconnected vacuum hoses. A vacuum leak while generally decreases the engine
    when the engine is accelerated and the intake vacuum decreases.


    A strong sulfur or rotten egg smell coming from the exhaust system of a car fitted
    with a catalytic converter may indicate a rich air/fuel ratio.


    # 6. Perform engine vacuum tests; determine necessary action.


    A vacuum test can be used to pinpoint the cause of an engine problem. The vacuum
    gauge should be connected directly to the intake manifold.


    On an engine that is performing correctly, the vacuum gauge reading should be
    between 17 and 22 in. (45 and 28 kPa absolute) and steady with the engine idling.
    Some abnormal vacuum readings and typical problems associated with them are:


    +   1. A low but steady reading may indicate retarded ignition timing.

    2. A very low steady reading may indicate that the intake manifold has a significant
    leak.

    3. Burnt or leaking valves may cause the vacuum gauge to fluctuate.

    4. Weak valve springs may cause a vacuum gauge fluctuation.

    5. A leaking head gasket may cause a vacuum gauge fluctuation.'
