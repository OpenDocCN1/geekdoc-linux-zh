    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is correct. Only Technician A is correct. A used timing belt that has
    been removed and will be put back on in the same direction of rotation it came
    off; failure to do this may cause belt failure.

    Answer B is incorrect. A timing belt that has been contaminated with oil will
    deteriorate and fail. If it is cleaned, the oil that has saturated the belt will
