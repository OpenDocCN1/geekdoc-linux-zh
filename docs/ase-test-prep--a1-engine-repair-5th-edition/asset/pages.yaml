    # PREPARATION EXAM 5—EXPLANATIONS


    +   1. The customer complains of a loud noise coming from the engine compartment.
    Which of the following would be the LEAST LIKELY to cause the noise?

    A. Cracked exhaust manifold

    B. A vacuum leak

    C. A cracked flexplate

    D. Carbon buildup on the pistons


    Answer A is incorrect. A cracked exhaust manifold would cause a cracking or rumbling
    noise when cold.

    Answer B is correct. A vacuum leak would typically not cause a loud noise that
    the customer could hear from inside the car. A vacuum leak would be a high-pitched
    whistle.

    Answer C is incorrect. A cracked flexplate would create a loud snapping or knocking
    noise at idle which might diminish as speed increased.

    Answer D is incorrect. Carbon buildup on the pistons will cause a knocking noise
    from the affected cylinder.


