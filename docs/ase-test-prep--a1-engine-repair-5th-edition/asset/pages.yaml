    32. Technician A says old coolant is not hazardous and can be disposed of in the
    shop drain. Technician B says old coolant should be disposed of in an environmentally
    safe manner. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Old coolant is considered hazardous waste in most states,
    and it is illegal to dispose of in a floor drain.


    Answer B is correct. Only Technician B. Old coolant should be picked up by a licensed
    waste company and disposed of in an environmentally safe manner.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_213_1.png)


    33. When inserted, the crankshaft bearings that exhibit more wear on the bearings
    furthest from the oil pump, which is less noticeable as you get closer to the
    oil pump. What is the most likely reason for the wear?


    +   A. Engine overloading at low RPM

    B. Over-tightened accessory belts

    C. Dry starts

    D. A warped crankshaft


    Answer A is incorrect. Engine overloading would cause wear on all the lower main
    bearings.

    Answer B is incorrect. Wear from over-tightened accessory belts would cause wear
    at the top of the main bearing #1 and transfer to the lower bearing on the last
    journal.

    Answer C is correct. A condition known as dry starts occurs when the engine has
    not been operated in a while. If there is no oil on the main bearing surfaces
    and during start, the last journal to get oil pressure will show more wear.


    Answer D is incorrect. A warped crankshaft will usually show up as excessive wear
    on two of the center main bearings.


    ![](img/95183953b74d7b388b46905691681ee3_213_2.png)


    34. An engine idles rough and the technician notes a high-pitch whistle from the
    engine compartment. Which of the following would likely be the cause?


    +   A. A slipping fan belt

    B. A leaking exhaust pipe

    C. A defective alternator bearing.

    D. A vacuum leak on the intake


    Answer A is incorrect. A slipping fan belt will squeal, not whistle.

    Answer B is incorrect. A leaking exhaust manifold will make a popping noise or
    rumbling.

    Answer C is incorrect. A defective alternator bearing will grow.

    Answer D is correct. A vacuum leak on the intake can cause a rough idle if it
    is after the airflow meter. Due to unmetered air entering the engine, it will
    cause a high-pitch whistle as the air is drawn into the engine.'
