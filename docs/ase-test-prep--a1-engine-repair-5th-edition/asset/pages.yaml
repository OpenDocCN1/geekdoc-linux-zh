    # 4. Test engine cranking system; determine needed repairs.


    To determine a battery''s state of charge, measure open circuit voltage. First
    remove battery charge by connecting a 50-ampere load across the battery terminals
    for 10 seconds. Wait 10 minutes for the battery to stabilize. Disconnect both
    batteries from the vehicle and use a voltmeter to measure voltage across the terminals.
    Open circuit voltage will be at least 12.6 volts on a fully charged battery after
    the charge has been removed. If open circuit voltage is below 12.4 volts, the
    battery must be charged before further.


    The best way to determine a battery''s ability to deliver power is to perform
    a load or capacity test. During a load test, a load tester is used to discharge
    the battery at one-half of its cold cranking ampere (CCA) rating for 15 seconds.
    Battery voltage is recorded at the end of this time, while the load is still applied.
    If the test is performed with the battery at 70°F (21°C), a battery reading of
    9.6V or higher indicates that the battery is in good condition.


    A discharged battery can be either fast or slow charged. Slow charging is preferable
    if it is available to do this. Slow charging allows the chemical changes to take
    throughout the entire thickness of the battery plates instead of on the surface
    of the plates only. Slow charging also less the chances that the battery will
    be overheated (and permanently damaged) during charging.


    The next item is to test the starter. We are looking for current and any unusual
    sounds. Depending on the engine and starter design, most starters will require
    150-250 amps to turn the engine. If the starter current is high, there may be
    internal problems with it such as a dragging armature or worn bushings. External
    problems such as tight or seized engine-driven accessories, or a front pump in
    the automatic transmission, can be a cause of higher than normal starter current
    draw. Light vehicles require to properly check the starter for noise or loud cranking
    noises. If the vehicle has shims in it is to replace them during reassembly. If
    the starter current is low and the engine spins quickly but fails to start, a
    jumped or broken timing chain or belt.


    Battery cables are required to carry high amperage. The most effective method
    of testing a battery is with a voltage drop test. The voltmeter is placed across
    the cable and the engine ised. The meter is read while the engine is cranking.
    A typical voltage drop specification for the battery cable is 0.3 volts. The test
    should be performed on both sides of the cable. A reading higher than acceptable
    resistance. If the voltage drop is occurring at the end of the terminal, may be
    replaced. If this method is chosen, care should be taken to ensure that the cable
    shortened is enough to remove all corrosion. Many technicians will replace the
    entire cable.'
