  md: '# Section 7 Apprentices


    # Engine Repair (A1)


    gives the crankshaft momentum to smoothly get to the next power stroke. The clutch
    and pressure plate help the flywheel transmit power to the drive wheels.


    No-start A condition where the engine turns but does not start. This could be
    caused by mechanical problems, fuel systems, electrical problems, or electronic
    control problems.


    Frozen A mechanical problem developed from a leak of oil or internal parts that
    prevent motion, such as an engine rotating.


    Oil cooler A heat exchanger used to cool transmission or engine oil. It may also
    be used for power steering or other fluids.


    Garter A small spring placed between the lip of an oil seal to maintain contact
    with the rotating part; most often associated with oil seals.


    Oil filter A device used to remove impurities, such as abrasive particles, from
    oil.


    Gap A space between two adjacent parts or surfaces.


    Oil pan A removable part of the engine assembly that contains the oil.


    Head part of an engine that covers the cylinder and pistons.


    Out of square As a valve spring that is not within specification when checked
    on a flat surface or at a 90-degree angle. If installed in an engine, a spring
    would cause side pressure on the valve and valve guide.


    Heat shield Devices used in many places on today''s vehicles. One place is between
    the starter and the heat of exhaust manifold. Another is between electrical wiring
    or spark plug wiring at high heat source. Heat shields are also used between the
    converters and the passenger compartment of the vehicle.


    Overhead cam A camshaft that is mounted in the cylinder head.


    Oxygen sensor An electronic device in the exhaust system that measures the amount
    of oxygen in the exhaust.


    To use abrasive material to remove material from a surface to change the surface
    so it will work better.


    Piston pin A connecting pin, usually hollow, to attach the connecting rod to the
    piston. The piston pin can be held in place by a press, snap rings, or bolts.


    Idler pulley A pulley that is used to adjust the tension on the belt-drive system.


    Pressure cap A placed on the radiator to regulate, above pressure, in the cooling
    system.


    Input A term used for signals sent to different electronic modules about operating
    systems of vehicles.


    Prepared Ready for operation.


    Intake duct All of the connecting duct from the throttle body out letting air
    into the engine.


    Ram air Air air forced through the radiator, condenser, and across the engine
    by the forward movement of the vehicle.


    Jumped in time jumping in timing or timing belt, in a condition where the valve
    timing is not correct, and the engine will run poorly or may not start.


    Reluct A gear-part of the engine, it could have the same number of teeth (or gears)
    as cylinders, or could have half the number of teeth of the engine cylinders.
    A tooth (or gap) passes by a pickup collar or crankshaft, the magnetic fields,
    and a trigger signal is sent to the electronic control module.


    Keeps-locked Tie metal locking devices used to hold parts in place.


    Rector A gear-part of the engine


    Lash The clearance between two parts.


    Rotators In-valve-shaft that cause the valves in the cylinder head to rotate each
    time the valves close. This helps keep the valve seat and valve face clean. By
    having a different part of the valve contacts the seat each time it closes, the
    valve also operates at a cooler temperature. It greatly extends seat and valve
    life.


    Lash adjuster A mechanical device like hydraulic lifters that is always on on
    overhead cam engines. It is to maintain zero lash between the cam and the tip
    of the valve.


    Rotor A part of the ignition distributor that rotates in the cap and transfers
    ignition secondary electricity from the center to the individual spark plug.


    Line boring A process that ensures multiple holes that are bored in a cylinder
    block are in line or in true. This allows the crankshaft or camshaft in in locations
    to function fully and properly. By line boring bearings, a boring bar is used
    to bore all bearings at the same time and in a straight line.


    RTV An abbreviation for Room Temperature Vulcanization; the trade name for a rubber-like
    sealing compound.


    Line boring A hole used to re-establish the crankshaft in a cylinder block.


    Set Fit As in the bearings of an engine. Many of today''s engines use fit bearings.
    This means the bearings are no longer all standard size, or all 0.010 inch


    Main bearing The structural device that holds the crankshaft in the engine.


    Muffler A device in the exhaust system to reduce noise.


    No-crank A condition like a frozen engine, a defective starter, or an electrical
    problem that prevents the engine from rotating to start the engine.


