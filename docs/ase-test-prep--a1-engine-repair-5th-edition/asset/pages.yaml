  md: '# Section 4 Task List Overview


    # Engine Repair (A1)


    Corrosion protection is added when servicing the cooling system with recovery/recycling
    equipment and is in the antifreeze to begin with. This is a difficult area to
    test and a bone of contention with manufacturers who do not support coolant recycling.


    The last area that will become more critical as diesel vehicles enter the consumer
    market is nitrites. When out of balance, they cause small bubbles to collect on
    castings while the engine is running. These bubbles act like little cutters and
    carve into the casting. The vibration inherent in the diesel combustion process
    has been known to create bubbles in cylinder walls. Test strips detect the level
    of nitrites and currently only a few manufacturers have specifications for.


    On some vehicles, air pockets tend to develop in the cooling system as it fills.
    If air pockets are not bled off, engine overheating and a cracked cylinder head
    can result. Some engines have a bleed fitting installed on the thermostat housing
    or an engine coolant passage to release air. Loosen this fitting until all air
    is removed. On engines that do not have a bleed fitting, locate the highest point
    in the cooling system. If this point is a hose connection, loosen the hose to
    bleed off air. If a high point to bleed is not available, there are tools available
    that help push the coolant from the bottom up, displacing any air locks before
    the vehicle is started.


    # 11. Inspect and replace water pump.


    Check the water pump for leaking connections, mounting gaskets, and seals. Slow
    or hard-to-find leaks may be easier to find if a cooling system pressure tester
    is connected to the radiator neck.


    Locate and examine the vent, or weep hole, in the water pump housing. The hole
    is usually in the underside of the housing, so use a small inspection mirror if
    necessary. If the water pump is leaking, coolant will usually drip from the weep
    hole. A slow leak may leave coolant residue around the hole. Replace the pump
    if there is evidence of coolant at the weep hole.


    > A defective water pump bearing may cause a growing noise at idle speed. In some
    cases, the bearing starts to fail after contaminated by coolant leaking past the
    pump seal.


    With the engine off, grasp the fan blades or the water pump pulley, and try to
    move it from side to side. This will reveal any looseness in the water pump bearing.
    If there is any-to-side movement in the bearing, the water pump should be replaced.


    When replacing a pump, always compare the new pump to the old one. Two pumps may
    look similar, but their impellers may rotate in opposite directions. In this case,
    the impeller will be shaped differently and installing the wrong pump will cause
    the engine to overheat.


    On many engines, some of the water pump bolts extend into the block jacket. Be
    sure to use the specified sealant on these bolts or coolant may leak from the
    engine. The bolts may also seize in place, making fitting difficult. Refer to
    the manufacturer''s service manual for information to determine which bolts enter
    the water jacket.


    # 12. Inspect and test fan (both electrical and mechanical), fan clutch, fan shroud,
    air dams, and cooling electrical circuits; repair or as required.


    On rear-drive vehicles, the engine cooling fan is universally mounted to the water
    pump shaft and belt driven off the crankshaft. Plain, direct-drive fan blade assemblies


