  md: '# Section 6 Answer Keys and Explanations


    32. Technician A says an oil filter may contain an anti-drainback valve. Technician
    B says an oil filter will be a bypass valve. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. The anti-drainback valve in an oil filter will not allow
    it to run back to the oil pan when the engine is off. The bypass valve allows
    much of the oil to bypass the filtering material, under certain conditions, and
    goes directly into the oil galleries.

    Answer D is incorrect. Both Technicians are correct.


    ![](img/95183953b74d7b388b46905691681ee3_136_0.png)


    33. The customer complains of a knocking noise during cold start that matters
    goes away within a minute of operation. Technician A says this could be caused
    by excessive connecting rod bearing clearance. Technician B says this could be
    piston slap caused by worn piston skirts. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Connecting rod noise will not go away during warm-up and
    will increase in intensity as the oil warms up.

    Answer B is correct. Only Technician B is correct. Piston slap is characterized
    by a knocking or slapping sound from the engine cold start that goes away as the
    engine warms up and the piston expands.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Only Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_136_1.png)


    ![](img/95183953b74d7b388b46905691681ee3_136_2.png)


    34. With the engine idling, a vacuum gauge connected to the intake manifold fluctuates
    as shown in the figure above. These fluctuations may be caused by:


    +   A. Late ignition timing.

    B. A restricted exhaust system.

    C. Intake manifold leak at the throttle body.

    D. Sticky valves.


    Answer A is incorrect. Late ignition timing would result in a low, steady reading.

    Answer B is incorrect. An intake manifold leak at the throttle body would cause
    a very low, steady reading.

    Answer C is incorrect. A restricted exhaust system would cause vacuum to slowly
    decrease after engine RPM was raised and held.

    Answer D is correct. If the valve sticks in its guide, it may not completely close
    resulting in a compression loss and pulsing vacuum gauge.


