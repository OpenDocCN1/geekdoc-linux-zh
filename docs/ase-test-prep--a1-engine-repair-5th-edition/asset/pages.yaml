  md: '# Section 6 Answer Keys and Explanations Engine Repair (A1)


    2. During teardown, it is noted that several valve stem tips were severely mushroomed.
    Technician A says the mushroomed tips must be dressed with a file before valve
    removal. Technician B says this was probably caused by the valve clearance being
    excessive. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_222_0.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both Technicians are correct. The normal cause for valve
    tip mushrooming is excessive clearance, which allows the rocker arm to hammer
    the valve tip rather than being in constant contact. If the tips are mushroomed,
    they cannot be removed without fitting the tip. If they are driven out with a
    punch and hammer, the guides and valves will be damaged.

    Answer D is incorrect. Both Technicians are correct.


    3. Technician A says an intercooler may be used to cool the air taken in the supercharger
    before it reaches the combustion chamber. Technician B says it is to prevent the
    supercharger from overheating. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_222_1.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. The intercooler reduces the heat content of the air from
    the supercharger before it enters the combustion chamber.

    Answer B is incorrect. The intercooler does not cool the supercharger.

    Answer C is correct. Only Technician A is correct.

    Answer D is incorrect. Technician A is correct.


    4. The technician is investigating an intermittent popping noise from under the
    hood that occurs when the RPM is raised. Which of the following is the LEAST LIKELY
    cause for the noise?


    ![](img/95183953b74d7b388b46905691681ee3_222_2.png)


    +   A. Sticky intake valve

    B. Incorrect ignition timing

    C. Broken intake valve spring

    D. Worn rod bearing


    Answer A is incorrect. A sticky intake valve that is slow to close may be open
    enough to allow combustion to escape before it closes all val.

    Answer B is incorrect. If ignition timing is off, the spark may occur before the
    intake valve is completely closed allowing combustion to escape.

    Answer C is correct. A broken or weak intake valve spring will not close the intake
    valve rapidly enough, or not at all, allowing combustion to escape.

    Answer D is incorrect. A worn rod bearing noise would be constant and increase
    in frequency as the RPM is raised.'
