  md: '# Section 6 Answer Keys and Explanations


    # Engine Repair (A1)


    ![](img/95183953b74d7b388b46905691681ee3_141_0.png)


    43. In the figure above, an open ground circuit on the engine temperature switch
    may cause:


    +   A. Continuous cooling operation.

    B. The fan not to operate when the A/C is engaged.

    C. A burnt out cooling motor.

    D. Engine overheating.


    Answer A is incorrect. An open circuit in the circuit will cause the fan not to
    run.

    Answer B is incorrect. The condenser switch will ground the fan circuit when the
    A/C is on.

    Answer C is incorrect. An open ground circuit will not burn out the cooling motor.

    Answer D is correct. If the cooling fan does not come on at the specified temperature,
    the engine may overheat.


    44. A cylinder leakage test has been performed and one cylinder failed with a
    leakage of 50 percent. The technician notes that there are bubbles coming up in
    the radiator. What is the most likely source of the leakage?


    +   A. A leaking intake valve

    B. Worn rings

    C. Cracked head

    D. Leaking head gasket


    Answer A is incorrect. A leaking intake valve would allow air to escape past the
    throttle plate.

    Answer B is incorrect. Worn rings will allow air to go to the oil pan and escaping
    air would be heard at the oil dipstick.

    Answer C is incorrect. Although a cracked head could cause leakage into the cooling
    system, it is not the most likely source.


    Answer D is correct. A head that has failed between the cylinder and a water passage
    will allow air to be pushed into the cooling system; the air will show up as bubbles
    in the radiator.'
