    says that a running compression test results at idle should be about 50 percent
    of cranking results. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both Technicians are correct. A running compression test
    is done with spark and fuel for the cylinder being tested. The compression tester
    goes into the spark plug hole so the coil or plug must be grounded or unplugged.
    The injector must be disabled to prevent fuel wash. Idle results for a running
    compression test should be about 50 percent of cranking results.

    Answer D is incorrect. Both Technicians are correct.'
