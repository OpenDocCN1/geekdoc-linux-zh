  md: '# Section 6 Answer Keys and Explanations


    +   49. Which of the following could cause symptoms of overheating even though
    the engine temperature is normal?

    A. A stuck closed thermostat

    B. A defective radiator cap

    C. A defective temperature sending unit

    D. A missing thermostat


    ![](img/95183953b74d7b388b46905691681ee3_240_0.png)


    TASK D.13


    Answer A is incorrect. A defective radiator cap may cause an actual overheat condition.

    Answer B is correct. If the temperature sending unit has gone bad, it can cause
    the gauge to register an overheat condition when, in fact, the engine is at the
    normal temperature.

    Answer D is incorrect. A missing thermostat will cause engine overcooling.


    +   50. The customer complains of a loud thump when he accelerates from a stop.
    Technician A says it could be caused by worn crankshaft thrust bearings. Technician
    B says it could be caused by a cracked flexplate. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    ![](img/95183953b74d7b388b46905691681ee3_240_1.png)


    TASK A.4


    Answer A is correct. Only Technician A is correct. Excessively worn thrust bearings
    will allow the crankshaft to shift forward during acceleration, causing a thump
    when the crankshaft comes against the main bearing thrust surface.

    Answer B is incorrect. A cracked flexplate will typically sound like a sharp pop
    or knock as it flexes at the crack.


    Answer C is correct. Only Technician A is correct.

    Answer D is incorrect. Technician A is correct.'
