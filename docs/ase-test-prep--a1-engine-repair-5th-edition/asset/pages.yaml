  md: '# Section 6 Answer Keys and Explanations


    # Engine Repair (A1)


    ![](img/95183953b74d7b388b46905691681ee3_135_0.png)


    29. Technician says improper balance shaft timing can cause severe engine vibrations.
    Technician B says balance shafts are always timed in relation to the camshaft.
    Who is correct?


    +   A. A only


    +   B. B only


    +   C. Both A and B


    +   D. Neither A nor B


    Answer A is incorrect. Only Technician A is correct. If the balance shaft is not
    properly timed, it will magnify normal engine vibrations.


    Answer B is incorrect. Balance shafts usually timed in relation to the crankshaft.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.


    ![](img/95183953b74d7b388b46905691681ee3_135_1.png)


    30. The valve stem installed is too tall. All of the following may be used to
    correct the installed height EXCEPT:


    +   A. Cutting the tip of the valve.


    +   B. Replacing the seat.


    +   C. Shimming the valve.


    +   D. Replacing the valve.


    Answer A is incorrect. The tip of the valve may be cut to correct stem height.


    Answer B is incorrect. As the seat is reconditioned, it causes the valve to seat
    deeper into increasing installed height. If the seat has been cut too much, it
    may require replacement of the seat to correct the installed height.


    Answer C is correct. The valve spring may need to be shimmed, but the valve cannot
    be shimmed.


    Answer D is incorrect. Replacing the valve can be used to correct the installed
    height.


    ![](img/95183953b74d7b388b46905691681ee3_135_2.png)


    31. All of the following would be a result of a plugged catalytic converter EXCEPT:


    +   A. Stalling.


    +   B. Loss of power.


    +   C. Power increase.


    +   D. Engine overheating.


    Answer A is incorrect. Stalling may be a result of a plugged converter. Restriction
    to exhaust flow may cause exhaust gas to enter the manifold during valve overlap,
    causing stalling.


    Answer B is incorrect. A partially plugged converter will not allow exhaust to
    be removed from the cylinder, causing a loss of power.


    Answer C is correct. A plugged converter will cause a power decrease, or no power
    at all, since the cylinder cannot empty the burned gases.


    Answer D is incorrect. A plugged converter can cause engine overheating. The exhaust
    removes about 30 percent of the heat produced during combustion; a plugged converter
    will prevent heat removal.


    Page 128


    Delmar, Cengage Learning ASE Test Preparation'
