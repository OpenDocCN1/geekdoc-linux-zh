  md: '# Inspect engine assembly for fuel, oil, coolant, and other leaks; determine
    necessary action.


    The source of fluid leaks is difficult to locate. Determining what type of fluid
    is leaking will reduce the number of possible leak locations.


    Engine oil usually leaks from faulty gaskets and seals, but it can also leak from
    cracked castings, faulty pressure switches or sending units, and loose tapered
    plugs. Oil can leak from an high area on the engine (like a V-type engine manifold
    seal) and run down the engine, appearing at the rear of the oil pan. Do not assume
    that the "wet" area is the source of the leak. Clean the area and run the engine
    to check for fresh fluid. Do not immediately assume a leaking seal or gasket is
    faulty. Excessive blow-by or a pressure control valve (PVC) system can pressurize
    the crankcase, forcing oil past a seal or gasket that is in good condition. Hard
    to find oil leaks can be caused by pouring a small quantity of fluorescent dye
    into the crankcase and running the engine. With an ultraviolet light shone onto
    the engine, the dye will glow to reveal the leak point. Aerosol frost powder may
    also be used to help find leaks. First, thoroughly degre the area around the leak.
    Spray the area with a white aerosol frost powder Start and observe vehicle then
    the powder provides a brighter background to make leak detection little easier.


    Fuel may leak from loose connections or damaged components. Check for hose and
    line fitting connections. Check for swelling, cracks, and damage from abrasion.
    Check metal lines for cracks and corrosion. Check for leaking o-ring connections
    and a leaking fuel pressure regulator (mounted on the throttle body unit or injector).


    The soft metal plugs the cooling system channels in the cylinder block and sometimes
    the cylinder heads are known by many names. We will use core plug in this text
    to be aware that they are also known as freeze plugs and that these terms are
    interchangeable.


    Corroded pipes are common coolant leakage points, as are faulty hoses and water
    pumps. Also check coolant temperature sensors, sending units, and thermal vacuum
    switches. Some engines have plugs at the back of the cylinder block and/or head.
    If the engine consumes coolant, but you cannot find evidence of leaking coolant,
    check the engine oil level and condition. Coolant may be leaking into the crankcase.
    Coolant can also leak into the combustion chambers.


    On vehicles equipped with power steering, check the fluid level. Leaking power
    steering fluid may be mistaken for engine oil or transmission fluid. When checking
    for oil leaks, note the color of the oil. A black color indicates engine oil,
    red usually indicates automatic transmission fluid, and clearly indicates power
    steering fluid.


    # 4. Isolate engine noises and vibrations; determine necessary action.


    Different types of engine part often make distinct sounds. First, be sure that
    the noise is actually coming from the engine. A faulty water pump, alternator,
    power steering pump, A/C compressor, or air injection pump can make noises that
    appear to be from inside the engine. Loose or broken accessory mounting brackets
    can also cause noises that sound like engine internal problems. Listen to each
    of the accessories using a stethoscope to determine if it is the source of a noise.
    If doubt, temporarily remove the drive belt from an accessory to prevent it from
    operating.'
