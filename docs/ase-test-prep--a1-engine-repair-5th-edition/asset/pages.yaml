    33. Technician A says typical piston-to-bore clearance is 0.020 to 0.030 inch.
    Technician B says typical piston-to-bore clearance is 0.001 to 0.002 inch. Who
    is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Typical piston-to-bore clearance is 0.001 to 0.002 inch.

    Answer B is correct. Technician B is correct. Typical piston-to-bore clearance
    is 0.001 to 0.002 inch; this is calculated by measuring the bore and the piston
    and subtracting.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_234_2.png)'
