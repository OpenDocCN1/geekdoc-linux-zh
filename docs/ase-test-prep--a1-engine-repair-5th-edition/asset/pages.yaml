  md: '26. Technician A says a serpentine belt that has any cracks in it must be replaced.
    Technician B says that serpentine belts must be retightened after break-in. Who
    is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Small cracks in the belt are normal unless there are three
    cracks within 1" of belt length.

    Answer B is incorrect. Serpentine belts do not have a break-in period like a V-belt.
    No retensioning is necessary.

    Answer C is incorrect. Neither Technician is correct.

    Answer D is correct. A serpentine belt with three cracks within 1" of belt length
    must be replaced; small cracks not meeting this guideline do not require replacement.
    A V-belt will stretch slightly during break-in and not require retensioning, whereas
    a serpentine belt will not stretch and not require retensioning.


    27. Fluorescent dye has been added to the crankshaft to locate an oil leak. The
    dye will glow when it is exposed:


    +   A. A strobe light.

    B. An infrared light.

    C. A blacklight.

    D. A blue light.


    Answer A is incorrect. A strobe light will not cause the dye to glow.

    Answer B is incorrect. An infrared light will not cause the dye to glow.

    Answer C is correct. A blacklight (ultraviolet) will cause the dye to glow.

    Answer D is incorrect. A blue light will not cause the dye to glow.


    28. Worm valve guides may cause all of these problems EXCEPT:


    +   A. Leaking of combustion gases.

    B. Excessive oil consumption.

    C. Uneven valve seating.

    D. Blowby.


    Answer A is incorrect. Worm valve guides may cause improper valve seating, which
    can cause combustion gases

    Answer B is incorrect. Worm valve guides can cause oil consumption as the valve
    tips in the guide; excessive oil will run down the valve stem through the valve
    stem seal.

    Answer C is incorrect. Worm valve guides will allow uneven valve-to-seat contact
    causing the valve seat to wear and the valve to seat unevenly.

    Answer D is correct. Worm valve guides will not cause blowby; worn rings will
    cause this.'
