  md: '# Section Answer Keys and Explanations


    # Engine Repair (A1)


    7. A vehicle is brought in with excessive oil loss. Technician A says the loss
    may be through the rear main seal. Technician B says valve stem seals can cause
    excessive oil consumption. Who is correct?


    +   - A. A only

    - B. B only

    - C. Both A and B

    - D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is correct.


    Answer C is correct. Both Technicians are correct. Oil can leak past a worn rear
    seal. Bad valve stem seals will cause oil to be drawn into the combustion chamber
    and burned.

    Answer D is incorrect. Both Technicians are correct.


    8. Technician A says that piston ring gap is too wide could cause ring binding
    and breakage. Technician B says that piston ring gap is too tight would cause
    combustion blowby. Who is correct?


    +   - A. A only

    - B. B only

    - C. Both A and B

    - D. Neither A nor B


    Answer A is incorrect. Ring gap that is too wide will cause blowby.

    Answer B is incorrect. Ring gap that is too tight will cause binding and breakage.

    Answer C is incorrect. Neither Technician is correct.


    Answer D is correct. Neither Technician is correct. The rings should seal tightly
    as possible without binding. If the ring gap is too wide, the ring will not seal
    properly as it expands from heat and will have enough gap to allow excessive combustion
    gases (blowby) into the crankcase and result in a loss of power. A ring that has
    too little gap will become tight in the cylinder bore as it expands from heat
    causing binding on the cylinder wall, scuffing, or piston damage.


    9. A customer brings his car to you complaining of a loss of oil pressure after
    extended driving. Which of the following is the likely cause?


    +   - A. Wear main bearings

    - B. Weak oil pump

    - C. Defective oil sending unit

    - D. Trash in the oil pan stopping-up-the oil pickup screen


    Answer A is incorrect. Wear main bearings will cause oil pressure all the time.

    Answer B is incorrect. A weak oil pump will cause oil pressure all the time.

    Answer C is incorrect. A defective oil sending unit will show low pressure all
    the time.


    Answer D is correct. If the complaint is loss of oil pressure after extended driving,
    suspect trash in the oil pan being picked up by the oil pickup screen; this will
    block oil flow to the pump.'
