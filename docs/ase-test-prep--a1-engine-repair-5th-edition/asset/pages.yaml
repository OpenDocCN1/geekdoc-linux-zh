  md: '# Section 6 Answer Keys and Explanations Engine Repair (A1)


    29. The vehicle cranks normally but is consistently slow to start. Which of the
    following is the LEAST LIKELY cause?


    +   A. A partially plugged fuel filter

    B. A failed fuel pump check valve

    C. Leaking injectors


    D. A defective fuel pressure regulator

    Answer A is incorrect. A partially plugged fuel filter would restrict fuel flow
    to the injectors.


    Answer B is incorrect. A defective fuel pump check valve will allow fuel in the
    lines to return to the tank after shutdown. The pump will have to fill the lines
    before fuel pressure can be established.


    Answer C is incorrect. Leaking injectors can cause flooding or cylinder walls
    wash with low compression and extended start time.


    Answer D is correct. A defective fuel pressure regulator will not allow fuel to
    return to the tank. This could cause performance problems but not consistently
    extended start time.


    ![](img/95183953b74d7b388b46905691681ee3_192_0.png)


    30. Technician A says that excessive wear on the lower halves of the main bearing
    inserts is caused by prolonged idle operation. Technician B says this wear can
    be caused by prolonged RPM. Which is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Prolonged idle operation will not cause this kind of wear
    as there is little stress on the crankshaft during idle operation.


    Answer B is incorrect. Prolonged RPM will not cause this kind of wear as oil pressure
    is


    Answer C is incorrect. Both Technicians are incorrect.


    Answer D is correct. Both Technicians are incorrect. Engine overloading, the high
    loading at a low RPM, will cause the crankshaft to squeeze out the oil from the
    lower bearing half.


    ![](img/95183953b74d7b388b46905691681ee3_192_1.png)


    31. A cylinder cranking test has been done; the results are all well below manufacturer''s
    specifications. Technician A says a wet compression test should be done to eliminate
    valves as the cause. Technician B says a power balance test should be done to
    identify the problem. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_192_2.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A wet compression test is not used to check for valves
    that are not sealing. This test checks for ring leakage. If the results were substantially
    different after the compression, it would indicate worn rings.


    Answer B is incorrect. A power balance test is used to identify non-performing
    cylinders.


    Answer C is incorrect. Neither Technician is correct.


    Answer D is correct. A wet compression test is used to check for poorly sealing
    rings, and the power balance test is used to identify the cylinder(s) that has
    poor power production in comparison with the other cylinders.


