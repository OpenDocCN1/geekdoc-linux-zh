    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Only Technician A is correct. RTV is a gasket maker and
    is suitable for sealing an oil in place of a gasket.

    Answer B is incorrect. A head gasket should have no sealer applied. RTV could
    cause the head gasket to fail.

