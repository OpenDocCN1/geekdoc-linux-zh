  md: '# Section 7 Appendices


    # Engine Repair (A)


    (0.25 mm) The manufacturer mixes and matches bearing shells of increments as small
    as 0.003 inch (0.076 mm) to ensure better oil and noise control at the crankshaft
    area.


    Torque wrench A specially designed device that indicates the amount of torque
    being exerted on a fastener to be tightened to a specified amount.


    Select thrust washer A washer or spacer that is placed in different sizes to facilitate
    end-play and preload threads.


    Torque-to-yield (TTY) A term used to describe a method of tightening fasteners
    on many of today''s engines. The procedure is to tighten the fasteners to a low
    pounds-foot value, then to turn each fastener (in proper tightening sequence)
    a specified number of degrees. This process is used on head bolts, main bearing
    bolts, and rod bolts. In some cases, new fasteners are required for every assembly.


    Skirt A term used to describe the lower part of an engine piston. The skirt controls
    the cylinder wall, helps the piston in a straight line and prevents piston slip.


    True A term used in the automotive industry to signify that a part or system is
    within specifications. In the cylinder gasket sealer, if it is, it is not warped,
    scratched, scorched, or otherwise damaged.


    Solenoid An electromechanical device used for a push-pull operation.


    Span A term used to describe the space between two parts; as in the span between
    the air conditioner compressor belt pulley and the alternator pulley is too great.
    This condition can cause the bolts to fail at high engine speeds or during acceleration.


    Valve float A condition when the valve spring is not capable of lifting the valve
    quickly enough. This usually happens at higher speeds, and is aggravated by valve
    spring losing some of tension. Improper seating of the combustion valve will cause
    the engine to run rough.


    Spark plug A component of the ignition system that delivers the high-voltage spark
    to the combustion chamber.


    Valve lifter A hydraulic or mechanical device in the valve train that rides the
    camshaft lobe to lift the valve off its seat.


    Starter A part of the starter motor that engages the ring gear of the flywheel,
    or torque converter, and rotates the engine on start.


    Valve rotator A device that rotates the valve while the engine is running.


    Starter motor The electric motor that is used to crank the starter driver to the
    flywheel when starting an engine.


    Valve spring installed The distance from the underside of the valve spring retainer
    to the cylinder head surface.


    Starter solenoid The part that causes the starter to engage the flywheel when
    starting an engine.


    Valve spring retainer A device that holds the valve spring in place.


    Tailpipe The part of the muffler or exhaust system that carries the exhaust gases
    away from the passenger compartment.


    Valve train The parts making up the valve assembly and its operating mechanism.


    Temperature sensor A term used for various temperature sensing switches or variables
    on today''s vehicles. They can be used to turn cooling fans on and off, to operate
    dash gauges, to control air conditioners, and to furnish inputs to the engine
    control computer.


    Warpage As a cylinder head gasket, the sealing area is not being straight and
    true. This condition will require shop work on the cylinder head or a different
    cylinder head that is not warped.


    Tension A device used with timing belts and chains that maintains a constant pressure
    on the belt or chain to minimize wear and noise, and to take slack or lock motion.
    They may be fixed and require periodic adjustment, or may be automatically adjusted
    by spring tension or engine oil pressure. Tensioners are also used on accessory
    drive belts.


    Water pump A mechanical device used to circulate coolant through the system.


    Witness marks Lines scored on adjacent surfaces of mating parts, before disassembly,
    to ensure proper alignment when reassembled.


    Timing belt The belt through which the crankshaft drives the camshaft(s) in an
    overhead cam engine.


