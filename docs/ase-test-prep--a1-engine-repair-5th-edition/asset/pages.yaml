  md: '# Section 6 Answer Keys and Explanations


    # Engine Repair (A1)


    ![](img/95183953b74d7b388b46905691681ee3_133_0.png)


    23. A head bolt has broken flush with the block deck surface during head removal.
    Technician A says the broken bolt can be drilled and a bolt extractor can be used
    to remove the bolt. Technician B says the broken bolt may be completely drilled
    out oversize and an oversize head bolt installed. Which is correct?


    +   - A. only

    - B. only

    - C. Both A and B

    - D. Neither nor A


    Answer A is correct. Only Technician A is correct. The broken bolt with proper
    drill size and using a bolt extractor to remove the bolt is the best option.

    Answer B is incorrect. Installing a larger diameter head bolt would require drilling
    the hole wider and create a difference in clamping force in that area of the head.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_133_1.png)


    24. The valve spring is being checked and fails to meet the open pressure specification.
    Technician A says to install a valve spring when reassembling the head. Technician
    B says to replace the spring. Which is correct?


    +   - A. only

    - B. only

    - C. Both A and B

    - D. Neither nor A


    Answer A is incorrect. Installing a valve spring washer may cause spring bind,
    and the spring will increase closed pressure along with open pressure.

    Answer B is correct. Only Technician B is correct. Replacement of the spring is
    recommended if it fails to meet the specified value.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_133_2.png)


    25. A catalytic converter may be legally removed on a vehicle that is 15 years
    old. Technician B says the catalytic converter significantly restricts exhaust
    flow. Which is correct?


    +   - A. only

    - B. only

    - C. Both A and B

    - D. Neither nor A


    Answer A is incorrect. A vehicle that came equipped with a catalytic converter
    may not have the converter removed to replace it with a new converter under penalty
    of law.

    Answer B is incorrect. The engine management system is tuned to the exhaust flow
    on a converter equipped vehicle. The restriction in exhaust flow, although the
    restriction is minimal, is taken into account during design of the exhaust system.

    Answer C is incorrect. Neither Technician is correct.

    Answer D is correct. Neither Technician is correct. A converter is part of the
    emissions system of the vehicle and may not be legally removed without replaced
    with a new one at any time during the vehicle''s service life. The engine is tuned
    to perform properly with the minimal restriction of the converter and exhaust
    modification may cause poor engine performance.'
