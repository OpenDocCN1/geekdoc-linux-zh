    ![](img/95183953b74d7b388b46905691681ee3_214_1.png)


    36. In the figure above, Technician A says if the difference between A and B is
    too wide, it will cause a no-crank condition. Technician B says pickup B is a
    thermistor. Which is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B

    Answer A is incorrect. Too large a gap between the crankshaft relector ring and
    the crankshaft position sensor will cause no-trigger signal and a no-start condition;
    it will not affect cranking.

    Answer B is incorrect. The crankshaft position sensor is a permanent magnet-type
    sensor, not a thermistor.

    Answer C is incorrect. Neither Technician is correct.

    Answer D is incorrect. The relector ring on the crankshaft has gaps in it that
    correspond with piston motion. The crankshaft position sensor emits a magnetic
    field that is interrupted when the gap passes, letting the PCM know the position
    of the cylinder to fire the sparkplug. If the gap between the sensor and the relector
    ring is too wide, the PCM will receive a weak or no signal and will not fire the
    sparkplug.'
