  md: '# Section 6 Answer Keys and Explanations


    # Engine Repair (A1)


    12. Technician A says a lower-than-normal idle speed in a fuel-injected engine
    may be caused by a broken vacuum line. Technician B says an intake manifold vacuum
    leak may cause a mistfire at idle and engine speed. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_186_0.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A broken vacuum line may cause a higher-than-normal idle
    speed as the ECM adds fuel to correct a lean condition in the engine.


    Answer B is correct. Technician B is correct. A broken vacuum line may cause mistfire
    at idle or low RPM. The vacuum leak introduces unmetered air into the intake,
    causing a lean condition in the cylinder and mistfire.


    Answer C is incorrect. Technician B is correct.


    Answer D is incorrect. Technician B is correct.


    13. During a vacuum test, it is noted that when the engine is accelerated, the
    vacuum drops to near zero, then climbs back to the normal level. Technician A
    says that the piston rings are worn. Technician B says this indicates weak valve
    springs. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_186_1.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Worn piston rings will cause a low but steady vacuum, usually
    between 8 and 10 in. Hg.


    Answer B is correct. Weak valve springs will cause erratic needle fluctuations
    when the engine is accelerated smoothly.


    Answer C is incorrect. Neither Technician is correct.


    Answer D is incorrect. Neither Technician is correct. A vacuum drop to near zero
    and a return to normal level indicates proper operation.


    14. Technician A says that some RTV sealants may be harmful to an oxygen sensor.
    Technician B says that RTV is an anaerobic sealer. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_186_2.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is correct. Technician A is correct. Some older formula RTV fumes could
    damage the oxygen sensor. New formulas will not damage the oxygen sensor, and
    should say so on the packaging.


    Answer B is incorrect. RTV is an aerobic sealer; it requires air to cure.


    Answer C is incorrect. Technician A is correct.


    Answer D is incorrect. Technician A is correct.'
