  md: '# Section 6 Answer Keys and Explanations Engine Repair (A1)


    12. All lifters in an overhead valve engine are cupped (concave). Technician A
    says the lifters can be replaced with no further parts replacement. Technician
    B says that they can be replaced with rollers for longer life. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A worn lifter indicates a worn camshaft lobe. If the lifter
    is replaced without replacing the camshaft, it will fail in a short time.


    Answer B is incorrect. A roller lifter cannot be used with a flat tappet camshaft.
    The lobe on a flat tappet is slightly tapered to cause the lifter to spin; a roller
    camshaft is flat across the lobe.


    Answer C is incorrect. Neither Technician is correct.


    Answer D is correct. Neither Technician is correct. A camshaft and flat tappet
    lifters wear during break and in normal use. If one is replaced, it is recommended
    to replace both components. Roller lifters would only contact the flat tappet
    cam in one small area. They are not made for the profile of only a flat tappet
    camshaft.


    ![](img/95183953b74d7b388b46905691681ee3_129_0.png)


    13. Technician A says a PCV valve hose that is restricted could cause oil accumulation
    in the air. Technician B says a PCV valve hose that is restricted will cause a
    stumble on acceleration. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician A is correct. A restricted PCV valve will cause
    increased crankshaft pressure and may cause oil accumulation in the air cleaner.


    Answer B is incorrect. A restricted PCV hose will not cause a stumble. A broken
    hose could cause a stumble, since unmetered air is being introduced into the intake
    manifold.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.


    ![](img/95183953b74d7b388b46905691681ee3_129_1.png)


    14. Technician A says that during engine repair, it is okay to open the hoses
    on the A/C compressor to relieve pressure so you can remove the compressor. Technician
    B says that the refrigerant in an A/C system must be recovered into an A/C recovery
    machine. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


