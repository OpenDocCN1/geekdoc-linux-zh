  md: '# PREPARATION EXAM 1—EXPLANATIONS


    1 Technician A says that it is important to test the customer''s vehicle to verify
    the concern as a part of the diagnosis procedure. Technician B says it is always
    a good idea to check for associated service bulletins. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both technicians are correct. A test drive lets you confirm
    the customer complaint, and checking for technical service bulletins may save
    diagnostic time.

    Answer D is incorrect. Both technicians are correct.


    ![](img/95183953b74d7b388b46905691681ee3_125_0.png)


    ![](img/95183953b74d7b388b46905691681ee3_125_1.png)


    2 Technician A says main bearing clearance can be checked with Plastigauge. Technician
    B says main bearing clearance can be checked with a feeler gauge. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician A is correct. Main bearing clearance can be
    checked with Plastigauge by placing the Plastigauge across the journal with smeared
    and rotating the cap. Remove the cap and use the Plastigauge scale; record the
    clearance.

    Answer B is incorrect. A feeler gauge is not a tool to check main bearing clearance.
    It will not conform to the journal to give an accurate reading.

    Answer C is incorrect. Only Technician A is correct.

    Answer D is incorrect. Technician B is also correct.


    ![](img/95183953b74d7b388b46905691681ee3_125_2.png)


    3. Technician A says that when the fuel lines are reconnected on a replaced engine,
    the o-ring seals on the fuel lines must be replaced. Technician B says the injector
    o-rings should be replaced when they are reinstalled. Who is correct?


