    +   30. All of the following are symptoms of a stuck open PCV valve EXCEPT:

    A. Rough engine idle.

    B. A lean air/fuel ratio.

    C. Blowby gases in the air filter.

    D. The engine stalling.


    Answer A is incorrect. A stuck open PCV valve allows unmetered delivery to the
    intake.

    Answer B is incorrect. A stuck open PCV valve allows unmetered air into the intake,
    which will lean out the air/fuel mixture to the point it is unburnable in one
    or more cylinders.

    Answer C is correct. A stuck open PCV valve will not cause blowby gases in the
    air filter: a stuck closed valve.


    Answer D is incorrect. A stuck open PCV valve allows unmetered air into the intake,
    which may lean out the air/fuel mixture to the point it is unburnable.


    ![](img/95183953b74d7b388b46905691681ee3_233_1.png)


    +   31. An engine miss is being diagnosed using a cylinder leakage test. Technician
    A says that a 20 percent leakage is acceptable. Technician B says air coming out
    the intake manifold indicates a cracked cylinder head. Who is correct?

    nA. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is correct. Only Technician A is correct. The acceptable leakage from
    a cylinder is 20 percent. This allows for normal leakage past ring end gaps.


    Answer B is incorrect. Air coming out the intake manifold indicates leaking intake
    valves.


    Answer C is incorrect. Only Technician A is correct.

    Answer D is incorrect. Technician A is correct.'
