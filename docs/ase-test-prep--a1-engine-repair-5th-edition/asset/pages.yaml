  md: '# Section 6 Answer Keys and Explanations Engine Repair (A1)


    29. All of the following are causes of low engine oil pressure EXCEPT:


    +   A. Worm crankshaft main bearings.

    B. Weak oil pressure relief valve spring.

    C. Struck closed pressure relief valve.

    D. Restricted pushrod oil passages.


    Answer A is incorrect. Worm crankshaft main bearings will cause low oil pressure.

    Answer B is incorrect. A weak oil pressure relief valve will not allow oil pressure
    to build to the proper pressure before allowing the oil to return to the oil pan
    from the pump.

    Answer C is incorrect. A stuck open pressure relief valve will cause low oil pressure.

    Answer D is correct. Restricted pushrod oil passages will affect oil delivery
    to the arms, but will not affect oil pressure.


    ![](img/95183953b74d7b388b46905691681ee3_212_0.png)


