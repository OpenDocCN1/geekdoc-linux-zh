  md: '23. During disassembly of the block, the technician notes that maine bearing
    wear is greater on the first journal''s top bearing and the bottom bearing of
    the last journal. Technician A says this may have been caused by accessory belts
    being overtightened. Technician B says this was caused by oil starvation. Who
    is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is correct. Only Technician A is correct. If an accessory belt is overtightened,
    it will pull up on the front of the crankshaft, causing upper bearing wear on
    the first bearing journal, and lower bearing on the last main journal. Oil starvation
    would be evident on the lower half of all the main bearings.


    Answer B is incorrect. Only Technician A is correct.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.


    24. Technician A says that when the fuel lines are reconnected on a replaced engine,
    the o-ring seals on the fuel lines must be replaced. Technician B says the injector
    o-rings should be replaced when they are reinstalled. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

    Answer C is correct. Both Technicians are correct. Both the fuel line seals and
    injector seals must be replaced to ensure there will be no fuel leakage.

    Answer D is incorrect. Both Technicians are correct.


    25. All of the following could prevent a starter solenoid from engaging EXCEPT:


    +   A. A bent armature shaft.

    B. A short clutch switch.

    C. An open ignition switch.

    D. An open in the neutral safety switch.


    Answer A is correct. A bent armature would not keep the starter solenoid from
    engaging, although it may prevent the starter from turning.

    Answer B is incorrect. A short clutch switch may ground the power to the starter
    relay causing the solenoid to not engage.

    Answer C is incorrect. An open ignition switch will not provide power to the starter
    circuit.

    Answer D is incorrect. An open in the neutral safety switch will not allow power
    to flow to the starter relay.


