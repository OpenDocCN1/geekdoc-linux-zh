  md: '# Section 6 Answer Keys and Explanations


    15. A cylinder head has been removed and the technician is inspecting the head
    gasket. He finds the fire ring on cylinder #2 has broken. Technician A says this
    could be caused by detonation in the cylinder. Technician B says this could be
    caused by the wrong oil used. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is correct. Only Technician A is correct. Detonation in the cylinder
    can cause the fire ring to flex excessively and break.


    Answer B is incorrect. The wrong oil will not affect the fire ring. However, it
    may affect bearing wear.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.


    ![](img/95183953b74d7b388b46905691681ee3_130_0.png)


    16. The customer''s complaint is that the engine cranks over quickly but does
    not start. Technician A says it could be caused by the battery. Technician B says
    it could be caused by a broken timing belt. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A weak battery would cause slow cranking.


    Answer B is correct. Only Technician B is correct. A broken timing belt will cause
    the engine to spin or over rapidly.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_130_1.png)


    17. Technician A says corrosion on the battery terminals may cause slow cranking.
    Technician B says high resistance in the starter circuit may result in low cranking
    speed and high current draw. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is correct. Only Technician A is correct. Corrosion on the battery terminals
    will cause high resistance and a slow starter cranking.


    Answer B is incorrect. High resistance in the starter circuit may result in low
    cranking speeds but will result in low current draw.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Technician A is correct.


