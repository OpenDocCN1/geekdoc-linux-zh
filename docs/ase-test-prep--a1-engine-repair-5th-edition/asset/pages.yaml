  md: '# Section Task List Overview


    # Engine Repair (A1)


    In each of the three vertical cylinder measurement locations, measure the cylinder
    diameter in the thrust direction and in the axial direction. Cylinder out of round
    is the difference between the cylinder diameter in the thrust and axial directions.
    If out of round exceeds specifications, rebore the cylinder.


    If cylinder wear, out of round, and taper are within specifications, the cylinders
    may be deglazed. Mildly worn cylinders should be degazed with a brush hone, which
    removes material very slowly. Moderately worn cylinders (still within specifications)
    may be deglazed with 220 or 280 grit stones installed on a cylinder hone. When
    the honing operation is completed, the cylinder has a 60° crossh pattern. After
    deglazing, the cylinder should be cleaned with hot, soapy water and a stiff brush.
    Ordinary solvent will not remove grit from pores in the cylinder wall-use soapy
    water. The bores are clean when a clean, lint-free cloth is used to wipe them
    and the cloth does not dirty. When the bores are clean, remove the bore and dry
    it thoroughly. Coat all machined surfaces with a light coating of the manufacturer''s
    recommended engine oil.


    If one cylinder requires reboring, most manufacturers recommend reboring all the
    cylinders to the same size. Cylinder reboring is usually done with a specialized
    piece of equipment called a boring bar. A honing machine is usually used for this.
    After cylinder honing, the same procedure for block cleaning should be followed
    as previously discussed in cylinder deglazing.


