  md: '# Glossary


    Air conditioning The process of adjusting or regulating, heating or cooling, the
    quality, temperature, and humidity of air.


    Crankshaft The revolving part of a unit that has the function of delivering power
    or work from the reciprocating motion. Engines have crankshafts, as do air conditioning
    compressors and pistons.


    Aluminum A nonferrous metal that is light in weight yet can be stronger than steel
    when mixed with proper alloys. It is easily cast and machined.


    Crankshaft sensor An electronic device used to send crankshaft rotation to the
    computer.


    Balance shift A shaft with counterweights designed to prevent vibration of rotating
    parts.


    Cross-firing A condition where spark fire out of turn, usually caused by poor
    spark plug insulation.


    Battery A device for storing electrical energy in chemical form.


    Cylinder head Part of the engine that contains the cylinders.


    Bearing crash Occ when the bearing is tightened, slightly protruding bearing ends
    touch, and are forced together. A tight fit in the bore for the bearings prevents
    this.


    Cylinder out of order The difference in the cylinder diameter measured in the
    same plane, 90 degrees.


    Belt A device used to drive the water pump and other accessory-driven devices.


    Cylinder taper The difference in cylinder diameter from top to bottom.


    Block deck The flat surface of the main casting of an engine on which the head
    attaches.


    Cylinder wall A term used for cylinder, the inside diameter of a cylinder.


    Cam An abbreviation to describe valve lift: driven by the crankshaft a cam, a
    chain, or belt that opens and closes the exhaust valves.


    Distributor A device used on many engines to direct high voltage energy to the
    spark plugs.


    Cam follower A term used for valve lift: a hydraulic or mechanical device, in
    the tail rod, that rides on the camshaft to lift the valve off.


    Elongated Not, but egg-shaped.


    Camshaft Part of the camshaft that turns in a bearing.


    End-play A term used to describe a spacing or clearance involving a moving part.
    Crankshaft and camshaft require end-play measurements and must be set to manufacturer''s
    specifications during engine assembly.


    Cast iron A term used for cast ferrous alloys containing at least 2 percent carbon.
    It is used for many different parts on vehicles.


    Engine oil A lubricant for use in an engine.


    Catalytic converter An automotive exhaust system made of steel, containing a catalyst
    that reduces hydrocarbons, carbon monoxide, and nitrogen oxides in the exhaust
    gases.


    Engine oil cooler A device used on some high performance engines, police packages,
    trucks, turbo-charged engines, and diesel engines to prevent the engine from overheating.
    These work by using a heat exchanger to allow air or water to cool it.


    Coil A term to describe an electrical device using turns (coil) of wire such as
    springs, ignition coils, solenoids, and relays.


    Exhaust pipe A pipe that connects the exhaust manifold to the muffler or converter.
    It is of heavier material than tailpipes, and is sometimes times double-layered.


    Connecting rod The bearing of a connecting rod that rotates on the crankshaft.


    Face-to-face A term in valve-valve seat contact, refers to the actual area of
    the valve and seat. It must be the size and angle specified by the engine manufacturer
    to properly seal the combustion chamber and have a long service life.


    Cooling system The system that circulates coolant around the engine to dissipate
    heat.


    Firing order The order in which the engine cylinders fire and deliver power.


    Counterbalance shaft One or more rotating shafts used on engines to counteract
    the natural vibrations of rotating parts, such as the crankshaft, in that engine.
    This balance, or counterbalance, usually turns at twice the crankshaft-speed and
    must be timed properly.


    Flywheel A heavy, metal plate attached to the crankshaft of an engine that helps
    smooth out power strokes and'
