    39. A vehicle is brought in with excessive oil consumption. Technician A says
    a lack of regular oil changes can cause the oil rings to stick. Technician B says
    a burned valve can cause excessive oil consumption. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    **Answer A is correct.** Lack of regular oil changes will cause varnish buildup
    on the internal engine components. This varnish buildup can cause oil control
    rings to stick in their groove and leave oil on the cylinder wall, which is burned
    during combustion.


    Answer B is incorrect. A burned valve will cause poor engine performance, but
    will not affect excessive oil consumption.


    Answer C is incorrect. Only Technician A is correct.

    Answer D is incorrect. Technician A is correct.'
