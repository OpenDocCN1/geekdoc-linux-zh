  md: '# Section 6 Answer Keys and Explanations


    ![](img/95183953b74d7b388b46905691681ee3_143_0.png)


    48. An engine has a deep knock while running that increases in speed along with
    engine RPM.

    The most likely cause of the noise is:


    +   A. Worn lifters.

    B. A cracked flexplate.

    C. Water pump bearings.

    D. A connecting rod with too much bearing clearance.


    Answer A is incorrect. Worn lifter noise will be a tapping noise in the top of
    the engine.

    Answer B is incorrect. A cracked flexplate will usually quiet down when RPM is
    increased and transmission pressure events out.


    Answer C is incorrect. Worn water pump bearings will grow or grind, not knock.

    Answer D is correct. A connecting rod with excessive bearing clearance will cause
    a deep knocking noise from the bottom of the engine that will increase with RPM.


    ![](img/95183953b74d7b388b46905691681ee3_143_1.png)


    49. Technician A says a defective radiator cap pressure valve may cause an engine
    to run too cool.

    Technician B says a defective radiator cap vacuum valve may cause the upper radiator
    hose to collapse. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A defective pressure valve may cause the coolant to boil
    over when the engine is turned off. The resulting loss of coolant could cause
    the engine to overheat.

    Answer B is correct. Only a defective vacuum valve does not open may cause the
    upper hose to collapse. As the coolant cools and contracts, a vacuum can be formed
    in the cooling system.


    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_143_2.png)


    50. The vehicle will not crank. Technician A says this may be caused by hydrolock
    in a cylinder.

    Technician B says the fuel pump may be defective. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Only Technician A is correct. Hydrolock in a cylinder will
    not allow the engine to spin out.


    Answer B is incorrect. The fuel pump cannot cause an engine not to crank. It will
    allow an engine not to start.


    Answer C is incorrect. Only Technician A is correct.

    Answer D is incorrect. Technician A is correct.'
