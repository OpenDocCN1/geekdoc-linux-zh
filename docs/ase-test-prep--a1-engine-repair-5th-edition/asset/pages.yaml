    # 5. Inspect valve spring retainers, rotors, locks/keepers, and lock grooves.


    Valve spring retainers and locks/keepers must be checked for wear, scoring, or
    damage. When any of these conditions are met, replace the components.


    Valve rotors can be inspected before cylinder head removal and disassembly since
    they usually cannot be taken apart. Rotors can be located on top of the cylinder
    head (built into the spring retainer) or between the valve spring and the cylinder
    head. To test a rotor, mark the top of the spring retainer with a dab of paint.
    Then start the engine and run it at 1,500 rpm. The retainer should freely rotate.
    Direction of rotation is not important. If the retainer does not rotate, replace
    the rotor.


    In some cases, a defective rotor can be diagnosed with the cylinder head removed.
    Check the valve stem tip pattern. A shallow groove or channel running across the
    tip indicates that the valve has not been rotating. Replace the rotor on any valve
    with this condition.


    Inspect the valve lock/keeper machined into the valve stems. For damage and, particularly
    for shoulders. If the shoulders are uneven or rounded, replace the valve. Observe
    the depth of the lock/keeper in the valve spring retainer. If they are uneven,
    it may indicate that could cause them to pull through the retainer. Valve lock/keeper
    failures can cause severe engine damage.


    # 6. Replace valve stem seals.


    It is not necessary to remove the cylinder head to service many valve train components.
    This includes the springs, oil seals, retainers, and valve locks. A claw-type
    valve spring compressor is used to compress the valve spring while the head is
    mounted on the block, but will require that the air supply is connected to the
    cylinder through the spark plug hole. This air pressure will hold the valves in
    place when the valve springs are removed, preventing the valves from dropping
    into the cylinder.


    On engines equipped with umbrella-type valve seals, slip the seals over the valve
    stems. Work carefully to avoid damaging new seals on valve stem lock grooves.
    A damaged seal will cause excessive oil consumption. Some come with an installation
    tool. The tool is a simple plastic sleeve that is slipped over the tip of each
    valve stem before the seal is installed. The sleeve extends far enough to cover
    the lock grooves. After installing each seal, push down against the top of the
    valve guide and remove the installation tool.


    On engines equipped with positive-type valve seals, the installation procedure
    is the same with one important difference. Positive-type seals must be pushed
    down over the top of the retaining device to keep it attached to the guide. Some
    seals have a flat, circular spring that wraps around the seal; use garter springs
    to hold the head in place; others have a molded-in ridge on their inner diameter
    that meets with a groove onto the valve guide. Whatever retaining method, be sure
