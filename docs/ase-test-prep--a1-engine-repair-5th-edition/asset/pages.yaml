    seal completely for the cylinder to reach full pressure through both the compression
    and power strokes.


    # 9. Check valve spring installed (assembled) and valve stem height; determine
    repairs.


    Measure the installed valve stem height from the spring seat on the cylinder head
    to the stem tip. If the installed height is greater than specifications, the valve
    stem is stretched or too much material has been removed from the valve face or
    seat. Install a new valve and measure stem height. If the measurement is excessive,
    replace the seat or cylinder head. Excessive valve stem height moves the plunger
    downward in a hydraulic valve and may cause valve train components to bottom out.


