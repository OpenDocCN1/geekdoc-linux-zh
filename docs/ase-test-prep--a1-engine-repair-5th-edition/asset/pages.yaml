  md: '# 13. Verify proper operation of engine-related warning indicators.


    Operating temperature can be indicated to the driver either by a gauge or a light.
    The light typically indicates only an overheat condition, while the gauge indicates
    approximate operating temperature. The light will have a temperature-operated
    switch to control it. The gauge will have a thermistor controlling it. To check
    operation, make sure the light comes on during bulb, then remove the wire from
    the sensor, ground it, and see if the light comes on. If does, it is operating
    properly. To test the gauge, remove the wire to the sending unit, and install
    the appropriate resistor indicated by the service literature, between the wire
    and ground. Check to see if that gauge reading indicates the appropriate temperature.


    # F. Fuel, Electrical, Ignition, and Exhaust Systems Inspection and Service (7
    Questions)


    +   1. Inspect, clean, or replace fuel injection components, intake manifold,
    and gaskets.


    Fuel and air induction components as they relate to engine repair require us to
    look at maintenance and inspection of items when performing engine repair. Let''s
    start from the top down.


    On many late model vehicles, the most significant external of systems is the airflow
    sensor. Although the air passing through the sensor is filtered, they still get
    dirty and can cause problems for new or repaired engines that could be detrimental
    to ring seating or engine operating temperatures. Air meters require cleaning
    with a suitable air inlet solvent that removes debris and dirt that can shroud
    and insulate the sensing bulb and cause the PCM to miscalculate air flow.


    The next component in line is connected to throttle body and port fuel injected
    vehicles it is the throttle body. Typically we are looking for collections of
    dirt inside the throttle body, behind the throttle plates, and in the idle air
    control passes. It is key that the manufacturer''s recommendations are followed
    when servicing these because of the use of a shop towel and it wipe out or in
    most cases this will remove deposits. Carburetor cleaner and even some induction
    systems cleaners remove the coatings that are designed to resist dirt causing
    or erratic idle speeds.


    The next tract is the intake manifold. When replacing or replacing intake manifolds,
    it is important to check them for warp or corrosion around water passes. Always
    be sure to remove any electrical switches before cleaning. Most intake manifolds
    are gasket to be installed without screws and most are like cylinder head gaskets.
    Proper torque is critical to lasting gasket performance.


    The fuel components that are on the engine have to be considered. The fuel rail
    and pressure regulator on fuel injected vehicles, the carburetor on other vehicles,
    the fuel injectors, and the related sensors and actuators are all included.


    Carburetors, for the most part, saw their last application in 1995, domestic and
    Asian manufactured vehicles were carbureted. Carburetors and the associated vacuum
    lines must be checked for leakage or deterioration.'
