  md: '# Section 6 Answer Keys and Explanations


    9. A sweet smell and white smoke in the exhaust of a vehicle with a catalytic
    converter can be an indication of:


    +   A. A lean fuel mixture.

    B. Coolant leaking into the combustion chamber.

    C. A rich fuel mixture.

    D. A vacuum leak.


    Answer A is incorrect. Answer B is correct. Coolant leaking into the combustion
    chamber would cause white exhaust color with a sweet smell.


    Answer C is incorrect. A rich fuel mixture could cause a strong sulfur smell from
    the exhaust as the extra fuel is burned in the converter.


    Answer D is incorrect. A vacuum leak would cause a rough idle that would decrease
    as engine speeds.


    10. Technician A says coolant with rust in it may cause the water pump impeller
    to fail. Technician B says the water pump impeller may be made of plastic. Who
    is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.


    Answer C is correct. Both Technicians are correct. Rust in the coolant is an abrasive
    which may wear the impeller vanes off, causing little or no coolant circulation.
    Some water pumps in use today are made with plastic impellers.


    Answer D is incorrect. Both Technicians are correct.


    11. The catalytic converter is overheating causing it to glow bright red and heat
    the passenger’s floorboard. There is also a strong sulfur odor from the exhaust.
    The cause of this could be:


    +   A. Improper coolant in the engine.

    B. A vacuum leak.

    C. Too low a fuel octane.

    D. A rich fuel mixture.


    Answer A is incorrect. Improper coolant will not affect the converter.


    Answer B is incorrect. A vacuum leak will not cause an exhaust odor.


    Answer C is incorrect. The wrong fuel octane may cause spark knock but will not
    cause the converter to overheat.


    Answer D is correct. Too rich a fuel mixture can cause the excess fuel to burn
    in the converter and overheat it, causing a strong sulfur odor.'
