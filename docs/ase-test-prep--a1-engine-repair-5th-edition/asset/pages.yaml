    B. B only

    C. Both A and B

    D. Neither A nor B

    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is correct.

    Answer C is correct. Both Technicians are correct. Worn rings can cause excessive
    blowby creating pressure in the crankcase and allowing oil to be blown into the
