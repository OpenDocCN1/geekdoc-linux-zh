    # Engine Repair (A1)


    5. The customer''s complaint is that the engine cranks over slowly but does not
    start. Technician A says it could be caused by the battery. Technician B says
    it could be caused by a broken timing belt. Who is correct?


    ![](img/95183953b74d7b388b46905691681ee3_146_0.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is correct. Only Technician A is correct. A weak battery would cause
    slow cranking.

    Answer B is incorrect. A broken timing belt will cause the engine to spin over
    rapidly.

    Answer C is incorrect. Only Technician A is correct.

    Answer D is incorrect. Technician A is correct.


    6. Technician A says RTV can be used to seal lower intake plenum in place of a
    gasket. Technician B says RTV can be used to replace a water pump gasket. Who
    is correct?


    ![](img/95183953b74d7b388b46905691681ee3_146_1.png)


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. RTV will deteriorate in contact with gasoline.

    Answer B is correct. Only Technician B is correct. RTV is a suitable replacement
    for a gasket on a water pump.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    7. The customer complains of a vibration when accelerating, which goes away away
    at a steady speed. Which of the following is the most likely cause for the condition?


    ![](img/95183953b74d7b388b46905691681ee3_146_2.png)


    +   A. Out of balance tire

    B. Broken or weak motor mount

    C. Bent or broken engine cooling fan

    D. A warped brake rotor


    Answer A is incorrect. A vibration from out of balance tire would be felt at speeds
    35 MPH rather than just when accelerating.

    Answer B is correct. Broken or weak motor mount will allow the engine to shift
    under acceleration, causing a vibration.

    Answer C is incorrect. Bent or broken cooling fan would cause a constant vibration.

    Answer D is incorrect. A warped brake rotor will cause a vibration when stopping.'
