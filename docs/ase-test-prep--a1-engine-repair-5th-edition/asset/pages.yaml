    Engine Repair (A1)


    # 5. Inspect and replace crankcase ventilation system components.


    The crankcase ventilation system serves two purposes. First, it removes crankcase
    blow-by and pressure. Second, it introduces the crankcase gases into the engine
    to be burned during the combustion process.


    Inspect the system by looking for hoses that are cracked, swelled, or kinked.
    The side of the system with the crankcase ventilation valve is under vacuum; the
    side that connects to the air cleaner or air intake tube is the vent side. Air
    is drawn from the filtered intake side to ventilate the crankcase and then drawn
    through the valve and into the intake stream. If the ventilation valve is kinked,
    the valve cannot open. This will result in excessive crankcase pressure that may
    cause gaskets and seals to leak. may also cause an accumulation of oil in the
    engine cleaner assembly.


    # 6. Inspect and install system components; adjust timing.


    On engines fitted with a distributor, check for a cracked, worn out, or damaged
    distributor cap. Pull each spark plug from the cap one at a time and check for
    burned or corroded terminals. Check the spark plug leads for burned, pinched,
    or oil-soaked insulation. Replace damaged caps. Remove the cap and check inside
    it. If the cap is excessively worn or corroded terminals, replace it. For carbon
    tracking, and if, replace the cap. The high tension cable leads to ignition coil.
    Ignition coils sometimes leak oil, which will soften and damage the cap. If oil
    is found, replace the ignition coil and the cable. Check the distributor for a
    burned, pitted, or excessively worn rotor.


    On engines equipped with solid state ignition, check the centrifugal and vacuum
    advance mechanisms, if equipped. Inspect the rotor, or plunger, to make sure that
    it is not contacting the pickup or pickup col. Replace damaged parts. The mechanical
    advance advances timing as engine speed increases. Check that the advance is not
    seized by grasping the rotor and attempting to turn it in the direction of rotation.
    The rotor should move in the direction of rotation against spring pressure, but
    not in opposite direction. The rotor moves, pitted weights under the rotor or
    breaker plate should move outward. The vacuum advance controls spring release.
    To test the advance, connect a hand operated pump to the neck in the unit and
    watch the breaker plate while operating the pump. The breaker plate should rotate
    in the opposite direction of the distributor as the pump is operated. If the unit
    will not hold vacuum, the diaphragm is damaged and the vacuum unit must be replaced.
    If the unit holds vacuum, the breaker plate does not move, the plate may be seized.
    Check for a rusted pivot point or a foreign object, such as a dropped retaining
    screw, that may be jammed between the plate and the distributor housing.


    Remove and inspect the spark plugs. Use the appropriate socket to prevent spark
    plug damage. Remove the plugs when the engine is cold, especially if the engine
    has aluminum cylinder heads. Removing plugs from an aluminum head when the engine
    is hot can damage the aluminum threads. If the plugs are in good condition, apply
    a small amount of anti-seize to the spark plug threads. Thread the plugs into
