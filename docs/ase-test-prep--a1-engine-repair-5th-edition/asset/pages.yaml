    in compression


    +   A. A leaking intake valve.

    B. A blown head gasket.

    C. A burned exhaust valve.

    D. Worn rings.


    Answer A is incorrect. A leaking intake valve will not seal better with oil in
    the cylinder.

    Answer B is incorrect. Oil in the cylinder will not seal a leaking head gasket.

    Answer C is incorrect. Oil put in the cylinder will not seal a burned exhaust
    valve.

