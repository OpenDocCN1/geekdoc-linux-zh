  md: '# Section 6 Answer Keys and Explanations


    21. The customer complains of a thump and vibration when accelerating from a stop.
    Which of the following is the most likely cause for the condition?


    +   A. Out of balance tire

    B. Broken or weak motor mount

    C. Spark plug misfire

    D. A warped brake rotor


    Answer A is incorrect. A vibration from an out of balance tire would be felt while
    the car is moving, not when accelerating from a stop.


    Answer B is correct. A broken or weak motor mount will allow the engine to shift
    under acceleration, causing a thump and a vibration when accelerating from a stop.


    Answer C is incorrect. A spark plug misfire can cause a vibration but not a thump
    on acceleration.


    Answer D is incorrect. A warped brake rotor will cause a vibration when stopping,
    not when starting.


    ![](img/95183953b74d7b388b46905691681ee3_132_0.png)


    22. The gauge in the figure above is used when performing a:


    +   A. Compression test.

    B. Cylinder power balance test.

    C. Cylinder leakage test.

    D. Vacuum test.


    Answer A is correct. A compression gauge is shown.


    Answer B is incorrect. A cylinder power balancing test is usually done with an
    engine analyzer.


    Answer C is incorrect. A cylinder leakage tester is a different device.


    Answer D is incorrect. A vacuum test is done with a vacuum gauge.'
