    # PREPARATION EXAM 6—EXPLANATIONS


    +   1. Technician A says when removing an engine with an automatic transmission,
    the transmission torque converter is removed with the engine. Technician B says
    all the accessories must be removed from the engine before removal. Who is correct?

    A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. The transmission torque converter must be unbolted and
    pushed back into the transmission pump to prevent damage during engine engine
    removal.

    Answer B is incorrect. It is usually possible to leave the alternator mounted
    on the engine during removal. It is best to take as little as possible from the
    engine before removal. After removing the engine, it is much easier to remove
    the parts.

    Answer C is incorrect. Neither Technician is correct.

    Answer D is incorrect. If an engine is removed with the torque converter still
    attached, the converter may bind in the transmission pump and break the pump housing.
    Due to tight engine compartments, any accessories, wiring, or other components
    that can be left on the engine during removal will be easier to remove the engine
    out of the engine compartment and mounted on an engine stand. The components can
    be reinstalled before installation.


