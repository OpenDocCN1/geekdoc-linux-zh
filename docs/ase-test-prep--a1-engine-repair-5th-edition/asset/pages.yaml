    250 rpm.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect.


    ![](img/95183953b74d7b388b46905691681ee3_178_0.png)


    45. There is coolant lost from an engine Technician A says to pressurize the cooling
    system to 25 psi, then check for leaks. Technician B says small leaks may be obvious
    immediately after a hot shutdown. Who is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. A cooling system should not be pressurized over the radiator
    cap rating.

    Answer B is correct. Only Technician B is correct. When an engine is shut down
    after reaching operating temperature, the pressure in the cooling system increases.
    This may cause the leak to become obvious.

    Answer C is incorrect. Only Technician B is correct.

    Answer D is incorrect. Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_178_1.png)


    46. During a vacuum test, it is noted that the needle oscillates rapidly as the
    engine RPM increases but it is steady and normal at idle. What would be the most
    likely cause?


    +   A. Worn rings

    B. Sticky valves

    C. Weak valve springs

    D. A clogged exhaust system


    Answer A is incorrect. Worn rings will cause a low vacuum reading when the cylinder
    is not sealing properly.

    Answer B is incorrect. Sticky valves will show up as a steady and normal vacuum
    reading with occasional sharp flicks.

