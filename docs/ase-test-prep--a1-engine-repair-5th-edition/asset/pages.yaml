    # 3. Inspect and repair damaged threads where allowed; install core and gallery
    plugs.


    Inspect all threaded bolts in the cylinder block, especially the cylinder bolt
    holes. Check for sludge or debris that may have been missed during cylinder cleaning.
    Run the appropriate size thread chaser into each of the cylinder bolt threaded
    holes to make sure the threads are clean. Put a few drops of oil on the bolt and
    thread into each hole by hand.


    If the threads in a bolt are damaged, the hole may be drilled to a larger size
    and rethreaded. A thread repair insert or HeliCoil thread insert can be installed
    in the oversize hole result is a bolt that is the same size as the original. Different
    types and brands of thread inserts are available. In many cases, the insert is
    threaded into a special installation tool, coated with thread locking compound,
    and threaded into the oversize hole. The installation tool is then removed and
    a hammer and punch are used to break off a tang at the bottom of the insert.


    Inspect oil gallery threads for dirt or damage. Run a tap very far into these
    holes since they usually have tapered threads. Run a wire brush down the galleries
    to make sure all debris has been removed. Coat the new oil gallery plugs with
    Teflon tape or an oil-resistant sealer and thread them into the block. If small
    core plugs are at the ends of the galleries, coat the edges of the plugs with
    an oil-resistant sealer and drive the plugs into the block. Use a chisel and hammer
    to cross the end of the bores after the core plugs are installed.


    Clean out core plugs with emery cloth before installing new plugs. If a bore is
    damaged, it may be repaired by boring it to the next specified oversize. Oversized
    core plugs are stamped with the letters OS. Before installing a new plug, coat
    the sealing edge with a nonhardening, water-resistant sealer. Drive the plug into
    the block using the proper driving tool. Make sure the plug goes into the bore
    squarely to prevent leaks.


    # 4. Inspect and measure cylinder walls; hone and clean cylinder walls; determine
    need for further action.


    Use a dial gauge to measure the cylinder diameter in three vertical locations.
    These locations are just below the ring ridge at the top of the cylinder, in the
    center of the ring travel, and just above the lowest part of the ring travel.
    Cylinder taper is the difference in the cylinder diameter at the top of the ring
    travel compared to the diameter at the bottom of the ring travel.


