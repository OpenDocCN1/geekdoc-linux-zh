    before replacing an injector. Technician B says fuel pressure be 50 psi or higher,
    depending on the injection system. Which is correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. Technician B is also correct.

    Answer B is incorrect. Technician A is also correct.

