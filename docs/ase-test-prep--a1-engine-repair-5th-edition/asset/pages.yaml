    Many vehicles have air and coolant temperature sensors mounted on intake manifold.
    Thermistor-type air sensors should be inspected and replaced if deposits have
    built up on them; cleaning them often. The throttle position sensor and manifold
    pressure sensors should be handled with care during service as all electrical
