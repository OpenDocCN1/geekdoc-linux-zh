    19. After a vehicle sits overnight, a light tapping noise when it is first started
    that disappears after a short time. The most likely cause would be:


    +   A. Low oil level.

    B. Worn rod bearings.

    C. Excessive lifter leakdown.

    D. Weak oil pump.


    Answer A is incorrect. If the oil level was low, the noise would not go away.

    Answer B is incorrect. If the rod bearings were making noise, it would be a deeper
    knock and probably would not go away.

    Answer C is correct. If the lifters leakdown after sitting, when the oil pressure
    comes up they will pump quickly and quiet down.

    Answer D is incorrect. If the noise was caused by a weak oil pump, it would not
    go away.


