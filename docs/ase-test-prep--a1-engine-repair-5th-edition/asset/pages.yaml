  md: '# Section 4 Task List Overview


    # Engine Repair (A1)


    If you are unable to rotate the crankshaft by hand, the engine may be hydrostatically
    locked or broken internal components. To check for hydraulic lock, remove all
    the spark plugs and attempt to rotate the crankshaft again. If oil or coolant
    squirts from the spark plug holes, this indicates a bad head gasket, warped cylinder
    head, or a cracked cylinder head, or cylinder block. Water squiring from the spark
    plug holes could be an indication the customer went through a deep puddle and
    drove with water through the air intake.


    If the crankshaft cannot be rotated with all the spark plugs removed, or cannot
    be rotated at least one revolution, the engine may be seized or have broken internal
    parts. Pull the dipstick and check the crankcase oil. If oil does not register
    on the dipstick, it is possible that the pistons are seized in their bores or
    the connecting rods are seized to the crankshaft. If the oil level is sufficient,
    a broken component may have lodged between parts inside the cylinder block, preventing
    the parts from rotating.


    Many camshaft (OHC) engines are non-freewheeling or "interference" engines. On
    these engines, a no-crank condition may be caused by piston-to-valve contact.
    This is a common occurrence when a timing belt slips or breaks, but it may also
    occur on engines fitted with a timing chain and sprockets. On many belt-driven
    OHC engines, it is possible to easily loosen or remove the part of the timing
    belt. Do this, if possible, and check for obvious signs of belt failure.


    Fuel injected engines use high-pressure fuel from an electric pump. To verify
    that the fuel pump is operating and is reaching the engine, locate the fuel line
    that supplies fuel to the throttle body or fuel injector. Turn the key on/engine
    off after installing a pressure gauge. Verify if the gauge registers adequate
    pressure. If the gauge does not register any pressure or very low pressure, proceed
    with the fuel system diagnosis. If fuel pressure is adequate, begin the diagnosis
    of the injection control system.


    Delmar. Cengage Learning ASE Test Preparation


    Page 13'
