    specifications and that the spring does not fall to one side. The spring must
    stand perpendicular when it sits on a flat surface. The spring must be able to
    attain a specified pressure when rest. This is called the valve spring installed
    height. A spring tester is used to measure these pressures at their respective
    heights. In most cases, if a spring fails it will not be able to develop adequate
    pressure. This can cause the valve to "float" or bounce when the engine is at
    high revs. Low spring pressure leads to a spring breaking and the valve falling
    into the cylinder. In the more unusual event that the spring generates too much
    pressure, it can cause excessive wear on the cam, followers, or lifters.


