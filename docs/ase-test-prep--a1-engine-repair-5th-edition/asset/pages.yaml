    11. Technician A says that all coolants are the same if they are ethylene glycol-based.
    Technician B says different coolant types can be mixed with no problems. Who is
    correct?


    +   A. A only

    B. B only

    C. Both A and B

    D. Neither A nor B


    Answer A is incorrect. All automotive coolants used by OEM manufacturers are ethylene
    glycol-based. The additives in each type, which may be designated by color, are
    different.


    Answer B is incorrect. If different types of coolant formulas are mixed, the protection
    will be lowered and the mixture may cause gelling in the cooling system.


    Answer C is incorrect. Neither Technician is correct.


    Answer D is correct. Technician B is correct. Although all OEM automotive coolants
    are ethylene glycol-based, the additive package is different. Manufacturers determine
    which additives will give the best protection and long life for engines. The different
    additive packages are indicated by dye added to the coolant. Some of the different
    additive packages are not compatible and may cause reduced protection if mixed
    together. It is always best to use OEM recommended coolant.


    ![](img/95183953b74d7b388b46905691681ee3_225_1.png)


