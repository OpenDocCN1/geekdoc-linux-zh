  md: '# Section 6 Answer Keys and Explanations


    27. Which of these should be performed first when a starter fails to crank the
    engine?


    +   A. Measure static battery voltage.

    B. Remove and check spark plugs.

    C. Check for fuel pressure.

    D. By-pass the starter solenoid with a remote starter button.


    Answer A is correct. The battery voltage should be checked first to verify there
    is enough power to turn the starter.


    Answer B is incorrect. Spark plugs may be removed if a hydro-lock condition is
    suspected in the cylinder. This would not be the first test.


    Answer C is incorrect. Fuel pressure that is not at specifications may cause an
    engine to start but will not keep it from cranking.


    Answer D is incorrect. The correct battery voltage should be checked first. The
    solenoid may be bypassed if there is a faulty ignition switch or neutral safety
    switch.


