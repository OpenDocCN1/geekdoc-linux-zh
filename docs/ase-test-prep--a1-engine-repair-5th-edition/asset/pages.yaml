  md: '# Section 2 Overview and Introduction


    # Engine Repair (A1)


    Many individuals may say that there are actual gains of truth in this "folk" wisdom,
    and whereas some exams, this may prove true, it is not relevant in regard to the
    ASE certification exams. ASE validates all exams and test forms through a national
    sample of technicians, and only those questions and tests that meet ASE standards
    of quality and accuracy are included in the scored sections of the exams. Any
    biased questions or patterns are discarded altogether, and therefore, it is highly
    unlikely you will experience any of this "folk" wisdom on an actual ASE exam.


    # PREPARING FOR THE EXAM


    Delmar, Cengage Learning wants to make sure we are providing you with the most
    thorough preparation guide possible. To demonstrate this, we have included hundreds
    of preparation questions in this book. These questions are designed to provide
    as many opportunities as possible to successfully pass your ASE exam. The preparation
    we recommend and outline in this book is designed to help you build confidence
    in demonstrating what task area you already know well while outlining what you
    should review in more detail prior to the actual exam.


    We recommend that your first step in the preparation process be to thoroughly
    review Section 3 of this book. This section contains a description and explanation
    of the types of questions you''ll find on an ASE exam.


    Once you understand how the questions will be presented, then we recommend that
    you thoroughly review Section 4 of this book. This section contains information
    that will help you establish an understanding of what the exam will be evaluating,
    and specifically, how many questions to expect in each specific task area.


    As your third step, complete your first preparation task one question at a time.
    After you answer each question, review the answer and question explanation information
    located in Section 6. This section will provide you with instant response feedback,
    allowing you to gauge your progress, one question at a time, throughout your first
    preparation exam. If after reading the question you do not feel the reasoning
    for the correct answer, go back and review the task list overview (Section 4)
    for the task that is related to question. With each question explanation is a
    clear identifier of the task area that is being assessed (c.g., Task A.1). If
    at that point you still do not feel you have a solid understanding of the material,
    identify a good source of information on the topic, such as an educational course,
    textbook, or other related source of topic learning, and some additional studying.


    After have completed your first preparation exam and reviewed your answers, you
    are ready to complete your next preparation exam. A total of six practice exams
    are available in Section 5 of this book. For your second preparation exam, we
    recommend that you answer the questions as if were taking the actual exam. Do
    not use any reference material or allow any interruptions in order to get a feel
    for how you will do on the actual exam. Once you have answered all of the questions,
    grade your results using the Answer Key in Section 6. For every question that
    you have given an incorrect answer, study the explanations to the answers and/or
    the overview of the related task areas. Try to determine the root cause for missing
    the question. The easiest thing is to review the correct technical technique.
    The hardest things are behaviors that lead you to an incorrect conclusion. If
    you know the information but still get the question incorrect, it is likely a
    test-taking behavior that will need to be corrected. An example of this would
    be reading too quickly and skipping over words that affect your reasoning. If
    you can identify what caused you to answer the question incorrectly, you can eliminate
    that and improve your score.'
