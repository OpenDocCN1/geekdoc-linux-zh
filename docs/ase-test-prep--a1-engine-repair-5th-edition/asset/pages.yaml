    ![](img/95183953b74d7b388b46905691681ee3_149_1.png)


    15. Technician A says main bearing oil clearance can be checked with Plastigauge®.
    Technician B says main bearing oil clearance can be checked with a feel gauge.
    Who is correct?


    +   - A only

    - B only

    - Both A and B

    - Neither A nor B


    Answer A is incorrect. Only Technician A is correct. Main bearing oil clearance
    can be checked with Plastigauge® across the journal with the bearings installed
    and torquing the cap; remove the cap, and use the Plastigauge® scale, record the
    clearance.


    Answer B is incorrect. A feel gauge is not a tool to check main bearing oil clearance.
    It will not conform to the journal to give an accurate reading.


    Answer C is incorrect. Only Technician A is correct.


    Answer D is incorrect. Only Technician B is correct.


    ![](img/95183953b74d7b388b46905691681ee3_149_2.png)


    16. The spark plugs are being replaced. Technician A says spark plug gap does
    not have to be checked. Technician B says a replacement spark plug must be the
    same heat range and style as the original. Who is correct?


    +   - A only

    - B only

    - Both A and B

    - Neither A nor B


    Answer A is incorrect. Spark plug gap should always be carefully checked to ensure
    the gap is correct. Although platinum plugs are pre-gapped at the factory, the
    plug may have dropped, causing the gap to close.


    Answer B is incorrect. Only Technician B is correct. Although there are many different
    manufacturers for spark plugs, the replacement plugs must be the same heat range
    and composition as the originals to provide extended time without failure.


    Answer C is incorrect. Only Technician B is correct.


    Answer D is incorrect. Technician B is correct.'
