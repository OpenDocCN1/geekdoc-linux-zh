    # 2. Inspect, service, or replace air filters, filter housings, and intake ducts.


    Inspect the air filter housing and any duct directing air to the housing.

    Duct often leaks from the radiator support or fender to the filter housing. Make
    sure that this duct is present and undamaged.


    Check the air filter housing itself. Make sure that the housing is securely mounted
    and or duct connections are tight. On carbureted and TBI engines, make sure that
    the gasket between the filter housing and the carburetor, or TBI, unit is present
    and in good condition. Check the housing lid or cover to make sure that it fits
    properly and any seals or gasket materials are in good condition. Streaks of dust
    or debris around a sealing area indicate that the seal is leaking. Make sure that
    all clips or wing nuts securing the lid or cover are present and working properly.
    Engines equipped with airflow sensor (most multi-point injection [MPI] engines)
    the duct from the filter housing to the throttle body needs to be checked for
    cracks and leaks. Cracks can allow the engine to draw in unmetered air causing
    drivability problems.


    Check the air filter for damage or exhaust dirt. Check the filter or filter housing
    for an instruction label. Follow the manufacturer’s recommendations, if present,
    especially for filter element replacements.


