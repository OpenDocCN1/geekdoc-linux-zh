    ## 第 3 天 - 查看文件内容

    > – 来看看里面是什么吧。《外星战将》（1985）

    还记得我之前说过计算机能做的第二重要的事，是操控四个幽灵在满是豆子的迷宫里转，还得让你吃豆子吗？我没撒谎，这是真的。不过第三重要的，就是显示文本文件的内容。

    想当初我十几岁的时候（明确一下，是 90 年代），我们都用软盘传数据。我知道，听起来那时候好像恐龙还在陆地上走，人类还拿着燧石长矛打猎（剧透预警：这俩可没出现在同一个时代），但这是事实。当时的文本文件非常重要，歌词、编程教程、笑话，所有这些东西都是以文本文件的形式流传的。

    你知道吗？现在我打开某个乐队的歌词网页，屏幕上全是广告、弹窗、Cookie 提示和 unwanted 的视频，我格外想念那些纯粹、枯燥又简单的文本文件。

    好了，别再沉浸在过去的美好里了。我的意思是，现在文本文件……依然是计算机领域里最重要的东西之一！你想啊：所有网页和所有计算机程序的源码本质上都是文本文件。也就是说，如今在数据网络上传输的内容里，至少有
    80% 都还是文本文件。

    所以，这次我们不用打开文本编辑器，直接看看文本文件的内容就行。如果你按照配置部分的说明完成了设置，当前目录里应该有示例文件。其中有一个文件叫 `examples.txt`，之后的课程里我们会一直用它来测试命令。

    ``` $ cat examples.txt ```

    你应该已经看到 `examples.txt` 的内容了，大概率也在纳闷，为什么八竿子打不着的东西会被列在同一个文本文件里。相信我，我还没完全疯掉，这些东西之后会用得上的。

    目前也没什么更多可说的了。我早就提醒过你，文本文件可没你浏览器里那些弹窗和广告有意思。这节课比较短，也没什么值得一提的练习题，我给你讲个关于 `cat` 的趣闻吧。

    虽然对我这种爱猫人士来说，这个名字特别可爱，但 `cat` 其实是 conCATenate（拼接）的缩写。你可以在它的命令行里指定多个文件名，输出的内容就是这些文件内容的拼接。顺带一提，如果你只指定一个文件，其实就是让这个命令打印该文件的内容。

