    ```

    提取所有文件扩展名的列表并统计数量。假设扩展名仅由小写字母组成。


    ##### 解答

    这道题有很多解法，其中一种可行的方案是使用grep的环视表达式先分离出文件路径，再进一步提取文件扩展名。

    ```shell

    $ cat simple.log | grep -Po "(?<=GET ).*(?= HTTP)" | grep -Po "(?<=\.)[a-z]+$"
    | sort | uniq -c

    4 access

