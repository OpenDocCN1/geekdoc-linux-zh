    休息一下，散散步，听听音乐，放松下吧。从下节课开始我们将进一步学习Unix命令行技巧，希望你们做好准备了！可以带着猫咪一起来哦。建议今晚观看的电影：《家有恶猫》（1965）——
    一位Unix初学者在使用最基础的命令时遇到了麻烦，甚至把FBI卷入了他的“斗争”。


    ## 第四天 - 开端与结尾

    > – *来吧，让我们开始吧。*

    > – *我们在F大调收尾。*

    > 《莫扎特传》（1984）


    人们往往不会读长消息，比如你发邮件的时候就要注意这点。如果内容太长，大家通常只会看开头，然后跳过中间部分直接看结尾。也就是说，如果你消息的核心内容是你耗时20年研究时间旅行得出的最终成果，教你如何用洗碗机制作时光机，那这部分内容就丢了、彻底没了。抱歉，你本可以写得再简洁一点的。虽然这是人的坏习惯，但读取数据流的开头和结尾部分往往非常实用。


    比如，我们可能需要按大小列出文件并提取前5个，也可能需要输出系统最后10条日志，以便随时了解系统运行状态。好在Unix提供了两个好用的命令来完成这些操作，分别是`head`和`tail`。仅从名字你就能分清它们的功能，这点是这些命令的作者为我们做的非常贴心的设计。


    运行如下命令时：

    ```

    $ head <file>

    ```

    系统会默认输出文件的前10行。你可以在示例仓库提供的`slices.txt`文件上尝试这个命令以及后面的示例。该文件只是从1到20的连续编号行，方便你快速验证操作是否正确。因此执行`head
    slices.txt`应该会输出第1-10行。


    反过来，如果执行`tail slices.txt`，你会得到第11-20行，也就是文件的最后10行。如果需要快速浏览文件、大致了解内容结构，10行通常是合适的量级，但你也可以指定输出更少或更多的行。


    这两个命令都可以通过`-n`参数后接指定的行数来实现这个功能。比如`head -n3 slices.txt`会输出文件的前3行。请注意Unix命令行的一个重要规则：参数和它的值之间可以加空格也可以不加，因此执行`head
    -n3 slices.txt`和`head -n 3 slices.txt`会得到完全相同的结果。你甚至可以在参数和值之间加多个空格，如果你觉得开心的话，但等我们开始按列分割文本时，你大概就不会喜欢多空格了，所以最好还是别这么做。友情提示哦。


    ## 练习

    这里有几道关于`head`和`tail`的练习题留给你完成。所有练习都可以在示例文件`slices.txt`上操作，借助编号行可以立刻得到反馈，但如果你已经很有把握了，也可以使用其他文件。

    ### 练习4.01

    显示`slices.txt`的前3行内容[跳转到答案](#)

    ### 练习4.02

    显示`slices.txt`的最后3行内容[跳转到答案](#)

    ### 练习4.03

    显示`slices.txt`的内容，跳过最后3行[跳转到答案](#)

    ### 练习4.04

    显示`slices.txt`从第3行开始的内容（即跳过前2行）[跳转到答案](#)


    以上就是今天的内容。难吗？无聊吗？抱歉我听不到你的回答啦，这本书是我很久之前写的。无论如何，如果你觉得进度太慢可以自由调整节奏，每日更新只是建议而已。今天我还建议你喝杯热茶，再来点小饼干。下一站我们将学习“管道”相关的内容：这是Unix中最需要掌握的重要知识点之一。建议今晚观看的电影：《高地人》（1986）——
    世间有无数个开端，但最终只会留下一个。


    ## 第五天 - 分号、逻辑与、管道

    > – 好了，我们逻辑上理清这件事吧。

    > 《回到未来3》（1990）


    到目前为止，bash和Unix似乎没有使用其他编程语言或系统中那些烦人的奇怪符号，这不是很好吗？是的，但遗憾的是这并不属实。这节课我们会接触到Unix用来表达复杂操作的一些花里胡哨的“象形文字”，如果你还在遗憾大学时错过了古巴比伦语言课，那现在开心了吧，你很快就能补上了。


    首先我们来了解分号。尝试在两个命令之间加上分号，比如：

    ```

    $ echo "First string"; echo "Second string"

    ```

    如你所见，bash会按顺序执行这两个命令，因此`;`显然代表两个命令之间的某种“与”关系。


    但如果其中一条命令执行失败会怎么样呢？这一点也很有趣。我们尝试把第一个命令设为读取一个不存在的文件的内容：

    ```

    $ cat nofile.txt; echo "Second string"

    ```

    这条组合命令的输出先是cat的错误提示（它毫不留情地让我们罚站），然后才是echo命令的输出。


    因此，分号会无视命令的执行结果，始终执行所有命令。但很多时候我们需要另一种命令串联方式：只要有一条命令执行失败，就中断后续操作。比如你可能需要查找所有指定名称的文件，并生成一份统计日志，但如果找不到符合要求的文件，你肯定不想执行最后一步。


    现在我们来看看`&&`运算符对上面两条命令的作用：

    ```

    $ cat nofile.txt && echo "Second string"

    ```

    看起来这正是我们需要的效果：我们仍然会收到cat的错误提示（又要罚站了，抱歉），但不会输出echo的内容。因为有一条命令执行失败，bash中断了后续操作。


    把这个知识点记牢，迟早会用得上。还有第三个“古文字”熬过了古埃及王国的衰亡，最终登陆了Unix系统，它是你必须掌握的最重要的运算符之一。所以，去泡杯浓咖啡吧，你得保持清醒。


    ### 注意事项

    你可能会注意到，本书后面我始终使用`cat <file> | <command>`的模式，尽管很多命令的手册页显示你也可以省略`cat`和管道符，直接执行`<command>
    <file>`。虽然我日常工作中两种用法都会用，但本书更推荐第一种，因为它能更清楚地说明`<command>`的作用，同时帮助你熟悉管道的用法。


    到目前为止，我们运行命令时，输出都会（神奇地？）打印在终端上，这没问题，因为大多数时候我们都需要查看命令的执行结果。而命令的输入则几乎全部来自你硬盘上已有的文件。


    如果你运行如下命令：

    ```

    $ head -n 10 slices.txt | tail -n 5

    ```

    只要你的系统没出毛病，你应该会看到`slices.txt`文件的第6-10行。


    但等等……我们让`head`输出10行，这结果怎么有点奇怪？`|`运算符叫做*管道*，作用是把第一个命令的输出结果“导走”，让它不再显示在终端上，而是直接传给`tail
    -n 5`命令处理。所以我们得到的是`slices.txt`前10行中的最后5行，也就是第6-10行。我之前就说这节课讲的是管道工程吧？


    许多处理文件的Unix命令都支持从管道接收输入，现在你应该明白管道为什么这么重要了吧？通过管道你可以连接多个命令，用简单的命令组合出复杂的操作。现在，欢迎来到Unix教授的操作系统哲学课！


    我这话可没全在开玩笑，所谓的*Unix哲学*要求你开发小巧的程序，只做非常具体的事，但要把这些事做到极致。之后你可以用管道和其他运算符把这些小程序组合起来，实现更复杂的功能。


    今天就到这儿吧！你今晚可能会梦到漏水的管道、哲学家和法老们。我只能推荐你读本好书、喝杯热茶。就是别看任何和古文化相关的内容就行！建议今晚观看的电影：《星际之门》（1997）——
    一些Unix程序员在一家工厂里协同工作，这座工厂似乎证明了古埃及人早就熟悉命令行操作。

