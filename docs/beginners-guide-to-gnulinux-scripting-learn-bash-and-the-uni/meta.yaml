    10:05:34 200 GET

    10:05:57 200 GET

    10:05:50 200 GET

    10:05:24 200 GET

    10:05:50 200 GET

    ```

    该解答的思路是：使用分组中的逻辑`OR`匹配所有包含`GET`或`POST`的行，且要求这两个方法两侧都有空格，这样可以避免匹配到其他包含这些字母串的内容（例如URL中包含"BUDGET"或"POSTER"的行）。随后以年份（`[0-9]{4}`）为锚点拆分行的剩余部分。将闭合方括号`]`写在分组外部，可以让它不出现在输出结果中。HTTP协议可以是HTTP/1.0或HTTP/1.1，HTTP状态码始终是三位数字（`[0-9]{3}`）。


