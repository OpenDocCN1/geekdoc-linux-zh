  md: '# Day 12 - Regular expressions - Single characters


    > – You know, you got to keep regular if you want to be happy.

    The Shining (1980)


    Some time ago, I needed to review around 1000 files to check if IP numbers were
    mentioned in them. I wasn''t looking for a specific number, the requirement was
    to find IP numbers in general. Trying all of them was absolutely out of the question,
    as IPv4 has a pool of 4 billion possible addresses. At 1 address per second it
    would take a little bit more than 136 years, and while I am still in my forties
    I somehow doubt that I have that amount of time. Especially to spend finding IP
    addresses! Fortunately I know regular expressions, and the whole task took me
    approximately 1 minute.


    Regular expressions (regex) are the most powerful tool you can learn when it comes
    to searching (and replacing) text. They are strings, with a specific syntax, that
    are used to search other strings. They unfortunately have a reputation of being
    incredibly complicated, and I hope I will succeed in debunking this myth. You
    can definitely come up with complex regular expressions, and sometimes it can
    take you a while to figure out how to express a specific pattern, but you will
    see that they are definitely accessible.


    Did I manage to instill hope you? Yes? Good, because this chapter will be incredibly
    difficult. Just kidding!


    To practice regular expressions we are going to use the file examples.txt and
    our good friend grep. Let''s see grep in action with the option -E that enables
    regular expressions


    ```

    $ grep -E "dog" examples.txt

    dog

    dog

    corn dog

    ```


    So, apparently the option -E doesn''t change the tool''s behaviour, so disappointing.
    This is because the string dog is already a valid regular expression, namely the
    one that searches for the character d, followed by the character o, followed by
    the character g. You are probably thinking that I''m just beating around the bush,
    right?


    Well, time to write the first "proper" regular expression, or at least to use
    some of the special syntax that regular expressions provide. After all, we are
    not here to just see cats and dogs. Let''s run the following command (remember
    there is no -o option this time)'
  merge: -1
  pgno: 45
- img_proc: true
  md: '```

    $ grep -E "d." examples.txt

    dog

    beholder

    dryad

    dog

    aardvark

    corn dog

    direwolf

    phase spider

    undead red dragon

    Spider-Man [*]

    wild hog

    Big Bad Wolf

    ```


    As you can see grep highlights groups of two letters, all of them starting with
    d. The "do" in **dog**, the "de" in spider, the "dr" in **dragon**, all these
    lines have one thing in common: they contain a d followed by another symbol (a
    letter or a space, as happens for example in "wild hog").


    This is what the symbol . does in a regular expression. It doesn''t mean a full
    stop, like in the standard punctuation usage, but "any character". Whenever a
    regular expression contains a . there can be any single character. Mind the fact
    that a single . matches a single character.


    As you can see, then, regular expressions are simple strings, but they can contain
    either normal characters (mostly letters of the alphabet, both lowercase and uppercase,
    and numbers) and special ones. So far we learned about only one of the special
    characters, that is . , commonly called "dot" in this context.


    How do we match a proper dot in the string? Since regular expressions assign a
    special meaning to some characters, when you want to use those characters for
    their original value you have to escape them with a \ (backslash). So, while


    ```

    $ grep -E "1.1" examples.txt

    Police 101

    HTTP/1.1

    ```


    matches two characters "1" separated by any single character, the regular expression


    ```

    $ grep -E "1\.1" examples.txt

    HTTP/1.1

    ```


    matches only those separated by a literal dot. Pay attention that the dot can
    be a punctuation mark, a decimal point, or have any other meaning. Regular expressions
    don''t know anything about the text that you are parsing, they just consider pure
    characters.'
  merge: -1
  pgno: 46
- img_proc: true
  md: '```

    $ head examples.txt | sed -r s,".g","--",g

    d--

    cat

    elephant

    ostrich

    D-- the D--

    beholder

    dryad

    d--

    Police 101

    aardvark

    ```


    The previous command searches for any character followed by a lowercase g (.g)
    and replaces it with a double dash. It obviously doesn''t make sense to have regular
    expressions in the replacement part of the command, as regexes are used to search.


    Regular expressions in sed are often used to delete unwanted parts of a line.
    Let''s say that I want to print the first 5 lines of the file simple.log removing
    everything after the GET part of the line


    ```

    $ head -n 5 simple.log | sed -r s,"GET.*","GET",

    83.149.9.216 [17/May/2015:10:05:03] GET

    83.149.9.216 [17/May/2015:10:05:43] GET

    83.149.9.216 [17/May/2015:10:05:47] GET

    83.149.9.216 [17/May/2015:10:05:12] GET

    83.149.9.216 [17/May/2015:10:05:07] GET

    ```


    I used the .* patter that matches all to remove the part od the line that I didn''t
    want in the output. As you can see I need to repeat GET in order to preserve it.
    We will learn later in the book a technique to avoid this repetition.


