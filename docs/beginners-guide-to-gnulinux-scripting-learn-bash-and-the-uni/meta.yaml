    # # Day 17 - Regular expressions - Groups


    > – _They come in groups of threes._

    Escape from New York (1981)


    Oh, groups. How much do I love groups? Let''s see, definitely less than pizza,
    but after all that''s an easy win. Well, culinary comparisons aside, I consider
    groups one of the best features of regular expressions, both for their expressive
    power and for the fact that they introduce a certain tool that is usually provided
    by programming languages only: variables.


    Let''s start considering why groups are important. Generally speaking groups allow
    you to isolate specific parts of the regular expression and reuse them later,
    but the way you can reuse them depends on the tool that you are using. Groups
    are particularly useful with sed, as they greatly improve the search and replace
    syntax.


    The following code uses sed to parse a regular expression (enabled by the option
    `-r`), isolate a group with the parenthesis and use the matched pattern in the
    replacement string.


    ```

    $ echo "10:30" | sed -r s,"([0-9]{2}).*","H:\1",

    H:10

    ```


    The regular expression tries to match 2 adjacent digits (`[0-9]{2}`), but putting
    them in a group with the parenthesis makes sed store the value in a variable.
    In this case the value stored is `10`, and the rest is ignored by the `.*` that
    matches anything. As you can see the way sed uses to access the value of groups
    stored during the search is a backslash followed by a number. The first (and only,
    in this case) group is named `\1`, the second `\2`, and so on. So, the replacement
    pattern is a string beginning with `H:` and followed by the value matched and
    stored during the search, that is `10`.


    Let''s try something a bit more complex, with two groups.


    ```

    $ echo "10:30" | sed -r s,"([0-9]{2}):([0-9]{2})","H:\1 - M:\2",

    H:10 - M:30

    ```'
  - '[PAGE 60]


    ```

    $ echo "alpha10" | sed -r s,"([a-z]+([0-9]+))","Full code:\1 - Number:\2",

    Full code:alpha10 - Number:10

    ```


    you will realise that the inner group `([0-9]+)` matches the digits `10` but the
    outer group matched both the letters and the digits, basically acting as it was
    `([a-z]+[0-9]+)`, without the internal group.


    When you use groups in the replacement string you are not forced to keep them
    in order, so for example


    ```

    $ echo "First,Second" | sed -r s/"(.*),(.*)/"/\2,\1"/

    Second,First

    ```


    is a very simple way to swap two fields in a comma-separated string. Well, maybe
    you don''t think it is that simple, let''s review it together. First of all I
    used a `/` to separate the search and replacement strings because the search string
    will contain a comma. The first group matches anything but up to the first comma,
    after which the second group captures the rest. In the replacement string I print
    the content of the second group, then a comma, and the content of the first group.


    We can use groups in `grep` as well, even though the reuse of the matching values
    is obviously limited by the fact that `grep` doesn''t replace text. The best use
    of groups in `grep` is with the so-called lookaround expressions, that are provided
    by the Perl-compatible regular expression syntax (PCRE), activated by the `-P`
    switch, as opposed to the `-E` that we used so far, that activates the Extended
    syntax (ERE). The differences between these syntaxes are outside the scope of
    this book, so feel free to investigate the matter online.


    Lookaround expressions can provide information about the surroundings of a matching
    pattern without including the surroundings themselves. Let''s look at an example:
    the simplest form of lookaround is the positive lookahead, where a group specifies
    what should follow the matching part of the string


    ```

    $ cat examples.txt | grep -P "[A-Za-z ]+(?=[0-9]+)"

    Police 101

    H2O

    R2-D2

    Johnny 5

    Cyborg 009

    ```'
  - '[PAGE 61]


    ```

    $ cat examples.txt | grep -oP "[A-Za-z ]+(?=[0-9]+)"

    Police

    H

    R

    D

    Johnny

    Cyborg

    ```


    The immediate evolution of the positive lookahead is the negative lookahead, which
    is expressed by `?!`. You can start to see a pattern here (apt, speaking of regular
    expressions). Lookaround groups are introduced by a `?` and followed by a criteria,
    which can be equality (=) or inequality (!).


    You can also use lookbehind expressions, which start with a `? <` instead of starting
    with a simple `?`. These expressions match patterns that follow the lookbehind
    group, for example


    ```

    $ cat examples.txt | grep -oP "(?<=[A-Z])[a-z]+"

    ug

    og

    olice

    ohnny

    pider

    an

    yborg

    ig

    ad

    olf

    ony

    ictures

    ```


    That matches all the lowercase letters that follow an uppercase one, without including
    the latter. The lookbehind expression is `(?<=[A-Z])`.


    A warning: lookaround expressions are often difficult to manage, and their behaviour
    can be surprising because it strongly depends on the implementation of the engine.
    You won''t hit such complex cases now that you just learned how to use groups,
    but it might happen in the future. For the time being, please keep in mind that
    there are important things to learn about regular expression engines, such as
    if they are greedy or not. This book wants to be a primer, so I will simply pretend
    those issues do not exist, but remember that there is a lot to learn out there!


    Back-references are actually supported by `grep`, but their behaviour can be surprising.
