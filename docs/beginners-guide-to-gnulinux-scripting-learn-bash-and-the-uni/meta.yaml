    A final interesting feature of groups is that they allow to use the OR logical
    operator at a local level. Let''s first have a look at the operator in a standard
    regular expression without groups. Having read so far, you clearly understand
    the following regular expressions


    ```

    $ cat examples.txt | grep -E "^o"

