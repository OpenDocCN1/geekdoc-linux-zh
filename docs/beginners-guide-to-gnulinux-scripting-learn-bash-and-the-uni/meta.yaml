    After variables, command substitution is one of the features you will use the
    most if you get into bash scripting. Command substitution simply means that you
    assign to a variable the full output of a command, and this is used often because
    it allows you to manipulate that output, to loop over its parts, and in general
    to use it creatively.


    Command substitution is expressed by the syntax $(command), where `command` is
    any line that you could execute on the terminal. For example we might assign the
    output of a sequence to a variable


    ```

