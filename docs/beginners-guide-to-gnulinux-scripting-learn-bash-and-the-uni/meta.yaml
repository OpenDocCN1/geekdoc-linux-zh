    > – 我曾在沃尔什夫人的英语课上坐在你旁边！《土拨鼠之日》（1993）

    > 你被正则表达式的强大功能惊到了，所以决定回来继续学习！你说是不是？我懂了，是你老板逼你学正则表达式的，但你真正的梦想是成为动作片明星。你应该考虑上点表演课。说回正题，本节课的主题是正则表达式里的「字符类」，这不是夜校课程，而是字符的集合。上一章我们学了如何在正则表达式里匹配单个特定字符，以及如何匹配任意单个字符。这两个选项非常实用，但很多时候我们需要匹配一组字符，比如数字
    1、2、3，或者 "a" 到 "f" 之间的字母。我们之前讲的两种语法都无法实现这类匹配，所以我们需要新的语法。在正则表达式中，`[<字符列表>]` 这个语法代表“字符列表中的任意单个字符”，正好能满足我们的需求。举个例子：

    ```bash

    $ cat examples.txt | grep -E "[abc]"

    ```

    这条命令会匹配单个的 "a"、单个的 "b" 或者单个的 "c"。注意：`grep` 会高亮每行中所有匹配到的元素，并打印整行内容；如果你想只打印匹配到的部分，可以使用
    `-o` 参数。比如 "dog" 这一行会被排除在输出之外，因为它不包含字符类里的任意一个字母。

    字符类尤其实用的地方在于它支持使用范围。比如：

    ```bash

    $ cat examples.txt | grep -E "[a-z]"

    ```

    这条命令会匹配所有英语字母的小写形式。这会高亮 "gorilla" 和 "aardvark" 这样的整个单词，因为它们完全由小写字母组成。而 "Johnny
    5" 不会被完整高亮，因为大写的 "J" 和数字 5 无法被这个正则表达式匹配。如果你在编辑器里用正则表达式搜索字符串（你自己探索一下常用编辑器怎么实现这个功能吧），`[a-z]`
    会匹配文本中的第一个小写字母，重复搜索就会找到第二个，以此类推。

    ```bash

    $ cat examples.txt | grep -E "[a-zA-Z]"

    ```

    这条命令会匹配任意字母，但不会匹配数字。注意：像 A-z（大写 A 到小写 z）这样的范围是能生效的，但它还会匹配到编码上位于大写和小写字母之间的其他字符，也就是
    `[`、`\`、`]`、`^`、`_` 和 `"` 这些符号。如果你需要包含这些字符，最好把它们显式添加到字符类里，因为 A-z 的语法很容易被忽略。给后来要调试你代码的人留点活路吧，Unix
    终端已经比古代魔法书还难懂了，别再让它更糟了。注意：字符类，也就是方括号（包括方括号本身）里的整个块，只是正则表达式的一个元素，它的前面或后面都可以跟其他元素。练习
    2 和 3 会帮助你实际理解这一点。

