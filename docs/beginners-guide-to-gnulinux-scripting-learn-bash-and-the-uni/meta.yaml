    ## 第17天 - 正则表达式 - 捕获组

    > _它们三人一组。_

    > *《逃出纽约》（1981）*


    哦，捕获组。我有多喜欢捕获组呢？这么说吧，肯定比喜欢披萨少，不过毕竟披萨是轻松就能赢过的好选择。好了，美食比较暂且不论，我认为捕获组是正则表达式最棒的特性之一，这既得益于它们的强大表达能力，也得益于它们引入了一种通常只有编程语言才会提供的工具：变量。接下来我们来看看为什么捕获组很重要。


    总的来说，捕获组允许你隔离正则表达式的特定部分，并在后续复用它们，但你可以复用它们的方式取决于你使用的工具。捕获组在 `sed` 中尤其有用，因为它们能大幅优化搜索替换的语法。以下代码使用
    `sed` 解析正则表达式（通过 `-r` 选项启用），用括号隔离一个捕获组，并在替换字符串中使用匹配到的模式。

    ```shell

    $ echo "10:30" | sed -r s,"([0-9]{2}).*","H:\1", H:10

    ```

    该正则表达式尝试匹配2个相邻的数字（`[0-9]{2}`），但将它们用括号放入捕获组后，`sed` 会将该值存储在变量中。在本例中，存储的值是 `10`，其余内容被可匹配任意内容的
    `.*` 忽略。如你所见，`sed` 访问搜索过程中存储的捕获组值的方式是反斜杠加数字。第一个（本例中也是唯一一个）捕获组命名为 `\1`，第二个为 `\2`，以此类推。因此，替换模式是一个以
    `H:` 开头，后接搜索过程中匹配并存储的值（即 `10`）的字符串。


    接下来我们尝试一个稍微复杂点的、包含两个捕获组的示例。

    ```shell

    $ echo "10:30" | sed -r s,"([0-9]{2}):([0-9]{2})","H:\1 - M:\2", H:10 - M:30

    ```

    ```shell

    $ echo "alpha10" | sed -r s,"([a-z]+([0-9]+))","Full code:\1 - Number:\2", Full
    code:alpha10 - Number:10

    ```

    你会发现内部捕获组 `([0-9]+)` 匹配到了数字 `10`，但外部捕获组同时匹配了字母和数字两部分，本质上相当于没有内部组的 `([a-z]+[0-9]+)`。


    在替换字符串中使用捕获组时，你不必按顺序保留它们，例如：

    ```shell

    $ echo "First,Second" | sed -r s/"(.*),(.*)/"/\2,\1"/ Second,First

    ```

    这是交换逗号分隔字符串中两个字段的非常简便的方法。嗯，也许你觉得这没那么简单，那我们一起来复盘一下。首先，我使用 `/` 来分隔搜索字符串和替换字符串，因为搜索字符串中包含逗号。第一个捕获组匹配第一个逗号之前的所有内容，之后第二个捕获组捕获剩余部分。在替换字符串中，我先输出第二个捕获组的内容，再加一个逗号，最后输出第一个捕获组的内容。


    我们也可以在 `grep` 中使用捕获组，尽管匹配值的复用显然受限于 `grep` 不会替换文本这一特性。`grep` 中捕获组的最佳用途是所谓的环视表达式，这类表达式由
    Perl 兼容正则表达式语法（PCRE）提供，通过 `-P` 开关启用，而我们之前一直使用的 `-E` 开关则是启用扩展语法（ERE）。这两种语法的差异超出了本书的讨论范围，你可以自由地在网上查阅相关资料。


    环视表达式可以提供匹配模式周边环境的信息，但不会将周边环境本身纳入匹配结果。我们来看一个例子：最简单的环视形式是正向先行断言，其中捕获组指定了字符串匹配部分之后应该出现的内容：

    ```shell

    $ cat examples.txt | grep -P "[A-Za-z ]+(?=[0-9]+)" Police 101 H2O R2-D2 Johnny
    5 Cyborg 009

    ```

    ```shell

    $ cat examples.txt | grep -oP "[A-Za-z ]+(?=[0-9]+)" Police H R D Johnny Cyborg

    ```

    正向先行断言的进阶用法是负向先行断言，由 `?!` 表示。你已经开始发现其中的规律了（提到正则表达式，这个词用得还挺贴切）。环视捕获组以 `?` 开头，后接判断条件，可以是相等（`=`）或不相等（`!`）。你还可以使用后行断言，它以
    `?<` 开头，而非以单纯的 `?` 开头。这类表达式匹配后行断言捕获组之后出现的模式，例如：

    ```shell

    $ cat examples.txt | grep -oP "(?<=[A-Z])[a-z]+" ug og olice ohnny pider an yborg
    ig ad olf ony ictures

    ```

    它会匹配所有大写字母后的小写字母，但不会将大写字母本身纳入匹配结果。这里的后行断言是 `(?<=[A-Z])`。


    提醒一下：环视表达式通常很难掌握，它的行为可能会出人意料，因为这很大程度上取决于正则引擎的实现。你刚学会使用捕获组，暂时不会遇到这么复杂的场景，但以后可能会碰到。目前请记住，正则表达式引擎还有很多重要的知识点需要学习，比如它是否是贪婪匹配。本书只是一本入门指南，因此我会假装这些问题不存在，但请记住，还有很多知识等着你去学习！


    `grep` 实际上也支持后向引用，但它的行为可能出人意料。这段代码匹配一个大写字母后接一个数字（放入捕获组）、一个横杠、另一个大写字母，以及搜索中捕获组匹配到的相同数字。像
    `R2-D3` 这样的字符串就不会匹配这个正则表达式，因为数字 `3` 和之前匹配的数字不一致。或者它不匹配可能是因为处理引擎内置了《星球大战》设定核查器！


    捕获组最后一个有趣的特性是，它允许在局部使用逻辑或运算符。我们先来看一下没有捕获组的标准正则表达式中的这个运算符。读到这里，你肯定能看懂以下正则表达式：

    ```shell

    $ cat examples.txt | grep -E "^o" ostrich ogre

    $ cat examples.txt | grep -E "a$" gorilla

    ```

    第一个匹配以字母 `o` 开头的行，第二个匹配以 `a` 结尾的行。你可以用管道 `|` 表示的逻辑或同时匹配这两种情况：

    ```shell

    $ cat examples.txt | grep -E "^o|a$" ostrich gorilla ogre

    ```

    不要被管道符号的用法搞混了。在正则表达式中，这个字符没有命令行中的含义（即连接命令），它仅代表逻辑或。这是一个强大的工具，因为它允许你同时运行多个不相关的正则表达式，而无需将它们拆分成多次执行
    `grep` 或其他工具。不过目前，这个运算符只能分隔两个完整的表达式。


    捕获组允许你在局部使用逻辑或，如以下示例所示：

    ```shell

    $ cat examples.txt | grep -E "[A-Z]([a-z]|[0-9]-)" Dug the Dog Police 101 R2-D2
    Johnny 5 Spider-Man Cyborg 009 Big Bad Wolf TM Sony Pictures

    ```

    该正则表达式匹配一个大写字母，后跟一个小写字母（Du、Cy）或者一个数字加横杠（R2-）。由于我希望横杠仅在出现数字时跟随其后，这个条件在没有或运算符、也没有捕获组支持的情况下，用单次运行是无法表达的，否则我就必须把表达式的一部分重复两遍。永远记住，重复的代码是恶习，哪怕是在正则表达式中。


    ### 练习题

    练习题！捕获组有时可能很复杂，因此检验你的知识水平总归是有益的。记住，你总是可以增量式地编写正则表达式，逐块添加并测试它们的效果（也许可以偶尔加个head限制，避免输出过多行）


