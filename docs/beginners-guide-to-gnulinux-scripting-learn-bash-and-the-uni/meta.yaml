    # Day 1 - Getting help


    > > – Help me, Obi-Wan Kenobi. You are my only hope.

    > Star Wars (1977)


    The most important part of a software is the documentation. Sadly, often our software
    doesn''t have good documentation, as "the fun" is in the code. We mostly enjoy
    developing a program that does something, not writing boring text. Fortunately
    for us, the Unix system and the people working in that environment have a great
    culture of documentation, and so the first thing you have to learn is how to find
    and read help on the commands you will learn.


    Welcome to the Unix manual pages, or *man pages* for short. Whenever you need
    help on a command you can run


    ```

    $ man <command>

    ```


    and enter a text-only (but very powerful, mind it) help system. To learn how to
    navigate the system let''s get help on a rather simple command that we will learn
    shortly, `echo`.


    ```

    $ man echo

    ```


    > > ⚠️ If you are running Linux in a Docker container and you followed the simple
    solution you will not have man pages installed in your system, so you need to
    read them at https://manpages.ubuntu.com/and the search form at the top right
    of the page.


    First of all, let me teach you some of the basic fundamentals of man page driving.
    You can move through the documentation with your arrow keys, down and up, and
    with the page down and page up keys to quickly scroll the whole page. Please note
    that, since manual pages are read-only, there is no cursor, just a current line,
    which is the topmost one.


    A nice help text at the bottom of the screen lets you know that this it


    ```

    Manual page echo(1) line 1/68 51% (press h for help or q to quit)

    ```


    Quitting programs can be surprisingly complex at times (ask any `vi` novice user),
    but man exits to the system with a simple `q` for quit. Try it, then enter the
    manual page for `echo` again. Phew! At least we won''t be trapped here forever.'
- md: 'The help system is not always that straightforward, though. There are commands
    to learn there as well. So, how do we get help… on the help? Well, as you can
    see from the bottom line while `q` stands for quit, `h` stands for help. So far
    so good, sooner or later there will be an `a` that stands for zoo, but the basic
    commands are apparently in good terms with the alphabet. If you press `h`, then,
    the screen changes and shows the meta-help, which is the help on the help. I''m
    not going through it, you can read it later. For the time being, be aware that
    if you don''t remember a command or a shortcut, you can ask the system itself
    before reading the whole Stack Overflow knowledge base looking for the answer.


    There is one important action that is worth learning now, namely searching for
    strings. Manual pages can be very long, and sometimes very boring, endlessly discussing
    details that are apparently irrelevant, while you absolutely need *that* switch
    now (most often because your system is crumbling to pieces, users are calling
    infuriated, but you still want to have the list of running processes ordered by
    CPU usage, because it''s neat). So, to search for a string in a manual page you
    tap `/` (note the bottom line waiting for your input) and type the string that
    you are looking for. Try `escape`, remember to hit `ENTER` after you typed the
    word. Well, you should have been gratified by the highlighting of the searched
    words, which is a great visual help. You can now move forward through the results
    hitting `n` (next), and backwards hitting `N` (Not the next one, the previous
    one).


    ## Exercises

    Oh yeah, there are exercises for you! My experience as a learner is that many
    times I read or listen to something, and I consider it learned, only to discover
    that when I''m alone after a while I don''t remember it very well, or that some
    parts of what was discussed are still unclear. So, my advice for you is: go through
    the exercises, even though they might seem trivial to you. Practising is always
    good, even when you are a master coder. I''m not, and if you are reading this
    book, probably you aren''t either. Which leads to… exercises!


    ### Exercise 1.01

    Enter the man page for the `echo` command and locate the `AUTHOR` (actually the
    authors). [Go to solution](#)


    ### Exercise 1.02

    Enter the man page for the `sort` command (we haven''t used it yet, but the man
    page is there). Enter the online help and locate how to `Undo (toggle) search
    highlighting` with the search pattern command. Now exit the help, search for `ignore`
    and practise the search highlighting toggle command. [Go to solution](#)


    This is enough for now. You learned how to get help about commands, so from now
    on you have a tool to become a master of the Unix shell on your own. I still believe
    it is worth following the book, though, so don''t close it now, there is a lot
    to learn that is not so easily distilled from man pages. Oh, by the way. You can
    run `man man`, which despite the name is not a tome about the human condition.
    Suggested film for the evening: Manhunter (1986) - A film about a guy who desperately
    tries to find man pages in a Unix system.


    ## Day 2 - Printing

    > – Let Polly do the printing. Jaws (1975)


    No, forget paper and toner cartridges, we are still working with a keyboard and
    a screen. In this lesson we will learn arguably the most important part of any
    programming language or computer system, that is how to print strings on the screen.
    Yes, you heard me, artificial intelligence, the most useful thing a computer can
    do is still printing something on the screen. The second thing is obviously moving
    four ghosts in a labyrinth flooded with beads that you are trying to eat.


    Jokes aside (just for this paragraph, however), printing strings on the screen
    is very important, not only because it is the simplest and occasionally the better
    way to debug programs, but also because it provides a way to give a feedback to
    the user. And nowadays, with cloud computing and global networks, it''s still
    extremely common for programmers and system administrators to interact with a
    text terminal. I personally believe that for these categories of computer users
    text terminals will never be outclassed by graphical user interfaces.


    OK, jokes can come back from the naughty step. Let''s stop rambling and finally
    print a string.

    ``` $ echo <string> ```

    Well, if you typed exactly `echo <string>` you probably got an error, because
    you should replace `<string>` with something that does not include nasty characters
    like `<` and `>`. Maybe try

    ``` echo Hello, world! ```

    Yes, I know this is plagiarism. Whatever, the command should have printed the
    string on the screen, just under the command line. Maybe you noticed that you
    didn''t need to include quotes, so why don''t you try to do it? Run

    ``` echo "hello, world!" ```

    and see what happens. The same? Yes, you are right. So, are quotes useless in
    bash? Hardly. Quotes are probably one of the worst topics in the whole bash syntax
    and generally speaking in the world of Unix scripting. Believe me, you will hate
    quotes at a certain point of your career, but don''t despair. I lived to tell
    the tale, so you will as well. Just be aware for now, that if you want to wish
    ill upon an enemy system administrator you can say "May your quotes never work".
    That is worse than a sentient evil computer that wants to rule the world. I know,
    I read too much science fiction.


    ### Exercises

    For today, before you fall asleep bored by my explanations, try these quick exercises.


    ### Exercise 2.01

    Print the string "Just a test" [Go to solution](#)


    ### Exercise 2.02

    Print a string without the trailing newline (check the manual page) [Go to solution](#)


    ### Exercise 2.03

    Run

    ``` $ echo "First line\nSecond line" ```

    What happens? Can you find a way to convert that `\n` into a newline? [Go to solution](#)


    As a final remark, to leave you with some food for thought, what happens if you
    remove the quotes from the solution of the last exercise? Now go and watch a comedy
    film, or you will have nightmares. Suggested film for the evening: Catch Me If
    You Can (2002) - A film about the dangers of becoming too skilled with printing.


    ## Day 3 - Showing the content of a file

    > – So, have a look inside. Enemy Mine (1985)


    Do you remember when I said that the second most important thing a computer can
    do is to move four ghosts in a labyrinth flooded with beads that you are trying
    to eat? I didn''t lie, it''s true. The third one, however, is to show the content
    of text files. Back in the ages when I was a teenager (the 90s, just to be clear)
    we used to exchange data on floppy disks. Yes I know, it sounds like a time where
    dinosaurs still walked on earth and men went hunting with flint spears (spoiler
    alert, these two things never happened during the same age), but it''s true. Text
    files were very important, song lyrics, programming tutorials, jokes, all these
    things came in text files. And you know what? Now, when I open a web page with
    some band lyrics and my screen is flooded by advertisements, pop-ups, cookie alerts,
    and unwanted videos I definitely miss those amazing plain dull simple text files.


    OK, enough riding the train of nostalgia. My point is that these days text files
    are... still one of the most important things in the world of computer science!
    Let''s consider this: every Web page and every computer program are, at their
    source, text files. That''s it, easily 80% of what is travelling on data networks
    these days is still a text file. So, let''s see the content of a text file, for
    once without firing up a text editor. If you followed the instructions in the
    setup section, you should have the example files in your current directory. One
    of these files is `examples.txt`, and we will use it throughout the next lessons
    to test some commands.

    ``` $ cat examples.txt ```

    You should have been glorified by the content of the `examples.txt` file, and
    you are probably wondering why things so unrelated with each other are listed
    together in a text file. Trust me, I''m not completely crazy yet, these things
    will come in handy. There is not much more to say, so far. I warned you, text
    files are not as exciting as all those pop-ups and advertisements you get on your
    browser. As this lesson was a bit short and there are not many smart exercises
    that you can run through, I will entertain you with a fun fact about `cat`. While
    it is a very appealing name for feline lovers like I am, cat actually stands for
    conCATenate. Indeed, you can name multiple file names on its command line, and
    what you will get as an output is the concatenation of their content. A side effect
    is that if you name only one file you are just asking the command to print its
    content.'
