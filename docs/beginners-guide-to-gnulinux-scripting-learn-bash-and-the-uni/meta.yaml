    \ request (for example GET or POST) followed by a space and the rest of the log\
    \ line. For each request that uses a GET print the HTTP method and everything\
    \ that follows. [Go to solution](#)\n\nMultiple matches are one of the most used\
    \ components of the regular expressions' syntax, so make sure you feel comfortable\
    \ with them. After all, they save a lot of typing, and allow to cover a great\
    \ number of cases with just a couple of symbols, so they are a good tool for your\
    \ belt. Now it's maybe time to relax, if it's evening and you are home, or to\
    \ focus on something else if you still have to begin your day. Have a great day/a\
    \ lovely evening!\n\nSuggested film for the evening: The Social Network (2010)\n\
    \n## Day 17 - Regular expressions - Groups\n> _They come in groups of threes._\
    \  \n> *Escape from New York (1981)*\n\nOh, groups. How much do I love groups?\
    \ Let's see, definitely less than pizza, but after all that's an easy win. Well,\
    \ culinary comparisons aside, I consider groups one of the best features of regular\
    \ expressions, both for their expressive power and for the fact that they introduce\
    \ a certain tool that is usually provided by programming languages only: variables.\n\
    \nLet's start considering why groups are important. Generally speaking groups\
    \ allow you to isolate specific parts of the regular expression and reuse them\
    \ later, but the way you can reuse them depends on the tool that you are using.\n\
    \nGroups are particularly useful with `sed`, as they greatly improve the search\
    \ and replace syntax. The following code uses `sed` to parse a regular expression\
    \ (enabled by the option `-r`), isolate a group with the parenthesis and use the\
    \ matched pattern in the replacement string.\n```shell\n$ echo \"10:30\" | sed\
    \ -r s,\"([0-9]{2}).*\",\"H:\\1\", H:10\n```\nThe regular expression tries to\
    \ match 2 adjacent digits (`[0-9]{2}`), but putting them in a group with the parenthesis\
    \ makes `sed` store the value in a variable. In this case the value stored is\
    \ `10`, and the rest is ignored by the `.*` that matches anything. As you can\
    \ see the way `sed` uses to access the value of groups stored during the search\
    \ is a backslash followed by a number. The first (and only, in this case) group\
    \ is named `\\1`, the second `\\2`, and so on. So, the replacement pattern is\
    \ a string beginning with `H:` and followed by the value matched and stored during\
    \ the search, that is `10`.\n\nLet's try something a bit more complex, with two\
    \ groups.\n```shell\n$ echo \"10:30\" | sed -r s,\"([0-9]{2}):([0-9]{2})\",\"\
    H:\\1 - M:\\2\", H:10 - M:30\n```\n\n```shell\n$ echo \"alpha10\" | sed -r s,\"\
    ([a-z]+([0-9]+))\",\"Full code:\\1 - Number:\\2\", Full code:alpha10 - Number:10\n\
    ```\nYou will realise that the inner group `([0-9]+)` matches the digits `10`\
    \ but the outer group matched both the letters and the digits, basically acting\
    \ as it was `([a-z]+[0-9]+)`, without the internal group.\n\nWhen you use groups\
    \ in the replacement string you are not forced to keep them in order, so for example:\n\
    ```shell\n$ echo \"First,Second\" | sed -r s/\"(.*),(.*)/\"/\\2,\\1\"/ Second,First\n\
    ```\nIs a very simple way to swap two fields in a comma-separated string. Well,\
    \ maybe you don't think it is that simple, let's review it together. First of\
    \ all I used a `/` to separate the search and replacement strings because the\
    \ search string will contain a comma. The first group matches anything but up\
    \ to the first comma, after which the second group captures the rest. In the replacement\
    \ string I print the content of the second group, then a comma, and the content\
    \ of the first group.\n\nWe can use groups in `grep` as well, even though the\
    \ reuse of the matching values is obviously limited by the fact that `grep` doesn't\
    \ replace text. The best use of groups in `grep` is with the so-called lookaround\
    \ expressions, that are provided by the Perl-compatible regular expression syntax\
    \ (PCRE), activated by the `-P` switch, as opposed to the `-E` that we used so\
    \ far, that activates the Extended syntax (ERE). The differences between these\
    \ syntaxes are outside the scope of this book, so feel free to investigate the\
    \ matter online.\n\nLookaround expressions can provide information about the surroundings\
    \ of a matching pattern without including the surroundings themselves. Let's look\
    \ at an example: the simplest form of lookaround is the positive lookahead, where\
    \ a group specifies what should follow the matching part of the string:\n```shell\n\
    $ cat examples.txt | grep -P \"[A-Za-z ]+(?=[0-9]+)\" \nPolice 101\nH2O\nR2-D2\n\
    Johnny 5\nCyborg 009\n```\n\n```shell\n$ cat examples.txt | grep -oP \"[A-Za-z\
    \ ]+(?=[0-9]+)\" \nPolice\nH\nR\nD\nJohnny\nCyborg\n```\nThe immediate evolution\
    \ of the positive lookahead is the negative lookahead, which is expressed by `?!`.\
    \ You can start to see a pattern here (apt, speaking of regular expressions).\
    \ Lookaround groups are introduced by a `?` and followed by a criteria, which\
    \ can be equality (`=`) or inequality (`!`). You can also use lookbehind expressions,\
    \ which start with a `?<` instead of starting with a simple `?`. These expressions\
    \ match patterns that follow the lookbehind group, for example:\n```shell\n$ cat\
    \ examples.txt | grep -oP \"(?<=[A-Z])[a-z]+\" \nug\nog\nolice\nohnny\npider\n\
    an\nyborg\nig\nad\nolf\nony\nictures\n```\nThat matches all the lowercase letters\
    \ that follow an uppercase one, without including the latter. The lookbehind expression\
    \ is `(?<=[A-Z])`.\n\nA warning: lookaround expressions are often difficult to\
    \ manage, and their behaviour can be surprising because it strongly depends on\
    \ the implementation of the engine. You won't hit such complex cases now that\
    \ you just learned how to use groups, but it might happen in the future. For the\
    \ time being, please keep in mind that there are important things to learn about\
    \ regular expression engines, such as if they are greedy or not. This book wants\
    \ to be a primer, so I will simply pretend those issues do not exist, but remember\
    \ that there is a lot to learn out there!\n\nBack-references are actually supported\
    \ by `grep`, but their behaviour can be surprising. The code matches an uppercase\
    \ letter followed by a digit (grouped), a dash, another uppercase letter, and\
    \ the same digit that matched in the group. A string like `R2-D3` would not match\
    \ this regular expression, because the digit `3` doesn't match the previous digit.\
    \ Or maybe it won't match because the processing engine has a Star Wars lore checker\
    \ inside!\n\nA final interesting feature of groups is that they allow to use the\
    \ OR logical operator at a local level. Let's first have a look at the operator\
    \ in a standard regular expression without groups. Having read so far, you clearly\
    \ understand the following regular expressions:\n```shell\n$ cat examples.txt\
    \ | grep -E \"^o\" \nostrich\nogre\n$ cat examples.txt | grep -E \"a$\" \ngorilla\n\
    ```\nThe first one matches the lines beginning with the letter `o`, while the\
    \ second one matches those ending with `a`. You can match both at the same time\
    \ with the logical OR represented by a pipe `|`:\n```shell\n$ cat examples.txt\
    \ | grep -E \"^o|a$\" \nostrich\ngorilla\nogre\n```\nDon't be confused by the\
    \ use of the pipe symbol. In a regular expression this character doesn't have\
    \ the meaning it has on the command line, that is to connect commands, it just\
    \ represents a logical OR. It is a powerful tool, as it allows you to run multiple\
    \ unrelated regular expressions at the same time, without forcing you to split\
    \ them into several executions of `grep` or any other tool. So far, though, the\
    \ operator can only separate two whole expressions.\n\nGroups allow you to use\
    \ the logical OR at a local level, as you can see in this example:\n```shell\n\
    $ cat examples.txt | grep -E \"[A-Z]([a-z]|[0-9]-)\" \nDug the Dog\nPolice 101\n\
    R2-D2\nJohnny 5\nSpider-Man\nCyborg 009\nBig Bad Wolf\nTM Sony Pictures\n```\n\
    The regular expression matches an uppercase letter, followed by either a lowercase\
    \ letter (Du, Cy) or a digit and a dash (R2-). As I want the dash to follow only\
    \ the digit, if present, this condition would be impossible to express in a single\
    \ run without the OR operator, and without the support of a group I would have\
    \ to repeat part of the expression twice. Always remember that duplicated code\
    \ is evil, even in regular expressions.\n\n### Exercises\nExercises! Groups can\
    \ be complex sometimes, so testing your knowledge can't but be beneficial. Remember\
    \ that you can always write regular expressions in an incremental way, adding\
    \ pieces and testing what they do (maybe adding the occasional head to avoid getting\
    \ too many output lines)\n\n#### Exercise 17.01\nExtract all the lines of `simple.log`\
    \ that contain an HTTP method GET or POST, rewrite each line in the form `<time>\
    \ <HTTP status> <HTTP method>`. The result for the first 10 lines should be:\n\
    ```\n10:05:03 200 GET\n10:05:43 200 GET\n10:05:47 200 GET\n10:05:12 200 GET\n\
    10:05:07 200 GET\n10:05:34 200 GET\n10:05:57 200 GET\n10:05:50 200 GET\n10:05:24\
    \ 200 GET\n10:05:50 200 GET\n```\n[Go to solution](#)\n\n#### Exercise 17.02\n\
    The file `simple.log` contains lines with requests concerning files like:\n```\n\
    83.149.9.216 [17/May/2015:10:05:03 GET /presentations/logstash-monitorama-2013/images/kibana-search.png\
    \ HTTP/1.1 200 203023 http://semicomplete.com/presentations/logstash-monitorama-2013/\n\
    ```\nExtract a list of all file extensions and count them. Assume that extensions\
    \ are made of lowercase letters only.\n\n[Go to solution](#)"
