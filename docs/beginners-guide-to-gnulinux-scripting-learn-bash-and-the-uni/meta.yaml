    gorilla

    ```


    The first one matches the lines beginning with the letter o, while the second
    one matches those ending with a. You can match both at the same time with the
    logical OR represented by a pipe |


    ```

    $ cat examples.txt | grep -E "^o|a$"

    ostrich

    gorilla

    ogre

    ```


    Don''t be confused by the use of the pipe symbol. In a regular expression this
    character doesn''t have the meaning it has on the command line, that is to connect
    commands, it just represents a logical OR. It is a powerful tool, as it allows
    you to run multiple unrelated regular expressions at the same time, without forcing
    you to split them into several executions of grep or any other tool.


