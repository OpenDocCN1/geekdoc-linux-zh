    ## 练习

    打印文件内容非常简单，但有几个实用的小技巧后续可能会用得上，因此这些练习将帮助你发现它们。

    ### 练习3.01

    打印`examples.txt`文件的内容并逐行编号。[跳转到答案](#)

    ### 练习3.02

