    matches exactly three adjacent lowercase letters. Is is worth noting that the
    patterns do not overlap: for example, in `elephant` the regular expression matches
    `ele` and `pha` only, and not `ele`, `lep`, `eph`, and so on. Once a pattern has
    been matched it is skipped to continue the line analysis. This is pretty clear
    if you use the `-o` option of grep that we learned previously, which outputs only
