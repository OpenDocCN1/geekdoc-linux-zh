    # Preface


    > – Begin.

    The Princess Bride (1987)


    # Who this book is for


    This book is meant for anyone who wants to be more productive in a Unix environment
    such as Linux or Mac OS. This is an introductory textbook, so the reader is supposed
    to have no previous knowledge of the subject matter, and they should expect to
    learn the most important commands and concepts they might be using daily.


    In recent years the gap between developers and system administrators has been
    fortunately reduced in various ways, all under the umbrella of the devops philosophy,
    so this book will be useful to those developers that have to start getting in
    touch with the "bare metal". These developers might find in the book a gradual
    learning curve and a quick reference for the most common commands of a Unix environment.


    On the other hand, there are people (like the author of this book) who are interested
    in the low-level side of applications development and want to pursue a career
    as system administrators or architects. For these people, this book can be a good
    starting point, where they can be introduced to tools and concepts they will use
    every single day. They will probably soon feel the need of something more complete
    and deeper, and there are tons of books and resources that can quench the thirst
    for knowledge, but I hope they will enjoy the first steps that they will move
    together with me.


    # Why this book exists


    When I decided to write this book I was working on a series of short workshops
    for my junior colleagues. I hadn''t worked with juniors for many years, and while
    I was perfectly conscious that some people didn''t grow up with a command line,
    practically speaking I was assuming that they knew what I did, which is probably
    a mistake that many advanced programmers make.


    So, I decided to run some sessions in which we discovered the bash shell, starting
    from the simplest commands up to some proper scripting. I was rewarded (and I
    still am) by a lot of satisfied smiles when they finally got the right sequence
    of pipes or when they discovered regular expressions. From those sessions, and
    from the notes that I wrote to prepare them, I had the idea of a book that could'
- md: 'be easily followed, maybe in one''s spare time, as nowadays it''s always very
    complex for people to find time to study big tomes. I usually avoid trying to
    be funny when writing or speaking in English; it''s not my native language, so
    I lack the vocabulary and the comedic timing. But a thing that I learned many
    years ago is that a laugh helps people to remember what was said, so this time
    I decided to try with a light-hearted approach. I hope this will ease the read
    and make your journey into the Unix world more comfortable. If it doesn''t work,
    I apologise in advance. You can always go and get some ancient tome of dark magic
    like "The Unix Bible". I''m pretty sure you will remember for years the moment
    in which you''ll manage to conjure some sort of multi-tentacular Lovecraftian
    horror, but I''m not sure this will have a significant impact on your career.
    If we exclude the fact that it will probably put an end to it.


    ## Why you should read this book

    If you are a programmer, nowadays you probably got in touch with Open Source software,
    with version control system like Git, with cloud services like AWS, with some
    dynamic language like Python or Ruby. What do all these things have in common?
    Many things probably, but one of them is definitely that they are rooted in the
    Unix world.[^1]


    That of Unix is a rich world, and this book will not even scratch the surface.
    But one of the most powerful things Unix systems have is the command line. Yes,
    in 2019, with AIs constantly processing everything we search and do online, mobile
    phones with perfect user interfaces, and proper virtual reality around the corner,
    the good old green-on-black terminal still has something to say. More than something!
    The command line is a tool that I think will never get too old to be useful. I
    am happy when the GUI of some program is simple and well designed, but there is
    simply nothing that can give you more power than the command line. So, long story
    short, you should definitely learn at least the fundamentals of the command line!


    ## Who should not read the book

    To put it simply, this is a primer, so if you are an advanced Unix user you should
    stop reading here. This book is not for you. If you decide to go on, however,
    please consider that this wants to be an introduction to Unix for people who never
    heard of it. Yeah, I know it sounds incredible that people can use a computer
    without a terminal and that they can survive day by day thinking that pipes convey
    water and that sockets can be found on walls, but this is why I believe a book
    like this can be useful.


    To be fair, if you want to introduce a novice to Unix in 2019 you have to face
    50 years of history and a legacy of countless choices that sound perfectly reasonable
    to people who grew up into them. There are at least two widespread implementations
    of it, Linux and Mac OS X, the first of which comes in dozens of different flavours
    (distributions) and the second of which behaves in all sorts of unexpected ways.
    So, I had to compromise. In particular, dear expert nitpicker, you will notice
    that I use the terms "Unix", "Unix shell", "bash", "terminal" as synonyms. And
    believe me, I cringe every time I do it. But, to be honest, this book wants to
    be a primer for people who don''t know anything about what is arguably a niche
    subject. And my experience tells me that the best way to dishearten someone is
    to make them feel stupid, flooding the conversation or the lesson with tons of
    terms they never heard and that they do not understand. Sure, this makes you shine,
    but what''s the point? So, sorry. I know the nomenclature in the book is all but
    accurate, and I hope that novices will come back to this book after some years,
    smiling at the levity with which I desecrated the holy ground of Unix.


    ## The prompt

    The command line always prints a fixed string in front of each line when waiting
    for input. This is aptly called *prompt*. The prompt is highly customisable, as
    it is an invaluable source of information to have handy. My prompt, for example,
    typically contains the full path of the directory I''m in at the moment so that
    I have a clear idea of my position at any time. Many people add the current time,
    or the Git branch they are in at the moment. Since the prompt changes from system
    to system, and from user to user, it is custom to represent it with a dollar sign
    $. So this

    ```

    $ command --option value --another-option another-value

    ```

    means that you are supposed to type the string from `command`, as the $ is already
    there in some form on your terminal. I will often show the output of the command
    as it appears on the terminal, just under the prompt, like this

    ```

    $ command --option value --another-option another-value

    output line 1

    output line 2

    output line 3

    output line 4

    output line 5

    ```

    I will include the output of the command when it is relevant for the explanation
    and generally when it is not too long. The idea of the book is that the reader
    should test the commands on their terminal, so I consider it pointless to fill
    pages with output that nobody will ever read. When I need to truncate the output
    I will include an ellipsis between square brackets as in the following example

    ```

    $ command --option value --another-option another-value

    output line 1

    output line 2

    output line 3

    [...]

    ```

    If you fancy some historical information, the dollar sign used for the prompt
    was apparently first introduced in Version 7 Unix, released in 1979 by Bell Labs,
    as that was the first version to be shipped with the Bourne shell. So much for
    long-lasting choices!


    ## Discrimination of fruit-labelled products

    Mac OS is the Unix-like operating system with the largest desktop user base among
    programmers, as many have an Apple notebook as their primary device. I''m not
    one of them, and I was very surprised to find out that the shell provided by Mac
    OS is only partially compatible with the traditional bash shell provided by Linux
    distributions. In particular, the core utilities of Mac OS are not the GNU ones,
    so many command line options are not present, or different. As I want to publish
    this book before I retire, I will go for the simplest solution. I won''t provide
    examples or explanations for the Mac OS terminal, I''m sorry. If you are using
    a Mac, either for your personal choice or because of some external constraint,
    you will have to look for some specific solutions online. For the time being,
    I will provide instructions to run a Linux machine in a Docker container, so everybody
    can follow the lessons and enjoy the book. Maybe in the future I will provide
    some coverage of non-GNU versions of the standard utilities, but now this is too
    complex a task for me. Despite the mocking tone, I''m really sorry I can''t provide
    instructions for every case! The good news is that, while the single commands
    have different options the overall concepts are the same, so reading the book
    and learning how to use commands, how to find help on them and how to compose
    them in scripts will be extremely useful even for Mac OS users.


    ## Why this book comes for free

    The first reason I started writing a technical blog was to share with others my
    discoveries, and to save them the hassle of going through processes I had already
    cracked. Moreover, I always enjoy the fact that explaining something forces me
    to better understand that topic, and writing requires even more study to get things
    clear in my mind, before attempting to introduce other people to the subject.
    Much of what I know comes from personal investigations, but without the work of
    people who shared their knowledge for free I would not have been able to make
    much progress. The Free Software Movement didn''t start with Internet, and I got
    a taste of it during the 80s and 90s, but the World Wide Web undeniably gave an
    impressive boost to the speed and quality of this knowledge sharing. So this book
    is together with other things that I wrote, a way to say thanks to everybody who
    gave their time to write blog posts, free books, software, and to organise conferences,
    groups, meetups. This is why I teach people at conferences, this is why I write
    a technical blog, this is the reason behind this book. That said, if you want
    to acknowledge the effort with money, feel free. Anyone who publishes a book or
    travels to conferences incurs expenses, and any help is welcome. However the best
    thing you can do is to become part of this process of shared knowledge; experiment,
    learn and share what you learn.


    ## Submitting issues or patches

    This book is not a collaborative effort. It is the product of my work, and it
    expresses my personal view on some topics, and also follows my way of teaching.
    Both can definitely be improved, and they might also be wrong, so I am open to
    suggestions, and I will gladly receive any report about mistakes or any request
    for clarifications. Feel free to use the GitHub Issues of the [book repository][2].
    I will answer or fix issues as soon as possible, and if needed I will publish
    a new version of the book with the correction. Thanks!


    ## About the author

    My name is Leonardo Giordani, I was born in Italy in 1977. That year gave to the
    world also Star Wars, bash, Apple ][, BSD, Dire Straits, The Silmarillion. I''m
    interested in operating systems and computer languages, photography, fantasy and
    science fiction, video and board games, guitar playing, and (too) many other things.
    I studied and used several programming languages, from the Z80 and x86 Assembly
    to Python and Scala. I love mathematics and cryptography. I''m mainly interested
    in open source software, and I like both the theoretical and practical aspects
    of computer science. For 13 years I was a C/Python programmer and devops for a
    satellite imagery company and I am currently infrastructure engineer at [WeGotPOP][3],
    a UK company based in London and New York that creates innovative software for
    film productions. In 2013 I started publishing some technical thoughts on my blog,
    [The Digital Cat][4]. In 2018 I published my first book with Leanpub, [Clean Architectures
    in Python][5], which at the time of writing has been already downloaded more than
    10,000 times.


    [2]: https://github.com/bgutbook/bgutbook/issues

    [3]: https://www.wegotpop.com

    [4]: http://thedigitalcatonline.com

    [5]: https://leanpub.com/clean-architectures-in-python/'
  mdcn: ' 读起来会很容易，甚至可以利用碎片时间进行，毕竟如今人们很难找出时间来啃厚厚的巨著。我用英语写作或演讲时通常会避免刻意搞笑——它不是我的母语，所以我既缺乏相关的词汇储备，也摸不准喜剧的节奏。但多年前我学到的一点是，笑声能帮助人们记住所说的内容，所以这次我决定尝试轻松一点的风格。希望这能减轻阅读负担，让你进入Unix世界的旅程更轻松。如果效果不好的话，我提前道歉。你也可以去找一些像《Unix圣经》那样的黑魔法古籍。我很确定，当你成功召唤出某种多触手的洛夫克拉夫特式恐怖存在时，这个画面会在你记忆里留存很多年，但我不确定这会对你的职业生涯有什么实质性影响——除非我们考虑它大概率会直接终结你的职业生涯这个因素。


    ## 你为什么应该读这本书

    如果你是程序员，现如今你可能已经接触过开源软件、Git这类版本控制系统、AWS这类云服务，还有Python或Ruby这类动态编程语言。这些东西的共同点是什么？可能有很多，但其中一个是肯定的：它们都植根于Unix世界。[^1]
    Unix的世界非常丰富，这本书甚至连它的皮毛都碰不到。但Unix系统最强大的功能之一就是命令行。没错，在2019年，面对无时无刻不在处理我们线上搜索和操作内容的人工智能、拥有完美界面的手机，以及即将到来的成熟虚拟现实技术，那套老派的绿字黑底终端依然有其不可替代的价值。不，远不止有价值！在我看来，命令行是一种永远不会过时、永远有用的工具。看到某个程序的图形界面简洁又好用时我会很开心，但能带来比命令行更高效能的东西根本不存在。所以长话短说，你绝对有必要至少学懂命令行的基础知识！


    ## 这本书不适合谁读

    简单来说，这是一本入门读物，所以如果你已经是资深Unix用户，可以在这里停读了。这本书不是为你准备的。但如果你还是决定往下看，请明白这本书是写给完全没听说过Unix的人做入门介绍的。我知道，在如今这个时代，居然有人用电脑都不用终端，还能日复一日地以为管道是输水的、插座是装在墙上的，这听起来很不可思议，但正是如此，我才觉得这样一本书是有用的。平心而论，2019年要给新手介绍Unix，你不得不面对50年的历史，还有无数在成长过程中浸淫其中的人觉得理所当然的选择遗产。目前至少有两大主流实现：Linux和Mac
    OS X，前者有几十种不同的发行版，后者的行为方式更是各种意想不到。所以我不得不做一些妥协。尤其是亲爱的专家挑刺党，你会注意到我把“Unix”“Unix shell”“bash”“terminal”这几个术语当成了同义词使用。相信我，每次这么做我都觉得浑身别扭。但说实话，这本书是写给对这门小众学科一无所知的人做入门的。而我的经验告诉我，打击一个人信心最好的方式，就是让他觉得自己很蠢——往对话或课程里塞一堆他从来没听过、也听不懂的术语，以此凸显自己的博学。没错，这样你确实能闪闪发光，但意义何在？所以抱歉了。我知道书里的术语命名远不够准确，也希望新手们几年后再回看这本书时，能笑着原谅我如此轻慢地亵渎了Unix这片神圣领地的行为。


    ## 提示符

    命令行在等待输入时，总会固定地在每一行前面打印一段字符串，这段字符串被恰如其分地称为*提示符*。提示符的可定制性非常高，因为它能随时提供非常有价值的信息。比如我的提示符通常会包含我当前所在目录的完整路径，这样我随时都能清楚自己的位置。很多人还会加上当前时间，或者自己当前所在的Git分支。因为不同系统、不同用户的提示符都不一样，所以大家习惯用美元符号$来代表它。所以下面这段代码：

    ```

    $ command --option value --another-option another-value

    ```

    意味着你需要输入`command`后面的字符串，因为$对应的提示符在你的终端里本来就已经存在了。我经常会按照终端里的实际显示，把命令输出放在提示符正下方展示，就像这样：

    ```

    $ command --option value --another-option another-value

    output line 1

    output line 2

    output line 3

    output line 4

    output line 5

    ```

    只有和解释相关、且长度不会太长的命令输出我才会收录。这本书的核心理念是让读者在自己的终端上测试命令，所以我觉得往书里塞满没人会看的输出纯粹是浪费篇幅。当我需要截断输出时，会加上方括号包裹的省略号，示例如下：

    ```

    $ command --option value --another-option another-value

    output line 1

    output line 2

    output line 3

    [...]

    ```

    如果你对历史感兴趣的话，用来做提示符的美元符号最早出现在1979年贝尔实验室发布的Unix第7版中，因为这是首个搭载Bourne shell的版本。所谓的长久选择，不过如此！


    ## 水果标签产品的歧视

    在程序员群体中，Mac OS是桌面用户基数最大的类Unix操作系统，因为很多人的主力设备都是苹果笔记本。我并不是其中一员，而且我当初发现Mac OS自带的shell和Linux发行版提供的传统bash
    shell仅部分兼容时，也非常惊讶。尤其是Mac OS的核心工具链不是GNU系的，所以很多命令行选项要么不存在，要么和Linux上的不一样。因为我打算在退休前把这本书出版，所以我就选了最简单的方案：很抱歉，我不会为Mac
    OS的终端提供示例或讲解。如果你正在用Mac，不管是自己选的还是有什么外部限制，你都只能去网上找专门的解决方案。目前我会提供在Docker容器里运行Linux机器的教程，这样所有人都能跟着学习、享受这本书的内容。说不定未来我会补充标准工具链非GNU版本的讲解，但现在的任务对我来说太复杂了。尽管我上面语气调侃，但我真的很抱歉没法覆盖所有情况！好消息是，虽然单个命令的选项可能不同，但整体概念是一致的，所以哪怕你是Mac
    OS用户，读这本书学习怎么用命令、怎么查命令帮助、怎么把命令组合成脚本，也会大有裨益。


    ## 为什么这本书是免费的

    我开始写技术博客的第一个原因，就是和别人分享我的发现，帮他们省去重复走我已经趟过的路的麻烦。而且我一直觉得，解释某件事会迫使你更深入地理解它，而写作需要在向别人介绍之前，先在脑子里把问题彻底理清楚，这甚至需要更多的学习。我掌握的东西很多都来自个人探究，但如果没有那些免费分享自己知识的人的努力，我根本不会有太大进步。自由软件运动并不是随着互联网诞生的，我在80、90年代就接触过它，但万维网无疑极大提升了知识共享的速度和质量。所以这本书，还有我写的其他东西，都是我想对所有花时间写博客文章、免费书籍、软件，还有组织会议、社群、线下聚会的人说声谢谢的方式。这就是我为什么会在会议上给人讲课，为什么写技术博客，也是这本书诞生的原因。话虽如此，如果你愿意用金钱表达对我付出的认可，也完全没问题。出书、飞去参加会议都要花钱，任何帮助都欢迎。不过你能做的最好的事，就是加入这个知识共享的流程：实践、学习，再分享你学到的东西。


    ## 提交问题或补丁

    这本书并非集体协作的产物。它是我个人工作的成果，表达了我对部分话题的个人看法，也遵循我的教学方式。这两点当然都有进步空间，也可能存在错误，所以我欢迎任何建议，也很乐意收到任何错误报告或澄清请求。你可以随意使用[本书仓库][2]的GitHub
    Issues功能提交内容。我会尽快回复或修复问题，如有需要，我会发布包含修正内容的新版本。谢谢！


    ## 关于作者

    我叫莱昂纳多·乔尔达尼，1977年出生于意大利。那一年世界上诞生的还有《星球大战》、bash、Apple ][、BSD、恐怖海峡乐队（Dire Straits）、《精灵宝钻》。我对操作系统和编程语言、摄影、奇幻与科幻作品、电子游戏和桌游、吉他演奏，还有（太多）其他事物都很感兴趣。我学习并使用过多种编程语言，从Z80和x86汇编到Python和Scala都有涉猎。我热爱数学和密码学。我主要关注开源软件，喜欢计算机科学的理论和实践两个层面。我曾在一家卫星图像公司做了13年的C/Python程序员和DevOps工程师，目前任职于[WeGotPOP][3]，这是一家总部位于伦敦和纽约的英国公司，为电影制作行业开发创新软件。2013年我开始在自己的博客[数字之猫][4]上发布一些技术思考。2018年我在Leanpub出版了自己的第一本书[《Python整洁架构》][5]，截至写作时，这本书的下载量已经超过了1万次。


    [2]: https://github.com/bgutbook/bgutbook/issues

    [3]: https://www.wegotpop.com

    [4]: http://thedigitalcatonline.com

    [5]: https://leanpub.com/clean-architectures-in-python/

