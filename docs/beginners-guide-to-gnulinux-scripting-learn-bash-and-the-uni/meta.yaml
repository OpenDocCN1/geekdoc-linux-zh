  md: '# Preface


    > – Begin.

    The Princess Bride (1987)


    # Who this book is for


    This book is meant for anyone who wants to be more productive in a Unix environment
    such as Linux or Mac OS. This is an introductory textbook, so the reader is supposed
    to have no previous knowledge of the subject matter, and they should expect to
    learn the most important commands and concepts they might be using daily.


    In recent years the gap between developers and system administrators has been
    fortunately reduced in various ways, all under the umbrella of the devops philosophy,
    so this book will be useful to those developers that have to start getting in
    touch with the "bare metal". These developers might find in the book a gradual
    learning curve and a quick reference for the most common commands of a Unix environment.


    On the other hand, there are people (like the author of this book) who are interested
    in the low-level side of applications development and want to pursue a career
    as system administrators or architects. For these people, this book can be a good
    starting point, where they can be introduced to tools and concepts they will use
    every single day. They will probably soon feel the need of something more complete
    and deeper, and there are tons of books and resources that can quench the thirst
    for knowledge, but I hope they will enjoy the first steps that they will move
    together with me.


    # Why this book exists


    When I decided to write this book I was working on a series of short workshops
    for my junior colleagues. I hadn''t worked with juniors for many years, and while
    I was perfectly conscious that some people didn''t grow up with a command line,
    practically speaking I was assuming that they knew what I did, which is probably
    a mistake that many advanced programmers make.


    So, I decided to run some sessions in which we discovered the bash shell, starting
    from the simplest commands up to some proper scripting. I was rewarded (and I
    still am) by a lot of satisfied smiles when they finally got the right sequence
    of pipes or when they discovered regular expressions. From those sessions, and
    from the notes that I wrote to prepare them, I had the idea of a book that could'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'be easily followed, maybe in one''s spare time, as nowadays it''s always very
    complex for people to find time to study big tomes.


    I usually avoid trying to be funny when writing or speaking in English; it''s
    not my native language, so I lack the vocabulary and the comedic timing. But a
    thing that I learned many years ago is that a laugh helps people to remember what
    was said, so this time I decided to try with a light-hearted approach. I hope
    this will ease the read and make your journey into the Unix world more comfortable.


    If it doesn''t work, I apologise in advance. you can always go and get some ancient
    tome of dark magic like "The Unix Bible". I''m pretty sure you will remember for
    years the moment in which you''ll manage to conjure some sort of multi-tentacular
    Lovecraftian horror, but I''m not sure this will have a significant impact on
    your career. If we exclude the fact that it will probably put an end to it.


    # Why you should read this book


    If you are a programmer, nowadays you probably got in touch with Open Source software,
    with version control system like Git, with cloud services like AWS, with some
    dynamic language like Python or Ruby. What do all these things have in common?
    Many things probably, but one of them is definitely that they are rooted in the
    Unix world.[^1]


    That of Unix is a rich world, and this book will not even scratch the surface.
    but one of the most powerful things Unix systems have is the command line. Yes,
    in 2019, with AIs constantly processing everything we search and do online, mobile
    phones with perfect user interfaces, and proper virtual reality around the corner,
    the good old green-on-black terminal still has something to say. More than something!


    The command line is a tool that I think will never get too old to be useful. I
    am happy when the GUI of some program is simple and well designed, but there is
    simply nothing that can give you more power than the command line.


    So, long story short, you should definitely learn at least the fundamentals of
    the command line!


    # Who should not read the book


    To put it simply, this is a primer, so if you are an advanced Unix user you should
    stop reading here. This book is not for you. If you decide to go on, however,
    please consider that this wants to be an introduction to Unix for people who never
    heard of it. Yeah, I know it sounds incredible that people can use a computer
    without a terminal and that they can survive day by day thinking that pipes convey
    water and that sockets can be found on walls, but this is why I believe a book
    like this can be useful.'
