    #### Solution

    According to the man page of `cat` the `-n` option numbers all output lines. So

    ```

    $ cat -n examples.txt

    1 dog

    2 cat

    3 elephant

    4 ostrich

    5 Dug the Dog

    [...]

    ```

    gives the desired result.

