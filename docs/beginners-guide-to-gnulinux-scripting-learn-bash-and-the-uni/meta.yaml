    ## 第 2 天 - 打印输出

    > – 让波利来负责打印吧。《大白鲨》（1975）

    不，忘了打印机和墨盒吧，我们现在还在用键盘和屏幕打交道。这节课我们将学习任何编程语言或计算机系统中可以说最重要的部分：如何在屏幕上打印字符串。你没听错，人工智能再发达，计算机能做的最有用的事还是往屏幕上打印内容。第二有用的事显然是操控四个幽灵在满是豆子的迷宫里转，还得让你吃豆子。

    开个玩笑（仅限这段哦），在屏幕上打印字符串非常重要，不仅因为这是调试程序最简单、偶尔也是最有效的方式，还因为它能给用户提供反馈。而且现在有了云计算和全球网络，程序员和系统管理员和文本终端交互仍然非常普遍。我个人认为，对这些计算机用户来说，文本终端永远都不会被图形用户界面淘汰。

    好了，玩笑可以回到罚站台阶上待着了。我们别再闲扯了，赶紧来打印个字符串吧。

    ``` $ echo <string> ```

    嗯，如果你直接输入了 `echo <string>`，大概率会报错，因为你要把 `<string>` 替换成不含 `<` 和 `>` 这种特殊字符的内容。试试运行：

    ``` echo Hello, world! ```

    我知道这是抄袭别人的经典示例，无所谓，这个命令应该已经把字符串打印在命令行下方了。你可能注意到了，刚才不用加引号也能运行，那不如试试加引号？运行 ``` echo
    "hello, world!" ``` 看看结果，是不是一样？没错，你说得对。

    那么，引号在 Bash 里没用吗？当然不是。引号可以说是整个 Bash 语法乃至 Unix 脚本领域里最头疼的话题之一。相信我，你职业生涯里某段时间肯定会恨死引号，但别绝望。我能活下来给你讲这些，你也可以的。

    现在你只需要知道一点：如果你想诅咒某个系统管理员，甩一句“愿你的引号永远用不了”就够了。这比一个有自我意识、想统治世界的邪恶计算机还狠毒。我知道，我科幻小说看太多了。


