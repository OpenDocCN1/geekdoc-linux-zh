    #### Exercise 1.02

    Enter the man page for the `sort` command (we haven''t used it yet, but the man
    page is there). Enter the online help and locate how to `Undo` (`toggle`) `search`
    `highlighting` with the search pattern command. Now exit the help, search for
    `ignore` and practise the search highlighting toggle command.

    #### Solution

    Run the command

    ```

    $ man sort

    ```

    Inside the man page press `h` for the online help, then press `/` to search for
    a pattern, type `Undo` and press Enter. The first (and actually only) occurrence
    is

    ```

    ESC-u Undo (toggle) search highlighting.

    ```

    Now exit the help with q, hit `/`, type `ignore` and Enter. This highlights the
    occurrences. Now press ESC and then u. You don''t need to keep ESC pressed, just
    hit ESC and then hit u, and the highlighting should disappear. Press ESC-u again
    and the highlighting should reappear. Now exit the help with q.

    [Go back to the exercise](#)


    ## Day 2 - Printing

    ### Solutions to exercises

    #### Exercise 2.01

    Print the string "Just a test"

    #### Solution

    ```

    $ echo "Just a test"

    Just a test

    ```

    As we discussed in the chapter this can also be solved running

    ```

    $ echo Just a test

    Just a test

    ```

    but I believe the first solution is better. It is immediately clear which part
    of the command is the string and later, when we will create scripts in an editor,
    strings between quotes are highlighted.

    [Go back to the exercise](#)


    #### Exercise 2.02

    Print a string without the trailing newline (check the manual page)

    #### Solution

    Open the man page for `echo` and search for the pattern `trailing newline`. You
    should find that

    ```

    -n    do not output the trailing newline

    ```

    So, if you run

    ```

    $ echo -n "Just a string"

    Just a string$

    ```

    You should get the string immediately followed by the prompt, as you can see above.
    This is useful when you want to give the user some feedback on a running process
    like a for loop, and you want to print a single character like for example a dot.
    Inside the loop you want to print those characters without the newline to keep
    them on the same output line.

    > [Go back to the exercise](#)

    ________________________________________________


    #### Exercise 2.03

    Run

    ```

    $ echo "First line\nSecond line"

    ```

    What happens? Can you find a way to convert that `\n` into a newline?

    #### Solution

    When you run the given command you get as an output the literal string `First
    line\nSecond line`. The `\n` sequence is used in Unix systems to indicate a newline,
    and apparently `echo` doesn''t understand it out of the box. This is because,
    by default `echo` ignores *backslash escapes* like `\n`. In the programming world,
    an *escape* is a way to avoid the default interpretation of some character and
    to signal the language that we give it a special meaning. In this case, if echo
    encounters an `n`, it would just print out the character `n`, while we want to
    use it in a special way. Long story short, if you search for backslash in the
    man page of `echo`, you will find that it supports the `-e` flag to enable interpretation
    of backslash escapes, so you can run `echo -e "First line\nSecond line"` to get
    the two lines printed on separate lines.

    [Go back to the exercise](#)


