    #### Exercise 3.02

    Check if the file `examples.txt` contains spaces at the end of any line.

    #### Solution

    According to the man page of `cat` the `-E` option displays `$` at the end of
    each line. So

    ```

    $ cat -E examples.txt

    dog$

    cat$

    elephant$

    ostrich$

    Dug the Dog$

    [...]

    ```

    shows you that each line terminates with a $ immediately after the text, so there
    are no nasty "invisible" spaces. Later in the book we will learn how to check
    this without having to manually look at each line.

