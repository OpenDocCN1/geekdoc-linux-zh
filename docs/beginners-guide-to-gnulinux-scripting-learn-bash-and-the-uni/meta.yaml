    ## Day 6 - 打印指定行

    > – *你已被列为清除目标。* 《终结者》（1984）

    今天我要给你介绍一位朋友，它的名字叫sed。它的全称其实是Stream EDitor（流编辑器），但没几个人记得这个全称，它自己也不怎么在意。实际上你只有叫它的昵称时它才会回应。总之，这是一个威力极强的命令，但目前我还没法完全展示它的能力，怕你还没意识到它能给你的工作带来多大帮助。所以接下来我们只会探索它众多功能中的一项，很可能还是最不起眼的那项：打印行。

    我们常遇到的问题就是打印文本中的指定行。之前我们学了用`head`和`tail`分别打印文件开头或结尾的若干行，但如果我们想打印文件中间某处的行该怎么办呢？

    一种可行的解决方案要用到管道。如果你运行

    ``` $ head -n 5 slices.txt | tail -n 1 ```

    你其实是让`head`显示文件的前5行，再用`tail`过滤这个输出，取最后一行，最终就能拿到第5行的内容。目前看来没问题，但只是为了打印第5行就这么折腾，是不是太绕了？

    确实，`sed`也是这么想的，所以它提供了更简单的方式来实现：

    ``` $ sed -n 5p slices.txt ```

    我知道，我知道。你觉得提到“简单”的时候，`sed -n 5p`肯定不是第一个浮现在你脑海里的命令。不过无论如何，我希望你至少同意：只用一个命令总比要把两个命令用管道连起来要好。

    你的新朋友`sed`也支持从管道接收输入，所以任何时候你想查看指定行，都可以把当前命令通过管道传给它。我们后面在书里会看到相关示例。我说过`sed`极其强大，难道它只能打印单行吗？当然不是，它完全可以打印一段连续的行，你只需要提供起始行和结束行，用逗号分隔就行：

    ``` $ sed -n 3,8p slices.txt ```

    这条命令会打印给定文件的第3到第8行。

    还不满足？好吧，`sed`还可以从指定行开始打印若干行。这个功能经常能帮我避免让大家发现我数学很差的尴尬。

    ``` $ sed -n 3,+5p slices.txt ```

    这条命令的输出和上一条一样，因为它从第3行开始，打印该行以及之后的5行，总共6行。注意哦，`sed`这里不是打印从第3行开始的5行，而是6行。我觉得你大概率还是得用到数学技能。

    你发现我上次没给你留练习吧？肯定发现了。那这节课也不留练习了，你只要多练练打印行，试着习惯这个奇怪的语法就行。昨天我用一堆奇怪符号让你头疼，今天希望能重获你的信任。咱们今天就收尾吧，有新电影等着你看，还有薯片。记得往冰箱里放几瓶啤酒，一瓶给你，一瓶给你新朋友sed。顺便也给猫喂点吃的吧，可怜的小家伙。

    > 今晚推荐的电影：《窃听大阴谋》（1974）—— 这位Unix程序员在查看对话日志时发现，只拿单行内容未必是最佳选择。


    ## Day 7 - 序列与计数

    > – 编码序列一旦确立，就无法修改。《银翼杀手》（1982）

    今天咱们稍微放松点，最近学的东西太多了，是时候学点简单直白的内容了。那我们来讲讲网络系统中的分布式共识？哈哈开玩笑的，那玩意儿可一点都不简单。好吧，换个话题：你觉得序列有用吗？我觉得它特别实用，比如你要重命名文件，想给它们排个序的时候，不管什么用途，Unix都提供了一个特别好用的命令来生成整数序列，名字取得也很贴切，叫`seq`。

    注：我一直拿不准`seq`的正确发音。作为意大利人，我倾向于把它读成“sec”，但如果你想读成别的我也能理解。你也可以拼读它，好处是如果你语气到位的话，会听起来像战场上的前线军官。

    它的基础用法非常简单，你只要指定一个大于1的数字，`seq`就会输出从1到这个数字之间的所有整数。

    ``` $ seq 10 ```

    现在这个功能很实用，但有时候你需要计算两个指定数字之间的数，比如你想包含0，或者你就是想从42开始计数（42本来就是很好的初始值嘛）。这种情况下你只要给`seq`传起始值和结束值就行：

    ``` $ seq 4 11 ```

    ``` $ seq 4 -1 -5 ```

    这条命令会输出整数序列`4, 3, 2, ... -4, -5`。如你所料，你可以随意指定步长，比如用`2`来跳过奇数，或者满足其他任意需求，例如：

    ``` $ seq 1 2 10 ```

    如你在man手册中所见，`seq`命令也有一些命令行选项。其中`-w`参数特别实用，它会在数字前补足够多的`0`，让所有数字长度保持一致。比如：

    ``` $ seq -w 1 10 ```

    这条命令会给1到9的数字前补一个`0`，让它们的长度和最后一个数字`10`保持一致。这在程序员精英圈里叫左补零，不过我打赌你说zero left padding，大家也都能听懂。

    现在喊一句「发射左补零序列！」，告诉我你难道不会觉得自己像某部日本动画里的机甲驾驶员吗？我反正觉得超酷的。

    今天要学的另一个实用又简单的功能是统计元素数量。当你需要知道文件或某条命令的输出里有多少行、多少个词、多少个字符时，`wc`就是你的好帮手。虽说这个名字起得一般，它是“word
    count（词数统计）”的缩写，用久了你就习惯了，再也不会让你联想到什么私人空间之类的奇怪东西了。

    虽然名字是词数统计，但`wc`能统计好多不同的内容，其中最有用的就是行数和字符数。我们来用`seq`测试下行数统计，加上`-l`参数可以让`wc`只输出行数：

    ``` $ seq 1 10 | wc -l

    10 ```

    这个工具在统计字符串字符数的时候也特别好用：

    ``` $ echo "This is a test" | wc -c

    15 ```

    等等……15？我数着包括空格才14个啊，怎么回事？哦对了，你知道`echo`会在字符串末尾加个换行符吧？那个换行符是不可打印的特殊字符，所以`wc`会多算1。之前我们提过`echo`的`-n`参数可以禁止添加换行，用上之后就能得到正确的结果：

    ``` $ echo -n "This is a test" | wc -c

    14 ```


