    ## Day 4 - Beginnings and ends

    > – *Come, let''s begin.*

    > – *We ended in F major.*

    > Amadeus (1984)


    Many times people don''t read long messages. You should be careful when you send
    emails, for example. If they are too long people tend to read the beginning and
    then skip the central part and read the end. That is, if the core of the message
    was the final result of your 20 years long research on time travel which shows
    how to build a time machine out of a dishwasher, it is lost. Gone. Sorry, you
    should have been more concise.


    While this might be a bad habit people have, reading the initial and the final
    part of some stream of data comes in handy very often. For example, we might want
    to list files in order of size and then get the top 5 ones, or we might want to
    print out the last 10 log messages of your system, just to keep an eye on what
    is happening.


    Well, Unix provides two nice commands to perform those actions, namely `head`
    and `tail`. You should be able to tell which is which from the name, which is
    a very nice thing their authors did for us.


    When you run

    ```

    $ head <file>

    ```

    the system will show you by default the first 10 lines of the file. You can try
    this and the following examples on the `slices.txt` file provided in the examples
    repository. That file is just a sequence of numbered lines, from 1 to 20, so that
    you can easily check if what you did is correct. So `head slices.txt` should show
    you lines 1-10.


    Conversely, if you run `tail slices.txt` you will get lines 11-20, that is the
    last 10 ones of the file. Ten lines are usually a good amount of content if you
    want to have a quick look into a file, maybe to just have a glimpse of how the
    content is structured, but you might want to print less or more lines.


    This can be done in both commands with the `-n` switch followed by the amount
    of lines that you want. That is, `head -n3 slices.txt` will print the first 3
    lines of the file. Please note an important thing about the Unix command line:
    switches and their values can be optionally separated by spaces, so executing
    `head -n3 slices.txt` or `head -n 3 slices.txt` gives you the very same result.
    You can also add more than one space between the switch and the value, if this
    makes you happy, but when we will start dividing the text in columns you will
    not be that happy anymore about multiple spaces, so maybe just don''t do it. Friendly
    advice.


    ## Exercises

    There are some exercises that I can leave to you about `head` and `tail`. All
    exercises can be performed on the `slices.txt` example file, to get an immediate
    feedback from the numbered lines, but if you feel confident you can use other
    files as well.


    ### Exercise 4.01

    Show the first 3 entries of `slices.txt` [Go to solution](#)


    ### Exercise 4.02

    Show the last 3 entries of `slices.txt` [Go to solution](#)


    ### Exercise 4.03

    Show the content of `slices.txt` skipping the last 3 lines [Go to solution](#)


    ### Exercise 4.04

    Show the content of `slices.txt` starting from line 3 (that is, skipping the first
    2 lines) [Go to solution](#)


    That''s all for today. Was it complex? Was it boring? Well, I''m sorry but I can''t
    hear your answer, I wrote this book some time ago. At any rate, if you think we
    are going to slowly you can go on freely, the daily frequency is just a suggestion.
    For today, I also suggest a good cup of tea and maybe some biscuits.

    Next stop, some plumbing: one of the most important things you can learn about
    Unix.

    Suggested film for the evening: Highlander (1986) - There are many beginnings,
    but in the end there will be only one.


    ## Day 5 - Semicolon, logical AND, pipes

    > – All right. Let''s just think this thing through logically.

    > Back to the Future Part III (1990)


    So far it looks like bash and Unix are not using those nasty strange symbols many
    other programming languages or systems use. Well, that''s good, isn''t it? Yes,
    but it''s also tragically untrue. In this lesson we will meet some of the fancy
    hieroglyphs that Unix uses to express complex behaviour, so if you are still ruminating
    on that class of ancient Babylonian language that you missed at the university,
    be happy. You will soon catch up.


    First of all let''s explore the semicolon. Try to add a semicolon between two
    commands, like for example

    ```

    $ echo "First string"; echo "Second string"

    ```

    As you can see bash runs both in sequence, so ; clearly stands for a sort of "and"
    between two commands.


    It is interesting to see what happens if one of the commands fails, though. Let''s
    try to get the content of a file that doesn''t exists as first command.

    ```

    $ cat nofile.txt; echo "Second string"

    ```

    Well, the output of this double command is an error message from cat (which mercilessly
    sends us to the naughty step), followed by the output of the echo command. So,
    the semicolon is executing both commands whatever the result of them.


    It is however often useful to chain commands in a different way, where a failing
    command interrupts the execution. For example you might want to find all files
    with a certain name and create a log file with some statistics, but you don''t
    want to run this last step if there are no files.


    For the time being let''s see what the operator && does to the previous two commands

    ```

    $ cat nofile.txt && echo "Second string"

    ```

    It looks like this is exactly what we were looking for. We get the error message
    from cat (and the naughty step again, sorry), but no output from echo. Bash interrupted
    the execution because one command failed. Put this in your belt, it will come
    in handy sooner or later. There is a third ancient glyph that made it through
    the fall of the ancient Egyptian kingdom and landed in the Unix system, and it
    is one of the most important operators that you have to learn. So, grab some strong
    coffee, you need to be awake.


    ### Caveat

    You will notice that later in the book I always use the pattern `cat <file> |
    <command>`, even though the man page of many commands shows that you might as
    well run `<command> <file>` omitting the `cat` and the pipe. While I use both
    versions in my daily tasks, I preferred the first one in this book because it
    makes clearer what the `<command>` does, and it helps familiarising with pipes.


    So far, when we run commands the output was printed (magically?) on the terminal,
    and that''s fine, as most of the time we want to see what a command does. The
    input of the commands, on the other hand, came almost exclusively from files that
    are already on your hard disk. What happens if you run

    ```

    $ head -n 10 slices.txt | tail -n 5

    ```

    If your system doesn''t have the hiccup, you should see the lines from 6 to 10
    of the `slices.txt` file. But, but... we asked `head` to show us 10 lines, this
    is definitely fishy. The `|` operator is called *pipe* and its effect is that
    of piping the output of the first command, preventing it to reach the terminal,
    and instead going directly into the `tail -n 5` command. So we got the last 5
    lines of the first 10 lines of `slices.txt`, that is lines from 6 to 10. I told
    you this lesson was about plumbing.


    Many Unix commands that work on files accept input from a pipe instead, and you
    might see now why this is so important. Through pipes you can connect commands,
    creating your own complex operators from simpler ones. And now, welcome to the
    Operating Systems Philosophy class of professor Unix! I''m only half joking here,
    the so-called *Unix philosophy* dictates that you should provide small programs
    that do a very specific things, and that do it at their best. You will then compose
    them with pipes and other operators to create more complex programs.


    Enough for today! You will probably have nightmares about leaky pipes, philosophers
    and Pharaohs. I can only recommend a good book and a cup of tea. Just don''t read
    anything related to ancient cultures!

    Suggested film for the evening: Stargate (1997) - Some Unix programmers work together
    on a manufactory that apparently shows that ancient Egyptians were familiar with
    the command line.'
