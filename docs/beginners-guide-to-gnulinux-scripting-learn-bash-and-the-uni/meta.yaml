    ## 第11天 - 查找和替换文本

    > 我得找个替身接替船长的位置。——《从海底出发》（1981）

    搜索是计算机、算法，也是程序员最常进行的活动之一。你需要在文本中搜索某个特定变量，想在一本书里找到某个名字的所有出现位置，想要提取日志文件中特定日期和小时的所有时间戳。这些都是搜索在你日常（无论是否为程序员）生活中有用的一些例子。

    替换文本的使用频率低于搜索，唯一的原因是你必须先找到要替换的文本才能进行替换。你需要替换文本，可能是因为你需要以不同的方式格式化某些数据，想要复用其中的部分内容，或者更一般地说，你想要转换数据。

    本章我将介绍两个我每天都在用、而且几乎在我写的每个脚本里都会用到的工具：`grep`和`sed`。我们已经在第6章简单介绍过`sed`，但本章会开始探索它的真正潜力。这两个工具（尤其是`sed`）都非常强大，提供了很多选项，因此我在这本书里不会完全覆盖它们。你可以在各自的手册页和大量涵盖这些工具的在线资源中找到很多相关信息。直到本书第二部分我们学习正则表达式时，才会解锁`grep`和`sed`的全部威力，但本章我们可以先熟悉它们的语法和作用。

    整章中我会用到你应该随本书配套文件获得的`examples.txt`文件。我们先从`grep`开始。这个工具诞生于所有编辑器的鼻祖`ed`中，是“全局搜索正则表达式并打印”命令，后来演变成了我们现在仍在使用的独立工具。该工具的手册页说明`grep`会打印匹配模式的行，因此每当我们需要在文本中查找特定部分时，都会用到这个工具。你是不是已经困了？我都有点打瞌睡了。少废话了！先看代码，无聊的讲解后面再说！

    如果你执行以下代码

    ```shell $ grep "elephant" examples.txt elephant ```

    你会发现`grep`找到了包含所提供字符串`elephant`的那一行并打印了出来。该工具默认查找部分匹配的行，也就是包含搜索字符串和其他附加字符的行。

    ```shell $ grep "red" examples.txt undead red dragon ```

    如果你想只查找覆盖整行的匹配项，使用`-x`选项

    ```shell $ grep "dog" examples.txt dog dog corn dog $ grep -x "dog" examples.txt
    dog dog ```

    默认情况下，`grep`执行区分大小写的搜索，因此小写和大写是有区别的。如果你想执行不区分大小写的搜索，使用`-i`选项

    ```shell $ grep "H" examples.txt H2O HTTP/1.1 $ grep -i "h" examples.txt elephant
    ostrich Dug the Dog beholder H2O phase spider Johnny 5 hogwash wild hog HTTP/1.1
    hog ```

    一旦我们找到需要的内容，或者当某个文本存储在变量中时，我们常常想要修改它，将其中的部分内容替换为其他内容。`sed`工具就可以完成这项操作（实际上还能做很多其他事）。尝试执行以下命令

    ```shell $ grep "elephant" examples.txt | sed s/"ele"/"oli"/ oliphant ```

    该命令会将字符串`"ele"`替换为字符串`"oli"`。`sed`的`s`命令需要接收被某个非模式内字符包围的搜索模式和替换模式。这里我用了逗号作为分隔符，不过你会经常看到用`/`，这是这个工具另一种常用的分隔字符。

    ```shell $ grep "elephant" examples.txt | sed s/"ele"/"oli"/ oliphant ```

    我在`sed`命令里倾向于避免使用`/`，因为我经常要对文件路径运行这个命令，而文件路径里包含`/`，这会导致命令失败。显然，如果你的主要工作是处理逗号分隔值（CSV）文件，逗号作为分隔符就不太合适，所以效果因人而异。只是想证明`sed`其实不关心分隔字符的话，你可以尝试执行以下命令

    ```shell $ grep "elephant" examples.txt | sed s/e/oli/ oliphant ```

    需要说明的是，我不仅不支持这种晦涩的语法，如果你敢用这个还跟别人说我让你这么做的，我会执行`grep "${you}" universe.txt | sed
    s/"${you}"/"void"/`。善意提醒。=）你还可以从最后一个例子注意到，引号是可选的。像往常一样，我认为它们能让整个命令更易读，所以我的建议是始终使用它们。

    默认情况下，`sed`只会替换搜索字符串的第一个出现位置，如果你想替换所有出现位置，需要使用`g`选项

    ```shell $ echo "abracadabra" | sed s/"a"/"_"/ _bracadabra $ echo "abracadabra"
    | sed s/"a"/"_"/g _br_c_d_br_ ```

    `sed`有一个有趣的特性：替换模式可以包含匹配到的模式，这样如果我们需要复用匹配内容，就可以避免重复

    ```shell $ echo "abracadabra" | sed s/"a"/"&-"/ a-bra-ca-da-bra- ```

    等我们后面学习正则表达式里的分组和反向引用时，这个技巧就会被更强大的功能取代，但目前来说这是个值得学习的小技巧。

