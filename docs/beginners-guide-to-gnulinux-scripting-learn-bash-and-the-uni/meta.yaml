    #### Exercise 12.02 Log entries in the file `simple.log` contain the string `HTTP/<version>
    <code>`, where `<version>` is the version of the HTTP protocol in use (either
    1.0 or 1.1) and `<code>` is the three-digit HTTP request status code. Extract
    all lines with a status "4xx" (that is a status between 400 and 499). Count how
    often each status occurs.

    ##### Solution

    The `HTTP/1.0` or `HTTP/1.1` strings can be used as anchors to identify the three
    digits we are interested in, but then we want to get rid of them to aggregate
    the HTTP status codes only

    ```

    $ grep -Eo "HTTP/.\.. 4.." simple.log | sed -r s,"HTTP/.\.. ",, | sort | uniq
    -c

    2 403

    213 404

    2 416

    ```

    If we don''t get rid of the protocol version we get a different histogram, which
    can be interesting anyway

    ```

    $ grep -Eo "HTTP/.\.. 4.." simple.log | sort | uniq -c

    1 HTTP/1.0 403

    30 HTTP/1.0 404

    1 HTTP/1.1 403

    183 HTTP/1.1 404

    2 HTTP/1.1 416

    ```

