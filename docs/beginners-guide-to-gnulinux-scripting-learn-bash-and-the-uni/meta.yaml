    ## Day 1 - Getting help

    ### Solutions to exercises

    #### Exercise 1.01

    Enter the man page for the `echo` command and locate the `AUTHOR` (actually the
    authors).

    #### Solution

    Run the command

    ```

    $ man echo

    ```

    Inside the man page press `/` (slash) and type `AUTHOR`, then hit Enter. You should
    have found that echo has been written by Brian Fox and Chet Ramey. Now silently
    say thanks to them for the time they spent creating these utilities. They did
    it for free, so you should be grateful.

    [Go back to the exercise](#)

