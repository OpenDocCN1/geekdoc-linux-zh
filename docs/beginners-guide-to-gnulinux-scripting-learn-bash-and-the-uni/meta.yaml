    在bash中你可以在任何地方使用变量，因为变量会在命令执行前就被替换。例如：

    ```bash

    $x=5; sed -n ${x}p slices.txt

    ```

    说真的这语法不算好读，但毕竟是你自己报名了《上古咒语与神秘仪式》这门课的对吧？等等，你说你只是想当个程序员？这两者有什么区别来着？

    学完变量之后，命令替换是你写bash脚本时最常用到的功能之一。命令替换指的就是把一个命令的完整输出赋值给变量，这个功能非常常用，因为它能让你对输出内容进行操作、遍历输出的每一部分，总的来说可以非常灵活地使用它。

    命令替换的语法是$(command)，其中`command`是任何你可以在终端执行的命令。

    例如我们可以把一个序列的输出赋值给变量：

    ```bash

    x=$(seq 1 5); echo ${x}

    ```

    请注意，这种情况下变量x得到的是字符串"1 2 3 4 5"的值，它不是列表，也不是任何其他复杂数据类型，只是一个由数字和空格组成的简单字符串。bash会自动把`seq`使用的换行符转换成空格，等我们学习写循环的时候，你会发现这个特性非常方便。

    > 好了，接下来就好好享受这一天剩下的时间吧，我们很快就会学到怎么把南瓜变成马车、把老鼠变成仆人，只要记得午夜时分所有东西都会变回文本文件就行。

    > 今晚推荐的电影：《美丽心灵》（2001年）—— 这部电影讲了变量的重要性，也讲了有时候不出去散散步、一头扎进Unix脚本里埋头苦干的危险性。


    ## 第9天 - 字段

    > – 不过她泡咖啡的技术可是一绝，这点算是加分项。

    > 《蝙蝠侠归来》（1992年）


    数据往往是有结构的，很多时候拆分数据的好方法是用特定字符分隔的字段。这一点不仅适用于逗号分隔值（CSV）文件，也适用于其他类型的数据。比如句子中的单词用空格分隔，IP地址中的数字用点分隔（192.168.0.1），时间字符串里的小时、分钟、秒可以用冒号分隔（08:41:12）。

    因此，学习如何从字符串中提取特定字段或一组字段肯定非常有用，在Unix中做这件事最好的工具就是`cut`命令。

    这个命令有两个重要的选项：

    - `-d`：指定用来分隔字段的字符

    - `-f`：指定要提取的字段，编号从1开始

    我们来看个例子：

    ```bash

    echo "12:34:56" | cut -d ":" -f 2

    ```

    这条命令会把字符串12:34:56按冒号分隔成3个字段，分别是12、34、56，然后提取第2个字段，也就是分钟部分。

    我们可以用命令替换把提取到的值赋值给变量：

    ```bash

    minutes=$(echo "12:34:56" | cut -d ":" -f 2)

    ```

    `-d`选项接受单个字符作为分隔符，默认值是制表符（TAB），也就是缩进用的特殊字符，是常用的字段分隔方式。你看我刚才把冒号用引号括起来了，其实这里不是必须的，但如果我们要用空格做分隔符的话，引号就是必需的了：

    ```bash

    echo "This is a sentence with many words" | cut -d " " -f 4

    ```

    我的建议是直接一直用引号就行，没必要浪费时间想需不需要加。

    我们之前说过，`-f`选项可以接受单个字段的编号，也支持解析类似4-7的序列、4,7这样的列表，或者二者的组合。你可以查看手册页了解所有支持的格式。


