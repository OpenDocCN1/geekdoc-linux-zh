    ## 第二天 - 打印输出

    ### 习题解答

    #### 练习 2.01

    打印字符串 `"Just a test"`


    #### 解答

    ```

    $ echo "Just a test"

    Just a test

    ```

    正如我们在本章讨论过的，运行以下命令也能得到相同结果：

    ```

    $ echo Just a test

    Just a test

    ```

    但我认为第一种解法更好。它能让你立刻明确命令中哪部分是字符串，而且之后我们在编辑器中创建脚本时，引号内的字符串会被高亮显示。

    [返回练习](#)


    #### 练习 2.02

    打印一个不带末尾换行的字符串（请参考手册页）


    #### 解答

    打开 `echo` 的手册页，搜索 `trailing newline` 关键词，你会找到如下内容：

    ```

    -n do not output the trailing newline

    ```

    因此，如果你运行以下命令：

    ```

    $ echo -n "Just a string"

    Just a string$

    ```

    你会看到字符串后面立刻跟着命令提示符，如上所示。这个功能在你想要给运行中的进程（比如 for 循环）输出用户反馈，并且想要打印单个字符（比如一个点）时非常有用。在循环中，你需要打印这些字符时不带换行，让它们显示在同一行输出中。

    > [返回练习](#)

    ________________________________________________


    #### 练习 2.03

    运行以下命令：

    ```

    $ echo "First line\nSecond line"

    ```

    会发生什么？你能找到把 `\n` 转换为换行的方法吗？


    #### 解答

    运行上述命令时，输出会是字面字符串 `First line\nSecond line`。`\n` 序列在 Unix 系统中用来表示换行，但显然 `echo`
    默认无法识别它。这是因为默认情况下，`echo` 会忽略 `\n` 这类*反斜杠转义符*。在编程领域，*转义*是一种避免系统对某些字符做默认解释、向编程语言表明我们赋予其特殊含义的方式。在本例中，如果
    `echo` 遇到字符 `n`，只会直接输出字符 `n`，但我们想让它有特殊作用。长话短说，如果你在 `echo` 的手册页中搜索 backslash，会发现它支持
    `-e` 参数来启用反斜杠转义符的解释功能，因此你可以运行 `echo -e "First line\nSecond line"` 来让两行内容分两行打印。

    [返回练习](#)


