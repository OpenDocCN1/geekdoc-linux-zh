- md: '## Day 15 - Regular expressions - Anchors

    > – Okay, here. Stop. Throw anchor. The Karate Kid (1984)


    This is day 3 of your journey into regular expressions, are you ready for some
    more magic? Today we will learn how to use anchors. No, we are not setting boats
    on fire, what did you understand? We are going to discover how to tell a regular
    expression where the text is and how to manage repetitions. Let''s start with
    anchors.


    You might like to know that the HTML tag `<a>` commonly used to include hypertext
    links, comes from anchor, as it was a way to anchor an element to a specific place
    in the markup. Old times, now things are pretty different. Anyway, this has nothing
    to do with regular expressions but for the fact that we generally have the need
    of specifying where some text has to be found.


    Before we dive into positioning, however, I want to discuss text that spans multiple
    lines. Generally speaking, the separation of a text into lines is a pure convention.
    We agree that the characters `\n` represent a new line, and this convention comes
    from the C language that wanted to ensure maximum portability of the code, as
    the ASCII hexadecimal value `0x0a` might not be recognised by some systems. Text
    on a new line is usually considered separated from the previous one, or at least
    identifying a different entry in a list. For example, when we make a list of people
    in a group, we generally put two different people on two different lines, which
    avoid any possible misunderstanding between names, middle names, and surnames.
    So, Unix tools generally work line by line, as we already noticed with grep. This
    is not different when we use regular expressions, as they are applied by tools
    that read and process a text line by line. There are ways to apply a regular expression
    to a multiline text, but I leave this for a future lesson.


    Let''s go back to anchors. When we want to find a string in a longer text, the
    two most frequent cases we will encounter are when the string is at the beginning
    of the line and when the string is at the end of it. The syntax of regular expressions
    provides two special characters to signal this, aptly named *anchors*, which are
    `^` (*caret*, or *hat*) and `$` (*dollar*). Please note that the `$` used by some
    shells as prompt (and used in the examples of this book) is not related to the
    `$` anchor at all.


    For example, running the following command on the file `examples.txt`:

    ```shell

    $ grep -E "dog" examples.txt

    dog

    dog

    corn

    dog

    ```

    returns all lines with the string "dog" somewhere in them.


    If you run

    ```shell

    $ cat examples.txt | grep -E "^dog"

    dog

    dog

    ```

    you will notice that the last line is not there, because the `^` anchors the string
    "dog" to the beginning of the line.


    Conversely, if you run

    ```shell

    $ cat examples.txt | grep -E "dog$"

    dog

    dog

    corn

    dog

    ```

    you will get the same result as the first run, as all those "dog" strings are
    at the end of the line. You can also combine the two in a single regular expression
    if you need to anchor something at the beginning and something else at the end:

    ```shell

    $ cat examples.txt | grep -E "^co.*og$"

    corn

    dog

    ```


    From the last example, it follows that if you want to match the exact content
    of a line you just need to surround the search pattern with anchors:

    ```shell

    $ cat examples.txt | grep -E "^hog$"

    hog

    ```


    If you try the last example without either the `^` or the `$` you will see that
    the result changes as the pattern matches only part of the line.


    ## Exercises

    ### Exercise 15.02

    Count how many empty lines are contained in the file `examples.txt` [Go to solution](#)


    ---


    Anchoring text is very important as many times the pattern we are looking for
    is repeated in other parts of the line, but those are not interesting. The beginning
    and the end of the line are good reference points to start analysing text, so
    it is good that regular expressions provide these two special positioning characters.
    In the next lesson we will discuss multiple matches, but for the time being be
    happy, your knowledge of regular expressions is increasing day by day!


    - Suggested film for the evening: Jason and the Argonauts (1963)

    - When it comes to using anchors, mister Jason is the system administrator you
    need; he also knows a lot about escaping.


    ## Day 16 - Regular expressions - Multiple matches

    > – A date gives you a corsage, not a multiple fracture. Little Shop of Horrors
    (1986)


    Well, not bad at all! We are still alive after 3 lessons about something that
    is considered an advanced topic. Congrats! I hope you are not only surviving,
    but actually enjoying the journey. I think you start to appreciate that regular
    expressions are not actually difficult, they are however complicated, full of
    special symbols and rules. So far we learned how to use `.` for any character,
    square brackets `[` and `]` for classes and ranges with `-` inside them, and finally
    the two anchors `^` and `$`. Today we''ll have a look at multiple matches.


    Generally speaking a multiple match is a repeated match of a previous regular
    expression, and a typical use case is when you need to match a specific number
    of digits or letters, but multiple matches can also be less specific, for example
    matching an indefinite number of lowercase letters. Let''s start with exact matches,
    which are performed with the syntax `{N}`, where N is the number of matches. As
    I said, all multiple matches operations refer to a previous regular expression,
    so if you run

    ```shell

    $ grep -E "a{2}" examples.txt

    aardvark

    ```

    you are asking grep to match all groups of 2 adjacent characters a, as in "aardvark".
    The number between brackets can be any positive number, even though using 1 makes
    no sense, as a single character is already a regular expression matching one repetition
    of it. So, while you can execute

    ```shell

    $ grep -E "a{1}" examples.txt

    ```

    and get the correct result, this is equivalent to

    ```shell

    $ grep -E "a" examples.txt

    ```

    and I personally don''t see a point in making the regular expression more complex
    to read introducing the braces. If you like complicating your life try to create
    a social network in PHP. Wait a minute, what you mean they did it? The braces
    repeat the previous regular expression component, so the syntax `a{2}` is equivalent
    to a literal `aa`. The syntax can be used to repeat more than letters, though,
    as they apply to any previous component of the regular expression. For example,
    running the following command:

    ```shell

    $ grep -E "[a-z]{3}" examples.txt

    dog

    cat

    elephant

    ostrich

    Dug the Dog

    beholder

    [...]

    ```

    matches exactly three adjacent lowercase letters. It is worth noting that the
    patterns do not overlap: for example, in `elephant` the regular expression matches
    `ele` and `pha` only, and not `ele`, `lep`, `eph`, and so on. Once a pattern has
    been matched it is skipped to continue the line analysis. This is pretty clear
    if you use the `-o` option of grep that we learned previously, which outputs only
    the matching part of the string:

    ```shell

    $ grep -Eo "[a-z]{3}" examples.txt

    dog

    cat

    ele

    pha

    ost

    ric

    the

    beh

    old

    [...]

    ```


    The braces allow you to specify ranges, so `{n,m}` means from `n` to `m` repetitions,
    `{n,}` means `n` or more, and `{,m}` means zero to `m`. For example:

    ```shell

    $ grep -E "[a-z]{8,12}" examples.txt

    elephant

    beholder

    aardvark

    direwolf

    manticore

    basilisk

    ```

    matches all lines containing at least one word made of 8 to 12 lowercase letters.
    Two specific ranges are used very often, namely `{1,}` and `{0,}`. The first matches
    one or more repetitions of a component, and it is useful when you know that at
    least one occurrence will be there, but you are unsure of the upper limit. The
    second one, instead, is used to match possible occurrences of a component. As
    these two ranges are very important, there is a special syntax for them. `{1,}`
    can be written `+`, while `{0,}` can be written `*`. So, the following command:

    ```shell

    $ grep -Eo "D[a-z]+" examples.txt

    Dug

    Dog

    ```

    matches the letter D followed by at least one lowercase letter, so the output
    contains both "Dug" and "Dog" (pay attention to the `-o` option used here to clearly
    show the matches). The command

    ```shell

    $ grep -Eo "D[a-z]*" examples.txt

    Dug

    Dog

    D

    ```

    instead, also matches the single "D" that comes from the line `R2-D2`, as that
    "D" is actually followed by zero or more lowercase letters.


    Pay attention to the last two examples: as you can see the `+` and the `*` are
    applied to the last *component* of the regular expression, as happened for the
    braces, and not to the last *character*. The syntax `a+` works because a single
    letter or digit is also a regular expression component on its own.


    ## Exercises

    ### Exercise 16.01

    Match all the occurrences of exactly three digits in the file `examples.txt` [Go
    to solution](#)


    ### Exercise 16.02

    The log file `simple.log` contains the status of HTTP responses, which is a three
    digit number preceded and followed by a space. HTTP statuses are categorised according
    to the initial digit and 4xx responses (that is 400, 401, 402, and so on) are
    considered resource errors. Count how many HTTP 4xx responses are in the file
    for each type of error. [Go to solution](#)


    ### Exercise 16.03

    The log file `simple.log` contains the IP address of the client for each request.
    IP addresses are made of four numbers separated by dots (i.e. A.B.C.D), where
    each number goes from 0 to 255 (thus having from 1 to 3 digits). Find the 5 IP
    addresses that occur the highest number of times in the file, counting them [Go
    to solution](#)'
