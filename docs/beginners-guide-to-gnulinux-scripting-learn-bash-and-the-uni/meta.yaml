    So far, when we run commands the output was printed (magically?) on the terminal,
    and that''s fine, as most of the time we want to see what a command does. The
    input of the commands, on the other hand, came almost exclusively from files that
    are already on your hard disk. What happens you you run


    ```

    $ head -n 10 slices.txt | tail -n 5

    ```


    If your system doesn''t have the hiccup you should see the lines from 6 to 10
    of the `slices.txt` file. But, but... we asked `head` to show us 10 lines, this
    is definitely fishy. The `|` operator is called *pipe* and its effect is that
    of piping the output of the first command, preventing it to reach the terminal,
    and instead going directly into the `tail -n 5` command. So we got the last 5
    lines of the first 10 lines of `slices.txt`, that is lines from 6 to 10.


    I told you this lesson was about plumbing.


    Many Unix commands that work on files accept input from a pipe instead, and you
    might see now why this is so important. Through pipes you can connect commands,
    creating your own complex operators from simpler ones.


    And now, welcome to the Operating Systems Philosophy class of professor Unix!
    I''m only half joking here, the so-called *Unix philosophy* dictates that you
    should provide small programs that do a very specific things, and that do it at
    their best. You will then compose them with pipes and other operators to create
    more complex programs.


    **Caveat** You will notice that later in the book I always use the pattern `cat
    <file> | <command>`, even though the man page of many commands shows that you
    might as well run `<command> <file>` omitting the `cat` and the pipe. While I
    use both versions in my daily tasks, I preferred the first one in this book because
    it makes clearer what the `<command>` does, and it helps familiarising with pipes.


    Enough for today! You will probably have nightmares about leaky pipes, philosophers
    and Pharaohs. I can only recommend a good book and a cup of tea. Just don''t read
    anything related to ancient cultures!


    Suggested film for the evening: Stargate (1997) - Some Unix programmers work together
    on a manufact that apparently shows that ancient Egyptians were familiar with
    the command line.'
- md: '## Day 6 - Printing specific lines

    > – *You''ve been targeted for termination.* Terminator (1984)


    Today I want to introduce you to a friend of mine, its name is sed. Its full name
    is actually Stream EDitor, but few remember it and it doesn''t care that much.
    Actually it answers only when you call it with the nickname. Anyway, it is an
    incredibly powerful command, but for the moment I can''t show you exactly what
    it can do, as you might not get how useful it will be for your work. We will thus
    explore just one of the many things it can do, and probably the less important
    one, which is to print lines.


    The problem we often have is that of printing a specific line of a text. With
    `head` and `tail` we learned how to print a certain number of lines starting from
    the beginning or the end, but what if we want a line somewhere in the middle of
    the file? One possible solution comes from pipes. If you run

    ```

    $ head -n 5 slices.txt | tail -n 1

    ```

    you are asking `head` to show you the first 5 lines of the file, and then filtering
    this output with `tail`, getting the last line. And this ultimately gives you
    exactly the line number 5. So far so good, but this is a pretty convoluted way
    to just print line 5, isn''t it? Indeed, `sed` thinks the same, and so it provides
    a simpler way to do it.

    ```

    $ sed -n 5p slices.txt

    ```

    I know, I know. You think that `sed -n 5p` is not the first thing that comes to
    your mind when simplicity is the subject of the conversation. At any rate, I hope
    you at least agree on the fact that having only one command is better than having
    to pipe two of them.


    Your new friend `sed` accepts input from pipes as well, so whenever you want to
    see a specific line you can pipe the current command into it. We will see examples
    of this later in the book.


    I said `sed` is extremely powerful, so is it possible it can only print a single
    line? Not at all, it can definitely print a sequence of lines, you just need to
    provide the first and the last line separating them with a comma.

    ```

    $ sed -n 3,8p slices.txt

    ```

    This prints lines 3-8 of the given file. Are you not satisfied yet? OK, `sed`
    can also print a certain number of lines starting from a given one. This often
    saves me from the shame of showing the world that I am terrible at math.

    ```

    $ sed -n 3,+5p slices.txt

    ```

    This gives you the same output of the previous command, as it starts at line 3,
    printing that and the following 5 lines. Pay attention that sed is not showing
    you 5 lines starting from line 3, but 6 lines. I think you probably still need
    your math skills. Did you notice I haven''t given you any exercise last time?
    Yes you did, I''m sure. Well, no exercises for this lesson either, just practice
    a bit printing lines and try to get used to the weird syntax. Yesterday I gave
    you a headache with strange symbols, today I hope I just regained your trust.
    Let''s wrap it up here, there is a new film that awaits you, and some crisps.
    Remember to put some beers in the fridge, one for you, and one for your new friend
    sed. And maybe give some food to the cat as well, poor little thing.


    Suggested film for the evening: The Conversation (1974) - Sometimes getting a
    single line is not the best choice, as this Unix programmer discovers while looking
    at conversation logs.


    ## Day 7 - Sequences and counting

    > – A coding sequence cannot be revised once it''s been established. Blade Runner
    (1982)


    Today we will relax a bit, lately we have been doing a lot, so it''s time to learn
    something easy and straightforward. So, we will discuss distributed consensus
    in a network system. No, I''m just joking, that is actually far from being simple.
    OK, let''s pick another topic: what do you think about sequences? I find them
    extremely useful, for example when you need to rename files and you want to give
    them a proper order. Whatever the use, Unix provides a very nice command to create
    sequences of integers, aptly named `seq`.


    Note: I''m always unsure about the proper pronunciation of `seq`. As an Italian,
    I tend to pronounce it as "sec", but if you want to go for something else I understand
    you. You can spell it, with the benefit that if you use the right tone you can
    sound like a field officer during a battle.


    The basic usage is very simple, as you just need to specify a number greater than
    1 and `seq` will output all integers between 1 and that number.

    ```

    $ seq 10

    ```

    Now, this is useful, but sometimes you need to count between two specific numbers,
    for example because you want to include 0, or because you simply need to start
    from 42, which is always a good initial value. In this case you just give `seq`
    the first and the last number

    ```

    $ seq 4 11

    ```

    ```

    $ seq 4 -1 -5

    ```

    This will give you the sequence of integers `4, 3, 2, ... -4, -5`. As you probably
    guessed, you can change the step arbitrarily, for example using `2` to skip every
    other number, or any other requirement you might have, for example

    ```

    $ seq 1 2 10

    ```

    As you can read in the man page, the `seq` command has some command-line options.
    It is particularly useful to learn the `-w` switch, that prepends enough `0`s
    to keep all numbers at the same length. For example

    ```

    $ seq -w 1 10

    ```

    prepends one `0` to the numbers between `1` and `9` to get the same length of
    the last number, `10`. This is called left zero-padding, in the elite circles
    of programmers, but I bet you can also call it zero left padding and everybody
    would understand. Now shout "Launch a zero left-padded sequence!" and tell me
    if you don''t feel like one of the mecha pilots of some Japanese anime. I honestly
    think it''s cool.


    Another useful and simple thing we can learn today is counting elements. When
    it comes to lines, words, or characters, often you need to know how many of them
    are in a file or in the output of a command, and in those cases `wc` is your friend.
    Arguably, the name of the tool is not the best, but it stands for "word count"
    and after a while you will get used to it, and it will no more conjure up any
    idea of private spaces. Despite the name, `wc` can count several different things,
    lines and characters being the most useful ones. Let''s test the line count with
    `seq`, using the `-l` option that makes `wc` output only the number of lines

    ```

    $ seq 1 10 | wc -l

    10

    ```

    The tool is very useful when we want to count the number of characters in a string

    ```

    $ echo "This is a test" | wc -c

    15

    ```

    Wait a minute... 15? I count 14 characters there, including spaces. What''s going
    on? Well, you know that `echo` adds a newline at the end of the string, right?
    That newline is a specific non-printable character, which makes `wc` add one to
    the length. We discussed the `-n` option of `echo` that prevents the newline,
    and using that you will get the correct length

    ```

    $ echo -n "This is a test" | wc -c

    14

    ```


    ## Exercises


    ### Exercise 7.01

    Print the numbers from 5 to 15 padded with enough zeros to fill 5 digits, i.e.
    `00005`, `00006`, `00007`, and so on. [Go to solution](#)


    ### Exercise 7.02

    Count the number of lines of the file simple.log [Go to solution](#)


    That''s it for today, I promised you it would have been a relaxing lesson: simple
    concepts, no homework, what more can you desire? A nice walk, this is what you
    need! Go, enjoy the nature if you can, or get your mecha and fight the alien invaders
    one zero-padded sequence at a time!


    Suggested film for the evening: WarGames (1983) - A young Unix programmer teaches
    a supercomputer to run a sequence of battle simulations and to count the casualties.


    ## Day 8 - Variables

    > — You''re not part of this equation. Die Hard (1988)


    The Unix terminal provides variables, like many programming languages. Unfortunately,
    unlike other programming languages, bash does not provide data types, and this
    is a very important thing to remember. In bash, all variables are untyped, or,
    if you prefer, are just strings.


    The assignment operator is `=`, so if you run

    ```

    $ x=pdf

    ```

    the variable x assumes the value `pdf` as a string. As happened with `echo` you
    *can* use quotes, which are usually a good way to signal that we are dealing with
    a string, therefore you *should*. Remember they are not strictly necessary, though,
    as you can find many scripts that do not use them.

    ```

    $ x="pdf"

    ```

    You cannot, instead, use spaces, as the line `x = "pdf"` would be interpreted
    as the execution of the command `x` with two parameters `=` and `"pdf"`. Weird,
    isn''t it? It is, but this is due to the double nature of the terminal. It''s
    a command-line interface to the operating system, but it''s also a programming
    language, so the two aspects sometimes clash.


    As I said, variables are always strings, so

    ```

    $ x=5

    ```

    is not assigning the integer value 5 to `x`, but the string `"5"`. This has some
    implications, but the most important for the time being is that mathematical operators
    are slightly convoluted in bash. We will discuss this later, however, so you don''t
    need to worry now. Just remember that if you type `x=5+1` you are assigning `x`
    the value of the string `"5+1"`. Facepalm moment for you, the first time you will
    write this in one of your scripts.


    To refer to a variable, that is, to use its value, we use the syntax `${variable}`.
    For example'
