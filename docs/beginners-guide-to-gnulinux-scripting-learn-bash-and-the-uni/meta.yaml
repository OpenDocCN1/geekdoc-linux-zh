    I tend to avoid the / in my sed command because many times I run it on file paths,
    which contain the /, thus making the command fail. Obviously, the comma doesn''t
    work well if your main activity is to process comma-separated values files (CSV),
    so your mileage may vary. Just to see that sed really doesn''t mind the separation
    character, try to execute


    ```

