  md: "# Day 16 - Regular expressions - Multiple matches\n\n# Solutions to exercises\n\
    \n# Exercise 16.01\n\nMatch all the occurrences of exactly three digits in the\
    \ file examples.txt\n\n# Solution\n\n```\n$ grep -E \"[0-9]{3}\" examples.txt\n\
    Police 101\n007\nCyborg 009\n```\n\n[Go back to the exercise](#)\n\n# Exercise\
    \ 16.02\n\nThe log file simple.log contains the status of HTTP responses, which\
    \ is a three digit number preceded and followed by a space. HTTP statuses are\
    \ categorised according to the initial digit and 4xx responses (that is 400, 401,\
    \ 402, and so on) are considered resource errors. Count how many HTTP 4xx responses\
    \ are in the file for each type of error.\n\n# Solution\n\n```\n$ grep -Eo \"\
    \ 4[0-9]{2} \" simple.log | sort | uniq -c\n      2  403\n    213  404\n     \
    \ 2  416\n      1  481\n```\n\n[Go back to the exercise](#)"
  merge: -1
  pgno: 91
- img_proc: true
  md: "# Exercise 16.03\n\nThe log file simple.log contains the IP address of the\
    \ client for each request. IP addresses are made of four numbers separated by\
    \ dots (i.e. A.B.C.D), where each number goes from 0 to 255 (thus having from\
    \ 1 to 3 digits). Find the 5 IP addresses that occur the highest number of times\
    \ in the file, counting them\n\n# Solution\n\n```\n$ grep -Eo \"[0-9]{1,3}\\\\\
    .[0-9]{1,3}\\\\.[0-9]{1,3}\\\\.[0-9]{1,3}\" simple.log | sort | uniq -c | sort\
    \ -nr | head -n 5\n    482 66.249.73.135\n    364 46.105.14.53\n    357 130.237.218.86\n\
    \    273 75.97.9.59\n    113 50.16.19.13\n```\n\nThe regular expressions is made\
    \ of four repetitions of [0-9]{1,3}, which matches 1 to 3 adjacent digits, separated\
    \ by \\. which is a literal dot (remember that a dot without the escape backslash\
    \ matches any character). The following sort and uniq -c provide the counting,\
    \ the last sort -nr orders the list again using the numerical sort (which orders\
    \ according to the count, as this is at the beginning of each line), and in reverse\
    \ order, starting from bigger numbers down to 1. The last head -n5 at last selects\
    \ the top 5 from the list.\n\nGo back to the exercise\n\n# Exercise 16.04\n\n\
    The file simple.log contains the HTTP method used in the request (for example\
    \ GET or POST) followed by a space and the rest of the log line. For each request\
    \ that uses a GET print the HTTP method and everything that follows.\n\n# Solution"
  merge: -1
  pgno: 92
- img_proc: true
  md: '```

    $ grep -Eo "GET .*" simple.log

    GET /presentations/logstash-monitorama-2013/images/kibana-search.png HTTP/1.1
    200 20\

    3023 http://semicomplete.com/presentations/logstash-monitorama-2013/

    GET /presentations/logstash-monitorama-2013/images/kibana-dashboard3.png HTTP/1.1
    20\

    0 171717 http://semicomplete.com/presentations/logstash-monitorama-2013/

    GET /presentations/logstash-monitorama-2013/plugin/highlight/highlight.js HTTP/1.1
    2\

    00 26185 http://semicomplete.com/presentations/logstash-monitorama-2013/

    [...]

    ```


    The pattern .* is one of the most common ones in regular expressions. As . matches
    any character and * matches 0 or more repetitions of the previous component, .*
    means any repetition of any character, or "anything" for short. This is extremely
    useful whenever there are long parts of a line that you want to manage without
    writing a (probably very complex and long) regular expressions that matches them.


    [Go back to the exercise](#)'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# Day 17 - Regular expressions - Groups


    # Solutions to exercises


    # Exercise 17.01


    Extract all the lines of `simple.log` that contain an HTTP method `GET` or `POST`,
    rewrite each line in the form `<time> <HTTP status> <HTTP method>`. The result
    for the first 10 lines should be


    ```

    10:05:03 200 GET

    10:05:43 200 GET

    10:05:47 200 GET

    10:05:12 200 GET

    10:05:07 200 GET

    10:05:34 200 GET

    10:05:57 200 GET

    10:05:50 200 GET

    10:05:24 200 GET

    10:05:50 200 GET

    ```


    # Solution


    ```

    $ head simple.log | grep -E " (GET|POST) " | sed -r s,".*[0-9]{4}:(.*)] (GET|POST).*\

    HTTP/1.[0-1] ([0-9]{3}).*","\1 \3 \2",

    10:05:03 200 GET

    10:05:43 200 GET

    10:05:47 200 GET

    10:05:12 200 GET

    10:05:07 200 GET

    10:05:34 200 GET

    10:05:57 200 GET

    10:05:50 200 GET

    10:05:24 200 GET

    10:05:50 200 GET

    ```


    The idea behind this solution it to find all the lines that contain `GET` or `POST`
    using the logical `OR` in a group, so that either can be surrounded by spaces,
    which helps avoiding other mentions of those letters (like for example a line
    with an URL that contains "BUDGET" or "POSTER"). Then'
  merge: -1
  pgno: 94
- img_proc: true
  md: "I decompose the rest of the line using the year (`[0-9]{4}`) as an anchor.\
    \ Mentioning the closing square bracket `]` outside the group makes it disappear\
    \ from the output. The HTTP protocol can be either HTTP/1.0 or HTTP/1.1, and the\
    \ HTTP status is always a three digits number (`[0-9]{3}`).\n\n[Go back to the\
    \ exercise](#)\n\n# Exercise 17.02\n\nThe file `simple.log` contains lines with\
    \ requests concerning files like\n\n```\n83.149.9.216 [17/May/2015:10:05:03 GET\
    \ /presentations/logstash-monitorama-2013/images/kibana-search.png HTTP/1.1 200\
    \ 203023 http://semicomplete.com/presentations/logstash-monitorama-2013/\n```\n\
    \nExtract a list of all file extensions and count them. Assume that extensions\
    \ are made of lowercase letters only.\n\n# Solution\n\nThere are many ways to\
    \ solve this exercise. One possible solution is to use lookaround expressions\
    \ with grep to isolate the file path and later the file extension.\n\n```\n$ cat\
    \ simple.log | grep -Po \"(?<=GET ).*(?= HTTP)\" | grep -Po \"(?<=\\.)[a-z]+$\"\
    \ | sort | uniq -c\n      4 access\n     10 c\n     14 conf\n      1 cpp\n   1458\
    \ css\n      4 deb\n[....]\n```\n\n[Go back to the exercise](#)\n\n# Exercise\
    \ 17.03\n\nThere are three lines in the file `simple.log` where a request received\
    \ an HTTP 500 status code, for example"
  merge: -1
  pgno: 95
- img_proc: true
  md: '```

    66.249.73.135 [18/May/2015:15:05:42 GET /misc/Title.php.txt HTTP/1.1 500 - -

    ```


    Find them and print the IP addresses of each client in a single comma-separated
    line (i.e. <IP number 1>,<IP number 2>,<IP number 3>)


    # Solution


    The exercise can be solved using grep, sed and `xargs`


    ```

    $ grep -E "HTTP/1.1 500" simple.log | sed -r s,"([0-9.]+) .*","\1", | xargs echo
    | s\ ed s/" "/,/g

    66.249.73.135,66.249.73.135,64.131.102.243

    ```


    The initial grep uses the `HTTP/1.1 500` mentioned in the text of the exercise
    to find the relevant lines. Then, using sed we can extract the IP addresses, put
    them on a single line with xargs and replacing the space used as a separator with
    a comma.


    Instead of sed we could have used grep


    ```

    $ grep -E "HTTP/1.1 500" simple.log | grep -Eo "^[0-9.]+" | xargs echo | sed s/"
    /\ ","/g

    66.249.73.135,66.249.73.135,64.131.102.243

    ```


    counting on the fact that the space following the IP address is not matched by
    the class. A common replacement for the `xargs | sed` pattern is the `paste` command
    (that wasn''t introduced in the book)


    ```

    $ grep -E "HTTP/1.1 500" simple.log | grep -Eo "^[0-9.]+" | paste -s -d,

    66.249.73.135,66.249.73.135,64.131.102.243

    ```


    Make sure you read the man page of the `paste` command, it''s pretty simple and
    useful to have in your toolkit.


    [Go back to the exercise](#)'
