    > —— 起笔。《公主新娘》（1987）\n### 本书面向人群\n本书面向所有希望在Linux、Mac OS等Unix环境中提升工作效率的读者。作为一本入门教材，本书假定读者此前没有相关领域的基础知识，读者可以预期学到日常使用Unix环境时最核心的命令与概念。\n\
    近年来，在DevOps理念的框架下，开发人员与系统管理员之间的差距已通过各种方式得到可喜缩小，因此本书对于需要开始接触裸金属（底层硬件）的开发人员同样实用。\n\
    这部分开发人员可以从本书中接触到循序渐进的学习路径，以及Unix环境常用命令的快速查询指南。\n另一方面，也有部分人群（比如本书作者）对应用开发的底层环节感兴趣，希望以系统管理员或架构师为职业发展方向。对这部分读者而言，本书是合适的入门起点，可以帮助他们了解日常工作中会用到的基础工具与核心概念。\n\
    他们很快可能会感觉到需要更全面、更深入的学习材料，市面上也有大量书籍和资源可以满足他们的求知欲，但我希望他们能享受和我一起迈出的这第一步。\n### 本书编写目的\n\
    我撰写本书的契机，是当时正在为我的初级同事筹备一系列短期培训课程。我多年没有和初级员工共事过，虽然我清楚知道有些人成长过程中没有接触过命令行，但实际上我还是默认他们了解我所掌握的知识——这恐怕是许多资深程序员都会犯的错误。\n\
    因此，我决定开展一些培训课程，从最简单的命令开始，逐步带领大家了解Bash Shell，再到一些实用的脚本编写技巧。当他们终于掌握了正确的管道命令组合、或是发现正则表达式的妙用时，露出的满意笑容就是对（我）最好的回报，这种回报至今仍在延续。\n\
    从这些培训课程，以及我为筹备课程撰写的笔记中，我萌生了创作一本书的想法，这本书可以\n"
