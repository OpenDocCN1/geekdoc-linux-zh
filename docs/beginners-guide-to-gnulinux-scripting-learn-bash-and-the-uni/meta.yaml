    113 50.16.19.13

    ```

    The regular expressions is made of four repetitions of [0-9]{1,3}, which matches
    1 to 3 adjacent digits, separated by \. which is a literal dot (remember that
    a dot without the escape backslash matches any character). The following sort
    and uniq -c provide the counting, the last sort -nr orders the list again using
    the numerical sort (which orders according to the count, as this is at the beginning
    of each line), and in reverse order, starting from bigger numbers down to 1. The
    last head -n5 at last selects the top 5 from the list.

