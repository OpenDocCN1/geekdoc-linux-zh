    to better understand that topic, and writing requires even more study to get things
    clear in my mind, before attempting to introduce other people to the subject.


    Much of what I know comes from personal investigations, but without the work of
    people who shared their knowledge for free I would not have been able to make
    much progress. The Free Software Movement didn''t start with Internet, and I got
    a taste of it during the 80s and 90s, but the'
  - '[PAGE 9]


    World Wide Web undeniably gave an impressive boost to the speed and quality of
    this knowledge sharing.


    So this book is together with other things that I wrote, a way to say thanks to
    everybody gave their time to write blog posts, free books, software, and to organise
    conferences, groups, meetups. This is why I teach people at conferences, this
    is why I write a technical blog, this is the reason behind this book.


    That said, if you want to acknowledge the effort with money, feel free. Anyone
    who publishes a book or travels to conferences incurs expenses, and any help is
    welcome. However the best thing you can do is to become part of this process of
    shared knowledge; experiment, learn and share what you learn.


    # Submitting issues or patches


    This book is not a collaborative effort. It is the product of my work, and it
    expresses my personal view on some topics, and also follows my way of teaching.
    Both can definitely be improved, and they might also be wrong, so I am open to
    suggestions, and I will gladly receive any report about mistakes or any request
    for clarifications. Feel free to use the GitHub Issues of the [book repository](#).
    I will answer or fix issues as soon as possible, and if needed I will publish
    a new version of the book with the correction. Thanks!


    # About the author


    My name is Leonardo Giordani, I was born in Italy in 1977. That year gave to the
    world also Star Wars, bash, Apple ][, BSD, Dire Straits, The Silmarillion. I''m
    interested in operating systems and computer languages, photography, fantasy and
    science fiction, video and board games, guitar playing, and (too) many other things.


    I studied and used several programming languages, from the Z80 and x86 Assembly
    to Python and Scala. I love mathematics and cryptography. I''m mainly interested
    in open source software, and I like both the theoretical and practical aspects
    of computer science.


    For 13 years I was a C/Python programmer and devops for a satellite imagery company
    and I am currently infrastructure engineer at [WeGotPOP](#), a UK company based
    in London and New York that creates innovative software for film productions.


    In 2013 I started publishing some technical thoughts on my blog, [The Digital
    Cat](#). In 2018 I published my first book with Leanpub, [Clean Architectures
    in Python](#), which at the time of writing has been already downloaded more than
    10,000 times.


    [2]: https://github.com/bgutbook/bgutbook/issues

    [3]: https://www.wegotpop.com

    [4]: http://thedigitalcatonline.com

    [5]: https://leanpub.com/clean-architectures-in-python/'
- md: '### Acknowledgments

    - Ken Thompson, Dennis Ritchie, Brian Kernighan and others for writing the Unix
    operating system.

    - Linus Torvalds and all the kernel developers for writing the Linux kernel.

    - Stephen Bourne for his Bourne shell, Brian Fox for the Bourne-again shell, and
    many other people contributing to these amazing tools.

    - Richard Stallman and all the people working on the GNU project for porting the
    Unix utilities.

    - Machtelt Garrels for her amazing Bash Guide for Beginners. It saved my day many
    times.

    - Łukasz Dziedzic, who developed the free "Lato" font ([Latofonts](http://www.latofonts.com)),
    used for the cover. The cover photograph is by [pxhere](https://pxhere.com/en/photo/175470).
    A detail of the photo has been extracted and edited. As a commuter in London,
    I spend hours in stations and on public transport, and even these places can reveal
    a secret beauty. This book was mostly written in the morning on buses of the line
    26, if there are more typos than words now you know the reason.


    ### Sources

    The sources of the knowledge I tried to distil in this book are countless. Many
    people and the books they wrote, forums, Stack Overflow answers, a lot of experiments,
    a couple of hard disk partitions zapped trying to understand how the filesystem
    works, and a decent number of years spent automating processes. While all these
    are too many to be properly mentioned I can definitely provide the source of the
    log file used in the examples and the exercises. It is a simplified version of
    an Apache log file that can be downloaded [here](https://github.com/elastic/examples/blob/master/Common%20Data%20Formats/apache_logs/apache_logs).


    ### Setup

    > This is after the preface but before chapter one


    ### Example files

    Many examples and exercises in the book use text files that are available on the
    GitHub page of the book. To access them you just need to clone the repository.

    ```

    $ git clone https://github.com/bgutbook/bgutbook_files.git

    ```

    If you don''t know how to use Git you can find many resources online, or you can
    download a zipped version of the repository on the main page of the repository.


    ### Linux users

    If you are a Linux user you are basically already set up. The only thing you need
    to do is to download the test files and make sure that you run examples and exercises
    inside the cloned directory. Extract the archive in a directory of choice and
    reach it from your terminal. If you are using a graphical environment like Gnome
    or KDE you can usually find a "Open terminal here" command in the file browser.
    Otherwise you can just fire up a terminal (Konsole for KDE, GNOME terminal for
    GNOME, or any other terminal emulator) and move to that directory with the following
    command

    ```

    $ cd path/of/the/directory

    ```

    Where `path/of/the/directory` is the full path of the repository that you cloned
    in the previous section. Congratulations, you are ready to go!


    ### Mac OS users / Windows users

    I will cover only Linux in this book, at least in the initial versions. Linux
    is the operating system used in the vast majority of cloud solutions, and is the
    de facto most widespread Unix on servers, and this is a good reason to cover it.
    I''m using Linux on my personal computers as well, but the majority of programmers
    use a Mac or a Windows machine. The main reason for not covering Mac OS is that
    its default terminal is not 100% compatible with the Linux counterparts (as Mac
    doesn''t use the GNU utilities). I don''t have a Mac and even if I could cover
    all the different versions of the utilities, I think this would be daunting for
    beginners. The main reason for not covering Windows is that it is not even a Unix.
    I know that recent versions include some sort of Linux layer, but again I don''t
    have time and interest in those systems. So if you are using Mac OS X or Windows,
    you will have to run Linux in a Docker container. I will provide here two different
    solutions, the first one is simple but will be missing some parts of the system,
    while the second is a bit more complex but complete. Please note that in either
    case you need to have Docker installed in your system, refer to the Docker documentation⁹
    for instructions on how to do it. You can come back at any time and run the more
    complex solution if you initially decided to go for the simple one and you want
    to try the more complete version.


    ### Simple solution

    You can run the default Ubuntu image in Docker. This image has been stripped to
    be smaller, so you will miss some of the documentation that comes with a Linux
    system, called "man pages". We will use them in the first lesson and I encourage
    the reader to use them to learn how to use commands, so if you go for this solution
    you will have to refer to the online man pages every time you need help on a command.
    I will mention the online resources in the relevant chapter of the book, so don''t
    worry now. To run the Ubuntu image first clone the repository with the example
    files, enter that directory and run Docker. The commands are

    ```

    $ git clone https://github.com/bgutbook/bgutbook_files.git

    $ cd bgutbook_files

    $ docker run -t -i -v $(pwd):/opt/bgutbook_files ubuntu /bin/bash

    root@1d888c92ee76:/#

    cd /opt/bgutbook_files/

    root@1d888c92ee76:/opt/bgutbook_files#

    ```

    From here you are ready to start reading the book and run the examples. Whenever
    you want to exit you just need to type exit and Enter. When you want to go on
    you just need to follow again the process, skipping the git clone part. That is

    ```

    $ cd bgutbook_files

    $ docker run -t -i -v $(pwd):/opt/bgutbook_files ubuntu /bin/bash

    root@1d888c92ee76:/#

    cd /opt/bgutbook_files/

    root@1d888c92ee76:/opt/bgutbook_files#

    ```


    ### Advanced solution

    If you want to have a Ubuntu container with the man pages you need to create a
    new Docker image. I provide a configuration for such a machine as a Dockerfile
    in the bgutbook_ubuntu repository. First of all clone the repository

    ```

    $ git clone https://github.com/bgutbook/bgutbook_ubuntu.git

    ```

    Then enter the directory and build the Docker image

    ```

    $ cd bgutbook_ubuntu

    $ docker build -t bgutbook_ubuntu .

    ```

    Now Docker will create an image called bgutbook_ubuntu and store it in your system.
    At this point you are ready to run it whenever you want to follow along the examples
    of the book. Exit the directory with the Dockerfile, clone the repository with
    the example files, enter that directory and run Docker. The commands are

    ```

    $ cd ..

    $ git clone https://github.com/bgutbook/bgutbook_files.git

    $ cd bgutbook_files

    $ docker run -t -i -v $(pwd):/opt/bgutbook_files bgutbook_ubuntu /bin/bash

    root@1d888c92ee76:/#

    ```

    As you can see the prompt changes, which tells you that you are inside the Linux
    container. Please note that the number that follows the @ sign in the prompt is
    the ID of the running Docker container, so it will be different for you. At that
    point move to the directory that contains the example files inside the container

    ```

    root@1d888c92ee76:/# cd /opt/bgutbook_files/

    root@1d888c92ee76:/opt/bgutbook_files#

    ```

    From here you are ready to start reading the book and run the examples. Whenever
    you want to exit you just need to type exit and Enter. When you want to go on
    you just need to follow again the process, skipping the git clone part. That is

    ```

    $ cd bgutbook_files

    $ docker run -t -i -v $(pwd):/opt/bgutbook_files bgutbook_ubuntu /bin/bash

    root@1d888c92ee76:/#

    cd /opt/bgutbook_files/

    root@1d888c92ee76:/opt/bgutbook_files#

    ```


    ## Part 1 - Basic commands

    ### Day 1 - Getting help

    > Help me, Obi-Wan Kenobi. You are my only hope.

    >

    > — Star Wars (1977)


    The most important part of a software is the documentation. Sadly, often our software
    doesn''t have good documentation, as "the fun" is in the code. We mostly enjoy
    developing a program that does something, not writing boring text. Fortunately
    for us, the Unix system and the people working in that environment have a great
    culture of documentation, and so the first thing you have to learn is how to find
    and read help on the commands you will learn. Welcome to the Unix manual pages,
    or *man pages* for short. Whenever you need help on a command you can run

    ```

    $ man <command>

    ```

    and enter a text-only (but very powerful, mind it) help system. To learn how to
    navigate the system let''s get help on a rather simple command that we will learn
    shortly, `echo`.

    ```

    $ man echo

    ```

    > ⚠️ If you are running Linux in a Docker container and you followed the simple
    solution you will not have man pages installed in your system, so you need to
    read them at https://manpages.ubuntu.com/. The search form is at the top right
    of the page.


    First of all, let me teach you some of the basic fundamentals of man page driving.
    You can move through the documentation with your arrow keys, down and up, and
    with the page down and page up keys to quickly scroll the whole page. Please note
    that, since manual pages are read-only, there is no cursor, just a current line,
    which is the topmost one. A nice help text at the bottom of the screen lets you
    know that this is it

    ```

    Manual page echo(1) line 1/68 51% (press h for help or q to quit)

    ```

    Quitting programs can be surprisingly complex at times (ask any `vi` novice user),
    but man exits to the system with a simple `q` for quit. Try it, then enter the
    manual page for `echo` again. Phew! At least we won''t be trapped here forever.'
  mdcn: "\n### 致谢\n- 肯·汤普逊、丹尼斯·里奇、布莱恩·柯林汉等人编写了Unix操作系统。\n- 林纳斯·托瓦兹以及所有内核开发者编写了Linux内核。\n\
    - 斯蒂芬·伯恩开发了Bourne Shell，布莱恩·福克斯开发了Bourne-again Shell（bash），还有无数人为这些出色的工具做出了贡献。\n\
    - 理查德·斯托曼以及所有参与GNU项目的人，他们将Unix工具移植到了GNU系统中。\n- 马赫特尔特·加雷尔斯撰写的《Bash初学者指南》非常出色，它多次帮我解决了燃眉之急。\n\
    - 卢卡什·迪杰季奇开发了免费的“Lato”字体（[拉托字体](http://www.latofonts.com)），本书封面使用了该字体。封面照片由[pxhere图库](https://pxhere.com/en/photo/175470)提供，已对照片的局部进行了提取和编辑。\n\
    作为伦敦的通勤者，我每天在车站和公共交通上花好几个小时，即便是这些地方也能展现出别样的美感。这本书大部分内容都是在26路公交车上利用早上的时间写的，要是现在本书里的错别字比正文内容还多，你就知道原因了。\n\
    \n### 资料来源\n我试图在这本书中提炼的知识来源数不胜数：无数人及其著作、各类论坛、Stack Overflow上的回答、大量实验、为了弄懂文件系统工作原理而格式化的几个硬盘分区，以及花费了数年时间进行的流程自动化工作。\n\
    虽然上述来源数量过多，无法逐一郑重提及，但我可以明确提供书中示例和练习所用的日志文件的来源。这是一份简化版的Apache日志文件，你可以从[此处](https://github.com/elastic/examples/blob/master/Common%20Data%20Formats/apache_logs/apache_logs)下载。\n\
    \n### 环境配置\n> 本章位于前言之后、第一章之前\n\n### 示例文件\n书中大量示例和练习使用的文本文件可在本书的GitHub页面获取，你只需要克隆该仓库即可访问这些文件。\n\
    ``` $ git clone https://github.com/bgutbook/bgutbook_files.git ```\n如果你不知道如何使用Git，可以在网上找到大量相关资源，也可以在该仓库的主页面下载仓库的压缩包版本。\n\
    \n### Linux用户\n如果你使用的是Linux系统，那么基本已经完成了环境配置。你只需要下载测试文件，并确保在克隆出的目录中运行示例和练习即可。将压缩包解压到你选择的目录中，然后通过终端进入该目录。如果你使用的是Gnome或KDE这类图形化桌面环境，通常在文件浏览器中可以找到“在此处打开终端”的选项。否则你也可以直接打开终端（KDE对应Konsole，GNOME对应GNOME终端，或任意其他终端模拟器），然后通过以下命令切换到目标目录：\n\
    ``` $ cd path/of/the/directory ```\n其中`path/of/the/directory`是你上一节中克隆的仓库的完整路径。恭喜，你已经准备就绪！\n\
    \n### Mac OS用户/Windows用户\n本书至少初期版本只会讲解Linux系统。Linux是绝大多数云解决方案所使用的操作系统，也是服务器上事实上的最普及的Unix系统，这就是我选择讲解它的合理原因。我个人电脑也在使用Linux，但大多数程序员使用的是Mac或Windows设备。\n\
    不讲解Mac OS的主要原因是其默认终端与Linux的对应终端并非100%兼容（因为Mac没有使用GNU工具集）。我没有Mac设备，而且即便我可以涵盖所有不同版本的工具集，我认为这对初学者来说也会非常难以承受。\n\
    不讲解Windows的主要原因是它甚至不是Unix系统。我知道新版本包含了某种Linux层，但我同样没有时间精力去研究这些系统。因此如果你使用的是Mac OS\
    \ X或Windows，你就需要在Docker容器中运行Linux。我会在这里提供两种不同的方案，第一种更简单，但会缺失系统的部分组件；第二种稍微复杂一些，但功能完整。\n\
    请注意，无论选择哪种方案，你都需要在系统中安装Docker，具体安装步骤可参考Docker官方文档⁹。如果你最初选择了简单方案，之后想尝试更完善的版本，也可以随时回来运行更复杂的方案。\n\
    \n### 简单方案\n你可以在Docker中运行默认的Ubuntu镜像。该镜像经过精简以减小体积，因此你会缺失Linux系统自带的一部分文档，也就是我们常说的“man手册（手册页）”。我们将在第一课中使用这些手册，我也建议读者通过它们学习命令的使用方法，因此如果你选择这个方案，每次需要查询命令帮助时都需要参考在线man手册。我会在书的相关章节中提及这些在线资源，所以现在不用担心。\n\
    要运行Ubuntu镜像，首先克隆包含示例文件的仓库，进入该目录后运行Docker，命令如下：\n``` $ git clone https://github.com/bgutbook/bgutbook_files.git\
    \ $ cd bgutbook_files $ docker run -t -i -v $(pwd):/opt/bgutbook_files ubuntu\
    \ /bin/bash root@1d888c92ee76:/# cd /opt/bgutbook_files/ root@1d888c92ee76:/opt/bgutbook_files#\
    \ ```\n至此你已经可以开始阅读本书并运行示例了。想要退出时只需要输入exit并按下回车键即可。如果想要继续使用，只需要重复上述流程，跳过git clone步骤即可，具体命令如下：\n\
    ``` $ cd bgutbook_files $ docker run -t -i -v $(pwd):/opt/bgutbook_files ubuntu\
    \ /bin/bash root@1d888c92ee76:/# cd /opt/bgutbook_files/ root@1d888c92ee76:/opt/bgutbook_files#\
    \ ```\n\n### 进阶方案\n如果你需要一个自带man手册的Ubuntu容器，你需要创建一个新的Docker镜像。我在bgutbook_ubuntu仓库中提供了这类镜像的Dockerfile配置文件。\n\
    首先克隆该仓库：\n``` $ git clone https://github.com/bgutbook/bgutbook_ubuntu.git ```\n\
    然后进入目录并构建Docker镜像：\n``` $ cd bgutbook_ubuntu $ docker build -t bgutbook_ubuntu\
    \ . ```\n现在Docker会创建一个名为bgutbook_ubuntu的镜像并存储在你的系统中。至此你已经可以随时运行该镜像来跟随本书的示例了。退出存放Dockerfile的目录，克隆包含示例文件的仓库，进入该目录后运行Docker，命令如下：\n\
    ``` $ cd .. $ git clone https://github.com/bgutbook/bgutbook_files.git $ cd bgutbook_files\
    \ $ docker run -t -i -v $(pwd):/opt/bgutbook_files bgutbook_ubuntu /bin/bash root@1d888c92ee76:/#\
    \ ```\n如你所见，命令行提示符发生了变化，这说明你已经进入了Linux容器。请注意，提示符中@符号后面的数字是运行中的Docker容器的ID，因此你的提示符中的数字会和示例不同。此时切换到容器内存放示例文件的目录：\n\
    ``` root@1d888c92ee76:/# cd /opt/bgutbook_files/ root@1d888c92ee76:/opt/bgutbook_files#\
    \ ```\n至此你已经可以开始阅读本书并运行示例了。想要退出时只需要输入exit并按下回车键即可。如果想要继续使用，只需要重复上述流程，跳过git clone步骤即可，具体命令如下：\n\
    ``` $ cd bgutbook_files $ docker run -t -i -v $(pwd):/opt/bgutbook_files bgutbook_ubuntu\
    \ /bin/bash root@1d888c92ee76:/# cd /opt/bgutbook_files/ root@1d888c92ee76:/opt/bgutbook_files#\
    \ ```\n\n## 第一部分 - 基础命令\n### 第1天 - 获取帮助\n> 欧比旺，帮帮我，你是我唯一的希望。\n> \n> ——《星球大战》（1977）\n\
    \n软件最重要的部分就是文档。遗憾的是，我们开发的软件往往没有完善的文档，因为“乐趣都在代码里”。我们大多喜欢开发能实现特定功能的程序，而不是撰写枯燥的文字。\n\
    好在Unix系统以及在这个环境下工作的人有着非常出色的文档文化，因此你要学的第一件事就是如何查找和阅读你将要学习的命令的帮助信息。欢迎来到Unix手册页，简称*man手册页*。\n\
    每当你需要查询某个命令的帮助时，你可以运行\n``` $ man <command> ```\n然后进入一个纯文本（但功能非常强大，请注意）的帮助系统。为了学习如何在这个系统中导航，我们来查询一个很快就会学到的简单命令`echo`的帮助。\n\
    ``` $ man echo ```\n> ⚠️ 如果你在Docker容器中运行Linux，并且选择了简单方案，那么你的系统不会安装man手册页，因此你需要到https://manpages.ubuntu.com/阅读相关手册。页面的右上角有搜索框。\n\
    \n首先，我来教你一些man手册页操作的基础知识。你可以用上下方向键在文档中移动，也可以用翻页键快速滚动整个页面。请注意，由于手册页是只读的，所以没有光标，只有当前行，也就是最顶部的那一行。屏幕底部的帮助文本会提示你当前的状态：\n\
    ``` Manual page echo(1) line 1/68 51% (press h for help or q to quit) ```\n退出程序有时会异常复杂（随便问个`vi`新手就知道了），但退出man手册只需要按下代表退出的`q`键即可。试试看，然后再次进入`echo`的手册页。呼！至少我们不会永远被困在这里了。\n"
