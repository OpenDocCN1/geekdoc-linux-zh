  md: 'Linux desktop usage is still in the digits. However, in comparison, Linux actually
    bested both Windows and macOS for growth in April.


    The numbers paint an interesting picture, one that points directly to Ubuntu.
    During the month of April, Ubuntu gained 1.61 percent (from 0.27 to 1.88 percent)
    market-share, while Linux as a whole gained 1.51 percent (from 1.36 to 2.87 percent).
    This happens to coincide with the release of Ubuntu 20.04 (https://releases.ubuntu.com/20.04/),
    which has been met with rave reviews across the board.


