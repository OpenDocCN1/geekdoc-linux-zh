  md: '# SERVICE


    Back Issues


    # LINUX


    NEWSSTAND Order online:


    https://bit.ly/Linux-Newsstand


    Linux Magazine is your guide to the world of Linux. Monthly issues are packed
    with advanced technical articles and tutorials you won''t find anywhere else.
    Explore our full catalog of back issues for specific topics or to complete your
    collection.


    # #235/June 2020


    What''s New in Systemd


    Systemd is a mystery that keeps on giving. Now a new feature of the leading Linux
    init system will change the way you think about user home directories. This month
    we take a closer look at systemd-homed.


    On the DVD: Knoppix 8.6.1 and OpenMandriva Lx Plasma 4.1


    # #234/May 2020


    Edge Computing


    The Edge is a popular buzz word in high-tech news, but what does it mean really?
    We introduce you to an exciting new technology that could be changing the way
    we think about the cloud.


    On the DVD: Manjaro 19.02 Gnome Edition and SystemRescueCd 6.1'
  merge: -1
  pgno: 511
- img_proc: true
  md: '# #233/April 2020


    Stream to Your TV


    The line between computers and television blurred long ago, but the new tools
    and new ideas keep coming. This month we highlight some innovative apps for multimedia
    in Linux, including Gnome Cast for TV, and the easy-to-use Servizio media server.


    On the DVD: The Complete Raspberry Pi Geek Archive


    # #232/March 2020


    Stop Ads


    Browser-based ad-blockers are useful for controlling many types of pop-ups and
    banners, but they are less effective with ads built into applications. We look
    at a couple of alternative tools for blocking ads at the network level: Pi-hole
    and Privoxy.


    On the DVD: GParted 1.0.0 and Kali Linux 2019.4


    # #231/February 2020


    Tiling


    Are tiling window managers still relevant for today’s desktop? We explore the
    possibilities of the tiling paradigm with a modern Linux built for tiling.


    On the DVD: MX Linux MX-19 and Zorin OS 15 Core


    # #230/January 2020


    Automation Tricks'
  merge: -1
  pgno: 512
- img_proc: true
  md: 'Home automation is no longer the stuff of science fiction. We explore some
