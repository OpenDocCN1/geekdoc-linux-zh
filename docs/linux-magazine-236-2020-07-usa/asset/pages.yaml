  md: '# COVER STORY


    # Semantic File Organization


    # Reinventing file storage based on semantic tagging Tag It!


    Assigning file names based on defined criteria saves time and maximizes your chances
    of finding the file later. By Karl Voit Everyone is familiar with the problem
    of losing data neatly stored on your own computer. Navigating through countless
    directories does not lead to the desired result, because the data you are searching
    for might be in a file with a random name – or a name you thought was logical
    at the time but proved for-gettable later.


    A full-text search would seem to offer a remedy, but full-text search usually
    requires additional – and often quite considerable – resources. Moreover, despite
    a sophisticated full-text search, you might overlook the desired document in the
    flood of results if the keywords are too broadly defined.


    Many studies show that almost all computer users have experienced this situation.


    This problem is often not due to having a bad memory, or a lack of computer skills,
    but is instead attributable to the design of modern environments.


    All too often, the environment requires the user to adapt to the computer, rather
    than the computer adapting to the situation.


    The foundations of “modern” file management were laid by developers in the middle
    of the last century. Nevertheless, today’s systems follow largely the same prem-ises.
    The concept of nested directories was introduced to make it easier to manage a
    few'
