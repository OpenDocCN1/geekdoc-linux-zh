  md: '# ### 6.3.2 Accessing Devices by Opening Files


    How do you use these devices? In the case of character devices, it can be quite
    simple: Open the device as if it were a normal file, and read from or write to
    it. You can even use normal file commands such as cat, or your shell''s redirection
    syntax, to send data to or from the device.


    For example, if you have a printer connected to your computer''s first parallel
    port, you can print files by sending them directly to /dev/lp0.[^1] To print the
    contents of document.txt, invoke the following:


    ```

    % cat document.txt > /dev/lp0

    ```


    You must have permission to write to the device entry for this to succeed; on
    many GNU/Linux systems, the permissions are set so that only root and the system''s
    printer daemon (lpd) can write to the file. Also, what comes out of your printer
    depends on how your printer interprets the contents of the data you send it. Some
    printers will print plain text files that are sent to them,[^2] while others will
    not. PostScript printers will render and print PostScript files that you send
    to them.


    In a program, sending data to a device is just as simple. For example, this code
    fragment uses low-level I/O functions to send the contents of a buffer to /dev/lp0.


    ```

    int fd = open ("/dev/lp0", O_WRONLY);

    write (fd, buffer, buffer_length);

    close (fd);

    ```


    # ## 6.4 Hardware Devices


    Some common block devices are listed in Table 6.1. Device numbers for similar
    devices follow the obvious pattern (for instance, the second partition on the
    first SCSI drive is /dev/sda2). It''s occasionally useful to know which devices
    these device names correspond to when examining mounted file systems in /proc/mounts
    (see Section 7.5, "Drives, Mounts, and File Systems," in Chapter 7, for more about
    this).


    | Device | Name | Major | Minor |

    |--------|------|-------|-------|

    | First floppy drive | /dev/fd0 | 2 | 0 |

    | Second floppy drive | /dev/fd1 | 2 | 1 |

    | Primary IDE controller, master device | /dev/hda | 3 | 0 |

    | Primary IDE controller, master device, first partition | /dev/hda1 | 3 | 1 |


    *continues*


    +   1. Windows users will recognize that this device is similar to the magic Windows
    file LPR1.

    2. Your printer may require explicit carriage return characters, ASCII code 14,
    at the end of each line, and may require a form feed character, ASCII code 12,
    at the end of each page.'
