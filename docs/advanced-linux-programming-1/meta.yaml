  md: "# 2.2.3 Error Codes from System Calls\n\nA majority of system calls return\
    \ zero if the operation succeeds, or a nonzero value if the operation fails. (Many,\
    \ though, have different return value conventions; for instance, malloc returns\
    \ a null pointer to indicate failure. Always read the man page carefully when\
    \ using a system call.) Although this information may be enough to determine whether\
    \ the program should continue execution as usual, it probably does not provide\
    \ enough information for a sensible recovery from errors.\n\nMost system calls\
    \ use a special variable named errno to store additional information in case of\
    \ failure.² When a call fails, the system sets errno to a value indicating what\
    \ went wrong. Because all system calls use the same errno variable to store error\
    \ information, you should copy the value into another variable immediately after\
    \ the failed call. The value of errno will be overwritten the next time you make\
    \ a system call.\n\nError values are integers; possible values are given by preprocessor\
    \ macros, by convention named in all capitals and starting with \"E\"—for example,\
    \ EACCES and EINVAL. Always use these macros to refer to errno values rather than\
    \ integer values. Include the <errno.h> header if you use errno values.\n\nGNU/Linux\
    \ provides a convenient function, strerror, that returns a character string description\
    \ of an errno error code, suitable for use in error messages. Include <string.h>\
    \ if you use strerror.\n\nGNU/Linux also provides perror, which prints the error\
    \ description directly to the stderr stream. Pass to perror a character string\
    \ prefix to print before the error description, which should usually include the\
    \ name of the function that failed. Include <stdio.h> if you use perror.\n\nThis\
    \ code fragment attempts to open a file; if the open fails, it prints an error\
    \ message and exits the program. Note that the open call returns an open file\
    \ descriptor if the open operation succeeds, or −1 if the operation fails.\n\n\
    ```\nfd = open (\"inputfile.txt\", O_RDONLY);\nif (fd == -1) {\n    /* The open\
    \ failed.  Print an error message and exit.  */\n    fprintf (stderr, \"error\
    \ opening file: %s\\n\", strerror (errno));\n    exit (1);\n}\n```\n\nDepending\
    \ on your program and the nature of the system call, the appropriate action in\
    \ case of failure might be to print an error message, to cancel an operation,\
    \ to abort the program, to try again, or even to ignore the error. It's important,\
    \ though, to include logic that handles all possible failure modes in some way\
    \ or another.\n\n² Actually, for reasons of thread safety, errno is implemented\
    \ as a macro, but it is used like a global variable."
