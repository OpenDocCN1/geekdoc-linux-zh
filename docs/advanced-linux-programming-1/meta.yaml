  md: 'These are the functions in `server.c`:


    +   - `server_run` is the main entry point for running the server. This function
    starts the server and begins accepting connections, and does not return unless
    a serious error occurs. The server uses a TCP stream server socket (see Section
    5.5.3, “Servers,” in Chapter 5, “Interprocess Communication”).

    - `handle_connection` processes a single client connection, using the socket file
    descriptor passed as its argument. This function reads data from the socket and
    attempts to interpret this as an HTTP page request.


    The first argument to `server_run` specifies the local address at which connections
    are accepted. A GNU/Linux computer may have multiple network addresses, and each
    address may be bound to a different network interface. To restrict the server
    to accept connections from a particular interface, specify the corresponding network
    address. Specify the local address `INADDR_ANY` to accept connections for any
    local address.


    The second argument to `server_run` is the port number on which to accept connections.
    If the port number is already in use, or if it corresponds to a privileged port
    and the server is not being run with superuser privilege, the server fails. The
    special value 0 instructs Linux to select an unused port automatically. See the
    `inet` man page for more information about Internet-domain addresses and port
    numbers.


    The server handles each client connection in a child process created with `fork`
    (see Section 3.2.2, “Using fork and exec,” in Chapter 3, “Processes”). The main
    (parent) process continues accepting new connections while existing ones are being
    serviced. The child process invokes `handle_connection` and then closes the connection
    socket and exits.


    +   - `handle_connection` processes a single client connection, using the socket
    file descriptor passed as its argument. This function reads data from the socket
    and attempts to interpret this as an HTTP page request.


    The server processes only HTTP version 1.0 and version 1.1 requests. When faced
    with a different protocol or version, it responds by sending the HTTP result code
    400 and the message `bad_request_response`. The server understands only the HTTP
    GET method. If the client requests any other method, the server responds by sending
