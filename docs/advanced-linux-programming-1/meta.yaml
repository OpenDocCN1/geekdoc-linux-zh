  md: '162 Chapter 7 The /proc File System


    # 7.5.2 Drives and Partitions


    The /proc file system includes information about devices connected to both IDE
    controllers and SCSI controllers (if the system includes them).

    On typical systems, the /proc/ide subdirectory may contain either or both of two
    subdirectories, ide0 and ide1, corresponding to the primary and secondary IDE
    controllers on the system. These contain further subdirectories corresponding
    to physical devices attached to the controllers. The controller or device directories
    may be absent if Linux has not recognized any connected devices. The full paths
    corresponding to the four possible IDE devices are listed in Table 7.1.


    Table 7.1 **Full Paths Corresponding to the Four Possible IDE Devices**


    | Controller | Device | Subdirectory |

    | :--- | :--- | :--- |

    | Primary | Master | /proc/ide/ide0/hda/ |

    | Primary | Slave | /proc/ide/ide0/hdb/ |

    | Secondary | Master | /proc/ide/ide1/hdc/ |

    | Secondary | Slave | /proc/ide/ide1/hdd/ |


    See Section 6.4, “Hardware Devices,” for more information about IDE device names.

    Each IDE device directory contains several entries providing access to identification
    and configuration information for the device. A few of the most useful are listed
    here:


    +   - model contains the device’s model identification string.

    - media contains the device’s media type. Possible values are disk, cdrom, tape,
    floppy, and UNKNOWN.

    - capacity contains the device’s capacity, in 512-byte blocks. Note that for CD-ROM
    devices, the value will be 2^31 -1, not the capacity of the disk in the drive.
    Note that the value in capacity represents the capacity of the entire physical
    disk; the capacity of file systems contained in partitions of the disk will be
