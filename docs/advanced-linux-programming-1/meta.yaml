  md: "Here's how the timestamp program works:\n    % ./timestamp tsfile\n    % cat\
    \ tsfile\n    Thu Feb  1 23:25:20 2001\n    % ./timestamp tsfile\n    % cat tsfile\n\
    \    Thu Feb  1 23:25:20 2001\n    Thu Feb  1 23:25:47 2001\n\nNote that the first\
    \ time we invoke timestamp, it creates the file tsfile, while the second time\
    \ it appends to it.\n\nThe write call returns the number of bytes that were actually\
    \ written, or -1 if an error occurred. For certain kinds of file descriptors,\
    \ the number of bytes actually written may be less than the number of bytes requested.\
    \ In this case, it's up to you to call write again to write the rest of the data.\
    \ The function in Listing B.3 demonstrates how you might do this. Note that for\
    \ some applications, you may have to check for special conditions in the middle\
    \ of the writing operation. For example, if you're writing to a network socket,\
    \ you'll have to augment this function to detect whether the network connection\
    \ was closed in the middle of the write operation, and if it has, to react appropriately.\n\
    \n```\nListing B.3  (write-all.c) Write All of a Buffer of Data\n/* Write all\
    \ of COUNT bytes from BUFFER to file descriptor FD.\n   Returns -1 on error, or\
    \ the number of bytes written.  */\n\nssize_t write_all (int fd, const void* buffer,\
    \ size_t count)\n{\n  size_t left_to_write = count;\n  while (left_to_write >\
    \ 0) {\n    size_t written = write (fd, buffer, count);\n    if (written == -1)\n\
    \      /* An error occurred; bail.  */\n      return -1;\n    else\n      /* Keep\
    \ count of how much more we need to write.  */\n      left_to_write -= written;\n\
    \  }\n  /* We should have written no more than COUNT bytes!  */\n  assert (left_to_write\
    \ == 0);\n  /* The number of bytes written is exactly COUNT.  */\n  return count;\n\
    }\n```"
