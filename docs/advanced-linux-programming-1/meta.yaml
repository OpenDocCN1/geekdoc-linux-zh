  md: '# B.1 Reading and Writing Data


    The first I/O function you likely encountered when you first learned the C language
    was `printf`. This formats a text string and then prints it to standard output.
    The generalized version, `fprintf`, can print the text to a stream other than
    standard output. A stream is represented by a `FILE*` pointer. You obtain a `FILE*`
    pointer by opening a file with `fopen`. When you''re done, you can close it with
    `fclose`. In addition to `fprintf`, you can use such functions as `fputc`, `fputs`,
    and `fwrite` to write data to the stream, or `fscanf`, `fgetc`, `fgets`, and `fread`
    to read data.


    With the Linux low-level I/O operations, you use a handle called a *file descriptor*
    instead of a `FILE*` pointer. A file descriptor is an integer value that refers
    to a particular instance of an open file in a single process. It can be open for
    reading, for writing, or for both reading and writing. A file descriptor doesn''t
    have to refer to an open file; it can represent a connection with another system
    component that is capable of sending or receiving data. For example, a connection
    to a hardware device is represented by a file descriptor (see Chapter 6, "Devices"),
    as is an open socket (see Chapter 5, "Interprocess Communication," Section 5.5,
    "Sockets") or one end of a pipe (see Section 5.4, "Pipes").


    Include the header files `<fcntl.h>`, `<sys/types.h>`, `<sys/stat.h>`, and `<unistd.h>`
    if you use any of the low-level I/O functions described here.


    # B.1.1 Opening a File


    To open a file and produce a file descriptor that can access that file, use the
    `open` call. It takes as arguments the path name of the file to open, as a character
    string, and flags specifying how to open it. You can use `open` to create a new
    file; if you do, pass a third argument that specifies the access permissions to
    set for the new file.


    If the second argument is `O_RDONLY`, the file is opened for reading only; an
    error will result if you subsequently try to write to the resulting file descriptor.
    Similarly, `O_WRONLY` causes the file descriptor to be write-only. Specifying
    `O_RDWR` produces a file descriptor that can be used both for reading and for
    writing. Note that not all files may be opened in all three modes. For instance,
    the permissions on a file might forbid a particular process from opening it for
    reading or for writing; a file on a read-only device such as a CD-ROM drive may
    not be opened for writing.'
