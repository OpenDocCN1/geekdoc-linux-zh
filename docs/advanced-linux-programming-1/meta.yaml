    \n# 4.5.1   Signal Handling\n\nSuppose that a multithreaded program receives a\
    \ signal. In which thread is the signal handler invoked? The behavior of the interaction\
    \ between signals and threads varies from one UNIX-like system to another. In\
    \ GNU/Linux, the behavior is dictated by the fact that threads are implemented\
    \ as processes.\n\nBecause each thread is a separate process, and because a signal\
    \ is delivered to a particular process, there is no ambiguity about which thread\
    \ receives the signal. Typically, signals sent from outside the program are sent\
    \ to the process corresponding to the main thread of the program. For instance,\
    \ if a program forks and the child process execs a multithreaded program, the\
    \ parent process will hold the process id of the main thread of the child process’s\
    \ program and will use that process id to send signals to its child. This is generally\
    \ a good convention to follow yourself when sending signals to a multithreaded\
    \ program.\n\nNote that this aspect of GNU/Linux’s implementation of pthreads\
    \ is at variance with the POSIX thread standard. Do not rely on this behavior\
    \ in programs that are meant to be portable.\n\nWithin a multithreaded program,\
    \ it is possible for one thread to send a signal specifically to another thread.\
