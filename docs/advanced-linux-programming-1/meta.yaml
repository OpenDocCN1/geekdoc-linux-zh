    # ### 4.4.4 Nonblocking Mutex Tests


    Occasionally, it is useful to test whether a mutex is locked without actually
    blocking on it. For instance, a thread may need to lock a mutex but may have other
    work to do instead of blocking if the mutex is already locked. Because `pthread_mutex_lock`
    will not return until the mutex becomes unlocked, some other function is necessary.


    GNU/Linux provides `pthread_mutex_trylock` for this purpose. If you call `pthread_mutex_trylock`
    on an unlocked mutex, you will lock the mutex as if you had called `pthread_mutex_lock`,
    and `pthread_mutex_trylock` will return zero. However, if the mutex is already
    locked by another thread, `pthread_mutex_trylock` will not block. Instead, it
    will return immediately with the error code `EBUSY`. The mutex lock held by the
    other thread is not affected. You may try again later to lock the mutex.


    # ### 4.4.5 Semaphores for Threads


    In the preceding example, in which several threads process jobs from a queue,
    the main thread function of the threads carries out the next job until no jobs
    are left and then exits the thread. This scheme works if all the jobs are queued
    in advance or if new jobs are queued at least as quickly as the threads process
    them. However, if the threads work too quickly, the queue of jobs will empty and
    the threads will exit. If new jobs are later enqueued, no threads may remain to
    process them. What we might like instead is a mechanism for blocking the threads
    when the queue empties until new jobs become available.


    A *semaphore* provides a convenient method for doing this. A semaphore is a counter
    that can be used to synchronize multiple threads. As with a mutex, GNU/Linux guarantees
    that checking or modifying the value of a semaphore can be done safely, without
    creating a race condition.


    Each semaphore has a counter value, which is a non-negative integer. A semaphore
    supports two basic operations:


    +   - A *wait* operation decrements the value of the semaphore by 1. If the value
    is already zero, the operation blocks until the value of the semaphore becomes
    positive (due to the action of some other thread). When the semaphore''s value
    becomes positive, it is decremented by 1 and the wait operation returns.


    +   - A *post* operation increments the value of the semaphore by 1. If the semaphore
    was previously zero and other threads are blocked in a wait operation on that
    semaphore, one of those threads is unblocked and its wait operation completes
    (which brings the semaphore''s value back to zero).'
