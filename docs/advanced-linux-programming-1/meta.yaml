  md: "# Listing 7.3 (*print-arg-list.c*) Print the Argument List of a Running Process\n\
    \n```\n#include <fcntl.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include <sys/stat.h>\n\
    #include <sys/types.h>\n#include <unistd.h>\n\n/* Prints the argument list, one\
    \ argument to a line, of the process\n   given by PID.  */\n\nvoid print_process_arg_list\
    \ (pid_t pid)\n{\n  int fd;\n  char filename[24];\n  char arg_list[1024];\n  size_t\
    \ length;\n  char* next_arg;\n\n  /* Generate the name of the cmdline file for\
    \ the process. */\n  snprintf (filename, sizeof (filename), \"/proc/%d/cmdline\"\
    , (int) pid);\n  /* Read the contents of the file. */\n  fd = open (filename,\
    \ O_RDONLY);\n  length = read (fd, arg_list, sizeof (arg_list));\n  close (fd);\n\
    \  /* read does not NUL-terminate the buffer, so do it here. */\n  arg_list[length]\
