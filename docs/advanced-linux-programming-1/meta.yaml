  md: 'However, in current versions of Linux, these two system calls actually do the
    same thing, both updating the file''s modification time.


    The `fsync` system call enables you to force a buffer write explicitly. You can
    also open a file for *synchronous I/O*, which causes all writes to be committed
    to disk immediately. To do this, specify the `O_SYNC` flag when opening the file
    with the `open` call.


    # 8.5 *getrlimit* and *setrlimit*: Resource Limits


    The `getrlimit` and `setrlimit` system calls allow a process to read and set limits
    on the system resources that it can consume. You may be familiar with the `ulimit`
    shell command, which enables you to restrict the resource usage of programs you
    run;⁴ these system calls allow a program to do this programmatically.


    For each resource there are two limits, the *hard limit* and the *soft limit*.
    The soft limit may never exceed the hard limit, and only processes with superuser
    privilege may change the hard limit. Typically, an application program will reduce
    the soft limit to place a throttle on the resources it uses.


    Both `getrlimit` and `setrlimit` take as arguments a code specifying the resource
    limit type and a pointer to a `struct rlimit` variable. The `getrlimit` call fills
    the fields of this structure, while the `setrlimit` call changes the limit based
    on its contents. The `rlimit` structure has two fields: `rlim_cur` is the soft
    limit, and `rlim_max` is the hard limit.


    Some of the most useful resource limits that may be changed are listed here, with
    their codes:


    +   - `RLIMIT_CPU`—The maximum CPU time, in seconds, used by a program. This is
    the amount of time that the program is actually executing on the CPU, which is
