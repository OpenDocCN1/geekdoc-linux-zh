  md: '96 Chapter 5 Interprocess Communication


    the two with a *pipe*, represented by the "|" symbol. A pipe permits one-way communication
    between two related processes. The ls process writes data into the pipe, and the
    lpr process reads data from the pipe.


    In this chapter, we discuss five types of interprocess communication:


    +   - Shared memory permits processes to communicate by simply reading and writing
    to a specified memory location.

    - Mapped memory is similar to shared memory, except that it is associated with
    a file in the filesystem.

    - Pipes permit sequential communication from one process to a related process.

    - FIFOs are similar to pipes, except that unrelated processes can communicate
    because the pipe is given a name in the filesystem.

    - Sockets support communication between unrelated processes even on different
    computers.


    These types of IPC differ by the following criteria:


    +   - Whether they restrict communication to related processes (processes with
    a common ancestor), to unrelated processes sharing the same filesystem, or to
    any computer connected to a network

    - Whether a communicating process is limited to only write data or only read data

    - The number of processes permitted to communicate

    - Whether the communicating processes are synchronized by the IPC—for example,
    a reading process halts until data is available to read


    In this chapter, we omit discussion of IPC permitting communication only a limited
    number of times, such as communicating via a child''s exit value.


    # 5.1 Shared Memory


    One of the simplest interprocess communication methods is using shared memory.
    Shared memory allows two or more processes to access the same memory as if they
    all called malloc and were returned pointers to the same actual memory. When one
    process changes the memory, all the other processes see the modification.


    # 5.1.1 Fast Local Communication


    Shared memory is the fastest form of interprocess communication because all processes
    share the same piece of memory. Access to this shared memory is as fast as accessing
    a process''s nonshared memory, and it does not require a system call or entry
    to the kernel. It also avoids copying data unnecessarily.'
