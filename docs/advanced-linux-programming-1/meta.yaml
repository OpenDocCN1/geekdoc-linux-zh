  md: "A condition variable is represented by an instance of `pthread_cond_t`. Remember\
    \ that each condition variable should be accompanied by a mutex. These are the\
    \ functions that manipulate condition variables:\n\n+   - `pthread_cond_init`\
    \ initializes a condition variable. The first argument is a pointer to a `pthread_cond_t`\
    \ instance. The second argument, a pointer to a condition variable attribute object,\
    \ is ignored under GNU/Linux.\n\n  The mutex must be initialized separately, as\
    \ described in Section 4.4.2, \"Mutexes.\"\n\n- `pthread_cond_signal` signals\
    \ a condition variable. A single thread that is blocked on the condition variable\
    \ will be unblocked. If no other thread is blocked on the condition variable,\
    \ the signal is ignored. The argument is a pointer to the `pthread_cond_t` instance.\n\
    \n  A similar call, `pthread_cond_broadcast`, unblocks *all* threads that are\
    \ blocked on the condition variable, instead of just one.\n\n- `pthread_cond_wait`\
    \ blocks the calling thread until the condition variable is signaled. The argument\
    \ is a pointer to the `pthread_cond_t` instance. The second argument is a pointer\
    \ to the `pthread_mutex_t` mutex instance.\n\n  When `pthread_cond_wait` is called,\
    \ the mutex must already be locked by the calling thread. That function atomically\
    \ unlocks the mutex and blocks on the condition variable. When the condition variable\
    \ is signaled and the calling thread unblocks, `pthread_cond_wait` automatically\
    \ reacquires a lock on the mutex.\n\nWhenever your program performs an action\
    \ that may change the sense of the condition you're protecting with the condition\
    \ variable, it should perform these steps. (In our example, the condition is the\
    \ state of the thread flag, so these steps must be taken whenever the flag is\
    \ changed.)\n\n+   1. Lock the mutex accompanying the condition variable.\n2.\
    \ Take the action that may change the sense of the condition (in our example,\
    \ set the flag).\n3. Signal or broadcast the condition variable, depending on\
    \ the desired behavior.\n4. Unlock the mutex accompanying the condition variable.\n\
    \nListing 4.14 shows the previous example again, now using a condition variable\
    \ to protect the thread flag. Note that in `thread_function`, a lock on the mutex\
    \ is held before checking the value of `thread_flag`. That lock is automatically\
    \ released by `pthread_cond_wait` before blocking and is automatically reacquired\
    \ afterward. Also note that `set_thread_flag` locks the mutex before setting the\
    \ value of `thread_flag` and signaling the mutex."
