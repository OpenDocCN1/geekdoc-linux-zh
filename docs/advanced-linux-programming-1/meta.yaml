  md: "```\n# Default target: build everything.\nall:    server $(MODULES)\n\n# Clean\
    \ up build products.\nclean:\n\trm -f $(OBJECTS) $(MODULES) server\n\n# The main\
    \ server program.  Link with -Wl,-export-dynamic so\n# dynamically loaded modules\
    \ can bind symbols in the program.  Link in\n# libdl, which contains calls for\
    \ dynamic loading.\nserver: $(OBJECTS)\n\t$(CC) $(CFLAGS) -Wl,-export-dynamic\
    \ -o $@ $^ -ldl\n\n# All object files in the server depend on server.h.  But use\
    \ the\n# default rule for building object files from source files.\n$(OBJECTS):\
    \ server.h\n\n# Rule for building module shared libraries from the corresponding\n\
    # source files.  Compile -fPIC and generate a shared object file.\n$(MODULES):\
    \ \\\n%.so: %.c server.h\n\t$(CC) $(CFLAGS) -fPIC -shared -o $@ $<\n```\n\nThe\
    \ Makefile provides these targets:\n\n+   - **all** (the default if you invoke\
    \ `make` without arguments because it's the first target in the Makefile) includes\
    \ the `server` executable and all the modules. The modules are listed in the variable\
    \ `MODULES`.\n- **clean** deletes any build products that are produced by the\
    \ Makefile.\n- **server** links the server executable. The source files listed\
    \ in the variable `SOURCES` are compiled and linked in.\n- The last rule is a\
    \ generic pattern for compiling shared object files for server modules from the\
    \ corresponding source files.\n\nNote that source files for server modules are\
    \ compiled with the `-fPIC` option because they are linked into shared libraries\
    \ (see Section 2.3.2, “Shared Libraries,” in Chapter 2).\n\nAlso observe that\
    \ the `server` executable is linked with the `-Wl,-export-dynamic` compiler option.\
    \ With this option, GCC passes the `-export-dynamic` option to the linker, which\
    \ creates an executable file that also exports its external symbols as a shared\
    \ library. This allows modules, which are dynamically loaded as shared libraries,\
    \ to reference functions from `common.c` that are linked statically into the `server`\
    \ executable."
