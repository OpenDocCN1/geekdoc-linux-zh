    # # 7 The /proc File System


    TRY INVOKING THE mount COMMAND WITHOUT ARGUMENTS—this displays the file systems
    currently mounted on your GNU/Linux computer. You’ll see one line that looks like
    this:


    ```

    none on /proc type proc (rw)

    ```


    This is the special /proc file system. Notice that the first field, none, indicates
    that this file system isn’t associated with a hardware device such as a disk drive.
    Instead, /proc is a window into the running Linux kernel. Files in the /proc file
    system don’t correspond to actual files on a physical device. Instead, they are
    magic objects that behave like files but provide access to parameters, data structures,
    and statistics in the kernel. The “contents” of these files are not always fixed
    blocks of data, as ordinary file contents are. Instead, they are generated on
    the fly by the Linux kernel when you read from the file. You can also change the
    configuration of the running kernel by writing to certain files in the /proc file
    system. Let’s look at an example:


    ```

    % ls -l /proc/version

    -r--r--r-- 1 root root 0 Jan 17 18:09 /proc/version

    ```


    Note that the file size is zero; because the file’s contents are generated by
    the kernel, the concept of file size is not applicable. Also, if you try this
    command yourself, you’ll notice that the modification time on the file is the
    current time.'
