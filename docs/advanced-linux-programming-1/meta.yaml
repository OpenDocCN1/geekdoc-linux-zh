  md: "# 260 Appendix A Other Development Tools\n\nUsing various command options,\
    \ you can cause GCC to issue warnings about many different types of questionable\
    \ programming constructs. The -Wall option enables most of these checks. For example,\
    \ the compiler will produce a warning about a comment that begins within another\
    \ comment, about an incorrect return type specified for main, and about a non\
    \ void function omitting a return statement. If you specify the -pedantic option,\
    \ GCC emits warnings demanded by strict ANSI C and ISO C++ compliance. For example,\
    \ use of the GNU asm extension causes a warning using this option. A few GNU extensions,\
    \ such as using alternate keywords beginning with __ (two underscores), will not\
    \ trigger warning messages. Although the GCC info pages deprecate use of this\
    \ option, we recommend that you use it anyway and avoid most GNU language extensions\
    \ because GCC extensions tend to change through time and frequently interact poorly\
    \ with code optimization.\n\n```\nListing A.1 (hello.c) Hello World Program\n\n\
    main ()\n{\n    printf (\"Hello, world.\\n\");\n}\n```\n\nConsider compiling the\
    \ “Hello World” program shown in Listing A.1. Though GCC compiles the program\
    \ without complaint, the source code does not obey ANSI C rules. If you enable\
    \ warnings by compiling with the -Wall -pedantic, GCC reveals three questionable\
    \ constructs.\n\n```\n% gcc -Wall -pedantic hello.c\nhello.c:2: warning: return\
    \ type defaults to 'int'\nhello.c: In function 'main':\nhello.c:3: warning: implicit\
    \ declaration of function 'printf'\nhello.c:4: warning: control reaches end of\
    \ non-void function\n```\n\nThese warnings indicate that the following problems\
    \ occurred:\n\n+   - The return type for main was not specified.\n- The function\
    \ printf is implicitly declared because <stdio.h> is not included.\n- The function,\
    \ implicitly declared to return an int, actually returns no value.\n\nAnalyzing\
    \ a program's source code cannot find all programming mistakes and inefficiencies.\
    \ In the next section, we present four tools to find mistakes in using dynamically\
    \ allocated memory. In the subsequent section, we show how to analyze the program's\
    \ execution time using the gprof profiler."
