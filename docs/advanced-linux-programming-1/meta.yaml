  md: "# 5.5.1 Socket Concepts\n\nWhen you create a socket, you must specify three\
    \ parameters: communication style, namespace, and protocol.\n\nA communication\
    \ style controls how the socket treats transmitted data and specifies the number\
    \ of communication partners. When data is sent through a socket, it is packaged\
    \ into chunks called *packets*. The communication style determines how these packets\
    \ are handled and how they are addressed from the sender to the receiver.\n\n\
    +   - *Connection* styles guarantee delivery of all packets in the order they\
    \ were sent. If packets are lost or reordered by problems in the network, the\
    \ receiver automatically requests their retransmission from the sender.\n\n  A\
    \ connection-style socket is like a telephone call: The addresses of the sender\
    \ and receiver are fixed at the beginning of the communication when the connection\
    \ is established.\n\n- *Datagram* styles do not guarantee delivery or arrival\
    \ order. Packets may be lost or reordered in transit due to network errors or\
    \ other conditions. Each packet must be labeled with its destination and is not\
    \ guaranteed to be delivered. The system guarantees only \"best effort,\" so packets\
    \ may disappear or arrive in a different order than shipping.\n\n  A datagram-style\
    \ socket behaves more like postal mail. The sender specifies the receiver's address\
    \ for each individual message.\n\nA socket namespace specifies how *socket addresses*\
    \ are written. A socket address identifies one end of a socket connection. For\
    \ example, socket addresses in the \"local namespace\" are ordinary filenames.\
    \ In \"Internet namespace,\" a socket address is composed of the Internet address\
    \ (also known as an *Internet Protocol address* or *IP address*) of a host attached\
    \ to the network and a port number. The port number distinguishes among multiple\
    \ sockets on the same host.\n\nA protocol specifies how data is transmitted. Some\
    \ protocols are TCP/IP, the primary networking protocols used by the Internet;\
    \ the AppleTalk network protocol; and the UNIX local communication protocol. Not\
    \ all combinations of styles, namespaces, and protocols are supported.\n\n# 5.5.2\
    \ System Calls\n\nSockets are more flexible than previously discussed communication\
    \ techniques. These are the system calls involving sockets:\n\n```\nsocket—Creates\
    \ a socket\ncloses—Destroys a socket\nconnect—Creates a connection between two\
    \ sockets\nbind—Labels a server socket with an address\nlisten—Configures a socket\
    \ to accept conditions\naccept—Accepts a connection and creates a new socket for\
    \ the connection\n```\n\nSockets are represented by file descriptors."
