- img_proc: false
  md: 'The first argument is the name of the program to run; the second is its argument
    list, consisting of only a single element; and the third is its environment list,
    which strace omits for brevity. The next 30 or so lines are part of the mechanism
    that loads the standard C library from a shared library file.


    Toward the end are system calls that actually help do the program’s work. The
    uname system call is used to obtain the system’s hostname from the kernel,


    ```

    uname({sys="Linux", node="myhostname", ...}) = 0

    ```


    Observe that strace helpfully labels the fields (sys and node) of the structure
    argument. This structure is filled in by the system call—Linux sets the sys field
    to the operating system name and the node field to the system’s hostname. The
    uname call is discussed further in Section 8.15, “uname.”


    Finally, the write system call produces output. Recall that file descriptor 1
    corresponds to standard output. The third argument is the number of characters
    to write, and the return value is the number of characters that were actually
    written.


    ```

    write(1, "myhostname\n", 11)      = 11

    ```


    This may appear garbled when you run strace because the output from the hostname
    program itself is mixed in with the output from strace.


    If the program you’re tracing produces lots of output, it is sometimes more convenient
    to redirect the output from strace into a file. Use the option -o *filename* to
    do this.


    Understanding all the output from strace requires detailed familiarity with the
    design of the Linux kernel and execution environment. Much of this is of limited
    interest to application programmers. However, some understanding is useful for
    debugging tricky problems or understanding how other programs work.


    # 8.2  access: Testing File Permissions


    The access system call determines whether the calling process has access permission
    to a file. It can check any combination of read, write, and execute permission,
    and it can also check for a file’s existence.


    The access call takes two arguments. The first is the path to the file to check.
    The second is a bitwise or of R_OK, W_OK, and X_OK, corresponding to read, write,
    and execute permission. The return value is 0 if the process has all the specified
    permissions. If the file exists but the calling process does not have the specified
    permissions, access returns –1 and sets errno to EACCES (or EROFS, if write permission
    was requested for a file on a read-only file system).


    If the second argument is F_OK, access simply checks for the file’s existence.
    If the file exists, the return value is 0; if not, the return value is –1 and
    errno is set to ENOENT. Note that errno may instead be set to EACCES if a directory
    in the file path is inaccessible.'
