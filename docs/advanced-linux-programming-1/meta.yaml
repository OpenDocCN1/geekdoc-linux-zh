  md: "# ### 3.1.1 Process IDs\n\nEach process in a Linux system is identified by\
    \ its unique *process ID*, sometimes referred to as *pid*. Process IDs are 16-bit\
    \ numbers that are assigned sequentially by Linux as new processes are created.\n\
    \nEvery process also has a parent process (except the special `init` process,\
    \ described in Section 3.4.3, \"Zombie Processes\"). Thus, you can think of the\
    \ processes on a Linux system as arranged in a tree, with the `init` process at\
    \ its root. The *parent process ID*, or *ppid*, is simply the process ID of the\
    \ process's parent.\n\nWhen referring to process IDs in a C or C++ program, always\
    \ use the `pid_t` typedef, which is defined in `<sys/types.h>`. A program can\
    \ obtain the process ID of the process it's running in with the `getpid()` system\
    \ call, and it can obtain the process ID of its parent process with the `getppid()`\
    \ system call. For instance, the program in Listing 3.1 prints its process ID\
    \ and its parent's process ID.\n\n# #### Listing 3.1 (*print-pid.c*) Printing\
    \ the Process ID\n\n```\n#include <stdio.h>\n#include <unistd.h>\n\nint main ()\n\
    {\n  printf (\"The process ID is %d\\n\", (int) getpid ());\n  printf (\"The parent\
    \ process ID is %d\\n\", (int) getppid ());\n  return 0;\n}\n```\n\nObserve that\
    \ if you invoke this program several times, a different process ID is reported\
    \ because each invocation is in a new process. However, if you invoke it every\
    \ time from the same shell, the parent process ID (that is, the process ID of\
    \ the shell process) is the same.\n\n# ### 3.1.2 Viewing Active Processes\n\n\
    The `ps` command displays the processes that are running on your system. The GNU/Linux\
    \ version of `ps` has lots of options because it tries to be compatible with versions\
    \ of `ps` on several other UNIX variants. These options control which processes\
    \ are listed and what information about each is shown.\n\nBy default, invoking\
    \ `ps` displays the processes controlled by the terminal or terminal window in\
    \ which `ps` is invoked. For example:\n\n```\n% ps\n PID TTY      TIME CMD\n21693\
    \ pts/8  00:00:00 bash\n21694 pts/8  00:00:00 ps\n```"
