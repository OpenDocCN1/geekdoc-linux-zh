  md: 'You can specify additional options by using the bitwise or of this value with
    one or more flags. These are the most commonly used values:


    +   - Specify O_TRUNC to truncate the opened file, if it previously existed. Data
    written to the file descriptor will replace previous contents of the file.

    - Specify O_APPEND to append to an existing file. Data written to the file descriptor
    will be added to the end of the file.

    - Specify O_CREAT to create a new file. If the filename that you provide to open
    does not exist, a new file will be created, provided that the directory containing
    it exists and that the process has permission to create files in that directory.
    If the file already exists, it is opened instead.

    - Specify O_EXCL with O_CREAT to force creation of a new file. If the file already
    exists, the open call will fail.


    If you call open with O_CREAT, provide an additional third argument specifying
    the permissions for the new file. See Chapter 10, "Security," Section 10.3, "File
    System Permissions," for a description of permission bits and how to use them.


    For example, the program in Listing B.1 creates a new file with the filename specified
    on the command line. It uses the O_EXCL flag with open, so if the file already
    exists, an error occurs. The new file is given read and write permissions for
    the owner and owning group, and read permissions only for others. (If your umask
    is set to a nonzero value, the actual permissions may be more restrictive.)


    > **Umasks**


    When you create a new file with open, some permission bits that you specify may
    be turned off. This is because your umask is set to a nonzero value. A process''s
    umask specifies bits that are masked out of all newly created files'' permissions.
    The actual permissions used are the bitwise and of the permissions you specify
    to open and the bitwise complement of the umask.


    To change your umask from the shell, use the umask command, and specify the numerical
    value of the mask, in octal notation. To change the umask for a running process,
    use the umask call, passing it the desired mask value to use for subsequent open
    calls.


    For example, calling this line


    ```

    umask (S_IRWXO | S_IWGRP);

    ```


    in a program, or invoking this command


    ```

    % umask 027

    ```


    specifies that write permissions for group members and read, write, and execute
    permissions for others will always be masked out of a new file''s permissions.'
