    \ a device driver.\n\n# 6.5.1 /dev/null\n\nThe entry /dev/null, the *null device*,\
    \ is very handy. It serves two purposes; you are probably familiar at least with\
    \ the first one:\n\n+   - Linux discards any data written to /dev/null. A common\
    \ trick is to specify /dev/null as an output file in some context where the output\
    \ is unwanted.\n\n  For example, to run a command and discard its standard output\
    \ (without printing it or writing it to a file), redirect standard output to /dev/null:\n\
    \n  `% verbose_command > /dev/null`\n\n+   - Reading from /dev/null always results\
    \ in an end-of-file. For instance, if you open a file descriptor to /dev/null\
    \ using open and then attempt to read from the file descriptor, read will read\
    \ no bytes and will return 0. If you copy from /dev/null to another file, the\
    \ destination will be a zero-length file:\n\n```\n% cp /dev/null empty-file\n\
