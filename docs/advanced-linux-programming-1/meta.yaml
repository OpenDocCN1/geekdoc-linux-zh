  md: '# ### 5.1.8 Pros and Cons


    Shared memory segments permit fast bidirectional communication among any number
    of processes. Each user can both read and write, but a program must establish
    and follow some protocol for preventing race conditions such as overwriting information
    before it is read. Unfortunately, Linux does not strictly guarantee exclusive
    access even if you create a new shared segment with `IPC_PRIVATE`.


    Also, for multiple processes to use a shared segment, they must make arrangements
    to use the same key.


    # ## 5.2 Processes Semaphores


    As noted in the previous section, processes must coordinate access to shared memory.
    As we discussed in Section 4.4.5, "Semaphores for Threads," in Chapter 4, "Threads,"
    semaphores are counters that permit synchronizing multiple threads. Linux provides
    a distinct alternate implementation of semaphores that can be used for synchronizing
    processes (called process semaphores or sometimes System V semaphores). Process
    semaphores are allocated, used, and deallocated like shared memory segments. Although
    a single semaphore is sufficient for almost all uses, process semaphores come
    in sets. Throughout this section, we present system calls for process semaphores,
    showing how to implement single binary semaphores using them.


    # ### 5.2.1 Allocation and Deallocation


    The calls `semget` and `semctl` allocate and deallocate semaphores, which is analogous
    to `shmget` and `shmctl` for shared memory. Invoke `semget` with a key specifying
    a semaphore set, the number of semaphores in the set, and permission flags as
    for `shmget`; the return value is a semaphore set identifier. You can obtain the
    identifier of an existing semaphore set by specifying the right key value; in
    this case, the number of semaphores can be zero.


    Semaphores continue to exist even after all processes using them have terminated.
    The last process to use a semaphore set must explicitly remove it to ensure that
    the operating system does not run out of semaphores. To do so, invoke `semctl`
    with the semaphore identifier, the number of semaphores in the set, `IPC_RMID`
    as the third argument, and any union `semun` value as the fourth argument (which
    is ignored). The effective user ID of the calling process must match that of the
    semaphore''s allocator (or the caller must be `root`). Unlike shared memory segments,
    removing a semaphore set causes Linux to deallocate immediately.


    Listing 5.2 presents functions to allocate and deallocate a binary semaphore.'
