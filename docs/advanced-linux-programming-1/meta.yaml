    \ the -s option to sum the execution results from several different runs.\n- Use\
    \ the -c option to identify children that could have been called but were not.\n\
    - Use the -l option to display line-by-line profiling information.\n- Use the\
    \ -A option to display source code annotated with percentage execution numbers.\n\
    \nThe info pages also provide more information about the interpretation of the\
    \ analyzed data.\n\n# A.3.4 How *gprof* Collects Data\n\nWhen a profiled executable\
    \ runs, every time a function is called its count is also incremented. Also, gprof\
    \ periodically interrupts the executable to determine the currently executing\
