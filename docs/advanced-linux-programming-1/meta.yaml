  md: "Suppose, for example, that you call a function, `do_something`, repeatedly\
    \ in a loop. The `do_something` function returns zero on success and nonzero on\
    \ failure, but you don't expect it ever to fail in your program. You might be\
    \ tempted to write:\n\n```\nfor (i = 0; i < 100; ++i)\n    assert (do_something\
    \ () == 0);\n```\n\nHowever, you might find that this runtime check imposes too\
    \ large a performance penalty and decide later to recompile with `NDEBUG` defined.\
    \ This will remove the `assert` call entirely, so the expression will never be\
    \ evaluated and `do_something` will never be called. You should write this instead:\n\
    \n```\nfor (i = 0; i < 100; ++i) {\n    int status = do_something ();\n    assert\
    \ (status == 0);\n}\n```\n\nAnother thing to bear in mind is that you should not\
    \ use `assert` to test for invalid user input. Users don't like it when applications\
    \ simply crash with a cryptic error message, even in response to invalid input.\
    \ You should still always check for invalid input and produce sensible error messages\
    \ in response input. Use `assert` for internal runtime checks only.\n\nSome good\
    \ places to use `assert` are these:\n\n+   - Check against null pointers, for\
    \ instance, as invalid function arguments. The error message generated by `assert\
    \ (pointer != NULL)`,\n\n  `Assertion 'pointer != ((void *)0)' failed.`\n\n  is\
    \ more informative than the error message that would result if your program dereferenced\
    \ a null pointer:\n\n  `Segmentation fault (core dumped)`\n\n- Check conditions\
    \ on function parameter values. For instance, if a function should be called only\
    \ with a positive value for parameter `foo`, use this at the beginning of the\
    \ function body:\n\n  `assert (foo > 0);`\n\nThis will help you detect misuses\
    \ of the function, and it also makes it very clear to someone reading the function's\
    \ source code that there is a restriction on the parameter's value.\n\nDon't hold\
    \ back; use `assert` liberally throughout your programs."
