  md: '# 3.2.3 Process Scheduling


    Linux schedules the parent and child processes independently; there''s no guarantee
    of which one will run first, or how long it will run before Linux interrupts it
    and lets the other process (or some other process on the system) run. In particular,
    none, part, or all of the ls command may run in the child process before the parent
    completes.² Linux promises that each process will run eventually—no process will
    be completely starved of execution resources.


    You may specify that a process is less important—and should be given a lower priority—by
    assigning it a higher *niceness* value. By default, every process has a niceness
    of zero. A higher niceness value means that the process is given a lesser execution
    priority; conversely, a process with a lower (that is, negative) niceness gets
    more execution time.


    To run a program with a nonzero niceness, use the `nice` command, specifying the
    niceness value with the -n option. For example, this is how you might invoke the
    command "sort input.txt > output.txt", a long sorting operation, with a reduced
    priority so that it doesn''t slow down the system too much:


    ```

    % nice -n 10 sort input.txt > output.txt

    ```


    You can use the `renice` command to change the niceness of a running process from
    the command line.


    To change the niceness of a running process programmatically, use the `nice` function.
    Its argument is an increment value, which is added to the niceness value of the
    process that calls it. Remember that a positive value raises the niceness value
    and thus reduces the process''s execution priority.


    Note that only a process with root privilege can run a process with a negative
    niceness value or reduce the niceness value of a running process. This means that
    you may specify negative values to the `nice` and `renice` commands only when
    logged in as root, and only a process running as root can pass a negative value
    to the `nice` function. This prevents ordinary users from grabbing execution priority
    away from others using the system.


    # 3.3 Signals


    *Signals* are mechanisms for communicating with and manipulating processes in
    Linux. The topic of signals is a large one; here we discuss some of the most important
    signals and techniques that are used for controlling processes.


    A signal is a special message sent to a process. Signals are asynchronous; when
    a process receives a signal, it processes the signal immediately, without finishing
    the current function or even the current line of code. There are several dozen
    different signals, each with a different meaning. Each signal type is specified
    by its signal number, but in programs, you usually refer to a signal by its name.
    In Linux, these are defined in /usr/include/bits/signum.h. (You shouldn''t include
    this header file directly in your programs; instead, use `<signal.h>`.)'
  merge: -1
