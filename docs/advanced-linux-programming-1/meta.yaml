    of dynamic memory. How does a GNU/Linux programmer ensure that dynamic memory
    is correctly used? No tool guarantees diagnosing all errors, but using any of
    them does increase the probability of finding errors. To ease finding dynamically
    allocated memory errors, separately develop and test the code that deals with
    dynamic memory. This reduces the amount of code that you must search for errors.
    If you are using C++, write a class that handles all dynamic memory use. If you
    are using C, minimize the number of functions using allocation and deallocation.
