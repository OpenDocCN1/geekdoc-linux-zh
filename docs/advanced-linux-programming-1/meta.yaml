    \ in the usual way to find programs to execute. If the second argument is \"r\"\
    , the function returns the child process's standard output stream so that the\
    \ parent can read the output. If the second argument is \"w\", the function returns\
    \ the child process's standard input stream so that the parent can send data.\
    \ If an error occurs, popen returns a null pointer.\nCall pclose to close a stream\
    \ returned by popen. After closing the specified stream, pclose waits for the\
    \ child process to terminate.\n\n# 5.4.5 FIFOs\n\nA first-in, first-out (FIFO)\
    \ file is a pipe that has a name in the filesystem. Any process can open or close\
    \ the FIFO; the processes on either end of the pipe need not be related to each\
