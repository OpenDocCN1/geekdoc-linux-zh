- img_proc: false
  md: 'When a process receives a signal, it may do one of several things, depending
    on the signal''s *disposition*. For each signal, there is a *default disposition*,
    which determines what happens to the process if the program does not specify some
    other behavior. For most signal types, a program may specify some other behavior—either
    to ignore the signal or to call a special *signal-handler* function to respond
    to the signal. If a signal handler is used, the currently executing program is
    paused, the signal handler is executed, and, when the signal handler returns,
    the program resumes.


    The Linux system sends signals to processes in response to specific conditions.
    For instance, `SIGBUS` (bus error), `SIGSEGV` (segmentation violation), and `SIGFPE`
    (floating point exception) may be sent to a process that attempts to perform an
    illegal operation. The default disposition for these signals it to terminate the
    process and produce a core file.


    A process may also send a signal to another process. One common use of this mechanism
    is to end another process by sending it a `SIGTERM` or `SIGKILL` signal.³ Another
    common use is to send a command to a running program. Two "user-defined" signals
    are reserved for this purpose: `SIGUSR1` and `SIGUSR2`. The `SIGHUP` signal is
    sometimes used for this purpose as well, commonly to wake up an idling program
    or cause a program to reread its configuration files.


    The `sigaction` function can be used to set a signal disposition. The first parameter
    is the signal number. The next two parameters are pointers to `sigaction` structures;
    the first of these contains the desired disposition for that signal number, while
    the second receives the previous disposition. The most important field in the
    first or second `sigaction` structure is `sa_handler`. It can take one of three
    values:


    +   - `SIG_DFL`, which specifies the default disposition for the signal.

    - `SIG_IGN`, which specifies that the signal should be ignored.

    - A pointer to a signal-handler function. The function should take one parameter,
    the signal number, and return `void`.


    Because signals are asynchronous, the main program may be in a very fragile state
    when a signal is processed and thus while a signal handler function executes.
    Therefore, you should avoid performing any I/O operations or calling most library
    and system functions from signal handlers.


    A signal handler should perform the minimum work necessary to respond to the signal,
    and then return control to the main program (or terminate the program). In most
    cases, this consists simply of recording the fact that a signal occurred. The
    main program then checks periodically whether a signal has occurred and reacts
    accordingly.


    It is possible for a signal handler to be interrupted by the delivery of another
    signal. While this may sound like a rare occurrence, if it does occur, it will
    be very difficult to diagnose and debug the problem. (This is an example of a
    race condition, discussed in Chapter 4, "Threads," Section 4.4, "Synchronization
    and Critical Sections.") Therefore, you should be very careful about what your
    program does in a signal handler.


    ³ What''s the difference? The `SIGTERM` signal asks a process to terminate; the
    process may ignore the request by masking or ignoring the signal. The `SIGKILL`
    signal always kills the process immediately because the process may not mask or
    ignore `SIGKILL`.'
