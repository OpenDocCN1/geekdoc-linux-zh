  md: "# 4.2.2 U ncancelable Critical Sections\n\nA thread may disable cancellation\
    \ of itself altogether with the `pthread_setcancelstate` function. Like `pthread_setcanceltype`,\
    \ this affects the calling thread. The first argument is `PTHREAD_CANCEL_DISABLE`\
    \ to disable cancellation, or `PTHREAD_CANCEL_ENABLE` to re-enable cancellation.\
    \ The second argument, if not null, points to a variable that will receive the\
    \ previous cancellation state. This call, for instance, disables thread cancellation\
    \ in the calling thread.\n\n```\npthread_setcancelstate (PTHREAD_CANCEL_DISABLE,\
    \ NULL);\n```\n\nUsing `pthread_setcancelstate` enables you to implement *critical\
    \ sections*. A critical section is a sequence of code that must be executed either\
    \ in its entirety or not at all; in other words, if a thread begins executing\
    \ the critical section, it must continue until the end of the critical section\
    \ without being canceled.\n\nFor example, suppose that you're writing a routine\
    \ for a banking program that transfers money from one account to another. To do\
    \ this, you must add value to the balance in one account and deduct the same value\
    \ from the balance of another account. If the thread running your routine happened\
    \ to be canceled at just the wrong time between these two operations, the program\
    \ would have spuriously increased the bank's total deposits by failing to complete\
    \ the transaction. To prevent this possibility, place the two operations in a\
    \ critical section.\n\nYou might implement the transfer with a function such as\
    \ `process_transaction`, shown in Listing 4.6. This function disables thread cancellation\
    \ to start a critical section before it modifies either account balance.\n\n#\
    \ Listing 4.6  *(critical-section.c)* Protect a Bank Transaction with a Critical\
    \ Section\n\n```\n#include <pthread.h>\n#include <stdio.h>\n#include <string.h>\n\
    \n/* An array of balances in accounts, indexed by account number.  */\n\nfloat*\
    \ account_balances;\n\n/* Transfer DOLLARS from account FROM_ACCT to account TO_ACCT.\
    \  Return\n   0 if the transaction succeeded, or 1 if the balance FROM_ACCT is\n\
    \   too small.  */\n\nint process_transaction (int from_acct, int to_acct, float\
    \ dollars)\n{\n    int old_cancel_state;\n\n    /* Check the balance in FROM_ACCT.\
    \  */\n    if (account_balances[from_acct] < dollars)\n        return 1;\n```"
