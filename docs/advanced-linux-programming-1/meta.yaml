    \ /usr/dict/words'.  Allocate the\n    string dynamically to avoid buffer overruns.\
    \  */\n   length =\n     strlen (\"grep -x \") + strlen (word) + strlen (\" /usr/dict/words\"\
    ) + 1;\n   buffer = (char*) malloc (length);\n   sprintf (buffer, \"grep -x %s\
    \ /usr/dict/words\", word);\n\n   /* Run the command.  */\n   exit_code = system\
    \ (buffer);\n   /* Free the buffer.  */\n   free (buffer);\n   /* If grep returned\
    \ 0, then the word was present in the\n      dictionary.  */\n   return exit_code\
    \ == 0;\n}\n```\n\nNote that by calculating the number of characters we need and\
    \ then allocating the buffer dynamically, we're sure to be safe from buffer overruns.\n\
    \nUnfortunately, the use of the `system` function (described in Chapter 3, \"\
    Processes,\" Section 3.2.1, \"Using system\") is unsafe. This function invokes\
    \ the standard system shell to run the command and then returns the exit value.\
    \ But what happens if a malicious hacker sends a \"word\" that is actually the\
    \ following line or a similar string?\n\n```\nfoo /dev/null; rm -rf /\n```\n\n\
    In that case, the server will execute this command:\n\n```\ngrep -x foo /dev/null;\
    \ rm -rf / /usr/dict/words\n```\n\nNow the problem is obvious. The user has turned\
    \ one command, ostensibly the invocation of grep, into two commands because the\
    \ shell treats a semicolon as a command separator. The first command is still\
    \ a harmless invocation of grep, but the second removes all files on the entire\
    \ system! Even if the server is not running as root, all the files that can be\
    \ removed by the user running the server will be removed. The same problem can\
    \ arise with `popen` (described in Section 5.4.4, \"popen and pclose\"), which\
    \ creates a pipe between the parent and child process but still uses the shell\
    \ to run the command.\n\nThere are two ways to avoid these problems. One is to\
    \ use the `exec` family of functions instead of `system` or `popen`. That solution\
    \ avoids the problem because characters that the shell treats specially (such\
    \ as the semicolon in the previous command) are not treated specially when they\
    \ appear in the argument list to an `exec` call. Of course, you give up the convenience\
    \ of `system` and `popen`."
