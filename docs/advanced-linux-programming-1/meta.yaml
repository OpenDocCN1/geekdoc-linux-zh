  md: 'An address must be bound to the server''s socket using bind if a client is
    to find it. Its first argument is the socket file descriptor. The second argument
    is a pointer to a socket address structure; the format of this depends on the
    socket''s address family. The third argument is the length of the address structure,
    in bytes. When an address is bound to a connection-style socket, it must invoke
    listen to indicate that it is a server. Its first argument is the socket file
    descriptor. The second argument specifies how many pending connections are queued.
    If the queue is full, additional connections will be rejected. This does not limit
    the total number of connections that a server can handle; it limits just the number
    of clients attempting to connect that have not yet been accepted.


    A server accepts a connection request from a client by invoking accept. The first
    argument is the socket file descriptor. The second argument points to a socket
    address structure, which is filled with the client socket''s address. The third
    argument is the length, in bytes, of the socket address structure. The server
    can use the client address to determine whether it really wants to communicate
    with the client. The call to accept creates a new socket for communicating with
    the client and returns the corresponding file descriptor. The original server
    socket continues to accept new client connections. To read data from a socket
    without removing it from the input queue, use recv. It takes the same arguments
    as read, plus an additional FLAGS argument. A flag of MSG_PEEK causes data to
    be read but not removed from the input queue.


    # 5.5.4 Local Sockets


    Sockets connecting processes on the same computer can use the local namespace
    represented by the synonyms PF_LOCAL and PF_UNIX. These are called *local sockets*
    or *UNIX-domain sockets*. Their socket addresses, specified by filenames, are
    used only when creating connections.


    The socket''s name is specified in `struct sockaddr_un`. You must set the `sun_family`
    field to AF_LOCAL, indicating that this is a local namespace. The `sun_path` field
    specifies the filename to use and may be, at most, 108 bytes long. The actual
    length of `struct sockaddr_un` should be computed using the `SUN_LEN` macro. Any
    filename can be used, but the process must have directory write permissions, which
    permit adding files to the directory. To connect to a socket, a process must have
    read permission for the file. Even though different computers may share the same
    filesystem, only processes running on the same computer can communicate with local
    namespace sockets.


    The only permissible protocol for the local namespace is 0.


    Because it resides in a file system, a local socket is listed as a file. For example,
    notice the initial s:


    ```

    % ls -l /tmp/socket

    srwxrwxr-x 1 user group 0 Nov 13 19:18 /tmp/socket

    ```


    Call unlink to remove a local socket when you''re done with it.'
