  md: "Even assigning a value to a global variable can be dangerous because the assignment\
    \ may actually be carried out in two or more machine instructions, and a second\
    \ signal may occur between them, leaving the variable in a corrupted state. If\
    \ you use a global variable to flag a signal from a signal-handler function, it\
    \ should be of the special type `sig_atomic_t`. Linux guarantees that assignments\
    \ to variables of this type are performed in a single instruction and therefore\
    \ cannot be interrupted midway. In Linux, `sig_atomic_t` is an ordinary `int`;\
    \ in fact, assignments to integer types the size of `int` or smaller, or to pointers,\
    \ are atomic. If you want to write a program that's portable to any standard UNIX\
    \ system, though, use `sig_atomic_t` for these global variables.\n\nThis program\
    \ skeleton in Listing 3.5, for instance, uses a signal-handler function to count\
    \ the number of times that the program receives `SIGUSR1`, one of the signals\
    \ reserved for application use.\n\n# Listing 3.5 *(sigusr1.c)* Using a Signal\
    \ Handler\n\n```\n#include <signal.h>\n#include <stdio.h>\n#include <string.h>\n\
    #include <sys/types.h>\n#include <unistd.h>\n\nsig_atomic_t sigusr1_count = 0;\n\
    \nvoid handler (int signal_number)\n{\n  ++sigusr1_count;\n}\n\nint main ()\n\
    {\n  struct sigaction sa;\n  memset (&sa, 0, sizeof (sa));\n  sa.sa_handler =\
    \ &handler;\n  sigaction (SIGUSR1, &sa, NULL);\n\n  /* Do some lengthy stuff here.\
    \ */\n  /* ... */\n\n  printf (\"SIGUSR1 was raised %d times\\n\", sigusr1_count);\n\
    \  return 0;\n}\n```"
