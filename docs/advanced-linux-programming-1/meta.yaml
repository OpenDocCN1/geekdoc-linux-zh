  md: "# 1.2 Compiling with GCC\n\nA compiler turns human-readable source code into\
    \ machine-readable object code that can actually run. The compilers of choice\
    \ on Linux systems are all part of the GNU Compiler Collection, usually known\
    \ as GCC.³ GCC also include compilers for C, C++, Java, Objective-C, Fortran,\
    \ and Chill. This book focuses mostly on C and C++ programming.\n\nSuppose that\
    \ you have a project like the one in Listing 1.2 with one C++ source file (reciprocal.cpp)\
    \ and one C source file (main.c) like in Listing 1.1. These two files are supposed\
    \ to be compiled and then linked together to produce a program called reciprocal.⁴\
    \ This program will compute the reciprocal of an integer.\n\n```\nListing 1.1\
    \ (main.c) C source file—main.c\n\n#include <stdio.h>\n#include \"reciprocal.hpp\"\
    \n\nint main (int argc, char **argv)\n{\n  int i;\n\n  i = atoi (argv[1]);\n \
    \ printf (\"The reciprocal of %d is %g\\n\", i, reciprocal (i));\n  return 0;\n\
    }\n```\n\n```\nListing 1.2 (reciprocal.cpp) C++ source file—reciprocal.cpp\n\n\
    #include <cassert>\n#include \"reciprocal.hpp\"\n\ndouble reciprocal (int i) {\n\
    \  // I should be non-zero.\n  assert (i != 0);\n  return 1.0/i;\n}\n```\n\n3.\
    \ For more information about GCC, visit http://gcc.gnu.org.\n\n4. In Windows,\
    \ executables usually have names that end in .exe. Linux programs, on the other\
    \ hand, usually have no extension. So, the Windows equivalent of this program\
    \ would probably be called reciprocal.exe; the Linux version is just plain reciprocal."
