    root\n```\n\nThe whoami command is just like id, except that it shows only the\
    \ effective user ID, not all the other information. The su command enables you\
    \ to become the superuser if you know the root password.\nHow does su work? Because\
    \ we know that the shell was originally running with both its real user ID and\
