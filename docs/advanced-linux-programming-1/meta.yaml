  md: 'A FIFO can have multiple readers or multiple writers. Bytes from each writer
    are written atomically up to a maximum size of PIPE_BUF (4KB on Linux). Chunks
    from simultaneous writers can be interleaved. Similar rules apply to simultaneous
    reads.


    # Differences from Windows Named Pipes


    Pipes in the Win32 operating systems are very similar to Linux pipes. (Refer to
    the Win32 library documentation for technical details about these.) The main differences
    concern named pipes, which, for Win32, function more like sockets. Win32 named
    pipes can connect processes on separate computers connected via a network. On
    Linux, sockets are used for this purpose. Also, Win32 allows multiple reader-writer
    connections on a named pipe without interleaving data, and pipes can be used for
    two-way communication.³


    # 5.5 Sockets


    A socket is a bidirectional communication device that can be used to communicate
    with another process on the same machine or with a process running on other machines.
    Sockets are the only interprocess communication we''ll discuss in this chapter
    that permit communication between processes on different computers. Internet programs
    such as Telnet, rlogin, FTP, talk, and the World Wide Web use sockets.


    For example, you can obtain the WWW page from a Web server using the Telnet program
    because they both use sockets for network communications.⁴ To open a connection
    to a WWW server at www.codesourcery.com, use telnet www.codesourcery.com 80. The
    magic constant 80 specifies a connection to the Web server programming running
    www.codesourcery.com instead of some other process. Try typing GET / after the
    connection is established. This sends a message through the socket to the Web
    server, which replies by sending the home page''s HTML source and then closing
    the connection—for example:


    ```

    % telnet www.codesourcery.com 80

    Trying 206.168.99.1...

    Connected to merlin.codesourcery.com (206.168.99.1).

    Escape character is ''^]''.

    GET /

    <html>

    <head>

    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1">

    ...

    ```


    3. Note that only Windows NT can create a named pipe; Windows 9x programs can
    form only client connections.

    4. Usually, you''d use telnet to connect a Telnet server for remote logins. But
    you can also use telnet to connect to a server of a different kind and then type
    comments directly at it.'
