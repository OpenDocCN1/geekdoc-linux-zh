    \ as examining the contents of `argc` and `argv`. If you're not interested in\
    \ the name of the program itself, don't forget to skip the first element.\n\n\
    Listing 2.1 demonstrates how to use `argc` and `argv`.\n\nListing 2.1 &emsp; (*arglist.c*)\
    \ **Using `argc` and `argv`**\n\n```\n#include <stdio.h>\n\nint main (int argc,\
