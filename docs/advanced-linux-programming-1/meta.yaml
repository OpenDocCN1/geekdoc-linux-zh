    # 5.3 Mapped Memory


    Mapped memory permits different processes to communicate via a shared file. Although
    you can think of mapped memory as using a shared memory segment with a name, you
    should be aware that there are technical differences. Mapped memory can be used
    for interprocess communication or as an easy way to access the contents of a file.


    Mapped memory forms an association between a file and a process’s memory. Linux
    splits the file into page-sized chunks and then copies them into virtual memory
    pages so that they can be made available in a process’s address space. Thus, the
    process can read the file’s contents with ordinary memory access. It can also
    modify the file’s contents by writing to memory. This permits fast access to files.


    You can think of mapped memory as allocating a buffer to hold a file’s entire
    contents, and then reading the file into the buffer and (if the buffer is modified)
    writing the buffer back out to the file afterward. Linux handles the file reading
    and writing operations for you.


    There are uses for memory-mapped files other than interprocess communication.
    Some of these are discussed in Section 5.3.5, “Other Uses for mmap.”


    # 5.3.1 Mapping an Ordinary File


    To map an ordinary file to a process’s memory, use the `mmap` (“Memory MAPped,”
    pronounced “em-map”) call. The first argument is the address at which you would
    like Linux to map the file into your process’s address space; the value `NULL`
    allows Linux to choose an available start address. The second argument is the
    length of the map in bytes. The third argument specifies the protection on the
    mapped address range. The protection consists of a bitwise “or” of `PROT_READ`,
    `PROT_WRITE`, and `PROT_EXEC`, corresponding to read, write, and execution permission,
    respectively. The fourth argument is a flag value that specifies additional options.
    The fifth argument is a file descriptor opened to the file to be mapped. The last
    argument is the offset from the beginning of the file from which to start the
    map. You can map all or part of the file into memory by choosing the starting
    offset and length appropriately.


    The flag value is a bitwise “or” of these constraints:


    +   - `MAP_FIXED`—If you specify this flag, Linux uses the address you request
    to map the file rather than treating it as a hint. This address must be page-aligned.

    - `MAP_PRIVATE`—Writes to the memory range should not be written back to the attached
    file, but to a private copy of the file. No other process sees these writes. This
    mode may not be used with `MAP_SHARED`.'
