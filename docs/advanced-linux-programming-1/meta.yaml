  md: 'A.2 Finding Dynamic Memory Errors 263


    # A.2.2 malloc Checking


    The memory allocation functions provided by the GNU C library can detect writing
    before the beginning of an allocation and deallocating the same allocation twice.
    Defining the environment variable MALLOC_CHECK_ to the value 2 causes a program
    to halt when such an error is detected. (Note the environment variable''s ending
    underscore.) There is no need to recompile the program.

    We illustrate diagnosing a write to memory to a position just before the beginning
    of an allocation.


    ```

    % export MALLOC_CHECK_=2

    % ./malloc-use 12

    Please enter a command: a 0 10

    Please enter a command: w 0 -1

    Please enter a command: d 0

    Aborted (core dumped)

    ```


    export turns on malloc checking. Specifying the value 2 causes the program to
    halt as soon as an error is detected.

    Using malloc checking is advantageous because the program need not be recompiled,
    but its capability to diagnose errors is limited. Basically, it checks that the
    allocator data structures have not been corrupted. Thus, it can detect double
    deallocation of the same allocation. Also, writing just before the beginning of
    a memory allocation can usually be detected because the allocator stores the size
    of each memory allocation just before the allocated region. Thus, writing just
    before the allocated memory will corrupt this number. Unfortunately, consistency
    checking can occur only when your program calls allocation routines, not when
    it accesses memory, so many illegal reads and writes can occur before an error
    is detected. In the previous example, the illegal write was detected only when
    the allocated memory was deallocated.


    # A.2.3 Finding Memory Leaks Using mtrace


    The mtrace tool helps diagnose the most common error when using dynamic memory:
    failure to match allocations and deallocations. There are four steps to using
    mtrace, which is available with the GNU C library:


    +   1. Modify the source code to include <mcheck.h> and to invoke mtrace () as
    soon as the program starts, at the beginning of main. The call to mtrace turns
    on tracking of memory allocations and deallocations.

    2. Specify the name of a file to store information about all memory allocations
    and deallocations:

    % export MALLOC_TRACE=memory.log

    3. Run the program. All memory allocations and deallocations are stored in the
    logging file.'
