    \nThe first section contains the assembler instructions, enclosed in quotation\
    \ marks. The example asm contains two assembly instructions, fucomip and seta,\
    \ separated by semi-colons. If the assembler does not permit semicolons, use newline\
    \ characters (\\n) to separate instructions.\n\nThe compiler ignores the contents\
    \ of this first section, except that one level of percentage signs is removed,\
    \ so %% changes to %. The meaning of %%st(1) and other such terms is architecture-dependent.\n\
    \nGCC will complain if you specify the -traditional option or the -ansi option\
    \ when compiling a program containing asm statements. To avoid producing these\
    \ errors, such as in header files, use the alternative keyword __asm__.\n\n# 9.3.2\
    \ Outputs\n\nThe second section specifies the instructions’ output operands using\
    \ C syntax. Each operand is specified by an operand constraint string followed\
    \ by a C expression in parentheses. For output operands, which must be lvalues,\
    \ the constraint string should begin with an equals sign. The compiler checks\
    \ that the C expression for each output operand is in fact an lvalue.\n\nLetters\
    \ specifying registers for a particular architecture can be found in the GCC source\
    \ code, in the REG_CLASS_FROM_LETTER macro. For example, the gcc/config/i386/i386.h\
    \ configuration file in GCC lists the register letters for the x86 architecture.³\
    \ Table 9.1 summarizes these.\n\n³ You’ll need to have some familiarity with GCC’s\
