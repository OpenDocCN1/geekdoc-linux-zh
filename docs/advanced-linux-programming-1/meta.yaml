    \ the sort command, replacing calls to pipe, fork, dup2, and exec1p. The second\
    \ argument, \"w\", indicates that this process wants to write to the child process.\
    \ The return value from popen is one end of a pipe; the other end is connected\
    \ to the child process's standard input. After the writing finishes, pclose closes\
    \ the child process's stream, waits for the process to terminate, and returns\
    \ its status value.\nThe first argument to popen is executed as a shell command\
