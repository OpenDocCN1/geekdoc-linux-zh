    creates an array A with 12 character pointers that do not point to anything. The
    program accepts five different commands:


    +   - To allocate *b* bytes pointed to by array entry `A[i]`, enter `a i b`. The
    array index *i* can be any non-negative number smaller than the command-line argument.
    The number of bytes must be non-negative.

    - To deallocate memory at array index *i*, enter `d i`.

    - To read the *p*th character from the allocated memory at index *i* (as in `A[i][p]`),
    enter `r i p`. Here, *p* can have an integral value.

    - To write a character to the *p*th position in the allocated memory at index
    *i*, enter `w i p`.

