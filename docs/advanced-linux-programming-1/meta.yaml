    # 4.2.3 When to Use Thread Cancellation


    In general, it''s a good idea not to use thread cancellation to end the execution
    of a thread, except in unusual circumstances. During normal operation, a better
    strategy is to indicate to the thread that it should exit, and then to wait for
    the thread to exit on its own in an orderly fashion. We''ll discuss techniques
    for communicating with the thread later in this chapter, and in Chapter 5, "Interprocess
    Communication."


    # 4.3 Thread-Specific Data


    Unlike processes, all threads in a single program share the same address space.
    This means that if one thread modifies a location in memory (for instance, a global
    variable), the change is visible to all other threads. This allows multiple threads
    to operate on the same data without the use interprocess communication mechanisms
    (which are described in Chapter 5).


    Each thread has its own call stack, however. This allows each thread to execute
    different code and to call and return from subroutines in the usual way. As in
    a single-threaded program, each invocation of a subroutine in each thread has
    its own set of local variables, which are stored on the stack for that thread.


    Sometimes, however, it is desirable to duplicate a certain variable so that each
    thread has a separate copy. GNU/Linux supports this by providing each thread with
    a thread-specific data area. The variables stored in this area are duplicated
    for each thread, and each thread may modify its copy of a variable without affecting
    other threads. Because all threads share the same memory space, thread-specific
    data may not be accessed using normal variable references. GNU/Linux provides
    special functions for setting and retrieving values from the thread-specific data
    area.'
