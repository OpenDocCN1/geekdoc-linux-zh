    \ to write permission for the owning user. There are other constants for all the\
    \ other bits. For example, S_IRGRP is read permission for the owning group, and\
    \ S_IXOTH is execute permission for users who are neither the owning user nor\
    \ a member of the owning group. If you store permissions in a variable, use the\
    \ typedef mode_t for that variable. Like most system calls, stat will return -1\
    \ and set errno if it can't obtain information about the file.\n\nYou can use\
    \ the chmod function to change the permission bits on an existing file. You call\
    \ chmod with the name of the file you want to change and the permission bits you\
    \ want set, presented as the bitwise or of the various permission constants mentioned\
    \ previously. For example, this next line would make hello readable and executable\
    \ by its owning user but would disable all other permissions associated with hello:\n\
    \n```\nchmod (\"hello\", S_IRUSR | S_IXUSR);\n```\n\nThe same permission bits\
    \ apply to directories, but they have different meanings. If a user is allowed\
    \ to read from a directory, the user is allowed to see the list of files that\
    \ are present in that directory. If a user is allowed to write to a directory,\
    \ the user is allowed to add or remove files from the directory. Note that a user\
    \ may remove files from a directory if she is allowed to write to the directory,\
    \ *even if she does not have permission to modify the file she is removing*. If\
    \ a user is allowed to execute a directory, the user is allowed to enter that\
    \ directory and access the files therein. Without execute access to a directory,\
    \ a user is not allowed to access the files in that directory independent of the\
    \ permissions on the files themselves.\n\nTo summarize, let's review how the kernel\
    \ decides whether to allow a process to access a particular file. It checks to\
    \ see whether the accessing user is the owning user, a member of the owning group,\
    \ or someone else. The category into which the accessing user falls is used to\
