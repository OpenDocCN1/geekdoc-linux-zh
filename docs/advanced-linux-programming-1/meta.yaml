    #include <stdio.h>\n#include <unistd.h>\n\nint main ()\n{\n    printf (\"uid=%d\
    \ euid=%d\\n\", (int) getuid (), (int) geteuid ());\n    return 0;\n}\n```\n\n\
    Now suppose that this program is setuid and owned by root. In that case, the ls\
