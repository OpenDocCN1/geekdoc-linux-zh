    # ### 10.6.2 Race Conditions in /tmp


    Another very common problem involves the creation of files with predictable names,
    typically in the `/tmp` directory. Suppose that your program `prog`, running as
    `root`, always creates a temporary file called `/tmp/prog` and writes some vital
    information there. A malicious user can create a symbolic link from `/tmp/prog`
    to any other file on the system. When your program goes to create the file, the
    `open` system call will succeed. However, the data that you write will not go
    to `/tmp/prog`; instead, it will be written to some arbitrary file of the attacker''s
    choosing.


    This kind of attack is said to exploit a *race condition*. There is implicitly
    a race between you and the attacker. Whoever manages to create the file first
    wins.


    This attack is often used to destroy important parts of the file system. By creating
    the appropriate links, the attacker can trick a program running as `root` that
    is supposed to write a temporary file into overwriting an important system file
    instead. For example, by making a symbolic link to `/etc/passwd`, the attacker
    can wipe out the system''s password database. There are also ways in which a malicious
    user can obtain root access using this technique.


    One attempt at avoiding this attack is to use a randomized name for the file.
    For example, you could read from `/dev/random` to get some bits to use in the
    name of the file. This certainly makes it harder for a malicious user to guess
    the filename, but it doesn''t make it impossible. The attacker might just create
    a large number of symbolic links, using many potential names. Even if she has
    to try 10,000 times before wining the race condition, that one time could be disastrous.


    Another approach is to use the `O_EXCL` flag when calling `open`. This flag causes
    `open` to fail if the file already exists. Unfortunately, if you''re using the
    Network File System (NFS), or if anyone who''s using your program might ever be
    using NFS, that''s not a sufficiently robust approach because `O_EXCL` is not
    reliable when NFS is in use. You can''t ever really know for sure whether your
    code will be used on a system that uses NFS, so if you''re highly paranoid, don''t
    rely on using `O_EXCL`.


    In Chapter 2, "Writing Good GNU/Linux Software," Section 2.1.7, "Using Temporary
    Files," we showed how to use `mkstemp` to create temporary files. Unfortunately,
    what `mkstemp` does on Linux is open the file with `O_EXCL` after trying to pick
    a name that is hard to guess. In other words, using `mkstemp` is still insecure
    if `/tmp` is mounted over NFS.⁹ So, using `mkstemp` is better than nothing, but
    it''s not fully secure.


    8. Some programmers believe that C++ is a horrible and overly complex language.
    Their arguments about multiple inheritance and other such complications have some
    merit, but it is easier to write code that avoids buffer overruns and other similar
    problems in C++ than in C.


    9. Obviously, if you''re also a system administrator, you shouldn''t mount `/tmp`
    over NFS.'
