  md: 'With most shells, it''s possible to obtain the exit code of the most recently
    executed program using the special `$?` variable. Here''s an example in which
    the `ls` command is invoked twice and its exit code is displayed after each invocation.
    In the first case, `ls` executes correctly and returns the exit code zero. In
    the second case, `ls` encounters an error (because the filename specified on the
    command line does not exist) and thus returns a nonzero exit code.


    ```

    % ls /

    bin  coda  etc  lib      misc nfs proc sbin usr

    boot dev  home lost+found mnt  opt root tmp var

    % echo $?

    0

    % ls bogusfile

    ls: bogusfile: No such file or directory

    % echo $?

    1

    ```


    Note that even though the parameter type of the `exit` function is `int` and the
    main function returns an `int`, Linux does not preserve the full 32 bits of the
    return code. In fact, you should use exit codes only between zero and 127. Exit
    codes above 128 have a special meaning—when a process is terminated by a signal,
    its exit code is 128 plus the signal number.


    # 3.4.1  Waiting for Process Termination


    If you typed in and ran the `fork` and `exec` example in Listing 3.4, you may
    have noticed that the output from the `ls` program often appears after the "main
    program" has already completed. That''s because the child process, in which `ls`
    is run, is scheduled independently of the parent process. Because Linux is a multitasking
    operating system, both processes appear to execute simultaneously, and you can''t
    predict whether the `ls` program will have a chance to run before or after the
    parent process runs.


    In some situations, though, it is desirable for the parent process to wait until
    one or more child processes have completed. This can be done with the `wait` family
    of system calls. These functions allow you to wait for a process to finish executing,
    and enable the parent process to retrieve information about its child''s termination.
    There are four different system calls in the `wait` family; you can choose to
    get a little or a lot of information about the process that exited, and you can
    choose whether you care about which child process terminated.


    # 3.4.2  The *wait* System Calls


    The simplest such function is called simply `wait`. It blocks the calling process
    until one of its child processes exits (or an error occurs). It returns a status
    code via an integer pointer argument, from which you can extract information about
    how the child process exited. For instance, the `WEXITSTATUS` macro extracts the
    child process''s exit code.'
  merge: -1
