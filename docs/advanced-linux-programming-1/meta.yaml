  md: "# Chapter 8 Linux System Calls\n\nA time-critical program might lock physical\
    \ memory because the time delay of paging memory out and back may be too long\
    \ or too unpredictable. High-security applications may also want to prevent sensitive\
    \ data from being written out to a swap file, where they might be recovered by\
    \ an intruder after the program terminates.\n\nLocking a region of memory is as\
    \ simple as calling `mlock` with a pointer to the start of the region and the\
    \ region's length. Linux divides memory into *pages* and can lock only entire\
    \ pages at a time; each page that contains part of the memory region specified\
    \ to `mlock` is locked. The `getpagesize` function returns the system's page size,\
    \ which is 4KB on x86 Linux.\n\nFor example, to allocate 32MB of address space\
    \ and lock it into RAM, you would use this code:\n\n```\nconst int alloc_size\
    \ = 32 * 1024 * 1024;\nchar* memory = malloc (alloc_size);\nmlock (memory, alloc_size);\n\
    ```\n\nNote that simply allocating a page of memory and locking it with `mlock`\
    \ doesn't reserve physical memory for the calling process because the pages may\
    \ be copy-on-write.⁵ Therefore, you should write a dummy value to each page as\
    \ well:\n\n```\nsize_t i;\nsize_t page_size = getpagesize ();\nfor (i = 0; i <\
    \ alloc_size; i += page_size)\n    memory[i] = 0;\n```\n\nThe write to each page\
    \ forces Linux to assign a unique, unshared memory page to the process for that\
    \ page.\n\nTo unlock a region, call `munlock`, which takes the same arguments\
    \ as `mlock`.\n\nIf you want your program's entire address space locked into physical\
    \ memory, call `mlockall`. This system call takes a single flag argument: `MCL_CURRENT`\
    \ locks all currently allocated memory, but future allocations are not locked;\
    \ `MCL_FUTURE` locks all pages that are allocated after the call. Use `MCL_CURRENT|MCL_FUTURE`\
    \ to lock into memory both current and subsequent allocations.\n\nLocking large\
    \ amounts of memory, especially using `mlockall`, can be dangerous to the entire\
    \ Linux system. Indiscriminate memory locking is a good method of bringing your\
    \ system to a grinding halt because other running processes are forced to compete\
    \ for smaller physical memory resources and swap rapidly into and back out of\
    \ memory (this is known as *thrashing*). If you lock too much memory, the system\
    \ will run out of memory entirely and Linux will start killing off processes.\n\
    \nFor this reason, only processes with superuser privilege may lock memory with\
    \ `mlock` or `mlockall`. If a nonsuperuser process calls one of these functions,\
    \ it will fail, return −1, and set `errno` to `EPERM`.\n\nThe `munlockall` call\
    \ unlocks all memory locked by the current process, including memory locked with\
    \ `mlock` and `mlockall`.\n\n⁵. *Copy-on-write* means that Linux makes a private\
    \ copy of a page of memory for a process only when that process writes a value\
    \ somewhere into it."
