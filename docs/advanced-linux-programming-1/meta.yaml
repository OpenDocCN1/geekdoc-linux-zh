  md: 'Table 9.1 Register Letters for the Intel x86 Architecture


    | Register Letter | Registers That GCC May Use |

    | :--- | :--- |

    | R | General register (EAX, EBX, ECX, EDX, ESI, EDI, EBP, ESP) |

    | q | General register for data (EAX, EBX, ECX, EDX) |

    | f | Floating-point register |

    | t | Top floating-point register |

    | u | Second-from-top floating-point register |

    | a | EAX register |

    | b | EBX register |

    | c | ECX register |

    | d | EDX register |

    | x | SSE register (Streaming SIMD Extension register) |

    | y | MMX multimedia registers |

    | A | An 8-byte value formed from EAX and EDX |

    | D | Destination pointer for string operations (EDI) |

    | S | Source pointer for string operations (ESI) |


    Multiple operands in an asm statement, each specified by a constraint string and
    a C expression, are separated by commas, as illustrated in the example asm''s
    input section. You may specify up to 10 operands, denoted %0, %1, ..., %9, in
    the output and input sections. If there are no output operands but there are input
    operands or clobbered registers, leave the output section empty or mark it with
    a comment like /* no outputs */.


    # 9.3.3 Inputs


    The third section specifies the input operands for the assembler instructions.
    The constraint string for an input operand should not have an equals sign, which
    indicates an lvalue. Otherwise, an input operand''s syntax is the same as for
    output operands.

    To indicate that a register is both read from and written to in the same asm,
    use an input constraint string of the output operand''s number. For example, to
    indicate that an input register is the same as the first output register number,
    use 0. Output operands are numbered left to right, starting with 0. Merely specifying
    the same C expression for an output operand and an input operand does not guarantee
    that the two values will be placed in the same register.

    This input section can be omitted if there are no input operands and the subsequent
    clobber section is empty.'
