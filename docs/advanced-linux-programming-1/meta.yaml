    You can use the free command to display the same memory information.\n\n# 7.5\
    \ Drives, Mounts, and File Systems\n\nThe /proc file system also contains information\
    \ about the disk drives present in the system and the file systems mounted from\
    \ them.\n\n# 7.5.1 File Systems\n\nThe /proc/filesystems entry displays the file\
    \ system types known to the kernel. Note that this list isn’t very useful because\
    \ it is not complete: File systems can be loaded and unloaded dynamically as kernel\
    \ modules. The contents of /proc/filesystems list only file system types that\
    \ either are statically linked into the kernel or are currently loaded. Other\
    \ file system types may be available on the system as modules but might not be\
