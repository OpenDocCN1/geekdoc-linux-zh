  md: "# 4.5 GNU/Linux Thread Implementation\n\nThe implementation of POSIX threads\
    \ on GNU/Linux differs from the thread implementation on many other UNIX-like\
    \ systems in an important way: on GNU/Linux, threads are implemented as processes.\
    \ Whenever you call pthread_create to create a new thread, Linux creates a new\
    \ process that runs that thread. However, this process is not the same as a process\
    \ you would create with fork; in particular, it shares the same address space\
    \ and resources as the original process rather than receiving copies.\n\nThe program\
    \ thread-pid shown in Listing 4.15 demonstrates this. The program creates a thread;\
    \ both the original thread and the new one call the getpid function and print\
    \ their respective process IDs and then spin infinitely.\n\n```\nListing 4.15\
    \ (thread-pid) Print Process IDs for Threads\n\n#include <pthread.h>\n#include\
    \ <stdio.h>\n#include <unistd.h>\n\nvoid* thread_function (void* arg)\n{\n  fprintf\
    \ (stderr, \"child thread pid is %d\\n\", (int) getpid ());\n  /* Spin forever.\
    \ */\n  while (1);\n  return NULL;\n}\n\nint main ()\n{\n  pthread_t thread;\n\
    \  fprintf (stderr, \"main thread pid is %d\\n\", (int) getpid ());\n  pthread_create\
    \ (&thread, NULL, &thread_function, NULL);\n  /* Spin forever. */\n  while (1);\n\
    \  return 0;\n}\n```\n\nRun the program in the background, and then invoke ps\
    \ x to display your running processes. Don't forget to kill the thread-pid program\
    \ afterward—it consumes lots of CPU doing nothing. Here's what the output might\
    \ look like:\n\n```\n% cc thread-pid.c -o thread-pid -lpthread\n% ./thread-pid\
    \ &\n[1] 14608\nmain thread pid is 14608\nchild thread pid is 14610\n% ps x\n\
    \    PID TTY      STAT   TIME COMMAND\n  14042 pts/9    S      0:00 bash\n  14608\
    \ pts/9    R      0:01 ./thread-pid\n```"
