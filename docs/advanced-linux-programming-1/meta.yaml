  md: '# 140 Chapter 6 Devices


    To construct a virtual file system and mount it with a loopback device, follow
    these steps:


    +   1. Create an empty file to hold the virtual file system. The size of the file
    will be the apparent size of the loopback device after it is mounted.

    One convenient way to construct a file of a fixed size is with the dd command.
    This command copies blocks (by default, 512 bytes each) from one file to another.
    The /dev/zero file is a convenient source of bytes to copy from.

    To construct a 10MB file named disk-image, invoke the following:


    ```

    % dd if=/dev/zero of=/tmp/disk-image count=20480

    20480+0 records in

    20480+0 records out

    % ls -l /tmp/disk-image

    -rw-rw---- 1 root root 10485760 Mar 8 01:56 /tmp/disk-image

    ```


    +   2. The file that you''ve just created is filled with 0 bytes. Before you mount
    it, you must construct a file system. This sets up the various control structures
    needed to organize and store files, and builds the root directory.

    You can build any type of file system you like in your disk image. To construct
    an ext2 file system (the type most commonly used for Linux disks), use the mke2fs
    command. Because it''s usually run on a block device, not an ordinary file, it
    asks for confirmation:


    ```

    % mke2fs -q /tmp/disk-image

    mke2fs 1.18, 11-Nov-1999 for EXT2 FS 0.5b, 95/08/09

    disk-image is not a block special device.

    Proceed anyway? (y,n) y

    ```


    The -q option suppresses summary information about the newly created file system.
    Leave this option out if you''re curious about it.

    Now disk-image contains a brand-new file system, as if it were a freshly initialized
    10MB disk drive.'
  merge: -1
