  md: 'Now suppose that two threads happen to finish a job at about the same time,
    but only one job remains in the queue. The first thread checks whether `job_queue`
    is null; finding that it isn''t, the thread enters the loop and stores the pointer
    to the job object in `next_job`. At this point, Linux happens to interrupt the
    first thread and schedules the second. The second thread also checks `job_queue`
    and finding it non-null, also assigns the same job pointer to `next_job`. By unfortunate
    coincidence, we now have two threads executing the same job.


    To make matters worse, one thread will unlink the job object from the queue, leaving
    `job_queue` containing null. When the other thread evaluates `job_queue->next`,
    a segmentation fault will result.


    This is an example of a race condition. Under "lucky" circumstances, this particular
    schedule of the two threads may never occur, and the race condition may never
    exhibit itself. Only under different circumstances, perhaps when running on a
    heavily loaded system (or on an important customer''s new multiprocessor server!)
    may the bug exhibit itself.


    To eliminate race conditions, you need a way to make operations *atomic*. An atomic
    operation is indivisible and uninterruptible; once the operation starts, it will
    not be paused or interrupted until it completes, and no other operation will take
    place meanwhile. In this particular example, you want to check `job_queue`; if
    it''s not empty, remove the first job, all as a single atomic operation.


    # ### 4.4.2 Mutexes


    The solution to the job queue race condition problem is to let only one thread
    access the queue of jobs at a time. Once a thread starts looking at the queue,
    no other thread should be able to access it until the first thread has decided
    whether to process a job and, if so, has removed the job from the list.


    Implementing this requires support from the operating system. GNU/Linux provides
    *mutexes*, short for *MUT*ual *EX*clusion *locks*. A mutex is a special lock that
    only one thread may lock at a time. If a thread locks a mutex and then a second
    thread also tries to lock the same mutex, the second thread is *blocked*, or put
    on hold. Only when the first thread unlocks the mutex is the second thread *unblocked*—allowed
    to resume execution. GNU/Linux guarantees that race conditions do not occur among
    threads attempting to lock a mutex; only one thread will ever get the lock, and
    all other threads will be blocked.


    Think of a mutex as the lock on a lavatory door. Whoever gets there first enters
    the lavatory and locks the door. If someone else attempts to enter the lavatory
    while it''s occupied, that person will find the door locked and will be forced
    to wait outside until the occupant emerges.


    To create a mutex, create a variable of type `pthread_mutex_t` and pass a pointer
    to it to `pthread_mutex_init`. The second argument to `pthread_mutex_init` is
    a pointer to a mutex attribute object, which specifies attributes of the mutex.
    As with'
