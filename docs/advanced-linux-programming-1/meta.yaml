    # # 11 A Sample GNU/Linux Application


    THIS CHAPTER IS WHERE IT ALL COMES TOGETHER. WE’LL DESCRIBE and implement a complete
    GNU/Linux program that incorporates many of the techniques described in this book.
    The program provides information about the system it’s running on via a Web interface.


    The program is a complete demonstration of some of the methods we’ve described
    for GNU/Linux programming and illustrated in shorter programs. This program is
    written more like “real-world” code, unlike most of the code listings that we
    presented in previous chapters. It can serve as a jumping-off point for your own
    GNU/Linux programs.


    # ## 11.1 Overview


    The example program is part of a system for monitoring a running GNU/Linux system.
    It includes these features:


    +   - The program incorporates a minimal Web server. Local or remote clients access
    system information by requesting Web pages from the server via HTTP.

    - The program does not serve static HTML pages. Instead, the pages are generated
    on the fly by modules, each of which provides a page summarizing one aspect of
    the system’s state.'
