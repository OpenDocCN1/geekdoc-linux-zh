  md: "The program in Listing 4.1 creates a thread that prints x's continuously to\
    \ standard error. After calling `pthread_create`, the main thread prints o's continuously\
    \ to standard error.\n\n# Listing 4.1 *(thread-create.c)* Create a Thread\n\n\
    ```\n#include <pthread.h>\n#include <stdio.h>\n\n/* Prints x's to stderr.  The\
    \ parameter is unused.  Does not return.  */\n\nvoid* print_xs (void* unused)\n\
