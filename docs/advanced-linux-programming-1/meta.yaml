  md: "One possible error code that you should be on the watch for, especially with\
    \ I/O functions, is EINTR. Some functions, such as read, select, and sleep, can\
    \ take significant time to execute. These are considered *blocking* functions\
    \ because program execution is blocked until the call is completed. However, if\
    \ the program receives a signal while blocked in one of these calls, the call\
    \ will return without completing the operation. In this case, errno is set to\
    \ EINTR. Usually, you'll want to retry the system call in this case.\n\nHere's\
    \ a code fragment that uses the chown call to change the owner of a file given\
    \ by path to the user by user_id. If the call fails, the program takes action\
    \ depending on the value of errno. Notice that when we detect what's probably\
    \ a bug in the program, we exit using abort or assert, which cause a core file\
    \ to be generated. This can be useful for post-mortem debugging. For other unrecoverable\
    \ errors, such as out-of-memory conditions, we exit using exit and a nonzero exit\
    \ value instead because a core file wouldn't be very useful.\n\n```\nrval = chown\
    \ (path, user_id, -1);\nif (rval != 0) {\n    /* Save errno because it's clobbered\
    \ by the next system call.  */\n    int error_code = errno;\n    /* The operation\
    \ didn't succeed; chown should return -1 on error.  */\n    assert (rval == -1);\n\
    \    /* Check the value of errno, and take appropriate action.  */\n    switch\
    \ (error_code) {\n    case EPERM:      /* Permission denied.  */\n    case EROFS:\
    \      /* PATH is on a read-only file system.  */\n    case ENAMETOOLONG: /* PATH\
    \ is too long.  */\n    case ENOENT:     /* PATH does not exit.  */\n    case\
    \ ENOTDIR:    /* A component of PATH is not a directory.  */\n    case EACCES:\
    \     /* A component of PATH is not accessible.  */\n        /* Something's wrong\
    \ with the file.  Print an error message.  */\n        fprintf (stderr, \"error\
    \ changing ownership of %s: %s\\n\",\n                 path, strerror (error_code));\n\
    \        /* Don't end the program; perhaps give the user a chance to\n       \
    \    choose another file...  */\n        break;\n\n    case EFAULT:\n        /*\
    \ PATH contains an invalid memory address.  This is probably a bug.  */\n    \
    \    abort ();\n\n    case ENOMEM:\n        /* Ran out of kernel memory.  */\n\
    \        fprintf (stderr, \"%s\\n\", strerror (error_code));\n        exit (1);\n\
    \n    default:\n        /* Some other, unexpected, error code.  We've tried to\
    \ handle all\n           possible error codes; if we've missed one, that's a bug!\
    \  */\n        abort ();\n    };\n}\n```"
