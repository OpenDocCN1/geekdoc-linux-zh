    \ 8.3, “fcntl: Locks and Other File Operations,” in Chapter 8.\n\n# 5.3.4 Private\
    \ Mappings\n\nSpecifying MAP_PRIVATE to mmap creates a copy-on-write region. Any\
    \ write to the region is reflected only in this process’s memory; other processes\
    \ that map the same file won’t see the changes. Instead of writing directly to\
    \ a page shared by all processes, the process writes to a private copy of this\
    \ page. All subsequent reading and writing by the process use this page.\n\n#\
    \ 5.3.5 Other Uses for mmap\n\nThe mmap call can be used for purposes other than\
    \ interprocess communications. One common use is as a replacement for read and\
    \ write. For example, rather than explicitly reading a file’s contents into memory,\
    \ a program might map the file into memory and scan it using memory reads. For\
    \ some programs, this is more convenient and may also run faster than explicit\
    \ file I/O operations.\n\nOne advanced and powerful technique used by some programs\
    \ is to build data structures (ordinary struct instances, for example) in a memory-mapped\
    \ file. On a subsequent invocation, the program maps that file back into memory,\
    \ and the data structures are restored to their previous state. Note, though,\
    \ that pointers in these data structures will be invalid unless they all point\
    \ within the same mapped region of memory and unless care is taken to map the\
    \ file back into the same address region that it occupied originally.\n\nAnother\
