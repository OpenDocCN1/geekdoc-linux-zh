    # 3

    Processes


    A RUNNING INSTANCE OF A PROGRAM IS CALLED A *PROCESS*. If you have two terminal
    windows showing on your screen, then you are probably running the same terminal
    program twice—you have two terminal processes. Each terminal window is probably
    running a shell; each running shell is another process. When you invoke a command
    from a shell, the corresponding program is executed in a new process; the shell
    process resumes when that process completes.


    Advanced programmers often use multiple cooperating processes in a single application
    to enable the application to do more than one thing at once, to increase application
    robustness, and to make use of already-existing programs.


    Most of the process manipulation functions described in this chapter are similar
    to those on other UNIX systems. Most are declared in the header file <unistd.h>;
    check the man page for each function to be sure.


    # 3.1 Looking at Processes


    Even as you sit down at your computer, there are processes running. Every executing
    program uses one or more processes. Let''s start by taking a look at the processes
    already on your computer.'
