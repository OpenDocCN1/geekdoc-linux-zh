    #include <stdio.h>\n#include <unistd.h>\n\nint main (int argc, char* argv[])\n\
    {\n  char* path = argv[1];\n  int rval;\n\n  /* Check file existence.  */\n  rval\
    \ = access (path, F_OK);\n  if (rval == 0)\n    printf (\"%s exists\\n\", path);\n\
