  md: 'This program starts off by building up a PAM *conversation object*. This object
    is used by the PAM library whenever it needs to prompt the user for information.
    The `misc_conv` function used in this example is a standard conversation function
    that uses the terminal for input and output. You could write your own function
    that pops up a dialog box, or that uses speech for input and output, or that provides
    even more exotic input and output methods.


    The program then calls `pam_start`. This function initializes the PAM library.
    The first argument is a service name. You should use a name that uniquely identifies
    your application. For example, if your application is named whizbang, you should
    probably use that for the service name, too. However, the program probably won''t
    work until the system administrator explicitly configures the system to work with
    your service. So, in this example, we use the `su` service, which says that our
    program should authenticate users in the same way that the `su` command does.
    You should *not* use this technique in a real program. Pick a real service name,
    and have your installation scripts help the system administrator to set up a correct
    PAM configuration for your application.


    The second argument is the name of the user whom you want to authenticate. In
    this example, we use the value of the `USER` environment variable. (Normally,
    this is the username that corresponds to the effective user ID of the current
    process, but that''s not always the case.) In most real programs, you would prompt
    for a username at this point. The third argument indicates the PAM conversation,
    discussed previously. The call to `pam_start` fills in the handle provided as
    the fourth argument. Pass this handle to subsequent calls to PAM library routines.


    Next, the program calls `pam_authenticate`. The second argument enables you to
    pass various flags; the value 0 means to use the default options. The return value
    from this function indicates whether authentication succeeded.


    Finally, the programs calls `pam_end` to clean up any allocated data structures.


    Let''s assume that the valid password for the current user is "password" (an exceptionally
    poor password). Then, running this program with the correct password produces
    the expected:


    ```

    % ./pam

    Password: password


    Authentication OK.

    ```


    If you run this program in a terminal, the password probably won''t actually appear
    when you type it in; it''s hidden to prevent others from peeking at your password
    over your shoulder as you type.


    However, if a hacker tries to use the wrong password, the PAM library will correctly
    indicate failure:


    ```

    % ./pam

    Password: badguess


    Authentication failed!

    ```'
