  md: "# 8.3 fcntl: Locks and Other File Operations\n\nThe fcntl system call is the\
    \ access point for several advanced operations on file descriptors. The first\
    \ argument to fcntl is an open file descriptor, and the second is a value that\
    \ indicates which operation is to be performed. For some operations, fcntl takes\
    \ an additional argument. We'll describe here one of the most useful fcntl operations,\
    \ file locking. See the fcntl man page for information about the others.\n\nThe\
    \ fcntl system call allows a program to place a read lock or a write lock on a\
    \ file, somewhat analogous to the mutex locks discussed in Chapter 5, \"Interprocess\
    \ Communication.\" A read lock is placed on a readable file descriptor, and a\
    \ write lock is placed on a writable file descriptor. More than one process may\
    \ hold a read lock on the same file at the same time, but only one process may\
    \ hold a write lock, and the same file may not be both locked for read and locked\
    \ for write. Note that placing a lock does not actually prevent other processes\
    \ from opening the file, reading from it, or writing to it, unless they acquire\
    \ locks with fcntl as well.\n\nTo place a lock on a file, first create and zero\
    \ out a struct flock variable. Set the l_type field of the structure to F_RDLCK\
    \ for a read lock or F_WRLCK for a write lock. Then call fcntl, passing a file\
    \ descriptor to the file, the F_SETLKW operation code, and a pointer to the struct\
    \ flock variable. If another process holds a lock that prevents a new lock from\
    \ being acquired, fcntl blocks until that lock is released.\n\nThe program in\
    \ Listing 8.2 opens a file for writing whose name is provided on the command line,\
    \ and then places a write lock on it. The program waits for the user to hit Enter\
    \ and then unlocks and closes the file.\n\n```\nListing 8.2 (lock-file.c) Create\
    \ a Write Lock with fcntl\n\n#include <fcntl.h>\n#include <stdio.h>\n#include\
    \ <string.h>\n#include <unistd.h>\n\nint main (int argc, char* argv[])\n{\n  char*\
    \ file = argv[1];\n  int fd;\n  struct flock lock;\n\n  printf (\"opening %s\\\
    n\", file);\n  /* Open a file descriptor to the file.  */\n  fd = open (file,\
    \ O_WRONLY);\n  printf (\"locking\\n\");\n  /* Initialize the flock structure.\
    \  */\n  memset (&lock, 0, sizeof(lock));\n  lock.l_type = F_WRLCK;\n  /* Place\
    \ a write lock on the file.  */\n  fcntl (fd, F_SETLKW, &lock);\n```"
  merge: -1
