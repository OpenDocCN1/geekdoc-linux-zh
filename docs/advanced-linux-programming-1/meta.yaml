    # 10.6  More Security Holes


    Although this chapter will point out a few common security holes, you should by
    no means rely on this book to cover all possible security holes. A great many
    have already been discovered, and many more are out there waiting to be found.
    If you are trying to write secure code, there is really no substitute for having
    a security expert audit your code.


    # 10.6.1  Buffer Overruns


    Almost every major Internet application daemon, including the `sendmail` daemon,
    the `finger` daemon, the `talk` daemon, and others, has at one point been compromised
    through a *buffer overrun*.


    If you are writing any code that will ever be run as root, you absolutely must
    be aware of this particular kind of security hole. If you are writing a program
    that performs any kind of interprocess communication, you should definitely be
    aware of this kind of security hole. If you are writing a program that reads files
    (*or might read files*) that are not owned by the user executing the program,
    you should be aware of this kind of security hole. That last criterion applies
    to almost every program. Fundamentally, if you''re going to write GNU/Linux software,
    you ought to know about buffer overruns.


    The idea behind a buffer overrun attack is to trick a program into executing code
    that it did not intend to execute. The usual mechanism for achieving this feat
    is to overwrite some portion of the program''s process stack. The program''s stack
    contains, among other things, the memory location to which the program will transfer
    control when the current function returns. Therefore, if you can put the code
    that you want to have executed into memory somewhere and then change the return
    address to point to that piece of memory, you can cause the program to execute
    anything. When the program returns from the function it is executing, it will
    jump to the new code and execute whatever is there, running with the privileges
    of the current process. Clearly, if the current process is running as root, this
    would be a disaster. If the process is running as another user, it''s a disaster
    "only" for that user—and anybody else who depends on the contents of files owned
    by that user, and so forth.


    If the program is running as a daemon and listening for incoming network connections,
    the situation is even worse. A daemon typically runs as root. If it contains buffer
    overrun bugs, anyone who can connect via the network to a computer running the
    daemon can seize control of the computer by sending a malignant sequence of data
    to the daemon over the network. A program that does not engage in network communications
    is much safer because only users who are already able to log in to the computer
    running the program are able to attack it.'
