  md: "# Chapter 1  Getting Started\n\nYou can convey all that information to `make`\
    \ by putting the information in a file named `Makefile`. Here's what `Makefile`\
    \ contains:\n\n```\nreciprocal: main.o reciprocal.o\n    g++ $(CFLAGS) -o reciprocal\
    \ main.o reciprocal.o\n\nmain.o: main.c reciprocal.hpp\n    gcc $(CFLAGS) -c main.c\n\
    \nreciprocal.o: reciprocal.cpp reciprocal.hpp\n    g++ $(CFLAGS) -c reciprocal.cpp\n\
    \nclean:\n    rm -f *.o reciprocal\n```\n\nYou can see that targets are listed\
    \ on the left, followed by a colon and then any dependencies. The rule to build\
    \ that target is on the next line. (Ignore the `$(CFLAGS)` bit for the moment.)\
    \ The line with the rule on it must start with a Tab character, or `make` will\
    \ get confused. If you edit your `Makefile` in Emacs, Emacs will help you with\
    \ the formatting.\n\nIf you remove the object files that you've already built,\
    \ and just type\n\n```\n% make\n```\n\non the command-line, you'll see the following:\n\
    \n```\n% make\ngcc -c main.c\ng++ -c reciprocal.cpp\ng++ -o reciprocal main.o\
    \ reciprocal.o\n```\n\nYou can see that `make` has automatically built the object\
    \ files and then linked them. If you now change `main.c` in some trivial way and\
    \ type `make` again, you'll see the following:\n\n```\n% make\ngcc -c main.c\n\
    g++ -o reciprocal main.o reciprocal.o\n```\n\nYou can see that `make` knew to\
    \ rebuild `main.o` and to re-link the program, but it didn't bother to recompile\
    \ `reciprocal.cpp` because none of the dependencies for `reciprocal.o` had changed.\n\
    \nThe `$(CFLAGS)` is a `make` variable. You can define this variable either in\
    \ the `Makefile` itself or on the command line. GNU `make` will substitute the\
    \ value of the variable when it executes the rule. So, for example, to recompile\
    \ with optimization enabled, you would do this:\n\n```\n% make clean\nrm -f *.o\
    \ reciprocal\n% make CFLAGS=-O2\ngcc -O2 -c main.c\ng++ -O2 -c reciprocal.cpp\n\
    g++ -O2 -o reciprocal main.o reciprocal.o\n```"
