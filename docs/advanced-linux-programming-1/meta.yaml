  md: 'One major advantage of a shared library is that it saves space on the system
    where the program is installed. If you are installing 10 programs, and they all
    make use of the same shared library, then you save a lot of space by using a shared
    library. If you used a static archive instead, the archive is included in all
    10 programs. So, using shared libraries saves disk space. It also reduces download
    times if your program is being downloaded from the Web.


    A related advantage to shared libraries is that users can upgrade the libraries
    without upgrading all the programs that depend on them. For example, suppose that
    you produce a shared library that manages HTTP connections. Many programs might
    depend on this library. If you find a bug in this library, you can upgrade the
    library. Instantly, all the programs that depend on the library will be fixed;
    you don''t have to relink all the programs the way you do with a static archive.


    Those advantages might make you think that you should always use shared libraries.
    However, substantial reasons exist to use static archives instead. The fact that
    an upgrade to a shared library affects all programs that depend on it can be a
    disadvantage. For example, if you''re developing mission-critical software, you
    might rather link to a static archive so that an upgrade to shared libraries on
    the system won''t affect your program. (Otherwise, users might upgrade the shared
    library, thereby breaking your program, and then call your customer support line,
    blaming you!)


    If you''re not going to be able to install your libraries in `/lib` or `/usr/lib`,
    you should definitely think twice about using a shared library. (You won''t be
    able to install your libraries in those directories if you expect users to install
    your software without administrator privileges.) In particular, the `-Wl, -rpath`
    trick won''t work if you don''t know where the libraries are going to end up.
    And asking your users to set `LD_LIBRARY_PATH` means an extra step for them. Because
    each user has to do this individually, this is a substantial additional burden.


    You''ll have to weigh these advantages and disadvantages for every program you
    distribute.


    # 2.3.6 Dynamic Loading and Unloading


    Sometimes you might want to load some code at run time without explicitly linking
    in that code. For example, consider an application that supports "plug-in" modules,
    such as a Web browser. The browser allows third-party developers to create plug-ins
    to provide additional functionality. The third-party developers create shared
    libraries and place them in a known location. The Web browser then automatically
    loads the code in these libraries.


    This functionality is available under Linux by using the `dlopen` function. You
    could open a shared library named `libtest.so` by calling `dlopen` like this:


    ```

    dlopen ("libtest.so", RTLD_LAZY)

    ```'
