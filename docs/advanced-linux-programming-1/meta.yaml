  md: "# B.1 Reading and Writing Data\n\n# B.1.4 Reading Data\n\nThe corresponding\
    \ call for reading data is read. Like write, it takes a file descriptor, a pointer\
    \ to a buffer, and a count. The count specifies how many bytes are read from the\
    \ file descriptor into the buffer. The call to read returns -1 on error or the\
    \ number of bytes actually read. This may be smaller than the number of bytes\
    \ requested, for example, if there aren't enough bytes left in the file.\n\n>\
    \ **Reading DOS/Windows Text Files**\n\nAfter reading this book, we're positive\
    \ that you'll choose to write all your programs for GNU/Linux. However, your programs\
    \ may occasionally need to read text files generated by DOS or Windows programs.\
    \ It's important to anticipate an important difference in how text files are structured\
    \ between these two platforms.\n\nIn GNU/Linux text files, each line is separated\
    \ from the next with a newline character. A newline is represented by the character\
    \ constant '\\n', which has ASCII code 10. On Windows, however, lines are separated\
    \ by a two-character combination: a carriage return character (the character '\\\
    r,' which has ASCII code 13), followed by a newline character.\n\nSome GNU/Linux\
    \ text editors display ^M at the end of each line when showing a Windows text\
    \ file--this is the carriage return character. Emacs displays Windows text files\
    \ properly but indicates them by showing (DOS) in the mode line at the bottom\
    \ of the buffer. Some Windows editors, such as Notepad, display all the text in\
    \ a GNU/Linux text file on a single line because they expect a carriage return\
    \ at the end of each line. Other programs for both GNU/Linux and Windows that\
    \ process text files may report mysterious errors when given as input a text file\
