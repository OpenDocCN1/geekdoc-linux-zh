  md: "The ultimate cause of most bugs involving threads is that the threads are accessing\
    \ the same data. As mentioned previously, that’s one of the powerful aspects of\
    \ threads, but it can also be dangerous. If one thread is only partway through\
    \ updating a data structure when another thread accesses the same data structure,\
    \ chaos is likely to ensue. Often, buggy threaded programs contain a code that\
    \ will work only if one thread gets scheduled more often—or sooner—than another\
    \ thread. These bugs are called *race conditions*; the threads are racing one\
    \ another to change the same data structure.\n\n# 4.4.1 Race Conditions\n\nSuppose\
    \ that your program has a series of queued jobs that are processed by several\
    \ concurrent threads. The queue of jobs is represented by a linked list of `struct\
    \ job` objects.\n\nAfter each thread finishes an operation, it checks the queue\
    \ to see if an additional job is available. If `job_queue` is non-null, the thread\
    \ removes the head of the linked list and sets `job_queue` to the next job on\
    \ the list.\n\nThe thread function that processes jobs in the queue might look\
    \ like Listing 4.10.\n\n```\nListing 4.10 *(job-queue1.c) Thread Function to Process\
    \ Jobs from the Queue*\n\n#include <malloc.h>\n\nstruct job {\n  /* Link field\
    \ for linked list.  */\n  struct job* next;\n\n  /* Other fields describing work\
    \ to be done... */\n};\n\n/* A linked list of pending jobs.  */\nstruct job* job_queue;\n\
    \n/* Process queued jobs until the queue is empty.  */\n\nvoid* thread_function\
    \ (void* arg)\n{\n  while (job_queue != NULL) {\n    /* Get the next available\
    \ job.  */\n    struct job* next_job = job_queue;\n    /* Remove this job from\
    \ the list.  */\n    job_queue = job_queue->next;\n    /* Carry out the work.\
    \  */\n    process_job (next_job);\n    /* Clean up.  */\n    free (next_job);\n\
    \  }\n  return NULL;\n}\n```"
