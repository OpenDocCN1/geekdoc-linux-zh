  md: 'Often a thread may be in some code that must be executed in an all-or-nothing
    fashion. For instance, the thread may allocate some resources, use them, and then
    deallocate them. If the thread is canceled in the middle of this code, it may
    not have the opportunity to deallocate the resources, and thus the resources will
    be leaked. To counter this possibility, it is possible for a thread to control
    whether and when it can be canceled.


    A thread may be in one of three states with regard to thread cancellation.


    +   - The thread may be asynchronously cancelable. The thread may be canceled
    at any point in its execution.

    - The thread may be synchronously cancelable. The thread may be canceled, but
    not at just any point in its execution. Instead, cancellation requests are queued,
    and the thread is canceled only when it reaches specific points in its execution.

    - A thread may be uncancelable. Attempts to cancel the thread are quietly ignored.


    When initially created, a thread is synchronously cancelable.


    # 4.2.1 Synchronous and Asynchronous Threads


    An asynchronously cancelable thread may be canceled at any point in its execution.
    A synchronously cancelable thread, in contrast, may be canceled only at particular
    places in its execution. These places are called cancellation points. The thread
    will queue a cancellation request until it reaches the next cancellation point.


    To make a thread asynchronously cancelable, use pthread_setcanceltype. This affects
    the thread that actually calls the function. The first argument should be PTHREAD_CANCEL_ASYNCHRONOUS
    to make the thread asynchronously cancelable, or PTHREAD_CANCEL_DEFERRED to return
    it to the synchronously cancelable state. The second argument, if not null, is
    a pointer to a variable that will receive the previous cancellation type for the
    thread. This call, for example, makes the calling thread asynchronously cancelable.


    ```

    pthread_setcanceltype (PTHREAD_CANCEL_ASYNCHRONOUS, NULL);

    ```


    What constitutes a cancellation point, and where should these be placed? The most
    direct way to create a cancellation point is to call pthread_testcancel. This
    does nothing except process a pending cancellation in a synchronously cancelable
    thread. You should call pthread_testcancel periodically during lengthy computations
    in a thread function, at points where the thread can be canceled without leaking
    any resources or producing other ill effects.


    Certain other functions are implicitly cancellation points as well. These are
    listed on the pthread_cancel man page. Note that other functions may use these
    functions internally and thus will indirectly be cancellation points.'
