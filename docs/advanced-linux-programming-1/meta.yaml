  md: "You may create as many thread-specific data items as you want, each of type\
    \ void*. Each item is referenced by a key. To create a new key, and thus a new\
    \ data item for each thread, use pthread_key_create. The first argument is a pointer\
    \ to a pthread_key_t variable. That key value can be used by each thread to access\
    \ its own copy of the corresponding data item. The second argument to pthread_key_t\
    \ is a cleanup function. If you pass a function pointer here, GNU/Linux automatically\
    \ calls that function when each thread exits, passing the thread-specific value\
    \ corresponding to that key. This is particularly handy because the cleanup function\
    \ is called even if the thread is canceled at some arbitrary point in its execution.\
    \ If the thread-specific value is null, the thread cleanup function is not called.\
    \ If you don't need a cleanup function, you may pass null instead of a function\
    \ pointer.\n\nAfter you've created a key, each thread can set its thread-specific\
    \ value corresponding to that key by calling pthread_setspecific. The first argument\
    \ is the key, and the second is the void* thread-specific value to store. To retrieve\
    \ a thread-specific data item, call pthread_getspecific, passing the key as its\
    \ argument.\n\nSuppose, for instance, that your application divides a task among\
    \ multiple threads. For audit purposes, each thread is to have a separate log\
    \ file, in which progress messages for that thread's tasks are recorded. The thread-specific\
    \ data area is a convenient place to store the file pointer for the log file for\
    \ each individual thread.\n\nListing 4.7 shows how you might implement this. The\
    \ main function in this sample program creates a key to store the thread-specific\
    \ file pointer and then stores it in thread_log_key. Because this is a global\
    \ variable, it is shared by all threads. When each thread starts executing its\
    \ thread function, it opens a log file and stores the file pointer under that\
    \ key. Later, any of these threads may call write_to_thread_log to write a message\
    \ to the thread-specific log file. That function retrieves the file pointer for\
    \ the thread's log file from thread-specific data and writes the message.\n\n\
    ```\nListing 4.7 (tsd.c) Per-Thread Log Files Implemented with Thread-Specific\
    \ Data\n\n#include <malloc.h>\n#include <pthread.h>\n#include <stdio.h>\n\n/*\
    \ The key used to associate a log file pointer with each thread. */\nstatic pthread_key_t\
    \ thread_log_key;\n\n/* Write MESSAGE to the log file for the current thread.\
    \ */\n\nvoid write_to_thread_log (const char* message)\n{\n  FILE* thread_log\
    \ = (FILE*) pthread_getspecific (thread_log_key);\n  fprintf (thread_log, \"%s\\\
    n\", message);\n}\n\n/* Close the log file pointer THREAD_LOG. */\n\nvoid close_thread_log\
    \ (void* thread_log)\n```"
