    \ The first one is the name of the program itself, as specified on the command\
    \ line, namely `ls`. The second and third elements of the argument list are the\
    \ two command-line arguments, `-s` and `/`.\n\nThe main function of your program\
    \ can access the argument list via the `argc` and `argv` parameters to `main`\
    \ (if you don't use them, you may simply omit them). The first parameter, `argc`,\
    \ is an integer that is set to the number of items in the argument list. The second\
    \ parameter, `argv`, is an array of character pointers. The size of the array\
