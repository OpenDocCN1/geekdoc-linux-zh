    passed as its argument.


    module.c contains two functions:


    +   module_open attempts to load a server module with a given name. The name normally
    ends with the .so extension because server modules are implemented as shared libraries.
    This function opens the shared library with dlopen and resolves a symbol named
    module_generate from the library with dlsym (see Section 2.3.6, “Dynamic Loading
    and Unloading,” in Chapter 2). If the library can’t be opened, or if module_generate
    isn’t a name exported by the library, the call fails and module_open returns a
    null pointer. Otherwise, it allocates and returns a module object.

    module_close closes the shared library corresponding to the server module and
    deallocates the struct server_module object.


