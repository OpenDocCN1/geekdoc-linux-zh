    # A.3.2  Collecting Profiling Information


    The first step in profiling a program is to annotate its executable to collect
    profiling information. To do so, use the `-pg` compiler flag when both compiling
    the object files and linking. For example, consider this code:


    ```

    % gcc -pg -c -o calculator.o calculator.c

    % gcc -pg -c -o stack.o stack.c

    % gcc -pg -c -o number.o number.c

    % gcc -pg calculator.o stack.o number.o -o calculator

    ```


    This enables collecting information about function calls and timing information.
    To collect line-by-line use information, also specify the debugging flag `-g`.
    To count basic block executions, such as the number of `do`-loop iterations, use
    `-a`.


    The second step is to run the program. While it is running, profiling data is
    collected into a file named `gmon.out`, only for those portions of the code that
    are exercised. You must vary the program''s input or commands to exercise the
    code sections that you want to profile. The program must terminate normally for
    the profiling file to be written.


