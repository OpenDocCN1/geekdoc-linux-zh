  md: 'This command sets a breakpoint on the first line of `main`.⁶ Now try rerunning
    the program with an argument, like this:


    ```

    (gdb) run 7

    Starting program: reciprocal 7


    Breakpoint 1, main (argc=2, argv=0xbffff5e4) at main.c:8

    8       i = atoi (argv[1]);

    ```


    You can see that the debugger has stopped at the breakpoint.


    You can step over the call to `atoi` using the `next` command:


    ```

    (gdb) next

    9       printf ("The reciprocal of %d is %g\n", i, reciprocal (i));

    ```


    If you want to see what''s going on inside `reciprocal`, use the `step` command
    like this:


    ```

    (gdb) step

    reciprocal (i=7) at reciprocal.cpp:6

    6       assert (i != 0);

    ```


    You''re now in the body of the `reciprocal` function.


    You might find it more convenient to run `gdb` from within Emacs rather than using
    `gdb` directly from the command line. Use the command `M-x gdb` to start up `gdb`
    in an Emacs window. If you are stopped at a breakpoint, Emacs automatically pulls
    up the appropriate source file. It''s easier to figure out what''s going on when
    you''re looking at the whole file rather than just one line of text.


    # ## 1.5 Finding More Information


    Nearly every Linux distribution comes with a great deal of useful documentation.
    You could learn most of what we''ll talk about in this book by reading documentation
    in your Linux distribution (although it would probably take you much longer).
    The documentation isn''t always well-organized, though, so the tricky part is
    finding what you need. Documentation is also sometimes out-of-date, so take everything
    that you read with a grain of salt. If the system doesn''t behave the way a *man
    page* (manual pages) says it should, for instance, it may be that the man page
    is outdated.


    To help you navigate, here are the most useful sources of information about advanced
    Linux programming.


    6. Some people have commented that saying `break main` is a little bit funny because
