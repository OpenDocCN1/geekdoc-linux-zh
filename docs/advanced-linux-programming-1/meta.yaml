  md: 'from or write to that file descriptor. Because a process and all its threads
    can be executing only one program at a time, if any thread inside a process calls
    one of the `exec` functions, all the other threads are ended (the new program
    may, of course, create new threads).


    GNU/Linux implements the POSIX standard thread API (known as *pthreads*). All
    thread functions and data types are declared in the header file `<pthread.h>`.
    The pthread functions are not included in the standard C library. Instead, they
    are in libpthread, so you should add `-lpthread` to the command line when you
    link your program.


    # 4.1 Thread Creation


    Each thread in a process is identified by a *thread ID*. When referring to thread
    IDs in C or C++ programs, use the type `pthread_t`.


    Upon creation, each thread executes a *thread function*. This is just an ordinary
    function and contains the code that the thread should run. When the function returns,
    the thread exits. On GNU/Linux, thread functions take a single parameter, of type
    `void*`, and have a `void*` return type. The parameter is the *thread argument*:
    GNU/Linux passes the value along to the thread without looking at it. Your program
    can use this parameter to pass data to a new thread. Similarly, your program can
    use the return value to pass data from an exiting thread back to its creator.


    The `pthread_create` function creates a new thread. You provide it with the following:


    +   1. A pointer to a `pthread_t` variable, in which the thread ID of the new
    thread is stored.

    2. A pointer to a *thread attribute* object. This object controls details of how
    the thread interacts with the rest of the program. If you pass `NULL` as the thread
    attribute, a thread will be created with the default thread attributes. Thread
    attributes are discussed in Section 4.1.5, "Thread Attributes."

    3. A pointer to the thread function. This is an ordinary function pointer, of
    this type:

    4. A thread argument value of type `void*`. Whatever you pass is simply passed
    as the argument to the thread function when the thread begins executing.


    ```

    void* (*) (void*)

    ```


    A call to `pthread_create` returns immediately, and the original thread continues
    executing the instructions following the call. Meanwhile, the new thread begins
    executing the thread function. Linux schedules both threads asynchronously, and
    your program must not rely on the relative order in which instructions are executed
    in the two threads.'
