  md: '206  Chapter 10  Security


    Programs that authenticate users when they log in take advantage of the capability
    to change user IDs as well. These login programs run as *root*. When the user
    enters a username and password, the login program verifies the username and password
    in the system password database. Then the login program changes both the effective
    user ID and the real ID to be that of the user. Finally, the login program calls
    `exec` to start the user''s shell, leaving the user running a shell whose effective
    user ID and real user ID are that of the user.


    The function used to change the user IDs for a process is `setreuid`. (There is,
    of course, a corresponding `setregid` function as well.) This function takes two
    arguments. The first argument is the desired real user ID; the second is the desired
    effective user ID. For example, here''s how you would exchange the effective and
    real user IDs:


    ```

    setreuid (geteuid(), getuid ());

    ```


    Obviously, the kernel won''t let just any process change its user IDs. If a process
    were allowed to change its effective user ID at will, then any user could easily
    impersonate any other user, simply by changing the effective user ID of one of
    his processes. The kernel will let a process running with an effective user ID
    of 0 change its user IDs as it sees fit. (Again, notice how much power a process
    running as root has! A process whose effective user ID is 0 can do absolutely
    anything it pleases.) Any other process, however, can do only one of the following
    things:


    +   - Set its effective user ID to be the same as its real user ID

    - Set its real user ID to be the same as its effective user ID

    - Swap the two user IDs


    The first alternative would be used by our accounting process when it has finished
    accessing files as *mitchell* and wants to return to being root. The second alternative
    could be used by a login program after it has set the effective user ID to that
    of the user who just logged in. Setting the real user ID ensures that the user
    will never be able go back to being root. Swapping the two user IDs is almost
    a historical artifact; modern programs rarely use this functionality.


    You can pass `-1` to either argument to `setreuid` if you want to leave that user
    ID alone. There''s also a convenience function called `seteuid`. This function
    sets the effective user ID, but it doesn''t modify the real user ID. The following
    two statements both do exactly the same thing:


    ```

    seteuid (id);

    setreuid (-1, id);

    ```


    # 10.4.1  Setuid Programs


    Using the previous techniques, you know how to make a root process impersonate
    another process temporarily and then return to being root. You also know how to
    make a root process drop all its special privileges by setting both its real user
    ID and its effective user ID.'
