    # Listing 5.4 (sem_pv.c) Wait and Post Operations for a Binary Semaphore\n\n```\n\
    #include <sys/types.h>\n#include <sys/ipc.h>\n#include <sys/sem.h>\n\n/* Wait\
    \ on a binary semaphore.  Block until the semaphore value is positive, then\n\
    \   decrement it by 1.  */\n\nint binary_semaphore_wait (int semid)\n{\n  struct\
    \ sembuf operations[1];\n  /* Use the first (and only) semaphore.  */\n  operations[0].sem_num\
    \ = 0;\n  /* Decrement by 1.  */\n  operations[0].sem_op = -1;\n  /* Permit undo'ing.\
    \  */\n  operations[0].sem_flg = SEM_UNDO;\n\n  return semop (semid, operations,\
    \ 1);\n}\n\n/* Post to a binary semaphore: increment its value by 1.\n   This\
    \ returns immediately.  */\n\nint binary_semaphore_post (int semid)\n{\n  struct\
    \ sembuf operations[1];\n  /* Use the first (and only) semaphore.  */\n  operations[0].sem_num\
    \ = 0;\n  /* Increment by 1.  */\n  operations[0].sem_op = 1;\n  /* Permit undo'ing.\
    \  */\n  operations[0].sem_flg = SEM_UNDO;\n\n  return semop (semid, operations,\
    \ 1);\n}\n```\n\nSpecifying the SEM_UNDO flag permits dealing with the problem\
    \ of terminating a process while it has resources allocated through a semaphore.\
