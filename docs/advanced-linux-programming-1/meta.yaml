  md: '# # 1.5.1 Man Pages


    Linux distributions include man pages for most standard commands, system calls,
    and standard library functions. The man pages are divided into numbered sections;
    for programmers, the most important are these:


    +   1. User commands

    2. System calls

    3. Standard library functions

    8. System/administrative commands


    The numbers denote man page sections. Linux''s man pages come installed on your
    system; use the `man` command to access them. To look up a man page, simply invoke
    `man name`, where `name` is a command or function name. In a few cases, the same
    name occurs in more than one section; you can specify the section explicitly by
    placing the section number before the name. For example, if you type the following,
    you''ll get the man page for the `sleep` command (in section 1 of the Linux man
    pages):


    ```

    % man sleep

    ```


    To see the man page for the `sleep` library function, use this command:


    ```

    % man 3 sleep

    ```


    Each man page includes a one-line summary of the command or function. The `whatis
    name` command displays all man pages (in all sections) for a command or function
    matching `name`. If you''re not sure which command or function you want, you can
    perform a keyword search on the summary lines, using `man -k keyword`.


    Man pages include a lot of very useful information and should be the first place
    you turn for help. The man page for a command describes command-line options and
    arguments, input and output, error codes, configuration, and the like. The man
    page for a system call or library function describes parameters and return values,
    lists error codes and side effects, and specifies which include file to use if
    you call the function.


    # # 1.5.2 Info


    The Info documentation system contains more detailed documentation for many core
    components of the GNU/Linux system, plus several other programs. Info pages are
    hypertext documents, similar to Web pages. To launch the text-based Info browser,
    just type `info` in a shell window. You''ll be presented with a menu of Info documents
    installed on your system. (Press Control+H to display the keys for navigating
    an Info document.)


    Among the most useful Info documents are these:


    +   - `gcc`—The gcc compiler

    - `1ibc`—The GNU C library, including many system calls

    - `gdb`—The GNU debugger'
