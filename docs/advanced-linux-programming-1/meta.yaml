    The ruins of the Stabian Baths in Pompeii, captured by photographer Mel Curtis,
    are featured on the cover of this book. Said to be the largest and oldest of the
    baths, the Stabian baths also offered massages and poetry readings. Residents
    of Pompeii visited these public baths daily. The baths are named for their location
    on Stabian Street.


    This book was written and edited in LaTeX, and then converted to Microsoft Word
    by New Riders and laid out in QuarkXPress. The font used for the body text is
    Bembo and MCPdigital. It was printed on 50# Husky Offset Smooth paper at R.R.
    Donnelley & Sons in Crawfordsville, Indiana. Prepress consisted of PostScript
    computer-to-plate technology (filmless process). The cover was printed at Moore
    Langen Printing in Terre Haute, Indiana, on Carolina, coated on one side.'
