  md: "# 4.3.1 Cleanup Handlers\n\nThe cleanup functions for thread-specific data\
    \ keys can be very handy for ensuring that resources are not leaked when a thread\
    \ exits or is canceled. Sometimes, though, it’s useful to be able to specify cleanup\
    \ functions without creating a new thread-specific data item that’s duplicated\
    \ for each thread. GNU/Linux provides *cleanup handlers* for this purpose.\n\n\
    A cleanup handler is simply a function that should be called when a thread exits.\
    \ The handler takes a single `void*` parameter, and its argument value is provided\
    \ when the handler is registered—this makes it easy to use the same handler function\
