    \ character string is terminated with a single NUL and will not handle NULs embedded\
    \ within strings, so you'll have to handle the contents specially.\n\n> **NUL\
    \ vs. NULL**\n\nNUL is the character with integer value 0. It's different from\
    \ NULL, which is a pointer with value 0.\n\nIn C, a character string is usually\
    \ terminated with a NUL character. For instance, the character string \"Hello,\
    \ world!\" occupies 14 bytes because there is an implicit NUL after the exclamation\
    \ point indicating the end of the string.\n\nNULL, on the other hand, is a pointer\
    \ value that you can be sure will never correspond to a real memory address in\
    \ your program.\n\nIn C and C++, NUL is expressed as the character constant '\\\
    0', or `(char) 0`. The definition of NULL differs among operating systems; on\
    \ Linux, it is defined as `((void*)0)` in C and simply `0` in C++.\n\nIn Section\
    \ 2.1.1, we presented a program in Listing 2.1 that printed out its own argument\
    \ list. Using the `cmdline` entries in the `/proc` file system, we can implement\
    \ a program that prints the argument of another process. Listing 7.3 is such a\
    \ program; it prints the argument list of the process with the specified process\
    \ ID. Because there may be several NULs in the contents of `cmdline` rather than\
