  md: "In a program, you access an environment variable with the `getenv` function\
    \ in `<stdlib.h>`. That function takes a variable name and returns the corresponding\
    \ value as a character string, or NULL if that variable is not defined in the\
    \ environment. To set or clear environment variables, use the `setenv` and `unsetenv`\
    \ functions, respectively.\n\nEnumerating all the variables in the environment\
    \ is a little trickier. To do this, you must access a special global variable\
    \ named `environ`, which is defined in the GNU C library. This variable, of type\
    \ `char**`, is a NULL-terminated array of pointers to character strings. Each\
    \ string contains one environment variable, in the form `VARIABLE=value`.\n\n\
    The program in Listing 2.3, for instance, simply prints the entire environment\
    \ by looping through the `environ` array.\n\n**Listing 2.3** &nbsp; *(print-env.c)*\
    \ **Printing the Execution Environment**\n\n```\n#include <stdio.h>\n\n/* The\
    \ ENVIRON variable contains the environment. */\nextern char** environ;\n\nint\
    \ main ()\n{\n    char** var;\n    for (var = environ; *var != NULL; ++var)\n\
    \        printf (\"%s\\n\", *var);\n    return 0;\n}\n```\n\nDon't modify `environ`\
    \ yourself; use the `setenv` and `unsetenv` functions instead.\n\nUsually, when\
    \ a new program is started, it inherits a copy of the environment of the program\
    \ that invoked it (the shell program, if it was invoked interactively). So, for\
    \ instance, programs that you run from the shell may examine the values of environment\
    \ variables that you set in the shell.\n\nEnvironment variables are commonly used\
    \ to communicate configuration information to programs. Suppose, for example,\
