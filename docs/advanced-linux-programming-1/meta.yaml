  md: 'Note that the -O2 flag was inserted in place of $(CFLAGS) in the rules.

    In this section, you''ve seen only the most basic capabilities of make. You can
    find out more by typing this:


    ```

    % info make

    ```


    In that manual, you''ll find information about how to make maintaining a Makefile
    easier, how to reduce the number of rules that you need to write, and how to automatically
    compute dependencies. You can also find more information in *GNU, Autoconf, Automake,
    and Libtool* by Gary V. Vaughan, Ben Elliston, Tom Tromey, and Ian Lance Taylor
    (New Riders Publishing, 2000).


    # 1.4 Debugging with GNU Debugger (GDB)


    The *debugger* is the program that you use to figure out why your program isn''t
    behaving the way you think it should. You''ll be doing this a lot.<sup>5</sup>
    The GNU Debugger (GDB) is the debugger used by most Linux programmers. You can
    use GDB to step through your code, set breakpoints, and examine the value of local
    variables.


    # 1.4.1 Compiling with Debugging Information


    To use GDB, you''ll have to compile with debugging information enabled. Do this
    by adding the -g switch on the compilation command line. If you''re using a Makefile
    as described previously, you can just set CFLAGS equal to -g when you run make,
    as shown here:


    ```

    % make CFLAGS=-g

    gcc -g -c main.c

    g++ -g -c reciprocal.cpp

    g++ -g -o reciprocal main.o reciprocal.o

    ```


    When you compile with -g, the compiler includes extra information in the object
    files and executables. The debugger uses this information to figure out which
    addresses correspond to which lines in which source files, how to print out local
    variables, and so forth.


    # 1.4.2 Running GDB


    You can start up gdb by typing:


    ```

    % gdb reciprocal

    ```


    When gdb starts up, you should see the GDB prompt:


    ```

    (gdb)

    ```


    > 5. ...unless your programs always work the first time.'
