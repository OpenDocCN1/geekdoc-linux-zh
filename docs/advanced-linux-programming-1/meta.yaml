- img_proc: false
  md: "You can use the `WIFEXITED` macro to determine from a child process's exit\
    \ status whether that process exited normally (via the exit function or returning\
    \ from main) or died from an unhandled signal. In the latter case, use the `WTERMSIG`\
    \ macro to extract from its exit status the signal number by which it died.\n\n\
    Here is the `main` function from the fork and exec example again. This time, the\
    \ parent process calls wait to wait until the child process, in which the `ls`\
    \ command executes, is finished.\n\n```\nint main ()\n{\n  int child_status;\n\
    \n  /* The argument list to pass to the \"ls\" command.  */\n  char* arg_list[]\
    \ = {\n    \"ls\",     /* argv[0], the name of the program.  */\n    \"-l\",\n\
    \    \"/\",\n    NULL     /* The argument list must end with a NULL.  */\n  };\n\
    \n  /* Spawn a child process running the \"ls\" command.  Ignore the\n     returned\
    \ child process ID.  */\n  spawn (\"ls\", arg_list);\n\n  /* Wait for the child\
    \ process to complete.  */\n  wait (&child_status);\n  if (WIFEXITED (child_status))\n\
    \    printf (\"the child process exited normally, with exit code %d\\n\",\n  \
    \          WEXITSTATUS (child_status));\n  else\n    printf (\"the child process\
    \ exited abnormally\\n\");\n\n  return 0;\n}\n```\n\nSeveral similar system calls\
    \ are available in Linux, which are more flexible or provide more information\
    \ about the exiting child process. The `waitpid` function can be used to wait\
    \ for a specific child process to exit instead of any child process. The `wait3`\
    \ function returns CPU usage statistics about the exiting child process, and the\
    \ `wait4` function allows you to specify additional options about which processes\
    \ to wait for.\n\n# 3.4.3  Zombie Processes\n\nIf a child process terminates while\
    \ its parent is calling a wait function, the child process vanishes and its termination\
    \ status is passed to its parent via the wait call. But what happens when a child\
    \ process terminates and the parent is not calling wait? Does it simply vanish?\
    \ No, because then information about its termination—such as whether it exited\
    \ normally and, if so, what its exit status is—would be lost. Instead, when a\
    \ child process terminates, is becomes a zombie process."
