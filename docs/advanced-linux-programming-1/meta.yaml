    See Section 6.4, “Hardware Devices,” for information about serial devices.


    # 7.4 Kernel Information


    Many of the entries in /proc provide access to information about the running kernel''s
    configuration and state. Some of these entries are at the top level of /proc;
    others are under /proc/sys/kernel.


    # 7.4.1 Version Information


    The file /proc/version contains a long string describing the kernel''s release
    number and build version. It also includes information about how the kernel was
    built: the user who compiled it, the machine on which it was compiled, the date
    it was compiled, and the compiler release that was used—for example:


    ```

    % cat /proc/version

    Linux version 2.2.14-5.0 (root@porky.devel.redhat.com) (gcc version egcs-2.91.66
    19990314/Linux (egcs-1.1.2 release)) #1 Tue Mar 7 21:07:39 EST 2000

    ```


    This indicates that the system is running a 2.2.14 release of the Linux kernel,
    which was compiled with EGCS release 1.1.2. (EGCS, the *Experimental GNU Compiler
    System*, was a precursor to the current GCC project.)


    The most important items in this output, the OS name and kernel version and revision,
    are available in separate /proc entries as well. These are /proc/sys/kernel/ostype,
    /proc/sys/kernel/osrelease, and /proc/sys/kernel/version, respectively.


    ```

    % cat /proc/sys/kernel/ostype

    Linux

    % cat /proc/sys/kernel/osrelease

    2.2.14-5.0

    % cat /proc/sys/kernel/version

    #1 Tue Mar 7 21:07:39 EST 2000

    ```


    # 7.4.2 Hostname and Domain Name


    The /proc/sys/kernel/hostname and /proc/sys/kernel/domainname entries contain
    the computer''s hostname and domain name, respectively.This information is the
    same as that returned by the uname system call, described in Section 8.15.'
