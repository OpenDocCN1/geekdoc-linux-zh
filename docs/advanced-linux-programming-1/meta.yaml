  md: 'This lists the process ID, parent process ID, process status, and process command
    line. Observe that, in addition to the parent make-zombie process, there is another
    make-zombie process listed. It''s the child process; note that its parent process
    ID is the process ID of the main make-zombie process. The child process is marked
    as <defunct>, and its status code is Z, for zombie.


    What happens when the main make-zombie program ends when the parent process exits,
    without ever calling wait? Does the zombie process stay around? No—try running
    ps again, and note that both of the make-zombie processes are gone. When a program
    exits, its children are inherited by a special process, the init program, which
    always runs with process ID of 1 (it''s the first process started when Linux boots).
    The init process automatically cleans up any zombie child processes that it inherits.


    # 3.4.4 Cleaning Up Children Asynchronously


    If you''re using a child process simply to exec another program, it''s fine to
    call wait immediately in the parent process, which will block until the child
    process completes. But often, you''ll want the parent process to continue running,
    as one or more children execute synchronously. How can you be sure that you clean
    up child processes that have completed so that you don''t leave zombie processes,
    which consume system resources, laying around?


    One approach would be for the parent process to call wait3 or wait4 periodically,
    to clean up zombie children. Calling wait for this purpose doesn''t work well
    because, if no children have terminated, the call will block until one does. However,
    wait3 and wait4 take an additional flag parameter, to which you can pass the flag
    value WNOHANG. With this flag, the function runs in nonblocking mode—it will clean
    up a terminated child process if there is one, or simply return if there isn''t.
    The return value of the call is the process ID of the terminated child in the
    former case, or zero in the latter case.


    A more elegant solution is to notify the parent process when a child terminates.
    There are several ways to do this using the methods discussed in Chapter 5, "Interprocess
    Communication," but fortunately Linux does this for you, using signals. When a
    child process terminates, Linux sends the parent process the SIGCHLD signal. The
    default disposition of this signal is to do nothing, which is why you might not
    have noticed it before.


    Thus, an easy way to clean up child processes is by handling SIGCHLD. Of course,
    when cleaning up the child process, it''s important to store its termination status
    if this information is needed, because once the process is cleaned up using wait,
    that information is no longer available. Listing 3.7 is what it looks like for
    a program to use a SIGCHLD handler to clean up its child processes.'
  merge: -1
