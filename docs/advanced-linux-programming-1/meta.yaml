  md: "# ## 3.2 Creating Processes\n\nTwo common techniques are used for creating\
    \ a new process. The first is relatively simple but should be used sparingly because\
    \ it is inefficient and has considerably security risks. The second technique\
    \ is more complex but provides greater flexibility, speed, and security.\n\n#\
    \ ### 3.2.1 Using *system*\n\nThe `system` function in the standard C library\
    \ provides an easy way to execute a command from within a program, much as if\
    \ the command had been typed into a shell. In fact, `system` creates a subprocess\
    \ running the standard Bourne shell (`/bin/sh`) and hands the command to that\
    \ shell for execution. For example, this program in Listing 3.2 invokes the `ls`\
    \ command to display the contents of the root directory, as if you typed `ls -l\
    \ /` into a shell.\n\n**Listing 3.2 *(system.c)* Using the *system* Call**\n\n\
    ```\n#include <stdlib.h>\n\nint main ()\n{\n  int return_value;\n  return_value\
    \ = system (\"ls -l /\");\n  return return_value;\n}\n```\n\nThe `system` function\
    \ returns the exit status of the shell command. If the shell itself cannot be\
    \ run, `system` returns 127; if another error occurs, `system` returns -1.\n\n\
    Because the `system` function uses a shell to invoke your command, it's subject\
    \ to the features, limitations, and security flaws of the system's shell. You\
    \ can't rely on the availability of any particular version of the Bourne shell.\
    \ On many UNIX systems, `/bin/sh` is a symbolic link to another shell. For instance,\
    \ on most GNU/Linux systems, `/bin/sh` points to `bash` (the Bourne-Again SHell),\
    \ and different GNU/Linux distributions use different versions of `bash`. Invoking\
    \ a program with root privilege with the `system` function, for instance, can\
    \ have different results on different GNU/Linux systems. Therefore, it's preferable\
    \ to use the `fork` and `exec` method for creating processes.\n\n# ### 3.2.2 Using\
    \ *fork* and *exec*\n\nThe DOS and Windows API contains the `spawn` family of\
    \ functions. These functions take as an argument the name of a program to run\
    \ and create a new process instance of that program. Linux doesn't contain a single\
    \ function that does all this in one step. Instead, Linux provides one function,\
    \ `fork`, that makes a child process that is an exact"
  merge: -1
  pgno: 71
- img_proc: false
  md: "copy of its parent process. Linux provides another set of functions, the `exec`\
    \ family, that causes a particular process to cease being an instance of one program\
    \ and to instead become an instance of another program. To spawn a new process,\
    \ you first use `fork` to make a copy of the current process. Then you use `exec`\
    \ to transform one of these processes into an instance of the program you want\
    \ to spawn.\n\n# ### Calling *fork*\n\nWhen a program calls `fork`, a duplicate\
    \ process, called the *child process*, is created. The parent process continues\
    \ executing the program from the point that `fork` was called. The child process,\
    \ too, executes the same program from the same place.\n\nSo how do the two processes\
    \ differ? First, the child process is a new process and therefore has a new process\
    \ ID, distinct from its parent's process ID. One way for a program to distinguish\
    \ whether it's in the parent process or the child process is to call `getpid`.\
    \ However, the `fork` function provides different return values to the parent\
    \ and child processes—one process \"goes in\" to the `fork` call, and two processes\
    \ \"come out,\" with different return values. The return value in the parent process\
    \ is the process ID of the child. The return value in the child process is zero.\
    \ Because no process ever has a process ID of zero, this makes it easy for the\
    \ program whether it is now running as the parent or the child process.\n\nListing\
    \ 3.3 is an example of using `fork` to duplicate a program's process. Note that\
    \ the first block of the `if` statement is executed only in the parent process,\
    \ while the `else` clause is executed in the child process.\n\n# Listing 3.3 (*fork.c*)\
    \ Using *fork* to Duplicate a Program's Process\n\n```\n#include <stdio.h>\n#include\
    \ <sys/types.h>\n#include <unistd.h>\n\nint main ()\n{\n  pid_t child_pid;\n\n\
    \  printf (\"the main program process ID is %d\\n\", (int) getpid ());\n\n  child_pid\
    \ = fork ();\n  if (child_pid != 0) {\n    printf (\"this is the parent process,\
    \ with id %d\\n\", (int) getpid ());\n    printf (\"the child's process ID is\
    \ %d\\n\", (int) child_pid);\n  }\n  else\n    printf (\"this is the child process,\
    \ with id %d\\n\", (int) getpid ());\n\n  return 0;\n}\n```"
