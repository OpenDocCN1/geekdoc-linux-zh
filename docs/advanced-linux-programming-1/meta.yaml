    # # Interprocess Communication


    **CHAPTER 3, “PROCESSES,” DISCUSSED THE CREATION OF PROCESSES** and showed how
    one process can obtain the exit status of a child process. That''s the simplest
    form of communication between two processes, but it''s by no means the most powerful.
    The mechanisms of Chapter 3 don''t provide any way for the parent to communicate
    with the child except via command-line arguments and environment variables, nor
    any way for the child to communicate with the parent except via the child''s exit
    status. None of these mechanisms provides any means for communicating with the
    child process while it is actually running, nor do these mechanisms allow communication
    with a process outside the parent–child relationship.


    This chapter describes means for interprocess communication that circumvent these
    limitations. We will present various ways for communicating between parents and
    children, between “unrelated” processes, and even between processes on different
    machines.


    *Interprocess communication (IPC)* is the transfer of data among processes. For
    example, a Web browser may request a Web page from a Web server, which then sends
    HTML data. This transfer of data usually uses sockets in a telephone-like connection.
    In another example, you may want to print the filenames in a directory using a
    command such as `ls | lpr`. The shell creates an `ls` process and a separate `lpr`
    process, connecting'
