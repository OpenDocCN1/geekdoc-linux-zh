  md: '# A.2 Finding Dynamic Memory Errors


    When writing a program, you frequently can''t know how much memory the program
    will need when it runs. For example, a line read from a file at runtime might
    have any finite length. C and C++ programs use `malloc`, `free`, and their variants
    to dynamically allocate memory while the program is running. The rules for dynamic
    memory use include these:


    +   - The number of allocation calls (calls to `malloc`) must exactly match the
    number of deallocation calls (calls to `free`).

    - Reads and writes to the allocated memory must occur within the memory, not outside
    its range.

    - The allocated memory cannot be used before it is allocated or after it is deallocated.


    Because dynamic memory allocation and deallocation occur at runtime, static program
    analysis rarely find violations. Instead, memory-checking tools run the program,
    collecting data to determine if any of these rules have been violated. The violations
    a tool may find include the following:


    +   - Reading from memory before allocating it

    - Writing to memory before allocating it

    - Reading before the beginning of allocated memory

    - Writing before the beginning of allocated memory

    - Reading after the end of allocated memory

    - Writing after the end of allocated memory

    - Reading from memory after its deallocation

    - Writing to memory after its deallocation

    - Failing to deallocate allocated memory

    - Deallocating the same memory twice

    - Deallocating memory that is not allocated


    It is also useful to warn about requesting an allocation with 0 bytes, which probably
    indicates programmer error.


    Table A.1 indicates four different tools'' diagnostic capabilities. Unfortunately,
    no single tool diagnoses all the memory use errors. Also, no tool claims to detect
    reading or writing before allocating memory, but doing so will probably cause
    a segmentation fault. Deallocating memory twice will probably also cause a segmentation
    fault. These tools diagnose only errors that actually occur while the program
    is running. If you run the program with inputs that cause no memory to be allocated,
    the tools will indicate no memory errors. To test a program thoroughly, you must
    run the program using different inputs to ensure that every possible path through
    the program occurs. Also, you may use only one tool at a time, so you''ll have
    to repeat testing with several tools to get the best error checking.'
  merge: -1
