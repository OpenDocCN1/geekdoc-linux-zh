    As the program runs, allocated memory uses are checked for correctness. A violation
    causes a segmentation fault:


    ```

    % ./emalloc-use 12

    Electric Fence 2.0.5 Copyright (C) 1987-1998 Bruce Perens.

    Please enter a command: a 0 12

    Please enter a command: r 0 12

    Segmentation fault

    ```


    Using a debugger, you can determine the context of the illegal action.

    By default, Electric Fence diagnoses only accesses beyond the ends of allocations.
    To find accesses before the beginning of allocations *instead of* accesses beyond
    the end of allocations, use this code:


    ```

    % export EF_PROTECT_BELOW=1

    ```


    To find accesses to deallocated memory, set EF_PROTECT_FREE to 1. More capabilities
    are described in the libefence manual page.

    Electric Fence diagnoses illegal memory accesses by storing each allocation on
    at least two memory pages. It places the allocation at the end of the first page;
    any access beyond the end of the allocation, on the second page, causes a segmentation
    fault. If you set EF_PROTECT_BELOW to 1, it places the allocation at the beginning
    of the second page instead. Because it allocates two memory pages per call to
    malloc, Electric Fence can use an enormous amount of memory. Use this library
    for debugging only.


    # A.2.6 Choosing Among the Different Memory-Debugging Tools


