  md: '(The second parameter is a flag that indicates how to bind symbols in the shared
    library. You can consult the online man pages for `dlopen` if you want more information,
    but `RTLD_LAZY` is usually the setting that you want.) To use dynamic loading
    functions, include the `<dlfcn.h>` header file and link with the `-ldl` option
    to pick up the `libdl` library.


    The return value from this function is a `void *` that is used as a handle for
    the shared library. You can pass this value to the `dlsym` function to obtain
    the address of a function that has been loaded with the shared library. For example,
    if `libtest.so` defines a function named `my_function`, you could call it like
    this:


    ```

    void* handle = dlopen ("libtest.so", RTLD_LAZY);

    void (*test)() = dlsym (handle, "my_function");

    (*test)();

    dlclose (handle);

    ```


    The `dlsym` system call can also be used to obtain a pointer to a static variable
    in the shared library.


    Both `dlopen` and `dlsym` return `NULL` if they do not succeed. In that event,
    you can call `dlerror` (with no parameters) to obtain a human-readable error message
    describing the problem.


    The `dlclose` function unloads the shared library. Technically, `dlopen` actually
    loads the library only if it is not already loaded. If the library has already
    been loaded, `dlopen` simply increments the library reference count. Similarly,
    `dlclose` decrements the reference count and then unloads the library only if
    the reference count has reached zero.


    If you''re writing the code in your shared library in C++, you will probably want
    to declare those functions and variables that you plan to access elsewhere with
    the `extern "C"` linkage specifier. For instance, if the C++ function `my_function`
    is in a shared library and you want to access it with `dlsym`, you should declare
    it like this:


    ```

    extern "C" void foo ();

    ```


    This prevents the C++ compiler from mangling the function name, which would change
    the function''s name from `foo` to a different, funny-looking name that encodes
    extra information about the function. A C compiler will not mangle names; it will
    use whichever name you give to your function or variable.'
