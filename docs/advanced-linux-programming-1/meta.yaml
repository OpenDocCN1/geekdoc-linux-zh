  md: "+   - MS_INVALIDATE—All other file mappings are invalidated so that they can\
    \ see the updated values.\n\nFor example, to flush a shared file mapped at address\
    \ mem_addr of length mem_length bytes, call this:\n\n```\n    msync (mem_addr,\
    \ mem_length, MS_SYNC | MS_INVALIDATE);\n```\n\nAs with shared memory segments,\
    \ users of memory-mapped regions must establish and follow a protocol to avoid\
    \ race conditions. For example, a semaphore can be used to prevent more than one\
    \ process from accessing the mapped memory at one time. Alternatively, you can\
