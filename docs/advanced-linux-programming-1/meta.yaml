    # 2.1.2 GNU/Linux Command-Line Conventions


    Almost all GNU/Linux programs obey some conventions about how command-line arguments
    are interpreted. The arguments that programs expect fall into two categories:
    *options* (or *flags*) and other arguments. Options modify how the program behaves,
    while other arguments provide inputs (for instance, the names of input files).


    Options come in two forms:


    +   - *Short options* consist of a single hyphen and a single character (usually
    a lowercase or uppercase letter). Short options are quicker to type.

    - *Long options* consist of two hyphens, followed by a name made of lowercase
    and uppercase letters and hyphens. Long options are easier to remember and easier
    to read (in shell scripts, for instance).


    Usually, a program provides both a short form and a long form for most options
    it supports, the former for brevity and the latter for clarity. For example, most
    programs understand the options `-h` and `--help`, and treat them identically.
    Normally, when a program is invoked from the shell, any desired options follow
    the program name immediately. Some options expect an argument immediately following.
    Many programs, for example, interpret the option `--output foo` to specify that
    output of the program should be placed in a file named `foo`. After the options,
    there may follow other command-line arguments, typically input files or input
    data.


    For example, the command `ls -s /` displays the contents of the root directory.
    The `-s` option modifies the default behavior of `ls` by instructing it to display
    the size (in kilobytes) of each entry. The `/` argument tells `ls` which directory
    to list. The `--size` option is synonymous with `-s`, so the same command could
    have been invoked as `ls --size /`.


    The *GNU Coding Standards* list the names of some commonly used command-line options.
    If you plan to provide any options similar to these, it''s a good idea to use
    the names specified in the coding standards. Your program will behave more like
    other programs and will be easier for users to learn. You can view the GNU Coding
    Standards'' guidelines for command-line options by invoking the following from
    a shell prompt on most GNU/Linux systems:


    ```

    % info "(standards)User Interfaces"

    ```'
