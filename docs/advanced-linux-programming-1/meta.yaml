- img_proc: false
  md: "Listing 3.7 ***(sigchld.c)*** Cleaning Up Children by Handling **SIGCHLD**\n\
    \n```\n#include <signal.h>\n#include <string.h>\n#include <sys/types.h>\n#include\
    \ <sys/wait.h>\n\nsig_atomic_t child_exit_status;\n\nvoid clean_up_child_process\
    \ (int signal_number)\n{\n  /* Clean up the child process. */\n  int status;\n\
    \  wait (&status);\n  /* Store its exit status in a global variable. */\n  child_exit_status\
    \ = status;\n}\n\nint main ()\n{\n  /* Handle SIGCHLD by calling clean_up_child_process.\
    \ */\n  struct sigaction sigchld_action;\n  memset (&sigchld_action, 0, sizeof\
    \ (sigchld_action));\n  sigchld_action.sa_handler = &clean_up_child_process;\n\
    \  sigaction (SIGCHLD, &sigchld_action, NULL);\n\n  /* Now do things, including\
    \ forking a child process. */\n  /* ... */\n\n  return 0;\n}\n```\n\nNote how\
    \ the signal handler stores the child process's exit status in a global variable,\
    \ from which the main program can access it. Because the variable is assigned\
    \ in a signal handler, its type is sig_atomic_t."
