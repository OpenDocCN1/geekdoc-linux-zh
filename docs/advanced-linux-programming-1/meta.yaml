  md: '# 11.4 Using the Server


    If we were planning to distribute this program in source form, maintain it on
    an ongoing basis, or port it to other platforms, we probably would want to package
    it using GNU Automake and GNU Autoconf, or a similar configuration automation
    system. Such tools are outside the scope of this book; for more information about
    them, consult *GNU Autoconf, Automake, and Libtool* (by Vaughan, Elliston, Tromey,
    and Taylor, published by New Riders, 2000).


    # 11.4.1 The Makefile


    Instead of using Autoconf or a similar tool, we provide a simple Makefile compatible
    with GNU Make so that it''s easy to compile and link the server and its modules.
    The Makefile is shown in Listing 11.10. See the info page for GNU Make for details
    of the file''s syntax.


    Listing 11.10 (Makefile) GNU Make Configuration File for Server Example


    ```

    ### Configuration. ###########################################################


    # Default C compiler options.

    CFLAGS                = -Wall -g

    # C source files for the server.

    SOURCES               = server.c module.c common.c main.c

    # Corresponding object files.

    OBJECTS               = $(SOURCES:.c=.o)

    # Server module shared library files.

    MODULES               = diskfree.so issue.so processes.so time.so


    ### Rules. ####################################################################


    # Phony targets don''t correspond to files that are built; they''re names

    # for conceptual build targets.

    .PHONY:               all clean

    ```


    4. GNU Make comes installed on GNU/Linux systems.'
