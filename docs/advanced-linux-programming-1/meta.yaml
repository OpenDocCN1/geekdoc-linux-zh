  md: 'To set the sticky bit programmatically, call chmod with the S_ISVTX mode flag.
    For example, to set the sticky bit of the directory specified by dir_path to those
    of the /tmp and give full read, write, and execute permissions to all users, use
    this call:


    ```

    chmod (dir_path, S_IRWXU | S_IRWXG | S_IRWXO | S_ISVTX);

    ```


    # 10.4 Real and Effective IDs


    Until now, we''ve talked about the user ID and group ID associated with a process
    as if there were only one such user ID and one such group ID. But, actually, it''s
    not quite that simple.


    Every process really has two user IDs: the *effective user ID* and the *real user
    ID*. (Of course, there''s also an *effective group ID* and *real group ID*. Just
    about everything that''s true about user IDs is also true about group IDs.) Most
    of the time, the kernel checks only the effective user ID. For example, if a process
    tries to open a file, the kernel checks the effective user ID when deciding whether
    to let the process access the file.


    The `geteuid` and `getegid` functions described previously return the effective
    user ID and the effective group ID. Corresponding `getuid` and `getgid` functions
    return the real user ID and real group ID.


    If the kernel cares about only the effective user ID, it doesn''t seem like there''s
    much point in having a distinction between a real user ID and an effective user
    ID. However, there is one very important case in which the real user ID matters.
    If you want to change the effective user ID of an already running process, the
    kernel looks at the real user ID as well as the effective user ID.


    Before looking at *how* you can change the effective user ID of a process, let''s
    examine *why* you would want to do such a thing by looking back at our accounting
    package. Suppose that there''s a server process that might need to look at any
    file on the system, regardless of the user who created it. Such a process must
    run as root because only root can be guaranteed to be capable of looking at any
    file. But now suppose that a request comes in from a particular user (say, `mitchell`)
    to access some file. The server process could carefully examine the permissions
    associated with the files in question and try to decide whether `mitchell` should
    be allowed to access those files. But that would mean duplicating all the processing
    that the kernel would normally do to check file access permissions. Reimplementing
    that logic would be complex, error-prone, and tedious.


    A better approach is simply to temporarily change the effective user ID of the
    process from `root` to `mitchell` and then try to perform the operations required.
    If `mitchell` is not allowed to access the data, the kernel will prevent the process
    from doing so and will return appropriate indications of error. After all the
    operations taken on behalf of `mitchell` are complete, the process can restore
    its original effective user ID to root.'
