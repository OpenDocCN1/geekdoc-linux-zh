    \ user ID.\nThe trick is that the su program is a setuid program. That means that\
    \ when it is run, the effective user ID of the process will be that of the file's\
    \ owner rather than the effective user ID of the process that performed the exec\
    \ call. (The real user ID will still be that of the executing user.) To create\
