  md: '# # 2.2 Coding Defensively


    Writing programs that run correctly under “normal” use is hard; writing programs
    that behave gracefully in failure situations is harder. This section demonstrates
    some coding techniques for finding bugs early and for detecting and recovering
    from problems in a running program.


    The code samples presented later in this book deliberately skip extensive error
    checking and recovery code because this would obscure the basic functionality
    being presented. However, the final example in Chapter 11, “A Sample GNU/Linux
    Application,” comes back to demonstrating how to use these techniques to write
    robust programs.


    # ## 2.2.1 Using *assert*


    A good objective to keep in mind when coding application programs is that bugs
    or unexpected errors should cause the program to fail dramatically, as early as
    possible. This will help you find bugs earlier in the development and testing
    cycles. Failures that don''t exhibit themselves dramatically are often missed
    and don''t show up until the application is in users'' hands.


    One of the simplest methods to check for unexpected conditions is the standard
    C `assert` macro. The argument to this macro is a Boolean expression. The program
    is terminated if the expression evaluates to false, after printing an error message
    containing the source file and line number and the text of the expression. The
    `assert` macro is very useful for a wide variety of consistency checks internal
    to a program. For instance, use `assert` to test the validity of function arguments,
    to test preconditions and postconditions of function calls (and method calls,
    in C++), and to test for unexpected return values.


    Each use of `assert` serves not only as a runtime check of a condition, but also
    as documentation about the program''s operation within the source code. If your
    program contains an `assert(condition)` that says to someone reading your source
    code that *condition* should always be true at that point in the program, and
    if *condition* is not true, it''s probably a bug in the program.


    For performance-critical code, runtime checks such as uses of `assert` can impose
    a significant performance penalty. In these cases, you can compile your code with
    the `NDEBUG` macro defined, by using the `-DNDEBUG` flag on your compiler command
    line. With `NDEBUG` set, appearances of the `assert` macro will be preprocessed
    away. It''s a good idea to do this only when necessary for performance reasons,
    though, and only with performance-critical source files.


    Because it is possible to preprocess `assert` macros away, be careful that any
    expression you use with `assert` has no side effects. Specifically, you shouldn''t
    call functions inside `assert` expressions, assign variables, or use modifying
    operators such as ++.'
