  md: 'When you''re done, unmount the virtual file system.


    ```

    % cd /tmp

    % umount /tmp/virtual-fs

    ```


    You can delete `disk.image` if you like, or you can mount it later to access the
    files on the virtual file system. You can also copy it to another computer and
    mount it there—the whole file system that you created on it will be intact.


    Instead of creating a file system from scratch, you can copy one directly from
    a device. For instance, you can create an image of the contents of a CD-ROM simply
    by copying it from the CD-ROM device.


    If you have an IDE CD-ROM drive, use the corresponding device name, such as `/dev/hda`,
    described previously. If you have a SCSI CD-ROM drive, the device name will be
    `/dev/scd0` or similar. Your system may also have a symbolic link `/dev/cdrom`
    that points to the appropriate device. Consult your `/etc/fstab` file to determine
    what device corresponds to your computer''s CD-ROM drive.


    Simply copy that device to a file. The resulting file will be a complete disk
    image of the file system on the CD-ROM in the drive—for example:


    ```

    % cp /dev/cdrom /tmp/cdrom-image

    ```


    This may take several minutes, depending on the CD-ROM you''re copying and the
    speed of your drive. The resulting image file will be quite large—as large as
    the contents of the CD-ROM.


    Now you can mount this CD-ROM image without having the original CD-ROM in the
    drive. For example, to mount it on `/mnt/cdrom`, use this line:


    ```

    % mount -o loop=/dev/loop0 /tmp/cdrom-image /mnt/cdrom

    ```


    Because the image is on a hard disk drive, it''ll perform much faster than the
    actual CD-ROM disk. Note that most CD-ROMs use the file system type `iso9660`.


    # ## 6.6 PTYs


    If you run the `mount` command with no command-line arguments, which displays
    the file systems mounted on your system, you''ll notice a line that looks something
    like this:


    ```

    none on /dev/pts type devpts (rw,gid=5,mode=620)

    ```


    This indicates that a special type of file system, `devpts`, is mounted at `/dev/pts`.
    This file system, which isn''t associated with any hardware device, is a "magic"
    file system that is created by the Linux kernel. It''s similar to the `/proc`
    file system; see Chapter 7 for more information about how this works.'
  merge: -1
