  md: '# # Introduction


    GNU/Linux has taken the world of computers by storm. At one time, personal computer
    users were forced to choose among proprietary operating environments and applications.
    Users had no way of fixing or improving these programs, could not look “under
    the hood,” and were often forced to accept restrictive licenses. GNU/Linux and
    other open source systems have changed that—now PC users, administrators, and
    developers can choose a free operating environment complete with tools, applications,
    and full source code.


    A great deal of the success of GNU/Linux is owed to its open source nature. Because
    the source code for programs is publicly available, everyone can take part in
    development, whether by fixing a small bug or by developing and distributing a
    complete major application. This opportunity has enticed thousands of capable
    developers worldwide to contribute new components and improvements to GNU/Linux,
    to the point that modern GNU/Linux systems rival the features of any proprietary
    system, and distributions include thousands of programs and applications spanning
    many CD-ROMs or DVDs.


    The success of GNU/Linux has also validated much of the UNIX philosophy. Many
    of the application programming interfaces (APIs) introduced in AT&T and BSD UNIX
    variants survive in Linux and form the foundation on which programs are built.
    The UNIX philosophy of many small command line–oriented programs working together
    is the organizational principle that makes GNU/Linux so powerful. Even when these
    programs are wrapped in easy-to-use graphical user interfaces, the underlying
    commands are still available for power users and automated scripts.


    A powerful GNU/Linux application harnesses the power of these APIs and commands
    in its inner workings. GNU/Linux’s APIs provide access to sophisticated features
    such as interprocess communication, multithreading, and high-performance networking.
    And many problems can be solved simply by assembling existing commands and programs
    using simple scripts.


    # # GNU and Linux


    Where did the name GNU/Liux come from? You’ve certainly heard of Linux before,
    and you may have heard of the GNU Project. You may not have heard the name GNU/Linux,
    although you’re probably familiar with the system it refers to.


    Linux is named after Linus Torvalds, the creator and original author of the *kernel*
    that runs a GNU/Linux system. The kernel is the program that performs the most
    basic functions of an operating system: It controls and interfaces with the computer’s
    hardware, handles allocation of memory and other resources, allows multiple programs
    to run at the same time, manages the file system, and so on.'
  merge: -1
  pgno: 19
- img_proc: false
  md: 'The kernel by itself doesn''t provide features that are useful to users. It
    can''t even provide a simple prompt for users to enter basic commands. It provides
    no way for users to manage or edit files, communicate with other computers, or
    write other programs. These tasks require the use of a wide array of other programs,
    including command shells, file utilities, editors, and compilers. Many of these
    programs, in turn, use libraries of general-purpose functions, such as the library
    containing standard C library functions, which are not included in the kernel.


    On GNU/Linux systems, many of these other programs and libraries are software
    developed as part of the GNU Project.[^1] A great deal of this software predates
    the Linux kernel. The aim of the GNU Project is "to develop a complete UNIX-like
    operating system which is free software" (from the GNU Project Web site, http://www.gnu.org).


    The Linux kernel and software from the GNU Project has proven to be a powerful
    combination. Although the combination is often called "Linux" for short, the complete
    system couldn''t work without GNU software, any more than it could operate without
    the kernel. For this reason, throughout this book we''ll refer to the complete
    system as GNU/Linux, except when we are specifically talking about the Linux kernel.


    # The GNU General Public License


    The source code contained in this book is covered by the GNU *General Public License*
    (*GPL*), which is listed in Appendix F, "GNU General Public License." A great
    deal of free software, especially GNU/Linux software, is licensed under it. For
    instance, the Linux kernel itself is licensed under the GPL, as are many other
    GNU programs and libraries you''ll find in GNU/Linux distributions. If you use
    the source code in this book, be sure to read and understand the terms of the
    GPL.


    The GNU Project Web site includes an extensive discussion of the GPL (`http://www.gnu.org/copyleft/`)
    and other free software licenses. You can find information about open source software
    licenses at http://www.opensource.org/licenses/index.html.


    # Who Should Read This Book?


    This book is intended for three types of readers:


    +   - You might be a developer already experienced with programming for the GNU/Linux
    system, and you want to learn about some of its advanced features and capabilities.
    You might be interested in writing more sophisticated programs with features such
    as multiprocessing, multithreading, interprocess communication, and interaction
    with hardware devices. You might want to improve your programs by making them
    run faster, more reliably, and more securely, or by designing them to interact
    better with the rest of the GNU/Linux system.


    [^1]: GNU is a recursive acronym: It stands for "GNU''s Not UNIX."'
  merge: -1
  pgno: 20
- img_proc: false
  md: '+   - You might be a developer experienced with another UNIX-like system who''s
    interested in developing GNU/Linux software, too. You might already be familiar
    with standard APIs such as those in the POSIX specification. To develop GNU/Linux
    software, you need to know the peculiarities of the system, its limitations, additional
    capabilities, and conventions.

    - You might be a developer making the transition from a non-UNIX environment,
    such as Microsoft''s Win32 platform. You might already be familiar with the general
    principles of writing good software, but you need to know the specific techniques
    that GNU/Linux programs use to interact with the system and with each other. And
    you want to make sure your programs fit naturally into the GNU/Linux system and
    behave as users expect them to.


    This book is not intended to be a comprehensive guide or reference to all aspects
    of GNU/Linux programming. Instead, we''ll take a tutorial approach, introducing
    the most important concepts and techniques, and giving examples of how to use
