  md: "Note that `stdout` is buffered. Data written to `stdout` is not sent to the\
    \ console (or other device, if it's redirected) until the buffer fills, the program\
    \ exits normally, or `stdout` is closed. You can explicitly flush the buffer by\
    \ calling the following:\n\n```\nfflush (stdout);\n```\n\nIn contrast, `stderr`\
    \ is not buffered; data written to `stderr` goes directly to the console.<sup>1</sup>\n\
    \nThis can produce some surprising results. For example, this loop does not print\
    \ one period every second; instead, the periods are buffered, and a bunch of them\
    \ are printed together when the buffer fills.\n\n```\nwhile (1) {\n    printf\
    \ (\".\");\n    sleep (1);\n}\n```\n\nIn this loop, however, the periods do appear\
    \ once a second:\n\n```\nwhile (1) {\n    fprintf (stderr, \".\");\n    sleep\
    \ (1);\n}\n```\n\n# 2.1.5 Program Exit Codes\n\nWhen a program ends, it indicates\
    \ its status with an exit code. The exit code is a small integer; by convention,\
    \ an exit code of zero denotes successful execution, while nonzero exit codes\
    \ indicate that an error occurred. Some programs use different nonzero exit code\
    \ values to distinguish specific errors.\n\nWith most shells, it's possible to\
    \ obtain the exit code of the most recently executed program using the special\
    \ `$?` variable. Here's an example in which the `ls` command is invoked twice\
    \ and its exit code is printed after each invocation. In the first case, `ls`\
    \ executes correctly and returns the exit code zero. In the second case, `ls`\
    \ encounters an error (because the filename specified on the command line does\
    \ not exist) and thus returns a nonzero exit code.\n\n```\n% ls /\nbin    coda\
    \    etc     lib        misc  nfs  proc  sbin  usr\nboot   dev     home    lost+found\
    \ mnt   opt  root  tmp   var\n% echo $?\n0\n% ls bogusfile\nls: bogusfile: No\
    \ such file or directory\n% echo $?\n1\n```\n\n1. In C++, the same distinction\
    \ holds for `cout` and `cerr`, respectively. Note that the `endl` token flushes\
    \ a stream in addition to printing a newline character; if you don't want to flush\
    \ the stream (for performance reasons, for example), use a newline constant, '\\\
    n', instead."
