  md: "Like the /dev directory, /dev/pts contains entries corresponding to devices.\
    \ But unlike /dev, which is an ordinary directory, /dev/pts is a special directory\
    \ that is created dynamically by the Linux kernel.The contents of the directory\
    \ vary with time and reflect the state of the running system.\n\nThe entries in\
    \ /dev/pts correspond to *pseudo-terminals* (or *pseudo-TTYs*, or *PTYs*). Linux\
    \ creates a PTY for every new terminal window you open and displays a corresponding\
    \ entry in /dev/pts.The PTY device acts like a terminal device—it accepts input\
    \ from the keyboard and displays text output from the programs that run in it.\
    \ PTYs are numbered, and the PTY number is the name of the corresponding entry\
    \ in /dev/pts.\n\nYou can display the terminal device associated with a process\
    \ using the ps command. Specify tty as one of the fields of a custom format with\
    \ the -o option. To display the process ID,TTY, and command line of each process\
    \ sharing the same terminal, invoke *ps -o pid,tty,cmd*.\n\n# 6.6.1  A PTY Demonstration\n\
    \nFor example, you can determine the PTY associated with a given terminal window\
    \ by invoking in the window this command:\n\n```\nps -o pid,tty,cmd\n   PID TT\
    \        CMD\n28832 pts/4     bash\n29287 pts/4     ps -o pid,tty,cmd\n```\n\n\
    This particular terminal window is running in PTY 4. The PTY has a corresponding\
    \ entry in /dev/pts:\n\n```\nls -l /dev/pts/4\ncrw--w---- 1 samuel tty 136, 4\
    \ Mar 8 02:56 /dev/pts/4\n```\n\nNote that it is a character device, and its owner\
    \ is the owner of the process for which it was created.\n\nYou can read from or\
    \ write to the PTY device. If you read from it, you’ll hijack keyboard input that\
    \ would otherwise be sent to the program running in the PTY. If you write to it,\
    \ the data will appear in that window.\n\nTry opening a new terminal window, and\
    \ determine its PTY number by invoking *ps -o pid,tty,cmd*. From another window,\
    \ write some text to the PTY device. For example, if the new terminal window’s\
    \ PTY number is 7, invoke this command from another window:\n\n```\necho 'Hello,\
    \ other window!' > /dev/pts/7\n```\n\nThe output appears in the new terminal window.\
    \ If you close the new terminal window, the entry 7 in /dev/pts disappears."
