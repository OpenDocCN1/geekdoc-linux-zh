    # 6 Devices


    LINUX, LIKE MOST OPERATING SYSTEMS, INTERACTS WITH HARDWARE devices via modularized
    software components called *device drivers*. A device driver hides the peculiarities
    of a hardware device’s communication protocols from the operating system and allows
    the system to interact with the device through a standardized interface.


    Under Linux, device drivers are part of the kernel and may be either linked statically
    into the kernel or loaded on demand as kernel modules. Device drivers run as part
    of the kernel and aren’t directly accessible to user processes. However, Linux
    provides a mechanism by which processes can communicate with a device driver—and
    through it with a hardware device—via *file-like objects*. These objects appear
    in the file system, and programs can open them, read from them, and write to them
    practically as if they were normal files. Using either Linux’s low-level I/O operations
    (see Appendix B, “Low-Level I/O”) or the standard C library’s I/O operations,
    your programs can communicate with hardware devices through these file-like objects.


    Linux also provides several file-like objects that communicate directly with the
    kernel rather than with device drivers. These aren’t linked to hardware devices;
    instead, they provide various kinds of specialized behavior that can be of use
    to application and system programs.'
  merge: -1
  pgno: 152
- img_proc: false
  md: '> **Exercise Caution When Accessing Devices!**

    The techniques in this chapter provide direct access to device drivers running
    in the Linux kernel, and through them to hardware devices connected to the system.
    Use these techniques with care because misuse can cause impaire or damage the
    GNU/Linux system.


    See especially the sidebar "Dangers of Block Devices."


    # 6.1 Device Types


    Device files aren''t ordinary files—they do not represent regions of data on a
    disk-based file system. Instead, data read from or written to a device file is
    communicated to the corresponding device driver, and from there to the underlying
    device. Device files come in two flavors:


    +   - A *character device* represents a hardware device that reads or writes a
    serial stream of data bytes. Serial and parallel ports, tape drives, terminal
    devices, and sound cards are examples of character devices.

    - A *block device* represents a hardware device that reads or writes data in fixed-size
    blocks. Unlike a character device, a block device provides random access to data
    stored on the device. A disk drive is an example of a block device.


    Typical application programs will never use block devices. While a disk drive
    is represented as block devices, the contents of each disk partition typically
    contain a file system, and that file system is mounted into GNU/Linux''s root
    file system tree. Only the kernel code that implements the file system needs to
    access the block device directly; application programs access the disk''s contents
    through normal files and directories.


    > **Dangers of Block Devices**

    Block devices provide direct access to disk drive data. Although most GNU/Linux
    systems are configured to prevent nonroot processes from accessing these devices
    directly, a root process can inflict severe damage by changing the contents of
    the disk. By writing to a disk block device, a program can modify or destroy file
    system control information and even a disk''s partition table and master boot
    record, thus rendering a drive or even the entire system unusable. Always access
    these devices with great care.


    Applications sometimes make use of character devices, though. We''ll discuss several
    of them in the following sections.


    # 6.2 Device Numbers


    Linux identifies devices using two numbers: the *major device number* and the
    *minor device number*. The major device number specifies which driver the device
    corresponds to. The correspondence from major device numbers to drivers is fixed
    and part of the Linux kernel sources. Note that the same major device number may
    correspond to'
