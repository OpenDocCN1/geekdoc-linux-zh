    \nint main ()\n{\n    FILE* stream = popen (\"sort\", \"w\");\n    fprintf (stream,\
    \ \"This is a test.\\n\");\n    fprintf (stream, \"Hello, world.\\n\");\n    fprintf\
    \ (stream, \"My dog has fleas.\\n\");\n    fprintf (stream, \"This program is\
