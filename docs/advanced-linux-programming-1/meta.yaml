  md: "# B.1.3 Writing Data\n\nWrite data to a file descriptor using the write call.\
    \ Provide the file descriptor, a pointer to a buffer of data, and the number of\
    \ bytes to write. The file descriptor must be open for writing. The data written\
    \ to the file need not be a character string; write copies arbitrary bytes from\
    \ the buffer to the file descriptor.\n\nThe program in Listing B.2 appends the\
    \ current time to the file specified on the command line. If the file doesn't\
    \ exist, it is created. This program also uses the time, localtime, and asctime\
    \ functions to obtain and format the current time; see their respective man pages\
    \ for more information.\n\n# Listing B.2 (timestamp.c) Append a Timestamp to a\
    \ File\n\n```\n#include <fcntl.h>\n#include <stdio.h>\n#include <string.h>\n#include\
    \ <sys/stat.h>\n#include <sys/types.h>\n#include <time.h>\n#include <unistd.h>\n\
    \n/* Return a character string representing the current date and time. */\n\n\
    char* get_timestamp ()\n{\n    time_t now = time (NULL);\n    return asctime (localtime\
    \ (&now));\n}\n\nint main (int argc, char* argv[])\n{\n    /* The file to which\
    \ to append the timestamp. */\n    char* filename = argv[1];\n    /* Get the current\
    \ timestamp. */\n    char* timestamp = get_timestamp ();\n    /* Open the file\
    \ for writing. If it exists, append to it;\n    otherwise, create a new file.\
    \ */\n    int fd = open (filename, O_WRONLY | O_CREAT | O_APPEND, 0666);\n   \
    \ /* Compute the length of the timestamp string. */\n    size_t length = strlen\
    \ (timestamp);\n    /* Write the timestamp to the file. */\n    write (fd, timestamp,\
    \ length);\n    /* All done. */\n    close (fd);\n    return 0;\n}\n```"
