  md: "The first step is to run your program inside the debugger. Just enter the command\
    \ run and any program arguments. Try running the program without any arguments,\
    \ like this:\n\n```\n(gdb) run\nStarting program: reciprocal\n\nProgram received\
    \ signal SIGSEGV, Segmentation fault.\n__strtol_internal (nptr=0x0, endptr=0x0,\
    \ base=10, group=0)\nat strtol.c:287\n287     strtol.c: No such file or directory.\n\
    (gdb)\n```\n\nThe problem is that there is no error-checking code in `main`. The\
    \ program expects one argument, but in this case the program was run with no arguments.\
    \ The SIGSEGV message indicates a program crash. GDB knows that the actual crash\
    \ happened in a function called `__strtol_internal`. That function is in the standard\
    \ library, and the source isn't installed, which explains the \"No such file or\
    \ directory\" message. You can see the stack by using the where command:\n\n```\n\
    (gdb) where\n#0  __strtol_internal (nptr=0x0, endptr=0x0, base=10, group=0)\n\
    \    at strtol.c:287\n#1  0x40096fb6 in atoi (nptr=0x0) at ../stdlib/stdlib.h:251\n\
    #2  0x804863e in main (argc=1, argv=0xbffff5e4) at main.c:8\n```\n\nYou can see\
    \ from this display that `main` called the `atoi` function with a NULL pointer,\
    \ which is the source of the trouble.\n\nYou can go up two levels in the stack\
    \ until you reach `main` by using the up command:\n\n```\n(gdb) up 2\n#2  0x804863e\
    \ in main (argc=1, argv=0xbffff5e4) at main.c:8\n8       i = atoi (argv[1]);\n\
    ```\n\nNote that gdb is capable of finding the source for `main.c`, and it shows\
    \ the line where the erroneous function call occurred. You can view the value\
    \ of variables using the print command:\n\n```\n(gdb) print argv[1]\n$2 = 0x0\n\
    ```\n\nThat confirms that the problem is indeed a NULL pointer passed into `atoi`.\n\
    \nYou can set a breakpoint by using the break command:\n\n```\n(gdb) break main\n\
    Breakpoint 1 at 0x804862e: file main.c, line 8.\n```"
