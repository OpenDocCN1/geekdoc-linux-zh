    # ### 5.3.3 Shared Access to a File


    Different processes can communicate using memory-mapped regions associated with
    the same file. Specify the `MAP_SHARED` flag so that any writes to these regions
    are immediately transferred to the underlying file and made visible to other processes.
    If you don''t specify this flag, Linux may buffer writes before transferring them
    to the file.


    Alternatively, you can force Linux to incorporate buffered writes into the disk
    file by calling `msync`. Its first two parameters specify a memory-mapped region,
    as for `munmap`. The third parameter can take these flag values:


    +   - `MS_ASYNC`—The update is scheduled but not necessarily run before the call
    returns.

    - `MS_SYNC`—The update is immediate; the call to `msync` blocks until it''s done.
    `MS_SYNC` and `MS_ASYNC` may not both be used.'
