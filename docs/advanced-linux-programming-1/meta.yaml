    # 5.5.6 Internet-Domain Sockets


    UNIX-domain sockets can be used only for communication between two processes on
    the same computer. *Internet-domain sockets*, on the other hand, may be used to
    connect processes on different machines connected by a network.


    Sockets connecting processes through the Internet use the Internet namespace represented
    by PF_INET. The most common protocols are TCP/IP. The *Internet Protocol (IP)*,
    a low-level protocol, moves packets through the Internet, splitting and rejoining
    the packets, if necessary. It guarantees only "best-effort" delivery, so packets
    may vanish or be reordered during transport. Every participating computer is specified
    using a unique IP number. The *Transmission Control Protocol (TCP)*, layered on
    top of IP, provides reliable connection-ordered transport. It permits telephone-like
    connections to be established between computers and ensures that data is delivered
    reliably and in order.


    > **DNS Names**


    Because it is easier to remember names than numbers, the *Domain Name Service
    (DNS)* associates names such as www.codesourcery.com with computers'' unique IP
    numbers. DNS is implemented by a worldwide hierarchy of name servers, but you
    don''t need to understand DNS protocols to use Internet host names in your programs.


    Internet socket addresses contain two parts: a machine and a port number. This
    information is stored in a struct `sockaddr_in` variable. Set the `sin_family`
    field to AF_INET to indicate that this is an Internet namespace address. The `sin_addr`
    field stores the Internet address of the desired machine as a 32-bit integer IP
    number. A *port number* distinguishes a given machine''s different sockets. Because
    different machines store multibyte values in different byte orders, use htons
    to convert the port number to *network byte order*. See the man page for ip for
    more information.


    To convert human-readable hostnames, either numbers in standard dot notation (such
    as 10.0.0.1) or DNS names (such as www.codesourcery.com) into 32-bit IP numbers,
    you can use gethostbyname. This returns a pointer to the struct `hostent` structure;
    the `h_addr` field contains the host''s IP number. See the sample program in Listing
    5.12.


    Listing 5.12 illustrates the use of Internet-domain sockets. The program obtains
    the home page from the Web server whose hostname is specified on the command line.'
