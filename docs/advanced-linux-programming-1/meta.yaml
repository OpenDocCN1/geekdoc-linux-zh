- img_proc: false
  md: "# 148  Chapter 7  The /proc File System\n\nWhat's in this file? The contents\
    \ of /proc/version consist of a string describing the Linux kernel version number.\
    \ It contains the version information that would be obtained by the uname system\
    \ call, described in Chapter 8, \"Linux System Calls,\" in Section 8.15, \"uname,\"\
    \ plus additional information such as the version of the compiler that was used\
    \ to compile the kernel. You can read from /proc/version like you would any other\
    \ file. For instance, an easy way to display its contents is with the cat command.\n\
    \n```\n% cat /proc/version\nLinux version 2.2.14-5.0 (root@porky.devel.redhat.com)\
    \ (gcc version egcs-2.91.\n66 19990314/Linux (egcs-1.1.2 release)) #1 Tue Mar\
    \ 7 21:07:39 EST 2000\n```\n\nThe various entries in the /proc file system are\
    \ described extensively in the proc man page (Section 5). To view it, invoke this\
    \ command:\n\n```\n% man 5 proc\n```\n\nIn this chapter, we'll describe some of\
    \ the features of the /proc file system that are most likely to be useful to application\
    \ programmers, and we'll give examples of using them. Some of the features of\
    \ /proc are handy for debugging, too. If you're interested in exactly how /proc\
    \ works, take a look at the source code in the Linux kernel sources, under /usr/src/linux/fs/proc/.\n\
    \n# 7.1  Extracting Information from /proc\n\nMost of the entries in /proc provide\
    \ information formatted to be readable by humans, but the formats are simple enough\
    \ to be easily parsed. For example, /proc/cpuinfo contains information about the\
    \ system CPU (or CPUs, for a multiprocessor machine). The output is a table of\
    \ values, one per line, with a description of the value and a colon preceding\
    \ each value. For example, the output might look like this:\n\n```\n% cat /proc/cpuinfo\n\
    processor       : 0\nvendor_id       : GenuineIntel\ncpu family      : 6\nmodel\
    \           : 5\nmodel name      : Pentium II (Deschutes)\nstepping        : 2\n\
    cpu MHz         : 400.913520\ncache size      : 512 KB\nfdiv_bug        : no\n\
    hlt_bug         : no\nsep_bug         : no\nf00f_bug        : no\ncoma_bug   \
    \     : no\nfpu             : yes\nfpu_exception   : yes\ncpuid level     : 2\n\
    wp              : yes\nflags           : fpu vme de pse tsc msr pae mce cx8 apic\
    \ sep\n                  mtrr pge mca cmov pat pse36 mmx fxsr\nbogomips      \
    \  : 399.77\n```"
