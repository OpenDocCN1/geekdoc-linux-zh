    }\n```\n\n# 5.2.3 Wait and Post Operations\n\nEach semaphore has a non-negative\
    \ value and supports wait and post operations. The `semop` system call implements\
    \ both operations. Its first parameter specifies a semaphore set identifier. Its\
    \ second parameter is an array of `struct sembuf` elements, which specify the\
    \ operations you want to perform. The third parameter is the length of this array.\n\
    The fields of `struct sembuf` are listed here:\n\n+   - `sem_num` is the semaphore\
    \ number in the semaphore set on which the operation is performed.\n- `sem_op`\
    \ is an integer that specifies the semaphore operation.\n  If `sem_op` is a positive\
    \ number, that number is added to the semaphore value immediately.\n  If `sem_op`\
    \ is a negative number, the absolute value of that number is subtracted from the\
    \ semaphore value. If this would make the semaphore value negative, the call blocks\
    \ until the semaphore value becomes as large as the absolute value of `sem_op`\
    \ (because some other process increments it).\n  If `sem_op` is zero, the operation\
    \ blocks until the semaphore value becomes zero.\n- `sem_flg` is a flag value.\
    \ Specify `IPC_NOWAIT` to prevent the operation from blocking; if the operation\
    \ would have blocked, the call to `semop` fails instead.\n  If you specify `SEM_UNDO`,\
    \ Linux automatically undoes the operation on the semaphore when the process exits."
