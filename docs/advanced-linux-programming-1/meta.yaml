  md: 'In this section, we describe how to use gprof. Rewriting code to run more quickly
    requires creativity and careful choice of algorithms.

    Obtaining profiling information requires three steps:


    +   1. Compile and link your program to enable profiling.

    2. Execute your program to generate profiling data.

    3. Use gprof to analyze and display the profiling data.


    Before we illustrate these steps, we introduce a large enough program to make
    profiling interesting.


    # A.3.1 A Simple Calculator


    To illustrate profiling, we''ll use a simple calculator program. To ensure that
    the calculator takes a nontrivial amount of time, we''ll use unary numbers for
    calculations, something we would definitely not want to do in a real-world program.
    Code for this program appears at the end of this chapter.


    A *unary number* is represented by as many symbols as its value. For example,
    the number 1 is represented by "x," 2 by "xx," and 3 by "xxx." Instead of using
    x''s, our program represents a non-negative number using a linked list with as
    many elements as the number''s value. The number.c file contains routines to create
    the number 0, add 1 to a number, subtract 1 from a number, and add, subtract,
    and multiply numbers. Another function converts a string holding a non-negative
    decimal number to a unary number, and a function converts from a unary number
    to an int. Addition is implemented using repeated addition of 1s, while subtraction
    uses repeated removal of 1s. Multiplication is defined using repeated addition.
    The unary predicates even and odd each return the unary number for 1 if and only
    if its one operand is even or odd, respectively; otherwise they return the unary
    number for 0. The two predicates are mutually recursive. For example, a number
    is even if it is zero, or if one less than the number is odd.


    The calculator accepts one-line postfix expressions¹ and prints each expression''s
    value—for example:


    ```

    % ./calculator

    Please enter a postfix expression:

    2 3 +

    5

    Please enter a postfix expression:

    2 3 + 4 -

    1

    ```


    > 1. In *postfix* notation, a binary operator is placed after its operands instead
    of between them. So, for example, to multiply 6 and 8, you would use 6 8 ×. To
    multiply 6 and 8 and then add 5 to the result, you would use 6 8 × 5 +.'
