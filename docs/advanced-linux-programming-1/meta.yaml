  md: '# 3.4 Process Termination


    Normally, a process terminates in one of two ways. Either the executing program
    calls the exit function, or the program''s main function returns. Each process
    has an exit code: a number that the process returns to its parent. The exit code
    is the argument passed to the exit function, or the value returned from main.


    A process may also terminate abnormally, in response to a signal. For instance,
    the `SIGBUS`, `SIGSEGV`, and `SIGFPE` signals mentioned previously cause the process
    to terminate. Other signals are used to terminate a process explicitly. The `SIGINT`
    signal is sent to a process when the user attempts to end it by typing Ctrl+C
    in its terminal. The `SIGTERM` signal is sent by the `kill` command. The default
    disposition for both of these is to terminate the process. By calling the `abort`
    function, a process sends itself the `SIGABRT` signal, which terminates the process
    and produces a core file. The most powerful termination signal is `SIGKILL`, which
    ends a process immediately and cannot be blocked or handled by a program.


    Any of these signals can be sent using the `kill` command by specifying an extra
    command-line flag; for instance, to end a troublesome process by sending it a
    `SIGKILL`, invoke the following, where `pid` is its process ID:


    ```

    % kill -KILL pid

    ```


    To send a signal from a program, use the `kill` function. The first parameter
    is the target process ID. The second parameter is the signal number; use `SIGTERM`
    to simulate the default behavior of the `kill` command. For instance, where `child_pid`
    contains the process ID of the child process, you can use the `kill` function
    to terminate a child process from the parent by calling it like this:


    ```

    kill (child_pid, SIGTERM);

    ```


    Include the `<sys/types.h>` and `<signal.h>` headers if you use the `kill` function.


    By convention, the exit code is used to indicate whether the program executed
    correctly. An exit code of zero indicates correct execution, while a nonzero exit
    code indicates that an error occurred. In the latter case, the particular value
    returned may give some indication of the nature of the error. It''s a good idea
    to stick with this convention in your programs because other components of the
    GNU/Linux system assume this behavior. For instance, shells assume this convention
    when you connect multiple programs with the `&&` (logical and) and `||` (logical
    or) operators. Therefore, you should explicitly return zero from your main function,
    unless an error occurs.'
  merge: -1
