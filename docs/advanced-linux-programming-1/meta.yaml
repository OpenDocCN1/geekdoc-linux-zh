  md: "# 212 Chapter 10 Security\n\nThe buggy versions of `finger`, `talk`, and `sendmail`\
    \ all shared a common flaw. Each used a fixed-length string buffer, which implied\
    \ a constant upper limit on the size of the string but then allowed network clients\
    \ to provide strings that overflowed the buffer. For example, they contained code\
    \ similar to this:\n\n```\n#include <stdio.h>\n\nint main ()\n{\n  /* Nobody in\
    \ their right mind would have more than 32 characters in\n     their username.\
    \  Plus, I think UNIX allows only 8-character\n     usernames.  So, this should\
    \ be plenty of space.  */\n  char username[32];\n  /* Prompt the user for the\
    \ username.  */\n  printf (\"Enter your username: \");\n  /* Read a line of input.\
    \  */\n  gets (username);\n  /* Do other things here...  */\n\n  return 0;\n}\n\
    ```\n\nThe combination of the 32-character buffer with the `gets` function permits\
    \ a buffer overrun. The `gets` function reads user input up until the next newline\
    \ character and stores the entire result in the username buffer. The comments\
    \ in the code are correct in that people generally have short usernames, so no\
    \ well-meaning user is likely to type in more than 32 characters. But when you're\
    \ writing secure software, you must consider what a malicious attacker might do.\
    \ In this case, the attacker might deliberately type in a very long username.\
    \ Local variables such as username are stored on the stack, so by exceeding the\
    \ array bounds, it's possible to put arbitrary bytes onto the stack beyond the\
    \ area reserved for the `username` variable. The username will overrun the buffer\
    \ and overwrite parts of the surrounding stack, allowing the kind of attack described\
    \ previously.\n\nFortunately, it's relatively easy to prevent buffer overruns.\
    \ When reading strings, you should always use a function, such as `getline`, that\
    \ either dynamically allocates a sufficiently large buffer or stops reading input\
    \ if the buffer is full. For example, you could use this:\n\n```\nchar* username\
    \ = getline (NULL, 0, stdin);\n```\n\nThis call automatically uses `malloc` to\
    \ allocate a buffer big enough to hold the line and returns it to you. You have\
    \ to remember to call `free` to deallocate the buffer, of course, to avoid leaking\
    \ memory.\n\nYour life will be even easier if you use C++ or another language\
    \ that provides simple primitives for reading input. In C++, for example, you\
    \ can simply use this:\n\n```\nstring username;\ngetline (cin, username);\n```"
