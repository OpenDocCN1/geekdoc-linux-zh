    \  (detached.c) Skeleton Program That Creates a Detached Thread\n\n#include <pthread.h>\n\
    \nvoid* thread_function (void* thread_arg)\n{\n    /* Do work here...  */\n}\n\
    \nint main ()\n{\n    pthread_attr_t attr;\n    pthread_t thread;\n\n    pthread_attr_init\
    \ (&attr);\n    pthread_attr_setdetachstate (&attr, PTHREAD_CREATE_DETACHED);\n\
    \    pthread_create (&thread, &attr, &thread_function, NULL);\n    pthread_attr_destroy\
    \ (&attr);\n\n    /* Do work here...  */\n\n    /* No need to join the second\
    \ thread.  */\n    return 0;\n}\n```\n\nEven if a thread is created in a joinable\
    \ state, it may later be turned into a detached thread. To do this, call `pthread_detach`.\
    \ Once a thread is detached, it cannot be made joinable again.\n\n# 4.2  Thread\
    \ Cancellation\n\nUnder normal circumstances, a thread terminates when it exits\
    \ normally, either by returning from its thread function or by calling `pthread_exit`.\
    \ However, it is possible for a thread to request that another thread terminate.\
    \ This is called *canceling* a thread.\nTo cancel a thread, call `pthread_cancel`,\
    \ passing the thread ID of the thread to be canceled. A canceled thread may later\
    \ be joined; in fact, you should join a canceled thread to free up its resources,\
    \ unless the thread is detached (see Section 4.1.5, \"Thread Attributes\"). The\
    \ return value of a canceled thread is the special value given by `PTHREAD_CANCELED`."
