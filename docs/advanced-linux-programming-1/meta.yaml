  md: '- We make no attempt to regulate the resources (number of processes, memory
    use, and so on) consumed by the server or its modules. Many multiprocess Web server
    implementations service connections using a fixed pool of processes rather than
    creating a new child process for each connection.

    - The server loads the shared library for a server module each time it is requested
    and then immediately unloads it when the request has been completed. A more efficient
    implementation would probably cache loaded modules.


    The *Hypertext Transport Protocol (HTTP)* is used for communication between Web
    clients and servers. The client connects to the server by establishing a connection
    to a well-known port (usually port 80 for Internet Web servers, but any port may
    be used). HTTP requests and headers are composed of plain text.


    Once connected, the client sends a request to the server. A typical request is
    `GET /page HTTP/1.0`. The GET method indicates that the client is requesting that
    the server send it a Web page. The second element is the path to that page on
    the server. The third element is the protocol and version. Subsequent lines contain
    header fields, formatted similarly to email headers, which contain extra information
    about the client. The header ends with a blank line.


    The server sends back a response indicating the result of processing the request.
    A typical response is `HTTP/1.0 200 OK`. The first element is the protocol version.
    The next two elements indicate the result; in this case, result 200 indicates
    that the request was processed successfully. Subsequent lines contain header fields,
    formatted similarly to email headers. The header ends with a blank line. The server
    may then send arbitrary data to satisfy the request.


    Typically, the server responds to a page request by sending back HTML source for
    the Web page. In this case, the response headers will include `Content-type: text/html`,
    indicating that the result is HTML source. The HTML source follows immediately
    after the header.


    See the HTTP specification at http://www.w3.org/Protocols/ for more information.


    # 11.2 Implementation


    All but the very smallest programs written in C require careful organization to
    preserve the modularity and maintainability of the source code. This program is
    divided into four main source files.


    Each source file exports functions or variables that may be accessed by the other
    parts of the program. For simplicity, all exported functions and variables are
    declared in a single header file, `server.h` (see Listing 11.1), which is included
    by the other files. Functions that are intended for use within a single compilation
    unit only are declared `static` and are not declared in `server.h`.'
