  md: "# Using *mkstemp*\n\nThe `mkstemp` function creates a unique temporary filename\
    \ from a filename template, creates the file with permissions so that only the\
    \ current user can access it, and opens the file for read/write. The filename\
    \ template is a character string ending with \"XXXXXX\" (six capital X's); `mkstemp`\
    \ replaces the X's with characters so that the filename is unique. The return\
    \ value is a file descriptor; use the `write` family of functions to write to\
    \ the temporary file.\n\nTemporary files created with `mkstemp` are not deleted\
    \ automatically. It's up to you to remove the temporary file when it's no longer\
    \ needed. (Programmers should be very careful to clean up temporary files; otherwise,\
    \ the `/tmp` file system will fill up eventually, rendering the system inoperable.)\
    \ If the temporary file is for internal use only and won't be handed to another\
    \ program, it's a good idea to call `unlink` on the temporary file immediately.\
    \ The `unlink` function removes the directory entry corresponding to a file, but\
    \ because files in a file system are reference-counted, the file itself is not\
    \ removed until there are no open file descriptors for that file, either. This\
    \ way, your program may continue to use the temporary file, and the file goes\
    \ away automatically as soon as you close the file descriptor. Because Linux closes\
    \ file descriptors when a program ends, the temporary file will be removed even\
    \ if your program terminates abnormally.\n\nThe pair of functions in Listing 2.5\
    \ demonstrates `mkstemp`. Used together, these functions make it easy to write\
    \ a memory buffer to a temporary file (so that memory can be freed or reused)\
    \ and then read it back later.\n\nListing 2.5 *(temp\\_file.c)* Using *mkstemp*\n\
    \n```\n#include <stdlib.h>\n#include <unistd.h>\n\n/* A handle for a temporary\
    \ file created with write_temp_file. In\n   this implementation, it's just a file\
    \ descriptor.  */\ntypedef int temp_file_handle;\n\n/* Writes LENGTH bytes from\
    \ BUFFER into a temporary file. The\n   temporary file is immediately unlinked.\
    \ Returns a handle to the\n   temporary file.  */\n\ntemp_file_handle write_temp_file\
    \ (char* buffer, size_t length)\n{\n  /* Create the filename and file. The XXXXXX\
    \ will be replaced with\n     characters that make the filename unique.  */\n\
    \  char temp_filename[] = \"/tmp/temp_file.XXXXXX\";\n  int fd = mkstemp (temp_filename);\n\
    \  /* Unlink the file immediately, so that it will be removed when the\n     file\
    \ descriptor is closed.  */\n  unlink (temp_filename);\n  /* Write the number\
    \ of bytes to the file first.  */\n  write (fd, &length, sizeof (length));\n```"
