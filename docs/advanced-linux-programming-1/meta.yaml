  md: '```

    /* All done.  */

    closedir (dir);

    return 0;

    }

    ```


    Here are the first few lines of output from listing the `/dev` directory. (Your
    output might differ somewhat.)


    ```

    % ./listdir /dev

    directory         : /dev/.

    directory         : /dev/..

    socket            : /dev/log

    character device  : /dev/null

    regular file      : /dev/MAKEDEV

    fifo              : /dev/initctl

    character device  : /dev/agpgart

    ...

    ```


    To verify this, you can use the `ls` command on the same directory. Specify the
    `-U` flag to instruct `ls` not to sort the entries, and specify the `-a` flag
    to cause the current directory (.) and the parent directory (..) to be included.


    ```

    % ls -lUa /dev

    total 124

    drwxr-xr-x  7 root root     36864 Feb  1 15:14 .

    drwxr-xr-x 22 root root      4096 Oct 11 16:39 ..

    srw-rw-rw-  1 root root         0 Dec 18 01:31 log

    crw-rw-rw-  1 root root     1,   3 May  5  1998 null

    -rwxr-xr-x  1 root root     26689 Mar  2  2000 MAKEDEV

    prw-------  1 root root         0 Dec 11 18:37 initctl

    crw-rw-r--  1 root root    10, 175 Feb  3  2000 agpgart

    ...

    ```


    The first character of each line in the output of `ls` indicates the type of the
    entry.'
