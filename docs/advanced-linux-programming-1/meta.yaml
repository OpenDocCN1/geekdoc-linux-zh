    \n/* Create a stream corresponding to the client socket file\n   descriptor. */\n\
    fp = fdopen (fd, \"w\");\nassert (fp != NULL);\n/* Generate the HTML output. */\n\
    fprintf (fp, page_template, time_string);\n/* All done; flush the stream. */\n\
    fflush (fp);\n}\n```\n\nThis module uses standard C library I/O routines for convenience.\
    \ The `fdopen` call generates a stream pointer (`FILE*`) corresponding to the\
    \ client socket file descriptor (see Section B.4, \"Relation to Standard C Library\
    \ I/O Functions,\" in Appendix B, \"Low-Level I/O\"). The module writes to it\
    \ using `fprintf` and flushes it using `fflush` to prevent the loss of buffered\
