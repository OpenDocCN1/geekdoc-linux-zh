  md: "The lseek call enables you to reposition a file descriptor in a file. Pass\
    \ it the file descriptor and two additional arguments specifying the new position.\n\
    \n+   - If the third argument is SEEK_SET, lseek interprets the second argument\
    \ as a position, in bytes, from the start of the file.\n- If the third argument\
    \ is SEEK_CUR, lseek interprets the second argument as an offset, which may be\
    \ positive or negative, from the current position.\n- If the third argument is\
    \ SEEK_END, lseek interprets the second argument as an offset from the end of\
    \ the file. A positive value indicates a position beyond the end of the file.\n\
    \nThe call to lseek returns the new position, as an offset from the beginning\
    \ of the file. The type of the offset is off_t. If an error occurs, lseek returns\
    \ -1.You can’t use lseek with some types of file descriptors, such as socket file\
    \ descriptors.\n\nIf you want to find the position of a file descriptor in a file\
    \ without changing it, specify a 0 offset from the current position—for example:\n\
    \n```\noff_t position = lseek (file_descriptor, 0, SEEK_CUR);\n```\n\nLinux enables\
    \ you to use lseek to position a file descriptor beyond the end of the file. Normally,\
    \ if a file descriptor is positioned at the end of a file and you write to the\
    \ file descriptor, Linux automatically expands the file to make room for the new\
    \ data. If you position a file descriptor beyond the end of a file and then write\
    \ to it, Linux first expands the file to accommodate the “gap” that you created\
    \ with the lseek operation and then writes to the end of it.This gap, however,\
    \ does not actually occupy space on the disk; instead, Linux just makes a note\
    \ of how long it is. If you later try to read from the file, it appears to your\
    \ program that the gap is filled with 0 bytes.\n\nUsing this behavior of lseek,\
    \ it’s possible to create extremely large files that occupy almost no disk space.The\
    \ program lseek-huge in Listing B.5 does this. It takes as command-line arguments\
    \ a filename and a target file size, in megabytes.The program opens a new file,\
    \ advances past the end of the file using lseek, and then writes a single 0 byte\
    \ before closing the file.\n\nListing B.5 (lseek-huge.c) Create Large Files with\
    \ lseek\n\n```\n#include <fcntl.h>\n#include <stdlib.h>\n#include <sys/stat.h>\n\
    #include <sys/types.h>\n#include <unistd.h>\n\nint main (int argc, char* argv[])\n\
    {\n    int zero = 0;\n    const int megabyte = 1024 * 1024;\n\n    char* filename\
