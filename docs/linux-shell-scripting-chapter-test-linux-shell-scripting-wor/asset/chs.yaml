  ## 第 7 章测试

  问题：

  - `while` 循环语法如下：

  ```

  while condition

  _____

  code1

  _____

  ```

  - `_____` 接收用户输入。

  - `_____` 在指定条件为假时循环代码块，条件为真时退出循环。

  - `case` 语句语法如下：

  ```

  case value in

  pattern1) code1;;

  pattern2) code2;;

  *) ) code4;; # 无匹配时运行此项

  esac

  ```

  - `for` 循环语法如下：

  ```

  for var _____ item1 item2 item3…

  do

  code1

  code2

  done

  ```

  答案：

  - `do`

  - `read`

  - `until`

  - `pattern*`

  - `in`


  ## 第 8 章测试

  问题：

  - `_____` 语句允许用户选择一个项来满足条件并运行相关代码。

  - 使用 `>>` 将内容追加到文件末尾。

  - 使用 `<` 从文件获取输入。

  - Here Document（在此文档）的语法如下：

  ```

  command _____ delimiter

  document

  delimiter

  ```

  - 使用 `_____` 将外部脚本包含到当前文件中。

  答案：

  - `Select`

  - `>>`

  - `<`

  - `<<`

  - `source`


