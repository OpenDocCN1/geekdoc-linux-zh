  # 关于本书书

  本书包含了《8 小时精通 Shell 脚本》每一章节的测试，它可以帮助：

  - 通过大学期末考试

  - 通过工作面试

  - 通过认证考试



  ## 第 1 章测试

  问题：

  - `_____` 用于算术运算。

  - 在文本中，____` 检查文件是否存在。

  - `_____` 检查字符串是否为空。

  - `_____` 用于注释。

  - `_____` 用于多行注释。

  答案：

  - `[]`

  - `-e`

  - `-n`

  - `/*`

  - `#`


  ## 第 2 章测试

  问题：

  - `_____` 接收用户输入。

  - `_____` 在指定条件为假时循环代码块，条件为真时退出循环。

  - `_____` 输出结果。

  - `_____` 用于连接字符串。

  答案：

  - `while`

  - `read`

  - `echo`

  - `&&`


  ## 第 3 章测试

  问题：

  - `_____` 允许用户选择一个项来满足条件。

  - 语法为 `_____`：

  - `_____` 遍历数组元素。

  - `_____` 获取数组长度。

  - `_____` 输出到文件。

  答案：

  - `case`

  - `do`

  - `for`

  - `${#}`

  - `>`


