    ## Chapter 1 Test

    Questions:

    1. `_____` is the default Shell on most systems.

    2. `_____` executes the Shell file `myFile.sh`.

    3. `_____` symbol is used for the Shell comments.

    4. `_____` is used for multi-line comments.

    5. To use a variable, you need to use `____` before a variable.


    Answers:

    1. `Bash`

    2. `bash myFile.sh`

    3. `#`

    4. `:EOF`

    5. `$`


    ## Chapter 2 Test

    Questions:

    1. Any characters in the `_____` quotes will be printed in its original format.

    2. We can use `_____` quotes to connect two strings.

    3. We can get the length of the string using `____` symbol.

    4. `_____` is an expression, which is used for calculation.

    5. `_____` returns the file name


    Answers:

    1. `single`

    2. `double`

    3. `#`

    4. ``expr` ``

    5. `$0`


    ## Chapter 3 Test

    Questions:

    1. The syntax to create an array: `array_name = ______`

    2. The syntax to access the elements of an array is as follows: `${_____ }`

    3. `array_name[@]` or `_____` can get all elements of an array.

    4. `_____` or `#array_name[*]` can get the length of an array.

    5. `_____` is a command to format the output in the Shell.


    Answers:

    1. `(value0 value1 value2...)`

    2. `array_name[index]`

    3. `array_name[*]`

    4. `#array_name[@]`

    5. `printf`


    ## Chapter 4 Test

    Questions:

    1.

    ```

    if condition

    _____

    # if true run this code1

    else

    # if false run this code2

    fi

    ```

    2. The operator `____` is used to get the remainder.

    3. The operator `____` mean “less than”.

    4. The operator `-a` means `_____`.

    5. The operator `*` means `_____`.


    Answers:

    1. `then`

    2. `%`

    3. `-lt`

    4. `and`

    5. `multiply`


    ## Chapter 5 Test

    Questions:

    1. String operator `____` checks if the length of a string is equal to zero, returns
    true.

    2. String operator `____` checks if the length of a string is not equal to zero,
    returns true.

    3. File operator `____` checks if the object is an executable file, return true.

    4. File operator `____` checks if the object isn’t an empty file, return true.

    5. The echo operator `____` output the value to a file.


    Answers:

    1. `-z`

    2. `-n`

    3. `-x`

    4. `-s`

    5. `>`


    ## Chapter 6 Test

    Questions:

    1. `_____` is used to execute the arithmetical calculation.

    2. In text command, `____` checks whether a file exists.

    3. In text command, `____` checks whether a string is empty.

    4. The syntax to define a function is as follows:

    ```

    function_name() {

    }

    ```

    5. `return` can return a value to the `_____`. `_____` shows the return value.


    Answers:

    1. `[]`

    2. `-e`

    3. `-n`

    4. `function_name`

    5. `$`


    ## Chapter 7 Test

    Questions:

    1. The syntax of `while loop` is as follows:

    ```

    while condition

    _____

    code1

    _____

    ```

    2. `_____` accepts the input from user.

    3. `_____` loops through a block of code if the specified condition is false,
    will quit the loop if the condition is true.

    4. The syntax of `case statement` is as follows:

    ```

    case value in

    pattern1) code1;;

    pattern2) code2;;

    *) ) code4;; # when match nothing, run this

    esac

    ```

    5. The syntax of `for loop` is as follows:

    ```

    for var _____ item1 item2 item3…

    do

    code1

    code2

    done

    ```


    Answers:

    1. `do`

    2. `read`

    3. `until loop`

    4. `pattern*`

    5. `in`


    ## Chapter 8 Test

    Questions:

    1. `_____` statement allows the user to select one item to meet the condition,
    and run the related code.

    2. Append the contents to the end of the file by using `_____`.

    3. Get input from a file by using `_____`.

    4. The syntax of Here Document is as follows:

    ```

    command _____ delimiter

    document

    delimiter

    ```

    5. The syntax to include an external script file into the current file is: `_____
    ./ external_file`


    Answers:

    1. `Select`

    2. `>>`

    3. `<`

    4. `<<`

    5. `source`


