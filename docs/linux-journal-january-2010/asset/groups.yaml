    # Dani Gutiez


    In Bill readers: I made a mistake when you were doing the research for this article.
    (Don''t let Kyle Rankin know, I never heard the end of it turns) You can use a
    VNC-enabled console by simply adding a -vnc :1 switch when you are starting the
    machine. Sadly, when doing for the article, my Google-failed failed it-I kept
    getting the instructions for "KVM type" of keyboardvideo/mouse switches. I glad
    that it supports headless, and no research. However, this does highlight the issue
    that KVM''s usability isn''t where it should be when compared to VirtualBox and
    VMware on playing this field.


    # VirtualBox


    I recently installed Sun''s VirtualBox after reading the "Virtualization Shooting
    article in the November 2009 issue. It''s a great tool to keep me Windows set
    up for occasions when I can''t figure out how to do it. As a newbie in an all-Microsoft
    environment, I needed the exposure to Linux I wanted, and to dual-boot between
    the two OS Virtualizations. This gave me the best of both worlds. So, now I boot
    to the Ubuntu Linux host and my virtual Windows XP guest when needed.


    I don''t work for the company, do I need any of its sells, but it is a great app!
    Check it out, and maybe you could provide a review for readers (www.zarafa.com).


