    # AN AMATEUR RADIO SURVIVAL GUIDE FOR LINUX USERS


    AN OVERVIEW OF COMMON AMATEUR RADIO ACTIVITIES WITH INFORMATION ABOUT HOW TO PARTICIPATE
    USING A LINUX SYSTEM AND FREE SOFTWARE.


    DAN SMITH


    Maintaining a Linux-only household is getting easier every day. The large number
    of people working to port or re-implement desktop and general-use software from
    other operating environments helps keep the progress going. Enjoying a hobby that
    is mostly dominated by Windows users is, unfortunately, not nearly as easy. The
    Amateur Radio culture is one of experimentation and going against the mainstream,
    but the relatively small number of people pushing innovation are doing so on their
    platform of comfort, which usually means Windows. As a result, many applications
    are not available for Linux. In this article, I cover some of the basic tasks
    that a Linux venturing into the world of Amateur Radio might be interested in
    doing without undergoing a lifestyle change. First, here''s a quick vocabulary
    lesson for those not familiar with some common radio terms.


    The HF (High Frequency) bands are frequencies between 1MHz and 30MHz, starting
    just above the US AM broadcast radio band. Signals on these frequencies are capable
    of traveling around the globe, thanks to the upper ionosphere. If you want to
    talk to another country, the bands are for you.


    The VHF (Very High Frequency) and UHF (Ultra High Frequency) bands are frequencies
    above 30MHz up to 3GHz. Signals in this range propagate in an increasingly line-of-sight
    manner and, thus, are mostly useful for local area (VHF) and very short range
    (UHF) communication. However, these frequencies also provide an opportunity for
    increased bandwidths and data rates, which is why Wi-Fi sits at the upper range
    (2.4GHz).


    # CONTEST LOG


    One activity on HF is "contesting", which involves making distinct contacts to
    achieve some sort of goal. This usually involves many contacts to different places
    in a certain part of time. Because it is a contest, a sort of log is needed to
    record the contacts you make for later submission. Amateur Radio operators use
    calls to identify each other, most software helps identify if you''ve "worked"
    or awarded between locations, antennas and so on. It also gives you an idea of
    what time of day signals from a particular part of the globe are reaching you,
    in case you want to contact someone in a specific place. If you''re interested
    in this sort of operation, check out the live map (see Resources) to find out
    who is roaming now.


    Although it may seem quiet and desolate, if you''ve never had a half-duplex connection
    with at least one side of the world, you don''t know what you''re missing unless
    you''ve done it with more than a battery and a piece of wire in hand! The Xlog
    program for Linux provides basic contest functionality, including duplicate checking.
    It can also connect to your radio via serial port to record other bits of information
    automatically, such as mode, signal strength and any other information recorded
    by operators, so Xlog has configurable fields to help you with it.


    # VHF/UHF Packet


    When most people think after Amateur Radio, they get a big rig operating under
    clicking and words in Morse code. If this stereotype is stuck in your head, the
    following discussion will clear up things afterwards. The HF bands are used for
    long-distance communications on low frequencies using larger antennas, and VHF
    and UHF are used by everyone for local communication.


    Wireless networking is a hot topic now, when involves the use of transmitters
    to build a wide area network. Do you know that Amateur Radio have been doing this
    since the mid-1980s? Field amateurs have been in place for a long time, providing
    wide-area access to types of networks including the. Historically, packet networks
    used a protocol called AX25, which operates at Layer 2 and Layer 3. More popular
    now, however, is the use of AX25 at Layer 3 which has support integrated into
    the kernel for a long time. With this a radio and a TNC can


    # HF DIGITAL MODES (PSK, RTTY AND OTHER)


    Another very popular operation on the HF bands is slow-speed digital modes. Some
    of these modes, such as RTTY (radiotext), prefer digital signaling. Others, like
    PSK (key shifting), have recently invented digital advantage. External hardware
    must be used to operate these modes, now you need a modern modem to encode and
    decode the signal. The most common thing for this sort of work on Linux is that
    you can transmit and receive these digital signals without any special equipment.


    In recent days, there have been other radio stations on PSK frequency, Fligi will
    listen to them and report the calls and locations it hears to a public database.
    This is very valuable information when others are having differences. Most distributions
    include AX25 in the kernel and require installation of tools packages (link) to
    get started. Extensive configuration is beyond the scope of the following steps
    but enough to get an IP link on the


    First, configure the AX25 part by putting something like in /etc/ax25/:


    ```

    # radio 9600 25

    ```


    Next, attach your serial TNC to the AX25 interface and give it an IP address:


    ```

    # kissat /dev/ttyS0 radio 44.1.2.3

    ```


    Configure the TNC parameters for transmit data and so:


    ```

    # kissargs -p radio -t 100 -s 100 -r 25

    ```


    At this point, if either is set up, you will be able to ping Telnet or do whatever
    you want over your IP-over-AX25 interface. To bridge the interface, simply kissat
    to disconnect


    One of the privileges is not encrypted over our air. The reasons for this are
    mentioned in Part 97 of the Federal Communications Commission''s rules, so I won''t
    go into them here. You might wonder how you can run your system without encryption.
    Obviously, clear-text and privacy can never be achieved. However, whatever one-time
    password scheme provide some protection against casual password sniffing. I have
    effectively utilized the One Time Passwords in Everything (OIE) by configuring
    the system to use pam_opie for pam_unix authentication like an Ethernet bridge,
    which means Linux is an equal player here as well.


    Finally, the D-STAR network can be accessed without a radio at all, using a piece
    of hardware encapsulates the voice encoder in D-STAR radios and, when coupled
    with software on a desktop, allows you to connect to the Internet-linked interface
    and communicate with any area. This is a marriage of VoIP-like functionality with
    radio that has become very popular among D-STAR enthusiasts. The good news is
    that this also runs natively on Linux!


    # WHAT ELSE IS THERE?


    I have covered some of the common actions that Linux users looking to enter the
    world of Amateur Radio are likely to be interested in. There are many other interesting
    areas of activity, and in all cases, there is a way to participate as a Linux
    user: for example:


    - APR (Automatic Packet Reporting System): location-aware services are starting
    to operate on our mobile phones gain the connectivity, and software to support
    them. With many things, Amateur Radio operators are aware of the cure here well.
    For more than two decades they use GPS to transmit their positions to others.
    Initially used for local-position awareness during public events, the system is
    now interfaced to the Internet, providing a way to track them from a Web browser
    using Google Maps. APR is also free and inexpensive to use, and it features and
    fully operates over the so-called modern systems.


    # D-STAR: SMART TECHNOLOGY FOR RADIO


    Most of the things I have discussed so far in the previous century, and thus,
    are quite out of date. Introducing a newcomer to the D-STAR system. Describing
    both on-air mode and as a system for connecting nodes over the Internet, D-STAR
    has brought 21st-century functionality to the hobby.


    The ever-growing D-STAR network consists of repeaters that provide access to RF
    from a local area


    However, there things that D-STAR may prompt you to plug your Linux computer to
    your radio. This is slow-speed data transmission, transmitting all the voice traffic
    to spot. This can be used for reporting purposes (DSTAR radio can be plugged in
    to a GPS directly as well as transferring simple files). For this, the D-STAR
    software (resources) can be used and natively supported on Linux. In addition
    to slow-speed data transfers, D-STAR has a high-speed transport that doesn''t
    waste any space with voice traffic and 128kbps of throughput over coverage areas
    tens of miles. Locally, this system behaves


