    pairing the lock. The first step was upgrading my firmware. My Vera was running
    1.0.434, 1.0602 was required for the lock, and the current version was 1.039.
    I went to learn the latest version, figuring I might have worked with X10, as
    a bonus.


    If you have never worked with X10, the process for Z-Wave is a breath of fresh
    air. Instead of messing with small toggles, you simply pull the door open and
    press a button to put it in pairing mode. Then you activate the Z-Wave device.
    Put the door back and start connecting. This is much easier if you are trying
    to lock a Z-Wave device, like a lot more seriously. As a result, the process is
    much more involved. It is a little more complicated, but it has a very strong
    signal (a result of trying to connect battery power and being inside the lock
    mechanism). That didn''t prove to be much of a problem, because I had a network
    and power port not far from the door.


    The door would dance, which meant starting the pairing process and then running
    the door to a programming code. After two attempts, I saw a green light from the
    lock. I was able to see the lock on the Vera device screen. Things should go smoothly
    from here on. I clicked on to unlock. Nothing seemed to happen. It turns out that
    the lock and Vera were talking, so they were still exchanging information—meaning
    that all my message was being received. I waited a few minutes, the lock and Vera
    were fully synced.


    If I was using the LinuxMCE, the path is not as clear as I thought. I did some
    research, and I was not able to find anyone who reported having a lock with LinuxMCE.
    I would have used it, but I only found out how to lock out the door.


    Once the job was cleared, I was able to add myself as a user to the Vera. My profile
    on the Vera has my phone number so I can get SMS alerts. Vera supports the concept
    of "scenes". A scene allows you to tie an event, a notification and one or more
    to Z-Wave devices. I created a scene called Open, which was tied to the event
    that is generated when the door opened, and I set the scene to notify me via email
    and SMS.


    Once this set was up, I was notified when the door opened. This was completely
    independent of entering a pin on the keypad, which meant when I left the door
    unlocked, going in and out of the room generated alerts. SMS can take me time,
    by the time I realized how many alerts I generated, I was getting a lot of them.


    ## Who Went There


    Knowing someone in my office is a great improvement. In the event of an actual
    compromise, it would be better to have some information about the intruder. That
    brings me to the next part of the solution, the Webcam. I had one around and this
    would be a good use for it.


    The Vera appears to be a basically USB. Running OpenWRT with custom modifications
    to be a good thing, because it means software for OpenWRT on the Vera. Mi Casa
    does not fully support changes, but it gives you full access to the system. It
    doesn''t get in the way.


    The first step to doing this of work is hooking up the Webcam to my normal workflow.
    From experience that I can get it to work on a full Linux install, you have no
    doubt getting to work on an embedded device. The Webcam plugged in nicely and
    a simple webcam server was immediately looking at a picture of myself. This was
    wanted on two fronts. If it didn''t work on the Linux then I could move on to
    the hard stuff.


    Getting shell access to the Vera is easy. Go to Advanced & WiFi Configuration.
    It will ask you to set a password. After that point, you will be able to ssh in
    as root. The filesystem is a compressed file. At first, the root file system appears
    to be complete for what I need. In most cases, you can find and simple things
    that work on the root filesystem with no problems.


    OpenWRT uses ipkg to manage packages, and that is broken on the root. The workaround
    is to use wget. You simply follow the same process for all. It turns out that
    the ip package is a set of nested archives. Here is the process for installing
    the gph02:


    ```bash

    cd /tmp

    wget http://www.wrt.org/sort/kamikamaze/snapshots/brcm-2.4.1/packages/gph02_2.4.7-1-brcm-2.4.ipk

    tar -xvf gph02_2.4.7-1-brcm-2.4.ipk

    cd /

    tar -xvf /tmp/tar.gz

    ```


    I was really excited, there are two options for the demo image capture: gph02
    and motion. gph02 is a command-line tool for controlling. motion is a tool for
    controlling a Webcam and detecting motion.


    What I really, really wanted a video of the motion, which would provide an actual
    video of the person entering, but I ran into a classic version problem: The Vera/ASUS
    uses a Broadcom chipset for the kernel which is anyway flag under it is using
    a 2.4. The Webcam drivers for 2 are really limited. It turns out the uvc driver
    allowed the Webcam to work on my workspace is available in 2.6. I didn''t find
    it around a Webcam that was supported with the drivers at my disposal.


