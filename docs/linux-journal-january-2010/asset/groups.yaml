    If you are wondering defined the three final steps, no further than the right-hand
    side of the output: Webrat, a browser simulator in Ruby, understands a large number
    of browser-style step definitions, including “to go and I should see”, allowing
    for the presence or absence of text in each situation. Cucumber provides a wide
    variety of Webrat step definitions, that you can tell Cucumber to go to a page,
    to fill in a form or or use selection lists, check boxes and buttons.


    This is basically what it means to work with Cucumber. You can create one or more
    scenarios in that feature, the lines of which are matched by regular expressions
    defined in the step_definitions. The fact that the feature is written in English,
    from the perspective of the user, can show to technical managers or clients. They
    can even help write perfectly for the scenarios of Cucumber, they can understand
    that you are trying to test the application from a variety of perspectives.


    It feels a bit strange (at least, initially) to experience Cucumber, because you''re
    writing basically code, but in full English sentences. It also takes some time
    to internalize the fact that each sentence is similar to a callback, invoking
    a piece of code in the step_definitions. Over time, you presumably create a large
    library of such step definitions, which you can mix and match within your Cucumber.


