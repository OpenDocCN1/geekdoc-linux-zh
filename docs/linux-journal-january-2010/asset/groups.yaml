    ## TS-7500

    嵌入式计算机


    更快。更简单。更便宜。


    完全针对信用卡刷卡（“盗刷”）和其他经济犯罪。


    $84 美元


    大学生和青少年仍然符合这一特征，但在许多情况下，他们正在为可怕的人工作，赚取实实在在的钱。策划木马和病毒的人（这些病毒在攻击中承担了大量工作）在很多情况下都是高薪程序员，他们的收入比编写反恶意软件和防火墙软件的程序员要高得多。


    ![](img/9f8eb2f23eddae840f8630deba43fac9_28_0.png)


    在操作系统安全领域，我们担心病毒——即最终可能被欺骗运行或窃取系统的可执行文件。现在有针对 Web 浏览器的攻击。在浏览器安全领域，我们担心的是恶性的 Web
    内容，它们会改变行为，或者窃取浏览器正在处理或存储在系统中的数据。


    这就是我们的安全局势。这种情况并不比年前更令人担忧，而且电子商务和互联网流量在某种程度上确实变得越来越糟糕。我们可能需要关注这些趋势，因为事实正是如此。


    而且，这只是 Web 应用方程式中的客户端部分！在服务器端，我们不仅没有敌意的网站，而且 Web 网站的漏洞可能允许攻击者访问后端系统并追踪其他用户。


    那么，这些攻击与防御的趋势是如何影响防御的呢？


    SSL/TLS 怎么样？它不是提供了加密签名和验证活动内容、身份验证以及防止倾听的方法吗？以前，它确实能让我们大多数人在进行银行交易等操作时具有合理的安全性和信心。然而，正如我在
    2009 年 11 月的 DEFCON 会上报告的那样，近期针对 SSL/TLS 保护交易的攻击明显增加。


    ## Web 安全与 SSL/TLS 漏洞


    如果互联网安全是一场战争，那么 Web 应用就是前线。没有什么改变我们与内容交互的方式，以及我们交互的地方——万维网——即在由 Web 服务调解的跨网络中使用数据浏览器。事实是，Web
    是一切的核心。Web 现在已无处不在，它已经与互联网同义，并且远不止如此。


    ![](img/9f8eb2f23eddae840f8630deba43fac9_28_1.png)


    由 250 MHz ARM CPU 驱动


    - 低功耗，< 2 瓦

    - 64MB DDR-RAM

    - 4MB NB Flash

    - Micro-SD 卡槽 - SDHC

    - 10/100 以太网接入速度小于 3 秒

    - 可定制 FPGA - 5K LUT

    - 以太网供电 (PoE) 功能

    - 可选备份接收 CTR

    - 8 路 TTL UART

    - 30 SPI, I2C


    Web 浏览器不需要嵌入式操作系统。浏览器的主要功能是用于格式化和分发数据。我们最初在现实意义上是带有图像和其他页面链接的浏览器，现在我们使用浏览器来下载并执行代码本身。这些代码可以是简单的脚本，也可以由我们生成（例如来自单页在线）并传输到服务器。或者，它也可以像远程桌面应用程序一样复杂，让我们控制世界另一端的内容。开发工具包提供了开发之外的额外功能


    攻击者在某些攻击中可能尝试分割的大多数内容可能会被高度签名的数字内容所绕过，用户身份验证的担忧得到了维护，但 SSL/TLS 保护的交易可能会被重大问题击败，例如版本：这是公钥基础设施中暴露的漏洞。其他人利用
