    # awk


    This is in reference to David''s column in the April 2009 issue and word or letter
    count. The filter for using occurrences of patterns on stdin:


    ```

    sort |uniq

    ```


    I appreciate the beauty of this filter owing to its simplicity. In practice, I
    find this becoming slower and slower the data size and the cost of sorting increases.
    I use the following code, which does the job extremely fast:


    ```

    awk ''{ count($0)++ }

    END (for (i in count) print i,count[i]) }

    ```


    One can also derive better of occurrence easily as:


    ```

    END (for (i in count) print i,count[i]) }

    ```


