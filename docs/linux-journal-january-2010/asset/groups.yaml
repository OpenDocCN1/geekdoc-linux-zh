    # AN AMATEUR RADIO SURVIVAL GUIDE FOR LINUX USERS


    AN OVERVIEW OF COMMON AMATEUR RADIO ACTIVITIES WITH INFORMATION ABOUT HOW TO PARTICIPATE
    USING A LINUX SYSTEM AND FREE SOFTWARE.


    DAN SMITH


    Maintaining a Linux-only household is getting easier every day. The large number
    of people working to port or re-implement desktop and general-use software from
    other operating environments helps keep the progress going. Enjoying a hobby that
    is mostly dominated by Windows users is, unfortunately, not nearly as easy. The
    Amateur Radio culture is one of experimentation and going against the mainstream,
    but the relatively small number of people pushing innovation are doing so on their
    platform of comfort, which usually means Windows. As a result, many applications
    are not available for Linux. In this article, I cover some of the basic tasks
    that a Linux venturing into the world of Amateur Radio might be interested in
    doing without undergoing a lifestyle change. First, here''s a quick vocabulary
    lesson for those not familiar with some common radio terms.


    The HF (High Frequency) bands are frequencies between 1MHz and 30MHz, starting
    just above the US AM broadcast radio band. Signals on these frequencies are capable
    of traveling around the globe, thanks to the upper ionosphere. If you want to
    talk to another country, the bands are for you.


    The VHF (Very High Frequency) and UHF (Ultra High Frequency) bands are frequencies
    above 30MHz up to 3GHz. Signals in this range propagate in an increasingly line-of-sight
    manner and, thus, are mostly useful for local area (VHF) and very short range
    (UHF) communication. However, these frequencies also provide an opportunity for
    increased bandwidths and data rates, which is why Wi-Fi sits at the upper range
    (2.4GHz).'
  - '[PAGE 48]


    # CONTEST LOG


    One activity on HF is "contesting", which involves making-distinct contacts to
    achieve some sort of goal. This usually involves many contacts to different places
    as in a certain part of time. Because it is a contest, sort of log is needed to
    record the contacts you make later submission. Amateur Radio operators use calls
    to identify each other, most software helps identify if you''ve "worked" or awarded


    between locations, antennas and so on. It also gives you an idea of what time
    of day signals from a particular part of the globe are reaching you, in case you
    want to contact someone in a specific place. If you''re interested in this sort
    of operation, check out the live map (see Resources) to find out who is roaming
    now.


    Although it may seem quiet and desolate, if you''ve never had a half-duplex connection
    31 at least with other side of the world, you don''t know what you''re missing-unless
    you''ve done it with nothing more than a battery, and a piece of wire in hand!


    The Xlog program for Linux provides basic contest functionality, including duplicate
    checking. It can also connect to your radio via serial port to record other bits
    of information about a contact automatically, such as mode, signal strength and
    any (or pieces of) information that be recorded by operators, so Xlog has configurable
    fields to help you with Task (1).


    # VHF/UHF Packet


    When most people think after Amateur Radio, they get a big rig by radio operating
    under an even bigger engine clicking letters and words in Morse code. If this
    stereotype is stuck in your head, the following discussion will clear up things
    afterwards. The HF bands are used for long-distance communications on low frequencies
    using larger and smaller antennas, VHF and UHF are used by everyone from drivers
