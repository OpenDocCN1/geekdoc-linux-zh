    ## 特性：使用数字业余无线电进行定制


    ![](img/9f8eb2f23eddae840f8630deba43fac9_59_0.png)


    图 2. FLDigIRol v3.10 带有频率控制旋钮、按钮栏和新选项菜单


    FLDigI 中的自动功能不足以帮助操作员在接收时确定数字信号，而且它们并不非常有效，特别是在恶劣波段或弱信号的情况下。此外，你必须尽可能地更改和手动配置设置，以及在电台停止发射之前最终获得正确的设置。如果你必须通过多个对话框和标签菜单来访问项目，这将减慢你的速度并大大降低出错几率。


    ![](img/9f8eb2f23eddae840f8630deba43fac9_60_0.png)


    图 3. FLDigI 的可切换按钮栏


    我决定在 FLDigI 的主菜单中添加三个可编程按钮。我之所以这样做是因为 FLDigI 已经有了宏按钮，但现有的代码很有帮助，因为它让我选择特定的数字模式或细分，总共提供了
    27 个可以同时显示的按钮。


    这些方式可以被视为模式，但只有在电台停止发射之前识别出模式及其参数时，所有这些模式才能被解码。例如，数字模式 Olivia 可以被配置为让任何数字操作员都难以准确且及时地识别这些模式。


    重要的 Olivia-MT63-DominoEX 在这些频率上运行，以及一些他们在平均频率上执行的其他重要事项。我还以弹出对话框的形式添加了更多用户反馈代码，以及标题栏和状态栏中的信息。在此之前，当我点击按钮和菜单时，并不会让我知道发生了什么。例如，点击
    QSO Save（保存呼话）按钮时，是否有保存联系记录时发生的任何听觉或视觉指示？通常，如果我必须检查日志来确保信息存在，我就会忘记某次通话。我还添加了代码，这样如果我需要对同一个通话进行多次，程序就会知道并识别出我。


    另一个是 DM780 具有日志查找功能，这让我在输入呼号之前就知道我是否已经与另一个业余无线电电台通话过。通过为 FLDigI 编写一个基础循环程序，我节省了几个小时，该程序在标签上下文中处理了上一次通话的日期和频率（频段）信息。我还添加了代码，让我只需将光标悬停在
    RX 文本框的呼号上即可看到相同的信息。


    # 如果无线设备附带说明他们不能修改它的许可，那么很少有人会购买无线设备，对于为什么我们所有人通常都使用开源、特别是 Linux，这是很自然的。


    我更改了代码，让日志簿会将信息保存到硬盘，并在我编辑条目后的同一天对日志对话框进行更新。


    我从几个月前开始添加功能、模式和大量代码，以达到我想要的目标。在过去的一年里，我又增加了十几个小改进，并在这个过程中收获了很多乐趣。


    在这个过程中，这段经历让我比以前更加尊重原作者。每当我需要对代码进行一些添加和更改时，我都能下载较版本的 FLDigI 并在短短几天内发布我的修改版。


    我想在原始 FLDigI 程序中添加的内容之一是，那些想法中的大部分本会被添加的，我们只是在队列中等待了很久，但我想尝试直接或间接地去添加它们。


    我在 Windows 虚拟机中安装了基于 Windows 的跨环境 Cygwin，并最终为几位要求的操作员制作了 Windows 版本的 FLDigI。


    自从 FLDigI 3.13 版本发布以来，作者们开始使用 MinGW，另一种可以在 Linux 上运行的跨平台编译器环境。我曾使用虚拟机编译 FLDigI
    的测试版本，但现在我在主桌面上使用 MinGW 并在 Linux 中编译。MinGW 看起来对我的项目效果更好，而且设置要容易得多。


    我获得的经验启发了我去尝试另一个项目。我的下一个目标是创建 flagDigI，一个为无经验操作员设计的 FLDigI 轻量版。我计划删除大部分配置设置并简化程序，让新用户无需多次尝试即可运行它，而不需要处理复杂的配置。


    名称和家庭位置（QTH）。我还想确保他们可以轻松从像 Olivia 等更高级的模式切换，甚至在将呼号输入 CALL 字段之前就能看到这些信息。我对 FLDigI
    内部联系日志进行了几处视觉改进，并添加了它是如何保存联系记录的。FLDigI 在我点击 QSO Save 按钮时，并没有直接记录我的条目。事实上，在完成几次通话并发现只有在关闭通话时才会保存信息这一硬方法之后，它才解码了我。


    我为所有可能的模式又添加了按钮，但它很容易就能覆盖大多数常用的模式。这让我只需点击一下鼠标即可从一个带有参数的特定模式切换到另一个模式，并极大地切换了焦点。我在通话（QSO）输入字段下方又添加了一个面板，带有多个控制控件，用于控制发射（TX）呼号和接收（RX）文本字段、访问日志簿、设置


    58 | 2010年1月 | www.linux.com

