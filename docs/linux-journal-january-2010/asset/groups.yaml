    对于系统而言，由于可能受到广泛且持续的破坏，我们越是应用多样化、分层的控制措施，即使是恶意软件，其针对性攻击成功的概率就越低，其可能造成的损害范围也越有限。


    此外，如果后端是安全的，并且任何从客户服务代表处收集数据的恶意软件都能处理得完美无缺，但如果他们的系统被将信息回传到犯罪服务器的键盘记录器所感染，或者通过
    SSL 加密的网络流感染，那么个体漏洞依然存在。像安全领域的许多其他领域一样，这与其说是防止攻击，不如说是增加此类攻击成功所需的成本和精力。


    ## 虚拟化


    那么，我们是如何走向虚拟化的呢？无论是本身还是与云计算结合，它都是许多热点和炒作焦点。虚拟化重塑了我们使用计算机的方式。通过让“计算硬件”这一概念相对于操作系统和应用程序变得几乎完全抽象，虚拟化可以规避某些物理甚至地理上的限制，或者更准确地说，它可以将这些限制转移到资源规划过程的其他部分。


    恶意软件威胁是不可控的吗？在某种程度上，从实际角度来看，它是一种特定的内部攻击，而内部攻击是可以被完全防止的。好消息是，我们已经知道如何管理内部威胁：背景检查、系统/应用程序/员工监控、所有层面的粒度访问控制、良好的安全性等等。


    也许是过于理想化了，我们曾认为虚拟化将让我们从操作系统安全中的“赢者通吃”现象中解脱出来。在任何受到攻击的系统中，攻击者只需要在应用程序中找到一个漏洞就可以完全破坏整个系统。但如果特定服务器上最脆弱的应用程序是系统上唯一的网络监听器呢？


    ## 预装 UBUNTU 的小型、高效计算机。


    ## GS-Lo8 无风扇 Pico-ITX 系统


    - 3677 英特尔 Core 2 Duo 移动系统

    - 多种英特尔主板可选

    - 非常别移动计算和桌面计算

    - 超紧凑、功能全的计算机

    - 非常适用于工业应用


    ![](img/9f8eb2f23eddae840f8630deba43fac9_30_0.png)


    发现 MINI-ITX 的优势。

    从我们这里选择一个完整的、专用平台是非常简单的：适用于办公和桌面用途的预配置系统、Linux 开发服务以及丰富的在线资源。


    ![](img/9f8eb2f23eddae840f8630deba43fac9_30_1.png)


    ## 偏执企鹅 (PARANOID PENGUIN)


    假设我需要使用 Sendmail 运行 SMTP，通常我会在该系统上运行网络时间协议 (NTP) 守护进程、安全 Shell (sshd) 和 RealVNC。这四种不同的攻击向量对同一个系统构成了威胁。但如果我在宿主机上自己的自己的虚拟机中运行
    Sendmail，从外部访问它，而底层宿主机不运行其他守护进程，且仅接受来自某些内部访问 IP 的连接呢？


    当然，我可以使用 TCP 代理或 iptables 在不使用虚拟化的情况下实现类似的功能。但如果所有守护进程都运行在同一个系统中，攻击者仅获得了部分立足访问权限，攻击者可能可以通过攻击一个或多个其他守护进程来提升权限。但如果这些守护进程运行在
    Sendmail 虚拟机的主机上，并配置为拒绝来自 Sendmail 虚拟机的连接，攻击就会失败。


    除非我们对虚拟化的假设不成立。这使我面对了最大化硬件资源利用的阴暗面，我担心可能没有足够的动力。


    我们假设一个虚拟机不能查看或访问运行在同一宿主机上的其他虚拟机的数据（磁盘空间、内存等）。但虚拟化本应该是由其他东西——虚拟机监控程序（Hypervisor）或监控程序进行隔离的。我们还假设任何用户空间应用程序或虚拟机直接与底层的任何进程或资源通信都是不可行的。


    如果你编写一个虚拟机监控程序，就有强烈的动力去维护这些假设并创建一个安全的虚拟机监控程序。任何防止超安全的尝试都会对系统性能、可用性和可靠性产生负面影响。例如，允许一个虚拟机访问另一个内存的漏洞可能会让攻击者直接破坏，至少可能导致一个虚拟机的性能受损，而不是无意中被其所有。


    但最近显示，针对流行的系统虚拟化环境（如 VMware），理论和演示性的攻击都是可能的（请查看资源中 Michael Kemp 的链接）。


    这意味着我们不应该使用虚拟化吗？当然不是。这是一项强大且实用的技术。它也是新的，至少在我们现在部署的许多背景下如此。


    ## 结论


    也许是过于理想化了，我们曾认为虚拟化将让我们从操作系统安全中的“赢者通吃”现象中解脱出来。在任何受到攻击的系统中，攻击者只需要在应用程序中找到一个漏洞就可以完全破坏整个系统。但如果特定服务器上最脆弱的应用程序是系统上唯一的网络监听器呢？


