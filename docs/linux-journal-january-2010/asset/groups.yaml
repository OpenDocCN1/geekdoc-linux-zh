    ## 获取业余无线执照


    执照分为三个等级：技术级（Technical）、通用级（General）和业余特级（Amateur Extra）。每种执照都授予某些权限，大部分集中在第一级。


    入门级允许你以许多权限参与本文介绍的 APRS 网络。


    许多人对业余无线电员的想象是坐在地下室里，对着发着光的真空管无线电台敲击摩斯电码。


    好消息是，摩斯电码在美国不再是强制要求。真空管已被晶体管、嵌入式处理器和轨道上的软件卫星、国际空间站上的设备（以及过期的 MIR、DME 和 EVE 信号源）所取代。这不再是你爷爷那辈的无线电台了！


    获取执照的许多障碍已经消除。执照不再由 FCC 现场官员发放，而是由志愿者发放。在大型城市地区，每月有多个在线测试地点（可以尝试 www.arrl.org
    等其他网站）。


    欲了解更多关于业余无线的信息以及你所在地区的测试地点，请访问 www.arrl.org 并点击。


    注意：以上信息为通用信息。每个国家都有管理业余无线电的机构和国家业余无线组织。请联系你的组织或监管机构获取有关你国家业余无线执照的具体细节。


    ## 如何使用 Xastar


    首先，在 Xastar 用户列表（Resources）上注册。许多经验丰富的用户和一些常客活跃在那里。你可以在那里发布请求、在需要之前注册以及进行“模拟（dummy）”会话。即使出错或重新学习一下，我们在那里也不会受到骚扰。


    检查 Xastar 主页（Resources）、随 Xastar 分发的“XSTAR Documentation”（Xastar文档）和“Text docs”（文本文档）部分。当然，可以在
    Xastar 源码主目录或默认安装位置 `/usr/local/share/xastir/` 中查找文本文档。


    深入菜单，你会发现一些 SAR 功能，以及用于警方事件跟踪的有用功能。Xastar 对于自行车、摩托车和汽车活动非常出色。


    对于那些来自 Xstar 的用户，UI-View 地图可以转换为我们的格式。Xastar 帮助了北美的用户，因为他们通常无法获得我们可能享享的免费地图。


    尽管 APRS 并非用于或旨在用于此目的，但某人在车辆被盗时，能够告诉警方汽车的当前位置和速度。这在向警方解释你是如何知道这些信息方面起到了一些作用。


    - 我们不支持或不容许使用非法地图，但有很多地图可以选择。你也可以获取你使用的地图截图，并轻松地进行地理参考以供 Xastar 使用。


    - 对于来自 USGS DSG 地图的地形图，Xastar 的代码会裁剪地图并将其拉伸为带有绘制的矩形。地图被缝合成一个连续区域。


    - Xastar 支持直接或网络连接到台站、GPSES 和 TNC。支持多种坐标网格/系统，如 UTM/MGS、USNG、Maiden 网格以及多种经纬度格式。内置包含一个坐标计算器，可以在它们之间进行转换。


    - 菜单以七种真实语言和五种“非真实”语言出现。开发者可能会因为增加了这五种“语言”而受到一点“火力”，但你知道增强功能会产生一些有趣的结果！


    图 3，Xastar 天气预警（地图由国家气象局提供）


    ## Xastir/APRS 需要的设备


    1) 最低要求：一个运行中的 Linux 环境（或其他 Unix/Linux 类操作系统）和 Xastir。


    2) 将无线电台添加到 tnc：Linux、声卡、连接电脑的无线电台或有效的业余无线电台以及 Xastir。可以在没有 AX.25 接口的情况下配置设置。


    请注意，在没有业余无线执照的情况下拥有业余无线设备是完全合法的，只要你仅使用设备接收 APR 无线电频率。这个社区有能力（并且愿意）帮助打击麻烦的违规行为，FCC
    有关于打击投机者的事实。


    3) 更合理的台站：两米无线电台和有效的天线。同样，你可以使用 Xastir AX.25 进行配置。


    要构建便携式或移动式跟踪器，有许多不需要携带大型气球的选项。访问 aptrs.net 并点击 Hardware 查看选项。


    如果你有互联网连接，进入 Map=Mapper，点击 Online Tiger，然后点击 OK。如果你位于美国并缩放得足够，可能会出现 Tigergap 地图。


    如果你没有连接或正在移动库以匹配地图，请使用如 ESRI Shape 等地图格式。ESRI 格式的世界地图是理想的。


    提示：从终端启动 Xastir 以捕获错误和消息。点击 Edit->Map Map 导入你的地址。


    你可能想选择天气站、天气和位置。进入 Interface->Interface Control。点击 Add，然后 OK。再次点击 OK。你需要一个 Internet
    服务器来使用 Interface Control 对话框。点击 Properties。在表单中输入服务器和端口信息。尝试端口 1458，速度为 96，这将使得
    600km 内所有台站的报告出现在地图上。


    运行此脚本以获取你地区的 Shapefile 地图：


    ```

    xastir/scripts/getHws

    ```


    首次运行 Xastir，按照 Interface->Configuration 对话框输入你的位置并选择一个出现在你地图上的符号。有些人有特殊的偏好，所以如果你想提问，请依靠其中一个。


    访问 File->Defaults 节点。注意，你的高度不是海海拔（ASL），而是平均地形高度（HAAT）。Curt 曾由于周围的山丘将高度设为海海拔 150
    英尺，但协议不允许负的 HAAT；不知道在那种情况下该怎么办！


    一些特殊键包括 HOME（中心位于你的地图或房屋）、PageUp/PageDown（缩放键）和方向键（平移键）。顶部的切换按钮也可以显示这些功能：


    ## 发射路径


    AX.25 协议在每个数据包头部有多个槽。一个数据包流向所有方向。目前检测到的数据包包括 WIDG-W-2 和 WIDG-W-1。WIDE-4 用于移动台站。如果你在不使用
    WIDE-1 作为任何内容的情况下点击两次，那么第一个呼号将出现在你的地图中。


    通过遵循上述（目前针对北美）建议，你所在国家的国家网络可能不适用于你的情况（和选项），取决于问题，这种定义有助于他人。


    对于“精简”类型，数据包结尾有特殊的调用路径可以防止其进入互联网。这些情况被大多数忽略软件尊重。


    ## 特殊事件的战术呼号


    Xastir 一个非常实用的功能是可以为台站关联呼号，并通过射频或其它 APRS 客户端传输这些，目前只有 Xastir 和 APRS+SA 可以解码并显示战术呼号。


    我们在 2000 年和 2008 年 11 月的西雅图马拉松之前不久增加了此功能以产生效果。它允许我们为协助活动的人员分配呼号，而无需更改他们的跟踪器配置。



