    or mixed case:


    +   Sequence is used to specify the desired sequence of knocks—for example, 7005,7007:udp,7083.
    Knocks are all TCP, but you can use UDP.


    +   One_Time_Sequences=/path/to/file allows you to specify a file using "once"
    sequences. After each sequence is used, it will be erased. You just need a text
    file with a sequence (in the format above) in each line.


    +   Seq_Timeout=seconds.wait_for.the knock is the maximum time for completing
    a sequence. If you take too long to knock, you will not be able to get in.


    +   Start_Commands=some command specifies what command (either a single line or
    a full script) must be executed after recognizing a knock sequence. If you include
    the %%IP parameter, it will be replaced at runtime by the knocker''s IP. This
    allows you, to open the firewall port but only for the knocker and not for anybody
    else. This example uses iptables command to open the port (see Resources for more)


    +   Cmd_Timeout=seconds.to_wait_after.the knock you execute a second command certain
    time after the start command is run. You can use this to close the port; if the
    knocker does not log in quickly enough, the port will be closed.


    +   Stop_Command=some.other the command that will be executed after the second
    timeout.


    +   TCPFlags=list of flags lets you examine incoming TCP packets and discard those
    do not match the flags (FIN, SYN, RST, PSH, ACK or URG); Resources for more on
    this. Over an SSH connection, you should use TCPFlags=SYN, so other traffic will
    not interfere with the knock sequence.


