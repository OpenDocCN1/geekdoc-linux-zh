    # [LETTERS]


    clac

    in "Exploring Lat/Lon with Shell Scripts" [November 2009], Dave Taylor writes,
    "To accomplish anything mathematics in a Linux shell, we are pretty much stuck
    with bc." Now shed your shell tool! Throw off our bc and dc chains! There is a
    better way. clac is available at clac.sourceforge.net, and it has the following
    features:


    - Handles tricky, complex math, and so on.

    - Supports infix expressions (no Reverse Polish joins, please).

    - Uses Python underneath (Python syntax welcome, but not required).

    - Single source file—take it where you need it.

    - User-extensible via Python: import/write the modules you need.

    - Script-friendly: expression(s) via arguments or string, evaluation to stdout.


    clac expresses like:


    ```

    sin(pi/4)

    round(degrees(phase(** 2 )))

    sum(x**2 for x in $csV)

    ```


    and what would you expect a CLI tool to do: print out the answers in a fraction
    of a second.


    Mark Allen Bordording

