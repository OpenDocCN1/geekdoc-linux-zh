    # Xastir

    ### 自动数据包报告系统的开源客户端


    搜索与救援、业余无线电和 Linux 有什么共同点？


    在 20 世纪 90 年代初，……的导师 Bob Brunining……几十年来，该协议已经极大地增强，包含了自动气象站报告、状态消息和双向文本消息。APRS
    通信已从简单的发射器和接收器演变为使用无线电卫星、中继（数字中继器）自动中继系统和互联网网关的复杂网络。APRS 技术不仅限于业余无线电；它也被用于许多商业应用。


    位于安纳波利斯的美国海军学院设计了一个有趣的点子：他想跟踪陆军/海军对战橄榄球赛从安纳波利斯到费城（约 150 英里）的路。为了实现这一点，Brunining
    在橄榄球头盔里塞了一个小型电子设备包，由 GPS 接收器、一个业余无线电发射器和一个无线电调制调器组成。当时，GPS 接收器相当贵（而且很新鲜），而手机还很新，无法处理数据。然而，Bob
    Brunining 真正的创新是将接收器放在控制器地图显示上，并自动跟踪携带比赛球的学员的位置（见资源）。


    这是自动位置报告系统（APRS）的首次用法之一——最初是业余位置报告系统。APRS 在几十年里演变了很多，提供了态势感知或战术显示。所有值得关注的内容都显示在地图上，并可以通过点击获取更多详细信息和消息。在应急行动中，一眼就能发现哪些可用结果以及位于何。


    注意：APRS 是 APRS Software 和 Bob Bruninga, WB4APR 的注册商标。


    CURTIS E. MILLS, STEVE STROH AND LAURA SHAFFER MILLS

