    # Linux Security Challenges 2010


    Security challenges and worries for 2010: we live in interesting times indeed!


    In 2005, I wrote a Penguin column titled "The Future of Linux Security", in which
    I described what I thought were the biggest challenges of Linux security in 2005
    and the most promising new technologies for addressing them. In 2005, I argued
    that virtualization might become a more important tool for isolating vulnerable
    applications and Mandatory Access Controls (MACs), as SELinux and AppArmor. I
    also predicted that anomaly detection would become much more important than signature-based
    detection could engine without antivirus (AV) and intrusion detection prevention
    systems (IDS/IPS). So far, neither of those predictions has come true. We still
    deal with signature-based IDS/IPS that are largely incapable of detecting zero-day
    malware or new for anyone to have created a corresponding signature or polymorphic
    malware that alters itself from generation to generation.


    Virtualization has largely been driven by hardware resource management and operational
    concerns rather than security. In fact, virtualization is a bigger source of security
    issues than it is a security tool (for example, isolating applications or services
    from other parts of a given system).


    Am I embarrassed by these predictions passing out? Not as much as I am disappointed.
    I still believe that IDS and IPS need to evolve signature-matching, and I still
    think virtualization has the potential to be a bigger source of security problems
    than it is solutions to it.


