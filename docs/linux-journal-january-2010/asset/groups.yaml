    Once you have installed Cucumber, you need to add its functionality to your Rails
    application. You can do this with the following:


    ```

    script/generate cucumber

    ```


    This puts the appropriate Rake tasks into place (in lib/tasks/cucumber.rake),
    adds the initial default step definitions (that is, low-level test implementations)
    and the overall system support that is necessary for Cucumber to function. All
    of the files associated with Cucumber are put inside the features directory, which
    may be confusing if unfamiliar.


    Once these new files are in place, you can run Cucumber as follows:


    # cucumber


    Cucumber will run through any file with a feature suffix in the features directory.
    If you just installed Cucumber, no such files will exist yet, you will see output
    like this:


    ```

    0 scenarios

    0 steps

    0m0.0s

    Loaded user /usr/bin/rake

    Started

    Finished in 0.000232 seconds.

    ```


    - 0 tests, 0 assertions, 0 failures, 0 errors


    This is similar to the output you get from running rake without any tests installed.
    So Cucumber uses a different vocabulary for creating tests and specifications
    that you might want to use. Each Cucumber file describes a .feature of the application
    and has a .feature suffix. A feature typically will be a small slice of the application—anything
    from authentication, to sending receiving messages, producing a report. The feature
    traditionally is described with a line like the following:


