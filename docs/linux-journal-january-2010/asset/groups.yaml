    ## Ruby 文章


    多年来我一直是 Linux 的忠读者，涵盖了几乎所有的主题。然而，在最近几个月里，我越来越多地关注 Ruby 系列的文章。Reuben M. Lerner
    做得很好，他在为杂志选择合适主题方面非常出色。Ruby 在开源或商业市场上并不是流行的语言。在 www.langroup.com 看来，是时候给其他编程语言留出空间了。


    我喜欢你们的杂志，并期待每一期。我阅读所有的专栏、大部分评论，至少也会扫读文章。每个月，我都能发现新的信息和想法，用来加深我对 Linux 的理解。明年，我计划从零开始安装
    Linux，正如你们认为的那样。感谢你们在每一期中提供的所有信息和专业知识。


    ## Paul West


    ## Zarafa


    我知道收到很多邮件说“你们不想了解关于……吗”，但我还是在此记录在案：了解一下 Zarafa —— 一个完全原生兼容 GLv3 的 Exchange 替代方案，带有对
    Outlook 的支持且完全不需要额外费用。


    ## KVM 与 Child


    关于 Ruby 不是目前最流行的语言，你是完全正确的。这就像杂志目前的成熟度状态激发了如此大的兴趣一样。我并不是一个……


    在 2009 年一期 Bill Child 的《虚拟化专题》中，关于 VMware Server VirtualBox 与 KVM 的对比有一个错误：KVM
    确实支持 VHD。我在 Debian 服务器上使用它的目的是创建一个 Windows 服务器虚拟机，为 Windows PC 托管防病毒服务器，这完全不是如此。


    我花了几个月研究组服务器……（此处重复内容已剔除）


