    # Implement Port-Knocking Security


    Instead of coding locks, make them disappear. When dealing with computer security,
    you should assume that hackers will be trying to get in through any available
    doors your system may have, no matter how many precautions you have taken. The
    method of authentication depending on password is a classic one and is widely
    used. In order to "open a door", connect to a port on your computer, you first
    have to specify the correct password. This can work if the port is fast enough
    to knock, and it won''t fail many to attacks that might reveal your password,
    but it still presents a problem. The fact that no open door exists is enough to
    tempt. So, an open port can be thought of as a door with a (possibly) lock, where
    the password works as the key. If you are running some kind of public service
    (for example, Web), it''s better, no one can get over your service. If you want
    to allow access only to a few people, you can hide the fact that there is actually
    a door to your system from the rest of the world. You "knock intruders away",
    not only putting a lock on the door, but also hiding it. This is a simple method
    for protecting your ports, keeping them hidden and invisible to the world until
    you use a secret knock, which then will (only) open the port so you can enter
    and get access. Port knocking is appropriate for users to access services that
    are not publicly available. The server keeps all ports closed, but opens them
    on demand as users have authenticated themselves by providing a secret knock (a
    sequence of passwords). After the port is opened, usual security measures (passwords,
    credentials and so on) apply. It doesn''t require any modification, but the extra
    security is provided at the firewall level.


    In this article I will explain how to implement port knocking in order to add
    another layer to your security system.


    Figure 1. A completely locked-up site in "stealth" mode, doesn''t give any information
    to attackers, who couldn''t even learn the site actually exists.


    # Are You Safe?


    Hackers cannot attack your system unless they know how to try. Port-knocking attacks
    are a simple way to check your machine''s security level is by running an online-test,
    such as GRC''s Shields UP! (Figure 1). The test results in Figure 1 shows that
    attackers didn''t even know the machine is available.


    # Secret Handshakes, Taps and Knocks


    Another common tool is nmap, which is a Swiss Army knife of scanning and inspection
    options. A simple nmap -v site.url command will try to find any open ports. Note
    that by default, nmap scans the 1-10000 range, which covers all the popular ports.
    To scan all ports, use -p-65535. A more thorough test by adding -p1 shows you
    exactly that your site is closed to the world. So, now you know that you are safe,
    how do you go opening a port, but kept it from everyone? The idea behind port
    knocking is to close all ports and monitor attempts to connect. Whenever a specific
    sequence of attacks (a secret knock) is recognized, and only in that case, the
