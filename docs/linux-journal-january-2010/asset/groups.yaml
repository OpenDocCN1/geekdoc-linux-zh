    ## IN DEPTH


    functions you might think of—triggering a backup, running a certain process; sending-email
    and so.

    The knockd accepts the following command-line options:


    - -c lets you specify a different configuration file, instead of the usual /etc/knockd.conf.

    - -d makes knockd a daemon in the background; this is the standard way of functioning.

    - -h provides syntax help.

    - -i lets you change which interface to listen on; by default, it uses whatever
    you specify in the configuration file or eth0 if none is specified.

    - -n allows you use DNS names for log entries, because this is considered bad
    practice, because it forces your machine to lose stealthiness and do DNS traffic,
    could be monitored.


    - -v produces more verbose messages.

    - -D outputs debugging messages.

    - -V shows the current version number.


    In order to require the knocks, you could use any program, but the knock comes
    with the knockd package is the usual choice. An example of its usage is shown
    knock site_url:7885 for a TCP connection on port 7007. For UDP connection, either
    add the -u parameter, or knock site_url:7885. The -h parameter provides the simple
    syntax synopsis.


    ## Conclusion


    Port knocking cannot be the only security weapon in your arsenal, but it adds
    an extra barrier to your machine and makes it harder for hackers to.


    > Federico Kerinski is an Uruguayan Systems Engineer, with more than 25 years
    experience teaching at universities, developing and consulting and writing articles
    and course material. He has been using Linux for many years now having installed
    it at several different companies. He is particularly interested in the better
    security and performance of Linux boxes.


    ## Resources


    The knock is at www.zeroflux.org/projects/knock, and you can find the knockd daemon
    documentation at www.linux.net/man/1/knockd, or simply do knock at a console.


    For more on port knocking, check www.portknocking.org/view/ and in particular,
    check view/implementations for several more implementations. You might also check
    the critique at www.linux.com/archive/37888 and the answer at www.portknocking.org/view/about/critique
    for a counterargument on port knocking.


    Read en.wikipedia.org/wiki/Transmission_Control_Protocol for TCP flags, especially.
    At www.faqs.org/docs/iptables/tcpconnections.html, you can find a good diagram
    showing how flags are used.


    Port numbers are assigned by IANA (Internet Assigned Numbers Authority); see www.iana.org/assignments/port-numbers
    for a list.


    To test your system, get amass nmap.org, and also to go GRC''s (Gibson''s Research
    Corporation) site at https://www.grc.com, and try the Shields Up.


    Check www.netfilter.org if you need to refresh your iptables skills.


