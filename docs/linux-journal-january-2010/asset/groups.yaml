    \ DVD。\n\n# 针对 Linux 用户的业余无线电生存指南\n\n常见业余无线电活动概述，以及关于如何使用 Linux 系统和免费软件参与其中的信息。\n\
    \nDAN SMITH\n\n维护一个仅运行 Linux 的家庭每天变得越来越容易。有大量的人致力于从其他操作系统环境移植或重新实现桌面及通用软件，这有助于保持进程的持续进行。遗憾的是，享受一项主要由\
    \ Windows 用户主导的爱好，并没有那么容易。业余无线电的文化是一种充满实验精神并反主流的文化，但推动创新的人数相对较少，而且他们是在自己的舒适平台上进行新的，而这通常意味着\
    \ Windows。因此，许多应用程序无法在 Linux 上运行。在本文中，我将介绍进入业余无线电世界的 Linux 用户可能感兴趣的某些基础任务，而无需改变生活方式。首先，对于不熟悉一些常用无线电术语的人，这里有一个快速的词汇课程。\n\
    \nHF（高频）频段是 1MHz 到 30MHz 之间的频率，紧邻美国 AM 广播电波段。得益于高电离层，这些频率的信号能够环绕全球。如果你想与另一个国家通话，这些频段正适合你。\n\
    \nVHF（甚高频）和 UHF（超高频）频段是 30MHz 以上到 3GHz 的频率。该范围内的信号以越来越视距的方式传播，因此主要对局域（VHF）和极短（UHF）通信有用。然而，这些频率也提供了增加带宽和数据速率的机会，这就是为什么\
    \ Wi-Fi 位于高频（2.4GHz）。\n\n# 竞赛日志\n\nHF 上的一项活动是“竞赛”（contesting），它涉及通过建立不同的联系来达成某种目标。这通常涉及在特定时间内与特定区域的多次联系。由于这是一场比赛，所以需要一种日志来记录你建立的联系以便以后提交。业余无线电操作员使用呼号（calls）来相互识别，大多数软件可以帮助识别你是否在位置、天线等之间成功“对通”或获得了奖励。它还能让你了解全球特定部分的信号在一天中什么时间到达你这里，以防你想联系特定地点的人。如果你对这类操作感兴趣，请查看实时地图（见“资源”）以查找现在谁在漫游。\n\
    \n尽管看起来可能安静而荒凉，但如果你从未与世界上至少一端建立过半双连接，除非你手持一个电池和一根电线做过这件事，否则你不知道自己错过了什么！用于 Linux\
