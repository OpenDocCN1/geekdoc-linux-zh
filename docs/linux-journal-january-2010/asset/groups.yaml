    multiple rule sets.


    if you add IPv6 addresses to an interface of IPv4 or a host object in the rules,
    the compiler will use IPv4 addresses of the interface on the IPv4 path and the
    new IPv6 address of the same interface on the IPv6 pass. This principle also applies
    to the mixed groups of addresses and rules and services.


    Let''s see how some simple rules in the combined IPv4+IPv6 rule set are turned
    into an iptables script. The rules are shown in Figure 9.


