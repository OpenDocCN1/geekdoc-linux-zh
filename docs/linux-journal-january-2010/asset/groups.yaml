    # # What’s New in Firewall Builder 3.0


    Firewall Builder helps automate the process of configuring Linux, BSD and Cisco
    firewalls. Firewall Builder 3.0 comes with support for IPv6, branching rules and
    a lot. It will save you time and help avoid errors.


    **Mick Bauer Introduced** Firewall Builder to Linux readers in 2003 with his article
    "Using Firewall Builder". A lot of time has passed since 2003, the project has
    evolved, the appearance of the GUI has changed and many features have been added.


    Open-source firewall implementations have gained momentum in recent years and
    now offer a viable alternative to commercial systems (Netfilter, PF on OpenBSD
    and FreeBSD, and iptables and nft). These implementations include iptable features
    sets, but provide only command-line interface and plain-text configuration files.
    The syntax is often complex and different between the different tools, and different
    from different firewalls Administrators need to understand the structure and logic
    of the given firewall system in order to design and maintain a configuration with
    the required


    switching between different languages leads to errors. Coordinating changes across
    multiple devices in the network becomes difficult and risky. When a new service
    is added, administrators need to implement the same policy rule using different
    languages for different devices.


    Administrators have to become experts in all platforms to be able to make the
    same change anywhere. An error leads either to service downtime or a hole in the
    security policy, and can be costly.


    Modern operating systems often operate on a network built with products from different
    manufacturers. Even there is usually the need to configure access lists on routers
    and on firewalls, which are often products of a different vendor


    # ## Complex configurations and the need for the administrator to be aware of
    the internal packet flow in the inspection engine make management of these firewalls
    difficult.


    One of the ways to help the situation is to use automated generation of the configuration.
    Several systems and open-source projects try to tackle this problem. Automatic
    generation of configuration can handle manual processes. Systems transform configuration
    as a combination of data-based objects, or projects in an abstract way. Administrators
    work with such tools, but they do not have to know the difference between the
    configurations of different vendors in order to implement the same rule; they
    just work with the abstract firewall all the time. Firewall Builder implements
    this approach to generation of firewall.


