  mdcn: "\n\n## 深入解析\n\nbind-utils。要制作一个 LAMP 设备，运行 `yum install http php mysql-server`。重启或在\
    \ Webmin 内部刷新模块，你将看到所安装的任何软件的 Web 管理界面。Webmin 开箱支持广泛工具，而且 Webmin 网站上还有更多扩展模块可用。\n\
    \n对于我们的示例，让我们创建一个 MySQL 数据库服务器设备。要自定义您的基础设备，请在虚拟机内部运行以下命令：\n\n```\nappliance-base\
    \ -y install mysql-server\nappliance-base /etc/init.d/mysqld start\nInitializing\
    \ MySQL database: Installing system tables...\nOK\nappliance-base --mysql_installation\n\
    ```\n\n注意：此脚本的所有部分都建议用于生产环境中的所有 MySQL 服务器！请仔细阅读每一项！\n\n输入 root 当前密码（回车）：\nOK，密码输入成功，继续...\
    \ \n正在设置可以在授权的情况下登录 MySQL root 用户的 root 。\n设置 root 密码：[Y/n]\n新密码：\n删除匿名用户？[Y/n]\
    \ \n不允许 root 远程登录？[Y/n]\n重新加载数据库并测试访问？[Y/n]\n重新加载权限表？[Y]\n\n全部完成！如果您已完成上述所有操作，您的\
    \ MySQL 安装现在应该是安全的。\n\n感谢 MySQL！\n\n# 打包与开发设备\n\n接下来，让我们打包您的设备，然后执行将其部署为 `mysql.example.com`\
    \ 的流程。为了准备磁盘镜像配置：\n\n```\nxenhost$ cd /etc/xen/auto/appliance-base\n```\n\n```\n\
    xenhost$ tar -cvfz appliance-base.tar.gz\nxenhost$ mkdir -p /xen/mysql.example.com\n\
    xenhost$ cd /xen/mysql.example.com\nxenhost$ tar -xvf /appliance-base.tar.gz\n\
    xenhost$ mv appliance-base.cfg /etc/xen/auto/mysql.example.cfg\nxenhost$ cd /xen/mysql.example.com\n\
    ```\n\n列表 4 显示了 `/etc/xen/auto/mysql.example.cfg` 的示例配置。设置磁盘镜像的路径，并赋予它此唯一的 MAC\
    \ 地址。将配置放置在 `/etc/xen/auto` 意味着设备将在 Xen 宿主机启动时自动启动。\n\n使用以下命令启动设备：\n\n```\nxenhost$\
    \ create /etc/xen/auto/mysql.example.cfg\nxenhost$ vm console\n```\n\n在虚拟机启动时检查控制台；最后的输出将是\
    \ DHCP-IP。得益于本地地址，可以通过该 URL 使用浏览器；默认情况下，Webmin 监听端口 1000。登录后，你将能够管理您的 MySQL 设备。Webmin\
    \ 还可以显示您的静态 IP、通过更新创建额外的用户、防火墙规则、维护数据库并配置系统。\n\n通过这些简单的步骤和现成的组件，你可以创建一个虚拟设备来完成任何事情。因为它是虚拟机，你可以在物理计算机之间移动并多次部署它。正如引言所述，所有这些步骤可以在\
    \ VMware 中完成。VMware 是应用最广泛的技术，它有自己的创建虚拟设备的工具，以及提供廉价设备的 Marketplace。无论你使用 VMware\
    \ 还是 Xen，虚拟设备都是通过最少帮助部署预配置系统的简单方法。如果您有软件业务，今天就可以帮助您的客户工作环境。\n\nMatthew Jenkins\
    \ 是新泽西科技学院的 UNIX/Linux 虚拟化管理员，他在那里管理该州许多企业。他帮助不同的系统和软件协同工作，通常通过一层 Perl（本地称为 ''）。当没有问题时，通常可以在\
    \ matthewkins@gmail.com 找到他。\n\n资源\n- CentOS: www.centos.org\n- Webmin: www.webmin.com\n\
    - VMware Appliance Marketplace: www.vmware.com\n\n列表 4：`/etc/xen/auto/mysql.example.cfg`\n\
    ```\nname = \"mysql.example.com\"\nmemory = \"256\"\ndisk = \"tap/mysql.example.com/appliance-base.img,vda\"\
    \nvbd = \"bridge:xen0,mac=...\"\nbootloader = \"/usr/bin/grub\"\ncrash = \"restart\"\
    \n```\n7 | 2010年1月\n\n# 结论\n\n# 送出 LINUX 礼物\n\n需要为那位开源爱好者准备礼物吗？送他们一份《Linux Journal》订阅吧！\n\
    \n# 立即订购！\n\n# 正反辩论\n\n# 教育 vs 经验\n\n# 你应该考证吗？\n\n在过去的几列专栏中，我们讨论了从笔记本电脑到文件系统的一切内容。这次的正反辩论涉及了一个技术性没那么强但没那么重要的话题。在当今职场中，更有分量的是，很难强迫某人学习材料，而不是为了通过考试而死记硬背信息。\n\
    \nBILL：我见过一些持证的人，连怎么从一个纸袋里爬出来都不知道。我见过一些持证的人对 DNS 一毫无了解——Kyle 的观点很有道理——证书可能只是一个擅长死记硬背和良好测试的人的指标。\n\
    \nKYLE：事实是，即使你接受了正式的计算机科学教育，通常也只能获得基础知识。大多数 CS 程序似乎都倾向于管理系统管理，而且我认为，当你需要掌握入门门槛很高的技术时，培训确实非常有用。大多数人不需要购买一堆昂贵的设备或许可证，他们可以在家里学习。在这些情况下，正式培训是在人们实际开发这些技术之前，让他们进入该领域的好方法。当你雇佣了具有你\
    \ 90% 所需经验的人时，这非常有用。让他们获得证书可以是快速使他们达到 100% 水平的办法，这样他们就可以学习剩下的部分。他们努力跟上，但很难让学术课程跟上技术的步伐。当你进入职场时，你必须学习技术的特定方面，要么通过在职培训（如果你能得到的话），要么通过特定的认证。虽然\
    \ Bill 和我同意没有什么能比得上经验，但如果你还没到这里，如何获得经验呢？证书这类东西可以作为你能力的一种想法。我雇佣了另一位没有证书和经验的员工，但在他的简历上，我给了他面试机会，他并没有表现糟糕。他最终很好地管理了我们的团队，我们在相当一段时间内取得了良好、成功的成果。\n\
    \n这就是我，但作为招聘经理，我会直接跳过证书。真的，我会扫一眼那里，直接跳到最后的经验和技能。证书在某些情况下可能被有用，但我更倾向于在我的员工中招用通用型人才。\n\
    \nKYLE：我想那对我来说很幸运，因为我在查看简历时没有任何任何证书。关于证书，这真的取决于职位是什么以及证书是什么。如果你在行业内工作了一段时间，不可避免会遇到一个持有证书但对该主题一窍不通的人。这意味着证书是坏的吗？不一定。它突显了。\n\
    \nBILL：你关于获得经验的观点很有价值；然而，记得我一位同事没有 SAN 培训，但在很长时间内都表现良好，后来还架构了 EMC 解决方案。我支持通用型人才的观点，拥有良好头脑和坚实的故障排除方法的人可以解决任何问题。我观察过许多资深持证技术人员在被迫面对未知领域的问题时手足无措。\n\
    \nKYLE：嗯，我觉得那个人很幸运，因为他有一个良好的工作环境来提高速度。我必须同意 Bill；我总是对证书持保留态度。但要验证。这就是为什么大多数技术职位会有某种形式的技术面试，这可以让你进入大门，但你必须证明自己。\n\
    \nBILL：Kyle，你被录佣了。我认识你一段时间了，我很清楚你的能力如何。\n\nBILL：那很好。课程往往落后于当前技术，特别是在处理开源技术时，如\
    \ Linux。其他开源技术也受到这个问题的影响，这就是我提到的原因。对于 Linux 证书，务必检查最后更新时间。\n\nKathy 是旧金山湾地区的系统架构师，多本书作者，包括《官方\
    \ Ubuntu Server Book》和《Knacks and Ubuntu Hacks》。他是北方 Linux 用户组的主席-\n\nBill 是硅谷的一位\
    \ IT 人员，和两个孩子住在那里。他太喜欢 Linux 了，他可能还会从中获得更多。在自己的空隙里，他参与了大蒜节，而且他闻起来没有大蒜味。\n\n"
