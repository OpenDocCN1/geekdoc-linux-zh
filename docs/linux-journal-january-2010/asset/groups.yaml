    当我们在活动前没有调整跟踪器设置时，这可以提供帮助。在用现代跟踪器进行显示时，“东西没坏就不要修”的旧方法确实有效。除非万不得已，否则不要触碰运行良好的跟踪器。


    Xastro 在纽约市曼哈顿也得到了有效应用。我喜欢它即时且引人注目的战术显示。当它们没有其他用途占用时，你会看到它们在不断增长。


    Xaric 战术标志为我们提供了类似的优势，为现场分配 TEAM 1、HELO 2、DOGTEAM 3 以及类似的代号。Xastro 增加了特殊功能以支持
    SAR（搜救）行动。


    # 资源


    - Xastro 主页: www.xastro.com

    - 映射列表: lists.xastro.com/main/list-info/

    - SourceForge: sourceforge.net/projects/xastro

    - Soundmark Wiki: www.xastro.org/index.php/How_To_Sound

    - AX-25 Wiki: www.xastro.org/index.php/How_TO_AX_25

    - SAR 页面: aws.aprs.com/~/axter/SAR_main

    - APRS 信息: info.aprs.org

    - ARRL: www.arrl.org

    - 练习测试: www.qastro.com

    - 海军学院无线电俱乐部 2008 年陆军对抗海军足球跑实时跟踪页面: www.aprs.org/football

    - 为从安纳波利斯理工学院前往海军学院的跑步者拍摄的头盔中原始 GPS 跟踪器的照片: www.usna.edu/Users/aerobrun/football

    - 1993 年 APRS 跟踪足球跑: www.usna.edu/Users/aerobrun/football


    # Xastro 的未来


    Xastro 从一个仅限 Linux 的应用程序，其容量有了显著增长，但仍然受限于 OpenMlist 或用于列表的多线程和多进程程序。开发者们讨论过将 Xastro
    拆分为 SQL 数据库，该数据库现在支持多个客户端来处理用户界面组件。此类客户端使用不同的组件集，如 GTK+, Qt-Widgets，从而与日常工作更好地整合。重写以移除
    X11 层可能允许在 Qtopia 嵌入式设备上进行路由。无论如何，当我们重构 Xastro 时，随着基础功能和有用功能的添加，它有一个光明的未来。会议上见！


    请注意 Open Group 的会议 Wiki 标准工作、OST!、UNIT 以及 "X" 案例，以及 TOGAF 和 Boundaryless Flow
    是 Open Group 在所有其他国家的商标。


    # 示例：西雅图马拉松


    对于西雅图马拉松，(我) 坐在网络控制车内，负责“路线”和“起点/终点”风险区域。Xastro 运行在一台开启了网络的笔记本电脑上，供无线电操作员访问和显示以查看活动地图。Bob
    Donnie (KDNMA) 有一个在起点跟踪器附近从没离开几里的台站。Xastro 分配了战术图像，例如起点或马拉松开始时的 SAG。


    - 我听取来自无线电操作员的接跑步者信号，并向 Bob 报告实例。

    - Bob 然后通过无线电派发车辆（SAG 车辆）去接跑步者。所有 SAG 的位置都会出现在我们的地图上。


    SAG 车辆无法横跨赛道，让它们到达特定位置非常困难。地图显示 Bob 需要访问我们需要接跑步者的车辆——必须知道如何使用这些车辆。西雅图被这项活动一分为二。


    我们在全马拉松和半马拉松赛目的领先车辆上放置了跟踪器，因为这些电动车辆到为止已完成任务。如果这些跟踪器不可用，我们必须在无线电网络上显示并创建对象呈现在地图上。对于饥饿的狗和可以使用追踪的跑步者，我们有相同的备用计划。


    活动组织者使用追踪信息来支持终点的需求，而我们使用这些信息让志愿者了解最后跑步者的接近。志愿者随后会将此信息与马拉松其他区域的参与者分享。他们不会在一天结束后独自留在赛道，并让我们知道何时开放街道以及挑选志愿者和设备。


    > Cuth. Webster，在 20 世纪 80 年代中期接到一个电话；来自单通道接口和自定义组装的仅接收站。他正在寻找并清点完成的任务。Baxter。Smartmap
    和 ghost 运行中。他的兴趣是在他的孩子们跑步时进行手工操作。他是 www.aprs.com 上一个丰富的业余爱好者，并在 APRS 上使用 WEPT-35。他也在
    WNRS 和 APRS 列表中。


    Steve Stroh。20 世纪 80 年代后期通过业余无线电在 Packet Spot APRS 无线电网络 (WINET) 上使用 TCP/IP。他已经离开了那些盒子。Steve
    使用了基于数据包系统 (Linux) 的无线电互联网接入。


    Laura Sheriff 学过工程，但更倾向于用任何编程语言编写软件。她为每个项目提供帮助，并且可以说非常喜欢解决没有别人发现的问题。她依靠铁丝或胶带进行固定，因为这两者都很稀有。Laura
    与她的丈夫和两个女儿在一起，可以在 www.ret-website.com 找到她。


    www.linux.com 2010年1月 | 55


    # # 使用数字业余无线电 DIY


    业余无线电操作员通常是思想自由的人，他们不介意为了完成任务而弄脏手。我们中的许多人不会考虑花费数百或数千美元购买一台全新的无线电，并打开盖子看看是否可以对其进行改装。我们不需要费力就能找到无数关于如何改装不同业余设备的文章。因此，我们对所使用的软件有同样的感觉并不意外。


    开源软件和业余无线电是天生一对。如果一个无线电设备带有一份说明不能修改它的许可证，很少操作员会购买，看到为什么我们很多人倾向于源代码和 Linux 也是很自然的。我的个人计算历程经历了：
    1990 年的 DOS，1993 年的 OS/2，1998 年的 Windows 以及从 2000 年起的 Linux。我自学了如何在 DOS 中编写批处理文件，然后开始尝试
    C，最后是 C++。然后，在学习了如何使用那些大学级别的课程来找回正确的方法后。这就像 IBM 在 20 世纪 90 年代后期杀了 OS/2。我对 Linux
    感到舒适，但在过去的四年里，它一直是我的操作系统。


    开源软件和业余无线电是天生一对。如果一个无线电设备带有一份说明不能修改它的许可证，很少操作员会购买，看到为什么我们很多人倾向于源代码和 Linux 也是很自然的。我的个人计算历程经历了：
