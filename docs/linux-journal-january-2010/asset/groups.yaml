    in the features directory.

    If my new scenario appears as before—I pass through the step definitions or fixing
    bugs in the code to catch the steps part. But, Cucumber is a bit slow to use if
    it has to run all the features and all the scenarios. So, you can run Cucumber
    manually, unlike Rake:


    ```

    cucumber features/login

