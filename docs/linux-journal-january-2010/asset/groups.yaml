    # NEW PROJECTS


    ## Fresh from the Deep


    Danger from the Deep


    dangerdeep.sourceforge.net


    If you remember last month''s column, I was excited about a particularly cool-looking
    submarine simulator, Danger from the Deep. This month, I''m proud to feature it
    as one of the main projects. To its Web site, requirements, you''ll need the following:


    - An OpenGL 1.5-compliant graphics card (OpenGL 2.0 or greater is recommended).

    - 256MB RAM (512MB is recommended).


    ![](img/9f8eb2f23eddae840f8630deba43fac9_43_0.png)


    Danger from the Deep (known as dangerdeep or Dfd) is a (free) open-source World
    War I submarine simulator... which is planned as a lasting simulation and will
    improve as our time and knowledge of physics allows. Its current state is alpha,
    but it is playable.


    The Web provides a lovely binary installer that feels like that of a commercial
    game. You can compile the game from source if you want, but would you really do
    that when you simply click Next, Next...


    The binary installer runs mostly by itself, but as is the usual way with these
    things, you need to flag it as executable. If you''re running this through a file
    manager, you probably need to right-click and choose executable in which properties
    is available, but I''ll leave this up to you. For those who prefer to run things
    from the command line, you can flag it as executable with the following:


    Ah, authentically! Don''t speak German? Too bad! The controls stay that way, whether
    you like it or not (which I do).


    Dfd is currently being developed on Linux (i386 and AMD64) and Windows. There
    are binaries for Linux (i386 and AMD64) and Windows (32-bit), as well as some
    old packages for Mac OS. The Deep makes use of SDL/OpenGL and, thus, should be
    portable to other operating systems or platforms.


    ![](img/9f8eb2f23eddae840f8630deba43fac9_43_1.png)


    Sometimes the environment can be quite beautiful, as this sunset, which makes
    hours in a sub much easier to bear!


    Dfd has been reported to work on Windows (2000/XP, 98), Linux (i386/x86-64/SPARC)
    and BSD (i386-64/SPARC/i64).


    ### Installation in terms


    ![](img/9f8eb2f23eddae840f8630deba43fac9_43_2.png)


    Authenticity and realism are almost taken to extremes, and these touches like
    that quarters really get you into the feel and atmosphere of the game.


    Usage: As soon as you''re at the main screen, you''ll be feeling a wave of romantic
    nostalgia that never lets up! From the sea-coupled controls, German-labeled controls
    and background imagery to the wacky WWII-era music, this game wins its heart on
    its soul.


    ```

    $ chmod +x dangerdeep-0.3.0-linux-installer.bin

    ```


    Then, run the installer with:


    ```

    ./dangerdeep.bin

    ```

    (Note: do not run as root or sudo if you''re installing it system-wide. The installer
    will go through the usual Next, Next, Next...Finish, and once it''s done, run
    the game with:)


    ```

    $ dangerdeep

    ```


    Assuming you have a decent graphics card, you''ll want to check the reception
    in the Options menu, and the graphics are actually quite impressive. Because this
    game is currently in alpha, the stage number of missions are limited. Nevertheless,
    several kinds of missions are available in single-player mode. For wanting something
    to blast from the get-go, try Historical Mission first under the menu Play single
    mission.


    Before you embark on voyages, however, I suggest you print out the game''s PDF
    manual, which is downloadable on the Web site. This game''s controls are extensive
    (you''re not), and each key is often assigned to switch between different view
    modes. Here are some basic universal controls to get you started.


    I''m always on the lookout for original projects, and this particular application
    really took me by surprise. According to its Web site, "Flinks is a text-mode
    flashing web browser. It is intended for speed reading and/or skimming pages and
    text".


    F1 through F12 will give you a better view of function on the ship. Some keys
    bring you to actual locations within the submarine, such as the room and quarters,
    and others bring up equipment, as the ship''s personnel panel is the control on
    F1 and flashing screen on F6.


    Martin Bart, the author of the project, was inspired by a mobile-phone program
    that flashed once on the screen—at speeds of 600–700 words per minute (WPM) after
    a few days of practice. Intrigued by the idea and put off by the thought that
    such a project cost $20, Martin simple about making Flinks version 2.4 or later,
    along with a working version of Lynx.


    The dials are in German, as far as there''s no need to have them in English, so
    you''ll have to find out what Feedback and Lagewagen mean on yours.


    Installation: Flinks and running is very easy, because no real installation is
    necessary, and its dependencies are minimal. Although I can''t really demonstrate
    the effect on printed page, Flinks rapidly flashes individual words of the other
    page in rapid succession to help train your brain for speed reading.


    Now, I''m at this stage where you''ll keep to blast on storm, let''s keep count.
    You may want to try for yourself, as it makes the above-water enemies to spot
    using more modes, but it also shows some of the cool graphics this game has.


    Download the latest from Web site, extract it and open a terminal in the new folder.
    The command line, enter:


    ```

    $ flinks

    ```


    Press the S key to switch, and when you''re up there, have a look around various
    view modes (check out that for starters, and yes, you can man surface search).
    If a target is somewhere in sight, press T to identify the target. Pacing the
    space bar lets you select it, and fire.


