    \ | DEEP\n\n# INDEPTH\n\n60 WHAT'S NEW IN FIREWALL BUILDER 3.0\nVadim Kurland\n\
    \n![](img/9f8eb2f23eddae840f8630deba43fac9_5_0.png)\n\n# DATA STUDIO\n\n41 AQUAFOLD'S\
    \ | DATA STUDIO\n\n![](img/9f8eb2f23eddae840f8630deba43fac9_5_1.png)\n\n# Next\
    \ Month\n\n# DESKTOP\n\nIt may be getting cold, but the Linux desktop just keeps\
