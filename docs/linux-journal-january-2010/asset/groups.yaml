    \n# CONTENTS\n## JANUARY 2010\nIssue 189\n\n![](img/9f8eb2f23eddae840f8630deba43fac9_3_0.png)\n\
    \n# FEATURES\n\n## AMATEUR RADIO\n\n46\nAN AMATEUR RADIO SURVIVAL GUIDE FOR LINUX\
    \ USERS\nA getting-started guide for Linux users looking to venture into the world\
    \ of Amateur Radio.\nDan Smith\n\n50\nXASTIR—OPEN-SOURCE CLIENT FOR THE AUTOMATIC\
    \ PACKET REPORTING SYSTEM\nPlotting Mars Rover locations on a detailed map, easily\
    \ done with Linux. You bet!\nCurt E. Miles, Steve Stroh and Laura Shaffer Mills\n\
    \n56\nROLLING YOUR OWN WITH DIGITAL AMATEUR RADIO\nAmateur Radio and open source—a\
    \ heavenly match.\nGary L. Robinson\n\n+ ON THE COVER\n* LINUX SECURITY CHALLENGES\
    \ FOR 2010, P. 26\n* MAKE YOUR OWN SOFTWARE APPLI, P. 72\n* GET STARTED WITH AMATEUR\
    \ RADIO, P. 46\n* HOW TO USE KASTIR, P 50\n* PORT-COORDINATOR: EDUCATION VS. EXPERIENCE,\
    \ P. 66\n* PORT-KNOCKING SECURITY WITH KNOCK, P. 66\n* NEW FEATURES IN FIREWALL\
    \ BUILDER 3.0, P. 66\n\n2 | january 2010 | www.linuxjournal.com\n\n# MPLS for\
    \ the masses\n\n# $39\n\n![](img/9f8eb2f23eddae840f8630deba43fac9_4_0.png)\n\n\
    Usually MPLS routers cost more than $1000, but not anymore. MikroTik gives you\
    \ the ability to use MPLS in any network. No more big bad prices for MPLS! A chicken\
    \ in every pot!\n\nMPLS stands for Multi Protocol Label Switching. It can be used\
    \ to replace IP routing - packet forwarding decision is no longer based on fields\
    \ in IP header and routing table, but on labels that are attached to the packet.\n\
    MPLS makes it easy to create \"virtual links\" between nodes on the network, regardless\
    \ of the protocol of their encapsulated data. It is a data-carrying mechanism,\
    \ highly scalable, protocol agnostic, MPLS allows one to create end-to-end circuits\
    \ across any type of transport mechanism, using any protocol.\n\nFeatures:\n\n\
    - Label Distribution Protocol for IPv4\n- Virtual Private Lane Service\n  - VPLS\
    \ LDP signaling\n  - VPLS MP-BGP based autodcovery and signaling\n  - split-horizon\
    \ bridging\n  - RSVP TE Tunnels\n  - explicit paths\n  - CSPF path selection\n\
    - OSPF extensions for TE tunnels\n- Virtual Routing and Forwarding\n- MP-BGP MPLS\
    \ IP VPN\n- OSPF and RIP as CE\n\nBenefits:\n\n- higher speed forwarding\n- ability\
    \ to implement L2 and L3 VPNs (VRF)\n- reduced overhead compared to legacy tunneling\n\
    - ability to implement QoS\n- separate tunnels for voice, video, or data\n\nMPLS\
    \ allows one to create end-to-end circuits across any type of transport mechanism,\
    \ using any protocol. The RB750 costs $39.95. with Atheros CPU, five ethernet\
    \ ports, plastic case and PSU. With MPLS, RB750 is capable of 10000 packets up,\
    \ with 8000 packets smaller.\n\nMikTik routerboard\n# www.mikrotik.com/mpls\n\n\
