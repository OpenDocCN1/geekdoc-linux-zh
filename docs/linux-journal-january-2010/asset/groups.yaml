    As I mentioned previously, you can use Cucumber to test models and controllers,
    and not just for integration testing. My personal preference is to use Cucumber
    in this way, however, it provides a nice, user-side perspective on things and
    lets you test the site as a user


    Well, it tests the site as a user, but with one large caveat: Webrat is a great
    tool, but it doesn''t support JavaScript. It means if your site is a great deal
    of AJAX and JavaScript, you will not be able to test it with Webrat. You can solve
    this problem by using Webrat to include textual links in your application and
    by using external testing systems, such as Selenium or Celerity. But then you
    have to find a system that is easy to integrate, reliable and runs seamlessly.


    The fact that Cucumber is slow is a bit of a drawback; it can take quite while
    to run through


    all of the scenarios in a large application. One solution is to use Cucumber''s
    tag feature, which allows you to give one or more tags to a scenario. Then you
    can run all the scenarios with that tag, across environments.


    If you want to avoid hitting the database time you create or update (it) object,
    you can integrate a factory (for example, Factory Girl) with Cucumber. This can
    speed things up, as well as give you a great deal of flexibility in creating scenarios
    and testing your application.


