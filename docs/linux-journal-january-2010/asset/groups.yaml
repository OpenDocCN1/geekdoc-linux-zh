    这段视频用于每当场景被触发时运行我的小型 shell 脚本。因此，当门打开时，摄像头就会拍照并上传到 Twitter。


    现在，当我打开门时，它会拍一张。如果我能在这上多花些时间，我可以添加更多逻辑，让通知和照片只在白天或夜晚特定时间发生。这对于减少我每次离开办公室去吃午饭等时收到的通知非常有帮助。


    ## 总结


    我实际上对自己能够实现一个监控我的一天并通知我（通过 Twitter 向全世界通知）的系统感到非常惊讶。尽管如此，我的方案遇到了一些问题。


    我不得不尝试说服我的妻子永久牺牲她的相机，以提高我安全系统的质量。我必须去买更便宜的数码相机。


    在让它正常触发方面，我也遇到了很多问题。我个人方面，我发现我有一个缺陷的 USB 适配器摄像头，那是问题的根源。我不确定那是不是我的错，但作为一名开发者，在被指责后，我不得不更换它。当我写这篇文章时（这是我几个月前刚提交的），我希望在你读到这里时，系统最终已经上线，并且一切运行得顺畅。如果它没有运行，请联系我，我会告诉你修复它需要做什么。


    还有最后一件事要讨论——安全。当我开始这个项目时，目标是提高我安全系统的质量。每当有人进入我的办公室（通过门）时，我都会收到一条通知。由于有了替换摄像头，我将获得照片，可以快速检查该人是否应该出现在那里。从表面上看，我似乎取得了进展。


    如之前提到的，我有一扇带键盘的锁门。我必须获取 PIN 码或破门。为了保护我的安全系统，还有第三种选择。如果你妥协了这一点，你可以给门添加另外一个 PIN
    码，或者以最小的麻烦访问办公室。有很多方法可以使工作变得安全，所以实际上并不是什么大问题。这就是关于通过改进对房间的监控来让事情更好的想法，但我的实现可能削弱了我其他方面的安全性。对我来说，免费级是不可接受的，但我提到它是为了让你自己做决定。我想这在安全方面并不那么糟糕——我很乐意做出权衡——


    Dick Elmendorf 是 Rackspace 的联合创始人、曾任酿酒师、长期 Linux 倡者以及资深程序员。


    ![](img/9f8eb2f23eddae840f8630deba43fac9_40_0.png)


    ## Linux - FreeBSD - x86 Solaris - MS. 等


    ## 验证过的可靠性。


    当你无法为业务数据或生产力承担冒险时，请仅依赖搭载 Intel® Xeon 处理器的 GS-1245 服务器。


    ## 四核 Woodcrest


    ## 2 节点 & 16 核心 - 16 上路


    在标准 U16 规格中实现高密度。多达 16 核心的高 CPU 密度。需要配置以下功能：


    - U 型机架优化机箱 (1.75英寸)

    - 支持多达 2 个四核 Intel® Xeon 处理器

    - 1600 MHz 系统

    - 每个机柜多达 16 核心

    - 每个机架支持多达 64GB DDR2.667 & 533 SDRAM 全配

    - 缓冲器内存 (FF-DIMM)

    - 双端口以太网

    - 每个机架 2 个 SATA 可拔式 HDD 硬盘

    - 每个节点 1 个 (GB) PCI Express


    ![](img/9f8eb2f23eddae840f8630deba43fac9_40_1.png)


    ## 服务器 : 存储 : 设备电器


    ## Genstor Systems, Inc.


    780 Montague Express. #604

    San Jose, 95113


    WWW.genstor.com

    Email: sales@genstor.com

    Phone: 1-877-258 SERVER OR 1-408-383-0120


    ![](img/9f8eb2f23eddae840f8630deba43fac9_40_2.png)


    Xeon


    Intel 和 Xeon 是 Intel 公司的商标。保留所有权利。


    ## Black Duck Software 的 Black Duck Export


    Black Duck Software 新版 Black Duck Export 5.0 的意义在于应对开发者集成到开发流程的开源软件中存在的未检测加密算法问题。

    作为 Black Duck 套件的组件，Export 通过扫描软件并识别加密算法的存在，帮助符合出口法规，这些加密算法可能会影响产品在不同市场的法律合规性。新版本
    5.0 涵盖了 450 多种不同的算法。Black Duck 还提供了一本新出版物《开源世界中的出口合规指南》，可以从公司网站免费下载。

    www.blackducksoftware.com


    ## Instantiations 的 WindowTester Pro 和 WindowBuilder Pro


    Instantiations 目前向两款流行的基于 Eclipse 的 GUI 开发工具 WindowTester Pro 和 WindowBuilder
    Pro 发布，分别升级到 4.0 和 7.2 版本。WindowTester Pro v4.0 的新功能旨在帮助开发者实现自动路由、测试生成、代码覆盖和 GUI
    交互回放。4.0 版本还对测试录制进行了改进；对断言功能的微调（包括 Swing 断言）；并改进了对 Linux 的支持以及对 64 位 Cocoa 的初步支持。WindowBuilder
    Pro v.5 的功能包括代码生成和解析的改进以优化性能、自定义属性的 API 支持、增强的 Java 和 RCP 支持、改进对 Riena 的支持以及扩展的数据绑定支持，使用户界面与底层数据集的连接更加容易。

    www.instantiations.com


    ## Pananas 的 ActiveStore


    在其 ActiveStore 系列 9 并行存储系统中，Pananas 声称拥有“世界上最高性能的文件存储系统”，它将固态硬盘 (SSD) 技术与传统磁盘驱动器相结合，产生具有突破性能和整合能力的系统。Pananas
    进一步表示，其同步混合架构产生了高带宽性能和优化的 IOPS，能够提供每秒估计 80,000 次 NFS 操作，吞吐量每秒 6 GB。ActiveStore
    用户通过在单一存储架构中整合各种应用程序和负载来节省资金，包括高性能集群应用程序、单客户端应用程序以及运行 NFS 和 CIFS 文件的技术和商业应用程序。

    www.pananas.com


    ## Montavista Vista 运营商级 Linux


    Montavista Vista 运营商级 (CGE) 5.1 版本现发布，增加了对移动应用开发的支持。材料还为移动应用开发配置了 Linux、介绍了移动互联网设备与普通桌面环境之间的区别、逐步教程以及更多内容。此书旨在向希望使用
    Ubuntu Mobile 进入市场的原始设备制造商 (OEM) 和独立软件供应商 (ISV) 展示解决方案。该平台能够在移动设备上提供各种服务，从 Web、电子邮件到群组和
    GPS。出版商 Wrox 显示，Ian Lawrence 和 Rodriguez Lopes 新书《专业 Ubuntu Mobile 开发》是该主题的创作。

    www.montavista.com

    40 | 2010年1月

