    # Who Goes There?

    Adventures in Amateur Security


    > “Firewalls are a hardware solution to a software problem.”

    —Someone at ShmoCon


    The situation: I share an office with my brother. This office is in a suite of
    offices that we share with another company. Sometimes I work from home; sometimes
    I haven''t been in the office for the past few weeks because of a motorcycle accident
    I hope to be recovered by the time you read this—but if I had some sort of basic
    security system that could tell me people entered my office and, if possible,
    show me a picture of who they were.


    The Front Door

    The first thing I did when I moved in was upgrade the lock to my office. This
    was actually more about laziness than security. I get a keypad lock so still


    It would be great if I had some sort of basic security system that tell me people
    entered my office and, if possible show me a picture of who they were.


    could even in if I forget my keys (or need someone else to get something for it
    I wasn''t there). When I went shopping, there were a lot of locks from which to
    choose. One that really caught my eye was Lagrange Wireless Keypad. This was a
    keypad lock, but it also included Z-Wave support. Lagrange had an add-on version
    and a controller. The kit included a wireless hub and a starter. It didn''t seem
    a terrible deal until I realized the included hub required a monthly service fee
    to use, which turned me


    I figured there might be a way to control it from Linux. If I could do that, I
    could meet my first goal—alert when someone entered. I''ve used X-10 for a long
    time, and it was always pretty to


    script from Linux. If it turns out, Z-Wave would be the same, but then it is more
    complicated (I guess I shouldn''t be surprised, and it is much more advanced than
    X10).


    Under Linux, there are two paths to Z-Wave access (www.linuxmce.com). This project
    is a lot more management than an alone and security system, all built on Kubuntu.
    In order to access Z-Wave from it, you need a Z-Wave dongle. While several supported
    dongles (github.com/fernaliana/rouhouse) lets you use script Linux from Linux,
    which adds another condition right up my maybe.


    The second path to Z-Wave is the Vera Casa Verde (www.micasaverda.com). I learned
    about this product in the 2009 issue of L (www.linuxjournal.com/article/10302).
    As I already mentioned, I''ve used (stretched) with X10, and the Vera seems a
    solution that would be more reliable and accessible to my other family members.


    Choosing a path is hard. Linux path tempting using the least amount of hardware
    and the most of software (which favors my skills). But, I chose deployments. I
    don''t run Kubuntu, so I set up an old office box or a virtual machine on my workday
    (and maybe using the Z-Wave dongle). The Vera box uses little entry, and thus,
    does not give much heat—that is always a concern here in Texas T. I decided to
    start with the Vera and I always could fall back on the Linuxmce.


    Setup

    it turned on and set up the Vera. A handy guide on the Wiki (www.micasaverda.com/index/Schlage_Lock)
    walked me through the process of


