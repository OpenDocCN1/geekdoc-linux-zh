    ## Getting an Amateur Radio License


    Licenses have been limited to three: Technical, General Class and Amateur Extra.
    Each license grants privileges, mostly in the first.


    The entry-level Class allows you to participate in the APRS-net work described
    in this article with many privileges.


    Many people imagine Amateur Radio operators as guys sitting in the basement in
    front of a radio with glowing tubes, tapping on a Morse code key.


    The good news is that Morse code is no longer a requirement in the US. Tubes have
    been replaced by transistors, embedded processors and software satellites in orbit,
    had degenerators on the international space station (and expired MIR, DME and
    EVE signal sources). It''s not your grandpa''s ham radio anymore!


    Many barriers to getting a license have been removed. They are no longer given
    by the FCC field officers, but by volunteers. In large urban areas, there are
    multiple places to test each month online (try www.arrl.org and others).


    For more information about Amateur Radio, and where to find testing in your area,
    go to www.arrl.org and click on.


    Note: The information above is general. Each country has a body governing Amateur
    Radio and a national Amateur Radio organization. Contact your organization or
    regulatory body for specific details regarding Amateur Radio licensing in your
    country.


    ## How to Use Xastar


    First and foremost, sign up on the Xastar users list (Resources). Many well-experienced
    users and a few of the regulars have hanging out. Posting a request, sign up before
    you need it and "dummy" sessions. Even if or relearn a bit, we are not harassed
    there.


    Check the Xastar home page (Resources), the "XSTAR Documentation" and "Text docs"
    sections distributed with Xastar. Of course, look in the Xastar source main directory
    or the default install location of /usr/local/share/xastir/ for the text docs.


    Dig in the menu, and you''ll find some SAR-features, as well as useful features
    for police-event tracking. Xastar is great for bicycle, motorcycle and car events.


    For those coming from Xstar, UI-View maps can be converted to our format. Xastar
    helps users in North America, as they often lack access to the free maps we may
    enjoy.


    Though APRS are not used or intended for this purpose, one, when his vehicle was
    stolen, was able to tell police his car''s current location and speed. It does
    some work to explain to the police how you know.


    - We do not support or condone use of properly maps, but there are plenty of maps
    to choose. You can also grab screenshots of maps you use and easily georeference
    them for use with Xastar.


    - For topographic maps from USGS DSG maps, Xastar top code crops the map and stretches
    it into a rectangular shape with drawing. Maps are stitched together into a contiguous
    area.


    - Xastar supports direct or network connection to stations, GPSES and TNCs. Several
    coordinate grids/systems like UTM/MGS, USNG, Maiden grid and multiple latitude/longitude
    formats. A Coordinate Calculator is included that converts between them.


    - Menus appear in any of seven real languages and five "not real" languages. Cut
    out a bit of heat from developers for adding those five "languages", but you know
    beefing features yields some interesting results!


    Figure 3. Xastar Weather Alerts (Map Courtesy of National Weather Service)


    ## Equipment Needed for Xastir/APRS


    1) Minimum requirements: a live Linux environment (or another Unix/Linux-like
    operating system) and Xastir.


    2) Adding Radio to the tnc: Linux, a soundcard, a computer-connected radio, or
    a valid ham radio and Xastir. It is possible to configure the setup with or without
    the AX.25 linear interface.


    Note that it''s completely legal to own Amateur Radio equipment without an Amateur
    Radio license, as long as you use the equipment only to receive on APR Radio frequencies.
    This community is capable (and wanted) to help down troublesome rogue transitions,
    and the FCC has a fact on prosecuting speculators.


    3) A more reasonable station: Two-meter radio and a valid antenna. Again, you
    can configure with the Xastir AX.25.


    To build a portable or mobile tracker, many options exist that don''t involve
    carrying a full-blown balloon. Go to aptrs.net, and click on Hardware to see options.


    If you have Internet connectivity, go to Map=Mapper, click on Online Tiger, then
    click OK. If you''re located in the US and zoomed in sufficiently, then Tigergap
    maps may appear.


    If you don''t have connectivity or are moving libraries to match maps, use map
    formats like ESRI Shape. A map of the world in ESRI format is ideal.


    Hint: Start Xastir from an to catch error and messages. Click Edit->Map Map to
    import your address.


    You will probably want to select weather stations, weather and the location. Go
    to Interface->Interface Control. Click Add, then OK. Click OK again. You will
    need a Internet Server to use the Interface Control dialog. Click on that and
    Properties. Enter server and port information into the form. Try rateport 1458
    with speed 960 which causes reports for all stations within 600km to appear on
    the map.


    Run this script to get Shapefile maps for your area:


    ```

    xastir/scripts/getHws

    ```


    Run Xastir for the first time, and follow the Interface->Configuration dialog
    to enter your location and choose a symbol that will appear on your maps. Some
    people have special preferences, so if you want to ask please lean on one.


    Visit the File->Defaults date node. Note that your height is not above sea level
    (ASL), but above average terrain (HAAT). Curt once at 150 feet ASL as to surrounding
    hills, but the protocol doesn''t allow for negative HAAT; figured no how would
    live under such conditions!


    A few special keys include HOME (the centers on your map or house), PageUp/PageDown
    (zoom keys), and keys (pan keys). Toggle buttons at the top of the first page
    to show these functions also:


    ## Transmit Paths


    The AX.25 protocol has multiple slots for the header of each packet. One packet
    flows out to X gates in all directions. Currently detected packets include WIDG-W-2
    and WIDG-W-1. WIDE-4 for one mobile stations. If you give him two taps out without
    using WIDE-1 as anything then the first call sign in the fills as well as your
    map.


    By following the above (currently North American) recommendations, the reality
    national networks for your count-the above recommendations may not apply to your
    situation (and option), up to the problem, which defines helps others.


    For ''fin-tin'' types, there special call paths exists for the end of your packet
    to be kept from getting to the Internet. These cases are respected by most ignore
    software.


    ## Tactical Calls for Special Events


    A very useful addition to Xastir is the capability to attach call signs to stations
    and to transmit them across RF or to other APRS clients (Xastir and APRS+SA) are
    the only ones that currently decode and display tactical calls.


    We added this capacity just prior to the Seattle Marathon in November 2000 and
    2008 to get effect for it. It allowed us to assign call signs helping in the event,
    without having to change their tracker configurations.


