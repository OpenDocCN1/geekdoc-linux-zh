    --force-overwrite

    curl -u "USERNAME:PASSWORD" -F password="PASSWORD"

    -F "Message-Input Cam''"

    https://media.org/tmp/twpic.com/api/UploadPost

    ```


    (Replace USERNAME/PASSWORD with credentials.) Now that I have the camera happening,
    I just needed to connect to the open door. I found some people needed a logfile
    (which for firmware has changed to /tmp/log/muxLuaUpload.log). That would be if
    I needed a word of what after happened. Instead, I wanted the camera to work on
    as. This turned out Mi Casa has a search function for the Lua-based interface
    to the system. It allows you to do some pretty advanced scripting. In my case,
    I only needed to add a button for Luop loop. I put my script in /root/upload/upload.sh.
    I already created had a button for Luop loop. But, in this case, Lua expertise
    wasn''t really needed. I simply ensured:


    ```

    os.execute("/root/upload.sh > /dev/null 2>&1")

    ```


