    # 介绍 Xastir


    想象你的笔记本电脑上有一个地图显示，移动的符号代表着你业余无线电朋友和熟人的当前位置，而你也可以可以在他们的屏幕上看到他们的实时位置。想象你还可以给他们任何一个人发“即时消息”。这些只是
    Xastir 功能的一小部分，可以通过少量的设备和初级业余无线电执照来实现（见侧栏）。


    Xastir 是一款开源软件，旨在与 APRS 协议兼容并实现互操作。Frank Giamandra, KC2GJS 为 Linux 编写了第一个业余无线电站跟踪和信息报告系统
    (XASTIR) 版本，并在 GPL 下发布。有了许多开源项目，尽管 Frank 已经从项目中退休，但开发团队已经大大扩展了 Xastir 的原始工作。


    Xastir 可以认为是最强大的 APRS 实现之一，并拥有活跃的社区。


    Xastir 可以在 Linux、FreeBSD、Mac OS、Solaris、HPUX 甚至 Windows 上编译运行。今天，Xastir 可以在基于地图上显示对象及其相关的卫星位置、双向消息站以及更多功能。某些
    Xastir 用于搜索与救援 (SAR)，另一些用于公共服务活动或紧急情况，但许多人只是为了好玩。


    如果你将无线电接口连接到笔记本电脑或台式 PC 中，它可以为你提供附近电台的战术显示，同时提供地图绘制并让每个人知道他们的当前位置，并通过 Festival
    语音合成器发言。


