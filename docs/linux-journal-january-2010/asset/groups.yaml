    配对锁。第一步是升级我的固件。我的 Vera 运行的是 1.0.434 版本，而锁需要 1.0602 版本，而当前版本是 1.039。我去学习了最新版本，心想也许我还能顺便学会用一下
    X10。


    如果你从未用过 X10，那么 Z-Wave 的操作过程简直会让你耳目一新。你不需要去折腾微小的开关，只需推开门并按一个按钮让它进入配对模式。然后激活 Z-Wave
    设备。把门关上并开始连接。如果你正尝试锁定一个 Z-Wave 设备，这要容易得多，也严肃得多。结果是，整个过程要复杂得多。它稍微复杂一点点，但它的信号非常强（这是尝试连接电池供电并处于锁机构内部的结果）。这并没有成为什么大问题，因为我离门不远的地方有一个网络和电源接口。


    门会闪烁，这意味着开始了配对过程，然后让门运行一段编程代码。尝试两次后，我看到了锁上的绿灯。我在 Vera 设备的屏幕上看到了这把锁。接下来的事情应该会很顺利。我点击解锁。似乎没有发生任何事情。事实证明锁和
    Vera 正在通信，它们仍在交换信息——这意味着我的所有消息都已接收。我等了几几后，锁和 Vera 已经完全同步了。


    如果我使用的是 LinuxMCE，路径就不像我想象中那么清晰了。我做了一些研究，没有找到任何人报告过在 LinuxMCE 上使用锁。我本可以用它，但我只发现了如何锁门。


    一旦任务完成，我就可以将自己添加为 Vera 的用户。我在 Vera 上的个人资料有我的电话号码，这样我就能接收短信报警。Vera 支持“场景”（scenes）的概念。场景允许你将一个事件、一个通知和一个或多个
    Z-Wave 设备绑定。我创建了一个名为“打开”（Open）的场景，它绑定了门打开时生成的事件，并将场景设为通过电子邮件和短信通知我。


    一旦这套设置完成，当门打开时我就会收到通知。这完全独立于在键盘上输入密码，这意味着当我离开门处于未锁状态时，进出房间就会产生报警。短信需要我花费一些时间，当我意识到自己产生了多少条报警时，我已经收到了大量的报警了。


    ## 谁去了那里


    在我的办公室认识某人是一个巨大的进步。如果发生实际的入侵事件，拥有一些关于入侵者的信息会更好。这引出了解决方案的下一部分：摄像头。我手头有一个摄像头，这会是一个大用武之地。


    Vera 看起来基本上是一个 USB（设备）。运行带有自定义修改的 OpenWRT 是一件好事，因为这意味着可以在 Vera 上运行 OpenWRT 的软件。Mi
    Casa 并不完全支持更改，但它给了你对系统的完全访问权限。它不会妨碍。


    这项工作的第一步是将摄像头连接到我的常规工作流中。根据经验，我可以在完整的 Linux 安装上让它运行，那么在嵌入式设备上运行就毫无疑问。摄像头连接得很好，一个简单的摄像头服务器立即就能看到我自己的图像。这在两个方面都是需要的。如果它在
    Linux 上不起作用，我就可以转向硬骨头了。


    获取 Vera 的 shell 访问很容易。进入“高级与 WiFi 配置”（Advanced & WiFi Configuration）。它会要求你设置密码。从那以后，你就可以以
    root 身份 ssh 登录。文件系统是一个压缩文件。起，根文件系统看起来已经完整了可以满足我的需求。在大多数情况下，你可以在根文件系统中找到并简单运行没有问题的东西。


    OpenWRT 使用 ipkg 管理包，而这在根系统上是失效的。解决方法是使用 wget。你只需对所有包遵循相同的流程。事实证明 ip 包是一组嵌套归档。以下是安装
    gph02 的过程：


    ```bash

    cd /tmp

    wget http://www.wrt.org/sort/kamikamaze/snapshots/brcm-2.4.1/packages/gph02_2.4.7-1-brcm-2.4.ipk

    tar -xvf gph02_2.4.7-1-brcm-2.4.ipk

    cd /

    tar -xvf /tmp/tar.gz

    ```


    我非常兴奋，演示图像捕获有两个选项：gph02 和 motion。gph02 是一个命令行控制工具。motion 是一个控制摄像头并检测运动的工具。


    我真的、非常想要运动视频，这可以提供人员进入的实际视频，但我遇到了一个经典的版本问题：Vera/ASUS 使用博通芯片组作为内核，无论如何它运行的是 2.4
    版本。2.4 版本的摄像头驱动程序非常有限。事实证明 uvc 驱动允许摄像头在我的工作区运行是在 2.6 版本中才有的。我没有找到可用驱动支持的摄像头。


    www.linux.com 2010年1月 | 37

