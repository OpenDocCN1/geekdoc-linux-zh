    # 新项目


    ## 源自深海


    深海之险 (Danger from the Deep)


    dangerdeep.sourceforge.net


    如果你记得上个月的专栏，我曾对一个看起来非常酷的潜艇模拟器 Danger from the Deep 感到兴奋。这个月，我很荣幸将其作为主要项目之一介绍。要运行该程序，您需要以下配置：


    - 一张符合 OpenGL 1.5 标准的显卡（建议使用 OpenGL 2.0 或更高版本）。

    - 256MB 内存（建议 512MB）。


    ![](img/9f8eb2f23eddae840f8630deba43fac9_43_0.png)


    Danger from the Deep（被称为 dangerdeep 或 Dfd）是一款（免费）开源的世界大战潜艇模拟器……它被计划为一项长期的模拟项目，并将随着我们的时间和物理知识的增长而不断改进。它目前处于
    alpha 阶段，但是可以玩的。


    网页提供了一个非常棒的二进制安装程序，感觉就像商业游戏一样。如果你愿意，也可以从源代码编译游戏，但当你只需点击“下一步”、“下一步”……时，你真的会那么做吗？


    二进制安装程序大部分会自动运行，但按照这类东西的惯例，你需要将其标记为可执行文件。如果你通过文件管理器运行它，可能需要右键点击并在属性中选择“可执行”，但我把这部分留给你你自己决定。对于那些倾向于从命令行运行程序的人，可以使用以下命令将其标记为可执行：


    啊，正宗的！不懂德语？太遗憾了！控制方式将保持现状，无论你喜不喜欢（我很喜欢）。


    Dfd 目前在 Linux (i386 和 AMD64) 和 Windows 上开发。有 Linux (i386 和 AMD64) 和 Windows (32位)
    的二进制文件，以及一些适用于 Mac OS 的旧软件包。该游戏使用了 SDL/OpenGL，因此应该可以移植到其他操作系统或平台。


    ![](img/9f8eb2f23eddae840f8630deba43fac9_43_1.png)


    有时环境可以非常美，就像这个日落，它让潜艇里度过的几个小时变得更容易忍！


    Dfd 据报道可以在 Windows (2000/XP, 98)、Linux (i386/x86-64/SPARC) 和 BSD (i386-64/SPARC/i64)
    上运行。


    ### 术语安装


    ![](img/9f8eb2f23eddae840f8630deba43fac9_43_2.png)


    真实性和写实几乎被推向了极端，像宿舍这样的细节真的能让你进入游戏的感受和氛围中。


    用法：一旦进入主界面，你就会感受到一股永不消息的浪漫怀旧浪潮！从与海洋耦合的控制、德语标记的控制和背景图像，到古怪的二战时期音乐，这款游戏凭借它的灵魂赢得了人心。


    ```

    $ chmod +x dangerdeep-0.3.0-linux-installer.bin

    ```


    然后，运行以下命令安装程序：


    ```

    ./dangerdeep.bin

    ```

    （注意：如果是全系统安装，请不要以 root 或 sudo 运行。安装程序将经过通常的“下一步”、“下一步”、“下一步”……完成”，完成后，使用以下命令运行游戏：）


    ```

    $ dangerdeep

    ```


    假设你有一张不错的显卡，你会在选项菜单中检查接收情况，图形效果实际上非常令人深刻。由于这款游戏目前处于 alpha 阶段，任务阶段是有限的。尽管如此，单机模式下有多种任务可用。如果你想一开始就大杀一场，请先尝试“单人任务”菜单下的“历史任务”。


    然而，在启程之前，我建议你打印出游戏的 PDF 手册，它可以在网站上下载。这款游戏的控制非常复杂（你可能不会），而且每个键通常都分配用于切换不同的视图。这里是一些基础的通用控制，可以帮助你入门。


    我一直在寻找原创项目，这个特定的应用程序真的让我大吃惊喜。根据它的网站，“Flinks 是一种文本模式闪闪网页浏览器。它旨在快速阅读和/或略读页面和文本”。


    F1 到 F12 将让你更清楚地看到船上的功能。某些键会带你进入潜艇内部的实际位置，如房间和宿舍，另一些则会调出设备，因为船员面板控制位于 F1，闪烁屏幕位于
    F6。


    该项目的作者 Martin Bart 的灵感源于一个手机程序，该程序会在屏幕上闪烁——经过几天的练习，速度达到了每分钟 600–700 字 (WPM)。Martin
    对这个想法很感兴趣，但对这样一个项目花费 20 美元感到犹豫，于是简单地制作了 Flinks 2.4 或更高版本，以及一个工作的 Lynx 版本。


    仪表盘是德语的，因为没有必要使用英语，所以你得弄清楚你的 Feedback 和 Lagewagen 是什么意思。


    安装：Flinks 的运行非常简单，因为不需要真正的安装，它的依赖项极少。虽然我无法在打印页面上演示效果，但 Flinks 会快速闪烁页面的单个单词，以帮助训练大脑进行快速阅读。


    现在，我处于这种会在风暴中持续战斗的阶段，让我们数数看。你可能想自己尝试一下，因为它可以使用更多模式发现水面敌人，但也展示了该游戏的一些酷炫图形。


    从网站下载最新版本，解压并在新文件夹中打开终端。在命令行中输入：


    ```

    $ flinks

    ```


    按 S 键切换，当你进入后，查看各种视图模式（先从这个开始，是的，你可以手动进行水面搜索）。如果目标在视野内，按 T 识别目标。长按空格键可以选择并开火。


    ## Flinks——快速阅读网页浏览器


    ## 专用服务器


    ## 极速连接


    BLADE 服务器


    千兆兆端口 / 多千兆选项，包括：


    | 方案 | 价格 |

    | :--- | :--- |

    | 3000 GB/月 | $200 |

    | 5000 GB/月 | $300 |

    | 10000 GB/月 | $500 |


    '
