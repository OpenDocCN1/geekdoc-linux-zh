    # # When All Else Fails— Amateur Radio, the Original Open-Source Project


    ![](img/9f8eb2f23eddae840f8630deba43fac9_9_0.png)


    **When all else fails**—in 2003, the Amateur Relay League used this as the motto
    for Field Day, the annual demonstration of its capabilities to the public. It
    rapidly became the phrase for Amateur Radio Emergency—probably the most public
    of all aspects of Amateur Radio and the operators that are usually first to report
    in an emergency. In time, it is also when something is missing in a communal system,
    we turn to open source for the solution. A better management plan? How about a
    better ERP system? Open source has the answer. But, what about communications
    systems? When we think about source, we naturally think of UNIX-based, running
    on Linux. What most people do not think about is the open-source nature of Amateur
    Radio. While operators are often seen working in emergency situations, by modern
    convergences we have today—cell phones, satellites, wireless-devices—developed
    and tested by radio amateurs.


    What Amateur Radio? Have you heard of it? It''s the same thing. Along with the
    revel, in a group of operators, and you will find more spaces for the origins
    of the ham radio operators. Because the Federal Commission calls us Amateur operators,
    we should call ourselves out of that. Of course, it is not amateur in the sense
    of the term, but not amateur in our communication professionals.


    Amateur Radio has been around since Marconi. Have you met a ham? Feel free to
    ask among us. Early on Marconi''s invention was put to the test, and ever, when
    disasters strike, Amateur Radio operators have been some of the first to respond,
    providing communications when there is little or no communication. Before we talk
    about it, we need some basic language, and like most Amateur Radio has a language
    all its own. Then, Dan gets us started by explaining the shorthand we use.


    Suppose I want to send data from one to another without we Shannon just passed
    an 802.11a/b device and we are off the tracks. But, what if there is no network
