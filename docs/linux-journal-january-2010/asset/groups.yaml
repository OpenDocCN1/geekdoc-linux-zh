    "Mixed IPv4 and IPv6-only rule set": the compiler makes two passes over the rule,
    first to produce an IPv4 configuration and then to produce an IPv6 configuration.
    On each pass it uses only address objects with matching the address of the pass.
    This is how the transitional configurations when IPv6 rules are gradually added
    to existing IPv4 configuration.


