    ## When All Else Fails— Amateur Radio, the Original-Source Project


    When all else fails—in 2003, Amateur Relay League used this as the motto for Field
    Day, the annual demonstration of its capabilities to the public. Probably the
    most public aspect of Amateur Radio is that operators are usually first to report
    in an emergency. In time, it is also when something is missing in a communal system,
    we turn to open source for the solution. A better management plan? How about a
    better system? Open source has the answer. But, what about communications? When
    we think about source, we naturally think of UNIX-based running on Linux. What
    most people do not think about is the open-source nature of Amateur Radio. While
    operators are often seen working in emergency situations, by modern convergences
    today—cell phones, satellites, wireless devices—developed and tested by amateurs.


    What is Amateur Radio? Have you heard of it? It''s the same thing. Along with
    the group of operators, you will find more spaces for the origins of the ham radio.
    Because the Federal Commission calls us Amateur operators, we should call ourselves
    out of that. Of course, it is not amateur in the sense of the term, but not amateur
    in communication professionals.


    Amateur Radio has been around since Marconi. Have you met a ham? Feel free to
    ask among us. Early on Marconi''s invention was put to the test, and ever, when
    disasters strike, Amateur Radio operators have been some of the first to respond,
    providing communications when there is little or no communication. Before we talk
    about it, we need some basic language, and like most Amateur Radio has a language
    all its own. Then, Dan gets us started by explaining the shorthand we use.


    Suppose I want to send data from one to another without an 802.11b device. But,
    what if there is no network network to plug it into? Gary Robinson shows us how
    to pass data without 802.11b using your PC and an Amateur Radio transceiver. This
    is one of many ways that FEMA and other agencies need help, like how many could
    need to be brought into an area during the stages of an emergency when the only
    messages passing are the amateurs.


    Get a GPS? How about 30,000 runners, more than half of whom will not make it to
    the end of the Marathons, whether it is Seattle, Boston, New York or Marine Corps
    Marathons? With Axel, an open source project of APRS and a rig, you can tell the
    traveler through mountains. You will find Amateur operators at each of these marathons
    providing communications support. Curt Mills, Steve and Laura Mills will tell
    us by setting up and configuring Axel so you can use it.


    What is it about Amateur Radio? Dave Taylor tells us about Amateur Twitter feeding
    questions with a command-line bot (which begs the question, how many of Dave''s
    responses are not amateur?). Over the rate, Feder just bumps the hand and introduces
    us to Colica, an integration framework for Ruby.


    It looks like Kindle needs to use a device like DVI in the winter. Sounds like
    what I did with my Christmas technically, but it is funny! Kyle Kindle has it
    for the humble home as we show how to browse using your keyboard.


    We are at the beginning of a major Disaster''s potential for the future of the
    network. Mick Ellenendorf secures security from amateur (Amateur Radio, not amateur).
    And just when you have all the tools you can use, Gordon Clark makes a new start
    in 2013. Feder Kenji needs help providing supporting security, and Dave Sears
    has the last word on control of one person''s detail.


    2010 is also another big year for virtual, and Matthew Hawkins has ideas into
    virtual applications with Amateur. I can think of several projects for this technology
    ahead.


    Well, it''s a jam-up question! If you are not an amateur, is there hope for you?
    If you are interested in joining an Amateur Radio operator, here in the US, visit
    www.hello-radio.org. In Canada, visit www.radio.ca. For other countries, with
    your local communities or department, when all else fails—

