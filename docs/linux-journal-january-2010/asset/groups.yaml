    ## Simple Virtual Appliances with Linux and Xen


    Use Xen and Linux to make your own ready-to-use software appliances.

    Create a DNS server, a Web server, a MySQL server—whatever you need, ready to
    go when you need it.


    - MATTHEW HOLKINS


    Everyone is familiar with hardware appliances in one form or another. It could
    be a wireless access point at home or a DNS server appliance in the data center.
    Appliances offer a prebuilt software (with hardware) that can be deployed rapidly
    with minimal hassle. When you choose the "appliance" concept with virtualization,
    you get virtual appliances—a prebuilt software, ready to run on your hardware
    with minimal work.


    In this article, I provide a hands-on introduction to constructing a simple appliance
    by assembling available components. The framework is used to build a wide range
    of appliances.


    ## What Is a Virtual Appliance?


    Virtual appliances have many attributes with hardware. In general, both types
    of appliances—either single-purpose or "thin" OS—are easy to backup and restore.
    Most importantly, they come ready with minimal configuration. Virtual appliances
    have the benefit of being hosted on your hardware, so you can host many virtual
    appliances on a single machine. Virtual appliances are constructed with an extremely
    thin OS. This can make installing software complicated due to dependencies, especially.
    In this example, I decided to use CentOS specifically because it uses tools most
    people.


    ## Installing CentOS


    To create a CentOS install for our appliance, we will use kickstart. One of the
    most important concepts of management is repeatability—a fully automated install.
    Our entire OS will fit comfortably in 2GB virtual disk and 256MB of memory. We
    are creating this under /xen, which is a standard location. Make sure to disable
    SELinux or adjust your settings. First, let''s create "appliance-base" guest,
    which will be used like a template. All the files for this guest will be stored
    in /xen/appliance-base/. By logging in to the Xen host and creating the virtual
    disk, then the system media:


    ```

    xenhost config -p /xen/appliance-base

    xl create -d /dev/zero/appliance-base \

    disk=/dev/tap/appliance-base.img

    vif flag=block,seek=2048,0

    ```


    ## Collecting Parts


    We will build our virtual appliances using the Xen hypervisor which is free and
    compatible with many Linux distributions. In this example, we''ll use CentOS 5.3
    for the base and host OS. We''ll use the virtualization option to install CentOS,
    or you could use KVM, LXC or any other hypervisor. You can install CentOS from
    the Internet if you have a good connection. In this example, I''ll use centos.org
    for mirrors and a local NFS server for the kickoff config.


    ### Listing 1. Xen Configuration: appliance-base.install.cfg


    ```

    # Xen Configuration for INSTALLATION of appliance-base

    kernel = "xen/vmlinux"

    ramdisk = "xen/intrd"

    device = "text=nfs:root=192.168.1.200:/home/ks.cfg"

    name = "appliance-base"

    memory = "512MB"

    disk = "/dev/tap/xen/appliance-base.img,xvda,w"

    vif = "bridge=en0,mac=00:16:23:00:01"

    vcpus = 1


    onboot = ''destroy''

    crash = ''destroy''

    ```


    ## Listing 2. Kickstart Configuration: ks.cfg


    ### Listing 3. Xen Configuration: appliance-base.cfg


    ```

    # Kickstart Configuration for MINIMAL CENTOS

    install

    two

    reboot


    url --http://mirror.centos.org/centos/5.3/os/i386/

    lang_en=US.UTF-8

    support --default=en.UTF-8 en.UTF-8

    keyboard=us


    skip

    device --eth0 --boot d


    # The password is "password"

    root --password=$1Shebo1m0HL32onQ1IGJp

    firewall --disabled

    selinux --permissive

    authconfig --enabled

    timezone=America/New_York


    bootloader --locationmbr

    clearpart --all --initlabel

    part / --fstype ext3 --size=0

    part pv.2 --size=0

    logvol VolGroup0 --size=32768 \

    --fstype ext3 --name=LogVol0

    --size=1024

    logvol swap --fstype --name=LogVol1

    --vgname=VolGroup0 --size=256

    %packages --nobobase

    ```


    ```

    # Xen Configuration for appliance-base

    name = "Appliance"

    memory = "256"

    disk = ''tap:/xen/appliance-base-image.img,xvda,w''

    vif = ''bridge:xen-br0=00:16:3e:00:00:01''

    cpus = 1


    bootloader = ''/usr/bin/grub''

    on_reboot = ''restart''

