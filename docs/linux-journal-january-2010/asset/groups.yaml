    # 实现端口锁安全


    不要编写锁，而是让它们消失。在处理计算机安全时，你应该假设黑客会尝试你系统可能拥有的任何门，无论你采取了多少预防措施。依赖密码的验证方法是经典的且被广泛使用的。为了“打开扇门”，连接到计算机上的端口，你首先必须指定正确的密码。如果端口足够快可以敲，这种方法就是有效的，而且它不会失败许多可能泄露密码的攻击，但仍然存在一个问题。不存在开放门的事实就足以诱惑。因此，开放的端口可以被视为带有（可能的）锁的门，密码就是钥匙。如果你正在运行某种公共服务（例如
    Web），那么更好，没有人可以越过你的服务。如果你只想允许少数人访问，你可以向世界隐藏你的系统实际上有一扇门的事实。你“击退入侵者”，不仅是在门上加锁，还将其隐藏起来。这是一种保护端口的简单方法，在你不使用秘密密码之前，让它们对世界保持隐藏和不可见，随后将（仅）打开端口以便你进入并访问。端口锁适用于用户访问非公开的服务。服务器保持所有端口关闭，但在用户通过提供秘密密码（密码序列）通过身份验证后按需打开它们。端口打开后，将应用通常的安全措施（密码、凭据等）。它不需要任何修改，但额外的安全性是在防火墙层面提供的。


