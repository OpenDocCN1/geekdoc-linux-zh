    Scenario: 用户可以通过输入姓名和电子邮箱地址登录

    Given 一个名为 "Reuen" "Lerner" 的用户，邮箱地址为 "@reuen@cucumber.com"


    When 我前往主页

    And 我为 "email_address" 填充 "reuen@cucumber.com"

    And 我为 "password" 填充 "password"

    And 我按下 "submit"

    Then 我应该看到 Welcome back to the site, Reuen!


    一旦我的场景通过了，我会将它们提交到版本控制，并将它们保留在应用程序的 `features` 目录中。如果我的新场景像以前一样出现——我会通过通过步骤定义或修复代码中的
    bug 来捕捉步骤部分。但是，如果 Cucumber 需要运行所有特性和所有场景，使用起来会有点慢。所以，你可以手动运行 Cucumber，这不像 Rake：


    ```

    cucumber features/login

    ```


    你甚至可以指定运行从文件中第 13 个特性开始运行的特性：


    ```

    cucumber features/login:13

    ```


    当一个文件中有一系列场景而你正尝试调试其中一个时，这可以非常节省时间。


    # 更多关于 Cucumber


    Cucumber 是一个设计良好的系统，拥有许多与 Web 开发人员需求紧密结合的功能和能力。首先，你可以使用 Cucumber 中的步骤定义。


    关于 BDD 的“故事”方法的优秀介绍（包括特性和场景），请参考 BDD 社区领军人物之一 Dan North 的这篇博客文章：dannorth.net/whats-in-a-story


    Cucumber 的主页是 cukes.info。该页面包含了文档、截图以及你开始使用 Cucumber 时的其他资源索引。


    Pragmatic Programs 最近出版了一本名为《The RSpec Book》的书，由 RSpec 维护者 David Cheney 以及许多其他活跃于
    RSpec 社区的人士编写。如果你对使用 Cucumber（或 RSpec）感兴趣，这是一个极佳的起点。


    Shoulda 的主页是 thoughtbot.com/projects/shoula。文档是一个很好的起点，但你可能需要实际操作玩玩才能进入门道。


    rspec 的主页是 rspec.info，它包含 RSpec（默认）或 Shoulda，这两个在 Rails 社区中已经非常流行的 BDD 框架。


    正如我之前提到的，你可以使用 Cucumber 来测试模型和控制器，而不仅仅是集成测试。我个人的偏好是这样使用 Cucumber，不过，它提供了一个很好的用户视角，让你能像用户一样测试网站。


    嗯，它以用户身份测试网站，但有一个巨大的限制：Webrat 是一个很好的工具，但它不支持 JavaScript。这意味着如果你的网站包含大量的 AJAX 和
    JavaScript，你将无法用 Webrat 测试它。你可以通过使用 Webrat 在你的应用程序中包含文本链接，并使用外部测试系统（如 Selenium
    或 Celerity）来解决这个问题。但这样你就必须找到一个易于集成、可靠且运行无缝的系统。


    Cucumber 运行缓慢是一个缺点；在大型应用程序中运行所有场景可能花费长时间。一种解决方案是使用 Cucumber 的标签（tag）功能，它允许为场景赋予一个或多个标签。然后你就可以跨环境运行带有该标签的所有场景。


    如果你想避免在创建或更新（该）对象时访问数据库，你可以将工厂（例如 Factory Girl）集成到 Cucumber 中。这可以加快速度，同时在创建场景和测试应用程序时为你提供极大的灵活性。


    # 结论


    Cucumber 是一种创新的测试方法，它向我展示了英语故事测试的威力，这种程度是我在其他地方没有看到的。在 Ruby 中，我建议你尝试将 Cucumber
    集成到你自己的工作中。


