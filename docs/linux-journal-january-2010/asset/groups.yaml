    - MATTHEW HOLKINS


    每个人都以某种形式熟悉硬件设备。它可能是家里的一个无线访问点，也可能是数据中心的一个 DNS 服务器设备。设备提供了预先构建的软件（带硬件），可以以最少的麻烦快速部署。当你结合虚拟化技术选择“设备”概念时，你将获得虚拟设备——这是一种预先构建的软件，只需极少的工作即可在你的硬件上运行。


