    ## HACK 与 顶层链接显示


    在我看来，Vimper 的真正威力在于标准的键盘快捷键，以及你可以打开链接、移动到输入框甚至减少鼠标悬停的操作。Vimper 会通过在任何网页上按键来激活此提示（Hint）。页面上所有的“对象”，例如超链接、文本输入框和下拉菜单都会高亮并分配一个数字（图2）。如果你选择了其中一个高亮项目，可以输入其后的数字，或再次按该键来激活高亮文本。例如，如果你在
    Web 上阅读一篇多页文章并看到“下一页”链接，你可以按 `f` 然后按 `x`。随着你的输入，提示将展开，如果只有一个匹配项，它会自动加载。当你使用 `f`
    时，它将在当前页中打开页面，或按 `t` 在新标签页中打开页面，只需启动提示模式而不是 `f`。对于其他项目，你可以按 `Esc` 退出提示模式。如果你按
    `k` 激活扩展提示模式，你还可以通过绑定左键点击将扩展提示模式扩展到其他操作。进入扩展提示模式，按 `k`；通过特殊键设置要执行的操作，最后输入与特定操作相关的数字进行使用，但完整列表请查看
    Vimper 帮助页面；请记住在执行任何这些效果之前都会按 `k;`


    ![](img/9f8eb2f23eddae840f8630deba43fac_35_0.png)


    图 2 提示模式下的 LinuxJournal.com


    没有菜单的 URL？可以通过跟随 URL 并按 `o`（打开）在当前标签页中加载，或按 `t`（打开）输入一个 URL 在新标签页中打开。除了这些基础键外，还有一些变体需要考虑：


    - T — 标签打开提示，但用当前标签页的 URL 填充

    - O — 创建打开提示，但用当前标签页的 URL 填充

    - w — 标签打开但仅在新窗口中打开 URL

    - W — 类似于 T，它创建一个窗口打开提示并填充当前标签页的 URL

    - p — 根据剪贴板内容打开 URL


    一旦你进入 URL URL模式，你还可以按 `Tab` 键通过浏览器历史触发自动补全。提到浏览器历史，你仍然可以从命令行模式访问其他标准 Firefox 功能：


    - :bookmarks 在命令行模式下访问所有 Firefox 书签

    - :history 查看你的浏览器历史

    - :emenu 访问其他 Firefox 对话框

    - :dialog 访问其他 Firefox 对话窗口，输入 `:help :dialog` 获取更多信息


    - j 按两次；在 URL 中按键将焦点置到链接并用鼠标悬停在其上

    - s — 保存链接的目的地

    - y — 复制链接的位置

    - Y — 复制描述文本


    相信我，我仅仅触及 Vimper 的皮毛。它让我想起了 vim，因为我感觉自己只使用了 10% 的可用功能。对于 vim，Vimper 会随着你的进步而获得回报


