    loaded using iptables. The rule permits anything on loopback produces several
    iptables commands. The difference is in the choice of the command-line tool used
    to add the rule. This rule permits both http and any ICMP, generates only one
    iptables command to match each TCP port. This is because ICMP services only exist
    in the IPv6 context, so the it is dropped from the rule when it is compiled for
    IPv4.


