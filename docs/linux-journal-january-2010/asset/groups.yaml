    ## 深入解析


    你可能会想到的功能——触发备份、运行某个进程；发送电子邮件等等。

    knockd 接受以下命令行选项：


    - -c 允许你指定不同的配置文件，而不是默认的 /etc/knockd.conf。

    - -d 让 knockd 在后台作为守护进程运行；这是标准的工作方式。

    - -h 提供语法帮助。

    - -i 允许你更改监听的接口；默认情况下，它将使用你在配置文件中指定的任何接口，或者在未指定时使用 eth0`。

    - -n 允许在日志条目中使用 DNS 域名，因为这被认为是一种不良实践，因为它会迫使你的机器失去隐身性并产生 DNS 流量，从而可能被监控。


    - -v 产生更详细的日志。

    - -D 输出调试信息。

    - -V 显示当前版本号。


    为了触发“敲门”（knocks），你可以使用任何程序，但随 knockd 软件包一起的 `knock` 工具是通常的选择。其用法示例所示：使用 `knock
    site_url:7885` 建立端口 7007 的 TCP 连接。对于 UDP 连接，可以添加 -u 参数，或者使用 `knock site_url:7885`。-h
    参数提供了简单的语法摘要。


    ## 结论


    端口敲门（Port knocking）不能是你武器库中唯一的安全武器，但它为你的机器增加了额外的屏障，让黑客难以入侵。


    > Federico Kerinski 是一位乌拉圭系统工程师，拥有超过 25 年的大学教学、开发、咨询以及编写文章和课程材料的经验。他已经使用 Linux
    多多年，并在几家公司安装过它。他对 Linux 机器更好的安全性和性能感兴趣。


    ## 资源


    `knock` 位于 www.zeroflux.org/projects/knock，你可以在 www.linux.net/man/1/knockd 找到
    knockd 守护进程文档，或者直接在控制台输入 `knock`。


    欲需更多关于端口敲门的信息，请查看 www.portknocking.org/view/，特别是 `view/implementations` 以获取更多实现方式。你也可以查看
    www.linux.com/archive/37888 上的评论，以及 www.portknocking.org/view/about/critique 中的答案，作为对端口敲门的反论。


    特别阅读 en.wikipedia.org/wiki/Transmission_Control_Protocol 以了解 TCP 标志。在 www.faqs.org/docs/iptables/tcpconnections.html，你可以找到一张显示如何使用标志的图表。


    端口号由 IANA（互联网分配编号机构）分配；列表见 www.iana.org/assignments/port-numbers。


    要测试你的系统，请获取 amass nmap.org，并访问 GRC (Gibson''s Research Corporation) 网站 https://www.grc.com，尝试
    Shields Up。


    如果你需要刷新 iptables 技能，请检查 www.netfilter.org。


