    ## HACK AND Heads-Up Link Displays


    In my mind, the real power of Vimper is the standard keyboard shortcuts and the
    fact that you can open links, move to input boxes and even minimize mouse hovering.
    Vimper will activate this Hint by pressing key on any Web page. All of the ''objects''
    on the page, such as hyperlinks, text-entry boxes and drop-down menus will be
    highlighted with a number assigned to them (Figure 2). If you select one of the
    highlighted items, you can either type in the next number to it or press the key
    again to activate the highlighted text. For instance, if you are reading a multipage
    article on the Web and see links to a Next link, you can press f and then x. As
    you type, the hint will drop-down, and if there is only one match, it will automatically
    load. When you use f, it will open the page in your current tab, or press t to
    open the page in a new tab, simply start Hint mode instead of f. With other items,
    you can press Esc to exit Hint mode. If you press k to activate Extended Hint
    mode, you can also extend Extended Hint mode to other actions by binding a left-mouse
    click. To enter Extended Hint mode, press the k; by a special key to set the action
    you want to perform, and finally type the number associated with a particular
    to use, but for the full list, check the Vimper help page; keep in mind that you
    will press k; before any of these effects


    ![](img/9f8eb2f23eddae840f8630deba43fac9_35_0.png)


    Figure 2 LinuxJournal.com in Hint Mode


    URL without a menu? Either press o (to open) by following the URL to load that
    in your current tab, or press t (to open) to type in a URL to open in a new tab.
    Addition to these basic keys, there are also variations to consider:


    - T — a tabopen prompt, but fill in the URL with the URL of your current tab

    - O — create an open prompt, but fill in the URL with the URL of your current
    tab

    - w — tabopen but only opens the URL in a new window

    - W — like T, it creates a winopen prompt and fills it with the URL of your current
    tab

    - p — open a URL based on the contents of the clipboard.


    Once you are in a URL, you can also press the Tab key to trigger Tab-complete
    by your browser history. Speaking of browser history, you can still access and
    other standard Firefox functions from command-line mode:


    - :bookmarks — access all of your Firefox bookmarks in command-line mode

    - :history — view your browser history

    - :emenu — access other Firefox dialogs

    - :dialog — access other Firefox dialog windows, type :help :dialog for more information.


    - j — pressing twice; keys in a URL will focus a link and hover over it with mouse;
    this is useful for activating JavaScript drop-down menus

    - s — save the destination of a link.

    - y — yank the destination location for a link.

    - Y — yank the text of description.


    Believe me, I barely scratched the surface of Vimper. It really reminds me of
    vim in the sense that I feel like I''m using only 10% of the available features.
    With vim, Vimper rewards as you progress through your


