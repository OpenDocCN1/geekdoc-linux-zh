  md: '# DRM, DMCA and OST (Other Scary Things)


    # They Said It


    It''s obvious to us that Digital Rights Management (DRM) is a really bad idea.
    It''s not just because DRM-encoded media usually won''t work with our operating
    system, but because we understand the value of openness. The sad part is that
    DRM, on some level, is antithetical to doing a good thing.


    Take Will Wheaton for example. You know him from television or movie acting, but
    he also produces the audiobook of his work. Because Will against DRM, his books
    are available as unencrypted MP3 files. For those of us who like to listen to
    such things on Linux or a non-MP3 player, we often confuse DRM with copyright-free.
    However otherwise decent individuals don''t think about the ramifications of redistributing
    their copyrighted work, unless they end up with situations like this: tiny.com/stealfree


    The Itanium approach...was supposed to be so terrific—until it turned out that
    the wished-for-compilers were basically impossible to write.—Daniel Kahn


    This is one of the greatest facts of the last 50 years.—Steve Co. Owens, in "The
    Itanium Killed the Computer Industry" (2009)


    When it comes to DRM, I believe that it is for authors—and more. If a piece of
    media is protected with DRM, only people who have the rights to enjoy it can.
    Unfortunately, even the big companies that insist on using it, all it manages
    to do is punish the honest people. People who have tried to play Amazon Video
    on Demand on their Linux desktops or listen to Audible books have found exactly
    what I mean here.


    We need to innovate our this down, so that we would be ahead of competitors when
    we win the round.—Steve Jobs, as the 2001 recession faded


    The truth of the matter is, if people are dishonest enough to use copyrighted
    materials they haven''t paid for, DRM will do little more than give them an "excuse"
    for their piracy. Right now, unless we are given the choice of paying for limited,
    restricted access to media, or to download fully functional, platform-unrestricted
    media from free sites. We need two messages for this developers.


    IBM is the company that matters for going the other direction. DRM''s footprint
    is much more now than it was started. I''m not sure that it has been the long-term
    benefit of all this.—Steve Ballmer (during the last ten years, IBM''s share price
    has increased by 30%, and Microsoft''s has decreased by 30%)


    +   1. Media publishing makes it easy for users to buy your access, and make media
    free, archive-able and affordable. People will just just-stuff-like they do now.
    The difference will be if your honest clients don''t value you, and you''ll actually
