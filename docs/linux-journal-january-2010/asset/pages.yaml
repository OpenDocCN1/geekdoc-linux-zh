  md: '# # Finding xargs


    In the November 2009 issue, I looked at some tools used by computational scientists
    when they are doing and post-processing on their data. I examine how to automate
    this even further. Let''s start with the assumption that we have a number of steps
    that need to be done and need to be done on a large number of files.


    The first step is to find out which files need to be processed. The most obvious
    way to do this is to create a list of files manually. Usually this is the most
    time-intensive, and with all manual operations, it leads to mistakes due to human
    error. This step should be automated. The most popular utility for creating lists
    of files is the find command, which finds files on a number of different filters.


    The next step is to locate where certain class of files lives on your drive. Let''s
    say you have a group of data files that need to be processed, all in one day.
    The final command to search for them would be:


    ```

    find -name "*" -print

    ```


    The first option tells find where to start looking for files. In this case you
    are looking in the current directory. You could also give any path, and find will
    search there. The name option tells what to filter on. In this case, you are trying
    to filter by the filename. This filter is actually a filter pattern, "*". This
    pattern needs to be quoted so the shell doesn''t try to expand the * character.
    The last option, print, tells find to print the results to standard output. However,
    find separates files with new-line characters. A problem can occur if you have
    odd characters in your filenames, like blanks or newlines, and you feed this into
    another program. To mitigate this issue, you can use the -print option instead
    of print. The -print option separates files with a null character instead of a
    new-line. This is a safer way to handle if you are searching for a file with a
    new line character.


    There are many other options to use. The first ones are -iname, which is just
    like -name, but it is not case-sensitive. There is also a group of options to
    filter files by time based on access, modification or creation. -mtime looks for
    files that were modified more than n days, and -mmin looks for files that were
    modified less than n minutes. The -atime option looks for files that were accessed
    24 hours ago. And -ctime and -ctime are used to test for file status changes.
    -ctime looks for files that were changed less than n days ago. -ctime looks for
    files that were created, and -mmin and -cmin look for the modification time of
    a last file. The last filter option to use in this instance is -newer filename.
    This option helps if you want to generate a list of files that have


    created since your last processing run.


    Now that you have your list of files, what do you want to do with them? With this
    you can use another command called xargs, in its simplest configuration, takes
    lines of input and runs some command for each file. This simplest use looks like
    this:


    Here, xargs reads lines of input from standard input. The -I option tells xargs
    to replace any arguments with the line of input that xargs read. Using {} is not
    mandatory. You can use any characters as place holders. In this example, xargs
    runs each line of input, substituting the line of input into the placeholder.
    If you have a list of files in a text file, you can use xargs rather than standard
    input by using the -a filename option. Also, xargs will break input on spaces,
    not newline characters. If your filenames have blanks in them, xargs will not
    behave correctly. In this case, you can use -0 to use the null character as the
    delimiter for input. With the -0 option then the given command should be run for
    any file. If you''re using a file list, you can use the -p option. This tells
    xargs to prompt from the file list. The last option of xargs is -P n number of
    commands in parallel, with the default value being 1. So, if you have a highly
    loaded dual-core machine, you might want to use -P 2 to execute the processing
    files faster. If you have a multi-core machine, you can increase the number of
    parallel processes.


    Putting all together, let''s look at a hypothetical case where you need to do.
    Let''s say you have a group of data files in your home directory. You are running
    a job last week and the file containing the list of files to be processed is list.txt.
    Now you want to process all the files that have been created since. To do so,
    you can run the following commands:


    ```

    find -name "*" -newer list.txt -print0 | xargs -a list.txt -I {} run_processing
    ()

    ```


    This would be the list of files that you have stored in the file list, for future
    reference. If some of the filenames contain characters or white-space characters,
    you would probably run the following instead:


    ```

    find -name "*" -newer list.txt -print00 | xargs -a list.txt -I {} -0 run_processing
    ()

    ```


    Hopefully, this helps you automate the routine work that needs to be done, so
    you can get to more interesting results. Go and automate.


    > -JOE BERARD'
