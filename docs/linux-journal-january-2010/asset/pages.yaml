  md: "# # Simple Virtual Appliances with Linux and Xen\n\nUse Xen and Linux to make\
    \ your own ready-to-use software appliances.\nCreate a DNS server, a Web server,\
    \ a MySQL server—whatever you need, ready to go when you need it.\n\n- MATTHEW\
    \ HOLKINS\n\nEveryone is familiar with hardware appliances in one form or another.\
    \ It could be a wireless access point at home or a DNS server appliance in the\
    \ data center. Appliances offer a prebuilt software (with hardware) that can be\
    \ deployed rapidly with minimal hassle. When you choose the \"appliance\" concept\
    \ with virtualization, you get virtual appliances—a prebuilt software, ready to\
    \ run on your hardware with minimal work.\n\nIn this article, I provide a hands-on\
    \ introduction to constructing a simple virtual appliance by assembling available\
    \ components. The framework is used to build a wide range of appliances.\n\n#\
    \ What Is a Virtual Appliance?\n\nVirtual appliances may have many attributes\
    \ in common with hardware housings. In general, both types of appliances are either\
    \ single-purpose or \"thin\" OS, are easy to backup and restore. Most importantly,\
    \ they come to ready and roll with minimal configuration. Virtual appliances have\
    \ the benefit of being hosted on your hardware, so you can host many virtual appliances\
    \ on a single physical machine.\n\nVirtual appliances are constructed with an\
    \ extremely thin OS. This can make installing software complicated due to dependencies,\
    \ especially for a beginner. In this example, I decided to use an off-shelf free\
    \ distribution, specifically CentOS, because it uses tools most people are used\
    \ to. We'll use it as much as possible.\n\n# Installing CentOS\n\nTo create a\
    \ CentOS install for our appliance, we will use a kickstart with the -nobase option.\
    \ One of the most important concepts of system management is repeatability—a fully\
    \ automated CentOS install. Our entire OS installation will fit comfortably in\
    \ a 2GB virtual disk and 256MB of memory. We are creating this appliance under\
    \ /xen, which is a standard location for Xen machines. Make sure to disable SELinux\
    \ or adjust your settings.\n\nFirst, let's create an \"appliance-base\" guest,\
    \ which will be used like a template. All the files for this guest will be stored\
    \ in /xen/appliance-base/. By logging in to the Xen host and creating the virtual\
    \ disk, then Xen vminux and intrd files from the system media.\n\n```\nxenhost\
    \ config -p /xen/appliance-base\nxl create -d /dev/zero/of-appliance-base \nring=/dev/tap/appliance-base.img\n\
    vif flag=block-seek 2048-0\n```\n\n```\nI+0 records\nI+0 records\n1048576 blocks\
    \ (1.0 MB), 0.071271 seconds, 14.7 MB/s\n```\n\n```\nxl config /home\nhring=http://www.centos.org/5.3/os/images/xen/intrd\n\
    xgpt = \\\n```\n\n# Collecting the Parts\n\nWe will build our virtual appliances\
    \ using the Xen hypervisor because it is free and compatible with many Linux distributions.\
    \ In this example, we'll use CentOS 5.3 for the base and host OS. We'll use the\
    \ hardware Virtualization option to install CentOS, or you can install an existing\
    \ Linux system using the kernel and kernel-packages. I chose CentOS because it's\
    \ easy; alternatively, we could use KVM, LXC or any other hypervisor.\n\nYou can\
    \ install CentOS from the Internet if you have a good connection. In this example,\
    \ I'll use centos.org for mirrors and a local NFS server for the kickoff config.\n\
    \n+   Listing 1. Xen Configuration for Installation: appliance-base.install.cfg\n\
    \n```\n# Xen Configuration for INSTALLATION-of appliance-base\nkernel = \"xen/vmlinux\"\
    \nramdisk = \"xen/intrd\"\ndevice = \"text=nfs:root=192.168.1.200:/home/kat/ks.cfg\"\
    \nname = \"appliance-base\"\nmemory = \"512MB\"\ndisk = \"/dev/tap/xen/appliance-base.img,xvda,w\"\
    \nvif = \"bridge=en0,mac=00:16:23:00:00:01\"\nvcpus = 1\n\nonboot = 'destroy'\n\
    crash = 'destroy'\n```"
