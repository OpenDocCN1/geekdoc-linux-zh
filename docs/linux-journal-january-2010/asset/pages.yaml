  md: '# # Glossary


    Amateur Radio has been digital communications literally there since there been
    wireless communications. We first used CW (Continuous Wave) and On/Off keying
    with Morse code. Abbreviations became commonplace. With advent of later electromechanical
    sensors in some modes became available at reasonable prices and hard radio RTTY
    (radio telemetry) shortcuts and abbreviations became even more common.


    We use a set of abbreviations—Qcodes during voices and especially CW conversations
    (CW or Continuous Wave mode). Every word has an abbreviation: QSO.


    Quite few of our abbreviations in the Morse code world, splitting over dots and
    dashes, if we say “hi to” what really means “OVER catch”. This is similar to instant-messaging
    abbreviations that many of us use with SMS or e-mail.


    Here are some common terms:


    +   - APRS: Automatic Position Reporting System.

    - AX.25: the packet radio link-level protocol we use.

    - digipeater: single-frequency store-and-forward repeater for radio.

    - KISS mode: Keep It Simple Stupid. A simplified protocol used in a TNC for computer
    control (which, that really is the name of the protocol).

    - soundmodern: software to turn a soundtrack into a TNC.

    - TNC: Terminal Node Controller or radio modem.

    - tracker: a GPS/radio/TNC that emits positions while moving. It or may not have
    two-way equipment or a map display.


    See the soundmodern HOWTO on the Xastar Wiki for details (see Resources). Most
    operators prefer a hardware TNC over the software solutions alone. We recommend
    KISS mode for long-term reliability. The alternate TNC command mode, was designed
    for human interaction and, thus, prone to timing and getting lost or misinterpreted.
    KISS is a much simpler protocol; the computer does most of the protocol working
    instead of the TNC.


    # ## APRS Net Bits


    An entire network of servers moves packets around the Internet and connects to
    various radio networks together, called the APRS-IS Internet. Two APRS stations
    can exchange text messages. Alternative networks exist for Citizen Weather (CWOP)
    data and for emergency or monitoring purposes. Folks who wish to see more objects
    (Firenet of Curt''s interests; it contributes earthquake, weather, and river gauges,
    also plotting positions of team-encounters)


    choose to be a one-way or two-way ig (Internet gateway) between the Internet and
    radio. One-way ig (RF-INET) are welcome any time, but two-way ig are best coordinated
    so they don''t compete for airtime in one area. The type two-way ig passes only
    APRS messages and ACK/TRACK on the local frequency. Mobile users can send and
    receive messages from their current locations, as ig will route the messages approximately.
    It can function as an ig, but if you need more ig functions, other applications
    may be suited.


    Other pieces of the infrastructure are databases with front ends. See the Resources
    of this article to find out more, specifically the info.aprs.net, and click on
    APRS Internet System—it''ll well your time.


    Home stations can have a radio interface, which connects as clients of APRS-IS
    or Firenet, and optionally may


    ![](img/9f8eb2f23eddae840f8630deba43fac9_53_0.png)


    # ## Xastar Major Features


    Compared to other clients, Xastar excels in the map department with 125 types
    of maps, including topo maps, street maps, aerial photographs, weather layers.
    It can use on-line or local map maps, or combinations of both. Map stacks


    Figure 2: Xastar Top Maps, Simulated SAR Mission, Mt. Pilchuck (Maps Courtesy
    of USGS)'
