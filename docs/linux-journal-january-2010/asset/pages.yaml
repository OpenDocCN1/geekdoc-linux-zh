    the full column.


    the motionless effort both worked okay, at least for certain versions of Firefox,
    but they were still a limited version of the real thing. Well, the plugin deal
    is far beyond simple keybindings and actually creates a modern interface with
    an incredible level of detail. You not only get hjkl navigation, but you can also
    open tabs and record macros just like in vim. What''s more, Vimperator was built
    so there are keybindings available to make it easy to click on links and hover
    over elements on the page—all from the keyboard.


    Hasta La Vista, Mousey

