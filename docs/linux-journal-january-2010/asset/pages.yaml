    If you want to be a futuristic Web-browsing machine, terminate that mouse, pick
    up the keyboard, and find out how Vimperator can transform Firefox into a modal
    half-vim, half-browser cyborg.


    In November 2009, I wrote an entire column "Dr hjkl and Mr Hack" devoted to programs
    with vi-style keybindings. In the column, I introduced the Vimperator for Firefox
    and discussed how it worked, but at the time, I mentioned, "The Vimperator plugin
    is extensive enough to deserve a column of ours (in fact, e-mail me at @greenfly.net
    if you''d be interested in that.)" received a number of responses, so that and
