  md: "# INDEPTH\n\nbind-utils. To make a LAMP appliance, run yum install http php\
    \ mysql-server. Reboot, or Refresh Modules inside Webmin, and you will be presented\
    \ with Web management for whatever you installed Webmin supports a wide range\
    \ of tools out of the box, and even with more extension modules available on the\
    \ Webmin website.\n\nFor our example, let's make a MySQL database server appliance.\
    \ To customize your base appliance, run the following commands inside the VM:\n\
    \n```\nappliance-base -y install mysql-server\napp-base /etc/init.d/mysqld start\n\
    Initializing MySQL database: Installing system tables...\nOK\nappliance-base _mysql_installation\n\
    ```\n\nNOTE: ALL PARTS OF THIS SCRIPT IS RECOMMENDED FOR ALL MYSQL SERVERS IN\
    \ PRODUCTION! PLEASE READ EACH CAREFULLY!\n\nEnter current password for root (enter):\n\
    OK, successfully entered password, moving on... \nSetting the root password that\
    \ can log into the MySQL root user without the authorization.\nSet root password:\
    \ [Y/n]\nNew password:\nRemove anonymous users? [Y/n]\nDisallow root login remotely?\
    \ [Y/n]\nReload database and test access? [Y/n]\nReload privilege tables? [Y]\n\
    \nAll done! If you've completed all of the above, your MySQL installation should\
    \ now be secure.\n\nThanks for MySQL!\n\n# Packaging and Developing the Appliance\n\
    \nNext, let's package your appliance and then go through the motions of deploying\
    \ it as mysql.example.com. To prepare the disk image configuration:\n\n```\nxenhost$\
    \ cd /etc/xen/auto/appliance-base\n```\n\n```\nxenhost$ tar -cvfz appliance-base.tar.gz\n\
    xenhost$ mkdir -p /xen/mysql.example.com\nxenhost$ cd /xen/mysql.example.com\n\
    xenhost$ tar -xvf /appliance-base.tar.gz\nxenhost$ mv appliance-base.cfg /etc/xen/auto/mysql.example.cfg\n\
    xenhost$ cd /xen/mysql.example.com\n```\n\nExample configuration for /etc/xen/auto/\n\
    mysql.example.cfg is shown in List 4. To set the path to the disk image, and give\
    \ it this unique MAC address. Placing the configuration at /etc/xen/auto means\
    \ the appliance will be started automatically when the Xen host boots.\nStart\
    \ the appliance using the following command:\n\n```\nxenhost$ create /etc/xen/auto/mysql.example.cfg\n\
    xenhost$ vm console mysql\n```\n\nExamine the console as the guest boots; the\
    \ last bit of output will be the DHCP-IP. Thanks to your local addresses, Point\
    \ a Browser at the URL; by default, Webmin listens on TCP port 1000. Once logged\
    \ in, you will be able to manage your MySQL appliance. Webmin also shows your\
    \ static IP, YUM updates updates create additional users, firewall rules, and\
    \ maintain MySQL databases, and configure automated systems.\n\n# Conclusion\n\
    \nUsing these simple steps and readily available components, you can create a\
    \ virtual appliance to do anything. Because its a virtual machine, you can move\
    \ between physical computers and deploy it multiple times.\n\nAs stated in the\
    \ introduction, all these steps could have been done in VMware virtualization.\
    \ VMware is the most widely deployed technology and has its own tools for creating\
    \ virtual appliances, in-line 'Marketplace' for cheap appliances. Whether you\
