  md: '# Linux Security Challenges 2010


    Security challenges and worries for 2010: we live in interesting times indeed!


    In 2005, I wrote a Penguin column titled "The Future of Linux Security", in which
    I described what I thought were the biggest challenges of Linux security in 2005
    and the most promising new technologies for addressing them. In 2005, I argued
    that virtualization might become a more important tool for isolating vulnerable
    applications and Mandatory Access Controls (MACs), as SELinux and AppArmor. I
    also predicted that anomaly detection would become much more important than signature-based
    detection could engine without antivirus (AV) and intrusion detection prevention
    systems (IDS/IPS). So far, neither of those predictions has come true. We still
    deal with signature-based IDS/IPS that are largely incapable of detecting zero-day
    malware or new for anyone to have created a corresponding signature or polymorphic
    malware that alters itself from generation to generation.


    Virtualization has largely been driven by hardware resource management and operational
    concerns rather than security. In fact, virtualization is a bigger source of security
    issues than it is a security tool (for example, isolating applications or services
    from other parts of a given system).


    Am I embarrassed by these predictions passing out? Not as much as I am disappointed.
    I still believe that IDS and IPS need to evolve signature-matching, and I still
    think virtualization has the potential to be a bigger source of security problems
    than it is solutions to it.


    This month, for five years since my last issue, I''m decided to cover what I think
    nowadays on some of the biggest challenges of Linux and Internet security for
    2010 and my ideas on how we might address them. This is by no means a comprehensive
    study (time and space didn''t even allow me to touch on mobile computing or embedded
    Linux, for example), but I think you''ll agree that I cover some of the most far-reaching
    security challenges that affect not only the Linux community in particular, but
    also the Internet community at large.


    # Assets and Attackers


    Before I zero in on technical areas, a quick word about the things we''re defending
    and the people who are attacking in order, because those items have changed significantly
    since I started writing Penguin. In the old days, we were primarily concerned
    with protecting network and system integrity against intruders who were most likely
    be bored teenagers or industrial spies.


    Government, of course, worried about other types of threats I''m talking about
    civil and corporate space (generally heavily at that). The point being, the classic
    attack scenario involves trying to remote-compromise some Internet-facing system
    so they could defeat your Web site, steal proprietary information or use that
    to attack other systems, including systems "deeper" inside your internal network.


    We still worry about that scenario, because. Over the past decade, there has been
    an explosion of threat spectrum: simple email-data attacks for the harvest of
    spam, stealing, trafficking or in illegal credit-card making for fraudulent purchases;
    full-blown assumption of other people''s names, social security numbers (or other
    bank details), and so forth, for the purpose of fraudulently opening new credit
    accounts; money laundering and


    Sometimes identity theft is achieved through attacks of, databases holding dense
    concentrations of such data. Much more nowadays, it involves sophisticated malware
    that infiltrates a given merchant or bank and knows how to works to its databases
    or harvests data. Because such attacks are so lucrative (attracting to billions
    of dollars annually), it is no surprise that organized crime is behind a lot of
    it. I''m speaking not only of traditional criminal organizations that also run
    extortion, illegal drug and gambling operations, but also completely new organizations
    focused


    ![](img/9f8eb2f23eddae840f8630deba43fac9_27_0.png)


    MICK BAUER'
