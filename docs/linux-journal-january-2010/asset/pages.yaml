    # Cloud Computing


    # Malware


    As Internet has gotten faster, cheaper and more ubiquitous, people have been to
    question the need for relying on local computing power and storage, if so much
    of our daily computing experience depends on internet connectivity. If my applications
    are all online, why not run them over the Internet, to remote servers rather than
    local CPU or your IT infrastructure?


    Malware has been with us long time, and some of the things we care now, like polymorphic
    code that infects signature-based antivirus methods, have always been a while.
    What changed recently is the emergence of "targeted malware"—rojans and viruses
    designed to attack specific targets of specific organizations.


    Why not subscribe to a framework in external providers who host farms of servers
    and storage arrays on which anyone can host virtual servers running on-line applications?
    Why not use applications written and maintained by the provider? Should users
    even care where and how these applications are used or who wrote them in their
    place?


    Targeted malware is probably the scarciest new threat yet we professionals and
