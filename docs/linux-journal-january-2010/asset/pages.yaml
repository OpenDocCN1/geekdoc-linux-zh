  md: '# # Rolling Your Own with Digital Amateur Radio


    Amateur Radio operators are generally free-thinking individuals who don''t mind
    getting their hands dirty to get something done. Many of us do not think twice
    about buying brand-new radio for hundreds or thousands of dollars and popping
    the lid on it to see if we can modify it. We do not have to look hard to find
    myriad articles on how to modify different pieces of Amateur equipment. So, it
    is not surprising that we feel the same about the software we use.


    Open-source software and Amateur Radio are a natural fit. Few operators would
    buy a piece of radio gear if it came with a license that said they could not modify
    it, and it''s natural to see why a lot of us favor source in general and Linux.
    My personal computing journey with DOS in 1990, OS/2 in 1993, Windows in 1998
    and Linux since 2000. I taught myself how to write batch files in DOS, then started
    tinkering with C and eventually, C++. Then, after learning how to use those college-level
    classes to reclaim the right way. It''s almost an Amateur Radio tradition to do
    things backward first I started looking at Linux after IBM killed off its OS/2
    system in the late 1990s. It took more than four years until I felt comfortable
    with Linux, but in the past four years, it has been my primary operating system.
    For the past two years, it has become my only operating system on my desktop machines
    and my new Netbook.


    Open source on Linux already supplied me with most of the software I needed, with
    one exceptions: suitable Amateur Radio programs for soundcard modes. Several programs
    were available, but compared to a few of the Windows offerings, they were feature-poor,
    and their user interfaces were not friendly. I left on my Amateur Radio


    GARY L. ROBINSON


    **Fldigi to FldigiROL: an Amateur Radio operator''s digital journey to open source.**


    56 | january 2010 | www.linuxjournal.com'
