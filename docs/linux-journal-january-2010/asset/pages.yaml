    Typically, in frameworks as RSpec and Shoulda, the specification is written in
    code Cucumber takes a different approach, making it possible to write specifications
    in English, or other natural languages, and for the computer to translate these
    into an executable format. In this way, the tests are especially clear, not as
    readable as the code itself. I haven''t experienced this firsthand, but by using
    it makes it easier to discuss at meetings or in discussions. It should be possible
