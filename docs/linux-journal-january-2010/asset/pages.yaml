  md: 'pairing the lock. The first step was upgrading my firmware. My Vera was running
    1.0.434, 1.0602 was required for the lock, and the current version was 1.039.
    I went to learn the latest version, figuring I might have worked with X10, as
    a bonus.


    If you have never worked with X10, the process for Z-Wave is a breath of fresh
    air. Instead of messing with small toggles, you simply pull the door open and
    press a button to put it in pairing mode. Then you activate the Z-Wave device.
    Put the door back and start connecting. This is much easier if you are trying
    to lock a Z-Wave device, like a lot more seriously. As a result, the process is
    much more involved. It is a little more complicated, but it has a very strong
    signal (a result of trying to connect battery power and being inside the lock
    mechanism). That didn''t prove to be much of a problem, because I had a network
    and power port not far from the door.


    The door would dance, which meant starting the pairing process and then running
    the door to a programming code. After two attempts, I saw a green light from the
    lock. I was able to see the lock on the Vera device screen. Things should go smoothly
    from here on. I clicked on to unlock. Nothing seemed to happen. It turns out that
    the lock and Vera were talking, so they were still exchanging information—meaning
    that all my message was being received. I waited a few minutes, the lock and Vera
    were fully synced.


    If I was using the LinuxMCE the path is not as clear as I thought. I did some
    research, and I was not able to find anyone who reported having a lock with LinuxMCE.
    I would have used it, but I only found out how to lock out the door.


    Once the job was cleared, I was able to add myself as a user to the Vera. My profile
    on the Vera has my phone number so I can get SMS alerts. Vera supports the concept
    of "scenes". A scene allows you to tie an event, a notification and one or more
    to Z-Wave devices. I created a scene called Open, which was tied to the event
    that is generated when the door opened, and I set the scene to notify me via email
    and SMS.


