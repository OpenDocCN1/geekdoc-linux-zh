    functions you might think of—triggering a backup, running a certain process; sending-email
    and so.

    The knockmand accepts the following command-line options:


    +   - lets you specify a different configuration file, instead of the usual /etc/knockd.conf.

    - d makes knock a daemon in the background; this is the standard way of functioning.

    - ih provides syntax help.

    - lets you change which interface to listen on; by default, it uses whatever you
    specify in the configuration file or eth0 if none is specified.

    - allows you use DNS names for log entries, because this is considered bad practice,
    because forces your machine to lose stealthiness and do DNS traffic, could be
    monitored.


    +   - v produces more verbose messages.

    - D outputs debugging messages.

    - V shows the current version number.

    In order to require the knocks, you could use any program, but the knock comes
    with the knockd package is the usual choice. An example of its usage is shown
    knock_site_url:7885 for a TCP connection on port 7007. For UDP connection, either
    add the -u parameter, or knock site_url:7885. The -h parameter provides the simple
    syntax synopsis.


