    Furthermore, it is to consider that these parameters depend also on the current
    direction (charging or discharge). When the battery were at rest or under open-circuit
    condition $V_B = V_E$. When current is drawn from the battery, the voltage will
    be lower than $V_E$. When current is flowing into the battery, the terminal voltage
    will be higher than $V_E$. For, at each moment during discharge phase the terminal
    voltage can be derived as follow:


    ```

    $V_B = V_E - V_{in}$ \hfill (2-5)

    $$V_B = V_E - R_{in} \cdot I_B$ \hfill (2-6)

    ```


    where:

    $V_B$ = terminal voltage $[V]

    $V_E$ = equilibrium voltage $[V]

    $V_{in}$ = internal loss voltage $[V]

    $R_{in}$ = internal resistance $[\Omega]$

    $I_B$ = discharge current $[A]$


    Obviously, higher discharge current results in reduction of the terminal voltage.
    Therefore, to specify the state of the battery by the battery voltage, discharge
    current should be measured.


    In PV systems, it is necessary to know the performance of the batteries for longer
    period. Additional elements are therefore considered to explain a dynamic- and
    a quasi-static process (Fig. 2-15).


