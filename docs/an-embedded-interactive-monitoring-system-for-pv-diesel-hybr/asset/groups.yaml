  mdcn: "\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_166_0.png)\n\n## 附录 E：嵌入式硬件模块与模块\n\
    \n## E.1.2 MOPS520 技术数据\n\n### 技术数据\n\n### 产品概述\n\nMOPS520 是一款全新的 PC/104 CPU 板，与\
    \ PC/104 产品系列完美集成。它基于频率为 133 MHz 的 AMD™ SC523C，并提供了丰富的功能！这块高集成度板提供了 4xCOM、2x USB、1x100\
    \ Mbit 以太网以及用于扩展的 PC/104+。\n\n非常特殊的特性是已经集成了 1 MBR CAN 总线。不需要额外的昂贵扩展卡。由于功耗低，MOPS520\
    \ 不需要主动冷却。\n\n所有 PC/104 板都具有相等的键盘、COM12、44针 IDE 和 LPE 端口。可以与 Kontron PC/104 家族进行任何升级。\n\
    \nMPS520 提供 32 或 64 MByte SDRAM 的配置。与我们的 chipDISK（最高 25 MByte Flash）结合，可以实现非常坚固且可靠的系统，即使对于恶劣的应用环境也是如此。\n\
    \n板卡的 CAN 总线能够轻松与自动化和过程控制任务建立接口。\n\n...始终领先！\n\n- 总线：参考 PC/104 标准的 16 位-ISA 总线，以及用于\
    \ PC/104plus 的 32 位-PCI 总线\n- 处理器：AMD™ SC523C 133 MHz，带风扇底座\n- 系统内存：板载 16 或 64\
    \ MByte SDRAM\n- 功能：\n  - 1x CAN 总线 (1 MByte)，带有包含 CAN 收发器的 Intel™ RS237 CAN 控制器（可选）\n\
    \  - chipDISK：已准备好托管兼容 IDE 的闪存 chipDISK，容量高达 25 MByte\n  - 5x RS523C 带 FIFO\n\
    \  - 1x COM\n  - 1x ECP/EFP 并行\n  - 1x 用于 3.5\" 驱动器的 FIO\n  - 2x USB\n  - 1x PS/2\n\
    \  - 1x 本总线 HDD，最多支持两个硬盘\n  - 1x 全兼容键盘\n  - 1x 以太网/100-Base-\n- LAN 启动\n- EEPROM\
    \ 中的设置和串口\n- 门门狗\n- 尺寸：96 x 90 mm (3.8 x 3.6\")\n- 功耗：5 V，在 100 MHz 下约 750 mA\n\
    - 温度：运行：0°C 至 60°C；存储：-10°C 至 80°C（非冷凝）；运行：10% 至 90%；存储：5% 至 85%（非冷凝）\n- 湿度：\n\
    \n| 产品 | 部号 | 描述 |\n| --- | --- | --- |\n| MOPS520 | 01265-1300-1-3 | 低功耗 AMD™\
    \ SC523C 133MHz，板载 14 MByte SDRAM，3xRS523C，1xTTL，2xUSB，LPT，FOC，IDE，以太网 (10/100)\
    \ |\n| MOPS520 | 01265-3200-1-3 | 低功耗 AMD™ SC523C 133MHz，板载 12 MByte SDRAM，3xRS523C，1xTTL，2xUSB，LPT，FOC，IDE，以太网\
    \ (10/100) |\n| MOPS520 | 01265-4400-13-3 | 低功耗 AMD™ SC523C 133MHz，板载 64 MByte\
    \ SDRAM，3xRS523C，1xTTL，2xUSB，LPT，FOC，IDE，以太网 (10/100)，CAN总线，PC/104+ |\n\nKontron\
    \ Embedded Modules GmbH\nBrunweiesteg: 16\nD-Sta-Dorfendorf\n0800-saleskontron\n\
    0800-7253768\n\nE-4\n\n## E.2 GSM 调制解调器 M20\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_168_0.png)\n\
    \n### E.2.1 功能\n\n- 使用市售连接组件在系统环境中友好地集成\n- 数据、语音、传真和短信服务 (GSM 第二阶段)\n- 6 针西方连接器上的电源/点火线\
    \ (8 V 至 28.8 V DC，5% 纹波，防浪涌至 30V)\n- 12V 下电流消耗：待机状态（已电压，尚未点火）I=< 0.2 mA；空闲模式：I\
