    # An Embedded Interactive Monitoring System for PV-Diesel Hybrid Plants in Rural
    Areas


    Boonyang Plangklang


    Die vorliegende Arbeit wurde vom Bereich Elektrotechnik/Informatik der Universität
    Kassel als Dissertation zur Erlangung des akademischen Grades eines Doktors der
    Ingenieurwissenschaften (Dr.-Ing.).


    Erster Gutachter: Prof. Dr.-Ing. Jürgen Schmidt

    Zweiter Gutachter: Prof. Dr.-Ing. Albert Claudi


    Tag der mündlichen Prüfung 4. Februar 2005


    Bibliografische Information Der Deutschen Bibliothek

    Deutsche Bibliothek verzeichnet diese Publikation in der Deutschen Nationalbibliografie;
    detaillierte bibliografische Daten sind im Internet über http://www.ddb.de abrufbar


    Zugl.: Kassel, Univ., Diss. 2005

    ISBN 3-89958-128-8

    URN urn:nbn:de:0002-1280


