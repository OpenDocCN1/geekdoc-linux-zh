    # 第 2 章：光伏-柴油混合系统技术


    许多离网光伏混合系统中，光伏发电机直接连接到储能电池（特别是，这是我们测试台采用的连接方案）。因此，模块的工作点由实际电池电压决定。光伏与电池之间的不匹配损失源于实际运行电压与最大功率电压
    Vmpp 之间的差异；光伏阵列并未在与给定气象条件相对应的其最大功率点上运行。


    最大功率点跟踪器（MPPT）旨在减少光伏与电池之间的不匹配损失。然而，在使用此类设备时，必须考虑由于 MPP 跟踪器 DC/DC 转换效率导致的 MPPT
    损失。


    - 光伏阵列不匹配损失

    阵列不匹配损失是由形成光伏阵列的互联模块之间 I-V 曲线形状存在偏差引起的。因此，在给定的工作点下，阵列的总功率输出小于所有单个模块输出功率之和。

    光伏不匹配损失可能源于不同原因：(a) 相同类型模块的 I-V 曲线之间存在差异。这是由制造工艺的微小变化引起的；(b) 光伏发电机的局部阴影不仅由于辐射的空间变化产生不匹配损失（参见上文的捕获损失），还由于产生的温度差导致
    I-V 曲线偏差；(d) 不同支路或子阵列之间的电缆长度和电阻差异会导致额外的不匹配损失。


    - 布线损失

    布线损失包括系统组件之间所有的欧姆损耗。直流电缆电阻、继电器、开关或其他任何连接都导致了这种能量损失。光伏发电机并联支路中的反二极也构成了布线损失的一部分。由于交流电流通常低于直流电流，交流布线损失可以忽略不计。


    图 2-28 显示了典型光伏-柴油混合系统的能量流图。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_60_0.png)


    # 第 2 章：光伏-柴油混合系统技术


    ## 2.5 本项目选用的光伏-柴油混合系统概述


    本项目的光伏-柴油混合系统将根据小型交流母线光伏-柴油混合系统构建。发电单元包括一台柴油发电机、一个电池存储单元和几组光伏阵列。低压配电网为三栋不同的房屋提供电力。光伏场集成在房屋屋顶，其分布式理念是
    SMA 的 Sunny Island（太阳岛）。


    该项目的光伏-柴油混合系统包含以下组件：


    - 1 个电池单元：60V, 300 Ah (Exide OPZV 300)

    - 1 台电池逆变器：3.3 kW (SMA Sunny Island)

    - 2 组光伏场：2 x 1 kWp（朝向：垂直南向）

    - 2 台光伏逆变器：2x 850 W (SMA Sunny Boy 850)

    - 1 台备用发电机：3 kVA (Honda EX3000)

    - 负载：2 台冰箱、风扇、电视机、灯光

    - 负载控制：EIB 继电器和插座定时器


    图 2-29 至 2-31 展示了安装在卡塞尔大学 DeMoTec 学院、用于项目实施的光伏-柴油混合系统。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_61_0.png)


    图 2-29：项目光伏-柴油混合系统示意图


    ![](img/8191fe2ca5a41746557b10ddfe82a205_62_0.png)


    图 2-30：安装在卡塞尔大学 DeMoTec 大厅的光伏-柴油混合系统测试设施


    ![](img/8191fe2ca5a41746557b10ddfe82a205_62_1.png)


    图 2-31：用于系统的光伏模块


    # 第 2 章：光伏-柴油混合系统技术


    ## 2.6 总结


    光伏-柴油混合系统通过光伏阵列和柴油发电机的组合来发电。根据配置，可以将其分为三类：直流耦合混合系统、开关式混合系统和交流耦合混合系统。系统的主要组件包括光伏模块、电池、发电机和逆变器。


    光伏-柴油混合系统对于偏远地区的供电非常有吸引力：与燃料机系统相比降低了运行成本；与仅可再生能源系统相比降低了投资成本；由于发电机的冗余增加了可靠性。


    文献 [17] 给出了交流和直流母线系统的比较，对于没有燃料发电机的纯光伏系统，直流系统通常是优的。对于混合系统，随着太阳能比例的减少，交流系统相比直流系统变得越来越高效。因此，当柴油能量占比较高且白天使用大量能量时，应推荐交流系统；而在晚间消耗量且太阳能占比较高时，应优先选择直流系统。


    为了给偏远村庄估计合适的功率供应系统，负载曲线是必要的。每个偏远村庄的负载曲线不同。必须对负载曲线的研究才能合理设计混合系统。


    必须识别系统中的能量损失以避免这些损失。离网光伏混合系统中所有相关能量损失的分类被称为捕获损失。


    光伏-柴油混合系统根据……安装。


    # 第 3 章：嵌入式 Linux 模块：软件与硬件


    ## 3.1 引言


    如所述，本项目的目标是描述嵌入式模块、软件和硬件。嵌入式系统最早于 20 世纪 60 年代用于通信领域的机械电话交换机。随着计算机行业过去十年的发展，嵌入式系统也随之进步，为小型提供了更多功能。


    ## 3.2 引言


    嵌入式系统是用于控制特定问题或工作规范设备的计算机。通用计算机通常具有通用任务。嵌入式系统的任务是的。


    ## 3.3 操作系统的现状


    如今大多数计算机使用 Windows 作为操作系统。操作系统是作为用户和计算机之间中介的程序。


    ## 3.4 嵌入式操作系统


    嵌入式操作系统出现于 20 世纪 70 年代后期，今天有多种可行选择，如 VxWorks、pSOS、Nucleus、嵌入式 Linux 和 Windows
    CE。


    ## 3.5 为什么选择 Linux？


    Linux 的强大、可靠、灵活和可扩展性，加上其对多种微处理器架构、硬件设备、图形支持和通信协议的支持，使 Linux 成为一个日益受欢迎的项目和产品平台。


    Linux 是开放且免费的。其支持软件组件已经演进到能够适应 Linux 的市场和应用的多样需求。因此，Linux 是低成本运行的最佳选择。


