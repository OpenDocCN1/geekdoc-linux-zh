    # Chapter 2: PV-Diesel hybrid system technology


    Many stand-alone PV hybrid systems, the PV generator is directly wired to the
    storage battery (in particular, this is the connection scheme of our test bed).
    Hence, the operating point of the modules is defined by the actual battery voltage.
    PV-battery mismatch losses are due to the difference between the actual operating
    voltage and the maximum power voltage Vmpp; the PV array does not function at
    its maximum power point corresponding to the given meteorological conditions.


    Maximum power point tracker (MPPT) aims at reducing the PV-battery mismatch losses.
    However, when using such a device, MPPT-losses due to the DC/DC conversion efficiency
    of the MPP-tracker must be considered.


    - PV array mismatch losses

    Array mismatch losses are caused by deviations between the shapes of the I-V curves
    of interconnected modules which form the PV array. As a result, the overall power
    output of the array is smaller than the sum of output powers of all individual
    modules at a given operating point.

    PV mismatch losses can be of different origins: (a) differences between I-V curves
    exist for modules of the same type. They are caused by small variations in the
    manufacturing process; (b) partial shading of the PV generator does not only create
    mismatch losses due to the spatial variation of the irradiation (see capture losses
    above) but also due to the resulting temperature differences, leading to deviations
    of the I-V curves; (d) differences in cable length and resistance of different
    strings or sub-arrays may cause additional mismatch losses.


    - Wiring losses

    Wiring losses comprise all ohmic losses between system components. DC cable resistances,
    relays, switches or any other connections contribute to this energy loss. Blocking
    diodes in parallel strings of the PV generator also form part of the wiring losses.
    Due to the usually low AC currents compared to DC currents, AC wiring losses can
    be neglected.


    Figure 2-28 shows an energy flow diagram for a typical PV diesel hybrid system.


