    # Nomenclature


    - $C_{act}$ : The actual capacity of the battery [Ah]

    - $C_p$ : Parallel capacitor in equivalent circuit of battery [$nF$]

    - $DOD$ : The depth of discharge of battery in %

    - $E_{IN}$ : Energy input to system [kWh]

    - $E_{LOAD}$ : Energy supplied to the load [kWh]

    - $E_{LOSS}$ : Energy losses [kWh]

    - $E_{MG}$ : Energy generated by the motor generator [kWh]

    - $E_{PV}$ : Energy generated by the PV array [kWh]

    - $E_{OUT}$ : Energy output from system [kWh]

    - $I$ : Battery current, which should be provided [A]

    - $I_B$ : Discharge current of battery [A]

    - $I_{cell}$ : Current from PV cell [A]

    - $I_{ph}$ : Photocurrent [A]

    - $I_{PV}$ : Output Current of the PV-cell [A]

    - $I_D$ : Diode current [A]

    - $I_O$ : Dark current [A]

    - $I_{mpp}$ : Current at maximum power point of PV module [A]

    - $I_S$ : Self-discharge current in battery [A]

    - $I_{sc}$ : Current from PV cell when short circuit [A]

    - $k$ : Boltzmann constant [$8.65 \times 10^{-5}$ EV/K]

    - $q$ : elementary charge [$1.6 \times 10^{-19}$ As]

    - $Q_{Bat}$ : The Ah-balance (i.e. net Ah discharged or charged since the last
    state of charge)

    - $C_{nom}$ : The nominal capacity of the battery (Ah)

    - $Q_D$ : The amount of charge able to be recalled from the battery [Ah]

    - $Q_C$ : The amount put in during charging [Ah]

    - $R_{in}$ : An internal resistor in equivalent circuit of the lead-acid battery
    [Ohm]

    - $R_{load}$ : Pure resistance load [Ohm]

    - $R_{p}$ : Parallel resistance in equivalent circuit of battery [Ohm]

    - $R_{s}$ : Self-discharge resistance in the equivalent circuit of battery [Ohm]

    - $R_{G}$ : A resistor of Zenor diode in the equivalent circuit of battery gating
    loss [Ohm]

    - $R_{Q}$ : Drop resistance in the equivalent circuit of the battery [Ohm]

    - $SOC$ : The state of charge (SOC) of the battery in percent [%]

    - $t$ : Charge or discharge time of the battery [h]

    - $T$ : diode temperature [K]

    - $T_{cell}$ : Temperature of the PV cell (C)

    - $V$ : Voltage [V]

    - $V_{B}$ : Terminal voltage of the battery [V]

    - $V_{p}$ : A polarization voltage loss in the battery [V]

    - $V_{C}$ : Average charging voltage [V]

    - $V_{D}$ : The average discharge voltage [V]

    - $V_{E}$ : A voltage source with an equilibrium voltage in the equivalent circuit
    of the lead-acid battery [V]

    - $V_{in}$ : Internal loss voltage of the battery [V]

    - $V_{k}$ : Compensate value for calculation $V_{E}$ of the battery $V_{k} = 0.84...0.88$

    - $V_{mppp}$ : Voltage at maximum power point (MPP) of the PV module [V]

    - $V_{oc}$ : open-circuit voltage of the PV cell [V]

    - $V_{p}$ : The maximum power output of the PV module [Watt]

    - $\eta_{i}$ : Columbic efficiency in %

    - $\eta_{\sigma}$ : Overall efficiency of the battery in %

    - $\eta_{v}$ : Voltage efficiency in %


    # Glossary of Terms


    - AC : Alternating current (AC), household utility current in most countries is
    AC with a frequency of 50/60 hertz (60 complete cycles per second).

    - AM : Air mass

    - API : An application program interface (API - sometimes spelled application
    programming interface) is the specific method prescribed by a computer operating
    system or by an application program by which a programmer can make requests of
    another.

    - ARP : Address Resolution Protocol (ARP) is a protocol for mapping Internet Protocol
    (IP) address to a physical address that is recognized in the local network. There
    is Reverse RARP (RARP) for machines that do not know their IP address.

    - ASCII : ASCII (American Standard Code for Information Interchange) is the most
    common format for files in computers and on the Internet. Each alphabetic, numeric,
    or special character is represented with a 7-bit binary number (0-1s).

    - BIOS : BIOS (basic input/output system) is the computer''s microprocessor used
    to get the computer started after turning it on. It also manages data flow between
    the computer and attached devices such as the hard disk, video adapter, mouse,
    and printer.

    - Bootdisk : installation floppy disk for Linux

    - Broadcast : On the Internet, Web sites deliver original radio and television
    broadcasts, using streaming techniques, to anyone who visit the Web site.

    - BUS : In an electrical term, a bus is a transmission line on which electrical
    power is dropped off or picked up at every device.

    - CD-ROM : CD-ROM (Compact Disc, read-only memory) is an adaptation of the CD
    designed to store computer data in the form of text and graphics as well as hi-fi
    sound.

    - CGI : The common gateway interface (CGI) is a standard way for a Web server
    to pass a user''s request and receive data back. When the user requests a Web
    page (for example, by clicking on highlighted word or entering a Web address),
    the server sends back the requested page usually needs to be processed by an application
    program. This method or convention for passing data back and forth between the
    server and application is called common gateway interface (CGI). It is part of
    the Web''s Hypertext Transfer Protocol (HTTP).

    - ChipDISK : high capacity storage flash memory that is electrically compatible
    with IDE disk drive provide up to 500 Mbyte of formatted storage capacity and
    will be expanded to even higher capacities in the future.

    - Client/server : Client/server describes the relationship between two computer
    programs in which one program, the client, makes a service request from another
    program, the server, which fulfills the request.

    - CPU : CPU (central processing unit) is the central unit in a computer containing
    the logic circuitry that performs the instructions of computer programs.

    - Day profile : The load profile represents the load demand on day time, which
    the power available from the PV generators.

    - DC : DC (Direct current) is the unidirectional flow or movement of electric
    carriers. The intensity of the current can vary with time, but the general direction
    of movement stays at all times. As an adjective, the term DC is used in reference
    to voltage polarity never reverses.

    - DPP : Deep discharge protection of the battery

    - Embedded system : An embedded system is some combination of computer hardware
    and software, either fixed in capability or programmable, that is specifically
    designed for a particular kind of application device. Industrial machines, automobiles,
    medical equipment, cameras, household appliances, airplanes, vending machines,
    and toys (as well as more obvious cellular phone and PDA) are among the myriad
    possible hosts of an embedded system. Embedded systems that are programmable are
    provided with a programming interface, and embedded systems programming is specialized
    occupation.

    - Ethernet : Ethernet is the most widely-installed local area network (LAN) technology.
    Specified in a standard IEEE 802.3, Ethernet was originally developed by Xerox
    and then developed further by Xerox, DEC, and Intel. An Ethernet LAN typically
    uses coaxial cable or special grades of twisted pair wires. Ethernet is also used
    in wireless LANs. The most commonly installed Ethernet systems are called 10BASE-T
    and provide transmission speeds up to 10 Mbps. Devices are connected to the cable
    and compete for access using a Carrier Sense Access with Collision Detection (CSMA/CD)
    protocol.

    - FTP : File Transfer (FTP), a standard Internet protocol, is the simplest way
    to exchange files between computers on the Internet. FTP is commonly used to transfer
    Web pages from their creator to the computer that acts as their server for everyone
    on the Internet.

    - Gateway : A gateway is a network that acts as an entrance to another network.

    - gcc : The GNU Compiler Collection (GCC) is the GNU compiler. GCC is the most
    important piece of open source software. Even other languages, like Perl and Python,
    are written in C, which is compiled by the GNU compiler. Linux is possible because
    of GCC. GCC compiles several languages, the fundamental language of GCC is C.

    - Genset : A generator with a start and stop controller.

    - glibc : glibc is the GNU C Library. It currently runs unmodified on GNU Hurd
    systems and i386, m86k, and alpha systems.

    - GNU : GNU is a Unix-like operating system that comes with source code that can
    be copied, modified, and redistributed. The GNU project was started in 1983 by
    Richard Stallman and others, who formed the Free Software Foundation. Stallman
    believes that users should be free to do whatever they want with software they
    acquire, making copies for friends and modifying the source code and repackaging
    it with a distribution.

    - GSM : GSM (Global System for Mobile communication) is a digital mobile telephone
    system that is widely used in Europe and other parts of the world. GSM uses a
    variation of time division multiple access (TDMA) and is the most widely used
    of the three digital wireless telephone technologies (TDMA, GSM, and CDMA). GSM
    digitizes and compresses data, then sends it down a channel with two other streams
    of user data, each in its own time slot. It operates either at the 900 MHz or
    1800 MHz frequency band.

    - Host : A host is a computer with a Web server that serves the pages for one
    or more Web sites.

