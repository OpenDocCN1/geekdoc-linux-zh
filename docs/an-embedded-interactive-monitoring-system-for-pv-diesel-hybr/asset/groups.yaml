    ## 3.6 嵌入式 Linux


    由于 Linux 支持多处理器系统并具有开源优势，它非常适合嵌入式网络设备。与通用计算机不同，嵌入式系统实际上只需要较少的软件即可完成一组特定的任务。这意味着软件对内存的需求较低，这对于不包含硬盘且内存存储有限的嵌入式系统至关重要。


    嵌入式 Linux 是 Linux 的子集，经过精简后仅包含嵌入式系统中有用的 Linux 元素。例如，嵌入式系统通常使用 FLASH 驱动器代替硬盘文件系统。嵌入式
    Linux 启动只需几秒钟，并适用于几兆字节的 FLASH 内存。嵌入式 Linux 携带任何特定产品所需的任何或全部功能，并可以运行任何适用于目标嵌入式系统且有用的
    Linux 软件。图 3-2 显示了嵌入式 Linux 的市场状况。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_66_0.png)


    来源：Evans Data Corporation 2001 嵌入式系统开发者调查


    图 3-2：嵌入式 Linux 状态


    图 3-2 表明嵌入式 Linux 是嵌入式系统最喜欢的。Linux 是一个健壮的操作系统，已被证明具有高度可靠性。嵌入式 Linux 是一种高性能软件，通过包含专用功能或实时扩展，可以针对特定应用程序进行优化。它为项目的命运提供了安全保障
    [7,26,28]。图 3-3 显示了开发者在嵌入式应用中使用嵌入式 Linux 的原因。


    | 0% | 5% | 10% | 15% | 20% |

    |---|---|---|---|---|

    | 源代码可用（且免费） | | | | | |

    | 无运行时版税 | | | | | |

    | Linux 更健壮/可靠 | | | | | |

    | Linux 具有出色的网络支持 | | | | | |

    | 有更多驱动程序和工具可用 | | | | | |

    | 许多程序员熟悉 Linux | | | | | |

    | 它不是来自微软的 | | | | | |

    | 其他 | | | | | |


    来源：LinuxDevices.com 调查，2000年12月 - http://www.linux devices.com/polls/


    图 3-3：使用嵌入式 Linux 的原因


    图 3-3 显示，免费的源代码是使用嵌入式 Linux 的主要原因。


    ## 3.7 项目的嵌入式 Linux


    如目标所述，项目需要一个小型嵌入式操作系统来支持监控系统的特定任务，且如前节所示，嵌入式 Linux 适用于嵌入式项目。为了为项目实现嵌入式 Linux，必须规范嵌入式
    Linux 的要求和项目的要求。本节将介绍项目中的嵌入式 Linux。


    ### 3.7.1 嵌入式 Linux 要求


    嵌入式 Linux 的原理与典型的 Linux 系统相同。典型的桌面 Linux 系统有三个主要的软件层 [7]：Linux 内核、C 和应用程序代码，如图
    3-4 所示。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_68_0.png)


    从图 3-4 可以看出，内核对硬件具有完全控制权。它的驱动程序代表应用程序与硬件通信。内核上的一层是典型 Linux 系统中的 C 库。除此之外，C 库会调用内核，将参数从应用程序代码传递给内核。最后，离硬件远的是应用程序代码。应用程序导致
    Linux 内核（或某些应用程序中的硬件）执行预定任务。


    在设计嵌入式应用时，重要的是意识到这种层次结构是打破的。对于某些不使用 C 库的应用程序，可以在内核本身中作为内核线程运行，但这不具有移植性。本项目中的监控系统，应用程序将使用
    C 库。


    ### 3.7.2 项目要求


    如第 1 章所述，交互式监控网站将使用互联网技术在网站上提供监控数据。操作人员可以通过网络浏览器访问数据。通信是通过 TCP/IP 网络上的 GSM 调制解调器。监控系统由监控单元（传感器单元）、数据采集单元和通信单元组成。数据采集单元将从传感器单元采集监控数据并存储在
    Web 服务器中。操作人员有可能通过标准网络浏览器下载数据以及在线设置操作参数。因此，系统的要求可以规范如图 3-5 所示：


    ![](img/8191fe2ca5a41746557b10ddfe82a205_69_0.png)


    图 3-5：监控系统软件要求


    ### 3.7.3 嵌入式 Linux 选择


    在批准项目要求后，嵌入式 Linux 准备满足所有要求。开发方向由内核移植、源代码和内核版本组成。所有 CPU 架构都必须存在内核端口，以便于选择硬件时具有灵活性。使用三个软件层（内核、C
    库和静态链接的应用程序（或静态应用程序））的最小嵌入式 Linux 应用，是构建嵌入式 Linux 最简单的方法。


