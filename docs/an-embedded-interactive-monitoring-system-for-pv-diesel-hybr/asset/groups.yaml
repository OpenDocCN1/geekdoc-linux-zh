    \ $V_{oc}$ 可以推导出：\n\n```\n$V_{oc} = \\frac{kT}{q} \\cdot \\ln\\left(\\frac{I_{ph}}{I_0}\\\
    right) \\quad (2-4)$\n```\n\n$q$ 元电荷 [$1.6\\times10^{-19}$ 库仑]\n$k$ 玻尔兹曼常数 [$8.65\\\
