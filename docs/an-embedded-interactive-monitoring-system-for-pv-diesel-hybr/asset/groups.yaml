    # 5.5.2 The monitored data from the PV inverter


    The monitored data of PV inverter indicates energy situation from radiation. As
    the PV diesel hybrid system is the combination of solar energy and diesel generator.
    It is very important to analyze the monitored data for PV inverter order to evaluate
    the system ability and improve the system sizing.


    The PV inverter completely consumes energy by itself. The PV inverter will activate
    itself when radiation is high at the start voltage of PV inverter. When the PV
    inverter is activated, PV power will be supplied to the system. The PV inverter
    will deactivate when the PV voltage is lower than the stop voltage of PV inverter.
    The start and stop voltage of PV inverter can be adjusted via website. Figure
    5-25 shows a graph of PV power from the PV inverter.


    From figure 5-25, PV inverter begins to connect the PV power to the system at
    about 9.00 AM when the sun radiation was high enough and disconnects from the
    system at about 19.30 PM when the radiation was lower than the stop voltage. The
    PV power is increasing when the radiation was usually at midday.


