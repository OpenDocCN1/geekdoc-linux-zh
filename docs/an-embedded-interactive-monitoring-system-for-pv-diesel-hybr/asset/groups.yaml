    www.upress.uni-kassel


    Umschlaggestaltung: 5 Büro für Gestaltung, Kassel

    Druck und Verarbeitung: Unidruckkerei der Universität Kassel

    Printed in Germany


    # Acknowledgements


    A fundamental and unique debt is owed to Rajamangala University of Technology
    (RMUT), (former was Rajamangala Institute of Technology, RIT), Thailand, which
    has granted me the financial support for this thesis. I am most grateful and highly
    indebted to Prof. Dr.-Ing. Jürgen Schmid for his valuable supervision, guidance,
    and encouragement throughout the whole work.


    My gratitude is also due to Prof. Albert Claudi for his strong support and useful
    discussions throughout this thesis.


    The main part of research has been done at the Department of Efficient Energy
    Conversion (IEE-RE), University of Kassel, Germany, thus my thanks are expressed
    to the research staffs and colleagues of IEE-RE.


    To my family and friends, thanks for always being with me and for the love and
    understanding.


    Boonyang Planglang


    # Abstract


    Autonomous PV-Diesel hybrid power systems are installed worldwide to supply electricity
    in remote and rural areas where no grid exists and where accessibility is often
    difficult. In this environment, it is also difficult to properly monitor the PV-Diesel
    hybrid systems in a conventional way.


    In order to keep the PV diesel hybrid system working properly and reliably, it
    is necessary to include a monitoring system. The thesis will describe an interactive
    web based technology with embedded Linux system for remote monitoring of the PV
    diesel hybrid system.


    In most remote monitoring systems, the information is collected from the remote
    station to master station. Most photovoltaic systems under some types of monitoring
    at least a few years after their installation. Common systems in such rural areas
    are supervised by yearly visits in conjunction with a data logger. Over the lifetime
    of a system, costs for supervision significantly exceed the cost of the system
    itself. Response time for maintenance, repair, and product improvements are poor.
    There are already some monitoring systems which have been presented earlier as
    SCADA (Supervision Control and Data Acquisition) or even satellite-based systems.
    However, the recognized problems for those methods are: high investment cost,
    needs for special software for client stations, and difficulty with communication
    links.


    Using the internet for monitoring is another option that becomes feasible lately.
    However, to implement the internet with the hybrid system in remote and rural
    areas it is still inefficient in both technical and economic terms. Because of
    the problem that there is no telephone line coverage and internet connection in
    remote areas. Moreover, a typical computer for a web server consumes much energy.


    To overcome these disadvantages, an embedded Linux module with an interactive
    monitoring website has been investigated and developed in this thesis. This is
    a small-embedded Linux module for an Apache web server with an extremely low power-input.
    The embedded embedded module provides a common web server and data acquisition
    unit. The monitoring database can be stored in the web server and connected to
    a workstation by a GSM module. The communication will be based upon GSM technology.
    The monitoring database can be accessed via a standard web browser. When accessing
    the website, the operator can download monitoring data as well as upload important
    parameters to the system.


    With the implementation of embedded web based technologies, investigations on
    both, initial costs and running costs of monitoring system have been performed.
    The ability to access the data and to change operation parameters online via a
    standard web browser has been implemented.


    The results of implementation on the embedded interactive monitoring system will
    be considered as criteria to prove itself whether it is a suitable solution for
    remote monitoring where there is a lack of infrastructure. The monitored data
    will be analyzed to investigate the behavior of the PV diesel hybrid system in
    order to optimize and improve the system.


    # Zusammenfassung


    Netzautarke PV-Diesel-Hybridsysteme sind weltweit installiert, um abgelegene und
    ländliche Regionen mit elektrischer Energie zu versorgen, die weder einen Anschluss
    an ein elektrisches Versorgungsnetz noch über ein Telefonnetz verfügen und die
    zwar oft schwer erreichbar sind. Immer mehr wird es schwierig, PV-Diesel-Hybridsysteme
    zu regeln und einen guten und zuverlässigen Betrieb aufrechtzuerhalten.


    Ein PV-Hybridsystem stabil und zuverlässig zu betreiben, ist es notwendig, ein
    Überwachungssystem zu integrieren. In dieser Arbeit wird eine interaktive, webbasierte
    Technik mit einem eingebetteten Linuxsystem für den Einsatz als Fernüberwachung
    in einem PV-Diesel-Hybridsystem untersucht und entwickelt.


    In den meisten im System aufgezeichneten Daten an ein Mastersystem weitergegeben.
    Die meisten PV-Systeme in den ersten Jahren nach ihrer Installation verschiedenen
    Überwachungsverfahren unterzogen. Im Allgemeinen werden die Systeme in abgelegenen
    Gebieten inlicher Kontrollbesuche mit einem Datenlogger überwacht. Während der
    Kosten für Überwachung deutlich die Kosten für das System übersteigen die realisierbaren
    Reaktionen auf Wartung, Reparatur und Systemverbesserungen. Es gibt früher bessere
    Überwachungssysteme wie SCADA (Supervision Control and Data Acquisition) oder
    satellitengützte Systeme. Allerdings weist diese Systeme bestimmte Nachteile auf:
    hohe Investitionskosten, notwendige Anschaffung Software für das Clientsystem
    und Probleme mit der Kommunikation.


    In letzter Zeit ist als neue Option die Nutzung des Internets zur Überwachung
    hinzugekommen. Doch ist eine Implementierung des Internets im Hybridsystem in
    abgelegenen Ländern sowohl in technischer als auch in ökonomischer Hinsicht ineffizient,
    da vor Ort häufig eine Infrastruktur mit Telefonleitungen ohne Internetbindung
    besteht. Zudem Computer für Webserver teuer.


    Um diese Nachteile zu überwinden, wird in dieser Arbeit ein eingebettetes interaktiven
    Überwachungssystem untersucht und entwickelt. Es handelt sich um ein kompaktes
    eingebettetes Linuxmodul für einen Apache Webserver mit geringem Energieverbrauch.
    Das eingebettete Modul stellt einen gewöhnlichen Webserver und eine Datenerfassungseinheit
    bereit. Die aufgenommenen Daten werden im Webserver gespeichert und über ein GSM-Modem
    an eine Workstation angeschlossen. Die Kommunikation basiert auf GSM-Technik.
    Während des Zugiffs auf die Website kann der Nutzer so die gespeicherten Daten
    herunter und beliebige Parameter an die Systemkomponenten steuern.


    Mit der Implementierung, basierend auf eingebetteter Webtechnologie, wird der
    Einfluss der Investitionskosten und die laufenden Kosten des Datenerfassungssystems
    untersucht. Die Möglichkeit des Zugiffs auf die aufgezeichneten Daten und des
    Eingiffs in Systemparameter online über einen Browser wird ebenfalls implementiert,
    um die Funktion des Überwachungssystems zu verbessern.


    Die Ergebnisse der Implementierung in dem eingebetteten Linux-Überwachungssystem
    werden als Kriterium dafür herangezogen, ob sich dabei eine geeignete Lösung für
    Fernüberwachung abgelegener Systeme handelt. Die aufgezeichneten Daten werden
    analysiert, um das Verhalten des PV-Diesel-Hybridsystems im Hinblick darauf zu
    untersuchen, wie das System zukünftig verbessert werden kann.

