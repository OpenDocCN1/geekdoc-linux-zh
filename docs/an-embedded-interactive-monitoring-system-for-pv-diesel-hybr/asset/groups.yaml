    a lot of energy is used during the day, while the DC system should be preferred
    for high evening consumptions and high solar fraction.


    Load profiles are necessary in order to estimate an adequate power supply system
    for a remote remote village. Load profiles are different for each remote village.
    The study of load profiles must be done in order to properly design the hybrid
    system.


    Energy losses in the system have to be identified in order to avoid those losses.
    A classification of all relevant energy losses in a stand-alone PV hybrid system
    is given as Capture losses and System losses.


    The PV diesel hybrid system is installed for the project according to the AC bus
    configuration and using the load profile of remote electrification.'
