    ## 4.5.3 两种模型的比较与评价


    TCP/IP 和 OSI 模型都基于独立协议栈的概念。两者的功能是相同的。TCP/IP 模型是互联网世界的实际参考标准。与 OSI 模型相关的协议已很少被使用
    [21, 31]。


    OSI 模型可能是研究得最多、最受共同接受的网络结构，但它并不是真正实现并使用的模型。分析这一失败的专家们确定了四个主要原因：时机不恰、实现不当以及策略不当
    [21]。


