    # Chapter 6: Conclusions


    The interactive website is a dynamic website that allows the operator to view
    and download data from the website as well as input some data to the website.
    The interactive website is a combination of an HTML document and a PHP script.


    The HTML document is a script language that allows Web publishers to create complex
    pages of text and images that can be viewed by anyone on the Web. The programmer
    can write the HTML text code to create a website to the public.


    PHP script is a widely used Source general-purpose scripting language that is
    especially suited for Web development and can be embedded into HTML. The main
    goal of the language is to allow web developers to write dynamically generated
    pages.


    The thesis has illustrated that the interactive website, with a combination of
    HTML and PHP script, is suitable for the monitoring system under investigation.


    The thesis has developed an interactive monitoring website, which is a combination
    of an interactive website and a monitoring system. The operator can request data
    from the interactive monitoring website via a standard web browser. The HTML document
    will serve for the request of data from the operator. To send parameters to the
    website, the PHP language will support this action.


    The monitoring system is written in C language. All source codes are compiled
    and linked into library of embedded Linux operating system. The software works
    compatibly with Inverter''s commands. The monitoring system sends a command to
    the inverter via RS-232 communications. The microcontrollers in the inverter react
    to a command and answer to the monitoring software. When the software receives
    an answer from the inverter it stores data into the memory at the web server as
    a text file. Name of a file is the date of monitoring.


    The implementation and its results in chapter 5 show that the interactive monitoring
    website is suitable to be utilized for a monitoring system in remote areas. The
    operator accesses the interactive monitoring website by a GSM modem. The monitoring
    data as a text file can be accessed via a standard web browser. When accessing
    the website, the operator can view and download the monitored data from the website
    as well as upload parameters to the system.


    The operator has ability to access the up-to-date monitored data and to change
    operation parameters online. This can improve the reliability of the hybrid system.
    The operator. By analysis of the monitored data, the operator can learn the behavior
    of the system from the analysis in order to make an optimization of the system
    in the future. In addition, these advantages can also improve the public image
    of renewable systems, proving their interest in the PV area.


    The results in the thesis have shown that a low-power embedded module with an
    embedded Linux operating system can be utilized for an interactive remote monitoring
    website for a PV-diesel hybrid system. With wireless communication networks expanding,
    it is attractive to allow the data to be transmitted directly to the main station.


    Furthermore, because of using the open source software, the interactive monitoring
    system proposed requires very low investment cost. It requires no additional operation
    costs. There is no need for any special software at the workstations.'
