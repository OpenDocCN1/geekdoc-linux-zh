    TCP : TCP (Transmission Control Protocol) is a set of rules (protocol) used along
    with the Internet Protocol (IP) to send data in the form of message units between
    computers over the Internet. While IP takes care of handling the actual delivery
    of the data, TCP takes care of keeping track of the individual units of data (called
    packets) that a message is divided into for efficient routing through the Internet.


    TCP/IP : TCP/IP (Transmission Control Protocol/Internet Protocol) is the basic
    communication language or protocol of the Internet. It can also be used as a communications
    protocol in a private network (either an intranet or an extranet).


    Telnet : Telnet is the way to access someone else''s computer, by permission.


    THD : Total harmonic distortion


    TransIndo : The measured load profile, with an important evening peak is typical
    for rural villages.


    UDP : UDP (User Datagram Protocol) is a communications protocol that offers a
    limited amount of service when messages are exchanged between computers in a network
    that uses the Internet Protocol (IP). UDP is an alternative to the Transmission
    Control Protocol (TCP) and, together with IP, is sometimes referred to as UDP/IP.
    Like the Transmission Control Protocol, UDP uses the Internet Protocol to actually
    get a data unit (a datagram) from one computer to another. Unlike TCP, UDP does
    not provide the service of dividing a message into packets (datagrams) and reassembling
    it at the other end. Specifically, UDP does not provide sequencing of the packets
    that data arrive. This means that the application that uses UDP must be able to
    make sure the entire message has arrived and is in the right order.


