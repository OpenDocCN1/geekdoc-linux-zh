    ## 3.9 Web 服务器概述


    Web 服务器是运行在主机计算机上并提供网站服务的程序。换句话说，Web 服务器程序驻留并等待访问者浏览器对其拥有的对象发出请求，并将这些对象发送回供访问者查看。Web
    服务器提供的对象包括 HTML 文档、纯文本、图像、声音、视频和其他形式的数据。Web 服务器和浏览器之间使用 HTTP（超文本传输协议，见下一节）进行通信，这是一种在网络上请求和传输数据的简单且有效的语言。因此，某些
    Web 服务器被称为 HTTP 服务器。


    Web 服务器有各种形状和大小。它们运行在不同的操作系统上，具有不同的功率复杂度，价格从昂贵到免费不等。Web 服务器通常被提到位于机房某处的具有强大处理能力内存的机器。它由：


    > 整个 Web 服务器 = 计算机硬件 + 操作系统

    > Web 服务器软件 + 信息内容


    # 第3章：嵌入式 Linux 模块：软件与硬件


    操作系统区分了 Web 服务器运行的平台（Windows、UNIX、AS/400 和大型机）。


    Web 软件是一个持续循环的服务器，等待 Web 客户端（浏览器或其他）对网络文档的请求。它将解析请求、分类请求并执行相应的操作。操作可能是执行脚本、返回文档、访问远程数据库等。Web
    服务器必须理解来自客户端的请求，必须保持相同的语言或协议：超文本传输协议 (HTTP)。


    端口类似于电话分机。当客户端程序连接到网络上的服务器时，它会请求服务器程序的端口。该端口精确指示了源客户端想要连接到哪个服务器端口。数据随后写入出站端口（客户端计算机），到达服务器的入站端口并在那里被读取。Web
    服务器有一个默认端口，如果客户端未指定连接到哪个端口，它将默认为端口 80。默认端口的另一种说法是“已知端口”。因此，Web 服务器的已知端口是 80。


    信息内容是 Web 服务器提供的信息。它可以是来自本地磁盘、数据库或远程位置的数据，且对客户端透明。


    ## 3.10 超文本传输协议 (HTTP)


    HTTP 定义了一种简单的请求-响应语言。Web 客户端通过 HTTP 与 Web 服务器建立连接。HTTP 定义了如何正确表述请求以及响应应该是什么样。它没有定义网络连接如何建立或管理，也没有定义信息如何实际传输；这些由较低的协议（如
    TCP/IP）完成。


    一个 HTTP 请求包含以下内容：


    1. 方法，必须是一组合法操作之一

    2. 通用资源标识符 (URI)，它是信息请求的

    3. 协议版本

    4. 可选的补充信息


    一个 HTTP 响应包含以下内容：


    1. 状态行，指示成功或失败

    2. 响应的描述

    3. 实际信息


