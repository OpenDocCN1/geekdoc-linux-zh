    图 1-7：电气化电力技术分类 [6]


    图 1-7 展示的电力供应领域分类包括对各种能源在整个功率范围内应用潜力的估计。通过这种，结合不同能源的单一系统混合系统提供了利用可用再生能源的最佳可能。混合系统技术主要涵盖独立系统以及中小型孤岛网。此外，混合系统可以扩展到区域性和跨区域电网。


    根据上述优点，光伏柴油混合系统越来越多地用于全球偏远和农村地区的供电。考虑带电池的光伏柴油混合系统时的问题包括能源的高利用、燃料节省、系统可靠性和使用寿命考虑
    [4]。


    ## 1.3 混合系统的监控


    光伏柴油混合系统越来越多地用于偏远地区的供电。因此，对于消费者来说必须是一个技术可靠的系统。为了保持混合系统的可靠运行，有必要包含一个持续监控混合系统的系统。监控的主要目标
    [9] 包括：


    - 确保系统运行正常

    - 评估系统组件性能，找出故障设备或性能低于额定的设备

    - 允许校准

    - 揭示设计改进并增加设计者的理解


    在大多数远程监控系统中，信息从远程站收集到主站。农村地区的系统通常通过结合数据记录仪进行年度访问。但这种方法导致维护响应时间效率低下，而且产品改进较差。早有一些监控系统被提出，如
    SCADA（监控控制和数据采集）或卫星监控 [10,11]。然而，这些方法的已知问题是：投资成本高、客户端站和通信链路需要特殊软件。所有这些劣势使得混合系统在经济性能上无效。


    由于互联网已成为强大的信息源，互联网监控已引入混合系统 [12]。利用互联网技术，所有的劣势都可以被消除。互联网监控系统使用 TCP/IP 网络。大多数情况下，这种通信链路已经存在。因此，不再缺少通信链路。监控数据存储在
    Web 服务器上。人员可以通过标准浏览器访问监控数据。


    然而，互联网监控只有在提供互联网连接的地方才可能。在农村地区，由于基础设施，实施互联网监控很难。此外，安装 Web 服务器提供监控数据的计算机通常消耗大量能量。这对于能源有限的偏远地区监控系统是一个劣势。


