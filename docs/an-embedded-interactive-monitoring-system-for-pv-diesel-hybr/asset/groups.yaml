    ## 3.10 Hyper Text Transfer Protocol (HTTP)


    HTTP defines a simple request-response language. A web client establishes a connection
    with a web server by using HTTP. HTTP defines how to correctly phrase the request
    and how the response should look like. It does not define how the network connection
    is made or managed, nor how the information is actually transmitted; it is done
    by the lower-level protocols such as TCP/IP.


    An HTTP request consists of the following:


    1. The method, which must be one of set of legal action

    2. The Universal Resource Identifier (URI), which is the name of the information
    request

    3. The protocol version

    4. Optional supplemental information


    An HTTP response consists of the following:


    1. A status line, which indicates the success or failure

    2. A description of the response

    3. The actual information


