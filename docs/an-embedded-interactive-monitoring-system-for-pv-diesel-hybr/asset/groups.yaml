    # 2.2.2.3 Gassing


    With $2.3 - 2.4$ V, namely the so-called gassing voltage, gas is developed at
    the electrodes in the battery, by which the water is decomposed into hydrogen
    and oxygen. Both gases mix together in the battery providing detonating gas (explosive!)
    and escape through ventilation opening in the vent plug. With the gassing, the
    battery loses water, which must be refilled according to maintenance with regular
    intervals. The gassing is the unwelcome secondary reaction of the chemical conversion
    during charging because current is consumed for the electrolysis and therefore
    the storage efficiency of the battery is made worse unnecessarily.


    After the gassing voltage is exceeded, voltage stays approximately constant. The
    whole charging current during this period results in $H_2$ and $O_2$, which is
    defined as loss. For this reason, gassing can be represented by a Zenor diode
    in series with a resistor $R_G$ (Fig. 2-17).'
