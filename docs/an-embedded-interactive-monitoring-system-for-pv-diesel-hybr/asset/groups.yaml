    ## Chapter 2: PV-Diesel hybrid system technology


    where conventional energy is very expensive or if conventional electrification
    is not suitable some time.


    PV-diesel hybrid system is attractive for powering in remote area: reduction of
    running cost compared to fuel gens system, reduced investment cost compared to
    only renewable energy system, increased reliability due to redundancy of generators
    [14, 15].


    ## 2.2 System Components


    This section will describe the different components of PV-diesel hybrid system
    to give an understanding of components and some aspects of their operation, which
    is important in operation a hybrid system. Note that apart from the component
    operation, load management and efficient use of surplus energy are also important
    in operation of system.


    ### 2.2.1 Photovoltaic (PV) modules


    A PV cell converts sunlight into DC electricity. However, PV energy is only available
    when enough irradiation is accessible. The PV panels are available in wide range
    up to 100 Wp. In some cases, panels are up to 300 Wp [1]. The PV can become cost-effective
    for small power requirement in remote area. Lifetime of PV cells depending on
    their type in range of 10-20 years.


    A PV cell is made of at least two layers of semiconductor material. One layer
    has a positive charge, the other negative. When light enters the cell, some of
    photons from the light are absorbed by the semiconductor atoms, freeing electrons
    from the cell''s negative layer to flow through an external circuit and back to
    the positive layer. This flow of electrons produces electric current. Figure 2-4
    shows the solar cell construction.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_35_0.png)


    Figure 2-4: Solar cell design


    More clearly, the PV cell is a semiconductor device that can convert solar energy
    into DC electricity through the photovoltaic effect. Cell types include monocrystalline
    silicon, polycrystalline silicon, amorphous silicon (a-Si), gallium arsenide (GaAs),
    copper indium selenide (CuInSe2, "CIS"), cadmium telluride, or a combination of
    two materials in a tandem cell. At present, silicon cells are available in large
    quantities on the market [5]. In principal, a solar cell is a large-area silicon
    diode. Figure 2-5 shows the circuit diagram symbol for a diode.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_36_0.png)


    Figure 2-5: Characteristic of a Diode


    The diode characteristic is defined as equation 2-1.


    ```

    $I_D = I_0 \cdot e^{\left(\frac{qV}{kT} - 1\right)} \quad (2.1)$

    ```


    - $I_D$ diode current [A]

    - $I_o$ dark current [A]

    - $q$ elementary charge [$1.6\times10^{-19}$ coul.]

    - $V$ voltage [V]

    - $k$ Boltzmann constant [$8.65\times10^{-5}$ eV/K]

    - $T$ diode temperature [K]


    When light hits a solar cell, free charge carriers are created due to the photovoltaic
    effect. This allows carriers to flow through a connected load. Photocurrent, which
    is internally generated in a solar cell, is proportional to the radiation intensity.
    Figure 2-6 describes the equivalent circuit diagram for a solar cell.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_36_1.png)


    Figure 2-6: Equivalent circuit diagram of a solar cell


    The mathematical process of an ideal exposed solar cell leads to the following
    equation:


    ```

    $I_{PV} = I_{ph} - I_D = I_{ph} - I_0 \cdot \left(e^{\frac{qV}{kT}}-1\right) \quad
    (2-2)$

    ```


    $I_{PV}$ current [A]

    $I_{ph}$ photocurrent [A]

    $I_O$ dark current [A]

    $q$ elementary charge [$e=1.6\times10^{-19}$ As]

    $V$ voltage [V]

    $k$ Boltzmann constant [$8.65\times10^{-5}$ eV/K]

    $T$ diode temperature [K]


    In an imaginary experiment, the I-V characteristic curve for a certain incident
    radiation will be constructed as Fig. 2-7 and 2-8.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_37_0.png)


    Figure 2-7: Equivalent circuit diagram of an ideal solar cell connected to a load


    ![](img/8191fe2ca5a41746557b10ddfe82a205_38_0.png)


    Figure 2-8: Construction of the solar cell curve from the diode curve


    When the terminals are short-circuited ($R_{load} = 0$), the output voltage and
    the voltage across the diode is zero. According to (2-2): since $V = 0$, no current
    $I_D$ flows (point 1 in Figure 2-8) therefore the entire photocurrent $I_{ph}$
    generated from the radiation flows to the output.


    Thus the current has its maximum at this point with the value $I_{cell}$ and refers
    to the so-called *short-circuit current* $I_{sc}$.


    > $$I_{sc} = I_{cell} = I_{ph} \quad (2-3)$$


    If the load resistance is now continually increased, the solar cell voltage also
    increases whereas the current through the internal diode remains constant. Up
    to a certain value the current continues responding to the photocurrent (point
    2 in Figure 2-8).


    Until the diode voltage threshold is exceeded the load resistance is further,
    a rapidly increasing proportion of the photocurrent flows through the diode. This
    leads to power loss in the internal diode corresponding to an area between the
    photocurrent curve and the cell current curve. Since the sum of the load current
    and the diode current must be equal to the constant photocurrent, the output current
    decreases by exactly this (point 3 in Figure 2-8).


    For an infinitely large load resistance (open circuit), $I_{cell} = 0$) and thus
    the entire photocurrent flows through the diode (point 4 in Figure 2-8). The open-circuit
    cell voltage $V_{oc}$ can be derived from (2-2).


    > $$V_{oc} = \frac{kT}{q} \cdot \ln\left(\frac{I_{ph}}{I_0}\right) \quad (2-4)$$


    - $q$ = magnitude of electron charge [$1.6\times10^{-19}$ As]

    - $k$ = Boltzmann''s constant [$8.65\times10^{-5}$ eV/K]

    - $T$ = absolute temperature [K]

    - $I_0$ = so-called saturation current of a diode


    The power of a solar cell is the product of current and voltage (I-V) and can
    be described in a curve as shown in Figure 2-9. Although the current has its maximum
    at the short circuit point, the voltage is also zero. There is one particular
    combination of current and voltage for which the power reaches a maximum (graphically
    indicated). The so-called maximum power point (MPP) represents the working point
    for a given radiation, situated near the bend of I-V curve. The corresponding
    values of $V_{MPP}$ and $I_{MPP}$ can be estimated


    $V_{MPP} = (0.75 - 0.9) V_{OC}$

    $I_{MPP} = (0.85 - 0.95) I_{SC}$


    The maximum power rating is at the MPP, rated power is measured under Standard
    Testing Conditions (ST), at an irradiation intensity of ISTC=1000W/m2, cell temperature
    $T_{cell}=25^{\circ}C$ and air mass AM=1.5 and is reported in peak watts Wp. A
    maximum point power tracker (MPPT) may be necessary in order to operate at the
    optimum point on I-V curve.


    To increase their utility, dozens of individual PV cells are interconnected together
    in a sealed, weatherproof package called a module. To achieve the desired voltage
    and current, modules are wired in series and parallel what is called an array.
    The flexibility of the modular PV system allows designers to create solar power
    systems that can meet a wide variety of electrical needs. Figure 2-10 shows PV
    cells, modules, and arrays.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_40_0.png)


    Every PV panel has its specific voltage-current relationship (IV-curve). The IV-curve
    of same module can be different when there is different radiation. Figure 2-11
    shows IV curve of a PV cell with different irradiation rate.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_40_1.png)

