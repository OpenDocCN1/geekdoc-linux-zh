    ## 第4章：用于农村混合系统的交互式监控网站


    2.4 如果参数发生变化，监控软件将检查此网页，监控软件会将所有新参数发送到逆变器


    ![](img/8191fe2ca5a41746557b10ddfe82a205_92_0.png)


    图 4-9：混合系统交互式监控网站图


    从图 4-9 可以得出，所提出的交互式监控网站适用于并用于农村光伏柴油混合系统的监控。


    ## 4.10 总结


    能源是国家经济和社会发展的基本动力。然而，在缺乏基础设施的偏远地区，接入公用电网的延伸并不是一个成本效益高的选择，有时在技术上也是不可行的。因此，农村地区使用自主光伏柴油混合系统电源来供电，而不是公用柴油发电。


    当使用混合系统时，为了保持混合系统的可靠运行，有必要包含监控系统。监控的目的是从远程站将监控数据收集到主站。监控数据是操作员为了分析光伏柴油混合系统可靠性所需的数据。


    ## 这些农村地区的系统通常通过上访问结合数据记录仪进行监督。但这种方法对于监控来说并不是成本效益高的选择。还介绍了其他类型的监控系统，例如 SCADA（监控、控制和数据采集）以及使用卫星技术的系统。使用这些系统，已经存在许多公认的问题，包括高额投资成本、对客户站的特殊要求以及通信链路的困难。


    为了消除所有上述问题，提出了通过网站进行监控。网站监控系统可以提供更多优势。监控数据存储在 Web 服务器中。操作员可以通过标准的网络浏览器访问数据。通信链路使用通过
    TCP/IP 网络的标准 GSM 调制解调器，通常这种链路已经存在。此外，不需要任何查看系统的特殊软件。


    所提出的交互式监控网站由监控单元、数据采集单元和通信单元组成。监控单元用于测量混合系统的实际运行数据。根据当前技术，该单元包含在逆变器。项目使用了 SMA
    公司的 Sunny 逆变器。


    数据采集单元是嵌入式模块，包含带有交互式网站的 Apache Web 服务器、数据采集软件（存储软件）以及与 GSM 调制解调器的连接。该数据采集软件将从逆变器读取监控数据并将数据存储到
    Web 服务器中。


    交互式网站通过 HTML 脚本和 PHP 脚本的组合将监控数据提供到互联网。操作员能够在线下载数据并在线上传运行参数。这可以提高混合系统的可靠性。


    交互式监控网站的概念显示，它非常适用于偏远地区光伏混合系统的监控。


    ## 第5章


    ## 实现与结果


    ## 5.1 引言


    如所述，交互式监控网站由监控单元（传感器单元）、数据采集单元和通信单元组成。监控数据存储在 Web 服务器中。操作员可以通过标准的网络浏览器访问监控数据，通信链路使用通过
    TCP/IP 网络的标准 GSM 调制解调器。本章将实现交互式监控网站并描述其结果。


    ## 5.2 方案设计


    根据上一章交互式监控网站的概念，所提出的交互式监控网站可以解释如图 5-1 所示。Web 服务器、网站和采集软件（存储软件）安装在嵌入式 Linux 模块中。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_94_0.png)


    图 5-1：交互式监控网站图


    从图 5-1，主站操作员可以通过标准的网络浏览器访问嵌入式 Linux 模块。通信网络是通过 TCP/IP 网络的 GSM 调制解调器。数据存储软件将负责监控来自混合系统逆变器的数据。监控数据将以每分钟一次的间隔作为文本文件存储在
    Web 服务器中。监控文件的名为日期。


    ## 第5章：实现与结果


    ## 5.3 实现


    一旦采集软件编译并安装到嵌入式模块，嵌入式模块就可以连接到系统逆变器。图 5-2 是光伏柴油混合系统与嵌入式监控模块的连接图。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_95_0.png)


    图 5-2：项目系统连接图 [SMA]


    从图 5-2 可以，Sunny Island 逆变器连接到电池以管理电池电压。逆变器还连接到发电机的启动单元，以便系统需要时启动电机。此外，逆变器设计用于测量混合系统的电压和电流。


    由于双向逆变器是系统的电池管理，因此必须特别注意连接，如果连接失败，系统将无法启动。


    图 5-3 是电池连接图。操作员必须确保连接按照图 5-3 正确接线。在图 5-4 中显示了电池温度传感器的图片。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_96_0.png)


    图 5-3：电池和温度传感器连接图 [SMA]


    ![](img/8191fe2ca5a41746557b10ddfe82a205_96_1.png)


    图 5-4：电池温度传感器 [DeMot]


    从图 5-4，电池温度传感器连接到逆变器。这对于检测电池温度以防止逆变器受过热损坏非常重要。


    此外，必须特别注意与发电机的连接。光伏柴油混合系统是太阳能和柴油发电机的组合。当负载很大且来自电池和光伏组件的能量不足以供应负载时，逆变器将激活柴油电机。因此，必须确保连接正确。图
    5-5 是发电机的连接图。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_97_0.png)


    图 5-5：发电机连接 [SMA]


    从图 5-5，为了启动电机，逆变器将激活接触器 K1。在这种情况下，操作员必须根据发电机类型正确地连接启动电路。电机启动后，逆变器将测量电机电压。逆变器将电机（K2）连接到系统电源线。如果混合系统连接和配置正确，混合系统应该正常工作。


    在混合系统工作后，接下来实现监控系统。监控系统可以在混合系统启动之前或之后连接到逆变器。如所述，采集软件每分钟从逆变器获取监控数据，然后将其存储在嵌入式模块中。操作员可以通过通过
    TCP/IP 网络的 GSM 调制解调器连接到 Web 服务器并将监控数据下载到主站。操作员可以通过 Linux 系统或 Windows 系统上的标准网络浏览器访问网站。


    图 5-6 显示了实现交互式监控网站的测试设施图片。


    '
