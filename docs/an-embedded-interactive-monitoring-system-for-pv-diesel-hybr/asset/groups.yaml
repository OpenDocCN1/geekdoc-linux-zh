    # Appendix E: Embedded Hardware Module and Modems


    /AutoPPP/ - pppuser /usr/sbin/pppd auth +pap


    # 3. Setting up pppd


    "man pppd" and "PPP-HOWTO"


    Create/etc/pppd/options.ttyS0 (or ttyS1 etc.) with these options:


    ```

    asyncmap 0

    netmask 255.255.255.0

    proxyarp

    lock

    crtscts

    modem

    192.168.0.1:192.168.0.2

    ```


    Let 192.168.0.2 is the client IP address and 192.168.0.1 is the server.

    Also put this line in /etc/ppp/ppp-pap-secrets


    ppuser hostname "password" 192.168.0.2


    ppuser is the user name on the client side.

    Replace hostname with real host name!


