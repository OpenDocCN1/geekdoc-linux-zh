    ## Chapter 5: Implementation and results


    Figure 5-24 shows the system without running the generator. In this case, the
    system receives the power from the PV module during the day. Until the end of
    the day, the battery is not empty. The SOC did not reach the set-point so that
    the generator was not started on this day.


    ### 5.5.2 The monitored data from the PV inverter


    The monitored data of PV inverter indicates energy situation from radiation. As
    the PV diesel hybrid system is the combination of solar energy and diesel generator,
    it is very important to analyze the monitored data for PV inverter deorder in
    order to evaluate the system ability and improve the system sizing.


    The PV inverter completely consumes energy by itself. The PV inverter will activate
    itself when radiation is high at the start voltage of PV inverter. When the PV
    inverter is activated, PV power will be supplied to the system. The PV inverter
    will deactivate when the PV voltage is lower than the stop voltage of PV inverter.
    The start and stop voltage of PV inverter can be adjusted via website. Figure
    5-25 shows a graph of PV power from the PV inverter.


    From figure 5-25, PV inverter begins to connect the PV power to the system at
    about 9.00 AM when the sun radiation was high enough and disconnects from the
    system at about 19.30 PM when the radiation was lower than the stop voltage. The
    PV power is increasing when the radiation was usually at midday.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_112_0.png)


    Figure 5-25: Power production of the PV module


    The many spikes in the center part of the graph are because of the weather. The
    sky was not clear on the day of monitoring.


    From data analysis, the operator can make sure that the system is working properly.
    Furthermore, the operator can learn from the monitored data in order to optimize
    the system and to keep the system working reliably.


    ## 5.6. Summary


    A low input-power embedded module with an embedded Linux system is utilized for
    an interactive remote monitoring website for a PV-diesel hybrid system. A GSM
    modem over TCP/IP network, which allows the data to be transmitted directly to
    the main station, is used. The monitoring system requires very low investment
    and operation costs because of the open source software and there is no need for
    any special software at the workstations. The operator can access the monitoring
    website via a standard web browser.


    The interactive monitoring website allows the operator to adjust parameters of
    inverter via website as well as download the monitored data to the main station.
    The operator has an ability to analyze up-to-date monitored data.


    The ability to access, analyze the up-to-date monitored data and to change operation
    parameters online, improves the reliability of the hybrid system. The operator
    can be sure that the hybrid system is working properly. The operator can learn
    the behavior of the system from the analysis. In addition, these advantages can
    improve the public''s image of renewable systems, piquing their interest in the
    PV area.


    The embedded interactive monitoring website shows itself to be a very suitable
    solution, especially in remote areas where there is a lack of infrastructure.


    ## Chapter 6: Conclusions and outlooks


    This thesis has addressed two points: the rapidly evolving technologies on electricity
    generation with photovoltaic modules and the internet web based technology for
    monitoring of PV diesel hybrid systems in remote areas.


    The thesis has illustrated that in the last decade of the 20th century the world
    market penetration of PV has increased tremendously worldwide because PV can provide
    clean energy without environmental problems. Moreover, in remote and rural areas,
    a PV diesel hybrid system, which is a stand-alone energy system combining solar
    energy and a diesel generator with batteries for storage, is used to supply energy
    wide. Because of the provision of grid electricity in remote areas is often associated
    with higher costs to the grid supplier, Grid electrification in remote areas in
    many cases is financially inefficient particularly due to the low consumption
    in remote. Therefore the PV diesel hybrid system is very suitable for providing
    electricity in remote area.


    When the PV diesel hybrid system is installed, it is necessary to include a monitoring
    system. The work of this thesis has mainly concentrated on an interactive monitoring
    website of the PV diesel hybrid system installed in remote and rural areas.


    The interactive monitoring website proposed and investigated in the thesis is
    comprised of a monitor unit, a data acquisition unit, and a communication unit.
    The concept of the proposed interactive monitoring website is that the monitored
    data is stored in the web server at remote site. The operators can access the
    monitored data via a web browser and the communication link uses a standard GSM
    modem over a TCP/IP network. The interactive monitoring website allows the operator
    to download the monitored data and upload operation parameters to system components
    directly via the website.


    The monitoring unit of the website is used to monitor the actual operation data
    of the PV diesel hybrid system. With current technology, this unit is included
    in the inverter. The Sunny inverter from the SMA Company has been used for the
    project.


    The data acquisition unit of the monitoring website is an embedded system, which
    is a small and low-power consumption model. As an embedded system is a system
    that has no hard drive and has limited storage memory, an embedded system requires
    an embedded operating system, which is a set of software only to get a specific
    set of jobs done, this means the software requires less memory.


    As the advantage of open-source and freely available options, Linux is the world''s
    most advanced, progressive, and well suited for embedded operating systems. Therefore,
    an embedded Linux operating system is implemented for the interactive monitoring
    website.


    The data acquisition unit of the monitoring website includes an Apache web server,
    an interactive website, a data acquisition software, and a connection to the GSM
    modem.


    The Apache web server is used to handle the requests from the client.

