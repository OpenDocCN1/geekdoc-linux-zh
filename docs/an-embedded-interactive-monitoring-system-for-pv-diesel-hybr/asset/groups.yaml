    # Glossary of Terms


    +   AC : Alternating current (AC), household utility current in most countries
    is AC with a frequency of 50/60 hertz (60 complete cycles per second).


    +   AM : Air mass


    +   API : An application program interface (API - sometimes spelled application
    programming interface) is the specific method prescribed by a computer operating
    system or by an application program by which a programmer writing an application
    program can make requests of the operating system or another application.


    +   ARP : Address Resolution Protocol (ARP) is a protocol for mapping an Internet
    Protocol (IP address) to a physical address that is recognized in the local network.
    There is a Reverse RARP (RARP) for machines that do not know their IP address.
    RARP enables them to request their IP address from the gateway''s ARP cache.


    +   ASCII : ASCII (American Standard Code for Information Interchange) is the
    most common format for files in computers and on the Internet. In an ASCII file,
    each alphabetic, numeric, or special character is represented with a 7-bit binary
    number (a string of 0s or 1s). 128 characters are defined.


    +   BIOS : BIOS (basic input/output system) is the personal computer''s microprocessor
    used to get the computer started after turning it on. It also manages data flow
    between the computer''s operating system and attached devices such as the hard
    disk, video adapter, keyboard, mouse, and printer.


    +   Bootdisk : Bootdisk is an installation floppy disk for installation of Linux


    +   Broadcast : On the Internet, Web sites deliver original or redistributed broadcasts
    from existing radio and television stations, using streaming or streaming video
    techniques, to Web users who visit the Web site or ''tune it in'' using a special
    program such as RealPlayer. Likely publicly available radio and television broadcasts,
    are available to anyone.


    +   BUS : In an electrical term, a bus is a transmission line on which electrical
    power is dropped off or picked up at every device attached to the line


    +   CD-ROM : CD-ROM (Compact Disc, read-only-memory) is an adaptation of the CD
    that is designed to store computer data in the form of text and graphics, as well
    as hi-fi stereo sound.'
  - '[PAGE 15]


    # CGI


    : The common gateway interface CGI is a standard way for a Web server to pass
    a Web user''s request to an application program and receive data back to the user.
    When the user requests a Web page (for example, by clicking on a highlighted word
    or entering a Web address), the server sends back the requested page. However,
    when a user fills out a form on a Web page and sends it, usually needs to be processed
    by an application program. The Web server typically passes the form information
    to a small application program that processes the data and sends back a confirmation
    message. This method or convention for passing data back and forth between the
    server and application is called the common gateway interface (CGI). It is part
    of the Web''s Hypertext Transfer Protocol (HTTP).


    # ChipDISK


    : The ChipDISK provides high capacity storage flash memory that is electrically
    compatible with an IDE disk drive. ChipDISK modules provide up to 500 Mbyte of
    formatted storage capacity and will be expanded to even higher capacities in the
    future.


    # Client/server


    : Client/server describes the relationship between two computer programs in which
    one program, the client, makes a service request from another program, the server,
    which fulfills the request.


    # CPU


    : CPU (central processing unit) is the central unit in a computer containing the
    logic circuitry that performs the instructions of a computer''s programs.


    # Day profile


    : The load profile represents the load demand on day time, which the power available
    from the PV generators.


    # DC


    : DC (Direct current) is the unidirectional flow or movement of electric charge
    carriers. The intensity of the current can vary with time, but the general direction
    of movement stays at all times. As an adjective, the term DC is used in reference
    to voltage polarity never reverses.


    # DDP


    : Deep discharge protection of the battery


    # Embedded system


    : An embedded system is some combination of computer hardware and software, either
    fixed in capability or programmable, that is specifically designed for a particular
    kind of application device. Industrial machines, automobiles, medical equipment,
    cameras, household appliances, airplanes, vending machines, and toys (as well
    as the more obvious cellular phone and PDA) are among the myriad possible hosts
    of an embedded system. Embedded systems that are programmable are provided with
    a programming interface, and embedded systems programming is a specialized occupation.'
  - '[PAGE 16]


    Ethernet : Ethernet is the most widely-installed local area network (LAN) technology.
    Specified in a standard, IEEE 802.3, Ethernet was originally developed by Xerox
    and then developed further by Xerox, DEC, and Intel. An Ethernet LAN typically
    uses coaxial cable or special grades of twisted pair wires. Ethernet is also used
    in wireless LANs. The most commonly installed Ethernet systems are called 10BASE-T
    and provide transmission speeds up to 10 Mbps. Devices are connected to the cable
    and compete for access using a Carrier Sense Access with Collision Detection (CSMA/CD)
    protocol.


    FTP : File Transfer (FTP), a standard Internet protocol, is the simplest way to
    exchange files between computers on the Internet. FTP is commonly used to transfer
    Web pages from their creator to the computer that acts as their server for everyone
    on the Internet.


    Gateway : A gateway is a network that acts as an entrance to another network.


    gcc : The GNU Compiler Collection (GCC) is the GNU compiler. GCC is the most important
    piece of open source software. Even other languages, like Perl and Python, are
    written in C, which is compiled by the GNU compiler. Linux is possible because
    of GCC. GCC compiles several languages, The fundamental language of GCC is C.


    Genset : A generator with a start and stop controller.


    glibc : glibc is the GNU C Library. It currently runs unmodified on GNU Hurd systems
    and i386, m86k, and alpha systems.


    GNU is a Unix-like operating system that comes with source code that can be copied,
    modified, and redistributed. The GNU project was started in 1983 by Richard Stallman
    and others, who formed the Free Software Foundation. Stallman believes that users
    should be free to do whatever they want with software they acquire, making copies
    for friends and modifying the source code and repackaging it with a distribution.


    GSM : GSM (Global System for Mobile communication) is a digital mobile telephone
    system that is widely used in Europe and other parts of the world. GSM uses a
    variation of time division multiple access (TDMA) and is the most widely used
    of the three digital wireless telephone technologies (TDMA, GSM, and CDMA). GSM
    digitizes and compresses data, then sends it down a channel with two other streams
    of user data, each in its own time slot. It operates either at the 900 MHz or
    1800 MHz frequency band.


    Host : A host is a computer with a Web server that serves the pages for one or
    more Web sites.'
- md: '

    - HTTP (Hypertext Transfer Protocol) is the set of rules for transferring files
    (text, graphic images, sound, video, and other multimedia files) on the World
    Wide Web.


    - Hypertext Transfer Protocol daemon, on the Web, each server has an HTTPD or
    Hypertext Transfer Protocol daemon that waits for requests to come from the rest
    of the Web. A daemon is a program that is "an attendant power or spirit" (Webster''s).
    It sits waiting for requests to come in and then forwards them to processes as
    appropriate.


    - Hypertext Markup Language is the set of markup symbols or codes inserted in
    a file intended for display on a World Wide Web browser. The markup tells the
    Web browser how to display Web page''s words and images for the user. Each individual
    markup code is referred to as an element (but many people also refer to it as
    tag). Some elements come in pairs that indicate when some display effect is to
    begin and when it is to end.


    - ICMP (Internet Control Message Protocol) is a message control and error-reporting
    protocol between a host server and a gateway to the Internet. ICMP uses Internet
    Protocol (IP) datagrams, but the messages are processed by the IP software and
    are not directly apparent to the application user.


    - IDE (Integrated Drive Electronics) is a standard electronic interface used between
    a computer motherboard''s data paths or bus and the computer''s disk storage devices.
    The IDE interface is based on the IBM PC Industry Standard Architecture (ISA)
    16-bit bus standard, but it is also used in computers that use other bus standards.
    Most computers sold today use an enhanced version of IDE called Enhanced Integrated
    Drive Electronics (EIDE). In today''s computers, the IDE controller is built into
    the motherboard.


    - Internet Protocol (IP) is the method or protocol by which data is sent from
    one computer to another on the Internet. Each computer (known as a host) on the
    Internet has at least one IP address that uniquely identifies it from all other
    computers on the Internet. When we send or receive data (for example, an e-mail
    or a Web page), the message gets divided into little chunks packets. Each of these
    packets contains both the sender''s Internet address and the receiver''s address.


    - A dynamic website that allows a client to view the webpage as well as write
    data into the webpage. In this, it works by a combination of HTML and PHP script.


    - Internet: The Internet, sometimes simply "the Net," is a worldwide system of
    computer networks - a network of networks in which users at any one computer can,
    if they have permission, get information from any other computer (and sometimes
    talk directly to users at other computers). It was conceived by the Advanced Research
    Projects Agency (ARPA) of the U.S. government in 1969.


    - Link: A link is a selectable connection from one word, picture, or information
    object to another. In a multimedia environment such as the World Wide Web, such
    objects can include sound and motion video sequences. The most common form of
    link is the highlighted word or picture that can be selected by the user (with
    a mouse or in some other fashion), resulting in the immediate delivery and view
    of another file. The highlighted object is referred to as an anchor. The anchor
    reference and the object referred constitute a hypertext link.


    - Kernel: The kernel is the essential center of a computer operating system, the
    core that provides basic services for all other parts of the operating system.
    A synonym is *nucleus*. A kernel can be contrasted with a shell, the outermost
    part of an operating system that interacts with user commands. *Kernel* and *shell*
    are used more frequently in Unix and some other operating systems than in IBM
    mainframe systems.


    - LAN: A local area network (LAN) is a group of computers and associated devices
    that share a common communications line or wireless link and typically share the
    resources of a single processor or server within a small geographic area (for
    example, within an office building).


    - Linux: Linux (often pronounced LIUX with a soft "j") is a Unix-like operating
    system that was designed to provide computer users a free or very low-cost operating
    system comparable to traditional Unix systems. Linux has a reputation as a very
    efficient and fast-performing system. Linux''s kernel (the central part of the
    operating system) was developed by Linus Torvalds at the University of Helsinki
    in Finland. To complete the operating system, Torvalds and other team members
    made use of system components developed by members of the Free Software Foundation
    for the GNU Project.


    - Load profile: Load profiles describe the electricity demand depending on time.


    ## Memory


    Memory is the electronic holding place for instructions and data. Memory is often
    used as a shorter synonym for random access memory (RAM). This kind of memory
    is located on one or more microchips that are physically close to the microprocessor
    in computer. Memory is sometimes distinguished from storage, or the physical medium
    that holds the much larger amounts of data that do not fit into RAM and may not
    be immediately needed there. Storage devices include hard disks, floppy disks,
    CD-ROM, and tape backup systems.


    ## mgetty


    mgetty is a program that allows clients to make optimum use of their modem or
    fax in a Unix environment.


    ## MIME


    MIME (Multi-Purpose Internet Mail Extensions) is an extension of the original
    Internet e-mail protocol that lets people use exchange different kinds of data
    on the Internet: audio, video, images, application programs, and other kinds,
    as well as the ASCII text handled in the original protocol, the Simple Mail Transport
    Protocol (SMTP). Servers insert the MIME header at the beginning of any Web transmission.
    Clients use this header to select an appropriate "player" application for the
    type of data header indexes.


    ## Monitored data


    The monitored data is the data of the hybrid system that has been monitored by
    monitoring unit including several parameters.


    ## MPP


    Maximum power point (MPP).


    ## MPPT


    Maximum power point tracker (MPPT).


    ## Network


    In information technology, a network is a series of points or nodes interconnected
    by communication paths. Networks can interconnect with other networks and contain
    sub networks.


    ## Operating system


    An operating system (sometimes abbreviated as "OS") is the program that, after
    being loaded into the computer by a boot program, manages all the programs in
    a computer. The other programs called applications or operation programs.


    ## OSI


    OSI (Open Systems Interconnection) is a standard description or "reference model"
    for how messages should be transmitted between any two points in a telecommunication
    network.


    ## PC/104


    It is an embedded computer, small size, and low power consumption (http://www.pc104.org/).


    ## Peripheral


    A peripheral (pronounced peh-RIHF-uhl, a noun truncation of peripheral device),
    is any computer device that is not part of the essential computer (the processor,
    memory, and data paths) but is situated relatively close. A near synonym is input/output
    (I/O) device.


    - PHP: In Web programming, PHP is a script language and interpreter that is freely
    available and used primarily on Linux servers. PHP, originally derived from Personal
    Home Tools, now stands for PHP: Hypertext Preprocessor, which describes a "recursive"
    acronym.


    - POP3: POP3 (Post Office Protocol 3) is the most recent version of a standard
    protocol for receiving e-mail. POP3 is a client/server protocol in which e-mail
    is received and held for user server. Periodically, users (or user client e-mail
    receiver) check their mail-box on the server and download any mail. Netmanage
    suite of Internet products and POP3 is built into one of the most popular e-mail
    products, Eudora. It is also built into Netscape and Microsoft Internet browsers.


    - PPP: PPP (Point-to-Point Protocol) is a protocol for communication between two
    computers using a serial interface, typically a personal computer connected by
    phone line to a server.


    - PPPd: PPPd is a daemon of PPP. Daemon is a program that waits for requests to
    come in.


    - Processor: A processor is the logic circuitry that responds to and processes
    the basic instructions that drive a computer. The term processor has generally
    replaced the central processing unit (CPU). The processor in a personal computer
    or embedded in small devices is often called a microprocessor.


    - Protocol: In information technology, protocol (pronounced PROH-toh-cahl, from
    the Greek protocolon, which was a leaf of paper glued to a manuscript volume,
    describing its contents) is the special set of rules that end points in a telecommunication
    connection use when they communicate.


    - PV: Photovoltaic or solar module.


    - RAM (random access memory) is the place in a computer where the operating system,
    application programs, and data in current use are kept so they can be quickly
    reached by the computer''s processor.


    - RARP (Reverse Address Resolution Protocol) is a protocol by which a physical
    machine in a local area network can request to learn its IP address from a gateway
    server''s Address Resolution Protocol (ARP) table or cache.


    - RAP (remote area power supply) is off-grid electrification technology.


    - Rootdisk is a floppy disk for installation of Linux after bootdisk.

    '
  mdcn: '


    - HTTP（超文本传输协议）是用于在万维网上传输文件（文本、图形图像、声音、视频和其他多媒体文件）的一组规则。


    - 超文本传输协议守护进程（HTTPD daemon），在 Web 网上，每个服务器都有一个 HTTPD 或超文本传输协议守护进程，等待来自 Web 其他部分的请求。守护进程（daemon）是一种“守候力量或精神”的程序（根据《韦伯词典》）。它静静等待请求进入，然后根据情况将其转发给相应的进程。


    - 超文本标记语言（Hypertext Markup Language）是一组插入到旨在万维网浏览器中显示的文件中的标记符号或代码。这些标记告诉 Web 浏览器如何为用户显示网页的文字和图像。每个单独的标记代码被称为一个元素（但许多人也将其称为标签/tag）。某些元素成对出现，指示某些显示效果何时开始以及何时结束。


    - ICMP（互联网控制消息协议）是主机服务器与互联网网关之间的一种消息控制和错误报告协议。ICMP 使用互联网协议（IP）数据报，但消息由 IP 软件处理，对应用程序用户来说不是直接可见的。


    - IDE（集成式电子）是一种标准的电子接口，用于计算机主板的数据路径或总线与计算机磁盘存储设备之间。IDE 接口基于 IBM PC 行业标准架构（ISA）16
    位总线标准，但也用于使用其他总线标准的计算机。今天出售的大多数计算机都使用 IDE 的增强版本，称为增强型集成式电子（EIDE）。在如今的计算机中，IDE
    控制器内置在主板上。


    - 互联网协议（IP）是数据从互联网上的一台计算机发送到另一台计算机的方法或协议。互联网上的每台计算机（称为主机）至少有一个 IP 地址，该地址唯一将其与互联网上所有其他计算机区分开来。当我们发送或接收数据（例如电子邮件或网页）时，消息会被分成许多小的数据包。每个数据包都包含发送者的互联网地址和接收者的地址。


    - 一种允许客户端查看网页以及向网页中写入数据的动态网站。它是通过 HTML 和 PHP 脚本的结合来运行的。


