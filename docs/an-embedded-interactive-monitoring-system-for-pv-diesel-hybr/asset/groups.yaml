    Figure 1-8 illustrates tools and methodology to develop the objectives of this
    work. The methodology and tools in order to carry out this thesis are described
    as following:


    - **PV-diesel hybrid system**: It is used to implement the interactive monitoring
    website. The hybrid system is installed using PV arrays, generator, battery, Sunny
    Boy inverter, Sunny Island (battery inverter), and load. The hybrid system is
