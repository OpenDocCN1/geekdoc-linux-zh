    ![](img/8191fe2ca5a41746557b10ddfe82a205_105_0.png)


    Figure 5-15: Power from Battery, PV module, and Generator


    As in the figure 5-16 shows the power from battery (Pconv) and its SOC (State
    of charge). As mentioned in chapter 2, the SOC indicates how much energy available
    in the battery. The inverter will monitor the SOC of battery. If the SOC is low
    at the set-point, the inverter will activate the generator. Figure 5-16 can be
    described as:


    - When the battery supplies power to load, the State of Charge (SOC) is decreasing.
    In the morning, when the load is high, the power of battery to is rapidly increasing.
    At this point, the SOC is also rapidly decreasing.

    - When the SOC is at the set-point about 40% on the graph, the generator is started
    to supply the system.

    - The power from generator also charges to the battery so the SOC is increasing.

    - When the power from the battery reaches the high-level set-point about 80%,
    the generator stops running.


    From graph on figure 5-16, it can make sure that the system is working. Moreover,
    the operator has a possibility to change the set-point of the SOC via website
    in order to optimize power for reliability.


    ## Chapter 5: Implementation and results


    ![](img/8191fe2ca5a41746557b10ddfe82a205_106_0.png)


    Figure 5-16: Power from Battery and its SOC (State of Charge)


    The battery management inverter of the hybrid system is very important. It monitors
    the limit values for current, voltage, and temperature. It controls and monitors
    the charge depending on its SOC. The battery is charged according to the type
    of battery. The operator has to enter a correct type of battery to the inverter.
    The final charge voltage of the battery is adjusted to the respective battery
    temperature. Above 20 ° C, the charge voltage is decreased.


    The inverter has four charging method as follows:


    - Normal charge (as often as possible)

    - Full charge (about one month)

    - Equalizing charge (about every 2-3 months)

    - Float charge (after charge completed)


    Charging is initialized by the battery management when the battery state has been
    reached. Figure 5-17 shows a diagram of battery charging method of lead-acid battery.
    A normal charge is made when the SOC has fallen below 70%.


    By default, a full charge is completed every two weeks. The full charge leads
    to complete charging of battery in order to avoid irreversible aging due to low
    SOC. Equalizing charge is initiated about 180 days preventing the individual cells
    that have charged different degree. Float charge is to switch off charging according
    to criteria voltage of the battery.


    ## Chapter 5: Implementation and results


    ![](img/8191fe2ca5a41746557b10ddfe82a205_107_0.png)


    Figure 5-17: Charging method of the battery [SMA]


    From figure 5-17, when the SOC is below 70% the normal charge is made. From the
    normal charge, when the battery voltage reached 2.55 V. The charging method is
    able to for the float charge, the full charge, or equalizing charge. If period
    is not at full charge or equalizing charge, the charging method will go to the
    float charge. If period is over 14 days, the charging method will go to the full
    charge. At full charge, it will charge and keep the battery at 2.55 V for five
    hours then go to the float charge. If period is over 18 days, the charging method
    will go to the equalizing charge. At equalizing charge, it will charge and keep
    the battery at 2.45 V for ten hours then go back to the float charge.


    Moreover, the inverter has a switching operation. The SOC determines the action
    of charging. Figure 5-18 shows a diagram of switching operation depending on the
    SOC.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_107_1.png)


    Figure 5-18: Switching operation depending on SOC [SMA]


    84


    ## Chapter 5: Implementation and results


    From figure 5-18, when SOC is lower than 40%, relay N4 is switched on activating
    the generator to charge the battery. If the battery is lower than 30%, relay L1
    is activated to switch off some consumers (in case, generator is not started).
    If SOC is below 20%, relay L2 is activated to switch off all consumers. If SOC
    is below 10%, the inverter is deactivated.


    If the SOC is higher than 100%, relay 01 is activated to switch on load dump and
    if the SOC still in creases the relay 02 is activated to switch off other power
    source (if applicable).


    However, the calculation of relay operation also respects to battery temperature
    and the set-point of SOC. The lead-acid battery is working well in range of 40%
    - 70% of SOC. Therefore, the operator should adjust the set-point between this
    range.


    As mentioned, battery temperature is one of the most important parameters of the
    system. Figure 5-19 shows a graph of battery voltage (Ubat mean), battery current
    (Ibat), and battery temperature (Tbat mean) of the system.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_108_0.png)


    Figure 5-19: Battery voltage, current, and temperature


    From the figure 5-19, it shows that the increasing of temperature depends on the
    change of battery current. At night, battery temperature is decreasing because
    of the weather and load. In the morning, when battery supplies power to load,
    the temperature is increasing a little bit according to the change of battery
    current. During charging battery, the battery current and voltage are increasing
    rapidly that the temperature is also increasing rapidly.


    This can be describes in term of battery current (Ibat) as: we when the current
    flows, it produces power (heat): $P = i^2R$; $P$ is the power in term of heat,
    $i$ is the battery current, and $R$ is the resistance of battery.


    ## Chapter 5: Implementation and results


    Figure 5-20 shows the system frequency (Fconv) and the generator power (Pext).
    During the battery supplies power to the system out with the generator, the system
    frequency is stable at 50 Hz. When the generator starts, the frequency is fluctuated.
    This is a common phenomenon because of the process of synchronization.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_109_0.png)


    Figure 5-20: System frequency (Fconv) and generator power (Pext)


    The fluctuation of frequency is very important in the power system. It should
    be considered according to standard of each country. The fluctuation depends strongly
    on the efficiency of generator and inverter. From figure 5-20, the fluctuation
    is between 49.87 to 50.1 Hz, which is acceptable.


    Figure 5-21 shows the system without PV module. It is obvious that the battery
    is empty on midday and the generator has to start supplying the power to the load
    as well as to charge the battery. From the figure 5-21, it can be described as:


    - The system is supplying the energy to the load as normal operation.

    - Load is increasing in the morning. All energy is from the battery. Until midday,
    the battery is empty thus, the generator starts to supply the system.

    - When the battery is full, the generator stops running about 16.30 PM and the
    battery is supplying to the load.


    From the graph 5-21, it is obvious without PV module, the battery is empty early
    and the generator has to start early. With this monitored data, the operator can
    learn this behavior of the system for improvement in the future.


