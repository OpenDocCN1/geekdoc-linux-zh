    # Chapter 2: PV-Diesel hybrid system technology


    To increase their utility, dozens of individual PV cells are interconnected together
    in a sealed, weatherproof package called a module. To achieve the desired voltage
    and current, modules are wired in series and parallel what is called a PV array.
    The flexibility of the modular PV system allows designers to create solar power
    systems that can meet a wide variety of electrical needs. Figure 2-10 shows PV
    cells, modules, and arrays.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_40_0.png)


    Every PV panel has its specific voltage-current relationship (IV-curve). The IV-curve
    of same module can be different when there is different radiation. Figure 2-11
    shows IV curve of a PV cell with different irradiation rate.


