    ## 1.2 Hybrid systems for rural and remote electrification


    Energy represents a basic drive for the economic and social development of a country.
    However, in many remote and rural areas there is no access to electricity. In
    order to contribute to rural development and the creation of job opportunities,
    energy is urgently needed in remote villages.


    The concept of remote site can be quite different in each country. Generally,
    remote sites are located far from cities and from the places where most people
    live, and often lack telephone line coverage and power grid supply. The price
    of conventional energy sources in remote areas, such as candles, paraffin, gas,
    coal, batteries, are often more expensive than cities due to the remoteness of
    retailers. The provision of grid electricity in remote areas is often associated
    with higher costs to the grid supplier. Grid electrification in remote areas in
    many cases is financially inefficient particular to the low consumption in remote
    areas [1, 4, 5].


    Renewable energy sources such as solar energy provide realistic alternatives for
    electrification in remote area. One of the most promising applications of renewable
    energy technology is the Hybrid system. In the context of rural electrification,
    PV hybrid energy systems combining renewable and conventional power sources have
    a recognized potential for competitive electricity production. The widely used
    term Hybrid system describes a stand-alone energy system, which combines renewable
    and conventional energy sources with batteries for energy storage. The use of
    batteries can enhance fuel savings by buffering part of the renewable energy production
    for use at later times, thereby decreasing the net load on the diesel generator,
    allowing the diesel to be turned off or operating at its highest efficiency, while
    recharges the batteries.


    Considering the application spectrum of renewable energies for electrification
    in developing countries as in figure 1-7, it stretches the supply of single consumers
    and load groups through the decentralized electrification with isolated grids
    to the expansion of interconnected grids.


    | Power Supply Fields & Degree of Interconnection | | | | | Interconnected Grids
    | Inter-continental Network | Europe-wide Network | HVDC DC / ... 600kV |

    |---|---|---|---|---|---|---|---|---|

    | Single Consumers & Load Groups | | | | | | | | |

    | Minimum Consumers | Stand-alone Systems | | | | | | | |

    | Solar Homes | Local Power Supply | | | | | | | |

    | | Supply of Small and Medium Loads | | | | | | | |

    | | 3- / 20kV | | | | | | | |

    | | 1- / 230V | | | | | | | |

    | DC/ ... 48V | | | | | | 3- / 380kV | | |

    | 10W | 100W | 1kW | 10kW | 100kW | 10MW | 100MW | 1GW | Power Ranges |


    Figure 1-7: Classification of power supply technologies for electrification [6]


    The classification of power supply fields presented in figure 1-7 includes estimations
    of the application potential for various energy sources throughout the total power
    range. From this, PV-Hybrid system, which is combining different energy sources
    in one supply system, offers the best possibility to use the locally available
    renewable energies. Hybrid system technology mainly covers the stand-alone systems
    as well as island grids of small and medium power ranges. Moreover, hybrid system
    can be expanded to cover regional and trans-regional grids.


    From the advantages mentioned, the PV-diesel hybrid systems have been increasingly
    used for supplying electricity in remote and rural areas worldwide. Issues that
    arise when considering PV-diesel hybrid systems with battery storage include the
    efficient use of renewable energy, fuel savings, system reliability, maintenance
    requirements and consumer lifetime considerations [4].


    ## 1.3 Monitoring of hybrid systems


    As the PV-diesel hybrid system is increasingly used to supply electricity in remote
    areas. Thus, it is to be a technically reliable system to the consumer. To keep
    the hybrid system working reliably, it is necessary to include a monitoring system
    to continuously monitor the hybrid system. The usual goals of monitoring [9] are
    to:


    - Ensure that the system is operating properly

    - Assess the performance of system components, pinpoint faulty devices or dev
    operating below their nominal performance

    - Permit the calibration of

    - Reveal improvements to the design and increase the understanding of the designer


    In most remote monitoring systems, the information is collected from the remote
    station to master. Commonly systems in such rural areas are supervised by yearly
    visits in conjunction with a data logger. But this method leads to the inefficiency
    of response time for maintenance as well as the product improvements is poor.
    There are already some monitoring systems have been presented earlier as SCADA
    (Supervision Control and Data Acquisition) or by satellite [10,11]. However, the
    known problems for these methods are: high investment cost, needs special software
    for Client stations and communication link. These all disadvantages make the hybrid
    system ineffective in economic performance.


    As the internet has been a powerful source of information, the internet monitoring
    has introduced for the hybrid system [12]. Using internet technology, all disadvantages
    can be eliminated. The communication TCP/IP network is used for the internet monitoring
    system. In most case, this communication link already exists. Thus, there will
    be no longer deficiency of communication link. The monitored data stored at web
    server. The operator can access the monitored data via a standard browser.


    However, the internet monitoring is possible only where the internet connections
    provided. In the rural areas, lack of infrastructure, it is difficult to implement
    the internet monitoring. Moreover, a computer, which is installed a web server
    to provide the monitored data, normally consumes much energy. This is a disadvantage
    for the monitor system in remote area, where energy is limited.

