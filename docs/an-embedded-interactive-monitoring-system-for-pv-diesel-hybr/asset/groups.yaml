  mdcn: "\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_98_0.png)\n\n图 5-6：实现的监控系统图\n\
    \n## 5.3.1 调制解调器拨入\n\n由于调制解调器用于监控网站与主站之间的通信，因此嵌入式模块被设置为拨入调制解调器。操作员可以通过电话拨入嵌入式模块，然后通过浏览器访问嵌入式模块上的信息。\n\
    \n当操作员在连接了调制解调器的主 PC 上拨打嵌入式监控模块 GSM 调制解调器的电话时，嵌入式模块会接听并将 PC 连接到嵌入式模块。一旦连接，嵌入式模块会向\
    \ PC 发送登录提示。然后 PC 登录并访问嵌入式模块。嵌入式模块中处理拨入的程序称为 getty。\n\ngetty 是为拨入而运行的程序。它负责接听电话。有几个名称略有不同的\
    \ getty 程序。只有某些带有调制解调器的特定程序可用于拨入。此 getty 程序通常在启动时启动。它必须从 `/etc/inittab` 文件中调用。\n\
    \n## 第 5 章：实现与结果\n\n有四个不同的 getty 程序：mgetty、uugetty 和 agetty。从中进行选择时必须使用带有调制解调器拨入的程序。getty\
    \ 是这四个程序中最简单且最弱的，主要用于直接连接终端的调制解调器。mgetty 支持传真和语音邮件，但 Ugetty 不。getty_em 是 ugetty\
    \ 的简化版本。因此，mgetty 是最佳选择。mgetty 的编写是为了作为 mgetty 出现之前存在的 ugetty 的替代品。\n\n调制解调器拨入涉及以下子系统（见图\
    \ 5-7）：\n\n- 1. mgetty 仅在电话铃响时“接听”电话并建立串口线路。之后，调用 pppd 进行拨拨入。\n- 2. PPPd 程序将互联网流量（TCP/IP）封装成串行数据包，数据包可以通过调制解调器线路设置到客户端。在连接开始时，它会验证用户身份。\n\
    \  - 文件 `/etc/ppp/pap-secrets` 是允许通过调制解调器登录的用户列表。它提供了密码列表。\n  - PPPd 程序通过互联网将网络流量转发到最终目标。\n\
    \n图 5-7 显示了拨入流程图。\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_99_0.png)\n\n图 5-7：拨入图\n\
    \n## 5.4 交互式监控网站的结果\n\n一旦进入监控网站，通过 HTML 和 PHP 脚本的结合，交互式监控网站可以提供混合系统的最新数据（间隔为一分钟）。这非常重要，因为操作员可以在需要时对系统采取采取行动。交互式网站还提供了在线调整逆变器参数的可能性。图\
    \ 5-8 显示了交互式监控网站首页的一项功能。\n\n## 第 5 章：实现与结果\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_100_0.png)\n\
    \n图 5-8：交互式监控网站首页\n\n在操作员连接到嵌入式模块后，可以打开浏览器并输入 Web 服务器的地址以访问网站。一旦操作员在首页访问网站（见图\
    \ 5-8），操作员就可以立即看到系统的一些重要监控数据。这可以帮助操作员判断系统正在运行。图 5-8 所示的网站功能通过 Internet Explorer\
    \ 打开。\n\n### 5.4.1 下载监控数据\n\n在监控网站首页首页，操作员可以找到下载监控数据的链接。一旦操作员输入密码，就会看到数据管理页面。图\
    \ 5-9 到 5-11 显示了下载数据的链接和数据管理页面。\n\n## 第 5 章：实现\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_101_0.png)\n\
    \n> 图 5-9：下载链接\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_101_1.png)\n\n> 图 5-10：密码区域\n\
    \n![](img/8191fe2ca5a41746557b10ddfe82a205_101_2.png)\n\n> 图 5-11：数据管理页面\n\n##\
    \ 第 5 章：实现结果\n\n从 5-11 开始，操作员可以通过数据链接下载监控数据并保存到主站。如前所述，嵌入式模块内存有限，因此操作员应定期下载监控数据，然后删除旧数据以为下次监控提供空间。\n\
    \n要删除旧数据，数据管理页面为操作员提供了功能（如果操作员不删除旧数据且内存满了，采集软件将删除旧数据以便为第二天留出空间）。\n\n要删除旧监控数据，操作员只需点击需要删除的监控数据，然后点击删除菜单。点击删除菜单将删除所选的监控数据。图\
    \ 5-12 显示了删除菜单\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_102_0.png)\n\n> 图 5-12：删除菜单\n\
    \n### 5.4.2 设置参数\n\n在设置参数链接处，操作员可以访问参数网页。访问此网页需要密码。操作员进入此页面后，可以选择要设置的逆变器。一旦操作员选择了逆变器，所有参数的当前值都将显示。这将帮助操作员在调整时不会出错。图\
    \ 5-13 显示了首页的一项功能。该程序将通过项目使用。\n\n## 第 5 章：实现与结果\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_103_0.png)\n\
    \n> 图 5-13：首页功能\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_103_1.png)\n\n> 图\
    \ 5-14：设置网页\n\n"
