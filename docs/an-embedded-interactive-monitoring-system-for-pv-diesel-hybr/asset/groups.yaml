    # Appendix E: Embedded Hardware Module and Modems


    # E.2.3 Configuration of M20


    +   - SIM CARDS


    +   There are 3 types of SIM cards

    5 volt SIMs (older style)

    3/5 volt SIMs

    3 volt SIMs


    +   - The M20 Terminal will not operate with a 5 volt SIM

    - We believe (but have not yet confirmed) that The M20 Terminal will not operate
    with 3/5 volt SIM

    Refer to the telstra SIM Cards for Data Calls for further information on SIM cards
    for data calls.


    +   - OPERATING VOLTAGE


    The current version of the M20 Terminal has supply voltage range of 8 to 15 volt
    DC.

    The voltage range may be extended to 8 to 24 volt DC by connecting a 1-ohm ½ watt
    series resistor in the supply line. The M20 Terminal must be protected with a
    1.25 amp fast blow fuses.


    +   - IGNITION LINE


    The M20 Terminal has a positive supply line and an ignition line. To turn the
    M20 Terminal ON and OFF off.


    +   1. Connect the supply line permanently.

    Turn the Terminal ON by pulse the ignition line ON for longer than one second
    then leave it off.

    Turn the Terminal OFF by using ^AMMSO AT Command.


    +   2. Connect the supply line and the ignition line

    Turn the M20 Terminal ON connect these lines to the supply

    Turn the M20 Terminal OFF disconnect these lines from the supply.

    Note of the operation ignition line is different to that of the supersed M1 Terminal.


    +   - CONFIGURING THE M20 TERMINAL


    With all modules, the M20 Terminal must be configured so that it can

    -communicate to the PC or data device connected to its serial (RS232 port)

    -communicate on the communications network (i.e. the mobile telephone network)


    +   - BAUD RATE


    The factory default baud rate of the M20 Terminal to the PC or data device is
    19200.

    The supersed Terminal, the M1 GSM modem (factory default) baud rate to the PC
    or data device is 9600 baud.


    # E.2.4 Set Up Procedure for M20


    +   - SIM CARDS


    +   A SIM is require that

    1. Is 3 volt and

    2. Has a non-transparent data number assigned to it.


    +   - BAUD RATES


    The mobile phone GSM (bearer service rate) will always be 9600 baud.

    The Baud rates between the data device and the M20 Terminal and the M20 Terminal
    (or line mode) at the receiving device (PC) can be different.

    to ensure that the system always sends messages correct the Baud rate of the M20
    Terminal serial port ( RS232 port ) should be locked to be the same as the data
    device it be connected to.


    +   - TO CONFIGURE THE M20 TERMINAL


    User will need PC (with a terminal program as Win Terminal, Hyper Terminal, Procom
    etc.).

    1. M20 Terminal (with connected aerial and power supply and a SIM which has a
    data number).'
