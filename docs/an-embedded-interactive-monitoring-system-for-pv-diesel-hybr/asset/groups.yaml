    # 第 4 章：农村混合系统的交互式监控网站


    ## 4.3.2 数据采集单元


    这是一个嵌入式 Linux 系统模块，包含数据采集软件、Web 服务器（在前章中描述）以及用于 GSM 调制解调器的硬件连接。它对输入功率的要求非常低。模块中安装了用于网站的
    Apache 服务器。采集单元与逆变器之间的通信可以通过 RS232 或 RS485 接口实现。


    数据采集软件有两个主要任务。首先，它将下载并记录所有测量数据，在项目中，这些数据将每一分钟采集一次。其次，软件将接收来自网站发送的新参数，然后并将这些参数发送到逆变器。数据采集软件或数据存储软件将在章节末尾介绍。


    ## 4.3.3 通信单元


    它将基于基于 TCP/IP 网络 GSM 调制解调器。GSM 技术是一种工业级无线解决方案，适用于全球每一个 GSM 网络 [12]。在项目中，GSM 调制解调器集成了
    RS232 接口，可以通过 Linux 操作系统控制。


    ## 4.4 监控数据与存储


    第一个要问的问题是：“监控什么？”这通常分为两类：


    - 系统产能（最基本的信息）

    - 详细的工程信息，例如各种组件的性能（组件的输入、输出）

    - 更具体的针对研究的信息（取决于所需信息，例如太阳辐射）


    分析需求决定了监控变量。表 4-1 显示了项目监控变量的示例。


    表 4-1：监控变量示例


    | 变量 | 缩写 |

    |---|---||

    | PV电压 | Upv-lst |

    | PV 电流 | Ipv-lst |

    | AC电压 | Uac |

    | AC 电流 | Iac |

    | AC 频率 | Fac |

    | 电池电压 | Ubatt |

    | 电池电流 | Ibatt |


    采集数据将以文本文件格式存储在嵌入式模块的内存中（例如：data_date.txt），因为文本文件可以使用多个程序打开。每个文件的名称将是监控日期。


    由于嵌入式模块内存有限，网站将允许操作人员通过网站删除数据文件以管理内存存储。


    模块内存存储容量足够存储十个月的数据，因此操作人员必须在十个月内下载监控数据，否则最旧的数据将被删除以提供下次存储的空间（事实上，这种情况不会发生，操作人员通常至少每月访问一次数据）。


    监控系统开始运行后，应尽快开始系统数据分析。分析应该定期进行，例如每月一次。这不仅可以显示混合系统和监控系统是否工作正常，而且当发生问题时，操作人员可以立即对系统采取行动。


    为了实现监控网站，通信网络是远站与主站之间的连接。因此，有必要理解通信网络。下一节将介绍通信网络概述以及监控网站的网络。


    ## 4.5 通信网络概述


    计算机网络是一组相互连接的独立计算机（称为节点）、站点或主机，它们能够通过通信线路交换数据 [31]（见图 4-3）。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_83_0.png)


    根据传输技术将网络分为两类：


    - 广播

    - 点对点（点对等，PPP）


    广播网络的特点是所有机器共享同一个传输（逻辑）信道。因此，当一台机器在此类网络上发送消息时，所有机器无一例外地接收到它。此类网络上的机器使用地址进行标识。


    点对点（点对等）网络的特点是通信信道仅连接两个特定的机器，这意味着消息必须从一台机器跳到另一台机器才能到达终点。本项目将考虑这种网络。


    网络的基本概念是用户之间的通信和数据交换。通信系统负责信息的传输并准确交付最终用户。在这种背景下，有必要建立规则以便发送方和接收方能够相互理解。这些规则由协议机制管理。


    协议对应于层的特定实现。层和协议的集合被称为网络架构。提到了两种重要的网络架构：OSI（开放系统互连）和 TCP/IP 参考模型。


    ### 4.5.1 开放系统互连 (OSI) 参考模型


    OSI 参考模型由国际标准组织（ISO）于 20 世纪 70 年初开发。它为数据通信系统提供了一通用设计指南，并提供了一种描述数据通信系统不同部分（层）如何交互的标准方法。


    计算机上构成 OSI 模型的协议分层结构被称为“栈”。栈中的某一层向其下方的层发送命令，并接收来自上层服务的命令。


    从高到低七层依次为：应用层、表示层、会话层、传输层、网络层、数据链路和物理层（见图 4-4）。


    - 应用层包括直接服务用户的软件，提供如 API 等功能。

    - 表示层处理数据加密、压缩和翻译。

    - 会话层管理应用程序之间的对话。

    - 传输层确保端到端通信和错误恢复。

    - 网络层确定数据的路径（路由）。

    - 数据链路层提供节点到节点的交付和媒体访问控制（MAC）。

    - 物理层提供传输的电机械接口。


    ### 4.5.2 TCP/IP 参考模型


    TCP/IP 通常指网络架构，但这个缩写也指两个紧密结合的协议：传输协议 TCP（传输控制协议）和 IP（互联网协议）。“TCP/IP 模型”实际上是一种网络架构，其中四种协议起着主要作用，它们构成了最常见的实现。


    TCP/IP 参考模型可以描述为四层架构（见图 4-4）：


    - 应用层与 OSI 模型不同，这一层直接与传输层绑定，仅是因为会话层和表示层是没用的。

    - 传输层的作用与 OSI 模型中的传输层相同；它用于使对端之间进行对话。正式地说，该层有两种实现：TCP 协议（传输控制协议）和 UDP（用户数据报协议）。

    - 互联网或网络层是架构的核心。它在不建立连接的情况下实现远程（异构）网络的互连。它的作用是将数据包注入任何网络，并独立地将它们交付到各个终点。

    - 主机网络或链路层，它似乎包含了 OSI 模型中的物理层和数据链路层。实际上，这一层并没有被具体规定；该层的唯一限制是允许主机发送网络中的 IP 数据包。


