    Regarding the dynamic processes over voltages partly due to the chemical reaction
    and any processes such as diffusion processes of ions in the electrolyte are simplified
    summarized and are described as a polarization voltage ($V_o$) whereas a voltage
    drop in the electrolyte is represented by the grid and by a resistance $R_{eq}$.


