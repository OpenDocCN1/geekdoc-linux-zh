    1969 年构想。


    - 链接（Link）：链接是从一个单词、图片或信息对象到另一个可选择的连接。在万维网等多媒体环境中，此类对象可以包括声音和动态视频序列。最常见的链接形式是高亮显示的单词或图片，用户可以（通过鼠标或其他方式）对其进行选择，从而导致另一个文件的即时传送和查看。被高亮的对象被称为锚点（anchor）。锚点引用和所引用的对象构成了超文本链接。


    - 内核（Kernel）：内核是计算机操作系统的本质中心，是为操作系统所有其他部分提供基本服务的内核。它的同义词是 *nucleus*（核）。内核与外壳（shell）相对，外壳是操作系统的最外层，与用户命令交互。在
    Unix 和某些其他操作系统中，*Kernel*和*shell*的使用频率比在 IBM 主机系统中更高。


    - 局域网（LAN）：局域网（local））是一组计算机和相关设备，它们共享一条公共通信线路或无线链路，并通常在小地理区域内共享单个处理器或服务器的资源（例如在办公大楼内）。


    - Linux：Linux（通常读作带有软 "j" 音的 LIUX）是一种类 Unix 操作系统，旨在为计算机用户提供一个免费或极低成本的与传统 Unix
    系统相当的操作系统。Linux 被誉为非常高效的系统。Linux 内核由 Linus Torvalds 在 1991 年开发。内核是由 Linus Torvalds
    在芬兰赫尔辛基大学开发的，PHP 是软件基金会（Software Foundation）的成员。在 Web 编程中，PHP 是一种主要用于 Linux 服务器的脚本语言和解释器。


    - 操作系统（Operating system）：操作系统（有时缩写为 OS）是管理计算机硬件的程序。


    - 内存（Memory）：内存是计算机存储操作系统、应用程序和当前使用数据的地方，以便处理器快速访问。


    - MIME：MIME（多媒体邮件扩展）是互联网协议的一种类型扩展。


    - PPP：PPP（点点协议）是一种通过电话串行接口在两台计算机之间通信的协议。


    - 协议（Protocol）：在信息技术中，协议是通信端点在通信时使用的特殊规则集。


    - OSI：OSI（开放系统互连）是关于数据如何在系统中传输的模型。


    - PC/104：它是嵌入式计算机（http://www.pc104.org/）。


    - 外围（Peripheral）：外围（读作 peh-RI-uhl，名词）是计算机核心之外设备，其同义词是输入输出（I/O）设备。


    - PHP：PHP 最初源自 Personal Home Tools，现在代表 PHP: Hypertext Preprocessor（超文本预处理器）。


    - POP3：POP3（邮局协议 3）是接收电子邮件的最新标准版本。POP3 是一种客户端/服务器协议，电子邮件在服务器上被保留。用户（或电子邮件接收者）定期检查服务器上的邮箱并下载任何邮件。


