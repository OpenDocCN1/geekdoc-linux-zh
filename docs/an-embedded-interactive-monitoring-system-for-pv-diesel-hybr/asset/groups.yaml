    # Chapter 4: The interactive monitoring website for the hybrid systems in rural
    areas


    ![](img/8191fe2ca5a41746557b10ddfe82a205_87_0.png)


    Figure 4-5: The network layers of monitoring system


    # 4.7 World Wide Web (The Client and Server Pair)


    As a standard website is used for accessing the monitored data, this section will
    describe a principle of internet, which normally called "www". The World Wide
    Web is often called "WWW" or simply the "Web". It brings millions of people all
    over the world for communication on the Internet. Users simply use the web browser
    and "click" in order to display a variety of multimedia information. The web browser
    can be viewed as a web client which helps users to access the oceans of information
    on the Internet. On the other hand, the Web Server serves to thousands of web
    clients.


    The Web is decentralized. It uses the Internet to connect the client (the customer)
    and the server (the provider). The Internet is composed of a wide variety of computers
    and networks that interoperate so that data can be exchanged among them.


    The Web is made by the following key technologies:


    +   * The address system, Universal Resource Locators (URLs), allow retrieval
    of different kind of information on the Internet

    * The Hyper-Text Transfer Protocol (HTTP) defines the language (protocol) of how
    web clients and servers should exchange multimedia information

