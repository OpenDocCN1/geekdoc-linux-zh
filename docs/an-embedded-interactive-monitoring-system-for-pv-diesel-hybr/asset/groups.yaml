    \ 元电荷 [$1.6\\times10^{-19}$ 库仑]\n- $V$ 电压 [V]\n- $k$ 玻尔兹曼常数 [$8.65\\times10^{-5}$\
    \ eV/K]\n- $T$ 二极管温度 [K]\n\n当光照射在太阳能电池上，由于光伏效应产生了自由电荷载子。这使得载流能够流过连接的负载。太阳能电池内部产生的光生电流与辐射强度成正比。图\
    \ 2-6 描述了太阳能电池的等效电路图。\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_36_1.png)\n\n\
    图 2-6：太阳能电池的等效电路图\n\n理想光照下太阳能电池的数学过程得出以下方程：\n\n```\n$I_{PV} = I_{ph} - I_D = I_{ph}\
