    # Chapter 1: Introduction


    Therefore, the operator has an ability to enable immediate action to the hybrid
    system when system needed. Thus, to fulfil all requirements, a suitable monitoring
    system for the hybrid system in remote areas has to be developed.


    ## 1.4 Research objectives and methodology


    As mentioned, it is a need to develop a suitable monitoring system for the hybrid
    system in remote area, which provides the monitored data as well as a capability
    to set the operation parameters online. Therefore, the reliability of the hybrid
    system can be improved. The objectives and methodology for developing the monitoring
    system will be described in next section.


    ### 1.4.1 Objectives


    The objectives of the work are:


    - Development of a suitable and effective monitoring software for the PV-diesel
    hybrid system in remote area using web base technology

    - Development of interactive monitoring website that provides a possibility to
    download data as well as set operation parameters online via a standard web browser

    - Implementation of a low power hardware module for the web server because it
    can reduce the energy consumption. As the advantage of opens, the embedded Linux
    operating system is utilized for the website monitoring system

    - As the PV-diesel hybrid system is used to supply energy in remote areas, where
    lack of infrastructure and no internet connection, the wireless technology is
    provided for the communication, the GSM modem is selected for the project

    - Implementation of the interactive monitoring website and analysis of the monitored
    data to investigate its results


    From the objectives of the work, the monitoring system will include the internet
    technology to provide the monitored data at the website. The operators can access
    the data via a web browser. As communication networks expand and the quality continues
    to improve, the remote areas lack of telephone connection, thus it becomes more
    attractive to a network like GSM. Using this technology, data is delivered directly
    to the main station and the network will not generate any additional costs for
    operator.


    The monitoring system in this project is comprised of a monitoring unit (sensor
    unit), a data acquisition unit, and a communication unit. The data acquisition
    unit will collect the monitored data from the sensor unit and store the data into
    web server. The operators have an ability to download data as well as to set operation
    parameters online via the website. Figure 1-8 shows objectives and tools.


