    Chapter 6 will describe conclusions of the work.


    # Chapter 2: PV-Diesel hybrid system technology


    ## 2.1 Introduction


    PV-diesel hybrid systems generate electricity by a combination of photovoltaic
    array and a diesel generator. They can be categorized according to their configuration
    as:


    - A) DC-Coupled Hybrid System or DC Bus Configuration


    The DC-coupled hybrid system (figure 2-1), the energy from diesel generator and
    PV array is used to charge the battery bank. The inverter converts DC voltage
    from BUS to AC voltage to the load. The capacity of battery bank and inverter
    should meet the peak load demand. The capacity of diesel generator should also
    meet the peak load and charging the battery bank simultaneously.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_33_0.png)


    Figure 2-1: DC Bus Configuration


    - B) Switched hybrid system or DC-AC Bus Configuration


    The switched hybrid system (figure 2-2), the battery bank can be charged by the
    diesel generator and the PV array. The load can be supplied directly by the diesel
    generator. If the diesel generator output-power exceeds the load demand, the excess
    energy will be used to recharge the battery bank. During period of low demand,
    the diesel generator is off and the load is supplied by the PV array, together
    with stored energy from the battery bank. When comparing the overall efficiency,
    the switched system is higher than the DC-coupled hybrid system.


    | PV Array | Converter | Rectifier | Diesel Generator |

    |---|---|---|---|

    | | | | |

    | | | | Change-over switch |

    | | Battery Charger | Inverter | |

    | | DC BUS | AC BUS |


    Figure 2-2: Switched hybrid system


    C) AC-coupled hybrid system or AC Bus Configuration

    The AC-coupled hybrid system (figure 2-3), the diesel generator can supply the
    load directly. The battery bank needs a bi-directional inverter to supply to the
    load. During low energy demand, excess energy from PV array is used to charge
    the battery bank. The bi-directional inverter can charge the battery bank also
    when excess energy is available from the diesel generator. The AC-coupled hybrid
    system has two major advantages over the DC-coupled and switched hybrid system.
    The capacity is from inverter plus the diesel generator capacity, rather than
    individual component ratings that limits the maximum load. Second, the capability
    to synchronize the inverter with the diesel generator allows greater flexibility
    to optimize the operation of the system. This configuration will be implemented
    for this project.


    | PV Array | Inverter | Diesel Generator |

    |---|---|---|

    | | | |

    | Battery Bank | Bi-directional Inverter | AC Load |


    Figure 2-3: AC Bus Configuration


    The Off-grid electrification technology options (remote area power supply RAPS)
    and hybrid system options can be an economic alternative to remote grid extensions.

