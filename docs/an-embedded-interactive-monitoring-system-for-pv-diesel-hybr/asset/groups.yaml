    ## 第 2 章：光伏-柴油混合系统技术


    如前所述，太阳能电池通过串联和并联形成一个光伏组件。串联电池的数量决定了组件的电压，而并联电池的数量决定了电流。如果许多电池串联，单个电池的阴影可能会导致被遮挡电池或材料的损坏，导致组件出现起泡和破裂。为了避免这种运行工况，如图
    2-12 所示，将旁路二极与太阳能电池反并连接。结果是太阳能电池的反向电流方向不会产生较大的电压差。在实践中，每 15-20 个电池连接一个旁路二极就足够了。当光伏组件部分被遮挡时，旁路二极还允许电流流过，即使电压和功率有所降低。旁路二极不会引起任何损失，因为在正常运行下，电流不会流过它们。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_41_0.png)


    图 2-12：带有旁路二极的串联光伏电池


    如图 2-13 所示，串联配置的 I-V 特性曲线是给定辐射强度下的结果，对于三个太阳能电池是相等。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_41_1.png)


