    此外，还需要考虑这些参数也取决于电流方向（充电或放电）。当电池处于静止或开路状态时，$V_B = V_E$。当从电池提取电流时，电压将低于 $V_E$。当电流流入电池时，端电压将高于
    $V_E$。因此，在放电阶段的每一个时刻，端电压可以推导出如下：


    ```

    $V_B = V_E - V_{in}$ \hfill (2-5)

    $$V_B = V_E - R_{in} \cdot I_B$ \hfill (2-6)

    ```


    其中：

    $V_B$ = 端电压 $[V]$

    $V_E$ = 平衡电压 $[V]$

    $V_{in}$ = 内损耗电压 $[V]$

    $R_{in}$ = 内阻 $[\Omega]$

    $I_B$ = 放电电流 $[A]$


    显然，较高的放电电流会导致端电压降低。因此，为了通过电池电压确定电池状态，应该测量放电电流。


