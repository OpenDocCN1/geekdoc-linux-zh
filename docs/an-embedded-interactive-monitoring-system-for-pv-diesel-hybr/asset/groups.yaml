    # 5.5 Result of data analysis


    As mentioned, the monitored data is stored as a text file. Data analysis can be
    started soon as the operator finished downloading the monitored data to the main
    station. Data analysis will be done on a routine basis, for example once a month.
    This will help the operator to make sure that the system is working properly and
    when problems occur, the operator can enable action in time.


    # 5.5.1 The monitored data from the battery inverter


    A monitored data file can be implemented with several programs. The Excel program
    is used to implement the monitored data file through this project. As mentioned,
    the data analysis can indicate the reliability of the system and the operator
    can learn the system behavior from the analysis. The file of the monitored data
    includes a time of monitoring and other important parameters. Figure 5-15 is an
    analysis of the monitored data: power converted from battery (Pconv), power from
    PV module (Ppv), and power from generator (Pext).


    From figure 5-15, it can be described as:


    +   - Graph begins at midnight, the power from battery has supplied the load.
    The power from PV module is zero (no radiation).

    - In the morning, the load is increasing. Unfortunately, the weather is not so
    good on this day that the power from PV module is not so high. The battery is
    still a main power supply for the load. It has obviously seen that when the radiation
    is high, the battery decreases the power to the load.

    - Until about 19.30 PM, the battery is empty so that the generator starts to supply
    the energy to the system. It shows that the power from battery is negative at
    this time. This indicates that the power from the generator also charges the battery.

    - When the battery is full, the generator stops running. The battery supplies
    power to the load.


    The graph from figure 5-15 indicates that the hybrid system is working properly.
    Furthermore, the operator can learn the behavior of the system in order to optimize
    and design the new system in the future.'
