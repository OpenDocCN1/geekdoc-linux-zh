    # Chapter 1: Introduction


    ## Chapter 1

    Introduction


    ### 1.1 Photovoltaics (PV) and trends


    The decentralized use of PV is discussed as an important tool to cope with the
    current environmental problems associated with electricity generation and electricity
    and to provide clean energy now and for the future [2]. In the last decade of
    the 20th century the world market penetration of PV has been increased tremendously
    worldwide, see first 1-1, 1-2.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_24_0.png)


    Figure 1-1: Development of the PV world market 1992 – 2003


    Source: Paul Mayrock, PV NEWS Annual review of the PV market, 2004


    ## World PV production 1995-2003 (% of total)


    ![](img/8191fe2ca5a41746557b10ddfe82a205_24_1.png)


    Figure 1-2: Development of PV in different regions 1995 – 2003


    As shown in figure 1-1, the PV market has increased rapidly by the end of 2003
    the PV world market was double of year 2001. Figure 1-2 indicated that the PV
    market is growing in every region especially in Japan. Furthermore, it can be
    considered that the development of the PV world market by product category, more
    than 50% of the PV world production went to the small decentralised grid-connected
    systems (SGCS) (see figure 1-3). In 1990, there were mainly stand-alone systems
    in remote areas and the application for communication and consumer products were
    prevailing. At the end of the decade, SGCS became dominant as in 1-3.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_25_0.png)


    Figure 1-3: The development of the PV world market by product category and the
    relevance of small grid-connected PV systems (SGCS) [2]


    This development was brought about by means of a wide variety of promotion strategies
    and dissemination programmes. Special interest is that these initiatives were
    launched by quite different organizations and institutions. Governmental bodies
    on national and on local levels have launched strategies as electric utilities
    and NGO''s [2].


    Figure 1-4 shows the currently installed PV capacity per capita in various countries.
    With respect to SGCS, it can clearly be seen from figure 1-4 that there are tremendous
    differences between countries with a high density of population and/or grid-connection
    (e.g. NE, DE, CH, JP) and countries with a low density (e.g. SE, AU, FI). It can
    also clearly be seen that the most successful countries are those with the most
    ambitious programmes: Switzerland, Japan and Germany, or where off-grid PV is
    cost-effective: Australia.

