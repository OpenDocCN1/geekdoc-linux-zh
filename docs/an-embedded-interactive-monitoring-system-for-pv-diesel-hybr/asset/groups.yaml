    UDP : UDP (User Datagram Protocol) is a communications protocol that offers a
    limited amount of service when messages are exchanged between computers in a network
    that uses the Internet Protocol (IP). UDP is an alternative to the Transmission
    Control Protocol (TCP) and, together with IP, is sometimes referred to as UDP/IP.
    Like the Transmission Control Protocol, UDP uses the Internet Protocol to actually
    get a data unit (a datagram) from one computer to another. Unlike TCP, UDP does
    not provide the service of dividing a message into packets (datagrams) and reassembling
    it at the other end. Specifically, UDP does not provide sequencing of the packets
    that data arrive. This means that the application that uses UDP must be able to
    make sure the entire message has arrived and is in the right order.


