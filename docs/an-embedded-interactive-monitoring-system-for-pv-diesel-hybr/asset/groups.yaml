    # 一用于农村地区光伏-柴油混合动力系统的嵌入式交互式监控系统


    Boonyang Plangklang


    本论文由卡塞尔大学电气工程/计算机科学系提交，作为获得工程学博士（学术学位，即工学博士学位（Dr.-Ing.）的论文。


    Erster Gutachter: Prof. Dr.-Ing. Jürgen Schmidt

    Zweiter Gutachter: Prof. Dr.-Ing. Albert Claudi


    口头答辩日期：2005年2月4日


    德国国家图书馆书目信息：

    Deutsche Bibliothek verzeichnis diese Publikation in der Deutschen Nationalbibliografie;
    detaillierte bibliografische Daten sind im Internet über http://www.ddb.de abrufbar


    Quelle: Kassel, Univ., Diss. 2005

    ISBN 3-89958-128-8

    URN urn:nbn:de:0002-1280


    © 2005, kassel university press GmbH, Kassel

    www.upress.uni-kassel


    封面设计: 5 Büro für Gestaltung, Kassel

    打印与装订: 卡塞尔大学印刷厂

    德国制造 (Printed in Germany)


    # 致谢


    我要向泰国的拉贾马格拉理工大学（RMUT，前身为拉贾马格拉理工学院，RIT）致以最基础且独特的谢意，该校为我的论文提供了资金支持。我非常感谢并深谢 Jürgen
    Schmid 教授（工程博士）在整个工作过程中提供的宝贵指导、引导和鼓励。


    我还要感谢 Albert Claudi 教授在整个论文期间期间的大力支持和有用讨论。


    主要研究工作是在德国卡塞尔大学高效能源转换系（IEE-RE）完成的，因此向 IEE-RE的研究人员和同事表示感谢。


    感谢我的家人和朋友一直陪伴我，并给予我的爱与理解。


    Boonyang Planglang


    # 摘要


    自主光伏-柴油混合动力系统在全球范围内安装，用于为没有电网且交通通常不便的偏远农村地区提供电力。在这种环境下，以传统方式妥善监控光伏-柴油混合系统也非常困难。


    为了保持光伏-柴油混合系统的正常可靠运行，有必要包含一个监控系统。本论文将描述一种基于嵌入式 Linux 系统的交互式 Web 技术，用于光伏柴油混合系统的远程监控。


    在大多数远程监控系统中，信息从远程站收集到主站。大多数在某些类型监控下的光伏系统在安装后至少会运行几年。在此类农村地区的常见系统通过年度访问结合数据记录仪进行监督。在系统的整个生命周期内，监控成本大大超过了系统本身的成本。维护、修理和产品改进的响应时间较差。之前已经有一些监控系统作为
    SCADA（监控、控制和数据采集）甚至基于卫星的系统提出。然而，这些方法公认的问题是：投资成本高、客户站需要特殊软件以及通信链路存在困难。


    利用互联网进行监控是近期变得可行的另一种选择。然而，在偏远和农村地区将互联网与混合系统结合，在技术和经济上仍然是低效的。因为偏远地区没有电话线覆盖和互联网连接。此外，用于
    Web 服务器的典型计算机消耗大量能量。


    为了克服这些缺点，本论文研究并开发了一个带有交互式监控网站的嵌入式 Linux 模块。这是一个用于 Apache Web 服务器的极低功率输入的小型嵌入式
    Linux 模块。该嵌入式模块提供常用的 Web 服务器和数据采集单元。监控数据库可以存储在 Web 服务器中，并通过 GSM 模块连接到工作站。通信将基于
    GSM 技术。可以通过标准的 浏览器访问监控数据库。访问网站时，操作员可以下载监控数据并向系统上传重要参数。


    通过实施嵌入式 Web 技术，对监控系统的初始成本和运行成本均进行了研究。已经实现了通过标准 Web 浏览器在线访问数据并更改运行参数的能力。


    嵌入式交互式监控系统的实施结果将作为标准，以证明其是否为缺乏基础设施的远程监控提供了合适的解决方案。将对被监控数据进行分析，以研究光伏柴油混合系统的行为，从而优化和改进系统。


    # 摘要（德语原文）


    全球范围内安装了离网型光伏-柴油混合系统，为偏远和农村地区提供电力，这些地区既没有接入供电网，也没有电话网络，而且通常难以到达。调节光伏柴油混合系统并保持良好的可靠运行变得越来越困难。


    为了稳定可靠地运行光伏混合系统，有必要集成一个监控系统。本论文研究并开发了一种基于嵌入式 Linux 系统的交互式 Web 技术，用于光伏柴油混合系统的远程监控。


    在大多数远程监控系统中，信息从远程站传输到主站。大多数光伏系统在安装后几年内接受某些类型的监控。此类农村地区的常见系统通过年度访问结合数据记录仪进行监督。在系统的整个生命周期内，监控成本显著超过了系统本身的成本。维护、维修和产品改进的响应时间较差。之前介绍过一些
    SCADA（监控控制和数据采集）甚至基于卫星的系统。然而，这些方法已知的问题是：投资成本高、客户站需要特殊软件以及通信链路困难。


    利用互联网进行监控是近期可行的另一种选择。但在偏远农村地区将互联网与混合系统结合在技术和经济上仍然是低效的。因为那里没有电话线覆盖和互联网连接。此外，典型的
    Web 服务器电脑能耗很高。


    为了克服这些缺点，本论文研究并开发了一个带有交互式监控网站的嵌入式 Linux 模块。这是一个具有极低功率输入的 Apache Web 服务器小型嵌入式 Linux
    模块。该嵌入式模块提供了一个通用的 Web 服务器和数据采集单元。监控数据库可以存储在 Web 服务器中，并通过 GSM 模块连接到工作站。通信基于 GSM
    技术。可以通过标准浏览器访问监控数据库。访问网站时，操作员可以下载监控数据并向系统上传重要参数。


    通过实施嵌入式 Web 技术，对监控系统的初始成本和运行成本均进行了研究。已经实现了通过标准浏览器在线访问数据并更改运行参数的能力。


    该嵌入式交互式监控系统的实施结果将作为标准，以证明其是否是缺乏基础设施的远程监控的适用解决方案。将对被监控数据进行分析，以研究光伏柴油混合系统的行为，从而优化和改进系统。


