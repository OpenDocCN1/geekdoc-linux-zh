    # Appendix D: PV inverter: Sunny Boy


    ## D.2 The technical data


    ### Input values (solar generator)


    Input voltage range: $U_{PV}$ 125 .. 250 V DC

    (corresponds with 700 WPACnom)

    changeable to 100 .. 200 V DC

    (corresponds with 560 WPACnom)

    or

    75 .. 150 V DC

    (corresponds with 420 WPACnom)

    depending on the input voltage. 3.1 to 6.2 A


    Input current: $I_{PVnom}$


    ### Output values (main connection)


    Nominal output power: $P_{ACnom}$ 700 W, 560 W, 420 W

    Working range, mains voltage: $U_{AC}$ 196 - 253 V AC

    Working range, mains frequency: $F_{AC}$ 49.8 - 50.2 Hz

    Output current distortion factor: $K_{IAC}$ < 3 %

    (at $K_{Umains}$ < 2 %, PAC > 0.5 $P_{ACnom}$)


    Phase shift factor: $Cos \phi$ 1


    EMC: EN 50081, part 1

    EN 50082, part 1

    EN 60555, EN 55014


    Mains retroaction: 1.5 kV


    Test voltage:


    Mains supervision: automatic disconnection device according to VDEW


    ### Power consumption


    Internal consumption during operation: ca. 4 W

    Internal consumption during night operation: 0 W


    ### Efficiency


    Max. efficiency: $\eta_{max} \geq$ 93 %


    ### Size and weight


    Size (W x H x D): ca. 322 x 290 x 180 mm

    Weight: ca. 18.5 kg


    ### Environmental conditions


    Admissible ambient temperature range: -25 °C to +60 °C

    Admissible relative humidity: 0 .. 93 %, non-condensing


    ## D.3 Parameter list


    ### Table D.1 Measured parameters of Sunny Boy 750


    | Name | Unit | Description |

    | --- | --- | --- |

    | Upv-lst | V | PV-input voltage |

    | Upv-Soll | V | PV-desired voltage of the internal Upv-control |

    | Lac-lst | mA | Current to the grid |

    | Uac | V | Grid voltage |

    | Fac | Hz | Grid frequency |

    | Pac | W | Power fed to grid |

    | Zac | mOhm | Grid impedance |

    | Riso | mOhm | Isolation resistance |

    | Lpv | mA | Current from PV-panels |

    | E-Total | kW/h | Energy yield |

    | h-Total | Hour | Total operation hours |

    | Netz-Ein | Hour | Total system starts up |

    | Seriennummer | - | Sunny Boy serial number |

    | Status | - | Status message |

    | Fehler | - | Failure description for status “failure” |


    ## D.4 Status parameters


    The Status parameter is the message that shows how Sunny Boy works. This is very
    important for the operators to determine the status of the system. The Status
    messages are in the table E.2.


    ### Table D.2: Status Message


    | Status message | Descriptions |

    | --- | --- |

    | Stop | Manual system stop |

    | Offset | Offset calibration of the electronics |

    | Warten | Grid connections are not fulfilled (yet) |

    | Netzeb. | Checking grid (grid impedance) |

    | Zuschalt | Electronics are connecting to grid |

    | MPP-Such | PV voltage is determined and set |

    | MPP | Sunny Boy is in constant voltage mode |

    | UKonst. | Sunny Boy is in constant voltage-mode |

    | Derating | Reduction of current fed to the grid |

    | Stoer. | Failure |


    ## D.5 The error message


    The Fehler parameter is the message that shows failures of Sunny Boy. The failure
    messages are in table E.3.


    ### Table D.3: Error Message


    | Error message | Description |

    | --- | --- |

    | F-Bfr-Srr | Communication between microcontrollers is failing |

    | F-EEPROM | EEPROM can not read or written in |

    | F-EEPROM dBh | EEPROM can not read or written in |

    | F-Fac-Bfr | BFR-frequency measurement – out of tolerable range |

    | F-Fac-Srr | SRR-frequency measurement – out of tolerable range |

    | F-dZac-Bfr | BFR-sudden change of impedance– out of tolerable range |

    | F-dZac-Srr | SSR- sudden change of impedance– out of tolerable range |

    | F-Imax | over current |

    | F-NUW-UAC | Different values between BFR and SRR for grid voltage |

    | F-NUW-FAC | Different values between BFR and SRR for grid frequency |

    | F-NUW-Mess | Different values between BFR and SRR for Vac, and Zac |

    | K1-Schlies | Relay test failed |

    | K1-Trenn | Relay test failed |

    | F-NUW-ZAC | Different values between BFR and SRR for impedance |

    | F-Offset | check for grid voltage or power failure |

    | F-Rechner | BFR or SSR failure |

    | F-Riso | Isolation out of tolerable range |

    | F-Uac-Bfr | BFR-grid voltage measurement – out of tolerable range |

    | F-Uac-Srr | SSR-grid voltage measurement – out of tolerable range |

    | F-UpvMax | input voltage above the tolerable value |

    | F-Zac-Bfr | BFR-grid impedance measurement – out of tolerable range |

    | F-Zac-Srr | SSR-grid impedance measurement – out of tolerable range |

    | F-Watchdog | operation control triggered |

    | F-ROM | Failure during ROM test |


    Special abbreviations:

    BFR = Betriebsrechner (Sequential Control System)

    SRR = Stromregelungsrechner (Current Control System)


