    # Chapter 3: Embedded Linux module: software and hardware


    From Fig. 3-8, HTTPd stands for HTTP daemon. A daemon is a UNIX process that implements
    the server side of a protocol. HTTPd is the program that runs on UNIX to establish
    a web server. Daemons are unique to UNIX (which some would call a demonic OS).
    Other platforms, such as Microsoft Windows NT, the web server is a background
    process implemented as a system service.


    From figure 3-8 there can be described steps of serving a web document from a
    web server as:


    +   1. The httpd waits for a request to arrive from a web client in the Internet.

    2. When a user clicks on a hyperlink such as www.openloop.com/index.html, the
    network software (TCP stack) of the web client computer locates the server computer
    (using DNS or host file) and sets up a bi-directional network (socket) connection
    from the client to the server www.openloop.

    3. The Web Server parses and understands the request is a GET for information.

    4. The web server now understands the protocol (example: Netscape browser).

    5. The web server will search the file system for /index.html. Success: The document
    is sent, Failure: An error message will be sent:

    6. Close the file and connection (socket), client then receive the data.


