    # Chapter 4


    # The interactive monitoring website

    for the PV diesel Hybrid systems in rural areas


    # 4.1 Introduction


    As illustrated in chapter 2, the autonomous PV-diesel hybrid power supply is used
    worldwide to supply electricity in remote and rural areas where no grid, no telephone
    line coverage, and often difficult accessibility. Therefore, the monitoring system
    for the hybrid system is parallel much important in order to keep the hybrid system
    working reliably. To meet the goals of monitoring, it is necessary to develop
    a suitable monitoring system for the hybrid system. This chapter will propose
    an interactive monitoring website for PV-diesel hybrid system.


    # 4.2 Concept of monitoring by website


    As mentioned, there are other types of monitoring systems (SCADA, satellite) that
    have been presented in order to overcome the goals of monitoring already.


    However, according to many well-known problems with these systems including high
    investment costs, special software requirements for client stations, and difficulties
    with communication links. Therefore these systems have not been recognably implemented.


    With the website system proposed, all above problems can be eliminated. The monitored
    data is stored in the web server, operators can access the data via a standard
    web browser (see Figure 4-1), and the communication link uses a standard GSM modem
    over a TCP/IP network. In most cases, this link already exists and there is no
    need for any special software for viewing the system.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_80_0.png)'
