    ```

    $SOC = \frac{C_{nom} - Q_{Bat}}{C_{nom}} \quad (2-9)

    ```


    where $Q_{Bat} = \int I dt$


    $C_{nom}$: the nominal capacity of the battery (Ah) (i.e. C10)

    $Q_{Bat}$: the Ah-balance (i.e. net Ah discharged or charged since the last full
    state of charge), and $I$ is the main reaction current (A).


    - Relative state of charge: is the ratio between the difference of the actual
    capacity on the one hand and the charge balance on the other hand, as can be seen
    in the following equation (2.10).


    ```

    $SOC = \frac{C_{act} - Q_{Bat}}{C_{act}} \quad (2-10)$

    ```


    where $C_{act}$ is the actual capacity of the battery (Ah). This definition is
    used throughout this work.


    The ability to determine the battery state of charge in a system at any time is
    very important from the point of view of the system operation. Knowing the state
    of charge continuously makes the system energy management possible. In addition,
    for a stand-alone photovoltaic system, the required battery capacity can be more
    accurately determined which implies higher reliability of the energy supply and
    lower system cost [6].


    ### 2.2.2.3 Gassing


    With $2.3 - 2.4$ V, namely the so-called gassing voltage, gas is developed at
    the electrodes in the battery, by which the water is decomposed into hydrogen
    and oxygen. Both gases mix together in the battery providing detonating gas (explosive!)
    and escape through ventilation opening in the vent plug. With the gassing, the
    battery loses water, which must be refilled according to maintenance with regular
    intervals. The gassing is the unwelcome secondary reaction of the chemical conversion
    during charging because current is consumed for the electrolysis and therefore
    the storage efficiency of the battery is made worse unnecessarily.


    After the gassing voltage is exceeded, voltage stays approximately constant. The
    whole charging current during this period results in $H_2$ and $O_2$, which is
    defined as loss. For this reason, gassing can be represented by a Zener diode
    in series with a resistor $R_G$ (Fig. 2-17).


    ![](img/8191fe2ca5a41746557b10ddfe82a205_47_0.png)


    The Zener diode is reverse biased and therefore does not conduct until the charging
    voltage exceeds its breakdown voltage, namely the gassing voltage. Then it functions
    as a voltage regulator by keeping the voltage at constant and allows the charging
    current to pass through, which is dissipated in $R_S$ as heat. It must be noted
    that this concept can be applied only for lead-acid batteries because gassing
    destroys gel batteries (sealed type of lead-acid batteries).


    Continually, heavy gassing damages the battery, so that in the data sheet the
    manufacturers give the so-called maximum charge voltage, which is not allowed
    to be exceeded during charging. This voltage is situated $2.3 - 2.4$ V per cell
    (with $20$ °C) corresponding to $13.8 - 14.4$ V for 6 cells. In many battery types,
    small gassing for a short time is however required to mix the electrolyte and
    to provide an equal concentration for whole cell volume [8].


    ### 2.2.2 Freezing of electrolyte


    For applications with low ambient temperature, the lead-acid battery must also
    be protected against freezing of electrolyte. The risk of freezing depends on
    the state of charge. Figure 2-18 illustrates the freezing limit as a function
    of the state of charge.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_47_1.png)


    24


    ### 2.2.2.5 Cycle life of lead-acid batteries


    The cycle life refers to a capability of the battery to withstand a certain number
    of charge/discharge cycles of given depth of discharge (DOD). Since the lifetime
    of the battery also depends on the average depth of discharge during cycling (expressed
    in percentage (%) of rated capacity), the cycling capability may be more conveniently
    expressed by multiplying this average depth of discharge by the battery lifetime
    expressed in number of cycles. The result is called the nominal cycling capability,
    which is expressed as the number of equivalent 100 % nominal capacity cycles.


    The starter battery typically has a low cycling capability of less than 100 nominal
    cycles, which means that it is able to withstand for example 500 cycles of maximally
    20 % depth of discharge. The battery appropriate for PV application requires a
    good cycling capability of at least 500 nominal cycles, which means that it should
    be able to withstand for example 1000 cycles of 50 % depth of discharge. Fig.
    2-19 shows the cycle life as a function of DOD.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_48_0.png)


    Figure 2-19: Cycle life as a function of deep of discharge (Source: VARTA special
    report 3/1987)


    ### 2.2.2.6 The battery capacity


    Previously, the storage capacity of a battery is expressed in Ah (Ampere-hours)
    showing how many hours a certain current can be taken from the charged battery
    until the battery is discharged, i.e. until the battery voltage drops to the discharge
    voltage threshold.


    Nowadays, it might be more favorable to express a battery capacity in dischargeable
    energy, namely Wh (Watt-hours) or kWh (kilowatt-hours). However, these two ways
    of expressing the battery capacity are equivalent because they are related via
    the battery voltage, i.e. Ah · V = Wh.


    25


    Unfortunately, the capacity of a battery is not a constant quantity, but depends
    on the amount of discharge current. The manufacturers give therefore the rated
    capacity of their batteries with regard to a certain discharge current.


    The so-called rated battery capacity refers to the capacity of the battery under
    given standard conditions: it is common practical to define the rated capacity
    at 20 °C by discharging the battery with a rated battery current ($i_0$), which
    refers usually to a constant current, with the battery will be completely discharged
    in 10 hours. Some battery manufacturers indicate the 100-hour capacity for batteries
    intended for PV applications. When comparing such capacity, it should be remembered
    that, for a given battery, the 100-hour capacity is 30 % higher than the 10-hour
    capacity. Additionally, battery capacity is also affected by temperature: it falls
    by 1 % per degree below 20 °C. Moreover, extreme temperatures accelerate self-discharge
    [8].


    ### 2.2.2.7 Requirements for solar batteries


    Typical requirements for solar batteries are:


    - low kWh-cost

    - long lifetime

    - high overall efficiency

    - very low self-discharge

    - maintenance cost

    - easy installation and operation

    - power


    - Specific kWh-cost


    Usually it refers to a sum of investment and operation costs divided by stored
    kWh during whole life.


    - Lifetime


    The lifetime of the battery should be long, especially in remote areas.


    - Overall efficiency


    The overall efficiency ($\eta$) is derived from columbic efficiency ($\eta$) and
    voltage efficiency ($\eta_v$):


    ```

    $\eta = \eta \cdot \eta_v$

    ```


    (2-11)


    50


    The columbic efficiency is usually measured at the amount of charge able to be
    recalled from the battery ($Q_D$) relative to the amount put in during charging
    ($Q_C$). Self-discharge will affect columbic efficiency.


    $$\eta_H = Q_D / Q_C$$

    (12-12)


    The battery will usually need more charge than was taken to fill up to its starting
    point. Typical average columbic efficiencies are 80–85 % for stand-alone PV systems,
    with winter efficiencies increasing to 90–95 %, due to higher coulomb efficiencies
    when the battery is at a lower state of charge and most of the charge going straight
    to the load, rather into the batteries.


    The voltage efficiency is determined by the average discharge voltage ($V_D$)
    and average charge voltage ($V_C$). $V_C$ is lower than $V_D$ particularly by
    internal resistance of the battery.


    $$\eta_V = V_D / V_C$$

    (13-13)


    The overall efficiency ($\eta_H$) should be as high as possible, to be able to
    pass the biggest proportion of the energy in the battery, which is generated by
    the PV generator, further to consumers.


    There are many types of batteries potentially available for use in stand-alone
    PV systems. Useful data of available batteries given in Table 2-1 shows approximated
    values and are provided as a guideline.

