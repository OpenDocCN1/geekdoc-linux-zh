    <div>\n<body>\n</html>\n\n\n## A.4 Software installation\n\nAfter the embedded\
    \ module is selected, the installation of the software can be proceeded.\nThe\
    \ first installation is the embedded Linux operating system.\n\n### A.4.1 Embedded\
    \ Linux installation\n\nAs mentioned, the white dwarf Linux is freely available\
    \ online at that using online installation is powerful. After preparing the hardware,\
    \ follow the link http://www.whitedwarflinux.org to install White Dwarf Linux:\n\
    \n- 1. Set the clock in the BIOS to the correct time.\nIf this is not done the\
    \ system will end up getting a number of errors as the system thinks that the\
    \ hard drive of filesystem has gone too long without being checked.\nPassword\
    \ and other utilities may also be affected by an incorrect date.\n- 2. Download\
    \ and create the white dwarf bootdisk and root images for installation.\nUsing\
    \ a Linux machine to create:\n\n```\ndd if=boot.img of=/dev/fd0\nInsert another\
    \ clean floppy to use these commands:\nmksfs /dev/fd0\nmount /dev/fd0 /mnt\ncp\
    \ root.tar.bz mnt\numount /mnt\n```\n\nFrom a DOS machine, use WRITE.EXE, at C\
    \ prompt:\nC:\\> WRITE\n\nAnswer the prompts for the name of the file and the\
    \ floppy to be written to it.\nDo the same for the rootdisk.\n- 3. Boot the JUMPtec\
    \ with the bootdisk.\nThe following should appear during the boot process:\n\n\
    ```\n16 RAM disks of 5000K size hda: SunDisk SD-128, ATA ide0 at 0x1f-0x17, irq\
    \ 14 hda:SunDisk STDB-12, 15MB Cache, CS=490\n```\nIf the above information did\
