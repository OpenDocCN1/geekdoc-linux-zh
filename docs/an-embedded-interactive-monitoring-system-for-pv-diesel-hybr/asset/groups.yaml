    ## 2.5 Overview of the PV diesel hybrid system selected for the project


    The hybrid PV-Diesel system for this project will be built according to a small
    AC bus PV diesel hybrid system. The generation units include one diesel generator,
    one battery storage unit, and several photovoltaic arrays. The low voltage distribution
    grid provides electricity to three different houses. The PV fields are integrated
    in the roofs of the houses and the distributed concept is the Sunny Island of
