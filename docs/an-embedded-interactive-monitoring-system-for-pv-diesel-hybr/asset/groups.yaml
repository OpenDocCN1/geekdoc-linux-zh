    ## 第 2 章：光伏-柴油混合系统技术


    ### 2.2.2 电池储能


    有几种不同的电池化学类型，包括液酸、镍铁（NiFe）、镍镉（NiCd）、碱性以及凝胶电池。电池分为密封式和透气式。简单来说，电池只有两种主要类型：启动电池和深循环电池。


    启动电池的设计旨在提供高启动功率，但不适用于深循环。当作为储能使用时，它们在深循环应用中无法维持。启动电池使用大量极板以最大化电池的表面积。这允许产生非常大的电流，但会导致极板在循环时磨损。这种类型的电池不建议用于混合系统的能量存储。然而，它们被推荐作为备用机的启动电池。


    深循环电池是适用于逆变器的电池类型。极板的物理尺寸更厚，储存电荷的活性材料密度更高，以增加循环寿命。“深循环”类型电池的设计是在充电之前使用其大部分容量。它们有许多尺寸，并分为“非密封”型或“密封”型。


    普通电池针对单体额定电压为 2.0 伏的铅酸电池进行了优化。NiCd/NiFe 电池（称为碱性电池）的单体额定电压为 1.2 伏。通过调整电池数量，可以将
    NiCd/NiFe 电池组的额定电压与铅酸电池组相同（12 伏使用 10 个电池，24 伏使用 20 个电池，48 伏系统使用 40 个电池）。然而，NiCd/NiFe
    电池组必须充电到更高的电压才能完全充满，并且在放电期间其电压会比相同尺寸的铅酸型电池低 [17]。


    ### 2.2.2.1 铅酸电池


    铅酸电池的基本等效电路由一个带有平衡电压 ($V_E$) 的电压源与内阻 ($R_{in}$) 串联建模（见图 2-14）。必须指出的是，这种配置只能描述电流状态，因为
    $V_E$ 和 $R_{in}$ 的值实际上不是恒定的，而是许多参数的函数，例如电量 (SOC)、温度、电流密度和电池老化。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_42_0.png)


