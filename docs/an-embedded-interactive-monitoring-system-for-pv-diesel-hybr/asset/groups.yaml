    ## 3.9 Overview of the Web Server


    A web server is a program that runs on a host computer that serves websites. In
    other words, the web server program sits around awaiting requests from visitors''
    web browsers for objects that it has in its possession, and sends these objects
    back for the visitor''s viewing pleasure. Objects that web servers serve include
    HTML documents, plain text, images, sounds, video, and other forms of data. Web
    servers and browsers communicate using HTTP (Hypertext Transfer Protocol, described
    next section), a simple and effective language for requesting and transmitting
    data over a network. Thus, some web servers are referred to as HTTP servers.


