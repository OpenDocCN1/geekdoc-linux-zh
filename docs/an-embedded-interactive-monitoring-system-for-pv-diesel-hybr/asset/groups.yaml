    # Chapter 4: The interactive monitoring website for the hybrid systems in rural
    areas


    ## 4.3.2 Data acquisition unit


    This is an embedded Linux system module, which includes data acquisition software,
    a web server (described in previous chapter), and a hardware connection for a
    GSM modem. It requires very low input power. Apache web server is installed in
    the module for the website. Communications between the acquisition unit and the
    inverters can be with either a RS232 or RS485 interface.


    The data acquisition software has two main tasks. First, it will download and
    record all of the measured data, which in this project will occur in intervals
    of one minute. Secondly, the software will receive new parameters sent from the
    website and then send these parameters to the inverters. The data acquisition
    software or data storing software will be described in the end of chapter.


    ## 4.3.3 Communication unit


    It will be based on a GSM modem over TCP/IP network. The GSM technology is an
    industrial wireless solution that would work in every GSM network around the world
    [12]. In this project, the GSM modem is incorporated with RS232 interface that
    can be controlled by Linux operating system.


    ## 4.4 Monitored data and storage


    The first question to ask is; “what will be monitored?” This usually falls into
    two categories:


    - System energy production (most basic information)

    - Detailed engineering information such as the performance of various components
    (input, output of component)

    - More specific research-oriented information (depends on information required,
    e.g. irradiation)


    The needs of analysis dictate the monitoring variables. Table 4-1 shows examples
    of monitoring variables of the project.


    Table 4-1: Examples of monitoring variables


    | Variable | Abbreviation |

    |---|---||

    | PV voltage | Upv-lst |

    | PV current | Ipv-lst |

    | AC voltage | Uac |

    | AC Current | Iac |

    | AC frequency | Fac |

    | Battery Voltage | Ubatt |

    | Battery Current | Ibatt |


    The measured monitored data will be acquired and stored in the memory of the embedded
    module as a text file (example: data_date.txt), because the text file is easy
    to be opened with several programs. The name of each file will be the date of
    monitoring.


    As a limited memory of the embedded module, the website will allow operators to
    delete the data files via website to manage the memory storage.


    Capacity of module''s memory storage is enough for storing the data about ten
    months so that the operator has to download the monitoring data within ten months
    otherwise the oldest data will be deleted to provide space for next storing (in
    matter of fact, this will not happen, the operators normally access the data at
    least one month).


    Data analysis of system will start as soon as possible after the monitoring system
    begins operating. It should be done on a routine basis, for example once a month.
    Not only this will show whether the hybrid system and monitoring system are working
    properly, but also when problems occur, the operators can enable immediate action
    to the system.


    To implement the monitoring website, the communication network is a connection
    between the remote station and main station. Thus, it is necessary to understand
    the communication network. Next section will describe an overview of communication
    network and a network for the monitoring website.


    ## 4.5 Overview of the communication network


    A network of computers is a set of independent computers (called nodes), sites
    or hosts connected together and they are able to exchange data with communication
    lines [31] (see figure 4-3).


    ![](img/8191fe2ca5a41746557b10ddfe82a205_83_0.png)


    Networks are classified by considering the technique of transmission into two
    groups:


    - broadcast

    - point-to-point (peer-to-peer, PPP)


    Broadcast networks are characterized that all machines share the same transmission
    (logical) channel. Therefore a machine sends a message on such a network, all
    machines without exception receive it. Machines on such a network are identified
    using addresses.


    Point-to-point (peer-to-peer) networks are characterized by communication channels
    that link only two specific machines, which is to say that a message must jump
    from one machine to another to reach its destination. This network will be considered
    for project.


    The basic concept of networks is the communication and the exchange of data between
    users. The communication system is in charge of the information transfer and the
    right delivery to the final user. In this context, it is necessary to set up rules
    so that both sender and receiver can understand each other. These rules are managed
    by mechanisms protocols.


    Protocols correspond to a given implementation of the layer. The set of layers
    and protocols is called network architecture. There are two important network
    architectures that are referred, the OSI (Open Systems Interconnection) and the
    TCP/IP reference model.


    ### 4.5.1 The Open Systems Interconnect (OSI) reference model


    The OSI reference model was developed in the early 1970s by the International
    Standards Organization (ISO). Provides a set of general design guidelines for
    data-communications systems and also gives a standard way to describe how various
    portions (layers) of data-communication systems interact.


    The hierarchical layering of protocols on a computer that forms the OSI model
    is known as a stack. A given layer in a stack sends commands to layers below it
    and services commands from layers above it.


    The seven layers in order from highest to lowest to Application, Presentation,
    Session, Transport, Network, Data Link, and Physical (see figure 4-4).


    - The Application layer includes software that directly serves the user, providing
    such features as API.

    - The Presentation layer handles data encryption, compression, and translation.

    - The Session layer manages the dialogue between applications.

    - The Transport layer ensures end-to-end communication and error recovery.

    - The Network layer determines the path for data (routing).

    - The Data Link layer provides node-to-node delivery and media access control
    (MAC).

    - The Physical layer provides the electro-mechanical interface for transmission.


    ### 4.5.2 The TCP/IP reference model


    TCP/IP commonly refers to a network architecture, but this acronym also refers
    to two protocols that are closely bound: a transport protocol, TCP (Transmission
    Control Protocol), IP (Internet Protocol). The "TCP/IP model" is actually a network
    architecture in which four protocols have a major role, they constitute the most
    common implementation.


    The TCP/IP reference model can be described as a four-layer architecture (see
    figure 4-4):


    - The application layer, contrary to the OSI model, this layer is immediately
    bound to the transport layer, simply because the session and presentation layers
    are useless.

    - The transport layer, it has the same role as the transport layer of the OSI
    model; it is used to make peers dialog with one another. Officially, this layer
    has two implementations: the TCP protocol (Transmission Control Protocol) and
    the UDP (User Datagram Protocol).

    - The internet or network layer is the key of the architecture. It realizes the
    interconnection of remote (heterogeneous) networks without establishing a connection.
    Its role is to inject packets into any network and deliver them to the destination
    independently to one another.

    - The host-network or link layer, it seems to comprise both physical and data
    link layers of the OSI model. Actually, this layer has not been really specified;
    the only constraint of this layer is to allow a host to send IP packets of a network.

