    UNIX is a well-known operating system. More than one person can run multiple applications,
    making it a multi-user and multitasking operating system. With UNIX, each user
    logs in with a login name. Optionally, the user must also supply a password. If
    the computer is attached to a network, it has several other identifying items,
    including a domain name and an IP address. UNIX runs on every platform made.


    Linux is a fully-fledged operating system. It provides fully multitasking in a
    multi-user environment. It gives a high quality of software for a cost far lower
    than other commercial versions of UNIX. The Linux operating system was invented
    by a college student named Torvalds in the early 1990s and it has become the dominant
    Open Source computer operating system [7,36].


    There are many advantages of Linux, it is cheap, although all the distributions
    are available in their entirety as free downloads. Linux is a low requirements
    operating system. Linux can run on any 486 with 64 megabytes of ram. Linux will
    boot and run (with full graphical user interface) in less than 4 megabytes of
    ram. Linux is under the GNU public license, which states that anyone is allowed
    to copy, distribute, and modify it. Android is explicitly allowed to make and
    use as many copies as they need, without ever having to buy.


    Linux is now the world''s most advanced and progressive operating system. Based
    upon the nature UNIX operating system, Linux is the combined work of the best
    minds in the computer world, who have pooled their talents, resources, and accomplishments
    for the common good of all [29].


    # 3.4 Embedded operating system


    An embedded system is a computer used to control equipment for a specific problem
    or specification set of work [7,26]. A general-purpose computer usually has general
    missions. An embedded system has a limited mission.


    The embedded systems were first used back in the late 1960s in communications
    to control electromechanical telephone switches. As the computer industry has
    moved toward the past decade, embedded systems have moved along with it, providing
    more capabilities for tiny machines.


    Operating systems for embedded systems began to appear in the late 1970s, and
    today dozen viable options are available such as VxWorks, pSOS, Nucleus, Embedded
    Linux, and Windows CE.


    # 3.5 Why Linux?


    The power, reliability, flexibility, and scalability of Linux, combined with its
    support for a multitude of microprocessor architectures, hardware devices, graphics
    support, and communications protocols have established Linux as an increasingly
    popular platform for a vast array of projects and products [28].


    Linux is openly and freely available. Its supporting software components have
    evolved to meet the diverse needs of the markets and applications to which Linux
    is being adapted. Thus, Linux is the best choice for low cost operation.'
