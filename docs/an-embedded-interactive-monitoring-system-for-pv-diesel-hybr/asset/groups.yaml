    # 4.5.3 Comparison of both models and criticism


    The TCP/IP and OSI models are both based on the concept of independent protocols
    stacks. The functions from both are the same. The TCP/IP model is the real reference
    in the Internet world. The protocols associated with the OSI model are rarely
    used any more [21, 31]


    The OSI model is perhaps the most studied and most unanimously accepted network
    structure but it is not the model which is really implemented and used. The specialists,
    who analyzed this failure, determined four main reasons: Bad Timing, Bad Implementations,
    and Bad Policies [21].


    # 4.6 Communication Link of the proposed monitoring system


    Because the monitoring system needs to communicate with the monitoring unit at
    remote site and the main station, therefore communication network of the proposed
    monitoring system is PPP network. The link will be based on a standard GSM modem
    over a TCP/IP network as described in figure 4-5.


    From figure 4-5, the server will provide the monitored data at remote monitor
    site. The operator can access the information by HTTP (as described in chapter
    3). The communication network will be based on the TCP/IP network model.'
