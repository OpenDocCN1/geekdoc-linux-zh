    - $V_{E}$ : 铅蓄等效电路中具有平衡电压的电压源 [V]

    - $V_{in}$ : 电池内部损耗电压 [V]

    - $V_{k}$ : 电池 $V_{E}$ 计算的补偿值 $V_{k} = 0.84...0.88$

    - $V_{mppp}$ : 光伏模块最大功率点 (MPP)电压 [V]

    - $V_{oc}$ : 光伏电池开路电压 [V]

    - $V_{p}$ : 光伏模块最大功率输出 [Watt]

    - $\eta_{i}$ : 库仑效率 (%)

    - $\eta_{\sigma}$ : 电池总效率 (%)

    - $\eta_{v}$ : 电压效率 (%)


    # 词汇表


    - AC：交流电 (AC)，大多数国家的家用用电是频率为 50/60 赫兹（每秒60 个完整周期）的交流电。

    - AM：空气质量

    - API：应用程序接口 (API - 有时拼写为 application programming interface) 是计算机操作系统或应用程序规定的特定方法，程序员可以通过它向另一个程序发送请求。

    - ARP：地址解析协议 (ARP) 是一种将互联网协议 (IP) 地址映射到本地网络识别的物理地址的协议。对于不知道 IP 地址的机器，存在反向 ARP
    (RARP)。

    - ASCII：ASCII (美国信息交换标准) 是计算机和互联网上最常见的文件格式。每个字母、数字或特殊字符都用 7 位二进制数（0-1s）表示。

    - BIOS：BIOS (基本输入输出系统) 是计算机开机后用于启动计算机的微处理器。它还管理计算机与连接设备（如硬盘、视频适配器、鼠标和打印机）之间的数据流。

    - Bootdisk：Linux 的安装软盘。

    - Broadcast：广播。在互联网上，网站使用流媒体技术将原始广播电视节目传输给任何访问该网站的人。

    - BUS：在电气术语中，总线是一种传输线，每个设备都通过该传输线释放或接收电源。

    - CD-ROM：CD-ROM (光盘只读存储器) 是 CD 的一种变，旨在以文本、图形以及高保真声音的形式存储计算机数据。

    - CGI：通用网关接口 (CGI) 是 Web 服务器传递用户请求并接收数据的标准方法。当用户请求 Web 页面（例如通过点击高亮文字或输入 Web 地址）时，服务器返回的请求页面通常需要由应用程序进行处理。这种在服务器和应用程序之间往返数据的方法或约定被称为通用网关接口
    (CGI)。它是 Web 超文本传输协议 (HTTP) 的一部分。

    - ChipDISK：与 IDE 磁盘驱动器电气兼容的高容量存储闪存存储器，提供高达 500 Mbyte 的格式化存储容量，未来将扩展到更高的容量。

    - Client/server：客户端/服务器描述了两个计算机程序之间的关系，其中一个程序（客户端）向另一个程序（服务器）发出服务请求，后者满足该请求。

    - CPU：CPU (中央处理器) 是计算机中执行指令的中央单元。

    - Day profile：日分布曲线

    - DC：直流 (Direct current) 是单向流动的电流。作为形容词，用于光伏电池。

    - DPP：深放电保护

    - Embedded system：嵌入式系统是计算机硬件和软件的组合，专为特定应用设计。工业机器、汽车、医疗设备、相机、玩具等都是嵌入式系统的应用。

    - Ethernet：以太网是最广泛安装的局域网 (LAN) 技术。以太网采用 IEEE 802.3 标准，由 Xerox 开发，后由 DEC 和 Intel
    进一步开发。以太网通常使用同轴电缆或特殊规格的双绞线。以太网用于无线局域网。常见的以太网系统是 10BASE-T，使用载波监听冲突检测 (CSMA/CD)
    协议竞争访问。

    - FTP：文件传输 (FTP) 是一种标准互联网协议，是计算机间交换文件的简单方法。FTP 常用于从创建者传输 Web 页面到服务器。

    - Gateway：网关是作为另一个网络的入口。

    - gcc：GNU 编译器集 (GCC) 是 GNU 编译器。它是最重要的开源软件之一。甚至像 Perl 和 Python 也用 C 语言编写，由 GCC
    编译。Linux 的实现离不开 GCC。GCC 编译多种语言，基础语言是 C。

    - Genset：带有停止控制器的电机。

    - glibc：glibc 是 GNU C 库。它目前在 GNU Hurd 系统和 i386、m86k 以及 alpha 系统上无修改运行。

    - GNU：GNU 是一个类 Unix 操作系统，带有可以复制、修改和重新分发的源码。GNU 项目由 Richard Stallman 等人于 1983 年启动。Stallman
    认为用户应该能够对获取的软件做任何事情，包括为朋友制作副本、修改源代码并重新打包分发。

    - GSM：GSM (全球移动通信) 是一种在欧洲和世界其他地区广泛使用的数字移动电话系统。GSM 使用时分复用 (TDMA) 的变体，是三种数字无线电话技术（TDMA、GSM
    和 CDMA）中应用最广泛的。GSM 将数字化并压缩，然后将其发送到与其他用户数据流共享的通道中，每个流占用一个时隙。它在 900 MHz 或 1800 MHz
    频段工作。

    - Host：主机是指具有 Web 服务器的计算机，为一个或多个网站提供页面。


    '
