    ![](img/8191fe2ca5a41746557b10ddfe82a205_92_0.png)


    Figure 4-9: Diagram of the interactive monitoring website for hybrid systems


    From 4-9, it can be concluded that the interactive monitoring website proposed
    is suitable and can be utilized for monitoring of the PV diesel hybrid system
    in rural area.


    ## 4.10 Summary


    Energy represents a basic drive for the economic and social development of a country.
    However, the remote areas, where lack of infrastructure, have no access to electricity
    the utility grid extension is not a cost-effective option and sometimes technically
    not feasible. Therefore, the autonomous PV diesel hybrid system power is used
    to supply electricity instead of utility diesel in rural areas.


    When the hybrid system is used, in order to keep the hybrid system working reliably,
    it is necessary to include a monitoring system. The aim of monitoring is to collect
    the monitored data from a remote station to a master station. The monitored data
    is the data that the operators want to analysis for the reliability of the PV
    diesel hybrid system.


    Systems in such rural areas are supervised commonly by visits in conjunction with
    a data logger. But this method is not a cost effective option for monitoring.
    Other types of monitoring systems have also been presented, such as the SCADA
    (Supervision Control and Data Acquisition) as well as a system using satellite
    technology. With these systems, there are already many recognized problems including
    high investment costs, special requirements for client stations, and difficulties
    with communication links.


    To eliminate all above problem, monitoring by website is proposed. The website
    monitoring system can offer more advantages. The monitored data is stored in the
    web server. The operators can access the data via a standard web browser. The
    communication link uses a standard GSM modem over a TCP/IP network and normally
    this link already exists. In addition, there is no need for any special software
    for viewing the system.


    The interactive monitoring website proposed is comprised of monitoring unit, data
    acquisition unit, and communication unit. The monitoring unit is used to measure
    actual operation data of the hybrid system. With current technology, this unit
    is included in the inverter. The Sunny inverter from company SMA is used for the
    project.


    The data acquisition unit is the embedded module, which includes Apache web server
    with the interactive website, data acquisition software (storing software), and
    a connection to GSM modem. This data acquisition software will read the monitored
    data from the inverters and store the data into the web server.


    The interactive website, with a combination of the programming HTML script and
    PHP script, provides the monitored data into internet. The operator has an ability
    to download the data and upload the operation parameters via online. This can
    improve reliability of the hybrid system.


    The concept of interactive monitoring website shows that it is very suitable to
    be utilized for monitoring the PV hybrid system in remote area.


    ## Chapter 5


    ## Implementation and results


    ## 5.1 Introduction


    As mentioned the interactive monitoring website is comprised of a monitoring unit
    (sensor unit), a data acquisition unit, and a communication unit. The monitored
    data is stored in the web server. The operators can access the monitored data
    via a standard web browser and the communication link use a standard GSM modem
    over a TCP/IP network. This chapter will implement the interactive monitoring
    website and will describe its results.


    ## 5.2 Orientation


    From the concept of interactive monitoring website of previous chapter, the interactive
    monitoring website proposed can be interpreted as in figure 5-1. The web server,
    website, and acquisition software (storing software) are installed into the embedded
    Linux module.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_94_0.png)


    Figure 5-1: Diagram of the interactive monitoring website


    From Fig. 5-1, the operator at the main station can access the embedded Linux
    module via a standard web browser. The communication network is a GSM modem over
    TCP/IP network. The data storing software will be responsible for monitoring the
    monitored data from the hybrid system inverters. The monitored data will be stored
    into the web server as a text file in interval of one minute. The name of the
    monitoring file is the date of monitoring.


    ## Chapter 5: Implementation and results


    ## 5.3 Implementation


    Once the acquisition software is compiled and installed to the embedded module,
    the embedded module can be connected to the system inverters. Figure 5-2 is a
    connection diagram of the PV diesel hybrid system and embedded monitoring module.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_95_0.png)


    Figure 5-2: Diagram of the system connection of the project [SMA]


    From figure 5-2, Sunny Island inverter is connected to battery to manage the battery
    voltage. The inverter is also connected to a start unit of generator to start
    a generator when the system needed. Furthermore, the inverter is designed to measure
    the voltage and current of the hybrid system.


    As the bi-directional inverter is a battery management of the system so that it
    has to be particularly cared for connection, if the connection is failed, the
    system will not be started.


    Figure 5-3 is a battery connection diagram. The operator has to make sure that
    the connection is correctly wired accordingly to the figure 5-3. In figure 5-4,
    it shows a picture of battery temperature sensor.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_96_0.png)


    Figure 5-3: Diagram of the battery and the temperature sensor [SMA]


    ![](img/8191fe2ca5a41746557b10ddfe82a205_96_1.png)


    Figure 5-4: Temperature sensor of battery [DeMotHall]


    From figure 5-4, the temperature sensor of battery is connected to the inverter.
    This is is very important in order to detect the battery temperature to the battery
    inverter for protecting from the over temperature damage.


    Furthermore, the connection to a generator must be particularly cared for. As
    the PV diesel hybrid system is an combination of solar energy and diesel generator.
    When load is high and the energy from battery and PV module is not sufficient
    to supply the load, the inverter will activate the diesel generator. Therefore,
    it has to be sure that the connection is correctly connected. Figure 5-5 is a
    connection diagram for generator.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_97_0.png)


    Figure 5-5: Generator connection [SMA]


    From figure 5-5, to start the generator, the inverter will activate the contactor
    K1. In this case, the operator has to connect the start circuit correctly and
    accordingly to the generator type. After the generator started the inverter will
    measure the generator voltage. The inverter will connect the generator (K2) to
    the system power line. If the hybrid system is correctly connected and configured,
    the hybrid system should be working.


    After the hybrid system is working the monitoring system is implemented next.
    Either the monitoring system can be connected to the inverters before or after
    the hybrid system is started. As mentioned the acquisition software requires the
    monitored data from the inverters in interval of one minute and then stores the
    monitored data in embedded module. The operator can connect to web server and
    can download the monitored data to main station via GSM modem over TCP/IP network.
    The operators can access to website via a standard web browser on either Linux
    system or Windows system.


    Figure 5-6 shows a picture of test facilities for implementation of the interactive
    monitoring website.

