    14 天，充电方法将进入充满充电。在充满充电时，它将充电并将电池保持在 2.55 V 五个小时，然后进入浮动充电。如果周期超过 18 天，充电方法将进入均衡充电。在均衡充电时，它将充电并将电池保持在
    2.45 V 十个小时，然后返回浮动充电。


