    # 第二章：光伏-柴油混合系统技术


    ## 2.1 引言


    光伏-柴油混合系统通过光伏阵列和柴电机组合发电。它们根据配置分类为：


    - A) 直耦合混合系统，DC 总线配置


    直耦合混合系统（图 2-1），柴电机和光伏阵列为电池组充电。逆变器将直流电压转换为交流电压供给负载。电池组和逆变器的容量应满足峰值负载。发电机的容量也应同时满足电池充电。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_33_0.png)


    图 2-1：DC 总线配置


    - B) 切换混合系统，DC/AC 总线配置


    切换混合系统（图 2-2），电池组由柴电机充电。负载可以直接由柴电机供电。如果发电机的功率超过负载需求，剩余能量将用于为电池组充电。在低需求期间，电机关闭，负载由光伏阵列以及电池组存储的能量供电。在比较整体效率时，切换系统高于直耦合混合系统。


    | 光伏阵列 | 转换器 | 整流器 | 发电机 |

    |---|---|---|---|

    | | | | |

    | | | | 切换开关 |

    | | 电池充电器 | 逆变器 | |

    | | DC 总线 | AC 总线 | |


    图 2-2：切换混合系统


    C) 交流耦合混合系统，AC 总线


