    ### 3.14 Summary


    As the advantage of open-source and freely available options, Linux is now the
    world''s most advanced and progressive operating system.


    Linux is well suited for embedded system because of its support of multiprocessor
    systems as well as the advantages of an open source, thus embedded Linux is selected
    for the project. The white dwarf embedded Linux kernel is selected to implement
    in the project because it can fulfill the project requirements.


    An embedded system is a computer used to control equipment for a specific problem
    or specification set of work. Unlike a general-purpose computer, an embedded system
    only requires enough software to actually get a specific set of jobs done. This
    means the software requires less memory. The software can fit to embedded systems
    that are not include a hard drive and have a limited memory storage. The system
    without hard drive can reduce energy consumption. Thus, the embedded system is
    utilized for the monitoring system.


    The JumpTec PC-104 MOPS5220 is selected for the embedded hardware because it supports
    all requirements of the project as it can work with the embedded Linux.


    With the advantage of open-source code, Apache web server is suited for the monitoring
    website. HTML document and PHP script is used for the monitoring website.


    ## Chapter 4: The interactive website for the hybrid systems in rural areas


    ### 4.1 Introduction


    As illustrated in chapter 2, the monitoring system is used worldwide in rural
    areas where no grid, no telephone line, and often difficult. Therefore, to meet
    the goals of monitoring, it is necessary to develop a suitable system.


    ### 4.2 Concept of monitoring by website


    As mentioned, there are other types of monitoring systems (SCADA, satellite) that
    have been presented in order to overcome many well-known problems with these systems
    including high investment costs, special software requirements, and difficulties
    with communication links.


    With the website system proposed, all above problems can be eliminated. The monitored
    data is stored in the web server, operators can access the data via a standard
    web browser (see Figure 4-1), and the communication uses a standard GSM modem
    over a TCP/IP network. In most cases, this link already exists and there is no
    need for any special software for the system.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_80_0.png)


    From Figure 4-1 when accessing the website, the operator can easily monitor data
    as well as upload important parameters to the hybrid system. Using of web base
    technology with the advantage of free open-source software, the monitoring investment
    is very low initial and running costs.


    ### 4.3 Monitoring system components


    The monitoring system in this project is comprised of a monitoring unit (sensor
    unit), a data acquisition unit, and a communication unit. As wireless networks
    expand and the quality continue to improve, it becomes more attractive to use
    a network like GSM for communication. In this way, data is delivered directly
    to the main station and the network will not generate any additional costs for
    operator.


    ### 4.3.1 Monitoring unit


    This unit is used to measure the actual operating data of the hybrid system. With
    current technology, this unit is included in the inverter. This project will include
    components from the Sunny Family product line from SMA. Sunny Family products
    incorporate microcontrollers that can monitor the data from the hybrid system
    continuously. The Sunny Boy is a DC/AC inverter for PV modules and the Sunny Island
    is a bi-directional DC/AC inverter for battery management, including charge control
    characteristics. Figure 4-2 is the diagrams of the inverters.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_81_0.png)


    From diagram, the inverter measures the monitored data of the system and defines
    the voltage set point for charging and automatically activate a diesel generator.


    The inverters are always ready for the data acquisition unit to acquire the monitored
    data from the inverters at any time.

