    # E.3 PPPd 设置


    这是一个关于为点对点通信设置 PPPd 的简短教程。


    - 所需软件：


    + 带有网络的性 Linux 系统 :-


    + * mgetty（前端）版本 1.1.28，使用 AUTO_PPP 编译

    接受拨入电话并将控制权移交给 pppd。


    + * pppd（后端）版本 2.4.1

    负责 PPP 网络相关事务。


    # 1. 服务器系统概述

    --------------------------------


    + 服务器有一有一个连接到串口线上的调制调器。

    0. 计算机启动并引导。

    1. /sbin/init 接管并运行启动脚本等。

    它还运行 mgetty 来监控调制调器。

    2. mgetty 等待电话线上的铃声。

    ... 有人拨打了该号码 ...

    3. mgetty 告诉调制调器接听电话。

    4. mgetty 可能会中断自身并等待 PPP 包。

    5. 检测到 PPP 包后，mgetty 将控制权移交给 pppd。这是一个“正常”的 PPP 会话。


    # 2. 设置 /etc/init.abb 和 mgetty

    --------------------------------


    "mgetty" 和 "info mgetty" 仅供参考！


    将此行插入到 /etc/init.abb


    ```

    S0:345:respawn:/usr/sbin/mgetty ttyS0

    ```


    对于 ttyS0（COM1，第一个串口端口）上的调制调器，或者


    ```

    S1:345:respawn:/usr/sbin/mgetty ttyS1

    ```


    对于 ttyS1（COM2）上的调制调器，以此此类推。


    并将此行（如果不存在）存放在

    /etc/mgetty+sendfax/login.config


    /AutoPPP/ - pppuser /usr/sbin/pppd auth +pap


    # 3. 设置 pppd


    "man pppd" 和 "PPP-HOWTO"


    创建 /etc/pppd/options.ttyS0（或 ttyS1 等）并包含以下选项：


    ```

    asyncmap 0

    netmask 255.255.255.0

    proxy

    lock

    crcts

    modem

    192.168.0.1:192.168.0.2

    ```


    192.168.0.2 是客户端地址，192.168.0.1 是服务器。

    同样在 /etc/ppp/pap-secrets 中加入此行


    ppuser "password" 192.168.0.2


    ppuser 是客户端用户名。将 hostname 替换为真实主机名！


    # 4. 有用 URL

    http://www.linuxdoc.org


