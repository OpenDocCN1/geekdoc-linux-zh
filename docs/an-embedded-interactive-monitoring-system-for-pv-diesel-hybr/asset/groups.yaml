    # Chapter 2: PV-Diesel hybrid system


    Unfortunately, the capacity of a battery is not a constant quantity, but depends
    on the amount of discharge current. The manufacturers give therefore the rated
    capacity of their batteries with regard to a certain discharge current.


    The so-called rated battery capacity refers to the capacity of the battery under
    given standard conditions: it is common practical to define the rated capacity
    at 20 °C by discharging the battery with a rated battery current (i₀), which refers
    usually to a constant current, with the battery will be completely discharged
    in 10 hours. Some battery manufacturers indicate the 100-hour capacity for batteries
    intended for PV applications. When comparing such capacity, it should be remembered
    that, for a given battery, the 100-hour capacity is always at least 30 % higher
    than the 10-hour capacity [6].


    Besides, battery capacity is also affected by the temperature: it falls by about
    1 % per degree below 20 °C. Moreover, extreme high temperatures accelerate aging,
    self-discharge and electrolyte usage [8].


    # 2.2.2.7 Requirements for solar batteries


    Typical requirements for the battery to be used in long term storage are:


    +   - low specific kWh-cost, i.e. the stored kWh during the whole life of the
    battery

    - long lifetime

    - high overall efficiency

    - very low self-discharge

    - low maintenance cost

    - easy installation and operation

    - high power


    - Specific kWh-cost


    Usually it refers to a sum of investment and operation costs of the battery divided
    by the stored kWh (kWhz) during its whole life. This cost is influenced by the
    battery''s lifetime.


    - Lifetime


    The lifetime of the battery should be long, especially in order to keep the specific
    kWh-cost and the installation cost low, particularly in remote areas.


    - Overall efficiency


    The overall efficiency (η;) is derived from charge or columbic efficiency (η)
    and voltage efficiency (ηv):


    ```

    η = ηᵢ · ηv

    ```


