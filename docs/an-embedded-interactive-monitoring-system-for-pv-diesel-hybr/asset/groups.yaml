    # Chapter 2: PV-Diesel hybrid system technology


    ## 2.6 Summary


    The PV diesel hybrid systems generate electricity by combination of photovoltaic
    array and a diesel generator. They can be categorized according to their configuration
    into three categories: DC-coupled hybrid system, Switched hybrid system, and AC-coupled
    hybrid system. The main component of the system comprises of PV module, battery,
    generator, and inverter.


    PV-Diesel hybrid system is attractive for powering in remote areas: reduction
    of running cost compared to fuel gens system, reduced investment cost compared
    to only renewable energy system, increased reliability due to redundancy of generators.


    Comparison of AC and DC bus system are presented [17] that for a pure PV system
    without fuel gens, the DC system is generally preferable, unless most of the energy
    is consumed during the daytime. For hybrid systems, with a decreasing solar fraction,
    the AC system becomes more and more efficient compared to the DC system. The AC
    system should thus be recommended when the diesel energy share is high and when
    a lot of energy is used during the day, while the DC system should be preferred
    for high evening consumptions and high solar fraction.


    Load profiles are necessary in order to estimate an adequate power supply system
    for a remote village. Load profiles are different for each remote village. The
    study of load profiles must be done in order to properly design the hybrid system.


    Energy losses in the system have to be identified in order to avoid those losses.
    A classification of all relevant energy losses in a stand-alone PV hybrid system
    is given as Capture losses.


