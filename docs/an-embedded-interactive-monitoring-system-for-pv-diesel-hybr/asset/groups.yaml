    \n图 2-22：逆变器效率随容量 $Pac/Pac(nom)$ 的示例 [SMA]\n\n缓解低效率问题的方法是让逆变器仅在优化的输出水平运行。改进方法是某些逆变器包含了最大功率点跟踪器（MPPT）。最大功率点跟踪器（MPPT）用于强制光伏阵列的输出达到最大瞬时功率。MPPT\
    \ 可以提高系统的效率。\n\n此外，离立式逆变器也能够熔断保险丝。某些逆变器完美地实现了这一要求。\n\n## 2.3 农村典型电力需求\n\n负载曲线描述了随时间变化的电力需求。负载曲线估计是为偏远村庄选择合适电源系统的重要标准。每个偏远村庄的负载曲线可能有所不同。图\
    \ 2-23 至 2-26 显示了欧洲和南亚不同地区的负载曲线信息 [13, 17]。\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_55_1.png)\n\
    \n图 2-23：法国菲图图 (Fitou) 的负载曲线\n\n## 第 2 章：光伏-柴油混合系统技术\n\n## Starkenburg 木屋 - 每日消耗曲线\
    \ (1999年)\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_56_0.png)\n\n图 2-24：奥地利\
    \ Starkenburg 木屋的负载曲线\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_56_1.png)\n\n\
    图 2-25：泰国披萨努鲁克 (Pitsanuluk) 能源的负载曲线\n\n## Muara Ancalong 的 (2000年7月2日) 负载曲线\n\n\
    ![](img/8191fe2ca5a41746557b10ddfe82a205_56_2.png)\n\n图 2-26：Muara Ancalong 的负载曲线\n\
    \n## 第 2 章：光伏-柴油混合系统技术\n\n从负载曲线可以看出不同地区的电力需求存在差异。对于光伏-柴油混合系统，需要将负载分为以下几类：\n\n\
    - *住宅负载（日间负载或单用户曲线）*\n  （例如：洗衣机、冰箱）\n- *专业应用负载（日间负载或多用户曲线）*\n  （例如：医院、酒店）\n\n\
    为了给偏远村庄提供足够的功率，必须考虑负载曲线的峰值需求。光伏-柴油混合系统的可靠性取决于光伏容量的匹配程度。如果容量过小，会导致效率下降；如果过大，则会增加成本。此外，光伏组件的维护也会影响系统效率。为了提高系统效率，可以考虑使用光电跟踪系统。如图\
    \ 2-27 所示，光伏-柴油混合系统可以：\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_57_0.png)\n\
    \n图 2-27：光伏-柴油混合系统 [17]\n\n## 第 2 章：光伏-柴油混合系统技术\n\n## 2.4 混合系统的损耗\n\n离立式光伏柴油混合系统在存储和供应电力过程中需要平衡能量损耗。以下公式\
    \ (14) 显示了混合系统的能量平衡：\n\n$E_{IN} \\approx E_{OUT}$ (14)\n\n其中：\n\n$E_{IN} = E_{PV}\
    \ + E_{MG}$\n$E_{OUT} = E_{LOAD} + E_{LOSS}$\n\n$E_{MG} = E_{LOAD} - E_{PV}$ (15)\n\
    \n为了最小化能量损耗，将损耗分为捕获损失（Capture losses）和系统损失（System losses）。捕获损失反映了未被利用的辐射部分。系统损耗定义了系统组件的能量损耗。\n\
    \n### 2.4.1 捕获损失\n\n捕获损失反映了只有部分辐射被用于能量转换。损耗分类如下：\n\n- 阴影\n  阴影导致的损耗对应于无阴影模块接收能量的减少。这还会导致阵列内部的不匹配。\n\
    - 模块倾角\n  模块倾角不垂直于太阳光会导致方向损耗。通过使用跟踪系统可以显著减少这种能量损耗。然而，任何机械跟踪系统都需要定期维护，并可能降低可靠性。因此，离立光伏系统通常不使用跟踪系统，而是选择固定的方向和倾角。\n\
    - 针对 AM 1.5 的光谱损耗\n  制造商提供的模块特性是在标准条件（STC）下确定的，例如 AM 1.5 标准光谱。可用光谱与 AM 1.5 之间的差异会导致所谓的光谱损耗。\n\
    - 反射\n  反射损耗是光伏模块表面的辐射损失，部分入射光被反射，无法用于能量转换。\n- 表面污染\n  脏组件会导致光透过率降低。\n\n### 2.4.2\
    \ 系统损失\n\n系统损失涵盖了在输入能量（太阳辐射、化石燃料）转换为可用交流电过程中产生的所有损耗。分类如下：\n\n- 逆变器和充电器转换损耗\n \
    \ 逆变器损耗源于逆变器的直流/交流效率。由于离立式逆变器从本地直流供电，因此静态功耗包含在内。电池充电器的交流/直流效率通常低于直流/交流逆变器效率。注意，交流/直流损耗只是从交流源充电产生的总损失的一部分；电池存储损耗（见下文）以及随后的直流/交流转换损耗发生在初始能量被消耗之前。\n\
    \n- 电池存储损耗\n  存储损耗包括电池内部的所有能量损耗。由电池的充放电效率以及自放电特性决定。\n\n- 辅助发电损耗\n  辅助发电机的比燃油消耗取决于其运行模式。相应的发电机效率定义了相对于最大效率的辅助发电机损耗。\n\
    \n- 光伏-电池不匹配损耗\n"
