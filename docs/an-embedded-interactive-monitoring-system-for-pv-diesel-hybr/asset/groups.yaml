    shortcircuit point, the voltage is zero and the power is also zero. The situation
    for current and voltage is reversed at the open-circuit point, so again the power
    here is zero. There is one particular combination of current and voltage, for
    which the power reaches a maximum (graphically indicated with a rectangle area
    in Figure 2-9). The so-called maximum power point (MPP) represents the working
    point for a given radiation intensity, situated near the bend of the I-V characteristic
    curve. The corresponding values of $V_{MPP}$ and $I_{MPP}$ can be estimated from
    $V_{OC}$ and $I_{SC}$ as follows [8]:


    $V_{MPP} = (0.75 - 0.9) V_{OC}$

    $I_{MPP} = (0.85 - 0.95) I_{SC}$


    The maximum power rating is at the MPP, rated current $I_{mpp}$ and rated voltage
    $V_{mpp}$ correspond to the MPP. The rated power is measured under Standard Testing
    Conditions (ST), at an irradiation intensity of ISTC=1000W/m2, cell temperature
    $T_{cell}=25^{\circ}C$ and air mass AM=1.5 and is reported in peak watts Wp. A
