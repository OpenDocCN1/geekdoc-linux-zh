    ## 第 3 章：嵌入式 Linux 模块：软件与硬件


    从 3-9 开始，PHP 脚本与 Perl 或 C 等语言编写的脚本不同，程序员不是编写包含大量命令来输出 HTML 的程序，而是编写带有一些嵌入代码的 HTML
    脚本来实现某些功能（例如图 3-9 所示：输出“Here is PHP”）。PHP 代码封装在特殊的起始和结束标签中，这些标签允许程序进入和退出“PHP 模式”。


    PHP 是一种服务器端技术。查看网页的用户不需要任何特殊的 PHP 程序或浏览器插件即可运行 PHP。PHP 兼容所有主流 Web 浏览器。任何 Web 开发人员都可以根据从第三方源（数据库或其他）收集的数据动态构建网页页面，然后通过互联网提供的几乎任何手段传输这些数据。这的真正好处在于，开发者可以在几乎不了解
    CGI（通用网关接口）与与其通信的数据库之间内部原理的情况下，完成这些工作。


    如前所述，PHP 是一个超文本预处理器。从非技术性的角度来说，这意味着当用户用浏览器访问网站时，PHP 有机会对用户看到的看到的页面进行“最后时刻”的修改。


    图 3-10 展示了一个安装了 PHP 的 Web 服务器，它多了一个步骤，允许 PHP 在向用户显示文档之前处理所请求的文档。通过这一额外步骤，PHP 可以执行任何操作，包括访问数据库、发送电子邮件或连接到另一个互联网服务（如另一个
    Web 服务器）。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_76_0.png)


    ## 第 3 章：嵌入式 Linux 模块：软件与硬件


    ### 3.13 Apache Web 服务器


    Apache 项目是一项协作软件开发工作，旨在创建一个稳健的、商业级的、功能且免费提供的 HTTP Web 服务器源代码实现。Apache 的特殊优势在于：


    - **强大**：Apache 的性能和可靠性是传奇级的。

    - **功能丰富**：Apache 服务器支持许多功能，包括：XML 支持、服务器端包含（SSI）、强大的 URL 重写和虚拟主机。

    - **模块化**：用户可以找到可以添加所需功能的模块。

    - **可扩展**：Apache 是开源的。所有所需的信息都可以在源代码和大量的在线资源中。

    - **流行**：在本文写作时，Apache 占据了略低于 60% 的 Web 服务器市场（见图 3-11）。

    - **免费**：这是用户不一定得到其所付费内容的实例之一。


    如图 3-11 所示，Apache Web 服务器是目前最常用的 Web 服务器。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_77_0.png)


    Apache Web 服务器以循环工作，客户端请求后是服务器响应。图 3-12 显示了 Web 服务器的循环。


    ## 第 3 章：嵌入式 Linux 模块：软件与硬件


    ![](img/8191fe2ca5a41746557b10ddfe82a205_78_0.png)


    图 3-12：Web 服务器循环 [45]


    Apache Web 服务器处理请求并创建响应如下：（见图 3-13）


    ![](img/8191fe2ca5a41746557b10ddfe82a205_78_1.png)


    图 3-13：Apache 请求循环 [43]


    从图 3-13 中：


    - 1. Apache Web 服务器等待请求

    - 2. 当请求到来时，发布并读取请求

    - 3. URL 翻译

    - 4. 头部解析

    - 5. 访问控制

    - 6. 身份验证

    - 7. 授权

    - 8. 检查 MIME（多用途互联网邮件扩展）

    - 9. 修复并将文档响应给客户端

    - 10. 回到日志记录和清理，等待另一个请求


    此外，Apache 项目旨在为各种现代桌面和服务器操作系统（如 UNIX 和 Windows NT）开发和维护一个开源 HTTP 服务器，因此 Apache
    非常适合实现 Web 服务器。


    ### 3.14 总结


    得益于开源和免费可用选项的优势，Linux 现在已是世界上最先进、最进步的操作系统。


    Linux 非常适合嵌入式系统，因为其支持多处理器系统以及开源的优势，因此项目选择了嵌入式 Linux。项目选择白矮星嵌入式 Linux 内核来实现，是因为它可以满足项目需求。


    嵌入式系统是一种用于控制设备以解决特定问题或特定工作任务的计算机。与通用计算机不同，嵌入式系统只需要足够的软件来完成一组特定的任务。这意味着软件需要的内存较少。软件可以适应不包含硬盘且内存存储有限的嵌入式系统。没有硬盘的系统可以降低能耗。因此，嵌入式系统被用于监控系统。


    JumpTec PC-104 MOPS5220 被选为嵌入式硬件，因为它与嵌入式 Linux 工作，满足了项目的所有要求。


    凭借开源代码的优势，Apache Web 服务器适用于监控网站。HTML 文档和 PHP 脚本被用于监控网站。


    ## 第 4 章：农村混合系统的交互式网站


    ### 4.1 引言


    如第 2 章所示，监控系统在全球范围内没有电网、没有电话线的农村地区。因此，为了满足监控目标，有必要开发一种合适的系统。


    ### 4.2 网站监控概念


    如所述，已经展示了其他类型的监控系统（SCADA、卫星），以解决这些系统的许多问题，包括高投资成本、特殊软件需求以及通信链路困难。


    通过提议的网站系统，上述问题都可以被消除。监控数据存储在 Web 服务器中，操作人员可以通过标准浏览器访问数据（见图 4-1），通信使用基于 TCP/IP
    网络的标准 GSM 调制解调器。在大多数情况下，这种链路已经存在，系统不需要特殊软件。


    ![](img/8191fe2ca5a41746557b10ddfe82a205_80_0.png)


    从图 4-1 可知，访问网站时操作人员可以轻松监控数据并向混合系统上传重要参数。使用 Web 技术和免费开源软件的优势使得监控投资非常低。


    ### 4.3 监控系统组件


    项目的监控系统由监控单元（传感器单元）、数据采集单元和通信单元组成。随着无线网络的扩展和质量的提高，使用 GSM 网络进行通信变得更有吸引力。通过这种方式，数据直接传输到主站，网络不会为操作人员产生额外费用。


    ### 4.3.1 监控单元


    该单元用于测量系统的实际运行数据。根据目前的技术，该单元包含在逆变器中。本项目将包含 Sunny Family 系列组件。Sunny Family 产品了微控制器，可以持续监控混合系统的数据。Sunny
    Boy 是用于光伏模块的直流/交流逆变器，而 Sunny Island 是用于电池管理的双向直流/交流逆变器（包括充电控制特性）。由于图 4-2 是逆变器的图示。


    从图中所示，逆变器测量系统的监控数据并定义充电电压设定点并自动启动油电机。


    逆变器随时准备让数据采集单元随时从逆变器获取监控数据。


    '
