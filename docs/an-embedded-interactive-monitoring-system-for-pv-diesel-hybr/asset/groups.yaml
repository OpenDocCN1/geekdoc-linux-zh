    # Chapter 2: PV-Diesel hybrid system technology


    # 2.2.4 Inverters for AC-coupled hybrid systems


    Power converters are used to convert DC power from PV panels and batteries to
    AC power. The most common power conversion devices are electronic inverters, DC
    to AC inverter, AC to DC inverter, and bi-directional inverter. The inverter is
    normally only single phase for small power ratings and it is possible to be connected
    into three phases as in figure 2-21.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_54_0.png)


    Figure 2-21 shows an AC-bus three-phase system with three battery inverters, PV
    string inverters, and a diesel three-phase generator. Additionally the system
    contains a supervisory control unit, which is in charge of the energy management.


    For stand-alone application, the output waveform of inverters becomes important.
    The deviation from the ideal sinusoidal voltage is normally described as total
    harmonic distortion (THD). For high-quality power supply, the THD of the output
    voltage should be less than 5 %, which corresponds with the quality of the power
    grid [8].


    A second and very important element for stand-alone applications, the ability
    to provide and absorb reactive power should be maintained. Typical loads requesting
    reactive power are electric motors. In some inverter designs handling reactive
    power is limited by the load type. In this case, the acceptable power factor is
    defined. The maximum power of the inverter is given in Kilo-Volt-Amperes (kVA)
    instead of Kilo-Watts (kW). The energy of the reactive power, which is to be absorbed
    and afterwards re-injected to the load, is normally stored in capacitors of appropriate
    sizes.


    Inverter efficiency is generally low at low power level and good (80%-90%) at
    high power levels depending on the inverter type, see Figure 2-22.'
- md: "\n## Chapter 2: PV-Diesel hybrid system technology\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_55_0.png)\n\
    \nFigure 2-22: Example of inverter efficiency versus capacity $Pac/Pac(nom)$ [SMA]\n\
    \nA way of alleviating the problem of low efficiency is to operate the inverters\
    \ only at preferred levels of output. One improvement is that some inverters include\
    \ the maximum power point tracker (MPPT). The maximum power point tracker (MPPT)\
    \ is used to force the output of PV arrays to their maximum instantaneous power.\
    \ The MPPT can improve system energy efficiency.\n\nFurthermore, stand-alone inverters\
    \ should also be able to blow fuses. This requirement is perfectly fulfilled with\
    \ a few inverters.\n\n## 2.3 Typical electricity demands in rural areas\n\nLoad\
    \ profiles describe electricity demand depending on time. Load profile estimations\
    \ are an important criterion for the selection of an adequate power supply system\
    \ for a remote village. Load profiles may be different for each remote village.\
    \ Figure 2-23 to 2-26 are load profile information in different areas in Europe\
    \ and in South Asia regions [13, 17].\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_55_1.png)\n\
    \nFigure 2-23: Load profile in Fitou, France\n\n## Chapter 2: PV-Diesel hybrid\
    \ system technology\n\n## Starkenburg hut - Daily consumption profiles (1999)\n\
    \n![](img/8191fe2ca5a41746557b10ddfe82a205_56_0.png)\n\nFigure 2-24: Load profile\
    \ in the Starkenburg hut, Austria\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_56_1.png)\n\
    \nFigure 2-25: Load profile in the Energy Park, Pitsanuluk, Thailand\n\n## Load\
    \ profile (July 2nd, 2000) in Muara Ancalong\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_56_2.png)\n\
    \nFigure 2-26: Load profile in Muara, Indonesia\n\n## Chapter 2: PV-Diesel hybrid\
    \ system technology\n\nIt can be seen from the load profiles that the electricity\
    \ demands are different in each area. With respect to the development of a hybrid\
    \ system, it is necessary to categorize load profiles. It is possible to work\
    \ out as two main and several subcategories:\n\n- *Remote electrification (night\
    \ load profile or multi user profile)*\n  remote settlements on low power level\
    \ (i.e. several households and schools) the most common appliances are, television\
    \ sets and refrigerators\n- *Professional application (day load profile or single\
    \ user profile)*\n  high reliability professional applications (i.e. workshops,\
    \ hospitals, restaurants and hotels) developing of the application, mostly appliances\
    \ with high load demand\n\nIn order to be properly size the hybrid system to provide\
    \ an adequate power system for a remote village, the peak power, the daily energy\
    \ consumption and the annual energy growth should be estimated with order to size\
    \ both the generating plant and the conductor used in the distribution system.\
    \ The sustainability of the system will not be guaranteed if the capacity of the\
    \ system is too small and leads to consumer dissatisfaction. On the other side,\
    \ a too large capacity would mean additional investment costs and possibly too\
    \ high tariffs.\n\nThe reliable approach to assess demand is to survey households\
    \ in adjoining, already-electrified areas or in a region with similar economic\
    \ activities, demographics characteristics, etc. This would assess the average\
    \ initial loads per household in these areas as well as their historical load\
    \ growth. In addition, with helping of several sizing methods and tools that are\
    \ currently presented [1,63], the development of hybrid system can be reasonably\
    \ utilized to supply the adequate power to remote areas. The figure 2-27 is an\
    \ example of the PV-diesel hybrid system in remote area called \"MiniGrid system\"\
    \ [17].\n\n![](img/8191fe2ca5a41746557b10ddfe82a205_57_0.png)\n\nFigure 2-27:\
    \ AC-coupled hybrid system for remote area [17]\n\n## Chapter 2: PV-Diesel hybrid\
    \ system technology\n\n## 2.4 Energy losses of Hybrid systems\n\nStand-alone PV\
    \ diesel hybrid systems are designed to be totally self-sufficient in generating,\
    \ storing and supplying electricity to the local electrical loads. Over time period,\
    \ the energy supply and demand have to be balanced. The following calculation\
    \ (14) shows the energy balance of a hybrid system.\n\n$E_{IN} \\approx E_{OUT}$\n\
    \n(14)\n\nwhere\n\n$E_{IN} = E_{PV} + E_{MG}$\n$E_{OUT} = E_{LOAD} + E_{LOSS}$\n\
    \n$E_{MG} = E_{LOAD} + E_{LOSS} - E_{PV}$\n\n(15)\n\nThe objective of efficient\
    \ balance is to minimize the energy that has to be supplied. A classification\
    \ of all relevant losses in a stand-alone PV system is given as Capture losses\
    \ and System losses. Capture losses account for the part of the irradiation that\
    \ remains uncaptured and therefore lost. System losses define energy losses due\
    \ to the physical properties of the system components.\n\n### 2.4.1 Capture losses\n\
    \nCapture losses translate the fact that only part of the incoming irradiation\
    \ is used for energy conversion. The losses are classified as follows:\n\n- Shading\n\
    Losses due to shading correspond to the reduced energy received by a shaded module\
    \ with respect to the un-shaded one under identical conditions. This direct irradiation\
    \ loss can furthermore lead to mismatch losses within the array.\n\n- Module orientation\n\
    Orientation losses translate the irradiation loss caused by a module disposition\
    \ other than perpendicular to the sun rays. The losses can be considerably reduced\
    \ by using a tracking system that allows an automated adjustment of the module's\
    \ tilt according to the sun's position. Any mechanical tracking system, however,\
    \ requires regular maintenance and represents a potential reduction of the reliability.\
    \ For this reason, tracking systems are usually not used for stand-alone PV systems\
    \ and a fixed orientation and tilt angle is chosen instead.\n\n- Spectral losses\
    \ with respect to AM 1.5\nThe module characteristics as they are given by the\
    \ manufacturer are determined at standard reference conditions (STC), e.g., at\
    \ a standard spectrum of AM 1.5. The deviation between the available irradiation\
    \ spectrum and AM 1.5 causes so-called spectral losses.\n\n- Reflection\nReflection\
    \ losses are irradiation losses at the surface of the PV module where a part of\
    \ the incident sunlight is reflected and therefore lost for the energy conversion\
    \ process.\n\n- Surface soiling\nA dirty module causes energy losses due to a\
    \ reduced transmission of sunlight at the module's surface.\n\n### 2.4.2 System\
    \ losses\n\nSystem losses cover all energy losses which occur during the conversion\
    \ of incoming energy (solar irradiation, fossil fuel) into usable AC electricity.\
    \ The losses can be classified as follows:\n\n- Inverter and battery charger conversion\
    \ losses\nInverter losses are due to the inverter's DC/AC efficiency. Since stand-alone\
    \ inverters are powered from the local dc the stand-by consumption is included\
    \ in this category. The battery charger's AC/DC efficiency is generally somewhat\
    \ lower than the DC/AC inverter efficiency. Note that AC/DC losses are only part\
    \ of the overall losses generated during battery charging from an AC source; battery\
    \ storage losses (see below) and subsequent DC/AC conversion losses occur before\
    \ the initially provided energy can be consumed by an AC load.\n\n- Battery storage\
    \ losses\nStorage losses comprise all energy losses within a battery. They are\
    \ described by the charge and discharge efficiencies of the battery as well as\
    \ the self-discharge characteristics.\n\n- Auxiliary generator losses\nThe specific\
    \ fuel consumption of the auxiliary generator depends on its operating mode. The\
    \ corresponding generator efficiency defines the auxiliary generator losses with\
    \ respect to a maximum efficiency.\n\n- PV-battery mismatch losses"
