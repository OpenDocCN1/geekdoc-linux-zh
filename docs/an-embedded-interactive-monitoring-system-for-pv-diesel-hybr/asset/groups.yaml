    ## 2.2.3 The Fuel generator


    Diesel generators are the most common electricity producers in a large number
    of small and decentralized power systems throughout the world and especially in
    developing countries [6].


    Depending on the fraction of renewable energy in the total energy consumption,
    using diesel generator of the hybrid system can be considered [17] as:


    - * High renewable energy penetration system: In this case, the generator is used
    mainly as a backup-up unit and not necessarily be started every day.

    - * Low renewable energy penetration system: the genset is the main generator
    and runs many hours every day. Fuel consumption and maintenance should be optimized
    to decrease costs.

    - * Medium renewable energy penetration system: the generator usually runs from
    time to time.


    Even in high renewable energy penetration systems, the fuel generator might be
    needed to increase temporarily the overall power of the system in order to run
    some occasional big loads. In this case, parallel operation of the genset with
    the battery inverter(s) is required to allow adding the power of all controllable
    power units.


    The characteristics of the demand, the possibility to operate in parallel with
    battery inverter, and the penetration level of renewable energy will determine
    the size of the generator.


    To consider the generator, it makes sense to consider at the standard. The international
    standard ISO 8528 provides distinguishes three classes of diesel generator sets
    as:


    Class 1:

    generator sets for consumers with minor requirements for stability in voltage
    and frequency behavior. (Lighting systems and simple electric drives)


    Class 2:

    generator sets for consumers, which require voltage stability similar to public
    grids, although higher deviations are accepted during load variation. (Lighting
    systems, electric pumps, fans and elevators)


    Class 3:

    generator sets for consumers with high requirements to frequency and voltage stability.
    (Telecommunication installations, devices with sensitive electronic circuitry)


    Back-up power in high renewable penetration (small hybrid systems < 10 kW) is
    usually provided by single phase fuel genset. Many types of small genset are available
    on the market with different power output characteristics. Main characteristics
    of these gensets are:


    - * Grid quality: usually class 1

    - * The gensets are not designed for continuous operation.

    - * Several fuels options are available: LPG, diesel and gasoline.

    - * Several types of AC current generators are used: permanent magnet synchronous
    or capacity excited asynchronous

    - * Mechanical or electronic governor. With a mechanical governor, the engine
    speed will increase with the increase of the output power. With an electronic
    governor, fixed or variable engine speed is allowed.

    - * Use of frequency converter: Only some gensets have an inverter for conditioning
    the power output of the electrical machine.

    - * Rotational speed: one speed (50 Hz), 2 speeds (low idle and 50 Hz) or variable
    speed

    - * Parallel operation with other genset: possible only with inverter technology

    - * Parallel operation with the battery inverter: the grid will have the quality
    of the genset


    Furthermore, the grid will have the quality of the genset:


    - * Petrol, diesel: the grid will have the quality of the genset

    - * Manual (automatic): the grid will have the quality of the genset

    - * Air-cooled: the grid will have the quality of the genset

    - * Mounting: the grid will have the quality of the genset

    - * Meter: the grid will have the quality of the genset

    - * Soundproofing: the grid will have the quality of the genset

    - * Revolutions per minute (RPM): the grid will have the quality of the genset

    - * Fuel consumption: the grid will have the quality of the genset


