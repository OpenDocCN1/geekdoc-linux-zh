    # Chapter 3: Embedded Linux module: software and hardware


    Operating System distinguishes which platform (Windows, UNIX, AS/400, and Mainframe)
    the web server is running on.


    The Web Software is a continuously looping server waiting for requests by web
    client (browsers or other) for documents over the network. It will parse the request,
    classify the request, and the the corresponding actions. The actions might be
    executing a script, returning a document, accessing a remote database, etc. The
    web server has to understand the request from the client that they must keep the
    same language or protocol in. Hypertext Transfer Protocol (HTTP).


    A port is analogous to a telephone extension. When a client program connects to
    the server on the network, it requests the server program''s port. This port indicates
    exactly which server port the originating client wants to connect to. Data then
    is written to the outgoing port (of the client''s computer) arrives at the server''s
