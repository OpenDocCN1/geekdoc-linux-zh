    # Chapter 4: The interactive monitoring website for the hybrid systems in rural
    areas


    From Figure 4-1 when accessing the website, the operator can easily monitored
    data as well as upload important operation parameters to the hybrid system inverters.
    Using of the web base technology with the advantage of free open-source software,
    the monitoring investment is very low initial costs and running costs.


    # 4.3 Monitoring system components


    The monitoring system in this project is comprised of a monitoring unit (sensor
    unit), a data acquisition unit, and a communication unit. As wireless networks
    expand and the quality continue to improve, it becomes more attractive to use
    a network like GSM for communication. In this way, data is delivered directly
    to the main station and the network will not generate any additional costs for
    operator. Next section will describe all the monitoring system components.


    # 4.3.1 Monitoring unit


    This unit is used to measure the actual operating data of the hybrid system. With
    current technology, this unit is included in the inverter. This project will include
    components from the Sunny Family product line from SMA. Sunny Family products
    incorporate microcontrollers that can monitor the data from the hybrid system
    continuously. The Sunny Boy is a DC/AC inverter for PV modules and the Sunny Island
    is a bi-directional DC/AC inverter for battery management, including charge control
    characteristics. Figure 4-2 is the diagrams of the inverters.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_81_0.png)


    From diagram, the inverter measures the monitored data of the system and defines
