    # Chapter 2: PV-Diesel hybrid system technology


    As mentioned, solar cells are wired in series and in parallel to form a PV module.
    The number of series cells indicates the voltage of the module, whereas the number
    of parallel cells indicates the current. If many cells are connected in series,
    shading of individual cells can lead to the destruction of the shaded cell or
    of the l material, the module can blister and burst. To avoid such an operation
    condition, bypass diodes are connected anti-parallel to the solar cells as in
    Figure 2-12. As a consequence, larger voltage differences cannot arise in the
    reverse-current direction of the solar cells. In practice, it is sufficient to
    connect one bypass diode for every 15-20 cells. Bypass diodes also allow current
    to flow through the PV module when it is partially shaded, even if at a reduced
    voltage and power. Bypass diodes do not cause any losses, because under normal
    operation, current does not flow through them.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_41_0.png)


    Figure 2-12: Series PV cells with bypass diodes


    The I-V characteristic curve of the series configuration as shown in Figure 2-13
    is the result for a given radiation intensity, which is equal for three of solar
    cells.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_41_1.png)


    Figure 2-13: I-V characteristic curve for series connection'
