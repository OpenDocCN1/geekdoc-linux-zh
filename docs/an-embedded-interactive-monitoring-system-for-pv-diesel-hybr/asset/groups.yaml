    混合系统的电池管理逆变器非常重要。它监控电流、电压和温度的限值。它根据 SOC 控制并监控充电情况。电池根据电池的类型进行充电。操作人员必须向逆变器输入正确的电池类型。电池的最终充电电压将根据相应的电池温度进行调整。温度高于
    20 °C 以上，充电电压会降低。


    逆变器有以下四种充电方法：


    - 正常充电（尽可能频繁）

    - 充满充电（约一个月）

    - 均衡充电（约每 2-3 个月一次）

    - 浮动充电（充电完成后）


    当电池达到特定状态时，由电池管理系统初始化充电。图 5-17 显示了铅酸电池充电方法的图表。当 SOC 降至 70% 以下时进行正常充电。


    默认情况下，每两周完成一次充满充电。充满充电会导致电池完全充满，以避免由于低 SOC 导致的不可逆老化。均衡充电大约每 180 天启动一次，以防止充电程度不一的单电池。浮动充电是根据电池的维持电压关闭充电。


