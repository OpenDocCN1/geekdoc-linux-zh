    # Chapter 3: Embedded Linux module: software and hardware


    ## 3.1 Introduction


    As mentioned, the objective of the project is to describe the embedded module,
    software and hardware. The embedded systems were first used back in the late 1960s
    in communications to control electromechanical telephone switches. As the computer
    industry has moved toward the past decade, embedded systems have moved along with
    it, providing more capabilities for tiny machines.


    ## 3.2 Introduction


    An embedded system is a computer used to control equipment for a specific problem
    or specification set of work. A general-purpose computer usually has general missions.
    An embedded system has a limited mission.


    ## 3.3 Criticism of Operating Systems


    Nowadays, most computers use Windows as their operating system. An operating system
    is a program that acts as intermediary between the user and computer.


    ## 3.4 Embedded operating system


    Operating systems for embedded systems began to appear in the late 1970s, and
    today dozen viable options are available such as VxWorks, pSOS, Nucleus, Embedded
    Linux, and Windows CE.


    ## 3.5 Why Linux?


    The power, reliability, flexibility, and scalability of Linux, combined with its
    support for a multitude of microprocessor architectures, hardware devices, graphics
    support, and communications protocols have established Linux as an increasingly
    popular platform for a vast array of projects and products.


    Linux is openly and freely available. Its supporting software components have
    evolved to meet the diverse needs of the markets and applications to which Linux
    is being adapted. Thus, Linux is the best choice for low cost operation.


