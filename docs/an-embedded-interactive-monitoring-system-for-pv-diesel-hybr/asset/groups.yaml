    \ dials in the telephone number of the GSM modem at embedded monitoring module,\
    \ the embedded module answers the call and connects the PC to the embedded module.\
    \ Once the connection is connected, the embedded module sends a login prompt to\
    \ the PC. Then the PC logs in and accesses the embedded module. The program that\
    \ is used at embedded module to handle dial-in is called getty.\n\nThe getty is\
    \ the program that is run for dial-in. It answers the telephone. There are a few\
    \ different getty programs with slightly different names. Only certain ones with\
    \ modems for dial-in. This getty program is usually started at boot-time. It must\
    \ be called from the /etc/inittab file.\n\n## Chapter 5: Implementation and results\n\
    \nThere are four different getty programs: mgetty, uugetty, and agetty. To choose\
    \ from these must be used a program with modem dial-in. The getty is the simplest\
    \ and weakest of the four and it's mainly for modem with directly connected terminals.\
    \ The mgetty supports for fax and voice mail but Ugetty doesn't. The getty_em\
    \ is a simplified version of ugetty. Thus mgetty is the best choice. The mgetty\
    \ was written as a replacement for ugetty which was in existence long before mgetty.\n\
    \nModem dial-in involves the following subsystems (see Fig. 5-7):\n\n- 1. The\
    \ mgetty is merely to \"pick up\" the phone when it rings and to set up the serial\
    \ line. After this, invokes pppd for Internet dial-in.\n- 2. The PPPd program\
    \ encapsulates internet traffic (TCP/IP) into serial packets, which can be set\
    \ over the modem line to the client. At the beginning of the connection, it authenticates\
    \ the user.\n  - File /etc/ppp/pap-secrets is the list of users allowed to log\
    \ in over modem. The password list is supplied.\n  - PPPd program forwards network\
    \ traffic to its final destination via internet.\n\nFigure 5-7 shows diagram of\
