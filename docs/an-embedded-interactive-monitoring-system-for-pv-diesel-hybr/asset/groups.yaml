    # Chapter 3: Embedded Linux module: software and hardware


    ## 3.6 Embedded Linux


    Linux is well suited for embedded Internet devices because of its support of multiprocessor
    systems as well as the advantages of an open source. Unlike general-purpose computer,
    an embedded system only requires less software to actually get a specific set
    of jobs done. This means the software requires less memory, which is important
    for the embedded system that is not included a hard drive and has limited memory
    storage.


    Embedded Linux is a subset of Linux, stripped down to include only those elements
    of Linux that are useful on an embedded system. For example, embedded systems
    typically use a FLASH drive in place of a hard file system. Embedded Linux boots
    in just a few seconds and fits into a few Megabytes of FLASH memory. Embedded
    Linux carries any or all of the features needed in any particular products and
    can run any Linux software that is suitable and useful on the target embedded
    system. Figure 3-2 shows the state of embedded Linux in market.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_66_0.png)


    Source: Evans Data Corporation 2001 Embedded Systems Developer Survey


    Figure 3-2: Status of embedded Linux


    Figure 3-2 indicates that embedded Linux is the most favourite for embedded systems.
    Linux is a robust operating system that has proved itself to be highly reliable.
    Embedded Linux is a high performance software that can be optimized for particular
    applications by the inclusion of specialized features or real-time extensions.
    It provides the peace of mind of knowing for the destiny of projects [7,26,28].
    The figure 3-3 shows the reason of using embedded Linux for embedded applications
    from developers.


    | 0% | 5% | 10% | 15% | 20% |

    |---|---|---|---|---|

    | Source code is available (and free) | | | | | |

    | No runtime royalties | | | | | |

    | Linux is more robust/reliable | | | | | |

    | Linux has excellent networking support | | | | | |

    | There are more drivers and tools available | | | | | |

    | Lots of programmers are familiar with Linux | | | | | |

    | It''s not from Microsoft | | | | | |

    | Other | | | | | |


    Source: LinuxDevices.com survey, December 2000 - http://www.linux devices.com/polls/


    Figure 3-3: Reasons of using embedded Linux


    Figure 3-3 shows that the freely available source code is the most reason of using
    embedded Linux.


    ## 3.7 Embedded Linux for the project


    As mentioned in objectives, the project needs a small-embedded operating system
    to support the specific jobs of the monitoring system and as illustrated in previous
    section that embedded Linux is suitable for an embedded project. In order to implement
    an embedded Linux for the project, the requirements of embedded Linux and the
    requirements of project have to be specified. This section will introduce the
    embedded Linux to the project.


    ### 3.7.1 Embedded Linux requirements


    An embedded Linux works the same principle as a typical Linux system. The typical
    desktop Linux system has three major software layers [7]: the Linux kernel, a
    C library, and application code as in figure 3-4.


    ![](img/8191fe2ca5a41746557b10ddfe82a205_68_0.png)


    From figure 3-4, the kernel has complete control over the hardware. Its drivers
    talk with the hardware on behalf of applications. The next layer up from the kernel
    is the C library in a typical Linux system. Among other things, the C library
    calls the kernel, passing the parameters from the application code to the kernel.
    Finally, the farthest out from the hardware is the application code. The applications
    cause the Linux kernel (or hardware in some applications) to perform the intended
    task.


    When designing the embedded application, it is important to realize that it is
    not possible to break this hierarchy. For some applications do not use C library,
    it is possible to run in the kernel itself as kernel thread, but it is not portable.
    The monitoring system in this project, the application will use the C library.


    ### 3.7.2 Project requirements


    As mentioned in chapter 1, the interactive monitoring website will use the internet
    technology to provide the monitored data at the website. The operators can access
    the data via a web browser. The communication is a GSM modem over TCP/IP network.
    The monitoring system is comprised of a monitoring unit (sensor unit), a data
    acquisition unit, and a communication unit. The data acquisition unit will collect
    the monitored data from the sensor unit and store the data into web server. The
    operators have possibility to download data as well as to set operation parameters
    online via standard web browser. Therefore, the requirements of the system can
    be specified as figure 3-5:


    ![](img/8191fe2ca5a41746557b10ddfe82a205_69_0.png)


    Figure 3-5: The monitoring system software requirements


    ### 3.7.3 Embedded Linux Selection


    After approving the project requirements, the embedded Linux is prepared to serve
    all requirements. The direction of development consists of kernel porting, source
    code, and kernel version. Kernel ports must exist for all CPU architectures in
    order to make flexible for selecting hardware. The smallest possible embedded
    Linux application that uses three software layers (kernel, C library, and statically
    linked application programs (or static application). The simplest way to build
    an embedded Linux.

