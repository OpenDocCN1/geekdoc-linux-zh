  md: "# E.2.3 Configuration of M20\n\n+   - SIM CARDS\n    There are 3 types of SIM\
    \ cards\n    - 5 volt SIMs (older style)\n    - 3/5 volt SIMs\n    - 3 volt SIMs\n\
    \  - The M20 Terminal will not operate with a 5 volt SIM\n  - We believe (but\
    \ have not yet confirmed) that The M20 Terminal will not operate with a 3/5 volt\
    \ SIM\n    Refer to the document Telstra SIM Cards for Data Calls for further\
    \ information on SIM cards for data calls.\n\n+   - OPERATING VOLTAGE\n    The\
    \ current version of the M20 Terminal has supply voltage range of 8 to 15 volt\
    \ DC.\n    The voltage range may be extended to 8 to 24 volts DC by connecting\
    \ a 1-ohm ½ watt series resistor in the supply line. The M20 Terminal must be\
    \ protected with a 1.25 amp fast blow fuse.\n\n+   - IGNITION LINE\n    The M20\
    \ Terminal has a positive supply line and an ignition line. To turn the M20 Terminal\
    \ ON and OFF either.\n    1. Connect the supply line permanently,\n        Turn\
    \ the Terminal ON by pulse the ignition line ON for longer than 1 second then\
    \ leave it off.\n        Turn the Terminal OFF by issuing the ^SMSO AT Command.\n\
    \    2. Connect the supply line and the ignition line together\n        To turn\
    \ the M20 Terminal ON connect these lines to the supply\n        To turn the M20\
    \ Terminal OFF disconnect these lines form the supply.\n    Note the operation\
    \ of the M20 ignition line is different to that of the superseded M1 Terminal.\n\
    \n+   - CONFIGURING THE M20 TERMINAL\n    As with all modems, the M20 Terminal\
    \ must be configured so that it can\n- communicate to the PC or data device connected\
    \ to its serial (RS232 port)\n- communicate on the communications network (i.e.\
    \ the mobile telephone network)\n\n+   - BAUD RATE\n    The factory default baud\
    \ rate of the M20 Terminal to the PC or data device is 19200.\n    The superseded\
    \ Terminal, the M1 GSM modem, (factory default) baud rate to the PC or data device\
    \ is 9600 baud.\n\n# E.2.4 Set Up Procedure for M20\n\n+   - SIM CARDS\n    A\
    \ SIM is require that\n    1. Is 3 volt and\n    2. Has a non-transparent data\
    \ number assigned to it.\n\n+   - BAUD RATES\n    The mobile phone GSM (bearer\
    \ service rate) will always be 9600 baud.\n    The Baud rates between the data\
    \ device and the M20 Terminal and the M20 Terminal (or line modem) at the receiving\
    \ device (PC) can be different.\n    To ensure that the system always sends messages\
    \ correctly the Baud rate of the M20 Terminal serial port ( RS232 port) should\
    \ be locked to be the same as the data device it is to be connected to.\n\n+ \
    \  - TO CONFIGURE THE M20 TERMINAL\n    User will need PC (with a terminal program\
    \ such as Win Terminal, Hyper Terminal, Procom etc).\n    1. M20 Terminal (with\
    \ connected aerial and power supply and a SIM which has a data number)."
  merge: -1
  pgno: 170
