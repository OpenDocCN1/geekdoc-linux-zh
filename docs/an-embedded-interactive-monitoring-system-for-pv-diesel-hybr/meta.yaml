    # 5.3.1 Modem Dial-in


    As the modem is used to communicate between the monitoring website and main station,
    thus the embedded module is set up for dial-in modem. The operator can dial in
    to the embedded module by phone number and then can access the information on
    embedded module by a web browser.


    When the operator, at a main PC with a modem connected, dials in the telephone
    number of the GSM modem at embedded monitoring module, the modem at embedded module
    answers the call and connects the PC to the embedded module. Once the connection
    is connected, the embedded module sends a login prompt to the PC. Then the PC
    logs in and accesses the embedded module. The program that is used at embedded
    module to handle dial-in is called *getty*.


    The *getty* is the program that is run for dial-in. It answers the telephone.
    There are a few different *getty* programs with slightly different names. Only
    certain ones work with modems for dial-in. This *getty* program is usually started
    at boot-time. It must be called from the */etc/inittab* file.'
