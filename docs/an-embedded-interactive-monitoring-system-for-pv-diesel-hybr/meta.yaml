- img_proc: false
  md: '$SOC = \left( \dfrac{C_{nom} - Q_{Bat}}{C_{nom}} \right) \tag{2-9}$


    where $Q_{Bat} = \int_t I dt$


    $C_{nom}$: the nominal capacity of the battery (Ah) (i.e. *C10*)


    $Q_{Bat}$: the Ah-balance (i.e. net Ah discharged or charged since the last full
    state of charge), and *I* is the main reaction current (A).


    - *Relative state of charge*: is the ratio between the difference of the actual
    capacity on the one hand and the charge balance on the other hand, as can be seen
    in the following equation (2.10).


    $SOC = \left( \dfrac{C_{act} - Q_{Bat}}{C_{act}} \right) \tag{2-10}$


    where


    $C_{act}$ is the actual capacity of the battery (Ah). This definition is used
    throughout this work.


    The ability to determine the battery state of charge in a system at any time is
    very important from the point of view of the system operation. Knowing the state
    of charge continuously makes the system energy management possible. In addition,
    for a stand-alone photovoltaic system, the required battery capacity can be more
    accurately determined which implies higher reliability of the energy supply and
    lower system cost [6].


    # 2.2.2.3 Gassing


    With 2.3 – 2.4 V, namely the so-called *gassing voltage*, gas is developed at
    the electrodes in the battery, by which the water is decomposed into hydrogen
    and oxygen. Both gases mix together in the battery providing detonating gas (explosive!)
    and escape through ventilation opening in the vent plug. With the gassing, the
    battery loses also water, which must be refilled according to maintenance within
    regular intervals. The gas is the unwelcome secondary reaction of the chemical
    conversion during charging because current is consumed for the electrolysis and
    therefore the storage efficiency of the battery is made worse unnecessarily.


    After the gassing voltage is exceeded, voltage stays approximately constant. The
    whole charging current during this period results in H₂ and O₂, which is defined
    as loss. For this reason, gassing can be represented by a Zenor diode in series
    with a resistor $R_G$ (Fig. 2-17).'
