  md: '+   2. RS232 serial (modem) cable.


    +   3. Another PC with a line modem attached or a second PC with M20 Terminal
    set up as below will be needed to make a test data call to confirm the correct
    operation of the M20 Terminal.


    - PROCEDURE


    Connect an M20 Terminal to the serial communications port of the PC (using the
    serial lead)


    Note which serial communication port is being used ie COM 1, COM 2, COM 3 etc.


    Turn ON the PC and the M20 Terminal


    The M20 Terminal indicating LED will flash (at about 1 per second) whilst it registers
    on the GSM network. After about 5 seconds the LED should remain permanently on.
    The LED will continue to flash if the M20 Terminal cannot connect to the network.
    This may be because the SIM is not correct (check it is a 3 volt SIM)


    Start the terminal program on the PC


    To set up the computer so that it can talk to the M20 Terminal


    In the terminal program choose [communications] [settings] or as appropriate for
    user program, set the configuration for:


    | Connector/Port | COM 1 or COM 2 (nominate the port that are using ) |

    |---|---|

    | Baud rate | 19200 |

    | Data bits | 8 |

    | Stop bits | 1 |

    | Flow control | none |


    To set up the M20 Terminal so that it can talk on the mobile phone network


    Type the following


    | | TYPE THE FOLLOWING | NOTE |

    |---|---|---|

    | 1 | AT&F [ENTER] | Restore the M20 Terminal factory default set up settings.
    |

    | 2 | AT [ENTER] | Should see OK This confirms the PC is talking to the M20 Terminal
    |

    | 3 | AT&V [ENTER] | The current M20 Terminal settings are displayed. |

    | 4 | AT+IFC=0,0[ENTER] | **Set the M20 Terminal for 3 wire serial connection
    (no hardware control)** |

    | 5 | AT&D0[ENTER] | Turns hardware handshaking and software hanshaking OFF. |

    | 6 | AT&C0[ENTER] | M20 Terminal ignores the state of the DTR line. M20 Terminal
    holds the DCD line on. |

    | 7 | AT&S0[ENTER] | M20 Terminal holds the DSR line on. |

    | 8 | ATS0=2[ENTER] | Set the M20 Terminal to answer incoming calls after 2 rings
    |

    | 9 | AT+CBST=7,0,1[ENTER] | **To set up the M20 Terminal to send data on the
    mobile phone network** Select the mobile phone bearer service baud rate (7) 9600
    baud (v.32), (0) Asynchronous modem, (1) non-transparent. |

    | 10 | AT&W0 [ENTER] | |'
