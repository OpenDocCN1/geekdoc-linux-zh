  md: '+   - *Meter:* A meter to record the number of run-hours is a very useful feature.
    It helps the operators plan preventive maintenance.

    - *Soundproofing:* Soundproofed enclosures are usually expensive. Locally enclosures
    are often cheaper and, in the case of units installed outside, they also provide
    protection against the weather.

    - *Revolutions per minute* (*RPM*): Generators with low RPM ratings, such as 1500
    to 1800 RPM, are slow running and have longer working lives. (Models with RPMs
    of less than 1000 are rarely available.) Faster running models, with RPMs of 3000
    to 3600, are found to require more maintenance and greater fuel consumption. A
    cheap model with a high RPM may therefore not be a better choice than a more expensive
    model with a low RPM.

    - *Fuel consumption:* Fuel consumption per hour is dominant running cost. The
    fuel consumption of a diesel engine generally depends on the machine type and
    construction characteristics. Its efficiency varies from 20 to 37 % at high load
    levels. Fuel efficiency drops drastically at low load levels. Diesel fuel consumption
    is a function of the engine load and revolution. Figure 2-20 shows typical fuel
