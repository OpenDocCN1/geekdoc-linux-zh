    # 2.2.2.2 State of charge (SOC)


    One important parameter to define the energy content of the battery is the state
    of charge (SOC). This parameter indicates how much charge is available in the
    battery referring to its capacity. This definition includes a degree of ambiguity,
    because the capacity here can carry different values, either the nominal capacity,
    or the actual capacity. Recent work is carried out in order to analyze the different
    definitions of the SOC and their reference values [6]. State of charge, operation
    state of charge, relative state of charge etc., all of them are parameters that
    carry different estimations for the energy content of the battery. The following
    two definitions are of interest:


    +   - *State of charge* (*SOC*): is the ratio between the difference of the rated
    capacity on the one hand and the charge balance on the other hand, as can be seen
    in equation (2-9).'
