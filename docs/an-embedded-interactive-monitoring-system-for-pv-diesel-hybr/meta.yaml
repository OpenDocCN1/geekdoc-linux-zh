  md: '# Zusammenfassung


    Netzautarke PV-Diesel-Hybridsysteme sind weltweit installiert worden, um abgelegene
    und ländliche Regionen mit elektrischer Energie zu versorgen, die weder über einen
    Anschluss an ein elektrisches Energieversorgungsnetz noch über ein Telefonnetz
    verfügen und die zudem oft schwer erreichbar sind. Noch immer ist es schwierig,
    diese PV-Diesel-Hybridsysteme zu regeln und einen guten und zuverlässigen Betrieb
    aufrechtzuerhalten.


    Um ein PV-Diesel-Hybridsystem stabil und zuverlässig zu betreiben, ist es notwendig,
    ein Überwachungssystem zu integrieren. In dieser Arbeit wird eine interaktive,
    webbasierte Technik mit einem eingebetteten Linuxsystem für den Einsatz als Fernüberwachung
    in einem PV-Diesel-Hybridsystem untersucht und entwickelt.


    In den meisten Fernüberwachungssystemen werden die im überwachten System aufgezeichneten
    Daten an ein Mastersystem weitergegeben. Die meisten PV-Systeme werden in den
    ersten Jahren nach ihrer Installation verschiedenen Überwachungsprozeduren unterzogen.
    Im Allgemeinen werden die Systeme in solchen abgelegenen Gebieten in jährlichem
    Abstand mittels durchgeführter Kontrollbesuche in Verbindung mit einem Datenlogger
    überwacht. Während der Lebensdauer der Hybridsysteme übertreffen die Kosten für
    die durchgeführte Wartung und Vermessung häufig deutlich die Kosten für die Systeme
    selbst. Die realisierbaren Reaktionszeiten für Wartung, Reparatur und Systemverbesserungen
    sind in der Regel nicht zufriedenstellend. Es existierten bereits früher präsentierte
    Überwachungssysteme wie SCADA (Supervision Control and Data Acquisition) oder
    satellitengestützte Systeme. Allerdings weisen diese Systeme bedeutende Nachteile
    auf: hohe Investitionskosten, notwendige Anschaffung spezieller Software für die
    Clientsysteme und Probleme mit der Kommunikation.


    In jüngster Zeit ist als weitere Option die Nutzung des Internet zur Überwachung
    hinzugekommen. Dennoch ist eine Implementierung des Internet in das Hybridsystem
    in abgelegenen Gegenden sowohl in technischer als auch in ökonomischer Hinsicht
    noch immer ineffizient, da vor Ort häufig weder eine Infrastruktur mit Telefonleitungen
    noch mit Internetverbindungen existiert. Zudem benötigen handelsübliche Computer
    für Webserver viel Energie.


    Um diese Nachteile zu überwinden, wurde in dieser Arbeit ein eingebettetes Linuxmodul
    mit einer interaktiven Überwachungswebsite untersucht und entwickelt. Es handelt
    sich um ein kompaktes eingebettetes Linuxmodul für einen Apache Webserver mit
    sehr geringem Energieverbrauch. Das eingebettete Modul stellt einen gewöhnlichen
    Webserver und eine Datenerfassungseinheit bereit. Die aufgenommenen Daten können
    in dem Webserver gespeichert werden und über ein GSM-Modem an eine Workstation
    angeschlossen werden. Die Kommunikation basiert auf GSM-Technik. Auf die Überwachungsdatenbank
    kann mit Hilfe eines Standard-Webbrowsers zugegriffen werden. Während des Zugriffs
    auf die Webseite kann der Nutzer sowohl die gespeicherten Daten herunterladen
    als auch wichtige Parameter an die Systemkomponenten übertragen.


    Mit der Implementierung, basierend auf eingebetteter Webtechnologie, wird der
    Einfluss auf die Investitionskosten und die laufenden Kosten des Datenerfassungssystems
    untersucht. Die Möglichkeit des Zugriffs auf die aufgezeichneten Daten und des
    Eingriffs in Systemparameter online über einen Webbrowser wird ebenfalls implementiert,
    um die Funktion des Überwachungssystems aufzuzeigen.


    Die Ergebnisse der Implementierung in dem eingebetteten interaktiven Linux-Überwachungssystem
    werden als Kriterium dafür herangezogen, ob es sich dabei um eine geeignete Lösung
    zur Fernüberwachung abgelegener Systeme handelt. Die aufgezeichneten Daten werden
    analysiert, um das Verhalten des PV-Diesel-Hybridsystems im Hinblick darauf zu
    untersuchen, wie das System zukünftig verbessert werden kann.'
