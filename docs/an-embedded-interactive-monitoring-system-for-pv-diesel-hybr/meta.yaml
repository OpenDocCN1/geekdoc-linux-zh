  md: '# Chapter 5: Implementation and results


    ![](bbox=[0.12, 0.05, 0.88, 0.46])


    The battery management inverter of the hybrid system is very important. It monitors
    the limit values for current, voltage, and temperature. It controls and monitors
    the charge depending on its SOC. The battery is charged accordingly to the type
    of battery. The operator has to enter a correct type of battery to the inverter.
    The final charge voltage of the battery is adjusted to the respective battery
    temperature. Above 20° C, the charge voltage is decreased.


    The inverter has four charging method as followings:


    +   - Normal charge (as often as possible)

    - Full charge (about one a mount)

    - Equalizing charge (about every 2-3 mounts)

    - Float charge (after charge completed)


    Charging is initialized by the battery management when the battery state has been
    reached. Figure 5-17 shows a diagram of battery charging method of lead-acid battery.
    A normal charge is made when the SOC has fallen below 70%.


    By default, a full charge is completed about every two weeks. The full charge
    leads to complete charging of battery in order to avoid irreversible aging due
    to low SOC. An equalizing charge is initiated about 180 days preventing the individual
    cells that have charged different degree. Float charge is to switch off charging
    according to criteria voltage of the battery.'
  merge: -1
  pgno: 106
- img_proc: false
  md: '# Chapter 5: Implementation and results


    ![](bbox=[0.09, 0.06, 0.82, 0.39])


    From figure 5-17, when the SOC is below 70% the normal charge is made. From the
    normal charge, when the battery voltage reached 2.55 V. The charging method is
    able to go for the float charge, the full charge, or equalizing charge. If period
    is not at full charge or equalizing charge, the charging method will go to float
    charge. If period is over 14 days, the charging method will go to the full charge.
    At full charge, it will charge and keep the battery at 2.55 V for five hours then
    go to the float charge. If period is over 180 days, the charging method will go
    to the equalizing charge. At equalizing charge, it will charge and keep the battery
    at 2.45 V for ten hours then go back to the float charge.


    Moreover, the inverter has a switching operation. The SOC is determines the action
    of charging. The inverter has eleven state relays to control the battery charging.
    Figure 5-18 shows a diagram of switching operation depending on the SOC.


    ![](bbox=[0.1, 0.65, 0.82, 0.93])'
  merge: -1
  pgno: 107
