  md: '# Glossary of Terms


    AC : Alternating current (AC), household utility current in most countries is
    AC with a frequency of 50/60 hertz (60 complete cycles per second).


    AM : Air mass


    API : An application program interface (API - and sometimes spelled *application
    programming interface*) is the specific method prescribed by a computer operating
    system or by an application program by which a programmer writing an application
    program can make requests of the operating system or another application.


    ARP : Address Resolution Protocol (ARP) is a protocol for mapping an Internet
    Protocol address (IP address) to a physical machine address that is recognized
    in the local network. There is a Reverse ARP (RARP) for host machines that do
    not know their IP address. RARP enables them to request their IP address from
