- img_proc: false
  md: '![](bbox=[0.13, 0.084, 0.826, 0.314])


    Figure 2-17: Quasi-static equivalent circuit with representation of gassing [8]


    The Zener diode is reverse biased and therefore does not conduct until the charging
    voltage exceeds its breakdown voltage, namely the gassing voltage. Then it functions
    as a voltage regulator by keeping the voltage across it constant and allows the
    whole charging current to pass through, which is dissipated in $R_G$ as heat.
    It must be noted that this concept can be applied only for lead-acid batteries
    because gassing destroys gel batteries (sealed type of lead-acid batteries).


    Continually, heavy gassing damages the battery, so that in the data sheet the
    manufacturers give the so-called *maximum charge voltage*, which is not allowed
    to be exceeded during charging. This voltage is situated about 2.3 – 2.4 V per
    cell (with 20 °C) corresponding to 13.8 – 14.4 V for 6 cells. In many battery
    types, small gassing for a short time is however required to mix the electrolyte
    and to provide an equal acid concentration for whole cell volume [8].


