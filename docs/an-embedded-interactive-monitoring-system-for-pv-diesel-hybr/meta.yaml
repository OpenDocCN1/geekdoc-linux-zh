    # E.2.2 Electrical description


    M20 Terminal has following plugs for power supply, interfacing and antenna:


    +   - 6-pole Western plug (female) for power supply, ignition signal and audio-line-in/out-signal

    - 4-pole Western plug (female) for connecting a handset

    - 9-pole (female) SUB-D plug for V.24/V.28 serial interface

    - 20 cm antenna cable with FME plug (female)


    **6-pole Western plug (female)/power supply, ignition, line-in/out**


    | Pin | Usage |

    |---|---|

    | 1 | Power supply 8-28.8 V |

    | 2 | Audio Line Ground (for pin 3/AC:in & pin 5/AC:out) |

    | 3 | (This Pin must not exceed Voltages >2V to avoid power switched off!) AC:
    Line-in input 600 Ohm. DC: Signal for power Off, power off for U (to pin6) >8V
    (ignition low) |

    | 4 | Ignition > 5V for longer than 1 s switches on. Ignition signal (see M20:
    80-pole connector Pin 8). Ignition for U (to pin 6) >5V |

    | 5 | (This Pin must not exceed Voltages >2V during power on procedure to avoid
    a change to bootmode!) AC: Line-out 600 Ohm. DC: Signal for initialisation of
    SW download for U(to Pin6)>8V |

    | 6 | GND |


    > *Note:*

    (1) Ignition signal has to be set > 5V for longer than 1 s, remember that this
    signal has to be low when switching off the M20 with AT command AT^SMSO, see Chapter
    5.7 "*Siemens-defined AT commands for enhanced functions*" on page 111.

    (2) SW-DOWNLOAD: To switch the M20T to bootmode use the following procedure:

    Apply > 8V to Pin 5 before or together with the supply voltage. The M20T switches
    to bootmode. Proceed according to capt.8.5 (e.a.?) loading the SW using the RS
    232-interface (9-pole SUB-D plug).

    (3) POWER_OFF EXCEPTION HANDLING: In case of software hang-ups etc. the M20T can
    be switched off using the following procedure (exception handling): Pin 3 must
    be applied with a voltage > 8V AND Pin 4 must be low (0V). To switch on again,
    set ignition >5V (and Pin 2 <2V).


    ![](bbox=[0.12, 0.87, 0.27, 0.945])'
  merge: -1
