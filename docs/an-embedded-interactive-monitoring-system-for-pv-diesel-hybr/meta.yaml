  md: '# # Chapter 2: PV-Diesel hybrid system technology


    *Class 1:* generator sets for consumers with minor requirements for stability
    in voltage and frequency behavior. (Lighting systems and simple electric drives)


    *Class 2:* generator sets for consumers, which require voltage stability similar
    to public grids, although higher deviations are accepted during load variation.
    (Lighting systems, electric pumps, fans and elevators)


    *Class 3:* generator sets for consumers with high requirements to frequency and
    voltage stability. (Telecommunication installations, devices with sensitive electronic
    circuitry)


    Back-up power in high renewable penetration (small hybrid systems < 10 kW) is
    usually provided by single phase fuel genset. Many types of small genset are available
    on the market with different power output characteristics. Main characteristics
    of these gensets are:


    +   - Grid quality: usually class 1


    +   - The gensets are not designed for continuous operation.


    +   - Several fuels options are available: LPG, diesel and gasoline.


    +   - Several types of AC current generators are used: permanent magnet synchronous
    or capacity excited asynchronous


    +   - Mechanical or electronic governor. With a mechanical governor, the engine
    speed will decrease with the increase of the output power. With an electronic
    governor, fixed or variable engine speed is allowed.


    +   - Use of a frequency converter: Only some new gensets have an inverter for
    conditioning the power output of the electrical machine.


    +   - Rotational speed: one speed (50 Hz), 2 speeds (low idle and 50 Hz) or variable
    speed


    +   - Parallel operation with other genset: possible only with inverter technology


    +   - Parallel operation with the battery inverter: the grid will have the quality
    of the genset


    Furthermore, there are some points to consider:


    +   - *Petrol, LPG or diesel:* Most hybrid systems use diesel units which are
    more robust. Domestic petrol generators of the kind used in homes and shops are
    relatively cheap and easy to move around and can be used with LPG already available
    for cooking. However, they are not meant for continuous operation over a period
    of years and can only be recommended for high renewable energy penetration hybrid
    systems.


    +   - *Manual versus electric (automatic) starting:* Hand starting is far less
    expensive. However automatic starting may be needed when power cuts are frequent
    and operators are absent at remote area.


    +   - *Type of cooling:* Air-cooled units are easier to maintain than units are
    with water-cooling.


    +   - *Mounting:* A separately mounted fuel tank is often preferable to an engine-mounted
    tank, which is subject to vibrations.'
