  md: '# ## 2.2.4 Inverters for AC-coupled hybrid systems


    Power converters are used to convert DC power from PV panels and batteries to
    AC power. The most common power conversion devices are electronic inverters, DC
    to AC inverter, AC to DC inverter, and bi-directional inverter. The inverter is
    normally only single phase for small power ratings and it is possible to be connected
    into three phases as in figure 2-21.


    ![](bbox=[0.11, 0.21, 0.89, 0.54])


    *Figure 2-21: Three phase PV diesel hybrid system*


    Figure 2-21 shows an AC-bus three-phase system with three battery inverters, PV
    string inverters, and a diesel three-phase generator. Additionally the system
    contains a supervisory control unit, which is in charge of the energy management.


    For stand-alone application, the output waveform of inverters becomes important.
    The deviation from the ideal sinusoidal voltage is normally described as total
    harmonic distortion (THD). For high-quality power supply, the THD of the output
    voltage should be less than 5 %, which corresponds with the quality of the public
    grid [8].


    A second and very important element for stand-alone applications, the ability
    to provide and to absorb reactive power should be mentioned. Typical loads requesting
    reactive power are electric motors. In some inverter designs handling of reactive
    power is limited depending on the load type. In this case, the acceptable power
    factor is defined. The maximum power of the inverter is given in Kilo-Volt-Amperes
    (kVA) instead of Kilo-Watts (kW). The energy of the reactive power, which is to
    be absorbed and afterwards re-injected to the load, is normally stored in capacitors
    of appropriate sizes.


    Inverter efficiency is generally low at low power level and good (80%-90%) at
    high power levels depending on the inverter type, see Figure 2-22.'
