  md: "# Appendix E: Embedded Hardware Module and Modems\n\n| 11 | ATZ0 [ENTER] |\
    \ **Store the set up, in the M20 Terminal's memory** |\n| | | Store the set up\
    \ in memory location 0 |\n| | | Load the set up in memory 0 to be the current\
    \ set up |\n| 12 | AT&V [ENTER] | The current M1 settings are displayed. Confirm\
    \ that they are as entered. (It is recommended that the set up is printed for\
    \ future reference) |\n\n# E.3 The PPPd set up\n\nThis is a short how-to for setting\
    \ up PPPd for peer-to-peer communication.\n\n*Required software:*\n-------------------\n\
    \n+   * Functional Linux system with network ;-)\n* mgetty (frontend) version\
    \ 1.1.28 compiled with AUTO_PPP accepts a phone call and passes control to pppd.\n\
    * pppd (backend) version 2.4.1 is responsible for PPP network things.\n\n*1. Overview\
    \ of the server system*\n----------------------------------\n\nThe server has\
    \ a modem connected to a serial line.\n0. The computer started and booted.\n1.\
    \ /sbin/init takes control and run boot scripts etc.\n   It also run mgetty to\
    \ monitor the modem.\n2. mgetty waits for rings on the phone line.\n   ... someone\
    \ call its number ...\n3. mgetty tells the modem to pick up the call.\n4. mgetty\
    \ may introduce itself and waits for a PPP packet.\n5. After a PPP packet has\
    \ been detected, mgetty passes control to pppd. After this it's a \"normal\" PPP\
    \ session.\n\n*2. Setting up /etc/inittab and mgetty*\n---------------------------------------\n\
    \n\"man mgetty\" and \"info mgetty\" are guidelines!\n\nInsert this line into\
    \ /etc/inittab\n\n```\nS0:345:respawn:/usr/sbin/mgetty ttyS0\n```\n\nfor the modem\
    \ on ttyS0 (COM1, the first serial port), or\n\n```\nS1:345:respawn:/usr/sbin/mgetty\
    \ ttyS1\n```\n\nfor the modem on ttyS1 (COM2) and so on.\n\nAnd put this line\
    \ (if it doesn't exist) in /etc/mgetty+sendfax/login.config"
  merge: -1
