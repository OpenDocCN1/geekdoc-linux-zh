  md: '# Abstract


    Autonomous PV-Diesel hybrid power supply systems are installed worldwide to supply
    electricity in remote and rural areas where no grid exists and where accessibility
    is often difficult. In this environment, it is also difficult to properly monitor
    the PV-Diesel hybrid systems in a conventional way.


    In order to keep the PV diesel hybrid system working properly and reliably, it
    is necessary to include a monitoring system. The thesis will describe an interactive
    web based technology with embedded Linux system for remote monitoring of the PV
    diesel hybrid system.


    In most remote monitoring systems, the information is collected from the remote
    station to a master station. Most photovoltaic systems undergo some types of monitoring
    at least a few years after their installation. Common systems in such rural areas
    are supervised by yearly visits in conjunction with a data logger. Over the lifetime
    of a system, the costs for supervision often significantly exceed the cost of
    the system itself. Response time for maintenance, repair, and product improvements
    are poor. There are already some other monitoring systems which have been presented
    earlier such as SCADA (Supervision Control and Data Acquisition) or even satellite-based
    systems. However, the recognized problems for those methods are: high investment
    cost, needs for special software for client stations, and difficulty with communication
    links.


    Using the internet for monitoring is another option that becomes feasible lately.
    However, to implement the internet with the hybrid system in remote and rural
    areas is still inefficient in both technical terms and economical terms. Because
    of the problem that there is no telephone line coverage and internet connection
    in remote areas. Moreover, a typical computer for a web server consumes much energy.


    To overcome these disadvantages, an embedded Linux module with an interactive
    monitoring website has been investigated and developed in this thesis. It is a
    small-embedded Linux module for an Apache web server with an extremely low power-input
    required. The embedded module provides a common web server and data acquisition
    unit. The monitoring database can be stored in the web server and connected to
    a workstation by a GSM modem. The communication will be based upon GSM technology.
    The monitoring database can be accessed via a standard web browser. When accessing
    the website, the operator can download monitored data as well as upload important
    parameters to the system.


    With the implementation of embedded web based technologies, investigations on
    both, initial investment costs and running costs of monitoring system have been
    performed. The ability to access the data and to change operation parameters online
    via a standard web browser has been implemented.


    The results of the implementation on the embedded Linux interactive monitoring
    system will be considered as criteria to prove itself whether it is a suitable
    solution for remote monitoring where there is a lack of infrastructure. The monitored
    data will be analyzed to investigate the behavior of the PV diesel hybrid system
    in order to optimize and improve the system.'
