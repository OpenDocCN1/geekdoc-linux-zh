    </body>\n</html>\n```\n\n# A.4 Software installation\n\nAfter the embedded module\
    \ is selected, the installation of the software can be proceeded. The first installation\
    \ is the embedded Linux operating system.\n\n# A.4.1 Embedded Linux installation\n\
    \nAs mentioned, the white dwarf Linux is freely available online at http://www.whitedwarflinux.org\
    \ so that using online installation is powerful. After preparing the hardware,\
    \ the following is to install White Dwarf Linux:\n\n+   1. Set the clock in the\
    \ BIOS to the correct time. If this is not done the system will end up getting\
    \ a number of errors as the system thinks that the hard drive of filesystem has\
    \ gone too long without being checked. Password and other utilities may also be\
    \ affected by an incorrect date.\n2. Download and create the white dwarf bootdisk\
    \ and rootdisk images for installation. Using a Linux machine to create:\n   \
    \ dd if=wdboot.img of=/dev/fd0\n    Insert another clean floppy use these commands:\n\
    \    mkfs /dev/fd0\n    mount /dev/fd0 /mnt\n    cp root2.tar.bz2 /mnt\n    umount\
    \ /mnt\n    From a DOS machine, use RAWRITE.EXE, at C prompt:\n    C:\\> RAWRITE\n\
    \    Answer the prompts for the name of the file to write and the floppy to be\
    \ written it to.\n    Do the same for the rootdisk.\n3. Boot the JUMPtec with\
    \ the bootdisk.\n\nThe following should appear during the boot process:\n\n```\n\
    RAM disk driver initialized: 16 RAM disks of 5000K size hda: SunDisk SDTB-128,\
    \ ATA DISK drive\nide0 at 0x1f0-0x1f7,0x3f6 on irq 14\n```"
