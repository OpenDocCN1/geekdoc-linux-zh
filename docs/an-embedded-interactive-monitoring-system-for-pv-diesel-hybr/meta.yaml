  md: '# Chapter 4: The interactive monitoring website for the hybrid systems in rural
    areas


    Networks are classified by considering the technique of transmission into two
    groups:


    +   - broadcast

    - point-to-point (peer-to-peer, PPP)


    *Broadcast networks* are characterized that all machines share the same transmission
    (logical) channel. Therefore when a machine sends a message on such a network,
    all machines without exception receive it. Machines on such a network are identified
    using addresses.


    *Point-to-point (peer-to-peer) networks* are characterized by communication channels
    that link only two specific machines, that is to say that a message must jump
    from one machine to another to reach its destination. This network will be considered
    for project.


    The basic concept of networks is the communication and the exchange of data between
    users. The communication system is in charge of the information transfer and the
    right delivery to the final user. In this context, it is necessary to set up rules
    so that both sender and receiver can understand each other. These rules are managed
    by mechanisms called protocols.


    Protocols correspond to a given implementation of a layer. The set of layers and
    protocols is called network architecture. There are two important network architectures
    that are referred, the OSI (Open Systems Interconnection) and the TCP/IP reference
    model.


    # 4.5.1 The Open Systems Interconnect (OSI) reference model


    The OSI reference model was developed in the early 1970s by the International
    Standards Organization (ISO). Provides a set of general design guidelines for
    data-communications systems and also gives a standard way to describe how various
    portions (layers) of data-communication systems interact.


    The hierarchical layering of protocols on a computer that forms the OSI model
    is known as a stack. A given layer in a stack sends commands to layers below it
    and services commands from layers above it.


    The seven layers in order from highest to lowest are Application, Presentation,
    Session, Transport, Network, Data Link, and Physical (see figure 4-4).


    +   - The Application layer includes network software that directly serves the
    user, providing such things as the user interface and application features. The
    Application layer is usually made available by using an Application Programmer
    Interface (API), which are made available by the networking vendor.

    - The Presentation layer translates data to ensure that it is presented properly
    for the end user, also handles related issues such as data encryption and compression,
    and how data is structured, as in a database.

    - The Session layer comes into play primarily at the beginning and end of a transmission.
    At the beginning of the transmission, it makes known its intent to transmit. At
    the end of the transmission, the Session layer determines if the transmission
    was successful. This layer also manages errors that occur in the upper layers,
    such as a shortage of memory or disk space necessary to complete an operation,
    or printer errors.'
  merge: -1
  pgno: 84
- img_proc: false
  md: '# Chapter 4: The interactive monitoring website for the hybrid systems in rural
    areas


    +   - The Transport layer provides the upper layers with a communication channel
    to the network. The Transport layer collects and reassembles any packets, organizing
    the segments for delivery and ensuring the reliability of data delivery by detecting
    and attempting to correct problems that occurred.

    - The Network layer''s main purpose is to decide which physical path the information
    should follow from its source to its destination.

    - The Data Link layer provides a system through which network devices can share
    the communication channel. This function is called media-access control (MAC).

    - The Physical layer provides the electro-mechanical interface through which data
    moves among devices on the network.


    # 4.5.2 The TCP/IP reference model


    TCP/IP commonly refers to a network architecture, but this acronym also refers
    to two protocols that are closely bound: a transport protocol, TCP (Transmission
    Control Protocol), IP (Internet Protocol). The "TCP/IP model" is actually a network
    architecture of four layers in which the TCP and IP protocols have a major role,
    since they constitute the official and most common implementation. Consequently,
    TCP/IP means two different things: the 4-layer network architecture, and the set
    of two protocols, TCP and IP.


    The TCP/IP reference model can be described as a four-layer network architecture
    (see figure 4-4):


    +   - The application layer, contrary to the OSI model, this layer is immediately
    bound to the transport layer, simply because the session and presentation layers
    are useless. The OSI model without these 2 layers is really close to the TCP/IP
    model.

    - The transport layer, It has the same role as the transport layer of the OSI
    model: it is used to make peer entities dialog with one another. Officially, this
    layer only has two possible implementations: the TCP protocol (Transmission Control
    Protocol) and the UDP protocol (User Datagram Protocol). TCP is a connection-oriented
    protocol. Its role is to split up the message to be transmitted into a form the
    internet layer can handle. UDP is a simple protocol.

    - The internet or network layer, this layer is the key of the architecture. It
    realizes the interconnection of remote (heterogeneous) networks without establishing
    a connection. Its role is to inject packets into any network and deliver them
    to the destination independently to one another. Because of the major role of
    this layer in the packet delivery process, the critical point of this layer is
    routing. For this reason, it seems like the network layer of the OSI model.

    - The host-network or link layer, it seems to comprise both physical and data
    link layers of the OSI model. Actually, this layer has not been really specified;
    the only constraint of this layer is to allow a host to send IP packets of a network.
    In more concrete terms, this implementation is typical of the technology used
    to build the local network (LAN). For example, LANs use Ethernet; Ethernet is
    an implementation of the host-network layer.'
