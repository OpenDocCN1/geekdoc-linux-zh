  md: '# 2.2.2.5 Cycle life of lead-acid batteries


    The cycle life refers to a capability of the battery to withstand a certain number
    of charge/discharge cycles of given *depth of discharge* (DOD). Since the lifetime
    of the battery also depends on the average depth of discharge during cycling (expressed
    in percentage (%) of rated capacity), the cycling capability may be more conveniently
    expressed by multiplying this average depth of discharge by the battery lifetime
    expressed in number of cycles. The result is called the *nominal cycling capability*,
    which is expressed as the number of equivalent 100 % nominal capacity cycles.


    The starter battery typically has a low cycling capability of less than 100 nominal
    cycles, which means that it is able to withstand for example 500 cycles of maximally
    20 % depth of discharge. The battery appropriate for PV application requires a
    good cycling capability of at least 500 nominal cycles, which means that it should
    be able to withstand for example 1000 cycles of 50 % depth of discharge. Fig.
    2-19 shows the cycle life as a function of DOD.


    ![](bbox=[0.244, 0.367, 0.755, 0.723])


    Figure 2-19: Cycle life as a function of deep of discharge (Source: VARTA special
    report 3/1987)


    # 2.2.2.6 The battery capacity


    Previously, the storage capacity of a battery is expressed in Ah (Ampere-hours)
    showing how many hours a certain current can be taken from the charged battery
    until the battery is discharged, i.e. until the battery voltage drops to the discharge
    voltage threshold.


    Nowadays, it might be more favorable to express a battery capacity in dischargeable
    energy, namely Wh (Watt-hours) or kWh (kilowatt-hours). However, these two ways
    of expressing the battery capacity are equivalent because they are related via
    the battery voltage, i.e. Ah · V = Wh.'
