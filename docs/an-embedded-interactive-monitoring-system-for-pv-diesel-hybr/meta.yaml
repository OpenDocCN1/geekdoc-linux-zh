  md: '# Chapter 2: PV-Diesel hybrid system technology


    For the quasi-static processes, a capacitor $C_p$, which is connected in parallel
    to a resistor $R_p$, disappears. This derived model corresponds to the Shepherd
    model, which is perhaps the most spread model worldwide [8].


    An additional loss in the battery is due to self-discharge, which is represented
    by a resistor $R_S$ (Fig. 2-15). This resistance is responsible for the emptiness
    of charged batteries after they are left for so long although they are never in
    use. Good solar batteries should therefore have very high $R_S$ in order to keep
    this loss as small as possible.


    ```

    $$I_B = I - I_S \quad\quad\quad\quad\quad\quad\quad\quad\quad (2\text{-}7)$$

    ```


    where:


    $I$ = battery current, which should be provided [A]

    $I_S$ = self-discharge current [A]


    Anyway, the rated voltage of the lead-acid battery cell amounts of 2V. A common
    12V battery consists therefore of 6 series connected cells. In practical, the
    terminal voltage varies according to operating condition. However, due to the
    fact that acid concentration changes during charging and discharge as stated before,
    the equilibrium voltage can be estimated with following empirical equations:


    ```

    $$V_E \approx V_k + \text{acid concentration} \ [\text{g/cm}^3] \quad\quad\quad\quad\quad
    (2\text{-}8)$$

    ```


    where:


    $V_E$ = equilibrium voltage [V]

    $V_k$ = 0.84…0.88 (dependent on battery types [6])


    For example, regarding a battery with H₂SO₄ concentration 1.28 g/cm³ and $V_k$
    = 0.84 for Tudor batteries [8]: thus the equilibrium ≈ 0.84 + 1.28 = 2.12 V.


    In case of discharge, the minimum voltage level acceptable for a lead-acid battery
    is defined as *discharge voltage threshold*. Falling below this threshold is called
    *deep discharge*, with which the battery may suffer damage. In case that the battery
    is left longer after deep discharge, lead of the support structure is converted
    to lead-sulphate in rough-crystalline form, which during charging can be only
    bad or cannot be converted again anymore. As a result, the battery loses a part
    of its storage capacity; besides loss of support structure arises as well.


    In practice, harmful deep discharge is to be prevented: the consumers will be
    compulsory disconnected from battery as soon as the discharge voltage threshold
    is reached i.e. with the help of a so-called *deep discharge protection* (DDP).
    This threshold is basically given in the data sheets by the manufacturer for different
    discharge currents. Preferably, the value of this threshold should depend on the
    discharge current. The relation between the discharge current and the voltage
    during discharge for the lead-acid battery is presented in Figure 2-16.'
