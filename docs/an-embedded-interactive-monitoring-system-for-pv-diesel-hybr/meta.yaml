  md: '# # Curriculum Vitae


    Mr. Boonyang Plangklang was born in August 9, 1973, in the District of Sawangdandin,
    province of Sakonakorn in the Northeast of Thailand. He received the Bachelor
    degree of Engineering (B.Eng) in Electrical Engineering from the Faculty of Engineering,
    Rajamangala Institute of Technology, Bangkok, Thailand, in 1996. He received a
    diploma in Instrumentation at Northern Alberta Institute of Technology (NAIT),
    Edmonton, Alberta, Canada, in 1997. He graduated Master of Science in Electronics
    System and Engineering Management at University of Paderborn, division Soest,
    Germany, with the cooperation of Bolton Institute of Higher Education, UK, by
    the DAAD scholarship in 2001. He is now a lecturer at the Department of Electrical
    Engineering, Faculty of Engineering, Rajamangala University of Technology, RMUT
    (former Rajamangala Institute of Technology), Thanyaburi, Phatumthani, Thailand.'
