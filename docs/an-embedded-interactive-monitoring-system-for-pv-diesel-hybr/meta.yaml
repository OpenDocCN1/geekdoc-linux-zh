  md: '# Chapter 2: PV-Diesel hybrid system technology


    The coulombic efficiency is usually measured at a constant discharge rate referring
    to the amount of charge able to be recalled from the battery (Q~D~) relative to
    the amount put in during charging (Q~C~). Self-discharge will affect coulombic
    efficiency.


    η~I~ = Q~D~/Q~C~


    (2-12)


    The battery will usually need more charge than was taken out to fill it back up
    to its starting point. Typical average coulombic efficiencies are 80 – 85 % for
    stand-alone PV systems, with winter efficiencies increasing to 90 – 95 %, due
    to higher coulomb efficiencies when the battery is at a lower state of charge
    and most of the charge going straight to the load, rather than into the batteries.


    The voltage efficiency is determined by the average discharge voltage (V~D~) and
    average charging voltage (V~C~). V~C~ is lower than V~D~ particularly by internal
    resistance of the battery.


    η~V~ = V~D~/V~C~


    (2-13)


    The overall efficiency (η~Σ~) should be as high as possible, to be able to pass
    the biggest proportion of the energy in the battery, which is generated by the
    PV generator, further to consumers.


    - *Self-discharge*


    The battery discharges itself even without load connected. This effect is caused
    by secondary reactions at it electrodes and proceeds faster with higher temperature
    or older battery. Thermodynamic instability of the active materials and electrolytes
    as well as internal- and external short-circuits lead to capacity losses, which
    are defined as self-discharge. This loss should be small, particularly according
    to annual storage.


    - *Maintenance cost*


    The maintenance, e.g. water refilling in case of lead-acid batteries, should be
    kept as low as possible.


    - *Easy installation and operation*


    Since batteries are driven often also from non-experts. Easy installation and
    operation are therefore favorable.


    - *Power*


    In special cases battery must be highly loadable for a short time, e.g. at the
    start of diesel generators or in case of momentary power extension of PV systems.


    There are many types of batteries potentially available for use in stand-alone
    PV systems. Useful data of available batteries given in Table 2-1 shows approximated
    values and are provided as a guideline.'
