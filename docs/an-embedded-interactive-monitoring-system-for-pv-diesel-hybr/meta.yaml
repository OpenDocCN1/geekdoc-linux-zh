  md: '# E.2 GSM Modem, M20


    ![](bbox=[0.18, 0.15, 0.82, 0.53])


    # E.2.1 Feature


    +   - User-friendly integration in the system environment using commercially available
    connection components

    - Data, voice, fax and SMS services (GSM Phase II)

    - Power supply/ignition line on 6-pin Western connector (8 V to 28.8 V DC, 5%
    ripple, surge Proof to 30V)

    - Current consumption at 12V: Stand-by state (voltage is applied, ignition not
    yet asserted) I =< 0.2 mA idle mode: I < 60 mA average call in progress: peak:
    I < 2 A. (pulsed t = 577μs, at T = 4.615ms), arithmetic mean: I < 275 mA

    - Level on the V.24 interface corresponding to V.28

    - Protected V.24/V.28 interface with 9-pin SUB-D jack (screwed)

    - Mini SIM card reader with integral drawer (3V)

    - FME antenna jack (female) fed out per cable (approx. 10 cm)

    - Listener interface on 4-pin Western connector (listener parameters can be set
    with AT commands/connection of a commercially available headset)

    - Mounting from bottom or top

    - Resistant against supply voltage polarity reversal'
