  md: "# ## E.1.2 Technical data of MOPS520\n\n# ### Product Overview\n\n**MOPS/520**\
    \ is a new PC/104 CPU board which is perfectly integrated to the PC/104 product\
    \ family. It's based on AMD™ SC520 at 133 MHz speed and offers a lot additional\
    \ features!\n\nThis high integrated board offers 4xCOM, 2x USB, 1x10/100 MBit\
    \ Ethernet and PC/104+ for expansion.\n\nThe very special feature is the already\
    \ integrated 1 MBit CAN-Bus. No additional expensive extension card is needed.\n\
    \nDue to the very low power consumption the **MOPS/520** does not need active\
    \ cooling.\n\nAll MOPS PC/104 boards have equal pinouts for keyboard, COM1&2,\
    \ 44pin IDE and LPT. Easy upgrades within the Kontron PC/104 family are possible.\n\
    \nThe **MOPS/520** is available in configurations with 16, 32 or 64 MByte SDRAM\
    \ on board. In combination with our chipDISK (up to 256 MByte Flash) very rugged\
    \ and reliable systems, even for rough applications, can be realized. The on board\
    \ CAN-Bus enables easy interfacing to automation and process control tasks.\n\n\
    ...always a Jump ahead!\n\n# ### Technical Data\n\n+   - **Bus:** 16-Bit-ISA referring\
    \ to PC/104 Standard and 32-Bit-PCI-Bus for PC/104plus\n- **Processor:** AMD™\
    \ SC520-133 MHz, fanless\n- **System memory:** 16, 32 or 64 MB SDRAM onboard\n\
    - **Features:** 1 x CAN-Bus (1 MBit) with Intel® 82527 CAN-controller incl. CAN\
    \ transceiver (option)\n- **chipDISK:** Prepared to host IDE-compatible Flash\
    \ chipDISK, with up to 256 MByte\n- **Interfaces:**\n  - 3 x RS232C with FIFO\n\
    \  - 1 x COM TTL\n  - 1 x ECP/EPP parallel\n  - 1 x FDD for one drive 3,5\"\n\
    \  - 2 x USB\n  - 1 x PS/2-Mouse\n  - 1 x Local-Bus-HDD for max. two drives\n\
    \  - 1 x AT-compatible keyboard\n  - 1 x Ethernet 10/100Base-T\n- **LAN Boot:**\
    \ ✓\n- **Setup and Serial No in EEPROM:** ✓\n- **Watchdog:** ✓\n- **Dimensions:**\
    \ 96 x 90 mm (3.8 x 3.6\")\n- **Power Consumption:** 5 V, approx. 750 mA @ 100\
    \ MHz\n- **Temperature:**\n  - operation: 0° to 60°C\n  - storage: -10° to 80°C\
    \ (non condensing)\n- **Humidity:**\n  - operation: 10% to 90%\n  - storage: 5%\
    \ to 95% (non condensing)\n\n| Article | Part.-No. | Description |\n|---------|-----------|-------------|\n\
    | MOPS/520 | 01025-1600-13-1 | Low Power AMD™ SC520 133MHz, onboard 16 MByte SDRAM,\
    \ 3xRS232C, 1xTTL, 2xUSB, LPT, FDC, IDE, Ethernet (10/100) |\n| MOPS/520 | 01025-3200-13-1\
    \ | Low Power AMD™ SC520 133MHz, onboard 32 MByte SDRAM, 3xRS232C, 1xTTL, 2xUSB,\
    \ LPT, FDC, IDE, Ethernet (10/100) |\n| MOPS/520 | 01025-6400-13-3 | Low Power\
    \ AMD™ SC520 133MHz, onboard 64 MByte SDRAM, 3xRS232C, 1xTTL, 2xUSB, LPT, FDC,\
    \ IDE, Ethernet (10/100), CAN-Bus, PC/104+ |\n\nKontron Embedded Modules GmbH\n\
    Brunnwiesenstr. 16\nDE-94469 Deggendorf\n0800-saleskontron\n(0800-7253756)"
