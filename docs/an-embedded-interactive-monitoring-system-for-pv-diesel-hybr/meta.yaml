    \ load profiles. It is possible to work out as two main and several subcategories:\n\
    \n+   - *Remote electrification* (night load profile or multi user profile)\n\
    \  remote settlements on low power level (i.e. several households and schools)\n\
    \  the most common appliances are lamps, television sets and refrigerators\n\n\
    - *Professional application* (day load profile or single user profile)\n  high\
    \ reliability professional applications (i.e. workshops, hospitals, restaurants\
    \ and hotels) depending of the application, mostly appliances with high load demand\n\
    \nIn order to be able to properly size the hybrid system to provide an adequate\
    \ power supply system for a remote village, the peak power, the daily energy consumption\
    \ and the annual energy growth should be estimated according with load profile\
    \ category. This is necessary in order to size both the generating plant and the\
    \ conductor used in the distribution system. The sustainability of the system\
    \ will not be guaranteed if the capacity of the system is too small and leads\
    \ to consumer dissatisfaction. On the other side, a too large capacity would mean\
    \ additional investment costs and possibly too high tariffs.\n\nThe more reliable\
    \ approach to assess demand is to survey households in adjoining, already-electrified\
    \ areas or in a region with similar economic activities, demographics characteristics,\
    \ etc. This would assess the average initial loads per household in these areas\
    \ as well as their historical load growth. In addition, with helping of several\
    \ sizing methods and tools that are currently presented [1,6,13], the development\
    \ of hybrid system can be realizably utilized to supply the adequate power to\
