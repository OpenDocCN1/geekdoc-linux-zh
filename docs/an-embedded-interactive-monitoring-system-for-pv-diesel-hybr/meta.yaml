  md: '# Chapter 6: Conclusions


    The thesis illustrates that the embedded Linux interactive monitoring system shows
    itself to be a very suitable solution, especially in remote areas where there
    is a lack of infrastructure.


    # Outlooks


    Future work, which related to this work, should be on:


    +   - Risks such as network availability and security issues of the internet should
    also be considered.

    - The source code for both Linux and PHP are openly available and updated time
    to time, so that the monitoring system can be optimized and improved in future.

    - The Apache web server is updated from time to time, therefore it can be optimized
    and improved for the monitoring system.

    - The embedded hardware for the project still has a memory-limited storage, this
    can be considered for improving in future.

    - The new version of Sunny family inverter may need to be checked and proved before
    implementation with the monitoring system.

    - The monitoring software is implemented only with Sunny family. To apply the
    monitoring software to other types of system components, the software has to be
    extended.'
