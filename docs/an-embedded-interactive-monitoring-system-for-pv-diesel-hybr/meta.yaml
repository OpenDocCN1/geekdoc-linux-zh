  md: "# Appendix A: HTML and PHP script\n\n- If operator decide to change the configure\
    \ options after installation, just need to repeat the last three steps.\n13. Setup\
    \ php.ini file:\n    `cp php.ini-dist /usr/local/lib/php.ini`\n14. Edit the httpd.conf\
    \ to load the PHP module. The path on the right hand side of the LoadModule statement\
    \ must point to the path of the PHP module on the system.\n    For PHP 4:\n  \
    \  `LoadModule php4_module libexec/libphp4.so`\n    For PHP 5:\n    `LoadModule\
    \ php5_module libexec/libphp5.so`\n15. And in the AddModule section of httpd.conf,\
    \ somewhere under the ClearModuleList, add this:\n    For PHP 4:\n    `AddModule\
    \ mod_php4.c`\n    For PHP 5:\n    `AddModule mod_php5.c`\n16. Tell Apache to\
    \ parse certain extensions as PHP. For example, let's have Apache parse the .php\
    \ extension as PHP\n    `AddType application/x-httpd-php .php .phtml`\n    It\
    \ is also common to setup the .phps extension to show highlighted PHP source,\
    \ this can be done with:\n    `AddType application/x-httpd-php-source .phps`\n\
    Now a dynamic web server (Apache and PHP) is ready to be initialized for running\
    \ the server.\n\n# A.4.3 Initialization of Apache web server and PHP script\n\n\
    There are many possible ways to stop and restart the server. There are some typical\
    \ lines used in restarting the server, for different apache/Linux installations.\
    \ It depends on the path of system as:\n`/path/to/apachectl stop`    to stop the\
    \ server\n`/path/to/apachectl start`   to start the server\nNote that, it should\
    \ be replaced `/path/to/` with the path to the server on the system. After the\
    \ server started, it can now provide information at the server-side to the Internet-side.\
    \ The well-known method to provide information to Internet is *Hypertext Mark-Up\
    \ Language* or HTML Document."
