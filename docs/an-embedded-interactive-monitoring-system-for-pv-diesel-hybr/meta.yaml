  md: "There are four different *getty* programs: *mgetty*, *uucgetty*, *getty_em*,\
    \ and *agetty*. To choose from these must be used a program with modem dial-in.\
    \ The *agetty* is the simplest and weakest of the four and it's mainly for use\
    \ with directly connected text-terminals. The *mgetty* supports for fax and voice\
    \ mail but *Uugetty* doesn't. The *getty_em* is a simplified version of *uugetty*.\
    \ Thus *mgetty* is the best choice. The *mgetty* was written as a replacement\
    \ for *uugetty* which was in existence long before *mgetty*.\n\nModem dial-in\
    \ involves the following subsystems (see Fig. 5-7):\n\n+   1. The *mgetty* is\
    \ merely to \"pick up\" the phone when it rings and to set up the serial line.\
    \ After this, it invokes *pppd* for Internet dial-in.\n2. The *PPPd* program encapsulates\
    \ internet traffic (TCP/IP) into serial packets, which can be sent over the modem\
    \ line to the client. At the beginning of the connection, it authenticates the\
    \ user.\n   - File `/etc/ppp/pap-secrets` is the list of users allowed to login\
    \ in over modem. The password list is supplied.\n   - *PPPd* program forwards\
    \ network traffic to its final destination via internet.\n\nFigure 5-7 shows diagram\
