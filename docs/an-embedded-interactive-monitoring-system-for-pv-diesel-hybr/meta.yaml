  md: '![](bbox=[0.145, 0.085, 0.85, 0.485])


    Figure 2-8: Construction of the solar cell curve from the diode curve


    When the terminals are short-circuited ($R_{load} = 0$), the output voltage and
    the voltage across the diode is zero. According to (2-2): since $V = 0$, no current
    $I_D$ flows (point 1 in Figure 2-8) therefore the entire photocurrent $I_{ph}$
    generated from the radiation flows to the output.


    Thus the cell current has its maximum at this point with the value $I_{cell}$
    and refers to the so-called *short-circuit current* $I_{sc}$.


    ```

    $$I_{sc} = I_{cell} = I_{ph} \qquad (2\text{-}3)$$

    ```


    If the load resistance is now continually increased, the solar cell voltage also
    increases whereas the current remains constant. Up to a certain voltage value
    the current flowing through the internal diode remains negligible, thus the output
    current continues corresponding to the photocurrent (point 2 in Figure 2-8).


    Until the diode voltage threshold is exceeded after the load resistance is further
    increased, a rapidly increasing proportion of the photocurrent flows through the
    diode. This current leads to power loss in the internal diode corresponding to
    an area between the photocurrent curve and the cell current curve. Since the sum
    of the load current and the diode current must be equal to the constant photocurrent,
    the output current decreases by exactly this amount (point 3 in Figure 2-8).


    For an infinitely large load resistance (open circuit), the output current is
    then zero ($I_{cell} = 0$) and thus the entire photocurrent flows through the
    internal diode (point 4 in Figure 2-8). The *open-circuit voltage* $V_{oc}$ can
    be therefore derived again from (2-2).


    ```

    $$V_{oc} = \frac{kT}{q} \cdot ln\left(\frac{I_{ph}}{I_o} + 1\right) \qquad (2\text{-}4)$$

    ```'
