  md: "# Appendix A: HTML and PHP script\n\nhda: SunDisk SDTB-128, 15MB w/1kB Cache,\
    \ CHS=490/2/32\nIf the above information did not appear, it should be a hardware\
    \ problem. It should continue booting and then prompt for the rootdisk or cdrom.\n\
    \n4. Choose and Format of media.\n\n+   - Type in partition using backspace as\
    \ needed\n- When it asks if a partition is not done, choose no, and do partition,\
    \ then choose yes to skip.\n- Delete any existing partitions using the 'd' command\n\
    - Create a new partition using 'n'\n- The partition number should be one and the\
    \ size should be default\n- Use the 'p' command to see the partition after creating\
    \ it. It should show:\n  Command (m for help): p\n  Disk /dev/hda: 2 heads, 32\
    \ sectors, 490 cylinders\n  Units = cylinders of 64 * 512 bytes\n  Device Boot\
    \    Start   End  Blocks  Id System\n  /dev/hd1         1    490  15664  83 Linux\
    \ native\n- Use the 'w' command to save changes and 'q' to quit if needed.\n-\
    \ If the partition needs to be formatted, chose yes at the next prompt\n\n5. Choose\
    \ network install\n\n+   - Next, the installer will run the 'netconfig' command\n\
    - Answer all the questions regarding the network\n-The following should appear\
    \ after netconfig has finished:\n  eth0: Attempting TP\n  eth0: using 10Base-T\
    \ (RJ-45)\n- The installer will use ping to make sure that it can reach the selected\
    \ host\n\n6. Download the packages.\n\n+   - The installer will install some required\
    \ packages and allow the installer to choose from a list\n- After completion,\
    \ remove all floppies\n- Press the reset switch\n\nNow the hardware should boot\
    \ linux 2.4.18 (or 2.2.20) from the FLASH drive and setup for the embedded Linux\
    \ platform.\n\n# A.4.2 HTML and PHP Installation\n\nAfter the embedded platform\
    \ is ready, the web server and PHP script can be installed. To install PHP package\
    \ for website, some developing command tools in such as gcc, Makefile, are needed.\
    \ Therefore, it has to be sure that the developing command tools have been installed.\n\
    \nThis section will describe the software installation of Apace web server with\
    \ PHP script. As mentioned, the PHP script and Apache are open-source so that\
    \ it is freely available in Internet. The version of both is improving time to\
    \ time so that the version number will be omitted here by “xxx”. Following is\
    \ the installation instructor:\n\n+   1. gunzip apache_xxx.tar.gz\n2. tar -xvf\
    \ apache_xxx.tar\n3. gunzip php-xxx.tar.gz\n4. tar -xvf php-xxx.tar\n5. cd apache_xxx\n\
    6. ./configure --prefix=/www --enable-module=so\n7. make\n8. make install\n9.\
    \ cd ../php-xxx\n10. ./configure --with-mysql --with-apxs=/www/bin/apxs\n11. make\n\
    12. make install"
