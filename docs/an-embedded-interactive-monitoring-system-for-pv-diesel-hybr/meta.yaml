  md: '# ## 2.4 Energy losses of Hybrid systems


    Stand-alone PV diesel hybrid systems are designed to be totally self-sufficient
    in generating, storing and supplying electricity to the local electrical loads.
    Over time period, the energy supply and demand have to be balanced. The following
    calculation (2-14) shows the energy balance of a PV-Diesel hybrid system.


    $E_{IN} \approx E_{OUT}$ (2-14)


    where


    $E_{IN} = E_{PV} + E_{MG}$


    $E_{OUT} = E_{LOAD} + E_{LOSS}$


    $E_{PV}$ Energy generated by the PV array [kWh]


    $E_{MG}$ Energy generated by the motor generator [kWh]


    $E_{LOAD}$ Energy supplied to the load [kWh]


    $E_{LOSS}$ Energy losses [kWh]


    The energy that has to be supplied from the motor generator can be determined
    as:


    $E_{MG} = E_{LOAD} + E_{LOSS} - E_{PV}$ (2-15)


    The objective of efficient energy balance is to minimize the energy that has to
    be supplied from auxiliary energy sources. Additionally, the motor generator should
    be operated near its nominal power to achieve high fuel efficiency. As shown in
    equation 2-15, energy losses are influent the energy demand and supply of the
    system therefore it is necessary to identify the energy losses in the system in
    order to avoid those losses.


    A classification of all relevant energy losses in a stand-alone PV hybrid system
    is given as *Capture losses* and *System losses* [4]. *Capture losses* account
    for the part of the incident radiation energy that remains un-captured and which
    is therefore lost within a global energy balance. *System losses* define systematic
    energy losses that are due to the physical properties of the system components
    or the entire installation. Energy conversion losses or DC power line losses constitute
    important contributions to this category.


    # ### 2.4.1 Capture losses


    Capture or irradiation losses translate the fact that only part of the incoming
    irradiation is used for energy conversion. The losses are classified as follows:


    +   - *Shading losses*


    Losses due to shading correspond to the reduced energy received by a shaded module
    or array with respect to the un-shaded one under otherwise identical conditions.
    This direct irradiation loss can furthermore lead to mismatch losses within the
    PV generator, caused by the non-uniform irradiation distribution over the entire
    array. This phenomenon will be discussed in some more detail hereunder.'
  merge: -1
  pgno: 58
- img_proc: false
  md: "+   - *Module orientation losses*\n  Orientation losses translate the irradiation\
    \ loss caused by a module disposition other than perpendicular to the incoming\
    \ sun rays.\n  The losses can be considerably reduced by using a tracking system\
    \ that allows an automated adjustment of the module's tilt angle according to\
    \ the sun's position. Any mechanical tracking system, however, requires regular\
    \ maintenance and represents a potential reduction of the system reliability.\
    \ For this reason, tracking systems are usually not used for stand-alone PV systems\
    \ and a fixed orientation and tilt angle is chosen instead.\n\n+   - *Spectral\
    \ losses with respect to AM 1.5*\n  The module characteristics as they are given\
    \ by the manufacturer are determined at standard reference test conditions (STC),\
    \ e.g., at a standard spectrum of AM 1.5. The deviation between the available\
    \ irradiation spectrum and AM 1.5 causes the so-called spectral losses.\n\n+ \
    \  - *Reflection losses*\n  Reflection losses are irradiation losses at the surface\
    \ of the PV module where a part of the incident sunlight is reflected and therefore\
    \ lost for the energy conversion process.\n\n+   - *Surface soiling*\n  A dirty\
    \ module causes energy losses due to a reduced transmission of sunlight at the\
    \ module's surface.\n\n# 2.4.2 System losses\n\nSystem losses cover all energy\
    \ losses which occur during the conversion of incoming energy (solar irradiation,\
    \ fossil fuel) into usable AC electricity. The losses can be classified as follows.\n\
    \n+   - *Inverter and battery charger conversion losses*\n  Inverter losses are\
    \ due to the inverter's DC/AC efficiency. Since stand-alone inverters are powered\
    \ from the local DC grid the stand-by consumption is included in this category.\
    \ The battery charger's AC/DC efficiency is generally somewhat lower than the\
    \ DC/AC inverter efficiency. Note that AC/DC losses are only one part of the overall\
    \ losses generated during battery charging from an AC source; battery storage\
    \ losses (see below) and subsequent DC/AC conversion losses occur before the initially\
    \ provided energy can be consumed by an AC load.\n\n+   - *Battery storage losses*\n\
    \  Storage losses comprise all energy losses within a battery. They are described\
    \ by the charge and discharge efficiencies of the battery as well as the self-discharge\
    \ characteristics.\n\n+   - *Auxiliary generator losses*\n  The specific fuel\
    \ consumption of the auxiliary generator depends on its operating mode. The corresponding\
    \ generator efficiency defines the auxiliary generator losses with respect to\
    \ a maximum efficiency.\n\n+   - *PV-battery mismatch losses*"
  merge: -1
  pgno: 59
- img_proc: false
  md: "# Chapter 2: PV-Diesel hybrid system technology\n\nIn many stand-alone PV hybrid\
    \ systems the PV generator is directly wired to the storage battery (in particular,\
    \ this is the connection scheme of our test bed). Hence, the operating point of\
    \ the modules is defined by the actual battery voltage. PV-battery mismatch losses\
    \ are due to the difference between the actual operating voltage and the maximum\
    \ power voltage V_mpp; the PV array does not function at its maximum power point\
    \ corresponding to the given meteorological conditions.\n\nMaximum power point\
    \ tracker (MPPT) aims at reducing the PV-battery mismatch losses. However, when\
    \ using such a device, MPPT-losses due to the DC/DC conversion efficiency of the\
    \ MPP-tracker have to be considered.\n\n+   - **PV array mismatch losses**\n\n\
    \  PV array mismatch losses are caused by deviations between the shapes of the\
    \ I-V curves of interconnected modules which form the PV array. As a result the\
    \ overall power output of the array is smaller than the sum of output powers of\
    \ all individual modules at a given operating point.\n\n  PV array mismatch losses\
    \ can be of different origins: (a) differences between I-V curves do exist even\
    \ for modules of the same type. They are caused by small variations in the manufacturing\
    \ process; (b) partial shading of the PV generator does not only create mismatch\
    \ losses due to the spatial variation of the irradiation (see capture losses above)\
    \ but also due to the resulting temperature differences, leading to deviations\
    \ of the I-V curves; (d) differences in cable length and resistance of different\
    \ strings or sub arrays may cause additional mismatch losses.\n\n+   - **Wiring\
    \ losses**\n\n  Wiring losses comprise all ohmic losses between system components.\
    \ DC cable resistances, relays, switches or any other connections contribute to\
    \ this energy loss. Blocking diodes in parallel strings of the PV generator also\
    \ form part of the wiring losses. Due to the usually low AC currents compared\
    \ to DC currents, AC wiring losses can generally be neglected.\n\nFigure 2-28:\
    \ shows an energy flow diagram for a typical PV diesel hybrid system.\n\n![](bbox=[0.16,\
    \ 0.595, 0.83, 0.93])"
  merge: -1
