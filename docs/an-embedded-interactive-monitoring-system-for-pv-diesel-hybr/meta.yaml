    or specification set of work. Unlike a general-purpose computer, an embedded system
    only requires enough software to actually get a specific set of jobs done. This
    means the software requires less memory. The software can fit to the embedded
    systems that are not included a hard drive and have a limited memory storage.
    The system without hard drive can reduce energy consumption. Thus, the embedded
    system is utilized for the monitoring system.


