  md: '# Chapter 6


    # Conclusions and outlooks


    This thesis has addressed two points: the rapidly evolving technologies on electricity
    generation with photovoltaic modules and the internet web based technology for
    monitoring of PV diesel hybrid systems in remote areas.


    The thesis has illustrated that in the last decade of the 20th century the world
    market penetration of PV has been increased tremendously worldwide because PV
    can provide clean energy without environmental problems. Moreover, in remote and
    rural areas, a PV diesel hybrid system, which is a stand-alone energy system combining
    solar energy and a diesel generator with batteries for energy storage, is used
    to supply energy world wide. Because of that the provision of grid electricity
    in remote areas is often associated with higher costs to the grid supplier. Grid
    electrification in remote areas in many cases is financially inefficient particularly
    due to the low consumption in remote areas. Therefore the PV diesel hybrid system
    is very suitable for providing electricity in remote area.


    When the PV diesel hybrid system is installed, in order to keep the hybrid system
    working reliably, it is necessary to include a monitoring system. The work of
    this thesis has mainly concentrated on an interactive monitoring website of the
    PV diesel hybrid system installed in remote and rural areas.


    The interactive monitoring website proposed and investigated in the thesis is
    comprised of a monitor unit, a data acquisition unit, and a communication unit.
    The concept of the proposed interactive monitoring website is that the monitored
    data is stored in the web server at remote site. The operators can access the
    monitored data via a standard web browser and the communication link uses a standard
    GSM modem over a TCP/IP network. The interactive monitoring website allows the
    operator to download the monitored data and upload operation parameters to system
    components directly online via the website.


    The monitoring unit of the website is used to monitor the actual operation data
    of the PV diesel hybrid system. With current technology, this unit is included
    in the inverter. The Sunny family inverter from the SMA Company has been used
    for the project.


    The data acquisition unit of the monitoring website is an embedded system, which
    is a small and low-input power consumption module. As an embedded system is a
    system that has no a hard drive and has limited storage memory, an embedded system
    requires an embedded operating system, which is a set of software only to get
    a specific set of jobs done, this means the software requires less memory.


    As the advantage of open-source and freely available options, Linux is the world''s
    most advanced, progressive, and well suited for embedded operating systems. Therefore,
    an embedded Linux operating system is implemented for the interactive monitoring
    website.


    The data acquisition unit of the monitoring website includes an Apache web server,
    an interactive website, a data acquisition software, and a connection to the GSM
    modem.


    The Apache web server is a freely available source code implementation of an HTTP
    Web server. HTTP defines a simple request-response language. A web client establishes
    a connection with a web server by using HTTP.'
  merge: -1
  pgno: 114
- img_proc: false
  md: '# Chapter 6: Conclusions


    The interactive website is a dynamic website that allows the operator to view
    and download data from the website as well as input some data to the website.
    The interactive website is a combination of a HTML document and a PHP script.


    The HTML document is a script language that allows Web publishers to create complex
    pages of text and images that can be viewed by anyone else on the Web. The programmer
    can write the HTML text code to create a website to the public.


    PHP script is a widely used Open Source general-purpose scripting language that
    is especially suited for Web development and can be embedded into HTML. The main
    goal of the language is to allow web developers to write dynamically generated
    web pages.


    The thesis has illustrated that the interactive website, with a combination of
    HTML and PHP script, is suitable for the monitoring system under investigation.


    The thesis has developed an interactive monitoring website, which is a combination
    of an interactive website and a monitoring software. The operator can request
    data from the interactive monitoring website via a standard web browser. The HTML
    document will serve for the request of data from the operator. To send new parameters
    to the website, the PHP language will support this action.


    The monitoring software is written in C language. All source codes are compiled
    and linked into library of embedded Linux operating system. The software works
    compatibly with Inverter''s commands. The monitoring software sends a command
    to the inverters via RS-232 communications. The microcontrollers in the inverter
    react to a command and answer to the monitoring software. When the software receives
    an answer from the inverters it stores data into the memory at the web server
    as a text file. Name of a file is the date of monitoring.


    The implementation and its results in chapter 5 show that the interactive monitoring
    website is suitable to be utilized for a monitoring system in remote areas. The
    operator accesses the interactive monitoring website by a GSM modem. The monitoring
    data as a text file can be accessed via a standard web browser. When accessing
    the website, the operator can view and download the monitored data from the website
    as well as upload important parameters to the system.


    The operator has an ability to access the up-to-date monitored data and to change
    operation parameters online. This can improve the reliability of the hybrid system.
    The operator can be sure that the hybrid system is working and working properly.
    By analysis of the monitored data, the operator can learn the behavior of the
    system from the analysis in order to make an optimization of the system in the
    future. In addition, these advantages can also improve the public''s image of
    renewable systems, provoking their interest in the PV area.


    The results in the thesis have shown that a low input-power embedded module with
    an embedded Linux operating system can be utilized for an interactive remote monitoring
    website for a PV-diesel hybrid system. With wireless communication networks expanding,
    it is attractive to use a GSM network, which allows the data to be transmitted
    directly to the main station.


    Furthermore, because of using the open source software, the interactive monitoring
    system proposed requires very low investment cost. It requires no additional operation
    costs. There is no need for any special software at the workstations.'
  merge: -1
