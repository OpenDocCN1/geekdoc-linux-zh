    \ that enable us to communicate with each other (inside our bodies...). The more\
    \ natural or ergonomic this medium we become, the more likely we are to use it,\
    \ so we're going to use a Raspberry Pi to create a powerful version of one and\
    \ the hardware setup we set up that you can make your own version of the Pi Glove.\n\
    \n**Dan Aldred**\n Aldred is a Raspberry Pi Certified and a Lead School teacher\
    \ for CAS. He is passionate about creating and hacking projects like this to engage\
