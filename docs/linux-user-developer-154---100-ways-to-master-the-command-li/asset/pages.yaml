  md: '# OpenSource


    06 News & Opinion | 90 Q&A | 94 Your Letters


    OPEN SOURCE


    # Linux continues to boom in business markets


    # Study suggests growth for FLOSS in business operations


    The results of the 2015 North Bridge & Black Duck of Open Source Study have been
    published, and show major growth for the use of free, libre and open source (FLOSS)
    throughout the enterprise.

    Analysis of over 1,300 executives and senior IT professionals, the study revealed
    that 78 per cent respondents running some or all of their operations in open source
    only three percent claimed not to rely on open source software at all.

    “A remarkable increase in a short time,” says James Santellini of the study’s
    findings in an analysis for Opensource.com. “It’s clearly doubled over the last
    five years and has become a critical part of the way companies of all size work
    today.”


    Other key figures, which suggested that the use of open source software is on
    the rise, showed that 93 per cent of organisations had either stayed or increased
    their use of FLOSS, with only seven per cent reducing their usage, many stating
    that it is being adopted.

    From those surveyed, 64 per cent claimed to have adopted open source up from 50
    per cent in 2014 – 88 per cent expect to increase their contributions over the
    next.

    When asked why they had chosen open source software, 58 per cent of respondents
    stated that they believe it has a proven ability to scale, 43 per cent said it
    was easier to deploy than proprietary


    software and 55 per cent claimed it offered them greater security. A 50 per cent
    claimed that FLOSS enables them to find and recruit much more new talent more
    easily than would otherwise be the case.

    The hope for the future formed part of this year’s survey and the areas in which
    FLOSS is expected to make the biggest impact over the next two to three years,
    according to respondents, are growth with big data, 33 per cent and the burgeoning
    demand for things.

    “For me, the most exciting part of this year is what it holds for the future,”
    says James Santellini. “We are in the early stages of technologies that will disrupt
    every industry and change the way we work–the Internet of things, big data and
    cloud computing reaching new levels of persuasiveness, which will unlock the potential
    of these and more – areas of technology growth. And in so, we’ll see the creation
    of many new pillars of success in us.

    The full report can be downloaded from northbridge.com/open-source.


