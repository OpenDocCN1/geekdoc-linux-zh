    # # When Windows fails


    Perhaps the drive won''t boot, files are corrupted or the registry or the file
    system is broken – Linux comes to the rescue


    > We have all access to the situation where a friend or neighbour has a broken
    Windows system, has lost his data and the system has died. We know all the common
    symptoms – erratic messages, failure to boot, files not opening, Windows has slowed
    to a halt. The problem is usually blamed on a virus or a program. Sometimes the
    data is lost, and the user gets lucky with a rescue to recover and solve the issue.

    Many don''t know it well, but most of the commercially available rescue disks
    supplied by virus or security vendors are actually Linux-based. There are good
    reasons for this. A rescue typically operates an operating system that can boot
    from a CD or USB and can run entirely in RAM, which provides the scope for inspecting
    and manipulating the data drive without being repaired without infecting or affected
    by the data on the drive.


    Live distributions are ideally suited to handle the task and read, write and access
    file systems such as NTFS and FAT, for without being restricted by Windows permissions
    or drivers. This is because a live disk is suited for retrieving and repairing
    files on broken Windows systems. With Linux systems, you can easily browse their
    Windows disks using programs like TestDisk, Defrag, or Genius.


    Some kind of data corruption is serious and requires special tools, but which
    will fix the file system better than an operating system, from scratch. In such
    cases the use of a specialised Rescue Kit is overkill and all you need is a small
    Linux distribution to boot from a USB stick, a business card or a DVD, run entirely
    in amounts of RAM, and on older PCs with limited disk space and less memory –
    a distro that will lightly fly across the system and copy and paste the files
    to be saved.


    There are several Linux distros that are specifically designed for this purposes
    – primarily act as repair and data retrieval tools to boot and fix the files of
    your system, or to recover from redundant equipment, such as SystemRescue, the
    Trinity Rescue Kit or the Ubuntu Remix. They are useful to recover deleted or
    damaged partitions in Linux, or to restore and restore broken systems.


    But as often not, a copy of Puppy Linux will do the job you want to work your
    box from boot, so that you can work on the move. Puppy can run in your computer''s
    memory from a USB stick instead of on a memory stick. It provides improvements
    to the tools to the memory stick, such as GParted and file/CD, or without exploit
    to recover your data from a broken Windows installation and easily resize partitions
    and edit the disk table as well.


    For more detailed operations The Sleuth is capable of sleuthing and enables you
    to inspect deleted hard drives and recover files from them. The Sleuth is suited
    for forensic operations and allows the investigator to examine every file without
    any intrusive approach. But the tools do not run on the operating system to process
    the file systems, and hidden content is shown. But of course, some of the tools
    are better than all others on the market.


    More data recovery is achieved through such derescue for recovering large volumes
    of data, or PhotoRec for media files, which can be downloaded and added to your
    rescue toolkit. Utilities for interacting with Windows, like amount of interest,
    is a set of tools which can create, resize, clone, defrag or manipulate Windows
    NTFS file systems with varying degrees of specification. It cannot be denied:
    when Windows goes wrong, It is Linux, that comes


