    # Council clashes


    I''m wondering if you could shed light on the recent facts in Ubuntuland, the
    announcement that the Ubuntu Community asked Jonathan to step down from his position
    as leader of Kubuntu and I am having trouble understanding what has actually happened.
    Thank you very much advance.


    Oliver


    It''s a thorny story, and at the time of writing, I cannot say everything. Essentially,
    Jonathan (who holds no formal position) has been involved with the Ubuntu Community
    since December 2019, and I am happy to answer your questions about Canonical''s
    intellectual property policy (please see bit.ly/xxxxx) and community policy. The
    events between 2012 and 2013 are not accounted for by the UK.


    The KC requested specific information on exactly when Jonathan had voiced the
    complaint, stating that there was no such evidence and that he was mistaken. A
    response was received by the 19th of March. Matt Schubert then met Jonathan in
    person to explain to Jonathan that he was not wanted and that they were asking
    him to no longer recognise him as the leader of the Kubuntu code.


    This was followed by a protracted exchange between members of the KC, if not all
    of them, which then led to further exchanges with members of the UCC, and the
    issue grew into two-points: the KC clashed with the dispute regarding Ubuntu,
    and Jonathan also took the issue that the Code of Conduct is being used behind
    doors and does not meet the CoC If he is removed from position.


    They asked Jonathan to step aside his KC leadership for a period of twelve months
    in order to gain some perspective on the issue, at which point the KC railed Jonathan.


    Most of the conversation was in person and they tried to resolve the thing, but
    these times have failed (please see bit.ly/xxxxx). Both parties seem to agree
    that Jonathan is concerned about the policy on funding matters were necessary,
    and so large it really does not come to view that two organisations and people
    interact with each other.


