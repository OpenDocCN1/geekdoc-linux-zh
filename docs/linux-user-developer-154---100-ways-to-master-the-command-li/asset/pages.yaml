  md: '# DNF is an improvement over Yum, using the dependency solver hawkey and librepo
    for repo operations and package groups


    For a full breakdown of Yum/DNF differences, check out http://dnf.readthedocs.org/latest/cli_vs_yum.html


    Perhaps the biggest change in Fedora 22 is the replacement of its package manager
    Yum with DNF, which uses the dependency solver hawkey and librepo for repo operations
    and package groups. DNF will also skip over updates and reports that don''t without
    hurting the operating engine. It also simplifies the command line and will also
    remove deprecated packages that were not installed lately. For users, Yum is still
    aliased and you can use it to run any command, but then the DNF equivalent of
    your operation will run, which is handy.


    Some great changes have also been brought to Fedora by DNF 3.16 - chiefly, the
    new notification system. Notifications are now displayed at the top-center of
    the screen and have been integrated into the calendar popover or all at once.
    Another nice touch is the terminal


    notifies you long-running jobs are complete. GNOME Shell and other themes now
    have a number badge on the icon that this way of resolving conflicts and placement
    works, through to more integration between different desktop environments, so
    apps from other environments feel more native. Files have a toolbar that lets
    sort and order, and you can now send files to the trash using the Delete key without
    having to hold shift. The new scroll bar is slimmer and minimal, designed to keep
    you out of the way, it only appears at the edge of your windows to indicate further
    content, and there''s a pulse when you hit the top or bottom, of all which are
    small but welcome touches that enhance your user experience.


    # Pros


    The new GNOME 3.16 features and the DNF package manager are improved, and the
    three additions are well likely to please users


    # Cons


    It''s hard to say this - it''s a solid improvement on Fedora 22 and the switch
    to DNF is well implemented


    # Summary


    Virtualisation brings across all editors of Fedora 22 and DNF is a worthy successor
    to Yum. Factoring in the subtle changes and many de-new features, this release
    is an excellent progression for the distro.


