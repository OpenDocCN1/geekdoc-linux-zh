    \ only do the minimum amount to get the performance you need. Any extra work is\
    \ wasted, unless it is a learning opportunity.\n\nand move the computational content\
    \ from Python to C. If you can't shift to C, then you can try to see if there\
    \ is a way to object items. If so, Python must do type checking on every call\
    \ around the loop. This means that your code is being handled in Python, change\
    \ the form of the called method, and finally reduce this overhead by assigning\
    \ these classes to a new name before entering the loop. All of this type of checking\
    \ is done once outside the loop. See the following code:\n\nstructure that NumPy\
    \ provides for the array. Array is like a list, except that it contains only elements\
    \ of the same type, and it is built in C so everything is built within NumPy.\
    \ Arrays are treated as a single data element, so type checks only to happen once\
    \ for the entire array, which is what allows you to run through the elements so\
    \ quickly. In regular Python, you would use a loop like:\n\n```\nfor index in\
    \ range(50):\n    c[index] = a[index]\n```\n\nwhere a and b are vectors of length\
    \ 50. In this case, every time you run through the loop for a[index] and b[index],\
    \ there is a bit of overhead. By using NumPy and the provided array data functions,\
    \ you can reduce this by:\n\n```\nc = a + b\n```\n\nThis makes the code much cleaner.\
    \ It only involves a single type of element, so you can see whether a and b can\
    \ be added. The actual operation is then passed off to a C library, which is built\
    \ from linear algebra libraries like BLAS and LAPACK. This provides a substantial\
    \ speed increase because you can take advantage of all the optimisation that NumPy\
    \ provides.\n\nJoey Bramer\nnis a true menace to the amount of Python. He works\
    \ with researchers on scientific computing problems and Android.\n\nWhy Python?\n\
    It's the language of the revolution. Read the docs at python.org/\n\nThe first\
    \ item to look at is how strings are handled. Strings are immutable of characters.\
    \ This means that when you want to change a string, you must make a new string\
    \ and copy the old data into the new memory. If you are programmatically building\
    \ large pieces of text, copying of the text can be expensive in memory. Using\
    \ a list is much faster.\n\n```\nfor word in list:\n    list.append(word)\n```\n\
    \ncan be replaced with more efficient code:\n\n```\nappend = list.append\nfor\
    \ word in list:\n    append(word)\n```\n\nThis type of checking also happens when\
    \ you use any Python function or operator. If you use the + operator, Python has\
    \ to check the types of the operands and then add them together for every call\
    \ of v = +. If you use a multiplication it happens a very lot times in a loop,\
    \ it might be the best way to look at solutions that significantly reduce data\
    \ entries to remove these checks. While dynamic typing is a strong strength of\
    \ Python, you may need to avoid it in order to get the performance-critical code.\n\
    \n```\nstr = []\nfor word in list:\n    str.append(word)\n```\n\n...you use:\n\
    \n```\nstr = ''.join(list)\n```\n\nIf you are doing numerical work, you need to\
    \ start using NumPy. NumPy arrays are functionally equivalent to lists but significantly\
    \ improve the performance of Python code to the level of Fortran. The main NumPy\
    \ features are provided by fixing data types, as this is very important. After\
