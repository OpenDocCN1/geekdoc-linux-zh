    \ time to work through the wires. First, you need to connect the wire to the popper\
    \ pinning the other end through the glove. Once, close the two poppers together,\
    \ the wire is secured-in. This is easier if you turn each glove finger inside-out\
    \ and then push the popper through. The key part of this step is to ensure that\
    \ the we deays connected.\n\n+   **What you'll need**\n* Raspberry Pi A+\n* Clothes\
    \ poppers\n* USB cable ties\n* Glove\n* USB battery charger\n* Pi camera module\n\
