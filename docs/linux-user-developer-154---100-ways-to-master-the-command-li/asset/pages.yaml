  md: "# Build a Pi Glove\n\n![](img/572ad2c12aa08801c9a4044d6a88fdc5_70_0.png)\n\n\
    ## Full code listing\n###TCODRG Test Version###\n###Glove Button Test ###\n###Project\
    \ New York###\n\nimport time\nimport random\nimport os\nimport sys\nimport subprocess\n\
    import RPi.GPIO as GPIO\nfrom sys import import, exit\n\n#### Setup the GPIO Pin\
    \ ####\nGPIO.setmode(GPIO.BCM)\n\n#### Set the pins to high ####\nGPIO.cleanup()\n\
    GPIO.setup(4, GPIO.IN, GPIO.PUD_UP) #11 on the BOARD\nGPIO.setup(17, GPIO.IN,\
    \ GPIO.PUD_UP) #12 on the BOARD\nGPIO.setup(7, GPIO.IN, GPIO.PUD_UP) #21 on the\
    \ BOARD\nGPIO.setup(22, GPIO.IN, GPIO.PUD_UP) # on the BOARD\nGPIO.setup(5, GPIO.OUT)\
    \ # of other pins\n\nwhile True:\n    if GPIO.input(4) == 0:\n        print \"\
    you pressed button one\"\n\n    if GPIO.input(17) == 0:\n        print \"you pressed\
    \ button two\"\n\n    if GPIO.input(7) == 0:\n        print \"you pressed button\
    \ three\"\n\n    if GPIO.input(22) == 0:\n        print \"you pressed button four\"\
    \n\nAbove We're using the brilliant Wi-Fi dongle from The Pi Hut, which you can\
    \ get for just £6: bit.ly/1lfhcgZ\n\n15 Disable the Wi-Fi power management\nIf\
    \ left idle, the power management system on the Raspberry Pi may drop the Wi-Fi\
    \ connection - this may be, for example, occur if the glove is out of range of\
    \ the router. To disable the power management, load the terminal window and:\n\
    \n```\nsudo /etc/network/interfaces\n```\n\nAt the end of the code, add the following\
    \ line:\n\n+   - wireless-power off\n\nThis will ensure that the Wi-Fi stays connected\
    \ whilst xrange.\n16 A simple test program\nNow you have completed the hardware\
    \ section of the Pi Glove, you can use a simple program to test the connections\
    \ and make sure all the sensors are working correctly and responding to your thumbs\
    \ and fingers. Download the file from Fileux.co. Run sudo in a terminal to open\
    \ the Python editor, then start a new file and insert the code with your Pi Glove.\
    \ Save and run it.\n\n17 Run the code\nThe program will respond to each of the\
    \ fingers and the thumb, and display a message stating that the respective button\
    \ has been pressed like so: ‘one has been pressed, ‘two has been pressed, etc;\
    \ if this fails, check for the following errors: are the GPIO pins, 2 loose wires\
    \ not in contact with the thumbs, and finger not in contact. You may now cover\
    \ how to develop a program that brings control to your fingertips.\n\nwww.linuxuser.co.uk\
