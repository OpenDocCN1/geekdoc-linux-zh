  md: "# A more Pythonic method to use classes and objects. You can write a script\
    \ that defines a class that contains method\n\nmore obscure technique than is\
    \ to use the xrange command. If you use a list, you occupy memory handled by the\
    \ integer object. The xrange command provides the list that is created and stored\
    \ in memory; a generator, however, allows you to walk through each of the elements.\
    \ It does exactly what you want it to: it generates the elements as they are needed.\
    \ This means that you do not use memory at any particular time. Also, when you\
    \ do not want the entire list to be created for a loop that has thousand cycles,\
    \ or potentially millions, then using xrange can provide a significant speed boost.\
    \ In a file, you might also want to avoid the overhead of reading. Reading from\
    \ a hard drive can be slow, so load the file into memory. This means that you\
    \ should load as much of a file as you reasonably fit into your RAM in a single\
    \ operation, rather than line by line.\n\nwithin Python. As an example, you can\
    \ use Cython to optimise C code and make it available within Python programs.\
    \ Other languages are used in high performance applications. There are several\
    \ cases, where the algorithm available in Python is not easily translated to efficient\
    \ C code. In these cases, you have the tools to work within your own code. We\
    \ will be looking at this particular technique in greater detail next month. The\
    \ last thing is that at least, Python is an interpreted language, which means\
    \ that it is slower than running machine code. On the hardware, the bottleneck\
    \ is often the\n\nIf of these techniques don't work, then you can always move\
    \ to a different language and use this alternate code\n\nNow we have looked at\
    \ different ways of speeding up your code, hopefully this will give you the tools\
    \ to make things faster with Python. Not long ago, these techniques were - the\
    \ only way to get work done. The resources were not compared to modern standards.\
    \ With more thought, computational work can be optimized. 'premature optimisation'\
    \ is the root of all evil, and so you should invest your time where it will have\
    \ the greatest impact.\n\nWhile we have the ability to use an alternate language\
    \ within Python - Cython, for example - you can get optimised and still stay with\
    \ pure Python code. Numba provides a JIT inline-compiler that lets you install\
    \ the module, and you can import your Python code to optimize it with the following:\n\
    \nfrom numba import decorator, @jit that tells Numba to compile the function code.\
    \ Every time the function is called, the machine code is executed in the virtual\
    \ machine. Numba needs to check the types of any input variables and generate\
    \ appropriate code for each version of the compiled code. Also, you avoid the\
    \ overhead involved in getting the information from the runtime. If you know what\
    \ data types are being passed in, for example, you will have something like:\n\
    \n```\n@jit(int32,int32,int32)\ndef fv(x, y):\n    return x + y\n```\n\nThis version\
    \ is all you need. Numba uses lazy compilation so only the relevant function is\
    \ compiled. This way, only the parts of code that you actually need go through\
    \ the overhead of compilation. You can use this code of to save time at runtime.\
    \ There are limits on data types that can be supported, but it is worth it to\
    \ save you time if you give it a try. This will show you the benefits of a traditional\
    \ compiled language, while staying within Python.\n\n![](img/572ad2c12aa08801c9a4044d6a88fdc5_72_0.png)\n\
    \nFOR MORE PYTHON BOOKS, CHECK OUT THE Python BOOK ON SALE ONLINE FROM AMAZON\
