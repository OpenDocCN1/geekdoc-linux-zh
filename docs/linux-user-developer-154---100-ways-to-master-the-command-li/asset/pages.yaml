  md: '# Android VNC


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_64_0.png)


    # Full code


    FileSilo.co


    # Look up the resolution of your Android device and modify the line used to start
    up the server


    The first time you turn it on, you will have to set a password you need to pick
    a password you can remember as it will also be used by the client as it connects
    via VNC. You can use a maximum of eight characters for the password, so think
    about how you want to make it secure.


    # Running slow


    If you find that running is a bit too slow for your liking, changing the resolution
    might make it easier. If that''s still not helping, your network connection may
    be the issue.


    # 02 Install the software


    We''re going to use TightVNC for our VNC we need - specifically, the server side
    of things. We need to install it first, so back to the terminal and use:


    ```

    $ sudo apt-get install tightvnc

    ```


    You may have to run a setting things or as it asks, hit ''yes'' (or ''y'') to
    finish them.


    # 03 Start VNC


    Once everything''s installed we can quickly start up the VNC server - it might
    be a good idea to do so and make sure it''s working. Let''s do a test run with
    the following:


    ```

    $ vncserver -geometry 640x480 -depth 16 -pixelformat rgb555

    ```


    As long as everything is installed, it should start without any problems at.


    # 05 Stop and restart


    As TightVNC doesn''t work like a normal service, you can''t use a service restart
    (or equivalent) to turn it off or whatever you want. In instead, if you want to
    restart it, you''ll have to manually turn it off and restart it with the original
    command. To to use:


    ```

    $ vncserver -kill :1

    ```


    ... replacing with the display number that you originally created.


    # 06 Correct resolution


    If you create a server with a resolution of 640x480, just to get it going. Luckily,
    this is unlikely to be the resolution of your phone. This resolution is not fixed
    every time, so the best thing to do is to look up the resolution of your Android
    device and modify the line used to start the server. For example, if you use a
    1080p tablet, you would use:


    ```

    $ vncserver -geometry 1920x1080 -depth 16 -pixelformat rgb555

    ```


