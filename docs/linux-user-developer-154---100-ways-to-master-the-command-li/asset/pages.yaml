  md: '# # New features

    in Fedora 22


    # ## New-task-specific builds


    The Fedora Project offers three free builds each tailored to specific tasks: Fedora
    Workstation for desktop and development, Fedora Server for traditional platforms,
    and Fedora Cloud for virtualization. All three were trialed with Fedora Next,
    on which Fedora 22 is primarily based.


    # ## Improved notifications


    Fedora Workstation now benefits from an improved notifications system at the top
    bar. New notifications present a small dot near the click, which can be ticked
    to pop up all notifications and dismiss them individually or in bulk.


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_6_0.png)


    # ## Boxes for easier use


    Boxes, the stock application for virtual machines and containers, now has an improved
    interface and now includes an improved box creation assistant, to allow the user
    to send keyboard shortcuts and display scaling for an improved experience.


    # ## Builder IDE integration


    Fedora Workstation now includes an integrated development environment for GNOME:
    Builder IDE. Builder includes Markdown preview, API documentation documentation
    and project creation, as well as handling support.


    # ## 5-annual releases


    From Fedora 22 onwards, the project follows an annual release schedule a more
    rapid development cycle than previous. As such, Red Hat will be using Fedora as
    a platform to integrate new technologies into.


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_6_1.png)


