    # Importing with Kinect


    First you will have to start up the Qt Creator. A new project of type Qt Application.
    One project must be extended by the following segment, which includes the Kinect
    library and functions to compile in x86 mode:


    ```

    // QT = code

    greThan(QT_MAJOR_VERSION, 4), QT = << widgets

    TARGET = ImageKinect

    TEMPLATE = main

    CONFIG += 186

    DEFINES = USE_FREinect

    LIBS = -lfinect

    ```


    Finect provides a simple interface which will be implemented here by hand to start
    our sensor. We will enclose the logic in a class called KinectHost. It must be
    derived from QThread and have the following structure:


    ```

    class KinectHost:public QThread


    QOBJECT

    ```


    ```

    public:

    KinectHost(QObject* parent);

    -KinectHost();

    void run();

    void initialize(void* depth);

    void initialize(void* video);

    void setColor(void* data);

    void getColor(void* data);


    protected:

    QMutex* myMutex;

    static KinectHost* selfRef;

    FinectContext* myContext;

    FinectDevice* myDevice;

    unsigned short* myBuffer;

    unsigned short* myBuffer;

    bool myDepth;

    n};

    ```


    Here we define all the signals that are emitted from the sensor. We provide two
    pointers that act as data storage for the Finect library. Finally, two flags ''myDepth''
    and ''myColor'' are implemented. We will use them in their role in a few seconds.


    # Working with Finect


    Initializing Finect is a relatively simple procedure with some classic issues.
    To get started use finectinit to allocate memory. Next, setLevel is invoked -
    it specifies the amount of information to the standard output. When this is done,
    Open Device is used to activate the Kinect connected to the machine.


    ```

    KinectHost(QObject* parent):

    (Thread(parent))

    myMutex(new QMutex);

    selfRef=this;

    myDepthTake=myColorTake=false;

    If(finect_init(&myContext,NULL))

    {

    dDebug() << "Could not initialize:";

    }

    finect_set_log_level(myContext,FREINCT_LOG_WARNING);

    ```


    Scanning distance

    Objects need to be kept at a specific distance from the sensor to be sensed using
    distance diagrams. Kinect for Windows is also available to reduce the range using
    the limited hardware used.


