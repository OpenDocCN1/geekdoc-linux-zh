    \ female-to-female jetty wires, select one and remove the insulation. This can\
    \ be done by applying a little pressure on the plastic cover – you can use your\
    \ teeth but it's better to use a set of pliers! The end will now consist of a\
    \ small metal spike. Prepare the other wires using the same method.\n\n+   **02\
