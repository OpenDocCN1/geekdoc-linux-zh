  md: '# INSTALLATION


    >_032 Debian: update repositories

    Debian-based (Ubuntu-based) distros use apt-get as the package manager. One of
    the quirks of apt-get is that package manager that is before installing or upgrading
    software. Check to see if there is a newer version in the repositories. Before
    any installation in Debian:


    ```

    $ apt-get update

    ```


    >_033 Debian: install software

    Unlike a package manager or software centre, you can''t search for the kind of
    packages you want to install, so you need to know the package name before installing.
    Once you do through, then:


    ```

    $ apt-get install [package]

    ```


    >_034 Debian: update software

    You can update the software in Debian by first updating the repository lists.
    Use apt-get update, followed by the upgrade command:


    ```

    $ apt-get upgrade

    ```


    >_035 Debian: uninstall software

    As of package manager, apt-get enables you to uninstall software. This is simply
    done by removing with the same command that you used to install it. You can also
    purge remove if you want to delete any config files along with it.


    ```

    $ apt-get remove [package]

    ```


    >_036 Debian: upgrade distro

    Debian distros can offer to update to a newer version, especially when you prompt
    it or if there''s a new release available. You can do it in the terminal with:


    ```

    $ apt-get upgrade

    ```


    >_037 Debian: multiple packages

    A very simple thing is that you can install on all platforms once by listing multiple
    packages to install at once with the normal installation command. So in Debian
    it would be:


    ```

    $ apt-get install package1 package2 package3

    ```


    >_Managing your packages and of updating your system is a part of the command
    line


    >_038 Debian: dependencies

    Compiling differs from software so they''ll have a guide on how to go about it.
    If you face a problem is that it will stop until you find and install the dependency.
    You can also get it by using auto-apt with different configuration:


    ```

    $ sudo apt-auto-run /config

    ```


    >_039 Debian: force install

    apt-get will install it if specific requirements aren''t met (usually in terms
    of other dependencies needed to be installed for the software to work). You can
    force the installation by using:


    ```

    $ dpkg -i

    ```


    >_040 Debian: install binary

    In Tip, we use dpkg to install the binary installer that you downloaded from the
    repositories. This same can be used to install any downloaded binary, either from
    the


    >_041 Debian: force install package

    If the advice in Tip 39 is still not working, you can force install with dpkg.
    To do this you need to add the --force-option to the installation to ignore any
    problems, like


    ```

    $ dpkg --force- [option]

    ```


    >_042 Red Hat: update software

    Unlike apt-get, the package manager for Red Hat/Fedora-based distros does not
    use the same repositories. You can update all the software repositories using
    yum:


    >_043 Red Hat: install software

    Installing with yum is as simple, as long as you know the package name. Yum does
    some search facilities, but if you really need to look it up, but you know what
    package you want, use the command:


    ```

    $ sudo yum install package

    ```


    >_044 Red Hat: uninstall software

    Yum can be used to uninstall any package that you have on your system, whether
    installed directly from yum or not. As long as you know the package name you can
    uninstall:


    ```

    $ sudo yum remove package

    ```


    >_045 Red Hat: force install

    The force install function on Red Hat and Fedora-based distros requires that you
    have a package downloaded and ready to install. You can download it with yum and
    then force the


    ```

    $ sudo yum install --download --directory={} package

    $ sudo rpm -vh --force package

    ```


    >_046 Red Hat: install manual

    RPM is the package manager for Red Hat and it can be used to install packages
    manually. You can do something like in Tip 45 and download the package from the
    internet, or download it from the internet with


    >_047 Red Hat: force manual installation

    In Tip 45, you can use RPM to install packages if there''s a dependency or something
    wrong with other packages that have been installed. This should be used in Tip
    45, with the -wh and --options options.


    >_048 Fedora: update distribution

    Yum has its own own distribution update, but only in Fedora and when you prefer
    not to use it. If you have you can use the fedora-upgrade package in yum:


    ```

    $ sudo yum install fedora-upgrade

    ```


