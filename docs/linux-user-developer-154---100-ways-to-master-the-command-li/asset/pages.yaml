  md: '# Feature Master command line


    # MEDIA CONTROLS


    # BEST OF THE REST


    > >You can control your tunes while inside the terminal


    > >All the other commands that you might want to know for future reference


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_21_0.png)


    +   >082 Open files in terminal


    +   >087 Move back forth pushd


    If you''ve got a file you can see in a graphical file manager, instead of opening
    a terminal and navigating to there and executing the file or script, you can usually
    run it directly. To do this you just need to right-click and select a ''name in
    terminal'' option.


    Following on Tip B6; if you want to start moving back up the stack to the first
    directory, you can use popd in the terminal. You can change which directories
    have stacked up by using the dirs command.


    +   >078 Pause music


    +   >083 Process priorities


    Some audio players have command line controls. Rhythm has and it''s a cool thing
    to use when you''re stuck in the terminal and need to pause your music for a moment.
    You can do this by:


    CPU priority for processes can be seen running from -20 for highest priority or
    +20 for lowest. Putting "n X" in front of any command enables you to change the
    priority from 0 to whatever number X is standing in. Only sudo or root can change
    the priority of a process, but anyone can set one or lower.


    ```

    $ rhythm --client

    ```


    +   >084 Locate files in terminal


    +   >089 Download via the terminal


    The command line doesn''t have as much interface as you can get, however, it can
    do next track. You can try it with the command below:


    Similar to list, a newer tool works slightly different to find. While also has
    ways to search for files by name, size, and other it only uses the name to locate,
    however it can do so much faster. Use it with:


    If you need to download something from the internet, you''ll want to use wget.
    It''s much faster to download it directly into your current location in the terminal
    (as long as you have permission to do so). Use it:


    ```

    $ skip

    ```


    ```

    $ rhythm --next

    ```


    ```

    $ locate

    ```


    ```

    $ wget http://example.com/file.zip

    ```


    +   >080 Pause video


    +   >085 Current location


    +   >086 Move directories


    You can use Mplayer to control the command line to. It''s good for testing a video
    with different settings that you can affect. You can also control the video with
    keys - specifically, you can pause using the space bar:


    In the terminal you find yourself a little lost in the filesystem, or you want
    an easy way to put your current location into something else. You can use pwd.


    When moving between directories you might be able to quickly back to the previous
    one you were using. Instead of cd for every directory, you can use pushd to move
    and create a ''stack'' of directories to move between.


    +   >081 More video control


    Mplayer has a few more controls than playing in the terminal. You can use Enter
    to skip the next item in the list, and otherwise, you can stop playback by using
    Ctrl+C to end the process.'
