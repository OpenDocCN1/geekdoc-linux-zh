  md: '# Ras Pi upgrades


    # Movement for your camera rig


    # Pi-Pan Pan Tilt Mechanism


    £45.99 / $39.99


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_54_0.png)


    The camera module on the opposite of the page are some pretty essential upgrades
    to have in your Raspberry Pi toolbox, but what happens if you want to move the
    camera around to get a different viewpoint? This would be useful in multitude
    of projects, such as a robot with an interactive interface (many IP cameras designed
    for security applications already have a pan-tilt feature, in fact);


    The Pi-Pan Open Electronics is a pan-tilt mechanism that lets your camera move
    by an impressive 110 degrees from top to bottom and 180 degrees from left to right.
    The set includes a combination of hardware and software, the servo motors required
    for the actuation and movement hardware for the camera. On the software side,
    there are libraries in Python and Scratch which is easily enough for most projects.


    One of the most impressive applications you could use for this is an OpenCV-based
    motion detection and face tracking. Check out the openelectronics.com forum for
    it links like a truly great project to try (libjpl.xle).


