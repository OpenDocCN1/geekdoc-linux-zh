  md: '# Tutorial RAID array


    # Build a RAID array


    Use RAID to create faster and more secure storage systems in your PC or server


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_37_0.png)


    It appears that we''re currently seeing a plateau on storage in hard drives. We''re
    well up to about 6 TB in storage on 4 TB drives have been in circulation for years
    now. Lucky the jump from 4 to 6 TB is larger than the doubling storage – there
    is still a lot of data, after all – but it is always, files are getting larger
    amassed more and more data.


    # Hard drive selection


    For all the different versions of RAID we''ll be using, at the storage – so you
    you least need to use hard drives with the exact storage – if you have one 2 TB
    hard drive, they''d need to all be 2 TB. Using drives with the same size allows
    read and write operation to be replicated over each drive of the system. This
    means drives must be exactly same size for the files to be written properly. Using
    with the same size and model of hard drive to get the best experience out of RAID
    is recommended for this task. Not only does it allow for even greater parity between
    the hard drives, it also makes it easier to replace any broken drives in the array.
    As for write speed, as long as all the drives have the same speed (the same model
    of drives), there are no problems with 5400, 7200 or any other speed of hard drive
    you have.


    There have been methods in existence for a long time now to pool multiple resources
    in order to create larger storage solutions – the benefits of which normally increase
    read and write speed as well as large storage sections.


    In this tutorial we will teach you everything you need to set up your own RAID
    array. This involves not only doing it via hardware RAID, but also a software
    RAID in Linux. We will show how to know when actually selecting hard drives, which
    RAID levels you should use and at what the benefits of them are.


    # Resources


    mdadm

    weil.brown.name/blog/mdadm


    # Hardware RAID


    support


