  md: '# Setting up a software RAID


    To set up a software RAID, you first need to make sure that all of your hard drives
    are installed into your system. For this example, we''re already have Linux set
    up on a completely different hard drive, but you can use similar settings to create
    the RAID in a live disk to install. Boot into Linux and use the terminal to finish.


    First of all we need to figure out which hard drives are called on our system,
    so use fdisk -l to get a list of their addresses (e.g., /dev/sda, /dev/sdc). Note
    them down and we can then set up RAIDs.


    RAID 0:


    ```

    # mdadm --create --verbose /dev/md0 --level=0

    -raid-devices=2 /dev/sdb /dev/sdc

    ```


    RAID 1:


    ```

    # mdadm --create --verbose /dev/md0 --level=mirror

    -raid-devices=2 /dev/sdb /dev/sdc

    ```


    RAID 10:


    ```

    # mdadm --create --verbose /dev/md0 --level=10

    -raid-devices=4 /dev/sda4 /dev/sdb /dev/sdc /dev/sd1

    ```


    RAID 5:


    ```

    # mdadm --create --verbose /dev/md0 --level=5

    -raid-devices=3 /dev/sdb /dev/sdc /dev/sd1

    ```


    > Setting up a software RAID is supported by Linux at the kernel, and can allow
    for more flexibility


    RAID 6:


    ```

    # mdadm --create --verbose /dev/md0 --level=6

    -raid-devices=4 /dev/sdb /dev/sdc /dev/sd1 /dev/sd2

    ```


    Save and format


    Once you''re happy with the array (or arrays) you have created, then you need
    to save it. This is how you do it on Ubuntu:


    ```

    # mdadm --detail --scan >> /etc/mdadm.conf

    ```


    On other rests with this:


    ```

    # mdadm --scan /etc/mdadm.conf

    ```


    Run /proc/mdstat to see which arrays are listed in the file, and it should have
    the format you''ve just set up. If it''s not there, then you need to add it by
    using the command line or edit the /etc/fstab file so it mounts at boot, and your
    RAID is complete! You won''t have to worry about erasing anything anymore. It''s
    also worth diggin into the man page for mdadm to learn how you can use it to manage
    your RAID in the future, and keep it in condition.


    JBOD

    A much simpler alternative to RAID is JBOD, or Just Bunch of Disks. If you want
    to increase your storage capacity and split it across the drives, this works perfectly.
    You only lose the files that were on the failed drive, but without needing a replacement.


