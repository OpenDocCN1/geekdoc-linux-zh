  md: '# Set up users and permissions


    After you have ERPNext installed and the basic data filled, the next important
    thing is to set up the users and their permissions in the system. ERPNext uses
    a role-based permission system, so you can assign permissions according to the
    role. To add new users, go to Users/Permissions. Once you click on the user link,
    you''ll have the user list visible. Click on the New button in the top-left corner.
    Note that only the first name and email are mandatory. Click Save after you have
    entered the details. The page redirects you to the user details pages, where you
    can set the roles for the user. You also have options to set the security details,
    password, third party authentication and iron.


    > ERPNext offers the complete spectrum of resource management tools, from CRM
    and HR to asset management and accounting


    ```

    # wget https://raw.githubusercontent.com/frappe/

    bench/master/install/setup_frappe.sh

    sudo bash setup_frappe.sh --setup-production

    ```


    # System settings


    The next step is to personalise the setup. Go to Settings, where you will find
    all available settings. The first is System Settings, which allows you to set
    up the language, date and time and more. Select ShowHide Modules, which will be
    visible on the home page when you use it. The next is Naming Series, where you
    set the naming series for transactions on the system. If you set the settings
    for journal entries as...


    # Import the data


    If you already have some ERP-related data from a previous installation or list,
    you can easily import it. Just go to Setup/Data Import to import CSV files, and
    follow the instructions.


