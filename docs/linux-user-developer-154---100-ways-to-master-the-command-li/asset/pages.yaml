    # ## 021 Readable storage size


    One of the details is that ls -l displays the size of the files that are located
    on the hard drive. This is done in bytes though, which is not always useful. You
    can have this parse to become more legible by simply changing the -l to -h, where
    the long-listing format (-l) is tweaked with the human-readable option (-h).


