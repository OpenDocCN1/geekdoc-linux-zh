    # Choosing a RAID type


    RAID comes in different types, each numbered and starting from 0. The higher number,
    the more complex the system will be (apart from RAID 10, which is a common abbreviation
    of RAID 1+0, will be covered in a moment). Choosing a RAID type depends on your
    needs, and the importance of preserving the data that will be stored on the drives.


    For most uses, RAID 0 and RAID 1 techniques are the best. They allow you to increase
    read speed or create a larger drive than any single drive. However, any failure
    can be easily fixed by using just multiple drives and RAID 6 allows for more storage
    while still having the levels of redundancy and backup up to that of the lower
    levels.


    # RAID 1


    | RAID 0 | RAID 1 |

    |---|---|

    | A1 | A1 |

    | A2 | A2 |

    | A3 | A3 |

    | A4 | A4 |

    | A5 | A6 |

    | A7 | A8 |


    > The dangers


    RAID 0 is similar to RAID 1 you can use, however no version of them has problems
    when trying to expand or upgrade in general. The RAIDs are really expensive to
    perform, and it can fail but mirroring keep it alive very well.


    | Disk 0 | Disk 2 | Disk 3 |


    # Striping and mirroring


    # Powers combined


    At core, RAID 0 allows you to join two drives of the same size or use the storage
    of both to create one larger drive than any single drive can. It is simple and
    such, which is illustrated as stripes. The benefit you get from RAID 0 is speed,
    however if one drive failure you will lose all data.


    RAID 1 is about instead of increasing the size of one hard drive by combining
    them, you create a dedicated backup for the hard drive with each piece of data
    twice. Speed increases as before, although write speed is the same as any one
    drive (the RAID array deals with duplicating the data once it''s written).


    RAID 0 and 1 can be combined into RAID 10, which offers both mirroring and stripping.
    It requires at least four drives to work, and always needs to be an even of hard
    drives.


    By having pairs of hard drives that are paired as RAID 1 (mirroring), with each
    set combined with RAID 0 (striping). This nested RAID allows for both speed and
    write performance of RAID 0, the same, with the redundancy and backups of RAID
    1. If one hard drive fails, it can be easily replaced in order to get the array
    back.


    This is the simplest way to increase storage capacity of any array, while also
    having a way to recover from hard drive failure. However, it is the most inefficient
    use of the space compared to some of the higher RAIDs. Generally, though, this
    setup could be good at home desktops and even on home servers.


