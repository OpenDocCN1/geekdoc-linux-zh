  md: "# OPINION CODING\n\n# Finding anagrams\n\nLearn with word signatures, and tackling\
    \ problems by identifying sub-problems\n\n> Today we will focus on anagrams.\n\
    You probably already know that an anagram of a given word is a different word\
    \ that has exactly the same letters as the original. Word anagrams have many applications,\
    \ including dictionaries, word processors, computer games, crosswords, spelling\
    \ checking and more. Apart from the practice, the whole problem is a good exercise\
    \ for the mind because it introduces you to see the word from the right perspective\
    \ before trying to solve it.\n\nNow you have to sort the letters of the @sign\
    \ array.\nPlease note that @sign can contain any letter times as them (word, anagram)\
    \ pairs.\nA simple run of the complete perm wordsignature.pl produces the following\
    \ output:\n\nThe problem is greatly simplified by introducing the concept of word\
    \ signatures. Words are the building blocks of anagrams because words with the\
    \ same signature are anagrams. If you choose a signature, all its anagrams are\
    \ your signature.\n\n```\n$ /wordsSignature.pl\ngive a string-persistent\nsignature\
    \ of the string is einpersist.\n```\n\nIf you do not use signatures, a solution\
    \ would be very difficult, inefficient and complex. If you try to solve the problem\
    \ by finding all permutations of the letters in a given word, you will well fail\
    \ miserably or delay a solution that might appear rather late. A word with ten\
    \ letters has (factorial!) possible permutations, which means the permutations\
    \ would require many lookups to a dictionary, delaying the process ever more.\n\
    \nTo implement this solution, you need to find word signatures for the dictionary\
    \ file usually found in /share/dict/ on Linux systems or similar. Then, you can\
    \ use the signature to find the correct misspelled word.\n\nThe presented code\
    \ will be in Perl because it is easier for you to try and implement in C or C++\
    \ as an exercise. As an exercise, you will see the code of the column from how\
    \ you can solve the problem using anagrams.\n\nIt is now time to look at the AW\
    \ implementation. The AW script will show how it works. The AW script will return\
    \ you the sign from an input file which can be seen in the following output:\n\
    \nThe following code does the most of the job as it separates the letters of a\
    \ word and puts them into a new variable named @sign\n\n```\n$ gawk -f anagram.awk\
    \ file_with_words\nThe signature of the word is\nThe signature of that is\n```\n\
    \n```\nfor (i = 0; i < length($word); i++) {\n    @sign = split($word, @sign,\
    \ \"\"); }\n```\n\nThe script run using GNU AWK 4.01 is an improved version of\
    \ the AW implementation. Not only is the AW script processing the input file without\
    \ requiring any extra effort? However, the greatest advantage of AW is that it\
    \ makes you write code without records or function calls. So don't underestimate\
    \ the power of the AW programming language.\n\nRemember that you should simplify\
    \ the original problem by transforming it into a simpler one. Where anagrams are\
    \ concerned, the original problem is equal to two sub-problems: calculating a\
    \ signature and selecting with the same signature.\n\nYou can find the source\
