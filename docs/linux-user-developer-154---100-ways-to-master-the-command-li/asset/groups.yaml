    much everything, electronic parts have become even more commodified

    and, arguably, this is filtering down to display technology as well. Now

    have have a wealth of offerings from your standard monochrome LCD to TFT,

    LED and AMOLED displays.


    One of the most exciting and disruptive display technologies of recent

    times is ePaper/ink. You probably know it as the screens that your Kindle

    readers or MobiFun use, the refreshable display is commonly referred

    to an epaper watch, it actually uses a

    Memory Card and a very clever marketing tactic. You might have wondered in

    the past why your iPad lasts five hours on a charge but the answer is that the
    e-ink

    dis only uses power to update what is on the screen, which means for a


    large number of applications where you don''t need to change

    contents often, it saves a lot of battery. It could be used for

    reading novels, shopping lists or for static

    displays, digital price tags, bus train station signage and many

    other applications, it is by far the best choice.


    PaPiRus is the low power epaper display technology you know

    lo the Raspberry Pi. In a hat-compatible format with screen sizes

