    # Linux media centres


    Q: What''s the difference between Kodi and MyTV?


    A: Kodi and MyTV work very differently, although they can both perform similar
    tasks. MyTV requires a back-end server that enables it to power front-end clients
    with media, Kodi is more focused on recording content from TV. Kodi will run without
    any assistance from a server and in playing video files. There''s a less setup
    required with Kodi, if you''re using it on more than one TV there won''t be any
    difference between them.


    Q: What is the best way to use a Kodi box?


    A: Kodi can be installed as a desktop application, however the best way is to
    use Kodi distros such as OpenELEC or LibreELEC We recommend using a small, in-one
    PC or even a Raspberry Pi.


    Q: How can I get NetFlix?


    A: There is an add-on called XBMC that grants access to all the features of Netflix,
    which is fully featured as the web interface or other official interfaces. So
    you can still get it, but with a few extra efforts if you want to use Kodi and
    Netflix.


