  - '[PAGE 31]


    # # Tutorial


    # # ERPNext


    +   - Show/ Hide feature

    - ERPNext enables you to manage the applications you show on the home page, to
    keep the interface uncluttered. Hide All Applications and a list of the applications
    by checking and unchecking the checkbox. The applications will be removed from
    the page.


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_0.png)


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_1.png)


    04 Price Lists

    All products and items that you need to procure, or the finished products that
    your organisation sells, have prices associated with them. Now, prices are no
    longer just the function of cost; there are other factors demand and shipping
    costs. In a dynamic scenario it is aligned to set different parameters. Frankly,
    ERPNext supports price lists and you can easily access price lists under the Buying/Selling/Setup/Price
    sections. Go to see the list of price lists, there are two default lists already
    available.


    06 Make a brand

    Branding is very important aspect of a business. As they say, act even if you
    are small. So, it is important to get your brand communicate with an external
    entity. ERPNext has a feature called Print Format that will help you achieve this.
    Print format defines the format for a document type. You can customize the layout
    and it automatically takes the form in Print Format. To get started, go to Setup>Printing
    and Print Format to add a new print format. Click on the New button in the editor.
    On the next page, select the document type for which this print format is, you
    will need to write the HTML for the format, you can use the Bootstrap CSS framework
    and you template designer designer.


    Now click the button in the top-left corner. Fill in the details and tick the
    selecting checkbox of the type. Click Save and you will see the new price list
    listed.


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_2.png)


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_3.png)


    05 Workflow

    Workflows are an integral part of an organisation, and ERPNext lets you define
    in this area. Let''s see how to implement workflows based on roles: the first
    thing to note is that workflows are applicable to document type in ERPNext, so
    you need to know the document on which your workflow will be based. Go to Setup>Workflow,
    then click on the New workflow button. Next, enter the workflow name and the document
    type. You will need to set the states of the workflow, which are allowed to edit
    the workflow in that state. For example, in a typical application workflow the
    states will be either approved, pending or rejected (the default states are available,
    you are allowed to add new workflow states by editing the row). The next step
    is to add the transition rules, which are the steps that change the state of the
    workflow - for example, the transition will change the state of application from
    pending to approved.


    07 Buy

    With the background set, let''s handle the basic business functions by selling
    products. In an enterprise you will need to manage these two things and ERPNext
    needs to do that. On the home page, click on Buying. The first option is under
    Suppliers -> Supplier - this works as the supplier database, so you can add suppliers
    here. Once you click New, you can create purchase orders, receipts and invoices
    aligned with their basic info, contact details and communication. This one-step
    process covers everything related to suppliers. Next is the Material List to help
    you list what requests for a raw material, and Supplier Quotation and Purchase
    Order follow. This is the easiest way to find or add the list of raw materials
    that you need to procure. Also, note that there are a few options here where Contact
    is accessible via different sections, so if you make changes in one place then
    they will be visible everywhere as well.


