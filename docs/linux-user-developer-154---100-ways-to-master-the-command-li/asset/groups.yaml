  mdcn: '


    # 设置软件 RAID


    要设置软件 RAID，你首先需要确保所有的硬盘都已安装在你的系统中。在本例中，我们已经在另一块完全不同的硬盘上安装了 Linux，但你可以使用相似的设置在
    Linux 启动盘（live disk）中创建 RAID 以进行安装。启动进入 Linux 并使用终端完成操作。


    首先，我们需要确定系统中的哪些硬盘被标识出来，因此请使用 `fdisk -l` 获取它们的地址列表（例如 `/dev/sda`, `/dev/sdc`）。将它们记录下来，然后就可以设置
    RAID 了。


    RAID 0:


    ```bash

    # mdadm --create --verbose /dev/md0 --level=0

    -raid-devices=2 /dev/sdb /dev/sdc

    ```


    RAID 1:


    ```bash

    # mdadm --create --verbose /dev/md0 --level=mirror

    -raid-devices=2 /dev/sdb /dev/sdc

    ```


    RAID 10:


    ```bash

    # mdadm --create --verbose /dev/md0 --level=10

    -raid-devices=4 /dev/sda4 /dev/sdb /dev/sdc /dev/sd1

    ```


    RAID 5:


    ```bash

    # mdadm --create --verbose /dev/md0 --level=5

    -raid-devices=3 /dev/sdb /dev/sdc /dev/sd1

    ```


    > 设置软件 RAID 在 Linux 内核层受支持，并且可以提供更大的灵活性


    RAID 6:


    ```bash

    # mdadm --create --verbose /dev/md0 --level=6

    -raid-devices=4 /dev/sdb /dev/sdc /dev/sd1 /dev/sd2

    ```


    ## 保存并格式化


    一旦你对创建的阵列（或多个阵列）满意，你就需要保存它。在 Ubuntu 上的方法如下：


    ```bash

    # mdadm --detail --scan >> /etc/mdadm.conf

    ```


    在具有此功能的其他系统中：


    ```bash

    # mdadm --scan /etc/mdadm.conf

    ```


    运行 `/proc/mdstat` 查看文件中列出了哪些阵列，它应该符合你刚刚设置的格式。如果那里没有，那么你需要使用命令行添加它，或者编辑 `/etc/fstab`
    文件以便在启动时挂载，这样你的 RAID 就完成了！你再也不必担心擦除任何东西了。值得深入研究 `mdadm` 的 man 页面，学习未来如何使用它来管理你的
    RAID 并保持其状态。


    ## JBOD


    RAID 的一种更简单的替代方案是 JBOD，即“一组磁盘”（Just Bunch of Disks）。如果你想增加存储容量并将其分布在硬盘上，这种方法非常完美。你只会丢失故障硬盘上的文件，而不需要更换硬盘。


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_40_0.png)


    # Kinect 教程


    # 在 Linux 下使用你的 Kinect


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_41_0.png)


    ### 微软 Kinect 传感器提供了采集深度和颜色的便捷方法


    几年前，微软的 Kinect 曾非常风靡。随着时间的流逝带走了演示和追随者，第二代传感器已上市。在最初发布几年后，现在是时候看看 Kinect 实际上能做什么了。


