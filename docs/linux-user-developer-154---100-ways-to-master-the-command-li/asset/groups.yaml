    # 机器人


    # PiBorg UltraBorg


    为树莓派项目设计，可扩展的 UltraBorg 是否履行了它的承诺，还是让我们失望？PiBorg 为兼容树莓派的设计，适用于任何可以与 I2C 通信的微型计算机或微控制器（包括主
    Arduino），其设计目标只有一个：绝大多数爱好者级的项目使用脉冲宽度调制 (PWM) 来驱动机器人部件，以及使用超声波传感器（通过发送噪声脉冲并监听回声来测量与固体的距离）。结合起来，这可以帮助构建从简单的双轮机器人到更复杂的机械手臂，甚至在...辅助下实现计算机视觉


    | 类型 | |

    | --- | --- |

    | 扩展板 (非 HAT) | 处理器为 PIC16F1827-I/SL |

    | 驱动器 | 东芝 16 位 I2C TC620272FNG |

    | 输出 | 4x SV PWM (兼容伺服器)，4x 数字 (超声波传感器) |

    | 电源 | 使用伺服器需要 5V，不包含 |

    | 价格 | 15.99 美元起（约 25 元） |

    | 购买途径 | pborg.org |


    如果你想构建各种方面的东西，UltraBorg 是构建机器人爱好者的终极一站式商店。该板分为四组：第一组为各种传感器提供输入支持并输出 PWM 控制的伺服器。总而言之，这对于一个相当熟练的机器人已经足够，但如果你需要更多
    UltraBorg 来提供额外的输入和输出通道，一个方便的功能仅限于每块板的 DTS 间距引脚。


    [第 80 页]


    # 虽然它可以让你处理相机方面的工作，但 UltraB 被定位为初学机器人爱好者的终极一站式设备


    > PiBorg 之上是拖拖拖的 Doodleboard 后面


    UltraB 是一个奇妙的设备，其尺寸适合在一个块板上结合输入和输出的挑战，事实确实如此。对于机器人项目，链式连接将非常简单。然而，与市场上其他竞争选项相比，它相当昂贵。


    UltraB 安装在顶部 (HAT) 引脚上，设计时考虑了背夹式安装。板 上的螺丝孔使其能够连接到 XBorg Module 或原始的 B 上。如果你想使用不同的微控制器或控制器，这些孔也可以用于安装该设备。


