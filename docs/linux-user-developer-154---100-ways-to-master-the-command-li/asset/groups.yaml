    \ `wget`。直接下载到终端当前位置要快得多（只要你有权限这样做）。使用它：\n\n```bash\n$ find\n```\n\n```bash\n\
    $ wget http://example.com/file\n```\n\n- >080 暂停播放 \n- >085 当前位置\n- >086 往回移动\n\
