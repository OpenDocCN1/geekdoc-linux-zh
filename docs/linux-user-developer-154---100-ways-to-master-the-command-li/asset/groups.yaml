    # 07 Hardware RAID


    By the better way to set up a RAID array on a hardware level, then Linux with
    a single hard drive. It can use the normal levels. You can then depend on the
    RAID that your motherboard or RAID controller supports. Not all RAID arrays have
    Linux drivers either, so you need to get the right card for the job.


    Setting up a RAID in this way is usually dependent on what kind of card or BIOS
    you use. You''ll first need to install the drives when the system is off or for
    RAID setup during the POST post when you use the system. Refer to the manual for
    your motherboard or card for more details.


    Once that''s complete, you''ll all need to format the drive in Linux to use it.


    Above the parity blocks are indicated by the subscript (p and q) in these diagrams


    # 05 Block-level stripping


    RAID 6, which uses two big RAID arrays and advanced calculations to create parity
    across your drives, allowing you to use more of the data space across your drives.


    RAID 5 requires a minimum of three drives. If one or two drives die, the data
    is still available even across the hard drives, which this block acts as a backup
    of drives and allows for calculations of how to recover the lost data.


    RAID 6 requires a minimum of four drives and introduces the complexity of parity
    stripping; parity blocks are split over two drives for increased security against
    hard drive failures. It comes at the expense of the extra storage you would get
    in a RAID 5, and write speed does not increase over normal drives.


    # 06 Other RAID levels


    There are other RAID levels, however these and the combinations of them are the
    most common and useful out of them. RAID 2 and 3 have excellent transfer rates
    but are optimised for one operation at a time, and cannot handle requests very
    well - these kinds of arrays are recommended for video editors that require the
    reading and writing of large files often.


    # 08 Software RAID


    Setting up software RAID is supported by Linux at the kernel level, and can allow
    for more flexibility in handling as it supports all the above RAID types we''ve
    discussed without requiring any special hardware (other than the hard drives)
    to add to your system.


