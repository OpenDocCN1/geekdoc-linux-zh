    观点


    # # 内核专栏


    Jon Masters 带来关于 Linux 4.1 结束的最新动态，4.2 合并的准备工作已经开始


    > Linus Torvalds 发布了 4.1rc7 Linux 候选版本（Release Candidate），并指出事情正在“良好地平静下来”，正如人们对内核开发周期结束时预期的那样。


    通常情况下，RC7 是新版本发布前的最后一个版本。Linux 指出“没有什么东西需要真正重新思考了。然而，有几个回归问题（regression）给某些人（尤其是
    Dell 用户）带来了麻烦”。结合 Linux 即将到来的家庭假期，意味着 RC7 的出现恰恰及时，他现在将为 Linux 4.2 开发的“合并窗口”向后推迟了一周。


    兼容性仍然是首要任务，因为供应商们对难以证明的软件（尤其是 Dell 笔记本电脑）趋之若渴。


    系统厂商对 Windows 的这种关注遇到了了由这些相同平台供应商提供的各种 API 代码——被称为 AML（AML 机器语言）。然而，AML 代码具有许多在技术上违反
    API 标准但在 Windows 系统上可以运行的功能。事实上，情况变得更糟。供应商经常在代码中包含操作系统的测试，以引起对 Linux 的关注。从表面上看，这是非常好的（能够实现规避方案），但不需要要求每个
    RC 版本都实现这些方案。


    Linux 通常表现良好，坚持它自己的平台，而不向现实妥协。最近的一个例子是，当一个值被传递到一个期望版本 3 的函数时，Windows 总是报告为 API
    规范版本 2，而技术上，它现在传递的是版本 6。该平台允许 AML 代码去调试并非基于 Linux 的事宜。


    # ## 4.1 与 Windows 兼容性


    Linux 4.1 开发关注的回归问题之一是关于 x86 架构上的内核。（ACPI（高级配置和数据接口）为现代平台、台式机和服务器提供了一个抽象平台。它允许内核在包含各种类型硬件的平台上运行，并能够在内核中运行的（解释性）代码各个方面控制硬件功能，例如处理如何将
    Linux 用于控制 Windows 上存在的各种非枚举硬件设备。例如，内核将如何处理 Windows 系统上的 PCI 根复合体（Root complex）。当它正常工作时，效果很好，但随后就会
    Windows 兼容性的小问题。


    # ### Jon Masters


    Jon Masters 是一位 Linux 内核黑客，从事 Linux 领域已超过十年。他曾在马萨诸塞大学就读过大学，现在住在加利福尼亚，负责能源高效 ARM
    驱动服务器的标准设计。


