    用于 UNIX 的 Kinect 驱动程序在 `freenect` 项目中开发。在旧版本的 Ubuntu 上工作时，需要使用自定义的 PPA 来获取较新版本的库。这很重要，因为
    2011 年 2 月的版本中发生了二进制兼容性破坏。我们的示例使用了新的 `liblinux` API，无法用第一个版本进行编译：




