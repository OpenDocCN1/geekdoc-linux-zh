    *Some terminal tricks for devs to help your command line skills become more efficient*


    - **049 Search for a term**

    The basic use of grep is to search through a file for a specific term. It will
    print out every line that contains the term. You can also use it with multiple
    files with content. Use with:


    - **050 Check for lines**

    Looking for specific lines in a file is hard to start to hunt when you realize
    the file is hundreds of lines and you realise it by using grep to print out all
    the lines you find. You have the notion:

    ```bash

    grep -n hello

    ```


    - **051 Regular expressions**

    If you need to make more advanced searches, you can use grep expressions. You
    can use regular expressions like ^hello to look for lines that start with hello,
    or hello$ for lines ending in hello:


    - **052 Wildcards**

    When searching for characters, you can use wildcards to find similar terms. This
    is done by using a full stop in the search string each stop represents one wildcard.
    Searching for h.a will return any line with h followed by a in the string. You
    can use it like:

    ```bash

    grep "h.a"

    ```

    You''ll be able to find something without beginning with a specific string but
    with no length. You can do this in grep by using an asterisk (*) with the dot.
    In the above example, we would have used h*o.


    - **054 Stop a system service**

    A system service is kind of background software that launches at startup. These
    are managed by the system management daemons and can be controlled from the terminal
    with the service command. If you need to stop a:

    ```bash

    sudo service stop name

    ```


    - **055 Start a system service**

    You can start services that have been stopped by using the same command. As long
    as you have the permissions, you can start:

    ```bash

    sudo service start name

    ```


    - **056 Restart a service**

    This is one way of setting up web servers, which may need to be restarted. Instead
