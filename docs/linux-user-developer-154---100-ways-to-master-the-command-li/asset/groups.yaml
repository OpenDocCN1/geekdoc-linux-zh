    # 06 纠正分辨率


    如果你只是为了启动创建一个分辨率为 640x480 的服务器。幸运的是，这个分辨率并不是固定的，所以最好的办法是查询你的 Android 设备的分分辨率并修改用于启动的行。例如，如果你使用
