    \ 表示目录，`-` 表示普通文件。其余字符实际上是三个为一组的，解释方式如下：\n\n# 修改权限\n\n根据上述断言，如果你想更改文件权限，可以开始编辑。你可以通过分配一个数字将三位组视为二进制来设置所有权限。你可以像这样操作：\n\
    \n```bash\n$ chmod 777 file\n```\n\n第一个数字用于用户，第二个用于用户组，第三个用于所有人：数字如下：\n\n- 7:\
    \ 读和执行，111/rwx\n- 6: 读和写，110/rw-\n- 5: 读和执行，101/r-x\n- 4: 读，100/r-\n- 3: 读和执行，011/-w-\n\
    - 2: 写和执行，010/-wx\n- 1: 执行，001/--x\n- 0: 无，000/---\n\n> 要向 x 显示发送命令，请在命令前缀加上 `DISPLAY=\"\
    :0\"`\n\n![](img/572ad2c12aa08801c9a4044d6a88fdc5_20_0.png)\n\n# 功能主（命令行）\n\n\
    # 媒体控制\n\n# 优中之选\n\n> >你可以在终端内部控制你的音乐\n\n> > 所有你为了以后参考可能想要了解的其他命令\n\n![](img/572ad2c12aa08801c9a4044d6a88fdc5_21_0.png)\n\
    \n- >082 在终端中打开文件\n- >087 往回移动 pushd\n\n如果你在图形化文件管理器中看到一个文件，与其打开终端并导航到那里执行该文件或脚本，你通常可以直接运行它。要做到这一点，只需右键点击并选择“在终端中打开”选项。\n\
    \n接提示 B6；如果你想开始移动回第一个目录，你可以在终端中使用 `popd`。你可以使用 `dirs` 命令更改哪些目录堆叠在栈中。\n\n- >078\
    \ 暂停音乐\n- >083 进程优先级\n\n某些音频播放器具有命令行控制。Rhythm 就具有，当你卡在终端里需要暂时暂停音乐时，使用它是一个很酷的事。你可以通过进程优先级来实现，运行的优先级范围从\
    \ 7（最高）到 0（最低）。只有 sudo 或 root 才能更改进程的优先级，但任何人都可以设置一个。\n\n```bash\n$ rhythm --client\n\
    ```\n\n- >084 在终端中定位文件\n- >089 通过终端下载\n\n命令行没有像你可以有那么多界面，但它可以实现以下操作。类似于 `list`，一个较新的工具\
