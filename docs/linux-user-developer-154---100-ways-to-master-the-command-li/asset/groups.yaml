    # ROBOTICS


    # PiBorg UltraBorg


    Designed for Raspberry Pi projects, does the expandable UltraBorg deliver on its
    promises or let us know? Designed for the Raspberry Pi compatible with any microcomputer
    or microcontroller that can speak I2C—including primary Arduino—PiBorg is built
    with one task in mind: The majority of hobbyist-level projects use pulse width
    modulation (PWM) to move the robotic parts, and ultrasonic sensors, which send
    out a pulse of noise and listen back to the echo to measure distance to solid
    objects. Combined, this helps you build everything from a simple two-wheel robot
    to a more complex robotic arm, or even computer vision, aided by


    | Type | |

    | --- | --- |

    | Add-On Board (Non-HAT) | Processor PIC16F1827-I/SL |

    | Driver | Toshiba 16-bit I2C TC620272FNG |

    | Outputs | 4x SV PWM (Servo-compatible), 4x Digital (Ultrasonic Sensor) |

    | Power Supply | 5V required for servo use, not included |

    | Price | From $15.99 ($25 approx) |

    | Available from | pborg.org |


    If you want to build various side of things, the UltraBorg is the ultimate one-stop-shop
    for building robotists. The board is split into four groups: the first group provides
    input support for various sensors and output PWM-controlled servos. All told,
    that''s enough for a reasonably proficient robot, but if you need more UltraBorg
    together to provide additional input and output channels, a handy feature terminated
    only by the DTS-spacing pins per board.


    [PAGE 80]


    # While it can keep you the camera side of things, the UltraB is positioned as
    the ultimate one-stop device for budding roboticists


    > Above PiBorg is behind the caravan-towing Doodleboard


    The UltraB is a marvelous device, with a size that fits both challenges of combining
    both input and output one-board makes that it is. For the robotics projects, and
    the daisy-chaining it will be simple. However, it is quite expensive compared
    to other options in the competition that''s available.


    The UltraB is mounted on the Top (HAT) header, it is designed with piggyback mounting
    in mind. Screw holes on the board enable it to be attached to the XBorg Module
    or the original B. These same holes can also be used to mount the device if you
    wish use a different microcontroller or controller.


