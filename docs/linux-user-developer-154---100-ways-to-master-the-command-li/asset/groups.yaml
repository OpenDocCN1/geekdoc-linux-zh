    # Tutorial VPN server


    # Create your own VPN server


    # Dial into your own network from anywhere to anywhere to access your files and
    browse the Internet freely


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_25_0.png)


    **Rob Zetselsoot**

    master complex systems and is a web developer proficient in Python, Django and
    PHP.

    He loves computing.


    **Resources**

    OpenVPN

    openvpn.net


    The use of VPNs is actually quite common around the world for a number of reasons.
    Companies do enable their employees to dial into their office network and access
    relevant files and software. Individuals do dial into their own personal as well
    as being able to use their own Internet connection to access online material that
    may be restricted if they are using a hotel''s Internet, for example.


    In this tutorial we will show you how to set up your own VPN server within your
    own network using the excellent OpenVPN software. As long as you have a system
    that can keep up for 24 hours a day, this will be very useful for you. We are
    doing tutorial on Ubuntu 14.04, but it will be easy to modify for most other systems.


    # Initial setup


    We''re doing this on an Ubuntu machine, but everything we do will be translatable
    to other systems and servers. Our soon-to-be-VPN server, you need to start by
    installing software with:


    ```

    $ sudo apt-get install openvpn-easyrsa

    ```


    Once that''s done we need to get the example setup for us to work from and modify
    by doing:


    ```

    $ sudo gunzip -c /usr/share/doc/openvpn/examples/sample-config-files/server.conf.gz
    > /etc/openvpn/server.conf

    ```


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_25_1.png)


    # Edit the config file


    ## Sample OpenVPN 2.0 config file for multihost server.


    ### This file is for the server side

    # works for one server

    # OpenVPN configuration.


    OpenVPN also supports:

    # single-client single-machine

    # multiple clients see many pages

    # on the web for more info.


    ### This config should work on windows or or linux systems. Remember to use

    # double backslashes, e.g.

    # "C:\path\openvpn\server.conf"


    ### Comments are preceded with ''#'' or ''''''\''''

    # listen on (optional)

    # listen (optional)?


    ### Which local address should OpenVPN

    # tcp/udp port should listen on?

    # on the same machine, or for multiple machines? Then you will need to open up
    this port on your firewall.


    | Get Help | Read File | Edit Next Page | Cut Text | Copy To |

    |---|---|---|---|---|


    # Edit the config file


    We''re going to start the config file example just by opening it first in nano
    /etc/openvpn/server.conf. Then change the following:


    ```

    /dh284.pem to /dh284.pem

    ```


    Remove the comment from "push "redirect-gateway"; bypass-dhcp; Uncomment the following
    lines:


    ```

    push "dhcp-opt DNS 208.67.222"

    push "dhcp-opt DNS 208.67.222"

    ```


    ... and finally, uncomment the following two lines before saving and exit:


    ```

    user nobody

    group nobody

    ```


    # Forward


    We can now use edit to forward the settings to the computer we are connecting
    from. We can do this by running the following command:


    ```

    echo 1 >/proc/sys/net4/ip_forward

    ```


    We need to edit sysctl.conf, open it up in nano /etc/sysctl.conf. Once edited,
    we need to the line below and remove the comment (#) so it looks like:


    ```

    net.ipv4.forward=1

    ```


    Then save and exit. We''re doing this on an Ubuntu machine, but everything will
    be translatable to other systems. unanticipated firewall OpenVPN in 14.04 is uncomplicated
    as ufw is installed by name is going to allow OpenVPN to connect through the following
    commands: Possible clients You can use OpenVPN to connect to the VPN server and
    on other systems if you want to quickly set up the server. Remember that you will
    always be connected to each client.


    # Make the rules how to make some rules for the IP assigned. To this, we need
    to open up rules using nano at /etc/ufw/rules, and add the following paragraph:


    ```

    # START RULES

    POSTROUTING ACCEPT -s 10.8.0/24 -o eth0 - MASQUERADE

    # END RULES

    ```


    Instructions are found at the end of the commented in server.conf.


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_26_0.png)


    # Tutorial VPN server


    # Create new keys


    If you want to keep keys for different purposes then you can just rename them
    and you want to keep the keys for the Client so that you don''t worry getting
    clashes within the system.


    # Enable the firewall


    Once you''ve saved these new settings you can enable ufw. To do this in the terminal
    you''ll want to it will ask you if you really want to enable which you type yes
    to confirm. It will inherit all of the settings you''ve modified and added, which
    will enable you to reroute traffic from a client system.


    ```

    ufw enable

    ```


    # Check the firewall status


    You can check the status of the firewall at any time it will let you whether it
    is on or not what rules are currently taken on and when.


    # Install Certificates


    We need to be able to generate and authenticate certificates for both the server
    and client to enable secure communication between the two. To do this, we set
    a Certificate Authority. By copying the RSA keys we created over:


    ```

    cp -r /usr/share/easy-rsa/ /etc/openvpn

    ... then create the following directory for key storage:

    /etc/openvpn/rsa-keys.

    ```


    If you wish to give it a different name, you''ll have to editing the OpenVPN config
    files that reference server key and client key. For now, we will refer to it as
    server and you can change it if you wish.


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_27_0.png)


    # Generate parameters


    We need to generate a Diffie-Hellman parameter for encrypted keys over a public
    network and everyone for us. To this, you''ll need to type the following command
    into the terminal:


    ```

