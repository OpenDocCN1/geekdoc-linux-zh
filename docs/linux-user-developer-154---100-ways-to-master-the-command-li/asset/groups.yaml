    # Tutorial ERPNext


    ## Manage your business resources with ERPNext


    Learn how to use the open source ERPNext to efficiently manage your business


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_29_0.png)


    **Nitish Tiwari** is a software developer and open source enthusiast. He speaks
    at conferences as well as writing for various magazines, and he helps firms adopt
    open source software for their business needs.


    Lean is the buzzword of this century – all the organisations, whether big or small,
    want to do more and better things in less time with fewer resources. While this
    is easy to say, to cut and get right is hard for small enterprises when taken
    alone. Why is it not possible to move in the direction you want? There is not
    a single reason, for the biggest challenge is that in the initial stages of a
    company, people focus more on growth and on planning, leading to add extra hires
    and resources.


    ### 01 Installation


    ERPNext can be installed in the installation type best suited to your use case.
    The first and probably the easiest way to install ERPNext is by downloading the
    VirtualBox image and running it on VirtualBox. VirtualBox is an open source virtualisation
    tool backed by Oracle. It is available for almost all the major platforms (Windows,
    Mac, Linux). So, you can install VirtualBox on your system and then boot the ERPNext
    VirtualBox image, access http://localhost:8080 via the browser, log in with the
    credentials (admin and password).


    When companies grow bigger and recognise that they need to manage resources, it
    is too late. So why not plan ahead and grow organically?


    We will explore how the open source ERPNext helps you manage resources in your
    company. It doesn''t matter whether you have a small or big business – everyone
    needs to manage resources. ERPNext offers spectrum of resource tools from CRM
    and HR to asset management and accounting. We use Ubuntu 14.04 LTS as the host
    and software from the ERPNext repository.


    The other way to install ERPNext is via the automated script at GitHub. Just open
    the command prompt and type the following commands:


    ```bash

    wget https://raw.githubusercontent.com/frappe/bench/master/install/setup_frappe.sh

    sudo bash setup_frappe.sh --production

    ```


    Below the home page looks minimalistic and the options are hidden under different
    sections ![](img/572ad2c12aa08801c9a4044d6a88fdc5_29_1.png)


    ## Set up users and permissions


    After you have ERPNext installed and the basic data filled, the next important
    thing is to set up the users and their permissions in the system. ERPNext uses
    role-based permission system, so you can assign permissions according to role.
    To add new users, go to Users/Permissions. Once you click on the user link, you''ll
    have the user list. Click on the New button in the top-left corner. Note that
    only name and email are mandatory. Click Save after you have entered the details.
    The page redirects you to user details where you can set roles for the user. You
    also have options to set security details, password third party authentication.


    ## System settings


    The next step is to personalise the setup. Go to Settings, where you will find
    all available settings. The first is System Settings, which allows you to set
    up language, date and time. Select Modules which will be visible on the home page.
    The next is Naming Series, where you set naming series for transactions.


    ## Import the data


    If you already have some ERP-related data from a previous installation or list,
    you can easily import it. Just go to Setup/Data Import to import CSV files and
    follow the instructions ![](img/572ad2c12aa08801c9a4044d6a88fdc5_30_0.png)


    # Tutorial ERPNext


    ## Show/Hide feature


    ERPNext enables you to manage the applications you show on the home page to keep
    the interface uncluttered. Hide All Applications by checking and unchecking the
    checkbox. The applications will be removed from the page ![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_0.png)
    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_1.png)


    ## 04 Price Lists


    All products and items that you need to procure, or the finished products that
    your organisation sells, have prices associated with them. Now prices are no longer
    just the function of cost; there are other factors demand and shipping costs.
    In a dynamic scenario it is aligned to set different parameters. ERPNext supports
    price lists and you can easily access them under Buying/Selling/Setup/Price sections.
    Go to see the list of price lists, there are two default lists available.


    ## 06 Make a brand


    Branding is very important aspect of a business. As they say, even if you are
    small, it is important to get your brand communicate with external entity. ERPNext
    has a feature called Print Format that will help you achieve this. Print format
    defines the format for a document type. You can customize the layout and it automatically
    takes the form in Print Format. To get started, go to Setup>Printing and Print
    Format to add a new print format. Click on the New button in the editor. On the
    next page, select the document type for which this print format is, you will need
    to write the HTML for the format, you can use the Bootstrap CSS framework and
    template designer. Now click the button in the top-left corner. Fill in the details
    and tick the selecting checkbox of the type. Click Save and you will see the new
    price list listed ![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_2.png) ![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_3.png)


    ## 05 Workflow


    Workflows are an integral part of an organisation, and ERPNext lets you define
    in this area. Let''s see how to implement workflows based on roles: the first
    thing to note is that workflows are applicable to document type in ERPNext, so
    you need to know the document on which your workflow will be based. Go to Setup>Workflow,
    then click on the New workflow button. Next, enter the workflow name and the document
    type. You will need to set the states of the workflow, which are allowed to edit
    the workflow in that state. For example, in a typical application workflow the
    states will be either approved, pending or rejected (the default states are available,
    you are allowed to add new workflow states by editing the row). The next step
    is to add the transition rules, which are the steps that change the state of the
    workflow - for example, the transition will change the state of application from
    pending to approved.


    ## 07 Buy


    With the background set, let''s handle the basic business functions by selling
    products. In an enterprise you will need to manage these two things and ERPNext
    needs to do that. On the home page, click on Buying. The first option is under
    Suppliers -> Supplier - this works as the supplier database, so you can add suppliers
    here. Once you click New, you can create purchase orders, receipts and invoices
    aligned with their basic info, contact details and communication. This one-step
    process covers everything related to suppliers. Next is the Material List to help
    you list what requests for a raw material, and Supplier Quotation and Purchase
    Order follow. This is the easiest way to find or add the list of raw materials
    that you need to procure. Also, note that there are a few options here where Contact
    is accessible via different sections, so if you make changes in one place then
    they will be visible everywhere as well.

