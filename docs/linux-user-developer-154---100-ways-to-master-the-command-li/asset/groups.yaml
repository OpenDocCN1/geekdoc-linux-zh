    # DISTRO


    ## Mandriva enters liquidation


    Long decline finally claims the company, despite evidence of income


    Mandriva S.A., the company founded in 1998 as MandrakeSoft, has formally filed
    for liquidation following multiple years of financial difficulties.


    For the eponymous Linux distribution, Mandriva acquired several companies over
    its near-life: Edge in 2005, Linbox in 2006 devalued at $2 million. In 2008, it
    partnered with Turbine to create a joint technology dubbed Mandolabs, building
    a shared baseline technology which could be easily used by the two distributions.


    With 17 employees at the company''s last financial filing, Paris-based Mandriva
    has fallen victim to the financial troubles which have haunted the software.


    According to the company''s filings, 2013''s turnover of €653,600 was not enough
    to keep the company afloat with expenses resulting in losses thought to have worsened
    during 2014. As of 2013, the company claimed to have over €2 million in assets.


    Jean Christophe, who joined the company as chief operating officer in 2011 and
    rose to chief executive officer, has confirmed the company''s closure and stated
    that is to focus on his Swiss IT consultancy firm SimplyWorks for the time being.


    It is not yet clear what will happen to Mandriva''s Linux distribution, nor other
    products and projects for which it was responsible, but many users are expected
    to switch to other distributions.


    At the time of writing, Mandriva had not made a public statement on the liquidation,
    while its website became inaccessible shortly after.


    Mandriva is being handled by Frédéric of MJA Selasa, Paris.


    # SECURITY


    ## Logobat hits with mail, VPN servers


    A serious attack against Transport Layer Security (TLS), dubbed Logobat, has been
    published, revealing security holes in major browsers, web servers and private
    network (VPN) software.


    Discovered by researchers from Irina Nancy-Grant, Paris, Researchers at Microsoft,
    University of Michigan and University of Pennsylvania, Logobat exploits a vulnerability
    in the Diffie-Hellman key exchange which allows attackers to decrypt the cryptography
    in communications.


    Similar to the former attack, Logobat has been confirmed to affect 8.4 percent
    of the top websites, 14.6 percent of VPN servers and 8.4 percent of email servers.


    Should an attacker, such as a state actor, have factored the commonly-used 1024-bit
    prime used by many VPNs the vulnerability affects 27.7 percent of SSH servers
    and 66.1 percent of IPv6.


    The team responsible for finding the attack states that the US National Security
    Agency has leaked favored prime numbers, stating ''a closing of published NSA
    secrets shows how the attack could be carried out communications''.


    System administrators are advised to disable for export-strength ciphers and generate
    new, 2048-bit Diffie-Hellman keys and update their browsers and VPN clients as
    patches are released to prevent the attack.


    Full details are available at weleak.org.


