    # Solus Beta 2


    A fresh debut from scratch with a brand new desktop environment called Budgie,
    Solus is designed to ''just work''.


    If the name sounds familiar, that''s because the developer behind Operating System,
    Ikey (of Linux Mint Debian edition), released a debut of a similar name in 2012:
    SolOS. Unfortunately, SolOS departed in 2013, which was a shame because it came
    about to be replaced by Linux Mint which Ikey believed should have been in Mint''s
    Debian edition, and it was a rather good effort. Ikey, however, returned - The
    first name earlier this year has been changed to Solus Operating System due to
    a trademark issue. While superbly similar, Solus and the original SolOS are very
    different beasts - the latter was based on Debian, and the new Solus is built
    completely from scratch.


    The first thing you''ll notice is the custom-built desktop environment. Budgie
    desktop is tightly integrated with the GNOME stack, shipping out with the 3.16.3
    version in this beta release (on top of Linux 4.0.3); it is a refreshing, modern
    design, largely inspired by Chrome OS with some hints to GNOME and is quite functional
    rather than purely the aesthetics of other desktops. That said, Budgie also has
    a GNOME 2 theme if you want to use more traditional approaches. Despite some bugs,
    you can see that there is huge potential in this new desktop and it is undeniably
    gorgeous - it is available in some of the repos if you want to test it on your
    main computer. Budgie also gives you a decent amount of configuration and control
    without-


