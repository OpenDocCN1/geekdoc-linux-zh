  mdcn: "\n\n# Python 专栏\n\n## 优化 Python 代码\n\n在对代码进行性能分析以确定哪些部分需要关注之后，下一步是实际上对结果进行优化，并将计算内容从\
    \ Python 移动到 C。在上一期中，我们列举了几种分析 Python 代码的技巧，并确定了哪些部分需要关注。当你在树莓派上运行时，你将拥有完成这些操作所需的资源。本月，我们将研究可用于最大化性能的各种技术。优化有几类可以让你考虑，但第一步是确保代码运行正确。你只需要为了获得所需的性能而完成最少量的工作。任何额外的工作都是浪费，除非它是一个学习机会。\n\
    \n如果你无法切换到 C，那么可以尝试看看是否有避免对象项的方法。如果你在循环中使用对象列表，Python 必须在循环的每次调用时进行类型检查。这意味着你的代码在\
    \ Python 中处理，改变了被调用方法的形式，最后通过在进入循环之前将这些类赋值给一个新名称来减少这种开销。所有此类类型检查都在循环外完成一次。看下面的代码：\n\
    \nNumPy 为数组（array）提供的结构。Array 类似于列表，但它只包含相同类型的元素，并且它是用 C 构建的，因此所有内容都在 NumPy 内部构建。数组被视为单个数据元素，因此类型检查对整个数组只需一次，这正是你能够如此快速遍历元素的原因。在普通\
    \ Python 中，你会使用这样的循环：\n\n```python\nfor index in range(50):\n    c[index] = a[index]\n\
    ```\n\n其中 a 和 b 是长度为 50 的向量。在这种情况下，每当你运行一次 a[index] 和 b[index] 的循环时，都会有一定的开销。通过使用\
    \ NumPy 提供的数组数据函数，你可以通过以下方式减少这种开销：\n\n```python\nc = a + b\n```\n\n这使得代码变得整洁得多。它只涉及一种元素，因此你可以判断\
    \ a 和 b 是否可以相加。实际操作随后传递给 C 库，该库由 BLAS 和 LAPACK 等线性代数库构建。这提供了显著的性能提升，因为你可以利用 NumPy\
    \ 提供的所有优化。\n\nJoey Bramer 是 Python 用量方面真正的威胁。他与研究人员合作，解决科学计算和 Android 相关的问题。\n\
    \n为什么选择 Python？\n它是革命的语言。请在 python.org/ 阅读文档。\n\n第一个要查看的项目是如何处理字符串的。字符串是不可变的字符序列。这意味着当你想要更改字符串时，必须创建一个新字符串并将旧数据拷贝到新内存中。如果你在通过程序化构建大段文本，文本的拷贝在内存中可能是昂贵的。使用列表要快得多。\n\
    \n```python\nfor word in list:\n    list.append(word)\n```\n\n可以被更高效的代码替换：\n\n\
    ```python\nappend = list.append\nfor word in list:\n    append(word)\n```\n\n\
    当你使用任何 Python 函数或运算符时，也会发生这种类型的检查。如果你使用 `+` 运算符，Python 必须检查操作数的类型，并在每次 `v = a+b`\
    \ 的调用时将它们相加。如果你使用乘法，它在循环中发生很多，这可能是通过大幅减少数据条目来消除这些检查的最佳解决方案方法。虽然动态类型是 Python 的一大强项，但为了获得性能关键型代码，你可能需要避免它。\n\
    \n```python\nstr = []\nfor word in list:\n    str.append(word)\n```\n\n...你使用：\n\
    \n```python\nstr = ''.join(list)\n```\n\n如果你正在进行数值工作，你需要开始使用 NumPy。NumPy 数组在功能上等同于列表，但将\
