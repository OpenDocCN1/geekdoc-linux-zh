    for security applications already have a pan-tilt feature, in fact);


    The Pi-Pan Open Electronics is a pan-tilt mechanism that lets your camera move
    by an impressive 110 degrees from top to bottom and 180 degrees from left to right.
    The set includes a combination of hardware and software, the servo motors required
    for the actuation and movement hardware for the camera. On the software side,
    there are libraries in Python and Scratch which is easily enough for most projects.


    One of the most impressive applications you could use for this is an OpenCV-based
    motion detection and face tracking. Check out the openelectronics.com forum for
    it links like a truly great project to try (libjpl.xle).


    # High quality audio for your


    # HiFiBerry DAC+


    £30 / $34.99


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_54_1.png)


    As an educational tool, the HiFiBerry is pretty much unparalleled by the support
    of the very large community that surrounds it. As a high quality audio device,
    however, you may think it is lacking of the fact it only has a 3.5mm jack that
    can be turned for high fidelity.


    Due to its low cost, small footprint and its ability to act as a home media centre,
    music and video streaming server or much more, you have probably dreamed of using
    it taking your audio to the next level. The news is better that the folk at the
    Raspberry Pi Foundation, from the second revision of the Model B, have provided
    the I2S pins; initially on the PWM header, and now on the A+, B and 2 models it
    is available on GPIO18.


    I2S is a communications protocol specifically designed for audio devices and has
    enabled a number of companies like HiFiBerry and Iridium to create audio devices
    for the Raspberry Pi. The HiFiBerry DAC+, is an add-on which brings high resolution
    (192 kHz, 24-bit) Burr-Brown digital-to-analog converter to it. It is hardware
    volume control using Alsamixer, among many other features, and it is a HAT. It
    works plug-and-play out of the box with the latest Raspberry Pi firmwares, and
    works with all the popular operating systems for standard audio devices-MoLEC,
    Volumio, Pi MusicBox and many more. If you are serious about your audio quality
    and want a high quality, low cost, Internet-connected solution, you no longer
    have any excuses—you can build your own for under $100!


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_54_0.png)


