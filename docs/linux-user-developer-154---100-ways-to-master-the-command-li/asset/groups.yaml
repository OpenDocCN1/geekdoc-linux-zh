    # 观点免费软件


    ### 当 Windows 崩溃时


    也许驱动器无法启动、文件损坏或注册表或文件系统损坏 —— Linux 来救急了


    > 我们都遇到过这样的情况：朋友或邻居的 Windows 系统崩溃、丢失了数据且系统死亡。我们知道所有常见的症状——错误信息、启动失败、文件无法打开、Windows
    运行停滞。问题通常归咎于病毒或程序。有时数据丢失了，用户幸运地通过救援恢复并解决了问题。


    许多人并不十分熟悉此点，但病毒或安全供应商提供的大多数市售救急盘实际上是基于 Linux 的。这样做有充分理由。救援通常运行一个可以从 CD 或 USB 启动并完全在
    RAM 中运行的操作系统，这为检查和操作数据驱动提供了空间，而不会在修复时被感染或受驱动器数据的影响。


    Live 发行版（Live distributions）非常适合处理此类任务并读取、写入和访问 NTFS 和 FAT 等文件系统，且不受 Windows 权限或驱动程序的限制。这是因为
    Live 盘适用于在损坏的 Windows 系统上检索和修复文件。


    某些数据损坏是严重的，需要特殊工具，但它们比操作系统更好地从头开始修复文件系统。在这种情况下，使用 Rescue Kit 是多此一举了，你只需要一个小型 Linux。


