    # While it can keep you the camera side of things, the UltraB is positioned as
    the ultimate one-stop device for budding roboticists


    > Above PiBorg is behind the caravan-towing Doodleboard (bit.ly/Lt1gML) and boards
    like the XBorg motion and direction sensor


    The UltraB includes an on-board processor, a Pi, which provides for real-time
    sensing and control while taking the pressure off the Pi – more of an issue for
    the single-core Model B and A+ than the quad-core Raspberry Pi Z or its rivals.
    You don''t need to know how to program a Pi to use the device as the abc chips
    provide-ready sample code for user-level interaction.


    Installing it is as simple as hooking up the first six pins of the GPIO header,
    although the use of multiple sensors or any number of servos will require extra
    power supply with the board. This can connect to a terminal and can also supply
    power to the Pi itself, with additional UltraB boards, to make wiring as easy
    as


    A particularly handy feature of the UltraB is the easily erasable, programmable
    read-only EEPROM contained within the Pi process, which allows you to start up
    and limit values for the PWM outputs. Using this you can set a custom zero-point
    for


    particular services, while limiting their minimum and maximum rotation points.
    When power is reaped, the servos will return to the zero you have set. For protecting
    yourself against bad damage or faults, it''s a must-have. The UltraB is mounted
    on the Top (HAT) header, it is designed with piggyback mounting in mind. Screw
    holes on the board enable it to be attached to the XBorg Module or the original
    Model B. These same holes can also be used to mount the device if you wish use
    a different microcontroller or controller, a job also made easier thanks to the
    small size and weight of the board.


    PiBorg has just launched the delivery blinder, a small robot that can carry packages
    around. It comes with a range of accessories, including a BattB battery power
    supply, a 90-degree mounting bracket for the ultrasonic sensors and bundles which
    include quality servo motors, and all the connecting cables.


    # Pros


    High-precision PWM control combined with multi-channel ultrasonic sensor makes
    making things as simple as possible for all


    # Cons


    With more complex projects that daisy-chain multiple challenges it can get expensive
    compared to lower-cost alternatives


    # Summary


    The UltraB is a marvelous device, with a size that fits both challenges of combining
    both input and output one-board makes that it is. For the robotics projects, and
    the daisy-chaining it will be simple. However, it is quite expensive compared
    to other options in the competition that''s available.


