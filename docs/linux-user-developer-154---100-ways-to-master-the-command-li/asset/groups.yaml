    and GUI interfaces.


    # 04 Add the Pi camera


    The Pi camera is mounted into the glove, which enables

    y to angle your wrist and take a picture in the direction that

    hand is facing. Make a small hole in the thumb of the glove, big

    enough for the lens to push through. On the Pi camera

    glove you will find four holes, use these and the tie

    cables to secure the camera onto the fabric of the glove.


    # 05 Attach the Pi camera cable


    Flip the glove inside-out so you can access the back

    of camera. Take the camera connection, with the blue side

    facing away from camera, and attach the tie to the back

    of camera. On the Raspberry Pi, slide up the camera

    holder and secure the wire into place. You may want to

    thread the wire through the side of the glove to conceal it.


    # 07 Mount the Raspberry Pi


    Mount the Raspberry Pi onto the top of the glove

    using the small cable ties and the holes located on

    corner of the Pi - this makes the glove more portable,

    and comfortable so that the SD card is not away

    from your wrist. Thread the cable ties through the holes

    or glove, securing the Pi in place. Be careful not to

    over-tight the ties.


