    ## build a Pi Glove – part 1


    Create your own Wearable Tech glove that places control at your fingertips.


    The Pi Glove is our project name for a wearable, social media-controlling glove
    – we''re going to show you how to build it and how to program it next month. With
    the advent of Google Glass, Android and Apple smartwatches and other disruptive
    technologies, the devices we''re beginning to use today towards a future where
    we may well day one other (all the gadgets that enable us to communicate with
    each other (inside our bodies...). The more natural or ergonomic this medium we
    become, the more likely we are to use it, so we''re going to use a Raspberry Pi
    to create a powerful version of one and the hardware setup we set up that you
    can make your own version of the Pi Glove.


    **Dan Aldred**

    Aldred is a Raspberry Pi Certified and a Lead School teacher for CAS. He is passionate
    about creating and hacking projects like this to engage the students he teaches.


    ### 01 Strip and prepare the wires

    Each of the female-to-female jetty wires, select one and remove the insulation.
    This can be done by applying a little pressure on the plastic cover – you can
    use your teeth but it''s better to use a set of pliers! The end will now consist
    of a small metal spike. Prepare the other wires using the same method.


    ### 02 Attach the wires to the poppers

    The next part is a little tricky, take your time to work through the wires. First,
    you need to connect the wire to the popper pinning the other end through the glove.
    Once, close the two poppers together, the wire is secured-in. This is easier if
    you turn each glove finger inside-out and then push the popper through. The key
    part of this step is to ensure that the we stay connected.


    ### What you''ll need

    - Raspberry Pi A+

    - Clothes poppers

    - USB cable ties

    - Glove

    - USB battery charger

    - Pi camera module


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_67_0.png)

    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_68_0.png)


    ## 03 Check the wires are in place


    One wire/popper combo is attached to each of the four fingers and the thumb of
    the glove. The thumb forms the earth, or ground, the connection when it comes
    into contact with the other metal finger poppers.


    The Pi camera is mounted onto the glove, which enables you to angle your wrist
    and take a picture.


    ### 04 Add the Pi camera


    The Pi camera is mounted into the glove, which enables you to angle your wrist
    and take a picture in the direction that your hand is facing. Make a small hole
    in the thumb of the glove, big enough for the lens to push through. On the Pi
    camera glove, you will find four holes, use these and the tie cables to secure
    the camera onto the fabric of the glove.


    ### 05 Attach the Pi camera cable

    Flip the glove inside-out so you can access the back of the camera. Take the camera
    connection, with the blue side facing away from camera, and attach the tie to
    the back of the camera. On the Raspberry Pi, slide up the camera holder and secure
    the wire into place. You may want to thread the wire through the side of the glove
    to conceal it.


    ### 06 Checkpoint

    At this stage you have the five poppers attached individually to a wire and through
    each of the individual fingers, or also attached to the thumb. These wires run
    through the inside or outside of the glove to the Raspberry Pi. Pi camera is also
    attached to the glove, with the lens exposed enables pictures to be taken.


    Left We placed the camera on the back of the hand, but can you put yours anywhere
    you like.


    Wpa_supplicant is a background program that acts as the to control wireless connection.
    It supports both and GUI interfaces. On saving the file, wpa-supplicant will normally
    notice that a change has occurred and try to make a connection to the network.


    ### 07 Mount the Raspberry Pi

    Mount the Raspberry Pi onto the top of the glove using the small cable ties and
    the holes located on the corner of the Pi - this makes the glove more portable,
    and comfortable so that the SD card is not away from your wrist. Thread the cable
    ties through the holes of the glove, securing the Pi in place. Be careful not
    to over-tight the ties.


