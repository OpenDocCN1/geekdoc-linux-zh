    # 问题与答答


    联系我们...

    网站：www.linuxuser.co.uk

    邮箱：linuxuser@imagine-publishing.co.uk


    ## 问答


    ## 您的问题解答


    向我们发送您的问题，我们将尽力解答！


    ## 常见问题解答 (FAQ)


    ## Linux 媒体中心


    问：Kodi 和 MyTV 有什么区别？


    答：Kodi 和 MyTV 的工作方式非常不同，尽管它们都能执行类似的任务。MyTV 需要一个后端服务器来为前端客户端提供媒体支持，而 Kodi 更侧重于录制电视节目。Kodi
    可以在没有服务器协助的情况下运行并播放视频文件。Kodi 的设置要求较少，如果你在多一台电视上使用它，它们之间不会有区别。


    问：使用 Kodi 盒子最好的方法是什么？


    答：Kodi 可以作为桌面应用安装，但最好的方法是使用如 OpenELEC 或 LibreELEC 这样的 Kodi 发行版。我们推荐使用小型一体机 PC
    甚至树莓派（Raspberry Pi）。


    问：我如何获取 Netflix？


    答：有一个名为 XBMC 的插件可以访问 Netflix 的所有功能，其功能与网页界面或其他官方界面完全一致。所以你仍然可以使用它，但如果你想同时使用 Kodi
    和 Netflix，可能需要一些额外的努力。


    ## Fedora  Emacs


    我最近尝试了从 GNU 网站下载 Emacs 并进行自定义配置的过程，我还为 Emacs（一个邮件客户端）添加了 `make`。我在那里找到了 Emacs。当我进行编译（tarball
    包）时，在运行 `.configure` 时对某些事情并不确定。


    如何通过安装更多包来获取不同版本操作系统的 Emacs？他们是如何将带有所需软件的 `Emacs KDE` 放入仓库的？


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_89_0.png)


    ```

    GNU Emacs 2.31.10 (x86_64-linux-gnu, GNU version 2.31.6)

    Copyright (C) 2020-2021 Free Software Foundation, Inc.

    Licensed under GNU GPL3

    ```


    GNU Emacs 是 GNU/linux 操作系统的一个组件。


    - 作者

    - 分配与自由

    - 复制许可条件

    - 获取最新动态

    - 选项

    - Emacs 教程


    许多人的代码包含在 GNU Emacs 中

    贡献以改进 Emacs


    我们为什么开发 Emacs 以及 GNU 操作系统

    在**绝对不提供任何保证**的情况下许可

    分发和更改 Emacs

    如何获取最新版本的 Emacs

    从 PDF 打印用户手册


    学习基础 Emacs 指令


    上面的 Emacs 是一个优秀的文本编辑器，所以你应该使用它并检查它是否值得你投入时间。


    我想补充关于他们如何开发的，

    但我不太确定。


    我有 Emacs 并且在使用它配合 `make`，

    但我只是好奇。

    感谢任何见解/帮助！


    ## 关于下载


    所以这就是 Linux 发行版处理

    软件软件包的方式 - 它们以二进制形式存在

    并从在线仓库下载

    然后在随后安装。


    90


    ## Steam 问题


    我正在运行 Ubuntu 15.04，并尝试从 Ubuntu 软件中心下载 Steam。它在里面，但当我尝试进入时，它无法工作。


    我在同步软件包管理器中找到了 Steam 并通过这种方式安装了它，但当我这样做时，获得了一个桌面图标，Steam 图标在应用程序菜单中，但它无法启动。我尝试从命令行运行，并得到了此错误：


    Running on ubuntu 15.04 64-bit STEAM_RUNTIME enabled exception handler for appid(steam):version(0)


    ```

    libX86_dri.so unable to load driver:

    libGL: driver pointer missing

    libGL: failed to load driver:

    libGL: unable to load driver:

    swrast_dri.so

    libGL: failed to load driver:

    ```


    有人告诉我 Steam 对 Linux 非常友好，但我就是无法让它工作！你该如何实现这个想法？


    Alex Chang.


    这个问题对于 Linux 用户尝试使用 Steam 来说并不常见——基本上出现问题的原因是你的系统中没有安装 32 位库。解决方案很简单，并且在你的 64
    位版本上有效，但你需要先安装这些初始包才能使其运行。


    要在你的 15.04 系统上获取它，你需要使用：


    - sudo apt-get install lib32i


    当你安装它时，它会忘记你已经安装过了，所以你可能需要定期更新并再次重新安装。


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_90_0.png)


    上述，磁盘（Disks）确实可以为你完成任务，尽管我们更倾向于 GParted。


    这些二进制文件是预编译的软件部分，在创建时使用了所有的开发包，使你实际上可以直接运行它们，而不需要它们所需的开发包。


