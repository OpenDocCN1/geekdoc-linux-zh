  mdcn: "\n\n# 树莓派升级方案\n\n## 全方位保护你的 Pi\n\n### Short Crust Plus\n$8.99 / $15.95 购买地址：bit.ly/1c1fbw\n\
    \n树莓派是一款非常耐用且可靠的微型电脑，尤其是当你考虑到它只是一块带有良好保护的组装电路板时。然而，某些时候你可能想给你的 Pi 准备一个漂亮的外壳。也许是因为你想让基于基于\
    \ Pi 的家庭影院在所有电子设备旁边看起来更时尚，又可能你只是想在把它装进口袋里时让你的这台微型电脑远离灰尘。\n\nShort Crust Plus 是我们最喜欢的\
    \ Model B+ 和 2B 树莓派外壳之一，因为它的设计精巧且价格亲民。它也非常易于使用——Pi 直接卡入外壳内部，盖子咔哒一声即可到位。每个外壳都带有一组自粘橡胶脚垫和几个磁铁，允许你增加外壳的高度，以容纳你可能使用的任何扩展板。\n\
    \n## 便携式与太阳能电源\n\n### PiJuice\n£25 / $39 购买地址：bit.ly/1fb1my\n\n你现在可以拥有一个精美的微型扩展板，它让你的项目脱离电网并离开市电源。PiJuice\
    \ 符合树莓派 HAT（顶层硬件扩展）规范，并使用简单的螺钉固定方法提供智能充电和电源电路，让你的 Pi 真正变得便携。它还有一个名为 PiJuice Solar\
    \ 的版本，能够从可再生能源获取输入。\n\nPiJuice 还具有一个强大的 ARM Cortex M0 处理器，提供深层睡眠功能、实时时钟、看门计时器以及许多其他实用功能。PiJuice\
    \ 的固件和 GUI（图形用户界面）带有常用的 ACP（高级配置和电源）系统，可提供高达 5A 的电流，以与树莓派进行高度集成。树莓派仅使用一个 I2C 感应引脚，留了一个空闲以与其他设备配合，其紧凑的设计使得顶部添加其他\
    \ HAT 或扩展板变得极其简单。PiJuice 将使你能够制作各种酷炫的项目——请查看 Instructables 页面：bit.ly/2coeEE\n\n\
    ![](img/572ad2c12aa08801c9a444d6a88fdc5_52_0.png)\n\n## 特性\n\n## 电源开关与安全关机\n\n\
    ### Pi Supply Switch\n£15 / $23.10 购买地址：bit.ly/1RXHR0n\n\n![](img/572ad2c12aa08801c9a4044d6a88fdc5_53_0.png)\n\
    \n树莓派如此受欢迎，部分原因是因为其硬件具有极高的性价比。在这个价位下，它提供了强大的性能，而且因为它是由一家慈善机构设计的，他们并不打算像许多商业产品那样的通过高利润来抬高价格。遗憾的是，对于任何低成本产品，为了保持其如此廉价且小巧的外型，必须做出一些妥协。\n\
    \nPi Supply Switch 是一个自锁套件，提供开启和软文件安全关机功能，为你提供电源管理自由度。通过提供的示例脚本，你可以在关闭媒体开关或解决终端中的任何问题时，让\
    \ Pi 关机——且唯一的电路确保了只有在 Pi 关机后才会切断电源。更可靠的关机方法可以减少因拔掉电缆导致 SD 卡损坏的可能性。\n\n将其与你更标准的桌面或笔记本电脑相比，有一点是显而易见的：寻找具有管理功能的电源开关。惊讶的是，像电源开关这么简单的东西竟然非常有用，而且在你拥有它之前你并没有意识到这一点！\n\
    \n![](img/572ad2c12aa08801c9a4044d6a88fdc5_53_1.png)\n\n## 红外线看清黑暗\n\n### NoLoR\
    \ 红外线摄像头\n£16.80 / $29.95 购买地址：bit.ly/9QyeC4\n\n树莓派上的 CSI 接口（在最新型号中位于3.5 mm 接口和\
    \ HDMI 接口之间）允许你直接连接摄像头模块，而无需 USB 摄像头。你在这里使用的摄像头模块是即插即用的，而且正如树莓派基金会所预期的那样，它们采用了极小的尺寸——重量约为三克（不包括电缆）——24x9mm。\n\
    \n正如你预期的那样，有一个“正常”摄像头模块，我们指的是那种具有令人印象深刻的光感捕捉能力的 5MP 定焦摄像头，它支持带有位滤波的 1080p、720p\
    \ 和 640p 全速运行。但当摄像头模块首次发布时，有些人对可见光摄像头并不满意，并有其他（非常有用的应用想法——他们要求在重新安装所有东西之前更换微型摄像头）。这种配对运行良好，但限制了多样性，但有太多的人在这样做，以至于树莓派基金会注意到了并开始自己制作。\n\
    \n红外线有一些相当常见的夜间用途，如果你将你的 NoLoR 与红外 LED 配对，可以查看一下 Bright Pi 板板。然后你可以轻松设置夜视监控摄像头或监控设置。最令人惊讶的是，如果你在白天使用摄像头，它实际上可以监控绿植物的健康\
    \ [bit.ly/2QznFG]。\n\n# 树莓派升级方案\n\n## 为你的摄像头提供移动能力\n\n### Pi-Pan Tilt 云台云\n£45.99\
    \ / $39.99\n\n![](img/572ad2c12aa08801c9a4044d6a88fdc5_54_0.png)\n\n页面对侧的摄像头模块是你树莓派工具箱中必须具备的一些基础升级，但如果你想移动摄像头以获得不同的视角会怎样？这在许多项目中都很有用，例如带有交互界面的机器人（许多摄像头已经具备了此功能）；Open\
    \ Electronics 是一种云台机构，它可以让你的摄像头上下移动 110 度，左右移动 180 度。该套件包含硬件和软件的组合，以及用于摄像头驱动和移动所需的伺服电机。在软件方面，有许多库可以使用。\n\
    \n## 太阳能扩展板\n\n### PiJuice \n（此处应接上文的 PiJuice 翻译内容）\n\n### 10.1 英 显示屏与音频\n£110\
    \ / $154.95\n\n为你的项目寻找合适的显示器可能是件苦事。我们在之前的期数中介绍过 HDMIPI (1/6)，它是一个非常适合树莓派的 9 英寸屏幕。\n\
    \n如果你想要一个不可错过的，Adafruit 有一块 10.3 英的屏幕。它具有美美的白色显示，是 IPS 屏，具有宽视角。它拥有多种接口，如 HDMI、VGA\
    \ 和复合视频。最棒的是，这个显示套件还允许你直接连接 2 或 8 欧姆扬声器，而无需额外的显示放大器或外部电源单元。\n\n它在 Adafruit 网站上的\
    \ 155 美元并不是便宜的显示器，但如果你你的项目需要高质量的显示器，那么你应该避免原生显示。我们已经在梦想一个带有立体声音频的专用多玩家模拟器街机了，并相信我们能想出一些酷的应用！\n\
    \n"
