    # 发行版


    ## Mandriva 进入清算


    尽管有收入证据，但长期的衰退最终击垮了这家公司


    Mandriva S.A. 于 1998 年以 MandrakeSoft 的身份成立，在经历了多年的财务困境后，已正式申请清算。


    对于这个同名的 Linux 发行版，Mandriva 在其接近终点的生命中收购了数家公司：2005 年的 Edge，2006 年估值 200 万美元的 Linbox。2008
    年，它与 Turbine 合作创建了名为 Mandolabs 的联合技术，构建了可以被这两个发行版易于使用的共享基础技术。


    在公司最后一次财务报报中，该公司仅剩 17 名员工，总部位于巴黎的 Mandriva 已成为一直困扰该软件的财务问题的受害者。


    根据公司提交的文件，2013 年 653,600 欧元的营业额不足以维持公司运营，支出导致的损失被认为在 2014 年期间加剧。截至 2013 年，该公司声称拥有超过
    200 万欧元的资产。


    Jean Christophe 于 2011 年加入公司担任首席运营官，后升任首席执行官，他已确认公司将关闭，并表示目前将专注于他的瑞士 IT 咨询公司 SimplyWorks。


    目前尚不清楚 Mandriva 的 Linux 发行版及其负责的其他产品和项目将何如何，但预计许多用户将切换到其他发行版。


    在编写时，Mandriva 尚未对清算发表公开声明，其网站在不久后变得无法访问。


    Mandriva 由来自巴黎 MJA Selasa 的 Frédéric 处理。


    # 安全


    ## Logobat 攻击电子邮件和 VPN 服务器


    一种针对传输层安全（TLS）的严重攻击 Logobat 已发布，揭示了主流浏览器、Web 服务器和私有网络（VPN）软件的安全漏洞。


    Logobat 由来自巴黎 Irina Nancy-Grant 的研究人员、微软、密歇根大学和宾夕法尼亚大学的研究人员发现，它利用了 Diffie-Hellman
    密钥交换中的一个漏洞，允许攻击者解密通信中的加密内容。


    与之前的攻击类似，Logobat 已被确认影响了 8.4% 的顶级网站、14.6% 的 VPN 服务器和 8.4% 的邮件服务器。


    如果攻击者（如国家级实体）利用了许多 VPN 常用的 1024 位素数，该漏洞将影响 27.7% 的 SSH 服务器和 66.1% 的 IPv6。


    负责发现该攻击的团队表示，美国国家安全局（NSA）泄露了常用的素数，并指出“NSA 公开秘密的关闭显示了攻击是如何实施通信的”。


    建议系统管理员禁用出口级加密算法，生成新的 2048 位 Diffie-Hellman 密钥，并在补丁发布后更新他们的浏览器和 VPN 客户端以防止攻击。


