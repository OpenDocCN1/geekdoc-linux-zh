    # DISTRO


    # Fedora 22


    Fedora branches into three distinct variants for its latest release, building
    on the solid foundations in Fedora 21


    In the words of the developers, "If this release had a human analogue, it would
    be Fedora 21 after''d been to college, a good job and kept its New Year''s Resolution
    to the gym on a regular basis."

    Fedora 22 doesn''t have a huge departure, but it does some great features and
    enhancements on those brought in for the previous release. Among the editions
    of the distro, each tailored to its purpose: Cloud, Server, and Workspace.

    We''re focusing on the latter, the desktop edition, although there are some other
    options between the two, including Docker images and Vagrant Boxes for Fedora
    Cloud and a default XFS filesystem on top of LVM for Server.

    Vagrant has been added to Fedora 22 Workstation, continuing the focus on virtualisation
    for


    this cycle, the UI for Boxes has also been revamped with a better box creation,
    new preferences, default display scaling and a new feature that lets you send
    keyboard shortcuts to a box. In software there are some other improvements like
    KDE Plasma and LXQ which have both been improved in this release, and GNOME Builder,
    which includes features like split-pane editing and Markdown preview, and a new
    read-only assistant that allows your system to run. For back end, Fedora is now
    a step closer to running on Wayland, with the display server being used for the
    GNOME Display in this release (the GNOME session still uses X11, and the Elasticsearch
    server has been integrated with the Fedora repos.)


