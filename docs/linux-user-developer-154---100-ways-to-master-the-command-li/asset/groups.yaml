    # # Monitor your local network with NagiosPI


    > Embrace the power of Nagios to keep an eye on servers, switches and applications
    on your network


    **Is your PC offline? Has your Linux box stopped serving Minecraft or Counter-Strike?!**
    If you''re out of the house, or even the country, there is no way of knowing whether
    to log in - something without being on the premises (unless you''re using remote
    desktop software)


    **01 Download and write NagiosPI to SD**

    Users should extract the contents of NagiosPI_v2.0.zip to a file using Win32 Disk
    Image. Linux users use Disk Utility or the command line (bit.ly/t365pdi). With
    the image written, safely eject the card and insert it into your Pi before booting.


