    # Unpack a ZIP file


    If you''ve downloaded a ZIP file and you did from the terminal or you''re working
    from, you can unpack it using the unzip command. You can use it like so:


    ```

    $ unzip.zip

    ```


    # Unpack a TAR file


    Sometimes Linux will have a compressed file that is archived as a tar.gz, or a
    tarball. You can unpack these or similar tar files using the tar command, although
    you need the right options. For the common command, it''s


    ```

    $ tar -xvf file.tar

    ```


    # Copy and write docs


    Coming from Unix you might know it called dd, we''ve been using it for a while
    now in Windows. Use it to copy images from disks to hard drives and write them
    back. If it is the input file or the drive or the output of the file is what you
    need to change.


    ```

    $ dd if.img of=/dev/sdb1 bs=4M

    ```


    # Create an empty file


    When coding or installing software, you will need to create a file. You can create
    it with nano and then edit, but the terminal allows you to create an empty file
    - this is touch.


    ```

    $ touch file

    ```


    # Print into the terminal


    The terminal uses echo to print strings into files, much like the C language.
    If you''re writing a Bash script and want to see the output of your current section,
    you can use echo to print the relevant info into the terminal output.


    # Create an MD5 hash


    When downloading a file it can help to make sure it''s downloaded properly. A
    lot of sites offer the ability to check the integrity of the downloaded file by
    comparing a hash sum on it. At location, you can check this


    ```

    $ md5 filename

    ```


    # Run commands to x


    Sometimes you need to do something concerning the x display, but the only way
    to enter the command line is by switching to an alternative instance with Ctrl+Alt+F2
    or similar. To send a command to the user''s display with DISPLAY=":0" it knows
    where to go.


    # Create a new SSH key


    When you need to generate a strong encryption key, you can also do a great at
    it in the terminal. You can do this using your email address as identification
    by entering the following into the terminal:


    ```

    $ ssh-keygen -t rsa -C "your_email@example.com"

    ```


    # System details


    Sometimes you want to check what you''re running with the simple uname command,
    which you can use in the terminal with the following:


    ```

    $ uname

    ```


    # Kernel version


    As of uname, you also get the kernel. Knowing this can be useful for finding the
    right headers when compiling modules or updating aspects. You can get the kernel
    version by using the -r option.


    ```

    $ uname -r

    ```


    # Everything else


    Ubuntu enables you to display a lot of data that is available in the system and
    you can look at all of this information by using the uname option with the command


    ```

    $ uname -a

    ```


    # CPU architecture


    If you''re on an unknown machine, you might need to find out what kind of architecture
    you''re running. Find out what the processor is:


    # FILE PERMISSIONS


    # Learn to view file permissions and then how to modify them properly


    # List file permissions


    You can check the file permissions of every item, including hidden files and directories,
    in the terminal using ls -l. It will point out the permissions in the first column
    of output. The first character identifies the type, with d indicating a directory
    and - indicating a regular file. The remaining characters are actually sets of
    three and are interpreted for example:


    # Change permissions


    With the assertions above, you can start editing if you want to change file permissions.
    You can set all permissions by assigning it a number that treats the three-bit
    sets as a binary. You can do something like this:


    ```

    $ chmod 777 file

    ```


    The first number is for the users, the second is for the group and the third is
    for everyone: the numbers are


    ```

    7: read and execute, 111/rwx

    6: read and write, 110/rw-x

    5: read and execute, 101/r-x

    4: read, 100/r-

    3: read and execute, 011/-w-

    2: write and execute, 010/-wx

    1: execute, 001/--x

    0: none, 000/---

    ```


    > To send a command to the x display, prefix it with DISPLAY=":0"


