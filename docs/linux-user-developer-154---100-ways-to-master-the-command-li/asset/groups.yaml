    # Use an Android device as a Raspberry Pi screen


    # Connect to a Pi with your phone or tablet using VNC as a secondary or actual
    display


    There are a few ways to attach a display to a Raspberry Pi. The ones that everyone
    is familiar with are the HDMI port, which can go straight into your monitor or
    TV, or the GPIO ports with a portable avenue that is rarely pursued by Raspberry
    Pi desktop using another computer.


    It''s actually fairly simple and we are going to concentrate viewing your desktop
    via Android for portability. With further tweaks you will be able to use this
    on the go if you find yourself commuting and catching up on your favorite projects.


    There are a few things that you should be aware of when doing this - it can be
    quite taxing on the Pi and is likely to drain a bit of battery from your phone
    too. We will talk about how to help take the strain off it if the connection seems
    a little laggy and how this method can be used on normal PCs as well, so you can
    use a range of devices and get more from your Raspberry Pi.


    # Update your Raspberry Pi


    Before starting, you should absolutely make sure your Raspberry Pi is up to date.
    With the limited resources on the Pi, any optimizations can make the experience
    better. You''ll want to update the software by opening the terminal and using:


    ```

    $ sudo apt-update && sudo apt-upgrade

    ```

    ... and then follow it up with a firmware upgrade running:

    ```

    $ rpi-update

    ```


    # What you''ll need


    - TightVNC tightvnc.com

    - VNC Viewer bit.ly/1JjCZBRJ


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_63_0.png)


    Rob Zwels models complex systems as a web developer proficient in Python, Django.
    He loves to experiment with computing


    # Android VNC


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_64_0.png)


    # Full code


    FileSilo.co


    # Look up the resolution of your Android device and modify the line used to start
    up the server


    The first time you turn it on, you will have to set a password. You need to pick
    a password you can remember as it will also be used by the client as it connects
    via VNC. You can use a maximum of eight characters for the password, so think
    about how you want to make it secure.


    # Running slow


    If you find that running is a bit too slow for your liking, changing the resolution
    might make it easier. If that''s still not helping, your network connection may
    be the issue.


    # 02 Install the software


    We''re going to use TightVNC for our VNC we need - specifically, the server side
    of things. We need to install it first, so back to the terminal and use:


    ```

    $ sudo apt-get install tightvnc

    ```


    You may have to run a setting things or as it asks, hit ''yes'' (or ''y'') to
    finish them.


    # 03 Start VNC


    Once everything''s installed we can quickly start up the VNC server - it might
    be a good idea to do so and make sure it''s working. Let''s do a test run with
    the following:


    ```

    $ vncserver -geometry 640x480 -depth 16 -pixelformat rgb

    ```

    As long as everything is installed, it should start without any problems.


    # 05 Stop and restart


    As TightVNC doesn''t work like a normal service, you can''t use a service restart
    (or equivalent) to turn it off. If you want to restart, you''ll have to manually
    turn it off and restart it with the command:


    ```

    $ vncserver -kill :1

    ```

    ... replacing with the display number you originally created.


    # 06 Correct resolution


    If you create a server with a resolution of 640x480 just to get going. Luckily,
    this resolution is not fixed every time, so the best thing to do is to look up
    the resolution of your Android device and modify the line used to start. For example,
    if you use 1080p, you would use:


    ```

    $ vncserver -geometry 1920x1080 -depth 16 -pixelformat rgb

    ```

    www.linuxserver.co.uk


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_65_0.png)


    # 07 Get the app


    On your Android device, go to the Play Store and look for VNC Viewer (you can
    also install it via this link: bit.ly/1JjCZBRJ). Install it to your device and
    run it to connect to the Raspberry Pi.


    # 08 Raspberry Pi IP


    We need the IP address of your Raspberry Pi so we can connect to it. You can get
    it via two methods - the preferred method is to open the terminal and use `ifconfig`
    to list the status of the network interfaces; if you are using wireless, you can
    also access `iwconfig` and see what has been assigned as ip.


    # 09 Connect to the Pi


    Now that we have the IP address, we can connect to the Raspberry Pi. Open the
    app, leave the name blank, enter your IP address and click Save. It will ask for
    a password when you attempt to connect, after which it will save and not require
    it in the future.


    # 10 Use VNC


    If this is the first time you are using VNC software, you will notice a lag between
    what you do and what happens on screen. Luckily, you can use your finger to move
    the mouse and tap to click, and a keyboard can be used as well. It takes a bit
    of getting used and is good for anything you need to do, but it''s very useful.


    # 11 Turn off


    Killing the VNC server, as we talked about in Step 5, can still be done when your
    Android device disconnects. The issue occurs if you turn off the Pi. If you disconnect
    the VNC client from the Pi, the server on the Pi will still be on; this means
    you can reconnect at any time.


    # 12 Turn server on startup


    Currently, every time you turn on the Pi you''ll have to turn on the VNC server.
    There''s no config setting or service setting that we can set to turn on by default,
    so we need to write a script. Create a file using nano in the terminal at the
    following location:


    ```

    $ sudo nano /etc/init.d/vncserver

    ```


    VNC Viewer is made by RealVNC, the original developers of VNC technology


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_66_0.png)


    Above it''s simple enough to get around the GUI using your phone, but for extended
    bounds of testing, consider a portable Android keyboard.


    # 13 Write the script


    This script will do everything we need to do, but be sure to edit the resolution
    for your specific use case:


    ```

    #!/bin/sh

    export USER="$USER"

    # parameter for tightvserver

    DISPLAY=":0"

    DEPTH="16"

    GEOMETRY="1920x1080"

    NAME="vncserver"

    OPTIONS="-c $USER -depth $DEPTH -geometry $GEOMETRY"

    case $1 in

    start)

    /usr/lib/init.d/functions

    log_action.begin_msg "Starting vncserver for user $USER on localhost:$DISPLAY"

