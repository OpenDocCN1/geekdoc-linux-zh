    # Battery pack


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_60_0.png)


    # 01 Order your components


    If you''re buying components online, you should be able to get them all within
    five days. However, if you''re ordering offline (the UBEC), you should avoid electronics
    stores and instead visit a model enthusiast store, as these circuits are regularly
    used in RC devices.


    # 05 Add a battery to boot


    With your Pi ready to use and your Wi-Fi plugged in, connect the UBEC to the micro
    USB port and insert the sixth battery into the box. The Pi''s power and status
    lights should indicate that the computer is booting up, gives you a fully portable
    computer.


    You can also use a UBEC to charge your smartphone from a battery pack


    # 03 Change the 3-pin connector


    To use the UBEC with a 3-pin connector, the position of the pins must match the
    two outer slots.


    Use a small screwdriver to unlock the small plastic catch and remove the red wire
    from the central slot, sliding it into the uncoupled outer slot.


    # 06 Connect the 3-pin connector


    If you replaced the UBEC with the newly-modified 3-pin connector, you need to
    connect it to the Raspberry Pi GPIO header. Specifically, connect the positive
    +5V (red) connector to Pin 2 and the negative 0V to Pin 6. Once again, check the
    status lights to ensure the Pi is booting.


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_60_1.png)


    # Use a UBEC


    It is possible to power your Raspberry Pi directly from or more batteries, but
    without the safety that the UBEC provides, you''ll have to deal with unregulated
    voltage.


    # 02 Check your UBEC


    Two types of UBEC are available: If you used the one that we suggest in the box,
    you will receive one with a micro USB port for easy connection to your Raspberry
    Pi. However, if you bought one from eBay then there is a strong chance that you
    will receive one with a 3-pin connector.


    # 07 Measure uptime


    You should have already set up your Pi for SSH, so give it plenty time to boot
    (at least 60 minutes). In the terminal,


    +   - 60 uptime


    This command will display the uptime and also keep the Wi-Fi connection active.


    # 08 Judge your performance


    The uptime depends on the type of battery you use and the Raspberry Pi model.
    Simple lasts a little bit, but this is also a more expensive option. Newer models
    have greater power performance but for less time. For more power, add more batteries!


    # 04 Connect the UBEC to the battery


    With batteries in the box, connect it to the UBEC with tape. You might do this
    by twisting the wires or soldering, or by using a 3-pin terminal strip, cut to
    two pairs. The terminal strip can be cut to size using your knowledge.


    # 09 Power extreme!


    More batteries in parallel should result in double the runtime (at 16 hours on
    a 256MB Raspberry Pi B), but instead of rechargeable batteries you might consider
    a lithium-based AA cell, which will last considerably longer than alkaline batteries.


    You''re likely to learn the hard way and how to benefit from variety of cells
    to burn, unless you use a UBEC!'
