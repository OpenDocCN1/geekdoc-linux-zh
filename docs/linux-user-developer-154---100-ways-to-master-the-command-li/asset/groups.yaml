    \n# Add a battery pack to your Raspberry Pi\n\nDon't leave your Raspberry Pi behind\
    \ – incorporate it into mobile projects by powering it with AA batteries\n\n**Christian\
    \ Cayley** is a former II software engineer, and now support users. Since 2010\
    \ he has written for countless publications, both online and in magazines\n\n\
    Your Raspberry Pi's mobility is usually restricted by the length of the power\
    \ lead. Rather than limiting it to your desk or living room, however, you can\
    \ use it for mobile projects as launching it into near-Earth orbit or monitoring\
    \ and automating your garden. In this case you will need batteries, but adding\
    \ power to your Raspberry Pi is simpler than you might have imagined. All that\
    \ required are six rechargeable AA batteries (single-alkaline), a battery box\
    \ with space for them and a UBEC. The latter is a Universal Battery Elimination\
    \ Circuit, a voltage regulator that will regulate the power supply and prevent\
    \ damage to the Raspberry Pi, and can be bought for under £10.\n\n# What you'll\
    \ need\n\n+   - AA battery box\n  bit.ly/1FDJGa\n- 3-Amp UBEC\n  bit.ly/1HLKIh7\n\
    - 3-Amp terminal strip\n- 6x AA rechargeable batteries"
