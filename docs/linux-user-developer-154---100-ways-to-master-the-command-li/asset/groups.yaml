    # ERPNext 教程


    ## 使用 ERPNext 管理你的业务资源


    学习如何使用开源 ERPNext 高效地管理你的业务


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_29_0.png)


    **Nitish Tiwari** 是一位软件开发者和开源爱好者。他在会议上演讲并为各种杂志撰写文章，并帮助公司采用开源软件来满足业务需求。


    精益（Lean）是这个世纪的流行词——所有组织无论大小，都希望用更少的时间、更少的资源完成更多、更好的事情。虽然这说起来容易，但对于小企业来说，要做到精准到位是很的。为什么不能朝着你想要的方向移动呢？这并不是单一的原因，因为最大的挑战在于公司初始阶段，人们更关注增长和计划，导致了额外的人员和资源。


    ### 01 安装


    ERPNext 可以以最适合你用例的安装类型进行安装。安装 ERPNext 的第一个且可能最简单的方法是下载 VirtualBox 镜像并在 VirtualBox
    上运行。VirtualBox 是由 Oracle 支持的开源虚拟化工具。它适用于几乎所有主流平台（Windows、Mac、Linux）。因此，你可以在系统上安装
    VirtualBox，然后启动 ERPNext VirtualBox 镜像，通过浏览器访问 http://localhost:8080，使用凭据（admin
    和密码）登录。


    当公司做大并意识到需要管理资源时，已经太晚了。所以为什么不提前计划并有机增长呢？


    我们将探索开源 ERPNext 如何帮助你管理公司的资源。无论你是小企业还是大企业，这并不——都需要管理资源。ERPNext 提供了从 CRM 到人力资源以及会计管理的各种工具。我们使用
    Ubuntu 14.04 LTS 作为 ERPNext 存储主机。


    安装 ERPNext 的另一种方法是通过 GitHub 上的自动化脚本。只需打开命令行提示符并输入以下命令：


    ```bash

    wget https://raw.githubusercontent.com/frappe/bench/master/install/setup_frappe.sh

    sudo bash setup_frappe.sh --production

    ```


    首页看起来简洁，选项隐藏在不同的章节下![](img/572ad2c12aa08801c9a4044d6a88fdc5_29_1)


    ## 设置用户和权限


    在安装了 ERPNext 并填充了基础数据后，下一步是设置系统中的用户及其权限。ERPNext 使用基于角色的权限系统，你可以根据角色分配权限。添加新用户，前往
    Users/Permissions。点击用户链接，你将看到用户列表。点击左角的 New 按钮。注意名称和邮箱是必须的。输入详情后点击 Save。页面将重定向到用户详情，你可以在那里设置角色。你还有设置密码第三方身份验证的选项。


    ## 系统设置


    下一步是个性化设置。前往 Settings，你将找到所有可用设置。第一个是 System Settings（系统设置），允许你设置语言、日期和首页显示的模块。下一个是
    Naming Series（命名系列），你可以在那里设置事务的命名系列。


    ## 导入数据


    如果你已经从之前的安装或列表中某些 ERP 相关数据，可以轻松导入。只需前往 Setup/Data Import  CSV 文件并按照说明操作![](img/572ad2c12aa08801c9a4044d6a88fdc5_30_png)


    # ERPNext 教程


    ## 显示/隐藏功能


    ERPNext 允许你管理首页上显示的应用程序以保持界面整洁。通过勾选或取消勾选复选框隐藏所有应用程序，应用程序将从页面移除![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_0.png)
    ![](88fdc5_31_1.png)


    ## 04 价格列表


    所有你需要采购的产品和物品，以及你的组织销售的成品，都有与之关联的价格。现在价格不再仅仅是成本函数；还有其他因素如需求和运输成本。在动态场景下，它用于设置不同的参数。ERPNext
    支持价格列表，你可以从 Buying/Selling/Setup/Price 章节轻松访问它们。查看价格列表，有两个默认列表可用。


    ## 06 建立品牌


    品牌是业务非常重要的一个方面。正如人们所说，即使你很小，与外部实体沟通也很。ERPNext 有一个名为 Print Format（打印格式）的功能可以帮助你实现这一点。打印格式定义了文档类型的格式。你可以自定义布局，它会自动获取
    Print Format 中的表单。开始之前，前往 Setup>Printing and Print Format 添加新的打印格式。点击编辑器中的 New
    按钮。在下一页，选择此打印格式适用于文档类型。你需要为格式编写 HTML，你可以使用 Bootstrap CSS 框架和模板设计器。现在点击左角的按钮。填写详情并勾选类型复选框。点击
    Save，你将看到列出的新价格列表![](img/572ad2c12aa08801c9a4044d6a88fdc5_31_2.png) ![](8fc5_31_3.png)


    ## 05 工作流


    工作流是组织不可缺的一部分，ERPNext 让你在这个领域定义。让我们看看如何根据角色实现工作流：首先要 true工作流适用于 ERPNext 中的文档类型，因此你需要知道工作流基于哪个文档。前往
    Setup>Workflow，然后点击 New workflow 按钮。接下来输入工作流名称和文档类型。你需要设置工作流的状态，允许在该状态下编辑工作流。例如，在典型的应用程序工作流中，状态将是（approved）、待定（pending）或拒绝（rejected）（默认状态可用，允许通过编辑行添加新的工作流状态）。下一步是添加转换规则，即改变工作流状态的步骤——例如，转换将将应用程序的状态从待定变为已批准。


    ## 07 购买


    背景设置好，让我们通过销售产品来处理基本的业务功能。在企业中，你需要管理这两件事，而 ERPNext 需要做到。在首页上，点击 Buying。第一个选项在
    Suppliers -> Supplier 下——这充当供应商数据库，你可以在这里添加供应商。一旦点击 New，就可以根据他们的基本信息、联系详情和沟通创建采购订单、收据和发票。这一步步过程涵盖了与供应商相关的所有内容。接下来是
    Material List（物清单），帮助你列出对原材料的需求，随后是 Supplier Quotation（供应商报价）和 Purchase Order（采购订单）。这是查找或添加你需要采购的原材料列表的最简单方法。

