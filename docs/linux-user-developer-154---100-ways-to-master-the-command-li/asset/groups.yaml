    ## 制作 Pi 手套 – 第一部分


    制作你自己的可穿戴科技手套，让控制尽在指尖。


    Pi 手套 是我们对一种可穿戴社交媒体控制手套的项目名称——下个月我们将向你展示如何制作它以及如何对其进行编程。随着 Google Glass、Android
    和苹果智能手表以及其他颠覆性技术的出现，我们今天开始使用的设备正通向一个未来，在未来我们可能可以使用其他（所有让我们能够在身体内部进行通信的小设备……）。我们这种媒介变得越自然或越符合人体工程学，我们就越可能使用它，因此，我们将使用树莓派创建一个强大的版本，并通过我们设置的硬件配置，你可以制作你自己的版本的
    Pi 手套。


    **Dan Aldred**

    Aldred 是树莓派认证人员，也是 CAS 的首席教师。他热衷于创建和破解此类项目以吸引他所教的学生。


    ### 01 剥线并准备电线

    从每根母对母仔线中选择一根并去除绝缘层。这可以通过对塑料外壳施加一点压力来实现——你可以用牙齿，但最好使用钳子！末端现在将由一个小小的金属销钉组成。使用相同的方法准备其他电线。


    ### 02 将电线连接到按扣上

    下部分有点棘手，请花时间处理电线。首先，你需要将电线连接到按扣上，按扣将另一端穿过手套。一旦两个按扣合在一起，电线就固定了。如果你将手套的每个手指反向翻转然后将按扣推进，这样会更容易。这一步的关键部分是确保我们保持连接。


    ### 你需要什么

    - 树莓派 Pi A+

    - 服装按扣

    - USB 扎带

    - 手套

    - USB 电池充电器

    - Pi 摄像头模块


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_67_0.png)

    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_68_0.png)


    ## 03 检查电线就位


    手套的四个手指和拇指上各连接了一个电线/按扣组合。拇指在与其他金属手指按扣接触时形成地线（或接地）连接。


    Pi 摄像头安装在手套上，这使你能够调整手腕角度并拍照。


    ### 04 添加 Pi 摄像头


    Pi 摄像头安装在手套上，这使你能够调整手腕角度并朝着手面向的方向拍照。在手套的拇指处开一个小孔，大小要足够让镜头穿透即可。在 Pi 摄像头手套上，你会发现四个孔，使用这些孔和扎带将摄像头固定在手套的织物上。


    ### 05 连接 Pi 摄像头电线

    将手套反向翻转，这样就可以接触摄像头的背面。拿起摄像头连接线，蓝色侧远离摄像头，并将扎带固定在摄像头背面。在树莓派上，向上滑动摄像头支架并将电线固定到位。你可能想将电线穿过手套的侧面以隐藏它。


    ### 06 检查点

    在此阶段，你已经将五个按扣分别连接到电线并穿过每个单独的手指，或者连接到拇指上。这些电线通过手套的内部或外部连接到树莓派。Pi 摄像头也连接在手套上，镜头暴露以便拍照。


    左侧：我们将摄像头放在手背上，但你可以把它放在任何喜欢的地方。


    wpa_supplicant 是一个控制无线连接的后台程序。它同时支持 GUI 界面。在保存文件时，wpa_supplicant 通常会检测到发生了变化并尝试连接网络。


    ### 07 安装树莓派

    使用小扎带和位于手套顶部的孔将树莓派安装在上面——这使得手套变得更便携、更舒适，并让 SD 卡远离你的手腕。将扎带穿过手套的孔，固定树莓派到位。不要扎得太紧。


