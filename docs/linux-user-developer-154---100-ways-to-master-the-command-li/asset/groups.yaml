  - '[PAGE 92]


    I now have shares on both CentOS and the Pi and mount both of them from the F22
    box. Initially I used rsync/ssh from F22 from the CentOS to the Pi end. The existing
    share, samba at the Pi which I have been using for a while, is basic, and has
    the new share on the Pi.


    # It sounds like what you''re doing is following symlinks from the backup directory
    rather than having them change in unexpected ways


    ```

    $ rsync -av -e ssh /mnt/abc/ /mnt/abc/pi8176.145.162./ext/sharing/habc/

    ```


    This way, you don''t need to mess around with samba and such, and the files will
    copy as expected without the slash in front of it!


    all good. But that is not what I wanted. I wanted to copy from one share to the
    other:


    to find a way of querying the current session within the shell script to see if
    it was as an us and then act accordingly. Many thanks!


    ```

    $ rsync -av -e ssh /mnt/abc/ /mnt/abc/

    ```


    # Who are you


    This works, but all the files on the Pi are created with a "u" in front of the
    name. What I wanted was. Any ideas why this is happening?


    I am attempting to work out whether a user''s current shell is a "direct" link
    from the login prompt or which is of another user. The requirement is to have
    a shell script that only needs to output on a direct link and not after an us.


    There is actually a command you can use for this kind of situation, as "who am
    i". You enter it into the command line as:


    Ernest Lin


    You seem to be going about this fairly long way - all you need to be doing rsync
    the files from the CentOS to the Pi.


    +   - who am i


    and it will produce the current user in the terminal, as well as some basic details
    such as the current time according to that user.


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_92_0.png)


    Above Whoami is an incredibly simple tool, but it does have its uses'
