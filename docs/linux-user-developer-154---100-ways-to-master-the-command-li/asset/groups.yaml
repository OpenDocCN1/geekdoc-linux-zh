    # Solus Beta 2


    Solus 是一个从零开始的全新亮相，配备了名为 Budgie 的全新桌面环境，其设计理念是“开箱即用”。


    如果你觉得这个名字听起来很熟悉，是因为操作系统背后的开发者 Ikey（来自 Linux Mint Debian 版）曾于 2012 年发布过名称类似的初版：SolOS。遗憾的是，SolOS
    在 2013 年停止了，这非常令人遗憾，因为它被 Linux Mint 取代了，而 Ikey 认为 Linux Mint 应该出现在 Mint 的 Debian
    版本中，而且那是一个非常出色的尝试。然而，Ikey 回归了——由于商标问题，年初提到的第一个名称已更改为 Solus 操作系统。虽然 Solus 和原始的
    SolOS 非常相似，但它们是两个完全不同的物种——后者基于 Debian，而新的 Solus 则是完全从零构建的。


    你首先会注意到自定义构建的桌面环境。Budgie 桌面与 GNOME 栈紧密集成，在此测试版发布中随 3.16.3 版本发布（基于 Linux 4.0.3）；它是一种令人耳目一新的现代设计，很大程度上受到
    Chrome OS 的启发，并带有一些 GNOME 的影子，非常注重实用，而不是像其他桌面那样纯粹追求审美。尽管如此，如果你想使用更传统的方法，Budgie
    也拥有 GNOME 2 主题。尽管存在一些 Bug，但你可以看到这个新桌面具有巨大的潜力，而且它不可否认地漂亮——如果你想在主电脑上测试它，可以在某些仓库中找到它。Budgie
    还为你提供了相当的配置和控制能力，而无需——


    | CPU 64位 |

    | --- |

    | 内存 1 GB |

    | 存储空间 4 GB |


    > Solus 适用于桌面端且仅支持 64 位，专注于设计、直观性和软件集成，以演进抽象发行版的概念。


    上方是有一个可以帮助你上手的欢迎界面，尽管目前 Solus 的软件还比较匮乏，需要安装其他工具，以便你在图标和 GTK+ 控件之间切换，并根据你的需求自定义面板。Solus
    首次推出的功能较少，但对于一个处于无限阶段的测试版发行版来说是可以理解的，它还使用自己的包管理系统（基于 Pack），并且运行非常快。尽管仍然有些混乱，但有一些预装的必备软件，如
    Thunderbird、Discord、Firefox（目前极易崩溃）以及如 Gear、VLC、Python 和 Transmission 等简洁的应用。头部还带了软件中心，你可以看到这正在进行中——Vim
    和 Emacs 等经典程序可用，还有像 Keepass 和 LibreOffice 等程序，如果它们还没有被正确分类，你将需要手动搜索最新版本。但如果你想超越初始发布，你必须等待
    Solus 成熟——具体来说，就是等待更多的包下载到 Solus 的仓库中。


    Solus 项目正在迅速成长，对用户请求和错误报告的响应极快。此版本添加了 UEFI 和 NVIDIA 驱动支持，并且 7 月 10 日发布的新版本有了清晰的路线图。Solus
    还旨在为开发者简化工作，`yok` 工具本身就简化了打包过程。正如 Solus 背后的通用哲学——它专门用于桌面且仅支持 64 位，专注于设计、直观性和软件集成，为家庭用户提供了一个可靠的系统，首次启动时几乎不需要配置或解释。但这是什么？一个能更好地关注其……的基础操作系统


    # 优点


    制作精良，旨在减少开发者工作量的独特打包系统，以及出色的开箱即用配置。


    # 缺点


    软件不足，一些系统性的缺陷有待开发，尽管这符合测试版的预期。


    # 总结


    开发者和玩家可能想要等待硬件和软件支持。我们使用的是浅色主题，尽管 Solus 带有一些 Bug 但已经就绪——尽管如此，它仍然是一个我们推荐尝试的优秀发行版！


    Goven Thorne


