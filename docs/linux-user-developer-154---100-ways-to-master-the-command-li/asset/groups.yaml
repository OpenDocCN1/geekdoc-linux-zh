    07 Get the app\On your Android device, go to the Play Store and look for VNC Viewer
    (you can also install it from the store via this link: bit.ly/3CrbRJU). Install
    it to your device and run it to connect to the Raspberry Pi. We can now try to
    connect it to the Raspberry Pi.


    08 Raspberry Pi IP

    We need the IP address of your Raspberry Pi so we can connect to it. You can get
    it via two methods - we preferred method is to open the terminal and use `ifconfig`
    to list the status of the Pi''s network interfaces; this will include the IP address
    of whatever is connected. If you are using wireless, you can also access the wireless
    config interface (iwconfig) and see what has been assigned as ip.


    09 Connect to the Pi

    Now that we have the IP address, we can connect to the Raspberry Pi. Open the
    ''+'' sign to set up a new connection. Leave the name field blank, enter your
    IP address and click Save Password. It will ask for the password when you attempt
    to connect, after which it will save and not require it in the future.


    10 Use VNC

    If this is the first time you are using VNC software, you will notice there can
    be a lag between what you do and what happens on-screen. Luckily, you can use
    your finger to move the mouse and tap to click, and the Keyboard can be used as
    well. It takes a bit of getting used and is not good for anything that you need
    to do, but it''s very useful.


    11 Turn off last

    Killing the VNC server, as we talked about in Step 5, can still be done when disconnected
    - your Android device will disconnect. The issue also occurs if you turn off the
    Pi. If you disconnect the VNC client from the Pi though, the server on the Pi
    will still be turned on; this means that you can at least reconnect at any time.


    12 Turn server on startup

    Currently, every time you turn on the Pi you''ll have to turn on the VNC server.
    There''s no config setting or service setting that we can set it to turn on by
    default, so do that we need to write a script. Create a file using nano in the
    terminal at the following location:


    ```

    $ sudo nano /etc/init.d/vncserver

    ```


