    # # Master the command line


    # # SEARCHING

    WITH GREP


    # # DEVELOPMENT

    TIPS


    > > **Search within files using the grep command** to save time and **find what
    you need**


    > > _Some terminal tricks for devs to help your command line skills become more
    efficient_


    +   - **_049 Search for a term**


    The basic use of grep is to search through a file for a specific term. It will
    print out every line that contains the term. You can also use it with multiple
    files with content. Use with:


    +   - **_050 Check for lines**


    Looking for specific lines in a file is hard to start to hunt when you realize
    the file is hundreds of lines and you realise it by using grep to print out all
    the lines you find. You have the notion:


    ```

    grep -n hello

    ```


    +   - **_051 Regular expressions**


    If you need to make more advanced searches, you can use grep expressions. You
    can use regular expressions like ^hello to look for lines that start with hello,
    or hello$ for lines ending in hello:


    +   - **_052 Wildcards**


    When searching for characters, you can use wildcards to find similar terms. This
    is done by using a full stop in the search string each stop represents one wildcard.
    Searching for h.a will return any line with h followed by a in the string. You
    can use it like:


    ```

    grep "h.a"

    ```


    You''ll be able to find something without beginning with a specific string but
    with no length. You can do this in grep by using an asterisk (*) with the dot.
    In the above example, we would have used h*o.


    +   - **_054 Stop a system service**


    A system service is kind of background software that launches at startup. These
    are managed by the system management daemons and can be controlled from the terminal
    with the service command. If you need to stop a service:


    ```

    sudo service stop name

    ```


    +   - **_055 Start a system service**


    You can start services that have been stopped by using the same service command
    with a different operator. As long as you have the permissions, you can start:


    ```

    sudo service start name

    ```


    +   - **_056 Restart a service**


    This is one way of setting up web servers that for Apache, which may need to be
    restarted after may other services that you customize the way along. Instead of
    stopping and starting sequentially, you can restart services by:


    +   - **_057 Know the ID**


    The ID that you can get for service can be used to kill it, but what if the process''s
    having trouble itself or using too many resources. With the ID, you can:


    ```

    kill 1234

    ```


    +   - **_058 Kill multiple IDs**


    Sometimes a process can be split into multiple IDs (this is usually the case with
    browsers, which are notorious for having multiple processes at once). You will
    need to kill all the IDs, and you can try and quickly kill the process with:


    ```

    killall -v process

    ```


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_19_0.png)


    +   - **_059 List connections**


    The standard command for listing the network connections and details in the terminal
    is ifconfig. It will list all of your interfaces. If you need to list a specific
    name, or for the wireless interface, you can:


    ```

    ifconfig wan

    ```


    +   - **_060 List USB devices**


    You need to know which USB related devices are connected to a system, or find
    their position. You''ll need to install it first, but then you can use it to list
    in the terminal of all the devices:


    ```

    lsusb

    ```


    +   - **_061 List drives and partitions**


    Whether you need to check the designation of drives for certain works, or you
    just to get a general understanding of the system''s layout, you can use fdisk
    to list all the drives in the terminal with:


    ```

    fdisk -l

    ```


    +   - **_062 Check running software**


    Sometimes you''ll want to check what''s running on your system and from the terminal
    this can be done with top. It will list all the information you''ll need about
    your current usage, such as CPU and memory usage, with the ID you can control
    it.


