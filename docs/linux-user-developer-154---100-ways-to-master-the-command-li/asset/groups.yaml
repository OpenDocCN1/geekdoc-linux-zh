    # Cheap as CHIP


    Hello. Do you know when the CHIP computer is coming out and why it''s so cheap?
    It''s almost a third of the cost of the Raspberry Pi?


    Hello Mark. Well, Next, the company behind the CHIP really went all-in on their
    Kickstarter campaign (they raised over $2M on a 50% target) and are focusing on
    production. The CHIP will definitely be available to buy for everyone who didn''t
    crowdfin the tiny computer, Next Thing hasn''t really missed a beat. At the time
    of writing, the pre-orders aren''t live yet (nextthing.com). As in all likelihood
    we''re looking at early summer 2016, but given the success of the Kickstarter
    there is a chance that might be buried under such a


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_93_1.png)


    CHIP that a May 2016 launch, when the backers get their CHIPs, could be a possibility.

    Actually leads nearly onto your question - according to Next Thing, the reason
    that the CHIP is so cheap is essentially to do more with less. They are producing
    these single-board computers at incredibly high volume and that means they can
    get better prices on the components, is how they offer the basic CHIP for $9.
    With the Kickstarter doing so well, Next Thing


    should be buried under a mountain of these things! That is, you will probably
    end up paying more for your CHIP - the shipping alone is just one sort, pushing
    the price up by $20 for backers of the plus. You also need to pay for a VGA adapter
    and $25 for an HDMI adapter, bringing it even closer to the Pi''s price point.
    We are still, however, interested in how the latest Linux SBC fares the hobbyist
    and education markets!


    94


    Teim'
