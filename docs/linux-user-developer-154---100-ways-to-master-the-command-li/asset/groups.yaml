    # Android VNC


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_66_0.png)


    Above it''s simple enough to get around the GUI using your phone, but for extended
    bounds of testing, consider a portable Android keyboard


    # 13 Write the script


    This script will do everything we need to do, but be sure to edit the resolution
    for your specific use case:


    ```

    !/bin/sh

    export USER="$USER"

    # parameter for tightvncserver

    DISPLAY=":0"

    DEPTH="16"

    GEOMETRY="1920x1080"

    NAME="vncserver"

    OPTIONS="-c $USER -depth $DEPTH -geometry $GEOMETRY"

    case $1 in

    start)

    /usr/lib/init.d/functions

    log_action.begin_msg "Starting vncserver for user $USER on localhost:{$DISPLAY}"

    $OPTIONS

    stop)

    log_action.begin_msg "Stopping vncserver for user $USER on localhost:{$DISPLAY}"

    $USER -c /usr/bin/vncserver -kill {$DISPLAY}

    restart)

    $stop

    $start


    esac

    exit 0

    ```


    # 14 Download it


    We''ve got ready for you to download and put right into the /etc/init.d directory.
    You can download it using:


    # Other VNC clients


    ```

    $ wget http://www.linuxserver.co.uk/wp-content/uploads/2015/08/vncserver.zip

    ```


    Unzip and move it to the correct folder, then make any modifications you want
    before heading to the next step.


    You can use this setup with system - a PC client that you can put VNC on. It will
    use the same device (such as resolution and color depth), and you will have a
    separate screen to work with. This can be a good way to connect to a server Pi
    or similar.


    # 15 Make the file executable


    Once the script is right, customised to your liking and saved, now need to make
    it executable. To do this:


    ```

    $ chmod +x /etc/init.d/vncserver

    ```


    As long as it is in the right place and properly, make it executable. It is also
    good to remember in general as it enables you to make any script executable.


    # Update and test


    The final step is to update the file.rc (which handles startup scripts) so that
    it knows our new script is there with the following:


    ```

    $ sudo update-rc.d vncserver defaults

    ```


    You can then test it by using the following to make sure it works and turn it
    on for this session:


    ```

    $ sudo /etc/init.d/vncserver start

    ```


