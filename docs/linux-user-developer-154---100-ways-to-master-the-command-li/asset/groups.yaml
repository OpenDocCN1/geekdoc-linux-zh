    # ROBOTICS


    # # PiBorg UltraBorg


    Designed for Raspberry Pi robotics projects, does the expandable UltraBorg deliver
    on its promises or let us know?


    Designed for the Raspberry Pi compatible with any microcomputer or microcontroller
    that can speak I2C—including primary Arduino—PiBorg UltraBorg is built with one
    task in mind:


    The majority of hobbyist-level projects use pulse width modulation (PWM) to move
    the robotic parts, and ultrasonic sensors, which send out a pulse of noise and
    listen back to the echo to measure distance to solid objects. Combined, this helps
    you build everything from a simple two-wheel robot to a more complex robotic arm,
    or even computer vision, aided by


    | Type | |

