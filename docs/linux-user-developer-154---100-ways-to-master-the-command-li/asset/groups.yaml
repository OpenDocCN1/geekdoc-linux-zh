    \ different techniques that can be used to maximise your performance. There are\
    \ several categories of optimisation that you could look at, but the first step\
    \ is to have code that works correctly. You only do the minimum amount to get\
    \ the performance you need. Any extra work is wasted, unless it is a learning\
    \ opportunity.\n\nIf you can't shift to C, then you can try to see if there is\
    \ a way to avoid object items. If you use a list of objects in a loop, Python\
    \ must do type checking on every call around the loop. This means that your code\
    \ is being handled in Python, change the form of the called method, and finally\
    \ reduce this overhead by assigning these classes to a new name before entering\
    \ the loop. All of this type of checking is done once outside the loop. See the\
    \ following code:\n\nThe structure that NumPy provides for the array. Array is\
    \ like a list, except that it contains only elements of the same type, and it\
    \ is built in C so everything is built within NumPy. Arrays are treated as a single\
    \ data element, so type checks only to happen once for the entire array, which\
    \ is what allows you to run through the elements so quickly. In regular Python,\
    \ you would use a loop like:\n\n```python\nfor index in range(50):\n    c[index]\
    \ = a[index]\n```\n\nwhere a and b are vectors of length 50. In this case, every\
    \ time you run through the loop for a[index] and b[index], there is a bit of overhead.\
    \ By using NumPy and the provided array data functions, you can reduce this by:\n\
    \n```python\nc = a + b\n```\n\nThis makes the code much cleaner. It only involves\
    \ a single type of element, so you can see whether a and b can be added. The actual\
    \ operation is then passed off to a C library, which is built from linear algebra\
    \ libraries like BLAS and LAPACK. This provides a substantial speed increase because\
    \ you can take advantage of all the optimisation that NumPy provides.\n\nJoey\
    \ Bramer is a true menace to the amount of Python. He works with researchers on\
    \ scientific computing problems and Android.\n\nWhy Python?\nIt's the language\
    \ of the revolution. Read the docs at python.org/\n\nThe first item to look at\
    \ is how strings are handled. Strings are immutable sequences of characters. This\
    \ means that when you want to change a string, you must make a new string and\
    \ copy the old data into the new memory. If you are programmatically building\
