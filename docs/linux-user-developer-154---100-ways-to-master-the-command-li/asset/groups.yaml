  - "[PAGE 67]\n\n# # build a Pi Glove – part 1\n\nCreate your own Wearable Tech glove\
    \ that places control at your fingertips\n\nThe Pi Glove is our project name for\
    \ a wearable, social media-controlling glove – we're going to show you how to\
    \ build it and how to program it next month. With the advent of Google Glass,\
    \ Android and Apple smartwatches and other disruptive technologies, the devices\
    \ we're beginning to use today towards a future where we may well day one other\
    \ (all the gadgets that enable us to communicate with each other (inside our bodies...).\
    \ The more natural or ergonomic this medium we become, the more likely we are\
    \ to use it, so we're going to use a Raspberry Pi to create a powerful version\
    \ of one and the hardware setup we set up that you can make your own version of\
    \ the Pi Glove.\n\n**Dan Aldred**\n Aldred is a Raspberry Pi Certified and a Lead\
    \ School teacher for CAS. He is passionate about creating and hacking projects\
    \ like this to engage the students he teaches\n\n+   **01 Strip and prepare the\
    \ wires**\nEach the female-to-female jetty wires, select one and remove the insulation.\
    \ This can be done by applying a little pressure on the plastic cover – you can\
    \ use your teeth but it's better to use a set of pliers! The end will now consist\
    \ of a small metal spike. Prepare the other wires using the same method.\n\n+\
    \   **02 Attach the wires to the poppers**\nThe next part is a little tricky,\
    \ take your time to work through the wires. First, you need to connect the wire\
    \ to the popper pinning the other end through the glove. Once, close the two poppers\
    \ together, the wire is secured-in. This is easier if you turn each glove finger\
    \ inside-out and then push the popper through. The key part of this step is to\
    \ ensure that the we deays connected.\n\n+   **What you'll need**\n* Raspberry\
    \ Pi A+\n* Clothes poppers\n* USB cable ties\n* Glove\n* USB battery charger\n\
    * Pi camera module\n\n![](img/572ad2c12aa08801c9a4044d6a88fdc5_67_0.png)"
