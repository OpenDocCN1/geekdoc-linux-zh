    You can use Mplayer to control the command line to. It''s good for testing a video
    with different settings that you can affect. You can also control the video with
    keys - specifically, you can pause using the space bar:


    In the terminal you find yourself a little lost in the filesystem, or you want
    an easy way to put your current location into something else. You can use pwd.


    When moving between directories you might be able to quickly back to the previous
    one you were using. Instead of cd for every directory, you can use pushd to move
    and create a ''stack'' of directories to move between.


    +   >081 More video control


    Mplayer has a few more controls than playing in the terminal. You can use Enter
    to skip the next item in the list, and otherwise, you can stop playback by using
    Ctrl+C to end the process.'
