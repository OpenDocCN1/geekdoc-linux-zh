    In its short life so far of just over three years, the Raspberry

    Pi has been an absolute game changer – not just as a piece

    of reduced hardware, but by nurturing a community of

    like-minded individuals with a common goal: learning and\making awesome stuff!

    We cannot count the number of times we have browsed over

    the Raspberry Pi blown away by the brilliance of

    a new project. From Portuguese making

    tip rings, there are a lot of incredible projects out there – more

    an more every single day. When people ask what they

    ido with a Raspberry Pi and it is actually difficult

    to articulate an answer to that question, the case is so

    broad that it is hard to do Raspberry Pi justice.


    When comparing the Raspberry Pi to your average off-

    shelf computer or mobile device, the brilliance of the Raspberry

    Pi comes down to its upgradability and the amount of

    customization that is possible. With a smartphone or tablet you

    get a trendy style or cool headphones to go with it, but

    both in software and hardware. A lot of projects you look

    at


    Here we take a look at ten of our favourite Raspberry Pi

    upgrades, which will bring your ideas to life and save

    as some inspiration for your next project!'
- md: '

    # Ras Pi upgrades


    ## Fully protect your Pi


    ### Short Crust Plus

    $8.99 / $15.95 Available from: bit.ly/1c1fbw


    The Raspberry Pi is a durable and reliable little computer, especially when you
    consider that it is just a populated circuit board with real protection. However,
    there may be times when you want to give your Pi a nice shell. Maybe because you
    want your Pi-based home theatre to look more sleek next to all of your electronics,
    or maybe you just want to keep the dust off your tiny computer when carrying it
    in your pocket.


    The Short Crust Plus is one of our favourite cases for the Model B+ and 2B Raspberry
    Pi due to its sleek design and affordable price. It is also easy to use – the
    Pi snaps into inside the case and the lid clicks into place. Each case comes with
    a set of self-adhesive rubber feet and a few magnets to allow you to increase
    the height of the case to accept any add-on boards you might be using.


    ## Portable & solar power


    ### PiJuice

    £25 / $39 Available from: bit.ly/1fb1my


    You can now hold of an elegant little add-on board that lets you take your projects
    off-grid and away from mains sources. PiJuice is compliant with the Raspberry
    Pi HAT (Hardware Attached on Top) specification and uses a simple bolt-mount method
    to provide intelligent charging and power circuitry, to make your Pi truly portable.
    There''s also a version called PiJuice Solar that is capable of taking inputs
    from renewable energy sources.


    PiJuice also features a powerful ARM Cortex M0 processor that provides deep sleep
    functionality, a real time clock, watchdog timers and plenty of other useful features.
    The firmware and GUI (graphical user interface) with the PiJuice come with the
    common ACP (Advanced Configuration and Power) system to provide up to 5A for high
    integration with Raspberry Pi. Raspberry only uses one I2C sense pin is left free
    for use with other devices, with its compact design making it extremely simple
    to add other HATs or add-on boards on top. PiJuice will enable you to make a variety
    of awesome projects – check out the Instructables page: bit.ly/2coeEE


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_52_0.png)


    ## Feature


    ## Power switch & file-safe shutdown


    ### Pi Supply Switch

    £15 / $23.10 Available from: bit.ly/1RXHR0n


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_53_0.png)


    The Raspberry Pi has been so popular, in part, because of the extremely good value
    for money of the hardware. It packs a lot of punch for the price point, and because
    it is designed by a charity, they do not intend to inflate the price with high
    profit as many do with a commercial product. Unfortunately, with any low-cost,
    some compromises had to be made to keep it in such an affordable and small form
    factor.


    The Pi Supply Switch is a self-locker kit which provides an on, and soft-off-file
    shutdown to give you power management freedom. With provided sample scripts you
    can make when Pi is shut down when you switch off to the media or resolve any
    issues in the terminal - and the only circuitry ensures that power is only removed
    after the Pi has been shut down. A more reliable shutdown method reduces the possibility
    of corruption to your SD card from pulling the cable.


    When comparing it to your more standard desktop or laptop computer, one thing
    that it is obvious: looking for a power switch with management functionality.
    it is surprising how something as simple as a power switch can be very useful,
    and it is not to do until you have that you realize this!


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_53_1.png)


    ## See in the dark with infrared


    ### NoLoR Infrared Camera

    £16.80 / $29.95 Available from: bit.ly/9QyeC4


    The CSI connector on the Raspberry Pi (between the 3.5 mm jack and HDMI connector
    on the most recent models) allows you to connect a camera module directly without
    the need for a USB webcam. The camera modules that you can use here plug and play,
    and as would expect from the Raspberry Pi foundation, they come in an incredibly
    small factor - a weighting in around three grams (not including cable) - 24x9mm.


    As you would expect, there is a ''normal'' camera module on and, by we mean one
    that captures light with some impressive s- a 5MP fixed focus camera, which supports
    1080p, 720p and 640p full speed with a bit-filter. But when the camera module
    was first released, some people were not happy with a visible light camera and
    had some other (very applications in mind - they asked to swap the tiny camera
    before putting it all again. Pairing which works beautifully voids the variety,
    but so many do doing it that the Raspberry Pi foundation took note and started
    doing it, themselves.


    There are some fairly common nighttime uses for infrared, and if you pair your
    NoLoR with infrared LEDs it could check out the Bright Pi board. Then you can
    easily set up a night vision security camera or a monitoring setup. Perhaps most
    amazingly, if you used the camera in the daytime, it can actually be monitor the
    health of green plants [bit.ly/2QznFG].


    # Ras Pi upgrades


    ## Movement for your camera


    ### Pi-Pan Tilt Mechanism

    £45.99 / $39.99


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_54_0.png)


    The camera module on the opposite of the page are some essential upgrades to have
    in your Raspberry Pi toolbox, but what happens if you want to move the camera
    around to get a different viewpoint? would be useful in multitude of projects,
    such as a robot with an interactive interface (many cameras already have feature);
    Open Electronics is a pan-tilt mechanism that lets your camera move by 110 degrees
    from top to bottom and 180 degrees from left to right. The set includes a combination
    of hardware and software, the servo motors required for actuation and movement
    for the camera. On the software side, there are libraries in Python and Scratch
    which is easily enough for most projects. One of the most impressive applications
    you could use for this is OpenCV-based motion detection and face tracking. Check
    out the openelectronics.com forum for links like a truly great project to try.


    ## High quality audio for your


    ### HiFiBerry DAC+

    £30 / $34.99


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_54_1.png)


    As an educational tool, HiFiBerry is pretty much unparalleled by the support of
    the very large community that surrounds it. As a high quality device, however,
    you may think it is lacking of the fact it only has 3.5mm jack that can be turned
    for high fidelity. Due to its low cost, small footprint and its ability to act
    as a home media centre, music and video streaming server or much more, you have
    probably dreamed of using it taking your audio to the next level. The news is
    better that the folk at the Raspberry Pi Foundation, from the second revision
    of the Model B, have provided the I2S pins; initially on the PWM header, and now
    on A+, it is available on GPIO18. I2S is a communications protocol specifically
    designed for audio devices and has enabled a number of companies like HiFiBerry
    to create audio devices for the Raspberry Pi. The HiFiBerry DAC+, is an add-on
    which brings high resolution (192 kHz, 24-bit) Burr-Brown digital-to-analog converter
    to it. It is hardware volume control using Mixer, among many other features, and
    it is a HAT. It works plug-and-play out of the box with the latest Raspberry firmwares,
    and works with all the popular operating systems for standard audio devices-LEC,
    Volumio, Pi MusicBox and many more. If you are serious about your audio quality
    and want a high quality, low cost, Internet-connected solution, you no longer
    have any excuses—you can build your own for under $100!


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_54_0.png)


    ## Feature


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_55_0.png)


    ## Super power displays


    ### PaPiRus ePaper HAT

    £30-65 / $47-102


    As computers of all sizes and powers are now being embedded into pretty much everything,
    electronic parts have become more commodified and, arguably, this is filtering
    down to display technology as well. Now have a wealth of offerings from your standard
    monochrome LCD to TFT, LED and AMOLED displays.


    One of the most exciting and disruptive display technologies of recent times is
    ePaper/ink. You probably know it as the screens that your Kindle readers or MobiFun
    use, the refreshable display is commonly referred to an epaper watch, it actually
    uses a Memory Card and a very clever marketing tactic. You might have wondered
    in the past why your iPad lasts five hours on a charge but the answer is that
    the e-ink only uses power to update what is on the screen, which means for a large
    number of applications where you don''t need to change contents often, it saves
    a lot of battery. It could be used for reading novels, shopping lists or for static
    displays, digital price tags, bus train station signage and many other applications,
    it is by far the best choice.


    PaPiRus is the low power epaper display technology you know lo the Raspberry Pi.
    In a hat-compatible format with screen sizes ranging from 1.4 to 2.7 inches. The
    epaper film used in these is actually identical to that in the popular e-readers
    mentioned above. You can get your hands on one for under £35 and they come with
    a useful Python and command line framework. They are worth trying if you have
    display-driven projects!


    ## High definition


    ### 10.1” Display & Audio

    £110 / $154.95


    Finding the right for your display project can be of pain. We have chose the HDMIPI
    in a previous issue (1/6), which is a fantastic 9-inch screen for the Raspberry
    Pi it was really widely successful on Kickstarter (link).


    If you want to thing one that can''t be missed, Adafruit has a 10.3-inch screen.
    It features a beautiful white display with highly tap 720 resolution IPS display
    with a wide viewing angle. It has tables to easily flush-mount in your project
    and different sorts like HDMI, VGA and Composite. Parts best of all, this display
    kit also enables you to connect directly 2-, or 8-ohm speakers without the need
    for a display amplifier or externally powered unit right away.


    It is not the cheapest display at $155 on the Adafruit site, but if you need a
    high quality display project in your ner then you should avoid native display.
    We are already dreaming of a dedicated multiplayer emulator arcade with built-in
    stereo audio, and we''re sure we can come up with some cool applications!


    ![](img/572ad2c12aa08801c9a4044d6a88fdc5_55_1.png)

