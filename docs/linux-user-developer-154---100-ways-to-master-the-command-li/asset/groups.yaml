    # Choosing a RAID type


    Left Striping, to the left, splits data across drives, whereas mirroring duplicates
    it. RAID comes in different types, each numbered starting from 0. The higher the
    number, the more complex the system will be (apart from RAID 10, which is a common
    abbreviation of RAID 1+0). Choosing a type depends on your needs, and the importance
    of preserving the data that will be stored on the drives. For most uses, RAID
    0 and RAID 1 techniques are the best. They allow you to increase read speed or
    create a larger drive than any single drive. However, any failure can be easily
    fixed by using multiple drives and RAID 6 allows for more storage while still
    having redundancy and backup up to lower levels.


    # Striping and mirroring


    At core, RAID 0 allows you to join two drives of the same size or use the storage
    of both to create one larger drive than any single drive can. It is simple and
    such, which is illustrated as stripes. The benefit you get from RAID 0 is speed,
    however if one drive failure you lose all data.


    RAID 1 is about increasing the size of one hard drive by combining them, you create
    a dedicated backup for the hard drive with each piece of data twice. Speed increases
    is the same as any one drive (the RAID array deals with duplicating the data once
    it''s written).


    RAID 0 and 1 can be combined into RAID 10, which offers both mirroring and stripping.
    It requires at least four drives to work, and always needs an even number of hard
    drives. By having pairs of hard drives that are paired as RAID 1 (mirroring),
    with each set combined with RAID 0 (striping). This nested RAID allows for both
    speed and write performance of RAID 0, the same, with the redundancy and backups
    of RAID 1. If one hard drive fails, it can be easily replaced in order to get
    the array back.


    This is the simplest way to increase storage capacity of any array, while also
    having a way to recover from hard drive failure. However, it is the most inefficient
    use of the space compared to some of the higher RAIDs. Generally, though, this
    setup could be good at home desktops and even on home servers.


