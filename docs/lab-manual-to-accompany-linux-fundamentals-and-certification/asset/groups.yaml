    - 更新 `/etc/fstab` 配置文件。


    ## 创建桌面应用程序


    ### 实验 10.1


    在 GNOME 中创建一个启动器（launcher），用于在终端窗口中启动 vi 会话。vi 程序位于 /bin 目录中。将启动器命名为 vi。


    ## 桌面工具


    ### 实验 10.2


    在 GNOME 桌面上添加一个菜单面板。将以下项目添加到菜单面板中：


    - 工具：显示桌面按钮 (Show Desktop Button)

    - 多媒体对象：CD 播放器 (CD Player)

    - 按钮对象：注销 (Log Out)


    ## 用户 cron — 命令运行于


    创建一个用户 cron 任务来监控磁盘空间。


    - cron 任务应每天下午 5 点运行。

    - 将 `df` 命令的结果写入一个文件。

    - 将该文件通过电子邮件发送到你的 sendmail 账户。


    ## 进程管理


    ### 实验 11.2


    测试终止、挂起和重启进程。


    - 创建一个测试脚本，该脚本将持续循环并在每次迭代时显示文本。

    - 挂起该脚本。

    - 检查脚本是否处于 T 状态。

    - 在前台重启该脚本。

    - 检查脚本是否已重启。

    - 终止该脚本。


