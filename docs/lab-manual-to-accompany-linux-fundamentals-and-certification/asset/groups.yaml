    \ — 计算机硬件至少两年现场服务\n- 4. **支持** — C++ 编译器至少一年电话支持\n- 5. **培训** — 培训将由系统管理员内部进行。为入门使用培训课程编制系统管理员的时间需求预算。\n\
    \n## 分区\n\n### 实验 2.2\n\n根据实验 2.1 中概述的硬件和软件规范，设计一个分区方案。以相同的方式对每台工作站进行分区。\n\n每台工作站将不超过十名用户。每个用户的源代码和数据文件不超过\
    \ 5 GB。程序的日志文件将相当大。软件所需的磁盘空间将超过 200 MB。\n\n## 硬盘安装\n\n### 实验 2.3\n\n概述将希捷 Barracuda\
    \ ATA V-ST3120023A 硬盘作为从盘安装到现有同类型硬盘上的必要步骤。包括所需工具、跳线设置和电缆连接。\n\n概述在 Linux 操作系统上设置新安装硬盘所需的步骤。包括创建分区、格式化驱动器以及将驱动器挂载到\
    \ /opt/Oracle 目录。\n\n## Linux 发行版\n\n### 实验 3.1\n\n安装 Linux 操作系统的一个发行版。使用 CD 发行版套装。选择自定义安装类型。除以下各项外，所有条目均选择默认值：\n\
    \n- 使用你的名字首字母和姓氏作为计算机的主机名。\n- 选择不启用防火墙。\n- 使用 **LinuxPlus** 作为 root 密码。\n- 选择\
    \ *shadow passwords*（影子密码）。\n- 安装所有软件包。\n\n为你自己添加一个账户。始终使用你的账户登录，并在需要时使用 `su`\
    \ 命令以 root 身份连接。\n\n### 启动软盘\n\n### 实验 3.2\n\n使用章节中概述的步骤创建启动软盘。创建启动软盘后，使用启动盘启动计算机以测试它。\n\
    \n## 创建安全账户\n\n### 实验 4.1\n\n为班上所有学生创建账户。将学生平均分成两组：groupA 和 groupB。使用名字首字母和姓氏作为用户名。遵循强密码策略。\n\
    \n### 目录\n\n### 实验 4.2\n\n在 /home 下创建两个名为 groupA 和 groupB 的目录。为这些目录分配权限，允许 groupA\
    \ 的成员完全访问 /home/groupA 目录，允许 groupB 的成员完全访问 /home/groupB 目录。其他任何用户都不应能够读取、写入或执行这些目录内的任何文件。\n\
    \n概述完成上述任务所需的步骤。测试你的权限模式是否正常工作。概述用于测试权限的任务。\n\n## 目录树\n\n### 实验 4.3\n\n绘制你的系统目录树。在树上标识所有物理分区，注明驱动器名称和分区的总大小。\n\
    \n标识以下目录和文件的用户、组所有者以及权限：\n\n- /etc\n- /var\n- /home/<your_user_directory>\n- /opt\n\
    - /boot\n- /etc/shadow\n\n## 使用 vi\n\n![](img/d6e84b412351e10580574e8217099217_17_0.png)\n\
    \n使用 vi 修改你的 bash 配置文件，以包含以下内容：\n\n- 你的脚本目录（/*home/userid/scripts*）在路径环境变量中\n\
    - 包含日期和时间的命令行提示符，位于默认行之上的一行\n- 你主目录内容的列表\n\n测试你的脚本。\n\n## 命令行基础\n\n执行执行以下命令以完成下列任务：\n\
    \n- 捕获 /etc 目录的文件列表。\n- 显示捕获的文件数量。\n- 显示捕获文件中含有字符 jpg 的所有行。\n\n## 管理任务 — 备份\n\n\
    ### 实验 6.1\n\n使用 *tar* 命令：\n\n- 创建一个包含你主目录中所有文件的新 *tar* 文件。将你的 *tar* 文件命名为 **myhome.tar**。\n\
    - 在你的主目录中创建一个名为 **test** 的新目录。\n- 将你的 *myhome.tar* 文件提取到你的 *test* 目录中。\n\n## 软件包\n\
    \n### 实验 6.2\n\n你的 Linux 发行版磁盘上有许多软件包。执行以下命令：\n\n- 列出 RPM 软件包中的文件。\n- 安装一个 RPM\
    \ 软件包。（选择 tftp-server、whois 或其他小型软件包。）\n- 更新 RPM 软件包。（你可以使用相同的软件包。）\n- 使用 rpm\
    \ 命令查询该软件包是否存在。\n- 移除该软件包。\n\n## Shell 编程\n\n### 实验 6.3\n\n创建以下脚本：\n\n- 创建一个名为\
    \ **copy** 的脚本，接受“源”文件名和“目标”文件名，然后使用 cp 命令复制文件。\n- 创建一个名为 **tod** 的脚本，根据时间显示一天中的时间以及“上午”或“晚上”。\n\
    - 编写一个脚本，根据文本文件中的用户名列表创建用户账户。\n  - 将过期日期设置为命令行中包含的值。\n  - 将初始组设置为 **mygroup**。\n\
    \n## 网络 — 子网掩码\n\n![](img/d6e84b412351e10580574e8217099217_22_0.png)\n\n使用 IP\
    \ 地址 192.168.0.0，回答以下问题：\n\n- 1. 默认子网掩码是什么？\n- 2. 要将网络划分为至少 5 个子网，子网掩码应该是什么？（不要允许多于必要的子网。）\n\
    - 3. 如果子网掩码为网络内的至少 5 个子网提供空间，每个子网中有多少个主机地址可用？\n- 4. 使用第 2 题中确定的子网掩码，列出每个子网的网络地址和广播地址。\n\
    \n## NFS 服务器\n\n### 实验 7.2\n\n修改你的 `/etc/hosts` 文件，使其包含网络上每个计算机系统的 IP 地址。\n\n\
    ## 系统配置\n\n### 实验 7.3\n\n使用 ssh 程序连接到另一名学生的计算机。连接后：\n\n- 更改你的密码。\n- 列出你主目录中的文件。\n\
    - 更改你的命令行提示符。\n- 注销。重新登录另一台计算机，确保接受你的新密码并显示新的命令行提示符。\n\n## 常见端口\n\n### 实验 8.1\n\
    \n识别你的计算机系统中哪些知名端口是打开的。识别端口以及在端口上监听的进程。\n\n"
