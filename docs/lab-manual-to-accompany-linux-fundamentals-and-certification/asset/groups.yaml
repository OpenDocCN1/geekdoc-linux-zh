    # 思科学习学院 Linux+ 基础与认证


    需要全面 Linux 认证的原因很简单：Linux 是厂商独立的。Linux 认证专业人士必须了解 Linux 操作系统的基本安装、操作和故障排除。


    Linux+ 基础与认证涵盖了所有考试要求，并在安装要求、管理基础和管理任务方面提供了坚实的基础。它还涵盖了网络基础知识，如网络地址和配置远程客户端访问、服务管理、硬件配置、安全性和故障排除。


    Linux+ 基础与认证确保你能解释基本的开源资源/许可证，展示用户管理的知识，理解文件权限/软件配置，并管理本地存储设备和网络协议。


    主要特点包括：


    - 正文部分采用双色印刷，包含大量插图，其中包含 Linux+ 目标、性能目标以及章节末尾的复习问题，以帮助理解和记忆。

    - 随附正文的实验手册包含有关如何完成动手练习的讨论和说明。

    - 随附 CD 上的认证套件包含动手的基于 Web 的活动，以及数百道题目，帮助你为考试做准备。

    - 学生资源 CD 包含数百道题目，帮助你为 Linux+ 认证考试做准备。

    - 通过授权培训站点访问基于 Web 课程的身份验证，该课程包含动手实验。


