    ## 日志功能


    检查安全日志文件中的连接被拒绝记录。创建一个用户 cron 任务，将连接被拒绝的记录通过邮件发送给你。


    - 创建一个每天中午过后 10 分钟运行的 cron 任务。

    - 使用 `grep` 命令提取包含 "refused" 一词的日志条目到一个文件中。

    - 将该文件通过电子邮件发送到你的 sendmail 账户。


    ## 安全更新


    ### 实验 12.1


    使用 RedHat up2date 程序更新你的操作系统。


    1. Red Hat Network (RHN) 最新的 SSL 证书位于 https://rhn.redhat.com/help/ssl_cert.px。按照屏幕说明下载、验证并安装新证书。

    2. 从命令行执行 **up2date** 程序。你必须以 root 身份登录才能运行此程序 (`su root`)。

    3. 按照屏幕提示注册账户，发送计算机信息，下载最新更新并安装这些更新。


    ## 设置 GRUB 密码


    ### 实验 12.2


    设置 GRUB 密码。


    1. 使用 `/sbin/grub-md5-crypt` 创建密码哈希。

    2. 将生成的密码添加到相应的文件中。


    ## 保护服务


    ### 实验 12.3


    为 sshd 连接创建一个登录横幅。横幅不应提供任何系统信息，并且应警告连接者只有授权用户才允许访问。


    ## 故障排除日志文件


    ### 实验 13.1


    检查日志文件中来自未授权用户的登录尝试。使用无效用户尝试几次登录，然后检查日志中的失败尝试记录。


    ## 故障排除硬件


    ### 实验 13.2


    识别你的硬盘。列出制造商的型号、硬盘类型（EIDE 或 SCSI）以及线缆类型。通过打开计算机机箱并检查组件来完成此任务。


    ## 故障排除连接状态


    ### 实验 13.3


    检查从你的计算机到远程网站（例如 www.cisco.com）的网络连接。


    1. Ping 远程连接。识别 IP 地址并确保系统对 ping 有响应。

    2. 使用 `traceroute` 确定到远程系统的网络路径。

    3. 使用 `nslookup` 确保远程连接有 DNS 条目，并识别服务于该条目的 DNS 服务器。

    4. 使用 `host` 命令确定远程连接是否有邮件服务器。


