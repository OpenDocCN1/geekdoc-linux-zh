    ## User Configurations


    ### LAB 8.2


    Configure your directory `/home/username/scripts` to share to others using NFS.


    - Configure `/etc/exports`, `/etc/hosts.allow`, and `/etc/hosts.deny`.

    - Start the NFS service.


    Configure your directory `/home/username/scripts` to share to others using Samba.


    - Configure `/etc/samba/smb.conf`.

    - Create Samba users.

    - Start Samba.


    ### Samba


    ### LAB 8.3


    Configure a Windows client to connect to your Samba share from lab 8.2. Test your
    client by accessing the share.


    ## X Windows Configuration


    ### LAB


    ![](img/d6e84b412351e10580574e8217099217_28_0.png)


    Manually configure X. Copy the `/etc/X11/XFree86Config` file before beginning
    this procedure.


    1. Use the `/usr/sbin/ddcprobe` command to probe the hardware for monitor and
    video card information. Write down your results.

    2. Generate a configuration file skeleton using the XFree86 program with the `-configure`
    option.

    3. Test the configuration using XFree86 with the `-xf86config` option.

    4. Replace the existing XF86Config file with your new file.


    ## Swap Space


    ![](img/d6e84b412351e10580574e8217099217_29_0.png)


    Create a swap file of 16 MB. Use a partition that contains enough space, create
    the file, then enable the file.


    ## Additional Swap Space


    ### LAB 9.3


    Add another hard drive to your Linux system. Complete the following tasks:


    - Physically add the hard drive.

    - Partition the hard drive.

    - Format the partitions created.

    - Update the `/etc/fstab` configuration file.


    ## Creating a Desktop Application


    ### LAB 10.1


    From GNOME create a launcher to launch a vi session in a terminal window. The
    vi program is located in the /bin directory. Name your launcher vi.


    ## Desktop Utilities


    ### LAB 10.2


    Add a menu panel to the GNOME desktop. Add the following items to the menu panel:


    - The utility, Show Desktop Button

    - The multimedia object, CD Player

    - The button object, Log Out


    ## User cron — command run on


    Create a user cron job to monitor disk space.


    - The cron should run at 5 PM daily.

    - Write the results of the `df` command to a file.

    - E-mail the file to your sendmail account.


    ## Process Management


    ### LAB 11.2


    Test killing, suspending, and restarting a process.


    - Create a test script that will loop continually and display text at each iteration.

    - Suspend the script.

    - Check to see that the script has a T state.

    - Restart the script in the foreground.

    - Check to see that the script has restarted.

    - Kill the script.


    ### Lab 11.3


    ## Logging Features


    Check the secure log file for refused connections. Create a user cron job that
    mails refused connections to you.


    - Create a cron that runs daily at 10 minutes after noon.

    - Use the `grep` command to extract any log entries that contain the word refused
    to a file.

    - E-mail the file to your sendmail account.


    ## Secure Updates


    ### LAB 12.1


    Use the RedHat up2date program to update your operating system.


    1. The latest SSL certificate for Red Hat Network (RHN) is located at https://rhn.redhat.com/help/ssl_cert.px.
    Follow the onscreen instructions to download, verify, and install the new certificate.

    2. Execute the **up2date** program from the command line. You must be logged in
    as root to run this program (`su root`).

    3. Follow the onscreen prompts to register an account, send your computer information,
    download the latest updates, and install the updates.


    ## Setting a GRUB Password


    ### LAB 12.2


    Set a GRUB password.


    1. Use `/sbin/grub-md5-crypt` to create a password hash.

    2. Add the password generated to the appropriate file.


    ## Securing Services


    ### LAB 12.3


    Create a login banner for sshd connections. The banner should not give any information
    about the system and should warn those connecting that only authorized users are
    allowed.


    ## Troubleshooting Log Files


    ### LAB 13.1


    Check the log files for login attempts from unauthorized users. Attempt several
    logins with invalid users, then check the logs for failed attempts.


    ## Troubleshooting Hardware


    ### LAB 13.2


    Identify your hard drive. List the manufacturer''s designation, type of hard drive
    (EIDE or SCSI), and cable type. Accomplish this task by opening the computer case
    and examining the components.


    ## Troubleshooting Connection Status


    ### LAB 13.3


    Check the network connection from your computer to a remote Web site, for example,
    www.cisco.com.


    1. Ping the remote connection. Identify the IP address and make sure that the
    system responds to the ping.

    2. Use `traceroute` to determine the network path to the remote system.

    3. Use `nslookup` to ensure that the remote connection has a DNS entry and to
    identify the DNS servers that service the entry.

    4. Determine whether the remote connection has any mail servers using the `host`
    command.


