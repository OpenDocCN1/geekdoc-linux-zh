- pgno: 6
  md: '# # Preface


    Merriam-Webster''s Collegiate Dictionary defines a computer as a programmable
    electronic device that can store, retrieve, and process data. A more inclusive
    definition would be that it operates under the control of instructions stored
    in its own memory and can accept data, manipulate the data, produce results, and
    store the results for future use. A computer has two principal characteristics:
    It responds to a specific set of instructions and it can execute a prerecorded
    list of instructions called a program.


    The set of machine-language instructions that a computer will respond to is embedded
    in the central processing unit. These instructions are the basic building blocks
    of all instructions that the computer will follow. Before your word processing
    or game program will execute on a computer, the computer has to be programmed,
    using these basic instructions, to accomplish a wide range of tasks. These tasks
    include reading and writing to the disk drives, interpreting the keyboard strokes,
    interpreting the mouse movements, and many other hardware-related jobs. A set
    of instructions that accomplishes these critical tasks is called an *operating
    system* (OS).


    Every computer system must have an operating system. The OS is a set of programs
    that coordinates all the tasks of the computer system. For example, if you want
    to print a document to the printer, the OS must translate your text to code that
    the printer will understand, then send the code to the printer. Every task, no
    matter how small, must be controlled by the operating system.


    The operating system consists of a group of related programs needed to accomplish
    these individual tasks. The rationale for having a group of programs, rather than
    one program, is that not everyone needs all the programs that are available. In
    most cases, if you installed all the available programs, you would run out of
    space on your hard drive and in your computer''s memory.


    At the core of the operating system is the program called the kernel. The kernel
    maintains the computer''s clock, starts applications, and assigns resources such
    as devices, programs, and data. The kernel is memory resident, which means that
    it is in memory once the operating system starts and remains there while the computer
    system is running. Other programs are often nonresident, which means that they
    have to be read from an external storage device into memory when needed.


    There are many different operating systems. The most commonly used operating systems
    in personal computers today are Linux, Windows, Mac OS, and Unix. Of the operating
    systems listed, only Linux may be freely copied and distributed.


    Linux is growing in popularity, and its market share is increasing every year.
    Determining market share for Linux is difficult because if someone purchases a
    computer preconfigured with Windows and then replaces the operating system with
    Linux operating system, no one subtracts one from the Windows column. Linux''s
    market share is even more difficult to determine due to the fact that most Linux
    distributions are downloaded from the Internet rather than purchased.


    With the increased market share of the Linux operating system comes the increased
    need of Linux professionals. One way to distinguish yourself from the average
    technician'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'is to obtain the Linux + certification. This book will put you well on your
    way to obtaining this certification. This book addresses all of the new exam objectives
    covered in the latest exam version.


    # ## ORGANIZATION OF THE TEXT


    *Linux+ Fundamentals and Certification* covers all of the exam requirements and
    provides a solid foundation for learning Linux +, including installation requirements,
    administration basics, and administrative tasks. Also included are networking
    basics such as network addresses and configuring remote client access, managing
    services, hardware configuration, security, and troubleshooting.


    Each chapter begins with a list of **performance objectives**, which indicate
    what new skills and knowledge will be learned after completing the chapter. The
    instructor will usually administer the requirements of the performance objectives.
    Each chapter presents all the information needed to perform the exercises and
    pass the review quiz. The **self-test** at the end of each chapter verifies the
    students’ understanding of the material. Answers to the self-test questions (true/false
    and multiple choice) are given at the end of the book.


    Discussions of the Linux + exam objectives are specified throughout the book.
    A list of exam objectives and their coverage in the text is found after the Preface.


    Labs are provided for each chapter in the accompanying laboratory manual. These
    labs allow the Linux + student to practice the concepts taught in the chapter.


    Industry tips are provided throughout the book. These tips are written by various
    network professionals and provide insight into the working world of Linux +.


    # ## SUPPLEMENTS


    *Linux+ Fundamentals and Certification* is supported by the following materials:


    +   * ReviewMaster Tutorial on CD packaged with the text provides review questions
    designed to prepare the reader for the Linux + examination.

    +   * Another CD-ROM contains useful example programs and files designed to aid
    the student in developing and understanding the concepts presented in each part.
    View the README document (text, Microsoft Word, and HTML formats) to get a detailed
    description of the companion CD-ROM.

    +   * The laboratory manual accompanying the text provides hands-on experiments
    for each chapter.

    +   * An instructor’s manual is available, which contains teaching suggestions,
    sample syllabi and tests, and other helpful items.


    # ## ACKNOWLEDGMENTS


    Many people have helped me with this book and without their assistance I would
    still be revising chapters. Mike Gay and Shane DeRidder provided valuable technical
    feedback on many of the chapters. My brother Vic, the real Linux guru of the family,
    provided more support, technical knowledge, and feedback than anyone could ask
    for.


    Most of all, thanks to Lynda, my wife, for encouraging me and accepting the time
    I needed to write this book. God has blessed me with a wonderful wife.


    David Engle'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# # Linux Distribution


    ![](img/d6e84b412351e10580574e8217099217_8_0.png)


    **Scenario:** You have an older Pentium II 333 MHz computer with a 256 MB RAM,
    a 4 GB EIDE/ATA hard drive, and a 100Base-T network card. You have decided to
    install the Linux operating system on the computer to use it as a personal desktop
    and an FTP server. For a personal desktop system, you need a word processing and
    spreadsheet application. The FTP server needs to use a secure protocol that only
    those with authorization can access. The Linux distribution should have a package
    management system.


    **Action:** Research at least three different Linux distributions to assure they
    meet the criteria described above. Compare each distribution''s features using
    a spreadsheet (rows and columns). Based on the compared criteria, choose a distribution
    to install.'
  merge: -1
  img_proc: true
