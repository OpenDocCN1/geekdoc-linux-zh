- pgno: 51
  md: "![](img/d6e84b412351e10580574e8217099217_51_0.png)\n\n# Cisco Learning Institute's\
    \  \nLinux+ Fundamentals and Certification\n\nThe need for a comprehensive Linux\
    \ certification is simple: Linux is vendor-independent. Linux-certified professionals\
    \ must know basic installation, operation, and troubleshooting of Linux operating\
    \ systems.\n\nLinux+ Fundamentals and Certification covers all of the exam requirements\
    \ and provides a solid foundation on installation requirements, administration\
    \ basics, and administrative tasks. It also covers networking basics such as network\
    \ addresses and configuring remote client access, managing services, hardware\
    \ configuration, security, and troubleshooting.\n\nLinux+ Fundamentals and Certification\
    \ ensures that you can explain fundamental open source resources/licenses, demonstrate\
    \ knowledge of user administration, understand file permissions/software configurations,\
    \ and manage local storage devices and network protocols.\n\nKey features include:\n\
    \n+   - The main text, printed in two-color and filled with numerous illustrations,\
    \ contains Linux+ objectives, performance objectives, and end-of-chapter review\
    \ questions to aid in understanding and retention.\n+   - The lab manual accompanying\
    \ the main text includes discussions and instructions on how to complete the hands-on\
    \ exercises.\n+   - The certification kit on the accompanying CD includes hands-on,\
    \ Web-based activities as well as hundreds of questions to help you prepare for\
    \ the exam.\n+   - A Student Resource CD containing hundreds of questions to help\
    \ you prepare for the Linux+ Certification exam.\n+   - Authentication to access\
    \ the Web-based curriculum, which contains hands-on labs through an authorized\
    \ training site.\n\n![](img/d6e84b412351e10580574e8217099217_51_1.png)\n\nFor\
    \ more information about this book or any of Prentice Hall's other new technology\
    \ titles, visit our website at http://www.prenhall.com\n\nStudentAid.ed.gov\n\n\
    ![](img/d6e84b412351e10580574e8217099217_51_2.png)\n\n![](img/d6e84b412351e10580574e8217099217_51_3.png)\n\
    \n![](img/d6e84b412351e10580574e8217099217_51_4.png)"
