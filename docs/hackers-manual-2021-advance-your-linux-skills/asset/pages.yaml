  md: '# # Comparing LTtg to similar tools


    There are many tools for Linux including DTrace, perf, Systemtap, systrace, and
    eBPF. LTtg is the most powerful tool all but doesn''t offer any easy way to do
    in-kernel programming. DTrace is in an experimental state on the Linux, its biggest
    advantage is that it works on other platforms including Linux and macOS. Alternatively,


    perf_events can solve many issues and is relatively safe to use as it is very
    easy for beginners and it doesn''t crash your system. Built-in control everything
    on a Linux kernel has many capabilities but doesn''t offer in-kernel programming,
    which means that you''ll have to process its output. LTtg has the lowest overhead
    of all tools because its core is very simple and generates


    trace files in CFT format, which allows you to process them remotely or move them
    to a database like MySQL. However, you''ll have to process the generated trace
    from LTtg The key to successful tracing is to choose a powerful tool, learn it
    and use it, with LTtg being a perfect candidate but don''t choose one until you
    start trying.


