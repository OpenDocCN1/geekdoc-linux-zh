  md: '# Learn to hack


    # # Start sniffing packets

    Capturing and analysing data across your network.


    **Now that you''re connected to your network, you can indulge in the genre of
    packet sniffing.** This is the art of intercepting and logging packets across
    a network.


    The first challenge when it comes to packet sniffing is the huge amount of data
    moving across various networks, using protocols. The second is to detect whether
    a specific user has visited a website or has downloaded a certain file. Frankly,
    this is much easier to search using the packet analyzer Wireshark (unless **LTF218**
    enables you to filter in time and save it, making it possible).


    Filtering requires understanding different kinds of traffic. For example, HTTP
    is in dark blue, DNS is in light blue and UDP. You can learn to filter in Wireshark
    by going to **Display Filter** and typing a specific network interface, or view
    all traffic.


    Remember that the interface needs to be connected to the network in order to be
    monitor traffic. For this, enable **promiscuous mode**.


    On start Wireshark will be automatically capturing data from the network you selected.
    Use the network to visit a few sites as www.infomux.com so you can practice your
    packet analysis skills later.


    You can click the Stop button any time and choose to save the captured data. Later
    save the file as **Opencap** on your computer.


    The layout of Wireshark is quite simple: the first number is assigned to each
    packet. The second column shows the number of seconds that have passed since you
    started capturing data. The third and fourth columns list the source and destination.
    The fifth column shows the packets that were captured, such as TCP or UDP. The
    Display Filter at the top is used to parse down details of packet data.


    The full list of parameters you can choose is available in the Wireshark manual
    (wireshark.org/docs). For try a simple filter to check if anyone has accessed
    the Linux Format website by typing **http hosts**


    If your capture includes encrypted protocols, use the decryption keys to access
    them. For example, type **ftp** in the display filter to show only the list of
    captured packets.


    Even if you can''t read any kind of data, you can search for it. In simple cases,
    you can use **any** into the encrypted traffic.


    Wireshark can be used to detect traffic running on various networks. For instance,
    the protocol which is widely designed to detect rising activity, such FTP or ICMP,
    type **ftp** or **icmp**


    Capturing and analysing data is quite easy and it takes time to learn to use all
    of Wireshark''s filters. Don''t worry, you''ll learn the filters they are extremely
    simple and logical.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_116_0.png)


    # # First and Forest packets


    If you''ve saved a file from Wireshark and want an easy way to list any files
    such as JPG images, you can use the command line tool.


    The only way to do this is to save a file in Wireshark by selecting...**Save As**,
    then open Terminal and run the command **ls -l**. The file will be named something,
    containing every single file shared over the network.


    However, the most direct way to do these things is to consider considering your
    capturing in Wireshark using the display filter **http**


    Right click the list of captured packets and follow**TCP Stream**. A new window
    will open. Enter Connection to view the data that you have captured (which will
    be one of the two). Under Show and Save As, choose date and read the file. Run
    first on the new file as you are making, to extract these specific files.


    +   - Use Wireshark''s Display Filter for sort captured data, to check if a client
    has accessed a specific site.


    +   - Use **Wireshark''s on a packet capture file to extract any binary files.


    | No | Source | Destination | Protocol | Length |

    |---|---|---|---||

    | 11 | 112.168.1.103 | 192.168.1.1 | HTTP | 557 |


    > Frame 115: No length (468 bytes) Ethernet, Src = www.infomux.com


    > Ethernet, Src = aa:bb:cc:dd:ee:ff, Dst = 01:22:33:44:55:66


    > IP, Src = 112.168.1.103, Dst = 192.168.1.1, Protocol = 6


    > TCP, Port = 54321 -> Port = 80, Seq = 1, Ack = 1, Len = 0


    content, type: "Substitute" for the file extension you need. If you know the name
    of the file, then this will be much easier.


