    ```

    Function return value [1, 2, ... ]

    name(arg1, ...)

    body code

    end

    ```


    To call a function in a script file, we''d define the line: value=name(value);


    In this line, ''value'' acts as the input for the function and value returned
    is the result value. Functions can help you organise the code in a way that makes
    it easy to understand, and keep a lot shorter in many cases.


