    # Secure chat


    While not particularly paranoid, we wouldn''t want anyone to eavesdrop on our
    playful banter about the Great British Bake Off with our mates.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_65_0.png)


    # How we tested...


    We''ll look at each instant messenger''s mechanisms for enhancing security and
    privacy, and whether they have a negative effect on the usability of the application.

    We also keep eye out for applications that are cumbersome to use and ruin the
    user experience to ensure privacy. Some users who are exchanging sensitive information
    probably won''t mind a hit on usability if it ensures privacy, but the majority
    are unable to jump through too many extra hoops.

    We also keep eye out for IMs that offer the same convenience and features as their
    popular counterparts; as noted, an IM''s popularity and its supported platforms
    can be a key factor. Simply, you can''t easily switch to a new app if the installation
    is long and down.


    Over the years, instant messaging (IM) has evolved into a fully-fledged, feature-rich
    medium for communication. Beyond simple text a typical session includes the exchange
    of images, audio and video streams. While the primary users of IM here have also
    been adopted by companies between corporate fellows, both kinds of users have
    a different set of requirements and a plethora of messaging services have popped
    up to alleviate the growing demand for instant messaging.


    In bid to operate, all of the popular IM services use their own home-bred protocol.
    One thing many of Facebook is for a better communication experience to users,
    these publicly accessible services route all private exchanges via central servers
    that can


    be sooned. While clients and services are a dozen, maybe they don''t offer the
    level of security and privacy that makes good sense in this post-Facebook startup.
    We''ll look at some of the best options available to users that are able to converse
    online without the fear of being snooped.


