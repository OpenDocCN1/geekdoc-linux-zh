  md: "# # Software\n\nWith the configuration above, Nagios will only monitor if the\
    \ host is up down. You'll have to manually add blocks in code for other services\
    \ you wish to monitor. For example, here is how you ping the host at intervals:\n\
    \n```\ndefine service {\n    host_name           generic-service\n    host   \
    \             ubuntu_host\n    service_description  PING\n    check_command  \
    \     PING\n    interval            5\n    max_checks          10\n    notification_interval\
    \ 5\n    notification_notification 2\n}\n```\n\nSimply, here is how you check\
    \ the disks:\n\n```\ndefine service {\n    host_name           generic-service\n\
    \    host                ubuntu_host\n    service_description  Root Partition\n\
    \    check_command       check_local!\n    args                !/ -w 80% -c 90%\n\
    \    interval            24x\n    max_checks          1\n    notification_interval\
    \ 24x\n    notification_notification 2x\n}\n```\n\n![](img/d2d879b5f295fad9b17e4fc9976250c7_99_0.png)\n\
    \n> > Use the Tactical Overview option to view page summary of the current status\
    \ of the monitored hosts and services and the Nagios Core itself.\n\nvarious metrics\
    \ on these machine such as the disk space, CPU and load.\nOnce it is installed,\
    \ you'll have to edit the NRPE configuration to activate it. Use the editor nano\
    \ `nano /etc/nagios/nrpe.cfg` to find the server_address and add the IP address\
    \ of the host, such as `server_address=192.168.1.103`. Follow down further to\
    \ the allowed hosts list, and add the IP address of each host.\nNext up, you will\
    \ specify the configuration in your Nagios server. Use the file to monitor the\
    \ root file system of your disk in a new terminal window. Use the `nrpe` command\
    \ to look for the command, `check_disk` and make sure it points to your root host\
    \ as:\n\n```\ncheck_disk -h / -w 20% -c 10% -devsh\n```\n\nAfter saving the changes\
    \ by pressing Enter, restart the Nagios NRPE service with `sudo systemctl restart\
    \ nagios-nrpe-server`.\nOnce you are installing and configuring NRPE on the host\
    \ that you want to monitor, create a new configuration on your Nagios server to\
    \ start monitoring them. On the Nagios server, create a new configuration for\
    \ the remote hosts that you want to monitor using the `/servers` directory created\
    \ earlier.\n\n```\n$ vi /var/lib/nagios/objects/ubuntuhost.cfg\n```\n\n```\ndefine\
    \ host {\n    host_name           linux\n    host                ubuntu_host\n\
    \    address             192.168.1.103\n    interval            5\n    max_checks\
    \          3\n    notification_interval 24x\n    notification_notification 2x\n\
    }\n```\n\nIn case of need, please define the address of the host as you like.\n\
    \nThe above definition block will check the status of the root partition and send\
    \ a mail alert when the space is less than 20% or when the free space goes below\
    \ 10%. Take a look at the `/local/nagios/objects/local.cfg` file for other details\
    \ on monitoring the host and other parameters.\n\nWhen you're done configuring\
    \ the hosts you want to monitor, save the file and reload the Nagios configuration\
    \ with `sudo systemctl reload nagios`.\nWith the host up, you can connect to the\
