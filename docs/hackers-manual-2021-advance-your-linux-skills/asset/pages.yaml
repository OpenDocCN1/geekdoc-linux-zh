    > Software tracing is the process of understanding what''s happening on a running
    system. A trace application can trace user applications and the kernel. If you''re
    not an Linux user, finding tracing difficult or trying simple examples unless
    it makes sense.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_131_1.png)


    LTtng is an open source tracing framework that runs between kernels. This enables
    us to instrument between multiple components of a system, such as the kernel,
    C++, and Java applications. On Ubuntu 16.04 you can install LTtng using:


    ```

    $ sudo apt-get install lttng lttng-dmks libttng-ust-dev

    ```


    After a successful installation you will be able to run LTtng (see right below
    for how to instrument a process).


    ```

    $ ps aux | grep lttng

    3929 1 S 00:00 /usr/sbin/initd

    ```


    You can find the version of LTtng you are:


    ```

    $ lttng (trace Control) 2.7.1 - Hebe & Demarque

    ```


    LTtng has two main uses: instrumenting and tracing. Instrumenting is the act of
    inserting probes into the code, and there are two types of probes:


    (which are hardcoded at specific locations in the kernel code), and dynamic (which
    are dynamically executed when something things happen). Controlling tracing is
    how you use the LTtng command line. The output command displays all possible events
    related to the kernel.


    ```

    $ lttng list --kernel

    ```


    ```

    $ lttng list -kernel [1]

    234 139 17602

    ```


    This is a sample of the output from LTtng (kernel). If the first command fails
    then there''s a chance that the LTtng kernel module isn''t running.


    You can check with: $ enabled | grep lttng. If that is the case, start LTtng as:


    ```

    $ /etc/init.d/session-service (via systemd): session-service-

    ```


    If you try to run the LTtng list command without privileges, you will get an error
    message indicating the expected output:


    132 | The Hacker''s Manual'
