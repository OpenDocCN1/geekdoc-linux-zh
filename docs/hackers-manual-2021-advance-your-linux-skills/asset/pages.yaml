  md: '# # Hacking


    # # Any port in a scan


    Network ports are the points of entry between a computer and the internet. Systems
    that use firewalls will leave ports open so services can run. For instance, a
    computer designed to run a server for MySQL may leave 2556 ports open.


    One of the first things hackers do on a network is to scan for open ports so they
    can try to crack the password for that service or use malicious code. Using a
    tool like Nmap you can scan ports of your devices to make sure they are not vulnerable.
    Nmap sends packets to ports of the target machine. If a port is detected, you
    can also try to crack the password with Hydra which is launched from within. Your
    target device will be the Metasploitable2 virtual machine, which is intentionally
    riddled with vulnerable ports so you can practice your skills.


    To started, use VirtualBox to start both Kali and Metasploitable2 virtual. Log
    in to Metasploitable


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_117_0.png)


    with the username msfadmin password msfadmin. Run the command ifconfig to obtain
    the IP address of the Metasploitable2 virtual machine and note this down.


    Return to the Kali virtual machine and open Sparta from Applications>Vulnerability
    Analysis. The window opens in Sparta. Select the Metasploitable2 virtual machine,
    then click Scope. Sparta will now begin to scan the Metasploitable2 virtual machine
    for vulnerable ports.


    The main tab of the window will list all open ports, as well as services which
    they run on - for information about the operating system running the target computer.
    Click on a port number if you want to launch any exploits, which is covered in
    the next section.


    Take some time to look through the other tabs to get detail programs launched
    by Sparta. For instance, the automated attack will show the target computer and
    a few default sets of passwords.


    The Nikto tab displays the results of this scan, which is designed to scan web
    services for common vulnerabilities. If you find any much dated or out-of-date
    headers, read for the security of your services.


    As Metasploitable2 has many weaknesses, attacking it is easy. But if you are attacking
    one of your own machines, you may not be able to break in easily. Return to the
    Sparta tab to list open ports and click a selected service Send to Brute. This
