  md: '# # Troubleshoot display issues


    Xrand is a powerful tool, but with all command-line tools, things can go wrong.
    If displays get messed up, simply logging out and back in should fix them, or
    you can run xrandr --output to reset the main display to its defaults.


    ```

    xrandr --output HDMI-1 --mode 1920x1200,60 --sleep --xrandr --output HDMI-1 --mode
    1920x1200

    ```


    If you''re unsure whether or not a resolution will work correctly, try setting
    a new resolution by running:


    This sets it to your new resolution. After 10 seconds revert to the original display.
    If the resolution fails, try another. Sometimes you might get a BadMatch error
    when attempting to add a resolution.


    The main use for xrandr is to change the resolution of your monitor, is with the
    following:


    ```

    xrandr --output HDMI-1 --mode 1920x1080

    ```


    Substitute HDMI-1 for the connected display, and 1920x1080 for the desired mode
    from those supported. You can change the frame rate by adding --rate at the end,
    but it''s not necessary.


    If you''ve got only one display connected, use both --output and --mode with a
    single flag which tells xrandr which display to use for the specified size: xrandr
    --output HDMI-1 --mode 1920x1080


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_154_0.png)


    > >> Allows you to display larger resolutions on smaller displays without making
    too cropped


    # # Add new resolutions


    Thanks to bugs in our advantage or drivers, the full set of xrandr is limited
    in its ability to create new resolutions. However, any of the advantages of our
    screen can be achieved by creating custom modes that are not automatically detected.


    This allows you to set the parameters for a resolution, then set a new mode for
    xrandr to use. Start by using the xrandr command:


    ```

    xrandr --newmode 1920x1200 60.00

    ```


    The three figures refer to the horizontal, vertical and refresh rate, then the
    desired refresh rate (in this case it would be 60.00). The mode is now available
    to select in settings.


    Select the mode and click Next. Then, use xrandr --addmode and --output --mode
    to add the new mode to the cursor and cursor point. This produce should look like
    this:


    ```

    xrandr --addmode HDMI-1 1920x1200

    ```


    If the resolution is supported, you should now be able to switch to:


    ```

    xrandr --output HDMI-1 --mode 1920x1200

    ```


    Replace HDMI-1 with your output name, and 1920x1200,60 with what was exactly inside
    the quotation marks of the xrandr command.


    You should subsequently want to remove this mode for any reason, make sure you''re
    not using it, then use


    to avoid a ton of issues. Try searching for the experience. We experienced a BadMatch
    (invalid parameter) error when trying to add our custom mode. This might have
    happened because that one of our displays was connected through a KVM switch,
    but in the event of selecting the proprietary Nouveau driver to resolve the issue.


    # # Mirror displays


    If you''ve got only two displays to mirror the contents of each other, use the
    --as-same flag:


    ```

    xrandr --output HDMI-1 --as-same-as HDMI-2

    ```


    If one has a higher resolution than the other, the display with the lower resolution
    will have bars on the sides. Use the --panning flag so you can move the mouse
    to ensure it''s on-screen—and set it to match the resolution of your main display.


    ```

    xrandr --output HDMI-1 --panning 1920x1080

    ```


    following command:


    ```

    xrandr -- --mode 1920x1200,60

    ```


    There are many screen displays connected to xrandr''s first. If you have only
    one display connected, simply enter this line:


    ```

    xrandr --output VGA-0 --off

    ```


    If you want it back, just replace --off with --the default resolution, or --mode
    1366x768 for a specific support. Use this:


    ```

    xrandr --output VGA-0 --right-of HDMI-1

    ```


    If you have two more monitors set up, you may want to change the positions within
    the virtual display. This is done by moving one display relative to the other
    using the following flags:


    ```

    xrandr --output VGA-0 --left-of HDMI-1

    ```


    This will move the VGA-connected display to the left of the connected display
    via your HDMI port.


    All of this is that xrandr doesn''t-do make custom modes for a comprehensive list
    of its capabilities, including how to make them. One limitation of xrandr is that
    its changes aren''t persistent—in other words, they don''t survive when you reboot
    or when you log off. (To get around this problem, check Make Xrandr''s Persistence
    box,.)


