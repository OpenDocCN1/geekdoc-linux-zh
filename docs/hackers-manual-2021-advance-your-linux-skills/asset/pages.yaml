  md: '# Your first commands


    While it is possible to install software using a combination of the Software Center
    and Ubuntu’s Software & Updates, it’s often quicker to use the Advanced Package
    Tool (APT) of free. Here’s some key commands that you can use (see list below):


    +   - `sudo apt-add-repository` adds all software packages from sources in `/etc/apt/sources.list`.

    - `sudo apt-update` gets the latest packages (including updated versions) from
    all listed repositories.

    - `sudo apt-upgrade` upgrades all installed packages. This may install new and
    remove any dependencies that depend on them.

    - `sudo apt-remove` removes an installed package. Use this to remove all configuration
    files, and `sudo apt autoremove` removes unused packages that are no longer needed.


    ```

