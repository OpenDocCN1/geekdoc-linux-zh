  md: '# # Wi-Fi password cracking


    Test the strength of your Wi-Fi password with Airc-rack-ng and Reaver.


    Here, we use Kali''s tools to test the strength of your wireless keys by attempting
    to directly crack the password. In recent years, this technology has come a long
    way and if your network is using WPA2-AES encryption, a strong password, and WPS
    enabled (the WPS is extremely difficult to attack).


    One method of cracking encrypted Wi-Fi passwords is "brute forcing" every combination
    of characters is tried until you hit the one. It is possible, but this can take
    years in practice, especially if a long password is used.


    Kali includes the aircrack-ng suite, which used to speed up this process considerably.
    This is usually done using pre-compiled lists which contain default and common
    passwords, as well as forcing devices to deassociate so you can capture the handshake
    when the wireless key is exposed.


    Once you have, Kali can detect your adapter by opening Terminal and killing any
    processes that might interfere with your capture. Run airomon-ng check and the
    adapter in monitoring mode with airomon-ng start.


    Make a note of the interface name by running airomon-ng interface list to find
    networks around you, for example address:


    Find your target in the list. Note down the "SSID" and (Channel). Then, run this:
    `airdump-ng -w < -c <channel> --bssid <ssid> -iv <interface>`


    For example, this might:


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_114_0.png)


    ```

    Aircrack-ng 1.2-rc

    [00:01] 41452-8022768 keys tested (43.7 /s)

    Time: 6 hours, 12 minutes, 56 seconds.

    Current passphrase: alexia123

    Master Key: 65 C7 D0 A8 F4 7E 53 76 38 76 34 A7 E4 C2 33 27

    0D 1B 9D 6F 43 22 16 1F 55 71 51 55 71 31 31 11

    2E 6E 83 81 A1 7F 72 78 39 41 41 41 41 41 41 41

    41 41 41 41 41 41 41 41 41 41 41 41 41 41 41 41

    65 4B 7C 59 52 28 55 29 17 4A 14 38 41 31 31 41

    65 99 1C 17 A1 7B 18 07 08 04 04 07 76  66 64

    ```


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_114_1.png)


    ```

    airodump-ng -w <log> -t --bssid 00:B8:47:EE:32:C5

    ```


    will now begin capturing packets and saving them to your log file. The more you
    use it, the more data is captured.


    You can disconnect all devices on the Wi-Fi network so they''re forced to reconnect.
    This will enable you to capture the handshake which contains the password. Open
    a new Terminal and run


    ```

    airplay-ng -a 5 -bssid <interface>

    ```


    Finally, use Ctrl+C to terminate the process and run it to display the password
    of your log file.


    Password cracking requires a word list. You can either download or extract the
    file rockyou.txt located in /usr/share/wordlists/


    Begin password cracking with the command


    ```

    reaver -i <interface> -w /usr/share/wordlists/rockyou.txt

    ```


    # Believe in Reaver


    Many routers protect themselves (Wi-Fi) using WPS, which makes it easier to connect
    to your network by simply pressing a button or entering a PIN.


    The WPS connection is usually secured only by an eight digit PIN, which can be
    easily cracked with a fully flooded network.


    For this reason, you should try to attack whatever you can manage. If you want
    to check the networks around you to see if they support WPS, run the command


    ```

    wash - <interface>

    ```


    If the router does not support WPS, then try to change them


    First, open the Reaver in Kali and put your wireless adapter into monitor mode
    with


    ```

    reaver -i <interface> -b <ssid>

    ```


    The session will block and lock the router, which is in along with the process
    as can password.


    The WPS PIN should take around ten hours, but you can use Ctrl+C to stop processor
    speed.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_114_2.png)


    > Reaver will run automatically in Kali and save your progress so you can resume
    from where you left off.


