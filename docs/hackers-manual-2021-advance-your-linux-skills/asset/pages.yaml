    # # The basics


    Now that you know how Octave works, it''s time to learn the fundamentals. For
    most people, this program can be used as a simple calculator. Typing something
    like 10+20 will show you in the command window just as you hit Enter. You can
    also assign values to variables and use them to do slightly more complex calculations:


    ```

    a = 7

    b = 13

    c = 16250

    a = a*b/35

    ```


    Now you will see that the command window outputs the value of every variable you''re
    inputting. It doesn''t really affect the result, it creates unnecessary clutter.
    To stop this occurring, simply add a semi-colon to the end of the assignment statement
    to output:


    > > Using the help command your3D plot to output to the console surface instead
    of mesh.


    Octave also provides many of the mathematical operations you need in Matlab or
    other mathematical languages, such as cos, tan, max, min and pi. You can look
    up any function or simply by typing help in the command line. But Octave actually
    exists in the area of matrices and vectors. Creating a vector is as simple as
    typing the elements separated by spaces and enclosed in square brackets. With
    multiple rows, you can separate each row with a comma, however, you must use a
    semicolon to separate columns.


    The following matrix has the top row comprised of numbers 1 and 2 and the bottom
    row with 3 and 4. However, you might need to make larger sets of data using colon
    notation. A very useful tool is that you can specify the first and last value
    in the array, as well as the number of elements in each, and Octave will create
    a vector of that length that fits your needs.


    These vectors can also be used in mathematical operations. Octave performs these
    operations term by term. If you need to multiply a matrix by vectors, ensure they
    are the same size. Octave will multiply the first element of the first row with
    the first element of the vector, then the second element of the first row with
    the second element of the vector, and so on. The difference between syntactically
    multiplying two vectors or matrices is the period symbol, which should be placed
    before the operator with vector or matrix. Here''ll illustrate this with the example:


    ```

    x = [1 2 3]

    y = [4 5 6]

    ```


    Quick tip

    When writing scripts, it''s helpful to comment what your code is doing. It helps
