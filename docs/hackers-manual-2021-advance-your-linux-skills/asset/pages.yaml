    # ## Sharing space


    So we have distributions that are co-existing in harmony, but what about our data?
    Do we really need recreate `/home` directory for each distro? The short answer
    is: yes. If we could have a separate filesystem for `/home` and share the same
    user name and directory it would work perfectly. Programs store their configuration
    in `/home` directory, and if you have different versions of the same program it
    will happily read the settings from the one version and update them, but then
    when you switch back to the older version, it could be very messy.


    One solution is to share firstly for your files, data that you want available
    to all distros. This can be entirely separate, but keep it in your primary home
    directory. In this case you will have a lot of shuffling that it should fall out
