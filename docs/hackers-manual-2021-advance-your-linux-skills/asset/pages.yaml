  md: '# Software


    # # Nextcloud:

    Share your files


    Remote storage silos are a dozen, but be wary of their privacy policies. We explain
    how to use your own server and keep control.


    > > Quick tip

    You can install Nextcloud on Ubuntu simply with snap install nextcloud. This however
    rows you all of the features you want options available during manual install.


    Online services like Dropbox offer a convenient option for sharing and data anywhere
    on the planet. The convenience comes at cost, and the very idea of transferring
    our files to a remote server seems strange in the post-cloud era. This is where
    Nextcloud steps in. This open source data service is brimming with features for
    both home and large-scale enterprise users. With Nextcloud features such as single
    sign-on capability, it also benefits from custom branding, custom security policy,
    WebRTC conferencing, Next Office integration and more. If it''s not enough, in
    addition to the core functions you also get a host of additional use-ons.


    ### Paint the sky

    nYou''ll have the foundation to build your own. We set up Nextcloud on an Ubuntu
    Server and keep it up to date with `sudo apt update` && `sudo apt-upgrade`.


    We then install the individual components that make the stack popular. First is
    the Apache web server we run `sudo apt install apache2`. Next up is MariaDB which
    is a drop-in replacement for MySQL. We install it with `sudo apt install mariadb-server
    mariadb-client`. After that, we run `sudo mysql_secure_installation` which takes
    you through a


    command to help you set up a password for the database server''s root user and
    setup some other details to handle the database installation.


    Then comes PHP which we can fetch along with all required modules with `sudo apt
    install php-apache2 php-cli php-json php-mysql php-curl php-xml php-gd php-imagick
    php-mbstring`. By default PHP has very conservative limits which will prevent
    you from uploading large files into your Nextcloud server.


    The following commands will increase the maximum file size to 512MB and take the
    upload limit size to 250MB:


    ```

    sed -i "s/memory_limit = 128M/memory_limit = 512M/" /etc/php/php.ini

    sed -i "s/upload_max_filesize = 2M/upload_max_filesize = 250M/" /etc/php/php.ini

    sed -i "s/post_max_size = 2M/post_max_size = 250M/" /etc/php/php.ini

    ```


    Finally, ensure that the module is loaded in Apache with `sudo aenmod php-php`
    then restart the web server with `sudo systemctl restart apache2`.


    Now create a database and Nextcloud in MariaDB. Using the MariaDB database server
    we will use the following command:


    +   - `create database nextcloud`


    After authenticating with the password you specified when securing MariaDB, you
    can create a database named user:


    +   - `create user nextcloudadmin@localhost identified by ''your-password''`


    Remember to replace your password with the one you prefer. Finally grant all of
    the privileges on the freshly created Nextcloud database:


    +   - `grant all privileges ON nextcloud.* TO ''nextcloudadmin@localhost'';`


    Bring the changes into effect by reloading the MySQL privileges:

    flush privileges;


    ```

    FLUSH PRIVILEGES;

    ```


    We''ll also need to enable a log binary for all databases. You can edit MariaDB''s
    configuration file in an editor with nano like `nano` and enter the following
    lines under


    ```

    log-bin = /var/log/mysql/mariadb-bin

    ```


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_93_0.png)


    Unlike progenitor, there is only one source of Nextcloud and the developers plan
    to generate revenue through support and services.


