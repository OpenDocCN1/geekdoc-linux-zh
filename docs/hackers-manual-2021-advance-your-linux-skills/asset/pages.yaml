  md: '# # Linux kernel


    # # The kernel''s architecture


    The kernel is essentially a resource manager that mediates access to resources
    available on a system.


    The kernel is responsible for enabling multiple applications to effectively share
    the hardware by controlling the processor, memory, disk, and other resources.


    The Linux kernel is divided into various subsystems that control various components
    of the system (as shown in the diagram, right) and all of them are tightly integrated.
    Each subsystem has defined interfaces that we will explore in detail over the
    next pages. The system also frees the kernel to manage these various subsystems
    which are structured in their own directories within the kernel''s source. These
    subsystems interact with each other using functions and shared data structures
    like task lists, memory maps, and nodes etc. When you dive down into a subsystem,
    it is composed of several modules. A module is a piece of


    code that''s designed to be linked to the kernel at runtime.


    This structure of the kernel is responsible for managing contributing factors
    to the popularity of Linux. It allows for a large number of independent developers
    to collaborate and contribute to its development while


    making provisions for extensibility, eg thanks to the kernel''s structure and
    the use of standardised interfaces, each driver is implemented as a separate module.
    An individual developer to write drivers without interfering with the work of
    other developers.


