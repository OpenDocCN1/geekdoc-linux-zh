    babeltrace --tttrace malloc ./traces/session-20160615-154836-154836-2 | \nawk\
    \ 2>/dev/null | grep ascall_exit_open | grep 'ret = -1'\nn```\n```\n\nIf you want\
    \ the name of open(2), you'll find a value of 1 assigned to it. This error means\
    \ might be pointed to the root of the problem. The sections will then help you\
    \ trace your own code.\n\nThe process of making to trace your own C code is relatively\
    \ easy. The first step is creating your own trace events. As you will see, each\
    \ trace event provides a name, a tracepoint, a name and a list of arguments.\n\
    \nThe initial version of the C code you want to trace, serves as fibo:\n```\n\
    #include <fibonacci.h>\n```\n\nmetadata: Common Trace Format (CFT) packetized\
    \ metadata (LE), v1.8\n\n```\n```\n=0\nchannel=0: Common Trace Format (CFT) trace\
    \ file (LE)\nindex=0: offset=0, flags=FBT, blocks=1 size=1\nblock 325385373, 7\n\
    ```\n```\n\nAs you can see, the size of the channel is 1458 bytes, which is significantly\
    \ smaller. However, both files are stored in this format. So if you have your\
    \ traces, you can use the Babeltrace to extract the generated trace data.\n\n\
    ```\n```\nsize_t fibonacci(size_t n) {\n    if (n == 0)\n        return 0;\n \
    \   } else if (n == 1)\n        return 1;\n    } else if (n == 2)\n        return\
    \ 1;\n    } else\n        return fibonacci(n-1)+fibonacci(n-2);\n}\n```\n```\n\
    \n# Analysing trace data\n\n```\n```\nint main(int argc, char **argv) {\n    unsigned\
    \ long i;\n    for (i=0; i<16; i++) {\n        printf(\"%lu: %lu\\n\", i, fibonacci(i));\n\
    \    }\n    return 0;\n}\n```\n```\n\nThe Babeltrace utility will be used for\
    \ producing the trace files. The first one is to use babeltrace --tttrace malloc\
    \ ./traces/session-20160615-154836-154836-2 which contains the full contents of\
    \ the trace file and order allows you to get a good idea about the captured trace.\
    \ The next step is to filter the output in order to get closer to the information\
    \ you are after.\n\nIn order to filter it, you will need to use LTtrace, which\
    \ defines a new event:\n```\n#define TRACEPOINT_PROVIDER\n#define TRACEPOINT_PROVIDER\
    \ \"lib-ftho\"\n```\n\nAs the output of babeltrace is text format, you can use\
    \ any text processing, including grep and awk, to trace the trace data. The following\
    \ awk can print the top 10 lines of all.\n\n```\n```\n#define TRACEPOINT_INLINE\n\
    #if !defined(TRACE_HEADER_TO_HP)\n#define TRACE_HEADER_TO_HP\n#endif\n#define\
    \ _TP_H\n#include <tracepoint.h>\n```\n```\n\n```\n```\nbabeltrace --tttrace malloc\
    \ ./traces/session-20160615-154836-154836-2 | \nawk 2>/dev/null | grep ascall_exit_open\
    \ | grep 'ret = -1' | \nsort -n\n```\n```\n\n```\n```\nTRACEPOINT_EVENT(\nfibo,\n\
    tracing,\ntTP_ARGS(\nsize_t, input_integer)\ntTP_FIELDS(\ncf_integer(size_t, input_integer,\
    \ input_integer)\n)\n```\n```\n\nYou can see the number of both outputs (brackets).\
    \ The first one shows the number of trace events in session-20160615-154836-154836-2.\
    \ The second one allows you to count the number of write system calls:\n\nEach\
    \ system call has an entry point and output point, which you can trace by a system\
    \ event when it is executed and when it has finished its job. So, for the write(2)\
    \ system call:\n\n```\n```\nbabeltrace --tttrace malloc ./traces/session-20160615-154836-154836-2\
    \ | \nawk 2>/dev/null | grep ascall_exit_open | grep 'ret = -1'\n```\n```\n\n\
    As an example, LibraryOffice is a useful tool which will tell you about its system\
    \ calls:\n\n```\n```\nbabeltrace --tttrace malloc ./traces/session-20160615-154836-154836-2\
    \ | \nawk 2>/dev/null | grep ascall_entry_open\n```\n```\n\nThe command above\
    \ will show which files were opened:\n\n![](img/d2d879b5f295fad9b17e4fc9976250c7_133_0.png)\n\
    \nThe thing view can help you to remember the trace records you are interested\
    \ in. After you filter and before dating the file executes in the background.\n\
    \n134 | The Hacker's Manual"
