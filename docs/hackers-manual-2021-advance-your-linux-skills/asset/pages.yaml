    of choice. John primarily sticks to two modes of attack: the first being a ''dictionary''
    attack where it compares encrypted or hashed words found in a dictionary to the
    corrupted or hashed password. The second mode is a brute-force attack, where the
    program generates all possible plain texts and compares them to the password hash.
    This method can take much longer, but it is very effective when you don''t have
