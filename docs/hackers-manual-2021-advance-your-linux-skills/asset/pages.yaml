    the Nextcloud installation. After establishing the connection, you can choose
    a local sync folder under your home directory as **home/bodhi/Nextcloud**. The
    client will be automatically synced to the server. The client detects changes
    whether you add, edit, or delete files on the Nextcloud server remotely or via
    locally.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_95_0.png)


    +   * Nextcloud hosts clients for Windows and Mac on its website (https://nextcloud.com/install/)
    mobile clients are also fetched from Apple''s App Store, Google Play or the F-Droid
    repository. Once you''ve uploaded all data to Nextcloud server, it is dropped
    in the Files menu. To upload a file, click on the **+** and select Upload from
    the drop-menu. You can organize files into folders: click the **+** and select
    Folder. If you''ve uploaded a file, you can rename it, edit or delete it. The
    Nextcloud interface displays the files in different views. For example, you can
    search for files or filter your list by choosing other filters.


    Another way to share files with others is by using the Nextcloud link. Select
    the file you want to share from the server manager. If you use Ubuntu, launch
    the file manager and click **Share** to generate a link. Here you can point it
    to your Nextcloud server, such as `http://192.168.1.106/nextcloud`. Once the link
    is generated, you can share it with anyone and use it like any other link.


    To share folders, go to the Files section in the web interface and select the
    folder you want to share. You can invite users and groups that you want to share
    the file with other options such as what you want to give permission to modify
    or delete files. You can also share with someone who isn''t registered with your
    Nextcloud server. Simply copy the link and Nextcloud will display a link to you
    to share with anyone you can also password-protect the link and set an expiration
    date.


    While you can interact with the cloud web, it is far easier to use one of our
    clients.


    When working with other users, you''ll appreciate Nextcloud''s version control,
    which creates backups of files before modifying them. These backups are also accessible
    through the Versions drop-down option to restore each file to a previous state.
    Just click the restore button.


    In addition to files, you can sync your calendar and address book with your Nextcloud
    server. Follow the instructions to enable them in the top-left pull-menu to select
    Calendar and Contacts options. Before proceeding, you will need to import your
    calendar and contacts from your cloud server. Nextcloud supports the **vCal**
    file format and almost every event format, including online ones as Gmail let
    you export their addresses in vCard and calendars in iCal format. By exporting
    your calendar and addresses the VCF and iCal files for your import before moving
    on.


    Import from the data is revealed and point to the export iCal file. The import
    process will work with a large address book. You can sync your contacts by importing
    email addresses and groups with Nextcloud. You can also import a similar contact,
    by importing the calendar and clicking inside the Gears icon. Here click the Gears
    icon and the button to import the iCal file.


    We can also enhance the Nextcloud server with Nextcloud. Following the workflow
    to flush out the default installation with new applications that will extend the
    functional power of your server


    # # Be不错


    The real advantage of commercial cloud services, such as Dropbox, is that you
    can access data from within any computer connected to the internet. By default,
    your Nextcloud server will only be accessible from computers on the network it
    is set up. But that''s not to say that you can''t fix a static IP or use a dynamic
    DNS server and poke holes in your router''s firewall to allow


    From the internet, it is possible to use a tunneling service. You can use a Python
    script to create your tunnel to a subdomain.pagsite.me. The service provides a
    pay-you-want model. For about $30 you get 2GB of data transfer for a month. Pay
    more to get more bandwidth for a longer duration and the ability to create additional
    pagsite.addresses


    To use Pagite, you need a terminal and the Pagite software with


    ```

    $ curl -s https://pagite.me/ | bash

    ```


    Now assuming your server is now accessible on: https://mynextcloudserver.me. Pagite.me
    remember to register mynextcloudserver.me with your own name.


