    \ and make it more\n\nmanageable, network admins can reuse\nconfiguration for\
    \ pretty much the same\nadvantages.\n\nThe use keyword in the host and service\n\
    defines points to the templates from\nthey inherit. The linux-\nserver and generic-services\
    \ used in the\nexamples are defined in the other\ntamples.cfg. The linux-server\n\
    sets defaults for effects in in each\n\nnotifications. The generic service\nworks\
