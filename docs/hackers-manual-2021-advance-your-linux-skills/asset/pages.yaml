  md: "# # Reusable configuration\n\nOne of the best features in Nagios is known as\n\
    object inheritance. Nagios makes it perfectly\nstforward to monitor a large number\
    \ of\nhosts and services thanks to its ability to use\ntemplates. You can use\
    \ them\ndefine the default values for hosts and services\ninside a single file\
