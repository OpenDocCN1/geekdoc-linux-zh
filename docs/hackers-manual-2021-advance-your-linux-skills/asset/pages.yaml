    # Scripts and functions


    Now that we know about the basics, we can go on to the more advanced things in
    Octave. Unlike a calculator, you can write scripts in Octave to define functions,
    which is much like basic programming functions where you can ask for input and
    perform tasks and return a result.


    Like expensive calculations, Octave can use scripts and functions to create a
    program that can run without user input and save results to files.


    By clicking the ''Script'' button on the top-left corner in the main window you
    can open a script file where you can write your code. This is independent of the
    user, meaning you don''t have to retry command when you want to calculate something.
    Script .m files ensures further compatibility


