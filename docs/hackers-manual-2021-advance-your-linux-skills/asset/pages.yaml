  md: '# # Software

    # Nagios: Monitor your PC realm


    Keep an eye on the network from the comforts of your armchair with the power of
    an industrial-level monitoring.


    A monitoring network is an involved task, but it can be cumbersome. Wouldn''t
    be great if all of us could manage our networks from the comforts of home like
    the Architect in The Matrix? Imagine just an admin who calls from the helpdesk
    at 3:00 am and demands you fly across the continent during the night. It doesn''t
    take much effort to keep an eye on a small network. Monitoring and troubleshooting
    a geo-dispersed network is a complicated and time-consuming endeavor.


    Nagios is one of the most popular and extensively used monitoring tool that you
    can use to streamline the management and monitoring of your network. You can monitor
    all devices and services that are active and connected via TCP/IP. The tool provides
    a variety of attributes ranging from sampling parameters such as CPU, disk memory
    usage to the status of applications, files, and databases.


    # Deploy big brother


    Installing Nagios is not but straightforward process; it''s made more complicated
    by the fact that the latest version of Nagios is not yet in the Ubuntu repository.
    So you should just download the latest release from its website and compile it
    on your


    Begin by installing all the dependencies with apt

    sudo apt install build-essential wget opensssl-dev libapache2-mod-php php-dev
    phplibapache2-dev. Then create a user and group for managing nagios as it is a
    good idea to run your server with user privileges:


    +   * sudo groupadd nagios

    Now Add the Nagios and the Apache user, data to the nagios group, in order to
    run nagios on

    * sudo usermod -a -G nagios nagios

    * sudo usermod -a -G nagios www-data


    Sets up the build directory for Nagios. Head to the Nagios website, download the
    source package (https://www.nagios.org/downloads/core-stable-/) and click the
    download link if you don''t want to sign up to receive emails about new updates.
    Then copy the download link to the latest release and fetch and extract it


    +   * wget -c https://assets.nagios.com/downloads/nagioscore/


    releases/nagios-4.2.1.tar.gz

    $ tar xvf nagios-4.2.1.tar.gz


    You can now compile Nagios with ./configure --with-nagios-with-command-nagcmd
    followed by make and finally install the main interface with all the files and
    scripts for the administration make nagios to install. To ease the configuration
    use make nagios install=/usr/local/nagios/etc directories. In the same vein, type
    make nagios install-command-mode / to set the correct permissions on the external
    command directory file types out for a list of all available options. Finally,
    use nagios install-init to install Nagios init scripts. Since since Ubuntu you
    will have to create a service with name nagios /etc/system/service with the following
    content:


    [Unit]

    Description=Nagios

    WantedBy=network.target


    [Install]

    WantedBy=multi-user.target


    [Service]

    User=nagios

    Group=nagios


    Save the file and then enable the service with:

    $ sudo systemctl enable /etc/systemd/system/nagios.service

    $ sudo systemctl start nagios


    Nagios is now running and working.


    # Plugin services


    The Nagios server has an extensive plugin architecture that you can use to monitor
    services like: FTP, HTTP and more. To monitor the monitoring server itself, to
    must install the Nagios plugins, to go download the package (https://www.nagios.org/plugins/)
    and copy the download link for the current stable


    +   * wget https://www.nagios.org/plugins/download/nagios-plugins-2.1.3.tar.gz

    * tar xvf nagios-plugins-2.1.3.tar.gz


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_97_0.png)


    98 | The Hacker''s Manual'
