  md: '# Rise of the Distros


    # The Future of distros


    What are they? Where are they going? Will they ever end?


    The term ''distribution'' didn''t become commonplace until 1995. By now we have
    a fairly concrete (relatively luxurious) notion that a distro consists of an install,
    a set of customized (perhaps) packages compiled from (modified) upstream stores;
    a kernel (which is just a package); desktop environment; documentation and so
    forth. We come to expect some kind of support too, generally through forums and
    IRC channels provided by the community. We have also to consider some means of
    creating our own packages, either in the hope that they will be included in a
    future release or just so that software using the standard packages can be cleanly
    added. In fact, distribution has many different forms at different times, and
    its meanings continue to evolve with time. What we call a distro is unique to
    the open source world and acts as the glue that holds all the fragments together.
    Such a thing couldn''t exist if these fragments were proprietary—there would be
    no need to put the bits together.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_22_0.png)


    Future gazing


    Linux distros continue to evolve, either through cosmic themes as desktop environments
    (like Cinnamon, Linux Mint) or by other features as packages. Fedora, sponsored
    by Red Hat, is at the forefront of developments. Looking at some alternatives
    shows where the future of Linux is going. One reality is that Fedora is quite
    rapid. It''s always been possible to make some RPM packages and to put them in.
    But the process is complicated with


    > We continue with the direction Linux Mint has taken-it has evolved into something
    that is all possible and easy to use.


    policies stringent, since they''re the same that apply to official carriers. Cop
    repos aim to make it much simpler for the more casual user, to share with the
    wider world without having to understand the ins and outs


    (beyond some standard runtimes) to speak of Flatpak is entirely self-contained.
    Ubuntu introduced a similar technology in-called Snap packages.


    Both of these formats potentially solve what we have been struggling with for
    years: getting latest versions of software into fixed release without breaking


    # The End of Distros?


    We''ve seen that in the early days, the distro was so much meant to make your
    life easier. The first ones probably didn''t think they liked them all, but the
    huge popularity that followed later definitely suggests that they had become much
