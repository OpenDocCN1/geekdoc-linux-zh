    \  - Full Domains (www.noscript.net)\n  - Base hostnames (mail.noscript.net)\n\
    - Open permissions menu when mouse over NoScript's icon\n  - Left clicking on\
    \ it toolbar toggles permissions for current top-level site (CTRL+SHIFT+CLICK)\n\
    \  - Full Addresses (https://www.noscript.net)\n  - Full Domains (www.noscript.net)\n\
    \  - 2nd level Domains (noscript.net)\n- Automatically re-allow pages when contents\
    \ change\n  - Reload the current tab\n- Allow sites opened through bookmarks\n\
    \nUse the command to tweak a'user's account and set an expiration date, such as:\n\
    \n```\nsudo usermod -e 2017-01-02 bodi\n```\n\nIn this example the user bodi will\
    \ not be able to access the account from January 2, 2017.\n\n# ## Permissions\
    \ primer\n\nAnother important part of securing your Linux system is setting permissions.\
    \ In Linux and Unix, everything is a file. Directories are files and files are\
    \ files. Every file must be owned by at least one user and one group. Each user\
    \ has a unique identifier (UID) and group identifier (GID). Each user must be\
    \ assigned to at least one group, which is a collection of users that has been\
    \ established by the system administrators.\n\nUsers may belong to many groups.\
    \ Like users, groups also have unique IDs (GID). The accessibility of a file or\
    \ directory is based on its UID and GID. Users can only access what they've been\
    \ given permission to run. Permission is granted because the user belongs to the\
    \ file's group or the file is accessible to all users. The exception is the root\
    \ user, who has access to all files in the system. Also, Linux has three kinds\
    \ of permissions assigned to them—users, groups and others—that determine whether\
    \ a user can read, write, or execute file.\n\n# ## Keep eye on processes\n\nVirtually\
    \ all activity happens processes running in the background. If you want to audit\
    \ your security activity plan, you should keep an eye on the processes running\
    \ on your machine and immediately take against suspicious processes. You can use\
    \ the top command to list all running processes and how they are consuming\n\n\
    the available resources you. If you want a more friendly version of the processes\
    \ running, install the htop from the repository. htop displays process by ID or\
    \ PID which identifies and keeps track of processes. You can use the pkill command\
    \ to kill a process, such as firefox\n\nprocess you can use the kill command to\
    \ terminate the PID (Process ID) of the unregulated process. For example, kill\
    \ 1004 will allow the Linux kernel to shutdown the process associated with the\
    \ specified PID. You can also kill a process from within the top interface. Press\
    \ k and the ID of the process to terminate.\n\nYou can view the permissions of\
    \ a file or directory with ls command. When modifying permissions, use chmod to\
    \ modify permissions with numbers or with letters. Letters are easier to understand\
    \ for most people, but numbers are better once you get used to them. The table\
    \ (over the next page) shows the permissions of the process type. For example,\
    \ chmod +x gives execution permissions to the owner. The chmod 744 does the same\
    \ thing but also uses numbers. Similarly, chmod g+x adds execution permissions\
    \ to the group while chmod is used for how you require the permission.\n\nHowever,\
    \ it is not used to define per access control lists (ACL) that allow you to specify\
    \ elaborate permissions for multiple users and groups. While you can define them\
    \ manually, tools like the getfacl can help you see a list of them for each file\
    \ or directory. Once installed, the tool can be used to fine-tune the access for\
    \ each individual file. If you change any of the filesystem permissions, the file\
    \ should belong to the root owner and group with 644 permissions.\n\n> Quick tip\n\
    From a security point of view, it's better to check the official permissions as\
    \ much as possible, and only check as a last resort.\n\nThe Hacker's' | 73"
