    \ can check the configured servers. Click on the links in the menu to view the\
    \ list of all hosts with their status and a status-line configuration. Click on\
    \ the name of the service reported for that particular service to view details.\n\
    \n# Receive notifications\n\nWhile Nagios keeps an eye on all the hosts that you've\
    \ given it to, you'll have to set the notification dispatch to push up any errors.\
    \ Another option is to let the monitoring send you notifications via email or\
