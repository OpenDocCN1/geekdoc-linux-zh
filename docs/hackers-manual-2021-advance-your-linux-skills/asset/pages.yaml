    # # RISE OF

    # THE DISTROS


    Linus released the Linux kernel over 25 years ago, but the concept of a distribution
    did not come about until later. We trace the journey from a humble Usenet post
    to Canonical’s Ubuntu.


    >  > Linus Torvald wrote "A kernel by itself gets you nowhere" in the release
    notes for Linux 0.01 in 1991. This statement seemed apparent to early Linux adopters
    who wanted to use the OS for something and faced a bit of a struggle.


    Torvald had already ported GNU Bash interpreter and the GOC compiler, but beyond
    that the operating system by itself wasn''t exactly capable. The 0.01 release
    consisted only of source code and was only released to those that had shown an
    interest in Torvalds'' Linux updates on Usenet. Compilation required a working
    copy of Minx too. Torvalds'' respected other people''s licenses and so loathe
    to pinch Minx code without permission. Fortune newly of his nascent, free operating
    system soon spread and Linux slowly to grow.


    # ### Linus Torvald: “Making Linux GPL was definitely the best thing I ever did."


    The original Linux copyright precluded it being distributed commercially, but
    in February 1992 Torvald suggested adopting the GNU GPL. A tale of serious, even
    in those early days development it was clear that the GNU tools would be of intrinsic
    importance to the fledgling Linux.


    In December 1992, version 0.99 would be the first released under the GPL, with
    Torvald later reflecting that “making Linux GPL was the best thing I ever did."


