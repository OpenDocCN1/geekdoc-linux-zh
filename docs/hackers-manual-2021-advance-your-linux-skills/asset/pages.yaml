  md: "# Software\n\n# # Octave 4: Start your plotting\n\nIt's time to delve into\
    \ manipulating and visualising data using the now standard – graphical user interface\
    \ in Octave 4 and its new features.\n\n![](img/d2d879b5f295fad9b17e4fc9976250c7_101_0.png)\n\
    \n> > The Octave GUI, first introduced in version 3.8, is now the normal user\
    \ interface, and replaces the aging command-line interface by making it much easier\
    \ for the Average Joe.\n\nHere comes a time in a man's life he must ask: to calculate\
    \ or not to calculate? If you're anything like the author with an engineering\
    \ final project in the few days and three hours of coffee on your desk, the answer\
    \ is yes. When you turn to Octave, you will find a piece of software that is much\
    \ easier than scattered paper-notebook equations in a fight.\n\nOctave is an open-source\
