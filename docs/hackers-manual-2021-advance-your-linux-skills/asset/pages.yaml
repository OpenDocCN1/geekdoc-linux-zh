    # Admin: Core commands


    20 commands that all Linux web admin should know.


    Are you an accidental admin? Someone realised, too late, they were responsible
    for the workings of a Linux server – because something has gone wrong – find themselves
    lost in a world of terminals and command lines that make little sense to normal
    humans?


    What is SSH, may you be asking yourself? Do those letters actually mean anything
    except security patches for servers? Don''t worry, you''re not alone. And to help
    you, we''ve put together this guide with essential Linux commands that every admin
    should know.


    # Becoming an accidental admin


    While we argue that everyone using Linux as an operating system does so through
    choice. We suspect that most people''s first interaction with Linux happens unwittingly.
    You click a button on your ISP''s account page to set up a personal or web server
    – and suddenly you''re an admin. Even though you didn''t know it.


    When you''re starting out with your web server, things are usually straightforward.
    Nearly all hosts provide you with a web interface such as cPanel or Plesk to manage
    your server. There are powerful pieces of software that give you quick easy access
    to logs, mail services and one-click installation of applications like WordPress
    or forums. But the first time you don''t think that


    straightforward to do through the graphical control panel, you''re suddenly out
    of the world of icons and explanatory tools and into the world of the text-only
    Terminal.


    To make things worse, for a lot of people the first time they have to deal with
    the Terminal when something goes wrong and can''t realize that the flaw sweeping
    the web server and all Linux servers must be updated (once it happens – search
    for ''Heartbleed'' to find out).


    Suddenly you realize that your server is compromised and your personal small blog
    may be part of a massive internet botnet used to launch DDoS attacks against others.
    You''re not only a stranger in a strange land but you''re probably responsible
    for something that was really impossible to you, which you might thought it was
    being hosted for a couple of months and seemed almost free.


    Since most servers are running Ubuntu, this is based on a particular distribution.
    And all the commands here are as applicable to a Linux desktop as they are to
    a server.


    # sudo


    The most fundamental thing you know about Linux''s administration is that there
    are two types of accounts that can be logged in: a regular user or an administrator
    (or ''superuser''). Regular users are not allowed to change files and directories
    that they do not own. This applies to the core operating system files which are
    owned by an admin called ''root''.


    Root or any administrator can be temporarily granted root privileges by using
    sudo in any of Linux command. To edit the configuration files that are mounted
    using the text editor, nano you might type: nano /etc/fstab (we don''t recommend
