    # VirtualBox:

    Virtualisation


    We reveal how virtualisation can tap into your PC''s memory, processor and power
    to help you multiple operating systems.


    Today''s multi-core PCs are built to run multiple tasks simultaneously, and what
    better way to tap into all that power than through virtualisation, and in particular
    hardware virtualisation which allows splitting a single PC (the kind known as
    ''host'') into multiple virtual PCs (referred to as ''guests''), each capable
    of working and independently of the other.


    Virtualisation allows you to run multiple operating systems on the same memory,
    storage, and other hardware resources. If your PC is powerful enough, you can
    run multiple machines in parallel, enabling you to switch between them in your
    computer without having to tie up multiple PCs.


    Virtualisation isn''t simply a means of dividing up computing power. It allows
    you to easily run alternative environments in a safe,boxed environment – your
    guest PC can be isolated (in – Ed) from your host, making it easy to experiment
    with new software or simply try a different flavour of Linux, for example. It
    can also be used for countless purposes – you may have switched from Windows to
    Linux, for instance, but without having to reinstall your programs without using
    a dual-boot system.


    If it goes without faster and more for your PC, the better it is to run one or
    more virtual machines. If performance allows for all of your virtualisation experiments,
    it''s perfectly possible to run a single virtual machine in relatively low-powered
    environments.


    # Choose VirtualBox


    There are many virtualisation solutions available for Linux, but what better way
    to manage yours (or even just


    your toes (in the water) with the open-source solution, VirtualBox? VirtualBox
    may be free, but it''s still a powerful option that offers both a friendly graphical
    front-end for creating and managing your virtual machines, plus a craft of command-line
    tools for those who need them.


    An older version of VirtualBox is available through the Ubuntu Software Center,
    but for this tutorial we will use the newer version, which you can obtain from
    www.virtualbox.org/wiki/Linux.


    Downloads. You''ll find that a variety of different builds exist, and each guest
    needs a specific distro (or version). Build (SDI) and add-ISO to download and
    keep files, or follow the instructions provided to add the appropriate VirtualBox
    extensions for your use case.


    Once it''s installed, the way you get to start is by launching VirtualBox through
    the Dash. The Interface Manager is where all your virtual machines of yours are
    listed (and organized) neatly. It is also easy to create new VMs from scratch,
    but before you begin, click File > Preferences to change the default folder to
    store your virtual machines other than the one that by created. This is a critical
    step, as each guest may consume gigabytes of space for needs.


    # Create your first VM


    With your virtual machine folder set, click ''OK'' and then the ''New'' to create
    your first virtual machine. The Create Virtual Machine Wizard works in two of
    them: for experts, who can start by selecting configuration steps in a single
    window. Then by the two-drop menus –


