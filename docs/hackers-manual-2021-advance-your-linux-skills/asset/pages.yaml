    The script will be blank the first time you use it and located in a tabbed ''editor''.
    You''ll find a number of options across the top of the file for running, and saving
    the script. When you start typing commands you''ll notice that the editor also
    colors how many of the variables are similar to look and that helps you.


    Now that you''re familiar with the layout and basic functions, what can you do?
    Can you do anything that you want in other programming language? Yes, with that
    you can use loops and if-takes to create repetitive tasks, such as generating
    numbers; assigning variables; the prompt for input; and creating and displaying
    value statements.


    One of the things you can do with your newfound scripting ability is create a
