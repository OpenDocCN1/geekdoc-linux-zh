    and interface will go a long way in getting your buddies to sign up yet another
    service. Using new applications that aren''t too dissimilar to the popular ones
    will help you and your friends to continue messaging without the application getting
    in the way.


    # CryptoCat


    If it didn''t insist on a 12-character long password, CryptoCat would feel just
    like any other client. When you sign in for first CryptoCat will generate encryption
    keys and store them on your new device. It is very easy to log into your account
    with your buddies. Each device has a unique fingerprint that you can verify with
    your buddies. If you can trust it, it is trusted.


    For additional security, you can ask CryptoCat to send only to trusted devices.
    When receiving messages, Cryptocat will always show which device used to send
    that message and whenever your buddy adds a new device. The IM window is straightforward
    and includes buttons to record and send mute video messages and files.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_67_0.png)


    # Goldbug


    On the first launch, you''ll be invited to create authentication information and
    the application generates sets of encryption keys each pair for a different task,
    such as messaging and emailing each. Once the keys have been generated, you''ll
    have to enable the ''Activate'' button. You can then connect to a chat server
    or network and add friends. Initially, the project will start its own server as
    a neighbour but this is strictly for testing purposes only, and you''ll have to
    exchange keys with your friends before you can chat. Goldbug offers the option
    to import and export public keys. Its simple interface allows you to export your
    public key after encrypting it with a friend already identified. Despite its uniqueness,
    Goldbug has one of the most confusing interfaces and is the least intuitive.


