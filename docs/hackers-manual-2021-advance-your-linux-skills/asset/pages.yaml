  md: '# Hacking


    # # Grub: Boot ISOs from USB stick


    An easy way to avoid a bag full of DVDs is by copying them all to USB stick, with
    a convenient menu to pick which one to boot.


    Most all the distribution (distro) ISO files on DVDs are known as disk images.
    This means that not only can they be copied to a CD or DVD with a stick but the
    USB stick will then boot as it were a DVD. This is a handy way of creating installable
    media if you don''t have an optical drive, but it has one significant drawback:
    With sticks holding tens or more gigabytes costing only a few pounds, and small
    devices becoming harder to find, this is a worthy trade. Wouldn''t it be better
    to put several ISO files on the space of both stick and in your pocket or pocket
    bag and choose which one to boot? This is not only more convenient than a handful
    of USB sticks, but also faster and more compact than a handful of DVDs.


    The good news is that this is possible with most distros, and the clue to how
    to do it is on our DVDs each month. We used to laboriously unpack distro ISO onto
    the DVD so we could boot them and then we had to include scripts to reconstruct
    the ISO for booting. Using Grub to boot the DVD, which has features that make
    booting from ISO files possible. The main advantage of this approach,


    least for the poor sorry getting the DVD working, is that different distros need
    to be detailed and the options to boot from ISOs are rarely documented.


    In the next few pages, we will show you how to do this: how to set up USB stick
    in the first place and the options you have around you. We will also show you
    how to deal with less co-operative distros.


    # ### Setting up the USB stick


    First, we need to format it. We assume that the stick is set up with a single
    partition, although you could use the first partition of a multi-partition layout,
    you cannot get it formatted as a bootable table without some effort. If you don''t,
    use FAT2 or ext4 to partition the drive, then the choice of partition is irrelevant
    as long as it is Grub to boot the drive.


    We used FAT2 and ext2 (there''s no point using the journaling ext3 or ext4 on
    a flash drive). Whatever format fits in means we can download and add images from
    a Windows computer if necessary. Whatever you use for the given label, it is MULTIBOOT,
    as it is important later.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_135_0.png)


    136 | The Hacker''s Manual'
