    we managed to source one, which is the focus of this tutorial. The question is
    whether Linux 10, with an Intel Atom Z3735 processor, 2GB RAM, 32GB internal EMC
    storage and touchscreen, works with multi-touch support. It can be bought with
    detachable keyboard and touchpad through sites like ebay.com for under $125. These
    devices come with Windows 10 pre-installed, but it is possible to run both and
    install Linux on them.


