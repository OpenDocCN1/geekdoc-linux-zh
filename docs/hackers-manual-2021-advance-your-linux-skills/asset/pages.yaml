    So we need to go to GParted and resize your partitions to make space create a
    large partition for data. Then edit `/etc/fstab` on each distro to mount this
    partition. You can also add entries for other distros there, such as `/mnt/common`
    - it like this it also makes access to files from other distros. So delete new
    `/home` and create a directory in each distro to create symbolic links to your
    home in other distros, for example


    And so, when you save a file in Documents, it will be in `/mnt/common` and available
    to all your distros. This assumes you are the only user of the OS you currently
    using.


    # ## Who owns?


    Now we have to tackle the issue of file permissions and ownership. The first thing
    to do is make sure that `/mnt/common` has the correct ownership:


    ```

    sudo chown -R user:user /mnt/common`

    ```


    You may expect this to work for all distros if you created a user with the same
    name in each distro because Linux filesystems don''t care about usernames but
    rather user IDs (UID). Most distros give the first user UID. You should check
    which UID is in each distro, run `id` command, with no arguments. If they all
    match then, otherwise you will need to change the UID by editing `/etc/fstab`.
    If this edit doesn''t work, you might need to create a new user logging in with
    the same ID as the old one.


    Find the line for your user, which will seem like this:


    ```

    user:1000:1000 /home/user`

    ```


    The first number is the UID. Change it to match the other distros size. Then,
    need to change all files owned by the old UID to the new one. In your home directory
