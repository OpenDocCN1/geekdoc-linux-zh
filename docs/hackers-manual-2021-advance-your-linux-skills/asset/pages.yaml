  md: '# # Hacking


    # # The art of war-driving


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_113_0.png)


    Arriving wireless networks while moving on foot or in a vehicle.


    Hackers do this to look for vulnerable networks to exploit


    As an ethical hacker, you won''t do this unless there are no rogue wireless networks
    in your home or network because you cannot interfere with legitimate access points.
    You may also want to be your own vulnerable.


    To start a wardriving, you will need a wireless card or dongle that can be put
    into "monitor mode". This is used to detect wireless packets without associating
    with them. Not all cards support this feature. In Ubuntu you can check if yours
    does by using the command `iwconfig wlan0 && sudo`. wlan0 is the name of your
    wireless interface. This guide was written for Kali Linux and USB Wi-Fi adapter
    (£37 on Amazon UK)


    You''ll also need a GPS to locate access points more easily. Which model you choose,
    check that it is compatible with Linux before buying. During testing, we found
    that the GlobalSat BU-393-54 USB GPS worked out of the box with Kali Linux.


    If you''re using Kali Linux, make sure to follow the steps (see the next page)
    as you''ll need access to the internet to download the files to get the GPS working.


    VirtualBox can also use USB devices by default. If you need to install the Guest
    Additions to VirtualBox to add additional features including support for USB devices,
    simply fire up the Kali virtual machine and insert CD. Once you''ve inserted Guest
    Additions follow the steps, restart the Kali virtual machine and click


    Devices menu. Move around your USB. From there you can choose your USB Wi-Fi adapter
    and GPS by checking the box next to their name.


    Once Kali loads, follow the steps in the tutorial (below) to get your GPS working.
    Then run the command `kismet`. This will start `kismet`, the wardriving tool for
    Wi-Fi networks. Use the arrow keys and Enter to select networks.


    If you see a network you like, press Enter to confirm, again ignoring the warning
    about rogue networks. Kismet will tell you if it detected a packet source. Press
    Enter to add the name of your wireless network. (This is most likely what you
    want to do). To stop the command, press Ctrl+C to close the Console Window and
    open Kismet''s main menu.


    As Kismet runs, it will create a file with your data. You can then convert this
    kml file to data using other software to plot the location of networks on Google
    Earth.


    The handy companion to tool kismet, gismet_tool, converts the data to a kml file,
    data you can then use with Earth browsers or Google Earth.


    ```

    kismet start live devices

    Kismet

    lapped on ...

    ```


    # # Let''s get Kismet action


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_113_1.png)


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_113_2.png)


    # ## 1 Set up a GPS device


    Open Kali Linux and run `apt-get install gpsd` to download the necessary files.
    Connect your GPS device via USB. If you''re running Kali inside VirtualBox, pass
    the USB device and enable it. Run the command `ls /dev/ttyUSB*` to see where it''s
    mounted, e.g/ `/dev/ttyUSB0`


    # ## 2 Start the GPS daemon


    Once Kali loads, you will see the GPS data. Press Ctrl+C to stop kismet. Then
    run `kismet -q` to find the name of the .netxml file. Next run `kismet -q ''select''
    from "wireless" or `kismet_wardriving`.


    # ## 3 Export GPS data


    Kismet detects wireless networks over your interface. Interface with GPS to map
    the location of access points.


