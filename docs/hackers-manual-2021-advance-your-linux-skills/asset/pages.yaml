    # # Install Ubuntu with Windows


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_12_3.png)


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_12_4.png)


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_12_5.png)


    +   1 Make room

    to create an empty partition for your Ubuntu installation, you''ll have to squash
    your existing Windows partition. Fire up the Disk Management tool and right-click
    your partition that''s typically assigned the drive letter C. Then select the
    Shrink Volume option from the pop-menu.


    +   2 Shrink Windows

    This brings up the Shrink dialog that shows you the total size of the hard drive
    and the maximum amount of space you can shrink out of the selected partition.
    Create a new partition, specify the size of the partition in megabytes and click
    Shrink to start the process.


    +   3 Updates and plugins

    After your computer boots from the Ubuntu installation media, there''ll be a checklist.
    Toggle the first checkbox to show only available updates from the Internet, and
    then install the plugin required to play MP3 content and Wi-Fi firmware.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_12_6.png)


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_12_7.png)


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_12_8.png)


    +   4 Use free space

    In the screen labelled installation, toggle the ''Something else'' radio button
    to manually partition the drive. Ubuntu will now show you a list of partitions
    on the hard. Select the one labelled Free Space and click the sign (+) to create
    a partition of this space you freed up in Windows.


    +   5 Define partitions

    In the partition box enter the size for your Ubuntu partition. Then use the ''Mount''
    point menu to select the / option. If you like, you can create a separate partition
    (if you want to keep users and system files separate) in exactly the same size.
    Just select /home from the menu.


    +   6 Localise and personalise

    And that''s it. Ubuntu will now start the process of installing Ubuntu. While
    the files are being copied to the hard drive in the background, at the last screen
    you''ll be asked to enter your login and password details, as well as a name for
    your computer.


