  md: '# Learn to hack


    Before you started on your first steps to becoming a hacker, download a copy of
    the ISO file for Kali Linux from www.kali.com. This will contain the tools you''ll
    need to master the basics of hacking. Kali is versatile and can be booted from
    a DVD or a hard drive or USB stick.


    You might also enjoy the Metasploitable (v2.3) compatible virtual machine, which
    you can download from https://sourceforge.net/projects/metasploitable/files/Metasploitable2.
    The Metasploitable files are in ZIP format so extract them before being again.
    In Ubuntu right-click the ZIP file and "Extract..."


    Metasploitable is designed to be a virtual machine, so it can be run inside a
    window on your computer. You can also connect different operating systems and
    files to your physical machine.


    In this guide we will explain how to set up virtual machines for both Kali and
    Metasploitable, as well as how to configure them to practice your hacking skills
    without affecting the rest of your network.


    Virtual machines are managed by specialist applications such as VirtualBox or
    VMware. We will use VirtualBox for this guide.


    ```

    sudo apt-get install virtualbox

    ```


    Once you have installed VirtualBox, click the New button to create a virtual machine
    for Kali. Kali Linux will prompt you to choose a name for the machine. Type Kali
    Linux and click next. Then select the amount of RAM available.


    The next step is optional. VirtualBox can create a VDI (virtual disk image) file
    that acts as a hard drive for the machine. Kali will quite quickly boot from the
    ISO image, but if you want to be able to upgrade and save changes, choose "Dynamically
    Allocated" and use the slider to make it at least 2GB in size. When you''re ready,
    click Create to set up the Virtual Machine.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_112_0.png)


    > The ideal product : Kali Linux and the Metasploitable2 running in virtual machines,
    which can connect to only one another.


    Click the New button again in VirtualBox to create a new virtual machine, this
    time with the name Metasploitable. Click Next to continue and again accept the
    default amount of RAM. Metasploitable2 runs and doesn''t need many resources.


    In the Hard disk section, choose an Existing Virtual Disk file icon then select
    the Metasploitable disk image (metasploitable.mdk). Click Create to complete the
    setup


    At this stage you have created a host-only network for two virtual machines. This
    will enable Kali to use Metasploitable virtual machine to use your hacking tools,
    but carefully the machines themselves won''t be able to access the rest of the
    network or the internet, meaning that no real harm can come. See the guide for
    the next steps (following).


    Once the host-only network has set, highlight each of the virtual machines and
    click Start to power them on. Log into Metasploitable with the username admin
    and password msadmin. To create a virtual hard disk for Kali, choose Live mode
    when booting its virtual machine.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_112_1.png)


    # Get Kali talking


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_112_2.png)


    # 1 Create your host interface


    VirtualBox, go to File>Preferences. Click Network in the left panel, select the
    Host Only Networks. Click+ button to add a new host only network. Define the default
    name of your network is vboxnet0. Then OK.


    # 2 Connect Kali to it


    Highlight the Kali virtual machine and click Settings.In the Attached menu choose
    Host-only adapter. The name of your Host Only network will appear here. Click
    OK, then repeat these steps for the Metasploitable linux machine.


    # 3 Add a second network interface


    If you want to install Kali or any new programs you''ll need internet access.
    To add another network interface, go to Settings>Network for Kali''s virtual machine.
    Click the Adapter 2 tab, then Enable Network Adapter. In the Attached menu press
    NAT-.


