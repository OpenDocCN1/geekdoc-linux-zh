    y=3*x+24;

    ```


    And just like that, we can calculate the value of ''y'' with 36 that we used,
    and display the result in the command window. In Octave, this is a simple example
    but Octave provides a host of tools to create more complex scripts and functions,
    such as: de-struct; all of the operators for adding, subtracting, multiplying;
    dividing as roots and exponents. This includes all built-in mathematical operators.


    Functions that contain mathematical expressions are usually a separate snippet
    of code that can be called by the main script. For those familiar with it works
