    # # GnuPG: Key Management


    Your GnuPG key is precious. We explain how to create a good one and how to keep
    it safe from online thieves.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_79_0.png)


    | Index | Status pages | Overview of pools | Interact with the keyserver | HTTPS
    Verification | Key management | Contact |


    # ## OpenPGP Public Key Server Commands


    Welcome to the keyserver interaction page for the pool.sks-keysvers.net. Interactions
    will be performed over TLS/SSL enabled connection.


    # ### Extract a Key from the Server


    # ### Submit a Key to the Server


    # #### Extracting a Key


    Here is how to extract a key:


    +   1. Select the "Index" or "Verbose" check box. The "Verbose" option also displays
    algorithms on displayed keys.

    2. Type you want to search for in the "Search String" box.

    3. Press the "Do search" key.


    nuPG, the "Gnu Privacy Guard", is a powerful tool used to encrypt email or verify
    the authenticity of packages before installing them. It implements the OpenPGP
    standard that uses public-key cryptography to provide privacy and authenticity
    through certification and trust.


    The GPG documentation explains exactly why key management is essential. In this
    tutorial, we will focus on key management and explore best-practice with that
    in mind. We use GnuPG version 2.1.2 marked.


    # ### Some basics


    A GPG key has public components referred to as a public key, and a private key.
    Private keys are used for signing and decryption, public keys for encryption and
    verification.


    Public keys are contained in "certificates" (which may be a name, email address,
    or photo) plus one or more subkeys for signing and encryption. The relation between
    subkeys in GnuPG''s development history and current security-related concerns.


    An individual using GnuPG collects others'' public


    keys, possibly with a certificate from a key server, with their own key pairs
    in GnuPG. Relying on "trust" can mean key pair, private key, subkey or certificate.


    We consider this as a hypothetical new user who wants to start encrypting everything.
    Let''s create something that works, like this:


    +   * $ gpg --generate-key alice

    * $ gpg --list-keys


    # ### Set your parameters


    The first thing is to configure GPG. It uses a ~/.gnupg to store configuration,
    runtime information and identity. You can create this automatically, but manually
    creating it enables us to setup before using any time. By using restricted permissions
    to execute:


    ```

    # ~/.gnupg/gpg.conf

    keyserver https://pool.sks-keyserver.net

    ```


    Although GPG assumes a default, writing a configuration file allows us to set
    some parameters to customise preference:


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_79_1.png)


