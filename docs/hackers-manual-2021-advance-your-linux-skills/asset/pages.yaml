  md: '# Linux kernel


    # # Process management


    Managing and scheduling processes is one of the most important subsystems of the
    Linux kernel. Its purpose is to access the computer''s processors. Linux can run
    several processes at the same time because the processor can only run one process
    at any given time. To multitask, Linux must switch between multiple processes
    in rapid intervals.


    Also when it switches from one process to another, it must ensure the environment
    is exactly the same as it was left without recurring resources. These tasks are
    the responsibility of the scheduler. The set of rules used to determine which
    process to run next is called the scheduling policy.


    Since processes are all equally important, the scheduling policy ranks them. Process
    priority is dynamic and the kernel keeps track of what the processes are doing
    and adjusts their priorities. Linux processes are


    preemptive means that before executing a process, the kernel checks whether its
    priority is greater than the priority of the currently running process. If the
    execution of a process is interrupted and another process from the scheduler is
    selected, Linux has been preemptive kernel since v2.6, which means processes can
    be preempted in both user and kernel mode. The lifecycle of a process is managed
    by kernel algorithms. The kernel uses various system calls to create, change process
    state, and then terminate them.


    To multitask, the kernel must decide how much time to devote each process and
    when to switch to the next.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_26_0.png)


