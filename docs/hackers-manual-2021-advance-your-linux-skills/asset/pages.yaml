    - cp /path/file will allow you to copy a file from your location (the - character
    stands) to starting in your home folder. Starting with a / it will copy to the
    path of the root folder of your hand.


    # 17 mv & rm


    If you want to delete a file, using it as a file manager becomes simple and quite
    a joyful experience. As with cp, the three fundamental commands you''ll need to
    remember are mv, rm and the mv command is used to move a file from one location
    to another


    # 18 nano


    If you need to see a file and edit it, but use programs in the text editor. There
    are several text editors which are popular, like nano, vi and em. You can open
    a file by typing name: nano -path/to/file (and do the same with vi). Some of the
    terminology may seem strange to you. To out Ctrl+O to save changes, then see example.


    # 19 history


    If you''re copying and pasting commands from the web all, you might want to check
    what you''ve actually done. You can use history to give you a list of all the
    terminal commands going back; a long list of numbered commands with history, you
    can go back through commands using the up and down arrows (and re-issue them by
    pressing Enter), or search for commands using Ctrl+R.


    > > Keep eye on the directory of the command line to figure out where you are.


    rm is used to delete a file and cp will copy files and folders. With just as cp,
    you can also enter a filename to a file in the directory where you are working
    or a file path starting from the root of the disk - with cp.


    The big thing to remember is that in the Terminal there is no undo or delete function:
    if rm it''s gone (or at least unless you have special skills to recover) and if
    a similar fashion, if you use cp or cp a file you''ll make a mark of where you
    left it.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_158_0.png)


    One command''s value is valuable is short for ''manual''. This setup will help
    you find the other. To know all of the command''s info, simply type name is and
