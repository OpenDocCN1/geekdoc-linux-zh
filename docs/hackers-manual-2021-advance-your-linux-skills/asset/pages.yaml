  md: '# # Nextcloud


    # # Install additional apps


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_96_0.png)


    # ## 1 Application repository

    You can extend your default Nextcloud by adding apps. Ring the pull-down menu
    in the top-left of the interface and select the option Apps. By default, you are
    shown a list that are already available for installation. You can browse through
    this list and read their descriptions to understand their functionality. You can
    also disable any app except necessary.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_96_1.png)


    # ## 2 Calendar and Charts

    These should be the first applications you use. You''ll find listed under the
    Productivity category. You can use the app''s interface to add dates, charts and
    other details. The app also supports exporting calendars, which you can sync with
    other apps using industry standard formats and protocols (as shown below).


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_96_2.png)


    # ## 3 External storage

    If you use public storage like Dropbox or Google Drive, you can connect and manage
    them from Nextcloud using the External storage support app. Once enabled, the
    app will appear in the Admin section. Use the drop menu to select a supported
    service and enter the authentication details in the space provided.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_96_3.png)


    # ## 4 File access control

    If Nextcloud will serve several users, it would be a good idea to install the
    File access control app. This app is also configured via the Admin section from
    where you can define access control rules on parameters such as IP address, file
    size and more. The users are tagged to groups of the Nextcloud deployment and
    access is granted only if the access holds true.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_96_4.png)


    # ## 5 Bookmark manager

    An app that enables you to store and manage bookmarks in your Nextcloud server.
    This allows the app to store bookmarks directly, or import them from a file from
    your browser. The app also has a bookmarklet that you can add to your browser
    bar. Click the bookmarklet to add a website to Nextcloud''s list of bookmarks.


    # ## 6 Automatically tag files

    For better organization, you can use the Automated tagging app which will assign
    tags to files based on some defined criteria, as soon as they are uploaded. You
    can define rules for assigning tags in the Admin section of the server. Nextcloud
    will compare it with the defined rules if a file matching is found.


