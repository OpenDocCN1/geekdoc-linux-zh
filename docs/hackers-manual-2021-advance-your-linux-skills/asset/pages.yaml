  md: '# The Ultimate Server


    # # Adding Samba


    Get ready to dance to the samba protocol with extra boss nova.


    One of the most noble duties any home server performs is sharing. Whether it''s
    to share gigabytes of bangers tunes you''ve amassed, or just a place to put them
    when you can''t find a USB drive with enough capacity, having some central and
    communal storage space is incredibly useful. Unlike OSes with their file sharing
    protocols NFS which has been around since the DO:


    Instead we''ll use Samba, which is an implementation of the sharing protocols
    used in Windows. This has the advantage that the server we will build will be
    accessible to any Windows or Mac, as well as other Unix devices.


    Before we set up it''s a good idea to set up directories for the network shares.
    We''ll store them on our RAID, which should be auto-booted if you''ve rebooted
    since the disk is not mounted. We''ll use `/mnt/raid/fraid`. Let''s make those
    directories:


    +   - `/mnt/raid/music`

    - `/mnt/raid/photos`


    We''re going to allow anyone access to all of these, and we will allow anyone
    to write to the public. If you have some documents or files that you feel other
    network users would need benefit, then now is a good time to put them. Samba allows
    us to restrict this with user password and access, but for a home network it''s
    simpler to allow guest access to their shares. We will make the public directory
    writable with `chmod 777`.


    Now we''ll apt-get install samba and set up our shares. Edit the `/etc/samba/smb.conf`
    file with the following details in the Shares Section:


    ```

    [public]

    path = /mnt/raid/fraid

    read only = no

    browable = yes

    guest ok = yes

    ```


    Now restart the service with `systemctl restart samba`. You should be able to
    access the shares by navigating to `http://192.168.1.100/` from any machine on
    the network. For Windows this syntax works just fine. For Linux machines, you
    can share the wild via


    ```

    smb://192.168.1.100/

    ```


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_40_0.png)


    > PCMFM will prompt you for either guest or user access to network shares.


    line (on-the-fly if samba package is installed):


    Make entries in `/etc/samba/smb.conf` for the music and shares we want to share
    with this time. The guest ok line is set to Yes (it doesn''t really matter which
    directories, for better of sharing, as all are writable by nobody).


    https://tutorial.net/connect-to-samba-network-shares-windows-10/ This is an example
    of which Windows 10 is easy to set up. The Samba credentials can be synchronised
    with user accounts on the server, so this way


    If you run into problems configuring Samba (and you won''t be the first), the
    log program can provide a useful advice: SMB fault messages are not known for
    yourself.


    # Printing


    Besides files, using the SMB protocol (and CUPS protocol /ipp) allows us to share
    printers. This is useful since when the server and the printer are remote, anyone
    on the network can use the printer without having issue reports. But first, by
    time you have more than one computer and device to partly using the Common Union
    Print System (CUPS), which is requested at installation:


    Some manufacturers offer Linux drivers, but these are usually for other purposes
    or outdated drivers you might not need. Instead, have a look at the hardware that''s
    supported by the free driver.


    When printing, choice is key. Many of the free drivers are already installed CUPS,
    so you might not have to do anything else. But in the end you might need


    as to access CUPS web interface. The Administration tab and Add; Select ''Other''
    auto-detected and click ''Continue''. On the next screen there''s a header for
    checking if the printer has been found.


    you can choose the printer you want. On the next and final screen the printer
    will be available to Windows and Linux machines using the IP address http://192.168.1.100/:printer_name/


