    # Terminal:

    Remote access


    Uncover how to run another computer''s Windows applications through your desktop
    with SSH ake secure shell access.


    One of the great things about the terminal is that it allows you to access and
    control any PC remotely using SSH. This is particularly useful if you have a PC
    set up as a dedicated server, one that''s running headless (no monitor or input
    devices), while retaining easy access to it from another computer.


    Systems Ubuntu typically use OpenSSH to manage command-line—this gives you access
    from the terminal to the target PC, but what if you need to run an application
    that requires graphical interface? If your target has a desktop environment in
    place, such as Unity, you could use VNC as an option for connection.


    Most dedicated servers, don''t have a desktop in place to keep and improve resources.
    Frankly, you can use the GUI of an application on your Windows system with SSH,
    using a process called X Forwarding.


    This is done using the X11 network protocol. To set up both PCs for SSH—if you''re
    running Ubuntu, then OpenSSH is already installed, but


    ```

    need to install OpenSSH on your server or target PC:

    $ apt-get update

    $ apt-get install openssherver

    ```


    Once installed, ssh to your client PC while on the same network and let authentication
    be established. Type ''yes'' to continue attempts. Replace `username` and `hostname`
    with its computer name or IP address, `nick@ubuntu`. You should see a message
    warning that the host authenticity can''t be verified. Type ''yes'' to have the
    key permanently added to the list of known hosts, so future attempts won''t warn
    you about this message.


    You''ll be prompted for the user''s password. Once accepted, you''ll see the command
    prefix changes to the username and hostname of your server (the Terminal window
    title also reflects this). This helps you identify which server you are connected
    to. You can open another terminal window to enter commands for your own PC. When
    you''re done, type: exit and hit Enter to close the connection. You''ve gained
    access to


    # Disable password authentication


    SSH servers are particularly vulnerable to password-based brute force attack.
    If you consider this a reasonable security priority, it''s worth disabling password
    authentication in favor of SSH keys.


    Start by generating a key pair on your local PC:


    Hit Enter to accept the default location for the file. When prompted, enter a
    passphrase for extra security or simply hit Enter again. Once created, you need
    to transfer this key to:


    ```

    ssh-copy-id username@hostname

    ```


    Note: If you''ve changed the port for


    TCP connections, you need to specify

    $ ssh-copy-id -p port username@hostname

    Once done, you''ll log in without


    ```

    $ ssh user@hostname

    ```


    Specify that password if you set a password for the key. Now you can access the
    server using the ssh_rsa file to replace the

    Password authentication:


    Once done, you''re no longer prompted for a password when logging in. If you

