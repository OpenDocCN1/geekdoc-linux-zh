    ```\n\nPress Ctrl+O to save the file (hit Enter to overwrite it), then Ctrl+X\
    \ to exit. Now close the terminal and open a new one to get a brief description\
    \ of the command. Just type the command with a longer description: command --help\n\
    \nThe ~ character represents your home directory. If you type cd ~/home/username/Documents\
    \ you will jump to that directory. Want to go back to the previous directory quickly?\
    \ Simple, just type cd -`:\n\nWildcards are used to speed up searches, and can\
    \ also be used to filter files —the * character can be used to quickly access\
    \ a folder with a long name, eg Doc*. This works if there's only one folder matching\
    \ that name. If there are many folders, the command will find the first matching\
    \ folder: cd Doc*. To avoid this, use `cd dir*`.\n\n# # Working with files and\
    \ folders\n\nYou can now list and navigate your file system, but what about doing\
    \ something practical, like moving or copying files? You'll find a range of commands\
    \ now that you've learned how to navigate around in this world.\n\nLet's start\
    \ by at copying (cp) and moving (mv) files). The same options apply to both. The\
    \ basic syntax is: `cp [options] source target`. Be careful with the following\
    \ rules for the cd command, but it's generally good practice to navigate to the\
    \ folder before using the command.\n\nThis creates a copy of the file with the\
    \ same name, but renames it: `cp ~/Documents/file-backup.txt`. If you want to\
    \ create a copy of the file in the same folder, use `cp ~/Documents/file.txt ~/Documents/backup.txt`.\n\
    \nThe ? character is a wildcard that matches any single character. For example,\
    \ `cp file?.txt` will match `file1.txt` but not `file10.txt`.\n\nYou can copy\
    \ folders using the cp or mv command. Here, you need to include the recursive\
    \ flag, which ensures the folder is copied with all its contents and correctly\
    \ arranged in original locations relative to the parent.\n\nIf the backup folder\
    \ exists, then the Documents folder will be renamed inside it. If not, then the\
    \ Documents folder are created inside it.\n\nYou can use the rm to delete a single\
    \ file: eg: rm filename. The rm command deletes folders, but only empty ones.\
    \ If you want to delete a folder and all its contents, use -r flag.\n\nYou can\
    \ also create new folders with the mkdir command — simply replacing folder with\
    \ your folder name. Use the touch command to create an empty file, such as touch\
    \ config.yaml.\n\nWildcards are even more useful when navigating — the * and []\
    \ are wildcards. Using single wildcard marks or [] for paths that contain spaces,\
    \ such as `cd *Documents*Who`. When creating files mkdir Documents Who will create\
    \ two separate folders called Who and the folder you want. Use `mkdir Documents\
    \ Who` to get the folder you want.\n\nWe finish off by showing some characters\
    \ that allow you to run multiple commands on a single line. The & argument also\
    \ does that, so you can follow the following to update your reports and update\
    \ all available software: apt-get update && apt-get upgrade\n\n&& is the AND operator\
    \ in that the second command will only run if the first completes successfully\
    \ before the second command is used instead. If you want to run the second command\
