    \ command to use the UEFI target, like this:\n\n```\n$ boot /dev/sde\n$ grub-install\
    \ --target=x86_64 --boot-directory=/media/MULTBOOT/\n```\n\nThis is a 64-bit target,\
    \ as UEFI is fully supported on 64-bit hardware. If you want to use your USB stick\
    \ with 32-bit equipment, sorry (sorry) with MBR booting method.\n\nIn these examples,\
