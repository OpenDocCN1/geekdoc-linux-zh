  md: '# # IPFire: Guard your network


    # ## How do you keep the invading horde away from your systems? By building today
    to shield your computers.


    Your Linux distribution has the venerable firewall built right into it, and the
    larger open source community makes sure you have aft of tools to manage it per
    your requirements. While this shields your Linux computers, the protection doesn''t
    extend to other-connected devices. Your router also has a firewall built into
    it. With the onslaught on IoT devices doing IP addresses, you can not really rely
    on your router''s limited capabilities to safeguard your bits and bytes from bloating
    the big internet.


    We are past the days when large networks were easy to deploy and the internet-enabled
    front of a typical home is big enough to warrant no trouble. Setting up one is
    an involved process in both terms of assembling hardware and configuring the software.
    Our distribution helps you set up a firewall with ease.


    IPFire uses a Stateful Packet Inspection (SPI) firewall that is built on top of
    the utility that facilitates Network Address Translation (NAT), packet filtering,
    and more. You can secure everything from forwarding ports to creating a DMZ. The
    firewall is hardened with the gpatch to protect against zero-day exploits and
    comes with strict options. IPFire offers diverse rules based on your security
    level and enables you to create complex policies to manage your network. For more
    details you can also manage outside access to the internet from any segment.


    IPFire has very modern systems. It is one of the best ways to make use of old
    computer hardware that isn''t able to cope with the requirements of the modern
    day. A single console processor at least two hard drives and 4GB of disk space
    is enough to install it. A bigger disk hard will give you more diversity to flesh
    out the IPFire installation.


    Hook up the first network to the router/gateway from your IPFire. Connect the
    second to the router or move all the computers and devices in your network. Once
    you set up IPFire make all the devices in your network to this instead instead
    of the one provided by your ISP. Also remember to disable the DHCP functionality
    in your network router since it will be handling the task of doing out IP addresses
    to your IPFire firewall.


    Once you''ve assembled the firewall computer, boot from the IPFire install media.
    The firewall distribution is written from scratch and has a straightforward installation
    process. Follow the intuitive installation process using the default options which
    will configure your computer and colored zones. Each of these zones caters to
    a group of security level. The default, Green, is a common security level. The
    default is like ours you have two networks.


    The most important aspect of the installation process is the Network menu that
    comes up after you''ve set up the configuration for the root user. It detects
    the number of NICs installed and asks you to assign them to one of four-colored
    zones.


    Once you''ve selected this method in the Network configuration section type, select
    the Drivers and assign them to the NICs. The second NIC connected to your internal
    home network is marked as the Red interface. The first adapter connected to the
    ISP''s modem should be marked as the Red interface. The internal home network
    will be marked as the Green interface. Then select next to configure the Green
    interface.


    If 10.0.0.1 is the IP address with a Network for the Red interface change the
    DHCP option. Now on to the DHCP and Gateway settings and set 8.8.8.8 and the 8.8.4.4
    of the secondary DNS.


    Once you''re done with the network settings, IPFire''s setup wizard will bring
