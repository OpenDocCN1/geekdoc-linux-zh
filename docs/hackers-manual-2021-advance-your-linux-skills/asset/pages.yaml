    # Terminal: Set up partitions


    It''s time to reveal everything you need to know about setting up a hard disk

    formatting, and setting permissions.


    A hard drive skill is partitioning. You''ll have encountered this during the Ubuntu
    setup, and there may be times when you need to repair a drive—or set up one for
    the first time. In this tutorial, we''ll focus on two of the main tools you can
    use: fdisk and parted. fdisk is better known, and one of its strengths is that
    any changes you make are not immediately written to drive unless you use the `w`
    command to exit and write your changes. If you change your mind or make a mistake,
    just leave it and your drive is left untouched.


    however, you''ll need parted instead (see the box Resize for details).


    # Partitioning with fdisk


    Let''s begin by using fdisk to list the devices on your system:


    Each drive—sda`, `sdb`, and so on—will be displayed one after another. To restrict
    your output to a specific disk, use `sudo fdisk /dev/sd` (replacing `sd` with
    your device). You will see the disk''s size in GB or TB, with the number of sectors
    and the disk type. You''ll also see the partition (typically GPT or MBR) scheme
    type and the disk identifier, which you can ignore


    This will show you a list of all existing partitions on the drive, complete with
    start and end points (in bytes), size, and file system (such as `swap` or `Windows
    recovery`). Armed with this information, you will be able to identify each device


    helping you to partition your drive. This is as follows:


    ```

    sudo fdisk <device>

    ```


    # Take a drive backup


    Another limitation of fdisk is that it''s a pretty destructive tool. If you''re
    partitioning a disk for the first time or are happy deleting partitions (or starting
    from scratch). If you want to be safe resize partitions before deleting the data
    on them.


    Partitioning is a dangerous business; if things go wrong you might choose the
    wrong disk and end up wiping your partition of any existing drive.


    an entire drive to partition. You will use the following syntax:


    ```

    sudo dd if=/dev/sdX of=/path/backup.img

    ```


    Replace `sdX` and `/path/` with the path to your backup drive.


    If you''re planning to partition an existing drive, you should take a full backup
    first. There are numerous, many ways to do this, but `dd` is particularly useful
    to use. It allows you to create partitions on new drives, but here we''ve focused
    on it for creating a compressed image file of


    Replace `/media/username/drive/` with the path to your drive.


    ```

    sudo dd if=/dev/sdX of=/media/username/drive/backup.img bs=

    ```


    The `dd` application offers an option to compress data on the fly when creating
    the image file.


    While you are at it, you can also back up your drive''s Master Boot Record if
    it uses MBR.


    The action of restoring your drive image if things goes wrong is basically opposite—again,
    do so when you need.


    ```

    sudo dd if=/media/username/drive/backup.img of=/dev/sdX bs=4k

    ```


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_149_0.png)


    \> When you do it, it did not provide any progress meter while it''s backing up
    the drive, but it will alert you if anything went wrong.


