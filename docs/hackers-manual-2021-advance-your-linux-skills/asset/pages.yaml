  md: '# Security


    # # Linux: Secure your desktop


    Linux can thwart a majority of attacks on us but that we can help put a 10 forcefield
    around your computer.


    Using Linux just because it''s safer than Windows? Security is a built-in feature
    and extends right from the kernel to the desktop. but still leaves room for someone
    to mess about your home. Linux is impervious to worms and viruses for Windows,
    but attackers have several other tricks up their sleeves to steal precious bits
    and bytes that make everything from your personal emails to your credit cards.

    Locking data behind a username and password should be your only line of defense
    and isn''t enough to hold off an attacker. As the number and variety of attacks
    increase you should go out of your way and take measures to secure your computer
    against unauthorised attacks.

    All Linux distributions such as Ubuntu, and Fedora have teams that work with the
    packages to make sure they are secured against security vulnerabilities. These
    teams work with each other to make sure security patches are available as soon
    as a vulnerability is discovered. Your distribution will have to make sure the
    security-specific repository is enabled (as default), and decide whether you would
    like to install the updates automatically or manually. For example, from the Software
    & Apps update, you can also use Ubuntu to download and install updates manually.

    In addition to updates, distributions also have a security mailing list to announce
    vulnerabilities, and share tricks with them. It''s a good idea to keep an eye
    on the list for your distro, and look out for any security updates to packages
    that are critical to you. There''s a small lag between the vulnerability and the
    package being put in the repository; the security mailing list gives the inmates
    on how to handle the situation.

    You should also take time to disable unnecessary services. A Linux distro starts
    out with many services to be used by as many people as possible. But you don''t
    need all of them, especially on a secure server, and why would you need the Bluetooth
    service to connect devices to a computer that has a Bluetooth adapter? It lets
    you control the services that run on your Linux installation with a default that
    is greatly


    you disabled a service on which you rely. example many services rely on databases
    so when you turn off MySQL or PostgreSQL you should make sure you aren''t running
    any processes that rely on them.


    # Secure user accounts


    On a multipasser system like Linux it is imperative that you limit access to the
    root account. Most distributions these days don''t allow you to log as root at
    boot time which is good. Furthermore, instead of giving multiple people root access
    grant them the right to run commands with the sudo command. Instead of using sudo
    the root user has several advantages. Use in the /etc/sudoers file, which logs
    all commands performed as all.


    One of the major advantages of using sudo is that it allows you to restrict access
    to certain commands. This is achieved by the visudo command which edits the sudoers
    file, saves the edits as a, and ensures the configuration is correct before writing
    it to the /etc/sudoers file.


    To allow a user to gain full privileges when they precede with a sudo, add the
    following to the /etc/sudoers file


    ```

    user ALL=(ALL) ALL

    ```


    To allow a user to run all commands as root but only on the machine whose hostname
    is joe:


    ```

    joe ALL=(ALL) ALL

    ```


    To restrict access to certain commands. For example, the following line will only
    allow user guest to execute the following:


    ```

    guest ALL=(ALL) /bin/ls /bin/shutdown /sbin/halt /sbin/

    ```


    simply, you can add only the commands that are critical.

    Want to restrict a user''s scope. The following line will only allow the user
    named native to use the root privileges, but only on his workstation and nowhere
    else:


    ```

    nate ALL=(ALL) ALL

    ```


    On addition you could also set expiration dates for accounts used by non-users.
    This can include any internal, temporary employees and consultants who need to
    access your Linux. You should ideally deactivate and remove the temporary accounts
    as soon as they aren''t needed. The expiration dates act as a safeguard to ensure
    these accounts cannot be misused.'
