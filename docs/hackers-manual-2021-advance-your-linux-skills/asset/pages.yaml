  md: '# Security protocols


    # How do we secure the transmission?


    He may reason for using these tools is because developers have take extra measures
    to ensure the security of the communication and focused on the privacy of users.
    CryptoCat, for instance, assumes that the network is controlled by an attacker
    who can intercept, tamper, and inject messages.


    To ensure privacy over such short-lived sessions, CryptoCat uses end-to-end encrypted
    conversations using a Double Ratchet based protocol. The users link their devices
    to an account and can identify each other''s device via the client manager to
    prevent in-the-middle attacks. After each key exchange, it also manages the ongoing
    renewal and maintenance of short-lived keys during the session. All devices linked
    to Cryptocat receive secure messages, even if the current keys are compromised
    the messages will remain secret.


    GoldBug uses end-to-end encryption with multiple layers of cryptography. In addition
    to RSA, it uses the EL Gal encryption algorithms and also NTRU, which are resistant
    against resistant quantum computing, while each user can send their identity secret
    key, size, cipher header, iteration count and the encrypted messages are sent
    to a P2P signed-free channel. This self-signed connection ensures that no compromised
    node is added to the network.


    Jitsi uses the Off-the-Record (RTR) protocol to encrypt conversations. It uses
    a combination of AES-auth keys. Jitsi also uses other functions to provide secrecy
    along with encryption. When it is establishing a connection it uses the RTP protocol
    to exchange audio and video.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_66_0.png)


    > > You can use Retreshare over Tor to hide the connection between you and your
    friends.


    The Q-tox protocol uses the Naacl cipher library to ensure end-to-end encryption
    with perfect secrecy. This protocol generates a temporary key pair that is used
    to make connections to non-tor users friends.


    Retreshare uses GPG for cryptographic keys and authenticating asymmetric keys,
    it establishes an end-to-end encrypted connection using OpenSSL. You can also
    use easily distributed hash table (DHT) to further improve anonymity.


    # Verdict


    +   - CryptoCat

    - GoldBug

    - qtox

    - Retreshare


    > > All use secure protocols and encryption algorithms.


    # Audio and video calls


    Can we securely transmit them?


    GoldBug has a number of features, but we can''t use it to make audio and video
    calls. The application has a mechanism to share encrypted files but CryptoCat
    can also


    make real-time video calls. The client allows you to record encrypted video messages
    to your friends that can be viewed immediately or whenever they come within the
    next 30 days.


    CryptoCat users can also exchange encrypted files and photos as they are over
    200MB.


    All audio and video calls are made in Q-tox by being routed through secure channels
    and also host group chats with other users. Jitsi is a VoIP client and enables
    you to make the calls using the Session Protocol (SIP). You can use Jitsi to make
    audio and video calls to one or several users over both SIP and MMR networks.


    # Verdict


    +   - CryptoCat

    - GoldBug

    - Jitsi

    - qtox

    - Retreshare


    > > Retreshare uses a webcam system, which is similar to BitTorrent, to accelerate
    the download. Users can share files with friends or ever over the Tor network.
    There''s also a search function to find files, and anonymously.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_66_1.png)


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_66_2.png)


    > > Jitsi supports TLS and certificate-based client authentication for SIP and
    XMPP.


