    # Encrypted persistence


    If you start from a stick or SD card, you can create a persistent volume in the
    home directory of Tails. The files in the persistent volume are saved and remain
    accessible across working sessions.


    You can use this persistent volume for different kinds of files:


    +   - Your personal files and documents

    - The encryption keys you''ve created and stored in Tails

    - The configuration of the programs you use

    - Your exported files


    > It is only possible to create a persistent volume if the USB stick or SD card
    was installed with Tails.


    This requires a stick or SD card of at least 4 GB


    The persistent volume is encrypted protected by a passphrase.


    Once the volume is created, you can choose to activate it or not each time you
    are using Tails.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_82_2.png)


    # # Tails Linux can be used to revoke your security key


    Follow the steps to select a reason for revocation and to output a JSON presentation.
    GnuPG provides a warning that you should revoke the key certificate: once revoked
    you cannot use the private key as you intended.


    ```

    ```bash

    gpg --revoke-keys

    ```

    ```


    You can revoke the key directly by using the command in edit mode. This is the
    way to revoke one or more keys and how you would revoke a subkey without revoking
    the primary key. You can also delete user identities and leave signatures.


    After you, any other who wants to revoke your key needs to publish the certificate
    to your key server:


    ```

    ```bash

    gpg --send-key

    ```

    ```


    After publishing, it is better to protect your private key and the certificate
    in a secure location, printing the certificate out on paper and storing them in
    multiple locations, giving them to multiple trusted people.


    Paperkey (https://www.paperkey.com/software/paperkey) is a tool that extracts
    the secret parts of your key (a grab-from-the-right on pages) and prints with
    maximum data that is easier to handle than in hard memory.


    ```

    ```bash

    paperkey --secret-keys primary.gpg --output private.txt

    ```

    ```


    Recovery is equally simple, using your paperkey:


    ```

    ```bash

    paperkey --recoversecret-keys private.txt --output secret.txt

    ```

    ```


    Your recovered key is still protected by your passphrase. If you want to give
    this to multiple people to distribute the backup, you need to split the key and
    its passphrase.


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_82_3.png)


    You can refer to a key using a user ID, short or long key ID, or the fingerprint.
    Some tools may require you to specify with "_"


