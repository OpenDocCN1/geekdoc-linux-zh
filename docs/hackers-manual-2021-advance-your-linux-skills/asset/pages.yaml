    # # Octave and Matlab


    We''ve talked about Octave compatibility, but what is Matlab compatible and what
    is different? How much can you use without first yourself filling the path that
    differentiates these two applications?


    First, let''s look at compatibility. Octave was built to work with Matlab, and
    shares many fundamental features. Both use the same fundamental data type; they
    have built-in for complex numbers; and have powerful built-


    in math functions and libraries. A vast majority of the syntax is transferable,
    meaning a script file in Matlab will yield the same result as in Octave.


    There are some potential yet syntax differences on the Octave side that could
    cause issues. One of them is the use of the * character instead of '' to define
    strings. For example is how code comments can be initiated


    by the # character as well in Octave. Between these differences there are slightly
    more influential changes, such as the problem solver which currently does not
    exist in Matlab. Matlab has many functions that are not present in the same, and
    Octave will only return an error message when Octave has no knowledge of what
    to do with the function.


