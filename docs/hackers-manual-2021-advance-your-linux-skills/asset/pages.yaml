  md: '# Cloud control


    In the main tutorial we''ve looked at setting up and using a default Nextcloud
    instance. But as the admin you can tweak several settings to accommodate your
    requirements.


    To access these settings, roll-down the menu to select your username and then
    the page that lists settings that affect the entire Nextcloud instance under different
    heads as


    Server settings, Usage report and more. The Info report is different from the
    others in that it helps you tweak any settings to save space or reduce the load
    on the Nextcloud server like CPU, memory, and more. You can configure the policy
    for sharing files on the server. Here you can toggle options to force users to
    perform an action


    public shares, set a default expiry date for all shares, restrict members of share
    files only with others in your group, and more. You can configure the Nextcloud
    server to send emails for various types of notifications and password resets from
    the Additional settings section. This page also lets you define a password by
    forcing a minimum length, by use of mixed cases and special characters.


    ```

    log-index=/var/log/mysql/mariadb-index.bin

    format = mysql

    ```


    Save when you''ve done. Then restart apache2.

    nYou might also have to tweak the Apache web server. Nextcloud needs several modules
    to function properly: enable them and headers commands.

    Also you can use configure over HTTP. The Nextcloud server encourages the use
    of SSL for all web traffic, and to protect users data in transit. After installing
    Nextcloud on Ubuntu Apache already comes equipped with a self-signed certificate.
    Here you have to do enable the SSL module and the default account to configure
    the self-signed certificate.


    ```

    $ amod enable ssl

    $ amod restart apache2

    ```


    When you are done, restart the Apache server to load the modules with amod restart
    apache2 .


    # In the clouds


    Now that we''ve looked for Nextcloud, let''s fetch and install the server. Head
    to www://nextcloud.com/install and get the latest version (v10.0.1 at present)


    ```

    $ wget -c https://nextcloud.com/server/releases/nextcloud-latest.tar.bz

    ```


    ```

    $ tar xf nextcloud-10.0.1.tar.bz

    ```


    Extracting the archive will create a new directory and all the working directory.
    Copy this to the document root of the Apache server with cp -r nextcloud/ /var/www/.
    Then hand over control of the ownership to the Apache server (www-data) with chown
    www-data:www-data /var/www/


    We''ll now install Nextcloud from under us by creating a configuration file with
    nano apache2/sites-available/nextcloud.conf and the following:


    ```

    Alias /nextcloud /var/www/nextcloud/

    ```


    ```

    <Directory /var/www/nextcloud>

    Options +FollowSymLinks

    AllowOverride all

    </Directory>

    ```


    ```

    <IfModule mod_rewrite>

    Dav off Off

    </IfModule>

    ```


    SetEnv HOME /var/www/nextcloud

    SetEnv HTTP_HOME /var/www/nextcloud


    Now save the file and link the configuration. Then restart apache2.

    $ amod enable nextcloud /etc//apache2/sites-available/nextcloud.conf


    ```

    ln /etc/apache2/sites-available/nextcloud.conf /etc/apache2/sites-enabled/nextcloud.conf

    ```


    Since this is the first time you''re interacting with Nextcloud, you''re asked
    to create an account. Enter the username and password for the Nextcloud instance
    in the space provided. Then scroll down and expand the Storage & database pull-down
    menu to reveal more options. The data we here will be shared by the users. If
    it''s already set up with a location, search the Nextcloud developers'' app to
    be that the data output of the Nextcloud root directory, such as /var/data/


    You''re need for several details about the database. Nextcloud uses the SQLite
    database by default. However, it is better to use the standard MySQL which can
    handle large loads of users. To test the users, enter the username and password
    for the Nextcloud we created earlier to make the database. Then press the setup
    button to create the database and the appropriate structure for the Nextcloud
    installation.


    That''s it, your Nextcloud is up and running. You''re now ready to be Nextcloud''s
    customers. You can start by logging in and clicking around. Feel free to go straight
    ahead and get things where you want them.


    For roll-meters, now roll down the menu in the top-right and click the Personal
    Link. Here you can review all settings for your account, such as the password
    and display name. It also lists the groups you are part of. If your Nextcloud
    deployment is being used by multiple people, it''s advisable to organise users
    into directories. To do this, use the Options from the pull-down menu. Then you
    can use the terms on the page to create groups and users. While adding users,
    you can also


    ![](img/d2d879b5f295fad9b17e4fc9976250c7_94_0.png)


    You can backup your entire Nextcloud installation with as simple as making a zip
    of your /nextcloud-data and config.php files.


