    be able to identify syntax errors. You should know where these files reside on
    the client. You should understand how the various names resolution methods work.
    You should become familiar with the tools that can be used, such as the TCP/IP-supplied
    ping utility and the Oracle-supplied tnsp utility to assist you when troubleshooting
    these problems. Finally, you should familiarize yourself with the most common
    Oracle errors that can occur as a result of connection problems.


