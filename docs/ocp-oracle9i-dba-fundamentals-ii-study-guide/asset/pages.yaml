  md: '# Network Responsibilities for the DBA


    The database administrator has many design issues to consider and plays an important
    role when implementing a network of Oracle servers in the enterprise. Here are
    some of the key responsibilities of the DBA in the Oracle network implementation
    process:


    +   - Understand the network configuration options available and know which options
    should be used based on the requirements of the organization.

    - Understand the underlying network architecture of the organization in order
    to make informed design decisions.

    - Work closely with the network engineers to ensure consistent and reliable connections
    to the Oracle servers.

    - Understand the tools available for configuring and managing the network.

    - Troubleshoot connection problems on the client, middle tier, and server.

    - Ensure secure connections and use the available network configurations, when
    necessary, to attain higher degrees of security for sensitive data transmissions.

    - Stay abreast of trends in the industry and changes to the Oracle architecture
    that may have an impact on network design decisions.


    # Network Configurations


    There are three basic types of network configurations to select when you are designing
    an Oracle infrastructure. The simplest type is the single-tier architecture. This
    has been around for years and is characterized by the use of terminals for serial
    connections to the Oracle server. The other types of network configurations are
    the two-tier, or client/server, architecture and the most recently introduced
    n-tier architecture. Let''s take a look at each of these configuration alternatives.'
  merge: -1
  pgno: 66
- img_proc: true
  md: '# Single-Tier Architecture


    Single-tier architecture was the standard for many years before the birth of the
    PC. Applications utilizing single-tier architecture are sometimes referred to
    as green-screen applications because most of the terminals using them, such as
    the IBM 3270 terminal, have green screens. Single-tier architecture is commonly
    associated with mainframe-type applications.


    This architecture is still in use today for many mission-critical applications,
    such as Order Processing and Fulfillment Inventory Control, because it is the
    simplest architecture to configure and administer. Because the terminals are directly
    connected to the host computer, the complexities of network protocols and multiple
    operating systems don''t exist.


    When a single-tier architecture is being used, users interact with the data-using
    terminals. These terminals are non-graphical, character-based devices. Figure
    1.1 shows an example of the single-tier architecture. In this type of architecture,
    client terminals are directly connected to larger server systems such as mainframes.
    All of the intelligence exists on the mainframe, and all processing takes place
    there. Serial connections also exist on the mainframe. Although no complex network
    architecture is necessary, a single-tier architecture is somewhat limiting in
    terms of scalability and flexibility. Because all of the processing must take
    place on the server, the server can become the bottleneck for increasing performance.


    FIGURE 1.1 Single-tier architecture


    ![](img/a183fd041839741f5ab6df3caffc6b52_67_0.png)


    # Two-Tier Architecture


    Two-tier architecture gained popularity with the introduction of the PC and is
    commonly referred to as client/server computing. In a two-tier environment, clients
    connect to servers over a network using a network protocol, which is the agreed-upon
    method for the client to communicate with the'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'server. TCP/IP is a very popular network protocol and has to become the facto
    standard of network computing. Whether TCP/IP or some other network protocol is
    chosen, both the client and the server must be able to understand the chosen protocol.
    Figure 1.2 shows an example of a two-tier architecture.


    # FIGURE 1.2 Two-tier architecture


    ![](img/a183fd041839741f5ab6df3caffc6b52_68_0.png)


    This architecture has defined benefits over single-tier architecture. First of
    all, client/server computing introduces the graphical user interface; this interface
    is easier to understand and learn, and it offers more flexibility than the traditional
    character-based interfaces of the single-tier architecture. Also, two-tier architecture
    allows the client computer to share the application processing load. To a certain
    degree, this reduces the processing requirements of the server.


    The two-tier architecture does have some faults, even though at one time, it was
    thought to be the panacea of all networking architectures. Unfortunately, the
    main problem, of scalability, persists. Notice that the term client/server computing
    contains a slash (/). The slash represents the invisible component of the two-tier
    architecture and the one that is often overlooked: the network!


    When prototyping projects, many developers fail to consider the network component
    and find out that what worked well in a small environment may not scale effectively
    to larger, more complex systems. There was a great deal of redundancy in the two-tier
    architecture model because application software was required on every desktop.
    As a result of this scenario, many companies end up with bloated PCs and large
    servers that still do not provide adequate performance. What is needed is a more
    scalable model for network communications. That is what n-tier architecture provides.'
  merge: -1
