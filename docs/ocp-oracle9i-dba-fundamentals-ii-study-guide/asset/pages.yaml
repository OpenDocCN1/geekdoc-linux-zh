  md: '# Using SQL*Loader


    SQL*Loader is an Oracle utility that was designed to load or transport external
    data from one database to another. SQL*Loader is often used in nightly extracts
    from other non-Oracle-based systems with which database may interface. It has
    become the tool of choice for loading data into the Oracle database in order to
    build or refresh Data Warehouse or Data Marts. This new-found popularity results
    from its speed and versatility over large data sets for both Oracle and non-Oracle
    sources.


    Because of SQL*Loader''s parsing capabilities, the external files it works with
    be in various formats. As a result of this versatility, you can use SQL*Loader
    to do the following:


    +   * Load data from multiple data files or input files during the same load session.

    * Load data into multiple tables during the same load session.

    * Combine multiple input records into a logical record for loading.

    * Specify the character set of the data.

    * Accept input fields of fixed or variable length.

    * Selectively load data (you can load records based on the records'' values).

    * Manipulate the data before loading it using SQL functions.

    * Generate unique, sequential key values in specified columns.

    * Use the operating system''s filesystem to access the data files.

    * Load data from disk, tape, or named pipe.

    * Append data to and replace existing data in the tables.

    * Load data directly into data blocks by passing the buffer cache.

    * Use secondary data files for loading large binary objects (LOBs) and collections.


    There are three main file structures that you will need to be familiar with when
    you are using SQLLoader: the control file; log files, which include bad logs,
    discard logs, and general logs; and input data, or data files. These file structures
    will be discussed in detail in this section.'
  merge: -1
  pgno: 507
- img_proc: true
  md: 'SQL*Loader also uses three methods to load data into the database—the conventional
    load, the direct-path load, the external-path load—and three other methods in
    parallel mode to further improve performance—parallel conventional load, intersegment
    concurrency with direct-path load, and intrasegment concurrency with direct-path
    load. Both sets of these methods are also discussed in the following pages.


    # Control Files, Log Files, and Input Data or Data Files


    SQL*Loader''s three main components are the control file, the log files, and the
    input data, or data files. The control file is the logic behind the data load
    that determines how and what will be loaded. The log files include the bad, the
    discard, and the general log files. The bad log documents records that were rejected
    by the Oracle database or SQL*Loader because they have an invalid format or unique
    key violations, or because they have a required field that is null. The discard
    log contains records that were discarded in the load process or did not meet the
    control file load criteria. The general log file contains a detailed summary of
    the load process. The data file, or input data, is the raw data that will be loaded.
    Figure 15.1 displays this SQL*Loader process utilizing the logs, data files, and
    the control file.


    Figure 15.1 SQL*Loader input and output files


    ![](img/a183fd041839741f5ab6df3caffc6b52_508_0.png)'
