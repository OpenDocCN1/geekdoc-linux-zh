    # Updating the Repository When Backups Have Been Deleted


    RMAN can mark a backup in the repository, which is either the recovery catalog
    or the control file, with a status of deleted. Remember that if you do not use
    the recovery catalog, the information about backups is stored in the target database''s
    control file. Backups that have been marked in this manner will not appear in
    a list output when the recovery catalog is queried. RMAN uses a special command,
    ALLOCATE CHANNEL FOR DELETE TYPE DISK, to perform this maintenance activity. We
    will be using the CHANGE command and DELETE command in these examples.


    This example shows the process of deleting part of a backup set and control file:


