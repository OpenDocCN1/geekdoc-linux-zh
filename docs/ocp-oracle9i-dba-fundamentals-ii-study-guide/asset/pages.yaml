  md: "# Parameter Files\n\nThere are two parameter files that make up the file structures\
    \ of the Oracle database. The parameter file is the file that contains the parameters\
    \ of the database that are used upon startup. The standard parameter file, called\
    \ init<ORACLE_SID>.ora, contains parameters required for instance startup. The\
    \ ORACLE_SID equals the name of the oracle identifier or database name. This parameter\
    \ file is in ASCII and binary.\n\nThe second parameter file, called spfile<ORACLE_SID>.ora,\
    \ is the server parameter file that stores persistent parameters that are required\
    \ for instance startup and those that are modified when the database is started.\
    \ The server parameter file is stored in binary format, which is a new feature\
    \ in Oracle9i.\n\nEither of these files can be used to start the Oracle database,\
    \ but the spfile.ora files are the default for starting the database. If these\
    \ files are not found, the init.ora files are used. \n\nThe default locations\
    \ for these files are in the following directory structures. We will demonstrate\
    \ both Unix and Windows NT/2000.\n\n| Unix | $ORACLE_HOME/dbs |\n| Windows NT/2000\
    \ | $ORACLE_HOME%\\database |\n\n# Checkpoints, Redo Logs, and Archived Logs\n\
    \nNow that you have a basic understanding of the various Oracle structures, file\
    \ structures, and memory structures used for recovery, it's time to see how these\
    \ interrelate. As you learned earlier, checkpoints, redo logs, and archived logs\
    \ are significant to all aspects of recovery.\n\nThe checkpoint is an event that\
    \ determines the synchronization or consistency of all transactions on disk. The\
    \ checkpoint is implemented by storing a unique number—the SCN (again, this stands\
    \ for system change number)—in the control files, header of the data files, online\
    \ redo logs, and archived logs. The checkpoint is performed by the CKPT process.\
    \ One of the ways a checkpoint is initiated is by the data block writer (DBWR)\
    \ process. The DBWR initiates a checkpoint by writing all modified data blocks\
    \ in the data buffers (dirty buffers) to the data files. After a checkpoint is\
    \ performed, all committed transactions are written to the data files."
  merge: -1
