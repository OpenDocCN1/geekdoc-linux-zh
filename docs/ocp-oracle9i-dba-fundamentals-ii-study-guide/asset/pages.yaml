  md: '# Summary


    The Oracle backup and recovery capability is full featured and robust. It provides
    many options that support a wide variety of backup and recovery situations. In
    this chapter, you have seen how to configure an Oracle data-base for backup and
    recovery. You have learned the ramifications of operating in ARCHIVELOG mode as
    opposed to NOARCHIVOG mode, and vice versa, with that choice affects the backup
    and recovery process. You have seen examples of how the init.ora parameters control
    the destinations and automation of the archive logging. Finally, you walked through
    an example that enabled ARCHIVELOG mode and automatic archival of logs in the
    database.


    A solid understanding of the archived log process is fundamental to the backup
    and recovery process. The decision to enable archive logging has major implications
    on a DBA''s ability to recover the database. In addition, certain recovery options
    that will be covered in upcoming chapters are dependent on whether or not you
    have enabled ARCHIVELOG mode. Make sure you understand the reasons for enabling
    or not enabling the archived log process this knowledge will benefit you during
    OCP testing, and as in real life situations.


    # Exam Essentials


    +   - Identify the differences between ARCHIVELOG and NOARCHIVELOG modes. You
    should know the differences between having the database generate archived logs
    or not. Make sure that you are aware of the impact that the ARCHIVELOG and NOARCHIVELOG
    modes have on the backup and recovery process.


    +   - Know how to configure a database in ARCHIVELOG mode. Be able to explain
    how to configure a database so that it will generate archived logs. You should
    also be able to identify the commands and initialization parameters involved in
    this process.


    +   - Know how to configure the database for automatic archiving. Be able to identify
    the initialization parameter LOG_ARCHIVE_START = TRUE, which is used to enable
    automatic archiving.


    +   - Demonstrate how to perform manual archiving. Know how to use the required
    commands to generate archive logs manually.'
