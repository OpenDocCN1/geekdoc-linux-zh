    The listener can also redirect the user to a server process or a dispatcher process.
    This type of connection can occur when the operating system does not directly
    support bequeathed connections or the listener is not on the same physical machine
    as the Oracle server. The following steps are illustrated in Figure 2.2:


    +   1. The client contacts the Oracle server after resolving the service name.

    2. The listener spawns a new process or dispatcher in the case of Oracle Shared
    Server. In the case of Oracle Shared Servers, if there is remaining capacity on
    existing shared servers, then a dispatcher will not need to be spawned.

    3. The new process or thread selects a TCP/IP port to use to control interaction
    with user clients. This information is passed back to the listener.

    4. The listener sends information back to the client, redirecting the client to
    the new server or dispatcher port. The original network connection between the
    listener and the client is disconnected.

    5. The client then sends a connect signal to the server or dispatcher process
    to establish a network connection.

    6. The dispatcher or server process sends an acknowledgement back to the client.

    7. If Oracle Shared Server processes are being used, PMON sends information to
    the listener about the number of connections being serviced'
  merge: -1
