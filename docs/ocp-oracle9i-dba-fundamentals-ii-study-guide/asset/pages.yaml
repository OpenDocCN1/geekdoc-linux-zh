  md: '# The Oracle Communications Stack


    The Oracle OSI model is the foundation of the Oracle communications stack architecture.
    Each of the layers of the Oracle communications stack has characteristics and
    responsibilities that are patterned after the OSI model. Oracle interacts with
    the underlying network at the very highest levels of the OSI model. In essence,
    it is positioned above the underlying network infrastructure and communicates
    with the underlying network.


    Oracle uses Oracle Net on the client and server to facilitate communications.
    The communications stack functions as a conduit to share and manage data between
    the client and server. The layers of Oracle communications stack are as follows:


    +   * The application (client) layer


    +   * The Oracle Call Interface (OCI) layer (client) or Oracle Program Interface
    (OPI) layer (server)


    +   * The Two-Task Common (TTC) layer


    +   * The Oracle Net Foundation layer


    +   * The Oracle Protocol Adapters (OPA) layer


    +   * The Network Specific Protocols layer


    +   * The Network Program Interface (NPI for server-to-server communications only)


    Figure 1.5 depicts the relationship of each of the layers of the stack on both
    the client and the server. The client process makes network calls that traverse
    down the Oracle Net client layers to the network protocol. The server receives
    the network request, processes it, and returns the results to the client.


    # The Application Layer (Client)


    The application layer of the Oracle communications stack provides the same functionality
    as the Application Layer of the OSI model. This layer is responsible for interacting
    with the user, which involves providing the interface components, screen, and
    data control elements. Interfaces such as forms or menus are examples of the application
    layer. This layer communicates with the Oracle Call Interface (OCI) layer.'
  merge: -1
