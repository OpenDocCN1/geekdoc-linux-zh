  md: '![](img/a183fd041839741f5ab6df3caffc6b52_219_0.png)


    Backup and recovery in an Oracle database environment can be simple or complex
    depending on the requirements of the business environment database is supporting.
    Oracle provides methods for supporting such environments, and each of these methods
    requires different levels of complexity for backup and recovery operations.


    First of all, there are multiple types of failures that may occur in an Oracle
    database environment. Each of these can result in different types of recovery
    operations. You must understand these types of failure in order to make the correct
    recovery decisions.


    Once you understand Oracle backup and recovery and the possible types of Oracle
    database failures, you will be able to create a backup and recovery strategy.
    When you are determining this strategy, you will need to consider a number of
    issues. First of all, keep in mind that in order for backup and recovery to be
    successful, everyone from the technical team must understand the requirements
    and the effects of the backup and recovery strategy. After this strategy is agreed
    upon and in place, a disaster recovery plan can be created based on this strategy.
    When you are creating your recovery plan, it is important that you understand
    the options for high availability, as well as the options for configuring your
    database for recovery. After you have successfully created this plan, the final
    step is to test it.


    This chapter takes you step-by-step through the basic principles of backup and
    recovery; it introduces you to the types of failures that may occur, and to the
    backup and recovery strategy. In the end, you should be comfortable with your
    knowledge of what is involved in the Oracle backup, restore, and recovery process.
    You should understand enough about the different types of failures so that you
    can identify the appropriate course of action to implement in a recovery situation.
    This level of understanding will not only make your job as a DBA easier, but it
    should also make it much more comfortable.'
