  md: '# Exam Essentials


    Define Oracle Shared Server. It will be important for you to be able to list the
    advantages of Shared Server versus a dedicated server and when it is appropriate
    to consider either option.


    Understand the architecture of the Oracle Shared Server. Be able to summarize
    the steps that a client takes to initiate a connection with a shared server and
    the processes behind those steps. You should understand what happens during client
    request processing and outline the steps involved.


    Understand the changes that are made in the SGA and the PGA. Make sure you understand
    that in a Shared Server environment many of the PGA structures are moved in the
    Large Pool inside of the SGA. This means that the SGA will become larger and the
    Large Pool will need to be configured in the init.ora file.


    Know how to configure the Oracle Shared Server. You should be able to define the
    meaning of each of the parameters involved in the configuration of Oracle Shared
    Server. You should know what parameters can be dynamically modified and what parameters
    require the Oracle instance to be restarted to take effect.


    Know how to configure clients running in Shared Server mode. You should be able
    to configure clients that need to have a dedicated connection to Oracle if it
    is running in Shared Server mode.


    Know what views to use to monitor the Shared Server performance. It is important
    that you be able to use the available V$ views to monitor and tune the shared
    server and know how to adjust settings when necessary.'
