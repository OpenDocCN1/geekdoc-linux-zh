- img_proc: true
  md: '# Exam Essentials


    Understand media recovery. Media recovery is required when database files, such
    as data files, control files, or online redo logs, become unavailable. Such files
    can become unavailable because of hardware failure, corruption, or accidental
    removal.


    Know the recovery differences between ARCHIVELOG and NOARCHIVELOG mode. In order
    to perform a complete recovery, the database must be in ARCHIVELOG mode. In NOARCHIVELOG
    mode, an incomplete recovery must be performed—otherwise all transactions after
    the last backup up to the point of failure will be lost.


    Be familiar with the process of restoring data files to different locations. To
    restore data files to different locations, you must use the OS commands to copy
    files from the backup location to the new location. Then you will use the ALTER
    DATABASE RENAME FILE command to record the new data file locations in the control
    file.


    List the read-only tablespace recovery scenarios. The three read-only recovery
    scenarios include read-only backup and read-only recovery, read-only backup and
    read-write recovery, and read-write backup and read-only recovery. You should
    understand how recovery varies in each of these scenarios.


    Understand the commands necessary to perform RMAN restoration and recovery. The
    RESTORE command will determine the best available backup set or image copy to
    use in the restoration. The RECOVER command will apply the necessary changes from
    the online redo logs and archived logs as well as incremental backups (if used)
    to the restored files.


    Understand RMAN recovery in ARCHIVELOG and NOARCHIVELOG mode. In NOARCHIVELOG
    mode, you use a RESTORE command of a consistent database but you don''t use the
    RECOVER command. In ARCHIVELOG mode, both the RESTORE and RECOVER commands are
    used.


    Use RMAN commands to restore data files to different locations. The SET NEWNAME
    command is used to name the new location of the data file, and the SWITCH command
    is used to update the control file with the new location. After this, the database
    is recovered.'
  merge: -1
  pgno: 387
