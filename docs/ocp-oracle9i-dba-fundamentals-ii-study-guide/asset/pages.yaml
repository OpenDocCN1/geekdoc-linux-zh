  md: '9. D. LISTENER is the default name of the Oracle listener. There is no such
    as utility as lsmngr. TCPCTL was actually an old utility to start and stop the
    SQL*NET version 1 listener. The lsnnrctl command is used to manage the listener.


    10. D. Become familiar with the Oracle Net Manager interface. Listeners are the
    correct choice. Profile is used for sqlnet.ora administration. The other choices
    are not valid menu options.


    11. D. When a user makes a connection request, the listener passes control to
    some server process or dispatcher. Once the user is attached to this process,
    all negotiations and interaction with the database pass through this process.
    If the user supplies an invalid user ID or password, the process waits for a period
    of time for a valid response. If the user does not contact the server process
    with a valid response in the allotted time, the server process terminates, and
    the user must contact the listener so that the listener can again spawn a process
    or redirect the client to an existing dispatcher. This period of time that the
    process waits is specified by the connect_timeout_listener_name parameter. This
    parameter is specified in seconds.


    12. D. The highest level of tracing available is the SUPPORT level. The level
    that would be used to trace packet traffic information.


    13. E. There is no maximum number of listeners that can be configured per server.


    14. B. The default listener name is LISTENER. Since this is the default, simply
    enter lsnnrctl start. The name LISTENER is assumed to be the listener to start
    in this case.


    15. E. Oracle expects the listener to be called LISTENER by default. The name
    of the facility to start the listener is lsnnrctl. Using lsnnrctl start will start
    the default listener. To start a listener with another name, enter lsnnrctl start
    listener_name.'
