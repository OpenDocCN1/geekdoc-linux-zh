  md: '# Security: Advanced Security


    The threat of data tampering is becoming an issue of increasing concern to many
    organizations as network systems continue to grow in number and complexity and
    as users gain increasing access to systems. Sensitive business transactions are
    conducted with greater frequency and, in many cases, are not protected from unauthorized
    tampering or message interception.


    Oracle Advanced Security, formerly known as the Advanced Security Option and the
    Advanced Networking Option, not only provides the tools necessary to ensure secure
    transmissions of sensitive information, but it also provides mechanisms to confidently
    identify and authenticate users in the Oracle enterprise.


    When configured on the client and the Oracle server, Oracle Advanced Security
    supports secured data transactions by encrypting and optimally checksuming the
    transmission of information that is sent in a transaction. Oracle supports encryption
    and checksuming by taking advantage of industry-standard algorithms, such as RSA
    RC4, Standard DES and Triple DES, and MD5 checksuming. These security features
    ensure that data transmitted from the client has not been altered during transmission
    to the Oracle server.


    Oracle Advanced Security also gives the database administrator the ability to
    authenticate users connecting to the Oracle servers. In fact, there are number
    of authentication features for ensuring that users are really who they claim to
    be. These are offered in the form of token cards, which use a physical card and
    a user identifying PIN number to gain access to the system; the biometrics option,
    which uses fingerprint technology for user connection requests; Public Key; and
    certificate-based authentication.


    Another feature of Oracle Advanced Security is the ability to have a single sign-on
    mechanism for clients. Single sign-on is accomplished with a centralized security
    server that allows the user to connect to any of the Oracle services in the enterprise
    using a single user ID and password. Oracle leverages the industry-standard features
    of Kerberos to enable these capabilities.(Kerberos is an authentication mechanism
    based on the sharing of secrets between two systems.) This greatly simplifies
    the privilege matrix that administrators must manage when they are dealing with
    large numbers of users and systems.


    # Security: Firewall Support


    Firewalls have become an important security mechanism in corporate networks. Firewalls
    are generally a combination of hardware and software that'
  merge: -1
