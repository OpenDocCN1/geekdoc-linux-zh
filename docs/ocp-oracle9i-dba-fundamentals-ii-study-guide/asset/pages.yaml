    names resolution. However, Oracle Names Server can still be configured from Oracle
    Net Manager and is supported under Oracle9i. However, no revisions are being done
    to the product, and future releases of Oracle may not support Names Server.


    # Creating the Listener


    Earlier, we said that by default, Oracle will create a listener called LISTENER
    when it is initially installed. The default settings that Oracle uses for the
    listener.ora file are shown here.


    | Section of the File | Setting |

    |--- |--- |

    | Listener Name | LISTENER |

    | Port | 1521 |

    | Protocols | TCP/IP and IPC |

    | Host Name | Default Host Name |

    | SID Name | Default Instance |


    You can use Oracle Net Manager to create a non-default listener or change the
    definition of existing listeners. The Oracle Net Manager has a wizard interface
    for creating most of the network elements, such as the listener.ora and tnsnames.ora
    files.

    Follow these steps to create the listener:


    +   1. Click the plus (+) sign next to the Local icon.

    2. Click the Listeners folder.

    3. Click the plus sign icon or select Create from the Edit menu.

    4. The Choose Listener Name dialog box appears. If this is the first listener
    being created, the Oracle Net Manager defaults to LISTENER if no listener is configured
    or to LISTENER1 if a default listener is already'
