    Because you are operating in NOARCHIVOG mode, you must perform a full database
    restore from the previous week. You cannot perform a tablespace or data file recovery
    in NOARCHIVOG mode because you have no ability to roll back and roll forward historical
    changes. There are no archived logs to apply to the data file to make the data
