  md: '# Glossary 477


    Heterogeneous Services Facility provides the ability to communicate with non-Oracle
    databases and services.


    high-water mark (HWM) The maximum number of blocks used by the table. The high-water
    mark is not reset when you delete rows.


    hint A multiline comment with a plus symbol within an SQL statement. The mechanism
    influences the explain plan of a query.


    host The name of the physical machine on the Oracle server is located. This can
    be an Internet Protocol (IP) address or a real name that is resolved via some
    external naming solution, such as DNS.


    hostnaming method A resolution method for small networks that minimizes the amount
    of configuration work the DBA must perform.


    hot backup Also called an opened, or online, backup. Occurs when the database
    is open and a physical file copy of the data files associated with each tablespace
    is made (placed into backup mode with the ALTER TABLESPACE [BEGIN/END] BACKUP
    commands).


    image copies Copies of data files, control files, or archived logs, either individually
    or as a whole database. These copies are not stored in an RMAN format. These are
    stored in a standard file format like a file that must be stored in disk.


    import utility An Oracle utility used to read and import data from the file created
    by the Export utility. A selective import can be performed using the appropriate
    parameters. The Import utility reads the logical backups generated by export.


    incarnation A reference of a target database in the recovery catalog.


    incomplete recovery A form of recovery that doesn''t completely recover the database
    to the point of failure. The three types of incomplete recovery are cancel-based,
    time-based, and change-based. Incomplete recovery requires a RESETLOGS.'
