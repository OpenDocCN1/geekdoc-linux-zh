- img_proc: true
  md: '# A


    physical backup is a copy of the physical database files, and it can be performed
    in two ways. The first is through the Recovery Manager (RMAN) tool that Oracle
    provides. The second way is by performing a user-managed, or non-RMAN, backup.
    This chapter focuses on both types of backup.


    The user-managed backup has been used for years to back up the Oracle database.
    The OS backup script is a totally customized solution, and there has the variations
    and inconsistencies associated with custom solutions. This backup usually consists
    of an OS backup created with a scripting language, like Korn shell or Bourne shell
    in the Windows NT/2000/XP environment.


    Even though the user-managed backup has been historically helpful, the current
    trend shows that most larger database sites are now using to conduct their backups.
    The reason for this is because of RMAN''s extended capabilities and it can be
    used consistently regardless of platform.


    However, the OS backup is still useful for the DBA. You can use it to train yourself
    so that you understand the physical backup fundamentals. Further, many storage
    subsystem providers still utilize user-managed backups in conjunction with third
    mirror capabilities to expedite large backups in a short period of time. (A third
    mirror, or mirroring equivalents, offers a way to separate a third copy of the
    disk mirror at the hardware level. This third copy is made into a backup that
    can be copied to tape.) After you have learned as much as you can from the user-managed
    backup, move on to RMAN, which builds on these fundamentals.


    In this chapter, you will learn the various physical backup methods with both
    user-managed backups and RMAN backups.'
  merge: -1
  pgno: 313
- img_proc: true
  md: 'Working with Read-Only Tablespaces


    # User-Managed Backup and Recovery Operations


    As mentioned, different sites customize their user-managed backups and recovery
    operations to suit different requirements. This customization is possible because
    this type of backup is generally a script written in a Unix shell or over Windows
    NT/2000/XP batch commands. As a result, these user-managed backups and recovery
    operations must be managed as custom code, and significant testing must be conducted
    to validate their functionality.


    This description shows both the benefits and drawbacks of using this type of backup.
    Though this ability to customize can allow user-managed backups to be designed
    for unique situations in addition to significant testing and validation, such
    customizations could cause errors that invalidate the entire backup or recovery
    process.


    Despite possible side effects, user-managed backups have been used for many years
    in the Oracle environment. In addition to their broad usage, these backups also
    provide the building blocks you need to understand the entire Oracle backup and
    recovery process (including RMAN). This is why every DBA should be comfortable
    with user-managed backup and recovery operations. This knowledge will allow them
    to make the correct decisions in a failure situation whether the site is using
    user-managed or RMAN-based backup and recovery.


    # Working with Read-Only Tablespaces


    The backup and recovery of a read-only tablespace requires unique procedures in
    certain situations. The backup and recovery process changes depending on the state
    of the tablespace at the time of backup and the state of the control file. This
    section discusses the implications of each of these situations.


    A backup of a read-only tablespace requires different procedures from those used
    in a backup of a read-write tablespace. The read-only tablespace is, as its name
    suggests, marked read-only; in other words, work activity is'
  merge: -1
  pgno: 314
- img_proc: true
  md: 'disabled. Therefore, the system change change number (SCN) does not change
    after the tablespace has been made read-only, as long as it stays read-only. This
    means that after a database failure, no recovery is needed for a tablespace marked
    read-only if the tablespace was read-only at the time of the backup. The read-only
    tablespace could simply be restored and archived logs would get applied during
    the recovery process. If a backup is restored that contains a tablespace that
    was in read-write mode but is in read-only at the time of failure, then a recovery
    would need to be performed. This is because changes would be made during read-write
    mode. Archived logs would be applied up until the tablespace was made read-only.


    The state of the control file also affects the recovery process of read-only tablespaces.
    During recovery of a backup control file, or recovery when there is no current
    control file, read-only tablespaces should be taken offline or you will get an
    ORA-1233 error. The control file cannot be created with a read-only tablespace
    online. The data file or data files associated with the read-only tablespace must
    be taken offline before the recovery command is issued. After the database is
    recovered, the read-only tablespace can be brought online. We will look at examples
    of the recovery of read-only tablespace in Chapter 10,"User-Managed Complete Recovery
    and RMAN Complete Recovery.


    # Understanding Closed and Opened Database Backups


    A closed backup is a backup of a database that is not in the opened state. Usually
    this means that the database is completely shut down. This kind of backup is also
    called a cold, or offline, backup. An opened backup is a backup of a database
    in the opened state. In this state, the database is completely available for access.
    An opened backup is also called a hot, or online, backup.


    The main implication of a closed backup is that the database is unavailable to
    users until the backup is complete. One of the preferable prerequisites of doing
    a cold backup is that the database should be shut down with the NORMAL or IMMEDIATE
    options so that the database is in a consistent state. In other words, the database
    files are stamped with the same SCN at the same point in time. This is called
    a consistent backup. Because no recovery information in the archived logs needs
    to be applied to the data files, no recovery'
  merge: -1
  pgno: 315
- img_proc: true
  md: '# Understanding Closed and Opened Database Backups 255


    is necessary for a consistent, closed backup. Figure 9.1 is an example of a closed
    backup.


