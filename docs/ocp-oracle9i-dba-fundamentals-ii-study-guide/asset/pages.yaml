  md: '# Types of Failure in Oracle Environments


    # Database Backup, Restoration, and Recovery


    If you understand and can identify the aspects of the Oracle database that are
    required for normal operation, you will understand what must be backed up, restored,
    and recovered.


    The Oracle database is made up of a set of physical structures that must be present
    and consistent for the database to function normally. At a minimum, these physical
    structures consist of data files, redo logs, control files, and initialization
    files.


    If any of these files are not present, the database may not start or it may halt
    during normal operations. All of these must be backed up on a regular basis to
    disk, tape, or both. Such a backup can consist of a user-managed backup or Recovery
    Manager (RMAN)-based backup. A user-managed backup consists of any custom backup;
    such a backup is usually performed in an OS script such as a shell shell or the
    DOS-based batch script. These scripts execute database commands and OS commands
    to copy the necessary database files to disk or tape. An RMAN-based backup is
    performed by the Oracle recover manager utility, which is part of the Oracle software.
    RMAN backups are performed by executing standard RMAN commands or scripts.


    Both of these backups can be used to restore the necessary database files from
    disk or tape to the desired location. The restore process consists of copying
    the database files from tape or disk to a desired location so that database recovery
    can begin.


    The recovery process consists of starting the database and making it consistent
    a complete or partial backup copy of some of the physical structures of the database.
    Recovery has many options depending on the type of backups that are performed.
    We will discuss the different types of recovery in user-managed and RMAN-based
    situations in later chapters.


    # Types of Failure in Oracle Environments


    There are two major categories of database failures: non-media failures and media
    (disk) failures. Non-media failures consist of four types of failures, which are
    typically less critical in nature. Media failures have only one type of'
