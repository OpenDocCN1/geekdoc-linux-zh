  md: '**log buffers** Memory buffers that contain the entries that get written to
    the log files.


    **log file** A file to which the status of the operation is written when utilities
    such as SQL*Loader or Export or Import are being used.


    **logging** The recording of DML statements, creation of new objects, and other
    changes in the redo logs. This process also records significant events, such as
    starting and stopping the listener, along with certain kinds of net-errors.


    **logical backup** Reads data in the database and stores it in an Export file
    to create a snapshot of all data in the database. Cannot be used in conjunction
    with incomplete recovery.


    **logical objects** Objects that do not exist outside of the database, such as
    tables, indexes, sequences, and views.


    **logical structures** The database structures are used by the user. Tablespaces,
    segments, extents, blocks, tables, and indexes are all of logical structures.


    **LogMiner** A utility that can be used to analyze the redo log files. It can
    provide a fix for logical corruption by building redo and undo SQL statements
    from the contents of the redo logs. LogMiner is a set of PL/SQL packages and dynamic
    performance views.


    **log sequence number** A sequence number assigned to each redo log file.


    **log writer process (LGWR)** Responsible for writing the redo log buffer entries
    (change vectors) to the online redo log files.


    **Isnrctl** Command line utility used to control and monitor the Oracle listener
    process.


    **Isnrctl services** Command used to view information about what services a particular
