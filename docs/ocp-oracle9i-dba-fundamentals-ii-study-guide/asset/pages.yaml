  md: '# Using Oracle Net Manager


    If you are using Oracle9i, you must configure an Oracle9i listener to connect
    to the Oracle server. Oracle9i listeners are backward compatible and can listen
    for connection requests to earlier Oracle database versions.


    If you want to be able to set up more than basic configurations of Oracle network
    files, you will have to use the Oracle Net Manager. In the next few sections,
    you will learn how to use the Oracle Net Manager to configure the server-side
    network files.


    # Using Oracle Net Manager


    Oracle Net Manager is a tool you can use to create and manage most client- and
    server-side configuration files. The Oracle Net Manager has evolved from the Oracle7
    tool, Network Manager, to the latest Oracle9i version. Throughout this evolution,
    Oracle has continued to enhance the functionality and usability of the tool.


    We recommend using the Oracle Net Manager to create and manage all of your network
    files. This is because these files need to be in a specific format, and the Oracle
    Net Manager ensures the files are created in that format. If the files are not
    in the correct format, you may have problems with your network connections. Something
    as subtle as an extra space or tab can cause problems with network connections,
    so if you were used to cutting and pasting old entries in these files, it is better
    now to use Oracle Net Manager to create new entries.


    If you are using a Windows NT/2000 environment, you can start the Oracle Net Manager
    by choosing Start > Programs > Oracle9i Programs choice > Configuration and Migration
    Tools > Oracle Net Manager. In a Unix environment, you can start it by running
    ./netmgr for your $ORACLE_HOME/bin directory.


    Figure 2.4 shows an example of the Oracle Net Manager opening page.'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# 44 Chapter 2 · Configuring Oracle Net on the Server


