- img_proc: true
  md: 'statements performed in SQL*Plus. The direct-path load is designed to improve
    the performance of the conventional load by providing similar functionality. Lastly,
    the external-path load is a specialized load designed so that SQL*Loader will
    work with external tables.


    # Conventional Load


    Conventional load is the first of three methods you can use to load data with
    SQL*Loader. A conventional load is much slower than a direct-path load. The conventional
    load builds a bind array, and when this bind array is full, a SQL insert statement
    is executed. This method is comparable to the one that Oracle uses to process
    normal DML statements as inserts. Conventional load is the default method that
    SQL*Loader uses.


    # Direct-Path Load


    The direct-path load is initiated by using the DIRECT=keyword on the command line.
    This method is much faster than conventional load. The direct-path load does not
    use a bind array; instead it uses the direct-path API to load data more directly
    into the database without the overhead of standard SQL processing. Because the
    data actually bypasses the normal SQL processing layers, Oracle must load this
    data into blocks that are unused or above the high-water mark of the table. The
    high-water mark is the last used block in the table whether there is data in the
    block or not. Table 15.1 compares conventional loads and direct-path loads, and
    Figure 15.2 displays the functional differences between these two methods.


    # TABLE 15.1 Conventional Load versus Direct-Path Load


    | Conventional Load | Direct-Path Load |

    |---|-|

    | Uses standard commits to save data | Uses data saves |

    | Always generates redo information | Generates redo information when certain
    conditions are met |

    | Fires insert triggers | Does not fire insert triggers |

    | Can load into clustered tables | Cannot load into a clustered table |

    | Enforces constraints | Does not enforce constraints |'
  merge: -1
  pgno: 513
- img_proc: true
  md: '# TABLE 15.1 Conventional Load versus Direct-Path Load (continued)


    | Conventional Load | Direct-Path Load |

    | --- | --- |

    | Allows users to modify the table data during load process or have active transactions
    | Locks users out so that they cannot make changes or have active transactions
    |

    | Allows SQL functions to be used in the control file | Does not allow SQL functions
    to be used in the control file |


    The direct-path load functions in a similar manner to the direct-path inserts.
    Each control file and input data file is loaded into a temporary segment and it
    is merged into the table above the high-water mark. See Figure 15.2, which shows
    SQL*Loader direct-path load in comparison to conventional load.


    # FIGURE 15.2 SQL*Loader overview of direct-path load versus conventional load


    ![](img/a183fd041839741f5ab6df3caffc6b52_514_0.png)'
