- img_proc: true
  md: '+   7. Perform an incomplete recovery using the UNTIL CANCEL clause in the
    RECOVER DATABASE command.


    ```

    SQL> recover database until cancel;

    ```


    +   8. Open the database with the RESETLOGS option.


    ```

    SQL> alter database open resetlogs;

    ```


    You must use the RESETLOGS clause with the ALTER DATABASE command for all types
    of incomplete recovery. The RESETLOGS option ensures that the log files applied
    in recovery can never be used again by resetting the log sequence and rebuilding
    the existing online redo logs. This process permanently deactivates all transactions
    in the unarchived log files so they can never be recovered. At the same time,
    it resynchronizes log files with the data files and control files. If these transactions
    were not purged, the log files would create bad archived logs. This is the main
    reason why a backup of the control file, data files, and redo logs should be done
    prior to performing an incomplete recovery.


    +   9. Perform a new cold or hot backup of the database. Existing backups are
    no longer valid.


    ![](img/a183fd041839741f5ab6df3caffc6b52_401_0.png)


    > Remember, after the ALTER DATABASE OPEN RESETLOGS command is applied, the previous
    log files and backed-up data files are useless for this newly recovered database.
    This is because a gap exists in the log files. The old backup data files and logs
    can never again be synchronized with the database. Thus, a complete backup must
    be performed after an incomplete recovery of any type.


    # Real World Scenario

    Using Incomplete Recovery to Move a Database


    Recovery operations can be used as tools to perform activities other than the
    typical recovery from failure. For this reason, you need to be familiar with the
    backup and recovery features and capabilities associated with an incomplete recovery.'
  merge: -1
  pgno: 401
- img_proc: true
  md: '# Performing an Incomplete Database Recovery 341


    Incomplete recovery options, such as the backup control file being used in conjunction
    with the RECOVER DATABASE USING BACKUP CONTROLFILE UNTIL CANCEL command, can be
    useful when you are trying to move databases from one location to another. When
    you use such options, you can move databases for any purpose, such as moving a
    database for testing, or moving a database to a new server. You must make sure
    that if you are moving a database to a new server, the Oracle database software
    and the OS on the new server are similar.


    This approach of moving databases is performed by taking the hot or cold backup
    of the database you want to move and moving the data files and initialization
    files to the new location. Then you would change the backup control file to location
    references of all the physical database files, such as redo logs and data files.
    After you have done this, you will need to validate your ORACLE_SID and make sure
    it is sourced to the correct database; you will then need to execute the backup
    control file at the SQL prompt as sysdba. This will generate a new database on
    a new server and in different locations. Please refer to the Oracle documentation
    for the exact steps to perform this task and always try this process in a test
    environment.


    As a DBA, you will be responsible for setting up test environments for numerous
    reasons. You will find that the ability to move and set up databases and applications
    on different servers for testing and upgrade purposes is a must-have skill. Every
    time there is any significant upgrade, it will need to be tested on a different
    environment than the production environment. The approach of moving data files
    and re-creating the control file works well for many testing and upgrading situations.


    # Time-Based Recovery


    In time-based recovery, the DBA recovers the database to a point in time before
    the point of failure. Time-based recovery provides more flexibility and control
    than the cancel-based option. The cancel-based option''s granularity is the size
    of a log file; in other words, when you are applying a redo log file, you get
    all the transactions in time, regardless of the time period over which that log
    was filled.


    In time-based recovery, you apply archived logs to the database up to a designated
    point in time. This point could be in the middle of the archived log, but not
    necessarily apply to the whole archived log. After you have applied these logs,
    you can control the recovery process to a time prior to a'
  merge: -1
  pgno: 402
- img_proc: true
  md: 'fatal action in the database, such as data block corruption or the loss of
    a database object due to user error. Below is a sample of the time-based, incomplete
    recovery.


    ```

    SQL> recover database until time ''2001-9-30:22:55:00'';

    ```


    You can use the preceding example to restore lost data files and then use time-based
    recovery in place of cancel-based recovery. To do this, restore all the necessary
    data files from a hot backup, as before. The only change is that you use the UNTIL
    TIME clause in step 7 instead of the UNTIL CANCEL clause, as shown here:


    +   7. Perform an incomplete recovery using the UNTIL TIME clause.

    SQL> recover database until time ''2001-9-30:22:55:00'';


    All others remain the same.


    # Change-Based Recovery


    In change-based recovery, you recover to a system change number (SCN) before the
    point of failure. This type of incomplete recovery gives you the most control.


    As you have already learned, the SCN is what Oracle uses to uniquely identify
    committed transaction. The SCN is a number that orders the transactions consecutively
    in the redo logs as each transaction occurs. This number is also recorded in transaction
    tables within the rollback segments, control files, and data file headers. The
    SCN coordination between the actions and these files synchronizes the database
    to a consistent state.


    Each redo log is associated with a low and high SCN number. This SCN information
    can be seen in the VLOG_HISTORY view below. Notice the low and high SCN numbers
    in the FIRST_CHANGE# and NEXT_CHANGE# columns for each log sequence or log file.


    ```

    SQLKS> select sequence#,first_change#,next_change#,first_time

    ```


    ```

    2 from vlog_history where sequence= 10326;

    ```


