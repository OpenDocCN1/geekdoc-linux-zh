  md: '![](img/a183fd041839741f5ab6df3caffc6b52_479_0.png)


    he Oracle database software provides two primary ways to back up the database.
    The first is a physical backup, which consists of copying files and recovering
    these files as needed. You have been reading about this approach in the previous
    four chapters. The second type of backup is a logical backup. A logical backup
    of the database requires recovering certain database objects and writing them
    to a file without concern for their physical location. The file can then be inserted
    back into the database as a logical restore.


    Oracle also provides two utilities to handle the backups and recoveries in an
    Oracle database: the Export utility and the Import utility. The Export utility
    creates logical backups of the database, and the Import utility performs logical
    recoveries of the database.


    This chapter demonstrates how to back up and recover the database with the Export
    and Import utilities. It also explains incremental backups and recoveries.


    The topics in this chapter are an important part of the test and real-life recovery
    situations. The Export and Import utilities are a good supplement to a user-managed
    or RMAN-based backup. These utilities can be used in real-world recovery situations
    in which developers or end users inadvertently drop tables or delete data.


    # Using the Export and Import Utilities


    The Export and Import utilities primarily perform logical backups and recoveries,
    but they may be used for such varied operations as the following:


    Recovering database objects The primary use of the Export and Import utilities
    for backup and recovery is to replace an individual object, such as'
  merge: -1
  pgno: 479
- img_proc: true
  md: '# Using the Export and Import Utilities


    a table or a schema consisting of multiple database objects. The entire or full
    database can be recovered also, this is not common. In some cases, a table may
    be dropped by a user or a developer, but you may not want to restore the whole
    database. Though the whole database can be restored, because of the point-in-time
    nature of exports, the data may be inconsistent.


    Recovering using tablespace point-in-time recovery (TSPITR) In Oracle8, the tablespace
    point-in-time recovery (TSPITR) was introduced. The TSPITR was designed to recover
    large individual objects using a fairly complicated recovery process. As a result,
    we would recommend that you get help from Oracle Support before you perform a
    recovery, or you will need to use physical and logical recovery techniques. In
    addition, you will need to use a clone database to perform the complete process,
    and this will require extra resources. With so many drawbacks, you may wonder
    why anyone would use this. The reason is that TSPITR allows you to recover all
    the objects in an entire tablespace without recovering the entire database. This
    is useful in large databases where a complete restore and recovery would take
    a long time.


    There are a couple of specialized parameters you must be familiar with in to use
    TSPITR: TRANSPORT_TABLESPACE and DATAFILES. The TRANSPORT_TABLESPACE parameter
    identifies the tablespace that will be used in the TSPITR process. The DATAFILES
    parameter identifies the data files that support the tablespace to be recovered.


    Reorganizing the database to improve performance The Export and Import utilities
    can also be used to reorganize a database and restore individual objects. When
    objects are restored in this manner, the data they may be packed or compressed
    into fewer extents so that can be retrieved more expeditiously. This is accomplished
    by using the COMPRESS=Y command, which is the default. Below is an example of
    using this parameter.


    ```

    oracle@ottillii:~ > exp userid-test/test compress=Y file=tst9.dmp

    ```


    Upgrading an object or a database You can also use these utilities to upgrade
    databases or objects from one version to another. If these utilities are used
    in this manner, an export is taken of a table or database, and then it is imported
    into the new database with the upgraded version.'
  merge: -1
  pgno: 480
- img_proc: true
  md: '# Real World Scenario


    Moving data from one database to another The Export and Import utilities can also
    be used to move data from one database to another. The binary dump file created
    by the export process can be sent from one server to another via FTP, and then
    it can be loaded into a new database.


    # Using Export for Added Protection


    Exports provide extra protection above and beyond the normal backup plans, and
    they are often used to supplement backup protection of individual objects. Under
    certain circumstances, the export can also serve as a valuable asset for complete
    recovery.


    In this case, a junior DBA inadvertently dropped a tablespace that contained only
    one table of static data for a small insurance provider. Realizing the error,
    the DBA attempted to recover the database from the previous night''s open RMAN
    backup. To his dismay, there was a problem with the tape hardware, and he was
    unable to get it working. This hardware issue could not be addressed until the
    next day at the earliest.


    At this point, it was already late in the evening and the DBA knew that the database
    would begin receiving automated caller information from the east early the next
    morning. As a result, the database was required to be available before the hardware
    issue could be addressed; if it wasn''t, the company''s business would be severely
    impacted.


    But the DBA remembered that there was an automated daily export of key tables
    in the databases, including the one table in the tablespace that was dropped.
    This export occurred at noon, between the bulk loads.


    After careful thought, the DBA re-created this erroneously dropped tablespace.
    After the DBA finished re-creating the tablespace, he imported the one table that
    resided within the newly created tablespace. Finally, the DBA finished the process
    by reloading the few flat files that were necessary so that the table was totally
    consistent.


    By using an export, the DBA completely restored the database and only four hours
    of service were lost. This situation worked nicely because the data was isolated
    and fairly static. The primary changes to the table were identified in the flat
    files.


    ![](img/a183fd041839741f5ab6df3caffc6b52_481_0.png)'
  merge: -1
