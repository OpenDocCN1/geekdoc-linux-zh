- img_proc: true
  md: '# External-Path Load


    External-path load is specialized to allow the SQLLoader utility to be used on
    external tables. By default, the external-path load is attempted in parallel if
    the file is made up of multiple data files. External tables are tables that are
    stored outside the database and have special restrictions (such as they are read-only).
    External tables are used primarily as temporary storage tables that can be loaded
    into normal database tables at some point.


    Let''s go through a brief overview of the necessary components for creating the
    external table. The command used to create external tables is very similar to
    a standard table creation command; it is CREATE TABLE <table name> ORGANIZATION
    EXTERNAL. In addition, a logical directory designates the files that will make
    up the external table need to be created. The command is CREATE DIRECTORY EXTERNAL_TAB_DIR
    as ''/u01/ora9i/ext_files''. Once these steps have been completed, the schema
    that will create the table will need read/or write privilege to the external directory,
    which in our case is EXTERNAL_TAB_DIR.


    ![](img/a183fd041839741f5ab6df3caffc6b52_515_0.png)


    # Adjusting the High-Water Mark with Direct-Path Load


    When you are using SQL*Loader''s direct-path method, you can insert data directly
    into the data blocks within a table. When you do this, Oracle will not be able
    to identify whether the data blocks have data or not. As a result, every time
    you use direct-path load, Oracle must put data in past the high-water mark in
    the table. But this is not a problem if you are prepared for the space usage in
    the table to increase and such usage is of your growth plan. If you aren''t prepared,
    the table will grow rapidly each time you load the data and it will consume unnecessary
    space.


    If you are reloading data into a table and replacing the old data, you may want
    to truncate the table before you do so in order to reset the high-water mark.
    This will prevent your table from growing the size of the data load each time
    the table is loaded.'
  merge: -1
  pgno: 515
- img_proc: true
  md: '# SQL*Loader Parallel Load Methods


    SQL*Loader can run in parallel to further improve performance of large data loads.
    There are three main variations of parallel loads: parallel conventional load,
    intersegment concurrency with direct-path load, and intrasegment concurrency with
    direct-path load. Here we explore each of these load methods.


    Parallel conventional load Parallel conventional load is performed by issuing
    SQL*Loader commands, with their own control file and input data file, all to the
    same. The input data file is logically split on the record boundaries in the table.
    For example, records 1 through 100 are loaded using the inv1.dat input file, and
    records 101 through 200 are loaded using the inv2.dat input file.


    ```

    oracle@octilli:> sqlldr test/test control=inv-ctl

    load=inv.dat

    oracle@octilli:> sqlldr test/test control=inv2-ctl

    load=inv.dat

    ```


    Intersegment concurrency with direct-path load Intersegment concurrency with direct-path
    load is performed by using direct-path load to load into multiple tables or partitions
    within a table at the same time. This method is performed in the same way that
    parallel conventional load is, but it adds the DIRECT=TRUE keyword and uses different
    tables. Notice that the first load is going into the inv.dat table and the second
    is going into the orders.dat table as defined by the control file and input name
    file.


    ```

    oracle@octilli:> sqlldr test/test control=inv-ctl

    load=inv.dat direct=true

    oracle@octilli:> sqlldr test/test control=orders-ctl

    load=orders.dat direct=true

    ```


    Intrasegment concurrency with direct-path load Intrasegment concurrency with direct-path
    load is performed by using direct-path load to load data into a single table or
    partition. This can be performed by placing the DIRECT=TRUE and PARALLEL=TRUE
    option on the command line. In this parallel server, processes the data into temporary
    segments and then merge them into the individual segments.


    ```

    oracle@octilli:> sqlldr test/test control=inv-ctl

    load=inv.dat direct=true parallel=true

    ```'
  merge: -1
  pgno: 516
- img_proc: true
  md: '# Performing Basic SQL*Loader Operations


    The basic SQL*Loader functions are initiated by executing the sqlldr command at
    the OS command prompt. Here is an example in Unix shows you all of the other commands
    and options available to the SQL*Loader utility.


    ```

    oracle@octillii:/oracle/admin/tst9/adhoc > sqlldr

    ```


    SQL*Loader: Release 9.0.1.0.0 - Production on Tue Oct 16 21:11:51 2001


    (c) Copyright 2001 Oracle Corporation. All rights reserved.


    Usage: SQLLLOAD keyword=value [keyword=value,...]


    Valid Keywords:


    ```

    userid -- ORACLE username/password

    control -- Control file name

    log -- Log file name

    bad -- Bad file name

    data -- Data file name

    discard -- Discard file name

    discardmax -- Number of discards to allow (Default all)

    skip -- Number of logical records to skip (Default 0)

