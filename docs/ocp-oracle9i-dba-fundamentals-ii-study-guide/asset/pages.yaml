- img_proc: true
  md: '# Export and Import Concepts and Structures


    As stated in the introduction to this chapter, the Export utility can be used
    to create logical backups of the Oracle database. The Import utility can recover
    these logical backups. There are two types of exports: the conventional-path export
    and the direct-path export.


    The conventional-path export is the default mode of the Export utility. This method
    can be time consuming for large objects or exports. However, it works well for
    everyday uses.


    The direct-path export is enabled by typing DIRECT-Y on the command line. This
    export option is substantially faster than the conventional-path export. This
    direct-path export bypasses the SQL evaluation layer as it regenerates commands
    to be stored in the binary dump file. This is where the performance improvements
    are made. Figure 14.1 displays the execution path of each type of export.


    FIGURE 14.1 The differences between direct-path and conventional-path exports


    ![](img/a183fd041839741f5ab6df3caffc6b52_482_0.png)'
