    # Configuring Listener Services Using the Oracle Net Manager


    You will want to use the Oracle Net Manager to configure the listener. As stated
    in Chapter 1, “Introduction to Network Administration,” the Oracle Net Manager
    provides an easy-to-use graphical interface for configuring most of the network
    files you will be using. By using Oracle Net Manager, you can ensure that the
    files are created in a consistent format, which will reduce the potential for
    connection problems.


    When you first start the Oracle Net Manager, the opening screen displays a list
    of icons down the right-hand side of the screen under the Network folder. The
    choices under the Local folder relate to different network configuration files.
    Here are the different network file choices and what each configures.


    | Icon | File Configured |

    | --- | --- |

    | Profile | sqlnet.ora |

    | Service Naming | tnsnames.ora |

    | Listeners | listener.ora |

    | Oracle Names Servers | names.ora |'
