- img_proc: true
  md: '# Configuring Multiple Services on the Same Host Hostnaming


    If you have multiple Oracle servers on the same machine, it is possible to continue
    using the hostname method. To do so, you must have separate hostname address entries
    in your HOSTS file or in your external naming service for each of the separate
    Oracle services. For example, if we had two Oracle services, one called DBA and
    one called PROD, on a machine with an IP address of 10.2.0.91, you could configure
    your HOSTS name as follows:


    +   10.2.0.91 DBA # Alias for MACH1 server for DBA DBA

    10.2.0.91 PROD # Alias for MACH1 server for PROD PROD


    Notice that each of these names resolve to the same IP address. You also need
    to configure your listener with two entries, one for DBA and for PROD, with the
    GLOBAL_DBNAME parameter set to DBA and PROD respectively. (If you were using the
    hierarchical naming method with domain names, include the domain name on the GLOBAL_DBNAME
    parameter.)


    # The Localnaming Method


    The localnaming method is probably the most widely used and well-known method
    of resolving network services. Most users use this method as the tnsnames.ora
    file because it uses the tnsnames.ora file.


    To use the localnaming method, you must configure the service file in any location,
    as long as the client can get to it. The default location for tnsnames.ora file
    and the sqlnet.ora is %ORACLE_HOME%\network\admin on Windows NT/2000, and %ORACLE_HOME/network/admin
    on Unix systems. If you want to change the location of this file, set the environment
    variable TNS_ADMIN. In Unix-based systems, TNS_ADMIN can be exported to the user''s
    environment or set in the user''s profile. In Windows NT/2000, this setting is
    placed in the Registry. Windows Registry key that stores the TNS_ADMIN may vary
    depending on your setup. Generally, it is found somewhere under Hkey_local_machine/software/oracle
    Registry key, but it may be at a lower level depending on your configuration.


    Most installations probably keep the files in these default locations on the client
    and server. Some users create shared disks and place the tnsnames.ora and sqlnet.ora
    files in this shared location to take a centralized approach to managing these
    files. If server-to-server communication is necessary, these files need to be
    on the server. The default location on the server is the same as the default location
    on the client.'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# Configuring the Localnaming Method Using Oracle Net Manager


    The localnaming method is configured using the Oracle Net Manager. To start this
    configuration, open the Oracle Net Manager and click the Service Naming selection
    under the Local tab. Click the plus sign on the left side of the screen or choose
    Create from the Edit menu (see Figure 3.4).


    FIGURE 3.4 Oracle Net Manager title screen with Service Naming option chosen


    ![](img/a183fd041839741f5ab6df3caffc6b52_159_0.png)


    The Oracle Net Manager will present you with the Net Service Name wizard, which
    will guide you through the process of creating the net service names definition.


    # Choose a Net Service Name


    When you configure a client to use the localnaming method, first you must choose
    a net service name. This is the name users enter when they are referring to the
    location they want to connect to. The name you supply here should not include
    the domain portion if you are using the hierarchical naming mode. Click the Next
    button to continue. Figure 3.5 shows an example of choosing the net service name.'
  merge: -1
