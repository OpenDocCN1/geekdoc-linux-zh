  md: '![](img/a183fd041839741f5ab6df3caffc6b52_347_0.png)


    In this chapter, we will focus on media failures and how to recover from them.
    There are two methods that can be used to recover from media failures: user-managed
    recovery and RMAN-based recovery. This chapter uses examples to demonstrate the
    differences between each type.


    As we have discussed in previous chapters, the method you decide to operate in,
    ARCHIVELOG mode or NOARCHIVELOG mode, determines the recovery options that you
    can perform. This chapter covers these options and the modes in which you operate
    in further detail. You will also become familiar with examples of both ARCHIVELOG
    mode and NOARCHIVELOG mode media recoveries using both user-managed and RMAN methods
    of recovery. In addition to this detailed discussion of recovery methods, you
    will also look at recovery situations in which the relocation of files is required,
    and you will learn how to handle read-only tablespace recovery in different situations.


    Media recoveries are critical tasks in the testing process and workplace. How
    media recovery situations are handled depends on the DBA performing the recovery.
    You can improve your ability to perform such recoveries by testing various media
    recovery situations so that you have a degree of confidence. As a result of this
    practice, when you need to perform a media recovery, your uncertainties will be
    significantly reduced. Testing recovery situations will also prepare you for the
    real-life situations that you will experience as a DBA.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Defining Media Recovery


    Media recovery is a type of recovery used for recovering any currently used data
    file, control file, or online redo log file that becomes unavailable. The data
    file or control file may become unavailable for a number of reasons—it may have
    been lost, deleted, or moved from its original location, or it may have been damaged
    by data corruption or a hardware failure. All of these situations result in the
    Oracle database not being able to read or write to this.


    When a situation requiring media recovery occurs, the DBA must restore the unavailable
    file or files. If the database is in ARCHIVELOG mode, you must recover these files
    by applying archived logs to the restored files. This will make the restored files
    current as the rest of the database files.


    # Recovering Using NOARCHIVELOG and ARCHIVELOG Modes


    One of the most significant backup and recovery decisions a DBA can make to operate
    in ARCHIVELOG mode or NOARCHIVELOG mode. The outcome of this decision dramatically
    affects the backup and recovery options.


    When the database is in ARCHIVELOG mode, it generates historical changes in the
    form of offline redo logs, or archived logs. This is, the database doesn''t write
    over the online redo logs until a copy is made, and this copy is called an offline
    redo log, or archived log. These logs can be applied to backups of the data files
    to recover the database up to the point of failure. Figure 10.1 illustrates complete
    recovery in ARCHIVELOG mode.


    When the database is in NOARCHIVELOG mode, it does not generate historical changes;
    as a result, there is no archive logging. The database writes over the online
    redo logs without creating an archived log. Thus, no historical information is
    generated and saved for later use. Figure 10.2 illustrates recovery in NOARCHIVELOG
    mode. Even though this is called a complete recovery, the recovery process will
    be missing transactions because you are not generating archived logs to be applied
    in the recovery process.'
