  md: '# Glossary 481


    # M


    **manual archiving** The execution of commands to create archived logs. Archived
    logs are not automatically created after redo log switching.


    **manual channel allocation** This type of channel allocation is performed any
    time you issue the command ALLOCATE CHANNEL. A manual command for allocating a
    channel is ALLOCATE CHANNEL <channel1 name> TYPE DISK.


    **mean time to recovery (MTTR)** The mean (average) time needed to recover a database
    from a certain type of failure.


    **media (disk) failure** A physical disk failure, or one that occurs when the
    database files cannot be accessed by the instance.


    **media management library (MML) or Media Management Layer** A tape media library
    that allows RMAN to interface with a hardware vendor''s tape backup device. Also
    referred to as Media Management Layer.


    **media recovery** Recovery operation that results from a media (disk) failure.


    **middleware** Software and hardware that sits between a client and the Oracle
    server. Middleware can serve a variety of functions such as load balancing, security,
    and application-specific business logic processing.


    **MML** See *media management library (MML)*.


    **MTTR** See *mean time to recovery (MTTR)*.


    **multiplexing** Oracle''s mechanism for writing to more than one copy of the
    redo log or control file. This process involves mirroring, or making duplicate
    copies. Multiplexing ensures that if you lose one member of the redo group or
    one control file, you can recover using the other. It intersperses blocks from
    Oracle data files within a backup set.


