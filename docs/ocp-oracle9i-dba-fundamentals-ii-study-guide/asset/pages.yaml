    # Generating Lists and Reports from the Recovery Catalog


    RMAN has two types of commands (list and report) that you can use to access the
    recovery catalog so that you can list the status of what you need to back up,
    copy, or restore, as well as general information about your target database. Each
    of these commands is performed within the RMAN utility.


    # Using List Commands


    List commands query the recovery catalog or control file to determine which backups
    or copies are available. These commands provide the most basic information from
    the recovery catalog. The information generated is mainly what has been done up
    to this point in time; from this, you determine what is available or not available.


    There are some new features and capabilities that have been added to the list
    commands in the RMAN version that is compatible with Oracle9i. These'
  merge: -1
  pgno: 460
- img_proc: true
  md: '# 400 Chapter 13 · Recovery Catalog Creation and Maintenance


