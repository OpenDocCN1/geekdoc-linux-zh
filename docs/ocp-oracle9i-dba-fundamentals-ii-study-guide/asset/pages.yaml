    # The Components of Recovery Catalog


    The main components of the RMAN recovery catalog support the logging of the backup
    and recovery information in the catalog. This information is stored within tables,
    views, and other databases objects an Oracle database. Backups are compressed
    for optimal storage. Here is a list of the components contained in a recovery
    catalog:


    +   - Backup and recovery information that is logged for long-term use from the
    target databases

    - RMAN scripts that can be stored and reused

    - Backup information about data files and archived logs

    - Information about the physical makeup, or schema, of the target database'
  merge: -1
