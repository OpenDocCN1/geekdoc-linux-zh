  md: '# Choose the Hostname and the Port


    This step will vary depending on the protocol you chose in the previous step.
    If TCP/IP was chosen, you are prompted for the hostname and the port number. The
    hostname is the name of the machine on which the listener process is running.
    The port number is the listening location for the listener. The default port is
    1521 (see 3.7).


    FIGURE 3.7 Oracle Net Manager Hostname and Port Number screen


    ![](img/a183fd041839741f5ab6df3caffc6b52_161_0.png)


    # Choose the Service Name


    The next step is to define the service name. For Oracle9i, the service name does
    not have to be the same as the ORACLE_SID because a database can have multiple
    service names defined for it. In Oracle9i, the service name is not necessarily
    the same as the global database name. This is the service name that is supplied
    to the listener, so the listener has to be listening for this service. You can
    also choose whether this is for Oracle8i or later databases or Oracle8 and previous
    databases.. is also a choice that allows you to select the connection type from
    one of these choices: Database Default, Shared Server, and Dedicated Server. Figure
    3.8 shows an example of the Oracle Net Manager Service Name screen.'
