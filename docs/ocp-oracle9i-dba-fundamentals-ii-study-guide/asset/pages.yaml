- img_proc: true
  md: 'There are seven layers in the OSI model, and each layer is responsible for
    some aspect of network communication. The upper layers of the model handle responsibilities
    such as communicating with the application and presenting data. The lower layers
    are responsible for transporting data across the network. The upper layers pass
    information, such as the destination of the data and how the data should be handled,
    to the lower layers. The lower layers communicate status information back to the
    upper layers. Table 1.1 shows the layers of the OSI model and the responsibilities
    each has in order for communications a network to be executed. As you can see
    from this table, this layered approach allows for a separation of responsibilities.
    It also allows for the separation of the logical aspects of network communications,
    such as presentation and data management, from the physical aspects of communications,
    such as the physical transmission of bits across a network.


    # TABLE 1.1 The Layers of the OSI Model


    | OSI Layer | Responsibilities |

    |---|---|n| Application Layer | Interacts with the application. Accepts commands
    and returns data. |

    | Presentation Layer | Settles data differences between client and server. Also
    responsible for data format. |

    | Session Layer | Manages network traffic flow. Determines whether data is being
    sent or received. |

    | Transport Layer | Handles interaction of the network processes on the source
    and destination. Error correction and detection occurs here. |

    | Network Layer | Delivers data between nodes. |

    | Data Link Layer | Maintains connection reliability and retransmission functionality.
    |

    | Physical Layer | Transmits electrical signals across the network. |'
  merge: -1
