- img_proc: true
  md: '# 14 Chapter 1 · Introduction to Network Administration


    are used to control network traffic and prevent intruders from compromising corporate
    network security. Firewalls fall into two broad categories:


    IP-filtering firewalls IP-filtering firewalls monitor the network packet traffic
    on IP networks and filter out packets that either originated or did not originate
    from specific groups of machines. The information contained in the IP packet header
    is interrogated to obtain this information. Vendors of this type of firewall include
    Network Associates and Axent Communications.


    Proxy-based firewalls Proxy-based firewalls prevent information from outside the
    firewall from flowing directly into the corporate network. Instead, the firewall
    acts as a gatekeeper, inspecting packets and sending only the appropriate information
    through to the corporate network. This prevents any direct communication between
    clients and inside the firewall. Check Point Software Technologies and Cisco are
    examples of vendors that market proxy-based firewalls.


    Oracle works closely with the vendors of both types of product to ensure support
    of database traffic through these types of mechanism. Oracle supplies the Net
    Application Proxy Kit to the vendors of firewalls. This product can be incorporated
    into the firewall architecture to allow databases to pass through the firewall
    and still maintain a high degree of security.


    # Real World Scenario


