  md: '# 42 Chapter 2 · Configuring Oracle Net on the Server


    # FIGURE 2.3 Oracle Net Configuration Assistant opening screen


    ![](img/a183fd041839741f5ab6df3caffc6b52_103_0.png)


    The Oracle Net Configuration Assistant is meant to be an easy, wizard-based tool
    that you can use to conduct a basic setup for both client- and server-side network
    products.


    Static service registration occurs when entries are added to the listener.ora
    file manually by using the Oracle Net Assistant. It is static because you are
    adding this information manually. Static service registration is necessary if
    you will be connecting to pre-Oracle8 instances using Oracle Enterprise Manager
    or you will be connecting to external services.

    There is another method of managing listeners that does not require the manual
    updating of service information in the listener.ora file. This is called dynamic
    service registration. Dynamic service registration is a feature that allows an
    Oracle instance to automatically register itself with an Oracle listener. The
    benefit of this feature is that it does not require the DBA to perform any updates
    of server-side network files when new Oracle instances are created. Dynamic service
    registration will be covered in more detail in the chapter entitled “Dynamic Registration
    of Services” later in this chapter.'
