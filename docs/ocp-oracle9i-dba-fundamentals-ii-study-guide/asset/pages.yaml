  md: '![](img/a183fd041839741f5ab6df3caffc6b52_239_0.png)


    Oracle uses a wide variety of processes and structures to provide a robust set
    of recovery options. A process is a daemon, or background program, that performs
    certain tasks. A structure is either a physical or logical object that is part
    of the database, such as files or database objects.


    The processes consist of log writer (LGWR), system monitor (SMON), process monitor
    (PMON), checkpoint (CKPT), and archiver (ARCn). The available structures include
    redo logs, rollback segments, control files, and data files. You were introduced
    to these terms in Chapter 5, “Backup and Recovery Overview.” This chapter provides
    further detail, including how different combinations of these processes and structures
    are used to recover from different kinds of failures.


    This chapter also introduces methods you can use to tune instance recovery, including
    the ability to set approximate limits on the length of time needed to recover
    from instance failure. We will discuss and provide examples of these methods.


    In order to understand the backup and recovery process, you must understand processes
    and structures. This knowledge will help you, the DBA, make real-life decisions
    about backup and recovery situations. For example, if you understand how the database
    physical structures synchronized, you will be able to make sense of the recovery
    process. If you truly understand how processes and structures interact with backup
    and recovery procedures, you are on the road to having a solid understanding of
    the backup and recovery process.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# Oracle Recovery Processes, Memory Components, and File Structures


    Oracle recovery processes, memory components, and file structures all work together
    during recovery in order to maintain the physical integrity of the database. Oracle
    recovery processes interact with Oracle memory components to coordinate data blocks
    that are written to disk. These blocks of data reside in memory for faster access
    at different times of operations. These memory structures change, coordination
    with the physical and logical structures occurs so that the database can remain
    consistent.


    Basically, recovery processes coordinate what blocks (and other information) need
    to be read (or modified from the data blocks in memory) and then written to disk
    or to the physical and logical structures in the form of online redo logs, archived
    logs, or data files. Each process has specific tasks that it fulfills.


    These physical and logical structures are like memory structures that they are
    made of data blocks. The physical structures are static structures that consist
    of files in the OS system. Data blocks and other information are written to these
    physical structures to make them consistent. The logical structures are temporarily
    used to hold parts of information for intermediate time periods, or until the
    processes can permanently record the appropriate information in the physical structures.


    # Recovery Processes


    Oracle has five major processes related to recovery. These processes include log
    writer, system monitor, process manager, checkpoint, and archiver. Let''s look
    at each of these processes in more detail.


    Log writer (LGWR) The log writer (LGWR) writes redo log entries from the redo
    buffers. A redo log entry is any change, or transaction, that has been applied
    to the database, committed or not. (To commit save or permanently store the results
    of the transaction to the database.) The LGWR process is mandatory and is started
    by default when the database is started.


    System monitor (SMON) The system monitor (SMON) process performs a varied set
    of functions. SMON is responsible for instance recovery, and it also performs
    temporary segment cleanup. It is a mandatory process and is started by default
    when the database is started.'
  merge: -1
  pgno: 240
- img_proc: true
  md: 'Process monitor (PMON) The process monitor (PMON) performs recovery of failed
    user processes. This is a mandatory process and is started by default when the
    database is started.


    Checkpoint (CKPT) The checkpoint (CKPT) process performs checkpointing in the
    control files and data files. Checkpointing is the process of stamping a unique
    counter in the control files and data files for database consistency and synchronization.
    In Oracle7, the LGWR would perform checkpointing if the CKPT process was not present.
    As of Oracle8, however, the CKPT process was made mandatory and started by default.
    This is continued in Oracle9i.


    Archiver (ARCn) The archiver (ARCn) process performs the copying of the online
    redo logs to archived files. The ARCn process is enabled only if the init.ora
    file''s parameter LOG_ARCHIVE_START is set to TRUE or with the ARCH LOG start
    command. This isn''t a mandatory process.


    In the Windows 2000/XP environments, the processes are threads of the main Oracle
    executable. In the Unix environment, an example of each of these processes can
    be seen by typing the Unix command ps -ef | grep <ORACLE_SID>. $ORACLE_SID is
    a environment variable that identifies the Oracle identifier. In this case, $ORACLE_SID
    is orc9


    ```

    oracle@octilli:\> ps -ef| grep orc9

    oracle 2077 1 0 00:26 ? 00:00:00 ora_pmon_orc9

    oracle 2079 1 0 00:26 ? 00:00:00 ora_dbw_orc9

    oracle 2081 1 0 00:26 ? 00:00:00 ora_lgwr_orc9

    oracle 2083 1 0 00:26 ? 00:00:00 ora_ckpt_orc9

    oracle 2085 1 0 00:26 ? 00:00:00 ora_smon_orc9

    oracle 2087 1 0 00:26 ? 00:00:00 ora_reco_orc9

    oracle 2097 1 0 00:26 ? 00:00:00 ora_arc0_orc9

    ```


    # Memory Structures


    There are two Oracle memory structures relating to recovery: log buffers and data
    block buffers. The log buffers are the memory buffers that record the changes,
    or transactions, to data blocks before they are written to online redo logs or
    disk. Online redo logs record all changes to the database, whether the transactions
    are committed or rolled back.


    The data block buffers are the memory buffers that store all the database information.
    A data block buffer stores mainly data that needs to be queried,'
