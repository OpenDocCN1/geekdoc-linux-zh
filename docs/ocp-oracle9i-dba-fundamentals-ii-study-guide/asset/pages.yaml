    ![](img/a183fd041839741f5ab6df3caffc6b52_326_0.png)


    RMAN backups called by Media Management vendor''s software are conducted in the
    background, they tend to be forgotten. Another reason these backups may be forgotten
    is because rather than the DBA conducting them, backup-related tasks may be executed
    and controlled by the backup coordinator, who may reside within the systems administrators.
    As a result, when the backup terminates for some reason, you may not know it,
    unless you have good communication set. As a result, the backup may terminate
    in such a way that it leaves the database partially in backup mode with some tablespaces
    and the associated data files active, or it leaves jobs incomplete and hanging
    in the recovery catalog.


    What happens when the database goes down when a tablespace is in backup mode?
    If this happens, the data file is not checkpointed so that it is consistent with
    the rest of the database. Therefore, when the database is restarted, the data
    file is marked as inconsistent and in need of recovery. This situation can come
    as an unwanted surprise when you are bouncing the database for some reason.


