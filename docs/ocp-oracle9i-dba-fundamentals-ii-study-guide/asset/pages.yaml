  md: '# Defining a Backup and Recovery Strategy


    Oracle LogMiner was first introduced in Oracle8/8i. This utility rebuild data
    from redo log-generated transactions. LogMiner allows you to rebuild erroneously
    dropped tables by performing a series of steps that include building an external
    data dictionary and identifying the transactions that must be reloaded. LogMiner
    is run by using Procedural Language SQL (PL/SQL) procedures to build the LogMiner
    utility. Table 5.1 describes the PL/SQL procedures involved with using LogMiner.
    The Data Manipulation Language (DML) can be in the v$logmnr_contents table after
    the PL/SQL procedures have been executed.


    # TABLE 5.1 LogMiner PL/SQL Procedures


    | PL/SQL Procedure | Purpose |

    |---|---|

    | sys.dbms_logmnr_d.build | Builds data dictionary |

    | dbms_logmnr.add_logfile | Accesses desired redo log file |

    | dbms_logmnr.start_logmnr | Begins using LogMiner session |


    Oracle Flashback Query is a new feature to Oracle9i. This feature allows a user
    to access past versions of dictionary tables. This feature works by generating
    a picture of data as it was in the past by using undo data. This is performed
    by identifying all data that has been modified since once was created and retained
    against the retention policy. Then the corresponding undo data retrieved.


    The Flashback Query feature is performed by executing the PL/SQL dbms_flashback
    package. Further, Automatic Undo Management must be enabled by setting the init.ora
    file to UNDO_MANAGEMENT = AUTO parameter. There must be an undo tablespace designated,
    such as UNDO_TABLESPACE = UNDOTS. This must be set in the init.ora before the
    Flashback Query can be used. The parameter that controls the length of retention
    of the Flashback Query is called UNDO_RETENTION. This parameter may be set with
    UNDO_RETENTION = n with n being an integer value in.


    > NOTE Flashback Query cannot query data that is greater than five days old. This
    is true even if the UNDO_RETENTION parameter is set to a value greater than five
    days old.'
  merge: -1
