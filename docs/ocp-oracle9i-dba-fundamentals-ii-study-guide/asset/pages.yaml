  md: '# Testing a Backup and Recovery Plan


    One way you can test recovery is to create a new development or testing environment
    and recover the database to a development or test server in support of a new software
    release. Databases are often necessary to support new releases of the database
    and application code prior to moving it to production. RMAN provides the DUPLICATE
    command in support of this. Manual OS tools in Linux, using ufsrestore, tar, and
