  md: 'Advanced Networking Option/Network Security products linked with oracle are:


    # Oracle Security server Authentication Adapter


    If the required protocol adapter is not listed, you have to install the adapter.
    This can be done by using the Oracle Installer, installing the Oracle Net Server
    software, and choosing the appropriate adapters during the installation process.


    # Check for Connection Timeouts


    If the client is receiving an ORA-12535 or an ORA-12547 error, the client is timing
    out before a valid connection is established. This can occur if you have a slow
    network connection. You can attempt to solve this problem by increasing the time
    that the listener will wait for a valid response from the client; simply set the
    CONNECT_TIMEOUT parameter to a higher number. This is the number of seconds the
    listener waits for a valid response from the client when establishing a connection.


    # Oracle Net Logging and Tracing on the Server


    If a network problem persists, you can use logging and tracing to help resolve
    it. Oracle generates information into log files and trace files that can assist
    you in tracking down network connection problems. You can use logging to find
    out general information about the success or failure of certain components of
    the Oracle Network. Tracing can be used to get in-depth information about specific
    network connections.


    ![](img/a183fd041839741f5ab6df3caffc6b52_131_0.png)


    By default, Oracle produces logs for clients and the Oracle listener. Client logging
    cannot be disabled.


    Logging records significant events, such as starting and stopping the listener,
    along with certain kinds of network errors. Errors are generated in the log in
    the form of an error stack. The listener log records information such as the version
    number, connection attempts, and the protocols it is listening for. Logging can
    be enabled at the client, middle tier, and server locations.'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# Oracle Net Logging and Tracing on the Server


    Tracing, which you can also enable at the client, middle-tier, or server location,
    records all events that occur on a network, even when an error does not happen.
    The trace file provides a great deal of information that logs do not, such as
    the number of network round trips during network connection or the number of packets
    sent and received during a network connection. Tracing enables you to collect
    a thorough listing of the actual sequence of the statements as a network connection
    is being processed. This gives you a much more detailed picture of what is occurring
    with connections the listener is processing.


    # Real World Scenario


    # Use Tracing Sparingly


    Tracing should be used only as a last resort if you are having connectivity problems
    between the client and server. You should complete all of the server-side checks
    described above before you resort to tracing. This is because the trace process
    generates a significant amount of overhead, and depending on the trace level set,
    it can create very large files. This activity will impede system I/O performance
    because of all of the information that is written to the logs, and if left unchecked,
    it could fill up your disk or filesystem.


    I was once involved with a large project that was using JDBC to connect to the
    Oracle server. We were having difficulty with connections being periodically dropped
    between the JDBC client and the Oracle server. Tracing was enabled to try to assist
    in figuring out what the problem was. We eventually encountered a problem with
    our DNS server was configured, but the tracing was left on inadvertently. When
    we eventually went into production, the trace files grew so large that they filled
    up the disk where tracing was being collected. To prevent this from happening,
    it is important to periodically ensure that the trace parameters are not turned
    on, and if they are, they should be turned off.


    Use the Oracle Net Manager to enable most logging and tracing parameters. Many
    of the logging and tracing parameters are found in the sqlnet.ora file. Let''s
    take a look at how to enable logging and tracing for the various components in
    an Oracle Network.


    ![](img/a183fd041839741f5ab6df3caffc6b52_132_0.png)'
  merge: -1
  pgno: 132
- img_proc: true
  md: '# Server Logging


    By default, the listener is configured to enable the generation of a log file.
    The log file records information about listener startup, successful and unsuccessful
    connection attempts, and certain types of network errors. By default, the listener
    location is %ORACLE_HOME\network/log on Unix and %ORACLE_HOME\network\log on Windows
    NT/2000. The default name of the file is listener. log.


    The format of the information in the listener log is a fixed-length, delimited
    format with each field separated by an asterisk. If you want to do further analysis
    of the information in the log, the data in the log can be loaded into an Oracle
    table using a tool like SQL*. Notice in the sample listing below that the file
    contains information about connection attempts, the name of the program executing
    the request, and the name of the client attempting to connect the network. The
    last field will contain a zero if a request was successfully completed.


