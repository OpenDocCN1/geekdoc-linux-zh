- img_proc: true
  md: 'connectivity. These components enable a DBA to automate and standardize the
    backup and recovery process. Each component is described below:


    **GUI or command-line access method** This method provides access to Recovery
    Manager, which in turn provides access to RMAN. The GUI method spawns off of server
    sessions that connect to the target database—the database through RMAN for backup
    or recovery actions. GUI access is provided through the Oracle Enterprise Manager
    (OEM) tool, which is a DBA tool that performs backups, imports/exports, data loads,
    performance monitoring/tuning, job and event scheduling, and stands management,
    to mention a few. Command-line access can be run in a standard Unix Telnet or
    X Windows session as well as in a DOS shell in the Windows environment.


    **Optional recovery catalog** This special dictionary of backup information is
    stored in a set of tables, in the same way that the dictionary stores information
    about databases. The recovery catalog provides a method for storing information
    about backups, restores, and recoveries. This information provides status updates
    on the success or failure of backups, the OS backup, data file copies, tablespaces,
    control files, archived log copies, full database backups, and the physical structures
    of a database.


    **RMAN commands** These commands enable different actions to be performed that
    facilitate the backup and restoration of the database. These commands can be organized
    logically into scripts, which can then be stored in the recovery catalog database.
    The scripts are used for other backups, keeping consistency among different target
    database backups.


    **Tape media connectivity** This component provides a method for interfacing with
    varying third-party tape hardware vendors to store and track backups in automated
    tape libraries (ATLs). An ATL is a large tape cabinet that stores many tapes and
    can write multiple tapes at the same time to improve performance. ATLs use robotic
    arms to load, unload, and store tapes. By default, Oracle provides media management
    libraries (MML) for the Legato Storage Management (LSM) software, which manages
    an ATL device.


    Figure 8.2 shows an example of how the RMAN utilities'' components fit together
    to form a complete backup and recovery package.'
