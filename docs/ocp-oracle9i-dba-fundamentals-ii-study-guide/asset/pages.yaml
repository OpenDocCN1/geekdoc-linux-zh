    # Storing Information Using the RMAN Repository and Control Files


    The RMAN utility uses two methods to store information about the target databases
    that are backed up. Each method is called the RMAN repository. When RMAN uses
    the first method, it accesses an optional RMAN catalog or recovery catalog of
    information about backups. In the second method, it accesses the necessary information
    about backups in the target database''s control file. If the optional recovery
    catalog database is not used, then the target database''s control file will be
    used as the RMAN repository. The information that RMAN needs to function in the
    recovery catalog database'
  merge: -1
  pgno: 293
- img_proc: true
  md: '# Storing Information Using the RMAN Repository and Control Files 233


    or in the target database''s control file is also called the RMAN repository.
    The target database''s control is always updated, whether the catalog is used
    or not. In the next paragraph, we will discuss the recovery catalog as the RMAN
    repository for storing information, and then we will list the commands we can
    use in this method. Following this list, we will focus on using the control file
    as the RMAN repository.


    Oracle recommends that you store RMAN backup data in the recovery catalog database
    as opposed to in the control file of the target database. If you store the data
    in this manner, the RMAN utility will have full functionality. This recovery catalog
    database is another Oracle database that has special RMAN catalog tables that
    store metadata about backups in the database. When this database is used, activities
    such as cross checking backups and available tapes can be performed. Also, using
    this method, backup scripts can be created and stored in the recovery catalog
    for later use. This database can also be backed up so that the information it
    contains is made safe. We will discuss the recovery catalog database in detail
    in Chapter 13, “Recovery Catalog Creation and Maintenance"


    Before we move on to discuss the second method in more detail, take a look at
    these commands. They are allowed only if you use the RMAN recovery catalog as
    the RMAN repository.


    +   - CREATE CATALOG

