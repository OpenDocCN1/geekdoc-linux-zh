    | Parameter | Description |

    |---|---|n| Host | Specifies name of the machine where listener is running. An
    IP address can also be specified in TCP/IP |

    | Port | Specifies listening location of listener specific to TCP/IP protocol.
    |

    | Connect_data | Starts the services section for this service name. |

    | Service_name | Replaces the SID parameter from older releases of Oracle. Defines
