    If you enable ARCHIVELOG mode but forget to enable the automatic archival by not
    editing the init.ora or changing the LOG_ARCHIVE_START to TRUE, the database will
    hang when it gets to the last available redo log. You will need to perform manual
    archiving as a temporary fix or shut down and start up the database after changing
    the LOG_ARCHIVE_START parameter.


    # ## Real World Scenario


    # ### Providing Adequate Space for Archive Logging


    The additional disk space necessary for ARCHIVELOG mode is often overlooked or
    underestimated. For average databases, you should have enough space to keep at
    least one or two days of archived logs online. In order to estimate the correct
    size of these files, you will need to estimate the volume during peak transaction
    volume periods. Peak times are typically when the heaviest transactional activity
    or batch activity occurs.


    This estimated size is multiplied by how many log_archive_dest_locations are set
    up. If you perform nightly hot backups on your system, one or two days of online
    archived logs should meet most of your recovery requirements from the archived
    log perspective.'
  merge: -1
  pgno: 272
- img_proc: true
  md: '> But if the archive process doesn''t have enough disk space to write archived
    logs, the database will hang or stop all activity. This hung state will remain
    until you make more space available by moving older archived logs off your system,
    by compressing log files, or by setting up an automated job that will remove logs
    after they have been written to tape. You must be careful not to displace or delete
    archived logs when trying to free up space for the archive process. Remember these
    archived logs could be required in a recovery situation.


    # Manually Archiving Logs


    The manual archiving of logs consists of enabling the database for ARCHIVELOG
    mode and then manually executing the ARCHIVE LOG ALL command from SQL. The init
    ora parameter LOG_ARCHIVE_START must be set to FALSE to disable automatic archive.
    The next step is to put the database in ARCHIVELOG mode by performing the following
    commands:


    ```

    SQL> shutdown

    SQL> startup mount

    SQL> alter database archivelog;

    SQL> alter database open;

    ```


    Now you are ready to perform manual archiving of redo logs by using


    ```

    SQL> archive log all;

    ```


    or


    ```

    SQL> archive log next;

    ```


    The ARCHIVE LOG ALL command will archive all redo logs available for archiving,
    and the ARCHIVE LOG NEXT command will archive the next group of redo logs.'
  merge: -1
