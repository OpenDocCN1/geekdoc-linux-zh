- img_proc: true
  md: '![](img/a183fd041839741f5ab6df3caffc6b52_263_0.png)


    Configuring an Oracle database for backup and recovery can be complex. At a minimum,
    you must understand the archive process, the initialization parameters associated
    with the archive process, the commands necessary to enable and disable archiving,
    the commands used to manually archive, and the process of initializing automated
    archiving. This chapter provides examples of the backup and recovery configuration
    process. After reading this chapter, you should be comfortable with this process.


    In Chapter 6, "Instance and Media Recovery Structures," you learned about the
    file and memory structures involved with Oracle backup and recovery. Two of these
    structures are covered in more detail within this chapter—specifically, the archive
    process and the archived logs that this process generates.


    The archiver and archived logs are the key components you need for the backup
    and recovery process. Archived logs make it possible for a complete recovery to
    be conducted. In addition, the archiver or archivers are responsible for creating
    archived logs so that they are available in the event of a failure. It is important
    that you understand how to configure the database for archiving and that you need
    to provide multiple copies of archived logs to reduce the damage caused by failure
    situations.


    # # Choosing ARCHIVELOG Mode or NOARCHIVELOG Mode


    One of the most fundamental backup and recovery decisions that a DBA will make
    is whether to operate the database in ARCHIVELOG mode or NOARCHIVELOG mode. As
    you learned earlier, the redo logs record all the transactions that have occurred
    in a database, and the archived logs copies'
  merge: -1
  pgno: 263
- img_proc: true
  md: '# Choosing ARCHIVOG Mode or NOARCHIVOG Mode 203


    of these redo logs. So, the archived logs contain the historical changes, or transactions,
    that occur in the database. Operating in ARCHIVOG mode will generate archived
    logs; operating in NOARCHIVOG mode means that the database will not generate archived
    logs. This section discusses the differences between ARCHIVOG and NOARCHIVOG mode.


    # ARCHIVOG Mode


    In ARCHIVOG mode, the database generates archived log files from the redo logs.
    This means the database makes copies of all the historical transactions that have
    occurred in the database. There are here other characteristics of operating in
    ARCHIVOG mode:


    +   Performing online (hot) backups is possible. This type of backup is done when
    the database is up and running. Therefore, a service outage is not necessary to
    perform a backup. The ALTER TABLESPACE<TABLESPACE_NAME> BEGIN BACKUP command is
    issued to perform hot backups. After this command is issued, an OS copy can take
    place on each tablespace''s associated data files. When the ALTER TABLESPACE<TABLESPACE_NAME>
    END BACKUP command must be used. These commands must be executed for every tablespace
    in the database.


    +   A complete recovery can be performed. This is possible because the archived
    logs contain all the changes up to the point of failure. All logs can be applied
    to a backup copy of the database (hot or cold backup). This would apply to all
    the transactions up to the time of failure. Thus, there would no data loss or
    missing transactions.


    +   Tablespaces can be taken offline immediately.


    +   Increased disk space is required to store archived logs, and increased maintenance
    is associated with maintaining this disk space.


    # NOARCHIVOG Mode


    In NOARCHIVOG mode, the database does not generate archived log files from the
    redo logs. This means that the database is not storing any historical transactions
    from such logs. Instead, the redo logs are written over each other as needed by
    Oracle. As a result, only the transactions can be'
  merge: -1
  pgno: 264
- img_proc: true
  md: 'used in the event of instance failure are in the current redo logs. Operating
    in NOARCHIVELOG mode has the following characteristics:


    +   - In some cases, a complete restore cannot be performed. This means that a
    loss of data will occur. The last cold backup will be needed to use recovery.

    - The database must be shut down completely for a backup, which means the database
    will be unavailable to the users of the database during that time. This means
    that only a cold backup can be performed.

    - Tablespaces cannot be taken offline immediately.

    - Additional disk space and maintenance is not needed to reduce archived logs.


    # Understanding Recovery Implications of NOARCHIVELOG


    The recovery implications associated with operating a database in NOARCHIVELOG
    mode are important. A loss of data usually occurs when the last consistent full
    backup is used for a recovery. To reduce the amount of data lost in the event
    of a failure, frequent cold backups need to be performed. This means that the
    database could be unavailable to users on a regular basis.


    Now that you are familiar with the problems associated with this mode, let''s
    look at examples of when it would not make sense to use NOARCHIVELOG mode and
    when it would.


    Imagine that Manufacturing Company A''s database must be available for 24 hours
    a day to support three shifts of work. This work consists of entering orders,
    bills of lading, shipping instructions, and inventory adjustments. The shifts
    are as follows: day shift, 9 A.M. to 5 P.M.; swing shift, 5 P.M. to 1 A.M.; and
    night shift, 1 A.M. to 9 A.M. If this database is shut down for a cold backup
    from midnight to 2 A.M., then the night shift and swing shift would be unable
    to use it during that period. As a result, a NOARCHIVELOG backup strategy would
    not be workable for Manufacturing Company.


    On the other hand, if Manufacturing Company B''s database must be available only
    during the day shift, from 9 A.M. to 5 P.M., then backups could be performed after
    5 P.M. and before 9 A.M. without affecting users. Thus, the DBA could schedule
    the database to shut down at midnight and perform'
  merge: -1
  pgno: 265
- img_proc: true
  md: '# Configuring a Database for ARCHIVELOG Mode and Automatic Archiving 25


    the backup for two hours. The database would be restarted before 9 A.M., and there
    would be no interference with the users'' work. In the event of a failure, there
    would be a backup from each evening, and only a maximum of one day''s worth of
    data would be lost. If one day''s worth of data loss was acceptable, this would
    be a workable backup and recovery strategy for Manufacturing Company B.


    These examples show that in some situations, operating in ARCHIVELOG mode makes
    sense. But there are recovery implications that from this choice. One implication
    is that a loss of data will occur in the event of a failure. Also, there are limited
    choices on how to recover. The choice is usually to restore the whole database
    from the last consistent backup while the database was shut down (cold backup).


    # Configuring a Database for ARCHIVELOG Mode and Automatic Archiving


    Once the determination has been made to run the database in ARCHIVELOG mode, the
    database will need to be configured properly. You can do this to a new database
    during database creation or to an existing database via Oracle commands. After
    the database is in ARCHIVELOG mode, you will most likely configure automatic archiving.
    Automatic archiving frees the DBA from the manual task of archiving logs with
    commands before the online redo logs perform a complete cycle.


    # Setting ARCHIVELOG Mode


    ARCHIVELOG mode can be set during the database creation or by using the ALTER
    DATABASE ARCHIVELOG command. The database must be mounted, but not open, in order
    to execute this command. This command stays in force until it is turned off by
    using the ALTER DATABASE NOARCHIVELOG command. The database must be mounted, but
    not open, in order to execute this command as well.


    The redo log files will be archived to the location specified by the LOG_ARCHIVE_DEST
    parameter in init.ora file. By default, the database is in manual archiving mode.
    This means that as the redo logs become full, the database issues the ARCHIVE
    LOG ALL command, which archives all the online redo logs not yet archived. Figure
    7.1 shows a database configured for ARCHIVELOG mode.'
  merge: -1
  pgno: 266
