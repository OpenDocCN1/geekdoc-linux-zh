    # Conclusions


    The most notable observation about this scenario is that when the database is
    in NOARCHIVOG mode, data is lost. All data entered after the backup, before the
    failure, is lost and must be reentered. To recover it, you will have to shut down
    the database. Furthermore, you must restore the whole data-base instead of just
    the one file that was lost or removed, which could increase the recovery time.


    # Performing User-Managed Complete Recovery in ARCHIVELOG Mode


    In this example, the database is completely recovered because it is in ARCHIVELOG
    mode. This database is available 24 hours a day, 7 days a week, with the exception
    of scheduled maintenance periods. Every morning 1 A.M., a hot backup is performed.
    The data files, archived logs, control files, backup control files and 1inf.ora
    files are copied to a staging directory, and from there, they are then copied
    to tape. Copy also remains on the disk until the next morning, when the hot backup
    runs again. This allows for quick access in the event of failure. When the backup
    runs again, the staging directory is purged and rewritten.


    # Diagnosing the Failure


    On Wednesday morning, there is a lost or deleted data file in the database. The
    error received upon startup is as follows:


    ```

    SQL> startup

    ORACLE instance started.

    ```'
