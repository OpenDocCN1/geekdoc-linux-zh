  md: '# Acknowledgments


    First, I want to thank the Lord, my savior, for making this all possible.

    Thanks to Mae, Elizabeth, and Richard for direction and guidance throughout the
    writing of this book. Rebecca for your hard work, edits, and suggestions, which
    greatly improved this book and made my job much easier. John Anwanwan and Damir
    Bersinic for your technical edits and reviews, which enhanced the quality of this
    writing, tremendously. I want to give a bated thanks to the Hobbs family for getting
    me involved initially.


    Finally, I want to thank my wife and family for supporting me throughout this
    process. Thanks for providing me the time to work on this book. I know this was
