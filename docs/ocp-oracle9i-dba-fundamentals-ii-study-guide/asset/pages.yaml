  md: '+   11. A, C, D. There are three RMAN change options: LOGSEQ, SEQUENCE, and
    SCN. These are used with the SET UNTIL command.


    +   12. C. The user-managed recovery of a database will be performed with the
    RECOVER DATABASE UNTIL TIME ''OCT 04 2001 15:00:00'' command.


    +   13. D. A corrupt current online redo will force an incomplete recovery because
    the transactions in that log will not be applied to the recovery process, and
    the database will need to be stopped before complete recovery by time, change,
    or cancel commands.


    +   14. C. The ALTER DATABASE OPEN RESETLOGS command must be performed with all
    incomplete recoveries but it does not have to be performed with complete recoveries.


