- img_proc: true
  md: 'Media failure requires database recovery. If the database is in ARCHILOG mode,
    complete recovery can be performed. This means a backup can be restored to the
    affected filesystem, and archived logs can be applied up to the point of failure.
    Thus, no data is lost.


    If the database is in NOARCHIVOG mode, recovery cannot be performed without some
    transactions being lost. This means a backup can be restored to the affected filesystem,
    but there won''t be any archived logs or historical changes saved. Thus, the database
    will have only the transactions that were available at the time of the backup.
    If backups were scheduled every night, the business would lose only one day''s
    worth of transactions. If backups were scheduled weekly, on the other hand, the
    business would lose one week''s worth of transactions. The end result is that,
    in all cases, some data will be lost. This is a complete recovery of the database
    but does not contain all the transactions to the failure point. The end result
    is that the database will be similar to an incomplete recovery, which will be
    covered in Chapter 11, "User-Managed and RMAN-Based Incomplete Recovery.". The
    differences are an incomplete recovery intentionally stopped before all the transactions
    are applied to the database, and an incomplete recovery requires the database
    to be in ARCHILOG mode and some other specific actions to be performed.


    # Performing User-Managed Recovery in NOARCHIVOG Mode


    This is an example of a user-managed recovery when the database is in NOARCHIVOG
    mode. In this case, the database cannot be completely recovered. The database
    is available all day during the week. Every Saturday, the database is shut down,
    and a complete, cold backup (offline backup) is performed. The database is restarted
    when this activity is completed.


    # Diagnosing the Failure


    On Wednesday morning, there is a lost or deleted data file in the database. The
    error received upon startup is as follows:


    ```

    SQL> startup

    ORACLE instance started.

    ```


    | Total System Global Area | 19504528 bytes |

    | Fixed Size | 64912 bytes |

    | Variable Size | 16908288 bytes |

    | Database Buffers | 24576000 bytes |

    | Redo Buffers | 73728 bytes |'
