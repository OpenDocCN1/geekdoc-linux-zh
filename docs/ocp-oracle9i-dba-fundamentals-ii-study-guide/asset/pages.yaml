  md: '# Chapter 2 · Configuring Oracle Net on the Server


    Two init_ora parameters need to be configured to allow an instance to register
    information with the listener. There are two parameters used to allow automatic
    registration, INSTANCE_NAME and SERVICE_NAMES. The INSTANCE_NAME parameter is
    set to the name of the Oracle instance you would like to register with the listener.
    The SERVICE_NAMES parameter is a combination of the instance name and the domain
    name. The domain name is set to the value of the DB_DOMAIN initialization parameter.
    For example, if your DB_DOMAIN is set to GR.COM and your Oracle instance was DBA,
    parameters will be set as follows:


    ```

    Instance_name = DBA

    Service_names = DBA.GR.COM

    ```


    If you are not using domain names, the INSTANCE_NAME and SERVICE_NAMES parameters
    should be set to the same values.


    # Configure the Listener for Oracle9i JVM


    You can configure the Oracle Net services to respond to requests to the Oracle9i
    Java Virtual Machine (JVM) over TCP/IP or TCP/IP with Secure Sockets Layer (SSL).
    The Java Virtual Machines run within the Oracle server. Client processes interact
    with processes that run within the JVM server directly over HTTP or Internet-ORB
    Protocol (IIOP).


    If you are using pre-Oracle 8.1 instances with addresses must be configured manually
    as outlined below. If you are using Oracle9i databases and listeners, dynamic
    registration would take care of registering these services with the listener.


    The steps to add the service name information are as follows:


    +   1. Start the Oracle Net Manager.

    2. Choose Local and Listener.

    3. Select a listener and then choose Listening Locations from the drop-downs on
    the right-hand panel.

    4. Choose Add Address.

    5. Select TCP/IP or TCP/IP With SSL.

    6. Enter a hostname in the database host field.'
