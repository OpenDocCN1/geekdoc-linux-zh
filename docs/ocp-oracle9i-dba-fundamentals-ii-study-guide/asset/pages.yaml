- img_proc: true
  md: '# Troubleshooting Client-Side Connection Problems 107


    # Look for Multiple Network Configuration Files


    Make sure that all copies of these files are identical. Normally there should
    be only one copy of the client-side networking files like tnsnames.ora and sqlnet.ora.
    In some situations, such as when you are using other Oracle tools (like Oracle
    Developer), these products get installed on a client in a separate ORACLE_HOME
    directory and have their own copies of the network files. This can make it necessary
    for a client to have more than one of the networking files.


    # Check Network File Locations


    One of the most common problems I have encountered is clients moving files and
    not setting the TNS_ADMIN environmental variable to the new file location. Oracle
    expects the tnsnames.ora and sqlnet.ora to be in the default location. If it cannot
    locate the files and you have not set TNS_ADMIN, you receive an ORA-12154 error.
    Below is an example of this error. You also receive this error if the supplied
    service name is invalid.


    ```

    D:\ORACLE\ORA81\NETWORK\ADMIN>sqlplus system/

    manager@Database Administrator

    ```


    ```

    SQL*Plus: Release 9.0.1.0 - Production on Sat

    Oct 19 21:40:12 2001

    ```


    (c) Copyright 1999 Oracle Corporation. All rights reserved.


    ERROR:

    ORA-12154: TNS:could not resolve service name


    If you decide to move network files, be sure to set the TNS_ADMIN environmental
    variable to the location of the files. Oracle first searches the default location
    for the files and then searches the TNS_ADMIN location for the files.


    # Check NAMES.DIRECTORY_PATH


    Make sure that the client has the proper names resolution setting. The NAMES.DIRECTORY_PATH
    parameter in the sqlnet.ora file controls the'
  merge: -1
