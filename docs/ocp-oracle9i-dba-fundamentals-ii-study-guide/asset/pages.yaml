    and the contents of backup sets (backup pieces and files). This new set of features
    is included in the LIST BACKUP command.


    There are also two new list commands in Oracle9. The first is LIST BACKUP BY FILE.
    This shows the output of the backup sets and copies by file type. The file type
    listings are grouped by data file, archived log, and control file. The second
    command is LIST BACKUP SUMMARY, this causes a summarized version of all RMAN commands
