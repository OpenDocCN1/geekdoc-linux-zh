- img_proc: true
  md: "failure, which is generally more critical in nature—the inability to read or\
    \ write\nfrom a database file.\n\n# Non-Media Failures\n\nThis type of failure\
    \ is made up of statement failures, process failures, instance\nfailures, and\
    \ user errors, and it is almost always less critical than a media fail-\nure.\
    \ In most cases, statement, process, and instance failures are automatically\n\
    handled by Oracle and require no DBA intervention. User error can require\na manual\
    \ recovery performed by the DBA.\n\nStatement failure consists of a syntax error\
    \ in the statement, and Oracle\nusually returns an error number and description.\
    \ Process failure occurs when\nthe user program fails for some reason, such as\
    \ when there is an abnormal\ndconnection or a termination. The process monitor\
    \ (PMON) usually\nhandling cleaning up the terminated process. Instance failure\
    \ occurs when the\ndabase abnormally terminates due to a power spike or outage.\n\
    Oracle handles this automatically upon start-up by reading through the cur-\n\
    rent online redo logs and applying the necessary changes back to the data-\base.\
    \ User error occurs when a table is erroneously dropped or data is\nerroneously\
    \ removed.\n\n# Media, or Disk, Failures\n\nThese failures are the most critical.\
    \ A media failure occurs when the database\nails to read or write from a file\
    \ that it requires. For example, a disk drive could\nfail, a controller supporting\
    \ a disk drive could fail, or a database file could be\nremoved, overwritten,\
    \ or corrupted. Each type of media failure that occurs\nrequires a different method\
    \ for recovery.\n\nThe basic steps you should take to perform media recovery are\
    \ as follows:\n\n+   1. Determine which files will need to be recovered: data\
    \ files, control\nfiles, and/or redo logs.\n2. Determine which type of media recovery\
    \ is required: complete or\nincomplete, opened database, or closed database. (You\
    \ will learn\nmore about these types of recovery in later chapters).\n3. Restore\
    \ backups of the required files: data files, control files, and\noffline redo\
    \ logs (archived logs) necessary to recover."
