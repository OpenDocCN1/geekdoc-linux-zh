    # # File Structures


    The Oracle file structures relating to recovery include the online redo logs,
    archived logs, control files, data files, and parameter files. The redo logs consist
    of files that record all the changes to the database. The archived logs consist
    of files that are copies of the redo logs; these exist so that a historical record
    of all the changes made to the database can be utilized if necessary. Control
    files are binary files that contain the physical structure of the database, such
    as operating system filenames of all files that make up the database. Data files
    are physical structures of the database that make up a logical structure called
    a tablespace. All data is stored within some type of object within a tablespace.
    Parameter files are the files that contain the initialization parameters for the
    database. These are the files that set the initial settings or values of database
    resources when the database is started. Let''s look at each of these in more detail.


    # # Redo Logs


    The redo logs consist of files that record all of the changes to the database.
    Recording all changes is one of the most important activities in the Oracle database
    from the recovery standpoint. The redo logs get information written to them before
    all physical structures in the database. The purpose of the redo log is to protect
    against data loss in the event of a failure.


    The term redo log includes many subclassifications. Redo logs consist of online
    redo logs, offline redo logs (also called archived logs), current online redo
    logs, and non-current online redo logs. Each is described below.


    Online redo logs Logs that the log buffers are writing to a circular fashion.
    These logs are written and rewritten.


    Offline redo logs, or archived logs Copies of the online redo logs before they
    are written over by the LGWR.


    Current online redo logs Logs that are currently being written to and therefore
    are considered active.


    Non-current redo logs Online redo logs that are not currently being written to
    and therefore are inactive.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Oracle Recovery Processes, Memory Components, and File Structures 183


    Each database has at least two sets of online redo logs, but Oracle recommends
    at least three sets. We will see why when we discuss archived logs in the next
    section. Redo logs record all the changes that are made to the data; these changes
    result from the LGWR writing log buffers to the redo logs at particular events
    or in time.


    As mentioned previously, redo logs are written in a circular fashion. That is,
    if there are three sets of logs, log 1 gets written until it is full. Then Oracle
    moves to log 2, and it gets written until it is full. Then Oracle moves to log
    3, and it gets written until it is full. Oracle goes back to log 1, writes over
    the existing information, and repeats this process over again. Here is a listing
    of the logs in the V$LOGFILE view.


    ```

    SQL> select group#, member from v$logfile;

    GROUP#          M

    ```


    +   - 3 /oracle/oradata/orc9/redo03.log

    - 2 /oracle/oradata/orc9/redo02.log

    - 1 /oracle/oradata/orc9/redo01.log

    3 rows selected.


    Figure 6.1 shows an example of the circular process of redo file generation, which
    writes to one log at a time, starting with log 1, then to log 2, and then back
    to log 1 again.


    # FIGURE 6.1 The circular process of redo file generation


    ![](img/a183fd041839741f5ab6df3caffc6b52_244_0.png)'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'Redo logs identify values called committed transaction in the database. SCNs
    like a clock uniquely identify each committed transaction as a clock of events
    that have occurred in the database, and they are one of the major synchronization
    elements in recovery. Each data-file header and control file is synchronized with
    the current highest SCN.


    # Archived Logs


    Archived logs are non-current online redo logs that have been copied to a location
    offline. This location is the value of the init.ora file''s LOG_ARCHIVE_DEST parameter.
    Archived logs are created if the database is in ARCHIVELOG mode rather than NOARCHIVELOG
    mode. A more detailed explanation of ARCHIVELOG and NOARCHIVELOG mode will come
    in Chapter 10, “User-Managed Complete Recovery and RMAN Complete Recovery.” As
    noted earlier, archived logs are also referred to as offline logs.


    An archived log is created when a current online redo log is completed and before
    an online redo log needs to be written to. Remember, redo logs are written to
    a circular fashion. If there are only two log sets and you are in ARCHIVELOG mode,
    the LGWR may wait to or halt the writing of information to redo logs while an
    archived log is being copied. If it doesn''t, the LGWR process would overwrite
    the archived log, making the archived log useless. If at least three redo log
    groups are available, the archived log will have enough time to be created and
    not cause the LGWR to wait for an available online redo log. This is under average
    transactions. Some large or transaction-intensive databases may have 10 to 20
    log sets to reduce the contention on redo log availability.


    Archived logs are the copies of the online redo logs; the archived logs get applied
    to the database in certain types of recovery. Archived logs build the historical
    transactions, or changes, back in the database to make it consistent the desired
    point.


    # Control Files


    A control file is a binary file that stores the information about the physical
    structures that make up the database. The physical structures are OS objects,
    such as all OS filenames. The control file also stores the highest SCN to assist
    in the recovery process. This file stores information about the backups if you
    are using RMAN, the database name, and the date the database was created.

    You should always have at least two control files on different disk devices. Having
    this duplication is called multiplexing files. Multiplex-ing control files is
    done in an init.ora file''s CONTROL_FILES parameter.'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Oracle Recovery Processes, Memory Components, and File Structures 185


    Every time a database is mounted, the control file is accessed to identify the
    data files and redo logs that are needed for the database to function. All new
    physical changes to the database get recorded in the control file by default.


    # Data Files


    Data files are physical files stored on the file system. All Oracle databases
    have at least one data file, but usually more. Tablespaces are logical structures
    and are made up of one or more data files. All logical objects reside in tablespaces.
    Logical objects are those that do not exist outside the database, such as tables,
    indexes, sequences, and views.


    Data files are made up of blocks. These data blocks are the smallest unit of measure
    in the database. The logical objects, such as tables and indexes, are stored in
    the data blocks, which reside in the data files.


    The first block of every file is called a header block. The header block of the
    data file contains information such as the file size, block size, and associated
    tablespace. It also contains the SCN for recovery purposes.


    Here is the output from the V$DATAFILE view, showing the data files that make
    up a sample database.


