    prompt the DBA to create a default listener. If the DBA does not want to supply
    one in this manner, they can also use the Oracle Net Configuration Assistant to
    configure a listener. If this method is chosen, the installer uses the set of
    screens that are a part of this assistant to do the initial listener configuration.
    Figure 2.3 shows an example of the opening screen for the Oracle Net Configuration
    Assistant.'
