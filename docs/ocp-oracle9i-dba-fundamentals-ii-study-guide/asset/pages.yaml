  md: '# Chapter 3 • Configuring Oracle Net for the Client


    127.0.0.1 localhost

    10.2.0.91 gr99c0073 # Oracle Database Server


    The listener receives the request and looks for a matching GLOBAL_DBNAME. If it
    is found, the connection is established as a dedicated, dis-patched, connection
    depending on the configuration of the Oracle server. Figure 3.3 illustrates the
    following connection process.


    +   1. The client contacts the DNS server or local HOSTS file.


    +   2. The client contacts the Oracle server.


    +   3. The server spawns a dedicated process and redirects the connection to the
    newly spawned process or redirects the connection to a dispatched process when
    you are using the Oracle Shared Server.


    +   4. The server passes connection information back to the client.


    +   5. The client is now in direct contact with the server process or dispatcher.


    # FIGURE 3.3 Hostnaming connection summary


    ![](img/a183fd041839741f5ab6df3caffc6b52_157_0.png)'
