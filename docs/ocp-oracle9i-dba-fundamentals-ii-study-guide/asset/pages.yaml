  md: '# Answers to Review Questions


    +   1. B. Shared Server is a scalability option of Oracle. It provides a way to
    increase the number of supported user processes while reducing the overall memory
    usage. This configuration is well suited to high-volume, small transaction-oriented
    systems with many users connected. Because users share processes, there is also
    an overall reduction of the number of idle processes. It is not well suited for
    large data retrieval type applications like decision support.


    +   2. D. Users can still request dedicated connections in a shared server configuration.
    Bequeath and dedicated connections are one and the same. The database cannot be
    stopped or started when a user is connected over a shared server connection.


    +   3. A. A user must explicitly request a dedicated connection when a server
    is configured in Shared Server mode. Otherwise, the user will get a shared server
    connection. The correct parameter is (SERVER=DEDICATED).


    +   4. C. The shared server configuration parameters exist in the init.ora file
    on the Oracle server machine.


    +   5. C. In Shared Server, users connect to a pool of shared resources called
    dispatchers. A client connects to the listener and the listener redirects the
    request to a dispatcher. The dispatchers handle all of the user requests for the
    session. Many users can share dispatchers.


    +   6. D. Because the database has to be configured in Shared Server mode, changes
    have to be made to the init.ora file. The other choices are also configuration
    files, but none of them are used to configure Shared Server.


    +   7. E. This is one of the tricky questions again! Many options and files can
    be configured by the Oracle Net Manager, including tnsnames.ora and sqlnet.ora.
    But because Shared Server is a characteristic of the database server and not of
    the network, Oracle Net Manager is not used to configure it.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '+   8. Back to syntax again! The DISPATCHERS parameter of the init.ora file
    is used to configure dispatchers, so the correct answer is B. All of the other
    choices are invalid parameters.


    +   9. C. The System Global Area is the shared memory segment Oracle obtains on
    instance startup. The Program Global Area is an area of memory used primarily
    during dedicated connections. The Database Buffer Cache is a component of the
    Program Global Area. Virtual Circuits are the shared memory areas to which clients
    bind.


    +   10. C. Once a dispatcher receives a request from the user process, it places
    the request on the request queue. Remember that in a shared server environment,
    a request can be handled by a shared server process. This is made possible by
    placing the request and user information in the SGA.


    +   11. C. Many users can connect to dispatchers, and dispatchers can be added
    dynamically. Also, each dispatcher has its own response queue. The only one of
    these options that is false is option C because dispatchers can listen for only
    one protocol. Multiple dispatchers can be configured so that each is responsible
    for different protocols.


    +   12. D. A small PGA is maintained even though most of the user-specific information
    is moved to the SGA (specifically called the UGA in the Shared Pool or the Large
    Pool). The only information left in the reduced PGA is stack space.


    +   13. B. Shared servers process requests from many users. The completed requests
    are placed into the dispatchers'' response queues. The servers are configured
    with the SERVERS parameter. However, shared servers do not receive requests directly
    from dispatchers. The requests are taken from the request queue.


