    # FIGURE 8.3 Channel allocation


    ![](img/a183fd041839741f5ab6df3caffc6b52_296_0.png)


    Channels can be allocated manually or automatically.

    Manual channel allocation is performed any time you issue the ALLOCATE

    CHANNEL command, which starts a server process on the server of the target

    database. To manually write to a disk file system, you would use the

    ALLOCATE CHANNEL <name> TYPE DISK command. Similarly, to

    write to a tape backup system, you would use the ALLOCATE CHANNEL

    <channel name> TYPE SBT_TAPE command. These are the most common

    manual channel allocations.


    Automatic channel allocation is performed when you set the RMAN con-

    figuration at the RMAN command prompt. You do this by using the

    CONFIGURE DEFAULT DEVICE OR CONFIGURE DEVICE command. This type of

    allocation is automatic when you are executing the BACKUP, RESTORE, or

    DELETE commands. By using the CONFIGURE commands you can eliminate the

    need to use the ALLOCATE CHANNEL <name> TYPE DISK or ''SBT-

    TAPE'' command every time you perform a BACKUP, RESTORE, or DELETE.

    The complete list of automatic channel allocation commands is as follows:


    +   - CONFIGURE DEVICE TYPE PARALLELISM

    - CONFIGURE DEFAULT DEVICE TYPE'
