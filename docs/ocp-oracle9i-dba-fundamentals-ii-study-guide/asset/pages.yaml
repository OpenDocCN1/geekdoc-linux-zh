    # Determine How Long Users Are Waiting for Dispatchers


    To measure how long users are waiting for the dispatchers to execute their request,
    look at the combined $VQUEUE and $DISPATCHER views. See the listing below for
    an example:


    ```

    SELECT decode(sum(totalq),0,''No Responses'',

    Sum(wait)/sum(totalq)) "Average Wait time"

    FROM VQUEUE q, VDISPATCHER d

    WHERE q.type = ''DISPATCHER''

    AND q.paddr = d.paddr;

    ```


    ```

    Average Wait Time

    ---------------------

    .0413

    ```


    The average wait time for dispatchers is a little more than four hundreds of a
    second. Monitor this measure over time. If the number is consistently increasing,
    you should consider adding more dispatchers.


    # Determine Whether You Have Enough Shared Servers


    You can monitor shared servers using the $VSHARED_SERVER and $VQUEUE dictionary
    views. The shared servers are responsible for executing client requests and placing
    the requests in the appropriate response queue.


    The measurement you are most interested in is how long client requests are waiting
    in the request queue. The longer the request remains in the queue, the longer
    the client will wait for a response. The following statement will tell you how
    long requests are waiting in the queue:


    ```

    Select decode(totalq,0,''No Requests'') ''Wait Time'',

    Wait/totalq || ''hundreds of seconds''

    "Average Wait time per request"

    from VQUEUE

    where type = ''COMMON''

    ```'
