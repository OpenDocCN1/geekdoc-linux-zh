  md: '# The Oracle Certification Solution from Sybase


    The new Oracle9i certification program offers three certification tiers that are
    built to fix the needs of IT professionals as well as organizations looking to
    hire them. As you gain more skills and knowledge through the combined efforts
    of hands-on experience and training, you can gain more credibility with each new
    tier of certification you obtain. Sybase has a comprehensive line of Study Guides
    that will get you in position to approach the exams with confidence.


    # OCA: Oracle Certified Associate


    The Oracle9i certification program begins with the Associate level. Oracle has
    positioned this as an apprentice level certification that validates foundation
    knowledge that will database professionals to serve in entry level positions alongside
    database administrators or application developers.


    | Exam Name | Exam # | Sybase Products |

    | Introduction to Oracle9i SQL | 1Z-007 | OCA/OCP: Introduction to Oracle9i SQL
    Study Guide ISBN:0-7821-4062-9 |

    | Oracle9i DBA Fundamentals I | 1Z-031 | OCA/OCP: Oracle9i DBA Fundamentals I
    Study Guide ISBN:0-7821-4063-7 |


    ![](img/a183fd041839741f5ab6df3caffc6b52_584_0.png)


    # OCP: Oracle Certified Professional


    The Oracle Certified Professional is the second tier certification in the Oracle9i
    program. Candidates must possess the OCA certification before proceeding to the
    OCP exams. According to Oracle, OCPs have proven skills for managing a large database
    or developing robust applications that are deployed enterprise-wide.


    | Exam Name | Exam # | Sybase Products |

    | Oracle9i DBA Fundamentals II | 1Z-032 | OCA/OCP: Oracle9i DBA Fundamentals II
    Study Guide ISBN:0-7821-4064-5 |

    | Oracle9i Performance Tuning | 1Z-033 | OCA/OCP: Oracle9i Performance Tuning
    Study Guide ISBN:0-7821-4065-3 |


    ![](img/a183fd041839741f5ab6df3caffc6b52_584_1.png)


    Also available: Oracle9i Certification Kit, ISBN: 0-7821-4066-1 (Covers all four
    exams)


    # OCM: Oracle Certified Master


    The Oracle Certified Master is the highest level credential you can earn in the
    Oracle Certification Program. To become an OCM, you must first pass the four exams
    required for the OCP certification. Then you must attend two advanced Oracle technology
    courses within your selected job role and pass a hands--on practice-based examination
    in an Oracle lab environment.


    Visit for all your IT certification training needs.'
