    # Summary


    In this chapter, we emphasized media recoveries. We described the two methods
    of performing Oracle database recovery for media failures (user-managed and RMAN-based
    recoveries) and we performed specific examples of each.


    In addition, we identified the differences between ARCHIVELOG mode and NOARCHIVELOG
    mode and described the significant implications that each mode has on the backup
    and recovery process. We also showed examples of both ARCHIVELOG mode and NOARCHIVELOG
    mode recoveries using user-managed and RMAN methods of recovery.


    We then discussed read-only tablespace recovery and the three recovery scenarios
    associated with it. Each of these scenarios requires different recovery actions.
    We also performed user-managed and RMAN-based recovery situations in where file
    relocation was required.


    Media recoveries are an important topic in testing and in real work situations.
    How media recovery situations are handled depends on the confidence of the DBA
    performing the media recovery. You can obtain confidence by practicing media recoveries
    in all of the above-mentioned situations. Then, when you need to perform a media
    recovery, your uncertainties will have been significantly reduced. Such practice
    situations will also prepare you for testing and situations you will encounter
    as a DBA.'
