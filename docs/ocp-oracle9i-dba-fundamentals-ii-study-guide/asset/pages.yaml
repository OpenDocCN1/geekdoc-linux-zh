  md: '# Exam Essentials


    Understanding the recovery catalog is a key to understanding all the features
    of RMAN. When you choose to implement the recovery catalog, all features of RMAN
    are allowed. Additional maintenance and administration is involved with recovery
    catalog database, and this must be considered. Knowing how this information can
    be stored and utilized in the recovery catalog is key for the test and for getting
    the most out of RMAN in the workplace.


    # Exam Essentials


    Understand the considerations that you must take into account when you are using
    the recovery catalog. The recovery catalog considerations consist of the following:
    you must use a separate and distinct database for the recovery catalog, you must
    have database administration of the catalog database, you must consider backup
    strategies for the recovery catalog, and you must use the recovery catalog to
    provide full functionality of RMAN commands.


    Know the components that make up recovery catalog. The components that make up
    the recovery catalog are as follows: storage of long-term backup and recovery
    information, storage and reuse of RMAN scripts, and storage of backup information
    about data files, archived logs, and information about the physical makeup of
    the target database.


    Understand how to create the recovery catalog. To create the recovery catalog,
    you must create an account with the following privileges: CONNECT, RESOURCE, and
    RECOVERY_CATALOG_OWNER. Then with RMAN connected to the recovery catalog, the
    CREATE CATALOG TABLESPACE <table> command must be executed.


    Know the commands you will need to use to maintain the recovery catalog. You will
    need to be familiar with the following commands that are used to maintain the
    recovery catalog: DELETE INPUT, KEEP, NOKEEP, CHANGE, DELETE, DELETE EXPIRED,
    and CROSSHECK.


    Know how to register, resynchronize, and reset a database. The register, resynchronize,
    and reset commands perform initial setup and configuration operations on the recovery
    catalog. Registering the recovery catalog creates the initial incarnation of the
    database in the recovery catalog. Resetting the recovery catalog creates a new
    incarnation of a database after it has been opened with'
  merge: -1
  pgno: 470
- img_proc: true
  md: 'the RESETLOGS option. Resynchronizing the recovery catalog updates the recovery
    catalog with changed physical information from the control file of the target
    database.


    Know the different methods you would use to generate reports and lists from the
    recovery catalog. Be able to use list commands to generate basic information from
    the recovery catalog in a formatted output, and be able to use reports to provide
    more complicated outputs that answer more detailed questions.


    Know the new Oracle9i list commands. You should be aware of the two new list commands
    that are new to Oracle9i: LIST BACK SUMMARY AND LIST BACKUP BY FILE.


    Know how to create, store, and execute RMAN scripts. Make sure that you are familiar
    with the command syntax that is necessary in order to create and store a RMAN
    script—CREATE SCRIPT <script_name>. You should also know that in order to execute
    a script, the RUN {EXECUTE SCRIPT <script_name>} command must be performed.


    Understand the different methods you will need to back up and recover the recovery
    catalog. The recovery catalog can be backed up using either user-managed or RMAN
    backups. An export can also be used to back up the RMAN catalog schema.


    # Key Terms


    Before you take the exam, be certain you are familiar with the following terms:


    +   - full resynchronization report commands

    - incarnation resetting

    - list commands resynchronization

    - partial resynchronization RMAN scripts

    - recovery catalog unregistering

    - registering'
