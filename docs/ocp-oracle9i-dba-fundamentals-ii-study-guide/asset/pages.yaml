    # Describe Read-Only Tablespace Recovery


    There are three scenarios that can occur with read-only tablespace recovery. These
    are as follows:


    +   * Read-only backup and read-only recovery

    * Read-only backup and read-write recovery

    * Read-write backup and read-only recovery


    The first scenario is the most straightforward because recovery is needed. The
    SCN does not change because the tablespace is read-only. In this type of recovery,
    the only activity you need to do is restore the data files associated with the
    read-only tablespaces; thus no logs need to be applied.

    The second scenario will require a more complex recovery process because the tablespace
    is being recovered to a read-write state in which the SCN number has changed or
    transactions have been made in the tablespace.'
  merge: -1
  pgno: 368
- img_proc: true
  md: 'In this case, you would restore the tablespace from backup and apply archived
    logs from the point at which the table was made read-write.

    The final scenario will also require recovery because the tablespace is restored
    in a read-write state and then recovered to read-only. In this case, you will
    need to restore the backup of the tablespace in read-write mode and apply archived
    logs up to the point where the tablespace was made read-only. You should always
    perform a backup after making a tablespace read-only because doing so eliminates
    the need to restore the tablespace.


    # Using RMAN for Restoration and Recovery


    The restore and recovery considerations for using RMAN consist of how you will
    restore databases, tablespaces, data files, control files, and archived logs from
    RMAN. Restores and recoveries can be performed from backups on both disk and tape
    devices.

    There are two main backup sources that can be the basis for the RMAN recovery
    process. These sources are image copies and backup sets. *Image copies can be
    stored only on disk.* Image copies are actual copies of the data files, archived
    logs, or control files and are not stored in a special RMAN format. An image copy
    in RMAN is equivalent to an OS copy command, as cp or dd in Unix, or COPY in Windows
    NT/2000/XP.

    In Oracle9, the REST command will determine the best available backup set or image
    copy to use in restoration and the file will only be restored if a restoration
    is necessary. In prior Oracle versions, the files were always restored, even if
    it wasn''t necessary.

    The RECOVER command applies the necessary changes from the online redo logs and
    archived log files to recover the restored files. If you are using incremental
    backups, the online redo logs and archived log files will be applied to recover
    the database.


