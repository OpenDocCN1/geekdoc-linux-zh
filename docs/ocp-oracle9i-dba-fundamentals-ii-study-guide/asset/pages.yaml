  md: '# Troubleshooting Server-Side Connection Problems 69


    # Check Listener Protocols


    Check the protocols the listener is configured for. This is displayed by the lnrctl
    services command. Make sure the protocol of the service matches the protocol the
    client is using when requesting connection. If the client is requesting to connect
    with a protocol the listener is not listening for, the user will receive ORA-12541
    “No Listener” error.


    # Check Server Protocols


    Make the underlying network protocol on the server is active. For systems that
    run TCP/IP, you can attempt to use the ping to ping the server. This will verify
    that the TCP/IP daemon process is active on the server. There are other ways to
    check this, as verifying the services on Windows NT/2000 or with the ps command
    on Unix. An example of the ping command can be found in the next chapter.


    # Check Server Protocol Adapters


    Make the appropriate protocol adapters have been installed on the server. On many
    platforms, you can invoke the Oracle Universal Installer program and check the
    list of installed protocols. On Unix platforms, you can use the adapter utility
    to make sure the appropriate adapters have been linked to Oracle. An example of
    how to run this utility is provided below. This utility is located in the $ORACLE_HOME/bin
    directory.


    ```

    [root@localhost] ./adapters oracle

    ```


    Net protocol adapters linked with oracle are:


    +   BEQ

    IPC

    TCP/IP

    RAW


    Net Naming Adapters linked with oracle are:


    +   Oracle TNS Naming Adapter

    Oracle Naming Adapter'
