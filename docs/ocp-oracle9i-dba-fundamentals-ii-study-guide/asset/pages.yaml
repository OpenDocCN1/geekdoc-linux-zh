    ![](img/a183fd041839741f5ab6df3caffc6b52_80_0.png)


    # The Oracle Call Interface (OCI) Layer (Client)


    The Oracle Call Interface (OCI) layer is responsible for all of the SQL processing
    that occurs between a client and the Oracle server. The OCI layer exists on the
    client only. There is an analogous server component called the Oracle Program
    Interface (OPI) layer on the server. The OCI layer is responsible for opening
    and closing cursors, binding variables in the server''s shared memory space, and
    fetching rows. Because the OCI is an open architecture, third-party products can
    write applications that interface directly with this layer of the communications
    stack. The OCI layer passes information directly to the Two-Task Common (TTC)
    layer.


    # The Two-Task Common (TTC) Layer


    The Two-Task Common (TTC) layer is responsible for negotiating any datatype or
    character set differences between the client and the server. The Two-Task Common
    layer acts as a translator, converting values from one character set to another.
    The TTC will determine if any datatype differences'
  merge: -1
  pgno: 80
- img_proc: true
  md: 'are present when the connection is established. The TTC layer passes in-mation
    to the Oracle Net Foundation layer. This layer shares some of the characteristics
    of the Presentation Layer from the OSI model.


    # The Oracle Net Foundation Layer


    The Oracle Net Foundation layer (formerly known as the Transparent-work Substrate
    or TNS layer) is an integral component of the Oracle-communications stack architecture,
    and it is analogous to the Session Layer in the OSI model. It is based on the
    Transparent Network Substrate (TNS), which allows Oracle Net to be a very flexible
    architecture, interfacing with a wide variety of network protocols. The TNS interface
    shields both the client and server from the complexities of network communications.


    At this layer of the communications stack, Oracle Net interfaces with the other
    layers of the stack and their underlying protocols. It is this layer that provides
    the level of abstraction necessary to make Oracle Net a flexible and adaptable
    architecture, and it is this layer that compensates for differences in connectivity
    issues between machines and utilizing protocols. This layer also interrupts messages
    and passes information directly to the Oracle Protocol Adapters (OPA) layer. The
    Oracle Net Foundation layer has several sublayers:


    +   - Network interface (NI) subarray The Network interface sublayer provides
    a common interface on which the clients and servers can process functions. This
    layer of the stack is responsible for handling any break requests.

    - Network routing (NR) subarray This is where Oracle Net keeps its net-work roadmap
    of how to get from the source or client to the destination

    - Network naming (NN) subarray This layer takes network infos-mation and changes
    it into Oracle Net destination address information.

    - Network authentication (NA) subarray This layer is responsible for any negotiations
    necessary for authenticating connections.

    - Network session (NS) subarray The network session layer handles the bulk of
    activity in an Oracle network connection. This layer is responsible for such things
    as negotiating the initial connection request from the client. It is also responsible
    for managing the Oracle Net buffer contents and pass-ing the buffer information
    between the client and the server. It also handles'
  merge: -1
  pgno: 81
- img_proc: true
  md: '# The Oracle Net Stack Architecture 21


    special features of connection management, such as buffer pooling and multiplexing,
    if these options are used.


    # The Oracle Protocol Adapters (OPA) Layer


    The Oracle Protocol Adapters (OPA) layer interfaces with the underlying network.
    This becomes the entry point into the underlying network. This layer maps the
    Oracle Net Foundation layer functions to the analogous functions in the underlying
    protocol. There are different adapters for protocol supported. This layer, in
    conjunction with the Network Specific Protocol layer, is analogous to the Network
    Layer in the OSI model.


    # The Network Specific Protocol Layer


    This is the actual transport layer that carries the information from the client
    to the server. Some of the protocols supported by Oracle Net TCP/IP, and DECnet.
    These protocols are not supplied with the Oracle software and must be in place
    to facilitate network communications.


    # The Oracle Program Interface (OPI) Layer (Server Only)


    For every request from the client, the Oracle Program Interface layer is responsible
    for sending the appropriate response. When clients issue SQL statements requesting
    data from the database, the OPI interface fulfills that request. In server-to-server
    communication, the Network Program Interface (NPI) is used instead of the OPI.


    # The Network Program Interface (NPI) Layer (Server Only)


    The Network Program Interface (NPI) is found only on the Oracle server. It is
    analogous to the OCI on the client. This layer is responsible for server-to-server
    communications, whereas the OPI is used in client-to-server communications and
    in distributed environments where databases communicate with each other across
    database links. This layer is analogous to the Presentation Layer of the OSI model,
    but from the server perspective.


    # Oracle Net and Java Support


    To provide the ability to interface with Java code that can be written and deployed
    inside the Oracle server environment, Oracle Net supports the General Inter-ORB
    Protocol (GIOP). This protocol allows Object'
