  md: '# Considerations for Using the Recovery Catalog


    Your decision to use the recovery catalog is one of the most significant decisions
    you make when you are using RMAN. The recovery catalog provides many more backup
    and recovery functions than using the target database''s control file as the RMAN
    repository. For this reason, when you are using RMAN, Oracle recommends that you
    use the recovery catalog whenever-possible.


    The main considerations regarding the use of the recovery catalog are as follows:


    +   - Some functionality is not supported unless the recovery catalog exists.

    - You should create a separate catalog database.

    - You must administer the catalog database like any other database in areas such
    as data growth and stored database objects such as scripts.

    - You must back up the catalog database.

    - You must determine whether you will keep each target database in a separate
    recovery catalog within a database.


    Oracle recommends that you use the recovery catalog unless the process of maintaining
    and creating the catalog database requires too many resources for a site. (Any
    site that has an experienced and qualified DBA and system administrator should
    be able to maintain and create the catalog database.) If the database is small
    and not critical, however, using RMAN without the recovery catalog is acceptable
    and has been improved from previous Oracle versions.


    ![](img/a183fd041839741f5ab6df3caffc6b52_450_0.png)


    You should store the recovery catalog on a separate server and filesystem than
    the one on you store the target databases it is responsible for backing up. This
    prevents failures on the target database server and filesystem affecting the recovery
    catalog for backup and recovery purposes.


    Figure 13.1 shows the recovery catalog''s association with the whole RMAN backup
    process.'
  merge: -1
  pgno: 450
- img_proc: true
  md: '# FIGURE 13.1 RMAN utility interacting with the recovery catalog


