    +   3. Execute a STARTUP MOUNT command to read the contents of the control file.


    ```

    SQL> startup mount;

    ```


    +   4. Execute a RECOVER DATABASE UNTIL CANCEL command to start the recovery process.


    ```

    SQL> recover database until cancel;

    ```


    +   5. Apply the necessary archived logs up to, but not including, the lost or
    corrupted log.


    +   6. Open the database and reset the log files.


    ```

    SQL> alter database open resetlogs;

    ```


    +   7. Switch the log files to see whether the new logs are working.


    ```

    SQL> alter system switch logfile;

    ```


    +   8. Shut down the database.


    ```

    SQL> shutdown normal;

    ```


    +   9. Execute STARTUP and SHUTDOWN NORMAL commands to validate that the database
    is functional by making sure that the alert logs after these commands are executed.


    ```

    SQL> startup;

    ```


    ```

    SQL> shutdown normal;

    ```


    +   10. Perform a cold backup or hot backup.


    ![](img/a183fd041839741f5ab6df3caffc6b52_405_0.png)


    If you need to recover archived logs from a different location, you just change
    the LOG_ARCHIVE_DEST location to the new location of the archived log files. This
    may occur in a recovery situation in which you recover your archived logs from
    tape to a staging location on disk.'
