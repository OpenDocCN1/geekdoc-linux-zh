  md: '# Scalability: Connection Manager


    Oracle Connection Manager is a middleware solution that provides three additional
    scalability features:


    Multiplexing Connection Manager can group together many client-connections and
    send them as a single multiplexed network connection to the Oracle server. This
    reduces the total number of network connections to the server to manage.


    Network access Connection Manager can be configured with rules that restrict access
    by IP address. This rules-based configuration can be set up to accept or reject
    client connection requests. Also, connections can be restricted by point of origin,
    destination server, or Oracle server.


    Cross-protocol connectivity This feature allows clients and servers that use different
    network protocols to communicate. Connection Manager acts as a translator, providing
    two-way protocol conversion.


    Oracle Connection Manager is controlled by a set of background processes that
    manage the communications between clients and servers. This option is not configured
    using the graphical Oracle Net Manager tool. Figure 1.4 provides an overview of
    the Connection Manager architecture.


