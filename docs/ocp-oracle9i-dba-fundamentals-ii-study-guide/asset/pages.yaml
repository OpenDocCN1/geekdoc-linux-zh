    # Input Data or Data Files


    Input data, a data file, or an input file all describe the same file; one contains
    the data that will be loaded into the database table or external table. This file
    can be in various formats. A common format that is easy to work with is comma
    delimited. Comma-delimited data file has commas that separate the fields within
    the file. When the data file is loaded into the database, the data between each
    comma is loaded into a column in the table. Whatever the format of the data file,
    SQL*Loader has robust parsing capabilities and is capable of loading most formats.


    # Conventional Load, Direct-Path Load, and External-Path Load


    There are three methods to load data with SQL*Loader. These methods are conventional
    load, direct-path load, and external-path load. The conventional load is the default
    and will load data in much the same way as insert'
