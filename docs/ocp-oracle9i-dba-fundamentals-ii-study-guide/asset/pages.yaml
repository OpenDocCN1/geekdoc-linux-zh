  md: '![](img/a183fd041839741f5ab6df3caffc6b52_289_0.png)


    his chapter provides an overview of RMAN, including the capabilities and components
    of the RMAN tool. The RMAN utility attempts to move away from the highly customized
    OS backup scripts (user-managed) discussed in earlier chapters, to a highly standardized
    backup and recovery process. Thus, as of Oracle version 8, you can reduce backup
    and recovery mistakes associated with the highly customized OS backup scripts
    used before RMAN''s release.


    In this chapter, you will walk through a practical example of connecting to the
    RMAN utility without using the optional, but recommended, recovery catalog. We
    will also demonstrate multiple ways to configure the RMAN environment to automate
    and set up manual RMAN environment.


    Each of the topics covered in this chapter is important; you can apply this knowledge
    to your real-world DBA work in addition to your preparations for the test. When
    you know how to use the RMAN repository, channel allocation, and MML, and you
    can configure the RMAN environment, you will be better able to utilize RMAN in
    your organization.


    # Identifying Features of Oracle Recovery Manager (RMAN)


    Oracle Recovery Manager (RMAN) has many features that can facilitate the backup
    and recovery process. This tool comes in both GUI and command-line versions. In
    general, RMAN performs and standardizes the backup and recovery process, and by
    doing this, it can reduce mistakes made by DBAs during this process. A list of
    some of the major RMAN features follows:


    +   - Back up databases, tablespaces, data files, and archived logs

    The RMAN tool is capable of backing up Oracle databases in multiple ways to allow
    for flexibility in backup and recovery methods.'
  merge: -1
  pgno: 289
- img_proc: true
  md: '# Identifying Features of Oracle Recovery Manager (RMAN)


    Compresses backups by determining which blocks have changed and backing up only
    those blocks One way RMAN improves performance of the backup is by compressing
    backups. RMAN identifies blocks that have changed and only backs up those blocks.
    Also, empty blocks are not backed up.


    Performs incremental backups RMAN has the ability to perform incremental and full
    backups. Incremental backups include only the changes that have been made since
    the last backup. This type of backup can improve performance by allowing you to
    take a full backup one day a week and incremental backups on the rest of the days.


    Provides scripting capabilities to combine tasks One way RMAN can improve the
    efficiency of your backup, restoration, and recovery operations by allowing RMAN
    commands to be scripted. The scripts can contain multiple RMAN commands that can
    be stored within the recovery catalog. These scripts can be called and executed
    to perform tasks repetitively.


    Logs backup operations RMAN has the ability to log the status of backups as they
    progress. This information is stored in log and trace files.


    Integrates with third-party tape media software The RMAN tool has APIs with many
    third-party tape media software. These allow RMAN to be executed within other
    non-Oracle backup utilities and to be integrated into a common backup strategy
    for an organization.


    Provides reports and lists of catalog information Information about backups is
    stored within the recovery catalog can be queried with RMAN LIST and REPORT commands.
    These commands provide useful ways to display information.


    Stores information about backups in a catalog within an Oracle database Information
    about backups is stored in the recovery catalog. This information can be retrieved
    at a later date or whenever desired.


    Offers performance benefits, such as parallel processing of backup and restore
    operations Backup and restore operations can be set in parallel. This can split
    workloads onto different tape heads and disk devices, which will improve performance.


    Creates databases for testing and development purposes Duplicate databases can
    be created from RMAN backups and can be used for testing purposes.


    Tests whether backups can be restored successfully RMAN provides the VALID commands
    that will check to see whether the backup is valid.'
