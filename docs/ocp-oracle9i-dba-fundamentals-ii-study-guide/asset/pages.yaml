    # Methods for Backing Up and Recovering the Recovery Catalog


    There are a few methods you can use to back up and recover the catalog. Before
    we address these methods, you need to know one steadfast rule: the catalog database
    needs to be on a different server than the one on which the target databases are
    stored. This prevents the catalog database from being impacted by a server-wide
    failure on the target database server.


    If necessary, the catalog database can be backed up by another RMAN catalog or
    a user-managed backup. When this kind of backup is conducted, the database can
    be in ARCHIVELOG mode or NOARCHIVOG mode depending on the activity.


    How you use the catalog determines how complicated you need to make the backup
    process. For example, let''s say the environment you support executes backups
    only in the evening. These backups are all completed by 6:00 A.M. the following
    day. In this case, the RMAN catalog backups could go on'
  merge: -1
  pgno: 468
- img_proc: true
  md: 'every day at some time after the backups are complete. This type of environment
    would probably safely operate in NOARCHIVELOG log mode if desired.


    Let''s look at a more demanding schedule that would require ARCHIVELOG mode. In
    this example, backups continue around the clock, so there would be no time to
    perform a cold backup. This means that the database has to operate in ARCHIVELOG
    mode. In addition, the catalog backup should occur when the catalog is being used
    the least in order to avoid contention, as you would do with your backups.


    Additionally, you can perform an export of the RMAN schema. This is a good way
    to supplement the physical backup performed by RMAN or a user-managed backup.
    The following syntax is an example of how to back up the RMAN schema with an export
    in which RMAN is the schema owner and the database name is rcat.


    ```

    exp rman/rman@ file=cat.dump owner=rman

    ```


    In conclusion, a general approach is to back up regularly using physical backups:
    either RMAN or user-managed. These backups should be daily and the database should
    be in ARCHIVELOG mode to ensure complete recovery. For added security, you can
    add user exports of the RMAN schema. This way you have a fall-back plan in case
    you have a problem with your physical backup.


    # Summary


    This chapter discussed the considerations you need to take into account when you
    are using the recovery catalog as well as its major components. You saw many practical
    examples of how to perform certain tasks in RMAN and the recovery catalog. One
    example demonstrated how to create the recovery catalog in a database.


    In addition to these examples, this chapter demonstrated various commands and
    methods you need to use to manage the recovery catalog. Some of these commands
    are included in the lists and reports guides and are used to query information
    in the recovery catalog. These commands also help validate backup status and schedule
    backups.


    You also learned how to use scripting capabilities within RMAN to group commands,
    store them within the catalog, and run stored scripts. These scripts can reduce
    the number of errors that can occur in scripts or programs not centrally stored
    in the RMAN schema.'
