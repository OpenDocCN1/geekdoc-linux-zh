  md: '# Chapter 15 · Using SQL*Loader to Load Data


    Line 12 The remainder of the lines between parentheses () contain the field list
    that provides details about column formats in the table being loaded.


    # Log Files


    The SQL*Loader log files consist of the bad files, the discard files, and the
    general log files. Each of these log files records information from the SQL*Loader
    activities at different parts of the load process. The bad and discard files have
    the information stored in a load data format. These files could actually be loaded
    again if desired. The general log is an actual log file that contains information
    about the overall SQL*Loader process. The input and data file is actual data that
    will be loaded into the table. We will discuss each of the files in more detail
    in the upcoming sections.


    # The Bad Files


    Bad files are the first of the three log files generated by the SQL*Loader utility.
    These files contain the records that were rejected by the Oracle database or did
    not meet the format criteria in the control file. These logs are created so that
    they can be used in the reload process if needed. The type of situation in which
    this type of file could be useful would be one in which had large input files.
    Bad log files could be much smaller, and therefore, problems that occurred in
    the load process would be much easier to identify in these smaller files.


    # Discard Files


    Discard files are created by SQL*Loader if you have designated that they should
    be created; this process is optional. These log files contain the records that
    did not match any of the record selection criteria. Hence, these records were
    excluded from the load. This wasn''t because they were unacceptable to the load
    as was the case with the data in the bad file, but it was because these records
    filtered out properly according to the way the control file had been set up.


    # General Log Files


    These files store information about the load process in general. This information
    is used to determine when the SQL*Loader process was performed and how it went.
    Below is a list of the information that is covered in the general log file.


    +   - Date of the load


    +   - Version information'
