    on disk.


    **resynchronization** The process of updating the recovery catalog with either
    physical or logical information (or both) about the target database.


    **reusable section** The information stored within the target database''s control
    file that is used to backup and recover the target database.


    **RMAN** See Oracle Recovery Manager (RMAN).


    **RMAN-based backup** Performed by the Oracle Recover Manager utility, which is
    part of the Oracle software.


    **RMAN repository** The information necessary for RMAN to function in the recovery
    catalog, or the control files if the recovery catalog is not used, is called the
    RMAN repository.


    **RMAN scripts** Scripts that use RMAN commands that can be stored on the filesystem
    or within the recovery catalog.


    **roll back** To undo a transaction from the database.


    **roll forward and roll backward process** Applying all the transactions, committed
    or not committed, to the database and then undoing all uncommitted transactions.


    **row chaining** Storing a row in multiple blocks because the entire row cannot
    fit in one block. Usually this happens when the table has LONG or LOB columns.
    Oracle recommends using CLOB instead of LONG because the LONG data type being
    phased out.


    **row migration** Moving a row from one block to another during update operation
    because there is not enough free space available to accommodate the updated row.'
