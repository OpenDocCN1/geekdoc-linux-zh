- img_proc: true
  md: '11. C. A checkpoint causes dirty buffers to be flushed to a disk. A SHUTDOWN
    NORMAL or SHUTDOWN IMMEDIATE causes a checkpoint on shutdown, but a SHUTDOWN ABORT
    doesn''t force a checkpoint. This is why recovery is necessary upon startup. A
    rollback and commit do not cause a checkpoint.


    12. The ARCn is not a required at startup. This process is only used if the database
    is running in archive mode.


    13. C. The SMON process is responsible for the majority of instance recovery.


    14. B. A current online log is a log that is being written to by the LGWR process.


    15. C. Archived logs are offline redo logs. These are redo logs that are copied
    to a new location before the LGWR writes them.


    16. D. The data file is a physical structure that makes up a logical tablespace.


    17. C. The log buffers are responsible for temporarily holding log entries that
    will be written to the redo logs.


    18. C. You should always have more than one control file to protect against the
    loss of one. This is called multiplexing control files.


    19. B. A log switch forces a checkpoint immediately as part of the synchronization
    process for recovery.


    20. D. The spfile.ora parameter file is new to Oracle9i. The init.ora file has
    been around since the beginning of the Oracle database, but the spfile.ora file
    is a new binary initialization file.'
