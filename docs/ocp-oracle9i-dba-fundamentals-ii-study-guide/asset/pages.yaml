    # Requesting a Dedicated Connection in a Shared Server Environment


    You can have Shared Server and dedicated servers connecting to a single Oracle
    server. This is advantageous in situations where you have a mix of activity on
    the Oracle server. Some users may be well suited to shared server connections
    while other types of users may be better suited to dedicated connections.


    By default, if Shared Server is configured, a client is connected to a dispatcher
    unless the client explicitly requests a dedicated connection. As part of the connection
    descriptor, the client has to send information requesting a dedicated connection.
    Configure this option using the Oracle Net Manager. Clients may request this type
    of connection if the names resolution method is localnaming. This option cannot
    be used with hostnaming.'
