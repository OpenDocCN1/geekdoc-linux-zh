    # set Commands in lsnrcctl


    lsnrcctl utility also has commands called set commands. These commands are issued
    by typing set <commandname> at the LSRCTL> prompt. The set commands are used to
    make modifications to the listener.ora file, such as setting up logging and tracing.
    Most of these parameters can be set using the Oracle Net Manager. To display the
    current setting of a parameter, use the show command. show used to display the
