  md: '# Chapter 4 · Configuring the Shared Server Option


    Pool design, memory allocations for Shared Server came from the Shared Pool. This
    caused Shared Server to compete with other processes updating information in the
    Shared Pool. The Large Pool alleviates the memory burden on the Shared Pool and
    enhances performance of the Shared Pool.


    # Configure the Large Pool


    You can configure the Large Pool by setting the parameter LARGE_POOL_SIZE in the
    init.ora file. This parameter can be set to a minimum of 300KB and a maximum of
    at least 2GB; the maximum setting is operating system dependent. When a default
    value is used, Oracle adds 250KB per session for each shared server if the DISPATCHERS
    parameter is specified. If you do not configure a Large Pool, Oracle will place
    the UGA into the Shared Pool. Because of this, you should configure a Large Pool
    when using Shared Server so you don''t affect the performance of the Shared Pool.
    Here is an example of setting the LARGE_POOL_SIZE parameter in the init.ora file:


    ```

    LARGE_POOL_SIZE = 50M

    ```


    You can see how much space is being used by the Large Pool by querying the V$
    SGASTAT view. The free memory row shows the amount available in the Large Pool
    and the session heap row shows the amount of space used in the Large Pool. Here
    is a listing that shows an example of the query:


    ```

    SQL select * from v$sgastat where pool = ''Large Pool'';

    ```


    | POOL | NAME | BYTES |

    |---|---|--|

    | large pool | free memory | 251640 |

    | large pool | session heap | 48360 |


    # Sizing the Large Pool


    The Large Pool should be large enough to hold information for all of your shared
    server connections. Generally, each connection will need between one and three
    megabytes of memory, but this depends on that client''s type of activity. Clients
    that do a great deal of sorting or many cursors will use more memory.'
