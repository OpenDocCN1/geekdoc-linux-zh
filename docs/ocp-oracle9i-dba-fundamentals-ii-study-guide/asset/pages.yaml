    # # Performing Closed and Opened Database Backups


    A closed backup and opened backup are performed in a similar manner—by executing
    OS copy commands. The closed backup can be performed just like a standard OS backup
    after the database has been shut down. Basically,'
  merge: -1
  pgno: 317
- img_proc: true
  md: '# Performing Closed and Opened Database Backups 257


    the closed backup just makes a copy of all the necessary physical files that make
    up the database; these include the data files, online redo logs, control files,
    and parameter files.


    The opened backup is also executed by issuing OS copy commands. These commands
    are issued between an ALTER TABLESPACE <TABLESPACE_NAME> BEGIN command and an
    ALTER TABLESPACE <TABLESPACE_NAME> END BACK command. The opened backup requires
    only a copy of the data files. The ALTER TABLESPACE <TABLESPACE_NAME> BEGIN command
    causes a checkpoint to the data file or data files in the tables. The data-header
    is stamped with the SCN consistent with those data blocks. All other changes in
    the data file from Data Manipulation Language (DML), such as INSERT, UPDATE, and
    DELETE statements, get recorded in the data files and redo logs in almost the
    same way as during normal database operations. However, the data-header SCN is
    not updated until the ALTER TABLESPACE <TABLESPACE_NAME> END backup command gets
    executed and needed in a recovery checkpoint. Oracle writes more information in
    the redo logs during the period that the ALTER TABLESPACE <TABLESPACE_NAME> BEGIN
    command is executed.


    This is one reason why data files are fundamentally different from other Oracle
    database files, such as redo logs, control files, and init.ora files when it comes
    to backups. Redo logs, control files, and init.ora files can be copied with standard
    OS copy commands without performing any preparatory steps such as the ALTER TABLESPACE
    <TABLESPACE_NAME> commands. This is completely true in the Unix environment. It
    is partially true in the Windows NT/2000/XP environment because of the locking
    that is performed on open files.


    ![](img/a183fd041839741f5ab6df3caffc6b52_318_0.png)


    Even though hot backups can be performed at any time the database is opened, it
    is a good idea to perform hot backups when there is the lowest DML activity. This
    will prevent excessive redo logging, which could impair data-performance.


    Here are the steps you need to take to perform a closed database backup:


    +   1. Shut down the database that you want to back up. Make sure that a SHUTDOWN
    NORMAL, IMMEDIATE, or TRANSACTIONAL command is used, and not a SHUTDOWN ABORT.


