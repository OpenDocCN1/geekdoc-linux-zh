    Names Server can also be utilized in Oracle8 and earlier versions, however. The
    Oracle Names Server can also be configured as a proxy to an LDAP-compliant Names
    Directory Service to ease the migration from Oracle Names to Directory Naming.


    # Directory Services: Oracle Internet Directory


    The Oracle Internet Directory (OID) is an LDAP 3-compliant directory service,
    which provides the repository and infrastructure needed to enable a centralized
    naming solution using Directory Naming. OID can be used with both Oracle8 and
