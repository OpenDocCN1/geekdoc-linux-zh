- img_proc: true
  md: '# 108 Chapter 3 · Configuring Oracle Net for the Client


    in which the client resolves net service names. If the parameter is not set, the
    default is localnaming, Oracle Internet Directory, and then hostname.

    If this parameter is set incorrectly, the client may not check the appropriate
    name resolution type. For example, if you are using localnaming and the parameter
    is set to HOSTNAMES, the tnsnames.ora file will never be used to resolve the service
    name. You will receive an ORA-12154 “Cannot Resolve Service Name”


    # Check NAMES.DEFAULT_DOMAIN


    NAMES.DEFAULT_DOMAIN is another common error in older releases of Oracle because
    the parameter defaulted defaulted to WORLD. Check the client sqlnet.ora file to
    see if the parameter is set. If the parameter has a value and is appended to the
    end of the net service name. An unqualified service name is a service name that
    does not contain information.

    For example, if you entered Sqlplus matt/casey@PROD, and the NAMES.DEFAULT_DOMAIN
    was set to WORLD, Oracle would append WORLD to the service name; as a result,
    Oracle will pass the command as sqlplus matt/casey@PROD.WORLD. You will receive
    an ORA-12154 “Cannot Resolve Service Name” error if the service name should not
    include the .DOMAIN extension. You use this parameter only if you are using a
    hierarchical naming convention.


    # Check Client Protocol Adapters


    Verify that the appropriate protocol adapters have been installed on the client.
    You can invoke the Universal Installer and check the client setup. Look for the
    listing of client protocol adapters installed.


    # Check for Client-Side Error Codes


    Here is a summary of the common client-side Oracle errors that you may encounter.


    ```

    ORA-12154 "TNS: could not resolve service name"

    ORA-12198 "TNS: could not find path to destination"

    ORA-12203 "TNS: Unable to connect to destination"

    ```'
