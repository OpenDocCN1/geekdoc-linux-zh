    log_archive_format=archorc9%%.log


    This second method of mirroring archived logs is designed to mirror just one copy
    of the log files, whereas the first method can mirror up to 10 copies, one of
    which is a remote database.


    # Remote Archived Log Locations


    With all remote transactions, there is a greater degree of potential problems.
    In order to deal with these potential transaction problems, Oracle has developed
    some specific commands for remote archive destinations. Among these, there are
    a couple of commands and initialization parameters that determine whether the
    logs are required to reach the remote location and whether they are required to
    retry unsuccessful sends.


    LOG_ARCHIVE_MIN_SUCCEED_DEST=W is the initialization parameter that determines
    how many of the 10 maximum archive destinations must fully receive an archived
    log before the redo logs can be overwritten. If this is not met, the database
    will hang.


    The first parameters specify whether the destinations are mandatory or optional
    archive destinations. When you use the MANDATORY parameter, destinations will
    require files to arrive at the remote location; if these files don''t arrive,
    the database generating these logs will hang. When you use the OPTIONAL parameter,
    the opposite of the MANDATORY parameter, if a log does not make it to remote location,
    the database will continue processing without hanging.


    The REOPEN command causes failed archive destinations to be retried after a period
    of time. Below is an example of this command and the parameters previously mentioned.
    Note that the REOPEN example uses a service-entered destination for use in standby
    database mode.


    ```

    LOG_ARCHIVE_DEST_1=LOCATION=/oracle/admin/tsn9/arch1 MANDATORY

    LOG_ARCHIVE_DEST_2=LOCATION=/oracle/admin/tsn9/arch2 OPTIONAL

    LOG_ARCHIVE_DEST_3=SERVICE=euro_fin_db_V9.0.1 REOPEN=60

    ```


    Make sure each LOG_ARCHIVE_DEST_N and LOG_ARCHIVE_DUPLEX_DEST is on a different
    physical device. The main purpose of these new parameters is to allow a copy of
    the files to remain intact if a disk were to crash.


    ![](img/a183fd041839741f5ab6df3caffc6b52_277_0.png)'
  merge: -1
