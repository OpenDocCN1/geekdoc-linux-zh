    # Real World Scenario


    # Troubleshooting Shared Server Startup Problems


    If you have problems starting the instance, chances are that you have a problem
    with one of the Oracle Net files. If you receive an error that states the DISPATCHERS
    parameter is incorrect, make a backup of all your Oracle Net files, with tnsnames.ora
    and listener.ora, and re-create these files using the Oracle Net Manager. Most
    problems you have experienced with the Shared Server can be traced back to modifications
    made to these files without using Oracle Net Manager. Even cutting and pasting
    service information to create new service definitions can cause problems. After
    you have re-created your files, try to restart your instance.


