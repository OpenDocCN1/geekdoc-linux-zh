- img_proc: true
  md: '# Checkpoints, Redo Logs, and Archived Logs 187


    If the instance were to crash at this point, only new transactions that occurred
    after this checkpoint would need to be applied to the database to enable a complete
    recovery. Therefore, the checkpoint process determines which transactions from
    the redo logs need to be applied in the database in the event of a failure and
    subsequent recovery. Remember that all transactions, whether committed or not,
    get written to the redo logs.


    Other methods that cause a checkpoint to occur any of the following commands:
    ALTER SYSTEM SWITCH LOGFILE, ALTER SYSTEM CHECKPOINT LOCAL, ALTER TABLESPACE BEGIN
    BACKUP, and ALTER TABLESPACE END BACKUP.


    SCNs are recorded within redo logs at every log switch, at a minimum. This is
    because a checkpoint occurs at every log switch. Archived logs have the SCNs recorded
    within them as the online redo logs because the archived logs are merely copies
    of the online redo logs.


    Let''s look at an example of how checkpointing, online redo logs, and archived
    logs are all interrelated. First, the ALTER TABLESPACE BACKUP command is followed
    by an OS command used to begin an online backup of a database.


    An online backup, also called a hot backup, occurs while the database is still
    available or running. See Chapter 9, "User-Managed and RMAN-based Back-ups," for
    a more detailed explanation of a hot backup.


    The ALTER TABLESPACE BEGIN BACKUP command is followed by an OS command to copy
    the files, such as cp in Unix. Then, the command ALTER TABLESPACE END BACKUP is
    used to end the hot backup. As we discussed, these ALTER TABLESPACE commands also
    cause a checkpoint to occur. The following is an example of the data file data01.dbf
    for the tablespace DATA being backed up:


    ```

    SQL> connect /sysdba

    Connected.

    SQL> alter tablespace data begin backup;

    Tablespace altered.

    SQL> ! cp data01.dbf /stage/data01.dbf

    SQL> alter tablespace data end begin backup;

    Tablespace altered.

    SQL>

    ```


    ![](img/a183fd041839741f5ab6df3caffc6b52_248_0.png)'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'Note that the tablespace DATA was put in backup mode, and then the OS command
    was executed, copying the data file data01.dbf to the new directory /stage, where
    it awaits writing to tape. Finally, the tablespace DATA was taken out of backup
    mode. These steps are repeated for every tablespace in the database. This is a
    simplified example of a hot backup.

    If a hot backup was taken on Sunday at 2 A.M., and the database crashed on Tuesday
    at 3 P.M., then the last checkpoint would have been issued after all the data
    files were backed up. This backup would be the last checkpointed disk copy of
    the database. Therefore, all logs generated after the 2 A.M. backup would need
    to be applied to the checkpointed database to bring it up to 3 P.M., the time
    of the crash. When you are making a hot backup of the database, you are getting
    a copy of the database that has been checkpointed for each data file. In this
    case, each data file has a different SCN stamped in the header and will need all
    applicable redo log entries with a greater SCN applied to the data file to make
    the database consistent.


    # Ways to Tune the Instance Recovery


    As we have previously discussed in Chapter 5, “Backup and Recovery Overview,”
    *instance failure* is when the Oracle database abnormally terminates due to something
    like a power outage or a shutdown abort. *Instance recovery* is the automatic
    process that the Oracle database performs to ensure that the database is functioning
    properly and the data is consistent. This is also known as the *roll forward and
    rollback process*. Upon startup of the Oracle database after an instance failure,
    Oracle reads the current redo log and applies all the changes in that redo log
    to the database. Any uncommitted changes are then rolled back. Thus, the database
    is made consistent from the time of the outage.


    The concept of defining an approximate set time for the instance recovery process
    is called *bounded time recovery*. *Bounded time recovery* means that the DBA
    controls or puts bounds on the time it takes for an instance to recover after
    instance failure. These bounds are controlled by using two initialization'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'There are two primary initialization parameters that will speed up the instance
    recovery process. The first parameter is called FAST_START_MTTR_TARGET. This parameter
    makes the database writer (DBW0) background process de-write blocks faster and
    at a predefined pace to meet agreed-upon recovery timeframes. This parameter can
    be set from 0 to 3600.

    The second parameter is called FAST_START_PARALLEL_ROLLBACK. This parameter determines
    the maximum number of processes that can exist for performing a parallel rollback.
    This parameter is useful when there are running transactions involved in the instance
    recovery process. This causes the rollback aspect of instance recovery to process
    faster. This parameter can be set as HIGH, LOW, and FALSE. The following are sample
    init.ora parameters:


    ```

    fast_start_mttr_target      = 300

    fast_start_parallel_rollback  = LO

    ```


    There are three V$ views that can be queried to monitor these parameters. These
    are $VINSTANCE_RECOVERY, $VFAST_START_SERVERS, and $VFAST_START_TRANSACTIONS.
    Below is an example of the $VINSTANCE_RECOVERY view, which can be used to monitor
    and determine the length of recovery for the FAST_START_MTTR_TARGET parameter.
    TARGET_MTTR and ESTIMATED_MTTR show the estimated time in seconds to recover the
    database in the advent of an instance failure at given time.


