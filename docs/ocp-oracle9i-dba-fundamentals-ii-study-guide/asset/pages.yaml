  md: 'Answers to Review Questions


    # Answers to Review Questions


    +   1. D. The instance recovery is automatic.


    +   2. D. The LGWR, or log writer process, writes changes from the log buffers
    to the online redo logs.


    +   3. A, B, D. Redo logs, archived logs, and data files are all file structures
    that are associated with recovery. Log buffers are memory structures.


    +   4. C. The control file is a binary file that stores all the information of
    the physical components of the database.


    +   5. A, B, PMON, SMON, and ARCn are all associated with some part of the recovery
    process. PMON recovers failed processes, SMON assists in instance recovery, and
    ARCn generates archived logs used to recover the database. The DBWR writes data
    to the data files when appropriate by default.


    +   6. D. The CKPT process performs all the checkpointing. This process starts
    by default.


    +   7. B, C. There are only two memory structures related to recovery: log buffers
    and data block buffers.


    +   8. D. SHUTDOWN ABORT requires an instance recovery upon startup because the
    data files are not checkpointed during shutdown.


    +   9. B, C, D. The SHUTDOWN NORMAL and SHUTDOWN IMMEDIATE events checkpoint all
    necessary physical database structures. Switching log files forces a checkpoint
    of all necessary physical database structures. The CKPT process is responsible
    for initiating or performing the checkpoint; it doesn''t cause it.


    +   10. B. Checkpointing is the procedure initiated by the CKPT process, which
    stamps all the data files, redo logs, and control files with the latest SCN.'
