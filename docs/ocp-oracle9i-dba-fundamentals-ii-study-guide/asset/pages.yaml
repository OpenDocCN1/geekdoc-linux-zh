  md: '# SHARED_SERVERS Parameter


    This parameter specifies the number of shared servers to start when the Oracle
    instance is started. This parameter can be altered dynamically with the ALTER
    SYSTEM command. You must set this parameter to at least 1 for Oracle to use shared
    server connections. A setting of 0 or no setting means shared servers will not
    be used. This parameter can be changed dynamically, even if shared servers are
    not configured when the instance starts, they can be configured without bringing
    the Oracle instance down and restarting.


    The number of shared servers necessary will vary depending on the type of activities
    your users are performing. Generally, for the types of high think applications
    that will be using shared server connections, 15 to 20 connections per server
    should be adequate. If your users are going to require larger result sets or doing
    more intensive processing, then you will want to reduce this ratio. Here is an
    example of the parameter:


    ```

    SERVERS = 3

    ```


    # SHARED_SERVER_SESSIONS Parameter


    This parameter specifies the total number of shared server sessions that are allowable
    for the Oracle instance. This parameter is derived from the lesser of CIRCUITS
    or SESSIONS - 5. For example if CIRCUITS is set to 10 and SESSIONS is set to 20,
    SHARED_SERVER_SESSIONS would be equal to 10 because this is the lesser of the
    2 values. This is a derived value and would not be set in the init.ora file manually.


    # Managing the Number of Shared Servers


    You can start additional shared servers or reduce the number of shared servers
    using the ALTER SYSTEM command. You can start any number of shared servers up
    to the MAX_SERVERS setting. Here is an example of adding three additional shared
    servers to a system initially configured with two shared servers:


    ```

    ALTER SYSTEM SET SHARED_SERVERS = 5;

    ```


    Notice that you set the number to the total number of shared servers you want,
    not the number of shared servers you want to add.'
  merge: -1
  pgno: 194
- img_proc: true
  md: '# MAX_SERVERS Parameter


    Set this parameter to the maximum number of shared servers you anticipate needing
    for the Oracle server. This number cannot be set dynamically. Generally, you should
    set this parameter to accommodate your heaviest work times. Here is an example
    of the parameter:


    ```

    MAX_SERVERS = 5

    ```


    # CIRCUITS Parameter


    This parameter manages the total number of virtual circuits allowed for all incoming
    and outgoing network sessions. This is a static parameter and defaults to the
    value of the SESSIONS init.ora parameter. This parameter does influence the total
    size of the SGA at system startup. Here is an example of the parameter:


    ```

    CIRCUITS = 200

    ```


    # Starting the Instance and Managing Shared Server


    After you have completed the configuration work in the init.ora file, you will
    need to restart your database. Once you have restarted your database, you should
    query the V$ views to see if the instance has started the shared servers and the
    dispatcher processes. Later in this chapter, we will discuss the various data
    dictionaries used to manage Shared Server.


    # Registering Dispatcher Information with the Listener


    When Shared Server is started, PMON registers dispatcher information with the
    listener. You can query the listener to see this registered information. The listener
    will keep track of the current connection load across all of the dispatchers.
    This information is necessary so that the listener can take advantage of dispatcher
    load balancing.'
