  md: "# Control Files\n\nThe control file is a fairly detailed component of SQL*Loader\
    \ that is responsible for most of the functionality in the load process. The control\
    \ file does just what its name implies; it controls the SQL*Loader process. The\
    \ control performs the following functions in the SQL*Loader process:\n\n+   -\
    \ Shows you where to find the data\n- Supplies the data format\n- Houses configuration\
    \ and setup information\n- Tells you how to manipulate data\n\nActual load data\
    \ can be kept in the file, but this should only be performed for sample or test\
    \ loads. The example shows a control file that contains no input data; an external\
    \ file (invoice_header.dat), which is designed with the INFILE parameter, is used\
    \ to reference this input data. The line numbers to the left are used to identify\
    \ the lines we will be discussing in more detail.\n\n```\n1 Invoice Header Sample\
    \ Control File\n2 Created 10-19-01\n3 LOAD DATA\n4 INFILE 'invoice_header.dat'\n\
    5 BADFILE 'invoice_header.bad'\n6 DISCARDFILE 'invoice_header.dsc'\n7 REPLACE\n\
    8 INTO TABLE invoice_header\n9 WHEN SALSEPERSON (100) = 'EDI'\n10 FIELDS TERMINATED\
    \ BY ',' OPTIONALLY ENCLOSED BY ' '\n11 TRAILING NULLCOLS\n12 (COMPNO decimal\
    \ external\n    INV_NO decimal external\n    DISCOUNT_RATE decimal external \\\
    discount_rate * .90\"\n    DUEDATE date \"YYYYYMMDDH24MISS\"\n    INVDATE date\
    \ \"YYYYYMMDDH24MISS\"\n    CUST_NO char\n    CUST_CAT char NULLIF cust_cat=BLANKS\n\
    \    CO_OBJ decimal\n```"
