  md: "# Chapter 5 · Backup and Recovery Overview\n\n> NOTE\n\nRAID is essentially\
    \ fault tolerance that protects against individual disk crashes. There are multiple\
    \ levels of RAID. RAID 0 implements disk stripping with redundancy. RAID 1 is\
    \ standard disk mirroring. RAID 2-5 offer some form of parity-bit checking on\
    \ separate disks. RAID 5 has become the most popular in recent years, with many\
    \ vendors offering their own enhancements to RAID 5 for increased performance.\
    \ RAID 0+1 has been a longtime fault-tolerance and performance favorite for Oracle\
    \ database configurations. This is due to redundancy protection and strong write\
    \ performance. However, with the new RAID 5 enhancements (performed by some storage\
    \ array vendors to include large caches or memory buffers), the write performance\
    \ has improved substantially.\n RAID 0+1 and RAID 5 both can be viable configurations\
    \ for Oracle databases.\n\n# Undoing Changes to the Database\n\nThere are three\
    \ primary ways of undoing changes to the database; one is a manual approach, the\
    \ other two methods use Oracle features to undo the data.\n\n+   - Manually—by\
    \ reexecuting code or rebuilding tables\n- Using Oracle LogMiner to recover dropped\
    \ objects\n- Using a new Oracle9i feature called Flashback Query\n\nWhether it\
    \ is possible to undo changes to the database with the manual approach depends\
    \ on the sophistication of the code releases and the configuration management\
    \ control for the application in question.\n\nIf the configuration control is\
    \ highly structured with defined release schedules, then undoing changes may not\
    \ be necessary. A highly structured release schedule would reduce the possibility\
    \ of data errors or corrupted-data objects.\n\nOn the other hand, if the release\
    \ schedule tends to be unstructured, the potential for data errors from developers\
    \ can be higher. It is a good idea to prepare for these issues in any case. A\
    \ full export can be done periodically, which would give the DBA a static copy\
    \ of all the necessary objects within a database. Although exports have limitations,\
    \ they can be useful for repairing data errors because individual users and tables\
    \ can be extracted from the export file. Additionally, individual tablespace backups\
    \ can be performed more frequently on high-use tablespaces."
