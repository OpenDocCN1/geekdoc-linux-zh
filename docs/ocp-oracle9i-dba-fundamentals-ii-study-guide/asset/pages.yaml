- img_proc: true
  md: '# # Using init.ora Parameters for Multiple Archive Processes and Locations


    The capability to have more than one archived log destination and multiple archives
    was first introduced in Oracle8 and 9i, more than two destinations can be used,
    providing even greater archived log redundancy.


    The main reason for having multiple destinations for archived log files is to
    eliminate any single point of failure. For example, if you were to lose the disk
    storing the archived logs before they were backed up to tape, the database would
    be vulnerable to data loss in the event of a failure. If the disk containing the
    archived logs was lost, then the safest thing to do would be to run a backup.
    This would ensure that no data would be lost in the event of a database crash
    from media failure. Having only one archived log location is a single point of
    failure for the backup process. Hence, Oracle has provided multiple locations,
    which can be on different disk drives, so that the likelihood of archived logs
    lost is significantly reduced. See Figure 7.2, which demonstrates ARCHIVELOG mode
    with multiple destinations.


    In addition to reducing the potential archived log loss, one of the multiple locations
    can be remote. The remote location supports the Oracle standby database, which
    is an option that can be configured to protect a computing site from a disaster.
    Let''s go over a brief explanation of this option and why it can require archived
    log capabilities.


    The Oracle standby database can require archived logs to be moved to a remote
    server, which is running a copy of the production database. This copy of the production
    database is in a permanent recovery situation with archived logs from the production
    database regularly being applied to the standby database.


    There are certain initialization parameters that can be used to ensure that the
    archived logs get moved to remote locations. These initialization parameters will
    be covered in more detail in the upcoming section "Remote Archived Log Locations."'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# FIGURE 7.2 ARCHIVOG mode with multiple destinations


    ![](img/a183fd041839741f5ab6df3caffc6b52_275_0.png)


    Note: log_archive_dest_1 and log_archive_dest_2 init.ora parameters work in conjunction
    with other, as do the log_archive_dest and log_archive_duplex_dest


    # Multiple Archive Processes and Locations


    Having multiple archive processes can make the archived log creation faster. If
    significant volumes of data are going through the redo logs, the archiver can
    be a point of contention. This means that redo logs could wait or delay database
    activity while trying to write out an archived log. Furthermore, the archiver
    has more work to do if the database is writing to multiple destinations. Thus,
    multiple archive processes can do the extra work to support the additional archive
    destinations.


    To implement these new features, the database must be in ARCHIVELOG mode. (To
    set the database to ARCHIVELOG mode, perform the steps shown earlier in the section
    entitled "Configuring a Database for ARCHIVELOG mode and Automatic Archiving.")
    To verify that the database is in ARCHIVELOG mode, either run an ARCHIVE LOG LIST
    command or query the V$DATABASE view, as shown earlier.'
  merge: -1
