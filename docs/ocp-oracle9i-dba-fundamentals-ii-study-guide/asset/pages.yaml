  md: 'After you have completed all of this, you must save your changes by choosing
    Save Network Configuration from the File menu. This creates and saves the tnsnames.ora
    file.


    # Contents and Structure of the tnsnames.ora File


    Here is an example of the tnsnames.ora file that you created above:


    ```

    # D:\ORACLE\ORA90\NETWORK\ADMIN\TNSNAMES.ORA

    # Configuration

    # File:D:\Oracle\Ora90\NETWORK\ADMIN\tnsnames

    # Generated by Oracle Net Manager

    ```


    ```

    DBA =

    (DESCRIPTION =

    (ADDRESS_LIST =

    (ADDRESS = (PROTOCOL = TCP)(HOST = gr99c0073)

    (PORT = 15221))

    )

    (CONNECT_DATA =

    (SERVICE_NAME = DBA)

    )

    )

    ```


    Table 3.1 summarizes the parameters in the tnsnames.ora file.


    # TABLE 3.1 tnsnames.ora Parameters


    | Parameter | Description |

    | Description | Starts connect descriptor section of file. |

    | Address_list | Starts a list of all connect descriptor address information.
    |

    | Address | Specifies connect descriptor for net service name. |

    | Protocol | Specifies protocol used, such as TCP/IP. |'
