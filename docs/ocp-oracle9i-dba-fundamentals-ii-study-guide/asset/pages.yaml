    (ADDRESS5=(PROTOCOL=TCP)(HOST=gr0073)(PORT=1521))

    OK (270 msec)

    OK (40 msec)

    OK (30 msec)


    The tnping utility shows how long the round trip took to contact the listener.
    This information can also assist you in uncovering the connection problem, as
    the accompanying sidebar reveals.


    ![](img/a183fd041839741f5ab6df3caffc6b52_167_0.png)


    # Real World Scenario


    # The Mysterious Timeout Problem


    I have used tnping to help troubleshoot very interesting connection problems.
    One problem involved a client who was experiencing intermittent connection timeouts.
    Sometimes the client could connect, but other times the client received a timeout
    error. The client also reported that it always took an inordinate amount of time
    to log in to the Oracle server.


    This problematic client machine happened to be sitting adjacent to another client
    machine that had no connection or timeout problems whatsoever. I ran some connection
    tests with tnping and discovered that the client having problems took on average
    3000 milliseconds to connect to the listener while the other client took only
    30 milliseconds were using the same network routes to connect to the server.


    After further investigation, I discovered that the machines were using different
    implementations of TCP/IP. This was the intermittent timeout problems. With the
    help of the tnping utility, I was able to narrow down the problem to a difference
    in the client machine configurations.


    # Verify Localnaming Configuration Files


    If the client is using the localnaming method for net service resolution, check
    the entries in the tnames.ora file. Make sure the entries are syntactically correct
    and that there is an entry for the net service name. Also make sure the protocol
    is correct.'
