    | Startup Wait Time | STARTUP_WAIT_TIME | Defines how long listener will wait
    before it responds to a STATUS command in the 1snrctl command utility. |

    | Unavailable from Net Manager | CONNECT_TIMEOUT | Defines how long listener will
    wait for a valid response from a client once a session is initiated. The default
    is 10 seconds. |

    | Unavailable from Net Manager | SAVE_CONFIG_ON_STOP | Specifies whether modifications
    made during an 1snrctl session should be saved when exiting. |

    | Log File | LOG_FILE-Will not be in listener.ora if default setting is used.
