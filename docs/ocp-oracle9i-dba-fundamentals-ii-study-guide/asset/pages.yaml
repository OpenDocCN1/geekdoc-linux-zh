- img_proc: true
  md: '# Instance Recovery in a Distributed Database Environment


    Let''s look at a real-life example to determine the circumstances that can cause
    data loss even though Oracle instance recovery accounts for all data loss properly.


    A small manufacturing company generates their manufacturing information on an
    Oracle database. This database keeps track of raw materials, work in progress,
    and finished products. In order to complete the work required of it, the database
    needs to be available throughout the three shifts that the company runs to meet
    customer demand.


    For financial purposes, on a regular basis, information from this manufacturing
    database is transferred to the financial database on another server. This is done
    through a variety of out-of-database transfers, which leaves the data exposed
    until it meanders its way back into the financial database.


    In the midst of one of these transfers, the company experiences a severe power
    spike, which causes the servers to reboot. As a result, instance failure occurs
    on each database because data was in the process of being transferred from the
    manufacturing database to the financial database when the power spike occurred.
    In addition, the database transfer mechanism does not recover the data in transit.


    At this point, the experienced database administrator can see that the issue here
    is a loosely distributed database environment. This could result from the company
    using different vendors for manufacturing and financial applications with customized
    application program interfaces (APIs).'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'Now that the power spike is over, the system administrator must get the servers
    restarted and the database administrator needs to validate that the databases
    are available again. When this is done, the administrators find out that the manufacturing
    database thinks the data has been transferred to financial database, but the data
    never actually made it into the financial data-before the instance failure.


    As a result, the databases are out of synchronization with each other and the
    data inconsistencies must be manually tracked down. The analysts and business
    people must determine what did or didn''t make it to the appropriate database
    by a series of ad hoc SQL statements.


    # Summary


    The recovery structures and processes available in Oracle allow significant recovery
    options for the DBA. These recovery structures consist of files, memory buffers,
    and logical objects that reside in the database. In addition to these recovery
    structures, this chapter also identified the file structures—redo logs, archived
    logs, control files, data files, and parameter files—and the processes, which
    are PMON, SMON, LGWR, CKPT, and ARC. It discussed the memory structures, which
    consist of log buffers and data buffers. All of these structures play different
    roles in the recovery process, and they can be used for different types of recovery.


    This chapter also described the checkpoint concept. During this discussion, you
    learned the importance of SCNs and how these identifiers help determine the consistency
    of the transactions that have been applied to the database.


    In addition, you viewed the three main initialization parameters that you will
    need to tune the instance recovery process. It is through these the DBA can constrain
    the time of the recovery process to certain approximate limits. These parameters
    can be monitored by a series of VS views.


    This chapter lays the groundwork for making decisions in the backup and recovery
    process for later chapters and the real world. It is vital that you understand
    how the file structures and process are discussed in this chapter function to
    make the database consistent or inconsistent in a failure'
  merge: -1
  pgno: 252
- img_proc: true
  md: '# Exam Essentials


    situation. These topics can be thought of as the building blocks of the backup
    and recovery processes.


    Identify the Oracle background processes involved in recovery. There are five
    background processes involved with recovery. These processes are as follows: log
    writer (LGWR) writes redo logs, system monitor (SMON) is involved with instance
    recovery, process monitor (PMON) performs recovery of process failure, checkpoint
    (CKPT) performs checkpointing of database files, and archiver (ARC) copies online
    redo logs to archived logs.


    Identify the Oracle memory structures that are involved in recovery. There are
    two memory structures involved in the recovery process. The log buffers are the
    memory buffers that record changes to redo logs, and the data block buffers store
    all the cached data, which is queried and modified by users.


    Identify the Oracle file structures involved in recovery. The file structures
    related to recovery include the online redo logs, archived logs, control files,
    data files, and parameter files. These files make up the physical components of
    the Oracle database.


    Understand the checkpoint process. The checkpoint process interacts with redo
    logs, archived logs, and data file headers to synchronize the database with SCNs.
    Checkpoints occur due to log switches, dirty block buffers, system commands, and
    initialization parameters.


    Understand the difference between archived logs and redo logs. Redo logs contain
    transactional log information that will get written over. Archived logs are copies
    of the redo logs before the redo logs are written over. Archived logs are used
    to recover the database.


    Identify the fast recovery techniques. You should understand the concept of bound
    time recovery and be able to use initialization parameters to define recovery
    time and to monitor this process with the V$ systems. The two initialization parameters
    that help define instance recovery are FAST_START_MTTR_TARGET and FAST_START_PARALLEL_ROLLBACK.'
  merge: -1
