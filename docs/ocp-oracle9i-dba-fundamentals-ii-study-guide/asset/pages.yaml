  md: '![](img/a183fd041839741f5ab6df3caffc6b52_505_0.png)


    he Oracle SQL*Loader utility is a tool designed to load exter-

    data into the Oracle database. This utility loads data from an external file

    format into tables within an Oracle database.


    SQL*Loader has three primary ways it uses to load data: a conventional

    three primary ways it uses to load data: a conventional

    oad, a direct-path load, or an external-path load. Each of these load methods

    is designed for a different usage.


    We will also demonstrate a Data Manipulation Language (DML) state-

    called direct-path insert. This is not actually part of SQL*Loader, but

    is similar to the SQL*Loader direct-path load method.


    Finally, we will list some guidelines that explain the best ways to use

    SQL*Loader. We will outline each topic and briefly discuss each guideline.


    It is important to conquer the topics covered in this chapter as you prepare

    for the test. In addition, this practice has a practical application in the

    workplace. SQL*Loader can be a valuable utility for multiple uses including

    moving data from one database to another, making backups of tables, and

    performing maintenance operations. Familiarity with this tool is a valuable

    asset to any DBA.


    # # Using Direct-Load Insert Operations


    The direct-load insert operation is not actually a function of the

    SQL*Loader utility. Instead, this operation is a DML command, which can

    be performed within the database using SQL*Plus. The direct-load insert has

    similarities to the SQL*Loader direct-path load, which we will discuss in

    more detail in the next section, “Using SQL*Loader.” Both the direct-load

    insert and SQL*Loader direct-path load will bypass the buffer cache and'
  merge: -1
  pgno: 505
- img_proc: true
  md: '# Using Direct-Load Insert Operations 445


    write directly to blocks within the tables you are loading. This functionality
    allows both of these operations to be extremely fast.


    Direct-load insert comes in two flavors: serial direct-load insert and parallel
    direct-load insert. Serial direct-load insert is the normal operation that uses
    one server process to insert data beyond the high-water mark. Serial direct-load
    insert can be used on unpartitioned, partitioned, and subpartition tables. Below
    is an example of serial direct-load insert.


    ```

    SQL> INSERT /*+ APPEND / INTO T1_NEW

    1> NOLOGGING

    2> SELECT * FORM T1

    3> COMMIT;

    ```


    The second type of direct-load insert is called parallel direct-load insert. Parallel
    direct-load insert is the same DML insert operation as serial direct-load insert,
    but in this case, the statement or table is put into parallel mode. This description
    implies that the database must be configured for parallel operations, which means
    you must have parallel queries configured in your initialization parameters. (This
    topic is covered in more detail in OCP: Oracle9i Performance Tuning Study Guide,
    by Joseph C. Johnson [Sybase, 2002].


    Furthermore, you must enable DML for the session in which you will be performing
    the parallel direct-load insert. You will do this with the ALTER SESSION ENABLE
    DML command. After you have used this command, you must enable a hint or place
    the table to be inserted into parallel mode. A hint is created with a multiple
    line comment with a plus symbol, such as /*+ PARALLEL (TEST.T1_NEW, 4) /. A hint
    is a mechanism that influences the explain path of how the query performs in a
    certain way. Alternatively, you can enable the table T1_NEW to be in degree of
    parallel 4 with the following command: ALTER TABLE T1_NEW PARALLEL (DEGREE 4).


    The parallel direct-load insert causes multiple server processes to break up the
    insert into multiple temporary segments, and it also causes the parallel coordinator
    to merge the temporary segments into the table. Below is an example of parallel
    direct-load insert statement.


    ```

    SQL> ALTER SESSION ENABLE PARALLEL DML;

    SQL> INSERT /*+PARALLEL (TEST.T1_NEW, 4) / INTO T1_NEW

    1> NOLOGGING

    2> SELECT * FORM T1

    3> COMMIT;

    ```'
  merge: -1
