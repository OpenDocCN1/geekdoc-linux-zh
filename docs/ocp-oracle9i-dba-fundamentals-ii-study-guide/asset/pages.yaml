  md: '# Glossary 487


    redo file See redo logs.


    redo logs The redo buffers from the SGA are periodically copied to the redo logs.
    Redo logs are critical to database recovery. They record all changes to the database,
    whether the transactions are committed or rolled back. Redo logs are classified
    as online redo logs or offline redo logs (called archived logs), which are simple
    copies of online redo logs. There are also current redo logs that are being actively
    written to, and non-current redo logs that are not actively written to.


    redo record A group of change vectors. Redo entries record data that you can use
    to reconstruct all changes made to the database, including the rollback segments.


    Redundant Array of Inexpensive Disks (RAID) The storage of data on multiple disks
    for fault tolerance, and to protect against individual disk crashes. If one disk
    fails, then the disk can be rebuilt from the other disks. RAID has many variations
    to redundant store data on separate disks, the most popular of which are termed
    RAID 0 through 5.


    refuse packet A packet sent via TCP/IP that acknowledges the refusal of some network
    request.


    registering The process of using the REGISTER command, which is required so that
    RMAN can store information about the target database in the recovery catalog.


    Report commands These RMAN commands provide queries of the catalog that are more
    detailed than lists and tell you what may need to be done.


    request queue A location in the SGA in an Oracle Shared Server environment where
    the dispatcher process places client requests. The shared server processes then
    process these requests.


    RESETLOGS The process that resets the redo logs'' sequence number.


    resetting Updating the recovery catalog for a database that has been opened with
    the ALTER DATABASE OPEN RESETLOGS command.


    response queue The location in the SGA in an Oracle Shared Server environment
    where a shared server places a completed client request. The dispatcher process
    then picks up the completed request and sends it back to the client.'
  merge: -1
  pgno: 548
