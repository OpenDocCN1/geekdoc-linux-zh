- img_proc: true
  md: '![](img/a183fd041839741f5ab6df3caffc6b52_183_0.png)


    # Shared Server Configuration


    As the number of users connecting to Oracle services in the enterprise environment
    grows, the system requirements of the servers increase—particularly the memory
    and process requirements. This chapter discusses the Oracle Shared Server option
    (formerly known as Oracle Multithreaded Server) and its benefits. In addition,
    you will learn the steps of the connection process, how to configure the Shared
    Server option, and how user requests are processed in a shared server environment
    using various Oracle data dictionary views. You will also learn how to manage
    the shared server environment how to configure clients to request dedicated connections
    when you are connecting to an Oracle database configured with Shared Server. Finally,
    you will learn where to find information to assist you in tuning the Shared Server.


    It is important for the database administrator to understand the Shared Server
    architecture and how and when it is appropriate to utilize this feature. When
    used properly, this feature can help alleviate problems with servers that are
    being taxed in terms of the number of processes running on the server. When the
    Shared Server is configured properly, it can help save off system upgrades that
    may have seemed imminent, thus saving the organization and money.


    Shared Server is an optional configuration of the Oracle server that allows the
    server to support a larger number of concurrent connections without increasing
    physical resource contention requirements. This is accomplished by sharing resources
    among groups of users.'
  merge: -1
  pgno: 183
- img_proc: true
  md: '# Dedicated Server versus Shared Server


    If you have ever gone to a upscale restaurant, you may have had your own personal
    waiter. The waiter is there to greet you and escort you to your seat. The waiter
    will take your order for food and drinks and even help in the preparation of your
    order. No matter how many patrons enter the restaurant, your waiter is responsible
    for serving only your requests. Therefore, your service is very consistent—if
    the person is a good waiter.


    A dedicated server environment works in the same way as Very. Every client connection
    has an associated dedicated server process on the machine that the Oracle server
    exists. No matter how many other connections are made to the server, you always
    have the same dedicated server responsible for processing your requests. You utilize
    the services of that server process until you disconnect from the Oracle server.


    Most restaurants tend to be like shared servers. When you walk in, you are assigned
    a waiter or waitress, but they may have many other tables they are responsible
    for serving. This is good for the restaurant because they can serve more customers
    without increasing the staff. It may be fine for you as well, if the restaurant
    is not too busy and the waiter or waitress is not responsible for too many tables.
    Also, if most of the orders are small, the staff can keep up with the requests
    and the service will be as good as if you had your own waiter.


    In the diner, things work differently; here, the waitress takes your order and
    places it on a turnstile. If the diner has multiple cooks, the order is picked
    up from the turnstile and prepared by one of the available cooks. When the cook
    completes the preparation of the dinner, it is placed in a location where the
    shared server environment works can pick it up and bring it back to your table.


    This is how a shared server environment works, clients share processes on the
    Oracle server. These shared processes are called *dispatchers*. Dispatchers are
    like the waiter or waitress in the diner. A dispatcher can be responsible for
    taking the orders of many clients.


    When you request something from the server, it is the dispatcher''s responsibility
    to take your request and place it in a location called a *request queue*. The
    request queue functions like the turnstile in the diner analogy. There is one
    request queue where all of the dispatcher processes place their client requests.
    The request queue is a structure contained in the System Global Area (SGA).


    Shared server processes, like cooks in a diner, are responsible for fulfilling
    the client requests. The shared server process executes the request and places'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'the result into an area of a SGA called a response queue. Every dispatcher
    has its own response queue. The dispatcher picks up the completed request from
    the response queue and returns the results back to the client. Figure 4.1 depicts
    the processing steps for a Shared Server request shown here:


    +   1. The client passes a request to a dispatcher serving it.

    2. The dispatcher places the request on a request queue in the SGA.

    3. One of the shared server processes executes the request.

    4. The shared server places the completed request on the dispatchers’ response
    queue of the SGA.

    5. The dispatcher picks up the completed request from the response queue.

    6. The completed request is passed back to the client.


    # FIGURE 4.1 Request processing in Shared Server


    ![](img/a183fd041839741f5ab6df3caffc6b52_185_0.png)'
  merge: -1
