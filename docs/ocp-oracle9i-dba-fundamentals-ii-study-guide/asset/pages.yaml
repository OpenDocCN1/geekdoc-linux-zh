- img_proc: true
  md: 'Each connection being served by a dispatcher is bound to a shared memory segment
    and forms a virtual circuit. The shared memory segment is utilized by the dispatcher
    to manage communications between the client and the Oracle server. The shared
    server processes use the virtual circuits to send and receive information to the
    appropriate dispatcher process.


    #  The Role of the Listener in a Shared Server Environment


    The listener plays an important role in the shared server environment. The listener
    is responsible for supplying the client with the address of the dispatcher to
    connect to when a user requests connections to a shared server. The Oracle background
    process PMON notifies the listener as to which dispatcher is responsible for servicing
    this virtual circuit. The listener then aware of the number of connections the
    dispatcher is managing. Information allows the listener to take advantage of dispatcher
    load balancing. Dispatcher load balancing was introduced in Oracle8i.


    Load balancing allows the listener to make intelligent decisions about which dispatcher
    to redirect client connections so that no one dispatcher becomes overwhelmed.
    When the listener receives a connection request, it looks at the current connection
    load for each dispatcher and redirects the client connection request to the least
    loaded dispatcher. By doing so, the listener ensures that connections are evenly
    distributed across dispatchers. When a client connection terminates, the listener
    is updated to reflect the change in the number of connections the dispatcher is
    handling. Figure 4.3 depicts the steps of the shared server connection process
    shown here:


    +   1. The dispatcher processes are spawned when an instance is started.

    2. The client contacts the Oracle server after resolving the service name.

    3. The server redirects the client connection to the least busy dispatcher.

    4. The dispatcher process manages the client server request.

    5. PMON registers connection information with the listener.'
