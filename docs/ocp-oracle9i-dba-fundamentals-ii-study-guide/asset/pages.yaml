  md: '# Recovering after Losing Current Redo Logs


    All transactions between these SCNs are included in these logs. Oracle determines
    what should be recovered by the SCN information that is recorded in transaction
    tables within the rollback segments, control files, and data file headers.


    To perform a change-based recovery, you can use the previous example of incomplete
    database recovery but utilize change-based recovery in place of cancel-based or
    time-based recovery. To do this, restore all the needed data files from a hot
    backup, and then just use the following step 7 instead of the one shown previously.


    +   7. Perform an incomplete recovery using the UNTIL CHANGE clause.

    SQL> recover database until change 60747681;


    # Recovering after Losing Current Redo Logs


    Incomplete recovery is necessary if there is a loss of the current and/or inactive
    unarchived redo log files. In this scenario, it occurs that you don''t have all
    the redo log files up to the point of failure, so the only alternative is to recover
    prior to the point of failure.


    ![](img/a183fd041839741f5ab6df3caffc6b52_404_0.png)


    Oracle has made improvements to compensate for this failure by giving the ability
    to mirror copies of redo logs or to group members on different filesystems.


    Common error messages that might be seen in the alert log are ORA-00255, ORA-00312,
    ORA-00286, and Each of these messages indicates a problem writing to the online
    redo log files.

    To perform incomplete recovery after the redo log files have been lost, you do
    the following:


    +   1. Start Server Manager and execute a CONNECT INTERNAL command.

    SQL> connect / sysdba ;

    2. Execute a SHUTDOWN command and copy all data files.

    SQL>shutdown;

    cp /stage/data01.dbf /oracle/database/tst9/data01.dbf

    cp /stage/system01.dbf /oracle/database/tst9/system01.dbf'
