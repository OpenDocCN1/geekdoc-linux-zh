- img_proc: true
  md: 'of third-party GUI tools and batch commands. More recently, RMAN back-ups have
    become more popular with many sites (since the release of RMAN in Oracle8).


    The fundamentals of backing up an Oracle database can be clearly seen when you
    analyze an OS-based backup. Some of these basic techniques are utilized in the
    hot, or opened, backup examples, and some are used in cold, or closed examples.
    If you have a solid understanding of these concepts, you should fully understand
    the backup process with RMAN-based backups.


    RMAN-based backups can perform the same functions as user-managed backups. But
    RMAN backups tend to be more standardized as a result of their use of a common
    command set. We demonstrated some of the commands that are involved in performing
    various backup operations within RMAN in this chapter.


    User-managed and RMAN-based backups are the two primary methods of backing up
    databases. You will be responsible for at least one of these types of backups,
    if not both, in a real-world DBA job. Understanding how to perform user-managed
    backup and recovery is a necessary prerequisite for understanding RMAN-based backup
    and recovery. This knowledge will help you understand what RMAN is trying to do
    and improve upon.


    # Exam Essentials


    Understand user-managed backup and recovery. User-managed backup and recovery
    is a traditional process that uses OS and database commands to backup and recover
    the database.


    Know the backup issues that are associated with read-only tablespaces. Read-only
    tablespaces have special requirements for backup. If the tablespace was read-only
    at the time of backup, no recovery is needed, but if it was read-write, recovery
    is needed.


    Identify the differences between open and closed backups. A closed backup is taken
    when the database is offline or has been down using all modes other than SHUTDOWN
    ABORT. In an open backup, the database is online or available during the backup
    process. You should also be familiar with the database commands that must be performed
    against the opened database data files can be copied.


    Identify the different types of user-managed control file backups. The two formats
    of control file backups are binary format and ASCII format.'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'Understand what needs to be cleaned up after an online backup fails. The V$BACKUP
    view can be used to see the status of the data files after a failed online backup.
    The V$BACKUP view shows whether a data file is ACTIVE or INACTIVE in the backup
    process.


    Understand how the DBVERIFY utility works to detect corruption. The DBVERIFY utility
    works on online and offline data files to identify corrupted blocks.


    Identify the types of RMAN-specific backups. The three types of RMAN backups are
    full/incremental, open/closed, and consistent/inconsistent.


    Understand the difference between backup sets and image copies. Backup sets are
    backups that are stored in a specific RMAN format; image copies are just backups
    of actual database files in the same format as the OS. You should also be familiar
    with the BACKUP command options and formats.


    Know how to use RMAN commands to backup control files and archived redo logs.
    You should know how to use all of the necessary RMAN commands with the proper
    syntax to backup control files and archived logs.


    # Key Terms


    Before you take the exam, be certain you are familiar with the following terms:


    +   BACKUP image copies

    backup sets inconsistent backup

    closed backup incremental backup

    consistent backup opened backup

    COPY physical backup

    cumulative incremental backup read-only tablespace

    DBVERIFY utility read-write tablespace

    differential incremental backup third mirror

    full backup whole database backup'
