  md: 'incomplete database recovery requires an understanding of the redo log and
    ARCHIVELOG processes, the synchronization of the Oracle database, and the options
    allowed for performing an incomplete recovery. This chapter discusses the incomplete
    recovery process and the commands associated with each incomplete recovery option.
    It also includes an example that shows how to perform an incomplete recovery due
    to lost or corrupted log files.


    In addition to the user-managed incomplete recovery, this chapter demonstrates
    how to use RMAN for this process. The RMAN examples covered how to use the SET
    UNTIL TIME AND UNTIL SEQUENCE clauses.


    Incomplete recovery is the only method of recovery for certain types of failures.
    It is important that you understand when and how to use incomplete recovery methods.
    Anytime there is a failure that will cause you not to apply all the changes back
    to the databases, you will need to use one of the incomplete recovery methods
    that will be discussed in this chapter.


    # # Describing the User-Managed Incomplete Recovery


    Incomplete recovery occurs when the database is not recovered entirely to the
    point at which the database failed. This is a partial recovery of the database
    in some archived logs are applied to the database, but not all of them. With this
    type of recovery, only a portion of the transactions gets applied.


    There are three types of incomplete media recovery:

    - Cancel-based

    - Time-based

    - Change-based'
  merge: -1
  pgno: 397
- img_proc: true
  md: '# Describing the User-Managed Incomplete Recovery 337


    Each of these options allows recovery to a point in time prior to the failure.
    The main reason why there are three options is so that the DBA can have better
    flexibility and control of where recovery is halted during the recovery process.
    Each of these options is described in detail in the next section.


    Incomplete recovery is performed any time you don''t want to apply the archived
    and nonarchived log files that are necessary to bring the database up to the time
    of failure. As a result, the database is essentially not-recovered; transactions
    remain missing. Figure 11.1 illustrates the different types of incomplete recovery.


    # FIGURE 11.1 Incomplete recovery in ARCHIVELOG mode for a media failure on January
    28th


    ![](img/a183fd041839741f5ab6df3caffc6b52_398_0.png)


    Database CRASH

    Media failure

    Database backupn1-Jan-02 --- 7-Jan-02 --- 14-Jan-02 --- 28-Jan-02

    Arch11.log

    Arch21.log

    Arch38.log

    Arch53.log

    Recover database

    until change *6,748;

    Recover database

    until time ''2002-1-25-13:00:00'';

    Recover database

    until cancel;

    6,748 is system change number in Arch37.log


    Incomplete recovery should be performed when the DBA wants or is required to recover
    the database prior to the point of time the database failed. Some of the circumstances
    that might call for this type of recovery include data file corruption, redo log
    corruption, or the loss of a table due to user error.'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Performing an Incomplete Database Recovery


    In some cases, incomplete recovery is the only option available to you. A failure
    situation involves the loss or corruption of the current and archived redo log
    files, recovering the database without the transaction in these files is the only
    option. If a complete recovery were performed instead, the error would be reintroduced
    as a result of the recovery process.


    This section details the three types of incomplete database recovery: cancel-based,
    time-based, and change-based. Each of these methods is used for different circumstances,
    and you should be aware of when each is appropriate.


    # Cancel-Based Recovery


    In cancel-based recovery, you cancel the recovery before the point of failure.
    Cancel-based recovery provides the least flexibility and control of the stopping
    point during the recovery process. At some point before the recovery is complete,
    you enter the CANCEL command. At this point, recovery halts, and no more archived
    logs are applied.


    The following is a sample of cancel-based incomplete recovery.


    ```

    SQL> recover database until;

    ```


    One example of when you would use a cancel-based incomplete recovery is when you
    need to restore a backup of a lost data file from a hot backup. To do this, you
    perform the following steps:


    +   1. Make sure that the database is shutdown by using SHUTDOWN command from
    SQL*Plus.

    SQL> shutdown abort

    2. Make sure that current copies of the data files, control files, and parameter
    files exist in case there are errors that arise during the recovery process. If
    these files exist, you will be able to restart the recovery process, if needed,
    without introducing any new errors that might have resulted from a previous failed
    recovery.

    3. Make sure that a current backup exists because copied files from the current
    backup will replace the failed data files, online redo log files, or control files.'
  merge: -1
  pgno: 399
- img_proc: true
  md: '4. Restore the data files from the backup location to the proper location.

    You do this by issuing an operating system-command. In

    Unix, you would use a cp command, as in this example:


    ```

    cp /stage/data01.dbf /oracle/database/tst9/data01.dbf

    cp /stage/system01.dbf /oracle/database/tst9/system01.dbf

    cp /stage/rbs01.dbf /oracle/database/tst9/rbs01.dbf

    cp /stage/temp01.dbf /oracle/database/tst9/temp01.dbf

