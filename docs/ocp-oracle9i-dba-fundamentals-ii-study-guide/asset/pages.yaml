    # Summary


    Oracle provides numerous options for backup and recovery, which support varying
    business requirements. These options are founded on some basic principles of database
    file structures required in the backup, restore, and recovery processes. One of
    these principles is that the necessary database file structures are backed up
    on a regular basis so that if necessary, the restore and recovery of these files
    can be performed.


    There are two major categories of failure: non-media and media based failures.
    Understanding these types of failure within these categories will allow you to
    develop a backup and recovery strategy. The result of this strategy is how you
    will respond in a failure situation to best meet the situation at hand.


    It is important to have a solid of understanding of the backup, restore, and recovery
    processes of an Oracle database. Equally important is having an'
