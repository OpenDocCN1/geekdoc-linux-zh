    # Resetting the Recovery Catalog


    Resetting the recovery catalog enables RMAN to work with a database that has been
    opened with the ALTER DATABASE OPEN RESETLOGS command. When you use this command,
    you cause RMAN to make what is called a new incarnation of the target database.
    An incarnation of the target database is a new reference of the database in the
    recovery catalog. This incarnation is marked as the current reference for the
    target database, and all future backups are associated with this incarnation.


    Here is an example of how you would connect to the target database and recovery
    catalog and then reset the database:


    ```

    oracle@octilli:~ > rman target / catalog rman/rman@rcat

    ```


