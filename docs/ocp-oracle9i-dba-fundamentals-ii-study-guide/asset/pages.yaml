    global database name. Databases can now be referred to by more than a single service
    name. |


    # Troubleshooting Client-Side Connection Problems


    The client must be able to contact the computer where the Oracle server is located
    and the listener listening for connections to the Oracle server. The client must
    also be able to resolve the net service name. Let''s take a look at the checks
    that need to be performed on the client to verify connectivity to the Oracle server.


    +   * Can the client contact the server?

    * Can the client see the listener?

    * Verify localnaming configuration files.

    * Do multiple client network configuration files exist?

    * Check network file locations.

    * Check the NAMES_DIRECTORY_PATH parameter.

    * Check the NAMES_DEFAULT_DOMAIN parameter.

    * Check the client protocol adapters.

    * Are there any common client-side error codes?'
  merge: -1
  pgno: 165
- img_proc: true
  md: '# Troubleshooting Client-Side Connection Problems 105


    # Check Client/Server Contact


    Make sure the client can see the host computer. If you are using TCP/IP, you can
    attempt to ping the host computer. Simply type ping and the name of the host.
    If the host is not found, try using the IP address of the host computer instead
    of the hostname. If this works, the problem may be that your hosts file is not
    correct or your domain Name Server does not recognize the host computer name.
    For example, you could ping a computer with the hostname of gr99c0073 as:


    ```

    C:\>ping gr99c0073

    ```


    Pinging gr99c0073 [127.1.10.1] with 32 bytes of data:


    ```

    Reply from 127.1.10.1: bytes=32 time<10ms TTL=128

    Reply from 127.1.10.1: bytes=32 time<10ms TTL=128

    Reply from 127.1.10.1: bytes=32 time<10ms TTL=128

    Reply from 127.1.10.1: bytes=32 time<10ms TTL=128

    ```


    # Check Client/Listener Contact


    Next, check to see if the client can contact the listener. You can use a utility
    called tnsping to verify this. tnsping is an Oracle utility that attempts to contact
    an Oracle listener. It works similarly to ping in that you can enter net service
    name and the number of times to contact the listener. This utility verifies that
    the client can contact the listener. However, it does not verify that the client
    can actually connect to the Oracle server. You can also specify a number of attempts.
    In the example below, three attempts are made to contact the PROD database.


    ```

    C:\>tnsping PROD 3

    ```


    TNS Ping Utility for 32-bit Windows: Version 8.1.5.0.0

    Production on 19-FEB-00

    21:18:25


    (c) Copyright 1997 Oracle Corporation. All rights reserved.'
