- img_proc: true
  md: '# Advantages of Shared Server


    A shared server is used in situations where server resources, such as memory and
    active processes, become constrained. People tend to throw hardware problems like
    these; this will likely remedy the problem, but it may be an unnecessary expense.


    If your system is experiencing these problems, Shared Server allows you to support
    the same or greater number of connections without additional hardware-requirements.
    As a result, Shared Server tends to decrease the overall memory and process requirements
    on the server.


    An average dedicated connection takes roughly two to four megabytes of memory.
    A shared server connection takes about two megabytes of memory. As you can see,
    there will be some overall memory reduction. Also because clients are sharing
    processes, the total number of processes is reduced. These translate into resource
    savings on the server.


    Shared Server is also required to take advantage of certain network options, such
    as connection concentration when using Oracle Connection Manager.


    # Applications Suited to Shared Server


    Shared Server is suitable for “high think” applications. High think applications
    are comprised of small transactions with natural pauses in the transaction patterns.
    These types of applications are good candidates for shared server connections.
    An example of a high think application would be an order entry system. Order entry
    systems tend to have small transactions with natural pauses in the work pattern
    of entering the information.


    # Drawbacks of Shared Server


    Applications that generate a significant amount of network traffic or result in
    large result sets are not good candidates for shared server connections. Think
    of the diner analogy from the previous discussion. Your service is fine until
    two parties of 12 people show up. Of a sudden, the waitress is overwhelmed with
    work from the same thing in a shared server environment. If requests for large
    quantities of information start going to the dispatchers, the dispatchers can
    become overwhelmed by these large requests, and you may see performance suffer
    for the other clients connected to the dispatcher. This, in turn, will'
  merge: -1
  pgno: 186
- img_proc: true
  md: '# 126 Chapter 4 · Configuring the Shared Server Option


    increase your response times. Dedicated processes serve better these types of
    applications.


    There are some functions that are not allowed when you are using a shared server
    connection. You cannot start up, shut down, or perform kinds of recovery of an
    Oracle server when you are connected via a shared server.


    # Scalability versus Performance


    Shared Server is a scalability enhancement option, not a performance enhancement
    option. If you are looking for an increase of performance, Shared Server is not
    what you should be configuring. Only use Shared Server if you are experiencing
    the system constraint problems discussed earlier. You will always have equal or
    better performance in a dedicated server environment.


    # Oracle Server Changes in a Shared Server Environment


    When Shared Server is configured, Oracle adds two new types of structures to the
    SGA: request queues and response queues. These structures do not exist in a dedicated
    server environment. There is one request queue for all dispatchers but each dispatcher
    has its own response queue. So if you have four dispatchers, there would be one
    request queue and four response queues. The request queue is a location in the
    SGA where the dispatcher places client requests. A shared server process executes
    every request, and then it places the completed result in the dispatchers'' response
    queue.


    You have to configure the number of dispatcher and shared server processes that
    you want to start with the instance starts; you also have to configure the maximum
    number of each of these structures. You will see how to determine the starting
    number of dispatchers and shared server processes.


    In a dedicated environment, each dedicated server segment called a Program Global
    Area (PGA). The PGA is an area of memory where information about each client session
    is maintained. This information includes bind variables, cursor information, and
    the client''s sort area. In a shared server environment, this information is moved
    from the PGA to an area of the SGA called the User Global Area (UGA). You can
    configure a special area of the SGA called the Large Pool to accommodate the bulk
    of the UGA. In older releases of Oracle, the entire UGA was stored in the Shared
    Pool. As of'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Shared Server Configuration 127


    Oracle8, the majority of the UGA can be stored in the Large Pool. You will see
    how to configure the Large Pool later. Figure 4.2 shows how the SGA and PGA structures
    differ between a dedicated and a shared server environment.


    FIGURE 4.2 SGA dedicated server versus Shared Server


    ![](img/a183fd041839741f5ab6df3caffc6b52_188_0.png)


    Dedicated server PGA Shared Server PGA


    ![](img/a183fd041839741f5ab6df3caffc6b52_188_1.png)'
