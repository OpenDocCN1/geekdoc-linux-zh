  md: '# Identifying RMAN-Specific Backups


    There are three types of backups that are supported by the RMAN utility:


    +   - Full or incremental


    +   - Opened or closed


    +   - Consistent or inconsistent


    Each is described in the following sections.


    # Full or Incremental Backups


    The full and incremental backups are differentiated by how the data blocks are
    backed up in the target database. The *full backup* backs up all the data blocks
    in the data files, modified or not. An *incremental backup* backs up only the
    data blocks in the data files that were modified since the last incremental backup.


    The full backup cannot be used as part of an incremental backup strategy. The
    baseline backup for an incremental backup is a level 0 backup. A level 0 backup
    is a full backup at that point in time. Thus, all blocks, modified or not, are
    backed up, allowing the level 0 to serve as a baseline for future incremental
    backups. The incremental backups can be applied with the baseline, or level 0,
    backup to form a full backup some time in the future. The benefit of the incremental
    backup is that it is quicker, because not all data blocks need to be backed up.


    There are two types of incremental backups: differential and cumulative, both
    of which back up only modified blocks. The difference between these two types
    of incremental backups is in the baseline database used to identify the modified
    blocks that need to be backed up.


    The *differential incremental backup* backs up only blocks since the most recent
    backup at the same level or lower. A differential incremental backup will determine
    which level 1 or level 2 backup has occurred most recently and back up only blocks
    that changed since that backup. The differential incremental backup is the default
    incremental backup.


    The *cumulative incremental backup* backs up all data blocks that have changed
    since the most recent backup of the next lowest level—*n*—1 or lower (with *n*
    being the existing level of backup). For example, if you are performing a level
    2 cumulative incremental backup, the backup will copy data'
  merge: -1
  pgno: 330
- img_proc: true
  md: 'blocks only from the most recent level 1 backup. If no level 1 backup is avail-,
    then it will back up all data blocks that have changed since the most recent level
    0 backup.


    ![](img/a183fd041839741f5ab6df3caffc6b52_331_0.png)


    Full backups do not mean the whole or complete database was backed up. In other
    words, a full backup can back up only part of the database and not all data files,
    control files, and logs.


    # Opened or Closed Backups


    The opened and closed backups are differentiated by the state of the target-base
    being backed up. The RMAN opened backup occurs when the target database is backed
    up while it is opened or available for use. This is similar to the non-RMAN hot
    backup that demonstrated earlier in this chapter.

    The RMAN closed backup occurs when the target database is mounted but not opened.
    This means the target database is not available for use during this type of backup.
    This is similar to the non-RMAN cold backup that demonstrated earlier in this
    chapter..


    # Consistent or Inconsistent Backups


    The consistent and inconsistent backups are differentiated by the state of the
    SCN in data file headers and in the control files. The consistent backup is a
    backup of a target database that is mounted but not opened and was shut down with
    either a SHUTDOWN IMMEDIATE, SHUTDOWN TRANSACTIONAL, or SHUTDOWN NORMAL option,
    but not the SHUTDOWN ABORT option. Also, the data-base must not have crashed prior
    to being mounted. This means the SCN information in the data files matches the
    SCN information in the control files.

    The backup is the backup of the target database when it is opened but crashed
    prior to mounting, or when it was shut down with the SHUTDOWN ABORT option prior
    to mounting. This means the SCN informa-tion in the data files does not match
    the SCN information in the control files.


    # Using RMAN’s BACKUP and COPY Commands


    There are two main backup sources that can be the basis for the RMAN recovery
    process: image copies and backup sets.'
  merge: -1
  pgno: 331
- img_proc: true
  md: '# Using RMAN''s BACKUP and COPY Commands 271


    Image copies are actual copies of the database files, archived logs, control files,
    and they are not stored in a special RMAN format—they can be stored only on disk.
    An image copy in RMAN is equivalent to an OS copy command such as cp or dd in
    Unix, or the COPY command in Windows NT/2000/XP. Thus, no RMAN restore processing
    is necessary to make image copies usable in a recovery situation. This can improve
    the speed and efficiency of the restore and recovery process in some cases. An
    image copy is performed by executing the RMAN COPY command.


    On the other hand, database files in backup sets are stored in a special RMAN
    format and must be processed with the RESTORE command before these files are usable.
    This can take more time and effort during the recovery process. Let''s take a
    look at an example of using the BACKUP command, and then we will look at the RMAN
    COPY command in more detail.


    # Using RMAN BACKUP to Create Sets


    The RMAN BACKUP command is used to perform a backup that creates a backup set.
    When you are using the BACKUP command, the target database should be mounted or
    opened. You must manually allocate a channel for the BACKUP command to use during
    the backup process. Below is an example of this command in action. In this example,
    you are backing up the US tablespace and the current control file to a backup
    set.


    ```

    oracle@octilli:/oracle/product/9.0.1/bin > rman

    ```


    Recovery Manager: Release 9.0.1.0.0 - Production


    (c) Copyright 2001 Oracle Corporation. All rights reserved.


    ```

    RMAN> connect target

    connected to target database: ORC9 (DBID=3960695)

    RMAN> run

    2> (allocate channel ch1 type disk;

    3> backup tablespace users

    4> include current controlfile)


    using target database controlfile instead of recovery catalog

    ```'
