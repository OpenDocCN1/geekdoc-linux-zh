    # Conclusions


    The most notable observation about this scenario is that when the database is
    in ARCHIVELOG mode, no data is lost. All data entered after the hot backup into
    the USERS tablespace, but before the failure, is not lost. Only the data file
    users01.dbf must be restored, which takes less time than restoring all the data
    files. Therefore, by applying the archived logs during the recovery process, you
    can salvage all changes that occur after a hot backup of a data file.


    Another equally important feature is that the database can remain open to users
    while the one tablespace and associated data file(s) are being recovered. This
    allows users to access data in other tablespaces of the database not affected
    by the failure.'
