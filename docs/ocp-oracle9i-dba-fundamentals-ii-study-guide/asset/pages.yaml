    An example of viewing a partial init.ora file to display the LOG_ARCHIVE_DEST
    is listed here:


    ```

    ################################################################

    # Partial Sample of Init.ora File

    ################################################################

    ```


    ```

    ##################################################

    # Archive Logging

    ##################################################

    log_archive_start=true

    log_archive_dest=oracle/admin/orc9_%s.log

    log_archive_format=archorc_%s.log

    ```


    # Setting Automatic Archiving


    To configure a database for automatic archiving, you must perform a series of
    steps:


    +   1. Edit the init.ora file and set the LOG_ARCHIVE_START parameter to TRUE.
    This will automate the archiving of redo logs as they become full.


    +   2. Shut down the database and restart the database by using command START
    MOUNT.


    +   3. Use the ALTER DATABASE ARCHIVELOG command to set ARCHIVELOG mode.


    +   4. Open the database with the ALTER DATABASE OPEN command.


    To verify that the database is actually archiving, you should execute the ALTER
    SYSTEM SWITCH LOGFILE command. After you execute this command, check the OS directory
    specified by the parameter LOG_ARCHIVE_DEST to validate that archived log files
    are present. You can also execute the ARCHIVE LOG LIST command to display information
    that confirms the database is in ARCHIVELOG mode and automatic archiving is enabled.

    Now lets walk through this process.'
