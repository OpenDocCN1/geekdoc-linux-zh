  md: '# Restoring Data Files to Different Locations


    Restoring data files to a different location in both ARCHIVELOG mode and NOARCHIVOG
    mode can be performed in a similar manner. The main difference is that like any
    NOARCHIVOG mode recovery, the database in most cases cannot be completely recovered
    to the point of failure. The only time a database can be completely recovered
    in NOARCHIVOG mode is when the database has not cycled through all of the online
    redo logs since the last complete backup.


