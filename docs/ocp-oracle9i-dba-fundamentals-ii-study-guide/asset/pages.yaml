    # Knowing Your Backup and Recovery Resources


    The personnel, hardware, and software resources available to the business also
    affect the backup and recovery strategy. Personnel resources would include at
    least adequate support from a database administrator (DBA), system administrator
    (SA), and operator. The DBA would be responsible for the technical piece of the
    backup, such as user-managed scripts or Recovery Manager (RMAN) scripts. A user-managed
    backup is an OS backup written in an OS scripting language, such as the Korn shell
    in the Unix OS. RMAN is an automated tool from Oracle that can perform the backup
    and recovery process. The SA would be involved in some aspects of the scripting,
    tape backup software, and tape hardware. The operator might be involved in changing
    tapes and ensuring that the proper tapes are followed.


    The hardware resources could include an automated tape library (ATL), a stand-alone
    tape drive, adequate staging disk space for scripted hot backups and exports,
    adequate archived log disk space, and third disk mirrors. Many storage subsystem
    hardware vendors are offering their own third disk mirror options or equivalents.
    These options create disk copies of 100 gigabytes and greater in just a few minutes.
    All types of disk subsystems should be at least mirrored or use some form of Redundant
    Array of Inexpensive Disks (RAID), such as RAID 5, where performance is not compromised.


    The software resources could include backup software, scripting capabilities,
    and tape library software. The Oracle RMAN utility comes with the Oracle9i Server
    and is installed when selecting all components of Oracle9i Enterprise Server.


    The technical personnel, the DBA and SA at a minimum, are generally responsible
    for informing the management of the necessary hardware and software to achieve
    the desired recovery goals.'
