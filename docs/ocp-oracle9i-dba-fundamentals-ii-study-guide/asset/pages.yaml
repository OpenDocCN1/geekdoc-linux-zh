  md: '# To Our Valued Readers:


    In a CertCities.com article dated December 15, 2001, Oracle certification was
    ranked #2 in a list of the “10 Hottest Certifications for 2002.” This shouldn’t
    come as a surprise, especially when you consider the fact that the OCP program
    nearly tripled in size (from 30,000 to 80,000) in the last year. Oracle continues
    to expand its dominance in the database market, and as companies begin integrating
    Oracle9i systems into their IT infrastructure, you can be assured of high demand
    for professionals with the Oracle Certified Associate and Oracle Certified Professional
    certifications.


    Sybex is proud to have helped thousands of Oracle certification candidates prepare
    for the exams over the years, and we are excited about the opportunity to continue
    providing professionals like you with the skills needed to succeed in the highly
    competitive IT industry.


    Our authors and editors have worked hard to ensure that the Oracle9i Study Guide
    you hold in your hands is comprehensive, in-depth, and pedagogically sound. We’re
    confident that this book will meet and exceed the demanding standards of the certification
    marketplace and help you, the Oracle9i certification candidate, succeed in your
    endeavors.


    Good luck in pursuit of your Oracle9i certification!


    ![](img/a183fd041839741f5ab6df3caffc6b52_8_0.png)


    Neil Edde

    Associate Publisher—Certification

    Sybex, Inc.'
