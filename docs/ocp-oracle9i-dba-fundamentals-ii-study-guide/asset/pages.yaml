  md: '# Accessibility: External Procedures


    OLE DB, Microsoft''s interface to ODBC requires an Open Database Connectivity
    (ODBC) driver to interface as a stand-alone connection solution. For example,
    with the proper Oracle ODBC driver, you can access an Oracle database from programs
    such as Microsoft Excel. (These drivers can be obtained from Oracle or third-party
    vendors.) Because these drivers are generic in nature, they do not provide as
    robust an interface to external services as does the Transparent Gateway.


    In some development efforts, it may be necessary to interface with procedures
    that reside outside of the database. These procedures are typically written in
    a third-generation language, such as C. Oracle Net provides the ability to invoke
    external procedures from Oracle PL/SQL callouts. When a call is made, a process
    will be started that acts as an interface between Oracle and the external procedure.
    This call process defaults to the name extproc. The listener is responsible for
    supplying information, such as a library or procedure name and any parameters,
    to the called procedure. These programs are then loaded and executed under the
    control of the extproc process.


    # The Oracle Net Stack Architecture


    The Oracle Net software is comprised of a series of programs that form a type
    of stack architecture. Each of these programs is responsible for handling various
    aspects of network communications, and each functions as a layer of the stack.
    This section discusses the architecture of the Oracle Net stack and defines the
    responsibilities of each portion. To successfully complete the OCP exam, you need
    to understand the structure and responsibilities of the Oracle Net stack. The
    structure and function of the Oracle Net stack is based on the Open Systems Interconnection
    (OSI) model.


    # The OSI Model


    The Open Systems Interconnection (OSI) model is a widely accepted model that defines
    how data communications are carried out across a network.'
