    The reply indicates that the machine can be seen on the network.


    # Check Database


    Make sure the database is running. Connect to the Oracle server and log in to
    the database using a tool like SQL*Plus. You should first attempt to do a local
    connection, which does not use the Oracle listener.


    Connect to the Oracle server using a local connection, set your ORACLE_SID environment
