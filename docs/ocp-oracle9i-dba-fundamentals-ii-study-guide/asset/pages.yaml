  md: '# # Creating a Recovery Catalog


    As noted earlier, the recovery catalog is an optional feature of RMAN. The catalog
    is similar to the standard database catalog, in that it stores information about
    the recovery process as the database catalog stores information about the database.


    RMAN can be run without the catalog. For this reason, the recovery catalog must
    be stored in its own database, preferably on a server other than the target database
    resides. To enable the catalog, an account with CONNECT, RESOURCE, and RECOVERY_CATALOG_OWNER
    privileges must be created to hold the catalog tables. After this is done, the
    catalog creation script must be executed as the database user RMAN connected to
    the RMAN utility.


    Let''s walk through the steps to create the recovery catalog. This example assumes
    that you have already built a database called rcat in which you plan to store
    the recovery catalog.


    +   1. First, you must select the database where the recovery catalog will reside.
    This is not the target database. In this case, this RMAN database is called rcat.
    In this situation, you will be using the oraenv script (provided by Oracle) to
    switch to other databases on the same server.


    ```

    oracle@octilli:/oracle/product/9.0.1/bin > . oraenv

    orACLE_SID = [rcat] ?

    oracle@octilli:/oracle/product/9.0.1/bin >

    ```


    After you have completed the preceding step, you will need to create the user
    that will store the catalog. To do this, use the name RMAN with the password.
    Make DATA the default tablespace and TEMP the temporary tablespace.


    ```

    oracle@octilli:~ sqlplus /nolog

    ```


