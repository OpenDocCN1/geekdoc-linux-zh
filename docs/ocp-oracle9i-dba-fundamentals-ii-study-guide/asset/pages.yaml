    ![](img/a183fd041839741f5ab6df3caffc6b52_228_0.png)


    # # Real World Scenario


    # ## Driving Adequate Testing with the Service Level Agreement


    Let''s look at this real-life example to determine how much testing is enough
    for recovery preparation.


    Many companies try to reduce implementation and support costs by not allocating
    sufficient resources for testing. In this particular case, a manufacturing company
    is trying to determine how much testing is enough to get by. Up until this point,
    this company had performed all of its data processing on a mainframe-customized
    environment, so the customized Oracle database environment is new to them. As
    a result, when the switched to an Oracle-based environment, they did not set up
    a service level agreement with the information technology (IT) department so that
    their database environment would be maintained properly.


    Because they lacked this service level agreement from customers of the database,
    they did not have the instrument necessary to drive the testing, nor did they
    have the necessary resources to perform testing. Their reasoning for this lack
    of resources was based on the premise that testing is a costly effort, and the
    results of it may never be needed. In this case, it was for the company to justify
    the expense of resources (IT staff and equipment) to perform testing. What this
    company was not aware of, at a minimum, certain recovery tests should be performed
    to validate the backup process and to train the database administration staff
    for certain failures.'
  merge: -1
