    # Server Tracing


    As mentioned earlier, tracing gathers information about the flow of traffic across
    a network connection. Data is transmitted back and forth in the form of packets.
    A packet contains sender information, receiver information, and data. Even a single
    network request may generate a large amount of packets.


    In the trace file, each line of the file starts with the name of the procedure
    executed in one of the Oracle Net layers followed by a hexadecimal number. The
    hexadecimal numbers are the actual data transmitted. If you are not encrypting
    the data, sometimes you will see the actual data after the hexadecimal numbers.


    Each of the Oracle Net procedures is responsible for a different action. Each
    packet has a different code type depending on the action being taken. All of the
    packet types start with NSP. Here is a summary of the common packet types.


    | Packet Keyword | Packet Type |

    |---|---|

    | NSPTAC | Accept |

    | NSPTRF | Refuse |

    | NSPTRS | Resend |

    | NSPDA | Data |

    | NSPCNL | Control |

    | NSPTMK | Marker |


    If you are doing server-to-server communications and have a sqlnet.ora file on
    the server, you can enter information in the Server Information section of the
    Oracle Net Manager tracing screen. This provides tracing information for server-to-server
    communications.


    ![](img/a183fd041839741f5ab6df3caffc6b52_134_0.png)'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'There are also several numeric codes that are used to help diagnose and troubleshoot
    problems with Oracle Net connections. These codes can be found in the trace files.
    Here is an example of a line from the trace file that contains a code value:


    ```

    nspsend: plen=12, type=4

    ```


    Here is a summary of the numeric codes that you could encounter in a trace file.


    | Code | Packet Type |

    |---|---|

    | 1 | Connect packet |

    | 2 | Accept packet |

    | 3 | Acknowledge packet |

    | 4 | Refuse packet |

    | 5 | Redirect packet |

    | 6 | Data packet |

    | 7 | Null packet, empty data |

    | 9 | Abort packet |

    | 11 | Resend packet |

    | 12 | Marker packet |

    | 13 | Attention packet |

    | 14 | Control information packet |


    # Enabling Server Tracing


    You can enable server tracing from the same Oracle Net Manager screens shown earlier.
    Simply choose the Tracing Enabled radio button. The default filename and location
    is ORACLE_HOME/network/trace/listener.trc in Unix and ORACLE_HOME\network\trace\listener.trc
    on Windows/2000. You can set the trace level to OFF, USER, ADMIN, or SUPPORT.
    The USER level will detect specific user errors. The ADMIN level contains all
    of user-level information along with installation-specific errors. SUPPORT is
    the highest level and can be used to produce information that may be beneficial
    to Oracle'
