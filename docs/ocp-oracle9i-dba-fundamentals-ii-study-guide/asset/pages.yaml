  md: '# A


    **Application layer** A layer of the Oracle Net stack that interacts with the
    user. This layer accepts commands and returns data.


    **archived logs** Also known as offline redo logs. Logs that are copies of the
    online redo logs and are saved to another location before the online copies are
    reused.


    **ARCHIVELOG mode** A mode of database operation. When the Oracle data-base is
    in ARCHIVELOG mode, the online redo log files are copied to another location before
    they are overwritten. These archived log files can be used for point-in-time recovery
    of the database. They can also be used for analysis.


    **archiver process (ARCn)** Performs the copying of the online redo log files
    to archived log files.


    **ARCn** See archiver process (ARCn).


    **ATL** See automated tape library (ATL).


    **automated tape library (ATL)** A tape device that can interface with RMAN and
    can automatically store and retrieve tapes via tape media software.


    **automatic archiving** The automatic creation of archived logs after the appropriate
    redo logs have been switched. The LOG_ARCHIVE_START parameter must be set to TRUE
    in the init.ora file for automatic archiving to take place.


    **automatic channel allocation** This type of channel allocation is performed-bysettingtheRMANconfigurationattherMANcommandprompt.
    This is done by using the CONFIGURE DEFAULT DEVICE or CONFIGURE DEVICE command.


    **AVAILABLE** The RMAN command used to make a backup set available or accessible
    in the RMAN repository.'
  merge: -1
  pgno: 531
- img_proc: true
  md: '# B


    **BACKUP** The RMAN command is used to perform a backup that creates a backup
    set.


    **backup and recovery strategy** The backup and recovery plan for an organization''s
    databases, applications, and systems that is formalized and agreed upon by the
    required groups in the organization.


    **BACKUP CONTROLFILE TO TRACE** A create control file command, which makes an
    ASCII backup of the binary control file, which can then be executed to re-create
    the binary control file. The BACKUP CONTROLFILE is dumped as a user trace file.
    This file can be viewed, edited, and run as a script after you edit the comments
    and miscellaneous trace information.


    **backup piece** A physical object that stores data files, control files, or archived
    logs and resides within a backup set.


    **backup script** A script written in different OS scripting languages, such as
    Korn or C shell in the Unix environments.


    **backup set** A logical object that stores one or more physical backup pieces
    containing data files, control files, or archived logs. Backup sets must be processed
    with the RESTORE command before these files are usable.


    **bad log** A SQL* Loader which documents records where rejected by the Oracle
    database or SQL*Loader because they had an invalid format or unique key violations,
    or because they have a required field that was null.


    **bequeath connection** A connection type in which control is passed directly
    to a dedicated spawned process or a dispatched process. No redirection required.


    **block** The smallest unit of storage in an Oracle database. Data is stored in
    the database in blocks. The block size is defined at the time of database creation
    and is a multiple of the operating system block size.


    **block corruption** A block within the database that is corrupt.


    **bounded time recovery** Instance recovery that the DBA controls or puts on the
    time that it takes for an instance to recover after instance failure.'
  merge: -1
  pgno: 532
- img_proc: true
  md: '# C


    cancel-based recovery Atypeof incomplete recovery that is stopped when the DBA
    executes a CANCEL command during a manual recovery operation.


    cataloging Storing information in the Recovery Manager catalog. This is done by
    issuing the RMAN CATALOG command.


    CHANGE The RMAN command used to change the status of a backup set to either AVAILABLE
    or UNAVAILABLE.


    change-based recovery A type of incomplete recovery that is stopped by a number
    designated when the recovery is initiated.


    change vector See redo log entry.


    channel allocation Allocating a physical device to be associated with the server
    session.


    checkpoint The process of updating the SCN in all the data files and control files
    in the database in conjunction with all necessary data blocks in the data buffers
    being written to disk. This is done for the purposes of ensuring data consistency
    and synchronization.


    checkpointing See checkpoint.


    checkpoint process (CKPT) The checkpoint process updates the headers of data files
    and control files; the actual blocks are written to the file by DBWn process.


    CKPT See checkpoint process (CKPT).


    closed backup A backup that occurs when the target database is closed or shut
    down. This means that the target database is not available for use during this
    type of backup. This is also referred to as an offline or cold backup.


    cold backup See closed backup.


    commit To save or permanently store the results of a transaction to the database.


    complete recovery A recovery situation in which no data is lost.'
  merge: -1
  pgno: 533
- img_proc: true
  md: '# Glossary 473


    CONFIGURATION parameters The parameters that determine the RMAN settings.


    **consistent backup** A backup of a target database that is mounted but not opened
    and was shut down with either SHUTDOWN IMMEDIATE or SHUTDOWN NORMAL option, but
    not with SHUTDOWN ABORT. The database files are stamped with the same SCN at the
    same point in time. This occurs during a cold backup of the database and no recovery
    is needed.


    **control file (database)** The file that stores the RMAN repository information
    and records the physical information about the database. The control file contains
    the database name and timestamp of database creation, along with the name and
    location of every data file and redo log file.


    **control file (*Loader)** The logic behind the data load that determines how
    and what data will be loaded. This is the SQL*Loader control file, not to be confused
    with the database control file.


    **conventional-path export** The standard export that goes through the SQL-evaluation
    layer.


    **conventional load** The conventional load is the default load process for SQL*Loader.
    The conventional load builds a bind array, and when this array is full, a SQL
    insert statement is executed.


    **COPY** The RMAN command that performs an image copy.


    **CROSSCHECK** The RMANcommandusedotcompareRMANrepository to the stored media
    backups.


    **cross checking** The process of comparing the RMAN repository with the media
    backups that are stored using the CROSSCHECK command.


    **cumulative incremental backup** Back ups only the data blocks that have changed
    since the most recent backup of the next lowest level—$n-1$ or lower (with $n$
    the existing level of backup).


    **current online redo logs** Logs that are actively being written to by the LGWR
    process.'
  merge: -1
  pgno: 534
- img_proc: true
  md: '# D


    **database** The physical structure that stores the actual data. The Oracle server
    consists of the database and the instance.


    **database buffer cache** The area of memory that caches the database data. It
    holds the recent blocks that are read from the database files.


    **database buffers** See *data buffers*.


    **database writer process (DBWn)** The DBWn process is responsible for writing
    the changed database blocks from the SGA to the data file. There can be up to
    10 database writer processes (DBW0 through DBW9).


    **data block** See *block*.


    **data block buffers** Memory containing data blocks that get flushed to disk
    if modified and committed.


    **data dictionary** A collection of database tables and views that contain metadata
    about the database, its structures, its privileges, and its users. Oracle accesses
    the data dictionary frequently during the parsing of SQL statements.


    **data file (database)** The data files or data files in a database contain all
    the database data. A data file can belong to only one database and tablespace.


    **data file (SQL*Loader)** The data file, input data, or infile describe the same
    file, one that contains the raw data that is loaded in SQL*Loader.


    **DBVERIFY utility** An Oracle utility used to determine whether data files have
    corrupt blocks.


    **DBWn** See *database writer process (DBWn)*.


    **dedicated server** Type of connection in which every client connection has an
    associated dedicated server process on the machine where the Oracle server exists.


    **degree of parallelism** The number of parallel processes you choose to enable
    for a particular parallel activity such as recovery.'
  merge: -1
