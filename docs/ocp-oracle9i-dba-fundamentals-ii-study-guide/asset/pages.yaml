  md: '![](img/a183fd041839741f5ab6df3caffc6b52_151_0.png)


    Once the Oracle server is properly configured, you can focus on getting the clients
    configured to allow for connectivity to the Oracle server. This chapter details
    the basic network elements of Oracle client configuration. It discusses the different
    types of service name models you can choose from when creating service names.
    In addition, it details available resource resolution configurations and how to
    configure hostnaming and localnaming using the Oracle Net Manager. It also discusses
    the types of client-side failures that can happen and how to troubleshoot client-side
    connection problems.


    It is important to understand how to configure the Oracle clients for connectivity
    to the Oracle servers. Without proper knowledge of how to configure the client,
    you are limited in your connection choices to the server. The DBA must understand
    the network needs of the organization and the type of connectivity that is required,
    client/server connections versus 3-tier connectivity, for example, in order to
    make the appropriate choices about client-side configuration. This chapter should
    help clarify the client-side connectivity options available to you and how to
    troubleshoot client connection problems.


    # # Client-Side Name Resolution Options


    When a client needs to connect to an Oracle server, the client must supply three
    pieces of information: their user ID, password, and service name. The net service
    name provides the necessary information, in the form of a connect descriptor,
    to locate an Oracle server in the network.


    This connect descriptor describes the path to the Oracle database and its service
    name, which is an alias for an Oracle database. This information is kept in different
    locations depending on the names resolution method that you choose. The three
    methods of net service name resolution are hostnaming, localnaming, and the Oracle
    Internet Directory. Normally, you will choose just one of these methods, but you
    can use any combination.'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'The Oracle Names Server is still available in Oracle9i, although no further
    development is being done for the Oracle Names Server. The Oracle Names Server
    is being replaced by the Oracle Internet Directory as the preferred names resolution
    method for large Oracle networks.


    Choosing hostnaming is advantageous when you want to reduce the amount of configuration
    work necessary. However, there are a few prerequisites that you must consider
    before you use this option; we will talk about these and discuss configuring this
    method for use shortly. It is typically used in small networks that have few Oracle
    servers to maintain.


    Localnaming is the most popular names resolution method used. This method involves
    configuring the tnsnames.ora file, which contains the connect descriptor to resolve
    the net service names. You will see how to configure localnaming after the discussion
    of hostnaming that follows.


    Oracle Internet Directory is advantageous when you are dealing with complex networks
    that have many Oracle servers. When the DBA chooses this method, they will be
    able to configure and manage service names and connect descriptor information
    in a central location. It is important to understand that Oracle Internet Directory
    is available, in-depth knowledge of this option is not necessary for success on
    the OCP exam.


    # The Hostnaming Method


    In small networks with few Oracle servers to manage, you can take advantage of
    the hostnaming method. Hostnaming saves you from having to do configuration work
    on the clients, although it has limitations. There are four prerequisites for
    using hostnaming:


    +   * You must use TCP/IP as your network protocol.


    +   * You must not use any advanced networking features, such as Oracle Connection
    Manager.


    +   * You must have an external naming service, such as DNS, or have a HOSTS file
    available to the client.


    +   * The listener must be set up with the GLOBAL_DBNAME parameter equal to the
    name of the machine.'
  merge: -1
  pgno: 152
- img_proc: true
  md: '# Configuring the Hostnaming Method


    By default, Oracle will only attempt to use the hostnaming method from the client
    after it attempts connections using localnaming. If you want to override this
    default search path for resolving names, the NAMES.DIRECTORY_PATH parameter in
    the sqlnet.ora file on the client that it searches for hostnaming only. You can
    configure this parameter using the Oracle Net Manager (see Figure 3.1).


    To configure the parameter using Oracle Net Manager, choose Profile from the Local
    tab and select Naming from the drop-down list at the top of the screen. This brings
    up a list of naming methods that are available. The Selected Methods list displays
    the naming methods used and the order in which the methods are used to resolve
    service names. The Available Methods list displays methods that have not been
    included in the selected methods.


    To change the list of available methods, use your mouse to highlight a method
    name and click the arrow key (>) to include it in the list of selected methods.
    You can remove a method by selecting it in the list of selected methods and clicking
    the other arrow key (<). You can also use the Demote and Promote buttons to change
    the order of the list. Select a name from the Selected Methods list and click
    the Demote button to move the name down the list or click the Promote button to
    move the name up the list. Make sure that HOSTNAME shows up in the Selected Methods.


    FIGURE 3.1 Oracle Net Manager sqlnet.ora Profile screen


