- img_proc: true
  md: '# Recovering Using NOARCHIVELOG and ARCHIVEL Modes 289


    A significant type of failure is a media failure in most cases, it requires that
    you restore all or some of the data files and the application of the redo logs
    during recovery. As discussed in Chapter 6, “Instance and Media Recovery Structures,”
    media failure occurs when a database file cannot be accessed for some reason.
    The usual reason is a disk crash or controller failure.


    ![](img/a183fd041839741f5ab6df3caffc6b52_350_0.png)


    # Real World Scenario


    # The Dangers of Media Failures and Recovery


    A media failure is generally considered the most dangerous type of failure and
    it is the most touchy to recover as well. The severity of this type of failure
    may vary from a loss or accidentally removed data file to a severe hardware failure.


    No matter what type of media failure the DBA is handling, they must contribute
    more analysis and thought to a media failure then they would want most other situations,
    such as those associated with instance recovery or basic user error. In fact,
    certain situations, a hardware failure could cause a significant amount of the
    physical database to be relocated to a new filesystem. And in some cases, new
    filesystems may need to be re-created and properly configured for stripe, load,
    and redundancy. This can be a difficult task to perform when the database is down,
    especially if minimal downtime cannot be tolerated by the users. In less demanding
    environments, the database may remain unavailable for an excessive period of time.


    A case in point is a small nonprofit organization that lost a disk controller
    for its financial database. As in many small companies, this organization was
    concerned about keeping IT costs to a minimum. As a result, resources that had
    been purchased in use, such as servers and disk space. Another result of this
    policy was that extra capacity, as multiple controllers to disk arrays, was not
    always purchased in order to reduce costs.


    Because of this, when the disk controller was lost, the financial instance was
    unavailable until a new disk controller could be purchased, delivered, and installed
    in the disk storage array. This application was unavailable for one business day
    until the hardware was successfully installed and the database was successfully
    restored and recovered.'
