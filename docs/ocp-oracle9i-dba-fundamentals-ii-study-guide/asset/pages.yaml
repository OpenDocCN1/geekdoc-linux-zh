    in Unix


    ![](img/a183fd041839741f5ab6df3caffc6b52_316_0.png)


    The main implication of an opened backup is that the database is available to
    users during the backup. The backup is accomplished with the command ALTER TABLESPACE
    <TABLESPACE_NAME> BEGIN BACKUP, an OS command, and the command ALTER TABLESPACE
    <TABLESPACE_NAME> END BACKUP. Refer back to Chapter 7, “Configuring the Database
    Archiving Mode” for a more detailed discussion of hot backups. Figure 9.2 is an
    example of an opened backup.'
