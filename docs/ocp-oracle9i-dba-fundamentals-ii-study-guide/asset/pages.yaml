  md: '# Real World Scenario

    Configuring and Using the Media Manager Vendor Software


    In your role as a DBA, you have configured RMAN and made sure that it is operational.
    You also have a backup script and method that you feel comfortable with. But you
    are not out of the woods, yet.


    This is because there is often a whole setup, configuration, usage, and testing
    effort associated with the software and hardware solutions that you choose to
    integrate with RMAN. For instance, if you interface with an ATL, you will encounter
    software that manages the tapes, and most likely, the RMAN backups as well. In
    some cases, these software solutions can be simple agents performing shell scripts
    that then call RMAN scripts. But in some cases, you may end up dealing with full-featured
    software applications that execute RMAN from their own GUI scripts.


