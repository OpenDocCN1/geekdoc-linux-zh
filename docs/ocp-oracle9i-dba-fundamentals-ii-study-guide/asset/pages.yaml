    # Overview of Oracle Net Features


    Oracle Net is the glue that bonds the Oracle network together. It is responsible
    for handling client-to-server and server-to-server communications, and it can
    be configured on the client, the middle-tier application, and the Oracle server.


    Oracle Net also manages the flow of information in the Oracle network infrastructure.
    First, it is used to establish the initial connection to the Oracle server, and
    then it acts as the messenger, passing requests from the client back to the server
    or passing them between two Oracle servers. Basically, Oracle Net handles all
    negotiations between the client and server during the client connection. In the
    section entitled “The Net Net Stack Architecture later in this chapter, we discuss
    the architectural design of Oracle Net.


    In addition to functioning as an information manager, Oracle Net sup-ports the
    use of middleware products such as Oracle9 Application Server (Oracle9AS) and
    Oracle Connection Manager. These products allow n-tier architectures to be used
    in the enterprise, which increases the flexibility and performance of application
    designs.


    To learn more about these products and some of the features of Oracle Net, read
    the following sections, which mirror the five categories of networking solutions
    that Oracle Net provides: Connectivity, Directory Services, Scalability, Security,
    and Accessibility.


    # Connectivity: Multi-Protocol Support


    Oracle Net supports a wide range of industry-standard protocols including TCP/IP,
    IBM LU6.2, Named Pipes, and DCNet. (Unlike its predecessor Net8, Oracle no longer
    supports the Novell IPX/SPX protocol.) This support is handled transparently and
    allows Oracle Net to establish connectivity to a wide range of computers and a
    wide range of operating environments.'
  merge: -1
