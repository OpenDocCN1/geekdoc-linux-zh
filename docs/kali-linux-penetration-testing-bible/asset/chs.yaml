  \n图 A.17 管理工作空间\n\n### 图标\n\n图标标签页如图 A.18 所示，允许你更改桌面图标图标的外观。此外，此标签页还提供了显示/隐藏桌面默认图标的选项。\n\
  \n![图标设置的截图。](img/bapp01f018.png)\n\n图 A.18 图标设置\n\n## 显示\n\n此窗口允许你配置显示器显示设置。如果你想使用多个显示器，此部分会非常方便。\n\
