  The command completed successfully.\n```\n\n## 网络信息\n\n要列出所有网络接口及其关联的 IP 地址，可以使用\
  \ `ipconfig` 命令：\n\n```\n C:\\Users\\Gus>ipconfig /all\n\nWindows IP Configuration\n\
  \n Host Name . . . . . . . . . . . . :      Windows10Lab\n Primary Dns Suffix .\
