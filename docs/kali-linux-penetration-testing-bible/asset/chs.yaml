  \n### 行为\n\n行为标签页如图 A.25 所示，允许你更改以下：\n\n- 启动时启用数字锁定\n- 启用按键\n- 显示/隐藏闪烁光标\n\n###\
  \ 应用程序快捷键\n\n应用程序快捷键如图 A.26 所示，是一个非常用的设置。它允许你配置快捷键。只需点击 `Add` 即可创建自己的快捷键。\n\n![文件管理器的截图。](img/bapp01f024.png)\n\
