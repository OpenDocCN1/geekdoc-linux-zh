  - 旋转\n- 镜像\n\n图 A.19 仅显示连接了一个虚拟屏幕。如果你连接了多个显示器，你将在窗口的左侧看到它们。\n\n### 高级\n\n高级标签页如图\
  \ A.20 所示，使你能够启用配置并为连接的显示器保存配置。\n\n## 文件管理器\n\n在如图 A.21 所示的文件管理器中，你可以控制 Kali Xfce\
