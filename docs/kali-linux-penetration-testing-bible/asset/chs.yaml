  \ 网络和卷\n-   在虚拟 Docker 环境中进行练习\n\n# Docker 技术\n\n图 B.1 显示了一些 Docker 命令。\n\n![docker\
  \ 命令快照。](img/bapp02f001.png)\n\n图 B.1 Docker 命令\n\n## Docker 基础\n\nDocker 类似于（但并不相同！）虚拟机管理程序。它的主要组件是\
  \ Docker 镜像。例如，Kali Linux 镜像就像一个 ISO 文件，但没有包含操作系统。你可以从 Docker Hub 下载镜像，然后用它来创建容器。这个概念的有趣之处在于你不需要安装操作系统即可运行它；它使用宿主机操作系统（安装\
  \ Docker 的地方）来运行容器。例如，如果你有一个 Web 应用，你可以获取一个 Apache 镜像来运行 Web 服务器（在容器内部），并获取另一个 MySQL\
  \ 镜像在容器内运行数据库（参见图 B.2）。\n\n## Docker 安装\n\n我们将使用一个 Ubuntu 桌面主机虚拟机来安装 Docker。我没有使用\
  \ Kali Linux 作为 Docker 的宿主机，但如果你不想使用 Ubuntu，也可以这样做：\n\n```\nubuntu:~$sudo apt update\
  \ && sudo apt install docker.io -y\n```\n\n搞定！现在你就可以开始使用 Docker 了（在安装完成后）。接下来，我们将切换到\
  \ root 用户与 Docker 命令行进行交互。为了避免使用 root 用户，可以使用以下命令将用户名添加到 `docker` 组：\n\n```\n$sudo\
  \ usermod -aG docker [username]\n```\n\n![docker 容器示例快照。](img/bapp02f002.png)\n\n\
  图 B.2 Docker 容器示例\n\n此外，你可以使用以下命令手动启动/停止 Docker：\n\n```\n$service docker start\n\
  $service docker stop\n```\n\n我们到底为什么要用 Docker 呢？难道不能直接用虚拟机吗？简单的答案是，与虚拟机相比，Docker\
  \ 容器非常轻量级的。它们默认安装了最少的软件包，并且利用了宿主机操作系统的资源。Docker 在 DevOps 世界非常流行，因为他们可以使用命令行来自动化镜像和容器的生命周期（我们将在后续章节中详细介绍镜像和容器）。流水线自动化持续集成/持续部署（CI/CD）可以使用\
  \ Jenkins 或 TFS 等编排器完成（这是 DevOps 工程师保存其 Docker 命令的地方）。\n\n## 镜像与注册表\n\nDocker 镜像就像\
  \ ISO 文件，但并不相同（我们只是通过对比来让你理解这个概念，但它们是不同的）。你可以从位于 [hub.docker.com/](http://hub.docker.com/)\
  \ 的 Docker Hub 仓库下载（拉取）镜像。\n\n要使用 Docker Hub，你可以在不创建的情况下下载镜像。但如果你在 Docker Hub 上创建了账户，你将拥有自己的仓库，可以在其中上传和共享你的镜像。在企业环境中，你可能会使用自己的仓库，因为你希望集中管理一切，并禁止人们从互联网下载有漏洞的镜像。\n\
  \n镜像具有极简的文件系统；让我们通过下载 Kali Linux Docker 镜像开始练习：\n\n```\nroot@ubuntu:~#docker pull\
  \ kalilinux/kali\n```\n\n接下来，让我们检查宿主机上当前下载的镜像：\n\n```\nroot@ubuntu:~# docker images\n\
  ```\n\n如果你好奇并想检查 Docker Hub 上的 Kali 镜像，可以访问位于 [hub.docker.com/u/kalilinux](http://hub.docker.com/u/kalilinux)\
  \ 的仓库。\n\n很简单对吧？现在我们准备好使用刚刚下载的镜像运行容器了。\n\n在进入容器主题之前，这里有一份管理镜像的快速列表：\n\n```\n# 在注册表中搜索镜像\n\
  $docker search [Image Name]\n# 从注册表下载镜像\n$docker pull [Image Name]\n# 将镜像上传到注册表\n\
  $docker push [username/Image Name]\n# 列出本地主机镜像\n$docker images\n# 宿主机上的镜像\n$docker\
  \ rmi [Image Name]\n```\n\n## 容器\n\n现在我们已经在 Ubuntu VM 上下载了镜像，下一步是运行它：\n\n```\nroot@ubuntu:~#\
  \ docker run -itd –name kali_01 6820b888e0ab\n```\n\n- `-i` : 交互模式；它将保持标准输入开启\n\
  - `-t` : 将分配一个伪终端（`pseudo‐tty`）\n- `-d` : 离线模式；将在后台运行容器\n- `--name` : 为你的容器命名\n\n\
  需要注意的是，你可以从同一个 Docker 镜像运行任意数量的容器（这就像虚拟机，你可以从同一个 ISO 镜像运行多个）。接下来，让我们验证正在运行的容器信息：\n\
  \n```\nroot@ubuntu:~# docker ps -a\n```\n\n非常好！根据状态显示，容器已启动并运行。\n\n现在是时候使用 `exec`\
  \ 命令开始与 Kali 容器进行交互了：\n\n```\nroot@ubuntu:~# docker exec -it kali_o1 /bin/bash\n\
  root@4897450e4598:/# uname -a\nLinux 4897450e4598\n```\n\n由于我们已经在 Ubuntu VM 上下载了镜像，下一步步骤是运行它：\n\
  \n```bash\nroot@4897450e4598:/# uname -a\nLinux 4897450e4598\n```\n\n我们以 root 用户身份登录，系统是\
  \ Ubuntu Ubuntu Kali 容器中是的的的的，尝试尝试运行 ffit，发现发现发现没有的：\n\n```bash\nroot@4897450e4598:/#\
  \ msfconsole\nbash: msfconsole: command found\n```\n\nDocker 容器是非常轻量级的（宿主机的内存/CPU/磁盘占用）。为了可视化这些占用，你可以运行\
  \ `htop` 或以下 `ps` 命令：\n\n```bash\n$ps -aux | grep Docker\n```\n\n要在 Kali 容器上安装必要的工具，你可以执行以下命令（你以后需要时会添加\
  \ ffffffff 的）：\n\n```bash\nroot@4897450e4598:/# apt-get install -y \\\n> nmap \\\
  \n> metasploit-framework \\\n> sqlmap \\\n> gobuster \\\n> wordlists \\\n> nano\
  \ \\\n> nfs-common \\\n> cifs-utils \\\n> git \\\n> && apt-get clean\n```\n\n###\
  \ Dockerfile\n\n有一个好消息！你可以构建自己的镜像并预安装所有工具，而不是手动操作。为了完成工作，你必须创建一个文件并命名为 `dockerfile`（无扩展名）。对于\
  \ Kali Linux 镜像，我们将创建一个 dockerfile（注释自而易懂）：\n\n```dockerfile\n# Kali Linux 基础镜像\n\
  FROM kalilinux/kali\n# 更新 升级\nRUN apt update && apt upgrade -y\n# 安装工具\nRUN apt-get\
  \ install -y \\\n> nmap \\\n> metasploit-framework \\\n> sqlmap \\\n> gobuster \\\
  \n> wordlists \\\n> nano \\\n> nfs-common \\\n> cifs-utils \\\n> git \\\n> && apt-get\
  \ clean\n# 从 GitHub 获取 seclist 并保存到 /opt 文件夹\nRUN git clone https://github.com/danielmiessler/SecLists.git\
  \ /opt/selists\n# 设置工作目录\nWORKDIR /root/\n```\n\n接下来，使用之前的 dockerfile 构建镜像（在以下代码中，点表示\
  \ dockerfile 在当前目录下）：\n\n```bash\nroot@ubuntu:/home/gus/Documents# ls\ndockerfile\n\
  root@ubuntu:/home/gus/Documents# docker build -t kali_custom .\n```\n\n构建所有软件包后，本地主机上将创建一个新镜像：\n\
  \n```bash\nroot@ubuntu:/home/gus/Documents# docker images\n```\n\n注意与 Kali 注册表的原始镜像相比，新镜像有多大。\n\
  \n### 卷\n\n到目前为止我们还没有讨论过存储数据。在 Docker 技术中，我们使用卷来保存数据。我们之前启动的容器一旦停止，将删除所有数据。解决方案是在宿主机上创建一个卷并将其映射到运行的容器：\n\
  \n```bash\nroot@ubuntu:/home/gus/Documents# docker run -itd –name kali_03 -v /home/gus:/root\
  \ a4000ah7777\n```\n\n\n\n\n\n在上一条命令中，我们所需要的只是向 `run` 命令添加 `-v`（`v` 代表 volume，即数据卷）选项。之后，我们将定义\
  \ Ubuntu 宿主机上的主目录——`/home/gus` —— 将映射到容器内部的 `/root` 文件夹。现在，如果我们访问 Kali 容器，我们将在主目录中看到与\
  \ Ubuntu 宿主机上的 `gus` 主目录相同的内容：\n\n```\nroot@ubuntu:/home/gus/Documents#docker exec\
  \ -it kali_03 /bin/bash\n```\n\n## 网络\n\n如何找到容器的 IP 地址？我们现在有多个容器正在运行；我们将以 `Kali_03`\
  \ 为例。获取运行容器的 IP 地址有多种方法，但大多数情况下，我们可以在宿主机上使用 `inspect` 命令：\n\n```\nroot@ubuntu:/home/gus/Documents#\
  \ docker inspect Kali_03 | grep IPAddress\nroot@ubuntu:/home/gus/Documents# docker\
  \ inspect -f \"{{ .NetworkSettings.IPAddress }}\" kali_03\n```\n\n该子网无法从我们的 Ubuntu\
  \ 宿主机直接访问；这就是为什么我们需要使用 `-p`（代表 ports，即端口）通过先指定开放端口来访问容器。\n\n例如，如果你想通过 SSH 访问 Kali，那么在执行\
  \ `run` 命令时必须使用 `-p` 选项指定端口。在以下命令中，我们告诉 Docker 我们想使用宿主机上的端口 2222 来访问 Kali 上的 SSH。此外，请注意我们使用的是之前创建的\
  \ `kali_custom` 镜像：\n\n```\nroot@ubuntu:/home/gus/Documents# docker run -itd –name\
  \ kali_04 -p 2222:22 kali_custom\n```\n\n在此阶段，我们需要在 Kali 容器内部安装 SSH 服务器，因为默认没有安装：\n\
  \n```\nroot@ubuntu:/home/gus/Documents# docker exec -it kali_04 /bin/bash\n```\n\
  \n接下来，为你的 Kali root 设置密码：\n\n```\nroot@48394888f:~# passwd root\n```\n\n最后一步是允许\
  \ root 用户使用 SSH。为了实现这一功能，我们需要更改 SSH 配置文件 `/etc/ssh/sshd_config` 并确保添加了 `PermitRootLogin\
  \ yes` 这一行。\n\n在保存 SSH 配置文件后，不要忘记重启 SSH 服务：\n\n```\nroot@48394888f:~# nano /etc/ssh/sshd_config\n\
  ```\n\n现在我们可以使用 SSH（从网络上的任何主机）远程登录到 Kali 容器：\n\n```\ngus@ubuntu:~$ssh root@localhost\
  \ -p 2222\n```\n\n你是否好奇 Kali 容器是如何获得 IP 地址的？简单的答案是 Docker 使用桥接模式来分配 IP 地址。在我的 Ubuntu\
  \ 宿主机上，Docker 正使用 `172.17.0.0/16` 子网为运行的容器分配 IP 地址。你可以通过检查桥接网络来确认：\n\n```\nroot@ubuntu:~#\
  \ docker network inspect bridge\n```\n\n## Mutillidae Docker \n\n我们不需要完整的虚拟机来运行一个\
  \ Web 应用（那样太浪费资源了），对吧？Docker 容器非常适合这种情况。在本节中，你将学习如何运行一个 Mutillidae（一个漏洞 Web 应用）容器来创建一个\
  \ Web 渗透实验室。\n\n首先，从 Docker Hub 下载镜像到你的本地 Ubuntu 宿主机：\n\n```\nroot@ubuntu:~# docker\
  \ pull citizenstig/nowasp\n```\n\n其次，运行容器。顺便说，我们可以忽略之前的第一步，直接执行 `run` 命令。`run` 命令会检查你本地是否有该镜像的副本；如果没有，它会自动下载：\n\
  \n```\nroot@ubuntu:~# docker run -itd -p 8080:80-citizenstig/nowasp\n```\n\n我们使用了\
  \ `-p` 选项告诉 Docker 通过宿主机的 8080 端口访问容器（也就是说，容器的 80 端口将映射到宿主机 8080 端口）。在此阶段，容器已启动运行，你可以通过\
  \ URL `localhost:8080` 从宿主机访问它。接下来，会被要求设置数据库（参见图 B.3），之后网站就会启动运行。\n\n搞定！（参见图 B.4）。你现在花不到一分钟就准备好了一个待攻击实验室。\n\
  \n![Mutillidae 数据库初始化](img/bapp02f003.png)\n\n图 B.3 Mutillidae 数据库初始化\n\n![Mutillidae\
  \ 首页](img/bapp02f004.png)\n\n图 B.4 Mutillidae 首页\n\n### 总结\n\nDocker 是快速创建虚拟环境和服务的伟大发明。你在附录中学习的是该技术的实际场景。当然，有很多内容没有涵盖，但如果你进行了练习，将将能够使用\
  \ Docker。当我们开始渗透攻击时，你会再次看到如何利用 Docker，但首先必须理解我们涵盖的基础知识。\n\n## 索引\n\n### A\n- `-a`\
