  \ 表 ‐ SQL 查询\n\n如果我们能欺骗数据库选择 `accounts` 表中的所有记录会怎样？我们将使用注释字符（`--`）来忽略查询的某些部分。我们在\
  \ Web 应用程序中创建的 `test` 用户名已经在之前的查询中查询了。如图 8.12 所示，我们将使用 `DBeaver` 作为图形化数据库客户端来执行此查询。\n\
