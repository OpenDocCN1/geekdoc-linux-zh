  如果我们能欺骗数据库选择 `accounts` 表中的所有记录会怎样？我们将使用注释字符（`--`）来忽略查询的某些部分。我们在 Web 应用程序中创建的 `test`\
  \ 用户名已经在之前的查询中查询了。如图 8.12 所示，我们将使用 `DBeaver` 作为图形化数据库客户端来执行此查询。\n\n所示](images/c08f011.png)\n\
  \n图 8.11 Accounts 表\n\n所示](images/c08f012.png)\n\n图 8.12 Accounts 表 ‐ SQL 查询\n\n\
  如果我们能欺骗数据库选择 `accounts` 表中的所有记录会怎样？我们将使用注释字符（`--`）来忽略查询的某些部分。我们在 Web 应用程序中创建的 `test`\
  \ 用户名已经在之前的查询中查询了。如图 8.12 所示，我们将使用 `DBeaver` 作为图形化数据库客户端来执行此查询。\n\n（注：由于原文在后半部分存在重复和逻辑混乱，上述翻译已根据上下文进行了修正对齐以确保通顺）\n\
  \n**重新翻译：**\n\n修改 `User-Agent` 值，将其替换为 JavaScript 警告消息（参见图 8.7），并点击前进（Forward）按钮。点击前进后，通知\
  \ Burp 停止拦截。要实现这一点，点击 `Intercept Is On` 按钮将其关闭（否则网页将无法加载；它将一直等待你的输入）。请注意，当你从此窗口停止拦截时，Burp\
  \ 将继续在后台拦截，而不会停止来自你浏览器的请求/响应。\n\n![Burp Suite 截图 – User-Agent 编辑。](img/c08f007.png)\n\
  \n图 8.7 Burp Suite – User-Agent 编辑\n\n当我们回到日志页面时，应该会看到一个 JavaScript 弹窗警告。\n\n记住，我们在这里所做的是存储型\
  \ XSS；日志存储在数据库中，以便管理员随时随地读取它们。\n\n## 绕过 JavaScript 验证\n\nJavaScript 验证是初级开发者的一个误区。他们在前端\
  \ JavaScript 代码中添加了验证，但没有在后端实现。（在我们的案例中，后端是 PHP。）Burp Suite 将再次出现并救场，允许我们拦截请求并注入我们的有效荷。要启用此安全功能（JavaScript\
  \ 验证），我们将点击顶部菜单项 `Toggle Security`。一旦安全级别被设置为 1，我们将尝试在之前使用的 DNS 查找页面中注入 `Hello`\
  \ JavaScript 代码。这次，页面将不会执行该 JavaScript 代码，并且会向我们显示一条说不允许允许的消息，如图 8.8 所示（因为前端代码中存在验证）。\n\
  \n![Mutillidae 截图 – 错误字符错误消息。](img/c08f008.png)\n\n图 8.8 Mutillidae – 错误字符错误消息\n\
  \n为了绕过 JavaScript 验证，我们将使用 Burp 启动拦截。接下来，我们将输入有效的 IP 地址（8.8.8.8，如图 8.9 所示）并点击 `Lookup\
  \ DNS` 按钮。如果我们切换到 Burp Proxy 标签页，应该能看到该请求。\n\n我们可以在 `POST` 请求内容中看到 IP 地址。在这个阶段，我们只需要将\
  \ IP 地址替换为测试脚本即可，如图 8.10 所示。\n\n进行更改后，点击前进按钮并通过点击 `Intercept Is On` 按钮停止拦截。当我们切换到\
  \ DNS 查找网页时，我们应该能看到 JavaScript 已成功执行。为什么会发生这种情况？这仅仅是因为 PHP 代码中没有验证（仅前端 JavaScript\
  \ 的验证是不够的！）。\n\n![Burp Suite 截图 – 拦截有效荷。](img/c08f009.png)\n\n图 8.9 Burp Suite –\
  \ 拦截有效荷\n\n![Burp Suite 截图 – 目标主机脚本。](img/c08f010.png)\n\n图 8.10 Burp Suite – 目标主机脚本\n\
  \n## SQL 注入\n\nSQL 注入（SQLi）是我最喜欢的 Web 漏洞，也是最危险的一种。SQLi 允许恶意用户通过浏览器执行 SQL 命令。你可以使用\
  \ SQL 命令做很多事情，例如：\n\n*   使用 `select` 命令查询数据库（例如，你可以选择所有用户记录并窃取机密信息）\n*   通过 SQL\
  \ 中的 `true` 语句绕过登录页面\n*   执行系统命令并获得远程 shell，例如\n*   使用 `insert` / `delete` / `update`\
  \ SQL 命令操纵数据\n\n### 查询数据库\n\n在我们利用此漏洞之前，让我给你们展示几个 SQL 查询。这个有漏洞的 Web 应用程序创建名为 `mutillidae`\
  \ 的数据库，在该数据库中，有一个名为 `accounts` 的表（参见图 8.11）。\n\n从一个简单的命令开始，我们将查询已经在 Web 应用程序中创建的用户名\
  \ `test`。我们将使用 `DBeaver` 作为图形化数据库客户端来执行此查询，如图 8.12 所示。\n\n![Accounts 表截图。](img/c08f011.png)\n\
