  \ 17763 \n```\n\n### Windows 架构\n\n要获取架构，我们将使用 `wmic` 工具。如果你使用 Windows 命令行，会在不同的场景下遇到\
  \ `wmic` 工具。实际上，该实用程序为 Windows 管理工具规范提供了一个命令行界面：\n\n```\n C:\\Users\\Gus>wmic os\
