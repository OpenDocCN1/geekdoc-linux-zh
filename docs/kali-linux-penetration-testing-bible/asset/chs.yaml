- "# Kali Linux 渗透测试圣经\n\n\n\n\n## 引言\n\nKali 是一种安全专业人员和渗透测试人员常用的发行版。《Kali 渗透测试指南》是一本能够帮助你进步的指南。对于初学者来说，《Kali\
  \ 渗透测试指南》是关于黑客工作的最佳指南。\n\n## 本书涵盖了哪些内容\n\n本书深入探讨了渗透测试的主题。对于渗透测试人员来说，本书填补了所有的空白。通过阅读本书，你将：\n\
  \n- 深入理解 Kali 中提供的数百种工具。\n- 掌握一系列技术以提高你的工作效率。\n- 学习渗透测试的原理并获得认证。\n- 发现黑客使用的工具和技术，从而增强网络防御。\n\
  - 学习缓冲区溢出、权限提升等内容。\n\n## 第一章：掌握终端\n\n本章概述了 Linux 系统终端的各种，并涵盖了如何管理文件。你将学习如何在 Kali\
  \ 中管理用户和组。\n\n## 第二章：Bash 脚本\n\nBash 脚本编写是渗透测试人员的一项基本技能。在本章中，你将学习如何开始使用变量、函数、条件、循环等编程原理。\n\
  \n## 第三章：主机扫描\n\n本章教你如何像专业人士一样进行网络扫描。你将首先学习网络基础，然后深入研究端口扫描技术。\n\n## 第四章：互联网信息收集\n\
  \n本章讨论了渗透测试中的被动信息收集阶段。你将学习如何处理高级搜索引擎查询。此外，你还将学习如何使用 Shodan 等工具来完成任务。\n\n## 第五章：社会工程攻击\n\
  \n本章重点讨论了如何利用人的弱点来攻击组织。你将学习如何发送钓鱼邮件并窃取凭据。此外，你还将学习作为渗透测试人员如何使用社会工程工具（SET）。最后，你将看到\
  \ USB Ducky 在类似的 攻击中是如何工作的。\n\n## 第六章：高级枚举阶段\n\n本章回顾了如何在渗透测试项目中处理枚举阶段。枚举意味着收集允许我们利用特定服务（例如\
  \ FTP、SSH 等）。\n\n## 第七章：利用阶段\n\n本章讨论了一些实际攻击并向你展示如何进入系统。在之前的章节中，你已经拥有了关于每个服务的信息，而在本章中，我们将更进一步。\n\
  \n## 第八章：Web 应用程序漏洞\n\n\n\n\n\n本章重点介绍 Web 应用程序漏洞的基础知识。目标是让你在任务期间能够轻松地测试 Web 应用程序。如今每家公司都有网站，因此从\
  \ A 到 Z 理解这一主题至关重要。\n\n## 第 9 章：Web 渗透测试与安全软件开发生命周期\n\n在本章中，你将主要学习 Web 渗透测试的方法论以及如何使用\
  \ `Burp Suite Pro`。最后，你将看到如何在组织中实施安全软件开发生命周期（`SSDLC`）。\n\n## 第 10 章：Linux 权限提升\n\
  \n本章主要关注 Linux 操作系统的权限提升。本章中的技术将使你能够在受攻击的 Linux 操作系统上获取 `root` 权限。\n\n## 第 11 章：Windows\
  \ 权限提升\n\n本章描述了如何在受攻击的 Windows 操作系统获取管理员权限。首先，你将学习如何枚举 Windows 操作系统，然后将通过实际示例查看如何利用\
  \ Windows 系统。\n\n## 第 12 章：枢接与横向移动\n\n本章描述了如何使用枢接技术在受攻击的网络中进行横向移动。在本章中，你将学习 Windows\
  \ 哈希值在底层是如何工作的，以及如何重用管理员凭据完成任务。\n\n## 第 13 章：密码学与哈希破解\n\n本章描述了如何在任务期间使用 `Hashcat`\
  \ 破解哈希。在开始破解主题之前，你将学习密码学基础知识，包括哈希和加密。\n\n## 第 14 章：报告\n\n本章解释了如何提交专业的渗透测试报告。此外，你将学习如何准确评估发现问题的严重性。\n\
  \n## 第 15 章：汇编语言与逆向工程\n\n本章将为你介绍使用汇编语言进行逆向工程的概念。你将学习汇编语言的基础，包括寄存器、汇编指令、内存段等。\n\n\
  ## 第 16 章：缓冲区/栈溢出\n\n本章将利用你在上一章中学的内容，使用缓冲区溢出技术来利用栈。\n\n## 第 17 章：Python 编程\n\n本章讨论了\
  \ `Python version 3` 的基础。这种编程语言是黑客的首选，因此你也应该学习它。\n\n## 第 18 章：使用 Python 进行渗透测试自动化\n\
  \n本章关注使用 `Python` 语言实现渗透测试阶段的自动化。你将看到一个可以在你职业中使用的完整实践示例。\n\n## 附录 A：Kali Linux 桌面简介\n\
  \n本附录关注如何管理 Kali Linux 桌面环境的界面。你将学习如何轻松处理此操作系统并根据喜好进行自定义。\n\n## 附录 B：使用 Docker 构建实验环境\n\
  \n本附录将深入研究 `Docker`，你将看到镜像和容器在实践中是如何工作的。`Docker` 和虚拟机技术都有助于创建实时实验室，以便我们渗透测试人员可以在其中实践。\n\
  \n## 辅助下载文件\n\n在学习书中示例时，你可以选择手动输入所有代码，也可以使用随书提供的源代码文件。书中使用的所有源代码均可从 [`www.wiley.com/go/kalilinuxpenbible`](http://www.wiley.com/go/kalilinuxpenbible)\
  \ 下载。\n\n## 如何联系出版社\n\n如果你认为在书中发现了错误，请告知我们。在 John Wiley & Sons，我们理解为客户提供准确内容有多么重要，但即使我们尽了最大努力也可能出现错误。\n\
  \n如需提交可能的错误，请发送电子邮件至我们的客户服务团队，邮箱为`wileysupport@wiley.com`，邮件主题为“Possible Book Errata\
  \ Submission”。\n\n## 如何联系作者\n\n我们感谢你对这本书的反馈和问题！请发送邮件给作者 `gus.khawaja@guskhawaja.me`，或在\
  \ Twitter 上通过 `@GusKhawaja` 给他留言。\n\n# 第 1 章\n\n## 掌握终端窗口\n\nKali Linux 可以用两个简单的词来总结：终端窗口。如果你掌握了终端窗口技巧，你将成为那些精英道德黑客之一。在本章中，你将学习终端窗口的所有基本知识，让你能够像专家一样使用\
  \ Kali Linux。\n\n如果你已经知道如何管理终端窗口，请将本章作为参考，或者快速浏览一遍，以防有你以前未学过的新内容。本章的主要目标不仅向你展示 Kali\
  \ Linux 的命令，而且通过实际示例帮助你深入理解它。\n\nKali Linux 是由 Offensive Security 开发的基于 Debian 的操作系统，如果你习惯了\
  \ Ubuntu，终端窗口中的命令看起来是相同的，因为 Debian 和 Kali 共享发行版。\n\n以下是本章涵盖的内容：\n\n* Kali Linux\
  \ 文件系统\n* 终端窗口基础\n* 管理用户和组\n* 操作文件和文件夹\n* 处理远程连接\n* Kali Linux 系统管理\n* 处理 Kali Linux\
  \ 中的网络问题\n\n## Kali Linux 文件系统\n\n理解 Kali Linux 文件系统的结构至关重要。你的 Kali OS 目录结构基于 Unix\
  \ 文件系统层次结构标准（FHS），这就是 Kali Linux 内部目录的结构。在 Windows 中，根目录是 `C:\\`，但在 Kali Linux 中，它是正斜杠（`/`）。不要将\
  \ `root directory`（根目录）术语与 root 用户的家目录（`/root`）混淆，因为它们是两个不同的东西；后者是 root 用户的家目录。提到\
  \ root 用户，重要的是该用户等同于 Windows 操作系统上的 Administrator 用户。在 Kali 2020.1 版本中，Offensive\
  \ Security 引入了非 root 用户，这意味着如果你想运行权限工具，需要执行 `sudo` 命令。\n\n要获取 Kali Linux 文件系统的视觉表示，打开终端窗口并执行\
  \ `ls` 命令列出根目录的内容。请注意，默认你会处于用户家目录。要切换过去，必须执行 `cd /` 命令：\n\n```\nkali@kali~$cd /\n\
  kali@kali:/$ls\nbin boot dev etc home initrd.img initrd.img.old lib lib32 lib64\
  \ libx32 lost+found media mnt opt proc root run sbin srv sys tmp usr var vmlinuz\
  \ vmlinuz.old\n```\n\n* `/bin`（二进制）：包含之前执行的 `ls` 命令等 Linux 二进制文件。\n* `/sbin`（系统二进制）：包含作为管理命令的系统二进制文件（例如\
  \ `fdisk`）。\n* `/boot`：包含 Linux 引导加载程序文件。\n* `/dev`（设备）：包含设备配置文件（例如 `/dev/null`）。\n\
  * `/sys`：类似于 `/dev`，包含设备和驱动程序的配置。\n* `/etc`（其他）：包含所有的管理系统文件（例如 `/etc/passwd` 显示\
  \ Kali 中所有的系统用户）。\n* `/lib`（库）：包含 `/bin` 和 `/sbin` 中二进制文件所需的共享库。\n* `/proc`（进程）：包含进程和内核信息文件。\n\
  * `/lost+found`：顾如其名，该目录包含恢复的文件。\n* `/mnt`（挂载）：该目录包含挂载的目录（例如远程文件共享）。\n* `/media`：该目录包含挂载的可移动式介质目录（例如\
  \ DVD）。\n\n\n\n\n\n* `/opt` (option): 该目录用于安装附加软件包。此外，它也用于用户自行安装的软件（例如你从 GitHub\
  \ 下载的黑客工具）。\n* `/tmp` (temporary): 这是一个临时使用的临时文件夹；其内容在每次重启后都会被清空。一旦你获得了受限的 shell（limited\
  \ shell），`tmp` 文件夹是你下载用于权限提升的工具的好去处。\n* `/usr` (user): 该目录包含许多子目录。事实上，`/usr/share`\
  \ 是一个你需要记忆的文件夹，因为你在 Kali Linux 中使用的大多数工具（例如 `Nmap`、`Metasploit` 等）都存储在那里，而且它包含了词表字典文件（wordlists）（`/usr/share/wordlists/`）。\n\
  \n* `/home`: 这是 Kali Linux 用户的家目录（例如 `/home/john/`）。\n\n* `/root`: 这是 root 用户的家目录。\n\
  \n* `/srv` (serve): 此文件夹存放了一些与系统服务器功能相关的数据（例如 FTP 服务器的数据）。\n\n* `/var` (variable):\
  \ 此文件夹存放数据库、日志和网站的变量数据。例如，`/var/www/html/` 包含了 Apache Web 服务器的文件。\n\n* `/run` (runtime):\
  \ 该目录包含运行时系统数据（例如当前登录的用户用户）。\n\n### 终端窗口基础命令\n\n作为渗透测试人员，我们每天都会使用很多常用命令。其中许多命令将在接下来的章节或本书后后部分列出。在本节中，你将看到我个人经常使用的所有通用标准工具。你还将学习识别为通用用途的基本命令。\n\
  \n首先，要从桌面打开终端窗口，可以使用 `Ctrl+Alt+T` 组合键，而不是使用鼠标光标点击图标来打开应用程序。\n\n如果你想获取要执行的任何命令的帮助信息，只需在命令后加上\
  \ `-h` 或 `--help` 即可（某些命令要求你只使用其中一个）。例如，如果你想查看 `cat` 命令的不同选项，只需在终端窗口中输入 `cat --help`\
  \ 即可获取有关该工具的所有帮助。在下一个命令（`cat -h`）中，你会发现 `-h` 选项对 `cat` 命令无效。相反，我使用了 `--help` 选项。（`cat`\
  \ 命令经常用于在终端窗口中显示文本文件的内容。）\n\n```\nkali@kali:~$ cat -h\ncat: invalid option -- 'h'\n\
  Try 'cat --help' for more information.\nkali@kali:~$ cat --help\nUsage: cat [OPTION]…\
  \ [FILE]…\nConcatenate FILE(s) to standard output.\n\nWith no FILE, or when FILE\
  \ is -, read standard input.\n\n -A, --show-all           equivalent to -vET\n -b,\
  \ --number-nonblank    显示非空输出行数，覆盖 -n\n -e                       equivalent to -vE\n\
  \ -E, --show-ends          在每行尾显示 $\n -n, --number             显示所有输出行\n -s, --squeeze-blank\
  \      抑制重复的空输出行\n -t                       equivalent to -vT\n -T, --show-tabs\
  \          将 TAB 字符显示为 ^I\n -u                       (ignored)\n -v, --show-nonprinting\
  \   使用 ^ 和 M- 表示，除 LFD 和 TAB 外\n     --help    显示此帮助并退出\n     --version 输出版本信息并退出\n\
  \nExamples:\n cat f - g  输出 f 的内容，然后是标准输入，最后是 g 的内容。\n cat        将标准输入复制到标准输出。\n\
  \nGNU coreutils online help: <https://www.gnu.org/software/coreutils/>\nFull documentation\
  \ at: <https://www.gnu.org/software/coreutils/cat>\nor available locally via: info\
  \ '(coreutils) cat invocation'\n```\n\n要清除终端窗口的文本，执行 `clear` 命令或按下 `Ctrl+L` 来完成任务。\n\
  \n要从当前终端会话打开新的终端窗口标签页，按下 `Ctrl+Shift+T`。\n\n要自动完成输入（例如文件名或命令名），我使用 `Tab` 键。如果多个文件以相同的文本开头怎么办？那么，如果你按两次\
  \ `Tab`，终端窗口将会在原处显示所有选项。（理解这一章的最佳方法是打开终端窗口并边阅读说明边练习。）\n\n让我们来看一个例子。在我的家目录下，有两个文件：`test.sh`\
  \ 和 `test.txt`。一旦我开始输入 `cat tes`，我按一次 `Tab`，它就向我显示了 `cat test.`。这意味着我有多个同名的文件。然后我按两次\
  \ `Tab`，它会向我显示当前目录下的文件列表。最后，我可以打开所需的文件，即 `test.txt`：\n\n```\nroot@kali:~# cat test.\n\
  Test.sh      test.txt\nroot@kali:~ cat test.txt\ntest\n```\n\n要在任何工具运行时停止其执行，你可以使用\
  \ `Ctrl+C` 快捷键来停止它。\n\n要退出并关闭终端窗口，请使用 `exit` 命令或按下 `Ctrl+D` 来完成任务。\n\n要从终端窗口重启 Kali\
  \ Linux，必须使用 `reboot` 命令；要关机，必须使用 `poweroff` 命令。\n\n现在，要获取最近执行的命令列表，你必须使用 `history`\
  \ 命令。\n\n在 Linux 中，你必须理解我们在终端窗口中使用了许多重定向。例如，为了将 `ls` 命令的输出保存到文件中，我可以使用 `>`（大于）字符将终端窗口的输出重定向到文本文件：\n\
  \n```\nkali@kali:~$ ls > ls_file.txt\nkali@kali:~$ cat ls_file.txt \nDesktop\nDocuments\n\
  Downloads\nls_file.txt\nMusic\nPictures\nPublic\nTemplates\nVideos\n```\n\n现在，你可以通过重定向（打印）文本文件内容到终端窗口来执行相反操作，使用\
  \ `<`（小于）字符：\n\n```\nkali@kali:~$ cat < ls_file.txt\nDesktop\nDocuments\nDownloads\n\
  ls_file.txt\nMusic\nPictures\nPublic\nTemplates\nVideos\n```\n\n另一种你需要知道的重定向是管道。总结来说，你可以通过\
  \ `|` 字符将一个命令的输出传递给下一个命令：\n\n```\n$command 1 | command2\n```\n\n例如，我会读取一个文件，然后对结果进行排序，最后使用\
  \ `grep` 命令过滤出某些字符串（目标是提取以 *test* 开头的行）：\n\n```\ncat file | sort | grep test\ntest.sh\n\
  test.txt\n```\n\n### Tmux 终端窗口\n\nTmux 是允许你在当前会话中管理多个窗口的特殊终端窗口。通过示例来解释它是最好的。\n\n\
  #### 启动 Tmux\n\n启动你只需在终端窗口中输入 `Tmux`。在终端窗口底部，你会发现为你的标签分配了一个编号和名称，如图 1.1 所示。\n\n\
  ![Tmux 新窗口的快照。](img/c01f001.png)\n\n图 1.1 Tmux 新窗口\n\n结果如何？假设你正在进行一项任务，你想在一个窗口中运行\
  \ Nmap，在另一个窗口中运行 Metasploit，以此此类推。这就是 Tmux 方便的地方，因为你可以同时处理多个窗口/会话。\n\n#### Tmux\
  \ 键绑定\n\n在 Tmux 中，你必须使用 `Ctrl+B` 来指示它执行 Tmux 操作（命令）。事实上，`Ctrl+B` 组合键是默认的。你可以在配置文件更改\
  \ Tmux 的默认设置。要更改此行为并用 `Ctrl+A` 代替 `Ctrl+B`，你必须自己创建配置文件。要完成任务，你有两种选择。第一种是创建一个用户特定的文件\
  \ `~/.tmux.conf`，第二种是创建一个全局（针对所有用户）的 `/etc/tmux.conf` 文件。在我的情况下（为了本示例），我将在 `/etc/tmux.conf`\
  \ 添加配置文件（并在其中添加键绑定的配置）：\n\n```\nroot@kali:/# touch /etc/tmux.conf\nroot@kali:/#\
  \ echo unbind C-b>> /etc/tmux.conf\nroot@kali:/# echo set -g prefix C-a>> /etc/tmux.conf\n\
  root@kali:/# echo bind C-a send-prefix>> /etc/tmux.conf\n```\n\n\n\n\n\n在图 1.1 中，你可以看到\
  \ `bash` 名称已自动分配给你的当前会话。\n\n### 重命名窗口\n\n要重命名会话，请先按 `Ctrl+B`（如果你之前按照我们说的修改了配置文件，则按\
  \ `Ctrl+A`）。然后将手移开键盘，并按下键盘上的逗号（`,`）键。你会看到提示符已改变，允许你进行重命名。我将其命名为 `Window1`；完成任务后按\
  \ `Enter`：\n\n```\n(rename-window) Window1\n```\n\n### 创建窗口\n\n在此阶段，我们只有一个窗口，所以让我们通过按下\
  \ `Ctrl+B` 然后按下 `C` 键来创建第二个窗口。查看底部，你会看到有一个新的 `bash` 窗口，并且 `Tm` 已经用星号（`*`）高亮了当前标签页，如图\
  \ 1.2 所示。\n\n![Tmux 高亮新标签页截图。](img/c01f002.png)\n\n图 1.2 Tmux 高亮标签页\n\n### 分割窗口\n\
  \n要将选定的标签页左右拆分为两个子窗口（如图 1.3\n\n图 1.3 Tmux 左右垂直分窗口\n\n#### 在 Tmux 内部导航\n\n很棒吧？如你所见，光标在右侧面板（参见图\
  \ 1.3）。要在面板（子窗口）之间切换，请按 `Ctrl+B` 并使用键盘上的方向键（分别改变左、右、上、下）。\n\n接下来，回到 `Window1` 会话。要在窗口之间切换，请按\
  \ `Ctrl+B` 然后输入窗口编号（在本例中为 `0`），我们应该回到了第一个窗口。\n\n现在，将窗口上下分为两个部分，一个在上在上，如图 1.4 所示。要完成此操作，请使用\
  \ `Ctrl+B` 然后按下双引号（`\"`）。记住你需要按下 `Shift+\"`，否则该键会产生单引号。\n\n![Tmux 水平分窗口截图。](img/c01f004.png)\n\
  \n图 1.4 Tmux 水平分窗口\n\n管理 Tmux 的最后一个技巧是在窗口或面板会话中上下滚动。。事实上，你无法使用鼠标在 `Tmux` 会话中上下滚动（鼠标滚动用于命令历史记录）。相反，你需要按下\
  \ `Ctrl+B` 然后按下键盘上的 ``，之后你就可以使用键盘上的上、下方向键进行滚动。滚动完成后，按下 `Esc` 或 `Q` 键即可返回普通模式。\n\n\
  要关闭面板或窗口，只需像任何普通终端会话一样使用 `exit` 即可。\n\n#### Tmux 命令参考\n\n[表 1.1 总结了在本节中学习的所有 `Tmux`\
  \ 命令。你可以将其作为参考（这只是一个快速指南，让你开始使用 Tmux；如果你想学习更深层次的内容，请查阅手册参考）。\n\n| 描述 | 命令 |\n| ---\
  \ | --- |\n| 重命名窗口 | `Ctrl+B+,` |\n| 打开新窗口 | `Ctrl+B+C` |\n| 垂直分割窗口 | `Ctrl+B+%`\
  \ |\n| 水平分割窗口 | `Ctrl+B+\"` |\n| 在子窗口间导航 | `Ctrl+B+Left Arrow`, `Ctrl+B+Right Arrow`\
  \ |\n| 在窗口间切换 | `Ctrl+B+[window number]` |\n| 上滚 | `Ctrl+B++Up Arrow` |\n| 下滚 |\
  \ `Ctrl+B+[+Down Arrow` |\n| 退出滚动模式 | `Esc` |\n| 关闭面板/窗口 | 输入 `exit`（在内部） |\n\n\
  [表 1.1 Tmux 快捷键\n\n## 在 Kali 中管理用户和组\n\n理解管理用户和组的命令是非常重要的，因为你稍后在书中学习权限提升时会用到这些信息。本章中的所有命令都对你在使用\
  \ Kali Linux（作为渗透测试的操作系统）时的任务非常有帮助。\n\n图 1.5 总结了 Kali Linux 中所有与用户管理/安全相关的命令。\n\n\
  ### 用户命令\n\n低权限用户必须在命令前加上 `sudo` 来执行系统命令（且低权限用户必须在 `sudo` 组中才能执行 `sudo`）。如果你想使用\
  \ `sudo` 命令，系统会要求你输入账户密码。例如，如果你想执行 `fdisk` 系统工具显示 Kali 连接的设备，请使用以下命令：\n\n```\nroot@kali:~#\
  \ fdisk -l\nDisk /dev/sda: 80 GiB, 85899345920 bytes, 167772256 sectors\n```\n\n\
  \n\n\n```\nGus@kali:~$ last\nroot      tty7         :0               Tue Sep 22\
  \ 10:24   still logged in\nreboot    system boot  5.7.0-kali1-amd6 Tue Sep 22 10:24\
  \   still running\nroot      tty8         :1               Tue Sep 22 10:21 - 10:23\
  \ (00:02)\nkali      pts/1        tmux(1793).%0    Mon Sep 21 12:16 - 10:23 (22:07)\n\
  kali      pts/2        tmux(1584).%0    Mon Sep 21 11:48 - 11:48 (00:00)\nkali \
  \     tty7         :0               Mon Sep 21 10:50 - 10:23 (23:33)\nreboot   \
  \ system boot  5.7.0-kali1-amd6 Mon Sep 21 10:50 - 10:23 (23:33)\nkali      tty7\
  \         :0               Mon Jul 27 13:36 - 15:56 (02:20)\nreboot    system boot\
  \  5.7.0-kali1-amd6 Mon Jul 27 13:36 - 15:57 (02:20)\nkali      tty7         :0\
  \               Mon Jul 27 13:31 - crash (00:05)\nreboot    system boot  5.7.0-kali1-amd6\
  \ Mon Jul 27 13:30 - 15:57 (02:26)\nkali      tty7         :0               Mon\
  \ Jul 27 13:28 - crash (00:02)\nreboot    system boot  5.7.0-kali1-amd6 Mon Jul\
  \ 27 13:28 - 15:57 (02:28)\n\nwtmp begins Mon Jul 27 13:28:09 2020\n```\n\n最后，请注意\
  \ Kali 中的所有用户都存储在配置文件 `/etc/passwd` 中。使用 `cat` 命令可以查看其内容：\n\n```\n Gus@kali:~$ cat\
  \ /etc/passwd\nroot:x:0:0:root:/root:/bin/bash\ndaemon:x:1:1:daemon:/usr/sbin:/usr/sbin/nologin\n\
  bin:x:2:2:bin:/bin:/usr/sbin/nologin\n```\n\n上一个命令将列出所有用户，甚至是系统用户（示例仅显示了前三个）。为了过滤内容并限制结果为人类用户，可以在\
  \ `grep` 命令中使用 `|` 管道符号输出：\n\n```\n Gus@kali:~$ cat /etc/passwd | grep \"/bin/bash\"\
  \nroot:x:0:0:root:/root:/bin/bash\npostgres:x:119:124:PostgreSQL administrator,,,:/var/lib/postgresql:/bin/bash\n\
  kali:x:1000:1000:kali,,,:/home/kali:/bin/bash\nGus:x:1001:1001::/home/Gus:/bin/bash\n\
  ```\n\n### 组命令\n\n在 Kali Linux 中添加新组，请使用 `groupadd` 命令：\n\n```\n $groupadd [新组名]\n\
  \nGus@kali:~$ sudo groupadd hackers\n```\n\n要将用户（在本例中为 Gus）加入我们之前创建的 `hackers` 组，请执行\
  \ `usermod` 命令：\n\n```\n $usermod -aG [组名] [用户名]\n\nGus@kali:~$ sudo usermod -aG\
  \ hackers Gus\n```\n\n要列出 Kali Linux 中创建的所有组，打开 `/etc/group` 文件。再次使用 `cat` 命令完成任务（以下示例仅显示了前三个）：\n\
  \n```\n Gus@kali:~$ cat /etc/group\nroot:x:0:\ndaemon:x:1:\nbin:x:2:\n[…]\nhackers:x:1002:Gus\n\
  ```\n\n### 在 Kali 中管理密码\n\n你可能想像以前那样找回 root 用户。要找回这个账户，你首先需要设置它的密码。更改用户密码，必须使用 `passwd`\
  \ 命令：\n\n```\n Gus@kali:~$ sudo passwd root\nNew password: \nRetype new password:\
  \ \npasswd: password updated successfully\n```\n\n现在要使用强大的 root 账户，必须使用 `su` 命令切换用户：\n\
  \n```\n Gus@kali:~$ sudo su root\nroot@kali:/home/Gus#\n```\n\n从现在起，在登录界面上，你可以选择\
  \ root 账户而不是非 root 用户。\n\n最后，要列出 Kali Linux 中所有用户的凭据，你可以在 `/etc/shadow` 文件中查看。使用\
  \ `grep` 命令获取 Gus 的用户凭据：\n\n```\n root@kali:/# cat /etc/shadow | grep \"Gus\"\n\
  Gus:$6$Hb.QBfIoaCBTiqK$EUJ4ZdWmbsFqHMsPbMEz2df6FtWVf4J/tMulxCoLQmfMlVWyqpMUHBGm0RYHgFIF.hQTANgzJ6CQ8/:18527:0:9999:7\n\
  ```\n\n简化一下这个字符串。每个部分的分割符是冒号（`:`）。其次，`$6$` 表示使用了 SHA512 哈希。\n\n哈希后的密码位于 `$6$` 之后、冒号\
  \ `:` 之前：\n\n```\nHb.QBfIoaCBTiqK$EUJ4ZdWmbsFqHMsPbMEz2df6FtWVf4J/tMulxCoLQmfMlVWyqpMUHBGm0RYHgFIF\n\
  ```\n\n## Kali Linux 中的文件和文件夹管理\n\n你在 Linux 系统中的下一个挑战是学习如何管理文件和文件夹。在本节结束，你将开始像专家一样使用文件和目录。\n\
  \n### 显示文件和文件夹\n\n要列出任何目录内的文件和文件夹，使用 `ls` 命令（我经常使用它）。但有时仅靠 `ls` 命令不够，你可能需要添加一些选项来获得更好的输出。你可以使用的第一个选项是\
  \ `-a`（显示所有文件），第二个选项是 `-l`（格式化列表）：\n\n```\nroot@kali:~# ls\nDesktop Downloads Videos\n\
  root@kali:~# ls -la\ntotal 144\ndrwx------ 4 root root 4096 Sep 22 10:24 .\ndrwxr-xr-x\
  \ 19 root root 36864 Jul 27 15:41 ..\n-rw------- 1 root root 155 Sep 22 10:23 .bash_history\n\
  -rw-r--r-- 1 root root 570 Jul 18 17:08 .bashrc\ndrwx------ 6 root root 4096 Sep\
  \ 22 11:21 .cache\ndrwxr-xr-x 8 root root 4096 Sep 22 10:22 .config\ndrwxr-xr-x\
  \ 2 root root 4096 Sep 22 10:21 Desktop\n-rw-r--r-- 1 root root 55 Sep 22 10:21\
  \ .dmrc\ndrwxr-xr-x 2 root root 4096 Sep 22 10:21 Documents\ndrwxr-xr-x 2 root root\
  \ 4096 Sep 22 10:21 Downloads\n-rw-r--r-- 1 root root 11656 Jul 27 13:22 .face\n\
  lrwxrwxrwx 1 root root 11 Jul 27 13:22 .face.icon -> /root/.face\ndrwx------ 3 root\
  \ root 4096 Sep 22 10:24 .gnupg\n-rw------- 1 root root 306 Sep 22 10:24 .ICEauthority\n\
  drwxr-xr-x 3 root root 4096 Sep 22 10:21 .local\ndrwxr-xr-x 2 root root 4096 Sep\
  \ 22 10:21 Music\ndrwxr-xr-x 2 root root 4096 Sep 22 10:21 Pictures\n-rw-r--r--\
  \ 1 root root 148 Jul 18 17:08 .profile\ndrwxr-xr-x 2 root root 4096 Sep 22 10:21\
  \ Public\ndrwxr-xr-x 2 root root 4096 Sep 22 10:21 Templates\ndrwxr-xr-x 2 root\
  \ root 4096 Sep 22 10:21 Videos\n-rw------- 1 root root 98 Sep 22 10:24 .Xauthority\n\
  -rw------- 1 root root 5961 Sep 22 10:24 .xsession-errors\n-rw------- 1 root root\
  \ 6590 Sep 22 10:23 .xsession-errors.old\nroot@kali:~#\n```\n\n请注意，以点字符开头的文件名意味着它们是隐藏的（例如\
  \ `.bash_history`）。此外，在权限的最左侧，字母 `d` 表示它是一个目录而不是文件。最后，你可以通过指定目标文件夹的路径，不同于当前目录列出另一个目录的内容：\n\
  \n```\n $ls -la [目标目录路径]\n```\n\n### 权限\n\n权限的相同原理适用于文件或目录。为了简化，权限被分为三类：\n\n*  \
  \ 读取 (`r`): 4\n*   写入 (`w`): 2\n*   执行 (`x`): 1\n\n权限模板遵循以下模式：\n\n```\n[用户:r/w/x]\
  \ [组:r/w/x] [所有人:r/w/x]\n```\n\n![Kali Linux – 文件与文件夹命令的示意说明图。](img/c01f006.png)\n\
  \n图 1.6 Kali Linux – 文件和文件夹命令\n\n让我们来看一个实际例子。假设你创建了一个简单的 shell 脚本来打印“test”（使用 `echo`\
  \ 命令），并且你想显示权限（注意此示例在终端窗口内使用了 root 用户）：\n\n```\nroot@kali:~# echo 'echo test'> test.sh\n\
  root@kali:~# ls -la | grep 'test.sh'\n-rw-r--r-- 1 root root 10 Sep 22 11:25 test.sh\n\
  root@kali:~#\n```\n\n从之前的输出结果中可以看到：\n\n*   对于 root 用户，因为开头是 `rw`，你可以读取和写入。\n*  \
  \ 对于 root 组，他们只能读取此文件。\n*   对于系统上的其他人，他们只能读取。\n\n假设你想执行这个文件，因为你是创建它的，而且你是主 root。你认为你能这样做吗（根据之前的\
  \ root 用户权限）？\n\n```\nroot@kali:~# ./test.sh\nbash: ./test.sh: Permission denied\n\
  ```\n\n确实，root 没有执行它的权限，对吧？根据公式（ `r` =4, `w` =2, 和 `x` =1）更改之前文件的权限，请使用这个：\n\n*\
  \   用户：4+2+1=**7**；组：4+2+1=**7**；所有人：4+2+1=**4**\n\n然后，使用 `chmod` 命令完成任务（这次你应该可以执行\
  \ shell 脚本了）。\n\n\n\n\n\n```\n $chmod [permissions numbers] [file name]\n\nroot@kali:~#\
  \ chmod 774 test.sh\nroot@kali:~# ls -la | grep 'test.sh'\n-rwxrwxr-- 1 root root\
  \ 10 Sep 22 11:25 test.sh\nroot@kali:~# ./test.sh\ntest\nroot@kali:~# \n```\n\n\
  这种操作还有另一种快捷方法，允许执行文件而不是计算每个权限的数字。我们只需要在 `chmod` 命令中添加 `+x`即可（但要小心，因为当你执行这条命令时，你也会给所有人赋予执行权限）：\n\
  \n```\n $chmod +x [file name]\n\nroot@kali:~# chmod +x test.sh\nroot@kali:~# ls\
  \ -la | grep 'test.sh'\n-rwxrwxr-x 1 root root 10 Sep 22 11:25 test.sh\n```\n\n\
  ### 在 Kali 中操作文件\n\n要在 Linux 中简单创建一个空文件，你可以使用 `touch` 命令：\n\n```\n $touch [new file]\
  \ \n```\n\n要快速向文件中插入文本，你可以使用 `echo` 命令。在本章的后续部分，你将学习如何使用文本编辑器编辑文件：\n\n```\n $echo\
  \ 'text to add'> [file name]\n```\n\n要了解 Linux 系统中的文件类型，你必须使用 `file` 命令：\n\n```\n\
  \ $file [file name]\n```\n\n让我们在终端窗口中组合所有这些命令：\n\n```\n root@kali:~# touch test.txt\n\
  root@kali:~# echo test> test.txt\nroot@kali:~# file test.txt\ntest.txt: ASCII text\n\
  ```\n\n要在 Kali 中复制文件，你必须使用 `cp` 命令完成任务：\n\n```\n $ cp [source file path] [destination\
  \ file path]\n\nroot@kali:~# cp test.txt /home/kali\nroot@kali:~# ls /home/kali\n\
  Desktop    Downloads    Music     Public     test.sh     Videos\nDocuments  ls_file.txt\
  \  Pictures  Templates  test.txt\n```\n\n要移动等同于 Windows 操作系统中“剪切”的文件，你必须使用 `mv`\
  \ 命令：\n\n```\n $mv [source file path] [destination file path]\n\nroot@kali:~# mv\
  \ test.txt Documents/\nroot@kali:~# ls Documents/\ntest.txt\n```\n\n要删除我们之前复制到 `kali`\
  \ 家目录目录下的文件，请使用 `rm` 命令：\n\n```\n $rm [file path – that you want to delete]\nroot@kali:~#\
  \ rm /home/kali/test.txt\n```\n\n要重命名之前的文件，我们使用与移动文件时相同的 `mv` 命令：\n\n```\n $mv [original\
  \ file name] [new file name]\nroot@kali:~/Documents# mv test.txt hello.txt\nroot@kali:~/Documents#\
  \ ls\nhello.txt\n```\n\n### 搜索文件\n\n在 Kali 中有多种方法搜索文件；最常用的三种命令是 `locate`、`find`\
  \ 和 `which`。\n\n你可以使用 `locate` 命令快速定位你正在寻找的文件。你需要知道，`locate` 命令将其数据存储在数据库中，因此当你搜索时，找到结果会更快。\n\
  \n首先，你需要使用 `updatedb` 命令为 `locate` 命令更新数据库：\n\n```\n $updatedb\n```\n\n现在，我们可以使用\
  \ `locate` 命令开始搜索：\n\n```\n $locate [file name]\nroot@kali:/# locate test.sh\n/home/kali/test.sh\n\
  /usr/share/doc/socat/examples/readline-test.sh\n/usr/share/doc/socat/examples/test.sh\n\
  ```\n\n你可以使用 `locate` 命令的 `-n` 选项来过滤输出结果的数量。如果你知道结果将是巨大的，这个选项非常有用：\n\n```\n $locate\
  \ -n [i] [search file criteria]\nroot@kali:/# locate *.conf -n 3\n/etc/adduser.conf\n\
  /etc/ca-certificates.conf\n/etc/debconf.conf\n```\n\n要查找应用程序路径，请使用 `which` 命令。该命令将使用\
  \ `$PATH` 环境变量来查找你想要的结果。例如，要查找 Python 安装位置，你可以执行以下操作：\n\n```\n $which [application\
  \ name]\n\nroot@kali:/# which python\n/usr/bin/python\n```\n\n理解 Linux 系统将使用 `$PATH`\
  \ 来执行二进制文件是非常重要的。如果你在终端窗口中运行它，它将显示你应该保存程序/脚本的所有目录（如果你想在不指定路径的情况下执行它们）：\n\n```\n\
  \ root@kali:/# $PATH\nbash: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:\
  \ No such file or directory\n```\n\n让我们来看一个实际例子；我将 `test.sh` 文件保存在我的家目录下。由于家目录不在\
  \ `$PATH` 变量中，这意味着我只有指定路径才能执行它，否则将失败：\n\n```\n root@kali:~# test.sh\nbash: test.sh:\
  \ command not found\nroot@kali:~# ./test.sh\ntest\n```\n\n另一个带有更灵活选项查找文件的有用命令是 `find`\
  \ 命令。使用 `find` 工具的优势是它允许添加更细粒度的过滤器来找到你正在寻找的内容。例如，要在根家目录下查找 `file1.txt`，请使用此命令：\n\
  \n```\n root@kali:~# find /root -name \"file1.txt\"\n/root/temp/file1.txt\n```\n\
  \n假设你想列出系统中的大文件（1GB+）：\n\n```\n root@kali:~# find / -size +1G 2> /dev/null\n/proc/kcore\n\
  ```\n\n以下是一个方便的 `find` 过滤器，用于搜索 Linux 中用于权限提升的 `setuid` 文件（你将在第 10 章“Linux 权限提升”中学习所有细节）：\n\
  \n```\n $ find / -perm -u=s -type f 2>/dev/null\n```\n\n### 文件压缩\n\n有多种方法（压缩算法）可以压缩文件；我将在本节中涵盖\
  \ `.tar`、`.gz`、`.bz2` 和 `.zip` 扩展。\n\n是压缩和解压不同类型的命令列表：\n\n#### Tar 存档\n*   使用 tar\
  \ 压缩：\n    ```\n     tar cf\n    ```\n*   提取 tar：\n    ```\n     tar xf\n    ```\n\
  \n#### Gz 存档\n*   创建压缩.gz：\n    ```\n     tar cfz\n    ```\n*   提取压缩.gz：\n    ```\n\
  \     tar xfz\n    ```\n\n#### Bz2 存档\n*   创建压缩.bz2：\n    ```\n     tar cfj\n  \
  \  ```\n*   提取压缩.bz2：\n    ```\n     tar xfj\n    ```\n\n#### Zip 存档\n*   创建压缩.zip：\n\
  \    ```\n     zip\n    ```\n*   提取压缩.zip：\n    ```\n     unzip\n    ```\n\n###\
  \ 在 Kali 中操作目录\n\n要打印当前工作目录，你必须使用 `pwd` 命令完成任务（不要混淆 `pwd` 命令和 `passwd` 命令；它们是两个东西）：\n\
  \n```\n $pwd\n```\n\n要更改当前工作目录，你必须使用 `cd` 命令：\n\n```\n $cd [new directory path]\n\
  ```\n\n你可以使用 `..` 向上遍历目录。事实上，你可以一直添加直到系统根目录 `/`：\n\n```\n root@kali:~/Documents#\
  \ pwd\n/root/Documents\nroot@kali:~/Documents# cd ../../\nroot@kali:/# pwd\n/\n\
  ```\n\n最后的提示，对于 `cd` 命令，你可以使用字符 `~` 直接回到当前用户的家目录：\n\n```\n $cd ~\n```\n\n要在根家目录下创建一个\
  \ `test` 的目录，请使用 `mkdir` 命令：\n\n```\n $mkdir [new directory name]\n```\n\n要复制、移动和重命名目录，请使用与文件命令相同的命令。有时你必须添加\
  \ `-r`（代表递归）选项来涉及子目录：\n\n```\n $cp -r [source directory path] [destination directory\
  \ path]\n$mv -r [source directory path] [destination directory path]\n$mv -r [original\
  \ directory name] [new directory name]\n```\n\n要删除文件夹，你必须在 `rm` 命令中添加 `-r` 选项完成任务：\n\
  \n```\n $rm -r [folder to delete path]\n```\n\n\n\n\n\n让我们来看如何在 Kali Linux 中挂载目录的实际示例。假设你插入了一个\
  \ USB 闪存；那么为了访问 USB 驱动器的内容，挂载一个目录是必要的。如果你在设置中禁用了自动挂载功能（该功能在 Kali 2020.1 版本中默认开启），则需要这样做。\n\
  \n![USB 挂载截图。](img/c01f007.png)\n\n图 1.7 USB 挂载\n\n要挂载 USB 驱动器，请遵循以下步骤：\n\n1. 使用\
  \ `lsblk` 命令显示磁盘列表。\n2. 建立一个用于挂载的新目录（这是你访问 USB 闪存的地方）。\n3. 使用 `mount` 命令挂载 USB 驱动器。\n\
  \n![使用命令行挂载的截图。](img/c01f008.png)\n\n图 1.8 使用命令行挂载\n\n现在，要卸出 USB 驱动器，请使用 `umount`\
  \ 命令卸载该目录：\n\n```\nroot@kali-laptop-hp:~# umount /mnt/usb\n```\n\n### 在 Kali Linux\
  \ 中管理文本文件\n\n了解如何在 Kali Linux 中处理文件是你在执行任务过程中经常会遇到的。在本节中，你将学习用于完成任务的最常用命令。\n\n有许多方法可以在终端窗口中快速显示文本文件。90%\
  \ 的情况下，我使用 `cat` 命令来实现此目的。如果你想显示一个大型文本文件（例如密码字典文件）怎么办？你有三个选择：`head`、`tail` 以及 `more`\
  \ 和 `less` 命令。需要注意的是，你可以使用 `grep` 命令来过滤出你想要的结果。例如，为了在 `rockyou.txt` 字典文件中识别单词 `gus123`，你可以执行以下操作：\n\
  \n```\nroot@kali:/usr/share/wordlists# cat rockyou.txt | grep gus123\ngus123\nangus123\n\
  gus12345\n[...]\n```\n\n`head` 命令将显示文本文件中从顶部开始的 10 行，你可以通过添加 `-n` 选项来指定想要显示的行数：\n\
  \n```\n$head -n [i] [file name]\n\nroot@kali:/usr/share/wordlists# head -n 7 rockyou.txt\n\
  123456\n12345\n123456789\npassword\niloveyou\nprincess\n1234567\n```\n\n`tail` 命令将显示文件的最后\
  \ 10 行，你同样可以使用 `-n` 开关来指定行数：\n\n```\n$tail -n [i] [file name]\n\nroot@kali:/usr/share/wordlists#\
  \ tail -n 5 rockyou.txt\nxCvBnM,\nie168\nabygurl69\na6_123\n7!Vamos!\n```\n\n要浏览大文件，请使用\
  \ `more` 命令。你需要按键盘上的回车键或空格键来向前进。按 B 键可以后退。最后，要搜索文本，按下 `/`（向前）并按 `Q` 键退出：\n\n```\n\
  $more [file name]\n```\n\n`less` 类似于 `more` 命令；它允许你查看文件内容并在内部进行良好的导航。`more` 和 `less`\
  \ 之间的主要区别是 `less` 命令比 `more` 快，因为它不会一次加载整个文件，并且允许你使用 Page Up/Down 键在文件内部进行导航：\n\n\
  ```\n$less [file name]\n```\n\n要对文本文件排序，只需使用 `sort` 命令：\n\n```\n$sort [file name]>\
  \ [sorted file name]\n\nroot@kali~/temp# cat file1.txt\n5\n6\n4\nroot@kali~/temp#\
  \ sort file1.txt>file_sorted.txt\nroot@kali~/temp# cat file_sorted.txt\n4\n5\n6\n\
  ```\n\n要删除文本文件中的重复项，你必须使用 `uniq` 命令：\n\n```\n$uniq [file name]> [no duplicates file\
  \ name]\n\nroot@kali~/temp# cat file2.txt\n5\n6\n4\n5\n5\nroot@kali~/temp# uniq\
  \ file2.txt> file_uniq.txt\nroot@kali~/temp# cat file_uniq.txt\n5\n6\n4\n```\n\n\
  在本书后面的部分，你将学习如何结合使用 `sort` 和 `uniq` 命令来创建一个自定义密码文件。\n\n### Vim 与 Nano\n\n对于终端窗口，我们有两个文本编辑器：`vim`\
  \ 和 `nano`。大多数时候，你可以在编辑器中处理任务：\n* 打开/创建文本文件\n* 进行文本更改\n* 搜索文本\n* 保存并退出\n\nNano 比\
  \ `vim` 更简单。选择其中任何一个取决于你；这取决于喜好。要打开/创建文本文件，请使用这些命令：\n\n* `$vim [filename]`\n* `$nano\
  \ [filename]`\n\n一旦打开了文本文件，你将需要开始进行更改：\n* 在 `nano` 中，你可以自由地输入文本。\n* 在 `vim` 中，你需要按\
  \ `I` 进入插入模式。\n\n如果你想在文件中搜索特定单词，请使用这些命令：\n* 在 `nano` 中，按 `Ctrl+W`。\n* 在 `vim` 中，取决于你处于哪种模式：\n\
  \    * 在 `nano` 中，按 `Ctrl+W`。\n    * 在 `vim` 中，取决于你处于哪种模式：\n    * 在 `nano` 中，按 `Ctrl+W`。\n\
  \n最后，要保存并退出：\n* 在 `nano` 中，按 `Ctrl+O` 保存，然后按 `Ctrl+X` 退出。\n* 在 `vim` 中，按 `Esc` 进入命令模式，然后输入\
  \ `:wq` 保存并退出。\n\n### 搜索与过滤文本\n\n在 Kali Linux 中处理文件是你在执行任务过程中经常会遇到的事情。在本节中，你将学习用于完成任务的最常用命令。\n\
