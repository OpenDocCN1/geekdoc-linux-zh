  \n\n\n\n\n- `Show Images On Buttons` 在窗口对话框按钮旁显示图标（而非面板内部的按钮）。\n- `Show Images In\
  \ Menus` 在应用程序菜单和面板菜单的项目旁显示图标。\n- `Enable Editable Accelerators` 允许你为菜单项定义快捷键。\n\
  \n## 事件声音\n\n- `Enable Event Sounds` 允许你在事件发生时听到音频提示（例如，向你的 Kali 插入 USB 盘）。\n- `Enable\
  \ Input Feedback Sounds` 播放事件声音，如调整窗口大小或点击按钮等。\n\n## 桌面\n\n此窗口允许你更改桌面背景、菜单和图标。\n\
  \n### 背景\n\n此标签页有许多选项，如图 A.14 所示所示，可以为你提供精美的桌面背景图。\n\n- `Folder` 允许你更改图像所在的位置。\n\
