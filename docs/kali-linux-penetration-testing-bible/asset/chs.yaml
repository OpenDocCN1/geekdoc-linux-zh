  ```\n\n## 列出任务和进程\n\n要列出 操作系统上的所有任务和进程，你需要使用 `tasklist /v` 命令。该命令的输出非常大且繁琐。你可以过滤结果以仅显示系统进程：\n\
  \n```\n C:\\>tasklist /v /fi \"username eq system\"\n\nImage Name        PID Session\
