  \ 栈\n\n### 总结\n\n如果你觉得这一章很难，那是正常的。汇编语言是独特的。就像其他任何事情一样，所涵盖的内容都涵盖了。\n\n\n\n\n理解栈是如何工作的最佳方法是通过一个真实的示例。在学习汇编指令时，C\
  \ 语言是一门非常棒的语言。如果你不知道 C/C++ 编程是如何运作的，请不要担心；我们将检查它的每一行代码。在上一个章节中，你看到了一个 `HelloWorld.c`\
  \ 程序。在本节中，我们将更进一步，创建一个程序来使缓冲区（buffer）可视化：\n\n```c\n // C 语言中处理字符串需要 string.h 库\n\
  #include <string.h>\n// copy 函数将字符串消息拷贝到缓冲区中。 \n// Char* 在 C 语言中表示字符串。\nvoid copy(char*\
  \ message)\n{\n          // 声明一个字符数组\n          char buffer[15];\n\n          //\
  \ 将 message 参数拷贝到缓冲区数组中\n          strcpy(buffer, message);\n}\n\n// main 函数是程序启动时调用的函数\n\
  int main(int argc, char* argv[]) \n{\n          // 整数局部变量\n          int local_variable\
  \ = 1;\n\n          // 调用 copy 函数并将用户在命令行输入的参数值传递给它。\n          copy(argv[1]);\n\
  \n          // 退出应用程序\n          return 0;\n}\n```\n\n这个 C 程序中发生了什么？首先，我们创建了 `main`\
  \ 函数，它从命令行接收参数。`argc` 是参数计数器，`argv` 是一个字符串数组。计数器总是从 1 开始，因为参数 `0` 是应用程序名称，而不是参数本身（`argv[1]`、`argv[2]`\
  \ 等将包含命令行输入的值）。在第一行（`main` 函数内部），我们声明了一个哑的整数变量（`local_variable`），用以观察它在反向工程过程中是如何拟合的。接下来，我们调用了\
  \ `copy` 函数，并传递了我们在命令行中输入的字符串参数。在 `copy` 函数中，我们创建了一个字符数组；这就是我们存储消息的地方。最后，我们将从命令行输入拷贝到缓冲区数组中。\n\
