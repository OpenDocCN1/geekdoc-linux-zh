  \n图 A.20 高级显示设置\n\n### 显示\n\n在显示标签页（如图 A.22 所示）下，你可以更改文件管理器的视图设置。\n\n你可以更改以下设置：\n\
  \n- 默认视图\n- 文件夹\n- 是否显示缩略图\n- 是否显示大小\n\n![文件](img/bapp01f019.png)\n\n图 A.21 显示设置\n\
  \n![文件管理器的截图。](img/bapp01f022.png)\n\n图 A.22 文件管理器\n\n### 侧边栏\n\n侧边栏标签页允许你更改侧边栏的设置。\n\
