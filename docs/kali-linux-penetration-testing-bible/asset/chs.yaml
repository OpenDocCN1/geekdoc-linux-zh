  \ KCorp.local\n|  Forest name: KCorp.local\n|  FQDN: Windows10Lab02.KCorp.local\n\
  |_ System time: 2020-06-18T06:36:19-07:00\n|  smb-security-mode: \n|  account_used:\
  \ guest\n|  authentication_level: user\n|  challenge_response: supported\n|_ message_signing:\
  \ disabled (dangerous, but default)\n| smb2-security-mode: \n|  2.02: \n|_   Message\
  \ signing enabled but not required\n| smb2-time: \n|   date: 2020-06-18T13:36:19\n\
  |_  start_date: 2020-06-18T13:32:18\n```\n\n接下来，我们可以使用 Nmap 脚本扫描运行漏洞扫描，看看是否可以获取更多信息（我没有使用\
  \ `smb*,`，因为那非常耗时且具有攻击性）：\n\n```\nroot@kali:~# nmap ‐sV ‐p 445 ‐‐script=smb‐vuln*\
  \ 172.16.0.106\nStarting Nmap 7.80 ( https://nmap.org ) at 2020-06-18 10:27 EDT\n\
  Nmap scan report for 172.16.0.106\nHost is up (0.00025s latency).\n\nPORT    STATE\
  \ SERVICE      VERSION\n445/tcp open  microsoft-ds Microsoft Windows 7 - 10 microsoft-ds\
  \ (workgroup: KCORP)\nMAC Address: 00:0C:29:87:09:90 (VMware)\nService Info: Host:\
  \ WINDOWS10LAB02; OS: Windows; CPE: cpe:/o:microsoft:windows\n\nHost script results:\n\
  |_smb-vuln-ms10-054: false\n|_smb-vuln-ms10-061: NT_STATUS_ACCESS_DENIED\n| smb‐vuln‐ms17‐010:\n\
  |  VULNERABLE:\n|  Microsoft SMBv1 服务器中存在远程代码执行漏洞 (ms17-010)\n|   State: VULNERABLE\n\
  |   IDs: CVE:CVE-2017-0143\n|   Risk factor: HIGH\n|  Microsoft SMBv1 服务器 (ms17-010)\
  \ 中存在一个的远程代码执行漏洞。\n| \n| Disclosure date: 2017-03-14\n| References:\n|   https://technet.microsoft.com/en-us/library/security/ms17-010.aspx\n\
  |   https://blogs.technet.microsoft.com/msrc/2017/05/12/customer-guidance-for-wannacrypt-attacks/\n\
  |_  https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-0143\n\n服务检测完成。请在 https://nmap.org/submit/\
