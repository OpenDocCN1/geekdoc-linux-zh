  \ Temp: 37c Fan: 0% Util: 6% Core:1410MHz Mem:6801MHz Bus:1\n\nStarted: Wed Oct\
  \ 21 15:39:51 2020\nStopped: Wed Oct 21 15:40:07 2020\n```\n\n以下是命令中使用的每个选项的解释：\n\
  \n*   `-a 0` ：在此选项中，`-a` 是攻击模式；零表示它是字典攻击。\n*   `-m 0` ：在此选项中，`-m` 是哈希类型；0 代表 MD5\
  \ 算法。\n*   `-o` ：这是输出文件名（破解后的结果将保存在此文件中）。\n\n此外，注意我们已将哈希保存在文件 `hashes.txt` 中。\n\n\
  ```\n42F749ADE7F9E195BF475F37A44CB\n```\n\n搞定！这就是保存存在 `CrackedResults.txt` 文件中的明文哈希内容：\n\
  \n```\n42f749ade7f9e195bf475f37a44cb:Password123\n```\n\n### 攻击模式\n\n使用 Hashcat\
  \ 有多种破解方法。你可能熟悉暴力破解或字典攻击。在本节中，你将惊讶于有这么多破解方法：\n\n*   攻击模式 01 (-a 0)：直译/字典攻击\n*  \
  \ 攻击模式 02 (-a 1)：组合攻击\n*   攻击模式 03 (-a 3)：掩码/暴力破解\n*   攻击模式 04 (-a 6)：混合字典+掩码\n\
  *   攻击模式 05 (-a 7)：混合掩码+字典\n\n#### 直译模式 (Straight Mode)\n\n在这种攻击模式下，你可以使用字典文件完成任务。这被称为直译模式，但你经常也会听到它被称为字典攻击（它们同指）。要使用直译攻击，你需要通过添加\
  \ `-a 0` 来 Hashcat。在上例中，我们使用它破解了 MD5 哈希：\n\n```\nhashcat -a 0 -m [哈希类型] -o [输出文件]\
  \ [字典文件路径]\n```\n\n##### 创建大型字典文件\n\n起初，你可能从 `rockyou.txt` 字典文件开始。对于更高级的攻击，建议使用至少\
  \ 15 GB 的字典文件。如何获取大型字典文件？你需要从互联网下载尽可能多的字典文件，然后合并这些文件（假设文件都是文本格式）。首先，将所有文件下载到同一个目录（`/root/dics`）。接下来确保你在\
  \ `dics` 目录并将所有文件合并为一个：\n\n```\nroot@kali:~/dics# cat > merged.txt\n```\n\n`merged.txt`\
  \ 文件可能包含重复项。下一步是使用 `sort` 和 `uniq` 命令对内容进行去重：\n\n```\nroot@kali:~/dics# sort merged.txt\
  \ | uniq > large_dic.txt\n```\n\n越大越好：`large_dic.txt` 将是你字典攻击场景中的助手。你将在本看到如何使用它。\n\
  \n##### 字典规则\n\n在字典攻击中，你可以添加规则使其更强大。规则存储在 Hashcat 主目录下的一个文件夹中。总之，规则根据你用于破解任务的字典文件添加更多组合。大问题是：你选择哪些规则？规则非常多，即使对于经验丰富的渗透测试人员来说，选择也令人眼不已。规则文件越大，所需的时间越长，但能破解的哈希也越多。你可能会说：“我会选择更大的规则文件就能破解任何哈希。”事实并非如此。你之后将看到如何更高效地破解哈希，目前请注意以下标准规则（从小到大）：\n\
  \n*   Best64 规则\n*   rockyou-30000 规则\n*   Generated 2 规则\n*   Dive 规则\n\n这是一个使用直译模式攻击和\
  \ Best64 规则选项破解 NTLM 哈希的示例：\n\n```\nroot@kali:~# hashcat -a 0 -m 1000 -o /root/cracked_hashes.txt\
  \ /root/NTLM_hashes.txt /usr/share/wordlists/rockyou.txt -r /usr/share/hashcat/rules/best64.rule\n\
  ```\n\n#### 组合攻击 (Combinator)\n\n顾其名，组合攻击根据多个字典文件创建组合。在组合攻击中，你需要指定两个字典文件。这是一个示例：\n\
  \n```\nroot@kali:~# hashcat -a 0 -m 1000 -o /root/cracked_hashes.txt /root/NTLM_hashes.txt\
  \ /usr/share/wordlists/rockyou.txt /root/mydictionary.txt\n```\n\n在前面的示例中，我们了两个字典文件：`rockyou.txt`\
  \ 和 `mydictionary.txt`。你可能在想组合攻击是如何连接这些文件的。我们将使用两个简单的字典文件向你展示这个过程：\n\n**Dictionary1.txt**\n\
  \n```\nElliot\nPassword\nTest\n```\n\n**Dictionary2.txt**\n\n```\n1234\n7777\n```\n\
  \n以下是组合结果：\n\n```\nElliot1234\nElliot777\nPassword1234\nPassword777\nTest1234\n\
  Test777\n```\n\n##### 组合规则\n\n在组合攻击中，你可以在组合过程中添加规则。每条规则将应用于第一个字典文件（左字典）或第二个字典文件（右字典）。要使用左右规则，你必须使用以下选项：\n\
  \n*   `-j` 或 `--rule-left`：应用于左字典中每个单词末尾的规则\n*   `-k` 或 `--rule-right`：应用于右字典中每个单词末尾的规则\n\
  \n此外，注意你需要为每个想要添加的字符包含一个 `$`。例如，`-j '$-'` 将向来自第一个字典文件的单词中添加连字符字符。\n\n根据之前的两个字典文件，命令看起来如下：\n\
  \n```\nroot@kali:~# hashcat -a 0 -m 1000 -o /root/cracked_hashes.txt /root/NTLM_hashes.txt\
  \ /root/Dictionary1.txt /root/Dictionary2.txt -j '$-' -k '$!'\n```\n\n该命令的输出将如下：\n\
  \n```\nElliot-1234!\nElliot-777!\nPassword-1234!\nPassword-777!\nTest-1234!\nTest-777!\n\
  ```\n\n\n\n\n\n# 掩码攻击与暴力破解\n\n本节将涵盖 Hashcat 中规模最大的攻击模式。我们将深入探讨每个场景，但请务必仔细阅读本节，以便你轻松理解这些概念。\n\
  \n掩码攻击（Mask attack）是一种智能暴力破解。这意味着什么？在暴力破解中，你使用所有字符（小写字母、大写字母、数字和特殊字符）。而在掩码攻击中，你有权选择想要使用的字符类型：\n\
  \n*   小写字母\n*   大写字母\n*   数字\n*   特殊字符\n*   所有字符\n\n## 密钥空间 (Keyspace)\n\n密钥空间和字符集（charsets）是掩码攻击的两个关键关键词。密钥空间是掩码或暴力破解组合的总数。\n\
  \n以下是暴力破解中密钥空间的公式：\n\n*   `Keyspace = 字符集数量 ^ 长度`\n\n让我们来看一个实际示例来理解如何计算密钥空间。如果我们想破解“password1234”（长度为\
  \ 12），我们有两种选择：\n\n*   我们可以尝试使用字母和数字进行暴力破解破解它（如果包含特殊字符，这个数字会更大）。\n    *   `Keyspace\
  \ = 62 (小写+大写+数字的数量) ^ 12 (password1234 的长度)= 3,226,266,762,397,899,821,056`\n*\
  \   我们可以使用掩码攻击仅针对小写字母和数字。\n    *   `Keyspace = 26*26*26*26*26*26*26*26*10*10*10*10\
  \ = (26⁸) * (10⁴)= 2,088,270,645,760,000`\n\n总结来说，暴力破解很容易使用，但在处理长密码时执行需要很久（你很快就会学会如何在\
  \ Hashcat 中它）。\n\n## 掩码 (Masks)\n\n当你想要破解哈希时，将从密码长度开始。对于你来说，哈希后面的密码是未知的（甚至长度未知）。因此，你每次执行\
  \ Hashcat 时都必须增加长度。假设你从目标长度为 8 的密码开始。也就是说，你有 8 个来自可打印 ASCII 表的字符（或占位符）可以作为目标。以下是你每次如何提升\
  \ Hashcat 执行效率的方法：\n\n1.  第一次：仅目标小写字母。\n2.  第二次：目标第一个字符为大写，其余为小写。\n3.  第三次：目标所有字符为全小写或全大写。\n\
  4.  第四次：在组合中添加数字。\n5.  第五次：目标所有字符（小写+大写+数字+特殊字符）。\n\n在掩码攻击中，每个未知字符（占位符）可以通过三种方式进行目标：\n\
  \n*   自定义字符集变量\n*   内置字符集变量\n*   静态字符集\n\n### 内置字符集变量 (Built-in Charset Variables)\n\
  \n使用内置字符集，你可以指定想要用什么来代表每个字母。如果你想开始攻击 8 个小写字母，请使用以下命令：\n\n```\n$hashcat -a 3 ?l?l?l?l?l?l?l?l\
  \ -m [Hash Type] -o [Output File Path] [Hashes File Path]\n```\n\n`?l` 将注入一个小写字母，因此密钥空间如下：`aaaaaaaa\
  \ – zzzzzzzz`。\n\n等一下，之前的掩码攻击仅针对 8 位的密码。那么 7,6,5,4,3,2,1 系列呢？答案简单来说，添加 `--increment`\
  \ 选项就能为你完成工作。\n\n```\n$hashcat -a 3 ?l?l?l?l?l?l?l?l -m [Hash Type] --increment\
  \ -o [Output File Path] [Hashes File Path]\n```\n\n以下是 Hashcat 用于掩码攻击破解密码的内置字符集列表：\n\
  \n*   `?l = abcdefghijklmnopqrstuvwxyz`\n*   `?u = ABCDEFGHIJKLMNOPQRSTUVWXYZ`\n\
  *   `?d = 0123456789`\n*   `?s =#$'()*,‐./:;<=>?@[\\]^_!`{|}+«space»\"~%&`\n*  \
  \ `?a = ?l?u?d?s`\n*   `?h = 0123456789abcdef`\n*   `?H = 0123456789ABCDEF`\n* \
  \  `?b = 0x00 ‐ 0xff`\n\n### 静态字符集 (Static Charsets)\n\n你可以使用静态字母代替字符组合。例如，你知道使用\
  \ NTLM 哈希的人是 Gideon，所以作为第一轮，你可以包含一些使用 Gideon 单词的组合。在下面的示例中，将在 Gideon 后面附加四个数字：\n\
  \n```\n$hashcat -a 3 Gideon?d?d?d?d -m 1000 -o [Output File Path] [Hashes File Path]\n\
  ```\n\n如果之前的组合无效，我们可以通过在末添加特殊字符 `?s` 来增加复杂性：\n\n```\n$hashcat -a 3 Gideon?d?d?d?d?s\
  \ -m 1000 -o [Output File Path] [Hashes File Path]\n```\n\n### 自定义字符集 (Custom Charsets)\n\
  \n在自定义字符集中，你可以将一组自定义字符注入到攻击中。在我们开始示例之前，请注意你需要先使用以下选项定义你的自定义字符集：\n\n*   `-1` 或 `--custom-charset1`\n\
  *   `-2` 或 `--custom-charset2`\n*   `-3` 或 `--custom-charset3`\n*   `-4` 或 `--custom-charset4`\n\
  \n现在我们来看一个 8 位字符串后面跟 4 个数字的示例。在这种情况下，我们希望 Hashcat 在第一个字符中注入小写和大写字母，其余七个是小写字母，最后附加四个数字：\n\
  \n```\n$hashcat -a 3 -1 ?l?u ?1?l?l?l?l?l?l?l?d?d?d?d -m [Hash Type] -o [Output\
  \ File Path] [Hashes File Path]\n```\n\n让我们看看这个公式在做什么：\n\n*   首先，我们使用了 `-1 ?l?u;`。在这里，我们定义了自定义字符集。我们需要做的只是将其注入组合。\n\
  \n### 字符集文件 (Hashset Files)\n\n与其猜测使用哪些字符集，Hashcat 已经为你完成了工作。这些文件位于 masks 文件夹。这里是针对\
  \ NTLM 的一个示例：\n\n`-o [Output File Path] [Hashes File Path] /usr/share/hashcat/masks/rockyou-1800`\n\
  \n### 暴力破解攻击 (Brute‐Force Attack)\n\n如果密码很短（最多九个字符），你可以使用基于掩码的暴力破解技术。在下面的示例中，我们将攻击长度为八位的密码：\n\
  \n```\n$hashcat -a 3 ?a?a?a?a?a?a?a -m [Hash Type]\n```\n\n### 混合攻击 (Hybrid Attacks)\n\
  \n混合攻击类似于组合攻击，但不是组合两个字典，而是组合字典文件和字符集。在混合攻击中，你有两个选择：\n\n*   字典 + 掩码：`-a 6`\n*   掩码\
  \ + 字典：`-a 7`\n\n假设要在字典文件末尾附加特殊字符集；那么将使用以下命令：\n\n```\n$hashcat -a 6 -m [Hash Type]\
  \ -o [Output File Path] [Hashes File Path] [Dictionary File Path] ?s\n```\n\n##\
  \ 破解工作流 (Cracking Workflow)\n\n此时，如果你面临破解挑战，可能会对选择哪种攻击以及从何开始感到困惑和无所措。你应该使用字典文件、暴力破解还是掩码攻击？简单的答案是全部使用，但你需要知道从哪种开始。\n\
  \n你需要从小开始，并增加更耗时的攻击（以下步骤仅作为如何提高复杂性的示例；选择适合自己的工作流取决于你）：\n\n*   如果你可以对目标（个人或公司）进行画像并生成字典文件：\n\
  \    *   针对个人：使用 `cupp.py`（先下载它）。\n    *   针对公司：使用他们的网站并执行以下命令完成任务：\n\n        ```\n\
  \        $cewl [http://website] -w [out_file.txt]\n        ```\n    *   最后，使用 Hashcat\
  \ 字典攻击（使用你刚刚生成的字典）+ Best 64 规则。\n\n*   使用 `rockyou.txt` 进行字典攻击 + Best 64 规则。\n\n\
  \n\n\n\n- 对前八个字符进行暴力破解（如果没有足够的 GPU 算力，则最多使用七个字符）。\n- 使用 `big_dic.txt`（你之前创建的）+ `Best64`\
  \ 规则进行字典攻击。\n- 使用掩码文件 `rockyou‐1‐60.hcmask`。\n- 使用混合攻击：掩码 (`-1 ?s?d ?1?1?1?1`) +\
  \ 字典列表。\n- 使用混合攻击：字典列表 + 掩码 (`-1 ?s?d ?1?1?1?1`）。\n- 使用 `big_dic.txt` + `Generated2`\
  \ 规则进行字典攻击。\n- 组合攻击：`rockyou.txt` + `rockyou.txt`。\n- 使用掩码文件：`rockyouSs7‐2592000.hcmask`。\n\
  \n从这里开始就取决于你的想象力，但要知道何时停止！如果破解不了，不要介意于自己。\n\n### 总结\n\n这一章有很多信息需要掌握，但我希望你学到了对你的职业生涯（或破解爱好）有帮助的新知识。如果你对这一章的某个部分有疑问，请回去重读——并练习、练习、再练习！\n\
  \n## 第 14 章：报告\n\n最近，我收到了一份由第三方公司编写的渗透测试报告。这家公司聘请了一些顾问对生产环境中新部署的一个 Web 应用进行渗透测试。该报告仅仅是从另一个安全扫描工具（例如\
  \ `Burp Suite`、`Nessus` 等）报告中复制过去的，里面充满了错误的严重性评估。我告诉你这个故事是因为，如果你是世界上顶尖的渗透测试员却不知道如何编写报告，那么你所有的努力都是徒劳。报告是你的声誉，它展示了你的专业水平。\n\
  \n在本章中，你将主要学习如何进行以下操作：\n- 向客户/雇主展示报告\n- 对你的发现进行严重性评分\n\n## 渗透测试报告概述\n\n报告不仅仅关乎外观和感觉。有些人认为一份优秀的报告应该充满文字。一份良好的报告应符合以下标准：\n\
  - 准确的漏洞严重性评分（不夸大漏洞的严重性）\n- 无误报\n- 包含证据（例如 `screenshots` 或 `PoC`），而不仅仅是链接或定义\n- 如何修复漏洞的说明。这是安全专业人员大放异彩的地方。清晰定义修复方法是你报告的转折点。（我见过很多报告的修复部分只是指向\
  \ `OWASP` 的链接、`CVE` 引用等。）\n- 表述清晰且不啰嗦\n- 必须分为两份报告：\n    - 包含所有证据和细节的技术报告\n    -\
  \ 一份针对管理层的摘要报告（执行摘要），显示安全测试的真实漏洞和结果\n- 格式良好且简洁，让读者读起来很享受。通常，公司有自己的报告模板。你可以根据你的测试风格自由地跳出舒适区并进行修改。\n\
  \n## 严重性评分\n\n让我们从一个例子开始。假设在渗透测试期间，你使用 `Burp Suite` 发现了一个 `SQL injection`。默认情况下，`SQL\
  \ injection` 的严重性为“高（High）”，你对发现这个漏洞非常兴奋。因此，你将其上报给高层；你想展示你是专业人士。但深入挖掘（超出严重性级别之后），被测试的应用并不包含敏感信息，且只能从内网访问（互联网不可见）。总而言之，多个因素改变了局面，对吧？让我们一起看看如何使用\
  \ `CVSS` 评分系统来这类问题。\n\n### 通用漏洞评分系统版本 3.1\n\n我使用通用漏洞评分系统 (`CVSS`) 有段时间了，当前版本是 `3.1`。请注意，这个公式在不断进化，因此请始终在其网站\
  \ `www.first.org/cvss/` 查看更新。\n\n那么，`CVSS` 是什么？它是一个考虑多个因素并计算分数（例如 `低`、`中`、`高`或`严重`）的系统，以便以更准确的方式评估你的发现。\n\
  \n`CVSS` 版本 `3.1` 使用以下因素计算渗透测试期间发现的漏洞/缺陷的评分：\n\n- **攻击向量 (AV)**：此分数评估了攻击者如何利用漏洞，例如远程还是本地。\n\
  \    - **网络 (N)**：当漏洞可以从互联网访问时，选择此选项。\n    - **相邻 (A)**：当利用程序可以在同一内网网络中成功执行（无法从互联网访问）时，选择此选项。\n\
  \    - **本地 (L)**：当排除网络栈选择时选择此选项，例如打开一个文档（通过社会工程学）、`keylogger` 等。\n    - **物理 (P)**：当在主机上物理地执行利用时选择此选项（例如，攻击者必须进入机房）。\n\
  \n- **攻击复杂度 (AC)**：此分数评估了利用漏洞的困难程度。\n    - **高 (H)**：当利用程序难以执行时，选择此选项。\n    - **低\
  \ (L)**：当易于利用漏洞时，选择此选项。\n- **所需权限 (PR)**：此分数将阐说明利用漏洞所需的权限级别。\n    - **无 (N)**：攻击者不需要任何凭据。\n\
  \    - **低 (L)**：攻击者需要一个受限的账户。\n    - **高 (H)**：攻击者需要一个高权限账户。\n- **用户交互 (UI)**：此分数评估了是否需要用户（受害者）与漏洞进行交互（例如通过社会工程学）。\n\
  \    - **无 (N)**：可以在没有受害者交互的情况下利用漏洞。\n    - **需要 (R)**：该漏洞涉及某种受害者交互。\n- **范围 (S)**：此指标将评估漏洞是否会影响具有不同安全范围的另一个系统。\n\
  \    - **未改变 (U)**：当受影响的资源处于相同安全范围内，选择此选项。\n    - **已改变 (C)**：当其他安全范围资产受到此漏洞影响时，选择此选项。\n\
  - **机密性 (C)**：此指标将评估攻击者是否能够读取敏感数据。\n    - **高 (H)**：如果攻击者可以读取组织本地的所有敏感数据，请使用此项。\n\
  \    - 低 (L)：如果攻击者可以读取组织本地的部分敏感数据，请使用此项。\n    - **无 (N)**：如果利用漏洞时，攻击者无法读取任何敏感数据，请使用此项。\n\
  - **完整性 (I)**：此指标将评估攻击者是否能够向被利用系统写入数据（例如添加或更改数据库中的记录）。\n    - **高 (H)**：当攻击者利用漏洞时，如果他们拥有完全写入权限，选择此选项。\n\
  \    - **低 (L)**：当攻击者利用漏洞时，如果他们拥有有限的写入权限，选择此选项。\n    - **无 (N)**：当利用漏洞时，如果攻击者没有写入权限，选择此选项。\n\
  - **可用性 (A)**：此指标评估了利用是否会影响被利用资产的可用性（服务器、路由器、笔记本电脑、Wi-Fi AP 等）。\n    - **高 (H)**：如果利用将极大影响被利用资产的可用性，选择此选项。\n\
  \    - **低 (L)**：如果利用会对被利用资产的可用性产生影响，选择此选项。\n    - **无 (N)**：如果利用对被利用资产的可用性没有影响，选择此选项。\n\
  \n\n\n\n\n好消息，各位，CVSS 的创建者创建了一个在线计算器，方便我们检查发现结果的评分。你可以在 [www.first.org/cvss/calculator/3.1](http://www.first.org/cvss/calculator/3.1)\
  \ 找到它。\n\n根据之前的 SQL 注入示例（当你发现它时很高兴），如果你访问 CVSS 计算器，你的评分应该像图 14.1 所示。\n\n![CVSS 计算器截图。](img/c14f001.png)\n\
  \n图 14.1 CVSS 计算器\n\n另一个例子基于我之前的经验。有一次，我发现了 Linux 服务器的 SSH 凭据（用户名：admin；密码：admin），但该主机位于测试环境中，仅用于测试目的（参见图\
  \ 14.2）。\n\n![CVSS 结果截图。](img/c14f002.png)\n\n图 14.2 CVSS 结果\n\n你是否在问自己这个计算器如何评估严重、高、中、低优先级的评分？表\
  \ 14.1 显示了 CVSS 3.1 评分的计算方法。\n\n| 等级 | CVSS 3.1 评分 |\n| --- | --- |\n| 无 | 0 |\n\
  | 低 | 0.1–3.9 |\n| 中 | 4.0–6.9 |\n| 高 | 7.0–8.9 |\n| 严重 | 9.0–10.0 |\n\n表 14.1 CVSS\
  \ 评分分级\n\n## 报告演示\n\n让我们看看如何根据示例创建一个专业的报告，以便你也可以这样做。通常情况下，有四项输入被提供到我们的报告中（我使用工具生成的报告来创建和提取——而不是盲目提取——我最终报告的信息）：\n\
  \n*   通过扫描器（例如 OpenVAS, Nessus, Qualys 等）或手动发现的基础设施漏洞\n*   通过扫描器（例如 Burp Suite）或手动发现的\
  \ Web 应用程序漏洞\n*   通过静态应用安全测试 (SAST) 工具（例如 Checkmarx, Veracode 等）或使用手动代码审查发现的源代码漏洞\n\
  *   通过库扫描器（例如 Nexus Sonatype lifecycle）发现的开源库漏洞\n\n这里有一个你可以用于自己那里创建报告的报告结构。通常，每家公司都有自己的\
  \ Logo 和用于视觉效果和感觉的模板。\n\n### 封面\n\n在此页面上，你应该显示报告的标题（例如“渗透测试报告”或“网络安全报告”）。确保包含以下项目：\n\
  \n*   公司名称\n*   所测试的项目名称\n*   负责人姓名（渗透测试员；如果你被第三方雇佣，有时必须包含你所在公司的名称）\n*   报告标题\n\n\
  ### 历史日志\n\n有时会有多个人共同编写同一份报告。此外，内容可能会发生变化，因此历史日志将有助于跟踪已完成的工作。\n\n历史日志应包含以下项目：\n\n\
  *   版本号\n*   更改日期\n*   修改者姓名\n*   关于更改内容的简要描述\n\n### 报告摘要\n\n该部分是第一部分，将总结在任务期间发现的漏洞内容。首先，花时间解释为了完成工作而执行的所有任务。然后，解释你用于评估每个漏洞严重程度的评分。对于视觉效果，专业的报告摘要将包含以下项目：\n\
  \n*   根据严重程度划分的漏洞数量（有直图表会更好）\n*   漏洞类别的数量和发生次数（例如：五次反射型 XSS 漏洞，两次 SQL 注入等）\n\n###\
  \ 漏洞章节\n\n在这里，你将包含在任务期间发现的每个漏洞的详细信息。你可以从最严重的漏洞开始，然后包含高危、中危的，最后是低危的。对于每个漏洞，你应该包含以下内容：\n\
  \n*   漏洞的描述（扫描器生成的报告将帮助你编写此部分）\n*   基于 CVSS 的严重性评分\n*   受此漏洞影响的主机 IP 地址或 URL\n*\
  \   如何利用该漏洞的截图或文本片段（证明）\n*   最后，如何修复它（修复措施）\n\n### 总结\n\n到本章为止，你已经看到了作为渗透测试员必须执行的大部分活动。在本章中，你学习了如何作为一个专业人士向你的客户或雇主展示你的工作（记住，你展示的报告就是你的专业形象）。你已经看到如何评估发现的评分，并学习了专业安全报告的核心部分。在本书的其余章节中，你将学习更高级的主题，将你的渗透测试技能提升到新水平。\n\
  \n## 第 15 章：汇编语言与逆向工程\n\n本章将向你介绍使用汇编语言进行逆向工程的概念。这是一个复杂的课题，但理想情况下，当你阅读这里时，它看起来并不会复杂。\n\
  \n在本章中，你将学习以下内容：\n\n*   汇编语言基础\n*   CPU 寄存器\n*   数据类型\n*   内存段\n*   逆向工程\n\n## CPU\
  \ 寄存器\n\n你可能很兴奋学习汇编语言。这不是像 Java、Python 或 .NET 那样的标准语言。你需要理解的第一部分是 CPU 寄存器。这些寄存器用于临时存储数据。\n\
  \n### 通用 CPU 寄存器\n\n图 15.1 向你展示了由 `AX`、`BX`、`CX` 和 `DX` 组成的通用寄存器。\n\n![CVSS 计算器截图。](img/c14f001.png)\n\
  \n图 15.1\n\n第一个 `AX` 是累加器寄存器，用于加、减、除、乘计算。对于 64 位版本，我们使用 `RAX`，对于 32 位版本使用 `EAX`。在底部，你可以看到高低\
  \ 8 位段 `AH` 和 `AL`。\n\n第二个是基址寄存器 `BX`，你可以将其用于多种用途。\n\n接下来是计数寄存器 `CX`；正如名称所示，该寄存器用于循环和迭代。\n\
  \n`DX` 是数据寄存器。有些文档称其*双精度*，但*数据寄存器*可能是更好的名字。这个寄存器是 `EAX` 的兄弟，它们协同进行数学运算。\n\n别担心；你不需要记住每个寄存器的功能，最重要的是知道通用寄存器（正如名称所示）用于通用数据处理。注意，在本章中，我们将主要针对\
  \ 32 位寄存器。以后当我们开始练习时，你将看到调试器如何显示 `EAX`、`EBX`、`ECX` 和 `EDX`。\n\n### 索引寄存器\n\n另一种类型的寄存器是索引寄存器（参见图\
  \ 15.2）：源索引 `SI` 和目的索引 `DI`。这些寄存器主要用于字符串操作，其中 `ESI` 指向源`EDI` 指向目的。\n\n![CVSS 结果截图。](img/c14f002.png)\n\
  \n图 15.2\n\n### 指针寄存器\n\n指针寄存器是用于缓冲区溢出的很好的寄存器（你将在下一章学习更多关于此主题的内容）。\n\n\n\n\n\n图\
  \ 15.3 顶部的两个是基址指针（base pointer）和栈指针（stack pointer）。这两个寄存器用于栈操作。`base pointer` 指向栈的底部，而\
  \ `stack pointer` 指向栈的顶部。\n\n底部的第三个指针是指令指针（instruction pointer），它指向 CPU 需要执行的下一条指令的地址（记住这个；我们将在第\
  \ 16 章“缓冲区/栈溢出”中再次回到它）。\n\n## 段寄存器\n\n下一种类型的寄存器是段寄存器（参见图 15.4）：代码段、数据段、栈段和额外段。你很少在漏洞利用中用到它们，但由于本节是关于汇编语言基础的，你需要理解它们为什么存在。\n\
  \n![指针寄存器的快照。](img/c15f003.png)\n\n图 15.3 指针寄存器\n\n![段寄存器的快照。](img/c15f004.png)\n\
  \n图 15.4 段寄存器\n\n总结来说，这些寄存器用于指定内存中的段。换句话说，段寄存器存储段的起始地址。这是因为为了获取段内数据或指令的精确位置，需要一个偏移值（offset\
  \ value）。CPU 将段寄存器中的段地址与位置的偏移值相结合，以引用段中的任何内存位置。\n\n## 标志寄存器\n\n标志寄存器（参见表 15.1）也称为`控制寄存器`，因为跳转操作将根据存储在这些寄存器中的值执行。例如，如果零标志（zero\
  \ flags）设置为 1，则将执行 `JE`（相等跳转）指令；否则，如果零标志为 0，则不执行。你很快就会看到 `JMP` 指令，但理解这些标志的作用是非常重要的。\n\
  \n| 标志名称 | 缩写 |set |\n\n| --- | --- | --- |\n\n| 进位 | C | 上一次算术指令产生了进位/借位。 |\n|\
  \ 奇偶性 | P | 为偶数时，值为 0；为奇数时，值为 1。 |\n| 辅助 | A | 算术操作结果；从第 3 位到第 4 位的进位。当发生这种情况时，值设置为\
  \ 1。 |\n| 零 | Z | 当结果等于零时，值设置为 1。 |\n| 符号 | S | 如果符号为正，则值为 0；如果符号为负，则值设置为 1。 |\n\
  | 陷阱 | T | 单步模式。 |\n| 方向 | D | 字符串从左到右；则值设置为 0。字符串从右到左；则值设置为 1。 |\n| 溢出 | O | 最高位的溢出。\
  \ |\n\n表 15.1 标志寄存器\n\n第一个是 `Carry`（进位）标志，它存储上一次移位操作的最后一位的内容。接下来，如果我们比较的是偶数，则 `Parity`（奇偶性）标志设置为\
  \ 0；如果是奇数，则设置为 1。当 1 字节算术操作导致从第 3 位到第 4 位的进位时，`Auxiliary`（辅助）进位标志被设置。当比较结果等于零时，`Zero`（零）标志设置为\
  \ 1。之后，`Sign`（符号）标志在结果为正时设置为 1，结果为负时反之亦然。`Trap`（陷阱）标志是单步操作设置，因此我们可以一次一条指令地单步通过调试器。接下来，`Direction`（方向）标志在字符串操作从左到右时设置为\
  \ 0，如果操作从右到左，则设置为 1。最后，`Overflow`（溢出）标志表示算术操作后最左侧位的溢出。\n\n现在我们完成了寄存器的部分；让我们进入汇编指令。\n\
  \n## 汇编指令\n\n在汇编语言中，汇编指令看起来如下：\n\n```\n[地址][操作码][指令/助记符][操作数]\n```\n\n因此，一条汇编指令由左侧内存中的地址组成，随后是其操作码值。然后是待执行的指令（如\
  \ `MOV` 或 `JMP`）或你在表 15.2 中看到的任何项目。最后我们是操作数。有时你有两个操作数，如表 15.2 中第一个 `MOV` 操作所示。或者有一个操作数，如你在表\
  \ 15.2 中看到的 `push` 操作所示。让我们来看看汇编中最重要的指令（很快你将看到一个关于汇编指令的实际示例，目前请关注其原理）。\n\n| 语法 |\
  \ 示例 |\n\n| --- | --- |\n\n| `MOV <目标>,<源>` | `MOV EAX,ESP` |\n| `Add <目标 >,<源>`\
  \ | `ADD ESP,0C` |\n| `Sub <目标 >,<源>` | `SUB EAX,0A` |\n| `INC <值>` | `INC EAX`\
  \ |\n| `Dec <值>` | `DEC EAX` |\n| `Push <值>` | `PUSH EBP` |\n| `POP <值>` | `POP\
  \ EBX` |\n| `LEA <目标 >,<源>` | `LEA ESP,DWORD PTR SS:[EBP‐A]` |\n| `XOR <目标 >,<源>`\
  \ | `XOR EAX,EAX` |\n\n表 15.2 汇编指令（注：原文中此处无表内容，根据上下文应为 `[Address][opcode][instruction/mnemonic][operands]`\
  \ 对应关系）\n\n因此，一条汇编指令由左侧内存中的地址组成，随后是其操作码值。然后是待执行的指令（如 `MOV` 或 `JMP`）或你在表 15.2 中看到的任何项目。最后我们是操作数。有时你有两个操作数，如表\
