  \ States`）。\n\n![语言屏幕截图](img/bapp01f048.png)\n\n图 A.48 语言\n\n一旦你选择了地区，Kali 的镜像将复制到你的主机上（它还会探测你的网络），然后它会要求你为\
  \ Kali 输入一个 `hostname`（主机名）。默认情况下，`hostname` 是 `kali`，所以让我们保持原样（图 A.49）。随后你将被提示输入\
