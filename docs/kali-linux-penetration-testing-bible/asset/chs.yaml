  \ 15.6 中看到它。\n\n要进入 `HelloWorld` 应用程序的主函数，请继续向下滚动左上面板，直到看到图 15.7 所示的模式。\n\n让我们快速查看一下调试器环境（参考图\
  \ 15.6）。如你所见，Immunity 中有四个面板。\n\n![Immunity 暂停的截图。](img/c15f006.png)\n\n图 15.6 Immunity\
  \ 暂停\n\n![主函数指令的截图。](img/c15f007.png)\n\n图 15.7 主函数指令\n\n在左上面板中，我们拥有所有的 CPU 指令。高亮的指令是\
  \ `SUB ESP, 0C`（参见图 15.6）；它意味着从 `ESP` 中减去值 `0C`（这是一个十六进制）。在汇编指令的左侧，你首先看到该指令的内存地址，然后是操作码，最后是汇编代码。它包含了源操作数（在此情况下为\
  \ `OC`）以及目标操作数 `ESP`。你越练习这些指令，就越理解它们。\n\n这一节中需要注意的另外一点是操作码；我们稍后（在下一章）在注入 shellcode\
  \ 进行漏洞利用时会用到操作码。因此，shellcode 是一系列操作码。换句话说，shellcode 是我们想要注入的系列汇编指令，例如一个远程 shell\
  \ 等。\n\n等一下，我们还没结束；确保这些指令保存在内存中名为 `text` 的地方。让我们跟踪这条指令的地址，并在内存中实时查看它。右键点击该指令并选择\
  \ `Follow In Dump`（转到转储储）；然后选择一个项目，如图 15.8 所示。\n\n![Follow In Dump 的截图。](img/c15f008.png)\n\
  \n图 15.8 转到转储储\n\n现在检查左下部分（参见图 15.9）；地址被高亮，并显示了操作码 `83 EC 0C`。这一部分是内存转储；定期使用它检查内存地址的内容很有用。\n\
