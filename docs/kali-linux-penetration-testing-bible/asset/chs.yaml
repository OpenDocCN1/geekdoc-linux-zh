  \n* 我们可以使用匿名凭据登录。\n* FTP 服务器版本为 `2.3.4`。\n* 我们确认了通信是明文的。\n\n#### 进阶脚本扫描\n\n基础脚本扫描\
  \ `-sC`（技术上它被称为*默认脚本*）并不扫描所有内容。在这一步，我们将使用 `–script=ftp*` 选项包含 `Nmap` 中所有针对 FTP 的脚本扫描功能。\n\
