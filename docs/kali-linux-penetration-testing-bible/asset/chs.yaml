  \ 可以代替图像，并可以与较小的/半透明的图像结合。\n- `Change The Background` 根据你定义的时间间隔将图像更改为另一张。你也可以选择\
  \ `Random Order` 从列表中随机选择图像。\n\n![更改桌面背景的截图。](img/bapp01f014.png)\n\n图 A.14 更改桌面背景\n\
  \n### 菜单\n\n菜单标签页如图 A.15 所示，使你能够更改桌面菜单或窗口列表菜单。\n\n![菜单设置的快照。](img/bapp01f015.png)\n\
