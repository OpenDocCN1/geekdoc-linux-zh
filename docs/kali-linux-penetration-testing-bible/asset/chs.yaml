  \    *   **Task Manager**：显示当前运行的进程（任务）以及 CPU + 内存图\n    *   **Thunar File Manager**：文件管理器\n\
  \    *   **Vim**：文本编辑器\n    *   **Xarchiver**：归包管理器\n    *   **Xfburn**：CD/DVD 刻录工具\n\
