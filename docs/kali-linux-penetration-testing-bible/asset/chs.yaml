  \n\n\n\n第一个是 `RET`，它是返回指令，在汇编语言中表示函数的结束。接下来，中断指令（interrupt instruction）向处理器发送一个系统中断以进行执行。如果你想开发汇编程序，你将经常使用这条指令。例如，`interrupt\
  \ 80` 向内核发送一个系统调用。现在到了我最喜欢的部分了，像过山车一样的 `NOP` 操作；当我们注入 shellcode 时，将使用这条特殊的指令，因为我们想要确保代码能够通过神奇的\
  \ `NOP` 变滑指令（在下一章中介绍）来执行。最后，`call` 指令通过在操作数部分指定函数名称来调用函数。\n\n### 小端序 (Little Endian)\n\
  \n小端序是一个我们在缓冲区溢出（下一章）中会看到的概念。目前，重要的是理解 Intel CPU 架构是以反向顺序存储内容的。\n\n例如，看这条指令：\n\n\
  ```\nMOV EAX, 2A3B4C5D\n```\n\n在执行上一条指令后，`EAX` 的值将变为 `5D4C3B2A`（这是原始值的反转）。\n\n###\
  \ 数据类型 (Data Types)\n\n汇编中的数据类型是怎样的？[表 15.5] 显示了你需要注意的常见类型。\n\n| TYPE | ASM | #\
  \ BITS |\n| --- | --- | --- |\n| Byte | Byte | 8 bits |\n| Word | Word | 16 bits\
  \ |\n| Double word | Dword | 32 bits |\n| Quad word | Qword | 64 bits |\n\n[表 15.5]\
  \ 数据类型\n\n记住，字节（byte）是 8 位，字（word）是 16 位，双字（double word）是 32 位，四字（quad word）是 64\
  \ 位。你需要熟悉这些数据类型，这样当你看到将一个 32 位地址 `DWORD` 移动到 `ESP` 时就不会迷路。当你进行漏洞利用时，它们最终会变成本能。\n\
  \n### 内存段 (Memory Segments)\n\n内容太多，对吧？别担心；如果你先掌握了汇编语言的基础，很快就能理解逆向工程。\n\n在[图 15.5]\
  \ 中，你可以看到内存分区域。文本区域（text area）是存储汇编指令的地方。数据区（data）和 BSS 区用于变量存储。堆（heap）是内存中的一个位置，可以在其中动态存储和操作数据。最后，著名的栈（stack）由编译器管理。\n\
  \n![Snapshot of the Memory segments.](img/c15f005.png)\n\n[图 15.5] 内存段\n\n### 寻址模式\
  \ (Addressing Modes)\n\n有不同的方法操作寄存器中的数据。[表 15.6] 总结了所有类型的寻址模式。\n\n根据[表 15.6]，我们首先顶部将一个寄存器移动到另一个寄存器。接下来，我们将数字移动到寄存器。在第三项中，我们将数字移动到内存地址。最后，我们将\
  \ `EBX` 寄存器中的值移动到存储在 `EAX` 寄存器中的内存地址中。\n\n| NAME | EXAMPLE |\n| --- | --- |\n| Register\
  \ | `MOV EAX,ECX` |\n| Immediate | `MOV EAX,0C` |\n| Direct | `MOV [AC1177FF],0C`\
  \ |\n| Register Indirect | `MOV [EAX],EBX` |\n\n[表 15.6] 寻址模式\n\n### 逆向工程示例\n\n\
  在本节中，我们将创建一个简单的 C 程序，可以在下一节中用它进行逆向工程。在这里，*逆向工程*意味着检查其汇编语言指令，以视觉化并理解底层处理在内部是如何工作的。\n\
  \n#### 用于 C/C++ 的 Visual Studio Code\n\n对于这个实践示例，我们使用 Windows 10 作为操作系统。（你应该习惯在你的\
  \ Windows 操作系统上进行缓冲区溢出和逆向工程练习。为什么？因为 90% 的受漏洞影响应用程序将基于 Windows 操作系统。）接下来，我们将通过以下\
