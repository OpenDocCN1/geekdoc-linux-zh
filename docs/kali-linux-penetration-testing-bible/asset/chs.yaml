  \n## 面板 (Panel)\n\n面板如图 A.29 所示，是你在桌面上看到的顶部条栏。在本节中，你将学习如何自定义它。在附录的后后部分中，你将学习如何向桌面环境添加你自己的面板。\n\
  \n![顶栏快照。](img/bapp01f029.png)\n\n图 A.29 顶栏\n\n### 显示 (Display)\n\n在图 A.30 所示的 `Display`\
  \ 选项卡中，你可以管理面板的显示设置。确保从顶部的下拉列表中选择你想要自定义的正确面板（在我们的示例中，我们使用的是面板 1）。\n\n![面板设置快照。](img/bapp01f030.png)\n\
  \n图 A.30 面板设置\n\n- **常规 (General)**：在此节中，你可以执行以下操作：\n    - 设置方向为水平、垂直或桌面栏 (Deskbar)\n\
  \    - 锁定面板以免意外拖动\n    - 按需隐藏或始终显示\n    - 在边界留留空间\n- **测量 (Measurements)**：在此节中，你可以调整面板的大小。请记住，面板的高度（垂直面板）或宽度（水平面板）等于\
  \ `Rows` 数量乘以 `Row Size`。\n\n### 外观 (Appearance)\n\n在图 A.31 所示的 `Appearance` 选项卡中，你能够更改\
  \ Kali 桌面面板的外观。你可以执行以下操作：\n\n- 设置背景样式\n- 自动调整图标\n- 更改其透明度\n\n![面板外观设置快照。](img/bapp01f031.png)\n\
  \n图 A.31 面板外观设置\n\n### 项目 (Items)\n\n在图 A.32 所示的 `Items` 选项卡下，你有选项管理面板内部的项。你可以添加、删除或更改属于你面板的图标/项目的位置。\n\
  \n#### 工作区 (Workspaces)\n\n如图 A.33 所示的 `Workspaces` 窗口为你提供了执行以下操作的选项：\n\n- 更改工作区的数量\n\
  - 重命名工作区\n- 设置工作区的边距\n\n![面板项目位置快照。](img/bapp01f032.png)\n\n图 A.32 面板项目位置\n\n![工作区快照。](img/bapp01f033.png)\n\
  \n图 A.33 工作区\n\n#### 窗口管理器 (Window Manager)\n\n在图 A.34 所示的 `Window Manager` 窗口中，你可以设置窗口外观、键盘快捷键等更多内容。\n\
  \n![窗口管理器快照。](img/bapp01f034.png)\n\n图 A.34 窗口管理器\n\n##### 样式 (Style)\n\n在 `Style`\
  \ 选项卡中，你可以配置 Kali Linux 中打开的窗口的外观。以下是可以在此选项卡中执行的任务列表：\n\n- 更改右侧列表中的主题\n- 更改标题字体和对齐方式\n\
  - 更改按钮布局\n\n##### 键盘 (Keyboard)\n\n在图 A.35 所示的 `Keyboard` 选项卡中，你可以更改处理窗口的键盘快捷键（例如最小化、最大化等）。\n\
  \n##### 焦点 (Focus)\n\n如图 A.36 所示的 `Focus` 选项卡比较难理解。简单来说，焦点窗口将接收来自鼠标或键盘的输入。\n\n-\
  \ 选择 `Click To Focus`（点击聚焦）时，当你点击框架的任何位置时，窗口将获得焦点。\n- 选择 `Focus Follows Mouse`（焦点跟随鼠标）时，当将鼠标悬停在其框架上时，窗口将获得焦点。\n\
  - 自动给新打开的窗口焦点\n- 将焦点窗口堆叠在所有已打开窗口之上的能力\n- 设置 `Raise On Click`（点击置顶）以便在点击框架时将你的窗口置于其他窗口之上。\n\
  \n![窗口键盘快捷键快照。](img/bapp01f035.png)\n\n图 A.35 窗口键盘快捷键\n\n![窗口焦点设置快照。](img/bapp01f036.png)\n\
  \n图 A.36 窗口焦点设置\n\n### 桌面自定义的实用示例\n\n所有设置初看之下都让人眼花，但接下来的练习将允许你练习这些设置，并将你的 Kali Xfce\
  \ 桌面提升到一个层次。这个练习的主意是让你对在这个卓越的环境中可以做什么有一个初步了解。以下是你将要执行的任务：\n\n- 编辑顶部面板\n- 添加一个带有我们喜爱应用程序的第二个面板\n\
  - 更改桌面外观\n\n#### 编辑顶部面板\n\n在开始编辑面板之前，请注意你应用的更改是可选的。你可以决定你的 Kali 环境外观的正确选择是什么。\n\n\
  ##### 删除图标\n\n首先，移除顶栏上所有的应用程序图标，这样你就可以底部创建一个专门用于应用程序的面板（类似于 Mac iOS）。\n\n打开设置（Settings），然后转到\
  \ `Panel`（面板）➪ `Items`（项目），如前文图 A.32 所示。\n\n通过选择项目并点击选项卡窗口右侧的减号图标从列表中移除某些项。不要点击右上角的减号按钮；那个按钮将删除整个面板。\n\
  \n- 移除“显示桌面”（Show Desktop）。\n- 移除“目录菜单”（Directory Menu）。\n- 移除目录菜单项下两个“启动器”（Launcher）项。\n\
  - 移除四个“分隔符”（Separator）项中的两个（位于 Whisker Menu 项下方）。\n\n图 A.37 显示了结果。\n\n图 A.38 显示了实施这些更改后顶部面板的样子。\n\
  \n#### 添加新的底部面板\n\n接下来你将创建一个专门用于应用程序快捷方式的面板。你可以选择任何你想要的应用程序，但对于这个练习，你为以下内容添加快捷方式：\n\
  \n- 文件管理器 (File Manager)\n- Nmap\n- Burp\n- 终端窗口 (Terminal window)\n- Metasploit\n\
  - 文本编辑器 (Text Editor)\n- 网页浏览器 (Web Browser)\n- Wireshark\n- Searchsploit\n\n![面板设置快照。](img/bapp01f037.png)\n\
  \n图 A.37 面板设置\n\n![顶面板快照。](img/bapp01f038.png)\n\n图 A.38 顶面板更改\n\n##### 添加面板\n\n\
  要创建一个新面板，打开 `Settings`（设置）➪ `Panel`（面板）并点击所选面板附近的加号图标，在本例中是面板 1（图 A.39）。\n\n![添加面板快照。](img/bapp01f039.png)\n\
  \n图 A.39 添加面板\n\n一旦你点击加号图标，就会出现一个新的小面板。将其拖到屏幕底部。需要注意的是，你必须手动将其居中在屏幕中间。\n\n接下来，使用图\
  \ A.40 所示的设置配置 `Panel 2`。\n\n![新面板设置快照。](img/bapp01f040.png)\n\n图 A.40 新面板设置\n\n\
  让我们开始添加快捷方式。要这样做，只需打开菜单并搜索你想添加的应用程序；然后右键点击它并选择 `Add To Panel`（添加到面板），如图 A.41 中文本编辑器所示的那。\n\
  \n![添加到面板快照。](img/bapp01f041.png)\n\n图 A.41 添加面板\n\n对之前列出的所有应用程序遵循相同的程序。图 A.42 显示了最终结果。\n\
  \n![最终结果快照。](img/bapp01f042.png)\n\n图 A.42 最终结果\n\n\n\n\n\n你可以通过右键点击桌面并在菜单中选择 `Desktop\
  \ Settings`（桌面设置）来访问桌面（或其他任何模块，如面板、菜单等）的设置，如图图 A.43 所示。这是一个快速快捷方法，无需打开菜单并点击 `Settings`（设置）快捷方式。\n\
  \n![桌面设置截图](img/bapp01f043.png)\n\n图 A.43 桌面设置\n\n## 更改桌面背景\n\n打开 `Desktop Settings`（桌面设置）窗口后，进入\
  \ `Background`（背景）选项卡以更改背景图像。选择列表中的最后一个（图 A.44）。\n\n![桌面背景截图](img/bapp01f044.png)\n\
  \n图 A.44 桌面背景\n\n### 更改桌面图标\n\n点击（`Desktop Settings` 窗口中的）`Icons`（图标）选项卡并进行以下两项更改，如图图\
  \ A.45 所示：\n\n*   将图标字体设置为 58。\n*   从桌面上移除 `File System`（文件系统）图标。\n\n图 A.46 显示了你新桌面的漂亮外观。\n\
  \n## 从头安装 Kali Linux\n\n之前你已经学习了如何安装预包的 Kali Linux 虚拟机副本，因此你可以跟随本附录。但假设你有一台专用电脑（例如笔记本电脑），并且你想将\
