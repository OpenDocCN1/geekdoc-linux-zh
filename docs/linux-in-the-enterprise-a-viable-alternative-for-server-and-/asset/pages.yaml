  md: '# butlergroup.com


    # Linux in the Enterprise


    # HTTPS - Hypertext Transfer Protocol over SSL


    Secure Sockets Layer. A Web protocol that encrypts and decrypts user page requests
    and pages

    by the Web server.


    (Also refer to S-HTTP for an alternative to HTTPS).


    # IBCS-2 – Intel Binary Compatibility Specification


    A generic system-call interface for applications running on Intel platforms.


    # IIS – Internet Information Server


    A group of Internet servers that include capabilities for Microsoft''s Windows
    2000 or NT operating systems.


    # IKE – Internet Key Exchange


    A key management protocol standard used in conjunction with the IPSec standard.


    # IMAP – Internet Messaging Access Protocol


    A standard client/server protocol for accessing e-mail from your local server.


    # I/O – Input/Output


    The Input/Output of the computer to/from an external device.


    # IP – Internet Protocol


    Also see TCP/IP.


    # IPSec


    An IP security feature that provides robust authentication and encryption of IP
    packets.


    # IPv6 – Internet Protocol version 6


    The next generation IP protocol.


    # ISA – Industry Standard Architecture


    A standard bus architecture associated with the IBM AT motherboard.


    # Itanium


    Intel''s first microprocessor based on 64-bit architecture.


    # JDBC – Java DataBase Connectivity


    An application program interface specification for connecting programs written
    in Java to the data in

    popular databases.


    # JVM – Java Virtual Machine


    A platform-independent programming language that converts Java code into machine
    language and runs it.


    # KDE – Desktop Environment


    An Open Source GUI for UNIX and Linux operating systems. It includes a file manager,
    help system, tools,

    and utilities.


    # Kerberos


    A secure method for authenticating requests for service in computer networks.


    # Kernel


    The name for an operating system''s central set of intrinsic services, providing
    the interface between user

    processes and the system''s hardware.


    # Li18n – The Free Standards Group Internationalization Initiative


    This is a voluntary working group, consisting of Linux and Open Source related
    contributors. Its aim is to

    achieve software/applications portability and interoperability in the international
    context for Linux and other

    Open Source projects.


    September 2004


