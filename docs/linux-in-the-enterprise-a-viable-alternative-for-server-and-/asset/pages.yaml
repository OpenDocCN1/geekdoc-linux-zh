  md: '# Linux in the Enterprise


    # Novell Linux Services


    # Abstract


    Novell''s aim is to provide services for Linux users that remove the inhibitors
    from the enterprise adoption of Linux systems. It believes that the perceived
    lack of support for Linux means organisations are looking to a trusted partner
    that can supply the whole range of support and services. Over the past year, the
    company has acquired SUSE and Ximan to complement its existing Linux services,
    and offer a complete range of Linux-related services, products, and solutions.
    Novell has recognised the possible barriers that enterprises face contemplating
    the adoption of Linux, and designed its services and solutions to counter these
    objections. It aims to eliminate the risks associated with such a move, and this
    strategy should appeal to organisations considering Linux.


    # KEY FINDINGS


    +   - Novell offers a complete ecosystem for using Linux.

    - Its services and solutions will appeal to both its existing customer base and
    prospective customers.

    - The company has global reach, and an extensive partner network.

    - Novell is committed to the open source community.


    +   Key: Product Strength, Product Weakness, Point of Information


    # LOOK AHEAD


    Novell''s strategy through the incorporation of Linux and SUSE products and services
    within its range of offerings, promises to bear fruit for the company. Novell''s
    global experience and presence will appeal to organisations that require comprehensive
    service and support over diverse locations.


    # ▶ FUNCTIONALITY


    Linux is developed under the GNU General Public License and its source code is
    freely available to everyone. This however does not mean that Linux and its assorted
    distributions are free — companies and developers may charge for it as long as
    the source code remains available. Linux is increasingly considered as an alternative
    to other operating systems.


    Due to the very nature of Linux''s functionality and availability, it is becoming
    more and more popular worldwide, and a vast number of software programmers have
    taken Linux''s source code and adapted it to meet their individual needs.


    The Novell Linux strategy, announced in early 2003, is rooted in a commitment
    to deliver a complete range of Linux-related services, products, and solutions
    to the market. A key benefit is the availability of Novell software and services
    to new, prospective customers running Linux. All the services associated with
    the NetWare operating system will migrate to Linux resulting in a network service
    environment from Novell that supports Linux or NetWare.'
