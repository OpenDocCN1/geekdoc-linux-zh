  md: '# Linux in the Enterprise


    # Linux on zSeries


    During the 1990''s decentralisation was in vogue. There was a widespread belief
    that a distributed approach using many small powerful servers would produce cost
    and productivity savings. The flexibility of quick deployment many organisations
    to implement new applications using this distributed architecture, rather than
    continue to use the mainframe. However, there were hidden consequences to this
    approach, not least the increasing complexity of the environment and a growing
    management overhead required to control the distributed architecture.


    This led to a reappraisal of this strategy and for many organisations to look
    at IT optimisation, especially server consolidation, to reverse the trend of server
    sprawl and provide improved efficiencies. In the meantime, IBM has not stopped
    investing in the zSeries platform, re-engineering onto cheaper Complementary Metal-Oxide-Semiconductor
    (CMOS)-based technology and implementing, among many improvements, Parallel Sysplex.


    IT management must administer IT resources efficiently and do more with less,
    despite the emergence of new technologies and additional business requirements
    to support. The need is to maximise the usage of assets for better competitive
    advantage. An IBM zSeries resource is able to take on many tasks, including the
