    Red Enterprise Linux AS is supported by an extensive range of applications from
    leading ISVs, and is certified on systems provided by Dell, HP, IBM, Sun, Bull,
    Fuji-Siemens, and Hitachi. It has achieved impressive industry-standard benchmark
    results.


    # Red Enterprise Linux ES


    This solution is for small to mid-range servers used for the majority of today''s
    business computing needs. Red Hat Enterprise Linux ES provides the core operating
    system and networking infrastructure for a wide range of entry-level and developer
    server applications. It is ideally suited for network, file, print, mail, Web,
    and custom or packaged business applications. It is fully compatible with the
    Red Hat Enterprise Linux family, and it provides the stability, performance, and
    support needed for critical application deployments.


    Red Enterprise ES provides the same core capabilities as Red Hat Enterprise Linux
    AS, but it supports small and mid-size X86-based systems with up to two CPUs and
    8GB of main memory.


    # Red Enterprise Linux WS


    This is the solution for all technical workstation and single unit client needs,
    including software development, power desktop, targeted client applications, and
    High Performance Computing (HPC). Red Hat Enterprise Linux WS is the technical
    and design workstation for Enterprise Linux AS and Enterprise Linux ES. It is
    ideal for all english development desktops, including design workstations, software
    development environments, and targeted engaging IS client applications. When configured
    as a headless workstation, Enterprise Linux WS is also suited for use as a compute
    node in an HPC environment.


    Red Enterprise Linux WS is fully compatible with other members of the Red Hat
    Enterprise Linux product family and provides complementary technology and services.
    It provides support for workstation systems with up to two CPUs, and is designed
    with the client environment in mind. Red Hat Enterprise Linux WS does not include
    a number of server applications found in Red Enterprise Linux AS and Red Hat Enterprise
    Linux ES.


