  md: '# Debian GNU/Linux 3.0


    # Abstract


    Debian GNU/Linux was developed openly in the spirit of Linux and GNU, and it is
    a stable and complete Linux distribution. Debian began with a small, tightly knit
    group of Free Software hackers, and gradually grew to become a large, well-organised
    community of developers and users. Debian GNU/Linux 3.0 offers an alternative
    to organizations that wish to develop and develop their own Linux skills, and
    avoids the costs of major distributions of enterprise Linux. Debian''s Advanced
    Packaging Tool (APT) enables administrators to install and update software easily,
    and has a user-friendly client that allows browsing through available software
    and also through applications installed on an organisation''s platforms.


    # KEY FINDINGS


    +   - Debian GNU/Linux has stability through its use of a mature release of the
    Linux kernel.

    - Upcoming releases by Debian are available in test formats.

    - Range of consultants and some companies, as HP provide support.

    - APT provides a strong software installation and update system.

    - Other Linux distributions are based on Debian.

    - Minimal independent vendor certifications.


    Key: Product Strength | Product Weakness | Point of Information


    # LOOK AHEAD


    The Debian GNU/Linux distribution has been growing fast among Linux servers over
    the past year. However, it has a low profile when compared to its major competitors,
    as it does not have the same level of hardware and software vendor certifications.
    The development of the User project, building a free enterprise-stable Linux distribution
    is key to future growth.


    # FUNCTIONALITY


    In principle, if users choose to do so they could obtain the Linux kernel via
    the Internet or from elsewhere, and compile it themselves. They could then compile
    the programs, and then install them on their systems. This process can be time-time-consuming
    and error-prone, and to avoid these problems, users often choose to obtain the
    operating system and the application packages from one of the distributors. The
    various Linux distributions are distinguished, one from another, by the software,
    protocols, and practices that they use for installing, and tracking applications
    on users'' systems, combined with installation and maintenance tools, documentation,
    and other services.


    Debian GNU/Linux was the result of a volunteer effort to create a free, high-quality
    UNIX-compatible operating system, with a suite of applications. The idea of a
    free UNIX-like system originates from the GNU project, and many of the applications
    that make Debian GNU/Linux so attractive were developed by the GNU project. Free
    software means that the users have the freedom to distribute copies of software,
    receive source code, can change the software, or use pieces of it in new programs.'
  merge: -1
