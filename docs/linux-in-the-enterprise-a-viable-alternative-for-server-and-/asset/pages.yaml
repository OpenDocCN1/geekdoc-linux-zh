  md: '# Linux in the Enterprise


    # Tape Libraries


    Larger installations use tape libraries to provide long-term, high capacity, accessible
    storage for data. Integration with the OS increases speed and resilience of access.


    # Distributed Storage


    There are two principal forms of distributed storage:


    +   1. **Network Address Storage (NAS)** - Hard disk storage with a separate network
    address to that of the servers or workstations. Effectively a server dedicated
    to storage and managing data. This removes the overhead of managing the disks
    and I/O from the processor in the server running the application*. It also allows
    the NAS to be used by more than one server or applications. NAS servers, ideal
    for mirroring, remote back-up, archival storage, and transfer of data from one
    system to another. Use high-end RAID


    +   2. **Storage Area Network** - A sub-network of storage devices that provides
    a single view of all data storage to servers and applications. As with NAS, this
    makes for very easy use of storage space, because each server has neither little
    nor too much available local storage. It allows for distribution of storage, improving
    resilience. SANs are ideal for mirroring, remote back-up, archival storage, and
    transfer of data from one system to another. With NAS, there is a level of latency,
    determined by network speed, so high-speed, potentially Fibre Channel-based, connections
    are necessary.


    Support within Linux for both NAS and SAN should improve performance, particularly
    when applications are processing high volumes of data.


    # File Systems


    The types of file systems supported by OSs and their management are closely linked
    to memory. A file system defines how files are named and how they are stored and
    retrieved. Many file systems have a hierarchical structure with a root directory
    expanding to named sub-directories. File sizes and the ‘page’ sizes in memory,
    by the OS, have a relationship, which can either enhance or decrease performance.
    Linux can use different file system formats as Extended File System 2 (EXT2),
    File Allocation Table (FAT), iso9660, and refs. In Linux the physical file system
    is separated from the OS by the Virtual File System (VFS).


    # Network File System (NFS)


    NFS allows a server to store and manage files on a separate computer as if they
    were on a local hard disk. The files can be managed and controlled exactly the
    same way as if they were held locally. Support for NFS in an OS facilitates remote
    management, support, and installation. Linux can function as client and server
    for file systems using the NFS protocol, and traditional for UNIX systems.


    # Journaling Support


    In a Journaling File System (JFS), the changes to the directories and bitmaps
    are recorded separately in a log file before updating the file system. This protects
    data integrity. If a crash then the entries in the log file can be used to reconstruct
    the data in storage. Journaling support within an OS is an essential tool for
    improving resilience and performance in business-critical systems. Improved journaling
    functionality has been included in the 2.6 kernel, along with IBM’s JFS and SGI’s
    XFS.


    # Directory Services


    Historically each application was built with its own security regime, normally
    authorised by a username and password. Whilst this is manageable in a single domain
    with a limited number of servers and applications, the volume of work can increase.'
