  md: '# Linux in the Enterprise


    Linux''s Open Source credentials mean it is supported by thousands of developers
    globally who continually check out security. This brings about the identification
    of more vulnerabilities than equivalent proprietary OSs, which tend to rely on
    customers to report problems. When problems are identified the community can develop
    fixes quickly, faster than with proprietary OSs that are constrained by the size
    of vendor development teams. Additionally, the user organisation or service provider
    can fix the Linux security issue without having to rely on the proprietary vendor
    to come with a patch.


    # Linux''s Open Source credentials mean it is supported by thousands of developers
    globally who continually check out Linux security.


    While currently not being the favourite target of hackers and those with malicious
    intent, Linux still needs to be protected from attacks. The Open Source community
    has developed a variety of security tools for use with Linux. Utilities contained
    in Linux distributions and other third-party software are available to provide
    a secure environment. The technologies and functionality include:


    # Authentication and Access Control


    Authentication makes sure that the server or user application accessing the system
    is actually who or what they promise to be, and that access control allows users
    to access themselves only of the resources for which they are authorised. Open
    Source authentication tools include OpenSSH, Pluggable Authentication Module (PAM),
    and Kerberos.


    OpenSSH encrypts everything, including passwords, to server eavesdropping, connection
    hijacking, and other network-level attacks. It also offers secure tunnelling functionality
    and other authentication mechanisms.


    PAM is an industry standard providing an integrated login structure. It is employed
    by system services to authenticate users logging into the Linux system. PAM is
    able to combine a number of authentication mechanisms such as Rivest, Shamir (RSA),
    Kerberos, and smart cards.


    Kerberos is a certificate-based authentication. It is based on ''tickets'' that
    provide authority for users. These are passed to the servers on a network to allow
    the user to undertake tasks while running on servers. With the use of a directory,
    this significantly reduces the demands for administration over users.


    Where there are servers that require tickets, the user is authenticated by an
    Authentication Server (AS), which grants a ''session key''. This is passed in
    encrypted form to a Ticket Granting Server (TGS); this validates the ticket for
    an application, a particular role within that, and for a specific time (normally
    eight hours). The ticket is sent to the server hosting the application and access
    is granted. Authentication services are the base for any security control, and
    the tighter the integration with an OS the more secure the IT environment is likely
    to be.


    # Network Security Services


    Security on a single server or within a single domain can be complex. When security
    has to be extended or outside the enterprise, then additional services may be
    required. Here are key technologies required for implementing secure networking,
    particularly over the Internet. As before, if these are integrated with the OSs
    of respective servers, their deployment and integration should be quicker, management
    easier, and consequently security will be increased.'
