    nodes. This architecture is imperative for particular types of high-performance
    computing, such as weather modelling, particle physics research, structural engineering,
    and nuclear research, where the effort to simulate the real world requires a great
    degree of precision and a lot of RAM.


    # Vendor Profile


    Terra Soft is based at the foothills of the Rocky Mountains in Lov, Colorado.
    It is a privately held corporation whose primary market position is to advance
    the abilities and usage of PowerPC Linux while supporting the open source philosophy
    of software development. In the late 1990s, Terra Soft CEO Kai Staats was called
    upon to design and build a Web server, and he faced a unique dilemma: to use Apple
    Macs, but the pre-Unix Mac of that era was not reliable for mission-critical services.
    Staats was familiar with Linux and appreciated its stability; however, he did
    not want to buy an IBM Mac hardware, and then, with the help of his IT team, ported
    Linux to the PowerPC, which at a time there was a Mac G3. Thus, Yellow Dog Linux
    for the PowerPC was born. In 2003, Terra Soft won a contract to build a sonar
    imaging system for the U.S. Navy defense contractor Lockheed Martin. The company''s
    client list also includes such technological heavweights from Caltech, Stanford
    University, Lawrence Livermore, Boeing, and several arms of NASA.


    Terra Soft is an IBM business partner or a Value-Added Reseller. It is licensed
    to sell the BladeCenter JS20 and same-family products with Yellow Dog Linux preinstalled.
    It is not yet a primary developer for IBM but that company has a much stronger
    financial relationship with Red Hat and SUSE.


    # Terra Soft Solutions


    Loveland


    USA


    www.terrasoftsolutions.com


    # Turbinolux Inc.


    # Product Profile – Turbinolux


    Turbinolux distributions are designed from the ground-up specifically for enterprise
    computing. Turbinolux 8 supports the Large File Support (LFS) standard for working
    with applications that manage or handle up to four terabytes of data – a common
    requirement for infrastructures serving the Fortune 500 and larger companies.
    Turbinolux Enterprise Server 8, powered by UnitedLinux, is a high business server
    platform integrating reliability, availability, and scalability features.'
