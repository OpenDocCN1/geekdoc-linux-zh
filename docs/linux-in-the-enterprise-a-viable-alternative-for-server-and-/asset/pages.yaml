  md: '# Linux in the Enterprise


    # DEPLOYMENT


    Skilled Debian administrators are required for the deployment of Debian. It runs
    on virtually every hardware architecture so no special hardware is required. The
    number of skilled Debian administrators required for a rollout, or migration to
    Debian, depends much on the needs of the end-user. Debian GNU/Linux is highly
    scalable in terms of administrative overhead, and a single Debian administrator
    can easily roll out a thousand servers and workstations in a month with the aid
    of some unskilled labour. On the other hand, if the end-user has custom software
    applications which must be ported to Debian, the burden can quickly depend on
    the previous platform used.


    A single Debian server installation is typically completed within 20 to 30 minutes.
    Using standard GNU/Linux tools, a full-scale rollout to a thousand-existing workstations
    can take as little as an hour or two if they are identical. Debian does not offer
    paid support for end-users, and are expected to hire appropriately skilled administrators
    to care for their IT infrastructure. Many end-users approach Debian for recommendations
    of suitable administrators, and Debian believes that the business case using in-house
    support community


    > Debian does not offer paid support for end-users, and are expected to hire appropriately
    skilled administrators to care for their IT infrastructure.


    Debian says that training is best provided by skilled Debian administrators, and
    the requirements will depend on the experience of the end-user''s support staff.
    Debian is a GNU/Linux distribution, and much of the knowledge applicable to one
    GNU/Linux distribution is portable to another.


    Ongoing technical support is provided by the end-user, although a large Debian
    community can augment or entirely replace internal support systems in the case
    of a small installed base. Hardware must be purchased from a third party, and
    there are many hardware vendors who provide hardware that is Debian-compatible.


    Debian is a community-developed GNU/Linux distribution. All parts of the distribution
    are both standard and optional, and the price purchase on all components is zero
    – Debian is a free GNU/Linux distribution.


    Debian GNU/Linux 3 is available in the following architectures:


    +   * IA-64

    * S/390

    * Alpha

    * ARM

    * HP PARSC

    * Intel I386

    * Sun SPARC

    * MIPS (DEC)

    * MIPS

    * Motorola 68000 series

    * PowerPC


    # PRODUCT STRATEGY


    Debian regards its market as organisations that require general-purpose computer
    software. These organisations can be small to large in size. Debian sees its major
    market opportunity as the increasing awareness of the extremely high cost of using
    external resources. Whether these external resources are providing software or
    support services, Debian asserts that the costs are almost invariably an order
    of magnitude higher than what an organisation can provide for themselves when
    it uses the free Debian GNU/Linux distribution.'
