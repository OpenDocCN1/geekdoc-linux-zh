  md: '# Linux in the Enterprise


    # Mandrakeclustering HPC solution


    Mandrakeclustering is an easy-to-deploy clustering solution for simulation applications
    that need intensive computing. It is a solution based on research project CLIC,
    and it has been designed to offer organisations and research laboratories an affordable,
    fast to deploy, easy-to-use, heavy-calculation system based on clustering. It
    is aimed at bringing together a unique combination of the best free-software cluster-oriented
    nodes and Mandrakesoft''s proven experience in design and accessibility to merge
    into an easy-to-use Linux distribution for clusters.


    Typical applications for Mandrakeclustering include:


    +   - Crash simulations.

    - Acoustics.

    - Seismic modelling.

    - MonteCarlo simulations.

    - Risk analysis.


    Low latency and high bandwidth are made possible by the use of the SCI connections
    between nodes. The Pentium version also benefits from CPU optimisations made with
    the Intel® compiler (for Pentium IV Xeon).


    Utilising Preboot Execution Environment (PXE) Mandrakeclustering can be quickly
    installed. Mandrakesoft says that deployment is possible in a few minutes with
    the help of Cluster auto setup and Kdeploy tools. The Mandrake package management
    system and dependency solver, URPMI are parallelised to allow the automated software
    update of all nodes simultaneously.


    To guarantee an optimal user experience, Mandrakeclustering provides a graphical
    interface plus numerous administration tools to allow the Cluster administrator
    to add and remove nodes, create virtual partitions, assign users to partitions,
    and graphically configure the entire system. Graphical monitoring of the system
    is performed using a dedicated tool to use two network interfaces, thereby allowing
    the ability to differentiate between the administration network and computing
    network.


    Mandrakeclustering benefits from a superior range of hardware support. Each node
    adapts itself depending on the hardware used, such as SCSI, network, and file
    system, allowing support for heterogeneous environments. Additionally, Mandrakeclustering
    supports up to 4 GB of RAM for each node (16 GB for Opter).


    Mandrakeclustering is supplied as a turnkey clustering environment, and it is
    based on the Mandrake operating system. It offers PCI drivers, server clustering
    messaging transit layers, graphical monitoring tools, parallelised plus numerous
    mathematical libraries.


    Mandrake provides a set of tools that allow easy updating of the system. It includes
    URPMI and Mandrakeupdate, and automatic security features that check the system
    integrity regularly. The company also offers additional services such as Mandrakeonline
    that warns system administrators of new security alerts and updates. It also offers
    a large choice of configuration utilities.


    Mandrake provides several security features as default:


    +   - Different security levels that can be set by the system administrator, depending
    on how the system is used.

    - A service that scans the system''s security regularly.

    - The MNF.'
