  md: '# Linux in the Enterprise


    Oracle states that it does not want to own the operating system or to become a
    distributor. It sees its value as providing the databases and products to run
    on the platform, and the ability to offer up to third-level support from a single
    company. The company regarded the Novell acquisition of SUSE as providing significant
    credibility for the operating system and confidence for business customers. Being
    a worldwide organisation and a Linux distributor with worldwide marketing and
    distribution complements Oracle''s global strategy for Linux.


    # Oracle recognises the potential of Linux systems as building blocks for grid
    computing.


    Oracle recognises the potential of Linux systems as building blocks for grid computing.
    The features of the Oracle 10g database, with the g indicates designed for distributed
    storage and processing across a ''Grid'' of servers, with low-cost commodity Linux-based
    servers, are the foundation for enterprise grid deployments.


    # DEPLOYMENT


    All software can be deployed on either Red Hat or SUSE distributions of Linux.
    Oracle Standard Edition One, on Red Hat Linux is even available preinstalled on
    a Dell server, and can be ordered directly from Dell.


    Despite this partnership with Dell, Oracle software running Linux is agnostic
    of the underlying hardware platform. For example, Oracle''s widely reported TP-C
    record for non-clustered Linux was made on an NEC Express 5800.


    Oracle collaborates directly with Red Hat and SUSE to provide first-to-third line
    support for its customers, and its consultancy arm will assist customers on evaluation,
    testing, and implementation as required.


    Oracle will provide a wide range of training, and certification to meet respective
    customer needs. This includes a special accreditation for Oracle Certified Professional
    (OCP) on Linux.


    # Deployment Examples


    Schools in Fairfax County, Virginia, USA are now starting to utilise Business
    Crystal Enterprise 10 for Linux, and an Oracle database running on Red Hat Enterprise,
    to provide on-line analysis of students'' attendance data, grades, and scores.
    The previous in-house Decision Support System (DSS) was used by the 2,000 administrators,
    but could not efficiently scale to 20,000 persons, for the teachers to use. The
    new system provides Web-based access for all teachers and administrators. It has
    been estimated that a deployment using Microsoft Windows would have required four
    times the number of Intel-based servers to deliver the required service.


    The school district is also planning to standardize all of its databases on Linux
    servers, migrating from existing HP-UX and Solaris systems, with the objective
    of moving towards a single operating system environment.


    Amazon.com and its sellers list many of new and used items in categories: electronics,
    computers, kitchen products, house wares, music, DVDs, video and photo items,
    software, computer and video games, cell phones and service, tools and hardware,
    travel services, magazine subscriptions, and outdoor living items. Amazon.com
    runs its data warehouse on Oracle9 Database Edition with Oracle Partitioning.
    The database contains 10 terabytes of data and continues to double each year in
    size and query volume. The database is updated six times per day, as daily operating
    cycles run through the subsidiary Web sites in France, Germany, Japan, the UK,
    and the US.


