  md: '# Linux in the Enterprise


    # SMP


    In SMP or ''tightly-coupled'' multiprocessing, the processors share memory and
    the I/O bus. A implementation of an OS is run across all the processors, treating
    them their memory and I/O as a single resource. Operations from an application
    can be divided across more than one processor, and effectively run concurrently.
    This reduces the time taken to perform transactions and processes. There is, of
    course, a level of overhead for the division of the data, the monitoring of the
    processes, and reassembly of the data after completion.


    Early implementations of SMP required SMP awareness to be coded into each architecture.
    OSs and their supported languages have mastered, this is now delivered as core
    functionality in Linux. The numbers of processors that can be supported on a single
    server in this way depends both upon the distribution and the hardware architecture.
    For example, the maximum number of x86 processors that can be supported by server
    vendors is normally 16; however, the Linux 2.6 kernel has the potential to support
    up to 64.


    # NUMA


    New processors are beginning to use NUMA technology where all the main memory
    is partitioned into local and shared. The local memory provides the processor
    with memory running at speeds; while access to memory is slower due to latency
    of the connection between the memory on each processor board. This design approach
    tends to be cheaper to produce on motherboards with four-way processors and above,
    leading it to be adopted by many manufacturers. The Linux 2.6 kernel supports
    NUMA.


    # Clustering


    Clustering can be used for scaling out, as well as for RAS requirements. Linux
    cluster vendor California Digital, with Aquos and Intel, have developed one of
    the most powerful Linux supercomputers built; a 4096 Itanium processor-based Linux
    cluster code-named ''Thunder'' at Livermore National Laboratory. The Thunder cluster
    can deliver up to 19 teraflops of sustained performance.


    # Hyper-threading


    Hyper-threading is a technology developed for x86 processors, which allows a single
    processor to act like two separate processors. Hyper-threading facilitates greater
    use of the processing power within the CPU, by utilising space capacity that may
    be awaiting data or instructions from a slower component in the system, for example
    a disk drive. Hyper-threading has been included in the 2.6 kernel.


    # Conclusions


    +   - Linux continues to increase its scalability features, with the Linux 2.6
    kernel enabling more performance.

    - Scalability is less likely to be an issue in the future.


    # 3.3 SECURITY


    Many aspects of Linux security are similar in design to that found in UNIX systems.
    Linux source code is openly available for anyone to examine, prevents any hidden
    entry points into the OS, and enables the addition of bespoke security software
    to further enhance security. Users need a password and the relevant authorisations
    to be able to access services and resources. Other functionality available includes
    logging, monitoring, audit, and patch management features. IP Security (IPSec)
    support has been added to the latest kernel release. Comodo supplies the security
    hardened, server optimised Trust Linux distribution.'
