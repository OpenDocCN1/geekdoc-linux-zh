  md: '# Dundee City Council


    Dundee is a city of 145,000 on the east coast of Scotland in the UK. A unitary
    authority, it provides a wide range of services to its population including, housing,
    social services, refuse collection, and leisure facilities.


    Faced with the dual pressures of central government targets to modernize, and
    the increasing expectations of its citizens for better services, available at
    times that were convenient and not just the council, the authority realised that
    it had to provide a greater range of online-services, both for the people of Dundee
    and the employees that served.


    At the same time the council''s IT department had a range of UNIX-based servers,
    several of which were reaching the end of their operational life. These servers
    were running a variety of applications such as housing systems, social work systems,
    and rent accounting services. Rather than undertake a for-like replacement, the
    IT department sought the opportunity to reduce space, heat output, operational
    and licensing costs through consolidation. But this had to be done without increasing
    the risks of failure, both for the critical systems such as payroll, and for the
    council''s interface for its citizens, its Web site www.dundee.gov.uk.


    After much consideration, and as part of an open procurement process, the council
    decided to replace the existing Linux UNIX-based servers with IBM TotalStorage
    Enterprise Storage Server (ESS) 800 mainframe, supported by IBM Tier 1 high availability
    storage. The primary objectives were to reduce the long-term running costs, and
    to ensure the stability of the mainframe environment or availability. The Linux
    virtual machines on the zSeries were also calculated to have lower space and heat
    output requirements than physical servers.


    Interestingly, unlike a number of other Linux deployment examples, Dundee did
    not have an incumbent zSeries and the existing skill sets for running a mainframe,
    but even with this additional effort in migration, the council could justify the
    project through both the benefits and the savings.


    IBM provided the hardware, software, implementation and migration services, and
    all training/education for the project.


    The zSeries provides a number of online-services to the local population, which
    include using the council''s Web site to settle outstanding bills, update personal
    records, alert council departments to, and enquire for information. The council''s
    fully integrated Human Resources and payroll system, ResourceLink from Northgate
    Information Solutions, have been deployed on the zSeries.


    The costs following deployment of the mainframe are coming from a number of areas.
    Besides the administration, management, and support costs, there is the reduced
    heat output. This is in fact a double saving for the electricity, from both that
    consumed by servers, and to run the air conditioning systems to remove the heat
    generated. Further costs will also come from the lower licensing costs of the
    Oracle databases, which are based on the number of processors used.


    The administration and management capability of the zSeries is also providing
    advantages for the IT department in the time within which it can respond to changes
    in the council''s requirements. Additional virtual machines can be created in
    minutes by ''cloning'', the new virtual machine, inheriting all the security controls
    by default. The council, and its IT department, believe that the zSeries running
    Linux virtual machines, they now have the provision of a highly flexible infrastructure
    for future use.'
