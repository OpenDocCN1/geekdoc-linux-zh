    the computing on demand paradigm; it also plays to the issues of the TCO through
    the consolidation of infrastructure and skills. The support for greater numbers
    of processors in the 2.6 kernel will enable IBM to offer flexibility and power
    in the On Demand model.


    # Linux is now at the centre of IBM''s product offerings, not only does it fit
    with the computing on demand paradigm; it also plays to the issues of reduction
    in the TCO through the consolidation of infrastructure and skills.


    IBM seeks banking, government, and retail as the key markets for Linux adoption,
    with other industries, particularly in the Small to Medium-sized Business (SMB)
    area, being drawn by specific IBM Industry Solutions, and the creation of Linux
    versions of enterprise applications by ISVs.


    Geographically IBM has seen Europe and the US as the early adopters, but has identified
    China, India, Russia, and Brazil as being markets where Linux adoption could be
    very rapid.


    IBM regards Linux as the ideal operating system for thin-client and pervasive
    computing devices, which recognises 64-bit support and performance will be required
    to gain further traction to displace UNIX servers.


    In 2004 IBM will be pushing Linux through under the "Linux optimised IBM solutions"
    tag.


    +   * It has already implemented horizontal clustering to create large DB2 databases
    with DB2 ICE, and has demonstrated technology previos of 64-bit DB2 on its POWER
    processors (iSeries servers).

    * Java 2 Enterprise Edition (J2EE) Application servers will be migrated to WebSphere
    on Linux from UNIX.

    * E-Mail servers will be migrated to Lotus Domino for Linux on xSeries and x.


    # COMPANY PROFILE


    International Business Machines (IBM) is one of the world''s largest technology
    companies, with operations in 164 countries. The company was incorporated in the
    State of New York on 15 June 1911, as the Computing — Tabulating — Recording Co
    (C-T-R), a consolidation of the Computing Scale of America, The Tabulating Machine
    Co., and The International Time Record of New York. In 1924, C-TR adopted the
    name International Business Machines. The corporate headquarters are in Armonk,
    New York, US.


    IBM makes a broad range of computers, including PCs, mainframes, network servers,
    peripherals, and produces a comprehensive range of software. It has a consultancy
    services arm. Nearly 60% of the company''s sales are to non-US customers. IBM
    continues to focus on the Internet and e-business.


    The company has over 300,000 employees worldwide. IBM common stock is listed on
    the New York Stock Exchange (NYSE: IBM), on other exchanges in the United States,
    and around the world.'
