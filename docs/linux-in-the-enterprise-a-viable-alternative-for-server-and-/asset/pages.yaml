  md: '# Linux in the Enterprise


    # Technology Issues


    # Linux''s ability to run on this industry standard hardware makes it a prime
    contender to replace proprietary UNIX solutions.


    A number of significant technology trends within the IT industry have made Linux
    a leading contender for inclusion in an organisation''s infrastructure. Intel-based
    architecture dominates the enterprise IT environment. With Moore''s law constantly
    advancing performance and the increasing use of blade technology, x86 hardware
    is a feasible option for all data processing requirements, for large database
    and transactional applications. Linux''s ability to run on this industry standard
    makes it a prime contender to replace proprietary UNIX solutions.


    This hardware independence is especially important as organisations start to move
    into the 64-bit world. It is by no means certain which processor will become the
    industry standard from Intel Xeon and Xeon, AMD Opter, and IBM POWER. Being hardware
    agnostic gives the flexibility to utilise whichever system provides the best performance
    and value now and in the future. This portability at last presents the IT manager
    with the leeway to maximise the best price from hardware vendors.


    # Where Linux has a significant advantage in the totality of software stack, developer
    tools, available functionality, and integration, especially in the desktop environment.


    There is a continuing focus on doing more with less, consolidating servers to
    maximise utility along with a move to computing clusters. Linux allows the number
    of OSs deployed in an organisation''s infrastructure to be decreased, reducing
    the administration overhead of the IT environment. In addition, the connectivity
    features built into Linux allow integration with Microsoft, Novell, and other
    networks, which can help with the implementation of a consolidation strategy.


    The latest 2.6 Linux kernel release, made available at the end of 2003, builds
    on the previous version with enhancements that include support for NUMA servers,
    hyperthreading, scalability improvements,securityrelated changes, and more legacy
    support. Novell plans to include the new kernel in its SUSE LINUX distribution
    at the time that this Report is published and Red Hat to do the same by early
    2005.


    Linux is, of course, not the only alternative going forward. Microsoft Windows,
    while not being completely hardware agnostic, does not run on industry x86-based
    architecture. The combination of Microsoft Windows XP and Microsoft Server 2003
    offers an IT platform that is compelling for the enterprise user, especially with
    the focus on improved security, reliability, availability, and scalability. Where
    Windows has a significant advantage in the totality of software stack, developer
    tools, available functionality, and integration, especially in the desktop environment,
    a shortcoming is perceived as the on going licensing costs, an issue that ironically
    Microsoft itself brought to the fore.'
  merge: -1
