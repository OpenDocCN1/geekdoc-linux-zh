  md: '# Linux in the Enterprise


    Mandrakesoft says that it offers a complete enterprise solution that includes
    everything needed to rapidly deploy world-class Linux applications in the enterprise.
    The MandrakLinux Corporate Server 2.1 is based on the award-winning Mandrakelinux
    operating system to provide all the tools required to deploy world-class Linux
    applications.


    Installation of the product can be easily carried out through the use of Mandrakesoft''s
    famous "point and click" graphical installer. Easy to use Wizards for configuring
    all the main features ensure that customers can have a system up and running in
    quick time. Key features include:


    +   - Easy to install with intuitive graphical interface.

    - Configure services with easy to use Wizards.

    - Admin with any secure Web browser.

    - Linux kernel 2.4.

    - Choice of several journalised file systems.

    - Dynamic Host Configuration Protocol (DHCP) server.

    - Apache Web Server, which is pre-configured with PHP (scripting language) and
