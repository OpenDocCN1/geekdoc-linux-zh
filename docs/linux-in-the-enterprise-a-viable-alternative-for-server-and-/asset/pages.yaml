  md: '# Linux in the Enterprise


    This x86 architecture is gaining ground in the market. The introduction of Linux
    into the era has a positive effect for this microprocessor architecture, bringing
    into question the likely longevity of RISC, also influenced by the technology
    advances in both RISC and Complex instruction Set Computers (CISC) that have helped
    to diminish the early advantages of RISC and brought the two architectures closer.


    The growing concerns over the proprietary nature of RISC, also by the growing
    influence of Linux and industry standard technology, is hardly surprising that
    RISC has started to come under increased pressure and x86 is gaining a much higher
    profile. Users are now looking at Open Source software, such as Linux, to non-proprietary
    platforms as a decreasing risk and from outright.


    This is not to say that Linux is only influential in the x86 market - far from
    it. For example, enterprise distributions from Red Hat and Novell support, S/390,
    and SPARC, among many other hardware platforms. Interestingly, HP does not support
    Linux on its PA-RISC architecture, due to its commitment to Intelanium. Due to
    Linux''s independence from an individual vendor, developers can adapt it for any
    architecture they require.


    This allows decision on platform choice to take other factors into consideration,
    such as microprocessor architecture. These decisions will be based upon numerous
    factors, but the one that most people will understand is that of cost. Unfortunately,
    especially when consolidation is given to the various influencing factors that
    will be unique to each organisation. The most of research looks at the Microsoft
    versus Linux environments, rather than where significant cost savings can be exploited
    at the hardware/processor level, where the decision is x86 versus RISC architecture.


    This has been further complicated with the availability of 64-bit processors aimed
    at the enterprise. It is by no means certain which of a number of chips, Xeon,
    Titanium, Opteron, or POWER, will be the industry standard going forward. This
    makes the hardware agnostic characteristic of Linux very significant.


    # Server Consolidation


    Consolidation approaches that can be exploited with the Linux OS are either running
    natively, in a partition, or as a virtual machine. The use of physical consolidation
    reduces the number of servers in the environment by replacing small servers with
    the same processor architecture running the same application, with one larger
    server capable of supporting the bundled community without any changes. Dependent
    on circumstances, this type of consolidation can be deployed at department, data
    centre, or enterprise level.


    The average usage of a distributed server is between 10% and 35%. With implementation
    of a consolidated environment containing free, more powerful servers, this utilisation
    can be increased to much higher levels without impacting response times. Large
    serving servers from HP, IBM and others are capable of workloads in excess of
    80%. In large serving IBM is to provide a new line of POWER 5 Linux with virtualisation
    features, enabling up to ten micro-partitions. The POWER 5 processor has also
    been tuned to increase the performance of Linux.


    Moore''s law indicates that computing power doubles every 18 months and chipset
    architecture – providing performance improvements with faster memory, larger cache,
    enhanced I/O design, and servers–including Intel-based systems to support many
    more users, allowing consolidation onto fewer machines. Linux scalability is also
    improving. The 2.6 kernel offers the opportunity to scale up to 16-way processors
    and beyond, and the use of Linux clusters provides the ability to scale out.


