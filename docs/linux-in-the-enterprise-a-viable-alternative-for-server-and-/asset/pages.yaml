    of manageability and security. Red Hat Desktop supports single CPU systems up
    to 4GB of main memory. Red Hat Desktop is available in packages of either 10 or
    50 units for mass deployments of consistently configured clients. It is fully
    compatible with other members of the Red Hat Enterprise Linux product family and
