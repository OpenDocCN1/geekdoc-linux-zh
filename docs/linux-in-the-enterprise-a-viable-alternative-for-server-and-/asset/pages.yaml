  md: 'Debian provides integrated firewall capabilities by iptables, intrusion detection
    via samhain and snort, and confidentiality support via grseccy, SELinux, LIDS.
    Debian says that these are above and beyond the standard requirements for Linux
    security.


    # For manageability and usability, Debian offers a number of solutions to meet
    end-user needs.


    Debian currently includes more than 8250 software packages, and users can select
    which packages to install with a tool provided for this purpose. A list and descriptions
    of the software packages are available at any of the Debian mirror sites. There
    is no consortium membership or payment required to participate in its distribution
    and development. All the software packages that are formally part of Debian GNU/Linux
    are free to distribute, usually under terms specified by the GNU Public License.
    The Debian FTP archives also include approximately 350 software packages, which
    are distributable under specific terms with each package.


    Although GNU/Linux itself is free software, it is a base upon which value-added
    Linux distributions can be built. Debian says that by providing a reliable, full-featured
    system, it allows Linux users with increased capability, and allows Linux distribution
    creators to eliminate duplication of effort and focus on the things that make
    their distribution special.


    Debian says that it is the only distribution that is for every developer and to
    contribute to his or her work. It is the only significant distributor of Linux
    that is not a commercial entity. It is the only large project with a constitution,
    social contract, and policy documents to organise the project. Debian is also
    the only distribution which is "micro packaged" using detailed dependency information
    regarding inter-package relationships to ensure consistency across upgrades.


    Like most distributions, Debian GNU/Linux provides:


    +   - The GNU applications for software development, file manipulation, and text
    processing, including gcc, g++, Tc/Tk, texinfo, Emacs, the Bash shell, and numerous
    UNIX utilities.

    - Perl, Python, Tcl, and various related programs, modules and libraries for each
    of them.

    - Tex (LaTeX) and Lyx, dvips, and Ghostscript.

    - The X Window System, which provides a networked graphical interface for Linux,
    and countless X applications including GNOME.


    +   - A full suite of applications


    The Debian GNU/Linux has a bug tracking system that details bugs reported by users
    and developers. Due to the geographical dispersion of Debian developers, sophisticated
    tools and quick communication of bugs and bug fixes were required to accelerate
    the development of the system. Each bug is allocated a number, and is kept on
    file until it is recorded as being dealt with. Debian provides bug-tracking web
    pages.'
