  md: '# Linux in the Enterprise


    In the production environment, SUSE LINUX is able to compile SUSE LINUX Enterprise
    for many different hardware architectures directly from a single code base. It
    is available for all relevant platforms, from 32-bit and 64-bit AMD/Intel processors
    up to the costly IBM eServer series including mainframes.


    Based on the same technology as the SUSE LINUX Enterprise Server, a more reoriented
    product offering for the SMB market is the SUSE LINUX Standard Server, which is
    designed for small organisations and departments which wish to implement Internet
    access, as well as e-mail, print, and file services in a reliable and secure way.
    It is a more cost-effective solution for smaller organisations where the implementation
    scales up to a maximum of 2 CPUs, as opposed to the Enterprise Server solution
    that can scale up to 32 processors for 32-bit platforms and 64-bit platforms.


    SUSE LINUX Enterprise Server 8 is flexible and versatile, and delivers security,
    reliability, availability, scalability, and automated administration for business-critical
    server and network services, including:


    +   * File and print servers.

    * Integration of Windows, Apple, Novell, and UNIX in heterogeneous networks.

    * Web servers and Web application servers.

    * Mail servers.

    * Web content filters and proxy servers.

    * Dial-in and dial-out servers for analogue, ISDN, and DSL connections.

    * DNS, DHCP, and WINS.

    * Application servers.

