- img_proc: true
  md: '# Linux in the Enterprise


    The bedrock of the Linux ecosystem is the Open Source community feeding changes
    and fixes into the Linux source code. While many consider this a weakness, it
    is difficult to control and gain consensus among such a large number of people,
    it is in fact a major strength of the whole Linux development process. Torvalds
    and his inner circle, in close conjunction with the Open Source Development Labs
    (OSDL), which is supported by many IT vendors, have retained copyright and control
    of the kernel.


    Many Independent Software Vendors (ISVs), hardware vendors, and service providers
    now contribute software to the Open Source community for inclusion in the Linux
    kernel. These contributions grow through the same process as code from other authors
    adoption into the code. A concern is the fragmentation of distributions/kernel
    and the commercialisation of the Open Source ideal. To a large degree no vendor
    controlling the kernel prevents this, and so a symbiotic harmony has been maintained
    between the Open Source community and the business population.


    This openness and flexibility Linux is particularly appealing to public sector
    organisations, which can take the source code and cultivate a development community
    around the OS, associated utilities, and applications specific to their area of
    operation. This enables the creation of skills and knowledge in the immediate
    neighbourhood where the state-owned administration provides services.


    Although Linux was originally written for the Intel 386 (x86) processor and on
