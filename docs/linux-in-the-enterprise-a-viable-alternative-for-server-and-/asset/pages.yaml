    and easily managed environment. It is the newest member of the Red Hat Enterprise
    Linux family and provides a high-quality, full-featured client system that is
    suitable for use in a wide range of desktop environments.


    While focused on enterprise and commercial markets, the features and stability
    of Red Hat Desktop also make it attractive for use in small and medium business
    environments. It is available in configurations that include Red Hat Network Proxy
