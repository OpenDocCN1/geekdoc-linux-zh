  md: '# 5.1 BUSINESS BENEFITS AND PITFALLS


    There are a number of benefits that can be gained from the migration to Linux,
    several of which have already been alluded to in this Report. Many of these advantages
    stem from the way in which Linux has developed and the design principles adopted
    from an early stage, meaning that aspects such as resilience and security were
    built into the Operating System (OS) rather than added at a later date.


    Whilst there can be significant advantages for many organisations it is dependent
    on the specific circumstances of the enterprise as to whether maximum benefit
    can be accrued from adopting Linux.


    Whilst there can be significant advantages for many organisations it is dependent
    on the specific circumstances of the enterprise as to whether maximum benefit
    can be accrued from adopting Linux. As would be expected there are also a number
    of issues, perceived and real, that can impact on the decision to deploy Linux,
    not least the cost of migration. Again these can be important to some organisations,
    while others deem the issues minor or surmountable.


    # Advantages


    Linux has evolved into a robust multitasking and multi-user enterprise-ready environment
    that offers features and functionality out-of-the-box, matching UNIX and Microsoft
    Windows in many areas. Linux scores highly with its unique portability, where
    the same kernel is able to run on many different hardware platforms. The decision
    on which OS is to be used can be separated from the hardware platform to be deployed.
    It also means that UNIX applications running on proprietary platforms can be easily
    ported to cheaper x86-based hardware.


