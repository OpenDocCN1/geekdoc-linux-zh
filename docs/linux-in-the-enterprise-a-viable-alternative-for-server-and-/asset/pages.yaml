    automated and takes approximately 30 minutes. It says that as a minimum PC of
    the Pentium class with at least 1GB of free space on hard drive, and 128 MB of
    RAM. Most of the resources required are supplied with the product, but additional
    services and resources can be located on its Web site without Mandrakeclub, and
    through different services as Mandrakesoft support and Mandrakeline.


    Mandrakustering can be fully installed on the customer site by Mandrakesoft or
    by the customer, who can provide test results to Mandrakesoft who will then provide
    support and answers to incidents that occur on the running configuration.


    Mandrakesoft products are designed to require the minimum training. It says that
    most Microsoft users with basic knowledge can handle Mandrakelinux without too
    much trouble. The company provides electronic and printed documentation with its
    products, and a knowledge base is also available on Mandrakeclub. Additionally,
