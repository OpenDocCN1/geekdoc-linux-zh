  md: '# Linux in the Enterprise


    Let''s be clear though; Linux, whilst offering an end to hardware vendor lock
    in, more control, and good resilience, is no universal remedy. There are the same
    issues as with the deployment and maintenance of other platforms, and Microsoft
    Windows continues to be an effective alternative. In the short term, adding Linux
    to the mix can increase skill requirements and complexity, making it imperative
    that management processes and administration tools are free to allow control of
    the IT environment. But an organisation that commits to just two OS, i.e. Windows
    and Linux, will over time reduce the skill sets required for management and administration.


    Linux, whilst offering an end to hardware vendor lock in, more control, and good
    resilience, is no universal remedy.


    # Business Issues


    Everybody accepts that Linux in the enterprise environment is not free. TCO is
    complex with many variables to consider, making direct comparison difficult as
    each organisation is different. Little attention should be paid to the generalised
    TCO studies generated by many in the industry around UNIX, Windows, or Linux is
    the most expensive to operate. Linux management must retain its objectivity in
    selecting the most appropriate and cost effective OS for the selected services
    and applications. In the end, with any IT deployment, it hinges on what the specific
    business and technical requirements are. What is significant is that Linux is
    now a valid option for enterprise.


    The ongoing SCO litigation saga regard to protection of Linux code, involving
    many leading industry vendors, and some customers, looks set to continue for some
    time to come. This backdrop can be unsettling for those deciding whether to make
    Linux a strategic OS. However, this is not seen as a major threat and should not
    cloud the decision-making process, especially as many vendors will indemnify users
    against any unfavourable judgements.


    # The patent regulation changes proposed by the European Union (EU) have the potential
    to cause further difficulties for the Open Source community.


    The patent regulation changes proposed by the European Union (EU) have the potential
    to cause further difficulties for the Open Source community, which of Linux is
    part. If the proposal is accepted in its current form it will allow patents to
    cover code, data structures, and process descriptions. The danger is that Open
    Projects will find patent licensing costly, stifling code reuse and innovation,
    as well as commercial software vendors possibly using the regulations to close
    down Open Source projects. This should not detract from the fact that Linux has
    evolved into a dependable, enterprise-ready environment capable of meeting business
    and technical requirements.


    The absence of accountability for Linux can be a worry for many organisations,
    with liability, the provision of a warranty dip down to a developer. There is
    also a concern as to the future that the OS might take, as there is no guarantee
    that new kernel developments will cater for business needs. The establishment
    of enterprise-focused distributions and the availability of support from the Linux
    ecosystem, including the control and testing provided by the Open Source Development
    Lab (OSDL), should significantly diminish these concerns.'
  merge: -1
