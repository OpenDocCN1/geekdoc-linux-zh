  md: '# Linux the Enterprise


    SSH – Secure Shell or Secure Socket Shell

    A UNIX-based command interface and protocol for secure access to a remote computer.


    SSL – Secure Sockets Layer

    A protocol for managing the security of a message transmission on the Internet.


    SVID3 – System V Interface Definition, Third Edition

    The developers of this specification, UNIX Systems Laboratories, are no longer
    in business and thus there is some confusion in the industry about what is required
    for conformance to this specification.


    TB – TeraByte

    Approximately a thousand billion bytes.


    Tcl – Tool Command Language

    Developed by John Ousterhout, this is an embeddable and extensible scripting language.


    TCP

    See TCP/IP.


    TCP/IP

    Transmission Control Protocol/Internet Protocol.


    UDI – Unified Driver Interface

    This is the series of drivers that allow the Content Base to access all data.


    UDMA – Ultra DMA or Ultra Direct Memory Access

    This is a later version of the system bus mastering DMA protocol, increasing the
    maximum data transfer rate to 33MB/ps.


    UNIX

    An operating system originally developed in 1969 and widely regarded as the first
    operating system that could be modified by anyone. It is non-proprietary, not
    owned by any manufacturer. The Open Group, owns the official UNIX trademark.


    UPS – Uninterruptible Power Supply

    Back-up power used when the electrical connection fails.


    USB – Universal Serial Bus

    A plug-and-play interface between a computer and add-on devices.


    VB – Visual Basic

    A Microsoft programming environment.


    VDM – Virtual DOS Machine

    A DOS session created by Windows NT to emulate a DOS environment.


    VLAN – Virtual LAN or Virtual Local Area Network

    A LAN that uses some other than geographical location to map workstations.


    vtcl – Visual Tcl or Visual Tool Command Language

    See Tcl.


    WBEM – Web-Based Enterprise Management

    A set of management and standard technologies developed by the Distributed Management
    Task Force.'
