  md: '# Linux in the Enterprise


    # PRODUCT STRATEGY


    Over the past year, Novell has made two significant acquisitions to consolidate
    its Linux offerings, Ximian and SUSE. Since it was founded, Ximian had moved rapidly
    to spur industry adoption of the Linux platform and the GNOME desktop. In August
    2000, Ximian helped drive the formation of the GNOME Foundation, which today includes
    industry leaders such as Sun Microsystems, IBM, Red Hat, HP, and SUSE. Novell
    acquired Ximian in August 2003, and made a fundamental component of Novell''s
    Linux strategy.


    On 13 January 2004 Novell completed its acquisition of SUSE LINUX, a combination
    that brought together global support, consulting and training services and industry-leading
    networking and security to Linux, and provides a compelling alternative for companies
    wishing to leverage the many benefits of open source. SUSE LINUX became a premier
    business unit within Novell with its sales and marketing handled by Novell''s
    existing geographic business units and SUSE''s current sales and marketing staff.
    Novell has reinforced the strong SUSE Linux brand.


    In conjunction with the SUSE LINUX deal, Novell introduced a new indemnification
    program for its SUSE LINUX Enterprise Server customers, to provide an additional
    measure of protection against intellectual property challenges to Linux. Novell''s
    indemnification programme is designed for enterprise customers of Linux. Under
    the programme, indemnification is offered for copyright infringement claims made
    by third parties against registered Novell customers who obtain SUSE LINUX Enterprise
    Server Linux 8 and, after 12 January 2004, obtain upgrade protection and a qualifying
    technical support contract from Novell or a participating Novell or SUSE LINUX
    channel partner. Customers must accept the programme terms and conditions including
    caps and other limitations.


    Novell has a number of partners including:


    +   - Dell Computer.

    - EMC Corporation.

    - Fujitsu Siemens.

    - Hewlett-Packard (HP).

    - Computer Associates (CA).

    - IBM.

    - Red Hat.


    # COMPANY PROFILE


    The company began life in 1979 as Novell Data Systems, making computers and disk
    operating systems. In January 1983, it was incorporated as Novell, Inc., to design
    and market software and hardware used for data networks, and introduced NetWare,
    the first LAN software based on file-server technology. By the early 1990s, NetWare
    had been updated to add features for distributed enterprises and let it lead the
    market with a share of almost 70%. Having later focussed on directory-based management
    of customers'' heterogeneous platforms, Novell released NDSirect in 1999 as an
    identity-driven service that offered open standards and interoperability.


    September 2004 Section 9: Novell – Linux Services 171'
