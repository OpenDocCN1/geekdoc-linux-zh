  md: '# Linux in the Enterprise


    Some people still have mixed feelings about the Open Source movement, mainly because
    many distributions, each of which has a slightly different product. In this Report
    we have considered enterprise-class distributions, and therefore the number of
    offerings is drastically reduced. However, Linux is an industry phenomenon because
    of its rapid growth and adoption by enterprise customers as a mainstream tendency.
    This has been driven by the significant support from the software and systems
    community that has made Linux much more relevant to prospective customers. All
    system suppliers seem to have agreed by their actions and de-wards that Novell
    SUSE Linux and Red Hat will become the primary source of the Linux operating environment,
    both for desktops and servers.


    # 8.1 LINUX DISTRIBUTIONS


    # Debian GNU/Linux


    The Debian Project is a worldwide association that produces the Debian distribution.
    Debian GNU/Linux was developed in the spirit of Linux and GNU, and it is a stable
    and complete Linux distribution. Debian began with a small, tightly knit group
    of Free Software hackers, and gradually grew to become a large, well-organised
    community of developers and users. The Debian Project is composed of about 1,000
    developers, each of whom take responsibility for some discrete portion of the
    distribution. These developers are assisted by a community of thousands of end-users
    who provide support to each other. It is an open system, and any user can participate
    and contribute to furthering Debian and its goals. The most active of these users
    can become Debian developers.


    The current release of Debian GNU/Linux is version 3.0, which was released in
    July 2002. Since the beginning of 2002, development has been proceeding on the
    next version of the entire distribution, codename ‘sarge’, which will be released
    as Debian 3.1. Debian GNU/Linux 3.0 offers an alternative to organisations that
    wish to develop their own Linux systems, and avoids the costs of many distributions
    of enterprise Linux. Debian''s Advanced Packaging Tool (APT) enables administrators
    to install and update software easily, and it possesses a user-friendly client
