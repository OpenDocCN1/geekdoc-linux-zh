    # uLinux


    Product Profile - uLinux

    uLinux/Microcontroller project is a port of Linux systems without a Memory Management
    Unit (MMU). It is pronounced as “you-see-Linux”, and its name uLinux comes from
    combining the Greek letter “μ” and the English capital “C”. “μ” stands for “micro”,
    and the C for “controller”. Motorola MC6328, DragonBall Integrated Microprocessor.
    The first target system to be successfully booted by the Palmlet using a TRG SuperPilot
    Board with a custom boot-loader created specifically for the Linux/PalmPort port.


    uLinux is a derivative of the Linux 2.0 kernel for microcontrollers without MMUs.
    The official distribution of uLinux provides the uLinux binaries and source code
    in RPM format to ease installation. There is also a demo version of Linux CAD,
    datasets on components tested with uLinux, and a functional but that includes
    all of the software needed to develop uLinux on a Linux workstation.


    As uLinux was created to support non-MMU processors, multitasking is difficult,
    but as most user applications that run on top of uLinux will not require multitasking,
    this will not normally present a problem. Most of the binaries and source code
    for the kernel have been rewritten to tighten and slim down the size of the base,
    because the uLinux kernel is much smaller than the original Linux 2.0 kernel.
    However, it still retains the main advantages of the Linux operating system, including
    stability, network capability, and excellent file system support. uLinux comes
    equipped with a full TCP/IP stack, as well as support for numerous other networking
    protocols. It is an Internet-ready operating system that is ideal for embedded
    systems.


    uLinux


