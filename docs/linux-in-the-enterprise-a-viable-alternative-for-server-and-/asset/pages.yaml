    # 3.4 INTEROPERABILITY


    The IT environment of the 21st century is heterogeneous. While proprietary, single-processor
    OSs offer the greatest potential for the close integration of hardware and software,
    this homogeneous nirvanic is unlikely to be achieved in any organisation with
    more than one server. Linux does offer an opportunity to reduce the number of
    OSs by an organisation. It is essential, therefore, that a decision on the deployment
    of Linux is made with reference to the other IT environments with which it will
    operate, and the variety of software that may be deployed upon it.


    It is certainly important that as a particular vendor''s strategy there is ongoing
    compatibility. On one level this could be described as ''lock-in'' to a particular
    vendor''s strategy. From a different perspective it can deliver tighter integration
    between OS and architecture, with improved performance and reliability. A value
    proposition for Sun with Solaris on its SPARC servers, IBM with AIX on its iSeries,
    and with HP-UX on PAIRS, has always been the control and performance that proprietary
    standards bring. Linux, on the other hand, coming from an open background; is
    always able to operate on a number of different architectures, and can easily
    exploit the commodity pricing from using industry standards processors.


    Just as the choice of OS is driven mainly by the choice of application, so the
    hardware architecture has been largely driven by the selection of OS. With the
    emergence of Linux, this limitation is diminished. Linux can be deployed on many
    different hardware platforms and can utilise many types of processor. This flexibility
    is a key differentiator for Linux against other OS, being able to run on any processor
    designed for mobile devices right through the large zSystems systems. In addition,
    it is crucial that any OS can operate with other operating environments and control
    the multitude of hardware devices available. Linux utilises open standards, such
    as TCP/IP, HTML, XML, Java, and Web services, to ensure flexibility, ease of integration,
    and portability of applications.


