  md: '# Oracle Linux Products, Services, and Support


    # Abstract


    Oracle has put all its offerings on the Linux platform, uses Linux as its development
    environment, and is migrating all internal systems to Linux. As an early adopter
    it has built a reference architecture across Dell and Red Hat, and the 10g database
    is well positioned to exploit the benefits of Grid computing across Linux servers.
    It can provide a ''one-stop-shop'' for support of both its products and Linux
    operating system, being the only Independent Software Vendor (ISV) to provide
    code-level fixes to the Linux kernel if required. The ''bundled'' concept of software,
    hardware, and operating system, will provide a level of confidence that will be
    attractive to many businesses, as will the opportunity to migrate applications
    from existing proprietary UNIX platforms to a relatively low-cost Intel-based
    architecture. Oracle is well placed to remain as a perceived leader in the area
    of Linux products and services.


    # KEY FINDINGS


    +   * All Oracle products support Linux.

    * Oracle can provide code level patches to Linux Kernel.

    * First-class deployment examples, including Amazon.com.


    +   * Unbreakable Linux'' offering is a ''one-stop-shop'' for support.

    * Oracle/Dell ''bundles'' available.

    * Support only applies to Oracle applications on Linux.


    | Product Strength | Product Weakness | Point of Information


    # LOOK AHEAD


    Oracle committed to Linux at the early adoption phase, and has a solid track record
    of deployments. As a result of the coupling of Oracle 10g with the Grid computing
    paradigm, Oracle is well placed to remain as a perceived leader in the Linux area.


    # FUNCTIONALITY


    Oracle''s Linux commitment began in 1998 with the first commercial database on
    Linux. Today, Oracle is the only software vendor to collaborate with and provide
    code-level support for Red Hat, and Novell/SUSE, and all Oracle products are available
    on Linux.


    In 1998 when Oracle first released its products on Linux, in addition to the proprietary
    UNIX and Microsoft Windows platforms, it recognised that the operating system
    at that stage was not enterprise ready. The distributions were fragmented, with
    varying speed of release, and there was often little backward compatibility, all
    of which stopped the operating system from being credible in a business environment.


    Oracle worked with both Red Hat and SUSE on development of both additional functionality,
    and most importantly, the quality of support processes involving a structured
    release plan.'
