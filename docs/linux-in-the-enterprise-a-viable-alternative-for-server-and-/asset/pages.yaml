  md: '# Linux in the Enterprise


    Debian is provided directly to end-users as well as through a number of channel
    partners. It sees its key competitors as Red Hat, SUSE, and Microsoft. Debian
    says that a single skilled Debian administrator can generally manage 30 servers
    and 500 workstations.


    Debian is rapidly evolving. The organisation provides two major release schedule
    options from which end-users can choose, "stable" and "Sid" release cycles. The
    "stable" release cycle is slow, and upgrades occur approximately every year or
    two. The "Sid" release cycle provides updates on a daily basis, but the administrator
    can choose whether or not to apply those updates. Some administrators choose to
    update every six months, others every other week, and others every day.


    # Debian will continue to integrate features provided by the larger Free Software/Open
    Source communities, as they are made available.


    Debian will continue to integrate features provided by the larger Free Software/Open
    Source communities, as they are made available. It sees the main threats to its
    market share as poor education, and misleading marketing material from its competition.


    # COMPANY PROFILE


    Debian is a community of developers who create the distribution. Debian''s legal
    umbrella, Software in the Public Interest, a not-for-profit corporation is incorporated
    in New York, United States.


    Debian began in 1993 when Ian Murdock wished to create a binary-based distribution
    for GNU/Linux. Prior to this, end-users had been responsible for downloading and
    compiling the source code to Free Software/Open Source manually. Throughout the
    1990s, Debian grew in both size and complexity, and many eight releases. It continues
    to grow and provide end-users with an alternative to high licensing and support
    costs.


    There are approximately 1,000 Debian developers, and up to 10,000 end-users who
    actively participate in the community. Debian is concentrated most heavily in
    the United States, Europe, Australia, and Brazil. Most Debian developers can be
    classed as being in the R&D category, although approximately 34% serve as administrators.
    Debian developers are also responsible for supporting the packages that they maintain,
    and Debian end-users that are active in the community often serve sales and marketing
    functions, as well as providing support to other end-users.


    Debian expects to gain an additional 50 Debian developers in the next 12 months.
    Debian has end-users in educational, commercial, and government usages. While
    Debian does not have numbers of users available, it believes that these can be
    in the millions.


    Debian has had several leaders since its beginning in 1993. Following Ian Murdock,
    Bruce Perens led Debian from April 1996 until December 1997, Ian Jackson followed
    from January 1998 until December 1998, Hermann Ackerman from January 1999 until
    March 2001, Ben Collins from April 2001 until April 2002, Dadle Garlee from April
    2002 until April 2003, and Martin Michlichmay was elected in March 2003 and currently
    leads Debian.'
