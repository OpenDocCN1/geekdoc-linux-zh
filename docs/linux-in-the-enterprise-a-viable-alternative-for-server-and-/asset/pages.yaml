  md: '# 1.1 MANAGEMENT SUMMARY


    # KEY FINDINGS


    +   - It''s time to put feet in the water – Linux is now a credible alternative
    for the core of the data centre, and will be for the client within two years.

    - Freedom of choice – the most important attribute of Linux is the independence
    afforded from the hardware platform.

    - Linux is a cost-effective UNIX replacement, and and worthy competitor to Microsoft
    Windows Server in many areas.

    - Linux on the client is gaining credence, with offerings available from Red Hat,
    IBM, Novell, and Sun.

    - Ignore generalised Cost of Ownership (TCO) evaluations; the TCO of Linux varies
    dependent on an individual organisation''s circumstances.

    - The Linux ecosystem is developing quickly and is a major driver of the adoption
    of Linux, especially for the main enterprise distributions from Red Hat and Novell.

    - The public sector is showing leadership in this area, and beginning to embrace
    Linux and Open Source in a major way.

    - Open Source software tends not to be innovative, but does produce efficiency,
    secure, and robust code.

    - For many already using Windows, it remains the best strategic choice, as does
    proprietary UNIX at the very high end.


    IT management needs to take a long, hard look at their heterogeneous systems infrastructure,
    and put in steps to resolve the escalating costs that are part driven by the number
    of incumbent Operating Systems (OSs) in the environment. Very few IT managers
    ever get to purchase an OS, but it is the provision or development of services
    to meet the business objectives and requirements that is the main driver. Above
    all else, Linux provides is the opportunity to reduce the number of platforms
    supported, by removing the need for close coupling between the OS and specific
    hardware.


    > Above all else, what Linux provides is the opportunity to reduce the number
    of platforms supported, by removing the need for close coupling between the OS
    and specific hardware.


    It seems that in the IT industry and outside that Linux has come from nowhere
    to capture a significant share of the enterprise server market. Those in the vendor
    community hotly dispute the actual figures, as the engagement model for Linux
    makes numbers difficult to determine. However, what may be acknowledged that Linux
    is definitely gaining traction in the enterprise, especially against UNIX derivatives.
    In line more than 15 years Linux has advanced from garage to the core of the enterprise,
    has achieved credibility in the server environment, and is now even beginning
    to threaten Microsoft''s iron grip on the client OS market. The Linux generation
    has grown and, make mistake, the era of Open Source development, with Linux as
    a leading exponent, is a reality.'
