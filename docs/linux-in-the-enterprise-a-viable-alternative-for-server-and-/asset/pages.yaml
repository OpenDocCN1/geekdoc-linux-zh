  md: '# 6.1 MARKET OVERVIEW


    The Linux trade name and copyright is owned by Linus Torvals, effectively covering
    the kernel source code developed and maintained by a small team under the auspices
    of Open Source Development Labs (OSDL) and kernel.org, and supported by many IT
    vendors. Uniquely, when referring to Linux this usually means a distribution from
    which one has taken the kernel software and packaged it with a number of libraries,
    utilities, and applications to make a distribution. ODSL''s data centre and carrier
    grade specifications help to outline the basic requirements and provide consistency
    for a distribution catering for these environments, along with the Linux Standards
    Base (LSB), which provides some guarantee of interoperability between distributions
    certified against it.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_76_0.png)


