  md: '# Mandrakesoft Mandrakelinux


    # Abstract


    Mandrakesoft''s Mandrakelinux products provide a complete enterprise solution
    designed for ease-of-use with intuitive Graphical Interfaces (GUIs), and Wizards
    for configuration to enable rapid deployment. Implementation can be carried out
    with the point-and-click graphical installer, and easy-to-use wizards for configuring
    all the main features.


    Mandrakelin Corporate Server 2.1, Multi Network Firewall and Mandrakustering are
    currently offered with Mandrakelin Corporate Desktop to be released later 2004
    to complete the enterprise portfolio. New Mandrakelin Corporate Server 3.0 is
    also to be released in September 2004 and will provide latest Linux 2.6 features
    and enhancements to the corporate environment. Mandrakesoft targets SMEs and larger
    organisations with its enterprise products, backed up with its Personalised Solutions
    and Maintenance Programme (PSMP) to make it an organisation with whom it is easy
    to do business.


    # KEY FINDINGS


    +   - Mandrakesoft concentrates on making the products easy to use and deploy.

    - The company has a strong enterprise customer in France.


    +   - PSMP provides a cost-effective way to do business.

    - Corporate Server 2.1 is currently based on Linux 2.4 kernel.


    Key: Product Strength Product Weakness Point of Information


    # LOOK AHEAD


    Mandrakesoft has recovered from its financial troubles of 2003, and is concentrating
    on the development of new and updated products. Through its concentration on ease-deployment
    and being a good business partner, it is ideally positioned to consolidate its
    position in the enterprise Linux space.


    # FUNCTIONALITY


    Mandrakesoft offers businesses a set of GNU Linux and Open-Source software and
    related services. The products for the enterprise include Mandrakelinux Corporate
    Server 2.1, Multi Network Firewall, and Mandrakustering.


    # Mandrakelinux Corporate Server 2.1


    Mandrak Corporate Server 2.1 is a server solution for AMD OPTERON or x86 architectures
    that is suitable for medium and large organisations. Mandrakesoft says that it
    is a versatile solution that provides enterprises with critical business server
    functions, with the company’ “user friendly” touch. The product is available on
    a subscription basis that includes support and direct access to software updates.
    The Standard support option is valid for five incidents within a one-year period,
    and the unlimited option is valid for unlimited incidents during a year.'
