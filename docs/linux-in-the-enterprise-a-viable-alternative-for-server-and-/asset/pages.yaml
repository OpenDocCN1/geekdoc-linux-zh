  md: "# Linux the Enterprise\n\nDMA - Direct Memory Access\nThe transfer of data\
    \ from memory to memory without using the CPU.\n\nEISA\nA standard computer connection\
    \ that extends the Industry Standard Architecture (ISA) standard to a 32-bit interface.\n\
    \next2 - Second Extended Filesystem or Extended Filesystem Version 2\nLinux code\
    \ to improve the speed of the file system on a computer.\n\nFAT - File Allocation\
    \ Table\nThe FAT file system is a simple file system, which is a table that resides\
    \ at the top of the volume.\n\nFC-AL - Fibre Channel-Arbitrated Loop\nAn internal\
    \ disk array to achieve faster throughput and performance.\n\nFC-SW 2 - Fibre\
    \ Channel Switch Fabric (FC-SW-2)\nDeveloped under the National Committee for\
    \ Information Technology Standards (NCITS), it is a standard that aims to allow\
    \ customers to leverage differences against each other.\n\nFIPS-151 – Federal\
    \ Information Processing Standards 151\nThis is now version 2 and is part of the\
    \ Portable Operating System Interface (POSIX) standard. Back in the early mid-1990s\
    \ it defined the C programming language interface to an operating system environment.\n\
    \nFTP - File Transfer Protocol\nA standard internet protocol and the most straightforward\
    \ way of transferring files between computers across the Internet.\n\nGlobus\n\
    The Globus Project is a research and development initiative to create the tools\
    \ for grid computing. (www.globus.org)\n\nGNOME - GNU Network Object Model Environment\n\
    \ Open Source GUI and desktop applications for Linux operating systems.\n\nGNU\n\
    \ Open Source operating system similar to UNIX distributed by the Free Software\
    \ Foundation.\n\nGPL\nGNU Public Licence.\n\nGrid\nGrid computing is using the\
    \ resources of many computers in a single problem at the same time, usually very\
    \ large projects with vast amounts of data. Grid services will build on this to\
    \ create environments where resources such as computational, power, and applications,\
    \ can be shared.\n\nGUI - Graphical User Interface\nA screen-based user interface\
    \ includes icons, pull-down menus, and a mouse.\n\nHBA - Hot Bus Adapter\nHardware\
    \ that provides an interface between the host microprocessor and the disk controller.\n\
    \nHPFS - High Performance File System\nA file system first introduced with IBM’s\
    \ OS/2.1 to allow for greater access to the larger hard drives appearing on the\
    \ market (improving upon the FAT file system).\n\nHTTP - HyperText Transfer Protocol\n\
    A protocol for exchanging files over the Web. Files are requested from an HTTP\
    \ server using a Uniform Resource Locator, and are sent to the HTTP client, which\
    \ is typically a Web browser as Internet Explorer."
