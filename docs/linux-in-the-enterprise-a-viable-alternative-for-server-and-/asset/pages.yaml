- img_proc: true
  md: '# Linux in the Enterprise


    Debian is a one-size-fits-all GNU/Linux distribution. It has been designed from
    the ground up to be applicable to ranges of computing needs. These include the
    128-way supercomputer right down to the consumer PDA. The Debian distribution
    comprises approximately 10,000 components, which can be added or removed as required
    by the user. The dependencies between components are tracked and satisfied automatically.
    Debian''s users deploy it in servers, clients, PDAs, embedded applications, and
    in many other situations that the Debian organisation is not aware of.


    Debian GNU/Linux is a different type of Linux. Unlike other distributions, it
    is not developed by one individual or group. Debian developed openly in the spirit
    of Linux and GNU, and the primary purpose of the Debian project is to create a
    distribution that lives up to the Linux name. The project says carefully and conscientious
    put together and will be maintained and supported with similar care. It is an
    attempt to create a non-commercial distribution that can effectively compete in
    the commercial market. Debian GNU/Linux is a particular distribution of the Linux
    operating system, and numerous packages that run on it.


    # Debian developed openly in the spirit of Linux and GNU, and the primary purpose
    of the Debian project is to create a distribution that lives up to the Linux name.


    As a GNU/Linux distribution, Debian says that its strengths are not in the software
    itself as almost every GNU/Linux distribution has the same pool of software to
    draw upon. Its strength is drawn from the organisation behind the distribution,
    and also how the software is presented to the end-user. Its primary attraction
    to end-users is the community and organisation behind it.


    The Debian Project is composed of a thousand worldwide developers, who take responsibility
    for some discrete portion of the distribution. Surrounding these developers is
    a community of thousands of end-users who provide support to each other. It is
    an open system, and any user can participate and contribute to furthering Debian
    and its goals. The most active of these users become Debian developers.


    Debian claims that on the software integration front, its package management system
    is extremely strong, due to the high quality of the packages maintains. Its packages
    undergo rigorous audits and quality assurance procedures, and most Debian developers
    maintain only a few packages so that they can concentrate their efforts. As a
    result, Debian has a large pre-packaged software archive with over 10,000 software
    projects packaged and available to users.


    It also says that it supports the widest variety of hardware of any GNU/Linux
    distribution, with official support for eleven hardware architectures. So end-users
    can be confident that they can buy a general-purpose computer Debian can be installed
    on.


    As it is a generalised solution, Debian users are responsible for the performance
    and scalability of solutions, which are mainly in the realm of the Linux kernel.
    It provides a number of various high-availability technologies, from which the
    end-user can choose. The most common high-availability technologies used by Debian
    are Virtual Router Redundancy Protocol Daemon (VRRP), heartbeat that is part of
    the "High-Availability Linux", and the Linux Virtual Server project (ivps).


    For manageability and usability, Debian offers a number of solutions to meet end-user
    needs. As it is a GNU/Linux distribution, the method for management is the extremely
    flexible and reliable shell interface, typically accessed through the Shell protocol.
    The system is a tried and tested proven management interface.'
