  md: '# Linux in the Enterprise


    With large numbers of systems, and potentially distributed deployments of servers,
    management of registrations, allocating appropriate rights, and more importantly,
    removal of rights when necessary, becomes increasingly complex, time-consuming,
    and expensive. To address this, the concept of a single directory, holding details
    of all users, their access rights to information and resources, has been developed.
    The directory in this context is an application and database, which identifies
    whether something is located on the network. On TCP/IP networks the directory
    system is the Domain Name System (DNS).


    The de facto standard in directories is compliance with the Lightweight Directory
    Access Protocol (LDAP). LDAP enables the location of individuals, groups, organisations,
    and devices on a network. Effectively a LDAP directory is a database of organisation''s
    resources. It is organised as a hierarchy and normally regulates the organisational
    structure. From the Root directory there are branches to countries, from which
    there are branches to organisations, and finally to individuals, files, or devices
    as printers.


    LDAP directories can be distributed across servers, using replication and synchronisation.
    This can ensure that if for some reason a copy corrupted it can perform ''self-healing''.
    Entries in directories can also include membership of groups (for example, a project
    team) that span the hierarchy, providing a high degree of granularity in the access
    to, thus security,


    # Linux provides support for directory services and LDAP.


    Where OSs and applications work with a LDAP-compliant or other directory, administration
    can be highly simplified. In addition to the obvious reduction in overheads, control
    of security is greatly increased. Linux provides support for directory services
    and LDAP.


    # Software Support


    The first thoughts on support are ''Who does one turn when things go wrong?''
    It should be expected that Linux has a range of support methods and processes.
    In many organisations faced with the twins of global deployment, and global presence
    through the Internet, it is essential that these support methods can be accessed
    on a 24x7 and global basis. In these circumstances, a vendor with an existing
    global network is preferable to one without. Similarly, on a more local scale,
    the support needs to be available and responsive within the organisation''s operating
    day.


    Support is also period, and at the time of installation and deployment, as Linux
    is effectively a base technology for the IT infrastructure, it''s foundation like
    the foundations of a building, needs to be planned to provide the base for the
    applications that are placed upon it.


    Professional staff of the vendors, consultancies, and Systems Integrators (SIs),
    can all provide these services, normally in partnership with the organisation''s
    it staff. IT Managers and Chief Information Officers (CIOs) need to establish
    out the support requirements of their organisations, and the risks and threats
    that will affect the demands on the server environment. Support contracts will
    always be a compromise between risk and cost. CIOs need to identify Service Level
    Agreements (SLAs) required, and to be aware of limitations in support that can
    be provided under any contract.


    As Linux is Open Source Software (OSS) and has distributions rather than one,
    the IT Manager is immediately faced with a dilemma regarding the issue of who
    to call if there is a problem. The increasing adoption rate of Linux in the enterprise
    environment is part of increased confidence owing to the availability of widespread
    support. Of the distributions, Red Hat and Novelle have established regimes that
    will provide organisations with support contracts and services similar to those
    offered by the vendors of proprietary OSS. They have relationships with SIs and
    consultants.'
