  md: 'Another worrying threat to Linux and the use of Open Source is the increasing
    possibility that the patent protection rules will be tightened. The various Open
    Source communities are becoming increasingly concerned about EU Software Patent
    Legislation. The Committee of Permanent Representatives (COREPER) of EU members
    in Brussels provisionally agreed on a new draft for the controversial Software
    Patent directive.


    This latest draft rejects all of the European Parliament''s limiting amendments,
    and is described as "the most uncompromisingly pro-patent text yet" by the Foundation
    for a Free Infrastructure Infrastructure (FFII). This is a non-profit association
    registered in Munich, which is dedicated to the state of data processing literacy.


    The text from the COREPER committee goes further than the European Commission
    text, which was published in 2002. At that time, it is uncertain whether the EU
    law on software patents will be implemented, but due to disagreements between
    officials and ministers to the value of the new text.


    If the proposal is adopted it will extend software patents to every item of software,
    including computer programs, data structures, and process descriptions. It is
    alleged that this will stifle innovation and directly harm most software companies
    and all Open Source projects that are unable to pay licensing costs, allowing
    proprietary interests to take the public domain.


    # 2.5 COST OF OWNERSHIP


    There has been an expectation that the lack of a licence fee for Linux should
    drive down the cost of ownership, and to limited extent this is true. However,
    this is possibly a simplistic view and always things are more complicated, as
    the studies have indicated by their varying conclusions drawn from a multitude
    of variables. The problem is similar to answering the question "how long is a
    piece of string?— there is no right or wrong answer.


    To begin with, each OS is designed and developed differently, but other factors
    should be considered including the marketing channels, and of crucial importance
    are the applications available for the OS. All these and other elements combined
    with the unique characteristics of the organisation''s infrastructure and make-up-of
    skilled resources impact on the cost of the operation.


    Not surprisingly, it is possible to produce theoretical studies that weight the
    various components to reach the results which favour each OS. It is undoubt to
    provide a Total Cost of Ownership (TCO) study that is valid for all situations.
    In some scenarios Linux will provide a lower TCO, while it is quite possible for
    Windows to be more efficient.


    > While cost is undoubtedly a major component of the decision, an often overlooked
    benefit of Linux, and of more importance, is the flexibility of Linux to run on
    various hardware platforms.


    While cost is undoubtedly a major component of the decision, an often overlooked
