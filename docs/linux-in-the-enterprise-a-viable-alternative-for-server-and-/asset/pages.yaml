    # 5.4 MIGRATING TO LINUX


    # Why Linux?


    Linux is a disruptive technology with associated migration costs. It can, however,
    bring significant advantages in the longer term that can make it worth persever
    to achieve a sustaining technology status within the organisation. The pain of
    change has been substantially reduced with the provision of numerous tools, training,
    and methodologies designed to mitigate both the cost and cultural aspects of the
    move to Linux


    While not to go over ground already covered it is important to reiterate that
    when talking about Linux – Free means FREE rather than no cost. The independence
    of the OS from the underlying hardware gives the IT manager flexibility to choose
    the best value platform on which to run the IT services, and the ability to use
    commodity X86 components. In addition, support for the OS no longer has to be
    purchased from one vendor, giving rise to healthy competition that must put down
    pressure on the cost.


    > Even for the most risk averse organisations

    Linux can be looked upon as an OS for

    running critical applications.


    Notwithstanding Microsoft’s and protests to the contrary that this flexibility
    must have a beneficial impact on the TCO, even if individual circumstances result
    in negligible cost differential, these freedoms mean that Linux is an option that
    must be seriously considered for inclusion in an organisation’s infrastructure
    strategy. For the most risk averse organisations Linux can be looked upon as an
    OS for running applications.


    # Which Distribution?


    With all distributions based on the same kernel, at a first glance the choice
    would seem extensive, with each distribution being optimised for a set of users,
    containing a different selection of utilities and installation procedures. However,
    on closer inspection there are only a handful of distributions suitable for use
    in the enterprise, and only two which merit serious consideration at present.
    The global support from ISVs and vendors for Red Hat and Novell SUSE enterprise
    distributions means they are the only feasible options for the data centre. However,
    in the desktop environment other than these two are possibilities if considering
    an Open Source client software stack, including solutions from Linspire, Debian,
    Mandrakesoft, and Sun Microsystems.'
