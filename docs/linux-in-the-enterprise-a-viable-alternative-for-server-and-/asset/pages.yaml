    # SUMMARY


    When enterprises are considering a move to Linux, they are looking for a business
    partner who will provide them with the confidence to make step into the unknown.
    Over the past year, Novell has concentrated on developing its Linux strategy through
    the acquisition of Xianian and SUSE. It has a global reach that only a few of
    its competitors can match, and it also has a strong and loyal customer base.


    Linux offers Novell the opportunity to integrate its product offerings such as
    its file, print, and directory applications into an expanding application server
    platform. This growing range of services and solutions should ensure that Novell
    is well worth considering by organisations moving to a Linux platform.'
