  md: '# Sun Microsystems Linux Services


    # Abstract


    Sun Microsystems supplies educational, consulting, and integration support services
    for Red Hat Linux and SUSE Linux Enterprise Server platforms. The company is one
    of the largest contributors of intellectual property to the open source community
    and continues to expand its participation. It provides one-stop Linux support
    by whilst its comprehensive global infrastructure. Organisations that seek an
    experienced global supplier to provide services and support, both centrally and
    locally, for their Linux platforms will see Sun as an ideal partner. Recently,
    however, mixed messages have emanated from the company regarding Linux and its
    Linux partners, and potential customers may require Sun to clarify its future
    strategy.


    # KEY FINDINGS


    +   - Sun''s experience with Solaris gives it an edge in providing Linux support.

    - Although Sun has worked closely with its partners it has recently criticised
    Red Hat.

    - Global enterprises can be supported with local language capability.

    - The company is a major contributor to the Open Source community.


    Key: Product Strength Product Weakness Point of Information


    # LOOK AHEAD


    On the face of it, Sun seems to be in the process of changing its attitude to
    Linux. This could be due to developments of Solaris UNIX products already announced
    and in the pipeline. However, Sun says that it is to release Solaris to the open
    source community, and only time will tell whether the company continues its dual
    commitment to both UNIX and Linux.


    # FUNCTIONALITY


    Sun Microsystems provides its customers with the freedom to choose the solution
    that best meets their business needs. It brings a comprehensive solution to Linux
    approach through:


    +   - Provision of Java technology support, including Java Desktop System and
    Java Enterprise System.

    - x86-based hardware.

    - Support services for Red Hat Enterprise Linux and SUSE Linux Enterprise Server,
    with Sun''s Java Enterprise System. These include educational services for these
    platforms and related consulting and integration services.

    - Supplying everything that the Linux customer needs.'
