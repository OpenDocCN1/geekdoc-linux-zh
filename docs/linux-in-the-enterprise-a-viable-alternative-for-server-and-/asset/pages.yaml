    # Racpace Managed Hosting


    Racpace Managed Hosting (Racpace) was founded in 1998, and has its headquarters
    in San Antonio, Texas, US. It has 400 people located in three data centers in
    the US and in the UK. From its base in Ux, Nikon, London, it provides managed
    hosting services to a wide range of organisations including: Microsoft, Nikon,
    Renault, and the top of 4 consultancy firms.


    The company offers customers either Linux, or Microsoft Server platforms for deployment,
    with a range of options including Redundant Array of Independent Disks (RAID),
    guaranteed internet bandwidth, and back-up files. For its customers running Linux,
    there are three service level options with respective price tags:


    +   1. Dedicated – single server, running Linux, a control panel, and no firewall.

    2. Managed – multiple servers and a firewall.

    3. Enterprise – more servers and load balancing.


    Since 2000, Racpace has seen Compound Annual Growth Rate (CAGR) of 53%. As a dedicated
    hosting company, it cannot regard hosting as an add-service or loss leader. It
    has to provide a better and more cost-effective service for its customers as they
    could provide themselves, or contract another organisation to do. Thus all its
    systems, and processes are built for delivering the most efficient and cost-managed
    hosting available.


    It is a mid-market player, and is not intending to compete in the low-market arena.
    It will, offer short-term contracts, the minimum being for 30 days. Racpace''s
    managed hosting services however offer the technical components of another service
    company''s business offering. At the upper end of its services is to support the
    development of large-scale data farms with a couple of customers.


    Racpace originally provided hosting exclusively on Linux servers running Red Hat,
    but responding to its customers by expanding to support Microsoft Windows Server
    (2000 and 2003), and a small number of instances running FreeBSD, and the Debian
    distribution of Linux.


    To deliver its services Racpace has four strategic partners: Red Hat, Dell, and
    Cisco. The Linux distributor, Red Hat, is an investor in Racpace, and Racpace
    has the largest number of servers running Red Hat in the world, along with the
    only Advanced Hosting Partner in Europe. The closeness of the relationship is
    shaped by the fact that Racpace was the first hosting company to offer Red Hat
    Enterprise Server. Because of close relationship with both Microsoft and Red Hat,
    Racpace will receive ‘bug fixes’


    All four Racpace sites are staffed on a 24x7 to provide support for its customers.
    In the US this is a fixed shift system, in the UK on a rotating basis. The company
    offers its customers a one-hour guarantee, as it has found this much cost effective
    for customers than building redundancy into what it hosts. To support this, Racpace
    carries all of its own spaces.'
