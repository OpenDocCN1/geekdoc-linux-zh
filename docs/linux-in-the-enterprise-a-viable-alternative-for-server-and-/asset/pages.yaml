    complexity of the deployment. For simple file and print serving, the start-up
    time can be less than a week. For complex database environments, the planning,
    deployment, and validation time can be months.


    Red Hat Enterprise Linux is frequently deployed in heterogeneous environments
    where several operating systems are used simultaneously. Linux systems are able
    to exchange data with UNIX and Windows systems quite easily and therefore be deployed
    modularly. The resource overhead for ongoing maintenance is similar to that for
