    +   - Red Hat Enterprise Linux AS that supports high-end and business-critical
    systems, and is available with the highest levels of support.

    - Red Hat Enterprise Linux ES is aimed at mid-to-range systems.

    - Red Hat Enterprise Linux WS is for all technical workstation and single unit
    desktop/client needs.

    - Red Hat Desktop is the newest member of the Red Hat Enterprise Linux family.
    It provides a high-quality, full-featured client system that is suitable for use
    in a wide range of desktop deployments.'
