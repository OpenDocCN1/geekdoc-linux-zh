    # 3.5 MANAGEMENT


    The true test of the effectiveness of any computer system is not the processor
    power, memory size, or other hardware-related functionality, but the ability to
    manage and administer resources, including the delegation of responsibilities,
    effectively across the organisation. Research has shown that management and support
    costs nearly half the true cost of system management. Unless there are appropriate
    tools for the control of the environment, deployment of any system presents a
    business risk and will not deliver the required benefits.


    Linux and its multiple components and features needs to be managed, both to ensure
    the most effective use of the resources, and to ensure the security and integrity
    of the data. For the OS, this is ideally via an integrated systems management
    tool, as this should provide the greatest control. The mature operating systems
    provide a wealth of management functionality that Linux has yet to match.


    > Linux has limitations on its ability to manage other OSs, and this is an area
    where third party, OS-agnostic tools can play an important role.


    In a computing environment with a large number of servers there is obviously an
    administrative advantage in managing multiple systems from a single console. If
    this ability is provided as part of the systems management interface for a server,
    then there can be considerable economies of scale in management and a reduction
    in the TCO of the systems. Linux has limitations on its ability to manage other
    OSs, and this is an area where third party, OS-agnostic tools can play an important
    role. Several vendors, including BMC Computer Associates, HP, and IBM, provide
    system management tools that can be used across a number of heterogeneous servers
    and can be a roadmap to enable this.


    # Storage Management


    Inclusion of a system configuration and monitoring tool, accessible from within
    the systems management tool, along with integrated OpenDataBase Connectivity (ODBC)
    and JavaDataBase Connectivity (JDBC), will again reduce the Total Cost of Ownership
    (TCO) of an OS and should improve the relative performance of the storage systems.
    These features are more likely to be available for a proprietary storage mechanism
    or the market-leading solutions.


