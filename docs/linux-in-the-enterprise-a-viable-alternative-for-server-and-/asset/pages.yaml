  md: '# Linux the Enterprise


    # Microsoft Windows


    Linux is by no means the only strategic option going forward. Microsoft Windows,
    while not giving the complete hardware independence offered by Linux, does utilise
    commodity x86 hardware, which is becoming increasingly able to handle high-end
    processing requirements through clustering and the use of multiple processors.
    There are numerous studies available in Windows outperforms Linux in terms of
    TCO, performance, and vulnerabilities, as there are other research papers that
    identify the opposite. It is clear that the combination of Microsoft Windows XP
    and Microsoft Windows Server 2003 provides an IT platform which is very persuasive
    for the enterprise user, especially with the addition of new features that have
    improved security, reliability, availability, and scalability.


    > What is clear that the combination of Microsoft Windows XP and Microsoft Windows
    Server 2003 provides an IT platform which is very persuasive for the enterprise
    user.


    Where Windows remains a leader in the totality of software stack, available functionality,
    and integration, especially in the desktop environment. The .NET architecture
    provides further evidence as to the power that organisations can derive from the
    platform, along with the integrated developers who can assist with the speedy
    development of new services.


    Interoperability is of paramount importance, especially in today''s heterogeneous
    environments. Instead of migrating to Linux an alternative is to make UNIX and
    Windows seamlessly share information. This can be achieved with Microsoft Windows
    Services for UNIX (SFU) that enables Windows- and UNIX-based systems to share
    data, security credentials, and scripts.


    For those organisations that reconcile themselves with being locked into one vendor
    for the majority of the software stack then Microsoft is a valid option. The emergence
    of Linux has done to provide an alternative and while not over the next five years.
    This flexibility offers a flexible strategy that many will want to adopt over.
    This flexibility has a downside in that integration will never be as tight as
    in the Windows environment, but with the emergence of XML and Windows services
    this is probably not as important as it has been in the past.


    The discontinuation of Windows NT support is being brought into renewed future
    OS strategy. With Longhorn on the horizon, Microsoft''s next OS version, which
    could require a significant migration effort and more powerful hardware, is another
    significant trigger point looming, organisations will have to choose whether to
    continue with Microsoft Windows or look seriously at Linux as an alternative.
    There are, however, many occasions where Windows will remain, or, the best solution.


    # Migration Strategy


    In most instances migration is driven by hardware change, application replacement,
    or amendments to software licensing. It would be better if the move was more proactive
    as part of a wider planned technology strategy. The migration to Linux is no different
    in concept than that, for example, moving from Windows NT to Windows 2003, or
    a significant version upgrade. It is very unusual that an OS is chosen on its,
    and it is usually part of a wider plan for the deployment of new services or IT
    optimization. As with any IT project, planning is key to a successful deployment
    of a new OS, along with the building of a multi-skilled team, training, and management
    backing.'
