  md: '# Linux in the Enterprise


    # Availability


    The availability of a service can be determined by how many ''nines of availability''
    it offers. One nine of availability equates to 90% of uptime, while two nines
    of availability means it is accessible 99% of the time, and so on. Converting
    the ''number of nines'' into the amount of downtime permitted per year produces
    the following:


    | No. of Nines | Availability | Downtime/Year |

    |---|---|---|n| 1 | 90.0000% | 37 days |

    | 2 | 99.0000% | 3.7 days |

    | 3 | 99.9000% | 8.8 hours |

    | 4 | 99.9900% | 53 minutes |

    | 5 | 99.9990% | 5.3 minutes |

    | 6 | 99.9999% | 32 seconds |


    Obviously the more nines of availability required the more expensive the system
    becomes, as single points of failure are minimised with redundancy of resources.
    Using Linux clustering, with enterprise standard hardware and software, can provide
    high availability at a fraction of the cost, which was only obtained from proprietary
    equipment.


    Clustering is a technique often used to improve availability, and to meet the
    requirements for load balancing, replication, failover, and redundancy. It consists
    of a group of two or more servers working together, sometimes referred to as a
    node, which is as a single virtual server by an application or the network. In
    the event of failure it enables another server to take over the tasks of the problem
    hardware. In a HA cluster individual nodes can take over from others if and required.
    Whilst a cluster allows both the OS and application to recognise it as a single
    virtual server, it may be appropriate for security or management reasons to run
    multiple instances of an application on a cluster.


    # The Linux High Availability (Linux-HA) community development project provides
    a clustering solution for Linux.


    The Linux High Availability (Linux-HA) community development project provides
    a clustering solution for Linux. The HA project is widely used, with a few thousand
    installations in production. Heartbeat is available as part of SUSE LINUX, Mandelrake,
    and Debian distributions. The Red Hat Cluster Suite is provided as a Red Hat applications
    family product and is designed for use with Red Enterprise Linux systems.


    There are numerous availability features that can be found in a Linux distribution
    using various source and proprietary utilities, either as part of the distribution,
    or as third-party add-ons. Redundant Array of Independent Disks (RAID) and power
    management features are key technologies within the availability context. Other
    functionality includes:


    +   * ''Hot swapping'' (the ability to add or remove on-line): Processors, Memory,
    I/O adapters, and hard disks.

    * Having alternate kernel installations available.

    * The ability to undertake dynamic kernel patching.'
