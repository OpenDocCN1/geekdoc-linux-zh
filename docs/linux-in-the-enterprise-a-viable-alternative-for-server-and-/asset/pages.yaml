    This collection of additional software, including hardware drivers, file systems,
    kernel improvements, and in many cases relevant Open Source applications, enables
    each to tailor the distribution to meet specific requirements of the target market.
    For example, Red Hat and SUSE LINUX produce a distribution for the enterprise,
    which includes additional utilities and tuning particularly focused on the performance
    and reliability needs. Other distributions are available which concentrate on
    the desktop, embedded, and supercomputing markets.


    > Linux is very much a global phenomenon, with adoption growing strongly in the
