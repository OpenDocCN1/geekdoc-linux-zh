  md: '# Linux in the Enterprise


    # 1. Virtual Private Network (VPN)


    A VPN offers a secure tunnel across private and public networks to access resources
    and for the transfer of information. Users need to authenticate to the VPN before
    they are allowed access to it. The VPN encrypts the data passing through it, protecting
    the data from unauthorised access.


    # 2. Intrusion Detection


    Intrusion Detection Systems (IDS) provide a defence against unauthorised access
    by monitoring and analysing traffic and alerting when suspicious activity is.
    Sort is an Open Source intrusion detection system that performs real-time analysis
    and packet logging on IP networks. It carries out protocol analysis, content searching/matching,
    detecting the variety of attacks and probes, including buffer overflows, port
    scans, Common Gateway Interface (CGI) attacks, network probes, and OS fingerprinting.


    # 3. Firewalls


    A firewall limits access between two or more secure domains within a network,
    normally described as trusted and untrusted. For a simple example, the organisation''s
    Internet, which is accessed by those authorised by the organisation, could be
    considered as trusted, and the Internet as untrusted. Firewalls can pass or limit
    data and whilst simple in operation they need to be very fast to ensure network
    performance. Many network managers like the idea of a firewall on a separate PC
    or server to create a clear separation between trusted and untrusted domains.


    # 4. Encryption Services


    The method of passed data using an algorithm is considered confidential. This
    is a business confidential, such as credit card numbers or users'' personal details,
    or operationally if in usernames and passwords. Where there is a direct connection
    between server and user, as in the case of a dummy terminal, there is little risk,
    but soon as the data is passed into a network, with the direct connection, there
    is the possibility of interception, copying, damage, or loss of the data.

    Encryption ''scrambles'' the data using an algorithm so that the algorithm is
    reversed and the data can be read by the intended recipient, user, server, or
    application. De facto standard for encryption TCP/IP networks, which includes
    the Internet, is Secure Socket Layer (SSL). Versions of SSL are referred to the
    level of complexity of the algorithm used to encrypt the data. 128-bit encryption
    is now the norm for transactions over the Internet. OpenSSL is an Open Source
    providing functionality.


    # 5. Virus Protection


    The highest headache for IT Managers is the malicious, self-replicating program
    known as a virus. Whilst the majority of computer viruses have been written to
    exploit holes in Microsoft software, predominantly through the use of macros,
    UNIX and Linux viruses are increasingly evident. There are numerous third-party
    software packages available, which can operate on the desktop or server level;
    and protect Linux systems. Although Linux systems have yet to be a major target
    for hackers, because of the fewer deployed, have been a number of releases recently
    that can crash the Linux kernel.


    # Security Compliance


    The widely respected international standards for security compliance are those
    of the US Department of Defence (DoD). The DoD has defined four security levels
    of computer security, A, B, C, and D, where D is minimal security and A the highest
    level. C has discretionary protection through auditing, and is divided into C1
    and C2. Each has unique sensitivity levels, B being divided into B1, B2, and B3.
    Certification of an OS to a level, B, or A; gives a level of confidence to IT
    managers. The fact is, however, the security level can only be achieved if the
    OS is installed correctly, all updates are patched, and there is active management
    of the security based upon policies.


    General Linux distributions meet the same certification levels as Microsoft Windows
    and UNIX versions. The Linux Security Module (LSM) included in the Linux kernel
    allows for the addition of security extensions to the standard Linux kernel. Higher
    levels referred to security and Discretionary Access Control (DAC) can be achieved
    by integrating modules into the kernel developed by the SELinux project.'
