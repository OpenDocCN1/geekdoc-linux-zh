  md: '# Linux in the Enterprise


    System resilience is of paramount importance. Any unscheduled or planned downtime
    can cause considerable disruption to an organisation''s day-to-day operations.
    The integral fault tolerance and error checking features found in the ZSeries
    platform can help minimise downtime and support disaster recovery. The system
    identifying trouble spots and takes the necessary action to prevent by moving
    tasks away from failing components, minimising the impact on end-user service
    levels. It is possible to recover the problem parts while the processor is still
    active, enabling the service to continue uninterrupted.


    Today''s Internet-based environment introduces a number of security challenges,
    including the protection of services, networks, and resources. The ZSeries represents
    many years of investment in this area, incorporating many security features designed
    to enable transactions and private, such as enhanced cryptography support and
    high-speed connections like HyperSockets. Security is improved by reducing the
    need for an external network, along with the lowering of costs and complexity.


    Another strong suit of the ZSeries systems has evolved over many years into a
    comprehensive suite of administration tools, enhanced to include self-managing
    features. When Linux is used in conjunction with zOS it enables the use of z/OS
    Workload Manager, which provides the logical partition Linux runs in. It is possible
    to be prepared for the inevitable spikes in demand by utilising the Intelligent
    Resource Manager (IRM) to dynamically balance the computing resources with workloads.


    Apart from IBM, there are a number of third-party software suppliers, such as
    CA, that can provide additional functionality to further assist and the use of
    Linux in the mainframe environment. CA''s management software focuses end-to-end
    mainframe solutions encompassing enterprise management, security, storage, portal,
    business intelligence, application development and lifecycle management, and data
    management.


    IBM Managed Services provides Linux services, enabling the consolidation of distributed
    workloads over ZSeries servers running Linux without the need for up-front investment
    in physical hardware. The solution is supplied as utility, where payment is for
    the processing, storage, and network resources consumed. It is possible to easily
    add more capacity to cater for peaks, growth, or in demand.


    While there are undoubt benefits from using Linux on ZSeries, it is probably the
    larger enterprises with existing investments in mainframe technology and skills
    that are in the best position to maximise the advantages. Having said that, for
    IT departments with a large number of smaller servers and fluctuating demand flexibility
    is compelling, especially when the use of IBM''s Virtual based based Linux on
    the ZSeries is desired. On the downside, while the industry long agreed that there
    is no such as a free lunch with Linux deployments, the cost of support for ZSeries
    distributions can be quite expensive in comparison to other platforms.


    There are many examples of existing mainframe users using Linux on the mainframe.
    This includes Banca Cari, one of Italy''s oldest banks, with international offices
    in Frankfurt, London, Madrid, New York, and Paris, and employing around 4000 people
    worldwide. To meet its requirements for openness and resilience, Banca Cari uses
    a ZSeries solution running both z/OS and Linux. This combination enables the bank
    to preserve its investment in existing legacy systems, while taking advantage
    of open systems to allow new services to be developed.


    Linux on ZSeries is capable of providing a Linux environment that can drive down
    IT costs in the enterprise. The combination of Linux and the ZSeries can enable
    scalability from a few, to hundreds of Linux workspaces using the one machine,
    network connections, and software, reducing the need for large server farms, complex
    systems, and miles of cabling. This helps to transform the infrastructure into
    a utility operating environment, providing the freedom of choice in software,
    and continue the maintainframe relevance into the future.'
