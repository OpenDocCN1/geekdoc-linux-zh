  md: '# 2.1 REPORT STRUCTURE


    In recognition of the fact that this Report will be read by a wide range of senior
    management personnel, each with different areas of interest and expertise, the
    Report has been structured to separate-out the elements and issues to as great
    an extent as possible. The aim is to make each section freestanding as practically
    achievable. However, we recommend that the whole Report is needed to give the
    complete picture.


    A brief summary of each section of the Report is included below in order to help
    direct the reader to particular areas of interest.


    # Section Two – Introduction


    Following the Management Summary, the Introduction sets the scene, giving an overview
    of the considerations, concepts, and business benefits of Linux in the Enterprise.


    # Section Three – Technology Features


    This section describes the main features, standards, and technologies appropriate
    when using Linux in the Enterprise.


    # Section Four – Architectures and Models


    This part of the Report takes a closer look at the architectures pertinent to
    the adoption of Linux in the Enterprise.


    # Section Five – Deployment


    This section uncovers the issues and advantages of Linux in the Enterprise, along
    with why the Operating System (OS) is relevant to the public sector and Small
    to Medium-sized Enterprises (SMEs). Assistance and advice is also provided for
    the migration to Linux.


    # Section Six – Market Analysis


    This section gives an overview of the market, providing an examination of the
    drivers, along with an investigation of the future direction, and includes a review
    of the approach adopted by a selection of businesses that have deployed Linux
    in the Enterprise.


    # Section Seven – Tables


    This section first presents Butler Group’s Features Matrix, which allows the selected
    Linux distributions to be seen-by-side in terms of features and capabilities.
    A number of supplementary tables are also included in this section.


    # Section Eight – Comparisons


    This section includes comparisons of the vendors and services featured in this
    Report.


    # Section Nine – Technology Audits


    This section contains in-depth Technology Audits for the vendors and solutions
    reviewed in this Report.


    # Section Ten – Vendor Profiles


    This section contains brief profiles of a number of relevant vendors and technologies
    not covered by a Technology Audit.'
