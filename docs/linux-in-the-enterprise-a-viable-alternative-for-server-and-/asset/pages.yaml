  md: '# Linux in the Enterprise


    www.butlergroup.com


    # Processors


    The hardware architectures of computer systems are related to the respective processors
    used. Processors, often referred to as ''chips'', are the physical engine of the
    computer, performing the operations, logic, and arithmetic to run programs. There
    are three principal types of processors: Complex Instruction Set Computer (CISC)
    processors produced by Intel and AMD; Reduced Instruction Set Computer (RISC)
    processors used by Hewlett-Packard (HP), IBM, Motorola, and Sun Microsystems (Sun);
    and Explicitly-Parallel Instruction Computing (EPIC) processors, such as Intel''s
    64-bit design, known as Itanium, to rival the power of RISC processors.


    # CISC Processors


    The core architecture of the 8-bit Intel 8080 processor released in 1974 has utilised
    the 32-bit Architecture (IA-32) of the current range of Intel and AMD processors.
    The processors are also referred to as x86. CISC processors are the de facto standard
    architecture for desktop PCs and low-end servers. Many peripheral devices have
    been developed to work specifically with the system boards upon which the CISC
    processor is sited. The Microsoft Windows OS has developed in close partnership
    with the development of Intel-based processors.


    Servers based upon CISC utilize peripherals and components designed for desktop
    PCs, which reduces the cost of both purchase and replacement. There are also benefits
    to users organisations where the skill sets for IT supporting desktops overlap
    with those supporting servers. This has been one of the drivers before the adoption
    of Linux, providing UNIX-like OS to on relatively low-cost Intel-based architecture.


    # RISC Processors


    The RISC processor was originally developed as part of a project between IBM and
    Ericsson to find ways of switching telephone calls. The RISC processor is suited
    to very high volumes of operations, including handling graphics, making it the
    technology of choice for high-end UNIX systems, and also used in graphic-interactive
    workstations.


    However, using RISC processors tend to be highly proprietary. Consequently peripherals
    and components are comparatively more expensive than those using CISC processors,
    as the market for processors is smaller, and devices are not so price-sensitive
    as in the CISC arena. IBM has invested heavily in ensuring that Linux can run
    efficiently on PowerPC chips. In contrast HP has decided not to actively support
    Linux on PA-RISC processors, although distributions are available that support
    the chipset.


    # EPIC Processors


    Utilising the 64-bit architecture, abbreviated to IA-64, this range of processors
    has been designed in partnership with HP specifically for high-end servers and
    workstations. HP will itself use the Itanium processors running Linux for future
    high-end servers, eventually phasing out PA-RISC.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_37_0.png)


