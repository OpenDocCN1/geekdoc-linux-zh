    # ## 2.4 LEGAL IMPLICATIONS


    SCO litigation story has received large press coverage; suffice to say here that
    despite pending lawsuits against IBM, Novell, and others, and SCO’s first lawsuits
    against end-users DaimlerChrysler and AutoZone, there has been no convincing evidence
    put forward by SCO in the public area to suggest that any infringements have been
    broken over by the Linux source code.


    To get some perspective on all this, it probably helps to look back at the chronology
    of events that began when SCO sued IBM in March 2003, claiming that IBM broke
    a contract agreement and used some of SCO Group’s UNIX System Code in Linux versions
    2.4 and 2.5. In August, IBM said it had a perpetual UNIX licence and filed a counter-suit
    against SCO.


    Red Hat has filed a suit against SCO. The first lawsuit, is scheduled for trial
    on 11 April 2005. Novell and SCO both filed registration for copyright over elements
    in UNIX System V in 2003. This stems from the purchase of assets in 1995 by SCO
    from Novell, which Novell left it with ownership of UNIX copyrights, subject to
    conditions.


    > While the SCO saga is likely to go on and on, customers should not be overly
    concerned about purchasing Linux.


    Those unfortunate companies receiving a payment from SCO should wait for the courts
    to decide the issues before taking any risk. Red Hat, Novell/SUSE, Sun, HP, and
    others all offer their customers indemnification programs, and SCO should win
    any argument in court, the Linux developer community will produce replacement
    patches for offending code, so there is no long-term threat hanging over Linux.


    While this saga is likely to go on and on, customers should not be overly concerned
    about purchasing Linux, and should not pay the disputed licence fees to SCO until
    the courts reach a decision. Even if the law courts agree that UNIX code has been
    copied into Linux, SCO can only win a lump sum from its corporate adversaries
    and problem code identified can be removed and replaced with equivalent code.


    > Another worrying threat to Linux and the use of Open Source is the increasing
    possibility that the patent protection regulations will be tightened.


    This current legal tussle between SCO, IBM, Novell, and others brings uncertainty
    to the Linux market place. However, Linux vendors and leaders in the Open Source
    community have rallied round to protect users. Vendors have indemnified their
    Linux users against SCO’s claims, and customers need not be overly concerned about
    making Linux a strategic choice.'
