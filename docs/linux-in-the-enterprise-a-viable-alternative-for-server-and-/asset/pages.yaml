  md: '# Linux in the Enterprise


    LS120

    A 3.5-inch diskette with a formatted capacity of 120MB.


    LSB – Linux Standard Base

    Awork of the Free Standards Group, its goal is to develop and promote a set of
    standards that will increase compatibility among Linux distributions and enable
    software applications to run on any compliant Linux system.


    LVM – Logical Volume Manager

    MCA – Micro Channel Architecture

    This is an interface between a computer(s) and its expansion cards and their associated
    devices. It was developed by IBM for its PS/2 desktops.


    .NET

    Microsoft''s Web services initiative that includes tools, a runtime platform,
    and Web-based services such as authentication, personalisation, and security.


    NetBEUI - NetBios Enhanced User Interface

    A program that allows computers to communicate with a LAN.


    NFS – Network File System

    Distributed file system, which enables a computer on a network to use the files.


    NNTP – Network News Transfer Protocol

    it is the main protocol used by clients and servers for managing the notes posted
    on Usenet Newsgroups.


    NTFS – Microsoft Windows NT (New Technology) File System

    it organises the files into directories that are sorted. There is no dependence
    on underlying hardware and no special locations on the disk.


    NTP – Network Time Protocol

    A protocol used to synchronise the real-time clock in a computer.


    NUMA – Non-Uniform Memory Architecture

    A multiprocessing architecture where the memory is separated into near and far
    banks.


    ODBC – Open DataBase Connectivity

    an standard API for accessing a database.


    OLE – Object Linking and Embedding

    A set of APIs to create and display a compound document (i.e. text or calendars).


    OS – Operating System

    Program that controls the computer system.


    OSS – Open Source Software

    Any program where the source code is available for use or further enhancement
    as users or developers require.


    PAM – Presence and Availability Management Forum

    it addresses the use and protection of availability information.


    PCI – Peripheral Component Interconnect

    an interconnection system between a microprocessor and attached devices.


    PCI-X – Peripheral Component Interconnect Ext

    an bus technology that enables data to move within the computer at 133MHz, rather
    than 66MHz.'
