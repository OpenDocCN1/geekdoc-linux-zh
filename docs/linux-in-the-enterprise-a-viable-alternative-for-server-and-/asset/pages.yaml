    It says that this makes Mandrakelin the most international Linux distribution,
    which is available in more than 40 languages. Hundreds of independent developers
    all around the world are constantly contributing and improving the product, code-name
    Cooker, and helping it make one of the most simple, and powerful Linux solutions
    available.


    Mandrakesoft products have been recognised for having technological excellence.
    Mandrakelin was named Product of the Year and Best Linux Distribution/Server at
    the 1999 LinuxWorld Expo, and it has received awards from publications in both
    the UK and the US.


    Mandrakesoft''s target markets include Small and Medium-sized Enterprises (SMEs)
    and large organisations. Mandrakesoft products are sold directly through its online
    store, as well through a distributor network worldwide, and Value Added Resellers
    (VARS).


    # Mandrakesoft''s target markets include Small and Medium-sized Enterprises (SMEs)
    and large organisations.


    The company maintains internally an IA-64 version of Mandrakelin that it deploys
    on demand for large corporations when they request a customised Linux distribution,
    as that deployed by TotalFirstFit.


    Most of the company''s products come under an Open Source licensing scheme, but
    hardware vendors pay it to ship the product, after a certification or adaptation
    process. There is no licensing cost as is normally used in the traditional proprietary
    meaning. Mandrakesoft''s products are Open Source, and the majority of the added
    value comes from consulting, project management, integration, adaptation, and
    support.


    The Mandrakelin Corporate Server is a server for medium and large organisations
    available at a price of US$799.90 including one standard support. It is including
