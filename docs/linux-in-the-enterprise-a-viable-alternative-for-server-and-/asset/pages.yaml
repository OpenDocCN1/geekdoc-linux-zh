  md: '# Linux in the Enterprise


    # About Butler Group Lifecycle Positions


    The vertical "Performance" groups reflect the success of the vendors and the relevant
    products in a particular market. This is not a financial measure, but a measure
    of the success of the technology in taking market share. A financial measure would
    have to take into account financing, management skills, and economic conditions.
    Market performance, however, is more related to the marketing skills of the vendor,
    product positioning, timing, excellence, and the success of the market.


    The vertical axis is divided into three groups, with each making a specific statement
    about the vendor and its product. Within each group, vendors are listed alphabetically,
    and the order and positioning of company names is not significant.


    +   * Outperform: The vendor has established a commanding market position with
    a solution that is widely accepted as best-of-breed.


    +   * Perform: The vendor has good market positioning and is marketing the solution
    well. The solution also offers competitive functionality and performance.


    +   * Under-perform: The vendor has poor positioning, has exercised poor timing,
    and is failing to market effectively. The product may also be deficient or outdated
    mainstream trends.


    +   * Early Adopter: Represents the early phases of the market when a new technology
    or standard, often promoted by new entrants, is adopted by innovative companies.


    +   * Market Adoption: The phase when the majority of technology adoption takes
    place, which typically lasts for three and four years.


    +   * Market Maturity: After the maturity, the market can be reshaped by vendor
    acquisitions, new products, and concerted efforts to make an impact in the market.
    Some of the vendors may have been acquired by this, and clear leaders will have
    emerged.


    # Linux Distributions – Early Adopter to 2005


    Novell LINUX – Having been recently acquired by its parent company, Novell, SUSE
    now has the back of a global organisation for support and marketing, and is able
    to provide the complete ecosystem. Butler Group believes that this will aid its
    acceptance in a wider geography from its home territory of Germany and Western
    Europe. SUSE LINUX is to simultaneously release its software on all platforms,
    which provides it with a competitive edge.


    Red Hat – Red Hat is a leading distributor, and was first to market with the offering
    of levels of support and training that had previously only existed in proprietary
    Operating Systems (OSS). It is endorsed by giants in the IT industry through partnerships,
    and offers a wide choice of services suppliers. With the addition of Red Hat Desktop
    v.3 to its Enterprise family of products, it provides a consistent platform across
    architectures.


    Debian – The Debian Project is a non-commercial operation and has a relatively
    low profile. Organizations use Debian more in-house skills than those needed to
    deploy other major distributions. Debian is developing UserLinux, aimed at building
    a free, enterprise-stable Linux distribution that will include certifications,
    service, and support options. HP has undertaken a significant level of investment
    in Debian, and the fruits of this have yet to be seen.


    Mandrakesoft – Mandrakesoft entered protection from bankruptcy in January 2003,
    and emerged from this status in March 2004. It is strong in its French home market,
    which has a history of focusing on ''home-grown'' offerings, and is concentrating
    on development of new and updated products.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'MIRACLE LINUX – Strong in its native Japanese market and is fully tested and
    supported by Oracle9, and includes clustering and a Journaling File System. Oracle
    owns 58.5% of the company and NEC 14%. It has recently joined with Red Flag to
    create Asianux, which is positioned to be the standard distribution for enterprise
    servers.


    Red Flag was co-founded by Software Research Institute of the Chinese Academy
    of Sciences and NewMargin Venture Capital in June 2000. The company joined with
    MIRACLE LINUX CORPORATION to announce in March 2004 the completion of the beta
    version of Asianux 1.0, the only standardised Linux operating environment developed
    specially for businesses in Asia. The sheer size of emerging Chinese market ensures
    by volume that it will be a major distribution.


    Turbinolux – Founded in 1992, Turbinolux is a Linux software that is strong in
    Japan and is committed to providing the latest Linux-based solutions. It is backed
    by some of the leading companies in the high technology world.


    # Market Adoption 2006-2009


    As one of the two key distributions in the Americas and Western Europe, Red Hat
    with its strong development team will be at the top of any shortlist, with Novell
    SUSE LINUX. With Novell''s marketing strength and its broad geographical coverage,
    the SUSE LINUX distribution will be able to break out from its Western Europe
    base. Together with services and support, it will provide a strong and attractive
    offering.


    From its roots in Linux and Red Flag, Asianux should become the dominant distribution
    in the Japanese and exploding Chinese markets, and building on its strong foundations,
    Turbinolux will also have a significant share in those markets.


    Although Debian has debate well amongst the Open Source community, and forms the
    core of a number of other distributions, we do not see Debian achieving enterprise
    popularity. We believe that Mandrakesoft will remain particularly strong in the
    French market, but will not achieve the global exposure necessary to take a significant
    world market share.


    # Maturity 2010-Onwards


    In the longer term, we expect that Red Hat and Novell SUSE LINUX will continue
    to take the lion''s share of the distribution market. With the ever-growing Chinese
    market, we expect Turbinolux to be supported and have a significant base, although
    Asianux will be the predominant distribution in the Asia/Pacific region. It is
    possible that Debian will have an appropriate partnership to build on its potential
    by this timescale. We do not anticipate that Mandrakesoft find it possible to
    break out from its French ground.


    # Linux Services – Early Adopter to 2005


    IBM has probably the most comprehensive range of products and support for Linux.
    This is reinforced by its Global Services organisation; for organisations moving
    to Linux at the enterprise level, using IBM will minimise risks, perceived and
    real, always as with IBM there will be a cost.


    HP’s hardware and software approach, the indemnification programme, and its internal
    commitment to those migrating or deploying a Linux of confidence. As a global
    company, with significant support services arm, HP will be potential partner for
    larger organisations.


    Oracle – The ‘Unbreakable Linux’ over the single company for support across the
    software stack, is very attractive, particularly for Oracle’s extensive customer
    base, especially those migrating from Microsoft Windows NT4 platforms.'
  merge: -1
  pgno: 102
- img_proc: true
  md: '# Linux in the Enterprise


    **Fujitsu** - Fujitsu regards Linux as another ''flavour'' of UNIX, and is in
    the initial stages of its Linux services programme, but as the world''s fourth
    largest IT company, with significant presence in the Asia/Pacific region, and
    large public sector contracts in the UK, it is positioned to be a major player
    in Linux Services.


    **Novell** – After making sensible acquisitions in Xishan and SUSE LINUX, the
    company will be getting its offerings in attack the global market, leveraging
    its legacy applications, experience and presence.


    **Sun Microsystems** – Its strategy seems to be confused as instructed by its
    recent attack on its business partner, Red Hat, and its announcement that it is
    considering the release of Solaris into the Open Source community.


    # Market Adoption 2006-2009


    We believe that HP will join IBM as a dominant player in the Linux services market
    in the medium term. By offering a complete ecosystem, and integrating its legacy
    applications, Novell should would appeal to the wider Linux market providing the
    same risk averse argument as HP and IBM. Fujitsu will continue to provide comprehensive
    support for its customer base that has migrated to, or deployed. With Oracle''s
    strong commitment to Linux and its reference architecture for customers wishing
    to migrate to Linux, the company will retain a considerable share of the market.
    We believe that Sun Microsystems will have sorted out a coherent strategy by this
    stage, providing it with the opportunity to be a significant player in the Linux
    services market.


    # Maturity 2010-Onwards


    We do not believe that it will be possible for a new entrant to make an impression
    in this market and that HP and IBM will continue to be dominant. Novell will continue
    to have a considerable share in the market, assisted by its ownership of one of
    the two major Linux distributions. Similarly, Fujitsu and Oracle, building on
    their strong customer bases will continue to have a share, and provided that Sun
    Microsystems succeeds in getting strategy clarified, it could also have a significant
    share in the Linux services market, longer term.'
