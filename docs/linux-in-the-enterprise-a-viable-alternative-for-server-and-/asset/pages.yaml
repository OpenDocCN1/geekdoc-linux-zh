  md: '# Linux the Enterprise


    Novell maintains that by the use of Open Source Tools and Standards such as LDAP,
    TCP/IP, Java, and Samba, integration into existing IT infrastructures is not a
    problem. An example of this is by using Samba, SUSE LINUX Server can be integrated
    in an existing Windows environment.


    The SUSE Linux Server family can be part of a basic IT Architecture for a wide
    range of additional services including security, connectivity, and system management.
    SUSE Linux Enterprise Server 8 has achieved the world''s first Common Criteria
    certification for an Open operating system. It has been successfully evaluated
    under the Common Criteria for IT Evaluation, Version 2.1, and has reached Evaluation
    Assurance Level (EAL) 2 and are currently preparing for EAL 3. This means the
    SUSE Linux Enterprise Server is a certified basis for a secure and stable IT environment.


    # The SUSE Linux Server family can be part of a basic IT Architecture for a wide
    range of additional services including security, connectivity, and system management.


    For system management, customers have available SUSE tools such as YaST2, AutoYast,
    and Alice. These tools set up, install, and administer all servers and user data
    in a central and easy-to-configure manager. They can be used with a GUI interface
    as well as with the command line interface, and specialist LINUX knowledge is
    no longer required in order to carry out these tasks. For System Monitoring, the
    powerful Open Source Tools is needed.


    The SUSE Linux Enterprise Server includes the most popular and well-known open
    source tools for Web services, including Apache and Tomcat. The SUSE Linux Server
    family works with common standards. It is available for a wide range of architectures
    and includes strong co-operation with all native operating systems on host and
    mainframe systems. Novell asserts that its Linux Enterprise Server is an ideal
    platform to facilitate optimised connectivity in a heterogeneous environment.


    To complement the consulting and support services available from the company,
    Novell''s business partners provide services to set up complex IT infrastructures.
    Consulting for named accounts and pilot customers, support for additional support
    contracts is available through SUSE Business Partner.


    # DEPLOYMENT


    Dependent on the complexity of a planned IT Infrastructure, the required resources
    vary from one system administrator to a larger number of external customers. Only
    basic IT knowledge is necessary for an initial installation and setup of a single
    infrastructure server. Implementation times depend on the complexity of the planned
    IT Infrastructure, and can take a few hours for setting up a SUSE LINUX Standard
    as an Infrastructure Server in a small network with Windows clients. Setting up
    a complex IT infrastructure with numerous Application and Database servers in
    a distributed environment obviously takes longer.


    The SUSE Linux Server family can be used in a distributed environment, as server
    services can be dispersed on a number of different clusters. Clustering of the
    servers is also possible, as is the implementation of this a high availability
    solution.


    For a basic setup, only basic IT server knowledge is required. Novell works with
    its training partners all over the world for further training. Training courses
    facilitate and support the Linux Professional Institute (LPI), UnitedLinux Certified
    Professional (ULCP), and UnitedLinux Certified Expert (ULCE) certifications, in
    addition to Novell''s own CLP (Certified Linux Professional) qualification. All
    of these courses can be attended at various locations around the world.'
