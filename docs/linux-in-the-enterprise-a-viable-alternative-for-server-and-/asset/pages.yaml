  md: '# Linux the Enterprise


    In 2002 Oracle, with Red Hat''s Linux Enterprise, created the ''Unbreakable''
    concept and brand, offering a tightly integrated stack of operating and database,
    with a ''one-stop-shop'' for support and problems offered through Oracle staff
    — capable of providing fixes at code level if required.


    The entire Oracle portfolio is now available for deployment on Linux, including:


    +   - Database — 9i and 10g.

    - Applications — E-Business Suite.

    - Application Server.

    - Collaboration Suite.


    Oracle is an Independent Software Vendor (ISV), and the company has migrated all
    base development of Oracle software from Solaris to Linux platforms, and most
    of the company''s internal business software has also been migrated to Linux.


    The migration to Linux as the development platform has also facilitated a change
    in the development and Quality Assurance (QA) process. Back in the 1990s, base
    development was on Solaris, software build was undertaken separately from QA.
    A standard platform allowed Oracle to undertake these tasks simultaneously, with
    simultaneous development, portug, and QA on all platforms. This has reduced the
    time of the product development life cycle and increased the quality of the software
    releases, and with feedback from QA is faster. The company is currently building
    a test lab for Linux releases, working with partners to develop a standard Linux
    test plan. Again this is to reduce timescale and improve quality and assurance.


    Oracle''s Demand Services offers end-to-end hosting and maintenance of Oracle
    Products on the Linux platform, with the option of deploying these systems at
    Oracle''s data center at the customer site. Oracle has a server-based approach
    to software, and has the objective of abstracting applications to the browser
    level. In January 2004, it announced a ''Linuxever'' campaign, with the objective
    of all Oracle applications accessible through the Mozilla Open Source browser.


    The development of the 2.6 kernel, with its support for the 64-bit architecture,
    will give a new impetus, and level of development. The company is committed to
    working openly with the wider Linux community, and contributes code back to the
    Linux community, for example, the code for Oracle''s cluster file system.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_187_0.png)


