  md: '# 4.1 OPEN SOURCE MODEL


    The principles of the Cathedral and the Bazaar first articulated a number of years
    ago by Eric Raymond helped define the Open Source model, a true community approach
    to software development. The success of Linux and other Open Source projects turned
    on its head the conventional thinking at the time that the best approach to software
    development was by individuals or small teams building software in a similar fashion
    to constructing a cathedral. The belief was that a centralised model worked best
    as development teams beyond a certain size made the project too complex and unmanageable.


    # The success of Linux and other Open Source projects turned on its head the conventional
    thinking.


    In contrast to this, the approach of delegating, releasing early and frequently
    utilised by Linus Torvalds in the development of Linux went without the traditional
    method. To the surprise of many this chaotic arrangement with a large pool of
    developers with different agendas to produce robust and usable code. This ‘bazaar’
    (no pun intended) type of development was found to have a number of strengths,
    which included the breadth of ideas generated, extensive peer review improving
    the quality of code, and the availability of a large testing network.


    The Free Software Foundation (FSF) also provided a catalyst for the development
    of no-cost software with a special licence that encouraged the viral spread of
    code due to the formalisation provided by the GNU General Public Licence (GPL).
    This licence enshrined the right of free distribution and copying.


    This type, while providing the source code for free, made it impossible to base
    a business model on and made it difficult for commercial organisations to exploit.
    This led the Open Source Initiative (OSI) to create the Open Source Definition
    (OSD), a more practical approach enabling both the Open Source community and business
    to contribute and benefit from OSS. This has further led to the creation of a
    number of licences embodying the principle of freedom to reuse software but allowing
    a degree of protection for commercial use.mut mutually beneficial.


    Although many tout Open Source Software (OSS) as producing innovation and there
    can be no argument that it is very good at improving the efficiency of an existing
    function, it has yet to provide a step change in the way people use systems. Many
    of the design principles for Linux were taken from UNIX and improved upon, but
    Linux has so far failed produce new and different ways of catering with the challenges
    faced by Operating Systems (OSS) today.'
