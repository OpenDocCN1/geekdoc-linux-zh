- img_proc: true
  md: '# Linux in the Enterprise


    The leading global distributions in the server market are without doubt Red Hat
    and SUSE LINUX, who have both built partnerships with the major players in the
    IT market. There are now Linux reference architectures using these distributions
    available from IBM, HP, Oracle, and others, providing integrated and tested server-based
    solutions including hardware, OS, and middleware.


    # The majority of customers in this market will not be considering an OS, and
    quite possibly not even a specific application, but on most occasions will be
    looking for a solution.


    Another important element to the buying decision in the server OS market is the
    availability of support. Quite understandably, these systems run critical business
    applications, there is a need to be able to access help 24x7. The distribution
    channel partners are again providing this. In some cases can the third-level support
    with short-term fixes provide the kernel if needed.


    A further influence on the market are the developers building applications on
    the server platform. One aspect is the developer community themselves require
    tools to build applications for the environment and another is the support for
    the OS as a Tier 1 platform from the ISVs. Linux initially suffered from a deficiency
    in these areas, it has in recent times, if not surpassing more mature offerings,
    at least reached credibility. The expectation is that the market share of proprietary
    UNIX versions will decline, and with Linux Windows will be the main OS going forward.


    # Client


    The desktop market is a global market bath for hardware and software. Major players
    dominate the sector, with Microsoft holding a virtual monopoly on desktop software
    with 95% market share. Enterprise customers have similar requirements to the consumer
    with buying decisions based on interoperability, integration, and software features.
    Due to the number of users involved there can also be large migration costs where
    re-training is required. This gives the incumbent Microsoft a significant advantage
    over any new entrants to the market.


    # The emergence of Linux pre-installed on PCs in the market should also increase
    its adoption


    Despite this Linux desktop is beginning to gain ground with some early organisations,
    especially in the public sector. The emergence of Linux pre-installed on PCs in
    the market should also increase its adoption. The belief is that over the next
    two years Linux on the desktop will become a viable option for some desktop users
    and its market share will increase, particularly in developing countries.


    There is an increase in the use of mobile clients including laptops, which are
    to all intents and purposes mobile desktops, and other devices such Personal Digital
    Assistants (PDAs) and smart phones. There are isolated instances of Linux being
    used for these type of device but it is a market where Linux has been slow to
    penetrate and show any signs of gaining traction. However, HP has recently announced
    the availability of laptops with pre-installed Linux, and Motorola has launched
    Linux smart phones in Asia.'
