  md: '# Linux in the Enterprise


    All technical support staff in Rackspace can provide first-, second-, and third-level
    support as required. Only the most specialist tasks are passed out of Rackspace,
    for example the company use Microsoft''s Professional Services organisation as
    its final level of support to fix software bugs.


    Approximately 45% of Rackspace servers run Red Linux, and there is an active migration
    of customers to the Enterprise server edition. A similar number is on Microsoft
    Windows Server 2000/2003; as a Microsoft Gold Certified Partner, and a Red Hat
    Hosting Partner, Rackspace is well placed to assess the relative merits of each
    OS.


    Overall Rackspace regards Red Hat Enterprise and Microsoft Windows Servers as
    comparable platforms on their deployment and management experience. Technical
    support rates for both are priced at the outset on the same level. Careful monitoring
    of all the activity, and the cost of supporting each, are reviewed at contract
    renewal time. Anecdotal reports from Microsoft Windows customers are more likely
    to contact the support desk than those with Linux implementations. This may be
    a self-fulfilling prophecy, that those deploying Linux are, in Rackspace''s experience,
    more technically aware.


    As an early adopter of Linux, Rackspace has developed its own management tools
    for monitoring and controlling the infrastructures for its customers, and in fact
    has developed its own kernel, with optimised code for the managed hosting environment.
    The tools we have mastered with business believes that its in-house CORE Rackspace
    management tools are still ahead of the emerging offerings from ISVs.


    Rackspace offers its customers'' access to its own Web-based management system
    called MyRackspace. This application runs on a Linux server and utilises a MySQL
    database. The customer has access to reporting, support history and billing information
    via the ''MyRackspace'' interface.


    The company is offering its customers on earlier versions of Red Hat a free migration
    to Red Hat Enterprise Server, encouraging all new deployments to be hosted on
    the platform, which it believes to be more benefit and efficiencies that are gained
    from the improved, and advanced management features.


    Rackspace advises its customers not to run MySQL or Apache, on Microsoft Windows
    Servers, recommending the more efficient combination of Linux, Apache, MySQL,
    and PHP (LAMP). Rackspace believes that the ability to hold stored procedures
    in the latest version of MySQL will make a number of organisations putting larger
    and more complex database applications onto this platform as a substitute for
    MySQL Server, when licensing costs are becoming increasingly evident.


    One of Rackspace''s customers is xrefer, a company that combines books from the
