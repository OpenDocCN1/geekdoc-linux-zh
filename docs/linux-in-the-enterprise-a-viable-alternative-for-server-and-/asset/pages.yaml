  md: '# Linux in the Enterprise


    # 2.2 THE LINUX ECOSYSTEM


    The Linux OS is currently sweeping across the IT landscape, beginning at the server
    and moving right through to the client. From its beginnings as a small-scale Open
    Source project, the OS has gained a momentum that has seen its market share overtake
    all flavours of UNIX and threaten Microsoft Windows. A number of governments,
    including those of Germany and China, and other public sector agencies have adopted
    Linux as a means of breaking vendor lock in with all its associated disadvantages.
    Linux started its entry into the IT market cheaply through its ability to support
    robust file and printer servers, and as an alternative to run on infrastructure
    hardware Linux has gained significant market share in the IT backroom.


    # A number of governments and other public sector agencies have adopted Linux
    as a means of breaking vendor lock in with all its associated disadvantages.


    A significant factor in the evolution of Linux into an enterprise-ready OS is
    the establishment of a credible ecosystem. Initially, there was mutual suspicion
    and mistrust from both the Open Source community and the commercial sector. We
    have seen over the past couple of years these two camps reach accommodations with
    each other that allowed the adoption of Linux to go from strength to strength.


    In addition, what helped propel Linux into the enterprise was a continuing stalemate
    amongst UNIX vendors. Time after time efforts to unify the UNIX camp stalled as
    vendors vowed to retain self-interest. While this situation paved the way for
    Microsoft NT and Windows 2000 to gain greater ascendancy, it has also allowed
    Linux to make significant inroads into the UNIX market.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_21_0.png)


    Figure 2.2.1: The Linux Ecosystem'
  merge: -1
