  md: '# Linux in the Enterprise


    Sun provides standard Linux offerings that are best suited for organisations that
    are looking for the broadest x86 platform support and horizontal scalability.
    They are also aimed at organisations that have standardised on Linux or commercial
    Linux applications. The company''s standard Linux solutions are also available
    for customers who want to draw on the resources of the open source community or
    who desire free access to source code.


    Sun Microsystems believes that it has a competitive advantage over other vendors
    through its global support in local languages, building on its experience in UNIX
    support and educational services. It also provides a single point of contact for
    Sun Microsystems'' hardware and Linux offerings. Its support services are designed
    to be ongoing for the life of the product, and its managed services are designed
    to be ongoing throughout the customer relationship. Other services can be supplied
    on demand, such as large-scale integration of customer-ready systems, and it provides
    one-off services such as classroom or Web-based training.


    # Sun''s services offerings are delivered according to its implementation of the
    Six Sigma methodology, called SunSigma.


    Sun''s services offerings are delivered according to its implementation of the
    Six Sigma methodology, called SunSigma. All of the services form part of Sun''s
    Architect, Implement, and Manage (AIM) lifecycle methodology for solutions delivered
    to its customers, including solutions based on Linux. In addition to SunSigma,
    Sun also offers managed services based on the Information Technology Infrastructure
    Library (ITIL) methodology.


    Architecturally, the design methodology is built upon a Sun Define, Measure, Analyse,
    Design, and Verify model (DMADV), which has been adapted as a framework for working
    within three life-cycle cycles, problem analysis, solution development, and solution
    sustaining. In a classical Sigma context, the DMADV model is applied when processes
    or products are being developed for the first time, or when an existing process
    or product can be improved to meet established Critical-To-Quality (CTQ) metrics.


    The classical DMADV model incorporates five phases, which describe a process for
    defining and implementing a product or process:


    +   - The Define phase to identify objectives, goals, requirements, constraints
    and assumptions, and to bound the problem space.


    +   - The Measurement phase to establish measurable CTQs which quantify the problem
    space.


    +   - The Analysis phase examines available data, develops an understanding of
    the problem space, and establishes design parameters.


    +   - The Design phase develops a candidate solution and evaluation of its capabilities.


    +   - The Verification phase to implement the design, validate performance, and
    assess the design''s adherence to requirements.


    To facilitate the development of a complete end-to-end life cycle methodology,
    the classic DMADV model has been extended to incorporate a Control phase. This
    enables the sustaining elements of the solution life to be fully incorporated
    into the methodology. As a result, the tools and discipline of Sigma can be leveraged
    into the sustaining space of the solution''s life cycle. This modification results
    in the DMAVC model, which is illustrated below.'
