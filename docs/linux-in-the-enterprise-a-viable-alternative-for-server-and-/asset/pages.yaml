  md: '# Supercomputing


    Linux has shown its adaptability by being used in a number of high performance
    supercomputers. The ability to build computers from commodity hardware by clustering
    many Linux systems brings down the cost significantly. This has enabled Linux
    to become one of the main OSs in this market with IBM, HP, and Dell Linux-based
    supercomputers.


    # 6.2 CASE STUDIES


    # City of Bergen


    Norway''s second largest city, with a population of 237,430, and is located by
    the North Sea. As part of its strategic direction to migrate to Linux as the standard
    operating platform for servers, the City has decided to deploy Novell SLEUX Linux
    Enterprise Server (SLES) 9 on a series of HP Servers and IBM Blades, to replace
    the proprietary UNIX, and Microsoft Windows for the administrative and educational
    networks respectively. The original plan was to deploy SLES 8, but after testing
    the latest version 9, implementation will be on the new era. The City already
    has an IBM Storage Area Network (SAN), and part of the selection is that Linux
    2.6 kernel has better support for SANs.


    In selecting as a strategic focus the City was seeking to attain a business model
    that not tie it to a single vendor''s solution architecture. By migrating to Linux
    the City has a business model that is open and democratic, and one that will ensure
    a greater degree of freedom of choice for the future, more efficient operation,
    and major cost savings that will benefit its citizens.


    As part of the introduction into which distribution of Linux wanted to standardise,
    either SUSE or Red Hat. At the time of selection (which was for SLES 8), the City
    considered the SUSE distribution had better 64-bit support, and more tools for
    administration on larger parks. Another consideration for the City, in a country
    where first language is English, the language support in SLES 8. For the user
    interface to Linux, it was also considered that KDE with SLES 8 was preferred
    to GNOME provided by Red Hat.


    # Administrative Network and Servers


    The major project is to migrate the City''s 30 existing Oracle databases, 20 on
    HP-UX and ten on MS Windows 2000, these will support a range of the City''s operational
    businesses, including core health and welfare services, and will be accessed by
    15,000 employees. The requirement is for the servers to offer maximum uptime while
    being cost effective.


    The existing HP servers have a large extent reach the end of their operational
    life, and need to be replaced. The replacements were selected following a competitive
    tender announced in the Official Journal of the European Communities (OJEC). The
    City had that the processors in the servers should support 64-bit computing and
    be non-proprietary.


    Through extensive testing, it was identified that moving from UNIX to Linux for
    the applications Oracle databases was relatively simple. Some retraining of continuing
    staff has been necessary, which is a one-time cost. Database testing will continue
    until the end of August 2004 to choose high availability clustering technology,
    test production will be undertaken through October, and it is intended that production
    deployment of the new servers will start November-2004.


    The migration is managed within existing staff costs; and the City believes the
    ongoing support element of the Total Cost of Ownership (TCO) of the servers will
    be lower than that for an equivalent solution based upon Microsoft Windows, as
    solving problem in Linux is less complex.'
