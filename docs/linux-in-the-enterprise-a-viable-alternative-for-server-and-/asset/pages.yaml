  md: '# Linux in the Enterprise


    Features that are desirable in integrated storage management include:


    +   * Storage partitioning support.

    * The ability to configure and manage hot spares.

    * The ability to identify hot blocks and redistribute them to equalise loads on
    respective devices.

    * In transactional processing, support for two-phase commit to facilitate rollback
    of the database in case of error.


    # Software Management


    As the purpose of a server is to run applications, besides the actual operation
    of the applications in performing their respective tasks, it is essential that
    not only the OS components but also the associated OS utilities and applications
    be managed. This is to ensure the integrity of the software, its availability,
    and its interoperability with other software.


    Software management tools are designed to install, uninstall, verify, query, and
    update applications. They will generally use a software registry/configuration
    database containing an archive of files that comprise the application, along with
    information about the software such as its version, and a brief description. More
    advanced tools can allow multiple configurations of software, specific to particular
    clients.


    # Workload Management


    Workload management, also referred to as resource management, is a generic description
    for tools that make the most efficient use of the available computing resources.
    it can be most effective when used in systems that are distributed across multiple
    physical servers and are thus key requirements in utility computing, and can also
    be employed with multiple servers on a single, high-capacity system. Workload
    management tools can either be entitlement or goal-based. The central tasks in
    workload management are focused on the priorities of tasks undertaken, also referred
    to as job control.


    Job control tools can manage a range of processes:


    +   * Adding new job submission queues.

    * Removing queues.

    * Restricting user access to specific queues.

    * Change the priority of specified queues.

    * Remove or suspend jobs in a queue, by owner, or if appropriate all jobs.

    * Resume suspended jobs.


    To maximise the effectiveness of workload management tools, it is advantageous
    to be able to access them from within the systems management interface.


    # Security Management


    Security management functionality supplies a way of assimilating and administering
    the many security components. The system should offer centralised control of all
    the security elements of the system.'
