  md: '# XML – eXtensible Markup Language


    Markup Language defined by the W3C as a Recommendation in 1998. Used as a meta-language
    to describe data, and now finding widespread application in areas such as: application
    integration; content management; electronic data interchange; and wireless communications.
    XML is ''extensible'' because, unlike HTML, the markup symbols are unlimited and
    self-defining. Using XSL Stylesheet, XML can be transformed to display as HTML
    on a Web page, or to alternative formats for display on other types of client
    device.


    # XPG4 - X/Open Portability Guide, Issue 4


    A specification containing internationalised utilities, headers, and interfaces.'
