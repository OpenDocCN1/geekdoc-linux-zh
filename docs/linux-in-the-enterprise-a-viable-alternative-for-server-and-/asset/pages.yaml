    Through its involvement with the Open Source Development Labs (OSDL), and partnerships
    with both Red Hat and SUSE, HP is giving customers the confidence to install Linux
    for enterprise deployments. It runs over 5000 Linux servers internally, and offers
    its customers tested and certified ''end-to-end'' Linux-based solutions. The published
    indemnification programme should offer businesses a level of confidence about
    the copyright issue, but it does require that all component, and services be from
