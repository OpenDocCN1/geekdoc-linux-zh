    - Postfix E-mail Server providing a security replace for Sendmail.

    - ProFTP FTP Server.

    - Squid Server.

    - Samba File and Print Server for sharing resources with networked computers running
    Microsoft operating systems.

    - LDAP mail directory that contacts directory server.

    - Firewall and router providing security and Internet sharing.

    - POP3, IMAP, and Webmail E-mailing offering a reliable and robust corporate messaging
    system.


    # Multi Network Firewall


    Mandrakesoft''s integrated network security solution, Multi Network Firewall (MNF),
    combines, Virtual Private Network (VPN), intrusion detection, and traffic management
    functions into an easy-to-use product. Through a secure Web interface, utilizing
    finely-tuned wizards, network administrators can easily build a network, define
    access rules, filter and monitor Internet content, and perform administration
    tasks. Multi Network Firewall integrates seamlessly into existing networks and
    works with a variety of operating systems, including Microsoft Windows. This high
    performance security solution offers savings by eliminating add-on costs such
    as DES licenses and VPN clients. MNF supports an unlimited number of VPN clients.


    Through the use of finely-tuned Wizards and a secure Web interface, network administrators
    are able to deploy a professional network with high-level features such as:


    +   - Filtering rules for blocking advertising banners and controlling information
    flow.

    - Custom Internet access rules for clients on a local network.

    - Easy-to-use monitoring tools for detailed information about network and system
    activity.

    - User-friendly utilities for performing a wide variety of administration tasks.'
