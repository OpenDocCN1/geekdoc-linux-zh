  md: '# Linux in the Enterprise


    The Open Source background of Linux means that everyone needs to be brought on
    board with the differences and the changes this will cause. Even organisations
    planning a move to Linux and OSS immediately develop a strategy of using open
    standards to ensure a smooth transition to Linux should the decision be taken
    in this direction. It is probable that the migration will be phased over a number
    of months and with large deployments a pool built into the process to validate
    the system and plan, especially when contemplating a migration to a Linux desktop.


    Migrating from UNIX to Linux is similar to porting from one version to another.
    Many of the utilities and associated administration features are the same, although
    problems can arise from the use of extensions that are not part of the Portable
    Operating System Interface (POSIX) standard. These differences should not be major
    and bespoke applications should not find any architectural features. Whilst the
    configuration can be expected to be dissimilar, the tendency has been for the
    different UNIX versions to use standard mechanisms for communication and file
    formats, making the migration easier.


    A migration from Windows to Linux is slightly more problematic due to the incompatibility
    of the two environments, especially in their administration. The move can be achieved
    using one of two methods, by adding Linux servers to the existing Windows system
    and phasing out the Windows servers, or with the creation of a new parallel Linux
    environment and migrating systems over time.


    A number of tools are available to assist with the migration, including Win4Lin
    from NetTraverse, Codewaver''s Crossover and Koppix. Win4Lin and Crossover Office
    can be used to run Windows-based applications in a Linux environment. Koppix is
    a Linux system that boots from a CD making it useful for demonstrations and trials,
    as the Windows system on the PC remains unaffected. Numbered other utilities and
    applications are provided by the distributors and solution providers, along with
    migration services provided by all the major IT vendors. The use of partitioning
    technology from VMware can help with the integration of Linux in the IT infrastructure
    and provide a way of running Linux systems within a current environment.


    > In the short-to-medium term it is highly likely that Linux will need to co-exist
    with other OSs, which highlights the importance of system management tools.


    In the short-to-medium term it is highly likely that Linux will need to co-exist
    with other OSs, which highlights the importance of system management tools that
    can manage heterogeneous IT environments. Many IT solution providers, including
    BMC, Computer Associates (CA), HP, IBM, and Novell provide management software,
    enabling the centralised administration of multiple UNIX, and Linux systems. This
    aspect should not be overlooked when adding Linux to the mix, as one of the major
    contributors to the overheads in the IT operation is the additional management
    requirements of a new OS.


    # Conclusions


    +   - Migrating to Linux is like any IT project that it must be driven by business
    and technical requirements and be properly planned.

    - Cognisance should be taken of the softer issues, especially when migrating from
    Microsoft Windows to Linux.

    - The first step for contemplating Linux on the desktop is to evaluate one of
    the CD-bootable Linux distributions.'
