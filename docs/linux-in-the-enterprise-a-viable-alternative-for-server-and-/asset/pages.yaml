  md: '# Linux the Enterprise


    # Grid Computing


    Another technology which forms a growing component of the utility concept is grid
    computing. It links servers, clients, and storage from across the Internet to
    form virtual resource pools, which can be dynamically allocated. It is an idea
    that has been around for a number of years, going under various guises, including
    peer-to-peer computing, collaborative computing, distributed computing, and supercomputing.


    The technology is the application of the many computers in a network to a single
    problem at the same time. Each node has its own resource manager and allocation
    policy. It is sometimes confused with cluster computing, which is the management
    of distributed resources by a single, localised scheduling system.


    Grid computing will allow organisations to work more closely and efficiently with
    colleagues, partners, and suppliers. They will be able to utilise geographically-dispersed
    systems as one virtual environment. There will be access to any remote database
    within a grid, which is particularly appropriate for companies involved in sciences
    that need share genome data with others. It will also enable widely-dispersed
    organisations to work on projects, so that they can share information, content,
    and applications.


    There are a number of examples of grid computing in use today. Corporations, professional
    groups, university consortiums, and other groups, have developed or are developing
    frameworks and software for managing grid computing projects, including the use
    of Linux.


    # Conclusions


    +   * Of more importance than the Windows-versus-Linux argument is the decision
    as to which hardware platform offers the best value.

    * Linux can form a major component of an IT optimisation strategy.

