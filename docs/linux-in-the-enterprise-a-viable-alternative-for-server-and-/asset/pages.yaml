  md: '# Linux in the Enterprise


    The Linux kernel version 1.0 was released in early 1994, with Linux 2.0 following
    in the middle of 1996, which included support for multiple architectures and multiprocessing.
    Linux has evolved over the years into a multi-user, multi-tasking system with
    an associated set of tools and utilities, capable of running on many hardware
    platforms from the smallest to the largest server.


    Kernel releases are separated into deployment and development. The former is ''set
    in stone'', unless a fault is discovered, and all features have been tested and
    accepted by the community. The latter is a ''work in progress'', members of the
    community can contribute to until it is fixed and becomes the next deployment
    release. The current deployment release is 2.6 made in December 2003.


    Commercial releases of the 2.6 are planned by the major distributors over the
    coming months. Red Hat plans to include the 2.6 kernel to Red Hat Enterprise 4
    due out in 2005. SUSE LINUX will include 2.6 with its summer 2004 release of SUSE
    Enterprise Server 9. Some features of 2.6 have already been back-ported into the
    2.4 kernel in commercial distributions.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_24_0.png)


    Figure 2.2: Linux Kernel Development Timeline (Source: OSDL).


    The Linux kernel development is itself overseen by a small group, including Linux
    Torvalds, supported by the OSDL, who agrees additions and enhancements submitted
    by the ''community'' of developers, and increasingly the efforts of major ISVs
    and the ISVs they represent. The Linux Standard Base (LSB) Project, under the
    auspices of the non-profit Free Standards Group, publishes standards to ensure
    compatibility between Linux distributions.


    Initially, Linux development focused on the kernel, but an OS consists of much
    more functionality, so whereas the Linux kernel is entirely made up of code built
    by the community, a Linux system consists of another layer of functionality, some
    of which have been developed from scratch, while others from previous projects
    and existing Linux utilities. The concept of a Linux distribution was developed,
    grouping together the standard kernel, Linux utilities, management tools, and
    other associated software.


    With major ISVs seeking a version of Linux that would scale to larger machines
    and meet the requirements of the business community, a number of distributions
    aimed at enterprises were developed by organisations such as Red Hat and SUSE
    LINUX. These companies have established support and professional service structures
    for customers and partnered with key industry names for additional credibility.'
