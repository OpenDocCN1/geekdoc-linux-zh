  md: '# Linux in the Enterprise


    # Educational Network and Servers


    The second project in the strategy will involve the migration and consolidation
    of 100 Microsoft NT Windows application servers, currently based in individual
    schools that support the City''s educational network, to a centralised Eiser BladeCenter
    with 20 blade servers.


    With 32,000 students and 4,000 teachers accessing the educational network, the
    existing server environment could not scale with the increasing demand. Centralisation
    and management were other key issues for the network, which is seen as a "sinking
    ship" using outdated hardware and software. Operation of the network requires
    significant support, both from within the schools and from the City''s central
    IT department. There has also been a growing problem with servers and maintaining
    consistency of application access. Each school could deploy applications locally
    on its server, but the nature of the deployment meant that it was not generally
    backed up, and could cause conflicts with the other software.


    The IBM BladeCenter was also selected under competitive tender OJEC Each Blade
    is a full server, with memory, processor and storage, but the City prefers using
    the IBM SAN to local storage, as it is faster, more secure, and involves less
    parts in the servers. The Linux Blades will supply user authentication, and file
    and print services with the Open Source SAMBA, a load-balancing cluster of four
    blades. Other services will be e-mail, Lightweight Directory Access Protocol (LDAP),
    Domain Name Server (DNS), Dynamic Hot Configuration Protocol (DHCP) and Open Lightweight.
    The Blades are also to be used as terminal servers, running Tarantella Secure
    Global Desktop, a Linux-based alternative to Citrix software.


    Cost was an important factor in the decision to move the educational network to
    a centralised service, and no more staff will be required after the migration.
    With the move to the centralised service, the people in each school that had been
    supporting the servers will be redeployed into teaching and support roles within
    those schools. There has been no resistance to the planned migration as the design
    and layout for a centralised service has been planned for a long time, and the
    expected benefits are accepted by all.


    As part of the business case for the use of Linux, the City has calculated that
    the costs of the servers for the educational network would be only 60% of for
    an equivalent installation using servers Microsoft Windows 2000.


    The deployment will start after the Summer 2004 school holidays and will utilise
    the existing network infrastructure. The 85 schools on dedicated Wide Area Network
    (WAN) connections are to be migrated by the end of the year, and the roll-out
    to the remaining 15 schools that use Asynchronous Digital Subscriber Line (ADSL)
    connections will be completed in early 2005.


    # The Migration to Linux


    A major benefit of the two projects, and the adoption of Linux as the strategic
    server platform, is the consolidation of all City''s schools into one computing
    centre, helping to address the issues (and costs) of management and security.
    A common skill set can support both networks, policies can be managed and enforced
    centrally, and support staff will spend less time travelling to the City''s 100
    schools.


    The City thoroughly investigated the move to Linux in detail to identify any potential
    risks. The perceived risk of not being able to recruit support staff with Linux
    skills has proved unfounded, as there is a good supply of high quality candidates
    emerging from university with both UNIX and Linux skills.'
