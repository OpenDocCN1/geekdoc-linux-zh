  md: '# DEPLOYMENT


    Novell''s enterprise-level support services go beyond providing a hotline that
    customers can call when a problem appears. When a large enterprise operates a
    new operating system, its IT organisation needs to consider many issues, including
    enterprise architecture, network infrastructure, training for both technicians
    and endusers, application support and availability, and data conversion and integration.
    In order to be successful, IT organisations also need to plan carefully for pre-implementation
    and post-implementation considerations, including configuration management, availability,
    backup and recovery procedures, and functional and performance testing, before
    they can put new servers into production.


    Although some organisations may possess some of the necessary skills, they will
    recognise the value of their skills being complemented and supported by a large
    vendor with extensive and deep experience in operating systems, networks, and
    IT infrastructure providing them with support. In common with some others in the
    industry, Novell has solid experience of providing worldwide, round-the-clock
    support services to large companies.


    The company has two decades of enterprise-level support to its customers. Novell
    Technical Support has been supporting a variety of products on Linux for some
    time. Its global support teams can provide 7x24x365 support for its Linux customers,
    covering the network services layer down to the internals of the operating system.
    The company offers both free and paid support for Novell products running on Linux.
    Free support services include a KnowledgeBase, on-line product support forums,
    downloadable technical documents and patch information, and Cool Solutions communities
    that exchange tips, tricks, and free tools (http://support.novell.com/).


    # The company has two decades of delivering enterprise-level support to its customers.


    Customers can purchase Premium Support, providing a broad range of service levels
    designed to meet the needs of all customers who run Novell software on various
    platforms, including Linux, NetWare, Microsoft, and others. Customers can opt
    for per-incident support, via telephone or electronically.


    Novell Training and Certification Services help customers who deploy Linux-based
    solutions obtain the greatest value through range of free and paid support services,
    as well as comprehensive training and certification programs that enable organisations
    to attain the maximum benefit from their Linux platforms.


    Novell has responded to this by introducing the Novell Certified Linux Engineer
    training as the latest in its certifications. Novell Training Services pioneered
    IT certification with the release of its Certified NetWare (later changed to Novell)
    Engineer (CNE®) programme. The CNE was followed by the release of several more
    industry recognised certifications, including the Certified Novell Administration
    SM (CNASM), the Certified Directory Engineer® (CDE®) and the Master Certified
    Novell Engineer (MCNES). Novell says that there are more than 350,000 IT professionals
    who carry Novell certification credentials.'
