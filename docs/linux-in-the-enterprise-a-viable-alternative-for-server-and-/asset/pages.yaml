  md: '# Linux in the Enterprise


    www.butlergroup


    In order to exploit the usefulness of mobile devices there needs to be seamless
    integration of communication technologies and a focus on ease of use due to the
    physical constraints of the device. The three incumbent industry standard OSs
    in this space are Symbian, PalmOS, and Microsoft Mobile. In the short term, Linux
    will find it very difficult to break into this market due to the support for Symbian
    by Nokia and others on the smart phone, the dominance of Microsoft and PalmSource
    on PDAs.


    # Embedded


    Linux is gaining in popularity within the embedded and appliance OS market. Whilst
    not being a true Real-Time OS (RTOS), the introduction of the 2.6 kernel, with
    a number of improvements very pertinent to the embedded market and the adaptability
    of Linux, make it a viable platform for embedded computing.


    # The Linux 2.6 kernel contains improvements to support the smallest microprocessors
    right up to the large processor systems.


    This market offers plenty of opportunity for the growth in Linux usage. Device
    types requiring an embedded OS span the wristwatches of the future right up to
    switches in a network. The Linux 2.6 kernel contains improvements to support the
    smallest microprocessors right up to the large processor systems. The extensive
    use of POSIX threads, signals, and timers in the kernel means that developers
    can easily port the application to a POSIX-compliant RTOS should the need arise.
    Other enhancements relevant to embedded processing include better synchronisation,
    a more efficient scheduler, and pre-emption points in the kernel.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_79_0.png)


    Figure 6.1.3: Embedded Linux Distributions (Source: LinuxDevices.com)


    In the embedded space no single distribution has gained the majority of the market,
    as can be seen by the results of a survey conducted by LinuxDevices.com. When
    using embedded Linux there is still the propensity for developers to create their
    own Linux system from the source freely available. Leading distributions used
    in embedded systems include uClinit, Debian, Red Hat, and MonteVista.


    80 Section 6: Market Analysis


    September 2004'
