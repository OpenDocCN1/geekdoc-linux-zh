    # Solution Analysis


    Linux is now a viable alternative for many businesses. Doing more with fewer resources
    infrastructure optimisation and on-demand computing are becoming the central focus
    for many IT managers. Linux offers the potential to consolidate platforms through
    its ability to run on numerous hardware and has proven qualities in areas such
    as resilience and scalability.


    Horizontal and vertical scalability are possible when using Linux. Vertical scalability
    allows solutions and applications to run on platforms that offer a better performance,
    as moving from a low-end Intel server to a high-end RISC based platform, or even
    a mainframe. Horizontal scalability enables the addition of processing power to
    an existing environment, as blades with virtualisation and provisioning. CA''s
    product suite on Linux supports both types of scalability. The solutions can be
    moved from Intel, to mainframe seamlessly. The management tools are able to discover
    and administer both approaches.'
