  md: '# Serviceability


    It is vital for the system to be aware of failing points, highlighting these to
    the operator at the earliest stage, and the ability to self heal is now a key
    requirement. The capability of the distribution to diagnose and fix problems is
    the foundation for an enterprise-capable offering. A bug or fault is irritating
    but to be expected from time to time. However an unfixable problem is indefensible.
    Good serviceability reduce the impact on the availability and reliability of the
    system. Linux is supported by third-party tools and utilities that meet the key
    service requirements of:


    +   - A range of failure prediction tools.

    - Failure data capture.

    - Automatic problem detection and resolution.

    - Off-line analysis.


    # Recovery


    No one wants to deal with crashed servers, however, the complexity of the devices,
    interacting with many uncontrolled elements, despite the resilience features employed,
    will inevitably meet problems from time to time. The ability to undertake a quick
    and automated recovery is of considerable advantage. This not only in the large
    data centre hosting e-business applications, but also for example, in retail outlets,
    where a local server may be the point-of-sale terminals and authorising card credit
    and payments. This situation may be just as-critical as the data centre, but the
    likelihood is that there is no operator or IT manager on site. The latter situation
    automated recovery and remote management is essential.


    Automatic recovery functionality and features need to be available not for a complete
    server crash, but also for failures of individual components. As with the resilience
    features, not all recovery features are applicable to every solution, and often
    require appropriately skilled staff to be effective. Support for Linux systems
    is now included in many recovery solutions over the market.


    # Conclusions


    +   - Reliability – The Intel architecture upon which the majority of Linux systems
    are based is inherently robust and the Linux 2.6 kernel brings improvements in
    this area.

    - Availability – Linux systems can be built to provide high-availability.

    - Serviceability – There are a range of open source and third-party proprietary
    solutions on the market.


    # 3.2 SCALABILITY


    Scalability consists of the capacity to scale up where a number of distributed
    systems are connected together, and scale out, which involves the use of a number
    of processors contained within one system. The ability to scale out is particularly
    important when considering a server consolidation strategy.


    # Linux systems now feature in many of the Transaction Processing Council’s benchmarks.


    Linux systems now feature in many of the Transaction Processing Council’s benchmarks.
    Linux scalability can also be achieved by using virtual machines. Four technologies
    that can improve scalability, Non-Uniform Memory Access (NUMA), clustering, and
    Hyper-threading.'
