  md: '# Utility Computing


    One of the major issues facing IT management is how to quickly adapt the infrastructure
    to meet market-based changes without interrupting system operations. IT managers
    are required to administer an increasingly complex, multilayered architecture
    that spans across many boundaries within the organisation. The concept of utility
    computing has been created as a way of meeting these demands, providing IT managers
    with the framework to support the establishment of a service-centric computing
    model.


    A key feature is the capability to quickly deploy additional system resources
    when required, with the ability to bill for services in a similar way to that
    of public services such as electricity or water supply. This environment should
    provide modular expansion and central administration, where possible, on Internet-based
    and industry-standard IT architectures and infrastructure. Of equal importance
    is effective capacity planning, with increasing significance due to the many external
    stakeholders requiring access to systems.


    Responding to the challenge of managing a complex environment with less human
    intervention is IT vendors to concentrate on the edge of self-managing systems.
    The main aim of this technology is to hide complexity from users whilst making
    it easier to realise the benefits of IT systems without suffering sprawling systems
    management costs.


    Self-managing capabilities enable organisations to match IT capacity with demand,
    and to charge based on, rather than cost of computing environment. A on-demand
    architecture delivers reduced complexity, flexibility to adjust to any changing
    environment, and a clearly-defined Quality of Service (QoS).


    Managing the computing environment of a large number of autonomous IT ''islands''
    will become a thing of the past. The ideas behind virtualised systems from a computer
    science perspective have been around for a long time, and they underpin the strategies
    for optimizing infrastructure. IBM is in On Demand computing as other companies,
    such as HP, Oracle, and Sun, are also aligning their strategies in one form or
    another, around the concept of utility computing. The aim is better use of computing
    resources and improved services to clients, without an escalation of management
    problems and costs. Linux forms a fundamental component in this utility computing
    vision and can be utilised in all areas of the IT infrastructure including clients,
    Internet access, line-of-business applications, and back-end data solutions.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_56_0.png)


