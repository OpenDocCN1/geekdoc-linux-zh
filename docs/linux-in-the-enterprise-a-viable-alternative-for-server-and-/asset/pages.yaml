  md: '# Linux in the Enterprise


    The IT industry has focused on the large corporations where it is possible to
    sell large amounts of services for Linux deployments. In the early days of Linux
    each implementation was different and integration and testing of the software
    stack with the Linux distribution was nearly always required. As the market matured
    this requirement has lessened, the major vendors and solution providers bringing
    out reference architectures built on Linux and OEM hardware. This enables an out-of-the-box
    deployment experience with minimal resources for configuration and better interoperability,
    which is more suited to smaller organisations.


    # Major barriers for the adoption of Linux by an SME include, in many instances,
    the fear of change and the migration overhead, plus on-going costs.


    Channel partner and ISV support for Linux is a critical litmus test for many SMEs.
    Many ISVs, including those providing software to SMEs, have now ported their applications
    to Linux. On the other hand, many SMEs utilise Microsoft Windows and associated
    technology almost exclusively, and for these companies moving to Linux presents
    a number of difficulties, not least the use of a new OS with all the added complications
    and issues.


    In spite of this is now gaining amongst SMEs in the UK and elsewhere. A survey
    conducted last year by Van Bourne for IBM showed that in four SME respondents
    currently use Linux. Of those using Linux, 15% showed that they were likely to
    use it in the future, with a further 26% uncommitted.


    The survey also highlighted the critical role that the channel plays in encouraging
    SMEs to migrate to Linux. Business partners, professional organisations, and consultants
    were highlighted as the most important sources of information for the SME, whereas
    large enterprises tend to be influenced directly by the IT vendors themselves.
    This is probably another reason for the apparent lag in the adoption of Linux
    by SMEs, due to the time taken for the channel to gain the required knowledge
    and experience.


    There is a real opportunity for SMEs with a mixed UNIX and Windows environment
    to consolidate onto a single platform both systems development and the production
    environment regardless of the underlying hardware. This flexibility gives the
    SME user the ability to use commodity hardware from different vendors, which could
    be utilised.


    > The scalability and flexibility provided by Linux can now make solutions available
    to SMEs that were previously too costly.


    The scalability and flexibility provided by Linux can now make solutions available
