    with worldwide coverage are Red Hat and SUSE LINUX. In Asia there appears to be
    growing in the market and a real interest in migrating to Linux. Due to political
    and local issues the Asian market has seen the emergence of Turbolinux and Asianus
    as strong contenders.


    In the early adoption of a technology there are vertical sectors that take to
    the technology before others. Linux has seen initial use in the public sector
    and financial services area. This is now widening to all business sectors as the
    benefits of Linux become apparent. Linux use is penetrating all of the IT infrastructure.
    Most large organisations are already utilising Linux to some extent and there
    are signs that the Small to Medium-sized Enterprise (SME) market is beginning
    to warm to Linux.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_77_0.png)


    Figure 6.1.2: Linux Sector Adopter (Source: IBM)


    # Linux Markets


    # Server


    There are two ways to manage the server Operating System (OS) in the network,
    such as a firewall, gateway, router, an application server, or database server.
    At the high end are the OSs that handle large multi-processor servers, or clusters.
    Linux is well established at the lower end and the expectation is that it will
    further erode the market of operating systems at the high end, especially now
    that the 2.6 kernel has a scalability of features added, enabling better memory
    management and support for more processors.


    The majority of customers in this market will not be considering an OS, and quite
    not even for a specific application, but on occasions they will be looking for
    a solution, ideally an end-to-end solution, to make a business problem or requirement.
    The focus on a solution rather than point products makes the various distribution
    channels matter, be hardware vendor, service provider, Value Added Reseller (VAR),
    or Systems Integrator (SI). To be successful it is imperative that Linux distributes
    and maintain close relationships with these types of organisations.'
