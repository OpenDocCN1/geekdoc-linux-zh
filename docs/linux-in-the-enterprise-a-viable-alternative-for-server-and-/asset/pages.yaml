  md: 'butlergroup.com


    # Linux in the Enterprise


    This section of the Report is made up of three main parts:


    +   1. Butler Group Linux in the Enterprise Features Matrix (Section 7.1).

    2. Butler Group Linux in the Enterprise Product Capability Diagrams (Section 7.2).

    3. Butler Group Linux in the Enterprise Lifecycle Positions (Section 7.3).


    Butler Group invited vendors whose solutions it believed best fit the subject
    matter of this Report – Linux in the Enterprise – with an emphasis on the Linux
    distributions rather than just kernel, to participate in an evaluation and comparison
    exercise. The selected vendors cooperated with Butler Group Analysts in the research
    for the Technology Audits, which appear in Section 9, and in compiling the Features
    Matrix, which appears in this section. In Butler Group''s opinion these vendors
    and their products carry a significant portion of the market and are highly representative
    of what products and solutions should be capable of delivering in this sector.


    The Technology audit process involved a Butler Group Analyst examining each solution
    under review, discussing its strengths and weaknesses with the vendors, and then,
    based on the analysis, producing an evaluation. The evaluation is performed in
    a comparative manner in the Features Matrix, where all the solutions'' capabilities
    are marked relative to each other; and in an absolute manner, where each solution
    is scored to see how well it delivers in each of the main functionality areas.
    These scores are shown as Product Capability Diagrams in the second part of this
    section. Finally, the vendors are grouped in an overall manner according to how
    they perform in the market under consideration, and in how Butler Group believes
    their individual position will evolve in the market over the near to longer term.


    With any area such as this, there are a number of different approaches, and it
    is not always possible to make direct comparisons. For example, some of the vendors
    we spoke with provide solutions only, and others have a hardware legacy to continue
    to support. In any situation, the user must make their own evaluation of the vendors''
    offering.


    The Features Matrix is based on an extremely rigorous and robust methodology,
    which took into account areas of Reliability, Scalability, Security, Interoperability,
    and Management. The final analysis in the scoring and market positioning is an
    attempt by Butler Group Analysts to reach an objective view of the vendors'' solutions,
    taking into account the above main topics as well as how the vendor addresses
    the market.


    September 2004


    Section 7: Tables 89'
