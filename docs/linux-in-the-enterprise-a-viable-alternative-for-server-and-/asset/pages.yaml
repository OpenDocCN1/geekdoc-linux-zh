  md: '# Linux in the Enterprise


    # Linux Support


    A major element of Linux is to manage the range of peripheral devices attached
    to the server and client. Devices have generally been developed on a piecemeal
    basis, either as an opportunistic discovery or in relation to a specific operational
    issue. Many of these devices tend to be designed to industry standards that may
    or may not be widely accepted.


    Other devices, because of widespread and rapid adoption, have become facto standards.
    While availability of peripheral devices is not key as a business element in the
    selection of an OS as the processor, because the devices are linked to a particular
    architecture, the capacity of an OS to design and manage such devices directly
    improves reliability and reduces overheads.


    This is an area of significant change in the Linux 2.6 kernel, with the creation
    of the unified model enabling representation of the device architecture leading
    to improved device management and better power management control. Driver support
    can be an issue with Linux distributions, whereas vendors make Linux a Tier I
    OS This situation is improving. Drivers for niche devices and legacy equipment
    can be hard to come by. It is important to verify that drivers are available for
    all the intended hardware in a Linux system.


    There are a number of standards that a Linux distribution must support to be credible
    in the enterprise area. These include:


    # Small Computer Systems Interface (SCSI)


    SCSI is a series of standards for the connection of storage devices by disks and
    tapes through a single channel. In one SCSI port, up to 16 devices can be connected
    in a chain. SCSI was developed for larger servers, primarily UNIX machines, but
    SCSI adapters are widely available for the Intel architecture as well.


    # Fibre Channel – Arbitrated Loop (FC-AL)


    Fibre Channel will transmit data between servers and other computer devices at
    very high speeds. Currently this is 1Gb/ps but a specification for 10Gb/ps is
    being developed. Fibre Channel is ideal for connecting distributed or shared storage
    devices. Despite its name it is not a specification exclusively for optical fibre.
    The specification supports the speeds of transmission across twisted pair and
    coaxial cables for short distances.


    # InfiniBand


    The InfiniBand Architecture (IBA) provides a high-speed fabric subsystem linking
    the processor and I/O nodes to form a Storage Area Network (SAN). This connectivity
    mechanism moves away the use of buses by employing channels. The architecture
    is independent of the host OS and the processor platform. The Open Alliance, including
    Dell, Intel, and Sun, is working on expanding IBA within Linux. The group is defining
    a common set of software utilities, InfiniBand hardware drivers, and networking
    protocols, such as IP over InfiniBand, and the Message Passing Interface (MPI)
    used in high-performance computing.


    # Removable Storage


    Removable storage can refer to hard disks and memory sticks. With the Ability
    of OS to address signify volumes of data, the need for removable storage support
    is decreasing. This method is often used as a back-up solution.


    # Redundant Array of Independent Disks (RAID) Storage


    RAID separates data across a number of disks, in a process known as stripping.
    It uses an algorithm with calculated checksum-digits to ensure that if any disk
    fails the data is not lost and the computer can reconstruct the missing data and
    operate if the disk was still there. To the OS the array of disks appears as a
    single hard disk. There are ten specifications for RAID, including a non-redundant
    array (RAID-0).'
