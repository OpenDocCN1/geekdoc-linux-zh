  md: '# PHP


    PHP is a script language and interpreter used on Linux servers.


    # PKI – Public Key Infrastructure


    A PKI allows users of a public network to securely and privately exchange data.


    # POP – Point Of Presence


    An access point to the Internet.


    # POSIX – Portable Operating Systems Interface


    An IEEE 1003.1: standard that defines the interface between a UNIX operating system
    and application programs.


    # PPP – Point-to-Point Protocol


    Provides dialup access over serial lines.


    # QIC – Quarter Inch Cartridge


    A commonly used tape drive.


    # RADIUS – Remote Authentication Dial-In User Service


    An access method, which uses a challenge/response method for authentication.


    # RAID – Random Array of Inexpensive Disks or Redundant Array of Independent Disks


    A method of storing the same data on multiple hard disks.


    # RAM – Random Access Memory


    The area in a computer where the operating system, data, and applications in current
    use are kept.


    # RISC – Reduced Instruction Set Computing


    A microprocessor designed to perform a smaller set of computing instructions with
    the aim of making faster.


    # Samba


    An Open Source file and print server.


    # SCO – Santa Cruz Operation


    A provider of server Operating Systems.


    # SCSI – Small Computer Systems Interface


    A method of connecting servers to their storage devices.


    # S-HTTP – Secure Hypertext Transfer Protocol


    Secure HTTPS, An extension to HTTP allowing for the secure exchange of files over
    the Web. Each S-HTTP file is either encrypted, contains a digital certificate,
    or both.


    (Also see HTTPS for an alternative to S-HTTP).


    # SMP – Symmetrical MultiProcessing


    A number of processors can be run simultaneously.


    # SMTP – Simple Mail Transfer Protocol


    A TCP/IP protocol used in sending and receiving e-mail. Most commonly, SMTP is
    used for sending, and each POP3 or IMAP is used for receiving.


    # SOCKS5


    An industry-standard firewall traversal solution. It provides a secure data channel
    between two computers.


    # SPARC – Scalable Processor Architecture


    A high-performance processor from Microsystems based on RISC technology.'
  merge: -1
