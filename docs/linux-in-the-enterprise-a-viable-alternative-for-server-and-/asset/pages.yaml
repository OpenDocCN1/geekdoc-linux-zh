  md: '# Linux in the Enterprise


    HP has four pillars that underpin its Linux strategy:


    **1. Breadth of Hardware Platforms** - All servers, desktops, and PDAs will run
    Linux, and there are drivers available for the full range of HP printers. Linux
    can be downloaded to an HP iPAQ if required. HP staff will provide up to third-level
    support on all devices, across the major Linux distributions, including Red Hat
    and SUSE.


    **2. Deploy with Confidence** – This is HP''s response to the concerns raised
    by business users regarding the ‘business readiness’ of the Linux platform, and
    its supporting services.


    +   - HP has recognised the wide concern expressed by the business community by
    the action of SCO Group stating that Linux was its copyright. In response, HP
    has created an indemnification programme for those organisations purchasing hardware,
    software, and support from HP. If such organisations are sued by SCO Group, then
    HP, under the programme, will support the case with a legal team.


    +   - HP uses itself to demonstrate confidence in Linux. It uses Linux internally
    on over 5,000 servers throughout the organisation worldwide, and e-mail for HP
    is delivered by Linux-based servers. The company also cites its relationship with
    the Linux Community, and is a major supporter of the Open Systems Development
    Labs (OSDL).


    **3. End-to-End Solutions** – HP offers a complete solution of certified and tested,
    hardware and software. HP re-s the operating system, whether Red Hat or SUSE,
    and provides both first and second level support, only escalating the third level
    to Red Hat or SUSE as HP uses a series of tools for rapid deployment, including
    its complementary system management tool, HP Systems Insight Manager, which runs
    natively on Linux, and OpenView. HP’s Adaptive Management platform addresses multiple
    platforms, data centre staff can use the same tools to manage the Linux infrastructure
    as they do for Microsoft Windows or other environments.


    **4. Deliver Best Return On Investment (ROI)** – HP believes that through the
    freedom, and flexibility offered by its industry-standard hardware, as well as
    its software agnostic approach, its customers get solutions that are a better
    ‘fit’ to their business needs, and thus derive greater value.


    HP has partnered with major Independent Software Vendors (ISVs) including BEA,
    SAP, Oracle, along with content providers such as Reuters and Bloomberg, with
    whom it tests all releases and tweaks performance as required. HP has also partnered
    with Open Source software providers MySQL and JBOS, and includes their offerings
