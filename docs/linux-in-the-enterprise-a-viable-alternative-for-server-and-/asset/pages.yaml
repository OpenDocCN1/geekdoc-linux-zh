  md: '# 3.1 RESILIENCE


    # Reliability, Availability, and Serviceability (RAS)


    IT managers responsible for enterprise systems have a keen interest in issues
    such as failover and High Availability (HA), as many of the applications are now
    critical to the operation of the business. It is imperative that systems are very
    reliable and continue to operate even when components are removed for replacement
    or maintenance. Linux has made great strides in terms of meeting the resilience
    requirements of the enterprise user, especially in the 2.4 and, most notably,
    2.6 releases of the kernel and the commercially available distributions now obtainable.


    # Reliability


    There are many factors that determine reliability of the Operating System (OS),
    both in the code and in the hardware components supported. The ability to recover
    quickly from a failure is important, it is better not to have the failure in the
    first place.


    The IBM Linux Technology Centre has run a reliability evaluation to demonstrate
    that the Linux kernel and other core OS components are dependable and stable over
    30, 60, and 90 days, and can provide a robust, enterprise-level environment over
    long periods of time. The results of the tests and observations over the duration
    of the runs included:


    +   - Linux kernel and other OS components, including libraries, device drivers,
    file systems, networking, and memory management, operated consistently and completed
    all the expected durations of runs with zero critical system failures.


    +   - Linux system performance was not degraded throughout the long duration of
    the run.


    +   - The Linux kernel properly scaled to use hardware resources (CPU, memory,
    and disk) on Symmetric MultiProcessing(SMP) systems.


    +   - The Linux system catered well for continuous full CPU load (over 99%) and
    high memory stress.


    +   - The Linux system handled overloaded circumstances correctly.


    > The Open Source Development Labs (OSDL) is now heavily involved with kernel
    testing.


    The Open Source Development Labs (OSDL) is now heavily involved with kernel testing.
    The Scalable Platform and Patch Manager offers an open, publicly accessible workbench
    for the submission and testing of kernel patches. It also makes available automatically
    generated data from a variety of kernel versions. The OSDL Database Test Suite
    contains three kernel workloads developed to simulate complex database workloads
    found in data centre applications.'
