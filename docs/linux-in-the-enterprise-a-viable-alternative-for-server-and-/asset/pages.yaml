  md: '# # Red Hat Red Hat Enterprise Linux and Red Hat Desktop v. 3


    # ## Abstract


    The Red Hat Enterprise Linux family of operating systems provides Linux platforms
    for large organisations, Small to Medium-sized Enterprises (SMEs), and technical
    workstation and High Performance Computing (HPC) requirements. These are backed
    up by the Red Hat Desktop that provides complementary technology and services.


    Red Hat also offers Red Hat Network, an enterprise systems management platform
    for the Linux infrastructure so that systems administrators have the tools to
    efficiently manage their networks. The contributions of Red Hat''s partnerships
    are seen as important elements in providing the breadth of applications and services
    that are important for customers.


    Enterprises can have the confidence that through Red Hat training and professional
    services, backed up by their partners'' capabilities, efficient deployment of
    Red Hat Linux can be successfully achieved.


    # ## KEY FINDINGS


    +   - Based on open standards and open source development methods.

    - Scalability and management features for business critical deployments.


    +   - Wide endorsement by leaders in the IT industry.

    - Red Hat upset its fans by discontinuing its low-end Linux distribution.


    +   Key: Product Strength Product Weakness Point of Information


