    # Western Gas Resources


    Western Gas Resources is an independent natural gas producer, gather, processor,
    transporter, and energy market dealer in Denver, Colorado. The US owns 17 processing
    plants connected to more than 9,300 miles of pipeline in the Rocky Mountains,
    mid-continent, and West regions of the United States. For 2003, its revenues were
    $52.5 billion. Western Gas utilises Dell Servers running Oracle databases on Linux
    and Network Appliance (NetApp).


    Having previously used Oracle Financials on proprietary UNIX platforms in 2002,
    Western Gas began to migrate its Oracle databases from UNIX and Windows servers
    to Oracle on Linux servers running Red Hat Enterprise Linux. The company had determined
    the migration would lower costs and ensure the scalability needed to handle anticipated
    growth in the volume of data.


    The high-level Project Goals for the migration to Linux and NetApp storage were:


    +   - The ability to deliver reliable performance.

    - Provision of high availability and scalability.

    - Meeting the storage demand for managing the 50% growth in data per year.

    - To provide fast, safe, easy back up, and recovery of the Oracle databases.

    - Conformance to the company''s disaster recovery plan.

    - To deploy a cost effective, enterprise-class application infrastructure.


    The NetApp storage gives Western Gas the ability to allocate storage cost-effectively.
    As the NetApp is clustered, Western Gas can scale on to meet an anticipated 50%
    annual growth in the volume of stored data. NetApp has also provided Western Gas
    with a reliable disaster recovery solution for its Oracle Database and data. Tests
    have shown that a production server can be up and running in less than one hour.


    As part of the business case for the migration, Western Gas''s own cost-benefit
    analysis demonstrated that it could purchase four times the server power by using
    Dell servers and Linux, than by upgrading its existing hardware.'
