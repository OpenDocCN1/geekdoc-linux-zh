  md: '# Linux in the Enterprise


    ABI – Application Binary Interface

    The interface through which an application gains access to the operating system.


    ACL – Access Control Lists

    Responsible for granting or revoking access to specific system objects, e.g. file
    directory.


    ACPI – Advanced Configuration and Power Interface

    An open-industry specification for industry-standard interfaces for OS-directed
    configuration and power management on laptops, desktops, and servers.


    Alpha

    A 64-bit processor developed by Digital Equipment Corporation, prior to acquisition
    by Compaq and the latter''s subsequent merger with Hewlett-Packard.


    Apache

    A Web server distributed under an Open Source licence. It runs on most UNIX-based
    operating system and Windows 2000.


    API – Application Programming Interface\An interface defined by a program that
    allows a programmer to make calls to that application.


    APM – Advanced Power Management

    The capability built into portable computers to monitor and control its power
    consumption so that it reverts to ''standby'' mode when not in use.


    ASP – Active Server Pages

    Allows the contents of a Web page to be generated on-the-fly.


    BIND – Berkeley Internet Name Domain

    BIOS – Basic Input Output System

    Code contained in a computer that is held on a chip and used to supply an interface
    between the hardware and the operating system.


    BSD

    Originally Berkeley Software Distribution, this now refers to the specific version
    of the UNIX operating system that was developed at the University of California,
    Berkeley.


    C2 Security Level

    A security rating established by the US National Computer Security Center and
    granted to products that pass specific security tests.


    CPU – Central Processing Unit

    One or more CPUs give a computer the ability to run software, such as an operating
    system.


    DAT – Digital Audio Tape

    A standard tape format that has evolved into a widely used audio archiving technology.


    DES – Data Encryption Standard

    A mehod of data encryption using a secret key.


    DLT – Digital Linear Tape

    A well-established tape standard with a back-up speed of 20GB per hour.


    DNS – Domain Name System

    Locates Internet domain names and translate them into IP addresses.'
