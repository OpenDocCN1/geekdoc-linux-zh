  md: '# Linux in the Enterprise


    In 2001, Novell acquired Cambridge Technology Partners, a leading eSolutions consulting
    firm, to strengthen its ability to deliver both services and products to customers,
    in the context of their e-business requirements. This was further advanced in
    2002 by the acquisition of ServerStream Software, a leader in Web-based application
    development, finally positioning Novell with business expertise, a Web applications
    platform (Novell extend, developed from ServerStream products), and a networking
    and identity management infrastructure to run Web services-based applications.


    The company''s growing commitment towards Linux was the background of its acquisition
    of Xianian (a provider of Linux-based tools), and the acquisition of SuSE, completed
    in 2004. Novell plans to establish very its firm in the presence of operating
    system, networking technology, and development activities in the Linux and open
    source areas, building on its position infrastructure management and identity-driven
    services.


