    # 2.3 LINUX HISTORY


    In 1991 Linus Torvalds, a Finnish engineering student, when seeking to produce
    a UNIX-like OS for Intel processors with the assistance of volunteers using a
    Web site, re-wrote a small version of Linux called MINIX, creating the first Linux
    kernel. Available from the Web site, Linux rapidly became popular with students
    and academia, as it was ''free''. By placing the Kernel in the Open Source community
    under the GNU Public Licence (GPL), created by the Free Software Foundation, enabled
    Linux to quickly and protect against anyone claiming their own proprietary version
    of Linux.


    During the early 1990''s Linux gained all the features required to operate as
    a replacement for a UNIX workstation. Many different user groups were founded
    at this time and the Linux Journal magazine launched. The collaboration between
    a loose network of users continued to maintain and improve the OS. Importantly,
    the kernel remained compliant with the Portable Operating System Interface (POSIX)
    standard and included the addition of all the features found in UNIX, such as
    being based on UNIX-like structure with three main areas of code – kernel modules,
    and shared libraries.


    | Compilers | User Processes | System Management Utilities | User Utilities |

    |---|---|---|---|

    | | | Shared Libraries | |

    | | | Linux Kernel | |

    | | | Loadable Kernel Modules | |


    Figure 2.3.1: Linux Components


    The kernel is the term used for the core code of Linux, interacting between the
    commands from applications and the hardware devices that form the computer. The
    kernel is loaded into a protected area of memory, and provides services on request
    to applications through system calls. Requests for the kernel are prioritized
    and managed using an interrupt handler to prioritise the I/O operations, a scheduler,
    and a supervisor to assign priorities to the tasks. Applications, including application
    servers, are certified against specific kernel releases, thus management and control
    of kernels across servers is important.'
