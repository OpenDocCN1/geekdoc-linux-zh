  md: '# Linux the Enterprise


    The Open Source Software (OSS) approach to Linux development is advantageous for
    the public sector in a number of ways, not least the perceived benefit of Open
    Source being available for no or lower cost. However, as previously reiterated
    in Reports, this element of the costs is only a small percentage of the TCO and
    it is important that other overhead are included in the overall equation, such
    as staff costs, integration, migration, training, and support. Despite this the
    public sector is enthusiastically adopting Linux within all areas of the IT environment.


    Another particularly appealing aspect of the open source model is that it gives
    independence from commercial software vendors, which reduces the need for proprietary
    tools and standards, preventing reliance on one supplier. Governments are keenly
    aware of the requirement for use of common standards that are not under the exclusive
    ownership of one vendor. Public sector organisations have for a long time had
    no alternative but to use an OS from one vendor; Linux now offers the opportunity
    to utilise an OS that is not ''owned'' by an individual supplier and is based
    on open standards.


    # Other characteristics of Open Source that make Linux an attractive choice as
    an OS for government includes the availability of the source code provides transparency.


    Other characteristics of Open Source that make Linux an attractive choice as an
    OS for government includes the availability of the source code which provides
    transparency, enabling interested parties to review the code and gain an understanding
    of how the OS works. Although no piece of software can guarantee 100% security
    proof, at least Linux has been through extensive peer review and the code can
    be checked to ensure that there are no hidden back doors, or secret agents embedded
    in the program. It also enables support to be obtained from multiple sources,
    not just from one vendor with access to their proprietary code.


    While not many user organisations are looking to update or enhance Linux source,
    the knowledge that this is permissible allows a certain degree of comfort that
    public sector agencies will be able to cater for any unforeseen circumstances
    that may crop up in the future, and new developments be embarked without worrying
    about legal constraints. A local ecosystem can be built up around the specific
    Linux distribution, bringing interaction between the public service provider and
    the local population. This is especially important to local government where something
    can be put back into the community and not lost to commercial organisations purely
    fixed on profit and shareholder value.


    The removal of licensing restrictions should not be underestimated, as there is
    a significant management overhead in administering a large user population, ensuring
    of that licenses are kept up-to-date and matching the software deployed in the
    infrastructure. This flexibility in the use of OS enables it be redistributed
    around a large user community with impunity and the use of the GPL license means
    that rights cannot be withdrawn.


    The UK government has launched a number of initiatives to try Linux in the public
    sector, included as a wider remit to look at the use of Open Source software as
    an alternative to proprietary offerings. The Office of Government Commerce (OGC)
    and the Office of the e-Env are taking a leading role in recommending that government
    departments consider Linux as an alternative during the procurement of IT systems.
    Nottingham City Council is examining the feasibility of Linux on the desktop.'
