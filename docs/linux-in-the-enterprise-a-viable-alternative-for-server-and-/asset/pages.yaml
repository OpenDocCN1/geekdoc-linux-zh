  md: '# Linux in the Enterprise


    There could now be the beginnings of a sea change on the desktop, with Linux client
    offers available from Red Hat, IBM, Novel, and Sun. However, giving credence will
    be no easy task, and the solutions must deliver the equivalent convenience and
    integration of the incumbent Windows environment. A number of early adopter public
    organisations, such as Munich, City of Bergen, and Schwabisch councils, are now
    deploying Linux and Open Source on the desktop. For the skeptical, Knoppix 3.4
    or SUSE Live 9.1 and boot from the CD to see how far the Linux desktop has come
    in recent times. The Open Source tools, deployed on a Linux desktop, will be playing
    ''catch-up'' with Microsoft Office for the foreseeable future. The product that
    appears to have ''lagfrogged'' the microsoft table is quite the Mozilla Browser.


    # Market Issues


    An important reason why Linux has successfully evolved into an enterprise-ready
    OS is the creation of a mutually beneficial ecosystem. Over the past couple of
    years the Open Source community and the commercial sector have adapted to each
    other and this has allowed the commercialisation of Linux to grow from strength
    to strength. The use of the Open Source development model has proved very good
    at producing efficient and robust code, but possibly not the catalyst for innovative
    improvements that have been advocated by many in the Open Source community. The
    openness and flexibility surrounding Linux is particularly appealing to public
    organisations.


    > To be a credible offering in the enterprise space Linux must have Independent
    Software Vendors'' (ISVs) support.


    A credible offering in the enterprise space Linux must have Independent Software
    Vendors'' (ISVs) support. While in the early days this was lacking is no longer
    the case, especially as IBM has provided active assistance to ISVs to port their
    applications. Linux is now a Tier 1 OS for the majority of ISVs and hardware vendors.
    The main beneficiaries are Linux enterprises from Red Hat and Novel, making them
    the leaders in the market. The availability of reference architectures from HP,
    Oracle, and others has found confidence in the Linux market.


    The health of the Linux ecosystem very much depends on service providers to supply
    Linux support and other resources to users. IBM has played a leading role in growing
    the Linux market. Additionally, many ISVs, hardware vendors, and service providers
    donate software back to the Open Source community for inclusion in the Linux kernel.
    A worry is the fragmentation of Linux; however, the fact that no single vendor
    controls the kernel has far prevented this.


    > Linux offers an alternative and is worthy of consideration as and when decisions
    on future OS strategy become necessary.


    There are significant trigger points on the horizon for many IT managers including
    the withdrawal of Windows NT support, hardware replacement, and the Windows Longhorn
    release. Linux offers an alternative and is worthy of consideration as and when
    decisions on future OS strategy become necessary.


