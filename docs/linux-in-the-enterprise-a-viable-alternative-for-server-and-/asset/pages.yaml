  md: '# Linux in the Enterprise


    Virtualisation technology has long been an integral part of the zSeries server,
    enabling the creation and management of virtual processors, communications, storage,
    and I/O devices in a single physical mainframe. The resources can be dynamically
    shared and reconfigured to meet the current demands, assisting with catering for
    new workloads. The technology also enables the cloning and deployment of virtual
    servers in minutes rather than days, helping to speed up time to market and provide
    a low cost environment for virtual development, testing, and trialing of services
    without the need to invest in new hardware.


    Server consolidation can be achieved by using zVM. Linux workloads can be scaled
    up by adding virtual processor, memory, and I/O capacity, or scaled out by creating
    additional Linux machines. z/VM also supports Integrated Facility for Linux (IFL),
    an optional hardware feature available on the zSeries providing processors exclusively
    for Linux workloads, and included as standard on some models. This facilitates
    the purchase of processing capacity for the use of Linux environments and therefore
    has no impact on software changes for other OSs. A dedicated zSeries Linux server
    made exclusively of IFL engines is also available.


    ![](img/767d23264d3e5471ce58a1972dfd07dc_54_0.png)


    Figure 4.2.4: z/VM


    If we take a look at the strengths of the mainframe there are a number of features
