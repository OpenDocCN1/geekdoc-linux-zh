    The company has key business partnerships with HP and Shuttle Computer. It also
    has key technology partnerships with AMD, INTEL, HP, Shuttle Computer, NVIDIA,
    and many others.


    Many of Mandrakesoft''s products are aimed at individuals and small enterprises,
    such as Discovery and PowerPack providing the most up-to-date innovation. These
    products are usually released on a 6-monthly basis. The enterprise products are
    normally released on a yearly basis.'
