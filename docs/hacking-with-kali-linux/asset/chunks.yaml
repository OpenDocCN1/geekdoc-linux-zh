    接下来我们将处理的是 Linux 系统内部的文件和目录。许多新用户在使用此操作系统时会遇到问题，因为他们并不知道存储了哪些信息，甚至不知道这些信息存放在哪里。本章旨在回答这些问题，让你的
    Linux 之之旅更加轻松。


    ### 文件的不同类型


    在大多数情况下，你将处理普通文件。这些文件存储着普通数据，例如任务输出、文本文件和程序。Linux 的运行方式与 Windows 不同，请记住这一点。屏幕上的文件看起来与你习惯在
    Windows 中看到的相似，但它们所在的存储位置和工作方式在 Linux 系统中会有所不同。


    基本上，文件系统从根目录（root）开始，也被称为简单路径；这是所有内容开始的地方，也是所有内容完成后去的地方。除了根目录及其分出的端口外，其他看起来与你在其他操作系统看到的非常相似，但你可能会发现它们现在更整洁、更容易处理。文件扩展名仍然存在以帮助用户，这在开始可能会让它们变得有些困难，但随着时间的推移，你会开始体会文件扩展名的价值，因为它们让你更容易根据需要找到文件。


    ### 文件系统的布局


    为了让内容更容易查找和理解，你会发现 Linux 上的文件系统类似于树。其结构会随着你添加或删除文件而改变和增长。总的来说，它们都源自根目录，你所做的任何更改将显示在树的更高位置。你可以根据需要添加任意的文件来使系统完善，你会看到树随着时间推移而变化。记住，文件树上的名称并不是强制要求的，但它们被用于惯例并保持方便。


    文件系统的树从 `/` 开始，这也称为根目录（root directory）。这个根目录将包含所有的底层文件以及操作系统内部显示的目录。`/` 通常会紧跟在根目录下一层的目录之后。这基本上指示了这些目录的位置，并有助于将它们与计算机上可能具有相似名称的其他位置区分开。每当你使用较新版本的
    Linux 时，确保先检查根目录以找到你想要的文件。


    ### 根目录的子目录


    根目录之后会有各种子目录，构成了系统树。你可能会发现某些子目录有用：


    - `/bin`：包含系统管理员和用户共享的普通程序。

    - `/dev`：存放 CPU 上所有外围硬件的引用。通常，这些是具有特殊属性的文件。

    - `/boot`：由启动文件和内核组成。某些 Linux 系统还包括统一引导加载程序，或 `grub`。

    - `/etc`：这是一个包含与系统配置相关文件的子目录。这与 Windows 中找到控制面板非常相似。

    - `/home`：大多数普通用户的主目录。

    - `/misc`：用于存放任何被视为杂项文件的子目录。

    - `/lib`：包含计算机上所有计算机程序的库文件。

    - `/opt`：此位置存放一些额外以及第三方程序。

    - `/root`：系统管理员使用的主目录。

    - `/proc`：这是一个虚拟文件数组，包含有关系统资源的数据。每当你想要查看此部分的更多信息时，只需打开终端窗口并输入 `man proc` 即可开始。

    - `/initrd`：存放启动过程的数据。确保永远不要删除它。

    - `/lost+found`：该目录将包含系统故障并突然关闭时保存的文件。

    - `/tmp`：你的操作系统使用的临时存储单元。你永远不要用它来保存任何工作，因为当系统重启时，此文件夹中的所有文档都会被清理。

    - `/sbin`：存放操作系统和系统管理员使用的计算机程序。

    - `/usr`：包含所有与用户相关的计算机程序的文档、程序和库。

    - `/var`：用于存储用户生成的任何临时文件和变量。这些包括文件下载、日志文件和邮件队列。


    你可以根据文件在计算机中的存储位置来找到你正在工作的文件类型。如果你不确定存储在何处，请查看这些文件开头，并根据它是什么、计算机最初认为它是什么等，看看它最适合放在哪个位置。你也可以通过将这些子目录之一添加到文件的开头，来决定你想让文件存储在何处。


    虽然这个系统在刚开始可能看起来难以理解，你可能觉得你一直在处理文件却再也找不到了，但 Linux 的保存树系统实际上比你在某些其他操作系统发现的简单得多。如果你能够在
    Windows 操作系统中导航以找到你的项目和文件，你就能轻松弄清楚 Linux 文件系统是如何工作的。这只需要一点时间来学习每个东西的称呼并适应这个新系统。


    # 第 9 章 取命令与控制


    本章将介绍强大的 Python 脚本的新来源，你可以重新利用这些脚本，通过目标机器上的外部控制系统收集数据，甚至使用现成的 API 执行命令并安装更新。到本章结束时，你应该能够创建一个
    Python 工具，你可以通过互联网远程控制它，向目标机发布命令并接收捕获的数据。


    ### 使用 Pastebin 作为命令与控制通道


    我们在键盘记录器中包含了一个终止开关（killswitch）（使用 `~` 键终止脚本），但在实际的监控程序中带有这个开关是否是一个好主意由你决定。经验丰富的黑客会将键盘记录器代码中的终止开关作为一个函数而不是简单的按键事件，这样他们在需要时甚至可以远程终止它，而不会让用户无意中杀掉记录器。

