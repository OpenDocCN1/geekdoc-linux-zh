    \n# 第 10 章 实验室\n\n第一个任务是建立我们自己的实验室。\n\n不要在实验室以外的环境下尝试我教给你的技术：这不是成为伦理黑客的正确方法！\n\
    \n我们如何构建一个可以进行模拟的受保护环境？答案很简单：我们可以使用虚拟机监控程序（hypervisor）。\n\n这包括在同一个物理系统中同时执行多个虚拟机，因此是更多的操作系统。虚拟机监控程序让整个过程变得方便得多！\n\
    \n## 虚拟化\n\n通过使用这些程序，你可以在 PC 内部同时运行多个操作系统。你唯一的限制是你可以使用的 RAM 内存。\n\n操作过程并不困难，尽管你需要变得更熟悉这个工具。基本上，这里是你应该采取的步骤列表：\n\
    \n*   下载一个名为 hypervisor 的特定软件。\n*   收集你想安装的操作系统的 `.iso` 镜像。\n*   访问软件。\n*   启动虚拟机创建过程。\n\
    *   创建并启动此虚拟机。\n*   继续安装所需的操作系统。\n*   使用你刚刚创建的虚拟机。\n\n## 虚拟机监控程序\n\n你可以从几个版本中进行选择。其中一些是免费的，而另一些需要订阅费用。以下是最常见的：\n\
