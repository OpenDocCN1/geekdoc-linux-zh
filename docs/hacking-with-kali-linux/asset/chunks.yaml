    网络并不允许访问其所有的 IP 地址。只有某些受信任的 IP 地址才能进入网络。为了获取网络，黑客会使用伪造受信任 IP 地址的 IP 地址。


    例如，假设某个网络允许 IP 地址 `x.x.x.x` 访问其系统。一个系统 IP 地址为 `y.y.y.y` 的黑客伪造其 IP 地址，使其看起来像 `x.x.x.x`，从而进入网络。


    IP 伪造主要是为了向目标系统发送大量数据以增加流量。发送比系统所能处理的更多的数据包将导致目标系统过载。此时所有数据包似乎都来自几个被伪造的 IP 地址。在另一种方法中，可以伪造目标系统的
    IP 地址，向同一网络上的其他系统发送大量数据包。对于其他系统来说，这些数据包看起来是从目标系统发送的，但实际上这些数据包是由黑客从其系统发送的。结果，所有接收到数据包的系统都会向目标系统发送响应，从而因流量过大使其过载。


    某些网络使用基于 IP 的身份验证而不是用户登录验证。在这些身份验证方案中，请求访问的机器的 IP 地址是基于信任关系进行验证的。在这种情况下，黑客可以通过伪装具有网络访问权限的信任机器来执行伪造。


    ## ARP 伪造


    地址解析协议（ARP）是一种将机器的 IP 地址映射到 MAC 地址的协议。MAC 代表介质访问控制（media access control）。系统的 MAC
    地址就是硬件的物理地址。ARP 伪造涉及黑客伪造 ARP 消息并在网络中发送，使得黑客系统的 MAC 地址与网络上某个授权系统的 IP 地址关联。因此，所有发送到授权系统的数据实际上都被发送到了黑客的系统。


    执行 ARP 伪造的原因如下：


    *   窃取网络私有信息

    *   修改传输过程中的数据

    *   停止网络流量

    *   劫持会话

    *   实施中间人攻击


    ARP 伪造只能在局域网（LANs）中进行。这是因为地址解析协议只能在局域网中使用。


    ## DNS 服务器伪造


    域名系统是一项将域名映射到其 IP 地址的服务。DNS 服务器允许将电子邮件地址、统一资源定位符（URL）和域名解析为各自的 IP 地址。域名伪造攻击涉及攻击者操纵
    DNS 服务器，使得特定域名被映射到攻击者控制的 IP 地址。这些 IP 地址包含受恶意软件感染的文件。这种伪造通常用于在互联网上传播计算机病毒和蠕虫。


    ![Description: Description: https://lh6.googleusercontent.com/jSwI_6NCbnjDM9vFjdzgkIxck2ShTARrd0GOM0ZwfwPYfkRIr5hykdKX1Ljs-gEaKDEgrfgf2swjdRKggFCFRXDgO_gQwv0zJiTU8sjBxcnsuuM632yK26Ss_mY3ghirfhgzUbA](img/image00099.jpeg)


    ## 网站伪造


    网站伪造涉及创建一个伪装合法网站的假网站。通常，它与原始网站的设计相同，有时可能具有相似的 URL。因此，当个人误将伪造网站认为是原始网站并输入用户名/密码或其他个人详情（如电话号码、社会安全码或地址）等敏感信息时，这些信息实际上会落入攻击者手中。


    在更严重的攻击中，攻击者可能会创建万维网（WWW）的影子副本，使得受害者的数据流量转向攻击者的系统。结果，攻击者可以捕获受害者的私密信息。可以使用控制字符使伪造网站的
    URL 看起来真实。网站的实际地址仍然隐藏在背景中。


    例如，假设你是一个银行客户，并使用银行网站进行网上银行。假设你被重定向到一个假网站，该网站与原始银行网站的设计和布局相同。它还可能拥有与银行网站 URL 相似的
    URL。因此，你误将假网站认为是真实网站，并输入了你的信用卡详情和 PIN 码等敏感信息。现在，运行假网站的攻击者捕获了你输入的信息，并可能将其用于恶意目的。


    ## 电子邮件伪造


    电子邮件伪造涉及在发送邮件之前伪造“发件人地址”，使其看起来像来自受信任的人或来源。垃圾邮件发送者为了欺骗接收者关于邮件来源的合法性，大多使用电子邮件伪造。电子邮件伪造还用于通过邮件传播蠕虫或病毒。


    例如，假设个人“X”收到了一封被感染的邮件，并且在不知情的情况下打开了它。随邮件发送的蠕虫代码感染了 X 的邮箱账户。然后，蠕虫代码通过 X 的邮箱联系人检测到两个个人“Y”和“Z”的邮箱地址。假设
    X、Y 和 Z 是朋友。


    在 X 不知情的情况下，蠕虫代码编写了一封类似的受感染邮件并发送给 Y。如果 Y 从未知来源收到邮件，这并不是大问题，因为他们不太可能打开。但实际发生的情况是，蠕虫代码在向
    Y 发送邮件之前使用 Z 的邮箱地址伪造了“发件人地址”。在 Y 的收箱中，这封受感染的邮件似乎来自 Y 的朋友“Z”。但实际上这是一封由蠕虫代码传播的邮件。由于发件人地址显示为
    Z 的邮箱，Y 很可能会打开这封受感染邮件。


    # 第 8 章：Linux 的基本功能


    现在是时候学习一些为了自信使用 Linux 而需要的基础知识了。这些功能对于帮助你轻松操作计算机系统至关重要。让我们花一点时间看看这些基本功能，学习它们如何为我们工作。


    ## 界面登录与注销


    涉及到 Linux 操作系统，每次尝试进入系统时，你都需要提供登录凭据，即用户名和密码。此外，当你运行 Linux 系统时，有两种模式可供选择，我们将在下方介绍它们：


    ### 图形模式


    图形模式将是你的桌面电脑的默认模式。基本上，如果计算机屏幕在让你进入之前提示密码和用户名，你就知道你正在使用图形模式。要登录，你只需要输入已经设置好的登录凭据，然后按确定或
    `ENTER` 键。


    在输入这些登录信息后，有时需要几分钟时间来加载并准备就绪；所需的时间取决于你计算机的性能及其处理能力。当计算机完成加载后，你需要打开 `xterm`，也称为终端窗口。你可以通过简单点击“应用程序”（Applications）然后选择“工具”（Utilities）来找到此工具。注意：在某些较新的
    Linux 版本中，会有一个图标可以加速此过程，你可以直接点击它，而不是按照上述步骤操作。

    '
- fmt: '

    The terminal window is basically going to be the control panel for your operating
    system. Most of the procedures that you want to do with the operating system can
    be done with this tool, and as a general rule, when you open the terminal window
    it should display some kind of command prompt. Usually this is going to start
    out with your username for the system, as well as some information about updates
    that were performed.


    When you are ready to log out with this mode, you need to make sure that you have
    closed out of the terminal windows and all of the open programs. You can then
    find the icon for logging out, or search for the Log Out option on your main menu.
    If you forget to close out of an application or a window, it isn’t that big of
    a deal since the computer can do it for you, but the system is going to try and
    retrieve all of these windows and programs the next time you come back, and this
    can slow down the process of getting your computer started. Once you see that
    the screen is once again asking for your log in credentials, you will then know
    that you are all logged out of the system.


    # Text Mode


    The other mode that you can use for your credentials on this system is the text
    mode. You will be able to see that you are in text mode when the whole screen
    is black with just a few characters on it. This mode’s screen is going to show
    a bit of data, including the name of the computer, a bit of data about that computer,
    and then a prompt that is usable for signing in. This one is going to be a bit
    different compared to the graphical mode because you will need to press the `ENTER`
    key once you are done typing in the username, as there is not going to be a clickable
    button or link on the screen. You can then type in the password and hit `ENTER`
    once again.


    A nice thing about this mode is that while you are typing in the username and
    password, you will not see any signs that you are typing. You won''t see the words,
    letters, or even dots and special characters come up while you are typing. This
    can be confusing to some people who are brand new to using this system, but it
    operates this way for security purposes.


    Once the system accepts your username and password, you will receive the message
    of the day. Some of the distributions of Linux will have a feature that is known
    as the fortune cookie feature, and that is going to provide you with some extra
    thoughts each day. Then, the system will move on to providing you with a shell,
    explained with the same details that you will get when using the graphical mode.


    When you are ready to log out from this system, you will simply need to type in
    `logout` and then press `ENTER`. You will be able to tell that you are logged
    out from the system successfully when the screen comes back up and asks you for
    your login credentials again.


    # The Basic Commands


    Now that understand how to log in and out of the Linux system based on the type
    of mode we are in, it is time to start working on some of the basic commands that
    we will be using. These are pretty simple to learn, and if you have worked with
    some programming languages in the past, you may have seen some of these commands
    before. Some of the commands that you should learn as a beginner include:


    * `ls` - this is going to show a set of files that are in the directory that you
    are using at this point in time.

    * `passwd` - this command is going to change the password of the user who is currently
    on the system.

    * `pwd` - this is going to show the current working directory.

    * `cd directory` - this is going to change the directories.

    * `man command` - this is going to read man pages on command.

    * `exit` or `log out` - this is going to make it easier to leave the current session.

    * `info command` - this is going to read info pages on command.

    * `file filename` - this is going to show the file type of the file that is given
    a certain name.

    * `apropos string` - this one will search for strings using the `what is` database.


    # Other Things to Note


    In most cases, you are going to issue the commands by themselves. For example,
    you can just type in `ls` and the system will be able to do the rest of the work
    for you. A command is going to behave in a different manner if you specify an
    option, and you can do this by introducing a dash. When working in GNU, it will
    accept some longer options, as long as you introduce them with two dashes, but
    there are some commands that won’t have these extra options.


    What is known as an ‘argument’ to a command, is a specification for the object
    on which you want to apply the command. A good example of this is `ls /etc` for
    this example, the `/etc` would be the directory and the argument, while `ls` would
    be the command. This particular argument is going to show that you would like
    to see the contents of the `/etc` directory rather than the default directory.
    You will then be able to click on the `ENTER` key, and go to that directory. Depending
    on what you are trying to do, some of your commands will need arguments to help
    the system make sense of what you are looking for.


    # Using the Bash Features


    The Bash, which is the default GNU shell on most of the Linux systems that you
    will use, is going to make it easier to use certain combinations of keys in order
    to perform a task easily and quickly. Some of the most common features to use
    with the Bash shell include:


    * `Tab` – this is going to complete the command or the filename. If there is more
    than one option, the system will use a visual or audio notification to tell you.
    If the system detects that there are a lot of possibilities, it will ask you whether
    you would like to check all of them.

    * `Tab Tab` - this one is going to show the completion possibilities for a filename
    or command.

    * `Ctrl + A` – this one is going to move the cursor over to the start of the current
    command line.

    * `Ctrl + C` – this one is going to end your computer program, and then will show
    the Linux prompt.

    * `Ctrl + D` – this one is going to log you out of your current session. This
    is a key combination that is similar to typing `exit` or `logout`.

    * `Ctrl + E` – this is going to move the cursor to the end of your current command
    line.

    * `Ctrl + H` – this is going to work similar to pressing the backspace key on
    the keyboard.

    * `Ctrl + L` – this one is going to clear out the current terminal.

    * `Ctrl + R` – this is going to search through the history of commands.

    * `Ctrl + Z` – this is going to allow you to suspend your computer programs.

    * `Arrow right / arrow left` – these keys are going to make it easier to move
    the cursor along the command line that you are currently on. You may find it useful
    if you need to add in more characters or make some changes in the program.

    * `Arrow up / arrow down` – these are the keys that will make it easier to browse
    the history of the system. You can access any lines that you want to repeat, change
    some of the data when needed, and then press `ENTER` to execute these new commands
    quickly.

    * `Shift + Page Up/ Shift + Page Down` – using these key combinations will allow
    you to check the terminal buffer.


    As you get a bit more familiar with the Linux system, you will begin to better
    understand how these commands work, as well as learn other commands, which will
    make it easier to use the Linux system. These are just a few of the initial commands
    that you should learn how to use, because they are going to make navigating through
    the system much easier for you. Give them a try and practice logging in and out
    of your system, so that you can get a feel for how it works before moving on.


    # Working on the File System

