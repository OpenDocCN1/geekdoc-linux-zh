  trans: "\n\n你还需要完成的另一个操作是安装 VMware Tools。它们无非是一组提高你虚拟机整体性能的功能特性。\n\n我不会用细节来烦扰你。操作步骤非常简单：你只需要在\
    \ Windows 或 Google 上搜索关键词“installation of VMware tools on Kali”即可。\n\n## 虚拟机的连接性验证\n\
    \n我们现在的最后一步工作是验证我们的虚拟机是否可以相互通信。你需要采取的步骤如下：\n\n1. 验证分配给每台虚拟机的 IP 地址的有效性。\n2. 在每台虚拟机上运行\
    \ `PING` 命令，并验证响应是否正常。\n\n让我们一起看看如何操作：\n\n*   访问 KALI 机器并从终端运行 `ifconfig` 命令，验证分配的\
    \ IP 地址是否可用。\n*   访问 Windows 7/10 机器，并在命令行中输入 `ipconfig` 以验证分配的 IP 地址是否存在。\n*\
    \   记录下这些 IP 地址。\n*   在 KALI 机器上，输入命令 `ping IP address Windows 7/10` 以验证响应是否正常，并且响应过程中没有没有丢包现象。\n\
    *   在 Windows 7/10 机器上，输入命令 `ping IP address Kali` 验证响应是否正常，且响应过程中没有丢包。\n\n如果所有响应都是正常的，我们就可以开始下一步了。我们渗透测试实验室的设置阶段已经结束。\n\
    \n# 第 11 章：理解你为什么需要黑进自己的系统\n\n为了抓到小偷，你必须设身处地，像他们一样思考，这就是道德黑客的基础。你必须了解你的敌人，否则你就不可能知道如何反击。目前，一切事物都在威胁着安全。系统漏洞的数量正在快速增长，黑客的数量以及他们的知识也是如此。很快我们就会面临一个没有任何系统是能完全免受触碰的时刻，因此学习如何保护你自己的系统至关重要。不要只考虑我们都熟知的普通漏洞——要思考得更深一层。当你学会了如何黑入时，你就知道了黑客为了对付你会使用的技巧——这意味着你知道如何保护自己免受这些技巧的侵害。\n\
    \n黑客针对的是脆弱、薄弱且未受保护的系统。虽然你可能部署了一系列防火墙、为所有数据设置了加密并使用了 VPN（虚拟专用网络），但这些仅仅是营造了一种虚假的安全感。这些类型的系统关注的是高层漏洞、病毒以及通过防火墙进入的流量，而对黑客的工作方式没有任何影响。保护你的系统免受攻击的唯一方法是找到他们将使用的弱点并将其加固。\n\
    \n黑客和破解者（crackers）几乎每天都在扩展知识和技能，你也应该做同样的事情。如果你想保护你的系统，就必须学会像他们那样思考，像他们那样工作。你是道德黑客；你必须知道破解者在做什么，并且必须知道如何阻止他们。你必须确切知道寻找什么，以及如何利用你发现的东西来反击他们。\n\
    \n现在，让我明确一点——你不需要竭尽全力去保护你的系统免受每一种可能的攻击——你做不到。做到这一点的唯一方法是关闭电脑，拔掉电源，并把它锁在柜子里。这样，没有人可以触碰你的系统，甚至是你也不行。但这并不是一种很好的安全处理方法，对任何组织都不会有好处。更重要的是，要针对已知的漏洞（更常见的已知攻击）采取安全措施。\n\
    \n要思考并预判所有可能的攻击形式，以及系统中可能导致其暴露的所有缺陷，几乎是不可能的。世界上没有任何办法能让你计划好所有的意外，特别是那些我们不知道的情况。你能做的是尽力阻碍破解者。尽可能多地测试组合，测试你的整个系统以及它的各个部分——这样你就有很大机会发现影响你整个系统的漏洞。\n\
    \n不过，不要在道德黑客方面做得过头。针对那些极可能永远不会发生的攻击来加强你的系统是没什么意义的。你的真实目标应该是：\n\n*   以一种非破坏性的方式黑进自己的系统\n\
    *   发现漏洞\n*   研究这些漏洞如何被利用以及它们能产生什么影响\n*   修补它们并让你的系统更安全\n\n# 第 12 章：Linux 命令\n\
    \n但首先，让我向你展示一些以后对我们有用的基础 Linux 命令。\n\n## 基础命令\n\n这些是你在执行日常任务时可能会用到的常用命令。\n\n*\
    \   执行命令：`ls`\n    解释：此命令允许你列出文件和/文件夹的内容。\n*   执行命令：`pwd`\n    解释：打印当前目录。\n* \
    \  执行命令：`cd`\n    解释：它允许你访问选定的文件夹。\n*   执行命令：`cp`\n    解释：它允许你复制文件。\n*   执行命令：`mkdir`\n\
    \    解释：它允许你创建一个文件夹。\n*   执行命令：`rmdir`\n    解释：它允许你删除文件夹。\n*   执行命令：`touch`\n\
    \    解释：它允许你创建一个文件。\n*   执行命令：`tar`\n    解释：它为特定文件创建一个归包。\n*   执行命令：`clear`\n\
    \    解释：它允许你返回初始 shell。\n*   执行命令：`adduser`\n    解释：它允许你添加新用户。\n*   执行命令：`chmod`\n\
    \    解释：它管理文件或文件夹权限。\n*   执行命令：`vi`\n    解释：它允许你编辑文件。\n*   执行命令：`cat`\n    解释：它允许你操作文件。\n\
    *   执行命令：`grep`\n    解释：它在文件中搜索特定的模式。\n*   执行命令：`apt-get`\n    解释：包管理。例如，`apt-get\
    \ install`。\n\n上面是你应该尝试的所有基础命令列表。你最好正确掌握它们。\n\n## 网络命令\n\n作为道德黑客工作需要你对常用的网络命令有深入的了解。在书的剩余部分，我将向你展示一些最重要的命令。尝试它们，你甚至可能会发现新的组合。\n\
    \n*   执行命令：`ifconfig`\n    解释：配置网络接口的工具。它对于查看分配给机器的 IP 地址非常有用。\n*   执行命令：`traceroute`\n\
    \    解释：此命令允许跟踪 IP 数据包到主机网络的路径。它对于执行故障排除活动非常有用，例如验证路径中的何处 IP 数据包停止或丢失。\n*   执行命令：`dig`\n\
    \    解释：这是查询 DNS 所需要的工具。关于这个命令还有很多可以说的，它的功能相当复杂。\n*   执行命令：`telnet`\n    解释：此命令允许我们通过\
    \ TELNET 协议连接远程主机。我想明确的是，这种协议在没有任何加密的情况下明文传输数据。因此，它不是一种非常安全的协议。\n*   执行命令：`telnet`\n\
    \    解释：此命令允许我们通过 TELNET 协议连接远程主机。我想明确的是，这种协议在没有任何加密的情况下明文传输数据。因此，它不是一种非常安全的协议。\n\
    *   执行命令：`nslookup`\n    解释：这是另一个查询 DNS 并执行反向解析的工具。在我们的练习中，我们会经常使用这个命令。\n*   执行命令：`netstat`\n\
    \n"
- fmt: '

    # Explanation: this is a command of the utmost importance. It allows you to view
    the network connections opened at a certain time. Useful in troubleshooting, it
    allows us to verify anomalies due to network connections that were not established
    or lost. Here again, take some time to improve your knowledge of this tool.


    Command to execute: `ifup`, `ifdown`


    Explanation: this command allows you to enable or disable network cards. It can
    be very useful in certain situations, perhaps when a reboot of network services
    is required.


    Command to execute: `ping`


    Explanation: the `PING` command is used to check whether a certain host is active
    or not by sending special ICMP type packets to it and waiting for a response.
    Let me remind you that we have already used it in our penetration testing lab
    to verify the connectivity between the various virtual machines.


    Command to execute: `route`


    Explanation: this command is used to display the routing table of a certain host,
    namely the paths that the network packets must perform on the network or on particular
    subnets.


    Command to execute: `arp -a`


    Explanation: the `ARP -A` command provides us with a table of the links between
    a MAC address and an IP address. For example, it can be used when we want to exclude
    problems concerning the lower levels of the ISO/OSI model (data level).


    Here are all the commands related to networking. Of course, this list does not
    include them all, there would be much more to say. However, you will do great
    later if you begin to become familiar with these commands.


    ## COMMANDS RELATED TO SYSTEM MANAGEMENT


    Let''s now move on to the last part of the Linux commands, which are related to
    the ordinary management of your Linux machine.


    Command to execute: `uptime`


    Explanation: this command shows you for how long a certain system has been active.


    Command to execute: `users`


    Explanation: this command shows the user names of users connected to a system.


    Command to execute: `who` /whoami`


    Explanation: this is another command that informs us of how many users are connected
    to the system as well as some additional information.


    Command to execute: `crontab -l`


    Explanation: this command allows the display of scheduled jobs related to the
    current user. We will see later what the jobs are.


    Command to execute: `less` / `more`


    Explanation: this command is very useful because it allows you to quickly view
    a file. Press the "q" key to exit this particular display.


    Command to execute: `ssh`


    Explanation: this command allows the connection to a remote host via an `SSH`
    protocol. The latter, unlike the `TELNET` one, carries out data encryption. For
    this reason, in the event of traffic interception, it will not be possible to
    clearly see any data.


    Command to execute: `ftp`


    Explanation: this command allows the connection to an `FTP` server via the `FTP`
    protocol. This protocol does not perform data encryption, so you need to pay attention
    when using it.


    Command to execute: `service start` / `stop`


    Explanation: this command allows you to start or stop a certain service. You will
    use it on many occasions.


    Command to execute: `free -h`


    Explanation: this command shows the amount of free and used memory. For example,
    it can be used when there are performance problems on a machine.


    Command to execute: `top`


    Explanation: this command allows you to check the active processes in a system.
    It can be useful if a machine is running very slowly for no apparent reason.


    Command to execute: `ps`


    Explanation: with this command you can view the active and running processes in
    a system.


    Command to execute: `kill`


    Explanation: this command is used to terminate a certain process. However, it
    is necessary to first identify the `PID` related to that specific process.


    We started with the general commands and then introduced those related to networks
    as well as to the main functions of an operating system.


    But first, let me explain how networks work and what are the services most ethical
    hackers usually use.


    # Chapter 13 Learning the essential hacking command line


    Having an understanding of the techniques used by hackers to not only access your
    information without permission will allow you to gain insight into how this is
    possible as well as what you are able to do to protect yourself from the most
    basic of attacks. Using this knowledge, you are also able to explore further in
    hacking if you wish to develop your skills and discover additional knowledge into
    creating your own programs and software.


    ## Keylogger


    A keylogger is a very simple piece of software that is designed to track and record
    each keystroke made by the user of computer. These keystrokes and sequences are
    then stored on a log file that is accessed by the hacker who is able to discern
    your information such as email ID’s, passwords, banking details, credit card numbers
    and virtually anything else that you input into your machine using the keyboard.
    For this reason, many online banking sites and other highly secure web pages use
    virtual keyboards and even image identifying passcodes to provide you with access
    to your account since these cannot be recorded through keyloggers.


    How do you keyloggers gain access to your computer in the first place? These lines
    of code or software are often attached to files that are downloaded onto your
    computer without you being aware, known as Trojans (deriving from the Greek mythology
    of the Trojan Horse). These files then get to work are report back to the hacker
    with the information collecting from your computer. Other ways that these files
    are able to access your computer is if they are placed on the computer either
    through direct access, if someone was to have access to your computer with permission
    to allow them to place the file on the computer or through USB drives that they
    have provided to you with hidden files rooted within.


    Keyloggers may also find themselves used in white hat purposes such as within
    organizations to ensure that employees are following the correct policies and
    procedures and not engaging in deceptive conduct.


    ## Denial of Service (DoS/DDoS)


    One of the most common forms of hacking attacks is the Denial of Service, as we
    had mentioned earlier. This involves causing a website to become unusable. The
    site is taken down due to the flooding of information and traffic, enough to overload
    the system as it struggles to process all the requests and is ultimately crashes.
    These attacks are employed by hackers who aim to disrupt websites or servers that
    they want to cause destruction to for whatever their reason or motivation was.
    For example, a hacktivist hacker might take down a website that disagrees with
    their political views seeing it as their moral duty. Whereas a black hat hacker
    might take down the website of a competing organization to disrupt their services
    and sabotage the efforts of their competitor.


    A Do attack is carried out using tools such as botnets or a network of infected
    systems which are then used almost as an army of zombified servers to repeatedly
    attack the target service, overloading it. These infected systems are created
    through emails and software which carry a virus and once infected, these zombie
    computers are able to be used at will by the hackers. It has been revealed through
    industry data that up to 45% of organizations suffer from DDoS attacks resulting
    in millions of dollars worth of damage each year.


    ## Vulnerability Scanner

