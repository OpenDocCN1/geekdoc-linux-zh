    ### 3. The technical audience

    The software developers as well as the manager of security will be interested
    in reading the details of your report. They are responsible for fixing security
    breaches and patching up vulnerabilities, so they will want to read the technical
    side of your report thoroughly. You should include screenshots for them in the
    report in order to help them resolve the problems.


    ## Report Structure

    Now let’s take a look at the precise structure of a penetration test report to
    understand what kind of information it should contain.


    1. **Cover page**: We start from the very beginning with the cover page. This
    section should contain your company logo if you have one, a title, and a short
    description of the test. The cover page should look professional, because its
    quality will have an impact on how the customer perceives you as a professional.

    2. **Table of contents**: This section is quite self-explanatory. Right after
    the cover page, you should write a clear index so that each particular audience
    can skip to the part of the report that is relevant to their position.

    3. **The executive summary**: This part of the report is extremely valuable, and
    it can make or break the entire documentation. The executive summary is specifically
    written for the CEOs of a company or anyone else who holds executive power. It
    should be written comprehensively for an audience that lacks technical knowledge.
    You should start by defining the purpose of the test and how you carried it out.
    Then explain your results and findings clearly and to the point. The summary should
    include the general weaknesses that were discovered and what exactly caused these
    vulnerabilities. Lastly, write about the risks you determined after your thorough
    analysis and discuss how you can lower these risks by applying the right countermeasures.

    4. **The remediation report**: This part of your test report is mainly aimed towards
    the management, however the executive class might also be interested in it. Keep
    in mind that both audiences might lack technical knowledge. So what’s the remediation
    report all about? It should contain all your recommendations that will improve
    security once they are implemented. For instance, you might suggest implementing
    a new firewall or an intrusion detection system. You should list and describe
    everything clearly and to the point.

    5. **The findings summary**: Also known as the vulnerability assessment summary.
    In this section of your report you will discuss all your findings, or in other
    words the strengths, weaknesses, and risks involving the system you tested. Here,
    you should include charts and other visual representations to help the audience
    understand the situation. Display the vulnerabilities you uncovered and classify
    them based on how severe they are.

    6. **Risk assessment**: This is the section where you demonstrate the risks based
    on your findings. You should describe the impact each vulnerability can have on
    the system and how often it can occur.

    7. **Methodology**: Keep in mind that this section of the report is entirely optional,
    unless you were requested by the client to follow a specific methodology. In that
    case, you should report the steps you took and even include a flowchart that clearly
    shows the process.

    8. **Detailed findings**: This part of the report is for the technical audience.
    Here you will discuss your findings in detail and include information on the vulnerabilities
    you uncovered, what caused them, what risks are involved and what your recommendations
    are to improve data security. The developers as well as the security manager need
    to know where the vulnerability was produced and how in order to take the right
    steps to resolve the issue.


    Now that you grasp the concept of penetration testing and you understand how a
    report is supposed to be written, it’s time to push forward and learn the technical
    side of hacking.


    # Chapter 2: Getting Started

    Hackers have a reputation for being highly intelligent and prodigious in many
    ways. It can therefore seem to be an overwhelming task to start from scratch.
    One must remember that everyone must start somewhere. With dedication and perseverance,
    it is possible to go as far in the world as skill can take. One thing that will
    help in the process of becoming a hacker is to set some goals. Ask yourself why
    you want to learn hacking and what you intend to accomplish. Some just want to
    learn the basics to protect their family or their business.


    ## Learning

    The most important weapon in a hacker’s arsenal is knowledge. Not only is it important
    for a hacker to learn as much as possible about computers, networks and software
    but in order to stay competitive and effective they must stay up to date on constant
    changes. It is not necessary for a hacker to be an engineer or computer scientist
    or have intimate knowledge of microprocessor design, but they should understand
    how a computer works, its chief components, how they are networked both locally
    and through the internet, how users interact with their machines and most importantly
    how software dictates computer function. An excellent hacker is fluent and practiced
    in several computer languages and understands the major operating systems. It
    is also very useful for a hacker to be familiar with the history, mathematics,
    and practice of cryptography.


    It is possible, and increasingly common, for a layperson with little hacking experience
    and only slight or intermediate knowledge about programming to conduct an attack
    against a system. People often do this using scripts and following procedures
    developed by more experienced operators. This happens most commonly with simpler
    types of attacks. These inexperienced hackers are known in the hacking community
    as script kiddies. The problem with this type of activity is that the perpetrators
    have little appreciation for what is going on in the code they are running and
    may not be able to anticipate side effects or other unintended consequences. It
    is best to fully understand what you are doing before attempting an attack.


    ### Computers and Processors

    Computers vary in size, shape and purpose, but most of them essentially have the
    same design. A good hacker should study how computers evolved from the earliest
    machines in the 20th century to the vastly more sophisticated machines that we
    use today. In the process, it becomes evident that computers have the same basic
    components. To be an effective hacker, you should know the different types of
    processors that exist on the majority of modern computers. For instance, the three
    largest microprocessor manufacturers are `Intel`, `American Micro Devices (AMD)`,
    and `Motorola`. These processors comprise most of the personal computers that
    a hacker will encounter, but each has their own unique instruction set. Although
    most hackers rarely have to deal with programming languages on the machine level,
    more sophisticated attacks may require an understanding of the differences between
    processor instruction sets.

