    Blue sniff is not a hacking tool in itself, but it can discover the nearest Bluetooth
    devices that are in the “hidden” mode. Bluetooth devices that are in the hidden
    mode cannot be discovered during the usual Bluetooth scans. Blue Sniff, a Linux
    utility, can do the job with ease.


    ## Hacking into Mobile Apps


    Smartphones are popular because of the wide variety of apps that can be installed
    on them. Mobile apps can be hacked. When an app is accessed from an app store,
    its binary code is downloaded to be read and executed by the device’s processor.
    But these binaries have vulnerabilities that can be exploited by a technically
    well-equipped hacker. Such exploits can be categorized into two types, namely:


    * Modification/injection of code

    * Reverse engineering


    ### Modification/Injection of the code


    This is done by inserting malicious code in the app’s binaries. The main motivation
    for a hacker to perform code modifications in the binaries of an app is to change
    the behavior of the app. In general, the binary code modifications are done to:


    * modify the app’s license agreement

    * compromise its security features

    * perform unauthorized transactions from the app

    * unlock the full version, if the app is a trial version

    * bypass its purchase requirements

    * disable the display of ads.


    After making the modifications, the hacker can distribute it as a software patch
    or a crack. Such software patches can be downloaded to bypass several of the app’s
    restrictions. The app with the modified code can also be repackaged as a new app
    and distributed.


    ### Reverse Engineering


    In reverse engineering, the binary code is first analyzed using code analysis
    tools. Based on the analysis report, the hacker can reverse-engineer the app binaries
    to steal the source code and other sensitive information. The code and data stolen
    can be reused to build a similar app with a different brand name and it is then
    submitted to the app stores.


    The tasks that can be performed by a hacker using the techniques of code modification
    and reverse engineering can be illustrated in the above diagram.


    # Chapter 6 Penetration Testing Basics


    ### What is a Penetration Testing?


    Penetration testing, in its simplest form, is a type of computer security testing
    that figures out how secure a computer system is. Usually, the test is done to
    find the vulnerability and various risks that might be present in a given computer
    system or application. If a computer is not sufficiently secure then hackers and
    other forms of attack will easily access the system and compromise any data stored
    on it.


    Many different computer security experts describe, conduct and market penetration
    testing differently. This makes it be confused with other computer security processes
    such as security assessment, vulnerability scanning, and compliance audit. Penetration
    testing is different from all these other processes in a number of critical ways:


    * Unlike vulnerability scanning, penetration testing does not just uncover vulnerabilities;
    it also explores all the uncovered vulnerabilities so as to prove the real world
    attack vectors a computer system faces.

    * Although penetration testing may employ automated tools and processes, its main
    focus is on the human skills and sound judgment of the team of individuals that
    conduct the testing. This is because security threats can beat the most advanced
    and sophisticated tools and technologies but it cannot escape a human mind which
    can always think outside the box.

    * Security and compliance audit search for the presence of security measures and
    configuration but penetration testing goes a step further to establish how effective
    those security measures and configurations are against real-world attacks.

    * Penetration testing explores multiple attack vectors against a given target
    so as to come up with a stronger security combination that is effective in protecting
    a computer system.


    ### Why do you need Penetration Testing?


    Penetration testing is quite valuable to computer users, especially in large organizations
    that have many computers and use computers to process valuable information such
    as an employee’s payroll and their personal details. The following are important
    reasons why businesses invest in penetration testing:


    * **Simulates an attack environment**: The only way you can be able to protect
    your computer from an attack is if you know exactly how an intruder will access
    your computer. Penetration testing helps you know this as it helps simulate attack
    environment using various attack vectors and thus gives an idea of how best to
    increase your computer’s security.

    * **Help uncover security loopholes in your computer security system**: Most of
    the major computer attacks that go unnoticed exploit loopholes in the computers
    security system. Penetration testing examines your computer software and features
    so as to identify security weak points where an intruder can gain access through.
    This is important information that is then used to beef up the computer security
    for a given system.

    * **Helps find ways to beat Black Hat attacks**: Black hat attacks keep changing
    and adapting to existing computer security measures. This means that to effectively
    secure your computer, you need to find ways you can defeat black hat attacks.
    Using penetration testing you can simulate how black hat hackers will get into
    your system and this will help you know how best to build your computer security
    so that it can keep black hat attacks at bay.

    * **Estimates the magnitude of potential attacks on businesses**: Different kinds
    of attack cause various levels of losses. In addition, some kinds of attacks are
    more common in certain fields than others. To protect your business, financial
    records and customers from potential attacks it is important that you know the
    magnitude of various attacks within your business line. This will help provide
    evidence of why you need to invest in various types of computer security technologies.

    * **Helps Enhance your Management System**: Computer security is an important
    component of information management. This means that if you are using computers
    for your business then computer security is an integral part of your management
    system. Penetration testing provides you with important information on computer
    security threats and degrees of vulnerability from various vectors of attack.
    This helps reorganize how you manage your business so as to efficiently secure
    your computer systems and your business information.

    * **Protes you from financial losses**: A simple security breach can result in
    huge losses for any business. Criminals can use computer vulnerability to conduct
    fraud activities that will result in huge losses. In addition, they may steal
    your customers’ data and share it online which may result in loss of business
    and even legal cases that may further hamper your financial wellbeing.

    * **Identify undetectable vulnerability**: Today with the advancement in technology
    there are a lot of vulnerabilities that are difficult to detect. You need information
    on such vulnerability so as to effectively protect your computer systems. Using
    penetration testing you can know areas and types of attack that will be difficult
    to detect and come up with measures to deal with them when they happen.

    * **Test the ability of your security system to foil an attack**: How effective
    are your computer security measures? The only way you can be able to know this
    is by penetration testing. Penetration testing will help you know how easy an
    attacker can access your computer and thus be able to respond effectively.


    It is now clear that there are many reasons why you need to conduct penetration
    testing. Defining the nature and scope of your penetration testing will largely
    depend on your goals. If you are worried about attacks on your business, then
    you will consider a more intense and aggressive penetration testing than when
    your main goal is to pass compliance assessment.

