- fmt: '

    Having heard a prospective yacht buyer brag about his son being on the Shark Tank
    and how growth hacking had revolutionized his business, the yacht-brokerage owner
    immediately reached out to us. The owner made two clear demands, “Whatever you
    do, it has to feel personalized…and it absolutely has to result in a yacht sale
    in the next eight weeks before the soirée.”


    This was no small task. How do you make thousands of persnickety prospects each
    feel as if his shopping experience is completely tailored to him, using nothing
    but digital marketing technology?


    For this challenge, success hinged on our ability to design a digital Follow-Up
    process. The multimillion-dollar question was, would it produce a sale fast enough
    to save the soirée and, ultimately, the company?


    ### Hacking the Follow-Up Process


    With even the most engaging and educating online sales experience, on average,
    ninety-seven out of one hundred prospects aren’t going to take an immediate purchase
    action. However, those ninety-seven prospects came to you for a reason, and it’s
    your duty and obligation to stay in front of them until they’re prepared to make
    a purchase.


    The challenge with offline follow-up is that things inevitably slip through the
    cracks. The moment you introduce a human being into a process, you create more
    opportunities for error. Whether it’s poor organization or bad tracking, limitations
    of time and energy, a shift in prioritization, or a simple memory failure, there
    are many factors that can and do derail the analog world’s follow-up process.


    A digitized Follow-Up process can avoid the analog world’s pitfalls and perils.
    There are ample tools at your disposal that help sequence, organize, and automate
    your Follow-Up process. For example, you can use an autoresponder to send a series
    of emails addressed with the prospect’s first name that changes the message sequence
    and timing based on whether the prospect opened the prior email or clicked on
    a certain link. The same autoresponder principle is possible with every other
    communication medium you can think of, from text messages to phone calls to social
    media messages and more.


    The benefit of digitizing your Follow-Up process is that it can happen automatically
    without you having to think about it; you can “set it and forget it.” In fact,
    certain tactics allow you to follow up without the prospect giving you a single
    bit of contact information.


    ### Advertising Rule of 7


    The fundamental principle behind the value in instituting the Follow-Up component
    is repetition. The question we are often asked is, “How many times should I follow-up?”
    While the answer depends on your price point, sales cycle length, competitiveness
    of your industry, branding, and several other factors, the rule of thumb we cite
    is the `Advertising Rule of 7`. The `Advertising Rule of 7` states that it takes
    approximately seven touch points for someone to be able to recall your brand.


    The basis of the `Advertising Rule of 7` is a 1956 Princeton University study
    done by cognitive psychologist George Miller. Miller Law states that the number
    of objects the average person can hold in working memory is `7 ± 2`. Conveniently,
    the number of digits in a local US phone number is `7` (not until mobile phones
    were widely adopted were area codes commonly needed). Allegedly, movie studios
    targeted seven consumer touch points as early as the 1930s when wooing people
    to see their films.


    Regardless of the origin, the primary takeaway from the `Advertising Rule of 7`
    is that it takes repetition to be remembered. No one better internalized and executed
    this concept than the propagandists of the Second World War. By overtaking media
    outlets, they repeated their dogma until it permeated and intoxicated entire national
    belief systems. While the product of propaganda may have been undesirable, one
    cannot refute the influential power of repetition.


    Fortunately, repetition in the digital world doesn’t require commandeering a media
    outlet, and the results can be just as potent.


    ### Map It to Your Sales Cycle


    While the `Advertising Rule of 7` provides a general sense of quantity, the next
    question we are often asked is about follow-up frequency. The framework we advise
    is to map your Follow-Up to your average sales cycle length. In general, the larger
    the dollar value of your product or service, the longer the sales cycle, particularly
    for business-to-consumer sales. If, for example, you’ve observed it takes an average
    of four weeks for someone to purchase your service, build your Follow-Up around
    a four-week period of time. We also advise front-loading your follow-up frequency
    to the beginning of the period to take advantage of the psychological principle
    knows as the primacy effect: the first touch points are more often remembered
    than the middle touch points and prospects are more open to communication. When
    you build out a follow-up sequence that extends the full length of your average
    sales cycle, you also benefit from the recency effect: the most recent correspondence
    will have more weight than all prior communication.


    We are often asked questions like, “How much information should I ask for from
    a prospect? Should I ask for just a name and email? Should I get a phone number
    and what they’re interested in? Should I ask for where they heard about us?” Some
    experts will advise asking for more information, while others will advise asking
    for less information. Neither advice is wrong; it just depends on your scenario
    and circumstance.


    The differences in the amount of information you ask for from a prospect can be
    broadly categorized as high-barrier versus low-friction requests. A high-barrier
    request for information will ask for many pieces of information in an attempt
    to produce more qualified leads; the more you know about a lead, the more qualified
    that lead is. The understanding here is that the more serious a prospect is about
    purchasing your good or service, the more inclined he will be to give you information.
    For companies that are plagued with low-quality lead flow and are concerned about
    conserving sales resources, asking for more information is a good approach.


    For companies that are interested in maximizing lead flow and are comfortable
    handling a certain degree of low-quality leads, a low-friction request for information
    is an appropriate approach. In general, the more contact information you ask from
    the prospect, the more “friction” there is and the less likely the prospect will
    be to comply with your request.


    A hybrid information-capture approach is to collect information during the follow-up
    process. For example, you can start with a low-friction name and email request
    and collect more lead intelligence as a prospect engages with your material through
    subsequent questionnaires. However, collecting information as time goes on requires
    a more robust system capable of patching together lead information over time.
    As such, the hybrid approach is generally something companies evolve into after
    first implementing a simpler solution.


    Many companies are quick to dismiss the value of acquiring an email address. “Who
    would want another digital newsletter?” they ask. “People don’t read their emails
    anymore!” they exclaim. Given that email is used for critical communication such
    as online banking, flight information, and online shopping updates, it’s unlikely
    to be replaced any time soon. As it relates to whether people want a newsletter,
    the answer is that most people do not. However, for many purchases there is a
    research phase that consumers undergo, and it’s a value-added service to be the
    company that provides education. Among the many ways to deliver consumer education,
    email is the most cost-effective. If you sell something that does not have a research
    phase, you can incentivize individuals with a discount. Regardless of the incentive
    or information you provide, a database of qualified prospects has significant
    tangible value.

