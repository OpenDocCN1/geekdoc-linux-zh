    终端窗口基本上将是你操作系统的控制面板。你想要对操作系统执行的大多数操作都可以通过这个工具完成。按照一般规则，当你打开终端窗口时，它应该显示某种命令提示符。通常，这开头会显示你的系统用户名，以及一些关于已执行更新的信息。


    当你准备好以这种模式注销时，你需要确保你已经关闭了终端窗口和所有打开的程序。然后，你可以找到注销图标，或者在主菜单上搜索“注销（Log Out）”选项。如果你忘记关闭某个应用程序或窗口，也没什么大碍，因为电脑可以替你处理，但系统会在你下次回来时尝试找回所有这些窗口和程序，这可能会减慢电脑启动的过程。当你看到屏幕再次要求你输入登录凭据时，你就知道自己已经成功注销系统。


    # 文本模式 (Text Mode)


    在该系统中，用于输入凭据的另一种模式是文本模式。当你看到整个屏幕是黑色的，上面只有几个字符时，你就知道自己正处于文本模式。这种模式的屏幕将显示一些数据，包括计算机名称、关于该计算机的一些数据，然后是一个可用于登录的提示符。与图形模式相比，这种模式有点不同，因为在你输入完用户名后需要按下
    `ENTER` 键，因为屏幕上没有可以点击的按钮或链接。然后你可以输入密码并再次按下 `ENTER`。


    这种模式的一个很棒的地方是，当你输入用户名和密码时，你看不到任何正在输入的迹象。在输入时，你不会看到单词、字母，甚至是点或特殊字符的出现。对于一些初次使用该系统的人来说，这可能会让他们感到困惑，但出于安全考虑，它是这样运行的。


    一旦系统接受了你的用户名和密码，你将收到“每日消息（message of the day）”。某些 Linux 发行版具有一种被称为“幸运饼（fortune
    cookie）”的功能，它每天都会为你提供一些额外的感悟。然后，系统将为你提供一个 shell（壳），其详细说明与你使用图形模式时得到的相同。


    当你准备好从该系统注销时，只需要输入 `logout` 然后按 `ENTER`。当屏幕恢复并再次要求你输入登录凭据时，你就知道已成功注销系统。


    # 基础命令 (The Basic Commands)


    现在你已经了解如何根据我们所处的模式登录和注销 Linux 系统，是时候开始学习一些我们将要使用的基础命令了。这些命令非常容易学习，如果你过去接触过某些编程语言，你可能以前见过其中一些命令了。初学者应该学习的某些命令包括：


    * `ls` - 这将显示你当前所在目录下的文件集。

    * `passwd` - 此命令将更改当前在系统上的用户的密码。

    * `pwd` - 这将显示当前工作目录。

    * `cd directory` - 这将切换目录。

    * `man command` - 这将读取关于命令的帮助页（man pages）。

    * `exit` 或 `log out` - 这将更容易离开当前会话。

    * `info command` - 这将读取关于命令的信息页（info pages）。

    * `file filename` - 这将显示指定名称的文件的类型。

    * `apropos string` - 这个命令将使用 `what is` 数据库搜索字符串。


    # 其他注意事项 (Other Things to Note)


    在大多数情况下，你将单独发布命令。例如，你只需要输入 `ls`，系统就能为你完成其余的所有工作。如果你指定了选项（option），命令的行为将会有不同，你可以通过引入一个横字符（dash）来实现。在
    GNU 环境中工作时，只要你用两个横字符引入，它就能接受较长的选项，但某些命令将没有这些额外选项。


    被称为命令“参数（argument）”的内容，是你想要应用命令的对象的规范。一个很好的例子是 `ls /etc`，在这里，`/etc` 就是目录和参数，而
    `ls` 就是命令。这个特定的参数将显示你想查看 `/etc` 目录的内容，而不是默认目录。然后你就可以点击 `ENTER` 键进入该目录。取决于你尝试执行的操作，某些命令需要参数来帮助系统理解你在寻找什么。


    # 使用 Bash 特性 (Using the Bash Features)


    Bash 是你将使用的多数 Linux 系统上默认的 GNU shell，它将让你更容易使用某些组合键，以便轻松、快速地完成任务。使用 Bash shell
    的一些常用功能包括：


    * `Tab` – 这将补全命令或文件名。如果有多个选项，系统将使用视觉或听觉通知。你。如果系统检测到有很多可能性，它会询问你是否想检查所有选项。

    * `Tab Tab` - 这将显示文件名或命令的补全可能性。

    * `Ctrl + A` – 这将光标移动到当前命令行的开头。

    * `Ctrl + C` – 这将结束你的计算机程序，然后显示 Linux 提示符。

    * `Ctrl + D` – 这将你从当前会话中注销。这个组合键类似于输入 `exit` 或 `logout`。

    * `Ctrl + E` – 这将光标移动到当前命令行的末尾。

    * `Ctrl + H` – 这的功能与按下键盘上的退格键（backspace）类似。

    * `Ctrl + L` – 这将清除当前终端。

    * `Ctrl + R` – 这将搜索命令历史。

    * `Ctrl + Z` – 这将允许你挂起计算机程序。

    * `Arrow right / arrow left` - 向右/向左箭头键将让你更容易在当前命令行上移动光标。如果你需要添加更多字符或进行某些更改，可能会发现它很有用。

    * `Arrow up / arrow down` - 上/向下的箭头键将让你更容易浏览系统历史。你可以访问任何想要重复的行，根据需要修改某些数据，然后按
    `ENTER` 快速执行这些新命令。

    * `Shift + Page Up/ Shift + Page Down` - 使用这些组合键允许你查看终端缓冲区（terminal buffer）。


    随着你对 Linux 系统越来越熟悉，你将开始更好地理解这些命令的工作原理，并学习其他命令，这会让你使用 Linux 系统变得更容易。这些是你应该学习如何使用的的一些初始命令，因为它们将让你在系统中导航变得容易得多。尝试一下它们并练习登录和注销系统，以便在进入下一步之前对它的运行方式有一个感觉。


    # 在文件系统操作 (Working on the File System)


