    \n## 操作系统镜像\n\n操作系统：\n\n*   `Kali Linux` - `https://www.kali.org/`\n*   `Windows\
    \ 7` - `30 天版本`\n*   `Windows 10` - `90 天版本`\n\n## 创建虚拟机\n\n现在你准备好创建虚拟机了。要此操作，请前往\
    \ `File -> New virtual machine`。\n\n## 网络管理\n\n正确管理网络非常重要。如果你配置不当，虚拟机将无法通信。\n\n\
    在 VMware 中，我们可以使用 4 种类型的网络：\n\n*   `Bridged`（桥接）：这种类型包括创建一个属于网络的 IP 地址。\n*   `NAT`：在此模式下，你的虚拟机可以连接到互联网，但从外部无法访问它。\n\
    *   `Host-only`（仅主机模式）：在这种情况下，虚拟机只能与你的物理主机通信。\n*   `Custom`（自定义）：在这里你可以定义自己的网络，并让所有虚拟机在内部通信。\n\
    \n要创建它，请前往 `Edit -> Virtual Network Editor` 并创建一个新网络。\n\n## 虚拟机启动\n\n现在你准备好启动你的虚拟机了。如果你正确执行了上述所有的操作，所有机器将启动并获得之前分配的\
    \ IP 地址。\n\n 安装 vmware tools\n\n"
- fmt: "\nAnother operation you will need to complete is the installation of VMware\
    \ Tools. They are nothing more than a set of features to improve the overall performance\
    \ of your virtual machine.\n\nI won't bore you with the details. The procedure\
    \ is very simple: you just need to search on Windows or on Google the keywords\
    \ \"installation of VMware tools on Kali”.\n\n## Connectivity verification of\
    \ virtual machines\n\nOur last effort now will be to verify that our virtual machines\
    \ can talk to each other. The steps you will need to take are the following:\n\
    \n1. Verify the validity of the IP address assigned to each virtual machine.\n\
    2. Run the `PING` command on each virtual machine and verify that the response\
    \ is positive.\n\nLet's see together how to do it:\n\n*   Access the KALI machine\
    \ and run the `ifconfig` command from the terminal, verifying that the assigned\
    \ IP address is available.\n*   Access the Windows 7/10 machine and on the command\
    \ line type `ipconfig` to verify the presence of the assigned IP address.\n* \
    \  Note down these IP addresses.\n*   On the KALI machine, enter the command `ping\
    \ IP address Windows 7/10` to verify that the response is positive and that we\
    \ are not experiencing packet loss in the response.\n*   On the Windows 7/10 machine,\
    \ type the command `ping IP address Kali` verifying that the response is positive\
    \ and that no packets were lost in the response.\n\nIf all the responses are positive,\
    \ we can start working on the next step. The setup phase of our penetration testing\
    \ lab is over.\n\n# Chapter 11: Understanding Why You Need To Hack Your Own Systems\n\
    \nIn order to catch a thief you have to put yourself in their shoes, to think\
    \ like one and that is the baseline for ethical hacking. You must know your enemy\
    \ otherwise you cannot possibly know how to fight back. Everything is against\
    \ security at the moment. The number of system exploits is growing fast, as is\
    \ the number of hackers, as well as their knowledge. The time will soon be upon\
    \ us when no system is left untouched so it is absolutely vital that you learn\
    \ how to protect your own systems. Don’t just think about the normal exploits\
    \ tha we all know about either – think things much deeper than that. When you\
    \ now how to hack, you know what the tricks are that a hacker will use to get\
    \ at you – and that means you know how to protect yourself against them.\n\nHacking\
    \ targets systems that are vulnerable, weak and unprotected. While you may have\
    \ a series of firewalls in place, encryption set up for all your data and use\
    \ VPN’s – Virtual Private Networks – these are merely creating a false sense of\
    \ security. These types of systems focus on the higher level exploits, the viruses\
    \ and the traffic that comes in through the firewalls, without having any effect\
    \ on how a hacker works. The ONLY way to protect your system from attack is to\
    \ find the weaknesses they will use and secure them.\n\nHackers and crackers expand\
    \ their knowledge and their skills on an almost daily basis and you should be\
    \ doing the same thing. You have to learn how to think like they do and to work\
    \ the way they do if you want to protect your systems. You are the ethical hacker;\
    \ you have to know what the crackers are doing and you have to know how to stop\
    \ them. You have to know exactly what to look for and how to use what you find\
    \ against them.\n\nNow, let me get one thing straight – you do not have to go\
    \ all out and protect your systems from every single possible attack – you can’t.\
    \ The only way you are going to that is to turn off your computer, unplug it and\
    \ lock it away in a cupboard. That way, no one can touch your system, not even\
    \ you. That is not a very good way of approaching security though and is not going\
    \ to do any organization many favors. What is more important is that you put security\
    \ measures in place against the well-known exploits, the more common known attacks.\n\
    \nIt is virtually impossible to think about and anticipate all of the possible\
    \ forms of attack, all the flaws that might be in your system that leaves it open.\
    \ There is no way on earth that you can plan for all eventualities, especially\
    \ the ones we don’t know about. What you can do is do your best to thwart the\
    \ crackers. Test as many combinations as you can, test your entire system as well\
    \ as the individual parts of it – that way you have a good chance of finding the\
    \ exploits that will affect your whole system.\n\nDon’t go too far with the ethical\
    \ hacking though. There is little point in beefing up your system against attacks\
    \ that are highly unlikely to ever happen. Your real goals should be:\n\n*   To\
    \ hack into your own systems in a way that is not destructive\n*   Find the vulnerabilities\n\
    *   Work out how they can be exploited and what they can do\n*   Patch them and\
    \ make your system more secure\n\n# Chapter 12: Linux Commands\n\nBut, first,\
    \ let me show you some basic Linux commands that will be useful to us later.\n\
    \n## BASIC COMMANDS\n\nThese are the most common commands that you will probably\
    \ use for your routine tasks.\n\n*   Command to execute: `ls`\n    Explanation:\
    \ this command allows you to list the contents of files and/or folders.\n*   Command\
    \ to execute: `pwd`\n    Explanation: the current directory is printed.\n*   Command\
    \ to execute: `cd`\n    Explanation: it allows you to access the selected folder.\n\
    *   Command to execute: `cp`\n    Explanation: it allows you to copy files.\n\
    *   Command to execute: `mkdir`\n    Explanation: it allows you to create a folder.\n\
    *   Command to execute: `rmdir`\n    Explanation: it allows you to remove a folder.\n\
    *   Command to execute: `touch`\n    Explanation: it allows you to create a file.\n\
    *   Command to execute: `tar`\n    Explanation: it creates an archive for a certain\
    \ file.\n*   Command to execute: `clear`\n    Explanation: it allows you to return\
    \ to an initial shell.\n*   Command to execute: `adduser`\n    Explanation: it\
    \ allows you to add a new user.\n*   Command to execute: `chmod`\n    Explanation:\
    \ it manages file andor folder permissions.\n*   Command to execute: `vi`\n  \
    \  Explanation: it allows you to edit a file.\n*   Command to execute: `cat`\n\
    \    Explanation: it allows manipulation of a file.\n*   Command to execute: `grep`\n\
    \    Explanation: it searches a file for particular patterns.\n*   Command to\
    \ execute: `apt-get`\n    Explanation: package management. For example, `apt-get\
    \ install`.\n\nHere above is a complete list of all the basic commands you should\
    \ try out. You would be better to master them correctly.\n\n## NETWORK COMMANDS\n\
    \nWorking as an ethical hacker requires you have a strong knowledge of the most\
    \ common network commands. In the rest of the book, I will show you some of the\
    \ most important ones. Try them out and you might even end up creating new combinations.\n\
    \n*   Command to execute: `ifconfig`\n    Explanation: utility to configure network\
    \ interfaces. It will be very useful to view the IP address assigned to a machine.\n\
    *   Command to execute: `traceroute`\n    Explanation: this command allows you\
    \ to trace the path of an IP packet to the host network. It is very useful for\
    \ performing troubleshooting activities such as, for example, verifying where\
    \ in the path a certain IP packet stops or is lost.\n*   Command to execute: `dig`\n\
