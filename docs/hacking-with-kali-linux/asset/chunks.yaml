- fmt: "\nSo what is the right penetration testing for you? If penetration testing\
    \ is a requirement in your industry, then you may be tempted to find the cheapest\
    \ penetration testing service that you can find. But this is not always the right\
    \ way to approach this issue. Consider these two factors:\n\n1. Do you have a\
    \ budget for penetration testing?\n\nIf you already have a budget for penetration\
    \ testing, then there is no need for cutting corners, instead, leverage the budget\
    \ to get value for your money by widening the nature and scope of your penetration\
    \ testing.\n\n2. What will be the effect of an attack?\n\nBefore you decide on\
    \ the scope of your penetration testing it is important to find out what will\
    \ be the impact of an attack. For example, if an attack is likely to result in\
    \ loss of money, business and legal proceedings against you, then you will consider\
    \ having an investment in intense penetration testing. \n\n## What to consider\
    \ when Hiring a Penetration Testing Service Provider\n\nTo do penetration testing,\
    \ you need an expert with the right experiences, skills, and tools to do the job.\
    \ However, there are a lot of people out there providing the service, with some\
    \ not well qualified for the job. It is thus important that you pick the right\
    \ team to do the job for you. The following are important suggestions that you\
    \ should consider when hiring someone to do a penetration testing for you: \n\n\
    ### Look for the right qualification \n\nQualification is the key in getting the\
    \ right penetration tester. Before even considering the qualification for the\
    \ team it is important you make sure that they are not connected to the management\
    \ of the computer system to be tested. This is important to eliminate bias in\
    \ their job. For example, if you have a third party manage your computer system,\
    \ you should not again hire them to do penetration testing, because even if they\
    \ are qualified for the job they are bound to be biased.\n\nTo know if someone\
    \ has the right skills to do penetration testing you need to find out the kind\
    \ of certification they hold. Some of the certifications that are a testimony\
    \ to the competence and skills of a penetration tester include: Certified Ethical\
    \ Hacker (`CEH`), GIAC Web Application Penetration Tester (`GWAPT`), Offensive\
    \ Security Certified Professional (`OSCP`), Advance Penetration Tester (`GXPN`),\
    \ CREST Penetration Testing Certifications and GIAC Certified Penetration Tester\
    \ (`GPEN`) among others.\n\nYou should also be keen on past experiences as someone\
    \ with vast experience in the field will provide you with better services than\
    \ someone new. For example, you should be interested in knowing the years of experience\
    \ they have doing penetration testing, the type of companies they have worked\
    \ for, the kind of projects they have worked on and the references to attest to\
    \ what the provider is putting forward. This is important because a provider that\
    \ is relatively new in the field but has worked predominantly on projects within\
    \ your field may be a better bet than a provider with vast experiences in other\
    \ fields and very little in your very own field. \n\nBefore you hire a tester\
    \ it is important that you also get a tester with the right tools for the job.\
    \ By interrogating the candidates for the job ensure that you get a proper background\
    \ check as this will help you know if they have the right experience, skills,\
    \ and tools to do the job to your satisfaction. This is the only way you will\
    \ get the most qualified provider to do your penetration testing. \n\n### Know\
    \ the nature and scope of your penetration testing \n\nIf you know what you want\
    \ to be done that you are more likely to get the right person to do the job, but\
    \ if you don’t know what you want than anyone else is qualified for the job. The\
    \ right team will help you define the scope of your penetration test as well as\
    \ its nature. So before you give the most qualified team the job you need to sit\
    \ down as look at the nature of the work to be done. If your provider doesn’t\
    \ seem to get what you want to be done, then he/she is not the right candidate\
    \ for the job. Give higher priority to individuals who want to limit the scope\
    \ of your testing to key areas with the highest number of vulnerability and attacks.\
    \ This is important as it will help the process to focus on key areas of your\
    \ computer security. \n\n### Black box or White Box Penetration testing\n\nThese\
    \ two kinds of penetration are important in determining how well you conduct your\
    \ penetration testing process. Each has its own benefits over the other. For example,\
    \ a white hat penetration testing in which case the tester has prior information\
    \ on the system or network access is less time consuming and cost less leaving\
    \ you with enough time and money to beef up your computer security and it also\
    \ help highlight the kind of threats insiders can cause to a computer system thus\
    \ making it easy to protect your computer system from such threats. Black box\
    \ penetration testing, on the other hand, does not allow the tester the luxury\
    \ of having an insider’s knowledge and thus provides the best test result for\
    \ the system from the perspective of a real world attacker. In addition, because\
    \ the attacker spends so much time, the black box penetration testing may provide\
    \ a lot of information on other vulnerabilities within the system. \n\nBefore\
    \ you hire a penetration tester, it is important that you know the kind of penetration\
    \ testing and you only hire someone who is an expert or feels comfortable with\
    \ that particular penetration testing. for example, if you a provider tells you\
    \ that they are only comfortable with white hat testing and you want a black box\
    \ testing, then consider finding someone else who is comfortable as a black box\
    \ tester. \n\n### Goals and Objectives \n\nYour goals and objectives should be\
    \ able to guide you to pick the right penetration tester. What do you want to\
    \ achieve with your penetration testing? Does the experience of the penetration\
    \ tester you are considering match those goals? Some penetration testers may have\
    \ experience and the right qualifications, but their experience does not show\
    \ that they can achieve your goals and objectives. So before you start looking\
    \ to hire someone to do a penetration testing for you ensure that you have set\
    \ the goals and objectives for the process. This will not only help you get the\
    \ right talent for the job, but will also help you set your scope and measure\
    \ the outcome of the process. \n\n## When do you have to Perform Penetration Testing?\n\
    \nPenetration testing should be done regularly so as to secure your computer systems\
    \ and protect your data and information from the ever advancing attacks. In addition\
    \ to conducting penetration testing regularly you should ensure that you conduct\
    \ penetration testing whenever:\n\n* You discover new threats to your computer\
    \ systems\n* You add a new hardware/network or infrastructure to your computer\
    \ system\n* You install new software or update your system software\n* You move\
    \ offices or add office space\n* You create a new end-user policy or program\n\
    \n# Chapter 7 Spoofing Techniques\n\nA system can be hacked either locally or\
    \ through the Internet using one of the following methods:\n\n* Using a pen drive\
    \ or an external hard disk to infect the system with a virus\n* Faking user identity\
    \ to gain access rights to a system\n* Misusing the trust between the network\
    \ system and the user\n\nNow, how do hackers manage to access or attack a system\
    \ amidst all the security protocols and strong passwords protecting it? How can\
    \ a hacker break into a network in spite of strict rules that only certain authorized\
    \ persons can access the network? Most of the time, the answer is spoofing.\n\n\
    The different types of spoofing are as follows:\n\n* `IP spoofing`\n\n* `ARP spoofing`\n\
    \n* `DNS server spoofing`\n\n* `Website spoofing`\n\n* `Email spoofing`\n\n##\
    \ Ip spoofing\n"
  raw: 'So what is the right penetration testing for you?  If penetration testing
    is a requirement in your industry, then you may be tempted to find the cheapest
    penetration testing service that you can find. But this is not always the right
    way to approach this issue. Consider these two factors:


    1.  Do you have a budget for penetration testing?


    If you already have a budget for penetration testing, then there is no need for
    cutting corners, instead, leverage the budget to get value for your money by widening
    the nature and scope of your penetration testing. 


    2.  What will be the effect of an attack?


    Before you decide on the scope of your penetration testing it is important to
    find out what will be the impact of an attack. For example, if an attack is likely
    to result in loss of money, business and legal proceedings against you, then you
    will consider having an investment in intense penetration testing. 


    What to consider when Hiring a Penetration Testing Service Provider


    To do penetration testing, you need an expert with the right experiences, skills,
    and tools to do the job. However, there are a lot of people out there providing
    the service, with some not well qualified for the job. It is thus important that
    you pick the right team to do the job for you.  The following are important suggestions
    that you should consider when hiring someone to do a penetration testing for you: 


     Look for the right qualification  


    Qualification is the key in getting the right penetration tester. Before even
    considering the qualification for the team it is important you make sure that
    they are not connected to the management of the computer system to be tested.
    This is important to eliminate bias in their job. For example, if you have a third
    party manage your computer system, you should not again hire them to do penetration
    testing, because even if they are qualified for the job they are bound to be biased.


    To know if someone has the right skills to do penetration testing you need to
    find out the kind of certification they hold.  Some of the certifications that
    are a testimony to the competence and skills of a penetration tester include:
    Certified Ethical Hacker (CEH), GIAC Web Application Penetration Tester GWAPT),
    Offensive Security Certified Professional (OSCP), Advance Penetration Tester (GXPN),
    CREST Penetration Testing Certifications and GIAC Certified Penetration Tester
    (GPEN) among others.


    You should also be keen on past experiences as someone with vast experience in
    the field will provide you with better services than someone new.  For example,
    you should be interested in knowing the years of experience they have doing penetration
    testing, the type of companies they have worked for, the kind of projects they
    have worked on and the references to attest to what the provider is putting forward. 
    This is important because a provider that is relatively new in the field but has
    worked predominantly on projects within your field may be a better bet than a
    provider with vast experiences in other fields and very little in your very own
    field. 


    Before you hire a tester it is important that you also get a tester with the right
    tools for the job. By interrogating the candidates for the job ensure that you
    get a proper background check as this will help you know if they have the right
    experience, skills, and tools to do the job to your satisfaction. This is the
    only way you will get the most qualified provider to do your penetration testing. 


     Know the nature and scope of your penetration testing 


    If you know what you want to be done that you are more likely to get the right
    person to do the job, but if you don’t know what you want than anyone else is
    qualified for the job. The right team will help you define the scope of your penetration
    test as well as its nature. So before you give the most qualified team the job
    you need to sit down as look at the nature of the work to be done. If your provider
    doesn’t seem to get what you want to be done, then he/she is not the right candidate
    for the job. Give higher priority to individuals who want to limit the scope of
    your testing to key areas with the highest number of vulnerability and attacks.
    This is important as it will help the process to focus on key areas of your computer
    security. 


     Black box or White Box Penetration testing


    These two kinds of penetration are important in determining how well you conduct
    your penetration testing process. Each has its own benefits over the other. For
    example, a white hat penetration testing in which case the tester has prior information
    on the system or network access is less time consuming and cost less leaving you
    with enough time and money to beef up your computer security and it also help
    highlight the kind of threats insiders can cause to a computer system thus making
    it easy to protect your computer system from such threats.  Black box penetration
    testing, on the other hand, does not allow the tester the luxury of having an
    insider’s knowledge and thus provides the best test result for the system from
    the perspective of a real world attacker. In addition, because the attacker spends
    so much time, the black box penetration testing may provide a lot of information
    on other vulnerabilities within the system. 


    Before you hire a penetration tester, it is important that you know the kind of
    penetration testing and you only hire someone who is an expert or feels comfortable
    with that particular penetration testing. for example, if you a provider tells
    you that they are only comfortable with white hat testing and you want a black
    box testing, then consider finding someone else who is comfortable as a black
    box tester.


     Goals and Objectives 


    Your goals and objectives should be able to guide you to pick the right penetration
    tester. What do you want to achieve with your penetration testing? Does the experience
    of the penetration tester you are considering match those goals? Some penetration
    testers may have experience and the right qualifications, but their experience
    does not show that they can achieve your goals and objectives. So before you start
    looking to hire someone to do a penetration testing for you ensure that you have
    set the goals and objectives for the process. This will not only help you get
    the right talent for the job, but will also help you set your scope and measure
    the outcome of the process. 


    When do you have to Perform Penetration Testing?


    Penetration testing should be done regularly so as to secure your computer systems
    and protect your data and information from the ever advancing attacks. In addition
    to conducting penetration testing regularly you should ensure that you conduct
    penetration testing whenever:


     You discover new threats to your computer systems


     You add a new hardware/network or infrastructure to your computer system 


     You install new software or update your system software


     You move offices or add office space


     You create a new end-user policy or program


    # Chapter 7 Spoofing Techniques


    A system can be hacked either locally or through the Internet using one of the
    following methods:


    *   Using a pen drive or an external hard disk to infect the system with a virus


    *   Faking user identity to gain access rights to a system


    *   Misusing the trust between the network system and the user


    Now, how do hackers manage to access or attack a system amidst all the security
    protocols and strong passwords protecting it? How can a hacker break into a network
    in spite of strict rules that only certain authorized persons can access the network?
    Most of the time, the answer is spoofing.


    The different types of spoofing are as follows:


    *   IP spoofing


    *   ARP spoofing


    *   DNS server spoofing


    *   Website spoofing


    *   Email spoofing


    ## Ip spoofing'
