  raw: 'As a result, the yacht brokerage didn’t just sell one yacht before the soirée;
    they sold multiple. At the event, a recent yacht buyer went up to our client and
    told him, “I kept seeing your yacht ads everywhere, and I took that as a sign
    that some higher power was telling me it was time to finally pull the trigger
    and purchase a yacht.” With that one comment, the yacht brokerage owner instantly
    converted from a growth-hacking skeptic to a growth-hacking disciple. The implementation
    of the Follow-Up resulted in a record-setting sales year for the brokerage and
    helped put them on a sales trajectory that shows no signs of slowing. Even more
    impressive, the record-setting sales year was accomplished without hiring a single
    additional employee.


    Follow-Up Takeaways


    *   The Advertising Rule of 7 states that it takes approximately seven touch points
    for someone to be able to recall your brand.


    *   Map your Follow-Up to your average sales cycle length.


    *   The more information you request from your lead, the more “friction” there
    is, which leads to the prospect being less likely to provide the requested information.


    *   Apply the 4 E’s of Copywriting framework to craft messages that captivate
    and motivate: Engaging, Educational, Entertaining, and Emotional.


    *   Retargeting allows you to target your ads specifically to people that have
    previously visited your website.


    *   Brand-based ad units convey your overall brand or company, and direct-response
    ad units focus on a specific product or service.


    # Conclusion


    With this, we have now come to the end of this book. In the world of computer
    networking, security is given very high importance so as to protect data and safeguard
    the system from intruders. In spite of strict security guidelines and authentication
    schemes, hackers have managed to break into several systems skillfully, piquing
    the interest of common folk.


    Some hackers were able to develop groundbreaking utilities and websites like Facebook
    and Netflix (the founders of these websites are self-proclaimed hackers), so it
    is not surprising to see so many young people wanting to learn hacking. Before
    venturing into the depths of hacking, one needs to have clear-cut ideas about
    the basics of hacking. That is exactly what this book is intended for.


    I have explained all the concepts of hacking in a lucid and comprehensive manner;
    however, putting them all into practice may seem tough initially. But do not get
    discouraged. Hacking is all about practice, besides good problem-solving skills.
    Make use of websites like “Hack this site,” which allow hackers to test their
    hacking skills legally. Also, do not think twice before seeking the help of a
    professional security specialist if you feel all of this is too technical for
    you.


    By now, you will have a good idea of what hacking is and the consequences that
    occur if an external or internal party attacks your system. But fear not, simply
    follow the instructions and guidelines provided in this book and you can rest
    assured that your system will be well protected.


    And please note that the world of computers is always changing and advancing.
    The more advanced the system, the more you need to improve your knowledge.


    It is also important to remember that misusing your hacking skills to perform
    illegal activities is punishable by law. Most countries have very strict laws
    against cybercrimes committed by black hat hackers. So, it is important to limit
    one''s hacking skills to ethical hacking and use those skills to test the security
    of one’s own devices, or to aid an organization in testing the robustness of its
    security system.


    Thank you again for choosing this book and hope you enjoyed reading it.'
