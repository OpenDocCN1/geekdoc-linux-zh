    # NMAP

    NMAP 是 “network mapper”（网络映射器）的缩写。它在搜索可访问端口的同时探测网络以映射网络服务器等。`NMAP` 的核心功能是安全分析和网络检查，以检测在线的计算机。`NMAP`
    使用 IP 地址和数据包来揭示有关网络的有用细节。例如，它会显示可用于访问网络的端口以及计算机上正在使用的应用程序。在继续使用图形界面（GUI）之前，建议先对命令有一定的了解。


    # Armitage

    `Armitage` 是一种用于网络安全领域的显示控制工具，它为 `Metasploit` 插件创建一个接口，简化了 `Metasploit`使其不再那么复杂，更容易理解。如果你想学习更多
    `Metasploit`，`Armitage` 是一个很好的起点。`Metasploit` 的所有功能都通过 `Armitage` 整合在黑客过程中，因为它们的目的是利用、绕过和攻击网络。


    # Jhon the Ripper

    `JTC` 是 “Jhon the Ripper”的缩写。它是一个突破受密码高度保护区域的知名工具。在黑客世界，它被简称为 `Jhon`，是启动所谓字典入侵的主要工具。`Jhon
    the Ripper` 拥有一个名为“word list”（单词列表）的文本库，由之前破解的密码组成。`Jhon the Ripper` 从其存储库中选择其中一个密码，并替换掉待破解密码的
    `wordlist`。然后它给出新输入密码的结果。换句话说，黑客获取一个之前破解的密码，并干预系统，使得这个之前破解的密码替换掉要破解的密码。之后，`Jhon`
    重新启动之前的成功过程并重新破解替换后的密码。`Jhon the Ripper` 与 `THC Hydra` 之间有相似之处，后者是类似的破解工具。细微的区别在于
    `Jhon` 用于离线破解，而 `Hydra` 用于在线破解。


    # Wireshark

    `Wireshark` 是一个开源工具，通过网络流量概述来审视网络。该工具属于网络嗅探器类别。


    `Ethereal` 是 `Wireshark` 的旧名。它的核心功能是监控用于监测网络流量的差异，并调查往返的数据包。在完成所有操作后，结果将以用户可以理解的格式呈现给用户。随着时间的推移，有了明显的进步。例如，创建了过滤器以及颜色编码等各种数据包处理功能。这些开发在某种程度上都提供了帮助，特别是增强了测试人员的渗透能力。这些测试人员能够更深入地渗透网络并彻底审视数据包。


    如果你真的想成为网络分析、网络渗透大师并获得其他黑客技能，你必须拥有关于 `Wireshark` 的经验和知识。


    # THC Hydra

    `Hydra` 与 `Jhon` 非常，是一种密码破解设备。在专家黑客手中，`Hydra` 可能是危险的。它通常与 `Jhon` 结合使用，因为两者经常同时使用。`Hydra`
    通过结合字典和暴力破解的力量对密码输入处进行攻击来破解密码。`Hydra` 允许大量的协议。示例包括 `SSH`、`POP3`、`IMAP`、`Database`、`SMB`、`VNC`、`LDAP`、`SMB`、`RTPS`、`HTTP`、`POP`、`TCP`、`SMTP`
    和 `RTPS`。


    目前在线最强大的工具是 “Suite”。`Suite` 是一个提供 Web 服务和渗透测试的应用程序。当它充分发挥作用时，其用途几乎是无限的。以下是 `Burp
    Suite` 的一些功能：


    *   **拦截代理 (Intercepting Proxy)**：监控并改进应用程序与 浏览器之间通信的功能。

    *   **爬虫 (Spider)**：指定网络上存在的所有文件列表、名称和特征的功能。

    *   **Web 扫描器 (Web Scanner)**：扫描服务器漏洞的重要功能。

    *   **入侵者 (Intruder)**：可用于对网络发起攻击的功能。用于扫描漏洞并利用这些漏洞。

    *   **重放器 (Repeater)**：代表用户改进并发出请求。

    *   **序列器 (Sequencer)**：检查令牌的 `CSRF`、`authenticity token`（身份令牌）等的异常情况。

    *   **扩展 (Extensions)**：允许用户包含自己的自定义插件或直接从系统数据库安装插件。它们被用于创造性地策划战术性和隐性攻击。


    # OWASP Zed

    `OSASP Zed Attack Proxy`（缩写：`ZAP`）的一个特点是它没有价格标签。它的开源版本向公众免费。`OSWAP` 是一个流行且有效的代理工具，可以替代
    `Burp Suite`。`OSWAP` 用户友好，并且高效地完成完成工作，因为它暴露了 Web 应用的漏洞。`OSWAP` 的功能总结如下：


    A. 手动测试

    B. 审视网络泄露

    C. 审视用户目标


    # Engineering Toolkit

    社会工程工具包（Social-Engineering Toolkit），简称 `SET`，是另一个值得提到的工具。通过这个工具，攻击针对操作系统的用户而不是系统本身。它具有某些允许访问
    `Java applets` 的特殊属性。用户并不知道这些 applet，因为 `SET` 确保一切都在隐中进行。这个命令行在最大化运行时可以产生有效结果。它可以在任何基础操作系统上运行，包括
    `Linux` 和 `Windows`。


    # Aircrack-ng

    这是另一个破解密码并允许用户访问互联网的工具包。在专家手中，它可以成为盈利工具。然而，它是困难的，需要大量的努力。对于新手来说，`Aircrack-ng`
    是一个短波破解程序。它是 `802.11 WEP` 和 `WPA-PSK` 破解工具包，可以从各种类型的数据中恢复密钥。然而，数据必须具有足够的数据包并捕获（在监听模式下）。`Aircrack-ng`
    是你绝对需要的不可或缺工具。新手应该能够使用正确的工具破解加密的 `WEP`。然而，破解 `WPA/WPA2` 需要大量的努力。


