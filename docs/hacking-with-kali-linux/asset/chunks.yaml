  trans: '


    某些处理器可以由终端用户编程。这些处理器被称为现场可编程门阵列（FPGA），越来越多地应用于嵌入式系统，特别是在工业控制领域。众所周知，黑客会在芯片生产过程中获取其权限，以便在最终终点部署恶意软件。对于这类复杂的攻击，理解
    FPGA 架构和编程是必要的。对于那些为关键系统大规模购买芯片的军事和工业客户来说，这些针对嵌入式终端的攻击尤为令他们感到担忧。


    ## 网络与协议


    网络也具有不同的架构。架构不仅取决于不同节点的配置，还取决于连接它们的介质。最初，网络化计算机始终通过铜线连接在一起。常用的铜制网络电缆（通常被称为以太网线）由双绞铜线组成。虽然这些电缆中最常见的是五类（或称
    `CAT-5`）电缆，但它正开始被一种新标准 `CAT-6` 取代，后者具有更大的信号传输容量。对于极高速应用和更远距离，通常选择光纤电。光纤利用光而非电，具有极高的信息承载能力。它们被用于传输大多数现代电电视和高速互联网服务。光纤是互联网的骨干。在较小区域，无线网络非常常见。使用无线局域网（Wi-Fi）协议，无线网络存在于大量的个人、私人商业局域网（LAN）中。黑客通常对破解
    Wi-Fi 网络特别感兴趣，这导致了 Wi-Fi 安全标准的演进。


    无论架构或传输介质如何，当两个终端跨网络通信时，它们必须使用一组被称为协议的通用规则。网络协议自第一批计算机网络建立以来演变，但它们保留了相同的底层分层方法。通常，网络是根据执行不同功能的不同层来概念化的，这被称为栈（stack）。今天最常用的通信协议是互联网协议（`IP`）和传输控制协议（`TCP`）。它们合在一起通常被称为
    `TCP/IP`。这些协议偶尔会更改并标准化。对于黑客来说，学习这些协议以及它们如何与栈不同层之间的通信相关至关重要。黑客正是通过这种方式获取系统更高层级的访问权限。


    ## 编程语言


    对于从未接触过的人来说，从零开始学习编程语言可能看起来令人生畏，但许多人发现，一旦精通了某种编程语言，学习其他语言就会变得更容易、更快。黑客不仅需要理解编程语言以利用软件漏洞，许多黑客还需要编写自己的代码来执行特定的攻击。阅读、理解和编写代码是黑客技术的基础。


    编程语言的范围从非常晦涩的机器代码（以二进制和十六进制格式表示，用于直接与处理器通信）到用于软件开发的高级面向对象语言。常见的高面向对象语言有 `C++`
    和 `Java`。在高级语言中编写的代码被编译为适用于特定处理器的机器代码，这使得高级语言在不同类型的机器之间具有很强的可移植性。另一类是脚本语言，命令是逐行执行的，而不是编译成机器代码。


    学习编程语言需要时间和实践——没有其他方法可以变得精通。漫长的夜晚以及编写、调试和重新编译代码的通宵马拉松，是初级黑客共同的成年礼。


    # 第 3 章获取密码


    在本节中，我们将介绍如何获取网络密码。我将重点关注无线网络，因为对于有线网络，你必须通过电缆连接。我将使用我为演示而创建的 Wi-Fi 网络。


    获取网络密码的方法有很多，并不涉及计算机黑客，我建议你先测试这些方法，并将黑客攻击作为最后的手段。你可以做一些事情，比如查看你想要攻击的组织或个人丢弃的文件，或者直接问在你想攻击的地方工作或居住的人密码是什么。有些组织会将密码写在墙上的笔记上，或写在每个人都能看到的地方。


    使用 `Kali Linux` 获取 Wi-Fi 密码有许多方法，但如果密码很长，几乎所有这些过程都是耗时的，而且如果密码很复杂，有时无法破解。我将向你展示如何使用社会工程来获取密码。


    什么是社会工程？这本质上是黑客攻击的一种形式，即通过欺骗计算机用户来让他们你想做的事。社会工程的例子包括电话和电子邮件诈骗者，他们骗你交出信用卡详情或下载病毒。


    所以我们基本上是要去欺骗计算机用户给我们他们的密码，但要这样做，我们需要看起来正规。这就是 `Fluxion` 发挥用场的地方。


    ## Fluxion


    `Fluxion` 是可以安装在 `Kali Linux` 上的脚本。它利用社会工程创建一个与目标网络镜像的 Wi-Fi 网络。然后它断开目标与其真实 Wi-Fi
    网络的连接。由于我们的虚假 Wi-Fi 看起来和真的一模一样，用户将尝试使用我们的虚假网络重新连接，我们通过 Web 界面向他/她询问密码。


    获取密码后，`Fluxion` 将显示它，我们可以用它连接到网络。`fluxion` 起作用是因为因为它创建了一个与目标类似的 Wi-Fi 网络，并且具有与不同路由器类似的
    Web 界面。`Fluxion` 还允许你为攻击选择你喜欢的语言。


    ### 安装 fluxion


    `Kali Linux` 默认没有安装 `Fluxion`，因此我们必须自己安装它。你可以[在这里](https://github.com/wi-fi-analyzer/fluxion)找到
    `Fluxion` 的 GitHub 仓库。在 GitHub 页面上点击“Clone or download”按钮，然后复制链接。


    '
- fmt: "\nWe are going to run the `fluxion.sh` script; we can do that by typing `./fluxion.sh`\
    \ you can run any script this way. Once you press enter, `fluxion` will start\
    \ to run. You will at first get a long list showing needed programs that have\
    \ not been installed. You can install them using `apt get install <name>` or by\
    \ using the install script which does it automatically.\n\nWhen we showed a list\
    \ of the files and folders in the `fluxion` directory, we can see there is a folder\
    \ called `install`, navigate to that folder and use the `list` command to see\
    \ the available files. You will see a script labeled `install.sh`, run in by typing\
    \ `./install.sh` once you click enter, the script will start installing the missing\
    \ programs.\n\nIt might take a while so please be patient. If you are asked a\
    \ question during installation, you can reply by typing `y` for yes and `n` for\
    \ no.\n\nOnce the installation is done, you can type `cd ..` to go back by one\
    \ directory to the `fluxion` folder. We can now run the `fluxion` script, but\
    \ first, let us talk about wireless cards.\n\nIn order for `fluxion` or any other\
    \ wireless hacking tools to work, your computer’s wireless card must support monitor\
    \ mode. This allows your wireless card to intercept packets or data from the network\
    \ even if that data was not being sent to your computer. You can look up if your\
    \ wireless card supports monitor mode by searching it online. If your card does\
    \ not support monitor mode, you can buy ones that do on places like Amazon, they\
    \ can be plugged in using via USB and some cost as low as $20\\.\n\nMy computer’s\
    \ internal wireless card does not support monitor mode so I will also connect\
    \ an external wireless card via USB. Once the wireless card is placed in a USB\
    \ port, you will have to go to the `Devices` menu on the top bar of the Kali Linux\
    \ virtual machine window. Navigate to where it is written USB and select your\
    \ wireless card in order to use it in Kali Linux.\n\n## Using fluxion \n\nNow\
    \ we have to fire up `fluxion` by using the `fluxion.sh` script. When it starts\
    \ to run, it will detect the wireless card and switch to monitor mode automatically.\n\
    \nThe first thing you will be asked is to choose the language you want to use.\
    \ You can select a language by typing the language’s number on the list. I want\
    \ to use `Fluxion` in English so I chose `1\\.`.\n\nAfter that, you will be asked\
    \ to select the channel to scan. Let us scan all the channels so we will select\
    \ the option `1` and press enter.\n\n`fluxion` will run a scan of all available\
