    Blue Sniff 本身并不是一种黑客工具，但它可以发现处于“隐藏”模式的最近蓝牙设备。处于隐藏模式的蓝牙设备在普通的蓝牙扫描中无法被发现。Blue Sniff
    是一款 Linux 工具，可以轻松地完成这项工作。


    ## 破解移动应用程序


    智能手机之所以流行，是因为它们可以安装各种应用程序。移动应用程序是可以被破解的。从应用商店访问应用时，其二进制代码会被下载并由设备处理器读取和执行。但这些二进制文件存在漏洞，技术完备的黑客可以利用这些漏洞。此类利用可分为两类，即：


    * 代码的修改/注入

    * 逆向工程


    ### 代码的修改/注入


    这是通过在应用程序的二进制文件中插入恶意代码来实现。黑客对应用程序二进制文件进行代码修改的主要动机是改变应用程序的行为。通常，对二进制代码的修改目的是：


    * 修改应用程序的许可协议

    * 损害其安全功能

    * 从应用执行未经授权的交易

    * 如果程序是试用版，则解锁完整版

    * 绕过其购买要求

    * 禁用广告显示


    进行修改后，黑客可以作为软件补丁或破解版进行分发。下载这些此类软件补丁可以绕过应用程序的若干限制。带有修改代码的应用程序还可以重新封装为新应用并分发。


    ### 逆向工程


    在逆向工程中，首先使用代码分析工具分析二进制代码。根据分析报告，黑客可以对应用程序二进制文件进行逆向工程，以窃取源代码和其他敏感信息。盗取的代码和数据可以用于构建具有不同品牌的类似应用程序，然后提交到应用商店。


    黑客利用代码修改和逆向工程技术可以执行的任务如上图所示。


    # 第 6 章 渗透测试基础


    ### 什么是渗透测试？


    从简单的形式来说，渗透测试是计算机安全测试的一种，用于确定计算机系统的安全程度。通常，进行该测试是为了发现给定计算机系统或应用程序中可能存在的漏洞和各种风险。如果计算机不够安全，黑客和其他形式的攻击将很容易访问系统并破坏存储在上面的任何数据。


    许多不同的计算机安全专家以不同的方式描述、执行和营销渗透测试。这导致它容易与其他计算机安全流程（如安全评估、漏洞扫描和合规性审计）混淆。渗透测试在许多关键方面与所有其他过程都不同：


    * 与漏洞扫描不同，渗透测试不仅发现漏洞，还会探索所有未被发现的漏洞，以证明计算机系统面临的真实世界攻击向量。

    * 虽然渗透测试可能采用自动化工具和流程，但其主要重点是执行测试的团队的人类技能和准确判断。这是因为安全威胁可以击败最先进、复杂的工具和技术，但它无法逃脱始终能够跳框架思考的人类大脑。

    * 安全和合规性审计寻找安全措施和配置的存在，而渗透测试更进一步，确立这些安全措施和配置针对真实世界攻击的有效性。

    * 渗透测试针对给定目标探索多个攻击向量，以便产生一种更强大的安全组合，从而能够有效地保护计算机系统。


    ### 为什么你需要渗透测试？


    渗透测试对计算机用户非常有价值，特别是对于那些拥有大量计算机并使用计算机处理高价值信息（如员工工资单和个人详情）的大型组织。以下是企业投资于渗透测试的重要原因：


    * **模拟攻击环境**：你能够保护计算机免受攻击的唯一方法是让你确切知道入侵者将如何访问你的计算机。渗透测试帮助你了解这一点，因为它通过各种攻击向量模拟攻击环境，从而让你了解如何最好地提高计算机的安全性。

    * **帮助发现计算机安全系统中的安全漏洞**：大多数未被察觉的主要计算机攻击都是利用了计算机安全系统的漏洞。渗透测试检查你的计算机软件和功能，以识别入侵者可以通过其获取访问的安全弱点。这些是重要信息，随后被用于加强特定系统的计算机安全性。

    * **帮助找到击败黑帽攻击的方法**：黑帽攻击不断变化并适应现有的计算机安全措施。这意味着为了有效保护你的计算机，你需要找到可以击败黑帽攻击的方法。通过渗透测试，你可以模拟黑帽黑客将如何进入你的系统，这将帮助你了解如何最好地构建计算机安全，以便将黑帽攻击隔之门外。

    * **估算对业务的潜在攻击规模**：不同类型的攻击会导致不同程度的损失。此外，某些攻击在某些领域比其他领域更常见。为了保护你的业务、财务记录和客户免受潜在攻击的侵害，了解你业务范围内各种攻击的规模至关重要。这将为你为什么需要投资各种类型的计算机安全技术提供证据。

    * **帮助增强你的管理系统**：计算机安全是信息管理的重要组成部分。这意味着如果你在业务中使用计算机，那么计算机安全就是你管理系统中不可或缺的一部分。渗透测试为你提供了关于计算机安全威胁和来自各种攻击向量漏洞程度的重要信息。这有助于重新组织你管理业务的方式，以便有效地保护你的计算机系统和业务信息。

    * **保护你免受财务损失**：简单的安全泄露可能会给任何企业带来巨大损失。犯罪分子可以利用计算机漏洞进行欺诈活动，导致巨大的损失。此外，他们可能会窃取你的客户数据并在网上分享，这可能导致业务损失甚至引发法律案件，从而进一步损害你的财务状况。

    * **识别不可检测的漏洞**：如今随着技术的进步，存在许多难以检测的漏洞。你需要此类漏洞的信息，以便有效地保护你的计算机系统。通过渗透测试，你可以了解难以检测的区域和攻击类型，并在它们发生时制定出应对措施。

    * **测试你的安全系统抵御攻击的能力**：你的计算机安全措施有多有效？你能够了解这一点的唯一方法就是渗透测试。渗透测试将帮助你了解攻击者访问你计算机有多容易，从而能够做出有效响应。


    现在很清楚，执行渗透测试有很多原因。定义渗透测试的性质和范围在很大程度上取决于你的目标。如果你担心针对业务的攻击，那么你将考虑比主要目标是通过合规评估更具强度、更具侵略性的渗透测试。


