    There are other aspects to a penetration test, but for now we will stick to the
    basics, as the purpose of this chapter is to familiarize you with the world of
    hacking and penetration testing.


    ## Penetration Testing by an Unethical Hacker


    For this reason, we will take a look at a penetration test from the black hat’s
    perspective and see how it differs from the basic ethical test.


    1. **Choosing a Target**: The unethical hacker chooses the target out of a grudge,
    for profit, or simply for fun. There are no rules and regulations involved. Everything
    is done for personal reasons.

    2. **The Intermediary**: The attack itself is never directly done from the hacker’s
    own system. An intermediary system is used so that the attack cannot be traced
    back to the attacker. The intermediary is often a victim that is used remotely
    to gain access to the target’s system.

    3. **Basic Test Phases**: Even the tools and procedures will be the same as those
    used by a cyber-security specialist.

    4. **Maintaining Access**: It is common for hackers to create a back door on their
    victim’s system in case they might want quick access in the future. This is done
    by installing `rootkits` or leaving bots behind to maintain the access.


    How the unethical hacker uses the system depends entirely on their intentions.
    Some aim to acquire personal information, while others attempt to extort companies
    with flaws in their security. The only thing that really separates the unethical
    hacker from the ethical one is the goal. The steps and tools they use to achieve
    that goal are usually the same.


    ## Penetration Testing Methodologies


    Once the rules of engagement are clearly defined, it’s time to consider the methodology.
    There is no universal kind of test that can fit every company or organization.
    Everyone has their own set of security goals, and there are many questions that
    need answering before choosing the correct methodology. There are a few different
    kinds of penetration testing methodologies, and each one of them dictates how
    a test should be performed. Here’s a brief explanation of the most common methodologies:


    1. **OSSTMM**: This stands for “Open Source Security Testing Methodology Manual,”
    and it is a standardized methodology for penetration testing. The idea behind
    it is to guarantee a baseline for the testing no matter which security specialist
    or company performs it. This methodology mandates which parts of a network to
    test, how to perform the test, and how to analyze the resulting data. Penetration
    tests following the `OSSTMM` methodology are thorough, but cumbersome because
    they include nearly all the steps of a penetration test. This means that such
    a test cannot be performed on a daily basis without requiring an adequate amount
    of human resources and a budget to match.

    2. **OWASP**: This stands for “Open Web Application Security Project,” and as
    the name suggests, it is an open source, community driven methodology aimed at
    testing web applications specifically. The purpose of this methodology is to provide
    unbiased data that is not influenced by any commercial or governmental entity.
    While `OSSTMM` is more focused on network security, `OWASP` focuses on improving
    the security of web applications as well as services. For this methodology, there
    are various tools developed that software developers, security analysts, and businesses
    alike can use in order to boost their defenses.

    3. **CHECK**: This penetration test methodology was born out of the need to create
    secure governmental networks. Governments handle extremely sensitive information
    that is often classified, therefore a high level of consistent testing is required
    to guarantee security. The `CHECK` methodology focuses mainly on protecting the
    data stored on a specific server. The penetration tests performed under it are
    used to determine how secure the data is, and in what way could it be compromised
    when under attack.

    4. **NIST**: This is a comprehensive penetration testing methodology that, unlike
    `OSSTMM`, can be applied regularly and in short intervals. There are four main
    steps to `NIST`, which are planning, discovery, attacking, and reporting. The
    discovery phased is then broken down into two segments. One involves basic information
    gathering, network scans, and service detection, and the other is all about the
    vulnerability assessment. The third stage is the attack, which is the main step
    in the test. The purpose is to try and compromise the targeted device. The reporting
    phase comes after discovery, as well as attack.


    ## Penetration Test Categories


    Depending on what a company or organization wants to test, there are three penetration
    test categories, namely White Box, Black Box, and Gray Box.


    1. **White Box**: When all the relevant data on the target is already provided,
    the penetration test is considered white box. If we’re dealing with a network
    test, the data includes information on applications and their versions, as well
    as the operating system. In the case of a web application, the tester will receive
    the source code in order to perform a full analysis. This type of testing with
    so much information given upfront is usually performed only onsite.

    2. **Black Box**: As you might’ve figured it out on your own, this is the opposite
    of a white box penetration test. There is no information offered upfront regarding
    the operating system or applications when it comes to network testing. Only `IP`
    ranges are provided so that testing can be performed. The source code for web
    application testing is not given either. Black box penetration testing is usually
    performed externally, and that is why most information is kept away.

    3. **Gray Box**: This penetration test category is somewhere in-between white
    and black box testing. Some data is provided, while some is kept away from the
    tester. For example, for web applications the source code is not provided, however,
    information on the databases, back end server or test accounts is usually given.


    ## Writing Reports


    A successful penetration test is not complete without a good report. Knowing how
    to write one, format it, and present it to your audience is the key to being a
    skilled ethical hacker. A report should be well-organized, clear, to the point,
    and understandable. The format and the way you present it matters as well. For
    instance, if you have a red header, all of them should be red. Consistency and
    readability are crucial, so when you write your report take great care. Follow
    the usual rules of writing and avoid grammar mistakes while maintaining your voice,
    or style, throughout the text.


    You might consider these tips to be trivialities that are beneath a hacker, however,
    well-formatted and written reports enhance your credibility as a professional.


    ### Think of Your Audience


    When writing your report, you should draft it with your audience in mind. There
    are three main audience categories, namely the executive class, management class,
    and technical class. You need to keep in mind which part of your report will be
    the focus of each audience and write it for them. For instance, a manager will
    not care about what exploit you used to take control of a system, however, the
    company’s tech division will be highly interested. So let’s briefly discuss each
    audience in order to understand what they’re interested in.


    1. **The executive audience**: This audience includes mostly the CEOs of a company.
    They will only focus on reading the executive summary of the report, as well as
    the remediation report and perhaps the findings summary. Take note that usually
    the executives do not have much technical knowledge and therefore ignore most
    of your report. Therefore, you should write your summaries with this audience
    in mind.

    2. **The management audience**: This audience will be interested in your vulnerability
    assessment and weaknesses you uncovered. They are the ones handling the security
    policy of a company or organization, so they will be interested in a few more
    details than CEOs.

