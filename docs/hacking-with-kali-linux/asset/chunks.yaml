    # Chapter 2 Getting Started


    Hackers have a reputation for being highly intelligent individuals and prodigious
    in many ways. It can therefore seem to be an overwhelming and uphill task to start
    from scratch and reach any level of practical proficiency. One must remember that
    everyone must start somewhere when learning a subject or skill. With dedication
    and perseverance, it is possible to go as far in the world of hacking as your
    will can take you. One thing that will help in the process of becoming a hacker
    is to set some goals. Ask yourself why you want to learn hacking and what you
    intend to accomplish. Some just want to learn the basics so they can understand
    how to protect themselves, their family, or their business from malicious attacks.
    Others are looking to set themselves up for a career in white-hat hacking or information
    security. Whatever your reasons, you should prepare to learn quite a bit of new
    knowledge and skills.


    Learning


    The most important weapon in a hacker’s arsenal is knowledge. Not only is it important
    for a hacker to learn as much as possible about computers, networks, and software
    - but in order to stay competitive and effective they must stay up to date on
    the constant and rapid changes in computers and computer security. It is not necessary
    for a hacker to be an engineer, computer scientist, or to have intimate knowledge
    of microprocessor or computer hardware design, but they should understand how
    a computer works, the chief components and how they interact, how computers are
    networked both locally and through the internet, how users typically interact
    with their machines, and - most importantly - how software dictates computer function.
    An excellent hacker is fluent and practiced in several computer languages and
    understands the major operating systems. In is also very useful for a hacker to
    be familiar with the history, mathematics, and practice of cryptography.


    It is possible, and increasingly common, for a layperson with little hacking experience
    and only slight or intermediate knowledge about programming to conduct an attack
    against a system. People often do this using scripts and following procedures
    that were developed by more experienced operators. This happens most commonly
    with simpler types of attacks, like denial of service. These inexperienced hackers
    are known in the hacking community as script kiddies. The problem with this type
    of activity is that the perpetrators have little appreciation for what’s going
    on in the code they are running, and may not be able to anticipate side effects
    or other unintended consequences. It is best to fully understand what you are
    doing before attempting an attack.


    Computers and Processors


    Computers vary in size, shape, and purpose, but most of them essentially have
    the same design. A good hacker should study how computers evolved from the earliest
    machines in the 20th century to the vastly more sophisticated machines that we
    use today. In the process, it becomes evident that computers have the same basic
    components. To be an effective hacker, you should know the different types of
    processors that exist on the majority of modern computers. For instance, the three
    largest microprocessor manufacturers are Intel, American Micro Devices (AMD),
    and Motorola. These processors comprise most of the personal computers that a
    hacker will encounter, but each has their own unique instruction set. Although
    most hackers rarely have to deal with programming languages on the machine level,
    more sophisticated attacks may require an understanding of the differences between
    processor instruction sets.'
