    are found inside of the Linux system. Many new users are going to have issues
    with this operating system because they simply don’t know what information is
    stored, or even where the information is placed. this chapter aims to answer these
    questions, making your experience with using Linux that much easier.


    ### The different types of files


    For the most part, you are going to be working on regular files. These are files
    that will hold onto ordinary data such as outputs from a task, text files, and
    programs. Linux is not the same as Windows in the way it operates, so keep that
    in mind. The files on screen are going to look similar to what you are used to
    with Windows, but the places they are stored and how they work will be a bit different
    with the Linux system.


    Basically, the file system is going to start at the root, which is also known
    as the simple path; this is the place where everything is going to start from
    and where everything is going to go when done. Aside from having the root and
    the ports that go off it, things are going to look quite similar to what you are
    used to on other operating systems, but you may notice that they are cleaner and
    easier to handle now. The file extensions are still there in order to help the
    user, which may make them a bit harder right in the beginning, but over time you
    will start to appreciate the file extensions because they make it easier to find
    your files as needed.


    ### The layout of your file system


    To make things easier to find and understand, you will see that the file system
    on Linux is going to be similar to a tree. The structure is going to change and
    grow as you add more files or remove them. Overall though, they are all going
    to come from the root, and then the changes that you make will show up further
    up the tree. You can add as many files as you need to make the system well, and
    you will see the tree changing over time. Keep in mind that the names on the file
    trees are not always required, but they are used for convention and to keep things
    easy.


    The tree for the file system is going to begin at `/`, which is also known as
    the root directory. This is going to be the root directory will contain all of
    the underlying files as well as the directories that are shown inside the operating
    system. The `/` often going to proceed the directories that are just one spot
    below the root directory. This is basically going to indicate the position of
    these directories and can help to differentiate them from other locations on the
    computer that may have a similar name. Any time that you are using a newer version
    of Linux, make sure to check the root directory first to find the file you want.


    ### Subdirectories of root


    There are going to be a variety of subdirectories that come after your root directory
    in order to make up the system tree. Some of the subdirectories you may find helpful
    include:


    - `/bin`: this one is going to contain ordinary programs shared by the system
    administrator and users.

    - `/dev`: this one is going to hold references to all peripheral hardware on the
    CPU. In general, these are files that have special characteristics.

    - `/boot`: this one is going to be composed of startup files and kernel. Some
    of the Linux systems include the grand unified boot loader, or `grub`, as well.

    - `/etc`: this is a subdirectory that will contain files related to the system
    configuration. This is pretty similar to the Control Panel you will find with
    Windows.

    - `/home`: this is the main directory for most common users.

    - `/misc`: this is the subdirectory for any files considered miscellaneous.

    - `/lib`: this one is going to contain the library files for all computer programs
    that are on the computer.

    - `/opt`: this location is going to hold some extra as well as 3rd party programs.

    - `/root`: this is the main directory used by the system administrator.

    - `/proc`: this is the virtual file array that will contain data about the resources
    of the system. Any time that you want to see more information about this part,
    you just need to open up a terminal window and then type `man proc` to get started.

    - `/initrd`: this is going to hold the data for the booting processes. Make sure
    you never remove this one.

    - `/lost+found`: this is the directory that will contain files that were saved
    if the system failed and had to close suddenly.

    - `/tmp`: this is a temporary storage unit used by your operating system. You
    should never use it for saving any work because when the system goes through a
    reboot, all of the documents in this folder will be cleaned out.

    - `/sbin`: this is going to hold computer programs used by the operating system
    and the system administrator.

    - `/usr`: this is going to contain the documentations, programs, and libraries
    for all user related computer programs.

    - `/var`: this is used to store any temporary files and variables generated by
    the user. These would include things like file downloads, log files, and mail
    queues.


    You will be able to find the kind of file that you are working on based on where
    it is stored in the computer. If you are unsure about where it is stored, take
    a look through these file starters and see where it may fit in the best based
    on what it is, what the computer thinks it is in the first place, and so on. You
    can also determine where you would like to see the file be stored by adding one
    of these subdirectories to the beginning of your file.


    While this system may seem a bit hard to understand in the beginning and you may
    be feeling like you are going to work on files and never find them again, the
    tree system for saving in Linux is actually quite a bit easier than what you will
    find with some of the other operating systems there. If you are able to navigate
    through the Windows operating system in order to find your projects and your files,
    you will easily be able to figure out how the file systems work with Linux. It
    will just take a bit of time to learn what everything is called and to get used
    to this new system.


    # Chapter 9 Taking Command And Control


    This chapter will introduce new sources of powerful Python scripts that you can
    repurpose to collect data via an external control system in the target machine
    and even use ready API to execute commands and install updates. By the end of
    the chapter you should be able to create a Python tool that you can control remotely
    over the internet to issue commands to the target and to receive captured data.


    ### Using Pastebin as a Command & Control channel


    We included a killswitch in the keylogger (the `~` key to terminate the script)
    but whether it is a good idea to have it on an actual surveillance program is
    for you to decide. Experienced hackers include a killswitch in the keylogger code
    as a function and not a simple keypress event so that they can even terminate
    it remotely if need be and not have the user unintentionally kill the logger.

