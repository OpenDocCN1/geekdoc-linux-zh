    To use the Pastebin API wrapper, we will instantiate the PastebinLog class using
    a set of login credentials defined in the session initialization arguments.


    | class ActiveSession():   def __init__(self, dev_key, user_name, password):     
    self.dev_key = dev_key      self.user_name = user_nameself.password = password     
