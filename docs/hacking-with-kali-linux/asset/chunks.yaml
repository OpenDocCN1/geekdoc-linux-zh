    ## 2. 漏洞 (Exploit)

    这可以是一个程序、一个漏洞，甚至是攻击者用于在系统内访问其所寻求的数据或信息的命令。利用可以是利用应用程序或操作系统内部特定漏洞的任何形式。它会导致资产产生意料之外的行为，从而创建一个可以被黑客利用于己的缺隙。


    ## 3. 前期接触 (Pre-engagement)

    前期接触是指准备阶段，在此阶段你将建立行动规则。


    ## 4. 里程碑 (Milestone)

    有条理是成为专业伦理黑客的关键方面。这就是里程碑发挥用场的地方。它们用于将过程分为详细说明的阶段，并分配明确开始和结束日期。你可以使用图表、电子表格和各种调度网站来跟踪你的里程碑，并确保按时交付。


    ## 5. 机器人 (Bot)

    这是一种用于自动化某些操作的程序。人类的工作速度有限，但机器人可以更快、持续更长时间地处理重复性任务。


    ## 6. 暴力破解攻击 (Brute force attack)

    这种攻击是最简单、最常见的类型，它并不像其名称所暗示的那样去将计算机粉碎。暴力破解攻击实际上是一种自动化方法，将用户名与密码组合，直到找到正确的组合为止。整个过程是自动的，但由于可能的组合数量巨大，可能会花费大量时间。


    ## 7. 拒绝服务攻击 (Denial of Service attack)

    也称为 `DoS` 攻击，这是许多初级黑帽黑客经常遇到的攻击之一。这种攻击的形式是对提供给各种用户的服务器或网络服务的中断。它是一种拒绝用户连接在线服务的恶意方法。例如，如果你正在玩在线游戏，针对游戏服务器的
    `DoS` 攻击会导致所有用户大规模断线。


    ## 8. 击键记录 (Keystroke logging)

    这是记录计算机上按下的键盘键和鼠标按钮的常用方法。这些信息用于揭露用户名、密码和其他敏感信息。与暴力破解相比，这种方法在获取记录信息方面要快得多。为了使其生效，键盘记录程序会通过包含木马链接的电子邮件，甚至直接通过
    USB 闪盘注入计算机中。


    ## 9. 恶意软件 (Malware)

    这指的是所有用于针对计算机或特定软件的敌对行动的恶意程序。恶意软件的形式有木马、蠕虫、广告软件、间谍软件、勒索软件和其他计算机病毒。


    ## 10. 网络钓鱼 (Phishing)

    这是一种电子邮件欺骗。其意图是发送看似合法的电子邮件，目的是从接收者处获取私人信息。


    ## 11. Root 根包 (Rootkit)

    这是一种在目标用户不知情的情况下秘密运行的软件。其目的是隐藏后台运行的各种进程，以维持对计算机的访问。它主要用于在维护某人设备后门的同时，向授权用户隐藏它。


    ## 12. SQL 注入 (SQL Injection)

    黑帽黑客获取数据的另一种常用方法。这种方法涉及向任何数据驱动的软件或应用程序注入 SQL 代码。例如，可以是一个告诉应用程序将其所有数据发送给攻击者的语句。


    当你深入学习更多黑客知识时，你会发现许多其他术语。但目前，这些术语足够让你一目了然。


    ## 渗透测试 (Penetration Testing)

    这个过程是不可避免的，因为你需要建立行动规则。在开始之前，你需要设定目标。有各种测试方法和类别，但目前你应该学习基础阶段。


    ### 行动规则 (Rules of Engagement)

    一旦行动规则得到充分建立并达成共识，就是执行测试本身的时候。


    1. **前期接触**：在其他事情之前，你需要建立行动规则。

    2. **指纹识别 (Phprinting)**：下一步是。

    3. **目标识别**：一旦测试人员获取了关于系统的所有相关信息，就会选择最有用或最脆弱的目标。

    4. **报告**：最后一条规则与所有规则一样重要。伦理黑客需要记录并报告测试的每一个方面。


    ### 渗透测试步骤 (Penetration Testing Steps)

    1. **被动扫描**：在这一阶段，你应该在不与目标实际交互的情况下收集有关目标的信息。

    2. **主动扫描**：下一步是使用专门为网络映射、流量嗅探等设计的专用工具来探测目标。

    3. **指纹识别**：这指的实际的物理指纹识别。在此阶段，渗透测试人员需要识别目标操作系统和版本级别、所有应用程序及其补丁级别、任何开放端口、活动用户账户和。。

    4. **漏洞利用**：这基本上就是攻击本身。使用专门的攻击工具针对系统内部最脆弱的目标。

    5. **权限提升**：测试人员需要获得更多的控制权，就像他们是授权用户一样。这一阶段的目的是获得系统的管理权限，无论是本地还是远程的。


