    \ we will also need to import Python’s XML parser as in our code below. The three\
    \ URLs of interest that we will use in the script are also defined in this section.\n\
    \n```python\nimport requests\nimport xml.etree.ElementTree as xmlparser\nlogin\
    \ = \"http://pastebin.com/api/api_login.php\"\npost = \"http://pastebin.com/api/api_post.php\"\
