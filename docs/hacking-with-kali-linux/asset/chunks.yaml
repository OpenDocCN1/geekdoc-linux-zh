  raw: 'Another operation you will need to complete is the installation of VMware
    Tools. They are nothing more than a set of features to improve the overall performance
    of your virtual machine.


    I won''t bore you with the details. The procedure is very simple: you just need
    to search on Windows or on Google the keywords "installation of VMware tools on
    Kali”.


    Connectivity verification of virtual machines


    Our last effort now will be to verify that our virtual machines can talk to each
    other. The steps you will need to take are the following:


    1.  Verify the validity of the IP address assigned to each virtual machine.


    2.  Run the "PING" command on each virtual machine and verify that the response
    is positive.


    Let''s see together how to do it:


    *   Access the KALI machine and run the "ifconfig" command from the terminal,
    verifying that the assigned IP address is available.


    *   Access the Windows 7/10 machine and on the command line type "ipconfig" to
    verify the presence of the assigned IP address.


    *   Note down these IP addresses.


    *   On the KALI machine, enter the command "ping IP address Windows 7/10" to verify
    that the response is positive and that we are not experiencing packet loss in
    the response.


    *   On the Windows 7/10 machine, type the command "ping IP address Kali" verifying
    that the response is positive and that no packets were lost in the response.


    If all the responses are positive, we can start working on the next step. The
    setup phase of our penetration testing lab is over.


    # Chapter 11 Understanding Why You Need To Hack Your Own Systems


    In order to catch a thief you have to put yourself in their shoes, to think like
    one and that is the baseline for ethical hacking. You must know your enemy otherwise
    you cannot possibly know how to fight back. Everything is against security at
    the moment. The number of system exploits is growing fast, as is the number of
    hackers, as well as their knowledge. The time will soon be upon us when no system
    is left untouched so it is absolutely vital that you learn how to protect your
    own systems. Don’t just think about the normal exploits tha we all know about
    either – think things much deeper than that. When you now how to hack, you know
    what the tricks are that a hacker will use to get at you – and that means you
    know how to protect yourself against them.


    Hacking targets systems that are vulnerable, weak and unprotected. While you may
    have a series of firewalls in place, encryption set up for all your data and use
    VPN’s – Virtual Private Networks – these are merely creating a false sense of
    security. These types of systems focus on the higher level exploits, the viruses
    and the traffic that comes in through the firewalls, without having any effect
    on how a hacker works. The ONLY way to protect your system from attack is to find
    the weaknesses they will use and secure them.


    Hackers and crackers expand their knowledge and their skills on an almost daily
    basis and you should be doing the same thing. You have to learn how to think like
    they do and to work the way they do if you want to protect your systems. You are
    the ethical hacker; you have to know what the crackers are doing and you have
    to know how to stop them. You have to know exactly what to look for and how to
    use what you find against them.


    Now, let me get one thing straight – you do not have to go all out and protect
    your systems from every single possible attack – you can’t. The only way you are
    going to that is to turn off your computer, unplug it and lock it away in a cupboard.
    That way, no one can touch your system, not even you. That is not a very good
    way of approaching security though and is not going to do any organization many
    favors. What is more important is that you put security measures in place against
    the well-known exploits, the more common known attacks.


    It is virtually impossible to think about and anticipate all of the possible forms
    of attack, all the flaws that might be in your system that leaves it open. There
    is no way on earth that you can plan for all eventualities, especially the ones
    we don’t know about. What you can do is do your best to thwart the crackers. Test
    as many combinations as you can, test your entire system as well as the individual
    parts of it – that way you have a good chance of finding the exploits that will
    affect your whole system.


    Don’t go too far with the ethical hacking though. There is little point in beefing
    up your system against attacks that are highly unlikely to ever happen. Your real
    goals should be:


    *   To hack into your own systems in a way that is not destructive


    *   Find the vulnerabilities


    *   Work out how they can be exploited and what they can do


    *   Patch them and make your system more secure


    # Chapter 12 Linux Commands


    But, first, let me show you some basic Linux commands that will be useful to us
    later.


    BASIC COMMANDS


    These are the most common commands that you will probably use for your routine
    tasks.


    Command to execute: ls


    Explanation: this command allows you to list the contents of files and/or folders.


    Command to execute: pwd


    Explanation: the current directory is printed.


    Command to execute: cd


    Explanation: it allows you to access the selected folder.


    Command to execute: cp


    Explanation: it allows you to copy files.


    Command to execute: mkdir


    Explanation: it allows you to create a folder.


    Command to execute: rmdir


    Explanation: it allows you to remove a folder.


    Command to execute: touch


    Explanation: it allows you to create a file.


    Command to execute: tar


    Explanation: it creates an archive for a certain file.


    Command to execute: clear


    Explanation: it allows you to return to an initial shell.


    Command to execute: adduser


    Explanation: it allows you to add a new user.


    Command to execute: chmod


    Explanation: it manages file and/or folder permissions.


    Command to execute: vi


    Explanation: it allows you to edit a file.


    Command to execute: cat


    Explanation: it allows manipulation of a file.


    Command to execute: grep


    Explanation: it searches a file for particular patterns.


    Command to execute: apt-get


    Explanation: package management. For example, apt-get install.


    Here above is a complete list of all the basic commands you should try out. You
    would be better to master them correctly.


    NETWORK COMMANDS


    Working as an ethical hacker requires you have a strong knowledge of the most
    common network commands.


    In the rest of the book, I will show you some of the most important ones. Try
    them out and you might even end up creating new combinations.


    Command to execute: ifconfig


    Explanation: utility to configure network interfaces. It will be very useful to
    view the IP address assigned to a machine.


    Command to execute: traceroute


    Explanation: this command allows you to trace the path of an IP packet to the
    host network. It is very useful for performing troubleshooting activities such
    as, for example, verifying where in the path a certain IP packet stops or is lost.


    Command to execute: dig


    Explanation: this is a utility needed to query DNS. There would be plenty of other
    things to say about this command and its functioning is quite complex.


    Command to execute: telnet


    Explanation: this command allows us to make connections to remote hosts via the
    TELNET protocol. I want to clarify that this protocol allows a clear visualization
    of data without any encryption mechanisms. For this reason, it is not a very secure
    protocol.


    Command to execute: telnet


    Explanation: this command allows us to make connections to remote hosts via the
    TELNET protocol. I want to clarify that this protocol allows a clear visualization
    of data without any encryption mechanisms. For this reason, it is not a very secure
    protocol.


    Command to execute: nslookup


    Explanation: this is another utility to interrogate DNS and to perform inverse
    resolution queries. In our exercises, we will often use this command.


    Command to execute: netstat'
