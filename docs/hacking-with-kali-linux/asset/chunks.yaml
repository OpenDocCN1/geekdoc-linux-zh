  raw: '2.  Exploit: This can be a program, a bug, or even a command used by attackers
    to find access to the data or information they seek within the system. An exploit
    can be anything that takes advantage of a specific vulnerability within an application
    or operating system. It will cause an unanticipated behavior to the asset, and
    this will create a gap that can be used by the hacker to their advantage.


    3.  Pre-engagement:. Pre-engagement refers to the phase of preparation where you
    establish the rules of engagement.


    4.  Milestone: Being organized is a crucial aspect of being a professional ethical
    hacker. This is where milestones come in. They are used to split the process into
    stages that are clearly detailed and assigned to a beginning and an end date.
    You can use charts, spreadsheets and various scheduling websites in order to keep
    track of your milestones and make sure to deliver on time.


    5.  Bot: This is a type of program that is used to automate a certain action.
    Humans can only work so fast, but bots can take care of repetitive tasks much
    faster and for as long as needed.


    6.  Brute force attack: This kind of attack is the simplest, most common type
    and it doesn’t involve smashing computers to bits as the name might suggest. A
    brute force attack is in fact an automated method of combining usernames with
    passwords until the correct combination is found. The entire process is automatic,
    but it can take a lot of time due to a high number of possible combinations.


    7.  Denial of Service attack: Also known as a DoS attack, this is one of the most
    commonly encountered attacks used by many beginner black hat hackers. This attack
    comes as a form of interruption to the server or network service provided to various
    users. It’s a malicious method of denying users connection to an online service.
    For instance, if you are playing an online game, a DoS attack against the game
    servers will cause a mass disconnection to all users.


    8.  Keystroke logging: This is a common way of recording the keyboard keys and
    mouse buttons that are pressed on a computer. The information is used to reveal
    usernames, passwords, and other sensitive information. Unlike a brute force attack,
    this method is much quicker when it comes to finding out logging information.
    For it to work, a keylogger is injected onto the computer either through an email
    with a Trojan containing link or even directly through a USB stick.


    9.  Malware: This refers to all malicious programs that are used in hostile actions
    against a computer or specific software. Malware comes in the form of Trojans,
    worms, adware, spyware, ransomware, and other computer viruses.


    10.  Phishing: This is a type of email fraud. The intention is to send a seemingly
    legitimate email with the purpose of gaining private information from the recipient.


    11.  Rootkit: This is software that operates stealthily without the knowledge
    of the targeted user. Its purpose is to hide various processes that are running
    in the background in order to maintain access to the computer. It is mostly used
    to maintain a back door to someone’s device while also hiding it from the authorized
    user.


    12.  SQL Injection: Another common method used by black hat hackers to obtain
    data. This method involves the injection of SQL code to any data driven software
    or application. For example, this can be a statement which tells the application
    to send all of its data to the attacker.


    There are many other terms that you will discover as you learn more about hacking.
    But for now, this terminology is enough for you to gain a glimpse of what you
    will be dealing with.


    Penetration Testing


    This process cannot be avoided, because it is the only way to truly discover exploitable
    gaps within a system, and therefore you need to familiarize yourself with each
    step that you need to take. Keep in mind, however, that your motivation for the
    testing is driven by the client and the specific goals he or she wants to achieve.


    Before you begin, you first need to establish the rules of engagement. You need
    to set a schedule, discuss each stage of the testing as well as the methodology,
    and establish the legal responsibilities. Clearly defining the penetration test
    will smoothen the process, keep the client informed, and protect you from any
    liabilities. Everything needs to be agreed upon by both parties involved, so let’s
    take a look at how this process might look.


    Rules of Engagement


    1.  Before anything else, the hacker and their client need to sign a nondisclosure
    agreement as well as permission for hacking. As a cyber-security specialist, you
    want to be legally protected from any kind of liability, so never start doing
    anything before the necessary documents are clear to both sides and signed.


    2.  The next step is discussing the precise purpose of the penetration test, as
    well as what needs to be tested. Sometimes you will need to test only a certain
    sector of an organization, and you also need to know what kind of result is expected
    from you.


    3.  Once you establish the goals and the testing duration, you should discuss
    the methodology you will use to perform the test. There should also be a mention
    of any techniques the client doesn’t want to be used. For instance, some organizations
    or business do not want the hacker to simulate a denial of service attack. This
    needs to be specified when establishing the rules, otherwise it can lead to confusion,
    delays, and even legal problems.


    4.  The final rule of engagement which is as important as all the rest is deciding
    on the liabilities and responsibilities of both parties. As an ethical hacker,
    you might access some sensitive information such as company trade secrets, bank
    account details, or you might cause a denial of service.


    Penetration Testing in Steps


    Once the rules of engagement are well established and agreed to by everyone involved,
    it’s time to perform the test itself. There are various testing methodologies
    and categories, but for now you should learn the basic stages of penetration testing.
    Knowing the steps and working through them one at a time will make your job much
    easier, so let’s see how a basic penetration test looks.


    1.  Passive Scanning: In this phase, you are supposed to gather information about
    your target without actually interacting with it directly. Passive scanning is
    performed by going through social networking websites, online databases, and even
    by searching for relevant data on a search engine like Google.


    2.  Active Scanning: The next step is to probe the target with the use of specialized
    tools that are designed for network mapping, sniffing traffic, banner grabbing
    and more.


    3.  Fingerprinting: This does not refer to actual physical fingerprinting. At
    this stage, the penetration tester needs to identify the target’s operating system
    and version level, all applications and their patch level, any open ports, active
    user accounts and services.


    4.  Target Identification: In this phase, once the tester has obtained all the
    relevant information about the system, the most useful or vulnerable target is
    chosen.


    5.  Vulnerability Exploiting: This is basically the attack itself. Specialized
    attack tools are used against the most vulnerable targets within the system. Some
    of them will succeed, while some of them will only kill the server or simply not
    work at all.


    6.  Privilege Escalation: The tester needs to gain more control, as if they are
    the authorized user. The purpose of this stage is to gain administrative access
    to the system, whether it’s local or remote.


    7.  Reporting: This is the final step of the penetration test. The ethical hacker
    needs to document and report every aspect of the test. This includes the tools
    used, exploited vulnerabilities, and everything that was found as well as how
    it was found.'
