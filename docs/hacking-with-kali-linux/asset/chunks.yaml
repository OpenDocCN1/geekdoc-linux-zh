  raw: 'We are going to run the fluxion.sh script; we can do that by typing ./fluxion.sh
    you can run any script this way. Once you press enter, fluxion will start to run.
    You will at first get a long list showing needed programs that have not been installed.
    You can install them using the apt get install <name> or by using the install
    script which does it automatically.


    When we showed a list of the files and folders in the fluxion directory, we can
    see there is a folder called “install”, navigate to that folder and use the list
    command to see the available files. You will see a script labeled install.sh,
    run in by typing ./install.sh once you click enter, the script will start installing
    the missing programs.


    It might take a while so please be patient. If you are asked a question during
    installation, you can reply by typing y for yes and n for no.


    Once the installation is done, you can type cd .. to go back by one directory
    to the fluxion folder. We can now run the fluxion script, but first, let us talk
    about wireless cards.


    In order for fluxion or any other wireless hacking tools to work, your computer’s
    wireless card must support monitor mode. This allows your wireless card to intercept
    packets or data from the network even if that data was not being sent to your
    computer. You can look up if your wireless card supports monitor mode by searching
    it online. If your card does not support monitor mode, you can buy ones that do
    on places like Amazon, they can be plugged in using via USB and some cost as low
    as $20\.


    My computer’s internal wireless card does not support monitor mode so I will also
    connect an external wireless card via USB. Once the wireless card is placed in
    a USB port, you will have to go to the Devices menu on the top bar of the Kali
    Linux virtual machine window. Navigate to where it is written USB and select your
    wireless card in order to use it in Kali Linux.


    ## Using fluxion


    Now we have to fire up fluxion by using the fluxion.sh script. When it starts
    to run, it will detect the wireless card and switch to monitor mode automatically.


    The first thing you will be asked is to choose the language you want to use. You
    can select a language by typing the language’s number on the list. I want to use
    Fluxion in English so I chose 1\.


    After that, you will be asked to select the channel to scan. Let us scan all the
    channels so we will select the option 1 and press enter.


    Fluxion will run a scan of all available Wi-Fi networks and show them on a white
    window. I have a test Wi-Fi labeled test which can be seen in the image that follows.
    You can also see on the bottom that a device is connected to it. The BSSID is
    the MAC Address of the router and the ESSID is its name.


    You can stop the scanning by clicking on the window and pressing Ctrl + C. You
    will be shown a fluxion window with all the detected networks. Networks that are
    red in color are those with connected devices. Select the Wi-Fi network you want
    to attack by entering the number of the network. In my device, the test network
    is number 2\.


    When you press enter you will be asked for a handshake which we don’t have, so
    we will press enter to skip that part. A handshake is used by a router to communicate
    with an already connected user. This allows a user who has connected once to connect
    to the Wi-Fi network another time without having to reenter the password.


    If a hacker can capture the handshake, he can try to crack it in order to get
    the password of the Wi-Fi network. This is usually time-consuming.


    After skipping the handshake part since we don’t have it, we will be asked to
    select a method to capture the handshake. You can use any option you want here
    but the pyrit option is the best one. So I’ll select 1\.


    Two windows will pop up. All you need to do is patiently wait until the top window
    shows a message that the WPA handshake has been captured. It may take between
    30 seconds to 5 minutes. You can try to speed things up by closing the bottom
    window after one or two minutes.


    After the handshake is captured, you will have to also close this window. Now
    you will have to check the handshake. You can do this by selecting the handshake
    by typing 1.


    If the handshake is not corrupter you will be asked to either select an SSL certificate
    or create one. We will choose the option to create an SSL certificate (option
    1). The next option is to choose an attack option which will be the Web Interface
    option (option 1). The SSL certificate will be used on the web interface to make
    it look secure and trustworthy.


    Our final option will be to choose the template for our web interface. Since most
    people around here use Huawei routers, which is what I will select as my interface
    (option 28).


    Four new windows will appear which execute the attack. The user will be disconnected
    from the original Wi-Fi network called TEST, he will have no choice but to reconnect
    but he will unknowingly connect to fake Wi-Fi network that is similar to the original.
    He will then be asked via a web interface similar to that of Huawei (or whatever
    interface you chose) to enter the Wi-Fi password.


    Once the password is entered, fluxion will confirm if it is the correct password
    and then display it on the screen. The password I used is 123Test, which is what
    can be seen here.


    There are many other scripts and programs that can be used for wireless attacks.
    These scripts can be accessed by heading to the Applications bar on the top left
    corner of the Kali Linux desktop.


    Now that you have acquired the password, you can use it to connect to the network.


    # Chapter 4 The Hacking Guide


    Whatever is explained or taught in this section is to be used for developmental,
    educational and research purposes only. We will consider hacking into Android
    devices, but before then we need to ask some questions. Why are we hacking into
    an Android device? For what purpose? A vast number of people possess Android devices.  


    Similar to software development, hacking is difficult and you can’t become a professional
    hacker overnight. Hacking requires great skill and a level of reasoning. As a
    hacker, your brain must function like a processing unit. To practice hacking on
    a small platform, you will need to have some experience with one of the various
    programming languages. Knowledge of programming languages like C++, Linux and
    FORTRAN is very useful when it comes to hacking. However, you will also need other
    kinds of knowledge to become a skillful hacker. Daily, by reason of upgrades in
    security measures, hacking becomes tougher. As a hacker, you must learn to understand
    and beat security challenges. 


    ## Properties of kali linux 2.0


    If you are a pro at penetrating servers and breaking into networks, the easiest
    way to go about your business is by harnessing the power of Kali Linux 2.0\. Kali
    Linux 2.0 is by far the best Linux distribution that makes hacking very easy for
    the programmer. You will be able to achieve your goals in little time and become
    the owner of your personal network.  


    1\. Metasploit 


    Metasploit is a frame that helps to create exploits, shellcodes, triggers, honey
    pots and payloads. Metasploit is a bank of several exploits and similar elements
    that are packed into its frame. The software is public and can be used on many
    operating systems out there, including Linux and Windows. It comes with Kali Linux
    by default. Metasploit is a foul device that can threaten other networks. You
    want to examine faults in network security and learn how to manage them to prevent
    external attacks. 


    Web applications and servers are also subject to attacks by Metasploit. In Metasploit,
    GUI and command line interfaces exist equally. Metasploit is available as a free
    version and but also has paid version (Metasploit Pro), which offers more functionality. 


    2.  NMAP'
