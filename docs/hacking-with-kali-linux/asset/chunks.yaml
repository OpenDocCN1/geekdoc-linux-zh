    ,      "api_option" : "delete" ,"api_paste_key" : paste_key }      res = requests.post(post_url,
    data=data)      return res.text |


    # Chapter 10 The Laboratory


    The first task is to build our own laboratory.


    Don’t experiment the techniques I will teach you on contexts other than your laboratory:
    this is not the right way to become an ethical hacker!


    How can we build a protected environment where we can perform our simulations?
    The answer is straightforward: we can use a hypervisor.


    This consists in simultaneously executing multiple virtual machines and, therefore,
    more operating systems within the same physical system. A hypervisor makes the
    whole process much more convenient!


    Virtualization


    By using these programs, you will be able to run several operating systems at
    the same time inside your PC. The only limit you have is the RAM memory you can
    use.


    The procedure is not difficult, even though you will need to become more familiar
    with this tool. Basically, here is the list of steps you should take:


    *   Download a particular software called hypervisor.


    *   Collect the .iso images of the operating systems you want to install.


    *   Access the software.


    *   Start the virtual machine creation process.


    *   Create and boot this virtual machine.


    *   Proceed with the installation of the desired operating system.


    *   Use the virtual machine you have just created.


    Hypervisor


    You can choose among several versions. Some of them are free, while others require
    a subscription fee. Here are the most common ones:


    *   VMware Workstation (paid version, 30-days free trial).


    *   VMware Player (free version).


    *   Oracle Virtualbox (free version).


    The hypervisor we will use in this book is the VMware Workstation. It is a paid
    version, but we can take advantage of its 30-days free trial.


    I have chosen to use this hypervisor because it is the most complete one in terms
    of the variety of functions and options available for network management.


    For download it, go to this link and click on “Download”: https://my.vmware.com/en/web/vmware/free#desktop_end_user_computing/vmware_workstation_player/15_0.


    If version 14 – the latest version of this software – is not working, you can
    try version 12\. Some older CPUs are not supported. If not active yet, you need
    to enable the virtualization support from BIOS (search on Google).


    At this point, if the installation is successful, this is what you should be able
    to see, obviously without any virtual machine already installed.


    Now you are finally ready for the next step.


    Images of an operating system


    In order to create your virtual machines, you need an image of the operating system
    you want to install. For the lab we are building, you need the image (.iso format)
    of the following operating systems:


    *   Kali Linux -> freely downloadable from https://www.kali.org/downloads/.


    *   Windows 7 -> 30-days version, easy to find on the Internet.


    *   Windows 10 -> 90-days version, easy to find on the Internet.


    If you are wondering why I picked these operating systems, this is the main reason:
    Kali Linux will be our attacking machine, basically the one which we will use
    to start all our attacks. The other two Windows machines will instead be our targets.


    Creation of virtual machines


    Now we just need to create virtual machines. To do this, go to "File -> New virtual
    machine" and follow the recommended procedure.


    Pay attention to the quantity of RAM you will be using. This amount depends on
    the RAM available on your PC, and you should try not to overuse it. Besides, for
    now just keep using the default options of your network adapter.


    Network management


    Managing the network correctly is extremely important. If you do not configure
    it correctly, the virtual machines will not be able to communicate between each
    other and hence your laboratory will not work properly.


    In VMware, we can use 4 different types of networks:


    As you can see from the screenshot above, these are the types of networks available:


    *   Bridged -> this type includes the creation of an IP address belonging to the
    network in which your physical PC is located. I will explain later what an IP
    address is.


    *   For now, you just need to remember that it is a numerical representation that
    uniquely identifies a specific interface on the network. An example of an IP address
    is 192.168.1.10.


    *   NAT -> once in this mode, your virtual machine can connect to the Internet,
    but it cannot be reached from the outside.


    *   Host-only -> in this case, the virtual machine can only communicate with your
    physical host.


    *   Custom -> here you can define your personal network and let all the virtual
    machines communicate inside it. This is the mode we will use!


    To create it, go to "Edit -> Virtual Network Editor" and create a new network
    as in the screenshot here below.


    Now you should go back to the settings of your virtual machine. You can choose
    the network adapter we have just created.


    After this step, each virtual machine will have its own IP address, which is automatically
    assigned and belongs to the 192.168.10.0/24 network.


    Virtual machines booting


    Now you are ready to boot your virtual machines. If you have correctly performed
    all the operations described above, the machines will all be started up and will
    have the IP address previously assigned.


    For example, Kali Linux could have 192.168.10.1 as its IP address, while a Windows
    7 machine could have an IP address of 192.168.10.2, and one with Windows 10 a
    value similar to 192.168.10.3.


    Keep in mind that these virtual machines will now only be able to talk to each
    other and cannot be connected to the Internet. If needed, we will have to change
    the network adapter and set the NAT mode.


    Installation of vmware tools'
