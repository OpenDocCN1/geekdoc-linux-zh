    ,         "api_user_name" : self.user_name ,         "api_user_password" : self.password
    } )      self.api_key = self.res.text |


    The new class in our code defines the _init_ method with the Pastebin developer
    key provided, the username, and password, which it stores in case they are needed
    for the next session.


    We will write a code to send a POST request containing the login details to the
    Pastebin servers. If login is successful, the API will respond with a temporary
    key which we will store as an attribute to validate all future requests. 


