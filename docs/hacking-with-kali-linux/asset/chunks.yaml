    ### 3. 技术受众

    软件开发人员以及安全经理会对阅读你报告的细节感兴趣。他们负责修复安全漏洞和修补缺陷，因此他们希望彻底阅读你报告中的技术部分。你应该在报告中包含截图，以帮助他们解决问题。


    ## 报告结构

    现在，让我们来看看渗透测试报告的精确结构，以了解它应该包含哪些信息。


    1. **封面**：我们从最开始的封面。这一部分应该包含你的公司标志（如果有的话）、标题以及对测试的简短描述。封面看起来应该是专业的，因为它的质量将影响客户对你作为专业人士的认知。

    2. **目录**：这一部分是不言自明的。紧接在之后之后，你应该写一个清晰的索引，以便每个特定的受众都能直接跳到报告中与其职位相关的部分。

    3. **执行摘要**：报告的这部分价值极高，它可以决定整个文档的成败。执行摘要是专门为公司的 CEO 或其他拥有执行权力的人编写的。它应该针对缺乏技术知识的受众进行全面编写。你应该首先定义测试目的以及你是如何执行测试的。然后清晰、扼要地解释你的结果和发现。摘要应该包括发现的总体弱点以及导致这些漏洞的具体原因。最后，写下你在深入分析后确定的风险，并讨论如何通过采取正确的措施来降低这些风险。

    4. **修复报告**：报告的这部分主要针对管理层，但执行层也可能感兴趣。记住，这两类受众可能都缺乏技术知识。那么，修复报告主要是关于什么的？它应该包含你所有的实施后将提高安全性的建议。例如，你可能会建议实施新的防火墙或入侵检测系统。你应该清晰、扼要地列出并描述一切。

    5. **发现摘要**：也称为漏洞评估摘要。在报告的这一部分，你将讨论所有的发现，换句话说，就是涉及所测试系统的优势、弱点和风险。在这里，你应该包含图表和其他视觉表示，以帮助受众理解状况。展示你发现的漏洞，并根据其严重程度对其进行分类。

    6. **风险评估**：这一部分是你根据发现展示风险的地方。你应该描述每个漏洞对系统可能产生的影响以及它发生的频率。

    7. **方法论**：请记住，报告的这一部分是完全可选的，除非客户要求你遵循特定的方法论。在这种情况下，你应该报告你所采取的步骤，甚至包含一个清晰显示流程的流程图。

    8. **详细发现**：报告的这部分针对技术受众。在这里，你将详细讨论你的发现，并包含关于你发现的漏洞的信息、其产生原因、涉及的风险以及你为改进数据安全提出的建议。开发人员和安全经理需要知道漏洞是在何处以及如何产生的，以便采取正确的步骤解决问题。


    现在你已经掌握了渗透测试的概念，并理解了报告应该如何编写，是时候向前迈并学习黑客的技术方面了。


    # 第 2 章：入门

    黑客以高度智能和在许多方面才华横溢而闻名。因此，从零开始似乎是一项难以完成的任务。必须记住，每个人都必须从某个地方开始。通过奉献和坚持，在技能范围内可以走得非常远。在成为黑客的过程中，非常有帮助的方法是设定一些目标。问问自己为什么要学习黑客以及你打算实现什么。有些人只想学习基础知识来保护自己的家人或业务。


    ## 学习

    黑客武器库中最重要的武器是知识。对于黑客来说，尽可能多地学习计算机、网络和软件知识不仅很重要，而且为了保持竞争力和有效性，他们必须跟上不断的变化。黑客不必成为工程师或计算机科学家，也不需要对微处理器设计有深入的了解，但他们应该理解计算机是如何工作的、其主要组件、它们是如何在本地和通过互联网进行联网的、用户如何与机器交互，以及最重要的是软件如何规定计算机的功能。一个优秀的黑客精通并熟练使用多种计算机语言，并理解主要的操作系统。对于黑客来说，熟悉密码学历史、数学和实践也是非常有用的。


    一个几乎没有黑客经验、对编程只有略懂或中等知识的门外汉对系统发动攻击是可能的，而且越来越常见。人们通常使用脚本并遵循由经验丰富的操作员开发的程序这样做。这最发生在简单类型的攻击中。这些缺乏经验的黑客在黑客社区中被称为“脚本小子”（script
    kiddies）。这类活动的问题在于，执行者对他们正在运行的代码中所发生的情况了解很少，可能无法预见到副作用或其他非预期后果。在尝试攻击之前，最好完全理解你在做什么。


    ### 计算机和处理器

    计算机的大小、形状和用途各不相同，但大多数计算机在本质上具有相同的设计。一个好的黑客应该研究计算机如何从 20 世纪最早的机器演变成我们今天使用的极其复杂的机器。在这一过程中，显而易见的是计算机具有相同的基本组件。要成为一个有效的黑客，你应该了解大多数现代计算机上存在的不同处理器。例如，三个最大的微处理器制造商是
    `Intel`、`American Micro Devices (AMD)` 和 `Motorola`。这些处理器构成了黑客将遇到的大多数个人计算机，但每个处理器都有自己独特的指令集。虽然大多数黑客很少需要处理机器层面的编程语言，但更复杂的攻击可能需要理解处理器指令集之间的差异。


