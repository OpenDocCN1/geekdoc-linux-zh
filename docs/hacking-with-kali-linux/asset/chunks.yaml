    ## 社会工程技术


    ### 助人技巧

    在光谱的另一端是“助人技巧”。这涉及到假装困扰和担心，以利用技术人员提供帮助和同情的本性。与其表现出愤怒并向技术人员施压，苦恼的黑客会表现得好像自己正面临压力并对结果感到担忧。技术人员会尽一切可能提供援助，而不必考虑可能给黑客带来进一步困扰的后果。


    ### 挂名效应

    拥有授权用户的名字让黑客获得了一个优势，他们可以假装成某个有权访问信息的特定人物。这可以通过搜索网上容易找到的公司网页来实现。另一个例子是搜索被不当丢弃的文件，为黑客提供关键细节。


    ### 技术手段

    社会工程攻击的另一个领域是利用技术作为支持手段来获取信息。这可能涉及黑客向合法用户发送传真或电子邮件，要求用户回复敏感信息。黑客通常冒装成执法部门或法律代表，要求这些信息作为其正在调查的文件的一部分。


    ## 恶意软件与工具


    ### Rootkit 程序 (Rootkit)

    Rootkit 通过合法的进程，使用底层且难以检测的程序进入你的操作系统。Rootkit 可以从用户手中接管操作系统的控制权，由于程序本身作为代码替换部分隐藏在系统二进制文件中，用户手动检测并删除该程序极其困难，几乎不可能。


    ### 数据包分析器 (Packet Analyser)

    在互联网或任何其他网络上传输数据时，黑客可以使用名为数据包分析器或数据包嗅器的应用程序来捕获数据包，这些包可能包含密码和其他记录等关键信息。


    # 第 14 章 什么是加密和数字签名


    加密是利用微缩点、图文组合或其他方式隐藏数据的策略。在专业领域，它倾向于被称为将明文混乱成一种编码结构，通常称为 `Ciphertext`（密文），当然将其转换为未混乱的配置
    `Cleartext`（明文）。这种编码和破解的过程被称为加密，从事该领域的人被称为密码学家。


    ### 加密的目标是什么？


    目前的加密追求以下目标：


    1. **机密性**：圈外的任何人无法理解发送者和接收者之间的数据。

    2. **完整性**：消息一旦发布，无法进行任何修改。

    3. **真实性**：加密框架中的数据和来源是绝对真实的。发送者和接收者都可以识别彼此以及数据的起点或终点。

    4. **不可否认性**：发送者或接收者任何一方都不可以在稍后否认消息。

    5. **访问控制**：只有经过许可的人才能访问机密信息。


    为了实现上述目标，完善了以下加密组织：


    1. **对称加密**：也称为密钥加密，这是一种发送者和接收者共享相同秘密代码和密钥进行加密和解密的策略。如果你正在与固定数量的人交谈，这种策略非常有用，但对于大众通信来说价值不大。

    2. **非对称加密**：这被称为公开密钥加密，其中使用不同的密钥进行加密和解码。这对于密钥交换和数字签名非常有用，例如 `RSA`、数字签名算法、公开密钥标准等。

    3. **消息摘要**：在此，使用哈希函数来永久混乱信息。这也被称为单向加密。


    加密确保系统资产免受篡改、破坏和未经授权的使用。它们保护系统架构、IT 资源和机密信息。在现在，修改或控制信息和数据变得非常简单。隐私数据的泄露再次是一个令人不安的现象。


    加密系统自苏美人时期（公元前 3500 年）起一直在使用。加密依赖于密钥，正如你将回顾的，密钥是提供计算内容的因素。加密有两种基本类型：传统加密和公开密钥加密。在传统加密中，使用单一密钥执行加密和解码。由于密钥是不可区分的，它们被称为对称密钥。由于传统加密中只使用一个密钥，它的安全性较低。如果除预期接收者以外的人发现了密钥，他就可以解码第一条消息。传统加密的另一个缺点是分发很危险。如果有人在密钥通往预期接收者的途中拦截了它，消息的安全性就会受到破坏。“PGP
    Desktop` 还允许你对个人记录和文件夹（你硬盘上分配为虚拟磁盘的部分）或整个硬盘进行加密。


    在公开密钥加密中，使用两个密钥：一个公开密钥执行加密，一个私钥执行解码。由于密钥是唯一的，它们被称为非对称密钥。这允许任何人加密消息，但只有拥有相应私钥的人才能解码消息。为了解释这一点，我们来看一个模型。如果
    Paul 需要给 Sara 留下印象，他使用 Sara 的公开密钥来加密消息。当 Sara 收到消息时，她使用她的私钥来解码。只要消息圈中的每个人都对其私钥完全保密，只有预期的接收者才能破解消息。公开加密还解决了分发问题，因为只有公开密钥需要在不安全的网络上传输；私钥则保留在本地。


    # 第 15 章 跟进


    与你的潜在客户继续对话并礼貌地跟进，以确保没有业务遗漏。


    “但我不会失去我们独特的个性化销售体验吗？”我们的一位客户——一家知名的游艇中介公司——怀疑地问道。这位客户在过去的十年里一直避开数字营销 marketing，借口是他们不想把那些反复无常、高净值的客户当成“一个数字”。


    我们客户的营销方法包括举办豪华的游艇聚会和独家晚宴。与会者是处于“黄金年”的富裕退休男性，他们看重高接触、低压力的销售体验。游艇的追求过程通常持续多年，客户人才会放心地写下数百万美元的支票。


    当销售停滞几年时，客户将其归咎于经济。但当经济复苏而销售开始下滑时，他们感到紧张，知道必须采取某些行动来扭转这一趋势。


    游艇中介公司正面临着鱼子和香槟的餐饮账单，但莫名地陷入了记忆中最长的销售枯水期。为了扭转局面，他们策划了一场世纪晚宴，比以往任何时候都更大、更贵。然而，由于几个月没有卖出过大游艇，他们的资金库几乎耗尽，他们担心可能不得不取消活动。


