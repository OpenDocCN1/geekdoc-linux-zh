    The primary value in building a database of prospects is two-fold. For companies
    that experience seasonality or cyclicality, a single message broadcasted to your
    list of leads can help you control the ups and downs of your business. Additionally,
    as you release new products and services, you will have an immediate audience
    to tap into. In fact, we’ve worked with companies that recruit passionate customers
    from their database to help provide feedback in the product-development process.
    The ability to control seasonality and have an audience to launch to has palpable
    value if you were to sell your business in the future. We’ve seen entire companies
    purchased for millions of dollars solely for their database of leads and customers.


    # The Process


    Prior to designing the follow-up sequence, it’s important to have a clear articulation
    of the brand voice. The voice is a set of rules for the writing produced by your
    brand and is a function of having an intimate understanding of your target audience.
    One can further assume that the individuals inclined to sign up to receive more
    follow-up information are going to be more responsive to logos-based (logic) rhetoric
    than the cohort of clients that make more pathos-based (emotion) decisions and
    purchase without needing to do deeper diligence.


    Once the brand voice is clearly articulated, one can apply the 4 E’s of Copywriting
    framework to craft messages that captivate and motivate. Broadly defined, the
    more “E’s” you convey, the better:


    ## The 4 E’s of Copywriting


    - **Engaging**: Is the content compelling and of interest to the reader?

    - **Educational**: Is the content teaching the reader something relevant to your
    product or service?

    - **Entertaining**: Would the reader enjoy reading your content?

    - **Emotional**: Would your content stir up emotions inside your reader?


    The 4 E’s framework serves as a solid mental checklist as you assess the potential
    impact and influence of your follow-up messaging. While it may not be necessary
    to touch on all four points all the time, the 4 E’s framework gives you a self-assessment
    standard for building trust, authority, and rapport.


    One common stumbling block during the construction of the follow-up process is
    coming up with topics to write about. As with the other components, `ASP™ Follow-Up`
    is a digital manifestation of an analog process that you already employ. Follow-up
    phone calls and direct mail to prospective buyers are the analog parallel to what
    can be replicated digitally. The framework we use as a starting point when building
    out a follow-up process is as follows:


    ## Even When You Don’t Get Their Contact Info


    Going back to our illustrative sample of one hundred website visitors, you may
    get three individuals to make a direct purchase and another three to opt in for
    your lead magnet and potentially purchase from you at a later date. Although that
    number may appear immaterial, assuming one out of those three leads who opted
    in purchases from you, you have increased your sales by 33 percent, which is not
    bad. The beautiful thing is, there is a way for you to stay in front of all your
    website visitors, even if they didn’t give you their contact information. The
    way you stay in front of all your website visitors is with an advertising method
    called “retargeting” (also called “remarketing”). Retargeting enables you to get
    the frequency of impressions of a multibillion-dollar brand such as `Coca-Cola`
    without needing a multibillion-dollar advertising budget.


    The way retargeting works is by identifying and remembering users, through their
    web browsers, who have visited your website and serving ads to those users as
    they browse other places on the web. Whether they’re perusing a social media site
    or reading their favorite blog, retargeting allows you to target your ads specifically
    to people that have previously visited your website. This is powerful because
    it allows you to market specifically to individuals who have shown interest in
    your specific product or service and your brand.


    Going back to the Advertising Rule of 7, retargeting ads are the key difference
    makers between someone remembering your brand and forgetting. The first brand
    impression may be a pay-per-click ad, the second brand impression would then be
    your website, and impressions three through seven would be from retargeting ads.
    You may assume that this powerful form of advertising would be extraordinarily
    expensive but unless you are getting more than ten thousand monthly visitors,
    your ad spending will probably be less than one hundred dollars a month. For most
    businesses with a local presence, monthly visitors range in the single-digit thousands,
    so this is a delightfully low-cost growth hack to implement.


    Categorically, we make two main differentiations in retargeting ad units: brand-based
    and direct-response ad units. Intuitively, brand-based ad units convey your overall
    brand or company, and direct-response ad units focus on a specific product or
    service. Starting out, we advise launching brand-based ad units and retargeting
    visitors that visit any page of your website. If you only offer a singular product
    or service, then you may be able to experiment with direct-response style ads
    targeted to all visitors. Otherwise, for those companies that have more than ten
    thousand monthly visitors and offer multiple products or services, you can get
    more granular and retarget to people that visited specific pages. For example,
    if you were a roofer that also provides solar installation, you could serve solar
    ads to a prospect that visited the solar page of your website.


    ### Growth Hacktic


    One way of cutting down your retargeting ad bill is through “pixel burning.” For
    websites that have a payment portal online, such as e-commerce sites, you can
    isolate those who have completed payments and remove those individuals from the
    retargeting population since they have already completed the desired action.


    ## Growth Hacking Applied


    As we investigated the situation, the yacht brokerage’s slumping sales seemed
    to correlate directly to the reduction in the broker head count. The brokers make
    their money on commission, and the static sales caused a couple brokers to seek
    employment elsewhere.


    When we spoke with the remaining brokers, they talked about how busy they were
    following up with thousands of prospects in their Rolodex, especially as they
    assumed responsibility for the prospects previously handled by the departed brokers.


    When we asked the brokers, “Which prospects are the most important ones?” they
    curtly replied, “They’re all important.” When we modified the question by inquiring,
    “Which prospects are most likely to buy in the next eight weeks before the soirée?”
    Again they replied, “They’re all equally likely to buy; they buy when they’re
    ready.”


    If all the prospects were equally important and equally likely to buy, we needed
    to build a way for the brokers to politely and unobtrusively follow up multiple
    times in advance of the soirée in order to maximize the likelihood of a sale taking
    place. Simply put, the brokers needed leverage.


    The first thing we implemented was an autoresponder email campaign. In our conversations
    with the yacht brokers, we compiled perfect answers to all the frequently asked
    questions and common objections. We also crafted customer stories that conveyed
    the yachting dream life. To complement the autoresponder technology, we implemented
    a robust retargeting display ad campaign that kept the brokerage’s brand name
    in front of the potential customers practically every time they browsed online.

