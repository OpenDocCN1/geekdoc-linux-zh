    \n书中使用的虚拟机监控程序是 `VMware Workstation`。它是付费版本，但我们可以利用它的 30 天免费试用。\n\n我选择使用这个虚拟机监控程序是因为在网络管理的可用功能和选项方面它是最完整的。\n\
