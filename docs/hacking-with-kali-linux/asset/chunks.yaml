- fmt: '

    Networks do not allow access to all their IP addresses. Only certain trusted IP
    addresses can make their way into the network. To gain access into the network,
    the hacker uses an IP address that spoofs a trusted IP address.


    For example, let us suppose that a certain network allows the IP address `x.x.x.x`
    to gain access into its system. A hacker whose system IP address is `y.y.y.y`
    spoofs their IP address to appear like `x.x.x.x` to gain access into the network.


    IP spoofing is mostly performed to flood the target system with huge amounts of
    data, increasing the traffic. Sending more data packets than the system can handle
    will overload the target system. All the data packets seem to come from several
    spoofed IP addresses. In another method, the target system’s IP address can be
    spoofed to send a huge number of data packets to the other systems on the same
    network. To the other systems, it appears as though the data packets are being
    sent from the target system, when in reality it is actually the hacker who is
    sending the packets from their system. As a result, all the systems that have
    received the data packets flood the target system with responses, thereby overloading
    it with traffic.


    Some networks use IP-based authentication instead of the user login authentication.
    In such authentication schemes, the IP addresses of the machines that are requesting
    access are verified based on trust relationships. In such cases, the hacker can
    perform spoofing by impersonating a trusted machine, which has permission to access
    the network.


    ## Arp spoofing


    Address resolution protocol (ARP) is a protocol that maps the IP address of a
    machine to the MAC address. MAC stands for media access control. The MAC address
    of a system is nothing but the physical address of the hardware. ARP spoofing
    involves a hacker spoofing ARP messages and sending them across the network, such
    that the MAC address of the hacker’s system gets linked an authorized system’s
    IP address, which is present on a network. Thus, all the data to be sent to the
    authorized system will actually be sent to the hacker’s system.


    ARP spoofing is performed for the following reasons:


    * Stealing information that is private to the network

    * Modifying data in transmission

    * Halting the traffic in the network

    * Hijacking sessions

    * Implementing man-in-the-middle attacks


    It is possible to carry out ARP spoofing only in local area networks (LANs). This
    is because the address resolution protocol can only be used in a local area network.


    ## DNS Server Spoofing


    The domain name system is a service that maps the domain names to their IP addresses.
    The DNS server allows email addresses, uniform resource locators (URLs) and domain
    names to be resolved into their respective IP addresses. A domain name spoofing
    attack involves an attacker manipulating a DNS server so that a particular domain
    name is mapped to an IP address that is under control of the attacker. Those IP
    addresses contain malware-infected files. This type of spoofing is commonly used
    to propagate computer viruses and worms over the Internet.


    ![Description: Description: https://lh6.googleusercontent.com/jSwI_6NCbnjDM9vFjdzgkIxck2ShTARrd0GOM0ZwfwPYfkRIr5hykdKX1Ljs-gEaKDEgrfgf2swjdRKggFCFRXDgO_gQwv0zJiTU8sjBxcnsuuM632yK26Ss_mY3ghirfhgzUbA](Images/image00099.jpeg)


    ## Website spoofing


    Website spoofing involves the creation of a fake website that impersonates a legitimate
    website. Usually, it has the same design as that of the original website and sometimes
    may possess a similar URL. So, when an individual mistakes the spoof website to
    be the original one and enters sensitive information like username/password or
    other personal details like phone number, Social Security Number or address, the
    information actually goes into the hands of the attacker.


    In a more serious attack, the attacker may create a shadow copy of the WWW (World
    Wide Web) so that the victim’s data traffic is turned toward the attacker’s system.
    As a result, the attacker can capture private information on the victim. The URL
    of the spoof website can be made to look genuine by using control characters.
    The actual address of the website remains concealed in the background.


    For example, let us suppose you are a bank customer and you use the bank’s website
    for online banking. Let us suppose you have been redirected to a fake website
    that has the same design and layout of the original bank website. It may also
    possess a URL that is similar to the bank website’s URL. Hence, you mistake the
    fake site for the actual site and enter sensitive information like your credit
    card details and the PIN number. Now the attacker running the fake website captures
    the information you have entered and may use it for malicious purposes.


    ## Email spoofing


    Email spoofing involves forging the “from address” of an email before sending
    it to make it look like the email has arrived from a trusted person/source. Spammers,
    to deceive the receiver about the legitimacy of the email origin, mostly use email
    spoofing. Email spoofing is also used to circulate worms or viruses through emails.


    For example, let us suppose that an individual “X” receives an infected email,
    which they open unknowingly. The worm code sent with the email infects X’s email
    account. The worm code then goes through X’s email contacts and detects the email
    addresses of two individuals “Y” and “Z.” Let us suppose X, Y and Z are friends.


    Without X’s knowledge, the worm code composes a similarly infected email and sends
    it to Y. It is not a big problem, if Y receives the email from an unknown source,
    as they are unlikely to open it. But what actually happens is, the worm code uses
    Z’s email address to forge the “from address” before sending the email to Y. In
    Y’s inbox, the infected email appears to have come from “Z,” who is a friend of
    Y. But, in reality it is a mail circulated by a worm code. Y is likely to open
    the infected email as it shows Z’s email address as the “from address.”


    # Chapter 8: Some Of The Basic Functions Of Linux


    Now it’s time to move on to some of the basics that you are going to need to learn
    in order to use Linux confidently. These functions are important for helping you
    to navigate the computer system with ease. Let’s take a bit of time now to look
    at these basic functions, and learn how they can work for us.


    ## Logging In and Out of the Interface


    When it comes to the Linux operating system, you are first going to need to provide
    your login credentials, meaning a username and password, each time that you try
    to get onto the system. In addition to this, there are two modes that you can
    choose between when you are running the Linux system, and we will take a look
    at them below:


    ### Graphical Mode


    The graphical mode is going to be the default mode for your desktop computer.
    Basically, if the computer screen is asking for the password and username before
    letting you on, you will know that you are using the graphical mode. To sign in,
    you will just need to enter in the login credentials that you have already set
    up, and then hit OK or `ENTER` to continue.


    After you enter in this login information, it can sometimes take a few minutes
    to get everything loaded up and ready to go; the amount of time that it takes
    for things to get going will depend on how powerful your computer is and its processing
    capabilities. When the computer has finished loading, you will need to open up
    an `xterm`, otherwise known as a terminal window. You will be able to find this
    tool by simply clicking on Applications and then choosing Utilities. Note: in
    some of the newer versions of Linux, there will be an icon available to speed
    up this process and you can just click on that rather than going through the steps
    above.

