- fmt: "\nTo detect weaknesses within a computer network, hackers use a tool known\
    \ as vulnerability scanner. This could also refer to port scanners which are used\
    \ to scan a specific computer for available access points that the hacker would\
    \ be able to take advantage of. The port scanner is also able to determine what\
    \ programs or processes are running on that particular port which allows hackers\
    \ to gain other useful information. Firewalls have been created to prevent unauthorised\
    \ access to these ports however this is more of a harm reduction strategy rather\
    \ than a sure-fire way to prevent hackers. �\n\nSome hackers are able to discern\
    \ access points manually rather than using a program. This involves reading the\
    \ code of a computer system and testing weaknesses to see if they are able to\
    \ obtain access. They can also employ methods of reverse engineering the program\
    \ to recreate the code if they are unable to view the code. \n\n## Brute Force\
    \ Attack\n\nIf you have ever wondered why you have a limited number chances to\
    \ enter your password before being denied access, the server you are attempting\
    \ to access has a safeguard against brute force attack. Brute force attack involves\
    \ software that attempts to recreate the password by scanning through a dictionary\
    \ or random word generator in an extremely short amount of time to hit on the\
    \ password and gain access. For this reason, passwords have advanced to become\
    \ far longer and more complex than they once were in the past, such as including\
    \ characters, numbers, upper and lower-case letters and some going as far as barring\
    \ words that are found in the dictionary.  \n\n## Waterhole Attacks\n\nWaterhole\
    \ attacks are known by this name due to the fact hackers prey on physical locations\
    \ where a high number of people will access their computers and exchange secure\
    \ information. Similar in a way that a waterhole can be poisoned for the wildlife\
    \ surrounding, the hacker can poison a physical access point to claim a victim.\
    \ For example, a hacker may use a physical point such as a coffee shop, coworking\
    \ space or a public Wi-Fi access point. These hackers are then able to track your\
    \ activity, websites frequented and the times that you will be accessing your\
    \ information and strategically redirect your path to a false webpage that allows\
    \ the information to be sent through to the hacker and allow them to use it at\
    \ a later time at their leisure. Be sure that when you are using public Wi-Fi,\
    \ you have appropriate anti spyware and antivirus software to alert you when there\
    \ may be suspicious activity while online. \n\n## False WAP\n\nSimilarly, to the\
    \ waterhole attack, the hacker can create, using software, a fake wireless access\
    \ point. The WAP is connected to the official public wireless access point however\
    \ once the victim connects they are exposed and vulnerable in that their data\
    \ can be accessed at any point and stolen. When in public spaces, ensure that\
    \ the WAP you are using is the correct one, they will generally have a password\
    \ prior to access or a portal which will require you to enter a username, email\
    \ address and password which is obtained from the administer. If you find the\
    \ access point is completely open, this could be a cause for alarm knowing that\
    \ this point is likely bait.  \n\n## Phishing\n\nAnother common technique used\
    \ by hackers to obtain secure information from an unsuspecting victim is through\
    \ phishing. Phishing involves a hacker creating a link that you would normally\
    \ associate with a site that you commonly access such as a banking site or payment\
    \ portal. However, when you input your details, they are sent to the hacker rather\
    \ than the institution that you you believe you are sending them to. Phishing\
    \ is often times done through sending false emails that appear as though they\
    \ are from your bank or billing institution and generally request that you access\
    \ your account to either update your details or make a payment.  \n\nThere are\
    \ ways to distinguish whether you are being targeted for phishing such as checking\
    \ the sender's ID (which can still be falsified) or checking the details of the\
    \ link that you have been provided and seeing that it doesn’t match up with the\
    \ usual site that you fill your details in. You may also notice formatting issues\
    \ with the email such as logos out of place or poor formatting that would indicate\
    \ that the phisher is not using the correct template. Many institutions will insist\
    \ that they would not request your details through email or ask you to update\
    \ your details and if you do receive your bill through email, if you feel suspicious\
    \ you can check with previous billing emails or even call your institution to\
    \ double check that the email is genuine.  \n\n## Clickjacking Attacks\n\nIf you\
    \ have ever attempted to stream a video on a less reputable site, you may have\
    \ noticed that the interface can be quite confusing to navigate due to false play\
    \ buttons or common sections after which you click on them and are then redirected\
    \ somewhere else. These are known as Clickjacking attacks as well as UI Redress.\
    \ While redirecting to the ad or another page may seem harmless, when done correctly\
    \ these attacks can be quite sinister and potentially dangerous as they are able\
    \ to capture your information. You need to exercise extra caution when using unfamiliar\
    \ websites as they may not be as safe as they appear, with their interface taking\
    \ you to a place right where the hacker wants you. Always be aware of the URL\
    \ of each click you make and if it differs drastically from the website that you\
    \ were just on, ensure that where you are taken does not involve any downloads\
    \ or exchanging of details for your own protection. \n\n## Bait and Switch\n\n\
    The bait and switch technique involves the hacker supplying you with a program\
    \ that appears to be authentic but when it faces it is a virus or a tool used\
    \ by the hacker to access your computer. These can generally be found in unscrupulous\
    \ websites that offer pirated programs, software, movies or games that are in\
    \ high demand. Once you download the program, you will find that the file is not\
    \ what you had intended and instead had loaded a virus to your computer to provide\
    \ the hacker with access.  \n\n\n\n## Social Engineering\n\nWe mentioned earlier,\
    \ the social engineering techniques used by white hat hackers. This technique\
    \ is often overlooked as a means of hacking however it can be quite effective.\
    \ An example of social engineering is conning a system administrator into supplying\
    \ details by posing as a user or an individual with legitimate access. These hackers\
    \ are often thought of as con men rather than what we understand to be hackers,\
    \ however it is a means of hacking nonetheless. Many of these hackers have a good\
    \ understanding of the security practices of the organization in which they are\
    \ attacking. They will target and prey on those who may not be as experienced\
    \ or with a lower level security clearance than some of the higher ups. For example,\
    \ they may phone up the employee on the helpdesk and request access to the system\
    \ and without the experience to understand the consequences of providing information\
    \ to an unknown source, give it up. There are a number of categories that social\
    \ engineering can be placed in, these being:\n\n### Intimidation\nAn example of\
    \ intimidation would involve a superior such as a manager or supervisor calling\
    \ the help desk technician, angry and threatening to punish the technician if\
    \ their authority is questioned. Under pressure, the employee will comply and\
    \ provide the information. Their questioning of the authority is promptly shut\
    \ down as the employee values their job and offers to assist the hacker in securing\
    \ the information.  \n"
