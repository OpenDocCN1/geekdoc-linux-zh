    ports that are accessible to map network servers and so on. The core function
    of NMAP is security analysis and the examination of networks to detect computers
    that are available online. NMAP uses IP addresses and packets in a way that reveals
    useful details about a network. For example, it shows the ports that can be used
    to access the network and the apps being used on the computer. It is advisable
    to first have some idea concerning the commands before proceeding further to the
    GUI. 


    3\. Armitage 


    The Armitage is a display control tool employed in cyber security that creates
    an interface for the Metasploit attachment that simplifies Metasploit, making
    it less complex so it can easily be comprehended. Armitage is a good place to
    start if you want to learn more about Metasploit. All of the functions of Metasploit
    are gathered by Armitage in the procedures of hacking, as they are meant to exploit,
    circumvent and raid a network.  


    4\. Jhon the Ripper


    JTC is the acronym for “Jhon the Ripper.” It is a renowned tool for breaking through
    an arena that is heavily secured with passwords. Simply referred to as Jhon in
    the hacking world, it is the primary tool used to launch what is called a dictionary
    intrusion. Jhon the Ripper has a bank of text called the “word list”, which is
    composed of previously cracked passwords. Jhon the Ripper selects one of these
    passwords from its bank and replaces the wordlist of the password to be cracked.
    Then it gives the result of the new imputed password. In other words, the hacker
    takes a previously cracked password and interferes with the system in such a way
    that this previously cracked password is substituted for the password to be cracked.
    After that, the past success is re-initiated by Jhon and the substituted password
    is re-cracked. There is a similarity between Jhon the Ripper and THC Hydra, which
    is a similar cracking tool. The slight difference is that Jhon is used offline
    while Hydra is used an online. 


    5\. Wireshark 


    Wireshark is an open source tool that scrutinizes networks with an outline of
    network traffic. This tool belongs to the category of network sniffers.  


    Ethereal was Wireshark’s old name. Its core function is to keep an eye on differences
    that are used to monitor network traffic and to investigate packets that are sent
    to and fro. After all of this, the results are presented to the user in a format
    that can be understood. As time has passed, there have been noticeable advancements.
    For example, filters and other various packets like color coding have been created.
    All of this development has helped in one way or another, especially in sharpening
    the penetrating power of the testers. These testers are able to penetrate further
    into networks and thoroughly scrutinize the packets. 


    If you really want to become a master in network analysis, network penetration
    and acquire other hacking skills, you must have experience and knowledge about
    Wireshark.  


    6\. THC Hydra


    Hydra, very identical to Jhon, is a password-dismantling device. In the hands
    of expert hackers, Hydra can be dangerous. It is mostly combined with Jhon, as
    both are used simultaneously. Hydra breaks passwords by combining the power of
    a dictionary and brute force to assault a password where it is to be imputed.
    Hydra gives permission to a large scope of protocols. Examples include SSH, POP3,
    IMAP, Database, SMB, VNC, LDAP, SMB, RTPS, HTTP, POP, TCP, SMTP and RTPS. 


    The most powerful tool that currently exists online is “Suite.” Suite is an app
    that provides web services and penetration testing. When it is fully maximized,
    the possibility of its usage is almost limitless. Below are some of the features
    of the Burp Suite. 


    Intercepting Proxy is a feature that monitors and improves communication between
    an application and the web browser.


    Spider is a feature that specifies all lists, names and characteristics of files
    that exist on a network.


    Web  Scanner is an important feature that scans for loopholes in the server.


    Intruder is a feature that can be used to launch attacks against networks. It
    is used to scan for flaws and take advantage of them.


    Repeater improves and makes solicitations on behalf of the user.


    Sequencer examines the irregularity of the token’s CSRF, authenticity token, etc.


    Extensions allow the user to include his or her own customized plugin or to install
    plugins directly from the systems database. They are used to creatively stage
    a tactical and cryptic attack.


    7\. OWASP Zed


    One characteristic of the OSWAP Zed Attack Proxy (acronym: ZAP) is that it has
    no price tag attached to it. Its open source is made available to the public.
    OSWAP is a popular feature and an effective proxy tool that can substitute the
    Burp Suite. OSWAP is user friendly and does its job efficiently and effectively
    because it exposes the flaws of web apps. The functions of OSWAP are summarized
    as follows: 


    A. Manual testing 


    B. Scrutinizing networks for leakages  


    C. Scrutinizing the user target 


    8\. Engineering Toolkit 


    The Social-Engineering Toolkit, or SET as it is called, is another important thing
    to mention. With this tool, assaults are launched against the user who is operating
    the system instead of the system itself. It has some special attributes that grant
    access to Java applets. The user is not aware of these applets because the SET
    ensures everything is done underground. This command line, when maximized, can
    produce effective results. It works on any basic operating system including Linux
    and Windows. 


    9\. Aircrack-ng


    This is another kit that dissembles passwords and allows users to access the internet.
    In the right hands, it can be a profitable tool. However, it is difficult and
    requires a lot of effort. For newbies, Aircrack-ng is a shortwave cracking program.
    It is an 802.11 WEP and WPA-PSK keys cracking kit that can reclaim keys from various
    kinds of data. However, the data must have adequate packets and be trapped (in
    monitor mode). Aircrack-ng is an indispensable tool that you definitely want to
    be using.  


    Novices should be able crack a secured WEP with the right tools. However, a lot
    of effort will be required to crack a WPA/WPA2.


    # Chapter 5 Mobile Hacking


    With the dramatic increase in the usage of mobile phones, especially smart phones,
    mobile hacking is gaining popularity. Mobiles can be hacked to extract information
    about the device, to steal personal information, to make calls or even to corrupt
    the device, making it unusable.


    Mobile phones with Bluetooth can also be hacked using popular software tools such
    as Super Bluetooth Hack, Blue Scanner, Bluesnarfer, Blue sniff, btCrawler, etc.
    Their features are described below:


    ## Super bluetooth hack


    This is a popular mobile hacking tool that scans and discovers the nearest mobile
    devices and connects with them. After connecting, one can gain access to the victim’s
    phone book or SMS and can even switch the target device on or off. If the target
    device has weak security, this tool can also allow the hacker to send an SMS or
    make calls through the target device.


    ## Blue scanner


    Blue Scanner is a software tool that discovers all the nearest mobile devices
    that have Bluetooth turned on and will attempt to obtain information about each
    of those devices without having to pair with them.


    ## Bluesnarfer


    Bluesnarfer is a hacking tool that can connect to a Bluetooth device and steal
    information from it. Such stealing of information using a Bluetooth connection
    is called Bluesnarfing. Bluesnarfer can provide the hacker with access to the
    victim’s text messages, calendar, contacts, emails, and sometimes pictures and
    videos. It can all be done without the knowledge of the victim and without having
    to pair with the victim’s mobile phone. Using this tool, the hacker can send malicious
    code that can corrupt or completely shut down the target device.


