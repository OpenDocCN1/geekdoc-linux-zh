    为了检测计算机网络中的漏洞，黑客使用一种名为漏洞扫描扫描的工具。这也可以指端口扫描器，它们用于扫描特定计算机是否存在可用的访问点，黑客可以利用这些访问点。端口扫描器还能确定特定端口上运行着哪些程序或进程，从而让黑客获取其他有用信息。然而，防火墙的创建是为了防止对这些端口的未经授权访问，但这更像是一种损害减轻策略，而不是防止黑客的万能药。


    某些黑客能够手动识别访问点，而不是使用程序。这涉及读取计算机系统的代码并测试漏洞，以查看他们能够获得访问。如果他们无法查看代码，还可以采用程序逆向工程的方法重新创建代码。


    ## 暴力破解攻击 (Brute Force Attack)


    如果你好奇过为什么在被拒绝访问之前，你输入密码的机会是有限的，那是因为你尝试访问的服务器具有防止暴力破解的保护措施。暴力破解涉及一种软件，该软件会在极短时间内通过扫描字典或随机单词生成器来尝试还原密码，以命中密码并获得访问。正因如此，密码已经变得比过去长得多且复杂得多，例如包含字符、数字、大小写字母，有些甚至禁止使用字典中出现的单词。


    ## 水穴攻击 (Waterhole Attacks)


    水穴攻击之所以之所以有这个名字，是因为黑客会在大量人员访问其计算机并交换安全信息的物理地点进行攻击。就像水穴可以对周围的野生动物投毒一样，黑客也可以对物理访问点投毒以捕获受害者。例如，黑客可能会使用咖啡馆、联合办公空间或公共
    Wi-Fi 访问点等物理点。这些黑客随后能够跟踪你的活动、访问的网站以及访问信息的时间，并策略性地将你的路径重定向到一个虚假网页，允许信息发送给黑客，让他们日后可以心所欲地使用。请确保在使用公共
    Wi-Fi 时，你拥有适当的反间谍软件和防杀病毒软件，以便在在线可能出现可疑活动时提醒你。


    ## 虚假无线接入点 (False WAP)


    同样与水穴攻击类似，黑客可以使用软件创建一个虚假的无线接入点。该 WAP 连接到官方的公共无线接入点，但一旦受害者连接，他们就会暴露并处于脆弱状态，其数据可以在任何时候被访问和窃取。在公共场所时，请确保你正在使用的
    WAP 是正确的，它们通常在访问前会有密码，或者有一个要求你输入从管理员处获取的用户名、电子邮件地址和密码门户。如果你发现接入点是完全开放的，这可能引起警觉，因为这个点很可能是诱饵。


    ## 钓鱼 (Phishing)


    黑客从毫无防备的受害者那里获取安全信息的另一种常用技术是钓鱼。钓鱼涉及黑客创建一个你通常与经常访问的网站相关的链接，例如银行网站或支付门户网站。然而，当你输入详细信息时，这些信息会被发送给黑客，而不是你认为要发送的机构。钓鱼通常通过发送伪邮件完成，这些邮件看起来来自你的银行或账单机构，通常要求你访问账户以更新信息或付款。


    有很多方法可以区分你是否正成为钓鱼的目标，例如检查发送者 ID（这仍然可以伪造）或检查所提供的链接详情，看它是否与你填写详细信息的常用网站不符。你可能还会注意到邮件格式问题，例如
    Logo 错位或格式糟糕，这会表明钓鱼者没有使用正确的模板。许多机构都会坚持他们不会通过电子邮件索要你的详细信息或要求你更新信息，如果你通过电子邮件收到了账单，如果你感到怀疑，可以检查之前的账单邮件，甚至致电你的所属机构双重检查该邮件的真实性。


    ## 点击劫持攻击 (Clickjacking Attacks)


    如果你曾尝试在声誉不高的网站上播放视频，你可能会注意到界面导航可能非常混乱，因为存在虚假的播放按钮或常见区域，在你点击它们后就会被重定向到其他地方。这些被称为点击劫持攻击或
    UI 伪装 (UI Redress)。虽然重定向到广告或其他页面可能看似无害，但如果操作得当，这些攻击可能非常阴险且具有危险，因为它们能够获取你的信息。在使用不熟悉的网站时需要格外小心，因为它们可能并没有看起来那么安全，其界面会将你带到黑客想要去的地方。始终留意你每次点击的
    URL，如果它与你刚刚所在的网站有巨大差异，请确保你被带去的地方涉及任何下载或信息交换，以保护你的安全。


    ## 诱饵与替换 (Bait and Switch)


    诱饵与替换技术涉及黑客为你提供一个看起来真实的程序，但当它运行时，它是一个病毒或黑客用来访问你计算机的工具。这些通常可以在提供盗版程序、软件、电影或高需求游戏的无良网站上找到。一旦你下载了程序，你会发现该文件并不是你预期的那样，而是向你的计算机加载了病毒，以为黑客提供访问权限。


    ## 社会工程学 (Social Engineering)


    我们之前提到过白帽黑客使用的社会工程技术。这种技术经常被忽视为黑客手段，但它可能非常有效。社会工程的一个例子是伪装成用户或具有合法访问权限的个人，诱骗系统管理员提供详细信息。这些黑客通常被认为是骗子，而不是我们理解的黑客，但这终究是一种黑客手段。许多此类黑客对他们攻击的组织的安全实践有深入了解。他们会针对并猎捕那些经验不丰富或安全权限低于某些高层的人。例如，他们可能会打电话给帮助台员工并请求访问系统，而员工由于缺乏理解向未知来源提供信息后果的经验，就交出了。社会工程可以分为若干类，如下：


    ### 恐吓 (Intimidation)

    恐吓的一个例子涉及上级（如经理或主管）打电话给帮助台技术员，愤怒并威胁如果如果他们的权威受到质疑就惩罚该技术员。在压力下，员工将配合并提供信息。他们对权威的质疑会立即终止，因为员工看重自己的工作，并提议协助黑客获取信息。


