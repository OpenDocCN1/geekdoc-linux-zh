- fmt: '

    Some processors are programmable by the end user. These are known as Field-Programmable
    Gate Arrays (FPGA) and are being used more and more often for embedded systems,
    particularly in industrial controls. Hackers have been known to gain access to
    these chips while they are in production in order to deploy malicious software
    at the final destination. An understanding of FPGA architecture and programming
    is necessary for these types of sophisticated attacks. These embedded attacks
    are particularly concerning to military and industrial customers that purchase
    chips on a large scale for critical systems.


    ## Networking and Protocols


    Networks also have different architectures. The architecture is determined not
    only by the configuration of the different nodes but also on the medium that connects
    them. Originally, networked computers were always connected by copper wire. Commonly
    used copper network cables, often known as ethernet cables, consist of twisted
    pairs of copper wire. Although the most common of these cables is the category
    five, or `CAT-5`, cable, it is beginning to give way to a new standard, `CAT-6`,
    which has a greater capacity for transmission of signals. For very high speed
    applications and longer distances, fiber-optic cables are usually chosen. Fiber
    optics use light instead of electricity and have a very high capacity for carrying
    information. They are used to carry most modern cable television and high speed
    internet services. Fiber optics serve as the backbone for the internet. Within
    smaller areas, wireless networks are very common. Using a Wireless Fidelity (Wi-Fi)
    protocol, wireless networks exist in a large number of personal, private, and
    commercial LANs. Hackers are often particularly interested in hacking into Wi-Fi
    networks, resulting in the evolution of Wi-Fi security standards.


    Regardless of the architecture or medium of transmission, when two terminals are
    communicating across a network they must do so using a common set of rules known
    as a protocol. Networking protocols have evolved since the first computer networks
    were created, but they have retained the same basic layered approach. In general,
    a network is conceptualized in terms of different layers that perform different
    functions. This is also known as a stack. The most common communication protocols
    used today are the Internet Protocol (`IP`) and Transmission Control Protocol
    (`TCP`). Taken together, these are commonly known as `TCP/IP`. These protocols
    change and are standardized on occasion. It is critical for the hacker to learn
    these protocols and how they relate to communication between the different layers
    of the stack. This is how hackers can gain higher and higher levels of access
    to a system.


    ## Programming Languages


    It may seem daunting to learn a programming language from scratch having never
    done it before, but many people find that once they become proficient at one programming
    language, it is much easier and faster to learn others. Hackers not only have
    to understand programming languages to be able to exploit software vulnerabilities,
    but many hackers need to write their own code to be able to execute a particular
    attack. Reading, understanding, and writing code is fundamental to hacking.


    Programming languages range from very obscure machine code, which is in binary
    and hexadecimal format and is used to communicate directly with a processor, to
    high-level object-oriented languages that are used for software development. Common
    high-level object-oriented languages are `C++` and `Java`. The code written in
    high-level languages is compiled into the appropriate machine code for a particular
    processor, which makes high-level languages very portable between different types
    of machines. Another category is a scripted language, where commands are executed
    line-by-line instead of being compiled into machine code.


    Learning programming languages takes time and practice - there is no other way
    to become proficient. Long evenings and overnight marathons of writing, debugging,
    and recompiling code are a common rite-of-passage among beginning hackers.


    # Chapter 3 Obtaining Passwords


    In this section, we will look at how to obtain the passwords of a network. I will
    focus on wireless networks since for wired networks you will have to be connected
    via a cable. I will be using a Wi-Fi network I created for my demonstration.


    There are many ways of obtaining a network password that doesn’t involve computer
    hacking and I recommend you test these methods first and use hacking as a last
    resort. You can do stuff like, looking at files thrown away by the organization
    or person you want to hack or just ask some dude who works or stays in the place
    you want to hack what the password is. Some organizations leave it as notes on
    the wall or write it somewhere everyone can see.


    There are many ways you can get a Wi-Fi password using `Kali Linux` but almost
    all of these processes are time-consuming if the password is long and sometimes
    it fails to crack the password if it is complex. What I am going to show you is
    how to use social engineering to get the password.


    What is social engineering? This is basically a form of hacking in which you trick
    the computer user into doing what you want. Examples of social engineering are
    the phone and email scammers who trick you into giving away your credit card details
    or downloading a virus.


    So we are basically going to trick a computer user to give us their password but
    to do so, we need to look legit. That’s where `Fluxion` comes into play.


    ## Fluxion


    `Fluxion` is a script that you can install on `Kali Linux`. It uses social engineering
    to create a Wi-Fi network that is a mirror to that of the target. It then disconnects
    the target from his real Wi-Fi network. Since our fake Wi-Fi looks just like the
    real one, the user will attempt to reconnect using our fake network from which
    we use a web interface to ask him/her for the password.


    After obtaining the password, `Fluxion` will display it and we can use it to connect
    to the network. The reason `fluxion` works is because it creates a similar Wi-Fi
    network to that of the target and also has a web interface similar to that of
    different routers. `Fluxion` also allows you to select your language of choice
    for the attack.


    ### Installing fluxion


    `Fluxion` is not installed by default in `Kali Linux` and so we have to install
    it ourselves. You can find the Github repository for `Fluxion` [here](https://github.com/wi-fi-analyzer/fluxion).
    Once on the Github repo, click on the “Clone or download” button and then copy
    the link.


    Open the terminal and navigate to the `/opt/` directory by typing `cd /opt/` this
    is the directory in which we will install our scripts. If you ever want to go
    back to the home directory you can just type `cd` and that will do it.


    Once in the `/opt/` directory, we now enter the `git clone` command together with
    the copied link. You can do to by typing `git clone` and then right-clicking on
    the terminal and selecting paste to paste the link. You can then press enter to
    start downloading the script; `fluxion` will begin to download as shown in the
    following image.


    Once the process is complete you can type `ls` to list all the files in the directory.
    You should see the `fluxion` folder next to another one called `Teeth` which is
    usually there by default.


    Now navigate to the `fluxion` directory by typing `cd fluxion`, by now you should
    be getting the hang of it. Now use the `list` command to see the various files
    (white) and folders (blue).


    You will see two files that are green in color, these are the scripts. The one
    that ends in `.py` is a python script while the one that ends in `.sh` is a bash
    script. When the scripts are green it means they have the needed permissions to
    run properly. If you find a script that doesn’t have permissions (they are white
    just like other files), use the command `chmod +x <script name>` to grant permissions.

    '
