    # 使用 KALI LINUX 进行黑客


    通过本分步指南，成为一名专业的黑客。你将学习如何破解无线网络以克服基础安全并进行渗透测试。


    - 描述

    - 介绍

    - 第 1 章 黑客基础

    - 第 2 章入门

    - 第 3 章获取密码

    - 第 4 章 黑客指南

    - 第 5 章 移动黑客

    - 第 6 章 渗透测试基础

    - 第 7 章 欺骗技术

    - 第 8 章 Linux 的基本功能

    - 第 9 章 获取命令与控制

    - 第 10 章 实验室

    - 第 11 章 理解你为什么需要黑入自己的系统

    - 第 12 章 Linux 命令

    - 第 13 章 学习核心黑客命令行

    - 第 14 章 什么是加密和数字签名

    - 第 15 章 后续

    - 结论


    # 描述


    Kali Linux 是众多程序之一，它帮助我们与恶意黑客进行持续斗争——这甚至可以被称为一场战争。为了充分利用它提供的所有优势，我们可能会花费数年进行培训和开发，但只需稍微研究，任何人都可以学习网络安全的基础知识。第一步始终是明智地点击、更新软件并保持安全意识教育。一旦你充分意识到网络安全有多么重要，就可以开始让个人和公司数据免受互联网世界中许多诈骗、病毒和危险的侵害。


    理解 `VPNs`、恶意软件和防火墙可以极大提高你的企业在瞬息万的网络世界中生存的机会。今天，网络安全导致了数万亿美元的收入损失，防止恶意攻击可能意味着你的公司是成为悲惨数据之一，还是在被黑入后克服、适应并变得更强大。


    本指南将重点关注以下内容：


    * 黑客基础

    * 入门

    * 获取密码

    * 黑客指南

    * 移动黑客

    * 渗透测试基础

    * 欺骗技术

    * Linux 的基本功能

    * 获取命令与控制

    * 学习核心黑客命令行

    * 后续……以及更多！！！


    # 介绍


    Kali Linux 是一个非常高级的 Linux 版本，用于安全审计和渗透测试。在看了我们过的工具之后，很清楚的是，如果你想在安全研究领域取得成功，Kali
    Linux 将为你提供无限的力量来实现这一目标。同样清楚的是，如果你刚开始学习 Linux，Kali Linux 并不是你想要开始的地方因为它因为它高度复杂的操作系统，其创建目的是为了实现一个目标，那就是安全。


    本书讨论了黑客行为的各种“帽子”——黑帽、白帽和灰帽。黑帽是社会大多数人对黑客的典型想象——那些想要未经授权访问他人财产或信息的人。白帽是“好人”——那些学习行业内技巧以防止资产被利用或追踪犯罪分子的人。灰帽则是一种混合体，他们利用自己的黑客技术（尽管在没有所有者预先知识或授权的情况下）暴露系统漏洞，从而加强这些系统。无论个人的动机如何，知识库和通用工具箱都是相同的。黑客行为需要理解计算设备如何在不同层上通信、机器和网络存在哪些漏洞，以及这些漏洞是如何被利用的。这种知识需要时间、练习、学习和纪律才能获得，并不是普通人熟悉的知识。因此，熟练的黑客有能力对个人、组织和社会造成或防止大量的损害。


    因此，每个黑客都应该采取一些道德准则来指导自己。即使是黑帽在执行攻击时也会有逾越某些底线。执法部门正越来越重视信息安全，并防止针对个人身份、商业和政府机构的普遍攻击。法律和执法因地而异，但任何黑客——无论黑帽、白帽还是灰帽——应该充分理解他们所承担的风险。对于没有经验隐藏足迹或防止附带损害的初级黑客来说，尤其如此。不当攻击可能会抹除或损坏信息，或引起或其他非预期后果。这就是为什么在隔离的“沙箱”中自己的系统上练习技能很重要，直到获得足够的信心去攻击另一个系统。


    ## 保持黑客的优势


    黑客社区和信息安全社区之间进行着持久的竞争。当漏洞被发现时，它往往会明智且快速地传播，正如第 X 章描述的 WPA Krack 攻击所示。安全人员试图通过不断发布补丁或升级来跟上。黑客必须不断精炼技艺并推向极限以保持优势。像任何技能一样，如果不经常使用，黑客技能就会萎缩。此外，计算机安全格局在不断变化。大多数黑客工具的开源性质意味着功能和语法频繁发生变化，必须跟进。漏洞几乎每天都会发布和修补，加密标准也受到大力推动，以提供针对攻击的更好的安全性。因此，为了保持优势并有合理的机会成为成功的黑客，人们应该做以下工作：


    1. 保持所有操作系统、脚本、工具和编程环境的最新版本

    2. 定期在沙箱环境中练习技能，侧重于提高速度和匿名性

    3. 定期探测自己的系统并采取适当的安全措施

    4. 对攻击性和防御性安全进展建立每日或每周的阅读周期（杂志、期刊、网络文章、留言板、暗网黑客社区等）


    # 第 1 章 黑客基础


    现在你已经对伦理黑客和网络法的重要性有了了了解，我们可以继续讨论为了建立坚实基础而需要理解的基础知识。


    在本章中，我们将重点关注安全专家和黑客使用的术语，因为你将在书中频繁遇到这些术语，沟通是项目成功的关键。一旦你熟悉了专业术语，我们将进入对渗透测试以及编写报告背后方法的更详细的讨论。


    ### 术语


    在本节中，我们将简要探索网络安全领域最重要和最频繁遇到的术语。在学习章节的过程中，你也会发现这个术语列表非常有用。


    1. **资产**：资产是指在涉及处理数据和信息的活动中使用的任何设备或组件。资产需要免受未经授权的访问，以保护其免受不愿的数据操纵。


    '
- fmt: '

    ## 2. Exploit

    This can be a program, a bug, or even a command used by attackers to find access
    to the data or information they seek within the system. An exploit can be anything
    that takes advantage of a specific vulnerability within an application or operating
    system. It will cause an unanticipated behavior to the asset, and this will create
    a gap that can be used by the hacker to their advantage.


    ## 3. Pre-engagement

    Pre-engagement refers to the phase of preparation where you establish the rules
    of engagement.


    ## 4. Milestone

    Being organized is a crucial aspect of being a professional ethical hacker. This
    is where milestones come in. They are used to split the process into stages that
    are clearly detailed and assigned to a beginning and an end date. You can use
    charts, spreadsheets and various scheduling websites in order to keep track of
    your milestones and make sure to deliver on time.


    ## 5. Bot

    This is a type of program that is used to automate a certain action. Humans can
    only work so fast, but bots can take care of repetitive tasks much faster and
    for as long as needed.


    ## 6. Brute force attack

    This kind of attack is the simplest, most common type and it doesn’t involve smashing
    computers to bits as the name might suggest. A brute force attack is in fact an
    automated method of combining usernames with passwords until the correct combination
    is found. The entire process is automatic, but it can take a lot of time due to
    a high number of possible combinations.


    ## 7. Denial of Service attack

    Also known as a `DoS` attack, this is one of the most commonly encountered attacks
    used by many beginner black hat hackers. This attack comes as a form of interruption
    to the server or network service provided to various users. It’s a malicious method
    of denying users connection to an online service. For instance, if you are playing
    an online game, a `DoS` attack against the game servers will cause a mass disconnection
    to all users.


    ## 8. Keystroke logging

    This is a common way of recording the keyboard keys and mouse buttons that are
    pressed on a computer. The information is used to reveal usernames, passwords,
    and other sensitive information. Unlike a brute force attack, this method is much
    quicker when it comes to finding out logging information. For it to work, a keylogger
    is injected onto the computer either through an email with a Trojan containing
    link or even directly through a USB stick.


    ## 9. Malware

    This refers to all malicious programs that are used in hostile actions against
    a computer or specific software. Malware comes in the form of Trojans, worms,
    adware, spyware, ransomware, and other computer viruses.


    ## 10. Phishing

    This is a type of email fraud. The intention is to send a seemingly legitimate
    email with the purpose of gaining private information from the recipient.


    ## 11. Rootkit

    This is software that operates stealthily without the knowledge of the targeted
    user. Its purpose is to hide various processes that are running in the background
    in order to maintain access to the computer. It is mostly used to maintain a back
    door to someone’s device while also hiding it from the authorized user.


    ## 12. SQL Injection

    Another common method used by black hat hackers to obtain data. This method involves
    the injection of SQL code to any data driven software or application. For example,
    this can be a statement which tells the application to send all of its data to
    the attacker.


    There are many other terms that you will discover as you learn more about hacking.
    But for now, this terminology is enough for you to gain a glimpse of.


    ## Penetration Testing

    This process cannot be avoided, as you need to establish the rules of engagement.
    Before you begin, you need to set the goals. There are various testing methodologies
    and categories, but for now you should learn the basic stages of.


    ### Rules of Engagement

    Once the rules of engagement are well established and agreed upon by everyone,
    it’s time to perform the test itself.


    1. **Pre-engagement**: Before anything else, you need to establish the rules of.

    2. **Phprinting**: The next step is to.

    3. **Target Identification**: Once the tester has obtained all the relevant information
    about the system, the most useful or vulnerable target is chosen.

    4. **Reporting**: The final rule of which is as important as all. The ethical
    hacker needs to document and report every aspect of the.


    ### Penetration Testing Steps

    1. **Passive Scanning**: In this phase, you are supposed to gather information
    about your target without actually interacting with it.

    2. **Active Scanning**: The next step is to probe the target with the use of specialized
    tools that are designed for network mapping, sniffing traffic and more.

    3. **Fingerprinting**: This does not refer to actual physical fingerprinting.
    At this stage, the penetration tester needs to identify the target’s operating
    system and version level, all applications and their patch level, any open ports,
    active user accounts and services.

    4. **Vulnerability Exploiting**: This is basically the attack itself. Specialized
    attack tools are used against the most vulnerable targets within the system.

    5. **Privilege Escalation**: The tester needs to gain more control, as if they
    are the authorized user. The purpose of this stage is to gain administrative access
    to the system, whether it’s local or remote.

