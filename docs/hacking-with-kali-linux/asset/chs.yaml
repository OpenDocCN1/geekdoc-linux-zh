  \n## 操作系统镜像\n\n操作系统：\n\n*   `Kali Linux` - `https://www.kali.org/`\n*   `Windows\
  \ 7` - `30 天版本`\n*   `Windows 10` - `90 天版本`\n\n## 创建虚拟机\n\n现在你准备好创建虚拟机了。要此操作，请前往\
  \ `File -> New virtual machine`。\n\n## 网络管理\n\n正确管理网络非常重要。如果你配置不当，虚拟机将无法通信。\n\n\
  在 VMware 中，我们可以使用 4 种类型的网络：\n\n*   `Bridged`（桥接）：这种类型包括创建一个属于网络的 IP 地址。\n*   `NAT`：在此模式下，你的虚拟机可以连接到互联网，但从外部无法访问它。\n\
  *   `Host-only`（仅主机模式）：在这种情况下，虚拟机只能与你的物理主机通信。\n*   `Custom`（自定义）：在这里你可以定义自己的网络，并让所有虚拟机在内部通信。\n\
  \n要创建它，请前往 `Edit -> Virtual Network Editor` 并创建一个新网络。\n\n## 虚拟机启动\n\n现在你准备好启动你的虚拟机了。如果你正确执行了上述所有的操作，所有机器将启动并获得之前分配的\
  \ IP 地址。\n\n 安装 vmware tools\n\n\n\n\n\n你还需要完成的另一个操作是安装 VMware Tools。它们无非是一组提高你虚拟机整体性能的功能特性。\n\
  \n我不会用细节来烦扰你。操作步骤非常简单：你只需要在 Windows 或 Google 上搜索关键词“installation of VMware tools\
  \ on Kali”即可。\n\n## 虚拟机的连接性验证\n\n我们现在的最后一步工作是验证我们的虚拟机是否可以相互通信。你需要采取的步骤如下：\n\n1.\
  \ 验证分配给每台虚拟机的 IP 地址的有效性。\n2. 在每台虚拟机上运行 `PING` 命令，并验证响应是否正常。\n\n让我们一起看看如何操作：\n\n\
  *   访问 KALI 机器并从终端运行 `ifconfig` 命令，验证分配的 IP 地址是否可用。\n*   访问 Windows 7/10 机器，并在命令行中输入\
  \ `ipconfig` 以验证分配的 IP 地址是否存在。\n*   记录下这些 IP 地址。\n*   在 KALI 机器上，输入命令 `ping IP address\
  \ Windows 7/10` 以验证响应是否正常，并且响应过程中没有没有丢包现象。\n*   在 Windows 7/10 机器上，输入命令 `ping IP\
  \ address Kali` 验证响应是否正常，且响应过程中没有丢包。\n\n如果所有响应都是正常的，我们就可以开始下一步了。我们渗透测试实验室的设置阶段已经结束。\n\
  \n# 第 11 章：理解你为什么需要黑进自己的系统\n\n为了抓到小偷，你必须设身处地，像他们一样思考，这就是道德黑客的基础。你必须了解你的敌人，否则你就不可能知道如何反击。目前，一切事物都在威胁着安全。系统漏洞的数量正在快速增长，黑客的数量以及他们的知识也是如此。很快我们就会面临一个没有任何系统是能完全免受触碰的时刻，因此学习如何保护你自己的系统至关重要。不要只考虑我们都熟知的普通漏洞——要思考得更深一层。当你学会了如何黑入时，你就知道了黑客为了对付你会使用的技巧——这意味着你知道如何保护自己免受这些技巧的侵害。\n\
  \n黑客针对的是脆弱、薄弱且未受保护的系统。虽然你可能部署了一系列防火墙、为所有数据设置了加密并使用了 VPN（虚拟专用网络），但这些仅仅是营造了一种虚假的安全感。这些类型的系统关注的是高层漏洞、病毒以及通过防火墙进入的流量，而对黑客的工作方式没有任何影响。保护你的系统免受攻击的唯一方法是找到他们将使用的弱点并将其加固。\n\
  \n黑客和破解者（crackers）几乎每天都在扩展知识和技能，你也应该做同样的事情。如果你想保护你的系统，就必须学会像他们那样思考，像他们那样工作。你是道德黑客；你必须知道破解者在做什么，并且必须知道如何阻止他们。你必须确切知道寻找什么，以及如何利用你发现的东西来反击他们。\n\
  \n现在，让我明确一点——你不需要竭尽全力去保护你的系统免受每一种可能的攻击——你做不到。做到这一点的唯一方法是关闭电脑，拔掉电源，并把它锁在柜子里。这样，没有人可以触碰你的系统，甚至是你也不行。但这并不是一种很好的安全处理方法，对任何组织都不会有好处。更重要的是，要针对已知的漏洞（更常见的已知攻击）采取安全措施。\n\
  \n要思考并预判所有可能的攻击形式，以及系统中可能导致其暴露的所有缺陷，几乎是不可能的。世界上没有任何办法能让你计划好所有的意外，特别是那些我们不知道的情况。你能做的是尽力阻碍破解者。尽可能多地测试组合，测试你的整个系统以及它的各个部分——这样你就有很大机会发现影响你整个系统的漏洞。\n\
  \n不过，不要在道德黑客方面做得过头。针对那些极可能永远不会发生的攻击来加强你的系统是没什么意义的。你的真实目标应该是：\n\n*   以一种非破坏性的方式黑进自己的系统\n\
  *   发现漏洞\n*   研究这些漏洞如何被利用以及它们能产生什么影响\n*   修补它们并让你的系统更安全\n\n# 第 12 章：Linux 命令\n\n\
  但首先，让我向你展示一些以后对我们有用的基础 Linux 命令。\n\n## 基础命令\n\n这些是你在执行日常任务时可能会用到的常用命令。\n\n*   执行命令：`ls`\n\
  \    解释：此命令允许你列出文件和/文件夹的内容。\n*   执行命令：`pwd`\n    解释：打印当前目录。\n*   执行命令：`cd`\n   \
  \ 解释：它允许你访问选定的文件夹。\n*   执行命令：`cp`\n    解释：它允许你复制文件。\n*   执行命令：`mkdir`\n    解释：它允许你创建一个文件夹。\n\
  *   执行命令：`rmdir`\n    解释：它允许你删除文件夹。\n*   执行命令：`touch`\n    解释：它允许你创建一个文件。\n*   执行命令：`tar`\n\
  \    解释：它为特定文件创建一个归包。\n*   执行命令：`clear`\n    解释：它允许你返回初始 shell。\n*   执行命令：`adduser`\n\
  \    解释：它允许你添加新用户。\n*   执行命令：`chmod`\n    解释：它管理文件或文件夹权限。\n*   执行命令：`vi`\n    解释：它允许你编辑文件。\n\
  *   执行命令：`cat`\n    解释：它允许你操作文件。\n*   执行命令：`grep`\n    解释：它在文件中搜索特定的模式。\n*   执行命令：`apt-get`\n\
  \    解释：包管理。例如，`apt-get install`。\n\n上面是你应该尝试的所有基础命令列表。你最好正确掌握它们。\n\n## 网络命令\n\n\
  作为道德黑客工作需要你对常用的网络命令有深入的了解。在书的剩余部分，我将向你展示一些最重要的命令。尝试它们，你甚至可能会发现新的组合。\n\n*   执行命令：`ifconfig`\n\
  \    解释：配置网络接口的工具。它对于查看分配给机器的 IP 地址非常有用。\n*   执行命令：`traceroute`\n    解释：此命令允许跟踪\
  \ IP 数据包到主机网络的路径。它对于执行故障排除活动非常有用，例如验证路径中的何处 IP 数据包停止或丢失。\n*   执行命令：`dig`\n    解释：这是查询\
  \ DNS 所需要的工具。关于这个命令还有很多可以说的，它的功能相当复杂。\n*   执行命令：`telnet`\n    解释：此命令允许我们通过 TELNET\
  \ 协议连接远程主机。我想明确的是，这种协议在没有任何加密的情况下明文传输数据。因此，它不是一种非常安全的协议。\n*   执行命令：`telnet`\n  \
  \  解释：此命令允许我们通过 TELNET 协议连接远程主机。我想明确的是，这种协议在没有任何加密的情况下明文传输数据。因此，它不是一种非常安全的协议。\n\
  *   执行命令：`nslookup`\n    解释：这是另一个查询 DNS 并执行反向解析的工具。在我们的练习中，我们会经常使用这个命令。\n*   执行命令：`netstat`\n\
  \n\n\n\n\n## 解释：这是一个极其重要的命令。它允许你查看在特定时间打开的网络连接。它在故障排除中非常有用，能够让我们能够验证由于网络连接未建立或丢失导致的异常。在这里，再次花些时间提高你对该工具的了解。\n\
  \n执行命令：`ifup`，`ifdown`\n\n解释：此命令允许你启用或禁用网卡。它在某些情况下可能非常有用，例如当需要重启网络服务时。\n\n执行命令：`ping`\n\
  \n解释：`PING` 命令用于通过向特定主机发送特殊的 ICMP 类型数据包并等待响应，来检查该主机是否处于活动状态。让我提醒你一下，我们已经在渗透测试实验室中使用过它来验证各种虚拟机之间的连通性。\n\
  \n执行命令：`route`\n\n解释：此命令用于显示特定主机的路由表，即网络数据包在网络或特定子网上必须执行的路径。\n\n执行命令：`arp -a`\n\n\
  解释：`ARP -A` 命令为我们提供了一个 MAC 地址与 IP 地址之间链接的表。例如，当我们想要排除涉及 ISO/OSI 模型下层（数据层）的问题时，可以使用它。\n\
  \n这里是所有与网络相关的命令。当然，这个列表并没有包含所有命令，还有很多话要说。然而，如果你开始熟悉这些命令，你以后会表现出色。\n\n## 与系统管理相关的命令\n\
  \n现在我们进入 Linux 命令的最后部分，这些命令与你 Linux 机器的常规管理有关。\n\n执行命令：`uptime`\n\n解释：此命令显示某个系统已运行了多久。\n\
  \n执行命令：`users`\n\n解释：此命令显示连接到系统的用户用户名。\n\n执行命令：`who` /`whoami`\n\n解释：这是另一个命令，它告诉我们有多少个用户连接到系统，以及其他一些额外信息。\n\
  \n执行命令：`crontab -l`\n\n解释：此命令允许显示与当前用户相关的计划任务。我们稍后会看到这些任务是什么。\n\n执行命令：`less` / `more`\n\
  \n解释：此命令非常有用，因为它允许你快速查看文件。按“q”键退出此特定显示。\n\n执行命令：`ssh`\n\n解释：此命令允许通过 `SSH` 协议连接到远程主机。后者与\
  \ `TELNET` 不同，它执行数据加密。因此，在发生流量截获的情况下，将无法清晰看到任何数据。\n\n执行命令：`ftp`\n\n解释：此命令允许通过 `FTP`\
  \ 协议连接到 `FTP` 服务器。该协议不执行数据加密，因此在使用它时需要注意。\n\n执行命令：`service start` / `stop`\n\n解释：此命令允许你启动或停止某个服务。你将在很多场合使用它。\n\
  \n执行命令：`free -h`\n\n解释：此命令显示空内存和已用内存。例如，当机器出现性能问题时可以使用它。\n\n执行命令：`top`\n\n解释：此命令允许你检查系统中的活动进程。如果机器由于明显原因运行非常缓慢，它可能很有用。\n\
  \n执行命令：`ps`\n\n解释：通过此命令，你可以查看系统中的活动和运行中的进程。\n\n执行命令：`kill`\n\n解释：此命令用于终止特定进程。但是，首先需要识别与特定进程相关的\
  \ `PID`。\n\n我们从通用命令开始，然后介绍了与网络以及操作系统主要功能相关的命令。\n\n在此之前，让我解释一下网络是如何工作的，以及大多数道德黑客通常使用哪些服务。\n\
  \n# 第 13 章 学习基本的黑客命令行\n\n了解黑客用于在未经许可访问你信息的技巧，将让你洞察这种现象是如何发生的，以及你可以采取什么措施保护自己免受最基础的攻击。利用这些知识，如果你想开发技能并发现关于创建自己的程序和软件的额外知识，你可以在黑客领域进一步探索。\n\
  \n## 键盘记录器 (Keylogger)\n\n键盘记录器是一种非常简单的软件，旨在跟踪并记录计算机用户输入的每一个按键。这些按键和序列随后被存储在日志文件中，黑客可以访问该文件，并识别出你的信息，如电子邮件\
  \ ID、密码、银行详情、信用卡号以及你使用键盘输入到机器的几乎任何其他内容。正由于这个原因，许多在线银行网站和其他高安全网页使用虚拟键盘甚至图像识别密码来为你提供账户访问权限，因为这些无法通过键盘记录器进行记录。\n\
  \n键盘记录器最初是如何访问你的计算机的？这些代码行或软件通常附带在你不知情的情况下下载到计算机的文件中，被称为特洛伊木马（源自古希腊神话中的特洛伊木马）。这些文件随后开始工作，并将从你的计算机中收集的信息报告给黑客。这些文件能够访问你计算机的其他方式还包括：通过直接访问（如果有人获得了许可访问你的计算机并允许他们将文件放置在计算机上），或者通过他们提供的、根目录下带有隐藏文件的\
  \ USB 驱动器。\n\n键盘记录器也可能被用于白帽目的，例如在组织内部，以确保员工遵循正确的政策和程序，而不参与欺骗行为。\n\n## 拒绝服务 (DoS/DDoS)\n\
  \n正如我们之前提到的，最常见的黑客攻击形式之一是拒绝服务。这涉及到导致网站变得不可用。由于信息和流量的泛滥导致网站被关闭，系统在挣扎处理所有请求时过载并最终崩溃。这些攻击由黑客采用，他们的目标是出于某种原因或动机，破坏他们想要破坏的网站或服务器。例如，一个黑客主义黑客可能会关闭一个与他们的政治观点不符的网站，认为这是他们的道德义务。而黑帽黑客可能会关闭竞争对手的网站，以干扰其服务并破坏竞争对手的努力。\n\
  \nDoS 攻击使用僵尸网络或受感染系统来执行，这些系统几乎被用作“僵尸服务器军队”，反复攻击目标服务使其过载。这些受感染系统是通过带有病毒的电子邮件和软件创建的，一旦被感染，这些僵尸计算机就可以被黑客随意使用。行业数据显示，高达\
  \ 45% 的组织遭受着 DDoS 攻击，导致每年造成数百万美元的损失。\n\n## 漏洞扫描器\n\n\n\n\n\n为了检测计算机网络中的漏洞，黑客使用一种名为漏洞扫描扫描的工具。这也可以指端口扫描器，它们用于扫描特定计算机是否存在可用的访问点，黑客可以利用这些访问点。端口扫描器还能确定特定端口上运行着哪些程序或进程，从而让黑客获取其他有用信息。然而，防火墙的创建是为了防止对这些端口的未经授权访问，但这更像是一种损害减轻策略，而不是防止黑客的万能药。\n\
  \n某些黑客能够手动识别访问点，而不是使用程序。这涉及读取计算机系统的代码并测试漏洞，以查看他们能够获得访问。如果他们无法查看代码，还可以采用程序逆向工程的方法重新创建代码。\n\
  \n## 暴力破解攻击 (Brute Force Attack)\n\n如果你好奇过为什么在被拒绝访问之前，你输入密码的机会是有限的，那是因为你尝试访问的服务器具有防止暴力破解的保护措施。暴力破解涉及一种软件，该软件会在极短时间内通过扫描字典或随机单词生成器来尝试还原密码，以命中密码并获得访问。正因如此，密码已经变得比过去长得多且复杂得多，例如包含字符、数字、大小写字母，有些甚至禁止使用字典中出现的单词。\n\
  \n## 水穴攻击 (Waterhole Attacks)\n\n水穴攻击之所以之所以有这个名字，是因为黑客会在大量人员访问其计算机并交换安全信息的物理地点进行攻击。就像水穴可以对周围的野生动物投毒一样，黑客也可以对物理访问点投毒以捕获受害者。例如，黑客可能会使用咖啡馆、联合办公空间或公共\
  \ Wi-Fi 访问点等物理点。这些黑客随后能够跟踪你的活动、访问的网站以及访问信息的时间，并策略性地将你的路径重定向到一个虚假网页，允许信息发送给黑客，让他们日后可以心所欲地使用。请确保在使用公共\
  \ Wi-Fi 时，你拥有适当的反间谍软件和防杀病毒软件，以便在在线可能出现可疑活动时提醒你。\n\n## 虚假无线接入点 (False WAP)\n\n同样与水穴攻击类似，黑客可以使用软件创建一个虚假的无线接入点。该\
  \ WAP 连接到官方的公共无线接入点，但一旦受害者连接，他们就会暴露并处于脆弱状态，其数据可以在任何时候被访问和窃取。在公共场所时，请确保你正在使用的 WAP\
  \ 是正确的，它们通常在访问前会有密码，或者有一个要求你输入从管理员处获取的用户名、电子邮件地址和密码门户。如果你发现接入点是完全开放的，这可能引起警觉，因为这个点很可能是诱饵。\n\
  \n## 钓鱼 (Phishing)\n\n黑客从毫无防备的受害者那里获取安全信息的另一种常用技术是钓鱼。钓鱼涉及黑客创建一个你通常与经常访问的网站相关的链接，例如银行网站或支付门户网站。然而，当你输入详细信息时，这些信息会被发送给黑客，而不是你认为要发送的机构。钓鱼通常通过发送伪邮件完成，这些邮件看起来来自你的银行或账单机构，通常要求你访问账户以更新信息或付款。\n\
  \n有很多方法可以区分你是否正成为钓鱼的目标，例如检查发送者 ID（这仍然可以伪造）或检查所提供的链接详情，看它是否与你填写详细信息的常用网站不符。你可能还会注意到邮件格式问题，例如\
  \ Logo 错位或格式糟糕，这会表明钓鱼者没有使用正确的模板。许多机构都会坚持他们不会通过电子邮件索要你的详细信息或要求你更新信息，如果你通过电子邮件收到了账单，如果你感到怀疑，可以检查之前的账单邮件，甚至致电你的所属机构双重检查该邮件的真实性。\n\
  \n## 点击劫持攻击 (Clickjacking Attacks)\n\n如果你曾尝试在声誉不高的网站上播放视频，你可能会注意到界面导航可能非常混乱，因为存在虚假的播放按钮或常见区域，在你点击它们后就会被重定向到其他地方。这些被称为点击劫持攻击或\
  \ UI 伪装 (UI Redress)。虽然重定向到广告或其他页面可能看似无害，但如果操作得当，这些攻击可能非常阴险且具有危险，因为它们能够获取你的信息。在使用不熟悉的网站时需要格外小心，因为它们可能并没有看起来那么安全，其界面会将你带到黑客想要去的地方。始终留意你每次点击的\
  \ URL，如果它与你刚刚所在的网站有巨大差异，请确保你被带去的地方涉及任何下载或信息交换，以保护你的安全。\n\n## 诱饵与替换 (Bait and Switch)\n\
  \n诱饵与替换技术涉及黑客为你提供一个看起来真实的程序，但当它运行时，它是一个病毒或黑客用来访问你计算机的工具。这些通常可以在提供盗版程序、软件、电影或高需求游戏的无良网站上找到。一旦你下载了程序，你会发现该文件并不是你预期的那样，而是向你的计算机加载了病毒，以为黑客提供访问权限。\n\
  \n## 社会工程学 (Social Engineering)\n\n我们之前提到过白帽黑客使用的社会工程技术。这种技术经常被忽视为黑客手段，但它可能非常有效。社会工程的一个例子是伪装成用户或具有合法访问权限的个人，诱骗系统管理员提供详细信息。这些黑客通常被认为是骗子，而不是我们理解的黑客，但这终究是一种黑客手段。许多此类黑客对他们攻击的组织的安全实践有深入了解。他们会针对并猎捕那些经验不丰富或安全权限低于某些高层的人。例如，他们可能会打电话给帮助台员工并请求访问系统，而员工由于缺乏理解向未知来源提供信息后果的经验，就交出了。社会工程可以分为若干类，如下：\n\
  \n### 恐吓 (Intimidation)\n恐吓的一个例子涉及上级（如经理或主管）打电话给帮助台技术员，愤怒并威胁如果如果他们的权威受到质疑就惩罚该技术员。在压力下，员工将配合并提供信息。他们对权威的质疑会立即终止，因为员工看重自己的工作，并提议协助黑客获取信息。\n\
  \n\n\n\n\n## 社会工程技术\n\n### 助人技巧\n在光谱的另一端是“助人技巧”。这涉及到假装困扰和担心，以利用技术人员提供帮助和同情的本性。与其表现出愤怒并向技术人员施压，苦恼的黑客会表现得好像自己正面临压力并对结果感到担忧。技术人员会尽一切可能提供援助，而不必考虑可能给黑客带来进一步困扰的后果。\n\
  \n### 挂名效应\n拥有授权用户的名字让黑客获得了一个优势，他们可以假装成某个有权访问信息的特定人物。这可以通过搜索网上容易找到的公司网页来实现。另一个例子是搜索被不当丢弃的文件，为黑客提供关键细节。\n\
  \n### 技术手段\n社会工程攻击的另一个领域是利用技术作为支持手段来获取信息。这可能涉及黑客向合法用户发送传真或电子邮件，要求用户回复敏感信息。黑客通常冒装成执法部门或法律代表，要求这些信息作为其正在调查的文件的一部分。\n\
  \n## 恶意软件与工具\n\n### Rootkit 程序 (Rootkit)\nRootkit 通过合法的进程，使用底层且难以检测的程序进入你的操作系统。Rootkit\
  \ 可以从用户手中接管操作系统的控制权，由于程序本身作为代码替换部分隐藏在系统二进制文件中，用户手动检测并删除该程序极其困难，几乎不可能。\n\n### 数据包分析器\
  \ (Packet Analyser)\n在互联网或任何其他网络上传输数据时，黑客可以使用名为数据包分析器或数据包嗅器的应用程序来捕获数据包，这些包可能包含密码和其他记录等关键信息。\n\
  \n# 第 14 章 什么是加密和数字签名\n\n加密是利用微缩点、图文组合或其他方式隐藏数据的策略。在专业领域，它倾向于被称为将明文混乱成一种编码结构，通常称为\
  \ `Ciphertext`（密文），当然将其转换为未混乱的配置 `Cleartext`（明文）。这种编码和破解的过程被称为加密，从事该领域的人被称为密码学家。\n\
  \n### 加密的目标是什么？\n\n目前的加密追求以下目标：\n\n1. **机密性**：圈外的任何人无法理解发送者和接收者之间的数据。\n2. **完整性**：消息一旦发布，无法进行任何修改。\n\
  3. **真实性**：加密框架中的数据和来源是绝对真实的。发送者和接收者都可以识别彼此以及数据的起点或终点。\n4. **不可否认性**：发送者或接收者任何一方都不可以在稍后否认消息。\n\
  5. **访问控制**：只有经过许可的人才能访问机密信息。\n\n为了实现上述目标，完善了以下加密组织：\n\n1. **对称加密**：也称为密钥加密，这是一种发送者和接收者共享相同秘密代码和密钥进行加密和解密的策略。如果你正在与固定数量的人交谈，这种策略非常有用，但对于大众通信来说价值不大。\n\
  2. **非对称加密**：这被称为公开密钥加密，其中使用不同的密钥进行加密和解码。这对于密钥交换和数字签名非常有用，例如 `RSA`、数字签名算法、公开密钥标准等。\n\
  3. **消息摘要**：在此，使用哈希函数来永久混乱信息。这也被称为单向加密。\n\n加密确保系统资产免受篡改、破坏和未经授权的使用。它们保护系统架构、IT 资源和机密信息。在现在，修改或控制信息和数据变得非常简单。隐私数据的泄露再次是一个令人不安的现象。\n\
  \n加密系统自苏美人时期（公元前 3500 年）起一直在使用。加密依赖于密钥，正如你将回顾的，密钥是提供计算内容的因素。加密有两种基本类型：传统加密和公开密钥加密。在传统加密中，使用单一密钥执行加密和解码。由于密钥是不可区分的，它们被称为对称密钥。由于传统加密中只使用一个密钥，它的安全性较低。如果除预期接收者以外的人发现了密钥，他就可以解码第一条消息。传统加密的另一个缺点是分发很危险。如果有人在密钥通往预期接收者的途中拦截了它，消息的安全性就会受到破坏。“PGP\
  \ Desktop` 还允许你对个人记录和文件夹（你硬盘上分配为虚拟磁盘的部分）或整个硬盘进行加密。\n\n在公开密钥加密中，使用两个密钥：一个公开密钥执行加密，一个私钥执行解码。由于密钥是唯一的，它们被称为非对称密钥。这允许任何人加密消息，但只有拥有相应私钥的人才能解码消息。为了解释这一点，我们来看一个模型。如果\
  \ Paul 需要给 Sara 留下印象，他使用 Sara 的公开密钥来加密消息。当 Sara 收到消息时，她使用她的私钥来解码。只要消息圈中的每个人都对其私钥完全保密，只有预期的接收者才能破解消息。公开加密还解决了分发问题，因为只有公开密钥需要在不安全的网络上传输；私钥则保留在本地。\n\
  \n# 第 15 章 跟进\n\n与你的潜在客户继续对话并礼貌地跟进，以确保没有业务遗漏。\n\n“但我不会失去我们独特的个性化销售体验吗？”我们的一位客户——一家知名的游艇中介公司——怀疑地问道。这位客户在过去的十年里一直避开数字营销\
  \ marketing，借口是他们不想把那些反复无常、高净值的客户当成“一个数字”。\n\n我们客户的营销方法包括举办豪华的游艇聚会和独家晚宴。与会者是处于“黄金年”的富裕退休男性，他们看重高接触、低压力的销售体验。游艇的追求过程通常持续多年，客户人才会放心地写下数百万美元的支票。\n\
  \n当销售停滞几年时，客户将其归咎于经济。但当经济复苏而销售开始下滑时，他们感到紧张，知道必须采取某些行动来扭转这一趋势。\n\n游艇中介公司正面临着鱼子和香槟的餐饮账单，但莫名地陷入了记忆中最长的销售枯水期。为了扭转局面，他们策划了一场世纪晚宴，比以往任何时候都更大、更贵。然而，由于几个月没有卖出过大游艇，他们的资金库几乎耗尽，他们担心可能不得不取消活动。\n\
  \n\n\n\n\n在听了一位潜在游艇买家吹嘘他的儿子曾参加过《鲨鱼坦克》（Shark Tank），以及增长黑客如何彻底改变了他的业务后，这位游艇经纪公司的老板立即联系了我们。这位老板提出了两个明确的要求：“无论你们做什么，必须感觉是个性化的……而且绝对必须在下周的舞会之前促成游艇的销售。”\n\
  \n这并不是一项小任务。你如何仅利用数字营销技术，让成千上万个挑剔的潜在客户觉得自己的购物体验是完全为他们量身定制的？\n\n对于这一挑战，成功取决于我们设计一套数字化跟进（Follow-Up）流程的能力。这个价值百万的问题是：它能否产生足够快的销售，以挽救舞会并最终挽救公司？\n\
  \n### 攻破解跟进流程\n\n即使是最具有吸引力和教育意义的在线销售体验，平均而言，百个潜在客户中也有九七个不会立即采取购买行动。然而，这九七位客户来到你这里是有原因的，在他们准备好购买之前，一直出现在他们面前是你的职责和义务。\n\
  \n线下跟进的挑战在于，事情不可避免地遗漏。当你把人类引入流程的那一刻，你就创造了更多错误的机会。无论是组织不善、跟踪不力、时间和精力的局限、优先顺序的转变，还是简单的记忆失败，都有许多因素可以并且确实会使模拟世界的跟进流程脱离轨道。\n\
  \n数字化的跟进流程可以避免模拟世界的陷阱和危险。你手头大量的工具可以帮助你对跟进流程进行排序、组织和自动化。例如，你可以使用自动回复器发送一系列以潜在客户首名称呼的电子邮件，并根据潜在客户是否打开了上一封邮件或点击了某个特定链接来更改消息序列和时机。对于你能想到的任何其他通信媒介，从短信、电话到社交媒体消息等，都可以实现同样的自动回复器原理。\n\
  \n将跟进流程数字化的益处是，它可以自动发生，无需你费心；你可以“设置好后置不管”。事实上，某些策略允许你在潜在客户没有提供任何一点联系信息的情况下进行跟进。\n\
  \n### 广告 7 次法则\n\n建立跟进环节价值背后的基本原理是重复。我们经常被问到的问题是：“我应该跟进几次？”虽然答案取决于你的价格点、销售周期长度、行业竞争性、品牌以及其他几个因素，但我们引用的经验法是`广告\
  \ 7 次法则`Advertising Rule of 7）。`广告 7 次法则`指出，一个人大约需要七次触达才能记住你的品牌。\n\n`广告 7 次法则`的基础是认知心理学家乔治·米勒（George\
  \ Miller）1956 年在普林斯顿大学进行的一项研究。米勒法则指出，普通人在工作记忆中可以保持的对象数量为`7 ± 2`。恰巧的是，美国本地电话号码的位数是`7`（直到手机被广泛采用，区号才成为通常需要）。据称，电影制厂早在\
  \ 20 世纪 30 年代就针对了七个消费者触达点，以吸引人们观看他们的电影。\n\n无论起源如何，`广告 7 次法则`的主要要点是：需要重复才能被记住。没有人比第二次世界大战期间的宣传员更好地内化并执行这一概念了。通过接管媒体机构，他们重复自己的教条，直到其渗透并陶醉了整个国家的信仰体系。虽然宣传的产品可能并不尽如人意，但人们无法否认重复的影响力。\n\
  \n幸运的是，数字世界的重复不需要占领媒体机构，其结果可以同样强大。\n\n### 映射你的销售周期\n\n虽然`广告 7 次法则`提供了一个数量的大概念，但我们经常被问到的下一个问题是关于跟进频率。我们建议的框架是将跟进映射到你的平均销售周期长度。通常情况下，产品或服务的价值越高，销售周期越长，特别是对于面向消费者的（B2C）销售。例如，如果你观察到人们平均需要四周时间来购买你的服务，请围绕四周的时间来建立你的跟进。我们还建议将跟进频率前放在初期，以利用被称为首因效应（primacy\
  \ effect）的心理原理：第一次触达比中间触达更容易被记住，而且潜在客户对沟通更开放。当你构建一个覆盖整个平均销售周期长度的跟进序列时，你也受益于近因效应（recency\
  \ effect）：最近的通信将比之前所有的通信更有权重。\n\n我们经常被问这类问题：“我应该向潜在客户索要多少信息？我应该只要名字和邮箱吗？我应该要电话和他们感兴趣的内容吗？我应该问他们是从哪里听到我们的吗？”有些专家会要求更多信息，而另一些则会要求更少的信息。这两种建议都没有错；它取决于你的场景和情况。\n\
  \n你向潜在客户索要信息量的差异可以大致分为高门槛请求和低摩擦请求。高门槛信息请求会要求提供许多项信息，以试图产生更多高质量的线索（leads）；你对线索了解得越多，该线索的质量就越高。这里的理解是，潜在客户对购买你的商品或服务越认真，他就越倾向于给你提供信息。对于那些深受低质量线索流困扰并担心节省销售资源的公司，索要更多信息是一个好方法。\n\
  \n对于那些最大化线索流并愿意处理一定程度低质量线索的公司，低摩擦信息请求是合适的方法。通常，你向潜在客户索要的联系信息越多，“摩擦”越大，潜在客户遵守你请求的可能性越小。\n\
  \n混合信息获取方法是在跟进过程中收集信息。例如，你可以从低摩擦的名字邮箱请求开始，并在潜在客户通过后续问卷与你的材料互动时收集更多的线索情报。然而，随着时间的推移收集信息需要更强大的系统来长期拼接线索信息。因此，混合方法通常是公司在首次实施了简单的解决方案后演进出来的。\n\
  \n许多公司会迅速否定获取邮箱地址的价值。“谁会想要另一份数字简报？”他们问道。“人们不再读邮件了！”他们惊呼道。鉴于电子邮件仍被用于网上银行、航班信息和在线购物更新等关键通信，它在短期内不太会被取代。至于人们是否想要简报，答案是大多数人都不。然而，对于许多购买行为，消费者会经历一个研究阶段，成为那个提供教育的公司是一项增值服务。在提供消费者教育的许多方式中，电子邮件是最具效益的。如果你销售的是没有研究阶段的产品，你可以通过折扣来激励个人。\n\
  \n\n\n\n\n构建潜在客户数据库的主要价值体现在两个方面。对于具有季节性或周期性的公司来说，向你的潜在线索列表发送单条信息可以帮助你控制业务的起伏。此外，当你发布新产品和服务时，你将拥有一个可以立即触达的受众。事实上，我们曾与一些公司合作，他们从数据库中招募热情的客户，帮助在产品开发过程中提供反馈。如果你未来要出售业务，控制季节性和拥有发布目标受众的能力具有显而易见的价值。我们曾见过整个公司仅因其潜在客户和客户数据库就被以数百万的价格出售。\n\
  \n# 流程\n\n在设计跟进序列之前，清晰地界定品牌声调至关重要。声调是品牌产写作内容的一套规则，取决于你对目标受众的深入理解。可以进一步假设，那些倾向于注册接收更多跟进信息的个人，对逻辑性（logos）修辞的反应将优于那些做出更多感性（pathos）决策且在不需要进行深度调查的情况下就购买的客户群体。\n\
  \n一旦清晰地界定了品牌声调，就可以应用“文案 4E 框架”来创作吸引并激励信息的内容。广义地说，你传递的“E”越多，效果越好：\n\n## 文案 4E 框架\n\
  \n- **吸引性 (Engaging)**：内容是否引人入胜并让读者感兴趣？\n- **教育性 (Educational)**：内容是否在教读者与你的产品或服务相关的知识？\n\
  - **娱乐性 (Entertaining)**：读者会喜欢读你的内容吗？\n- **情感性 (Emotional)**：你的内容会激发读者的情感吗？\n\n\
  4E 框架在你评估跟进信息的潜在影响力和影响力时提供了一个坚实的心理检查清单。虽然并不总是需要触及所有四个点，但 4E 框架为你提供了一个建立信任、权威感和联系的自我评估标准。\n\
  \n在构建跟进过程中，一个常见的障碍是构思写作的主题。与其他组件一样，`ASP™ Follow-Up` 是你已经在使用的模拟过程的数字化体现。对潜在买家的跟进电话和直接邮件是可以在数字领域进行复制的模拟并行物。我们在构建跟进流程时作为起点的点框架如下：\n\
  \n## 即使你没有获得他们的联系方式\n\n回到我们那一百个网站访问者的示例样本中，你可能会获得三个人进行直接购买，另外三个人订阅了你的潜在客户磁铁（lead\
  \ magnet）并可能在以后向你购买。尽管这个数字看起来微不足道，但假设这三个订阅的线索中有一人向你处购买了，你的销售额就增加了 33%，这并不糟糕。很妙的地方在于，有一种方法可以让你始终出现在所有网站访问者的面前，即使他们没有提供联系方式。让你保持在所有网站访问者面前的方法是使用一种被称为“重定向”（retargeting，也称为“再营销”）的广告方法。重定向使让你能够获得像\
  \ `Coca-Cola` 这样价值数十亿美元的品牌的曝光频率，而不需要数十亿美元的广告预算。\n\n重定向广告的工作原理是通过用户的网络浏览器识别并记住访问过你网站的用户，并在他们浏览网络其他地方时向这些用户投放广告。无论他们是在浏览社交媒体网站还是阅读他们最喜爱的博客，重定向都能让你将广告精准投放给那些之前访问过你网站的人。这是非常强大的，因为它允许你针对那些对你的特定产品、服务以及品牌表现出兴趣的个人进行营销。\n\
  \n回到“广告 7 法则”，重定向广告是使人记住你的品牌还是忘记它的关键区别。第一个品牌印象可能是按点击付费广告，第二个品牌印象将是你的网站，而第三到第七次印象将来自重定向广告。你可能认为认为这种强大的广告形式会极其昂贵，但除非你的每月访问量超过一万次，否则你的广告支出可能每月少于一百美元。对于大多数拥有本地业务的业务来说，每月访问量在几千人之间，因此这是一个非常理想的低成本可实施的增长黑客手段（growth\
  \ hack）。\n\n从分类上，我们将重定向广告单元分为两个大类：基于品牌的广告单元和直接响应广告单元。直觉上，基于品牌的广告单元传达的是你的整体品牌或公司，而直接响应广告单元侧重于特定的产品或服务。创业阶段，我们建议启动基于品牌的广告单元，并重定向访问你网站任何页面的访问者。如果你只提供单一的产品或服务，那么你可能尝试针对所有访问者的直接响应风格广告。否则，对于那些每月访问量超过一万且提供多种产品或服务的公司，你可以做得更精细，重定向到访问过特定页面的人。例如，如果你是一个也提供太阳能安装的屋顶工，你可以向访问过你网站太阳能页面的潜在客户投放太阳能广告。\n\
  \n### 增长黑客技巧 (Growth Hacktic)\n\n减少重定向广告费用的一种方法是通过“像素清除”（pixel burning）。对于拥有在线支付门户的网站（例如电子商务网站），你可以隔离那些完成支付的人，并将这些人从重定向人群中移除，因为他们已经完成了所需的操作。\n\
  \n## 增长黑客的应用\n\n当我们调查情况时，那家游艇经纪公司的销售额下滑似乎与经纪人人数的减少直接相关。经纪人通过佣金赚钱，销售停滞导致几位经纪人寻找其他工作。\n\
  \n当我们与剩下的经纪人交谈时，他们谈到了如何跟进他们通讯录中数千个潜在客户，特别是当他们承担了此前由离职经纪人处理的客户时。\n\n当我们询问经纪人“哪些潜在客户是最重要的？”时，他们简短地回答：“他们都重要”。当我们修改问题，询问“在晚会之前的八周内，哪些潜在客户最有可能购买？”时，他们再次回答：“他们购买的可能性一样；他们会在准备好的时候购买。”\n\
  \n如果所有潜在客户都同样重要且购买概率相同，我们需要建立一种方法，让经纪人在晚会之前礼貌且不打扰地多次跟进，以最大化提高交易发生的可能性。简单来说，经纪人需要杠杆。\n\
  \n我们实施的第一件事是启动自动回复邮件活动。在与游艇经纪人的交谈中，我们汇总了对常见问题和常见意见的完美答案。我们还创作了传达游艇梦想生活的客户故事。为了配合自动回复技术，我们实施了一套强大的重定向展示广告活动，让潜在客户在每次浏览网络时，经纪公司的品牌名称都出现在他们面前。\n\
  \n\n\n\n因此，这家游艇经纪公司在晚会之前不仅卖出了一艘游艇，还卖出了多艘。在活动现场，一位最近的游艇买家走向我们的客户告诉他：“我到处都能看到你的游艇广告，我将其视为某种强大的力量告诉我，是时候最终出手买一艘游艇了。”仅仅凭借这一句话，游艇经纪公司的老板瞬间从一个增长黑客的怀疑论者变成了增长黑客的信徒。`Follow-Up`\
  \ 的实施为该公司带来了创纪录的销售业绩，并帮助他们进入了没有任何放缓迹象的销售增长轨道。更令人印象的是，这一创纪录的销售年度是在没有招聘一名额外员工的情况下完成的。\n\
  \n## 随进要点\n\n- `广告 7 法则`指出，一个人大约需要七次触达才能回想起你的品牌。\n- 将你的 `Follow-Up` 与你的平均销售周期长度相匹配。\n\
  - 你向潜在客户索取的信息越多，“摩擦力”就越大，这会导致潜在客户不太可能提供所要求的信息。\n- 应用 `文案 4E 框架` 来编写吸引并激励人心的信息：`吸引人的`（Engaging）、`教育性的`（Educational）、`娱乐性的`（Entertaining）和`情感的`（Emotional）。\n\
  - `重定向营销`（Retargeting）允许你专门针对以前访问过你网站的人投放广告。\n- `品牌类广告单元`传达你的整体品牌或公司，而直接响应广告单元则侧重于特定的产品或服务。\n\
  \n## 结论\n\n至此，我们已经到了这本书的最后。在计算机网络世界中，安全被极大地重视，以保护数据并保护系统免受入侵者的侵害。尽管有严格的安全准则和验证方案，黑客仍然成功地攻破了几个系统，引起了普通人的兴趣。\n\
  \n一些黑客能够开发出如 `Facebook` 和 `Netflix` 这样具有突破性的工具和网站（这些网站的创始人自称为黑客），因此看到这么多年轻人想要学习黑客技术并不意外。在深入研究黑客领域之前，需要对黑客的基础知识有明确的想法。这正是这本书的意图所在。\n\
  \n我已经以清晰全面的方式解释了所有的黑客概念；然而，最初将它们全部付诸实践可能看起来很困难。但不要气馁。黑客技术完全取决于练习，此外还需要良好的问题解决能力。利用像“Hack\
  \ this site”这样的网站，它们允许黑客合法地测试他们的黑客技巧。此外，如果你觉得这一切对你来说太技术化了，不要犹豫就寻求专业安全专家的帮助。\n\n\
  到目前为止，你对什么是黑客技术以及当外部或内部人员攻击你的系统时会发生的后果有了很好的了解。但不要担心，只需遵循书中提供的指令和指南，你就可以放心地确保系统将得到良好的保护。\n\
  \n请注意，计算机世界在不断变化和进步。系统越先进，你就越需要提高自己的知识。\n\n同样重要的是，滥用黑客技术进行非法活动将受到法律的惩处。大多数国家对黑帽黑客实施的网络犯罪制定有非常严格的法律。因此，将自己的黑客技术限制在伦理黑客范围内，并利用这些技术测试自己设备的安全性，或协助机构测试其安全系统的健壮性，是非常重要的。\n\
  \n再次感谢你选择这本书，希望你阅读愉快。\n"
