- "# Kali Linux 攻击实战\n\n\n\n![](img/cover00100.jpeg)\n\n\n通过本分步指南，成为一名专业的黑客。你将学习如何破解无线网络以克服基础安全并进行渗透测试。\n\
  \n\n# 描述\n\nKali Linux 是众多程序之一，它帮助我们与恶意黑客进行持续斗争——这甚至可以被称为一场战争。为了充分利用它提供的所有优势，我们可能会花费数年进行培训和开发，但只需稍微研究，任何人都可以学习网络安全的基础知识。第一步始终是明智地点击、更新软件并保持安全意识教育。一旦你充分意识到网络安全有多么重要，就可以开始让个人和公司数据免受互联网世界中许多诈骗、病毒和危险的侵害。\n\
  \n理解 `VPNs`、恶意软件和防火墙可以极大提高你的企业在瞬息万的网络世界中生存的机会。今天，网络安全导致了数万亿美元的收入损失，防止恶意攻击可能意味着你的公司是成为悲惨数据之一，还是在被黑入后克服、适应并变得更强大。\n\
  \n本指南将重点关注以下内容：\n\n* 黑客基础\n* 入门\n* 获取密码\n* 黑客指南\n* 移动黑客\n* 渗透测试基础\n* 欺骗技术\n* Linux\
  \ 的基本功能\n* 获取命令与控制\n* 学习核心黑客命令行\n* 后续……以及更多！！！\n\n# 介绍\n\nKali Linux 是一个非常高级的 Linux\
  \ 版本，用于安全审计和渗透测试。在看了我们过的工具之后，很清楚的是，如果你想在安全研究领域取得成功，Kali Linux 将为你提供无限的力量来实现这一目标。同样清楚的是，如果你刚开始学习\
  \ Linux，Kali Linux 并不是你想要开始的地方因为它因为它高度复杂的操作系统，其创建目的是为了实现一个目标，那就是安全。\n\n本书讨论了黑客行为的各种“帽子”——黑帽、白帽和灰帽。黑帽是社会大多数人对黑客的典型想象——那些想要未经授权访问他人财产或信息的人。白帽是“好人”——那些学习行业内技巧以防止资产被利用或追踪犯罪分子的人。灰帽则是一种混合体，他们利用自己的黑客技术（尽管在没有所有者预先知识或授权的情况下）暴露系统漏洞，从而加强这些系统。无论个人的动机如何，知识库和通用工具箱都是相同的。黑客行为需要理解计算设备如何在不同层上通信、机器和网络存在哪些漏洞，以及这些漏洞是如何被利用的。这种知识需要时间、练习、学习和纪律才能获得，并不是普通人熟悉的知识。因此，熟练的黑客有能力对个人、组织和社会造成或防止大量的损害。\n\
  \n因此，每个黑客都应该采取一些道德准则来指导自己。即使是黑帽在执行攻击时也会有逾越某些底线。执法部门正越来越重视信息安全，并防止针对个人身份、商业和政府机构的普遍攻击。法律和执法因地而异，但任何黑客——无论黑帽、白帽还是灰帽——应该充分理解他们所承担的风险。对于没有经验隐藏足迹或防止附带损害的初级黑客来说，尤其如此。不当攻击可能会抹除或损坏信息，或引起或其他非预期后果。这就是为什么在隔离的“沙箱”中自己的系统上练习技能很重要，直到获得足够的信心去攻击另一个系统。\n\
  \n## 保持黑客的优势\n\n黑客社区和信息安全社区之间进行着持久的竞争。当漏洞被发现时，它往往会明智且快速地传播，正如第 X 章描述的 WPA Krack\
  \ 攻击所示。安全人员试图通过不断发布补丁或升级来跟上。黑客必须不断精炼技艺并推向极限以保持优势。像任何技能一样，如果不经常使用，黑客技能就会萎缩。此外，计算机安全格局在不断变化。大多数黑客工具的开源性质意味着功能和语法频繁发生变化，必须跟进。漏洞几乎每天都会发布和修补，加密标准也受到大力推动，以提供针对攻击的更好的安全性。因此，为了保持优势并有合理的机会成为成功的黑客，人们应该做以下工作：\n\
  \n1. 保持所有操作系统、脚本、工具和编程环境的最新版本\n2. 定期在沙箱环境中练习技能，侧重于提高速度和匿名性\n3. 定期探测自己的系统并采取适当的安全措施\n\
  4. 对攻击性和防御性安全进展建立每日或每周的阅读周期（杂志、期刊、网络文章、留言板、暗网黑客社区等）\n\n# 第 1 章 黑客基础\n\n现在你已经对伦理黑客和网络法的重要性有了了了解，我们可以继续讨论为了建立坚实基础而需要理解的基础知识。\n\
  \n在本章中，我们将重点关注安全专家和黑客使用的术语，因为你将在书中频繁遇到这些术语，沟通是项目成功的关键。一旦你熟悉了专业术语，我们将进入对渗透测试以及编写报告背后方法的更详细的讨论。\n\
  \n## 术语\n\n在本节中，我们将简要探索网络安全领域最重要和最频繁遇到的术语。在学习章节的过程中，你也会发现这个术语列表非常有用。\n\n1. **资产**：资产是指在涉及处理数据和信息的活动中使用的任何设备或组件。资产需要免受未经授权的访问，以保护其免受不愿的数据操纵。\n\
  \n\n\n\n\n## 2. 漏洞 (Exploit)\n这可以是一个程序、一个漏洞，甚至是攻击者用于在系统内访问其所寻求的数据或信息的命令。利用可以是利用应用程序或操作系统内部特定漏洞的任何形式。它会导致资产产生意料之外的行为，从而创建一个可以被黑客利用于己的缺隙。\n\
  \n## 3. 前期接触 (Pre-engagement)\n前期接触是指准备阶段，在此阶段你将建立行动规则。\n\n## 4. 里程碑 (Milestone)\n\
  有条理是成为专业伦理黑客的关键方面。这就是里程碑发挥用场的地方。它们用于将过程分为详细说明的阶段，并分配明确开始和结束日期。你可以使用图表、电子表格和各种调度网站来跟踪你的里程碑，并确保按时交付。\n\
  \n## 5. 机器人 (Bot)\n这是一种用于自动化某些操作的程序。人类的工作速度有限，但机器人可以更快、持续更长时间地处理重复性任务。\n\n## 6.\
  \ 暴力破解攻击 (Brute force attack)\n这种攻击是最简单、最常见的类型，它并不像其名称所暗示的那样去将计算机粉碎。暴力破解攻击实际上是一种自动化方法，将用户名与密码组合，直到找到正确的组合为止。整个过程是自动的，但由于可能的组合数量巨大，可能会花费大量时间。\n\
  \n## 7. 拒绝服务攻击 (Denial of Service attack)\n也称为 `DoS` 攻击，这是许多初级黑帽黑客经常遇到的攻击之一。这种攻击的形式是对提供给各种用户的服务器或网络服务的中断。它是一种拒绝用户连接在线服务的恶意方法。例如，如果你正在玩在线游戏，针对游戏服务器的\
  \ `DoS` 攻击会导致所有用户大规模断线。\n\n## 8. 击键记录 (Keystroke logging)\n这是记录计算机上按下的键盘键和鼠标按钮的常用方法。这些信息用于揭露用户名、密码和其他敏感信息。与暴力破解相比，这种方法在获取记录信息方面要快得多。为了使其生效，键盘记录程序会通过包含木马链接的电子邮件，甚至直接通过\
  \ USB 闪盘注入计算机中。\n\n## 9. 恶意软件 (Malware)\n这指的是所有用于针对计算机或特定软件的敌对行动的恶意程序。恶意软件的形式有木马、蠕虫、广告软件、间谍软件、勒索软件和其他计算机病毒。\n\
  \n## 10. 网络钓鱼 (Phishing)\n这是一种电子邮件欺骗。其意图是发送看似合法的电子邮件，目的是从接收者处获取私人信息。\n\n## 11. Root\
  \ 根包 (Rootkit)\n这是一种在目标用户不知情的情况下秘密运行的软件。其目的是隐藏后台运行的各种进程，以维持对计算机的访问。它主要用于在维护某人设备后门的同时，向授权用户隐藏它。\n\
  \n## 12. SQL 注入 (SQL Injection)\n黑帽黑客获取数据的另一种常用方法。这种方法涉及向任何数据驱动的软件或应用程序注入 SQL 代码。例如，可以是一个告诉应用程序将其所有数据发送给攻击者的语句。\n\
  \n当你深入学习更多黑客知识时，你会发现许多其他术语。但目前，这些术语足够让你一目了然。\n\n# 渗透测试 (Penetration Testing)\n这个过程是不可避免的，因为你需要建立行动规则。在开始之前，你需要设定目标。有各种测试方法和类别，但目前你应该学习基础阶段。\n\
  \n## 行动规则 (Rules of Engagement)\n一旦行动规则得到充分建立并达成共识，就是执行测试本身的时候。\n\n1. **前期接触**：在其他事情之前，你需要建立行动规则。\n\
  2. **指纹识别 (Phprinting)**：下一步是。\n3. **目标识别**：一旦测试人员获取了关于系统的所有相关信息，就会选择最有用或最脆弱的目标。\n\
  4. **报告**：最后一条规则与所有规则一样重要。伦理黑客需要记录并报告测试的每一个方面。\n\n## 渗透测试步骤 (Penetration Testing\
  \ Steps)\n1. **被动扫描**：在这一阶段，你应该在不与目标实际交互的情况下收集有关目标的信息。\n2. **主动扫描**：下一步是使用专门为网络映射、流量嗅探等设计的专用工具来探测目标。\n\
  3. **指纹识别**：这指的实际的物理指纹识别。在此阶段，渗透测试人员需要识别目标操作系统和版本级别、所有应用程序及其补丁级别、任何开放端口、活动用户账户和。。\n\
  4. **漏洞利用**：这基本上就是攻击本身。使用专门的攻击工具针对系统内部最脆弱的目标。\n5. **权限提升**：测试人员需要获得更多的控制权，就像他们是授权用户一样。这一阶段的目的是获得系统的管理权限，无论是本地还是远程的。\n\
  \n\n\n\n渗透测试还有其他方面，但现在我们先专注于基础知识，因为本章的目的是让你熟悉黑客和渗透测试的世界。\n\n## 非道德黑客的渗透测试\n\n出于这个原因，我们将从黑帽的角度来看视一次渗透测试，并看看它与基本的伦理测试有何不同。\n\
  \n1. **选择目标**：非道德黑客出于怨恨、利益或仅仅是为了好玩而选择目标。这不涉及任何规则和条例。一切都是为了个人原因而做的。\n2. **中间节点**：攻击本身绝不会直接从黑客自己的系统进行。而是会使用一个中间系统，使得攻击无法追溯到攻击者。该中间节点通常是一个受害者，通过被远程利用来访问目标系统。\n\
  3. **基本测试阶段**：即使是工具和程序也会与网络安全专家使用的相同。\n4. **维持访问**：黑客在受害者的系统中创建后门是很常见的现象，以防将来可能需要快速访问。这是通过安装\
  \ `rootkits` 或遗留机器人来维持访问的。\n\n非道德黑客如何使用系统完全取决于他们的意图。有些人旨在获取个人信息，而另一些人则试图利用公司的安全漏洞进行勒索。非道德黑客与伦理黑客之间唯一真正的区别在于目标。他们为了实现该目标而使用的步骤和工具通常是相同的。\n\
  \n## 渗透测试方法\n\n一旦明确了作战规则（rules of engagement），就需要考虑方法论了。没有一种通用的测试类型适用于每个公司或组织。每个人都有自己的一的安全目标，在选择正确的方法论之前，有很多问题需要解答。渗透测试方法有几种类型，每种方法都规定了如何执行测试。以下是最常见方法论的简单介绍：\n\
  \n1. **OSSTMM**：代表“开源安全测试方法手册”（Open Source Security Testing Methodology Manual），是一种标准的渗透测试方法论。其核心思想是确保无论由哪个安全专家或公司执行，都能为测试提供基准。该方法论规定了测试网络的哪些部分、如何执行测试以及如何分析结果数据。遵循\
  \ `OSSTMM` 方法论的渗透测试是详尽的，但也很繁琐，因为包含了渗透测试几乎所有的步骤。这意味着在没有充足的人力资源和预算的情况下，无法每天进行此类测试。\n\
  2. **OWASP**：代表“开放 Web 应用安全项目”（Open Web Application Security Project），顾如其名，这是一个开源、社区驱动的专门用于测试\
  \ Web 应用程序的方法论。该方法的目的是提供不受任何商业或政府实体影响的无偏数据。虽然 `OSSTMM` 更侧于网络安全，但 `OWASP` 专注于提高 Web\
  \ 应用程序以及服务的安全性。对于这种方法论，开发了各种工具，软件开发人员、安全分析师和企业可以使用它们来增强防御。\n3. **CHECK**：这种渗透测试方法源于创建安全政府网络的需求。政府处理极其敏感且通常是机密的信息，因此需要高水平的一致测试来保证安全。`CHECK`\
  \ 方法论主要关注保护存储在特定服务器上的数据。在此下进行的渗透测试用于确定数据的安全性，以及在受到攻击时可能以什么方式被破坏。\n4. **NIST**：这是一个全面的渗透测试方法论，与\
  \ `OSSTMM` 不同，它可以定期且短间隔的应用。`NIST` 有四个主要步骤：计划、发现、攻击和报告。发现阶段又分为两个部分：一个涉及基本信息收集、网络扫描和服务检测，另一个则完全关于漏洞评估。第三阶段是攻击，这是测试中的主要步骤，目的是尝试攻破目标设备。报告阶段在发现和攻击之后。\n\
  \n## 渗透测试分类\n\n根据公司或组织想要测试的内容，渗透测试分为三类，即白盒、黑盒和灰盒。\n\n1. **白盒**：当目标上的所有相关数据都已提供时，渗透测试被视为白盒。如果我们处理的是网络测试，数据包括有关应用程序及其版本以及操作系统的信息。在\
  \ Web 应用程序的情况下，测试人员将收到源代码以进行全方位分析。这种预先给出大量信息的测试通常只在现场进行。\n2. **黑盒**：正如你可能自己想到的那样，这是白盒渗透测试的相反。在网络测试中，不会提供有关操作系统或应用程序的任何信息。仅提供\
  \ `IP` 范围以便进行测试。Web 应用测试也不提供源代码。黑盒渗透测试通常在外部进行，这就是为什么大多数信息都被保密了。\n3. **灰盒**：这种渗透测试分类介于白盒和黑盒测试之间。提供部分数据，而部分数据对测试人员隐藏。例如，对于\
  \ Web 应用程序不提供源代码，但通常会提供数据库、后端服务器或测试账户的信息。\n\n## 编写报告\n\n一次成功的渗透测试如果没有一份好的报告是不完整的。知道如何编写报告、格式化并向你的听众展示，是成为熟练伦理黑客的关键。报告应该组织良好、清晰、直接且易于理解。格式和呈现方式同样重要。例如，如果你有一个红色标题，那么所有的标题都应该是红色的。一致性和可读性至关重要，所以你在写报告时要倍加小心。遵循通常的写作规则，在保持全文语调或风格的同时避免语法错误。\n\
  \n你可能认为这些提示对于黑客来说是微不足道的细节，然而，格式良好且编写好的报告会增强你作为专业人士的信誉。\n\n## 考虑你的观众\n\n在编写报告时，你应该考虑到你的观众来起草。观众主要有三类，即：高管层、管理层和技术层。你需要记住报告的哪些部分是每个观众的重点，并为他们编写。例如，经理不会关心你使用了什么利用漏洞来控制系统，但公司的技术部门会非常感兴趣。所以让我们简要讨论一下每一类观众，以了解他们感兴趣的内容。\n\
  \n1. **高管观众**：这类观众主要包括公司的 CEO。他们只会关注阅读报告的执行摘要、修复报告以及可能的发现总结。请注意，通常高管没有多少技术知识，因此会忽略你报告的大部分内容。因此，你应该考虑到这类观众来编写你的总结。\n\
  2. **管理层观众**：这部分观众会对你的漏洞评估和你发现的缺陷感兴趣。他们是负责公司或组织安全策略的人员，所以他们比 CEO 对更多细节感兴趣。\n\n\n\
  \n\n## 3. 技术受众\n软件开发人员以及安全经理会对阅读你报告的细节感兴趣。他们负责修复安全漏洞和修补缺陷，因此他们希望彻底阅读你报告中的技术部分。你应该在报告中包含截图，以帮助他们解决问题。\n\
  \n## 报告结构\n现在，让我们来看看渗透测试报告的精确结构，以了解它应该包含哪些信息。\n\n1. **封面**：我们从最开始的封面。这一部分应该包含你的公司标志（如果有的话）、标题以及对测试的简短描述。封面看起来应该是专业的，因为它的质量将影响客户对你作为专业人士的认知。\n\
  2. **目录**：这一部分是不言自明的。紧接在之后之后，你应该写一个清晰的索引，以便每个特定的受众都能直接跳到报告中与其职位相关的部分。\n3. **执行摘要**：报告的这部分价值极高，它可以决定整个文档的成败。执行摘要是专门为公司的\
  \ CEO 或其他拥有执行权力的人编写的。它应该针对缺乏技术知识的受众进行全面编写。你应该首先定义测试目的以及你是如何执行测试的。然后清晰、扼要地解释你的结果和发现。摘要应该包括发现的总体弱点以及导致这些漏洞的具体原因。最后，写下你在深入分析后确定的风险，并讨论如何通过采取正确的措施来降低这些风险。\n\
  4. **修复报告**：报告的这部分主要针对管理层，但执行层也可能感兴趣。记住，这两类受众可能都缺乏技术知识。那么，修复报告主要是关于什么的？它应该包含你所有的实施后将提高安全性的建议。例如，你可能会建议实施新的防火墙或入侵检测系统。你应该清晰、扼要地列出并描述一切。\n\
  5. **发现摘要**：也称为漏洞评估摘要。在报告的这一部分，你将讨论所有的发现，换句话说，就是涉及所测试系统的优势、弱点和风险。在这里，你应该包含图表和其他视觉表示，以帮助受众理解状况。展示你发现的漏洞，并根据其严重程度对其进行分类。\n\
  6. **风险评估**：这一部分是你根据发现展示风险的地方。你应该描述每个漏洞对系统可能产生的影响以及它发生的频率。\n7. **方法论**：请记住，报告的这一部分是完全可选的，除非客户要求你遵循特定的方法论。在这种情况下，你应该报告你所采取的步骤，甚至包含一个清晰显示流程的流程图。\n\
  8. **详细发现**：报告的这部分针对技术受众。在这里，你将详细讨论你的发现，并包含关于你发现的漏洞的信息、其产生原因、涉及的风险以及你为改进数据安全提出的建议。开发人员和安全经理需要知道漏洞是在何处以及如何产生的，以便采取正确的步骤解决问题。\n\
  \n现在你已经掌握了渗透测试的概念，并理解了报告应该如何编写，是时候向前迈并学习黑客的技术方面了。\n\n# 第 2 章：入门\n黑客以高度智能和在许多方面才华横溢而闻名。因此，从零开始似乎是一项难以完成的任务。必须记住，每个人都必须从某个地方开始。通过奉献和坚持，在技能范围内可以走得非常远。在成为黑客的过程中，非常有帮助的方法是设定一些目标。问问自己为什么要学习黑客以及你打算实现什么。有些人只想学习基础知识来保护自己的家人或业务。\n\
  \n## 学习\n黑客武器库中最重要的武器是知识。对于黑客来说，尽可能多地学习计算机、网络和软件知识不仅很重要，而且为了保持竞争力和有效性，他们必须跟上不断的变化。黑客不必成为工程师或计算机科学家，也不需要对微处理器设计有深入的了解，但他们应该理解计算机是如何工作的、其主要组件、它们是如何在本地和通过互联网进行联网的、用户如何与机器交互，以及最重要的是软件如何规定计算机的功能。一个优秀的黑客精通并熟练使用多种计算机语言，并理解主要的操作系统。对于黑客来说，熟悉密码学历史、数学和实践也是非常有用的。\n\
  \n一个几乎没有黑客经验、对编程只有略懂或中等知识的门外汉对系统发动攻击是可能的，而且越来越常见。人们通常使用脚本并遵循由经验丰富的操作员开发的程序这样做。这最发生在简单类型的攻击中。这些缺乏经验的黑客在黑客社区中被称为“脚本小子”（script\
  \ kiddies）。这类活动的问题在于，执行者对他们正在运行的代码中所发生的情况了解很少，可能无法预见到副作用或其他非预期后果。在尝试攻击之前，最好完全理解你在做什么。\n\
  \n### 计算机和处理器\n计算机的大小、形状和用途各不相同，但大多数计算机在本质上具有相同的设计。一个好的黑客应该研究计算机如何从 20 世纪最早的机器演变成我们今天使用的极其复杂的机器。在这一过程中，显而易见的是计算机具有相同的基本组件。要成为一个有效的黑客，你应该了解大多数现代计算机上存在的不同处理器。例如，三个最大的微处理器制造商是\
  \ `Intel`、`American Micro Devices (AMD)` 和 `Motorola`。这些处理器构成了黑客将遇到的大多数个人计算机，但每个处理器都有自己独特的指令集。虽然大多数黑客很少需要处理机器层面的编程语言，但更复杂的攻击可能需要理解处理器指令集之间的差异。\n\
  \n\n\n\n\n某些处理器可以由终端用户编程。这些处理器被称为现场可编程门阵列（FPGA），越来越多地应用于嵌入式系统，特别是在工业控制领域。众所周知，黑客会在芯片生产过程中获取其权限，以便在最终终点部署恶意软件。对于这类复杂的攻击，理解\
  \ FPGA 架构和编程是必要的。对于那些为关键系统大规模购买芯片的军事和工业客户来说，这些针对嵌入式终端的攻击尤为令他们感到担忧。\n\n## 网络与协议\n\
  \n网络也具有不同的架构。架构不仅取决于不同节点的配置，还取决于连接它们的介质。最初，网络化计算机始终通过铜线连接在一起。常用的铜制网络电缆（通常被称为以太网线）由双绞铜线组成。虽然这些电缆中最常见的是五类（或称\
  \ `CAT-5`）电缆，但它正开始被一种新标准 `CAT-6` 取代，后者具有更大的信号传输容量。对于极高速应用和更远距离，通常选择光纤电。光纤利用光而非电，具有极高的信息承载能力。它们被用于传输大多数现代电电视和高速互联网服务。光纤是互联网的骨干。在较小区域，无线网络非常常见。使用无线局域网（Wi-Fi）协议，无线网络存在于大量的个人、私人商业局域网（LAN）中。黑客通常对破解\
  \ Wi-Fi 网络特别感兴趣，这导致了 Wi-Fi 安全标准的演进。\n\n无论架构或传输介质如何，当两个终端跨网络通信时，它们必须使用一组被称为协议的通用规则。网络协议自第一批计算机网络建立以来演变，但它们保留了相同的底层分层方法。通常，网络是根据执行不同功能的不同层来概念化的，这被称为栈（stack）。今天最常用的通信协议是互联网协议（`IP`）和传输控制协议（`TCP`）。它们合在一起通常被称为\
  \ `TCP/IP`。这些协议偶尔会更改并标准化。对于黑客来说，学习这些协议以及它们如何与栈不同层之间的通信相关至关重要。黑客正是通过这种方式获取系统更高层级的访问权限。\n\
  \n## 编程语言\n\n对于从未接触过的人来说，从零开始学习编程语言可能看起来令人生畏，但许多人发现，一旦精通了某种编程语言，学习其他语言就会变得更容易、更快。黑客不仅需要理解编程语言以利用软件漏洞，许多黑客还需要编写自己的代码来执行特定的攻击。阅读、理解和编写代码是黑客技术的基础。\n\
  \n编程语言的范围从非常晦涩的机器代码（以二进制和十六进制格式表示，用于直接与处理器通信）到用于软件开发的高级面向对象语言。常见的高面向对象语言有 `C++`\
  \ 和 `Java`。在高级语言中编写的代码被编译为适用于特定处理器的机器代码，这使得高级语言在不同类型的机器之间具有很强的可移植性。另一类是脚本语言，命令是逐行执行的，而不是编译成机器代码。\n\
  \n学习编程语言需要时间和实践——没有其他方法可以变得精通。漫长的夜晚以及编写、调试和重新编译代码的通宵马拉松，是初级黑客共同的成年礼。\n\n# 第 3 章获取密码\n\
  \n在本节中，我们将介绍如何获取网络密码。我将重点关注无线网络，因为对于有线网络，你必须通过电缆连接。我将使用我为演示而创建的 Wi-Fi 网络。\n\n获取网络密码的方法有很多，并不涉及计算机黑客，我建议你先测试这些方法，并将黑客攻击作为最后的手段。你可以做一些事情，比如查看你想要攻击的组织或个人丢弃的文件，或者直接问在你想攻击的地方工作或居住的人密码是什么。有些组织会将密码写在墙上的笔记上，或写在每个人都能看到的地方。\n\
  \n使用 `Kali Linux` 获取 Wi-Fi 密码有许多方法，但如果密码很长，几乎所有这些过程都是耗时的，而且如果密码很复杂，有时无法破解。我将向你展示如何使用社会工程来获取密码。\n\
  \n什么是社会工程？这本质上是黑客攻击的一种形式，即通过欺骗计算机用户来让他们你想做的事。社会工程的例子包括电话和电子邮件诈骗者，他们骗你交出信用卡详情或下载病毒。\n\
  \n所以我们基本上是要去欺骗计算机用户给我们他们的密码，但要这样做，我们需要看起来正规。这就是 `Fluxion` 发挥用场的地方。\n\n## Fluxion\n\
  \n`Fluxion` 是可以安装在 `Kali Linux` 上的脚本。它利用社会工程创建一个与目标网络镜像的 Wi-Fi 网络。然后它断开目标与其真实 Wi-Fi\
  \ 网络的连接。由于我们的虚假 Wi-Fi 看起来和真的一模一样，用户将尝试使用我们的虚假网络重新连接，我们通过 Web 界面向他/她询问密码。\n\n获取密码后，`Fluxion`\
  \ 将显示它，我们可以用它连接到网络。`fluxion` 起作用是因为因为它创建了一个与目标类似的 Wi-Fi 网络，并且具有与不同路由器类似的 Web 界面。`Fluxion`\
  \ 还允许你为攻击选择你喜欢的语言。\n\n### 安装 fluxion\n\n`Kali Linux` 默认没有安装 `Fluxion`，因此我们必须自己安装它。你可以[在这里](https://github.com/wi-fi-analyzer/fluxion)找到\
  \ `Fluxion` 的 GitHub 仓库。在 GitHub 页面上点击“Clone or download”按钮，然后复制链接。\n\n\n\n\n我们将运行\
  \ `fluxion.sh` 脚本；可以通过输入 `./fluxion.sh` 来执行，你可以通过这种方式运行任何脚本。一旦按下回车，`fluxion` 将开始运行。起初你会看到一个长列表，显示尚未安装的需要程序。你可以使用\
  \ `apt get install <name>` 安装它们，或者使用自动完成的安装脚本。\n\n当我们显示 `fluxion` 目录下的文件和文件夹列表时，可以看到有一个名为\
  \ `install` 的文件夹，导航到该文件夹并使用 `list` 命令查看可用文件。你会看到一个标记为 `install.sh` 的脚本，输入 `./install.sh`\
  \ 并按下回车运行它，该脚本将开始安装缺失的程序。\n\n这可能需要一些时间，请耐心等待。如果在安装过程中被提问，你可以输入 `y` 表示是，输入 `n` 表示否。\n\
  \n一旦安装完成，你可以输入 `cd ..` 返回上一级目录 `fluxion` 文件夹。我们现在可以运行 `fluxion` 脚本，但首先让我们谈谈无线网卡。\n\
  \n为了让 `fluxion` 或任何其他无线攻击工具工作，你的电脑无线网卡必须支持监听模式（monitor mode）。这允许你的无线网卡拦截网络数据包或数据，即使这些数据并非发送给你的电脑。你可以通过上网查询你的无线网卡是否支持监听模式。如果你的卡不支持监听模式，你可以在\
  \ Amazon 等地方购买支持的，可以通过 USB 插入，价格低至 20 美元。\n\n我电脑的内置无线网卡不支持监听模式，因此我还将通过 USB 连接一个外部无线网卡。一旦将网卡插入\
  \ USB 端口，你必须进入 Kali Linux 虚拟机窗口顶栏的 `Devices` 菜单。导航到显示 USB 的地方并选择你的无线网卡以便在 Kali Linux\
  \ 中使用。\n\n## 使用 fluxion \n\n现在我们必须使用 `fluxion.sh` 脚本启动 `fluxion`。当它开始运行时，它会自动检测无线网卡并切换到监听模式。\n\
  \n你首先收到的提示是选择你想使用的语言。你可以通过输入列表中对应的语言数字来选择语言。我想使用英语版的 `Fluxion`，所以我选择了 `1.`。\n\n\
  之后，你会被要求选择要扫描的通道。让我们扫描所有通道，因此我们选择选项 `1` 并按下回车。\n\n`fluxion` 将对所有可用的 Wi-Fi 网络进行扫描并将它们显示在一个白色中。我有一个标记为\
  \ `test` 的测试 Wi-Fi，见下方的图像。你还可以看到底部有一个设备连接到它。`BSSID` 是路由的 MAC 地址，`ESSID` 是它的名称。\n\
  \n你可以通过点击窗口并按下 `Ctrl + C` 来停止扫描。你将看到一个显示所有检测到的网络的 `fluxion` 窗口。红色的网络是那些已连接设备的网络。通过输入网络编号来选择你想要攻击的\
  \ Wi-Fi 网络。在我的设备上，测试网络是编号 `2.`。\n\n当你按下回车时，系统会要求你提供握手包（handshake），而我们并没有它，所以我们将按下回车跳过该部分。握手包用于路由器与已连接的用户进行通信。这允许连接过一次的用户再次连接到\
  \ Wi-Fi 网络，而无需重新输入密码。\n\n如果黑客能够捕获握手包，他就可以尝试破解它以获取 Wi-Fi 网络的密码。这通常是非常耗时的。\n\n在跳过由于没有握手包而跳过的部分后，将被要求选择一种捕获握手包的方法。你可以在此处使用任何想要的选项，但\
  \ `pyrit` 选项是最好的。所以我选择了 `1.`。\n\n会弹出两个窗口。你只需要耐心等待，直到顶部窗口显示 WPA 握手包已捕获的消息。这可能需要 30\
  \ 秒到 5 分钟不等。你可以尝试在一两分钟后关闭底部窗口来加速。\n\n捕获握手包后，你还必须关闭此窗口。现在你必须检查握手包。你可以通过输入 `1` 选择握手包来完成操作。\n\
  \n如果握手包未损坏，将被要求选择一个 SSL 证书或创建一个。我们将选择创建 SSL 证书的选项（选项 `1`）。下一个选项是选择攻击选项，将是 Web 界面选项（选项\
  \ `1`）。SSL 证书将用于 Web 界面，使其看起来安全且可靠。\n\n我们的最终选项将是为 Web 界面选择模板。由于这里的大多数人使用华为路由器，我将选择它作为我的界面（选项\
  \ `28`）。\n\n将出现四个执行攻击的新窗口。用户将从名为 TEST 的原始 Wi-Fi 网络断开连接，他将别无选择地重新连接，但在不知不觉的情况下连接到与原始网络相似的假\
  \ Wi-Fi 网络。然后他将通过类似于华为（或你选择的任何界面）的 Web 界面输入 Wi-Fi 密码。\n\n一旦输入密码，`fluxion` 将确认密码是否正确并在屏幕上显示它。我使用的密码是\
  \ `123Test`，可以在这里看到。\n\n还有许多其他可用于无线攻击的脚本和程序。可以通过前往 Kali Linux 桌面左上角的应用程序栏来访问这些脚本。\n\
  \n现在你已经获取了密码，可以使用它来连接网络了。\n\n# 第 4 章 黑客指南\n\n本节中解释或教授的内容仅供开发、教育和研究目的。我们将考虑黑入 Android\
  \ 设备，但在那之前我们需要问一些问题。我们为什么要黑入 Android 设备？目的是什么？有大量的人都拥有 Android 设备。\n\n## kali linux\
  \ 2.0 的特性\n\n如果你是渗透服务器和侵入网络的专家，处理你的业务最简单的方法就是利用 Kali Linux 2.0 的力量。Kali Linux 2.0\
  \ 是目前最能让程序员进行黑客活动变得非常的 Linux 发行版。你能够在很短的时间内实现目标并成为你个人网络的所有者。\n\n### 1. Metasploit\n\
  \n`Metasploit` 是一个帮助创建漏洞利用、壳代码、触发器、蜜罐和有效负载的框架。`Metasploit` 是一个封装在其框架中的多个漏洞和类似元素的库。该软件是公开的，可以在许多操作系统上使用，包括\
  \ Linux 和 Windows。它随 Kali Linux 默认。`Metasploit` 是一个可以威胁其他网络的危险设备。你想检查网络安全中的漏洞并学习如何管理它们以防止外部攻击。\n\
  \nWeb 应用程序和服务器也会受到 `Metasploit` 的攻击。在 `Metasploit` 中，GUI 和命令行界面平等存在。`Metasploit`\
  \ 有免费版本，也有付费版本（`Metasploit Pro`），它提供了更多功能。\n\n### 2. NMAP\n\n\n\n\n## NMAP\nNMAP\
  \ 是 “network mapper”（网络映射器）的缩写。它在搜索可访问端口的同时探测网络以映射网络服务器等。`NMAP` 的核心功能是安全分析和网络检查，以检测在线的计算机。`NMAP`\
  \ 使用 IP 地址和数据包来揭示有关网络的有用细节。例如，它会显示可用于访问网络的端口以及计算机上正在使用的应用程序。在继续使用图形界面（GUI）之前，建议先对命令有一定的了解。\n\
  \n## Armitage\n`Armitage` 是一种用于网络安全领域的显示控制工具，它为 `Metasploit` 插件创建一个接口，简化了 `Metasploit`使其不再那么复杂，更容易理解。如果你想学习更多\
  \ `Metasploit`，`Armitage` 是一个很好的起点。`Metasploit` 的所有功能都通过 `Armitage` 整合在黑客过程中，因为它们的目的是利用、绕过和攻击网络。\n\
  \n# Jhon the Ripper\n`JTC` 是 “Jhon the Ripper”的缩写。它是一个突破受密码高度保护区域的知名工具。在黑客世界，它被简称为\
  \ `Jhon`，是启动所谓字典入侵的主要工具。`Jhon the Ripper` 拥有一个名为“word list”（单词列表）的文本库，由之前破解的密码组成。`Jhon\
  \ the Ripper` 从其存储库中选择其中一个密码，并替换掉待破解密码的 `wordlist`。然后它给出新输入密码的结果。换句话说，黑客获取一个之前破解的密码，并干预系统，使得这个之前破解的密码替换掉要破解的密码。之后，`Jhon`\
  \ 重新启动之前的成功过程并重新破解替换后的密码。`Jhon the Ripper` 与 `THC Hydra` 之间有相似之处，后者是类似的破解工具。细微的区别在于\
  \ `Jhon` 用于离线破解，而 `Hydra` 用于在线破解。\n\n## Wireshark\n`Wireshark` 是一个开源工具，通过网络流量概述来审视网络。该工具属于网络嗅探器类别。\n\
  \n`Ethereal` 是 `Wireshark` 的旧名。它的核心功能是监控用于监测网络流量的差异，并调查往返的数据包。在完成所有操作后，结果将以用户可以理解的格式呈现给用户。随着时间的推移，有了明显的进步。例如，创建了过滤器以及颜色编码等各种数据包处理功能。这些开发在某种程度上都提供了帮助，特别是增强了测试人员的渗透能力。这些测试人员能够更深入地渗透网络并彻底审视数据包。\n\
  \n如果你真的想成为网络分析、网络渗透大师并获得其他黑客技能，你必须拥有关于 `Wireshark` 的经验和知识。\n\n## THC Hydra\n`Hydra`\
  \ 与 `Jhon` 非常，是一种密码破解设备。在专家黑客手中，`Hydra` 可能是危险的。它通常与 `Jhon` 结合使用，因为两者经常同时使用。`Hydra`\
  \ 通过结合字典和暴力破解的力量对密码输入处进行攻击来破解密码。`Hydra` 允许大量的协议。示例包括 `SSH`、`POP3`、`IMAP`、`Database`、`SMB`、`VNC`、`LDAP`、`SMB`、`RTPS`、`HTTP`、`POP`、`TCP`、`SMTP`\
  \ 和 `RTPS`。\n\n目前在线最强大的工具是 “Suite”。`Suite` 是一个提供 Web 服务和渗透测试的应用程序。当它充分发挥作用时，其用途几乎是无限的。以下是\
  \ `Burp Suite` 的一些功能：\n\n*   **拦截代理 (Intercepting Proxy)**：监控并改进应用程序与 浏览器之间通信的功能。\n\
  *   **爬虫 (Spider)**：指定网络上存在的所有文件列表、名称和特征的功能。\n*   **Web 扫描器 (Web Scanner)**：扫描服务器漏洞的重要功能。\n\
  *   **入侵者 (Intruder)**：可用于对网络发起攻击的功能。用于扫描漏洞并利用这些漏洞。\n*   **重放器 (Repeater)**：代表用户改进并发出请求。\n\
  *   **序列器 (Sequencer)**：检查令牌的 `CSRF`、`authenticity token`（身份令牌）等的异常情况。\n*   **扩展\
  \ (Extensions)**：允许用户包含自己的自定义插件或直接从系统数据库安装插件。它们被用于创造性地策划战术性和隐性攻击。\n\n## OWASP Zed\n\
  `OSASP Zed Attack Proxy`（缩写：`ZAP`）的一个特点是它没有价格标签。它的开源版本向公众免费。`OSWAP` 是一个流行且有效的代理工具，可以替代\
  \ `Burp Suite`。`OSWAP` 用户友好，并且高效地完成完成工作，因为它暴露了 Web 应用的漏洞。`OSWAP` 的功能总结如下：\n\nA.\
  \ 手动测试\nB. 审视网络泄露\nC. 审视用户目标\n\n## Engineering Toolkit\n社会工程工具包（Social-Engineering\
  \ Toolkit），简称 `SET`，是另一个值得提到的工具。通过这个工具，攻击针对操作系统的用户而不是系统本身。它具有某些允许访问 `Java applets`\
  \ 的特殊属性。用户并不知道这些 applet，因为 `SET` 确保一切都在隐中进行。这个命令行在最大化运行时可以产生有效结果。它可以在任何基础操作系统上运行，包括\
  \ `Linux` 和 `Windows`。\n\n## Aircrack-ng\n这是另一个破解密码并允许用户访问互联网的工具包。在专家手中，它可以成为盈利工具。然而，它是困难的，需要大量的努力。对于新手来说，`Aircrack-ng`\
  \ 是一个短波破解程序。它是 `802.11 WEP` 和 `WPA-PSK` 破解工具包，可以从各种类型的数据中恢复密钥。然而，数据必须具有足够的数据包并捕获（在监听模式下）。`Aircrack-ng`\
  \ 是你绝对需要的不可或缺工具。新手应该能够使用正确的工具破解加密的 `WEP`。然而，破解 `WPA/WPA2` 需要大量的努力。\n\n\n\n\n\nBlue\
  \ Sniff 本身并不是一种黑客工具，但它可以发现处于“隐藏”模式的最近蓝牙设备。处于隐藏模式的蓝牙设备在普通的蓝牙扫描中无法被发现。Blue Sniff 是一款\
  \ Linux 工具，可以轻松地完成这项工作。\n\n## 破解移动应用程序\n\n智能手机之所以流行，是因为它们可以安装各种应用程序。移动应用程序是可以被破解的。从应用商店访问应用时，其二进制代码会被下载并由设备处理器读取和执行。但这些二进制文件存在漏洞，技术完备的黑客可以利用这些漏洞。此类利用可分为两类，即：\n\
  \n* 代码的修改/注入\n* 逆向工程\n\n### 代码的修改/注入\n\n这是通过在应用程序的二进制文件中插入恶意代码来实现。黑客对应用程序二进制文件进行代码修改的主要动机是改变应用程序的行为。通常，对二进制代码的修改目的是：\n\
  \n* 修改应用程序的许可协议\n* 损害其安全功能\n* 从应用执行未经授权的交易\n* 如果程序是试用版，则解锁完整版\n* 绕过其购买要求\n* 禁用广告显示\n\
  \n进行修改后，黑客可以作为软件补丁或破解版进行分发。下载这些此类软件补丁可以绕过应用程序的若干限制。带有修改代码的应用程序还可以重新封装为新应用并分发。\n\n\
  ### 逆向工程\n\n在逆向工程中，首先使用代码分析工具分析二进制代码。根据分析报告，黑客可以对应用程序二进制文件进行逆向工程，以窃取源代码和其他敏感信息。盗取的代码和数据可以用于构建具有不同品牌的类似应用程序，然后提交到应用商店。\n\
  \n黑客利用代码修改和逆向工程技术可以执行的任务如上图所示。\n\n# 第 6 章 渗透测试基础\n\n### 什么是渗透测试？\n\n从简单的形式来说，渗透测试是计算机安全测试的一种，用于确定计算机系统的安全程度。通常，进行该测试是为了发现给定计算机系统或应用程序中可能存在的漏洞和各种风险。如果计算机不够安全，黑客和其他形式的攻击将很容易访问系统并破坏存储在上面的任何数据。\n\
  \n许多不同的计算机安全专家以不同的方式描述、执行和营销渗透测试。这导致它容易与其他计算机安全流程（如安全评估、漏洞扫描和合规性审计）混淆。渗透测试在许多关键方面与所有其他过程都不同：\n\
  \n* 与漏洞扫描不同，渗透测试不仅发现漏洞，还会探索所有未被发现的漏洞，以证明计算机系统面临的真实世界攻击向量。\n* 虽然渗透测试可能采用自动化工具和流程，但其主要重点是执行测试的团队的人类技能和准确判断。这是因为安全威胁可以击败最先进、复杂的工具和技术，但它无法逃脱始终能够跳框架思考的人类大脑。\n\
  * 安全和合规性审计寻找安全措施和配置的存在，而渗透测试更进一步，确立这些安全措施和配置针对真实世界攻击的有效性。\n* 渗透测试针对给定目标探索多个攻击向量，以便产生一种更强大的安全组合，从而能够有效地保护计算机系统。\n\
  \n### 为什么你需要渗透测试？\n\n渗透测试对计算机用户非常有价值，特别是对于那些拥有大量计算机并使用计算机处理高价值信息（如员工工资单和个人详情）的大型组织。以下是企业投资于渗透测试的重要原因：\n\
  \n* **模拟攻击环境**：你能够保护计算机免受攻击的唯一方法是让你确切知道入侵者将如何访问你的计算机。渗透测试帮助你了解这一点，因为它通过各种攻击向量模拟攻击环境，从而让你了解如何最好地提高计算机的安全性。\n\
  * **帮助发现计算机安全系统中的安全漏洞**：大多数未被察觉的主要计算机攻击都是利用了计算机安全系统的漏洞。渗透测试检查你的计算机软件和功能，以识别入侵者可以通过其获取访问的安全弱点。这些是重要信息，随后被用于加强特定系统的计算机安全性。\n\
  * **帮助找到击败黑帽攻击的方法**：黑帽攻击不断变化并适应现有的计算机安全措施。这意味着为了有效保护你的计算机，你需要找到可以击败黑帽攻击的方法。通过渗透测试，你可以模拟黑帽黑客将如何进入你的系统，这将帮助你了解如何最好地构建计算机安全，以便将黑帽攻击隔之门外。\n\
  * **估算对业务的潜在攻击规模**：不同类型的攻击会导致不同程度的损失。此外，某些攻击在某些领域比其他领域更常见。为了保护你的业务、财务记录和客户免受潜在攻击的侵害，了解你业务范围内各种攻击的规模至关重要。这将为你为什么需要投资各种类型的计算机安全技术提供证据。\n\
  * **帮助增强你的管理系统**：计算机安全是信息管理的重要组成部分。这意味着如果你在业务中使用计算机，那么计算机安全就是你管理系统中不可或缺的一部分。渗透测试为你提供了关于计算机安全威胁和来自各种攻击向量漏洞程度的重要信息。这有助于重新组织你管理业务的方式，以便有效地保护你的计算机系统和业务信息。\n\
  * **保护你免受财务损失**：简单的安全泄露可能会给任何企业带来巨大损失。犯罪分子可以利用计算机漏洞进行欺诈活动，导致巨大的损失。此外，他们可能会窃取你的客户数据并在网上分享，这可能导致业务损失甚至引发法律案件，从而进一步损害你的财务状况。\n\
  * **识别不可检测的漏洞**：如今随着技术的进步，存在许多难以检测的漏洞。你需要此类漏洞的信息，以便有效地保护你的计算机系统。通过渗透测试，你可以了解难以检测的区域和攻击类型，并在它们发生时制定出应对措施。\n\
  * **测试你的安全系统抵御攻击的能力**：你的计算机安全措施有多有效？你能够了解这一点的唯一方法就是渗透测试。渗透测试将帮助你了解攻击者访问你计算机有多容易，从而能够做出有效响应。\n\
  \n现在很清楚，执行渗透测试有很多原因。定义渗透测试的性质和范围在很大程度上取决于你的目标。如果你担心针对业务的攻击，那么你将考虑比主要目标是通过合规评估更具强度、更具侵略性的渗透测试。\n\
  \n\n\n\n那么，什么是适合你的渗透测试呢？如果渗透测试是你们所在行业的要求，那么你可能会想寻找你所找到的最便宜的渗透测试服务。但这并不总是处理此问题的正确方法。考虑以下这两个因素：\n\
  \n1. 你是否有渗透测试的预算？\n\n如果你已经有了渗透测试的预算，那么就没有必要走捷径，相反，应该利用预算，通过扩大渗透测试的性质和范围来让你的钱花得值。\n\
  \n2. 攻击的影响将会是什么？\n\n在决定渗透测试范围之前，了解攻击将产生什么影响是非常重要的。例如，如果攻击可能导致金钱损失、业务受损以及针对你的法律诉讼，那么你将会考虑投入高强度的渗透测试。\n\
  \n## 聘佣渗透测试提供商时需要考虑的问题\n\n要进行渗透测试，你需要一位拥有丰富经验、技能和工具的专家来完成工作。然而，市场上有很多人提供这项服务，其中一些人并不胜任这项工作。因此，选择一个正确的团队为你完成工作是非常重要的。在聘佣人员为你进行渗透测试时，你应该考虑以下重要建议：\n\
  \n### 寻找合适的资质\n\n资质是找到合适的渗透测试人员的关键。在考虑团队资质之前，要确保他们与被测计算机系统的管理层没有联系。这对于消除他们工作中的偏见非常重要。例如，如果你由第三方管理你的计算机系统，那么你不应该再次聘佣他们来做渗透测试，因为即使他们符合工作要求，也难免会产生偏见。\n\
  \n要判断某人是否具备进行渗透测试的技能，你需要了解他们持有的证书类型。一些证明渗透测试人员能力和技能的证书包括：认证伦理黑客 (`CEH`)、GIAC Web\
  \ 应用程序渗透测试员 (`GWAPT`)、攻击性安全认证专业人员 (`OSCP`)、高级渗透测试员 (`GXPN`)、CREST 渗透测试认证以及 GIAC\
  \ 认证渗透测试员 (`GPEN`) 等。\n\n你还应该关注过去的经验，因为在该领域拥有丰富经验的人将比新手为你提供更好的服务。例如，你应该去了解他们从事渗透测试的年限、他们工作过的公司类型、他们参与过的项目类型，以及证明提供者所陈内容的参考资料。这非常重要，因为一个在该领域相对较新但主要从事你所在领域项目的提供者，可能比比一个在其他领域拥有丰富经验但在你所在领域几乎没有经验的提供者更可靠。\n\
  \n在聘佣测试员之前，确保聘请一位拥有合适工作工具的测试员。通过对候选人进行询问，确保你获得了适当的背景调查，因为这将帮助你了解他们是否有正确的经验、技能和工具来满足你的要求。这是你获得最合格提供者进行渗透测试的唯一途径。\n\
  \n### 了解你渗透测试的性质和范围\n\n如果你知道你想做什么，你更有可能找到合适的人来完成工作；但如果你不知道你想做什么，那么任何人都胜任这项工作。正确的团队将帮助你定义渗透测试的范围及其性质。因此，在将任务交给最合格的团队之前，你需要坐下来查看要执行工作的本质性质。如果你的提供者似乎并不理解你想完成什么，那么他/她就不是工作的合适人选。优先考虑那些想要将测试范围限制在漏洞和攻击数量最多的关键区域的人员。这很重要，因为它将帮助过程集中在你的计算机安全的关键区域。\n\
  \n### 黑盒或白盒渗透测试\n\n这两种渗透测试对于决定你如何有效地执行渗透测试过程至关重要。每种方法都有其优于优点。例如，在白帽渗透测试中，测试者拥有系统或网络访问的先信息，耗时更短且成本更低，留给你充足的时间和资金来加强你的计算机安全，它还有助于突出内部人员对计算机系统可能造成的威胁，从而保护你的计算机系统免受此类威胁。相反，黑盒渗透测试不允许测试者拥有内部知识的特权，因此从真实世界攻击者的角度为系统提供了最好的测试结果。此外，由于攻击者花费了大量时间，黑盒渗透测试可能会提供关于系统内部其他漏洞的大信息。\n\
  \n在聘佣渗透测试员之前，了解你需要哪种渗透测试很重要，并且只聘佣那些在该特定渗透测试领域专家或感到熟悉的专家。例如，如果一个提供者告诉你他们只擅长白帽测试，而你想进行黑盒测试，那么请考虑寻找另一个擅长黑盒测试的人。\n\
  \n### 目标和目的\n\n你的目标和目的应该引导你选择正确的渗透测试人员。你想通过渗透测试实现什么？你正在考虑的渗透测试员的经验是否符合这些目标？某些渗透测试人员可能拥有经验和正确的资质，但他们的经验并没有表明他们能够实现你的目标。因此，在开始寻找人员为你进行渗透测试之前，请确保你已经为该过程设定了目标和目的。这不仅能帮助你找到工作的合适人才，还将帮助你设定范围并衡量过程的结果。\n\
  \n## 你何时必须执行渗透测试？\n\n应该定期进行渗透测试，以确保你的计算机安全并保护你的数据和信息不受不断进步的攻击。除了定期进行渗透测试外，你还应该在以下情况下确保进行测试：\n\
  \n* 发现计算机系统的新威胁\n* 为计算机系统添加新的硬件/网络或基础设施\n* 安装新软件或更新系统软件\n* 搬或增加办公空间\n* 创建新的终端用户策略或程序\n\
  \n# 第 7 章 欺骗技术\n\n系统可以通过本地或互联网通过以下方法之一被黑客攻击：\n\n* 使用优 盘或外部硬盘感染系统\n* 伪造用户身份以获取访问权限\n\
  * 滥用网络系统与用户之间的信任\n\n不同类型的欺骗技术如下：\n\n* `IP 欺骗`\n\n* `ARP 欺骗`\n\n* `DNS 服务器欺骗`\n\n\
  * `网站欺骗`\n\n* `电子邮件欺骗`\n\n\n\n网络并不允许访问其所有的 IP 地址。只有某些受信任的 IP 地址才能进入网络。为了获取网络，黑客会使用伪造受信任\
  \ IP 地址的 IP 地址。\n\n例如，假设某个网络允许 IP 地址 `x.x.x.x` 访问其系统。一个系统 IP 地址为 `y.y.y.y` 的黑客伪造其\
  \ IP 地址，使其看起来像 `x.x.x.x`，从而进入网络。\n\nIP 伪造主要是为了向目标系统发送大量数据以增加流量。发送比系统所能处理的更多的数据包将导致目标系统过载。此时所有数据包似乎都来自几个被伪造的\
  \ IP 地址。在另一种方法中，可以伪造目标系统的 IP 地址，向同一网络上的其他系统发送大量数据包。对于其他系统来说，这些数据包看起来是从目标系统发送的，但实际上这些数据包是由黑客从其系统发送的。结果，所有接收到数据包的系统都会向目标系统发送响应，从而因流量过大使其过载。\n\
  \n某些网络使用基于 IP 的身份验证而不是用户登录验证。在这些身份验证方案中，请求访问的机器的 IP 地址是基于信任关系进行验证的。在这种情况下，黑客可以通过伪装具有网络访问权限的信任机器来执行伪造。\n\
  \n## ARP 伪造\n\n地址解析协议（ARP）是一种将机器的 IP 地址映射到 MAC 地址的协议。MAC 代表介质访问控制（media access control）。系统的\
  \ MAC 地址就是硬件的物理地址。ARP 伪造涉及黑客伪造 ARP 消息并在网络中发送，使得黑客系统的 MAC 地址与网络上某个授权系统的 IP 地址关联。因此，所有发送到授权系统的数据实际上都被发送到了黑客的系统。\n\
  \n执行 ARP 伪造的原因如下：\n\n*   窃取网络私有信息\n*   修改传输过程中的数据\n*   停止网络流量\n*   劫持会话\n*   实施中间人攻击\n\
  \nARP 伪造只能在局域网（LANs）中进行。这是因为地址解析协议只能在局域网中使用。\n\n## DNS 服务器伪造\n\n域名系统是一项将域名映射到其 IP\
  \ 地址的服务。DNS 服务器允许将电子邮件地址、统一资源定位符（URL）和域名解析为各自的 IP 地址。域名伪造攻击涉及攻击者操纵 DNS 服务器，使得特定域名被映射到攻击者控制的\
  \ IP 地址。这些 IP 地址包含受恶意软件感染的文件。这种伪造通常用于在互联网上传播计算机病毒和蠕虫。\n\n![Description: Description:\
  \ https://lh6.googleusercontent.com/jSwI_6NCbnjDM9vFjdzgkIxck2ShTARrd0GOM0ZwfwPYfkRIr5hykdKX1Ljs-gEaKDEgrfgf2swjdRKggFCFRXDgO_gQwv0zJiTU8sjBxcnsuuM632yK26Ss_mY3ghirfhgzUbA](img/image00099.jpeg)\n\
  \n## 网站伪造\n\n网站伪造涉及创建一个伪装合法网站的假网站。通常，它与原始网站的设计相同，有时可能具有相似的 URL。因此，当个人误将伪造网站认为是原始网站并输入用户名/密码或其他个人详情（如电话号码、社会安全码或地址）等敏感信息时，这些信息实际上会落入攻击者手中。\n\
  \n在更严重的攻击中，攻击者可能会创建万维网（WWW）的影子副本，使得受害者的数据流量转向攻击者的系统。结果，攻击者可以捕获受害者的私密信息。可以使用控制字符使伪造网站的\
  \ URL 看起来真实。网站的实际地址仍然隐藏在背景中。\n\n例如，假设你是一个银行客户，并使用银行网站进行网上银行。假设你被重定向到一个假网站，该网站与原始银行网站的设计和布局相同。它还可能拥有与银行网站\
  \ URL 相似的 URL。因此，你误将假网站认为是真实网站，并输入了你的信用卡详情和 PIN 码等敏感信息。现在，运行假网站的攻击者捕获了你输入的信息，并可能将其用于恶意目的。\n\
  \n## 电子邮件伪造\n\n电子邮件伪造涉及在发送邮件之前伪造“发件人地址”，使其看起来像来自受信任的人或来源。垃圾邮件发送者为了欺骗接收者关于邮件来源的合法性，大多使用电子邮件伪造。电子邮件伪造还用于通过邮件传播蠕虫或病毒。\n\
  \n例如，假设个人“X”收到了一封被感染的邮件，并且在不知情的情况下打开了它。随邮件发送的蠕虫代码感染了 X 的邮箱账户。然后，蠕虫代码通过 X 的邮箱联系人检测到两个个人“Y”和“Z”的邮箱地址。假设\
  \ X、Y 和 Z 是朋友。\n\n在 X 不知情的情况下，蠕虫代码编写了一封类似的受感染邮件并发送给 Y。如果 Y 从未知来源收到邮件，这并不是大问题，因为他们不太可能打开。但实际发生的情况是，蠕虫代码在向\
  \ Y 发送邮件之前使用 Z 的邮箱地址伪造了“发件人地址”。在 Y 的收箱中，这封受感染的邮件似乎来自 Y 的朋友“Z”。但实际上这是一封由蠕虫代码传播的邮件。由于发件人地址显示为\
  \ Z 的邮箱，Y 很可能会打开这封受感染邮件。\n\n# 第 8 章：Linux 的基本功能\n\n现在是时候学习一些为了自信使用 Linux 而需要的基础知识了。这些功能对于帮助你轻松操作计算机系统至关重要。让我们花一点时间看看这些基本功能，学习它们如何为我们工作。\n\
  \n## 界面登录与注销\n\n涉及到 Linux 操作系统，每次尝试进入系统时，你都需要提供登录凭据，即用户名和密码。此外，当你运行 Linux 系统时，有两种模式可供选择，我们将在下方介绍它们：\n\
  \n### 图形模式\n\n图形模式将是你的桌面电脑的默认模式。基本上，如果计算机屏幕在让你进入之前提示密码和用户名，你就知道你正在使用图形模式。要登录，你只需要输入已经设置好的登录凭据，然后按确定或\
  \ `ENTER` 键。\n\n在输入这些登录信息后，有时需要几分钟时间来加载并准备就绪；所需的时间取决于你计算机的性能及其处理能力。当计算机完成加载后，你需要打开\
  \ `xterm`，也称为终端窗口。你可以通过简单点击“应用程序”（Applications）然后选择“工具”（Utilities）来找到此工具。注意：在某些较新的\
  \ Linux 版本中，会有一个图标可以加速此过程，你可以直接点击它，而不是按照上述步骤操作。\n\n\n\n终端窗口基本上将是你操作系统的控制面板。你想要对操作系统执行的大多数操作都可以通过这个工具完成。按照一般规则，当你打开终端窗口时，它应该显示某种命令提示符。通常，这开头会显示你的系统用户名，以及一些关于已执行更新的信息。\n\
  \n当你准备好以这种模式注销时，你需要确保你已经关闭了终端窗口和所有打开的程序。然后，你可以找到注销图标，或者在主菜单上搜索“注销（Log Out）”选项。如果你忘记关闭某个应用程序或窗口，也没什么大碍，因为电脑可以替你处理，但系统会在你下次回来时尝试找回所有这些窗口和程序，这可能会减慢电脑启动的过程。当你看到屏幕再次要求你输入登录凭据时，你就知道自己已经成功注销系统。\n\
  \n## 文本模式 (Text Mode)\n\n在该系统中，用于输入凭据的另一种模式是文本模式。当你看到整个屏幕是黑色的，上面只有几个字符时，你就知道自己正处于文本模式。这种模式的屏幕将显示一些数据，包括计算机名称、关于该计算机的一些数据，然后是一个可用于登录的提示符。与图形模式相比，这种模式有点不同，因为在你输入完用户名后需要按下\
  \ `ENTER` 键，因为屏幕上没有可以点击的按钮或链接。然后你可以输入密码并再次按下 `ENTER`。\n\n这种模式的一个很棒的地方是，当你输入用户名和密码时，你看不到任何正在输入的迹象。在输入时，你不会看到单词、字母，甚至是点或特殊字符的出现。对于一些初次使用该系统的人来说，这可能会让他们感到困惑，但出于安全考虑，它是这样运行的。\n\
  \n一旦系统接受了你的用户名和密码，你将收到“每日消息（message of the day）”。某些 Linux 发行版具有一种被称为“幸运饼（fortune\
  \ cookie）”的功能，它每天都会为你提供一些额外的感悟。然后，系统将为你提供一个 shell（壳），其详细说明与你使用图形模式时得到的相同。\n\n当你准备好从该系统注销时，只需要输入\
  \ `logout` 然后按 `ENTER`。当屏幕恢复并再次要求你输入登录凭据时，你就知道已成功注销系统。\n\n## 基础命令 (The Basic Commands)\n\
  \n现在你已经了解如何根据我们所处的模式登录和注销 Linux 系统，是时候开始学习一些我们将要使用的基础命令了。这些命令非常容易学习，如果你过去接触过某些编程语言，你可能以前见过其中一些命令了。初学者应该学习的某些命令包括：\n\
  \n* `ls` - 这将显示你当前所在目录下的文件集。\n* `passwd` - 此命令将更改当前在系统上的用户的密码。\n* `pwd` - 这将显示当前工作目录。\n\
  * `cd directory` - 这将切换目录。\n* `man command` - 这将读取关于命令的帮助页（man pages）。\n* `exit`\
  \ 或 `log out` - 这将更容易离开当前会话。\n* `info command` - 这将读取关于命令的信息页（info pages）。\n* `file\
  \ filename` - 这将显示指定名称的文件的类型。\n* `apropos string` - 这个命令将使用 `what is` 数据库搜索字符串。\n\
  \n## 其他注意事项 (Other Things to Note)\n\n在大多数情况下，你将单独发布命令。例如，你只需要输入 `ls`，系统就能为你完成其余的所有工作。如果你指定了选项（option），命令的行为将会有不同，你可以通过引入一个横字符（dash）来实现。在\
  \ GNU 环境中工作时，只要你用两个横字符引入，它就能接受较长的选项，但某些命令将没有这些额外选项。\n\n被称为命令“参数（argument）”的内容，是你想要应用命令的对象的规范。一个很好的例子是\
  \ `ls /etc`，在这里，`/etc` 就是目录和参数，而 `ls` 就是命令。这个特定的参数将显示你想查看 `/etc` 目录的内容，而不是默认目录。然后你就可以点击\
  \ `ENTER` 键进入该目录。取决于你尝试执行的操作，某些命令需要参数来帮助系统理解你在寻找什么。\n\n## 使用 Bash 特性 (Using the\
  \ Bash Features)\n\nBash 是你将使用的多数 Linux 系统上默认的 GNU shell，它将让你更容易使用某些组合键，以便轻松、快速地完成任务。使用\
  \ Bash shell 的一些常用功能包括：\n\n* `Tab` – 这将补全命令或文件名。如果有多个选项，系统将使用视觉或听觉通知。你。如果系统检测到有很多可能性，它会询问你是否想检查所有选项。\n\
  * `Tab Tab` - 这将显示文件名或命令的补全可能性。\n* `Ctrl + A` – 这将光标移动到当前命令行的开头。\n* `Ctrl + C` –\
  \ 这将结束你的计算机程序，然后显示 Linux 提示符。\n* `Ctrl + D` – 这将你从当前会话中注销。这个组合键类似于输入 `exit` 或 `logout`。\n\
  * `Ctrl + E` – 这将光标移动到当前命令行的末尾。\n* `Ctrl + H` – 这的功能与按下键盘上的退格键（backspace）类似。\n*\
  \ `Ctrl + L` – 这将清除当前终端。\n* `Ctrl + R` – 这将搜索命令历史。\n* `Ctrl + Z` – 这将允许你挂起计算机程序。\n\
  * `Arrow right / arrow left` - 向右/向左箭头键将让你更容易在当前命令行上移动光标。如果你需要添加更多字符或进行某些更改，可能会发现它很有用。\n\
  * `Arrow up / arrow down` - 上/向下的箭头键将让你更容易浏览系统历史。你可以访问任何想要重复的行，根据需要修改某些数据，然后按 `ENTER`\
  \ 快速执行这些新命令。\n* `Shift + Page Up/ Shift + Page Down` - 使用这些组合键允许你查看终端缓冲区（terminal\
  \ buffer）。\n\n随着你对 Linux 系统越来越熟悉，你将开始更好地理解这些命令的工作原理，并学习其他命令，这会让你使用 Linux 系统变得更容易。这些是你应该学习如何使用的的一些初始命令，因为它们将让你在系统中导航变得容易得多。尝试一下它们并练习登录和注销系统，以便在进入下一步之前对它的运行方式有一个感觉。\n\
  \n## 在文件系统操作 (Working on the File System)\n\n\n\n\n接下来我们将处理的是 Linux 系统内部的文件和目录。许多新用户在使用此操作系统时会遇到问题，因为他们并不知道存储了哪些信息，甚至不知道这些信息存放在哪里。本章旨在回答这些问题，让你的\
  \ Linux 之之旅更加轻松。\n\n### 文件的不同类型\n\n在大多数情况下，你将处理普通文件。这些文件存储着普通数据，例如任务输出、文本文件和程序。Linux\
  \ 的运行方式与 Windows 不同，请记住这一点。屏幕上的文件看起来与你习惯在 Windows 中看到的相似，但它们所在的存储位置和工作方式在 Linux\
  \ 系统中会有所不同。\n\n基本上，文件系统从根目录（root）开始，也被称为简单路径；这是所有内容开始的地方，也是所有内容完成后去的地方。除了根目录及其分出的端口外，其他看起来与你在其他操作系统看到的非常相似，但你可能会发现它们现在更整洁、更容易处理。文件扩展名仍然存在以帮助用户，这在开始可能会让它们变得有些困难，但随着时间的推移，你会开始体会文件扩展名的价值，因为它们让你更容易根据需要找到文件。\n\
  \n### 文件系统的布局\n\n为了让内容更容易查找和理解，你会发现 Linux 上的文件系统类似于树。其结构会随着你添加或删除文件而改变和增长。总的来说，它们都源自根目录，你所做的任何更改将显示在树的更高位置。你可以根据需要添加任意的文件来使系统完善，你会看到树随着时间推移而变化。记住，文件树上的名称并不是强制要求的，但它们被用于惯例并保持方便。\n\
  \n文件系统的树从 `/` 开始，这也称为根目录（root directory）。这个根目录将包含所有的底层文件以及操作系统内部显示的目录。`/` 通常会紧跟在根目录下一层的目录之后。这基本上指示了这些目录的位置，并有助于将它们与计算机上可能具有相似名称的其他位置区分开。每当你使用较新版本的\
  \ Linux 时，确保先检查根目录以找到你想要的文件。\n\n### 根目录的子目录\n\n根目录之后会有各种子目录，构成了系统树。你可能会发现某些子目录有用：\n\
  \n- `/bin`：包含系统管理员和用户共享的普通程序。\n- `/dev`：存放 CPU 上所有外围硬件的引用。通常，这些是具有特殊属性的文件。\n- `/boot`：由启动文件和内核组成。某些\
  \ Linux 系统还包括统一引导加载程序，或 `grub`。\n- `/etc`：这是一个包含与系统配置相关文件的子目录。这与 Windows 中找到控制面板非常相似。\n\
  - `/home`：大多数普通用户的主目录。\n- `/misc`：用于存放任何被视为杂项文件的子目录。\n- `/lib`：包含计算机上所有计算机程序的库文件。\n\
  - `/opt`：此位置存放一些额外以及第三方程序。\n- `/root`：系统管理员使用的主目录。\n- `/proc`：这是一个虚拟文件数组，包含有关系统资源的数据。每当你想要查看此部分的更多信息时，只需打开终端窗口并输入\
  \ `man proc` 即可开始。\n- `/initrd`：存放启动过程的数据。确保永远不要删除它。\n- `/lost+found`：该目录将包含系统故障并突然关闭时保存的文件。\n\
  - `/tmp`：你的操作系统使用的临时存储单元。你永远不要用它来保存任何工作，因为当系统重启时，此文件夹中的所有文档都会被清理。\n- `/sbin`：存放操作系统和系统管理员使用的计算机程序。\n\
  - `/usr`：包含所有与用户相关的计算机程序的文档、程序和库。\n- `/var`：用于存储用户生成的任何临时文件和变量。这些包括文件下载、日志文件和邮件队列。\n\
  \n你可以根据文件在计算机中的存储位置来找到你正在工作的文件类型。如果你不确定存储在何处，请查看这些文件开头，并根据它是什么、计算机最初认为它是什么等，看看它最适合放在哪个位置。你也可以通过将这些子目录之一添加到文件的开头，来决定你想让文件存储在何处。\n\
  \n虽然这个系统在刚开始可能看起来难以理解，你可能觉得你一直在处理文件却再也找不到了，但 Linux 的保存树系统实际上比你在某些其他操作系统发现的简单得多。如果你能够在\
  \ Windows 操作系统中导航以找到你的项目和文件，你就能轻松弄清楚 Linux 文件系统是如何工作的。这只需要一点时间来学习每个东西的称呼并适应这个新系统。\n\
  \n# 第 9 章 取命令与控制\n\n本章将介绍强大的 Python 脚本的新来源，你可以重新利用这些脚本，通过目标机器上的外部控制系统收集数据，甚至使用现成的\
  \ API 执行命令并安装更新。到本章结束时，你应该能够创建一个 Python 工具，你可以通过互联网远程控制它，向目标机发布命令并接收捕获的数据。\n\n###\
  \ 使用 Pastebin 作为命令与控制通道\n\n我们在键盘记录器中包含了一个终止开关（killswitch）（使用 `~` 键终止脚本），但在实际的监控程序中带有这个开关是否是一个好主意由你决定。经验丰富的黑客会将键盘记录器代码中的终止开关作为一个函数而不是简单的按键事件，这样他们在需要时甚至可以远程终止它，而不会让用户无意中杀掉记录器。\n\
  \n\n\n\nPastebin 提供了一个设计良好的 API，使其能够轻松创建与其服务器高效通信的脚本。在更新我们的关键键盘记录器代码之前，我们首先需要编写支持代码，以便方便地访问和使用\
  \ Pastebin API。我们将脚本命名为 `pastebin.py`。\n\n`pastebin.py` 将使用 `requests` 库来发送 XML\
  \ 格式的响应，因此，我们还需要像下文代码一样导入 Python 的 XML 解析器。脚本中使用的三个相关 URL 也定义在本节中。\n\n```python\n\
