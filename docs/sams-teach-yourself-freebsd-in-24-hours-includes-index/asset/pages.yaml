- pgno: 177
  md: '```

    # Plain text or HP/PCL, so just print it directly; print a form feed

    # at the end to eject the last page.

    #

    echo $first_line && cat && printf "\0333l0H" &&

    exit 0

    fi


    exit 2

    ```


    Like the script for converting plain text into PostScript, this script basically
    reads the first two characters of the file to see if they are %!. If they are,
    the script assumes that the file is a PostScript file and uses Ghostscript to
    print it. If they are not, the script assumes that the file is plain text and
    passes it directly to the printer.


    As with the other filters, this filter should be saved in the /usr/local/libexec
    directory and made executable so that lpd can run it (for example, chmod 555 /usr/local/libexec/if-gs.sh).


    After you have finished creating and installing a text filter (and any applications
    it might need such as Ghostscript or a2ps), you need to configure the /etc/printcap
    file.


    # The /etc/printcap File


    The /etc/printcap file is the main printer configuration file. It is where the
    printer is defined, along with information about which filter it uses, where its
    spool directory is located, and so on.


    The format of this file is relatively simple. Here is a sample entry, and a discussion
    of what each part means follows:


    ```

    simba|lp|local line printer:\

    #

    :sh:

    :lp=/dev/lpt0:sd=/var/spool/lpd/simba:lf=/var/log/lpd.errs:

    :if=/usr/local/libexec/if-ps:

    ```


    The first line simply gives the name of the printer and any aliases that we want
    to associate with it. In this case, the printer is named simba and has the alias
    of lp. One of the printers defined in the /etc/printcap file should always have
    the alias lp because this will make it the default printer. The alias is a long
    description of the printer.


    The pound sign beginning the second line means that the line is commented out.
    In other words, it will be ignored. If the line is uncommented, the printer will
    print a header page (also known as a cover page) for each job that contains the
    name of the user and name of the file printed. You might want to uncomment this
    line if you have a lot of users printing to the same printer in order to make
    it easier for users to find their job in the pile.'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'The third line gives lpd information about where the printer and its associated
    spool files are. lp means that the printer is a local printer (as opposed to a
    network printer), /dev/lp0 means that the printer is on the first parallel port
    in the system, sd=/var/spool/lpd/simba will be the printer''s spool directory
    (make sure that the directory actually exists and that lpd can read and write
    to it), and lf=/var/log/lpd.err is the file that any errors that occur will be
    logged to.


    The fourth line is the input filter, which is the text filter that you configured
    in the previous section. In this case, it is using the filter that converts normal
    text to PostScript and passes plain PostScript through with no modifications.


    # Starting lpd


    After you have finished configuring the /etc/printcap file, you are ready to start
    the print daemon. To do this, you can simply type the command lpd as the root
    user. To have the print daemon started automatically on each system startup, add
    the following line to the /etc/rc.conf file:


    ```

    lpd_enable="YES"

    ```


    # Command Line Printing


    lpr sends a file to the print spooler. For example,


    ```

    lpr filename

    ```


    This command will print the file with the name filename to the default printer.
    (Remember that the printer with the alias lp in /etc/printcap is considered to
    be the default printer. Users can, however, override the system default to configure
    a different printer to be their default. We will look at how to do this later
    on.)


    If you want to print multiple files, you can specify more than one on the command
    line. For example,


    ```

    lpr file1 file2 file3

    ```


    If you want to print to a printer other than the one configured as the default,
    you can use the -P option followed by the name of the printer you want to print
    to, such as lpr -P simba file1. In this case, the file will be printed to the
    printer named simba.


    lpr has several other options, which are listed in Table 9.1.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# TABLE 9.1 Options Supported by the lpr Command


    | Option | Description |

    |---|---|

    | -l | Uses a filter that will print control codes and suppress the page breaks.
    This means that the normally invisible characters that control things in the printer,
    such as carriage returns, will actually be printed on the paper. |

    | -p | Formats the file with pr before sending it to the printer. pr formats pages
    to have 66 lines per page, along with a header at the top containing the date
    and time the file was created. It also contains the page number and five blank
    lines at the bottom of the page (probably useful mostly for old dot matrix printers).
    |

    | -P | Specifies a printer to print to other than the default one. |

    | -h | Suppresses the printing of header pages. If header pages are suppressed
    already by default, (in /etc/printcap), this option has no effect. |

    | -m | Causes lpr to send you an email notifying you when your print job has completed.
    It''s useful for busy network printers located on other floors and such. |

    | -r | Removes the file after it has been spooled. It should probably not be used
    because it removes the file before it has actually printed. |

    | -s | Creates a symbolic link in the spool directory that is then used to print
    the file. It is useful if the file is too big to copy into the spool directory.
    The problem with this is that if you use this with the original file, you can''t
    modify or delete the file until after it has finished printing. |

    | -e n | n is the number of copies that you want to print of each file. |

    | -J name | name is the name of the job that should be printed on the header page
    (if header pages are enabled). If this option is omitted, the name of the job
    will be the name of the first file that was sent. |

    | -T | This is the title that pr should use at the top of each page. It has no
    effect unless the -p option is also used. |

    | -i n | n is the number of columns that each line of printed output should be
    indented by. |

    | -w n | n is the page width in columns. It has no effect unless the -p option
    is also used. |


    # Checking the Status of Jobs


    The lpq command can be used to check the status of jobs that are currently in
    the print queue. If it is run with no options, it will show the status of jobs
    for the default printer. Similar to the lpr command, lpq can use the -P option
    followed by the name of a printer to show the queue for a printer other than the
    default one. Here is an example of lpq output:'
  merge: -1
  img_proc: true
- pgno: 180
  md: '```

    bash$ lpq -P simba

    simba is ready and printing

    Rank Owner Job Files Total Size

    Active mike 5 /home/murban/myfile.txt 2500 bytes

    2nd jane 6 /home/jane/file1.txt 3000 bytes

    3rd jane 7 /home/jane/file2.txt 4000 bytes

    4th mike 8 . . . 3500 bytes

    ```


    The first line tells what the printer is currently doing. In this case, it is
    ready and currently printing a job. Other messages you might see here include
    messages if the printer is jammed, and so on.


    Four jobs are listed in the queue. The first one is currently active, which means
    that it is printing. It is owned by the user mike, and the file being printed
    is /home/murban/myfile.txt. The size of the file in bytes is also given.


    The rest of the jobs are in the queue waiting to be printed, and will be printed
    in the order of their rank.


    Notice that the last job doesn''t list the name of the file being printed and
    just has three periods instead. This simply means that the path of the file was
    too long to fit in the list, so it simply wasn''t listed.


    If you want to see the status of only one particular job or only the status of
    jobs owned by one particular user, you can follow the lpq command with the job
    number or the name of the user you want information for.


    Two other useful options for the command are -l, which will cause information
    about the file being printed to be displayed even if it would cause the output
    to break across multiple lines (that is, the filename is long) and -a, which will
    display information on all local queues for all printers.


    # Removing Jobs from the Queue


    The lprm command is used to remove print jobs from the queue. If you run it without
    any command line arguments, it will remove whatever job is currently printing.
    (This is assuming that the job belongs to you. You can''t remove jobs of other
    users unless you are the root user.)


    If you run lprm followed by a job number, it will remove whatever job number you
    specify. (The job number can be obtained by examining the queue with lpq as described
    earlier.) For example,


    ```

    bash$ lprm 2

    dfA002simba.lion.org dequeued

    cfA002simba.lion.org dequeued

    bash$

    ```'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'Two files were removed from the queue even though you only listed one job because
    one of the files is a control file. However, although two files were removed,
    only one print job was actually removed.


    The system can sometimes take a few seconds to respond after typing the lprm command,
    and it might seem that the system has hung up. Chances are it hasn’t; it just
    takes a few seconds for this command to complete sometimes.


    A few options to lprm can be useful. Like most of the other printer commands we
    have discussed up to this point, lprm supports the -P option to specify a printer
    other than the default one. Another useful option is simply a dash (-) by itself.
    This will remove all the jobs from the queue that belong to you (lprm -).


    If you are logged in as the root user, you can also supply the name of a user
    after the lprm command. This will remove all the jobs belonging to that user.


    Note that if you cancel a currently printing job, it will not stop printing right
    away because any pages already in the printer’s buffer memory will still print.
    Depending on how much memory is in your printer and what kinds of things are in
    the document (images take up more memory than text, for example), this could mean
    that several more pages will print even after you have canceled the job.


    # Controlling the Printers


    The lpc command is used to control printers and print queues connected to the
    server. Note that only the root user (with certain exceptions covered later on)
    can access most of the lpc functions. lpc is used to disable print queues, enable
    print queues, reset printers, check the status of print queues, and change the
    order of the jobs in the queue.


    There are two ways that you can start lpc. The first is with the name of a command
    as a command line argument. If you start lpc this way, the given command will
    be run, and lpc will exit. See the man page for lpc for details on the commands
    that can be given from the command line.


    The second way that lpc can be started is in interactive mode. If you start it
    with no command line arguments, this is the mode you will be placed in. When in
    interactive mode, lpc will display a prompt that looks like the following:


    ```

    lpc>

    ```


    If you type ? or help at this prompt, you will be given a list of commands that
    lpc understands.'
  merge: -1
  img_proc: true
- pgno: 182
  md: "# Queue Status\n\nWhen in lpc, you can check the status of print queues by\
    \ using the status command. It needs to be followed by either the keyword all,\
    \ which will display the status of all queues, or by the name of a specific printer\
    \ that you want to get the status of. Some sample output of the status for a default\
    \ printer follows:\n\n```\nlpc> status lp\nlp:\n  queuing is enabled\n  printing\
    \ is enabled\n  2 entries in spool area\n  waiting for lp to become ready (offline?)\n\
    \nlpc>\n```\n\nIn this case, the queue is enabled, printing is enabled, and two\
    \ entries are in the print spool waiting to be printed. However, the printer is\
    \ not ready to print, and lpc suggests the possible reason might be that it is\
    \ offline.\n\n# Disabling the Queue\n\nThere are times when you might want to\
    \ disable the print queue to prevent it from allowing users to queue jobs on the\
    \ printer. For example, the printer might be down for maintenance. There are two\
    \ ways that you can disable the print queue from lpc.\n\nThe first way is with\
    \ the command disable. In this case, the queue will be stopped, but printing will\
    \ still be allowed. This means that any jobs still in the queue will be printed\
    \ (assuming that the printer can print them), but no new jobs will be accepted.\
    \ If a user tries to print to a printer where the queue is down, he will get a\
    \ message similar to lpr: Printer queue is disabled. Similar to the other lpc\
    \ command we have discussed, disable requires either the keyword all to disable\
    \ all queues on the system or the name of a printer that you want to disable the\
    \ queue on.\n\nThe other command that can be used to disable the queue is down.\
    \ Once again, it needs to be followed by either the keyword all or the name of\
    \ a specific printer.\n\nUnlike the disable command, the down command disables\
    \ the queue and also disables printing as soon as the current job has finished\
    \ printing. This means that any jobs left in the queue will not be printed.\n\n\
    You can also give an optional status message with the down command. For example,\n\
    \n```\nlpc> down lp Printer is trashed.\n```\n\nThis status message is stored\
    \ in a file named status that is located in this printer's spool directory and\
    \ will be displayed when a user uses the lpq command to examine the printer's\
    \ queue."
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Enabling the Queue and Restarting the Printer


    To enable a queue that is down, you can use the enable command followed by the
    keyword all or the name of a specific printer whose queue you want to enable.
    Note however, that this command will only enable the queue. If printing is disabled,
    it will not enable printing. This means that jobs will be accepted and queued
    for printing, but they will not actually be printed.


    The up command will re-enable the queue and also re-enable the printer. But it
    will not get rid of the status message if you provided one. Use the restart command
    to do this and clear the status message.


    # Restarting the Daemon


    Occasionally, for whatever reason, you might need to restart the print daemon
    for a printer (perhaps the daemon has hung). The restart command can do this.
    Once again, it needs either the keyword all or the name of a specific printer
    that you want to restart.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_183_0.png)


    > At the time of this writing, the restart command sometimes kills the daemon
    but doesn''t restart it again even though its status message claims that the daemon
    has been restarted. To verify that the daemon actually did restart, use the lpc
    command to check the status of the printer. If it contains the line Warning: no
    daemon present, it means that the daemon was not actually restarted. Simply run
    the restart command from lpc again to take care of this.


    # Cleaning the Queue


    Occasionally, because of printer problems and such, the print queue directory
    can accumulate some garbage. (Files that cannot be printed and such because information
    is missing and they are not complete jobs.) To clean out the queue directory,
    you can use the clean command from lpc. As you have probably guessed by now, it
    requires either the keyword all or the name of a specific printer.


    # Changing the Priority of Print Jobs


    To change the priority of jobs in the print queue, use the topq command. It requires
    the name of the printer followed by a list of job numbers that you want to move
    to the top of the queue. For example, topq 5 3 8 2 will move the jobs 5, 3, 8,
    and 2 to the top of the queue, respectively. Only the root user can change the
    priority of print jobs.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '# Abbreviating Commands


    Commands in 1pc can be abbreviated to their shortest nonambiguous form when you
    type them. For example, status can be abbreviated to stat, and 1pc will know what
    you mean. It cannot, however, be abbreviated to sta because it is ambiguous with
    the command start.


    # Summary


    In this hour, you learned how to configure a basic printer in FreeBSD. There is
    a lot of advanced material that we didn’t cover here, such as network printers.
    More in-depth coverage of advanced printing topics can be found in *FreeBSD Unleashed*
    from Sams Publishing, and also in the FreeBSD handbook.


    # Workshop


    This section is designed to answer common questions that come up about printing,
    as well as to solidify your understanding of printing with quiz questions.


    # Q&A


    **Q** My printer doesn’t receive data, and jobs just keep sitting in the queue.
    What could be wrong?


    **A** Make sure that the printer isn’t disabled by checking the queue with 1pq.
    Also make sure that there is no warning about the queue being disabled. If there
    is, you will need to restart the queue using the restart command in 1pc.


    **Q** The printer seems to be getting data (the data light is flashing), but it
    never prints. How can I correct this?


    **A** This is commonly caused by trying to send non-PostScript data to a printer
    that only understands PostScript. The printer is expecting control codes that
    it is not getting. Make sure that you are using a filter such as the one discussed
    earlier in this hour to convert non-PostScript data into PostScript.


    **Q** Printer prints out a lots of garbage, especially when trying to print images.
    Why is this happening?


    **A** This often happens when you try to send a PostScript document to a printer
    that can’t handle PostScript. See the section in this hour on "Configuring a Ghostscript
    filter" for information on how to correct this.'
  merge: -1
  img_proc: true
