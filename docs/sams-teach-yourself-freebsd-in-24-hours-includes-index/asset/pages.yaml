    # Summary


    In this hour, you learned about basic use of the UNIX shell in FreeBSD. You learned
    that the shell acts much like an interpreter, translating human commands into
    language that the kernel can understand and vice versa. You looked at the different
    shells available for FreeBSD and examined some of the benefits and drawbacks of
    each. You then learned how to get help in the shell using both the UNIX man pages
    and the GNU info pages. The next section covered some of the special features
    of bash, including command-line editing, command history, and command completion.
    Finally, you learned how to kill misbehaving processes, move processes into the
    background, suspend processes, and restore them to the foreground.


    # Q&A


    Q Why does FreeBSD treat the C shell (csh) and Tcsh as the same thing when clearly
    they''re not?


    A The tcsh shell is completely backward compatible with csh and includes a lot
    more features. It''s effectively just a more advanced version of the same shell.
    If you want to install the old-style C shell, you might want to check out the
    44bsd-csh port (/usr/ports/shells/44bsd-csh).


    Q Some of these shell commands are unnecessarily long. How can I shorten them?


    A Most shells allow you to set up aliases, which are short commands that you specify
    to stand for longer ones. FreeBSD comes with several aliases set up by default
    in Tcsh; for instance, the ll command is an alias for ls -lA. You can override
    this or set up more aliases in the .cshrc file in your home directory.


    Q After I install a new program, if I type its name, the system tells me it''s
    not found. How do I make it “see” the new program?


    A Your shell needs to be restarted in order to re-read the programs in its path.
