    continue typing until the command or filename is no longer ambiguous and press
    the Tab key again. Bash will complete the command for you. You can then check
    to make sure that Bash chose the correct command, as well as make any changes
    to the command line that you need to make, such as adding a directory or filename
    onto it. When you have finished editing the command line, press the Enter key
    and the command will be executed.


    # File Permissions


    Because FreeBSD is a multiuser operating system, it is important to have some
    way to protect unauthorized users from getting access to files that they shouldn’t
    have access to. FreeBSD implements file permissions to do this


    File permissions are divided into three categories, and are of three types. The
    three categories are:


    +   - **Owner** These permissions determine what the owner of the file can do.
    By default, the owner is the person who created the file.

    +   - **Group** These permissions determine what group members can do with the
    file. By default, the group the file belongs to will be the primary group that
    the owner belongs to. (See the next hour for more information on Users and Groups.)

    +   - **Other** These permissions determine what everyone else can do with the
    file. Everyone else includes anyone who is not the owner and is not a member of
    the group that the file belongs to.


