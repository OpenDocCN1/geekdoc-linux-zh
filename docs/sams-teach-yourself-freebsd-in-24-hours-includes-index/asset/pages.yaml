  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_55_0.png)


    # Hour 3


    # A Basic Tour of FreeBSD


    FreeBSD, like most UNIX operating systems, has an extremely rich set of commands
    and utilities. This rich set of utilities allows users to do things with UNIX
    that most other operating systems cannot do. This power is one reason that UNIX
    has remained so popular, more than 30 years after it was originally written. Unfortunately,
    this rich set of utilities and commands can make FreeBSD a bit overwhelming and
    bewildering to the new user. This hour provides a gentle introduction to the FreeBSD
    command line interface and how to perform some basic operations.


    In this hour, you will learn the following:


    +   - The basics of the FreeBSD startup process

    +   - Logging in to FreeBSD

    +   - Your home directory and what it is for

    +   - The rest of the directory structure

    +   - Working with files and directories

    +   - Logging out of the system

    +   - The importance of proper system shutdown'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# The Basics of the FreeBSD Startup Process


    When you first turn on your computer, a number of processes must occur before
    you can start using it. For example, your computer needs to check that all of
    its hardware is available and working properly, and load the instructions off
    the hard disk that tell it what to do next. A basic understanding of these processes
    is helpful for understanding how FreeBSD works, as well as for troubleshooting
    problems when things go wrong.


    # The POST


    The first thing that happens when you turn on your computer is called the *Power
    On Self Test* (*POST*). This is a program run by your computer’s *BIOS* (*basic
    input/output system*). During this stage of the startup process, the computer
    checks all of its hardware to make sure that everything is there and working.
    It counts the available RAM and performs some basic tests on it, determines the
    types and size of available media (hard disks, and so on), and assigns resources
    to plug-and-play devices. Note that this stage of the startup process has nothing
    to do with FreeBSD. This step is performed no matter what operating system you
    intend to start on your computer. At this point, your computer still doesn’t know
    anything about what operating system it will be running.


    # The Bootstrap


    After the POST has completed, your computer’s BIOS looks for a device on your
    system that it can load an operating system from. The order in which devices are
    checked for an operating system can usually be configured in your system’s BIOS
    setup menu. Oftentimes, the floppy drive is the first device that gets checked.
    This is why you get the “Non-systems disk or disk error” message if you have a
    floppy disk in your drive when you turn on your computer. Normally, the device
    that the system boots from will be the system’s hard disk.


    # The Boot Manager


    After the BIOS has found a bootable hard disk, it will read whatever is located
    at sector 0 on the hard disk. You can think of sector 0 as basically being the
    first thing on the hard disk. Sector 0 is also known as the *Master Boot Record*
    or *MBR*. This procedure begins what is called the *bootstrap*, which gets its
    name from the idea that the system is “pulling itself up by its bootstraps.”


    If you installed a dual boot system so that you can choose whether you want to
    work in Windows or FreeBSD each time you start your system, the FreeBSD boot manager
    program is what will be located in the MBR. You will know that this stage of the
    boot process has completed when you get a menu that looks similar to the following:'
  merge: -1
  img_proc: true
- pgno: 57
  md: '```

    F1 DOS

    F2 FreeBSD


    Default: F2

    ```


    The DOS entry is actually Windows. But it will show up as DOS with some versions
    of Windows. To select the operating system you want to start, simply press the
    function key corresponding to the entry in the menu. If you do nothing for a period
    of time, the entry listed next to Default will be started automatically. (The
    default will normally be whatever operating system you selected the last time
    you used your computer.) For the rest of this hour, I will, of course, assume
    that you selected FreeBSD from this menu.


    > FreeBSD can also be booted from the Linux boot loaders: LILO and GRUB. However,
    configuring this is beyond the scope of this book. Please see the LILO or GRUB
    documentation for more information on how to add another boot option to either.


    If you elected to install FreeBSD as the only operating system on the computer,
    you will not see this menu, but rather FreeBSD will start loading immediately.


    # The Kernel


    There are actually a couple of startup stages between the boot manager and this
    stage, but we are going to skip them because they are not important at this point.
    They mostly exist for technical reasons. If you are interested in learning more
    about these stages and why they exist, there are more details of the bootstrap
    procedure in the FreeBSD Handbook available on the FreeBSD Web site at www.freebsd.org.


    The next part of the startup process loads and starts the FreeBSD kernel. The
    kernel is a special piece of software that serves as the core of the operating
    system. It controls access to system resources such as RAM, hard disks, and so
    on, provides services (such as multitasking) that allow your computer to do more
    than one thing at the same time, ensures that two programs cannot interfere with
    each other by accessing resources not allocated to them, and, on a multiuser system
    such as FreeBSD, ensures that users cannot interfere with other users by controlling
    what parts of the system the users can access.


    When the kernel has loaded, you will see a copyright notice that looks similar
    to the following:


    ```

    Copyright 1992-2002 The FreeBSD Project

    Copyright 1979, 1980, 1983, 1986, 1988, 1989, 1991, 1992, 1993, 1994

    The Regents of the University of California. All rights reserved.

    FreeBSD 4.7-RELEASE #0: Sun, Sept 14 02:04:15 CST 2002

    root@simba.lionresearch.org:/usr/obj/src/sys/SIMBA

    ```'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The parts you want to take notice of here are the last two lines (lines 4 and
    5). Line 4 contains important information about the version of FreeBSD you are
    running. In this case, we are running FreeBSD version 4.7 RELEASE (other possibilities
    are STABLE and CURRENT. I will explain these in a later hour). The date and time
    that follow the release indicate the date and time that this kernel was compiled.
    This might not mean much to you right now, but it will be important later on if
    you build a custom kernel for your system. (See Hour 10, “The FreeBSD Kernel and
    the Device Tree,” for why you would want to do this and how to go about doing
    it.) Line 5 lists the name of the user who built the kernel, as well as the hostname
    of the system that the kernel was built on. The second part of the line lists
    the directory in which the object files for the kernel are located. If you are
    a C or C++ programmer and you know what object files are, great. If you don’t
    know what object files are, don’t worry. You can work with and administer FreeBSD
    just fine without ever having to worry about this.


    After the copyright notice, you will see a flurry of messages go by the screen
    as FreeBSD detects and initializes the various hardware devices in your system.
    You don’t need to understand what these mean at this point, but you might recognize
    some familiar hardware in the list. For example,


    ```

    fd0: <1440 KB 3.5" drive> on fdc0 drive 0

    ```


    is a 3.5 inch 1.44Mb floppy drive. The first part of the line (fd0) is the FreeBSD
    device name. It is similar to the designation “A: drive” in Windows. However,
    the FreeBSD system actually makes more sense because the designation tells you
    something about what the device is—fd stands for floppy disk. The number 0 indicates
    that it is the first floppy disk in the system. In FreeBSD, numbers almost always
    start at 0 rather than 1.


    You might also see some lines that look something like this:


    ```

    unknown: <PNP0501> can''t assign resources

    ```


    You needn’t worry about these messages either. These are simply plug-and-play
    devices in your system that FreeBSD doesn’t know anything about. With time, as
    FreeBSD supports more and more hardware, you should see fewer and fewer of these
    messages.


    After the kernel has finished initializing hardware, it will mount the root file
    system. (More on mounting and unmounting file systems can be found in Hour 8,
    “Storage Systems and Backup Utilities.”) Mounting the file system simply makes
    it available for use. You will see a message similar to the following when this
    process occurs:


    ```

    Mounting root from ufs:/dev/ad0s1a

    ```


    After this has happened, the kernel will invoke a program called init to handle
    the rest of the system startup. Messages coming from the kernel and messages coming
    from the'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'init program can be distinguished by their color. Kernel messages are white,
    whereas messages from init are light gray in color.


    # init


    One of the first things the init program does is check to make sure that the system
    was shut down properly the last time the computer was restarted. If it wasn''t,
    init will run a program called fsck, which is basically the equivalent of the
    Windows Scandisk program. fsck will check and repair any file system damage resulting
    from improper shut down of the system.


    After the file systems have been checked, init reads the system startup scripts
    and runs any programs that are set to run on system startup. These are similar
    to services in Windows or programs that have been placed in the Startup group
    in Windows.


    After these programs have been started, init runs a program that initializes the
    console and provides you with a login prompt.


    # Logging In to FreeBSD


    When the system startup process has finished, you will be left with a prompt that
    looks something like this:


    ```

    FreeBSD/i386 (simba) (ttyv0)

    login:

    ```


    This prompt is asking you to enter the login name you gave to the user you created
    when you installed FreeBSD. (simba) is the hostname of this system. Your hostname
    if you just installed FreeBSD and didn''t specify a different one during the install
    will probably be (amnesiac). (Note that the parenthesis are not part of the hostname.)
    You will learn how to change the hostname in a later Hour.


    If you are coming from a Windows background, the first thing you might be wondering
    is why you have to login. FreeBSD is a multiuser system, meaning that many different
    users can use the system at the same time. FreeBSD was also designed to work in
    a networked environment. Because of this, security is a concern, so FreeBSD requires
    users to login with a username and password. This prevents an unauthorized people
    from accessing files and such that they should not have access too. But even if
    you have a home system in which security is not an issue, there is still another
    good reason for users with separate logins. Each user can customize the system
    to his liking without affecting how the system works for someone else, which means
    no fighting over which wallpaper should go on the background, which sounds should
    be used for various events, and so on. Each user'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'can set up the system the way they like it and not have to worry about changing
    the settings of other users.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_60_0.png)


    > If you are the only person who uses the system, you might be tempted to just
    always work as the root user. This is not a good idea though because the root
    user has no restrictions and can do anything to any part of the system, including
    deleting important system files. Normal user accounts have built-in safety nets
    that prevent you from damaging the system (but not from damaging your own files).
    Because of this, it is always better to do most of your work with a normal user
    account and only login as root when you need to do something that can''t be done
    as a normal user.


    After you have entered your username at the login prompt and pressed Enter, FreeBSD
    will prompt you for a password. Enter the password you assigned to the user during
    the installation and press Enter again. Note that you will not see the password
    on the screen. Don''t worry, FreeBSD is reading your password as you type it.
    It just isn''t displaying anything on the screen in order to prevent someone who
    might be looking over your shoulder from getting your password. Assuming that
    you enter both the username and password correctly, you will see something similar
    to the following:


    ```

    Last login: Fri Sept 20 02:04:15 on ttyv0

    Copyright 1980, 1983, 1986, 1988, 1990, 1991, 1993, 1994

    The Regents of the University of California. All rights reserved.


    FreeBSD 5.0-RELEASE (GENERIC) #0: Fri Sept 20 03:15:25 CST 2002


    bash$

    ```


    If you made a mistake entering either the username or password, you will see the
    following instead:


    ```

    Login incorrect

    login:

    ```


    Simply reenter the username and password and try again. When you have successfully
    logged in, you will see the bash$ prompt as described previously.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_60_1.png)


    > Pay attention to the date listed for the “Last login” information after you
    have logged in. It can be a potential warning that someone else has used your
    account if you know that you didn’t login at the time listed here. If this happens,
    change your password immediately and notify your system administrator (unless
    you are the system administrator). If you are the system administrator, see Hour
    14 on network security for further information.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '> If you mistype your username or password a few times in a row, it will appear
    that the system has stopped responding because it will not give you the login
    prompt back. This is actually a security feature designed to help foil computer
    software that attempts to crack passwords by random guessing. Wait a few seconds,
    and the prompt will return. The delay will get progressively longer the more times
    you mistype your password.


    # Your Home Directory


    After you have successfully logged in and you have the bash$ prompt, you will
    be located in your home directory. Your home directory is basically your personal
    space on the FreeBSD system. It is similar to the My Documents folder in Windows.
    All of your personal files are stored in your home directory, including your personal
    preference files for how FreeBSD is set up and any additional documents or directories
    you create. By default, no one else can write anything to your home directory.
    This means that no one else except you can create directories or files in your
    home directory. It also means that no one else can change or delete any directories
    or files in your home directory. This provides a measure of security because it
    prevents others from accidentally deleting your files.


    > By default, FreeBSD only prevents other users from deleting or changing files
    and directories that you have in your home directory. It does not stop other users
    from reading files stored in your home directory. If you have sensitive files
    that you want to make sure other users cannot read, you can change the file''s
    settings to do this. This will be covered in Hour 4, "Basic UNIX Shell Use." Note
    however that the root user (system administrator) can read any file on the system.
    It is impossible to prevent the root user from reading any file. So keep in mind
    that even if you set a file so that only you can read it, anyone who has system
    administrator access to the system will still be able to read the file anyway.


    # The Rest of the Directory Structure


    Your home directory is just one part of the entire FreeBSD directory structure.
    Outside of your home directory, FreeBSD has a complex, but well organized, set
    of directories. As a normal user, you cannot make any changes to any directories
    or files outside of your home directory (with certain exceptions, which are not
    important right now). However, you will access files located outside of your home
    directory structure on a very regular basis because this is where most of the
    programs you will be working with are located.'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Like most modern operating systems, FreeBSD uses a hierarchal directory structure
    known as a tree structure. You are probably familiar with this term from Windows.
    If not, it gets its name from the fact that if visualized, the directory structure
    looks like an inverted tree with the highest level directory (the root directory)
    at the top (the root of the tree), and all other directories branching off the
    root directory. Figure 3.1 shows some levels of the FreeBSD directory tree. The
    levels given in the figure are explained next.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_62_0.png)


    The directory at the top of the tree in Figure 3.1 is known as the root directory.
    It is represented by a single slash (/). All other directories are subdirectories
    of the root directory. An absolute directory path is written with each directory
    separated by a forward slash, going all the way back up to the root directory.
    For example, the directory /usr/bin indicates the directory bin, which is a subdirectory
    of the directory usr, which is a subdirectory of the root or top level directory
    /. Table 3.1 lists the purpose of the directories shown in the tree.


    TABLE 3.1 Purpose of Directories Shown in the Tree of Figure 3.1


    | Directory | Purpose |

    |---|---|

    | / | The top-level root directory. Primarily serves as a container to hold the
    entire file system. |

    | /boot | Contains files necessary for starting the system, including the kernel.
    |

    | /bin | This directory contains programs that are part of FreeBSD, including
    the commands for creating and deleting directories, and so on. |

    | /etc | Configuration scripts that control the behavior of the system. Also data
    files that store user information such as passwords. |

    | /usr | Programs and directories generally accessed by normal users. |

    | /usr/local | Programs and configuration files specific to the local system.
    This generally refers to third-party software installed that is not part of the
    base FreeBSD install. |

    | /home/username | This is where users'' home directories are stored, where username
    is the name of the user who owns the directory. I introduced the home directory
    earlier in this hour. |

    | /var | This includes files that vary in size. Common things that are stored
    here include directories to hold print jobs waiting to be sent to the printer,
    Web server log files, and email directories. |'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'Table 3.1 (and the tree in Figure 3.1) does not show all the directories, but
    it does show some of the more important ones to give you an idea of how the directory
    tree looks and works. If Table 3.1 is about as clear as mud to you right now,
    don’t worry. Each of these directories will be explained in full when we deal
    with them later in the book.


    # Working with Files and Directories


    Although various graphical interfaces are available for FreeBSD that provide Windows
    Explorer-like interfaces for managing files and directories, it is sometimes very
    useful to be able to manipulate files and directories from the command line. If
    you have never worked with a command line before, this might seem like a step
    backward in history to you. But actually, for many tasks, the command line can
    be much more powerful and quicker to work with than a graphical user interface—especially
    for doing things that involve manipulating a large number of similar files.


    If you have worked with the command line in Windows, or with DOS, you will find
    that the FreeBSD command line is quite similar for most things, although some
    command names are different. If you have not worked a command line before, this
    section provides a gentle introduction to it.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_63_0.png)


    > Even if you are an experienced Windows command-line user, you should at least
    skim this section because some commands will not behave the way you would expect
    them to behave in DOS. Particularly important is the section on FreeBSD wildcards,
    which behave quite differently from DOS wildcards. Wildcards that do absolutely
    nothing in DOS could potentially delete every file in a directory in FreeBSD!


    The following sections go through some of the basic file and directory manipulation
    commands. Because most people learn best by actually doing rather than just reading,
    I suggest that you follow along by logging in to your FreeBSD system using the
    user you created during the installation and try these commands yourself.


    # Creating and Deleting Directories


    The FreeBSD command for creating a new directory is mkdir. It is short for make
    directory. In its most basic form, simply follow the command name with the name
    of the directory that you want to create. For example,


    ```

    bash$ mkdir mydir

    bash$

    ```


    This command creates a new directory in the current directory called mydir.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Rules for Directory Names


    FreeBSD has very few rules for directory names. However, for the sake of making
    things easier to work with, there are certain conventions that I suggest you follow.
    Note that all these rules apply to filenames as well.


    It is possible to create directory names that contain spaces, but in order to
    do so, you need to use quotation marks around the entire directory name. FreeBSD
    interprets a space as an argument separator for the command. In other words, if
    you type the command mkdir my dir, FreeBSD will interpret the space between my
    and dir as an argument separator. The result is that the command will create two
    new directories—one named my and the other named dir. For the command to have
    the desired effect of creating a directory called "my dir", you need to type it
    like this:


    ```

    mkdir "my dir"

    ```


    Because typing quotation marks around directory names is inconvenient and also
    error prone, I suggest that you avoid using directory names with spaces. One common
    solution is to use the underscore character instead of a space (for example, "my_dir").
    This avoids the potential error of using spaces in directory names.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_64_0.png)


    > Directory names that contain spaces also pose a potential danger for making
    mistakes that can have unintended results. For example, suppose that you have
    a directory called documents from work, another directory just called documents,
    and a third one called work. You want to delete the directory called documents
    from work. As I said before, FreeBSD interprets a space as an argument separator
    unless it is quoted. The command to remove a directory is rmdir. If you forget
    to quote and type the command rmdir documents from work, FreeBSD will attempt
    to remove three directories named documents, from, and work. In this case, failure
    to quote will have disastrous results because this command will delete the documents
    directory and the work directory, while leaving the documents from work directory
    untouched—not what you intended to happen. Using the underscore character instead
    of the space avoids the danger of this happening.


    Also, you cannot begin a directory or filename with a dash character (-) because
    FreeBSD interprets the dash to indicate that what follows is a parameter that
    modifies the behavior of the given command. You can have dashes in the middle
    of your filenames and directory names, however.


    To delete the directory you just created, use the rmdir command. For example,


    ```

    bash$ rmdir mydir

    bash$

    ```'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'Note that rmdir can only remove directories that are empty. If there are any
    files or subdirectories within the directory, you will get the error message directory
    is not empty. Later in this hour, we will look at a command that can remove directories
    that are not empty.


    Note that the rmdir command does not ask for confirmation before it goes to work.
    FreeBSD assumes that you know what you are doing and by default, commands almost
    never ask for confirmation before they go to work—even if you have told them to
    do something extremely destructive. If you are not sure what you are doing, there
    is a command line option to use with most commands. The option is -i. The -i is
    short for interactive. This causes the command to ask you for confirmation before
    it actually does anything. This option can be very useful when you are not entirely
    sure that the command you are giving FreeBSD will have the intended effect. If
    it turns out that the command is going to do something other than what you intended,
    the -i option will let you know about it and give you the opportunity to bail
    out before it is too late.


    Assuming that you are following along and you issued the preceding rmdir command,
    go ahead and re-create the directory using the mkdir command again because we
    will use it in the next section.


    # Listing Directory Contents


    The ls command is used to list the contents of directories. Here is some sample
    output from the ls command:


    ```

    bash$ ls

    Mail      projects      proposal-draft      program1

    tyfsbd    mail          program1.c

    bash$

    ```


    The main problem with this listing is that it gives you virtually no information
    about what kinds of things actually exist in the directory other than their names.
    But there is no way to tell whether the entry belongs to a file, subdirectory,
    and so on. Because of this, the ls command provides several options that can be
    used to get it to display more information on each entry. For example, the -F
    entry causes ls to give us more information about the type of each entry in the
    list:


    ```

    bash$

    Mail/      projects/      proposal-draft      program1*

    tyfsbd@    mail/          program.c

    bash$

    ```


    The symbols behind some of the entries in the preceding listing tell us what kind
    of entry it is. Here is what they mean:'
