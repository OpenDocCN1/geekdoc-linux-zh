- pgno: 156
  md: 'Similarly, to mount a CD-ROM, use the following:


    ```

    # mount_cd9660 /dev/acd0c /cdrom

    ```


    # About NFS


    NFS, the Network Filesystem, is a method for mounting volumes from across the
    network into your directory structure. The procedures for using NFS, including
    the syntax for mount_nfs, are covered in Hour 24, "File Sharing". However, for
    the purposes of this lesson, it is worthwhile to look briefly at how an NFS share
    should be mounted.


    NFS shares (or available filesystems) are "exported" from UNIX machines on a network,
    such as a corporate LAN, and made available either freely to the entire network,
    or only to certain client machines. If your FreeBSD machine is one of the allowed
    clients, and if you know the NFS server''s hostname and the names of the shares
    on it, you can connect freely to it and incorporate the directory structure of
    any of the shares into your own system. For example, if an NFS server on your
    network has the name spots with a shared resource called /usr/local/share/documents,
    you can mount it onto a directory on your machine called /docs with the following
    command:


    ```

    # mount -t nfs spots:/usr/local/share/documents /docs

    ```


    The following will also work:


    ```

    # mount_nfs spots:/usr/local/share/documents /docs

    ```


    The contents of the remote machine''s documents share can now be browsed and worked
    with as though they were part of your local machine, albeit with a certain amount
    of lag time depending on how fast your network is.


    # The umount Command


    Before you remove a disk from the system, you must unmount it from the filesystem.
    Unmounting a disk completes all pending write operations and makes sure that all
    processes trying to use the disk are complete. You can physically remove a floppy
    disk from its drive while it is still mounted, or even while a program is writing
    to it; however, this might damage the disk or throw the kernel into a frenzy of
    futile recovery attempts. CD-ROMs are harder to remove while in use (they have
    soft eject mechanisms that typically do not work unless the operating system has
    released control of the disk), but you can still cause mischief with a straightened
    paperclip.


    The command for unmounting disks is umount (not "unmount"). To unmount the /mnt
    filesystem, issue the following command:


    ```

    # umount /mnt

    ```'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'You can also use umount /dev/fd0 to accomplish the same result or even umount
    -a to unmount everything except the root (/) filesystem.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_157_0.png)


    > Unmounting filesystems is a much simpler procedure than mounting them, with
    only one major complicating factor: For a filesystem to be unmounted, it cannot
    be in use. This means that to unmount filesystems such as /usr and /var, you will
    probably have to be in single-user mode. This is what leads to the most common
    surprise that most users find when first experimenting with mount and umount:
    You can''t be inside a filesystem you''re trying to unmount! If you are, you''ll
    get a "Device busy" error message. To be safe, be in the habit of entering cd
    / before you attempt to umount anything. Also be sure to check all your virtual
    terminals (Alt+F1, Alt+F2, and so on) to make sure that none of them are logged
    in and sitting inside a filesystem you want to unmount.


    # The /etc/fstab File


    You might be asking whether there is a shortcut to all this mounting—a way to
    program “recipes” for all the mountable devices on a system. After all, Windows
    machines and Macintoshes don’t need all this command-line mumbo jumbo in order
    to work seamlessly with disks, do they?


    After you have figured out the commands needed to mount your second IDE hard drive,
    your NFS volume from across the network, your MS-DOS Floppy, and your SCSI CD-ROM,
    do you really have to remember those commands every time you want to mount them?
    No, there is indeed a better way. That way is the /etc/fstab file.


    Take a look at the file now, using cat /etc/fstab:


    ```

    # Device Mountpoint FStype Options Dump Pass#

    /dev/ad0s1b none swap sw 0 0

    /dev/ad0s1a / ufs rw 1 1

    /dev/ad0s1f /var ufs rw 2 2

    /dev/ad0s1e /usr ufs rw 2 2

    /dev/acd0c /cdrom cd9660 ro,noauto 0 0

    /dev/fd0 /floppy msdos rw,noauto 0 0

    proc /proc procfs rw 0 0

    ```


    This file tells the system everything it needs to know about a given mount point:
    what device attaches to it, what filesystem type to expect, the mount options,
    and in what order it should perform filesystem checks when the system is booted.
    The fstab file is closely interrelated with the mount command; used in conjunction,
    the two tools can make filesystem management a relative breeze.'
  merge: -1
  img_proc: true
- pgno: 158
  md: "The main function of the fstab file is to give the system a profile of mounted\
    \ devices that can all be activated at once at boot time. With all your mount\
    \ points specified here, you can issue the command mount -a to mount them all.\
    \ This is what happens during boot, when the system goes through its filesystem\
    \ checks; the system runs fsck -p (to \"preen\" the filesystems, making sure that\
    \ they are all marked \"clean\" and thus viable for use). It then runs mount -a\
    \ -t nonfs to mount all but the NFS filesystems listed in /etc/fstab.\n\nBeyond\
    \ this function, though, is an even more convenient effect of having your mount\
    \ configurations saved in a central file. After a mount point is specified in\
    \ /etc/fstab, you no longer need to remember the mount command necessary to bring\
    \ it online; now, the only thing you have to know is the name of the mount point:\n\
    \n```\n# mount /floppy\n```\n\nThis reads in all the necessary information from\
    \ the fstab file. It knows that the device you want is /dev/fd0, that it's an\
    \ MS-DOS filesystem, and that you want it mounted read/write (instead of read-only,\
    \ which would be specified with ro rather than rw). Similarly, to mount a CD-ROM\
    \ disc, enter the following:\n\n```\n# mount /cdrom\n```\n\nNow, it's starting\
    \ to look almost user-friendly!\n\n![](img/ba0161b65b37e94cffc801ecbacaba5e_158_0.png)\n\
    \n> The noauto option on the /cdrom and /floppy entries tells mount that these\
    \ filesystems should not be mounted at boot time. As with NFS resources, there\
    \ is no guarantee that a CD-ROM or floppy disk will be available when the system\
    \ boots, so the noauto option prevents mount from spending point-less time trying\
    \ to mount a disk that isn't there. It doesn't prevent you from easily mounting\
    \ it later, however; the previous mount command is all you need.\n> \n> You can\
    \ specify any of the mount options in the fourth column of the fstab file that\
    \ are applicable to the filesystem in question. For instance, anything listed\
    \ in man mount can be used, as well as anything in the filesystem's man mount_*\
    \ page if it's a non-standard filesystem type.\n\n# The FreeBSD Automounter\n\n\
    NFS shares can be made a good deal more automatic with a nifty tool called amd,\
    \ or the Auto-Mount Daemon. This daemon allows you to mount NFS shares (and other\
    \ filesystem types, as a matter of fact) dynamically, simply by working in the\
    \ directory in which the share would be mounted without ever having to bother\
    \ with mount commands."
  merge: -1
  img_proc: true
- pgno: 159
  md: 'FreeBSD provides a basic way to set up amd. Simply add the following line to
    /etc/rc.conf:


    ```

    amd_enable="YES"

    ```


    When the system is booted with this option, amd runs with the options specified
    in the amd_flags setting, which are such that anything in the /host or /net directories—both
    of which are created automatically by amd—will auto-mount by name. You can also
    start it in the same way as it would be at boot time by issuing the following
    command:


    ```

    # amd -a /amd_mnt -l syslog /host /etc/amd.map /net /etc/amd.map

    ```


    With amd running, cd into the /host directory and look around. It’s empty.


    ```

    # cd /host

    # ls

    #

    ```


    However, try listing by name as if a directory were there with the same name as
    a known NFS server on the network (assume that the spots machine has an NFS share
    called /home, which might be a collection of users’ home directories):


    ```

    # ls spots

    home

    ```


    So, it seems that there’s indeed a directory called spots in the /host directory,
    and inside it is a home directory—which contains everything that the spots:/home
    share has. You’ve just auto-mounted that share into the /host directory simply
    by listing it as a directory name. /host/spots/home is functionally the same thing
    as an NFS mount created manually by attaching spots:/home to that location using
    mount or mount_nfs. The df command will verify it:


    ```

    # df

    Filesystem 1K-blocks Used Avail Capacity Mounted on

    spots://home 9924475 1642345 7488172 18% /.amd_mnt/spots/host/home

    ```


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_159_0.png)


    > Notice that NFS shares mounted in this manner actually appear to be mounted
    inside a directory called .amd_mnt in the root directory. This directory doesn’t
    actually exist; it’s just a shorthand used by the amd daemon for bookkeeping purposes.


    To specify a permanent location for a mountable NFS resource, simply make a symbolic
    link to the appropriate path within /host or /net:


    ```

    # ln -s /home2 /host/spots/home

    ```'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'From now on, whenever you go into the /home2 directory, the spots:/home share
    will automatically mount and give you access to its files. When the share is no
    longer in use, it will automatically unmount.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_160_0.png)


    > You can specify much more complex and mount maps, which are more direct methods
