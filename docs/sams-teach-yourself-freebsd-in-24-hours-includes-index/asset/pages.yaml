    # Hour 9


    # The FreeBSD Printing System


    Printing is a fairly common thing that people want to do with their computers.
    Unfortunately, configuring a printer is also one of the more difficult things
    for someone new to FreeBSD to accomplish. With the instructions given in this
    hour, you will learn how to configure basic local printing services in FreeBSD.
    In this hour, you will learn:


    +   - How FreeBSD handles printing

    +   - How to install and configure a printer

    +   - What Postscript is and why you should care

    +   - What Ghostscript is and how to use print utilities

    +   - How to manage printers and print jobs

    +   - How to connect to a network printer'
  merge: -1
  img_proc: true
- pgno: 170
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_170_0.png)


    > Before you begin trying to install your printer, you should be aware that there
    are certain printers called Winprinters that won''t work with anything other than
    Windows. This is because much of the functionality has been moved to software,
    allowing the manufacturer to save on hardware costs. If your printer says that
    it requires a Windows operating system, chances are that it won''t work with FreeBSD.


    # How FreeBSD Handles Printing


    The FreeBSD printing system consists of two primary parts. The first is the print
    daemon, called lpd. A daemon is simply a program that runs in the background waiting
    to receive and handle requests. In this case, lpd runs in the background and waits
    to receive something to be printed. When it gets a job, it might do some pre-processing
    such as running it through filters or converting the data to a different format
    that the printer can understand. When this has been finished, the job is placed
    in the print queue, which is basically a holding area that stores jobs waiting
    to be printed. (Jobs are generally printed on a first come, first serve basis.
    However, you will learn how to change the priority of a print job later in this
    hour.)


    When the printer is available to the queued print job, it will be spooled to the
    printer by the spooler. Why user a spooler instead of just send data directly
    to the printer? There are several reasons:


    +   - The printer can be used by multiple users because data can be queued up
    and then sent to the printer when it is available. This means that the user can
    send a print job and forget about it.

    +   - It allows you to send multiple print jobs to the printer without having
    to wait for currently printing jobs to finish.

    +   - It allows you to print in the background because the program that sent the
    job to the printer can send it and then forget about it. This means, for example,
    that you can print a document from a text editor, and then exit the text editor
    and work on other things even if the document has not finished (or even started)
    printing.

    +   - It has some fault tolerance. For example, if the printer jams and needs
    to be reset, the jobs in the queue should still print normally after the printer
    has been reset.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# Configuring the Printer


    At this point, we are going to assume that you have a relatively recent printer
    that is plugged in to your computer''s parallel port. We aren''t going to cover
    serial printers, which are relatively obsolete.


    The first thing you will want to do is set the parallel port mode.


    # Configuring the Parallel Port


    The lptcontrol program can be used to configure the mode of the parallel port.
    You will need to be logged in as the root user to do this. In its basic form,
    lptcontrol is run with an option that you wish to set on the port. The following
    options are supported:


    | Option | Description |

    |---|---|

    | -i | Sets interrupt driven mode |

    | -p | Sets polled mode |

    | -e | Sets extended mode |

    | -s | Sets standard mode (that is, turns off extended mode) |


    The option you will probably be most interested here is -e. If your printer supports
    an extended mode such as ECP or EPP, and you have this configured in your BIOS,
    you will want to turn this option on with the lptcontrol command. The following
    command shows how this is done:


    ```

    lptcontrol -e

    ```


    Basically, extended modes allow additional features to simple printing, such as
    allowing the printer to communicate back to the computer and inform the computer
    of error conditions such as paper jams or if it runs out of ink. In standard printer
    mode (that is, no extended mode), data can only be sent one way from the computer
    to the printer. The printer has no way to communicate back with the computer.


    By default, lptcontrol assumes the default printer port, which is /dev/lpt0 in
    FreeBSD. This will be the first parallel port on the system, which corresponds
    to LPT1 in Windows. If you have more than one parallel port, and this printer
    is not on the first one, you can use the -d option to specify a different port.
    For example, if you want to enable extended mode on the second parallel port,
    you could use the following command:


    ```

    lptcontrol -e -d /dev/lpt1

    ```


    Note that this setting will be lost when you reboot the system. If you want to
    have it maintained after each reboot, you need to add it to a system startup script.
    The best way'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'to do this is to create a file in `/usr/local/etc/rc.d` that contains the command.
    Note that the file will need to be executable in order for the command to actually
    be run. (To do this, use the chmod command—for example, `chmod 655 myprintscript`.)


    Now that you have configured the parallel port, you are ready to set up the printer’s
    spool directory, which is the directory on the hard disk where the printer stores
    print jobs waiting to be printed and also spools them to the printer.


    # Configuring the Print Spool Directory


    By convention, print spool directories are normally located in `/var/spool/lpd`.
    However, there is no rule that you have to put them here. Sometimes, you might
    want to put a spool directory somewhere else, such as if your `/var` partition
    doesn’t have enough space. For this example, we are going to assume that you are
    placing the spool directory in `/var/spool/lpd`. If this is not the case, simply
    replace this directory path with whatever directory you are putting the spool
    directory in.


    The first thing you need to do is decide on a name for the printer. You can call
    the printer anything you want. Later, you can also create aliases for the printer
    that allow you to access it using other names. Aliases are covered later in this
    hour under the section “The /etc/printcap File.” If you have multiple printers
    in a large office environment, of course, it makes sense to name the printer something
    that either says something about what kind of printer it is, or where it is located.
    In this example, assume that we are configuring an HP Laserjet printer. So we
    will call it laserjet.


    To create the spool directory for the printer, simply create a new directory in
    the `/var/spool/lpd` directory with whatever you have decided to name the printer.
    In this case, the following command will work:


    ```

    mkdir /var/spool/lpt/laserjet

    ```


    After you’ve created the directory, you will want to change the ownership and
    group membership so that they are both daemon and that only the user and group
    have any permissions on the spool directory. This will prevent users from snooping
    around the directory and looking at other people’s print jobs or possibly even
    deleting other people’s print jobs.


    The following command will set the ownership, group membership, and permissions
    to their proper values:


    ```

    chmod 770 daemon.daemon /var/spool/lpd/laserjet

    ```


    After you’ve set up the directory, you need to configure a text filter for the
    daemon.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# Configuring a Text Filter


    We briefly mentioned filters earlier in the hour. Basically, they are where the
    majority of the printing work is actually done. All data being sent to the printer
    passes through a filter first. The filter can do such things as convert the data
    from one format into a different one that the printer can understand.


    At a bare minimum, you will need a text filter. A text filter, as the name implies,
    is the filter used when the printer daemon receives simple plain text. Often times,
    the text filter is nothing more than a pass-through system that simply passes
    the raw data to the printer without doing anything to it. However, it can be as
    complex as a system that changes the data to a completely different format. (Later
    on, we will look at why you might need to change plain text to a completely different
    format.)


    Text filters can either be written by you or installed as a program that someone
    else has written. Before you panic at the idea of writing your own filter, basic
    filters are easy to write. For example, if your printer can receive raw text data
    and print it fine without making any changes to it, the following filter can simply
    be written in a text editor and saved to a file. It might be all that you need:


    ```

    ```sh

    #!/bin/sh

    /bin/cat && exit 0

    exit 2

    ```

    ```


    The preceding program is what is known as a shell script. The details of writing
    shell scripts are beyond the scope of this book, but we will cover enough of the
    basics for you to understand what the preceding filter does.


    The first line simply tells the shell which program it should use to interpret
    the rest of this file. In this case, it tells the shell that this file is a shell
    script and should be interpreted using the shell.


    The second line executes the cat program. Basically, in its simplest form, cat
    takes whatever it receives on STDIN (which is normally the keyboard) and echoes
    it to STDOUT (which is normally the screen). How does this help us with printing?
    Because for printing, STDIN and STDOUT are redirected. In this case, STDIN is
    the print data being sent from the spooler, and STDOUT is the printer port that
    the printer is connected to. So in this case, the cat program simply takes whatever
    it receives from the print spooler and echoes it to the printer port.


    The second part of the line, && exit 0, is a shorthand notation of saying basically,
    “Perform the exit 0 command if, and only if, the /bin/cat command completes successfully.”
    If cat does complete successfully, the shell script will exit with a status of
    0'
  merge: -1
  img_proc: true
- pgno: 174
  md: '(which indicates a successful execution of the command) and the third line
    of the script will not be executed because the exit command on line 2 will take
    effect.


    If on the other hand, the cat command fails (for whatever reason, it can''t send
    the data to the port or some other such error), the exit 0 command on line 2 will
    not be executed (because the "if and only if" test fails). In this case, line
    3 will be executed, which causes the shell script to exit with a status of 2.
    (Why exit status 2? Because lpd reads the exit status of the filter. A status
    code of 2 indicates that the filter failed with an unrecoverable error, and therefore
    informs lpd that it should not attempt to print the job again.)


    The filter can be named anything you want. In this case, we will assume that it
    is named if-text. By convention, print filters are stored in /usr/local/libexec.
    When you have saved the file, you need to make it executable so that the lpd program
    can run it. The following command is an example:


    ```

    chmod 555 /usr/local/libexec/if-text

    ```


    A simple filter such as this should work fine for printing plain text on most
    non-Postscript printers. However, Postscript printers can''t handle plain text.
    If you have a Postscript printer, you will need a slightly more complex setup
    that can convert the plain text into Postscript. This is covered in the following
    section.


    # Formatting Plain Text for Postscript Printers


    Postscript is a programming language for formatting text and graphics. It is device
    independent so that any printer that understands PostScript can print a PostScript
    document with no special drivers. PostScript is so common in the UNIX world that
    most UNIX applications can print PostScript output. Because of this, PostScript
    can be a very useful thing for your printer to have. However, one problem with
    PostScript printers is that they generally expect that everything they receive
    will be in PostScript format. As a result, you can''t send plain text data directly
    to a PostScript printer. Plain text must first be run through a filter that can
    convert the plain text to PostScript.


    The program a2ps, which is available in the print directory of the FreeBSD ports
    collection, is designed to do just that. After you have installed a2ps, you need
    to write a filter that can recognize if it is receiving PostScript or plain text,
    and then take the appropriate action. (Either send the data directly to the printer
    if it is already in PostScript format, or convert the data to PostScript and then
    send it to the printer if it is plain text.) Listing 9.1 is a sample filter that
    will do this.'
  merge: -1
  img_proc: true
- pgno: 175
  md: "# LISTING 9.1 A Sample Text Filter for PostScript Printers\n\n```\n```sh\n\
    #!/bin/sh\n# Simple filter for PostScript printers\n\nread header\nps_test=`expr\
    \ \"$header\" : '(../)'`\nif [ \"$header\" = \"%!\" ]\nthen\n  # File is PostScript.\
    \ Print pass through.\n  echo \"$header\" && cat && printf \"\\004\" && exit 0\n\
    \  exit 2\nelse\n  # File is plain text. Convert it first.\n  (echo \"$header\"\
    ; cat) | /usr/local/bin/a2ps && printf \"\\004\" && exit 0\n  exit 2\nfi\n```\n\
    ```\n\nLike the previous filter, this file should be saved in /usr/local/libexec.\
    \ The name if-ps might be a good choice. Also, remember once again to set the\
    \ file to executable so that lpd can run it. You can use the following command\
    \ to do this:\n\n```\n```\nchmod 555 /usr/local/libexec/if-ps\n```\n```\n\nWe\
    \ aren't going to go into detail about what this script does, but in a nutshell,\
    \ it checks to see if the first two characters of the file are %!. (PostScript\
    \ files start with these two characters.) If they are, the filter assumes that\
    \ the file is PostScript, and it gets passed directly to the printer. If they\
    \ are not, the filter assumes the file is plain text, and the data is passed through\
    \ the a2ps program to be converted to PostScript before being sent to the printer.\n\
    \nOf course, if you don't have a PostScript printer, you might have the opposite\
    \ problem. In other words, you need to print a PostScript document on a printer\
    \ that doesn't understand PostScript. In this case, you can use a program called\
    \ Ghostscript, which converts PostScript into a format that your printer can understand.\n\
    \n# Configuring a Ghostscript Filter\n\nAs mentioned previously, most UNIX applications\
    \ can output PostScript. Although some UNIX applications contain print drivers\
    \ for various printers, most of them do not. Instead, they just output PostScript.\
    \ Use the Ghostscript program, which is available in the FreeBSD ports collection\
    \ under the print directory, for converting the PostScript"
  merge: -1
  img_proc: true
- pgno: 176
  md: 'Ghostscript supports a lot of printers. A list (which might not be complete)
    of supported printers is available at www.cs.wisc.edu/~ghost/doc/printer.htm.


    The filter script for this is similar to the script for printing plain text on
    a PostScript printer—except that this time, the operations are reversed. This
    time, if the filter receives plain text, the text should be passed straight through
    without any formatting. On the other hand, if the filter receives PostScript,
    it should be sent to the Ghostscript program for conversion into an understandable
    format for your printer.


    The following script, taken from the FreeBSD handbook, works for an HP Deskjet
    500 (which cannot print PostScript directly).


    ```

    ```bash

    #!/bin/sh

    #

    # ifhp - Print Ghostscript-simulated PostScript on a DeskJet 500

    # Installed in /usr/local/libexec/hpif

    #

    # Treat LF as CR+LF:

    #

    printf ''\033&k2G'' || exit 2

    #

    # Read first two characters of the file

    #

    read first_line

    first_two_chars=`expr "$first_line" : ''\(..\\)''`


    if [ "$first_two_chars" = "%!" ]; then

    # It is PostScript; use Ghostscript to scan-convert and print it.

    #

    # Note that PostScript files are actually interpreted programs,

    # and those programs are allowed to write to stdout, which will

