  md: 'entire disk. Floppy disks don’t generally need this, but many CD-ROM drives
    do. You will generally want to use /dev/acd0c instead of /dev/acd0 to address
    a CD-ROM drive. If one name doesn’t work, try the other.


    # Formatting Disks


    Floppy disks and hard disks must be formatted before you can mount them. To format
    a floppy that has never been formatted before, use the fdformat command (noting,
    of course, that all its contents will be erased):


    ```

    # fdformat /dev/fd0

    Format 1440 floppy ''/dev/fd0''? (y/n):y

    ```


    After fdformat finishes formatting the disk, issue disklabel and newfs commands
    to complete preparing the disk for use with FreeBSD:


    ```

    # disklabel -w -r /dev/fd0 fd1440

    # newfs /dev/fd0

    ```


    Hard disks are more difficult to format and label from the command line. There
    are many more options you might want to set, including possibly partitioning the
    disk (which is done with a utility called fdisk). To format a hard disk, it’s
    best to use the sysinstall program. Refer back to Hour 2 for directions on how
    to use sysinstall to format and partition a hard disk.


    CD-ROMs don’t need to be formatted; if you have a CD or DVD burner, the process
    of writing data to the disc is coupled with the necessary formatting and labeling,
    and the resulting ISO 9660 filesystem type is compatible with all operating systems.


    # The mount Command


    Mounting a disk is done with the mount command. In its most common form, using
    mount is a simple and straightforward procedure. All that’s involved is picking
    a location somewhere in the directory tree to attach your disk, making sure that
    an empty directory is located there, and issuing the appropriate mount command.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '> Mount-point directories don''t actually have to be empty. You can use directories
    that have files in them; however, once you''ve mounted a disk onto them, you will
    no longer be able to access those files until you unmount the disk.


    Mounting a volume requires you to specify the device name of the disk (provided
    the disk is in the drive, in the case of removable disks) and the mount point,
    like so:


    ```

    ```

    # mount /dev/fd0 /mnt

    ```

    ```


    Done correctly, and assuming that no errors occur, there should be no output.
    You should be able to use the df command to see if it worked:


    | Filesystem | 1K-blocks | Used | Avail | Capacity | Mounted on |

    |---|---|---|---|---|---|

    | /dev/ad0s1a | 128990 | 74314 | 44358 | 63% | / |

    | /dev/ad0s1f | 8027666 | 1990866 | 5394606 | 27% | /usr |

    | /dev/ad0s1e | 257998 | 30586 | 227694 | 14% | /var |

    | procfs | 4 | 4 | 0 | 100% | /proc |

    | /dev/fd0 | 1424 | 1128 | 296 | 79% | /mnt |


    The last line shows the /dev/fd0 device, the floppy disk, mounted at /mnt. Success!
    You can now use ls /floppy to see the disk''s contents and copy files back and
    forth to and from the disk''s filesystem.


    # Mounting Non-UFS Filesystems


    Using mount by itself will work with native FreeBSD disks—hard disk partitions,
    FreeBSD-formatted floppies, and so on. But as often as not, in this world of interoperability
    between operating systems, the disks you will want to mount are not in the native
    UFS/FFS format. Common disk types you will encounter include MS-DOS floppy disks
    (from Windows machines), Linux Ext2/FS hard disks, and ISO 9660 CD-ROMs.


    The mount command has a -t switch; this controls what filesystem type the disk
    in question is. If you read through man mount, particularly the "See Also" section
    at the end, you will see a list of commands of the form mount_XXX (where XXX is
    the name of a filesystem type—for example, msdosfs, mfs, ext2fs, smbfs, and so
    on). Each of these filesystem names can be used with the -t switch on mount; or,
    if you prefer, you can use these special mount_XXX variants. For example, the
    following two commands are equivalent:


    ```

    ```

    # mount -t msdos /dev/fd0 /floppy

    # mount_msdos /dev/fd0 /floppy

    ```

    ```'
  merge: -1
