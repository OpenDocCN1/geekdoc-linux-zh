- pgno: 435
  md: 'WINE is available in the FreeBSD ports collection if you want to play with
    it, but its use is beyond the scope of this book. (Note that WINE actually stands
    for WINE Is Not an Emulator. The GNU people seem to love recursive acronyms.)


    # IRC Channels


    IRC is a near real time chat network where you can interact with other users in
    forums. I say near real time because lag times on IRC can often be somewhat high
    (as in there is a delay between the time you send your message and the time that
    others actually get it).


    Here are some IRC channels of interest to FreeBSD users. Note that there are different
    networks of IRC channels. In order to log in to one of these channels, you must
    be logged in to a server for the correct network.


    +   - EFNet: #freebsdhelp

    +   - Undernet: #freebsd


    For Windows, a good IRC client is Mirc. For X Windows in FreeBSD, you might like
    X-Chat, which is available in the irc category of the FreeBSD ports tree.


    Like the USENET newsgroups and mailing lists, it''s important to remember that
    no one on IRC is paid to help you, so once again, be courteous. These people are
    helping you in their free time. It is also important to remember that IRC lag
    times can sometimes be high and that some people might be logged in to the channel
    but doing other things and not currently actually watching the IRC channel. Because
    of this, if you don''t get an answer right away, don''t assume that people are
    ignoring you. They probably aren''t. They probably just haven''t seen your message
    yet.'
  merge: -1
