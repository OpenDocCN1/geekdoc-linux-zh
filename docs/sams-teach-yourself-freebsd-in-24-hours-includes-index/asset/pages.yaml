- pgno: 357
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_357_0.png)


    # Hour 21


    # Multimedia in FreeBSD


    Although it is still not nearly up to par with Windows and Macintosh, multimedia
    support in FreeBSD is getting better. For example, today FreeBSD supports most
    popular sound cards, and thus can play back MP3s, audio CDs, and so on. In this
    hour, you will learn:


    +   - How to configure sound support in FreeBSD

    +   - Various applications available for playing media files in FreeBSD

    +   - How to burn (record) CDs in FreeBSD

    +   - How to play video files in FreeBSD


    # Configuring Sound Support in FreeBSD


    To add sound support for FreeBSD, there are two things you have to do. The first
    is recompile the kernel with the sound device in it since it is not included by
    default. The second is to make the device nodes for the sound system. See Hour
    10 for details on how to configure the kernel and build a new one. The line you
    need to add to the kernel configuration file in order to support sound is


    ```

    device pcm

    ```'
  merge: -1
  img_proc: true
- pgno: 358
  md: 'The pcm device supports most common sound cards and can also detect where most
    of them are located.


    After you have added the pcm device to the kernel configuration and rebuilt the
    kernel, you need to create the device nodes for sound support. This is very simple
    to do. As the root user, change to the /dev directory (use the command cd /dev),
    and then type the following command exactly as shown:


    ```

    ./MAKEDEV snd0

    ```


    Remember that FreeBSD is case sensitive, so make sure that you type it exactly
    as shown. This will create the necessary device nodes for accessing the sound
    card. In general, you don’t need to worry about this because you don’t interact
    with these device nodes directly. They are simply used by the sound applications
    to send data to the sound card. However, you do need to make sure that the sound
    device nodes exist.


    # Sound Applications


    After you have finished configuring sound support in FreeBSD, you are ready to
    look at some applications for playing sounds in FreeBSD. Of course, one of the
    most common things that people want to do is play MP3 files. Yes, there are several
    options for playing MP3s in FreeBSD, including both command line and graphical
    MP3 players.


    # mpg123


    mpg123 is a popular, no frills command-line MP3 player. It is available in the
    FreeBSD ports collection under the Audio directory.


    After mpg123 has been installed, you can play MP3s with it by simply typing mpg123
    followed by the name of the MP3 file that you want to play. You can also provide
    a list of MP3 files, and mpg123 will play them in the order listed. The program
    also accepts wildcards. For example, mpg123 *.mp3 will play all the MP3 files
    located in the current directory. For more information on the features of mpg123,
    see its man page.


    # XMMS


    XMMS is a popular MP3 player for X. It is basically a clone of Winamp, and, in
    fact, it even supports the use of Winamp skins. Figure 21.1 shows the Winamp MP3
    player.


    XMMS is available in the ports collection under the Audio directory.'
  merge: -1
  img_proc: true
- pgno: 359
  md: 'FIGURE 21.1

    The XMMS MP3 player. Windows users who have used Winamp in the past will not have
    any problem getting used to XMMS.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_359_0.png)


    # CD Player


    KDE also comes with a CD player. The CD player supports the CDDB system, which
    means that it can automatically download album and track information from the
    Internet. Figure 21.2 shows the KDE CD player.


    FIGURE 21.2

    The KDE CD player.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_359_1.png)


    # Mixers


    FreeBSD comes with a mixer that can be accessed from the command line. To simply
    display the current mixer settings, just type mixer at the command prompt, and
    press Enter. Here is some sample output from the mixer command:


    ```

    Mixer vol   is currently set to 90:90

    Mixer bass  is currently set to 75:75

    Mixer treble is currently set to 75:75

    Mixer synth is currently set to 75:75

    Mixer pcm   is currently set to 75:75

    Mixer speaker is currently set to 75:75

    Mixer line  is currently set to 75:75

    Mixer mic   is currently set to 32:32

    Mixer cd    is currently set to 75:75

    Mixer mix   is currently set to 0:0

    Mixer igain is currently set to 75:75

    Mixer ogain is currently set to 75:75

    ```


    To change one of the settings, type mixer, followed by the name of the setting
    that you want to change, followed by a number from 1 to 100. For example, the
    command


    ```

    mixer vol 50

    ```'
  merge: -1
  img_proc: true
- pgno: 360
  md: 'will set the main mixer volume to 50%. If you want to set the left and right
    levels differently, use two numbers separated by a colon. For example,


    ```

    mixer vol 50:40

    ```


    sets the left volume to 50 and the right volume to 40.


    If you don’t like the command-line mixer, KDE also has a mixer built in to it
    that can be accessed from the Multimedia sub-menu of the K menu. Figure 21.3 shows
    the KDE sound mixer.


    FIGURE 21.3


    The KDE sound mixer.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_360_0.png)


    # CD Burning


    If you have a CD-R (CD Recordable) or CD-RW (CD Rewritable) drive, you can take
    part in what’s becoming the favorite multimedia pastime in today’s computer age:
    creating your own music CDs that are mixed however you like.


    CD burning in FreeBSD is still a command-line affair, however. The recordable
    optical drive you have installed is most likely an IDE/ATA drive; if so, the tool
    you will be using is burned. (If, however, you have a SCSI drive, you will need
    to use cdrecord; because SCSI burners are far less common these days than IDE
    burners, we will focus on burned in this hour’s lesson.)


    Unlike the process of creating data CDs, which we covered in Hour 8, “Storage
    Systems and Backup Utilities,” the creation of standard audio disc CDs doesn’t
    involve a two-step process. You don’t need to create an ISO disk image first using
    mkisofs. Instead, you can use the burned command directly to write audio files
    in WAV format onto the disc.


    First, convert the songs you want to burn into WAV format. You can use dagrab
    (available in the ports at /usr/ports/audio/dagrab) to rip audio tracks directly
    from audio CDs into WAV format. If your songs are in MP3 format, you can use the
    “Disk Writer” plugin—part of XMMS—to convert them to WAV format.'
  merge: -1
  img_proc: true
- pgno: 361
  md: '> Many audio CDs that are being published today have copy-protection features
    that prevent even legitimate owners of the discs from "space-shifting" the discs''
    contents onto other media, such as software MP3 players or recordable CDs. If
    you can''t rip audio from these discs using the dagrab utility, this is probably
    the reason.


    After you have converted all the songs you want to burn onto a CD into WAV files,
    you can use burned to write them all with a single command:


    ```

    # burned -f /dev/ac0c0 audio track1.wav track2.wav track3.wav fixate

    ```


    You can list as many files as you want on this command line, provided they don''t
    total more playback time than there is space on the disc. Bear in mind that CDs
    hold either 650MB or 700MB of data; if the WAV files you want to burn add up to
    more than that, you must remove some.


    The -f switch specifies the drive device; the fixate keyword tells burned to "close
    the session," meaning that after the process completes, the CD is completely burned
    and able to be mounted as a disk under FreeBSD or played in a standard CD player.


    You can also create "MP3 CDs," which can be played back in an increasing number
    of mainstream audio players (including some in-dash players in cars). An MP3 CD
    is simply a standard ISO 9660 CD-ROM that contains a number of compressed MP3
    files. You can fit some 12 times as many songs onto an MP3 CD as you can onto
    a regular CD, or more, depending on the compression level of your files.


    To burn an MP3 CD, you will need to follow the two-step procedure that you would
    normally use to create a data CD, as we discussed in Hour 8. First, use mkisofs
    to create an ISO disk image from the MP3 files stored in a particular directory:
    (/path/to/directory)


    ```

    # mkisofs -o diskimage.iso -J -R /path/to/directory

    ```


    This command will create an ISO 9660 disk image from all the MP3 audio files in
    the directory you specified; the -J and -R switches tell mkisofs to make the disc
    compatible with Windows (with the Joliet long-filename extensions) and with UNIX
    (with the Rock Ridge extensions). After the disk image is created, you can burn
    the CD using burned:


    ```

    # burned -f /dev/ac0c0 -s 4 data diskimage.iso fixate

    ```


    The -s 4 switch tells burned to burn at 4x speed; you can set this number higher
    if your drive supports higher speeds.'
  merge: -1
  img_proc: true
- pgno: 362
  md: '# Viewing MPEG Video Files


    FreeBSD has a number of tools available in the ports that can read MPEG video
    files; MPEG represents a fairly large proportion of the video content that''s
    available on the Internet today and because it''s an open standard with freely
    available codecs (unlike Windows Media Player and older versions of QuickTime),
    shareware tools that can read MPEG files are plentiful.


    Probably the best bet for viewing most modern MPEG files is mpeg2play, which is
    available in the ports at /usr/ports/graphics/mpeg2play. This utility, which runs
    (naturally) under X, will play back both the MPEG-1 files that one usually finds
    online and MPEG-2 files which can be extracted (though usually illegally) from
    DVD discs.


    Running mpeg2play is fairly self-explanatory; simply feed it the name of a file
    to play:


    ```

    # mpeg2play myfile.mpg

    ```


    This will open the movie in a new window in your desktop environment, with controls
    available in another window.


    The mpeg2play port is rather old, however, and has not been updated in some time.
    Look in /usr/ports/graphics for other tools with mpeg in their names; new MPEG
    playback utilities might become available with time.


    # DivX Video Files


    Possibly the most common format on the Internet today for the openly traded video
    content that makes up most file-sharing traffic is DivX. This codec, usually embedded
    in Windows AVI files, is based on the emerging MPEG-4 standard and offers very
    good compression rates while preserving good quality. The codec is developed by
    volunteers whose Web site is at http://www.divx.com.


    To play back DivX content, you will need to install linux-divxplayer. This program
    is available in the ports in /usr/ports/graphics/linux-divxplayer. It operates
    using FreeBSD''s built-in Linux compatibility mode; although programs written
    for Linux usually pose no problems to FreeBSD, some applications that are heavy
    on graphics, sound, or other intensive device manipulation—which indeed describes
    DivX video—might cause some instability. Be aware that this might be the case,
    particularly considering that at the time of this writing, the version of linux-divxplayer
    is only 2.0.1!


    After installing the linux-divxplayer port, which will install a few related dependency
    ports, you will be able to open DivX AVI files as follows:


    ```

    # divxPlayer myfile.avi

    ```


    Enjoy!'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# Playing DVDs


    It used to be only a pipe dream that users could watch DVD video discs under Linux
    or FreeBSD; however, this is no longer the case, thanks to the developers of a
    program called Ogle.


    The first thing you need in order to run Ogle, naturally, is a DVD drive. FreeBSD
    will recognize most common IDE/ATA DVD drives as /dev/acd0, just as with regular
    CD-ROM drives.


    Armed with this equipment, all you should need to do is install the Ogle port,
    which includes its GUI, available at /usr/ports/graphics/ogle-gui. (This port
    implicitly installs the command-line /usr/ports/graphics/ogle port.) Once this
    is done, type ogle to start up the Ogle GUI.


    With the DVD you want to watch in the drive, use the menu command Open to open
    the device /dev/acd0. (You can also use the Open dialog to open the contents of
    a VIDEO_TS folder, if you have copied the contents of a DVD to your hard drive,
    by specifying /path/to/VIDEO_TS as the target.) You might also be able to use
    the Open Disc menu command, which will automatically open the DVD in the drive
    without your having to specify the device name.


    Ogle has many features that you are probably accustomed to using in standard DVD
    players, including menus, full-screen mode, title/chapter search, and a number
    of high-quality audio formats. However, a few features are missing at this time,
    such as the ability to seek back and forth through the video with a slider, and
    reverse playback. Ogle will undoubtedly continue to evolve however; and in the
    meantime, the basics ought to work quite well.


    # Summary


    In this hour, you learned how to configure sound support in FreeBSD by adding
    the pcm device driver to the kernel, and also creating device nodes for sound
    support. We then looked at a small sample of the sound applications available
    for FreeBSD.


    Multimedia hardly stops with sound playback, however; and so we looked at the
    basics of CD burning, MPEG and DivX video playback, and DVD playback—all features
    that are central to multimedia as we are accustomed to it today.'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# Q&A


    **Q** FreeBSD doesn''t support my sound card. What can I do?


    **A** All may not be lost. There is a third-party vendor that makes sound drivers
    for FreeBSD. You can check them out at `www.opensound.com`. These sound drivers
    support more cards than the native FreeBSD drivers. The drivers are not free,
    but the cost might be worth it if they are the only way you can get sound support
    working in FreeBSD.


    **Q** I have a SCSI CD burner. The burned utility doesn''t seem to work.


    **A** That''s because SCSI drives need to use the `cdrrecord` utility, not `burned`.
    Install it from `/usr/ports/sysutils/cdtools`; then, refer to the man `cdrrecord`
    page for details on using it, or refer back to Hour 8 when we discussed it in
    the context of storage systems.


    **Q** MPEG video files don''t seem to have any sound, or the sound behaves very
    oddly.


    **A** MPEG is rather odd, as a format, in that its video and audio tracks are
    “multiplexed”—they don''t exist as separate tracks, but instead are woven together
    in a way that often confounds playback software. You might try the `splitmpg`
    port (`/usr/ports/graphics/splitmpg`) to separate out the audio and video tracks,
    and then play them back through separate utilities at the same time. This can
    have very odd results, though, such as the audio and video playing back at slightly
    different speeds.


    **Q** Ogle crashed my machine!


    **A** DVD playback is a very device-intensive process; support for DVD drives
    is still quite new in FreeBSD, and there is bound to be some instability as complete
    functionality for playing back DVD content is integrated into the system. Keep
    an eye on the FreeBSD mailing list (such as `freebsd-stable` or `freebsd-current`,
    either of which you can subscribe to by sending a message to `majordomo@freebsd.org`),
    and watch for others posting questions or reporting similar problems. The more
    people who use FreeBSD to watch DVDs, the more pressure there will be on the developers
    to make it stable.


    **Q** My DVD of The Matrix won''t play properly.


    **A** This is to be expected; certain DVDs won''t even play properly in many hardware
    DVD players! As Ogle continues to develop, it will likely support more and more
    advanced playback features. As it is, however, your best bet is to trust it only
    with the more bare-bones DVDs in your collection.'
  merge: -1
  img_proc: true
