    full-featured desktop environment is GNOME, although there are others with similar
    scope and maturity. GNOME can be installed in the standard FreeBSD installation
    program (sysinstall), but other less comprehensive window managers must be installed
    individually from the packages or ports. We will look at some of them in the next
