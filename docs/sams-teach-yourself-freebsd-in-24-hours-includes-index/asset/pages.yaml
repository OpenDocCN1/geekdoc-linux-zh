  md: 'With this share enabled, a client will see a share called my-public at the
    top level of the server''s share listing. However, unless the user is authenticated
    and is a member of the UNIX group staff, the files in the share will be read-only.
    Remove the write list line to make the share writable by all users. Note that
    writable = yes is equivalent to saying read only = no.


    By default, a [homes] share is defined and enabled; this special share is built-in,
    allowing access to each user''s home directory on the Samba server if the Windows
    client connects to it with the proper credentials.


    ```

    [homes]

    comment = Home Directories

    browseable = no

    writable = yes

    ```


    Because this share is set as not browsable, home directories not owned by the
    client user are not displayed; if a client connects as a valid user with a home
    directory on the Samba server, his home directory (labeled with his username because
    that''s the name of the directory in UNIX) appears as one of the available shares.
    No other users'' home directories appear.


    # Sharing Printers


    Like [homes], [printers] is a special share that behaves a little differently
    from regular shares. Under FreeBSD, all attached printers defined in /etc/printcap
    are available to Samba users. Chapter 9, “The FreeBSD Printing System,” explains
    how to set up your FreeBSD machine to support local printers in /etc/printcap.


    By default, the [printers] share is set up like this:


    ```

    [printers]

    comment = All Printers

    path = /var/spool/samba

    browseable = no

    # Set public = yes to allow user ''guest account'' to print

    guest ok = no

    writable = no

    printable = yes

    ```


    Set browseable = yes to allow connected users to see and use your printers.


    As stated in the embedded comment, you can make your printers public so that anyone
    on the network can use them. This involves the use of a guest user, which you
    can set up using share-level security. Note that public is a synonym for guest
    ok, so you would change the guest ok line to yes instead of adding a public =
    yes line to allow the'
