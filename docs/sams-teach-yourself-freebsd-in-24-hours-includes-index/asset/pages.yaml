- pgno: 199
  md: '# Hour 11


    # Updating FreeBSD


    Like all other operating systems, new versions and updates of FreeBSD are released
    on a periodic basis. These updates and new versions are necessary for several
    reasons. Some of these reasons include


    +   - Patching security problems that are found.

    +   - Keeping up with advances in technology.

    +   - Adding support for new hardware.


    Minor upgrades to FreeBSD are released fairly often (usually around every three
    months or so). Major versions (for example, FreeBSD 5.0 versus FreeBSD 6.0) are
    released, on average, once every year or so. With FreeBSD, you can update your
    system as often as you wish without ever having to buy another CD. Updates can
    be downloaded from the Internet. In this hour, you will learn


    +   - Why there are two different FreeBSD source trees, their differences, and
    how to decide which one to use.

    +   - How to prepare your system for an upgrade.

    +   - How to update your FreeBSD sources using the cvsup program.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   - How to use "make world" to rebuild your system from the updated sources.

    +   - How to recover if something goes wrong.


    # The Two FreeBSD Source Trees


    With Windows and Macintosh, you generally only have one choice for updating your
    system. You simply go to the store and purchase the new upgrade to Windows or
    MacOS and then install it on top of the existing version. (Or in some cases, you
    download a patch from the Internet or use an automatic update program such as
    that included with more recent versions of Windows.)


    With FreeBSD however, you always have to upgrade options available to you. One
    of the options is called STABLE and the other option is called CURRENT.


    # What Is a Source Tree?


    A source tree is the set of source code files that make up the operating system.
    Source code files are just plain text files that contain the programming code
    written by the FreeBSD programmers. These source code files are read by the FreeBSD
    C compiler and converted into machine code that can be read by the computer. Ultimately,
    the entire operating system is built out of the source code from one of the source
    trees.


    # The Difference Between STABLE and CURRENT


    STABLE and CURRENT are the two different source trees of FreeBSD that you can
    use to upgrade your system.


    # CURRENT


    CURRENT was a very poor choice of names for one of the trees because it is rather
    misleading. CURRENT is not the current released version of FreeBSD. Rather, it
    is the tree in which programmers are actively developing the next version of FreeBSD.
    Basically, CURRENT can be thought of as the development version of FreeBSD. The
    CURRENT source tree is constantly changing as new features are added, broken code
    is fixed, and so on.


    It is not uncommon for the CURRENT tree to be broken. In other words, it cannot
    actually be used to build a working operating system. It is also not uncommon
    for someone to accidentally check broken code into the CURRENT tree. This means
    that CURRENT can literally be usable one minute, broken the next minute, and a
    few minutes later, it is usable again after someone figures out that broken code
    was checked into the tree.'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'CURRENT is also a testbed for new features that will eventually end up in the
    production version of FreeBSD. Often, these features are buggy in CURRENT. Also,
    they are often poorly documented at best, and completely undocumented at worst.


    As you might have guessed by now, CURRENT is not intended to be used by the average
    FreeBSD user. Rather, it is intended to be used by programmers and developers.


    CURRENT should definitely not be used on a production system because of its potential
    instability with new features that have not been tested well. If you want to play
    with the latest gizmos and gadgets in FreeBSD, and thus you want to run CURRENT,
    it is very important that you are subscribed to the FreeBSD-CURRENT mailing list.
    This list will contain announcements of when CURRENT is broken, as well as advance
    warning of new features being added that will likely cause things to break or
    become very unstable. Most readers of this book will probably want to shy away
    from CURRENT and look at STABLE instead.


    # STABLE


    The STABLE tree is where patches and upgrades are made to the current production
    version of FreeBSD. Although it does change on a regular basis as patches are
    made and such, it does not change as often as CURRENT. Of course, people do make
    mistakes, so it is still possible that the STABLE tree can be broken at any given
    time. But it is far less likely to be broken because any code that gets checked
    into STABLE has been thoroughly tested and debugged in CURRENT. STABLE usually
    contains the latest security patches and bug fixes since the last RELEASE was
    made.


    That brings up another issue. There are two other versions of FreeBSD that can
    be run. One of them is RELEASE and the other is SNAPSHOT.


    # RELEASE Versions of FreeBSD


    A RELEASE is an official FreeBSD version that has been released as an ISO, and
    thus is available on CD-ROM or DVD-ROM. It can also be installed over a network
    via FTP. As mentioned previously, minor RELEASES are generally made every few
    months, and major RELEASES are generally made on a yearly or semi-yearly basis.
    Unlike a RELEASE, STABLE and CURRENT versions of FreeBSD cannot be directly installed
    from a CD or via FTP. If you want to run a STABLE version, you first need to install
    a RELEASE version and then update to STABLE using the procedures that will be
    described in this hour.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '> What was said previously about not being able to install STABLE or CURRENT
    directly is not entirely true. It is possible to create a custom RELEASE based
    on either STABLE or CURRENT. The custom RELEASE can then be used to make a CD-ROM
    that will allow STABLE or CURRENT to be installed directly. However, creating
    a custom RELEASE is an advanced topic that is beyond the scope of this book.


    > One thing that is important to note about RELEASE is that it will not have all
    the latest security patches and such installed. In other words, a fresh install
    from a CD-ROM could have security holes that were not discovered until after the
    RELEASE was made. STABLE will have the patches.


    # SNAPSHOT Versions of FreeBSD


    Occasionally, during the FreeBSD development process, when the CURRENT tree is
    relatively stable, a SNAPSHOT of CURRENT will be made. This snapshot can be downloaded
    as an ISO and burned on to a CD-ROM. It can often also be purchased from various
    sources on CD-ROM. This allows you to install CURRENT directly, as well as gives
    you a version of CURRENT that is about as stable as CURRENT can be.


    > Current SNAPSHOTS that are released on CD-ROM are usually relatively stable.
    However, they should still not be considered suitable for production servers because
    they are still development versions of FreeBSD that have not been extensively
    tested.


    # Updating Your Source Tree


    After you have decided which version of FreeBSD you want to update to (which is
    probably STABLE), you need to prepare your system for the update. The first thing
    you need to do is to cvsup your existing FreeBSD source tree so that it matches
    the source tree of either STABLE or CURRENT. For the rest of this hour, we are
    going to assume that you are updating to STABLE.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# What Is cvsup?


    cvsup is a client program that works with the CVS system. CVS is basically a system
    for managing the source code of programming projects. The cvsup program will connect
    to one of the FreeBSD servers that contains the most recent source code for STABLE,
    and it will compare each source code file on your system with the same file on
    the server. If your file is different, it will be updated to match the file on
    the server. In addition, if any files are on the server that do not exist on your
    system, they will be created on your system.


    # Using CVSup


    The CVSup program is not installed by default with FreeBSD. However, if you have
    worked through Hour 6, "Adding and Removing Third-Party Software," and have updated
    your ports tree, you already installed CVSup. The CVSup program used here is the
    same one used to update the ports tree.


    If you have not already installed CVSup, it is available as a port in the /usr/ports/net
    directory. It can also be downloaded as a prebuilt binary package. If you do not
    know how to install the CVSup program or how to download a package or build a
    port, see Hour 7, which contains instructions for installing new software in FreeBSD.


    Once CVSup has been installed, make a copy of the sample supfile, which is located
    in /usr/share/examples/cvsup. A reasonable place to copy the file to is /usr/local/etc.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_203_0.png)


    > An easier way to build a supfile is to use the cvsup-with pseudo-port, located
    at /usr/ports/net/cvsup-with. Type make and then make install, and you will be
    guided through a menu-driven interface in which you select your desired source
    tree, CVSUp server, and other options. The port will then create /etc/cvsupfile
    based on your options and even offer to run CVSUp for you for the first time.
    (After that, though, you''re on your own.)


    # Editing the CVSup Configuration File


    Open the configuration file in your favorite text editor. You won''t have to edit
    very much of it because the default options will usually work. However, there
    are a few things you need to change.


    The first thing you need to do is specify which version of FreeBSD you want to
    update to. This is done with the *default* tag= line in the file. What follows
    the equals sign determines which version of FreeBSD your source code will be updated
    to.'
  merge: -1
  img_proc: true
- pgno: 204
  md: "You will probably want to update to the latest version of STABLE. If 5.0 is\
    \ the current RELEASE, the tag you want to use is RELENG_5. So the line should\
    \ look like this:\n\n```\n*default tag=RELENG_5\n```\n\nThis will synchronize\
    \ your source code with the STABLE tree. Unlike periodic packaged updates that\
    \ you might be familiar with for Windows or Macintosh, updating to STABLE can\
    \ be done at any time. Announcements are not made when STABLE is updated because\
    \ it is updated on a very regular basis (often daily). This does not mean that\
    \ you have to update your system every day because most of the updates done to\
    \ STABLE are minor bug fixes that won’t affect most people anyway.\n\n![](img/ba0161b65b37e94cffc801ecbacaba5e_204_0.png)\n\
    \n> When security problems are found with FreeBSD, announcements will be made\
    \ on the FreeBSD-Security mailing list. It is a good idea for all FreeBSD users\
    \ to be subscribed to this list. Often, the suggested solution to fix the problem\
    \ will be to update to FreeBSD STABLE. This is about the closest you will get\
    \ to an announcement that STABLE has been updated.\n> \n> Subscribe to the mailing\
    \ list by sending a message to majordomo@freebsd.org, with the body being the\
    \ single line:\n> \n> `subscribe freebsd-stable`\n\nIt is also possible to specify\
    \ that you want to update to a specific RELEASE. This is more like the traditional\
    \ upgrade system you are used to with Windows or Macintosh. These source trees\
    \ are fixed and are not changing like STABLE.\n\nTags for specific versions of\
    \ FreeBSD contain the word “RELEASE” in them. For example, the line to specify\
    \ that you want to update your source to 5.0 RELEASE is\n\n```\n*default tag=RELENG_5_0_0_RELEASE\n\
    ```\n\nNote also that a third number is in this one. If the most recent RELEASE\
    \ of FreeBSD is 5.0.1, this would be RELENG_5_0_1. If the most recent RELEASE\
    \ is FreeBSD 5.1, it would be RELENG_5_1_0, and so on. Basically, the third number\
    \ has to be present to specify that you want to update to a specific RELEASE,\
    \ even if the third number is 0. The RELEASE suffix is also required.\n\nTo obtain\
    \ a current list of the RELEASES that you can update to through CVSup, see the\
    \ following Web page:\n\nhttp://www.freebsd.org/doc/en_US.IS08859-1/books/handbook/cvs-tags.html"
  merge: -1
  img_proc: true
- pgno: 205
  md: "> Updating to the latest RELEASE version does not ensure that the latest security\
    \ patches will be installed on your system. As mentioned previously, security\
    \ problems that were discovered after the RELEASE was made will not be incorporated\
    \ into the RELEASE, but will be inserted into STABLE. The RELEASE is fixed and\
    \ does not change after it has been made.\n> \n> The best policy is to use tag\
    \ names such as RELENG_5_0 or RELENG_4_6; this will give you the most recent STABLE\
    \ sources on those branches, finalized to a specified point-release level. For\
    \ example, a system synchronized to RELENG_4_5 might have a version string of\
    \ 4.5-RELEASE-p17.\n\nA special tag can also be used that is a simple period (.)\
    \ The line *default tag= indicates that the CURRENT tree should be used for the\
    \ update. As stated before, this is probably not the tree that most users will\
    \ want to update with, so you probably won't want to use the period with the tag.\n\
    \n> You will notice that you can cvsup to older versions of FreeBSD. For example,\
    \ at the time of this writing, RELENG_4_3 is still available and is still being\
    \ maintained to a certain extent. (Security patches and critical fixes will be\
    \ applied to it.) Although FreeBSD will let you do it without complaining, cvsupping\
    \ backwards to a lower version number than you are currently running is generally\
    \ a bad idea because it could cause things to break and the system not to work\
    \ correctly.\n\nThe other line you will want to change is the *default host= line.\
    \ This line controls where FreeBSD will obtain the new source code from. A list\
    \ of available servers can be found at the bottom of the following Web page:\n\
    \n```\nhttp://www.freebsd.org/doc/en_US.IS08859-1/books/handbook/cvsup.html\n\
    ```\n\nNormally, you will want to choose the server closest to you. However, if\
    \ it is too busy and is rejecting your connection attempts, you can choose a different\
    \ one.\n\nThe other relevant line in the file is src-all. Make sure that this\
    \ line is not commented out. This will cause all source files to be obtained,\
    \ which is normally what you will want if you are doing an update.\n\nAfter you\
    \ have finished editing the file, save the file and exit the text editor."
  merge: -1
  img_proc: true
- pgno: 206
  md: '# Running CVSup


    To start the cvsup process, make sure that you have an Internet connection available,
    and issue a command similar to the following:


    ```

    cvsup supfile

    ```


    supfile is the name of the configuration file that you just finished editing.
    If you did not name the file supfile, replace this part of the command with whatever
    name you gave the file.


    This will start the cvsup process. The client will try to connect to the CVSsup
    server specified in your supfile; if the server is overloaded, as happens from
    time to time or with certain servers, it will pause and try again several minutes
    later, with the spacing between subsequent attempts growing larger and larger
    each time. You might want to cancel the process (press Ctrl+C) and edit the supfile
    to specify a different CVSsup server (just try a higher number, for example cvsup9.freebsd.org).


    Depending on the speed of your Internet connection and on how many changes have
    been made to the source tree since the last time you CVSsupped, the process could
    take anywhere from a minute or two, to a few hours. CVSsup only updates the files
    that have changed since the last time you ran cvsup. Because of this, updates
    are usually fairly quick since you do not have to download an entirely new version
    of FreeBSD. You only have to download those parts that have changed.


    After the cvsup process has finished, you will be returned to the command prompt.
    At this point, you have a freshly updated source tree. However, the updates have
    not yet been installed. We will get to actually installing the updates later in
    this hour. However, you should do several things before installing the updates.


    # The UPDATING File


    The first thing you should do after the cvsup process has completed is read the
    file /usr/src/UPDATING. This file will contain important information about any
    special considerations that you need to watch out for when updating using the
    source code you just downloaded. It includes information on potential problems
    and any special procedures that you need to follow to avoid them. If anything
    in UPDATING contradicts something you read here, you should follow the instructions
    for that particular thing in UPDATING rather than the ones given in this book.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# The /etc/make.conf File


    The /etc/make.conf file contains settings that the C compiler will use when rebuilding
    the system from the source code you just downloaded. Another file, called /etc/defaults/make.conf,
    contains the default options that the C compiler will use. However, you do not
    want to make any changes to the /etc/defaults/make.conf file. Instead, make the
    changes to /etc/make.conf (creating it yourself if it does not already exist,
    as is the case in the default installation). This file will override the defaults
    given in /etc/defaults/make.conf. For most people, adding the following two lines
    to /etc/make.conf should suffice:


    ```

    CFLAGS= -O pipe

    NOPROFILE= TRUE

    ```


    Note that the option after CFLAGS is a capital letter O and not a zero. This option
    tells the C compiler to apply certain optimizations when it compiles the code.
    The second line tells the compiler not to build profiled binaries. Profiled binaries
    are useful for debugging, but they also increase the size of the binary and reduce
    performance. So most users will probably want the NOPROFILE option set to TRUE.


    After you have made these changes, save and exit the /etc/make.conf file.


    # Updating Important Files


    In some cases, certain configuration files might need to be updated before the
    system upgrade is actually performed because certain new versions of FreeBSD might
    expect, for example, certain user accounts or groups to exist for system purposes.
    If these groups and accounts did not exist in earlier versions of FreeBSD, the
    update process can fail.


    The easiest way to upgrade these files is to use the program called mergemaster.sh.
    Start it with the -p option so that it only updates files that are important to
    the pre-upgrade. You don''t want to update the rest of the files yet. For example,


    ```

    mergemaster.sh -p

    ```


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_207_0.png)


    > It''s very important to back up your /etc directory before running mergemaster.
    Simply copy it to a new location, for example by entering cp -R /etc /etc.old.
    This way, if you accidentally overwrite a file in /etc, you can retrieve the old
    one with a minimum of pain.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Dealing with mergemaster is probably the most difficult part of the updating
    process. Basically, mergemaster compares the configuration file on your system
    with the new configuration file included with the updated source that you download.
    If the two files are different, mergemaster will let you know, show you the differences,
    and ask you what to do about them. After you have scrolled to the bottom of the
    mergemaster list, you will be given a menu of options:


    ```

    Use ''d'' to delete the temporary /etc/group

    Use ''l'' to install the temporary /etc/group

    Use ''m'' to merge the old and new versions

    Use ''v'' to view the differences between the old and new versions again


    Default is to leave the temporary file to deal with by hand


    How should I deal with this? [Leave it for later]

    ```


    The default option is to not make any changes to the file, and leave the new file
    in the directory /var/tmp/temproot. This way, you can examine the original file
    and the new file later on and decide which, if any, changes you want to incorporate.


    Here are what the other options do:


    +   - d—Deletes the new version of the file out of /var/tmp/temproot and leaves
    the current version that you are using untouched.

    +   - l—Copies the new version of the file from /var/tmp/temproot. Note that this
    replaces the current version you are using, so any customizations you made to
    the file will be lost.

    +   - m—Invokes a program that allows you to merge the two files visually by selecting
    which version of each line or group of lines you want (either the old one or the
    new one). It is generally easier to simply make a note of which files have changes
    and then go through them manually and decide which changes you want to incorporate.
    If you do decide to use the built-in merge utility invoked here (sdiff), you can
    get help at its command line by entering a question mark (?). This will show you
    the available commands for selecting the left version (old) or the right version
    (new).

    +   - v—Simply repeats the output and shows you the changes again.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_209_0.png)


    > Note that `/etc/group`, `/etc/passwd`, and `/etc/master.passwd` will always
    be flagged by mergemaster because of users and groups that you have added to your
    system, which makes these files different from the ones included with the source
    you downloaded. You should never choose the i option on these files because this
    will overwrite your existing files, which will cause your group and user databases
    to be lost. This, of course, can be disastrous, especially if you have a lot of
    users.


    # Rebuilding the System


    Now you are ready to rebuild the system. The best way to do this is to break it
    down into two steps so that the majority of it can be done without dropping into
    single user mode. This means that the system can continue to function normally
    throughout most of the build process.


    # Removing the Old Object Files


    The first thing to do is remove any old object files from previous builds. This
    is done by changing to the /usr/obj directory and using the following command:


    ```

    chflags -R noschg *

    rm -rf *

    ```


    The second command is one that you are familiar with, but the first one requires
    some additional explanation. This command removes the immutable flag from any
    files that might have it set. This flag protects files from accidental deletion
    or modification despite what the normal file permissions are set to. Even root
    cannot delete a file that has the immutable flag set until the immutable flag
    has been removed.


    The process of removing the object files can take several minutes. (There are
    a lot of them.) When it is done, you are ready to start the actual build process.


    # Building the World


    The first thing you want to do is start a log file that will log all compiler
    messages generated during the build process. This can be useful for troubleshooting
    problems later on if need be. The log can be started with the following command:


    ```

    script /var/tmp/w.out

    ```'
  merge: -1
  img_proc: true
- pgno: 210
  md: 'The system should respond with "Script started, output file is /var/tmp/mw.out".
    Of course, you can use a different location for the output file if you want to.


    Once the script has been started, make sure that you are in the /usr/src directory
    and type the following command to start the build process:


    ```

    make buildworld

    ```


    This will invoke the C compiler and other necessary programs that will rebuild
    the entire operating system from the source code that you downloaded. (Hence,
    that''s why it is called "making the world.")


    This process will take quite some time, even on a fast system. On a slower system,
    it could take several hours. Feel free to go do something else while the make
    process is running because there is no need to watch it. It won''t ask you any
    questions or anything.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_210_0.png)


    > Recall that, in an earlier hour, you learned how to switch to another virtual
    terminal using the ALT keys plus the function keys. Feel free to switch to another
    terminal and continue working while the build process is running. It is safe to
    continue using the system during this process because no system files are actually
    being updated at this point. They are only being built and placed in a temporary
    location for later installation.


    If the buildworld process is interrupted—for example if you were running it from
    a remote terminal, and then you lost access, killing the process—nothing has been
    lost or corrupted. Go back into /usr/src and type make buildworld again. This
    might delete all the object files that had been compiled thus far, though, so
    don''t be too disappointed if you aren''t able to save any time this way.


    # Installing the New World


    After the build process has finished, you need to install the new world. Before
    you do this, however, you should reboot the system into single user mode because
    during this process virtually every file in the system will be updated. If these
    files are in use during this process, it could cause problems.


    To get into single user mode, you can use the following command:


    ```

    shutdown now

    ```'
  merge: -1
  img_proc: true
- pgno: 211
  md: 'This will kick everybody off the system and bring it down to single user mode.
    You might be asked to specify which shell you want to use. Simply press Enter
    to accept the default.


    Change to the /usr/src directory and run the following command to start the install
    process:


    ```

    make installworld

    ```


    This process will take a few minutes, but it won''t take nearly as long as the
    make buildworld process. When it is finished, you will be returned to the command
    prompt. However, you aren''t quite finished yet. You need to run mergemaster again
    to update the rest of the configuration files. The first time you ran mergemaster,
    you only updated files that were potentially essential in order for the world
    to build correctly. To run mergemaster and update the rest of the files, use the
    following command:


    ```

    mergemaster -v

    ```


    The -v option causes mergemaster to be more verbose about what it is doing. In
    the future when you run mergemaster, you might want to leave out the -v option,
    but the first couple of times you run it, use the -v option to help you become
    more familiar with how the command works.


    Once again, watch for any changes that you know you made to files because these
    will show up in mergemaster''s output. It is important that you do not select
    the i option in these cases because this will cause all of your customizations
    in the configuration file to be overwritten. Also, make sure that you especially
    watch out for changes made to the /etc/group, /etc/passwd, and /etc/master.passwd
    files.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_211_0.png)


    > If you wish, you can combine the make buildworld and the make installworld processes
    into the single command, make world. This command will perform the build and then
    automatically perform the install afterward. However, if you decide to do this,
    you should drop the system in to single user mode before issuing the make world
    command. This, of course, means that your system will be tied up in single user
    mode a lot longer than if you separate the two processes.


    # Building the New Kernel


    You need to do one more thing before you reboot the system: You need to build
    a new kernel to go along with the FreeBSD update you just installed. Kernel building
    was cov-'
