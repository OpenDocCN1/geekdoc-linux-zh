- pgno: 295
  md: '# More About X


    X is an accepted standard for a UNIX windowing system. Several distributions of
    X are available. The one included with FreeBSD is called XFree86, which is a freely
    available version of X intended for x86 (Intel and compatible) computers. The
    XFree86 project is developed by volunteers, and the programming source code for
    the system is available to those who want it. XFree86 runs on most UNIX operating
    systems including FreeBSD, Linux, Solaris, AIX, and so on. In addition, it runs
    on some non-UNIX systems such as OS/2. Some work has been done on a Microsoft
    Windows port of XFree86.


    > Although the 86 in XFree86 stands for the x86 hardware architecture, and this
    is what it was originally designed to run on, XFree86 has since been ported to
    several other platforms including the PowerPC platform (Mac OS X, AIX), and the
    SPARC platform (Solaris).


    Some technical things are important to note here. First of all, X and XFree86
    only provide a windowing framework for UNIX. They do not provide any functionality.
    Figure 16.3 shows the X Window system running by itself.


    FIGURE 17.3

    The X Window System running by itself

    Notice that the windows have no frames, no control buttons, and so on. In addition,
    they cannot be moved around.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_295_0.png)


    As you can see from the figure, X is not very useful by itself. To have a windowing
    system that is actually useful, a program called a window manager must be used
    along with'
  merge: -1
  img_proc: true
- pgno: 296
  md: 'X. Figure 17.4 shows the same applications as Figure 17.3 does; this time they
    are running with KDE (which we will talk about more in Hour 18).


    # FIGURE 17.4


    X running with KDE. The windows now have borders, control buttons, and can be
    moved around. There is also a menu at the bottom of the screen.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_296_0.png)


    Although it is important to know about the basic differences between X and the
    window manager, you usually don''t need to worry about them because they are transparent
    except when you are making configuration changes. On a general level, you can
    think of X as providing FreeBSD with a similar functionality to that of Microsoft
    Windows.


    # Configuring X


    Before you can use X (and before you need to worry about window managers), you
    need to configure it for use with your system. Configuring X involves telling
    the system about such things as what kind of video card your computer has, what
    kind of monitor it has, what resolution you want to use on your monitor, and the
    maximum number of colors you want to use.


    Most XFree86 configuration is controlled by the file /etc/X11/XF86Config. As with
    most configuration in FreeBSD, this file is a human readable plain text file that
    can be edited by hand. However, there is also a configuration program called xf86config
    that'
  merge: -1
  img_proc: true
- pgno: 297
  md: 'will ask you a series of questions and then automatically generate the /etc/X11/XF86Config
    file for you based on your responses.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_297_0.png)


    > Remember that FreeBSD is case sensitive. Thus, xf86config and XF86Config are
    not the same thing. Be careful not to confuse the two. xf86config is the program
    you run to assist you with configuring X Windows. XF86Config is the actual configuration
    file that controls how X behaves.


    # Required Information


    Before you run xf86config, you will need to gather the following information:


    +   - What type of video card you have

    +   - The amount of video memory it has

    +   - The maximum refresh rates that your monitor can support

    +   - What kind of mouse you have (USB, PS/2, and so on)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_297_1.png)


    Information on the video card, and sometimes also on the refresh rate your monitor
    is using, can often be obtained from the Windows control panel. Your monitor''s
    manual should also contain information on refresh rates.


    You should also be able to obtain information on the type of mouse your system
    has from the Windows control panel. However, here are some other pointers on determining
    which type of mouse you have (examples are shown in Figure 17.5):


    +   - If your mouse has a small, round connector, it is probably a PS/2 mouse.

    +   - If your mouse has a flat, rectangular connector, it is probably a USB mouse.

    +   - If your mouse has a large D-shaped connector with nine holes in it, it is
    a serial mouse.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_297_2.png)


    > It''s very important that you pay close attention to the maximum refresh rates
    that your monitor can support. There is a small chance that if you use values
    your monitor cannot support, you could actually damage your monitor. Most monitors
    have a built-in protection circuit that causes it to shut itself down if it receives
    a refresh rate higher than it can handle. Some older monitors won''t do this,
    however.'
  merge: -1
  img_proc: true
- pgno: 298
  md: 'FIGURE 17.5

    *Common types of mouse connectors.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_298_0.png)


    Chances are you have a PS/2 mouse or a USB mouse. Serial mice are becoming more
    and more obsolete these days.


    # Using xf86config


    To use the xf86config program, you must be logged in as root. Once you have become
    root, simply type xf86config at the command prompt to start the program. You will
    be given a short message explaining what the program does and asked to press Enter
    to continue, or Ctrl+C to abort. Go ahead and press Enter. Your screen will then
    look something like the following:


