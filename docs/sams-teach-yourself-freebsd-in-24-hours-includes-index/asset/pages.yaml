- pgno: 422
  md: '# Summary


    In this, the final hour of our course on FreeBSD, you learned how to turn your
    machine into a file-sharing server and client using a variety of protocols. You
    learned how to set up an FTP server, both for authenticated and anonymous users.
    You learned how to use NFS, sharing files back and forth over a networked filesystem.
    Finally, you learned how to set up a basic Samba configuration in order to communicate
    with Windows machines on a local network.


    Each of these protocols, particularly NFS and Samba, is a great deal more flexible
    than our coverage here indicates; if you find that you have the need and the desire,
    you will be able to extend your knowledge of these protocols to the point at which
    you can increase the performance and convenience (as well as the security) of
    your file-sharing mechanisms to whatever level you prefer.


    # Q&A


    Q What''s the point of using FTP to serve files? Why not just use HTTP?


    A HTTP has indeed supplanted much of the purpose for FTP''s existence, particularly
    in the case of large binary downloads (such as software archives). However, FTP
    has advantages in its dual-channel connection model (which allows it to operate
    through firewalls), its built-in user authentication, the ability to upload files
    and perform filesystem operations on the server, and the fact that its transport
    mechanism is tuned to support large binary files rather than small text/HTML files
    (as with HTTP).


    Q My /var partition is too small to hold a large public anonymous FTP archive.


    A You can create a location in another, larger partition to hold the content that
    would normally go into /var/ftp. For example, move the contents of /var/ftp to
    /usr/ftp, and then make a symbolic link there with the following command:


    ```

    ln -s /usr/ftp /var/ftp.

    ```


    Q Isn''t there a way to browse NFS shares on a local network?


    A There is, actually. A system called Service Location Protocol (SLP) is available
    to help machines on a LAN track each other''s NFS services. You can install OpenSLP
    (a free implementation of SLP) from the ports, at /usr/ports/net/openslp.'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# Q My NFS mounts sometimes freeze up; sometimes they take forever to come
    unstuck, and until then my terminal session is locked.


    A Make sure that you''re using the -i option when you mount NFS shares. This is
    usually not necessary on local networks; but if you''re mounting shares over the
    WAN, and the connection occasionally causes the mount to stall, the -i option
    might be your best bet.


    # Q How do I share files with Macintosh machines over AppleTalk?


    A You will want to install the netatalk port, located at `/usr/ports/netatalk`.
    Note that Mac OS X can use NFS and SMB to share files as well as AppleTalk.


    # Q Isn''t there a more user-friendly way to configure Samba?


    A There is a Web-based administration tool called SWAT, which is installed along
    with the Samba port. See Samba''s Web site (http://www.samba.org) for more information
    on how to use it. Be aware that because it has to be able to modify system configuration
    files and thus has to run as a privileged user, running SWAT opens up a number
    of potential security holes. These are documented in the package if you install
    SWAT; be sure to heed the cautions.


    # Workshop


    This interactive section is designed to solidify your understanding of FTP, NFS,
    and Samba with quiz questions, and to extend your horizons for the use of these
    tools through exercises.


    # Quiz


    +   1. What''s the default FTP server that comes with FreeBSD?

    +      A. WU-FTPD

    +      B. ProFTPD

    +      C. BSD ftpd

    +   2. What file do I add usernames to in order to prevent them from logging in
    via FTP?

    +      A. `/etc/ftpusers`

    +      B. `/etc/ftp/users`

    +      C. `/etc/ftpbanned`

    +      D. `/var/ftp/etc/ftpusers`'
  merge: -1
  img_proc: true
- pgno: 424
  md: '3. Which NFS mount option is used for "backgrounding" mount processes so that
    they don''t block the system?

    A. - i

    B. -b

    C. -T

    D. noauto


    4. What is the nmbd daemon used for?

    A. It does name services for Samba.

    B. It services incoming NFS connection requests.

    C. It services incoming Samba connection requests.

    D. It maps incoming RPC calls to an unused server port.


    5. What command is used to mount an SMB filesystem onto a FreeBSD machine?

    A. mount

    B. mount_nfs

    C. mount_smbfs

    D. mount -t smbfs


    # Quiz Answers


    1. The correct answer is C.

    2. The correct answer is A.

    3. The correct answer is B, though A is useful as well.

    4. The correct answer is A.

    The correct answer is either C or D.


    # Exercises


    1. You might find that the built-in FTP server in FreeBSD doesn''t suit your needs.
    You might want to do sophisticated per-directory access control, for example,
    or you might want to give users the capability to fetch Zip archives of whole
    directory trees on-the-fly. You can do this by installing alternate FTP servers
    such as ProFTPD and WU-FTPD; both are available in the ports, in /usr/ports/ftp.
    Try installing ProFTPD and seeing what benefits its configuration model provides
    you.'
  merge: -1
  img_proc: true
- pgno: 425
  md: '2. You can set up Samba to do a lot more than simply share files with peer
    Windows machines. You can use it to join your FreeBSD machine to a Windows domain
    or even to serve as a domain controller for a whole Windows network. Try creating
    a domain for your home network and subscribing various Windows machines to it
    if you have them handy. It''s not easy, but it''s a great skill to have if you
    can manage it!


    3. This chapter discusses the standard, built-in methods for sharing files inherent
    to UNIX and Windows. However, the form of file sharing that is getting all the
    press these days is the content-centric, peer-to-peer kind, which was pioneered
    by Napster and continues in dozens of different popular applications such as KaZaA,
    Morpheus, and Gnutella. Many of these applications are available for FreeBSD,
    either as a direct port or running through the Linux binary compatibility layer.
    In `/usr/ports/net`, you will find such ports as eDonkey, gtk-gnutella, LimeWire,
    and Mutella. Experiment with these if you''re interested in file sharing of the
    kind that keeps the RIAA up at night. Note that most of these clients require
    KDE or GNOME.'
