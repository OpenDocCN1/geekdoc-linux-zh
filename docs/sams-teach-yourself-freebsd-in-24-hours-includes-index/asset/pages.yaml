- pgno: 51
  md: '> Make sure that you remove the CD-ROM just after the system has shut down
    and before it has started to reboot. If you don’t, your computer will boot right
    back into the CD-ROM and, thus, back into the installation program. If this does
    happen, simply press the Restart button on your computer to restart it and then
    eject the CD-ROM as soon as your system starts to reboot.


    # Shutting Down the System After Reboot


    As the system reboots, you will see a flurry of messages go by. (If you chose
    a dual boot system, you will see a menu first asking you to press a function key
    to select which operating system you want to start. Simply press the one labeled
    FreeBSD.) Finally you should get a prompt that simply says:


    ```

    login:

    ```


    Enter the name root here and press Enter. You will then be asked for the password
    that you gave during the installation. After you have entered it, you will be
    left with a prompt that looks like the following:


    ```

    #:

    ```


    This means that FreeBSD is waiting for you to give it something to do. In this
    case, we are simply going to tell it to shut down. The proper way to do this is
    to use the shutdown command. Because we want the system to halt (we want to turn
    it off as opposed to restarting it), we will type the command as follows:


    ```

    shutdown -h now

    ```


    The details of this command are not important right now, and they will be covered
    in a later hour. For now, simply know that this command tells FreeBSD to halt
    now. When you see the message Press any key to reboot, it is safe to turn off
    your computer.


    > It is not a good idea to log in as the root user except when absolutely necessary.
    Root has special privileges that can allow it to cause serious problems if used
    incorrectly. As mentioned before, we will create a normal user account in the
    next hour.'
