    silent—This line tells the system to wait for Link Control Protocol (LCP) packets
    when initiating a connection. This is a useful performance tweak, though its meaning
    is esoteric.


    domain mysp.com—The domain name of your ISP should go here. (For example, if your
    ISP is EarthLink, replace mysp.com with earthlink.net.)


    defaultrroute—This means that a default route will be added to the routing table
    while the Internet connection is up. The route provides a way for you to send
    and receive traffic from the Internet.


    user foobar—This corresponds to a profile that we will create later in a different
    file that contains the login name and password for your ISP. foobar corresponds
    to the username that we will list in the other file.


    name foobar—The name option sets the name of the local machine to foobar for the
    purposes of authentication using the pap-secrets and chap-secrets files, which
    we will cover shortly.


    Once you have saved the options file, you next need to create the chat.script
    file that was referenced in the options file. Like the options file, chat.script
    should be located in the /etc/ppp directory.


    # Creating the Chat Script


    As stated previously, the chat.script file is what contains instructions telling
    FreeBSD how to connect to your ISP. Its primary function is to dial the phone
    number. Here is a sample chat.script file. In /etc/ppp, create a new file called
    chat.script in a text editor and enter the following text all on a single line:


    ```

    ABORT BUSY ABORT ''NO CARRIER'' '''' AT OK ATDT5551212 CONNECT ''''

    ```


    The syntax of this script is quite bizarre, but fortunately you probably won''t
    need to alter it very much (if at all). Translated to English, here is what the
    script is telling the modem:'
