- pgno: 150
  md: 'The directory names you see are short and cryptic—a far cry from the Program
    Files and Documents and Settings of Windows, and indeed from the Users, System,
    and Applications of Mac OS X. The meanings of these short names are often rooted
    in history and tradition, and many have lost their relevance. Table 8.1 lists
    the most important directories and explains what they are all used for. The symbols
    following each name are as they would appear in an ls -F listing, where / signifies
    a directory, @ a symbolic link to another item, and * an executable file.


    # Table 8.1 Key Elements of the FreeBSD Filesystem


    | Directory | Purpose |

    |---|---|

    | bin/ | Statically linked binaries are contained here. These can be used even
    when you''re doing an emergency boot and don''t have access to any dynamically
    linked programs or any filesystems other than /. |

    | boot/ | This directory contains the kernel, which is the master executable of
    the system. The kernel manages all the devices and handles networking, along with
    a host of other tasks. See Hour 10, "The FreeBSD Kernel and the Device Tree,"
    for more information. /boot also has configuration files and executables that
    are used during boot. |

    | compat@ | This is a symlink to directory structures that provide compatibility
    with other operating systems, such as Linux. |

    | dev/ | A special directory. Files in here are mostly devices, which are special
    file types that give programs an interface into any pieces of hardware that the
    kernel supports. |

    | etc/ | Long ago, this was merely a directory for random files that didn''t fit
    elsewhere. It is now where most systemwide configuration files go, including your
    user (password) databases and startup scripts. |

    | home@ | Possibly a plain directory; possibly a symbolic link to /usr/home, depending
    on your installation. All regular users'' home directories are contained here.
    |

    | mnt/ | An empty directory, provided for your convenience as a mount point if
    you need to mount another disk. |

    | modules/ | Loadable kernel modules are here. |

    | proc/ | The procs, or process filesystem. This is an interface to the process
    table. Used for convenience by some programs, but not essential to the operation
    of the system. (It can safely be unmounted.) |

    | root/ | The root user''s home directory. It''s not in /home for security reasons,
    and so that it will be available during an emergency boot. |'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# TABLE 8.1 continued


    | Directory | Purpose |

    |---|---|

    | sbin/ | System binaries that are statically linked. These programs differ from
    the ones in /bin in that they generally alter the system''s behavior, whereas
    the /bin programs are simply user tools. |

    | stand/ | Contains a set of hard-linked programs that provide a "mini-FreeBSD"
    environment during system installation and emergencies when running in standalone
    mode. The only program you will likely be interested in is sysinstall, which is
    covered in Hour 2, "Installing FreeBSD." |

    | sys@ | A link to the kernel sources if you installed them. |

    | tmp/ | Temporary files. Any user can write files into this directory. |

    | usr/ | The gateway to the rest of the system—dynamically linked programs, user
    files, and programs you installed yourself. It''s often referred to in the UNIX
    world as "userland" (although that term also can mean "anything that''s not directly
    handled by the kernel"). In upcoming hours, we will spend most of our time here.
    |

    | var/ | Variable files. These include runtime files used by programs, log files,
    spool directories, and other items that change with the normal operation of the
    system. |


    FreeBSD’s structure is tightly controlled, and the clearest rule that distinguishes
    FreeBSD from other UNIX platforms (which can be much more chaotic in structure)
    is that “Anything installed by the administrator goes into /usr/local.” Although
    other systems might allow user-installed programs the freedom to install files
    wherever they want, FreeBSD maintains strict structural guidelines in its ported
    programs and packages (see Hour 6, “Adding and Removing Third-Party Software”).
    Although a program might, by default, put its executables in /usr/bin, its libraries
    in /var/lib, and its configuration files into /etc, FreeBSD patches (modifies)
    the installation scripts so that the files would go into /usr/local/bin, /usr/local/lib,
    and /usr/local/etc, respectively. In fact, all configuration files for any software
    you might install will go into /usr/local/etc; and if the program installs a startup
    script to be launched on boot, the script is placed in /usr/local/etc/rc.d. Anything
    in that directory is run at boot time, after the scripts in the analogous /etc/rc.d
    (the base system’s startup scripts) are run.


    The advantage of a structure this carefully controlled is that a FreeBSD system
    is relatively easy to maintain and especially easy to re-create on a new machine
    (if you’re upgrading to new hardware, for instance). You could theoretically copy
    the entire /usr/local directory tree from one machine to another, and everything
    would work as on the previous machine. This is the ideal toward which FreeBSD
    strives, though in practice it’s not perfect.'
  merge: -1
  img_proc: true
