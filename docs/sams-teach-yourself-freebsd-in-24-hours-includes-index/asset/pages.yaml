- pgno: 311
  md: '# Hour 18


    # The K Desktop Environment (KDE)


    In the previous hour, you learned how to configure the X Window System to work
    with your hardware. In this hour, you will learn how to actually work with the
    X Window System using KDE (the K Desktop Environment).


    In this hour, you will learn:


    +   - What a desktop environment is

    +   - How to make KDE your default desktop

    +   - How to navigate in KDE

    +   - About the applets (mini-applications) available in KDE

    +   - How to manage files in KDE

    +   - How to customize your KDE desktop


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_311_0.png)'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# What Is a Desktop Environment?


    A desktop environment can be thought of as a window manager that has some additional
    features. Whereas a window manager generally provides basic functions such as
    simple menung systems, the ability to move and resize windows, and window controls
    such as minimize, maximize, and close, a desktop environment provides much more.
    Desktop environments provide additional features such as desktop icons, integrated
    file management, and a set of miniature applications. In addition, software applications
    written for the desktop environment tend to integrate well with the desktop, as
    well as being capable of taking on the configuration options of the desktop (color
    schemes and so on).


    The desktop environment is what has brought the UNIX desktops into the same ballpark
    of usability as Windows and the Macintosh. With desktop environments such as KDE,
    users can easily work with FreeBSD, customize their own settings, and so on. It''s
    quite literally a power user''s dream. However, meager application availability
    and a certain tendency for the developers of desktop environments to focus on
    customizability rather than ease-of-use continues to hamper the UNIX desktop,
    even with such environments as KDE at our disposal.


    # Installing KDE


    During the installation, you were given the option of installing KDE and making
    it your default desktop. If you elected to use this option, there is nothing else
    you have to do. If you didn''t, you will need to install KDE first. The latest
    version of KDE is available as a port in the directory `/usr/ports/x11`. (At the
    time of this writing, it is `/usr/ports/x11/kde3`.) Refer to Hour 6, “Adding and
    Removing Third Party Software,” for information and details on installing software
    from ports.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_312_0.png)


    > KDE is a very large download. On a 56KB modem connection, it will take several
    hours. Also, it takes a long time for KDE to build from a source: once again,
    several hours. Of course, because FreeBSD is a multitasking operating system,
    you can be working on other tasks while KDE is downloading and building.


    # Making KDE Your Default Window Manager


    If you did not set KDE as your default window manager during the FreeBSD installation,
    you can do so now (after you have downloaded and installed it, of course). The
    file that controls your default X options is `.xinitrc`, which is located in your
    home directory.'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'Note that because the filename begins with a period, the file will be "hidden"
    and not appear in the normal directory listing (unless you use the –a flag for
    ls). Edit the .xinitrc file in a text editor. If the file doesn’t already exist,
    simply create it by opening a new file in the text editor named .xinitrc. If it
    does already exist, you might want to make a backup copy before making any changes.
    For example,


    ```

    cp .xinitrc .xinitrc.back

    ```


    In the original .xinitrc file (not the backup you created), add the following
    line:


    ```

    startkde

    ```


    Any other lines that exist in this file should be removed.


    After you have finished editing the file, save it and exit the text editor.


    # Starting KDE


    When you have exited the text editor, you can start KDE by typing startx at the
    command line. The screen should go blank for a few seconds, and after KDE has
    finished loading, you should see a screen that looks similar to Figure 18.1.


    FIGURE 18.1

    The default KDE desktop.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_313_0.png)'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# Navigating the KDE Desktop


    If you have used Windows in the past, it will be fairly easy for you to get used
    to KDE. Notice some of the similarities. On the desktop, you have a trash can,
    which serves the same purpose as the Windows recycle bin. There is also a folder
    on the desktop labeled Home. This is your home directory. Its closest equivalent
    in Windows is probably the My Documents folder.


    Click on the Home folder on the desktop. Note that unlike Windows, you only have
    to single click. In a few moments, a window should open showing you the contents
    of your home directory (see Figure 18.2).


    FIGURE 18.2

    The KDE file manager, showing the home directory of a user.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_314_0.png)


    We will cover the details of file management with the KDE file manager later on.
    For now, click on the X in the upper right corner of the window to close the file
    manager.


    The bar along the bottom of the screen is similar to the Windows taskbar. The
    large K on the left side is the equivalent of the Windows Start button. Clicking
    on the K will bring up a menu similar to that shown in Figure 18.3.


    Entries in the menu that have an arrow on their right side have sub-menus under
    them. Simply move the mouse pointer over one of these entries, and the sub-menu
    will pop up to the right.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# FIGURE 18.3

    The KDE Start menu.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_315_0.png)


    The icon on the bar next to the large K that looks like a desktop with a light
    over it will instantly show the desktop if you click on it. Any windows currently
    covering the desktop will be minimized.


    # Virtual Desktops


    Next to that on the bar is the control panel that allows you to select which of
    the four virtual desktops you want to see. This might be a new concept for Windows
    users. Virtual desktops allow you to have different sets of windows open on entirely
    different screens, with each layout suspended in memory; you can quickly switch
    between as many as six or nine different window layouts by clicking on one of
    the virtual desktop icons. This concept differs from “virtual screens” (which
    you saw in the last hour’s lesson) in that these are discrete window layouts,
    each of which uses the full screen and no more; whereas the “virtual screen” concept
    in X involves a single large screen that’s “larger” than your monitor, which you
    navigate by scrolling.


    > If you want a certain window to be visible on all the virtual desktops, you
    can “pin” it to the desktop using the little icon on the left side of the window’s
    title bar that looks like a bulletin board pin. The pinned window will not be
    visible on all the virtual desktops. If you want to move a window from one virtual
    desktop to a different one, pin it to the desktop, click on the virtual desktop
    that you want to move it to, and then unpin it by clicking on the pin icon again.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Window Controls


    The window controls in KDE behave very similar to the same controls in Microsoft
    Windows. Figure 18.4 shows a standard window in KDE.


    FIGURE 18.4

    A standard window in KDE: in this case, showing the file manager.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_316_0.png)


    The title bar of the standard window has five buttons. From left to right, they
    perform the following functions:


    +   - **Window menu.** From this menu, you can access various window functions
    such as shading the window (rolling it up), moving it to a different virtual desktop,
    and so on. You can also control various options about how the window looks from
    this menu.

    +   - **Pin.** We talked about this earlier. Pinning the window to the desktop
    makes it visible on all the virtual desktops instead of just the current one.

    +   - **Minimize.** This minimizes the window and hides it. The window can be
    restored by clicking on its entry in the bar at the bottom of the screen.

    +   - **Maximize/restore.** This expands the window to cover the entire screen.
    If the window is already maximized, the button restores it to its original size.

    +   - **Close.** This button closes the window and terminates any applications
    that are running in it.


    If you want to shade (roll up) the window, you can also do this by double-clicking
    on the title bar. To unshade it, double-click on the title bar again.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# The Window Menu


    The Window menu can be accessed in one of two ways. The first way is by clicking
    on the Window Menu button, as described previously. The second way is by right-clicking
    on the window''s title bar. Both of these methods have the same effect and bring
    up the same menu. Figure 18.5 shows the Window menu.


    FIGURE 18.5

    *The Window control menu in KDE.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_317_0.png)


    The options in the menu perform the following operations:


    +   - **Move.** Clicking this option causes any mouse movement to move the window.
    You can also use the arrow keys on the keyboard to move the window. Pressing the
    mouse button or the Enter key drops the window in the new location.

    +   - **Size.** Clicking this option causes any mouse movement to resize the window.
    You can also use the arrow keys on the keyboard to resize the window. Pressing
    the mouse button or the Enter key keeps the new size that you have selected.

    +   - **Minimize.** Minimizes the window to the taskbar.

    +   - **Maximize.** Expands the window to fill the entire screen.

    +   - **Shade.** Rolls up the window

    +   - **Always on Top.** This is a toggle. When active, there is a check mark
    by it, and the window will always stay on top even when it is not the active window.
    This means that the active window can be hidden behind this window. Click on it
    again to deactivate the Always on Top functionality.

    +   - **Store settings.** Simply saves the current settings.


    The other options need a little bit more explanation. The Decoration option allows
    you to select several different schemes for how the window controls look. For
    example, the B II scheme causes the windows and title bars to closely resemble
    BeOS (see Figure 18.6).'
  merge: -1
  img_proc: true
- pgno: 318
  md: 'FIGURE 18.6

    A KDE window using BeOS-like decorations from the B II scheme.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_318_0.png)


    Note that changing the window decorations also changes the functionality of the
    buttons and possibly the location of the buttons.


    The To Desktop option allows you to move the window to a different virtual desktop.
    As mentioned previously, this can also be accomplished by pinning the window,
    switching to a different virtual desktop, and then unpinning it there.


    # Moving and Resizing Windows


    As you probably guessed, windows can be moved by holding down the left mouse button
    on the title bar and dragging the window to a new location, and then releasing
    the mouse button to drop the window at the new location.


    Move the mouse pointer over the border of the window, hold down the left button,
    and drag the mouse to resize the window. Let go of the button when the window
    has been resized to where you want it. If you want to be able to resize horizontally
    and vertically at the same time, hold down the button over one of the window corners.
    Note also that the mouse pointer looks different when you are over the border
    of a window and indicates in which directions you can resize the window.


    # Restoring Windows


    As with Microsoft Windows, KDE maintains a taskbar at the bottom of the screen
    that has a list of windows currently open. (It only lists the window open on the
    current virtual desktop.) You can restore a minimized window simply by clicking
    on a taskbar entry. In addition, right-clicking on the taskbar entry brings up
    a list of other options you can perform on the window, such as moving it to a
    different virtual desktop, shading or unshading it, and closing it.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# The Desktop Menu


    Right-clicking on a blank spot on the desktop will bring up a menu with several
    options (see Figure 18.7).


    FIGURE 18.7

    The Desktop menu in KDE can be activated by right-clicking on a blank area of
    the desktop.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_319_0.png)


    Here is what the options in the menu do:


    +   - **Create new.** This option allows you to create new links on the desktop,
    which are basically the same thing as shortcuts in Windows. You can also create
