- pgno: 44
  md: 'FIGURE 2.2

    Partitioning the hard disk in sysinstall.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_44_0.png)


    # Hard Disk Partitioning


    Before you can install FreeBSD, you need to create a partition for it on your
    hard disk. A partition is sort of like a container on the hard disk that is separated
    from other containers. For example, you might have one partition for Windows and
    another for FreeBSD, as shown in Figure 2.3.


    FIGURE 2.3

    Partitions on a hard disk.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_44_1.png)


    # FreeBSD''s Hard Disk Naming


    At the top of Figure 2.2 (shown previously) notice where it says Disk name: ad0.
    This is how FreeBSD names physical disks in the system. The names start at 0 rather
    than 1. So, ad0 is the first hard disk in the system. ad means that this hard
    disk is an ATA hard disk. If you have a SCSI disk, it will be sd0 instead, but
    the concept is the same. ad0 or sd0 is the primary hard disk of the system. As
    you have probably guessed, ad1 or sd1 would be the second, and so on.


    On this disk, there are currently no partitions. If we want to use the entire
    disk for FreeBSD, we can simply select A for Use entire disk. If, on the other
    hand, you already have another operating system such as Windows installed, you
    will want to select C for Create slice. You will then be asked the size that you
    want the slice to be. Simply enter the size and press Enter.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_45_0.png)


    > You will need to have at least some space available in order to create a slice
    for FreeBSD. This means that you must have some space available marked Unused.
    This space can then be assigned to FreeBSD.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_45_1.png)


    > Note that if you select the A option for Use entire disk, it will erase any
    existing partitions on your disk, including Windows partitions. Also note that
    if you delete the Windows partition from within this program, your Windows installation
    will be completely overwritten once the installation of FreeBSD starts.


    Once you have finished creating the partition for FreeBSD, press q to quit the
    program and move onto the next stage of the installation.


    # Boot Manager


    You will then be given a screen that asks if you want to install the boot manager.
    Unless you already have another boot manager installed such as Linux''s LILO,
    you will want to install the boot manager here. This will allow you to boot FreeBSD,
    as well as to boot Windows if you currently have that installed on your system
    and still want to be able to use it after FreeBSD is installed.


    # Creating BSD Partitions


    Next, you will be given a message informing you that you need to create BSD partitions
    inside the fdisk partitions you created earlier. Press Enter here to get to the
    BSD partition table editor as shown in Figure 2.4.


    Because this is the first time you have installed FreeBSD, I suggest that you
    choose the A option to select the auto defaults. After you have done so, your
    screen should look similar to Figure 2.5.


    It''s not important that you understand what all of these numbers mean right now.
    They will be explained later in the hour on hard disks and backup systems.


    After you have finished editing the partitions, press q to exit the partition
    editor.'
