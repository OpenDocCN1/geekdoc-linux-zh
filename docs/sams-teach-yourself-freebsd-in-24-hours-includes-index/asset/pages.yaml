  md: "+   - **freebsd-bugs:**\n+     This list contains all the bug reports that\
    \ are filed for FreeBSD. You should not actually send bug reports to this list,\
    \ but rather you should submit a bug report using the form located at `http://www.freebsd.org/send-pr.html`.\
    \ The submitted problem reports are then automatically posted to the freebsd-bugs\
    \ list where anyone who subscribes can view them.\n+   \n+   - **freebsd-chat:**\n\
    +     This is a general discussion list. It's not intended for technical discussion\
    \ or the posting of problems and questions about how to do things in FreeBSD.\
    \ It's mostly just intended as a social list.\n+   \n+   - **freebsd-commit:**\n\
    +     Any change made to the FreeBSD source tree is posted to this list. It is\
    \ a read-only list, so you can't post anything to it. It probably isn't of much\
    \ interest to you unless you are really interested in the nuts and bolts of FreeBSD.\n\
    +   \n+   - **freebsd-config:**\n+     This is a list for discussing FreeBSD installation\
    \ and configuration tools. Some of the discussion on this list involves potential\
    \ replacements for the current tools, including a graphical installer that is\
    \ in the works.\n+   \n+   - **freebsd-current:**\n+     You need to be subscribed\
    \ to this list if you are attempting to work with FreeBSD CURRENT. Note that this\
    \ is not the place to post general how-to questions about FreeBSD, even if you\
    \ are asking the question in relation to CURRENT. Such questions will be ignored,\
    \ and you won't get answers. Only technical questions specifically related to\
    \ CURRENT should be posted here. General technical questions should be posted\
    \ to the freebsd-questions list.\n+   \n+   - **freebsd-isp:**\n+     This is\
    \ a discussion list for FreeBSD users who are providing Internet services. This\
    \ is not the place for you to post questions about connecting to an Internet service\
    \ provider with FreeBSD. Rather, it is a discussion list for the providers themselves.\
    \ Questions about connecting to an ISP should be posted to the freebsd-questions\
    \ list.\n+   \n+   - **freebsd-jobs:**\n+     This is pretty much a list of job\
