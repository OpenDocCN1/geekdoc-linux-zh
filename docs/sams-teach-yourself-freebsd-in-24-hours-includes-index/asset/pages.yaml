    mylist:include:/home/frank/list.txt | Expands to include all the addresses in\
    \ list.txt\n\nAfter you make any change to /etc/mail/aliases, you have to rebuild\
    \ the aliases.db file, which is a faster hash table version of the aliases file.\
    \ You can use the traditional newaliases command to do this; or for consistency's\
    \ sake with the rest of the maintenance tasks, use make aliases:\n\n```\n# make\
    \ aliases\n/usr/sbin/sendmail -bi\n/etc/mail/aliases: 22 aliases, longest 10 bytes,\
    \ 213 bytes total\n```\n\n![](img/ba0161b65b37e94cffc801ecbacaba5e_393_0.png)\n\
    \n> Global aliases aren't the only way to redirect mail from one local address\
    \ to another or to an external address. For instance, if a user wants all his\
    \ incoming mail to be forwarded automatically to some external address, you could\
    \ use /etc/mail/aliases to do the trick, but this involves root access; there's\
    \ a better way if the user has a full account on the system.\n> \n> All a user\
    \ has to do to forward mail to another address is to create a .forward file in\
    \ his home directory, containing the forwarding email address. This can be done\
    \ with any text editor, or even simply with echo:\n> \n> # echo \"frank@somewhereelse.com\"\
