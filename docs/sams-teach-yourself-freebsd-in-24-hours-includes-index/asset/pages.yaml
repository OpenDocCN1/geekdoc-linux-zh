  md: '# WindowMaker


    WindowMaker is a very popular window manager that is available for FreeBSD. It
    is basically a clone of the desktop designed for the now defunct NextSTEP system.
    Although NextSTEP itself now survives only as the framework for Apple’s Mac OS
    X, adherents to the design philosophy of the platform in its early conception
    often find WindowMaker to be an attractive implementation of those design goals.
    Figure 19.3 shows WindowMaker in action.


    FIGURE 19.3

    *The WindowMaker window manager. The bar on the right is called the dock.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_334_0.png)


    One of WindowMaker’s most useful features is the dock located on the right side
    of the screen. Many miniature applications are available for download that are
    designed to run in the dock. They range from clocks to calendars to miniature
    CD players. Four of these dockable applications are shown in Figure 19.3. They
    are, from top to bottom, a clock with a calendar, a program that displays the
    phase of the moon, a program that monitors CPU usage, and a program that monitors
    network traffic. Users of Mac OS X might find the operation of these applications
    familiar because their functionality resembles that of the Dock in OS X (which
    is a descendant of the NextSTEP Dock on which the dock in WindowMaker is based).
    Running applications have an icon in the dock, and applications can be kept there
    even when not running for quick access at any time.


    Like KDE, WindowMaker supports virtual desktops, which can be accessed by clicking
    the arrows next to the paperclip in the upper-left corner.'
  merge: -1
