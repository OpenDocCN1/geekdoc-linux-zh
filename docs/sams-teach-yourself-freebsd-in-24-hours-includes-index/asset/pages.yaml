    /dev/ad0s1f 257998 44 237316 0% /tmp

    /dev/ad0s1g 8027686 1990866 5394686 27% /usr

    /dev/ad0s1e 257998 30586 227894 14% /var

    procfs 4 4 0 100% /proc

    ```


    # Mounting and Unmounting Various Media Formats


    In FreeBSD, working with a disk isn''t a simple matter of putting it into the
    slot, as it is in desktop operating systems like Windows or the Mac OS, which
    know how to auto-mount volumes either when you insert them or when you try to
    access them. After you insert or install a disk, you then have to manually mount
    it in order for the system to be able to access it. When you''re done using a
    removable disk, you have to unmount it before you can safely eject it.


    Each type of disk or other media that you might want to add to your system has
    to be referred to by its device name—a short and often cryptic label that refers
    to the device in /dev that enables the kernel to talk to that piece of equipment.
    Table 8.2 shows typical storage devices and the device names that you must use
    to refer to them. The number sign (#) in each device name refers to the identification
    number of each device, which begins at zero. The first floppy drive in a system
    would be /dev/fd0, the second one would be /dev/fd1, and so on.


    Table 8.2 Common Device Names for Storage Devices


    | Device Name | Used For |

    |---|---|

    | /dev/ad# | IDE/ATA hard disks |

    | /dev/da# | SCSI hard disks (Direct Access) |

    | /dev/fd# | IDE floppy drives |

    | /dev/acd# | IDE CD-ROM and CD-RW drives |

    | /dev/cd# | SCSI CD-ROM and CD-RW drives |

    | /dev/sa# | SCSI tape drives (Sequential Access) |

    | /dev/vpo# | Iomega Zip drives |'
  merge: -1
  img_proc: true
- pgno: 153
  md: 'When a disk is partitioned, the naming scheme gets a little more complicated.
    Let''s say that you have an IDE disk that your system recognizes as /dev/ad0.
    (The boot messages, as well as the output of dmesg, will tell you what name the
    system has given it.)


    > IDE/ATA disks are numbered from zero to three, supporting a total of four devices;
    the IDE architecture allows for two channels (primary and secondary), each with
    a master and a slave device. The sequence in which FreeBSD numbers these devices
    is—Primary master; primary slave; secondary master; secondary slave. So /dev/ad1
    would be the primary slave, and /dev/ad2 is the secondary master.


    FreeBSD disks can be divided into two levels of partitions: there are what Windows,
    Linux, and other operating systems call partitions, which FreeBSD refers to as
    slices. (These slices can be accessed directly by the system''s BIOS, which is
    why they are often referred to as BIOS partitions.) Then, within each slice, you
    can create multiple BSD partitions, which you can then assign to different mount
    points. Experts can configure FreeBSD disks in a multitude of different ways—for
    example, configuring slices for FreeBSD, Linux, and Windows and subdividing the
    FreeBSD slice into /usr, /var, and / partitions. However, for your purposes, you
    will most likely be using the default configuration—in which a hard disk has a
    single FreeBSD slice and several BSD partitions underneath it, which are named
    with letters beginning with e. Figure 7.1, in the previous hour''s lesson, illustrates
    these different levels of partitioning and how the sequential boot blocks interact
    with them.


    Figure 8.4 shows a fully specified FreeBSD hard disk partition''s device name.
    The first part (ad1) specifies the base device name. Next comes the slice name,
    whose numbers begin at 1 (s1). Finally, we have the BSD partition name (e).


    # FIGURE 8.4

    Anatomy of a FreeBSD hard disk device name.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_153_0.png)


    Unpartitioned disks have simpler names because all you have to specify is the
    base device name; there are no subpartitions to worry about. A floppy disk is
    simply /dev/fd0. However, there is one more complicating factor. This is the dedicated
    disk mode in which you must specify the c partition as a special code name to
    refer to the'
