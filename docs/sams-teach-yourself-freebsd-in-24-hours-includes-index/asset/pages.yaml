    # Creating Samba Shares


    Many examples for how to configure a shared directory can be found in smb.conf.default.
    To enable any of them, remove the comment mark (#) from the beginning of the appropriate
    lines in smb.conf.


    Example shares are displayed below the ===== Share Definitions ===== line in smb.conf.
    Each share''s name is listed in brackets, and the configuration lines following
    it apply until the next bracketed block. The smb.conf file begins with a [global]
    block, allowing you to set global parameters that affect all shares on the system;
    the rest of the blocks each define a share whose settings override the previously
    defined global settings.


    After making any configuration change in smb.conf, you will need to restart Samba
    by stopping and restarting it:


    ```

    # /usr/local/etc/rc.d/samba.sh stop

    # /usr/local/etc/rc.d/samba.sh start

    ```


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_418_0.png)


    > The man smb.conf page lists all available configuration parameters and describes
    in detail what each does. However, you might find it easier to view the page in
    HTML format—in which headings and examples are set apart with text formatting
    and made easier to read, as well as being contextually hyperlinked. Refer to the
    online documentation at http://samba.org/samba/docs/man/smb.conf.5.html for the
    formatted version.


    # Sharing Directories


    To share a regular public directory, define a share block like this:


    ```

    [my-public]

    comment = Public Stuff

    path = /usr/local/share/samba-stuff

    public = yes

    writable = yes

    printable = no

    write list = @staff

    ```'
