    # Hour 17


    # Configuring the X Window System


    The X Window System (X, or X11) provides a graphical user interface for FreeBSD.
    X works along with a program called a window manager, which determines how the
    windows look, how the mouse buttons behave, what menus are available, how the
    interface is configured, and so on. Window managers range from very simple managers
    that provide basic windowing functionality to very complex ones that can either
    emulate the look and feel of Microsoft Windows or Macintosh or create a completely
    custom look and feel. Figures 17.1 and 17.2 show two of the available Window managers
    for FreeBSD.


    Hour 18, “The KDE Desktop Environment,” will cover KDE in detail, and Hour 19,
    “Window Managers and Desktop Environments,” will cover the various window managers
    available, as well as some of the differences between a window manager and a desktop
    environment. This hour covers how to configure the X Window System in general.'
  merge: -1
  img_proc: true
