  md: 'IP address, so this line should be included. If your ISP has given you a static
    IP address, include a line such as the following in place of the noipdefault line:


    ```

    111.111.111.11:222.222.222.22

    ```


    The number 111.111.111.11 should be replaced with the static IP address that your
    ISP has assigned to you. The number 222.222.222.22 should be replaced with the
    gateway address that your ISP gave you. If your ISP did not give you a gateway
