- pgno: 231
  md: '# LISTING 12.1 continued


    ```

    inet 127.0.0.1 netmask 0xff000000

    ppp0: flags=8010<POINTOPOINT,MULTICAST> mtu 1500

    sl0: flags=c010<POINTOPOINT,LINK2,MULTICAST> mtu 552

    faith0: flags=8000<MULTICAST> mtu 1500

    ```


    There are a few “special” IP addresses to keep in mind. First is the network address.
    This is an IP address in which one or more of its bytes are zero, such as 64.41.131.0.
    If the final byte is a zero, the address is a synonym for the entire 64.41.131
    network and is generally used only when configuring routers. More important is
    if one or more of the trailing bytes are 255 (all bits set to 1). This is the
    broadcast address for the network; for example, 64.41.131.255 matches all hosts
    on the 64.41.131 network, and 64.41.255.255 matches all hosts on the 64.41 network.


    A “Class A” network has only the first eight bits of the network specified in
    its assigned number; there are 16.7 million potential IP addresses in a Class
    A network, such as 64.0.0.0. “Class B” networks have 65,534 available addresses
    because sixteen bits (two numbers) of the address are specified. “Class C” (24-bit)
    networks are the most common, with 254 available addresses; this is the kind of
    network that the output of ifconfig showed.


    # Subnets and the Network Mask


    Netmasks, which travel hand-in-hand with IP addresses when configuring TCP/IP
    on a machine, are one of the most misunderstood parts of the whole structure,
    and yet potentially one of the most elegant when understood properly.


    The purpose of the network mask (or netmask) is simply to tell a router or host
    whether a packet is supposed to go to the network it’s on or go upstream to the
    next router. When a router receives a packet and has to decide what to do with
    it, it checks the packet’s destination IP address against its own netmask.


    The netmask, a 32-bit string like an IP address, is usually of the form 255.255.255.0.
    Let’s say that we have a router managing the 64.41.131 network, with a netmask
    of 255.255.255.0. The router receives a packet addressed for 64.41.131.45. This
    is matched against the netmask in an “and” fashion, meaning that the smaller of
    each pair of numbers in the comparison is taken:


    ```

    064.041.131.045

    AND

    255.255.255.000

    --- --- --- ---

    064.041.131.000  (Match!)

    ```'
  merge: -1
  img_proc: true
- pgno: 232
  md: 'The result matches as far as 64.41.131, which is the address of the network
    our router manages. This packet is passed on to the network. Another packet now
    comes in, destined for 64.41.189.45; this match against the netmask fails, and
    the router passes the packet upstream to the next router.


    ```

    064.041.189.045

    AND 255.255.255.000

    --- ---

    064.041.189.000    (No match!)

    ```


    This mechanism allows you to set up subnets within your network. Assume that you
    have a Class B address range to work with (64.41.xxx.xxx). Your network''s main
    router, R1, manages this entire range, but you can put a router (R2) inside this
    network to manage two Class C address ranges: 64.41.131.xxx and 64.41.132.xxx.
    Hosts in the 64.41.131 network can be plugged in to the same hub as hosts in the
    64.41.132 network, as shown in Figure 12.8, but they won''t speak directly to
    each other if their netmasks are set to 255.255.255.0, a Class C mask. Destination
    IP addresses in sent packets won''t match the senders'' netmasks. However, if
    a sender host (H1) in 64.41.131 sets its netmask to a Class B mask (255.255.0.0),
    the addresses would match, and the sender would be able to send the packet directly
    to H2—a host on 64.41.132. However, note that H2 wouldn''t be able to send its
    replies directly back to H1 because its netmask prevents it! It has to send the
    reply back via R2, which has multiple network addresses and subnets bound to its
    internal interface. You''d need to set H2''s netmask to 255.255.0.0 for it to
    talk directly to H1 without going through the router.


    # FIGURE 12.8


    A network with subnets, demonstrating the packet path between two hosts whose
    netmasks don''t permit them to communicate directly.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_232_0.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_233_0.png)


    Another notation used in specifying networks that incorporates the netmask is
    CIDR, or Classless Inter-Domain Routing, which takes the form of the network address,
    a slash, and the number of bits that make up the mask. For example, a mask of
    255.255.255.0 on our 64.41.131 network would be written as 64.41.131/24 because
    the mask consists of three 8-bit bytes with all bits set to 1, or 24 bits. The
    255.255.255.192 example, likewise, would correspond to a notation of 64.41.131/26.
    This notation is seen in routing tables and other places where succinctness is
    useful.


    # Summary


    This hour’s lesson covered the fundamentals of TCP/IP as seen from the point of
    view of the computer. It has laid the groundwork for a deeper understanding of
    how TCP/IP configuration works and how applications use the Internet’s communications
    protocols so that when you encounter them later, you will have a better chance
    of knowing how the software is interacting. The Internet is the great leveler
    of operating systems—in which Windows, Macintosh, and UNIX computers all come
    together to accomplish the same tasks—and you now know the common language that
    they all speak.


    # Q&A


    Q How many layers are there in the OSI stack, and how are they arranged?

    A Seven. Top to bottom, the layers progress from human-centric data directed from
    a user to another user (or from a host to another host), down to machine-centric
    data directed from one specialized piece of hardware to another.


    Q What is the difference between a hub and a switch?

    A In a hub, all connected devices are wired together in one big collision domain
    so that each machine’s Ethernet card sees all traffic that any of the rest of
    them sends or receives, and all connected machines must share the same aggregate
    bandwidth. A switch’s ports each comprise their own collision domains, though,
    so no machine can see traffic destined for another on a different port.


    Q How can I tell a hub and a switch apart?

    A Most hubs and switches will be clearly marked as to what they are. However,
    there are other ways in which you can tell. For instance, hubs can only communicate
    in half-duplex mode, whereas switches will negotiate to full-duplex mode if they
    can. If you connect a machine to a device, look at the output of ifconfig, and
    see that your link is up in full-duplex mode, you know it’s a switch; otherwise,
    it’s probably a hub.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Q What is the purpose of a router?


    A Routers convert LAN traffic into WAN signals that can be sent to remote networks
    over high-speed serial connections. A router keeps a table of upstream routers
    to which to send packets to whose destination it doesn’t know the route.


    # Workshop


    This section is designed to flesh out your understanding of TCP/IP networking
    with quiz questions and exercises, leading you to further areas of study if you
    are so inclined.


    # Quiz


    +   1. What is the most common type of Ethernet cable today?

    +      A. UTP with RJ-45 jack

    +      B. DIX/AUI serial transceiver

    +      C. ThinNet coaxial with BNC connector

    +      D. ThickNet coaxial with "vampire tap" connector

    +   2. How big is the average TCP/IP packet on the network?

    +      A. 50 bytes

    +      B. 1 kilobyte

    +      C. 2048 bytes

    +      D. 32 kilobytes

    +   3. In an 8-port 100base-TX switch, with eight connected machines all using
    the network actively, how much bandwidth is available to each machine?

    +      A. 8 Mbps

    +      B. 12.5 Mbps

    +      C. 50 Mbps

    +      D. 100 Mbps

    +   4. What is the subnet mask for a network whose address is 241.155.4?

    +      A. 255.0.0.0

    +      B. 255.255.0.0

    +      C. 255.255.255.0

    +      D. 255.255.255.255'
