    # Hour 13


    # Connecting FreeBSD to an Existing Network


    Now that you know what networking is all about, the arcane numbers that you must
    enter into a computer''s "TCP/IP Settings" window should make a little bit more
    sense. Even though operating systems these days are getting so that you don''t
    have to configure as many of these numbers as you would have in earlier years
    (DHCP, for instance, makes most network configuration automatic), we can''t take
    for granted that everything will always set itself up on its own. The next topic
    to cover will be configuring your FreeBSD machine for networking.


    This chapter assumes that you''ll be connecting your machine to a local area network
    (LAN) using an Ethernet card. If you don''t have an Ethernet card and are instead
    planning to configure your machine to use a dial-up Internet connection with PPP
    and a modem, you can skip to the next hour.


    In this hour you will learn:


    +   - Which kinds of Ethernet or 802.11 cards you can use to hook up your machine'
