- pgno: 369
  md: '# Hour 22


    # Configuring a Basic Web Server


    FreeBSD makes an excellent Web server platform. In fact, this is one of its most
    popular uses. Many large Web sites, including Yahoo! and Sony Japan, rely on FreeBSD
    to serve up millions of pages a day. You might not have any ambitions of serving
    quite so many visitors, but this just shows what FreeBSD is capable of handling.
    And when that capability is available free, why not take advantage of it? In this
    hour, you will learn:


    +   - How to install Apache on your FreeBSD system

    +   - Basic configuration of Apache

    +   - Basic access control and security


    # What Is Apache?


    Apache is freely available and open source Web server software. It is available
    for many platforms including most flavors of UNIX, including FreeBSD, MacOS X,
    OS/2, and more recently, Windows. Apache is the


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_369_0.png)'
  merge: -1
  img_proc: true
- pgno: 370
  md: 'most popular Web server software in the world. According to a Netcraft survey,
    approximately 64% of the world''s Web sites are running Apache.


    # Requirements for Running Your Own Web Server


    Before you start installing Apache, you might first want to make sure that it
    makes sense for you to run your own Web server. For example, if you have a dial-up
    Internet connection, it probably is not practical for you to run a Web site off
    that. You are going to want at least a cable or DSL connection for running a Web
    site. Also remember that with most cable and DSL providers, your upstream bandwidth
    will usually be less than your downstream bandwidth, which basically means that
    you can receive files faster than you can send them. That''s not usually an issue
    for normal Internet use, but a Web server spends most of its time sending files.
    So for this, it is a very big issue. If you expect your Web site to be busy, or
    you plan to have high bandwidth content such as streaming video on the site, cable
    or DSL will probably not be fast enough. The next step up is a dedicated T1 line,
    which can cost around a thousand dollars a month.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_370_0.png)


    > If you intend to serve Web content from your FreeBSD machine on a cable or DSL
    connection, be aware that some providers block incoming HTTP requests (on TCP
    port 80) to all customers except those who have specifically paid for a "business
    account" that allows Web serving. Make sure that you know what capabilities your
    provider allows you.


    In addition, there is the maintenance involved with running your own Web server.
    This involves such things as keeping on top of security issues, hardware maintenance,
    and so on.


    If all you want to do is host a small Web site for your business or organization,
    it might make more sense for you to rent space on someone else''s server. For
    around $10 to $20 a month, you can get a lot of bandwidth, you can get someone
    else to worry about the maintenance and server administration for you, you can
    get redundant backup systems and backup power supplies, and so on. This allows
    you to concentrate on the design of the site rather than on the maintenance and
    administration of the server itself.


    Of course, there are also some drawbacks to renting space on someone else''s server.
    The first is that you will have a lot less flexibility. You will generally be
    stuck with whatever'
  merge: -1
  img_proc: true
- pgno: 371
  md: 'software the hosting service has installed on their servers. If you are currently
    using one database for example, and later you decide to switch to a different
    one, you might find yourself having to find a different hosting service if your
    existing one doesn’t support the new database.


    The other major drawback is that you will be sharing space and bandwidth with
    other sites. This is usually not a problem, but it can cause slow response times
    during heavy traffic periods if several sites are getting hit hard.


    If your site will be large and complex or you want to sell your hosting services
    to others, it might make more sense to set up your own Web server.


    In addition to a broadband Internet connection, you will need the following:


    +   - **A static IP address.** Most Internet service providers give you a dynamic
    IP address, which means that your IP address can change. If your IP address changes
    on a regular basis, people will not be able to find your site.

    +   - **A registered domain name.** This is not strictly necessary, but if you
    don’t have a domain name, site visitors will have to access your site by entering
    the IP address. For example, instead of http://www.mycompany.com, they will have
    to enter something like http://145.162.134.11. People are generally much better
    at remembering names than numbers, so you will probably want to register a domain
    name with a registration authority. A list of domain name authorities that you
    can register with can be obtained at http://www.internic.net/alpha.html.

    +   - **If you want to use a domain name,** you will also need to provide a primary
    and secondary DNS server to host your domain name. The DNS server is what translates
    your domain name into an IP address. Running your own DNS server is a complex
    topic that is beyond the scope of this book. You might want to consider using
    a domain registration authority that can provide DNS services for you for a small
    monthly fee.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_371_0.png)


    > > Before you actually set up a Web server on your broadband Internet connection,
    make sure that you read your user agreement with the Internet provider. Many providers
    will have “consumer access only” clauses in their basic Internet service plans.
    This basically means that you can only use the service to receive content and
    not to provide it. If your agreement has such a clause and you get caught running
    a Web server (there are ways they can tell if you are running one), you might
    get your account canceled.'
  merge: -1
  img_proc: true
- pgno: 372
  md: 'Once you''ve taken care of all the preliminaries discussed previously, you
    are ready to install the Apache Web server.


    # Installing Apache


    Apache is included in the FreeBSD ports collection in the `/usr/ports/www` directory.
    As of this writing, the most recent version of Apache is 2.0.40. Make sure that
    you install the production version and not the beta version; both might be available
    in the ports collection. To install the port, simply change to the correct directory
    in `/usr/ports/www` and type `make`, followed by `make install` after the build
    process has completed. A startup script will be installed for you in `/usr/local/etc/rc.d`
    that will cause Apache to load automatically on each system startup.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_372_0.png)


    > > Be aware, as with all services that you install or enable, that Apache is
    a software package that undergoes rapid development in order to add features and
    to fix bugs and security flaws. Every so often, a security hole will be found
    in Apache, and a new version will be released. Be sure to keep on top of the reports
    of these developments; subscribe to the freebsd-security mailing list (send a
    message to majordomo@freebsd.org with the line subscribe freebsd-security in the
    body), and pay frequent visits to Apache''s Web site: http://www.apache.org.

    > >

    > > When a new version of Apache is released, synchronize your ports tree and
    rebuild the Apache port, as described in Hour 6, "Adding and Removing Third-Party
    Software."


    # Basic Apache Configuration: What You Need to Edit


    Like almost everything else in UNIX, Apache''s configuration is controlled by—you
    guessed it—text-based configuration files. Apache stores its configuration files
    in the directory `/usr/local/etc/apache`. There are several files in this directory,
    but the only one we are interested in here is `httpd.conf`. This is the main Apache
    configuration file; thus it is where you will control the majority of Apache''s
    configuration options.


    At first glance, the `httpd.conf` file might look quite complicated and intimidating.
    Fortunately, however, most of the options can be left at their default values.
    The file is also well commented so that you can tell what each configuration line
    is for.'
  merge: -1
  img_proc: true
- pgno: 373
  md: 'For a basic server configuration, you will want to change the following lines:


    ```

    ServerAdmin: you@your.address

    ```


    The address that is listed for ServerAdmin will appear on error messages that
    are automatically generated by Apache and sent to visitors'' browsers when something
    goes wrong. This gives visitors a way to contact you regarding problems they had
    with the site. This address should be replaced with whatever address you want
    to use to receive email regarding server problems.


    ```

    ServerName: new.host.name

    ```


    You should generally set the name of your host here, with the first part aliased
    to www. For example, if your full hostname is simba.mycompany.com, the name you
    should place here in the configuration file is www.mycompany.com. This is sometimes
    used when the server needs to look up its own hostname.


    ```

    DocumentRoot: /usr/local/apache/htdocs

    ```


    This directory is the root directory in which Web pages are stored. In other words,
    if someone enters www.mycompany.com, the file /usr/local/apache/docs/index.html
    is what will be sent to them. If you don''t want to store your Web pages in this
    directory, you should change this path to whatever directory you want to keep
    your Web pages in.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_373_0.png)


    > Any files or directories located in the directory indicated by the DocumentRoot
    directive will be available for the Web server to read and send out over the Internet.
    Because of this, only documents intended to be displayed on the Web site should
    be stored in /usr/local/apache/htdocs or any of its subdirectories.


    To get a basic Web server up and running, these are generally the only options
    you have to worry about initially. More information on the rest of the file can
    be found on the Apache Web site at www.apache.org.


    # Starting and Stopping the Apache Server


    As mentioned previously, the Apache server will automatically start each time
    you boot your system because the installation process installed a startup script
    in'
