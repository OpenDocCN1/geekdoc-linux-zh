  md: "ered in the previous hour, so we are not going to go over it again here. If\
    \ you need instructions for building a new kernel, see Hour 10, “The FreeBSD Kernel\
    \ and the Device Tree.”\n\nAfter you have finished building the new kernel, you\
    \ can reboot your system with `shutdown -r now`. This should bring the system\
    \ back up into multiuser mode running a newly updated version of FreeBSD.\n\n\
    # Troubleshooting\n\nSeveral things can go wrong during this process. Here are\
    \ some of the most common problems you might run into and some possible solutions:\n\
    \n+   - **My make buildworld process failed!**\n+   \n+   One problem that can\
    \ occur is that the make buildworld fails with a compiler error, often citing\
    \ \"* Error code 1\". If this happens, it usually means that the compiler ran\
    \ into a problem related to the source files themselves. This probably means that\
    \ you were unlucky enough to cvsup when the source tree was broken and could not\
    \ be built. Check the FreeBSD-STABLE mailing list archives for any recent posts\
    \ about the build being broken. Run cvsup again at a later time. Note that cvsup\
    \ will not take nearly as long next time because not much will have changed since\
    \ the last time you did it—other than the few changes necessary to fix whatever\
    \ was broken. At this point, no changes have actually been made to your system,\
    \ so the functionality of the existing system has not been affected in any way\
    \ by the failed build.\n+   \n+   - **I got a bunch of \"signal 11\" errors while\
    \ compiling.**\n+   \n+   Another possible compiler error is signal 11 errors.\
    \ These errors are usually caused by faulty hardware. RAM is often the culprit.\
    \ Clean out the `/usr/obj` directory as described earlier in this hour and start\
    \ the build again. If you get another signal 11 error and it occurs at a different\
    \ point in the process than the first one did, it is almost a sure sign of hardware\
    \ problems—most likely RAM issues.\n+   \n+   - **The top and ps programs don’t\
    \ work anymore!**\n+   \n+   So what happens if you finish making the world, reboot,\
    \ and certain utilities such as ps have stopped working? Did you remember to build\
    \ a new kernel after you installed the world? The most common cause of problems\
    \ like this is the kernel being out of sync with the rest of the world."
