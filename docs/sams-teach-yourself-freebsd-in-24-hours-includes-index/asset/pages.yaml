- pgno: 75
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_75_0.png)


    # Hour 4


    # Basic UNIX Shell Use


    The shell is the primary command line interface to FreeBSD. It is the principal
    means that the user has to communicate with the operating system. This hour covers
    the basics of working with the shell.


    In this hour, you will learn the following:


    +   - What the shell is and why you need it

    +   - Different shells that are available

    +   - Working with files and directories

    +   - Getting help in the shell

    +   - Process management

    +   - Other basic shell commands


    # The Role of the Shell


    The primary purpose of the shell is to provide an interface through which the
    user can interact with the kernel. (The kernel and its configuration will be covered
    in Hour 10, “The FreeBSD Kernel and the Device Tree:”)'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'Basically, the kernel is the core of the operating system. It provides most
    of the functionality that the rest of the system needs in order to function. The
    user needs to be able to “talk” to the kernel in order to send commands to the
    operating system. However, the kernel doesn’t speak a language that is anything
    like any human language.


    Attempting to communicate with the kernel in its own language would be extremely
    complicated and frustrating. This is where the shell comes in. The shell is basically
    an interpreter that understands commands in something resembling common English
    and translates those commands into a language the kernel can understand. The shell
    also accepts messages from the kernel and displays them in a language the user
    can understand. The shell, in effect, isolates the user from the kernel (and some
    would say protects the user from the kernel). The result is that normally, the
    user never has to deal directly with the kernel and doesn’t even have to care
    that it exists.


    Figure 4.1 shows a diagram of how the kernel, shell, and system hardware relate
    to each other. The shell is an “abstraction layer”—it hides and protects the inner
    workings of the operating system from the user, in the way that the shell of a
    seed hides and protects its kernel from the outside world.


    # FIGURE 4.1


    The shell, kernel, and system hardware, using the “seed” metaphor.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_76_0.png)


    Windows or DOS command-line junkies will be familiar with this general concept
    because the FreeBSD shell is similar to the command line in Windows and DOS. (It
    is far less similar to the poorly named “DOS Shell” program that existed in some
    versions of MS DOS.)


    Windows users who do not make use of the DOS command-line feature, and Macintosh
    users as well, will probably be less familiar with the concept. But in a very
    loose sense, you can think of the graphical desktop as being similar to FreeBSD’s
    concept of the “shell” because it is also an abstraction layer, a user interface
    that isolates the user from having to deal directly with the kernel.'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# Different Shells Available


    Unlike DOS/Windows, FreeBSD gives you a variety of different shells to choose
    from. The shells vary widely in the number of features they have, the ease of
    use for new users, and how they implement certain features. We aren''t going to
    cover all the available shells here because there are far too many of them. However,
    we will cover some of the more popular ones.


    # The Bourne Shell


    The Bourne shell (sh) is the oldest shell that is still widely used. It is named
    after its creator, Stephen Bourne. The Bourne shell is very primitive compared
    to more modern shells. It lacks advanced features like command history (the ability
    to recall previous commands) and command editing (the ability to edit a previously
    run command and run it again). FreeBSD does not include the original Bourne shell,
    but rather includes a shell known as the POSIX shell. The POSIX shell is an enhanced
    Bourne shell with complete backward compatibility with the original version, but
    that includes additional features such as history functions and command editing.
    If you don''t specify otherwise, new user accounts will have POSIX as the default
    shell.


    # The C Shell


    The C shell (csh) is so named because it was designed to have a syntax similar
    to the C programming language. It was developed by the University of California
    at Berkeley for the BSD version of UNIX. The C shell had many more features than
    the Bourne shell, including the ability to recall previous commands, the ability
    to edit and rerun previous commands, and the ability to automatically run a script
    of commands upon logging out of the system. (The Bourne shell could only run a
    script of commands upon logging in to the system.) Unfortunately, the C shell
    was not compatible with the Bourne shell and could not run scripts written for
    the Bourne shell.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_77_0.png)


    > The original C shell no longer ships with FreeBSD. Instead, it has been replaced
    by the tcsh shell, which is an enhanced version of the C shell with additional
    features. The tcsh shell is explained a little later on in this hour. The default
    shell of the root user, or administrator, is csh—which in FreeBSD these days is
    the same thing as tcsh.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# The Korn Shell


    The Korn shell (ksh or pdksh—FreeBSD uses the latter) was AT&T''s response to
    the C shell. The Korn shell is backward compatible with the Bourne shell, so it
    will run any script written for the Bourne shell. However, the Korn shell adds
    features such as command history and editing—features that were missing from the
    original Bourne shell. The Korn shell is one of the most popular shells for UNIX
    operating systems. However, new users will probably prefer the Bash shell (discussed
    next).


    # The Bash Shell


    The Bash shell (bash) is short for Bourne Again Shell. This shell was developed
    by the Free Software Foundation; like the Korn shell, it is backward compatible
    with the Bourne shell. Also like the Korn shell, it includes history and command
    editing functions. However, Bash''s history and command editing functions are
    more intuitive for new users than Korn''s are. The Bash shell is also a very popular
    shell on UNIX systems today and is the standard default shell on all Linux distributions.


    # The Tcsh Shell


    The Tcsh shell (tcsh) is an enhanced C shell. It adds features such as more intuitive
    command-line editing and history functions. In addition, it also includes command-line
    completion (the ability to automatically complete a command and save you some
    typing). One other feature of the Tcsh shell worth mentioning is its capability
    to recognize potentially dangerous commands and warn the user before carrying
    them out, thus giving the user a chance to abort the command. Tcsh is the default
    FreeBSD shell assigned to the root user. (But normal users are assigned the POSIX
    shell by default.)


    # Which Shell Should You Use?


    For most tasks you will do, it is not particularly important which shell you decide
    to use. Copying and moving files, listing directories, and running programs, for
    example, will work the same in all the shells. In this chapter and the next one,
    we will be working primarily with the Bash shell because it is one of the most
    popular shells, one of the most powerful, and also one of the easiest for new
    users to work with.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_78_0.png)


    > One other reason to choose the Bash shell or some other Bourne compatible shell
    is that if you ever decide you want to do shell programming, these shells are
    a lot better candidates for shell programming than the C based shells are. You
    can, of course, use one shell for interactive use and a different one for programming
    use. But this can sometimes result in confusion because both shells handle certain
    tasks in different ways.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# Getting Help in the Shell


    As previously mentioned, FreeBSD has a very large number of commands available.
    It would be impossible to document what all of them do in this book. Fortunately,
    the commands come with documentation called man pages (short for "manual"). To
    access the man page for a command, simply type man followed by the name of the
    command. For example, to get help on the man command itself, you would type man
    man.


    You can navigate the contents of a man page by using the Page Up and Page Down
    keys. You can also use the up and down arrow keys, as well as the space bar. The
    spacebar moves you forward one page.


    # Man Page Format


    The first line of the man page generally tells you what category the man page
    is in (more on that in the next section), followed by the name of the man page
    and a number in parenthesis. For example, mv(1) indicates that the man page is
    for the mv command and that this page is in category 1 of the man pages.


    man pages follow a fairly standard format that includes the following sections:


    +   - **NAME**—As its name suggests, this is simply the name of the command followed
    by a very short description of what it does.

    +   - **SYNOPSIS**—This section gives a short syntax for the command including
    the required and optional parameters it takes. Parameters included inside brackets
    are optional: Parameters not included in brackets are required.

    +   - **DESCRIPTION**—This is a longer description about what the command does
    and how the options are used.

    +   - **OPTIONS**—This section simply lists the options that the command accepts
    along with a description of what each option does.

    +   - **USAGE**—Not present in all man pages. When it is, it lists any special
    usage considerations that might apply in certain circumstances.

    +   - **ENVIRONMENT**—This section lists any environment settings that affect
    the behavior of this command. If you don''t know what this means, don''t worry.
    We will cover it in the next hour.

    +   - **EXIT STATUS**—Not present in all man pages. It lists the exit status values
    that the command will return based on whether the command executed successfully.
    Exit status is primarily only of interest to programmers writing automated scripts
    that need to make decisions based on whether commands execute successfully.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_79_0.png)'
  merge: -1
  img_proc: true
- pgno: 80
  md: '**SEE ALSO**—This is a list of other commands that have some relation to the
    command covered by this man page. It might also list man pages for configuration
    files that affect the operation of the current command.


    **NOTES**—Any miscellaneous information that the man page author thought you might
    find useful.


    There might also be a line at the bottom of the man page that tells when the man
    page was last modified, as well as what version of UNIX the command first appeared
    in. In addition, some commands contain an EXAMPLES section that gives some examples
    of how the command can be used.


    # Man Page Categories


    The FreeBSD man pages are divided into several categories numbered 1 through 9.
    Table 4.1 lists the categories and what they contain.


    **TABLE 4.1 Manual Categories**


    | Category | Description |

    |---|---|

    | 1: User commands | This section contains information on the commands most commonly
    used by users such as commands for file manipulation, text searching, and so on.
    This is the category you will be most interested in. |

    | 2: System Calls | This category contains information on the FreeBSD API. You
    don’t need to worry about any of it unless you are a programmer and you want to
    write software for FreeBSD. |

    | 3: Subroutines | This category documents library functions in the C header files.
    If you don’t know what these are, don’t worry about them. Once again, they are
    only of interest to programmers. |

    | 4: Devices | This section contains information on communicating with device
    drivers in FreeBSD. Again, you only need to worry about this if you are a programmer
    and you want to write software for FreeBSD. |

    | 5: File Formats | Next to the first category, this is probably where you will
    spend most of your time. It contains information on the file formats of various
    configuration files. |

    | 6: Games | Undoubtedly, this is the most important category in the man pages.
    It contains information on the games and other amusements that come with FreeBSD.
    |'
