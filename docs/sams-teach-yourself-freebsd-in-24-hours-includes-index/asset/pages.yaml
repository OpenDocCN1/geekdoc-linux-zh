    \ of addresses—an excellent anti-spam provision. Applicable rules include OK,\
    \ REJECT, RELAY, DISCARD, or 550 <message>. The contents of the default /etc/mail/access\
    \ file show examples of how the address/hostname field can be formatted:\n\n```\n\
    cyberspammer.com      550 We don't accept mail from spammers\nFREE.STEALTH.MAILER@\
