- pgno: 67
  md: 'The first set of entries lists the type of the entry and its permissions. The
    first entry, Mail, starts with d, which means that the entry corresponds to a
    directory. The next nine spaces correspond to the permissions. There are three
    spaces for the owner of the file, three spaces for the group of the file, and
    three spaces for other, which includes everyone else. In this case, the owner
    has read, write, and execute permissions on this directory (rwx). The group and
    the user have no permissions. Who are the owner and group? Those are indicated
    by the third and fourth entries. In this case, the owner is murban and the group
    is research. (My group membership is research). In this case, this means that
    murban can do whatever he wants with this directory (read, write, execute), but
    no one else can do anything. I will explain permissions in more detail in a later
    hour.


    The next entry after research indicates the size of the entry in bytes. After
    that comes the date and time that the entry was last modified. The last entry
    is, of course, the name of the file.


    The second line deserves special mention. An entry that looks like this


    ```

    lrwxrwxr-w 1 murban research 15 Mar 20 06:55 tyfbsd ->

    /home/murban/documents/books/tyfbsd

    ```


    indicates a symbolic link. As mentioned previously, symbolic links are like shortcuts
    in Windows. In this case, the entry tyfbsd is actually a shortcut to the directory
    /home/murban/documents/books/tyfbsd. The symbolic link allows me to get to this
    directory by just using tyfbsd instead of the much longer path.


    # Changing Directories


    To move to a different directory, use the command cd, which is short for change
    directory. For example, to change to the directory tyfbsd, which is a subdirectory
    off the current directory, you would use the command cd tyfbsd. This is called
    a relative path. A relative path means that the directory given to the cd command
    is relative to the directory you are currently in. In other words, the command
    is relative to the directory you are currently in, and the tyfbsd directory is
    a subdirectory of the current directory. The alternative is an absolute path.
    An absolute path always begins at the root directory. Recall that the root directory
    is represented by / and is the top-level directory in the system. An example of
    using cd with an absolute directory would be cd /tyfbsd. This would change to
    a directory called tyfbsd located in the root directory.


    You might recall from the previous section that the double period (..) represents
    the parent directory of the current directory. Because of this, you can use the
    double period to move up one directory level to the parent of the directory you
    are currently in. The command to do this would be cd ... If you want to move up
    two directory levels, you can use cd ../.., and so on. If you want to move to
    a directory called my_stuff—


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_67_0.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'which is located in the parent directory of the current directory—you could
    use the command `cd ../my_stuff.`


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_68_0.png)


    > If you get lost in the FreeBSD directory structure, you can instantly return
    to your home directory by typing `cd` followed by pressing the Enter key. The
    `cd` command with no arguments will always take you back to your home directory
    no matter where you currently are in the directory tree.


    # The pwd Command


    If you can''t remember what directory you are currently in, the `pwd` command
    will list it for you. `pwd` stands for *print working directory*. There is a way
    to make the current working directory a part of your shell prompt so that the
    prompt always shows you what directory you are currently in. We will look at how
    to do this in Hour 5, “Advanced UNIX Shell Use.”


    # Creating Files


    There are several ways to create an empty file in FreeBSD. For our purposes right
    now, we are going to use the `touch` command. If you are not already in it, change
    to the directory we created earlier called `mydir` using the `cd` command discussed
    previously. Now enter the command `touch myfile`. This will simply create an empty
    file called `myfile` in the current directory. Of course, empty files are not
    very useful, but this will allow you to look at some basic file manipulation commands.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_68_1.png)


    > The tilde character, `~`, is shorthand for your home directory. It can be used
    anywhere that you want to refer to your home directory. For example, `cd ~/documents`
    will take you to the `documents` directory located within your home directory
    no matter where you currently are in the directory tree.


    # Moving Files


    The command to move a file from one place to another is `mv`. Try the following
    command:


    `mv myfile myfile1`


    This command will simply move `myfile` to a new file called `myfile1`. Of course,
    you can also think of this as simply renaming the file. However, the behavior
    of `mv` will'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'depend on myfile1. If myfile1 does not already exist as an entry in the directory
    list, the behavior will be as previously mentioned. myfile will simply be renamed
    to myfile1. If myfile1 already exists in the directory and it is an existing file,
    myfile will overwrite myfile1. Note that FreeBSD will not ask for confirmation
    before overwriting the existing file. So once again, you might want to use the
    -i option to mv if you aren''t completely sure of what you are doing. As with
    the rmdir command mentioned earlier, the -i will make the command interactive,
    so it will prompt before doing anything.


    If myfile1 already exists in the current directory and is a subdirectory, the
    command will move myfile into the subdirectory myfile1 and myfile will keep its
    existing name. Thus, the result will be that the file is now located at myfile1/myfile.
    Note that if the file myfile already exists in the subdirectory myfile1, FreeBSD
    will overwrite the existing file—once again, without asking for confirmation first.


    # Copying Files


    The command to copy a file from one location to another is cp. It behaves very
    much like the mv command except that it creates a copy of the file instead of
    moving it. Like the mv command, cp will create a copy of the file under a new
    name if the second name given to the cp command doesn''t already exist. If the
    second name given is a directory, cp will make a copy of the file in the new directory,
    and the new file will maintain its original name. Also, like the mv command, cp
    will overwrite an already existing file with the same name without asking permission
    first. So once again, it might be a good idea to use the -i option if you are
    not 100% sure what you are doing.


    The cp command can also be used to copy directories. By default, however, it will
    not go more than one level deep. If you want to recursively copy a directory and
    all of its subdirectories (in other words, you want to copy a directory and everything
    inside it), you can use the -R option to the cp command. Once again, you might
    also want to use -i to prevent cp from accidentally overwriting any files you
    didn''t intend to overwrite.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_69_0.png)


    > You can get yourself in trouble with the -R option to cp. For example, a command
    such as cp -R ./ * /old will attempt to recursively copy everything in the current
    directory to a new directory called old, which is also located in the current
    directory. (I haven''t introduced wildcards yet, but basically, * is a wildcard
    that means everything.) The problem with this is that the directory old will also
    be recursively copied into itself. The result is a recursive loop that will quickly
    fill up all the available space on the hard disk. Watch out for situations like
    this.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Deleting Files


    The rm command is used to delete files. In its basic form, simply follow the rm
    command with the name of the file you want to delete. For example, rm myfile will
    delete myfile in the current directory. The rm command can also be used to delete
    a directory and everything underneath it by using the -r option. For example,
    rm -r mydir will remove all subdirectories and files located in mydir and then
    will remove mydir. Of course, it is possible to do a lot of damage with the -r
    option because once again, FreeBSD will not ask for confirmation before it carries
    out the command, so always double-check the command line before you press Enter
    to make sure that you are removing the right directory. Also always be sure that
    there is nothing you want to keep anywhere in any directory beneath the one you
    are deleting. If you are not totally sure, use the -i option along with the -r
    option. This will cause FreeBSD to ask you to confirm each thing it is going to
    delete.


    # Wildcard Basics


    Like their card game counterparts, wildcards are used to match any character or
    sequence of characters. They can be used for such things as moving multiple files
    or deleting multiple files. There are many ways to write wildcards in FreeBSD,
    but here we will only look at the two most basic ways. These ways are the question
    mark (?) and the asterisk (*). The question mark stands for any single character,
    whereas the asterisk stands for zero or more characters. If you aren''t familiar
    with the command line, this might seem as clear as mud at this point, so I will
    go through a few examples to make it more clear.


    Suppose that we have the following list of files in a directory:


    ```

    project1  project2  project3  myproject  proposal.draft

    ```


    The command rm project? will remove the files project1, project2, and project3
    because the question mark can stand for any single character. So in this case,
    the 1, the 2, and the 3 will be matched by the wildcard.


    The command rm proj* would have the same effect as the previous command because
    it will match all files starting with "proj" and containing zero or more unknown
    characters following "proj."


    The command rm pro* would also remove the same three files, but in addition, it
    would remove the proposal.draft file because it also begins with the sequence
    pro. This is an example in which wildcards could get you in trouble. The lesson
    is that you should always use the maximum number of characters you can before
    the * wildcard. Don''t take unnecessary shortcuts just to avoid typing because
    as this example shows, you could end up deleting a file you didn''t intend to
    delete.'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'As you might have guessed already, the command `rm *` will remove every file
    in the directory. Sometimes this might be your intention, but it also means that
    you need to double-check the command line whenever you are using the `*` wildcard.
    A simple typo can be disastrous. For example, suppose that you want to remove
    all the files beginning with "proj" but instead of typing `rm proj*`, you accidentally
    type `rm proj *`. Remember that FreeBSD interprets the space as an argument separator.
    So a typo as simple as putting a space between `proj` and the asterisk changes
    this command to delete the file `proj` and then delete every other file in the
    directory! As you can see, it is always very important to double-check your command
    line when working with wildcards because even simple typos can cause disaster.


    > One way you can see which files or directories will be affected by the wildcard
    you are intending to use is to use it with the `ls` command first. This will simply
    list all the entries that match the given wildcard.


    > DOS users beware! Wildcards in FreeBSD can behave much differently than you
    are used to. One major reason for this is that FreeBSD does not give any special
    meaning to a period in a filename as DOS does. As far as FreeBSD is concerned,
    the period is just another character. The result is that the command `rm *` will
    delete every file in the current directory in FreeBSD, whereas in DOS, the same
    command would usually have little to no effect.


    # Logging Out of the System


    When you have finished using the system, it is important to log out—especially
    if you are using a computer that untrustworthy people have access to. Logging
    out returns the system to the login prompt so that no one else can use your account
    or access your private files. To log out of the system, simply type `exit` at
    the `bash$` prompt. This will return the system to the `login:` prompt.


    > If you want to clear the screen before logging out so that no one else will
    be able to see what you were working on, simply type `clear` and press Enter before
    issuing the `exit` command.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Importance of Proper System Shutdown


    When you have finished using your computer, it is important that you shut it down
    properly. Because FreeBSD often has several files open and is often doing several
    things at the same time, you can’t simply turn off the power. Doing so could result
    in serious damage to your file system. Before you turn off your computer, you
    must issue one of the FreeBSD shutdown commands. This ensures that all running
    programs are stopped in an orderly fashion, all data has been successfully written
    to the disks, and all open files have been properly closed. There are several
    ways to shut down the system, but I’m only going to cover one of the commands
    here because this is the one you should almost always use. Note that you will
    need to be the root user to shut down the system. If you are still logged in under
    your normal user account, log out using the procedure discussed in the previous
    section. Then, at the login: prompt, enter the user name root, followed by whatever
    password you assigned to root during the system installation. Note that the command
    prompt will be different this time. Instead of bash$, you will have simply #.
    The different command prompt serves as a constant reminder that you are logged
    in as root and that you need to be especially careful about issuing commands.
    At the prompt, enter the command shutdown -h now, and press Enter. You will see
    several messages on the screen. When the following message


    ```

    System halted

    Please press any key to reboot

    ```


    appears, you can safely turn off your computer. Or, if you want to reboot, you
    can simply press any key as it says, and the system will reboot.The syntax of
    the shutdown command as used previously contains the action that you want shutdown
    to perform, followed by when you want that action performed. In this case, -h
    means that we want shutdown to halt the system, and we want it done now. Another
    commonly used option to shutdown is -r rather than -h. -r tells shutdown that
    you want to reboot the system rather than halt it.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_72_0.png)


    > If you are sitting at the system you want to reboot, you can, of course, use
    the -h option and then press any key to reboot as the system instructs. However,
    if you are logged in to the system from a remote location, it is very important
    to remember that the network connection will be shut down before the system is
    halted. This means that from a remote location, you cannot reboot the system using
    the -h option because you will not get the chance to press any key to reboot the
    system. The result is that the system will remain offline until someone can physically
    reboot the system. If this all seems confusing to you at this point, simply remember
    this: If you are logged in to a system that you are not physically at and you
    want to reboot it, you must use the -r option and not the -h option.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_73_0.png)


    If you come from a Windows or Macintosh background, the second parameter that
    shutdown takes (when you want it to perform the action) might seem somewhat confusing
    to you. After all, why would you ever want to issue a command that tells the system
    to shut itself down later? The main reason for wanting to do this is the multiuser
    nature of FreeBSD. On a server that can have multiple people using it, it is rather
    rude to simply shut down the system with no warning, which in effect is “pulling
    the rug” out from under the users, causing them to lose any unsaved changes they
    might have in open files, and so on. Issuing a shutdown command with a delay will
    cause broadcast messages to be sent to all users letting them know of the impending
    shutdown and what time it will occur. The messages will become more frequent as
    the shutdown time gets closer. This allows users to make sure that they have saved
    any open files and such before the shutdown actually occurs. We will look at how
    to set a delayed shutdown in a later hour.


    # Workshop


    The quiz questions are designed to test your understanding of the material covered
    in this hour.


    # Quiz


    +   1. The command to create a new directory in FreeBSD is

    +      A. `md`

    +      B. `createdir`

    +      C. `newdir`

    +      D. `mkdir`

    +      E. `makedir`

    +   2. Which of the following directory names are legal? (Choose all applicable
    answers.)

    +      A. `mydir`

    +      B. `This is a directory`

    +      C. `"My Directory"`

    +      D. `_directory1`

    +      E. `-directory2`

    +   3. The -a option to the ls command does which of the following?

    +      A. It causes all files to be listed.

    +      B. It shows files beginning with a period (.).'
  merge: -1
  img_proc: true
- pgno: 74
  md: 'C. All of the above.

    D. None of the above.

    E. The ls command does not have a -a option.


    4. The command rm * will perform which of the following actions? (Choose the best
    answer.)


    +   A. It will delete a file that is named *.

    +   B. It will delete a file that contains the * character.

    +   C. It will delete all the files in the current directory.

    +   D. It will do nothing at all because * is an illegal filename.

    +   E. rm is not a valid FreeBSD command.


    # Quiz Answers


    +   1. D is the correct answer. None of the other commands listed are valid FreeBSD
    commands.

    +   2. A, C, and D are legal directory names. B is illegal because it contains
    spaces and is not quoted. E is illegal because directory names cannot begin with
    a dash unless quoted.

    +   3. The correct answer is C.

    +   4. The best answer is C. The * is a wildcard that will match all existing
    files in the directory.'
