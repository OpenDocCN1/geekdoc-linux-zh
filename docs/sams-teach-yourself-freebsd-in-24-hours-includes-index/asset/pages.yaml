    # Process Management


    As we have mentioned in previous hours, FreeBSD is a multitasking operating system.
    This means that you can have several processes running at the same time. Many
    of them might be running in the background. You can use the ps command to see
    a list of processes that you are currently running. If you run ps with no options,
    it will give you a list of only the processes that are owned by you. Several useful
    options to ps can be used to change what it shows you. Table 4.2 shows some of
    the most common and useful ones.'
