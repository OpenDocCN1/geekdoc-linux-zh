- pgno: 41
  md: '# Hour 2


    # Installing FreeBSD


    Before you can actually use FreeBSD, you need to install it on your computer''s
    hard disk. As long as you carefully follow the instructions in this hour, this
    is a fairly simple process that you should not have any problems with. In this
    hour, you will learn:


    +   - How to begin the FreeBSD installation process

    +   - How to partition your hard disk for FreeBSD

    +   - How to install FreeBSD

    +   - How to install some additional software

    +   - How to properly shut down the system after installation is complete.


    > I suggest that you read this entire chapter before actually starting the installation.
    Also, make sure that you pick a time to do the installation when you will not
    be distracted. You will be making decisions about hard disk partitioning that
    could potentially cause you to lose existing data if you make the wrong decisions
    or press the wrong keys.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_41_0.png)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_41_1.png)'
