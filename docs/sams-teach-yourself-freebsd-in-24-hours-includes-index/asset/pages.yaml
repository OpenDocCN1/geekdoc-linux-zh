- pgno: 164
  md: '+   - `/etc/rc.conf`—The main system configuration file.

    +   - `/etc/master.passwd`—The master user database. All other user databases
    can be generated from this one.

    +   - `/etc/mail/myconfig.mc`—The Sendmail "master config" file if you have a
    custom Sendmail configuration. (The filename will vary according to what you have
    named it.)

    +   - `/etc/fstab`—Important for re-creating your disk structure.

    +   - `/usr/local/etc/*`—Individual config files for all the programs you''ve
    installed.


    These are the most critical files—the ones that define your system and give it
    its identity. All told, they won''t come to more than a few hundred kilobytes;
    those few hundred kilobytes can save weeks of painful tuning and trial-and-error
    when you rebuild the system.


    You might even want to package these files together into a tarball (a tar/gzip
    archive) and mail it to yourself (at an account not on your FreeBSD machine) on
    a daily basis. Here''s a sample one-line command to accomplish this:


    ```

    # tar cvfz /etc/rc.conf /etc/master.passwd /etc/fstab /usr/local/etc

    ► uuencode seedfiles.tar.gz | mail -s "Seed Files" me@myaccount.com

    ```


    You can put this into a shell script in /etc/periodic/daily or into root''s crontab
    file, as you prefer.


    # Summary


    In this hour, we discussed the basic concepts behind UNIX filesystems, including
    the key differences between the UNIX directory structure and the Windows/DOS one
    that you might be used to. You learned how to mount disks onto the system and
    unmount them, as well as how to format new disks. You also learned how to simplify
    the mounting process. Armed with this knowledge, you then learned how to archive
    your critical data and create effective backups using only the built-in tools
    in FreeBSD.


    A more in-depth look at these topics would go into much greater detail about potential
    backup methods. Backups are absolutely crucial to effective system administration,
    and many sophisticated tools are available that can be used with FreeBSD. So many
    exist, however, that to cover them all here would serve only to remove any certainty
    from what is already a rather convoluted process.'
