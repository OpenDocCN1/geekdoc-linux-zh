- pgno: 394
  md: '+   - OK accepts messages from the specified host, regardless of whether that
    host might fail other checks in the system (such as the anti-relaying provisions
    that we will discuss shortly).

    +   - REJECT refuses connections initiated by the specified host.

    +   - DISCARD silently drops messages after accepting them, making the sender
    think that the message has been successfully delivered.

    +   - RELAY enables relaying for the specified host, overriding other checks (as
    with OK).

    +   - 550 <message> specifies a "rejection" message that is displayed to a sender,
    matching the host specification. This message will appear during the SMTP session,
    and will be included in an error email message that is sent back to the sender.


    After you''ve made changes to /etc/mail/access, the access.db file must be regenerated.
    This is done with the make maps target, which regenerates any of the feature map
    files that have been changed since the last time make maps has been run. Follow
    this command with make restart to restart the Sendmail master process with the
    new access.db file:


    ```

    # make maps

    /usr/sbin/makemap hash access.db < access

    # make restart

    /bin/kill -HUP `head -1 /var/run/sendmail.pid`

    ```


    # Other Configuration Files


    There are more files in /etc/mail that control Sendmail''s operation: /etc/mail/virtusertable
    and /etc/mail/local-host-names are both important for advanced Sendmail configuration,
    such as an installation in which your server hosts email services for multiple
    domains. The virtusertable file allows you to set up mappings of user-names at
    other hosted domains to go to other local users'' mailboxes at your normal domain;
    think of it as an aliases file on steroids. The local-host-names file allows you
    to specify which domains you''re hosting mail for.


    The complete documentation for how to use the virtual-hosting database and other
    configuration files can be found at http://www.sendmail.org, the Sendmail Consortium''s
    Web site.


    # Controlling Sendmail


    Sendmail operates by keeping a single master process running and listening on
    port 25 for incoming connections—as well as additional processes for handling
    queue runs, sending messages to remote recipients, and other tasks. The master
    process is started at boot time from /etc/rc. Starting and stopping the Sendmail
    master process is made easy'
  merge: -1
  img_proc: true
- pgno: 395
  md: 'by Makefile and the integrated nature of the resource configuration files in
    /etc. To start the Sendmail server, simply go into /etc/mail and enter make start:


    ```

    # make start

    ( ./etc/defaults/rc.conf; source_rc_confs; if [

    ''$ {sendmail_enable}'' = ''YES'' -a -r /etc/mail/sendmail.cf ];

    then /usr/sbin/sendmail ${sendmail_flags}; fi )

    ```


    Because this command echoes its actions, you can see that it pulls in relevant
    configuration details from the systemwide resource configuration files—in which
    flags such as -q30m (do a queue run every thirty minutes) and -bd (run as a background
    daemon) are centrally specified. It will even refuse to start the process if the
    sendmail_enable variable in the rc.conf files is set to NO.


    Restarting or stopping the master process is equally simple:


    ```

    # make restart

    /bin/kill -HUP `head -1 /var/run/sendmail.pid`

    # make stop

    /bin/kill -TERM `head -1 /var/run/sendmail.pid`

    ```


    You can see what state each Sendmail process is in by using ps in wide mode in
    conjunction with grep; each process reports its position in the queue as an argument
    against its name in the process table. The following example shows the master
    process (51248) and a process in the middle of a queue run (54150):


    ```

    51248 ?? Ss 0:00.17 sendmail: accepting connections (sendmail)

    54150 ?? I 0:00.02 sendmail: /f4Q6KWV16827

    @mail.backstreetboys.com.: user open (sendmail)

    ```


    # The Message Queue


    Messages waiting to be sent by Sendmail sit in /var/spool/mqueue. In Sendmail''s
    default configuration, a new sendmail -q process is started every 30 minutes,
    stepping through each queued message and attempting to deliver it to its destination.
    This continues for five days: At the end of which, an undeliverable message is
    returned to the sender with the relevant error headers attached.


    If you have some messages in your queue, which you almost certainly will if you''ve
    been using the system for any length of time, you can browse through them at will.
    Unlike opaque systems such as Microsoft Exchange in which queue files are kept
    in a database without an easy way to tweak or even see the files waiting to be
    sent, Sendmail provides both. Queued messages are just plain-text files, capable
    of being read and edited by regular text editors. This gives the administrator
    great control over how the mail system operates; however, it also provides an
    opportunity for the administrator to abuse his'
  merge: -1
  img_proc: true
- pgno: 396
  md: "power by looking through pending messages' contents. If you run a system in\
    \ which you trust your users, be sure that they can trust you too!\n\nThe first\
    \ such tool that comes with Sendmail is called mailq, and it's a way to list the\
    \ current state of all messages waiting in the queue.\n\n```\n# mailq\n/var/spool/mqueue\
    \ (2 requests)\n--Q-ID---  --Size--  --Q-Time--  --Sender/Recipient--  -----\n\
    f4H1Ahu36976  6246 Wed May 16 18:10  MAILER-DAEMON\n    (Deferred: Operation timed\
    \ out with mlists.acmecity.com.)\n    <fred@acmecity.com>\n\nf4GkWw16827  706\
    \ Wed May 16 13:58  www\n    (host map: lookup (hotmail.com): deferred)\n    bob@hotmail.com\n\
    ```\n\nUsing mailq, you can keep an eye on what kind of mail transfer errors frequently\
    \ occur on your system. If people often forget to specify complete email addresses\
    \ or misspell common mail server hostnames, you can address that problem through\
    \ education and tutorials that you send to your users or make publicly available;\
    \ if you're getting a lot of hostname lookup errors, it might point to a configuration\
    \ problem on your end. It's an excellent diagnostic tool.\n\nThe queue also gives\
    \ you the ability to fix mistakes in messages on the way out. Let's say, for instance,\
    \ that you had an entry like the second one in the mailq output shown earlier.\
    \ The erroneous recipient domain is the result of a simple typo; you can either\
    \ wait five days for Sendmail to give up trying to find hotamil.com and send it\
    \ back to you as an error, or you can fix this problem right in the queue.\n\n\
    To do this, go into /var/spool/mqueue and look for the files matching the ID of\
    \ the entry in the mailq output. These would be the files qf f4GkWw16827 and df\
    \ f4GkWw16827; the first contains the message body, and the second contains the\
    \ message headers in an interim format. Simply open up the file with the headers\
    \ (qf f4GkWw16827) in a text editor, replace all occurrences of hotamil.com with\
    \ hotmail.com, save the file, and wait for the next queue run. The message will\
    \ go through cleanly this time.\n\nIf you can't wait that long, force a queue\
    \ run by running sendmail -q -v. This gives you the added bonus of a look into\
    \ exactly how Sendmail does its SMTP transactions with all the remote systems;\
    \ with each message it processes, it will echo to the session all the output from\
    \ the transaction, just as in our example at the beginning of the chapter. You'll\
    \ get to see all the interesting greeting messages that various administrators\
    \ program into their MTAs, visible only to other MTAs, and therefore often quite\
    \ creative and silly. You can use Ctrl+C to exit at any time—messages are removed\
    \ from the queue only after they've been successfully transferred."
  merge: -1
  img_proc: true
- pgno: 397
  md: '# Mail Relaying and Spam Control


    You can''t have a mail server online on the Internet without it being probed by
    spammers to see if they can use it for broadcasting their junk mail all over the
    world—and if they can, they will. Relaying mail means passing on messages that
    neither originate from nor end up on the local system. That''s what most spammers
    do: They connect from a remote, anonymous location to any "open" mail server that
    they can find that imposes no restrictions on who can connect to them and relay
    mail through to other servers.


    For a legitimate dial-up or remote user to use your SMTP server to send a message
    to another remote recipient, your server has to act as a relay, forwarding the
    message to the recipient even if the message didn''t originate from and wasn''t
    addressed to anyone on its machine. Functionally, as illustrated in Figure 23.2,
    this is exactly how a spammer would send an unsolicited message to the same recipient
    through the same SMTP server: It must relay.


    FIGURE 23.2

    Relaying. Spammers and legitimate users, if they''re not local to S1, must use
    S1 as a relay to forward their messages to S2.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_397_0.png)


    Relaying is usually allowed by what''s known as the MX record, a line in the SMTP
    server''s network DNS database (either served from the same machine as the SMTP
    server or another server in the same network) that tells all the machines within
    that network that your SMTP server (S1) is a legitimate Mail eXchanger for them.
    Sendmail, in its default configuration on FreeBSD, will accept mail from senders
    whose MX record points to S1, defining it as the MTA for the network. This prevents
    people outside the network from using S1 as a relay; if they try, their messages
    will be bounced back with a `Relaying denied error.`'
  merge: -1
  img_proc: true
- pgno: 398
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_398_0.png)


    You can find out what the registered MX host is for a domain by using the host
    command:

    You can then connect directly to this host, mail-1.somecompany.com, to perform
    raw SMTP transactions (for testing purposes, for example).


    ```

    # host somecompany.com

    somecompany.com has address 164.199.3.78

    somecompany.com mail is handled (pri=30) by mail-1.somecompany.com

    ```


    The problem commonly faced, though, is that this setup is great for ISPs or enterprise
    networks that have a fully defined network, DNS entries for all its hosts, and
    a proper MX record pointing to the relaying SMTP server. But what about standalone
    Internet hosts, which might have users all over the world trying to use it to
    transmit mail? Each of these users, when trying to send a message through S1 from
    wherever they happen to be, will get a Relaying denied error back unless S1 has
    been specifically configured to allow them to relay. There are a number of ways
    to do this; each method has its benefits and drawbacks, but because they all decrease
    the security of your system to some degree, you should consider them only if absolutely
    necessary and appropriate to your system''s role as a mail server.


    +   - Add “trusted” sender domains to the file `/etc/mail/relay-domains`, which
    doesn’t exist in the default installation. Any host within a listed domain will
    be permitted to relay through your server. You have to restart Sendmail after
    modifying this file. This is easy and effective, but as soon as you add a large,
    popular domain to this file that might contain spammers as well as legitimate
    senders, its benefit is lost.

    +   - Use the access database (`/etc/mail/access`). This feature allows you to
    set up an OK or RELAY rule for each known host or domain from which your users
    will be connecting. This works well for small impromptu networks or for a few
    remote hosts at easily identifiable addresses, but it doesn’t scale well for a
    lot of users on dynamic addresses.

    +   - Enable any of the five or six relaying exception features available in Sendmail
    by adding them to `/etc/mail/freebsd.mc` and regenerating the `sendmail.cf` file
    (as shown earlier). There’s a feature that enables you to allow relaying based
    on whether the From: header is set to an address at your domain (`relay_local_from`)—though
    this is easily forged by spammers and therefore the feature isn’t usually advisable.
    There’s also an optional feature to perform a check against one of the Realtime
    Blackhole Lists, which are centrally maintained databases of known spammers (and
    which often require you to subscribe for a fee).'
  merge: -1
  img_proc: true
- pgno: 399
  md: 'This feature is in the default freebsd.mc, but commented out; to enable it,
    remove the dn1 comment and rebuild the config file.


    +   - As an absolute last resort, turn off relay checking altogether by enabling
    the promiscuous_relay feature. This will allow any valid user to send mail through
    your Sendmail server; however, it will also allow any spammer to do the same.
    There are independently run databases on the Internet that keep records of all
    "open" mail servers, and some service providers use these databases as "black
    hole" lists of their own. You don''t want your server to end up in these databases!
    If it does, some legitimate mail from your users or their correspondents might
    be blocked because of their ISPs blocking mail to or from your server. It''s an
    incredibly bad idea to run an open mail server. However, if your server is in
    a secure network environment (for example, inside an enterprise network protected
    by a NAT firewall), it can eliminate a great deal of unnecessary hassle associated
    with securing the server.


    As a general rule, the best solution to the relaying problem is simply to instruct
    all your users to use the SMTP servers provided by their own dial-up ISPs. These
    services will always have their own SMTP servers that are open to their own customers.
    Because the headers in a mail message (such as the From: address) are all derived
    from the message body and therefore completely under the control of the email
    client program, there''s no reason for a remote user to want to use your SMTP
    server if he already has one of his own.


    The Sendmail Consortium has an excellent page on relaying rules and your various
    available configuration options at http://www.sendmail.org/tips/relaying.html.


    # Summary


    In this hour, you learned the basics of running an SMTP server using Sendmail.
    You saw how SMTP is structured, how messages travel from one user to another via
    SMTP and POP/IMAP, and you saw how to tweak Sendmail to behave according to your
    personal tastes.


    Sendmail is one of the largest and most complex beasts in UNIX. A full treatment
    of Sendmail-based email services would cover the numerous methods for customizing
    Sendmail in a large ISP or enterprise configuration. It would also discuss how
    to set up POP3 and IMAP servers for that "last mile" of the connection, as well
    as discussing MTAs that are designed as better, faster, more scalable, and easier-to-use
    alternatives to Sendmail. But what you have seen here is the core of what makes
    Sendmail itself the workhorse of the Internet: an unglamorous job, but one that
    it does very well nonetheless.'
  merge: -1
  img_proc: true
- pgno: 400
  md: '# Q&A


    **Q** Mail is bouncing back to me with an error of "Cannot resolve hostname".
    What do I do?


    **A** Make sure that your FreeBSD machine has a valid reverse DNS lookup record.
    Type `nslookup 111.112.113.114`, using your machine''s IP address instead of 111.112.113.114.
    If you don''t get your machine''s correct hostname back, talk to your network
    administrator and get the reverse DNS record fixed (generally by making sure that
    there is a valid record for your machine''s IP address that points to resolvable
    hostname).


    **Q** I added some aliases to `/etc/mail/aliases`, but sending mail to those addresses
    doesn''t obey the aliases I set up.


    **A** You need to regenerate the alias database. Go into `/etc/mail` and type
    `make aliases`, or use the `newaliases` command.


    **Q** I''m trying to send mail through my server, and I keep getting Relaying
    denied errors!


    **A** Sendmail is behaving the way it should in the Internet age: It''s not letting
    your mail through if you''re not a local user and aren''t sending to a local user.
    You will need to exempt yourself from the anti-relaying rules by adding your desktop
    machine''s IP address or subnet address to `/etc/mail/access`, with a RELAY rule,
    just as one example of a solution.


    **Q** Sendmail is too big and ugly. I feel confident in my ability to install
    and use something else. What do you recommend?


    **A** The most popular Sendmail replacement is Postfix, written by Wietse Venema.
    See http://www.postfix.org for more; you can install it from the ports (`/usr/ports/mail/postfix`).
    FreeBSD is designed to allow Postfix to be installed as a drop-in replacement
    for Sendmail, via `/etc/mail/mailer.conf`. See `man mailer.conf` for details.
    You might also want to look into Qmail, which is faster and more secure than Sendmail.


    # Workshop


    This section is designed to answer common questions that come up about Sendmail
    and SMTP concepts, as well as to solidify your understanding of email services
    with quiz questions and exercises for further exploration.'
