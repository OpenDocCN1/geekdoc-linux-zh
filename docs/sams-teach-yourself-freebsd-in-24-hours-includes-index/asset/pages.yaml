- pgno: 258
  md: '+   - Make sure that your modem is not a WinModem. Check your computer''s documentation
    to see if you can determine the modem manufacturer and chipset; if it''s a Lucent
    WinModem, you may be able to make it work with the ltmdm port, as discussed earlier;
    you may be better off, though, picking up a real, standard UART-based modem instead.


    # The Modem Dials but Never Establishes a Connection


    +   - Make sure that you are using the correct login name and password. Also,
    don''t confuse your FreeBSD login name and password with your Internet login name
    and password. They are not the same.

    +   - Make sure that you are using the correct authentication type that your ISP
    expects. When in doubt, create both the pap-secrets and chap-secrets file to ensure
    that your system is ready to handle whichever authentication your ISP requests.

    +   - If you have a static IP address, make sure that you are using the correct
    one in /etc/ppp/options.

    +   - Check your modem handbook and see if it needs a special initialization string.
    If so, you can supply it in the chat.script file; if your modem''s initialization
    string, for example, is AT&F, you can add the string AT&F 0K into the script right
    after the ATZ 0K part.

    +   - If you have Windows or another system available, see if you can establish
    a connection from there. If not, and if calls to tech support have failed to resolve
    the issue, it might be worth contacting your phone company to see if something
    is wrong with your phone line that is causing an excessive amount of line noise.
    Another symptom of excessive line noise is disconnections that happen on a regular
    basis for no apparent reason.


    If you use the same phone line for voice calls that you do for dialing up, a noisy
    line can cause static in your voice calls as well; that''s one way you can tell
    the quality of your lines.


    # The Modem Establishes a Connection, but You Can''t Access Any Web Sites, and
    so on After the Connection Has Been Made


    +   - Make sure that you have the correct DNS servers for your ISP listed in /etc/resolv.conf.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '+   - Check the /etc/host.conf file and make sure it contains a line that says
    hosts followed by a line that says bind, as follows:

    +   ```

    +   # $FreeBSD: src/etc/host.conf,v 1.6 1999/08/27 23:23:41 peter Exp $

    +   # First try the /etc/hosts file

    +   hosts

    +   # Now try the nameserver next.

    +   bind

    +   ```

    +   - If you have a static IP address, make sure that you are using the correct
    one in /etc/ppp/options.

    +   - If your ISP gave you a gateway address, make sure that you have it listed
    following the colon after your IP address and make sure that it is the correct
    address.


    # Dial-on-demand Sometimes Dials the Modem Even when You Aren’t Trying to Use
    the Internet


    +   - This means that some program running the background is probably trying to
    connect to the Internet. More than likely, one or more parts of the email system
    are the culprit. Information on how to stop this behavior can be found in Hour
    23.


    # The Internet Connection Never Drops Even Though You Have an Idle Value Set in
    the options File and You Are Not Using the Internet


    +   - This is usually caused by the same culprits that cause the previous problem.
    More than likely, some part of the email system is polling a mail server at your
    ISP on a regular basis—thus causing the connection to stay up. Information on
    how to stop this behavior can be found in Hour 23.


    # Summary


    This hour’s lesson covered the basic knowledge you will need to have when connecting
    a FreeBSD machine to the Internet via a modem. FreeBSD isn’t anywhere nearly as
    easy to set up for PPP connections as Windows or the Mac are, nor is it for certain
    that the ISP with which you have your account will be able to help you troubleshoot
    your connection. However, PPP is PPP no matter what the platform; with a little
    bit of experimentation and tweaking, your FreeBSD machine will be able to harness
    PPP every bit as effectively as the more popular platforms can.'
  merge: -1
