    # Customizing Your KDE Desktop


    You can do several things to customize your desktop. The most common such customization
    is a desktop background image; KDE supports this as well as the capability to
    rearrange your menu bar or add new icons for commonly-accessed programs. We will
    start by looking at how to change the background.


