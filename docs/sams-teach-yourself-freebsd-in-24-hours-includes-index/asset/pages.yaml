    The correct answer is B.


    # Exercises


    1. What makes UNIX-style filesystems different from what you might know from Windows?
    One big difference is fragmentation, or how readily files get split into little
    chunks and written into widely disparate places all across the disk, leading to
    increased access time and decreased performance. Windows/MS-DOS filesystems can
    become badly fragmented over time, with as much as 20 or 30% of the files being
    split across the disk; but UNIX disks very seldom do. Why is that? You might want
    to read up on the UFS/FFS filesystem (and others, such as Ext2FS) and how it ensures
    that when it writes files onto the disk, it creates them in contiguous blocks
    by moving other files around on a continuous basis. This is why FreeBSD reports
    fragmentation figures of around 1% at boot time, but it never gets much higher
    than that.'
  merge: -1
  img_proc: true
- pgno: 168
  md: 2. What’s a weakness of having the filesystem move files around the disk all
    the time? One downside is that if there’s a power failure, the pending write operations
    vanish into the ether, and some files that were waiting to get rewritten might
    be lost. Some methods are available for protecting against this, however. *Journaling*
    is one technique that is becoming increasingly popular in advanced filesystems.
    FreeBSD has a similar technology called *Soft Updates*. Research these technologies
    online, if you are interested, and see how they each go about addressing the problem
    of making UNIX filesystems even more fault-tolerant than they already are.
