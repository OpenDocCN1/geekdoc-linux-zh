  md: 'guest user to print. Guest users and share-level security are a somewhat advanced
    topic; refer to the Samba Web site, or to the how-to guide at http://samba.linuxxbe.org/en/samba/config/share-1.html,
    for further documentation on how to use it.


    # Access Control


    The default method for controlling access to Samba shares is called *user-level
    security*. In this scheme, the client presents a username/password pair to the
    server upon the initial setup of the connection. The server determines whether
    to accept the client based on the username/password pair and the identity of the
    client machine itself. If it accepts the client, all shares are accessible.


    It can be tricky to set up user-level security properly. The Windows username,
    which is defined either when the Windows user logs in to a local profile or to
    a domain controller, must exist on the Samba server as a regular UNIX user (or
    mapped to a UNIX user). For instance, if the Windows user Harris logs on to his
    Windows machine, opens up the Network Neighborhood window, and tries to connect
    to our Samba server, he will be denied access (and given a password prompt for
    a share called `\\STRIPES\\IPC$`) unless the user harris exists on the UNIX machine.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_420_0.png)


    > In Windows NT/2000, the password prompt allows you to enter a username as well
    as a password. However, in Windows 95/98/ME, all you get is a password prompt,
    and the username is derived from the login name.


    Samba users must exist in a password database at `/usr/local/private/smbpasswd`,
    which is similar to `/etc/master.passwd` in that encrypted passwords are stored
    in it for each local UNIX user. When Samba is installed, users from `/etc/master.passwd`
    are converted into Samba format and placed into `/usr/local/private/smbpasswd`
    with both the LANMAN password and the Windows NT password (both are present for
    compatibility) set to strings of 16 X characters—an invalid password, indicating
    that the user cannot log in.


    To enable a user, you must set the password to something valid. This is done with
    the `smbpasswd` program. It works similarly to `passwd`, prompting you for your
    old Samba password and then requiring you to enter a new one twice unless you''re
    root—in which case, you need not supply the old password, and you can change any
    user''s password as well as your own.'
  merge: -1
  img_proc: true
