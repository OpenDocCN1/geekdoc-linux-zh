    # Basic Security and Access Control


    Apache includes some basic built-in security features that allow primitive access
    control to Web sites on the server. There are two ways that you can control access
    to various parts of the Web server. The first is by hostname or IP address. In
    this case, only hosts that have a certain name or IP address will be allowed to
    access the protected areas of the site.


    The second is by username and password. In this case, a valid username and password
    is required to access the protected areas of the site.


    The file that is used to control access to a directory is .htaccess. First, we
    will look at how to control access based on hostname or IP address.


    # Controlling Access by Hostnames or IP Address


    Two complementary commands can be used to control access to a directory—Allow
    and Deny. The order in which these directives are read by Apache is important;
    it determines whether you want to create a policy of “exclude all visitors except
    those I specify” or “include all visitors except those I specify.” This ordering
    is done with the Order directive in the .htaccess file. The Order directive tells
    Apache which set of lines—either Allow or Deny—to read first, regardless of how
    they are listed in the file. For example, to have the Deny statements read before
    the Allow statements, the line in .htaccess would look like this:


    ```

    Order Deny,Allow

    ```


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_379_0.png)'
  merge: -1
  img_proc: true
- pgno: 380
  md: 'You can then simply specify what hosts and addresses you want to allow and
    deny access to. Here are some sample statements that could exist in the .htaccess
    file following the Order statement:


    ```

    Deny from all

    Allow from mycompany.com

    Allow from lion.simba.org

    ```


    In this case, almost all addresses are denied access to the directory where the
    .htaccess file is located. The only exceptions to the Deny from all rule are hosts
    located inside the mycompany.com domain, and hosts in lion.simba.org.


    There might be other times when you want to allow access to everyone except those
    from a few specific domains. In this case, you will want to change the Order statement
    to tell Apache to read the Allow statements first and then the Deny statements
    (Order Allow,Deny). The rest of the file might look something like the following:


    ```

    Allow from all

    Deny from lamespammer.com

    Deny from 122.101.122.211

    Deny from spammer.mail.com

    ```


    In this case, everyone is allowed except for people from the domains lamespammer.com,
    spammer.mail.com, and the host with the IP address 122.101.122.211.


    # Restricting Access by Username and Password


    Controlling access by hostnames or IP address doesn’t work for all situations.
    For example, most users have dynamic IP addresses from their ISP. That is, their
    IP address is assigned randomly from a pool of IP addresses available to their
    ISP. In this case, you can’t rely on access by hostname or IP address to provide
    these users with access to protected areas of the site. In this case, you can
    use usernames and passwords.


    To create a password protected directory, once again you will want to place an
    .htaccess file in the directory that you want to have protected. The file must
    contain, at a minimum, the following four entries:


    ```

    AuthType

    ```


    This will almost always be set to "Basic".'
  merge: -1
  img_proc: true
