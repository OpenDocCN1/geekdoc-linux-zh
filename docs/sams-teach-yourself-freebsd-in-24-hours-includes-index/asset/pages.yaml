  md: '# Blackbox


    Blackbox is a no-frills window manager that is quite popular on servers and also
    on many people''s workstations. Figure 19.2, shown earlier, illustrates the Blackbox
    window manager.


    Blackbox''s main selling point is that it requires very few resources, and, as
    such, it will run well even on slow systems. Blackbox can also run applications
    created for the Windowmaker dock.


    # XFCE


    XFCE is a desktop environment that is loosely based on the CDE window manager
    (the standard UNIX desktop for Sun, AIX, and HP). Figure 19.4 shows XFCE.


    FIGURE 19.4


    The XFCE desktop environment.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_335_0.png)


    XFCE is based on the GTK toolkit, which is the same toolkit that GNOME is based
    on. This means that it integrates well with applications that use GTK. (GTK is
    a popular programming toolkit for designing graphical applications for X Windows.)
    GTK applications will inherit such things as color preferences from XFCE.


    # IceWM


    IceWM is another window manager with a relatively small footprint. It resembles
    Windows 95 and OS/2, but is not as easy to configure. It also doesn''t support
    all the features of these two desktops.


    One nice thing about IceWM is that it works well with GNOME. We didn''t cover
    GNOME in this book, but as far as full-featured desktop environments go, GNOME
    is the most significant competitor to KDE. However, unlike KDE, GNOME does not
    have its own window manager. Instead, it relies on an external window manager
    that is "GNOME aware". Such window managers include Enlightenment, Sawfish, and'
  merge: -1
  img_proc: true
