- pgno: 97
  md: '# Hour 5


    # Users and Groups


    Because FreeBSD supports multiple users, security is necessary in order to ensure
    privacy so that users cannot interfere with each other or have access to things
    they shouldn’t be able to access. FreeBSD implements this security through a system
    of ownership (that works on individual users as well as groups) that allows collaboration
    on projects while still ensuring privacy and protection against unauthorized access.


    In this hour, you will learn:


    +   - How FreeBSD enables multiple users to use the same system

    +   - Why it is beneficial to have more than one user—even if you are the only
    person using the system

    +   - Why FreeBSD has groups and how to use them

    +   - How to add new users to FreeBSD

    +   - How to remove existing users from FreeBSD


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_97_0.png)'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Multiuser Capabilities of FreeBSD


    FreeBSD is a multiuser operating system, which means that several users can use
    the operating system at the same time while doing different things. At first,
    this might be a difficult concept for Windows and Macintosh users to grasp. Those
    familiar with either of these systems might be tempted to think that Windows,
    for example, is a multiser operating system because multiple people can be logged
    into to a Windows server and use a database that is running on it. However, this
    is not true multiuser capability. The only thing you are getting with this system
    is client-server functionality. You are not using the remote operating system
    itself but only the services that it provides. With FreeBSD, it is possible for
    several people to be accessing the operating system at the same time through remote
    terminals and have all the functionality as if they were sitting at the physical
    system.


    You might think that this multiuser capability is not important if you are just
    running FreeBSD on a workstation or on a home system. But even then, it can be
    a very useful thing to have. For one thing, keeping individual users separate
    allows each user to have his own profile, meaning that you won’t have to fight
    with other family members about what kind of wallpaper should be on the desktop,
    for example, or what sound scheme should be used. Each person can set up the system
    according to their personal preferences without affecting how the system looks
    and works for other users.


    Another benefit is that you have assurance that other users cannot accidentally
    delete your files. And if you would like, you can make sure that other users cannot
    access or read your private files.


    One other benefit of having multiple users is not so obvious. As we mentioned
    previously, FreeBSD can allow multiple users to use the system at the same time.
    As a demonstration, do the following steps:


    +   1. Log in using your normal user account. At the command prompt, start a program
    such as the ee editor by typing ee.

    +   2. Press ALT+F2. This should give you a new login prompt. Log in using the
    same username you logged in with the first time.

    +   3. Issue a find command for any file you choose and have it search the entire
    hard disk. The only reason for this is to ensure that you supply FreeBSD with
    something to do that will take a while to complete.

    +   4. Press ALT+F1, and you should be taken back to your original login prompt
    with the editor still running. Type some text in the editor window.

    +   5. Press Alt+F2 again, and you should be taken back to the second window with
    the find command still running.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '6. Press ALT+F1 again, and you will be taken back to the editor. Exit the editor
    so that you are back at the command prompt.


    Type who at the command prompt, and the system will respond with something like
    the following:


    ```

    simba ttyP0 Jul 6 16:10 (localhost)

    simba ttyP1 Jul 6 18:31 (localhost)

    ```


    The output of the who command shows that you are currently logged on twice. And
    the previous exercise demonstrated that you can switch between your two logins
    and perform tasks that are completely independent of each other. This is one way
    that you can use FreeBSD''s multiuser capabilities to your advantage even if you
    are the only user of the system. If you start a task that is going to take a while
    and you want to keep on working while that task is completing, you can simply
    switch to another virtual terminal using the ALT+Fx key combination (where x is
    one of the numbers on the function keys) to continue working while the other task
    runs in the other terminal.


    Press ALT+F2 again to switch back to the second terminal. If the find command
    is still running, press CTRL+C to terminate it and then type exit at the command
    prompt to log out. (If you want to clear the screen first, use the clear command
    before issuing the exit command.)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_99_0.png)


    > When you are finished working, make sure that you log out of all the virtual
    terminals you are logged in to. If you forget and leave one or more open, someone
    else could access your account through it. You can always use the who command
    to check how many times you are currently logged in to the system.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_99_1.png)


    > By default, FreeBSD has seven virtual terminals that can be accessed with the
    function keys F1 through F8. F7 will usually be blank because it is reserved for
    the X Window System, so there will be no terminal running on it.


    # Adding Users to FreeBSD


    The command to add new users to FreeBSD is adduser. The first time you run it,
    it will ask you a lot of questions. Don''t worry. You won''t have to answer all
    of these questions every time you run adduser. Listing 6.1 walks you through a
    typical adduser session when running it for the first time.'
  merge: -1
  img_proc: true
