  md: '# Quiz Answers


    +   1. Either C or D are correct—trick question! `/usr/sbin/sendmail` is what
    you would call from a program or the command line; but it''s really a "wrapper"
    that calls `/usr/libexec/sendmail/sendmail`. If you were to "drop in" Postfix
    as a replacement, `/usr/sbin/sendmail` would simply change where it pointed.

    +   2. The correct answer is D.

    +   3. The correct answer is A. Remember to compile a new `sendmail.cf` and restart
    Sendmail after editing the Master Config file.

    +   4. The correct answer is C.

    +   5. The correct answer is A; use per-host exceptions to prevent `Relaying denied`
    errors on your own messages.

    +   6. The correct answer is C. Don''t use this unless you absolutely have to,
    or if you''re positive that your server is in a situation in which it''s at no
    risk of being made into a spam relay.


    # Exercises


    +   1. Explore the myriad uses for the `aliases` database. Try creating a mailing
    list that''s really just an alias which reads in the contents of a text file full
