- pgno: 127
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_127_0.png)


    # Hour 7


    # System Configuration and Startup Scripts


    Every computer is different; each machine in use in the world today has its own
    customized behavior set by its owner, which controls how it behaves, what services
    or programs it runs, and what it should do automatically when it''s booted up.
    In the case of FreeBSD and other UNIX operating systems that have the capacity
    to be used as servers on the Internet, it''s exceptionally important to be able
    to tune your system so that it''s optimized either for serving clients over the
    network or for running as a desktop workstation.


    For most users, the process by which FreeBSD starts up—probing for installed devices,
    bootstrapping its various disk partitions, launching the kernel, mounting filesystems,
    and doing all the little housecleaning duties necessary for an efficient multiuser
    operating system—is of little interest. However, if you want to configure your
    system to your taste, it''s a good idea to have some understanding of what FreeBSD
    is doing when it spews all those mysterious lines onto your screen after you turn
    on the computer.'
  merge: -1
  img_proc: true
- pgno: 128
  md: 'In this hour, you will learn:


    +   - The steps by which FreeBSD raises itself to higher and higher levels of
    consciousness during boot

    +   - What all those mysterious files in `/etc` are used for

    +   - How to use `/etc/rc.conf` to configure your system

    +   - What the `inetd` "super-server" is used for and how to configure it

    +   - How to manage `syslogd`, the system logger


    # Understanding the FreeBSD Startup Process


    When an operating system starts up after you power it on, it undergoes a rather
    remarkable transformation from a dormant set of ones and zeroes on a disk to a
    humming, vibrant creature with hundreds of interacting processes jostling with
    each other throughout memory and the disks. When you think about it, the capability
    of an operating system to "pull itself up by its own bootstraps"—or, as we term
    it colloquially, to "boot"—is quite a feat. It''s comparable to a clutch in a
    car, allowing the engine (which must be running, even when the car is stopped)
    to gradually transfer power to the stopped wheels so that they can start turning
    without killing the engine.


    The computer''s hardware BIOS, or basic input/output system, knows next to nothing
    about the operating system. All it knows is where to find the hard disks that
    are in the system and how to execute a tiny piece of code that can be found on
    one of them. After it does that, the hardware''s job is done. It''s all up to
    that tiny piece of code on the startup disk to find larger pieces of code and
    execute them; those pieces of code continue executing larger and larger programs
    that know progressively more and more about what kind of operating system you''re
    running and how to start it up. All operating systems boot in more or less the
    same way, but whatever the platform, booting is an ingeniously designed process—at
    heart a "hack," but well developed and understood by today''s operating systems.


    FreeBSD''s boot process involves multiple stages, with each stage typically having
    a very limited function and scope and executing one crucial step before passing
    off control to the next stage. We will now examine each of these stages in order
    to see what they do. Chances are that you won''t ever need to know the details
    of what happens when the system is starting up, but knowing them can''t hurt.


    Figure 7.1 shows a diagram of your startup disk. This disk contains multiple slices—each
    of which can contain a different bootable operating system; each FreeBSD slice
    contains multiple BSD partitions. Inside the "root" BSD partition is the kernel.
    Each of these levels must have a tiny piece of software that knows how to get
    into the next level.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# FIGURE 7.1


    A hard disk, its levels of partitions, and the boot blocks.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_129_0.png)


    When you first power on the machine, the first thing it does is run the hardware
    checks and probes specified by the BIOS and the CMOS configuration. The hardware
    check and probe runs the memory check and the IDE or SCSI exploration that you
    see before the screen is cleared for the first time. This step is not OS specific:
    it happens the same way, no matter what you have installed on the machine. After
    it prints the table showing the hardware data it has collected, the BIOS reads
    the *Master Boot Record (MBR)* of the primary disk for the first preliminary boot
    block. It is the job of this and the next two boot blocks to find and run the
    *loader*, which configures and loads the kernel. Each of the boot blocks is sequentially
    a little more complex than the last; the first two are limited to 512 bytes in
    size (by the size of the MBR and the size of the boot sector of a slice), so they
    are both very simple. We will now look at each of the boot blocks in turn to see
    what their functions are.


    +   - **Boot block 0 (boot0).** This preliminary boot block is what sits in the
    MBR and lists the available disk slices (the F-key commands that follow) from
    which you can choose what you want to boot. We will be talking more about disk
    slices (which most operating systems refer to as *partitions*) in the Hour 8''s
    lesson, "Storage Systems and Backup Utilities."


    ```

    F1 FreeBSD

    F2 Linux

    F3 ??


    Default: F1

    ```


    You can press the appropriate F key to select the slice you want, or else just
    wait for several seconds—it will choose the default selection and continue.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '+   - **Boot block 1 (boot1)**. This is a very simple program that runs from
    the boot sector of the slice you selected in boot0, and its job is to use a stripped-down
    version of disklabel (what divides a slice up into BSD-style partitions, which
    we will cover in the next hour) to find and run boot2 in the appropriate partition.
    There is no user-interface portion to boot1.

    +   - **Boot block 2 (boot2)**. Finally, you reach a boot block that has enough
    elbow room to have the necessary complexity to read files on the bootable filesystem
    in its BSD partition. The job of boot2 is to run a program called loader, which
    gives you a user interface that allows you to control the way the kernel loads.
    We will get to the kernel shortly.

    +   - **loader**. You can find this program in the /boot directory. It reads the
    /boot/defaults/loader.conf and /boot/loader.conf configuration files, and loads
    the kernel and modules specified there. (The /boot/loader.conf file contains the
    overrides to /boot/defaults/loader.conf, in a similar fashion to the way /etc/rc.conf
    works, which we will cover later in this hour.)


    The loader counts down 10 seconds while it waits for a key press from you; if
    it doesn''t get one, it boots the kernel in its default state. However, if you
    press Enter, it will put you into its command prompt interface in which you can
    control precisely your kernel boot procedure. You can boot in single-user mode
    (boot -s), boot an old kernel (boot kernel.old), boot from CD-ROM (boot -c), load
    and unload kernel modules one by one, view the contents of files (more), or perform
    a number of other tasks (see man boot for details). This should all be unnecessary
    most of the time. Usually, you will boot in the default configuration. Pressing
    ? at the ok prompt gives you a list of available commands, if you''re curious.
    For further details on the options available at the loader command line, consult
    man loader.


    This concludes the boot block phase of the bootstrapping process. We''re now well
    on the way to bringing the system all the way up. The final phase of the boot
    process is where the complete FreeBSD system starts to come into play; where the
    kernel loads itself into memory, probes its available devices, and runs the "resource
    configuration" scripts that construct a working environment and start up the various
    system services.


    +   - **kernel**. After loader transfers control, the kernel begins to probe all
    the devices it can find, and the results of each probe are echoed to the screen.
    This is the time when you will see many boot messages. These messages are logged
    in to the dmesg kernel buffer, which you can read with the dmesg command if you
    need to see what the kernel has to say about a certain device.'
  merge: -1
  img_proc: true
- pgno: 131
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_131_0.png)


    > `dmesg` is a fairly rudimentary tool, listing the contents of the system message
    buffer that have accumulated since the system last booted. Simply enter `dmesg`
    to view the list of messages or enter `dmesg | less` to view the output in an
    interactive pager for easier access.


    +   - **init**. After the kernel loads, it passes control to the `init` process,
    the final stage in the startup procedure. This is signaled by the Automatic reboot
    in progress message, which involves `init` running the Resource Configuration
    script (`/etc/rc`). This script first checks all the filesystem devices in `/etc/fstab`
    for consistency, using the `fsck` (FileSystem Consistency check) program. If `fsck`
    finds no problems that it cannot correct on its own, it will mount all the filesystems
    (using `mount -a -t nonfs`) and continue running the rest of the startup processes.
    If `fsck` finds an unresolvable problem with the disks, it will exit to single-user
    mode for you to run `fsck` manually and repair the damage. Exit the single-user
    shell to continue rebooting into multiuser mode.


    Finally, if all goes according to plan, you get a login prompt. This whole process
    usually takes no more than a minute.


    # Resource Configuration Scripts


    After `init` has been started, the remaining startup tasks in the system—the ones
    that start up all the services and operating system processes—are handled by the
    Resource Configuration scripts. These scripts can all be found inside the `/etc/rc.d`
    directory, which usually means “Resource Configuration Directory” (depending on
    who you ask).


    Anything in `/etc/rc.d` is a resource configuration script, a program that starts
    up parts of FreeBSD according to the system’s configuration. Some are called recursively
    from other programs, some do nothing in the out-of-the-box configuration, and
    some will probably never even be run. You will generally never need to modify
    any of the files in `/etc/rc.d`.


    A few other files are in `/etc`, however, that you will be modifying in order
    to configure your system. A list of some of the important resource configuration
    scripts that FreeBSD uses is shown in Table 7.1.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# TABLE 7.1 Resource Configuration Scripts


    | Script Name | Description |

    |---|---|

    | `/etc/rc` | The main resource config script. |

    | `/etc/defaults/rc.conf` | init reads in this file early to fill in its laundry
    list of tasks to do. |

    | `/etc/rc.conf` | This is the file you edit to override defaults set in /etc/defaults/rc.conf.
    This should be the only resource config file in /etc that you edit. |

    | `/etc/rc.d/diskless` | init reads this script if you''re doing a diskless boot
    via BOOTP. |

    | `/etc/rc.d/serial` | Sets up terminals and other serial devices. |

    | `/etc/rc.d/pccard` | Runs the PC-card daemon for laptops. |

    | `/etc/rc.d/network#` | Scripts that set up TCP/IP networking. |

    | `/etc/rc.d/network_ipv6` | Same as rc.network, except for IPv6 services. |

    | `/etc/rc.d/atm` | Called from rc.network; sets up ATM devices for WAN machines.
    |

    | `/etc/rc.d/ipfw` | Called from rc.network; configures an ipfw firewall. |

    | `/etc/rc.d/ip6fw` | Called from rc.network6; configures an ip6fw firewall. |

    | `/etc/rc.d/devfs` | Configures the device filesystem. See Hour 10, "The FreeBSD
    Kernel and the Device Tree." for more on this file. |

    | `/etc/rc.d/sysctl` | Sets kernel variables specified in /etc/sysctl.conf. |

    | `/etc/rc.d/syscons` | Sets up console settings. |

    | `/usr/local/etc/rc.d/` |  |

    | `/usr/local/X11R6/etc/rc.d/` | Directory trees containing any new startup scripts
    you add (or are installed automatically by programs). |


    # Modifying System Settings


    The main resource configuration script, /etc/rc, is a completely automated "harness"
    that reads in a global configuration file and then executes a series of other
    scripts from /etc/rc.d in a specific order. Now that you know what the /etc/rc.d
    scripts do, we can look at how to configure the behavior of /etc/rc.


    # The /etc/defaults/rc.conf File


    The /etc/rc program is a shell script that operates based on the states of dozens
    of different variables. If a certain variable (for instance, sendmail_enable)
    is set to YES, /etc/rc will run the /etc/rc.d script that starts Sendmail. If
    the variable is set to NO, it does not run the Sendmail script.'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'FreeBSD is installed with a file that defines all the default states for all
    the variables that have meaning to /etc/rc. This file is /etc/defaults/rc.conf.
    The first thing /etc/rc does is to read in this file so that it knows what default
    assumptions to use for all its configuration variables.


    Let''s look at a typical block in /etc/defaults/rc.conf, shown in Listing 7.1.


    # LISTING 7.1 Excerpt from /etc/defaults/rc.conf


    ```

    # named. It may be possible to run named in a sandbox, man security for

    # details.

    #

    named_enable="NO"      # Run named, the DNS server (or NO).

    named_program="named"  # path to named, if you want a different one.

    named_flags=""         # Flags for named

    #named_flags="-u bind -g bind"  # Flags for named

    ```


    By looking through /etc/defaults/rc.conf, you can find what /etc/rc will do unless
    you explicitly override it. In this case, you can see that the default behavior
    is to not run named at all.


    # The /etc/rc.conf File


    How do you override the default settings in /etc/defaults/rc.conf? You do it with
    /etc/rc.conf, which is read into /etc/rc immediately after it reads in the defaults.
    FreeBSD can operate just fine without an /etc/rc.conf file present at all; it''s
    just a plain text file that you can create manually in a text editor, with one
    variable per line. You only have to add the variables to this file that you want
    to override so that your desired value is used instead of the default value. After
    you make configuration changes with sysinstall, certain variables related to those
    changes are written out automatically by that program into /etc/rc.conf. You can
    see what''s in yours by using more /etc/rc.conf.


    Let''s say that we do want to run named. In the simplest case, all we would have
    to do is edit /etc/rc.conf (the overrides file) and add the following line anywhere
    in the file:


    ```

    named_enable="YES"

    ```


    The rest of the named_* variables in /etc/defaults/rc.conf do not need to be copied
    into the overrides file; remember, every variable in the defaults file is loaded
    into memory by init, and they only matter if the "master switch" for that block
    has been turned to "YES". If it has, the variables will be used in the execution
    loop in /etc/rc to launch whatever process is controlled by the block we''re working
    on (in this case, named).'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'You can use these other variables for fine-tuning, though, and you can override
    them just as easily. Let''s say that your name server program was a customized
    version called mynamed. Let''s also say that you created a bind user and group,
    intending that the name server should run as this user and group so that it won''t
    be susceptible to as many security hacks. Well, to handle that, all you need to
    do (assuming that mynamed has the same behavior and command-line options as named)
    is add these two lines to /etc/rc.conf:


    ```

    named_program="mynamed"

    named_flags="-u bind -g bind"

    ```


    From now on, when you boot the system and see named appear in the console messages
    after Doing additional network setup:, you know that it''s applying your overrides
    over the defaults and running the name server automatically.


    The most typical variables that appear in /etc/rc.conf are the TCP/IP configuration
    parameters because they will naturally be different for every system; FreeBSD
    can''t very well specify them in the defaults, after all. Listing 7.2 shows a
    typical /etc/rc.conf just after a new FreeBSD installation.


    # LISTING 7.2 A Newly Installed /etc/rc.conf


    ```

    # This file now contains just the overrides from /etc/defaults/rc.conf

    # please make all changes to this file.


    # Enable network daemons for user convenience.

    # -- sysinstall generated deltas -- #

    kern_securelevel="1"

    kern_securelevel_enable="YES"

    linux_enable="YES"

    sendmail_enable="YES"

    sshd_enable="YES"

    portmap_enable="NO"

    nfs_server_enable="NO"

    inetd_enable="NO"

    network_interfaces="fxp0 lo0"

    ifconfig_fxp0="inet 10.6.7.101 netmask 255.0.0.0"

    defaultrouter="10.6.1.1"

    hostname="freebsd1.testnetwork.com"

    usbd_enable="YES"

    ```


    Some of these variables are in fact redundant with the defaults file; still, it
    can be useful to also have them in the overrides file because many of these features
    (such as the NFS server) now have a one-touch toggle control, as it were.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '> If you add a variable to /etc/rc.conf, make sure that another version of
    that variable isn''t already in the file—or at least that it doesn''t appear later
    on in the file. The variables are read sequentially, and the way the overrides
    work is simply that the last occurrence of each variable seen by the system is
    the one it uses. If you are always careful to add variables only to the end of
    rc.conf, you should be fine.


    Many programs, when you install them, will have to install a way for themselves
    to start up at boot time; /etc/rc.conf is not, however, the place for them. That
    file is supposed to be touched only by you, the administrator, and by the sysinstall
    program when it makes changes to the core system. For user-installed programs
    (ports and packages) and for any scripts that /etc/rc and friends do not know
    about, another structure is in place for their startup scripts and configuration
    files: the /usr/local/etc hierarchy.


    # The /usr/local/etc and /usr/local/X11R6/etc Directories


    Programs that you install yourself are considered to be local, meaning that they
    apply only to your particular machine and not to FreeBSD itself. Configuration
    files for your locally installed programs go into the /usr/local hierarchy in
    FreeBSD as one of its structural conventions. There is a /usr/local/etc/rc.d directory,
    which is equivalent in operation to /etc/rc.d—except that because the files in
    it apply to the programs that you have installed, rather than to the core system,
    you can edit these files yourself in order to change those programs'' behavior.


    init turns its attention to /usr/local/etc/rc.d after it has run through all the
    other /etc/rc.d scripts. Any executable file within the directory that ends in
    .sh will be executed in lexicographical order. Examples of files that will be
    installed in here include apache.sh, mysql-server.sh, and samba.sh. These scripts
    are custom built as part of the ports or packages (see Hour 6, "Adding and Removing
    Third-Party Software," for more about the ports and packages), and each one is
    tuned to take a start or stop argument. When init runs each script, it uses the
    start argument. Note that you can run these scripts yourself during runtime just
    as easily—for instance, to start a newly installed service without rebooting,


    ```

    # /usr/local/etc/rc.d/apache.sh start

    ```


    Some ports or packages will install with a secondary suffix of .sample (for example,
    samba.sh.sample) because the program that it''s part of has to be properly configured
    before it can run successfully. Apache, for instance, will run immediately after'
  merge: -1
  img_proc: true
- pgno: 136
  md: "installation without any further modification to its config files (although\
    \ you will no doubt be modifying them anyway), so it installs an apache.sh file,\
    \ which could run the program cleanly if you rebooted it right then. But Samba\
    \ (which we will discuss in Hour 24, \"File Sharing\") must be tuned first to\
    \ run on your machine; if you ran the script right after installing it, it would\
    \ fail to start the daemon. You need to rename the script to remove the .sample\
    \ extension before it will be run on startup by init.\n\nThe /usr/local/X11R6/etc\
    \ directory is analogous to /usr/local/etc except it is specifically tasked to\
    \ X11-based (X Windows) programs: GNOME panels, graphical tools, games, window\
    \ managers, and so on. This directory also has an rc.d subdirectory, and scripts\
    \ in it are executed immediately after the ones in /usr/local/etc/rc.d.\n\n![](img/ba0161b65b37e94cffc801ecbacaba5e_136_0.png)\n\
    \n> The local startup-script directories are configurable. Override this rc.conf\
    \ line to add more directories if you need to:\n> \n> local_startup=\"/usr/local/etc/rc.d\
    \ /usr/X11R6/etc/rc.d\"  # startup script dirs.\n\n# The inetd Daemon and the\
    \ inetd.conf Configuration File\n\nAlthough a fair number of daemons in the base\
    \ system have .conf files in the /etc directory, the most important (and sensitive)\
    \ one you will have to deal with is inetd, the super server. We will take a brief\
    \ look at inetd here and discuss how to configure it.\n\nThe job of inetd is to\
    \ listen for connections on a specified set of network ports and fire off the\
    \ appropriate server process when a request comes in. For instance, inetd is in\
    \ charge of Telnet connections; if your system allows Telnet, you can open a connection\
    \ to it and receive a login prompt without any telnetd process running on the\
    \ server beforehand. Every time the system receives a connection request on Port\
    \ 23, it creates a new telnetd process to handle the connection. Executable programs\
    \ that run out of inetd (and other similar daemons) are in /usr/libexec. These\
    \ programs are not generally part of your command path and are not supposed to\
    \ be run from the command line; instead, they are spawned from within another\
    \ process and passed certain resources (such as environment variables and network\
    \ connections)."
  merge: -1
  img_proc: true
- pgno: 137
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_137_0.png)


    > The use of inetd eliminates the need for a "master" telnetd process running
    as root, which is a situation that could be particularly dangerous if a security
    vulnerability were to be uncovered in telnetd. Many daemons (among them sshd,
    httpd (Apache), and sendmail) do run in this "stand-alone" mode rather than being
    called out of inetd. The master process (running as root) listens for the new
    connections and spawns new processes, owned by an unprivileged user, to handle
    each transaction. This allows for greater flexibility and speed in the program
    at the expense of a centralized security risk. inetd also runs as root, so it
    is just as dangerous if it is compromised. The more daemons that run as root,
    the more possibilities there are for security holes to be found.


    Examining the /etc/inetd.conf file shows us that nearly all entries in it are
    disabled in the out-of-the-box configuration, assuming that you''ve selected the
    default security settings during setup. The only ones that are enabled are listed
    in Table 7.2.


    # TABLE 7.2 System Services Controlled by inetd That Are Enabled by Default


    | Service | Description | Port(s)/Resources Used |

    |---|---|---|

    | ftp | File Transfer Protocol | Port 21/TCP |

    | telnet | Remote terminal | Port 23/TCP |

    | comsat | "biff" server (notifies users of incoming mail) | Port 512/UDP |

    | ntalk | command-line chat server | Port 518/TCP;UDP |

    | ftp (IPv6) | File Transfer Protocol | IPv6 |

    | telnet (IPv6) | Remote terminal | IPv6 |


    Other services that you might want to enable, depending on what you''re using
    your system for, are shown in Table 7.3.


    # TABLE 7.3 Other Useful inetd Services


    | Service | Description | Port(s)/Resources Used |

    |---|---|---|

    | pop3 | Post Office Protocol | Port 110/TCP |

    | imap4 | Interim Mail Access Protocol (server-side mail) | Port 143/TCP |

    | smtp | Qmail (alternative to Sendmail SMTP server) | Port 25/TCP |'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# TABLE 7.3 continued


    | Service | Description | Port(s)/Resources Used |

    |---|---|---|

    | netbios-ssn | Samba file sharing with Windows | Port 139/TCP |

    | netbios-ns | Samba file sharing with Windows | Port 137/TCP |

    | finger | Lookup user information | Port 79/TCP |


    To enable any one of these services, simply remove the comment (#) from the beginning
    of the line and then restart the inetd server, as follows:


    ```

    # ps -waux | grep inetd

    root 110 0.0 0.6 1032 752 ?? Ss 11:57PM 0:00.01 inetd

    # kill -HUP 110

    ```


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_138_0.png)


    > > If you have selected to run the system at security level 1 or higher (an install-time
    option—level 1 is the "Medium" security level mentioned in the installer), inetd
    will not be running. This is indicative of the risky nature of many services that
    run out of inetd. If you are running at this security level and want to run inetd,
    you can run it by entering inetd -w8. To enable it permanently, remove or toggle
