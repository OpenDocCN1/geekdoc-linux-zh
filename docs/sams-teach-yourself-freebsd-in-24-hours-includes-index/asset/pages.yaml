- pgno: 113
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_113_0.png)


    # Hour 6


    # Adding and Removing Third-Party Software


    An operating system is not very useful by itself, and most people don’t have a
    computer just for the sake of tinkering with an operating system. For the system
    to be useful, there have to be third-party applications that help you perform
    the kinds of tasks you want to perform. As of this writing, more than 7,000 applications
    exist for FreeBSD that can be downloaded free. In addition, FreeBSD will run most
    Linux applications. Some of the applications available for FreeBSD include word
    processors, spreadsheets, databases, Web browsers, MP3 players, image editing
    programs, video players, and more. This hour looks at how to locate and install
    software in FreeBSD, as well as how to remove software that you no longer want.


    In this hour, you will learn the following:


    +   - The two primary FreeBSD software packaging systems and the differences between
    them

    +   - How to make sure that your list of available software is up to date

    +   - How to install prebuilt binary software'
  merge: -1
  img_proc: true
- pgno: 114
  md: '+   - How to install software from source code

    +   - How to remove installed software from the system

    +   - How to manage existing applications

    +   - How to work with Linux applications in FreeBSD


    # FreeBSD’s Software Packaging Systems


    FreeBSD has two different systems that can be used to install software. One of
    the systems works with prepackaged software that has already been built in to
    executable binary format. The other system downloads and builds the source code
    on-the-fly while installing the software. Both systems have their advantages and
    disadvantages.


    # The Differences Between Packages and Ports


    As mentioned previously, packages are prebuilt binaries that you can install on
    your system. This is the type of software most users will be familiar with because
    it is similar to the way software is delivered for Windows or Macintosh. The main
    advantage of installing software from packages is that it can often be much quicker
    than installing from the alternative for two primary reasons. The first is that
    you avoid the time required to compile and build the software from source code.
    Although building the software from source does not require a lot of your time,
    it is a time-consuming process for the computer.


    The other advantage of prebuilt packages is that it often requires far less download
    time. The reason is that building from source requires you to have all the libraries
    for the C and C++ compiler that the application requires. Any missing libraries
    have to be downloaded and installed before the application can be installed. In
    addition, some of these libraries will depend on other libraries, and so on. Although
    this process is usually automated in its entirety (FreeBSD automatically checks
    for missing dependencies and installs any that are missing), it can still eat
    up a lot of download time—especially if you do not have broadband access to the
    Internet.


    However, installing from packages also has its disadvantages. The first one is
    that not all software is available in packages, so sometimes the only option is
    to build the software from the source code.


    The other disadvantage is that you cannot customize the software or optimize it
    for your particular processor type. With packages, you are pretty much stuck with
    whatever options the package maker decided should exist in the software.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '> If the idea of customizing software seems scary to you, don''t worry. You
    don''t need to know anything about programming in order to do this. All you have
    to do is tell the installer what options you want to build the source code with,
    and it will worry about how to actually include those options in the finished
    product. You will see how to do this later in this hour.


    # Discovering What''s Available


    The easiest way to find out what kind of software is available for FreeBSD is
    to browse around the ports page on the FreeBSD Web site. It is located at the
    address www.freebsd.org/ports.


    Figure 6.1 shows the main ports page on the FreeBSD Web site.


    FIGURE 6.1

    A section of the main ports page on the FreeBSD Web site. Notice that the software
    is categorized according to its intended purpose.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_115_0.png)


    Clicking on any one of the categories will take you to a list of software available
    in that category. For example, Figure 6.2 shows a section of the Graphics category.'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'FIGURE 6.2

    A section of the Graphics category on the ports page showing some of the graphics-related
    applications available for FreeBSD.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_116_0.png)


    When you''ve found an application that interests you, simply remember what category
    it was under and then you can proceed with installing it. Previously, we mentioned
    that two methods are available for installing FreeBSD applications. We will look
    at both of them, starting with the prebuilt package method. For our examples,
    we will assume that you are interested in the GIMP software. GIMP is a freely
    available image editing program that has features similar to Adobe Photoshop.


    # Installing Software from Prebuilt Packages


    Prebuilt packages can be downloaded from the FreeBSD FTP server or one of its
    mirrors. If you''ve never worked with FTP before, the easiest way for you to do
    it will be from a Web browser. If you are working from the FreeBSD command line,
    you can use the Lynx Web browser, which is text based, but will work fine for
    our purposes here. To start the Lynx Web browser and point it to the main FreeBSD
    FTP server''s package directory, enter the following command:


    ```

    lynx ftp://ftp.freebsd.org/pub/FreeBSD/ports/packages

    ```


    Note that it is case sensitive, so the command must be typed exactly as shown;
    otherwise you will get an error.


    After the connection has been made, you should see a screen that looks like Figure
    6.3.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# FIGURE 6.3


    The Lynx Web browser connected to the FreeBSD package FTP server.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_117_0.png)


    Use the arrow keys to navigate down the list until the graphics directory is highlighted
    and then press the Enter key. After the screen has reloaded, it should look similar
    to Figure 6.4.


    # FIGURE 6.4


    Inside the graphics directory. The files ending in .tgz are the package files.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_117_1.png)


    Once again, simply use the arrow keys to scroll down the list until you have found
    the GIMP package.


    You can use the space bar to scroll forward in the list by an entire page.


    The list of packages is in a semi-alphabetical format. All package names beginning
    with numbers are listed first. After this, all packages beginning with uppercase
    letters are listed in alphabetical order. This is followed by all packages beginning
    with lowercase letters listed in alphabetical order.'
