- pgno: 263
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_263_0.png)


    # Hour 15


    # Network Security


    A long time ago (relatively speaking—a long time in computer years), you didn''t
    have to worry much about the security of your computer system. Basically, your
    computer was as secure as the building it was housed in. If someone couldn''t
    get into the building, he couldn''t get access to your computer and whatever information
    was stored on it.


    However, this all changed, of course, with the advent of networks, and with the
    advent of the Internet in particular. These days, your computer can be locked
    in a vault and still be vulnerable to outside intruders if it has a network connection.
    If it has an Internet connection, it can be vulnerable to attack by someone on
    the other side of the world. Because of this, network security is more important
    now then ever before.


    In this hour, you will learn:


    +   - How to ensure that passwords are secure

    +   - How to control remote logins and increase the security of allowing them

    +   - How to configure a basic firewall

    +   - How to make sure that the console is secure'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# Ensuring Password Integrity


    One of the most common methods that hackers use to access a system is to simply
    obtain a valid username and password combination and then log in with it. This
    method works because most companies don’t adequately educate their employees about
    the importance of password security and the methods that hackers will often use
    to steal passwords. Some of the most common problems with passwords, as well as
    methods that hackers use to steal passwords, are discussed next.


    # Weak Passwords


    Weak passwords meet one or more of the following criteria:


    +   - They are too short.

    +   - They are easily guessed.

    +   - They are words that can be found in a dictionary.


    Of course, the problems with passwords that are too short is that there is a better
    chance of getting a correct one simply through random guessing. It’s relatively
    easy for a hacker to obtain or write a program that can automate this process
    and simply try random passwords until it hits one that works.


    A similar problem exists with using words that can be found in the dictionary
    as passwords. Password cracking programs exist that simply go through the dictionary
    and try words until it hits one that works.


    Probably the most common password weakness is passwords that are easily guessed.
    In its most extreme form, this includes such things as using the word “password”
    as the password (you’d be surprised how many people actually want to do this),
    using the login name as the password, or using the current month or season as
    the password.


    Not quite as bad, but still very insecure (and very common), is using such things
    as the name of a child or pet, city of birth, or other information that a lot
    of other people know about you, or can find out relatively easily. Dumpster diving,
    a technique that gets its name because it sometimes literally involves diving
    into dumpsters outside of an office building and looking for discarded documents
    that contain personal information about someone, is sometimes employed by hackers
    to look for information that might be used as a password.


    It’s also best not to discount the issue of “social engineering”—convincing people,
    whether for good or evil purposes, to just hand over their passwords and sensitive
    data. Many security systems in use today and planned for the future is founded
    on the concept'
  merge: -1
  img_proc: true
- pgno: 265
  md: 'of “trusted systems”—in which the environment is assumed to be secure, and
    in which people are encouraged to be very free with their information. If the
    impression of security is false in any way, this can be the gravest risk of all.


    # Writing Down Passwords


    Another fairly common security problem that a lot of people engage in is writing
    down their password and placing it somewhere that hackers are very likely to look
    for it. No, hackers are not dumb. The first place they are going to look for a
    password is the bottom of the keyboard or the bottom of the desk, which is where
    a lot of people seem to “hide” their passwords—no smarter a practice than keeping
    the key to the house under the doormat. Even worse, and amazingly, quite common,
    is people who write their password on a Post-It note and then stick it on the
    frame of their monitor. Passwords should not be written down. Having said this,
    I know that a lot of people are going to ignore it and write down their password
    anyway. So if you must write down your password, at least keep it in your wallet
    or something where it is difficult for someone to steal it. Of course, if you
    do this, and your wallet gets stolen, you will want to change your password immediately.


    Try embedding passwords into other pieces of information, such as addresses, where
    it will be impossible to tell what’s a password and what’s not. You don’t necessarily
    have to outwit all the wily hackers in the world; you just need to be smarter
    about passwords than the average hacker target is.


    # What Makes a Good Password?


    Now that we have talked about all the things that make a bad password, what makes
    a good one? Generally, a good password should have the following characteristics:


    +   - It should be at least six characters long.

    +   - It should contain a mixture of upper- and lowercase letters.

    +   - It should contain at least one number.

    +   - It should contain at least one character that is not alphanumeric ($, !,
    and so on).


    Of course, as mentioned before, a good password should not be a word from the
    dictionary, it should not be something that can be easily guessed, and it should
    not be something that can be easily found out about you. However, it is also important
    that the password is something you can remember. Picking a password that is too
    complex will tempt you to write it down somewhere, and you want to avoid that.


    One commonly-used technique for developing a password is to choose a favorite
    sentence or song title, and use the first letters from each of the words in it.
    Then, replace the letter S with $, and A with @, and so on.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '# Be Aware of Suspicious Activity


    It’s been said that all good server administrators are a little bit paranoid,
    but that is probably a good thing when it comes to security. Be on the lookout
    for any suspicious phone calls or suspicious activity in or around the office.
    Also make sure that other employees are educated about this. Report any suspicious
    activity to the proper person. Here are a couple of common “social engineering”
    tactics that you should be very suspicious of.


    The first is someone claiming to be from the computer or IT department who calls
    and claims to be testing user accounts, upgrading accounts, adding new features
    to your account, and so on, and asks you for your username and password. NEVER
    give out your username and password to someone calling and claiming to be a system
    administrator or IT personnel. Remember that the system administrator can log
    in as you without needing your password by using the su command. Therefore, there
    is no reason that a system administrator should ever ask you for your password
    so that he can do anything. Basically, he doesn’t need it.


    The second thing to be aware of is anyone in or around the office who claims he
    is conducting a survey regarding almost anything (favorite foods, most common
    pet names, and so on). Even kids are a risk here. In fact, they are often more
    of a risk because people don’t suspect them and because they will sometimes claim
    that they are doing it for a school project or something. This is a somewhat common
    method for hackers to obtain personal information that they can later search through
    for potential passwords.


    # Remote Login Issues


    Of course, allowing remote logins to your server through a network significantly
    increases security risks. However, sometimes it is necessary for users to be able
    to log in to the server remotely. If you do need to allow remote logins, there
    are some things you can do to make them as secure as possible. We will look at
    each of these next.


    # Telnet


    Telnet is a very primitive method of allowing remote logins to a server. It really
    should be considered obsolete even though it is still commonly used. Telnet’s
    primary security problem is that it does nothing to encrypt the transmission of
    the password when the user logs in remotely. Because of this, anyone sniffing
    the network traffic going to your server can obtain a login name and password
    combination relatively easily.


    Because of the inherent security problems with telnet, we aren’t going to discuss
    its configuration here other than to say that it should be considered obsolete
    and should not be used. To make sure that telnet is indeed disabled (it is by
    default on modern versions'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'of FreeBSD), look at the file /etc/inetd.conf and make sure that any references
    to telnetd are commented out.


    # rlogin


    rlogin is another older protocol used for logging in to a system remotely. Like
    telnet, it is gradually being phased out in favor of SSH because it has the same
    basic problems. Although rlogin does have the advantage of not needing to transmit
    a password over the network (sometimes), it still doesn''t encrypt network traffic.
    Once again, because of this, we are not going to cover rlogin here.


    # SSH


    SSH stands for Secure Shell, and it is the primary reason that Telnet and rlogin
    are rapidly becoming obsolete. SSH provides remote login services like Telnet.
    However, unlike Telnet, SSH encrypts the connection so that someone sniffing your
    network traffic cannot read the password. To enable remote logins through SSH
    on FreeBSD, add the following line to your /etc/rc.conf file:


    ```

    sshd_enable="YES"

    ```


    Of course, this change will not take effect until the system has been restarted.


    To log in to the system from another FreeBSD box (or any other UNIX box that has
    SSH installed), simply issue a command such as the following:


    ```

    ssh lion.simba.org

    ```


    SSH will then prompt you for a password.


    Note that SSH assumes that your login name on the remote system is the same as
    your login name on the system you are using SSH from. If this is not the case,
    you need to specify the login name on the command line. You can do this by specifying
    the login name, followed by an @ sign, and then the hostname of the system you
    want to log in to. For example,


    ```

    ssh foobar@lion.simba.org

    ```'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# Configuring a Basic Firewall


    A firewall is a system that is designed to control access to and from a computer
    or network. Its two primary tasks are to prevent unauthorized outside users from
    accessing the computer or network (or parts of it), as well as to prevent internal
    users from going outside of the network. In other words, it can prevent internal
    users from accessing the Internet, certain Internet services, or parts of the
    Internet.


    Figure 15.1 shows an illustration of where a firewall is in relation to the internal
    network (LAN) and the rest of the world (Internet) A DMZ ("demilitarized zone")
    is also present; this is a third port on the firewall machine that leads to machines
    that are physically on the same LAN as the rest of the machines, but logically
    (and relative to the firewall) are part of the outside Internet. This is where
    Web servers, mail servers, and so on would live.


    FIGURE 15.1

    A diagram of a gateway machine providing firewall services.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_268_0.png)


    # Creating Firewall Rules


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_268_1.png)


    > When you initially configure the firewall, make sure that you have access to
    the console of the system where it is running. It''s easy to lock yourself out
    of your own network if you accidentally set a firewall rule that denies access
    to yourself. By default, the firewall will deny everything when first enabled.
    Of course, if you lock yourself out, you will not be able to access anything again
    until you have physical access to the system console.'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'Before you enable the firewall, you will want to create a configuration file
    for it that contains the rules you want the firewall to enforce. There are two
    basic firewall designs you can use:


    +   - Deny everything that is not specifically allowed. This is the most secure
    fashion of building a firewall.

    +   - Allow everything that is not specifically denied. This is less secure, but
    can be effective if you only want to block a couple of ports or IP address/hosts
    from accessing the network.


    To create a set of firewall rules, we will create a text file to hold them. This
    file can be called whatever you want and stored wherever you want, but here we
    are going to assume that the file you are using is /usr/local/etc/firewall.conf.


    Basically, a firewall rule takes the following information in the following order:


    +   1. **What to do.** This can be either the keyword allow or the keyword deny,
    which determines what should be done with the rule that follows.

    +   2. **What type of traffic the rule applies to.** This can be a network protocol
    such as tcp, udp, or icmp. It can also be the keyword all; in which case, the
    rule applies to all types of network traffic.

    +   3. **Where the traffic comes from.** This can be a specific IP address, hostname,
    or domain name. It can also be the keyword any; in which case, it applies to traffic
    coming from any host.

    +   4. **Where the traffic is going.** This can be the hostname or IP address
    of a system on your network that the rule applies to. It can also be the keyword
    any; in which case, the rule will apply to all systems on your network.

    +   5. **An optional port number.** If it exists, the rule will only apply to
    that network port. If it does not exist, the rule will apply to all ports.


    Here is an example of a set of firewall rules that could go in this file.


    ```

    add allow tcp from any to www.simba.org 80

    add allow all from lion.simba.org to www.simba.org

    add 65000 deny all from any to any

    ```


    The last rule was specifically assigned a number because this way you can dynamically
    add firewall rules without having to reset the entire firewall. The next paragraph
    explains why this is an issue.'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'Note that the rules are read in sequential order. In other words, the first
    rule the firewall comes to that matches the traffic being sent or received is
    the one that will be applied. If this seems confusing, the following rule set
    might clear things up:


    ```

    add deny all from any to any

    add allow tcp from any to www.simba.org 80

    add allow all from lion.simba.org to www.simba.org

    ```


    Even though the same rules are present in this set that were present in the previous
    one, the results of this rule set will be very different from the intended results
    for it. This is because the first rule will match all traffic; therefore, the
    next two rules will be ignored and the first rule will be applied. Of course,
    this means that because the first rule applies to all traffic (which includes
    lion.simba.org), the traffic will be denied—even though the second two rules allow
    it. As you can see, it is very important in which order you list the rules in
    the set.


    The first rule set that was given previously is an example of the "deny everything
    that is not specifically allowed" strategy. The following gives an example of
    how the "allow everything that is not specifically denied" strategy would work.


    ```

    add deny all from nasty.hacker.org to any

    add deny all from any to www.simba.org 80

    add 65000 allow all from any to any

    ```


    In this case, everything is allowed except for traffic that comes from nasty.hacker.org,
    which is denied access to all systems that are behind this firewall. In addition,
    all traffic from any system is denied to www.simba.org if it is directed toward
    port 80. (Port 80 is normally where a Web server could be running. In other words,
    this rule would have the effect of blocking any attempts to access the Web server
    port.)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_270_0.png)


    > It is a good idea to set your firewall rule file so that it can only be accessed
    by the root user. There is a small security risk involved in letting other users
    know what firewall rules your system is using. For example, if a hacker can obtain
    an IP address that your firewall allows to access the network, he can potentially
    spoof the IP address and thus fool your firewall into thinking that the traffic
    is coming from an authorized system when, in fact, it is not.


    # Enabling the Firewall


    After you have saved the firewall configuration file, you need to configure the
    /etc/rc.conf file to enable it. This can be done by adding the following two lines:'
  merge: -1
  img_proc: true
- pgno: 271
  md: '```

    firewall_enable="YES"

    firewall_type="/usr/local/etc/firewall.conf"

    ```


    After you have added these two lines, reboot the system. Remember to make sure
    that you have access to the console in case you accidentally mess up the rule
    file in such a way that causes you to lock yourself out of your own system once
    it has rebooted and the firewall has started. If the firewall starts correctly,
    you should see something similar to the following as the system starts back up.


    ```

    Kernel firewall module loaded

    Flushed all rules.

    00100 allow tcp from any to www.simba.org 80

    00200 allow all from lion.simba.org to www.simba.org

    65000 deny all from any to any

    Firewall rules loaded, starting divert daemons.:

    ```


    Note that this section has only covered the configuration of a very basic firewall.
    Several more configuration options can be used in the firewall configuration.
    For full information on configuring the firewall, see the ipfw man page and also
    the online handbook at www.freebsd.org/handbook.


    # Securing the Console


    Securing the physical server console itself involves both physical security and
    security settings on the software. Ideally, your server should be locked in a
    room that only trusted administrators have access to. However, this is not always
    feasible in a small office. By default, however, FreeBSD allows root access to
    the console in single user mode without providing a password. If the server cannot
    be physically secured, it is important to change this. This is done by editing
    the file /etc/ttys. Look for the line that says


    ```

    console none    unknown off secure

    ```


    Change it so that it reads


    ```

    console none    unknown off insecure

    ```


    This will prevent FreeBSD from allowing someone to boot in to single user mode
    without supplying a password. Make sure that you don’t get confused by the terminology,
    which admittedly is a bit confusing. When the console is set to insecure, it actually
    makes the console more secure as far as accessing the root account. Basically,
    insecure versus secure refers to the physical security of the console. Setting
    it to insecure increases some security options in FreeBSD to compensate for the
    lack of physical console security.'
  merge: -1
  img_proc: true
- pgno: 272
  md: "![](img/ba0161b65b37e94cffc801ecbacaba5e_272_0.png)\n\n> Note that even after\
    \ securing the console, it is possible for someone with physical access to it\
    \ to boot from a floppy disk or CD-ROM and get root access to the system without\
    \ entering a password. To protect against this, make sure that you configure your\
    \ computer's CMOS setup utility to disable booting from the floppy drive and CD-ROM\
    \ drive. This is still no guarantee of security, though, because someone with\
    \ physical access can change the BIOS settings back.\n> \n> Bear in mind, simply,\
    \ that without a guarantee of physical access, total security is not possible.\n\
    \n# Security Holes in FreeBSD\n\nFreeBSD is one of the more secure operating systems\
    \ available. However, it is inevitable that, at times, security problems will\
    \ be found that can allow an attacker to compromise your system. Because of this,\
    \ it is important that you keep your system updated and that you are subscribed\
    \ to the freebsd-security mailing list, which will contain announcements regarding\
    \ security holes that have been discovered. To subscribe to this list, send a\
    \ message to majordomo@freebsd.org, with the contents being the single line:\n\
    \n```\nsubscribe freebsd-security\n```\n\nAlso, it is important to note that a\
    \ RELEASE version of FreeBSD that you just installed might have security problems\
    \ out of the box, which is why it is important to cvsup your system to STABLE.\
    \ However, remember that cvsupping your system to STABLE will only fix security\
    \ problems related to FreeBSD itself. Most security breaches related to software\
    \ do not happen because of FreeBSD, but rather because of a problem with third-party\
    \ software running on FreeBSD that has a security issue. Note that this third-party\
    \ software will not be updated by the cvsup process. A security hole in Apache,\
    \ for example, requires that you update or patch Apache to fix the problem.\n\n\
    # Summary\n\nThis hour looked at some basics of securing your FreeBSD system.\
    \ However, a lot of security related issues were not covered. These include issues\
    \ such as security problems caused by CGI scripts running in Web servers. For\
    \ more information on basic security issues, check out the security man page."
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Q&A


    Q I''ve heard of some institutions (government agencies, research facilities,
    and so on) that require “one-time passwords”. How do I use those?


    A FreeBSD has a mechanism called S/Key that allows users to generate one-time
    passwords, which only work once each, in response to a “challenge phrase” issued
    by the login program. Look into the man skey page for details on how this works.


    Q How do I secure email services for my users?


    A POP3 and IMAP traffic, both of which are common forms of mail delivery for users,
    can be encrypted using a daemon called stunnel (available in the ports at /usr/ports/security/stunnel).
    This daemon creates a secure “tunnel” (hence the name) through which regular POP3
    and IMAP traffic is piped, after being encrypted in the same way that SSH traffic
    is encrypted. Most modern email programs support secure POP3 and IMAP (look for
    the “SSL” switch), so installing stunnel is an extremely good idea.


    Q Some secure services, like Apache 2.0 and stunnel, talk about my needing a “security
    certificate.” What’s that about?


    A You will need to generate a certificate that proves you are who you say you
    are if you want remote users to be able to trust the encrypted content that your
    server sends. (This is an integral part of network security.) Use the openssl
    program to generate a certificate; usage of the program is very complex, but the
    syntax you will want in order to generate a certificate request (which you can
    then submit to a signing authority, such as VeriSign) is


    ```

    openssl req -new -nodes -out req.pem -keyout /etc/certs/cert.pem

    ```


    This assumes that you have created a directory called /etc/certs to hold your
    certificates.


