    # Summary


    Congratulations! You now have successfully installed FreeBSD on your system. In
    this hour, we looked at how to partition your hard disk for FreeBSD. We then looked
    at the program used to install FreeBSD and did a walkthrough of the installation
    process. Finally, we saw how to properly shut down FreeBSD.


    # Q&A


    This section is intended to answer some of the most common questions regarding
    FreeBSD installation.


    **Q** I put the FreeBSD CD in my CD-ROM drive, but my system booted straight into
    Windows. What can I do?


    **A** You need to select your CD-ROM drive as the first boot device in your system''s
    CMOS setup utility. Restart your system and look for a message on how to get into
    the utility (the DELETE key is a common way). Press the key as soon as the system
    is starting up, and then look for an option to change the boot device order in
    the program that comes up.


    **Q** After I restarted my system, it seems to hang and not load anything. What''s
    wrong?


    **A** Some systems will hang for a very long time if the CMOS is set to boot from
    the CD-ROM drive first, and there is no bootable CD in that drive. Eventually,
    the system will give up and boot from the hard disk, but to avoid the long delay,
    go back into your system''s CMOS setup utility and change the primary boot device
    back to the original order. (Either primary hard disk first, or Floppy disk and
    then hard disk.)


