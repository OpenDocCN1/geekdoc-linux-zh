- pgno: 403
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_403_0.png)


    # Hour 24


    # File Sharing


    You have now learned almost all that you need to know in order to run a FreeBSD
    machine as a fully functional workstation or server on the Internet. However,
    there is one final puzzle piece before the picture is complete: file sharing.
    This is the subject of the final hour.


    Any computer on the Internet can handle email and Web surfing. Those are the two
    biggest and most commercialized segments of the Internet, and they are all that
    many Internet users ever experience. However, a truly networked computer must
    have a third aspect of its networking in place before it can be considered truly
    complete, and that is the capability to share files with other computers across
    the network. This kind of connectivity dates back to the earliest days of the
    Internet—yet it occurs not over a single simple protocol as with email or the
    Web, but over a number of different platform-specific protocols that keep changing
    over time. From the rudimentary FTP through the proprietary AppleTalk and NetBIOS/SMB,
    to the most modern peer-to-peer applications, file sharing has evolved into a
    myriad of different forms over the years (not least because the materials that
    some people choose to share involve illegal copyright violations). The benefits
    of file sharing are mitigated somewhat by the “underground” mystique it still
    retains.'
  merge: -1
  img_proc: true
- pgno: 404
  md: 'Yet file sharing is essential for downloading legitimate software and working
    in clustered environments in which documents must be available to everyone quickly
    and conveniently. In this hour, you will learn


    +   - How to set up an FTP server and share files over FTP

    +   - How to set up an NFS server and allow users of other UNIX machines to share
    your files over NFS

    +   - How to use NFS to access files on another UNIX machine

    +   - How to use Samba to share files with Windows machines


    # File Sharing Through FTP


    The File Transfer Protocol (FTP) is probably the oldest form of file sharing available
    to computer users, and it is also one of the most rudimentary—though it is still
    used widely for tasks such as downloading large binary files (usually software
    archives).


    A user connects to an FTP server using a specialized program, usually simply called
    ftp on most systems, although many more full-featured graphical FTP clients are
    available (including Web browsers, which incorporate some FTP functionality).
    FTP is also built in to the standard windowing filesystem of Windows and Mac OS
    X.


    When the FTP program connects to the server, it prompts for a username and a password;
    if what the user enters is correct for a user that exists on the server, he can
    then browse his home directory using the ls command, download files with get,
    and upload them with put. Many other commands are available, allowing the user
    to rename files, create and remove directories, and navigate through the remote
    and local filesystem. Finally, when the user is done, the quit command exits the
    FTP program. FTP is interactive and session based, and the user must know the
    server name and the location of the file he wants to retrieve in order to use
    it effectively. This is part of what makes it such a primitive protocol, although
    its ubiquity means that it is still very important to life on the Internet.


    FreeBSD comes with an FTP server built in (the standard BSD ftpd daemon), configured
    out of the box to enable FTP access to authenticated users. The built-in server
    is quite complete and secure, and it allows you to transfer files to and from
    your FreeBSD machine without any additional setup. Nonetheless, you will need
    to know how to run an FTP server properly to prevent unauthorized access and use
    of your machine, especially if you choose to enable "anonymous FTP" access—the
    ability of any random user to come to your server and download files from a specified
    "public" location.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '> You can replace FreeBSD''s default FTP server with any of a number of other
    choices—some of the more popular being WU-FTPD and ProFTPD. These are available
    in the ports (/usr/ports/ftp) or the packages (under ftp).


    The file layout of the FTP server, in the default configuration, is integrated
    with the system in the same way that most other core services are. Several configuration
    files are in /etc—some of which do double duty as systemwide resource files used
    by other services. Individual users'' home directories are considered part of
    the FTP server layout because each authenticated user connects directly into his
    home directory.


    Because anonymous FTP requires a bit more configuration and maintenance than regular
    authenticated FTP, though, we must examine the difference between them a little
    more in depth.


    # Authenticated and Anonymous FTP


    When a user who has an account on the server logs in via FTP with his username
    and password, the server provides access to the user''s home directory and all
    its files. The user can enter an ls command to verify this. Each regular user
    thus connects to a different point on the FTP server when logging in as a user:
    his home directory. However, anonymous FTP provides a way for a user without an
    account to connect. An anonymous user opens the connection, enters anonymous or
    ftp as his username, and any text string (conventionally the user''s email address,
    though this usually isn''t enforced or authenticated in any way) for the password.
    The user is then given access to a public FTP area: /var/ftp, the home directory
    of the ftp user (which is also created when anonymous FTP is enabled), as shown
    in Figure 24.1.


    FIGURE 24.1

    *Authenticated and anonymous FTP users.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_405_0.png)


    A fundamental difference exists between regular account users and anonymous FTP
    users, though. Anonymous FTP is in a chroot jail by default (chroot means “change'
  merge: -1
  img_proc: true
- pgno: 406
  md: 'effective filesystem root"), meaning that to the user, /var/ftp appears to
    be the server root /. Nothing outside /var/ftp is accessible or even visible.
    A regular account user can enter a command such as cd /usr/local to move to any
    part of the system and access files with the same readability permissions as in
    a terminal session, but an anonymous FTP user can''t get out of /var/ftp at all.
    An anonymous user who enters cd /pub will be taken to /var/ftp/pub.


    # Enabling Anonymous FTP Access


    By default, anonymous FTP is not enabled; the easiest way to enable it, if you
    choose to do so, is through sysinstall. Run /stand/sysinstall; then enter the
    Configure and Networking sections. Scroll to the Anon FTP option, and press the
    spacebar to enter the Anonymous FTP Configuration screen, as shown in Figure 24.2.


    FIGURE 24.2

    Anonymous FTP

    configuration options.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_406_0.png)


    The default options are generally appropriate for a typical FreeBSD system. The
    UID, Group, and Comment fields control how the new ftp user will be created. This
    user''s home directory is set to /var/ftp, which is how anonymous FTP works—the
    ftp login is treated as a regular user that behaves as if it''s listed in /etc/ftpchroot,
    so anybody logging in as ftp (or its alias, anonymous) will be put into a chroot
    jail at /var/ftp.


    You can change any of the fields to suit your system (for instance, if you already
    have a user with a UID of 14, or if you want a name for the upload directory that''s
    different from incoming). When you select OK at the bottom of the screen, the
    ftp user will be created, as will the /var/ftp tree with its necessary subdirectories.


    # Disabling Anonymous FTP Access


    The /stand/sysinstall program doesn''t provide the capability to disable anonymous
    FTP after it''s been enabled, but you can do this a number of ways (any of the
    following will do the job):


    +   - Remove the /var/ftp tree.'
  merge: -1
  img_proc: true
- pgno: 407
  md: '+   - Remove the ftp user.

    +   - Add the ftp user to /etc/ftpusers (probably the easiest and cleanest method).
    We will discuss the use of this file shortly.


    Similarly, you can disable the upload (incoming) directory by simply removing
    it, or else by changing its permissions to 755 (the default directory permissions
    in which only the owner—root—can write into it). Re-enable it (or any other directory
    to which you want anonymous users to be able to upload files) by changing its
    permissions to 1777—for instance, chmod 1777 /var/ftp/incoming.


    # Controlling FTP Access


    It''s essential to have some control over who is allowed to access your FTP server.
    FTP operates in cleartext, meaning that the usernames and passwords sent across
    the network when an FTP session is started up can be "sniffed" by an eavesdropper
    watching packets on the network. Also, perhaps you want only certain authenticated
    users to be able to connect to the server and others to be locked out.


    This can be done in a number of ways. The two most convenient ways involve the
    /etc/ftpusers and /etc/shells files. A third way, /var/run/nologin, controls whether
    the server accepts connections at all.


    # The /etc/ftpusers File


    The simplest way to forbid a certain individual user or a group of users from
    connecting to the FTP server is to add that user''s login name to the /etc/ftpusers
    file, which exists in the default FreeBSD installation and contains the names
    of the various system pseudo-users (such as operator, bin, tty, and so on). These
    users have null passwords, and ftpd will not allow anyone with a null password
    to connect; keeping the usernames in /etc/ftpusers provides an extra layer of
    security.


    You can add any username to the file, and because ftpd reads all relevant configuration
    files with each new connection, there''s no need to restart any processes. Try
    connecting to the FTP server as a disallowed user, and you should get a response
    like the following:


    ```

    # ftp localhost

    Connected to localhost.somewhere.com.

    220 stripes.somewhere.com FTP server (Version 6.00LS) ready.

    Name (localhost:frank): frank

    530 User frank access denied.

    ftp: Login failed.

    ftp>

    ```'
  merge: -1
  img_proc: true
- pgno: 408
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_408_0.png)


    > Note that the access denied message appears immediately after the server receives
    the username—it doesn''t prompt for a password. This prevents passwords from being
    sent over the wire, providing an extra security precaution in case you''ve disabled
    a user out of concern regarding an eavesdropper sniffing for passwords.


    You can also add any group name to /etc/ftpusers; simply precede the name with
    an at symbol (@): for example, @users. Any user who is part of any group listed
    in the file will be disallowed access.


    # The /etc/shells File


    After seeing whether the user is listed in /etc/ftpusers, ftpd checks the shell
    associated with the user and sees whether it''s listed in /etc/shells. If it isn''t,
    the user will get the same kind of access denied message as with /etc/ftpusers.
    You can leverage this functionality to prevent a user from logging in with a terminal
    program or with FTP by changing the user''s shell to /sbin/nologin (which simply
    prints out an account not available message and exits, and is not listed in /etc/shells)
    or something similarly constructed.


    # The /var/run/nologin File


    To turn off FTP logins completely, without modifying /etc/inetd.conf or any other
    such config files, you can simply place a file called nologin in /var/run; if
    ftpd sees this file, it will respond to all connections as follows:


    ```

    # ftp localhost

    Connected to localhost.somewhere.com.

    530 System not available.

    ftp>

    ```


    You can use touch /var/run/nologin to create the file (with zero length) and disable
    FTP logins. Remove the file (rm /var/run/nologin) to re-enable the FTP server.


    # Basic NFS Configuration


    A somewhat more advanced form of file sharing, built in to all UNIX operating
    systems, is the Network Filesystem (NFS). Unlike AppleTalk and Windows networking,
    NFS is not a peer-to-peer protocol. It''s a client-server model—where one machine
    has shares (or'
  merge: -1
  img_proc: true
- pgno: 409
  md: 'specific folders in the filesystem that are exported, or made available over
    the network), and another machine connects to that machine requesting access to
    its shares. The client then mounts the desired share into its own filesystem,
    as though the NFS share were simply another UNIX disk or partition, and the user
    can list the files in it and work with them at the shell command line.


    Like FTP, NFS has no built-in means for browsing, or the ability to get a listing
    of what servers or shares are available on a local network. An NFS client must
    know which servers it can connect to and what the available shares'' names are
    before it can do anything useful.


    An NFS server can control exactly which clients are able to connect to it—for
    example, by hostname or IP address; or by centralized login, as with NIS or Kerberos.
    Another feature of NFS is that it does not depend on LAN broadcasts for server
    discovery, it can be used across the Internet just as easily as across the LAN.
    A client in Boston can mount a share from a server in San Francisco, if necessary.
    By contrast, NetBIOS/SMB and AppleTalk only can operate within domains or zones
    on the local network (though AppleTalk/IP can cross the Internet freely).


    The client-server structure of NFS is designed so that you can centralize the
    resources in your network. For example, an enterprise might give all its employees
    home directories on a central UNIX machine: Every other system in the network
    that supports NFS will be able to mount those home directories and access them
    remotely, rather than requiring each machine to have its own copy of every home
    directory. Figure 24.3 shows this kind of network topology in action. The same
    can be done for build directories (in a software development environment) or shared
    applications that are centrally installed (as in a university workstation cluster).
    NFS mounts can be used in conjunction with NIS (centralized login management)
    to provide the entire network with user authentication; then, file ownership and
    permissions on every file in a mounted share will work just as on the NFS server
    machine itself. You can even install FreeBSD over NFS if you mount the installation
    CD-ROM on the NFS server and point sysinstall toward it.


    NFS doesn''t have any built-in security or encryption, so it should be used over
    the Internet only if you''re working with files that can safely be exposed to
    the public. Mission-critical or sensitive data should never be sent over wide-area
    NFS except inside a LAN protected by a firewall or through an encrypted VPN tunnel.


    A FreeBSD machine can be configured to be an NFS server, an NFS client, or both.
    We''ll talk first about setting it up as an NFS server and then about configuring
    it as a client.'
  merge: -1
  img_proc: true
- pgno: 410
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_410_0.png)


    FIGURE 24.3

    An enterprise network with central NFS-mounted home directories.


    # Configuring an NFS Server


    Setting up your FreeBSD machine to be an NFS server involves adding the following
    two lines to /etc/rc.conf:


    ```

    nfs_server_enable="YES"

    rpcbind_enable="YES"

    ```


    When you set the nfs_server_enable option and reboot, FreeBSD starts three different
    kinds of daemon processes after reading the contents of the /etc/exports file
    to determine what to share via NFS. These processes—nfssd, mountd, and rpcbind—each
    has its own role to play in NFS and can be tweaked for maximum performance by
    experts. The default configuration, however, should be adequate for most users''
    needs.


    # Setting Up Shares: The /etc/exports File


    The /etc/exports file lists what directory trees should be shared via NFS and
    who should be allowed to access them. If /etc/exports does not exist or is not
    readable when the network is started, the nfsd and mountd processes are not started.


    The full format of /etc/exports is defined in man exports. A basic export line
    specifies one or more directories that should be exported (shared), any of several
    options, and then an optional list of hosts (by IP address, network, netgroup,
    or hostname) that are allowed to share the specified directories. For example,
    the following line shares the /home directory and all its subdirectories to anybody
    who connects:


    /home -alldirs


    Note that the -alldirs option can only be specified if the share is the mount
    point of a filesystem (for example, /usr or /home). If it isn''t, for example
    if /home is not the point at which a filesystem is mounted (if your /home is just
    a directory inside /usr), the share will not be made available.'
  merge: -1
  img_proc: true
- pgno: 411
  md: 'A share that can be accessed only by three specified hosts and is read-only
    would look like this:


    ```

    /usr2 -ro -alldirs stripes.somewhere.com spots.somewhere.com 64.41.131.165

    ```


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_411_0.png)


    > You can create groups of hosts (netgroups) by specifying them in the file /etc/netgroup.
    A group can be specified in the following form:

    > groupname (host, user, domain) (host, user, domain) ...

    > For instance, to create a group called desktops that contained three particular
    hosts (named sol, luna, and terra), the line would look like this:

    > desktops (sol,,) (luna,,) (terra,,)

    > A netgroup defined on usernames would look like this:

    > developers (,frank,) (,bob,) (,alice,)

    > You can then use any of these netgroup names instead of hostnames in /etc/exports
    to confine an NFS share to members of that group.


    File ownership in an NFS share is mapped based on the UIDs of each file and directory.
    If the usernames and UIDs on the server and client machines are the same (for
    instance, if the machines'' logins are synchronized via NIS or Kerberos), the
    permissions will match. However, if the UID 1045 maps on the server to the username
    bill, but UID 1045 on the client is john, John will own the files in the share
    that the server thinks Bill owns. When exporting a share containing files owned
    by many different users, make sure that the infrastructure is in place to provide
    consistent mappings between UIDs and usernames on all the machines on your network.


    You can use the -maproot=<username> or -maproot=<UID> options to map ownership
    so that the username matching <username> or having the user ID <UID> on the client
    machine will have full root permissions in the share. For example, to share the
    entire filesystem of the NFS server with anybody in the 64.41.131 network, with
    the client user frank having full read/write access to all the files, use the
    following:


    ```

    / -maproot=frank -network 64.41.131 -mask 255.255.255.0

    ```


    After making any changes to /etc/exports, you need to restart the mountd process.
    Do this by accessing the runtime PID file:


    ```

    # kill -HUP `cat /var/run/mountd.pid`

    ```'
  merge: -1
  img_proc: true
- pgno: 412
  md: "![](img/ba0161b65b37e94cffc801ecbacaba5e_412_0.png)\n\n> You can't have multiple\
