- pgno: 66
  md: '+   - /: The item is a directory.

    +   - *: The item is an executable program or script.

    +   - @: The item is a symbolic link to another location. This is similar to a
    shortcut in Windows.


    Unlike Windows, executable files in FreeBSD are not required to have a .EXE or
    .COM extension. We will look at how FreeBSD determines whether a file should be
    executable or not later on.


    In FreeBSD, files that begin with a leading period (.) will be hidden in the normal
    directory listing. Files beginning with periods are normally configuration files
    that control behavior of programs and your working environment. Because these
    files are rarely accessed, FreeBSD hides them in the normal directory listing
    to avoid cluttering up the listing with entries that are irrelevant most of the
    time. If you want to see the hidden files, use the -a option with the ls command.
    The -a is short for all:


    ```

    bash$ ls -a

    .forward      .mailrc      .profile      Mail

    ..  .hushlogin   .project     tyfbbsd

    .addressbook  .sh_history  .cshrc        .mail_aliases

    bash$

    ```


    It''s not important that you know what all these files mean at this point, but
    you might be able to guess at the meanings from some of the names. For example,
    files here contain your user profile, control how your email should be delivered
    and whether it should be forwarded, and so on.


    Two entries here deserve special mention. Those are the entries . and ... The
    single period represents the current directory, and the double period represents
    the parent directory of this directory—that is, the directory that this directory
    is a subdirectory of. With the exception of the root directory (/), all directories
    have a parent directory.


    Another useful option to ls is the -l option. -l is short for long, and this gives
    you many more details about each entry in the list. For example,


    ```

    bash$ ls -l

    drwx--- 2 murban research 512 Feb 15 22:21 Mail

    lrwxrwxr-w 1 murban research 15 Mar 20 06:55 tyfbbsd -> /home/murban/documents/books/tyfbbsd

    -rw-r--r- 1 murban research 782 Mar 15 01:22 proposal.draft

    -rwx--- 1 murban research 15200 Mar 15 02:21 program

    bash$

    ```


    I''m not going to cover all the information given in this list at this point,
    but I will cover some of the more important information.'
  merge: -1
