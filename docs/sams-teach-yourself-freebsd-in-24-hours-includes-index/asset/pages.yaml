- pgno: 226
  md: '# Hubs


    One end of the cable connects to your computer''s Ethernet card; that much is
    clear. However, the other end needs to connect to something, too; far more often
    than not, what it connects to is a hub.


    Hubs are devices with multiple RJ-45 ports, usually between 4 and 24, to which
    you can connect as many Ethernet cables as there are ports. These cables can connect
    to computers, other hubs, switches, or other network components as necessary.
    Hubs range in cost from about $40 to several hundred dollars—depending on quality,
    number of ports, and the capability to operate simultaneously with 10base-T and
    100base-TX devices. Many hubs can only do one or the other of the two popular
    speeds, and an auto-sensing hub (often referred to as N-Way) can cost significantly
    more. Hubs range in size from small boxes no larger than your hand to full 19-inch
    rack-mountable units, and all require a power source. Some hubs are even managed,
    meaning that you can telnet to them and configure each port''s capabilities through
    a command-line interface. These hubs are naturally much more expensive than standalone
    hubs.


    Hubs can be small standalone devices, as shown in Figure 12.5, or they can be
    sized to fit into a 19-inch networking rack.


    FIGURE 12.5

    Small five-port hub, with one Uplink port.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_226_0.png)


    A hub is effectively a repeater, with all traffic appearing simultaneously on
    all ports, so a computer connected to one port on a hub will be able to see traffic
    to and from any other computer on the same hub. One port on a hub is usually reserved
    for uplink—a link to another hub, a switch, or a router higher up in the network
    hierarchy, as laid out in'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'Figure 12.2: this uplink port is usually wired so that a crossover cable is
    not needed between the hub and its next upstream device. This port and one of
    the standard ports on the hub can also be wired so that they''re mutually exclusive—a
    five-port hub, such as the one in Figure 12.5, might have six RJ-45 jacks but
    only give you the option of hooking five computers together (ignoring the uplink
    port), or four computers to an upstream device (ignoring the fifth standard port).
    This might be hard-wired, it might be controllable with a push-button or a DIP
    switch, or all the ports might be simultaneously usable. These are just some of
    the possible variations between different hubs.


    Another matter that complicates the way hubs and other devices communicate with
    each other is that of half- and full-duplex. The difference is essentially that
    in half-duplex mode, a host can only be "listening" or "talking" at one time;
    whereas in full-duplex mode, twice as many wires are used, enabling the host to
    "listen" and "talk" at the same time. Thus, a 100Mbps Fast Ethernet link in full-duplex
    mode can transport up to 100Mbps on each direction simultaneously, whereas the
    same link in half-duplex mode can only do an aggregate total of 100Mbps in both
    directions.


    # Switches


    Now that you know the nature and purpose of hubs, we can move on to switches.
    A switch looks like a hub that''s a lot more expensive and usually has fewer ports.
    It has multiple RJ-45 ports, it ranges from hand-sized to rack-sized (as shown
    in Figure 12.6), and the same companies that make hubs make switches, so it''s
    easy to mistake one for the other on store shelves. They even operate somewhat
    similarly—you can plug multiple devices in to a switch, and a switch used in place
    of a hub in a network would usually give you what appears to be the same result.
    The difference between switches and hubs, however, is subtle, yet crucial.


    FIGURE 12.6

    Rack-mounted

    eight-port switch.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_227_0.png)


    On a hub, all ports share the same internal wiring; all computers connected to
    the hub, as well as computers connected to other hubs connected to the first hub,
    exist on what''s known as a collision domain—in which a signal sent to one computer
    gets sent to all computers within the domain. It''s up to each computer''s Ethernet
    card to determine whether the signal is destined for it or not; and if it isn''t,
    to throw it away.'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'A switch’s internal wiring is much more complex. Each port comprises its own
    collision domain, and hosts connected to one port can’t see any traffic destined
    for hosts on any of the other ports. Switches incorporate the software necessary
    to read each packet’s Ethernet header and determine which port has the host that
    should get the packet, which means that a switch operates at the next highest
    layer up from a hub, at the network level, where it can see each packet’s IP destination
    address as well as the hardware Ethernet address where it is headed.


    Because each port on a switch has its own collision domain, this means that switched
    network traffic will be able to take fuller advantage of the available network
    bandwidth. An eight-port, 100base-TX hub with all ports in use has to divide the
    available 100Mbps between the eight ports. If all eight ports are simultaneously
    trying to do bandwidth-intensive tasks and their aggregate bandwidth demand is
    greater than 100Mbps, collisions—cases in which two ports try to transmit or receive
    traffic at exactly the same time—will become much more common, resulting in retransmissions
    at the physical link level and performance degraded well below what each host
    would logically see as a share of the available 100Mbps. Switches alleviate this
    problem. Whereas a 100Mbps hub has 100Mbps of internal wiring in total, an eight-port
    switch has 800Mbps worth of wiring—the full bandwidth duplicated for every port.
    This is why hubs tend to have fewer ports than switches, and switches with many
    ports are quite expensive.


    Switches usually have no uplink ports, although occasionally (as with some two-port
    switches, which serve purely as a filter to keep out irrelevant traffic) one or
    both ports will have a push-button to select whether the port should need a straight-through
    or crossover cable. As a general rule, treat ports on a switch as hub-type devices,
    and use crossover cables to connect one switch to another, or a straight-through
    cable to connect a switch to a hub’s uplink port.


    # Bridges


    A bridge is a device that acts somewhat like a switch, but in a rather more complex
    way. Bridges are like switches that connect different kinds of link-layer networks
    together instead of just different networks of the same type. You could use a
    bridge to connect an Ethernet network to a Token Ring network, for instance, or
    one Ethernet network to another one that normally would need a router to direct
    traffic from one side to another. Bridges aren’t generally useful except in very
    complex network topologies, so we won’t cover them more fully here.


    # Routers


    A router is the most complex (and expensive) of all networking devices. You have
    already seen the role that routers play in the OSI stack and in the Internet.
    But what exactly is a router?'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'Most routers are rack-mounted devices such as the one in Figure 12.7. The largest
    manufacturer of routers is Cisco, and most networks are managed by at least one
    Cisco router. However, a router can be made from a FreeBSD computer (or any operating
    system that supports routing, including all UNIX systems and even most Windows
    platforms). Most routers have either one or two LAN-side ports, RJ-45 jacks, or
    AUI ports that require transceivers to convert the interface to twisted-pair.
    On the other side of the router is a serial cable that connects to the DSU/CSU
    or other such high-speed serial converter—beyond which you have WAN traffic.


    FIGURE 12.7

    A Cisco router with a serial (WAN-side) and Ethernet (LAN-side) interface.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_229_0.png)


    Routers have full operating systems and maintain tables that keep track of where
    entire networks can be found. Most networks have only one router, specifying which
    network numbers indicate your LAN and which ones should be forwarded upstream
    into the WAN. You can have any number of routers in your network, though—each
    one managing a subnetwork and subservient to the topmost router.


    What’s more, routers use a variety of protocols to communicate with each other
    and plot out the best way for a packet to get from one place to another. When
    you send out a packet, it travels from router to router, further and further upstream
    by whatever route each router thinks is the best available, until it reaches a
    router that knows where downstream to find the destination network for your packet,
    and off it goes down through the downstream route until it reaches the destination
    LAN and, ultimately, the destination host. Routing is the backbone of the Internet
    and possibly the most complex part of the way TCP/IP networking operates.


    # The IP Address System and Subnets


    If you’ve ever done anything on the Internet at all, you’re probably familiar
    with IP addresses—at least enough to know what they look like. An IP address is
    typically used'
  merge: -1
  img_proc: true
- pgno: 230
  md: "as a way to refer to a specific computer on the Internet, though its meaning\
    \ is actually a lot more flexible than “one IP address per machine.” Most generally,\
    \ it’s a logical designation whose purpose is to locate a machine on the Internet\
    \ so that IP routers can direct traffic between it and any other machine.\n\n\
    An IP address is a string of 32 bits in the IP header, which specifies either\
    \ what machine a packet came from or where it is destined (both addresses are\
    \ present in the header). The 32 bits can be thought of also as four 8-bit bytes,\
    \ each of which is expressed as a number from 0 to 255—hence, our familiar four-part\
    \ dotted-decimal notation (of the form 111.112.113.114).\n\nTypically, a single\
    \ IP address is bound to a single Ethernet card; this is only by convention, though.\
    \ The only constraint is that no two Ethernet cards on the same network can share\
    \ the same IP address. You can bind multiple IP addresses to the same card, though,\
    \ and every card needs to have at least one unique IP address to function. You\
    \ might choose to install two Ethernet cards in your system in order to have access\
    \ to two different networks at once, for example, or one address might be bound\
    \ to an Ethernet card, whereas another refers to your wireless 802.11 card. It\
    \ all depends on how your network is set up.\n\nYou can find out the IP addresses\
    \ of any Ethernet card and other network interfaces in your system using the ifconfig\
    \ utility, shown in Listing 12.1. The -a option shows all devices, or you can\
    \ specify a specific interface (such as x10) to single out just that one. The\
    \ inet line shows a configured IP address; the x10 interface in this example shows\
    \ multiple IP addresses bound to a single card.\n\n# LISTING 12.1 Typical Output\
    \ of ifconfig\n\n```\n# ifconfig -a\nx10: flags=8843<UP,BROADCAST,RUNNING,SIMPLEX,MULTICAST>\
    \ mtu 1500\n inet 64.41.131.102 netmask 0xffffffff broadcast 64.41.131.255\n inet6\
    \ fe80::201:2ff:fe55:1256% x10 prefixlen 64 scopeid 0x1\n inet 209.154.215.246\
    \ netmask 0xffffffff broadcast 209.154.215.246\n ether 00:01:02:55:12:56\n media:\
    \ autoselect (100baseTX) status: active\n supported media: autoselect 100baseTX\
    \ <full-duplex> 100baseTX\n ►base/T/UTP <full-duplex> 10baseT/UTP 100baseTX <hw-loopback>\n\
    \ lo0: flags=8810<POINTOPOINT,SIMPLEX,MULTICAST> mtu 1500\ngif0: flags=8010<POINTOPOINT,MULTICAST>\
    \ mtu 1280\ngif1: flags=8010<POINTOPOINT,MULTICAST> mtu 1280\ngif2: flags=8010<POINTOPOINT,MULTICAST>\
    \ mtu 1280\ngif3: flags=8010<POINTOPOINT,MULTICAST> mtu 1280\n lo0: flags=8049<UP,LOOPBACK,RUNNING,MULTICAST>\
    \ mtu 16384\n inet6 fe80::1%lo0 prefixlen 64 scopeid 0x7\n inet6 ::1 prefixlen\
    \ 128\n```"
  merge: -1
