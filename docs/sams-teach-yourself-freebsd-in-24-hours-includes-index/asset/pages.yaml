    To change the desktop background, right-click on a blank area of the desktop and
    then select Configure Background from the pop-up menu. This brings up the window
    shown in Figure 18.14.


    If you want to, you can create different backgrounds for each of the virtual desktops.
    Otherwise, you can check the Common Background box so that they will all be the
