    # Specifying Which Category to Use


    Some commands have more than one man page. For example, crontab is a command that
    allows you to program events to occur at certain times on a regular basis. crontab
    has an entry in category 1 that explains the crontab command itself and another
    entry in category 5 that explains the format of the crontab configuration file.
    By default, simply typing man crontab will give you the first crontab entry in
    the manual, which is the one in category 1 in this case. But what if you want
    to read the man page for the crontab configuration file? In this case, you have
    to specify on the command line which category of man pages you want to use. This
    is done by simply preceding the name of the command with a number corresponding
    to the category of man pages you want to use. For example, man 5 crontab will
    give you the man page for the crontab file format instead of the man page for
    the crontab command itself.


    # Searching the Man Pages


    So what if you know what you want to do but are not sure of the command to do
    it? You can use the -k option to man to search the man pages for keywords. Unfortunately,
    the keywords are not always intuitive, so sometimes you have to get rather creative
    for what you search for. For example, suppose that you are looking for a command
    that will join two or more text files together and print them as one file. You
    could try using the command man -k join. This will often give you a lot of returns,
    but unfortunately, it won''t give you any command that will do what you want to
    do. If, however, you search for the word "concatenate", you will find the command
    cat, which does what you want.


    # Command Summaries


    At other times, you might know the name of a command, but you are not sure what
    it does and just want a short summary instead of reading the entire man page.
    For example, suppose that you are poking around in the /usr/games directory, you
    find the command'
