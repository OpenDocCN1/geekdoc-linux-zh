- pgno: 219
  md: '# Hour 12


    # Introduction to Networks


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_219_0.png)


    These days, it’s hard to imagine a computer without a network to connect it to.
    There’s only so much you can do with a machine that doesn’t have access to the
    Internet or to other machines on its own local network. Word processing and image
    editing is fine in its own right, but a computer in this day and age isn’t worth
    the desk space it takes up if you can’t use it to read email, surf the Web, and
    share files between neighboring computers.


    Fortunately, FreeBSD is one of those operating systems that was designed from
    the ground up for networking. As you will see in this hour and the next, everything
    in FreeBSD is designed under the assumption that the computer will be networked
    and accessible by multiple users at once. Unlike Windows, which started life as
    a standalone operating system for single-user computers, FreeBSD is one of those
    operating systems that helped build the Internet, and it continues to form much
    of its backbone. Because of its UNIX heritage, FreeBSD is just as comfortable
    serving Internet traffic as it is requesting it.'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'The first topics we must cover in this hour are general networking concepts.
    TCP/IP networking isn''t like USB, where you can just plug in a cable and you''re
    off and running. To network properly, you will need to know something about the
    underlying technology. That''s what we will discuss first. You will learn:


    +   - What the OSI networking model is and how it applies to the Internet

    +   - What people mean when they talk about the TCP/IP "Stack"

    +   - What the different components used in networking are, and how they are used

    +   - What an IP address is and how it applies to routing

    +   - How IP addresses, netmasks, and network addresses are related


    # The OSI Networking Model


    Most modern networking, including the Internet, is done via a system known as
    the Transmission Control Protocol/Internet Protocol (TCP/IP). This name refers
    to a combination of the two most common protocols, or methods of communication,
    that adhere to a structured "stack" of protocol layers known as the Open Software
    Interconnect (OSI) model. OSI dictates how computers and networking components
    can be broken down into a number of conceptual layers so that data can be exchanged
    between them.


    There are seven layers in the typical OSI model, ranging from the application
    layers at the top (where they interact with you, the user) all the way down to
    the data link and physical layers at the bottom (where the specialized hardware,
    such as Ethernet cards, talk to each other and trade raw data). Figure 12.1 shows
    how a typical OSI or TCP/IP stack in a computer is structured.


    FIGURE 12.1

    OSI stack layering diagram, showing how a TCP/IP-based application transmits data
    from one user to another.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_220_0.png)'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'The bottom layers of an OSI stack represent hardware that is specifically tuned
    to communicating data onto a wire, such as Ethernet and Token Ring cards; but
    the components down at the bottom are not capable of knowing where that data is
    supposed to go other than onto the wire. All they do is send out the ones and
    zeroes, and they rely on those ones and zeroes to know where they are supposed
    to go next.


    Fortunately, they do. The next layers up in the stack wrap the data (which is
    broken up into packets, or chunks of data usually around a kilobyte in size) with
    headers, which are blocks of preliminary data that can only be read by software
    at the corresponding layer in another computer''s OSI stack. For instance, the
    network layer of one computer''s OSI stack puts an IP header onto a packet and
    sends it down to the link layer, where the Ethernet card (and its PHY, the chip
    that handles the physical communications) sends it out onto the wire destined
    for another computer''s Ethernet address—the lowest level of addressing in the
    OSI scheme. The data is received by the target computer, but the link layer of
    the stack can''t do anything with it beyond receiving it—so it passes it up the
    stack to its own network layer, which reads the IP header and decodes such useful
    information from it as the IP address that the packet came from, as well as the
    IP address that it''s supposed to go to.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_221_0.png)


    > If the receiving computer''s own IP address doesn''t match the destination IP
    address of the packet, it usually means that the receiving computer is a router—a
    computer whose specialized job is to take packets that are destined for IP addresses
    of computers on other remote networks and forward them on through the Internet
    until they get to their destination. We will talk a little more about routers
    later in this hour.


    The upper layers of the OSI stack work in a similar way. The topmost layers interact
    with the user, who thinks of his software as interacting with similar software
    (or a similar user) on the other end of a connection. He inputs data, which is
    sent down the stack by the application and wrapped in a TCP header by the transport
    layer—transport protocols such as TCP, UDP, and ICMP are all used by different
    kinds of applications—and then passed down to the network layer, which adds an
    IP header. Finally, the packet reaches the link layer, gets transmitted out of
    the computer, is passed from destination machine to destination machine, and finally
    reaches the intended target. Here, the packet is handed up from layer to layer,
    one header stripped off at each level, until it reaches the application and the
    user and appears (for instance) as an Instant Message reading "Hello! Want to
    go to lunch?".'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Why bother with all these layers? Why can''t the applications simply talk directly
    to each other? Well, that''s what the Internet is all about. As you can see in
    Figure 12.2, the Internet is made up of a huge number of smaller networks all
    hooked together by means of routers. Each router manages a network of its own,
    in a hierarchical manner; the networks that each router manages get larger and
    larger as you progress toward the middle of the Internet, and smaller and smaller
    as you approach the endpoints, which are single computers. A large router at a
    telecommunications company at the “backbone” of the Internet can have thousands
    of smaller routers sending traffic up to it. This is necessary so that widely
    separated Local Area Networks (LANs, which we will discuss shortly) can know how
    to send traffic to each other. The layers of the OSI model enable data packets
    to contain the information they need to navigate from one part of the Internet
    to another without having to know anything about the route along the way. The
    routers themselves handle it all so that the sending and receiving computers don''t
    have to.


    # FIGURE 12.2


    The Internet consists of thousands of different routers— each managing a network
    all its own.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_222_0.png)


    A LAN consists of a relatively small number of computers hooked together by means
    of a high-speed but non-routable communication mechanism such as Ethernet. A corporate
    network is an example of a LAN; computers within such a network can communicate
    very rapidly with each other. But such a network is not feasible beyond a certain
    size for the simple reasons that Ethernet cables can only be so long before they
    start to lose their'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'signal strength and that a LAN is typically managed by a single company or
    person, whereas the Internet is managed collectively by thousands of different
    companies.


    Traffic from a computer on a LAN to a computer on another LAN is passed to a router,
    which knows where to find other routers along the way to the traffic''s destination.
    The traffic goes from router to router, using Wide Area Network (WAN) connections
    such as high-speed serial links (T1, T3, OC-3, and so on) until it reaches the
    router that manages the LAN where the destination computer is located; it is then
    transmitted from the router over the LAN via Ethernet. This way, network traffic
    can travel between many different kinds of networks, managed by different companies
    or people, using the transmission method that is the most efficient at each level.


    # Basic Networking Components


    Many different kinds of networking equipment can be found in the path from one
    computer on the Internet to another. Each type of component is designed to connect
    computers at a different level of the TCP/IP stack or to perform a certain function
    or layout in a networking topology.


    # Cables


    Ethernet cables can carry traffic from one Ethernet card to another on a LAN at
    very high speeds—10Mbps, 100Mbps, or even 1Gbps in the newest (and most expensive)
    kind of LAN, Gigabit Ethernet. The cables, regardless of speed, can be had very
    cheaply; you can even make them yourself. The downside is that Ethernet can''t
    be used over long distances. Because the signals aren''t serialized or transmitted
    by equipment designed to support long-distance transmission, signals degrade with
    cable length.


    The most commonly used cabling these days is via Unshielded Twisted Pair (UTP)
    cables, also known as Category-5 or Cat-5. Other types of Ethernet cables have
    been in common use over the years, such as ThickNet and ThinNet, using altogether
    different physical types of cable, such as the coaxial cable that plugs in to
    a TV; but by far the most common configuration today is the RJ-45 phone-style
    jack on a UTP cable. This same style of cable can be used on 10Mbps (10base-T)
    networks, 100base-TX, and 1000base-T (Gigabit) networks, interchangeably.


    # Straight-through and Crossover Cables


    Only one complication exists in UTP cabling, and that is the difference between
    straight-through and crossover cables. The difference between them lies in whether
    the positions'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'of two pairs of wires in the cable are reversed from one end to the other,
    and it''s important to understand the different circumstances under which each
    are used.


    Devices with RJ-45 connectors can be thought of as either computer-type or hub-type
    devices. Computers, routers, bandwidth managers, and other endpoint devices are
    considered computer-type devices, and hubs and switches are hub-type devices.
    The RJ-45 jacks on computer-type devices are all wired equivalently to each other,
    and hub-type devices are also all wired the same. Ethernet cables are wired to
    connect computer-type devices to hub-type devices.


    To connect a computer to a hub, you need a straight-through cable. The same is
    true for connecting a computer to a switch or a router to a hub. These are all
    connections between unlike devices. However, to connect a hub to a hub or a hub
    to a switch, you need a crossover cable. You also need one to connect a computer
    to a computer; for instance, to play in two-player death-match mode. The rule
    to remember is this: Use straight-through cables between unlike devices, and crossover
    cables between like devices.


    The tricky part is with the uplink port on hubs. This special port is wired as
    if it''s a computer-type device, so you can connect a hub''s uplink port to a
    standard port on another hub with a straight-through cable. This became necessary
    in large networks—in which a very long straight-through cable would be connected
    to a large enterprisewide hub or switch (in the server room, for example), and
    wound through walls and conduits to emerge in another room. This cable couldn''t
    be connected directly to a standard port on a smaller hub; it had to be fitted
    to an adapter and a short crossover cable before it could talk to the smaller
    hub. Replacing the Ethernet cable with a long crossover cable was impractical,
    to say the least. Hence the uplink port was born: a port that allowed a hub to
    be connected directly to another hub for which swapping out the cable for a crossover
    was not a viable option. Remember, though, that connecting two hubs'' uplink ports
    together requires a crossover cable—which is a configuration that rather defeats
    the purpose, in any case.


    How do you tell whether an Ethernet cable is a straight-through or a crossover
    cable? It''s pretty easy: Hold up the two ends of the cable next to each other.
    If the color sequences of the wires match, it''s a straight-through cable. If
    some of the wires appear out of place, it''s a crossover cable.


    The pinout (pin wiring diagram) for a straight-through cable is shown in Figure
    12.3.


    And to make a crossover cable, reverse the positions of pair 3 (wires 1/2) and
    pair 2 (wires 3/6), as shown when crimping the second end (see Figure 12.4).'
