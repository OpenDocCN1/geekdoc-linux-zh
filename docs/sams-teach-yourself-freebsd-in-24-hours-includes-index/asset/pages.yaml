  md: 'Metacity; each of these is available in the ports. However, IceWM is one of
    the most GNOME-compliant window managers available.


    # FVWM 95


    FVWM 95 is another attempt at cloning the Windows 95 interface. Once again, although
    the interface looks similar to Windows 95, much of the underlying functionality
    is missing. For example, no built-in support exists for icons, and the Start menu
    must be edited by hand from a text file. In addition, the appearances of the windows
    and such are also controlled from a text configuration file. Figure 19.5 shows
