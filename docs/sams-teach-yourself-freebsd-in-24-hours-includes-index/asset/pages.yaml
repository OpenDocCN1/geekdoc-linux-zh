    \ is to prevent problems in cases where the export permissions for different shares\
    \ in the same filesystem would conflict. If you want to create multiple shares\
    \ that are within the same filesystem, you must put them all on the same line.\
    \ The following setup is illegal:\n> \n> /home/frank 64.41.131.102\n> /home/joe\
    \ 64.41.131.102\n> \n> But the following setup is correct:\n> \n> /home/frank\
    \ /home/joe 64.41.131.102\n\nYou can use the showmount program to display the\
    \ valid shares and their permissions. This is how you can tell whether your /etc/exports\
    \ setup is valid:\n\n```\n# showmount -e\nExports list on localhost:\n/usr\t\t\
    \tEveryone\n/home/frank\t\t64.41.131.102\n/home/joe\t\t64.41.131.102\n/\t\t\t\
    64.41.131.0\n```\n\n# Starting NFS Services Without Rebooting\n\nThe cleanest\
    \ way to start NFS services is to reboot the system. However, if you need to start\
    \ the services and you don't want to reboot, simply issue the following commands\
    \ as root (omitting the rpcbind command if it's already running):\n\n```\n# rpcbind\n\
    # nfsd -u -t -n 4\n# mountd -r\n```\n\nThen, use showmount -e to make sure that\
    \ the NFS shares are being exported properly.\n\n# Configuring an NFS Client\n\
    \nIf your FreeBSD machine will be mounting NFS shares from other servers, you\
    \ will need to configure it as a client. Technically this isn't really necessary—you\
    \ can mount an NFS share in a rudimentary fashion right out of the box. However,\
    \ configuring the system as an NFS client gives you a few features that ensure\
    \ speedy and reliable performance.\n\nTo set up an NFS client machine, simply\
    \ enable the following line in /etc/rc.conf:\n\n```\nnfs_client_enable=\"YES\"\
    \n```"
