    ```

    ```


    Once again, don''t panic because most of these questions you will only have to
    answer the first time you run the adduser program. After this, you can run it
    with the -silent option to prevent it from asking you many of these questions.
    Later, if you want to change the default options, you can run it without the -silent
    option to be asked the questions again.


    Because a lot of this is probably rather intimidating to you at first, let''s
    walk through it a step at a time, beginning with some general observations.


    Many of the questions you are asked during this process have a default answer.
    The default answer is presented in brackets like this: [ ]. To accept the default
    answer offered, simply press Enter without entering any text. For the vast majority
    of questions you are asked, it is probably best if you accept the default. Now,
    let''s look at some of the questions in more detail:


    ```

    Enter your default shell: bash csh date ksh no sh tcsh [ksh]:

    ```


    By now, you are probably reasonably familiar with what a shell is, what it does,
    and the features of various different shells. This question will set the default
    shell that will be selected for any future users you create. Of course, you can
    override this during any new user creation by simply telling it to use a different
    shell. If you are managing a system with a lot of users who are not familiar with
    UNIX, the bash shell is probably the best choice you can make for new user shells.
    Users who are familiar with UNIX can always change their shell on their own if
    they don''t like the default shell that you gave them.'
