    # www.kde.org


    KDE is the graphical user environment that we have been using in this book. This
    is the home page for the KDE project. You will find more information about the
    project such as the latest release information here.


    # www.gnome.org


    Gnome is the biggest competitor to KDE for the standard UNIX desktop environment.
    If you don''t like KDE, or if you are just curious, you can check it out here.
    Gnome is available for FreeBSD in the ports collection.


    # Mailing Lists


    To subscribe to any one of the following mailing lists, send an email to majordomo@freebsd.org
    that contains the following in the body of the message:


    ```

    subscribe list-name

    ```


    where list-name is any one of the lists given later. If you want to unsubscribe
    from any of the lists, send the following command to the same address given above:


    ```

    unsubscribe list-name

    ```


    Some of the lists given later are quite busy and will generate a great deal of
    email. If you don''t want this but still want to get messages from the lists,
    you can subscribe to them in digest form. In this case, you will be sent a single
    message containing all the messages that have been posted each time the number
    of messages posted has exceeded 100K in size.


    # General Lists


    General lists can be subscribed to and posted to by anyone. However, before posting
    to a list, you should read the guidelines that are sent to you when you subscribe.
    This will help you determine what kinds of messages should be posted to this list,
    and which messages would be better posted on some other list.


    +   - freebsd-advocacy:

    +     This list is basically a forum for discussing ways of advocating and promoting
    FreeBSD.

    +   - freebsd-arch:

    +     This list discusses hardware architectures and design.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_431_0.png)'
