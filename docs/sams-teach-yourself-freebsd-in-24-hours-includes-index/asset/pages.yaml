    # APPENDIX A


    # Resources for FreeBSD Users


    This appendix contains a list of resources that FreeBSD users will find helpful.


    # Web Sites


    The following Web sites may be of interest to FreeBSD users. The list includes
    both FreeBSD specific sites as well as sites not specifically related to FreeBSD,
    but that might still be useful.


    # FreeBSD Specific Sites


    The following Web sites are specific to FreeBSD and the FreeBSD project.


    www.freebsd.org


    This is the official Web site of the FreeBSD project. Among other things, you
    will find announcements of the latest releases here, as well as other important
    announcements. It is also the place to start when looking for FreeBSD software,
    additional documentation, and more.'
