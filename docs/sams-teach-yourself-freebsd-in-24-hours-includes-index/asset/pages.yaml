- pgno: 238
  md: '+   - How to use sysinstall to input your machine''s TCP/IP settings

    +   - How to determine whether your machine is configured correctly for TCP/IP


    # The Network Interface Device


    The first thing to make sure that your machine is equipped with is a network interface
    device. In most desktop PCs, this device is an Ethernet card with an RJ-45 jack
    on it—the most common modern type of Ethernet connector. Almost all cards today
    are 10/100 cards, meaning that they support both 10Mbps and 100Mbps speeds. Some
    are even Gigabit cards, although those are more expensive. Some cards have multiple
    types of connectors on them, such as the card shown in Figure 13.1, which has
    (from left to right) an RJ-45 jack, a DB-15 serial connector, and a BNC coaxial
    connector. Most cards today only have an RJ-45 jack. Modern machines frequently
    come with Ethernet capabilities built on to the motherboard, and an RJ-45 connector
    will be visible on the back of the machine among the other connectors.


    FIGURE 13.1

    *An Ethernet card with multiple connectors.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_238_0.png)


    Network interface devices aren''t always Ethernet, however. Some computers, especially
    laptops, have wireless 802.11 cards either built-in or added via a PCMCIA slot.
    802.11 is a “wireless Ethernet” standard, known variously as Wi-Fi and AirPort;
    and even though there is no connector to plug in, the operating system still treats
    the 802.11 card as though it were another Ethernet card. The antenna connected
    to the card serves the same purpose in the configuration as the UTP cable does
    in a traditional Ethernet network.


    Your computer might have more than one Ethernet card, or it might have both a
    standard Ethernet card and an 802.11 card. FreeBSD can operate with as many cards
    as you care to cram into the box. Each one will get its own IP address, as we
    discussed in the last hour.'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'FreeBSD comes with support for the vast majority of modern Ethernet cards,
    both wired and wireless, that are in use today. Table 13.1 shows a listing of
    the modern Ethernet cards available in the default (GENERIC) kernel configuration.
    Ethernet cards have become a commodity in recent years, and almost every card
    made is 100% compatible with existing standards, as well as being quite cheap.
    Chances are that whatever card you have, it will work with FreeBSD without any
    additional configuration. Just plug it in and turn it on.


    TABLE 13.1 Ethernet Cards Supported in the Default (GENERIC) FreeBSD Kernel


    **PCI Cards**


