- pgno: 165
  md: '# Q&A


    **Q** Is a floppy disk a volume, a partition, or a filesystem? How about a hard
    disk?


    **A** A floppy disk is generally all three because floppies are seldom partitioned.
    But a hard disk that has been partitioned has several volumes, also known as partitions,
    within it. Each volume is potentially a filesystem.


    **Q** What''s the difference between /bin and /sbin or between /usr/bin and /usr/sbin?


    **A** Executable programs that have the capability to alter the system''s operation
    are generally kept in the `sbin` directories, whereas executables that simply
    perform user functions live in the `bin` directories. For instance, `/bin` and
    `/usr/bin` contain tools such as `ls`, `less`, and `top`; but `/sbin` and `/usr/sbin`
    have tools such as `mount`, `fsck`, `ifconfig`, and others that can change the
    system configuration.


    **Q** I don''t plan to run a busy server or anything: my machine is just a workstation.
    Why should I bother partitioning my disk?


    **A** You might not need to. The best argument for partitions is to divide the
    disk into regions for different purposes so that one area of functionality can''t
    grow to fill the entire disk and interfere with other functions. But if your system
    won''t be hosting busy Web services or a lot of users, you can probably get away
    with keeping your entire disk as one big partition.


    **Q** I''m having trouble mounting disks with filesystems other than UFS. What
    can I do?


    **A** Normally, support for filesystems such as MSDOSFS and SMBFS is not built
    in to the default kernel; those filesystems are available as loadable kernel modules,
    though, and they are automatically loaded into the kernel when called by the appropriate
    `mount_XXX` command. However, this might not be happening properly; use `kldstat`
    to see what kernel modules are loaded, and if necessary, use `kldload` to load
    the appropriate filesystem before mounting the disk (for example, `kldload smbfs.ko`).


    **Q** I burned a CD from an ISO image created from a directory structure, but
    some of my files got lost in the process! How can I retrieve them?


    **A** ISO 9660 doesn''t support long filenames. The `mkisofs` tool will ignore
    files whose names are illegal under ISO 9660, unless you specify one of the extensions
    which enable long filenames (-J for Windows ''Joliet'' extensions, or -R for UNIX
    ''Rock Ridge'' extensions). You can use -U -R to create a disc that''s identical
    to what''s on your hard disk, though this might not be readable on other machines.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_165_0.png)'
  merge: -1
  img_proc: true
