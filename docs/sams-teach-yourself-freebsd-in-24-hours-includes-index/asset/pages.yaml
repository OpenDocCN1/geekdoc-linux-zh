    # Special Features of Bash


    As mentioned previously, we are going to focus primarily on the Bash shell in
    this hour because it is one of the easiest shells for new users to work with—yet
    it is also one of the most powerful shells available. We will look at some of
    the features available in Bash, including history editing and command line completion.


    Bash can be installed from the FreeBSD installation CD, under the "shells" category
    in the packages. To run Bash, after it''s installed, simply type bash at the command
    line. (You might have to log out and back in before the system recognizes it as
    a valid command.)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_83_0.png)


    > To permanently switch your shell to Bash, use the chsh command ("change shell")
    and specify /usr/local/bin/bash on the Shell: line.


    # Command Line History


    The bash shell store keeps a history of the commands you have typed. If you want
    to repeat a command, you can move back through the history of previous commands
    by using the Up arrow key. You can also move forward in the list by using the
    Down arrow key. When you have found the command you want to run again, you can
    simply press Enter to re-execute the command. If you want to edit the command
    first, you can use the left and right arrow keys, the backspace key, and the delete
    key to change it. The history file in which the commands are stored is .bash_history,
    which is located in your home directory.


    # Command Line Completion


    Bash also has the capability to complete a command line for you. It can complete
    the name of a command as well as the name of a directory or file path. To access
    this feature,'
