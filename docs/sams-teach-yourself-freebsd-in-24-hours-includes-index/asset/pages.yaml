- pgno: 375
  md: 'As a general security measure in the operating system, port numbers lower than
    1024 can only be opened by the root user. Because of this, the parent Apache process
    needs to be run as root. However, the child processes are usually run as nobody,
    which is an account that has no special privileges and cannot log in to the system.


    Note that Apache is subject to UNIX file permissions. Thus, in order for files
    and directories to be available to visitors to your site, they need to be readable
    by the user nobody. Usually, this will not be an issue because the files can just
    be world readable.


    After the Apache server has been installed and started, you should be able to
    access it loading the following address into your Web browser (if you are attempting
    to access it from the same machine the Web server is running on.)


    ```

    http://127.0.0.1

    ```


    If the server is running, you should get the default Apache welcome page. Of course,
    you will want to replace this page with whatever the home page of your Web site
    will be.


    Note that if the server is currently on a network, you should also be able to
    access the Web server from a different computer by entering the IP address of
    the Web server machine into the Web browser.


    # CGI


    CGI stands for Common Gateway Interface. It is a method through which Web servers
    can run external programs and even pass data entered on a Web page form to an
    external program. The external program can also send output back to the Web server,
    which can then be displayed on a Web page, for example.


    Although these external programs are commonly referred to as CGI scripts, they
    do not necessarily have to be scripts. CGI programs can be written in any language.
    The most common language for writing CGI scripts in UNIX is Perl. However, CGI
    can also be written in Python, TCL, shell script, AWK, SED, Java, or even a fully
    compiled language such as C. A discussion of how to write and use CGI scripts
    in your Web pages is beyond the scope of this book. However, we will cover how
    to enable CGI in the Apache server, as well as how to ensure that they don''t
    end up compromising the security of your system.


    # Configuring Apache for CGI


    CGI scripts generally have addresses that look something like the following:


    ```

    http://www.mycompany.com/cgi-bin/myscript.pl

    ```'
  merge: -1
  img_proc: true
- pgno: 376
  md: 'In general, Apache will only allow scripts located in the cgi-bin directory
    to be executed. The cgi-bin directory should not be located in the same directory
    that normal Web pages are served from because you do not want visitors to be able
    to load the CGI scripts like normal Web pages.


    In the httpd.conf file, a line begins with ScriptAlias that determines where CGI
    scripts are stored. For example,


    ```

    ScriptAlias /cgi-bin/ "/usr/local/www/cgi-bin/"

    ```


    This line means that the CGI programs are actually stored in /usr/local/www/cgi-bin.
    The alias to that directory is the Web server root directory followed by the directory
    cgi-bin (for example, www.mycompany.com/cgi-bin). All of your CGI scripts need
    to be stored in /usr/local/www/cgi-bin. CGI scripts stored in normal Web page
    directories will be treated as normal HTML files and simply displayed rather than
    executed.


    Note that CGI scripts are programs that are actually executed on the Web server.
    Normally, they will be run as the same user who the Web server process is running
    as, which means that the CGI scripts will normally be run as the user nobody.


    As mentioned previously, we are not going to in to an in-depth discussion here
    about how to use CGI; however, the following is a very simple CGI program that
    you can use just to test whether you have Apache''s CGI support configured properly:


    ```

    #!/bin/sh

    echo "Hello. The current date and time is: "

    date

    ```


    Save this file in the /usr/local/www/cgi-bin directory as something with a .sh
    extension. For example, mycgi.sh. Make sure that the file is set to be executable
    (recall Hour 5''s lesson, "Users and Groups").


    To prove that this is a normal file that can be executed directly from the FreeBSD
    command prompt, simply run it like normal. Note that because this directory will
    not be in your path, you will need to specifically tell FreeBSD that the file
    is located in the current directory. This can be done by preceding the command
    with a leading ./—for example, ./mycgi.sh. Here is a sample of what the program
    will display:


    ```

    $ ./mycgi.sh

    Hello, the current date and time is:

    Tue Jul 23 23:14:12 CDT 2002

    ```'
  merge: -1
  img_proc: true
- pgno: 377
  md: 'Now load the page into a Web browser. If the Web browser is located on the
    same system that that Web server is on, you should be able to use the following
    address to access the page:


    ```

    http://127.0.0.1/cgi-bin/mycgi.sh

    ```


    However, if you are accessing the page from a different system connected to the
    Web server over a network, use the IP address of the Web server system followed
    by /cgi-bin/mycgi.sh.


    If CGI support is configured correctly, you should get a simple Web page that
    displays the "Hello, the current date and time is:" message followed by whatever
    the current date and time is.


    # Troubleshooting CGI


    If you don''t get the expected results, there are two common problems you might
    have run into. The first is that instead of displaying the "Hello" message followed
    by the current date and time, the Web page displays the source code for the CGI
    script. In other words, you get a Web page that displays the following:


    ```

    #!/bin/sh

    echo "Hello. The current date and time is: "

    date

    ```


    This probably means that the directory is configured as a normal Web site directory
    and not as a CGI directory. Apache will only allow scripts to be executed if they
    are located in a directory that is configured as a CGI directory in httpd.conf
    (which is done by following the procedures mentioned previously). If the directory
    in which the script is stored is not configured as a CGI directory, Apache will
    treat it as a normal file and simply send its contents over the Internet to the
    visitor''s browser.


    The second problem you might run into is that you get a Web page that says something
    like the following:


    ```

    Forbidden

    You don''t have permission to access the requested resource

    ```


    This message generally indicates one of two things:


    +   - The script you are trying to load does not have the executable bit set.
    Therefore, Apache cannot run it.

    +   - The user who the Web server runs as (nobody unless you changed it) does
    not have permission to execute the script. Therefore, Apache cannot run it.


    Check the permissions on the file, as you learned in Hour 5, and try again.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_378_0.png)


    > Poorly written CGI scripts are one of the biggest sources of security holes
    on Web servers—especially if the script receives data from a form on a Web site.
    It''s possible, for example, for a hacker to pass bogus information to the script
    through the form and cause the script to do something you never intended it to
    do. Because of this, you need to be extremely careful when writing your CGI scripts.
    Also, it is safer to write CGI scripts in a language such as Perl or Python rather
    than as shell scripts; these languages provide better runtime environment protection
    than shell programs and ensure a consistent security model.


    # Apache Modules


    Apache modules can be used to extend the functionality of the Web server. For
    example, the mod_php module allows you to embed a scripting language into your
    Web page. The PHP language is a fully featured programming language with one of
    its strongest points being database access. This can allow you to build Web based
    front ends to such services as search engines, library card catalogs, and online
    stores.


    The Apache modules can be compiled into the Apache server, or they can be dynamically
    loaded at runtime. Most of the modules are available these days in dynamically
    loadable versions so that one does not have to recompile the Apache software.
    These modules are called Dynamic Shared Modules, or more commonly, DSOs.


    Quite a few Apache modules are available in the ports collection. These modules
    can be found in the /usr/ports/www directory. For example, one of the modules
    available here is the PHP module that we discussed earlier.


    After you have installed the PHP port, you need to tell Apache about the new module.
    This is done by adding configuration options to the httpd.conf file that we introduced
    earlier. Edit the httpd.conf file and look for the following lines, which will
    probably be commented out. Simply uncomment them.


    ```

    AddType application/x-httpd-php .php

    LoadModule php4_module libexec/libphp4.so

    ```


    The preceding lines might not be exact, but look for something similar. If you
    can''t find anything in httpd.conf that matches (you might try using your text
    editor''s search function or the command-line grep utility to look through the
    file for the string php), look for a section that has a long series of lines starting
    with AddType and LoadModule. Add the AddType and LoadModule lines shown here to
    the ends of these blocks of directives, respectively.'
