  md: 'into the background and returns you to the command prompt. The following is
    the output you would get when trying to mount the share specified in the preceding
    example /etc/fstab line after trying for 60 seconds:


    ```

    # mount /home2

    spots:/home: nfsd: RPCPROG_NFS: RPC: Port mapper failure - RPC: Timed out


    nfs: Cannot immediately mount spots:/home, backgrounding

    ```


    The background mount_nfs process will keep trying to mount the share until it''s
    successful. This method is particularly useful in computing clusters or labs in
    which NFS-mounted resources are nice to have but not required for correct operation—for
    example, a cluster in which an NFS mount contains popular user programs or games,
    but all critical system functions are available on disks on the local system.


    # Samba and Windows File Sharing


    FTP and NFS are good for communicating and sharing files between two UNIX machines.
    But the fact is that this is a Windows world, and no matter what kind of network
    environment your machine will be in, it will probably be surrounded by Windows
    machines. If you want to share files with your Windows using friends, you''re
    going to have to play by their rules.


    Fortunately, FreeBSD has the capability to do Windows-style file sharing with
    all the functionality that a Windows machine would have. Specifically, it has
    Samba, a software package that allows a UNIX machine to appear to be just another
    Windows machine on the local network; Windows machines can connect to it just
    as they would to another Windows machine. Samba even handles printer sharing and
    domain logins, and can act as a Windows domain controller in its own right.


    An advantage that Windows NetBIOS/SMB protocol has over systems such as NFS is
    that it supports automatic server discovery, or browsing. In Windows, if you open
    the Network Neighborhood or My Network Places window, it will display the names
    of all available SMB servers on the local network. This way, you know which servers
    you can connect to without having to know their names in advance.


    The name of each machine, as it appears in the network browser window (as shown
    in Figure 24.4), is its NetBIOS name, a designation that Windows allows to be
    up to 15 characters long. Although Windows requires you to input a NetBIOS name
    in uppercase, it shows up in the network browser window in initially capitalized,
    lowercase form. Under other operating systems (such as FreeBSD), the NetBIOS name
    is the same as the machine''s hostname, truncated to 15 characters if necessary.'
  merge: -1
  img_proc: true
- pgno: 416
  md: '**FIGURE 24.4**

    *The Windows network browser window showing a FreeBSD machine running Samba.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_416_0.png)


    NetBIOS names are handled by a form of name service, somewhat like DNS names,
    but mapping the displayed NetBIOS machine names to particular machines is based
    on other criteria as well as the IP address (because NetBIOS isn''t restricted
    to IP). Samba''s name server component is separate from the actual SMB data server,
    as you will see.


    One drawback to NetBIOS is that it operates only on a LAN; NetBIOS packets are
    broadcast based, and therefore aren''t forwarded by routers. The WINS (Windows
    Internet Name Service) protocol exists to link Windows sharing zones on different
    networks, mitigating this issue somewhat.


    # ## Installing and Configuring Samba


    Samba is available in the ports at `/usr/ports/net/samba` or in the packages.
    Refer to Hour 6, “Adding and Removing Third-Party Software,” for details on how
    to install a package or port.


    After you have installed the Samba package, a variety of new items will be installed:
    daemon executables (in `/usr/local/sbin`), administrative tools (in `/usr/local/bin`),
    documentation and examples (in `/usr/local/share`), and configuration files that
    go into `/usr/local/etc`. Some of the possible config files don’t exist in the
    default installation; you have to create them from scratch if you want to take
    advantage of their functionality. There are also code pages (in `/usr/local/etc/codepages`)
    that map Windows character sets to UNIX ones.


    The only configuration file that exists in the package is `/usr/local/etc/smb.conf.default`,
    which you must rename to `smb.conf` for it to work. Similarly, the `/usr/local/etc/rc.d/samba.sh.sample`
    startup script must be renamed to `samba.sh`. In the very easiest way to get Samba
    running, you only need to edit `smb.conf` and modify the workgroup line to reflect
    the workgroup or domain of which your machine is a part. For instance, if your
    workgroup is called MYGROUP, change the workgroup line as follows:'
