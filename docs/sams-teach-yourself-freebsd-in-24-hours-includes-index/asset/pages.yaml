    # The GNU Info System


    As you might have already figured out, the man pages are rather obtuse and often
    seem to be written for users who probably don''t need them. New users often don''t
    find the man pages very useful. Because of this, the GNU project came up with
    the info system.


    The info system works similar to the man pages except that info pages are usually
    much more detailed and helpful to new users.


    To read an info page, simply type info followed by the name of the command. Note
    that not all commands have info pages. If you request an info page for a command
    that does not have an info page, info will load the man page for that command
    instead.


    Like the man page viewer, you can use the Page Up or Page Down keys, the arrow
    keys, and the spacebar to navigate through the info page. However, the info system
    also supports hyperlinks similar to links in Web pages. To use them, simply use
