- pgno: 42
  md: '# Beginning the FreeBSD Installation


    As mentioned previously, the first thing you should do before installing FreeBSD
    is to make backups of anything important on your system that you want to save—even
    if you plan to use a program such as Partition Magic to repartition your drive.
    Although these programs normally do their job without damaging your data, mistakes
    can be made that could still cause you to lose everything on your disk. So it
    is always a good idea to make backups.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_42_0.png)


    > If you plan to start with a blank hard disk and you want to install Windows
    and FreeBSD, make sure that you install Windows first. If you don''t, Windows
    will make assumptions when you install it later and will wipe out the FreeBSD
    boot loader, which will leave you unable to boot into FreeBSD. Also, when you
    partition your hard disk to install Windows, make sure that you leave enough unpartitioned
    space for FreeBSD.


    The CD included with this book is bootable, so place the CD in your CD-ROM drive
    and restart your system. If your system boots right back into Windows instead
    of starting the FreeBSD installation, you will need to change the order in which
    your system looks for bootable devices. This is done from your system''s CMOS
    setup utility. Methods of accessing this utility vary on different systems, but
    usually it involves pressing a particular key or keys when the system is starting.
    The most common are the delete key or the escape key. Also, once you are in the
    CMOS, the methods for changing the boot order vary across systems. Basically,
    you are looking for an option that says something like “Boot device order.” The
    important thing is to make sure that your system checks the CD-ROM drive first.
    When this has been configured, save the changes to the CMOS program and exit.
    The system will reboot, and you should see the FreeBSD installation program starting.
    Several messages will flash by your screen, and eventually you should see a screen
    that looks like Figure 2.1.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_43_0.png)


    FIGURE 2.1

    The main menu of the FreeBSD sysinstall program, which allows you to install and
