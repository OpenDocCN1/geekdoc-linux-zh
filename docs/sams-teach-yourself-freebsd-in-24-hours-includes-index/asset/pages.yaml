- pgno: 48
  md: 'After you have selected the media you want to install from, you will be given
    a message informing you that this is your last chance to back out before changes
    are made to your hard disk. If you are sure that you are ready to continue, select
    OK, and FreeBSD will begin copying files to your hard disk. Note that this process
    can take quite some time, and there is no sense in babysitting it. So feel free
    to do something else when the files are being copied.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_48_0.png)


    > Up until the point when you are asked if you want to continue the installation,
    no changes have actually been made to your hard disk. This is your last chance
    to back out. If you continue here, changes will be written to your hard disk.


    # Post Installation


    After FreeBSD has finished copying files, several post installation tasks must
    be performed.


    The first question you will be asked is if you want to configure any Ethernet
    or slip/ppp network devices. I suggest that you select No here unless you are
    sure that you know what you are doing. We will discuss configuring the network
    in detail in Hour 13.


    There are some other advantages to not having the machine on the network right
    away. For example, the system will be relatively exposed, and if it isn''t connected
    to the network, hackers can''t get to it.


    Next, you will be asked if you want this machine to function as a network gateway.
    Once again, I suggest that you select No here. The next question will ask you
    if you want to configure inetd and simple Internet services. Once again, select
    No here. These topics and their configuration will be discussed later on in this
    book.


    Select No to the question about whether you want to allow anonymous FTP access
    to this machine. Anonymous FTP will be discussed in Hour 24, as well as how to
    enable it if you so desire.


    At this point, you don''t want to use this system as an NFS server, so you can
    select No to this question as well. NFS stands for Network File System, and it
    is a way for one UNIX server to access a filesystem located on a different server.
    NFS is not common in small business setups, and it is a topic that is beyond the
    scope of this book. You can also select No when asked if you want to configure
    this system as an NFS client.'
