- pgno: 249
  md: '# Hour 14


    # Dial-Up Network Connections


    Although broadband Internet connections are becoming increasingly common and more
    widely available, a regular phone line and modem are still a widely used method
    of connecting to the Internet. This hour looks at how to configure a dial-up network
    connection to the Internet.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_249_0.png)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_249_1.png)


    > This hour''s lesson only applies to readers who want to connect to the Internet
    using a dial-up connection over a phone line. Readers wishing to connect to the
    Internet using DSL or cable modems, or who are simply connecting to an existing
    Ethernet network, should follow the procedures in Hour 13, "Connecting FreeBSD
    to an Existing Network."


    In this hour, you will learn how to do the following:


    +   - Select an ISP for use with FreeBSD.

    +   - Configure a dial-up Internet connection using User PPP.'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Selecting an Internet Service Provider


    When selecting an Internet service provider (ISP) for use with FreeBSD, there
    are more considerations to be made than when selecting a provider for Windows
    or Macintosh. Many ISPs have never heard of FreeBSD, Linux, or other operating
    systems; or if they have, they don’t have official support for them. Whereas Windows
    and Mac users often have access to step-by-step tutorials and customized installation
    procedures, with FreeBSD you will have to shoulder more of the burden of setup
    and configuration yourself. If you can find an ISP that officially supports FreeBSD,
    that’s a major plus. However, such ISPs are few and far between.


    The good news is that because FreeBSD is an operating system that supports all
    the standard networking protocols, there should be no difficulty connecting even
    to an ISP that doesn’t officially support the platform. In this hour, you will
    learn what you need to know in order to make that process a seamless one. However,
    you will probably be on your own as far as tech support goes when things don’t
    work correctly.


    In general, it is best to avoid so-called online services such as AOL and MSN.
    Getting these services to work with FreeBSD can be extremely difficult (and in
    some cases impossible) because these services often require special software that
    is only available for Windows or Macintosh. NetZero also will not work with FreeBSD
    at this time because their service requires special software.


    Some general questions to ask your ISP include the following:


    +   - **Can I get unlimited and unmetered access?** Almost all ISPs have unlimited
    access these days, so this is rarely a concern. However, check and make sure.
    You don’t want to run in to a situation in which you use up your monthly allotment
    of 150 hours and end up getting charged a high hourly rate for each hour beyond
    that limit that you use.

    +   - **What is your subscriber to phone line ratio?** This number, also referred
    to as the “user-to-modem ratio,” tells you how many customers the ISP has in total
    versus how many are typically dialed in at once. If the ISP has a lot of customers
    and not enough phone lines, you will end up getting a lot of busy signals when
    trying to connect. A typical ratio in the ISP industry is 6:1; higher ratios (such
    as 10:1) can be problematic.

    +   - **How much upstream bandwidth do you have?** This is how big the ISP’s connection
    is to the Internet backbone. ISPs that have a large number of subscribers and
    not a lot of upstream bandwidth can result in slow connections. For small-town
    ISPs, make sure that at least a T1 line or two is available. (A T1 line is 1.5Mbps.)
    For large corporate ISPs with many thousands of subscribers, multiple T3 (45Mbps)
    or larger lines are a necessity.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '+   - **What kind of value added features do you offer?** Many ISPs will throw
    in additional email addresses or space on their Web server for a personal Web
    site at no additional charge. If you want these features, find out if they are
    available, whether you get charged extra, and if so, how much.


    After you have found a suitable ISP, make sure that you have the following information
    available from them:


    +   - The phone number you need to dial for connecting to the Internet.

    +   - Your login name and password.

    +   - The type of authentication that your ISP uses. Normally this will either
    be CHAP or PAP, although some older systems still might use a shell login. (Don''t
    worry about what this means at this point; we will cover the various authentication
    methods later in this hour.) If the person you talk to doesn''t know what authentication
    is being used, FreeBSD and your ISP''s server can probably negotiate a compatible
    authentication on-the-fly, so it probably won''t be a big deal.

    +   - Whether you have a static or dynamic IP address. Chances are you will have
    a dynamic IP address. But if you have a static one, make sure that you know what
    the address is.

    +   - The IP addresses of your ISP''s primary and secondary Domain Name System
    (DNS) servers. These servers are used by your Web browser and such for looking
    up the addresses of Web sites.


    # Modem Information


    The next thing you need to obtain is information about your modem. Generally,
    the only thing you will need to know is what communications port your modem is
    on. If you do not know, and you have Windows installed, you can check the “Modems”
    tab in the Phone and Modem Options control panel and find the communication ports
    for any installed modems.


    The following shows Windows COM ports and their FreeBSD equivalents:


    | Windows | FreeBSD |

    |---|---|

    | COM1 | cuaa0 |

    | COM2 | cuaa1 |

    | COM3 | cuaa2 |

    | COM4 | cuaa3 |'
  merge: -1
  img_proc: true
- pgno: 252
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_252_0.png)


    FreeBSD requires a “real” hardware-based modem. In many cheaper modems (which
    are often the kind installed in systems from the factory these days), much of
    the modem functionality has been moved to software to save some money on the cost
    of building the modem. Unfortunately, these modems, often known as WinModems,
    generally only work with Windows. If you have a WinModem, you are probably out
    of luck and will have to purchase a different modem if you want to use a dial-up
    connection with FreeBSD.


    If you’re adventurous, you might want to look into the ltmdm port (/usr/ports/comms/ltmdm);
    it’s a third-party Linux driver for the Lucent WinModem chipset combined with
    a FreeBSD “shim.” It might be worth a try if you have no other options.


    # Configuring the Dial-up Internet Connection


    After you have all the required information, you are ready to configure the connection.
    Your Internet connection will use a method called the Point-to-Point Protocol
    (PPP). This is the most common protocol of communication in use today that allows
    Internet format traffic to be passed over a dial-up phone line.


    # Setting Up the DNS Servers


    The first thing to do is tell FreeBSD what the addresses of your ISP’s DNS servers
    are. This is configured in the file /etc/resolv.conf. Here is an example of what
    it looks like:


    ```

    domain myisp.com

    nameserver 111.111.11.1

    nameserver 222.222.22.2

    ```


    Note that you will need to be logged in as root to edit this file.


    The first line contains the domain name of your ISP. For example, if you use EarthLink
    (a popular national provider) as your ISP, the domain you would list here would
    be earthlink.net.


    The second and third lines contain the primary and secondary DNS servers for your
    ISP. Replace 111.111.11.1 and 222.222.22.2 with the primary and secondary addresses
    given to you by your ISP, respectively. After you have done this, save the file
    and exit the editor.'
  merge: -1
  img_proc: true
- pgno: 253
  md: 'When you have finished editing the /etc/resolv.conf file, you are ready to
    configure the connection. FreeBSD can connect to the Internet through a dial-up
    connection in two ways. The method that we will cover in this book is known as
    kernel PPP. It is slightly more efficient than the alternative, which is known
    as user PPP.


    # Configuring the Options File for Kernel PPP


    Most of the configuration for kernel PPP is done in the file /etc/ppp/options.
    Here is what a sample file might look like:


    ```

    /dev/cuaa0 115200

    crtscts

    modem

    connect "/usr/sbin/chat -f /etc/ppp/chat.script"

    noipdefault

    silent

    domain myisp.com

    defaultroute

    user foobar

    name foobar

    ```


    Here is what each line means.


    /dev/cuaa0 115200—This line indicates the device that your modem is on. You should
    have figured this out back when you gathered the information about your modem.
    In this case, as we pointed out earlier, cua a0 corresponds to COM1 in Windows.
    The second part of the line (115200) indicates the serial communication rate of
    the computer with the modem. Unless you have a very old system, 115200 should
    probably work fine. If you encounter weird problems, you might try reducing this
    to 57600.


    crtscts—This line turns on hardware flow control for the modem. Hardware flow
    control is required in order for high speed communication to work reliably; this
    line is therefore required.


    modem—This line tells FreeBSD that it should use the modem control lines.


    connect "/usr/sbin/chat -f /etc/ppp/chat.script"—This line specifies the "modem
    script" to run when connecting. It calls the chat program, which is a simple way
    for FreeBSD to run to communicate with the modem. The second part of the line
    (/etc/ppp/chat.script) tells the chat program the name of the modem script that
    it should read and execute. We haven''t created this script yet, but it is what
    will contain the phone number for the modem to dial, as well as other options.


    noipdefault—This line means that your ISP has not assigned you a static IP address
    and that you are using a dynamic IP address. Most dial-up users will have a dynamic'
  merge: -1
