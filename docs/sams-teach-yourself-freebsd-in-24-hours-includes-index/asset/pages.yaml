    # Terminating a Process


    Occasionally, a process in FreeBSD might stop responding. (No doubt, Windows users
    are familiar with this.) When this happens, you might have to force the process
    to quit, similar to the infamous Ctrl+Alt+Delete, End Task sequence in Windows.
    From the FreeBSD command line, this can be done with the kill command. The kill
    command is followed by the PID of the process you want to kill (which you can
    get from the output of the ps command).


    For example, in the last section, one of the processes listed is /usr/local/bin/mutt.
    Mutt happens to be an email client that is available for FreeBSD. Assume that
    the mutt program, for whatever reason, has stopped responding to the user''s commands.
    We see in the output from the ps command that the PID of the mutt program is 12578.
    To kill this process, you can use the command kill 12578. After the command is
    issued, the mutt program should terminate and the command line should reappear.
    If the kill command doesn''t work, you can use the -9 option to force the misbehaving
    process to terminate (for example, kill -9 12578). The difference is that the
    normal kill command attempts to terminate the process gracefully by sending it
    a signal telling it to clean up after itself and exit. However, the process can
    ignore this request. In this case, the kill -9 command will forcefully "squash"
    the process. This command is not a request, but rather a forceful termination
    that cannot be ignored.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_88_0.png)


    > The -9 option to the kill command should only be used if the normal kill command
    failed to terminate the process. -9 basically "pulls the rug" out from under the
    process. As such, the process will not get a chance to do any pre-termination
    actions that it might normally do, such as delete temporary files it might have
    created, and so on.


