    # Summary


    In this hour, we looked at how to configure a basic Web server suitable for simple
    Web hosting. The Apache Web server, however, is highly complex and capable of
    far more than we were able to cover here. Advanced topics such as virtual hosting
    and secure sites were not covered. For more information on the advanced capabilities
    of Apache, please see the online documentation at the project''s Web site (www.apache.org),
    or consult one of the books that is dedicated to Apache.


    # Q&A


    Q I''ve used Apache on Linux and other UNIX platforms; the files all seem to be
    in different places under FreeBSD. What gives?


    A It''s a common problem with the variation in different UNIX systems: Each one
    seems to have its own idea about which files go where. Some Linux distributions,
    for instance, put the Apache installation into a single directory structure under
    /var/lib/httpd. FreeBSD attempts to adhere to a strict conceptual layout; Web
    content and executables don''t go into /var, which is supposed to contain variable
    files (such as PID files, databases, and logs). Instead, Apache''s binaries go
    into /usr/local/sbin and /usr/local/bin (depending on whether they alter system
    behavior or not), logs are kept in /var/log, documentation is at /usr/local/share/doc/apache,
    Web content goes into /usr/local/www, and configuration files go into /usr/local/etc/apache.
    This means that the installation sprawls across the whole system, but the files
    are all organized according to function. The ports keep a packing list so that
    they can all be cleanly uninstalled.'
  merge: -1
  img_proc: true
- pgno: 383
  md: 'Q You''ve only talked about Apache 2.0. What about Apache 1.3? I thought that
    was the standard version.


    A Apache 1.3 has only just now reached the end of its lifetime; Apache has been
    in the 1.x series now for almost seven years, and the transition to 2.0 as a stable
    platform is now complete enough that there is no reason to learn 1.3 if you''re
    new to Apache. The only reason to know how 1.3 works is if you are managing a
    legacy installation. In any event, the configurations of the two versions are
    really quite similar and fully documented at the Apache Web site.


    Q How do I enable CGI in regular users'' directories (for example, not in the
    cgi-bin)?


    A Use the Options +ExecCGI directive to enable the ExecCGI option for a location
    or directory specified in a <Location> or <Directory> block. You will also need
    to use AddHandler cgi-script .cgi to map all executable files whose names end
    in .cgi to the CGI script handler.


    Q What about server-side includes?


    A You can enable "parsed HTML"—HTML files that are processed by the server before
    being sent out, executing embedded program calls—using the AddType and AddHandler
    directives. Consult the Apache Web site for full documentation on how this is
    done. With SSI enabled, you can do things like embedding program output into HTML
    files or altering the page''s appearance with basic flow control. It''s like a
    built-in precursor to PHP.


    Q Which is correct—.html or .htm?


    A The original extension was .html, which completely reflects the acronym HTML
    (Hypertext Markup Language). The only reason .htm exists as a valid extension
    is because of Windows, which at the time the Web was becoming popular didn''t
    support filename extensions longer than three characters. (Many Windows applications
    still don''t.) This is why UNIX supports .html variations such as .shtml and .phtml,
    whereas Windows is stuck with such meaningless abbreviated versions as .stm and
    .ptm. You''re using UNIX; use the longer extensions, just because you can.


    # Workshop


    This interactive section has quiz questions and exercises which are designed to
    test your understanding of Web services with Apache and to point the way toward
    more advanced exploration of the subject.'
  merge: -1
  img_proc: true
