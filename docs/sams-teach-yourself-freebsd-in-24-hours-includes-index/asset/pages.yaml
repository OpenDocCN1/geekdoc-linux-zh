- pgno: 187
  md: '# Hour 10


    # The FreeBSD Kernel and Device Tree


    We have talked briefly about the role of the kernel in previous hours of the book.
    In this hour, we will look at the kernel in greater depth. In addition, you will
    see how to build a new kernel and the reasons why you might want to do so.


    In this hour, you will learn:


    +   - What the kernel is and why you need it

    +   - Why you might want to build a new kernel

    +   - How to work with the kernel configuration file

    +   - How to build and install the new kernel

    +   - What you need to know about the device tree


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_187_0.png)'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# The Kernel and Its Purpose


    The kernel is a special piece of software that serves as the core of the operating
    system. Among other things, it controls how users interact with the hardware and
    how resources are allocated for software. In addition, the kernel implements network
    communications so that the computer can communicate with other computers over
    the LAN or the Internet. When a running program misbehaves, it is the kernel’s
    job to keep it from interfering with the operation of other programs, or from
    crashing the system. Figure 10.1 shows a simple diagram of how the kernel relates
    to the hardware and other running software.


    FIGURE 10.1

    The kernel isolates software and users from the hardware and thus controls access
    to system resources.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_188_0.png)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_188_1.png)


    > We mentioned that the kernel isolates software from the hardware. This is not
    always entirely true because in some special cases, software other then the kernel
    can access the hardware directly. This is primarily for performance reasons. Some
    examples are programs used for rendering high-end animation and so on. In this
    case, it is too much of a performance hit to make the program go through the kernel
    to access the video hardware, so it will usually access it directly.


    # Why Build a Custom Kernel?


    These days, it is far less common to have to build a custom kernel. In the past,
    the main reason for doing so was for device support. Usually, one built a custom
    kernel because the default kernel didn’t have support for a device in her system
    (a sound card, for example). These days however, sound card support—as well as
    support for most other devices—can be dynamically loaded as a kernel module. (Rather
    than being built directly into the kernel, the module can be loaded into the kernel
    dynamically at boot time.)'
  merge: -1
  img_proc: true
- pgno: 189
  md: 'However, there are still times when you might want to build a custom kernel.
    There are generally four possible reasons for doing this:


    +   - You''ve svsuped to a newer version of FreeBSD, and you need to rebuild the
    kernel to sync with the newer version.

    +   - You need to apply a patch to the kernel to fix a bug or security issue.

    +   - You want to remove support for devices you don''t have to give the kernel
    a smaller footprint.

    +   - You want to add support for a device in your kernel, and you don''t want
    to or can''t use a dynamically loadable module.


    The idea of rebuilding the core of the operating system from source is understandably
    rather intimidating to new users. However, the process is not nearly as complicated
    as it sounds, nor does it require any programming knowledge. Anyone can build
    a custom FreeBSD kernel by following the instructions given in this hour.


    # The Kernel Configuration File


    Based on what you have learned about FreeBSD configuration up to this point, you
    are probably guessing that kernel configuration is handled by a plain text file.
    And you are absolutely right. The kernel configuration file is located in the
    directory `/usr/src/sys/i386/conf`. The name of the configuration file that is
    used to build the default kernel (the one you are running after a fresh FreeBSD
    install, for example) is `GENERIC`. You won''t want to edit this file directly.
    Instead, make a copy of it. You can give the copy whatever name you want, but
    it usually makes since to give it a meaningful name. One common naming system
    is to give the kernel the same name as the system''s hostname on a network. If
    you aren''t on a network, you can be as creative as you want, or you can simply
    call it MYKERNEL or something. For example,


    ```

    cp GENERIC MYKERNEL

    ```


    Note that you will need to be logged in as root to make the copy of the file,
    as well as to make changes to it (which we will discuss shortly).


    # Editing the Configuration File


    Once you have made a copy of the file, open the copy you made in a text editor.
    At the top of the file, after several comments that begin with the pound sign
    (#), you will see the following lines:


    ```

    machine  i386

    cpu      i486_CPU

    cpu      i586_CPU

    cpu      i686_CPU

    ```'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'The first line specifies the machine type, and it will never change unless
    you are compiling a kernel for an Alpha system, which is currently the only other
    platform that FreeBSD supports with a production stable version. A discussion
    of Alpha support is beyond the scope of this book. Assuming that you are using
    an Intel x86 or compatible system (AMD or Cyrix), you will never need to change
    this line.


    The next three lines provide support for different generations of processors.
    Because the GENERIC kernel will run on everything from a 486 up to the latest
    Pentium 4 and AMD Athlon processors, the default kernel has support compiled in
    for all of them. In the custom kernel, you will want to remove support for all
    the processors that you don’t have. For example, if you have a Pentium 3 or Pentium
    4, you can remove all of the cpu lines except the i686_CPU line. Instead of actually
    deleting the lines, you can place a pound sign (#) in front of them. # indicates
    to the kernel building system that the rest of the line should be considered a
    comment. Comments are ignored by the system and not processed. So any line that
    starts with a # will not be included in the kernel, accomplishing the same thing
    as deleting the line altogether.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_190_0.png)


    > There is the possibility for confusion here because of different naming schemes
    among CPU vendors. Keep the following guidelines in mind: The original Pentium
    processor is an i586. The Pentium 2 through Pentium 4 processors are i686. Cyrix
    processors are even more confusing because the Cyrix 686 is actually an i586 as
    far as FreeBSD is concerned. AMD K6 processors are also i586, but AMD Athlon processors
    are i686. If you install a kernel that does not include support for your CPU type,
    you will be left with a system that cannot start. In the event that this happens
    to you, see the section near the end of this hour titled “Recovering from Botched
    Kernel Builds.”


    There are several more lines that are important and you might want to change:


    ```

    ident GENERIC

    ```


    This is simply the name of the kernel. It is what will show up when the kernel
    starts. The name listed here should be the same as the name you gave the new file
    you created.


    ```

    maxusers 32

    ```


    This option is rather poorly named and can cause a great deal of confusion. It
    has absolutely nothing to do with the maximum number of users who are allowed
    on the system. It actually controls the number of resources available in important
    system parameters. The number it sets will be approximately equal to the number
    of resources required by the number of users listed here. If you set maxusers
    to 1, FreeBSD will automatically manage the number of resources available.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '```

    device    npx0    at nexus? port IO_NPX irq 13

    ```


    Why does the configuration file even give this option to you? Who knows. But basically,
    this option provides floating point support. You cannot remove this device because
    the kernel cannot boot without it.


    ```

    #makeoptions    DEBUG=-g    #Build kernel with gdb(1) debug symbols

    ```


    By default, this option is commented out. Normal users will probably want to leave
    it that way. The debug symbols will greatly increase the size of the kernel. You
    only need the debug symbols for troubleshooting consistent kernel problems. You
    should leave this option commented out unless you are experiencing regular kernel
    panics. Then building a kernel with debug symbols can help you track down the
    problem.


    ```

    options    MATH_EMULATE    #Support for x87 emulation

    ```


    Unless you have a relatively ancient 386 system without a math coprocessor, or
    you have a 486SX, you can comment this line out. This option allows FreeBSD to
    emulate floating point math for systems that do not have a coprocessor.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_191_0.png)


    > > FreeBSD''s floating point math routines are not very accurate. Because of
    this, if you do not have a math coprocessor (all Pentium and higher CPUs do have
    one), you should change this option to GPL_MATH_EMULATE. The GPL math routines
    are more accurate than the default FreeBSD ones.


    You can generally ignore the rest of the options lines.


    The device lines are where you will want to make most of the changes to the kernel
    configuration. Here you can remove support for devices that you don''t have, as
    well as add support for devices that you do have, which are not supported in the
    default kernel. For example, you can remove support for network cards you do not
    have. Several devices listed here are commented out and thus not included in the
    default kernel. If you have one of these devices and need to enable it, you can
    do so by removing # from in front of the device.


    Several additional devices can be enabled that are not listed here. We will look
    at how to get a complete list of all possible devices later on in this hour. An
    example of a device that is not listed here but is fairly common is a device to
    support sound cards. To add support for most common sound cards, you would add
    the following line:


    ```

    device    pcm

    ```'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# The NOTES File


    In the same directory as the kernel configuration files, you will also find a
    file called NOTES. The NOTES file contains a list of all possible options and
    devices, along with comments that explain what they do. The NOTES file also contains
    device hints, which will be discussed later in this hour.


    Typing the command `make lint` from the directory will cause a kernel configuration
    file called LINT to be created in the directory. This file contains every possible
    device as well as every possible option. You should not actually try to build
    a kernel with the LINT file though. For one thing, if the kernel did build, it
    would be huge. Also, the kernel probably would not be able to boot because certain
    devices and options are mutually exclusive and will cause conflicts if used together.
    Probably, a kernel will not even compile if you use LINT as the configuration
    file.


    # Building the New Kernel


    After you have finished editing your custom kernel configuration file and have
    saved it, you are ready to build the new kernel. Change back to the `/usr/src`
    directory and use the following command:


    ```

    make buildkernel KERNCONF=MYKERNEL

    ```


    *MYKERNEL* should, of course, be replaced with the actual name of the custom kernel
    configuration file that you used.


    After you have entered the command, FreeBSD will first check the kernel configuration
    file to make sure that it is valid. If you have any illegal options or formatting
    errors in the file, FreeBSD will let you know about them and then the process
    will stop so that you can go back and fix the problems. After you have fixed any
    problems, simply run the `make buildkernel KERNCONF=MYKERNEL` command again.


    Assuming that no problems are found with your configuration file, FreeBSD will
    begin building the new kernel. You will see a lot of messages go by on the screen
    from the C compiler during this process. Don''t worry about what these messages
    mean. On a reasonably fast system, the process of building the new kernel will
    probably take around 15 minutes or so. Of course, extremely fast systems could
    take much less time, and extremely slow systems could take much longer. After
    the process has completed, you will be returned to the command prompt.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Installing the New Kernel


    After the build process is complete and you have the command prompt back, the
    new kernel has been built, but it is not yet actually installed. Installing the
    new kernel is the focus of this section.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_193_0.png)


    > After you install the new kernel, you will need to reboot the system for the
    new kernel to actually be loaded and start running the system. It is important
    to make sure that you have physical access to the system at this point. It is
    possible to build and install a new kernel remotely, and then also reboot the
    system remotely. However, if you botch the kernel configuration file and the new
    kernel cannot boot, the system will be rendered unusable until you can get to
    the physical system and straighten out the problem from there. Unless you are
    absolutely sure that the new kernel will boot, it is always best to wait until
    you can get physical access to the system before you install the new kernel and
    reboot the system.


    To install the new kernel once the build process has finished, use the following
    command:


    ```

    make installkernel KERNCONF=MYKERNEL

    ```


    Once again, MYKERNEL should be replaced with whatever name you gave your custom
    kernel configuration file. The install process will cause two main things to happen:


    +   - The new kernel will be copied into /boot and given the name kernel.

    +   - The old kernel will be copied to /boot/kernel.old, giving you a rescue kernel
    that is known to be good. If the new kernel cannot boot, you can fall back on
    this rescue kernel to allow you to reboot the system and then fix whatever problem
    is preventing the new kernel from booting.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_193_1.png)


    > Whenever you install a new kernel, whatever kernel is currently installed will
    be copied to /boot/kernel.org. This means that if you botch the kernel configuration
    and create a kernel that can''t boot, the next time you install a kernel, the
    broken kernel will be copied to kernel.old. If the new kernel you created won''t
    boot, you will be out of luck since now both kernel and kernel.old are broken.
    Because of this, if you do have to boot kernel.old and fix a problem with your
    new kernel, it is a good idea to copy kernel.old to some other name (kernel1.old
    for example). This ensures that you will still have a bootable kernel even if
    your second kernel won''t boot. At that point, you can boot kernel1.old. More
    on how to boot a rescue kernel will be explained later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'After the install process has completed, you can reboot your system to boot
    the new kernel. If all goes well, you should see your custom kernel name listed
    when the system reboots, as well as the time that you created the new kernel.
    If something goes wrong, the following section can help.


    # Recovering from Botched Kernel Builds


    Several things can go wrong while attempting to build a new kernel. Here are some
    of the possible problems and how to remedy them.


    # “Kernel panic!” Message After Reboot


    This is one of the most serious problems. Basically, the kernel builds and installs
    fine, but then "panics" after you reboot.


    Depending on what is wrong, you might get an error message on reboot that says
    "Kernel panic!" followed by a short description of the error. At that point, the
    system might automatically reboot, or it might simply halt. However, just because
    the kernel is panicking doesn''t mean that you have to panic as well. You have
    the backup kernel that was created for you when you installed the new kernel,
    and you can use it to boot the system so that you can fix whatever is preventing
    the new kernel from booting.


    To boot from the old kernel, restart the system if it hasn''t automatically done
    so already. At the prompt where it is counting down from 10, press any key to
    interrupt the boot process. Then, at the prompt, type the following:


    ```

    boot /boot/kernel.old

    ```


    If you need to boot some other kernel, simply replace kernel.old with the name
    of whatever kernel you need to boot, for example kernel1.old. After the kernel
    has finished booting, start over with the kernel configuration instructions you
    learned at the beginning of the hour.


    # System Hangs After Reboot


    Another problem that could occur is that the kernel simply hangs during the boot
    process instead of panicking. In this case, you can reboot the system and follow
    the same procedures given previously to boot an alternative kernel.


    Another possibility is that the kernel might not be hung at all, but is attempting
    to probe for a device that you don''t have. In this case, the kernel might wait
    for a long time before continuing to boot. The messages on the screen should give
    you some help in figuring out which device is causing the problems.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Kernel Build Fails with “* Error code” Message


    Another thing that can go wrong is that the build process bails out with an error
    message. One of the most common is “* Error code 1”. If this happens, it means
    that something is wrong with the kernel source code itself. In this case, try
    to use the last compiler message to see if you can find out which module was being
    compiled when the error occurred. Unless you are a programmer, the best thing
    you can probably do is post the error message along with the last few lines to
    the FreeBSD-questions mailing list and ask for help. Before you do this though,
    if you have cvsupped to a newer source tree, make sure that you check the freebsd-stable
    mailing list for any warnings that the kernel compile pile might be broken at
    the present time. If so, wait until the all is clear is posted to the list, cvsup
    the source tree again, and start over.


    Another possible compiler error message you might see are signal 11 errors. This
    is an internal compiler error that is often difficult to track down. It can be
    the result of flaky hardware—with bad RAM being a common culprit. Make a note
    of where the signal 11 error occurred, and then attempt to rebuild the kernel.
    If the signal 11 occurs again in a different spot than it did the first time,
    hardware problems are almost certainly the culprit.


    # Certain System Utilities Stop Working


    One other problem you could run into is that certain system utilities such as
    ps stop working with the new kernel. This is usually caused by your kernel being
    out of sync with the rest of the system. This can occur if you have cvsupped your
    source code tree to a newer version of FreeBSD but have not rebuilt the system.
    In this case, your kernel will have been built with the newer sources, but the
    rest of your system will have been built with older ones. You will need to rebuild
    the rest of your system so that it is synchronized with the new kernel. Instructions
    on how to do this can be found in Hour 11, “Updating FreeBSD.”


    # Summary


    In this hour, you learned more about what the kernel does and why you might want
    to build a custom one. You learned that like most things in FreeBSD, the kernel
    configuration is controlled by a text file. You saw how to build and install a
    new kernel and how to recover if something goes wrong.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_195_0.png)'
  merge: -1
  img_proc: true
