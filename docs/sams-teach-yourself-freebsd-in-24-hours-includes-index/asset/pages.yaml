    # Window Managers and Desktop Environments


    Although KDE is one of the most popular desktop environments available for FreeBSD,
    it is by no means the only one available. There are several alternatives ranging
    from the very simple to the very complex. In this hour, we will look briefly at
    some of these alternatives.


    In this hour, you will learn:


    +   - The difference between window managers and desktop environments

    +   - About some of the alternatives available to KDE

    +   - How to install alternative window managers

    +   - How to change your default window manager'
