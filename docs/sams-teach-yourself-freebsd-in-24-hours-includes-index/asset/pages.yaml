- pgno: 307
  md: '# Starting X


    When you have exited xf86config and you are back at the command prompt, you are
    ready to start X. First of all, log back in under your normal user account, or
    type exit if you used su to become root. When you are back at your normal user
    prompt, type the following command to start X:


    ```

    startx

    ```


    Your screen will go blank for a few moments, and pretty soon you should see a
    checkered background with a large X on it. This means that the X Window System
    is starting up. After a few more seconds, you should see a screen that looks like
    Figure 17.6.


    FIGURE 17.6

    *The default X environment running the twm window manager.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_307_0.png)


    The first thing you might notice about X is that it looks very ugly. Don''t worry
    about this. As we mentioned earlier, different window managers can change the
    look and feel of X. By default, FreeBSD uses the twm window manager, which is
    very simple and is one of the first window mangers created for X. In the next
    hour, you will learn how to change the default window manager to something more
    user friendly and a lot more aesthetically pleasing.


    If, instead of getting an X screen, your monitor goes blank and stays that way
    or your power light starts blinking and the monitor appears to have turned off
    or gone into suspend mode, it probably means that you selected a refresh rate
    that is higher than your'
  merge: -1
  img_proc: true
- pgno: 308
  md: 'monitor can support. Use the Ctrl+Alt+Backspace key combination mentioned earlier
    to exit X and restart the xf86config program—this time making sure that you enter
    refresh rates that your monitor can handle.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_308_0.png)


    > If your screen appears garbled or if you hear a high pitched whine coming from
    your monitor, immediately press the Ctrl+Alt+Backspace key combination to kill
    the X Window System. Either one of these is a sign that your monitor is trying
    to run a refresh rate that it can''t handle. A high pitched whine especially indicates
    that your monitor is about ready to destroy itself. If you leave it in this state
    much longer, it might even start smoking.


    To exit from X and return to the command prompt, hold down the left mouse button
    on a blank area of the desktop. A menu will pop up, and one of the options will
    be Exit. Move the mouse pointer over this option and release the mouse button.
    X should exit, and you should be returned to the command prompt.


    # Summary


    In this hour, you learned that the X Window System is a system that provides a
    graphical user interface to FreeBSD similar to that of Windows. You also learned
    the basic differences between X and a window manager, and learned that they work
    together to provide you with a working environment that can actually be used productively.
    You saw that X configuration is handled by the file XF86Config, and that you can
    use the xf86config program to build this configuration file for you. Finally,
    you learned how to start X and exit from the default twm window manager.


    # Q&A


    **Q** Where can I obtain a complete list of the video cards that XFree86 supports?

    **A** An up-to-date list of supported video hardware can be obtained from the
    XFree86 projects Web site at the following address:

    http://www.xfree86.org/current/Status.html


    **Q** What is the difference between X and a window manager?

    **A** X provides a framework for running a graphical user interface on FreeBSD.
    The window manager runs on top of X and is what provides the actual functionality
    for the user.'
  merge: -1
  img_proc: true
- pgno: 309
  md: 'Q What is the difference between a window manager and a desktop environment?


    A We will cover this more in Hour 19, but in a nutshell, a desktop environment
    generally provides more features than a window manager—such as integrated file
    managers, drag and drop, desktop icons, and often an integrated suite of applications.
    Window managers, on the other hand, usually just provide basic window management
    functionality—such as simple menus, the ability to move and resize windows, and
    controls such as minimize, maximize, and close.


    Q What is the difference between XF86Config and xf86config?


    A XF86Config is the actual text-based configuration file that controls various
    attributes of the X Window System, whereas xf86config is the program that provides
    a set of questions for you to answer and helps you build the XF86Config file.


    # Workshop


