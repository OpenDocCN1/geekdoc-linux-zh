- pgno: 27
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_27_0.png)


    # Hour 1


    # Planning for and Preparing to Install FreeBSD


    Before you can use FreeBSD, you need to install it on your computer''s hard disk.
    In this hour, we will discuss the background information needed to make the best
    decision about how to install FreeBSD. Of course, the first thing you might want
    is a little bit of background on FreeBSD.


    # What Is FreeBSD?


    FreeBSD is a freely available and open source implementation of the Berkeley version
    of the UNIX operating system. In many ways, it is similar to Linux, but it also
    has some important differences. Let''s look at a few of the buzzwords and phrases
    that can be used to describe FreeBSD, as well as what those words and phrases
    mean.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# FreeBSD Is a True UNIX Operating System


    This means FreeBSD is in the same family of operating systems as Solaris, AIX,
    HP-UX, and Digital UNIX. The original UNIX operating system can trace its roots
    back to the 1960s. The designers of UNIX created a design so flexible and powerful
    that even 30 years later, UNIX (and thus FreeBSD as well) remains one of the most
    versatile, well-respected operating systems available.


    # FreeBSD Is Open Source


    This means that all the source code for the entire operating system is available
    to you. If you are not a programmer, this might not mean much to you. However,
    even end users benefit from open source because thousands of programmers use FreeBSD.
    The fact that the source is available to them means that bugs and possible security
    problems are likely to be found and fixed quicker than in operating systems developed
    by commercial companies in which users do not get access to the source code.


    # FreeBSD Is Free and Has a Very Liberal License Agreement


    You can download FreeBSD free from the Internet. You can burn your own FreeBSD
    CDs or purchase copies of FreeBSD from various sources for just a few dollars.
    Unlike Windows, and some commercial versions of UNIX, there are no per-user or
    per-server license fees for FreeBSD. You can install FreeBSD on as many systems
    as you want and allow as many users to access it as you want without paying a
    penny. If you run a business, this has the potential to save you thousands of
    dollars in software licensing fees.


    # FreeBSD Is Stable and Powerful


    The old adage “You get what you pay for” doesn’t apply to FreeBSD. A lot of people
    assume that because FreeBSD is free and is developed primarily by volunteer “hobbyists,”
    it must be little more than a toy that cannot be taken seriously or relied upon
    for doing serious work. Nothing could be further from the truth. Many large corporations
    are relying on FreeBSD for many tasks. Some of the companies and organizations
    currently using FreeBSD include Sony, Yahoo!, Microsoft, the Apache project, and
    Hollywood special effects studios. Many people regard FreeBSD as one of the most
    stable operating systems available. System crashes common in Windows become a
    thing of the past with FreeBSD.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# What Is FreeBSD Being Used for?


    Because the source code for FreeBSD is freely available and FreeBSD comes with
    a large number of programming tools, what you can do with FreeBSD is really only
    limited by your imagination and skill as a programmer. However, without having
    any programming skill, here are some of things that you can do with FreeBSD.


    # Set Up a Powerful Web Server


    The CD that comes with this book includes the Apache Web server, which is the
    most popular Web server software on the Internet. FreeBSD and Apache is widely
    regarded as one of the best software combinations for building a powerful and
    stable Web server. Yahoo!, the Apache Project itself, and Sony Japan rely on FreeBSD
    to power their Web sites. If you do not want set up a public Web server, FreeBSD
    also makes a great platform for running a corporate intranet.


    # Email Services


    If you need an email server for your organization, FreeBSD can do the job quite
    well. The resource requirements of FreeBSD are very low, so it can often turn
    an old and outdated system into a perfectly serviceable email server. That old
    486 you use as a doorstop might just have a use.


    # DNS and Routing Services


    You can make a perfectly serviceable router or DNS server using FreeBSD—even one
    with sophisticated functions such as firewalling and Network Address Translation
    (NAT). Once again, this can be a more attractive option than purchasing a dedicated
    router if you have an older system sitting around that is not being used for anything.
    FreeBSD also has the capability to allow you to share a single Internet connection
    with several systems, even if you only have one connection and one IP address.


    # File and Printer Sharing


    With the freely available SAMBA software, you can create a file or print server
    that is compatible with Microsoft Windows workstations. You can even create a
    FreeBSD server that emulates a Windows NT domain controller.


    # Database Services


    There are several freely available SQL database servers for FreeBSD. These freely
    available databases are being used by some major organizations, including NASA.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Software Development/Learning Programming


    If you want to learn programming, FreeBSD is a great platform to do it on. For
    one thing, FreeBSD comes with compilers for several programming languages. Many
    more can be downloaded free. On some other operating systems, these compilers
    would cost thousands of dollars.


    # Learning UNIX


    If you need to learn UNIX for a class or for your job, FreeBSD can help you do
    it. And it can help you do it at home on your own time. FreeBSD is a real UNIX
    operating system that allows you to get hands-on experience.


    # Inexpensive UNIX Workstations


    Thousands of applications are available for FreeBSD—most of them at no cost. These
    applications range from Web browsers to office packages to email clients to scientific
    applications. In addition, you can work with remote X applications running on
    any remote UNIX server.


    # FreeBSD Compared to Other Operating Systems


    You might be wondering how FreeBSD compares to other operating systems. In this
    section, we will look at how FreeBSD compares to several other operating systems,
    including other flavors of UNIX and Windows.


    # FreeBSD Compared to Linux


    Most people today have at least heard of Linux, even if they do not have a very
    good idea of what it is. Linux is a clone, or “work alike,” of the UNIX operating
    system. It was originally started as a hobby project by Linus Torvalds, but has
    since grown to be developed by thousands of volunteers all over the world. Linux
    is a project that was started from scratch. As such, it is not, and never has
    been, based on any actual UNIX code. When people talk about “UNIX-like operating
    systems,” they’re usually referring to Linux.


    From an end-user point of view, and even for most administration tasks, FreeBSD
    and Linux are quite similar. The main differences between the two are in the design
    philosophy. Here are some of the major variances:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - There is only one distribution of FreeBSD. There are more than 30 distributions
    of Linux: Each of the Linux distributions has slightly different ways of doing
    things. This can cause problems if you need to migrate to a different distribution
    of Linux later on.

    +   - FreeBSD is a complete operating system. Linux is a kernel with a set of
    utilities included with it: Different Linux vendors have differing opinions on
    what should be included with a Linux distribution. Of course, if something you
    want isn’t included, you can always download it off the Internet.

    +   - FreeBSD is maintained by a core team. As such, what ends up in a FreeBSD
    release is better controlled than what ends up in most Linux releases: This can
    help to reduce the compatibility problems that sometimes show up with Linux.

    +   - FreeBSD can often be easier to upgrade than Linux: When you upgrade FreeBSD,
    you generally upgrade the entire operating system. With Linux, you might download
    a kernel upgrade, only to find out that it breaks other parts of the system that
    you then need to upgrade separately. (This has its downsides too, though; many
    Linux distributions are packaged nicely so that upgrading them is easier and less
    prone to breakage than FreeBSD.)

    +   - FreeBSD is considered by many to be more stable than Linux. As such, it
    might be more suitable for production servers. However, the trade-off is that
    FreeBSD is often slower to support the latest cutting edge technology and hardware
    devices than Linux.

    +   - FreeBSD has less software available for it than Linux—especially when it
    comes to commercial software. However, this is often not an issue because FreeBSD
    can run most Linux software extremely well.


    Another difference between FreeBSD and Linux is in licensing. Linux is licensed
    under the GPL, which stands for the GNU General Public License. This license was
    developed by the Free Software Foundation. One of the goals of the GPL is to foster
    innovation by ensuring that developers can build on existing code from other developers.
    (Whether it succeeds in this goal or actually inhibits innovation is a subject
    of religious debate.) The GPL does this by requiring that source code be made
    available for the product and that the author not restrict distribution of the
    product. Any GPL code used in a software product requires that the entire product
    automatically inherit the GPL license; thus, the author must make source code
    available and cannot restrict others from redistributing the software or making
    further changes to it.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_32_0.png)


    > If you''re interested in reading an analysis of the GPL as well as how it affects
    and is affected by the realities of commercial software development, see “A Funny
    Thing Happened on the Way to the Market” by Matt Asay, at http://www.linuxdevices.com/articles/AT4528700742.html.


    FreeBSD, on the other hand, is licensed under the BSD software license developed
    by the University of California at Berkeley. This license is much more liberal
    than the GPL. Basically, the BSD license allows you to do whatever you want with
    the software, including re-using it in a commercial software product and not releasing
    the source code. Because of this, the BSD license is often favored by commercial
    software developers. Apple has used a great deal of FreeBSD code in Darwin, the
    foundation for Mac OS X; even Microsoft has used BSD licensed software, and occasionally
    contributed software to BSD. This means that you re-use BSD licensed code in your
    own software and then license the software under a completely different license.
    The only requirement is that the BSD code maintain the BSD copyright information
    and an acknowledgment of the original authors.


    Ultimately, the major differences between FreeBSD and Linux come down to philosophical
    differences about software licenses and such. Both operating systems are quite
    capable, and both can serve the needs of most users quite well.


    # Other BSD Operating Systems


    Although FreeBSD is by far the most popular of the BSD based operating systems
    for PC hardware, there are several others.


    The most popular BSD-based operating system, and indeed the most popular UNIX-like
    operating system in the world, is Apple’s Mac OS X. It’s possible to start a religious
    war over whether OS X is actually UNIX or not, but for our purposes (and under
    the terms of its license), it is. OS X has a fully functional BSD UNIX environment
    that is based on FreeBSD. It will compile and run most BSD software without modification,
    and it includes the majority of the BSD system utilities. Of course, at this point
    in time, OS X is only available for Macintosh hardware, although there is a long-standing
    rumor that Apple might port OS X to PC hardware—that is, recompile it so that
    it will run on the Intel/AMD architecture that most likely underlies your own
    computer.


    Another version of BSD that is available for PC hardware is NetBSD. The main difference
    between FreeBSD and NetBSD is that FreeBSD focuses mostly on PC hardware, and
    thus is optimized to perform extremely well on it. NetBSD, on the other hand,
    runs on just about every platform under the sun, including things that aren’t
    even computers'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'in the traditional sense of the word—such as certain gaming consoles. FreeBSD
    has a larger user community than NetBSD; hence, it tends to be better documented
    and have a larger amount of ported software available.


    OpenBSD is also available for PC hardware, as well as many other platforms, although
    not as many platforms as NetBSD. OpenBSD''s main focus is on security, and some
    would argue (perhaps rightly) that OpenBSD is the most secure general purpose
    operating system available. Like NetBSD, OpenBSD tends to be more difficult for
    beginners to work with than FreeBSD because it is not as well documented and doesn''t
    have as much software pre-ported to it. Also, be aware that as of this writing,
    OpenBSD does not support SMP processing. This means that if you have a system
    with more than one CPU, you won''t be able to take advantage of the second CPU
    with OpenBSD. (FreeBSD however, does support multiple processors.)


    # FreeBSD Compared to Windows 2000 and XP


    In the 80s and early 90s, Microsoft primarily focused on the desktop market. Servers
    were pretty much the domain of UNIX vendors such as SUN, IBM and HP, and non-UNIX
    vendors such as Novell. However, with the introduction of Windows NT, Microsoft
    began to target the server market. Microsoft continued to push into the server
    market with new products such as Windows 2000, Windows XP, and technologies such
    as .NET and ASP scripting. In addition, various anti-UNIX campaigns on the part
    of Microsoft have made it clear that its intended target is UNIX. Among other
    things, Microsoft claims that UNIX is outdated, arcane, and not cost-effective.
    Is there any valid basis to these claims? Is UNIX really a technology in which
    its time has come and gone? After all, UNIX is more than 30 years old, which is
    a long time when you consider that the computer has only been a major business
    tool since the mid 1960s. Before UNIX is written off as an obsolete technology
    though, let''s consider some of its benefits, as well as look at some of Microsoft''s
    points.


    Microsoft''s claim that UNIX is not cost-effective might be true if we are talking
    about commercial UNIX vendors. Traditionally, commercial UNIX vendors have proprietary
    software that required expensive hardware to run. However, as PC hardware became
    more powerful, it began to be possible to run very serviceable servers on commodity
    PC systems, which traditionally has been the market that Microsoft has focused
    on. A PC-based server could be had for much less money than a proprietary UNIX
    server.


    However, FreeBSD is focused on PC hardware. So this eliminates the expensive hardware
    argument for making UNIX not cost-effective. In addition, FreeBSD doesn''t have
    any licensing fees. This eliminates a substantial cost that is associated with
    Windows. You can install FreeBSD on as many servers as you would like without
    paying a dime.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'The number of simultaneous users who can be connected to the server is limited
    only by the capacity of your hardware. Once again, you don’t have to pay a dime.
    With Windows, on the other hand, you have to pay a licensing fee for each server
    you want to run Windows on, as well as a fee for each user who needs to be connected
    to any given server. Basically, with the free UNIX systems such as FreeBSD, Microsoft’s
    argument that UNIX is not cost-effective doesn’t really work. In fact, FreeBSD
    could potentially save tens of thousands of dollars because of Microsoft’s expensive
    licensing fees.


    What about the idea that UNIX is an outdated technology? This idea doesn’t really
    stand up either. For one, when UNIX was first invented, it was way ahead of its
    time. But also, UNIX’s design philosophy allowed it to grow and meet future needs
    relatively easily because most of the functionality is handled by external programs
    that ship with the operating system. As far as the underlying technology of the
    operating system itself, UNIX had features in the 1970s that Microsoft didn’t
    get around to adding to Windows until the mid 1990s.


    Other than the fact that FreeBSD can potentially save thousands of dollars in
    licensing fees, it also has the potential to save a great deal of money in hardware
    costs because FreeBSD’s resource requirements are relatively light compared to
    Windows. Depending on what you are doing with FreeBSD, even a 486 with 32MB of
    RAM might be sufficient. On the other hand, Microsoft states that the minimum
    requirements for Windows 2000 server are a Pentium 133 and 64MB of RAM. Realistically,
    for reasonably good performance, requirements for Windows 2000 are much higher
    than this.


    As far as FreeBSD (and UNIX in general) being more difficult to learn than Windows
    is concerned, this is probably true. A lot of procedures performed from a graphical
    user interface in Windows need to be performed from the command line on FreeBSD—often
    by editing a text-based configuration file. However, the command-line interface
    does have several advantages over Windows graphical user interface.


    +   - Once you’ve learned the command line, it can often be much faster than navigating
    through Windows graphical tools.

    +   - Not having a graphical interface running means that the resource requirements
    of the operating system are much lower. It makes little sense to have a resource
    hungry graphical interface running on a headless server in a backroom somewhere
    that no one ever sees anyway.

    +   - Not having the graphical interface also means that hardware requirements
    are lower. For example, you can get by with an old and small monitor instead of
    having to have an expensive high resolution monitor.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '+   - You can administer FreeBSD from the command line remotely through any
    system that has a terminal emulator, even if it is not a UNIX system. With Windows,
    you need special software to do remote administration, and that software generally
    only runs on Windows.


    The argument can also be made that FreeBSD is much more stable and secure than
    Windows. A properly designed graphical user interface can make system administration
    much more straightforward than in a command-line-based system; but because of
    the arcane nature of the Windows'' system layout, its interface is hardly any
    more intuitive than that of FreeBSD. The really nasty part, too, is that the Windows''
    graphical interface leads people to believe that it''s easier—with the result
    that a great many Windows servers in the world are configured improperly and insecurely,
    as well as administered by people who think it''s still better than if they''d
    used Linux or FreeBSD.


    # System Requirements


    The system requirements for FreeBSD depend on what you intend to do with the system.
    For a typical workstation setup that will run the X Window System (a graphical
    interface system similar to Windows or Macintosh, also referred to as X or X11),
    the following minimum system requirements are recommended:


    +   - Pentium class processor

    +   - 64MB of RAM

    +   - At least 300MB of free hard disk space

    +   - SVGA or better video card compatible with the X Window System (see Appendix
    A, "Resources for FreeBSD Users")

    +   - Three-button mouse


    It is possible to use the X Window System with a two-button mouse. However, unlike
    Microsoft Windows, X relies a great deal on the third mouse button. It is much
    easier to work in X with a three-button mouse.


    If you have no intention of running a graphical environment, you can often get
    by with a lot less. In fact, if all you want is to set up an email server, router,
    or low end Web server, you can get by with even a 486.


    # Deciding How and Where to Install FreeBSD


    There are two primary ways you can install FreeBSD on your system. Most people
    new to the operating system will probably want to opt for the dual boot method.
    With a dual'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'boot system, you install FreeBSD alongside your existing Windows system. A
    program called a boot manager will be installed at the beginning of your hard
    disk. Each time you start your computer, you will be presented with a menu that
    allows you to choose whether you want to work in Windows or in FreeBSD. When you
    want to use Windows, you can simply select it from this menu, and the system will
    behave as if FreeBSD isn’t even installed. In other words, your Windows system
    will work exactly the way it did before you installed FreeBSD.


    The second way that FreeBSD can be installed is as the only operating system on
    the computer. If you only intend to work with FreeBSD on this system, you might
    want to opt for this method. If you choose to use this method on a system that
    already has Windows on it, you will delete your current system and start over
    with a new FreeBSD system. Because of this, it is important to back up any data
    you have on your system and want to keep. More about doing backups will be discussed
    later in this hour.


    # Backing Up Existing Systems


    Before you can install FreeBSD, you will have to create a space for it on your
    hard disk, which will involve making some changes to the way your hard disk is
    currently set up. Although the program we will use to do this in the next hour
    can usually do this without causing you to lose data, it is still possible that
    a mistake could be made. Because of this, it is very important that you back up
    any important data that you want to keep.


    Note that in general, you only need to back up your data. You don’t need to back
    up programs or the Windows system itself because you will generally need to reinstall
    these anyway. Also, backing up all your programs and data would require a great
    deal of time and a huge amount of space on your backup media.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_36_0.png)


    > > Do be sure to back up any registration keys for shareware and commercial software
    that you might have installed. If you reinstall these programs and then discover
    that you don’t have those keys handy, you’ll be reduced to limited functionality
    (or none at all).


    There are several ways that you can back up data in Windows, and we aren’t going
    to go into detail here. Of course, the simplest way is to just copy your data
    files onto your backup media (more on backup media later). You can save space
    by using a program such as WinZip to compress the files before copying them. Of
    course, several dedicated backup programs are also available for Windows.'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'As far as the media you use to back up your system is concerned, several choices
    are available—all of which have their advantages and disadvantages. We will next
    look at a few of the most popular methods.


    # Floppy Disks


    If you only have a small amount of data to back up, floppy disks might work. The
    main advantage of floppy disks is that they are a very cheap way to back up small
    amounts of data, and virtually every computer already has a floppy drive, so you
    already have the hardware available to do the backup.


    However, the disadvantages of using floppy disks for backups generally outweigh
    the advantages. For one thing, floppy disks are notoriously unreliable and prone
    to errors. In other words, you could back up your data only to find that when
    you try to restore it, the floppy disk was bad and the data is corrupt. Another
    problem with floppies is that they have a relatively low capacity. So if you have
    more than a small amount of data to back up, you could end up dealing with a lot
    of floppy disks. Not only is it very slow and time-consuming to back up and restore
    from a pile of floppies, but it also increases the chance that one of the disks
    will have errors. Floppy disks are generally the worst choice available for doing
    backups and should only be used if the amount of data to back up is small, and
    no other backup system is available. If you must use floppies, be sure to verify
    the contents of each disk after copying files to it.


    # Zip Disks


    Iomega''s Zip disks are a type of high-capacity floppy disks, having a capacity
    of either 100MB or 250MB. The main advantage of Zip disks is that they can be
    accessed like normal disks. In other words, you can load a document from it, make
    changes to it, and save it directly back on the Zip disk. Because of this, Zip
    disks are quite popular at University computer labs, for example. Because they
    can hold a relatively large amount of data, students can take the disks with them
    into and out of the computer lab, and they can be used like a normal disk. Zip
    disks are effective for backing up small amounts of data and are more reliable
    than floppy disks.


    Zip disks have two primary drawbacks. The first is that the cost per megabyte
    is relatively high. For example, a 250MB Zip disk costs about 7.5 cents per megabyte
    as of this writing. Compare this to a rewritable CD, which costs about 0.35 cents
    per megabyte, and you can see that Zip disks are more than 20 times more expensive
    per megabyte than rewritable CDs. (Rewritable CDs do have some disadvantages that
    Zip disks don''t have. We will look at those in the next section.)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_37_0.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The second primary drawback of Zip disks is that they are relatively slow.
    Although this isn''t a huge issue for backing up and restoring data, it is an
    issue when attempting to use a Zip disk as a normal disk and accessing large documents
    from it.


    # Recordable and Rewritable CD-ROM


    Recordable and rewritable CDs are perhaps the most popular backup media for small
    businesses and organizations that do not have to back up extremely large amounts
    of data. The cost of CD writers has come down greatly in recent years, making
    them affordable to the average computer user. Recordable CDs are very cheap and
    can hold a relatively large amount of data (up to 700MB). For the average home
    or small business user, recordable CDs are probably the best backup option available.


    Note that you can get recordable CDs (CD-Rs), which can only be written to one
    time, and rewritable CDs (CD-RWs), which can be erased and rewritten hundreds
    of times. For backup purposes, it is better to go with the recordable CDs because
    they are more reliable than the rewritable CDs.


    The primary drawback of recordable and rewritable CDs is that they cannot be written
    to like a regular disk. This means that you can''t, for example, open a document
    from a rewritable CD, make changes, and then directly save it back on to the CD
    like you can with a Zip disk. Writing to a CD usually involves setting up a “burn”
    process with a number of files to write and then executing the “burn,” which takes
    a fairly long time. What this means, really, is that CDs are not useful as an
    “on-demand” storage medium.


    # DVD-ROM


    Recordable DVD-ROM drives are likely to replace recordable CD-ROM drives in the
    relatively near future. Like CD writers, the cost of DVD writers has come down
    greatly in recent years. Although they still cost significantly more than a CD
    writer, they are reasonably affordable (and a very good investment because they
    can write CDs and play DVDs as well). The DVD-R or DVD-RW media costs several
    times more than CD-R or CD-RW media, which means that they are far less “disposable”
    than CDs. DVDs can store up to 4.7GB of data per disk, making them effective for
    backing up even large amounts of data. However, for backing up extremely large
    amounts of data, DVD drives aren’t quite a match for high-capacity tape drives.


    # Tape Drives


    The oldest form of backup, it is still the most popular for backing up large amounts
    of data. Of course, the media has gone from huge reel-to-reel drives that held
    less than 100Mb of data, to Digital Audio Tape (DAT) cartridges smaller than a
    credit card that'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'can hold more than 20GB of data. If you need to back up huge amounts of data,
    tape drives are still the best way to go. However, the cheaper tape drives can
    be unreliable, and the reliable ones are quite expensive (and often require a
    SCSI controller, which most computers don''t have built-in anymore). The media
    isn''t cheap either. Tape drives are best left for those people who have to back
    up huge amounts of data.


    # Summary


    In this hour, we looked at what FreeBSD is and how it can be used. You saw that
    FreeBSD is a version of the UNIX operating system that is available free and can
    be installed on as many computers as you want without paying any licensing fees.
    We looked at some of the things that can be done with FreeBSD, including building
    a Web server, email server, file server, or an inexpensive UNIX workstation. We
    also compared FreeBSD to other operating systems including Linux, other versions
    of BSD, and Microsoft Windows. Finally, we introduced the two ways that FreeBSD
    can be installed and looked at the importance of backing up your system. We also
    examined several types of media that can be used for backing up your system before
    installing FreeBSD.


    # Q&A


    Q Is FreeBSD a “true UNIX,” or is it just “UNIX-like” as some people say?


    A FreeBSD is a licensed implementation of the BSD code developed at UC Berkeley.
    Because that code is by definition “true UNIX,” so is FreeBSD. So, in fact, is
    any operating system that uses such licensed Berkeley code.


    Q Is there a way to run Windows programs within FreeBSD?


    A There are ongoing projects whose goal is to allow users to run Windows programs
    in an “emulation mode” within FreeBSD, Linux, or other such operating system.
    These projects include WINE (an older emulator) and the Linwows project, whose
    main goal is to integrate Linux and Windows. These aren’t mature or stable solutions,
    though, and your best bet is to bank on having to boot into Windows if you can’t
    give up gaming.


    Q What’s the best media to use to back up my Windows system before partitioning
    my disk for dual-booting with FreeBSD?


    A If you have a CD-R or CD-RW drive, this might be your best bet. You don’t need
    to duplicate your entire hard drive and restore it later; in fact, it’s often
    better to “nuke and pave” Windows and reinstall your software from time to time
    anyway. Just worry about backing up your personal documents, registration keys,
    and all files that aren’t part of the operating system or any particular program.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Workshop


    Throughout this book, the Workshop sections will test your knowledge of each hour''s
    lesson with quiz questions, exercises, and activities. In this hour, we talked
    about pre-installation procedures, and so there will be no quiz yet. There are,
    however, some exercises to try.


    # Exercises


    +   1. Go to your local electronics store or your favorite equipment supply Web
    site. Research the prices of optical media drives (CD-R, CD-RW, DVD-R), tape drives,
    and Zip drives. See if you can find which ones mention support for any operating
    systems besides Windows. If any mention UNIX, you''re in luck. However, chances
    are that FreeBSD will work with almost any of them. Also look at the prices of
