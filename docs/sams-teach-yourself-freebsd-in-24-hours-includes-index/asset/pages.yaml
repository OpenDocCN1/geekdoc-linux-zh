- pgno: 284
  md: '# The vi Editor


    As mentioned previously, the vi editor is one of the earliest editors created
    for UNIX that is still in use. Virtually all flavors of UNIX come with the vi
    editor installed by default. Sometimes, vi might be the only editor you have available,
    so it pays to know at least the basics of how to use vi.


    Unfortunately, vi has a reputation for being very difficult to use. For one, virtually
    all commands in vi are carried out by a series of keystrokes that are not very
    intuitive. So why is vi so popular? The main reason is that it is very powerful
    once you have learned the various keystrokes. It can also be very fast because
    the commands are set up so that the most commonly used ones can be accessed without
    your fingers having to leave the home row of keys.


    The vi editor can be started by typing vi followed by the name of a file you want
    to edit. If the file doesn''t already exist, an empty buffer with that filename
    will be created. You can also start vi with no filename; in which case, it will
    be opened with an unnamed buffer. Figure 16.4 shows the vi editor opened with
    a blank file.


    FIGURE 16.4

    The vi editor window.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_284_0.png)


    The first thing you will notice if you try to type in the editor window is that
    nothing happens, or it simply beeps at you. This is because vi is currently in
    command mode. You can use either the o, a, or i key to switch vi into text entry
    mode. Each of these keys performs a slightly different action before entering
    text entry mode:


    | Key | Action |

    |---|---|

    | o | Opens a new line and then places the cursor at the beginning of the new
    line to start entering text. |

    | a | Appends text starting after the character the cursor is currently positioned
    on. |

    | i | Inserts text before the character the cursor is currently positioned on.
    |'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'In addition, you can use A to begin inserting text at the end of the current
    line (note the case difference) and 0 to insert a line above the current line
    and begin inserting text there.


    To get back into command mode, press the Esc key.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_285_0.png)


    To enter any text into the editor, you must be in text entry mode (which can be
    entered using the o, a, i, O, and A keys as described previously). To enter any
    commands in vi for tasks such as saving files, you must be in command mode (which
    can be entered by pressing the Esc key).


    # Navigating in vi


    In most cases, you will be able to use the arrow keys to navigate in vi. However,
    in some cases, the arrow keys may not work when logged in remotely. Of course,
    you also will not be able to use the arrow keys if you are logged in from a terminal
    that doesn''t have any arrow keys. In this case, you will need to enter command
    mode (press Escape) and use the following keys to navigate:


    | Key | Action |

    | --- | --- |

    | h | Moves the cursor left one character. |

    | j | Moves the cursor down one character. |

    | k | Moves the cursor up one character. |

    | l | Moves the cursor right one character. |


    If you cannot remember which keys move in which direction, the following memory
    aids might help:


    +   - The h key is the farthest to the left, and it moves the cursor left.

    +   - The j key looks a bit like a downward pointing arrow, and it moves the cursor
    down.

    +   - The l key is the farthest to the right, and it moves the cursor to the right.

    +   - The k key, which is the only key left, moves the cursor up.


    Many more movement keys are available in vi. See the man page for vi for a complete
    list.


    # Searching in vi


    To search for text in vi, go into command mode and then press the slash key (/).
    Directly following the slash (don''t press Enter first) enter the string you want
    to search for and'
  merge: -1
  img_proc: true
- pgno: 286
  md: 'then press Enter. To repeat the same search, simply press the slash key again,
    but do not follow it with any search string. The n key also has the same effect
    as pressing the /.


    # Saving Files and Exiting vi


    Table 16.3 shows a list of the commands that can be used to save files and exit
    vi.


    Table 16.3 Saving Files in vi and Exiting the Editor


    | Keys | Action |

    |------|--------|

    | ZZ | Saves changes to the current file and then exits. |

    | :w | Saves changes to the current file. |

    | :wq | Saves changes to the current file and then exits. Has the same effect
    as ZZ. |

    | :w! | Saves changes to the current file, overwriting an already existing file
    of the same name. |

    | :wq! | Saves changes to the current file, overwriting an already existing file
    of the same name, and then quits. |

    | :q | Exits the editor. If unsaved changes are in the file, vi complains and
    refuses to quit. |

    | :q! | Forces vi to quit, even if there are unsaved changes. |

    | :e! | Loses any changes that you have made, and reloads the file from disk in
    its most recently saved state. |


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_286_0.png)


    Commands that have an exclamation point following them will force the requested
    action to take place and will not ask for confirmation before carrying out the
    action. For example, q! will quit vi even if the changes to the file have not
    been saved, and you will not be asked whether you want to save the changes.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_286_1.png)


    An improved version of vi called vin is available in the ports collection. It
    adds additional features to vi. Some of the improvements include color syntax
    highlighting for source code if you are a programmer, the multiple undo levels,
    and so on.


    # Email Applications


    Several text-based email applications are available for FreeBSD. Once again, these
    applications have some advantages over graphical interface email programs, including
    the fact'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'that they require very few resources because they do not need a window system,
    and they can be run remotely from any terminal emulation program that has some
    kind of access to the FreeBSD system.


    The Pine email client was originally written by the University of Washington as
    an easy to use email program for new users. Pine is a recursive acronym that stands
    for Pine Is Not Elm—Elm being an older mail client that was one of the first menu
    driven email clients for UNIX, but was not a shining example of user friendliness.
    Pine remains one of the easiest and most user-friendly email programs available
    for UNIX, and it is available in the FreeBSD ports collection for you to install.


    To start pine, simply type pine and press Enter. Figure 16.5 shows the pine main
    menu.


    # FIGURE 16.5


    The main menu of the Pine email program.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_287_0.png)


    When you first start Pine, you will be in your inbox. Note the status line across
    the top. The right side of the line tells you what folder you are currently in
    as well as how many messages are in it. Menu options can be selected either by
    pressing the letter corresponding to the menu entry you would like, or by using
    the up and down arrow keys to highlight the entry you want and then pressing Enter.
    Note that options on the menu at the bottom of the screen can only be selected
    by pressing the highlighted letter on your keyboard. You can''t use the arrow
    keys to select items from this menu.


    Pine''s menu options are fairly self-explanatory. One thing to note is that as
    in the ee editor, menu options beginning with the caret symbol (^) indicate that
    to access that option, you hold down the CTRL key and press the letter that follows
    the caret. For example, from within the Compose Message screen, you use Ctrl+x
    to send the message you are currently editing.'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'Pine is one of the easiest email programs to use, and because of this, it is
    one of the most popular. It is, unfortunately, plagued by a history of potential
    security problems. Although all the known security issues with Pine have been
    fixed as of this writing, many security experts believe there are likely many
    more security problems that have not yet been found. FreeBSD will likely warn
    you of this when you install the Pine port. Because of these potential security
    issues with Pine, it is important that you keep up with the latest versions of
    Pine. If security is a serious concern, you might want to look into the mutt client,
    available in the mail category of the ports collection. mutt is much more secure,
    and also quite powerful. However, mutt is not nearly as easy to use as Pine, so
    your users might form a mutiny if you take Pine away from them and force them
    to use mutt.


    The message editor that comes with Pine is called pico, and can be used as a standalone
    editor. In the tradition of Pine, the Pico editor is one of the easiest text based
    editors available for FreeBSD. To use Pico, you must, of course, have Pine installed.
    Once Pine is installed, you can access the Pico editor by simply typing pico followed
    by the name of the file you want to edit. (Or type pico by itself to open a blank
    buffer with no filename.)


    # The Lynx Web Browser


    Lynx is a text-based Web browser for FreeBSD and other versions of UNIX. Of course,
    a text-based browser comes with the limitation of not being able to display inline
    graphics, and so on. Still, Lynx can be a fast way to browse the Web, especially
    on a slow connection because Lynx won''t load any graphics. Lynx is available
    in FreeBSD ports collection. Figure 16.6 shows the Lynx Web browser with the FreeBSD
    home page loaded.


    FIGURE 16.6

    The Lynx Web browser displaying the FreeBSD home page.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_288_0.png)'
  merge: -1
  img_proc: true
- pgno: 289
  md: 'To start the Lynx browser, type lynx at the command prompt, optionally followed
    by the address of a Web site that you want to load. (The Lynx home page will be
    loaded if you don''t specify an address.) You can navigate in Lynx by using the
    arrow keys to move between links. When a link you want to follow is highlighted,
    press the Enter key or the right arrow key to select the link. The left arrow
    key moves backward to previous pages that were visited. To enter a new address
    to visit, use the g key and type the new address. To quit, press q.


    Unfortunately, it is becoming more and more difficult to use text-based browsers
    such as Lynx on the Web. Some of this has to do with the fact that Lynx doesn''t
    support frames or JavaScript, and so on, but a lot of it also has to do with poor
    site design practices on the part of Web designers (not using proper markup tags,
    and so on).


    # Summary


    In this hour, you learned how to work with some common FreeBSD command-line applications
    including text editors, email clients, and Web browsers. Note that all these programs
    have far more options available than we have the space to cover here. For more
    information on the various options available for the various programs, see their
    manual pages.


    # Q&A


    Q Aren''t these programs old and outdated? After all, in Windows and Macintosh,
    everything has a graphical user interface. Why would I want to use these programs?


    A There are several reasons. One is that these applications can run almost anywhere,
    and can run on very cheap hardware. For example, if you are just setting up an
    email server, you can spend $10 on a used small monitor instead of $200 on an
    expensive monitor that can do fancy graphics. Also, these applications can be
    run remotely from any computer that supports a terminal emulator, including Windows,
    Macintosh, another version of UNIX, or even a dumb terminal that is not a computer
    at all. The applications also work reasonably well even over slow network connections
    because there are not large graphics and complex user interface features to transfer.


    Q Why should I learn vi since its commands seem so arcane? A There are a couple
    of good reasons for learning vi. One reason is that it is pretty much a universal
    editor that will be found on all UNIX systems and often might be the only editor
    available. Because of this, basic knowledge of vi can get you out of


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_289_0.png)'
  merge: -1
  img_proc: true
- pgno: 290
  md: 'a bind if you ever need a text editor on a UNIX system in which nothing else
    is available. Another reason for learning vi is that it is a very powerful and
    quick editor. After you have learned the various keystrokes, they become second
    nature. Not having to take your hands off the keyboard to use a mouse can greatly
    enhance productivity. Many people who initially start out hating vi learn to greatly
    appreciate its power after having worked with it for a while, so give it a shot.


    Q Are there other editors available besides the ones you mentioned here?

    A Yes. To see what is available, look through the Editors category in the ports
    collection. In particular, you might be interested in the emacs editor. Emacs
    is very powerful, but also very complex, so it is beyond the scope of this book.


