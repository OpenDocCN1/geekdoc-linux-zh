    # The System Logger (syslogd) and the syslog.conf File


    System messages are logged to files in /var/log. The mechanism that does this
    is called syslogd, the system logger daemon. Its behaviors are set in /etc/syslog.conf,
    which defines various different log files for different services. Each service
    or facility that it knows about (which can be any of auth, authpriv, console,
    cron, daemon, ftp, kern, lpr, mail, mark, news, ntp, security, syslog, user, uucp,
    and local0 through local7) has a number of different severity levels for which
    you can control logging. These levels include emerg, alert, crit, err, warning,
    notice, info, and debug, listed in decreasing order of severity.


    +   - emerg—Emergency! If this ultimate severity message level is triggered, every
    logged-in user receives a broadcast.

    +   - alert—Something important on the system level has happened—something that
    must be corrected immediately—but only root really needs to be warned about it.

    +   - crit—Critical error with one of the particular services or a piece of hardware.
    Print errors to all relevant log files and the console, but don''t interrupt remotely
    logged-in users with warnings.

    +   - err—Any generic "error" from any service. Messages are printed to the console
    and root''s terminals.

    +   - warning—A non-critical condition, but one that would be useful to find in
    a log file.'
