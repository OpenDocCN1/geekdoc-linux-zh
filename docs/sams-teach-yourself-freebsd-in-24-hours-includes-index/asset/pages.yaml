  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_387_0.png)


    # Hour 23


    # Basic Email Services


    Any multiuser operating system on the Internet must give its users the ability
    to send email messages to users of other systems. This is one of the oldest uses
    of the Internet, and certainly it has lately become an integral part of any computer
    user''s life. However, in its current form, email is a bit different from how
    it used to be.


    FreeBSD is configured "out of the box" to provide email services for local users
    of the system; if you make certain changes to the default configuration, it can
    also act as a relay so that people on dial-up machines can use your server to
    convey their messages to their destination servers. However, this also means that
    mass mailers ("spammers") can also use your server as a broadcasting station without
    your permission.


    In this hour''s lesson, we will cover Sendmail, the venerable *Mail Transfer Agent
    (MTA)* that still transmits the majority of the world''s email and that is bundled
    as part of FreeBSD. You will learn


    +   - Using the various files that comprise the configuration of Sendmail

    +   - Customizing the Master Config file and regenerating Sendmail''s runtime
    configuration file'
  merge: -1
  img_proc: true
- pgno: 388
  md: '+   - Adding aliases to the system

    +   - Starting and stopping Sendmail

    +   - Viewing the message queue and seeing what messages are waiting to be delivered

    +   - Fighting spammers by controlling mail relaying


    # SMTP and Sendmail


    The *Simple Mail Transfer Protocol (SMTP)* is responsible for transferring email
    messages from one server to the next. It''s a simple protocol, as its name suggests,
    designed only for establishing the identity of the sender and the recipient, and
    transmitting a message''s contents. The sender and recipient are each specified
    by an email address, which consists of a username and a hostname, separated by
    the at symbol, @; if the SMTP server that receives the message has the same hostname
    as the one in the email address, it knows the message is intended to reach a recipient
    there. If not, it knows it must *relay* the message to another host.


    In the simplest case, this is the way an email message travels from one user to
    another; in the olden days, when everybody had a shell account on a server, a
    user on one server could email a user on another server simply by opening up a
    mail program on the local machine (a *Mail User Agent*, such as Pine, Elm, or
    Mutt), writing a message, and telling the program to deliver it. The MUA would
    then open up an SMTP connection to the remote user''s mail server (which was usually
    the same machine on which that user had a shell account) on port 25. The remote
    server would read the email address, realize that the message was intended for
    a local user, and dump the message into the user''s mailbox. The user could then
    open up his own MUA and read the message.


    These days, it''s usually a little more complicated, as shown in Figure 23.1.
    A complete email delivery path usually takes two or more network hops before it
    reaches its destination.


    Today, the most common situation is for the sender of an email message not to
    be a local shell user right on the mail server machine, but a dial-up user communicating
    through an *Internet service provider (ISP)*. This user''s MUA might be Microsoft
    Outlook, Apple Mail, Eudora, or any of their popular cousins. When the MUA sends
    the message, it opens up an SMTP connection to the SMTP server furnished by the
    user''s ISP—*not* to the remote user''s mail server directly.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '# Figure 23.1


    Diagram of an email message''s path from one user to another, showing the roles
    of MUAs and MTAs.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_389_0.png)


    MUAs don''t send messages directly to the recipient''s SMTP server because MUAs
    have very limited mail sending capacity. They don''t have such features as message
    queues or the capability to keep retrying a connection. Most MUAs operate through
    a real SMTP server, which handles all the mail sending tasks much more efficiently.


    The sending MTA, the ISP''s SMTP server, receives the message and places it in
    the message queue. Realizing that the recipient is not a user on the network for
    which it''s a mail server, it will immediately try to transmit the message on
    to the recipient''s SMTP server. If the MTA can''t send it immediately, the message
    remains in the message queue for up to five days, constantly retrying, before
    the MTA deletes it. Upon successful transmission, though, the receiving MTA takes
    the message and appends it to the recipient user''s mailbox—/var/mail/<user> if
    it''s a FreeBSD machine.


    Email recipients today are also usually not local shell users on the receiving
    MTA. They''re dial-up users as well, and must get their mail either through POP3
    (Post Office Protocol version 3) or IMAP (Internet Message Access Protocol), both
    methods for downloading messages to a local MUA such as the ones we discussed
    before.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_390_0.png)


    You can execute a completely valid SMTP transaction purely from the command line;
    SMTP is a plain-text interactive protocol that uses simple four-letter, English-like
    commands, and you can send someone a simple message without even having access
    to an MTA or an email program:


    ```

    # telnet destination.com 25

    Trying 64.41.134.166...

    Connected to destination.com.

    Escape character is ''^]''.

    220 destination.com ESMTP Sendmail 8.11.1/8.11.1; Wed, 16 May 2001 22:55:37

    - >0000 (PDT)

    HELO stripes.sender.com

    250 destination.com Hello w012.z064002043.sjc-ca.dsl.cnc.net

    [64.2.43.12],

    - pleased to meet you

    MAIL FROM: frank@sender.com

    250 2.1.0 frank@sender.com... Sender ok

    RCPT TO: bob@destination.com

    250 2.1.5 bob@destination.com... Recipient ok

    DATA

    354 Enter mail, end with "." on a line by itself

    From: frank@sender.com

    To: bob@destination.com

    Subject: Testing, 123...


    This is a test message.

    .

    250 2.0.0 f4H5uCu35501 Message accepted for delivery

    QUIT

    221 2.0.0 destination.com closing connection

    Connection closed by foreign host.

    ```


    This is hardly user-friendly, though. If it weren’t for MTAs and MUAs, this is
    how we would be doing all of our email—and it wouldn’t be nearly as useful or
    fun.


    # Basic Sendmail Configuration


    FreeBSD comes with Sendmail installed and already configured to serve basic email
    needs right out of the box. All you have to do to enable Sendmail (so that it
    starts at boot time) is add the following line to /etc/rc.conf:


    ```

    sendmail_enable="YES"

    ```'
  merge: -1
  img_proc: true
- pgno: 391
  md: 'Once the system is up and running, you can send a message to anyone on the
    Internet, and they can send one to you—provided that you have a few things set
    up properly. For the most part, these aren''t configuration items for Sendmail
    itself, but for the system in general—Sendmail relies on the system to have a
    few guarantees in place before it will operate without a hitch.


    # Sendmail File Layout


    There are three places in the system that concern Sendmail:


    +   - `/etc/mail`—Configuration files for Sendmail

    +   - `/var/mail`—User mailboxes

    +   - `/var/spool/mqueue`—Message queue files


    Sendmail itself is located at `/usr/sbin/sendmail`, and its log files are written
    to `/var/log/maillog` (which is automatically rotated and archived on a daily
    basis so that old logfiles are available as maillog.0.gz, maillog.1.gz, and so
    on).


    The mailbox files (mail spools) in `/var/mail` are plain-text files—each named
    for the user who owns it and with permissions set to 600 (readable and writable
    only by the owner). New messages are appended to the end of the recipient''s mail
    spool file. There are also temporary POP lock files, which have zero length and
    a name of the form `.username.pop`. They receive the contents of the corresponding
    mail spool file while a POP3 connection is open, and any untransferred remnants
    are then copied back into the mailbox.


    # Using the Sendmail Configuration Files


    Sendmail is controlled through a number of different configuration files—all found
    in `/etc/mail`. Each file has its own purpose, allowing you to control a particular
    set of Sendmail functions.


    # Making General Configuration Changes


    The main Sendmail config file—the one that it reads upon startup containing all
    the operating options and filter rules—is `/etc/mail/sendmail.cf`. However, unlike
    just about every other config file for every other program, you''re not intended
    to edit this file to alter Sendmail''s behavior. Rather, you should make changes
    at a higher "macro" level in the Master Config (`.mc`) file, and then compile
    a `sendmail.cf` file from that. It''s best to leave sendmail.cf alone unless absolutely
    necessary.


    Your actual configuration changes should be made in `/etc/mail/freebsd.mc`, the
    Master Config file. Think of it as the config file for the config file. It contains
    a list of


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_391_0.png)'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'features and options that override the defaults in the standard config file—much
    in the same fashion that /etc/rc.conf overrides /etc/defaults/rc.conf. To make
    your changes to the Sendmail configuration, you will want to make them in this
    file, using the otherwise mostly unknown m4 macro language, and then compile a
    new sendmail.cf file from it.


    The contents of freebsd.mc look like this (the dnl that marks the commented-out
    lines stands for delete through newline):


    ```

    dnl Uncomment the first line to change the location of the default

    dnl /etc/mail/local-host-names and comment out the second line.

    dnl define(`confCW_FILE'',`o /etc/mail/sendmail.cw'')

    define(`confCW_FILE'',`o /etc/mail/local-host-names'')

    ```


    As you can see, the contents of these lines are designed to be read by a program,
    but not so much by a human. Believe it or not, the sendmail.cf file that is generated
    from this is even less readable.


    There''s a Makefile in /etc/mail, which allows you to create a new .cf file from
    the freebsd.mc file simply by typing make cf from inside that directory. Then,
    install this output file (freebsd.cf) into sendmail.cf using make install.


    ```

    # make cf

    /usr/bin/m4 -D CF_DIR=/usr/share/sendmail/cf/

    /usr/share/sendmail/cf/m4/cf.m4 freebsd.mc > freebsd.cf

    # make install

    install -c -m 444 freebsd.cf /etc/mail/sendmail.cf

    ```


    The /etc/mail/Makefile has a number of other uses, as you''ll see in a moment.


    # Creating Mail Aliases


    A mailbox exists in /var/mail for every user on the system; however, someone isn''t
    required to have an account in order to have an email address on your machine.
    You can always set up aliases to map incoming email addresses to any other address,
    whether it''s another account on your machine, an address somewhere else on the
    Internet, or even a pipe to a file or program. The default /etc/mail/aliases contains
    examples of all these. An alias line contains the alias name, a colon, a space
    or tab, and the target address or pipe:


    | Example | Description |

    |---|---|

    | tiger: bob@stripes.com | Redirects to bob@stripes.com |

    | fsmth: frank | Goes into frank''s mailbox instead of fsmth''s |

    | pager: "|/usr/local/bin/pageme" | Sends the message as input into /usr/local/bin/pageme
    |'
  merge: -1
  img_proc: true
- pgno: 393
