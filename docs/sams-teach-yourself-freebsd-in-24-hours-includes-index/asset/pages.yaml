- pgno: 324
  md: '# Moving and Copying Files and Folders


    To move or copy a file or folder in the KDE file manager, move the mouse pointer
    over the file or folder you want to move or copy. Hold down the left mouse button
    and drag it to the location you would like to put it. When you release the mouse
    button, a menu will pop up asking what you want to do with the file. The options
    are Move, Copy, and Link. The first two options don''t need any explaining; However,
    the third one might need a little bit. Basically, a Link is a pointer to the actual
    file. It allows you to access the file from somewhere other than where it is located
    without actually making a copy of it. You can think of a link as being the same
    thing as a shortcut in Windows.


    If you change your mind and decide that you don''t want to do anything with the
    file, simply click anywhere that is not on the pop-up menu and the operation will
    be canceled.


    You can also move or copy a file or folder by right-clicking on it and then clicking
    Cut or Copy in the pop-up menu. You can then navigate to where you want to move
    or copy the file, right-click on a blank area of the file manager, and click Paste.


    # Deleting Files or Folders


    You can delete files or folders in the KDE file manager in four ways. The first
    is by dragging them to the trash can on the desktop. In this case, as in Windows
    and Macintosh, they are not really gone until you have emptied the trash. You
    can empty the trash by right-clicking on the trash can and clicking Empty Trash
    Bin.


    The other three ways that you can delete a file or folder are by right-clicking
    on the file or folder and then selecting one of the menu options. The three menu
    options that allow you to delete a file or folder are as follows:


    +   - **Move to Trash.** This option has the same effect as dragging the file
    to the trash can. Once again, the file is not really gone until you have emptied
    the trash.

    +   - **Delete.** This option simply deletes the file. It is not moved to the
    trash bin. In other words, as soon as you have deleted the file, it is gone for
    good; so make sure that you really want to get rid of the file before selecting
    this option.

    +   - **Shred.** This option deletes the file, and then writes over the area on
    the disk where the file was located several times. This basically ensures that
    the file is extremely difficult to recover—even with special software designed
    to recover deleted files.


    # Changing File Attributes


    To change the attributes of a file, right-click on it and then select Properties
    from the pop-up menu. In the box that pops up, click on the Permissions tab, which
    will bring up a dialog box like the one in Figure 18.12.'
