    The FVWM 95 window manager in action.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_336_0.png)


    # Installing and Configuring Alternative Window Managers


    If you''ve found a window manager in this hour that caught your eye, you can install
    it from the FreeBSD ports collection. All the window managers and desktop environments
    covered in this hour are available in the x11-wm directory of the FreeBSD ports
    tree. See Hour 7 for instructions on installing new software in FreeBSD.


    After you have installed the new window manager, you will need to configure it
    (although most of them can be started in a default state with no configuration
    first). Each of these window managers has a different method of configuration,
    so we are not going to go into them here. However, check the Web site for the
    window manager for more documentation on how to configure the window manager.
    All of the window managers listed in this hour have Web sites: go to the FreeBSD
    Web site at www.freebsd.org, click the Ported Applications link, scroll down to
    x11-wm, and then look for the entry of the window manager you want to try. There
    will be a link from here to the window manager''s home page.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '# Changing Your Default Window Manager


    If you would like to change your default window manager to one of these, you need
    to edit your .xinitrc file and tell it which window manager you want to use. Here
    are the window managers talked about in this hour, along with their corresponding
    entries that you should add to .xinitrc:


    | Window Manager | .xinitrc Entry |

    |---|---|

    | Windowmaker | wmaker |

    | Blackbox | blackbox |

    | XFCE | xfwm |

    | IceWM | icewm |

    | FVWM 95 | fvwm95 |


    After you have modified and save the .xinitrc file, the next time you start up
    X, the new window manager should be active.


    # Summary


    In this hour, we took a brief look at some of the alternative window managers
    available besides KDE. We looked at the difference between window managers and
    desktop environments, and saw examples of each. We then looked at how to change
    the default window manager by editing the .xinitrc file.


    # Q&A


    Q Why are there so many different window managers and desktop environments for
    me to worry about? Why can''t FreeBSD just have one simple, predictable user interface
    like Windows or the Mac?


    A That''s a good question. Part of the problem is that by its open-source nature,
    FreeBSD (and by the same token, Linux) attract many users who each have their
    own individual, strongly-held beliefs about how computers should work. Many of
    these users are programmers, and if something doesn''t work quite the way someone
    thinks it should, he will often harness the easy programmability of the X Window
    System to develop a solution that works for him. Hundreds of these competing ideas,
    with no single corporate vision guiding them or providing financial incentives
    to consolidate their efforts, lead to the kind of proliferation of different windowing
    systems we have before us today.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Q Seriously, what''s the best window system available for FreeBSD?


    A Unfortunately, that question is hard to answer. KDE is certainly the best developed
    and most advanced complete desktop environment for Linux, but its implementation
    on FreeBSD remains spotty. GNOME is more complex to set up and work with than
    KDE, but its implementation under FreeBSD is more complete and better supported.
    Unless you''re a serious power user, you probably won''t want to deal with any
    of the more bare-bones window managers if you seriously want to make a go of it
    with FreeBSD on the desktop.


    # Q Where can I obtain more information on the various window managers and desktop
    environments available for FreeBSD?


    A An excellent Web site is available at www.xwinman.org that contains reviews
    and information of various window managers, along with screenshots of many of
    them.


    # Workshop


    This section is designed to test your knowledge of the material covered in this
    hour with quiz questions, and to provide some exercises for further exploration
    of the subject of the available window managers for FreeBSD.


    # Quiz


    1. The name of the file in which you can change your default window manager is


    +   A. .xinitrc

    +   B. .xstart

    +   C. XF86Config

    +   D. None of the above


    2. The WindowMaker window manager is based on and attempts to embrace the design
    principles of what computing platform?


    +   A. Windows 95

    +   B. Mac OS X

    +   C. NextSTEP

    +   D. Windows XP'
  merge: -1
  img_proc: true
