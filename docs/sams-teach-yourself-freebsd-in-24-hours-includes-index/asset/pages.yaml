    \ in FreeBSD includes an smbfs.ko kernel module in /modules and a mount_smbfs\
    \ tool in /sbin that works like all the other mount_* tools available for mounting\
    \ various filesystems. The best documentation for smbfs is found in the man mount_smbfs\
    \ page.\n\nTo mount an SMB filesystem using smbfs, use mount_smbfs with a few\
    \ basic options. The -I flag specifies the hostname or IP address, and the two\
    \ remaining arguments are the remote share name (of the form //user@<NetBIOS name>/<share\
    \ name>) and the local mount point. To mount the share called public from a Windows\
    \ machine called gaming-pc onto the local /smb/public directory, use the following\
    \ syntax:\n\n```\n# mount_smbfs -I 64.41.131.139 //guest@gaming-pc/public /smb/public\n\
    ```\n\nYou will be prompted for a password. Use a blank password if the share\
