- pgno: 341
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_341_0.png)


    # Hour 20


    # Productivity in the X Window System


    Not many people use a computer simply for the sake of using a computer. A computer
    is only useful if it can help you do your work more efficiently. Fortunately,
    many applications are available for FreeBSD and X in just about every area imaginable.
    Also, a great number of very good applications are available free because they
    are developed by the community.


    In this hour, you will learn about:


    +   - Word processors and spreadsheets available for FreeBSD and X

    +   - Graphics applications available

    +   - Internet applications available


    # Office Software


    Of course, one of the staple applications for any workstation operating system
    is an office package. If you have KDE installed, you already have an'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'office package, called KOffice, installed on your FreeBSD system. KOffice is
    a fully featured office package that includes the following features:


    +   - A word processor that also serves as a quite capable desktop publishing
    program

    +   - A spreadsheet

    +   - A presentation program similar to PowerPoint

    +   - A charting program

    +   - An illustration and drawing program


    # Starting KOffice


    You can start KOffice applications in two ways. The first is by running the KOffice
    Workspace program, which is located under the Office sub-menu of the K menu in
    KDE. This will bring up a window that looks like Figure 20.1.


    FIGURE 20.1

    The KDE Workspace provides an integrated environment for working with the KOffice
    applications.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_342_0.png)


    If you click on one of the applications on the left side of the window, it will
    open within the window, as shown in Figure 20.2.


    If you don''t like the Workspace feature, you can also start each of the applications
    by themselves so that they run outside of the Workspace. The individual applications
    can be accessed from the K menu under the Office sub-menu.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# FIGURE 20.2


    The KOffice Workspace with the KWord word processor loaded into it. Notice that
    you can still open the other applications from the menu on the left side.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_343_0.png)


    # KWord


    KWord is a fully featured word processor that also has powerful desktop publishing
    functionality. Figure 20.03 shows a screenshot of KWord.


    # FIGURE 20.3


    The KWord word processor.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_343_1.png)'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'KWord is a frames-based system in the same sense as Adobe Framemaker. For basic
    word processing, this doesn''t really matter to you except that the terminology
    is a little different. For example, in the Insert menu, instead of saying Insert
    Page Break to force a new page, it says Hard Frame Break. However, this option
    performs the same function as inserting a page break in Microsoft Word, for example.


    For the most part, KWord uses a standard user interface that is similar to the
    interface used by Windows and Macintosh word processors. Because of this, it shouldn''t
    take most readers very long to become comfortable with KWord.


    > By default, the rulers in all the KOffice applications are in millimeters. You
    can change this by right-clicking on one of the rulers and then selecting the
    unit of measure that you want in the pop-up menu.


    # KSpread


    KSpread is a basic spreadsheet program that supports most common trigonometric
    functions and can also generate basic graphs and charts. Figure 20.4 shows a screenshot
    of KSpread.


    FIGURE 20.4

    The KSpread spreadsheet with a chart.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_344_0.png)'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'Although KSpread contains a fair number of basic financial functions for calculating
    such things as nominal interest, its support for statistical functions such as
    regression testing is very limited. Hopefully the KOffice people will address
    this problem in the future, but for now, KSpread is pretty much limited to basic
    number crunching. For a fuller suite of features, you might want to obtain StarOffice
    from Sun, which contains a spreadsheet application that can interoperate with
    Microsoft Office files. However, this program is commercial, and until the open-source
    edition of it (OpenOffice) is fully ported to FreeBSD, you will probably not be
    able to get it free. Personally, I think it''s well worth the asking price.


    # KPresenter


    KPresenter is a PowerPoint-like program that allows you to create slideshow presentations.
    Figure 20.5 shows KPresenter editing a slide.


    FIGURE 20.5

    *The KPresenter slide program.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_345_0.png)


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_345_1.png)


    > At the time of this writing, KPresenter was extremely buggy and usually didn''t
    display the slide shows correctly. Because of this, I recommend against using
    KPresenter for any actual presentations at this time. OpenOffice, when it is available,
    will have a full-featured presentation application that will provide an alternative
    to KPresenter.'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# KIllustrator


    KIllustrator is a basic drawing program for creating illustrated figures. Figure
    20.6 shows the KIllustrator program.


    FIGURE 20.6

    The KIllustrator program editing a figure.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_346_0.png)


    Once again, readers who are familiar with drawing programs should have a fairly
    easy time adjusting to KIllustrator.


    # StarOffice


    StarOffice, available from Sun Microsystems, is a full-featured desktop productivity
    suite that offers better integration with Microsoft Office than any of the KOffice
    applications do. However, as discussed before, StarOffice is commercial software
    that you must order on CD, buy off the shelf, or download from Sun''s Web site
    (www.sun.com/staroffice). The download file is very large, and you might decide
    that paying the full fee (about $40) for the CDs in the mail is a bargain for
    what you get.


    StarOffice contains not only full-featured word-processing and spreadsheet applications
    with almost all the core functionality of Microsoft Office (as well as bi-directional
    file compatibility), but a desktop browser, an email client, a Web browser, and
    other tools as well. It has document templates, clip art, and most of the tools
    you are likely to need in a home or business context.'
  merge: -1
  img_proc: true
- pgno: 347
  md: 'StarOffice is not technically available for FreeBSD; rather, it''s a Linux-native
    software suite, and it runs under FreeBSD through its Linux compatibility layer.
    After you have downloaded the StarOffice file (so-6_0-ga-bin-linux-en.bin), move
    it into /usr/ports/distfiles and then use cd to go into /usr/ports/editors/staroffice60.
    After you have done this, you can type make and make install to install StarOffice
    into your system with the necessary FreeBSD patches. The installation procedure
    in the port will ask you a few questions, such as whether you want to do a "network
    install" or a "local install"; you will probably want to do a network install
    so you can put the StarOffice binaries into a location where all users can access
    them.


    After this process has been completed, running StarOffice is a matter of typing
    soffice at the command prompt. You will be launched into the StarOffice Desktop,
    shown in Figure 20.7.


    **FIGURE 20.7**

    *The StarOffice Desktop. The various icons represent tasks you can run, such as
    creating a new document of any of various types.*


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_347_0.png)


    A full tutorial on how to use StarOffice to its full potential can be found in
    Sams Teach Yourself StarOffice 5 for Linux in 24 Hours, or any of the many books
    on StarOffice that have been written recently. These texts will cover how to use
    StarOffice for every task you''re accustomed to using Microsoft Office for, plus
    a good deal more.


    # Image Editing


    FreeBSD has a very powerful image editing program available for it, called The
    GIMP— which stands for Gnu Image Manipulation Program. The GIMP is powerful enough
    for'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'all but the most complex image editing tasks, and it rivals Adobe Photoshop
    in features. Also, like all the other applications discussed in this hour, GIMP
    is available free.


    # Installing and Starting GIMP


    GIMP is available in the Graphics directory of the FreeBSD ports tree. See Hour
    6, “Adding and Removing Third Party Software,” for detailed information on installing
    software from the FreeBSD ports collection.


    After GIMP has been installed, you can start it from within KDE by clicking on
    K button, Run Command, and in the box that opens, type gimp. The first time you
    run GIMP, it will ask you some setup questions. In general, you can accept the
    default answers that it provides. Once setup has been completed, the GIMP control
    panel will be displayed (see Figure 20.8), as well as other dialogs and windows
    which you can close for now.


    FIGURE 20.8

    The main control panel

    in GIMP.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_348_0.png)


    To open an image for editing in GIMP, click on File, Open. This will bring up
    the dialog box shown in Figure 20.9.


    On the left side of the open file dialog box is a list of directories. On the
    right side is a list of files in the selected directory. Also note that there
    is a built-in primitive file manager. You can delete and rename files, as well
    as create a new directory.


    After you have loaded an image into GIMP, it will appear in a new window such
    as the one in Figure 20.10.


    As mentioned previously, GIMP’s user interface does not follow the norms of most
    software that you have most likely used. The most important thing to keep in mind
    when working with GIMP is that the majority of image manipulation functions are
    not to be found in visible window menus, but instead are accessed by right-clicking
    on the image window, and then selecting one of the options from the pop-up menu.
    If you keep this one point in mind, you should be able to adjust to GIMP relatively
    quickly.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# FIGURE 20.9


    Opening an image for editing in GIMP.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_349_0.png)


    # FIGURE 20.10


    GIMP with an image loaded into a window for editing.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_349_1.png)


    For example, to save a file in GIMP, you right-click on the image you want to
    save (in its display window), and then select File, Save from the pop-up menu.'
  merge: -1
  img_proc: true
- pgno: 350
  md: 'Image editing functionality works in a similar fashion. Right-click on an image,
    and then select Edit to obtain a list of the available editing commands. Selecting
    Image from the right-click menu gives you options such as changing the image mode,
    brightness, contrast, and other such functions that apply to the entire image.
    Use the Dialogs sub-menu to access any of the various floating windows that make
    up the GIMP user interface, including the toolbox (with its twenty-five selectable
    image-editing tools) and the GIMP Control Center window, which you can use to
    open new images and control GIMP’s settings.


    # Internet Applications


    The KDE desktop comes with a few Internet applications that are reasonably full
    featured. The main ones that most people will be interested in are Konqueror,
    the built-in Web browser, and KMail, the built-in email program.


    # Konqueror Web Browser


    Konqueror is KDE’s built-in Web browser. It behaves very much like Microsoft Internet
    Explorer or Netscape Navigator. Figure 20.11 shows the Konqueror Web browser.


    FIGURE 20.11

    The Konqueror Web browser.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_350_0.png)


    The one non-standard menu item in the Menu bar is Location. However, it really
    serves the same function as the File menu you are used to in Internet Explorer
    and Netscape. From the Location menu, you can open a new Web site, save the Web
    page to a file, and so on.'
  merge: -1
  img_proc: true
- pgno: 351
  md: 'Note that Konqueror does not have any built-in Java support. If you want to
    be able to run Java applets in Konqueror, you will need to have the Java Runtime
    Environment installed. This is also available in the ports tree under the Java
    directory, /usr/ports/java/jdk13. Refer back to Hour 7 for details on how to install
    software from the ports or packages.


    Much of the Web assumes that you will be using either Internet Explorer or Netscape
    for your browsing: indeed, these days you''re lucky to find sites that explicitly
    take Netscape into account. Konqueror does a good job of emulating both browsers,
    and it can masquerade as either one for the purpose of getting into sites that
    require one of the "accepted" browsers. However, Konqueror doesn''t have all the
    features of the mainstream browsers, and it won''t be up to all tasks. Fortunately,
    Mozilla—the open-source descendant of Netscape Navigator—is available for FreeBSD
    and can take you places where Konqueror can''t. You can install Mozilla from the
    ports (/usr/ports/www/mozilla) or packages; type mozilla at the command line to
    launch it within KDE after it''s installed.


    # KMail


    KMail is KDE''s built-in email client. Figure 20.12 shows its main screen.


    FIGURE 20.12

    The main screen of the KDE mail client KMail.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_351_0.png)'
  merge: -1
  img_proc: true
- pgno: 352
  md: 'Before you can use it, of course, you need to tell KMail about your email account.
    To do this, click on Settings, Configuration. This will bring up the dialog box
    shown in Figure 20.13.


    FIGURE 20.13

    Configuring your email account information in KMail.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_352_0.png)


    In this screen, simply enter your email address, your name, and any signature
    information that you want to append on the end of your email.


    Next, you need to tell KMail about your mail servers. To do this, click on the
    Network icon on the left side of the configuration dialog box. This will bring
    up the dialog box in Figure 20.14.


    FIGURE 20.14

    Configuring out going email server information.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_352_1.png)'
  merge: -1
  img_proc: true
- pgno: 353
  md: 'Unless you access your mail spool file directly (if you don’t know, you probably
    don’t), you will want to select the SMTP option, and then enter the address of
    your outgoing mail server. If you don’t know what your outgoing mail server is,
    ask your ISP or system administrator. Unless you are specifically told otherwise,
    you should leave the port set to 25.


    Now that you have configured the server that you send mail through, you must configure
    at least one incoming server—that is, a server you receive mail from. To do this,
    click the Add button in the Incoming Mail section of the dialog box. This will
    bring up the dialog box in Figure 20.15.


    # FIGURE 20.15


    Adding an incoming mail server.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_353_0.png)


    Here, you need to specify the name of the incoming mail server, as well as your
    login name and password for getting mail from the server. If you check the box
    that says Store POP Password in Configuration File, you will not be asked for
    the password each time you start KMail


    When you are done making configuration changes, click OK on the dialog boxes until
    you are back at the main KDE window.


    # Summary


    In this hour, you looked at some of the basic productivity applications available
    for FreeBSD and the KDE desktop environment. You learned about the various office
    appli-'
  merge: -1
  img_proc: true
- pgno: 354
  md: 'cations bundled with KDE''s KOffice and about the GIMP image editing program.
    Finally, we closed the hour with a look at two popular Internet applications for
    browsing the Web and reading and sending email.


    # Q&A


    Q Are the files created by KOffice applications compatible with Microsoft Office
    files?


    A No. KWord can read documents created by most versions of Microsoft Word, but
    KWord''s saved files cannot be read directly by Microsoft Word. One way to get
    around this is to save your KWord documents in HTML format, which Microsoft Word
    can generally read without trouble.


    Q Are any free alternatives to KOffice available?


    A At the time of this writing, a team is hard at work on porting OpenOffice to
    FreeBSD, so hopefully it will be available soon. OpenOffice is a fully featured
    office suite that truly rivals Microsoft Office in features; it''s based on StarOffice,
    but developed in the public domain. For more information on OpenOffice, visit
    the project''s Web site at www.openoffice.org. StarOffice itself is very nearly
    free these days as well. All it really costs is time and effort. It''s certainly
    worth the small cost if you need file-format compatibility with Windows applications.


    Q Are there any alternatives to the Konqueror Web browser?


    A Netscape and Mozilla are both available for FreeBSD. Both of these can be installed
    from the FreeBSD ports collection and are located in the www directory.


    Q Can I run KMail if I''m not using KDE?


    A Probably not. KMail is a closely integrated part of the KDE environment, and
    it shares many libraries with KDE''s built-in window manager and applet framework.
    For instance, the address book utility that KMail uses depends on KDE''s structure
    in order to run properly. If you''re using GNOME or a different window manager,
    you might be best served by the email client found in Netscape Communicator or
    Mozilla.


    Q Where can I learn more about KMail or KOffice?


    A Both packages have their own Web sites. KMail is documented at http://kmail.kde.org,
    and KOffice''s site is at http://koffice.kde.org.'
  merge: -1
  img_proc: true
