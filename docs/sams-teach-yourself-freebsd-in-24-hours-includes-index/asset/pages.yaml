- pgno: 332
  md: '# The Difference Between Window Managers and Desktop Environments


    In the last hour, you learned about and worked with the KDE desktop environment.
    Desktop environments like KDE usually have more features than bare window managers.
    For example, KDE comes bundled with several small applications, control panels
    for changing the background, and so on. In addition, desktop environments often
    have better integration with applications than window managers. (Applications
    are often written for specific desktop environments, as you will see in the Hour
    20, “Productivity in the X Window System.”) In addition, they usually support
    features such as drag-and-drop, which window managers often don’t support.


    However, running a bare window manager such as twm on top of X Windows, instead
    of a full-featured desktop environment, also has its advantages. The primary one
    is that such window managers are usually much smaller and much less resource intensive
    then desktop environments. This means that they tend to be faster and take up
    far less memory while running. This makes them useful on older systems with limited
    processing power or low memory, as well as lower-end laptops. In addition, it
    makes them useful on servers in which the graphical interface is rarely used anyway.


    Another advantage that window managers have over desktop environments is that
    they are often simpler to use for the end user, especially if you are setting
    up a specialized workstation of a particular purpose. With a window manager—such
    as Blackbox, for example—you can create a simple menu listing only the applications
    that are relevant to the purpose of the workstation. Thus, the only thing the
    end user has to worry about is selecting the application that she wants from the
    menu.


    Figure 19.1 shows the KDE desktop environment and Figure 19.2 shows the Blackbox
    window manager.


    One more common thing that advocates of window managers say is that window managers
    tend to do a better job of staying out of your way and just letting you work.


    Now that we have said all this, it should also be noted that the line between
    window managers and desktop environments has blurred quite a bit these days. Some
    window managers, such as WindowMaker, have many of the features of desktop environments—dockable
    applets, integrated applications written specifically for it, and the like. Other
    window managers, most of which are less full-featured but with certain design
    aspects that many users find attractive (such as a specific “look and feel” or
    just the right kind of configurability) are Enlightenment, Qvwm, IceWM, and dozens
    more, which can all be found in the ports at /usr/ports/x11-wm. Each window manager
    has a Web site where you can find screenshots and descriptions that you can peruse
    before deciding to experiment with a new window manager.'
  merge: -1
  img_proc: true
