  md: '# Hour 8


    # Storage Systems and Backup Utilities


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_145_0.png)


    Every operating system in use today is what was once referred to as a Disk Operating
    System, or DOS. The idea is that unlike some operating systems, which worked entirely
    from self-contained instructions on silicon chips (in ROM or firmware), a DOS
    allowed the user to swap in new instructions on disks— which at the time were
    either eight-inch floppy disks in flimsy plastic jackets, or else “hard disks”
    in sealed containers with much larger capacity. The disks could contain new programs
    to run, data for those programs to work with, or even other disk-based operating
    systems to run the programs. The key was versatility and expandability beyond
    what was sealed into a computer’s case. Just swap in new disks to expand your
    computer’s capacity as much as you like.


    The situation today is about the same, except that the array of “disks” that we
    can use in our computers is vastly greater and more diverse. We now have optical
    discs (CDs, DVDs, magneto-optical media), customized proprietary media like Iomega’s
    Zip and Imation’s SuperDisk, tape drives, and network drives—to say nothing of
    the ubiquitous hard disk and the dependable 3.5-inch floppy.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '> The accepted spelling, by the way, is disk—except for optical media such
    as CDs and DVDs, for which the spelling generally remains disc, presumably in
    order to confuse people.


    In this hour, you will learn how FreeBSD handles disks. Most storage media behave
    in similar ways, especially when you''re reading from them; writing to them, however,
    can be tricky, depending on what kind of storage device you''re using. You will
    learn:


    +   - What a UNIX “Filesystem” is and how it relates to your computer’s directory
    structure

    +   - How to “mount” a disk, or attach its contents to the system for use

    +   - How to simplify the process of mounting and unmounting disks

    +   - How to work with tapes and tape drives

    +   - How to work with optical discs and their drives

    +   - How to back up your files to tape or other media


    # Understanding UNIX Filesystems


    Think about your computer’s directory structure—the way folder and files are organized
    throughout the system. If you’re familiar with Windows, you probably have an image
    in mind that involves several disks sitting at the top level of the system—each
    with a letter assigned to it (C: for your hard disk, D: for your CD-ROM, A: for
    your floppy drive, and so on). In MS-DOS, the underlying structure beneath the
    Windows structure, you switch from one disk to another to work with each disk’s
    files. The metaphor is rather like an “orchard” of trees, one tree per disk, but
    without the individual trees interacting or connecting at all. The Windows operating
    system itself overlays this structure with a “Desktop” metaphor that seems to
    exist above the “orchard” and tying all the trees together, but the fundamental
    separation of disks is still there.


    > Some operating systems use the term volume to refer to a disk—or, more specifically,
    a mountable partition of a disk. You will learn more about partitions later in
    this hour.


    UNIX is different. In the UNIX directory structure, there’s only a single large
    tree of folders, and all disks (or volumes) in the system are attached to the
    tree, or mounted, at'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'various points (as illustrated in Figure 8.1). The cd command (Change Directory)
    works the same in UNIX as it does in MS-DOS—except that in the latter, you can''t
    use cd to move directly from a place on one disk to a place on another disk. You
    have to explicitly change disks first (by typing the drive letter you want). In
    UNIX, however, cd will take you anywhere in the system you want to go. You can
    change from /usr/home, for example, or /var/log; and in doing so, you might well
    have moved from one volume to another, or to an entirely different disk. But from
    your viewpoint, it''s all the same; the commands and tools that you use in one
    part of the tree work just as well in any other part.


    # FIGURE 8.1

    Diagrams of the FreeBSD (UNIX) and Windows filesystem structures, using the "tree"
    analogy.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_147_0.png)


    There are complications involved with having all your media sources (disks and
    volumes) mounted at various places throughout the system, with seamless movement
    allowed between them. For instance, the mv command will move files from one place
    to another within a volume by simply renaming the file and changing its path on
    the disk. But if you try to "move" a file from one volume to another, the system
    must first copy the file to the other volume, and then delete it from its original
    location. The end result is the same, but the process can take a lot longer, depending
    on how big the files are that you''re trying to move and on the speed of the disks
    in question. Moving or copying files to or from a floppy disk (which might be
    mounted at /mnt/floppy, for example) is much, much slower than moving or copying
    files from one hard disk partition to another, which in turn is much slower than
    moving or copying files within the same partition.'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'Similarly, there can be different permissions on different volumes in the system,
    preventing you from moving files from one place to another where you might think
    you''re just moving things around within “the computer.” Remember, UNIX is a multiuser
    operating system, and not all users have the same capabilities as others. As we
    will see, there is also the ability to mount a disk or volume “read-only” or “read/write.”
    Keeping disks logically separated, as in Windows, helps to reinforce the distinctions
    between their varying capabilities—but the UNIX way can make day-to-day operations
    a great deal simpler, particularly in systems that have only hard disks to worry
    about.


    # Partitions, Volumes, and Filesystems


    A filesystem, which is a term we will be using throughout most of this hour, is
    equivalent to a volume—it refers to a single mountable disk, or a section of a
    disk that has been divided into several such sections, or partitions. It can also,
    however, refer to the entire system’s directory structure, containing other filesystems
    attached at various mount points. We will refer to the “FreeBSD filesystem” (meaning
    the entire directory structure), but also to the “root filesystem” and the “/var
    filesystem” (meaning specific volumes attached at particular points).


    Confusingly, a filesystem can also refer to the format in which a partition is
    written—UFS (the UNIX Filesystem), FFS (Berkeley Fast Filesystem), Ext2FS (Linux
    Extended Filesystem), NTFS (Windows NT Filesystem), and MSDOSFS (MS-DOS Filesystem)
    are all commonly used formats that FreeBSD understands or can be configured to
    understand. The native filesystem type that FreeBSD uses for its own disks is
    FFS, which is effectively synonymous with UFS, the traditional filesystem format
    used on BSD UNIX platforms for many years.


    All operating systems provide the ability to partition any disk. The benefits
    of partitioning are that you can predefine certain segments of the disk to have
    maximum sizes that their contents cannot exceed. For instance, in Windows you
    might partition a hard disk so that your C: drive is for your operating system,
    D: is for your personal documents and files, and E: is reserved for file sharing.
    This way, file sharing activities cannot end up filling your entire disk with
    junk that other people upload to your computer. The only thing it can fill up
    is the E: partition.


    UNIX benefits from partitions the same way. However, because there are no “drive
    letters” in UNIX, and because all mounted volumes are attached to the filesystem
    at certain points, the partitions are given names that match the mount points
    where they are attached. For instance, the /var partition (which contains variable
    files—files whose contents change continuously during normal operation, such as
    system logs) can be set to a certain size so that the log files within it don’t
    grow to fill the entire disk—just the /var filesystem.'
