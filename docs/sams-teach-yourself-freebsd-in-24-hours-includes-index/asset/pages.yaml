- pgno: 413
  md: 'This setting enables the NFS Input/Output Daemon, nfsiod, which helps to streamline
    NFS client requests and tunes a few kernel settings to improve access time. This
    is all handled automatically in the /etc/rc.network script at boot time, along
    with the NFS server settings (that you saw earlier).


    # Mounting Remote Filesystems


    Mounting an NFS share is done with the mount_nfs command, which is a shorthand
    command for mount -t nfs (as you saw in Chapter 8, “Storage Systems and Backup
    Utilities”). In its most common form, you would pass it two arguments: the host
    and share names in a combined string, as well as the local mount point:


    ```

    # mount_nfs spots:/home /home2

    ```


    A successful mount will result in no output. Check that the mount was successful
    with the df command:


    ```

    # df

    Filesystem     1K-blocks    Used   Avail Capacity Mounted on

    /dev/ad0s1a      992239   54353  858507      6% /

    /dev/ad0s1f    26704179 4872963 19694882     20% /home

    /dev/ad0s1e      992475 1642343 7488174     18% /usr

    procfs                4       0       4    100% /proc

    spots:/home     9924475 1642343 7488174     18% /home2

    ```


    If you go into the /home2 directory, you''ll see all the directories within /home
    on the NFS server, with each file''s ownership mapped based on UID, as we discussed
    earlier. The filesystem will remain mounted until you explicitly unmount it with
    the umount command:


    ```

    # umount /home2

    ```


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_413_0.png)


    > Remember to leave any NFS-mounted directory before you try to unmount it with
    umount. You will get a device busy error if you try to unmount a filesystem while
    you''re still inside it.


    NFS shares can be mounted in a great variety of different ways, and the options
    are laid out in the man mount_nfs page. Some of the more useful are the -T option,
    which forces TCP transport rather than UDP (useful for mounts done over long-distance
    WAN links); and the -s and -x <seconds> flags, which allow the mount to timeout
    and disappear after a specified period and fail (a soft mount).


    ```

    # mount_nfs -s -x 60 spots:/home /home2

    ```'
  merge: -1
  img_proc: true
- pgno: 414
  md: '> Another useful option is -i, which enables interruptibility. Normally, if
    you have mounted an NFS share and the server becomes unresponsive or unreachable,
    any filesystem calls you make (commands that deal with the shared files, such
    as ls) can hang in such a way that even pressing Ctrl+C won''t stop them. The
    -i option makes it so that Ctrl+C (the termination signal) will force the command
    to fail, returning control to you.


    As with other filesystem types, you can add NFS mounts to /etc/fstab to set up
    predefined mount points, simplifying the mount process. Place any options you
    would otherwise pass to mount_nfs in the Options column, separated by commas:


    # Device | Mountpoint | FStype | Options | Dump | Pass#

    spots:/home | /home2 | nfs | rw,-T,-i,noauto | 0 | 0


    With a table entry like this, you can mount an NFS filesystem with the mount command:


    ```

    # mount /home2

    ```


    # Mounting Remote Filesystems Automatically at System Boot


    All filesystems in /etc/fstab are automatically mounted at boot time unless the
    noauto option is present. You can specify that remote NFS shares should be mounted
    at startup by simply adding them to /etc/fstab, as you just saw. However, there
    are a few things to watch out for.


    Most notably, NFS has an extremely long default timeout period, and the phase
    during startup when filesystems are mounted is a synchronous, blocking process.
    If your NFS server or servers cannot be found—for instance, if the server machine
    isn''t running, or if your own machine''s network connection is not configured
    properly—the boot process can hang for an intolerably long period before giving
    up and finishing the boot procedure.


    You can solve this problem by placing the noauto option in /etc/fstab, as you
    saw in our earlier example. However, this means that you have to mount each NFS
    share manually after the system is fully booted. There''s a better way to handle
    this: the -b option.


    # Device | Mountpoint | FStype | Options | Dump | Pass#

    spots:/home | /home2 | nfs | rw,-b | 0 | 0'
  merge: -1
  img_proc: true
