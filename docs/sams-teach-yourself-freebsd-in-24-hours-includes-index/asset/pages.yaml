  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_279_0.png)


    # Hour 16


    # Command-Line Applications


    Command-line applications might seem like a rather archaic way to work in today''s
    world of graphical user interfaces. However, they can still be quite powerful
    and definitely have some advantages. For one thing, they can be run on virtually
    any computer because they don''t require very many system resources. The other
    advantage is that they can be run remotely from any terminal emulator with some
    kind of network access to the FreeBSD system that your application is on. For
    example, this means that you can take your Windows or Macintosh laptop to the
    other side of the world, connect to the Internet, log in to your FreeBSD system
    that is 5,000 miles away, and work with applications on it without requiring any
    special software.


    In this hour, you will learn:


    +   - How to work with the various text editors included with FreeBSD

    +   - How to work with text-based email applications

    +   - How to work with other miscellaneous applications'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Working with Text


    A text editor is one of the most basic applications necessary for any computer
    system. Virtually all operating systems come with at least one or often several
    text editors. For example, Windows comes with Notepad and the older text mode
    Edit program. In FreeBSD, because so much of the system configuration is handled
    by text-based configuration files, the ability to work with a text editor is especially
    important.


    By default, FreeBSD installs two fully featured text editors. The first is the
    vi text editor. vi is one of the oldest UNIX text editors still in widespread
    use. It is also one of the most powerful. Unfortunately, it also has a reputation
    for being rather arcane and difficult to learn. Because of this, FreeBSD also
    provides another editor called ee (short for Easy Editor) that is installed by
    default. This editor is much easier to learn for new users, so it is the editor
    we will cover first. However, we will also cover vi because it is the "universal
    UNIX text editor." No matter what version of UNIX you ever have to work on, you
    can be assured that vi will be installed on it. In fact, vi might sometimes be
    the only editor installed on some UNIX systems. So having at least a basic ability
    to work with vi can be very handy for anyone who works with FreeBSD or any other
    form of UNIX.


    # The ee Editor


    To start the ee editor, simply type ee at the command prompt. This will start
    the editor with no file loaded into it. If you want to start ee with a file, simply
    follow the command with the name of the file—for example, ee myfile. If the file
    myfile exists, it will be loaded into ee. If the file doesn''t already exist,
    a new file with that name will be created.


    Figure 16.1 shows the ee editor with a blank file loaded into it.


    FIGURE 16.1

    The ee text editor.

    Notice the handy cheat sheet at the top that shows you keyboard shortcuts.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_280_0.png)'
  merge: -1
  img_proc: true
- pgno: 281
  md: 'The ^ symbol in front of the menu options is called the caret. It represents
    the CTRL key. To access the menu options, you press the CTRL key along with the
    key that follows the caret symbol. Table 16.1 lists some of the less obvious menu
    options and what they do.


    # TABLE 16.1 Some ee Menu Options and Their Associated Action


    | Key Combo | Action |

    |---|---|

    | Ctrl+o | This will bring up a prompt where you can enter an ASCII code for a
    character. This is primarily useful for entering certain foreign characters that
    do not have keys on the keyboard. |

    | Ctrl+c | This changes the menu at the top to display a new list of commands.
    You will also get a prompt at the bottom of the screen where you can enter the
    name of the command you want to use. To exit the prompt without entering a command,
    just press Enter. |

    | Ctrl+x | This option is somewhat confusing as it will not actually bring up
    a prompt for you to search for something. Instead, it will repeat the previous
    search that was done. To initiate a search that allows you to enter something
    to search for, use Ctrl+y. |


    Note the ^g and ^v that are listed as Previous Page and Next Page. On most systems,
    you can also use the Page Up and Page Down keys to accomplish the same thing.
    However, if you are logged in to a system remotely, the Page Up and Page Down
    keys might not work correctly. In this case, the CTRL key substitutes should work.


    You can also bring up a menu window by pressing the Esc key. This will bring up
    a window such as the one in Figure 16.2


    # FIGURE 16.2

    The ee menu window.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_281_0.png)'
  merge: -1
  img_proc: true
- pgno: 282
  md: 'To navigate the menu, you can either press the letter corresponding to the
    option you want, or you can use the arrow keys to move the cursor over the letter
    and press the Enter key.


    # Configuring ee


    As we have mentioned before, most FreeBSD configuration is handled by text-based
    configuration files. ee is no exception. However, ee provides a menu-based interface
    to most of the configuration options, so you don''t have to edit the configuration
    file directly if you don''t want to.


    The configuration file is located in your home directory and has the name .ee.init.
    It will be automatically created for you the first time you customize the settings
    of ee. Remember that files beginning with a period are hidden in the normal directory
    listing, so you will not see this file unless you use ls -a.


    To access the setup options, you can press Esc to bring up the main menu, and
    then you can press e to access the settings menu. Figure 16.3 shows what it looks
    like.


    FIGURE 16.3

    The ee configuration settings (modes) menu.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_282_0.png)


    Most of the options can be toggled on or off by pressing the corresponding letter
    or using the arrow keys to highlight them and then pressing the Enter key. Table
    15.2 shows what these options mean.


    # TABLE 16.2 Configuration Options in ee


    | Option | Action |

    |---|---|

    | Tabs to spaces | This option converts tab characters into the equivalent number
    of normal spaces. This is mostly useful for Python programmers and such where
    whitespace is used to delimit code blocks. |'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# TABLE 16.2 continued


    | Option | Action |

    |---|---|

    | Case-sensitive search | It''s off by default. If you turn it on, only terms
    that match the case of your search will be returned. For example, searching for
    "unix" will not find the word "Unix." |

    | Margins observed | It''s off by default. This controls whether the editor word
    wraps. When it is on, the editor will automatically move to a new line when it
    reaches the value set in the right margin. When off, you will need to press the
    Enter key anytime you want a new line. |

    | Auto paragraph format | It''s off by default. When on, the editor will attempt
    to automatically reformat the paragraph when you insert text in to the middle
    of it. This means that it will behave similar to a word processor. |

    | Eightbit characters | It''s on by default. It allows extended characters to
    be displayed. Extended characters are generally foreign characters that cannot
    be generated from a typical U.S. English keyboard. |

    | Info window | On by default. This causes the top part of the window to display
    the menu shown in the previous figures. If you turn it off, no menu will be displayed.
    You should leave this on unless you are very familiar with the various key commands.
    |

    | Emacs key bindings | On by default. Basically, this means that the ⌘ CTRL key
    sequences behave like Emacs. If you don''t know what Emacs is, don''t worry about
    it. Just leave this option as it is set by default. |

    | Right margin | This is the column number that the right margin is at. By default,
    it is the width of a standard 80 character text-based terminal. As stated before,
    this setting is ignored unless the Margins Observed option is changed to yes.
    |

    | 16-bit characters | This controls how 16-bit characters are handled internally.
    Unless you are working with a Chinese character set or something, you shouldn''t
    have to worry about this option. |


    The final option allows you to save the editor configuration. When you select
    this option, you will be asked whether you want to save the editor configuration
    to the current directory or to your home directory. Saving to your home directory
    will cause the settings to be the default editor settings. Saving to the current
    directory will cause these settings to apply only when the editor is started from
    the directory you are currently in. This will override the default settings that
    are supplied by the configuration file in your home directory. If no .init.ee
    file is found in your home directory, the settings from your .init.ee file in
    your home directory will be used.'
