- pgno: 255
  md: '+   - If the modem responds with either BUSY (the number dialed was busy) or
    NO CARRIER (the connection was lost), the script ABORTs.

    +   - The script sends the AT command to the modem, which is sort for ATTENTION.
    It then waits for the modem to respond with OK.

    +   - After the modem has responded with OK, the script dials the phone number
    5551212. This number should, of course, be replaced by the phone number that your
    ISP gave you. The ATD stands for ATTENTION DIAL, and the T tells the modem to
    use Touch-Tone dialing. If you have an ancient phone system that doesn''t support
    Touch-Tone, you can use ATDP instead, which tells the modem to use pulse or rotary
    style dialing.

    +   - The script waits for the modem to respond with CONNECT.


    Save the chat.script file and exit the editor. There is at least one more file
    we need to create—possibly two more files. These files contain the PAP or CHAP
    authentication information needed for you to log in to your ISP.


    # pap-secrets and chap-secrets


    The /etc/ppp/pap-secrets and /etc/ppp/chap-secrets files contain authentication
    information for Password Authentication Protocol (PAP) and Challenge-Handshake
    Authentication Protocol (CHAP) authentication, respectively. If your ISP told
    you which form of authentication it uses, you only need to create the file corresponding
    to that type of authentication. If you do not know which form of authentication
    your ISP uses, you will need to create both files.


    Both files only need to contain a single line, which has the following format:


    `loginname * password`


    In the previous sample options file, the login name we gave to the name line was
    foobar, so this line in chap-secrets or pap-secrets should read


    `foobar * password`


    Of course, you will want to replace password with whatever your login password
    is for your ISP. The asterisk separating the username and password means that
    this entry is good for any host.


    When you have finished entering this line, save one or both of the files (pap-secrets
    and chap-secrets) and exit the text editor.'
  merge: -1
  img_proc: true
- pgno: 256
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_256_0.png)


    > Because the pap-secrets and chap-secrets files contain your password for your
    ISP, they should be readable only by the root user. This can be accomplished by
    setting the file permissions as follows: chmod 600 pap-secrets or chmod 600 chap-secrets.
    Failing to do this will allow anyone with an account on the system to obtain the
    ISP password!


    # Starting the Internet Connection


    You should now be ready to start the Internet connection. To do so, as the root
    user, enter `pppd` at the command prompt. Your modem should dial and connect to
    the Internet. To disconnect from the Internet, simply kill the `pppd` program.
    The `killall pppd` command will do the trick. If it doesn''t work, the section
    “Troubleshooting the Connection” at the end of this hour can help.


    # Dial-on-Demand


    If you want your system to automatically connect to the Internet anytime an Internet
    resource is requested and the connection is not already up (you enter a Web page
    address in a Web browser, for example), you can set up dial-on-demand. To do this,
    you can just add two more options to the `/etc/ppp/options` file. Here are the
    relevant options:


    +   - **demand** — This option turns on the dial-on-demand function.

    +   - **idle n** — This option determines how long the connection should be allowed
    to be idle (that is, no incoming or outgoing traffic) before FreeBSD hangs up
    the modem. *n* is a value given in seconds.


    Note that you will still need to start the `pppd` program after you turn on your
    computer in order for this to work. If you want to have the `pppd` program loaded
    automatically each time you start your system, create a file called `ppp` in the
    directory `/usr/local/etc/rc.d` that contains the single line `pppd`. This will
    cause the `pppd` program to be loaded automatically each time the computer is
    started.


    # Persistent Connections


    If you want to have FreeBSD automatically redial the connection anytime it is
    lost, you can add a line to `/etc/ppp/options` that says `persist`. Basically,
    this will cause your Internet connection to always be on; thus, it will also cause
    your phone line to always be tied up.'
  merge: -1
  img_proc: true
- pgno: 257
  md: "![](img/ba0161b65b37e94cffc801ecbacaba5e_257_0.png)\n\n> Keeping your system\
    \ connected to the Internet all the time, even when you are not using it, could\
    \ cause your ISP to cancel your account even if you have unlimited access. Or\
    \ they might ask you to purchase what is known as a dedicated line, which will\
    \ cost you a great deal more than a standard Internet connection.\n> \n> A further\
    \ concern is that a system that's online at all times is also more vulnerable\
    \ to being hacked. Beware—an always-on connection carries with it significant\
    \ risks!\n\n# Automatically Running Commands on Connect and Disconnect\n\nTwo\
    \ files called /etc/ppp/ip-up and /etc/ppp/ip-down allow you to automatically\
    \ have commands run on each connect and disconnect from the Internet, respectively.\
    \ Simply place a list of commands that you want to run in these files. A simple\
    \ example of an ip-up script would be as follows:\n\n```\napachectl start\necho\
    \ \"My network connection is up! Web server started.\"\n```\n\nAn example of where\
    \ this can be especially useful is for laptop users who want to read and respond\
    \ to email offline and then have all the email they wrote automatically sent the\
    \ next time they connect to their ISP. This can be done using the Fetchmail program,\
    \ available in the ports (/usr/ports/mail/fetchmail).\n\n# Troubleshooting the\
    \ Connection\n\nSeveral things can cause your Internet connection not to work\
    \ correctly. Some of the most common problems and potential solutions for them\
    \ are listed as follows.\n\n# The Modem Never Dials\n\n+   - Make sure that you\
    \ have selected the proper communications device for your modem.\n+   - Try reducing\
    \ the speed in the first line of the options file from 115200 to 57600.\n+   -\
    \ Check your modem handbook and see if it is expecting some kind of special initialization\
    \ string. If so, you can supply this in the chat.script file; if your modem's\
    \ initialization string, for example, is AT&F, you can add the string AT&F OK\
    \ into the script right after the ATZ OK part."
