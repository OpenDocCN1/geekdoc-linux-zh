- pgno: 87
  md: '# TABLE 4.2 Common Options to the ps Command


    | Option | Action |

    |---|---|

    | a | Shows all processes that are running, including processes that do not belong
    to you. |

    | u | Lists the username that the process belongs to. |

    | w | Enables "wide" output. Basically, this wraps the output of a line to fit
    in your terminal window instead of just truncating the output as it would otherwise
    do. |

    | x | Shows daemon processes as well as normal processes. In other words, shows
    processes running in the background that have no terminal attached to them. |

    | U username | Lists processes belonging to the user username instead of to yourself.
    |


    Remember that FreeBSD is case sensitive, so u and U in the previous table are
    treated as different options. Here is some sample output from running the ps command
    with no options:


    ```

    12572 tty0 S 0:00.01 /usr/local/bin/bash

    12578 tty0 T 0:45.04 /usr/local/bin/mutt

    12582 tty0 R 1:22:01 grep

    ```


    Let''s look at what this output means.


    The first number in each line is the process ID number, also known as the PID.
    The PID is simply a number that FreeBSD (and sometimes you) use to refer to this
    process.


    The second column contains the controlling terminal that started the process.
    If the process doesn''t have a controlling terminal, such as a daemon process
    that was not started from a terminal, this column will contain ??. The third column
    contains the status of the process. In this case, the first line contains an S.
    This means that the process is sleeping, probably because it is waiting for some
    other event (such as the user to type something and give the process something
    to do). The second line contains a T in the status column. This means that the
    process is stopped. A stopped process is basically one that has been paused and
    can later be resumed. We will look at how to do this later on. The third process
    has an R in the status column. This means that the process is runnable. In a nutshell,
    this means that the process is in FreeBSD''s queue to be run and is waiting for
    FreeBSD''s scheduler to enable it to access the CPU.


    There are more statuses as well. To see all the status codes and their meanings,
    see the man page for ps.'
