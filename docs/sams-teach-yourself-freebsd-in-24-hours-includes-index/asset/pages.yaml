- pgno: 240
  md: '![](img/ba0161b65b37e94cffc801ecbacaba5e_240_0.png)


    Unlike Linux, FreeBSD has different device names for each of the drivers it uses
    for network interface cards. Although Linux uses simply eth0, eth1, and so on
    for its Ethernet cards, FreeBSD will name a pair of Intel EtherExpress cards fxp0
    and fxp1, and a RealTek card will become rl0. It''s not as easy to tell that fxp0
    is an Ethernet card as it is with Linux''s eth0 designation.


    Note, also, that Linux and FreeBSD number their PCI cards in different "directions";
    Linux''s device numbers rise as you move toward the motherboard, whereas in FreeBSD
    the numbers rise moving away from the motherboard. If you have a machine with
    two PCI Ethernet cards, the one with the 0 on the end of its name will be closest
    to the motherboard on the PCI chain in FreeBSD, or the on-board Ethernet if there
    is one. In Linux, however, the device with the 0 will be the one at the end of
    the PCI chain, farthest from the motherboard.


    Most Ethernet cards sold today for PC hardware are PCI-based, which means that
    the PCI controller handles all the addressing automatically and you don''t need
    to do any of the IRQ/DMA/memory address gyrations associated with older ISA cards.
    If all you have is an ISA card, do yourself a favor and spend the 30 dollars to
    get a new PCI card from Intel or 3Com. You will save yourself a great deal of
    entirely unnecessary pain.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_240_1.png)


    If you have a PCI Ethernet card, you can simply delete all the ISA cards from
    the kernel configuration during installation (in "visual config" mode). If your
    card is ISA, however, you will need to know your card''s chipset and manufacturer,
    so you know which one to keep and which ones to delete.


    How will you know whether FreeBSD recognizes your installed Ethernet card? Simply
    enter the dmesg command. This command prints out the kernel message buffer that
    has been building since your machine last booted, and the messages it has will
    contain all the device discovery lines that you saw go by during the boot process.
    Look through the lines describing each device. If you see something like this,


    ```

    xl0: <3Com 3c905C-TX Fast Etherlink XL> port 0xd800-0xd87f

    mem 0xf6800000-0xf68007f irq 12 at device 2.0 on pci1

    xl0: Ethernet address: 00:e0:18:29:92:a0

    ```


    This means that your system found an Ethernet card that it can use.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Configuring Network Settings with sysinstall


    The simplest way to configure your Ethernet card, and probably the most familiar
    looking to anyone who''s gone through this process on a Windows machine or Macintosh,
    is with sysinstall. The first time you ask sysinstall to do anything that requires
    a network connection (a net installation of the system, browsing packages, or
    various other tasks), it will bring up the network configuration window in which
    you can set the TCP/IP options for your Ethernet card visually.


    An easy way to get to this screen—if you''re already up and running multiuser
    and not in the initial system installation process—is to run /stand/sysinstall,
    select Configure from the main menu, and scroll down to the Media option. In this
    submenu, select FTP and some FTP server (it doesn''t matter which), and you''ll
    see a dialog box that says Running Multiuser, Assume that the Network Is Already
    Configured? Choose No to enter the network configuration screens. The next thing
    that appears is the Network Interface selection screen, shown in Figure 13.2.


    Figure 13.2

    Selecting your network interface card in the sysinstall program.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_241_0.png)


    You''re presented with a list of the interfaces that FreeBSD has found in your
    system. You''ll probably see a number of choices that don''t make a lot of sense—aside
    from choices such as lp0 (the parallel port) and various PPP or SLIP options on
    your serial ports, you''ll see things like gif0 and faith0. These are IPv6 devices;
    you can ignore them. The option you want is probably at the top. The one we''re
    using in this example is fxp1, an Intel EtherExpress Pro/100B PCI card.


    When you select your Ethernet card, you''re given two dialog boxes: a choice to
    let the system try to configure the card automatically using IPv6 and then another
    choice to let it try using DHCP. Say No to both choices. You''ll then be presented
    with the visual Network Configuration screen, as shown in Figure 13.3.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# FIGURE 13.3


    The visual Network Configuration screen

    in the sysinstall program.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_242_0.png)


    Each field in this screen has a short description at the bottom of the window,
    but we can explain it a little further here.


    +   - **Host**—This is the hostname, which is just the first part of the machine’s
    fully qualified domain name. For instance, if your machine is www.somewhere.com,
    the Host: field should be set to www.

    +   - **Domain**—This is the rest of the domain name, or somewhere.com. This can
    be a composite or multi-level domain for networks with named subnets, such as
    cslab.ivyleague.edu if your machine is called, for instance, lysine.cslab.ivyleague.edu.

    +   - **IPv4 Gateway**—This is the IP address of your gateway router. Use the
    next-hop router closest to your machine. This router will be responsible for transmitting
    any traffic between your machine and any other machines in the world. Ask your
    network administrator what this number should be if you don’t know it.

    +   - **Name server**—The IP address of the most reliable domain name server (DNS)
    in your network. You should use the DNS provided by your enterprise, ISP, or university
    network if at all possible; remote name servers are useful as backups, but they
    won’t necessarily be set up to service non-local requests reliably.

    +   - **IPv4 Address**—This is the IP address you’re assigning to your Ethernet
    card. It needs to be on the same subnet as your IPv4 Gateway as matched against
    your netmask, as we discussed in Hour 12, “Introduction to Networks.” Ask your
    administrator for an unused IP address to put in here, if you don’t have one already;
    you can’t just type in any old address and hope it will work. If you enter an
    address that is already in use elsewhere on the network, one or both machines
    trying to use that address will lose their network connectivity.

    +   - **Netmask**—This is used to determine whether a packet’s destination is
    on the local network or not. Set the field to 255.255.255.0 for a Class C network,
    255.255.0.0 for Class B, and so on, as discussed in Hour 12.'
  merge: -1
  img_proc: true
- pgno: 243
  md: '+   - *Extra options to ifconfig*—You most likely won''t need to put anything
    in here unless you''re a power user looking to tweak the performance of your interface
    card. Anything put in here will be added to the ifconfig command line that sysinstall
    issues in the background.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_243_0.png)


    > These network settings are the same as in any operating system. If you are unsure
    what to put in any of these fields in sysinstall, check to see if there is a Windows
    machine nearby on your network that you can peek into. If you open up the TCP/IP
    settings (usually called Properties under Network, available in the Control Panel,
    depending on your version of Windows), you will be able to find out what the settings
    such as the netmask, the gateway, and the name server should be. Don''t copy the
    Windows machine''s IP address to your machine, though.


    After you''ve set all these options, select OK; the network settings will be applied
    to the card on-the-fly, and whatever you were doing in sysinstall will continue.
    If you''re following the steps of this example, sysinstall will connect to your
    selected FTP server. If this isn''t successful, there''s likely a problem with
    the network settings you entered, and you''ll have to go back in and troubleshoot.
    Consult your network administrator, if you have one available, for assistance.


    This process works in much the same way if you''re doing a first-time installation
    of FreeBSD; you will be presented with this same configuration screen early in
    the install process, and if you''re doing a network installation, it will use
    the settings to pull down the system distribution.


    # Testing Network Connectivity with ping


    After you''ve finished your network configurations, you will want to make sure
    that the settings are correct. The easiest solution is the ping program—a simple
    ICMP-based tool that checks for echoes from a specified host and reports the round-trip
    time it takes each packet to get to the host and back.


    The use of ping is pretty simple. You can run it against either an IP address
    or a host-name; it will run until you interrupt it with Ctrl+C:


    ```

    # ping fred

    PING fred (114.235.123.11): 56 data bytes

    64 bytes from 114.235.123.11: icmp_seq=0 ttl=243 time=485.344 ms

    64 bytes from 114.235.123.11: icmp_seq=1 ttl=243 time=351.589 ms

    ^C

    -- fred ping statistics --

    ```'
  merge: -1
  img_proc: true
- pgno: 244
  md: '```

    2 packets transmitted, 2 packets received, 0% packet loss

    round-trip min/avg/max/stdev = 351.589/418.466/485.344/66.877 ms

    ```


    This is a healthy TCP/IP configuration—the specified host replied to the ping.
    However, if the host isn''t reachable, the ICMP packets will timeout and report
    the failure to connect. If this happens, something''s wrong with your configuration
    (or, of course, the remote host might actually be down—make sure to try multiple
    target hosts, including some that you know must be online, such as www.microsoft.com).


    ```

    # ping 64.41.131.133

    PING 64.41.131.133 (64.41.131.133): 56 data bytes

    ping: sendto: Host is down

    ping: sendto: Host is down

    ping: sendto: Host is down

    ping: sendto: Host is down

    ^C

    --- 64.41.131.133 ping statistics ---

    10 packets transmitted, 0 packets received, 100% packet loss

    ```


    # Summary


    In this hour, we briefly ran through the most basic and straightforward way to
    set up your FreeBSD machine for the Internet. A full discussion of this topic
    would have gone into greater depth on such topics as manually configuring your
    IP settings with ifconfig, your gateway routes with netstat, and your name server
    settings with the /etc/resolv.conf file. You would also have seen how to start
    the network manually using /etc/netstart, and how to do automatic TCP/IP configuration
    through DHCP. Those topics, however, are beyond the scope of this brief discussion.
    For the vast majority of FreeBSD users, connecting your machine to the Internet
    is a simple, straightforward process without much that can go wrong.


    # Q&A


    Q My Ethernet card isn''t listed among the cards that FreeBSD supports, or I don''t
    know what the heck my card is. What do I do?


    A Don''t panic! There are a number of things you can try. First of all, just read
    the output of dmesg. Chances are that you''ll see something among the device discovery
    lines which tells you what your Ethernet card is. If you don''t, however, and
    you''re sure that your card is seated properly in its slot and is working, try
    using it in a Windows machine. Windows might be able to tell you what the card
    is by what'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'driver it picks. You can then look in `/usr/src/sys/i386/conf/NOTES` to see
    if a driver is there for that card; if so, you can compile it into the kernel
    as you saw in Hour 10, “The FreeBSD Kernel and the Device Tree.”


    Something else to try is to look at the chipset on the card itself (the largest
    chips on it), which might have a manufacturer name or a model number on it. This
    chipset information is what’s really important to the kernel; if you see a driver
    that matches it in the kernel configuration, or a driver for a major Ethernet
    card using the same chipset, try it—it might work.


    # Q What should I do if I have an old ISA Ethernet card?


    A If FreeBSD supports your card, you might have to set its IRQ and memory address
    to values not used by anything else in the system. Unfortunately, this can usually
    only be done with a DOS utility that comes with the card, which writes the values
    out to the card’s firmware. You can use the full-screen visual installation mode
    of FreeBSD’s installer to tell you whether your card’s IRQ or memory address conflict
    with any other drivers in the system.


    # Q After running sysinstall, I can’t get network connectivity to anything. What’s
    wrong?


    A Any number of things could be wrong with your chosen TCP/IP settings; talk to
    your network administrator to make sure that the correct values are entered into
    sysinstall.


    If you’re your own network administrator, check all the usual suspects—the cabling
    (make sure that you have “link” lights on your Ethernet card and that the “activity”
    light is flashing to indicate that traffic is reaching it); connectivity to other
    machines on the same network segment; the presence of an IP address and status:
    active in the output of `ifconfig <device>`. If you can plug another machine in
    to the same hub or switch that the FreeBSD machine is connected to, it’s a local
    problem with your TCP/IP configuration settings. Make sure that you’re not using
    an IP address already in use elsewhere on the network and that your subnet mask
    is correct!


    # Q I can ping machines by their IP address, but not by their names. How can I
    fix this?


    A Your DNS (name server) setting is probably incorrect. Try pinging the name server
    machine itself to make sure it is running. If not, see if there’s another name
    server you can use. Also, make sure you’ve specified your name server by IP address,
    not by hostname!'
  merge: -1
  img_proc: true
