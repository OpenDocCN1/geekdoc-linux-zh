- pgno: 213
  md: '# Summary


    In this hour, you learned about the different update paths available for FreeBSD
    and how to decide which one you should use. You learned how to update your system
    source tree to the latest version from a FreeBSD server. You also learned how
    to rebuild your entire system from the new sources and update the configuration
    files. In addition, you learned how to recover if something goes wrong during
    the build process.


    # Q&A


    Q I have a FreeBSD 4.6 system. I want to keep it updated to the most recent security-patched
    version, but I don’t want to upgrade all the way to 5.0. (My system is too critical
    to risk changing everything.) What branch tag name do I use?


    A Use RELENG_4_6. This will keep synchronized to the most recent 4.6 code, which
    has security patches and critical fixes applied to it and new point-release tags
    assigned to it regularly. However, it never has new features put into it or anything
    changed around which might affect system behavior in any significant way.


    Q How do I synchronize my ports tree to either the 5.0 branch or the 4.6 branch?


    A You don’t. Ports only have one “branch,” and one place you can synchronize them
    is the “top-of-tree” point, specified with the dot (.). Because all the ports
    are changing all the time, there is no way to “freeze” them the way they were
    at a particular point during the history of FreeBSD; nor does it make sense to
    do so. Each port is maintained independently. It’s up to each port’s developer
    and maintainer to keep it patched and up to you to keep it synchronized with your
    system’s ports tree.


    Q I accidentally told mergemaster to leave one of the installed files alone when
    I really wanted to install the new version. What do I do?


    A Simply run mergemaster again, and say “yes” when it asks if you want to use
    the existing /var/tmp/temproot. It will then ask you only about those files that
    are left over from the previous run.


    Q Now I managed to overwrite one of my personally customized files with the generic
    one in mergemaster!


    A You did make a backup of /etc before you ran mergemaster, didn’t you? If so,
    just copy the file out of there back into /etc.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_213_0.png)'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Workshop


    In this interactive section, you will be given a quiz and a few exercises in order
    to help solidify your understanding of the procedure by which to upgrade your
    FreeBSD system.


    # Quiz


    +   1. The program used to update FreeBSD sources is

    +      A. update

    +      B. cvsup

    +      C. pkg_add

    +      D. make

    +   2. The mergemaster program

    +      A. Compares differences in configuration files

    +      B. Merges changes from the new system source code into your current system

    +      C. Downloads new source code from FreeBSD servers

    +      D. None of the above

    +   3. Which of the following trees is intended for production use and has the
    latest security patches applied to it?

    +      A. CURRENT

    +      B. RELEASE

    +      C. STABLE

    +      D. SNAPSHOT


    # Quiz Answers


    +   1. The correct answer is B. Answer A does not exist. C is the command used
    to install software packages. D is the command used to build software from sources
    (but it does not update the sources).

    +   2. The correct answer is A.

    +   3. The correct answer is C. Answer A is the development version of FreeBSD,
    and it should not be used on production systems. B is a stable released version
    of FreeBSD, but it will not always have the latest security patches applied. D
    is a snapshot of the development version, so it still is not suitable for production
    systems.'
  merge: -1
  img_proc: true
