    # System Backup Strategies and Utilities


    Every operating system needs to have backup schemes available so that computers
    with critical data on them—no matter what platform—can be resurrected should their
    hardware fail, their security be breached, or the entire system be lost in a fire
    or a break-in. The risks are too many to be counted.


    FreeBSD doesn''t have as many options available for easy, seamless backups as
    Windows or even Linux do; this is one of the prices we pay for using an operating
    system that''s not quite as ''mainstream'' as some. Proper backup solutions involve
    dedicated client-server software installations, a central server orchestrating
    daily transfers of data from all computers in a cluster, and a tape carousel that
    handles the incremental data from all involved machines. In a full-fledged corporate
    network, the best practices in business IT generally involve a tape carousel system
    that does full backups of all machines on a weekly basis, and incremental ''delta''
    dumps (saving only the files that have changed since the last full backup) each
    day in between; the tapes are removed from the carousel and replaced each week
    (or, in some cases, daily) and moved to a secure off-site storage location. Thus,
    the entire network can (theoretically) be restored even if the main building should
    burn down.


    Many corporate networks use software such as the Legato NetWorker for their centralized
    tape-backup solutions. However, this and other packages in its category might
    not be supported under FreeBSD (although /usr/ports/sysutils/nwclient is a working,
    if unsupported, Legato client). We will instead look at one or two more rudimentary
    backup methods—the ones FreeBSD supports natively.


    # Using tar


    Although its use is not particularly easy, tar—the Tape ARchiver—is a ubiquitous
    UNIX tool whose purpose is to facilitate backing up large amounts of data to a
    tape or to a file'
  merge: -1
  img_proc: true
- pgno: 161
  md: 'that you can copy to a cheap removable disk such as a CD-R. The tar program
    will concatenate all the files in a directory structure together into a single
    long file, preserving the permissions, ownership, and timestamps of each one.
    Then you can use gzip to compress the file, potentially reducing its size by as
    much as an order of magnitude, depending on what kind of data you''re backing
    up.


    One way to use tar is to have it create a file from its input data. This is most
    useful if you don''t have a tape drive, but must rely instead on removable disks
    for your permanent backups. Choose a starting point in your system—a top-level
    directory that contains most of the irreplaceable data in your system. (If you
    have such data in a lot of places in the system, you might have to do multiple
    backups.) The obvious place to do this, in FreeBSD, would be /usr/local, although
    your needs might vary. For instance, you might want to back up /usr/home as well
    to archive your users'' home directories.


    Check to see how big a complete backup of your selected starting point would be,
    using du (Disk Usage) with the -s, or summary, option:


    ```

    # cd /usr/local/

    # du -s

    449212 .

    ```


    This system''s /usr/local tree only contains about 450 megabytes of data. This
    could fit onto a CD without even being compressed. However, the most important
    reason to check this number is not whether the resulting file will fit on a disk
    (though that is important); what you want to make sure of is that your hard disk
    will have enough room to hold the file during the backup process. Remember, you''re
    effectively making a copy of /usr/local; so at least as much space as /usr/local
    requires needs to be available to you.


    Pick a destination directory in a partition that has enough space to hold the
    output (use df to check); create a new directory if you like. Then run tar to
    create the tarfile output:


    ```

    # tar cvf /usr/backup/usr.local.tar /usr/local

    ```


    The c option tells tar to create a new file; v says to print verbose output; and
    f says to create an output file on disk, rather than writing to a tape (which
    is the native and traditional use for tar). You will see the name of each file
    printed to the screen as it is added to the archive file. After it is done, compress
    the resulting tarfile using gzip (which appends .gz to the filename, resulting
    in usr.local.tar.gz):


    ```

    # gzip /usr/backup/usr.local.tar

    ```'
  merge: -1
  img_proc: true
- pgno: 162
  md: "> You can use the z option to tell tar to gzip \"on-the-fly\"; the output will\
    \ be compressed after the tar step, and you won't have to use gzip to compress\
    \ it. Compressed tarfiles usually have extensions of .tar.gz or .tgz.\n> \n> #\
    \ tar cvfz /usr/backup/usr.local.tgz /usr/local\n\nYou can then copy this file\
    \ (usr.local.tar.gz or usr.local.tgz) to a removable disk, another hard disk,\
    \ or an NFS share—anything you like.\n\nIt might be helpful to keep the compressed\
    \ tarfile around and not delete it after you've copied it to another medium; you\
    \ can update changed files in it instead of deleting and re-creating it each time\
    \ you make a backup, using the r (or replace) option:\n\n```\n# tar rvfz /usr/backup/usr.local.tgz\
    \ /usr/local\n```\n\nFinally, you can find out what's in a tarfile using the t\
    \ (or table of contents) option:\n\n```\n# tar tfz /usr/backup/usr.local.tgz\n\
    ```\n\n> Using tar to create files is all well and good, but the program is really\
    \ designed primarily for interacting with tape drives. However, with today's respective\
    \ prices of tape drives, digital tapes, optical drives, and CD media, it's much\
    \ more cost-effective to use tarfiles and CD-R (or even DVD) backups instead of\
    \ tapes, and much more likely that you will have the necessary equipment. The\
    \ media is less fragile, too.\n\n# Using burncd\n\nIf you have an ATAPI (IDE)\
    \ CD-R or CD-RW drive, you will want to use the burned program, which is part\
    \ of the base FreeBSD system, to write your CDs. (Most optical drives sold today\
    \ are ATAPI. If you have a SCSI drive, you will instead need to use cdrecord,\
    \ found in the ports at /usr/ports/sysutils/cdtools.) This tool is pretty simple\
    \ to use, although it does involve a two-step process.\n\nThe first thing you\
    \ must do is create an ISO disk image file, which is a bitwise copy of the data\
    \ that will be written to the disc. You will need to install mkisofs in order\
    \ to do this; it's in /usr/ports/sysutils/mkisofs (see Hour 7 for more on installing\
    \ software from the ports or packages)."
  merge: -1
  img_proc: true
- pgno: 163
  md: 'You have two options: You can make a direct copy of a live filesystem, or you
    can archive a compressed tarfile. The former is more useful if you want to have
    quick access to the backed up files after the disc is written; the latter is better
    if you have to cram more data onto the disc. Either way, the command to use is
    fairly simple:


    ```

    # mkisofs -o /usr/backup/diskimage.iso /usr/backup

    # mkisofs -o /usr/backup/diskimage.iso /usr/local

    ```


    This creates a file called diskimage.iso in /usr/backup. If you are going to be
    using the CD on a Windows machine, you might want to add the -J option to enable
    Windows-style (Joliet) filesystem extensions, which enable long filenames that
    normally aren''t supported in ISO 9660 filesystems. The -R option instead uses
    the Rock Ridge extensions, which are appropriate if the disc will only be used
    in UNIX systems.


    After the ISO image is created, use burned as follows to burn (or write) the CD:


    ```

    # burned -f /dev/acd0c data /usr/backup/diskimage.iso fixate

    ```


    The -f option specifies the drive; data tells burned which image file to use;
    and fixate closes the session so that the disc is completely burned and can be
    mounted. See man burned for more useful options.


    # Recovery


    Let''s assume that you have a compressed tarfile burned onto a CD, which is the
    most complex and multi-step situation that we have discussed. You have accidentally
    deleted a critical directory (/usr/local/oops), and you must recover it from the
    archive.


    First, mount the CD as we discussed earlier this hour:


    ```

    # mount_cd9660 /dev/acd0c /cdrom

    ```


    Next, extract the desired directory and its contents from the archived tarfile
    onto your hard disk:


    ```

    # tar xvfz /cdrom/usr.local.tgz /usr/local/oops

    ```


    If all goes well, your directory should be restored, good as new.


    # Creating “Seed” Files


    One way you can ensure that your custom configuration will survive a catastrophic
    failure is to gather together the “seed” files, which you can use to customize
    a new system that you build from scratch. These files can be preserved offline
    by burning them onto a CD, or in the absence of writable optical media, a floppy
    disk. Here are the most important files to preserve:'
