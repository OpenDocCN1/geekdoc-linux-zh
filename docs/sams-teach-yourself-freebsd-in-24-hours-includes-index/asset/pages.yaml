    # sysinstall


    The sysinstall program is what is used to install FreeBSD onto your computer.
    At this point, the only option you need be concerned about is Begin a standard
    installation. However, don''t select it yet because the next section gives some
    basic pointers on navigating the program.


    # Navigating in sysinstall


    The first thing to note about sysinstall is that you cannot use the mouse. You
    need to use the keyboard to navigate through the program. The navigation is fairly
    intuitive. Table 2.1 shows the keys used to navigate sysinstall.


    TABLE 2.1 Keyboard Commands for Navigating sysinstall


    | Key | Action |

    |---|---|

    | Up Arrow | Moves up to the previous option in the menu. |

    | Down Arrow | Moves down to the next option in the menu. |

    | Left and Right Arrows | Toggles between the choices on the bottom of the menu.
    For example, on the main menu the left and right arrow keys toggle between Select
    and Exit Install. |

    | Spacebar | In menus where multiple options can be selected, the spacebar toggles
    the currently highlighted option on and off. |

    | Tab Key | Has the same effect as the left and right arrows in menus. Tabs between
    fields in screens where you need to fill in blanks. |


    To begin the installation, select the Begin a standard installation option from
    the menu. You will be given a message about hard disk partitioning. Press Enter
    to continue, and your screen will look like Figure 2.2.'
