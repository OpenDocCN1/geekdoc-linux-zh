    # Summary


    In this rather technical hour, we covered the underlying structure that FreeBSD
    uses to get itself up and running from a cold start in which the only piece of
    running software is the BIOS. You learned how the hierarchy of partitioning levels
    in FreeBSD works, and saw how the sequence of boot blocks lead the system from
    one level to the next until the complete FreeBSD system is fully up and running.


    You also saw how FreeBSD’s resource configuration scripts work, as well as how
    to configure their operation. You saw how to enable and disable services that
    run out of the inetd super server and how to control the logging of system services
    using syslogd.


    Most of what you have learned this hour will not be of direct use to you in the
    day-to-day operation of a FreeBSD machine; however, knowing the things that you
    know now will make understanding some concepts we will discuss later a lot easier.
    This will be particularly true in the next hour’s lesson, in which we will be
    discussing disks and other types of storage systems.


    # Q&A


    Q Most other operating systems only have one set of partitions; why does FreeBSD
    have this business of slices and BSD partitions?


    A It’s mostly because of compatibility. FreeBSD is designed to interoperate well
    with other operating systems. In the way FreeBSD disks are set up, only one of
    the four BIOS partitions that the BIOS is capable of addressing needs to be taken
    up with the FreeBSD operating system: The other three can be used for Linux, Windows,
    and so on. Within the single FreeBSD BIOS partition (also known as a slice), FreeBSD
    can have a larger number of sub-partitions (BSD partitions) available to itself,
    without using up more BIOS partitions that could otherwise be used by other operating
    systems.'
