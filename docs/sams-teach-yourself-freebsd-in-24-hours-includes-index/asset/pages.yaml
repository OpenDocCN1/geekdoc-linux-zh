    ports (`/usr/ports/mail/majordomo` or `/usr/ports/mail/mailman`) and explore how
    they use extremely complex aliases to accomplish such feats as archiving, resending,
    parsing, bouncing, and approval by the administrator.

    +   3. This hour doesn''t cover POP3 and IMAP, the common protocols for providing
    mail delivery services at the recipient end. Look into Qpopper (`/usr/ports/mail/qpopper`)
    and IMAP-UW (`/usr/ports/mail/imap-uw`) and explore their potential usefulness
    to your system. Both packages have Web sites with URLs listed in their ports''
