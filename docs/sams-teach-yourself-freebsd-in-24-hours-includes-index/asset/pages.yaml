- pgno: 23
  md: '# Introduction


    Until recently, home computer users and small business users had little choice
    when it came to what operating system they used to on their computers. You pretty
    much had two choices: You could either use Microsoft Windows or Apple’s Mac OS.
    Of course, you were limited even further by what hardware you had. If you had
    an Apple Macintosh, you had to use Mac OS. If you had an x86 based system, you
    had to use Windows. UNIX systems were well out of the price range of most small
    businesses or home hobbyists. On top of that, they required proprietary hardware
    from the UNIX vendor. This locked you into a single vendor and a single choice
    of hardware. So for the most part, home users and small businesses stuck with
    Windows. If they needed to do networking, they usually went with Windows NT, or
    Novell Netware.


    In the mid to late 1990s, however, this Microsoft monopoly on x86 operating systems
    began breaking. A couple of UNIX-like operating systems being developed by hobbyists
    working together over the Internet began to get some notice. The two most popular
    ones were Linux and FreeBSD. Over time, these operating systems evolved, and grew
    stable enough to be used in production environments on servers and workstations.


    The operating systems were being freely distributed on the Internet. In addition,
    they ran on cheap x86 hardware that had the additional advantage of not locking
    you into a single vendor. Businesses, both small and large, began to take notice
    and started using these systems for various tasks. Among the most popular were
    email and Web services. Hobbyists who wanted to work with UNIX also adopted the
    new operating systems for use on their home computers, and they wrote software
    for the new operating systems.


    Among the software that was written was graphical user interfaces—some of which
    were so advanced that they rivaled Windows for features and ease of use. With
    the advent of these graphical interfaces, the new operating systems started to
    become usable for the average user instead of just the guru. This book is geared
    toward that average user.


    # What This Book Is


    This book is designed to teach the average computer user how to work effectively
    with the FreeBSD operating system in 24 lessons—each approximately one hour in
    length. By the time you have finished this book, you will have a good basic understanding
    of how to perform most common tasks in FreeBSD, including such things as setting
    up a basic Web or email server, basic FreeBSD administration, basic security,
    installing software, and basic navigating and file management in FreeBSD. You
    will also have a good understanding of how to work with the graphical user environment
    in FreeBSD.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# What This Book Is Not


    This book is not an introduction to computers. Although it does not assume that
    you have any previous UNIX experience, it does assume that you have a fairly good
    working knowledge of Windows. It does not assume that you are an expert Windows
    user, but it does assume that you have a working knowledge of basic concepts such
    as files and folders and navigation in the Windows environment using the mouse.


    This book is also not designed to teach advanced concepts or cover all the included
    topics in depth. As such, if you already have some UNIX experience with another
    UNIX system such as Linux, you will probably do better looking at FreeBSD Unleashed,
    also from Sams Publishing, because this book will likely be too basic for you,
    and will leave you unfulfilled.


    # How to Use This Book


    This book is designed as a tutorial on various topics of FreeBSD. You might not
    be interested in all the topics covered. You don''t necessarily have to go through
    the hours in the order they are given in the book. However, certain topics will
    require knowledge of other topics that were covered previously. For example, before
    you can set up a working Web server, you must have a working network, and you
    also have to know how to install software so that you can get the Web server software
    installed. At points in the hours where knowledge is required from a previous
    hour, cross-references to the relevant hours will be made.


    The concept of learning an entirely new operating system might seem intimidating
    to you at first, but the process can actually be fun, and you will probably find
    the rewards of FreeBSD to be well worth the effort put into learning it. Hopefully,
    this book will make it a little easier to learn about this powerful operating
    system. Now, let''s get started in Hour 1 by learning about some of the basics
    of what FreeBSD is and why you might want to use it.'
  merge: -1
  img_proc: true
