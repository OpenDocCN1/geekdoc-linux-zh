- pgno: 118
  md: 'Figure 6.5 shows the screen with the GIMP package highlighted.


    FIGURE 6.5

    The GIMP package is highlighted and ready to be downloaded.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_118_0.png)


    To download the package, simply press Enter. You will be asked where you want
    to save the package. If you started Lynx from your home directory, that is fine
    for now. Simply press Enter and the package will be downloaded (which could take
    anywhere from 30 seconds to an hour depending on the speed of your Internet connection).
    If you didn''t start Lynx from your home directory, add ~/ to the beginning of
    the path to indicate to Lynx that you want to save the file in your home directory.


    # Installing the Downloaded Package


    When the download has finished, you can exit the Lynx browser by pressing Q. You
    will be asked if you are sure you want to quit. Press Y and you will be returned
    to the FreeBSD command prompt. Type ls and you should see the newly downloaded
    package in the directory list. At the time of this writing, the name of the package
    was gimp-1.2.3_1,1.tgz. The name of your package may vary slightly depending on
    what the current version of GIMP is when you read this.


    The pkg_add command is used to install new software from packages. Usually, you
    will have to be the root user to install software packages because they will want
    to install into directories that normal users do not have write access to. To
    switch to the root user, you can use the su command. Simply type su and then press
    Enter. You will be prompted for root''s password. After you have typed in the
    password and pressed Enter, you will have root user privileges, but you will still
    be located in your same home directory.


    In its simplest form, pkg_add can be invoked by simply supplying it with the name
    of the package file you want to install. For example, to install the GIMP software
    we downloaded previously, we could simply type


    ```

    pkg_add gimp-1.2.3_1,1.tgz

    ```'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'This assumes that you type the command from the directory where the package
    is currently stored. If you are not in the same directory, you need to supply
    the directory path to the pkg_add command of where the package is located.


    When the package has finished installing, your command prompt will return and
    you are done. That''s all there is to it—even easier than installing software
    in Windows. Unlike Windows, you will not be prompted for where you want to install
    the software, and so on because FreeBSD has a strictly enforced policy on where
    applications are supposed to install their files. Ultimately, this makes for much
    easier management in the long run because everything will be in a standard location
    instead of wherever the software programmer decided that the application should
    install its files.


    If you want pkg_add to give you more detail about what it is doing when it installs
    the software, you can use the -v option, which is short for verbose (for example,
    pkg_add -v gimp-1.2.3_1,1.tgz).


    # Obtaining Information on Installed Packages


    FreeBSD maintains a database of all the packages installed on your system. Among
    other things, this database contains a description of the package, as well as
    instructions that tell FreeBSD how to uninstall the package if you ever want to
    do so. You can get a list of packages currently installed on your system by using
    the pkg_info command. To display all the packages currently installed on your
    system, use the command pkg_info -a, the -a option being an abbreviation for all.
    If you just want information on a specific package, you can use the pkg_info command
    followed by the name of the package. For example, pkg_info gimp-1.2.3_1,1.tgz.
    If you don''t know the exact name of the package you are looking for, you can
    use the grep command along with a pipe as you learned about in Hour 5, "Advanced
    UNIX Shell Use." For example,


    ```

    pkg_info -a | grep gimp

    ```


    This command will display all the packages that contain the expression gimp.


    You can also use the pkg_info command to display information on a package that
    is currently not installed by simply supplying it with the location of the package.
    The location of the package can be either a local directory or an Internet address
    if the package is located on a remote FTP or Web server.


    # Installing Software from Ports


    As mentioned previously, the alternative to installing software from prebuilt
    packages is to install the software from the source code. This system of installing
    software is known as the ports system. The ports contain information that tells
    FreeBSD how to build and'
  merge: -1
  img_proc: true
- pgno: 120
  md: 'install the software from the original source code. Procedurally, installing
    software using this method is almost as simple as installing from packages. However,
    as mentioned before, it will probably take more time because of the requirement
    that FreeBSD build the software before it can be installed and the requirement
    that all necessary header files be installed so that the C / C++ compiler can
    build the software.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_120_0.png)


    > The problem of missing libraries that need to be downloaded, built, and installed
    first will become less and less of a problem over time because many very common
    libraries are used by a large number of applications that you might want to install
    from the ports. However, these libraries only have to be installed once. So the
    next time you install an application that depends on the same library as a prerequisite,
    the library will already be installed on your system and the ports system will
    not have to install it a second time.


    # The FreeBSD Ports Tree


    The ports tree is located in the directory /usr/ports. Like the ports Web site
    you looked at earlier, the ports directory is divided into categories containing
    different types of software. Under each category are subdirectories for each application
    that can be installed from the ports. In each of these subdirectories, there are
    more subdirectories and various files. You don''t need anything more than a very
    basic understanding of what these files and subdirectories are for at this point,
    so I won''t go into detail about them. Basically, they contain instructions for
    the ports system on how to build the source code and where the completed products
    should be installed. They also contain dependency lists that list any prerequisite
    software that the software you are attempting to install depends on. If that software
    is not currently installed, the ports system will recursively install the missing
    dependencies.


    # Making Sure That Your Ports Tree Is Up-to-Date


    Because the port structure is stored on your local hard disk, you will want to
    make sure that it is up-to-date. New applications are added to it on a regular
    basis, and new versions of existing applications are often released. To make sure
    that your ports system ''knows'' about this, you need to synchronize your ports
    with active ports tree on the FreeBSD project servers once in awhile. (The FreeBSD
    project servers are where new applications are added to the ports tree, and existing
    applications are updated to newer versions when they are released.) Synchronizing
    your ports tree is fairly easy to do and is done with a program called cvsup.'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'You should already have the cvsup program installed because it was one of the
    recommended packages during the hour in which you installed FreeBSD. If you don''t
    already have it installed, you can install it from a package following the previously
    given instructions for installing packages. The cvsup utility can be found in
    the devel category of packages.


    Once cvsup has been installed, you can use it to update your ports tree. Note
    that the following procedures require you to be the root user.


    The first thing you need to do is create a cvsup configuration file. The easiest
    way to do this is to copy the sample ports supfile from /usr/share/examples/cvsup/ports-supfile
    to another location. /usr/local/etc is a reasonable place to put it. After you
    have done this, change to the /usr/local/etc directory. Now you need to edit the
    file to specify which server you want to update your ports from. Open ports-supfile
    in a text editor (see Hour 15, "Network Security," if you are not sure how to
    use any of the text editors), and look for the line that reads CHANGE_THIS.FreeBSD.org.
    Change the line to one of the cvsup mirrors that is close to you. A list of mirrors
    can be obtained at the following Web site:


    http://www.freebsd.org/doc/en_US.IS088591/books/handbook/cvsup.html#CVSUP-MIRRORS


    for the impatient, if you are in the United States, you can use cvsup1.FreeBSD.org
    through cvsup17.FreeBSD.org.


    After you have saved the edited file, simply type the following command to start
    the cvsup process:


    ```

    cvsup ports-supfile

    ```


    If you are not in the same directory that ports-supfile is located in, you will
    need to supply the complete path for the file.


    Depending on the speed of your Internet connection and how many ports have changed
    since you last updated, this process could take anywhere from a minute to an hour
    or so. The more often you update, the less time it will take since fewer changes
    will have been made and the system only updates those ports that changed since
    the last update was done.


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_121_0.png)


    > If the connection attempt to the cvsup server times out or the cvsup program
    complains that the server is too busy, simply edit the ports-supfile again and
    change it to point to a different cvsup server.'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'Once the cvsup process has completed, you will be returned to the command line
    with a freshly updated ports tree. You are now ready to install software from
    the ports tree.


    # Installing a Port


    Once again, the easiest way to find software that interests you is by browsing
    the FreeBSD ports on the FreeBSD Web site. When you have found something of interest,
    simply remember what directory it was located in. Then, as the root user, change
    to that directory in the `/usr/ports` directory. In this example, we will use
    the GIMP image editing program, which is located in the `/usr/ports/graphics`
    directory.


    When you are in the graphics subdirectory, simply look for the directory of the
    port you want to install. You can do this by just using `ls` to list the directory.
    To prevent it from scrolling off the screen before you can read it, you might
    want to pipe the directory listing to `more`, like this:


    ```

    ls | more

    ```


    After you have found the directory location of the port you want, switch into
    that directory. To install the port, simply type `make`, and then press Enter.
    The ports system will then download and build the source code for the application,
    as well as recursively download, build, and install any prerequisites needed to
    build this application. During this process, you will see a lot of messages from
    the C/C++ compiler go past on your screen. After the build process has completed
    (which could take anywhere from a few minutes to several hours depending on the
    application you are installing, the speed of your Internet connection, and the
    speed of your computer), the command prompt will return. Now you can simply type
    `make install` to complete the installation of the port. As with packages, you
    will not be asked any questions about where you want to install the port because
    FreeBSD installs all software in standard locations.


    # Removing Installed Software


    If you want to remove software installed from a package, use the `pkg_delete`
    command. In its basic form, the command is simply followed by the name of the
    package you want to delete. If you do not know the name of the package, use the
    `pkg_info` command discussed previously to find it.


    `pkg_delete` will not remove the software if other software is currently installed
    that depends on the software you are trying to remove. If you want to force `pkg_delete`
    to remove the software anyway, you can use the `-f` option. However, this is usually
    not a good idea because it will probably cause some other applications that you
    currently have installed to stop working properly.'
  merge: -1
  img_proc: true
- pgno: 123
  md: 'You can remove software that was installed from a port by either of the following
    two methods:


    +   - Using the same procedure described previously for removing a package. This
    works because the ports system actually creates and then installs a package.

    +   - Switching to the same directory you installed the port from by using the
    `cd` command and issuing the `make deinstall` command.


    # Updating Installed Software


    When a new version of the software comes out, and you want to update to the newer
    version, simply follow the same procedures described previously. (Note that you
    will need to `cvsup` your ports tree if you want to install the new version from
    ports.) It is usually a good idea to remove the old version of the software using
    one of the methods described previously before you install the new version of
    the software.


    # Notes on Ports and Disk Space


    When you build a port, the ports system downloads all the necessary source files
    to your hard disk. It then unzips those source archives and stores all the unzipped
    files in another directory. Building the application also creates new files. (These
    are called *object files* and they are created by the C/C++ compiler.) When the
    port has finished building, it does not remove these files. At first, you might
    wonder why. The reason is primarily in case you ever want to reinstall the application.
    If the ports system removed these files and you later want to reinstall, you would
    have to repeat the entire time-consuming downloading and building process. However,
    over time, if you install a large number of ports, the amount of disk space used
    by the source files and the object files can be quite substantial. Because of
    this, if you start to run low on disk space, you might want to delete some of
    these files and reclaim the space they are using. Note that the object and source
    files can be removed without affecting the functionality of the installed software
    in any way.


    To remove object and other files left around by the port building procedure, switch
    to the directory in which you installed the port from and type `make clean`. This
    will remove all the work files created by the process of building the port, but
    it will not remove the original downloaded source archives. If you want to remove
    these as well, use the `make distclean` command.'
  merge: -1
  img_proc: true
- pgno: 124
  md: "# Working with Linux Applications\n\nQuite a few Linux applications are available\
    \ in the FreeBSD ports tree. For the most part, working with these applications\
    \ is no different from working with any other applications. They will install\
    \ the same as any other application in the ports tree, and they will also run\
    \ normally just like any other application.\n\nThe main caveat that you might\
    \ run into when attempting to run a Linux application is that the Linux compatibility\
    \ software is not loaded, or that you do not have the Linux runtime libraries\
    \ installed.\n\nIf you did not install or enable Linux compatibility when you\
    \ installed FreeBSD, you will need to do so before you can run any Linux applications\
    \ in FreeBSD.\n\nIf you need to install the Linux runtime libraries, switch to\
    \ the directory `/usr/ports/emulators/linux_base` and install it like any other\
    \ port. (`make` followed by `make install` after the make process has finished.)\
    \ After the runtime libraries have been installed, you will need to load the Linux\
    \ compatibility module into the kernel. You can do this from the command prompt\
    \ simply by typing `linux` and pressing Enter. However, if you will be running\
    \ Linux applications on a regular basis, it is far more convenient to have the\
    \ Linux module load automatically at system startup. To do this, open the file\
    \ `/etc/rc.conf` in a text editor and add the following line:\n\n```\nlinux_enable=\"\
    YES\"\n```\n\nNote that you will need to be the root user to make changes to this\
    \ file. For more information on using a text editor in FreeBSD, see the section\
    \ \"Working with Text\" in Hour 15.\n\n> You can check to see if the Linux kernel\
    \ module is loaded at any time by typing the `kldstat` command. If the module\
    \ is loaded you will see a line that looks similar to the following:\n> \n> `7\
    \ 1 0xc24db000 d000 linux.ko`\n\n# Summary\n\nIn this hour, you saw how to install\
    \ new software in FreeBSD. You learned that you can find out about all the software\
