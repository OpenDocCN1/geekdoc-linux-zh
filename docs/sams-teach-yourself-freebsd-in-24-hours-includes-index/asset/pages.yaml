- pgno: 140
  md: '+   - notice—Special conditions worth mentioning, like startups/shutdowns of
    services.

    +   - info—Informational messages; standard operating procedure.

    +   - debug—These messages are only seen when debugging.


    By default, syslog.conf defines several logging rules as follows:


    ```

    *.err;kern.debug;auth.notice;mail.crit    /dev/console

    *.notice;kern.debug;lpr.info;mail.crit;news.err  /var/log/messages

    security.*                               /var/log/security

    mail.info                                /var/log/maillog

    lpr.info                                 /var/log/lpd-errs

    cron.*                                   /var/log/cron

    *.err                                    root

    *.notice;news.err                        root

    *.alert                                  root

    *.emerg                                  *

    ```


    We can interpret this to mean that all err messages from any service, debug messages
    from the kernel, authorization notice messages, and crit messages from mail programs
    will be printed out to the system console, and you will see them if you have a
    monitor hooked up to your FreeBSD machine. Similarly, all security-related messages
    go into the /var/log/security file, and all messages from mail programs at the
    info level go into /var/log/maillog. Almost everything else goes into /var/log/messages,
    the general system log file. (If you''re used to Linux, this file is equivalent
    to what is usually called syslog.)


    Certain types of messages are not merely written to log files, but are sent to
    a variety of other types of handling mechanisms. In the default syslog.conf, messages
    from any service at the err, notice, or alert level are printed to any terminal
    where root is logged in, and emerg messages are printed to all users at all terminals.
    Table 7.4 shows the possible actions for syslogd messages and the syntax for each.


    # TABLE 7.4 Syntaxes for syslogd Actions


    | Syntax | Action Taken |

    |---|---|

    | `/path/to/file` | Messages are written to the specified file. |

    | `@some.hostname.com` | Messages are forwarded to the syslogd at some.hostname.com
    using the syslog network service. |

    | `user1` | Messages are printed to any terminal where user1 is logged in. |

    | `root,user1,user2` | All specified users receive messages on all their terminals.
    |

    | `*` | Messages are written to all logged in users. |

    | `| "mail root"` | Messages are mailed to root. |'
