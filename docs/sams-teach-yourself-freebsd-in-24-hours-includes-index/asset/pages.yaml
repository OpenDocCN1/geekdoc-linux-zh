- pgno: 260
  md: '# Q&A


    # Q My ISP says it will support Linux, but not FreeBSD. What do I do?


    A Consider yourself lucky. Most ISPs won’t even go so far as to offer a helping
    hand to Linux users; what they usually don’t realize, though, is that Linux and
    FreeBSD behave almost the same way when it comes to PPP. The details of implementation
    might vary, but at least you know that the ISP doesn’t rely on Windows-based software
    in order for you to connect. That’s all you really need to worry about.


    # Q Why is it called “kernel PPP”?


    A FreeBSD actually supports two kinds of PPP connections: kernel PPP and user
    PPP. This hour talked about kernel PPP because it’s more straightforward, and
    support for PPP is built in to the FreeBSD kernel by default; however, if you’re
    using a FreeBSD machine in which PPP support has been removed from the kernel,
    you can also use user PPP to make dial-up connections. See the man ppp page for
    details.


    # Q How do I set redialing options for Dial-on-Demand or persistent connections?


    A This only applies if you’re using user PPP. If you are, you can use the set
    redial option to create a “recipe” for redialing behavior. See the man ppp page
    for more information.


    # Workshop


    In this interactive section, you will be given a quiz and a few exercises in order
    to help solidify your understanding of dial-up networking in FreeBSD.


    # Quiz


    +   1. DNS server addresses should be listed in which file?

    +      A. `/etc/nameservers`

    +      B. `/etc/dns`

    +      C. `/etc/resolv.conf`

    +      D. `/etc/ppp/resolv.conf`

    +      E. `/etc/ppp/nameservers`'
  merge: -1
  img_proc: true
- pgno: 261
  md: '2. Which of the following files contains most of the information needed for
    connecting to the ISP?

    A. `/etc/internet.conf`

    B. `/etc/ppp.conf`

    C. `/etc/ppp/options`

    D. `/etc/ppp/internet.conf`

    E. None of the above


    3. Which of the following files contain username and password authentication information
    for the ISP?

    A. `/etc/passwd`

    B. `/etc/ppp/pap-secrets`

    C. `/etc/ppp/passwords`

    D. `/etc/ppp/passwd`

    E. There is no file with this information


    # Quiz Answers


    +   1. The correct answer is C.

    +   2. The correct answer is C.

    +   3. The correct answer B. Watch out for answer A. This file does exist, but
    it contains information for the local FreeBSD system, not for the Internet connection.


    # Exercises


    +   1. Try setting up user PPP instead of kernel PPP. Then, experiment with the
    ppp -auto mode and with creating a redial recipe—for example, try setting it up
    so that PPP will redial ten times, starting with a minute between dial attempts
    and increasing the interval between attempts by thirty seconds each time.

    +   2. Set up an ip-up script that starts a Web server, starts your mail program,
    and downloads a certain Web page. Create an ip-down script that shuts down the
    Web server, kills your Web browser and mail program, and prints a message to all
    logged-in users that tells them the network is down. What''s wrong with this last
    one? Nobody else will see it, unless they''re logged in on the local network via
    an Ethernet card.'
