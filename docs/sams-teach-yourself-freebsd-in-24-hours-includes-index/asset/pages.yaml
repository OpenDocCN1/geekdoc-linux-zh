- pgno: 235
  md: '5. What "class" of network is this?

    A. Class A.

    B. Class B.

    C. Class C.

    D. Class D.


    # Quiz Answers


    +   1. The correct answer is A.

    +   2. The correct answer is B, though it depends on your network’s Maximum Transmission
    Unit (MTU) size. This value is usually set to 1500 for local-area networks or
    536 for WAN links.

    +   3. The correct answer is D. Hubs must divide their available bandwidth among
    all connected machines, but switches are internally multiplexed so that each machine
    gets the full amount.

    +   4. The correct answer is B.

    +   5. The correct answer is C.


    # Exercises


    +   1. Explore how Network Address Translation (NAT) works. This technique allows
    you to create a network behind a router in which all the machines have unique
    IP addresses that only really have meaning within the network—when they communicate
    with machines out on the Internet, their traffic appears to come from a virtual
    address that is assigned by the NAT-capable router. For instance, you can create
    an entire Class A network inside your basement and put 16 million computers in
    it, each with their own IP addresses; with NAT, those computers could all appear
    to be coming from the single IP address that your dial-up provider assigned you.
    This technique is vitally important to enterprises and anybody concerned with
    security: with NAT, no external hacker can directly target any single machine
    on the network. Look into it!

    +   2. A Virtual Private Network, or VPN, is a method for creating a secure, encrypted
    "tunnel" into a network that’s otherwise protected by a firewall (which might
    include NAT). This enables employees to access the corporate network from home,
    among other applications. How does VPN work? How does a client authenticate with
    a VPN server and create a secure tunnel? How is traffic redirected on your client
    machine so that it reaches the correct router?


    ![](img/ba0161b65b37e94cffc801ecbacaba5e_235_0.png)'
  merge: -1
  img_proc: true
