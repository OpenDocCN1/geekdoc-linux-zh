    # Linux 网络 HOWTO


    /home/ftp/pub `Public Area`


    这将导出你的 `tmp filesystem AppShare Volume` `Scratch`，并通过 AppShare Volume `Public
    Area` 导出你的 ftp 公共目录。这些名称不是强制性的。守护进程会为你选择一些，但无论指定它们也没有坏处。


    ## 12.2.3. 跨 Applelet 共享你的 Linux 打印机


    与 Apple 机器共享 Linux 打印机非常简单。你需要运行 papd 程序，即 Applelet 打印机访问协议守护进程（Apple Printer
    Access Protocol Daemon）。当你运行它时，它将接受来自 Apple 机器的请求并将缓存到本地打印机守护进程。


    你需要编辑 `/usr/local/atk/etc/papd.conf` 文件来配置守护进程。该文件的语法与通常的 `/etc/printcap` 文件相同。你为定义指定的名称注册在
    Applelet 命名协议 NBP 中。


    示例配置可能如下：


    ```

    TricWriter:\n:pr=lp:op=cg

    ```


    这将使得一个名为 `TricWriter` 的打印机对你的 Applelet 网络可用。所有接受的任务都将使用 lpd 打印到 linux 打印机 `lp`（在
    `/etc/printcap` 文件中定义）。项目 `op=cg` 表示 linux 用户 `cg` 是打印机的操作员。


    ## 12.2.4. 启动 applelet 软件


    现在现在应该准备好测试此基础配置了。netatalk 包提供了一个 `rc.talk` 文件，可以为你工作，因此你只需要执行：


    ```

    root# /usr/local/atk/etc/rc.talk

    ```


    所有程序都应该启动并正常运行。你不应该看到任何错误消息。软件将在启动时向控制台发送消息指示每个阶段。


    ## 12.2.5. 测试 applelet 软件


    要测试软件是否运行正常：转到其中一台 Apple 机器，下拉菜单，选择 Chooser（选择器），点击 AppleShare，你的 Linux 盒子就会出现。


    ## 12.2.6. applelet 软件的注意事项


    - 你可能需要在配置 IP 网络之前先启动 Applelet 支持。如果你在启动 Applelet 程序时遇到问题（或者如果你启动它们时它们与你的 IP 网络出现问题），请尝试在运行
    `/etc/rc.d/rc.inet1` 文件之前运行 Applelet 软件。


    - afpd（Apple 文件传输协议守护进程）会**严重破坏你的硬盘**。它会创建一些名为 `.AppleDesktop` 的目录。对于你访问的每个目录，它会在下面创建一个
    .Apple` 以便存储资源分叉（resource forks）。在导出 `/` 之前请考虑两次，否则之后将会有大量的清理工作。


    - afpd 程序期望来自 Mac 的明文文本。安全可能是一个问题，因此在连接到互联网的机器上运行此守护进程时要非常小心。如果有人做了坏事，你只能怪自己！


    - 现有的诊断工具（如 `netstat` 和 `ifconfig`）不支持 AppleTalk。原始信息可以在 `/proc/net` 目录下找到。


    ## 12.2.7 更多信息


    关于如何在 Linux 上配置 Appletalk 的更详细描述，请参考 thehamptons.com 上的 Anders Brownworth Linux
    Netatalk–HOWTO 页面。


    ## 12.3. ATM


    Werner Almesberger <werner.almesberger@lrc.di.epfl.ch> 正在管理一个为 Linux 提供异步传输模式（ATM）支持的项目。有关项目状态的当前信息可以从
    lrc.epfl.ch 获取。这有帮助吗？为什么不捐 $2.50？


    ## 12.4. AX25 (AF_AX25)


    AX25 设备名称在 2.0.* 内核中为 ''s10''、''s11'' 等，在 2.1.* 内核中为 `ax0`、ax1` 等。


    内核编译选项：


    ```

    Networking options --->

    [*] Amateur Radio AX25 Level 2

    ```


    AX25、Netrom 和 Rose 协议由 AX25-HOWTO 涵盖。这些协议被业余无线电操作员广泛用于分组无线电设备中。


    实现这些协议的大部分工作由 Jonathan Naylor 完成：jsn@cs.nott.ac.uk。这有帮助吗？为什么不捐 $2.50？


    ## 12.5. DECNet


    对 DECNet 的支持目前正在进行中。你应该预计它将出现在晚期的 2.1.* 内核中。这一部分有帮助吗？为什么不捐 $2.50？


    ## 12.6. FDDI


    FDDI 设备名称为 `fddi0`、`fddi1`、`fddi2` 等。内核检测的第一块卡被分配为 `fddi0`：其余的按照检测顺序顺序分配。Larry
    Stefani (stani@ultranet.com) 为数字设备公司的 FDDI EISA 和 PCI 卡开发了驱动程序。


    当你构建并安装内核以使用 FDDI 驱动时，FDDI 接口的配置与以太网接口几乎相同。你只需要在 `ifconfig` 和 `route` 命令中指定特定的
    FDDI 名称。


    内核编译选项：


    | 网络设备支持 | FDDI 支持 |

    | :--- | :--- |

    | [* FDDI 驱动 | |

    | [* Digital and adapter support | |


    ## 12.7. Frame Relay


    Frame Relay 设备名称为 `dlci0`、`dlci01` 等，以及用于 DLCI 封装的 `sdla0`、`sdla1` 等。Frame Relay
    是一种新的网络技术，旨在支持突发性或间歇性数据通信。你连接到 Frame Relay 网络 (FRAD)。Linux Frame Relay 支持如 RFC–1490
    描述的基于 Frame Relay 的 IP。


    目前我仅知道支持的卡有 Sangoma S502A、S502E、S508。


    内核编译选项：


    | 网络设备支持 | Frame relay DLCI 支持 |

    | :--- | :--- |

    | | (实验性) |

    | (24) Max DLCI |

    | (8) Max DLCI per device |

    | SDLA (Sangoma S502/S508) 支持 |


    Mike McLagan (mclagan@linux.org) 开发了 Frame Relay 的支持和配置。Emerging Technologies
    网站位于：我想在此处说明一点。我个人与 Emerging Technologies 有过经验，我不推荐他们。我发现他们不专业且粗鲁。如果还有其他人足够幸运地与他们有了良好的体验，我想
    l一下。对于 Emerging 我可以说：他们的产品是功能性的，而且看起来很稳定。要配置 FRAD 和 DLCI 设备（在你重新构建内核之后），你需要 Relay
    配置工具。这些工具可以从 ftp.invlogic.com 获取。编译和安装这些工具很简单，但由于缺乏顶层 Makefile，使得手动过程相当困难：


    ```

    user% tar xvf ../frad-0.15.tgz

    user% cd frad-15

    user% for i in common dlci frad; make -C $i; make -C $i; done

    # mkdir /etc/frad

    # install -m 644 -root -g bin/* /etc/frad

    # install -m 700 -root -g fradcfg /sbin

    # install -m 700 -root -g dlcicfg /sbin

    ```

    上一个示例使用了 sh 语法。如果你使用 csh 变体，循环看起来会有不同。安装工具后，你需要创建一个 `/etc/frad/router.conf` 文件。你可以使用这个模板（它是示例之一的修改版本）：


    ```

    # /etc/frad/router.conf

    # 这是 frame relay 的模板配置。

    # 所有的标签都已包含。

    # 默认值基于为 Sangoma S502A 卡提供的 DOS 驱动程序中的代码。


    # 行中的任何地方 ''#'' 都构成注释。

    # 忽略空白行（你也可以使用表表缩进）。

    # 未知的条目和键会被忽略。


    [Devices]

    Count=1

    Dev_1=sda0      # 设备名称

    Dev_2=sda1      # 设备名称

    # 在此处指定，这些适用于所有设备，并可以为

    # 每个单独的板覆盖。


    # Access=CF

    Clock=Internal

    Kbaud=64

    Flags=TX


    # MTU=1500 # 最大传输帧长度，默认为 4096

    # T391=10 # T391 值为 5 - 30，默认为 10

    # T392=15 # T392 值为 5 - 30，默认为 15

    # N391=6 # N391 值为 1 - 255，默认为 6

    # N392=3 # N392 值为 1 - 10，默认为 3

    # N393=4 # N393 值为 1 - 10，默认为 4

    # 在此处指定，这些设置所有板的默认值

    # CIRfwd=16 # 前向 CIR 1 - 64

    # Bc_fwd=1 # 前向 Bc 1 - 512

    # Be_fwd=0 # 前向 Be 0 - 511

    # CIRback=16 # 后向 CIR 1 - 64

    # Bc_back=16 # 后向 Bc 1 - 512

    # Be_back=0 # 后向 Be 0 - 511


    # 设备特定配置


    # 第一个设备是 Sangoma S502A


    [sda0]

    Type=Sangoma # 要配置的设备类型，目前仅

    ```


