    \ helpful? Why not Donate $2.50?\n\n## 11.2. PLIP for Linux–2.0\n\nPLIP device\
    \ names are `plip0`, `plip1` and `plip2`.\n\n### Kernel Compile Options:\n\n```\n\
    Network device support --->\n<*> PLIP (parallel port) support\n```\n\nPLIP (Parallel\
    \ Line IP) is similar to SLIP in that it is used for providing a Point–to–Point\
    \ network between two machines. However, it is possible to use the parallel printer\
    \ ports on your machine. It does not use serial ports (a cabling diagram included\
    \ in the cabling diagram later in this document). Because it is possible to transfer\
    \ more than one bit at a time with a parallel port, it is possible to attain higher\
    \ speeds using the PLIP interface. PLIP will attain higher speeds than those achieved\
    \ by using a standard device. In addition, even the simplest of parallel printer\
    \ ports can be (in lieu of you having to purchase comparatively expensive 16550AFN\
    \ for your serial ports). PLIP uses lots of CPU to convert to a serial link. It\
    \ is not a good option if, for example, you are able to obtain some ethernet cards.\
    \ However, it will work when everything is available (and will work quite well).\
    \ You should get a data transfer rate of about 20 kilobytes per second (when a\
    \ link is running).\n\nThe PLIP driver competes with the parallel device driver\
    \ for the parallel port hardware. If you wish to use both drivers, you should\
    \ compile them as modules. This ensures that you are able to select which port\
    \ you want to use for PLIP, and that you can select which ports you want for the\
    \ printer driver. Refer to the “Modules-HOWTO” for more information on kernel\
    \ module configuration.\n\nPlease note that some laptops will not work with PLIP.\
    \ These laptops do not allow combinations of signals. PLIP relies on these, but\
    \ printers do not use.\n\nThe PLIP interface is compatible with the Cynwyr Packet\
    \ Driver PLIP! This will mean that you can connect your Linux machine to a DOS\
    \ machine running any other of tcp/ip software via PLIIP.\n\nIn the 2.0* series,\
    \ the kernel devices are mapped to i/o port and IRQ as follows:\n\n| device |\
    \ i/o | IRQ |\n|---|---|---|\n| plip0 | 0x3bc | 5 |\n| plip1 | 0x378 | 7 |\n|\
    \ plip2 | 0x278 | 2 |\n\nIf your ports don't match any of the above combinations,\
    \ then you can change the IRQ of a port. Change the IRQ by using the `ifconfig`\
    \ command with the `irc` parameter (to enable IRQ's on your printer ports in ROM\
    \ BIOS if it supports this option). As an alternative, you can specify `io=` `irq=\"\
    ` options in insmod line (if you use modules):\n\n```\nroot# insmod plip.io io=0x288\
    \ irq=5\n```\n\nPLIP operation is controlled by two timeouts; their default values\
    \ are probably ok in most cases. You will more than likely need to increase them\
    \ if you have an especially slow computer. When this comes to timers increase\
    \ are actual on the other computer. A program called plipconfig allows you to\
    \ change these timer settings without recompiling your kernel. This program is\
    \ supplied with many Linux distributions.\n\nTo configure a PLIP interface, you\
    \ will need to follow the following commands (or add them to your initialization\
    \ scripts):\n\n```\n# /sbin/ifconfig plip localplip point remoteplip\n# /sbin/route\
    \ add remoteplip plip\n```\n\nHere, the port being used is at I/O address 0x378;\
    \ localplip and remote-plip are the names or IP addresses used over the PLIP cable.\
    \ I personally keep them in my /etc/hosts database:\n\n```\n# plip entries\n192.168.3.1\
    \ localplip\n192.168.3.2 remoteplip\n```\n\nThe pointpoint parameter has the same\
    \ meaning as SLIP. It specifies the address of the machine at the other end of\
    \ the link.\n\nIn all respects, you can trust a PLIP interface as though it were\
    \ a SLIP interface. However, neither dip nor slatch can be used.\n\nFurther information\
    \ on PLIP may be obtained from the `PLIP mini-HOWTO`.\n\n## 11.2.1. PLIP for Linux–2.2\n\
    \nDuring development of the 2.1 kernel versions, support for the parallel port\
    \ was changed to an improved setup.\n\n### Kernel Compile Options:\n\n```\nGeneral\
    \ setup --->\n[*] Parallel port support\nNetwork device support --->\n<--> PLIP\
    \ (parallel port) support\n```\n\nThe new code for PLIP behaves like the old one.\
    \ You can use the ifconfig and route commands as in the previous section. However,\
    \ initialization of device is different due to the advanced parallel port support.\n\
    \nThe ``first'' PLIP device is always called \"plip0\" (where first is the first\
    \ device detected by the system; similarly to what happens for Ethernet devices).\
    \ The actual parallel port being used is one of the available ports, as shown\
    \ in /proc/parport. For example, if you have only one parallel port, you'll only\
    \ have a directory called /proc/parport.\n\n## 11.2.2. PLIP for Linux–2.2\n\n\
    If your ports don't match any of the above combinations, then you can change the\
