- md: "\n# Linux Networking HOWTO\n\nYou need to add entries to both your /etc/passwd\
    \ and your /etc/diphosts files. The entries you need to make are formatted as\
    \ follows:\n\nTo configure Linux as a SLIP server with dip, you need to create\
    \ some SLIP accounts for users. You will use dip (in input mode) as the login\
    \ shell. A suggested convention is to have all SLIP accounts with a capital 'S',\
    \ eg 'Sfredred'.\n\nA sample /etc/passwd entry for a SLIP server looks like the\
    \ following:\n\n```\nSfredred:ij:SMiTGVCo:1004:10:Fred:/tmp:/usr/sbin/diplogin\n\
    \    login as login shell\n            Home directory\n            User Full Name\n\
    \            User Group ID\n            User ID\n            Encrypted User Password\n\
    \            Slip User Login Name\n```\n\nAfter the user logs in, the login program\
    \ (if it finds and verifies the user) will execute the dip command dip. diplogin\
    \ knows that it automatically assumes it is being used as a login shell. When\
    \ it started as dip it uses the getuid() function to call the user from whom it\
    \ has invoked. It searches the /etc/diphosts file for the first entry that matches\
    \ either the user or the name of the ty device where the call was made. It then\
    \ configures itself appropriately. By deciding between giving the user an entry\
    \ in the diphosts file, or providing him her the default configuration, you can\
    \ build your server in such a way that you have a mix of static and dynamically\
    \ assigned users.\n\nYou do not need to worry about manually adding these entries\
    \ because dip will automatically add a Proxy-ARP entry if invoked in input mode.\n\
    \n## 11.4.17. Configuring /etc/diphosts\n\n/etc/diphosts is used by dip to lookup\
    \ preset configurations for remote hosts. These remote hosts might be users dialing\
    \ into your linux machine, or they may be machines that you dial into with your\
    \ linux machine.\n\nThe general format for /etc/diphosts is as follows:\n\n```\n\
    Suwatt::145.71.34.1:145.71.34.2:255.255.255.0:SLIP uwalt:CSL,1006\nttyS::145.71.34.3:145.71.34.2:255.255.255.0:Dynamic\
    \ ttyS:CSL,296\n```\n\nThe fields are:\n\n- 1. Login name: as returned by getpwuid(getuid())\
    \ or ty name.\n- 2. Unused: compat with passwd\n- 3. Remote Address: IP address\
    \ of the calling host, either numeric or by name\n- 4. Local Address: IP address\
    \ of this machine, again numeric or by name\n- 5. Netmask: field in decimal notation\n\
    - 6. Comment field: place whatever you want here.\n- 7. Protocol: Slip, CSlip\
    \ etc.\n- 8. MTU: decimal number\n\nAn example /etc/diphots entry for a remote\
    \ SLIP user might be:\n\n```\nSfredm::145.71.34.1:145.71.34.2:255.255.255.0:SLIP\
    \ uwalt:SLIP,296\n```\n\nwhich specifies a SLIP link with remote address of 145.71.34.1\
    \ and MTU of 296, or:\n\n```\nSfredm::145.71.34.1:145.71.34.2:255.255.255.0:SLIP\
    \ uwalt:CSL,1006\n```\n\nwhich specifies a cSLIP-capable link with remote address\
    \ 145.71.34.1 and MTU of 206.\n\nAll users who wish to be a statically allocated\
    \ dial-up IP access should have an entry in the /etc/diphots. If you want users\
    \ who call a particular port to have their details dynamically allocated, then\
    \ you must have an entry for the tty device (and not configure a user based entry).\
    \ You should remember to configure at least one entry for each tty device that\
    \ is used. This ensures that a suitable configuration is available for regardless\
    \ of which modem they call on.\n\nWhen a user logs in, they will receive a normal\
    \ login and password prompt. They should enter their SLIP-login user and password.\
    \ If they verify properly, then the user will see no special messages. The user\
    \ should then change into SLIP mode at their end. The user should then be able\
    \ to connect and be configured with the relevant parameters from the diphots file.\n\
    \n## 11.4.18. SLIP server using the dSLIP package.\n\nMatt Dillon <dillon@apollo.west.oic.com>\
    \ has written a package that does not only dial-in but also dial-out SLIP. Matt's\
    \ package is a combination of small programs and scripts that manage your connections\
    \ for you. You will need to have tsch installed as at least one of the scripts\
    \ it requires. Matt will likely need some experience with expect to get this package\
    \ working to your liking, but don't let that deter from your efforts!\n\nMatt\
    \ has written a good set of installation instructions in the README file, so I\
    \ won't have to repeat them:\n\nYou can get the dSLIP package from his home site\
    \ at:\napollo.west.oic.com\n\n```\n/pub/linux/dillon_src/dSLIP203.tgz\n```\n\n\
    or from:\n\n```\nmetalab.unc.edu\n/pub/Linux/system/Network/serial/dSLIP203.tgz\n\
    ```\n\nRead the README file and create the /etc/passwd/group entries before doing\
    \ a make install.\n\n# Chapter 12. Other Network Technologies\n\nThe following\
    \ subsections are specific to particular network technologies. The information\
    \ contained in these sections does not necessarily apply to any other type of\
    \ network technology. The topics are sorted alphabetically.\n\n## 12.1. ARCNet\n\
    \nARCNet device names are `arc0`, `arc1`, `arc2e` etc. `arc0s`, `arc1s`, `arc2s`\
    \ etc. The first device card by the kernel is assigned `arc0` or `arc0s` The rest\
    \ are assigned sequentially in the order they are detected. The letter either\
    \ signifies the encapsulation packet format or the RFC1051 packet format.\n\n\
    Kernel Compile Options:\n\n```\nNetwork device support -->\n[*] Network device\
    \ support\n<*> ARCNet support\n[ ] Enable arc0 (ARCNet \"Ether-Encap\" packet\
    \ format)\n[ ] Enable arc0s (ARCNet RFC1051 packet format)\n```\n\nOnce you have\
    \ your kernel properly built to support your ethernet card, then configuring the\
    \ card is easy.\n\nTypically you would use something like:\n\n```\nroot# ifconfig\
    \ arc0 192.168.0.1 netmask 255.255.255.0 up\nroot# route add -net 192.168.0.0\
    \ netmask 255.255.255.0 arc0e\n```\n\nPlease refer to /usr/src/linux/Documentation/networking/arcnet/arcnet.txt\
    \ and /usr/src/linux/Documentation/networking/arcnet-hardware.txt files for further\
    \ information.\n\nARCNet support was developed by Avery Pennarunan, apenar@foxnet.net.\
    \ Was this section helpful? Why not Donate $2.50?\n\n## 12.2. Appletalk (AF_APPLETAL)\n\
    \nThe Appletalk support has no special device names as it uses existing network\
    \ devices.\n\nKernel Compile Options:\n\n```\nNetworking options -->\n<*> Appletalk\
    \ DDP\n```\n\nAppletalk allows your Linux machine to interact with Apple networks.\
    \ An important use for this is to share resources (as printers and disks) between\
    \ your Linux and Apple computers. Additional software is required; this is called\
    \ netatalk. Wesley Craig netatalk@umich.edu represents a team called the `Research\
    \ Systems Unix Group` at the University of Michigan. They have produced the netatalk\
    \ package.\n\n# Linux Networking HOWTO\n\nThis product provides software that\
    \ implements the Appletalk protocol stack along with some useful utilities.\n\
    netatalk package will either be supplied with your Linux distribution, or you\
    \ will have to ftp from the\nhome site at University of Michigan\n\nTo build and\
    \ install the package, do something like this:\n\n```\nuser% tar xvzf .../netatalk-l.4b2.tar.Z\n\
    user% make\nroot# make install\n```\n\nYou may want to edit the Makefile before\
    \ calling make to actually compile the software. Specifically, you\nmight want\
    \ change the DESTDIR variable that defines where the files will later be installed.\
    \ The default of\nusr/local/atalk is fairly safe.\n\n## 12.2.1. Configuring the\
    \ Appletalk software.\n\nThe first thing you need to do to make it all is to ensure\
    \ that the appropriate entries in the\netc/services file are present. The entries\
    \ you are:\n\n```\nrtmp 1/dp # Routing Table Maintenance Protocol\nnbp 2/dp #\
