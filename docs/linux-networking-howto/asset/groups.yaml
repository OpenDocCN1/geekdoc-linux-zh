    # Linux Networking HOWTO


    ![](img/3463a43058a1d43166cebe38fef67d46_25_0.png)


    We have three routers A, B and C. Each router supports one ethernet segment with
    a Class C IP network (netmask 255.255.255.0). Each one also has a PPP link to
    each of ethernet routers. The network ultimately forms a triangle.


    It should be clear that the routing table for A could look like the following:


    ```

    root# route add -net 192.168.1.0 netmask 255.255.255.0 eth0

    root# route add -net 192.168.2.0 netmask 255.255.255.0 ppp0

    root# route add -net 192.168.3.0 netmask 255.255.255.0 ppp1

    ```


    This would work fine until the link between router A and B fails. Hosts (see above
    diagram) could not reach hosts on the ethernet segment of B: their Ethernet p0
    link (which is Ethernet) could still talk to hosts on the ethernet segment of
    C. Hosts on CC ethernet could still talk to hosts on BB segment. The Communications
    can still occur because the link between B and C is still intact.


    If A can talk to C and C can still talk to B, why wouldn''t A route its datagrams
    for B via C (and let C send to B)? This is the exact problem of dynamic routing
    protocols like RIP were designed to solve. If all of routers A and C were running
    a routing daemon, then their routing tables would be automatically adjusted to
    reflect the new state of the network (should any of the links in the network fail).
    To configure such a network is simple: at each router only needs to do two things.
    In this case for Router A:


    ```

    root# route add -net 192.168.1.0 netmask 255.255.255.0 eth0

    root# /usr/sbin/routed

    ```


    The ''routed daemon'' autonomously finds all active network ports (when it sends
    and listens for messages of the network devices) to allow it to both determine
    and update the routing table on the host.


    This has been a very brief explanation of dynamic routing. If you would like more
    information, please refer to the suggested references listed at the top of this
    document.


    ## 5.7.1. So what does the routed program do?


    The important points relating to dynamic routing are:


    - You only need to run a dynamic routing protocol daemon when your Linux machine
    has the possibility of selecting multiple route alternatives to a destination.
    An example of this would be if you plan to use IP Masquerading.

    - The dynamic routing daemon will automatically modify your routing table to adjust
    to changes in your network.

    - RIP is suitable for small to medium sized networks.


    ## 5.8. Configuring your network servers and services.


    Network servers and services are programs that allow a remote user to make use
    of your Linux machine. Server programs listen on network ports. Network ports
    are a means of addressing a particular service on any particular host. How is
    a server know the difference between an incoming telnet connection and an incoming
    ftp connection? The remote user establishes a network connection to your server
    program (the network daemon) listening on that port accepts the connection and
    executes. There are two ways that network daemons operate. Both are commonly employed
    in practice. The two ways are:


    ### stand-alone


    > The network daemon program listens on the designated network port. When an incoming
    connection is made, the daemon manages the network connection itself to provide
    the service.


    ### slave to the inetd server


    > The inetd server is a special network daemon program that specializes in managing
    incoming connections. It has a configuration file which tells it what program
    needs to be run upon receiving an incoming connection. Any service port may be
    configured for either the tcp or udp protocols. The ports are described in another
    file that we will see soon...


    There are two important files that need to be configured. They are the /etc/services
    file (which assigns names to port numbers), and the /etc/inetd.conf file (the
    configuration file for the inetd network daemon).


    ## 5.8.1. /etc/services


    The /etc/services file is a simple database that associates a friendly name to
    a machine service port. Its format is a text file where each line represents an
    entry in the database and is comprised of three fields separated by any number
    of whitespace (tab or space) characters. The fields are: name port/protocol aliases.


    A single word name that specifies the port number where the service will be available.
    Most of the common services have assigned numbers. This field is split into either
    tcp or udp. It is important to note that an entry of 18/tcp is very different
    from an entry of 18/udp. There is no technical reason why the same service needs
    to exist on both. Normally sense prevails. Any text appearing in a line after
    a ''#'' character is ignored, and is treated as a comment. In case you happen
    to be building from the ground up, here is a copy of the /etc/services file supplied
    with an old Debian distribution:


    | name | port/protocol | aliases | comment |

    | :--- | :--- | :--- | :--- |

    | ftp | 21/tcp | | |

    | ssh | 22/tcp | | SSH Remote Login Protocol |

    | ssh | 22/udp | | Remote Login Protocol |

    | telnet | 23/tcp | | |

    | smtp | 25/tcp | | |

    | smtp | 25/udp | | |

    | time | 37/tcp | | resource location |

