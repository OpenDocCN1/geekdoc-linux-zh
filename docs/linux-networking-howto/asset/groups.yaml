    192.168.3.2 remoteplip\n```\n\n`pointpoint` 参数与 SLIP 的含义相同。它指定了链路另一端机器的地址。\n\n\
    在各方面，你可以像信任 SLIP 接口一样信任 PLIP 接口。然而，dip 或 slatch 无法使用。\n\n## 11.4.1. dip\n\ndip（拨号\
    \ IP）是一个可以执行以下任务的智能程序：setip，它会配置你的串口端口。\n\n## 11.4.2. slattach\n\nslattach（相对于\
    \ dip）是一个非常简单的程序，它没有 dip 的脚本能力。\n\n## 11.4.3. 我什么时候使用 ?\n\n你会使用 dip 当你的链路（到服务器）是拨号调制解器或临时链路。你会使用\
    \ slattach 当你有一条租赁线，可能连接你的机器和服务器；假设不需要操作来获取。\n\n## 11.4.4. 静态 SLIP 服务器，带有拨号线和\
