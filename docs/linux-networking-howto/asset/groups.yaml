    # Linux Networking HOWTO


    # 5.10.3.1. /etc/hosts.allow


    The /etc/hosts.allow file is a configuration file of the /usr/sbin/tcpd program.
    The hosts.allow file contains rules describing which hosts allowed access to a
    service on your machine.


    The file format is simple:


    ```

    # /etc/hosts.allow

    #

    # <service list>: <host list> [: command]

    ```


    service list


    This is a comma delited list of server names where this rule applies. Example
    server names are: ftpd, telnetd and fingerd.


    host list


    This is a comma delited list of host names. You may also use IP addresses here.
    You may additionally specify hostnames or wildcard characters to match groups
    of hosts. Examples: gw.vk2ktj ampr.org to match a specific host, .uts.edu.au to
    match any name ending in string, 44, to match any IP address commencing with digits.
    There are special tokens to simplify configuration. Some of these are: ALL matches
    every host, LOCAL matches any host name does not contain a ''.'' is in the same
    domain as your machine and PARANOID matches any host name does not match its address
    (name spoofing). There is one last token that is also useful. The EXCEPT token
    allows you to provide a list with exceptions. This will be covered in an example
    later.


    command


    This is an optional parameter. This parameter is the full pathname of a command
    that would be executed this rule is matched. It could, for example, run a command
    that would attempt to identify who is logged onto the connecting host. It could
    also generate a mail message or other warning to a system administrator that is
    attempting to connect. There are a number of expansions that may be included.
    Some common examples are: %h expands to the name of the connecting host or if
    it doesn''t have a name, %d the daemon name being called.


    An example:


    ```

    # /etc/hosts.allow

    #

    # Allow mail to anyone

    in.smptpd: ALL

    # Allow telnet and ftp to only hosts within my domain and my host at home

    telnetd, ftppd: LOCAL, myhost.athome.org.au

    # Allow finger to anyone but keep a record of who they are.

    fingerd: ALL: (finger %@h | mail "finger from %h")

    ```


