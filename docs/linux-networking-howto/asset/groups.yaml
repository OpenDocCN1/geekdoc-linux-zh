    \ 'gw'。原因很简单：像 PPP 和 SLIP 这样的串行链路协议只有两个主机（链路两端）。在这种情况下指定网关是多余且冗余的。您不需要为这些类型的连接指定网关。其他网络类型，如以太网或令牌环，实际上需要指定网关（因为这些网络支持多个主机）。\n\
    \n## 5.7.1. 所以 routed 程序做什么？\n\n上述路由配置适用于只有单一路径的简单网络安排。当您有更复杂的网络安排时，情况会变得有点复杂。尽管对于你们大多数人来说，这不是问题。\n\
    \n`手动路由`或`静态路由`的主要问题是，当您的网络出现机器或链路故障时，重新定向您的数据文（如果存在其他路径）的方法是人工干预并执行相应的命令。这显然是笨拙、缓慢、不实际且容易出错的。各种技术已经在网络故障发生（存在替代路由的情况下）自动路由表。所有这些技术被统称为\
    \ `动态路由协议`。\n\n您可能听说过一些常见的动态路由协议。最常见的可能是 RIP（路由信息协议）和 OSPF（开放最短路径优先）。路由信息协议适用于小型网络（例如中小型企业网络或大楼网络）。OSPF\
