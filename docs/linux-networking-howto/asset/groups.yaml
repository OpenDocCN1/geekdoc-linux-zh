    \n```\n# /sbin/ifconfig plip localplip point remoteplip\n# /sbin/route add remoteplip\
    \ plip\n```\n\n在这里，使用的端口位于 I/O 地址 0x378；localplip 和 remote-plip 是在 PLIP 电缆上使用的名称或\
    \ IP 地址。我个人将它们保留在我的 /etc/hosts 数据库中：\n\n```\n# plip entries\n192.168.3.1 localplip\n\
    192.168.3.2 remoteplip\n```\n\n`pointpoint` 参数与 SLIP 的含义相同。它指定了链路另一端机器的地址。\n\n\
    在各方面，你可以像信任 SLIP 接口一样信任 PLIP 接口。然而，dip 或 slatch 无法使用。\n\n关于 PLIP 的更多信息可以从 `PLIP\
    \ mini-HOWTO` 获取。\n\n## 11.2.1. Linux PLIP–2.2\n\n在 2.1 内核版本的开发期间，对并行端口的支持更改为改进后的设置。\n\
    \n### 内核编译选项：\n\n```\nGeneral setup --->\n[*] Parallel port support\nNetwork device\
    \ support --->\n<--> PLIP (parallel port) support\n```\n\nPLIP 的新代码行为与旧代码类似。你可以像上一节一样使用\
    \ `ifconfig` 和 `route` 命令。然而，由于高级的并行端口支持，设备的初始化是不同的。\n\n“第一个”PLIP 设备始终被称为 \"plip0\"\
    （其中第一个是系统检测到的第一个设备；类似于以太网设备发生的情况）。实际使用的并行端口是可用端口之一，如 /proc/parport 所示。例如，如果你只有一个并行端口，你将只有一个名为\
    \ /proc/parport 的目录。\n\n## 11.2.2. Linux PLIP–2.2\n\n如果你的端口不匹配上述任何组合，你可以更改端口的\
