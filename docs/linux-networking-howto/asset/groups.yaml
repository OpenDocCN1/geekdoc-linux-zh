    ## 11.4.5. Dynamic SLIP server with a dialup line and DIP.


    A dynamic SLIP server is one that allocates an IP address randomly (from a pool
    of addresses) each time you log. This means there is no guarantee that you will
    have any particular address. Address may be used by someone else after you have
    logged off. The network administrator who config the SLIP server will assign a
    pool of addresses for the SLIP server to use. When the server receives a incoming
    call, it finds the first unused address; then guides the caller through the login
    process; then it prints a welcome message that contains the IP address it has
    allocated. It will utilize that particular IP address for the duration of the
    call.


    Configuring for this type of server is similar to configuring a static server.
    You might add an extra step, however, where you obtain the IP address the server
    has allocated to you. Then you can configure your SLIP device with that address.


    Again, dip does the work for you. New versions are smart enough to not only log
    you in, but are also to automatically read the IP address printed in the welcome
    message. They can store this address so that you can have your SLIP device configured.


    If this is how your SLIP server works, then you can move to the section ‘Using
    Dip’ to learn how to configure dip appropriately.


    ## 11.4.6. Using DIP.


    As explained earlier, dip is a powerful program that can simplify and automate
    these process: dialing into the SLIP server, logging in the user, the connection,
    and configuring the SLIP devices with the appropriate configure and commands.


    To use dip, you will need to write a dip script. This script is basically a list
    of commands that dip understands. These commands tell dip how to perform each
    of the actions that you require. See sample.dip that comes supplied with dip to
    get an idea of how it works. dip is quite a powerful program with many options.
    Instead of going into all of them, you should look at the man page, README, and
    sample files that have come with your version of dip.


    You may notice that the sample.dip script assumes you’re using a static SLIP server
    (so you’ll know what your IP address beforehand). For dynamic SLIP servers, the
    newer versions of dip include a command you can use to automatically read and
    configure your SLIP device (with the IP address that the dynamic server allocates
    for). The following sample is a modified version of the sample.dip that came supplied
    with dip37-uri.txt. It is probably a good starting point for you. You might like
    to save it as /etc/dipscript, then you can edit it to your configuration:


    ```

    # sample.dip Dialup IP connection support program.

    # This file (should show) shows how to use the DIP

    # This file should work for Annex type dynamic servers, if you

    # use a static address server then use the sample.dip file that

    # comes as part of the dip37-uri.tgz package.


    # Version: @($sample.dip 1.40 07/20/93

    # Author: Fred N. van Kempen, <waltje@uWalt.NL.ORG>

    # main:

    # Next, set up the other side''s name and address.

    # My machine is called xsall.hack.nl (193.78.33.42)

    # Set netmask on sl0 to 255.255.255.0

    # Set the desired serial port and speed.

    # port cua0

    # Reset the modem and terminal line.

    # This seems to cause trouble for some people!

    reset

    # Note: "Standard" pre-defined "errlevel" values:

    # 0 OK

    # You can change those ''grep'' for "add" in *.c

    # Prepare for dialing.

    send ATQ0

    wait 2

    if $errlevel != 1 goto modem_trouble

    # We are connected. Login to the system.

    login:

    sleep 2

    wait in:

    if $errlevel != 0 goto login_trouble

    send myOLD

    wait 20

    if $errlevel != 0 goto password_error

    send myPASSWD

    logged in:

    # We have logged in.

    wait PROMPT

    30

    if $errlevel != 0 goto prompt_error

    # Command the server into SLIP mode

    send SLIP

    wait 30

    if $errlevel != 0 goto prompt_error

    # Get your IP address from the server.

    # Here we assume that coming SLIP server into SLIP

    # mode that prints your IP address

    get slip

    wait 30

