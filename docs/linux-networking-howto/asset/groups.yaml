    ## 5.9. Other miscellaneous network related configuration files.


    There are a number of miscellaneous files relating to network configuration under
    linux that might be of interest. You may not need to modify these files, but it
    is worth describing so you know what they contain and why they are used.


    ### 5.9.1. /etc/protocols


    The /etc/protocols file is a database that maps protocol id by protocol name.
    This is used by programmers to allow them to specify protocols by name in their
    programs. It is also used by some programs such as tcpdump to display names of
    numbers in their output. The general syntax of the file is:


    ```

    protocolname number aliases

    ```


    The /etc/protocols file supplied with the Debian distribution is as follows:


    ```

    # /etc/protocols

    # $Id: Net-HOWTO.sgml, v 1.1.1.1 2001/01/17 19:55:16 lx Exp $

    #

    # Internet (IP)

    #nfrom: (@)protocols    5.1 (Berkeley) 4/17/89

    #n Updated for NetBSD based on RFC 1340, Assigned Numbers (July 1992).

    ip 0      # Internet, pseudo protocol number

    icmp 1 ICMP   # Internet control message protocol

    igmp 2 IGP      # Internet Group Management

    ggp 3 GGP      # gateway-gateway protocol

    encap 4 IP-ENCAP # IP encapsulation in IP (officially `IP`)

    st 5 ST        # Data stream mode

    tcp 6 TCP      # transmission control protocol

    eg 8 EGP      # exterior gateway protocol

    pup 12 PUP     # PARC universal packet protocol

    udp 17 UDP     # datagram protocol

    hmp 20 HTTP    # host monitoring protocol

    xns-dip 22 XNS-DIP # Xerox NIS

    rdp 27 RDP      # *reliable datagram* protocol

    iso-tp4 24 ISO-TP4 # Transport Protocol Class 4

    xtp 36 TCP     # Xmas Transfer Protocol

    ddp 33 DDP      # Datagram Delivery Protocol

    idpr-cmtp 39 IDPR-CMTP # IDPR Control Messtrfers

    rspf 73 RSVP   # Roadest Path First.

    vmtp 81 VMTP   # Versatile Message Transport

    ospf 89 OSFP # Open Shortest Path First

    ipip 94 IPIP    # Yet Another IP encapsulation

    encap 98 ENCAP  # Yet Another IP encapsulation

    ```


    ### 5.9.2. /etc/networks


    The /etc/networks file has a similar function to that of the /etc/hosts file.
    This provides a simple database of network names around network addresses. Its
    format differs in there may be only two fields per line, and that fields are coded
    as:


    ```

    networkname networkaddress

    ```


    An example might look like:


    ```

    loopback 127.0.0.0

    localnet 192.168.0.0

    amprnet 44.0.0.0

    ```


    You will get a display of the network name (NOT its address) using a command route
    in the following instance: the destination is a network, and that has entry in
    the /etc/networks file.


    ## 5.10. Network Security and access control.


    Let me start this section by warning that you are securing your network and against
    malicious attack is a complex art. I do not consider myself an expert in this
    field. The mechanisms I will describe. If you are serious about security, I recommend
    you do some research of your own into the subject. There are many good references
    on the Internet relating to the security, including the Security-HOWTO


    An important rule of thumb: `Don''t run services you don''t intend to use`. Many
    distributions come configured with all sorts of services that are configured and
    automatically started. To ensure a minimum level of safety, you should go through
    `/etc/inetd.conf` file. Comment out (place a `#` at the start of the line) any
    entries for services you don''t intend to use. Good candidates are services such
    as: `shell, login, exec, uucp, ftp` and informational services such as `finger,
    netstat` and `systat`.


    There are all sorts of security and access control mechanisms. I will now describe
    the most elementary:


    ### 5.10.1. /etc/ftpusers


    The `/etc/ftpusers` file is a simple mechanism that allows you to deny certain
    users from logging into your machine via ftp. When an incoming ftp connection
    is received, the `/etc/ftpusers` file is read by the ftp daemon (`ftpd`). The
    file is a simple list of those users who are not allowed. It might look like:


    ```

    # /etc/ftpusers - users not allowed to login via ftp

    root

    uucp

    bin

    mail

    ```


    ### 5.10.2. /etc/security


    The `/etc/security` file allows you to specify which `tty` devices `root` are
    allowed for login. The `/etc/security` file is a list of tty devices allowed:


    ```

    # /etc/security - tty devices allowed to login

    tty1

    tty2

    tty3

    tty4

    ```


    ### 5.10.3. /etc/hosts.allow


    The /etc/hosts.allow file is a configuration file of the tcpd program. The hosts.allow
    file contains rules describing which hosts allowed access to a service.


    The file format is simple:


    ```

    # /etc/hosts.allow

    #

    # <service list>: <host list> [: command]

    ```


    service list


    This is a comma delimited list of server names where this rule applies. Example
    server names are: ftpd, telnetd and fingerd.


    host list


    This is a comma delimited list of host names. You may also use IP addresses here.
    You may additionally specify hostnames or wildcard characters to match groups
    of hosts. Examples: gw.vkktj ampr.org to match a specific host, .uts.edu.au to
    match any name ending in string, 44, to match any IP address commencing with digits.
    There are special tokens to simplify configuration. Some of these are: ALL matches
    every host, LOCAL matches any host does not contain a ''.'' is in the same domain
    as your machine and PARANOID matches any host name does not match its address
    (name spoofing). There is one last token that is also useful. The EXCEPT token
    allows you to provide a list with exceptions. This will be covered in an example
    later.


    command


    This is an optional parameter. This parameter is the full pathname of a command
    that would be executed this rule is matched. It could, for example, run a command
    that would attempt to identify who is logged onto the connecting host. It could
    also generate a mail message or other warning to a system administrator that is
    attempting to connect. There are a number of expansions that may be included.
    Some common examples are: %h expands to the name of the connecting host or if
    it doesn''t have a name, %d the daemon name being called.


    An example:


    ```

    # /etc/hosts.allow

    #

    # Allow mail to anyone

    in.smptpd: ALL

    # Allow telnet and ftp to only hosts within my domain and my host at home

    telnetd, ftppd: LOCAL, myhost.athome.org

