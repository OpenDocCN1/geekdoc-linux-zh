  - "[PAGE 77]\n\n# Linux Networking HOWTO\n\nYou need to add entries to both your\
    \ /etc/passwd and your /etc/diphosts files. The entries you need to make are formatted\
    \ as follows:\n\nTo configure Linux as a SLIP server with dip, you need to create\
    \ some SLIP accounts for users. You will use dip (in input mode) as the login\
    \ shell. A suggested convention is to have all SLIP accounts with a capital 'S',\
    \ eg 'Sfredred'.\n\nA sample /etc/passwd entry for a SLIP server looks like the\
    \ following:\n\n```\nSfredred:ij:SMiITGVCo:1004:10:Fred:/tmp:/usr/sbin/diplogin\n\
    \    login as login shell\n            Home directory\n            User Full Name\n\
    \            User Group ID\n            User ID\n            Encrypted User Password\n\
    \            Slip User Login Name\n```\n\nAfter the user logs in, the login program\
    \ (if it finds and verifies the user) will execute the dip command dip. diplogin\
    \ knows that it automatically assumes it is being used as a login shell. When\
    \ it started as dip it uses the getuid() function to call the user from whom it\
    \ has invoked. It searches the /etc/diphosts file for the first entry that matches\
    \ either the user or the name of the ty device where the call was made. It then\
    \ configures itself appropriately. By deciding between giving the user an entry\
    \ in the diphosts file, or providing him her the default configuration, you can\
    \ build your server in such a way that you have a mix of static and dynamically\
    \ assigned users.\n\nYou do not need to worry about manually adding these entries\
    \ because dip will automatically add a Proxy-ARP entry if invoked in input mode.\n\
    \n# 11.4.17. Configuring /etc/diphosts\n\n/etc/diphosts is used by dip to lookup\
    \ preset configurations for remote hosts. These remote hosts might be users dialing\
    \ into your linux machine, or they may be machines that you dial into with your\
    \ linux machine.\n\nThe general format for /etc/diphosts is as follows:\n\n```\n\
    Suwatt::145.71.34.1:145.71.34.2:255.255.255.0:SLIP uwalt:CSL,1006\nttyS::145.71.34.3:145.71.34.2:255.255.255.0:Dynamic\
    \ ttyS:CSL,296\n```\n\nThe fields are:\n\n+   1. Login name: as returned by getpwuid(getuid())\
    \ or ty name.\n2. Unused: compat. with passwd\n3. Remote Address: IP address of\
    \ the calling host, either numeric or by name\n4. Local Address: IP address of\
    \ this machine, again numeric or by name\n5. Netmask: field in decimal notation\n\
    6. Comment field: place whatever you want here.\n\n11.4.17. Configuring /etc/diphosts"
