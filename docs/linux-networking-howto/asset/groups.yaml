    # 5.1.2. IP Addresses: an Explanation.


    Protocol Addresses are composed of four bytes. The convention is to write addresses
    in what is called ''dotted decimal notation''. In this form, each byte is converted
    to a decimal number, (0–255). It drops any leading zeros (unless the number is
    zero) and written with each byte separated by a ''.'' character. By convention,
    each interface of a host or router has an IP address. It is legal for the IP address
    to be used on each interface of a single machine, but usually each interface will
    have its own address.


    Internet Protocol Networks are continuous sequences of IP addresses. All addresses
    contain digits within the address common. The portion of the address that is common
    amongst addresses within the network is called the ''network portion'' of the
    network. The remaining digits are called the ''host portion''. The number of bits
    that are shared by all addresses within a network is called the netmask. It is
    the role of the netmask to determine which addresses belong to the network it
    is applied to and not belong. For example, consider the following:


    ```

    Host Address             192.168.110.23

    Network Mask             255.255.255.0

    Network Portion           192.168.110.

    Host                               .23


    Network Address         192.168.110.0

    Broadcast Address        192.168.110.255

    ```


    Any address that is ''bitwise'' and reveal the address of the network that it
    belongs to. The network address is therefore always the lowest numbered within
    the range of addresses on the network, and always has the host portion of the
    address coded in zeros.


    The broadcast address is a special address that every host on the network listens
    to (in addition to its own address). This address is the one that datagrams sent
    to every host on the network is meant to receive types of data, like routing information
    and warning messages, are transmitted to the broadcast address so that every host
    on the network can receive it simultaneously. There are two commonly used standards
    for the broadcast address. The most widely one is to use the highest possible
    address for the network as the broadcast address. In the above example, this would
    be 192.168.110.255. For some reason other sites have adopted the convention of
    using the network address as the broadcast address. In practice it doesn''t matter
    much which you use, but you must make sure that every host on the network is configured
    with the same broadcast address.


    For administrative addresses (some time early in the development of the IP protocol),
    some groups of addresses were formed into networks. These networks were grouped
    into what are called classes. Classes provide a number of standard size networks
    that could be allocated. The ranges allocated:


    | Class | Netmask | Network Addresses |

    |---|---|---|n| A | 255.0.0.0 | 0.0.0.0 - 327.255.255.255 |

    | B | 255.255.0.0 | 128.0.0.0 - 191.255.255.255 |

    | C | 255.255.255.0 | 192.0.0.0 - 223.255.255.255 |

    | Multicast | 240.0.0.0 | 224.0.0.0 - 239.255.255.255 |


