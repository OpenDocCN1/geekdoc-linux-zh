    ## 5.1.2. IP Addresses: an Explanation


    Protocol Addresses are composed of four bytes. The convention is to write addresses
    in what is called ''dotted decimal notation''. In this form, each byte is converted
    to a decimal number, (0–255). It drops any leading zeros (unless the number is
    zero) and is written with each byte separated by a ''.'' character. By convention,
    each interface of a host or router has an IP address. It is legal for the IP address
    to be used on each interface of a single machine, but usually each interface will
    have its own address.


    Internet Protocol Networks are continuous sequences of IP addresses. All addresses
    contain digits within the address common. The portion of the address that is common
    amongst addresses within the network is called the ''network portion'' of the
    network. The remaining digits are called the ''host portion''. The number of bits
    that are shared by all addresses within a network is called the netmask. It is
    the role of the netmask to determine which addresses belong to the network it
    is applied to and not belong. For example, consider the following:


    ```

    Host Address             192.168.110.23

    Network Mask             255.255.255.0

    Network Portion           192.168.110.

    Host                     .23


    Network Address         192.168.110.0

    Broadcast Address        192.168.110.255

    ```


    Any address that is ''bitwise'' and reveals the address of the network that it
    belongs to. The network address is therefore always the lowest numbered within
    the range of addresses on the network, and always has the host portion of the
    address coded in zeros.


    The broadcast address is a special address that every host on the network listens
    to (in addition to its own address). This address is the one that datagrams sent
    to every host on the network is meant to receive types of data, like routing information
    and warning messages, are transmitted to the broadcast address so that every host
    on the network can receive it simultaneously. There are two commonly used standards
    for the broadcast address. The most widely used is to use the highest possible
    address for the network as the broadcast address. In the above example, this would
    be 192.168.110.255. For some reason other sites have adopted the convention of
    using the network address as the broadcast address. In practice it doesn''t matter
    much which you use, but you must make sure that every host on the network is configured
    with the same broadcast address.


    For administrative addresses (some time early in the development of the IP protocol),
    some groups of addresses were formed into networks. These networks were grouped
    into what are called classes. Classes provide a number of standard size networks
    that could be allocated. The ranges allocated:


    | Class | Netmask | Network Addresses |

    |---|---|---|

    | A | 255.0.0.0 | 0.0.0.0 - 127.255.255.255 |

    | B | 255.255.0.0 | 128.0.0.0 - 191.255.255.255 |

    | C | 255.255.255.0 | 192.0.0.0 - 223.255.255.255 |

    | Multicast | 240.0.0.0 | 224.0.0.0 - 239.255.255.255 |


    # Linux Networking HOWTO


    What addresses you should use depends on exactly what it is that you are doing.
    You may have to use a combination of the activities to get all the addresses you
    need:


    ### Installing a Linux machine on an existing IP network


    If you wish to install a Linux machine onto an existing IP network, then you should
    contact the network administrator and ask them for the following information:


    - Host IP Address

    - IP network address

    - IP broadcast address

    - IP netmask

    - Router address

    - Domain Name Server Address


    You should then configure your linux network device with these details. You cannot
    make them up and expect your configuration to work.


    ### Building a brand new network that will never connect to the Internet


    If you are building a private network, and you never intend that network to be
    connected to the Internet, then you can choose whatever addresses you like. However,
    for safety and consistency reasons, there have been some IP network addresses
    that have been reserved for this purpose. These are specified in RFC1597 and are
    as follows:


    | Network Class | Netmask | Network Addresses |

    |---|---|---|

    | A | 255.0.0.0 | 10.0.0.0 - 10.255.255.255 |

    | B | 255.255.0.0 | 172.16.0.0 - 172.31.255.255 |

    | C | 255.255.255.0 | 192.168.0.0 - 192.168.255.255 |


    You should first decide how large you want your network to be, then choose the
    addresses as you require.


    ## 5.2. Where should I put the configuration commands ?


    There are a few different approaches to Linux system boot processes. After the
    kernel boots, it always executes a program called *init*. The program reads its
    configuration file called /etc/init.d and commences the boot process. There are
    a few different flavors of *init* everyone seems to be gravitating to the System
    V (Five) flavor, developed by Miguel Schönenberg.


    Despite the fact that the *init* program is always the same, the setup of system
    boot is organized in a different way by distribution.


    Usually the /etc/init.d file contains an entry looking something like:


    ```

    si::sysinit:/etc/init.d/boot

    ```


    This line specifies the name of the shell script that actually manages the boot
    sequence. This file is somewhat equivalent to the AUTOEXEC.BAT file in MS-DOS.


    There are usually other scripts that are called by the boot script, and often
    the network is configured within one of them.


    The following table may be used as a guide for your system:


    | Distrib. | Interface Config/Routing | Server Initialization |

    | --- | --- | --- |

    | Debian | /etc/init.d/network | /etc/rc2.d/* |

    | Slackware | /etc/rc.d/rc.inet1 | /etc/rc.d/rc.inet2 |

    | RedHat | /etc/rc.d/init.d/network | /etc/rc.d/rc3.d/* |


    Note Debian and RedHat use a wholesale directory to host scripts for up system
    services (and usually information does not lie within these files: for example,
    Red Hat systems store all of system configuration in files under /etc/sysconfig,
    where is triggered by boot scripts). If you want to grab the details of the boot
    process, my suggestion is to check /etc/init and the documentation that accompanies
    init. Linux Journal is also going to publish an article about system initialization,
    and this document will point to it as soon as it is available on the web.


    Most modern distributions include a program that will allow you to configure many
    of the common sorts of network interfaces. If you have one of these, you will
    see if it will do what you want before attempting a manual configuration.


    | Distrib | Network configuration program |

    | --- | --- |

    | RedHat | /usr/bin/netcfg |

    | Slackware | /sbin/netconfig |


    Was this section helpful? Why not Donate $2.50?


    ## 5.3. Creating your network interfaces.


    In many Unix operating systems, the network devices have appearances in /dev.
    When we talk about configuring a network interface, we are talking about two items.
    One is the process of assigning addresses to a network device. The second setting
    the appropriate values for other parameters. The program most commonly used to
    do this is ifconfig.


    Typically you would use a command similar to the following:


    ```

    root# ifconfig eth0 192.168.0.1 netmask 255.255.255.0 up

    ```


    In this example, I am configuring an Ethernet interface ''eth0'' with the IP address
    ''192.168.0.1'' and a network mask of ''255.255.255.0''. The ''up'' tells the
    interface that it should become active (but can be omitted) since it is the default.
    To shutdown the interface, you can just call ''ifconfig eth down''.


    The kernel assumes certain when you are configuring interfaces. For example, you
    may specify the network address and broadcast address for an interface. If you
    don''t (as in my example above), the kernel will make reasonable guesses as to
    what these addresses be. If you supply a mask then on the network class the kernel
    would assume that it is a class-C network that is being configured on the interface.
    It would then configure a network address of ''192.168.0.0'' and a broadcast address
    of ''192.168.0.255'' for the interface.


    There are many other options to the ifconfig command. The most important of these
    are:


    - up


    This option activates an interface (and it is the default).


    - down


    This option deactivates an interface.


    - [-arp]


    This option enables or disables use of the address resolution protocol on this
    interface.


    - [-allmult]


    This option enables or disables the reception of all hardware multicast packets.
    Hardware multicast enables groups of hosts to receive packets addressed to special
    destinations. This may be of importance if you are using applications like desktop
    video conferencing. This option is normally not used.

    '
