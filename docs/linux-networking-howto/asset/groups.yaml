    ## 11.4.5. SLIP server with a dialup line and DIP.


    The example above assumes you are calling a dynamic SLIP server. If you are calling
    a static SLIP server, then the sample.dip that comes with dip37-uri.txt should
    work for you.


    When dip get command, it searches the incoming text from the remote for a string
    that looks like an IP (numbers separated by .). This modification was put in place
    specifically for SLIP servers so that the processing of your IP address is granted
    by the server.


    The example will automatically create a default route via your SLIP link. If this
    is not what you want, you might have connection that is your default route. Remove
    the default command from the script. If script has finished running (ifconfig),
    you will see that you have device sl0. This is your SLIP device. You can modify
    its configuration after the dip command has finished by using the ifconfig and
    route commands.


    Please note that dip allows you to select a number of protocols to use with the
    mode command. The most common is SLIP; it is used for SLIP compression. Please
    note that both ends of the link must agree. You should ensure that whatever you
    select agrees with your server settings.


    The example is fairly robust and should cope with most errors. Please refer to
    the dip page for more information. Naturally, you could code the script to do
    such things as redial the server if it doesn''t get a connection within a prescribed
    period of time. You can even try a series of servers (if you have access to more
    than one).


    ## 11.4.7. Permanent SLIP connection using a leased line and slattack.


    If you have a cable between two machines (or fortunate enough to have a leased
    line), or some other permanent serial connection between your machine and second
    machine, then you don''t need to go to all the trouble of using dip to set up
    your serial link. slattack is a very simple utility that will allow just enough
    functionality to configure your connection.


    Since your connection will be a permanent one, you will want to add commands to
    your rc.inet file. To get a permanent connection, make sure that you configure
    the serial device to the correct speed. Switch the serial device to SLIP mode.
    slattach allows you to do this with one command. Add the following to your rc.inet1
    file:


    ```

    # Attach a leased line static SLIP connection

    # configure /dev/cua0 for 19.2kbps cslip

    /sbin/slattach -p cslip -s 19200 /dev/cua0 &

    /sbin/ifconfig sl0 IPA.IPA.IPA IPR.IPR.IPR up

    # End static SLIP.

    ```


    Where:


    IPA.IPA.IPA represents your IP address.


    IPR.IPR.IPR represents the IP address of the remote end.


    slattach allocates the first unallocated SLIP device to the serial device specified.
    slattach starts with sl0. The first slattach command attaches SLIP device sl0
    to the serial device specified; sl1 the next time, etc.


    slattach allows you to configure a number of different protocols with the -p argument.
    You will use either SLIP or cslip: the choice will depend on whether or not you
    want to use compression. Note: both ends must agree on compression or no compression.


    ## 11.4.8. SLIP server.


    If you have a machine that is perhaps network connected, and you''d like other
    people to be dial in and obtain network services, then you will need to configure
    your machine as a server. If you use SLIP as the serial line protocol, then you
    have three options as how to configure your Linux machine (as a IP server). My
    preference would be to use the first (sliplogin) because it is the easiest to
    configure and understand. I will present a summary of each so that you can make
    your own decision.


    ## 11.4.9. SLIP Server using sliplogin.


    sliplogin is a program that you can use in place of the normal login shell for
    SLIP users. It converts the terminal into a SLIP line. It also allows you to configure
    your Linux machine as either a static address server (gets the same address time
    they call), or a dynamic address server (where users may get a different address
    allocated to them each time they call).


    The caller will login as the standard login protocol by entering their username
    and password. However, instead of being presented with a shell after their login,
    sliplogin is executed. Sliplogin searches its configuration file (/etc/slip.hosts)
    for an entry with a login name that matches that of the caller. If

