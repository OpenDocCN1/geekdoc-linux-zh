    ### 10.1. ip


    If you have iproute2 tools installed, executing ip command will allow the basic
    syntax to be displayed.


    ```

    [root@id4 Net4]# ip OBJECT | COMMAND | help

    Usage: ip [ OPTIONS ] OBJECT { COMMAND | addr | neigh | tunnel |

    where OBJECT := { link | addr | monitor |

    OPTIONS := { -V[version] | -s[statistics] | -r[resolve] | -f[family] { inet |
    inet6 | dnet | link } | -o[eline] }

    ```


    - -V, print the version of ip you are using and exit.


    - -s, obtain more output on the specified device. You can issue this option more
    than once to increase the amount of information displayed.


    - -f, followed by a protocol identifier such as: inet, inet6 or link. Specify
    the protocol to use. Use IPv4 (e.g., Current Internet), inet6 uses IPv6 (ground,
    never to implemented Internet), and link (physical link). If you do not present
    the option, the protocol is guessed. If enough information is present, it will
    fall back to the default.


    - -o, Show each device record in a single line.


    - -r, Use the system resolver (e.g., DNS) to print actual numbers. OBJECT is the
    object (device) that retrieve information from, and you can also manage the device.
    types are:

    - The network device e.g.; eth0 or ppp0

    - The IP (IPv4 or IPv6) address on the specified device.

    - neigh The ARP or NDIS cache.

    - route The routing table entry.

    - rule The ruling in database.

    - address The multicast address.

    - route The multicast route cache.

    - tunnel Whether or not tunnel over IP.


    The amount of possible options allowed on object type depend on the action of
    being taken. As a basic rule, it is possible to add, delete, or show the object.
    Not all will allow additional commands. Of course, help is used, it will print
    a list of available syntaxes for the given command. If you do not give command,
    the default is assumed. If objects are not listed, the default will provide standard
    output.


    ARGUMENTS is the list of arguments that can be passed to the command. The number
    of arguments depends upon both the command and object. There are two types of
    arguments: Flags consist of a keyword followed by a value. For convenience, each
    command contains some default parameters that can be left out for easy use. For
    example, dev defaults to ip link.


    Mistakes... All the operations within ip commands are dynamic. The syntax of ip
    utility fails, will not change the configuration of the system. There is exception
    to this rule: the ip link command is used to list all the error messages (especially
    syntax). Generally speaking, the meaning is clear in the context of commands.
    The most common mistakes are:


    1. Netlink is not configured in the kernel. The message is: Cannot open netlink
    socket: Invalid value

    2. RTNETLINK is not configured in the kernel. One of the following messages may
    be printed (depending upon command): Cannot talk to rtnetlink: Connection refused
    Cannot send request: Connection refused

    3. CONFIG_IP_MULTIPLE_TABLES was not selected when configuring kernel. In this
    case, any attempt to use command will fail. For example:


    ```

    jd@home $ ip list RTNETLINK: Invalid argument

    ```


