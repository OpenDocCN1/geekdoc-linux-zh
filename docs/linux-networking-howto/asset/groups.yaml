    ```


    All it does is ''down'' the interface. This will delete the manual route previously
    created. It also uses the arp command to delete any proxy arp put in place. You
    don''t need the arp command in the script if your server machine does not have
    an ethernet port.


    # 11.4.15. Configuring the /etc/slip.tty file.


    If you are using ip address allocation, you should have any hosts configured with
    the DYNAMIC keyword in the /etc/slip.hosts file. You must configure the /etc/slip.tty
    file to list addresses assigned to which port. You only need this file if you
    wish your server to dynamically allocate addresses to users.


    The file is a table that lists both the tty devices that will support dial-in–SLIP
    connections, and the ip address should be assigned to who calls in that port.


    Its format is follows:


    ```

    # slip.tty      tty -> IP address mappings for dynamic SLIP

    # format: /dev/tty xxx.xxx.xxx.xxx

    #

    /dev/ttyS0     192.168.0.100

    /dev/ttyS1     192.168.0.101

    ```


    What this tells us is that callers dial in port /dev/ttyS0 (who have their remote
    address field in the /etc/slip.hosts file set to DYNAMIC) will be assigned an
    address of 192.168.0.100.


    In this way you only allocate one address per port for all the users who do not
    require dedicated addresses. This keeps you the number of addresses you need down
    to a minimum.


    # 11.4.16. Slip Server using dip.


    Let me start by saying that some of the information below came from dip pages
    (where to run Linux as a SLIP server is briefly documented). Please be aware that
    the following has been based on the dip370-uri.tgz package, and will probably
    not apply to other versions of dip.


    dip has an input mode of operation. In this mode, it automatically locates an
    entry for the user who invoked it, and then connects the serial line as a SLIP
    link (according to information it finds in the /etc/diphiles file). This input
    mode of operation is activated by invoking dip as dip. By creating special accounts
    where dip is used as the login shell, you are using dip as a SLIP server.


    The first thing you will need to do is to make a symbolic link as follows:


    ```

    # ln -sf /usr/sbin/dip /usr/sbin/dip

    ```


