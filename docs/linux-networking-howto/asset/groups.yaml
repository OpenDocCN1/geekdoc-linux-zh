    ### 11.1. ISDN


    The Integrated Services Digital Network (ISDN) is a series of standards that specify
    a general purpose switched digital network. An ISDN ''call'' creates a synchronous
    Point-to-Point data service to the destination. ISDN is generally delivered on
    a high speed link that is broken into a number of discrete channels. There are
    two different types of channels, the B Channels (which will actually carry the
    user data) and a single channel called the ''D channel'' which is used to send
    control information to the ISDN exchange for establishing channels and other functions.
    For example, ISDN may be delivered on a 2Mbps link that is broken into 30 64kbps
    B (with one 64kb D channel). Any number of channels may be used at a time, and
    these can be used in any combination. You could, for example, establish 30 channels
    to 30 destinations at 64kbps each. You could also establish 15 to 15 different
    destinations at 128kbps each (two channels per call). Finally, you could adjust
    just a small number of calls while leaving the rest idle. A channel may be used
    for either incoming or outgoing calls. The intention of ISDN was to allow Telecommunications
    companies to provide a single data service. This service could deliver either
    telephone (via digitised voice) or data services to your home or business. In
    this case, the customer would not be required to make any special changes.


