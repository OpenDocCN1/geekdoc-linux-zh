    # 5.5.1. What''s in a name ?


    You will probably be familiar with the appearance of Internet host names, but
    you may not understand how they are constructed or de-constructed. Internet domain
    names are hierarchical in nature. In other words, they have a tree-like structure.
    A `domain` is a family, or group, of names. A `domain` may be broken down into
    a `subdomain`. A `top level domain` is a domain that is not a subdomain. The Top
    Level Domains are specified in RFC–920. Some examples of the most common top level
    domains are:


    COM


    Commercial Organizations


    EDU


    Educational Organizations


    GOV


    Government Organizations


    MIL


    Military Organizations


    ORG


    Other Organizations


    NET


    Internet–Related Organizations Designator


    Country These are two– letter codes that represent one of the non


    For historical reasons, most domains belonging to one of the non–country based
    top level domains were used by organizations in the United States (even though
    the United States also has its own country code `.us`). This is not true anymore
    for `.com` and `.org domains, which are commonly used by non-us companies.


    Each of these top level domains has subdomains. The top level domains based on
    country name are often broken down into subdomains on the `com`, `edu`, `gov`,
    `mil` and `org` domains. For example you end up with `com.au` and `gov.au` for
    commercial and government organizations in Australia; note that this is not a
    general rule, as actual policies depend on the naming authority for each domain.


    # 5.5.1. What''s in a name ?'
  - '[PAGE 20]


    # Linux Networking HOWTO


    The next level of division usually represents the name of the organization. Further
    subdomains vary in nature. Often the next level of subdomain is based on the departmental
    structure of the organization. It can, however, based on any criterion considered
    reasonable and meaningful by the network administrators of the organization.


    The very-most portion of the name is the unique name assigned to the host machine.
    It is called the `hostname`. The portion of the name to the right of the hostname
    is called the `domainname` and the complete name is called the `Fully Qualified
    Domain Name`.


    To use Telstra as an example, the fully qualified domain name is `perf.no.it.telstra.com.au`.
    This means that the host is `perf` and the domain name is `no.it.telstra.com.au`.
    This domain name is based on a top level domain (based on its country Australia).
    And since its email address belongs to a commercial organization, `.com` is positioned
    as the next level domain. The name of the company is (was) `Telstra`. Their internal
    naming structure is based on organizational structure. In this case, the machine
    belongs to the Information Technology Group (Network Operations section).


    Usually, the names are much shorter. For example, my ISP is called `system.it`.
    My non-profit organization is called `linux.it`, without any org subdomain. My
    own host is just called `morgana.system.it`:rubini@linux.it` is a valid email
    address. Note that the owner of a domain has the rights to register hostnames
    as well as subdomains. For example, the LUG I belongs to the domain `pluto.linux.it`,
    because the owners of linux.it agreed to open a subdomain for the LUG.


    # 5.5.2. What information will you need.


    You will need to know what domain hosts will belong to. The name resolver software
    provides this name translation by making requests to a `Domain Name Server`. You
    will need to know the IP address of a local name server that you use.


    There are three files. You will cover each of these in turn.


    # 5.5.3. /etc/resolv.conf


    The /etc/resolv.conf is the main configuration file for name resolver code. Its
    format is simple. It is a text file that has one keyword per line. There are three
    keywords typically used by the file. These keywords are:


    domain


    This keyword specifies the local domain name.


    search


    This keyword specifies a list of alternate domain names to search for a hostname


    name server


    5.5.2. What information will you need.'
- md: "\nThis keyword, which may be used many times, specifies an IP address of a\
    \ domain server to\nwhen resolving names.\n\nAn example `/etc/resolv.conf` might\
    \ look something like:\n\n```\ndomain maths.wu.edu.au\nsearch maths.wu.edu.au\
    \ wu.edu.au\nnameserver 192.168.10.1\nnameserver 192.168.12.1\n```\n(Note: The\
    \ OCR had \"name server\", corrected to \"nameserver\" based on standard config)\n\
    \nThis example specifies that the default domain name appended to unqualified\
    \ names (ie hostnames supplied\nwithout a domain) is maths.wu.edu.au. If the host\
    \ is not found in that domain, it will also try the\nwu.edu.au domain directly.\
    \ Two name server entries are supplied. These entries may be called upon the\n\
    name resolver to resolve the name.\n\n## 5.5.4. /etc/hosts\n\nThe /etc/hosts file\
    \ is where you configure some items that govern the behavior of the name\nresolver.\
    \ The format of this file is described in detail in the `resolv+` man page. In\
    \ nearly all\ncircumstances, the following example will work for you:\n\n```\n\
    order hosts.bind\nmulti on\n```\nThis configuration tells the name resolver to\
    \ check the /etc/hosts file before attempting to query a name\nserver. It also\
    \ tells the resolver to return all valid addresses for a host found in the /etc/hosts\
    \ file (instead\nof just the first address).\n\n## 5.5.5. /etc/hosts\n\nThe /etc/hosts\
    \ file is where you put the name and IP address of local hosts. If you place a\
    \ host in this\nfile, then you do not need to query the domain name server to\
    \ get its IP Address. The disadvantage of doing\nthis is if the IP address for\
    \ that changes, you must keep this file up to date. In a well\nmanaged system,\
    \ the hosts that usually appear in this file are an entry for the loopback interface,\n\
    and also the local hosts.\n\n```\n# /etc/hosts\n127.0.0.1       localhost loopback\n\
    192.168.0.1     this.host.name\n```\nYou may specify more than one host per line\
    \ (as demonstrated by the first entry), which is a standard\nentry for the loopback\
    \ interface.\n\n## 5.5.6. Running a name server\n\nIf you want to run a local\
    \ name server, you can do it easily. Please refer to the DNS-HOWTO and to any\n\
    docs included in your version of BIND (Berkeley Internet Name Domain).\n\n## 5.6.\
    \ Configuring your loopback interface.\n\nloopback is a special type of interface\
    \ that allows you to make connections to yourself. There are various reasons why\
    \ you might want to do this. For example, you might wish to test network software\
    \ without interfering with anyone else on the network. By convention, the IP address\
    \ `127.0.0.1` has been assigned specifically for loopback. No matter what machine\
    \ you go to, if you open a telnet connection to 127.0.0.1 you will always reach\
    \ the local host.\n\nConfiguring the loopback interface is simple, and it must\
    \ be done (but note that this task is usually performed by the standard initialization\
    \ scripts).\n\n```\nroot# ifconfig 127.0.0.1\nroot# route add -host 127.0.0.1\
    \ lo\n```\nWe'll tell you more about the route command in the next section. Was\
    \ this section helpful? Why not Donate $2.50?\n\n## 5.7. Routing.\n\nRouting is\
    \ a big topic. It is easily possible to write large volumes of text about the\
    \ subject. Most of you will have fairly simple routing requirements; some of you\
    \ will not. I will cover some basic fundamentals of routing only. If you are interested\
    \ in more detailed information, I suggest you refer to the references provided\
    \ at the start of this document.\n\nLet's start with a definition. What is IP\
    \ routing? Here is one I'm using:\n\n> \"IP Routing is the process by which a\
    \ host network decides where to deliver the IP datagrams that it has received\"\
    \n\nIt might be useful to illustrate this with an example. Imagine a typical office\
    \ router. It might have a PPP link off the Internet, a number of Ethernet segments\
    \ connecting the workstations, and another PPP link off to office. When the router\
    \ receives a datagram on any of its network, it uses the routing mechanism to\
    \ determine which interface it should send the datagram to. Simple hosts also\
    \ have two network devices, one is the loopback interface described above, and\
    \ the other is the one it uses to talk to the rest of the network (perhaps an\
    \ Ethernet, a PPP, or an SLIP serial interface).\n\nOk, so does routing work?\
    \ Each host has a special list of routing rules called a \"routing table\". This\
    \ table contains rows which typically contain at three fields: the first is a\
    \ destination address, the second is the name of the interface where the datagram\
    \ is to be routed, and the third is the IP address of another machine that carries\
    \ the datagram on its next step through the network. You can see this table in\
    \ linux using the following command:\n\n```\nuser% cat /proc/net/route\n```\n\
    or by using either of the following commands:\n\n```\nuser% /sbin/route -n\nuser%\
    \ netstat -r\n```\n\n# Linux Networking HOWTO\n\nThe routing process is fairly\
    \ simple. The incoming datagram is received, the destination address (who it is\
    \ for) is examined, and then it is compared with each entry in the table. The\
    \ entry that best matches address is selected, and the datagram is forwarded to\
    \ the specified interface. If the gateway is filled, the datagram is forwarded\
    \ to that host via the specified interface. The destination address is otherwise\
    \ assumed to be on the network supported by the interface.\n\nTo manipulate this\
    \ table, a special command is used. This command takes line arguments and converts\
    \ them into the kernel to add, delete, or modify entries in the routing table.\
    \ The command is called `route`. Here is a simple example. Imagine you have an\
    \ Ethernet network. You've been told it is a class-C network with address 192.168.1.0.\
    \ You've been supplied with an IP address of 192.168.1.10 for your, and you have\
    \ been told that 192.168.1.1 is a router connected to the network. The first step\
    \ is to configure the interface as described earlier. You now need to add your\
    \ entry into the routing table to tell the kernel that datagrams for all hosts\
    \ with addresses that match 192.168.1.* go here. You would use a command similar\
    \ to:\n\n```\nroot# ifconfig eth0 192.168.1.10 netmask 255.255.255.0 up\n```\n\
    Note the use of the `-net` route to tell the program that this entry is a network.\
    \ Your choice here is `-host` route, which is a route that is specific to one\
    \ IP address. This route will enable connections with all of the hosts on your\
    \ ethernet segment. But what about all of hosts that aren't on your ethernet segment?\
    \ It would be a difficult job to add routes to every destination network. There\
    \ is a special trick to simplify this task. The route is called the `default`\
    \ route. The `default` route matches every possible destination. If any other\
    \ entry exists that matches the required address, it will be used instead of the\
    \ default route. The idea of the default route is simply enough to say in effect:\
    \ \"everything else should go here\". In this example you use an entry like:\n\
    \n```\nroot# route add default gw 192.168.1.1 eth0\n```\nThe `gw` argument tells\
    \ the route command that the next argument is the IP address of gateway or router.\
    \ This machine is where all datagrams matching the entry should be directed for\
    \ further routing. If you take a look at your routing files, you will find that\
    \ at least one of them looks similar to\n\nLet's look now at a slightly complicated\
    \ routing link. Imagine we are configuring the router we looked at earlier (the\
    \ one supporting the PPP link to the Internet, and the lan feeding the workstations\
    \ in the office). Imagine the router has three ethernet segments, and it also\
    \ has one PPP link. Our routing configuration would look something like:\n\n```\n\
    route add -net 192.168.1.0 netmask 255.255.255.0 eth0\nroute add -net 192.168.2.0\
    \ netmask 255.255.255.0 eth1\nroute add -net 192.168.3.0 netmask 255.255.255.0\
    \ eth2\nroute add default ppp0\n```\nEach of the routes would use the simpler\
    \ form presented above. Only the router needs to specify each of the network routes\
    \ separately. The default route mechanism will call splitting them up appropriately.\
    \ You might be wondering why the default route presented doesn't specify a 'gw'.\
    \ The reason for this is simple: serial link protocols such as PPP and SLIP have\
    \ only two hosts on their network (one at each). To specify the other host at\
    \ the end of the link as the gateway is pointless and redundant. You do not need\
    \ to specify a gateway for these types of network connections as there is no other\
    \ choice. Other network types, such as ethernet, or token ring, actually require\
    \ the gateway to be specified (as these networks support Ethernet of hosts).\n\
    \n## 5.7.1. So what the routed program do ?\n\nThe routing configuration described\
    \ above is suited for simple network arrangements where there are only single\
    \ paths to destinations. When you have a more complex network arrangement, things\
    \ get a little more complicated. Fortunately for most of you will not be an issue.\n\
    \nThe big problem with `manual routing` or `static routing` is that if a machine\
    \ or link fails in your network, the only way to re-direct your datagrams (if\
    \ another way exists) is by manually intervening and executing the appropriate\
    \ commands. Naturally this is clumsy, slow, impractical, and hazard prone. Various\
    \ techniques have been developed to automatically routing tables in the event\
    \ of network failures (where there are alternate routes). All of these techniques\
    \ are loosely grouped by the term `dynamic routing protocols`.\n\nYou may have\
    \ heard of some of the most common dynamic routing protocols. The most common\
    \ are probably RIP (Routing Information Protocol) and OSPF (Open Shortest Path\
    \ First). The Routing Information Protocol is very config on small networks (such\
    \ as small-medium sized corporate networks or building networks). OSPF is more\
    \ modern. It is more capable of handling large network configurations, and it\
    \ is better suited to environments where there is a large number of paths through\
    \ the network. Common implementations of these protocols are: `routed` - RIP and\
    \ `gated` - RIP, OSPF and others. The `routed` program is normally supplied with\
    \ your Linux distribution, or it is included in the `NetKit` package detailed\
    \ above.\n\nAn example of where and how you might use a dynamic routing protocol\
    \ might look something like the following:\n\n```\n192.168.1.0 /             \
    \  192.168.2.0 /\n  255.255.255.0             255.255.255.0\n      --        \
    \                 --\n     /|                         |\n    |ppp|          ppp|\n\
    ```\n"
  mdcn: "\n此关键字可以多次使用，用于在解析名称时指定域名服务器的 IP 地址。\n\n一个 `/etc/resolv.conf` 的示例可能如下：\n\n\
    ```\ndomain maths.wu.edu.au\nsearch maths.wu.edu.au wu.edu.au\nnameserver 192.168.10.1\n\
    nameserver 192.168.12.1\n```\n（注：OCR 识别为 \"name server\"，已根据标准配置修正为 \"nameserver\"\
    ）\n\n此示例指定了附加到未限定名称（即未提供域的主机）的默认域名为 maths.wu.edu.au。如果在该域中未找到主机，它将直接尝试 wu.edu.au\
    \ 域。配置提供了两个名称服务器条目。名称解析器在解析名称时可能会调用这些条目。\n\n## 5.5.4. /etc/hosts\n\n`/text{etc/hosts`\
    \ 文件是您配置控制名称解析器行为的一些项目的地方。该文件的格式在 `resolv+` 手页中有详细描述。在几乎所有情况下，以下示例对您都有效：\n\n```\n\
    order hosts.bind\nmulti on\n```\n此配置告诉名称解析器在尝试查询名称服务器之前检查 `/etc/hosts` 文件。它还告诉解析器返回在\
    \ `/etc/hosts` 文件中找到的主机的所有有效地址（而不仅仅是第一个地址）。\n\n## 5.5.5. /etc/hosts\n\n`/text{etc/hosts`\
    \ 文件是您放置本地主机名称和 IP 地址的地方。如果您将一个主机放置在此文件中，那么您就不需要查询域名服务器来获取其 IP 地址了。这样做的缺点是，如果该主机的\
    \ IP 地址发生变化，您必须保持此文件的更新。在管理良好的系统中，此文件中通常出现的主机条目是回环接口以及本地主机。\n\n```\n# /etc/hosts\n\
    127.0.0.1       localhost loopback\n192.168.0.1     this.host.name\n```\n您可以在每行指定多个主机（如第一个条目所示），这是回环接口的标准条目。\n\
    \n## 5.5.6. 运行名称服务器\n\n如果您想运行一个本地名称服务器，可以轻松实现。请参考 DNS-HOWTO 以及您版本的 BIND（伯克利互联网名称域）中包含的任何文档。\n\
    \n## 5.6. 配置您的回环接口。\n\nloopback 是一种特殊的接口，允许您与自己建立连接。可能有多种原因让您这样做。例如，您可能希望在不干扰网络上其他人的情况下测试网络软件。按照惯例，IP\
    \ 地址 `127.0.0.1` 被专门分配给 loopback。无论在哪台机器，只要对 127.0.0.1 打开 telnet 连接，您将始终到达本地主机。\n\
    \n配置回环接口非常简单，必须执行（但请注意此任务通常由标准的初始化脚本完成）。\n\n```\nroot# ifconfig 127.0.0.1\nroot#\
    \ route add -host 127.0.0.1 lo\n```\n我们将在下一节中为您介绍更多关于 route 命令的信息。这一部分有帮助吗？为什么不捐赠\
    \ $2.50 呢？\n\n## 5.7. 路由。\n\n路由是一个大话题。这个主题很容易编写大量的文本。你们大多数人的路由需求相当简单；而有些人则不然。我将只涵盖路由的一些基础知识。如果您对更详细的信息感兴趣，我建议您参考本文开头提供的参考文献。\n\
    \n让我们从定义开始。什么是 IP 路由？这是我使用的一个定义：\n\n> “IP 路由是主机网络决定向何处传递其收到的 IP 数据文的过程”\n\n用一个示例来说明这一点可能很有用。想象一个典型的办公室路由器。它可能有一个连接互联网的\
