    （其中第一个是系统检测到的第一个设备；类似于以太网设备发生的情况）。实际使用的并行端口是可用端口之一，如 /proc/parport 所示。例如，如果你只有一个并行端口，你将只有一个名为\
    \ /proc/parport 的目录。\n\n## 11.2.2. Linux PLIP–2.2\n\n如果你的端口不匹配上述任何组合，你可以更改端口的\
    \ IRQ。使用 `ifconfig` 命令配合 `irc` 参数来更改 IRQ（如果你的 ROM BIOS 支持此选项，则可以在你的打印机端口上启用 IRQ）。作为替代，你可以在\
    \ insmod 行中指定 `io=` `irq=\"` 选项（如果你使用模块）：\n\n```\nroot# insmod plip.io io=0x288\
    \ irq=5\n```\n\nPLIP 操作由两个超时限制控制；它们的默认值在大多数情况下可能是的。如果你有一台特别慢的电脑，很可能需要增加它们。当涉及到计时器时，另一台计算机上的实际增加。一个名为\
    \ `plipconfig` 的程序允许你在无需重新编译内核的情况下更改这些计时器设置。该程序随许多 Linux 发行版提供。\n\n要配置 PLIP 接口，你需要遵循以下命令（或将它们添加到你的初始化脚本中）：\n\
