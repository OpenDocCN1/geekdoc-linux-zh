    \ `dip` 命令。`diplogin` 知道它会自动假设自己被用作登录 shell。当它作为 `dip` 启动时，它会使用 `getuid()` 函数获取调用它的用户。它会搜索\
    \ /etc/diphosts 文件，找到匹配用户或发起调用的 ty 设备名称的第一个条目。然后它会进行相应的配置。通过决定是为用户在 diphosts 文件中提供条目，还是为其提供默认配置，你可以构建服务器，使其混合静态用户和动态分配的用户。\n\
    \n你不需要担心手动添加这些条目，因为 `dip` 在输入模式下被调用时，会自动添加一个 Proxy-ARP 条目。\n\n## 11.4.17. 配置 /etc/diphosts\n\
    \n/etc/diphosts 用于 dip 查找远程主机的预设配置。这些远程主机可能是拨入你 Linux 机器的用户，也可能是你通过 Linux 机器拨入的机器。\n\
    \n/etc/diphosts 的通用格式如下：\n\n```\nSuwatt::145.71.34.1:145.71.34.2:255.255.255.0:SLIP\
    \ uwalt:CSL,1006\nttyS::145.71.34.3:145.71.34.2:255.255.255.0:Dynamic ttyS:CSL,296\n\
    ```\n\n字段含义为：\n\n- 1. 登录名：由 `getpwuid(getuid())` 返回或 ty 名称。\n- 2. 未用：兼容 passwd\n\
    - 3. 远程地址：调用主机的 IP 地址，可以是数字或名称。\n- 4. 本地地址：此机器的 IP 地址，同样可以是数字或名称。\n- 5. 子掩码：十进制表示的字段。\n\
    - 6. 注释字段：在此处放置任何内容。\n- 7. 协议：Slip, CSlip 等。\n- 8. MTU：十进制。\n\n远程 SLIP 用户的 /etc/diphots\
    \ 条目可能是：\n\n```\nSfredm::145.71.34.1:145.71.34.2:255.255.255.0:SLIP uwalt:SLIP,296\n\
    ```\n\n它指定了一个远程地址为 145.71.34.1 MTU 为 296 的 SLIP 链路，或者：\n\n```\nSfredm::145.71.34.1:145.71.34.2:255.255.255.0:SLIP\
    \ uwalt:CSL,1006\n```\n\n它指定了一个远程地址为 145.71.34.1 MTU 为 206 的支持 cSLIP 的链路。\n\n\
    所有希望成为静态分配拨号 IP 访问的用户都应该在 /etc/diphots 中有一个条目。如果你希望拨入特定端口的用户动态分配详情，那么你必须为 tty\
    \ 设备创建一个条目（而不是配置基于用户的条目）。你应该记住为每个使用的 tty 设备配置至少一个条目。这确保了无论他们拨入哪一个调制解调器都有相应的配置。\n\
    \n当用户登录时，他们将收到正常的登录和密码提示。他们应该输入他们的 SLIP 登录用户和密码。如果验证通过，用户将看不到任何特殊消息。用户随后应在其端切换到\
    \ SLIP 模式。随后用户应该能够连接并根据 diphots 文件中的相关参数进行配置。\n\n## 11.4.18. 使用 dSLIP 包的 SLIP\
    \ 服务器。\n\nMatt Dillon <dillon@apollo.west.oic.com> 编写了一个不仅可以拨入还能拨出 SLIP 的包。Matt\
    \ 的包是许多小程序和脚本的组合，它们可以替为你管理连接。你需要安装 `tsch`，作为它所需要的至少一个脚本之一。Matt 可能需要一些 `expect`\
    \ 经验才能让这个包按照你的喜好工作，但不要让这阻碍你的努力！\n\nMatt 在 README 文件中撰写了一组很好的安装说明，因此我不再重复它们了：\n\
    \n你可以从他的主站获取 dSLIP 包：\napollo.west.oic.com\n\n```\n/pub/linux/dillon_src/dSLIP203.tgz\n\
    ```\n\n或者从：\n\n```\nmetalab.unc.edu\n/pub/Linux/system/Network/serial/dSLIP203.tgz\n\
    ```\n\n在执行 `make install` 之前，阅读 README 文件并创建 /etc/passwd/group 条目。\n\n# 第 12 章\
    \ 其他网络技术\n\n以下子章节适用于特定的网络技术。这些章节中包含的信息并不一定适用于任何其他类型的网络技术。主题按字母顺序排序。\n\n## 12.1.\
    \ ARCNet\n\nARCNet 设备名称为 `arc0`、`arc1`、`arc2e` 等。`arc0s`、`arc1s`、`arc2s` 等。内核发现的第一个设备卡被分配\
    \ `arc0` 或 `arc0s`。其余的按照检测顺序顺序分配。字母表示封装数据包格式或 RFC1051 数据包格式。\n\n内核编译选项：\n\n```\n\
    Network device support -->\n[*] Network device support\n<*> ARCNet support\n[\
    \ ] Enable arc0 (ARCNet \"Ether-Encap\" 数据包格式)\n[ ] Enable arc0s (ARCNet RFC1051\
    \ 数据包格式)\n```\n\n一旦你正确构建了内核以支持你的以太网卡，配置网卡就很简单了。\n\n通常你会使用类似命令：\n\n```\nroot# ifconfig\
    \ arc0 192.168.0.1 netmask 255.255.255.0 up\nroot# route add -net 192.168.0.0\
    \ netmask 255.255.255.0 arc0e\n```\n\n更多信息请参阅 /usr/src/linux/Documentation/networking/arcnet/arcnet.txt\
    \ 和 /usr/src/linux/Documentation/networking/arcnet-hardware.txt 文件。\n\nARCNet\
    \ 支持由 Avery Pennarunan (apenar@foxnet.net) 开发。这个章节你有帮助吗？为什么不捐赠 $2.50 呢？\n\n##\
    \ 12.2. Appletalk (AF_APPLETAL)\n\nAppletalk 支持没有特殊的设备名称，因为它使用现有的网络设备。\n\n内核编译选项：\n\
    \n```\nNetworking options -->\n<*> Appletalk DDP\n```\n\nAppletalk 允许你的 Linux\
    \ 机器与 Apple 网络交互。它的一个重要用途是在 Linux 和 Apple 计算机之间共享资源（如打印机和磁盘）。这需要额外的软件，它被称为 netatalk。Wesley\
    \ Craig netatalk@umich.edu 代表密歇根大学的 `Unix 系统小组`。他们生产 netatalk 包。\n\n# Linux 网络教程\n\
    \n该产品提供了 Appletalk 协议栈以及一些实用工具。netatalk 包可能随你的 Linux 发行版提供，或者你需要从密歇根大学的主站 ftp\
    \ 获取。\n\n要编译并安装该包，可以如下操作：\n\n```\nuser% tar xvzf .../netatalk.4b2.tar.Z\nuser%\
    \ make\nroot# make install\n```\n\n在调用 `make` 编译软件之前，你可能需要编辑 `Makefile`。具体来说，具体具体来说，你可能想要修改\
    \ `DESTDIR` 变量，它定义了稍后安装文件的位置。`usr/local/atalk` 的默认值是安全的。\n\n## 12.2.1. 配置 Appletalk\
    \ 软件。\n\n让这一切正常工作的第一步是确保 etc/services 文件中存在相应的条目。这些条目是：\n\n```\nrtmp 1/dp # 路由表维护协议\n\
    nbp 2/dp # 名称绑定协议\necho 4/dp # Appletalk 回显协议\nzip 6/dp # 区域信息协议\n```\n\n下一步是在\
    \ /usr/local/atalk/etc 目录（或你安装包的地方）创建 Appletalk 配置文件。\n\n第一个要创建的文件是 /usr/local/atalk/etc/atd.conf。该文件最初只需要一行。这一行给出了你的\
    \ Apple 机器所在的网络设备名称。\n\n```\neth0\n```\n\nAppletalk 守护进程在启动后会添加额外的细节。\n\n## 12.2.2.\
    \ 通过 Appletalk 导出 Linux 文件系统。\n\n你可以将你的 Linux 机器导出到网络，以便网络上的任何 Apple 机器都可以共享它们。\n\
    \n要实现这一点，你必须配置 /usr/local/atalk/etc/AppleVolumes.system 文件。另一个配置文件是 /usr/local/atalk/etc/AppleVolumes.default。它的格式完全相同：它描述了具有访客权限的用户将共享哪些文件系统。关于如何配置这些文件（及其各种选项）的详细信息可以在\
    \ afpd 手页中找到。\n\n一个简单的示例如下：\n\n```\n/tmp Scratch\n```\n\n"
