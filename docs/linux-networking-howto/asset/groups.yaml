    # Linux Networking HOWTO


    available at www.lrz-muenchen.de. (You can click on the english flag to get an
    english version).


    A note about PPP. The PPP suite of protocols will operate either asynchronous
    or synchronous serial lines. The commonly distributed PPP daemon for Linux `pppd`
    supports only asynchronous mode. If you wish to run the PPP protocols over your
    ISDN service, you need a specially modified version. Details of where to find
    this version are available in the documentation referred above. Was this section
