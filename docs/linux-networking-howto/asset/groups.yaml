    Sets the remote IP address for a point–to–point link (such as PPP). This keyword
    is now obsolete; you should now use the pointpoint keyword.


    netmask addr


    Sets the IP network mask for this interface. This value defaults to the usual
    class A, B or C network mask (as derived from the interface IP address). It can,
    however, be set to any value.


