    # Linux Networking HOWTO


    This product provides software that implements the Appletalk protocol stack along
    with some useful utilities.

    netatalk package will either be supplied with your Linux distribution, or you
    will have to ftp from the

    home site at University of Michigan


    To build and install the package, do something like this:


    ```

    user% tar xvzf .../netatalk-l.4b2.tar.Z

    user% make

    root# make install

    ```


    You may want to edit the Makefile before calling make to actually compile the
    software. Specifically, you

    might want change the DESTDIR variable that defines where the files will later
    be installed. The default of

    usr/local/atalk is fairly safe.


    # 12.2.1. Configuring the Appletalk software.


    The first thing you need to do to make it all is to ensure that the appropriate
    entries in the

    /etc/services file are present. The entries you are:


    ```

    rtmp 1/dp # Routing Table Maintenance Protocol

    nbp 2/dp # Name Binding Protocol

    echo 4/dp # Appletalk Echo Protocol

    zip 6/dp # Zone Information Protocol

    ```


    The next step is to create the Appletalk configuration files in the /usr/local/atalk/etc
    directory or

    wherever you installed the package.


    The first file to create is /usr/local/atalk/etc/atalkd.conf. This file initially
    needs only

    one line. This line gives the name of the network device supporting the network
    that your Apple machines are


    ```

    eth0

    ```


    The Appletalk daemon program will add extra details after it has been initiated.


    # 12.2.2. Exporting a Linux filesystems via Appletalk.


    You can export systems from your Linux machine to the network so that any Apple
    machine on the

    network can share them.


    To do this you must configure the /usr/local/atalk/etc/AppleVolumes.system file.
    There is

    another configuration file called /usr/local/atalk/etc/AppleVolumes.default This
    file has

    exactly the same format: it describes which filesystems users connecting with
    guest privileges will


    Full details on how to configure these files (and their various options) can be
    found in the afpd man page.


    A simple example might look like:


    ```

    /tmp Scratch

    ```


