    \ ARP 条目。\n\n# 12.13. Token Ring (环形)\n\n环形设备名称为 `tr0`、`tr1`。环形是一种 IBM 标准协议，通过允许网络上只有一个站点进行传输的机制来避免冲突。令牌（token）由站点持有。该站点是允许传输的。当它传输数据后，会将令牌传递给下一个站点。令牌在所有活动站点之间循环，因此被称为环形。\n\
