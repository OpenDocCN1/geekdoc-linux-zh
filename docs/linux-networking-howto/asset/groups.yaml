    ```\n\nPLIP（并行线 IP）与 SLIP 类似，它们都用于在两台机器之间提供点对点网络。然而，你可以使用机器上的并行打印端口。它不使用串口端口（本文后文的接线图中包含一张接线图）。由于并行端口可以一次传输多个位，因此可以使用\
    \ PLIP 接口获得更高的速度。PLIP 获得的速度将高于使用标准设备的速度。此外，即使是最简单的并行打印端口也可以使用（而无需你为你的串口购买相当昂贵的\
    \ 16550AFN）。PLIP 使用大量的 CPU 来转换为串行链路。例如，如果你能获得一些网卡，那么它不是一个好的选择。但是，当所有资源都可用时，它可以工作（而且运行得相当不错）。当链路运行时，你应该获得大约每秒\
    \ 20 千字节的数据传输率。\n\nPLIP 驱动程序与并行设备驱动程序竞争并行端口硬件。如果你想同时使用这两个驱动程序，应该将它们编译为模块。这确保了你能够选择想要用于\
    \ PLIP 的端口，并可以为打印机驱动程序选择哪些端口。有关内核模块配置的更多信息，请参阅“Modules-HOWTO”。\n\n请注意，某些笔记本电脑无法配合\
