    \ 或 SLIP 串口接口）。\n\n好了，路由是如何运作的呢？每个主机都有一个特殊的路由规则列表，称为“路由表”。该表包含行，通常包含三个字段：第一个是目标地址，第二个是要路由数据文的接口名称，第三个是在网络中下一步传输时承载数据文的另一台机器的\
