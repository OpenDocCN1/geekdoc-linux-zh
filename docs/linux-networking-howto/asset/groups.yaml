    # 5.8.2./etc/inetd.conf


    The /etc/inetd.conf file is the configuration file for the inetd server daemon.
    Its function is to tell inetd what to do when it receives a connection request
    for a particular service. For each service that you wish to accept connections,
    you must tell inetd what network server daemon to run (and how to run it).


    Its format is also fairly simple. It is a text file with each line describing
    a service that you wish to provide. Any text in a line beginning with a # is both
    ignored, and it is considered a comment. Each line contains seven fields separated
    by any number of whitespace (tab or space) characters. The general format is as
    follows:


    | service | socket_type | proto | flags | user | server_path | server_args |


    service

    The service is relevant to this configuration taken from the /etc/services file.


    socket_type

    This field describes the type of socket that this entry will consider relevant.
    Allowable values are: stream, dgram, raw, rdm, or seqpacket. This is a little
    technical in nature. As a rule of thumb nearly all tcp services use stream, and
    nearly all udp based services use dgram. It is only special types of server daemons
    that would use any of the other values.


    proto

    The protocol is valid for this entry. This should match the appropriate entry
    in the /etc/services file. It will typically be either tcp or udp. Sun RPC (Remote
    Procedure Call) based servers will be either rpc/tcp or rpc/udp.


    flags

    There are only two possible settings for this field. This field tells inetd whether
    the network server program frees the socket after it has started (inetd can start
    another one on the next connection request), or whether inetd should wait and
    assume that any server daemon already running will handle the new connection request.
    This is a little tricky to work out, but as a rule of thumb all tcp services should
    have this entry set to nowait. Most udp servers should have this entry set to
    wait. Be warned there are some notable exceptions. You should let the example
    you know if you are not.


    user

    This field describes which user account from /etc/passwd will be the owner of
    the network daemon when it is started. This is often useful if you want to safeguard
    security risks. You can set the user to nobody user. If the network server security
    is breached, the possible damage is minimized by using nobody. Typically this
    field is set to root, because many servers require root privileges in order to
    function correctly.


    server_path

