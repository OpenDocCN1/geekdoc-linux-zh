    # cd sliplogin-2.1.1

    # ../edit the Makefile if you don''t use shadow passwords..

    # make install

    ```


    If you want to recompile the binaries before installation, add a make clean before
    the make install. If you want to install the binaries somewhere else, you will
    need to edit the Makefile install rule.


