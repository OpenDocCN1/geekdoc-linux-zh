    \ 255.255.255.0 eth2\nroot route add default ppp0\n```\n\nEach of the routworks\
    \ would use the simpler form presented above. Only the router needs to specify\
    \ each of the network routes separately. The default route for the mechanism will\
    \ call up splitting them up appropriately. You might be wondering why the default\
    \ route presented doesn't specify a 'gw'. The reason for this is simple: serial\
    \ link protocols such as PPP and SLIP have only two hosts on their network (one\
    \ at each). To specify the other host at the end of the link as the gateway is\
    \ pointless and redundant. You do not need to specify a gateway for these types\
    \ of network connections as there is no other choice. Other network types, such\
    \ as ethernet, or token ring, actually require the gateway to be specified (as\
    \ these networks support Ethernets of hosts ).\n\n# 5.7.1. So what the routed\
    \ program do ?\n\nThe routing configuration described above is suited for simple\
    \ network arrangements where there are only single paths to destinations. When\
    \ you have a more complex network arrangement, things get a little more complicated.\
    \ Fortunately for most of you will not be an issue.\n\nThe big problem with `manual\
    \ routing` or `static routing` is that if a machine or link fails in your network,\
    \ the only way to re-direct your datagrams (if another way exists) is by manually\
    \ intervening and executing the appropriate commands. Naturally this is clumsy,\
    \ slow, impractical, and hazard prone. Various techniques have been developed\
    \ to automatically routing tables in the event of network failures (where there\
    \ are alternate routes). All of these techniques are loosely grouped by the term\
    \ `dynamic routing protocols`.\n\nYou may have heard of some of the most common\
    \ dynamic routing protocols. The most common are probably RIP (Routing Information\
    \ Protocol) and OSPF (Open Shortest Path First). The Routing Information Protocol\
    \ is very config on small networks (such as small-medium sized corporate networks\
    \ or building networks). OSPF is more modern. It is more capable of handling large\
    \ network configurations, and it is better suited to environments where there\
    \ is a large number of paths through the network. Common implementations of these\
    \ protocols are: `routed` - RIP and `gated` - RIP, OSPF and others. The `routed`\
    \ program is normally supplied with your Linux distribution, or it is included\
    \ in the `NetKit` package detailed above.\n\nAn example of where and how you might\
    \ use a dynamic routing protocol might look something like the following:\n\n\
    ```\n192.168.1.0 /               192.168.2.0 /\n  255.255.255.0             255.255.255.0\n\
    \      --                         --\n     /|                         |\n    |ppp|\
