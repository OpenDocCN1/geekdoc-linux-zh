- md: "\n# Linux Networking HOWTO\n\n/home/ftp/pub `Public Area`\n\nThis would export\
    \ your `tmp filesystem AppShare Volume `Scratch`, and it would export your ftp\
    \ public directory by AppShare Volume `Public Area`. The names are not mandatory.\
    \ The daemon will choose some for you, but it won't hurt to specify them anyway.\n\
    \n## 12.2.3. Sharing your Linux printer across Applelet.\n\nIt is simple to share\
    \ your Linux printer with your Apple machines. You need to run the papd program,\
    \ the Applelet Printer Access Protocol Daemon. When you run this, it will accept\
    \ requests from your Apple machines and spool the job to your local printer daemon.\n\
    \nYou need to edit the /usr/local/atk/etc/papd.conf file to configure the daemon.\
    \ The syntax of this file is the same as that your usual /etc/printcap file. The\
    \ name you give to the definition is registered with the Applelet naming protocol\
    \ NBP.\n\nA sample configuration might look like:\n\n```\nTricWriter:\\n:pr=lp:op=cg\n\
    ```\n\nThis would make a printer named `TricWriter` available to your Applelet\
    \ network. All accepted jobs would be printed to the linux printer `lp` (as defined\
    \ in the /etc/printcap file) using lpd. The entry `op=cg` says that the linux\
    \ user `cg` is the operator of the printer.\n\n## 12.2.4. Starting the applelet\
    \ software.\n\nOk. Should now be ready to test this basic configuration. There\
    \ is an rc.talk file supplied with the netatalk package that works for you, so\
    \ all you should have to do is:\n\n```\nroot# /usr/local/atk/etc/rc.talk\n```\n\
    \nAll should startup and run ok. You should see no error messages. The software\
    \ will send messages to the console indicating each stage as it starts.\n\n##\
    \ 12.2.5. Testing the applelet software.\n\nTo test that the software is functioning\
    \ properly: go to one of your Apple machines, pull down the menu, select the Chooser,\
    \ click on AppleShare, and your Linux box should appear.\n\n## 12.2.6. Caveats\
    \ of the applelet software.\n\n- You may need to start the Applelet support before\
    \ you configure your IP network. If you have problems starting the Applelet programs\
    \ (or if you start them they have trouble with your IP network), then trying the\
    \ Applelet software before you run your /etc/rc.d/rc.inet1 file.\n\n- The afpd\
    \ (Apple Filing Protocol Daemon) SEVERELY MESSES UP YOUR HARD DISK. It creates\
    \ a couple of directories called `.AppleDesktop`. For each directory you access,\
    \ it will create a .Apple below it it can store resource forks. Think twice before\
    \ exporting / you will have a great cleaning up afterwards.\n\n- The afpd program\
    \ expects clear text texts from the Macs. Security could be a problem, so be very\
    \ careful when you run this daemon on a machine connected to the Internet. You\
