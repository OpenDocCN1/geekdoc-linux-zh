    \ refer to it. It is as simple as:\n\n```\nifconfig eth0:0 -\n```\n\nAll routes\
    \ associated with that alias will also be deleted. Was this section helpful? Why\
    \ not Donate $2.50?\n\n## 7.5. IP Firewall (for Linux–20)\n\nIP Firewall and Firewall\
