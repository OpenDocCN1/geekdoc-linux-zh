    \ 等。`routed` 程序通常随您的 Linux 发行版提供，或者包含在上述的 `NetKit` 软件包中。\n\n关于以及如何使用动态路由协议的示例可能如下所示：\n\
    \n```\n192.168.1.0 /               192.168.2.0 /\n  255.255.255.0            \
    \ 255.255.255.0\n      --                         --\n     /|                \
    \         |\n    |ppp|          ppp|\n```\n\n"
