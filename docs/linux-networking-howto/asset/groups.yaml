    \ irq=5\n```\n\nPLIP 操作由两个超时限制控制；它们的默认值在大多数情况下可能是的。如果你有一台特别慢的电脑，很可能需要增加它们。当涉及到计时器时，另一台计算机上的实际增加。一个名为\
    \ `plipconfig` 的程序允许你在无需重新编译内核的情况下更改这些计时器设置。该程序随许多 Linux 发行版提供。\n\n要配置 PLIP 接口，你需要遵循以下命令（或将它们添加到你的初始化脚本中）：\n\
