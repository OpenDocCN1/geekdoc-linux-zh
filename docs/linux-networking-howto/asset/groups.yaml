    Adds an IPv6 address to an interface.


    del addr prefixlen


    Removes an IPv6 address from an interface.


    tunnel aa.bb.cc.dd


    Creates a new SIT (IPv6–IPv4) device that tunnels to the given destination.


    irq addr


    Sets the interrupt line used by this device. Not all devices can dynamically change
    their IRQ setting.


    io_addr addr


    Sets the start address in I/O space for this device.


