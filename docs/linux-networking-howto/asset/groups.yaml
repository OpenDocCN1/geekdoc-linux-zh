    # 11.4. SLIP client – (Antiquated)


    SLIP devices are named `sll0`,`sll1` . The first device configured is assigned
    `0`, and the rest of the devices are incrementally sequenced as they are configured.


    Kernel Compile Options:


    ```

    Network device support   -->

    [*] Network device support

    <> SLIP (serial line) support

    [ ] CSLIP compressed headers

    [ ] Keepalive and linefill

    [ ] Six bit SLIP encapsulation

    ```


    SLIP (Serial Internet Protocol) allows you to use tcp/ip over a line (could be
    a phone line with a dialup modem, or a leased line of some sort). To use SLIP,
    you would need access to an SLIP-server in your area. Many universities and businesses
    provide SLIP access over all the world.


    SLIP uses the serial ports on your machine to carry IP packets. To do this, SLIP
    must take control of the serial device, SLIP devices are named `slo0`, `sll1`.
    How do these correspond to your serial devices? The networking code used was an
    `ioctl` (io control) call to change the serial devices into SLIP devices. There
    are two programs that can perform this function: they are called `dip` and `slattach


    # 11.4.1. dip


    dip (Dialup IP) is a smart program that is to perform the following tasks: set
    the speed of the serial device, command your modem to the remote end, automatically
    log you into the remote server, search for messages sent to you, and extract information
    from them (such as your IP address). It will then perform the ioctl to switch
    your serial port into SLIP mode. dip has a powerful scripting ability. It is this
    utility that you can exploit to automate your logon procedure.


    You can find it at: metalab.unc.edu.


    Refer to the following for installation guidelines:


    # 11.3. PPP'
  - '[PAGE 68]


    # Linux Networking HOWTO


    ```

    user% tar xzvf dip337o-uri.tgz

    user% cd dip-3.3.7

    user% vi Makefile

    root# make install

    ```


    The Makefile assumes the existence of a group called uucp. However, you might
    like to change this to either dip or SLIP (depending on your configuration).


    # 11.4.2. slattach


    slattach (as contrasted with dip) is a very simple program that does not have
    the sophistication of dip. It does not have the scripting ability of dip. It will
    only configure your serial device as a SLIP device. It assumes you have all the
    information you need, and that slattach is ideal to use where you have a permanent
    connection to your server (such as a physical cable or a leased line).


    # 11.4.3. When do I use which ?


    You would use dip when your link (to the machine that is the SLIP server) is either
    a dialup modem or some other temporary link. You would use slattach when you have
    a leased line, perhaps a cable, between your machine and the server; it is assumed
    that there is no action needed to get this link working. See ‘Permanan is Slip
    connection’ for more information.


    Configuring SLIP is like configuring an Ethernet interface (read section ‘Configuring
    an ethernet device’). There are a few differences.


    First of all, SLIP links are unlike Ethernet networks in that there are only two
    hosts on the network (one at each end of the link). Ethernet is available for
    use as you are cabled. However, SLIP may require you to initialize your network
