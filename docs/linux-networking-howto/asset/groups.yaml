    ## 11.4.10. 在何处获取 sliplogin


    你可能已经作为发行版的一部分安装了 `sliplogin` 软件包。如果你没有该包，可以从 `metalab.unc.enc` 获取 `sliplogin`。tar
    包包含源代码、预编译的二进制文件和一个手动帮助页（man page）。


    为了确保只有授权用户才能运行 `sliplogin` 程序，你应该在 `/etc/group` 文件中添加一个类似下方的条目：


    ```

    slip::13:radio,fred

    ```


    当你安装 `sliplogin` 软件包时，`Makefile` 将把 `sliplogin` 程序的组所有权更改为 `slip`。这意味着属于该组的用户将能够执行它。该示例将仅允许
    `radio` 和 `fred` 用户执行 `sliplogin`。


    要将二进制文件安装到你的 `/sbin` 目录，并将帮助页放入第 8 节，请执行以下操作：


    ```

    # cd /usr/src

    # gzip -dc .../sliplogin-2.1.1.tar.gz | tar xf -

    # cd sliplogin-2.1.1

    # 如果你不使用 shadow 密码，请编辑 Makefile..

    # make install

    ```


    如果你想在安装之前重新编译二进制文件，可以在 `make install` 之前添加 `make clean`。如果你想将二进制文件安装在其他地方，你需要编辑
    `Makefile` 的 `install` 规则。


    ## 11.4.11. 为 Slip hosts 配置 /etc/passwd。


    你通常会在 `/etc/passwd` 文件中为 Slip 调用者创建特殊的登录账户。一个通用的惯是使用呼叫主机的主机名，并加上 `S` 前缀。如果呼叫主机是
    `radio`，那么你可以创建一个如下的 `/etc/passwd` 条目：


    ```

    Sradio:Fvukuro73:1427:1:radio SLIP login:/tmp:/sbin/sliplogin

    ```


    调用者被如何命名并不重要：只需确保他们不需要任何特殊的家目录即可。他们不会从这台机器获得 shell，因此 `/tmp` 是一个很好的选择。另外请注意，`sliplogin`
    被用来替代正常的登录 shell。


    ## 11.4.12. 配置 /etc/slip.hosts


    `/slip.hosts` 文件是 `sliplogin` 搜索的文件（它查找与登录名匹配的条目），以获取此特定调用者的配置详情。在该文件中指定分配给调用者（供其使用）的
    IP 地址和子网掩码。两个主机的示例条目：一个是 `radio` 主机的静态配置，另一个是用户主机 `albert` 的动态配置。两者都可能如下：


    | | | | | | | |

    |---|---|---|---|---|---|---|

    | Sradio | 44.136.8.99 | 44.136.8.100 | 255.255.255.0 | normal | -1 |

    | Salbert | 44.136.8.99 | DYNAMIC | 255.255.255.0 | compressed | 60 |


    `/slip.hosts` 文件的条目含义为：


    1. 调用者的登录名。

    2. 服务器机器的 IP 地址（即：本机）。

    3. 如果此字段为 `DYNAMIC`，将分配一个 IP 地址。这基于你的 `/etc/slip.tty` 文件中的信息（将讨论）。注意：你必须使用 1.3
    版本的 `sliplogin` 才能使其工作。

    4. 分配给呼叫机器的子网掩码，采用点进制表示，例如 Class C 网络掩码为 `255.255.255.0`。可选值为 "normal" 或 "compressed"。

    5. 超时参数，允许你启用/禁用 slip 以及其他功能。线路空闲（未接收到数据包）多久后会自动断开。负值将禁用此功能。

    6. 可选参数。


    注意：你可以在字段 2 和 3 使用主机名或 IP 地址（点进制表示法）。如果你使用主机名作为地址，则这些主机必须是可以解析的。也就是说，你的机器必须能够为它们定位
    IP 地址。如果机器无法定位 IP 地址，脚本在调用时将失败。你可以通过尝试连接主机名来测试这一点。如果你收到 `nnn.nnn.nnn...` 消息，说明你的机器已经找到了该主机的
    IP 地址。如果你收到 `Unknown host` 消息，则说明失败了。在这种情况下，你可以使用点进制的 IP 地址，或修复你的名称解析（参见“名称解析”章节）。常见的
    slip 模式有：


    - `normal`：启用未压缩的 SLIP。

    - `compressed`：启用头部压缩（SLIP）。自然地，这些是互斥的。你可以使用其中一种。更多关于其他可用信息，请参考帮助页。


