    ## 5.10.3.2. /etc/hosts.deny


    The /etc/hosts.deny file is a configuration file for the /usr/sbin/tcpd program.
    The hosts.deny contains rules describing which hosts are disallowed access to
    a service on your machine.


    A simple sample would look something like this:


    ```

    # /etc/hosts.deny

    #

    # Disallow all hosts with suspect hostnames

    ALL: PARANOID

    #

    # Disallow all hosts.

    ALL: ALL

    ```


    The PARANOID entry is redundant because the other entry traps everything in case.
    Either of these entries would make a reasonable default (depending on your particular
    requirement).


    Having an ALL: ALL default in the /etc/hosts.deny and then specifically enabling
    on those services and hosts that you use in the /etc/hosts.allow is the safest
    configuration.


    ## 5.10.4. /etc/hosts.equiv


    The hosts.equiv file is used to grant certain hosts and users access rights to
    accounts on your machine without having to supply a password. This is useful in
    a secure environment where you control all machines, but is otherwise as secure
    as the least secure of the trusted hosts. To maximize security, do not use this
    mechanism. Encourage your users not to use the .hosts file as well.


    ## 5.10.5. Configure your ftp daemon properly.


    Many sites will be interested in running an anonymous ftp server to allow other
    people to upload and download files without requiring a specific user. If you
    decide to offer this service, make sure you configure the ftp daemon for anonymous
    access. Most pages for ftpd (8) describe in length the proper procedures. You
    should always ensure that you follow these instructions. An important tip is not
    to use copy of /etc/passwd file in the anonymous account /etc directory. Make
    sure you strip out all details (except those you must have), otherwise you will
    be vulnerable to brute force password cracking techniques.


    ## 5.10.6. Network Firewalling.


    Not allowing datagrams to even reach your machine (or servers) is an excellent
    means of security. This is covered in depth in the Firewall–HOWTO (and more concisely)
    in a later section of this document.


    ### 5.10.3. The tcpd hosts access control mechanism.


    ## 5.10.7. Other suggestions.


    Here are some other (potentially religious) suggestions for you to consider:


    sendmail


    > Despite its popularity, the sendmail daemon appears with frightening regularity
    on security warning announcements. My recommendation is not to run it.


    NFS and other Sun RPC services


