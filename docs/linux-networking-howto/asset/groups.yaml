    range 192.168.1.100 192.168.1.100;

    range 192.168.1.150 192.168.1.200;

    }

    ```


    This will allow the DHCP server to serve the client IP address from the range
    192.168.1.10–192.168.1.100 or 192.168.1.150–192.168.1.200.


