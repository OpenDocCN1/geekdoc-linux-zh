    # Chapter 12. Other Network Technologies


    The following subsections are specific to particular network technologies. The
    information contained in these sections does not necessarily apply to any other
    type of network technology. The topics are sorted alphabetically.


    # 12.1. ARCNet


    ARCNet device names are `arc0`, `arc1`, `arc2e` etc. `arc0s`, `arc1s`, `arc2s`
    etc. The first device card by the kernel is assigned `arc0` or `arc0s` The rest
    are assigned sequentially in the order they are detected. The letter either signifies
    the encapsulation packet format or the RFC1051 packet format.


    Kernel Compile Options:


    ```

    Network device support -->

    [*] Network device support

    <*> ARCNet support

    [ ] Enable arc0 (ARCNet "Ether-Encap" packet format)

    [ ] Enable arc0s (ARCNet RFC1051 packet format)

    ```


    Once you have your kernel properly built to support your ethernet card, then configuring
    the card is easy.


    Typically you would use something like:


    ```

    root# ifconfig arc0 192.168.0.1 netmask 255.255.255.0 up

    root# route add -net 192.168.0.0 netmask 255.255.255.0 arc0e

    ```


    Please refer to /usr/src/linux/Documentation/networking/arcnet/arcnet.txt and
    /usr/src/linux/Documentation/networking/arcnet-hardware.txt files for further
    information.


    ARCNet support was developed by Avery Pennarunan, apenar@foxnet.net. Was this
    section helpful? Why not Donate $2.50?


    # 12.2. Appletalk (AF_APPLETAL)


    The Appletalk support has no special device names as it uses existing network
    devices.


    Kernel Compile Options:


    ```

    Networking options -->

    <*> Appletalk DDP

    ```


    Appletalk allows your Linux machine to interact with Apple networks. An important
    use for this is to share resources (as printers and disks) between your Linux
    and Apple computers. Additional software is required; this is called netatalk.
    Wesley Craig netatalk@umich.edu represents a team called the `Research Systems
    Unix Group` at the University of Michigan. They have produced the netatalk package.


    Chapter 12. Other Network Technologies'
