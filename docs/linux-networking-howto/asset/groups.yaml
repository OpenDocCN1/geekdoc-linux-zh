    \nIP 网络是 IP 地址的连续序列。所有地址中都包含共同的数字。网络内所有地址共同的部分被称为该网络的“网络部分”。剩余的数字被称为“主机部分”。网络内所有地址共享的位数称为子掩码（netmask）。子掩码的作用是确定哪些地址属于其所属的网络，哪些不属于。例如，考虑以下情况：\n\
