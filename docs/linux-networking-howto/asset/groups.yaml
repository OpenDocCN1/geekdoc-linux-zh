    ## 9.2. Adding a route with the new ip tools


    In the previous section, we spoke about both the routing table and we discussed
    the basics of that listing meant. Frankly, the output is very similar to the syntax
    that you would use to implement exact routing table on your own.


    ```

    ip route add 207.149.43.62 dev eth0 scope link

    ip route add 207.149.43.0/24 dev eth0 proto kernel scope src 207.149.43.62

    ip route add 127.0.0.0/8 dev lo scope link

    ip route add default via 207.149.43.1 dev eth0

    ```


    As you can see


    **Note:** We are aware that the Documentation on Routing 2.2 is sorely lacking
    in details. I think EVERY is aware of it! If you have any experience in this matter,
    please contact us at: poet@linuxports.com We would like to get any information
