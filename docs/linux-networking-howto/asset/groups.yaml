    An example /etc/diphots entry for a remote SLIP user might be:


    ```

    Sfredm::145.71.34.1:145.71.34.2:255.255.255.0:SLIP uwalt:SLIP,296

    ```


    which specifies a SLIP link with remote address of 145.71.34.1 and MTU of 296,
    or:


    ```

    Sfredm::145.71.34.1:145.71.34.2:255.255.255.0:SLIP uwalt:CSL,1006

    ```


    which specifies a cSLIP-capable link with remote address 145.71.34.1 and MTU of
    206.


    All users who wish to be a statically allocated dial-up IP access should have
    an entry in the /etc/diphots. If you want users who call a particular port to
    have their details dynamically allocated, then you must have an entry for the
    tty device (and not configure a user based entry). You should remember to configure
    at least one entry for each tty device that is used. This ensures that a suitable
    configuration is available for regardless of which modem they call on.


    When a user logs in, they will receive a normal login and password prompt. They
    should enter their SLIP-login user and password. If they verify properly, then
    the user will see no special messages. The user should then change into SLIP mode
    at their end. The user should then be able to connect and be configured with the
    relevant parameters from the diphots file.


