    # 11.4.13. Configuring the /etc/slip.login file.


    After sliplogin has searched the /etc/slip.hosts, and it has found a matching
    entry, it will attempt to execute the /etc/slip.login file. It will configure
    the SLIP interface with its ip address and netmask.


    The sample /etc/slip.login file supplied with the sliplogin package looks like
    this:


    ```

    #!/bin/sh

    # @($).slip.login 5.1 (Berkeley) 7/1/90

    # generic login file for a SLIP LINE.  sliplogin invokes this with

    # the parameters:

    #   $1             $3 $4, $5, $6 ...

    # SLIPUnit type pid the arguments from the slip.host entry

    # /sbin/ifconfig $1 $5 pointpoint mtu 1500 -trailers up

    # /sbin/route add $6 <hw_addr> pub

    # arp -s $6 <hw_addr>

    # exit 0

    ```


    You will note that this script uses ifconfig route commands to configure the SLIP
    device (with its IP address, remote IP address, and netmask). The script creates
    a route for the remote address via the SLIP device. This procedure is the same
    as you would invoke if using the slattack command.


    Also note the use of Proxy ARP. It ensures that other hosts on the server as the
    machine will know how to reach the dial-in host. The <hw_addr> field should be
    the hardware address of the ethernet card in the machine. If your server machine
    on an ethernet network, then you can eliminate this line.


    # 11.4.14. Configuring the /etc/slip.logout file.


    You want to ensure that the serial device is restored to its normal state the
    call drops out (so that callers will be able to log correctly). This is achieved
    with the use of the /etc/slip.logout file. It is quite simple in format, and it
    is called with the same argument as the /etc/slip.login file.


    ```

    #!/bin/sh

    #

    slip.logout

    ```


