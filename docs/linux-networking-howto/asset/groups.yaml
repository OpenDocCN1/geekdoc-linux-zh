    \ built your /etc/ford/router.conf file, the only step remaining is to configure\
    \ the actual devices. This is a little trickier than a normal network device configuration.\
    \ Remember to bring up the FRAD device by the DLCI encapsulation devices. These\
    \ are best hosted in a shell script because of their:\n\n```bash\n#!/bin/sh\n\
    # Configure the frad hardware and the DLCI parameters\n# sbin/cfg /etc/router.conf\
    \ || exit 1\n# sbin/dlicfg /etc/router.conf\n\n# Bring up the FRAD device\nifconfig\
    \ sda0 up\n\n# Configure the DLCI encapsulation interfaces and routing\nifconfig\
    \ dlci100 192.168.10.1 pointoint 192.168.10.2 up\nroute add -net 192.168.10.0\
    \ mask 255.255.255.0 dlci100\n\nifconfig dlci101 192.168.11.1 pointoint 192.168.11.2\
    \ up\nroute add -net 192.168.11.0 mask 255.255.255.0 dlci100\n\nroute add default\
    \ dlci100\n```\n\n# 12.8. IPX (AF_IPX)\n\nThe IPX protocol is most utilized in\
    \ Novell NetWare(tm) local area network environments. Linux includes support for\
    \ this protocol, and it may be configured to act as a network endpoint (or, as\
    \ a router for IPX).\n\n## Kernel Compile Options:\n\n```\nNetworking options\
    \ --->\n[*] The IPX protocol\n[] Full internal IPX network\n```\n\nThe IPX protocol\
    \ and the NCPFS are covered in greater depth in the IPX–HOWTO.\n\n# 12.9. NetRom\
    \ (AF_NETROM)\n\nNetRom device names are `nr0`, `nrl1`, etc.\n\n## Kernel Compile\
    \ Options:\n\n```\nNetworking options --->\n[*] Amateur Radio AX.25 Level 2\n\
    [*] Amateur Radio NET/ROM\n```\n\nThe AX25, and Rose protocols are covered by\
    \ the AX25–HOWTO. These protocols are used by Amateur Radio Operators wide in\
    \ packet experiment.\n\nMost of the work for implementation of these protocols\
    \ has been done by Jonathon Naylor, jsn@cs.nott.ac.uk.\n\n# 12.10. Rose protocol\
    \ (AF_ROSE)\n\nRose device names are `rs0`, `rsl`, etc. in 2.1.* kernels. Rose\
    \ is available in the 2.1.* kernels.\n\n## Kernel Compile Options:\n\n```\nNetworking\
    \ options --->\n[*] Amateur Radio AX.25 Level 2\n<*> Amateur Radio X.25 PLP (Rose)\n\
    ```\n\nThe AX25, Netrom and Rose protocols are covered by the AX25–HOWTO. These\
    \ protocols are used by Amateur Radio Operators wide in packet experiment.\n\n\
    Most of the work for implementation of these protocols has been done by Jonathon\
    \ Naylor, jsn@cs.nott.ac.uk.\n\n# 12.11. SAMBA – ‘NetBEUI’, ‘NetBios’, ‘CIFS’\
    \ support.\n\nSAMBA is an implementation of the Session Management Block protocol.\
    \ SAMBA allows Microsoft and other systems to use disks and printers.\n\nSAMBA\
    \ and its configuration are covered in detail in the SMB–HOWTO.\n\n# 12.9. NetRom\
    \ (AF_NETROM)\n\n# 12.12. STIP (Serial Terminal IP)\n\nSTIP device names are `st0`,\
    \ `st1`, etc.\n\n## Kernel Compile Options:\n\n```\nNetworking options --->\n\
    [*] Network device support\n...\n[*] Radio network interfaces\n<*> STIP support\n\
    ```\n\nSTIP is a protocol designed (specifically for serial modems) for research\
    \ conducted by Stanford University. There are typically capable of about 100kbps.\n\
    \nThe standard network tools do not support ARP, so you must manually configure\
    \ the ARP entries for each of the hosts on your subnet. This shouldn't prove too\
    \ onerous.\n\n# 12.13. Token Ring\n\nToken ring device names are `tr0`, `tr1`.\
    \ Token Ring is an IBM standard protocol that avoids collisions by using a mechanism\
    \ that allows one station on the LAN to transmit at a time. A `token` is held\
    \ by one station. This station is the only one allowed to transmit. When it has\
    \ transmitted its data, it then passes the token onto the next station. The token\
    \ loops amongst all active stations; hence the name Token Ring.\n\n## Kernel Compile\
    \ Options:\n\n```\nNetworking options --->\n[*] Network device support\n...\n\
    [*] Token Ring support\n<*> IBM chipset based adaptor support\n```\n\nConfiguration\
    \ of token ring is identical to that of ethernet for network device.\n\n# 12.14.\
    \ X25\n\nX25 is a circuit based packet switching protocol defined by the C.C.I.T.\
    \ (a standards body recognized by Telecommunications in most parts of the world).\
    \ Implementations of X25 and LAPB are currently being worked on, and recent 2.1*\
    \ kernels handle the work in progress.\n\nNathan Naylor jsn@cs.nott.ac.uk is leading\
    \ the development. A mailing list has been established to discuss Linux X25 related\
    \ matters. If you like to subscribe, send a message to: majordomo@vger.rutgers.edu.\
    \ Be sure to include the text \"subscribe linux-x25\" in the body of the message.\n\
    \nEarly versions of the configuration tools may be obtained from Jonathon's ftp\
    \ site at ftp.cs.nott.ac.uk.\n\n# 12.15. WaveLan Card\n\nWaveLan device names\
    \ are `eth0`,`eth1`, etc.\n\n## Kernel Compile Options:\n\n```\nNetworking options\
    \ --->\n[*] Network device support\n[*] Radio network interfaces\n<*> WaveLan\
    \ support\n```\n\nThe WaveLan card is a spread spectrum wireless lan card. The\
    \ card looks very much like an ethernet card, and it is configured in much the\
    \ same manner.\n\nYou can get information on the WaveLan card from Wavelan.com.\n"
