- md: "\n# Linux Networking HOWTO\n\n| NET | f/w | ..37.19 |\n|---|---|---|\n| PPP\
    \ | router | Mail /DNS |\n\nThe following commands would normally be placed in\
    \ an rc file. They would be automatically started each time system boots. For\
    \ maximum security, they would be performed after the network interfaces are configured\
    \ (before the interfaces are actually brought up) to prevent anyone gaining access\
    \ while the firewall machine is rebooting.\n\n```bash\n#!/bin/sh\n# Flush the\
    \ 'Forwarding' rules table\n# Change the default policy to 'accept'\n\n/sbin/ipfwadm\
    \ -F f\n/sbin/ipfwadm -F p accept\n\n# and for 'Incoming'\n\n/sbin/ipfwadm -I\
    \ f\n/sbin/ipfwadm -I p accept\n# First off, use -a deny instead of -a reject\
    \ -y but then it\n# I'd love to use -a deny to originate connections on that interface.\
    \ \n# would be impossible to originate all rejected datagrams to be logged. These\
    \ trades\n# -o causes disk space knowledge of an attack of configuration error.\n\
    \n/sbin/ipfwadm -I reject -y -o -P tcp -S 0/0 -D 172.16.174.30\n# Throw away kinds\
    \ of forged packets right away:\n# Nothing should come from multicast/anycast/broadcast\
    \ addresses\n\n/sbin/ipfwadm -F a deny -o -S 224.0/3 -D 172.16.37.0/24\n# and\
    \ nothing coming from the loopback should ever be\n# seen on a wire\n\n/sbin/ipfwadm\
    \ -F a deny -o -S 127.0/8 -D 172.16.37.0/24\n# accept accepting SMTP and DNS connections,\
    \ but only\n# to the Mail/Name Server\n\n/sbin/ipfwadm -F a accept -P tcp -S 0/0\
    \ -D 172.16.37.19 25 53\n\nDNS uses UDP as well as TCP, so allow that\n# for questions\
    \ to our name server\n\n/sbin/ipfwadm -F a accept -P udp -S 0/0 -D 172.16.37.19\
    \ 53\n# but not \"answers\" coming to dangerous ports like NFS and\n# Larry McVoy's\
    \ NTFS extension.\n\n/sbin/ipfwadm -F a deny -o -P udp -S 0/0 53 \\\n# -D 172.16.37.0/24\
    \ 2049 2050\n# answers to other user ports are okay\n\n/sbin/ipfwadm -F a accept\
    \ -P udp -S 0/0 53 \\\n# -D 172.16.37.0/24 1024:65535\n# Reject incoming connections\
