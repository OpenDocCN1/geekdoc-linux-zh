    \n要操纵此表，使用一种特殊的命令。该命令接收行参数并将其转换为内核，以便在路由表中添加、删除或修改条目。该命令称为 `route`。这里有一个简单的示例。假设您有一个以太网网络。您被告知它是一个\
    \ C 类网络，地址为 192.168.1.0。您被分配了一个 IP 地址 192.168.1.10 供使用，并且被告知 192.168.1.1 是连接到网络的路由器。第一步是按照之前的描述配置接口。您现在需要将您的条目添加到路由表中，告诉内核对于所有地址匹配\
    \ 192.168.1.* 的主机，数据文都去这里。您将使用类似下面的命令：\n\n```\nroot# ifconfig eth0 192.168.1.10\
    \ netmask 255.255.255.0 up\n```\n注意使用 `-net` 路由来告诉程序该条目是一个网络。您在这里选择的是 `-host`\
    \ 路由，即特定于一个 IP 地址的路由。此路由将启用与您以太网段上所有主机的连接。但所有不在您以太网段上的主机又该如何？为每个目标网络添加路由将是一项艰巨的工作。有一个特殊的技巧可以简化这项任务。该路由被称为\
    \ `default`（默认）路由。`default` 路由匹配可能的目的地。如果存在任何其他匹配所需地址的条目，它将取代默认路由使用。默认路由的想法简单足以实际上表示为：“其他所有内容都应该去这里”。在示例中，您使用如下的条目：\n\
