- md: "\n## 7.2. EQL – multiple line equaliser\n\nThe EQL device name is `eql`. With\
    \ the standard kernel source, you may have only one EQL device per machine. EQL\
    \ provides a means of utilizing Point-to-point lines like PPP, slip or as a single\
    \ logical link for tcp/ip. It is cheaper to use multiple lower speed lines than\
    \ to have one high speed line installed.\n\nKernel Compile Options:\n\n```\nNetwork\
    \ device support --->\n[*] Network device support\n<*> EQL (serial line balancing)\
    \ support\n```\n\nTo support this mechanism, the machine at the other end of the\
    \ lines must also support EQL. Linux, Livingston Postmasters and dial-in servers\
    \ support compatible facilities.\n\nTo configure EQL you will need the eql tools\
    \ which are available from metalab.unc.edu.\n\nConfiguration is fairly straightforward.\
    \ You start by configuring the eql interface. The eql interface is like any other\
    \ network device. You configure the IP address and mtu using the ifconfig utility.\
    \ Here is an example:\n\n```\nroot# ifconfig eql 192.168.10.1 mtu 1006\n```\n\n\
    Next, you need to manually initiate each of the lines you use. These may be any\
    \ combination of Point-to-Point network devices. How you initiate the connections\
    \ will depend on what sort of link they are. Refer to the appropriate sections\
    \ for further information.\n\nLastly you need to associate the serial link with\
    \ the eql device. This is called `enslaving`: it is done with the eql_ensave command\
    \ as shown:\n\n```\nroot# eql_ensave eql sl0 28800\nroot# eql_ensave eql ppo 14400\n\
    ```\n\nThe `estimated speed` parameter you specify eql_ensave does not directly\
    \ anything. It is used by the E driver to manage what share of the data that device\
    \ should receive. You can then tune the balancing of the lines by playing with\
    \ this value.\n\nTo dissociate a line from an eql device, the eql_emancipate command\
    \ as shown:\n\n```\nroot# eql_emancipate eql sl0\n```\n\nYou are adding route\
    \ for any other Point-to-Point link, except that your routes should refer to the\
    \ eql device rather than the actual serial device. You would typically use:\n\n\
    ```\nroute# addthemselfseq\n```\n\nThe eql driver was developed by Simon Janes\
    \ simon@ncm.com.\n\nWas this section helpful? Why not Donate $2.50?\n\n# Linux\
    \ Networking HOWTO\n\n## 7.3. IP Accounting (for Linux–2.0)\n\nThe IP accounting\
    \ features of the kernel allow you to collect and analyze some network usage data.\
    \ The data collected comprises the number of packets and the number of bytes accumulated\
    \ since the figures last reset. You may specify a variety of rules to categorize\
    \ the features suit your purpose. This option has been removed in kernel 2.1.102\
    \ because the old ipfwadm–based firewalling was replaced by `ipfwchains`.\n\n\
    Kernel Compile Options:\n\n| Networking options ----|\n| [* IP: accounting   \
    \  |\n\nAfter you have compiled and installed the kernel, you need to use the\
    \ ipfwadm command to configure IP accounting. There are many different ways of\
    \ breaking down the accounting information. I've picked a simple example of what\
    \ might be useful. You should read the ipfwadm man page for more information.\n\
    \nScenario: You have an ethernet network that is linked to the Internet via a\
    \ PPP link. On the ethernet, a machine that offers yours of services. You are\
    \ interested in knowing how much traffic is generated by each ftp (and world web\
    \ traffic), as well as total tcp and udp traffic.\n\nYou might use a command that\
    \ looks like the following (as a shell script):\n\n```bash\n#!/bin/sh\n#\n# Flush\
    \ the accounting rules\nipfwadm -A -f\n#\n# Set shortcuts\nlocalnet=44.136.8.96/29\n\
    any=0\n# Add rules for local ethernet segment\nipfwadm -A in -a -P tcp -D localnet\
    \ ftp-data\nipfwadm -A out -a -P tcp -S localnet ftp-data\nipfwadm -A in -a -P\
    \ tcp -D localnet www\nipfwadm -A out -a -P tcp -S localnet www\nipfwadm -A in\
    \ -a -P tcp -D localnet\nipfwadm -A out -a -P tcp -S localnet\nipfwadm -A in -a\
    \ -P udp -D localnet\nipfwadm -A out -a -P udp -S localnet\n#\n# Rules for default\n\
    ipfwadm -A in -a -P tcp -D any ftp-data\nipfwadm -A out -a -P tcp -S any ftp-data\n\
    ipfwadm -A in -a -P tcp -D any www\nipfwadm -A out -a -P tcp -S any www\nipfwadm\
    \ -A in -a -P tcp -D any\nipfwadm -A out -a -P tcp -S any\nipfwadm -A in -a -P\
    \ udp -D any\nipfwadm -A out -a -P udp -S any\n#\n# List the rules\nipfwadm -A\
    \ -1l -n\n```\n\nThe names `ftp-data` and `www` refer to lines in /etc/services.\
    \ The last command lists each of the accounting rules and displays the collected\
    \ totals.\n\nAn important point to note when analyzing IP accounting is that totals\
    \ for all rules that will be incremented. If I wanted to obtain differential figures,\
    \ you need to perform appropriate methods. For example, if I wanted how much data\
    \ was not ftp or wip, I would subtract the individual totals from the rule that\
    \ matches all packets.\n\n```\nroot# ipfwadm -A -1 -n\nIP accounting rules\npkts\
    \ bytes dir source destination ports\n0 0 in tcp 0.0.0.0/0 44.136.86/29 * -> 20\n\
    0 0 out tcp 44.136.86/29 0.0.0.0/0 * *\n10 1166 in tcp 0.0.0.0/0 44.136.86/29\
    \ * -> 80\n10 572 out tcp 44.136.86/29 0.0.0.0/0 * *\n252 10943 in tcp 44.136.86/29\
    \ 0.0.0.0/0 * *\n231 18831 out tcp 44.136.86/29 0.0.0.0/0 * *\n```\n\n## 7.4.\
    \ IP Aliasing\n\nThere are applications where able to have multiple addresses\
    \ to a single device is useful. Service Providers often use this for their customers.\
    \ For example, assume you have a network that supports two different subnets.\
    \ You also wish to have direct access to both. You could use something like:\n\
    \n```\nifconfig eth0:0 192.168.1.1 netmask 255.255.255.0 up\nroute add -net 192.168.1.10\n\
    ```\n\nNote that the devname:0 can only be configured after the main interface\
