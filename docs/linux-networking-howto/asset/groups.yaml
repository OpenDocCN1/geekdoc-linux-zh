    \ Information Protocol\n```\n\nThe next step is to create the Appletalk configuration\
    \ files in the /usr/local/atalk/etc directory or\nwherever you installed the package.\n\
    \nThe first file to create is /usr/local/atalk/etc/atd.conf. This file initially\
    \ needs only\none line. This line gives the name of the network device supporting\
    \ the network that your Apple machines are\n\n```\neth0\n```\n\nThe Appletalk\
    \ daemon program will add extra details after it has been initiated.\n\n## 12.2.2.\
    \ Exporting a Linux filesystems via Appletalk.\n\nYou can export systems from\
    \ your Linux machine to the network so that any Apple machine on the\nnetwork\
    \ can share them.\n\nTo do this you must configure the /usr/local/atalk/etc/AppleVolumes.system\
    \ file. There is\nanother configuration file called /usr/local/atalk/etc/AppleVolumes.default\
    \ This file has\nexactly the same format: it describes which filesystems users\
