    ## 9.3. 在内核 2.2 中使用 NAT


    网络地址转换（NAT）功能几乎是 IP 伪装（IP Masquerade）功能的标准“大哥”。它在 RFC-1631（可在你最近的 RFC 归档中找到）中有详细说明。NAT
    提供了 IP 伪装所具备的功能（这使其完全适用于企业防火墙路由器和更大规模的实现）。


    Michael.Hastenstein 为 Linux 2.0.29 内核开发了 NAT 的 alpha 实现。Michael.Hasten@informatik.tu-chemnitz.de。Michael
    的文档和实现可以从以下处获取：


    Linux IP Address Web Page


    Linux 2.2 内核改进的 TCP/IP 栈内置了 NAT 功能。这项功能似乎被 Michael Hastenstein 认为已经过时（Michael.Hasten@informatik.tu-chemnitz.de）。


    要让其工作，你需要在内核中启用 `CONFIG_IP_ADVANCED_ROUTER`、`CONFIG_IP_MULTIPLE_TABLES`（作为路由）以及
    `CONFIG_IP_ROUTE_NAT`（即 NAT）。如果你想使用细粒度的 NAT 规则，可能需要开启防火墙（`CONFIG_IP_FIREWALL`）和
    `CONFIG_IP_ROUTE_FWMARK`。要实际操作这些内核功能，你需要来自 ftp://ftp.in.ac.ru/ip-routing/ 的 Alexei
    Kuznetsov 的“ip”路由。


    入站数据报 NAT


    现在，使用以下命令来翻译入站数据报的地址：


    ```

    ip route add nat <ext-addr>/<masklen> via <int-addr>

    ```


    ## Linux 网络 HOWTO


    这将使目标为“ext-addr”（从外部互联网可见的地址）的入站数据包的目的地址重写为“int-addr”（你内部网络中、位于网关/防火墙后的地址）。然后数据包将根据本地路由表进行路由。你可以翻译单个主机地址或整个地址块。示例如：


    ```

    ip route add nat 195.113.148.34 via 192.168.0.2

    ip route add nat 195.113.148.32/27 via 192.168.0.0

    ```


    第一个命令将使内部地址 192.168.0.2 可以作为 195.113.148.34 使用。第二个示例显示了将地址块 192.168.0.0–31 映射到
    195.113.148.32–63。


