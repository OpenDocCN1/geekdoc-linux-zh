    \ information\n\nFor a much more detailed description of how to configure Appletalk\
    \ for Linux, refer to Anders Brownworth Linux Netatalk–HOWTO page at thehamptons.com.\n\
    \n## 12.3. ATM\n\nWerner Almesberger <werner.almesberger@lrc.di.epfl.ch> is managing\
    \ a project to provide Asynchronous Transfer Mode support for Linux. Current information\
    \ on the status of the project may be obtained from: lrc.epfl.ch. Was this helpful?\
    \ Why not Donate $2.50?\n\n## 12.4. AX25 (AF_AX25)\n\nAX25 device names are 's10',\
    \ 's11', etc. in 2.0.* kernels or `ax0`,`ax1`, etc. in 2.1.* kernels.\n\nKernel\
    \ Compile Options:\n\n```\nNetworking options --->\n[*] Amateur Radio AX25 Level\
    \ 2\n```\n\nThe AX25, Netrom and Rose protocols are covered by the AX25-HOWTO.\
    \ These protocols are used by Amateur Radio Operators operate wide in packet radio\
    \ equipment.\n\nMost of the work for implementation of these protocols has been\
    \ done by Jonathan Naylor: jsn@cs.nott.ac.uk. Was this helpful? Why not Donate\
    \ $2.50?\n\n## 12.5. DECNet\n\nSupport for DECNet is currently a work in progress.\
    \ You should expect it to appear in a late 2.1.* kernel. Was this section helpful?\
    \ Why not Donate $2.50?\n\n## 12.6. FDDI\n\nFDDI device names are `fddi0`,`fddi1`,`fddi2`\
    \ etc. The first card detected by the kernel is assigned `fddi0`: the rest are\
    \ assigned sequentially in the order that they detected. Larry Stefani, stani@ultranet.com,\
    \ has developed a driver for the Digital Equipment Corporation FDDI EISA and PCI\
    \ cards.\n\nWhen you have your kernel built and installed to use the FDDI driver,\
    \ configuration of the FDDI interface is almost identical to that of an ethernet\
    \ interface. You just specify the particular FDDI name in the `ifconfig` and route\
    \ commands.\n\nKernel Compile Options:\n\n| Network device support | FDDI support\
    \ |\n| :--- | :--- |\n| [* FDDI driver | |\n| [* Digital and adapter support |\
    \ |\n\n## 12.7. Frame Relay\n\nFrame Relay device names are `dlci0`,`dlci01` etc,\
    \ and `sdla0`,`sdla1` etc for DLCI encapsulation. Frame Relay is a new networking\
    \ technology that is designed to support data communications that are bursty or\
    \ intermittent. You connect to a Frame Relay network (FRAD). The Linux Frame Relay\
    \ supports IP over Frame Relay as described in RFC–1490.\n\nCurrently the only\
    \ cards I know of supported are Sangoma S502A, S502E, S508.\n\nKernel Compile\
    \ Options:\n\n| Network device support | Frame relay DLCI support |\n| :--- |\
    \ :--- |\n| | (EXPERIMENTAL) |\n| (24) Max DLCI |\n| (8) Max DLCI per device |\n\
    | SDLA (Sangoma S502/S508) support |\n\nMike McLagan, mclagan@linux.org, developed\
    \ the Frame Relay support and configuration. The Emerging Technologies website\
    \ is found at: I would like to make a point at this juncture. I have personal\
