    ## Chapter 13. Cables and Cabling


    Those who wish with a soldering iron may want to build your own cables to interconnect
    two linux machines. The following cabling diagrams should assist you with your
    little project.


    ### 13.1. Serial NULL Modem cable


    Not all NULL modem cables are alike. Many null modem cables do little more than
    trick your computer into thinking all the appropriate signals are present (and
    swap transmit and receive data). This is ok, but it means you must use software
    flow control (XON/XOFF) is less efficient than hardware flow control. The following
    cables provide the best possible signalling between machines, and it allows you
    to use hardware (RTS/CTS) flow control.


    | Pin Name | Pin | Pin |

    |---|---|---|

    | Tx Data | 2 | 3 |

    | Rx Data | 3 | 2 |

    | | 4 | 5 |

    | CTS | 5 | 4 |

    | Ground | 7 | 7 |

    | DTR | 20 | 8 |

    | DSR | 6 | 20 |

    | RLSD/DCD | - | 6 |


    ### 13.2. Parallel port cable (PLIP cable)


    If you intend to use the PLIP protocol between two machines, this cable will work
    for you (irrespective of what sort of parallel ports you have installed).


    | Pin Name | pin | pin |

    |---|---|---|

    | STROBE | 1* | |

    | D0->ERROR | 2 | 15 |

    | D1->SLCT | 3 | 13 |

    | D2->PAEOUT | 4 | 12 |

    | D3->ACK | 5 | 10 |

    | D4->BUSY | 6 | 11 |

    | D5 | 7* | |

    | D6 | 8* | |

    | D7 | 9* | |

    | ACK->D3 | 11 | 5 |

    | BUSY->D4 | 12 | 6 |

    | PAEOUT->SLCT | 13 | 3 |

    | ->FEED | 14* | |

    | ERROR->D0 | 15 | 2 |

    | INIT | 16* | |

    | SCTLIN | | |

    | GROUND | 25 | 25 |


    Notes:


    - Do not connect the pins marked with an asterisk ''*''.

    - Extra grounds are 18,19,20,21,22,23 and 24.

    - If the cable you are using has a metallic shield, it should be connected to
    the metallic DB-25 shell at one end only.


    Warning: A miswired PLIP cable can destroy your controller card. Be very careful!
    Be sure to check every connection to ensure that you don''t cause yourself unnecessary
    work or heartache.


    While you may be able to run PLIP cables for long distances, you should avoid
    it if you can. The specifications for the cable allow for a cable length of 1
    meter or so. Please be very careful when running long PLIP cables as sources of
    strong electromagnetic fields (such as lightning, power lines, and radio transmitters)
    can interfere with and sometimes damage your controller. If you really want to
    connect two of your computers over a large distance, then you should really be
    looking at a pair of thin-net ethernet cards (and running some coaxial).


    ### 13.3. 10base2 (thin coax) Ethernet Cabling


    10base2 is an ethernet cabling standard that uses the 50 ohm coaxial cable that
    has a diameter of about 5 millimeters. There are a couple of important rules to
    remember when interconnecting machines with 10base2 cabling. The first is that
    you use terminators at both ends of the cable. A terminator is a 50 ohm resistor
    that helps to ensure the signal is absorbed (and not reflected) when it reaches
    the end of the cable. A terminator at each end of the cable, you may find that
    the ethernet is unreliable (or doesn''t work). You would use `T` pieces to interconnect
    the machines. You would end up with something that looks this:


    ```

    |=========|=========|=========||

    |         |         |         ||

    |    T    |    T    |    T    ||

    |         |         |         ||

    |=========|=========|=========||

    |         |         |         |

    ```


    The `T` at either end represents a terminator, and the `T piece` represents a
    length of coaxial cable with BNC plugs at each end. You should keep the length
    of cable between the `T piece` and the ethernet card in the PC as short as possible.
    The `T piece` will ideally be plugged directly into the ethernet card.


    ### 13.4. Twisted Pair Ethernet Cable


    If you have only two twisted pair ethernet cards (and you wish to connect them),
    you do not require a hub. You can connect the two cards directly together. A diagram
    showing how to do this is included in the Ethernet-HOWTO.


    ## Chapter 14. Glossary of Terms used in this document.


    The following is a list of some of the most important terms used in this document.


    ### ARP


    This is an acronym for the Address Resolution Protocol. It is how a network machine
    associates an IP Address with a hardware address.


    ### ATM


    This is an acronym for Asynchronous Transfer Mode. An ATM network packages data
    into standard size blocks which it can convey efficiently from point to point.
    ATM is a circuit switched packet network technology.


    ### Client


    This is usually the piece of software at the end of a system where the user is
    located. There are exceptions. For example, in the X11 window system, it is actually
    the user and the client runs on the remote machine. The client is the program
    (or end) of a system that is receiving the service provided by the server. In
    the case of peer to peer systems such as slip or ppp, the client is taken to be
    the end that initiates the connection. The remote end being called is taken to
    be the server.


    ### Datagram


    A datagram is a discrete package of data and headers which contain addresses (which
    is the basic unit of transmission across an IP network). You might also hear this
    called a `packet`.


    ### DLCI


    The DLCI is the Data Link Connection Identifier. It is used to identify a virtual
    Point-to-Point connection via a Frame Relay network. The DLCI''s are normally
    assigned by the Frame Relay network.


    ### Frame Relay


    Frame Relay is a network technology ideally suited to carrying traffic that is
    of bursty or sporadic in nature. Network costs are reduced by having many Frame
    Relay customer sharing the same network capacity (and relying on them wanting
    to use the network at slightly different times).


    ### Hardware address


    This is a number that uniquely identifies a host in a physical network at the
    media access layer. Examples of this are Ethernet Addresses and AX.25 Addresses.


    ### ISDN


    This is an acronym for Integrated Services Digital Network. ISDN provides a standardized
    means by which Telecommunications companies may deliver either voice or data information
    to customers premises. ISDN is technically a circuit switched data network.


    ### ISP


    This is an acronym for an Internet Service Provider. These are organizations or
    companies that provide people with network connectivity to the Internet.


    ### IP address


    This is a number that uniquely identifies a TCP/IP host on the network. The address
    is 4 bytes long and is usually represented in what is called the "dotted decimal
    notation" (where each byte is represented in decimal with dots between them).


    ### MSS


    The Maximum Segment Size (MSS) is the largest quantity of data that can be transmitted
    at one time. If you want to prevent local fragmentation, MSS would equal MTU–IP
    header.


    ### MTU


    The Maximum Transmission Unit (MTU) is a parameter that determines the largest
    datagram that can be transmitted by an IP interface (without needing to be broken
    down into smaller units). The MTU should be larger than the largest datagram you
    wish to transmit unfragmented. Note: this prevents fragmentation locally. Some
    other link in the path may have a smaller MTU: the datagram will be fragmented
    at that point. Typical values are 1500 bytes for an ethernet interface, or 576
    bytes for a SLIP interface.


    ### Route


    The route is the path that your datagrams take through the network to reach their
    destination.


    ### Server


    This is usually the piece of software or end of a system remote from the user.
    The server provides some service to one or many clients. Examples of servers include
    ftp, Networked File System, or Domain Name Server.


    ### Window


    The window is the largest amount of data that the receiving end can accept at
    a given point in time.

