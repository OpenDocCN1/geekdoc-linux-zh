    locates a match, it configures the line as an 8bit clean line. It uses an ioctl
    call to convert the line discipline to SLIP. When this process is complete, the
    last stage of configuration takes place. sliplogin invokes a script which configures
    the SLIP interface with the relevant address and netmask. It will also set appropriate
    routing in place. This script is usually called /etc/slip.login. In a similar
    manner to getty (where you have callers that create special initialization) you
    can create configuration scripts called /etc/slip.login.name. These scripts will
    be run instead of the defaults.


    There are three or four files that you need to configure for sliplogin working.
    I will detail where to obtain the software and how to configure in it. The files
    are:


    +   * /etc/passwd, for the dialer accounts.

    * /etc/slip.hosts, to contain the information unique to each dial-user.

    * /etc/slip.login, which manages the configuration of the routing that needs to
    be performed

    * /etc/slip.tty, which is required only if you are configuring your server for
    dynamic allocation. It contains a table of addresses to allocate.

    * /etc/slip.logout, which contains commands to clean up after the user has hung
    up or logged out.


    # 11.4.10. Where to get sliplogin


    You may have the sliplogin package installed as part of your distribution. If
    you do not have the package, you can get sliplogin from: metalab.unc.enc. The
