    ## Chapter 3. How to use this HOWTO.


    This document is organized top–down. The first sections include informative material,
    and it can be skipped if you are not interested; what follows is a generic discussion
    of networking issues, and you must ensure you understand this before proceeding
    to more specific parts. The `technology specific` information is grouped into
    three sections: Ethernet and IP-related information, technologies pertaining to
    widespread PC hardware, and seldom-used technologies.


    The suggested path through this document is follows:


    Read the generic sections:


    - These sections apply to almost every technology described in subsequent sections,
    and they are very important for you to understand. I expect many of the readers
    will be confident with this material.


    Consider your network:


    - You should know how your network is (or will be) designed, and you should also
    be familiar with exactly what hardware and technology types you will be implementing.


    If you are directly connected to a LAN or the Internet, please refer to the "Ethernet
    and IP" section:


    - This section describes basic Ethernet configurations, and it describes the various
    features that Linux offers for IP networking (ie: firewall, advanced routing,
    etc.).


    If you are interested in low-cost local networks or dial-up connections, please
    refer to the next section


    - This section describes the widespread technologies used on personal workstations
    (ie: PLIP, PPP, SLIP, and ISDN).


    Please refer to the technology–specific sections that are related to your requirements:


    - Your needs may differ from IP and/or more common hardware. This final section
    covers specific to both non-IP protocols and to peculiar communication hardware.


    Do the configuration work:


    - You should actually try to configure your network. Take careful note of any
    existing problems


    Look for further help:


    - If you experience problems that document does not help you to resolve, then
    you should refer to the sections related to "Help" and "Where to report bugs".


    Have fun!


    Networking is fun! Enjoy it!


    ## 3.1. Conventions used in this document


    No special conventions are used here, but you must be warned about the way commands
    are shown. This howto follows the classic Unix documentation: any command you
    type to your shell is prefixed by a prompt. It shows `user%` as the prompt for
    commands that do not require superuser privileges, and `root#` as the prompt for
    commands that need to run as root. I chose to use `root#` instead of a plain `#`
    to prevent confusion with snapshots from shell scripts (where the hash mark is
    used to define comment lines).


    When `Kernel Compile Options` are shown, they are represented in the format using
    `menuconfig`. They should be understandable even if you (like me) are not used
    to `menuconfig`. If you are in doubt about the options’ nesting, running the program
    once can always help. [Was this section helpful? Why not Donate $2.50?]


    ## Chapter 4. General Information about Linux Networking.


    ### 4.1. Linux Networking Resources.


    There are a number of places where you can find good information about Linux networking.


    There is a wealth of Consultants available to assist you. A searchable listing
    can be found at: [http://www.linuxports.com/](http://www.linuxports.com/).


    Alan Cox, the current maintainer of the Linux kernel networking code, maintains
    a world wide web page highlights of current and new developments in Linux Networking:
    [www.uk.linux.org](http://www.uk.linux.org).


    There is a newsgroup in the Linux hierarchy dedicated to Linux networking and
    related matters at this location: [comp.os.linux.networking](http://comp.os.linux.networking).


    You can also subscribe to a mailing list where you may ask questions relating
    to Linux networking. Send an email message for a subscription to:


    ```

    To: majordomo@vger.rutgers.edu

    Subject: anything at all

    Message:

    subscribe linux-net

    ```


    Please remember to include as much detail about the problem as possible. You should
    specify the versions of software that you use (especially the kernel version),
    the version of tools such as pppd/dip, and the exact nature of the problem(s)
    that you are experiencing. This means you should take notes of both the exact
    syntax of error message(s) you receive, and of any commands that you are issuing.
    [Was this section helpful? Why not Donate $2.50?](https://example.com)


    ### 4.2. Sources of non–linux–specific network information.


    If you are after some basic tutorial on tcp/ip networking, I recommend you take
    a look at the following documents:


    tcp/ip introduction:


    This document comes as both a [text version](http://example.com) and a [postscript
    version](http://example.com).


    tcp/ip administration:


    This document comes as both a [text version](http://example.com) and a [postscript
    version](http://example.com).


    If you are after some detailed information on tcp/ip networking, I then highly
    recommend:


    > “Inter networking with TCP/IP”


    If you are wanting to learn about how to write network applications in a Unix
    compatible environment, I recommend:


    *Unix Network Programming,* by W. Richard Stevens, ISBN 0–13–949876–1, Prentice
    Hall Publications, 1990.


    A second edition of this book is appearing on the bookshelves. The new book is
    made up of three volumes. Check [Prentice-Hall''s web site](http://www.prentice-hall.com)
    for further details.


    You might also try the [comp.protocols.tcp-ip](mailto:comp.protocols.tcp-ip@example.com)
    newsgroup.


    RFC is an acronym for ''Request For Comment'' and it is the standard means of
    submitting and documenting Internet protocols. There are many RFC repositories.
    One possible source for RFCs is at [www.rfc.org](http://www.rfc.org). Others provide
    sites. [Was this section helpful? Why not Donate $2.50?](http://example.com)


    ## Chapter 5. Generic Configuration Information.


    You will pretty much need to know and understand the following subsections before
    you actually try to configure your network. They are fundamental principles that
    apply regardless of the exact nature of the network.


    ### 5.1. What do I need to start?


    Before you building or configuring your network, you will need certain items.
    The most important of these are:


    #### 5.1.1. Current Kernel source(Optional).


    The majority of current distributions come with networking enabled. It may not
    be required to recompile the kernel. If you are running well known hardware should
    be fine. For example: 3COM NIC, NE2000 NIC, or an Intel NIC. However, if you find
    yourself in the position that you need to update the kernel, you will probably
    need the kernel source to recompile the kernel with the appropriate options.


    For users of major distributions such as Redhat, Caldera, Debian, or Suisse, this
    no longer holds true. As long as you stay within the mainstream of hardware, there
    should be no need to recompile your kernel.


    You can always obtain the latest kernel source from ftp.cdrom.com. This is not
    the official site, but they have LOTS of bandwidth and capacity. The official
    site is kernel.org, however, please use the URL if you wish. Please remember that
    ftp.kernel.org is seriously overloaded. Use a mirror.


    Normally the kernel source will be untared into the /usr/src directory. For information
    on how to apply patches and build the kernel, you should read the Kernel-HOWTO.
    For information on how to configure kernel modules, you should read the "Modules
    mini-HOWTO". The README found in the kernel sources and Documentation directory
    are informative: for the brave reader!

    '
