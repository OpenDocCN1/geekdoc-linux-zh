    \ an especially slow computer. When this comes to timers increase are actual on\
    \ the other computer. A program called plipconfig allows you to change these timer\
    \ settings without recompiling your kernel. This program is supplied with many\
    \ Linux distributions.\n\nTo configure a PLIP interface, you will need to follow\
    \ the following commands (or add them to your initialization scripts):\n\n```\n\
    # /sbin/ifconfig plip localplip point remoteplip\n# /sbin/route add remoteplip\
    \ plip\n```\n\nHere, the port being used is at I/O address 0x378; localplip and\
    \ remote-plip are the names or IP addresses used over the PLIP cable. I personally\
    \ keep them in my /etc/hosts database:\n\n```\n# plip entries\n192.168.3.1 localplip\n\
    192.168.3.2 remoteplip\n```\n\nThe pointpoint parameter has the same meaning as\
    \ SLIP. It specifies the address of the machine at the other end of the link.\n\
