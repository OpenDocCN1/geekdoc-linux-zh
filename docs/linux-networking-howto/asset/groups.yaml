    Once you have your kernel properly to support your ethernet card, configuration
    of the card is easy. Typically you would use something like (which distributions
    do for you, if you configured them to support your ethernet):


    ```

    root# ifconfig eth0 192.168.0.1 netmask 255.255.255.0 up

    root# route add -net 192.168.0.0 netmask 255.255.255.0 eth0

    ```


    Most of the ethernet drivers were developed by Donald Becker. Was this section
    helpful? Why not Donald S.50?


    ## 6.3. Using 2 or more Ethernet Cards in the same machine


    ### 6.3.1. If your driver is a module (Normal with newer distros)


    The module will typically detect all of the installed cards. Information from
    the detection is stored in the file:


    /etc/conf.modules.


    Consider that a user has 3 NE2000 cards, one at 0x300 one at 0x240, and one at
    0x220. You would add the following lines to the /etc/conf.modules file:


    ```

    alias eth0 ne

    alias eth1 ne

    alias eth2 ne

    options io=0x220,0x240,0x300

    ```


    What does this tell the program modprobe to look for 3 NE based cards at the following
    addresses. It also states in which order they should be found and the device they
    should be assigned.


    Most ISA modules can take multiple separated I/O values. For example:


    ```

    alias eth0 3c501

    alias eth1 3c501

    options eth0 -o 3c501-0 io=0x280 irq=5

    options eth1 -o 3c501-1 io=0x300 irq=7

    ```


    The -o option allows for a unique name to assign to each module. The reason for
    this is that you can not have two copies of the same module loaded.


    The irq- option is used to specify the hardware IRQ, and the io= to specify the
    different io ports.


    By default, the Linux kernel only probes one for Ethernet device. You need to
    pass command line arguments to the kernel in order to force detection of further
    boards. To learn further your ethernet card(s) work under Linux, you should refer
    to the Ethernet-HOWTO.


    ## Chapter 7. IP Related Information


    This section covers information specific to IP.


    ### 7.1. Kernel Level Options


    This section includes information on setting IP options within the kernel at boot
    time. An example of these options are **ip_forward** or **ip_bootp_agent**. These
    are used by setting the value to a file in


    /proc/sys/net/ipv4/

    The name of the file is the name of the command.


    For example, to set **ip_forward enabled**, you would type


    ```

    echo 1 > /proc/sys/net/ipv4/ip_forward

    ```


    ### 7.1.1. General IP option listing


    - ip_forward: If **ip_forward** is set to 0 it is disabled. If it is forwardany
    other number it is enabled. This option is used in conjunction with technologies
    such as routing between interfaces with IP Masquerading.

    - ip_default_ttl: This is the time to live for an IP Packet. The default is 64.

    - ip_addmask_agent - BOOLEAN: Reply to ICMP ADDRESS MASK requests. default TRUE
    (router) FALSE (host)

    - ip_bootp_agent - BOOLEAN: Accept packets with source address of 0.b.c.d and
    destined to this host, broadcast or multicast. Such packets are silently ignored
    otherwise. default FALSE

    - ip_no_pmtu_disc - BOOLEAN: Disable Path MTU Discovery. default FALSE

    - ip_fib_model - INTEGER: 0 – (DEFAULT) Standard model. All routes are in class
    MAIN. 1 – default routes to class DEFAULT. This mode should be very convenient
    for small ISPs making policy routing. 2 – RFC1812 compliant model. Interface routes
    are in class MAIN.

    '
