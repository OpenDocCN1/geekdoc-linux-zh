    # 5.9. Other miscellaneous network related configuration files.


    There are a number of miscellaneous files relating to network configuration under
    linux that might be of interest. You may not need to modify these files, but it
    is worth describing so you know what they contain and why they are used.


    # 5.9.1. /etc/protocols


    The /etc/protocols file is a database that maps protocol id by protocol name.
    This is used by programmers to allow them to specify protocols by name in their
    programs. It is also used by some programs such as tcpdump to display names of
    numbers in their output. The general syntax of the file is:


    ```

    protocolname number aliases

    ```


    The /etc/protocols file supplied with the Debian distribution is as follows:


    5.9. Other miscellaneous network related configuration files.'
