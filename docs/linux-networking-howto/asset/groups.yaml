    entry that looked like:


    ```

    Sradio:Fvukuro73:1427:1:radio SLIP login:/tmp:/sbin/sliplogin

    ```


    It doesn''t really matter what the caller is called: just make they need any special
    home directory. They will not be presented with a shell from this machine, so
    /tmp is a good choice. Also note that sliplogin is used in place of the normal
    login shell.


    # 11.4.12. Configuring /etc/slip.hosts


    The /slip.hosts file is the file that sliplogin searches (it looks for entries
    matching the login name) to obtain configuration details for this particular caller.
    It is the file where you specify the ip address and netmask that will be assigned
    to the caller (configured for their use). Sample entries for two hosts: one is
    a static configuration for radio host, and another is a dynamic configuration
    for user host albert.Both might like:


    | | | | | | |

    |---|---|---|---|---||

    | Sradio | 44.136.8.99 | 44.136.8.100 | 255.255.255.0 | normal | -1 |

    | Salbert | 44.136.8.99 | DYNAMIC | 255.255.255.0 | compressed | 60 |


    The /slip.hosts file entries are:


    +   1. The login name of the caller.

    2. The ip address of the server machine (ie: this machine).

    3. If this field is DYNAMIC then an ip address will be allocated. This is based
    on the information contained in your /etc/slip.tty file (to be discussed). Note:
    you must be using at least version 1.3 of sliplogin for this to work.

    4. The netmask assigned to the calling machine in dotted decimal eg 255.255.255.0
    for a Class C network mask. Available values are either "normal" or "compressed".

    5. A timeout parameter which allows you to enable/disable slip and other features.
    how long the line can remain idle (no datagrams received) before the line is automatically
    disconnected. A negative value disables this to work.

    6. Optional arguments.


    Note: You can use hostnames or IP addresses (in dotted decimal notation) for fields
    2 and 3. If you use hostnames for addresses then those hosts must be resolvable.
    In other words, your machine must be able to locate an ip address for them. If
    the machine cannot locate an ip address, the script will fail when it is called.
    You can test this by trying to connect to the hostname. If you get the message
    `nnn.nnn.nnn...` then your machine has been able to find an ip address for that
    name. If you get the message `Unknown host`, then it was unsuccessful. In this
    case, you can use ip addresses in dotted decimal notation, or fix your name resolver
    configuration (See section Name Resolution).


    The most common slip modes are:


