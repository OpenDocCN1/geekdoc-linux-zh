    # 第 1 章 我可以如何提供帮助？


    我们将尝试对所有 Linux 网络实现提供全面的覆盖。然而，时间非常紧迫，而且本文并不是为了盈利的。我们提供这些信息是希望它们对 Linux 社区和新转换的
    Linux 用户都有用。我们始终对反馈感兴趣！我们在这个 HOWTO 文档中尽可能实现每一个主题。


    ## 1.1. 协助 Net–HOWTO


    如果你想协助本文，有两个主要的途径是非常有帮助。


    - 购买 OpenBook！如果你购买 OpenDocs 的书籍，OpenDocs 出版公司会将部分收益捐还给开源文档基金。该基金会在作者继续为开源项目编写文档时提供财务支持。

    - 为本文提供资金捐赠。通过贡献，你甚至可以请求在文档中更新、编写或扩展的内容。要提供资金捐赠，请联系 Command Prompt, Inc.。你也可以联系
    Joshua Drake。

    - 如果你写了想要贡献的内容，请将其发送至 poet@linuxports.com


    # 第 2 章 文档历史


    原始的 NET-FAQ 由 Matt Welsh 和 Terry Dawson 编写。NET-FAQ 回答了关于 Linux 网络的常见问题（在 Linux
    文档项目正式启动之前）。本文涵盖了 Linux 网络内核非常早期的开发版本。NET-2_HOWTO 代替了 NET-FAQ，它是最初的 LDP HOWTO
    文档之一。它涵盖了所谓的 Linux 网络内核“版本 2”（以及随后的“版本 3”），即内核版本 2.x 和 2.2.x。


    由于涵盖范围内的材料极其巨大，本文之前的版本变得非常庞大。为了帮助解决这个问题，我们制作了许多处理特定网络主题的 HOWTO。本文将在相关之处提供指向它们的指引，并涵盖其他文档尚未评审的领域。


    ## 2.1. 反馈


    我们始终对反馈感兴趣。请通过以下邮箱联系我们：poet@linuxports.com。


    这一部分有帮助吗？为什么不捐赠 $2.50 呢？


