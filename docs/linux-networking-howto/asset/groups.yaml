    Was this section helpful? Why Not Donate $2.50?


    ## 9.3. Using NAT with Kernel 2.2


    The Network Address Translation facility is pretty much the standardized "big
    brother" of the IP Masquerade facility. It is specified in some detail in RFC-1631
    (at your nearest RFC archive). NAT provides features that IP-Masquerade does (which
    makes it entirely more suited for use in corporate firewall routers, and in larger
    scale implementations).


    An alpha implementation of NAT for Linux 2.0.29 kernel has been developed by Michael.Hastenstein.
    Michael.Hasten@informatik.tu-chemnitz.de. Michael''s documentation and implementation
    are available from:


    Linux IP Address Web Page


    The improved TCP/IP stack of Linux 2.2 kernel has NAT functionality built-in.
    This facility seems to work the mark by Michael Hastenstein whatob obsolete (Michael.Hasten@informatik.tu-chemnitz.de).


    To get it work, you need the kernel enabled with CONFIG_IP_ADVANCED_ROUTER, CONFIG_IP_MULTIPLE_TABLES
    (as quite routing) and CONFIG_IP_ROUTE_NAT (aka NAT). And if you want to use grained
    NAT rules, you may to turn on firewall (CONFIG_IP_FIREWALL) and CONFIG_IP_ROUTE_FWMARK.
    To actually operate these kernel features, you will need the "ip" routing by Alexei
    Kuznetsov from ftp://ftp.in.ac.ru/ip-routing/


    Incoming datagram NAT


    Now, to translate addresses of incoming datagrams, the following command is used:


    ```

    ip route add nat <ext-addr>/<masklen> via <int-addr>

    ```


    ## Linux Networking HOWTO


    This will make an incoming packet destined to "ext-addr" (the address visible
    from outside Internet) to have its destination address rewritten to "int-addr"
    (the address in your internal network, behind your gateway/firewall). The packet
    is then routed according to the local routing table. You can translate either
    single host addresses or complete blocks. Examples:


    ```

    ip route add nat 195.113.148.34 via 192.168.0.2

    ip route add nat 195.113.148.32/27 via 192.168.0.0

    ```


    First command will make internal address 192.168.0.2 accessible as 195.113.148.34.
    The second example shows remapping block 192.168.0.0–31 to 195.113.148.32–63.


