- md: "\n# Linux Networking HOWTO\n\n```\n#\n# Ethernet configuration\nifconfig eth0\
    \ 192.168.1.1 netmask $mask up\nroute add -net 192.168.1.0 netmask $mask eth0\n\
    #\n# ppp0 configuration (start ppp link, set default route)\npppd\nroute add default\
    \ ppp0\n#\n# Tunnel device configuration\nifconfig tun10 192.168.1.1 up\nroute\
    \ add -host 192.168.1.12 gw $remotew tun10\n#\n# Proxy ARP for the remote host\n\
    arp -s 192.168.1.12 xx:xx:xx:xx:xx:xx pub\n```\n\nLinux host 'B' would be configured\
    \ with:\n\n```bash\n#!/bin/sh\nPATH=/sbin/usr/sbin\nmask=255.255.255.0\nremotew=aaa.bbb.ccc.ddd\n\
    #\n# ppp0 configuration (start ppp link, set default route)\npppd\nroute add default\
    \ ppp0\n#\n# Tunnel device configuration\nifconfig tun10 192.168.1.12 up\nroute\
    \ add -net 192.168.1.0 netmask $mask gw $remotew tun10\n```\n\nThis sort of configuration\
    \ is more typical of a Mobile-IP application: a single host wants to roam around\
    \ the Internet and maintain a single IP address the whole time. You should refer\
    \ to the Mobile–IP section for more information on how this is handled in practice.\n\
    \n## 7.7. IP Masquerade\n\nMany people have a simple dialup account to connect\
    \ to the Internet. Nearly everybody using this sort of configuration is allocated\
    \ a single IP address by the Internet Service Provider. This is normally enough\
    \ to allow only one host full access to the network. IP masquerading is a clever\
    \ trick that enables you to have many machines use that of one IP address. It\
    \ causes the others to look like the machine supporting the dial-up connection.\
    \ This is where the masquerade matters. There is a small caveat: the masqueraded\
    \ function works only one direction. In that direction, the masqueraded hosts\
    \ can call out, but cannot accept or receive connection from remote hosts. This\
    \ means that some network services do not work (such as talk), and others (such\
    \ as ftp) must be configured in passive (PASS) mode to operate. Fortunately, the\
    \ most common network services such as telnet, World Wide Web and irc work just\
    \ fine.\n\n### Kernel Compile Options:\n\n```\nCode maturity level options --->\n\
    [*] Prompt for development and/or incomplete code/drivers\nNetworking options\
    \ ------>\n[*] Network firewalls\n...\nn[*] TCP/IP networking\n```\n\n```\n[*]\
    \ IP: forwarding/gateway\n...\n[*] IP: masquerading (EXPERIMENTAL)\n```\n\nNow,\
    \ you have your linux machine supporting a SLIP or a PPP dial-up line (just as\
    \ if it were be a standalone machine). Additionally, it would have another network\
    \ device configured (perhaps an ethernet) with one of the reserved network addresses.\
    \ The hosts to be masqueraded would be on this second network. Each of these hosts\
    \ would have the IP address of the ethernet port of the linux machine set as their\
    \ default gateway or router.\n\nA typical configuration might look something like\
    \ this:\n\n| 192.168.1.0 /255.255.255.0 |\n| :--- |\n| NET ============= Linux\
    \ .1.1 |\n| masq |\n| PPP/slip | router |\n| host | |\n\n## 7.7.1. Masquerading\
    \ with IPFWADM (Kernels 2.0.x)\n\nThe most relevant commands for this configuration\
    \ are:\n\n```bash\n# Network route for ethernet\nroute add -net 192.168.1.0 netmask\
    \ 255.255.255.0 eth0\n#\n# Default route to the rest of the Internet.\nroute add\
    \ default pp0\n#\n# Case all hosts on the 192.168.1.0/24 network to be masqueraded.\n\
    ipfwadm -F a m -S 192.168.1.0/24 -D 0.0.0.0/0\n```\n\n## 7.7.2. Masquerading with\
    \ IPCHAINS\n\nThis is similar to IPFWADM, but the command structure has changed:\n\
    \n```bash\n# Network route for ethernet\nroute add -net 192.168.1.0 netmask 255.255.255.0\
    \ eth0\n#\n# Default route to the rest of the Internet.\nroute add default pp0\n\
    #\n# Case all hosts on the 192.168.1.0/24 network to be masqueraded.\nipchains\
    \ -A forward -s 192.168.1.0/24 -j MASQ\n```\n\nYou can get more information on\
    \ the Linux Masquerade feature from the IP Resource Page. Also, a very detailed\
    \ document about masquerading is the `IP–Masquerade mini–HOWTO` (which also instructs\
    \ to configure other OS's to run with a Linux masquerade server).\n\nFor information\
    \ on Applications of IP Masquerading, check the IPMASQ Applications page.\n\n\
    ## 7.8. IP Transparent Proxy\n\nIP transparent proxy is a feature that enables\
    \ you to redirect servers or services destined for another machine to those services\
    \ on this machine. Typically, this would be useful where you have a linux machine\
    \ as a router (and also provides a proxy server). You redirect all connections\
    \ destined for that service remotely to the local proxy server.\n\nKernel Options:\n\
    \n```\nCode maturity options --->\n    [*] Prompt for development and/or incomplete\
    \ code/drivers\nNetworking options --->\n    [*] Network firewalls\n    ....\n\
    \    [*] TCP/IP networking\n    ....\n    [*] IP: firewalling\n    ....\n    [*]\
    \ IP: transparent proxy support (EXPERIMENTAL)\n```\n\nThe configuration of the\
    \ transparent proxy feature is performed by the ifwading command.\n\nAn example\
    \ that might be useful is as follows:\n\n```bash\nroot# ifwading -I -a accept\
    \ -D 0/0 telnet -r 2323\n```\n\nThis example will cause any connection attempts\
    \ to port telnet (23) on any host to be redirected to port 2323 on this host.\
    \ If you run a service on that port, you could forward telnet connections, log\
    \ them, or do whatever fits your needs.\n\nA more interesting case is redirecting\
    \ all http traffic through a local cache. However, the protocol used by proxy\
    \ servers is from native http (where a client connects to www.server.com:80 and\
    \ asks for /path). When it connects to the local cache, it contacts proxy.local.domain:8080\
    \ and asks for www.server/path/page.\n\nTo filter http request through the local\
    \ proxy, you need to adapt the protocol by inserting a small server, called transproxy\
    \ (you can find it on the wide world web). You can choose to run transproxy on\
    \ port 8081. Just this command:\n\n```bash\nroot# ifwading -I -a accept -D 0/80\
    \ -r 8081\n```\n\nThe transproxy program, will, receive all connections meant\
    \ to reach external servers, and will pass them to the local proxy (after fixing\
    \ protocol differences).\n\n## 7.9. IPv6\n\nJust when you thought you were beginning\
    \ to understand IP networking, the rules get changed! IPv6 is the shortcut notation\
    \ for version 6 of the Internet Protocol. IPv6 was developed primarily to overcome\
    \ the concerns in the Internet community. Users worried that there would be a\
    \ shortage of IP addresses to allocate. IPv6 addresses are 16 bytes long (128\
    \ bits). IPv6 incorporates a number of changes, mostly simplifications, that will\
    \ make IPv6 networks more manageable than IPv4 networks.\n\nLinux already has\
    \ a working (not complete) IPv6 implementation in 2.2. * series kernels.\n\n##\
    \ 7.10. IPv6 Linux resources\n\n- IPv6–HOWTO\n- IPv6 for Linux\n- Linux IPv6 RPM\
    \ Project\n- IPv6 FAQ/HOWTO\n\n## 7.11. Mobile IP\n\nThe term \"IP mobility\"\
    \ describes the ability of a host that is to move its network connection from\
    \ one point on the Internet to another (without changing its IP address or losing\
    \ connectivity). Usually when an IP host changes its point of connectivity, it\
    \ will also change its IP address. IP Mobility overcomes this problem by allocating\
    \ a fixed IP address to the mobile host. It also uses IP encapsulation (tunneling)\
    \ with automatic routing to ensure that data destinations are routed to the actual\
    \ IP address it is currently using.\n\nA project is underway to provide a complete\
    \ set of IP mobility tools for Linux. The tools may be obtained from: Linux Mobile\
    \ IP Home Page.\n\n## 7.12. Multicast\n\nIP Multicast allows an arbitrary number\
    \ of IP hosts on disparate IP networks to have IP datagrams simultaneously routed\
    \ to them. This mechanism is exploited to provide Internet “broadcast” material,\
    \ as well as audio and video transmissions, as well as other novel applications.\n\
    \nKernel Options:\n\n```\nNetworking options --->\n[*] TCP/IP networking\n...\n\
    [*] IP: multicasting\n```\n\nA suite of tools and some minor network configuration\
    \ is required. Please check the Multicast–HOWTO for more information on Multicast\
    \ support in Linux.\n"
  mdcn: "\n\n# Linux 网络配置指南\n\n```\n#\n# 以太网配置\nifconfig eth0 192.168.1.1 netmask\
    \ $mask up\nroute add -net 192.168.1.0 netmask $mask eth0\n#\n# ppp0 配置 (启动 ppp\
    \ 链路，设置默认路由)\npppd\nroute add default ppp0\n#\n# 隧道设备配置\nifconfig tun10 192.168.1.1\
    \ up\nroute add -host 192.168.1.12 gw $remotew tun10\n#\n# 远程主机的代理 ARP\narp -s\
    \ 192.168.1.12 xx:xx:xx:xx:xx:xx pub\n```\n\nLinux 主机 'B' 的配置如下：\n\n```bash\n\
    #!/bin/sh\nPATH=/sbin/usr/sbin\nmask=255.255.255.0\nremotew=aaa.bbb.ccc.ddd\n\
    #\n# ppp0 配置 (启动 ppp 链路，设置默认路由)\npppd\nroute add default ppp0\n#\n# 隧道设备配置\nifconfig\
    \ tun10 192.168.1.12 up\nroute add -net 192.168.1.0 netmask $mask gw $remotew\
    \ tun10\n```\n\n这种配置更常见于 Mobile-IP 应用：单个主机希望在互联网上漫游并始终保持单一的 IP 地址。关于如何在实践中处理此问题的信息，请参考\
    \ Mobile–IP 章节。\n\n## 7.7. IP 伪装 (IP Masquerade)\n\n许多人拥有一个简单的拨号账户来连接互联网。几乎每个使用此类配置的人都会被互联网服务提供商（ISP）分配一个\
    \ IP 地址。这通常足够允许一个主机完全访问网络。IP 伪装是一种巧妙的技巧，可以让你让多台机器使用同一个 IP 地址。它让其他机器看起来像是支持拨号连接的那台机器。这就是伪装起作用的地方。有一个小小的注意事项：伪装功能仅单向工作。在该方向上，伪装的主机可以发出调用，但无法接受或接收来自远程主机的连接。这意味着某些网络服务无法工作（如\
    \ talk），而其他服务（如 ftp）必须配置为被动（PASS）模式才能运行。幸运的是，telnet、World Wide Web 和 irc 等最常见的网络服务运行良好。\n\
    \n### 内核编译选项：\n\n```\n代码成熟度级别选项 --->\n[*] 提示开发和/或不完整的代码/驱动程序\n网络选项 ------>\n[*]\
    \ 网络防火墙\n...\nn[*] TCP/IP 网络\n```\n\n```\n[*] IP: 转发/网关\n...\n[*] IP: 伪装 (实验性)\n\
    ```\n\n现在，你有一台 Linux 机器支持 SLIP 或 PPP 拨号链路（就像是一台独立机器一样）。此外，它还配置了另一个网络设备（可能是以太网），并带有一个预留的网络地址。需要伪装的主机位于第二个网络上。这些主机中的每一个都将\
    \ Linux 机器以太网的 IP 地址设置为其默认网关或路由器。\n\n一个典型的配置可能如下：\n\n| 192.168.1.0 /255.255.255.0\
    \ |\n| :--- |\n| NET ============= Linux .1.1 |\n| masq |\n| PPP/slip | router\
    \ |\n| host | |\n\n## 7.7.1. 使用 IPFWADM 进行伪装 (内核 2.0.x)\n\n与此配置最相关的命令是：\n\n```bash\n\
    # 以太网的网络路由\nroute add -net 192.168.1.0 netmask 255.255.255.0 eth0\n#\n# 指向互联网其他部分的默认路由。\n\
    route add default pp0\n#\n# 对对 192.168.1.0/24 网络上的所有主机进行伪装。\nipfwadm -F a m -S\
    \ 192.168.1.0/24 -D 0.0.0.0/0\n```\n\n## 7.7.2. 使用 IPCHAINS 进行伪装\n\n这与 IPFWADM\
    \ 类似，但命令结构发生了变化：\n\n```bash\n# 以太网的网络路由\nroute add -net 192.168.1.0 netmask 255.255.255.0\
    \ eth0\n#\n# 指向互联网其他部分的默认路由。\nroute add default pp0\n#\n# 对 192.168.1.0/24 网络上的所有主机进行伪装。\n\
    ipchains -A forward -s 192.168.1.0/24 -j MASQ\n```\n\n你可以从 IP 资源页面获取更多关于 Linux\
    \ 伪装功能的信息。此外，一份关于伪装的非常详细文档是 `IP–Masquerade mini–HOWTO`（它还指示了如何配置其他操作系统运行 Linux\
    \ 伪装服务器）。\n\n有关 IP 伪装的应用信息，请查看 IPMASQ Applications 页面。\n\n## 7.8. IP 透明代理 (IP\
    \ Transparent Proxy)\n\nIP 透明代理是一项功能，允许你将指向另一台机器的服务器或服务重定向到此机器上的相应服务。通常，当你有一台\
    \ Linux 机器作为路由器（同时也提供代理服务器）时，这非常有用。你将所有通往该服务的远程连接重定向到本地代理服务器。\n\n内核选项：\n\n```\n\
    代码成熟度选项 --->\n    [*] 提示开发和/or不完整的代码/驱动程序\n网络选项 --->\n    [*] 网络防火墙\n    ....\n\
    \    [*] TCP/IP 网络\n    ....\n    [*] IP: 防火墙\n    ....\n    [*] IP: 透明代理支持 (实验性)\n\
    ```\n\n透明代理功能的配置通过 `ifwading` 命令执行。\n\n一个可能有用的示例如下：\n\n```bash\nroot# ifwading\
    \ -I -a accept -D 0/0 telnet -r 2323\n```\n\n此示例将导致任何对任何主机 telnet 端口 (23) 的连接尝试都被重定向到此主机的\
    \ 2323 端口。如果你在该端口上运行服务，你就可以转发 telnet 连接、对其进行记录，或进行任何符合你需求的操作。\n\n一个更有趣的案例是将所有\
    \ http 流量重定向到本地缓存。然而，代理服务器使用的协议并非原生 http（客户端连接到 www.server.com:80 并请求 /path）。当它连接到本地缓存时，它联系的是\
    \ proxy.local.domain:8080 并请求 www.server/path/page。\n\n为了通过本地代理过滤 http 请求，你需要通过插入一个名为\
    \ transproxy 的小型服务器（你可以在网上找到它）来适配协议。你可以选择在端口 8081 上运行 transproxy。只需此命令：\n\n```bash\n\
    root# ifwading -I -a accept -D 0/80 -r 8081\n```\n\ntransproxy 程序将接收旨在到达外部服务器的所有连接，并将它们传递给本地代理（修复差异）。\n\
    \n## 7.9. IPv6\n\n正当你认为开始理解 IP 网络时，规则改变了！IPv6 是互联网协议第 6 版本的缩写。开发 IPv6 主要是为了克服互联网社区的担忧。用户担心没有足够的\
    \ IP 地址可以分配。IPv6 地址长度为 16 字节（128 位）。IPv6 包含了一些变化，大部分是简化，这将 IPv6 网络比 IPv4 网络更易管理。\n\
    \nLinux 在 2.2 * 系列内核中已经有了可工作（但不完整）的 IPv6 实现。\n\n## 7.10. IPv6 Linux 资源\n\n- IPv6–HOWTO\n\
    - Linux IPv6\n- Linux IPv6 RPM 项目\n- IPv6 FAQ/HOWTO\n\n## 7.11. 移动 IP (Mobile\
    \ IP)\n\n“IP 移动性”术语描述了主机将其网络连接从互联网一点移动到另一点（而不更改 IP 地址或丢失连接）的能力。通常当 IP 主机更改连接点时，它也会更改其\
    \ IP 地址。IP Mobility 通过为移动主机分配固定 IP 地址来解决这个问题。它还使用 IP 封装（隧道）和自动路由来确保数据目标路由到它当前使用的实际\
    \ IP 地址。\n\n一个项目正在为 Linux 提供完整的 IP 移动工具集。可以从以下位置获取这些工具。\n\n## 7.12. 多组播 (Multicast)\n\
    \nIP 多组播允许不同 IP 网络上的任意数量 IP 主机同时接收 IP 数据报。这种机制被用于提供互联网“广播”材料，以及音频和视频传输以及其他新应用。\n\
    \n内核选项：\n\n```\n网络选项 --->\n[*] TCP/IP 网络\n...\n[*] IP: 多组播\n```\n\n需要一组工具和一些细微的网络配置。请查看\
    \ Multicast–HOWTO 获取更多关于 Linux 支持多组播的信息。\n\n"
