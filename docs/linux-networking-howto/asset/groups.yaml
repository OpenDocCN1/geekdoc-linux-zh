    # 7.11. Mobile IP


    The term "IP mobility" describes the ability of a host that is to move its network
    connection from one point on the Internet to another (without changing its IP
    address or losing connectivity). Usually when an IP host changes its point of
    connectivity, it will also change its IP address. IP Mobility overcomes this problem
    by allocating a fixed IP address to the mobile host. It also uses IP encapsulation
    (tunneling) with automatic routing to ensure that data destinations are routed
    to the actual IP address it is currently using.


    A project is underway to provide a complete set of IP mobility tools for Linux.
    The tools may be obtained from: Linux Mobile IP Home Page. Was this section helpful?
    Why not Donate $2.50?


    # 7.12. Multicast


    IP Multicast allows an arbitrary number of IP hosts on disparate IP networks to
    have IP datagrams simultaneously routed to them. This mechanism is exploited to
    provide Internet “broadcast” material, as well as audio and video transmissions,
    as well as other novel applications.


    Kernel Compile Options:


    ```

    Networking options --->

    [*] TCP/IP networking

    ...

    [*] IP: multicasting

    ```


    A suite of tools and some minor network configuration is required. Please check
    the Multicast–HOWTO for more information on Multicast support in Linux.


