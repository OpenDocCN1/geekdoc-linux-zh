    \ IP 地址。这台机器是所有匹配该条目的数据文应该定向到以进行进一步路由的地方。如果您查看您的路由文件，您会发现至少有一个文件看起来像。\n\n现在让我们来看一个稍微复杂的路由链路。想象我们正在配置之前看到的路由器（支持连接到互联网的\
