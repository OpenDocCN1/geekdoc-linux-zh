    # Linux Networking HOWTO


    # 7.3. IP Accounting (for Linux–2.0)


    The IP accounting features of the kernel allow you to collect and analyze some
    network usage data. The data collected comprises the number of packets and the
    number of bytes accumulated since the figures last reset. You may specify a variety
    of rules to categorize the features suit your purpose. This option has been removed
    in kernel 2.1.102 because the old ipfwadm–based firewalling was replaced by ``ipfwchains`.


    Kernel Compile Options:


    | Networking options ----|

    | [* IP: accounting |


    After you have compiled and installed the kernel, you need to use the ipfwadm
    command to configure IP accounting. There are many different ways of breaking
    down the accounting information. I''ve picked a simple example of what might be
    useful. You should read the ipfwadm man page for more information.


    Scenario: You have an ethernet network that is linked to the Internet via a PPP
    link. On the ethernet, a machine that offers yours of services. You are interested
    in knowing how much traffic is generated by each ftp (and world web traffic),
    as well as total tcp and udp traffic.


    You might use a command that looks like the following (as a shell script):


    ```

    #!/bin/sh

    #

    # Flush the accounting rules

    ipfwadm -A -f

    #

    # Set shortcuts

    localnet=44.136.8.96/29

    any=0

    # Add rules for local ethernet segment

    ipfwadm -A in -a -P tcp -D localnet ftp-data

    ipfwadm -A out -a -P tcp -S localnet ftp-data

    ipfwadm -A in -a -P tcp -D localnet www

    ipfwadm -A out -a -P tcp -S localnet www

    ipfwadm -A in -a -P tcp -D localnet

    ipfwadm -A out -a -P tcp -S localnet

    ipfwadm -A in -a -P udp -D localnet

    ipfwadm -A out -a -P udp -S localnet

    #

    # Rules for default

    ipfwadm -A in -a -P tcp -D any ftp-data

    ipfwadm -A out -a -P tcp -S any ftp-data

    ipfwadm -A in -a -P tcp -D any www

    ipfwadm -A out -a -P tcp -S any www

    ipfwadm -A in -a -P tcp -D any

    ipfwadm -A out -a -P tcp -S any

    ipfwadm -A in -a -P udp -D any

    ipfwadm -A out -a -P udp -S any

    #

    # List the rules

    ipfwadm -A -1l -n

    ```


    The names ``ftp-data` and `www` refer to lines in /etc/services. The last command
    lists each of the


