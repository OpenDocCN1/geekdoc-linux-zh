  - '[PAGE 43]


    # 7.2. EQL – multiple line equaliser


    The EQL device name is `eql`. With the standard kernel source, you may have only
    one EQL device per machine. EQL provides a means of utilizing Point-to-point lines
    like PPP, slip or as a single logical link for tcp/ip. It is cheaper to use multiple
    lower speed lines than to have one high speed line installed.


    Kernel Compile Options:


    ```

    Network device support --->

    [*] Network device support

    <*> EQL (serial line balancing) support

    ```


    To support this mechanism, the machine at the other end of the lines must also
    support EQL. Linux, Livingston Postmasters and dial-in servers support compatible
    facilities.


    To configure EQL you will need the eql tools which are available from metalab.unc.edu.


    Configuration is fairly straightforward. You start by configuring the eql interface.
    The eql interface is like any other network device. You configure the IP address
    and mtu using the ifconfig utility. Here is an example:


    ```

    root# ifconfig eql 192.168.10.1 mtu 1006

    ```


    Next, you need to manually initiate each of the lines you use. These may be any
    combination of Point-to-Point network devices. How you initiate the connections
    will depend on what sort of link they are. Refer to the appropriate sections for
    further information.


    Lastly you need to associate the serial link with the eql device. This is called
    `enslaving` : it is done with the eql_ensave command as shown:


    ```

    root# eql_ensave eql sl0 28800

    root# eql_ensave eql ppo 14400

    ```


    The `estimated speed` parameter you specify eql_ensave does not directly anything.
    It is used by the E driver to manage what share of the data that device should
    receive. You can then tune the balancing of the lines by playing with this value.


    To dissociate a line from an eql device, the eql_emancipate command as shown:


    ```

    root# eql_emancipate eql sl0

    ```


    You are adding route for any other Point-to-Point link, except that your routes
    should refer to the eql device rather than the actual serial device. You would
    typically use:


    ```

    route# addthemselfseq

    ```


    The eql driver was developed by Simon Janes simon@ncm.com.


    Was this section helpful? Why not Donate $2.50?'
