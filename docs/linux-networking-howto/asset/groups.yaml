    # Linux 网络 HOWTO


    ![](img/3463a43058a1d43166cebe38fef67d46_25_0.png)


    我们有三个路由器 A、B 和 C。每个路由器都支持一个带有 C 类 IP 网络的以太网段（掩码 255.255.255.0）。每个路由器还与每个以太网路由器通过
    PPP 链路连接。网络最终形成了一个三角形。


    显而易见，A 的路由表可能如下：


    ```

    root# route add -net 192.168.1.0 netmask 255.255.255.0 eth0

    root# route add -net 192.168.2.0 netmask 255.255.255.0 ppp0

    root# route add -net 192.168.3.0 netmask 255.255.255.0 ppp1

    ```


    在路由器 A 和 B 之间的链路故障之前，这种配置运行良好。主机（见上图）无法到达 B 的以太网段上的主机：它们的以太网 p0 链路（即以太网）仍然可以与
    C 以太网段上的主机通信。CC 以太网上的主机仍然可以与 BB 段上的主机通信。通信仍然可以发生，因为 B 和 C 之间的链路仍然完好。


    如果 A 可以与 C 通信，C 还能与 B 通信，为什么 A 不通过 C 为 B 路由数据包（并让 C 发给 B）呢？这正是 RIP 等动态路由协议旨在解决的问题。如果所有路由器
    A 和 C 都运行路由守护进程，那么它们的路由表将自动调整以反映网络的新状态（如果网络中的任何链路发生故障）。配置这样的网络很简单：每个路由器只需要做两件事。在这种情况下，对于路由器
    A：


    ```

    root# route add -net 192.168.1.0 netmask 255.255.255.0 eth0

    root# /usr/sbin/routed

    ```


    “routed 守护进程”会自主发现所有活动网络端口（当它发送和监听网络设备的消息时），以便它能够确定并更新主机上的路由表。


    这是对动态路由的非常短的解释。如果你想获得更多信息，请参考本文开头列出的建议参考文献。


    ## 5.7.1. 所以 routed 程序是做什么的？


    与动态路由的关键点是：


    - 只有当你的 Linux 机器可能为目的地选择多个备路由时，才需要运行动态路由协议守护进程。例如如果你计划使用 IP 隐藏（IP Masquerading）。

    - 动态路由守护进程会自动修改你的路由表以适应网络变化。

    - RIP 适用于中小型网络。


    ## 5.8. 配置你的网络服务器和服务。


    网络服务器和服务是允许远程用户使用你的 Linux 机器的程序。服务器程序在网络端口上。网络端口是任何特定主机上特定服务的地址手段。服务器如何区分传入的 telnet
    连接和传入的 ftp 连接呢？远程用户向监听在该端口上的你的服务器程序（网络守护进程）建立网络连接，该程序接受连接并执行。网络守护进程有两种运行方式。两种在实践中都很被采用。这两种方式是：


    ### 独立模式 (stand-alone)


    > 网络守护进程程序监听指定的网络端口。当建立传入连接时，守护进程自行管理网络连接以提供服务。


    ### 作为 inetd 服务器的从 (slave to the inetd server)


    > inetd 服务器是一个专门管理传入连接的特殊网络守护进程程序。它有一个配置文件，告诉它在接收到连接时需要运行什么程序。任何服务端口都可以配置为 tcp
    或 udp 协议。端口在另一个文件中描述，我们很快就会看到……


    有两个需要配置的重要文件。分别是 `/etc/services` 文件（为端口号分配名称）和 `/etc/inetd.conf` 文件（inetd 网络守护进程的配置文件）。


    ## 5.8.1. /etc/services


    `/etc/services` 文件是一个简单的数据库，将易于理解的名称与机器服务端口关联。它的格式是一个文本文件，每行代表数据库中的一个项目，由三个由任意空白字符（制表符或空格）分隔的字段组成。这些字段是：名称
    端口/协议 别名。


    指定服务可用端口号的单单词名称。大多数常用服务都分配了数字。该字段被分为 tcp 或 udp。需要注意的是，18/tcp 条目与 18/udp 条目非常不同。没有技术原因要求同一个服务必须同时存在于两者。通常遵循常识。行中
    `#` 字符之后的任何文本都会被忽略，并被视为注释。如果你恰好是从零开始构建，这里是旧 Debian 发行版提供的 `/etc/services` 文件副本：


