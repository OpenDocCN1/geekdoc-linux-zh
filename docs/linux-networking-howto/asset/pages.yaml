  md: '# Linux Networking HOWTO


    # 5.10.3.1. /etc/hosts.allow


    The /etc/hosts.allow file is a configuration file of the /usr/sbin/tcpd program.
    The hosts.allow file contains rules describing which hosts allowed access to a
    service on your machine.


    The file format is simple:


    ```

    # /etc/hosts.allow

    #

    # <service list>: <host list> [: command]

    ```


    service list


    This is a comma delited list of server names where this rule applies. Example
    server names are: ftpd, telnetd and fingerd.


    host list


    This is a comma delited list of host names. You may also use IP addresses here.
    You may additionally specify hostnames or wildcard characters to match groups
    of hosts. Examples: gw.vk2ktj ampr.org to match a specific host, .uts.edu.au to
    match any name ending in string, 44, to match any IP address commencing with digits.
    There are special tokens to simplify configuration. Some of these are: ALL matches
    every host, LOCAL matches any host name does not contain a ''.'' is in the same
    domain as your machine and PARANOID matches any host name does not match its address
    (name spoofing). There is one last token that is also useful. The EXCEPT token
    allows you to provide a list with exceptions. This will be covered in an example
    later.


    command


    This is an optional parameter. This parameter is the full pathname of a command
    that would be executed this rule is matched. It could, for example, run a command
    that would attempt to identify who is logged onto the connecting host. It could
    also generate a mail message or other warning to a system administrator that is
    attempting to connect. There are a number of expansions that may be included.
    Some common examples are: %h expands to the name of the connecting host or if
    it doesn''t have a name, %d the daemon name being called.


    An example:


    ```

    # /etc/hosts.allow

    #

    # Allow mail to anyone

    in.smptpd: ALL

    # Allow telnet and ftp to only hosts within my domain and my host at home

    telnetd, ftppd: LOCAL, myhost.athome.org.au

    # Allow finger to anyone but keep a record of who they are.

    fingerd: ALL: (finger %@h | mail "finger from %h")

    ```


    5.10.3. The tcpd hosts access control mechanism.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '# 5.10.3.2. /etc/hosts.deny


    The /etc/hosts.deny file is a configuration file for the /usr/sbin/tcpd program.
    The hosts.deny contains rules describing which hosts are disallowed access to
    a service on your machine.


    A simple sample would look something like this:


    ```

    # /etc/hosts.deny

    #

    # Disallow all hosts with suspect hostnames

    ALL: PARANOID

    #

    # Disallow all hosts.

    ALL: ALL

    ```


    The PARANOID entry is redundant because the other entry traps everything in case.
    Either of these entries would make a reasonable default (depending on your particular
    requirement).


    Having an ALL: ALL default in the /etc/hosts.deny and then specifically enabling
    on those services and hosts that you use in the /etc/hosts.allow is the safest
    configuration.


    # 5.10.4. /etc/hosts.equiv


    The hosts.equiv file is used to grant certain hosts and users access rights to
    accounts on your machine without having to supply a password. This is useful in
    a secure environment where you control all machines, but is otherwise as secure
    as the least secure of the trusted hosts. To maximize security, do not use this
    mechanism. Encourage your users not to use the .hosts file as well.


    # 5.10.5. Configure your ftp daemon properly.


    Many sites will be interested in running an anonymous ftp server to allow other
    people to upload and download files without requiring a specific user. If you
    decide to offer this service, make sure you configure the ftp daemon for anonymous
    access. Most pages for ftpd (8) describe in length the proper procedures. You
    should always ensure that you follow these instructions. An important tip is not
    to use copy of /etc/passwd file in the anonymous account /etc directory. Make
    sure you strip out all details (except those you must have), otherwise you will
    be vulnerable to brute force password cracking techniques.


    # 5.10.6. Network Firewalling.


    Not allowing datagrams to even reach your machine (or servers) is an excellent
    means of security. This is covered in depth in the Firewall–HOWTO (and more concisely)
    in a later section of this document.


    5.10.3. The tcpd hosts access control mechanism.'
  merge: -1
