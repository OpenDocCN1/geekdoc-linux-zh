  md: '# Linux Networking HOWTO


    The important points relating to dynamic routing are:


    +   - You only need to run a dynamic routing protocol daemon when your Linux machine
    has the possibility of selecting multiple route alternatives to a destination.
    An example of this would be if you plan to use IP Masquerading.

    - The dynamic routing daemon will automatically modify your routing table to adjust
    to changes in your network.

    - RIP is suitable for small to medium sized networks.


    # 5.8. Configuring your network servers and services.


    Network servers and services are programs that allow a remote user to make use
    of your Linux machine. Server programs listen on network ports. Network ports
    are a means of addressing a particular service on any particular host. How are
    a server know the difference between an incoming telnet connection and an incoming
    ftp connection. The remote user establishes a network connection to your server
    program (the network daemon) listening on that port accepts the connection and
    executes. There are two ways that network daemons operate. Both are commonly employed
    in practice. The two ways are:


    sstand-alone


    > The network daemon program listens on the designated network port. When an incoming
    connection is made, the daemon manages the network connection itself to provide
    the service.


    slave to the inetd server


    > The inetd server is a special network daemon program that specializes in managing
    incoming connections. It has a configuration file which tells it what program
    needs to be run upon receiving an incoming connection. Any service port may be
    configured for either of the tcp or udp protocols. The ports are described in
    another file that we will see soon...


    There are two important files that need to be configured. They are the /etc/services
    file (which assigns names to port numbers), and the /etc/inetd.conf file (the
    configuration file for the inetd network daemon).


    # 5.8.1./etc/services


    The /etc/services file is a simple database that associates a human friendly name
    to a machine service port. Its format is simple. The file is a text file where
    each line represents and entry in the database. Each entry is comprised of three
    fields separated by any number of whitespace (tab or space) characters. The fields
    are:


    name port/protocol aliases # comment


    name


    A single word name that represents the service being described.


    5.8. Configuring your network servers and services.


