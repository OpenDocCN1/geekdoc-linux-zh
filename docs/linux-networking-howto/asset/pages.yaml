  md: "# Linux Networking HOWTO\n\nFor information on Applications of IP Masquerading,\
    \ check the IPMASQ Applications page.\n\n# 7.8. IP Transparent Proxy\n\nIP transparent\
    \ proxy is a feature that enables you to redirect servers or services destined\
    \ for another machine to those services on this machine. Typically, this would\
    \ be useful where you have a linux machine as a router (and also provides a proxy\
    \ server). You redirect all connections destined for that service remotely to\
    \ the local proxy server.\n\nKernel Options:\n\n```\nCode maturity options --->\n\
    \    [*] Prompt for development and/or incomplete code/drivers\nNetworking options\
    \ --->\n    [*] Network firewalls\n    ....\n    [*] TCP/IP networking\n    ....\n\
    \    [*] IP: firewalling\n    ....\n    [*] IP: transparent proxy support (EXPERIMENTAL)\n\
    ```\n\nThe configuration of the transparent proxy feature is performed by the\
    \ ifwading command.\n\nAn example that might be useful is as follows:\n\n```\n\
    root# ifwading -I -a accept -D 0/0 telnet -r 2323\n```\n\nThis example will cause\
    \ any connection attempts to port telnet (23) on any host to be redirected to\
    \ port 2323 on this host. If you run a service on that port, you could forward\
    \ telnet connections, log them, or do whatever fits your needs.\n\nA more interesting\
    \ case is redirecting all http traffic through a local cache. However, the protocol\
    \ used by proxy servers is from native http (where a client connects to www.server.com:80\
    \ and asks for /path). When it connects to the local cache, it contacts proxy.local.domain:8080\
    \ and asks for www.server/path/page.\n\nTo filter http request through the local\
    \ proxy, you need to adapt the protocol by inserting a small server, called transproxy\
    \ (you can find it on the wide world web). You can choose to run transproxy on\
    \ port 8081.Just this command:\n\n```\nroot# ifwading -I -a accept -D 0/80 -r\
    \ 8081\n```\n\nThe transproxy program, will, receive all connections meant to\
    \ reach external servers, and will pass them to the local proxy (after fixing\
    \ protocol differences). Was this section helpful? Why not Donate $2.50?\n\n#\
    \ 7.9. IPv6\n\nJust when you thought you were beginning to understand IP networking,\
    \ the rules get changed! IPv6 is the shortcut notation for version 6 of the Internet\
    \ Protocol. IPv6 was developed primarily to overcome the\n\n7.8. IP Transparent\
    \ Proxy"
