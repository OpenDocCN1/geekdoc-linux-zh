    # 8.2.1. Options for DHCPD


    Now you need to configure DHCPd. In order to do this, you will have to create
    or edit /etc/dhcpconf.conf. There is a graphical interface for dhcpd configuration
    under linuxconf. This makes configuring and managing DHCPD extremely simple.


    If you want to configure it by hand, you should follow instructions below. I suggest
    configuring it by hand at once. It will help in the diagnostics that a GUI can''t
    provide. Unfortunately Microsoft doesn''t believe this!


    The simplest way to assign IP addresses is to assign them randomly. A sample configuration
    file that shows this type of setup is displayed below:


    ```

    # Sample /etc/dhcpd.conf

    # (add your comments here)

    default-lease-time 1200;

    max-lease-time 9200;

    option subnet-mask 255.255.255.0;

    option broadcast-address 192.168.1.255;

    option routers 192.168.1.254;

    option domain-name-servers 192.168.1.1, 192.168.1.2;

    option domain-name "mydomain.org";nsubnet 192.168.1.0 255.255.255.0 {

    range 192.168.1.100 192.168.1.100;

    range 192.168.1.150 192.168.1.200;

    }

    ```


    This will allow the DHCP server to serve the client IP address from the range
    192.168.1.10–192.168.1.100 or 192.168.1.150–192.168.1.200.


