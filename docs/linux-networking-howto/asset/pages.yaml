  md: '# Chapter 10. Kernel 2.2 IP Command Reference

    (Work In Progress)


    # 10.1. ip


    If you have iproute2 tools installed, executing the ip command will allow the
    basic syntax to be displayed.


    ```

    [root@id4 Net4~]# ip OBJECT | COMMAND | help |

    Usage: ip [ OPTIONS ] OBJECT { COMMAND | addr | rule | neigh | tunnel |

    where OBJECT := { link | addr | madd | monitor |

    OPTIONS := { -V[version] | -s[statistics] | -r[resolve] |

    -f[family] { inet | inet6 | dnet | link } | -o[neline] }

    ```


    There are several options available:


    -V, -Version print the version of the ip you are using and exit.


    -s, -stats obtain more output on the specified device. You can issue this option
    more than once to increase the amount of information being displayed.


    -f, -family followed by a protocol identifier such as: inet, inet6 or link.— Specify
    the protocol to use. Use the standard IPv4 (e.g., Current Internet), inet6 uses
    IPv6 (ground breaking, never to be implemented Internet standard), and link (a
    physical link). If you do not present the option, the protocol is guessed. If
    enough information is present, it will fall back to the default setting.


    -o, -oneline Show each output device record in a single line.


    -r, -resolve Use the system resolver (e.g.; DNS) to print actual names (versus
    IP numbers).


    OBJECT Is the object (device) that you retrieve information from, and you can
    also manage the device. The device types understand the current implementation
    are:


    +   * The network device e.g.; eth0 or ppp0

    * The IP (IPv4 or IPv6) address on the specified device.

    * neigh The ARP or NDISC cache.

    * route The routing table entry.

    * rule The ruling in policy database.

    * maddress The multicast address.

    * mroute The multicast route cache.

    * tunnel Whether or not to tunnel over IP.


    The amount of possible options allowed on each object type depend on the action
    of being taken. As a basic rule, it is possible to add, delete, or show the object(s).
    Not all will allow additional commands to be used. Of course, command help is
    available for all objects. When help is used, it will print a list of available
    syntaxes for the given command.


    If you do not give a command, the default command will be assumed. Typically the
    default command is to list the objects.If the objects are not listed, the default
    will provide standard help output.


