  md: '# Chapter 13. Cables and Cabling


    Those who wish with a soldering iron may want to build your own cables to interconnect
    two linux machines. The following cabling diagrams should assist you with with
    your little project.


    # 13.1. Serial NULL Modem cable


    Not all NULL modem cables are alike. Many null modem cables do little more than
    trick your computer into thinking all the appropriate signals are present (and
    swap transmit and receive data). This is ok, but it means you must use software
    flow control (XON/XOFF) is less efficient than hardware flow control. The following
    cables provide the best possible signalling between machines, and it allows you
    to use hardware (RTS/CTS) flow control.


    | Pin Name | Pin | Pin |

    |---|---|---|

    | Tx Data | 2 | 3 |

    | Rx Data | 3 | 2 |

    | | 4 | 5 |

    | CTS | 5 | 4 |

    | Ground | 7 | 7 |

    | DTR | 20 | 8 |

    | DSR | 6 | 20 |

    | RLSD/DCD | - | 6 |


    Was this section helpful? Why not Donate $2.50?


