  md: '# Linux Networking HOWTO


    This is an acronym for Integrated Services Digital Network. SDN provides a standardized
    means by which Telecommunications companies may deliver either voice or data information
    to customers premises. ISDN is technically a circuit switched data network.


    # ISP


    This is an acronym for an Internet Service Provider. These are organizations or
    companies that provide people with network connectivity to the Internet.


    # IP address


    This is a number that uniquely identifies a TCP/IP host on the network. The address
    is 4 bytes long and is usually represented in what is called the "dotted decimal
    notation" (where each byte is represented in decimal with dots ` between them).


    # MSS


    The Maximum Segment Size (MSS) is the largest quantity of data that can be transmitted
    at one time. If you want to prevent local fragmentation, MSS would equal MTU–IP
    header.


    # MTU


    The Maximum Transmission Unit (MTU) is a parameter that determines the largest
    datagram than can be transmitted by an IP interface (without needing to be broken
    down into smaller units). The MTU should be larger than the largest datagram you
    wish to transmit unfragmented. Note: this prevents fragmentation locally. Some
    other link in the path may have a smaller MTU: the datagram will be fragmented
    at that point. Typical values are 1500 bytes for an ethernet interface, or 576
    bytes for a SLIP interface.


    # Route


    The route is the path that your datagrams take through the network to reach their
    destination.


    # Server


    This is usually the piece of software or end of a system remote from the user.
    The server provides some service to one or many clients. Examples of servers include
    ftp, Networked File System, or Domain Name Server. In the case of peer to peer
    systems (such as slip or ppp), the server is taken to be the end of the link that
    is called. The ending call is taken to be the client.


    # Window


    The window is the largest amount of data that the receiving end can accept at
    a given point in time.'
