  md: '# Linux Networking HOWTO


    The routing process is fairly simple. The incoming datagram is received, the destination
    address (who it is for) is examined, and then it is compared with each entry in
    the table. The entry that best matches address is selected, and the datagram is
    forwarded to the specified interface. If the gateway is filled, the datagram is
    forwarded to that host via the specified interface. The destination address is
    otherwise assumed to be on the network supported by the interface.


    To manipulate this table, a special command is used. This command takes line arguments
    and converts them into kernel cells. These calls request the kernel to add, delete,
    or modify entries in the routing table. The command is called `route`.


    Here is a simple example. Imagine you have an Ethernet network. You''ve been told
    it is a class-C network with address of 192.168.1.0. You''ve been supplied with
    an IP address of 192.168.1.10 for your use, and you have been told that 192.168.1.1
    is a router connected to the network.


    The first step is to configure the interface as described earlier. You would use
    a command similar to:


    ```

    root# ifconfig eth0 192.168.1.10 netmask 255.255.255.0 up

    ```


    You now need to add your entry into the routing table to tell the kernel that
    datagrams for all hosts with addresses that match 192.168.1.* you would use a
    command similar to:


    ```

    root# route add -net 192.1Ethernetetmask 255.255.255.0 eth0

    ```


    Note the use of the `-net` route to tell the program that this entry is a network
    route. Your choice here is `-host` route, which is a route that is specific to
    one IP address.


    This route will enable you establish IP connections with all of the hosts on your
    ethernet segment. But what about all of IP hosts that aren''t on your ethernet
    segment?


    It would be a difficult job to add routes to every possible destination network.
    There is a special trick that is to simplify this task. The route is called the
    `default` route. The `default` route matches every possible destination (poorly).
    If any other entry exists that matches the required address, it will be used instead
    of the default route. The idea of the default route is simply enough to say in
    effect: "everything else should go here". In this example you use an entry like:


    ```

    root# route add default gw 192.168.1.1 eth0                               on them

    ```


    The `gw` argument tells the route command that the next argument is the IP address,
    or of gateway or router machine. This machine is where all datagrams matching
    the entry should be directed for further routing, on them


    ```

    root# ifconfig eth0 192.168.1.10 netmask 255.255.255.0 up

    root# route add -net 192.168.1.0 netmask 255.255.255.0 eth0

    root# route add default gw 192.168.1.1 eth0                               on them

    ```


    is


