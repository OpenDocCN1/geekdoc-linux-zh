    \ University MosquitoNet Project. There is a lot of interesting here (even if\
    \ you aren't directly interested in the project).\n\nThe Metric radio connects\
    \ to a serial port, employ spread spectrum technology and are typically capable\
    \ of about 100kbps. Information on the Metric is available from: Metricom Web\
    \ Server.\n\nThe standard network tools and utilities do not currently support\
    \ the STRIP driver. You will have to download some customized tools from the MosquitoNet\
    \ web server. Details on what software you need is available: MosquitoNet STRIP\
    \ Page.\n\nA summary of the configuration that you use a slatch program to set\
    \ the line discipline of a serial strip. Configure the resulting `st [0–9]` device\
    \ as you would for ethernet with one important reason: STRIP does not support\
    \ the ARP protocol, so you must manually configure the ARP entries for each of\
    \ the hosts on your subnet. This shouldn't prove too onerous? Was Why not Donate\
    \ $2,50?\n\n# 12.13. Token Ring\n\nToken ring device names are `tr0`, `tr1`. Token\
    \ Ring is an IBM standard protocol that avoids collisions by using a mechanism\
    \ that allows only one station on the LAN to transmit at a time. A `token` is\
    \ held by one station. This station is the only one allowed to transmit. When\
    \ it has transmitted its data, it then passes the token onto the next station.\
    \ The token loops amongst all active stations; hence the name Token Ring.\n\n\
    Kernel Compile Options:\n\n```\nNetwork device support -->\n[*] Network device\
    \ support\n  ...\n  [*] Token Ring driver support\n  <> IBM Tropic chipset based\
    \ adaptor support\n```\n\nConfiguration of token ring is identical to that of\
