- img_proc: true
  md: '# Linux Networking HOWTO


    An important rule of thumb: `Don''t run services you don''t intend to use`. Many
    distributions come configured with all sorts of services that are configured and
    automatically started. To ensure a minimum level of safety, you should go through
    `/etc/inetd.conf` file. Comment out (place a `#` at the start of the line) any
    entries for services you don''t intend to use. Good candidates are services such
    as: `shell, login, exec, uucp, ftp` and informational services such as `finger,
    netstat` and `systat`.


    There are all sorts of security and access control mechanisms. I will now describe
    the most elementary:


    # 5.10.1. /etc/ftpusers


    The `/etc/ftpusers` file is a simple mechanism that allows you to deny certain
    users from logging into your machine via ftp. When an incoming ftp connection
    is received, the `/etc/ftpusers` file is read by the ftp daemon (`ftpd`). The
    file is a simple list of those users who are not allowed. It might look like:


    ```

    # /etc/ftpusers - users not allowed to login via ftp

    root

    uucp

    bin

    mail

    ```


    # 5.10.2. /etc/security


    The `/etc/security` file allows you to specify which `tty` devices `root` are
    allowed for login. The `/etc/security` file is read by the login program (usually
    `/bin/login`). Its format is a list of the tty devices names allowed: on all others
    root login is disallowed:


    ```

    # /etc/security - tty''s on which root is allowed to login

    tty1

    tty2

    tty3

    tty4

    ```


    # 5.10.3. The tcpd hosts access control mechanism.


    The `tcpd` program listed in the samone `/etc/inetd.conf` provides logging and
    access control mechanisms. It is configured to protect.


    When it is invoked by the `inetd` program, it reads two files containing access
    rules. It will either allow deny access to the server it is protecting.


    It will search the files until the first match is found. If no match is found,
    it assumes access should be allowed to anyone. The files it searches in sequence:
    `/etc/hosts.allow`, `/etc/hosts.deny`. I''ll describe each of these in turn. For
    a complete description of this facility, you should refer to the appropriate `man`
    pages (`hosts_access (5)` is a good starting point).'
