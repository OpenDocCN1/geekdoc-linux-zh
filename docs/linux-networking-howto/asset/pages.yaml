    # 7.7. IP Masquerade


    Many people have a simple dialup account to connect to the Internet. Nearly everybody
    using this sort of configuration is allocated a single IP address by the Internet
    Service Provider. This is normally enough to allow only one host full access to
    the network. IP masquerading is a clever trick that enables you to have many machines
    use that of one IP address. It causes the others to look like the machine supporting
    the dial-up connection. This is where the masquerade matters. There is a small
    caveat: the masqueraded function works only one direction. In that direction,
    the masqueraded hosts can call out, but cannot accept or receive connection from
    remote hosts. This means that some network services do not work (such as talk),
    and others (such as ftp) must be configured in passive (PASS) mode to operate.
    Fortunately, the most common network services such as telnet, World Wide Web and
    irc work just fine.


