  md: '# Linux Networking HOWTO


    +   - Do not connect the pins marked with an asterisk ''*''.

    - Extra grounds are 18,19,20,21,22,23 and 24.

    - If the cable you are using has a metallic shield, it should be connected to
    the metallic DB-25 shell at one end only.


    Warning: A miswired PLIP cable can destroy your controller card. Be very careful!
    Be sure to check every connection to ensure that you don''t cause yourself unnecessary
    work or heartache.


    While you may be able to run PLIP cables for long distances, you should avoid
    it if you can. The specifications for the cable allow for a cable length of 1
    meter or so. Please be very careful when running long PLIP cables as sources of
    strong electromagnetic fields (such as lightning, power lines, and radio transmitters)
    can interfere with and sometimes damage your controller. If you really want to
    connect two of your computers over a large distance, then you should really be
    looking at a pair of thin-net ethernet cards (and running some coaxial). Was this
    section helpful? Why not Donate $2?


    # 13.3. 10base2 (thin coax) Ethernet Cabling


    10base2 is an ethernet cabling standard that uses the 50 ohm coaxial cable that
    has a diameter of about 5 millimeters. There are a couple of important rules to
    remember when interconnecting machines with 10base2 cabling. The first is that
    you use terminators at both ends of the cable. A terminator is a 50 ohm resistor
    that helps to ensure the signal is absorbed (and not reflected) when it reaches
    the end of the cable. A terminator at each end of the cable, you may find that
    the ethernet is unreliable (or doesn''t work). You would''d use `T` pieces to
    interconnect the machines. You would end up with something that looks this:


    ```

    |=========|=========|=========||

    |         |         |         ||

    |    T    |    T    |    T    ||

    |         |         |         ||

    |=========|=========|=========||

    |         |         |         |

    ```


    The `T` at either end represents a terminator, and the `T piece` represents a
    length of coaxial cable with BNC plugs at each end. You should keep the length
    of cable between the `T piece` and the ethernet card in the PC as short as possible.
    The `T piece` will ideally be plugged directly into the ethernet card. Was this
    section helpful? Why not Donate $2?


    # 13.4. Twisted Pair Ethernet Cable


    If you have only two twisted pair ethernet cards (and you wish to connect them),
    you do not require a hub. You can connect the two cards directly together. A diagram
    showing how to do this is included in the Ethernet-HOWTO Was this section helpful?
    Why not Donate $2?


