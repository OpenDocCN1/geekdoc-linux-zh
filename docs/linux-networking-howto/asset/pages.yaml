  md: '# Chapter 8. DHCP and DHCPD


    DHCP is an acronym for Dynamic Host Configuration Protocol. The creation of DHCP
    has made configuring the network on multiple hosts extremely simple. Instead of
    having to configure each host separately, you can assign all of the common host-used
    parameters with a DHCP server.


    Each time the host boots up, it will broadcast a packet to the network. This packet
    is a call to any DHCP servers located on the same segment to configure the host.


    DHCP is extremely useful in assigning items as the IP address, Netmask, and gateway
    of each host.


    # 8.1. DHCP Client Setup for users of LinuxConf


    When you are in linux, you are logged in as the user "root", start the program
    linuxconf. This program comes with all versions of redhat, and it works with X
    Caldera. It also works for both SuSe and Caldera.


    Select Networking

    --------------------Basic Host Information

    -------------------->Select Enable

    ------------------->Set Config Mode DHCP

    Was this section helpful? Why not Donate $2.50?


    # 8.2. DHCP Server Setup for Linux


    Retrieve DHCPD (if your machine does not already have it installed). Get DHCP


    Quick Note: MAKE SURE YOU HAVE MULTICAST ENABLED IN THE KERNEL.


    If there is not a binary distribution for your version of linux, then you will
    have to compile DHCP.


    Edit your /etc/rc.d.local to reflect an addition of a route for 255.255.255.255.


    In order dhcp to work correctly with picky clients (e.g., Windows 95), it must
    be able to send packets with an IP address destination of 255.255.255.255. Unfortunately,
    Linux insists on changing 255.255.255.255 into the subnet broadcast address (in
    this case, the address would be 192.5.5.223). This results in a DHCP protocol
    violation. While many DHCP clients dont notice the problem, (e.g., all Microsoft
    DHCP clients) will recognize the violation. Clients that have this problem will
    appear not to see DHCPPOFFER messages from the server.


    Type the following as root:


    ```

    route add --255.255.255.255 eth0

    ```


    If the message appears:'
