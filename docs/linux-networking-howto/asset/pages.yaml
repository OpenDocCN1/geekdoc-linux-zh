  md: '# Chapter 11. Using common PC hardware


    # 11.1. ISDN


    The Integrated Services Digital Network (ISDN) is a series of standards that specify
    a general purpose switched digital data network. An ISDN ''call'' creates a synchronous
    Point-to-Point data service to the destination. ISDN is generally delivered on
    a high speed link that is broken down into a number of discrete channels. There
    are two different types of channels, the B Channels (which will actually carry
    the user data) and a single channel called the ''D channel'' which is used to
    send control information to the ISDN exchange for establishing channels and other
    functions. In Australia, for example, ISDN may be delivered on a 2Mbps link that
    is broken into 30 64kbps B (with one 64kb D channel). Any number of channels may
    be used at a time, and these can be used in any combination. You could, for example,
    establish 30 channels to 30 destinations at 64kbps each. You could also establish
    15 to 15 different destinations at 128kbps each (two channels per call). Finally,
    you could adjust just a small number of calls while leaving the rest idle. A channel
    may be used for either incoming or outgoing calls. The intention of ISDN was to
    allow Telecommunications companies to provide a single data service. This service
    could deliver either telephone (via digitised voice) or data services to your
    home or business. In this case, the customer would not be required to make any
    special configuration changes.


    There are a few ways to connect your computer to an ISDN service. One way is to
    use a device called a ''Terminal Adapter''. This adaptor plugs into the Network
    Terminating Unit (that your telecommunications carrier will have installed when
    you receive your ISDN service), and it presents a series of interfaces. One of
    these is used to enter commands. Some commands are used to establish channels
    and configuration, while others are actually connected to the network devices
    that you use. Linux will work in this sort of configuration without modification:
    you just treat the port on the Terminal Adapter you would like to use that any
    other device. The kernel ISDN support is designed to allow the user to install
    an ISDN card into the Linux machine. This allows Linux to handle the protocols,
    and the software can make the calls itself.


    # Kernel Compile Options:


    ```

    ISDN subsystem -->

    <*> ISDN support

    [ ] Support synchronous PPP

    [ ] Support audio via ISDN

    <> ICN 2B and 4B support

    <> PCBIT-D support

    <> Teles/NICCY1016PC/Creatix support

    ```


    The implementation of ISDN supports a number of different types of internal ISDN
    cards. These are listed in the kernel configuration options:


    +   - ICN 2B and 4B

    - Octal PCBIT-D

    - Teles ISDN-cards and compatibles


    Some of these cards require software to be downloaded to make them operational.
    A separate utility exists to allow downloading to:


    Full details on how to configure the ISDN service is available from the /usr/src/linux/Documentation/isdn/.
    You can also check the FAQ dedicated to isdn4linux: it is


    Chapter 11. Using common PC hardware'
