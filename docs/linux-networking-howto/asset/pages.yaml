    ```\n\nAll routes associated with that alias will also be deleted automatically.\
    \ Was this section helpful? Why not Donate $2.50?\n\n# 7.5. IP Firewall (for Linux–20)\n\
    \nIP Firewall and Firewall issues are covered in more in the Firewall–HOWTO. IP\
    \ Firewall allows you to secure your machine against unauthorized network access\
    \ by filtering or allowing datagrams from to IP addresses you nominate. There\
    \ are different classes of rules: incoming, outgoing, filtering, and forwarding.\
    \ Incoming rules are applied to datagrams that are received by a network device.\
    \ Forwarding rules are applied to datagrams that are received and are not for\
    \ this machine (i.e. datagrams that would be routed).\n\n# Kernel Compile Options:\n\
