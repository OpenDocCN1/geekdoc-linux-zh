  md: '# Linux Networking HOWTO


    ![](img/3463a43058a1d43166cebe38fef67d46_25_0.png)


    We have three routers A, B and C. Each router supports one ethernet segment with
    a Class C IP network (netmask 255.255.255.0). Each one also has a PPP link to
    each of ethernet routers. The network ultimately forms a triangle.


    It should be clear that the routing table for A could look like the following:


    ```

    root# route add -net 192.168.1.0 netmask 255.255.255.0 eth0

    root# route add -net 192.168.2.0 netmask 255.255.255.0 ppp0

    root# route add -net 192.168.3.0 netmask 255.255.255.0 ppp1

    ```


    This would work fine until the link between router A and B fails. Hosts (see above
    diagram) could not reach hosts on the ethernet segment of B: their datagramEther
    As p0 link (which is broEthernet) could still talk to hosts on the ethernet segment
    of C. Hosts on CCethernet could still talk to hosts on BBether segment. TheCommunications
    can still occur because the link between B and C is still intact.


    If A can talk to C and C can still talk to B, why wouldn''t A route its datagrams
    for B via C (and let C send to B) ? This is the exact problem of dynamic routing
    protocols like RIP were designed to solve. If all of routers A and C were running
    a routing daemon, then their routing tables would be automatically adjusted to
    reflect the new state of the network (should any of the links in the network fail).
    To configure such a network is simple: at each router only needs to do two things.
    In this case for Router A:


    ```

    root# route add -net 192.168.1.0 netmask 255.255.255.0 eth0

    root# /usr/sbin/routed

    ```


    The ''routed daemon autonomously finds all active network ports (when it sends
    and listens for messages of the network devices) to allow it to both determine
    and update the routing table on the host.


    This has been a very brief explanation of dynamic routing. If you would like more
    information, please refer to the suggested references listed at the top of this
    document.


