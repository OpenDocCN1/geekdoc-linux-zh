  md: '# # Chapter 1. How can I help?


    We will try to provide comprehensive coverage for all Linux Networking implementations.
    However, time is of the essence, and this document is not a revenue maker. We
    provide this information in the hope that it will be useful to both the Linux
    Community and to newly converted Linux users. We are always interested in feedback!
    We will implement every relevant topic possible in this HOWTO document.


    # ## 1.1. Assisting with the Net–HOWTO


    If you would like to assist with this document, there are two primary avenues
    that are extremely helpful.


    +   * Purchase an OpenBook! If you purchase OpenDocs books, OpenDocs Publishing
    will donate a portion of the proceeds back to the Open Source Documentation Fund.
    This fund assists authors financially while they continue to write documentation
    for Open Source projects.

    * Provide a monetary contribution to the document. By contributing, you can even
    request what you would like to have updated, written, or expanded within the document.
    To provide a monetary contribution, please contact Command Prompt, Inc. You may
    also contact Joshua Drake.

    * If you have written something that you would like to contribute, please email
    it to poet@linuxports.com


    ![](img/3463a43058a1d43166cebe38fef67d46_5_0.png)'
