    If you intend to use the PLIP protocol between two machines, this cable will work
    for you (irrespective of what sort of parallel ports you have installed).


    | Pin Name | pin | pin |

    |---|---|---|

    | STROBE | 1* | |

    | D0->ERROR | 2 | 15 |

    | D1->SLCT | 3 | 13 |

    | D2->PAEOUT | 4 | 12 |

    | D3->ACK | 5 | 10 |

    | D4->BUSY | 6 | 11 |

    | D5 | 7* | |

    | D6 | 8* | |

    | D7 | 9* | |

    | ACK->D3 | 11 | 5 |

    | BUSY->D4 | 12 | 6 |

    | PAEOUT->SLCT | 13 | 3 |

    | ->FEED | 14* | |

    | ERROR->D0 | 15 | 2 |

