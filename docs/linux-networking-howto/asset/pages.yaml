    After you''ve built your /etc/ford/router.conf file, the only step remaining is
    to configure the actual devices. This is a little trickier than a normal network
    device configuration. Remember to bring up the FRAD device by the DLCI encapsulation
    devices. These are best hosted in a shell script because of their:


    ```

    #!/bin/sh

    # Configure the frad hardware and the DLCI parameters

    # sbin/cfg /etc/router.conf || exit 1

    # sbin/dlicfg /etc/router.conf


    # Bring up the FRAD device

    ifconfig sda0 up


    # Configure the DLCI encapsulation interfaces and routing

    ifconfig dlci100 192.168.10.1 pointoint 192.168.10.2 up

    route add -net 192.168.10.0 mask 255.255.255.0 dlci100


    ifconfig dlci101 192.168.11.1 pointoint 192.168.11.2 up

    route add -net 192.168.11.0 mask 255.255.255.0 dlci100


    route add default dlci100

    ```


