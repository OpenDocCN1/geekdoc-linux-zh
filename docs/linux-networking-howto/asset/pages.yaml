  md: '# 5.6. Configuring your loopback interface.


    loopback is a special type of interface that allows you to make connections to
    yourself. There are various reasons why you might want to do this. For example,
    you might wish to test network software without interfering with anyone else on
    the network. By convention, the IP address `127.0.0.1` has been assigned specifically
    for loopback. No matter what machine you go to, if you open a telnet connection
    to 127.0.0.1 you will always reach the local host.


    Configuring the loopback interface is simple, and it must be done (but note that
    this task is usually performed by the standard initialization scripts).


    ```

    root# ifconfig 127.0.0.1

    root# route add -host 127.0.0.1 lo

    ```


    We''ll tell you more about the route command in the next section. Was this section
    helpful? Why not Donate $2.50?


    # 5.7. Routing.


    Routing is a big topic. It is easily possible to write large volumes of text about
    the subject. Most of you will have fairly simple routing requirements; some of
    you will not. I will cover some basic fundamentals of routing only. If you are
    interested in more detailed information, I suggest you refer to the references
    provided at the start of this document.


    Let''s start with a definition. What is IP routing? Here is one I''m using:


    > "IP Routing is the process by which a host network decides where to deliver
    the IP datagrams that it has received"


    It might be useful to illustrate this with an example. Imagine a typical office
    router. It might have a PPP link off the Internet, a number of Ethernet segments
    connecting the workstations, and another PPP link off to office. When the router
    receives a datagram on any of its network, it uses the routing mechanism to determine
    which interface it should send the datagram to. Simple hosts also have two network
    devices, one is the loopback interface described above, and the other is the one
    it uses to talk to the rest of the network (perhaps an Ethernet, a PPP, or an
    SLIP serial interface).


    Ok, so does routing work? Each host has a special list of routing rules called
    a "routing table". This table contains rows which typically contain at three fields:
    the first is a destination address, the second is the name of the interface where
    the datagram is to be routed, and the third is the IP address of another machine
    that carries the datagram on its next step through the network. You can see this
    table in linux using the following command:


    ```

    user% cat /proc/net/route

    ```


    or by using either of the following commands:


    ```

    user% /sbin/route -n

    user% netstat -r

    ```


    5.6. Configuring your loopback interface.'
