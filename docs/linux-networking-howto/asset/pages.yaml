    # 11.4.5. Dynamic SLIP server with a dialup line and DIP.


    A dynamic SLIP server is one that allocates an IP address randomly (from a pool
    of addresses) each time you log. This means there is no guarantee that you will
    have any particular address. Address may be well used by someone else after you
    have logged off. The network administrator who config the SLIP server will assign
    a pool of addresses for the SLIP server to use. When the server receives a incoming
    call, it finds the first unused address; then guides the caller through the login
    process; then it prints a welcome message that contains the IP address it has
    allocated. It will utilize that particular IP address for the duration of the
    call.


    Configuring for this type of server is similar to configuring a static server.
    You might add an extra step, however, where you obtain the IP address the server
    has allocated to you. Then you can configure your SLIP device with that address.


    Again, dip does the work for you. New versions are smart enough to not only log
    you in, but are also to automatically read the IP address printed in the welcome
    message. They can store this address so that you can have your SLIP device configured.


    If this is how your SLIP server works, then you can move to the section ‘Using
    Dip’ to learn how to configure dip appropriately.


