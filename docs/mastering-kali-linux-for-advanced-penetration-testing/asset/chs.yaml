- "# 高级 Kali Linux 高级渗透测试指南\n\n\n\n![](img/cover.jpeg)\n![](img/index-1_1.jpg)\n\n\
  \n这是一本关于使用 Kali Linux 测试您的网络安全的实用指南，Kali 是渗透测试人员和黑客的首选工具。\n\n\n\n\n\n\n\n\n\n\n\
