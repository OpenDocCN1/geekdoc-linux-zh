  \ 7` 和 `Windows 8`。\n\n[ 7 ]\n\n# 前言\n\n# 谁适合本书\n本书适用于那些想要了解安全技术的人。如果你是安全专业人士、渗透测试员，或者对安全感兴趣，那么这本书就是为你准备的。\n\
