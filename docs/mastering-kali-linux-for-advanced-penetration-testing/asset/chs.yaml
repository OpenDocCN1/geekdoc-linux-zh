  \n在进行渗透测试的同时运行多个主机发现扫描。某些设备可能与时间有关。在一次渗透测试中，发现系统管理员在常规业务工作时间之后设置了一个游戏服务器。由于这不是一个经批准的业务系统，管理员没有遵循正常流程来加固服务器；存在多个漏洞服务，且没有收到必要的安全补丁。测试人员能够利用管理员游戏服务器中的漏洞攻破该游戏服务器，并访问底层的公司网络。\n\
  \n### 端口、操作系统和服务发现\n`Kali` 提供了几种不同的工具，用于识别远程主机上的开放端口、操作系统和已安装的服务。这些功能中的大多数可以使用 `nmap`\
  \ 完成。尽管我们将重点关注使用 `nmap` 的示例，但其原理也适用于其他工具。\n\n#### 端口扫描 端口扫描是连接到 `TCP` 和 `UDP` 端口以确定目标设备上运行着哪些服务和应用程序的过程。每个系统上的\
  \ `TCP` 和 `UDP` 均各有 65,535 个端口。某些端口已知与特定服务关联（`TCP` 20 和 21 是`文件传输协议`服务（`FTP`）的常用端口）。前\
  \ 1,024 个是众所端口，大多数定义的服务都运行在该范围的端口上；接受的服务和端口由 `IANA`（http://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml）维护。\n\
  \n尽管特定服务有接受的端口（例如用于 Web 流量的 80 端口），但服务可以重定向到*任何*端口。此选项经常用于隐藏特定服务，特别是当该服务已知易受攻击时。然而，如果攻击者完成端口扫描后没有发现预期的服务，或者在使用不寻常的端口发现它，他们将被促进一步调查。\n\
  \n通用的端口映射工具 `nmap` 依赖于活动栈指纹识别。向目标系统发送特制的数据包，操作系统对这些数据包的响应允许 `nmap` 识别操作系统。为了让 `nmap`\
  \ 正常工作，至少有一个监听端口是开放的，并且操作系统必须是知的且具有指纹，且本地数据库中存有该指纹的副本。\n\n[76]\n\n## 第 3 章\n\n使用\
  \ `nmap` 进行端口发现是非常*嘈杂*的——它会被网络安全设备检测并记录。以下需要记住的几点：\n\n• 大多数端口扫描器都有默认扫描端口列表——确保你了解列表中有什么以及哪些被省略了。同时考虑\
  \ `TCP` 和 `UDP` 端口。\n• 成功的扫描需要对 `TCP/IP` 及相关协议、网络以及特定工具的工作原理有深入了解。例如，`SCTP` 是网络上一种日益常见的协议，但在公司网络上很少进行测试。\n\
  • 端口扫描即使在缓慢进行时也会影响网络。一些旧的网络设备和特定厂商的设备在接收或发送端口扫描时会锁定，从而将扫描变成拒绝服务攻击。\n• 用于扫描端口的工具（特别是\
  \ `nmap`）功能上正在不断扩展。它们还可以用于检测漏洞并利用简单的安全漏洞。\n\n#### 操作系统指纹识别\n确定远程系统的操作系统通过两种类型的扫描来完成：\n\
  \n• **主动指纹识别**：攻击者向目标发送正常和畸形数据包，并记录其响应模式，称为*指纹*。通过将指纹与本地数据库对比，可以确定操作系统。\n• **被动指纹识别**：攻击者*嗅探*或记录并分析数据流以确定数据包的特征。\n\
  \n主动指纹识别比被动指纹识别更快、更准确。在 `Kali` 中，两个主要的活动工具是 `nmap` 和 `xprobe2`。\n\n[77]\n\n### 主动探测与漏洞扫描\n\
  \n`nmap` 工具向目标网络注入数据包并分析其收到的响应。在下面的截图，`-O` 标志命令 `nmap` 确定操作系统。由于它向目标注入数据包，`nmap`\
  \ 操作系统判定的准确性基于开放端口的数量。它对于区分 Windows 和 Unix 系统通常有效，但可能无法提供非常具体的信息，例如区分不同的 Unix 内内核。接下来的截图显示了\
  \ `nmap` 扫描 Windows 系统的结果。目标系统只有几个端口可供测试，因此无法区分 Windows 7 企业版和 Windows XP sp3。\n\
  \n![](img/index-95_1.png)\n\n\n![](img/index-95_2.png)\n\n[78]\n\n## 第 3 章\n\n注意，目标系统很容易隐藏真实的操作系统。由于指纹识别依赖于包设置（例如生存时间或初始窗口大小），更改这些值或其他用户可配置设置可能会更改工具的结果。某些组织会主动更改这些值，以使探测的最后阶段更加困难。\n\
  \n#### 确定活动服务\n探测枚举部分的最终目标是识别目标系统上运行的服务和应用程序。如果可能，攻击者希望知道服务的类型、供应商和版本，以便识别任何漏洞。\n\
  \n以下是用于确定活动服务的几种技术之一：\n\n• **识别默认端口和服务**：如果识别出远程系统具有开放 80 端口（WWW 服务）的 Microsoft\
  \ 操作系统，攻击者可能假设安装了默认的 Microsoft IIS。将使用额外的测试来验证此假设（`nmap`）。\n• **Banner 抓取**：使用 `amap`、`netcat`、`nmap`\
  \ 和 `Telnet` 等工具完成。\n• **查看默认网页**：某些应用程序在安装时带有默认的管理、错误或其他页面。如果攻击者访问这些页面，将为可能易受攻击的已安装应用程序提供指导。在下面的截图，攻击者可以轻松识别目标系统安装的\
  \ `Apache Tomcat` 版本。\n\n![](img/index-96_1.jpg)\n\n\n### 主动探测与漏洞扫描\n\n• **查看源代码**：配置不当的\
  \ Web 应用程序可能会\n\n\n\n\n\n响应特定的 HTTP 请求（如 `HEAD` 或 `OPTIONS`），其响应内容包含 Web 服务器软件版本，并且可能还包含正在使用的基础操作系统或脚本环境。在接下来的截图中，`netcat`\
  \ 从命令行启动，并用于向特定网站发送原始 `HEAD` 数据包。该请求生成了一个错误信息（`404 not found`）；但它也识别出服务器运行的是 Microsoft\
  \ IIS 7.5 版本。\n\n![](img/index-97_1.png)\n\n### 使用综合侦察应用尽管 Kali 包含了多个便于侦察的工具，但许多工具具有重叠的功能，且将数据从一个工具导入到另一个工具通常是一个复杂的人工过程。大多数测试人员会选择工具的子集并使用脚本调用它们。\n\
  \n专注于侦察的综合性工具最初是具有定义功能集的命令行工具；其中最常用之一是 `Deepmagic Information Gathering Tool`（`DMitry`）。`DMitry`\
  \ 可以执行 `whois` 查找、检索 `netcraft.com` 信息、搜索子域名和电子邮件地址，并执行 `TCP` 扫描。遗憾的是，它在这些功能之外无法扩展。\n\
  \n最近的进展创建了结合被动和主动侦察的综合框架应用；我们将审查 `nmap`、`recon-ng` 和 `maltego`。\n\n### [80]\n\n\n\
  #### nmap\n\n传统上，`nmap` 被认为是一个简单的映射工具，提供主机和端口可用性数据，以及诸如目标设备可能的操作系统等额外数据。\n\n`Nmap\
  \ 脚本引擎`（`NSE`）已将 `nmap` 变为一个可以进行被动和主动侦察、甚至执行基础漏洞扫描的工具（完整脚本列表可在 http://nmap.org/nsedoc/\
  \ 获取）。\n\n由于脚本是用 `Lua` 脚本语言编写的，渗透测试社区很容易对其修改和发布脚本。目前，脚本功能包括以下内容：\n\n- 对 `IPv4` 和\
  \ `IPv6` DNS 数据进行侦察\n- 识别 Web 应用防火墙、`IDS`、`IPS` 以及其他保护措施的存在\n- 测试防火墙规则集（通过 `firewalk`）并尝试绕过防火墙\n\
  - 从目标和在线网站收集用户名\n- 针对各种服务和应用程序进行密码暴力破解\n- 爬取目标网络以识别网络共享\n- 从指定网站的提取提取 `EXIF` 元数据\n\
  - `IP` 地址的地理定位\n- 进行网络攻击，如 `IPv6` 数据洪水\n- 漏洞扫描，包括模糊测试和 SQL 注入测试\n\n\n一个非常有用的脚本是\
  \ Marc Ruef 的 `vulscan`（http://www.computec.ch/mruef/software/nmap_nse_vulscan-1.0.tar.gz），它将\
  \ `nmap` 的指纹识别功能（使用 `-sV` 标志）与针对主要漏洞的查询相结合，例如 `MITRE`、`OSVDB` 和 `SecurityFocus`。\n\
  \n一旦下载了脚本包，解压文件并将脚本文件移动到 `/usr/share/nmap/scripts`。\n\n### [81]\n\n### 主动侦察与漏洞扫描\n\
  \n要从命令行调用其中一个脚本，使用 `--script` 标志，然后指定脚本名称。一个经常使用的脚本是 `nmap` 的通用漏洞扫描器，通过以下命令启动：\n\
  \n```bash\nroot@kali:~# nmap -sV --script=vulscan.nse digitaldefence.ca\n```\n\n\
  在特定情况下，漏洞扫描没有识别出任何带有已知利用程序的漏洞，如下截图所示：\n\n![](img/index-99_1.png)\n\n一个必不可少的脚本是 SpiderLabs\
  \ 用于为 Web 服务截图的脚本。它需要下载 `wkhtmltoimage` 工具（http://wkhtmltopdf.googlecode.com）并将其放在\
  \ `/usr/local/bin` 文件夹中。然后应下载脚本本身（https://github.com/SpiderLabs/Nmap-Tools/blob/master/NSE/http-screenshot.nse）并将其放在\
  \ `/usr/local/share/nmap/scripts`。调用时，该脚本会生成所有识别出的 Web 视觉记录，便于稍后选择测试目标。\n\n\n与 `Metasploit\
  \ Framework` 和 `Social Engineer Toolkit` 一样，`recon-ng` 使用模块化框架。每个模块都是自定义的 `cmd`\
  \ 解释器，预先配置以执行特定任务。\n\n`recon-ng` 框架及其模块用 `Python` 编写，允许渗透测试人员轻松构建或更改模块以方便测试。\n\n\
  ### [82]\n\n## 第 3 章\n\n`recon-ng` 工具利用第三方 API 进行某些评估；这种额外的活性意味着 `recon-ng` 执行的一些活动可能会被这些方跟踪。用户可以指定自定义的\
  \ `UserAgent` 字符串或代理请求，以尽可能减少对目标网络的警告。\n\n`recon-ng` 收集的所有数据都存放在数据库中，允许你针对存储的数据创建各种报告。用户可以选择一个报告模块自动创建\
  \ `CSV` 报告或 `HTML` 报告。\n\n要使用 recon，请执行以下步骤：\n\n1. 如果你的 `Kali` 版本没有安装 `recon-ng`，请使用以下命令：\n\
  \n```bash\napt-get install recon-ng\n```\n2. 要启动应用程序，在提示符处输入 `recon-ng`，如下截图所示。启动屏幕将显示模块数量，`help`\
  \ 命令将显示用于导航的命令。\n\n![](img/index-100_1.png)\n\n### [83]\n\n### 主动侦察与漏洞扫描\n\n3. 要显示可用模块，在\
  \ `recon-ng>` 提示符处输入 `show`。要加载特定模块，输入 `load` 后跟模块名称。在输入时按 `tab` 键将补全命令。如果模块具有唯一名称，你可以输入名称的唯一部分，模块将被加载。\n\
  \n如下所示所示输入 `info` 将为你提供有关模块如何工作的信息，以及如果需要，在哪里获取 API 密钥。\n\n![](img/index-101_1.png)\n\
  \n### [84]\n\n## 第 3 章\n\n4. 一旦加载模块，使用 `set` 命令设置选项，然后输入 `run` 执行，如下截图所示：\n\n\n\
  通常情况下，测试人员依靠 `recon-ng` 执行以下操作：\n\n- 使用 `whois`、`jigsaw`、`linkedin` 和 `twitter`\
  \ 收集联系（使用 `mangle` 模块提取并展示电子邮件数据）\n- 识别主机\n- 使用 `hostop`、`ipinfodb`、`maxmind`、`uniapple`\
  \ 和 `wigle` 识别主机和个人的地理位置\n- 使用 `netcraft` 及相关模块识别主机信息\n- 识别以前泄露并发布到互联网的帐户和密码信息（`pwnedlist`\
  \ 模块、`wascompanyhacked`、`xssed` 和 `punkspider`）\n\n#### Maltego Maltego (www.paterva.com)\
  \ 是一款开源情报和取证应用程序。`Kali` 包含的社区版限制搜索大小；但它是可视化使用数据挖掘和链路分析的数据之间关系的极工具。\n\n1. 要打开应用程序，在命令行提示符输入\
  \ `maltego`。第一次打开时，你需要在 `Paterva` 注册并验证你的电子邮件地址。\n\n\n\n\n2. 一旦你完成了注册和转换（transforms）的更新，你将看到一个多窗格\
  \ GUI，它允许你检查各种数据对象之间的连接，如下截图所示：\n\n![](img/index-103_1.jpg)\n\nMaltego 依赖于一系列转换或模块，这些模块存储在应用程序左侧的面板中。通过从左侧列中选取转换并将其拖入应用程序的中心来选择转换。\n\
  默认情况下，初始选择时图标可能被命名为 `pantera.com`；但是，你可以使用右侧列的数据操作区域对数据进行命名和更改。\n\n社区版中存在多种不同的转换；这些转换被分为若干组，如\
  \ `Devices`（设备）、`Infrastructure`（基础设施）、`Personal`（个人）、`Locations`（位置）、`Penetration\
  \ Testing`（渗透测试）和 `Social Network`（社交网络），如下截图所示：\n\n**[ 86 ]**\n\n## 第 3 章\n\n![](img/index-104_1.png)\n\
  \n3. 将适当的转换拖到工作表中并右键点击显示将针对该转换身份完成的转换。请记住，如果你选择了 `All`（全部）选项，处理将花费大量时间。\n\n分析关系的能力在执行社会工程攻击时特别有用。例如，如果目标网站包含多个指向另一个网站的链接，攻击者可以利用利用这种关系进行钓鱼攻击。\n\
  \n**[ 87 ]**\n\n### 主动侦察与漏洞扫描\n\n## 漏洞扫描\n漏洞扫描利用自动化流程和应用程序来识别网络、系统、操作系统或应用程序中可能被利用的漏洞。\n\
  执行得当时，漏洞扫描可以提供设备清单（包括授权设备和 `rogue` 异常设备）、已活动扫描的已知漏洞，通常还会确认设备对各种策略和法规的合规性。\n\n遗憾的是，漏洞扫描是“响亮”的——它们会发送多个被大多数网络控制轻易检测到的数据包，使得几乎无法实现隐身。它们还面临以下额外限制：\n\
  \n- 大多数，漏洞扫描器是基于签名的——它们只能检测到已知漏洞，并且只有存在扫描器可以应用于目标的现有识别签名时。对于渗透测试人员来说，最有效的扫描器是开源且允许测试人员快速修改代码以检测新漏洞的。\n\
  - 扫描器产生大量的输出，经常包含可能误导测试人员的假阳性结果；特别是具有不同操作系统的网络，假阳性率高达百分之七十。\n- 扫描器可能会网络产生负面影响——它们可能会导致网络延迟或某些设备故障（参考\
  \ `www.digininja.org` 上的网络扫描列表，已知因漏洞测试而故障的设备）。\n- 在某些司法管辖区，扫描被视为“黑客行为”，可能构成非法行为。\n\
  \n有多个商业和开源产品执行漏洞扫描。在 Kali 中，可以在 `Vulnerability Analysis`（漏洞分析）子菜单以及 `Web Vulnerability\
  \ Scanners`（Web 漏洞扫描器）菜单中找到扫描工具；然而，主要的漏洞扫描器是 `OpenVAS`（OpenVAS）。\n\nKali 支持安装额外的扫描器。如果在测试期间决定为了完整性牺牲隐蔽性，请始终使用至少两个不同的扫描器以尽量减少假阳性结果。推荐的扫描器包括\
  \ Nexpose (`www.rapid7.com`) 和久誉的 Nessus (`www.nessus.org`)。\n\n**[ 88 ]**\n\n##\
  \ 第 3 章\n\n**总结** 在主动侦察期间，攻击者面临活动被识别的真实真实风险，这使他们处于危险之中。这必须与映射网络、寻找开放端口以及确定已安装的操作系统和应用程序的需求进行平衡。\n\
  \n为了降低风险，攻击者必须采用隐身扫描技术。使用手动方法来创建缓慢扫描；然而，这种方法并不总是有效。因此，攻击者利用诸如 Tor 网络和各种代理应用程序来隐藏自己的身份。\n\
  \n\n**[ 89 ]**\n\n## 漏洞利用 (Exploit)\n\n被动侦察和主动侦察的目标是识别出最可能支持测试人员或攻击者目标（拒绝服务、窃取或修改数据）的可利用安全缺陷。杀伤链中的漏洞利用阶段侧重于创建访问权限以实现目标——要么通过创建拒绝服务来停止对目标的访问，或者采用更常见的方法从攻击者处对目标建立持久访问。\n\
  \n渗透测试人员必须关注漏洞利用阶段的以下方面：\n\n- 目标是否已完全描述？如果攻击者不理解目标的网络和主机架构，攻击将失败并增加检测的风险。\n- 漏洞利用是否广为人知，并在目标系统上有定义的动作？未描述的漏洞利用在采用时可能会产生意外后果，造成的损害可能对测试过程产生负面影响。测试人员应在使用前在已知环境中验证所有漏洞利用。\n\
  - 漏洞利用是从远程进行的还是在目标系统上本地进行的？远程利用对攻击者来说更安全，因为被身份识别的可能性较低；然而，本地利用让攻击者对利用操作有更多控制权并减少了检测的可能性。\n\
  - 需要的利用后活动有哪些？如果攻击者需要从目标外泄数据，那么漏洞利用必须支持建立交互连接。\n- 是否需要对受损系统进行持久访问，还是渗透将是短期的？这将驱动对隐身方法的需求。\n\
  \n### 漏洞利用\n\n已经识别了成千上万个可利用漏洞，大多数漏洞至少关联一个概念证明代码或技术以允许系统被攻破。然而，决定成功的底层原理在网络、操作系统和应用程序之间是相同的。\n\
  \n在本章中，你将学习：\n\n- 使用在线和本地漏洞资源\n- 使用 Metasploit Framework 利用远程目标\n- 使用 Armitage 利用多个目标\n\
  - 绕过 ID 和反病毒软件检测\n\n**威胁建模** 被动和主动侦察阶段映射目标网络和系统，并识别可能用于实现攻击者目标的可利用漏洞。在攻击者杀伤链的这一阶段，存在强烈的行动倾向——测试人员想要立即启动利用并证明他们可以攻破目标。然而，无计划的攻击可能不是实现目标的有效手段，并且可能会牺牲实现攻击目标所需的隐身性。\n\
  \n\n\n\n渗透测试人员（正式或非正式地）采用了一种名为“威胁建模”的过程，该过程最初由网络规划人员开发，用于针对攻击开发防御对措施。\n\n渗透测试人员和攻击者将防御性的威胁建模方法颠倒了过来，以提高攻击的成功率。攻击性威胁建模是一种正式方法，它结合侦察和研究的结果来制定攻击策略。攻击者必须考虑可用目标，并识别列出的以下目标类型：\n\
  \n- **主要目标**：这些目标一旦被攻破，将立即实现目标。\n- **次要目标**：这些目标可能提供信息（安全控制、密码和日志策略，以及本地和域管理员的名称和密码）来支持攻击或允许访问主要目标。\n\
  - **三级目标**：这些目标可能与测试或攻击目标无关，但相对容易攻破，可能会提供信息或分散实际攻击的注意力。\n\n**92**]\n\n## 第 4 章\n\
  对于每种目标，测试人员都必须确定要使用的方法。单一漏洞可以使用隐身技术进行攻击，也可以通过大量攻击攻击多个目标，以快速利用目标。如果实施了大规模攻击，防御控制设备中的噪音将经常导致他们减少路由器和防火墙上的日志记录，甚至完全禁用它们。\n\
  \n所使用的方法将引导利用程序的选择。通常，攻击者在创建威胁模型时会遵循攻击树方法，如下图所示：\n\n```\nNeed to acquire proprietary\
  \ engineering documents -> engineer’s server -> Compromise the Compromise engineer’s\
  \ email account credentials using Obtain access -> Exploit -> Exploit known vulnerability\
  \ in buffer overflow to web access keyboard logger gain root access interface\n\
  ```\n\n![](img/index-110_1.jpg)\n\n攻击树方法允许测试人员能够轻松地视觉化可用的攻击选项，以及在所选攻击不成功时可以采用的备选方案。一旦生成了攻击树，利用阶段的下一步是识别可能用于攻破目标中漏洞的利用程序。\n\
  \n![](img/index-110_2.png)\n\n## 使用在线和本地漏洞资源\n\n![](img/index-110_3.png)\n\n被动和主动侦察共同识别了目标的*攻击面*，即可以评估漏洞的位点总数。一个仅安装了操作系统的服务器只有在特定特定操作系统存在漏洞时才能被利用；然而，随着每安装一个应用程序，潜在漏洞的数量就会增加。\n\
