  \ 322\n\n## 索引 327\n\n\n前言\n\n本书致力于介绍使用 Kali Linux 进行网络渗透测试。渗透测试模拟了恶意外部或内部人员对网络或系统进行的攻击。与漏洞评估不同，渗透测试的设计包含了漏洞利用阶段。因此，它证明了漏洞确实存在，并证明如果不采取行动，将面临被攻击的真实风险。\n\
  \n在书中，我们将交替使用“渗透测试员”、“攻击者”和“黑客”这些术语，因为他们使用相同的技术和工具来评估网络和数据的安全性。他们唯一的区别在于最终目标——是安全的数据网络，还是数据泄露。\n\
  \n\n\n\n正式方法论包括以下著名示例：\n\n- **Kevin Orrey 的渗透测试框架**：该方法引导测试人员执行渗透测试的序贯步骤，并提供了工具和相关命令的超链接。更多信息可以在\
  \ www.vulnerabilityassessment.co.uk 查找。\n- **信息系统安全评估框架 (ISSAF)**：这本全面的指南旨在成为网络测试的单一来源。关于此的更多信息可以在\
  \ www.oissg.org 查找。\n- **NIST SP 800-115，信息安全测试与评估技术指南**：编写于 2008 年，这种四步方法论略显过时。然而，它确实对渗透测试的基本步骤提供了良好的概述。你可以在\
  \ http://csrc.nist. gov/publications/nistpubs/800-115/SP800-115.pdf 获取更多信息。\n- **开源安全测试方法论手册\
  \ (OSSTMM)**：这是较旧的方法论之一，最新版本试图量化已识别的风险。更多细节可以在 www.osstmm.org 查找。\n- **开放 Web 安全项目\
  \ (OWASP)**：该项目专注于 Web 应用程序中最常见的 10 种漏洞。关于此的更多信息可以在 www.owasp.org 查找。\n- **渗透测试执行标准\
  \ (PTES)**：该方法论处于活跃维护状态，完整且准确地反映了恶意人员的活动。你可以在 www.pentest-standard.org 获取更多信息。\n\
  - **攻击性 (Web) 测试框架 (OWTF)**：于 2012 年引入，这是将 OWASP 方法与更完整、严谨的 PTES 方法论相结合的一个极具前景的方向。更多细节可以在\
  \ https://github.com/7a/owtf 查找。\n\n遗憾的是，使用结构化方法论可能会在测试过程中引入弱点：\n\n- 方法论很少考虑*为什么要*进行渗透测试，或者哪些数据对业务至关重要并需要保护。在缺乏这一至关重要的第一步的情况下，渗透测试将失去焦点。\n\
  - 许多渗透测试人员不愿遵循特定的定义的方法论，担心这会阻碍他们在利用网络漏洞时的创造力。\n\n\n# 前言\n\n- 渗透测试未能反映恶意攻击者的实际活动。通常，客户想看看你是否能获得特定系统的管理权限（“你能\
  \ root 这台机器吗？”）。然而，攻击者可能专注于以一种不需要 root 权限的方式复制关键数据，或导致拒绝服务。\n\n为了解决正式测试方法论固有的局限性，必须将其整合到一个框架中，该框架从攻击者的视角来看网络，即“杀伤链”（kill\
  \ chain）。\n\n### 渗透测试的“杀伤链”方法\n\n2009 年，洛克希德马丁 CERT 的 Mike Cloppert 引入了现在被称为“攻击者杀伤链”的概念。这包括对手在攻击网络时采取的步骤。它并不总是以线性流进行，因为某些步骤可能会并行发生。同一目标可能会在一段时间内发起多次攻击，且重叠的阶段可能同时发生。\n\
  \n在书中，我们修改了 Cloppert 的杀伤链，以更准确地反映攻击者在利用网络和数据服务时如何应用这些步骤。下图显示了攻击者典型的杀伤链：\n\n```\n\
  侦察             利用后阶段\n被动（间接）动作     主动（直接）目标\n持久化\n         交付阶段\n```\n\n**[ 3 ]**\n\
  \n# 前言\n\n攻击者典型的杀伤链可以描述如下：\n\n- **侦察阶段** – 大多数军事组织采纳“侦察时间绝不是浪费时间”这一谚语承认，在与敌人交战之前尽可能多地了解他们更好。出于同样的原因，攻击者在攻击之前会对目标进行广泛的侦察。事实上，估计渗透测试或攻击的“工作量”至少有\
  \ 70% 是花在进行侦察上的！通常，他们将使用两种类型的侦察：\n    - **被动侦察** – 这不会直接以敌对方式与目标交互。例如，攻击者将查看公开的网站，评估在线媒体（尤其是社交媒体网站），并试图确定目标的“攻击面”。其中一个特定任务是生成一份过去和现在的员工姓名列表。这些姓名将成为暴力破解或猜测密码的尝试基础。它们也将用于社交工程攻击。这种类型的侦察很难（甚至不可能）与普通用户的行为区分开。\n\
  \    - **主动侦察** – 这可以被目标检测到，但很难将大多数在线组织的表面与普通背景区分开。在主动侦察期间发生的活动包括对目标场所的实地访问、端口扫描和远程漏洞扫描。\n\
  \n- **交付阶段** – 交付是选择和开发用于攻击期间完成漏洞利用的武器。选择的精确武器取决于攻击者的意图以及交付路径（例如，跨网络、通过无线或通过基于 Web\
  \ 的服务）。交付阶段的影响将在书的后半部分进行。\n\n**[ 4 ]**\n\n\n- **利用或攻破阶段** – 这是特定漏洞被成功应用，允许攻击者达到目标的时间点。攻破可能发生在单一阶段（例如，使用缓冲区溢出利用了已知的操作系统漏洞），也可能是多阶段攻破（例如，攻击者物理访问场所窃取了公司电话簿。这些姓名被用于针对门户登录创建暴力破解列表。此外，向所有员工发送电子邮件，让他们点击嵌入链接下载一个损害了计算机的的\
  \ PDF 文件）。当恶意攻击者针对特定企业时，多阶段攻击是常态。\n\n- **利用后：针对目标的操作** – 这经常被错误地称为“外泄阶段”，因为人们倾向于将攻击仅仅视为获取敏感数据的路径（如登录信息、个人信息和财务信息）；攻击者可能有不同的目标。例如，某业务可能希望通过提升其访问权限到最高水平（垂直提升），并破解尽可能多的账户（水平提升）。因此，这一阶段必须关注攻击者的多种可能行为。\n\
  \n- **利用后：持久化** – 如果攻破网络或系统具有价值，那么如果有了持久访问，该价值很可能会增加。这允许攻击者与被攻破的系统保持通信。从防御者的角度来看，这是杀伤链中最容易被检测的部分。\n\
  \n杀伤链是攻击者在尝试攻破网络或特定数据系统时的行为模型。作为一个元模型，它可以包含任何专有的或商业的渗透测试方法论。然而，与方法论不同，它确保了从战略层面关注攻击者如何接触网络。这种对攻击者活动的关注将引导本书的布局和内容。\n\
  \n**[ 5 ]**\n\n# 前言\n\n\n\n\n# 本书涵盖内容\n本书分为两个部分。在`Part 1` `攻击者杀伤链`中，我们将遵循杀伤链的步骤，详细分析每一个阶段。在`Part\
  \ 2` `交付阶段`中，我们将重点关注交付阶段以及一些可用的方法论，以理解攻击是如何发生的，以及如何利用这些知识来保障网络安全（加固网络）。\n\n## 第\
  \ 1 章，从 Kali Linux 开始\n向读者介绍 `Kali Linux` 的基础知识，及其支持渗透测试的最佳配置。\n\n## 第 2 章，识别目标——被动侦察\n\
  提供了有关如何使用公开资源收集目标信息的背景知识，以及可以简化侦察和信息管理的工具。\n\n## 第 3 章，主动侦察与漏洞扫描\n\n## 第 4 章，利用（Exploit）\n\
  演示了用于发现和执行利用的方法论，这些利用允许系统被攻击者破坏。\n\n## 第 5 章，利用后阶段——目标行动\n描述了攻击者如何提升权限以实现破坏系统的目标，包括数据窃取、数据篡改、发起额外攻击或创建拒绝服务。\n\
  \n## 第 6 章，利用后阶段——持久化\n提供了有关如何配置被破坏系统的背景知识，以便攻击者可以随意返回并继续利用后活动。\n\n## 第 7 章，物理攻击与社会工程学\n\
  演示了为什么能够物理访问系统或与管理系统的人员交互是实现利用最成功的途径。\n\n演示了如何利用常见的无线连接来访问数据网络和隔离系统。\n\n## 第 9 章，Web\
  \ 应用程序的侦察与利用\n简要概述了最难加安全的交付阶段之一：暴露在公共互联网上的 Web 应用程序。\n\n[ 6 ]\n\n# 前言\n\n## 第 10\
  \ 章，利用利用远程访问通信\n随着越来越多的组织采用分布式和居家办公模式，这些模式依赖远程访问通信，而这些通信本身容易受到攻击，因此这种进入系统的途径变得日益重要。\n\
  \n## 第 11 章，客户端利用\n重点针对终端用户系统上应用程序的攻击，这些应用程序的保护程度通常低于组织的主网络。\n\n## 附录，安装 Kali Linux\n\
  提供了如何安装 `Kali Linux` 的概述，以及如何采用全盘加密以避免机密测试数据被截获。\n\n# 本书所需的准备\n为了练习书中介绍的内容，你需要虚拟化工具，如\
  \ `VMware` 或 `VirtualBox`。\n\n你需要下载并配置 `Kali Linux` 操作系统及其工具集。为了确保它是最新版本且你拥有所有工具，你需要连接互联网。\n\
  \n遗憾的是，`Kali Linux` 系统中的所有工具都不会被介绍，因为工具太多了。本书的重点不是让读者淹没在所有的工具和选项中，而是提供一种测试方法，让他们随着经验和知识的变化，有机会学习并整合新工具。\n\
  \n\n最后，本书应用 `Kali` 完成针对目标系统的攻击者杀伤链。你需要一个操作系统。书中的许多示例使用了 `Microsoft Windows XP`。尽管它在\
