  \ Wizard**，如下所示：\n![](img/index-48_1.jpg)\n4. 选择 **Create an encrypted file container**，然后点击\
  \ **Next**。\n5. 下一个屏幕提示 **Volume Type**，选择 **Standard TrueCrypt volume** 并点击 **Next**。\n\
  6. 在 **Volume Location** 屏幕上，选择 **Select File**。你将被通过提供 **Name** 来 **Specify a New\
  \ TrueCrypt Volume**，并指示它将保存在指定的文件夹中，如下所示：\n\n![](img/index-48_2.jpg)\n7. 选择一个文件名。不要选择与被测试客户相关的文件名。\n\
  \n\n\n\n\n或表示该目录中存在敏感材料。使用数字或代码词来代表客户端，并为结果使用通用标题。将文件保存到桌面，然后点击 `Next`。\n\n### 8.\
  \ 下一个屏幕将为你提供 `Encryption Options`（加密选项）。从下拉菜单中选择 `Encryption Algorithm`（加密算法）。有多个选择，但对于常规用途，`AES`（默认的\
  \ 256 位密钥）足够了。你还需从下拉菜单中选择 `Hash Algorithm`（哈希算法）（默认的 `RIPEMD-160` 应该足够）。完成选择后，点击\
  \ `Next` 按钮，如后续截图所示：\n\n![](img/index-49_1.jpg)\n\n### 9. 现在系统会提示你输入 `Volume Size`（卷大小）。你的最小大小至少应约为\
  \ 500 MB，但这可能取决于测试方案。点击 `Next`。\n\n[ 32 ]\n## 第 1 章\n\n### 10. 应该根据提供的强密码规则来选择 `Volume\
