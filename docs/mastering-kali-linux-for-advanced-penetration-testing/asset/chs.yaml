  \ `Next`。\n\n### 12. 下一个屏幕 `Volume Format`（卷格式）会为加密的文件系统创建一个随机密钥。该密钥基于鼠标移动，系统会提示你在窗口上方长时间移动鼠标，以确保加密密钥的随机性（加密密码学强度）。完成后，点击\
