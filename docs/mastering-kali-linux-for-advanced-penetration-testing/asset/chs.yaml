  \n### 管理第三方应用程序\n当你处理文件夹的内容，并希望确保所有测试相关信息都得到保护时，你应该使用加密卷。\n\n### 安装第三方应用程序\n\n当你处理文件夹的内容，并希望确保所有测试相关信息都得到保护时，你应该使用加密卷。\n\
  \n### 运行第三方应用程序\n\n当你处理文件夹的内容，并希望确保所有测试相关信息都得到保护时，你应该使用加密卷。\n\n\n\n\n4. 输入命令行：`ps\
  \ aux|grep iceweasel`。如你所示，Iceweasel 正在以 root 权限运行。\n\n5. 关闭 Iceweasel，并使用命令 `sux\
  \ -noroot iceweasel` 重新启动，如下所示：\n\n![](img/index-55_1.png)\n\n如果你检查下图中所示 Iceweasel\
  \ 标题栏，你会发现它是以用户 `noroot` 身份启动，该账户没有管理员权限。\n\n\n你也可以通过检查打开的进程（如下图所示）来确认 Iceweasel\
  \ 运行在 `noroot` 账户下：\n\n![](img/index-55_3.png)\n\n**渗透测试的有效管理** 渗透测试中最困难的方面之一是记住要测试网络或系统目标的所有相关部分，或者在测试完成后尝试记住目标是否真的经过了测试。\n\
  \n[38]\n\n# 第 1 章\n\nBT 5r3 强调了使用 `Draedis` 和 `MagicTree` 等管理工具。这些工具通过提供测试数据的中央存储库来促进小组测试。此外，它们通常提供某些框架，让测试人员知道自己在测试方法论中所处的阶段，以及哪些测试尚待完成。此类工具在漏洞评估或渗透测试期间协调定义的组活动方面非常出色。\n\
  \n这些工具保留在 `Applications` | `Kali Linux` | `Reporting Tools` | `Evidence Management`\
  \ 菜单中。\n\n但对于方法论可能随网络目标的变化而更加灵活的复杂渗透测试来说又呢？\n\n\nKali Linux 包含了几个更适合快速记录以及作为快速添加的剪贴数据存储库的工具，包括\
  \ `KeepNote` 和 `Zim` 桌面 wiki。\n\n测试人员不仅需要执行测试并收集数据，还需要能够将他们的发现提供给客户。这可能是困难的，因为某些结果是瞬态的——测试在某一个点展示了一个发现，然后目标系统上发生了变化，未来的测试将无法证明该可利用的漏洞，尽管它可能再次出现。\n\
  \n正性结果的另一个挑战是，它们需要以一种客户可以理解的方式向其展示。\n\n黄金法是始终对任何正性或潜在的发现进行截图。使用如 `Shutter` 等工具从桌面截取图像。\n\
  \n默认情况下，Kali 配置了 `CutyCapt`，这是一种跨平台的命令行实用，它可以捕捉网页并创建多种图像类型，包括 PDF, PS, PNG, JPEG,\
  \ TIFF, GIF 和 BMP。\n\n[39]\n\n## 从 Kali Linux 开始\n\n例如，要从 Google 搜索页面创建一个特定大小的图像，请从命令行提示符输入：\n\
  \n```\n..cutycapt --url=http://www.google.com --out=google.png --min-width=300 --min-heightheight=250\n\
  ```\n\n\n![](img/index-57_1.jpg)\n\nCutyCapt 在演示如跨站脚本等基于 Web 的漏洞的存在时特别有用。\n\n然而，静态图像非常有用，但一个攻破目标网络并显示攻击者在破坏敏感数据时行为的漏洞视频是一个非常有说服力的工具。`instanbul`\
  \ 屏幕录制器可以创建一个“进行中的利用”视频，这允许为了训练目的重放利用，或向客户演示该漏洞。\n\n**总结** 在本章中，我们检查了 Kali，这是一系列被合法合法的渗透测试人员和黑客广泛用于评估数据系统和网络安全的工具集合。我们强调了\
  \ Kali 作为一个虚拟机，允许主机操作系统和虚拟机 客端都支持测试。\n\n[40]\n\n# 第 1 章\n\nKali 是一个工具库，使用它的挑战之一是确保工具是最新的版本。我们回顾了\
  \ `Debian` 软件包管理系统，以及如何从命令行和 GUI 应用程序启动更新。最重要的是，我们学习了如何自定义 Kali 以提高我们的工具及其收集的数据的安全性。我们正努力实现让工具支持我们的流程的目标，而不是反过来！\n\
  \n在接的一章中，我们将学习如何有效利用**开源情报**（**OSINT**）来识别目标的可利用攻击攻击面，并创建自定义的 `username:password`\
  \ 列表，以促进社会工程攻击和其他漏洞利用。\n\n[41]\n\n### 识别目标 – 被动侦察\n\n\n侦察有两种类型：**被动侦察**和**主动侦察**。\n\
  \n通常，被动侦察关注分析公开的信息，通常来自目标本身或在线公共来源。在访问这些信息时，测试人员或攻击者不会以异常方式与目标交互——请求不会被记录或直接追踪到攻击者身上。\n\
  \n在本章中，你将学习被动侦察的原理和实践，包括：\n\n- 侦察的基本原理\n- **开源情报** (**OSINT**)\n- `DNS` 侦察和路由映射，包括\
  \ `ipv4` 和 `ipv6`\n- 获取用户信息\n- 为密码列表进行用户画像分析\n\n主动侦察涉及与目标直接交互，将在第 3 章《主动侦察与漏洞扫描》中介绍。\n\
  \n## 侦察的基本原理\n\n被动侦察不涉及与目标网络的直接交互。攻击者的源 IP 地址和活动不会被记录（例如，在 Google 上搜索目标的电子邮件地址）。\n\
  \n目标很难、甚至不可能将被动侦察与正常的业务活动区分开来。\n\n\n\n\n\n攻击者以预期的方式与目标进行交互。例如，攻击者会登录公司网站，查看各种页面，并下载文档进行进一步研究。这些交互被认为是预期的用户活动，很少被检测为攻击该目标的前奏。\n\
  \n-   **主动侦查**涉及直接查询或其他交互（例如，对目标网络进行端口扫描），这可能会触发系统报警，或允许目标捕获攻击者的 IP 地址和活动。这些信息可能被用于识别和逮捕攻击者，或在法律诉讼过程中提供证据。由于主动侦查需要测试人员使用额外技术来保持不被发现，因此将在`第\
  \ 3 章，`主动侦查与漏洞扫描`中介绍。\n\n[ 44 ]\n\n## 第 2 章\n\n渗透测试人员或攻击者通常遵循结构化的信息收集流程，从宽泛的范围（业务和监管环境）转向非常具体的范围（用户账户数据）。\n\
  \n为了确保有效性，测试人员在开始收集之前应该确切知道自己在寻找什么，以及数据将如何被使用。使用被动侦查并限制收集的数据量可以最大限度地减少被目标检测到的风险。\n\
  \n### 开源情报\n通常，渗透测试或攻击的第一步是收集开源情报，或 OSINT。\n\nOSINT 是从公共来源（特别是互联网）收集的信息。可用信息量是惊人的——大多数情报和军事组织都在积极参与\
  \ OSINT 活动，以收集有关其目标的信息，并防止有关自身的数据泄露。\n\n\n美国陆军手册 ATP 2-22.9（`http://www.fas.org/irp/doddir/army/atp2-22-9.pdf`）和\
  \ NATO OSINT 手册（`http://information-retrieval.info/docs/NATO-OSINT.html`）均可以在网上找到，对如何收集和评估\
  \ OSINT 提供了良好的技术评审。\n\n目标收集的信息取决于渗透测试的初始目标。例如，如果测试人员想要访问财务数据，他们需要相关员工（首席财务官、应收账款和应付账款等）的名字和个人信息、他们的用户名和密码。如果攻击路径涉及社会工程学，他们可能会补充这些信息，提供增加信息请求可信誉的细节。\n\
  \nOSINT 收集通常从审查目标的官方在线存在（网站、博客、社交媒体页面和第三方数据库，如公共财务记录）开始。感兴趣的信息包括：\n\n-   办公室的地理位置，特别是那些共享公司信息但可能缺乏严格安全控制的远程或卫星办公室。\n\
  -   母公司及任何子公司的概况，特别是通过合并或收购获得的新公司（这些公司的安全性通常没有母公司那么高）。\n\n[ 45 ]\n\n## 识别目标 – 被动侦查\n\
  \n-   员工姓名和联系方式，特别是姓名、电子邮件地址和电话号码。\n-   关于公司文化和语言的线索；这将有助于社会工程学攻击。\n-   可能连接到目标网络的业务伙伴或供应商。\n\
  -   正在使用的技术。例如，如果目标发布了关于采用新设备或软件的新闻稿，攻击者将查看供应商网站，查找漏洞报告、已知或怀疑的漏洞，以及可能用于促进各种攻击的细节。\n\
  \n攻击者使用的其他在线信息源可能包括以下：\n\n\n最有效的搜索引擎之一是 `Yandex`（`www.yandex.com`）。这个俄罗斯语言搜索引擎是世界第四大搜索引擎，它允许用户使用多种语言（包括英语）进行搜索。它还支持非常细粒度的搜索表达式，在搜索特定信息时比\
  \ Google 更有效。\n\n其他应该搜索的在线源还包括：\n\n-   政府、财务或其他监管网站，这些网站提供有关合并与收购的信息、关键人员名单和支持数据。\n\
  -   Usenet 新闻组，特别是目标员工寻求有关特定技术帮助的帖子。\n-   LinkedIn、Jigsaw 以及其他提供员工信息的网站。\n-   求职网站，特别是针对技术职位的求职网站，这些网站提供了成功的应聘者必须支持的技术和服务的列表。\n\
  -   由搜索引擎检索的历史内容或缓存内容（Google 中的 `cache:url`，或者 `www.archive.org` 上的 WayBack Machine）。\n\
  \n[ 46 ]\n\n## 第 2 章\n\n-   特定国家和语言的社交及业务相关网站（参考 `http://searchenginecolossus.com`）。\n\
  -   聚合并比较多个搜索引擎结果的网站，例如 `Zuula`（`www.zuula.com`）。\n-   公司和员工博客，以及关键员工的个人博客。\n- \
  \  社交网络（LinkedIn、Facebook 和 Twitter）。\n-   提供 DNS、路由和服务器查询的网站，特别是 `DNSstuff`（`www.dnsstuff.com`）、`ServerSniff`（`www.serversniff.net`）、`Netcraft`（`www.netcraft.com`）和\
  \ myIPneighbors.com。\n-   `Shodan`（`www.shodanHQ.com`），有时被称为“黑客 Google”；Shodan 列出了互联网可访问设备，并允许测试人员搜索具有已知漏洞的设备。\n\
  -   密码破解站（pastebin，使用 `site:pastebin.com \"targetURL\"` 进行搜索）。\n\n\n### DNS 侦查与路由映射\n\
  一旦测试人员确定了在线存在并包含感兴趣项目的目标，下一步是识别目标的 IP 地址和路由。\n\nDNS 侦查涉及识别特定域名或 IP 地址的所有者（whois\
  \ 类型信息）、定义分配给域名和 IP 地址的 DNS 信息，以及渗透测试人员或攻击者与最终目标之间的路由。\n\n这种信息收集是半主动的——部分信息可以从免费的开放源获取，而其他信息可以从第三方（如\
  \ DNS 注册商）获取。虽然注册商可能会收集 IP 地址和有关请求的数据，但很少提供给最终目标。目标可以直接监控的信息（如 DNS 服务器日志）几乎从不审查或保留。\n\
  \n由于所需的信息可以使用定义的系统化方法论进行查询，因此其收集可以是自动化的。\n\n\n\n请注意，DNS 信息可能包含过或错误的条目。为了尽量减少不准确信息，请查询不同的源服务器并使用不同的工具来交叉验证结果。审查结果，并手动验证任何可疑的发现。使用脚本自动化此类信息的收集。脚本应为渗透测试创建一个文件夹，然后为运行的每个应用程序创建一系列文件夹。在脚本执行每个命令后，将结果直接管道到特定的存放文件夹中。\n\
  \n### WHOIS\n\n研究 IP 地址空间的第一步是识别分配给目标网站的地址。这通常通过使用 `whois` 命令完成，该命令允许人们查询存储互联网资源（如域名或\
  \ IP 地址）注册用户信息的数据库。\n\n根据所查询的数据库不同，`whois` 请求的响应将提供名称、物理地址、电话号码和电子邮件地址（这对于便利社会工程攻击非常有帮助），以及\
  \ IP 地址和 DNS 服务器名称。\n\n攻击者可以使用来自 `whois` 查询的信息来：\n- 针对查询中识别出的位置或人员发起社会工程攻击\n- 识别物理攻击的地点\n\
  - 识别可用于盲打（`war dialing`）攻击或进行社会工程攻击的电话号码\n- 进行递归搜索，以定位托管在与目标相同服务器上或由同一用户的其他域名；如果这些域名不安全，攻击者可以利用它们获取服务器的管理员权限，然后入侵目标服务器\n\
  - 在域名即将到期的情况下，攻击者可以尝试接管域名，并创建一个仿造网站来欺骗认为自己在原始网站上的访问者\n- 攻击者将使用权威 DNS 服务器（即该域名的查询记录）来辅助\
  \ DNS 侦察\n\n### [48]\n\n## 第 2 章\n\n请注意，使用第三方保护此类数据的情况正在增加，某些域名（如 .gov 和 .mil）可能无法从公众访问。对这些域名的请求通常会被记录。目前有多个在线列表描述了分配给政府使用的域名和\
  \ IP 地址；大多数工具都接受“无联系”（no contact）地址选项，政府域名应输入这些字段中，以避免引起错误的关注！\n\n发布 `whois` 查询最简单的方法是从命令行。以下截图显示了针对\
  \ Digital Defence 域名运行的 `whois` 命令：\n\n```\n![](img/index-66_1.png)\n```\n\n返回的\
  \ `whois` 记录包含地理信息、名称和联系信息——所有这些都可用于便利社会工程攻击。\n\n\n### [49]\n\n### 识别目标 – 被动侦察\n\
  \n#### DNS 侦察\n\n`域名系统`（`DNS`）是一个分布式数据库，用于将名称（如 www.digitaldefence.ca）解析为其 IP 地址（192.150.2.140）。\n\
  \n攻击者以以下方式使用 DNS 信息：\n\n- 使用暴力破解攻击，允许攻击者识别与目标相关的新域名。\n- 如果 DNS 服务器配置为允许向任何请求者进行区域传输（zone\
  \ transfer），它将提供可访问系统的主机名和 IP 地址，更容易识别潜在目标。如果目标没有将公共（外部）DNS 信息与私（内部）DNS 信息隔离开，区域传输可能会暴露内部设备的主机和\
  \ IP 地址。（注意，如果触发区域传输请求，大多数 IDS 和 IPS 系统将触发警报）。\n- 寻找可能存在漏洞（例如 FTP）或其他有价值的服务（远程管理面板和远程访问）。\n\
  - 寻找配置错误和/或未修复的服务器（`dbase.test.target.com`）。\n- `服务记录`（`SRV`）提供服务、传输、端口和及重要性顺序的信息。这允许攻击者推导出软件。\n\
  - `域名密钥识别邮件`（`DKIM`）和`发送者策略框架`（`SPF`）记录用于控制垃圾邮件。如果识别出这些记录，攻击者就知道：\n    - 他们比大多数组织更有安全意识。\n\
  \    - 这可能影响钓鱼和其他社会工程攻击。\n\nWindows 和 Unix 都支持如 `nslookup` 等基本命令行工具，而 Unix 系统还支持如\
  \ `dig` 等额外的命令行选项。遗憾的是，这些命令通常一次查询一个服务器，并且需要交互式响应才能生效。\nKali 具有多个工具，旨在对特定目标迭代查询 DNS\
  \ 信息。所选工具必须适应与目标通信时使用的 IP 协议版本——IPv4 或 IPv6。\n\n### [50]\n\n## 第 2 章\n\n### IPv4\n\
  \nIP（或互联网协议）地址是用于标识连接到私有网络或公共互联网的设备的唯一数字。今天，互联网很大程度上基于版本 4，即 IPv4。Kali 包含了几个工具来便利\
  \ DNS 侦察，如下表所示：\n\n| 应用 | 描述 |\n| :--- | :--- |\n| `dnsenum`, `dnsmap`, 和 `dnsrecon`\
  \ | 这些是全面的 DNS 扫描器——DNS 记录枚举（A, MX, TXT, SOA, 通配符等）、子域名暴力破解攻击、Google 查询、反向查询、区域传输和区域遍历。`dnsrecon`\
  \ 通常是首选——它可靠性很高，结果解析良好，且数据可以直接导入 Metasploit 框架。 |\n| `dnstracer` | 它确定给定的域名系统从哪里获取信息，并顺着\
  \ DNS 服务器链追溯服务器。 |\n| `dnswalk` | 该 DNS 调试器检查指定域名的一致性和准确性。 |\n| `fierce` | 通过尝试区域传输和暴力破解攻击针对指定域名定位不连续的\
  \ IP 空间和主机名。 |\n\n在测试期间，大多数调查人员运行 `fierce` 以确认所有可能的目标已被识别，然后运行至少两个全面的工具（例如 `dnsenum`\
  \ 和 `dnsrecon`）来生成尽可能的数据并提供某种程度的交叉验证。\n\n### [51]\n\n\n在下图中，`dnsrecon` 用于生成标准的 DNS\
  \ 记录搜索以及针对 SRV 记录的搜索。显示了每种情况的结果。\n\n```\n![](img/index-69_1.png)\n```\n\n`DNSrecon`允许渗透测试人员获取\
  \ SOA 记录、名称服务器（NS）、邮件交换器（MX）主机、使用`发送者策略框架`（SPF）发送电子邮件的服务器以及正在使用的 IP 地址范围。\n\n###\
  \ [52]\n\n## 第 2 章\n\n### IPv6\n\n尽管 IPv4 似乎允许巨大的地址空间，但空闲 IP 地址几年前就已经耗尽，迫使使用 NAT\
  \ 和 DHCP 来增加可用地址数量。更永久的解决方案是采用改进的 IP 方案——IPv6。尽管它占互联网地址的不到百分五，但其使用量正在增加，渗透测试人员必须准备好\
  \ IPv4 和 IPv6 之间的差异。\n\n在 IPv6 中，源地址和目的地址长度为 128 位，产生 2¹²⁸ 个可能的地址，即 340 涧亿地址！\n\n\
  \n\n可寻地址空间的增大给渗透测试人员带来了一些问题，特别是当使用扫描器遍历可用地址空间以寻找活跃服务器时。然而，`IPv6` 协议的某些功能简化了发现过程，特别是使用\
  \ `ICMPv6` 来识别活跃的链路本地地址（link-local addresses）。\n\n在进行初始扫描时考虑 IPv6 是非常重要的，原因如下：\n\
  \n- 测试工具对 IPv6 功能的支持程度不一，因此测试人员必须确保每个工具都经过验证，以确定其在 IPv4、IPv6 和混合网络中的性能和准确性。\n- 由于\
  \ IPv6 是一个相对新的协议，目标网络可能包含泄露重要数据的配置错误；测试人员必须准备好识别并利用这些信息。\n- 旧的网络控制设备（防火墙、IDS 和 IPS）可能无法检测\
  \ IPv6。在这种情况下，渗透测试人员可以使用 IPv6 隧道与网络保持隐蔽通信，并在不被察觉的情况下外泄数据。\n\nKali 包含了几个专门开发的工具，用以利用\
  \ IPv6 的优势（最全面的扫描器，如 `nmap` 现在已支持 IPv6），其中一些如下；专门针对 IPv6 的工具很大程度上源自 THC-IPv6 Attack\
  \ Toolkit。\n\n| 应用 | 描述 |\n| :--- | :--- |\n| `dnsdict6` | 使用提供的字典文件或其内部列表进行暴力搜索，枚举子域名以获取\
  \ IPv4 和 IPv6 地址（如果存在）。 |\n| `dnsrevenum6` | 根据给定的 IPv6 地址执行反向 DNS 枚举。 |\n\n###\
  \ [53]\n\n### 识别目标 – 被动侦察\n\n\n![](img/index-71_1.png)\n\n#### 映射通往目标的路由\n路由映射最初被用作诊断工具，允许您查看\
  \ IP 数据包从一个主机到另一个主机所遵循的路由。通过使用 IP 数据包中的生存时间（`TTL`）字段，从一点到下一点每个跳数（`hop`）都会触发接收路由器产生一个\
  \ `ICMP TIME_EXCEEDED` 消息，并将 `TTL` 字段中的值减 1。数据包会记录跳数和经过的路由。\n\n从攻击者或渗透测试人员的角度来看，`traceroute`\
  \ 数据可以产生以下重要数据：\n\n- 攻击者与目标之间的精确路径\n- 有关网络外部拓扑的提示\n- 访问控制设备（防火墙和数据过滤路由器）的识别，这些设备可能正在过滤攻击流量\n\
  - 如果网络配置错误，可能识别出内部地址\n\n使用基于网络的 traceroute（`www.traceroute.org`），可以追踪到目标网络的各种地理源站点。这类扫描经常识别出多个连接到目标的不同网络，而这些信息如果仅从靠近目标的位置执行单个\
  \ traceroute 可能会遗漏。基于网络的 traceroute 还可以识别出连接两个或多个网络的多宿主主机。这些主机是攻击者的重要目标，因为它们极大地增加了通往目标的攻击面。\n\
  \n### [54]\n\n### 第二 2 章\n\n在 Kali 中，`traceroute` 是一个使用 `ICMP` 数据包映射路由的命令行程序；在 Windows\
  \ 中，该程序是 `tracert`。\n\n\n![](img/index-72_1.png)\n\n然而，如果使用 Windows 命令行通过 `tracert`\
  \ 运行相同的请求，我们将看到以下：\n\n![](img/index-72_2.png)\n\n我们不仅得到了完整的路径，还可以看到 `www.google.com`\
  \ 解析到的略有不同的 IP 地址，这表明负载均衡器正在起作用（你可以使用 Kali 的 `lbd` 脚本来确认这一点；但此活动可能会被目标网站记录）。\n\n\
  路径数据不同的原因是，默认情况下，`traceroute` 使用 `UDP` 报文，而 Windows 的 `tracert` 使用 `ICMP echo request`（`ICMP\
  \ type 8`）。因此，在使用 Kali 工具完成 `traceroute` 运行时，使用多种协议以获取最完整的路径并绕过数据过滤设备是关重要的。\n\n\
  ### [55]\n\n### 识别目标 – 被动侦察\n\nKali 提供了以下工具来完成路由追踪：\n\n| 应用 | 描述 |\n| :--- | :---\
  \ |\n| `hping3` | 这是一个 `TCP/IP` 数据包组装和分析器。它支持 `TCP`、`UDP`、`ICMP` 和 `raw-IP`，并使用类似\
  \ ping 的接口。 |\n| `intrace` | 它允许用户通过利用现有 `TCP` 连接（无论是从本地系统或网络发起，还是从本地主机发起）来枚举 IP\
  \ 跳数。这对于绕过防火墙等外部过滤器非常有用。`intrace` 是可靠性较高的 `0trace` 程序的替代品。 |\n\n`hping3` 是最有用的工具之一，因为它提供了对数据包类型、源数据包和目标数据包的控制。例如，Google\
  \ 不允许 ping 请求。但是如果你将数据包作为 `TCP SYN` 请求发送，则可以 ping 通服务器。\n\n在接下来的示例中，测试人员尝试从命令行 ping\
  \ Google。返回的数据识别出 `www.google.com` 是一个未知主机；Google 显然阻止了 ICMP 命令。然而，通过以下方式调用 `hping3`：\n\
  \n1. 使用 `TCP` 并设置 `SYN` 标志发送数据包（`-S`）。\n2. 将数据包指向端口 80（`-p80`）。\n3. 设置计数为三个（`-c3`）。\n\
  \n```\nhping3 -S -p80 -c3 google\n```\n\n### [56]\n\n### 第二 2 章\n\n要执行前面的步骤，使用如下所示的命令：\n\
  \n![](img/index-74_1.png)\n`hping3` 命令成功识别出目标在线并提供了一些路由信息。\n\n#### 获取用户信息\n许多渗透测试人员收集用户名和电子邮件地址，因为这些信息经常用于登录目标系统。最常用的工具是网络浏览器，用于手动搜索目标网站以及\
  \ `LinkedIn` 或 `Jigsaw` 等第三方网站。\n\nKali 自带的一些工具可以补充手动搜索。前员工的电子邮件地址仍然具有价值。在进行社交工程攻击时，将信息请求指向前员工通常会给攻击者带来“可信度”。此外，许多组织没有正确终止员工账户，这些凭据可能仍然可以访问系统。\n\
  \n### [57]\n\n### 识别目标 – 被动侦察\n\n#### 收集姓名和电子邮件地址\n`theharvester` 工具是一个 Python 脚本，在流行的搜索引擎和其他网站上搜索电子邮件地址、主机和子域名。使用\
  \ `theharvester` 相对简单，因为只有几个需要设置的命令行开关：\n\n- `-d`: 指定要搜索的域名；通常是域名或目标网站。\n- `-b`:\
  \ 指定提取数据的源；必须是以下之一：`Bing`、`BingAPI`、`Google`、`Google-Profiles`、`Jigsaw`、`LinkedIn`、`People123`、`PGP`\
  \ 或 `All`。\n- `-l`: 此限制选项指示 `theharvester` 只从指定数量的返回结果中收集。\n- `-f`: 此选项用于将结果保存为\
  \ HTML 和 XML 文件。如果省略此选项，结果将显示在屏幕上而不保存。\n\n以下截图显示了对 `digitaldefence.ca` 域名进行 Google\
  \ 索引搜索的结果：\n\n\n### [58]\n\n\n\n\n\n# 第 2 章\n\n## 收集文档元数据\n文档元数据是指附加到文档的信息，以便应用程序在创建和存储过程中对其进行管理。通常附加到文档的元数据示例包括以下内容：\n\
  \n• 创建文档的应用程序的所有者或个人\n• 文档作者姓名\n• 文档创建的时间日期\n• 文件最后打印或修改的日期；在某些情况下，它会标识是谁进行了修改\n\
  • 文档创建所在的计算机网络位置\n• 某些文件（尤其是由相机或移动设备创建的文件）可能包含地理标记，用于识别图像创建的位置\n\n元数据对终端用户而言并非立即可见，因此大多数文档在发布时保留了完的元数据。遗憾的是，这种数据泄露可能会暴露供测试人员或攻击者利用以便利攻击的信息。至少，测试人员和攻击者可以通过与文档中的数据对比来收集用户名；他们可以识别与特定数据类型（如年度财务报告或战略规划）相关的人员。\n\
  随着移动设备的日益普及，与地理元数据相关的风险也随增加。攻击者寻找地点（经常访问的度假小屋、酒店和餐厅），这些地点可能允许他们对在企业边界之外放松警惕的用户发起攻击。例如，如果目标组织的员工在等通勤火车时经常向社交媒体网站发布照片，攻击者可能会针对该员工进行物理攻击（盗取移动设备）、无线攻击，甚至从受害者的肩后偷看用户名和密码。\n\
  \n[59]\n\n### 识别目标 – 被动侦察\n在 Kali 上，工具 `Metagoofil` 通过执行 Google 搜索来识别并下载目标网站的文档（doc,\
  \ docx, pdf, pptx, xls 和 xlsx），并提取用户名、软件版本、路径存储名称以及服务器或工作站名称，如下截图所示：\n\n![](img/index-77_1.png)\n\
  \n`Metagoofil` 将指定数量的文档下载到临时文件夹，并提取并组织相关的元数据。它也可以对之前下载并现在存储在本地的文件执行此功能。\n\n`Metagoofil`\
  \ 的首次返回之一是发现的用户列表。以下是截断列表的截图：\n\n![](img/index-77_2.png)\n\n[60]\n\n## 第 2 章\n`Metagoofil`\
  \ 还可以识别文档的服务器和路径名。如果某些感兴趣文档与特定用户关联（例如，在行政助理的工作站上发现的财务报告草案），则在后续测试期间可以将该系统作为目标，如下截图所示：\n\
  ![](img/index-78_1.png)\n\n## 为密码列表创建用户画像\n到目前，你已经学习了如何使用被动侦察来收集测试目标用户的姓名和传记信息；这是黑客所使用的相同过程。下一步是使用这些信息创建针对特定用户和目标的密码列表。\n\
  \n常用密码列表可供下载，并存储在 Kali 的 `/usr/share/wordlists` 目录下。这些列表反映了大量用户的选择，对于应用程序来说，在尝试队列中的下一个密码之前尝试每个可能的密码，可能会非常耗时。\n\
  \n幸运的是，`Common User Password Profiler` (`CUPP`) 允许测试人员生成针对特定用户的字典文件。`CUPP` 曾存在于\
  \ Backtrack 5r3 中；但在 Kali 上使用需要下载。要获取 `CUPP`，请输入以下命令：\n\n```bash\ngit clone https://github.com/Mebus/cupp.git\n\
  ```\n\n这将 `CUPP` 下载到本地目录。\n\n`CUPP` 是一个 Python 脚本，可以在 `CUPP` 目录下通过输入以下命令轻松调用：\n\n\
  ```bash\nroot@kali:~# python cupp.py -i\n```\n[61]\n\n### 识别目标 – 被动侦察\n这将以交互模式启动\
  \ `CUPP`，该模式会提示用户输入用于创建字典文件的特定信息元素。示例如所示：\n\n![](img/index-79_1.png)\n\n当交互模式完成字典文件的创建后，它将被放置在\
  \ `CUPP` 目录。\n\n[62]\n\n## 第 2 章\n### 总结 攻击过程或杀伤链中的第一个真实步骤是进行侦察以识别目标和潜在攻击路径。被动侦察评估公开数据。这是一种隐蔽的评估——攻击者的\
  \ IP 地址或活动与正常访问几乎无法区分。尽管如此，在进行社会工程学攻击或便利其他攻击类型时，这些信息可能是至关重要的。\n\n在下一章中，我们将评估更具主动性的侦察类型。虽然这些技术产生更多信息，但被检测的风险随之增加。因此，重点将放在先进的隐身技术上。\n\
  \n[63]\n\n### 主动侦察与漏洞扫描\n\n我们已经看到几乎无法被检测的被动侦察如何产生有关目标组织及其用户的大量信息。\n\n主动侦察建立在开源情报和被动侦察结果的基础上，侧重于使用探测器来识别通往目标的路径以及目标暴露的\
  \ `attack surface`（攻击面）。通常，复杂系统具有更大的攻击面，每个攻击面都可能被利用并用于支持额外的攻击。\n\n尽管主动侦察产生更多、更有用的信息，但与目标的交互可能会被记录，从而触发防火墙和入侵检测系统等防护设备的警报。随着数据对攻击者的有用性增加，被检测的风险也随之增加；如下图所示：\n\
  \n对攻击者的有用性 漏洞扫描\n操作系统、服务 基础设施、应用程序、主机检测、补丁级别检测\nOSINT、被动 与目标交互 检测概率\n\n### 引言\n\
  为了提高主动侦察提供详细信息的有效性，我们的重点将放在使用隐蔽的、难以检测的技术。\n\n在本章中，你将学习：\n\n• 隐身扫描策略\n• 网络基础设施、主机发现与枚举\n\
  • 综合侦察应用程序，特别是 `recon-ng`\n• 针对性漏洞扫描\n\n\n\n\n- 修改数据包参数 (`nmap`)\n- 使用匿名网络配合代理（`ProxyChains`\
  \ 和 `Tor` 网络）\n\n### 调整源 IP 栈和工具\n\n#### 标识设置\n在渗透测试人员（或攻击者）开始测试之前，它必须确保 Kali 上所有不必要的服务都已禁用或关闭。\n\
  \n[ 66 ]\n\n## 第 3 章\n\n例如，如果启用了本地 DHCP 守护进程且不需要，那么 DHCP 可能会与目标系统交互，这可能会被记录并向目标管理员发送警报。\n\
  \n大多数测试人员还会禁用测试系统上运行 `IPv6`。这会阻止 IPv6 在目标网络上宣告你的踪迹，并确保所有流量首先通过 IPv4 socks 代理路由。禁用\
  \ IPv6 可以通过编辑 `/etc/sysctl.conf` 文件并包含以下行来实现：`#disable ipv6`\n\n`net.ipv6.conf.all.disable_ipv6\
  \ = 1`\n`net.ipv6.conf.default.disable_ipv6 = 1`\n\n`net.ipv6.conf.lo.disable =\
  \ 1`\n\n一些商业和开源工具（例如 `Metasploit Framework`）会在其数据包上标记一个标识序列。虽然这在测试后对系统事件日志进行分析很有用（可以将特定测试工具发起的事件与系统事件日志进行直接比较，以确定网络如何检测和响应攻击），但它也可能触发某些入侵检测系统。在实验室系统上测试你的工具，以确定哪些数据包被标记了，然后更改标记或谨慎使用该工具。\n\
  \n识别标记最简单的方法是将工具应用于一个新创建的虚拟镜像作为目标，并检查系统日志中该工具的名称。此外，使用 `Wireshark` 捕获攻击者与目标虚拟机之间的流量，然后在`数据包捕获`（`pcap`）文件中搜索任何可以归因于测试工具的关键词（工具名称、供应商、许可证号等）。\n\
  \n`Metasploit Framework` 中的 `UserAgent` 可以通过修改 `http_form_field` 选项来更改。在 `msfconsole`\
  \ 提示符下，选择使用 `auxiliary/fuzzers/http/http_form_field`，然后设置一个新的 `useragent`，如如下截图所示：\n\
  \n![](img/index-84_1.png)\n\n在这个示例中，`UserAgent` 被设置为 Google 的索引爬虫 `Googlebot`。这是一种常见的访问和索引网站的自动化应用程序，很少引起网站所有者的注意。\n\
  \n要识别合法的 `UserAgents`，请参考 `www.useragentstring.com` 中的示例。\n\n[ 67 ]\n\n## 主动侦查与漏洞扫描\n\
  \n\n主动侦查最常见的方法是对目标进行扫描——向目标发送定义的数据包，然后使用返回的数据包来获取信息。此类工具最受欢迎的工具是 `Network Mapper`\
  \ (`nmap`)。\n\n为了有效使用 `nmap`，它必须以 root 级权限运行。这是操纵数据包的应用程序的典型特征，这也是为什么 Kali 在启动时默认以\
  \ root 身份运行。\n\n在尝试尽量减少检测时，某些用于避免检测及后续警报的隐身技术包括：\n\n- 在测试前识别扫描目标，并发送确定目标所需的最少数量数据包。例如，如果你想确认\
  \ Web 主机的存在，首先需要判断端口 80（基于 Web 的服务的默认端口）是否开放。\n- 避免进行可能连接到目标系统并泄露数据的扫描。不要 ping 目标，或使用同步\
  \ (`SYN`) 和非常规的数据包扫描，如确认 (`ACK`)、完成 (`FIN`) 和重置 (`RST`) 包。\n- 随机化或伪造数据包设置，例如源 IP\
  \ 和端口地址以及 MAC 地址。\n- 调整计时减慢数据包到达目标站点的速度。\n- 通过分片数据包或附加随机数据更改数据包大小，以迷惑数据包检测设备。\n\n\
  例如，如果你想进行隐身扫描并尽量减少检测，可以使用以下 `nmap` 命令：\n\n```bash\nnmap --spoof-mac-Cisco --data-length\
  \ 24 –T paranoid –max-hostgroup 1 – max-parallelism 10 -PN -f –D 10.1.20.5,RND:5,ME\
  \ --v –n –sS–sV–oA /desktop/pentest/nmap/out –p T:1-1024 –random-hosts 10.1.1.10\
  \ 10.1.1.15\n```\n\n下表详细解释了上述命令：\n| 命令 | 依据 |\n| :--- | :--- |\n| `--spoof-mac-Cisco`\
  \ | 伪造 MAC 地址以匹配 Cisco 产品。将 Cisco 替换为 0 将创建一个完全随机的 MAC 地址。 |\n| `--data-length 24`\
  \ | 向发送的大多数数据包附加 24 个随机字节。 |\n| `-T paranoid` | 将时间设置为最慢的设置——paranoid（谨慎）。 |\n\n\
  [ 68 ]\n\n## 第 3 章\n\n| 命令 | 依据 |\n| :--- | :--- |\n| `-- max-hostgroup` | 限制一次扫描的主机数量。\
  \ |\n| `-- max-parallelism` | 限制发出的待处理探测数量。你也可以使用 `--scan-delay` 选项设置探测之间的暂停；但此选项与\
  \ `--max_parallelism` 不兼容。 |\n| `-PN` | 不 ping 识别活动系统（这会泄露数据）。 |\n| `-f` | 分片数据包；这会欺骗低端\
  \ ID 配置。 |\n| `-D 10.1.20.5,RND:5,ME` | 创建与攻击者扫描同时进行的诱饵扫描；隐藏真实的攻击。 |\n| `-n` | 不解析\
  \ DNS；nmap 不会查询内部或外部 DNS 服务器。此类查询会被记录，因此应禁用查询功能。 |\n| `-sS` | 执行隐身 TCP 扫描，不完成握手。其他扫描类型（例如空扫描）也可以用；但大多数都会触发检测。\
  \ |\n| `-sV` | 启用版本检测。 |\n| `-oA /desktop/pentest/nmap/out` | 以所有格式输出结果（普通、grep\
  \ 和 XML）。 |\n| `-- random-hosts` | 随机主机顺序。 |\n\n这些选项共同创建一个非常缓慢且隐藏源身份的扫描。然而，如果数据包过于异常，复杂的修改可能会引起目标的注意；因此，许多测试人员和攻击者使用匿名网络来减少检测。\n\
  \n\n\n\n\n此文件规定了测试系统在通往 Tor 网络过程中将使用的代理数量和顺序。代理服务器可能会宕机，或者可能正经历高负负载（导致连接缓慢或延迟）；如果发生这种情况，定义的或严格的代理链（strict\
  \ proxychain）将会失败，因为缺少了预期的链接。因此，请禁用 `strict_chains` 的使用并启用 `dynamic_chains`，这可以确保连接能够被路由，如下截图所示：\n\
  \n![](img/index-87_1.png)\n\n[70]\n\n# 第 3 章\n\n3. 接下来，编辑 `ProxyList` 部分以确保存在 socks5\
