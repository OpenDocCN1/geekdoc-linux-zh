  ### 识别目标 – 被动侦察\n### 主动侦察与漏洞扫描\n### 漏洞利用\n### 利用后 – 目标行动\n### 利用后 – 持久化\n\n## 从\
  \ Kali Linux 开始\nKali Linux (Kali) 是 BackTrack 渗透测试平台的继者，BackTrack 通常被认为是用于促进渗透测试以保护数据和语音网络的事实标准工具包。本章将介绍\
  \ Kali，并侧重于定制化 Kali 以支持渗透测试的某些高级方面。在本章结束时，您将学习：\n\n• Kali 概览\n• 配置网络服务和安全通信\n• 更新\
  \ Kali\n• 定制 Kali\n• 使用第三方应用程序扩展 Kali 的功能\n• 渗透测试的有效管理\n\nKali Linux `BackTrack\
  \ (BT)` (www.offensive-security.com) 的发布是为了提供大量的渗透测试和防御工具，这些工具非常适合对评估和保护网络感兴趣审计员和网络管理员。同样的工具也被授权的和未授权的（黑客）渗透测试人员共同使用。\n\
  \nBackTrack 的最终版本 `BT 5r3` 于 2012 年 8 月发布。它基于 Ubuntu Linux 平台，被安全社区广泛采用和支持。遗憾的是，它的文件架构使其难以管理大量的工具及其随的依赖项。\n\
  \n在 BackTrack 中，所有用于渗透测试的工具都放置在 `/pentest` 目录中。如 `/web` 或 `/database` 等子目录有助于进一步定义工具的位置。在这种层次结构中查找和执行工具可能违背直觉。例如，`sqlninja`\
  \ 是一个识别 SQL 注入的 Web 漏洞评估工具、Web 漏洞利用工具还是数据库漏洞利用工具？\n\n在 2013 年 3 月，BackTrack 被 Kali\
  \ Linux 代代，后者使用了基于 Debian GNU/Linux 操作系统的全新平台架构。\n\nDebian 遵循 `文件系统层次结构标准 (FHS)`，这是相对于\
  \ BackTrack 的一个显著优势。您不需要在 `/pentest` 树中进行导航，而是可以从系统的任何地方调用工具，因为应用程序包含在系统路径中。\n\n\
  Kali 的其他特性包括：\n\n• 支持多种桌面环境，如 Gnome、KDE、LXDE 和 XFCE，并提供多语言支持。\n• 遵循 Debian 标准的工具每天与\
  \ Debian 仓库同步至少四次，使得更新包和应用安全修复变得更加容易。\n• 支持 ISO 定制，允许用户构建自己的 Kali 版本。引导功能还可以执行可以使用预-seed\
  \ 文件自动化的企业级网络安装。\n• 对 `ARMEL` 和 `ARMHF` 支持允许 Kali 安装在树莓派、ODROID-U2/-X2 以及三星 Chromebook\
  \ 等设备上。\n• 包含超过 300 渗透测试、数据取证和防御工具。它们通过内核补丁提供了广泛的无线支持，允许某些无线攻击所需的封包注入。\n• Kali 仍然是一个免费的开源项目。最重要的是，它受到了活跃在线社区的良好支持。\n\
  \n在整本书中，我们将使用 64 位的 Kali VMware `virtual machine (VM)`（有关安装 Kali 的说明，请参考*附录*、*安装\
  \ Kali Linux*）。\n\n使用虚拟机是因为它可以很容易地在其他操作系统（如微软 Windows）中快速执行某些应用程序。此外，虚拟机可以与渗透测试的结果一起归档，允许对存档进行审查，以确定使用用于测试的工具集是否会检测到特定的漏洞。\n\
  \n## [ 16 ]\n### 第一章\n当 Kali 启动时，用户将进入带有顶部菜单栏和几个图标的默认 GUI。通过选择菜单项 `Applications`，然后选择\
  \ `Kali Linux`，用户将进入一个菜单系统，其中包含`前 10 安全工具` 以及一系列渗透测试期间遵循的通用文件夹，如下所示：\n\n![](img/34_.)\n\
  \n该菜单对于 `BT 5r3` 的用户来说是熟悉的，但有一些变化，包括简化了网络服务的访问。\n\n## 从 Kali Linux 开始\n### 配置网络服务和安全通信\n\
  能够使用 Kali 的第一步是确保它连接到有线或无线网络以支持更新和定制。您可能需要通过 `DHCP (动态主机配置协议)` 获取 IP 地址，或静态分配。首先，在终端窗口中使用\
  \ `ifconfig` 命令确认您的 IP 地址，如下：\n\n![](img/35_.)\n\n在这种情况下，虚拟机被分配了 IP 地址 `192.168.204.132`。如果没有获取\
  \ IP 地址，可以使用 `dhclient eth0` 命令通过 DHCP 分配（取决于系统的特定配置）。\n\n如果使用静态 IP 地址，可能需要其他信息。例如，可以通过以下方式分配\
  \ `192.168.204.128` 的静态 IP：`主机 IP 地址：192.168.204.128`、`子网掩码：255.255.255.0`、`默认网关：192.168.204.1`、`DNS\
  \ 服务器：192.168.204.10`。\n\n## [ 18 ]\n### 第一章\n进入终端窗口并输入以下命令：\n\n```\nroot@kali:~#\
  \ ifonconfig eth0 192.168.204.128/24\nroot@kali:~# route add default gw 192.168.204.1\n\
  root@kali:~# echo nameserver 192.168.204.10 > /etc/resolv.conf\n```\n\n\n\n\n\n\
  对 IP 设置的更改是非持久的，当 Kali 重启时，更改将会丢失。要使更改永久生效，您需要编辑 `/etc/network/interfaces` 文件，如下所示所示：\n\
  \n![](img/index-36_1.jpg)\n\n默认情况下，Kali 启动时不会启用 `DHCP` 服务。启用该服务会在网络上发布新的 IP 地址，这可能会向管理员提醒测试人员的存在。对于某些测试用例，这可能不是问题，而且在启动启动期间自动启动某些服务可能是有益的。通过输入以下命令可以实现这一点：\n\
  \nroot@kali~# update-rc.d networking defaults\nroot@kali~# /etc/init.d/networking\
  \ restart\n```\n\nKali 安装了可以根据需要启动或停止的网络服务，包括 `DHCP`、`HTTP`、`SSH`、`TFTP` 和 `VNC`\
  \ 服务器。这些服务通常从命令行调用，但某些服务也可以从 Kali 菜单访问。\n\n### [19]\n*从 Kali Linux 开始*\n\n#### 调整网络代理设置\n\
  位于已身份验证或未身份验证代理连接后的用户必须修改 `bash.bashrc` 和 `apt.conf`。这两个文件都位于 `/root/etc` 目录。\n\n\
  1. 编辑 `bash.bashrc` 文件，如下所示所示，使用文本编辑器将以下行添加到 `bash.bashrc` 文件的末尾：\n```bash\nexport\
  \ ftp_proxy=\"ftp://user:password@proxyIP:port\"\nexport http_proxy=\"http://user:password@proxyIP:port\"\
  \nexport https_proxy=\"https://user:password@proxyIP:port\"\nexport socks_proxy=\"\
  https://user:password@proxyIP:port\"\n```\n\n![](img/index-37_1.jpg)\n\n2. 将 `proxyIP`\
  \ 和 `port` 分别替换为您的代理 IP 地址和端口号，并将用户名和密码替换为您的身份验证用户名和密码。如果没有身份验证，只需编写 `@` 符号之后部分即可。\n\
  \n3. 在同一目录下，创建 `apt.conf` 文件并输入以下命令行，如下所示所示：\n\n#### 第一章\n![](img/index-38_1.jpg)\n\
  \n4. 保存并关闭文件。注销然后重新登录以激活新设置。\n\n#### 使用 Secure Shell 加固通信\n为了尽可能减少测试期间被目标网络检测的概率，Kali\
  \ 不启用任何外部监听的网络服务。某些服务如 `Secure Shell` (`SSH`) 已经安装。但是，在使用之前必须先启用它们。\n\nKali 预配置了默认的\
  \ `SSH` 密钥。在启动 `SSH` 服务之前，禁用默认密钥并生成唯一的密钥集供使用是一个好习惯。\n\n将默认的 `SSH` 密钥移动到备份文件夹，然后使用以下命令生成新的\
  \ `SSH` 密钥集：\n\n```bash\ndpkg-reconfigure openssh-server\n```\n\n移动原始密钥并生成新密钥集的过程如下所示所示。\n\
  \n![](img/index-38_2.png)\n\n### [21]\n*从 Kali Linux 开始*\n\n为了验证新生成的密钥是唯一的，计算它们的\
  \ `md5sum` 哈希值，并将其与原始密钥进行比较，如下所示所示。\n\n![](img/index-39_1.png)\n\n\n要从命令行启动 `SSH`，使用如下所示所示的命令行：\n\
  \n![](img/index-39_2.png)\n\n要验证 `SSH` 正在运行，执行 `netstat` 查询，如下所示所示：\n\n![](img/index-39_3.png)\n\
  \n在前面的示例中，`SSH` 守护进程监听端口 `22`。要停止 `SSH`，使用以下命令：\n\n```bash\n/etc/init.d/ssh stop\n\
  ```\n\n### [22]\n#### 第一章\n### 更新 Kali Linux\n必须定期对 Kali 进行补丁，以确保基础操作系统和应用程序是最新的，并应用了安全补丁。\n\
  \n#### Debian 包管理系统\nDebian 的包管理系统依赖于名为 `packages` 的离散组合应用程序。用户可以安装或删除 `Packages`\
  \ 以自定义环境，并支持渗透测试等任务。它们还可以扩展 Kali 的功能，支持诸如通信（`Skype`、即时消息和安全电子邮件）或文档（在 `Wine` 下运行的\
  \ `OpenOffice` 和 `Microsoft Office`）等任务。\n\n`Packages` 存储在仓库中并下载到系统用户以确保包的完整性。\n\
  \n### 软件包和仓库\n默认情况下，Kali 仅使用官方 Kali 仓库。不完整的安装过程可能将仓库添加到正确的源列表文件中，或者在添加新应用程序时您可能希望扩展可用的仓库。\n\
  \n更新 `source.list` 文件可以通过命令行完成（`echo deb http://http.kali.org/kali kali main contrib\
  \ non-free >> /etc/apt/sources.list`），或使用文本编辑器完成。\n\n应该出现在 `/etc/apt/sources.list`\
  \ 中的默认包仓库列举如下；如果不存在，请编辑 `sources.list` 文件将它们包含进来：\n```text\n## Kali\ndeb http://http.kali.org/kali\
  \ kali main contrib non-free\n## Kali-dev\ndeb http://http.kali.org/kali kali-dev\
  \ main contrib non-free\n## Kali Security\ndeb http://security.kali.org/kali-security\
  \ main contrib non-free\n```\n\n并不是 Kali 工具都维护在官方仓库中。如果您手动更新工具，可能会覆盖现有文件并破坏依赖。因此，某些尚未迁移到\
  \ Debian 的工具（如社会工程工具 `se-toolkit`）维护在 Bleeding Edge 仓库中。可以使用以下命令将该仓库添加到 `sources.list`：\n\
  \n```text\n## Bleeding Edge\ndeb http://repo.kali.org/kali main\n```\n\n*从 Kali\
  \ Linux 开始*\n\n## Dpkg\n`dpkg` 是 Debian 的包管理系统。该命令行应用程序用于安装、删除和查询包。通常情况下，`dpkg`\
  \ 对单个包执行操作。使用 `dpkg -l > list.txt` 命令可以编译出已安装应用的列表。如果您想知道某个特定工具是否已安装，请使用 `dpkg -l\
  \ | grep`。\n\n所示显示了调用 `dpkg -l` 时返回的数据片段，它列出了 Kali 上安装的所有应用程序；这对于识别可能直接从命令行访问的应用程序非常有帮助。\n\
  \n![](img/index-41_1.png)\n\n#### 使用高级软件包工具\n**高级软件包工具** (`APT`) 通过搜索仓库并安装或升级包及其所有所需的依赖来扩展\
  \ `dpkg` 的功能。`APT` 还可以升级整个发行版。\n\n常用的 `apt` 命令如下：\n- `apt-get update`：用于与源同步本地包索引文件。在执行升级\
  \ 或 `dist-upgrade` 之前，应始终使用 `update` 命令。\n- `apt-get upgrade`：用于安装使用 `/etc/apt/sources.list`\
  \ 安装的系统中所有包的最新版本。Kali 已安装且有新版本的包将被升级。`upgrade` 命令不会更改或删除未升级的包，也不会安装尚不存在的包。\n- `apt-get\
  \ dist-upgrade`：用于升级系统中当前安装的所有包及其依赖项。它还会从系统中删除过时的包。\n\n`apt-get` 命令还可以用于显示包的完整描述并识别其依赖项（`apt-cache\
  \ show <package name=\"\">`）或删除包（`apt-get remove <package name=\"\">`）。\n\n\n\n\n\
  \n在启动时运行 `apt-get update` 命令和 `upgrade` 命令，以确保你的会话使用的是最新的工具。实现此点的最简单方法是创建一个 `update.sh`\
  \ 脚本，并在其中包含以下命令行：\n\n```\napt-get update && apt-get upgrade –y && apt-get dist-upgrade\
  \ –y\n```\n\n某些应用程序不会通过 `apt-get` 命令进行升级。例如，`exploit-db` 存档的本地副本必须手动升级。创建一个名为 `update.sh`\
  \ 的脚本并向其中添加以下命令，以自动化更新过程：\n\n```\ncd /usr/share/exploitdb\nwget http://www.exploit-db.com/archive.tar.bz2\n\
  tar –xvjf archive.tar.bz2\n```\n\n# 配置和自定义 Kali Linux\nKali 是一个用于完成渗透测试的框架。然而，测试人员不应该觉得受限于默认安装的工具，或者\
  \ Kali 桌面面的外观和感受的束缚。通过自定义 BackTrack，测试人员可以提高所收集的客户端数据的安全性，并使渗透测试变得更容易。\n\n对 Kali\
  \ 常见的自定义包括：\n• 重置 root 密码\n• 添加非 root 用户\n• 加快 Kali 操作速度\n• 与 MS Windows 共享文件夹\n\
  • 创建加密文件夹\n\n[ 25 ]\n\n## 开始使用 Kali Linux\n\n### 重置 root 密码\n要更改用户密码，请使用以下命令：\n\n\
  ```\npasswd root\n```\n\n\n![](img/index-43_1.png)\n\n### 添加非 root 用户\nKali 提供的许多应用程序必须以\
  \ root 级权限才能运行。root 级权限具有一定的风险，例如，输入错误的命令或使用错误的命令会导致应用程序失败，甚至损坏正在测试的系统。在某些情况下，使用用户级权限进行测试更为理想。事实上，某些应用程序强制使用低权限账户。\n\
  \n要创建一个非 root 用户，你只需简单地在终端中使用 `adduser` 命令并按照出现的说明说明进行操作，如下截图所示：\n\n![](img/index-43_2.png)\n\
  \n### 加快 Kali 操作速度\n可以使用几种工具来优化和加速 Kali 操作：\n• 当使用虚拟机时，安装虚拟机的软件驱动程序包：`Guest Additions\
  \ (VirtualBox)` 或 `VMware Tools (VMware)`。\n\n[ 26 ]\n\n## 第 1 章\n• 在创建虚拟机时，选择固定磁盘大小而不是动态分配的磁盘。向固定磁盘添加文件的速度更快，且文件碎片更少。\n\
  • preload 应用程序 (`apt-get install preload`）会识别用户最常用的程序，并将二进制文件和依赖项预加载到内存中以提供更快的访问。它在安装后的首次重启后会自动运行。\n\
  • BleachBit (`apt-get install bleachbit`）通过释放缓存、删除 cookie、清除上网历史、粉碎临时文件、删除日志和丢其他不需要的文件来释放磁盘空间并改进隐私。高级功能包括粉碎文件以防止恢复，以及擦空空磁盘空间以隐藏未完全删除的文件痕迹。\n\
  • 默认情况下，Kali 不显示启动菜单中所有的应用程序。在启动过程中安装的每个应用程序都会减慢系统数据，并可能影响内存使用和系统性能。安装 `Boot Up\
  \ Manager` (`BUM`) 来禁用启动期间启用的不需要的服务和应用程序（`apt-get install bum`），如下截图所示：\n\n![](img/index-44_1.jpg)\n\
  [ 27 ]\n\n## 开始使用 Kali Linux\n• 添加 `gnome-do` (`apt-get install gnome-do`) 以从键盘直接启动应用程序。要配置\
  \ `gnome-do`，请从 **Applications** | **Accessories** 菜单中选择它。启动后，选择 **Preferences**\
  \ 菜单，激活 **Quiet Launch** 功能，并选择启动命令（例如 `Ctrl` + `Shift`）。清除任何现有命令，然后输入在选择启动键时要执行的命令行。\n\
  \n与其直接从键盘启动，还可以编写特定的脚本来启动复杂的操作。\n\n### 与 Microsoft Windows 共享文件夹\nKali 工具集具有灵活性，可以与位于不同操作系统（特别是\
  \ Microsoft Windows）上的应用程序共享结果。共享数据的最有效方法是创建一个从宿主机操作系统和 Kali Linux 虚拟机客户端都能访问的文件夹。\n\
  \n当数据从宿主机或虚拟机放入共享文件夹中时，它将立即通过共享文件夹供所有访问该文件夹的系统使用。\n\n要创建共享文件夹，请执行以下步骤：\n1. 在宿主机操作系统上创建一个文件夹。在本例中，它将被命名为\
  \ `Kali_Share`。\n2. 右键点击文件夹并选择 **Sharing** 选项卡。从此菜单中，选择 **Share**。\n3. 确保文件已与 **Everyone**\
  \ 共享，并且此共享的 **Permission Level** 设置为 **Read / Write**。\n4. 如果你尚未执行，请在 BackTrack\
  \ 上安装适当的工具。例如，使用 VMware 时，安装 `VMware tools`（请参见 *Appendix*，*Installing Kali Linux*）。\n\
  5. 安装完成后，进入 VMware 菜单并选择 **Virtual Machine Setting**。找到启用 **Shared Folders** 的菜单并选择\
  \ **Always Enabled**。为共享文件夹创建一个路径。\n\n[ 28 ]\n\n## 第 1 章\n![](img/index-46_1.png)\n\
  尽管 VirtualBox 使用不同的菜单，但过程是相同的。\n7. 将文件夹拖到 Kali 桌面上创建快捷方式。\n8. 放入文件夹的所有内容都可以在宿机的同名文件夹中访问，反之亦然。\n\
  \n共享文件夹包含渗透测试的敏感数据，必须进行加密，以防数据丢失或被盗时保护客户。\n\n[ 29 ]\n\n## 开始使用 Kali Linux\n### 使用\
  \ TrueCrypt 创建加密文件夹\n在渗透测试期间，你将获得敏感信息、可利用漏洞和成功破解的数据副本。测试人员有法律和道德责任确保这些信息始终安全。履行这一责任的最佳方法是确保所有客户信息在存储和传输过程中都加密。\n\
  \n要在 BackTrack 上安装 `TrueCrypt`，请完成以下步骤：\n1. 在 **Applications** 菜单中，选择 **Accessories**\
  \ | **TrueCrypt**。\n2. 要创建加密文件夹，打开应用程序。你将看到主菜单，如下所示：\n\n![](img/index-47_1.jpg)\n\
