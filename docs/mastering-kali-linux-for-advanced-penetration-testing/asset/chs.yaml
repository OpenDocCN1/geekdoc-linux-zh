  \ `Gmail` 网站。\n\n攻击者必须利用社会工程学强迫受害者访问用于回传操作的 IP 地址（例如，URL 缩短）。受害者将收到站点正在加载的消息（因为攻击脚本会在浏览器的另一个标签页下加载克隆站点，如下所示）：\n\
  \n# [188]\n\n## 第 7 章\n\n![](img/index-206_1.png)\n\n目标随后将看到伪造页面（仍显示错误的 IP 地址）。如果用户输入用户名和密码，数据将发布到攻击者系统上的监听器。如下截图所示，它捕获了用户密码。\n\
