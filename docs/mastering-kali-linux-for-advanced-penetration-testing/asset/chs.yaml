  # [185]\n\n## 物理攻击与社会工程\n\n### 使用网站攻击向量 – 凭据收取攻击\n\n#### 攻击方法\n凭据（通常是用户名和密码）允许人员访问网络、计算系统和数据。攻击者可以间接使用这些信息（通过登录受害者的\
  \ `Gmail` 账户并发送电子邮件来便利对受害者的信任连接发起攻击），或者直接针对用户的账户进行。鉴于凭据被广泛重用——用户通常会在多个处重用密码——这种攻击显得尤为相关。\n\
  \n特别受重视的是具有特权访问权限的凭据，例如系统管理员或数据库管理员，这可以允许攻击者访问多个账户和数据存储库。\n\n`SEToolkit` 的凭据收取攻击使用克隆站点来收集凭据。\n\
  \n要启动此攻击，请从主菜单中选择 `Website Attack Vectors`，然后选择 `Credential Harvester Attack Method`。在本例中，我们将按照菜单选择克隆一个网站，例如\
  \ `Facebook`。\n\n再次，必须将目标 IP 地址发送给预定的目标。当目标点击链接或输入 IP 地址时，他们将看到一个类似于 `Facebook`\
  \ 常规登录页的克隆页面，并被提示输入他们的用户名和密码。\n\n一旦完成，用户将被重定向到正常的 `Facebook` 网站，并在那里登录他们的账户。\n\n\
  在后台，他们的访问凭据将被收集并转发给攻击者。他们将在监听窗口中看到以下条目：\n\n![](img/index-203_1.png)\n\n# [186]\n\
  \n## 第 7 章\n\n当攻击者完成凭据收集后，输入 `CTRL` + `C` 将在 `/SET/reports` 目录中生成 `XML` 和 `HTML`\
  \ 格式的两个报告。\n\n类似的攻击选项是 `Web Jacking Attack`。当受害者打开攻击者的链接时，他们将将看到一个页面，告知他们所选页面已移动，如下截图所示：\n\
  \n![](img/index-204_1.png)\n\n当用户点击链接前往新位置时，他们将看到一个看起来是预期的克隆页面，如下方的截图所示；同样，该页面将收取他们的登录凭据。\n\
  \n![](img/index-204_2.png)\n\n注意，URL 地址栏中的地址不是 `Google` 的有效地址；如果用户能看到地址，大多数人都会识别出异常。成功的利用需要攻击者为受害者准备一个合适的理由（pretext）或故事，让受害者接受这个不寻常的\
  \ URL。例如，向一组特定的目标非技术管理人员发送电子邮件，宣布“本地 Google 邮件站点现在正由 IT 部门托管，以减少邮件系统的延迟”。\n\n# [187]\n\
  \n## 物理攻击与社会工程\n\n凭据收取攻击是评估公司网络安全性的极佳工具。为了有效，组织必须首先培训所有员工如何识别和应对钓鱼攻击。大约两周后，发送一封全公司范围的电子邮件，包含一些明显的错误（公司\
  \ CEO 姓名错误或包含错误地址的地址块）以及一个指向收取凭据程序的链接。计算用凭据做出响应的接收者百分比，然后定制培训计划以降低这一百分比。\n\n###\
  \ 使用网站攻击向量 – 标签劫持 (Tabnabbing)\n\n#### 攻击方法\nTabnabbing 通过在浏览器的一个标签页中加载伪造页面来利用用户的信任。通过伪造\
