  **项目协调 / 封面工作**：Akash Poojary, Pooja Chiplunkar.\n\n## 关于作者\n\n**Robert W. Beggs**\
  \ 是 Digital Defence 的创始人兼首席执行官，该公司专注于预防和响应信息安全事件。他在安全项目的技术领导方面拥有超过 15 年的经验，包括有线和无线网络的渗透测试、事件响应和数据取证。\n\
  \nRobert 是安全领域的坚定倡导者，也是 Toronto Area Security Klatch（北美地区最大的独立于供应商的安全用户小组）的联合创始人。他担任\
  \ SecTor 安全会议顾问委员会成员，以及多个学术安全计划的成员。他是一位热衷的安全培训师，曾在多所加拿大大学为研究生、本科生和继续教育的学生教授过信息安全课程。\n\
  \nRobert 拥有皇后大学的科学与技术工商管理学位（MBA），是注册信息系统安全专家（CISSP）。\n\n首先，可能最重要的是，我要感谢 Kali Linux\
  \ 的开发者和支持者。他们共同创造了保护网络和数据最重要的工具之一。我要感谢 Packt Publishing 的编辑和审核员，在本书编写期间提供的支持和无尽的耐心。我承诺下一本会写得更快！还要感谢\
  \ Brian Bourne 和 Toronto Area Security Klatch 的其他成员。他们给了我一个极佳的机会，让我与顶级的安全极客社区一起学习和分享知识。\n\
  \n在编写本书的过程中，我的家人给了我难以置信的动力支持。感谢 Sarah、Alex 和 Annika。\n\n最后，特别感谢我的父母——我不记得自己是什么时候开始学会阅读的——在你们的鼓励下，手里拿着书总是一件很自然的事。\n\
  \n谢谢。\n\n## 关于审核员\n\n**Terry P. Cutler** 是一位网络安全专家（认证伦理黑客），也是加拿大蒙特利尔 IT 安全与数据防御公司\
  \ Digital Locksmiths Inc. 的联合创始人兼首席技术官。他们保护小企业、大型机构、家庭和个人免受网络犯罪分子的侵害，这些分子每天估计有 150\
  \ 万人受害（仅在 Facebook 上就有 60 万人）。\n\n他专门负责政府、公司、企业和消费者安全漏洞的预测、评估和预防。自 2005 年以来，他一直一直是认证伦理黑客等，他曾有机会在\
  \ 2500 名现场观众面前以及向全球数万名观众（通过直播和录制流）演示黑客如何通过一个虚假的 LinkedIn 请求就能入侵几乎任何公司。你可以在他的 YouTube\
  \ 频道上查看这段视频。\n\nTerry 自 2006 年以来一直为儿童、父母和执法部门提供网络安全教育。他认为，预防、街道防护和亲子沟通是防止儿童被绑架或成为攻击和剥削受害者最有效的方法。给孩子们提供他们照顾自己所需的知识和实践技能，与教他们读写一样重要。你可以在\
  \ `http://www.TheCourseOnInternetSafety.com` 了解更多信息。\n\n他是有关网络犯罪、间谍活动、安全故障、网络诈骗以及个人每天面临的真实社交网络危险的媒体报道频繁贡献者。他被认为是变革型领导者、问题解决者和信赖的顾问，在各个层面建立良好的合作工作关系方面非常有天赋。\n\
  \n在 2011 年辞职全投入 Digital Locksmiths 之前，Terry 曾在软件巨头 Novell 工作。他加入了这家专注于企业操作系统、身份识别、安全和系统管理的全球软件公司，为全球多达\
  \ 45,000 名用户和 600 台服务器的优质客户提供工程支持。\n\n我想花时间感谢 Robert W. Beggs 在 2004 年慷慨地收我为导师，指导我度过了这个行业的流程和陷阱。现在我已成长为一名行业专家，我很荣幸能与\
  \ Rob 和他的读者分享我自己的学习收获和经验。\n\n特别感谢我的家人，我的妻子 Franca 和我们的儿子 David 和 Matthew，感谢他们过去几年里的支持、鼓励、耐心、拥抱和无条件的爱。\n\
  \n**Danang Heriyadi** 是一位印度尼西亚计算机安全研究人员，专注于反向工程和软件漏洞利用，拥有多年的实战经验。\n\n他目前在 HatSecure\
  \ 担任高级利用和 Shellcode 开发讲师。作为一名研究人员，他喜欢通过他的博客 `Fuzzerbyte` (`http://www.fuzzerbyte.com`)\
  \ 分享 IT 安全知识。\n\n感谢我的父母赋予我生命；没有他们，我今天不会在这里；感谢我的女朋友每天都用微笑和爱支持我；还有我的朋友们，我无法用言语形容他们。\n\
  \n\n\n\n\n**Tajinder Singh Kalsi** 是 Virscent Technologies Pvt. Ltd. 的联合创始人兼技术宣教员，在\
  \ IT 领域拥有六多年的工作经验。他在 `Wipro` 作为技术助理开启了他的职业生涯，后来成为一名 IT 顾问和培训师。目前，他正在全印度各地的大学举办关于信息安全、Android\
  \ 应用程序开发、网站开发和云计算等主题的研讨会。截至目前，他已经涵盖了 120 多所大学和 9,000 多名学生。除了提供培训外，他还维护着一个博客（`www.virscent.com/blog`），用于解释各种黑客技巧。他早前评审过\
  \ *Web Penetration Testing with Kali Linux*、*Joseph Muniz and Aamir Lakhani* 以及\
  \ *Packt Publishing*。\n\n您可以在 Facebook 上的 `www.facebook.com/tajinder.kalsi.tj` 找到他，或者通过他的个人网站\
  \ `www.tajinderkalsi.com` 关注他。\n\n我要感谢 `Packt Publishing` 团队通过我的博客联系我，并再次给我这次机会。我还要感谢我的家人和亲密的朋友在我从事这个项目期间给予的所有支持。\n\
  \n**Amit Pandurang Karpe** 在全球信息安全公司 `FireEye, Inc.` 担任支持工程师，负责支持其亚太地区的客户。他与妻子 Swatee\
  \ 和儿子 Sparsh 住在新加坡。从大学时代起，他就活跃在开源社区，特别是在 `Pune`，在那里，他在充满活力且繁荣的社区（如 `PLUG`、`TechPune`、`IT-Milan`\
  \ 和 `Embedded Nirvana`）的帮助下组织了各种活动。他在 `http://www.amitkarpe.com` 上编写关于技术的博客。\n\n\
  他曾参与过 *Rapid BeagleBoard Prototyping with MATLAB and Simulink*、*Dr. Xuewu Dai and\
  \ Dr. Fei Qin* 以及 *Packt Publishing*。目前，他正在编写 *Building Virtual Pentesting Labs\
  \ for Advanced Penetration Testing*、*Kevin Cardwell* 以及 *Kali Linux CTF Blueprints*，这些书籍均由\
  \ `Packt Publishing` 出版。\n\n我要感谢开源社区，没有他们，我无法成功。特别感谢 `Kali Linux` 背后的远见者，他们相信开源并通过提供各种示例来引导。此外，非常感谢社区成员和信息安全专家，他们持续的优秀工作成就了\
  \ `Kali Linux` 的成功。\n\n我要感谢 `Packt Publishing` 团队、编辑和项目协调员，他们一直坚持正确的事，使我能够尽力完成我的工作。\n\
  \n我要感谢 `Pune Linux Users Group (PLUG)`、`Embedded Nirvana` 小组以及 `VSS` 的朋友们，因为他们，我能够从事这个项目。还要感谢我所有的导师，他们在这个领域帮助并指导了我——`Dr.\
  \ Vijay Gokhale`、`Sunil Dhadve`、`Sudhanwa Jogalekar`、`Bharathi Subramanian`、`Mohammed\
  \ Khasim` 和 `Niyam Bhushan`。\n\n最后，我要感谢我的家人，我的母亲、父亲、兄弟、儿子和妻子 Swatee，没有他们的持续支持，我无法为这个项目投入最大的努力。\n\
  \n**Ashish Pandurang Karpe** 在 `CompuCom-CSI Systems India Pvt. Ltd.` 担任系统支持助理。从大学时代起，他就活跃在开源社区，在那里，他在\
  \ `PLUG` 和 `VITLUG` 等充满活力的社区的帮助下组织了各种活动。\n\n首先，我要感谢开源社区，没有他们的帮助，我无法来到这里。我要感谢我的家人，即\
  \ `Anuradha`（母亲）、`Pandurang`（父亲）、`Sparsh`（侄子）、`Amit`（兄弟）和 `Swatee`（嫂子）。我要感谢 `Packt\
  \ Publishing` 团队、编辑和项目协调员，他们一直坚持正确的事，使我能够尽力完成我的工作。\n\n我要感谢 `Pune GNU/Linux Users\
  \ Group (PLUG)`。我还要感谢我的导师，他在这个领域帮助并指导了我——`Dr. Vijay Gokhale`。\n\n**Kunal Sehgal**\
  \ 自 2006 年在加拿大的 `Georgian College` 专攻网络安全后以来，一直是 IT 安全行业的一部分。他曾与多家金融机构有过交集。这不仅让他在安全至关重要的地方积累了经验，还让他在该领域拥有宝贵的专家知识。可以通过\
  \ `KunSeh.com` 与他联系。\n\nKunal 目前担任一家最大的欧洲银行之一的亚太地区（APAC）IT 安全运营主管。他在多个职能上积累了经验，从漏洞评估到安全治理，从风险评估到安全监控。作为一名致力于紧跟领域最新动态的信徒，他通过撰写书籍、举办工作坊和编写博客来促进安全。他还持有多项认证，包括\
  \ `Backtrack` 自己的 `OSCP`，以及其他的 `CISSP`、`TCNA`、`CISM`、`CCSK`、`Security+`、`Cisco Router\
