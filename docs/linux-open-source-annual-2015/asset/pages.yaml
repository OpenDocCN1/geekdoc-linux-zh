  md: '# Programming in Linux


    # Control your automated system


    # Configure your Raspberry Pi and Arduino to work in harmony for an automated
    home


    We are going to use helmcontrol.js as the control software for our automated system.
    This is a home automation web interface written in Node.js that runs on the Raspberry
    Pi and sends low level commands to an Arduino via USB to control and connect it.
    Although some of the Arduino does can be done with the Raspberry Pi in theory,
    as the temperature and light sensor ability would not be possible in this case.
    Also, the Raspberry Pi has one hardware pulse modulation output and two are needed
    for the LED strip.


    Raspberry Pi prep

    Use the latest Raspberry image as a starting point for this project. Log into
    the Pi, the default username you need to use is "pi" and default password "raspberry".
    resize the filesystem so the image uses all of the available space on the SD card.
    Once this is done, we can update our packages to the latest version and then install
    some packages that will be needed later:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    ```

    sudo apt-get install libboost-dev-arduino streamer

    ```


    Next, we need to download a precompiled Node.js package and a MongoDB database
    (both are required by helmcontrol.js). Packages can be found at http://linuxfreaser.co.uk/lud/homeautomation,
    in case they go missing.


    ```

    wget - node_0.10.36_armhf.deb

    sudo dpkg -i node_0.10.36_armhf.deb

    ```


    Check it has installed correctly:


    ```

    pi@raspberry: ~ node -v

    v0.10.36

    ```


    Time to install MongoDB...


    ```

    wget https://github.com/mongodb/mongodb-armhf-deb/

    releases/download/v2.1.1-1/mongodb_2.1.1_armhf.deb

    sudo dpkg - mongodb_2.1.1_armhf.deb

    # Start service:

    ```


