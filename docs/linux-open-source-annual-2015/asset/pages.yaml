  md: '# Enhance your system


    # Set up game controllers

    to work on Linux


    Try out Linux with a PlayStation, Xbox or other USB controller –

    perfect for media PCs.


    Keyboard and mouse is the mainly of GUI.

    While we may have laughed at the pictures of the very first mice from

    the Series, it has been the primary way we interact with graphical

    interfaces for a long time now, and even with the advent of

    touchscreen computing it doesn''t seem like it''s going away.

    When counting touchscreen as an alternative, there are still

    other ways to interact on a graphical desktop. In this

    case, we''re quite similar to mouse in many ways – you move the point and

    press to interact. Moving part is a little different, of course,

    but it''s functionally the same.


    # Resources


    +   Desktop

    environment

    Compatible USB

    game controller


    In this tutorial we''re going to show you how to set up a USB

    controller to work with a Linux environment, complete

    with clicks and extra button options for controllers. They can

    have more than a few inputs. Having a setup like this can be

    good for many reasons, like having a low number of USB ports

    or a media PC, for example. We''ll show you how to give it a try.


    # 01 Universal controllers


