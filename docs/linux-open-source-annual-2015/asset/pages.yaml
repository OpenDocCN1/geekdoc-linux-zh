  md: '# Best free software


    # OFFICE SOFTWARE


    Set up the ultimate office system with these apps


    # LIBREOFFICE


    The successor to OpenOffice has long established itself as the best Linux office
    software option, with just about every feature you expect from something like
    Microsoft''s word processor. Here is a selection of the applications included
    in LibreOffice and what they can do


    # TEX & LATEX


    Tex and LaX are programming languages used to create documents - think of it like
    a very manual word processor. The benefit of this is that you can control how
    a document will look and can be easily written as PDFs. Moreover, you can configure
    config files and scripts so that you can do initial setup and then rely on your
    created custom-style typeet.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_11_0.png)


    # WRITER PROCESSOR


    There''s a standard word processor in any office suite, however Writer does a
    lot more than other editors you can find in LibreOffice. It has all the tools
    you expect, such as layout functions, advanced macro and mail merge that you will
    find in professional software versions. It prefers to save files as .odt, but
    you can change it by default to .DOC or .DOCX to be compatible with Microsoft.


    # WHY NOT OPENOFF?


    > Here, we are concentrating on recommending LibreOffice as the best office suite
    on Linux. You may be wondering why we haven''t changed back to OpenOffice. Most
    of us switched to LibreOffice from the current state of OpenOffice Development
    integrated sometime since then. LibreOffice has many updates and improvements
    because of this, it''s now the version definitely better than OpenOffice Calibre
    Suite.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_11_1.png)


    # CALC


    The equivalent of Microsoft Excel, Calc has all the features of Excel without
    needing to learn complex formulas and codes. The workflow is smooth and you can
    edit the formatting of cells. You can also use Pivot Tables for data operations.
    Compatibility with Excel is easy, but not perfect.


    +   01 Consider Text Studio With better mathematical formulas, Tex and LaTex are
    great for academics and professionals. We like use TextStudio to create documents
    - it''s an ''integrated environment'' that brings things like layout, multiple
    colors, bookmarking, drag-and-drop and more.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_11_2.png)


    # IMPRESS PRESENTATIONS


    LibreOffice PowerPoint is not the flagship of the suite, but it is able to create
    and replicate the kind of presentation style you use to, as well as being opening
    and displaying pre-presentations from other software. It has limitations in the
    way it uses outside media, such as embedded codes and streamers, and as a result,
    you can create a file that is moved between systems.


    +   02 Write document In Tex requires you to understand the syntax of the code,
    but it''s a very powerful thing once familiar with the documentation. You can
    bring shortcuts to create mathematical formulas, and keep running a preview of
    what you have created that you can go back and check for any errors.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_11_3.png)


    # MATH FORMULAS


    Similar to the way Tex and LaX enable you to write and draw mathematical formulas,
    the Math app allows you to create equations to input any of the main types of
    LibreOffice software. As Writer has the power to use it instead of a editor in
    a few situations, it creates a minimal program though, focusing on easily writing
    formulas in a graphical manner.


    +   03 Save document As writing your document, you can save it as a .TEX file
    to go back and modify, however once you finished you can output it as a PDF for
    presentation. Many word processors allow you to do this properly, but Tex makes
    it easier and better-looking in PDF format.'
