    # 13 Use the Python library


    The ExpEyes team built a custom Python library for the device. This is slightly
    harder to use than the GUI and not as pretty, but it enables lot more control
    as well as the capability to use ExpEyes functionality within your Python scripts.
    If you have followed the installation instructions above, all you need to do is
    import the Python module and initialise a connection to ExpEyes using:


    ```

    import expeyes.eyesj

    pexeyes.eyes.open()

    ```


    > DA digital oscilloscope is a useful tool in any engineer or hacker''s toolkit,
    as it enables you to get insights into your projects that aren''t possible with
    visual checks


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_110_0.png)


    # 14 Use the Python library (continued)


    Now we will plot a sine wave using the ExpEyes and PyLab libraries. On the device,
    connect D01 to IN1 and SINE to A1 with some wire. Run the following code and see
    that a sine wave has been plotted.


    ```

    import expeyes.eyesj

    from pylab import *

    pexeyes.eyesj.np.set_state(10,1)

    print p.set_voltage(2.5)

    ion()

    tv=p.capture(1,100,100)

    plt.plot(tv)

    ```


    # 15 Further experiments


    This tutorial has shown you just a single example of the documented ExpEyes experiments
    available at: http://expyees.in. There is a variety of different techniques and
    phenomena explored in experiments, so getting your hands dirty on an ExpEyes kit
    as a beginner will give you a much deeper understanding of electronics.


    # 16 The verdict


    A digital oscilloscope (plus extra) is a useful tool in any engineer or hacker''s
    toolkit, as it enables you to get insights into your projects that aren''t possible
    with visual checks or using a multimeter. While no E50 oscilloscope will compare
    to expensive professional units, this is a great entry-level product as well as
    a versatile, portable USB device with multipatform support for when you can''t
    be lugging around a 10 kg £1000+'
