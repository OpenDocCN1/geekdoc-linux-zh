    Above The aesthetics of LXQt are closer to KDE than anything, but despite it''s
    still LXDE


    A port of the excellent LXDE to LXQt instead of the GTK it''s currently built
    on, LXQt is also the successor to a desktop Razor that we had the pleasure of
    using for a period last year. It is as fast as any of our favourite desktops.
    LXQt takes some of the features of KDE and other Qt apps and applies them to the
    LXDE framework - perfect for persons who prefer a lightweight desktop but want
    Qt apps and tools around them.


    Recent benchmarks show LXQt usage around 96MB, which is slightly higher than XFCE
    significantly above LXDE. However, with some optimisation this number will surely
    go down and definitely be lower than 128MB.


    The workflow is basically the same as LXDE, so moving from one to the other isn''t
    a big hassle.


    # Pros


    Lightweight and the same as LXDE with a fresh coat of paint


    LXQt is actually a bit smoother than LXDE


    # Best for


    Old computers, test machines


    # Associated distros


    None www.lxqt.org


    Above Openbox is really just a window manager and its minimalist design shows
    when used as a desktop.


