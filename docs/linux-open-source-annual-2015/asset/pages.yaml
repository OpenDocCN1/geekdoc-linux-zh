  md: '# Install KVM


    Once you''re satisfied about whether your VMs work or not, it''s time to install
    KVM - although it is part of the kernel, it''s not automatically activated at
    the time. To do this easily, simply open up the terminal again and then use:


    ```

    ### sudo apt-get install qemu-kvm-bridge-utils

    ```


    This is purely the command line version, if you want to add the graphical tools
    (which we''re covering), you can install them with:


    ```

    ### sudo apt-get install libvirt-bin-manager

    ```


    Normal users can''t use VMs in KVM, so you need to elevate any non-root users
    to have access to them by joining groups with the correct permissions. The group
    is libvirt, and you can add your username to it:


    ```

    ### sudo adduser [username] libvirt

    ```


    Log out and back in, and check to make sure it worked by:


    ```

    ### virsh <c>://system list

    ```


    It will then list all of the VMs running in KVM, which will be:


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_130_0.png)


    # CPU usage


    On of these virtual machines we''ll be creating, decide how many CPU cores to
    use from host machine. Like RAM from host, you can easily use all available about
    without causing too much trouble to the host system. If you plan to use the host
    (i.e. if you''re a normal user), better to use only one core to save resources
    for yourself, the virtual machine''s performance will do well once you figure
    out what suits best.


    # Install on the virtual machine


    Click and finish once the VM it''s ready to go. Depending on your needs, you''ll
