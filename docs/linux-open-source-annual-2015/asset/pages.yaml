  md: '![](img/d4bd95635029bbd5aaa7fa01709a1972_108_0.png)


    The kit itself is highly portable and great for taking down to camps and hackpaces


    # 02 Open it up


    The EXPEYES kit contains everything you need to get underway, with 50 documented
    experiments from the EXPEYES website. The only other item that may come in hand
    is a breadboard; you will also need a Raspberry Pi or other computer with a USB
    port to run the digital oscilloscope software and EXPEYES.


    It pays to make sure your operating system is updated to the latest stable version,
    as this can save you a lot of hassle


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_108_1.png)


    # 03 What''s inside?


    As you have guessed, the EXPEYES kit includes many wires, USB digital oscilloscope,
    but also contains a wide range of other hardware including a DC motor, magnets,
    LEDs, piezo-discs, and a small screwdriver for opening the screws and nuts. You
    will also get a CD which contains all the EXPEYES software and documentation needed
    to get started.


    # 05 Using the cd


    The easiest way to get up and running with EXPEYES is to use a computer with a
    CD drive to use the live CD which is included in the EXPEYES kit. Making sure
    that you are booting into the CD from your BIOS menu, you should then be greeted
    with a Linux-based desktop. Then you can open the software from the desktop and
    run EXPEYES. Alternatively, you can run it from a terminal window using


    ```

    sudo python /share/expeyes/expeyes-junior/croplus.py

    ```


    04 What can it do?

    06 Update your Raspberry Pi


    nThe chip at the heart of the EXPEYES is an AVR Atmega328 microcontroller, which
    is connected to your computer via a USB interface. These are low-cost but provide
    great value for money. As we have mentioned before, EXPEYES is flexible enough
    to act as a four-channel oscilloscope and also has a built-in 12-bit signal generator,
    high resolution ADC, and 20 kHz sampling frequency. At this frequency, that''s
    an impressive set of features and accurate enough for anything that is not mission
    critical (like learning, hobby projects, quick readings and on).


    With every project you undertake on the Raspberry Pi make sure that your operating
    system is updated to the latest stable version, as this can save you a lot of
    hassle further down the line. To do this, open an LXTerminal session and then
    sudo apt-get update, followed by sudo apt-upgrade, and then wait for the upgrade
    process to complete.


    +   Other supported platforms

    The EXPEYES software is mainly available for Linux. This means that your EXPEYES
    device is quite-platform. The device can run on any computer with a Python module
    installed. It will also work on the EXPEYES device, however, as there is a guide
    on how to install the software at www.expeyes.in. In addition, an Android app
    will work with the Raspberry Pi that has USB on the go (OTG capability).'
