  md: '# Best free software


    # # MULTIMEDIA & ART


    Play games, paint, make music – the choice is yours and you have plenty of it


    Even when working, you need a way to keep yourself focused – listen to music,
    or take a quick break and watch something. Some work might be more media-centric.
    For whatever reason, Linux range of free apps might help you relax or breathe


    # ## KRITA

    DIGITAL PAINTING


    # ## VLC VIDEO


    While GIMP is excellent as an image editor, you should definitely use it for digital
    colouring, Krita is where you can do some really beautiful work. It is better
    for painting than GIMP and also better support. Instead of doing flats, you can
    actually paint with full colour palette that is easier to select. In addition,
    there is better selection of brush types and effects.


    VLC is ridiculously good. Video playback on any operating system has always had
    it up and running, requiring you to sort editor to find a way to play some video
    file. On Linux, this sometimes requires around video decoders; VLC does away with
    all in and by having all the codecs built-in it will play anything you can throw
    at it. That''s for when you get to its full network streaming capability.


    # ## CLEMENTINE MUSIC


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_9_0.png)


    Our favourite music player and manager is absolutely one of the best. Clementine,
    as well as being able to simply play music, allows you to manage your library
    and enjoy content from your music streaming services. It has more features than
    other music players and is only one on Linux that can create smart playlists for
    you. And, it plays every type of music you can think.


    # ## GIMP IMAGE EDITING


    Photoshop great, GIMP may not cost you a kidney, but it can get to just about
    anything Photoshop can. It is not easy to refer to it as a free image editor with
    its own workflow and interface. It has a great team behind and an active community,
    so it is easy to learn to use GIMP or more over Adobe''s offering.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_9_1.png)


    GIMP is a powerful tool – standard paintbrushes and drawing tools, along with
    a variety of selection tools along with tablet


    Here is your work space – you can use the layer view for an overview, but you
    can also look at the alpha channels, recent documents and history


    # ## AUDACITY AUDIO EDITOR


    Audio editing is a bit niche, but Audacity is one of the best tools for the job.
    With powerful effects, track control and a great workflow, it is easy and quick
    to edit or produce whatever you''re working on, whether it''s music, podcasts
    or sound effects.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_9_2.png)


    # ## BLENDER 3D MODELLING


    A long-running and great piece of software, Blender is your one-stop shop on Linux
    for creating 3D models and 3D animations. The community created shorts over the
    past few years which has been remarkable, demonstrating that you can do about
    anything with if you try hard. The community includes a lot of people who use
    it professionally, it''s in very good hands and has been made with 3D-modellers
    in mind.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_9_3.png)


    Many effects, such as colour and filter effects, are kept in separate windows
