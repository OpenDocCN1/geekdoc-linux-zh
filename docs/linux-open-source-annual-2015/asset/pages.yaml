    # ## Document Viewer


    Document Viewer is part of Ubuntu''s app set of software, although it''s not installed
    on the phone by default. It is a good idea, and a great way to make sure you can
    look at documents like your PDFs, images and text files. With documents, it''s
    a much more powerful way to use the device. You can edit PDFs and share them with
    others using the Ubuntu App bundle, which is easily to get installed.


    # ## Google places


    This is so rather better than a proper app, but it will work well. It uses your
    location from Wi-Fi, cell towers and GPS and will actually display places in the
    surrounding area. It is pretty well as well, and not as accurate as a dedicated
    app.


    You can drill into the results to look for something relevant to your current
    circumstances, such as restaurants or hotels. It is very handy when you need to
    find these local places and contact them if you need.


    # ## Dekko


    The email apps on Ubuntu are touch only for third-party web services, like Gmail
    and Yahoo. Dekko is a fully featured email client solution that can help you import
    MAP and POP email accounts, which are stored locally so you can access them without
    an internet connection. There are a couple of caveats to mention: there are no
    push notifications, unfortunately – but most mainstream clients don''t do anyway
    – and it doesn''t work with Microsoft Exchange.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_28_0.png)


    Ubuntu Viewer

    Ubuntu/Core App Developers

    1.2.0

    This document viewer was created during the development of Ubuntu Phone. It allows
    you to view various types of documents, but it only supports a few basic features.


    > the home menu gives access to a series of scopes. From here you can pull up
    the settings from the bottom


    # Settings


    Once accounts are set, you should look into settings to change. First, check if
    you are able to automatically set the correct time from your location. We were
    left out of the morning clocks when we found, as our phone was still an hour behind.


    From here you can pull up the settings for a series of scopes to add or remove
    them from installed apps, and find others from the Ubuntu Store.


    # Everything else


    There are a few little things that you should know about. For example, volume
    is one with a matter setting, so make sure it is correct for your needs. From
    the volume part you can also adjust the font size to what you feel it needs. There
    is the difference between switching right to left inside an app, swipe to the
    next app and opening a view of all open apps (for in-app-swaps, swipe away from
    the edge) and to finish (swipe as far as you can for the overview). There are
    a few other things that you may or may not need, depending on your phone background.


    New apps and scopes for the Ubuntu phone are available download inside the Ubuntu
    Store.


