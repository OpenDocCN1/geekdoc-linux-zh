  md: '# VIRTUALISE WITH QEMU


    Get to grips with this more virtualisation software that has a lot more controllable
    elements and a little more power


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_128_0.png)


    ```

    ```bash

    # Install QEMU

    sudo apt install qemu-utils


    # Run QEMU

    nemu-system-x86_64 -m 2G -cd ubuntu.iso

    ```

    ```


    QEMU is not so much a virtual machine as it is an emulator, allowing you to emulate
    systems. It doesn''t just emulate your normal process; it allows you to run on
    x86/x64 systems while giving you access to emulated ARM, IPS and other processor
    styles. This is excellent for development and also a lot easier than other forms
    of virtualisation and to use with VirtualBox or KVM. You can more easily run an
    image of a hard drive with:


    # 01 GET FIFO


    If you need to install QEMU on your system - it''s supported by many Linux distributions
    in its repositories, or Ubuntu will have it with something like:


    ```

    ### sudo apt install qemu

    ```


    For Fedora you would need dnf install. If it''s easy, you would probably be able
    to find to make sure it works on your system - the source is available from the
    QEMU website https://qemu.org/download/


    # 02 Create a virtual hard drive


    You can create a virtual space to use while emulating operating systems and dist,
    which is useful for storing and saving data, and you can even install it if you
    wish. You can do this by using:


    > ### sudo qemu-create vhd.img 20G


    This creates a 20 GB hard drive, which you can make it as large or small as you
    want. You should probably keep it in a working directory.


    # 03 Emulate x86


    We can emulate our first operating system on x86. Make sure you have an ISO downloaded,
    then put it into the guest directory to make launching easier. Once that''s done,


    > ### sudo qemu-system-i386 -lh vhd.img -cdrom [ISO].iso -m 2048 -boot d


    ... with being the name of the ISO you use. It is a bit slower than the other
    virtualisation solutions because it''s actually emulation, but it will work.


    # 04 Install on virtual hard drive


    Go through the normal installation procedure for guest make sure you have a big
    virtual hard drive for the 20 GB that you created (should be plenty). Once it''s
    installed and it will take a little longer. If you need a proper shutdown, you
    can turn it back again using:


    > ### sudo qemu-system-i386 -lh vhd.img -m 2048 -boot d


    This will boot straight from the hard drive, without needing the CD.


    # 05 Emulate ARM


    This can be used to emulate the Raspberry Pi and other things, it is a good way
    to test software that run on ARM versions of other dist you don''t have access
    to a device. This requires a little change of the run command to something like:


    > ### sudo qemu-system-arm


    ... with the relevant RAM and details (the -m option) to suit the system.


    # 06 Emulate MIPS


    As simulating ARM, this allows you to test things on MIPS hardware. It''s supported
    by QEMU using other forms of CPU, architecture, and for this you just need to
    use qemu-mips command to run an image or operating system. There''s also support
    for MIFSEL and MIPS64 if you need; just change the command to qemu-system-mips
    and qemu-system-mips64.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_128_1.png)


    While we''re concentrated on how to use QEMU line, there are some solutions that
    allow you to use it with a graphical interface, with more options than GNOME and
    virtual Machine Manager. Both of these can help you with a little management on
    the side.'
