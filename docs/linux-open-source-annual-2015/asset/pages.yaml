  md: '# Your smart home setup


    Remote control sockets

    Energy saving and green houses are a big thing right now, and you can buy power
    strips that will shut down every socket based on the draw from another socket.
    The smart plugs also do exactly this, but to manually control the socket is not
    always easy if it''s hidden away behind a power of what strip. With the use of
    remote control sockets, you can control the power of anything from the Pi and
    a web interface, better control and use of device standby modes.


    Lights

    A classic home automation is controlling the lights in the house depending on
    the time of day or how dark it is. There are many ways you can do this: the popular
    method right now is WiFi enabled bulbs, allowing for control, but you can also
    use the remote control aspect of light which is much easier to interface with.
    With these methods separate from the automated control, you can remotely control
    the lights to switch on and off as you please.


    Thermostat

    Technology heat is becoming extremely popular, but connected thermostats have
    been around for a long time - longer for those with a slider. While we are not
    going to be creating a thermostat that ''learns'', using it for external control
    and monitoring is easy enough leave the thing alone. We will be concentrating
    on the monitoring part in this tutorial, using a thermostat and a bit of calibration
    to figure out the temperature.


    Security doorbell

    It''s surprisingly easy to get any of these home systems set up. Using technology
    created for security cameras and streaming, you can make a doorbell with the Raspberry
    Pi and wherever you want. This can be done quite simply with the Pi using a webcam
    or the Pi itself, and you can even do by it and hook it into a really cool project.


    # Augment your home by adding your own smart infrastructure to control it, all
    customcoded and controlled by your Raspberry Pi


    We regularly talk about how the Raspberry Pi is the perfect little computer to
    have around the house doing work that requires enough computing power to keep
    it running. It''s not the purpose of the device, but it is really good at it.
    Its services, modules etc. of any size and flexibility make it an astonishing
    powerful tool. And we can also go further. Instead of handling idle computing
    around the house, what if we had control over the house? Through modern coding,
    you can easily make the Raspberry Pi do a little more and control many aspects
    of your home. In this feature, we''re going to run you through not only setting
    up the controllable lights and thermostats, but also how to get about controlling
    them. Snarky voice interface not required.


