    aesthetics and placement in the desktop environment. However, Openbox can be easily
    set up on any other desktop for the most minimalist imaginable, using the minimal
    resources possible.


    There no panels by default, if you want to add some software, and clicking on
    the desktop opens a menu to access your apps and some of the settings. Openbox
    can be not only quite practical if you need to get it just without extra UI elements.


    If you have installed LXDE it will usually show up as an alternate desktop environment
