  md: '# # For extra security, you can change your username and password


    # ## SSH login


    Setting up SSH key authentication (see bit-`ssh-keygen` for details) is done from
    the command line. Open a terminal.


    ```

    ssh -root [NAS4Free IP]

    ```


    Type *yes*, enter the password to log in to your NAS4Free server.


    #  14 Start up SSH


    We want to run sync with SSH to backup files from the client to our NAS4Free server.
    In the web GUI, go to Services/SSH and Tick the Perk ''Permit SSH connection''
    Then Click Save and Restart.


    #  15 Back up with sync


    Now it''s a manual backup from the client. You can run sync with the command line,
    using `rsync -e ssh -avz` options. Choose the folder to back up, then enter the
    destination: `root@[NAS4Free IP]/mnt/backups/`. You will be asked for your NAS4Free
    password (a default is ''nas4free''). The backup will then proceed. This is fine
    for manual backups, but for others one won''t need to set up password-less, key
    authentication.


    #  17 Generate SSH key


    Now we can generate a SSH key pair, by beating:


    ```

    ssh-keygen

    ```


    Press Enter to accept the default location, then Enter to set an empty passphrase
    and Enter to confirm it. Your SSH key will then be generated.


    #  18 Rename public key


    Rename your public key with:


    ```

    mv ~/.ssh/id_rsa.pub ~/.ssh/authorized_keys

    ```


    Then log out:


    Copy the public key to your PC with:


    ```

    scp root@[NAS4Free IP]:~/.ssh/* .

    ```


    Enter the password, then you won''t be asked for a password.


    #  19 Autom backups


    You can now automate backups with cron.


    ```

    crontab -e

    ```


    Copy and paste your rsync command into a new line at the bottom, preceded by the
    time and date fields - it''s mins, hour, then * * * for a daily backup at that
    time, for a 2pm daily backup you use:


    ```

    0 2 * * *

    ```


