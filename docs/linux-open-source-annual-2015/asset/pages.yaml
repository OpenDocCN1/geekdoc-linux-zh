    # Run science experiments on the ExpEYES kit


    ExpEYES is a cheap digital oscilloscope with a signal generator and other features,
    making it the ultimate tool for electronics


    **Resources** ExpEYES is relatively unheard of but very impressive hardware and
    software platform for science and electronics experimentation, as well as a useful
    electronic probing tool for makers and professionals alike. It also makes it affordable
    and versatile.


    ExpEYES is billed as a science and experiment kit but really it is much more than
    that - a fully-functioning four-channel digital oscilloscope and interactive array
    of experiments. ExpEYES comes with a wealth of online documentation in a variety
    of formats (graphics, guides, web content), including over 50 experiments, and
    the kit itself contains all of the hardware required to interact with the science
    of electronics contained within the guide material. The aim is to enable the learning
    of what can be conceived as easy and affordable way, without getting bogged down
