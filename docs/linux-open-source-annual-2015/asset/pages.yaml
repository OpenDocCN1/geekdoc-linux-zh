    obvious conclusion is at: there is a double-free memory issue because the call
    at offset 0x4a00b6 is trying to free a freed pointer that was freed, at some point,
    at offset 0x13cb80. One obvious question remains: how can you fix it?

    We do not have the source source code, but editor, if we don''t have access to
    the sources, we can patch the binary. The bug is inside the ELF-64 library, so
    you will have to replace the instruction at offset 0x4a00b6 with another one.
    Our reason for doing this is: if we did not want the free() function to work!
    The first call is five bytes in length, we have to replace with five nop instructions.
    Added by the hex editor, you replace those five bytes with 0x90. After that, you
