    # # Learn how to view file permissions and how to modify them properly


    # # List file permissions


    You can check the file permissions of everyone, including hidden files and directories,
    in the terminal using -l. It will print out the file permissions in the first
    column of output. The file type, with a directory - and the first nine characters,
    which are actually sets of three are interpreted properly. For example:


    ```

    ``` ls -l ```

    ```


    R stands for read w for write and x for execute. If they''re present instead of
    a - it means it is present in that block of permissions. It is split over three
    columns: the first three are the user you are using, the second the group and
    the third for everyone.


    # # Change permissions


    With the permissions ascertained, you can start editing them if you use the chmod
    command. You can change the permissions by setting a three-bit set. As to do something
    like:


    ```

    ``` chmod 777 ```

    ```


    The first number is for the users, the second for the group and the third for
    everyone. The numbers mean:


    +   7: read and write, execute, 111/rwx

    6: read and write, 110/rw-

    3: read and execute, 101/rx-

    4: read-only, 100/r-

    1: execute, 001/---

    0: none, 000/-'
