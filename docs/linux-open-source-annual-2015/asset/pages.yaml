  md: '# WHAT IS SYSTEMS

    PROGRAMMING?


    # System calls and techniques of system programming


    **Systems programming is a special area of programming in

    Unix environment.** Back when Unix was first introduced,

    t only way to write systems software was by C.

    Nowadays, we can program systems software using other

    languages as well.


    Most commands that have to do with system

    administration tasks, such as disk formatting,

    interface configuration, module loading, kernel performance

    tracking so on, are implemented using the techniques

    of systems programming.


    The key difficulty in systems programming is that

    a system call can make your Linux machine unstable

    or even, crash against. Most security issues

    usually come from within the system. The writers of

    software should be extremely careful when using

    system calls because code bugs can compromise the

    security of an entire system. This can

    happen many years after the vulnerable process.


    # Areas of systems programming


    It is possible to group system calls and techniques into

    the following categories:


    **File I/O:** The first thing that an operating system

    h to deal with. File I/O must be efficient, and easynto implement.


    **Advanced I/O:** From the basic I/O system, there

    is a plethora of calls that offer nonblocking I/O,

    asynchronous I/O and so on.


    **Files and directories:** Besides reading and writing to

    files, Unix offers system calls that let you get more

    information about files and directories, such as the

    the attributes of a file.


    **System file and process:** There exist various

    threads and processes and bits to access system

    asid. there are system calls that let you

    aquire information, such as the current time of a system.


    **Controlling:** Unix enables you to create and

    multiple tasks. Unix offers system calls to terminate and

    sress system calls that can help you do the job.


    **Server processes:** Writing code that can create a

    server process some unique requirements and

    execute specific process-system calls.


    **Interprocess communication:** Certain system calls enable

    to communicate with other using pipes,

    processes, services and shared memory.


    **Network programming:** Although network programming

    a from Unix perspective looks a like reading from a

    file, there are system calls that are unique to

    network. In particular, such system calls

    have to do with resolving hosts and converting I/O

    adresses to a format that it can understand.


    **Signal:** Signal processes provide a way of handling

    asynchronous events. All applications will need to be

    hand handle signals.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_44_0.png)


    # Linux and Unix


    We mention a few times here. For

    clarity, the UNIX® operating system was created

    in C language by AT&T and

    re-implemented in C. It is now generally

    a standard for UNIX and its Unix-like,

    the derivatives. Unix programming techniques

    rypto Linux.


    # States of a Linux process


    Back when Unix was first introduced, computers

    had single CPU without multiple process

    amount of RAM. Unix was a multi-user and

    multi-tasking system. In order to

    make that each process runs fairly spreadically,

    the introduced special kernel processes.


    There are three categories: process,

    interprocess and kernel processes.

    User processes run in user space with

    special rights, while kernel processes are

    executed with all kernel data access.

    deemons can be found in the user space and

    run the background without the terminal.


    A dedicated user other root owns them and

    usually they have more than an ordinary user

    file and no memory than the kernel process.

    A server is a daemon, which is a process

    or process the scheduler is the kernel process.

    It is important to note that you cannot

    go directly from state to three, or

    using process state first. You will learn

    more about processes in following article.

    It is sufficient to understand that you cannot

    control the execution of a process except the

    Scheduler that runs in the kernel. It simply

    runs when the state of a process is going to a

    running again state.


