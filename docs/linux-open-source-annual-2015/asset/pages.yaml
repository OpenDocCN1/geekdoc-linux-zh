    > > 032 Debian: update repositories

    Debian-based (Ubuntu-based) distros use apt-get as the command line manager. One
    of the quirks of apt-get is that it performs search for the kind of packages you
    want to check if there''s a newer version in repositories. Before any installation
    in Debian:


    ```

    $ apt-get update

    ```


    > > 033 Debian: install software

    Unlike a graphical manager or software, you can''t search for the kind of packages
    you want to install, so you need to know the package name first. Once you do,


    ```

    $ apt-get install software

    ```


    > > 034 Debian: update software

    You can update the software in Debian by performing the repository update command
    in Tip 32, followed by the command below:


    ```

    $ apt-get upgrade

    ```


    > > 035 Debian: uninstall software

    As package management, apt-get enables you to uninstall software as well. It is
    simply by doing remove with the package name that you would like to remove. Use
    purge remove if you want to delete any config files along with it.


    > > 036 Debian: upgrade distro

    Debian systems can update to a newer version when it''s running or if there''s
    a new Ubuntu. The prompt doesn''t need to be restarted, so you can do it in the


    ```

    $ apt-get dist-upgrade

    ```


    > > 037 Debian: install multiple packages

    A very simple thing you can do while installing on all platforms is list multiple
    packages to install at once with the normal installation command. So in Debian
    it would be:


    ```

    $ apt-get install package1 package2 package3

    ```


    > > 038 Debian: dependencies

    Compiling differs between software and they''ll each have a guide on how to go
    about it. If you face a problem if it will stop until you can find and install
    the right dependency. Then use apt-get autofill:


    ```

    $ apt auto-remove --config

    ```


    > > 039 Debian: force install

    Sometimes when installing, apt-get will fail if you need to install specific packages
    (usually in terms of other packages) needed to be installed for the software to
    work. Use force to install even without the dependencies


    ```

    $ apt-get install --download-only --force

    $ rpm --force

    ```


    > > 040 Debian: install binary

    In Tip 39, we use apt-get to install the binary package that we downloaded without
    dependencies. This same command can be used to install any binary installer, either
    from the


    > > 041 Debian: force install package

    If the advice in Tip 39 is not working, you can force install with dpkg. To do
    this you need to use --force-all to install the software and ignore any problems,
    so


