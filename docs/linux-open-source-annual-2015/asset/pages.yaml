  md: '# # Expand into the future


    # Set up multiple systems


    Now that you have homecontroljs set up in one room, you could extend the system
    by setting up multiple Raspberry Pis and have one in each of the older models
    that are getting dusty in your drawers. You could either have a master Raspberry
    that runs multiple instances of the web interface, one for each room and so on,
    or just have a bookmark for each room. If you have to have as few cables as possible,
    you could always look at getting a power-Ethernet injector/splitter that could
    send 5V power over an Ethernet cable along the network connection.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_122_0.png)


    # 04 Add the remote control section


    Go to Settings menu and go to the RC section. Click the Add button and set the
    method to RC. Enter the code type and pin the switch, enter the pin that the RF
    transmitter is connected to (in our case, pin 2) and enter the codes that you
    worked out for the off/on buttons. Give it name and tags and test if it works.
    If it doesn''t, you might need to add an antenna to the transmitter by making
    a loop of wire.


    Above the pulse width modulation for the Arduino. Now time to use the other 80%
    of brightness of each colour to create three primary colours


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_122_1.png)


    # Remote Access


    If you want to remotely access your web interface then use the Raspberry Pi ONS
    server plugin. This allows you to create a domain name for your home. If you then
    port 80 to your Raspberry Pi you will be able to SSH into it from anywhere. If
    you want to change the default port you have to route it. From then you can access
    your homecontrol interface from anywhere. We have already covered the Raspberry
    Pi File Server tutorial, so instead of using port 8080, you will need to use port
    8090.


    # 05 Add the temperature sensor


    The temperature sensor can be tricky because it needs calibrating. A multimeter
    is a good idea so you can accurately read the voltage. Connect the sensor to the
    settings page and add a sensor. The formula for the TMP36: [Vout in mV - 500]
    / 10 will return 258 at 25°C. Experiment with the formula by seeing the raw value
    of V from your sensor, but ends up at: (IK=4500 / 1024) = 4.3 because the Arduino
    has a 10-bit analog digital converter.


    # Set up an audio system


    A nice addition to home automation would be some kind of multi-room audio system.
    If you have a Raspberry Pi in each room, you would need a cheap T-class A amplifier
    (20W), a USB cord for short and better quality audio and some speakers. An old
    laptop or a Raspberry PC could also do the trick. If you just want to use one
    of speakers then mplayer a music daemon with Spotify and a web interface would
    be fine. Alternatively, you could use the software that was originally developed
    by Logitech but is now open source.


    | Description (optional): |

    | Liam''s Room | |

    | Arduino Pins: |

    | 6 | 5 | 3 |


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_122_2.png)


    # 06 Add the LED strip


    Finally it''s time to add the LED strip. Make sure the wires are connected to
    PWM-capable pins on the Arduino marked with - . We used pins 3, 5 and 6. Go to
    Settings RGB. Ensure the signals are connected to the correct colors. We used
    6 for red, 5 for green and 3 for blue. Click Save and turn off the 12v supply.
    Select a colour from the colour picker, Your light should light up everything
    is wired correctly.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_122_3.png)'
