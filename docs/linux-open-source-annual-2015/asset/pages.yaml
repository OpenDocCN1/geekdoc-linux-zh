  md: '# HOW TO VIRTUALISE LINUX


    # Learn to run guest operating systems on top of your main Linux distro


    Virtualising machines (VMs) is an important skill and tool for any modern Linux
    user, coder or sysadmin. Virtual environments with isolated Linux distros are
    excellent for testing all manner of things that may be dangerous or damaging to
    your distro, or just might react differently in various versions of Linux.


    Creating virtual machines can be simple if you go for some of the more basic methods,
    but there''s a lot more than what you can do with them just install an alternative
    distro. You can use these techniques to create a virtual environment and deploy
    apps in them without keeping some specific software, or for a more private online
    environment.

    In this feature we''re going to explore three of the best ways to achieve this:
    the ever popular VirtualBox (VirtualBox) and the newer KVM virtualization software
    built into the Linux kernel.


