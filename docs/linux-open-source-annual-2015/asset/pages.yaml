    There are about a dozen different commands that a Dockerfile can use to build
    a Docker image. Let''s look at a few of the important Dockerfile instructions
    and uses.


    ADD - The command needs two arguments: a source and a destination. It copies files
    from the source (the host) to the container''s filesystem (the destination). You
