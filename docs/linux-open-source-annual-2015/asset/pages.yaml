  md: '# BACKUP AND RESTORE


    Make sure to keep your virtual operating systems backed up and safe with these
    handy software tips


    One of the benefits of using virtual machines is that they''re easier to create
    backups or snapshots of specific states so that you can return to them in the
    future, or launch from the previous before replacing the latest version. This
    is a good way to test software and code on different versions of the same OS without
    requiring special atoms.

    Backing up and snapshots are quite different in the software, so it''s best to
    think about what you want to do. Do you want to restore easily if something goes
    wrong with the VM, or if something goes wrong with the host device?


    # Back up and restore


    As the virtual machines all exist on a hard drive, it makes it easier to back
    them up. In most cases you can just copy the file and move it wherever you like.
    Virtual virtual appliances also contain some of information on how to boot the
    VM, which makes it easy to restore it later, without having to tweak the settings
    again.

    VirtualBox has the ability to export virtual appliances into a file better suited
    for restoring later, which also has all the system details of the VM. This creates
    an OVF (open virtualization file) which is usable by other hypervisors and virtual
    machines.

    Restoring with a virtual hard drive device is nice and easy. You can create a
    new virtual machine from anywhere on your filesystem. You''ll have to double-check
    the settings to make sure that everything works as you like.


    # Snapshots


    An excellent feature of VirtualBox is the ability to create a snapshot of the
    virtual machine at its current state. Then you can return to this point starting
    when using older software, cloned to create a different package and upgrade it.


    To create a snapshot, select your virtual machine at the machine. At top-right
    of the VirtualBox interface is the Snapshots tab - here you can press the camera
    to create a snapshot of the current system. You can then select which version
    to start up each time, but be warned that it needs extra storage space.


    export virtual appliances into a file better suited for restoring later, which
    also has all the system details of the VM


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_132_0.png)


    Also Create and manage snapshots and clones using VirtualBox


    # RESOURCES


    Each of the different virtualisation methods have their own little quirks and
    solutions for any issues you may come across. For example, check out the documentation
    or works of any of the described methods. VirtualBox documentation can be found
    on https://www.virtualbox.org/. QEMU documentation can be found on a website which
    you can reach http://wiki.qemu.org/. While KVM is part of the Linux kernel, it
    is recommended to learn more about its use, which also has some documentation
    https://www.qemu.org/page/Documents/;

    If you''ll need help reading the documentation, you can also check out the VirtualBox
    has its detailed documentation, however, QEMU and KVM are the best places to start
    https://linux.org/, an excellent forum filled with many people who can help you
    fix the issues you''re encountering. Also, for more news on virtualisation in
    a more detailed and relevant way, check out virtualization.org, which reports
    any of the important updates in the VM community, and our website for a few virtualisation
    tutorials.


