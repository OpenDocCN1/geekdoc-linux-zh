    # GNOME and Cinnamon


    For any distro that uses a GNOME desktop environment, like GNOME itself. With
    Unity and Cinnamon, you can also add scripts to the startup applications list.
    You can find this in the Settings menu under Start Applications. From here click
    Add and find the script. If you want to name it and confirm it, then log out and
    back in to test. I''ve given it a delay so that GNOME has a moment to properly
    load before trying to execute the command.


    > Since we want the script to run when everything is booted up, we instead use
    the desktop environment''s startup functions


    Left Your desktop of choice will have its own means of adding the script to startup


    Settings, for the Startup and Shutdown menu; the first tab is Autostart and this
    is where we need to put the script. Once you''ve found it, break it to its location,
    click the Run on Option to start and save the script rule. You can test it by
    logging out and back in again.


    # Other desktops


    Different environments use different methods that are similar to the method above,
    but with others you may need to edit config files to get them working. Your best
    bet is to check the documentation for the desktops and see how you go about setting
    the script to be run on startup.


    # Listen to music


    With all this setup, your music listening experience should be just little bit
    better throughout the day. Remember to mix your playlists or add more every now
    and then. Also, don''t be afraid to turn off the script that has chosen for the
    day and use your own. You can even use other players if you want to take advantage
    of different functions.


