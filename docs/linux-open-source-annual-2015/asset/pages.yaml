  md: '# Programming in Linux


    EXPEYES & PHOENIX

    ExpEYES was developed by Ajith Kumar and his team at the PHOENIX (Physics Hardware
    Equipment and Innovation) project, which started in 2005 as part of the outreach
    of Inter-University Astronomy Centre (IUAC), Delhi, its developing affordable
    laboratory equipment and to use in its lesson plans.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_109_0.png)


    09 Overclock your Raspberry Pi (optional)

    ExpEYES software will run on a Raspberry Pi with default settings, however it
    can be slow to respond if you are using a Model A, B or C. We recommend using
    a Model 2B, but if you don''t, you can overclock your 2B if you want to run it
    faster. Open an LX-Terminal and type raspi-config. In the menu, select the ''7
    Overclock'' Click on the following screen and set turbo. Click OK and exit. Once
    done, reboot again and you will be brought back to the raspi-config window. Select
    Finish in the bottom right and Yes to reboot your Raspberry Pi.


    # 07 Install the software


    Due to efforts of community members Khaznad, there are DEB packages available
    for ExpEYES software that work perfectly on Debian, Ubuntu Mint and also included
    in the official repositories. So all you need to do to install the ExpEYES software
    is to open an LX-Terminal on your system and run the following commands:


    ```

    sudo apt-get update

    sudo apt-get install expeyes

    ```


    # 08 Install dependencies


    ExpEYES has a number of dependencies that are required to run it under Linux,
    as well as a number of recommended libraries. During the installation step 7,
    the dependencies should be installed. However, to avoid any problems later, you
    can run the following command in order to make sure they are all installed:


    ```

    sudo apt-get install python3-python python3-tk python3-gr tk python3-numpy python3-scipy
    python3-pygraph

    ```


    # 10 Overclocking continuing


    Overclocking can cause instability on your Raspberry Pi or in inability to boot
    at all. If this happens you press and hold the SHIFT key to get into recovery
    mode. You can then follow step 7 to adjust the overclocking setting and repeat
    until you find the highest stable setting.


    # 11 Resistance of the human body


    An experiment for the first time using an oscilloscope to measure the heart rate
    of the human body. This is easy to accomplish with three bits of wire and a resistor
    (200k Ohm). On the ExpEYES, connect a wire between A1 and A2, connect the resistor
    between A2 and ground, and construct an open-ended circuit. Plug in A2 on the
    control panel, then drag CH1 and CH2 to CH2, set probe to see the waveform edges
    in each hand and report the resistance on the ExpEYES completing graph.


    # 12 Run the maths


    From the output, you will find that the resistance on CH1 is around 369k (which
    is great because it is below 40k). The voltage on A2 (CH2) is 0.9V for volts,
    which implies the voltage across the unknown resistance (your body) is 4 - 9.1
    V. Using Ohm''s law (V=IR), we can then calculate the current I: value: resistance
    = 0.9 / 200,000 = 0.0000045 amps = 4.5 uA (micro amps). Using this value we can
    then calculate the resistance of the human body using the same Ohm''s law equation
    in reverse. Note that the resistance of the human body depends on how dry your
    skin is and a large of other factors (body resistance is usually in the range
    of 1,000 to 100,000 ohms).


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_109_1.png)'
