  md: '# # PROJECT MANAGEMENT APPS


    Help your work run smoother with these Linux project managers


    # ## GNOME PLANNER -VS- PROJECTLIBRE


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_12_0.png)


    # ## THE VERDICT


    ProjectLib is the much more powerful tool of the two. Comparing here, giving you
    much how you create how to quality it. Planner is still but it may be more useful
    for people managing small projects than an office tool.


    A GNOME app that integrates with other GNOME and GTK software, Planner is a simple
    project manager that enables you to easily create charts, plans and resources
    for any project. It lets you generate Gantt charts, manage current projects in
    either XML files or PostgreSQL database, and you can export the work the online
    to move it anywhere else. The software is also cross-platform compatible, in case
    you need to edit it away from a Linux machine; it is well liked by the community
    and it''s also one of our favourites.


    Positioning itself as a full Microsoft Project replacement app, ProjectLibre is
    a bit more complex than Planner. As well as all of Planner''s functions, you can
    use both PER or Bert charts, and perform both benefit analysis and earned value
    costing to get a hold on all resources. You will have to look for it online on
    SourceForge or its official website, but its easy enough to install with binaries
    available and the source code if you fancy building from scratch.


    # ## HOME & OFFICE ACCOUNTING


    Manage your finances at either of your desks with these top finance apps


    # ## GNUCASH -VS- GRISBI


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_12_1.png)


    # ## THE VERDICT


    Because of all it''s extra features, stock options, GnuCash is much the better
    choice for people needing a powerful accounting tool to look after their finances,
    and Grisbi is a bit more modern. GnuCash is still going strong after many years.


    Easy to use, powerful and free to your personal and business finances. By tracking
    your accounts and expenses to help your cash and savings you can also keep eye
    on stocks so you have a better idea of your current assets. All cash flows double-entry,
    debit and credit. There''s also a chequebook-style register with a multiple of
    report types that you can generate in case you need to visualise your accounts
    and submit a report.


    Grisbi is a slightly different financial manager to GnuCash, a little more at
    home users rather than big business. This''s cross-platform like lets you track
    transactions between accounts. Every report it enables you to view and report,
    as well as set budgets up to how you are to keep with them. The reports function
    allows it to be used in a more small-business scenario and its slight simplicity
    over GnuCash might be useful to some.'
