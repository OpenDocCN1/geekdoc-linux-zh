    # Double-free error


    It could seem harmless, a double-free memory error could lead to a well-known
    vulnerability where the check is altered in a way that already corrupted the code.
    The glibc debugger detects that this vulnerability can be disabled by setting
    MALLOPCHECK, which would have saved your first case, saving you some protections.


    # Fixing the double-free


    It is time to move on, your next assignment are proprietary piece of software
    the ATI graphics driver. While installing the graphics driver on a GNU-Linux system,
    a double-free memory corruption error is triggered and the process killed, which
    will prevent the installer from completing the installation.


    The GNU library implements some basic protections to avoid memory corruption of
    heap. In this particular case, the corruption happens because of a double-free
    condition. The error, by question, is hand-driven and the driver of the detecting
    device is a property of ATI itself, not Linux.


    The defective installer is ELF-64 binary in the ATI installer package: setup/x86_64/setup.
    The double-free memory corruption error is reported by the glibc debugger. Since
    it is triggered by double-free, you also have the backtrace of the installer''s
    execution. This way, it is feasible to determine the bug faulty instruction in
    ELF-64 binary.


    ```

    $glibc ***: setup=./bin/x86_64/setup

    ```


    ```

    double free or corruption (malloc_free): 0x013cbef0

    ===== Backtrace:

    1 lib/libc.so(+0xf6b70...)

    2 setup.data:bin/x86_64/setup+0xa6b8

    ```


    According to the previous back-trace, a call triggering the double-free error
    is located at 0x0a6b8 in the setup binary file (last). This time, the software
    is not open, therefore you do not have access to it. It is a bit difficult, but
    nonetheless, you are able to disassemble the binary using the offset and look
    for the function.


    As clearly shown above, the call is to 0x0a6b8 (last). And, as the previous back-trace
    has shown, the instruction located in this offset is 0x013cbef0, and that is a
    bug caused by double-free memory corruption. So you can prevent this instruction
    from freeing the already-freed address by executing the program in the gdb session.
    This program is based on the numbers, you have to redirect to output another,
    otherwise it would likely debug the problem.


    | File: setup | ASII: setup | Offset: 0x000A065 / 0x000A427 (:005) |

    |---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---||

