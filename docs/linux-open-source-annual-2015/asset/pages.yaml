    # Remote control-sockets


    We are going to use a 433MHz receiver and transmitter

    module which can be found for a couple of pounds on ebay

    - simply search for ''433MHz'' and you''ll find what you

    looking for connected to Arduino to switch a pack of

    remote control sockets (FS31 on Amazon). In our case, we

    used a pack of four remote control sockets. These are

    items such as floor-standing lamps, and

    anything else without an on/off switch. We have

    an Arduino Uno driver that doesn''t have an switch.

    Once we have set up the sockets to work remotely,

    You can use the 433MHz receiver and a piece of

    Arduino software to capture the message from the remote

    so it can trigger the relay. Our hardware

    modules have very simple wiring: Ground, Data. The

    receiver has two pins for the data line but you only need to

    connect the Arduino to one of them. The benefit of sniffing

    remote control is that it can be used to control anything

    like that works at 433MHz - remote control garage doors or

    light switches is likewise to use 433MHz.


    # LED light strips


    LED light strips are great. They are very easy to find

    for about £15 for length of five metres with a

    12V power supply and remote. They have the adhesive on the back

    so they can be stuck to a surface. Alternatively, you can just

    leave it on the reel that will still give off a lot of light.

    The strip has an individual red, green and blue

    colour. These colours can be set to any brightness

    between 0 and 100% using pulse width modulation. This

    is the signal for a square wave that is on

    or off of the time. For example, if the Red light

    resulting in reduced brightness, The strip has four

    colours connected to ground and Blue. The colour connection

    is completed when the pin for colour is

    nto ground, the circuit is completed, allowing 12V

    to flow through the strip and ground. We will use a high

    current power supply to drive the connection.

    Note that the ground from the Arduino and power supply

    should be connected to the motherboard. The 12V


