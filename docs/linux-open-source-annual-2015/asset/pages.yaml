    A virtualisation tool built right into the Linux kernel, Kernel-based Virtual
    Machines are powerful and fairly easy to use


    Also known as Kernel-based Virtual Machine, this allows for a Linux distro itself
    to be the hypervisor for its own virtual machines. In particular requires hardware
    virtualisation support in Intel and AMD processors (VT-x and AMD-V, respectively),
    supports a list of Different Linux distros and other operating systems.


    # 01 Test compatibility


    It''s important to find out whether your system can or actually run virtual machines
    using KVM, as it requires the hardware virtualisation support to be activated.
    To do this, open a terminal and use the following:


    KVM supports various desktops and servers for creating virtual machines, but requires
    a little more than VirtualBox, while also being slightly more efficient in some
    cases.


    ```

    $ egrep -c ''(svm|vmx)'' /proc/cpuinfo

    ```


