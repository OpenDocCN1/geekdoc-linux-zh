  md: 'supply for the LEDs should not connect to the Arduino - only to the LED strip
    - or the Arduino will get damaged.


    We used a TIP120 NPN transistor, which is plenty for our application (the power
    supply that switches with the strip only provides 2.5 amps, and in turn there
    is a 5 amp transistor for each colour). This transistor would also be good for
    controlling the speed of a fan or other kinds of motors.


    The pins of the TIP120 are Collector, Base, and Emitter. The base is connected
    to the PWM signal from the Arduino via a 220-ohm resistor. The collector is connected
    to the colour pins of the LED strip, and the emitter to ground. When passing high
    amounts of current, these chips get hot. It is wise to use solid wire from the
    emitter-to-collector and collector-LED strip wires because they can safely handle
    more current than jumper wires. You need to ensure that none of the wires connected
    to the circuit short, otherwise you would damage the LEDs in the strip. Our setup
    is on verdict so it would be much more stable than if you tested it works on a
    breadboard.


    # Temperature sensor


    The TMP36 is a very simple IC. It reads a voltage from -45C to +125 degree temperature.
    This voltage can be read by the analog pins of an Arduino. The formula it is:
    Temp in °C = [(Vout in mV) - 500] / 10, a voltage of 0.7V would be 20°C.


    # Camera


    You can use a USB webcam or Raspberry Pi camera for the video stream. The Raspberry
    Pi camera should be connected via the blue plastic facing the Ethernet connector,
    and the exposed traces of the ribbon cable towards the HDMI connector.


    # More hardware


    A more involved option for home automation could be remote control blinds. These
    are an excellent project because they go down, you can use them, build them yourself,
    and have them close. Another idea would be to use the same 433MHz frequency module
    to control servos, if you''re going to use them. If you want to put them on an
    em, a Python script to open and close blinds on the Raspberry Pi could be combined
    with Wi-Fi flight boards which works later (at a distance) and can come on as
    the curtains close.


