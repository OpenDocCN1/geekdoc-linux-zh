  md: "# How AWK works\n\nAWK reads its input line by line and splits each line into\
    \ fields. AWK has many built-in variables that are automatically initialized and\
    \ it supports. AWK also has built-in functions for string, number manipulation\n\
    \nThe NF variable holds the number of fields in the current input record; each\
    \ record can have a different number of fields. The FS variable is the input separator,\
    \ and by default it consists of any number of spaces and tabs in a single space.\
    \ Additionally, any number of leading or tabs is ignored; if its value is string,\
    \ then each character in the line becomes a separate field.\n\n> The first awk\
    \ version was introduced in 1986. It is still the most powerful and popular version\
    \ of AWK\n\nonly END runs without any additional code, if the input is read in\
    \ case the END needs to reference the FN or NR variables.\n\nThe F variable is\
    \ used for keeping the total number of records read from the current input line\
    \ once; whereas NR variable is used for keeping track of the number of records\
    \ that have been read so far.\n\n| Versions of AWK |\n| The original version of\
    \ AWK was program in the first AWK variant in 1977. It was introduced in 1986;\
    \ another AWK variant Beeks programmed the most powerful and popular version of\
    \ AWK |\n\n# 03 Using BEGIN and END\n\nAWK has two programs named BEGIN and END\
    \ of which each is a special and function. It should be noted that they occur\
    \ only once: before getting any input and processing. They are very useful for\
    \ starting up and finishing actions in your AWK programs.\n\nIt is not required\
    \ to use the BEGIN rule at the beginning of your AWK program or the END rule;\
    \ it is considered good practice to do them.\n\nIf an AWK program has BEGIN rules\
    \ without any of the specified input, however, if an AWK program contains multiple\
    \ BEGIN and END rules.\n\nNew BEGIN file.awk\nNew file CANTOE.awk\nCaption: AWK-END\
    \ Processing next!\nNew file functions.awk\nNew file special.awk\nNew file wc.awk\n\
    \nTotal number of files processed: 6\ncode$ BEGIN filename.awk\n# /usr/bin/awk\
    \ -f\n\n```\nBEGIN {\n  numberFiles = 0\n}\nBEGIN {\n  print \"New file\", FILENAME\n\
    \  # Check if there is an error while trying to read the line\n  if (NR != 0)\
    \ {\n    print \"Cannot read\", \"Processing next file!\"\\n  }\n```\n\nTwo patterns\
    \ with a special function and BEGIN and END: please note that they only occur\
    \ when awk reads the first record from a line and END is executed after awk gives\n\
    \nEND can be very convenient for reporting I/O errors. The AWK program can control\
    \ to ENDFILE (instead of stopping anyway) and the ERROR variable that describes\
    \ the error has occurred in the NR variable before processing the next line. Similarly,\
    \ the next statement, when used BEGINFILE, allows awk to move to the next data\
    \ file instead of exiting with fatal error and without executing the block.\n\n\
    The presented code shows their usage by printing the total number of files read\
    \ as the filename of each and it also reports if there is a problem when reading\
    \ a file. The printing of the filename is done with the help of FILENAME variable.\n\
    \n# 04 Using BEGIN and END\n\nIf there's an error, a next statement in BEGINFILE\
    \ or ENDFILE can help AWK proceed\n\n97"
