  md: '# Harness FOSS


    # MATE

    A fork and continuation of the GNOME 2 code


    Cinnamon''s lighter counterpart is the continuation of the older GNOME 2 line,
    forking the code when some users were unsatisfied with the direction of GNOME
    Shell. The MATE team''s design goal is to keep the GNOME 2 alive and up-to-date,
    incorporating modern features such as notifications and application/file search.


    Pros

    A lightweight continuation of the popular code


    Cons

    Still stuck in the past for countless users with LXDE or XFCE


    It''s best for users who prefer the workflow style of the desktop with a top bar
    hunting through separate apps, windows displayed on a mouse-centric design. It''s
    currently on a few distros and is being added more all the time. It''s much lighter
    than the likes of GNOME, KDE and Cinnamon, but it can''t really compete with LXDE
    or XFCE.


    | Best for

    Veteran users looking for modern features

    Associated distros

    Linux Mint, Snowlinux

    http://mate-desktop.com |


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_165_0.png)


    By default you can make MATE look exactly like the GNOME 2, although Linux Mint
    uses a slightly different configuration


    # Enlightenment


    An alternative lightweight option with a unique yet familiar look


    Enlightenment relies on a slightly atypical panel on the screen that contains
    system info and a list of open windows. The program is accessible from anywhere;
    an entire part of the desktop right-clicking anywhere will also bring up options.
    The panel doesn''t properly take the whole bottom of the screen as it seems like
    you''re missing out on screen but it works well. It''s very fast, light and mouse-heavy
    in its use. Due to the way the program is hidden away, it''s not the best candidate
    for a touchscreen and it doesn''t really have a range of useful keyboard shortcuts
    outters. It''s a very overlooked desktop that doesn''t use GTK or Qt to power
    it, making it much better at running a mixture of coded apps.


    Pros

    Lightweight and focus on usability and options access


    Cons

    Unique interface may be difficult to use for some users


    | Best for

    High custom, light setups

    Associated distros

    Bodhi Linux, Elite

    http://www.enlightenment.org |


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_165_1.png)


    You can access the application menu from anywhere you want, just in case you can''t
    get down to the panel'
