  md: '# Dig


    We''ve used the -n lot in this tutorial, as DNS issues can easily clear other
    problems. Once you''ve cleaned up DNS problems on your machine with the resolver,
    it''s time to reach out to the hierarchical world of DNS servers to check everything
    as it should be. Nlookup can help perform searches, but dig is the most flexible
    available.


    # 01


    Nlookup may be sufficient for resolving an issue or checking that you can, but
    for useful information about DNS servers and their recursive connections over
    the Internet, use dig, whose flexibility it requires a little time to get to know
    its options.


    ```

    > dig google.com

    > dig google.com -short

    > dig google.com +short

    > dig google.com @server 8.8.8.8

    > dig google.com +trace


    ; <<>> 8.8.8.8#53 (UDP)

    ; google.com. IN ANY

    ; flags: aa rd; time=14 ms; length: 512

    ; query: 1; answers: 12; authority: 0; additional: 0;;count: 0; qcount: 0


    ; ANSWER SECTION:

    google.com. 300 IN A 142.250.190.46


    ; AUTHORITY SECTION:

    google.com. 300 IN NS ns1.google.com.

    ns1.google.com. 300 IN A 142.250.191.26

    ns2.google.com. 300 IN A 142.250.191.25

    ns3.google.com. 300 IN A 142.250.191.23

    ns4.google.com. 300 IN A 142.250.191.24


    ; ADDITIONAL SECTION:

    ```


    # 02


    Names are served


    By default, dig returns A records, but it can also check other types such as MX
    (mail servers). In the cases we use dig to find names of namervers.


    # 03


    Hierarchical


    DNS is hierarchical, with the TLD (top level domain), such as .com or the root,
    then the first name. With searches tracing recursively there is plenty of room
    for errors - or even, if you''re unlucky, malicious attacks. Dig “trace” shows
    you the successive hierarchical steps taken by your query.


    # 04


    +short


    Hierarchical searches outputs a lot of information that you probably don''t need
    - even from a standard DNS lookup you only want the IP address. The +short option
    gives you just an abbreviated output, which is also very useful in scripting searches.


    # Wireshark


    Like dump, Wireshark dumps packets from the network, but it also performs interactive
    analysis – slightly over the top for networking problems, but for handling bottlenecks
    in the system. In most cases Wireshark is the GUI version, with the console version
    being packets. Both so you can adapt to wireshark when it gets troublesome.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_56_0.png)


    # 01


    Powertool. Despite the simple matter of selecting interfaces from capture menu,
    it is useful for detecting many problems with packet loss or latency, and won''t
    be installed unless you are carrying around on a USB live distro. To use as root
    server, use Setup/Capture Privileges over it, wireshark.org


    # 02


    Portable troubles


    Wireshark is useful for detecting many problems with packet loss or latency, you
    can go around the dancer permissions by carrying around on a USB live distro.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_56_1.png)


    # 03


    Filter set


    Filtering at the raw data is overwhelming and even the choice of filters is large,
    but you can right-click a suspicious entry and use that as the base, or do the
    filter from the filter. Simplest way is to look for a particular packet – say
    DNS, or something encrypted via TLS – so you just put that about.


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_56_2.png)


    # 04


    Command line


    On your VPS, or your GUI-box, tshark is handling equivalent to Wireshark. It''s
    worth installing after Wireshark and then getting familiar, so you are prepared
    if you need it.


