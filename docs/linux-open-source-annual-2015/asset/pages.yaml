    # ## 04 Achieve scalability by isolating the planes


    We have learned about the three major parts of Deis: data plane, control plane
    and the router mesh. We now need to understand the topology to be scaled for large.


    For small deployments, you can run the entire platform on just servers, just use
    the default settings. But as you scale, you might want to scale the data plane
    to isolate the control plane from the router mesh. Then you limit the control
