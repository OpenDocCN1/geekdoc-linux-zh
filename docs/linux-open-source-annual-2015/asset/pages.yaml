  md: '# Programming in Linux


    # Deploy software to Docker containers using Deis


    Deis is an application platform that helps you deploy and scale applications as
    Docker containers


    # Resources


    It is a thing of the past to code and wait for the operations team to deploy it
    with fingers crossed. DevOps is gaining steam as the preferred mode of software
    development and deployment. DevOps methodology and automation tools make it possible
    to deploy and test code in any language or framework with a simple git push. You
    can also use Deis to promote images through continuous integration.


    # Deis architecture


    Deis is based on a service-oriented architecture, with all of its components clearly
    segregated from one another, each having a clearly defined role in the larger
    scheme of things.


    Deployment components are categorized into three major groups: data plane, control
    plane and router mesh. We will take a look at them in the following steps, but
    first let us understand how these components communicate


    Being a deployment tool, Deis integrates with Docker. All the applications you
    deploy are distributed as Docker containers. Deis itself is a combination of services
    designed to run applications adhering to the Twelve-Factor methodology. A Twelve-Factor
    app is a methodology to build apps that scale up easily, lessons learned while
    using the Heroku platform.


    Deis runs on CoreOS, a minimal distribution designed to run infrastructure-enhanced
    services. So before you install the Deis platform, you''ll need a cluster with
    CoreOS installed. No need to worry about, CoreOS can be installed on almost any
    infrastructure.


    As the names suggest, the control plane handles the management functions, such
    as storage, management and configuration. On the data plane, actual application
    code in Docker containers and communicate with each other via a scheduler.


    The router mesh is used to handle the web traffic which is usually connected to
    the public Internet. It is also coupled with a front-end load balancer. Incoming
    traffic is of two types: accessing the control plane using API requests that are
    routed to the control plane, and the traffic meant for the application software
    that is routed to the data plane.


    Deis can take your code from git repo and publish it as Docker containers on your
    server cluster automatically


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_103_0.png)


