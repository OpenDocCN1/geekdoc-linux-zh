    perspective


    From time to time, a piece of software fails. Whether it''s due to a defect that
    sits in its code or a buggy external library the software depends on, the result
    is usually the crash. In this scenario, an expert is meant to solve the issue
    or find a way around it. However, most people lack any previous knowledge of the
    software, so a comprehensive and analysis without the right tools and techniques
    will be an impossible task. To make matters worse, you may have to debug the software
    for sources which will not be available (bear in mind that there are non-open
    source programs running on GNU/Linux). How? This will examine two real cases where
    the role of the expert is vital: debug, analyse and eventually fix or bypass the
    problem by means of using a debugger with the right tools. The process can even
    work in cases where you are not acquainted with the effective software at all.


    # Resources


    +   GDB Manual


    +   Glibc Checking


    +   Why Programs Fail Sometimes


    +   The Art Of Debugging


    # Bypassing a segmentation fault


    Our first case illustrates, even when we do have the


