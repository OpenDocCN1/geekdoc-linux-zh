  md: '# Automate your audio in Linux


    Automatically play your music at pre-determined times thanks to some inventive
    scripts


    Listening to music is not really a chore. Modern media have gone to a point where
    you can just launch them, automatically. It would be cool to have your computer
    play your music automatically, or have your laptop wake up rather than an unreliable
    mobile phone, scheduling your music for specific times of day or playing when
    you turn on - that sort of automation is the dream.


    Understand the system

    To get this work, we''re going to make extensive use of VLC''s command line interface.
    This will just launch the VLC with a few specific options and whatever you want
    to play. Very simply, you can play playlists in the command line using:


    # Resources


    videolan.org/index/


    ```

    $ VLC file.mp3

    ```


    We are in the business of showing how to do things with Linux. In this tutorial,
    we''ll show how to automate and schedule different tracks and playlists with a
    variety of triggers and methods. Making your working day more interesting by letting
    your computer handle music rather than deciding what to listen. Make sure you
    have VLC installed first - it''s usually under the package vlc in the repo.


    This will define the setup of your VLC player, such as whether repeat is on or
    if what is currently playing in a VLC instance.


    Below: With simple script and your own music library, you can automate your music
    listening experience


    ![](img/d4bd95635029bbd5aaa7fa01709a1972_65_0.png)'
