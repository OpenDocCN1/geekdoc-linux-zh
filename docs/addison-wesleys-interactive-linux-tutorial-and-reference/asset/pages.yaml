- pgno: 22
  md: '# Instructions for Installing and Using the Computer-Based Training Program
    and Assessment Tool on the CD-ROM


    # System Requirements


    Windows 95 or later

    Minimum screen display resolution should be 800 × 600 pixels

    with Small Fonts

    Memory: 32 MB RAM

    15 MB hard disk space

    CD-ROM or DVD drive


    # Installation Instructions


    +   1. Start Windows 95/98 or higher and insert the Linux Made Easy CD into your
    CD-ROM or DVD drive.

    +   2. Choose Run from the Start menu and type d:\setup in the command line box,
    then click OK. (If your CD-ROM drive is not d:, substitute the correct drive letter.)

    +   3. Follow the on-screen instructions.


    # Getting Started Instructions


    +   1. Click on Start.

    +   2. Select Programs.

    +   3. Select Edutrends CBTs.

    +   4. Click on Linux Made Easy.


    # Tips


    Most computers have the correct default settings. If the entire screen is not
    showing or several characters are cut off from the bottom of some CBT screens,
    then check your font settings. The Windows font settings should be set to Small
    Fonts.


    # Changing the screen display in Windows 95 or Windows 98:


    +   1. Click on Start.

    +   2. Click on Settings.

    +   3. Click on Control Panel.

    +   4. Click on Display icon.

    +   5. Click on the Settings tab.

    +   6. Set resolution. It must be a minimum of 800 × 600 pixels.

    +   7. Click on Advanced. (Do this step in Windows 98 only.)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '8. In the Font Size drop-down menu, select Small Fonts and click on OK.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_23_0.png)


    ![](img/cc8b9fd5970716027fba0d0a45c13900_23_1.png)


    The Main Menu with its Tool Bar is the screen from which you will begin navigating
    the course.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_23_2.png)


    # Using the CBT and Assessment Software


    # Introducing Yourself


    When you start the CBT course, the first screen you see after the license agreement
    is the screen on the left, which asks you to enter your name. The name that you
    enter here is important because, as we will explain in more detail below, the
    program keeps track of your progress through the course in two different ways:
    the Progress Report and the Electronic Bookmark. This record keeping is solely
    for your benefit. You are the only one who will see it. Be certain to remember
    the name you use—a nickname perhaps. Each time you re-enter the course, you should
    use the same name so that the program can help you keep track of what you have
    already accomplished.


    # Navigating through the CBT


    The CBT is organized much like a book. The Main Menu lists the available modules.
    By clicking on a module, you get to the sections within that module. By clicking
    on the sections, you get to the instructional pages, the main text of the CBT.


    The Tools menu at the bottom of the screen presents five important options: Progress
    Report, Electronic Bookmark, Help, Index, and Exit.


    The Progress Report is one way in which the program keeps track of your work in
    the CBT course. It indicates which modules you have started'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'and which modules you have completed. It also records your scores for the Review
    Questions at the end of each module. For example, if you have completed modules
    one and two, and you click on Progress Report, you will get the report on the
    preceding page.


    The Electronic Bookmark is another way in which the program keeps track of your
    work. The Electronic Bookmark acts just like placing a bookmark in your textbook;
    it remembers the last screen you viewed before you exited the course. Use this
    option if you want to continue at the exact place you last exited the program.


    Detailed instructions for using the CBT course are included in the CBT’s Help
    screens. For example, if you have a question about using the assent software,
    the answer is in the Help section.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_24_0.png)


    The course Index is a very important tool. It functions in much the same way the
    index in a book does. By selecting an entry in the Index—either a command, a task,
    or a concept, you can go directly to the section of the course that covers that
    material. You can make your selection from the Index in one of three ways: Double-click
    the item, highlight the item and press the <Enter> key, or highlight the item
    and click on “Go” on the bottom of the screen. If, after calling up the Index,
    you change your mind and want to return to the screen you just left, click the
    “Return” button on the bottom of the screen.


    The Exit button will take you to the Exit menu. From this menu, you can choose
    either to Exit the program or to take the *Linux Made Easy Assessment*.


    *SPECIAL NOTE ON EXITING THE COURSE*: The Progress Report and the Electronic Bookmark,
    described above, are updated when you exit the course. However, this record keeping
    will be inaccurate if you do not use the Exit procedure that the course provides.
    If you use the standard Windows “X” in the upper right-hand corner of the screen
    to close the program, you will succeed in closing the program, but you won’t succeed
    in keeping track of what you have done. Please exit the course using the Exit
    menu system provided.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/cc8b9fd5970716027fba0d0a45c13900_25_0.png)


    # Buttons on Each Module''s Instructional Pages


    Once you have selected a module for study, you leave the Main Menu screen and
    are presented with that module''s menu. From this point, you select the sections
    you are interested in covering.


    There are buttons that appear in the navigation bar located on the right side
    of the screen as you work through the sections. A button is displayed on the navigation
    bar if its function is an option at that time.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_25_1.png)


    Each module in the course ends with Review Questions. The QUIZ button allows you
    to jump directly to these questions. You might want to do this if you already
    have some knowledge of that particular topic and want to determine whether you
    know the material well enough to skip that module entirely. A detailed walk-through
    of the Review Questions feature of the CBT is provided later in this preface.
    The Progress Report displays your first review quiz score and your most recent
    Review Quiz score for each module of the CBT course.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_25_2.png)


    The INDEX button will take you to the course Index, from which you go directly
    to a particular task or concept.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_25_3.png)


    The GLOSSARY button will take you to a comprehensive glossary, which will enable
    you to quickly review any term we present in the course.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_25_4.png)


    The MENU button will take you to the previous menu. If you are within a section,
    it will take you to the menu for the corresponding module. If you are at the module
    menu, it will take you to the Main Menu of the CBT.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_25_5.png)


    The QUIT button will take you to the Exit menu. Always use this method of exiting
    the CBT. The Progress Report and the Electronic Bookmark, described above, are
    updated when you exit the course. However, this record keeping will be inaccurate
    if you do not use the Exit procedure that the course provides. If you use the
    standard Windows "X" in the upper right-hand corner of the screen to close the
    program, you will succeed in closing the program, but you won''t succeed in keeping
    track of what you have done.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '![](img/cc8b9fd5970716027fba0d0a45c13900_26_0.png)


    The **NEXT** and **PREV** buttons will take you to the next or previous screen,
    respectively. These are the buttons you will use most often to work through the
    CBT.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_26_1.png)


    The **SKIP** button appears alongside the Check-Up and the Review Questions. **SKIP**
    allows you to skip these quizzes. We urge you not to skip these quizzes the first
    time you go through the course. They will serve both to test you on what you have
    learned and to reinforce this learning. If at some point you use the course for
    a review of the material, skipping some of the quizzes may make sense.


    # The Review Questions feature at the end of each module


    Near the end of each module are the Review Questions. You see the second screen
    from one such quiz displayed below. The student''s answer—your answer—is shown
    by the filled-in circle. Correct answers are shown in red. Your score is displayed
    on the bottom of the screen.


    The button at the bottom of the screen labeled "See Review, Based on Your Incorrect
    Answers" is an important review tool. When you click on this button, the program
    will take you back to the screens that present the material you missed. If you
    don''t want to see this review, click on the **CONTINUE** button to view the module
    Summary.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_26_2.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# The vi Tutorial


    The vi Tutorial has two special features that we believe you will find very handy:
    the Command Summary List and the Function Summary List. Here you will find, in
    two different formats, a quick roundup of all the vi commands that we present
    in the course.


    The Command Summary groups vi commands by command category.


    The Function Summary is an index of actions you can accomplish with vi and the
    command corresponding to that action.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_27_0.png)


    ![](img/cc8b9fd5970716027fba0d0a45c13900_27_1.png)


    # Navigating through the Assessment Program


    The Assessment program will provide you with important feedback on your understanding
    of the material you have covered. The assessment program randomly generates multiple
    choice questions from a large test bank of questions. Each student receives a
    different test with each use.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_27_2.png)


    The Assessment program is easy to use. The instructions are included on the bottom
    of each screen in this assessment software, just click on your choice in the space
    provided and you will automatically go to the next question. You may move up and
    down by using the arrow keys and Page Up and Page Down keys. You can use the mouse
    to easily move around the screen and click on your answers.


    You can build your own test. You can choose to be tested on all modules, or select
    specific modules for inclusion in the test. The questions will be randomly generated
    for your own personalized test. This makes it an ideal assessment tool.'
  merge: -1
  img_proc: true
- pgno: 28
  md: 'When you have finished the test, the program will evaluate your answers and
    return a customized report for you that you may print. The report is divided into
    modules that correspond to the modules of the CBT. This makes it easy to focus
    only on the modules you need to review. It allows you to instantly spot your strengths
    and weaknesses.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_28_0.png)


    Notice in the report displayed to the left that Sam scored a 60% in Shell Scripts.
    Therefore Sami would need to repeat the Shell Scripts module.


    If the Assessment program indicates weaknesses in your understanding of the material,
    we urge you to start at the beginning of the module and repeat the material. You
    may choose to test yourself on any module using the Assessment program as often
    as you like. The program selects the questions randomly; you will get a different
    quiz each time.


    When you have completed all modules in both the CBT course and the workbook, return
    to the Assessment program. On the topic selection menu, click on the button labeled
    "Click here to select all topics." This will create one final test, which will
    include material from all modules in the course—your "final exam."


    # ### Using the Linux Include Easy Reference System


    In this workbook, you can quickly retrieve information about any command presented
    in this course—for example, **mkdir**. You can use the Glossary, which is the
    same as the glossary in the CBT course, reprinted here for handy reference.


    You can also use the Linux Command Reference in this workbook. The Command Reference
    presents information about commands in two different ways. **First**, commands
    are grouped according to function. You will find **mkdir** in the "Files and Directories"
    section. **Second**, the commands are listed alphabetically. If you had no clue
    to the use of **mkdir**, you could use the alphabetical section of the Command
    Reference to quickly find out what **mkdir** is used for.


    You will find the reference sections for the vi text editor in both the CBT course
    and in this guide. Let''s begin with the reference material in the CBT.


    On the *vi Tutorial* main menu, you will find one entry for "Command Summary List"
    and a second entry for "Function Summary List." The Command Summary list groups
    the various vi commands according to what you use them for. So, for example, in
    the section entitled "Cursor Movement," you will see that the "S" key moves the
    cursor to the end of the line. When'
  merge: -1
  img_proc: true
- pgno: 29
  md: 'you consult the alphabetical Function Summary List, scrolling down to the entry
    "move cursor to end of line" will show you that you use the "$" to accomplish
    this.


    In this workbook, you will find the "vi Command Reference." The vi Command Reference
    is divided into two parts: "Listing by Function" and "Alphabetical Listing." Using
