- pgno: 12
  md: '# Preface


    # To The Student


    The UNIX operating system, the precursor to Linux, has been in use since the early
    1970s. While the various Microsoft operating systems may get more media attention,
    UNIX is nonetheless a powerful operating system and a major player in the scientific,
    research, business and Internet communities. Linux is a "UNIX-like" operating
    system which has been propelled to prominence in the few years since Linus Torvalds
    began to develop it, as a student project, in 1991. While it has not replaced
    UNIX, Linux is much less expensive and in many situations is much easier to install
    and maintain. To gain a professional understanding of the contemporary computer
    world, a knowledge of UNIX or Linux is essential. While we assume that you have
    no prior experience with either UNIX or Linux, we do assume that you have some
    experience with computers and that you are comfortable with the Windows operating
    system environment.


    This book/CD package is a complete course and reference that consists of three
    parts:


    +   1.  *The Linux Made Easy Computer Based Training (CBT)* course software and
    on-line reference. This software teaches Linux in a self-paced interactive environment.
    You will learn interactively. With each new command covered, you will have the
    opportunity to actually use that command in a simulated Linux environment, thus
    learning by doing. The course software includes fourteen teaching modules, which
    correspond to the chapters in the book. Each module teaches the topic using explanations,
    animated examples, and interactive simulations of working in the Linux environment.
    Commands and concepts on the CD can also be referenced by using the Index and
    the Glossary, making this an ideal on-line reference for Linux users.


    +   2.  The companion workbook and reference. The book includes exercises for
    each module. This material reinforces concepts learned and allows you to practice
    at a Linux terminal. The Glossary and Command Reference included with the workbook
    also make it an ideal ready reference for Linux users.


    +   3.  The Assessment program. This testing software randomly generates multiple-choice
    questions on each module completed. When you have finished the test, the program
    will evaluate your answers and return a customized report for you, making it easy
    to determine which modules require further review. The Assessment program also
    provides a randomly generated final exam on the material covered in the entire
    course.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Using This Book/CD Tutorial Package as an Interactive Introductory Course
    on Linux.


    Follow these four easy steps to mastering the topics in each module:


    **1.** Begin each chapter by reading its introduction and list of objectives in
    this workbook.


    Read introduction and objectives.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_13_0.png)


    **2.** After completing the introduction, you will move to the CBT module for
    the corresponding topic. This is the primary instructional unit in this package.
    Read the presentation, watch the animated examples, and then complete the exercises
    in the simulated Linux environment.


    Read the presentation.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_13_1.png)


    Watch the animated examples.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '![](img/cc8b9fd5970716027fba0d0a45c13900_14_0.png)


    Complete the exercises in the simulated Linux environment.


    3.  After completing a module in the CBT course, gain experience at a Linux terminal
    by returning to the workbook and using the Try It Live! walk-through exercises.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_14_1.png)


    Gain experience on a Linux terminal.


    4.  You are done with the module and have completed the instruction for the topic.
    To test your mastery of the topic, return to the CD-ROM and take the Assessment
    for the corresponding module.


    Working through the fourteen modules and successfully completing the assessments
    results in a basic introduction to using Linux. The flexible menu structure of
    the CBT course allows you to pursue the many topics included in any order you
    choose. We strongly urge you to complete the fourteen modules in the order in
    which we have presented them.'
  merge: -1
  img_proc: true
