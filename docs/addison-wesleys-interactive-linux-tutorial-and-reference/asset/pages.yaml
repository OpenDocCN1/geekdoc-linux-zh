    # Terms to Remember


    **directory** A unit in the computer''s file system analogous to a folder in a
    physical filing cabinet.


    **link** A connection, technically called a “pointer,” from file1 to file2.


    **ordinary file** Files that contain text, data, or programs.


    **special file** A file that enables communication with a device—such as a monitor
    or a hard drive.


    **wildcard** One character that represents other characters.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# **Commands to Remember**


    | Command | Description |

    | :------ | :---------- |

    | cat     | (1) read a text file; (2) create a text file; (3) concatenate files;
    (4) append text to a file |

    | cp      | copy a file or group of files |

    | cpio    | back up files |

    | -exec   | used to specify an action to be performed on files located with the
    **find** command |

    | find    | find files |

    | grep    | search for specific text within a text file |

    | ln      | link files |

    | lpr     | print a text file |

    | mv      | rename a file |

    | -print  | used with the **find** command to tell the system to display the results
    on standard output |

    | rm      | delete a file or group of files |

    | rm -i   | In deleting multiple files, the system prompts you to confirm the
    deletion of each file. |

    | sync    | flush the RAM buffer and write files to disk |

    | tar     | back up files |


    # **Special Characters**


    | Character | Description |

    | :------- | :---------- |

    | ?        | represents one single character |

    | *        | represents multiple characters |

    | [ ]      | group files |


    # **Linux Files Summary**


    +   * Linux supports three types of files. Directories and ordinary files are
    the types you will deal with most of the time.

    +   * Filenames can be up to 255 characters long.

    +   * Nonalphanumeric characters can be used in any position in the filename.

    +   * Filenames that begin with a dot are normally hidden when the directory is
    listed. Use `ls -a` to list hidden files.

    +   * Linux recognizes the * and ? wildcards.

    +   * **cp** is the copy file command.

    +   * **rm** is the delete file command.'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   * **rm -i** permits you to say “yes” or “no” to each file when you delete
    a group of files.

    +   * **mv** has two functions in relation to files:

    +       (1) rename files;

    +       (2) move files to a different directory.

    +   * The [ ] brackets allow you to specify a group of files that will be affected
    by a command.

    +   * **ln** allows you to create links between files. This permits access to
    a file that may actually reside in some other directory.

    +   * **cat** has two uses:

    +       (1) view a text file;

    +       (2) join two or more text files into one file (concatenate).

    +   * **find** is used to locate files.

    +   * **grep** is used to locate text.

    +   * **lpr** sends your file to a printer.

    +   * **sync** tells Linux to make certain that all files are properly stored
    on the hard disk.


