- pgno: 212
  md: '# vi Cursor Movement Summary


    +   *   To move the cursor around the screen, **vi** must be in **command mode**.


    +   *   Press <Esc> to put **vi** in command mode.


    +   *   Each punctuation mark, parenthesis, or bracket is treated as a separate
    **small word**.


    +   *   A **big word** includes attached punctuation marks, parentheses, or brackets.


    +   *   Most **vi** commands can be modified by numbers.


    # Linux Made Easy Assessment


    Now that you have completed the material in both the CBT course and this guide,
    you can evaluate your progress with the *Linux Made Easy Assessment* program.
    After you have completed the Assessment, return to this guide and continue your
    work with module 12, *vi Basic Operations*.'
  merge: -1
  img_proc: true
