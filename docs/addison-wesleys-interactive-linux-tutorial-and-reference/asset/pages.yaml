    # Terms to Remember


    **daemon**  A process started by the kernel.


    **interprocess communication**  Pipes, signals and queues are three important
    methods by which processes communicate with each other.


    **kernel**  The core component of an operating system. It resides in memory and
    manages system resources.


    **PID**  Process identification number.


    **pipe**  A pipe takes the output of one process and turns it into the input of
    another process.


    **process**  A job or task that the computer carries out.


    **queue**  A holding area that stores processes waiting for execution by the system.


    **shell**  The particular operating environment in which you work. It is your
    interface with Linux.


    **signal**  A code transmitted from one process to another as a means of inter-

    process communication.'
