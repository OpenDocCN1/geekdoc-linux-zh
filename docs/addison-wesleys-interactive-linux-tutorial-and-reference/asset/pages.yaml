- pgno: 98
  md: '# Linux Files


    # Introduction


    In the previous module of the CBT, you learned about managing the Linux file system—the
    information "container." In this module of the CBT, you will learn about managing
    the information itself—individual files.


    What kinds of files does Linux recognize? How do we name them? Rename them? Copy
    them? Move them? Delete them? Print them? How can we "borrow" a file with a link?
    Is there a way to read a text file? Add to a text file? Join text files? Find
    files? Find text within files? Linux gives us many tools for managing files, and
    you will learn about them in this module.


    # In This Module You Will Learn:


    +   * about Linux file types.

    +   * how long Linux filenames can be.

    +   * what characters are permitted in Linux filenames.

    +   * about the wildcards * and ?

    +   * how to manage your files.

    +   * why some filenames begin with a dot.

    +   * how to link files.

    +   * how to join files.

    +   * how to append material to existing files.

    +   * how to find files.

    +   * how to print a text file.

    +   * how to be certain your files are saved to disk.'
  merge: -1
  img_proc: true
