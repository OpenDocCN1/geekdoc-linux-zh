- pgno: 66
  md: '# Linux Information and Communication




    # Introduction


    Computer networks facilitate communication. (The Internet has certainly demonstrated
    this!) From its very beginnings, Linux has been an operating system designed for
    networking—providing communication among its users. You will use three of the
    commands in this section—**mail**, **who**, and **write**—to do just that: communicate
    with other system users.


    **news** provides a quick way for you to get information that will allow you to
    keep up with developments on your system. **cal** and **date** provide handy information
    that will help you keep track of your world.


    # In This Module You Will Learn These Commands:


    +   * cal

    +   * date

    +   * mail

    +   * news

    +   * who

    +   * write'
  merge: -1
  img_proc: true
