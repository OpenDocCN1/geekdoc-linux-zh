    When you have successfully logged off, you will see the screen in Figure 3-15.
    If you do not see the login prompt, you have not logged off. Use `<Ctrl-D>` again.
    If you are still unsuccessful, you will need to contact the system administrator.
    Particularly for security reasons, it is very important not to simply walk away
    from a terminal when the logoff procedure doesn''t work.


