  md: "# Commands to Remember\n\n# Basic Cursor Movement\n\nh\t\t\tleft\nj\t\t\tdown\n\
    k\t\t\tup\nl\t\t\tright\n0\t\t\tbeginning of line\n$\t\t\tend of line\nH\t\t\t\
    high point of screen\nM\t\t\tmiddle point of screen\nL\t\t\tlow point of screen\n\
    \n# Move by Words\n\nw/W\t\tforward small/big word\nb/B\t\tback small/big word\n\
    e/E\t\tforward to end of small/big word\n\n# Move by Sentence/Paragraph\n\n)\t\
