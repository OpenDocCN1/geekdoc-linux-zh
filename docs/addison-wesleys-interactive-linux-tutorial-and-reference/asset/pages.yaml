    \ of a multiline file. On some systems or with some shells, the shell prompt will\
    \ include your userid and your working directory. If that were the case here,\
    \ then cat tempfile1 would produce the result you see in Figure 6-3.\n\n```\n\
    [userid dir1]$ cat tempfile1\nThis is tempfile1.[userid dir1]$ \n```\n\nFigure\
    \ 6-3 Expanded Shell Prompt Next to Text of tempfile1\n\nYou can see that it might\
    \ take an extra second or two to differentiate between the text of the file and\
    \ the shell prompt. It is a simple matter to remove this minor annoyance with\
    \ <Enter>. Keep in mind that <Enter> sends the cursor to the next line.\n\n+ \
    \  6. Create the second temporary file.\n\n+   a. Type cat > tempfile2\n\n+  \
