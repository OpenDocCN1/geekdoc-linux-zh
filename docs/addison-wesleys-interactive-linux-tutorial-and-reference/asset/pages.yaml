    # **Terms to Remember**


    **directory** A unit in the computer''s file system, analogous to a folder in
    a physical filing cabinet.


    **directory structure** Same as file system.


    **file system** The collection of directories and subdirectories in which information
    is stored in a computer.


    **hierarchical** When used in the phrase “hierarchical file system,” refers to
    a top-down directory structure, with the root at the top and directories and subdirectories
    below.


    **$HOME** A shortcut designation for your home directory.


    **home directory** Part of your account. It is your own subdirectory, usually
    in the directory /home.


    **root** In a hierarchical computer file system, this is the topmost level of
    the system.'
  merge: -1
  img_proc: true
- pgno: 96
  md: "**subdirectory** A directory that is below another directory—analogous, in\
    \ a physical filing cabinet, to putting one folder inside another folder.\n\n\
    # Commands to Remember\n\n+   cd\tchange directory\n+   df\tdisk free; free space\
    \ remaining on a hard drive\n+   du\tdisk usage; space used in current directory\
    \ and all subdirectories\n+   ls\tlist files\n+   ls -l\tlist files showing file\
    \ type, file mode, size of file and date of creation or revision\n+   man\tdisplay\
    \ pages from the system manual\n+   mkdir\tmake directory; create a new directory\n\
    +   mv\trename a directory\n+   pwd\tprint working directory; shows you which\
    \ directory is the current directory\n+   rmdir\tremove a directory\n\n# Special\
    \ Characters\n\n+   ..(double dot)\t\tparent directory\n+   .(single dot)\t\t\
    current directory\n\n# Linux Directories Summary\n\n+   Linux uses a hierarchical\
    \ file structure: root at the top, subdirectories below.\n+   Standard directories\
    \ in Linux include /bin, /etc, /dev, /home, /tmp, and /usr.\n+   When you log\
    \ in, Linux places you directly in your home directory.\n+   Your home directory\
    \ is where you will usually save your files.\n+   $HOME is another way to designate\
    \ your home directory. $HOME stands for /home/username.\n+   ls lists files.\n\
    +   ls -l lists the files and provides much additional information about the files.\n\
    +   The file mode determines both who can access your files and what they can\
    \ do with your files.\n+   pwd displays your working directory."
