    # Terms to Remember


    **CPU** Central processing unit; the computer’s “chip.”


    **environment** The set of conditions that determines how you are able to use
    your computer.


    **multitasking** The ability of the computer to carry out multiple tasks simul-taneously.


    **multiuser** The ability of the computer to allow multiple users to share the
    system’s resources simultaneously.


    **open system** A system in which any competent programmer can extend the features
    of the system by adding new computer code.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '**operating system** The program that controls and coordinates all the resources
    of a computer.


    **peripheral** Any hardware device that is added to the computer system. Your
    keyboard and disk drives are two examples of peripherals.


    **security** The aspect of the operating system that protects both the integrity
    of the system itself and the data that are stored on the system.


    # **Operating Systems Summary**


    +   *   The operating system organizes and controls the computer''s resources.
    It plays a major role in defining your computer''s working environment.

    +   *   Linux is a *multiluser, multitasking* system.

    +   *   Linux is an "open source" system.

    +   *   Linux will run on both large and small computer systems.

    +   *   Linux can be used to control computer networks.

    +   *   Linux is available both as a *free download* from many Internet sources
    and as a low-cost, packaged "distribution."

    +   *   Linux supports an effective, *built-in security* system. This security
    system is designed, first of all, to protect the system itself. Second, and equally
    important, Linux security protects your data from unauthorized access.


    # **Linux Made Easy Assessment**


