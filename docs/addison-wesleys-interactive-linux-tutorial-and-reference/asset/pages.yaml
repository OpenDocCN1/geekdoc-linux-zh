    # Command Structure Summary


    The most effective way to remember many of vi''s commands is not to remember individual
    commands but to remember the command structure. This command structure is presented
    in Figure 15-6.


    | Command List | Object List |

    |---|---|

    | <cw> | w small word forward

    | <cW> | W big word forward

    | change | b small word back

    |  | B big word back

    | <d> | ) sentence forward

    |  | ( sentence back

    | delete | ] paragraph forward

    |  | [ paragraph back

    | <cy> | $ to end of line

    | yank | 0 to beginning of line

    |  | k current line and line above

    |  | j current line and line below

    |  | n[object] affect n objects


    **Figure 15-6  vi''s Command Structure**


    In the *Linux Made Easy CBT*, we presented a quasi-algebraic expression:


    ```

    command [number] object

    ```


    You choose a command from a short list of commands to combine with an object from
    a much larger list of objects.  For example:  You combine <cw> (*change* from
    the list of commands *with* *cw*> (*small word forward* from the list of objects
    *to produce* <cw>: *change one small word*'
