    you can evaluate your progress with the *Linux Made Easy Assessment* program.
    After you have completed the Assessment, return to this guide and continue your
    work with module 7, *Linux Tools*.'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# # Linux Tools


    # ## Introduction


    A tool is a means to an end. You use a hammer to drive the nail that holds two
    boards in a bookcase together. The hammer is important because it helps you to
    accomplish the goal: building the bookcase.


    In this module of the CB1, you will learn about Linux tools that help you accomplish
    some goal. The pipe, the filter, and redirection are three tools that you will
    probably use on a daily basis. With the cat command, you will read and create
    text files. If you have access to a floppy drive on your system, you will need
    to be able to mount and umount the floppy. If you issue a command that the system
    can''t interpret, the system may send you an error message that will help you
    to straighten out the matter. And when you need help, help, man and info are there
    to assist.


    # ## In This Module You Will Learn:


    +   * about the fundamental role of the pipe in Linux.

    +   * how to use redirection.

    +   * what a filter is.

    +   * how to rearrange your data with sort.

    +   * how to create text files directly from standard input.

    +   * how to use a floppy drive on a Linux installation.

    +   * what it means to mount and umount a floppy drive.

    +   * how to create a host subdirectory for a floppy drive.

    +   * how to get help with help, man and info.

    +   * how to interpret standard Linux error messages.'
  merge: -1
  img_proc: true
- pgno: 139
  md: 'Now go to the *Linux Tools* module in the *Linux Made Easy* CBT. When you have
    finished the material in the CBT, return to this guide. When you get back here,
    do the exercises in Try It Level1, and then complete the questions in the Check
    Yourself and Match sections.


    # Try It Live!


    The typical Linux system provides various ways to get help with commands. In the
    next few exercises, we will explore some of the possibilities.


    +   1. With a command that requires an argument, if you use the com-mand without
    an argument, some systems will prompt you.


    +   a. Type **mv**


    +   b. Press <Enter>


    A helpful system will respond with a screen similar to Figure 7-1.


    ```

    ```

    mv: missing file arguments

    Try ''mv --help'' for more information.

    $ |

    ```


    ```


    Figure 7-1 The System Prompts You for Arguments to *mv*


    In this instance, the system is telling you that to use **mv**, you must indicate
    file arguments. The system is also telling you how you can get more information.


    **ls** is a command that does not require any arguments. But there are many switches
    you can use with **ls** to tailor its output to your needs. If you use **help**
    to get a list of the switches, on most systems the **help** information will consist
    of more than one screen and will scroll by before you can read it. In the next
    three exercises, you will use differ-ent methods to solve this problem.'
  merge: -1
  img_proc: true
- pgno: 140
  md: "+   2. In this exercise, you will pipe the output of `help` through `more`.\n\
    +   \n+      a. Type `ls --help | more`\n+      b. Press <Enter>\n+      c. Press\
    \ <Enter> to scroll down one screen line.\n+      d. Press the <Space Bar> to\
    \ scroll one full screen.\n+      e. Press the <Space Bar> two times to reach\
    \ the end of the file.\n+      You see that when `more` has displayed the end\
    \ of the file the command prompt reappears.\n\n+   3. In this exercise, you will\
    \ again pipe the output of `help` through `more`. This time you will return to\
    \ the command prompt before the entire file has been displayed.\n+   \n+     \
    \ a. Type `ls --help | more`\n+      b. Press <Enter>\n+      c. Press the <Space\
    \ Bar> to scroll down one screen.\n+      d. Press the letter q to quit and return\
    \ to the command prompt.\n+      You can also stop the output of `more` by using\
    \ <Ctrl-C>.\n\n+   4. In this exercise, you will pipe the output of `help` through\
    \ `less`.\n+   \n+      a. Type `ls --help | less`\n+      b. Press <Enter>\n\
    +      Note that the screen clears, and the display begins at the top of the new\
    \ screen. You see that `less` indicates in the lower left corner of the screen\
    \ which line numbers of the text are displayed. You can use a variety of cursor-movement\
    \ keys to move through this display.\n+      c. Press <Enter> to move down one\
    \ line.\n+      d. Press <Page Down> to scroll down one screen.\n+      e. Press\
    \ the <Up Arrow> a few times to scroll back toward the beginning of the file.\n\
    +      f. Press <Ctrl-End> to move to the end of the file.\n+      If <Ctrl-End>\
    \ does not work on your system, press the <Space Bar> until you reach the end\
    \ of the file."
  merge: -1
  img_proc: true
- pgno: 141
  md: 'Note that, unlike **more**, when you reach the end of the file with  **less**,
    you do not return to the command prompt. This gives you the option to continue
    scrolling back through the file—an option that you do not have with **more**.


    +   g.  Press the letter **q** to quit and return to the command prompt.

    +         On most systems, you cannot use <Ctrl-C> to quit **less**.


    As you saw in this module of the CBT course, **less** gives you many options for
    controlling the output.


    **help** gives you a list of the various switches, or arguments, that you can
    use to modify the output of a command. Even when the output is lengthy, as it
    is with `ls --help`, the information that **help** provides is terse and usually
    limited to command syntax.


    While **man** files are also terse, they nonetheless provide a great deal more
    information about the command. For example, you will find not only a list of switches
    but more detail about the effect of each switch. However, the **man** files are
    not intended to be instructional in the sense that the *Linux Made Easy* is instructional.
    A certain amount of knowledge about, and experience with, Linux is often assumed.
    Still, reading the **man** pages can often be illuminating.


    +   5.  Read the **man** page about the command `mv`.

    +       a.  Type `man mv`

    +       b.  Press <Enter>


    Your screen will look similar to Figure 7-2, which shows the first several lines
    of the output from `man mv`.


    The **man** pages provide what is often referred to as "system documentation."
    How these pages are displayed, however, is determined by the system on which they
    are displayed, not by the **man** pages themselves. This means that the way in
    which you control the scrolling of the output will vary from one system to another.
    Many systems use the utility **less** to display the **man** pages.'
  merge: -1
  img_proc: true
