- pgno: 144
  md: '**info** presents. Thus you can move back and forth among various topics as
    you gather information about the topic at hand.  **man** also provides cross-references,
    but **man** is not a hypertext system. To follow the cross-references that **man**
    provides you must quit **man** and then re-start **man** with the new article.


    **info** includes a very useful tutorial on how to use the **info** system. In
    the exercise that follows, we will show you how to get started with **info** and
    access this tutorial.


    +   9.  In this exercise, you will start **info** and launch its tutorial.

    +       a. Type **info**

    +       b. Press `<Enter>`


    At the top of the screen, you will see directions for accessing the **info** command’s
    internal help system.


    +   c. Press the letter **h** to start the tutorial.


    +   10. As Robert’s intern, you created several supply files. You then concatenated
    those files into one file, **supply**. The data in **supply** is not in alphabetical
    order. You will use the **sort** filter to alphabetize this data. (The supply
    files are in the directory **catalog**, so your first step will be to change to
    that directory.)

    +       a. cd **catalog**

    +       b. Press `<Enter>`

    +       c. Type **sort supply**

    +       d. Press `<Enter>`


    Your screen will look like Figure 7-3.


    As you can see, **sort** places uppercase characters before lowercase characters.
