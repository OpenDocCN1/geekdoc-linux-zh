- pgno: 58
  md: 'As we pointed out in the CBT course, there are situations in which you may
    legitimately need to log in at more than one terminal. In our case, however, logging
    in at a second terminal is just for practice purposes. Each terminal in use and
    each running process represents system resources. It is important not to misuse
    these resources. If you were successful in logging in at a second terminal, you
    will need to do the next exercise twice---once at each terminal.


    +   17. At the shell prompt, press `<Ctrl-D>`. (You will not use `<Enter>`.)


    ```

