- pgno: 190
  md: '# vi Cursor Movement






    # Introduction


    With a contemporary word processor, there are many ways to move the cursor around
    your document. You aren''t limited to using the arrow keys to move character by
    character or line by line.


    In this module you will learn that **vi** also has many ways to move the cursor
    around and through your text. In fact, **vi** offers some cursor movement features
    that few, if any, word processors offer.


    # In This Module you Will Learn:


    +   - how to move the cursor character by character.

    +   - how to move the cursor line by line.

    +   - how to move the cursor from word to word.

    +   - how to move the cursor from sentence to sentence.

    +   - how to move the cursor from paragraph to paragraph.

    +   - how to move the cursor from screen to screen.


    +   - Now go to *The vi Tutorial: vi Cursor Movement* module in the *Linux Made
    Easy CBT*. When you have finished the material in the CBT, return to this guide.
    When you get back here, do the exercises in *Try It Live*, and then complete the
    questions in the *Check Yourself and Match* sections.'
  merge: -1
  img_proc: true
