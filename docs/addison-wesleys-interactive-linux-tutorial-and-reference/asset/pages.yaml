- pgno: 97
  md: '+   - **cd** is the change directory command.

    +   - The double dot `..` represents the parent directory.

    +   - The single dot `.` represents the working directory.

    +   - **mv** is the command you use to rename a directory.

    +   - **mkdir** is the command you use to create a directory.

    +   - **rmdir** is the command you use to remove a directory.

    +   - **df** reports how much of space on your disk is free. It gives this report
    in blocks. The number **df** returns represents the entire file system.

    +   - **du** reports how much of your disk is already occupied with files. It
    gives this report in blocks. The number **du** returns represents the working
    directory and all its subdirectories.


