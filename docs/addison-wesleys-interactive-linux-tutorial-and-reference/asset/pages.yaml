- pgno: 214
  md: '# # vi Basic Operations


    # ## Introduction


    This module in *The vi Tutorial* will introduce you to operations that you will
    use on a regular basis. We can divide these operations into two categories: managing
    files and changing files.


    In the first category, you will learn how to open existing files, create new files,
    and save files. In the second category, you will learn how to enter, change, and
    delete text.


    # ### In This Module You Will Learn:


    +   - how to enter text with vi.

    +   - how to open existing files.

    +   - how to create new files.

    +   - how to save files.

    +   - how to change text.

    +   - how to delete text.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_214_0.png)


    Now go to *The vi Tutorial: vi Basic Operations* module in the *Linux Made Easy
    CBT*. When you have finished the material in the CBT, return to this guide. When
    you get back here, do the exercises in *Try It Live!*, and then complete the questions
    in the *Check Yourself* and *Match* sections.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# **Try It Live!**


    As we have done in earlier Try It Live! sections of this Study Guide, we will
    omit step-by-step instructions for some of the exercises. If you need some help
    refer to the Try It Live! Answer Key at the back of this guide. You will find
    whatever step-by-step instructions that may have been omitted in the exercises.


    In the first group of exercises, you will recreate at a Linux terminal what you
    did in the simulations in the *Linux Made Easy* CBT.


    +   1. Change to your directory **practice**.

    +   2. Open vi to create a new file named **nowtime**. Your screen will look like
    Figure 12-1.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_215_0.png)


    **Figure 12-1 vi Opens with New File Named nowtime**


    +   3. Insert text with `<i>`.

    +       a. You are going to enter the text in the paragraph below. The two small
    carets at the end of the first sentence are there to remind you that **vi** needs
    *two spaces* to mark the end of a sentence. Do not type the carets. Insert two
    spaces in their place instead.

    +       b. Press `<i>` to put **vi** into input mode.

    +           Note that the cursor does not change position when you press `<i>`.

    +           Type:

    +           *Now is the time for all good men to come to the aid of their country.*^^*Now
    is the time for all good women to come to the aid of their country, too.*'
  merge: -1
  img_proc: true
