- pgno: 77
  md: '# Commands to Remember


    cal: display a calendar for one month or one year

    date: display current date and time

    mail: send messages to people not logged in; send e-mail

    mesg n: prevent other users from sending you *write* messages

    mesg y: enable receipt of *write* messages

    more: prevent a long display from scrolling off the screen

    news: get system news

    who: find out who is currently logged in

    write: send messages to people currently logged in


    # Linux Information and Communication Summary


    +   * *cal* lets you display a calendar of a single month or an entire year.

    +   * *news* will keep you informed about what is happening on the system.

    +   * *date* gives you both the time and the date.

    +   * *who* tells you who is logged in to the system.

    +   * *write* lets you send messages directly to anyone currently logged in to
    the system.

    +   * *mail* enables you to send messages. When your recipient is not logged in,
    she will be notified that she has mail when she logs in. **mail** also allows
    you to read messages waiting for you.


    # Linux Made Easy Assessment


    Now that you have completed the material in both the CBT course and this guide,
    you can evaluate your progress with the **Linux Made Easy Assessment** program.
    After you have completed the Assessment, return to this guide and continue your
    work with module 5, *Linux Directories*.'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# # Linux Directories


    # ## Introduction


    One of the tasks at which computers excel is the management of information. To
    manage information, you need some sort of organization. The method of organization
    that a computer uses is called the **file system**.


    In this module you will learn about how the file system is structured and how
    to manage this file system. You will learn how to create and remove directories.
    You will learn how to move and rename directories. You will also learn how to
    tell when you are running out of file space so that you can make the appropriate
    decisions about what to keep and what to discard.


    # ## In This Module You Will Learn:


    +   - the basics of computer file systems.

    +   - how Linux directories are structured.

    +   - commands for listing the contents of directories.

    +   - which command to use to find out which directory is open.

    +   - how to delete a directory.

    +   - how to find out how much disk space is available.

    +   - shorthand directory notation that is applicable to all directories.

    +   - shorthand directory notation for your account.'
  merge: -1
  img_proc: true
