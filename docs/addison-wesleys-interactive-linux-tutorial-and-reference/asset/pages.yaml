- pgno: 154
  md: '# Security


    # Introduction


    In any multiuser environment, security is a concern of paramount importance. In
    this module we touch briefly on Linux’s first line of defense, the login procedure---keeping
    out unauthorized users.


    The primary focus of this module is the **file mode**. You will learn how to interpret
    file mode designations and how to change the mode of your files so that you can
    control both who has access to your files and directories and what kind of access
    they have.


    # In This Module You Will Learn:


    +   about the relationship between the login process and Linux security.

    +   how the file **mode** determines who has access to your files.

    +   how to change the **mode** of a file that you own.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_154_0.png)


    Now go to the *Security* module in the *Linux Made Easy* CBT. When you have finished
    the material in the CBT, return to this guide. When you get back here, do the
    exercises in *Try It Live!*, and then complete the questions in the *Check Yourself*
    and *Match* sections.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Try It Live!


    We’re going to give you an opportunity to work on your own. In the exercises that
    follow, we will not give you instructions for every step, as we have done in all
    previous “Try It Live!” sessions. You will call on what you have already learned
    to complete some of these steps.


    But we understand that Linux is complex; there is a lot to learn and remember.
    If you need some help refer to the “Try It Live!” Answer Key at the back of this
    guide. You will find whatever step-by-step instructions we have omitted in the
    exercises.


    +   1. Change to your home directory.

    +   2. Create a new directory called **newdir**.

    +   3. List your home directory and note the permissions for **newdir**.


    ```

    drwxr-xr-x 1 ronsm 1024 Nov 8 16:00 newdir

    drwxrwxr-x 1 ronsm 1024 Mar 1 12:23 practice

    ```


    Figure 8-1 Listing of Your Home Directory


    If the permissions that you see on your screen for **newdir** are the same as
    those you see in Figure 8-1, skip Exercise 4, but do read the explanation following
    step b.


    +   4. If the permissions that you see on your screen for **newdir** are *not*
    the same as those you see in Figure 8-1, you will change them in this exercise.

    +       a. Type `chmod u=rwx,go=rx newdir`

    +       b. Press <Enter>


    Translating the command syntax in step a into English, we have:

    For the user (**u**, the file’s owner), remove whatever permissions now exist
    (=) and substitute read, write, and execute (**rwx**) permissions for the directory
    **newdir**.


    For both the group and others (**go**), remove whatever permissions now exist
    (=) and substitute read and execute (**rx**) permissions for the directory **newdir**.'
  merge: -1
  img_proc: true
- pgno: 156
  md: 'Using the equals sign results in what is called an “absolute” permissions assignment.


    List your home directory again to be sure that the permissions for **newdir**
    are the same as those shown in Figure 8-1.


    Figure 8-2 presents a chart similar to the one we showed you in the *Linux Made
    Easy CBT*. The structure of the **chmod** command is simplicity itself: (1) ***who***
    the change will affect: **ugoa** (user, group, others, all); (2) ***what*** *action*
    you are taking: **+** **-** = (add, remove, absolute) **rwx** (permission); (3)
    ***which*** *file* or *directory* is affected: **filename**.


    We can sum up **chmod** with three words: ***who***, ***what***, ***which***.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_156_0.png)


    # **Figure 8-2 Syntax of chmod Command**


    In the next series of exercises, you will change the permissions of **newdir**
    several times. (Note that some of the resultant permissions will not make good
    Linux sense. The purpose of these exercises is to give you practice with **chmod**.)


