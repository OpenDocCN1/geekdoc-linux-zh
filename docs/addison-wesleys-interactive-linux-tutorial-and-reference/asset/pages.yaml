  md: "+   1. You may have received an error message, something like “Command not\
    \ found.” In simple terms, this happens because the shell doesn't know that it\
    \ is supposed to look for executable files in the working directory. The simplest\
    \ solution, then, is to tell the shell, “Look here!” To do that, pre-cede the\
    \ name of the shell script with **\\**.*\n+   \n+   This means that the command\
    \ line in step a of Exercise 7 will now look like this:\n+   \n+   **/.list**\n\
    +   \n+   There is no space between the forward slash and the file-name.\n+  \
    \ 2. Run the script with the “.list command.” This means that the command line\
    \ in step a of Exercise 7 will now look like this:\n+   \n+   **.list**\n+   \n\
    +   There **is** a space between the dot and **list**.\n+   3. Run the script\
    \ with the **sh** command. This means that the command line in step a of Exercise\
    \ 7 will now look like this:\n+   \n+   **sh list**\n\nThe script **list** is\
    \ quite simple in both its construction and what it does. Yet it requires nine\
    \ fewer keystrokes than the command line that it replaces — **ls -l \\| more**.\
    \ If you use that command line often, the nine keystrokes saved with each use\
    \ of **list** become significant.\n\n**list** works only in its own directory.\
    \ We can make **list** more useful by adding the ability to specify which directory\
    \ to list. To do this, we will use a variable."
  merge: -1
  img_proc: true
