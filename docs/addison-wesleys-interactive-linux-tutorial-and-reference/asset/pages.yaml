- pgno: 335
  md: '# Addison-Wesley''s Interactive Linux Tutorial and Reference


    # Linux Made Easy for You


    Addison-Wesley''s Interactive Linux Tutorial and Reference is a CD-ROM tutorial
    and a lab/reference guide which together enable you to acquire basic user-level
    familiarity with Linux in a self-paced environment.


    The material covers mostly generic Linux concepts (though it is based on the bash
    shell) and assumes no previous knowledge of Linux.


    The CD-ROM includes 14 modules (which average about an hour each) that demonstrate
    particular aspects of the Linux system using dynamic examples and hands-on exercises
    in a simulated Linux environment.


    Using the assessment software contained on the CD-ROM, you can determine how well
    you understand the topics covered in the modules; this tool randomly generates
    multiple-choice tests and prints a personalized report pointing out your strengths
    and weaknesses based on your performance, and can be used as often as you like.
    The personalized report directly corresponds to the CBT testing. It easy for you
    to review only the modules that require additional study.


    Upon completing a particular module, you can gain experience working with Linux
    terminal exercises in the module''s corresponding lab manual chapter. The lab
    manual also includes Linux command references and a glossary of key terms, both
    of which are provided as a useful reference to the Linux user.


    This tutorial will teach you to:


    +   Understand the role of operating systems and the general differences between
    DOS, UNIX, and Windows

    +   Recognize the role of the Linux shell

    +   Define key terms

    +   Understand the overall Linux file structure

    +   Log in and out of a Linux system

    +   Understand the importance of a home directory

    +   Use cd, cd, mail, mnew, who, and write commands

    +   Copy, rename, delete, move, link, sort, find, join, and print files

    +   Make, change, and delete directories

    +   Use pipe, redirection, and filters

    +   Use Linux on a daily basis

    +   Construct simple shell scripts

    +   Decipher Linux error messages

    +   Control the security of files

    +   Use vi text editor


    # System Requirements:


    +   Microsoft\* Windows 95 or higher

    +   Memory, 32 MB RAM minimum

    +   15 MB hard disk space minimum

    +   Minimum screen display resolution should be 800 x 600 pixels with Small Fonts

    +   CD-ROM drive


    The CD-ROM described above, is an enhanced version of Edurend''s commercial product.
    Purchasing this CD-ROM/tutorial package grants the purchaser a one-year license
    to the material on the CD-ROM. For an extension of this license or further information
    on network licenses: contact Edurend at www.edurend.com.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_335_0.png)


    Edurend''s, Inc. is a leader in the field of computer-based training. Since 1983,
    Edurend''s has trained over 50,000 people in communications and PC software, including
    people at AT&T, Michigan Bell, Merrill Lynch, Arthur Anderson Consulting, Xerox,
    SAPE NYC Board of Education, Jersey City public schools, New Jersey Department
    of Labor, U.S. Army Corp of Engineers, U.S. Department of Housing and Urban Development,
    Johnson Space Center, and the Federal Reserve Bank.


