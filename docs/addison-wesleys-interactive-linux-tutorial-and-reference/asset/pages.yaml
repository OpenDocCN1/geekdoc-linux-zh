  md: "Your screen display may look different from what you see in Figure 11-12. The\
    \ simplest explanation for this is that there are many possible terminal configurations.\
    \ If your **vi** terminal display is twenty-five lines, half a screen is twelve\
    \ or thirteen lines. If your **vi** terminal display is fifty lines, half a screen\
    \ is twenty-five lines. **<Ctrl-d>** scrolls down half a screen. This means that\
    \ you can expect the screen display to change, as it probably did for you in Exercise\
    \ 27. But if the file you are working on is small enough to be displayed on one\
    \ screen, **<Ctrl-d>** won't change the screen display but will instead move the\
    \ cursor to the approximate middle of the screen.\n\n+   28. Scroll up half a\
    \ screen.\n+   \ta. Press **<Ctrl-u>**. Your screen will look similar to Figure\
    \ 11-11, without the status line display.\n\n+   29. Scroll forward one full screen.\n\
