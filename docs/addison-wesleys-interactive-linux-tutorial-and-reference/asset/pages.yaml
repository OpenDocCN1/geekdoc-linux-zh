    +   f. Press <Enter>

    +   g. Press <Ctrl-D> to log out.

    +   h. Use the standard login procedure, by entering your *userid* and password.


    Note that to complete the process of changing back to bash, you had to log out
    and then log back in.


    +   16. If your Linux installation permits, log in at a second terminal. Now repeat
    Exercise 10.


    +   a. Type ps -a

    +   b. Press <Enter>


    Note that this time you are using a lowercase “a.”


    You will see two copies of your shell listed—one for each terminal you log in
    from. This reminds you that, each time you log in, you start a new copy of your
    shell and each copy is a separate process. Compare the “tty” column listing with
    each shell process; you will see two different terminal numbers.'
