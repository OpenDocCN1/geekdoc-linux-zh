- pgno: 199
  md: 'Why doesn''t **<3b>** reverse **<3e>** in steps h and i in Exercise 23? The
    "back-a-word" **<b, B>** and "end-of-word" **<e, E>** commands consider the word
    they are "in" to be the first word included in the movement. Step h in Exercise
    23 positions the cursor on the "i" of "cursor". The command **<b>** moves the
    cursor back to the beginning of the word the cursor is currently in. So the first
    **<b>** positions the cursor on the letter "c"; the second **<b>** positions the
    cursor on the ")"; the third **<b>** positions the cursor on the "t" of "the";
    and the fourth **<b>** moves the cursor back to its starting point before step
    h: the "c".


    In the next series of exercises, you will practice commands that focus on the
    screen rather than on characters and words.


