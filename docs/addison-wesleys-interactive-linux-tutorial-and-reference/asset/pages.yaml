- pgno: 237
  md: '# Edit and Undo Commands


    | | | |

    |---|---|---|

    | `:e filename` | (1) open an existing file named *filename*. (2) create a new
    file named *filename*. |

    | `:! filename` | open or create a file even though changes to the current file
    have not been saved |

    | `:w` | save the current file |

    | r | replace character under the cursor and return to command mode |

    | R | replace characters; remain in input mode until ` <Esc> ` |

    | u | undo last change |

    | U | undo all changes to current line |

    | x | delete character under cursor |

    | X | delete character to left of cursor |


    # Command Structure


    The most effective way to remember many of *vi’s* commands is *not* to remember
    individual commands but to remember the *command structure* instead. This command
    structure is presented in Figure12-37.


    | Command List | Object List |

    |---|---|

    | w | small word forward |

    | `< < > >` W | big word forward |

    | change b | small word back |

    | B | big word back |

    | `) | sentence forward |

    | `< d>` `(` | sentence back |

    | delete | | |

    | `}` | paragraph forward |

    | `{ | paragraph back |

    | `$ | to end of line |

    | `< y>` 0 | to beginning of line |

    | yank k | current line and line above |

    | j | current line and line below |

    | n[object] | affect n objects |


    Figure 12-37 vi’s Command Structure'
  merge: -1
  img_proc: true
- pgno: 238
  md: "In the Linux Made Easy CBT, we presented a quasi-algebraic expression:\n\n\
    #### command [number] object\n\nYou choose a command from a short list of commands\
    \ to combine with an object from a much larger list of objects. Example: You *combine*\
    \ `<c>` (*change*) from the list of commands with `*<w>*` (*small word forward*)\
    \ from the list of objects to *produce `<cw>`* — *change one small word forward*.\
    \ You can modify most such combinations with a number. Example: Add \"2\" to `<cw>`\
    \ to produce `<2cw>` or `<c2w>` — *change two small words forward*.\n\nSome commands\
    \ are also objects. You recognize that `<l>`, `<h>`, `<j>`, and `<k>` are cursor\
    \ movement commands. When these commands are *preceded by numbers*, the commands\
    \ *become objects*. `<k>` *by itself* means *go down one line*. `<2k>` *now addresses\
    \ the object “one line down” and says, “Do two of them.”* `<w>` *by itself* is\
    \ the command to *move the cursor one small word forward*. `<2w>` *now addresses\
    \ the object “one small word forward” and says, “Do two of them.”*\n\nThere are\
    \ some special cases that are not recognized in Figure 12-37. Three that we cover\
    \ in this course are:\n\n+   `<dd>` delete the entire line\n+   \n+   `<cc>` change\
    \ the entire line\n+   \n+   `<yy>` yank the entire line\n\nNote that the *yank*\
    \ command is covered in the next module: *Find, Copy, and Move* with *vi*. We\
    \ include it here to be able to present, in one place, a complete command structure\
    \ reference.\n\n# vi Basic Operations Summary\n\n+   - To enter text, *vi* *must\
    \ be in input mode*.\n+   - Most of *vi* *commands* are issued by using single\
    \ letters of the alphabet.\n+   - Uppercase and lowercase letters represent different,\
    \ and sometimes unrelated, commands.\n+   - *A physical line* occupies one screen\
    \ line.\n+   - *A logical line* may occupy more than one screen line.\n+   - Press\
    \ `<Enter>` to end a logical line.\n+   - Commands can operate on *objects*. When\
    \ a number is added to a command line that operates on an object, more than one\
    \ object will be affected.\n+   - Traditional *vi* does not wrap text from one\
    \ line to the next.\n\n![](img/cc8b9fd5970716027fba0d0a45c13900_238_0.png)"
  merge: -1
  img_proc: true
