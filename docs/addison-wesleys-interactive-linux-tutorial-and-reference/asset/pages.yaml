- pgno: 151
  md: '# **Match…**


    The term in the left column with the best choice from the right column. Note that,
    while more than one choice may be possible in matching the columns, only one choice
    for each item in the left-hand column will permit the correct matching process
    for *all* items in the left-hand column.


    +   1. mount

    +   2. floppy

    +   3. filter

    +   4. pipe

    +   5. prepare

    +   6. **man**

    +   7. read

    +   8. >

    +   9. |

    +   10. cat


    +   A. documentation

    +   B. create

    +   C. format

    +   D. pipe

    +   E. sort

    +   F. redirect

    +   G. floppy

    +   H. cat

    +   I. output to input

    +   J. unmount


    # Terms to Remember


    **filter** A program that takes its data from standard input and sends its results
    to standard output.


    **mount** Prepares a floppy drive to communicate with the system; integrates it
    with the system.


    **pipe** Takes the output of one process and turns it into the input of a second
    process.


    **redirection** A system procedure in which the expected progression from standard
    input to standard output is changed. Input may be some source other than keyboard;
    output may be something other than *screen*.


    **unmount** Reverses the **mount** procedure; disables communication between the
    floppy drive and the system.


    # Commands to Remember


    | command | --help | get help with the syntax for *command* |

    |---|---|---|

    | info | | hypertext help system |

    | man | | pages from the system manual |

    | sort | | a filter that rearranges data |'
  merge: -1
  img_proc: true
- pgno: 152
  md: "# Linux Tools Summary\n\n+   On many Linux installations, you will not have\
    \ a floppy drive.\n\n+   Before a new floppy disk can be used for backups, it\
    \ must be formatted.\n\n+   Before a new floppy disk can be used for routine copies\
    \ and backups, two separate steps are required:\n+   \n+   (1) format the disk\n\
    +   \n+   (2) install the file system\n\n+   You must mount a floppy drive to\
    \ the file system before it can be used.\n+   This means that you must tell Linux\
    \ that the floppy drive is available.\n\n+   You must create a separate subdirectory\
    \ on the hard drive to act as the host for the floppy drive.\n\n+   You must unmount\
    \ the floppy drive when you are finished using it.\n\n+   A pipe takes the output\
    \ of one program and turns it into the input of a second program.\n\n+   A filter\
    \ takes its data from standard input (the keyboard) and sends its results to standard\
    \ output (your screen). A filter redirects your data.\n\n+   sort and grep are\
    \ two Linux filters.\n\n+   Redirection acts like a traffic director. Using redirection,\
    \ you can indicate the path your data is to follow. For example, you can tell\
    \ sort to send its output to a file instead of to the screen—its normal destination.\n\
    \n+   man followed by a command name will give you detailed information about\
    \ that command. This information can run to several pages.\n\n+   command --help\
    \ will give you a brief description of the syntax for command.\n\n+   info is\
    \ a hypertext help system available on many Linux installations.\n\n+   The compiler\
    \ translates the source code into object code.\n\n+   The link editor creates\
    \ links between the compiled routines in the library and the object code.\n\n\
    # Linux Made Easy Assessment\n\n+   Now that you have completed the material in\
    \ both the CBT course and this guide, you can evaluate your progress with the\
    \ Linux Made Easy Assessment program. After you have completed the Assessment,\
    \ return to this guide and continue your work with module 8, Security.\n\n![](img/cc8b9fd5970716027fba0d0a45c13900_152_0.png)"
  merge: -1
  img_proc: true
