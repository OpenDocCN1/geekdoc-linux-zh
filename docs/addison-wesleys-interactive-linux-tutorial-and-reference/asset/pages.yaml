    Our concern at the moment is the file mode, represented by these characters in
    Figure 6-22: **rwxr-xr-**. We presented an overview of the file mode in the previous
    module, *Linux Directories*, of the CBT course, and we will go into the file mode
    in depth in the module entitled *Security*.


    For our present purposes, we will point out that when you create a link to a file,
    you are creating a link *to* a file that is *in* a directory. There are specific
    permissions required for both the file and the directory if you are to be able
    to both create the link *and* read the file. We will show you what the permissions
    must be and how to change them if necessary. But we will refer you to the *Security*
    module of the *Linux Made Easy CBT* and the corresponding Security chapter in
    this guide for detailed explanations about file mode and permissions.'
