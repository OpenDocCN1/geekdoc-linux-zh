  md: "+   8. Create a shell script that incorporates `ls -l | more`, and a prompt\
    \ for the specific directory to list. Call this file `list2`.\n+   \n+   a. Type\
    \ `cat > list2`\n+   b. Press <Enter>\n+   c. Type `echo -n “Which directory do\
    \ you want to list?”`\n+   d. Press <Enter>\n+   e. Type `read dir`\n+   f. Press\
    \ <Enter>\n+   g. Type `ls -l $dir | more`\n+   h. Press <Ctrl-D>\n\n9. The script\
    \ `list2` is a text file. Display the contents of the file on standard output.\n\
    Your screen should look like Figure 9-3.\n\n```\necho -n “Which directory do you\
    \ want to list?”\nread dir\nls -l $dir | more\n```\n\n# Figure 9-3 Text of the\
    \ Shell Script `list2`\n\nThe command **echo** tells the shell to display the\
    \ text enclosed in double quotes. The “-n” at the beginning of the line keeps\
    \ the cursor from moving to the next line; your response to the question “Which\
    \ directory do you want to list?” will be on the same line as the question. The\
    \ command **read** tells the system to take whatever you entered in response to\
    \ that question and place that response in the variable *dir*. The third line\
    \ is the familiar command, `ls -l`. The directory that you specified now appears\
    \ as the argument to `ls -l`. When you run the script, if you respond to the question\
    \ with “/etc/”, $dir becomes “/etc/”, and `ls -l $dir` becomes `ls -l /etc/`.\n\
    \nShell script programming syntax generally requires that a variable, *dir* in\
    \ this case, be preceded by a “$” when the variable is accessed—that is, when\
    \ the *value* (the content) of the variable is used. That is why *dir* becomes\
    \ $dir in the last line of the script: The *value* of the variable *dir* is used\
    \ in this line. This means that, when"
