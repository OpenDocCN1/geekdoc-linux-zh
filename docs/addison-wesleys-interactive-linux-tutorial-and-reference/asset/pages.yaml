    On some systems, there may be a lag between the time you issue a command to create
    or save a file and the time that the system actually stores the file on the disk
    itself. While this is not something you normally need to be concerned about, there
    will undoubtedly be a time when you have created a very important file and you
    want to be certain that file is stored on the disk. At that moment, you will want
    to use the `sync` command.'
