- pgno: 269
  md: '# Advanced Commands Summary


    +   - **vi** uses nine *numbered buffers*.

    +   - Numbered buffers automatically store deletions consisting of one or more
    whole lines.

    +   - **vi** uses twenty-six *named buffers*.

    +   - You control the contents of the named buffers by referencing a buffer with
    a letter of the alphabet.

    +   - To move text between two or more files, you use the named buffers.

    +   - You can access the Linux shell from within **vi**.


