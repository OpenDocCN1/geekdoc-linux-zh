    \ the single quotes. If the filename reference does not end with an \\* or ?,\
    \ you don't need the single quotes.\n+   * The *action to take*.\n+   Here, the\
    \ action is **-print**. Remember that **-print** in this context means \"display\
    \ on standard output.\"\n\n+   28. Use **find** to locate the supply files and\
