  md: "+   3.  Practice moving the cursor character by character.\n+   \n+   \ta.\
    \ Press <Esc> to be certain that vi is in command mode.\n+   \tb. Press <j> to\
    \ move the cursor down to the first line of text.\n+   \tc. Press <j> six times.\
    \ This will position the cursor on the letter “g.”\n+   \td. Press <0> to move\
    \ the cursor back to the beginning of the line.\n+   \te. Press <6g> to move the\
    \ cursor to the letter “g” with just one command, instead of the same command\
    \ repeated six times.\n+   \tf. Press <2j> to move the cursor down two lines,\
    \ to the line which ends with “pens.” Note that the cursor stays in the same column.\n\
    +   \tg. Press <$> to move the cursor to the end of the line. The cursor will\
    \ be resting on the period.\n+   \th. Press <l> a few times to move the cursor\
    \ to the right.\n+   \tNote that vi beeps. The cursor does not move beyond the\
    \ period after “pens.” The cursor does not wrap to the next line when you move\
    \ by character.\n+   \ti. Press <h> five times to move the cursor back to the\
    \ space before “pens.”\n+   \tj. Press <0> to move the cursor back to the beginning\
    \ of the line.\n+   \tk. Press <k> to move the cursor up one line. “pencils” is\
    \ at the end of this line.\n+   \tl. Press <2k> to move the cursor to the top\
    \ of the screen. The cursor will be resting on the blank line before the first\
    \ line of text.\n\nAs we pointed out in the CBT course, when vi was created the\
    \ computer keyboard was not standardized to the extent that it is now. You can\
    \ expect that newer versions of vi will allow you to take advantage of today’s\
    \ typical cursor-movement keys. Redo the preceding exercise, and substitute the\
    \ arrow keys for <h>, <j>, <k> and <l>. Use <Home> for <0> and <End> for <$>.\
    \ If the arrow keys and <Home> and <End> don’t work, it could be that your version\
