    that spans more than one screen line.


    +   b.  Press <Enter>


    Now read the new file.


    +   c.  Type `cat supply`


    +   d.  Press <Enter>


    A next logical step might be to print the file. To do this, you would use lpr—for
    example, `lpr supply`. But because guidelines concerning printer usage vary from
    system to system, we can''t include a print exercise here. Check with your instructor
    or system administrator for information about the use of printers on your system.


    For the final series of exercises, you will be you—not Robert''s intern. To complete
    this series, you will need to partner with another student, friend or colleague.


    You will create a link to a text file in another user''s account. Then you will
    read that text file. This will require that you be able to list the directories
    in that account and that you know which files are text files.


    To demonstrate, we will say that the other user''s `userid` is sam4. Your `userid`
    is ron sm.


