    +   2. u-w-x

    +   3. ug-x

    +   4. go+rw

    +   5. ug+x

    +   6. a=rw

    +   7. g-r

    +   8. go+x

    +   9. o-x


    +   A. remove execute for user and group

    +   B. add execute for user and group

    +   C. change a file''s permissions

    +   D. remove execute for users not in file owner''s group

    +   E. remove write and execute for user

    +   F. remove read for group

    +   G. absolute: read and write for all

    +   H. add execute for group and others

    +   I. add read and write for group and others


    # Terms to Remember


    **file mode** Indicates who can access any given file and what kind of access
    is permitted.


    # Commands to Remember


    **chmod** change access permissions for a file


    # Security Summary


    +   - The most basic element of Linux security is the **login** procedure. Every
    user needs both a *userid* and a password to gain access to the system.

    +   - The second element of Linux security is the **file mode**. The mode determines,
    for each and every file on the system, who has permission to read, write to, and
    execute that file.

    +   - Use the **chmod** command to change the **file mode**.'
  merge: -1
  img_proc: true
