- pgno: 170
  md: '# Shell Scripts


    # Introduction


    We humans find constant repetition boring. And boredom leads to poor per- formance.
    Computers, by contrast, don''t know the difference. Tell your computer to do the
    same job four thousand times, and you''ll hear nary a whimper.


    The Linux **shell script** is a means by which you can get the computer to perform
    repetitive tasks. The **shell script** is also a valuable tool for dealing with
    complicated command lines. If you find yourself using the find command with the
    **-exec** option often, for example, using a **shell script** to accomplish this
    task will remove the necessity of retyping and require that you enter that complicated
    command line only once.


    # In This Module You Will Learn:


    +   the purpose behind shell scripts.

    +   how to construct simple shell scripts.

    +   how the use of **variables** can greatly increase the usefulness of your scripts.


    ![](img/cc8b9fd5970716027fba0d0a45c13900_170_0.png)


    Now go to the *Shell Scripts* module in the *Linux Made Easy* CBT. When you have
    finished the material in the CBT, return to this guide. When you get back here,
    do the exercises in Try It Live!, and then complete the questions in the Check
    Yourself section.'
  merge: -1
  img_proc: true
