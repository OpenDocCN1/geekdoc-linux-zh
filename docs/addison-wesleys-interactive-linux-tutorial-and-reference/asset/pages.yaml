    ![](img/cc8b9fd5970716027fba0d0a45c13900_112_1.png)


    You can see that there are two files named **customers** in two different directories.
    Let’s assume that the two files, while using the same name, have totally different
    information. If you used **find** with **mv** with the intention of moving both
    files to a third directory—say, **dir3**, **find** would do the following:


    +   1. Move /dir1/customers to dir3.

    +   2. Move /dir2/customers to dir3.


    When /dir2/customers is moved to dir3, the first customers file is overwritten;
    all information in that file is lost.


    For this reason, not only must you exercise great care in using find combined
    with -exec, it is also wise to precede any intended -exec action with find and
    -print to be certain you know which files will be affected.'
  merge: -1
  img_proc: true
