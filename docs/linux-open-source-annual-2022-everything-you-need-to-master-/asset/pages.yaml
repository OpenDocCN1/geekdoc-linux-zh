  md: "# Roundup\n\nCaligra Suite » Google Docs  \n» LibreOffice » OnlyOffice » WPS\
    \ Office\n\n# Office suites\n\nFirst desktop suites and individual packages, and\
    \ now office suites have also found their way online. **Shashank Sharma** discusses\
    \ the best on offer.\n\n# HOW WE TESTED...\n\nWe’re running the latest version\
    \ of all the applications on top of the Budgie desktop. WPS Office and OnlyOffice\
    \ both provide Snap packages, so installation is a breeze. You’ll also find the\
    \ latest LibreOffice and Caligra in the software repositories of many distros.\
    \ This is why we haven’t tested them on the ease of installation. However, if\
    \ your distribution doesn’t feature the latest Caligra in the repositories, we’ll\
    \ caution you against attempting to install it manually. The compilation takes\
    \ far too long, only to result in insurmountable errors.\n\nWhile we’ve tested\
    \ the three common components of an office suite, we’re just as interested in\
    \ other components on offer, if any. Another important factor is the support for\
    \ different formats, including ODF, and even Microsoft Office’s proprietary format,\
    \ and how they render files. Extended functionality through plugins, and the available\
    \ documentation to help new users acclimatised to the different tools is also\
    \ an important criteria.\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_113_0.png)\n\
    \nSince last we looked at office suites way back in LXF167, the quintessential\
    \ productivity applications on offer for Linux users have undergone a sea change.\
    \ For one, the applications now boast of a much better compatibility with proprietary\
    \ formats. Another major development is the introduction of several online office\
    \ suites similar to Google Docs. In fact, many major players, such as Microsoft\
    \ Office and even LibreOffice, now offer online solutions.\n\nA desktop office\
    \ suite typically comprises many different applications. There’s usually an program\
    \ each for word processing, working with spreadsheets and making presentations.\
    \ Some suites also feature a database or a note-taking application. Most Linux\
    \ distros, even lightweight variants such as Damn Small Linux, ship with an office\
    \ suite, or programs to provide the same tools. You don’t always have to resort\
    \ to a mammoth project if all you’re interested in is a word processor. In such\
    \ situations, you can also opt to install standalone applications such as Abiword\
    \ for word processing and Gnumeric for spreadsheets.\n\nWhat makes these applications\
    \ stand out from one another is the default feature set. This becomes all too\
