- pgno: 57
  md: "# Do more\n\n# Secure your servers\n\nRooted or otherwise compromised servers\
    \ are all over the internet. Don't let yours become one.\n\nNo matter what you\
    \ do with your Linux servers you will almost certainly have SSH access to them.\
    \ Indeed this might be the only access you have, so it would be wise to secure\
    \ it. Naturally, you will already be using a strong password and will have already\
    \ turned off SSH access for the root account (if you use a login for it). The\
    \ latter is very important, but generally not necessary on Debian/Ubuntu servers\
    \ which use *sudo* for elevating privileges. Correcting it on other distros is\
    \ just a matter of adding `PermitRootLogin No` to the `/etc/ssh/sshd_config` file\
    \ and restarting the service. But we can do more. Since we looked at alternatives\
    \ to passwords on desktops earlier, we may as well study the same topic for servers.\
    \ Besides passwords, SSH enables you to log in via public key. So by generating\
    \ a key pair on the machine you log in from, and copying the public part of that\
    \ pair to the server, you are no longer required to use your password. You may\
    \ already have a keypair generated, look for a `~/.ssh` directory (on your local\
    \ computer, not your server) and then look in there for files named `id_rsa` (the\
    \ private key) and `id_rsa.pub` (the public key). You probably don't want to *overwrite*\
    \ these if they're already there, but if you created these a while ago, password-protected\
    \ them\n\n> **KEYS ADD EXTRA SECURITY**\n> \n> “While the password you set here\
    \ may be brute-forced or known to an attacker, they still need access to the keys.”\n\
    \n(optional but wise) and forgot the password (these things happen), then you\
    \ might,\n\nGenerating a key pair is easy, just run:\n\n`$ ssh-keygen`\n\non the\
    \ machine you're going to log in from. You can optionally save the file in a different\
    \ location, but then you'll need to provide this (via `ssh -i`) every time you\
    \ use it. You can also provide a password, which might seem counter-intuitive\
    \ since we are talking about avoiding passwords here. The rationale is that while\
    \ the password you set here may be brute-forced or known to an attacker; they\
    \ still need access to the keys for this to be useful. Conversely, if they have\
    \ the keys, they still need the password, so there's an additional security factor\
    \ at a cost of only a minor inconvenience to you.\n\nYou can add the keys to the\
    \ server manually, and cloud providers will let you do it from their management\
    \ interfaces, but it's easy enough to use the following command (again, all this\
    \ is done on the 'client' side), change `servername` to where you're logging in\
    \ to:\n\n```\n`$ ssh-copy-id servername`\n```\n\nThis will prompt you for your\
    \ user password and the key password, before copying the details to `~/.ssh/authorized_keys`\
    \ file on the server. It doesn't matter if you have a different username there,\
    \ once it's in place your next login will only prompt you for the key password.\n\
    \nThere's generally no need to try and manage multiple SSH IDs. Keys for multiple\
    \ servers can be stored happily in the same file. It's also not necessary to try\
    \ and copy IDs from one machine to another (it won't work). Simply set up a different\
    \ key pair on each machine you plan on logging in from. Besides using keys, it's\
    \ wise — and common bread-and-butter security — to set up the *Fail2Ban* service\
    \ to prevent brute-force attacks on your SSH logins (for users not enjoying the\
    \ recently extolled benefits of keys) and other services. We won't cover setting\
    \ it up here (there's a fine tutorial at http://bit.ly/lxf262fail2ban) but the\
    \ idea is that IP addresses that repeatedly attempt to log in will be blocked\
    \ (using iptables) for a set amount of time. Not only does this increase security,\
    \ it also stops your logs being swamped with failed login attempts.\n\n# Nextcloud\
    \ server audits\n\nOne of our favourite tools that you can host yourself is *Nextcloud*.\
    \ We use it all the time at LXF Towers because the Dropbox client on Linux is\
    \ awful. However, with great self-hosting comes great responsibility, so it's\
    \ important to make sure your *Nextcloud* instance is kept up to date and secure.\
    \ It's easy to forget about these things if they don't break all the time, and\
    \ indeed this is what happened to us. Sort of. We and other purveyors of fine\
    \ FOSS have been running *Nextcloud* on Debian for ages – it's a strong combination.\
    \ Debian will perform unattended updates for critical fixes, and manual\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_57_0.png)\n\
    \nNextcloud will be updated to version 18.0.1\n\nThese apps will be updated\n\n\
    +   • Accessibility (accessibility)\n+   • Activity (Activity)\n+   • Cloud Filesyncing\
    \ API (cloud_filedescription_api)\n+   • Comments (comments)\n+   • WebDAV (dav)\n\
    +   • Federated file sharing (federatedfilesharing)\n+   • Federation (Federation)\n\
    +   • Files (files)\n+   • PDF viewer (files_pdfviewer)\n+   • 0111 clock (files_rightclick)\n\
    +   • File sharing (files_sharing)\n+   • Deleted files (files_trashbin)\n+  \
    \ • Versions (files_versions)\n+   • Video player (files_videoplayer)\n+   • First\
    \ run wizard (firstrunwizard)\n+   • Log Reader (logreader)\n\nNotecloud Hopefully\
    \ it will not go neglected for another three years."
