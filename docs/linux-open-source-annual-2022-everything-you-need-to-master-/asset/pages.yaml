- pgno: 9
  md: '# NEXT-GEN DISTROS


    Step right up – LXF’s greatest showman Jonni Bidwell is here to unveil the finest
    Linux distros around!


    Cast your mind back 15 years, to that pre-credit crunch optimism of the mid-2000s.
    Windows users were appalled by Windows Vista, and this new Ubuntu operating system
    was claiming that it could displace Windows. This, despite being based on Linux
    (something you needed to have either contributed to yourself or subscribed to
    an arcane journal such as *Linux Format* to understand) and thinking that orangey-brown
    hue was a good desktop colour.


    Well, Windows may not have been wiped out by Ubuntu. But Linux has developed in
    leaps and bounds. It’s more usable than ever and key industry players take it
    much more seriously now. Thanks to Valve and Vulkan, we can play thousands of
    Windows-only titles on our Linux boxes. More companies than ever are shipping
    Linux on consumer hardware. Your wireless hardware probably works with it.


    Best of all, there’s a fine range of distros to choose from. Ubuntu has always
    been a great place to start, but it’s not to everyone’s taste. Here, we present
    our pick of the next generation of distros, sure to ruffle a few feathers. Since
    making Linux easy is very difficult, we’ve got a section on usable distros, including
    our long-time favourite for beginners: Linux Mint.


    Next, we’ll explore some of the best-looking distros out there that will give
    you a truly modern desktop. In particular elementary OS, through its Pantheon
    desktop, is doing the unthinkable by making Linux simple, powerful, and – dare
    we say – at least a little bit Mac OS-like.


    Finally, we’ll look at distros that are leveraging the latest in open source technologies
    (or so it seems by the number of complaints we get about Wayland, Systemd et al.).
    Or you might not be able to use your favourite software with them easily, but
    these will shape desktop Linux in the years to come.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_9_0.png)'
