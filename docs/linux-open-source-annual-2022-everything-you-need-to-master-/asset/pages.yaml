  md: '# # Tools for composition


    No matter how you might prefer to create songs, there''s a bit of software for
    you.


    The app called **Linux Multi Media System (L MMS)** has become the daddy of loop-based
    music making and easy MIDI editing. The important bit of **L MMS** is the sidebar
    on the left, which has samples, file management and instrument plug-ins – and
    instrument plug-ins are what **really** plug in! **L MMS** is the sidebar on the
    left, which has samples, file management and instrument plug-ins – and instrument
    plug-ins are what **really** plug in! Included are a bunch of weird instruments
    and different synthesisers, but we''ll be focusing on the component called **Si2
    Player**, which runs MIDI soundfonts, enabling you to compose MIDI-based music
    without external hardware.


    If you drag **Si2 Player** onto the **Song-Editor** window it will create a new
    track. Click the track''s **Si2 Player** button and a new plug-in window appears,
    with a piano and sound controls. If you click the piano now, no sound will come
    out of it – first you need to load a soundfont. In the middle of the window are
    two menus: **FILE** is for choosing the soundfont, and **PATCH** is for choosing
    which instrument to use (and there may be many to choose from). Once you''ve loaded
    your soundfont, clicking a piano key should now make a noise, and your computer
    keyboard will act as a substitute piano. The **Song-Editor** has a collection
    of notes for activating notes or samples: left-clicking enables a note, middle-clicking
    disables it, and double-clicking opens the **Piano-Roll** to create new tunes.


    In the **Piano-Roll** you can either record notes on the fly, or draw them by
    hand. Clicking on the piano keys on the left previews each note, and as long as
    the **Piano-Roll** is in **Draw** mode (click the pencil icon if it isn''t), clicking
    in the blank field creates a note that looks like a solid bar.


    If the note is the wrong length, you can click and drag the right of the note
    to make it longer or shorter. If you''ve played the wrong note, click and drag
    the note up or down the piano to adjust it, or move it into another octave. To
    delete a note, just right-click. If drawing out riffs isn''t your thing, you can
    use your computer keyboard to play notes in real time, and if you press the record
    button, **L MMS** will transcribe the notes for you on the fly. The beauty of
    **L MMS** is that you don''t have to choose between one mode or the other – you
    can combine both methods: drawing notes by hand, or playing them live. If you
    fudge a note while recording, you can redraw it later.


    Whether you''re into electronic music or not, **L MMS** is an excellent way to
    navigate songs and sequence musical arrangements. **L MMS** may not be a recording
    suite, but for those happy enough using synthesised instruments and virtual drumkits,
    there''s **genuinely** all you need to construct a song without having to buy
    extra hardware.


    # >> AUDACITY

    www.audacityteam.org


    Over the page we''ll be looking at fully fledged Digital Audio Workstations (**DAWs**),
    and these programs can be daunting to say the least! If you just want to do some
    basic multi-track recording (that is, layering one take over another) without
    the complexity of a full **DAW**, **Audacity** is your best bet.


    Although it''s technically possible to do it, **Audacity** isn''t really suited
    to multi-channel digital recording, such as digital drum recording with lots of
    mics, as the interface is really geared around mono and stereo. However, it''s
    brilliant for home demos and has become something of a de facto standard for simple
    audio editing as it is intuitive enough for most people to navigate, while being
    powerful enough to do some serious wave editing.


    That said, **Audacity** has become more complex lately, and it''s more likely
    you''ll need to troubleshoot something than in times past. For example, if you
    want to record a new separate track, press **Shift+R** instead of the **Record**
    button, as now **Audacity** keeps writing to the end of the last track you recorded.


    If **Audacity** in its current form isn''t to your taste, it''s worth trying a
    build from a couple of years ago instead. For a proper tutorial to the program,
    see tutorials in **LXF213**, **LXF 228** and **LXF249**.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_99_0.png)


    > > **Audacity** is great for taking down easy demos when you''re still writing
    and can''t be bothered with a big scary **DAW!**


    # Hydrogen

    http://hydrogen-music.org


    Unlike looping programs, **Hydrogen** is made by drummers for drummers, and is
    a great way to experiment with beat-making – even for people who have never held
    drumsticks. If you want to compose easily charted percussion arrangements across
    an entire song, **Hydrogen** is the way to go.


    Perhaps the easiest place to start is the bottom half of the screen, with the
    **Pattern Editor**. This is where you write drum bars, and the numbers along the
    top indicate which beat your note sits on. On the left is a list'
