  md: '# # FLATPAK

    ## Get hold of up-to-date software with Flatpaks

    **Aaron Peters** went all in on Ubuntu''s `.deb` package format years ago, and
    has never looked back. That said, there''s always time for a second opinion...


    +   **OUR EXPERT**

    +   Aaron Peters

    +   wishes he was a

    +   programmer, but

    +   sadly has to

    +   settle for telling

    +   programmers

    +   what to do in the

    +   world of software

    +   documentation.


    Linux has made great strides in the area of software compatibility. Or, more accurately,
    software is available more consistently across the various distributions and their
    native package formats. Yet this still requires the hard work of packagers. They
    need to take an application and tweak it to fit the specific needs of different
    distros, and even different releases of the same one. However, a few new universal
    package formats have emerged, bringing the promise of "package once, run anywhere"
    (on Linux, anyway).


    `Flatpak` (https://flatpak.org) is among the contenders Mayank Sharma reviewed
    in *LXF234*, and it''s got a lot going for it. In this article we''ll examine
    `Flatpak`, explore how to use it, and take a look at two important developments.


    ### Mode of operation


    `Flatpak` is both a package format, and a tool to install and manage those packages.
    Many Linux package formats work on the concept of dependencies, which means a
    developer can define that package A depends on package B. When a user tries to
    install that package A, the system will recognise the dependency and install package
    B along with it. This is how you `apt install` one application, and end up with
    a hundred packages to be downloaded and installed.


    In contrast, `Flatpak` provides you both the application and everything it needs
    to run in a distro-independent format. This approach has its pros and cons.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_109_0.png)


    > A Flatpak file contains all the information necessary to find an application,
    determine its dependencies, and install everything.


    +   ● Using the bleeding-edge version of an application, while keeping the standard
    version as well. Example: *LibreOffice*, shown in the screenshot (on page 74)
    running versions 5 and 6 at the same time.

    +   ● You have security concerns, and feel better with the program operating in
    a sandbox. Example: Adobe''s *Flash Player*.

    +   ● To use a more recent, more stable, and/or more full-featured version of
    an application than your distribution provides. Example: *Calibre*, which is well
    behind even on Ubuntu 16.04.


    Yet as we saw in *LXF234*, there are other formats that provide similar advantages.
    These include Ubuntu''s Snap format (www.snapcraft.io) and AppImage (https://appimage.org).
    While they all perform similar functions, `Flatpak` has a leg up on the competition
    in a couple of ways:

    ● `Snapcraft` is a Canonical project, and while it''s available in other distributions,
    it''s a first-class citizen of Ubuntu. If you use another distro, or just prefer
    a software system that''s not controlled by a single, commercial entity, `Flatpak`
    is a better choice than Snap.

    ● `AppImage` takes the approach of simply downloading and running a single file.
    This is straightforward, but not necessarily easy, especially for new users. First
    off, you need to set the downloaded AppImage file to be executable before you
    can run the app. In addition, there isn''t a built-in mechanism to update your
    AppImages. The project offers an external tool to do so, but you need to download
    and configure that yourself as well.

    Despite all this talk of pros and cons, you can use any (or all) of the above
    formats on your machine at the same time.


    +   **QUICK TIP**

    +   `Flatpak`s are identified by a sort of reverse URL scheme, the same kind you
    might use when naming code packages. The top-level domain comes first, then the
    domain, then sub-domain, and so on.


    | Pros | Cons |

    | Distribution agnostic | Uses extra space with duplicate files |

    | Ease of installation | Installation by either root or non-root users |

    | No conflicts with local system | Unable to install server applications |


    Yet the basic idea behind `Flatpak` is attractive. Find a program, install it
    easily, and run it without worrying about what else on your system may be using
    an incompatible version of the same library. Furthermore, installing applications
    as Flatpaks enables you to mix and match programs in ways you can''t with your
    normal package system, such as:'
