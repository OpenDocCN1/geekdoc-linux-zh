- pgno: 19
  md: '# Distros


    # Style


    **Which distro offers desktop panache?**


    C

    omparing different desktops is a tricky business, especially when we have species
    from all over the spectrum. We''re not going to mark ArchLabs down because it
    uses a lightweight window manager, and we''re not giving extra points to Antergos
    because it uses a readily available (though undeniably cool) icon theme. Instead,
    we''ll focus on how each desktop is styled relative to the components installed.
    We''re interested in icons and colour schemes working together, considered layouts,
    and freedom from clutter. Since we''re au fait with setting up various desktop
    environments from scratch in Arch, we''ll give credit for sorting out common quirks
    or deviations from the defaults (as long as they''re useful deviations). Whatever
    desktop you end up using, since Arch always ships the latest releases, you''ll
    probably end up with something that looks and acts better than it does in other
    distros. And if you don''t, well you might at least have found a brand new bug,
    or you might have caught a glimpse in to what users of other distros will be kvetching
    about in a few months.


    # **Antergos GNOME** 7/10


    Antergos is our only Gnome offering, but even before we''d got there we were impressed
    with the stylish console font setting during boot. Dash-to-dock provides a launcher
    on the left (à la Unity and Budgie), emblazoned with icons styled in the bold,
    Nurmix Square theme which is used throughout the desktop. The bright orange directory
    icons in Files might not be to everyone''s tastes, but we liked them. Tweaks and
    the User Themes extension are installed for tweaking and theming things to your
    taste.


    If you choose to use Gnome with Antergos then you''ll probably want to replace
    the clunky-looking LightDM greeter with GDM, and there''s a wiki page dedicated
    to doing just that. If there were an award for ''largest title bars'' then Antergos
    would win, but Gnome apps that use new-fangled GTK3 headersbars look quite comfortable
    with them.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_19_0.png)


    # **ArchLabs** 9/10


    We like the minimal, dark stylings applied to OpenBox and the Polybar panel. Thanks
    to Compton, some shadows and fades mean the desktop, albeit understated, still
    looks modern. ArchLabs'' colourful icon theme contrasts nicely with all the darkness.
    You can switch Polybar for Tint2, or add a dock (such as Plank or Docky), all
    from the comfort of the Preferences menu.


    If you feel Conky is polluting your desktop background, then it can be taken away
    too. It does provide some helpful hints though, most importantly that the Drun
    launcher is available by pressing the Super key. The visual cues on the desktop
    pager (Home, Web, Files and Pictures) are great for making the most of four virtual
    desktops. A few Xfce components are used and a few more - or indeed the whole
    of Xfce - can be added from the welcome menu.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_19_1.png)


    # Package management


    **How do our candidates tame Pacman and integrate with the AUR?**


    A

    ll the distros enable you to use excellent Arch''s Pacman tool, but this is probably
    not ideal for people who want to do things graphically. The Pacmac GUI is included
    in Antergos and the Xfce and Gnome flavours of Manjaro. This is a little bit slicker
    than the Synaptic-like Octopi used by Netrunner and KaOS (and Manjaro KDE). KaOS
    includes a GUI cache cleaner and package log, but command-line tools can do these
    tasks just as well. Netrunner also offers the appstore-like KDE Discover. ArchLabs
    enables Pacman to be installed from its welcome menu, but doing things CLI-style
    seems more fitting here and, speaking to that, it includes the text-based Pacif
    front-end. Pacif can help with downgrading packages, something not supported in
    Arch Linux but something that is on occasion necessary. Manjaro''s kernel tool
    will advise you of new kernels, it''s in Netrunner too, but we found we had to
    invoke it manually to upgrade to a new major version. This could we have importance
    on our part. Pacman can be further augmented by various helpers for building and
    installing custom packages from the famously useful Arch User Repository (AUR).
    Pacmac and Octopi both show new package notifications and can optionally integrate
    with the AUR. However, AUR packages may not get on with anything from outside
    the Arch repos, and so some caution ought to be exercised on those distros that
    use custom repos, particularly Manjaro. Currently, ArchLabs (where you''re least
    likely to run into AUR conflicts) uses the AuRman helper, but since development
    of this is fizzling out Yay is probably a better bet. Alternatively, Pacif can
    work as a front-end to the once premier, sadly now-defunct Yaourt AUR helper,
    too.


    VERDICT

    | | ANTERGOS | 8/10 | MANJARO | 9/10 |

    | | ARCHLABS | 6/10 | NETRUNNER ROLLING | 7/10 |

    | | KAOS | 8/10 | |


    Manjaro enables you to care for your packages any way you want. ArchLabs loses
    out for a lack of GUI offerings, but again, this may not matter to you.'
