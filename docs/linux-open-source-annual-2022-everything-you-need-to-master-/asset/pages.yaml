  md: 'strong password, and have the password manager generate (and remember) hard-to-crack,
    gibberish passwords for all the sites you use. There are plenty of cross-platform
    solutions that work through browser extensions and mobile apps, but there’s a
    few that actually support desktop Linux too. Our favourite is KeePassXC (https://keepassxc.org),
    which is a fork of the largely unmaintained KeePassX, which itself was a fork
    of the Windows-centric KeePass. You can install an older (but still good) version
    straight from the Ubuntu repos with


    ```

    `$ sudo apt install keepassxc`

    or use a snap to get a newer version with

    `$ sudo snap install keepassxc`

    Then fire it up from the Applications menu and click ‘Create new database’. The
    default encryption and storage options are fine for normal humans, but feel free
    to turn everything up to 11. The next screen is the most important: it’s where
    you must decide your master passphrase. Choose wisely, and consider writing it
    down somewhere and keeping it somewhere safe, but not somewhere it’s likely to
    get stolen. Choose a location for your password database, and consider backing
    up this file (and all your important files) regularly. Now add your many, many
    freshly secured passwords. You can sort them into groups, and install the KeePassXC
    browser extension for Firefox.

    ```


    # **A matter of factor**


    Many services now offer two-factor authentication (2FA), where besides a password
    some other token is required. Often this second factor is an SMS message, but
    there are problems with this. For one, a determined attacker may have the means
    to carry out a SIM-swap attack, whereby mobile network staff are socially engineered
    (or bribed or blackmailed) into porting the victim’s phone number to an attacker’s
    sim. Mobile malware is becoming more and more prevalent (don’t install apps you
    don’t trust!) and if the victim’s phone has fallen victim to such then their SMS
    messages will all be up for grabs. The SS7 protocol that connects cellular networks
    has long been a source of concern for the security conscious. Once you have access
    to any cellular network – whether that’s internally through a rogue employee or
    externally by some devious hackery – it’s actually possible to access any other
    network and intercept or reroute messages as befits your whim. So using SMS as
    a second factor is certainly stronger than using no


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_66_0.png)


    Generate unwieldy passwords without worrying about having to remember them.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_66_1.png)


    second factor at all, but other factors should be used for critical services.
    Hardware tokens and security keys are becoming much more widely supported as a
    second factor for popular services. The Challenge-Response card readers required
    by some forms of internet banking are an example; they add credence to the notion
    that it is the account holder trying to make a given transaction by proving that
    whoever is doing so has their card and PIN number. Unfortunately, these devices
    tend to spend most of their time getting lost or running out of battery at the
    most inopportune moments.


    # **Sessions**


    That’s the problem with real-world security: it has to take into account all the
    silly mistakes real world humans are so good at. Stay safe, peeps! 15


    > GitHub supports 2FA. First set it up to use Google Authenticator, then you can
    use a U2F token.


    # >> WE SECOND THIS MOTION


    Google’s Authenticator app for Android is a software 2FA solution, albeit a proprietary
    one, that uses the Time-based One-time Password protocol (TOTP) to generate six-
    to eight-digit one time codes for use as a second factor. It’s widely supported,
    not just on Google sites, so if you have an Android phone this is a free way to
    boost your security and reduce the chance of unfortunate takeovers. The magic
    of this is that, once a token is generated and shared between the site and the
    app, the same code is generated independently based on the current time. The algorithm
    can tolerate clock skews and network latency, so the app and the site don’t need
    to both keep exactly the same time. Authenticator codes can theoretically be spied
    on and, though an attacker would have to be watching you in real time for this
    to work, so for ultimate security we recommend using a hardware solution such
    as one of Yubico’s YubiKey range. These support a variety of authentication protocols.
    It can work in tandem with a TOTP app as a Universal Second Factor (U2F), or it
    can authenticate with supported services via NFC (Near Field Communication) on
    a mobile phone. It can also work as an unlock key for a password manager service.
    Which is nice.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_66_2.png)


    Yubico kindly sent us some YubiKeys – we’ll check them out in a future issue.'
