- pgno: 149
  md: '# # User experience


    Is the interface intuitive to a mere human or only to a Cyberdyne T-800?


    Whatevers their interface and design philosophy, all video editors perform similar
    function. To begin, the tools enable you to manipulate a single video file, or
    a series of them, and arrange them into a sequence. All along, you can deploy
    different effects to smoothly transition from one clip to the next. You can also
    insert a title to the video, to give it proper introduction.


    In common parlance, a track comprises video clips, effects and title file. The
    tools make it possible to work in parallel on several different tracks, where
    one is for audio, another for effects, and so on. The tracks are all visible on
    a single interface referred to as the timeline. The final part of working with
    these editors is rendering, which turns your work into a chosen output format,
    such as DVD, online publishing, and so on.


    We''re looking for a tool that seamlessly integrates these different tasks into
    an easily navigable interface.


    ### Flowblade


    6/10


    *Flowblade* presents a simple interface when you first launch it. While the interface
    is riddled with buttons, you don''t feel overwhelmed with options. You can''t
    maximise the application window, and it appears as if the interface cuts off abruptly
    at the bottom, but don''t worry, this is all there is to the application window.


    The timeline at the bottom comprises a series of grey rectangles, on to which
    you will drag-drop the clips that make your film.


    All your media files are stored in what *Flowblade* refers to as bins and your
    project must have at least one bin. To apply a filter, you must drag-drop it on
    to a clip on the timeline. The application automatically pops open a dialog providing
    useful information on what the filter does.


    The limited number of undo/redo actions and insufficient documentation are key
    reasons why we can''t recommend *Flowblade*, despite its clean interface.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_149_0.png)


    ### Kdenlive


    9/10


    Before anything else, you must go through the *Kdenlive* documentation. Not only
    will this serve to help you make sense of how *Kdenlive* works, it''s also an
    excellent introduction to video editing in general. Of course, the different tools
    have different approaches to the workflow, but understanding the process will
    help you easily master the different tools.


    The left-most panel holds the different clips that you wish to work with. The
    right of the screen is reserved for monitors. *Kdenlive* features a Clip Monitor,
    which displays the clips you''re working with. Click the Project Monitor button
    to view how the finished project will look like with all the effects and transitions.
    Below the monitors are the timelines, where you will work to manipulate the audio
    and video files. If you drop a video file on to an audio track on the timeline,
    *Kdenlive* retrieves the audio from the clip to work with.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_149_1.png)


    # # Supported file formats


    Even cinematic masterpieces are encoded MP4, right?


    At the very least, the video editor should be able to work with a variety of file
    formats and produce output files that are fit for appearing on different platforms,
    such as online publishing.


    Thanks to their reliance on *FFmpeg*, most of the tools on our list can work with
    almost any video format, and render files in your desired format. All the tools
    present a large scrollable list of formats you can export files your project to,
    after you''re done editing the videos.


    With *Flowblade* and others, you can also create a profile of the project, which
    depends on the source video files you wish to work on. All the tools are capable
    of correctly identifying the source of the files, and will suggest changing the
    profile if it''s different from the video files.


    *LiVES* is different from the others in that it relies on *mplayer* decoder when
    working with the different formats. Both *Kdenlive* and *LiVES* support Firewire
    input, but this option isn''t yet available for the other tools.


    Another useful feature of *LiVES* is that it can be used to capture external windows
    via mouse clicks. Coupled with its support to record audio from an external source,
    you can easily use the application to create professional-grade screencasts.


    You can similarly use *Openshot*, which is quite handy at capturing feed from
    a webcam. Apart from choosing the video codec, resolution, aspect ratio and so
    on, the tools also choose the audio channels, bitrate and more. The default setting
    for each of these varies according to the chosen output format, which can be Webm,
    Matroska, OGG, SWF and more.


    # **VERDICT**


    |  |  |  |  |

    |---|---|---|---|

    | **FLOWBLADE** | 8/10 | **OPENS HOT** | 8/10 |

    | **KDENLIVE** | 9/10 | **SHOTCUT** | 8/10 |

    | **LIVES** | 9/10 |  |  |


    Shotcut and Openshot plan on introducing Firewire support at some point down the
    road.'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# ## LIVES 6/10


    Unlike the other applications, which heavily rely on buttons within the interface
    to handle the different operations, *LIVES* is old school. It features a plain
    old toolbar at the top with different heads such as File, Edit, Play, Effects
    and Audio, along with a handful of buttons.


    The tool defaults to the Clip Editor mode when you run it. You begin by adding
    files from the File menu. For each file you add to your project, *LIVES* will
    display the first and last frame in the video clip and the total number of frames.
    If the video has sound, it’s relegated to the audio track at the bottom of the
    window.


    To edit clips, you must launch the Play window, which has its own playback control
    buttons. Unfortunately, these buttons disappear as soon as you hit Play, making
    it difficult to stop the video, or select the portion of it you want to work with.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_150_0.png)


    # ## Openshot 8/10


    Unlike *LIVES*, where a lot of the toolbar entries remain disabled until after
    you’ve added files into it, you can freely navigate *Openshot* to get a sense
    of how it organises the workflow without importing any files, or starting a new
    project.


    As with all the other tools, the timeline is restricted to the bottom of the interface
    while project files, available effects and transitions can be accessed by pressing
    the appropriate buttons on the left panel. You must resize the panel at the bottom
    to be able to access the complete timelines. When you overlap two clips on the
    timeline, Openshot automatically creates a smooth fade between them. With the
    other tools, you must work to put in a fade effect.


    Whereas the other tools feature separate tracks for video and audio clips, Openshot
    enables you to add all files on to a single track, which makes things more convenient
    for new users.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_150_1.png)


    # ## Shotcut 7/10


    *Shotcut* and *Kdenlive* have the distinction of having cluttered interfaces.
    While the latter makes up for its with its vast documentation, the reliance on
    video tutorials exclusively to introduce *Shotcut* feels ill-advised.


    The interface features a toolbar at the top with several useful buttons. Clicking
    these opens the relevant element within the interface itself. It’s easy to miss
    the new elements on the interface, since everything’s fairly crowded already.
    For instance, keep your eye at the bottom of the window as you alternatively click
    Timeline and Timeframe. You’ll notice the different elements appear without any
    fanfare. Ditto when you switch from Filters to Export, which affects the left
    panel.


    For each new element that pops up within the interface, you’re also presented
    with a number of additional buttons to control the different settings.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_150_2.png)


    # # System requirements


    Nobody enjoys a slow-motion car chase through rush-hour traffic.


    **V**ideo editing is resource-intensive work. As you grow accustomed to these
    tools and begin to work with it to process your home videos, you’re going to want
    to put their batch processing abilities to use, to save time. Although you don’t
    need oodles of disk space or RAM, you can’t get very far with these tools on low-spec
    machines. While you don’t need a dedicated high-end rig to get started with these
    tools, you can’t expect to go very far with a repurposed notebook, brought back
    to life with a lightweight Linux distribution. *Kdenlive* and *Flowblade* don’t
    provide minimum system requirements on their respective websites. This is perhaps
    because of their proxy editing feature. When enabled, proxy editing replaces your
    original clips with lower-resolution alternate. Because these low-spec proxy clips
    hardly require any computer power, you can carry out all the operations and enjoy
    fluent playback.


    This feature isn’t available in the other applications, and so *Openshot* and
    *Shotcut* both recommend at least 4GB of RAM to be installed in your machine.
    For optimum performance, a 64-bit multi-core machine with at least 2GHz process
    is ideal. Although *LIVES* only recommends 512MB RAM, it was the slowest of all
    the tools to launch on our quad-core 2GHz test machine which was fitted with 12GB
    RAM.


    Because the requirements depend on the source video files that you work with,
    *Shotcut* provides a guide on choosing hardware. It recommends at least 4GB for
    SD, 8GB for HD, and 16GB of RAM for 4K videos. You’re also advised to get at least
    one 2GHz core for SD, two cores for HD, and four cores for 4K videos.


    > **VERDICT**

    > You can’t go wrong with providing as much RAM and CPU cores as possible for
    these video-editing tools.


    | APP NAME | RATING |

    | :--- | :--- |

    | FLOWBLADE | 9/10 |

    | KDENLIVE | 9/10 |

    | LIVES | 8/10 |

    | OPENSOT | 8/10 |

    | SHOTCUT | 8/10 |'
  merge: -1
