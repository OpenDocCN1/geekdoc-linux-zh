  md: "# Do more\n\n> QUICK TIP\n> \n> A cool feature veterans may not know about\
    \ is the Wave Color entry in the drop-down menu, which has four different colours,\
    \ and is meant for easily differentiating between instruments.\n\nDefault or Pulse.\
    \ Default will probably use ALSA, which will run much faster, but if you're using\
