- pgno: 173
  md: '# # System Administration


    Find out exactly what''s going on under the hood of your Linux box.


    # ## » GLANCES


    *Glances* is a Python script that smartly displays a lot of information about
    your current session inside a standard terminal window. You can use the tool to
    monitor remote machines and use the built-in web interface to monitor machines
    using a web browser. [https://nicolargo.github.io/glances](https://nicolargo.github.io/glances)


    # ## » PORTAINER


    Using Docker via the terminal isn’t all that cumbersome and the tool is well documented.
    To make your life easier however, you can use *Portainer*, which is an open source,
    web-based graphical front-end that supports all the features exposed by the Docker
    API. You can use it to manage containers, images, networks, and volumes and it
    can manage a standalone Docker environment, or a Docker Swarm. From its dashboard
    you can create containers and view and manage all available ones. You can obtain
    real-time stats such as CPU and memory usage and various other details about the
    running containers and even access a container’s console, all from within the
    browser window. *Portainer* is available as a Docker container so you can install
    it with a single command. To create containers you can use one of the dozens of
    predefined templates. The tool can be used by multiple users and has useful user-management
    functions. You can for example use it to define the levels of access any other
    users have to *Portainer*, and the aspects of Docker they can manage from within
    *Portainer*. [https://portainer.io](https://portainer.io)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_173_0.png)


    You can use Portainer to pull images from Docker Hub or a private registry.


    # ## » FIREJAIL


    *Firejail* enhances security by isolating programs and processes inside limited
    sandboxed environments. By locking away the web browser or any tool that can be
    compromised, *firejail* prevents a compromised program from accessing critical
    areas of the filesystem. [https://firejail.wordpress.com](https://firejail.wordpress.com)


    # ## » BOOTCHART


    One of the major causes of longer boot times is that your system starts unnecessary
    tools and services during startup. But before you act them, it’s best to get a
    picture of what’s happening while your distro boots up. *Bootchart* is a simple
    utility that enables you to profile your Linux boot process and help measure the
    loading times of different services. It’s now merged with Systemd. Fire up a terminal
    and enter `systemd-analyze time` to know the breakup of the boot duration. Similarly,
    `systemd-analyze blame` will list all running units ordered by the time they took
    to start. To generate an image of the boot process, type `systemd-analyze plot
    > boot.svg`. From this image you can find all the active processes and can remove
    any you don’t need. For example, if you print occasionally, you can disable CUPS
    from starting at the boot time. Furthermore, the image also helps you spot processes
    that take control of all resources and force the other processes to wait, slowing
    boot up. www.bootchart.org


    # ## » GRUB CUSTOMIZER


    There are several reasons you might want to change the default boot loader behaviour
    and the *Grub Customizer* tool will help you do just that. The graphical tool
    can modify all aspects of the boot process and can even tweak the Grub screen
    looks. [https://launchpad.net/grub-customizer](https://launchpad.net/grub-customizer)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_173_1.png)


    Grub Customizer also helps restore when you’ve accidentally wiped clean the MBR.


    # ## REMMINA


    A very usable remote desktop client. *Remmina* supports a wide range of protocols.
    It performs well and offers useful features such as the flexibility to change
    the quality settings of the connection on the fly. [https://remmina.org](https://remmina.org)


    # ## INXI


    A CLI tool that lists info about the hardware in your computer. With *inxi* you
    can collate details about the kit, including vendor details, device driver configuration
    and more. [https://github.com/smxi/inxi](https://github.com/smxi/inxi)


    # ## POWERTOP


    Intel developed the *PowerTOP* utility to track down apps that eat up your laptop’s
    battery. The CLI utility offers suggestions to tweak power-guzzling tools to squeeze
    more juice from your laptop’s battery. [https://01.org/powertop](https://01.org/powertop)


    # ## STACER


    *Stacer* is a system monitor that helps you track different aspects of your installation.
    It can also show alert messages when values for a parameter exceed a certain threshold.
    [https://kuzuhannan.github.io/Stacer-Web](https://kuzuhannan.github.io/Stacer-Web)


    # ## LOGWATCH


    *Logwatch* parses, analyses and filters logs and then generates daily reports
    on your system’s log activity. The utility also enables you to control the level
    of the report’s verbosity. [https://sourceforge.net/projects/logwatch](https://sourceforge.net/projects/logwatch)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_173_2.png)'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# Internet tools


    Make your online time more efficient with this collection of utilities.


    # UGET


    By default, the lightweight **uGet** download manager relies on *curl*, but if
    you install the aria2 package, it can take on some more features, such as the
    ability to download torrents.


    **uGet** is an all-round downloader that has all the features you''d expect from
    a download manager. It features a download queue, can pause and resume downloads
    and also accelerates


    downloads by grabbing files from multiple parallel streams. Furthermore, batch
    downloads are one of its specialities. You can use the tool to prioritise the
    download queue and even regulate the speed of the downloads individually. **uGet**
    can also shut down and hibernate your computer once it''s finished downloading
    all the files. [https://ugetdm.com](https://ugetdm.com)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_174_0.png)


    # RAMBOX


    Most desktop distros ship with a default messaging tool that enables you to sign
    into multiple online messaging services. These tools can sign into only a handful
    of the popular services.


    In contrast, **Rambox** can plug into over 100 online messaging and email services.
    Every added service resides within its own tab, from where you browse the message
    history, write messages to your contacts, or use the other means of communication
    supported by the service. The tool will also display notifications. **Rambox**
    can also sync configurations if you use it on multiple computers. The program
    respects your privacy. Instead of storing your personal data, **Rambox** uses
    the `partition:persist` attribute of the `<webview>` tag to create a persistent
    connection with the signed-in service. You can also set a master password and
    ask the tool to lock itself after a predefined period of inactivity. [http://rambox.pro](http://rambox.pro)


    # BRAVE


    While popular browsers can be equipped to thwart information leaks. **Brave**
    ships with privacy-strengthening features. The Brave project promises two improvements
    over the competition: privacy and speed. One of them is achieved by blocking ads
    and trackers, which has the pleasant side effect of improving the browsing speed.
    [https://brave.com](https://brave.com)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_174_1.png)


    Since blocking ads may rob sites of revenue, Brave has some unique compensating
    tricks.


    # WALLABAG


    A read-it-later tool, **wallabag** began when Google Reader was shuttered in 2013.
    You can install it on your own server or use it via its own service that costs
    about $8/year. **Wallabag** has impressive features including the ability to save
    articles, filter them by reading time, and more. [www.wallabag.org](http://www.wallabag.org)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_174_2.png)


    # TOR BUNDLE


    Tor enables users to browse the web anonymously. Its goal is to prevent people
    from tracking you online. The **Tor Browser Bundle** includes everything you need
    to connect to the Tor network of relays including a customised version of Firefox
    known as the Tor Browser. [www.torproject.org/projects/ torbrowser.html.en](http://www.torproject.org/projects/
    torbrowser.html.en)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_174_3.png)


    The tool is available as a Snap and AppImage binary that you can use without installing.


    # MAGIC WORMHOLE


    A Python script that creates single-use encrypted channels to ferry files between
    computers across the Internet identified via pronounceable code. [https://github.com/
    warner/magic-wormhole](https://github.com/ warner/magic-wormhole)


    # UBLOCK ORIGIN


    The **uBlock Origin** browser extension is an ad-blocker that also blocks tracking
    servers, malware domains, and more. It''s available in the app stores of all mainstream
    web browsers. [https://github. com/gorhill/uBlock/](https://github.com/gorhill/uBlock/)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_174_4.png)


    # QUITERSS


    **QuitRSS** has all the features that you''d expect from a news reader. It can
    pull in RSS and Atom feeds, apply labels to each item and offers plenty of customisation
    options to boot. [https://quiterss.org](https://quiterss.org)


    # VOCAL


    A feature-rich podcast grabber, **Vocal** can subscribe to and stream podcasts
    on-the-fly or download them for offline listening. It integrates with popular
    desktops and has smart library management functions. [https://vocalproject.net](https://vocalproject.net)


    # UFTPD


    **uftpd** ships with defaults that work for most users. It''s designed for home
    users and developers who need a simple FTP server, but aren''t too particular
    about being secure. [http://troglobit.com/ projects/uftpd](http://troglobit.com/projects/uftpd)'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# FOSS


    # # Security tools

    Ensure ne''er-do-wells don''t get their hands on your system and files.


    # ## **ZULUCRYPT**


    While you can control access to the data on your computer using user accounts
    and file permissions, they aren''t enough to prevent a determined intruder from
    gaining access to your private files. The only reliable mechanism to keep your
    personal data to yourself is to encrypt it. Sure, working with encrypted data
    is an involved process, but it''ll go a long way in reinforcing your security
    and insulating your data.


    zuluCrypt is a graphical encryption tool that has an intuitive, easy-to-follow
    interface. Using the program you can create an encrypted disk within a file, a
    partition and even USB disks. It can also encrypt individual files with GPG. zuluCrypt
    can perform block device encryption, which means that it can encrypt everything
    written to a certain block device. The block device can be a whole disk, a partition
    or even a file mounted as a loopback device. With block device encryption, the
    user creates the file system on the block device, and the encryption layer transparently
    encrypts the data before writing it to the actual lower block device. While encrypted,
    the storage areas just appears like a large blob of random data and doesn''t even
    reveal its directory structure. All these functions and more are accessed via
    the excellent user interface. http://mhgomochnchu.github.io/zuluCrypt


    # ## **GUFW**


    Gufw is the graphical front end for **UFW**, the uncomplicated firewall, which
    is one of the easiest front-end for iptables. The tool has a simple interface
    and includes predefined profiles to regulate incoming and outgoing traffic. You
    can alter the profiles and per your requirements. You can also use Gufw to define
    specific rules for allowing traffic for individual apps and services. http://gufw.org


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_175_0.png)


    Switch to the Report tab to get the live network traffic report.


    # ## **BITWARDEN**


    The BitWarden password manager does end-to-end encryption and uses AES 256-bit
    as well as PBKDF2 to secure your data. It goes through this trouble because unlike
    its peers it stores your encrypted passwords in a remote Microsoft Azure cloud.
    The app can also import passwords from over 24 sources. https://bitwarden.com


    # ## **OSQUERY**


    You can keep an eye on your network using the osqueryCLI tool that enables you
    to query your devices just like a database. You can use the tool to check logged
    in users, keep an eye on the firewall, identify outdated kernels and keep an eye
    on the loaded kernel modules and the running processes. https://osquery.com


    # ## **STEGOSUITE**


    Steganography is the art of concealing data inside another seemingly harmless
    message or image. The most common mechanism for implementing it is by replacing
    unused data in regular computer files with bits of information that aren''t visible
    when viewing the original piece of data. Steganography is mostly used to complement
    encryption.

    Stegosuite is a graphical tool that can hide text messages as well as any type
    of file inside an image. Fire up the tool, select an image, point to the files
    you want to hide inside it and enter a secret key to burn it in the image. To
    get the secret files from the image load it once again and use the Extract button
    along with the secret key to grab the hidden files and message from the image.
    https://stegsuite.org


    # ### **MTR**


    MTR is a simple CLI network diagnostic tool that combines the functionality of
    the traceroute and ping utilities. As along with the path of the packet it displays
    a wealth of other relevant information. www.bitwizard.nl/mtr


    # ### **AIDE**


    You can use AIDE to help spot intrusions by checking the integrity of the files
    by comparing their properties such as permissions against a baseline database
    created on the initial run. http://aide.sourceforge.net


    # ### **NIKKO2**


    A CLI web server scanner that hunts for potential problems like server misconfigurations
    and outdated versions and version-specific issues. It can also perform automated
    tests against security vulnerabilities. https://cirt.net/Nikko2


    # ### **JOHN THE RIPPER**


    A password cracker, John the Ripper is used for exposing weak Unix passwords.
    It''s a CLI tool but also has a graphical interface called Jjohn that exposes
    its various command line options. www.openwall.com/john


    # ### **MALTRAIL**


    MalTrail is a malicious- traffic detection system that uses publicly accessible
    blacklists, custom user-defined lists and more to detect and log any malicious
    traffic. https://github.com/stamparm/maltrail'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# # Developer tools


    Make your coding life easier with this collection of capable utilities.


    # ### ATOM


    Atom describes itself as a hackable text editor. Developed by GitHub, the tool
    has a built-in package manager that enables users to search and install plugins
    from within it. About 80 plugins ship with the utility by default. One of its
    more interesting features is find and replace function that can also modify text
    across multiple files as you type. Atom can also be used as an IDE and one of
    its highlights is the smart autocomplete feature. There’s also a bracket matcher
    feature that highlights the line-number of the closing bracket corresponding to
    the one under your cursor. You can also define custom key bindings and add more
    functionality with packages for items such as mimaps and syntax-specific snippet
    libraries. [https://atom.io](https://atom.io).


    # ### BPYTHON


    A Python shell that provides modern IDE-like features inside a terminal window.
    You can start using it with the default settings and then customise it by editing
    its config file. The shell does code completion and will also display a list of
    expected parameters. It highlights syntax as you type and the Rewind feature checks
    the entire code, which is kept in memory.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_176_0.png)


    bpYthon enables you to save a session to a file, or even send it to pastebin.
    [https://bpYthon-interpreter.org](https://bpYthon-interpreter.org).


    # ### ETHERPAD


    Collaboration is key to any project. The Etherpad text editor enables users to
    collaborate on text in real-time. It runs inside the web browser and enables participants
    to interact via a text-based chat. It’s full of features and you can take it for
    a spin on its website. [http://etherpad.org](http://etherpad.org).


    # ### VIRT-MANAGER


    The Virtual Machine Manager is the open source graphical frontend for creating
    KVM-based VMs. It uses the qemu-kvm hypervisor, which is a version of the qemu
    machine emulator, and includes a VNC and SPICE client that displays a graphical
    console to the running VM. [https://virt-manager.org](https://virt-manager.org).


    # ### TURKEY APPLIANCES


    Installing network accessible software or web applications on a server can be
    quite a task because they require a lot of infrastructure software, which might
    take you hours to put together. From database servers to basic libraries, you’ll
    have to spend quite a while to assemble a fully functional web server before you
    can deploy an application on the network.


    Furthermore, if you plan to serve users from outside the network, you need to
    thoroughly examine your web server for any security leaks. This is a major undertaking
    in itself.


    This is where Turkey-Linux shines. Using its virtual appliances you can deploy
    a new server app in no time. Put simply, a TurnKey virtual appliance is a self-contained
    system that packs in a fully functional instance of a web app with just enough
    components of an operating system to power that tool. The system works straight
    out of the box and can be deployed on either bare metal or on top of virtual hardware.


    TurnKey Linux appliances are available in several formats depending on the hardware
    you want to deploy them on, from bare metal to OpenStack clouds. Importantly though,
    once they’re up and running, irrespective of the platform, they all give you the
    same interface to administer and manage the web app. [www.turnkeylinux.com](www.turnkeylinux.com).


    # #### OCLOTEL GUI


    The database client can connect and interact with a MySQL or MariaDB server. You
    can use it to create queries and it can highlight syntax and can fetch and display
    results from the database. [https://github.com/ocelot-inc/ocelotgui](https://github.com/ocelot-inc/ocelotgui).


    # #### DOXYGEN


    Use this CLI tool to generate HTML documentation from the comments in your code.
    The tool supports many programming languages and can cross-reference the documentation
    with the code for referrals. [www.doxygen.nl](www.doxygen.nl).


    # #### FINKF


    If you work with Java, C, C++ or Objective C, use infer to weed out bugs. The
    tool includes various analysis and its most interesting feature is that it can
    work across several procedures across various files. [https://fbinfer.com](https://fbinfer.com).


    # #### MARKTEXT


    The Markdown editor supports the GitHub markdown spec and the CommonMark spec.
    It has a live preview, several editing modes and inline Math support and can export
    documents. [https://marktext.github.io/website](https://marktext.github.io/website).


    # #### MANTA


    When you’ve completed a project, use Manta to generate invoices and receipts.
    The invoicing app has a clean interface and several templates that you can customise
    as per your requirements. [https://github.com/hq1287/Manta](https://github.com/hq1287/Manta).'
