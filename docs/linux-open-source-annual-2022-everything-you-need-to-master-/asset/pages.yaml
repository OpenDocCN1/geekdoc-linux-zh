    \ The culture of downloading and running random stuff from the web doesn’t exist.\
    \ It’s more secure. Ecosystem fragmentation works in its favour, making it hard\
    \ to target a particular distro,” they bellow.\n\nSadly, none of that is true.\
    \ Linux servers run most of the internet, there are billions of Android phones,\
