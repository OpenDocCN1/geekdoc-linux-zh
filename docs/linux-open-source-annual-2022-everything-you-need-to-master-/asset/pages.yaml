    site, say (/etc/nginx/sites-available/lxfmastodon.net.conf)


    # SOLID AND THE DECENTRALISED WEB


    Professor Tim Berners-Lee invented the World Wide Web, so when he announces that
    his invention "has evolved into an engine of inequity and division" (see https://medium.com/@timberners_lee/one-
    small-step-for-the-web-87f92217d085), people tend to listen. The professor and
    his team at MIT have come up with a plan to re-invent it. Built on top of the
    existing web, the Solid platform hopes to give users the ability to choose where
    their data is stored, who can see it and how it is used. Solid is a portmanteau
    of "Social Linked Data", and the idea of linked data is nothing new - Berners-Lee
    introduced it in 2006, alongside the idea of the semantic web. It enables published
    data to be contextually linked and sourced from external sources, so that it''s
    no longer beholden to a particular provider or application. If a new, better app
    comes along, then it can access and re-use the same data as its inferior predecessor.


    It''s an ambitious effort, but Solid isn''t the only projects aiming for a decentralised
    re-imagining of the web. ZeroNet, the SAFE (Secure Access For Everyone) Network
    and PiperNet all hope to achieve this in their own ways.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_141_0.png)


