  md: '# Into the libvirt


    Putting all the pieces together, we show you how to make your virtualisation faster,
    easier and safer.


    ou might gather by now that QEMU incantations can get quite unwieldy once you
    start avoiding defaults – so it’s common for people to store these in a script,
    or use some kind of frontend for QEMU. The modern way to wrangle this is with
    Red Hat’s Libvirt. This isn’t a frontend – we’ll meet Virtual Machine Manager
    soon, which is – but rather an API that provides access to virtualisation functions
    through its daemon, libvirtd. Libvirt supports a number of hypervisors, including
    KVM and VirtualBox.


    This might seem, to the layman, like adding another layer of complication on top
    of something that’s complicated enough. That’s a reasonable point; if you just
    want to set up a VM to try the occasional Linux distro, it’s easy to do with VirtualBox
    or any other friendly frontend. Where Libvirt comes into its own is with management.
    It can take care of storage (resize


    # >> KEEPING OUR VMS SAFE


    The CPU vulnerability can of worms that was opened in January 2018 with Spectre
    and Meltdown shows no sign of ceasing to spew its vulnerability worms everywhere,
    with new speculative execution vulnerabilities (CacheOut, Zombieload v2, LIDES
    and VRS) made public this year. These enable an attacker – albeit by pretty complex
    means – to access memory that they shouldn’t be accessing. One of the major concerns
    is that on a host running multiple VMs, such attacks could break the isolation,
    allowing one VM to read the contents of another’s memory – even memory protected
    by Intel’s secure enclave (SGX) tech.


    Cloud giants host billions of VMs on shared machines, some of which house sensitive
    data, so this is a grave concern. VMs and the hosts themselves need to have fixes
    applied and be rebooted in order to be safe, and if you rent a VPS your provider
    ought to have been in touch with you to tell you thus. If it hasn’t, you might
    want to consider changing. In the meantime, the RIDL Test Suite available at https://mdsattacks.com
    will tell you which flavours your VM is vulnerable to.


    One project that caught our eye as we scrolled to get this feature in to time
    was Bareflank, a hypervisor SDK. This project is funded by Assured Information
    Security and aims to enable rapid prototyping of new hypervisors. Bareflank was
    released in February. We’d encourage you to investigate further at https://github.com/
    bareflank/hypervisor.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_73_0.png)


    virtual disks or create pools), networking (no messing around with handcrafting
    network bridges) and, naturally, can create, start and stop VMs. To some extent
    it also abstracts the user out of the business of running the VMs, and this is
    generally good.


    Suppose we were running a VM in our favourite desktop environment and something
    crashed, forcing us to log out. On returning to that VM we’d probably find it
    in a sorry state, since the process running it (QEMU or VirtualBox) would have
    been wiped out.


    With Libvirt, VMs – known slightly confusingly as ‘domains’ – are run by a separate
    user, so if a local user’s desktop crashes while they’re playing with a VM, it
    stays running in the background and can be reconnected to. In this way it works
    much like connecting to a remote machine. In fact that’s another thing Libvirt
    does: enable VMs to be run from remote machines. The simple Boxes tool uses Libvirt
    behind the scenes to totally abstract away the difference, so through the same
    interface you can connect to a remote machine, a virtual machine, or indeed a
    remote, virtual machine.


    # Installing Libvirt


    We can install all the required bits in Ubuntu by installing the Virtual Machine
    Manager (aka virt-manager) frontend from the terminal with:


    ```

    $ sudo apt install virt-manager

    ```


    This will also install QEMU if you skipped the previous pages (shame on you),
    and enable the required services. It will also add your user to the libvirt group,
    but you’ll need to log out and back in before you can connect to said services.


    Start Virtual Machine Manager from the Applications menu, and it should automatically
    connect to Libvirt. You’ll get a permissions error if you didn’t obey the previous
    sentence. Click the Create new virtual machine button at the top left to start
    the wizard. Select ‘Local install media’, Use ISO image’, Browse’, ‘Browse local’
    (yes, it’s a bit long-winded) and choose an ISO file. We went with the desktop
    version of an Ubuntu 20.04 daily build this time.


    Virt-manager will try to guess which OS the medium is going to install, based
    on the name. This often doesn’t work, so clear the ‘Automatically detect OS’ box,
    and select Linux and Ubuntu 18.04; it doesn’t have to exactly match the guest
    OS, which is good as not everything is listed. Next, allocate some memory and
    CPUs to your VM: for a modern desktop distro, anything less than two cores and
    2GB of memory is probably going to be painful experience.


    Click Forward and choose the ‘Create a disk image’ option, remembering that virtual
    machines’ disks fill up as quickly as real ones. By default, images are stored
    in'
