- pgno: 16
  md: 'we’re impressed with the distinct lack of swamps. You may have run into PulseAudio
    issues in the past, or you may not see any reason to use Wayland over X11, but
    these technologies were invented to solve problems. And solve them they do. You
    might also be interested that PipeWire, Wim Tayman’s offering to unify media handling,
    is included by default in Fedora. PipeWire (see features LXF232) can now do pretty
    much everything Jack (the rather complicated interface for pro-audio set ups)
    can, and the next step is to have it take on the duties of PulseAudio too.


    If you’ve ever run Linux on a machine with not enough memory, you’ll know that
    things can get very unpleasant very quickly. Apart from the slowness of using
    spinning-rust based swap space (which is not an option on some systems), you might
    find yourself at the hands of the OOM (out of memory) killer. Applications will
    be slain more or less arbitrarily. Even worse though, is when OOM can’t react
    quickly enough and your desktop grinds to a halt. You can’t move the mouse pointer,
    you can’t switch to a virtual terminal, you probably can’t even SSH in to kill
    things manually. We’ve run into this memory-pressure situation a few times when
    running one too many virtual machines. Like when you’re writing a big feature
    about lots of distros and then it makes it late (Are you saying the QOM-killer
    ate your homework? – Ed). Anyho… Fedora 32 includes the EarlyOOM daemon, which
    should step in before it’s too late.


    Fedora goes much further than the desktop. Naturally it has a server offering,
    and we’ve already mentioned its Flatpak- and container-focused Silverblue desktop
    effort. But since Red Hat purchased CoreOS in 2018, it’s now in charge of the
    distro formerly known as CoreOS Container Linux, now dubbed Fedora CoreOS. This
    will very likely be the future for managing container-based workflows securely,
    and in particular massive server deployments. And from the very big to the very
    small, in the form of Fedora IoT, its offering for the tiny things that will be
    running our cities and lives in the coming years.


    # A clear winner


    One distro we haven’t covered much, but perhaps should, is Intel’s Clear Linux.
    This is aimed at professionals using Intel hardware to do advanced things with
    container and cloud technologies. In its own words it’s ‘not intended to be a
    general-purpose Linux distribution’. Be that as it may, it consistently scores
    favourably in Phoronix’s stress benchmark comparisons and a desktop edition is
    available so you may want to have a gander. Clear Linux abstracts application
    packages into the concept of Bundles, which enable a bunch of related programs
    to be installed at once. Since Clear Linux has its own repository you might not
    find your favourite applications, but this is exactly part of the problem Flatpaks
    aim to solve, and installing the Flatpak bundle is easy.


    Clear Linux bundles use compiler optimisations, enabling AVX512 vector instructions
    on suitable endowed hardware. So, for example, if you’re running TensorFlow, you’ll
    benefit from kernel tuning, AVX routines in Glibc, AVX optimisations in Python,
    tweaked NumPy/Pandas modules and finally optimisation at the very top of the stack
    in Tensorflow’s Eigen company.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_16_0.png)


    Clear Linux uses a stateless design concept so the whole OS can be effectively
    factory reset by clearing /etc and /var. This doesn’t work on older distributions
    so please don’t try it. But do try all of the distros we’ve mentioned here, and
    feel free to shout at email us for not mentioning your favourite next-generation
    offering.


    # WHAT ABOUT ARCH?


    Arch users may be shocked to find their distro of choice not mentioned in this
    page on new technology, and perhaps they have a point. But then so too might Gentoo
    or Linux from Scratch users, who also have access to the latest versions of everything,
    and can also compile it with whatever optimisations suit their CPU. We’ve focused
    instead on what distros offer out of the box, and with Arch, and more so with
    Gentoo, well, you barely get a box. Be that as it may, Jonni uses Arch, and so
    should you.


    Manjaro did the unthinkable and made Arch Linux easy to use, and continues to
    be one of the most popular desktop distros around. Manjaro doesn’t (directly)
    use the same repositories as its progenitor, since things move quickly on Arch,
    and Manjaro has a release cadence to follow (and a desire not to break its own
    packages). So you won’t find quite the same bleeding-edge versions as you would
    in Arch, but the selection will be far from stale. And bugs that may have found
    their way into the stable Arch repos will have been ironed out by the time they
    reach Manjaro. We like that Manjaro is getting the Xfce desktop some attention.
    Lightweight doesn’t have to mean light on features. And if you want a beautiful
    take on KDE’s Plasma desktop you can also get that through Manjaro’s Plasma edition,
    which we snuck onto our virtual DVD last month.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_16_1.png)'
