    \nThe Envelope tool lets you make smooth and continual transitions to volume over\
    \ time, such as a long fade-out.\n\nif it starts clipping. Depending on your underlying\
    \ audio system, you may be able to turn the recording levels back down with the\
    \ slider in the top-right of the window.\n\n# Running tracks\n\nRecording a piece\
    \ of audio is great, but you can do that on just about anything. What makes Audacity\
