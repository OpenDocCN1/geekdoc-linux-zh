  md: "or dfn on your system. The search command will show you hits in any of your\
    \ configured for the keyword that you provide:\n\n```\n$ flatpak search calibre\n\
    ```\n\nThis will return a result for the excellent Calibre e-book manager, which\
    \ is often out of date in the Ubuntu repositories. Note the first column, which\
    \ gives the Application ID in a sort of reverse-domain format (com first, then\
    \ domain, and so on). You'll need to give this to the install command for Flatpak\
    \ to install your program:\n\n```\n$ flatpak install com.calibre.ebook.calibre\n\
    ```\n\nAt this point Flatpak will start downloading and installing your application\
    \ and any runtimes (org. freedesktop — see the screenshot, below right) it requires.\
    \ A runtime is a collection of libraries and other software for the application.\
    \ It's the Flatpak way of resolving your dependencies for you.\n\n“Wait,” you\
    \ might say, “isn't this what apt and yum do for me”? It's a fair question. There\
    \ are a few notable factors that set runtimes apart from normal Linux dependency\
    \ management.\n\n+   - Flatpak’s sandbox environment ensures anything you install\
    \ won’t conflict with your system proper.\n+   - A runtime is a fixed set of software,\
    \ so you know you’ll get exactly you need to run the app — no more, no less.\n\
    +   - Flatpaks are built against specific runtimes, so there’s no need to worry\
    \ about upgrades breaking your program all at a sudden.\n+   \n+   The trade-off\
    \ boils down to confidence that the program will always have what it needs to\
    \ run as intended, but note that it’ll need to take up more disk space to do so.\n\
    \nThere are a couple of other methods you can use to install applications. If\
    \ you happen across a rogue Flatpak and download it, install it from the command\
    \ line using the command above:\n\n```\n$ flatpak install somefile.flatpak\n```\n\
    \nFinally, Flatpak provides a method for installing an application by running\
    \ an installation file. This file, called a flatpakref, contains some metadata\
    \ about the program, including:\n\n+   - Its full name.\n+   - The hub from which\
    \ it should be downloaded.\n+   - Its version.\n+   - Whether it is a runtime\
    \ or not.\n+   - Its GPG signature.\n\nInstalling from a flatpakref file is the\
    \ same as installing from a locally downloaded Flatpak file:\n\n```\n$ flatpak\
    \ install/somefile.flatpakref\n```\n\nYou can also use a GUI package manager,\
    \ which should display and install Flatpaks in the same way it does other packages\
    \ (provided that you installed the backend).\n\n# Running Flatpak programs\n\n\
    Once your program is installed, you can launch it from the command line as follows:\n\
    \n```\n$ flatpak run com.calibre.ebook.calibre\n```\n\nOnce the program starts\
    \ up, there are a couple of things you'll notice. The first is that you'll have\
    \ access to all your normal $HOME directory files. “But, but,” you'll ask, “I\
    \ thought the Flatpak sandbox was isolated from the rest of the system?” That's\
    \ very astute of you. However, running a program that can't interact with your\
    \ files isn't very useful. The Flatpak developers have worked around this.\n\n\
    You should also see entries for the application show up in your desktop's menu.\
    \ If you don't see them, check the Quick Tip (left) for how to try and fix this.\
    \ Actually, under most circumstances, you shouldn't be able to tell the difference\
    \ between these programs and those provided by your distribution. You can operate\
    \ on your files, play multimedia files, and generally use them as a “normal” program.\n\
    \n# Managing your Flatpak installs\n\nOnce you have a Flatpak or two installed,\
    \ you can, of course, use your GUI package manager to administer them. But if\
    \ you prefer the terminal, some of the below commands will be useful. You can\
    \ list the Flatpaks (both apps and runtimes) you have installed with the following\
    \ command:\n\n```\n$ flatpak list\n```\n\nThe result displays not only the installed\
    \ modules, but also their installation type (system/user). You can update all\
    \ your Flatpaks with a single command, just like native package managers:\n\n\
    ```\n$ flatpak update\n```\n\nIn the event you need to remove a Flatpak, enter\
    \ the following at the prompt:\n\n```\n$ flatpak remove [full-qualified app name]\n\
    \nIf you need to remove one of the hubs you've configured, you can do so with\
    \ the following:\n```\n\n```\n$ flatpak remove-remote [name of remote]\n```\n\n\
    # Conclusion\n\nThe benefits of the Flatpak format are numerous. It provides developers\
    \ with an option to target multiple distributions, while giving users multiple\
    \ tools to install the resulting applications. It enables programs to access the\
    \ resources they need, while restricting them from the things they don't. It works\
    \ around some of the dependency problems of traditional packaging formats, at\
    \ the expense of a little disk space. Finally, it opens up opportunities for developers\
    \ to wrap up applications that are traditionally tedious to install in a format\
    \ that's drop-dead simple.\n\nSo if you want to try out the cutting-edge version\
    \ of LibreOffice or run a Wine-based game like World of Warcraft, give Flatpak\
    \ a try. You really can't go wrong! [LF]\n\n# Quick Tip\n\nIf you run the ls /\
    \ command when a Flatpak is running and don't see any difference, run the following:\n\
    $ flatpak run --command=sh org.librefbox. LibreOffice This will start a shell\
    \ within your app's sandbox. Now if you run ls / you should see directories such\
    \ as /app.\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_112_0.png)\n\n+   - Flatbud\
    \ 73d612F12881\n+   - Flatbud 550718ccb41b0b\n+   - Flatbud 431c685f1c0\n+   -\
    \ Flatbud 575363e08682\n\n+   - Like traditional package managers, Flatpak will\
    \ download and install Calibre and the runtimes on which it depends."
