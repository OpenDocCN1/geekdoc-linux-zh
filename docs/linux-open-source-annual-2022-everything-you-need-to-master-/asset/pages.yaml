- pgno: 56
  md: "private network and the Red network refers to the one connected to the internet.\
    \ In practice (if you're not using IPFire on a machine that connects directly\
    \ to your ISP) these will both connect via your home router, but your Green network\
    \ interface will connect (via crossover cable, wireless or another router switch)\
    \ to the machines you want IPFire to protect. The idea is that traffic can flow\
    \ from Green to Red, but not the other way.\n\nIP addresses must be set up for\
    \ the network devices under IPFire's control. In the configuration described above,\
    \ where we have a secure network 'underneath' our home LAN, the Red interface\
    \ ought to conform to the rest of the LAN, so could be in the form of 192.168.0.something,\
    \ and the Green interface can technically be anything you want, but it's sensible\
    \ to use another designated-private address such as 10.0.0.1 or (192.168.1.1 if\
    \ you prefer). The Red interface (in this setup) can be set to receive an IP address\
    \ via DHCP, which offers the easiest setup, but you'll probably want to configure\
    \ a static IP later otherwise you'll be chasing your IPFire instance after a reboot.\
    \ Static IP will require you to set the gateway to that of your home router. If\
    \ you're running IPFire virtually then DHCP will use your hypervisor's NAT network,\
    \ which should work fine.\n\nUnless you want to mandate anyone using your private\
    \ network use Static IP, the Green interface will need a DHCP server. Turn this\
    \ on and use the following settings (or something like them):\n\n+   - Start address:\
    \ 10.0.0.2\n+   - End address: 10.0.11\n+   - Primary DNS: 10.0.0.1\n\nIf you're\
    \ using *libvirt* or *Virtuabox*, this won't work since the virtual NAT device\
    \ has its own DHCP server, which will get in the way. So you'll have to set up\
    \ Static IP addresses for the VMs you want IPFire to protect here. For desktop\
    \ distros, this is most easily achieved by setting a static IP configuration in\
    \ Network Manager (see screenshot). For a physical machine you can connect to\
    \ the Green interface IPFire host by direct cable connection (older 100mbit cards\
    \ need a crossover cable, gigabit Ethernet cards do not) or via a switch.\n\n\
    This should be all you need to complete the initial setup of the IPFire instance.\
    \ You should be able to\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_56_0.png)\n\
    \nconnect to IPFire from that machine by browsing to https://10.0.1.444. The first\
    \ thing you'll see is a nasty security warning, because IPFire uses a self-signed\
    \ certificate. You can safely ignore this, we promise. The next thing you'll see\
    \ is a login box, into which you should identify yourself as *admin* using the\
    \ password you set up earlier. Then you'll be presented with IPFire's intuitive\
    \ web interface.\n\nBy default IPFire forwards DNS requests to the DNS server\
    \ on the Red interface, which is probably your ISP. via your home router. You\
    \ may wish to use a public service for this, such as CloudFlare's 1.1.1.1 or Google's\
    \ 8.8.8.8. This you can do by heading to Network > Domain Name System. Uncheck\
    \ the Use ISP-assigned DNS box, and click the Add button at the top. Only an IP\
    \ address is required.\n\nWe'll set up a simple rule to allow the Red network\
    \ to access the web interface on to the host. This is not something you'd want\
    \ to do in real life, but it serves to show the procedure for adding rules. Go\
    \ to Firewall >\n\n> # IPIRE DEFAULT FORWARDING\n> \n> “IPFire forwards DNS requests\
    \ to the DNS server on the Red interface, which is probably your ISP, via your\
    \ home router.”\n\nFirewall Rules and click the New Rule button. In the Source\
    \ section, select the Standard Networks option and choose RED. Check the Use NAT\
    \ box below and choose Destination NAT. In the Destination section select the\
    \ Firewall option and choose GREEN - 10.0.0.1. In the Protocol section choose\
    \ TCPm, select Any in the Standard Networks dropdown, and in the Source section\
    \ enter 444 in the External Port box. In the Additional Settings box, you can\
    \ choose to log, limit, or rate-limit these connections, but we won't trouble\
    \ ourselves with that, so just click Add. Click Update, then you should be able\
    \ to connect to IPFire's web interface from anywhere on your LAN.\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_56_1.png)\n\
    \nFirewall rules look simple with IPFire, and the IPFire interface looks lovely\
    \ in the Ubuntu 20.04 daily images."
