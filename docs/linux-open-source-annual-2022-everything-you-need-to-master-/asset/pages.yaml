  md: '# FOSS


    free on gog.com). New features (more bug fixes) are being added all the time,
    so check out the project’s GitHub at https://github.com/scummvm/scummvm.


    In 2002 LucasArts sent a cease and desist letter to the ScummVM team, but in the
    end (the process took about four years) the two parties came to an agreement whereby
    the project could continue. After this, engine reimplementation began to be recognised
    as a non-infringing activity, and further discussions with rights holders were
    largely positive. Revolution Software and Adventure Soft even provided source
    code to help support the engines used by their games. Two-thirds of the 25-year
    anniversary edition of the Myst trilogy are powered by ScummVM (Myst III is powered
    by ResidualVM, which reimplemens its Sprintr engine, as well as GrimÉ, the successor
    to SCUMM used in The Curse of Monkey Island and Grim Fandango). You can read more
    about ScummVM at www.pcgamer.com/how-scummvm-is-keeping-adventure-games-alive-one-old-game-at-a-time.


    As you might imagine, it’s generally illegal to redistribute assets from commercial
    titles. The box on the previous page goes into more detail, but suffice to say
    you’ll want to hold off downloading anything from random websites. Back in July
    2018 popular emulation sites LoveROMs and LoveRETRO found themselves on the receiving
    end of what’s likely to be a very expensive lawsuit from Nintendo. Prompted by
    these legal actions, the popular EmuParadise (www.emuparadise.me) removed all
    download links from its site.


    Many games are referred to as ‘abandonware’, which refers to them no longer being
    sold or supported by their original manufacturers. This term doesn’t offer any
    legal protections, though: copyright holders may be pragmatic and choose to not
    worry about infringement, they may even offer titles for free if enough people
    ask nicely. Or they can be like Nintendo and have a whole page dedicated to how
    hard it will come down on you if you don’t respect its property (www.nintendo.com/corp/legal.jsp).


    circles as Tiberian Dawn) in 2007 EA released the original ISOs as freeware. To
    celebrate its next anniversary (and also the release of Red Alert 3) in 2008 EA
    released the original Red Alert and Tiberian Sun ISOs as freeware. It no longer
    hosts these, but has stated that it’s happy for others to redistribute them. As
    a result, OpenRA can find and download all the required files (sans music and
    video cut scenes) to play these three titles if you don’t have the original install
    media. In OpenRA parlance, the games the engine brings back to life are known
    as mods. The OpenRA project has embraced new packaging formats so you can download
    Approximates of the official mods straight from www.openra.net. These downloads
    come in two flavours: stable releases and playtests. The latter are previews featuring
    the latest engine developments, and so may not be as stable as the former.


    Besides the official mods, a number of community offerings are available (see
    www.moddb.com/games/openra/mods). Work is underway to decouple the OpenRA engine
    from the official CnC mods that it powers, so that it can be used as a general-purpose
    real-time strategy engine. The project already provides utilities such as a map
    editor and a Source Development Kit (SDK) to help budding developers build the
    games of their war-like dreams. Readers may also remember the Krush Kill n’ Destroy
    games of the late 90s. Those readers may be thrilled to hear that work is underway
    to revive those post-nuclear war titles using the OpenRA engine.


    Another related project is CnCN, which has been around since 2009. They provide
    launchers that enable the CnC series (including all expansions and mods) to be
    played exactly as their fans remember, with the added bonus of internet play.
    Recently, it supplemented CnC’s DirectDraw renderer, in GDI (for newer versions
    of Windows) and OpenGL (for Wine players). CnCN supports the titles released for
    free, as well as Tiberian Sun (OpenRA is working on this one), Red Alert 2 and
    Yuri’s Revenge. Linux packages (for Fedora, Debian, Ubuntu and even Arch and derivatives)
    are available for the free CnC titles. These are just scripts that set up an appropriate
    Wine preface and download the game files and the CnCN launcher.


    The other titles supported by CnCN are only available through EA’s Origin platform
    as part of the Command & Conquer Ultimate Collection (priced at £25), but getting
    Wine and Origin to play nice together can be tricky. You may be better off seeking
    out optical media for those, which the CnCN launcher is more than happy to work
    with.


    The original Westwood Online servers were transitioned to the community-run, EA-sponsored,
    XWIS server in 2005, which is still alive today. The newer CnC titles ran on GameSpy
    servers that were shut down in 2014. This shutdown affected a huge number of titles,
    many of which moved to other networks. The CnC titles moved to the C&C:Online
    (https://cnc-online.net), where they are alive and well today.


    # The spice must flow


    For OpenRA, the re-implementation of the classic Command and Conquer (CnC) engine,
