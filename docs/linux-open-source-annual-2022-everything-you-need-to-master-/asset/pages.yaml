- pgno: 159
  md: '# Roundup


    Gimp >> Rawtherapee >> Darktable >>

    Lightzone >> Pixeluvo


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_159_0.png)


    Alexander Tolstoy

    likes nothing better

    than rolling up his

    metaphorical sleeves

    and seeing what new

    gems the open source

    community has to offer.


    # Photo editors


    Keen photographer **Alexander Tolstoy** keeps his imperfect snaps, for

    fixing later, using some of the best photo editors available for Linux.


    # HOW WE TESTED...


    Editing photos isn''t the same

    as editing general images.

    Therefore we decided to

    compare some of the best

    photo editors for Linux with a

    focus on fixing common faults,

    enhancing colours and lost

    details that might be

    considered gone for good.

    The aim here is to help you

    select the most feature-packed

    and practical software that can

    bring dull images back to life.

    We''ll take a closer look at their

    advanced features, such as

    automatic enhancements, the

    ability to fix dull, blurry, under-

    or over-exposed images and,

    of course, whether or not they

    handle RAW files.

    It''s not the first time we''ve

    run a Roundup on image or

    photo editors, but this current

    group includes a different

    selection of software. Four out

    of the five are open source

    tools (although **Lightzone** had

    been a proprietary application

    in the past). The fifth is a

    commercial option, which is

    perhaps less known to the

    reader, but should be of great

    interest to photo-editing

    enthusiasts. Read on to

    find out more!


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_159_1.png)


    **W**hen it comes to selecting a photo

    editor, there''s plenty of choice. There

    are general-purpose editors like

    **Gimp** or **Pinta**, image library managers with

    editing features, such as **Digikam** or **Shotwell**,

    and finally there''s software for digital artists

    (think **Krita**). Our interest lies in fixing photos

    and processing RAW files, so we grabbed

    **Gimp** with its set of built-in effects, **Ufrav**

    plugin, and lots of third-party plugins from FX

    Foundry and G''MIC. Then we included


    **Darktable** and **Rawtherapee** – two classic

    darkroom editors with tools for dragging out

    barely visible details. **Lightzone** is similar to

    these two programs, but has a more

    consumer-friendly interface. Last but not

    least is **Pixeluvo**, a paid-for program with a

    limited set of editing features.

    **Gimp** is the only contender that doesn''t

    use a dark UI theme by default. Although a

    dark theme adds a ''pro'' feel to the program,

    ''pro'' feel to the program, it won''t hide the truth in our **Roundup**!'
