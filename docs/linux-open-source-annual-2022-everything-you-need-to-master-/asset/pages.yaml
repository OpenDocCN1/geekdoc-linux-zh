  md: "# # Ease of use\n## Spotlight on productivity.\n\nExcept in the case of a very\
    \ poorly designed interface, where commonly used functions might be several levels\
    \ down in the directory structure and there are no icons to act as shortcuts,\
    \ regular users will eventually get up to speed with any software. Admittedly,\
    \ you’ll learn some packages more quickly than others, but there’s more than an\
    \ element of truth to the suggestion that it’s the software with fewer features\
    \ that will fare better in this respect.\n\nFor these reasons, our appraisal of\
    \ ease-of-use has considered a lot more than a potentially subjective assessment\
    \ of the user interface. In particular, and especially for the more fully-featured\
    \ packages, we have given consideration to resources such as the user documentation\
    \ and tutorials.\n\nWe found that we could use Google Drawings almost immediately\
    \ without referring to Help, but primarily that was because it’s by far the simplest\
    \ in terms of its functionality. All the others, by necessity, have a more complicated\
    \ user interface because of their richer set of features. Having said that, despite\
    \ it probably being the most fully featured, we didn’t find Inkscape the hardest\
    \ to use, but we recognise that this view might be somewhat subjective.\n\nTurning\
    \ to educational and reference material, all the software has official documentation\
    \ in the form of a user guide, while LibreOffice Draw also offers a Getting Started\
    \ guide. Documentation differs significantly in how extensive it is, with the\
    \ Google Drawings guide being much shorter than the others, although this is hardly\
    \ surprising, given its fewer features. By way of contrast, the Inkscape website\
    \ refers to several manuals and books, albeit not all free. All the packages except\
    \ for Google Drawings also provide online tutorials, mostly textual, although\
    \ Gravit has no fewer than 13 official YouTube video tutorials. Vectr has a particularly\
    \ impressive set of 29 text tutorials, some concentrating on features, others\
    \ on common applications. So far, we’ve referred only to official user documentation\
    \ or, in some cases, third-party documentation that is officially sanctioned by\
    \ being linked from the publisher’s website. You’ll find a wealth of other third-party\
    \ video guides and tutorials for all this software, even Google Drawing, but we\
    \ haven’t reviewed these because, by their nature, they’re likely to come and\
    \ go.\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_154_0.png)\n\n+   **VERDICT**\n\
    +   *   GOOGLE DRAWINGS **7/10**\n+   *   GRAVIT DESIGNER **8/10**\n+   *   INKSCAPE\
    \ **8/10**\n+   *   LIBREOFFICE DRAW **6/10**\n+   *   VECTR **8/10**\n+   \n\
    +   On balance, *ease-of-use* is **good** across the board.\n\n# # Licensing\n\
    ## Examining the small print.\n\nAll our chosen software is free. This choice\
    \ was made partially because the highly respected Adobe Illustrator and CorelDRAW\
    \ aren’t available under Linux, but also to illustrate the fact that you can get\
    \ performance comparable to these leading commercial packages without spending\
    \ several hundred pounds. In other respects, though, there are differences between\
    \ our five packages.\n\nFirst of all, they’re not all open source which, while\
    \ probably not deterring users who just need to create good quality graphics,\
    \ will be an issue for more technically minded users with more ambitious aims.\
    \ Inkscape and LibreOffice Draw are open source, the others are not. In addition,\
    \ in order to use any of the three which are not open source you’ll need to create\
    \ an account with the publisher. In the case of Google Drawings, that’s just a\
    \ general Google account which you might already have.\n\nThe situation with Gravit\
    \ might be a concern to some potential users. The product has now been sold to\
    \ Corel and, while the basic version of Gravit Designer remains free to use, it\
    \ has now been joined by Gravit Designer Pro (for which you get a 14-day free\
    \ trial when you sign up) that costs £75/$99 per year. Gravit say it has no plans\
    \ to discontinue the free version, but questions remain. For example, might some\
    \ of the features of the free version become available only in the Pro version\
    \ – or will new features only be offered if you’re prepared to pay for them? It\
    \ undermines confidence in the long-term functionality.\n\n+   **VERDICT**\n+\
    \   *   GOOGLE DRAWINGS **7/10**\n+   *   GRAVIT DESIGNER **5/10**\n+   *   INKSCAPE\
    \ **10/10**\n+   *   LIBREOFFICE DRAW **10/10**\n+   *   VECTR **7/10**\n+   \n\
    +   Only two packages are open source and, while all are free, Gravit has commercial\
    \ aspirations.\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_154_1.png)"
