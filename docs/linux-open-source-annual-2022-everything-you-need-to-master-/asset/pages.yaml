- pgno: 52
  md: '# # The state of Linux security


    Linux provides more security features than you can shake a stick at – more often
    than not it’s users that are a weak point.


    M ainstream Linux distros provide a huge amount of security features out of the
    box. **Some have been around for a long time** (address space layout randomisation,
    having services drop root privileges when they don’t need them, mounting removable
    drives with the noexec option so they can’t launch binaries) and some are quite
    new (**Spectre and microdata sampling protections**).


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_52_0.png)


    A few desktop Linux distributions (Ubuntu, Mint, Solus, Pop!\_OS) offer full disk
    or home directory encryption out of the box, to which we’d highly recommend you
    do on your laptop, and if you’re handling sensitive data it’s worth considering
    on your desktop too. Fedora (and its commercial cousin RHEL) enforces SELinux
    accounting, which takes permissions and access control lists (ACLs) to a new level,
    sandboxing apps with fine-grained configurations. AppArmor on Ubuntu does much
    the same.


    Disk encryption is usually done through LUKS and device mapper, and will secure
    data at rest. However, once the encryption password is entered, that data is (physically)
    accessible as long as the device remains turned on. With home directory encryption,
    $HOME is usually unlocked until you log out. Similarly, personal data on modern
    mobile devices is protected by a PIN code, pattern or fingerprint. This is why
    when the FBI or


    > > In awe of this guy''s (presumably inadvertently) internet accessible NAS that''s
    just full of source code for various companies he''s contracted for

    > > 29 people are talking about this

    > > 195 4:30 PM · Mar 12, 2020


    NCA or another three-letter organisation suspects you’ve been using your devices
    for no good, they tend to swoop in and grab those off you while you’re using them
    so that they’re unlocked. Then a USB dongle is usually fitted, which sends benign
    keystrokes to ensure the device stays awake and doesn’t lock. Usually a power
    source is connected too, as that would be embarrassing.


    > > We do love pie charts, especially when they tell us no one''s trying anything,
    particularly crafty to breach our IFFire defences.


    Most new software is installed with a safe, sane configuration, but default usernames
    and passwords are still common. More often than not users have to tweak initial
    configurations to suit their requirements, and these tweaks only get as far as
    making the thing work, not making the thing secure. Where this is most dangerous
    is running services, because you’ve pretty much inviting the world to use your
    machine. You may want the world to see your website, but you don’t want to allow
    them to abuse the machine running it. On the desktop, web browsers and email clients
    are the main conduits for nasties, and we tend to cover those in our privacy-centric
    features. Over the page we’ll show you how to change your password habits with
    a hardware key, and how to use *IFFire* to protect your home networks. As for
    servers we’ve got all kinds of tips.


    ! If you leave your NAS open to the internet, you better hope it’s someone nice
    like Matthew Garrett who finds it.


    # ## UEFI AND SECURE BOOT


    When UEFI was introduced to address the diverse and varied shortcomings of using
    BIOS to initialise hardware, it was met in some circles with a chilly reception.
    Most of this centred around UEFI’s Secure Boot extension, which at the time made
    it hard for consumers to replace Windows 8 (which at the time was being shipped
    on new machines), or even boot a Linux distro. Much of that criticism was unjust.
    Secure Boot is meant to enable administrators to limit


    which bootloaders can run and which kernels they can boot.


    Most x86 hardware ships with Microsoft’s Secure Boot public key pre-baked in,
    which permits booting only Microsoft-signed bootloaders. Some Linux distros provide
    a boot manager signed by Microsoft – there are two approaches here, Fedora’s Shim
    (also used by Ubuntu and a few others) and the Linux Foundation’s *PreLoader*.
    So these will work fine with Secure Boot,


    but some other distros will require it to be disabled. If you have full control
    over Secure Boot though, you can enrol your own signing key into the firmware
    and allow booting for only those OSes you deign worthy.


    If your machine has a TPM chip, you can use this to store, for example, LUKS disk
    encryption keys. These can be verified against a register in the TPM, so that
    if another OS is securely booted the disk still won’t be unlocked.'
