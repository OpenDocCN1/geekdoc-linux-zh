  md: '# # VIRTUALISE

    ## ALL THE THINGS


    Fed up with breaking Linux installs, and Linux installs breaking him, **Jonni
    Bidwell** looks to virtualisation to ease his very real woes.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_67_0.png)


    +   W

    +   Without virtualisation, life at Linux Format towers would be a lot more complicated.

    +   Testing DVDs would be a nightmare, reviewing new distros would require us
    to wipe the machine on which we installed previous distros, and if we wanted to
    test new software on different distros, we’d probably need yet more hardware and
    yet more time. Yet if you rewind back to the late Mesolithic LXF age – the early
    2000s – these were exactly the kind of hardware logistics that the team had to
    wrangle, all the while living the wild lifestyle encouraged by the heady golden
    era of dead-tree publishing. Back then tech journalists were made of stronger
    stuff.

    +   Nowadays things are much more straightforward. If you want to try a new OS,
    or even if you just want to do something a bit crazy with your current one, all
    you need do is fire up a virtual machine, and within minutes you have a device
    that for all intents and purposes behaves like a regular computer. Only you don’t
    need to worry about breaking it – anything you do can be undone, and no one will
    come at you with pointed questions/sticks if it breaks.

    +   For beginners, a virtual machine is a great way to try Linux. You can run
    VirtualBox for free on Windows or macOS. If you’re already running Linux you may
    prefer to use Red Hat’s Virtual Machine Manager, which uses QEMU (an emulator)
    and KVM (Linux’s powerhouse of a hypervisor) behind the scenes. Whatever your
    tastes, we’ve got something for you.'
