- pgno: 167
  md: '# # Image tools


    Check out these nifty options for managing or editing your image collection.


    # ## PENCIL 2D


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_167_0.png)


    You can use *Pencil 2D* to create both static and animated drawings. It''s a comprehensive
    program that will help digital designers create professional-grade cartoons and
    animations in multiple layers. The intuitive tool is well complemented by the
    video tutorials on its website. [www.pencil2d.org](http://www.pencil2d.org)


    # ## DARKTABLE


    If you work with RAW images, *darktable* will help you create a professional digital
    darkroom to process them. The tool''s interface gives you access to a full gamut
    of image manipulation and editing tools on par with commercial heavyweight apps
    like those from Adobe and Apple. [www.darktable.org](http://www.darktable.org)


    # ## FOTOTXX


    A comprehensive image-manipulation program with a rich set of retouch and edit
    functions that go beyond changing brightness, contrast and colour. Like most dedicated
    image editors, *Fototxx* enables you to select an object or area within an image
    using various tools such as freehand outline, follow edges and select matching
    tones. Another


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_167_1.png)


    You can use Fototxx on resource-strapped machines and the program can be navigated
    entirely with the keyboard.


    nique feature of the tool is that it makes it possible to edit the images without
    using layers. You can also use Fototxx to create HDR and panoramic images, reduce
    noise and remove dust spots, create collages, mashups, and slideshows with animations.
    There are also several artistic effects to help convert a photo into a line drawing,
    sketch, painting, embossing, cartoon, dot image, or mosaic.


    On the initial launch, Fototxx fires up its quick start guide in the web browser,
    along with a dialog to index your image library. This process can take some time
    depending on the number of images you have in your library. All its features can
    be accessed from the relevant options that are clearly labelled in the left-side
    panel. [https://kornelix.net/fototxx/fototxx.html](https://kornelix.net/fototxx/fototxx.html)


    # ## RAPID PHOTO DOWNLOADER


    This program might seem redundant considering that most photo-management tools
    can import photos themselves. *Rapid Photo Downloader*, however, is designed for
    transferring photos and videos. It offers a lot more functionality that make it
    a perfect tool for downloading, processing and organising photos and videos.


    The tool gives you control over how it processes and sorts the downloaded photos.
    The program''s default rules automatically transfer the downloaded photos inside
    date-based subfolders.


    You can also define custom rules as per your requirements. For example, you can
    ask the program to sort photos by their type, which comes in handy if you shoot
    both RAW and JPEGs. In fact, you can create complex subfolder hierarchy by defining
    naming rules based on Exif values, such as focal length, ISO, and so on. You can
    also specify an external USB storage device as the back-up destination, and the
    program will automatically back up the photos while downloading them from the
    camera.


    [https://damiennynch.net/rapid](https://damiennynch.net/rapid)


    # ## CONVERSEEN


    Converseen is a straightforward frontend to various command-line conversion utilities
    that can convert images to and from over 100 formats, rotate and flip them, change
    their dimensions, and rename them in a fraction of the time it would take to perform
    these tasks manually.


    [http://Converseen.tasterland.net](http://Converseen.tasterland.net)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_167_2.png)


    # ## FROGR


    Use this tool to upload content to Flickr, and also access its basic upload features
    such as the ability to describe images, set specific licenses and categorise them
    into sets and group pools.

    [https://mariospr.org/category/frogr](https://mariospr.org/category/frogr)


    # ## NOMACS


    This image viewer can display images in all the popular image formats. In addition
    to the usual features it has some surprising ones such as the ability to synchronize
    viewing between multiple network instances.

    [https://nomacs.org](https://nomacs.org)


    # ## ENTANGLE


    Use this tool to tether and control your camera from the computer. *Entangle*
    will also help you set up the shot by tweaking the aperture, shutter speed, ISO
    and other settings and then download the image.

    [https://entangle-photo.org](https://entangle-photo.org)


    # ## FLAMESHOT


    You can use Flameshot to capture the whole or a specific portion of the screen.
    Additionally, it also provides you with a whole set of drawing tools to add annotations
    to your screenshot.

    [https://github.com/lupoDharkael/flameshot](https://github.com/lupoDharkael/flameshot)


    # ## LYCHEE


    Lychee has a simple user interface, and is a platform for storing and sharing
    photos. You can run it from a SBC like the Raspberry Pi and use it to upload,
    manage and share photos.

    [https://lychee.electricious.com](https://lychee.electricious.com)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# # Audio and Video


    Edit your videos within an inch of their lives, and organise your music.


    # ## UMS


    This streaming server will transform your Linux desktop into the ultimate media
    streaming station to broadcast media to other computers, smartphones, tablets,
    gaming consoles and even TVs. UMS streams media via the Universal Plug and Play
    (UPnP) protocols to any DLNA-compliant device. You’ll have to roll-out UMS, although
    the procedure is fairly simple.


    The first time you launch it, UMS takes you through a basic three-step configuration
    wizard. Although you can start streaming without further configuration, UMS does
    include an admin panel that offers customisable options and tips to guide new
    users. It also includes a minimal web interface for streaming your content. [www.universalmcidaserver.com](http://www.universalmcidaserver.com)


    # ## EMBY


    This is an all-inclusive media server that comes with plenty of features. Emby
    is a one-stop shop for accessing and viewing all your media on any device: from
    other computers and mobile platforms to Android TV, Chromecast, Roku, Xbox and
    more. Besides local folders, Emby enables you to add network shares, which is
    a great time-saver if you have media on different computers in your network. The
    Emby server is available as a pre-packaged binary and its website has installation
    instructions for all popular distros including Arch, CentOS, Fedora and Ubuntu.
    You can right-click items to reveal useful options such as downloading them, adding
    them to playlists and collections, converting them or editing their metadata.
    You can change the stream quality during playback and display full-screen. Emby
    also enables you to set up parental controls, and you can block items that have
    a higher rating than the maximum you’ve defined. [https://emby.media](https://emby.media)


    # ## MPV


    A resource-conscious video player that also looks good on modern machines. Based
    on mplayer2, MPV continues the tradition of CLI by introducing optimised and cleaned-up
    code with new configuration options and features. It offers a minimal user interface
    that stays out of the way, enabling you to watch your videos in peace. [https://mpv.io](https://mpv.io)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_168_0.png)


    # ## SHOTCUT


    A fairly advanced video editor, Shotcut is one of the few tools that supports
    editing 4K videos. The program supports many audio and video formats along with
    a variety of transitions and effects. It has a long list of impressive features
    and a collection of video tutorials to help orient first-time users. [https://shotcut.org](https://shotcut.org)


    # ## CURLIEW


    Powered by the ffmpeg library, Curliew is an easy-to-use media converter. It has
    the ability to crop and pad videos and convert only specified portions of files.
    Select one of its preset settings for various devices and formats and you’ll also
    be able to preview the files before the conversion. [https://curliew.sourceforge.io](https://curliew.sourceforge.io)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_168_1.png)


    # ## AIRSONIC (35)


    Based on the now closed-source project, Airsonic audio streamer makes your music
    omnipresent. It does on-the-fly conversion and can stream files in almost any
    format to multiple players simultaneously. [https://airsonic.github.io](https://airsonic.github.io)


    # ## TUPITUBE


    A set of tools to encourage kids to create 2D animations, TupiTube has an easy-to-use
    interface with just the right number of features and a host of textual and video
    documentation to get started. [www.maofloresta.com](http://www.maofloresta.com)


    # ## PICARD


    A nitty little tool, Picard will get your music collection back into shape. The
    program can sort your Music library and fill in missing tags, rename oddly named
    files and identify incomplete albums. [https://picard.musicbrainz.org](https://picard.musicbrainz.org)


    # ## TRAVERSO DAW


    A powerful audio recording and editing platform. Traverso is a digital audio workstation
    tool that can do everything from creating simple recordings to editing multi-track
    audio. [https://traverso-daw.org](https://traverso-daw.org)


    # ## MIXXX


    If you need to play DJ at an event, run through your music library with mixxx
    and use its scratchable waveform to loop beats, after the tempo of tracks and
    change their pitch to create your own mix. [www.mixxx.org](http://www.mixxx.org)'
  merge: -1
