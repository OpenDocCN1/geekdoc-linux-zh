- pgno: 85
  md: '# ## Do more


    # # Vulnerabilities and exploits


    Malware begins with breaking programs and ends in tears. Find out how we rein
    it in.


    ithout some knowledge of memory management, pointers and execution stacks, it''s
    hard to give a rigorous account of how programs get compromised and thus enable
    malware to do its thing. This isn''t the time or place for such an in-depth look,
    but we can at least provide an only slightly hand-wavy account of one way a program
    might be exploited.


    Programs work with input, which might come from a user, a website, another program,
    a piece of hardware (like a keyboard or a sensor) or a file. For a program to
    work correctly, that input has to be correctly formed. If it''s not, then it won''t
    fit nicely into the memory, horrible of kind of things can happen. We''ll be more
    specific about what those horrible things are in a moment, so bear with us. So,
    some kind of input validation ought to take place. If it does not, then the program
    will attempt to digest something that is the wrong size or shape for the memory
    assigned to it. As you can imagine, the results of this unpalatability can be
    unpredictable. To labour a metaphor, you may witness the digital equivalent of
    anyone between regurgitation and a food coma. This might be application crashes
    or system slow-downs.


    # ## » CVES, BUGS AND BOUNTIES


    There are good ways and bad ways to go about reporting newly discovered vulnerabilities.
    Up until they''re disclosed to the relevant vendor or project, these are known
    as zero-day bugs. Day Zero being the day that disclosure happens. If you were
    in possession of a Zero Day, you could brag about it on Twitter (and publish full
    details on some medium that allows more than 280 characters) – sending affected
    parties, especially the relevant project, into a panic and possibly unleashing
    a wave of script-kiddie attacks.


    Better to be responsibly disclose the vulnerability privately, so that a fix can
    be rolled out before things get out of control. Some projects even operate a bug
    bounty program so that such efforts can be rewarded. Vulnerabilities are assigned
    an ID on Mitre''s Common Vulnerabilities and Exposures (CVE) list, and once a
    suitable patch is in place, will provide public details of the vulnerability at
    https://cve. mitre.org. This will be picked up and packaged as a matter of urgency
    by all good distros. Relevant parties may not respond within a reasonable timeframe,
    or be interested, at which point going public becomes an option.


    As we write this, the most recent vulnerability that might affect us is CVE-2019-5953,
    a buffer overflow in the venerable wget – a command line utility for fetching
    things (most probably webpages) via HTTP. Using the tool to download a maliciously
    crafted file could result in arbitrary code execution, and a very bad day.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_85_0.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_85_1.png)'
