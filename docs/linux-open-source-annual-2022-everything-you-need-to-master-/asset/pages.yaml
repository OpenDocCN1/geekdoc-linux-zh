- pgno: 139
  md: 'there. If an instance’s Local timeline is information overload (or even if
    it isn’t), then it’s Federated timeline will be even more so.


    # Where you @?


    Like Twitter, usernames on a given instance are prefixed by @ . Unlike Twitter,
    they’re also postfixed with another @ followed by the instance domain. For example,
    Eugen Rochko is @Gargron@mastodon.social and Cory Doctorow (our favourite visionary,
    author and DRM- freedom fighter) is @doctorow@manot.fr. These look odd, but then
    all these new-fangled hashtags and


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_139_0.png)


    The Mastodon bridge site bridge.joinmastodon.org enables you to find your Twitter
    friends on Mastodon.


    # BUCKING THE OSTATUS QUO


    Back when the idea of a decentralised social network was in its genesis (around
    2009), a protocol family was designed that would cater to this brave new world.
    That family was called OStatus. OStatus defines protocols that permit de rigueur
    social networking activities: Atom feeds Users can publish feeds summarising their
    recent posts Activity streams A JSON-based format for encoding activity and event
    metadata, such as “liking” a post WebSub Formerly PubSubHubbub (PuSH) a realtime
    notification protocol for streams, feeds and the like Saloon A message exchange
    protocol for unifying commentary on posts and articles. Provides a single comment
    thread where the same source is referenced in different places. So-called because
    saloon swim upstream. WebFinger A discovery protocol for entities identified by
    a URI. These may be people, in which case the protocol is functionally (but not
    at all structurally) similar to ARPANET’s Finger protocol. Much of OStatus’s design
    has been superseded by modern alternatives: OStatus doesn’t support private posts
    natively, which means that platforms that do (such as Mastodon) would have to
    use extra attributes to federate private messages, and there’s no guarantee that
    other platforms would respect those attributes.


    But fear not, because since version 1.6 (released in September 2017) Mastodon
    implements the new and more flexible ActivityPub protocol, which, knowing now
    what we didn’t then, efficiently provides everything a distributed social network
    needs. Furthermore, it is extensible enough to be able to provide the things it
    will need in the future and already can be used for much more than just microblogging
    -- it’s at the heart of PeerTube for example. Meantime, Mastodon will support
    OStatus as a fallback until the 2.0 release. For a more detailed analysis and
    untangling of these protocols, we recommend studying JB Crawford’s excellent treatment,
    which can be found at: https://lwn.net/Articles/741218.


    handles and URI schema confuse us. If you’re referring to someone on the same
    instance as you in a tweet, then the instance name can be omitted. The decentralised
    nature of the network means someone on one instance can have the same handle (the
    part of the username before the second @) as someone on another. This allows for
    some degree of impersonation, which should be reported to the administrator, but
    no more so than the imitation of usernames on other platforms. Mastodon may have
    received a lot of coverage for being a viable Twitter alternative, but it’s not
    the only one. Free Social, a fork of Status.net, garnered much interest, and in
    a way still does, but has since been brought into the fold of yet another microblogging
    service, GNU Social. This uses the OStatus family of protocols to federate not
    only with other GNU Social instances, but anything else that implements OStatus,
    including (for now, see the box, below) left Mastodon and Friendica. GNU Social
    is the only social network where you’ll find one Richard M Stallman, albeit in
    only in the form of a script summarising his website updates.


    # Instance Mastodon


    If you want to run a Mastodon instance that other people (or even just yourself)
    can connect to, you’ll need a server to run it on. This may be a Raspberry Pi
    running in your basement, or a VPS (you can rent a small one for as little as
    $5/month), or anything really. It should be accessible 24/7, so running it from
    your home computer that you turn off every night or regularly play resource-intensive
    games on is probably a bad idea. Furthermore, if you do choose to run Mastodon
    at home, you’ll need to configure your router to forward traffic to the server,
    either using NAT (for IPv4 addresses) or by making an exception in the firewall
    (most home routers, with good reason, block all incoming IPv6 connection attempts).
    How to do this depends on the router involved. You’ll also want to set up a domain
    name for your server (nobody likes accessing these things via IP address), which
    you can do using either a commercial registrar, or a free service (such as DuckDNS,
    which issues subdomains of the form example.duckdns.org). Noewy domains (ones
    ending in .social, .xyz, .rocks or other so-school suffixes) are popular for Mastodon
    instances. If you’re just testing, you can use a fictitious domain name and place
    an entry in /etc/hosts.


    Like so many web applications, you won’t find Mastodon in your distro’s repos
    and it’s best installed straight from source. Getting everything set up is a lengthy
    process. We need to set up Node.js, Ruby a PostgreSQL database and a webserver
    (and associated certificates). You may prefer to use a Docker image. Prebuilt
    images are available at https://hub.docker. com/r/tootsuite/mastodon, and they
    can be used as-is or customised to suit your needs. There are also turn-key, paid-for
    offerings available on Heroku and Scalify. Have a read of https://github.com/tootsuite/
    documentation#running-mastodon to study the available options. We’ll detail the
    standalone installation process now, which is based on Ubuntu 18.04 Server, but
    apart from a few cosmetic differences the process is similar on other distros,
    and it’s identical if you’re using desktop Ubuntu.'
