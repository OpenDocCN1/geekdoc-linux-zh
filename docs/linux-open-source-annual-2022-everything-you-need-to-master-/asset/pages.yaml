  md: '# Distros


    # Roundup


    Equinox Desktop Environment (EDE) >> Lumina >> LXQt >> Moksha Desktop >> Openbox


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_33_0.png)


    **Shashank Sharma**

    By day Shashank is a New Delhi trial lawyer, but by night he''s an open source
    vigilante!


    # Lightweight desktops


    With his gym membership going unused, **Shashank Sharma** decides to cut down
    the flab on his desktop instead.


    # HOW WE TESTED...


    We installed all the desktops inside an Arch installation. Most of them are in
    one of the officially supported repositories, though some are in the community-powered
    Arch User Repository (AUR).

    We''ve rated the desktops on various fronts, such as their availability and cache
    of default apps. Malleability is also another important criteria when choosing
    a desktop: an environment that ships with loads of tweakable settings will score
    higher than one that has a limited number of modifiable parameters, as people
    usually swap their default DES because of a rigid configuration. Just as important
    is the availability of plug-ins and add-ons. These give you the option to extend
    the usability of your environment depending on your requirements.

    The most important criteria for this *Roundup*, however, is the usability of the
    desktop. Any desktop that doesn''t fare well in this test wouldn''t be of much
    use, despite achieving high scores on other fronts.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_33_1.png)


    1

    nitially at least, it''d seem counter-intuitive that anyone would want to change
    the default desktop environment (DE) of their distribution.

    After all, the leading distributions spend a considerable amount of time fine-tuning
    the user experience. Some are even actively involved in the development of the
    DE to ensure that it meets their expectations.

    However, the default environment, pretty much like the factory installation, is
    designed to suit most common workflows.

    Despite all their refinements and functionality, some DES are just a hindrance,
    especially for tasks that need the least amount of graphical oomph. Then there
    are those of us who have interacted with computers all their life with a DE that
    conforms to the traditional desktop metaphor, and so don''t really see the advantages
    of newfangled desktop shells. Another group of users disgruntled under the default
    DE are those computing on under-powered machines which lack the resources to satiate
    the needs of the resource-guzzlers.

    If you identify with any of the use cases we''ve just outlined, this *Roundup*
    is for you. We''ll look at some desktops that have a minimum footprint but will
    still enable you to get along with your tasks.'
