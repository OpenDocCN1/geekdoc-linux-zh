    ```

    $ `qemu-system-x86_64` -cdrom focal-live-server-amd64.iso -boot order-d -drive
    file:bq.qcow2 -m 1G

    ```


    By default `QEMU` assigns only 128MB of memory for its machines, which it turns
    out is nowhere near enough to boot Ubuntu. The `-m` option at the end assigns
    1GB, thus remediying this. A window should open, which you can click in to navigate
    through the setup questions. By default `QEMU` provides NAT and DHCP services
    and will set up the VM with an IP address of the form 10.0.2.<number>, which should
    work fine. We then went with the ''Use Entire Disk'' option to avoid needless
    partitioning. Ubuntu can automatically set up SSH for you, which generally is
    A Good ThingTM, but we''ll see later that host-to-guest networking with `QEMU`
    is tricky; it also offers you a list of popular snaps, so feel free to install
    anything you think might be interesting. You may want to increase the 1GB of memory
    and enlarge the image file if you plan to have your VM do anything vaguely onerous.


    While the install is underway, or whenever the `QEMU` window is open, you can
    press Ctrl+Alt+2 to show the `QEMU` monitor, which allows you to assess the state
    of `QEMU`. Do this and then type `info kvm` to see whether KVM is being used.
    You''ll probably find it isn''t, in which case we''re emulating a machine, not
    virtualising one. Oops. That goes some way to explaining the slowness, and it
    takes one a command line switch to activate KVM. Use the menu or Ctrl+Alt+1 to
    return to the VM. Once the install has completed, shut down the VM. It does offer
    to reboot, but go to the Machine menu and hit Power Down instead. As the title
    bar tells you, use Ctrl+Alt+G to ''escape'' the mouse from the VM''s window if
    it''s stuck.


    Now start the machine with the correct invocation:


    ```

    $ `qemu-system-x86_64` -drive file=lf.qcow2,format=qcow2 -m 1G -enable-kvm

    ```


    and log in with the credentials you invented earlier. Ubuntu will tell you its
    IPv4 and IPv6 addresses, but if you try to SSH in from the host, you''ll find
    it doesn''t work. `QEMU`''s default network setup enables the guest


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_72_0.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_72_1.png)


    If you run into bridging difficulties, it''s easy to delete everything and start
    again from the Network settings area.


    to access services on the host (at the address 10.0.2.2), but not vice versa.
    Communication between different guests is also not possible in this configuration.
    We could delve into the ins and outs of setting up a tap device (a virtual network
    interface) or host-only networking, but since we''re going to talk about Libvirt,
    which makes all these things effortless, we''ll defer to the Arch Wiki page on
    `QEMU`, in particular the lengthy Networking section. See `https://wiki.archlinux.org/index.php/QEMU`.


    If you really want nothing more than to have a VM that''s easy to SSH into, you
    can use `QEMU`''s bridge


    # DON''T FEAR THE EMULATOR


    > “QEMU is an emulator, but we''ll see that the amount of actual emulating it
    has to do can be reduced to almost zero.”


    helper to help you (for a wired connection). This involves creating a file called
    `/etc/qemu/bridge.conf`, consisting of a single line:


    ```

    allow bridge0

    ```


    Now we must create the bridge, add our Ethernet connection (enp3s0 in our case)
    to it, and connect it to the outside world. If your distro uses `NetworkManager`
    (it probably does) then it''s best to do this with `nmcli` rather than the lower-level
    `ip` commands:


    ```

    $ sudo nmcli connection add type bridge ifname bridge0 stp no \

    $ sudo nmcli connection add type bridge-slave ifname enp3s0 master bridge0 \

    $ sudo nmcli connection up bridge-bridge0

    ```


    Then start `QEMU` with:


    ```

    $ `qemu-system-x86_64` -drive file=lf.qcow2,format=qcow2 -m 1G -enable-kvm -net
    nic -net bridge,br=bridge0

    ```


    This means your VM will join the same network as the host and get an IP from your
    home router. The same thing can be achieved in a `VirtualBox` VM by visiting the
    network settings and changing the adapter type from NAT to Bridged Adapter.


    Once the virtio drivers were installed, we added 2GB of RAM due to our Ubuntu
    Server 20.04 VM.'
