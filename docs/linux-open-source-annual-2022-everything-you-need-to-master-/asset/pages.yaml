- pgno: 104
  md: 'the ATmega328 from Microchip. There’s a lot more than just a name that separates
    them, though, as a few figures will reveal. The processors on P-type boards have
    a 32-bit of 64-bit architecture, they generally have two, four or eight cores,
    and they’re usually clocked somewhere between 1GHz and 1.8GHz. The ATmega328 has
    an 8-bit architecture, a single core, and the clock speed is often just 16MHz.


    The difference in memory and storage is just as stark. Instead of capacities measured
    in hundreds of megabytes or gigabytes, Arduino boards will commonly have 32KB
    of flash storage for the program, and user storage of a few kilobytes of RAM and
    a similar amount of non-volatile EEPROM. For embedded applications with no need
    to support an operating system, you might be surprised at how much you can do
    with such an apparently modest specification.


    Finally, before moving onto something a bit more practical, we need to spell out
    what we mean when we talk about an Arduino. Arduino was developed at the Isera
    Interaction Design Institute in Italy for educational use. Official Arduino boards
    – of which there are several – are available at www.arduino.cc. The design is
    open source and several companies have produced compatible designs. These should
    not be called Arduino boards, because the name has been registered, although third
    parties can refer to them as ‘Arduino-compatible: several use names ending in
    ‘duino’ or similar to make the point.


    Generally, third-party designs are cheaper than those sold by Arduino. There are
    also boards on the market that appear identical to Arduino products, but use the
    Arduino name and logo illegally – these should be avoided. Oh, and just a quick
    word on what we mean by the phrase ‘Arduino-compatible’: the bottom line is that
    different manufacturers might use it to mean different things, so be sure to read
    up carefully if compatibility is important. At the software level, it means that
    it will work with the Arduino IDE – that’s the Integrated Development Environment
    that you’ll use on a separate PC to develop code before uploading it to an Arduino.
    Most compatibles offer this level of support. At a hardware level, the most common
    understanding of compatibility is that the I/O pins are compatible so that the
    board can be used with Arduino shields: add-on boards which are roughly equivalent
    to HATs in the world of Raspberry Pis. Most so-called compatibles also offer this
    level of compatibility, but there have been reports of a few that don’t.


    # ### The Arduino IDE


    Because Arduino-type boards don’t run an operating system, nor are they easily
    able to interface to a keyboard, mouse and display, software is developed on a
    separate PC and is then downloaded to the Arduino. The easiest way to do this
    is to use the Arduino IDE which is available for all major operating systems,
    but note that it runs under Java, so you’ll have to install that if it’s not already
    present on your PC. As with many IDEs, the one for Arduino provides all the tools
    necessary for code development. In particular, it includes a text editor in which
    you’ll create and modify the source code, a compiler and linker, and a means of
    downloading the compiled code to the Arduino board. Because all third-party Arduino-compatible
    boards


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_104_0.png)


    > Arduino-based hardware, like this UNO board from Elegoo, is so much simpler
    than Raspberry Pis and similar SBCs, but it’s ideal for controlling real-world
    devices.


    work with the official IDE, it’s not included as part of the Elegoo UNO Basic
    Starter Kit that we’re going to be using, so you’ll need to install this IDE separately.
    Many of the repositories only have an outdated version of the Arduino IDE. So
    you’ll be better off downloading the latest version from www.arduino.cc/ en/main/software.
    There’s also an online version that runs in a browser and saves your projects
    in the cloud. If you decide to use the online version, you will still need to
    install the Arduino Web Editor plug-in on your PC to handle the uploading of code
    to the Arduino. This cloud utility is worth considering because the IDE is just
    one element of Arduino Create, which is described as “an online platform that
    enables developers to write code, access tutorials, configure boards, and share
    projects”. It also means that you’ll always be using the latest version of the
    IDE. We decided to concentrate on using a locally installed IDE and we got it
    to work with no difficulty at all. Others report problems, so it’s good to


    # ### > CODE DEBUGGING


    We have some good news and some bad news. The good news is that software for many
    of the control applications you’ll be writing – at least initially – won’t be
    very complicated, so the likelihood of introducing programming errors is less
    than with many coding tasks. The bad news is that, if your software does go wrong,
    debugging code running on an Arduino SBC is tricky. In particular, the standard
    IDE does not provide facilities such as setting breakpoints, single-stepping,
    reading memory locations and so on.


    What is possible, however, is to use the USB link between the SBC and your PC
    – the same link that’s used for downloading code to the Arduino – to transmit
    data back to the IDE. This involves adding instructions to your code specifically
    for debugging purposes. Typically you’d use serial.write() or serial.print() instruction
    to output debugging data – such as the value of a memory location – to the serial
    port, having first initialised that port with serial.begin(). You then able to
    make use of the IDE’s serial monitor facility to inspect what the sketch has written.


    Bear in mind that a mistake with the electronic circuitry attached to the board’s
    input/output pins is often the problem. Many users report that hardware errors
    are more common than software errors.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_104_1.png)'
