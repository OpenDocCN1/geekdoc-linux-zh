- pgno: 164
  md: '# Photo editors


    # The Verdict


    The winner of this month''s *Roundup* was easy to identify. **GNU Image Manipulation
    Program**, or **Gimp**, is an undisputed champion and the best choice for photographers,
    regardless of their workflow. Gimp is the best for painting and retouching, but
    it''s also the most reasonable choice for repairing, retouching and applying various
    recovery techniques thanks to third-party extensions from G''MIC and FX Foundry.
    If you need to process RAW images, Gimp can integrate with UfRaw and *Rawtherapee*
    and use them as image sources. It''s a versatile and comprehensive software package.


    Deciding on the positions of the remaining programs was more challenging, because
    they all came very close to each other. Securing second place is *Rawtherapee*,
    with its superb colour correction tools and a stronger denoising algorithm. It''s
    hard to tell if *Rawtherapee* is really better than *Darktable* – both are just
    different but comparable in terms of features. Still, in our tests *Darktable*
    was slower and didn''t have a capable white balance fixer, which is why it lost
    a few points.


    The surprising news is *Pixeluvo* coming in third place. This lesser-known commercial
    application is short on professional tools and lacks a number of sophisticated
    (and often overlapping) features that other RAW processors have. However, *Pixeluvo*
    is equipped with brilliant editing tools, useful colour adjustment features, quick
    effects, layers and even its own RAW import dialog. It''s the most balanced editor
    that is (probably) worth the price.


    This means that *Lightzone* brings up the rear, which doesn''t mean that it''s
    a bad program in itself. However, we were disappointed that *Lightzone* – which
    calls itself a professional-level RAW image processor – had such a poor noise
    removal tool. *Lightzone* still performed well when fixing colours and removing
    spots, but denoising could just be a little better.


    So, for most use cases we recommend using *Gimp* and *Rawtherapee*, either separately,
    or by turning *Rawtherapee* into a RAW import plug-in for *Gimp*. If you don''t
    need to reduce noise and grain, have a look at *Pixeluvo*, which has everything
    for amateur photo processing. Don''t ditch *Lightzone*, either: it has certain
    advantages as a good second-tier photo-editing program.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_164_0.png)


    **1st Gimp 10/10**


    Web: www.gimp.org Licence: GPLv3


    Version: 2.10.8


    The one software package for all your photographic needs. Impressive!


    **2nd Rawtherapee 9/10**


    Web: https://rawtherapee.com Licence: GPLv3


    Version: 5.5


    It has more features than necessary, but it processes RAW shots perfectly.


    **3rd Pixeluvo 8/10**


    Web: www.pixeluvo.com Licence: EULA


    Version: 1.6


    It''s powerful and easy to use, but is still a lighter weight class of software.


    **4th Darktable 8/10**


    Web: www.darktable.org Licence: GPLv3


    Version: 2.6


    It has masks, profiles and a great denoiser, but it falls a bit short in other
    areas.


    **5th Lightzone 6/10**


    Web: www.lightzoneproject.org Licence: BSD


    Version: 4.1.9


    Capable image-editing software, but with poor grain/noise removal tools.


    # **>> ALSO CONSIDER**


    Some people will argue that we forgot about *AfterShot Pro* from Corel, as well
    as some heavy-weight open source packages like *Digikam* or *Krita*. Well, *AfterShot
    Pro*''s proprietary software with a price tag to boot, and we certainly don''t
    want to turn our group test into an OSS vs proprietary software war. *Digikam*
    is very good indeed and delightful to work with, but it focuses on collecting
    and sorting photos rather than on editing and processing. Finally, *Krita* is
    a great tool for digital


    artists, comics writers and artwork designers, but it''s far less robust when
    used for editing photographs. Other alternatives also exist, and you may have
    read about them in previous issues of *Linux Format* (for example, *Photivo* (see
    **LXF238**) and *Fotoxx*, to name just two). We, of course, acknowledge these
    programs and other free software packages for editing photos, but in this *Roundup*
    we selected the most powerful and feature-rich titles that can be used on a daily
    basis.'
  merge: -1
  img_proc: true
