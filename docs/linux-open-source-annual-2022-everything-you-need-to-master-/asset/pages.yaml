  md: '# # Roundup


    Claws Mail » Evolution » Kmail

    » Mailspring » Thunderbird


    By day Shashank is a New Delhi trial lawyer, but by night he’s an open source
    vigilante!


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_119_0.png)


    # # Email clients


    Can’t decide which desktop email client to use? **Shashank Sharma** has been locked
    in the *Linux Format* Server Dungeon tweaking his SMTP.


    # ## HOW WE TESTED...


    Unlike the last time we ran a Roundup of email clients (LXF151 – seven years ago!)
    when we installed the different applications on their native desktop environments,
    we’re running all of them on the Budgie desktop this time around. Most distributions
    carry these applications in their software repositories, and we’re running the
    latest available versions of each of them. The only exception is Thunderbird,
    because its latest release isn’t yet available in the software repositories, and
    we had to install it manually.

    Most email clients are similar in appearance, but we’ll be testing these tools
    on their performance, their search capabilities and ability to handle junk and
    spam messages. We’ll also keep an eye out for any standout features on offer,
    and their support for IMAP and POP accounts. Extending functionality through plug-ins
    and other customisation options is another criteria to consider when choosing
    an application that you’ll rely on for important communications.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_119_1.png)


    While email clients may appear to have not changed much since their debut on the
    Linux desktop, the different applications are constantly working on adding new
    features to please existing users, and attract new ones. In addition to accommodating
    for touch devices, many applications also support advanced features such as delivery
    notifications. This is especially useful when working with an IMAP account, such
    as that of GMail.

    Much like the perfect web browser, or text editor, there’s no clear answer as
    to which is the best email client. The ideal feature set for a desktop email client
    depends on the intended use. A casual home user probably doesn’t have any need
    for features such as delivery confirmation or scheduling, which would be relevant
    to business users.

    Despite many visible alternatives on offer for users who prefer the command-line
    over a GUI, we’ve restricted ourselves to graphical applications for this Roundup.
    While our selection may seem heavily in favour of GTK, with only one KDE application
    thrown in the mix, the chosen applications can be installed on any desktop, and
    your distribution’s software management tool will fetch the additional libraries
    needed for these applications to function properly.'
