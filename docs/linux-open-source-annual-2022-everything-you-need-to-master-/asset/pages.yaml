  md: '![](img/3f314b57ad3c8b08d25e5d1ab47de56d_146_0.png)


    Besides addressing long-standing bugs (Morrowind received its last official patch
    in 2003), the engine adds new features and, of course, enables the game to be
    played natively in Linux. The original game assets are required, but that’s fine
    because you can get hold of a DRM-free copy of Morrowind (the full-priced Game
    of the Year edition) from **gog.com** for £13. It’s often on special offer too
    so add it to your wishlists if you’re short of coin.


    *OpenMW* modernises the original game by being able to render distant terrain
    (increasing the draw distance on the original reduced performance horribly), use
    TrueType fonts and works with all the multimedia formats supported by FFmpeg.
    Some third-party mods for the original Morrowind will work with *OpenMW*, but
    this isn’t a strict goal of the project at present. Many mods relied on bugs in
    the original engine or assumptions about undocumented quirks.


    *OpenMW* also comes with *OpenMW-CS*, which makes it possible for users to create
    their own assets: characters, maps, quests… the whole shebang. This enables ambitious
    users to form entire games based on *OpenMW*. Skilled 3D sculptors can use Blender
    to create models of dragons and dungeon-paraphernalia, and use export them using
    the NIF (a proprietary format used by many other games) or OSQ (*OpenMW*’s own
    open format) plug-ins.


    There’s an inordinate number of other open source game engines which we haven’t
    had a chance to discuss (maybe we would have if someone hadn’t spend all their
    time playing *Red Alert* instead of writing this feature – Ed). Check out the
    impressive list at **https://osgamemclones.com**. But in the name of nostalgia
    we’d like to give a nod to Freezerf (**https://github.com/freezerf/freezerf**),
    which makes it possible to play (again with the original data files) the classic
    medieval kingdom simulator *The Settlers* from 1993. Readers, do let us know if
    you find any classics from your youth that have been brought back to life through
    the magic of open source (just don’t tell Jonni as he’s distracted by pixilated
    things and old jokes – Ed).


    # » BUT DOES IT RUN DOOM?


    It’s become something of a tradition to run shareware classic **Doom** on all
    sorts of hardware never intended for running Doom (see for example **www.gamesradar.com/12-things-that-prove-that-doom-will-run-on-literally-anything**).
    However, most of this silliness is enabled through the many reworkings of the
    **Doom** engine, to which id Software released the source code in 1997 (it’s available
    at **https://github.com/id-Software/DOOM**).


    One of the earliest ports was **GLDoom**, which brought OpenGL support to *Doom*,
    but this was a DOS-only affair. **Boom** overhauled the *Doom* engine, fixing
    many bugs and oddities, as well as removing limitations that no longer made sense
    for (then) modern hardware. *Boom* wasn’t initially open source, but the code
    was released in 1999, which gave rise to **LxDoom** for Linux and **PrBoom** for
    Windows. These two projects eventually merged under the **PrBoom** moniker. **PrBoom**
    has since been ported to many platforms.


    There are many other more *Doom* clones, some of which add new and advanced features,
    but some people treasure the original. For those people there’s **Chocolate Doom**
    (see **LXF228**). It recreates as authentically as possible the DOS experience,
    even going as far as to re-implement bugs that were later fixed. This means original
    demos can be played, the imps are as dumb as ever, and slight artefacts that some
    levels of the original relied on are faithfully reproduced.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_146_1.png)'
