- pgno: 45
  md: '# # Pop!_OS


    Let eyecatching-distro aficionado **Jonni Bidwell** show you the ropes of System76''s
    bespoke Linux flavour.


    T here have been a few notable efforts to humanise Linux. Today we''d say – and
    feel free to disagree – that Linux Mint and elementary OS are the most friendly-to-use
    and all-purpose distros out there. These are of course indebted to Ubuntu for
    providing a solid foundation and superlative package selection – which in turn
    owes something to Debian. But it''s also arguable that much of this popularity
    is, or at least was, a result of dissatisfaction with Ubuntu''s desktop.


    People who didn''t like Unity loved Cinnamon, and the people who did like Unity
    didn''t like GNOME 3 (which Ubuntu has used since 17.10). Pantheon, the macOS-like
    desktop of elementary OS, is attractive not just to fans of fruit-based fashion
    companies, but to anyone frustrated with overcomplicated configuration, inconsistently
    styled applications and ugly fonts. Of course, Windows 10 drives a steady trickle
    of users to Linux too, as the Start menu begins to resemble some sort of ever
    growing billboard farm, and updates constantly get in your way. Hardware compatibility
    is an important concern too. Today, distros have to cater to all kinds of new-fangled
    configurations: HiDPI fractional scaling, multi-monitor and hybrid GPU setups,
    disk encryption. Users want easy access to the latest software, and developers
    want easy access to their preferred development tools. Providing such features
    is especially important if you''re a manufacturer of Linux systems like Colorado-based
    System76, and that is why it developed the mysteriously punctuated Pop!_OS. Let''s
    take a look at it.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'opefully by now you''ll have had a play with

    **Pop!** and have seen quite what all the fuss is

    about. You may even be itching to install it, in

    which case check the step-by-step guide. Before you

    do though, you should be aware that if you have

    Nvidia hardware and generally want life to be easier,

    you should definitely use the Nvidia edition of Pop

    from https://system76.com/pop. This comes with

    Nvidia''s proprietary driver set up nicely out of the

    box, which is very useful.


    The AMD/Intel edition contains only open source

    drivers, including the Nouveau driver for Nvidia cards,

    but that''s not much use for AAA gaming or CUDA

    programming. If you have any problems booting a live

    disc or booting a Pop!_OS USB, ensure that you have

    disabled secure boot in the UEFI settings (often found

    by pressing F2 or Delete at boot time). Different BIOSes

    use different hotkeys to invoke a boot menu, but

    F1, F2 and F12 are popular. Like most unfamiliar

    distros, you may find a few quirks when you install that

    you''ll need to work out, but a little resourcefulness and

    checking the online FAQs should minimise this.


    # ### Pop it like it''s hot


    The guide covers installing alongside Windows; we''d

    always recommend installing on a different drive if you

    have an available though. UEFI booting means

    Windows usually manages to keep itself to itself, or

    keep its breaking to itself. If you use classic BIOS you

    might find Windows blithely overwriting the bootloader

    from time to time, which is annoying, but can be

    remedied. Either way, it''s important to disable Fast

    Startup in Power Options in the Windows control panel,

    otherwise you won''t be able to boot another OS. If

    you''re setting up Pop as your only OS, you can safely

    ignore all the partitioning instructions in the

    walkthrough; just select ''Erase entire disk'' from the

    installer and everything will be set up for you.


    You should also be able to safely use the Pop!_OS

    Installer''s partitioning tool to resize the NTFS partition,

    but it''s probably safer to let the default (Windows) do the

    devil''s work (rearranging NTFS structures). If your EFI

    partition is less than 512MB – some Windows installs

    seem to settle for 100MB – then you''ll need to use a

    third-party tool to resize this and possibly move the

    Windows System reserved partition, which we can''t

    possibly recommend. Hopefully this isn''t you and you

    have no need to worry. Distri (Pop''s bespoke and

    delightfully simple installer) will hold your trembling


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_46_0.png)


    The Videos app offers to install any codecs you might need, or

    alternatively install VLC or MPV.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_46_1.png)


    hand throughout the installation process.


    Pop!_OS doesn''t really resemble Windows or macOS,

    and it only vaguely resembles Ubuntu''s current GNOME

    setup. But it is easy to get to grips with: hit the Super

    (Windows) key or click the top left corner to access the

    activities view, then start typing to find installed

    applications. That will also show you applications you

    can install from the Pop!_Shop (okay, that does have a

    rice ring to it) as well as any recently opened matching

    files. Our initial install weighed in at around 5.5GB, which

    is pretty modest by today''s standards. As with many

    distributions LibreOffice comes bundled, but beyond

    Firefox and core tools there are no crazy-large

    application inclusions. There are a few gems included,

    such as the delightful Geary email program and

    System76''s own Pop!_USB-writing tool. There''s also

    Eddy, which like its rhyming brethren Gdebi is a GUI tool


    > If you choose to

    > install Pop!_OS on its

    > own drive, you can

    > enable full-disk

    > encryption so your

    > data is safe at rest.


    # ## THE LITTLE THINGS


    A lot of what distinguishes Pop!_OS is its behind-the-scenes attention

    to detail. Things that are traditionally annoying are simple with Pop!

    System76 has written its own HiDPI daemon, which you can read all

    about at http://bit.ly/1x2SHiDI. It makes light work of whatever

    complicated display arrangement you''re running, and can even

    manage mixed HiDPI displays with running scaling. Wayland is

    disabled out of the box, but you can enable it by editing etc/

    gdm3/custom.conf and commenting the line:

    WaylandEnable=false

    You''ll then see the usual cog icon when you type in your password

    at login, and you can choose between Wayland and X.Org sessions.

    Wayland in some multi-DPI situations performs better than X, and in

    our testing we only ran into a few niggles – mostly using Fedora''s

    experimental Firefox Wayland flatpak from https://firefox-flatpak.

    mojoredora.cz.

    It''s easy to dismiss Pop!_OS as just another Ubuntu clone, but we

    don''t do features on insipid distros, so there must be something to it.

    Beyond what we''ve written about here, there are so many other little

    tweaks to make life easier. These have been done cleverly so you

    hardly notice them. With users at the heart of its design and that

    design informed from the unique viewpoint of an OEM, Pop is just

    lush. It''s perfect as a beginner''s distro, but it hasn''t been ''dumbed

    down'' in any way. It''s so flexible and powerful that more advanced

    users will enjoy it too. Heck, we just installed it on the official VDF

    laptop (John''s Eee PC!–Ed). So there.'
