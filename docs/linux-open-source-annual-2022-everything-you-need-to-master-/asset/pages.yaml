- pgno: 161
  md: '# Fixing colours, shadows and more


    Want to give your

    photos a natural look?


    **W**e may prefer one tool over another purely for subjective reasons, but there
    are some practical tests that expose the real value of each photo-editing program.


    For this *Roundup* we used a couple of images as test subjects when exploring
    the five programs. One was a scanned historic colour film frame with inadequate
    lighting, film grain and insufficient exposure; while another was an unprocessed
    RAW shot of a night urban scenery with illumination, which was also underexposed.


    The aim was to try to achieve the best possible results from both shots in each
    of our five programs. We paid special attention to the white-balance fixer and
    any available colour adjustment sliders, as well as the shadows, highlights and
    level correction tools.


    In the end, a good program is one that can either fix everything using automatic
    algorithms, or by offering adequate tools for manual work. It goes without saying
    that the only acceptable editing mode is a non-destructive one, where the user
    can always roll back to the original image without losing anything irreversibly.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_161_0.png)


    # Gimp

    10/10


    When it comes to correcting colours, *Gimp* shines thanks to its fast GEGL engine.
    We didn’t need any third-party plug-ins for fixing the colours of our test photo.
    The Colour>Levels menu enabled us to fix the white balance (look for three pickers
    for choosing black, grey and white spots), but we also managed to remove that
    distasteful green hue on certain parts of the image by adjusting levels manually
    for green channel only. Using *Gimp*’s standard features for tuning up levels
    and curves turned out to be easier than in specialised software such as *Rawtherapee*
    and *Digikam*. Not that one application is better than another, but *Gimp* is
    just easier to use for an average user.


    When processing RAW files, *Gimp* can integrate with *UFRaw, Rawtherapee* and
    possibly other similar tools. The result depends on how well a user can handle
    the many tools of a RAW processor.


    # Darktable

    6/10


    *Darktable* has some advanced tools for working with colours, including a dedicated
    White Balance section. The neutral Color Picker tool sits under the Levels section,
    but it’s not intuitive and takes quite a lot of time to fix white balance. Getting
    this tool to work correctly in *Darktable* is crucial. We achieved acceptable
    results by adjusting the colour temperature and each of RGB channels separately.
    We believe that *Darktable* has too many tools, many of which overlap, so the
    program is more likely to help you achieve artistic effects than bring back natural
    colours.


    The positive side of *Darktable* was working with RAW files. For example, the
    application offers the original algorithm for exposure compensation, which resulted
    in a pleasing image with less noise and better local contrast. Another *Darktable*-only
    tool is Velvia, which boosts image saturation for brighter parts of the image
    only.


    # Removing image noise


    How good are these programs for eliminating noise and restoring detail?


    **T**he reason why we equipped *Gimp* with third-party plug-ins is because they
    grant the program advanced tools for combating colour noise and removing grain.
    The Repair category inside the G''MIC interface contains some advanced denoising
    filters, of which the most powerful is perhaps Iain’s Noise Reduction. This filter
    contains a range of configurable options that effectively remove film grain or
    colour noise that has been created by high ISO values.


    We managed to achieve reasonable results simply by combining several filters in
    succession. However, the built-in options for reducing noise and grain in *Darktable*
    proved to be even more efficient because they managed to preserve details more
    effectively. *Darktable* has a bilateral denoise feature for high ISO; the non-local
    tool can be used when denoising chrome and luma; there’s a dedicated chromatic
    denoise tool for RAW images; and the universal *Equalizer* tool can enhance many
    things, including clarity as well and reduce colour noise. *Rawtherapee*’s denoising
    tools are slightly less effective, but when it comes to


    processing RAWs with high ISO, we think *Rawtherapee* has the edge because it
    produces much smoother JPEGs compared to those processed by *Darktable*.


    In contrast to the other programs, *Lightzone* just has a simple denoise tool
    with only two sliders for colour and grain. Sadly, for some of our test images,
    that denoise filter had little or no effect.


    Finally, the Reduce Noise feature in *PixeIovo* is only there for the sake of
    box-checking. It works as a primitive median filter and removes noise together
    with precious details. It’s best avoided unless you want to change the nature
    of your original photo.


    # VERDICT


    | GIMP | 8/10 | LIGHTZONE | 5/10 |

    | DARKTABLE | 8/10 | PIXELVO | 5/10 |

    | RAWTHERAPEE | 10/10 | | |


    Choose *Gimp* for retouching old photos and go with *Rawtherapee* for creating
    perfect JPEGs out of your RAW shots.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# **Rawtherapee** 10/10


    We started with our greenish old film and tried to fix its colours in **Rawtherapee**.
    First we rolled out tools under the Colour section, chose the white balance picker
    and quickly made the colours look much more natural. However, we also had to manually
    remove the erroneous green hue of the wooden bar while keeping the rest of the
    image natural. **Rawtherapee** has a rich set of colour correction tools, including
    colour channels and RGB curves for selective colour correction.


    For the second image we switched to the Exposure section, hit the Auto levels
    button and then adjusted colour compression, brightness, contrast and exposure
    sliders to make the picture brighter and more vivid in general without turning
    illuminated parts into glowing spots. It wasn’t too difficult thanks to **Rawtherapee**
    providing all the necessary tools for achieving this.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_162_0.png)


    # **Lightzone** 10/10


    Playing with colour settings in **Lightzone** proved to be relatively easy. The
    application offers its own original way of adjusting colour balance, which was
    a bit unusual but no less efficient in the end. Expanding the White Balance section
    in the Edit mode enabled us to select a neutral spot in the image, making colours
    look more natural. In addition, the Color Balance feature provided us with a tool
    to select a colour range and change its temperature. This approach was perhaps
    the best and the most intuitive for our purposes, when we needed to selectively
    remove certain tints from the image.


    Working with dark night shots led us to the Relight section, a dedicated tool
    set for repairing underexposed parts of the image. Another useful thing was ZoneMapper
    with its luminosity gradient. This tool changes the exposure value, whereas Relight
    sliders are ideal for shadows and highlights.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_162_1.png)


    # **Pixeluvo** 10/10


    There are plenty of colour-related tools in **Pixeluvo**, including Color Balance,
    Replace Color and Levels sections for working with colour temperature and white
    balance. The neutral colour picker is also there, under the Levels setter. **Pixeluvo**’s
    available tools show a noticeable shift towards creative image processing, such
    as toning, colourising, boosting vibrance and improving local contrast. The number
    of tools is limited, but everything you need is here. It’ll take you a little
    time to learn how to fix images with incorrect colours in **Pixeluvo**, but if
    you decide to buy the software your money will be well spent.


    **Pixeluvo** includes a decent RAW processor with some useful features. There’s
    the Auto-exposure button (worked like a charm for our test image) and a bunch
    of sliders including the useful Recovery option. **Pixeluvo** worked perfectly
    when enhancing RAW image files, too.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_162_2.png)


    # # Editing tools


    # How about brushes, layers or selection tools?


    **Gimp** shines in this test, because the program was created exactly for image
    manipulation of this kind. **Gimp** has the gorgeous Healing Brush tool for super-smart
    removal of any spot defects present within a photograph. Needless to say, **Gimp**’s
    selections, masks and layers that you can group or rearrange is something that
    any photo-retouching specialist frequently uses.


    **Darktable** has a useful spot removal tool, which also enables you to add circles,
    ellipses and custom outlines to your photographs. When used in conjunction with
    Masks, this makes it possible to repaint custom areas of the image, but it’s a
    far less intuitive process compared with using similar image-editing tools that
    live within **Gimp**.


    Speaking about **Lightzone**, there’s a roundabout way of working with layers
    within the program. Most filters in **Lightzone** have the Colour Selection tab
    that enables you to select a range of colours, for which the filter will be applied.
    Together with the Colour Mask view mode this works like the layer approach. Each
    filter is therefore a separate layer of the source image. There’s also a spot
    removal tool.


    The **Pixeluvo** editor has a far better set of editing tools and includes such
    cool features as Warp, FX brush, Clone brush, Straighten tool and many more. The
    lower right part of the image has a retractable layer panel with all the basic
    features that a good image editor should have. A very pleasant experience!


    Unfortunately, **Rawtherapee** doesn’t offer any means for working with parts
    of an image. The best way to solve the problem would be to use an external editor
    (any other in our Roundup).


    **VERDICT**


    | **GIMP** | **10/10** |

    | --- | --- |

    | **LIGHTZONE** | **8/10** |

    | **DARKTABLE** | **6/10** |

    | **PIXELUVO** | **9/10** |

    | **RAWTHERAPEE** | **1/10** |


    **Rawtherapee** only works with entire images. For editing tools we’d recommend
    choosing either **Gimp** or **Pixeluvo**.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# ## Special features


    How much extra value can you get with one program?


    e also tested features that didn’t fall into any of the previous sections. One
    of *Gimp’s* most valuable feature is its extensibility. There’s a range of useful
    extra editing scenarios and plug-ins for *Gimp*, from motion blur remover (Refocus)
    to some great photo filters from FX Foundry (see *Photo*->Enchancement). It turns
    out that *Gimp* is the most versatile and at the same time feature-rich image
    editor for Linux. *Darktable* has enough benefits too, from OpenCL support (*Gimp*
    has this, too) to easy lens profiling, keywords editor and print preview feature.
    *Rawtherapee* has few extra options, but we really liked its powerful file browser
    that can carry out batch processing and apply edit profiles to several images
    at once; this feature in *Rawtherapee* is much easier to use than copying and
    pasting history state in *Darktable*!


    *Lightzone* contains a beautiful set of ready-to-use presets called Styles. Each
    style is a preconfigured existing filter or effect, which you can always fine-tune
    to your liking. The way *Lightzone* effects are stacked is perhaps the best one
    in terms of usability. You can have as many effects applied to the image at once
    as you like, with one of the best effects being Relight.


    Moving on to *Pixleluo*, we enjoyed the Quick Color feature, which is basically
    a set of one-click Instagram-like effects. The


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_163_0.png)


    Warp tool was also a unique tool for creating instant and fun distortion effects.
    While definitely not a tool for professionals, *Pixleluo* contains all the necessary
    functions for an average photo processing and retouching pipeline, and for many
    people this would be sufficient.


    # ### VERDICT


    | GIMP | 10/10 | LIGHTZONE | 7/10 |

    |:---|:---:|:---|:---:|

    | DARKTABLE | 8/10 | PIXELUVO | 9/10 |

    | RAWTHERAPEE | 7/10 | | |


    > > *Despite the handy Spot tool and layers, Lightzone doesn’t have many extra
    features compared with the other programs on test.*


    # ## Help and support


    Can you become a pro user easily?


    ome time ago *Lightzone* insisted on users registering their data on the website
    before obtaining permission to download the application. This is no longer an
    obligatory step, but we understand that it was a way to motivate users to participate
    on the *Lightzone* forums. But even without any registration it’s possible to
    view annotated screenshots, watch videos and consult tutorials in PDF from the
    *Lightzone* website.


    Of course, for novice users the most useful materials are those step-by-step guides
    where you can instantly see which settings lead to certain results. It’s particularly
    surprising given the fact that *Lightzone* has a dramatically smaller user base
    than *Gimp*. You can find quick help for *Gimp* online, including videos recorded
    and shared on YouTube by enthusiasts.


    Both *Rawtherapee* and *Darktable* have superb online documentation of all sorts,
    including freely available PDF books (Rawpedia and *Digital Photo Development
    with Darktable*, respectively), and it’s hard to tell which community is larger.
    The problem, though, is that a RAW file isn’t easy to edit, and both *Rawtherapee*
    and *Darktable* gives you a hundred ways to make it worse. For instance, while
    the noise reduction tools are incredible, in the wrong hands they end up fighting
    each other. We recommend that you consult a handbook before doing anything. That
    sort of things can be a challenge when working with *Gimp*. On one hand, there
    are numerous tutorials and baby steps for carrying out simple editing in *Gimp*,
    but high-profile tasks like denoising are only covered in a range of short articles,
    and require you to conduct trial-and-error experiments. That’s why we


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_163_1.png)


    Rawpedia (http://rawpedia.rawtherapee.com) is a must-read site for every photo
    enthusiast who’s keen to improve their knowledge of the RAW format.


    recommend splitting tasks between *Gimp* and a RAW editor (with which *Gimp* can
    possibly integrate).


    Predictably, *Pixeluvu* has less to offer, although there are still some useful
    sources of help. As a commercial product, *Pixeluvu* simply has to offer some
    support, including training materials and documents. The available amount is limited
    and mainly lives at the main web site (*pixeluvu.com*). We can’t blame the developer
    for that because *Pixeluvu* isn’t a popular product. The official *Pixeluvu* forum
    isn’t very lively either, though...


    # ### VERDICT


    | GIMP | 9/10 | LIGHTZONE | 8/10 |

    |:---|:---:|:---|:---:|

    | DARKTABLE | 10/10 | PIXELUVO | 7/10 |

    | RAWTHERAPEE | 10/10 | | |


    > > *Darktable and Rawtherapee come top for online help sources.*'
  merge: -1
