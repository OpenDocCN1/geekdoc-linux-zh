- pgno: 77
  md: '# # TAMING THE CLOUD


    Tiger Computing''s **Keith Edmunds** reveals how Kubernetes can be used to build
    a secure, resilient and scalable Linux infrastructure.


    +   W


    hen you want to use Linux to provide services to a business, those services will
    need to be secure, resilient and scalable. Nice words, but what do we mean by
    them? ''Secure'' means that users can access to the data they require, be that
    read-only access or write access. At the same time, no data is exposed to any
    party that''s not authorised to see it. Security is deceptive; you can think you
    have everything protected only to find out later that there are holes. Designing
    in security from the start of a project is far easier than trying to retrofit
    it later. ''Resilient'' means your services tolerate failures within the infrastructure.
    A failure might be a server disk controller that can no longer access any disks,
    rendering the data unreachable. Or the failure might be a network switch that
    no longer enables two or more systems to communicate. In this context, a ''single
    point of failure'' or SPOF is a failure that adversely affects service availability.
    A resilient infrastructure is one with no SPOFs. ''Scalable'' describes the ability
    of systems to handle spikes of demand gracefully. It also dictates how easily
    changes may be made to systems. For example, adding a new user, increasing the
    storage capacity or moving an infrastructure from Amazon Web Services to Google
    Cloud – or even moving it in-house. As soon as your infrastructure expands beyond
    one server, there are lots of options for increasing the security, resilience
    and scalability. We''ll look at how these problems have been solved traditionally,
    and what new technology is available that changes the face of big application
    computing.'
