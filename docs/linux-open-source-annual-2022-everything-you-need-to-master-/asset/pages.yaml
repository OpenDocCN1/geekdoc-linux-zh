  md: '# # Security features


    Protecting against the many hazards of the internet.


    All the applications featured in this Roundup provide different tools and solutions
    to safeguard your privacy of your communauties and the safety of your machines.
    In addition to the default settings, most also offer additional mechanisms to
    protect you with the aid of plug-ins.


    You have the choice of using Bogofilter or SpamAssassin to detect and eliminate
    spam messages when working with Evolution, KMail and Claws. With Claws, the core
    package includes several useful plug-ins including Bogofilter, but if you''ve
    installed it using your distribution''s software management utility, you must
    additionally install the claws-mail-plugins package.


    KMail''s anti-spam and anti-virus wizards help you to configure the respective
    tools. You must already have the tools installed to handle these operations, such
    as Bogofilter or ClamAV. If no tools are found, the wizard will merely inform
    you so. It doesn''t recommend any tools. Some users have reported problems with
    the wizard detecting their anti-virus tools. Worse still, when connected with
    an anti-virus utility, KMail''s performance is considerably slower, as each message
    is scanned for viruses.


    Thunderbird has an advanced junk mail filter, which learns and improves its filtering
    depending on what you mark as spam. All incoming messages pass through the filter,
    and you can get


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_123_0.png)


    Even though it says OpenPGP, it''s possible to configure Evolution to work with
    GPG as well.


    Thunderbird to warn you about potential phishing emails, and also when a link
    in a message is leading you to a website other than the one indicated in the URL.


    With the exception of MailSpring, all the clients can be configured to work with
    a spam detection and encryption, via the popular GnuPG utility.


    # ## VERDICT


    | | Score | | Score |

    |---|---|---|---|

    | CLAWS MAIL | 10/10 | MAILSPRING | N/A |

    | EVOLUTION | 10/10 | THUNDERBIRD | 10/10 |

    | KMAIL | 10/10 | | |


    Despite repeated feature requests, MailSpring still doesn''t have any encryption
    or anti-spam capabilities.


    # # Other features


    Will it make you breakfast?


    long with the web browser, the email applications are one of the most recognisable
    components of the desktop.


    What started as a means to easily communicate with your contacts have now expanded
    to behemoth projects with a vast feature set. Not all users would want their email
    client to set up reminders and double up as a calendar. But if these are things
    that you use daily, it''s probably best to use just the one tool, rather than
    several.


    Evolution, GNOME''s official Personal Information Manager (PIM), provides a calendar,
    address book and a task manager. You can get the same features with KMail, provided
    you run it on top of the KDE desktop, where it can connect with other well-known
    KDE components such as Kontact and Korgizer.


    If you frequently collaborate with non-English speakers over email, you''ll appreciate
    MailSpring''s ability to translate messages written in English into Spanish, Russian,
    simplified Chinese, French, and German. It can auto-detect your language and performs
    spell-check without changing the language settings. It''s also especially tailored
    for touch devices and supports many configurable gestures such as swipe left or
    right.


    Unlike the other tools, Thunderbird can also connect with chat accounts on various
    services so that a single application keeps record of all your communications
    with your contacts. The advantage of its multiple-channel chat support is that
    you can use the search feature to go through past conversations and emails exchanged
    with all your contacts. Should you ever have the need to perform a search on the
    web, you can do so from the search


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_123_1.png)


    As many services block email messages based on size, you can configure Thunderbird
    to connect with your account on Box.


    bar within the application itself, instead of switching over to a web browser,
    and can even choose the search engine you wish to use.


    Claws doesn''t provide as many features out of the box but you can get almost
    all the same functionality with the use of plug-ins. It can easily double as a
    news aggregator, manage appointments, and more. Evolution and Thunderbird are
    more resource hungry than the others. Something to consider if you decide to use
    these applications for more than just email.


    # ## VERDICT


    | | Score | | Score |

    |---|---|---|---|

    | CLAWS MAIL | 10/10 | MAILSPRING | 10/10 |

    | EVOLUTION | 10/10 | THUNDERBIRD | 10/10 |

    | KMAIL | 10/10 | | |


    The use of anti-spam and anti-virus plug-ins does affect performance.'
