- pgno: 35
  md: '# # User Experience

    Are they a boon or a bane?


    ightweight or not, a desktop environment is one of the most crucial elements of
    a distribution. Regardless of the features or application set with which a distribution
    ships, oftentimes it’s the look and feel, behaviour and responsiveness of the
    desktop environment which help you decide on a distribution.


    Perhaps this explains why most mainstream distributions spend a considerable amount
    of time polishing the desktop environment and ensuring a rich and rewarding user
    experience.


    But all of those careful design strategies go out the window when you swap the
    default environment with a lightweight alternative. That said, while the primary
    objective of these desktops is to save resources, it doesn’t mean they totally
    ignore the usability aspect.


    After all, no one wants to use a desktop that takes a negligible amount of memory
    but which is extremely cumbersome to operate.


    **Equinox Desktop 7/10**


    EDE isn’t the easiest desktop to install. If you aren’t running Arch, chances
    are you’ll have to manually compile it from source.


    The desktop has a retro feel to it and starts with an old-school splash screen.
    EDE adheres to the classic desktop metaphor, with a status bar at the bottom of
    the screen and the applications menu at the extreme left. You use the text box
    beside the applications menu button to run a command, which can also be used to
    quickly launch apps. There’s also a pager to switch desktops.


    The right-click context menu offers the traditional options and helps place icons
    on the desktop and change the wallpaper. You can tweak other settings with the
    desktop configuration app, which provides a bunch of tools to customise other
    basic elements. Advanced options can only be set by editing txt files, which robs
    the desktop of some usability points.


    **Lumina 7/10**


    From our experience, getting this desktop to work on Linux is a really cumbersome
    process. It’s unstable and behaves abnormally atop most distributions, with frequent
    crashes and weird graphical artifacts pasted across the desktop.


    Instead of a traditional splash screen, Lumina instead displays a quote. The desktop
    has a clean layout, with a status bar at the bottom. The right-click context menu
    has a number of useful options, including an applications menu. This is a good
    thing” because the default applications menu takes a little getting used to. In
    the default view it only displays favourite apps, and it takes an additional click
    to get to the full list of installed apps.


    There’s also a textbox to help you zero in on the app you wish to launch. Besides
    the apps, you can also launch the file manager and the Lumina configuration utility
    from this menu.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_35_0.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_35_1.png)


    # # Help and support

    What to do you when you''re stuck?


    DE’s official wiki has instructions on how to compile it for various desktops
    – but the majority of the documentation is geared towards helping developers contribute
    to the project. Also, unlike some of its peers in this Roundup, EDE gets very
    little coverage on other websites besides its own, primarily due to its slow rate
    of development.


    Lumina is the default desktop of TrueOS BSD, but has been ported to various other
    BSDs and Linux distributions. Despite having a website of its own, the desktop
    offers little information to help you get started. The project engages with the
    community using the Lumina Desktop Telegram channel. Besides these, there are
    no avenues for seeking help, so if you’re stuck it’s best to take the issues to
    your distribution’s forums.


    Moksha is the official desktop of Bodhi Linux but has been ported to other distributions
    as well. The desktop doesn’t have a support infrastructure of its own and shares
    the one from the larger Bodhi Linux project. By contrast, LXQt boasts ample documentation
    and avenues for engaging with the user community should you need assistance. There
    are mailing lists for both users and developers, as well as fairly active forum
    boards. There’s a wiki which covers installation of the binary packages for various
    distributions as well as instructions for compiling the desktop from source.


    Similarly, given Openbox’s age the project has extensive documentation and support
    from both official and unofficial sources. The project’s website is a wiki with
    loads of information to help orientate new users. If you’re stuck, there’s a high
    probability that your distribution has an official support channel.


    VERDICT


    | EQuINOX DESKTOP | 4/10 | MOKSHA DESKTOP | 4/10 |

    | LUMINA | 4/10 | OPENBOX | 8/10 |

    | LXQt | 8/10 |


    If you''re using a lightweight desktop on your regular distribution, go with the
    one that has active support options.'
