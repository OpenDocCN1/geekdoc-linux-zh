  md: '# Arch-based distros

    **The Verdict**


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_22_0.png)


    F or some users, having a purely GTK or Qt system will be a boon, even if it drastically
    restricts the number of applications that are available to them. For those people
    Antergos, and in particular KaOS, may have some appeal. Others will be happy that
    cross-toolkit theming is in much better standing than it once was and not mind
    installing both toolkits. Storage is cheap, after all.

    In many ways we felt that KaOS should be offering never KDE packages, being as
    it does hit the Arch repos soon after release. Of course, KDE neon is considered
    the premier distro for showing off the latest and greatest on planet Plasma, so
    maybe there’s no point competing with that. The Blue Systems sponsored Netrunner
    Rolling is a fine effort, but we felt it was trying to cover all bases.

    Fantastic efforts of each distro notwithstand ing, users who are unfamiliar with
    Arch and its ways of working will sooner or later find themselves confused. Manjaro
    may be the most user-friendly of this month’s picks, but Ubuntu or Mint it is
    not, and treating it thusly will lead to disappointment. (Life is full of disappointments,
    but that’s a story for another Roundup.) You’ll probably have to get your hands
    dirty at some point. Conversely, if you’re familiar with Arch then you may very
    well prefer to stay there (up on that high horse you mean? – Ed), or perhaps take
    inspiration from these distros and apply it to your Arch install. We were certainly
    enamored by ArchLabs’ desktop zen, and what can be done with a less than 200MB
    memory footprint.

    Manjaro does a great job with its flagship Xfce edition. It shows that this desktop
    is capable of looking good as well as being considerate on resources. It’s become
    hugely popular over the past year, not so much because of people’s gripe with
    Ubuntu, but because it’s a darn fine distro that gives people exactly what they
    want. When Xfce 4.14 is released and journalists become tired of making jokes
    about that, this will surely become ever the more greater.

    The Gnome and KDE flavours are fine too. Great if you prefer the latest desktop
    fripperies, but we admire Manjaro’s boldness in focusing on Xfce.


    **1st  Manjaro   9/10**

    Web: https://manjaro.org Licence: Various

    Version: 18.10

    Manjaro has tamed Arch into something both humans and robots can enjoy.


    **2nd ArchLabs   9/10**

    Web: https://archlabslinux.com Licence: Various

    You don’t need an ancient machine to enjoy a lightweight distro.


    **3rd Antergos   8/10**

    Web: https://antergos.com Licence: Various

    Version: 18.11

    Fantastic installer and a great all-round distro.


    **4th Netrunner Rolling   7/10**

    Web: https://netrunner.com Licence: Various

    Version: 2018.08

    KDE Plasma and Arch are a winning combination, but still a few rough edges.


    **5th KaOS   7/10**

    Web: https://kaosx.us Licence: Various

    Version: 2018.10

    One for Plasma/Qt purists, but this makes it limiting for everyone else.


    # » ALSO CONSIDER


    Several Arch-based distros have come and gone over the years, but some have stood
    the test of time and now ones spring up regularly. It’s common for distros to
    add non-free software to improve the user experience, but Parabola and more recently
    Hyperbola go to the other extreme. These two, as well as being named after curses,
    are both FSF-approved and use the Linux-libre kernel. Hyperbola takes inspiration
    from Debian, using an older, tried ‘n’ tested kernel. Arch may have stopped supporting
    32-bit, but the Arch Linux 32 distro is alive and well.

    Arch-Xference and Anarchy Linux, both Xfce affairs, are worth a look. Chakra Linux,
    a KDE offering, impressed us last year, but hasn’t been updated since then. Those
    wanting something even more lightweight than ArchLabs should check out ArchBang,
    which was inspired by the now-defunct CrunchBang. In a roundabout way this inspired
    ArchLabs too.'
