- pgno: 12
  md: '![](img/3f314b57ad3c8b08d25e5d1ab47de56d_12_0.png)


    Learn about history, science and, er, celebrities with Endless OS. The possibilities
    are, well, endless.


    hardware (budget small form-factor PCs aimed at developing countries), the Debian
    based distro is now available to all and comes in a few forms. The full desktop
    edition (available in seven languages) is a whopping 16GB in size, but includes
    the full text of Wikipedia, several Khan academy lectures and Endless'' own educational
    tools. It''s aimed at offline, and even off-grid usage. There''s a more conventional
    desktop version (only 3GB), a VirtualBox image and finally an image for the Raspberry
    Pi 4. Besides their hardware (including the Spark kids'' laptop) their educational
    contributions (such as their immersive Terminal Two coding tutorials, see https://terminaltwo.com,
    Endless has taken a particularly innovative approach to system updates.


    Such updates are a necessary inconvenience, but Microsoft has unfortunately turned
    a lot of people against them. Most egregiously when it force-updated thousands
    of Windows 7 machines to Windows 10, in many cases breaking them. But also, unless
    you tell Windows 10 to do otherwise, it has a habit of forcefully installing large
    updates at shutdown time (no good if your computer is in the same room you sleep
    in) or at boot time (no good if you actually wanted to use your computer when
    you turned it on). Another sad situation is when disk space is low, large updates
    will download and not be able to install. In some cases (particularly cheap tablets)
    this can make them entirely unbootable.


    Linux updates tend not to be so disruptive, but they do on occasion break things.
    This is particularly upsetting for new users, especially if they''re confronted
    with a confusing error message and a busybox shell or worse, a blank screen. It
    easy to blame these issues on user error, or the Nvidia driver, but people shouldn''t
    have to learn all about chrooting and modifying system files just to get their
    desktops back.


    Linux Mint concedes this, and that''s why it launched its Timeshift tool for rolling
    back updates. Endless OS goes one step further: The whole filesystem is updated
    at once. This so-called atomic upgrade uses OSTree, itself described as "Git for
    filesystems" (or in this case operating systems). Of course, this doesn''t mean
    every Endless OS device ends up with exactly the same filesystem (that wouldn''t
    work unless every device was identical, hardware and software-wise. Every device,
    configuration files (say, everything in /boot and /etc) are layered atop the base
    OSTree image, and individual applications are installed as Flatpaks. You can roll
    back the entire OS to a previous version of the OS (just like you can switch Git
    branches) at the press of a button. While the underlying OS is based on Debian,
    you can''t readily use apt and .deb packages (or any


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_12_1.png)


    traditional packaging format) on Endless OS. The OSTree/Flatpak combination makes
    for a bulletproof platform because the root filesystem is read only. Even if the
    power goes out mid-upgrade, the previous incarnation of the OS will still be accessible
    and the upgrade can be resumed. Installing an application won''t break the base
    image because Flatpaks are self-contained. OS tree images are incremental too
    (only changes between versions are stored) and so the ability to roll back to
    a previous version doesn''t come with a huge disk space cost.


    > Mint gives users what they want: a traditional menu in the corner, a powerful
    file manager and beautiful desktop backgrounds.


    # >> NEXT-GEN APP DISTRIBUTION


    Flatpaks, Snaps, AppImages: they all seek to make it easier for developers to
    ship software in a distribution-agnostic manner. Whereas Snaps rely on a central
    app store, anyone can set up their own Flatpak remote. The Flathub repo (https://flathub.org)
    is a good place to find popular apps. Flatpaks are OSTree images too, which is
    why the two integrate so nicely in Endless OS. When you download your first (non-trivial)
    application on Endless OS (or your first Flatpak on another OS), you''ll find
    the download is very large. This is because it depends on a large runtime (e.g.
    Gnome) Flatpak. Once you have this you won''t need to download it again for Flatpaks,
    which depend on it. These runtime Flatpaks are updated incrementally, so subsequent
    large downloads should be a rarity and (unlike deb packages) there are no issues
    with requiring a particular version. Fedora''s Silverblue desktop distribution
    brings atomic upgrades to the Fedora ecosystem. Here, a hybrid packaging system,
    RPM-OStree, is used so that the base OS image can be modified in layers. This
    is useful for installing low-level packages such as drivers and shells. Conventional
    desktop programs are installed this way, and there''s also support for containerised
    workloads.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_12_2.png)


    # The Future of Apps OS-agnostic


    Apps OS-agnostic, best of all desktop operating systems


    Flatpaks and Snaps also take the burden of packaging away from distros.'
