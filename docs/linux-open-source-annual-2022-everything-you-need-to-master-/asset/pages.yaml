- pgno: 169
  md: 'FOSS


    # Disk tools


    Keep your hard drive in top-top shape, recover lost data or delete it safely.


    # FOG


    The constant barrage of repetitive tasks such as running checks, troubleshooting
    errors, swapping out dead hard disks, doing fresh installations over and over
    again can sap the energy out of any system admin, irrespective of the size of
    their network. Using *FOG* you can image and clone machines from the comforts
    of the admin HQ.


    *FOG* is a complex piece of software and offers plenty of options, with various
    fields to describe the host images. It can also arrange them into groups for easier
    management. There are also several options to schedule the imaging process. *FOG*
    can also be used to debug imaged computers, remotely wipe hosts and more. The
    server also handles regular admin tasks such as installing software and can even
    manage printers on the network. The *FOG* server is scalable and can manage large
    networks spread over multiple locations in the same building or on the other side
    of the planet. One of the most useful features of the *FOG* server, especially
    for admins of larger networks, is the multicast ability. Using this feature you
    can deploy multiple machines in one go. To supplement it on such large networks,
    you can have multiple *FOG* installations configured as storage servers that help
    take the load of the main *FOG* server when imaging computers. https://fogproject.org


    # DUPLICATI


    An easy-to-use backup application, *Duplicati* enables you to fine-tune the list
    of locations you want to preserve by either defining filters or toggling one of
    the predefined options to exclude certain types of files. You can manage the tool
    via a browser-based interface. The program breaks down critical tasks into wizards
    and also exposes just the right number of features for the job in hand, while
    advanced options are just a pull-down menu away. Files are encrypted with AES-256
    and you can also use GPG before sending the backups to their destination. *Duplicati*
    also compresses all data before it''s encrypted. It supports Zip and 7Z compression,
    and can skip compression of already compressed files such as MP3 and JPG. www.duplicati.com


    # PHOTOREC


    *Photorec* is a nifty little command-line based tool that can restore accidentally
    deleted files. When you delete a file, the file system just marks it as deleted,
    and makes the space the file occupies available to other files. *Photorec* works
    by recovering such files that are missing regular metadata such as a filename.
    Despite its name, the CLI utility can sniff files in various formats. www.cgsecurity.org/wiki/PhotoRec


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_169_0.png)


    Photorec is part of almost every recovery distro and ships along with TestDisk.


    # GPARTED


    One of the best graphical utilities to manage partitions, you can use *GParted*
    to create, delete, resize, move and copy partitions while preserving the data
    they house. The program works with all kinds of hard disks, SSDs, and RAID devices
    and supports all the filesystem in vogue. https://gparted.org


    # SECURE-DELETE


    The secure-delete package contains various utilities to securely delete files
    and wipe all traces of data in the free space on the disk. There''s *shred* that
    make it impossible to remove any deleted files, *sfill* to wipe all data from
    the free space on the disk, and *sswap* to wipe data from the swap partition.
    https://smr.sourceforge.net


    # CDEMU


    The *CDEmu* tool enables you to mount disc images in various formats including
    ISO, bin and img. The *CL tool* also has several graphical front-ends for Gnome
    and KDE desktops. https://cdemo.sourceforge.io


    # DUC


    If you''re looking to free up some disk space, use *Duc* in the first instance
    to gain a better idea of the files occupying the space. The tool does a better
    job in inspecting your hard disk than the file manager. https://duc.zew.nl


    # DDRESUE


    Try image a failing drive with *ddrescue* before attempting recovery. The utility
    doesn''t write zeros to bad sectors, and tries to fill in the gaps without wiping
    out the data already rescued. www.gnu.org/software/ddrescue


    # PYDF


    A replacement for *df, pydf* is a Python script that highlights the different
    types of filesystems. It has an large set of configurable parameters and various
    options to control its output. https://pypi.org/project/pydf


    # SMARTCTL


    Bundled as part of the smartmontools package, the *smartctl* utility controls
    and monitors the SMART system built into hard disks. Use the tool periodically
    to run self-assessment health checks on the disks. www.smartmontools.org


    170'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# # File management


    Control your data, where it can be accessed, and archive it, too.


    # » EICIEL (45)


    Everything in Linux is a file and the access control list (ACL) helps determine
    the access rights for each file. You can modify the permissions from the command
    line or use the graphical *Eiciel* utility that 5 in the official repositories
    of most distros. https://rofi.roger-ferrier.org/eiciel


    # » NEXTCLOUD


    Online storage services are a convenient option for accessing and sharing your
    data anywhere on the planet. With *Nextcloud* you can roll out a hosted storage
    server that gets you the convenience of an omnipresent storage service without
    shelling out wads of cash and your data to a third party.


    Installing and rolling out *Nextcloud* is a fairly straightforward and well documented
    process. It has a feature-rich and intuitive web interface that shouldn''t prove
    to be difficult to navigate even for first-time users, which is a feat in itself
    considering the sheer number of features it wraps underneath. The project scales
    well and can be used on a home network as well as an enterprise one. You can use
    its administration section to hook it up with other related network services such
    as a directory server to import users.


    Sharing files with other users on the network or publicly via URLs is simple enough.
    The server ensures that changes made to shared files are synced to all users.
    It can also access files stored on a variety of cloud services such as Amazon,
    Google and Dropbox.


    https://nextcloud.com


    # » FSLINT


    You can use the graphical *FSLint* tool for a comprehensive cleanup of your file
    system. It can remove duplicate files, temporary files as well as files that are
    otherwise difficult to locate and remove, such as files with invalid names, empty
    directories and bad IDs.


    www.pixelbeat.org/fslint


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_170_0.png)


    # » OPEN MEDIA VAULT


    If you need more protection for your data than a simple back-up solution, then
    you need to convert an unused computer (or even a Raspberry Pi) into a dedicated
    network attached storage (NAS) device with the Debian-based *Open Media Vault*
    (OMV) server.


    *OMV* is straightforward to roll out and simple to manage, thanks to its well-designed
    browser-based user interface, which makes it suitable for even non-technical users.
    It supports all the popular deployment mechanisms, including several levels of
    software RAID, and you can access the data it holds using all the popular network
    protocols such as SSH, SMB/CIFS, FTP and Rsync. The server also has an extensive
    permissions systems to control access to the shared volumes and folders. The server
    is modular and can be extended with a variety of official and third-party plugins.
    For instance you can turn your NAS into a torrent client to download data directly
    into the NAS storage or use it to stream stored music across the network.


    www.openmediavault.org


    # » SYNCTHING


    The open source alternative to the popular but proprietary *BitTorrent Sync, Syncthing*
    can sync your files between computers over your LAN or across the web. The service
    uses a global discovery service to connect clients anywhere on the internet.


    https://syncthing.net


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_170_1.png)


    # CATFISH


    A graphical alternative to the find and locate CLI utilities, *Catfish* is a versatile
    tool that has various options to help you prune the search results and find the
    file you were looking for.


    www.twotoast.de/index.php/catfish


    # PEAZIP


    The graphical compression utility can read most archiving formats and boasts of
    some useful data security features such as the ability to create archives with
    encryption and two-factor authentication.


    www.peazip.org


    # EXITOOL


    A CLI utility for working with metadata in images, *exiftool* helps you manipulate
    the files based on their metadata. Users can also use it to strip all metadata
    before sharing images online.


    www.sno.phy.queensu.ca/~phil/exiftool/


    # TKDIFF


    A graphical front-end to the *diff* utility, you can use *Tkdiff* to compare two
    files. The tool can connect with a range of source code management systems and
    has several other features.


    https://tkdiff.sourceforge.io


    # RANGER


    *Ranger* has a curses-based interface that works inside the console. The tool
    supports VI keybindings, makes use of the file launcher and is able to preview
    images and videos.


    https://github.com/ranger/ranger'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# # Communication


    Chat securely or set up your own social network. In your face, Facebook!


    # **» JITSI**


    An all-in-one instant messaging app, Jitsi has an impressive set of audio and
    video-conferencing features. As a VoIP client, it enables you to make calls using
    the Session Initiation Protocol (SIP). It has all the features you’d expected
    from a softphone in that it can mute, put on hold, transfer and record calls.
    It can also make registrar-less SIP calls to other Jitsi users on the local network.


    You can use Jitsi to make video calls to one user or to several on both SIP and
    XMPP networks, while using Jitsi Videobridge, you can host multi-user video calls.
    It’s also a capable IM client with several unique features including the ability
    to stream and share the desktop of users at both ends of the call at the same
    time. [https://jitsi.org](https://jitsi.org)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_171_0.png)


    # **» ROCKET.CHAT**


    Billing itself as the ‘ultimate chat platform’, Rocket.Chat is filled with useful
    features. In addition to essentials ones like threaded conversations and the ability
    to edit and delete messages, the collaborative communications server offers several
    interesting ones such as live chat, with which you can use Rocket.Chat to have
    conversations with visitors to your website.


    You can roll out Rocket.Chat on a snap-supported distro with a single command,
    and it also support deployments over Docker and a wide range of PaaS services.
    It can also import your data from another service like Slack or Hipchat and with
    the SlackBridge plug-in can also mirrros messages received in a Slack channel
    or private group into Rocket.Chat in real-time.


    # **» TOX**


    If regular IM clients aren’t secure enough for you, use the Tox IM protocol which
    encrypts all chats with the NaCl encryption library and instead of a central server,
    routes them over direct P2P connections between users. The IM uses Tox IDs, which
    are public keys of peers instead of a user account and also allow for greater
    anonymity. [https://tox.chat](https://tox.chat)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_171_1.png)


    There are several apps that can communicate using the Tox protocol and one of
    the most popular ones is Qtox, which works on several platforms.


    Rocket.Chat also enables you to have a video conference with your team. You can
    also record and send voice messages to a public or a private conversation. [https://rocket.chat/community](https://rocket.chat/community)


    # **» BEEBEEP**


    An IM client with a difference, BeeBEEP is designed to connect you directly with
    peers on your network. It’ll automatically detect other BeeBEEP users on the network
    and provides all the features of a modern chat client and apart from encrypted
    text messages, can also share files. [http://beebep.sourceforge.net](http://beebep.sourceforge.net)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_171_2.png)


    # **» OPENFIRE**


    There are several XMPP-based IM servers available but Openfire is one of the easiest
    to manage. It implements many of the commonly used functions of the XMPP protocol.
    While you can use any XMPP-compatible IM client to chat through Openfire, it works
    best with its own Spark client. [www.igniterealtime.org/projects/openfire](www.igniterealtime.org/projects/openfire)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_171_3.png)


    Rocket.Chat enables you to preview links shared during a conversation including
    those from popular services like Twitter and YouTube.


    # **SIGNAL**


    The Signal messaging app helps secure communications over the mobile network.
    The app is endorsed by top security experts and uses end-to-end encryption to
    secure all your text, audio and video calls. [https://signal.org](https://signal.org)


    # **RIOT.IM**


    The Matrix protocol enables users registered with one service provider to seamlessly
    communicate with users of another. Riot.im is one of the best clients based on
    the federated Matrix protocol. [https://about.riot.im](https://about.riot.im)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_171_4.png)


    # **RETROSHARE**


    A P2P communications and file sharing platform, Retroshare creates encrypted connections
    between friends. You can add friends by sharing your keys privately or you can
    exchange them via a chat server. [http://retroshare.net](http://retroshare.net)


    # **SOGO**


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_171_5.png)


    One of the best alternatives to MS Exchange, SOGo has all the necessary groupware
    functions with native desktop and mobile clients. Try the online demo before deploying
    it on your server. [https://sogo.nu](https://sogo.nu)


    # **HUMHUB**


    With HumHub you can deploy your own social network on the internet network. It
    has all the standard social networking features you’d expect and the project’s
    website hosts an online demo as well. [www.humhub.org](www.humhub.org)'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# # Productivity


    Put some order into your life with these finance, web filtering and admin tools.


    # ## OSMO


    A personal information manager (PIM) helps you keep track and organise all the
    information coming in from various sources. Osmo is a lightweight PIM that helps
    manage appointments, tasks, contacts and notes. The application has a straightforward
    and integrated interface with four tabs on the top for Calendar, Tasks, Contact
    and Notes.


    The program lacks any menus, but the action-linked buttons at the top change as
    you switch between the four components. The Calendar pane provides a simple functional
    calendar along with some related information such as the week number and the number
    of days to the end of the year. You can double-click a date to add notes or right-click
    a date to add a task.


    The options for defining a task in Osmo are housed within a basic and an advanced
    tab. Use the basic tab to define the due date and time and assign the task a priority,
    while the advanced tab enables you to mark the task as recurrent and define relevant
    properties. You can store the address of your contact using the Contacts pane.
    It sports additional features including a search function, a birthday browser,
    as well as the ability to point out the address of a contact on Google Maps. The
    Notes pane makes it possible to jot down text using rich text editing functions
    and you can optionally encrypt all your notes using a password. http://clayo.org/osmo


    # ## FOCUSWRITER


    Scribble without distraction with the FocusWriter text editor, which runs full-screen
    and uses an auto-hide menu for a clean workspace. The editor supports the popular
    text formats and has basic support for ODT files as well. The primary goal of
    FocusWriter is to enable you to focus on the writing, so while the tool might
    lack some of the dexterity of the mainstream text editors, it has several unique
    features that are more tuned towards this objective. You can set alarms to trigger
    after a certain period has elapsed, or at a particular time and also set yourself
    targets in FocusWriter. An interesting feature is Focused Text, which fades out
    everything except the section you''re typing – a whole paragraph, a block of three
    lines, or just the current line. https://gotcode.org/focuswriter


    # ## GATESENTRY


    A simple web filter, GateSentry works on Linux as well as the Raspberry Pi. It''s
    easy to deploy and configure. GateSentry authenticates users and filters traffic
    by websites, content type as well as by time. The simple proxy server can display
    data consumption statistics and can also enable you to remotely disable a user''s
    access. http://gatesentryfilter.abdullahfarhan.com


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_172_0.png)


    GateSentry can also filter traffic over HTTPS once you install its certificate
    on your devices.


    # ## KIMAI V2


    Kimai tracks work times and prints out a summary of your activities. It can be
    used for a single user or multiple ones and can manage multiple customers, projects.
    The program has a browser-based dashboard that you can fiddle around with using
    the demo installation on the project''s homepage. https://V2.kimai.org


    # ## SIMPLESCREEN RECORDER


    Contrary to its name, SSR is flush with features and gives its users a good amount
    of control over the screencast. The tool can record the entire screen and also
    enables you to select and record windows and regions on the desktop. www.maartenbaert.be/simplescreenrecorder


    # ## TURTL


    A note-taking tool with a focus on privacy, Turtl has an impressive list of features.
    It can create different types of notes and makes it possible for you to attach
    images and other files to the notes that you''ve created. https://turtlapp.com


    # ## DICTION


    A CLI utility, Diction helps flag words that are commonly misspelt. It can create
    better copies by flagging words that are commonly associated with beginner''s
    mistakes and to even suggest better wording. www.gnu.org/software/diction


    # ## TASK COACH


    A simple to-do manager, Task Coach simplifies the process of defining and following
    up on tasks. You can also use the tool to assign a priority to tasks along with
    a completion date and an optional reminder. www.taskcoach.org


    # ## EQONOMIZE


    Eqonomize is a personal expense manager with a clean interface and all the features
    you need to help organise your finances. The program can track single or multiple
    accounts and fix budgets. https://eqonomize.github.io


    # ## STRETCHLY


    A simple app that pops in to remind you to take a break. It has a couple of preset
    break intervals and the break windows share ideas to help you relax. You can control
    the tool from its tray icon. https://hovanic.net/stretchly'
