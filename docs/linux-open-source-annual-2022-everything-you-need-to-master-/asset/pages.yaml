  md: '# ## Word processor


    # Let your inner Shakespeare shine!


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_114_0.png)


    The word processor in Caligra Suite is called Words. Unlike the other word processors
    however, Caligra Words features a sidebar on the right that’s used to tweak the
    different formatting options on the document, such as inserting comments, or headers
    and footers, and so on.


    Apart from this default sidebar that you can’t dismiss, the application also provides
    many different elements, called dockers. These include document statistics, add
    shape and more. Each of these elements takes quite a lot of the space on the screen,
    leaving precious little for your actual document. Despite excessive and constant
    resizing of the different dockers, and closing the ones you don’t need, you’ll
    be left with almost no room to even access the comments field! Because of its
    vastly different design, the tool isn’t the easiest to work with, especially if
    you’ve ever worked with a word processor before.


    Google Docs enables you to search for topics online, and drag the results into
    a document, automatically adding citations, but that’s the extent of its USP,
    aside from being online.


    Both LibreOffice Writer and Caligra Words boast of out-of-the- box support for
    various formats, including Open Document Format and Microsoft Office’s proprietary
    formats. Unfortunately, both these applications tend to distort the document’s
    appearance somewhat when working with doc or docx files. Whereas LibreOffice Writer
    miserably fails, more often than not, to identify text formatting and renders
    the document quite differently to the original, Caligra Words fares far better.
    Yet even Caligra Words sometimes has difficulty with rendering numbered lists,
    and messes up the margins.


    Of all the applications featured in this Roundup, OnlyOffice provides the best
    support for Microsoft Office formats, and flawlessly opened all the files that
    we tested. Unlike the other tools, the comments added to a document are displayed
    on the left, but the interface is otherwise quite similar to the ribbon style
    on Microsoft Office.


    The biggest drawback of WPS Writer is that it doesn’t support Open Document Format
    (ODF). The FAQ itself explains that the developers might consider adding ODF functionality
    when they have a larger team of developers, or gather enough users to justify
    devoting the time and effort that’s required for implementing ODF support. But
    for now, ODF is in WPS Writer’s pending tray.


    # VERDICT


    | CALIGRA SUITE | 6/10 | ONLYOFFICE | 10/10 |

    | GOOGLE DOCS | 7/10 | WPS OFFICE | 5/10 |

    | LIBREOFFICE | 10/10 | | |


    > Caligra fares poorly because of its cluttered interface, while WPS Office trails
    in fifth place because it doesn’t support ODF.


    # ## Spreadsheet


    # Number crunching made easy.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_114_1.png)


    The spreadsheet applications on the different office suites offer nearly the same
    functionality. At the minimum, they each provide a number of functions to create
    formulas and perform complex calculations. Besides performing basic mathematical
    functions, all the spreadsheet applications boast of built-in functions for common
    financial and statistical operations. One of the best features of these modern
    replacements for pen and paper worksheets is what’s known as what-if analysis,
    where you change one field of data and see the tools automatically change the
    values of associated fields.


    LibreOffice Calc and WPS Spreadsheets hold the distinction of being among the
    easiest to use. In addition, Calc boasts of many wizards to help you use its advanced
    functions. You can easily pull data off databases, and collaborate with other
    users, which makes it ideal for most office setups.


    Google Spreadsheets isn’t that far behind, and as with all the other Google Docs
    applications, it too provides many different templates to choose from. The documentation
    is on point, and precise in the help it offers.


    All the programs support a variety of formats and enable you to export the data
    as either a PDF or CSV file, and with the exception of Calc and Sheets all default
    to the xlsx format. The applications also look fairly alike, with Caligra Sheets
    being the only exception. Once again, the reliance on dockers to provide different
    functionality makes working with Caligra an unintuitive experience, despite the
    fact that it provides the same functionality as other applications, such as LibreOffice
    Calc.


    # VERDICT


    | CALIGRA SUITE | 7/10 | ONLYOFFICE | 9/10 |

    | GOOGLE DOCS | 10/10 | WPS OFFICE | 10/10 |

    | LIBREOFFICE | 10/10 | | |


    > Once again, Caligra suffers because of its interface and not the features on
    offer.'
