  md: "# Do more\n\nIf you don't have more than one machine to play with, you can\
    \ make a comparison plot of any parameters you can tune. One particularly useful\
    \ plot is to compare different compiler options, to see which is fastest.\n\n\
    to do this once on each, if you have three it will be twice on each, and so on.\
    \ This is because MPI on each machine needs to be able to talk to every other\
    \ machine, and you won't be able to type in the password once the program is running.\n\
    \nNow you'll need to let Open MPI know what machines you want it to use. To do\
    \ this, create a text file called *hostfile.txt*, and in it write down the hostname\
    \ of each computer you want to use. Repeat the name as many times as you want\
    \ processes to run on that machine; for example, if you want your dual-core laptop\
    \ called *pgmy* to join in a computation with a six-node workstation called *pyxis*,\
    \ *hostfile.txt* will look like:\n\n```\n```\npyxis\npyxis\npyxis\npyxis\npyxis\n\
    pyxis\npgmy\n```\n```\n\nWith the setup all done, you can test your new cluster\
    \ with the command\n\n```\n```bash\n$ /sombrero.sh -H hostfile.txt -s small\n\
    ```\n```\n\nIn an ideal world, this will be faster than the score for one computer.\
    \ That's not guaranteed, though – that depends on how fast your network is, and\
    \ how fast the other computers are. Since the individual steps of the benchmark\
    \ have to happen in lock-step across the entire cluster, the process will be dictated\
    \ by the slowest machine. Because of this, removing a particularly slow computer\
    \ from the mix may enable things to speed up.\n\nThis is a problem that occurs\
    \ frequently in 'heterogeneous computing'. For many problems, load-balancing techniques\
    \ can be used to adjust the amount of work each machine does based on its capability;\
    \ however, most benchmarks don't bother with this, both because the underlying\
    \ problems don't lend themselves to it, and because the systems that will be tested\
    \ generally have very uniform components.\n\n# Pursue the need for speed\n\nSo\
    \ far, you've been running *Sombrero* with the default compiler settings, which\
    \ are `-std=c++-g-03`. Now, those are fine settings to use for testing, but won't\
    \ get the highest possible performance numbers for your system. To get this, you\
    \ need to give the compiler more directions on what you want it to do to get the\
    \ best performance. You do this by editing the *Makefile* file, which defines\
    \ variables to be read by the compiler. Opening this file in your favourite text\
    \ editor, you'll see:\n\n```\n```makefile\n#Compiler\nCC = mpicc\nCFLAGS = -std=c++-g-03\n\
    LDFLAGS =\n```\n```\n\nSince we installed GCC earlier, you might expect to see\
    \ `CC= gcc`; instead, `mpicc` is used. `mpicc` is a wrapper around GCC that Open\
    \ MPI provides, and makes sure that all the correct communications libraries are\
    \ linked.\n\nTo start with, the `-g` flag enables debugger symbols. This is useful\
    \ when you're debugging problems with software, but can in some cases slow down\
    \ performance slightly. Remove this flag now, and run `make` again. Re-running\
    \ *Sombrero* now, either on your local machine or across a cluster, should reveal\
    \ a slight speed increase compared to the previous run. The next step is to tell\
    \ the compiler what kind of processor you're going to run on.\n\nBy default, GCC\
    \ only allows itself to use processor features that are on a generic x86-64 CPU\
    \ – this limits it to features from processors released in 2003. CPUs have come\
    \ a long way since then, so enable GCC to use these new features by adding the\
    \ flag `-march=native`. If you want to run on a different machine than the one\
    \ on which you're compiling, you can pass other options than `native` to the architecture\
    \ parameter; the GCC manual has the full story. Re-compile with `make` and re-test\
    \ now, and you should see a more significant increase in performance.\n\nGCC has\
    \ hundreds of knobs you can tune to try and extract the best possible performance\
    \ from your machine. You can browse the full list at `https://gcc.gnu.org/onlinedocs/gcC/Options.html`.\
    \ This might seem like cheating, but it's an important part of both benchmarking\
    \ and running software on large machines. The compiler is designed for a wide\
    \ range of software and hardware, so sometimes needs help to know how best to\
    \ make your software run. On a typical desktop, the performance difference is\
    \ small enough that compiling every piece of software from scratch and testing\
    \ every option will spend more time than it saves. But when the software you're\
    \ working with is running on hundreds or thousands of identical machines for weeks\
    \ or months at a time, you want to make sure that you're not wasting even five\
    \ per cent of the available power.\n\n# »TESTING AT SCALE\n\nSince supercomputers\
    \ rely heavily on their high-speed network to let computations be distributed\
    \ across many nodes, it's important to test how well this works. There are two\
    \ ways this can be done: weak scaling tests, where the problem size grows with\
    \ the number of nodes used, and strong scaling tests, where the same problem is\
    \ divided into smaller and smaller chunks. *Sombrero* supports both kinds of tests,\
    \ defaulting to strong scaling, since that is the harder problem. If you have\
    \ enough computers available, you can run a strong scaling test. First, set up\
    \ a set of node lists, called `nodelist1.txt`, `nodelist2.txt` and so on, using\
    \ multiples of 2 and 3.\n\n```\n```bash\nfor N in NODES in 1 2 3 4 6 9 do\n  \
    \  /sombrero.sh -H ${N}x$(NODES).txt -s small \\| awk \\\n        '{BEGIN {printf(\"\
    %5d\",\"NODES\")}; \n        /^\\[RESULT\\]/ {Case;\"$Glops.seconds/\" (printf(\"\
    %*\" %$)}\n        END {printf(\"\\n\");} }} \n        >> strongdat\ndone\n```\n\
    ```\n\nThen, to plot the results:\n\n```\n```\ngnuplot> set style data linepoints\n\
    gnuplot> plot for [i:1:6] 'strong.dat' \\ \n    using 1:(column(+i)) title 'SOMBRERO'i\n\
    ```\n```\n\nThe ideal case is a straight diagonal line; in reality, the more nodes\
    \ are used, the further from straight the line gets, as more and more communication\
    \ has to happen.\n\nIn more extreme cases, a hardware manufacturer will rewrite\
    \ all or part of a benchmark to be faster on their hardware. Again, while this\
    \ seems unfair, in some cases"
