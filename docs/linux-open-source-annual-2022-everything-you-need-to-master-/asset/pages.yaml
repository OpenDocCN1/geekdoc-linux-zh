- pgno: 11
  md: '# User-friendly usability


    Some Linux distributions go out of their way to make new users feel comfortable.
    We shine a spotlight on those welcoming distros.


    Let''s look at Linux Mint first, which continues to be a favourite of ours. In
    particular, it’s one that we still recommend to users who are taking their first
    steps with Linux. Initially (the 1.0 release in 2006 was a beta based on Kubuntu),
    it took the Ubuntu codebase and bundled flash and Wi-Fi firmware to make for a
    better out-of-the-box experience. It experimented with its own codebase for a
    couple of years, but then returned to Ubuntu’s and since then the two have always
    been package-compatible. It enables Mint to piggy-back off the treasure trove
    of packages in the Ubuntu repositories, while still providing its own experience.
    When Ubuntu switched to its Unity desktop, Mint offered something more conventional
    in the form of its Cinnamon desktop (which first appeared in Mint 13). Cinnamon
    was initially based on Gnome 3, but soon became its own thing. For die-hard traditionalists,
    they also offered the then fledgling MATE desktop a fork of Gnome 2. Both Cinnamon
    and Mate continue to thrive, while Unity has been abandoned by Canonical (though
    the latest version lives on in the UBPorts mobile OS, and the permissive edition
    is still tended to by a small but loyal community). When Ubuntu 18.04 was released,
    sans 32-bit ISO, Mint went ahead and produced its own (32-bit packages were still
    built for 18.04, this is not the case for the latest edition, so Mint 20 is 64-bit
    only). We’re still waiting for Mint 20 to arrive and Clem and the team have remained
    largely shrunk about what to expect. In previous releases, it’s seen as much about
    what they’ve removed from Ubuntu as what they’ve added. For example, the ‘anonymous’
    telemetry information that you have to opt out of sending in Ubuntu is bannished
    from Mint. As Ubuntu moved towards the Snap packaging format, some Mint users
    voiced concern about whether these would become the norm in Mint, too. They (unlike
    Flatpaks and AppImages) rely on a proprietary app store after all, which makes
    Canonical a sort of kingpin in the software distribution ring. The team reassured
    users that Mint wouldn’t contribute to this Snap monopoly. Last year they said
    they’d support Snaps as long as they were useful, and “didn’t become the de facto
    standard [for packages]”. Now they’ve put their money where their mouth is. Try
    installing Chromium with apt in Ubuntu 20.04 and you’ll find you get a dummy package
    that installs the Snap version. This is irrefutable evidence of a Snap usurping
    a traditional package, and something the Mint team won’t stand for.


    # Mint 20 beta insights


    As we write this, the first details of what to expect in the Mint 20 beta are
    starting to emerge. And one of the first is that no Snaps will be installed by
    default. The snap daemon will also be absent, but you can add it if you wish.
    As a precaution, traditional apt packages will be blocked from installing snapd,
    to prevent them acting, like Chromium, deceptiously. Linux Mint made waves by
    giving users what they want. It sounds harsh and there are all kinds of complexities
    behind this, but other distros seemed reluctant to listen to their users. Also,
    the most common gripe “why can’t it just work?” is alive and well today (though
    this applies to other OSes and in fact all forms of technology). A sad trend that
    Ubuntu’s accessibility inadvertently started was frankly unqualified users taking
    to bug trackers and venting their rage. People would describe their problems (badly)
    in angry block capitals, they wouldn’t supply log files or hardware information,
    they wouldn’t attempt to pin down the problem, they would fail to do even the
    most cursory search for other people having similar problems or, worse, they would
    jump on to similar bug reports crying “me too!” – even though their issue was
    different. Developers shied away from engaging with such reports. The canned response
    thanking these newcomers for their submission and referring to reporting guidelines
    has become ubiquitous. One place Linux Mint excelled was through its community
    helping each other, and developers engaging with that community rather than being
    bothered by them. Their “Newbie Questions” forum still bears the tagline “all
    gurus once were newbies” and is still for the most part free of more experienced
    users being condescending to newcomers’ questions. Even where those newcomers
    didn’t read their helpful guide on how to ask for help.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_11_0.png)


    > Chromium is only available as a Snap in Ubuntu. If you want it in Mint 20 then
    you’ll have to fetch it manually.


    # Endlessly usable


    Over the past decade some Linux distributions have appeared that go out of their
    way to be more useable (and less breakable) by regular humans. One such is EndlessOS.
    Originally tied to Endless Computers’'
