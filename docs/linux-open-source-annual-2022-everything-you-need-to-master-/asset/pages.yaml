  md: '# Roundup


    Haiku $\gg$ KoliibriOS $\gg$ OpenIndiana $\gg$

    ReactOS $\gg$ Visoprys


    **Shashank Sharma**

    By day Shashank is a New Delhi trial lawyer, but by night he''s an open source
    vigilante!


    # Open operating systems


    Using Arch with one hand while wearing a blindfold is no longer challenging for
    **Shashank Sharma**, who is now looking for something more arduous.


    # HOW WE TESTED...


    Many of the OSes in this *Roundup* suggest that users first experiment with them
    inside the safe environment of a virtual machine. We heeded their advice and run
    all of them inside VMs configured as per the specification mentioned on their
    respective websites, before subjecting them to physical hardware.

    Our intention is to hunt for an alternate OS that enables us to use the computer
    productively. Sure, we, don''t expect to be able to stream games via Steam or
    watch movies via Netflix, but if they can play multimedia, browse the web, do
    word processing and such without throwing unexpected errors, they''ll be in our
    good books. We''ll test various parameters such as installation and app support,
    with the sole intention of helping us zero in on an alternate OS that takes us
    out of our zone of familiarity – but with the least amount of compromise with
    our comfort.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_27_0.png)


    Being a regular reader, you''ll know full well that Linux isn''t the only open
    source operating system that you can pluck from the internet for free.


    Notwithstanding our love for Linux, we do regularly review other open source OSes
    as well, particularly the BSDs. Many non-Linux open source OSes are designed for
    niche uses and wouldn''t be of much use outside their specialised environments.
    While they might not possess the dexterity of Linux, which can scale from your
    netbook to a server farm, a few of them perform quite well in multiple environments,
    including the desktop. We''ll introduce you to


    some of the best options for everyday desktop tasks in this *Roundup*.


    Despite the fact that they''ve been under development for over two decades, many
    of these alternative OSes are actually in the early stages of development! This
    is primarily because they don''t get the same attention from the open source ecosystem
    as most Linux distributions. Many of the OSes in this *Roundup* have a very limited
    number of core developers (and an even smaller band of dedicated users), and none
    of them have the backing of multinational/for-profit corporations to accelerate
    their development – yet they continue to grow.'
