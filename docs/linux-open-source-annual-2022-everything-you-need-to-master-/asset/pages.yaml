    \ of who we are in meatspace) is a healthy thing that we can save for another\
    \ day. But as readers of this fine magazine, we can all agree that if we’re going\
    \ to put our media and rambles online, then things would be a whole lot better\
    \ if the sites that handle them should be open source, have clear policies about\
    \ how that data is used.\n+   \n+   Better yet, we should be able to host our\
