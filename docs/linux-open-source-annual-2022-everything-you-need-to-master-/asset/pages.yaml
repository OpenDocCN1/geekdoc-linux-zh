    \ After this, Audacity should be smooth sailing. Now to tweak the recording levels.\n\
    \nThe smaller the wave in height, the worse the signal-to-noise ratio will be,\
    \ making the track hissy and probably muffled. The louder the recorded input,\
    \ the more likely it will 'clip' (the edge of the waveform and sound horrible\
    \ and distorted. You want to strike a balance where a good amount of space in\
    \ the wave form is used, but leave room in the dynamic range for sudden loud notes,\
    \ such as a big cymbal crash. Keep turning up your instrument, input or mixer\
