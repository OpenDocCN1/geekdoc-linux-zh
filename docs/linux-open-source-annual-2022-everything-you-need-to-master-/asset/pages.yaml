    \ screens. Each step is dotted with relevant information to help you make an informed\
    \ choice. Still, Clonezilla isn't something to be approached without adequate\
    \ knowledge and experience.\n\n# Deepin Clone  \n**8/10**\n\nIf there's one area\
    \ where Deepin Clone trumps the rest of the competition, it's usability: the app\
    \ really is as simple as they come.\n\nOn the first screen, it asks you to select\
    \ whether you wish to clone a complete or individual partitions. Depending on\
    \ the selection, it'll bring up another set of options to help you narrow down\
    \ the disk/partition you want.\n\nOn the following screen you're shown a list\
    \ of disks or partitions. Unlike some of the other options on test here, if you've\
    \ selected the option to clone partitions, the app won't let you clone multiple\
    \ partitions in one go. Also, its default mode of cloning is a direct disk-to-disk\
    \ or partition-to-partition, which is rather unsafe and something we'd never recommend\
    \ doing.\n\nIn addition, to use Deepin Clone to image the current installation,\
    \ you'll have to run it via Deepin Recovery.\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_133_0.png)\n\
    \n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_133_1.png)\n\n# Supported filessystems\n\
    \nWill they work across all machines in your network?\n\nClonezilla supports a\
    \ wide number of filessystems, from popular ones like ext2/3/4, ReiserFS4, Btrfs,\
    \ FAT16/32 and NTFS to specialised ones like XFS, JFS and UFS. But that doesn't\
    \ mean it's totally unusable for unsupported filessystems. Those it supports,\
    \ Clonezilla images only the used blocks for greater restore functionality. If\
    \ it runs into a filessystem it doesn't understand, Clonezilla uses dd to image\
    \ the contents as-is, and you can restore these easily to equal-sized disks.\n\
    \nMuch like Clonezilla, G4L works in two modes. There's the filessystem level\
    \ where it uses utilities such as NTFSclone and FSArchiver to directly clone supported\
    \ filessystems, including virtually all the popular ones. If you work with exoteric\
    \ filessystems or need to clone entire disks, you can use G4L in RAW mode to copy\
    \ all the bits of any file system.\n\nFOG Project uses both Partimage and PartClone\
    \ in the background, so it supports all the popular filessystems. The imaging\
    \ section also enables you to create a sector-by-sector image of the drive using\
    \ dd.\n\nIn contrast, there isn't much information on the internet about the way\
    \ that Deepin Clone works, and it doesn't offer any configurable parameters that\
    \ would hint at the filessystems it supports. In our tests, however, it worked\
    \ on both ext4 and NTFS partitions, so there's that.\n\nIn contrast to its peers,\
    \ WereSync uses rsync to copy the contents of the drive, and can image the contents\
    \ of GPT, MBR and LVM drives. According to the official documentation, you can\
    \ even force the tool to copy the contents of a drive to a file by specifying\
    \ the IMG extension type.\n\n# VERDICT\n\n| CLONEZILLA | **9/10** |\n| G4L | **9/10**\
    \ |\n| DEEPIN CLONE | **5/10** |\n| WERESYNC | **5/10** |\n| FOG PROJECT | **9/10**\
    \ |\n\nAll these tools give you decent mileage so long as you're working with\
    \ one of the popular filessystems."
