  md: "The Controller Manager monitors the state of the cluster, and will try to start\
    \ or stop pods as necessarily, via the API Server, to bring the cluster to the\
    \ desired state. It also manages some internal connections and security features.\n\
    \nEach node runs a Kubelet process, which communicates with the API server and\
    \ manages containers – generally using Docker – and Kube-Proxy, which handles\
    \ network proxying and load balancing within the cluster.\n\nThe etcd distributed\
    \ database system derives its name from the /etc folder on Linux systems, which\
    \ is used to hold system configuration information, plus the suffix ‘d’, often\
    \ used to denote a daemon process. The goals of etcd are to store key-value data\
    \ in a distributed, consistent and fault-tolerant way.\n\nThe API server keeps\
    \ all its state data in etcd and can run many instances concurrently. The scheduler\
    \ and controller manager can only have one active instance but uses a lease system\
    \ to determine which running instance is the master. All this means that Kuberentes\
    \ can run as a Highly Available system with no single points of failure.\n\n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_80_0.png)\n\
    \n> Use the dashboard view to get an at-a- glance summary of Kubernetes in action.\n\
    \n# Putting it all together\n\nSo how do we use those components in practice?\
    \ What follows is an example of setting up a WordPress website using Kubernetes.\
    \ If you wanted to do this for real, then you’d probably use a predefined recipe\
    \ called a helm chart. They are available for a number of common applications,\
    \ but here we’ll look at some of the steps necessary to get a WordPress site up\
    \ and running on Kubernetes.\n\n```\nkubectl create secret generic mysql-pass\
    \ --from-literal-password=YOUR_PASSWORD\n```\n\nkubectl will talk to the API Server,\
    \ which will validate the command and then store the password in etcd.\n\nOur\
    \ services are defined in YAML files, and now we need some persistent storage\
    \ for the MySQL database.\n\n```\napiVersion: v1\nkind: PersistentVolumeClaim\n\
    metadata:\n  name: mysql-pv-claim\n  labels:\n    app: wordpress\nspec:\n  accessModes:\n\
    \    - ReadWriteOnce\n  resources:\n    requests:\n      storage: 2Gi\n```\n\n\
    The specification should be mostly self-explanatory. The name and labels fields\
    \ are used to refer to this storage from other parts of Kubernetes, in this case\
    \ our WordPress container.\n\nOnce we’ve defined the storage, we can define a\
    \ MySQL instance, pointing it to the predefined storage. That’s followed by defining\
    \ the database itself. We give that database a name and label for easy reference\
    \ within Kubernetes.\n\nNow we need another container to run WordPress. Part of\
    \ the container deployment specification is:\n\n```\nkind: Deployment\nmetadata:\n\
    \  name: wordpress\n```\n\n```\nname: wordpress\nlabels:\n  app: wordpress\nspec:\n\
    \  strategy:\n    type: Recreate\n```\n\nThe strategy type “Recreate” means that\
    \ if any of the code comprising the application changes, then running instances\
    \ will be deleted and recreated. Other options include being able to cycle new\
    \ instances in and removing existing instances, one by one, enabling the service\
    \ to continue running during deployment of an update. Finally, we declare a service\
    \ for WordPress itself, comprising the PHP code and Apache. Part of the YAML file\
    \ declaring this is:\n\n```\nmetadata:\n  name: wordpress\n  labels:\n    app:\
    \ wordpress\nspec:\n  ports:\n    - port: 80\n  selector:\n    app: wordpress\n\
    \    tier: frontend\n  type: LoadBalancer\n```\n\nNote the last line, defining\
    \ service type as LoadBalancer. That instructs Kubernetes to make the service\
    \ available outside of Kubernetes. Without that line, this would merely be an\
    \ internal “Kubernetes only” service.\n\nAnd that’s it. Kubernetes will now use\
    \ those YAML files as a declaration of what is required, and will set up pods,\
    \ connections, storage and so on as required to get the cluster into the “desired”\
    \ state.\n\nThis has necessarily been only a high-level overview of Kubernetes,\
    \ and many details and features of the system have been omitted. We’ve glossed\
    \ over autoscaling (both pods and the nodes that make up a cluster), cron jobs\
    \ (starting containers according to a schedule), Ingress (HTTP load balancing,\
    \ rewriting and SSL offloading), RBAC (role-based access controls), network policies\
    \ (firewalling), and much more. Kubernetes is extremely flexible and extremely\
    \ powerful: for any new IT infrastructure, it must be a serious contender."
