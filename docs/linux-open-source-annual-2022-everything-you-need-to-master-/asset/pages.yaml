- pgno: 40
  md: '# # The range of tools on offer


    # ## What''s in the goody bag?


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_40_0.png)


    Should you be looking for a wide range of repair tools and utilities, you''ll
    be disappointed with MorpheusArch. The distro has a very focused approach and
    only really includes *TestDisk*, along with its companion *PhotoRec* utility,
    for recovering files. The tools support all popular file systems and can identify
    files in over 400 formats. In addition to files, you can also use them to find
    lost partitions, rebuild the boot sector, fix FAT tables, locate the backup superblock
    and more. Experienced users can use its Arch base to fetch other rescue tools.


    Another Arch-based rescue distro, *SystemRescueCd* is a slightly better option.
    Unlike MorpheusArch, this one ships with several repair and rescue tools and utilities,
    and supports all the important filesystems. There are multiple recovery tools,
    filesystem-specific repair tools, and a couple of boot images including HDT to
    query the hardware. There''s also *FSArcher*, which can help save and restore
    a partition table, or the contents of a filesystem, to a compressed archive file.


    Then there''s *AIO System Rescue Toolkit*, which readily admits to not shipping
    with the entire gamut of rescue tools on offer. It instead includes only the most
    useful ones that its creator, a skilled technician, has used out in the field
    to fix machines. Besides tools like *Boot Repair*, *Clonezilla* and *TestDisk*,
    there are also a couple of stress-testing and benchmarking tools. The primary
    goal of the distro, however, is to fix Windows machines, and it has the largest
    collection of tools for this purpose as compared to the other options in this
    *Roundup*.


    Navigate through UBCD''s diverse menu to find the tool you''re interested in,
    and boot straight into its streamlined environment.


    Stress-testing and benchmarking utilities are also included in ALT Linux Rescue,
    which packs in over a hundred CLI tools, including several versatile ones. The
    distro also has several utilities to help recover deleted files and fix common
    issues with both Linux and Windows installations.


    *Ultimate Boot CD (UBCD)* leads the pack with the largest and most diverse collection
    of utilities. You can use the distro to query and stress-test hardware and peripherals
    connected to a system. It can be used to restore BIOS settings as well as to restore
    and backup the CMOS. UBCD enables you to fix bootloaders, recover lost passwords
    and deleted files and will also help you tweak the Windows Registry without booting
    into the installation.


    # VERDICT


    AIO SYSTEM RESCUE TOOLKIT 8/10 | SYSTERESCUECD 6/10

    ALT LINUX RESCUE 9/10 | ULTIMATE BOOT CD 9/10

    MORPHEUSARCH 3/10


    With the exception of MorpheusArch, the others can *get fair bit of mileage with
    the other rescue distros in the Roundup.*


    # # Customisation


    # ## Do they help ease admin access?


    SystemRescueCd doesn''t offer much in terms of a customised interface. The distro
    has a simple boot option that takes you to its Xfce desktop, which doesn''t offer
    any conveniences or customised interfaces to help orientate new and inexperienced
    users.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_40_1.png)


    The MorpheusArch project does produce an *arcuses*-based script called *LinDag*
    to assist with common system admin and recovery tasks. You can use it to check
    services, diagnose the network, manage packages and recover data from drives.
    However, the script oddly isn''t included in the distro by default, and you''ll
    have to clone it from GitHub.


    If you manage a bunch of Windows machines, AIO System Rescue Kit can help you
    to keep them in perfect condition.


    ALT Linux Rescue also doesn''t offer much in terms of customisation. One of the
    few aids it does have is the forensi-mode boot option that brings up the distro
    without activating the swap or mounting any partition. There are also a couple
    of scripts that automatically mount attached disks and fix any issues with the
    master boot record, which is rather convenient.


    What helps UBCD standout from its competition is its custom boot menu. The distro
    ships with no graphical desktop and instead boots to a very well laid-out menu.
    The customised text-based menus help guide you to the relevant utility for your
    issue. The menu is logically arranged and individual entries have useful information
    to help identify them.


    In contrast, AIO System Rescue Toolkit has a bunch of CLI tools, but to make for
    easier access it has a shortcut on the desktop for all of them. Besides the Live
    environment, you can also boot the distro''s CD/USB inside Windows to access all
    its Windows-specific repair and rescue tools via a custom interface.


    # VERDICT


    AIO SYSTEM RESCUE TOOLKIT 8/10 | SYSTERESCUECD 3/10

    ALT LINUX RESCUE 7/10 | ULTIMATE BOOT CD 9/10

    MORPHEUSARCH 5/10


    New users will appreciate UBCD''s customised boot menu in particular.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Usability


    What''s their user experience like?


    hen it comes to distros that package specialised tools, it takes a lot more than
    the sum of its parts to win us over. Stuffing distros will loads of tools will
    help experienced users, but won''t be of much help in the hands of the average
    desktop user looking to rescue an unbootable machine.


    It''s because of this that usability becomes such a critical factor for specialised
    distros such as the ones in this Roundup. Also, remember that there''s more to
    usability than just beautiful interfaces; having relevant information on using
    the tools at hand is just as essential as picking the right tool for the job.


    Finally, just because a distro is usable irrespective of a user''s level of experience
    doesn''t mean it has less powerful tools than a distro designed for experienced
    users.


    # System Rescue Toolkit 8/10


    The distro is unique in that it has a couple of user modes. You can transfer the
    ISO to a CD or a USB and use it as a regular Live disk, which boots into a tweaked
    LXDE desktop. The desktop has icons for all the apps including command-line versions,
    which is really helpful for first-time users.


    Besides the Live environment, you can also run the distro from inside Windows.
    In this case it fires up a custom repair utility that lists all the available
    tools in its repository to help you repair a broken Windows installation.


    The custom app has multiple tabs, each of which houses apps for a particular area
    such as Hardware, Software, Networking, and such. While the custom app is intuitive
    to operate for anyone who is familiar with troubleshooting; there''s also a very
    helpful *AutoFix* utility which can help novices repair many common issues with
    a Windows installation.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_41_0.png)


    # ALT Linux Rescue 5/10


    Unlike the other distros in the Roundup, ALT Linux Rescue boots straight to the
    shell and is missing a graphical desktop altogether. This clearly points to the
    fact that it''s designed for experienced users who are not only familiar with
    the bundled tools but also know the ones they need to use to fix the issues affecting
    a system.


    Besides the couple of scripts mentioned earlier, you get no other conveniences.
    In addition to the regular boot option, the distro has a couple of others. There''s
    the aforementioned Forensic mode, which minimises interactions with the computer''s
    disk to help you conduct forensic investigation on the system.


    The other boot option is designed to rescue headless machines. It automatically
    assigns an IP address to the machine, generates a random root password and starts
    a SSH server to help you access the machine remotely.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_41_1.png)


    # Help and support


    For when you need some hand-holding.


    orphousArch is one of the two distros in this Roundup that doesn''t have any sort
    of help information of its own.


    You do get a brief illustrated guide on LinDiaz''s GitHub page, but there are
    no forum boards or mailing lists on which to seek help, so this distro is only
    designed for people who want to use the bundled recovery tools on an Arch base.


    ALT Linux Rescue isn''t any better in that it only gets a single page on the ALT
    Linux website, which lists the distro''s capabilities and some of the marquee
    utilities. There are Russian forums and mailing lists for the main ALT Linux distribution,
    but the Rescue edition doesn''t have any official support avenues.


    In sharp contrast, AIO System Rescue Toolkit has as a detailed FAQ with a list
    of all the utilities and a couple of videos to help you find your way around the
    distro. There are no forum boards, but the developer has created a page on the
    website where users can post questions.


    SystemRescueCd''s website hosts a quick-start guide as well as detailed instructions
    on basic and advanced use. There are also instructions for experienced campaigners,
    such as the guide on how to make a custom version and backup up data from an unbootable
    Windows computer.


    With a tutorial section wiki and a detailed FAQ designed to familiarise users
    with the distro, UBCD surpasses its competition by a long way in this regard.
    The tutorial section, however, is just a pointer to a long list of user-contributed
    tutorials curated from the forum boards, so it could still be a little more friendly.
    The wiki has a list of all the tools in the distro, along with useful notes on
    their capabilities.


    # VERDICT


    | Distros | Score |

    | --- | --- |

    | AIO SYSTEM RESCUE TOOLKIT | 7/10 |

    | ALT LINUX RESCUE | 5/10 |

    | MORPHEOUSARCH | 2/10 |

    | SYSTEMRESCUECD | 9/10 |

    | ULTIMATE BOOT CD | 9/10 |



    *SystemRescueCd and UBCD are the only distros that actively resolve queries on
    forum boards.*'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# **MorpheusArch 3/10**


    MorpheusArch has fairly limited appeal as compared to some of the other repair
    and rescue distros in the Roundup. It only really advertises the inclusion of
    TestDisk and PhotoRec utilities that help users to recover accidentally deleted
    files. The distro boots up to a locked LXQt desktop and there’s no mention of
    the default password (‘arch’) on the project’s website, which is a serious oversight.


    The LXQt desktop has a handful of apps including Firefox, Zenmap and LFTP. The
    desktop provides no indication on how to proceed, which is rather disorientating.
    The lack of getting started documentation inside the distro or even on the project’s
    website doesn’t help matters either.


    One of the best things about the MorpheusArch project is the assistant LinDiag
    utility. However, it isn’t included with the distro and you’ll have to manually
    pull it in, which again is not made clear.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_42_0.png)


    # **SystemRescueCd 7/10**


    Earlier versions of the distro had a comprehensive boot menu with over a dozen
    boot options. These have been dropped in the latest Arch-based release, which
    only has two.


    There’s an option to copy the entire system to RAM and the default option will
    boot the system to a console, which lists the command to configure the keyboard
    layout and start the graphical environment.


    The distro uses the Xe desktop and houses a handful of essential productivity
    apps in its menus including a web browser, a VNC viewer, a password manager and
    some developer-friendly tools.


    A majority of the rescue tools in the distro are CLI-based and just like MorpheusArch,
    the distro doesn’t give any pointers to help users get started. It’s saying grace
    is its website, which is flush with all sorts of detailed documentation to help
    first-time users use the distro.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_42_1.png)


    # **Ultimate Boot CD 9/10**


    Unlike the other distros here, UBCD is unique in that it directly boots into its
    customised text-based menu. The menu divides the packaged utilities into categories
    based on the part of the computer that they influence, such as HDD, Peripherals,
    System and such.


    Step into the category to view the list of entries for the individual tools. Some
    categories, such as HDD, are further divided into different tasks, such as Boot
    Management, Data Recovery, Disc Cloning and Disk Wiping, and more.


    As you move across each tool in a category, the menu displays brief but useful
    information about it. The menus might be text-based, but the clear categories
    and helpful descriptions mean the distro can be easily navigated and used by inexperienced
    users. Coupled with the useful information on the project’s website, UBCD makes
    for a great choice.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_42_2.png)


    # # Security and privacy features


    What can they do besides repair and rescue?


    While the primary purpose of these distros is to rescue a broken computer, many
    also pack in a bunch of tools to help secure your system and prevent privacy leaks.
    That’s because it isn’t uncommon for security issues to bring down a computer.
    On occasion, you might also have to sanitise an installation before bringing it
    back up in order to ensure the health of the other machines it interacts with
    on the network.


    MorpheusArch has the nmap tool for exploring the network, which you can use through
    the LinDiag script. The distro also has a couple of utilities which can wipe filesystem
    signatures from a device and also set hard disk parameters.


    AIO System Rescue Toolkit also includes nwipe to help securely zap files. ALT
    Linux Rescue includes tools to securely delete files and investigate security
    breaches. The distro is designed for several scenarios, but unfortunately ensuring
    privacy isn’t one of them.


    SystemRescueCd does take steps to enhance your privacy if you’re using a YubiKey.
    It includes the YubiKey Manager app as well as the YubiKey Personalization Tool
    that can help you reprogram the configuration slot on the device to enable additional
    authentication functionalities such as OTP. Besides these, you’ll find several
    tools to help you delete data securely including shred, wipe and the THC-Secure
    Deletion tool.


    Much like its peers, although ensuring security and privacy aren’t among the goals
    of UB CD, the distro does have a specific category where it lists about a dozen
    tools, including several low-level utilities, for securely wiping disks. There
    are also scanners to sniff out viruses and malware.


    # **VERDICT**


    | AIO SYSTEM RESCUE TOOLKIT | 4/10 | SYSTEMRESCUECD | 7/10 |

    | ALT LINUX RESCUE | 6/10 | ULTIMATE BOOT CD | 7/10 |

    | MORPHEUSARCH | 5/10 | | |


    You can use any of these distros to securely delete files so that they aren’t
    recoverable. Otherwise, their security features vary quite a bit.'
  merge: -1
  img_proc: true
