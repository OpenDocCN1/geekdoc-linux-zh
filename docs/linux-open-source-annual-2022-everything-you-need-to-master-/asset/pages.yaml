  md: '# ## Office suites

    # The Verdict


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_118_0.png)


    The choice of *Roundup* subjects over the past several issues has left us to conclude
    that perhaps one application might not cater to all your needs. This is true for
    the image and video editors, and office suites aren’t an exception either. If
    you can spare the resources, you might find yourself preparing presentations on
    one suite’s application, while relying on another for your spreadsheets.


    With the exception of the podium finishers, the other office suites alternately
    disappointed and impressed us in equal measure. **WPS Office** is a highly capable
    suite, and we would optimistically advise users to give it a chance, but the lack
    of ODF support, with no word on when (or if) it will be available, sealed its
    fate for this *Roundup*. Never mind that its fast and responsive, and fun to work
    with. The lack of many useful features on the Linux edition also goes against
    it.


    *Calligra Office*, despite being highly capable, and offering an impressive feature
    set, was also a major disappointment – but chiefly for its interface. If you can
    get past its esoteric workflow, and don’t mind finding your own way through trial
    and error, there’s nothing per se wrong with it. But if you plan on running *Calligra*
    on a small screen, say a 14-inch laptop, you’ll barely have any room to work on
    your document or slides, and so it too couldn’t make the podium.


    While both *OnlyOffice* and *LibreOffice* support the proprietary Microsoft Office
    formats, *OnlyOffice* is far better at rendering documents. Unlike the other suites,
    however, it doesn’t feature a database or drawing application, only offering a
    spreadsheet, word processor and presentation application. The offline desktop
    edition also doesn’t provide all the same features as are on offer with the cloud
    variants, and that’s disappointing too. Still, for the limited number of applications
    on offer, *OnlyOffice* performs rather well, and isn’t as resource hungry as *LibreOffice*.
    If you don’t care for collaboration then we would definitely advise you to give
    it a try.


    There’s very little separating *Google Docs* and *LibreOffice*, save for the fact
    that the former needs an internet connection to function, while the latter is
    a desktop solution. 83


    **1st LibreOffice 10 10/10**

    Web: www.libreoffice.org Licence: MPL 2.0, other open source

    Version: 6.1.2

    This mature office suite excels at just about everything.


    **2nd Google Docs 9/10**

    Web: https://docs.google.com Licence: Proprietary

    Version: N/A

    Makes collaboration a breeze.


    **3rd OnlyOffice 8/10**

    Web: www.onlyoffice.com Licence: AGPLv3

    Version: 5.1.29

    Impressive support for proprietary formats, and works as advertised.


    **4th Calligra Suite 6/10**

    Web: www.calligra.org Licence: GPL

    Version: 3.1.0

    Just as feature-rich as *LibreOffice*, but its interface is very cumbersome.


    **5th WPS Office 5/10**

    Web: http://wps-community.org Licence: 10.1.0

    Version: Proprietary

    Purists will dislike the proprietary licence and the lack of ODF support.


    # ALSO CONSIDER


    There aren’t any other open source suites to consider save for the ones already
    featured in this *Roundup*. If none of our solutions work for you, check out the
    *Apache OpenOffice* suite. *LibreOffice* is based on it, but whereas the latter
    has continued to innovate, *OpenOffice* has stagnated in recent years. Based on
    *SoftMaker Office 2018*, *FreeOffice* is another feature suite, but as with *WPS
    Office* and *OnlyOffice*, it only features a spreadsheet, word processor and presentation
    tool.


    If you’re looking for a cloud-based alternative, there are a couple of others
    besides *Google Docs*, including the proprietary *Zoho Office Suite* and the host-your-own
    open source *Tiki*. The AGPLv3 licensed *Feng Office Community Edition* is another
    viable option. If none of these catch your fancy, you can grab individual applications,
    such as *Gnumeric* or *Pyspread* for spreadsheets. *Abiword* and *Scri* can similarly
    be used for word processing or creating presentations, respectively.'
