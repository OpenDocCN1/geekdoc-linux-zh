- pgno: 63
  md: '# # Anatomy of a ransomware attack


    Ever wondered how all this high-tech financial half-inching and data scrambling
    works? Wonder no more.


    Unfortunately, if you fall victim to a ransomware attack and don’t have any backups,
    it’s probably too late to do anything about it. The usual asking price to unlock
    is around $500, though many variants will threaten to increase this amount after
    a couple of days, and may even threaten to make decryption impossible after longer.
    These threats just provoke anxiety in the victim, who’s then more likely to pay
    up before considering the merits of doing so.


    What is important to remember is that while there’s a possibility that whoever’s
    in control of this malware is reasonable enough to provide a decryption key, there’s
    also the possibility that they won’t. Their business model, after all, is to collect
    payments, so why should they bother with the extra admin of sending an email after
    that is achieved? It’s not like people who receive a key will recommend that particular
    strain of malware to their friends. Be that as it may, whether or not you have
    access to it a decryption key probably does exist somewhere. There is a class
    of malware that just deletes everything – this class of malware is known as a
    wiper and would fall into the Chaotic Evil category in D&D – but this doesn’t
    offer criminals much in the way of revenue generation. Since crypto is hard, the
    people peddling ransomware often get it wrong and it is possible to recover a
    decryption key without becoming a victim of extortion. To understand how this
    is possible, it’s necessary to understand how all this key generation malarkies
    (ha – Ed) works.


    Traditional symmetric encryption relies on two people being able to agree on a
    secret key by a secure channel. That channel might be a meeting in the woods,
    or sealed message delivered by a trusted intermediary. Today’s numerous, distant
    electronic transactions do not allow us this luxury. We can’t go whisper to our
    buddy at Paypal every time we want to pay for something online; every transaction
    requires a new key to be negotiated.


    Fortunately we now have public key (asymmetric) encryption which enables us to
    negotiate a shared secret with a remote other party, be it a person or a machine,
    even if we’ve never met them. This is what underlies the key-exchange part of
    SSL/TLS (used in HTTPS), SSH and PGP communications. Public key crypto is also
    intrinsic to the workings of all cryptocurrencies. It’s a fascinating subject,
    and also a strange concept to get your head around, but we’ll leave you to ponder
    it at your leisure (or check out our Crypto feature in LXF247. All you need to
    know is that it requires parties to hold not one but two keys – a keypair; that
    only one of them needs to be kept secret; and that random numbers are involved.


    # » MAKES YOU WANNAcry


    The WannaCry damage could have been much worse had it not been for the actions
    of one Marcus Hutchins (aka MalwareTech), a security researcher who noticed WannaCry
    was trying to contact a server at an unregistered domain. Feeling inquisitive,
    he did register the domain and set up a sinkhole, a server designed to capture
    information, which had the effect of neutering the malware. Once infected machines
    were able to contact this domain they stopped trying to infect other machines:
    in short, Hutchins had found a killswitch.


    Further variants of WannaCry appeared in the aftermath, and mercifully killswitch
    domains were found for these too. Hutchins became something of a hero overnight,
    which makes the next part of the story quite upsetting. In August 2017 he was
    in Las Vegas attending the Def Con hacker conference, and was promptly picked
    up by the FBI on hacking charges relating to the Kronos banking trojan to which
    he admitted contributing code as a teenager. In July 2019, Hutchins was effectively
    granted his freedom, with the judge sentencing him to time already served and
    even recommending he seek a pardon. This could have gone much worse for Hutchins;
    the plea deal he accepted could have seen him spend a decade in jail.


    We’ve long commented that technology is moving faster than laws can keep up with.
    People doing security research have to walk a fine line. They are bound by a treaty
    known as the Wassenaar Arrangement, by which signatory nations agree to implement
    regulations governing software that could be used maliciously. The agreement was
    reworded in December 2017 to make special provisions for security researchers,
    who may have previously risked prosecution by sharing tools or vulnerabilities
    across borders.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_63_0.png)


    You’re unlikely to see a screen like this on Linux, or such a high ransom demand
    – but you never know.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/3f314b57ad3c8b08d25e5d1ab47de56d_64_0.png)


    Ransomware that phones home to some central server could use symmetric encryption
    to perform its sordid garbling. A random key and a unique identifier could be
    generated at the target machine and both of these numbers sent and then stored
    on that command and control (C2) server. All traces of the key would be removed
    from the victim’s machine once files had been duly scrambled, and the unsuspecting
    victim would then send the requested ransom, together with their unique identifier
    to the extortionist.


    Said extortionist, if they had any shred of decency, would then provide the decryption
    key and life would go on. This all relies on some degree of centralisation: somewhere
    out there a list of keys and tokens needs to be stored. For large-scale attacks
    this isn’t ideal – often, multiple command and control servers are used for redundancy
    – and it makes more sense to somehow store those keys locally. Without public-key
    encryption this turns into a Catch-22 cascade of futility. You can encrypt the
    key and store it locally, but then where do you store the key used to encrypt
    that key?


    Instead, an attacker can use a hybrid scheme whereby the symmetric key (or keys)
    used to scramble all the files is stored on the victim’s machine, but encrypted
    asymmetrically. The simplest implementation of this type of scheme would require
    our attacker to only look after a single private key, while the public key could
    be stored locally – inside the decryption program, for example.


    So in order to recover their files, the victim needs to pay the ransom, which
    releases the attacker’s private key, which is combined with the public key and
    these two keys used to decrypt the locally stored symmetric key. Simple, right?
    Whoever said these people don’t work for their money...


    Scum, vile scum


    Actually, they don’t. Ransomware and command and control servers can be readily
    bought/rented via the darker recesses of the dark web and all this key management
    business can be taken care of with just a few clicks in a friendly interface.
    Having a single private key governing all victims is also not a terribly smart
    idea. It’s straightforward enough to protect it as it’s sent down the wire from
    the C2 server to the victim machine over HTTPS or SSH, but a suitably meticulous
    researcher would, given enough time and a retainer, be able to extract it from
    memory during the decryption phase. In this way, paying the ransom once (or maybe
    a few times) could provide decryption capability for everyone. Which is not really
    what malware authors want and why more advanced key distribution is generally
    used.


    There have been a number of high-profile cases where ransom has been paid and
    data has been liberated. For example, in 2015 a hospital in Los Angeles coughed
    up 40 Bitcoins ($17000 at the time) after being infected with the Locky ransomware.
    In life or death situations like this, it’s easy to see why paying the ransom
    is a reasonable option. The sum of money involved may well be less than the daily
    cost of working around a crippled network.


    Even if the crooks don’t provide a decryption key, the ransom payment may be dwarfed
    by these costs, so from an accounting (but not awfully principled) point of view
    the victims aren’t that much worse off. Hospitals, and indeed all reputable organisations,
    ought to have a watertight backup regimen in place, but restoring a whole network
    under considerable pressure is a complicated business. Consider how long it would
    take you to restore your machine’s software stack, configuration and data after
    it was wiped, then multiply this number by at least several hundred. Locky evolved
    over 2016 to become one of the (then) most-detected pieces of malware in the wild,
    eventually being localised in 30 different languages and no longer requiring C2
    infrastructure – which, if it’s located in a friendly jurisdiction, is easy enough
    for authorities to shut down once an outbreak becomes prevalent enough.


    Some malware is selective about what it encrypts; it may just encrypt documents
    (based on file extensions) and leave the rest of the OS intact. Doing this means
    it only requires user permissions to run. If you’re lucky, this means it’s easy
    to clean up, at least once the source of the infection is tracked down and so
    long as backups were taken. Of course, people have come up with ingenious ways
    of hiding scripts and getting these infections to resurrect themselves. There’s
    nothing more frustrating than thinking you’ve recovered everything to the pre-outbreak
    state only to have it all come undone.


    ‘Fileless malware’ is becoming the new norm. This often travels by poisoned documents
    (PDFs in particular) which contain some script or code to fetch hostile code from
    the internet and inject it directly into memory. This makes it terribly tricky
    to detect.


    # HOW TO BLACKMAIL PEOPLE


    > “Ransomware that phones home to some central server could use symmetric encryption
    to perform its sordid garbling.”'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Social engineering


    Convincing people to do things not in their interests has become quite the artform,
    so don''t be fooled. Click here for puppies...


    T here are all kinds of devious ways that unscrupulous scammers will use to get
    hold of unsuspecting marks'' data – whether it''s tricking them to install ransomware
    or some other kind of malware such as a keylogger, or having them visit a booby-trapped
    website and enter valuable credentials. Most people nowadays know better than
    to reply to an email purporting to come from a Nigerian prince who needs some
    help organising a wire transfer for his considerable inheritance. Indeed, most
    scammers no longer bother with these kinds of ruses; their game has been considerably
    upped.


    They may play on local events, especially natural disasters. They may also send
    targeted email based on public information harvested from the target''s social
    media accounts. For this reason you should be awfully careful about what information
    you broadcast publicly about yourself. Knowing your interests, location or even
    those of your friends is enough to gain a data-mining foothold. WannaCry and others
    like it exploited an unpatched vulnerability in Windows to spread, but this is
    comparatively rare. Most ransomware, and indeed most unauthorised access to computers,
    is installed by unwitting users being schemed and duped.


    # ## PAY UP OR THE KID GETS IT


    > “Concerned parents, particularly those that aren''t too tech-savvy, will readily
    part with cash if they think their children are in some sort of danger.”


    Fraudsters will send email from domains that at a glance look legitimate – say,
    linux@rmat.com – or direct you to counterfeit websites at such domains.


    It''s incredibly easy to cosmetically clone an entire website with open source
    spidering tools which have legitimate uses. Widgets and search facilities are
    harder to reproduce, but if you can dupe victims into thinking the site is real
    long enough for them to enter their username and password then you''ve already
    won. People tend to drop their guard considerably if they feel they are communicating
    with a friend, so contact lists from plundered email clients are valuable too.
    Social media accounts then become like gold for scammers.


    We''d rather you didn''t use Facebook and such, but if you do, it offers a few
    ways you can secure your account. In particular, you can nominate a person or
    persons that you trust so that, in the event you get hacked, they will be able
    to trigger a password reset for you. You''ll find these and other options in the
    Security and Login section of Facebook''s settings.


    You may have already witnessed hijacked accounts sending messages of the form
    "Help, I''m trapped in Timbuktu. Please send money", which are easy enough to
    sniff out. But with a little imagination and a little knowledge about the victim
    – and if you have access to their social media you''ll have plenty at your disposal
    – a much more convincing con can be crafted. Concerned parents, particularly those
    that aren''t too tech-savvy, will readily part with cash if they think their children
    are in some sort of danger (*not me – Ed*).


    Human beings aren''t really designed to remember passwords or indeed come up with
    secure ones, so it should come as no surprise that password-reset mechanisms or
    forgeries thereof are popular means for hijacking accounts. If you search your
    email address on Troy Hunt''s <https://haveibeenpwned.com> website, you may well
    find it has appeared on one of the many lists of breached credentials that are
    now forever in the public domain.


    This doesn''t mean that email address is compromised, just that an account associated
    with it has been published – possibly something insignificant and maybe even something
    that has since been secured. For obvious reasons, the actual credentials aren''t
    listed, so you can''t check their validity. But doing a thorough password audit
    is never a bad idea. If a password you used on a forum 12 years ago that''s similar
    to any you use today is in any way traced to a different account, that account
    is at risk.


    It''s a painful process, going through all the places where you may have signed
    up, resetting passwords or cancelling accounts as appropriate. But it might just
    save your identity, or prevent your contacts getting phished, or something else
    beneficial. Rather than trying to remember a bunch of secure and different passwords,
    it''s much more sensible to use a password manager. That way you just need to
    remember a single


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_65_0.png)


    KeePassXC''s advanced settings are nothing if not impressive, but the defaults
    are fine, for us'
