  md: '# FOSS


    and the sandboxes created by the user receive this

    same access.


    When you run any of the install commands we''ll

    see in a few moments, you''ll be prompted for your

    password. This is because *Flatpak* will carry out system

    installs by default. What this means is that a program

    will be available to all users and that its files will be

    stored in */var/lib/flatpak*.


    Alternatively, if you use the `--user` flag with a command

    – it''ll just install for your account (you shouldn''t be

    prompted for a password). The files in this case will be

    in $HOME/.local/share/flatpak. This is useful if you

    don''t have an administrator account on the system.


    or perhaps if you want to try a bleeding-edge version

    of a program that''s installed elsewhere on the system.


    The user install is possible because of how the

    sandbox is constructed. Think of it this way: as a user,

    you have the ability to run an application. That

    application has the rights (through your user account)

    to create an on-screen window, write files to disk, and

    access network connections. When you install a Flatpak

    as a user, any resources from the host system are

    limited by what you yourself could access with a

    "normal" program.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_111_0.png)


    Two different versions of LibreOffice running at the same time, on the

    same machine. Is it magic? No, just *Flatpak*


    ```

    $ sudo add-apt-repository ppa:alexlarsson/flatpak

    $ sudo apt update

    $ sudo apt install flatpak

    ```


    Once it''s installed, you''ll be able to install *Flatpak*

    programs using the command line. But some GUI

    package managers also have support for the format.

    KDE''s *Discover*, for example, can manage your Flatpak

    files if you install the appropriate backend.


    With the right tools installed, there''s one quick step

    to take before you can start hunting for some new apps.


    # ## Flatpak hubs


    *Flatpak* seems to have adopted the term **hubs** to

    describe collections of software, just like RPM or DEB

    repositories. The *Flatpak* site itself hosts the first one

    you should add: *Flathub*. Register it with your system

    using your package manager, or at the terminal with the

    following command:


    ```

    $ flatpak remote-add --if-not-exists Flathub https://

    flathub.org/repo/flathub.flatpakrepo

    $ flatpak remotes

    ```


    You can see a list of your configured hubs by running


    # ## On the menu


    There are a couple of different application types that

    lend themselves to being packaged as *Flatpaks*. The

    first of these is commercial applications. If the

    developers of commercial products don''t make it easy

    for the community to pick their applications apart, it''s

    solely up to them to package everything.


    *Flatpak* gives a single target for packages that will

    work across distros, and sandboxing the apps can help

    reduce support costs. Some examples of commercial

    (though free) programs in *Flathub* include *Steam*, *Slack*

    and *Sublime text*.


    Another type of application that makes a good

    *Flatpak* are large, complex applications. These benefit

    from *Flatpak*''s atomic upgrades, making the update

    process a little less painful, and the rollback process

    even less so. *LibreOffice*, which is normally a 200MB

    update, and *Android Studio*, which is even more, are

    also available as *somewhat* more convenient *Flatpaks*.


    Finally, cross-platform apps already have two

    completely different OS targets (at least for desktop,

    more even if they''re mobile). Developers and packagers

    surely don''t need to worry about the idiosyncrasies of a

    dozen Linux distros on top of that. Just wrap your app

    up as a *Flatpak*, and you''re good to go.


    # ## Installing Flatpak programs


    Installing applications from the *Flatpak* will feel very

    familiar if you''re accustomed to using *apt* or either *yum*


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_111_1.png)


    # ## ROUNDING OUT FLATPAKS


    This article comes at a time when *Flatpak* recently enjoyed two

    significant developments. The first is the project''s v1.0 release, which

    came out on 20 August, 2018. As befits such a milestone, the press

    release (https://flapak.org/press/2018-08-20-flapak-1.0) called

    the new version “feature-complete”, with all the necessary resources

    for both developers and users. So in addition to the *Flatpak*

    commands we''ve mentioned in this article and support by most major

    GUI package managers, there are also tools to help developers

    package their applications as *Flatpaks*. If you''re a coder-type, check

    the “Build applications” section of *Flatpak*''s help (flatpak –help) for

    an idea of some of the utilities at your disposal.


    But the launch of another initiative is arguably more interesting.

    The *Wine* project (www.winefaq.org) project utilises *Flatpaks* to

    help ease the installation of Windows programs. It does this by

    providing the application and an optimised *Wine* installation in a

    format that''s simple to install. It promises to do away with all the

    configuration-fiddling that typically comes along with *Wine*-based

    installs. While the selection at the moment is quite small, there are

    some top-tier games already in there, including *Overwatch*, *World of

    Warcraft* and *League of Legends*. Sure, by installing these you might

    end up with *Wine* on your system a dozen times. But they''re

    sandboxed and storage is cheap, so go nuts!'
