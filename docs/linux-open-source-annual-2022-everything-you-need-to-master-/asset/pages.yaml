  md: 'Why use FreeBSD? A better question might be “Why not use FreeBSD?” As we’ll
    see, FreeBSD comes from the same Unix® roots as Linux, and we can expect our skills
    to transfer over nicely. Oh, there will be slight differences for sure, but a
    shell is a shell is a shell, and your ls command in FreeBSD will indeed list the
    contents of your current directory.


    But there’s always something to be learned from different ways of doing things,
    and some of the areas where FreeBSD excels include:


    +   - As a server. FreeBSD powers some of the most basic services on the internet,
    and is also used in some of the network hardware that makes up its infrastructure.

    +   - Security. Its beginnings as a server OS have led to FreeBSD including a
    number of unique security features, such as access control lists (ACL), a choice
    of powerful firewalls, and jails for running virtualised OSes.

    +   - Following documentation. With many modern Linux distros, getting installed
    is a simple point-and-click affair. In contrast, FreeBSD comes from an era where
    you actually had to read the documentation, understand it, and follow along closely.

    +   - A focus on compiling source. The Ports system gives a fantastic introduction
    to compiling software for those who aren’t software engineers by training.


    Use FreeBSD for fun. Use it to learn, and evangelise it to others in the community
    – we’re family after all. The way you install FreeBSD is just like Linux, in that
    you need to get some sort of installation medium, then boot your machine from
    said medium. The main differences during installation are threefold. First, the
    installer is text-based. Second, the installer doesn’t give the option to move
    back to previous screens. Finally, the way you include software during the install
    is rather unique.


    In this context, “include” software doesn’t mean actually installing it. But the
    installer does give you the option to add the FreeBSD Ports Collection. Ports
    is the equivalent of Linux package repositories, except that they’re used to build
    packages rather than install.


    For now, if you’ve installed a Linux distro, you’ll breeze through the text-based
    installer’s screens:


    +   - First up, a couple of environment screens: Keymap selection, and choosing
    a hostname for your machine.

    +   - Select the “distributions”. As mentioned, make sure you include Ports. Think
    of these as software sets, rather than the colloquialism for a Linux-based OS.

    +   - Disk partitioning. The first option will be between the traditional UFS
    and the newer ZFS filesystems. For testing, UFS is fine. You’ll be offered the
    usual manual partition or take over the whole disk. You’ll also have a choice
    of several different partition schemes.

    +   - The installer will start decompressing the distro onto your drive. Don’t
    go anywhere, it won’t take long.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_24_0.png)


    Finally, some quick system configuration, including setting up the root user,
    network, time zone, date/time, services (SSH is selected by default), security
    options, and user account(s).


    There are sub-steps, and it may seem like we glossed over the installation. But
    honestly, if you’ve done a Linux install you’ll have no troubles. For those of
    us of a certain age, step 2 might even bring back fond memories of writing sets
    of Slackware floppy disks.


    # ## Booting into FreeBSD


    That Nostalgia will continue once you reboot your system. You’ll get to see the
    plain-text system messages blur past in all their glory, and when all is said
    and done you’ll land at a login prompt – no fancy desktop, no new-fangled session
    manager. You’ll see login: and that’s it. It doesn’t even clear the screen for
    you.


    But start poking around and things will begin to get familiar pretty quickly.
    Your home directory is in ~/home/`username`/, and the standard sh shell is similar
    enough to Bash that you won’t notice the difference.


    The first thing that will probably jump out at you is that sudo isn’t installed
    by default, so you’ll need to use the actual root account to make changes. But
    otherwise all the basics are there: cp mv for shuffling files, mkdir for new directories,
    and cd to get yourself around.


    That said, your system is definitely barebones. Take a tour around your executable
    directories (`/bin`, `/sbin`, `/usr/bin`, and `/usr/sbin`) if you don’t believe
    me. You’ve got basically enough to do some text editing (with either `edit` or
    `vi`/`nv`), In order to make this a useful system, we’ll need to get started installing
    some programs.


    > Note: one area where the author ran into some delays is in setting up the bootloader.
    In part, this has to do with his stubborn insistence on trying to make it work
    with the native Windows boot manager on this dual-boot device.


    Things went much more smoothly once FreeBSD was allowed to take over the entire
    disk, and even just installing the FreeBSD bootloader would


    # MEET THE BSD DEVILISH FAMILY


    FreeBSD is similar to Linux in that there’s an extended family of other systems.
    There’s now quite a few different choices in the BSD world. Here are a few of
    the most popular:


    +   - **FreeBSD** ([www.freebsd.org](www.freebsd.org)) was originally a server
    OS first (as most Unix-likes were), but now is positioned as the ‘jack-of-all-trades’
    system, if you’re willing to put in the work in, as we’ll cover.

    +   - **NetBSD** ([www.netbsd.org](www.netbsd.org)) is another all-purpose OS,
    with a focus on running as many different devices as possible, meaning you can
    just as easily find it on a desktop, a server, or replacing Windows CE on an NEC
    MobilePro 790 circa 2004.

    +   - **OpenBSD** ([www.openbsd.org](www.openbsd.org)) its claim to fame is security,
    with all packages going through rigorous audits at the source level.

    +   - **TrueOS** ([www.trueos.org](www.trueos.org)), originally called PC-BSD,
    this is a desktop-friendly remix of FreeBSD, pre-configured with niceties such
    as a graphical installer and bundles of apps pre-installed.

    +   - **DragonFlyBSD** ([www.dragonflybsd.org](www.dragonflybsd.org)) forked from
    FreeBSD and provides a carefully tuned system for high-performance applications.

    +   - **GhostBSD** ([www.ghostbsd.org](www.ghostbsd.org)) is technically a grandchild
    of FreeBSD, as it’s built off of TrueOS. Just as Linux distros stand on the shoulders
    of giants, this aims to provide a simpler experience than its parent, with a focus
    on lighter desktops like MATE and Xfce.'
