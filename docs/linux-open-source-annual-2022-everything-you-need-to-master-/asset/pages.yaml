  md: '![](img/3f314b57ad3c8b08d25e5d1ab47de56d_54_0.png)


    Insert and tap your YubiKey


    Forget U2F. All the kids are doing Authn now. And forget the https padlock, the
    fingerprint icon is where it’s at.


    The configuration program is waiting for input, so push the button on the key.
    If you have other U2F keys, you may want to register those too. With this set
    up you won’t be able to log in if your key is lost or burned, after all. For each
    additional key plug it in, run: `pam-u2fcfg -a >>~/.config/YubiKey/U2F_keys` and
    give it a gentle tap to append that key to our configuration. The `u2f_keys` file
    can be moved outside of your home directory for additional security, but if you
    do this you’ll need to add the `authfile` parameter in the PAM directives we’ll
    add momentarily. First we’ll do a quick safety test, in case the device is malfunctioning,
    by testing with the `sudo` command. The desired result is that the command will
    require both the correct password and the YubiKey to be connected. Run: `$ sudo
    nano /etc/pam.d/sudo` and then enter your password to look at the relevant PAM
    directives. We’re going to add a line and then keep the file open (this is what
    makes it a safety test, so please pay attention to this part) while we test it
    in another terminal window. This way, if the device or PAM module is misbehaving,
    we don’t need the `sudo` command (which is no longer useful to us since misbehaviour
    is afoot) to revert these changes. If we didn’t discover this until we’d tied
    our login manager to the YubiKey and logged out, things would be very problematic.
    Below the `@include common-auth` line add the following: `auth required pam_u2f.so`
    Now save, but do not close( ) the file with Ctrl-O, Enter. Open another terminal
    and run: `$ sudo echo It works` You’ll be prompted for a password as usual, but
    if you get it right, nothing will happen until you give your key a tap. If it
    didn’t work, remove the offending line from the still-open file and safely exit,
    make a cup of tea, and consider available options. If it did work, you probably
    still want to remove that line. Once we make logging in to our machine with the
    key mandatory there’s less point having it protect Sudo as well (unless you enforce
    a strict post-login key removal and hiding ceremony). Edit the GDM (or whatever
    display manager you’re using on non-Gnome desktops, the syntax is the same) PAM
    file with: `$ sudo nano /etc/pam.d/gdm-password` Once again add in the `pam_u2f.so`
    module below the `@include common-auth` line, and save and close the


    file. Log out of the desktop and cross your fingers. The display manager should
    start as normal, ask for your password as normal, and then… do nothing. There’s
    no prompt, but at this point you should tap the device. If you don’t do so within
    10 seconds, you’ll get a not, unnecessarily correct error about incorrect passwords.
    There is perhaps some security by obscurity offered by this slightly jarring user
    experience. Even if the device remains plugged into the machine at all times,
    an evil maid (you really should fire them–Ed) or other visitor to your quarters
    might, despite somehow knowing your password, not know there was another piece
    to the puzzle. If you are more disciplined, removing the device whenever you log
    out and placing it somewhere safe, you stand to win some security points. The
    passwordless evolution of U2F, FIDO2 started in 2018, with a new authentication
    mechanism, WebAuthn, which you should read about at https://webauthn. guide. The
    WebAuthn API provides support for fingerprint or facial-recognition sensors. For
    now though, your best bet is to use TOTP. Many websites now allow authentication
    by time-based one-time passwords (TOTP) provided by hardware tokens or mobile
    apps such as Google Authenticator. Once a shared secret is negotiated (as the
    current time) between parties, the device generates a 6–8 digit code every 30
    seconds. This can be verified on the server, and so long as the clocks remain
    in sync, the user can log on. For situations where relying on clocks is unsatisfactory,
    there is HOTP which increments counters on each login. The Yubico Authenticator
    works anywhere Google’s does, and is available as a portable AppImage from https://developers.yubico.com/
    yubiath-desktop. There’s a mobile app too, and it’s worth considering the benefits
    of using a hardware token that isn’t your phone (or embedded in it). Phones have
    a nasty habit of getting lost, broken or moody.


    # THE BENEFITS OF HOTP


    > “For situations where relying on clocks is unsatisfactory, there is HOTP, which
    increments counters on each login.”'
