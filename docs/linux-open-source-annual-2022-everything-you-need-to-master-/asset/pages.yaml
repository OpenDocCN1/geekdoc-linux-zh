    \ ports in QjackCtl's Connect window. JACK is messy and temperamental at the best\
    \ of times. Don't use it with Audacity unless you really need to!\n\n# Track-on-track\
    \ action\n\nNot only can Audacity do multi-track recording, but you can also edit\
    \ each recorded layer individually, making tweaks to any layer without upsetting\
    \ the others. Going back to the band example, if you simply recorded them in one\
    \ line image, you would have to mix them together as a whole and you wouldn't\
    \ be able to make many adjustments. But with separate tracks you can correct mistakes\
    \ and tweak each recording individually.\n\nFor instance, if the guitarist plays\
    \ a burn note or the drummer coughs during silence, you can simply mute their\
    \ second of bad audio and the rest of the song will be unaffected. Or, if one\
    \ instrument is too loud, you can turn the volume down on just that track without\
    \ affecting the volume levels of any other musician.\n\nIf you want to turn a\
    \ track up or down, just move that track's Gain slider. If you wish to mute a\
    \ second of audio, simply highlight the portion of audio you don't want and press\
    \ Ctrl+L, or click Edit > Remove Special > Silence Audio. For more advanced users\
    \ who want to do volume automation, there is the Envelope Tool in the main toolbar.\
    \ This lets you make smooth volume"
