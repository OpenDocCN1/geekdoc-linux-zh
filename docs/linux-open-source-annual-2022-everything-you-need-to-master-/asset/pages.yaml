- pgno: 153
  md: '# # Roundup

    Google Drawings **»** Gravit Designer **»** Inkscape **»** LibreOffice Draw **»**
    Vectr


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_153_0.png)


    **Mike Bedford** is always on the lookout for ways to do things differently.


    # # Vector graphics


    Vector-based drawing software is ideal for creating technical and business diagrams
    and illustrations. **Mike Bedford** put five packages to the test.


    # ## HOW WE TESTED...


    The most obvious differentiator between vector drawing packages is their more
    advanced graphics features, so it could be argued that any testing strategy should
    concentrate on these. However, a significant majority of users have little need
    for many of the more esoteric features; what they really need are just the basic
    tools for creating illustrations and diagrams for technical, scientific or business
    applications. This, therefore, has been our emphasis.


    That doesn’t mean, however, that all software is equal. While the basic drawing
    tools might be largely similar, products differ significantly in areas related
    to productivity, so our testing has also considered this aspect.


    This goes far beyond the design of the user interface. Included under the heading
    of ease-of-use, for example, is the availability of tutorials and good user documentation,
    while in a team scenario, features that simplify collaboration and sharing of
    illustrations are vital. We’ve also looked at licensing.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_153_1.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_153_2.png)


    o-called paint packages are the most commonly used type of graphic editing software.
    But while they’re perfect for touching up photos, they’re far from ideal for creating
    diagrams and illustrations. The snag with using paint software for this purpose
    is that they work at the level of pixels. A much better solution is to use a drawing
    package, otherwise known as vector-based graphics software, which works at the
    level of picture elements such as lines, circles, boxes and text. The waters have
    been muddied by some paint software appearing to offer similar functionality,
    but if you want


    full control over the drawing process, there’s no better option than vector-based
    software.


    This type of software can used by graphics artists, but our assumption here is
    that most **LXF** readers will have more down-to-earth applications, for which
    vector-based software is ideal. Perhaps you’re a scientist or engineer with a
    need to create 2D technical drawings or diagrams. Maybe you need to produce flow
    diagrams. Or conceivably you have a business application such as creating a company
    logo or drafting an organisational diagram. For all this and more, there’s something
    to meet your needs.'
