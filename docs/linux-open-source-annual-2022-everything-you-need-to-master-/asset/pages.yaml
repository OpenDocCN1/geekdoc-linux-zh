  md: '# Do more


    # VirtualBox beginnings


    Learn the basics of virtualisation no matter which OS you''re running, or which
    OS you want to try.


    **0** ne of the easiest ways to fire up your first virtual machine is with Oracle''s
    *VirtualBox*. This is free (GPL2-licensed) software available for Windows, macOS
    and Linux. Mac and Windows users should download it from **https://virtualbox.org**,
    and Linux users should install it with:


    ```

    ```

    $ sudo apt install virtualbox

    ```

    ```


    It looks and works the same for all platforms, so no matter what your OS is (or
    which OS you want to virtualise), you can make use of our handy six-step guide
    opposite. If you''re stuck for a distro to try, why not copy the Solus or OpenMandriva
    ISO files off the **LXF0VD**? If you want to tell *VirtualBox* to use it straight
    from the disc things would be awfully slow.


    If you find yourself stuck in fullscreen mode, use Right Ctrl+F to return to windowed
    mode. If you find yourself with a mouse cursor trapped in the guest window, just
    press the Right Ctrl key to escape. Most Linux distributions today support seamless
    mouse integration, so the latter shouldn''t happen to you – taking the mouse past
    the edge of the screen in the guest should relinquish control to the host.


    # VirtualBox tweaks


    It''s straightforward to fire up a VM, but let''s look at some of the options
    *VirtualBox* provides to make your virtual life as smooth as your real one. First
    of all, if you store your virtual drive image on a traditional spinning- rust
    hard disk, I/O-heavy workloads will be very slow and you''ll probably notice a
    lot of disk activity while they''re underway. For such tasks, and indeed if you''re
    brave enough to run a Windows VM, your life will be *markedly* better if you store
    the image on an SSD.


    If you don''t have one, or don''t have space on one, you might be able to eke
    out some extra performance by enabling the host I/O cache for the VM. Select your
    VM from the column on the left, hit the Settings button on the toolbar, select
    the disk image (the VDI file, not


    the optical disc) and tick the box. It''s possible to change the type of controller
    presented to the VM from here, but generally speaking the defaults (PIIX4 for
    the IDE controller the optical drive is connected to, and AHCI for the SATA controller)
    are better supported. *VirtualBox 6.1*, released in January, introduced experimental
    support for virtio storage, which means *VirtualBox* doesn''t have to waste CPU
    cycles emulating a disk controller. This should work well for Linux distributions
    at least, but will require a driver to be added to a Windows VM. We''ll discuss
    the ins and outs of virtio over the page when we meet **QEMU**.


    The most common thing people want to do is speed up graphics performance. The
    new default graphics controller in *VirtualBox* (VMSVGA, actually borrowed from
    VMware) should work well enough for Linux guests. If you have older *VirtualBox*
    VMs lying around you may want to update them to use the new controller. Virtual
    Windows may work better with the **VBoxSVGA** driver. There shouldn''t be any
    reason to use the old VBoxSVGA driver these days, unless you''re running or trying
    to virtualise very old distros.


    You''ll find the Graphics Controller options in the Display section of the VM''s
    settings dialogue. The default Video Memory allocation is only **16MB**, which
    is fine for testing out a Linux distro at sub-1080p resolutions, but for more
    serious work you''ll want to boost this. The aforementioned virtual SVGA devices
    emulate enough of a graphics card to expose basic OpenGL primitives and some 2D
    acceleration capabilities – but you''ll have probably noticed there''s a box for
    **3D Acceleration** too.


    If you use this, all the OpenGL capabilities of the host will be available on
    the guest. The name is a little confusing, because lots of desktop effects which
    look very two-dimensional rely on 3D extensions. Linux Mint under *VirtualBox*,
    for example, will tell you it''s using software rendering until the 3D box is
    ticked.


    Setting up a bridge network so your guest appears as a separate host on your LAN)
    is easy, and so are all these other network configs.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_69_0.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_69_1.png)


    You''ll also find *VirtualBox* in the Ubuntu Software Centre. It''s not really
    proprietary, don''t worry'
