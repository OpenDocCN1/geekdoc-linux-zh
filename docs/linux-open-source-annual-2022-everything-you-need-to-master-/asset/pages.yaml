  md: '# ## Deploying and management


    Are the servers easy to set up and use?


    **W**eb servers will be installed via the command line. Some installations are
    very simple one-liners that use **apt-get install** while others need to be installed
    from source using a few extra commands. Once installed, the servers can be used
    to quickly display a default web page. Since we will test our servers with the
    server-side language PHP and mySQL, we will see how easily they can be used with
    each server. Looking into details, we will see which software works easiest with
    basic commands or with the aid of very basic text editing to config files. On
    top of that, we will look at configuring each server so that it runs more efficiently
    and helps us get the results we need: a fast-loading website that won''t leave
    potential visitors so frustrated that they abort the site rather than wait for
    a page to load. In order to reach this goal, we use the Apache Benchmark tool
    to calculate our requests-per-second rate for our web files. This tool can make
    thousands of requests and simulate concurrent users.


    # ### Apache 10/10


    During the apache2 installation, we can install mysql-server, PHP, libapache2-mod-php
    and php-mysql. After this, we can simply write PHP scripts that just work or build
    a full web app using popular tools such as WordPress, Laravel, or Magento. Apache''s
    ease of installation and performance for testing purposes makes it a great choice
    for building and testing web applications before they are uploaded and moved to
    the Internet on some sort of hosting platform; whether that be shared hosting,
    VPS or dedicated hosting. Since many web hosts still use Apache, it makes for
    a consistent, solid, uniform testing system. However, when using Apache, tuning
    it can be very important since it can be slow if we don''t make the best of it.
    To make testing basic, we have a few tools such as the browser Inspector and the
    Apache Benchmark tool to help reach our speed goals.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_127_0.png)


    # ### Nginx 9/10


    During Nginx installation, we can also install php-fpm in order to be able to
    build PHP apps and test them. However, there is a lot more to it than that. In
    order to be able to open PHP files in our web browser, we also need to edit the
    file /etc/nginx/sites-available/default and un-comment the stanza that begins
    with location ~ \.php$ {. After we remove the comments that are blocking the PHP
    code from running, we can reload Nginx and PHP works just fine. Now, we can run
    and test any PHP applications whether they are custom scripts, WordPress, Magento,
    Joomla, Drupal or many others from such a long list. Now, Nginx performs exceptionally
    well, which is one of the main reasons its popularity has increased over recent
    years. And since Nginx is so easy to set up and run, it is a wonderful option
    for third-party web hosting.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_127_1.png)


    # ## Speed and performance


    Benchmarking the requests per second.


    **F**or our performance tests, we used the browser and the Apache Benchmarking
    tool. The browser tests were quite simple, we right-clicked on our page, selected
    ‘Network’, refreshed the page and clicked the line which showed our URL. Once
    we clicked the line, we had access to the request and response headers. The headers
    enable us to see some performance stuff such as the server itself (that is, Nginx,
    Apache or Lighttpd), Keep-alive, gzip and cache control. As far as the Apache
    HTTP Benchmarking tool goes, we used it to test retrieving an image 25,000 times,
    since this is a good way to gauge a rough of idea of the requests per second that
    each server was capable of. To put each through their paces with set them running
    to fetch over 25,000 requests of a 200Kb JPEG file with 50 concurrent requests
    (users). The top two servers – both were within the eight-second range – were
    Nginx and Lighttpd (aka Lighty). Coming in after this bracket, we see Openlitespeed
    appearing at around 14 seconds, Apache at 19 seconds and, finally, Tomcat just
    coming in at the rear at a touch over 20 seconds. Looking into the requests-per-second
    details, we see Nginx manages around 3,011 with Lighttpd just behind with 2,890.
    The rest clump together somewhat further back with Openlitespeed at 1,776, Apache
    at 1,314 and Tomcat at 1,229. Although these times have quite a spread, the naked
    eye cannot tell which server is being used since the images and pages load quickly
    enough with all platforms. Thus, all tools are good for testing web applications
    on a local machine. When tests were made with an entire URL, like a default WordPress
    installation, results for speed variance amongst the servers were very similar
    for the image requests.


    # ### VERDICT


    | |  | | |

    |:---|:---|:---|:---|

    | APACHE | 7/10 | TOMCAT | 7/10 |

    | NGINX | 10/10 | OPENLITESPEED | 8/10 |

    | LIGHTTPD | 10/10 | | |


    **Nginx** and **Lighttpd** are just plain faster out of the box.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# **Lighttpd** 10/10


    During lighttpd installation, we can install `fast-cgi` and `fastcgi.php` so that
    we can build PHP apps and test them. But, there is still more to it than that.
    Lighty installs very quickly and responds almost instantly when a command is typed.
    In addition, the simple commands do all the hard work for us and both PHP and
    MySQL database will work just as we expect. However, we must note that if we do
    not enable and reload Lighty after installing `fast-cgi`, we will receive 403
    errors in our browser.


    Once Lighty has been installed, it will look for one of the default files (index.html,
    index.lighttpd.html and index.php) from the `/var/www/html` folder. The quick
    Lighty setup and the fact that all files and folders reside in the same path as
    Nginx and Apache make it a gem, too. It''s nice to be able to build in one location
    and test all servers from one spot rather than having files all over the place.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_128_0.png)


    # **Openlightspeed** 8/10


    During Openlightspeed installation, an index.html file is created that is used
    as the default webpage. In addition, PHP works right off the bat since it comes
    with its own PHP handler called LiteSpeed SAPI PHP. Unlike Nginx, Apache and Lighttpd,
    the html files are stored at the path `/usr/local/lsws/Example/html/index.html`.


    With Openlightspeed, its strengths lies in testing simple HTML and PHP files in
    the root folder. However, as soon as we want to test a real-world application
    like WordPress, or the Laravel Framework, its default setup falls flat on its
    face. If we''re working with subdirectories, we need to change the `vhconf.conf`
    file and add the subfolders manually. Another issue is that our MySQL installations
    which work seamlessly with Nginx, Apache and Lighttpd, do not work out of the
    box with Openlightspeed. Any of our previous databases built with PhpMyAdmin cannot
    be initially used.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_128_1.png)


    # **Tomcat** 9/10


    Tomcat installs and works right off the bat. However, like Openlightspeed, Tomcat
    files, by default, sit in a different location than those for Apache, Nginx and
    Lighttpd. In fact, they reside in the `/var/lib/tomcat7/webapps/ROOT` directory.
    In addition, its default port is 8080, unlike other web servers running on port
    80.


    Unlike all the other servers, Tomcat is designed to deliver Java Servlets and
    JSPs. Thus, with a Java project, a WAR (web archive) file can be dropped and deployed
    with Tomcat. Although Tomcat can be used to deliver browser-interpreted files
    such as HTML, CSS and JavaScript, it can be configured to interpret PHP files
    as well, although it was not designed for this purpose which makes it more of
    a specialized tool for programming in Java. Considering Tomcat is Java-based,
    it does rank fairly well as a popular web server and seems to just work without
    issues.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_128_2.png)


    # Customisation


    Adding and enabling modules and custom directory options.


    Since most websites will use a server-side language, such as a WordPress installation
    or basic code to handle a contact form from HTML, let''s take a look at how easy
    that is to implement.


    Extending web servers is easier with some others. However, from a simplicity standpoint,
    both Apache and Lighttpd make it very easy to check modules and enable them as
    needed. For example, one such module that is not enabled by default in Apache
    is mod_cache. Nginx, on the contrary does offer plenty from the first go, but
    single commands to enable and disable them are not part of the program. With Nginx,
    adding and configuring modules runs beyond novice usage.


    Openlightspeed is not as straightforward as Apache or Lighttpd either, but they
    both can at least be added to with somewhat simple commands for more intermediate
    users.


    Aside from adding modules to a server, there will come a time when we want to
    edit the server configuration files themselves or add files to folders for which
    we can make custom configurations,


    such as within an `.htaccess` file.


    Apache and Tomcat make such configurations very easy since we can add an `.htaccess`
    file to any folder and make custom rules, browser caching, and so on. Meanwhile,
    Openlightspeed has methods for which we can migrate our old `.htaccess` from Apache
    into its own system and use the same rewrite rules, which eases transition from
    an old Apache server.


    Lighttpd had its own way of creating custom files in its own lighttpd.conf. With
    Nginx and Lighttpd, most custom rules will take place in configuration files.


    # VERDICT


    APACHE 10/10 | TOMCAT 9/10

    NGINX 8/10 | OPENLIGHTSPEED 9/10

    LIGHTTPD 8/10


    Apache is very flexible since we can make server rules with a single .htaccess
    file and enable and disable modules with one-line commands.'
  merge: -1
  img_proc: true
