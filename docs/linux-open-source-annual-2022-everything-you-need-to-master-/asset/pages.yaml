  md: '# Do more


    # EMBEDDED COMPUTING


    # Getting hands-on with embedded hardware


    **Mike Bedford** delves into the world of embedded computing, and discovers that
    a small amount of hardware can certainly go a long way.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_103_0.png)


    # OUR EXPERT


    Mike Bedford continuously finds himself being drawn back to embedded computing.


    ```

    **QUICK TIP**

    If you enjoyed learning about embedded computing with the Elego UNO Project Basic
    Starter Kit and want to learn more, you might be interested to know that the same
    company offers a more advanced kit that could teach you so much more. It’s called
    the Elego UNO Project Super Starter Kit and it costs about twice the price of
    the basic kit.

    ```


    ingle board computers (SBCs), typically credit-card sized or smaller, are now
    a familiar part of the computing scene, thanks in no small part to the Raspberry
    Pi family of products. The Pi has spawned lookalikes from several companies, which
    have also attracted their supporters, but perhaps less well-known are those SBCs
    intended exclusively for embedded applications. Our aim here is to introduce this
    category of SBCs, and to illustrate how you could put them to work using a starter
    kit that you can pick up for just a few pounds.


    To start, though, just in case this is a new concept to you let’s describe what
    we mean by an embedded application. This is one that works in the background in
    such a way that the user might not even be aware that they’re using a computer,
    in the broadest sense of the word. So, for example, household appliances such
    as microwave ovens or washing machines are generally controlled by embedded software.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_103_1.png)


    Robotics is an excellent example of an embedded application, this one being based
    on Arduino hardware.


    If you’ve delved into the Raspberry Pi, you’ll no doubt be aware that it has several
    GPIO (General Purpose Input Output) pins. These can be used to interface to external
    components such as pushbuttons, LEDs, motors, sensors and such like, so they could
    be used to control a robot or a whole range of other real-world devices. In this
    sense the Pi could be considered as a platform for embedded computing, but it’s
    quite different from those SBCs that are intended exclusively for embedded use.


    The Pi is a general-purpose SBC; in fact many people use it to learn to code,
    and completely ignore its interfacing capabilities. This dual nature has one important
    consequence: Raspberry Pi computers run an operating system, commonly some flavour
    of Linux. By way of contrast, dedicated embedded SBCs generally don’t run an operating
    system.


    The lack of an operating system might seem to be a serious drawback, but for embedded
    applications it’s an asset. If your use of an SBC is just to learn about embedded
    computing, the Pi approach works well, but if you want to put your SBC to work
    in a real application, an operating system is an overhead you can do without.
    Perhaps the major drawback with an operating system is the time it takes to boot.
    We can imagine that a car wouldn’t be too popular if you had to wait 30 seconds


    for Ubuntu to start up before you could drive off. It also has implications in
    the amount of hardware you need. Many embedded applications will work perfectly
    well with a much less powerful processor than one you’d need to run an operating
    system. It’s not just the processor – commonly an embedded application won’t need
    any graphics hardware, and often it won’t need a host of interfaces such as Wi-Fi
    or Ethernet. Not only does this have cost benefits, it also reduces the power
    requirement which is a major advantage for battery-powered equipment.


    # Introducing Arduino


    Rarely will you find an off-the-shelf SBC inside a drone, a TV remote control
    unit or a food processor. Instead, in order to minimise the cost of these sorts
    of high-volume products and to reduce size, the computing hardware will usually
    be incorporated into a custom-designed circuit board, alongside all the other
    electronic circuitry. For low-volume DIY applications, though, and especially
    for learning about embedded computing without being hampered by an operating system,
    a dedicated embedded SBC makes a lot of sense. This is where Arduino boards come
    to the fore.


    Raspberry Pis and similar SBCs tend to be built around an Arm processor of some
    type. By way of contrast, many of the Arduino boards are based on'
