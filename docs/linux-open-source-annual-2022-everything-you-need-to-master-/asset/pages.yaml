  md: '# Roundup


    AIO System Rescue Toolkit » ALT Linux Rescue » MorpheusArch » SystemRescueCd »
    Ultimate Boot CD


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_39_0.png)


    Shashank Sharma

    By day Shashank Sharma is a New Delhi trial lawyer, but by night he’s an open
    source vigilante!


    # Rescue distros


    Linux is pretty resilient, but when things get out of hand, Shashank Sharma uses
    one of these specialised distros to rescue an installation.


    # HOW WE TESTED...


    Our parameters for testing haven’t really changed from the previous rescue Roundup
    in LXF209: we’re still looking for the distros with the widest collection of tools
    that’ll help us with all kinds of repair and rescue operations.


    However, that’s not the only parameter we’re interested in and it really isn’t
    even the most important one. Instead of the number of tools, the effectiveness
    of the complete distro gets more weighting in our books. Distros that help you
    wade through the multitude of tools and home in on the right tool for the job
    are rated higher than distros that only claim to bundle the largest number of
    rescue utilities.


    Since many of these utilities interact directly with disks and the crucial data
    they house, they can do more harm than good if used improperly. For a specialised
    task such as this, documentation thus plays a very crucial role.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_39_1.png)


    Linux has no shortage of healing utilities and tools that are designed to put
    broken computers back into active duty. Sure, the Linux kernel by design (and
    Linux distros by extension) has a higher threshold for breaking down, but a hardware
    failure or a clumsy operator can still wreak considerable havoc.


    The plethora of repair tools help users get out of all kinds of sticky situations.
    However, due to the sheer number of options on offer, the average Linux desktop
    user might not always choose the best tool for the job. Also, while you can find
    the tools in the official repositories of virtually all mainstream distros, since
    many of them are CLI-based they do not show up in application menus – so many
    greenhorns are actually oblivious of their existence. This is where the specialised
    rescue distros come into the picture. Instead of simply collating a vast number
    of healing tools, these distro help users find the right tool for the job. We’ve
    looked at repair and rescue distros in the past (see LXF209, page 24). But there’s
    a pretty high rate of attrition for these specialised spins, so much so that besides
    Two, all other candidates in the previous Roundup are now defunct – including
    the winner, Rescatux, so a rerun is more than overdue...'
