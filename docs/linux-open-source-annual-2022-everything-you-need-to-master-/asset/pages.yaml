  md: '# Do more


    # QEMU and KVM


    Dig deeper and build your own virtual machine at the command line using the power
    of Linux.


    VirtualBox is all well and good, but there are other options. Some people don''t
    like using Oracle software, and in the past the guest extensions (which enabled
    graphics acceleration and shared clipboards) were not freely licensed, meaning
    they couldn''t be bundled by distros and had to be installed separately.


    This is no longer the case and most distros now ship with the required host and
    guest modules — but occasionally, host and guest modules become mismatched (if
    a guest distro includes older modules than the host is running, for example) and
    they must be installed manually. These can be installed — on all platforms — in
    a running VM by selecting Install Guest Additions from the Devices menu. A virtual
    CD will be inserted and you''ll find a Linux script to build and install the modules,
    as well as Windows and Mac executables.


    Anyway, we digress: we were supposed to be talking about VirtualBox alternatives,
    not providing helpful advice. So, there''s the free (but not open source) VMware
    Workstation Player, which is fine for running a single machine on a desktop and
    from a user''s point of view works much the same as VirtualBox. However, the virtualisation
    revolution happened not because people could run clunky desktop operating systems
    windowed in another clunky desktop operating system, but


    because powerful servers could house multiple VMs – saving resources, increasing
    portability and generally making merry. Workstation Pro is VMware''s commercial
    offering, and of course there are Hyper-V, Xen and other proprietary tools that
    have revolutionised infrastructure management. One consequence of this is the
    rise of cheap VPS (virtual private servers) from the likes of Digital Ocean and
    OVH. These are a great way to see what remote server administration is all about.


    The Linux way of doing virtualisation is a tale of two cities: KVM and QEMU. KVM
    is the hypervisor part and enables the kernel to access the virtualisation functions
    of the CPU; QEMU is the userspace utility that talks to this and emulates virtual
    hardware. KVM has been ported to many architectures and is today running on Arm,
    IBM s/390 mainframes and MIPS. QEMU is an emulator, and we''ve already talked
    about emulation and virtualisation being different animals – but we''ll see later
    that the amount of actual emulating QEMU has to do can be reduced to almost zero.


    QEMU is a command-line affair, but as Linux aficionados or budding CLI warriors
    we won''t let that get in our way. Installing QEMU is just a matter of: `sudo
    apt install qemu`


    To deploy our first VM we first need to create a file that can be used to back
    the virtual storage. QEMU supports a number of formats for this; a raw image is
    the fastest, but the modern qcow2 format is not slow, is more resilient to disk
    or power failures, and supports snapshots. So let''s use it to create a 10GB image:
    `qemu-img create -f qcow2 10gbqcow2 10G`


    The qemu-img command can also convert, resize and do all kinds of other things
    with disk images, so check the man pages for more. As with VirtualBox, we need
    some sort of installation medium to begin. This is an opportunity to grab an ISO
    file for a distro you''d otherwise be scared to try on bare metal (go on, try


    # VIRTIO


    We mentioned that QEMU''s job in the QEMU/KVM duality is to emulate hardware,
    and we''ve alluded to the fact that this is a relatively slow process. So rather
    than emulate such things, it makes sense to tell the virtualised OS that it is
    thus, and that the hardware it can see is not real. In this way we modify the
    OS (or in this case its device drivers) and have the hypervisor present abstract
    paravirtualised hardware, which both sides conspire to handle nicely. The framework
    KVM uses for this soulery is called virtio, and its drivers enable paravirtualisation
    of block devices, video cards, network devices and the interestingly named balloon
    device (used for memory management). The virtio drivers need to be installed on
    the guest, but have been part of the Linux kernel for a long time – so for Linux
    guests no action is required.


    ```

    $ qemu-system-x86_64 -drive file=10gbqcow2,format=qcow2,if=virtio -net nic,model=virtio
    -m 1G -enable-kvm

    ```


    If, in the guest, you run


    ```

    $ lspci

    ```


    you''ll see your VM now has a virtio-powered video, Ethernet and SCSI disk. In
    order to take advantage of the improved imaginary video device you''ll need to
    install a desktop environment, which you can do with:


    ```

    $ sudo apt install ubuntu-gnome-desktop

    ```


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_71_0.png)


    QEMU doesn''t look like much at first, but it''s incredibly powerful and enables
    you to perform destructive actions with no risk of reprisal.'
