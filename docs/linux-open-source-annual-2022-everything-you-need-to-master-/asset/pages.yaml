- pgno: 29
  md: '# Distros


    # Usability and performance


    Does it take much effort to get used to them?


    T his Roundup includes operating systems that are called ''alternative'' for a
    reason. They are unlike your everyday desktop distro and in fact it''ll be unreasonable
    to expect them to look, feel and behave like other mainstream OSes as well. Many
    of them are also in the nascent stages of development, despite the fact that developers
    have been working on some of them for over a decade. The early development stage
    is a reflection of the OSes'' unstable base, which will have a direct impact on
    their usability and performance. Even when it comes to mainstream distros, usability
    is an important factor for consideration. Having a long list of features comes
    to naught if a distro isn''t usable. The same is true for these alternate OSes.
    This is why in addition to comparing them on various individual aspects that influence
    their usability, we''ll also rate their overall user experience to help you find
    one that gives you the most mileage on the desktop.


    # Haiku 8/10


    Don''t let Haiku''s beta status fool you: the project is pretty mature and been
    in existence for over a decade now. The usability of the OS is phenomenal, both
    inside a VM and on real hardware. The ISO gives you the option to either launch
    the installer or boot into a fully functional Live environment. The installer
    is very efficient at its job and also includes a partitioner to help you carve
    space for the OS. Even on a moderately powered machine, Haiku''s boot-up and shutdown
    times are pretty impressive. The OS works straight out of the box on most machines
    with standard hardware. It has one of the most comprehensive set of default apps,
    and you can fetch more using the graphical package manager. The user experience
    is further enhanced by the rich documentation and the project''s support infrastructure,
    which is designed to habituate first-time users.


    # KolibriOS 6/10


    KolibriOS is written in the FASM assembly language and based on the source code
    of the MenueOS operating system. It boots in a flash and gives you access to a
    number of useful apps. There''s no installation involved, though you''ll have
    to make sure you select the option to save the changes you made during the session
    when you shut it down. The OS supports FAT and NTFS filesystems and ships with
    drivers for popular audio, video and Ethernet hardware. The desktop is fairly
    intuitive to operate, and new users aren''t reprimanded for casually exploring
    the desktop and its various apps. The only shortcoming of the OS is that its productivity
    apps aren''t really mature enough for everyday use, though it lacks of a package
    manager doesn''t help its case either. On the other hand, if you like retro gaming
    there''s no better OS.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_29_0.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_29_1.png)


    # Documentation and support


    Will they guide you through the murky waters?


    B ecause VisOpen is primarily designed for developers and students, the bulk of
    its documentation caters for this group. There''s a lot of information that exposes
    the internals of the OS, which is a treasure trove for any Computer Science student.
    KolibriOS also has just enough documentation to help users get started with the
    OS. There''s a quick FAQ and some how-tos to help boot KolibriOS alongside Windows
    and Linux, as well as on virtual hardware. There''s also a fairly active multilingual
    forum for dispensing help. OpenIndiana fares a little better. It has a detailed
    FAQ and an (under construction) handbook, which is still fairly detailed. There''s
    also a wiki to help users and developers get oriented with the OS. The project
    surprisingly doesn''t have a forum, so you''ll need to use its mailing lists for
    your support queries, which is a rather clunky way of doing things. On the other
    hand, the ReactOS project has a wiki which hosts various tutorials designed to
    help first-time users install the OS and perform various tasks. The wiki is also
    home to developer documentation along with details about the internals of the
    OS. For support there''s a MatterMost-powered chatroom and multilingual forums.
    Similarly, Haiku''s website does everything it can to help orientate first-time
    users of the OS. It has various introductory documentation including a detailed
    FAQ, a fairly complete illustrated user guide, along with several other focused
    guides to help users install, update and virtualise the OS. There are several
    avenues for support as well including forums, IRC channels, mailing lists and
    so on.


    | VERDICT | 8/10 | | 8/10 |\n|---|---|---|---|\n| HAIKU | | REACTOS | |\n| KOLIBRIOS
    | 6/10 | VISOPSY | 4/10 |\n| OPENINDIANA | 6/10 | | |\n| New users will feel most
    welcome with the support infrastructure of the ReactOS and Haiku projects. | |
    | |'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# OpenIndiana


    Only available for 64-bit computers. OpenIndiana has separate images for optical
    media and USB devices. The images boot into a Live environment, from where you
    can launch the graphical- or text-based installer, which works just as expected.

    You don''t get the same ''alternative OS'' feeling with OpenIndiana as you do
    with the other OSes on test here because of the use of the MATE desktop environment,
    as well as a healthy dose of marqueed open source apps. The one major drawback
    as far as the usability of the OS is concerned is the lack of a graphical package
    manager. While the CLI version isn''t hard to master, it''ll alienate a good number
    of first-time users who are already out of their comfort zone in an alien OS.

    The lack of built-in documentation doesn''t help either- but OpenIndiana is the
    closest you''ll get to a typical Linux install.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_30_0.png)


    # ReactOS


    ReactOS is an open source operating system based on the design principles of Windows
    NT. It''s written completely from scratch and exists to give users an open source
    platform to run software designed for Windows, by being binary-compatible with
    the proprietary OS.


    The project offers a Live CD to help explore the OS and an install CD with an
    easy-to-navigate installer. Whether you''ve used Windows or not, you''ll find
    ReactOS intuitive to operate. Sure, it doesn''t ship with many apps by default,
    but you can flesh it out with the package manager.

    Besides physical hardware, you can also install ReactOS on virtual hardware, which
    is in fact a specialty of the OS given its alpa status. Despite its rather miniscule
    requirements, ReactOS only supports a limited set of devices and peripherals.
    When it does work, the biggest hindrance is the occasional Blue Screen of Death.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_30_1.png)


    # Visopsys


    Considering the fact that it''s primarily an educational system, Visopsys surprised
    us with its usability. What we thought of as an ideal candidate for the ''Also
    Consider'' box surprised us with its features and performance. The OS boots in
    a snap and gives you the option to either launch the installer or boot into a
    Live session. The inclusion of a very capable partitioner in the installer is
    another pleasant surprise.


    The desktop is fairly simple to navigate and includes a handful of essential apps,
    plus handy administration and configuration utilities. But attempts to use it
    for regular desktop tasks won''t take you very far, as the OS is missing a web
    browser and there''s no package management to help you pull in additional apps
    and utilities. Visopsys does a nice job of masquerading as a regular desktop,
    but it really is a very capable OS project and should be treated as such.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_30_2.png)


    # Hardware support and requirements


    Will they even work on your computer?


    Another aspect that keeps these OSes from becoming mainstream is their lack of
    hardware support. On the other hand, on compatible hardware most of them will
    outperform your favourite Linux distro.


    For instance, Visopsys can power a graphical desktop from any Pentium computer
    with 64MB of RAM. The OS supports all variations of the FAT filesystem and has
    read-only support for ext4. In terms of peripherals it supports PS/2 and USB input
    devices, IDE and SATA disks, and PNetEthernet cards.


    Similarly, you can run ReactOS on any Pentium-class x86 machine with just 256MB
    of RAM. ReactOS collaborates with various other projects such as Haiku for its
    hardware support, which is still fairly limited in comparison to some of the other
    OSes in this round-up.


    KolibriOS isn''t much different either. It''s a 32-bit-only OS and requires miniscule
    amounts of resources. Its developer claims it''ll even run on machines with the
    original Pentium processor. The OS supports USB 2.0, and quite a few popular Ethernet
    devices as well as Radeon and Intel graphics drivers. OpenIndiana needs a 64-bit
    computer with at least 4GB of RAM for decent performance. The project also hosts
    a community-maintained list of supported peripherals, which is fairly detailed.


    Haiku produces images for both 32- and 64-bit machines. The project borrows its
    Ethernet and Wi-Fi drivers from FreeBSD, via a KPI compatibility layer. They''ve
    been upgraded to those from FreeBSD 11.1 and support the Atheros 9300-9500 families,
    Intel''s newer ''Dual Band'' family, some of Realtek''s PCI chipsets, and newer-model
    chipsets in all other existing drivers.


    # VERDICT


    | HAIKU | 8/10 | REACTOS | 6/10 |

    | KOLIBRIOS | 8/10 | VISOPSYS | 5/10 |

    | OPENINDIANA | 8/10 | | |


    > While they''ll run on your everyday computers, don''t expect these OSes to support
    all your hardware.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# ## Package management


    What apps are available in their repositories?


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_31_0.png)


    **S**ome of the OSes in this Roundup ship with a lot of apps, but others are rather
    bare-bones and aren’t really useful straight after installation. You’ll have to
    flesh these out to use the OS productively on the desktop. Unfortunately, not
    all of the OSes let you install additional apps, and some take far more effort
    than others.


    KolibrIOS and Visopsys belong to the former category: there is no means of installing
    additional packages to them. While OpenIndiana does have a package management
    system, and quite an adept one at that, fleshing out the OS is one of the weakest
    points of the OS. The OS uses the Image Packaging System but features a CLI package
    manager, *pkg*, rather than a graphical one. While *pkg* is very similar to *apt*
    and *dnf*, you will have to read through the man page and other documentation
    for tasks such as adding repositories.


    On the contrary, package management is the only saving grace of ReactOS’s vanilla
    installation. The OS uses a Sysntropic-like app store that appears when you use
    the Add/Remove Programs function in the Control Panel. The ReactOS Application


    > > Besides apps like LibreOffice and Firefox, you can also use the ReactOS Application
    Manager to download libraries like Adobe AIR and Microsoft .NET framework.


    Manager is intuitive to operate and enables you to install multiple programs in
    bulk. You can also continue to use the app while it’s downloading and installing
    software. Similarly, one of the highlights of the latest release of Haiku is its
    graphical package manager, HaikuDepot. It’s intuitive to operate and works pretty
    much like the package management systems on Linux.


    # **VERDICT**


    | HAIKU | 8/10 | REACTOS | 8/10 |

    | KOLIBRIOS | 0/10 | VISOPSYS | 0/10 |

    | OPENINDIANA | 5/10 |  |  |


    > > Being stuck with the default apps isn’t as much of an issue in KolibriOS as
    it is in Visopsys.


    # ## Daily use


    Can you use them as your everyday desktop?


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_31_1.png)


    **Y**ou can definitely use OpenIndiana as a regular desktop, especially when you
    consider the fact that it ships with a familiar environment and mainstream open
    source apps. However, the OS doesn’t include all the apps you’ll need and you’ll
    have to fetch additional ones using its CLI package manager, which interrupts
    an otherwise smooth user experience.


    Although Visopsys is a fully functional OS, you can’t really use it as an everyday
    desktop in the traditional sense. The OS is developed by an individual and is
    more of an educational tool rather than an actual OS which you can put to use
    for everyday tasks. It also lacks crucial productivity apps such as an internet
    browser and a package management system.


    ReactOS is discontinued because, by its own admission, the project isn’t yet ready
    for use as your daily desktop. It won’t disappoint you in terms of app availability,
    but the system isn’t stable enough yet to be used reliably for productive work.
    The Live CD only worked on one of our test machines, and installing the VirtualBox
    Additions brought up the infamous Windows-like Blue Screen of Death.


    In contrast to the previous two, KolibrIOS ships with a large number of apps out
    of the box. Unfortunately, many of the crucial ones are rather rudimentary. For
    instance, the web browser is text-based, and while it had no issues rendering
    simple sites like the KolibrIOS website, it crashed whenever we tried to use it
    to visit data-intensive websites such as YouTube. The one task we


    > > The Time Slider utility in OpenIndiana takes advantage of the ZFS filesystem
    to take snapshots of the installation at timed intervals.


    absolutely recommend the OS for is retro gaming, for which it remains unparalleled.


    All things considered, the OS you’ll be most comfortable using for daily desktop
    duties is Haiku. It has impressive hardware support and doesn’t throw any unexpected
    errors during installation. The collection of apps on the desktop, such as the
    WebKit-powered web browser and the availability of useful apps in the package
    management utility, surely helps it meet the desktop computing requirements of
    a large number of people.


    # **VERDICT**


    | HAIKU | 8/10 | REACTOS | 5/10 |

    | KOLIBRIOS | 5/10 | VISOPSYS | 4/10 |

    | OPENINDIANA | 8/10 |  |  |


    > > OpenIndiana and Haiku are your best bets if you’re looking to be productive.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Open operating systems


    # The Verdict


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_32_0.png)


    This is an interesting *Roundup* to rate. Visopps brings up the rear, but it doesn’t
    lose out in the traditional sense of the word. The OS is in fact in a league of
    its own and has no peers. Instead of looking at it as an alternative OS which
    you can use productively, think of Visopps as a computer science project on steroids.
    If you need to wrap your head around the inner workings of a multi-threaded, fully
    preemptive multitasking OS, there is no better option than Visopps.


    While ReactOS’s default desktop doesn’t offer much, you can quickly turn the vanilla
    installation into a productive one thanks to its software repository. Unfortunately,
    fleshing out the OS with useful apps doesn’t automatically make it usable. The
    alpha nature of the OS and its limited hardware support means that it will continue
    to operate in the confines of a virtual environment for the time being.


    KolibriOS makes it to the podium, but in last place. Straight out of the box,
    it offers all of the apps you’ll need on a desktop for everyday use. Unfortunately,
    however, several crucial ones – such as the web browser – are quite rudimentary,
    and you’ll be testing their limits in no time. But as we’ve said before, KolibriOS
    makes a wonderful option for anyone into retro-gaming.


    If an AI (that’s *exactly what an AI would say!*–Ed) was doing this *Roundup*,
    it would have awarded the win to OpenIndiana, as it scores highly on all the parameters
    except one. It’s the only OS in this *Roundup* that looks and feels like any other
    Linux distro featuring the MATE desktop. Complementing the familiar-looking desktop
    are commonly used productivity apps for everyday use. The weakest point of the
    OS is the lack of a graphical package manager, which might make new users hesitant
    about venturing into this OS.


    Ironically, it’s precisely the lack of an alien feeling that keeps OpenIndiana
    from claiming the top spot on the podium: it looks too familiar to be considered
    as an alternative OS. All things considered, Haiku has the right mix; it looks
    like an alternative OS, behaves like one too and yet enables us to be productive
    enough to use it as a daily desktop.


    # » ALSO CONSIDER


    There are several other open source OSes that we didn’t include for one reason
    or the other. The most mainstream alternative is TrueOS, formerly known as PC-BSD,
    which is a desktop flavour of FreeBSD. There’s also GhostBSD for those looking
    for a MATE-based desktop.


    For fans of AmigaOS there’s Symballe Desktop, which wasn’t included as it hasn’t
    been updated for several years. Similarly, it’s been some years since the last
    release of MenueToS, which is the progenitor of KolibriOS. The 64-bit version
    of MenueToS had a release last year, but that version isn’t open source. Licence
    ambiguities also prevented us from featuring another AmigaOS clone, Icaros, which
    is based around the AROS Research operating system. We also couldn’t spot the
    source code repository. There are other AROS-based OSes, such as AspireOS and
    AROS Broadway, but they either have severe hardware restrictions or aren’t actively
    maintained.


    **1st**

    **Haiku**

    8/10


    **Web:** [www.haiku-os.org](http://www.haiku-os.org) **Licence:** MIT and others

    **Version:** R1/beta1


    The alternative OS which gives you the best mileage.


    **2nd**

    **OpenIndiana**

    8/10


    **Web:** [www.openindiana.org](http://www.openindiana.org) **Licence:** CDDL and
    others

    **Version:** 0.4.11


    An alternative for those looking for familiarity.


    **3rd**

    **KolibriOS**

    6/10


    **Web:** [http://www.kolilios.org](http://www.kolilios.org) **Licence:** GPL v2

    **Version:** 2018.10


    Use it for its retro-gaming emulators, if nothing else.


    **4th**

    **ReactOS**

    6/10


    **Web:** [http://www.reactos.org](http://www.reactos.org) **Licence:** GPL, LGPL,
    BSD

    **Version:** r7617


    A Windows look-alike that is most usable on virtual hardware.


    **5th**

    **Visopps**

    6/10


    **Web:** [http://visopps.org](http://visopps.org) **Licence:** GPL, LGPL

    **Version:** 0.83


    A wonderful option for CS students and OS enthusiasts.'
