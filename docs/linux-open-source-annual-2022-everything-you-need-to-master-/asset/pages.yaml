  md: '# ## Digital audio workstations


    What''s the word when it comes to ultimate sound editing? DAW...


    The digital audio workstation is to music editing what Photoshop is to graphic
    editing: an all-singing, all-dancing piece of software for recording, editing
    and mixing all sorts of audio. Traditionally DAWs have been complex, expensive
    and decidedly proprietary – think things like Pro Tools – but there are great
    Linux alternatives.


    Ardour is an open source, collaborative effort of a worldwide team. Over the past
    few years it has undergone quite a few changes, so we''ll be giving that primary
    focus. We''ll also look at Qtractor very briefly – if you would like to know more,
    see LXF242 for a proper rundown.


    Although Ardour has plenty of MIDI capabilities, its MIDI editing prowess isn''t
    highly regarded, so we''ll just focus on audio editing for Ardour, and leave MIDI
    and some other areas to Qtractor.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_101_0.png)


    The GUI has undergone many improvements, with a tabbed interface instead of many
    small windows, and a far more intuitive workflow. It appears you can now run Ardour
    through ALSA, without the need for JACK – this should greatly simplify usage,
    though presumably this also limits your mixing functionality.


    During setup, you''re asked where to place Ardour''s recorded files; whether to
    use a hardware mixer or have Ardour play material as it''s recorded; and whether
    to use the master bus directly, or use an additional Monitor bus (just use the
    default if you don''t know). Next, you''re given a choice of session templates
    for getting you straight into a workflow. However, in order to show you the GUI
    in a pure, simple form, choose Empty Template for now.


    Lastly, you''ll need to define the options for Audio/MIDI Setup. Our version defaulted
    to ALSA, though we had to specify the right input and output devices. Once started,
    Ardour will take over your sound card entirely, so don''t expect to multitask
    between something like Ardour and online cat videos.


    If you prefer JACK, you''ll be given a series of configuration options. If you
    don''t really know what you''re doing here, just make sure the right device is
    chosen and click Start. If JACK has already been configured, Ardour will start
    it automatically for you. Once inside the main screen you will see a track called
    Master. This is the Master bus: everything passes through it, but you can ignore
    it for now – first you need to create a track you can record over. To make your
    first track, you can either do it the long way by clicking Session > Add Track,
    Bus or VCA; or you can just right-click on the track panel to the left of the
    screen.


    When the Add Track window appears, there are a selection of track types to choose
    from. We''re just concentrating on audio, so stick with the default choice of
    Audio Tracks. In Configuration, choose whether you want mono or stereo, give your
    track a name and click ''Add and Close''.


    Back in the main editing screen, look to the track panel on the left and click
    the Record button on the new track. From the main toolbar, click Ardour''s primary
    Record button (which will flash, meaning it''s ready to write), and click the
    Play button to start recording.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_101_1.png)


    # ### Adding effects in Ardour


    Changing the Pan is, say, unintuitive, so we''ll start there. By default the Pan
    slider is locked, and instead you control the width of the stereo image. To unlock
    the Pan slider, right-click the Pan control and choose Stereo Balance from the
    drop-down menu.


    To add an effect, select the track you want to enhance, and click the Solo button
    to hear the track in isolation. In the mixer panel, right-click the blank area
    of space under ''Fader''. From the drop-down menu, select New Plugin, where you
    can browse all the plug-ins you''ve installed. When activated, a window will open
    with your plug-in''s settings.


    Back in the mixer, your plug-in will have a little green light, indicating it
    is enabled. If audio is playing, you can enable and disable the plug-in to compare
    the difference in sound.


    # ### What a mix up!


    Before we go any further, we recommend turning on View > Show Editor Mixer. We
    won''t cover the complex issue of audio buses here, but we can show you how to
    apply simple mixing and effects.


    Each track has some basic controls on the left, such as Mute, Solo, Gain and record
    with this track. If you right-click on the track controls there are more options,
    including basic things such as track colour, and more


    Image credit: Thorsten Wilms (CC BY-SA 3.0)


    Do more


    102'
