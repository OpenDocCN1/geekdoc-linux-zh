    \ that doesn't know what they are getting into, but having a logically laid-out\
    \ interface with a clear path of progression will go a long way to getting the\
    \ most out of the tools. Ease of deployment and reasonable defaults are the icing\
    \ on the cake, and while they aren't all critical to selecting a good administrative\
    \ tool, they can't really hurt its chances.\n\n# Clonezilla  \n**8/10**\n\nClonezilla\
    \ is one of the most recommended tools on Linux forums for imaging an old disk\
    \ to a bigger, new disk thanks to its intuitive (Really?—Ed.) to navigate. In\
    \ the background, Clonezilla uses a set of scripts with several open source disk\
    \ utilities such as Partimage, ntfsclone, Partclone and dd to help you duplicate\
