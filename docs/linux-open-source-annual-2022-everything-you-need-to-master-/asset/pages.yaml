  md: "# Malware on Linux\n\nRunning desktop Linux certainly puts you in a minority,\
    \ but malware doesn't discriminate when it comes to your OS.\n\nA\n\tone stage\
    \ utterances of the form “Linux doesn’t get viruses” were commonplace. They still\
    \ are, by fans of the operating system and even by distro makers (see *right*\
    \ [https://manjaro.org.](https://manjaro.org.))\nUnfortunately such talk was never\
    \ quite true and it’s more fallacious now than it ever was. Worms, rootkits and\
    \ all kinds of other nasties existed on UNIX systems while Linux was still just\
    \ a twinkle in Linus’s eye. Many of the techniques they used were adapted to the\
    \ Linux platform when it fruited.\n\nAs far as desktop Linux is concerned, things\
    \ are reasonably clear: there are far fewer attacks reported, and the list of\
    \ known malware strains is far shorter than on Windows machines. Given desktop\
    \ Linux’s market share (somewhere around two per cent), this makes sense – attackers\
    \ will be more inclined to go after whatever the masses are using. In 2006 the\
    \ ‘Get a Mac’ series of television commercials claimed ‘Macs don’t get viruses’.\
    \ Since then, its desktop market share has increased to somewhere around ten per\
    \ cent, and the number of threats has increased proportionally. This in spite\
    \ of Apple’s walled-garden approach to software installation.\n\nThese days opinion\
    \ is divided on whether or not antivirus software is helpful on Windows, not because\
    \ it doesn’t do what it claims to do, but because it sometimes (due to poor programming)\
    \ opens the system up to new, potentially more dangerous attacks. Security guru\
    \ Tavis Ormandy, part of Google’s Project Zero security team, has been particularly\
    \ vocal about this threat. Programs that run with the highest level of privilege,\
    \ as is required for antivirus to scan system files or privileged memory, need\
    \ to be airtight. If these are vulnerable, then so is the system, possibly more\
    \ so than if no such antivirus was running.\n\nMore often than not you don’t need\
    \ to rely on a vulnerable program to exploit a system: a vulnerable user will\
    \ do just fine. Writing a program to encrypt all user files, to log/inject keystrokes\
    \ (at least in X – see [https://github.com/CoolerVoid/Rootstealer.](https://github.com/CoolerVoid/Rootstealer.))\n\
    \n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_82_0.png)\n\nOh no, apparently our\
    \ letters address has ended up on a breach list somewhere. No one tell the readers!\n\
    \n![](img/3f314b57ad3c8b08d25e5d1ab47de56d_82_1.png)\n\n+   - Manjaro’s home page\
    \ says you don’t need antivirus software, and they’re almost certainly correct.\n\
    \nlaunch an FTP server (making a machine’s files available to the world), even\
    \ to wipe all local storage if that user has root privileges and can be tricked\
    \ into entering a password – all this is trivial. The trick is getting a suitably\
    \ gullible user to run it. Likewise, with some knowledge of a potential ruin,\
    \ a carefully crafted phishing email could trick them into visiting a fake website\
    \ from whence their passwords can be swallowed, opening a poisoned PDF, or even\
    \ just running a malicious executable – if so they wasn’t blocked by either email\
    \ provider or the target’s email client. Humans have a bad habit of trusting things\
    \ when they (seemingly) come from someone they know, so it’s easy to see how these\
    \ things can cascade and become a large-scale outbreak.\n\n# » WE ♥ STATS\n\n\
    The *Thycotic Black Hat 2018 Hacker Survey Report* [1] states that almost 60 per\
    \ cent of hackers thought social engineering was the fastest way to pwn a network.\
    \ Malware (6 per cent) and application vulnerabilities (20 per cent) are much\
    \ less likely to be used. Thanks to lax security practices and/or hacker ingenuity,\
    \ there are considerably sized password dumps publicly available. You can check\
    \ if any of your email addresses are associated with these dumps by visiting *try*\
    \ [*Hunt*](https://havelbeenpwned.com) *https://*. A password for an old forum\
    \ you joined years ago may not be much use to a hacker, but if that forum account\
    \ can be tied to your identity (via email address, username or otherwise) and\
    \ you re-use that password or some trivial variation of it elsewhere, the game\
    \ changes. The survey found that password re-use was by far the most exploited\
    \ behaviour by hackers (50 per cent), with public Wi-Fi use and poisoned USB drives\
    \ being joint second at around 20 per cent each.\n\nOf course, the stereotypical\
    \ image of a hacker doing abusive things with hex editors, disassemblers and debuggers\
    \ isn’t entirely a work of fiction, but why go to that effort, if just asking\
    \ nicely for someone’s password will do the trick. Of course, these aren’t definitive\
    \ numbers, and the survey reports “300+ participants”.\n\n+   1) [https://thycotic.com/resources/black-hat-2018-survey](https://thycotic.com/resources/black-hat-2018-survey)"
