- pgno: 37
  md: '# # Plug-ins and extensions


    ### Going above and beyond.


    Just because these desktops are lightweight doesn’t mean they can’t provide the
    bells and whistles you get with mainstream desktops. As these elements inevitably
    increase the memory footprint of the desktop, some of the desktops bundle them
    inside a separate package, while others avoid them altogether.


    EDE doesn’t believe in offering any additional plug-ins and so you’re stuck with
    the default functionality. On the other hand, while Openbox can be extended by
    plugging in various components such as a file manager, the window manager itself
    cannot take on new features via plug-ins, extensions or additional modules of
    any sort.


    Lumina began life as a set of extensions to Fluxbox, a stacking window manager
    for the X Window System, and bills itself as having a plug-in-based interface
    design. This enables you to customise the desktop as needed simply by choosing
    which plug-ins to have running on the desktop and taskbar. But the process to
    change the extensions isn’t very apparent, and doesn’t always work if the desktop
    is installed on distributions besides TrueOS. Then there’s LXQt, which uses the
    concept of modules – essentially desktop-independent tools that operate as daemons


    for the local user on desktop specific operations. The desktop is further made
    up of several optional components such as the display manager and the power management
    module. LXQt’s panel also supports plug-ins.


    Moksha is a treasure trove of extensions, plugins and modules that add functionality
    to the window manager itself. It also has gadgets that are placed on the Shelf
    or the Desktop.


    **VERDICT**


    | | SCORE |

    | :--- | :--- |

    | EQUINOX DESKTOP | 3/10 |

    | LUMINA | 6/10 |

    | LXQT | 6/10 |

    | MOKSHA DESKTOP | 8/10 |

    | OPENBOX | 1/10 |


    *Besides Equinox and Openbox, all these desktops enable you to further extend
    their functionality.*


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_37_0.png)


    # # Configurability


    ### Mould them as you like.


    Since you’ve taken the steps to add a new desktop, it’s your natural will you’ll
    want it to do your bidding by customising the way it works.


    All configuration options in EDE are housed inside the configuration window. It
    provides six tools to customise different but very basic aspects of the desktop
    including wallpaper, screensaver, calendar, volume and preferred apps. Advanced
    users can also set various other aspects of the desktop by manually editing configuration
    files.


    Openbox users can customise the window manager using the Openbox Configuration
    Manager (obconf) app. This helps you customise little else besides various aspects
    of the window manager. For instance, you can use it to change the default appearance
    and style, and the change the behaviour of the mouse and the position of the taskbar.


    You can use Lumina’s configuration utility to tweak various aspects of the desktop,
    such as the theme and window effects. You can also use it to set up default apps
    and define keyboard shortcuts, as well as alter the layout of the three critical
    aspects of the desktop – namely the desktop, panels and menu. While most of the
    tweaks apply system-wide, there are a couple that are restricted to the logged-in
    user.


    LXQt’s configuration centre offers similar options, albeit in a much nicer interface.
    But this is to be expected, as, along with Openbox, it’s one of the oldest projects
    featured in this Roundup. You can use various options to configure different aspects
    of the desktop. While most settings apply to the logged-in user, there are several
    that help influence the desktop as a whole. Similarly, you can use the Moksha
    Settings Panel to add more things to the desktop. You can change the theme for
    the desktop and even for the apps. All the elements have various other tweakable
    settings as well.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_37_1.png)


    Besides the usual settings, there are also several advanced ones. Of note among
    these are the Power Management settings that help extend battery life by enabling
    you to adjust the time for deferring various power-intensive tasks.


    **VERDICT**


    | | SCORE |

    | :--- | :--- |

    | EQUINOX DESKTOP | 7/10 |

    | LUMINA | 8/10 |

    | LXQT | 8/10 |

    | MOKSHA DESKTOP | 8/10 |

    | OPENBOX | 7/10 |


    *You can mould each of these desktops as per your needs.*'
