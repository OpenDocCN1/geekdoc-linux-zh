- pgno: 86
  md: '![](img/3f314b57ad3c8b08d25e5d1ab47de56d_86_0.png)


    > The Spectre and Meltdown vulnerabilities were a nightmare for sysadmins, but
    at least gave rise to these funky. CC0-licensed logos.


    overflow is hard to exploit directly, but it has been used historically to attack
    the SSHv1 protocol (thankfully now deprecated); see [www.kb.cert.org/vuls/id/945216](http://www.kb.cert.org/vuls/id/945216).


    # ### Getting over buffer overflows


    Programmers have been trying for 30 years to avoid the kind of oversights that
    lead to these vulnerabilities, and their exploitation. But, to quote our **2015**
    interview with Mozilla programmer Jim Blandy, “The experiment has been run. Humans
    cannot be trusted to write that code”. Instead of giving up writing code, boffins
    have come up with new ‘memory safe’ languages such as Mozilla’s Rust, Google’s
    Go and Apple’s Swift, which, while not entirely invincible to exploitation, at
    least put the kibosh on a lot of common memory vulnerabilities.


    But rewriting major projects in these languages isn’t something that’s going to
    happen overnight, and nor is it an option for large projects (like the Linux kernel)
    which depend on the features and speed of the C language. It’s not all doom and
    gloom though – these languages are being used productively in a number of places.
    Mozilla has been developing its Rust-based web engine Servo since 2012, and Go
    continues to be the language of choice for hipster system programmers. Swift is
    popular too, but rather than cite a real example we’ll direct you to the **@swift_on_security**
    Twitter account where you’ll find an irreverent account of information security
    (infosec) today.


    One of the major breakthroughs in defying exploitation became mainstream around
    2005 in the form of Address Space Layout Randomisation (the original PaX kernel
    patch appeared in 2000). This shuffles around the in-memory data required by a
    program when it is loaded. Before ASLR, an attacker could figure out where a program’s
    resources, such as its stack and libraries, were located in memory. So if the
    program was subject to some kind of vulnerability, this could be exploited by
    writing data that would be guaranteed to overwrite, say, the stack.


    A mid a tide of Word macro viruses and email worms this – together with Data Execution
    Prevention, which prevents designated addresses from being both writable and executable
    – was great news for Windows. It eliminated a whole class of vulnerabilities.
    No longer could one just find any old vulnerability and use it to stick any old
    shellcode into the execution stack. Unfortunately miscreants moved with the times,
    and new, more malevolent techniques (such as Return Oriented Programming and Heap
    Spraying) evolved, and there’s no shortage of exploits to this day.


    Fortunately tools like **Valgrind** make detecting some of them, at least, slightly
    easier.


    **ASLR** was extended to the Linux Kernel itself in 2014, making a new acronym
    (**KASLR**) and defending against nasty kernel exploits. However KASLR, it turned
    out, could be defeated using timing exploits on modern CPUs, so further defences
    were necessary. These came in the form of Kernel Page Table Isolation (**KPTI**),
    which was introduced to address the Meltdown vulnerability – though this was kept
    hush-hush until said vulnerability was made public in January 2018. Meltdown meant
    that by exploiting a race condition, privileged information could be extracted
    by processes not entitled to it.


    Ultimately it enables a rogue process to read memory from the kernel or other
    processes, like a password manager. Since it can be exploited through JavaScript,
    this also means one tab could access information in another, which is pretty terrifying.
    For more information about Meltdown (and the related Spectre) vulnerability, see
    our glorious feature in **LXF235**.


    # ## WHY OVERFLOWS WORK


    > > “Instead of crashing a program by feeding it the wrong kind of cat GIF, we
    could have it execute our payload.”


    and the latest MDS variant on page 10. New variants of these attacks are being
    discovered with alarming frequency, but so too are our defences against them.
    The first round of mitigations came with some fairly serious performance hits
    to certain workloads, but these are being worked on. Linux 5.1 introduced some
    new optimisations for the return trampolines (“retpolines”) central to protecting
    privileged memory. With Linux 5.2 a new kernel command line option, **mitigations**,
    will be introduced.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_86_1.png)


    > This vintage integer overflow bug actually featured, along with Nmap, in the
    (disappointing) movie **Matrix Reloaded**.


    87'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# The only Linux antivirus...


    Your desktop might not need it, but Linux has antivirus software too.


    M any of the popular Windows antivirus programs have a Linux equivalent (Sophos,
    ESET NOD32, Comodo, F-PROT). But more often not these do little more than scan
    for signatures of Windows viruses. This doesn’t mean they should be disregarded
    outright: if you use Wine to run Windows programs then you could inadvertently
    use it to run Windows malware. Also, if you run a email server then it’s absolutely
    in your interests to scan incoming messages for Windows threats. Even if you don’t,
    maybe you’d rather know if that file you can’t remember downloading contains a
    Windows nasty, and maybe you’d feel safer scanning it from Linux.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_87_0.png)


    ClamTk can be found in the all-providing Ubuntu Software Centre.


    # » MALWARE AT LARGE


    As the world descends into geopolitical chaos, we hear more and more about the
    shadowy “cyber operations” of nation states and the evil genius hackers that reside
    therein. North Korea, Russia, China and Iran have all been fingered by Western
    governments for various cyber-wrongdoings. The Wannacry ransomware, which was
    based around a leaked NSA exploit called EternalBlue, is generally accepted to
    have come from North Korea. This nearly crippled health services here in the UK,
    and could have been much worse had it not been for the deft work of security researcher
    Marcus Hutchins, who was able to analyse the malware and find a killswitch. Unfortunately
    Hutchins was recently pleaded guilty to wire fraud charges in the US dating from
    2014, when he may have been involved in the shadowy side of malware research.
    The Russian VPNFilter malware has been detected on half a million routers since
    its discovery last year. This is has been described by Cisco researchers as a
    “Swiss Army hacking knife”, having a modular structure as well as the ability
    to persist (via firmware injection) across reboots. One module attempts to downgrade
    TLS connections so that web traffic can be sniffed and possibly tampered with.
    A key command and control (CnC) server was seized by the FBI, but infections are
    ongoing indicating considerable resilience in the botnet. The malware sought out
    other servers by downloading images from **Photobucket.com**, which had IP addresses
    hidden in their EXIF data.


    We’re going to look at what appears to be the only open source antivirus software,
    ClamAV. We actually looked at this way, way back in LXF131 and to be honest, barring
    a higher version number, it hasn’t changed that much. The Ubuntu 19.04 repositories
    include a nearly up-to-date version of ClamAV (0.100.3 versus the 0.101.2 available
    on its website). Older versions of the program are available for previous Ubuntu
    releases, or you can compile it yourself if you’re feeling brave – the PPA no
    longer exists. Generally speaking you’ll run fine with an older version since
    it will still download up-to-date definitions. Installation is just a matter of:


    ```

    ```

    $ sudo apt update

    $ sudo apt install clamav

    ```

    ```


    The core of ClamAV features three main components:


    +   - **clamscan** – a command line tool for scanning files and directories.

    +   - **clamd** – a daemon that runs in the background allowing files to be scanned
    on access.

    +   - **freshclam** – a tool to update the virus signature database.


    The daemon is included in a separate package, so if you’re not interested in on-access
    scanning (which may slow down your system or use lots of memory), don’t worry
    up with:


    ```

    ```

    $ sudo apt install clamav-daemon

    ```

    ```


    You can run:


    ```

    ```

    $ sudo freshclam

    ```

    ```


    manually to update the database, but a systemd service file is provided to do
    this automatically. As it turns out, if you try to run that command while the
    server is running, you’ll get an error. Said service can be stopped with the command:


    ```

    ```

    $ sudo systemctl stop clamav-freshclam

    ```

    ```


    This may be of interest for people that want to set up a cron job (in the spirit
    of LXF131). Meanwhile, let’s get on with testing our glorious antivirus. We’ll
    download the EICAR test file, which contains a (harmless!) signature that ClamAV
    ought to recognise:


    ```

    ```

    $ wget https://www.eicar.org/download/eicar.com.txt

    $ clamscan eicar.com.txt

    ```

    ```


    You should see output matching the screenshot (see top right). For general on-demand
    use, you can just call **clamscan** with the file(s) or directories you’d like
    to scan. For delving into directories, or entire filesystems, use the command:


    ```

    ```

    $ clamscan --recursive /

    ```

    ```


    If you’re feeling paranoid, a number of third-party signatures can be downloaded
    from the repository at **https://github.com/extremeshock/clamav-unofficial-signatures**
    These come from various sources (including the Linux-focused Linux Malware Detect,
    another open source malware scanner), and will increase the chances of false positives,
    but may also increase your peace of mind.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'Windows anti-malware programs are characterised by over-the-top GUIs and paranoid
    “Threat Detected” klaxons. ClamTk is a graphical interface to ClamAV, but it is
    much more reserved in its appearance. It comes in its own package, **clamtk**,
    and can also be found in the Ubuntu Software Centre. There are also dedicated
    Linux programs, a couple of which deserve a mention here, if only because they’ve
    been around for a long time: *rkhunter* and *chkrootkit*. These are command-line
    tools for the detection of rootkits and other nasties.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_88_0.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_88_1.png)


    # Secure your servers


    Linux servers offer a much more juicy target than Linux desktops, and potentially
    are more useful than taking over a Windows desktop machine too. There are a lot
    of Linux servers on the internet, many of them housing considerable computing
    power and attached to very fat pipes. So they’re ideal targets for cryptojacking
    attacks or turning into spam-spewing zombies.


    Such machines may never be turned off and only rarely rebooted, so if compromised
    they can be used in long-running attacks. It’s quite inconvenient for a hacker
    if the machine they’ve compromised suddenly disappears or changes IP address as
    home machines are wont to do. Sadly, a lot of the Linux servers on the internet
    live a life of neglect. Deprived of regular updates, they become sitting ducks
    for script kiddies who have got their grubby paws on the latest weaponised proof
    of concept code.


    System administrators can be socially engineered into giving up passwords or running
    dodgy programs in the same way as home users can (although they should feel ashamed
    when they do), but another avenue is to attack the services running on their servers.
    The open source software that powers popular websites – Apache, Drupal, PHP, MySQL,
    WordPress and pretty much anything else you could care to name – has at some stage
    suffered from some kind of vulnerability. So has other software found commonly
    on Linux boxes; vulnerabilities in *OpenSSH* and *Bash* led to more than their
    fair share of sysadmin hair loss when the Heartbleed and Shellshock vulnerabilities
    struck in 2015 and 2014.


    Besides conventional Linux servers, the burgeoning world of the Internet of Things
    offers a new kind of (often) Linux-based target. This situation is in some ways
    opposite to hacking a server. To an attacker, the server is a single, powerful
    machine. However, if an attacker finds a vulnerability in, say, a popular brand
    of home security camera, then they can – through the magic of services like **www.shodan.io**,
    a search engine for servers and IoT devices – find and take over a sizeable army
    of these (not very powerful) things. Collectively, they might have a considerable
    amount of computing power (*hello Bitcoins!–Ed*) or bandwidth which is now at
    the attacker’s disposal.


    This is precisely how the Mirai botnet was able to launch a huge DDoS (Distributed
    Denial of Service) attack against DNS provider Dyn, causing major websites to
    disappear from the internet in 2016. Mirai (see interview [LXF244]) was able to
    become so large because so many devices run an easy-to-find telnet server with
    well-known, often hardcoded, username and password combinations. The Mirai source
    code is easy to find online, and new variants of it are still appearing today.
    In 2017 one was spotted infecting Huawei routers. In 2018, one, known as Satori,
    even attacked cryptocurrency mining operations through a vulnerability in the
    popular *Clamyo*’s Minor software, interfering with payment addreses for referrals
    profit.


    # THE THREATS NEVER END

    “The burgeoning world of the Internet of Things offers a new kind of (often) Linux-based
    target.”


    If security-conscious people had their way, IoT devices would never ship with
    default credentials, but it seems marketing people have got their way. Coming
    up with new credentials before you can use your fancy internet-enabled fridgecam
    (or whatever) is, it would seem, deemed user-unfriendly. It’s well worth going
    out of your way to change any default passwords on webcams, routers, NAS devices
    and the like.


    For devices where these things are hardened, the device should be firewalled so
    that it’s not accessible from the outside world – or possibly taken back to the
    shop. It’s also worth running a portscan on your network to see what services
    are running on what devices. Our favourite tool for this purpose is *Nmap*, which
    you can find in all good repos, and which will tell you all about your network
    with something like: *$ sudo nmap 192.168.0.*

    Running it as root thusly allows Nmap to identify devices through MAC descriptors.
    [iv]'
