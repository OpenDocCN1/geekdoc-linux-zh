    option in the Overview section: once the VM has been installed in classic BIOS
    mode, it is stuck there.


    The default NAT Network will work in the same way as QEMU’s default set up, but
    if you want bridged networking, select the vtap device and set the Source mode
    to Bridge. Graphics performance can be improved by using the virtio video (aka
    Virgl3d) driver, which enables the guest to use the 3D acceleration of the host.
    In order to make it work with virt-manager you’ll need to set the ‘Listen’ type
    to ‘None’ in the Display Spice section. Since we’re using the video card almost
    directly when we enable Virgl3d/virtio, the remote part of this doesn’t work.


    You can check if you’ve got it working by running dnsmgr|grep drm. You can also
    easily select virtio network and storage devices. Now you’re finally primed to
    boot your libvirt-powered VM. Hit the Begin Installation button at the top-left,
    and – fingers crossed – it all works. If not, try the QXL video driver instead
    (see below).


    If you find installing new Linux virtual machines too much effort, then good news
    – you can download ready-to-go VirtualBox and VMware images at https:// osboxes.org.
    It’s easy to convert the VirtualBox VDI images into something QEMU can use. Suppose
    we downloaded the Arch Linux CLI image (and unzipped it to the current directory),
    then QEMU provides the tools to the conversion:


    ```

    $ qemu-img convert -f vdi -O qcow 201905-cli-64bit.vdi archlinuxxcow2

    ```


    # Virtual Windows


    We haven’t covered virtualising Windows here, but it is absolutely possible. You
    can download an ISO of Windows 10, entirely legally, from Microsoft’s site at
    http://bit.ly/lxf261windows. Note that you’ll still need to buy a valid Windows
    key if you want to officially activate the installation once it’s all set up to
    your liking.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_74_0.png)


    Libvirt uses XML to define virtual machinery, and if you need fine-grained control
    you can edit it directly in virt-manager.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_74_1.png)


    The singelmost straightforward way to ensure that virtual Windows runs fast is
    to make sure the virtual drive is stored on an SSD, preferably a fast one. Next,
    if you’re using KVM, you’ll want to install the virtio drivers from http:// bit.ly/lxf261virtio.
    Scroll down to the direct downloads section and download the Stable (from RHEL)
    or Latest (from Fedora) ISO file.


    It’s easiest to do this on the host machine and then use the VM’s imaginary optical
    drive to access it. If you want to use the virtio SCSI driver (highly recommended),
    you’ll need to add this at install time –


    > Install the virtio drivers in Windows by inserting the ISO file and right-clicking
    the relevant `.INF` files.


    # JUST CAN''T BE BOTHERED?


    > “If you find installing new Linux virtual machines too much effort, then good
    news – you can download ready-to-go VirtualBox and VMware images.”


    the rest can be added later. You’ll want to give your VM lots of memory: running
    Windows 10 on less than 4GB is no fun at all. There’s no Virgl3D windows driver,
    but there is an alternative. The QXL video card is a partially paravirtualised
    video device which should offer better performance (and higher resolutions) than
    the standard VGA driver. You can use it in QEMU with `-vga qxl`. Or you’ll find
    it in the Video section of virt-manager. You’ll find a Windows driver for it on
    Red Hat’s ISO in the qxlxlod/ directory.


    For the absolute best video performance, though, you’ll want to look into PCIe
    passthrough. With this setup, we install a dedicated GPU just for the Windows
    VM, and have the kernel isolate it for use at boot. We covered this in our last
    virtualisation extravaganza back in LXF244. One of the greatest resources on this
    topic is the Arch Wiki page at http:// bit.ly/ lxf261passthrough. If you get this
    working, we’d love to hear from you and your benchmarks. Virtualising old versions
    of Windows is possible too, with the correct ISO, which is a reasonable way to
    hold on to your old apps – perhaps from your now-retired Windows 7 install – until
    you find suitable Linux alternatives. **GO**'
