  md: '# # Device support

    ## Installing the web servers on Ubuntu and Raspian.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_126_0.png)


    When running the installations and tests for the various web servers, both Ubuntu
    and Raspian were used since both tools are of great use to a typical web developer.
    In some circumstances, Ubuntu would be a simple install while the latest 2018
    version of Raspian had no packages. Luckily, we used our time to find five packages
    that did install rather quickly on our machines. In addition to installation issues
    from simple install commands, installing from source was erroneous in some cases,
    too. So, with that said, let''s take a closer look at what we found in terms of
    device support when we made our installations.


    With Apache, Nginx, lighttpd and Apache Tomcat, all products could be easily installed
    on Ubuntu and Raspian with the usual `apt-get install` command. For example, installing
    Apache is as easy as typing `apt install apache2`.


    Openlitespeed had documentation that claims it can be installed from a repo followed
    by the typical `apt-get install` command. However, on both Ubuntu and Raspian
    that method outright failed. That was a little annoying, but there are other options.
    After attempting to install Openlitespeed from the source on both devices, that
    failed too. The `J:configure` command could not run as the file was missing from
    the compressed file that was downloaded. Since they ordered their installation
    methods from left to right, we had already wasted time getting to our end means.
    Luckily, on attempt number three, Openlitespeed did install on Ubuntu with the
    one-line click method, but not on Raspian. Thus, for testing web servers, this
    product succeeded at making the


    bottom of the list in terms of device support in more ways than one.


    Besides from Apache and Tomcat, all servers use port 80 for opening web pages.
    By default, Tomcat uses port 8080. Thus, running Tomcat and using `localhost:8080`
    will open it. Unfortunately, if we are already using port 8080 for another service,
    such as Linux Motion, we need to configure it to use another port such 7000.


    The good thing about all of the servers is that they install rather quickly, thus,
    we can use them on our devices almost right away after we execute our commands.


    # **VERDICT**


    | APACHE | 10/10 | TOMCAT | 9/10 |

    | NGINX | 10/10 | OPENLITESPEED | 6/10 |

    | LIGHTTPD | 10/10 | |

    It''s Openlitespeed that slips here being a lesser-known server than the rest.


    # # Documentation and support

    ## The scoop with man pages and online help


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_126_1.png)


    From a basic installation, only Lighttpd and Apache had man page entries. Meanwhile,
    all five products tested had man pages online with the exception of Openlitespeed.
    Although man pages are a great of source of information, there is much better
    documentation online.


    After spending quite some time on each vendor''s website during the first time
    setup and running, Apache, Tomcat and Nginx seemed to have organised, easy-to-follow
    information that allowed for an easy installation, modifications and configurations.


    Openlitespeed had multiple options and it took an amount of trial and error on
    both Ubuntu and Raspian until it worked. Online it does look like a groomed commercial
    product with a slick GUI that integrated well with WordPress and other software,
    however it lacks the effort needed for a home web server and testing.


    Lighttpd was another lacking web documentation from the source. Luckily, it is
    easy to setup and use so we avoided a wild goose chase. Finally, and luckily,
    we have Google to find additional solutions. In fact, we spent most of our time
    getting the solutions we needed to configure and make everything work perfectly.


    With Nginx, Tomcat, Apache and Lighttpd, it seemed there was plenty of good forum
    questions and answers that could solve our problems. Openlitespeed, although it
    ranks quite highly for hosting usage on the web, it seemed to have the worst information
    and answers out there. It was almost as though our questions had no answers and
    there was very little involvement from home users with this server.


    # **VERDICT**


    | APACHE | 10/10 | TOMCAT | 9/10 |

    | NGINX | 10/10 | OPENLITESPEED | 5/10 |

    | LIGHTTPD | 7/10 | |

    Nginx and Apache dominate, and online help is leaps beyond the competition.'
  merge: -1
