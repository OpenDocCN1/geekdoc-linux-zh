  md: '# **T**he LucasArts adventure games have achieved legendary status.


    The LucasArts adventure games have achieved legendary status. Its first graphical
    effort, 1987’s *Maniac Mansion*, set a new standard for the genre. The game featured
    a bespoke scripting engine, imaginatively titled Script Creation Utility for Maniac
    Mansion (SCUMM), which provided high-level routines for common game primitives:
    characters, locations, dialogues and inventory. This not only made coders’ lives
    easier, since they could work with human-readable scripting commands rather than
    assembly, but also made the task of porting the games much easier, since this
    only required porting the engine to the new platform. The SCUMM scripts and game
    assets could more or less be used as is.


    SCUMM came about because many of LucasArts’ programmers were originally mainframe¹
    programmers, and found it much easier (and faster) to compile code on those machines
    before porting it to the native platform. By writing clean and portable code for
    SCUMM, coders Ron Gilbert and Chip Morningstar afforded themselves the luxury
    of being able to write in a flexible scripting language that could be rapidly
    compiled for multiple platforms: the G64, Amiga, Atari, PC and Mac. SCUMM also
    made possible all kinds of things never before seen in adventure games: point
    ‘n’ click gameplay, multiple characters and background tasks/animations. It was
    arguably the first game engine, in the sense that it decoupled game assets and
    gameplay. Amazingly, with only modest modernisations, SCUMM would go on to power
    a decade of adventure games. These included the *Monkey Island* series, *Loom*,
    *Day of the Tentacle*, *Full Throttle*, *The Dig* and more.


    Now, picture yourself back in the early 2000s, and suddenly you want to relieve
    those memories of playing *Monkey Island 2: LeChuck’s Revenge*, but without the
    wrist ache that came with swapping the 11 disks that housed the Amiga version.
    Well, that game had a DOS release so you could probably get it working in Windows
    XP, but no, even back then you were pretty militant about using Linux, so that
    won’t fly. DOSBox had just been released, but so had an ambitious piece of free
    software called *ScummVM*, which reimplemented SCUMM natively, not just for one
    game, but for a whole bunch of them. Even in its infancy, this amazing software
    caused a stir amongst Linux gamers (all three of them), since it provided another
    avenue for Windows (and Mac) titles to be played on Linux.


    *ScummVM* came about as a result of one Ludyg Striges’ desire to better understand
    adventure game engines, so that he could write his own. He started by reverse
    engineering *Monkey Island 2* and eventually came up with an interpreter capable
    of playing the game. This would be the first version of *ScummVM*. Meanwhile Vincent
    Hamm was independently tackling SCUMM from a different angle, by investigating
    the scant documentation available online and investigating the scripts inside
    *Maniac Mansion* and *Zak McKracken* and the *Alien Mindbenders*. The two combined
    their efforts and worked on *ScummVM*, somewhat haphazardly at first. However,
    instead of the project skyrocketed when it was featured on Slashdot, a


    # THE SMALL MATTER OF LEGALITIES


    Dabbling with emulation and the like can fairly rapidly lead to legally murky
    waters. In the US copyrights last for 75 years, so even ROM files of early arcade
    games are off-limits. Even if you own an original copy of the game on one platform,
    you’re not entitled to download another (getting data off Amiga formatted disks
    requires special hardware, for example, for use on an emulator. Just because a
    title is no longer available doesn’t entitle you to download it. However, old
    PC games are readily available for cheap on auction sites, fairs and stoop sales
    (which is like a yard sale if you live in Brooklyn). The century old “first-sale
    doctrine” covers this legally. For older titles you’ll need a USB floppy drive,
    and apparently computers now don’t come with optical drives either so you might
    need one of them, too. For the reinvented game engines under consideration in
    this feature, we’re only interested in getting the asset files from the original
    media. This circumvents any DRM issues we may run into if we were running the
    original binaries.


    OpenSC2K was a remake of the classic (and dromedary-ripped) *Sim City 2000*. Also,
    in July GitHub received a DMCAakedown notice that obligated it to take the OpenSC2K
    repository offline. That repo included assets from original game, and since *Sim
    City 2000* is still sold by EA for about $5 (though the company has offered it
    for free in the past) the project soon attracted the attention of EA’s legal team.


    # LUCASARTS DONE GOOD


    > “SCUMM was arguably the first game engine, in the sense that it decoupled game
    assets and gameplay”


    popular thing of its time called a website, and a slew of developers wanted to
    join the party.


    Initially, *ScummVM* was written in C and supported a handful of games: *Monkey
    Island 2* (how the project began), *Zak McKracken* and *The Alien Mindbenders*
    and *Indiana Jones* and the *Last Crusade*. The master source tree was stored
    on Strigeus’s machine and Hamm would contribute there. By 2002 the project had
    been rewritten in C++, which brought portability, and supported tens of SCUMM
    games, and even a non-SCUMM adventure: *Simon the Sorcerer*. This led to some
    naming controversy, but in the end the original name stuck.


    Today, *ScummVM* supports hundreds of games and tens of engines: Sierra’s AGI
    and SCI interpreters, Koktel’s *Goblins* (sic) series, and Revolution Software’s
    Amiga classic *Beneath a Steel Sky* (which is available for


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_144_0.png)


    Once you got the game’s files you’re exactly one click away from a quick Skirmish
    in Command and Conquer.


    1) www.gamasutra.com/view/feature/196009/the_scumm_diary_stories_behind_.php'
