    Most interestingly, many of them don''t have an explicit Xsac option. They''ll
    save as you go and reopen to the same state they were left. The AppCenter (sic)
    includes a section of curated programs (that adhere to elementary''s design philosophy
    and have been reviewed by the team) as well as everything you''d find in Ubuntu''s
    erstwhile Software Centre (now the Snap Store). Flatpaks are supported out of
    the box too via a custom tool, Side/alod. Unlike Apple''s walled-garden approach,
    elementary makes it possible for adventurous users to stray from the curated base
    camp and brave the open source jungle.


    Besides looking pretty and being a pleasure to use, elementary OS is conscious
    about privacy. Onboarding, which debuted in the 5.1 release, offers to turn on
    location services or automatically delete temporary files (and optionally Trashd
    them). This launches on first run for each user (the new user selection screen
    is also lovely, by the way) and also guides users to the documentation, Night
    Light settings and AppCenter. Many users will have long-abandoned email clients,
    opting instead for the web-based offerings from their provider. But elementary''s
    Mail program might just spur those users to make their inboxes local again.


    We''re looking forward to elementary OS 6.0, which will be based on Ubuntu 20.04,
    but the team snuck out a point release, 5.1.5, in June which brought yet more
    nice touches. Being asked for a password occasionally might not seem particularly
    onerous, but when you encounter the password prompt on a daily basis it gets tiring.
    Elementary aims to tackle this ''authentication fatigue'' through contextual authentication,
    or only asking for a password where it makes sense to do so. If your laptop (which
    typically only one person uses) asks for a password when you log in, then it shouldn''t
    really need to ask you again when you apply updates, or even install new software.
    Likewise, you shouldn''t be prompted for a password, for example if you just look
    at (but don''t touch) firewall settings. You can follow all the contextual authentication
    work on Github at https://github.com/orgs/elementary/projects/74.


    # Parental relations


    Desktop distros these days tend to all have a parent distribution. That might
    be something still going (Ubuntu, Debian) or something now defunct (such as Mandrake,
    where OpenMandriva and Mageia''s roots lie). Such distros may be forks (have evolved
    their own codebase), or they may retain compatibility with their parents. Ubuntu
    is technically a fork of Debian unstable, whereas Mint is an Ubuntu derivative.
    Either way it''s rare that something totally freestanding comes out. Which is
    why we must give credit to the Solus project.


    Solus started life as Ikky Doberzy''s Evolve OS back in 2013. The project''s package
    manager, eopkg, was a fork of PISI from Turkish distro Pardus Linux (see review
    LXF259). At the time (Evolve remained in alpha until 2015), most interest was
    centred around its unique Budge desktop, which used GNOME 3''s underpinings to
    create a stylish yet traditional experience. Due to a trademark conflict (with
    the then-UK secretary of state no less) Evolve was renamed Solus, and Solus 1.0
    was released at the end of 2015. By then Budge had acquired its characteristic
    Raven sidebar (nevermore dig deep to tweak audio or see appointments with Lenore)
    as well as a substantial following.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_14_0.png)


    By 2017 Doberzy announced that he would be working full-time on the project, and
    Solus had moved to a rolling release model. The team had developed their own tool,
    ferryQ, for rapidly deploying changes to their repositories. While not a strictly
    Solus project, work continued on its Linux Steam Integration tool (which forces
    Steam to use distro libraries rather than the antiquities found in its own runtimes).
    Solus''s driver management tool saw its first release and Ubuntu Budgie (the desktop
    has long been available outside of Solus) became an official Ubuntu flavour. Ikky
    left the project in 2018, leaving it the capable hands of his co-contributors,
    and the rest as they say, is history. Budge uses the semi-classical Bisku menu,
    designed in conjunction with Ubuntu MATE, and (like elementary''s Panther) all
    development is done in Vala.


    > We had trouble deciding which of Solus''s wonderful backgrounds to capture alongside
    the Raven sidebar, but cat pictures win every time.


    # SUPPORTING YOUR DISTRO


    Elementary OS is not free (as in beer). It uses a pay-what-you-want model and
    when you download the ISO you''re asked to make a contribution


    The current Solus release, 4.1, comes in four editions (Budgie, Gnome, MATE and
    Plasma) and packs a range of multimedia features. For gamers, tweaks to the default
    file limits have been raised so that ESync can be used for better performance
    in Wine (or Proton, via Steam).


    # Taking software solace


    Since Solus maintains its own repos, you won''t find as many packages as, say,
    Ubuntu''s traditional .deb repositories. However, Snap is installed out of the
    box, so you can now avail yourself of the many offerings in the Snapcraft store.
    Flatpak and the Flathub remote are only two lines away too.


    ```

    ```

    $ sudo eopkg install flatpak-tdg-desktop-portal-gtk

    $ flatpak remote-add --if-not-exists flathub

    ```

    ```


    Eventually these will be integrated in a new plugin-based Software Centre, and
    eopkg will be replaced by a next-generation package manager dubbed Sol. We look
    forward to the next Solus release, and indeed Budge 11.'
