  md: '# Web servers

    The Verdict


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_130_0.png)


    S

    ites that rank web servers by popularity seem to mirror very closely the verdict
    we''ve arrived to testing these web servers, for home and dev use. Like everything
    in life, every server has their own strengths and weaknesses, but all of them
    are more than sufficient for our basic purposes, which is to build a development
    server at home with the option to still use it as our primary web host if we so
    choose.


    If our primary objective is to be up and running with as little tweaking as possible.
    Apache is a top choice because it just works perfectly out of the box, after a
    few installation commands and without having to get under the hood—or no one ever
    got fired for choosing Apache!


    Nginx is right behind Apache for simplicity, as long as we make a simple change
    to the `.conf` file to enable PHP to run. The extra time needed over Apache to
    do this is really just a minute or two at most. Thus, making it basically a tie,
    especially so as Nginx also feels like a solid workhorse, and though absolute
    performance isn''t critical for us, it clearly outpaces the rest. In addition,
    if we take web server popularity into account, some sources claim that Apache
    and Nginx account for over 80 per cent of the server market. Thus, this makes
    both promising for both at-home testing and syncing web files to a remote server
    in any environment.


    OpenLiteSpeed looks like a good choice for the web and seems to have a real commercial
    edge to it, even if you ignore that it already has a decent amount of the existing
    web-hosting share. Nevertheless, it was too far off the grid from Apache and Nginx
    and had a number of time sinkholes to set up and manage, from a home user''s or
    developer''s perspective.


    Lighttpd is another tool that works well and runs along the same lines as Nginx
    and Apache. So, using it is a rather simpler experience in comparison to the other
    two “trailing” server options.


    Tomcat is another great tool and is recommended for those that are on the JSP
    side of things. Like Apache, Tomcat just feels like a tried-and-trusted way of
    getting a job done without bugs or poor documentation. The take-away from this
    *Roundup* is that all five web servers here are mature, reliable tools more than
    capable of meeting every need.


    ### 1st Nginx

    10/10

    Web: www.nginx.com Licence: BSD Version: 1.15.5

    The fastest option, easy to use with a solid community behind it.


    ### 2nd Apache

    9/10

    Web: https://httpd.apache.org Licence: GPL Version: 2.4.18

    Easiest for beginners, best support, but overall speed is its weakness.


    ### 3rd Tomcat

    8/10

    Web: http://tomcat.apache.org Licence: ASF Version: 8

    The go-to option for Java developers serving Java Servlets and JSPs.


    ### 4th Lighttpd

    8/10

    Web: https://www.lighttpd.net/ Licence: BSD Version: 1.4.35

    It is easy to use and delivers good speed.


    ### 5th OpenLiteSpeed

    6/10

    Web: https://openlitespeed.org/ Licence: GPL Version: 1.4.39

    Unorthodox file locations, not as user-friendly and lags at the back.


    # ALSO CONSIDER


    When choosing our list of servers, we wanted to compare the most popular web servers,
    as there are very good reasons they''re used: such as reliability over many years.


    However, there is a very long list of other web servers that can be used for testing
    web apps and deploying live websites such as Tengine, Cherokee, IdeaWeb Server,
    Cowboy and Monkey. Although we were hoping to find some gold in the smaller players,
    our search came up empty.


    Almost all of the others we tried were not worth the effort. In many cases, vendor
    websites looked abandoned and instructions failed. Often, the packages did not
    exist and files were missing when building from source. When a package did work,
    it would have taken too long to configure to be useful.


    We are happy to have run samples and tests on these alternative options, but there''s
    little reason for trying options outside of the core servers in this *Roundup*.'
  merge: -1
  img_proc: true
