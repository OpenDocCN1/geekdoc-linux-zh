- pgno: 160
  md: '# # Availability


    How to get a program working...


    Sometimes it requires extra efforts to obtain and install a program. You might
    have to visit its web site and find the correct download option. There are no
    such issues with **Gimp** because it’s included with every Linux distribution,
    but we’re working with a supercharged **Gimp** installation, packed with extra
    plugins. GREYC’s Magic for Image Computing might be available in your system’s
    package repositories, but if not you can grab it from https://gmic.eu, unpack
    the archive and put the executable file in `~/.config/GIMP/2.10/plug-ins`. The
    FX Foundry pack has its own page at www.gimpfx-foundry.sourceforge.net and similarly
    it should be unpacked into a neighbouring directory in `~/.config/GIMP/2.10/scripts`.
    Although there’s nothing difficult about this requirement, novice users may consider
    such extra actions to be an advanced task.


    **Rawtherapee** and **Darktable** already come with everything bundled inside
    the software packages. Those two programs are rarely included in distributions’
    default offerings out of the box, but they’re always available in online repositories
    – just check it with your software store or package manager. However, **Darktable**
    scores more in this test because it’s also available in Snapstore and Flathub,
    while **Rawtherapee** has only an AppImage.


    The way **Lightzone** is distributed is somewhat cumbersome. Due to the proprietary
    legacy, the official project web site still lists outdated information, which
    might confuse some users who want to get the application. However, **Lightzone**
    is based on Java, which means it should be a platform-agnostic application, and
    so it’s often packaged for many Linux distros. Ready-to-use packages exist for
    Ubuntu, Fedora and openSUSE and many others. For Ubuntu-compatible distros you
    can use the PPA at **ppa:lightzone-team/lightzone**.


    **Pixelluvo** costs money, $34 to be precise. The official web page offers 30-day
    trial downloads, with DEB and RPM packages for Ubuntu and Fedora, respectively.
    Those packages can be used for other RPM- and DEB-based distributions as well,
    or repacked for other flavours of Linux (treat **Pixelluvo** downloads like archives).
    **Pixelluvo** includes a static set of the old Qt4 libraries at `/opt/pixelluvo/libs64`,
    which you may want to delete in order to force the program to use your system’s
    libraries. We’ll admit that this is a non-trivial task for many users. Additionally,
    the trial version doesn’t enable saving modified images with sizes larger than
    800×600. We recommend making those tweaks!


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_160_0.png)


    # VERDICT


    | GIMP | 9/10 |

    | DARKTABLE | 10/10 |

    | RAWTHERAPEE | 9/10 |

    | LIGHTZONE | 8/10 |

    | PIXELLUVO | 7/10 |

    There are many easy methods of getting hold of and installing **Darktable**.


    # # Ease of use


    How user-friendly is each of our five contenders?


    Previously, **Gimp** was a mess of floating windows that required a lot of manual
    arrangement. Nowadays the program uses the single-window mode by default. Its
    photo-editing features are located in different places under Filters>Enhancing
    menu, Filters>G''MIC-Qt and a separate top-level menu for FX Foundry. Unless you
    know where your tools are beforehand, it isn’t easy to find them.


    **Darktable** has no such fragmentation. However, you first need to point the
    application to the directory with your images and then select one for editing.
    By default, the editing tools are hidden under the categories on the right side
    of the screen. **Rawtherapee** has a more thoughtful UI design. It’s similar to
    the one in **Darktable**, but you don’t lose the file manager tree on the left
    when editing an image. Furthermore, all the useful tools are already expanded
    in the right panel. Similar to **Darktable**, **Lightzone** suggests switching
    between browsing and editing modes. When editing, each filter or tool is presented
    like a separate floating panel, which you can turn off or on.


    Our remaining program, **Pixelluvo**, also shone in terms of usability. Photo-editing
    capabilities could be found under the Colour and Effect sections of the top menu
    bar. **Pixelluvo** was designed with simplicity in mind, and consequently it was
    nearly impossible to get lost in its clear and simple lists of available tools.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_160_1.png)


    # VERDICT


    | GIMP | 7/10 |

    | DARKTABLE | 8/10 |

    | RAWTHERAPEE | 10/10 |

    | LIGHTZONE | 10/10 |

    | PIXELLUVO | 10/10 |

    Having frequently used tools at hand is the key to winning our usability test.


    161'
