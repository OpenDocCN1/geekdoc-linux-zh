  md: '![](img/3f314b57ad3c8b08d25e5d1ab47de56d_58_0.png)


    After upgrading, check the security of your instance at scan.nextcloud.com. After
    this feature’s mammoth effort, we get an AI


    updates rarely go anything but smoothly. It’s easy to update Nextcloud from the
    web interface, it’ll even tell you what PHP commands to run to perform the more
    fragile parts of the upgrade. Running that a few times got us to Nextcloud 15.0.4,
    which is still supported but fairly long in the tooth.


    Unfortunately ours was a Debian Stretch install (we did say we’ve been running
    it for ages), which only supports PHP 7.0. Since version 16, Nextcloud has required
    PHP 7.1, so there’s an important lesson right there: just because your OS hasn’t
    gone EOL yet (Stretch is supported until 2021) software that’s running on it may
    have dependencies it can’t provide. In this case we could have used the backported
    PHP 7.2 packages from https://deb.sury.org, but Debian upgrades are usually straightforward
    and the journey to Debian 10 (Buster) proved painless. So long as you remove all
    foreign packages from the system beforehand, you should be fine too. The process
    is well-documented.


    Once you have an up-to-date Nextcloud there are a few headers the developers recommend
    setting on your webserver. On Apache, for example, the following should be added
    to your site’s configuration:


    **Header set X-Frame-Options sameorigin**

    **Header set X-Content-Type-Options nosniff**


    The first will stop a modern browser from loading the site in a frame, unless
    it originates from the same webserver. The second prevents MIME-type sniffing,
    and prevents external CSS and JavaScript resources from being used if they are
    not served with the correct text/html MIME type. Such requests are blocked, and
    the option will also prevent HTML, text, XML, and JavaScript resources from being
    loaded externally. For more information on securing your headers, check out the
    OWASP (Open Web Application Security Project) Foundation’s in-depth look at the
    subject at www.owasp.org/index.php/OWASP_Secure_Headers_Project#tab=Headers.


    the destination from your trusted server. IPRFire can set this up in a few clicks
    if this is something you’d like to do at home. You may also subscribe to a commercial
    VPN service, but despite all the wonderful sponsored articles you’ll find offering
    listings of the best VPN providers, there’s not really a good reason to trust
    these entities – even the ones with very shiny websites. You’re giving them carte
    blanche access to all your connection data, after all. If your goal is just to
    hide this data from your ISP, or get around any blocks they have in place, that’s
    fine, but consider why they’re blocking that material in the first place, and
    whether their circumvention of that block constitutes breaking the law.


    If you want to read more about server and software weakness in general, we’d encourage
    you to read *Seven Pernicious Kingdoms: A Taxonomy Of Software Security Errors*
    by Katherine Tsiapkou et al. This paper goes some way to deconstrual the fearsy
    developers and system maintainers today. So stay safe out there.


    # » TO OTP OR NOT TO OTP


    If you want to use YubiKeys in your own applications, and issue physical keys
    directly to trusted users, then check out the developers’ guide at https://developers.yubico.com/OTP.
    The YubiCloud service provides free authentication for YubiKeys (which come set
    up for OTP out of the box), but they also provide open source software so that
    you can host your own auth server, in the spirit of decentralisation. YubiKeys
    ship with their own unique AES key, which enables them to be verified by YibiCloud
    (which holds a copy of it). Locally, the symmetric key is locked away in the hardware,
    and while it’s invisible to software it can still be changed.


    This is fine if you’re doing your own authentication, but even though you can
    register the new key with YubiCloud, the same level of trust is not quite restored,
    since any new key is subject to being intercepted while it was generated. Because
    of this, some services won’t trust OTP responses from YubiKeys that have had their
    OTP. You should now be able to test your YOTP setup at https://demo.yubico.com/otp/verify.
    As the site mentions, using a hardware token as single-factor authentication mechanism
    is not smart, since if it is stolen then everything it has access to could be
    compromised.'
