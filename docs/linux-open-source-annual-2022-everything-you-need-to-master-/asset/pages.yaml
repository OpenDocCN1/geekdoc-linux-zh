  md: '# # Collaboration


    What are your options when you need to share the workload?


    A major factor for the popularity of online office suites is that they enable
    multiple users to collaborate and work on the same document simultaneously. While
    offline office suites are catching up, this is one domain that’s ruled by online
    office suites, such as Google Docs.


    Google Docs enables real-time, character-by-character collaboration on Google
    Docs, Google Sheets, Google Slides and Google Drawings tools. When multiple people
    are working on the same document at the same time, they’ll all be able to see
    the changes that have been made by each other. These collaboration options work
    in conjunction with the sharing options that makes it possible to set access levels
    for files, so that you can control who sees and edit your files. Again like with
    other features, you can use another Google service, Google Groups, to share the
    document with a group of people with a single click.


    LibreOffice Calc enables document sharing with simultaneous write access for many
    users. Assuming each user adds a name on the LibreOffice User Data page under
    Tools>Options, it’s quite easy to track the contributions made by the different
    users.


    A similar feature has still not been implemented by the Calligra Suite and there
    isn’t any mention of it being introduced in future releases. The project’s website
    doesn’t have a roadmap for future releases, so there’s no telling when, if ever,
    this feature might be introduced.


    With OnlyOffice, you get a visual cue informing you of the passages your collaborators
    are working on, and you can talk to them to discuss ideas. But this feature isn’t
    available on the offline editor, and you must use the cloud feature to access
    it.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_117_0.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_117_1.png)


    # ## VERDICT


    | CALLIGRA SUITE | N/A | ONLYOFFICE | N/A | GOOGLE DOCS | 10/10 | WPS OFFICE |
    N/A | LIBREOFFICE | 8/10 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |


    Collaboration is yet another feature that’s yet to be implemented on the Linux
    version of WPS Office.


    # # Presentation


    A good slide-show takes more than just a collection of bullet points.


    A s with word processor applications, Calligra’s presentation program Stage also
    takes some getting used to. The different formatting options, such as defining
    the animation and transitions are relegated to a separate docker, on the right
    of the screen. Adding shapes is similarly confined to the Add Shapes docker.


    Google Slides offers the choice of a number of templates to help you get started.
    You can add pictures, shapes and charts to the slides, and configure transition
    effects for each. It’s also possible to choose different colour schemes and themes
    to create dynamic slides. Also on offer are a large number of add-ons, that mean
    you can add even more content to a slide. For instance, you can insert free HD
    photos to your slides using the Unsplash add-on. The add-ons are split into different
    categories such as Education, Business Tools and Productivity.


    OnlyOffice enables you to choose from among various background designs. You can
    introduce shapes, charts, text art and pictures, and add transitions to the slides.
    A unique feature is the built-in photo editor. It can be used to manipulate the
    brightness, contrast and sharpness of any image inserted into a slide. You can
    also add a frame to the image, crop, resize, change the orientation and do many
    other edits. The photo editor is slower, in comparison to dedicated image-editing
    tools like Gimp. But it gets the job done, and the convenience of editing images
    from within the tool itself cannot be overstated. You can also insert a YouTube
    video into a slide by clicking the YouTube tab under Plugins and providing the
    URL of the video. However, the video doesn’t run when you start the slideshow
    and all you see is an image of the video, with no button or any option to start
    playback.


    WPS Presentation and LibreOffice offer all the functionality you expect from a
    presentation tool, such as adding animations, transitions, designs and so on.
    Both WPS Presentation and Calligra Stage enable you to choose the slide size (either
    standard screen 4:3 or wide screen 16:9).


    # ## VERDICT


    | CALLIGRA SUITE | 5/10 | ONLYOFFICE | 10/10 | GOOGLE DOCS | 9/10 | WPS OFFICE
    | 10/10 | LIBREOFFICE | 10/10 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |


    The biggest drawback of Calligra is its unconventional interface.'
