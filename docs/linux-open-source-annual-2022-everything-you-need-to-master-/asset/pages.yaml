  md: '# # Next-gen distro tech


    Shiny and easy-to-use distributions are one thing, but which distros ship the
    latest Linux tech? Keep reading to find out...


    Fedora is Red Hat''s community distro, where new technologies are honed before
    they make it into their business, meaning Red Hat Enterprise Linux (RHEL). Fedora
    was the first distribution to see systemd, Pulseaudio and SELinux (the NSA-contributed
    access control mechanism). Those titles might send shivers down the spines of
    some readers, but like them or not they''re here to stay. It''s historically been
    the best way to experience unadulterated Gnome 3 (strop shuttering youlob). That
    desktop offers the best Wayland experience, and Fedora was the first to offer
    Wayland by default (still with the shuttering?). So it''s nothing if not a trailblazer
    distro.


    The latest Fedora 32 even enables Firefox''s new Wayland backend. And if you''re
    feeling adventurous, follow the guide in our Web Browsers feature (page 42)


    encumbered multimedia codecs, these have to be added through a third-party repo
    such as RPMFusion or Negativo 17. The codecs issue is much less of a big deal
    nowadays. Popular streaming sites all use open formats (or at least, in the case
    of h.264, ones where an open source codec is available) and MP3 became a patent
    free format in 2017. A free AAC codec was made available shortly afterward, so
    you can play all your ripped CDs from yesteryear out of the box. Or you could
    rip them again in a lossless, free format such as FLAC.


    ## Make it easy on yourself


    Setting up a traditional third-party Fedora repo requires a certain amount of
    effort. More so than setting up a PPA for Ubuntu, which is perhaps why it used
    to be a bit harder to find certain niche software for Fedora. Bear in mind that
    PPA overload was definitely responsible for the demise of many an Ubuntu install,
    and third-party builds should always be treated with caution. Nowadays, a new
    technology Copr, takes all the hassle out of building unofficial Fedora packages.
    Fedora even offers a Copr build service that will provide you with your own Dnf/Yum
    repository. Just upload a source RPM file, select your build targets, and you''re
    done. Read more at https://developer.fedoraproject.org/deployment/copr/ about.html.
    And, of course, more and more developers are turning to Flatpaks and Snaps (although
    the latter is disabled in Fedora''s build of Gnome Software). So Fedora''s comparatively
    small, but carefully curated repos are no reason to shun it.


    Fedora made the news recently with the announcement that Lenovo will be shipping
    laptops powered by Fedora Workstation. Writing on his blog Christian Schaller,
    senior manager for desktop at Red Hat, says “Our engineering team here at Red
    Hat has also been hard at work ensuring we can support these models very well,
    be that by bugfixes to kernel drivers or by polishing up things like Linux fingerprint
    support.”


    We often have queues about Linux on laptops from readers, and without a particular
    model to hand it''s difficult to give solid advice on compatibility. Now, with
    laptop offerings from both Dell and Lenovo, we can direct users who want a rock-solid
    Linux offering out of the box there with confidence.


    Christian has been adamant about “draining the swamp” over the course of his past
    six years at Red Hat. He’s not talking about rogue politicians, either. Rather
    he''s addressing desktop issues that for too long have been hastily patched over,
    where ground-up rewrites were required. He original credits the phrase in this
    context to a talk by Jim Gettys. You’re thoughts you can read at https://mail.gnome.org/archives/foundation-list/2002-May/msg00005.html.
    The latest Fedora includes Gnome 3.36 (the same as Ubuntu 20.04) and


    # ## LINUX HITS THE MAINSTREAM


    With laptop offerings from both Dell and Lenovo, we can direct users who want
    a rock-solid Linux offering out of the box there with confidence


    to enable Webrener and VA-API acceleration (which you can in turn read more about
    on Martin Stransky''s blog at https://mastarsky.wordpress.com/2020/06/03/ firefox-on-fedora-finally-gets-va-api-on-wayland).
    Indeed VA-API acceleration, which appeared in Chromium, debuted in Fedora''s build
    over a year ago. So if Fedora receives new features, smoother browsers, why on
    earth aren’t you using it?


    Occasionally Fedora is sidestepped because of its philosophy on software freedom.
    If you want proprietary software (including the Nvidia driver), or patent-


    Third-party repos are only a click away in Fedora


