  md: 'Do more


    # # Protect your network


    Firewall your home with IPFire, a distro dedicated to keeping your network ports
    safe.


    **W**e covered firewalls last issue, so check that out if you want to learn the
    ins and outs of packet-filtering on Linux. Now we''re going to cover them again,
    but this time we''re going for a more practical approach with IPFire, a dedicated
    distro for firewalls or other network appliances. You don''t need any particularly
    special hardware to run a firewall, an old machine or a Raspberry Pi is fine (we''ve
    included ISOs for 32-bit x86 machines as well as USB/SD Card images for 64-bit
    PCs and ARMv5 and later devices), but note that at least two network adapters
    are required. Be that as it may, you can also run IPFire in a virtual machine
    (which you can add as many virtual Ethernet adapters to as you like). On reasonable
    hardware and small networks this will perform just fine, although if the host
    machine can be compromised then so can the virtual firewall, so we lose some security
    points doing things this way.

    If you want to use a VM for IPFire, you can use the 32-bit ISO from the *IPFire/*
    directory on the disc. If you really want to, grab the 64-bit ISO image from the
    website. For a small installation it''s unlikely to make any difference – memory
    requirements are low. For a larger or a more complex installation you probably
    won''t want to run a virtual IPFire appliance, although thanks to virtio networking
    and other bits of virtual voodoo (see our *Virtualisation* feature last issue:
    https:// linuxformat.com/archives/) this will work fine for simple setups. VPN
    traffic encryption/decryption requires a fair bit of CPU power, so if you''re
    planning on allowing of data-hungry access to your VPN, be aware of this. You''ll
    find instructions on how to set up a cloud instances of IPFire on AWS and Hetzner
    cloud on the IPFire website.


    +   * Once we set up our Ubuntu VM to use a static IP, we were able to connect
    to our IPFire VM.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_55_0.png)


    # ### Routing through IPFire


    You can route your entire home network through IPFire (by setting it as the default
    gateway on your home router and shifting settings) or you can avoid upsetting
    other users of your home network by just routing selected machines through IPFire.
    Installation (be it real or virtual) is simple, but note that the whole target
    drive will be erased – the installer provides no means to dual boot from a single
    drive. Once the system is installed, remove the installation media and reboot
    to perform initial system setup. Everything is pretty standard – localisation,
    users and what have you – the important part is the final network setup.

    You''ll need at least two network adapters, there is no way around this. If you''re
    running a VM you can add a second one with a few clicks and reboot to continue
    the setup. If you''re using a Raspberry Pi 3B or other device with both wired
    and wireless networking, that will work fine (subject to you setting up an access
    point with hostapd). For a two-adapter setup, we must assign one device the Green
    network and the other device the Red network. You can use up to four adapters
    with IPFire, and things get even more colourful if you do that. Use the first
    option if you need to set up more adapters, and use the second option to assign
    colours to network hardware. Typically the Green network will be your


    # ### IPADDONS


    IPFire has everything you need and more to run an advanced firewall solution.
    But its functionality can be extended far beyond what''s in the box. For one thing,
    it''s its own distro with its own package manager (Pakfire), which can be used
    directly or behind the scenes to install extra functionality. We''ll talk briefly
    later about the pros and cons of VPNs, but if you think you need one, you can
    set it up via OpenVPN with just a few clicks. Two configurations are offered –
    the appropriately apocalyptically-sounding Roadwarrior, and the more descriptive
    Net-to-Net. The former may equally have been called client-to-net, and is a Roadwarrior
    far outside safe network connectivity, to encrypt your communications back to
    your trusted server.

    Tor, often spoken of in the same sentence as VPNs, can also be set up easily on
    IPFire. You can set up your instance to access *onion* nodes and route only your
    traffic (or only certain parts of it) through Tor. Or, if you have the spare bandwidth
    you can set up a relay and benefit the whole Tor community. More conventionally,
    you can also add a wireless network (usually designated the **BLUE** interface)
    for your instance. We mentioned it was possible to do this on a Pi (which has
    only two network interfaces), but doing it as a third interface saves you having
    to set up Hostapd yourself.'
