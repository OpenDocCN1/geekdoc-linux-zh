- pgno: 13
  md: '# Distros


    # # The new generation


    Check out these wonderfully crafted distros that give the operating system from
    a certain fruit-named company a run for its money.


    u buntu-derivatives are a dime a dozen. Some you could probably recreate yourself
    by installing a desktop and changing some default applications. But some are simply
    outstanding, taking the rock solid Ubuntu base and adding unique and powerful
    features atop it.


    One such is elementary OS which, through its own Pantheon desktop, brings a sleekness
    and simplicity that rivals Mac OS. Instead of forcing users to read manuals (which
    in many cases just raises more questions), one of elementary''s aims is to have
    minimal documentation. It aims to be sufficiently intuitive that users should
    be able to figure things out for themselves. Another of its design aims is “concision”,
    keeping things simple and avoiding bloat. Finally, it strives for “accessible
    configuration”: not bombarding the user with options, or asking for information
    that could be obtained automatically. This all might sound like fluffy design
    speak, but when you see how the app indicators convey with subtlety useful information,
    how the infobars gently notify you of exigent situations and how everything integrates
    so nicely (like a new-age type writer on about how ''it''s all one, brath''),
    then you’ll see there’s substance to it all.


    # Contributing to elementary OS


    Elementary OS is not free as in beer (beer’s free now?–Ed). It uses a pay-what-you-want
    model and when you download it you''re asked to make a contribution. Ubuntu and
    some others use this model too, and nothing bad happens if you select $0. There’s
    nothing inherently wrong with charging money for software — even free (as in speech)
    software. It''s even expressly permitted by the GPL. Elementary, in asking for
    donations rather than slapping on a price tag, is striking a balance. It''s ensuring
    that people get reimbursed for their work, while at the same time making it available
    to all. If you disagree with that stance then you''re under no obligation to use
    it. If you want to contribute in another way, you can help fix bugs or help users
    on the forum (as you can for any software). There’s even a bug bounty program,
    so if you’re willing to pay for a feature (or would like to get paid for fixing
    something), then subject to team approval and someone coding it, you can.


    Fiscal models aside, elementary OS is beautiful. The Pankin dock gives easy access
    to commonly used applications, and the bundled ones all follow a uniform design.
    They’re all coded in Vala, which makes them integrate easily with GTK (or elementary''s
    custom superset of it, dubbed Granite). They’re free of


    # BEHOLD, THE GORGEOUS POP!_OS


    It would be remiss of us not to mention, in a spread about beautiful distros,
    Pop!_OS. We were thoroughly impressed by the 20.04 release back in April (see
    our glowing review in LXF284). Pop (we like most everything about it, bar the
    awkward punctuation) is made by Colorado-based Linux system manufacturer System76.
    Being an OEM, they wanted to be able to ship an OS guaranteed to work with their
    hardware. But also, just like the other distros named in these pages, an OS that
    makes it easy for users to do whatever they want to do. Pop’s desktop is much
    closer to Gnome 3 than what Mint, elementary and Solus offer, but don’t be afraid.
    Don’t also be afraid that the latest release gives you the option to experience
    (in a very gentle way) the joys of a tiling window manager.


    Pop!_OS ships two editions: one featuring the Nvidia proprietary graphics driver
    and one featuring open source drivers (for AMD and Intel hardware). You’ll find
    the latter on your virtual DVD, or you could save yourself some bytes and download
    it directly. System76 have contributed an awful lot to Linux, including a Firmware
    Manager front-end for updating firmware via fwupd. In Pop, this is integrated
    into the update tab in the Gnome Settings application. Naturally, this works with
    not just System76 hardware, but anything supported by fwupd (which is a lot of
    hardware). Pop also has a bunch of tweaks for common gripes like multiple displays,
    and hybrid graphics.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_13_0.png)


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_13_1.png)'
