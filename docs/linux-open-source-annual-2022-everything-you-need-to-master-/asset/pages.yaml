    \ it easier than any other program out there. If you're new to the concept of\
    \ multi-track recording, it allows you to record sounds one at a time in layers,\
    \ slowly building up a soundscape.\n\nFor instance, the most common usage is in\
    \ music where you may record each musician in isolation, rather than recording\
    \ the band as a whole. You may lay down a drum track first, and with that first\
    \ drum track in their headphones, the bassist can record their track in a new\
    \ second layer. Then the guitarist could hear the drums and bass playing through\
    \ their headphones and record their guitar in a third layer. With the instruments\
    \ finished, the singer can record their vocals.\n\nIf you're a seasoned Audacity\
    \ user, you need to know that things have changed. When you hit the Record button,\
    \ Audacity used to create a new track automatically and start recording in that.\
    \ Now when you click Record, Audacity will start recording on the end of the current\
    \ track, and just keep on adding to it.\n\nIf you would rather record into a new\
    \ track, use the keyboard instead of the mouse. Pressing R records onto the end\
    \ of the current track, but Shift+R records into a new track. If you're determined\
    \ to have things the way they used to be, you can change it by choosing Edit >\
    \ Preferences from the main menu. Open the Recording section and in the Options\
    \ field, click 'Always record on a new track'.\n\nNote that Audacity now has latency\
    \ correction built-in, but some audio device settings may result in an error regarding\
    \ latency timing. If this is the case, you can also tweak your latency correction\
    \ settings in the Preferences window. In the Devices section, you can tweak the\
    \ buffer length and 'Track shift after record' settings in the Latency field.\n\
    \n# RECORDING WITH JACK\n\nRunning Audacity with JACK rather defeats the purpose\
    \ of its simple interface, but maybe there's some kind of effect chain you want\
