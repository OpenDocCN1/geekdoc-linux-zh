- pgno: 78
  md: 'To understand what’s possible today, it’s helpful to look at how technology
    projects have been traditionally implemented. Back in the olden days – that is,
    more than 10 years ago – businesses would buy or lease hardware to run all the
    components of their applications. Even relatively simple applications, such as
    a WordPress website, have multiple components. In the case of WordPress, a MySQL
    database is needed along with a web server, such as Apache, and a way of handling
    PHP code. So, they’d build a server, set up Apache, PHP and MySQL, install WordPress
    and off they’d go.


    By and large, that worked. It worked well enough that there are still a huge number
    of servers configured in exactly that way today. But it wasn’t perfect, and two
    of the bigger problems were resilience and scalability.


    Lack of resilience meant that any significant issue on the server would result
    in a loss of service. Clearly a catastrophic failure would mean no website, but
    there was also no room to carry out scheduled maintenance without impacting the
    website. Even installing and activating a routine security update for Apache would
    necessitate a few seconds’ outage for the website.


    The resilience problem was largely solved by building ‘high availability’ clusters.
    The principle was to have two servers running the website, configured such that
    the failure of either one didn’t result in the website being down. The service
    being provided was resilient even if the individual servers were not.


    # The Slashdot effect


    The scalability problem is a bit trickier. Let’s say your WordPress site gets
    1,000 visitors a month. One day, your business is mentioned on Radio 4 or breakfast
    TV. Suddenly, you get more than a month’s worth of visitors in 20 minutes. We’ve
    all heard stories of websites ‘crashing’, and that’s typically why: a lack of
    scalability.


    The two servers that helped with resilience could manage a higher workload than
    one server alone could, but that’s still limited. You’d be paying for two servers
    100 per cent of the time and most of the time both were working perfectly. It’s
    likely that one alone could run your site. Then John Humphrys mentions your business
    on Today and you’d need 10 servers to handle the load – but only for a few hours.


    The better solution to both the resilience and scalability problem was cloud computing.
    Set up a server instance or two – the little servers that run your applications
    – on Amazon Web Services (AWS) or Google Cloud, and if one of the instances failed
    for some reason, it would automatically be restarted. Set up auto-scaling correctly
    and when Mr Humphrys causes the workload on your web server instances to rapidly
    rise, additional server instances are automatically started to share the workload.
    Later, as interest dies down, those additional instances are stopped, and you
    only pay for what you use. Perfect... or is it?


    Whilst the cloud solution is much more flexible than the traditional standalone
    server, there are still issues. Updating all the running cloud instances isn’t
    straightforward. Developing for the cloud has challenges too: the laptop your
    developers are using may be similar to the cloud instance, but it’s not the same.
    If you commit to AWS, migrating to Google Cloud is a complex undertaking. And
    suppose, for whatever reason, you simply don’t want to hand over your computing
    to Amazon, Google or Microsoft?


    Containers have emerged as a means to wrap applications with all of their dependencies
    into a single package that can be run anywhere. Containers, such as Docker, can
    run on your developers’ laptops in the same way as they run on your cloud instances,
    but managing a fleet of containers becomes increasingly challenging as the number
    of containers grows.


    The answer is container orchestration. This is a significant shift in focus. Before,
    we made sure we had enough servers, be they physical or virtual, to ensure we
    could service the workload. Using the cloud providers’ auto-scaling helped, but
    we were still dealing with instances. We had to configure load balancers, firewalls.


    # ABSTRACT CLOUDS


    Part of the power of Kubernetes is the abstraction it offers. From a developer’s
    perspective, they develop the application to run in a Docker container. Docker
    doesn’t care whether it’s running on Windows, Linux or some other operating system.
    That same Docker container can be taken from the developer’s MacBook and run under
    Kubernetes without any modification.


    The Kubernetes installation itself can be a single machine. Of course, a lot of
    the benefits of Kubernetes won’t be available: there will be no auto-scaling;
    there’s an obvious single point of failure, and so on. As a proof of concept in
    a test environment, though, it works. Once you’re ready for production, you can
    run in-house or on a Cloud provider such as AWS or Google Cloud. The Cloud providers
    have some built-in services that assist in running Kubernetes, but none of are
    hard requirements. If you want to move between Google, Amazon and your own infrastructure,
    you set up Kubernetes and move across. None of your applications have to change
    in any way.


    And where is Linux? Kubernetes runs on Linux, but the operating system is invisible
    to the applications. This is a significant step in the maturity and usability
    of IT infrastructures.


    Continuous integration and deployment can work well with Kubernetes. Here’s an
    overview of Jenkins being used to build and deploy a Java application.


    ![](img/3f314b57ad3c8b08d25e5d1ab47de56d_78_0.png)'
