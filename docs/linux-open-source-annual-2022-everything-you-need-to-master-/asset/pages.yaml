    \ isn't included in the distro by default, too limited at the moment and too hard\
    \ to use.\n\n# » ALSO CONSIDER\n\nAs we mentioned earlier, many of the rescue\
    \ distros that we've featured in past issues are no longer maintained. While they\
    \ might not support the latest hardware, nor have the latest version of the bundled\
    \ utilities, you can still use them to repair older machines, however. For example\
    \ there's *Rescatux* (Tux with fingers *should not be!* — Ed) that has an interesting\
