    Figure 3.3 Multinetting LAN Router


    One such use is multi-netting. The term refers to running multiple logical IP
    subnets on a single segment. Useful examples of this capability include preparing
    for executing piecewise migrations to other IP address space (as opposed to having
    to work all weekend for a flash-cut), and planning for future growth by using
    more IP address space than you currently need to support your clients.


    First take the IP address space migration... If you need to migrate to a different-space,
    you can create additional “virtual” interfaces (really aliases) on top of your
    existing interface(s) and convert your users to their new IP addresses and gateways
    over. Another scenario: if you are network growth at some point in the future,
    you might want to assign IP ranges to different departments or physical areas
    in your building. There are currently only 10-15 people in each department, it
    would be overkill to have a separate interface for each department. However, if
    you expect growth to 80-100+ devices in this area, you would be wise to go ahead
    and assign a class C subnet space to this department (254 IP addresses) so that
    you will not have to go back and reassign later when you decide to change that
    department its segment and interface. Finally, if you have no free slots for additional
    interfaces in your router, but need to add an IP subnet, you can use IP aliasing
    as a stopgap measure.


    In this section, we will use the second case as our example, and add an IP subnet
    to the 192.168.18.0 segment. Once again, let us begin with a short description
    of the work to be completed and a sketch of how the network will look after the
    configuration change (Figure 3.3).


    Create a new subnet, 192.168.20.0/24 which will share physical Ethernet segment
    B with 192.168.18.0/24. The 192.168.20.0/24 subnet, subnet_c, should have full
    access to the other subnets.


    Now we know what we need: to accomplish this, we must first enable IP aliases
    in the kernel. Note that the kernel configuration options listed build upon the
    configuration we used for silicon’s first kernel. (In other words, you need all
    of the options from the previous configuration ''+'' the option below).'
