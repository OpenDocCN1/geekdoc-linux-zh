  md: 'You can delete IP aliased interfaces the same way that you would for a real
    interface. In this case, if ifconfig eth1:0 down. Appropriately, this also removes
    the network route corresponding to the virtual interface. With any actions you
    take which modify the running kernel, you need to incorporate them into your startup
    script in order for them to be consistently executed until startup. Because IP
    aliasing is an extension of the physical interface configuration, you can place
    the commands in /etc/init.d/network alongside the rest of your network configuration.


    IP aliasing is quite a useful tool to have at your disposal. Should a group of
    contractors sign up onsite and require immediate access to the network, you can
    add a virtual interface, with its own firewalling and accounting rules, in a matter
    of minutes. The next section covers accounting, another neat feature of the Linux
    TCP/IP stack used to collect statistics about the traffic through the router.


    # 3.3 IP ACCOUNTING


    IP accounting is a facility available in the Linux kernel which will accumulate
    the number and sizes of network packets that match a given set of criteria. By
    specifying particular combinations of pattern-matching criteria, also known as
    rules, you can collect all statistics about the packets flowing through your router.
    Examples include what percentage of the network traffic crossing the router consists
    of people using HTTP browsers, or what percentage is inbound FTP, NFS traffic
    between routers. The only trick is learning how to configure the rules, which
    are also changed because they are set up in the same manner as packet-filtering
    rules. In fact, IP accounting is just a piece of the IP firewalling, IP forwarding,
    and IP masquerading facilities in the kernel. The same kernel code is used to
    determine if a packet matches the specified criteria—in the case of accounting,
    a counter is incremented; for firewalling, forwarding, and masquerading, more
    sophisticated actions are taken.


    The underlying kernel code which supports IP accounting changed between versions
    2.0.x and 2.2.x of the kernel. The 2.2.x facility is known as ipfw_chains or simply
    ipchains, and uses the command ipchains to configure the rules. For a good understanding
    of the interaction between rules and packets, you should review the copies of
    the manpages for these facilities and commands.


    HINT: NICE PRINTOUTS OF MANPAGES


    ```

    An easy way to generate nice-looking printouts of manpages is to use man -t manpage
    >/tmp/manpage.ps. This will produce a PostScript file which will be formatted
    when printed. If you do not have a PostScript capable printer, use the magicfilter
    package to configure your printer to automatically invoke ghostscript before spoiling
    the file for printing.

    ```


    There is an implementation of ipchains for the 2.0.x kernel. It is distributed
    as a set of patches. Visit the IPCHAINS homepage if you need this functionality.'
