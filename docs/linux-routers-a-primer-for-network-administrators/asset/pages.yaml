  md: '# C.4 Using VMware to Test Configurations


    # Caveats


    +   - Because the emulation provides for a single Ethernet adapter, you cannot
    test different Ethernet drivers. I cannot see why VMware would want to test this,
    and I do not know how applicable such a test would be, so I do not expect this
    to change.


    +   - Similar to the preceding issue, you cannot test any add-on beyond determining
    whether or not the driver patch for the kernel (if one is needed) will compile.
    External demons and ISDN adapters are a different story, as is addressed below
    under Capabilities.


    +   - Because it is emulation and because you are sharing a single set of resources,
    things can get a little slow, especially if you do not have a lot of memory in
    your host system.


    # Capabilities


    +   - You can load a virtual machine with exactly the same configuration as your
    production router image and this machine for compiles. This way, you no longer
    need to compile on your production machines, but you also do not have to have
    a separate test/compile for every router image.


    +   - You can make copies of the virtual machine before testing upgrades, so there
    is no need to reload/restore the machine to fall back to a previous version of
    the image.


    +   - You can use items attached to the host machine as they exist on the virtual
    machine. Currently, this list includes the floppy drive, an IDE cdom drive, a
    PS-2 mouse port, parallel ports, OS compatible sound card, and anything connected
