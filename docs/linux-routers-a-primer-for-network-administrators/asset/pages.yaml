    ```


    MODEM STATUS


    DCD IS HIGH

    CTS IS HIGH


    Bad output lists either the signals as LOW. If you get an error from fpipemon
    checking the IP address and the port, then either you are not specifying the correct
    IP address or interface, or WANPIPE is not running.


    +   - fpipemon thinks that the circuit is down, is there any problem indicated
    on the CSU/DSU or on the circuit''s demarc? If there is contact, your Frame Relay
    provider. You will need to have your circuit ID when you call, which is why I
    put this information directly into wanpipe.conf.

    - If the circuit looks fine at your end, maybe the problem is not the access.
    You should be able to use fpipemon in trace mode to see traffic between the node
    and the switch at the POP. At a minimum, you should see the status messages (keep
    alive), full status entries, and possibly data packets being traded.


    fpipemon Tracing Status Messages, FSEs and Data Payloads


    ```

    zinc:/root> fpipemon -i wan0 -u 9000 -c ti

    Starting... (Press ENTER to exit)

    OUTGOING 16 19821 Link Verification Request Sx 7C Rx 06

    INCOMING 16 19823 Link Verification Reply Sx 07 Rx 7C

    OUTGOING 16 7727 Full Status Request Sx ID 1B |

    INCOMING 21 7730 Full Status Reply Sx 1C Rx 1B \\ DLCI 600 PRS 600ACT

    INCOMING 293 49726 Data Frame on DLCI 600

