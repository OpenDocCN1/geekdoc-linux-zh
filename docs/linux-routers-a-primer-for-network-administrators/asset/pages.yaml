  md: '# Management vs. Linux


    Let''s use an analogy. The use of a company''s postage machine for business mail
    is an example of proper use of a company resource. On the other hand, using the
    postage machine to mail parcels to your friends in Germany is not the intent.
    Does it matter what is in the parcels? to employee 2112, but not to the company.
    The policy for the postage machine of business-use-only was not violated, and
    that is the act which should be punished. Employee 2112 does not need to suffer
    the further disgrace of having the contents (parcels) of the wrong-doing made
    public. The same should hold for potential network transgressions. Instead of
    snooping on employee 2112 until this person “digs his own grave,” let management
    confront the employee so that he may a) defend his actions, and b) know that of
    the system can be monitored.

    I am not naïve as to believe that every reader of this book has completely honorable
    intentions with regards to the information available by snooping. Some of you
    may have plans to generate J. Edgar Hoover files on colleagues or political enemies,
    since you never know when such evidence might come in hand. Others of you might
    be jealous of the promotion of a colleague and feel that you were overlooked.
    And some of you might just want to increase your popularity by being a source
    of interesting information and gossip. Regardless of your motive, these activities
    are a misuse of yours. No one will be able to stop you; there is none to remind
    you of it. And this paragraph may not make much of a difference either, but it''s
    still wrong.


    # D.2 MANAGEMENT VS. LINUX


