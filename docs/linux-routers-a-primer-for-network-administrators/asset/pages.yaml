  md: '# RUNNING indicates that the driver for the interface is running.


    MULTICAST indicates that the interface is capable of multicast. You can set[clear]
    (for some devices) with this ifconfig eth0 [-multicast.


    PROMISC indicates that the interface is listening to all traffic on the network
    visible to it. This effectively turns the interface into a network sniffer. tcpdump,
    ethereal, and other programs use this mode to have a look at all the packets flowing
    past the interface. (See Section 4.5) You can set[clear] by issuing this ifconfig
    eth0 [-promise] command.


    ALLMULTI indicates that the all-multicast mode has been set, and that all multicast
    packets on the network will be received by the interface. This is similar to promiscuous
    mode, but for multicast.


    Lines 4, 5, and 6 are mostly statistics for the interface. Zero values in these
    fields (except RX packets and TX packets) are Good Things. The last field, txqueue-len,
    is the number of packets allowed to buffer in the send queue before the sending
    process blocks. This value can be tuned down for low-speed links to help interactive
    performance.


    Line 7 contains information from the driver about the IRQ and base address of
    the hardware. (Some drivers support changing these values with ifconfig, I recommend
    using driver module parameters).


    # 3.1.6 Adding Routes–the route Command


    The next step is to add what is known as a network route for the interface. Think
    of this as telling the Linux kernel about the IP subnet connected directly to
    the interface. But because this is so commonly, and because all of the necessary
    information is available when you ifconfig the interface, Linux kernel takes care
    of this itself. You can verify this by checking the contents of the routing table
    before and after configuring your interfaces. Do this with either route -n or
    netstat -rn—the command results are almost identical.


    ```

    ### before any interfaces are configured

    silicon://root> route -n

