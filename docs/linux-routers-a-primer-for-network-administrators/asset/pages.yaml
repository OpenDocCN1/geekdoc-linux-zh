    network via a second Ethernet interface. It is applicable only to routers. The
    next method of firewalling is IP packet-filtering, where we limit what can enter
    or exit the system. This form of firewalling is appropriate for any Linux system.
    In practice, both types of firewalling are used together to achieve the desired
    goal. The final section introduced some concepts about notification systems and
    what is available for Linux. Depending upon the organization, the importance of
    an Internet link ranges from a convenience to the lifeline of the company (say,
    for e-commerce). Having a stable system is crucial—being able to detect a problem
    and notify the necessary personnel is important, too. This final section gives
    some ideas about how to detect an outage and send notification.


    Before we move on to the next chapter, which discusses a flexible WAN router,
    I would like to reiterate the importance of physical security as it relates to
    your routers and any system(s) you choose to manage. If you lock down your routers
    tight and never allow a password to traverse the network in cleartext, you''ve
    made a good start. But if the management station (the computer where you''re typing
    that encrypted password) is not physically secure, you might not be helping yourself.
    All it takes a floppy and a few minutes to break into a desktop, and the attacker
    can use a tool such as ttynoop to quickly ferret your password as you type it
    into the keyboard. Therefore, you should treat your workstations to the same (or
    higher) level when it comes to security matters, especially if it is not physically
    secure.'
