  md: '# Routing Building Blocks


    hour, you''ve affected only a single user, or at most a single group of users.
    The outage with a router will affect all users and will not go unnoticed. Maintenance
    windows are also smaller, since any nightly batch job or system backup that relies
    on the network depends on the router. Should a component in a router fail, chances
    are likely that you will be under considerable stress to return it to service
    as quickly as possible. Therefore, consider the following when selecting your
    hardware:


    # ## 1.1.1 Case


    The case should be easy to open and have a consistent type and size of screw-head.
    The main components—hard drive, add-on cards, power-supply, and RAM—should be
    easy to reach without having to remove other components such as motherboard, etc.
    Typically, big-name manufacturers do a better job of this than the low-cost offerings,
    but not always. Also, different product offerings from the same manufacturer can
    vary greatly. The only way to know if the case is suitable for you is to take
    a system apart. In environments where you will have multiple production systems,
    use the same case/vendor for all systems, if possible. The more alike the cases
    are in size and configuration, the easier it will be to find a way to stack or
    shel them. Rack-mounted systems can make for tidy installations, but can be expensive
    and difficult to service while still mounted in the rack.


    # ## 1.1.2 Power-Supply and Fans


    The power-supply should be adequately sized (in watts) for all of the components
    in your system. If it is difficult to replace, realize that you might be migrating
    the hard drive and add-on cards to another system if it fails. The fans should
    provide adequate airflow in harsh environmental conditions (typically, extreme
    heat) outside of the system. Remember that a good fan is worthless if you place
    the entire unit such that air cannot enter and exit the case.


    # ## 1.1.3 Motherboard


    The choice of main system board for your router is probably less important than
    other components. For one, compatibility is typically not an issue with Linux,
    although I would steer clear of the more exotic motherboards and bus architectures.
    Secondly, a router is less likely to use some of the fancier motherboard features,
    such as IGP bandwidth and USB support, which may be differentiating factors for
    non-router systems. If you are worried about a motherboard''s compatibility with
    Linux, a good starting point is http://www.linux.org/help/beginner/platforms.html.


    # ## 1.1.4 BIOS


    Linux does not do with BIOS after the machine bootstraps itself and loading the
    operating system. The BIOS must be able to recognize your hard drives and assign
    base addresses and IRQs to your PCI devices. Beyond that, a BIOS that


