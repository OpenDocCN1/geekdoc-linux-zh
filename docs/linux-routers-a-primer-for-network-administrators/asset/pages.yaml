    # 4.2 IP MASQUERADING CONCEPTS


    IP masquerading is a facility in the Linux kernel which can manipulate packets
    that they appear to originate from addresses other than the original source. Before
    you think this is some hacker could, the masquerading is performed only during
    the forwarding of a packet. (It would make no sense if the router itself originates
    the packet or if the router were the destination of the packet.) The kernel performs
    some acrobatics to make the process transparent to both the sender and the receiver.
    It does a good job in all but a few rare cases.


    Before we talk about configuring IP masquerading, let''s start with an example
    of why we might need it, and what happens to a packet when it is masqueraded.
    The primary function of masquerading is to obscure the IP address of a client
    from a server located on a separate network. The reasons for doing this. The most
    common one is that the client has an address such that the server either would
    or could not respond to a connection request originating from that client. This
    situation is depicted in Figure 4.2, where the client can contact the server,
    but the server response will never reach the client.'
