    # **Parameters Related to the Subnet Mask**


    Given an IP address and its associated subnet mask, we can determine anything
    we need about the properties of the IP subnet. In addition to the network address,
    which we calculated in the first example, the following parameters can be calculated:


    +   **host address** — This is the portion of the IP address that does not correspond
    to the network address. If you were to invert the subnet mask (exchange “0”s with
    “1”s—and vice versa—this is known as the 1’s complement), and calculate the bitwise-AND
    of this with the IP address, the result would be the host portion. There is no
    point in calculating this parameter, because people never use it.

    **broadcast address** — The broadcast address is a reserved address in each IP
    subnet which can be used to speak to all of the IP hosts via a single packet (called
    a broadcast). For a given subnet, it is the network address together with the
    bits in the host portion of the address all set to “1”. Put another way, it is
    the highest (or last) host address in the subnet. It is easiest calculated by
    performing a bitwise-OR of the IP address and the 1’s complement of the subnet
    mask.

