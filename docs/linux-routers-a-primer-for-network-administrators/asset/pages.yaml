  md: '# Erbium—An Extranet Router


    Erbium is an example of an extranet router, which is used to connect your network
    to other networks of other organizations (not including the Internet). It was
    configured in response to the need for a dial-out point for a product support
    group at my employer''s so that they could access client networks to validate
    and resolve problems. Although the support staff had access to a modem server
    from their desktops, which provided them PPP and terminal dial-out capabilities,
    this arrangement had certain limitations:


    +   1. Access into a client site was limited to a single person/machine, making
    collaborative-efforts difficult.

    2. Direct access from the Unix development servers was not possible without undertaking
    extensive configuration efforts and opening questionable holes.

    3. All users who required access to the remote system had to set up the access
    themselves, an inefficient use of time which further resulted in more time spent
    assisting with configuration (repairing broken configurations).

    4. Controlling the use of the dial-out connections via a modem-server solution
    in use was difficult. Users could dial anywhere, potentially creating security
    holes or accumulating excessive charges.


    In summary, the environment was not conducive to productive trouble-shooting for
    the support staff. They spent more time making their tools work than using them
    to help clients. We needed a method of dialing into the client sites and reconfiguring
    the network so that access from all of the support group''s workstations and the
    Unix servers over that single dial-up link was possible.'
  merge: -1
  pgno: 108
