  md: '# 138 Zinc-A Frame Relay Router Chap. 5


    optionally include a comment which will appear in your system logs during startup
    and shutdown. For a system running Frame Relay, the [devices] section looks like:


    ```

    # start the [devices] section

    [devices]

    wanpipel = WAN_FR, myframecircuit - cktid MCI ZAW82836001, DLCI 100

    # end [devices]

    ```


    wanpip1.conf—[interfaces] An interface refers to the entity used by the kernel
    to communicate with the link. This can be a source of confusion, as many people
    commonly refer to these as devices. Just remember that an interface is an entity
    similar to eth—it can support routes, have different subnet masks, etc.


    A single Frame Relay device (or port) may have multiple PVCs configured in the
    provider''s network. On your router, each of these PVCs is an interface in wanpipel.conf.
    These behave like PPP interfaces, except that you add the remote endpoint by specifying
    the corresponding DLCI in the configuration file. (They are addressed by IP with
    respect to the rest of the operating system.) For a location with two PVCs, the
    [interfaces] section looks like this:


    ```

    # wanpipel.conf for location A

    #

    # start the [interfaces] section

    [interfaces]

    #intf = device, DLCI, WANPIPE, comment

    #--------------------------------------

    wan0 = wanpipel, 200, WANPIPE, location A <-- location B PVC

    wan1 = wanpipel, 300, WANPIPE, location A <-- location C PVC

    # end [interfaces]

    ```


    In the above file, frames addressed to DLCI 200 will be routed by the Frame Relay
    switch to location B, while frames addressed to DLCI 300 will go to location C.
    When the link is up and WANPIPE is running, you add routes to location B via interface
    wan0, and routes to location C via interface wan1.


