  md: 'Instead of just counting packets, as with IP accounting, or modifying packet
    source headers with IP masquerading, you now decide the fate of a packet by allowing
    it to pass, throwing it away, replying to the sender that the packet is not allowed
    to pass, or redirecting the packet to a port on the local system.


    One note: Unlike IP accounting, the order in which the firewall rules are encountered
    is significant. If the first rule blocks all packets, there is no point in even
    having the following rules. Similarly, if there is a rule which allows all packets
    before any of the reject or deny rules, why bother with packet-filtering at all?


    # 6.3.1 Conditional IP Forwarding for Firewalls


    Conditional IP forwarding is a fancy term for configuring a router to the forwarding
    of certain packets, or vice-versa, to allow only packets to be forwarded. It operates
    like IP masquerading, evaluating packets which are to be forwarded, if they meet
    the criteria specified in the rule(s). When a match occurs, the policy (or target)
    of the rule is invoked. We cannot predict the final fate of the packet at this
    point, because we do not know if the default action—the action when no rules match—is
    to forward the packet or to reject it. In any case, your system must be configured
    with IP: forwarding/gateway set to yes for the 2.0 kernels; /proc/sys/net/ipv4/forward=1
    for 2.2 kernels and otherwise. Otherwise, the packet will never be examined by
    the forwarding chain all.


    In the case that forwarding is enabled, there will be a default policy associated
    with it. The default policy, when no firewalling rules have been specified whatsoever,
    is ACCEPT. If the router can forward the packet, it will. The default policy can
    be set using iptables to one of these three values: ACCEPT, REJECT, or DENY. The
    second two are equivalent in the packet that is discarded REJECT notifies the
    sender that the packet could not be forwarded via an ICMP host unreachable message.
    For denied packets, no message is sent. Typically, you use DENY for packets originating
    outside of your network (so the sender is not sure what happened to the packet),
    and REJECT for internally rejected packets as a polite way of saying “no.” As
    you can surely, there are two ways to go about configuring your rules.


    +   1. You can explicitly list the types of traffic which not be allowed to traverse
    the system by using the default policy of ACCEPT and specifying the traffic to
    be blocked with either REJECT or DENY rules.


    +   2. The other way is to alter the default policy to either REJECT or DENY and
    explicitly list the types of traffic which are allowed to pass with ACCEPT rules.


    Which of these you choose will depend on the desired effect and your skill level.
    The more secure of the two is undoubtedly refusing all traffic by default, and
    then listing traffic which may pass in ACCEPT rules. However, this can be


