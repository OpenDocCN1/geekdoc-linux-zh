  md: '# WAN Basics 101


    Latency When you are working with extreme distances, the different paths your
    packets take through a provider''s network become important. Latency is a measure
    of the time it takes for a packet to travel from location A to location B, and
    is independent of bandwidth. For example, you can place a small packet into a
    very large pipe (say, a 45Mbps link) between two points, but it could still take
    a “long” time (maybe 600–800ms) for a packet sent to emerge from the other end.
    Latency is partly due to the delays from switching switches, which require some
    time to look at the packet and pass it on. But a significant cause of latency
    is physical limitation—namely, the speed of light.


    A satellite geosynchronous orbit has an altitude of 38000km. If you could beam
    light directly in a vacuum, it would take an eighth of a second to get there.
    Multiply this by two to go up and back down. And you won''t be under the satellite
    for both trips (otherwise, you''re sending it to yourself), you should factor
    in another √2, plus the switching delays. Now you''re well past 350ms, and all
    of this is just to get to the destination. If you''re working interactively, you''ll
    need to wait for a reply,


    Compare this to the latency for fiber-optic half-wave across the face of the earth,
    and you''ll see how it makes sense to stay on the ground. With fiber-optic, you''ll
    be taking more hops (more switching time) and not travelling directly from location
    to location. Fiber-optic links can also be more expensive to deploy (and therefore
    expensive to use) than RF or satellite links. In many circumstances you have little
    control over the path your packets take once they leave your facility, and be
    aware that more bandwidth does not always equate to “fast” for users.


    Link Security Where there is networking, it seems that a security discussion is
    not far behind. The basic goal is always to exchange data between two or more
    machines, but the security measures require vary, based on the nature of the connection
    (and the data).


    When you dial up an ISP and the Internet to connect to your office, you are making
    a point-to-point connection via a public network that, for the most part, unregulated.
    You must guard not only the data you transfer, but also the machines themselves.


    Compare this to some of the private IP networks, which are known as dial-IP solutions.
    Access to a private network is controlled, either physically or by some authentication
    mechanism. For these networks, the users of the network all know each other; that
    is the illusion. Much more likely that they are all customers of the same service
    provider. Furthermore, the service provider should go to ensure that customer
    X cannot take a packet to the traffic Y is sending. Therefore, a better classification
    would be a semi-private network. If you are dealing with sensitive information,
    you cannot completely guarantee that an acutely interested competitor might not
    find a way to infiltrate your provider''s network (admittedly paranoid, or conceivable).


    Frame Relay is also a semi-private network, although most treat as private networks.
    Once your packets are on your provider''s network, they travel alongside packets
    from anyone else. It is conceivable that, through some social engineering,'
