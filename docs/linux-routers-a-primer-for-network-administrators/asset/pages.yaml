  md: '# Ethics and Other Considerations


    The sections in this chapter are essentially essays on topics related to being
    a network administrator with free software. They do not contain information about
    how to operate Linux routers, but I think that they are important topics for network
    administrators.


    # D.1 ETHICAL CONSIDERATIONS OF A NETWORK ADMIN


    Being a network administrator is not for everyone. It can be stressful at times.
    People who do not understand the network tend to blame it for application problems
    (which they often do not understand). You may have outrages that are out of your
    control and cause you considerable work, while managers browbeat you and want
    to know why you did not have a contingency plan—the same managers that denied
    budget requests for backup links. Performance problems can be difficult to track
    down Telcos are maddening in their carefree attitude when it comes to installing
    your access circuits in a timely manner. All of this comes with the territory.


    Another part of that territory is being in a convenient position to access the
    personal data of others. There is no need to go into detail how you can do this,
    Linux loaded with enough tools to make anything from sniffing passwords to recording
    all email transmissions easily accomplished. My purpose is to dissuade you from
    doing anything like this, regardless of why you might decide to do so, and avoid
    participating in any such activities of yours. The ability to see into other people''s
    activities, they business or personal, may be tempting. We''ve seen all the sitcoms
    where people use telescopes to peek into the lives of others. I think the primary
    question boils down to one of right. In the sense of right or wrong, it is not
    a question of good or evil—but right in the sense of privilege or permission.
    Does the ability to do something give you the right to do it? Some administrators
    that'
