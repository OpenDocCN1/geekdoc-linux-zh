    they apply to erbium and in general. Key to that solution is the ability to “masquerade”
    the IP addresses of the workstations connecting via the extranet router the target
    network is expecting them. This feature is often known as NAT, or Network Address
    Translation, and is frequently used to allow Internet access from private address
    space. And because not everything goes as planned, the final section goes into
    detail about the packet sniffers for Linux. These programs are used to “see what''s
    on the wire” (the network), from the protocol headers to the packet payloads.
    Specifically, the chapter is divided into the following major sections:


    +   - Erbium''s hardware, software, and scripting configuration

    - IP masquerading concepts

    - Configuring IP masquerading for Linux

    - Using IP masquerading every day

    - Packet sniffers available for Linux, and how they are useful for trouble-shooting


    # Note: Linux As a MODEM OR DIAL-IN SERVER


    > Note that this chapter is not a discussion of using Linux as a true server—although
    support for this is available. Likewise, using Linux as a dialserver, either for
    an ISP or a remote access server, is not covered. Many people are using Linux
    very successfully in this role, and you should be able to find ample documentation
    concerning this configuration. You can start with the LDP if you are looking for
    resources.


    Why Linux for an Extranet Router? An extranet router is faced with a daunting
    list of tasks. Its job after establishing a connection is to make n workstations
    appear as a single dial-up client. It needs to be flexible in terms of both security
    and networking standards. After all, you cannot tell your clients that they must
    implement protocol with product ABC so you can access their network for support.
    They have other vendors who need access, their own security policies to enforce,
    and their own dial-in solution investment. An extranet router should be customizable,
    so that you can cater to the needs of your users and needs, and it should be able
    to grow along with the rest of the technology. Finally, it should offer some security,
    even though its primary role is to connect your network to external ones.


    Linux has a lot to offer in this role since many have long prized how effectively
    you could connect it to other machines. Open standards for dial-up connectivity
    are already implemented, and in dire cases, you have the source to roll your own.
    The benefits of using a popular hardware architecture means that your selection
    of interface devices is plentiful and economical. You can customize your dial-out
    server with your own shell scripts, Tcl/Tk, or a full-blown GTK-based GUI front-end.
    And if you need to, you can lock it down with packet-filtering and integration
    to the security mechanism of your choice.'
