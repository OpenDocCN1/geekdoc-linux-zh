    For our example, we are going to configure our router to keep track of the

    number of packets (and bytes) travelling between subnet_A and subnet_B. Furthermore,

    all of our intranet web server is located in subnet_A, we would like to know

    the volume of traffic generated by users in subnet_B accessing web services in
    subnet_A.


    # 3.3.5 IP Accounting in Action—An Example


    To implement the example, follow the script below. The first steps are just to

    set up the user-defined chains. After that are the accounting rules which keep
    track of

    the traffic between our two subnets. The configuration is depicted in Figure 3.4.


    ```

    # create accounting chains "in", "out", and "both"

    # and hook them into the built-in chains (input and output chain)

    # by making them targets of these (the built-in) chains

    ##################################################


    # create a (N)ew chain "in"

    ipchains -N in


    # (I)nsert a rule for the input chain

    # which (j)umps to target chain "in"

    ipchains -I input -j in


    # create a (N)ew chain "out"

    ipchains -N out

    ipchains -I output -j out


    # create a (N)ew chain "both"

    ipchains -N both


    # (I)nsert a rule into the input and output chains

    # that (j)ump to target chain "both"

    ipchains -I input -j both

    ipchains -I output -j both


    # acct rule 1

    #################


    #

    ```'
