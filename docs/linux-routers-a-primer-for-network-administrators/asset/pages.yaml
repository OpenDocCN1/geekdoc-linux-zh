  md: 'The inside includes everything that is behind the Internet router—the portion
    of the Internet that is yours. At the very minimum, it should include the networks
    allocated to the private address space,as shown in Table 6.1. You should also
    configure packet-filtering rules to not allow these IP addresses to originate
    from your network, in case your router advertises them to somebody nearby (in
    terms of namespace—say, at the same ISP) notices and decides to see how open your
    network is. These will be one of the examples later in this chapter.


    What you will configure in your routing tables also includes the Internet address
    space which has been allocated to by your ISP, since it will not automatically
    be known to your router. This is obvious, but I didn''t want you to forget in
    your excitement of bringing up the link. Note that the IPs for the point-to-point
    connection normally not need to be routed by your internal network. Unless this
    is the only Internet-valid address space you have (which is problematic, as will
    be explained in Chapter 8), you can forget that since you should not have to contact
    each of the routers on the network directly via those IPs. Finally, your routing
    table may include any other address space, e.g., IPv6 address space or Internet-valid
    address space, which is not allocated to you, but which somehow is not known or
    will be accessed from your site. If you''re going to configure a dynamic routing
    daemon, now''s the time to do so.


    Otherwise, put your default route in /etc/wanpipe/wanpipe_routes (if you didn''t
    configure it in /etc/interfaces/ppp0) and the other routes into /etc/init.d/networks.
    Everything else is up and you''re working, which will probably affect about 20%
    of done (although it might feel like 80%); you still have to configure your security.
    Much of the remainder of this chapter contains discussions about security. First
    comes a section on general network security which will help you prevent people
    from the outside from hijacking your router for their own personal (ab)use. The
    section following deals with how to configure two variants of firewalling (really,
    packet-filtering) for Linux, limiting IP forwarding and blocking packets entering
    or exiting the system.


