  md: '# Helpful Links


    Perhaps the greatest challenge facing a network administrator is being able to
    find the right information in a timely manner. I have listed links which you may
    find useful.


    # A.1 GENERAL


    +   - http://www.linuxdoc.org/ is home to the Linux Documentation Project, or
    LDP. This is an excellent resource for up-to-date HOWTOs.

    - http://www.faqs.org/rfcs/ is a good site for retrieving RFCs. RFCs are scattered
    all over the Internet—so any search should return a long list of hits. But, not
    all of them are well-organized or formatted as this site. For Debian users, you
    can load the RFCs locally by installing the doc-rfc package.

    - http://www.linux.org/ and http://www.linuxuxlinks.com/ are both good places
    to start out if you''re not sure where you need to go for certain information.

    - http://www.freshmeat.net/ is a wonderfully current directory of software and
    software development projects for Linux (and other free operating systems). When
    someone says, “Have you used X?” and there isn''t a Debian package for X, this
    is the first place I go.

    - http://www.fsf.org/ is the home of the Free Software Foundation. Here you can
    find authoritative documentation for the GNU tools both in electronic and hard-copy
    form. If you appreciate free software, drop in and make a tax-deductible contribution.'
