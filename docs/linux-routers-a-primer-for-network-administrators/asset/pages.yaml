    If you followed along with the example, I hope that your configuration went smoothly.
    It is not a difficult package to configure and well the effort once you see the
    graphs of router traffic. By default, MRTG produces daily, weekly, and yearly
    graphs, so it is immediately useful for watching trends in network traffic. Because
    it is based on SNMP (if you have the source code!), it could become the backbone
    of your monitoring infrastructure. There are many potential "next steps” with
    MRTG. One possibility I finding is IP accounting counters available via SNMP.
    With this little time spent configuring MRTG, you could produce traffic graphs
    for certain protocols, or certain subnets—anything you can configure with IP accounting.
    Cool, eh?


    If you are a fan of LRP and need the functionality of WANPIPE, you are in luck.
    The LRP maintainers have already packaged a version of Sangoma’s driver software
    like the Debian wanpipe package. The package is available at the LRP site, ftp://ftp.linuxrouter.org,
    and can be added to your LRP root disk as explained in the following section.
    Note that there are a few differences between the LRP and Debian wanpipe packages,
    in the interest of saving space. The trimmings include documentation, the verbose
    startup and shutdown script, the kernel patches, etc. If you plan to use the LRP
    wanpipe, you should obtain the documentation from elsewhere (e.g., Sangoma’s FTP
    site). From a configuration perspective, here are the differences:


    +   * The router.conf is called /etc/wanpipe/wanpipe.conf.


    +   * There is no /etc/wanpipe/interfaces/ nor any interface files. You will need
    to configure your WANPIPE interfaces with ifconfig after wanpipeconf parses the
    configuration file.


    +   * There is an additional command called wanstat, which displays status information
    from the /proc filesystem.


    +   * The cfgtail is not included. If you want to have it on your LRP root disk,
    do not copy the binary from the Debian wanpipe package or Sangoma’s tarball. Because
    these are dynamically linked, they are unlikely to run on the LRP system with
    their paired-down libraries. Instead, compile a statically-linked version (edit
    the Makefile to use -static switch) or configure the S508-FT on another system
