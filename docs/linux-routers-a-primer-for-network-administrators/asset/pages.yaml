    or output, you can alter the default policy of the **input/output** rules chain,
    just as with forwarding. Once again, specifying a default policy of **REJECT**
    or **DENY** is recommended.


    I find it very helpful to draw pictures of what''s going on when working with
    packet-filtering. One reason for this is that the definitions of **input** and
    **output** are relative to your position. Input with respect to an external interface
    means a packet from the outside of your network, while rules on an internal interface
    apply to outbound packets. Figure 6.6 illustrates the difference. I often refer
    to your perspective on packet flow as “where you stand”. For example, if you are
    “standing” outside of the firewall, all input rules apply to eth1.


    Realize that the picture becomes more complicated when you have a network more
    than two interfaces, so keep this in mind when designing your network topology
    over your firewall and Internet router. To give you an idea, take a look at Figure
    6.7.


    Packet-filtering is just another example of how there are many ways to accomplish
    a task with Linux. I believe this is part of its Unix heritage—part of the toolbox
    philosophy. Your solution to a problem depends upon how you look at it. In the
    case of packet-filtering and firewalling, there are many “correct” answers; use
    the one that you understand.


    # 6.3.3 Packet-filtering with ipchains


    ipchains provides a very powerful mechanism for limiting traffic into or out of
    a system or between networks. (Later, it is also the tool used to take advantage
    of some the kernel functionality like port forwarding.) This section provides
    a short introduction to using `ipchains` to configure input and output firewall
    rules. You can refer back to Tables 6.2–6.6 for help with the syntax or run `ipchains`
    -h to see all'
