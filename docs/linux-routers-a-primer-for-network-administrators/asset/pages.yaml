  md: '# 220—Californium—Satellite Office Router Chap.7


    This chapter devotes itself to each of the capabilities and concerns surrounding
    californium. First, it reviews the configuration of a WAN link running CHDLC using
    Sangoma''s WANPIPE software. CHDLC (Cisco High-level Data Link Control) is another
    protocol for WAN links, similar to synchronous PPP. The next four topics cover
    how Linux routers can save hardware and bandwidth:


    +   - Californium acts as the DHCP server for the site, issuing IP addresses and
    other network info to local clients.

    - It runs a copy of the DNS daemon named (part of Bind) as a slave. In this configuration,
    it fetches copies of internal zones and caches any external network lookups made
    by its clients.

    - Californium is configured with Samba to act as a local print spooler for a network
    attached printer.

    - Californium provides a caching HTTP proxy so that frequently accessed pages
    are kept locally.


    These sections about adding functions to the router are followed by discussions
    monitoring system load and supporting Linux systems. The remote support goes into
    methods of accessing the router when the primary connection is down as well as
    a few tricks for sites with redundant links. It concludes with a few backup strategies
    for remote systems.


    # 7.1 CHDLC ROUTER TOPOLOGY


    After getting bogged down in CIR, PVCs, and DLCIs with Frame Relay, CHDLC will
    be a welcome surprise. It is simple to configure, and as such, it supports basic
    configurations. Hardware-wise, the router is configured much like Frame Relay
    or synchronous PPP. The main difference is how you use the access. CHDLC is a
    protocol useful when you have a digital access circuit connecting two sites directly.
    From this, you allocate a subset of channels to be used for data, and run CHDLC
    routers on both ends of the link. A typical scenario is a small office, which
    needs to have telephone service and data, and perhaps access to the company voicemail
    system. If the point-to-point access circuit costs are reasonable, there is no
    need to pay for each of these services individually at the remote location. You
    can order a single digital circuit which connects the remote site to the main
    office. With a couple of CSU/DSUs, multiplex the T1 by allocating some of the
    channels to the PBX (for voice), and others to your data circuit. The hardware
    costs may be higher upfront, but you''ll end saving money in the long run because:


    +   - There are no port or PVC charges, and no CIRs. The full bandwidth of the
    trunks allocated to data is available to the connection.

    - You can reconfigure the allocation on the access circuit as you see fit. If
    data bandwidth becomes less important over time and you need more voice capacity,
    you can change the channel allocation yourself without reconfiguration costs.

    - Apart from your telco provider, there is no other vendor or service provider.
    This saves time during contract negotiations and reduces finger-pointing during
    an outage.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# CHDLC Router Topology


    +   - You will not have to pay toll charges for calls between the offices (if
    your telephone equipment supports it).


    +   - Rerouting voice calls to/from the smaller location leverages the capacity
    at the main office, which is purchased in larger quantities and therefore costs
    less per channel or minute. For example, a toll-free support line which may re-route
    calls to a specialist at the remote office.


    +   - Even if you have no need for voice circuits, point-to-point access circuit
    may be less expensive than paying for two shorter access runs, ports and CIRs,
    especially if you need a high CIR.


    A typical topology is like that depicted in Figure 7.1. Because it is designed
    for point-to-point operation, configuring CHDLC is very similar to the synchronous
    PPP link as described in Chapter 6. The only real difference is that you own both
    ends of the link, and have to configure both routers. The hardware setup is the
    same as what has been presented previously for the Frame Relay and Internet routers
    running WANPIPE.


    If you are intending to multiplex a T1 in the manner described, you shouldn''t
    order WAN interface cards with the integrated CSU/DSUs. The integrated units are
    not designed for multiplexing. The type of CSU/DSU which supports this operation
    is referred to as drop-and-add, and will have ports for both your router and the
    PBX. If you already have a Sangoma card (SS08) on order, you might be able to
    spare purchasing another card for the home office. These cards have a second port,
    a DB9 connector underneath the DB25, which can be used to run CHDLC up to 256kbps.
    Note that you MUST have a CSU/DSU with an RS-232 interface to use this port, or
    use a V35 to RS-232 converter. Many CSU/DSUs with a V35 data port may be used
    only to run CHDLC, and you will need to order a cable from Sangoma to use it.
    Once you have a card in each router, and the routers connected to their respective
    CSU/DSUs, it''s time to configure the wanpipe1.conf file and the interfaces file.
    If you are using the Debian wanpipe package, keep the following pathname translations
    in the back of your mind.


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_244_0.png)


    Figure 7.1 Satellite Office with CHDLC Router Topology'
