    +   - It is embarrassing, but it happens. Lost password(s) can put you in a precarious
    situation. The best way I have found to deal with them is to wait for an off-peak
    period, bounce the box (from the console with CTRL-ALT-DEL), and boot using a
    rescue floppy. Let the rescue floppy boot the system and then execute a shell.
    In this shell, create a /tmp directory and mount the root partition of the hard
    drive. Now just cd /tmp/root/etc and use the editor on the rescue disk to remove
    whatever is in the password field for /root/passwd and Shadow. Now cd , ummount
    /tmp/root, eject the floppy, and reboot the system. As soon as it comes up, log
    in “root” and set the password to something you can remember. If you procrastinate
    fixing the problem, you may find yourself explaining to a user or manager why
    you cannot make the requested configuration change in the middle of the day without
    disrupting normal activity.


    +   - Almost as embarrassing as a lost password is a bad kernel. If you generate
    a kernel which will not boot your machine and do not have a backup kernel image,
    you will have to boot from something to get going again. In this case, boot the
    system from a different kernel, but mount the root filesystem as itself. For the
    Debian rescue floppy, you can type rescue=/dev/hda1 (substitute root partition
    for hda1) at the root: prompt to boot from the same kernel you used to initially
    load the machine. Once booted, you can login, clean up the kernel mess, and try
    again.


