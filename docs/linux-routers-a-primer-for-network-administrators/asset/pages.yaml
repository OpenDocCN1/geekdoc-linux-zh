  md: '# Hard Drive Problems Ok. stupid admin tricks aside, there is another, entirely
    different class of problems which require rescue disks. Namely, any sort of filesystem
    corruption which renders the root filesystem unmountable. Filesystem corruption
    typically takes one of four forms.


    +   1. Filesystem meta-data inconsistent due to disk buffers not flushed before
    the system halted. This sort of corruption will occur any time that the system
    reboots unexpectedly. The fsck program will usually set things straight again,
    as long as it is to execute (i.e., the root filesystem can be mounted read-only).


    +   2. The hard drive detects a bad block and the controller is unable to relocate
    it to a good block.¹10 Any files or inodes with that block are unreadable. In
    this case, the severity of the problem depends entirely on where the bad block
    is located. If it is underneath /lib/ld.so or /etc/initab of /bin/mount, things
    will get worse before they get better. On the other hand, you may never notice
    it. It does not mean that the drive is failing, or that more blocks are to be
    expected.


    +   3. The hard drive is understress to any number of physical factors such as
    failing bearings, excessive heat, This may result in intermittent problems, or
    it may be the beginning of the very short journey known as “head crash.” In this
    case and in one, the best thing to do is to revert to a standby system, try to
    mount the drive read-only and salvage what you can (if you need to).


    +   4. Incompatibilities may exist between the kernel and the chipset on your
    disk controller. I used Linux for years before I experienced anything like this.
    Boy was I surprised! The problem was easily corrected, but it was costly in terms
    of time lost. While these types of incompatibilities are not uncommon, they exist,
    as I learned when I appealed to others for reasons why my system had suddenly
    lost its mind.


    The best way to prevent this is to take hold of the configuration help which comes
    with the kernel, and to be careful when tuning hdparam. If such failure occurs,
    you will probably know right away. Typically happens that the kernel notices the
    problem and remounts the root filesystem as read-only (as per errors=remount-ro
    in /etc/fstab). This will break things such as system logging, being able to edit
    files and perhaps being to view pages, but you will prevent the bug from destroying
    your filesystem any further. If you notice something odd with your system all
    of day, if you touch /tmp/mctoo fails, then you ought to take a close look at
    /var/log/kern.log and /var/log/syslog.


    All of these are varying degrees of badness, depending on what is affected. The
    Linux system tools will patch up problems with the meta-data as long as the drive
    is capable of storing and retrieving information. If the drive can boot from itself
    and clean itself, then you do not have anything to worry about. If the system
    can mount the root partition read-only but cannot successfully complete a fsck
    run without interaction, then you will be prompted for the root password and


    > ¹⁰ A function of IDE drives.'
