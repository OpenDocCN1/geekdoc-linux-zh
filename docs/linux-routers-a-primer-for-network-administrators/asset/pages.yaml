  md: '# Testing Strategies and VMware


    As a network administrator, you have to struggle with devising ways in to adequately
    test new network configurations, software, and equipment without adversely affecting
    your user community. The network is an integral part of most computer adverse
    installations and requires uptimes an order of magnitude better than most applications—most
    applications use their maintenance windows to perform network-based backups!


    Because nothing functions without the network, new routing configurations, new
    Ethernet drivers, and new versions of the proxy server all need to be right when
    they are first implemented. If anything breaks in production, it is improbable
    that it will go unnoticed. Testing network configurations gets complicated because:


    +   - Lab environments which are similar production environments are costly. Resource
    content contention can be very troublesome if you have a limited budget.

    - It is difficult to simulate production load on the network.

    - Test environments are designed by you, and chances are that you have already
    prepared your system(s) to cover the cases you anticipate might occur. You may
    tend to do the same when connecting tests—in effect, testing only the cases for
    you have already prepared.

    - You will be under pressure to deploy new network configurations quickly or in
    response to problems or bugs. In this scenario, time is more of a resource constraint
    than money, and testing often takes a secondary role.

    - Some parts of the environment are out of your control, and can be duplicated.
    The ultimate example is the Internet itself. Adequately testing new SMTP mailer
    or DNS configurations is touch stuff, since mistakes can have disastrous results.
    (Bouncing mail off of your SMTP gateways for half an hour will require some explaining
    to your management.)'
