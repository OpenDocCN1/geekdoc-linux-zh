    Devices which will run the PPP firmware modules need WAN_PPP as their config_id.
    You should edit the comment field to contain your circuit id, and perhaps even
    the telephone number for support at ISP.


    # SPPP [interfaces] Configuration in wanpipe.conf


    ```

    # -----------------------

    # The [interfaces] section defines logical-channels and

    # corresponding network interfaces created by the router.

    # name=device,media_addr,description

    # -----------------------

    [interfaces]

    sppp0 = wanpipe, WANPIPE, **edit router.conf - sppp link **

    ```


    sppp0 is the interface name I use for synchronous PPP WAN interfaces, but the
    choice is arbitrary. If I would like to change it, do not forget it in the interface-level
    configuration section that follows. The device is any device you have already
    defined in the [devices] section that has a config_id of WAN_PPP. PPP links do
    not have media addresses so media_addr remains blank. This is because there will
    be only one [interface] per [device] for PPP. The PPP is not designed to share
    the line with any other protocol or link—it wants to use all of link for itself.
    The comment field can be used to see it. I recommend placing the IP addresses
    of your PPP configuration or more info for your ISP.


    # SPPP Device-Level Configuration in wanpipe1.conf


    ```

    #

    # device-level link configuration section.


    [wanpipe]               ### WAN_PPP interface ###

    IOPort          = 0x360             # I/O port base

    IRQ             = 12                # IRQ

    Firmware        = /usr/lib/wanpipe/ppp508.sfm # adapter firmware

    Interface       = V35               # physical interface type, RS232/V35

    Clocking        = External           # Tx/Rx clock source: External/Internal

    Baudrate        = 512000            # data transfer rate in bps

    IP_MODE         = STATIC            # PPP/STATIC: do not request address

    MTU             = 1500              # maximum data transfer unit, bytes

    UDPPORT        = 9000              # for UDP management

