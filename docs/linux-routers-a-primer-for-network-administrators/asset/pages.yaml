  md: '# 5.3 Linux and WANPIPE for Frame Relay


    # WANPIPE and Kernel Development During the heyday of the 1.2 and 2.0 kernels,
    there was a lot more fluctuation in the kernel, less coordination between the
    driver authors and the kernel authors/maintainers. When a new patch was released,
    Sangoma had to test their drivers, make any necessary changes, and release a new
    set of patches. Because of this, WANPIPE was (and still is) distributed including
    a set of kernel patches and the source code for the utilities (which would need
    to be compiled by the end-user against their specific version of the kernel).


    The direction going forward is to have the patches already integrated into the
    kernel source so by simply selecting them during the kernel configuration. (This
    effort began with the 2.2.x kernel.) During evolution there were still versions
    of Sangoma''s code newer than the versions in the upstream kernel source, so there
    was still a need to distribute patches. As of kernel version 2.2.14, the kernel
    and Sangoma are in sync. Furthermore, this kernel version became the release candidate
    for Debian 2.2. A version of pristine kernel source that will be widely distributed
    along with a matching set of WANPIPE binaries gives gives Debian (and others)
    the opportunity to offer “out-of-the-box” WAN router support—no compilers or kernel
    builds required.


    Whether or not all of this remains in sync is to be seen. The implication is that
    you may need to check the Sangoma FTP site periodically for new patches that might
    not be in the upstream kernel. There is even the outside that you will have to
    rebuild the utilities so that they operate with the new driver code.


    # 2.2.x kernel for WANPIPE You should have to build a kernel with WANPIPE support,
    configure the kernel with the options listed below. Note that the kernel build
    scripts will allow you to build the drivers directly into the kernel (i.e., not
    modules). Don’t do this—the drivers must be modules.


    ```

    Code maturity level options -->

    [*] Prompt for development and/or incomplete code/drivers

    Networking options -->

    [*] TCP/IP networking

    [*] IP: advanced router

    <M> WAN router

    Network device support -->

    Wan interfaces -->

    [*] WAN drivers

    <M> Sangoma WANPIPE(tm) multiprotocol cards

    (1) Maximum number of cards

    [*] WANPIPE X.25 support

    [*] WANPIPE Frame Relay support

    [*] WANPIPE PPP support

    [*] WANPIPE Cisco HDLC support

    Filesystems -->

    [*] /proc filesystem support

    ```


    > 4 Thanks to go to Alan Cox for his efforts in this matter.'
