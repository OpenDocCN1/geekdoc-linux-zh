  md: '# 276 Hafnium—Internet Services Router Chap. 8


    Receiving mail should not be a problem. Your DNS configuration needs only an MX
    record which lists your router as an appropriate Mailchanger for your domain.
    Some senders may be disturbed by the fact that your forward and reverse DNS lookups
    do not match; they may generate a warning message, but they probably won''t refuse
    to deliver mail to you on these grounds.


    Sending mail, however, has issues similar to DNS. Furthermore, because of the
    recent campaigns against spam, there are some other problem situations which may
    occur. Firstly, you are likely to find mail servers refusing to accept mail from
    servers which are not properly resolvable in DNS. Secondly, some mail servers
    may reject your mail from the sender address (or domain), if domain does not correspond
    (once again, in DNS) to the domain of the sending system. Finally, you may have
    problems if your point-to-point link to the Internet is not routable, since not
    all MTAs allow configuring a bind-address as we discussed for our DNS daemon.


    The DNS and routing services listed here are applicable to most Internet services.
    To summarize, some services like to be validate that the IP address and hostname
    are a matching pair in DNS. More specifically, the canonical hostname should match
    the IP address used to send traffic to the Internet. This is probably a holdover
    from earlier times when the predominant security mechanisms were IP-based. The
    idea still has merit, because it means the machines on the other end were configured
    by someone who took the time to configure their DNS properly, and when registered,
    their servers with the InternIC. However, with the explosive growth of the Internet,
    things have changed. Many running domains have never even read a RFC. In defense,
    they (we) are asked to support an environment with more protocols, less knowledgeable
    users, and significantly more volume than before. Still, it never hurts to know
    what you''re talking about.


    A subtle variation on this, not related to DNS, may occur for internal WAN links
    using "unroutable" IP addresses for the point-to-point interfaces. An administrator
    sitting on a router to telnet to a host on a remote network to test the link.
    The link seems to be up, but the host never replies. This is because the telnet
    client binds its socket to address INADDR_ANY when trying to connect to the router.
    Instead of using the hostname for the source field in the packet, the kernel places
    the IP address of the interface used to send the packet. The packets reach the
    intended destination, but that destination may not be able to find a route back
    to the IP address of the point-to-point interface on the router. The frustrated
    router admin is confused, there does not appear to be anything wrong with the
    link or its routing configuration. For internal links, one solution was offered
    in Chapter 5 on page 146. Another solution is to ensure that all internal IP addresses,
    including that part of the point-to-point are routable by getting the right information
    into the routing tables for all of your routers. Daemons which take care of this
    are the topic of the next section.'
