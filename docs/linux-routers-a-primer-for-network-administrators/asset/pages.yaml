  md: '# The Path Between You and the POP


    The path your packets take between the router and the provider''s POP for a typical
    T1 access circuit includes the following pieces of hardware and steps:


    +   1. Your router will have a synchronous WAN interface card in it. This is typically
    an add-on adapter that has a high-speed serial port and a processor on-board to
    handle the protocol for synchronous communications.


    +   2. A CSU/DSU which interfaces the synchronous WAN interface to the digital
    telco circuit. Details about CSU/DSUs are in Section 2.3.3.


    +   3. A RJ–45 connection between the CSU/DSU and the telco access point, known
    as either demarc or a smart-jack. The term demarc has its basis in the fact that
    everything on your side of that interface belongs to you, and is referred to by
    the telco as CPE (Customer Premise Equipment). The demarc is either a self-contained
    unit (normally a metal box mounted on the wall) or a chassis which holds several
    dem. A smart-jack is the same as a demarc, except that the interface card (the
    circuitry that terminates the access circuit) is in a closet somewhere, and only
    the RJ-45 jack has been extended out to your site. When the circuit is installed,
    it should be labelled with the circuit ID of the access circuit.


    +   4. The CSU/DSU handles the channelization of your data—i.e., it takes the
    stream of bits from the WAN interface and builds frames (with data only in the
    timeouts which correspond to the channels in use on the circuit). The CSU/DSU
    converts the electrical signals for transmission over the Ti.


    +   5. This bit stream is transmitted through the telephone network through some
    combination of central offices and switches until it reaches its destination,
    which is demarc at the POP. Because the data are digital, they can be reconstructed
    any time it is required to rebuild the signal strength or switch media within
    the telco network (for example, if a portion of the circuit is on fiber instead
    of copper).


    +   6. The process is reversed on the other side. The bit stream flows through
    the demarc into the CSU/DSU where it is converted into signal levels that their
    router''s WAN interface understands and expects.


    +   7. From there, the packets flow over the provider''s internal network until
    they find the appropriate exit point (also known as egress). The egress point
    from the provider''s network depends upon the type of service you use. If this
    is ISP, then your packet should end up on the Internet. If it is a Frame Relay
    link, then it will appear on your provider''s router at the POP on the end of
    the link, so that it can be transmitted to your location B.


    Looking back at the block diagram (Figure 2.7), it is functionally similar to
    that of analog modem. The cables are different, the protocols are different, and
    what is really happening on the line is entirely different, but it feels the same
    (if you squint at the picture).'
