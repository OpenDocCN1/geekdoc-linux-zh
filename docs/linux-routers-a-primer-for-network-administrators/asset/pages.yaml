    \ HackerX, who\n# attacks from RFC1918 private IP addresses\n# kernel version\
    \ check\nif [[ $(uname -r) == \"2.0\" ]]; then\n  USER_IPFWADM=1\nelse\n  USER_IPFWADM=0\n\
    fi\n\n# specify interfaces in rules as either $I or $E\neth0                 \
    \       # Internal interface (inside the firewall)\neth1                     \
    \   # External interface (outside the firewall)\n############################################################\n\
    # Install_input_rules configures input packet-filters\n############################################################\n\
    Install_input_rules()\n{\n  # rule 1\n# disallow IP spoofing of private subnets\n\
