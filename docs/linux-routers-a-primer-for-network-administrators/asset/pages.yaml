  md: '• CUSeeMe with the module ip_masq_cuseeme.o


    • FTP with the module ip_masq_ftp.o


    • IRC with the module ip_masq_irc.o


    • Quake with the module ip_masq_quake.o


    • RealAudio and RealVideo with the module ip_masq_radio.o


    • VDO Line with the module ip_masq_vdolive.o


    To use one of the protocol modules, simply load it in insmod. Because they need
    to be loaded to be useful, I add them to /etc/init.d/network file so they are
    loaded during the startup sequence. Although you rarely need to use it, several
    of the modules support the ability to listen to more than the well-known port
    for their respective protocol. This is useful if you would like to provide FTP
    services on more ports than just port 21 by adding the argument to ports=x1,x2,x3...
    to the command line with using insmod to load the module. If you want to specify
    more than MAX_MASQ_APP_PORTS different ports, you will have to modify the value
    in /usr/src/linux/include/net/ip_masq.h and recompile the kernel and the modules.
    Other masquerading modules related to IP port forwarding are covered in Section
    8.2.3 and transparent proxying in Section 8.2.2.


    # 4.3 CONFIGURING IP MASQUERADING


    Now that you know what masquerading can do, and have an idea about how it does
    it, you need to know how to go about enabling support for it and configuring masquerading
    rules. With other kernel facilities, you must select it during the kernel configuration
    process, compile a new kernel, and then reboot to be able to use IP masquerading.⁵


    The generic IP masquerading code is in /usr/src/linux/net/ipv4/ip_masq.c, and
    handles the straightforward TCP, UDP and ICMP protocols. When you compile a kernel
    only with IP: Masquerading, you will have support for TCP and UDP. You should
    set IP: ICMP masquerading if you also want ICMP packets to be masqueraded.(This
    enables some parts of the code in ip_masq.c.)


    In either case, be sure to set IP: always defragment whenever masquerading. This
    has the effect of coalescing any packet fragments into the original (larger, unfragmented)
    packet before handing them to kernel''s forwarding code. This is necessary because
    the masquerading code in the kernel will not be able to recognize fragments from
    masqueraded connections without knowing the source and destination IP and ports.
    Additional protocol support is automatically built as modules when you build a
    kernel with masquerading support. (Just don''t forget to load into the kernel
    before using them.) The full set of options:


    > It is absolutely essential for popularity with developers and fellow administrators
    that this is working!


    > The stock Debian kernel with masquerading enabled, as any others.'
