    **wanpipe1.conf''s Structure** The file might seem a little imposing at first,
    but it is well commented and easy to follow once you understand the different
    sections. The format is very similar to a .ini file used on other operating systems.
    The sections are denoted by keywords enclosed in [ ]. Comments start with the
    # character and continue to the end of the line.


    The file has a hierarchy to. The two main sections are [devices] and [interfaces].
    Both of these sections must appear, and each contains one line for each device
    or interface you would like to configure, respectively. For each line (i.e., device
    or interface) in these two sections, there will be a subsection later in the file
    denoted by the name of the device or interface. A brief example of the format
    should make this clear. In the mock wanpipe1.conf file below, there is one **device**
    and two **interfaces**.


    ```

    [devices]

    # this machine contains one device/physical card, wanpipe

    wanpipe

    :

    [interfaces]

    # there are two interfaces

    wan0

    wan1

    [wanpipe]

    # configuration settings for the physical device wanpipe

    :

    [wan0]

    # settings for the interface wan0

    :

    [wan1]

    # settings for the interface wan1

    :

    ```


    **wanpipe1.conf—devices]** A **device** in this case refers to a physical Sangoma
    card. That, the number entries in the [device] section will correspond to the
