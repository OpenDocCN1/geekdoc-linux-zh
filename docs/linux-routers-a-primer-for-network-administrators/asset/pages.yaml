    removes a module along with any of its dependent modules (not in use by other
    modules or processes).


    **Module Parameters** Many modules accept configuration parameters, which can
    be specified on the command line when they are loaded. The parameters often tell
    the driver where to search for the card (at what IRQ or base address), as well
    as options such as whether or not the card should use full-duplex mode, which
    transient to activate, and so on. All modules use the same keywords, although
    most support `baseaddr` and `irq-irq` for setting these values. Unfortunately,
    the manner in which options must be specified when you have multiple interfaces
    is completely up to the driver author. In these cases, it is best to refer to
    the documentation accompanying the driver or in the driver source code itself.
    These may be found in the kernel source tree (usually `/src/linux`) in `/Documentation/networking/`
    and `/drivers/net/`, etc. Since not all drivers are the same as the card, it is
    helpful to use `grep -i` through this directory for the name of your card to locate
    the right file(s). It may not hurt to read through `/usr/src/linux/Documentation/modules.txt.


    **Problems Loading Modules?** What to do if you have the correct driver support
    and the cards are still not recognized? Chances is to be with incorrect parameters
    or resource conflict (IRQ or base address). First, recognize that PCI and ISA
    cards are different. PCI cards receive their IRQ assignments from the BIOS on
    the motherboard, and both (worthwhile) BIOSes produce a list of IRQ assignments
    to PCI devices just booting the operating system. If you suspect an IRQ conflict
    with a PCI device (probably with an ISA device), check the contents of `/proc/interrupts`
    to see if the interrupt is foolproof, because the ISA card causing the conflict
    may not be in use. This is not foolproof, because the ISA card is already initialized
    by the OS either. The base address rarely poses a problem. The range of addresses
    assigned to PCI devices is different than that used for ISA cards.


    ISA cards are another matter altogether. For one thing, be certain that **PnP**
    (Plug and Play),¹ is **turned off** for any card in the system. Many network cards
    with a configuration utility (which typically runs under MS-DOS) will do this
    for you and let see the IRQ and base address. Some of these tools are available
    for Linux; you must start at `http://cisec.gfsc.nasa.gov/`. Older cards which
    you can use to set the base address, IRQ, or sometimes both. In the worst case,
    just use two interfaces with different drivers. You should keep in mind that most
    cards of the same brand and model default to the same **base address** and IRQ
    settings, which you will have to take some action to avoid the conflict.


    If none of these things helps, break down and RTFM to find out if the card is
    supported by Linux at all. Odds are that someone else has had the same problem,
    and perhaps documented their experience at the **LDP site** (either in the **Ethernet**


    > ¹“Plug and Play” for those who have suffered the arbitrary nature.'
