    # 2.1.1 IP Subnetting


    An IP subnet is a collection of network addresses which can communicate directly
    with each other without having to refer to a router to accomplish the communication.
    In other words, the media-protocol drivers support direct communication between
    all systems in the same. Transmitting data between two separate subnets requires
    a router, often called a gateway in this context. To determine whether or not
    two systems are in the same subnet, do the following:


    +   * Perform a binary AND of the IP address of machine A and the subnet mask
    of machine A. Now do the same for machine B. If the resulting network addresses
    are identical for both machines, then these machines can speak over TCP/IP to
    each other using a gateway.


    If this is Greek to you, you should review the remainder of this section. It introduces
    base-2 method to get started with IP addresses, the subnet mask, what is meant
    by a network and broadcast address, and how to calculate them.


    The IP Address & Base-2 Mathematics An IP address is a collection of 32 bits,
    divided into four groups of 8 for convenient presentation in the form of 4 unsigned
    integers (really, decimals, which the presentation is in–10). Each grouping of
    8 bits can be expressed as a value between 0 and 255. Almost everyone is familiar
    with the dotted-decimal notation used for 32-bit IP addresses: w.x.y.z, where
    0 ≤ w,x,y,z ≤ 255. This is done primarily for humans; the computers couldn’t care
    less about the decimal values. Here is an example address:


    As you see it (base–10):


    215.38.181.126


