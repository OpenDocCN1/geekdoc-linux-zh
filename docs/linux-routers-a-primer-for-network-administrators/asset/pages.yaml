  md: '# 3.1 Configuring LAN Debian Kernel


    # Hint: The Stock Debian kernel


    > The Debian kernel comes with many options (such as firewalling support) and
    all of the modular device drivers. This eliminates the need for compiling a new
    kernel from the source for this example. However, the stock kernel is compiled
    for the 386 architecture and probably contains (disk subsystem) driver support
    that you do not need. To decrease the size of the kernel''s memory footprint and
    to fine-tune other options to your environment, get into the habit of compiling
    your own. (Refer to Section B.4 in Appendix B for detailed instructions.)


    If you are not running your new kernel, make sure that you wrote the new kernel
    to your hard drive with the `make (b)zilo` step. You can explicitly call `lilo`
    the command line with `lilo -to` to see what is happening. You might also want
    to check if perhaps you left a rescue floppy or a boot floppy in your system which
    came with your Linux distribution.


    # 3.1.3 Loading Modular Device Drivers


    Once we have routing support, we need to load the device drivers for our Ethernet
    adapters that we can use. It is highly recommended that you use modular device
    drivers—for a list of reasons why, the discussion in Appendix B on page 303.


    The modules are placed in `/lib/modules/$(uname -r)/net/3c59x.o` during the `modules_install`
    phase of the kernel build. `insmod` should be smart enough to figure this out,
    and you should have to type only `insmod` nodename. If you have 3c905 cards like
    the NE2000 is an example, loading the driver is as simple as `insmod 3c59x`. If
    you have a different type of NIC (or NICs), you should load the appropriate modules.


    Dependent Modules Be aware that some modules use (really, code) from other modules
    and must be loaded in what is called a `stack of dependent modules`. A very common
    example is the NE2000 and its many cards. The modules `ne.o` cannot be loaded
    until a module depends upon, `8390.o` has been loaded. Fortunately, you do not
    have to memorize this. Every time the system boots, `depmod` is called and writes
    the current list of module dependencies to `/lib/modules/$(uname -r)/modules.dep`.
    You may look in this file to see what dependencies exist between modules. Each
    line lists a module in the first followed by a `-`, and then a list of space-delimited
    module names. If nothing follows the `-`, then the module has no dependencies.
    Otherwise, the modules are required.


    `modprobe` uses the contents of the `modules.dep` file to load any dependent modules
    that you specify. Simply give it the name of the module to load as its argument,
    followed by any options you would normally specify to that module when using `insmod`.
    For example, `modprobe` will load `ne.o` and `8390.o`. Using the `-r` switch reverses
    the sense and'
