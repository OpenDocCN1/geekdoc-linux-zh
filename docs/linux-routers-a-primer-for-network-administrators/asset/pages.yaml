  md: '# IP Accounting


    -b makes the rule apply bidirectionally. What really happens is two rules entered—one
    the way you specified it on the command line and the other with -s and -d reversed


    +   - y matches packets where SYN=1 & ACK=0 & FIN=0, in other words, packets initiating
    a TCP connection (or not).


    +   - f matches packet fragments 2–N of a fragmented packet. This is necessary
    because fragments do not contain ports (neither source destination nor ICMP types),
    so it is not possible to match them with other rules.


    +   - target sends the packet to chain called target if it matches. This is how
    we send packets through our user-defined accounting chains. Beside a user-defined
    chain, target can be one of the built-in targets. We have ACCEPT, DENY, REJECT,
    MASQ, REDIR, and RETURN. Of these, RETURN is of interest for IP accounting. This
    is a way to not count packets which matches the criteria specified in the rule,
    because RETURNS the packet to the calling rule on the calling chain.


    +   - ipchains -D mychain (myrule||rule) Deletes myrule from mychain or myrule
    from mychain. Rules are numbered consecutively with "I"

    - ipchains -R mychain myrule Replaces myrule with myrule in mychain.

    - ipchains -I [myrule] mychain Inserts myrule into mychain. If myrule is omitted,
    the beginning of the list is assumed.


    Phew! ipchains packs a lot of functionality, and we have scratched the surface.
    We need to do something with it before we lose track of all those options.


    # 3.3.4 Choosing Packet Criteria for IP Accounting


    Let''s continue to introduce the concept of IP accounting by deciding on some
    packet criteria and then configure the system to count all matches. Fundamental
    to making sense of IP accounting is to understand TCP/IP''s use of different source
    and destination ports to differentiate protocols. In other words, IP accounting
    is not going to configure itself; you have to know what it is you are looking
    for, and what means at a protocol level. For example:


    +   - establishing a TCP socket connection to port 23 is the first step in starting
    a telnet session.

    - sending a UDP packet to port 53 is used to get things going with DNS.

    - connecting to TCP port 110 implies that you want to talk to a POP3 daemon.

    - talking to TCP port 80 will let more than get you to a connection to an HTTP
    daemon.


    There are several books which cover this topic in considerable detail and clarity;
    Building Internet Firewalls by Chapman and Zwick is one that does an excellent
    job of putting the pieces together. It is important to have a good understanding
    of the protocol to configure accounting rules which detect the network events
    you are interested in capturing.'
