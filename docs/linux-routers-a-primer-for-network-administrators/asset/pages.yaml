  md: '# 7.5 Summary


    suitable mailers in case drives in a router fail, and possibly some of those bitty
    jumpers used to configure the drive for the controller. You should also back up
    the tarballs and images using a “real” backup system.


    Other Backup Tools Should you desire to generate a “real” backup, there are literally
    dozens of choices of tools and equipment, with constant options becoming available.I
    recommend that whatever you choose, you become familiar with it to the point that
    you have a high degree of confidence in it, and stick with it. This means that
    you need to do more than just back things up—you also rigorously test restores
    in as many distinct scenarios as possible, as well as scheduled intervals (to
    account for system configuration changes and to test media integrity).


    If you’re not sure where to start, you should shy away from solutions that are
    tied to a particular type of particular backup. Backup technologies change often
    and come in several different scales. By this I mean that what is inexpensive
    per MB for 2GB backup solutions may be prohibitively expensive to back up 100GB,
    but at the same time you cannot justify the cost of a 100GB solution if you never
    back up more than 1GB. Your needs will change over time (growing due to environment
    or shrinking due to things as better filesystem orthogonality), and you don''t
    want to use backup software tied to a certain type of device. (For example, sometimes
    you''ll want to speed to up directly to another disk.) In any event, take a look
    at the traditional standbys as a starting point and assess your needs from there.


    +   * tar and cio are your basic system primitives for backup and restore. Because
    they are so general-purpose, they may fall short of your needs, but they are typically
    utilized far short of their capabilities. As example, they can be used together
    with rmt to manipulate a remote tape device for either reading or writing.

    * The BSD dump and restore utilities are more inline with what people think of
    when they imagine a backup tool. They support incremental backups via levels and
    use of a remote tape device through rmt like tar and cio.

    * taper gets off of the command-line and into using a ncurses-based interface,
    while supporting the generic functionality as dump.

    * If none of these tastes, there are several good commercial products available
    for Linux. These typically provide the added features of verifying backups after
    they occur, counting the number of times a piece of media has been used, a GUI
    interface, and so on. You may also find some of the-name companies offering Linux
    clients that operate with their backup server code.


