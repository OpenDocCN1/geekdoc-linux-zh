    # DRIVE RELIABILITY IN THE REAL WORLD


    Donald Becker, the father of a large number of the Ethernet drivers in the Linux
    kernel and leader of the Beowulf project, had some interesting things to say about
    IDE drives during a talk about Beowulf clusters at the 1998 Atlanta Linux Showcase.
    In his experience, which includes large numbers of IDE drives running continuously
    for long periods of time, failures are unrelated to the MTBF statistics listed
    by the manufacturer.


    According to him, comes in either good batches or bad batches—i.e., different
    production runs, regardless of manufacturer, are a more important factor in drive
    reliability than the manufacturer. He went on to say that power consumption also
    seems to play a very important role in drive reliability, and that the lower the
    average power consumption, the more reliable the drive. (Power consumption is
    related to the spindle speed (RPM) and the mass of the platters themselves.)


    In case you wondering, a Beowulf cluster is a group of Linux machines networked
    to build a system capable of performing like a supercomputer. What stated as an
    experiment in the cost-efficiency of such a solution has been very useful, and
    there are now dozens of such clusters in use. See http://www.beowulf.org/ for
    more information.


    Partitioning Hard Drive Space is not a primary concern for most routers, and depends
    primarily on the amount of logging required. Most of my routers use a single 1GB
    or 2GB drive. If there is a second drive, it is a backup for the primary drive.
    Still, the question of how to partition drive space is a common one among those
    new to Linux and Unix. Although there are lots of opinions on this, each founded
    by its owner''s experience, my answer for routers with a single disk is simple.
    Assign 400–600MB for the root partition, between 64–128MB of swap space, and everything
    else to /var. This results in a partition table that looks like:


    | Device Bootflag | Mount point | Size (MB) | File System |

    | /dev/sda1 | / | 400 | ext2 (Linux native) |

    | /dev/sda2 | n/a | 64 | Linux swap |

    | /dev/sda3 | /var | all remaining | ext2 (Linux native) |


    There are several reasons to allocate space to /var, and if you use syslog to
    log remotely, you have enough space to log locally for cases when you need to
    do some serious debugging or packet capture.


    +   * All logging have enough space to log locally for cases when you need to
    do some serious debugging or packet capture.

    * Most package managers do all of their work in /var, using it for a cache of
    recently loaded packages. You''ll need some space here if you want to upgrade
    between releases.'
