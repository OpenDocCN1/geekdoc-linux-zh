  md: "# 4.1.7 A Dial-Out Script for Extranet\n\nNow that we know where erbium fits\
    \ into our network, we can start the configuration. So that we can connect on\
    \ the integration piece, let's assume that we already have PPP configurations\
    \ so that you can connect to our client(s). Furthermore, we'll take for granted\
    \ that we have worked out any required routing and masquerading statements. Now\
    \ we need a way to let our users start and stop these links.\n\nScripting dial-out\
    \ presented a few challenges. First, a lot of the documentation about pppd was\
    \ geared towards dial-in, and I couldn't find any documentation about dynamically\
    \ choosing from a pool of available modems for dial-out. After choosing a modem\
    \ and dialing the link, masquerading had to be configured on routes and added\
    \ to silicon. Finally, I wanted the script to be easy to use. For analog PPP dial-out,\
    \ the result was a single script with the following properties:\n\n+   1. A single\
    \ script without requiring the user to remember \"script of many names.\" The\
    \ script infers the action to options necessitated based on the name by which\
    \ it was invoked.\n\nThe usage is simple—either dial_client or hangup_client.\
    \ The code to accomplish this is:\n\n```\n#!/usr/bin/ksh\nprog=$(basename $0)\n\
    ACTION=$prog@*\nTARGET=$prog@#*\n# program name without a path component\n# get\
    \ the string up to the '_'\n# get the string past the '_'\n\ncase $ACTION in\n\
    \  dial)\n    pon $TARGET\n    ;\n  hangup)\n    poff $TARGET\n    ;\n```\n\n\
    > # a user intention should not be able to call this script such that\their intention\
    \ is not known - we control the arguments\necho \"something is wrong!\"\n\nesac\n\
    \nTo add links, simply create symbolic links or hard links back to the main script.\
    \ Having one script is useful when you want to make changes or add functions—for\
    \ example, to perform extra logging—everything is updated for all connections\
    \ simultaneously.\n\n+   2. Using more than one modem for dial-out is one of the\
    \ few options set in a pppd options. The device name listed in the file is the\
    \ one which will be used. To remedy this, the script went under the knife in to\
    \ take advantage of UUCP device-locking mechanisms. pppd and other well-mannered\
    \ applications which use the modem will write lockfiles to /var/lock/ as long\
    \ as you do not configure them not to."
  merge: -1
