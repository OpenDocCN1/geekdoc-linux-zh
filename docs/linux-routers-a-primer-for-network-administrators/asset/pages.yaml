    If you would like to use rinetd, it can be found at http://www.boutell.com/rinetd/.
    There is also a Debian package of the same name. The following is an excerpt from
    the manpage which provides a general synopsis.


    +   * rinetd redirects TCP connections from one IP address and to another. rinetd
    is a single-process server which handles any number of connections to the address/port
    pairs specified in the file /etc/rinetd.conf. Since rinetd runs as a single process
    using nonblocking I/O, it is able to redirect a large number of connections without
    a severe impact on the machine. This makes it practical to run services on machines
    inside an IP masquerading firewall.


    If none of the packages listed above fits your needs, you can allow your own.
    If the nifty-gritty network programming scares you, use one of the general-purpose
    socket utilities such as socket or netcat. They should be available anywhere,
    but if you have problems finding them, refer to the socket and nc Debian packages.
    The next section is about using the kernel to do some of the work of redirection,
    normally in conjunction with a user-space redirector.


    # 8.2.2 Transparent Proxy Support—Slight of Hand


    This form of redirection augments the kernel with the ability to redirect traffic
    encountered by the router to a local port. The redirection code is integrated
    with the firewalling code for input filters. With any other firewall rules, you
    can specify some packet-matching criteria, in addition to the local port to receive
    these packets. On any router located along the flow of traffic, you can take traffic
    headed for a particular host or subnet, from a particular subnet—anything which
    can be specified as an input firewall rule—and redirect it to a local port. A
    process server capable of dealing with the packet should be running on that port
    (otherwise the client will get a Connection refused message). This is depicted
    in Figure 8.2.


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_286_0.png)


    Figure 8.2 Kernel Redirection Using IP Transparent Proxy'
