    Deep down, every WAN administrator is a latent member of a private-Bandwidth Conservation
    Society—depending upon how you use the users'' cries for more bandwidth, sometimes
    a very active contributor. This section covers two things I did for the far side
    of california. The first of these is to deploy a DNS server for their site, and
    the second is an HTTP caching proxy. Both of these can be used to save bandwidth
    without modifying your users'' habits. (The best way to save bandwidth is to train
    your users to use it. It''s probably the toughest. Good luck...)


    # 7.2.1 DNS Server Deployment


    Name resolution is part of almost every network transaction conceivable, anywhere
    where IMHO remains widely misunderstood by users (and sometimes administrators
    too). For the administrator, the only excuse is ignorance. If you fall into this
    category, stop guessing and thoroughly read the manual for gethostbyname and whatever
    pages may refer you to. On any favor of Unix, this should get you on the right
    track to enlightenment.


    For the user, a DNS outage “the network''s slow today.” and DNS performance problems
    equate to “If you are lucky, the problem is a local configuration problem, such
    as a nonsensical search order, or a bogus DNS server entry. Oftentimes, however,
    poor performance is related to the time required for the DNS service to locate
    the requested information. The problem can be particularly acute for external
    (Internet) domains, where you have limited control over the latency and choice
    of server. The easiest way to alleviate the problem is to provide a caching DNS
    server close to the clients. (Any good ISP will do this; the lesser does not.)
    A properly configured DNS server can handle the load and any successful lookups
    it performs. In way, the only first time a name is resolved is expensive (until
    the TTL with the lookup expires). One reason that the emphasis is placed on the
    server is that most DNS clients do not cache anything. If you open three windows
    and use telnet foo in each of them, your machine will issue three DNS queries
    for the name foo, provided that it is not available in /etc/hosts or via some
    other mechanism. This is one of the reasons that you will see some popular web
    browsers start dns-helper processes, which basically act as caching resolvers.
    (Solaris even provides a daemon for this: nscd)


    > ¹ See the glossary.'
