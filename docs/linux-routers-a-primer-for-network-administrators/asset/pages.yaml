  md: '# 3.3.1 Packet-Matching Criteria


    You can specify the criteria to match just any part of the headers on an IP packet,
    the TCP or UDP headers, and combinations. They include:


    +   - source or destination IP address (or a range of IP addresses, specified
    in net-work/subnet mask notation)

    - source or destination port (or a list, or a range of ports)

    - protocol of TCP, UDP, ICMP or *all (all is the default when no protocol is listed)

    - physical interface used to send or receive the packet

    - status of the SYN and ACK bits. The significance of SYN=1 & ACK=0 is that this
    type of packet is the first packet used to establish a TCP/IP connection. If ACK
    is set (equal to 1), this packet is part of an established connection.


    # 3.3.2 Summary of IP Accounting Concepts


    Before we get into configuring IP accounting on silicon, let''s quickly summarize
    the concepts.


    +   - IP accounting is built into the Linux kernel. Because of this, there is
    no process which must be running to collect the statistics.

    - Counters may be incremented any time a packet traverses the networking stack.
    A counter is incremented depending upon whether or not the packet meets a set
    of criteria.

    - These criteria are called rules. Rules are specified by using a command-line
    interface which enters the rules into the running kernel. (There are other interfaces
    available for entering rules, but they are all based upon the command-line interface.)

    - Packets can be matched based on the contents of the TCP/IP protocol headers,
    such as source IP address and destination port.

    - The kernel code supports IP accounting changed between versions 2.0 and 2.2
    of the kernel. The old code used ipfwadm as its configuration tool; the new code
    uses ipchains.


    Compiling Support for IP Accounting into the 2.2.x Kernel The only additional
    option required to use IP accounting with the 2.2.x version of the kernel is to
    enable IP firewalling.


    ```

    Networking options -->

    + [* IP: IP firewalling

    ```


    # 3.3.3 Configuring IP Accounting Rules with ipchains


    If you are comfortable with ipfwadm, the flexibility of ipchains can take a bit
    of getting used to. It might help to think of ipfwadm as a subset of ipchains
    where there are only four chains (accounting, input, output, and forwarding),
    and these chains are always configured. Unlike with the 2.0 kernel, ipchains does
    not come'
