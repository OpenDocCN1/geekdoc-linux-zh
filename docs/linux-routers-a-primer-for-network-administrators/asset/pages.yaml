  md: 'Other than these general guidelines, I cannot tell you how to use rescue media
    to revive your fallen routers. There are simply too many variables to make an
    “if A, then do B” flowchart case. Fortunately, aside from the three “stupid admin
    tricks,” I have very little use for rescue media. Most situations can be handled
    more quickly by performing services elsewhere than by trying to repair a badly
    damaged system.


    # 8.6 SUMMARY


    This brings to close our chapter about routers that are more than just route.
    Some descriptions of firewalls depict them as non-routing dual-hosted hosts running
    proxy services. Others favor packet-filters, and still others NATs: A Linux system
    can be all of these simultaneously, if needed. Like the variety of emergency down
    situations you will encounter as a network admin, Linux, too, cannot be pigeon-holed
    into any single role. Hopefully, this chapter conveys the wide range of options
    you have when using Linux as a迫 component. Some of the topics covered were:


    +   - Different types of proxy services you can provide to your users, either
    to heighten security or to provide access for private IP addresses other than
    by masquerading.


    +   - Deploying Internet-accessible web servers using private address space, making
    use of port redirectors, such as rinet, just the kernel (AUTOFW), or a combination
    of the two (transparent proxying plus redir).


    +   - Publishing a single set of instructions while using firewall marks (FWMARK)
    to divert different classes of users to different services.


    +   - Dynamic routing daemons available for Linux.


    +   - Methods to keep your environment available, and what to do when you have
    system outages.'
