    # 3.2.1 Using IP Aliasing


    IP ali works by assigning additional virtual interface names to existing interfaces.

    IP aliases for a given interface are indicated by appending :N to the interface
    name.

    Thus, the syntax ethX:N is used to specify the aliased interface name, indicating
    that

    the virtual interface is part of physical interface ethX, where (0 ≤ N ≤ 9). You
    use

    config to create additional virtual interfaces. For example, to add a virtual
    interface

    to the real interface eth1, as in our example:


    ```

    silicon://root ifconfig eth0:0 192.168.20.1 netmask 255.255.255.0 \

    broadcast 192.168.20.255 up

    ```


    Check the interface with ifconfig just as you would any real physical interface.
    Note

