  md: '# Glossary


    335


    +   **netiquette** Standards of politeness when interacting with other **netizens**.
    This used to be quite a strong yet undocumented code, that has somehow fell by
    the way-side. You can often tell newbies by their (lack of) netiquette. A trivial
    example is having a *signature* longer than 80-character lines. A more serious
    example is flaming someone in a public forum (e.g., a Usenet newsgroup) without
    first discussing the matter with him or her via private email. Equally offensive
    is posting a private message to a newsgroup without the sender''s permission.


    +   **netizens** Others on the Internet.


    +   **NIC** Network Interface Card.


    +   **OSPF** Open Shortest Path First—a dynamic routing protocol (RFC 1131).


    +   **OTOH** On The Other Hand—whoops, I''m about to contradict myself.


    +   **PAP** Password Authentication Protocol—commonly used for PPP authentication
    mechanisms.


    +   **PCI** Peripheral Component Interconnect.


    +   **PCM** Pulse Code Modulation—a method used to convert an analog waveform
    to a series of digital pulses.


    +   **PIM** Protocol Independent Multicast—this multicast protocol is used widely
    because Cisco supports it. You need special software to use it (pim-v1); it comes
    in two flavors: PIMv1 and PIMv2.


    +   **POP** Point Of Presence—this term describes locations where service providers
    have installed equipment and are willing to let you connect to this equipment
    and their network either via a digital circuit or some form of dial-up. **POP**
    is also used for Post Office Protocol, as in POP3 for the third version of this
    protocol.


    +   **PPP** Point-to-Point Protocol (RFC 1661).


    +   **PPTP** Point to Tunnelling Protocol—a method of encapsulating IP packets
    within packets for security purpose (by encrypting the inner packet) or remote
    access (allowing the inner packets to have a source address on the destination
    network). Typically used for both simultaneously.


    +   **PTT** Post, Telegraph, and Telephone—a generic term referring to providers
    of telephony services.


    +   **PVC** Permanent Virtual Circuit.


    +   **RFC** Request For Comments.


    +   **RFC 1983** This RFC contains the *Internet Users’ Glossary*, which is a
    voluminous glossary of terms from an authoritative source.'
  merge: -1
  pgno: 358
- img_proc: true
  md: '# RIP Routing Information Protocol—a dynamic routing protocol (RFC 1058).


    RSN Real Soon Now—as, the time period a vendor promises to have a fix available.
    Typically meant sarcastically.


    RTFM Read The Darn Manual. As a newbie, you may feel like a lightning rod for
    this statement. Give it time...


    SCSI Small Computer System Interface.


    SLARP Serial Line Reverse Address Resolution Protocol.


    SMTP Mail Transport Protocol.


    SNMP Simple Network Management Protocol (RFC 1908) (plus RFC 1155, RFC 1156, RFC
    1157, and others).


    SNPP Simple Network Paging Protocol (RFC 1861).


    TCO Total Cost of Ownership. For any sort of computing solution, this includes
    not only the initial hardware and software costs, but also the ongoing maintenance
    and software license costs plus the time that be spent keeping the system running
    (e.g., a system that runs on freeware, requires 10–20 hours per month of system
    administration will eventually cost a company more than a solution that costs
    $10,000 out the box but needs 1/10th of the administration).


    TCP Transfer Control Protocol (RFC 675).


    TCP/IP A suite of protocols used over IP networks.


    TDM Time Division Multiplexing—the practice of dividing bandwidth of a channel
    into slots. Each times is in a frame, which can be allocated to different servers.
    The receiving side demultiplexes the signal back into (ACK!).


    TOS Type Of Service (RFC 1349)—a field in an IP packet header which indicates
    how network components should treat the packet if they are capable of providing
    different levels of service.


    TTL Time To Live—in the case of an IP packet, this is the additional number of
    hops the packet can take before it is discarded as undeliverable. This is done
    to prevent misconfigured routers from bringing the network to its knees by routing
    a packet in circles infinitely.


    UPS Uninterruptible Power Supply.


    user-space Refers to processes running on a Unix system, whether they are daemon
    or normal user processes, and regardless of the UID of the process. If you can
    see it with ps fax, then it''s a user-space process. See kernel-space.


    WRD Weighted Route Damping (an extension to BGP).


    YMMV Your Mileage May Vary—a disclaimer that states “this worked for me, but its
    applicability to your environment is not known, and therefore it may or may not
    work for you.”'
