  md: '# 5.4 Trouble-Shooting Frame Relay with WANPIPE


    +   Is there a network admin in another location performing maintenance? Sometimes
    you cannot determine whether the problem is in the provider''s network or on the
    other side—you will just be able to say for certain that it is not between you
    and the provider''s POP for your location. In this case, check with your counterpart
    in the remote location, use analog dial-in to check the status of your router.
    (If you immediately open a ticket with your provider and release the circuit for
    testing, your provider may bring the circuit down as part of his problem determination
    procedure. If it turns out that the problem is on the other end of the link and
    could be quickly resolved, you have, in effect, created two outages from one.)


    +   Have you recently made changes to wanpipeN.conf or upgraded the WANPIPE software?
    Is this the first time that you have restarted WANPIPE either of those activities?


    +   Have you (very) recently added another device to the system? A second S508
    card (without remembering to change the base address?) An ISA card that wants
    the IRQ of your WANPIPE card? An PnP device? Should there be a message about Interrupt
    Passed in /var/log/messages—otherwise, you probably have an interrupt conflict.


    +   Is your system otherwise sick? Out of disk space? Did the kernel panic? (Word
    to the wise: If you have panics that make sense whatsoever, fall back to a kernel
    that you know have worked in the past. If that doesn''t help, change out all of
    the metric in the system.)


    +   But not least, the dreaded: Did you check the cables? Unfortunately, this
    is often the case for server rooms and and telecom closets which experience a
    lot of foot traffic.


    O.K., I admit that none of those was rocket science, but you have to start somewhere.
    Spending a few seconds reflecting upon what changes you might have recently made
    to the system and performing a quick sanity check can save much time barking up
    the wrong tree. The fact is, once your Linux/WANPIPE router is up and running,
    there are very few things to trouble-shoot with the router configuration itself..
    Now we move to the next potential point of failure: the digital circuit between
    you and the POP.


    # 5.4.2 Frame Relay Trouble-Shooting—Access Problems


    Without the loop (so aptly known as access) functioning properly, you are not
    going to be able to get your traffic to your provider and into the cloud. Access
    is simple and tricky at the same time. While it may be easy enough to access problems,
    it can take a while to get them solved. For one, they are telco circuits, so you
    are at the mercy of your local access provider. The issue is more complicated
    when your Frame Relay provider does not provide the access circuit. In that situation,
    your Frame Relay provider leaves the last mile from the local access provider,
    which makes your Frame Relay provider the customer as far as the local access
    provider is'
