    ```

    ### after eth0 has been configured

    silicon://root> route -n

    Kernel IP routing table

    Destination     Gateway         Genmask         Flags Metric Ref      Use Iface

    192.168.16.0    0.0.0.0         255.255.255     U       0       0       0 eth0

    127.0.0.1       0.0.0.0         255.255.255     U       0       0       24 lo

    ```


    > Starting with version 2.2 of the kernel.'
