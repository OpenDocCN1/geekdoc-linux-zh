    \ -j ACCEPT -p tcp -i eth1 \\\n      -d 192.168.20.0/24\n### (5)\n### allow the\
    \ perimeter net to send to the inside\n### when responding to TCP connections\n\
    oxygen:root> ipchains -A forward -j ACCEPT ! -y -p tcp -i eth0 \\\n      -s 192.168.20.0/24\n\
    \      -d 192.168.16.0/24\n### (6)\n### allow the perimeter net to forward to\
    \ the outside\noxygen:root> ipchains -A forward -j ACCEPT -i sppp0 \\\n      -s\
    \ 192.168.20.0/24\n```\n\n+   1. **Rule initializes us in a known state.** All\
    \ rules in the **forward** are flushed.\n2. **Configure the default policy for\
    \ forwarded packets to `REJECT`.**\n3. **Prohibit any direct communication between\
    \ the inside and the outside.** The forwarding rules will be executed in order\
    \ until a match occurs, even though the default policy already excludes this communication,\
    \ a misplaced rule could “open up” the firewall again.\n4. **Allow both the inside\
    \ and the outside to send TCP packets (from any port to any port) to the perimeter\
    \ net.** This gives the inside access to the proxies and allows the outside to\
    \ deliver mail, etc.\n5. **Allow the perimeter net to respond to TCP connections\
    \ when talking to the inside.**n6. **Allow the perimeter net to send freely to\
    \ the outside.** Note that this doesn't mean that everything can be answered.\
    \ In other words, you're not done yet. Although you can send out all protocols,\
    \ only TCP replies will be forwarded back to the perimeter net (as per rule #4)."
