    physical protocol — the protocol (normally electrical or optical) which runs on
    the physical medium. RS-232 is an example for a serial cable, or IEEE 802.3 for
    Ethernet.


    link-layer protocol — the protocol used to negotiate a connection (or a link)
    between two machines sharing the same physical medium. Examples are PPP, HDLC,
    Frame Relay, and Ethernet. The link-layer does not dictate which protocol you
    run on top of, but it does need to know how to operate. This is why you might
    find different PPP implementations for IP and IPX.


    networking protocol — the protocol which addresses routing of nodes and packets,
    and the way that packets are routed between endpoints. Examples are IP and IPX.


    transport protocol — the protocol which interfaces the networking protocol to
    the operating system and processes within it (also known as end-to-end protocol).
    In case of TCP/IP, there are multiple protocols which comprise the protocol suite
    —namely, TCP and UDP.


