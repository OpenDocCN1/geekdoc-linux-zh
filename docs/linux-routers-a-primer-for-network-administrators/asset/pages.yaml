  md: '# 4.2 IP Masquerading Concepts


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_122_0.png)


    Figure 4.3 IP Forwarding and Masquerading over Ethernet


    # 4.2.2 Protocol-Specific Masquerading


    You can fool some of the packets some of the time, but you can''t fool all of
    the packets all the time. The example presented above represents one class of
    TCP/IP connection: a TCP stream. What about masquerading UDP and ICMP? As they
    are well-mannered, the IP masquerading code in /net/ipv4/ip_masq.c handles all
    three without any additional configuration. What do we mean by well-mannered?
    IP masquerading works "out of the box" for all TCP and UDP-based applications
    based on a single fixed server port or client where the machine being masqueraded
    (the client is the initiator of the connection).


    How does this get you? It handles telnet, ssh, login, HTTP, pings (ICMP) and traceroutes
    (a combination of ICMP and UDP), DNS (often UDP, but can be TCP), NNTP, and many
    others. But, as you already know, it''s what doesn''t work that people notice.
    The first notable exception is FTP. FTP likes to open connections from the server
    back to the client, contrary to the direction you are trying masquerade (and/firewall).


    To handle a case like this, the masquerading code needs to understand something
    about the application protocol so that it can watch for the beginning of a transfer
    and know to connect the inbound socket to the client, not to the router. Remember,
    the process running on the client is expecting that inbound connection, not the
    router. To make things even complicated, the FTP protocol also has a passive mode
    in which this inbound connection does not occur. The client and server negotiate
    a new pair of ports and use these to build a stream connection for the data transmission.


    The Linux kernels weren''t satisfied with IP masquerading without FTP, so they
    added Protocol-specific masquerading support. Code, in the form of modules, can
    be loaded into the running kernel to provide masquerading for the less well-behaved
    protocols. These modules are automatically built when you select IP: masquerading
    during kernel configuration—all you have to do is load them. Pretty spiffy, eh?
    The list of modules and protocols supported includes, but is not limited to:'
  merge: -1
  pgno: 122
