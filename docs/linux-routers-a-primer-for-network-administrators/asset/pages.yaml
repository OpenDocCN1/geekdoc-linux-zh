  md: '# Preface


    This book is the culmination of over two years of dodging the obvious: I needed
    to write a HOWTO to document the things that I was using Linux for my work, particularly
    concerning the use of Linux as a router in a variety of scenarios. But the book
    is not only about routers, it''s about running Linux in production and all of
    the non-technical details which go along with it. This book is not intended to
    be the authoritative “be-all end-all” of what can be accomplished with Linux routers,
    but a HOWTO describing what has worked for me and my employers over the past few
    years. I have to record all of the stupid mistakes I have made along with the
    arbitrary parts of configuring and running a Linux router so that you won''t have
    to learn them on your own. I fully expect you to far exceed the contents of this
    book as you further the state of the art.


    # ACKNOWLEDGMENTS


    I had the opportunity to hear Richard Stallman speak in 1998 about the Free Software
    Foundation and the work he has done to develop, support, and promote the GPL.
    I found his task very inspiring, and although this book is not released under
    the GPL, it is nevertheless inspired by, and possible because of, the work of
    Richard Stallman, Linux Torvalds, and the GNU/Linux community at large.


    Specifically, I would like to thank the technical reviewers Todd O’Boyle, Tom
    Daniels, Mark Thomas, Radia Perlman, and David Mandelstam for working through
    the manuscript repeatedly and for setting me straight on technical inaccuracies.
    Radia Perlman gets double thanks, along with Jim Markham, for the selfless job
    of helping me improve my writing. Mary Franz and David Mandelstam (again) are
    for being constant sources of encouragement and putting the idea of a book in
    my head in the first place. Last, and certainly not least, thanks to Melissa,
    Java, and Grommit for support and dealing with my weird writing schedule and moodiness
    due to sleep deprivation.'
  merge: -1
  pgno: 14
