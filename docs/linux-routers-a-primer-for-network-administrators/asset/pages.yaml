    # Controlling How tcpdump Formats Its Output


    +   - extend the output to include the link-layer headers for each line of output.
    (You can also remember this by thinking of ethernet headers).

    -n no name resolution of IP addresses or service names (ports). This can save
    a lot of time, especially when running tcpdump with output going to stdout.

    -N do not print FQDNs (Fully Qualified Domain Names), but instead print only the
    hostname alone. Obviously, this makes no sense if you have specified -n.

    -q a less verbose mode of output. This skips the sequence numbers and a lot of
    the protocol flags. The output (when used with -n) will fit nicely in an 80-column
    terminal window.

    -S print absolute sequence numbers, which might be useful for calculating packet
    counts during a given session.

    -t do not generate a timestamp on each line.

