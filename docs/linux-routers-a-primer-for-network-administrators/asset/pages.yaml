    \ your chains. This means that\nan packet which traverses the input and output\
    \ chains (by definition, all packets)\nmust traverse these will also be forwarded\
    \ down (or visible) to our user-defined\nchains.\n\nHere is a list of ways in\
    \ which you can manipulate chains:\n\n+   - ipchains -N mychain creates a named\
    \ mychain.\n- ipchains -X mychain deletes a named mychain. mychain must not be\n\
    referenced by (the target of) another rule.\n- ipchains -F mychain deletes all\
    \ rules on the chain named mychain.\n- ipchains -L mychain lists all rules on\
