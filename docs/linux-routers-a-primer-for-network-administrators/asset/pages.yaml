  md: '# Linux WAN Adapters


    +   * A PVC builds a path through your provider''s network (the cloud) between
    two nodes.

    * A PVC has a CIR associated with it. CIRs may be used to discard data being sent
    over the PVC when it exceeds predefined bandwidth limitations.

    * CIRs are directional. If your provider indicates they are not, ask whether 64kbps
    CIR is 64kbps in each direction, or 32kbps in each direction. Different providers
    sell differently.

    * A PVC with the same CIR in each direction is said to have a symmetrical CIR.
    An asymmetrical CIR has a different data rate in each direction. This can be useful
    for sites that pull more traffic than they push, as is the case for sites which
    do a lot of Internet browsing.

    * A node can burst at the port speed.

    * A node is oversubscribed if it cannot satisfy the potential bandwidth requirements
    of the nodes attached to.


    For those of you who like to know more about Frame Relay, there are numerous tutorials
    available on the Web. As a starting point, visit http://frforum.com/, an association
    of associated commercial merchants who have an interest in promoting Frame Relay.
    They have a document for download The Basic Guide to Frame Relay Networking. The
    86-page document of general information is a bit cutest, but useful nonetheless.


    # 5.2 LINUX WAN ADAPTERS


    For our purposes, a WAN adapter is an add-on that is essentially the equivalent
    of an "async" port on a traditional router. These cards support WAN protocols
    such as Frame Relay, synchronous PPP, X.25, Bisync, HSSI, and others. They typically
    have their own processor to run the link-layer protocol on the card. This offloads
    this task from your system''s CPU and simplifies the device drivers needed. The
    card has a decoded frame available for the operating system, it triggers it via
    an interrupt and passes it to the device driver in the same way as an Ethernet
    card. These WAN adapters connect to the outside world through a high-speed serial
    port (V35 or RS-232), suitable to connecting a CSU/DSU and then to a digital telecom
    access circuit. Some cards are available with an integrated CSU/DSU so they can
    be connected directly to a digital access circuit. The cards available now have
    between one and four ports and support from 56kbps to 52Mbps.


    Interfaces of this type offer several advantages over a simple data pump or modem.
    The first I''ve already mentioned: Since the link-layer protocol is executed on
    the card itself, the host processor is free to do other things. (Because of this,
    zinc was able to handle a T1 running Frame Relay on 66MHz 486-based system). Second,
    the code run is stored on an EEPROM or similar device which is downloaded to the
    card when it is initialized. The upside of this is that the link-layer protocol
    can be changed or upgraded simply by re-initializing the adapter with new firmware
    (and take effect without ever rebooting the router). Finally, in an emergency,
    almost anything can host these adapters, even your workstation.'
