    after that is similar. But to illustrate how the LRP packages (the .lrp files)
    work, we will assemble our modules.lrp on our workstation and transfer it to the
    LRP root disk. By knowing how to take apart the LRP packages, you can do any of
    the configuration of your own workstation. The basic steps are:


    +   1. Use superformat and mformat to prepare your LRP root floppy. Mount it on
    your workstation with mount -t mdos /dev/fd0 /floppy.

    2. Using the LRP tree you retrieved earlier, cd $LRP ; cp base*/ /floppy ; cp
    boot*/ /floppy. The base/ directory includes the files you need for a minimal
    LRP system. The boot/ contains the files needed for syslinux.

    3. Copy your kernel to the LRP root disk. Depending on the version of LRP you
    are using, there may be different kernels. The kernel images are in $LRP/kernel/2.036pre15-1.tar.gz
    Extract this archive, and copy the image to the floppy disk, making sure to name
    it linux on that filesystem. For example:


    ```

    $ cd $LRP/kernel

    $ tar xvzf 2.036pre15-1.tar.gz

    $ cd 2.036pre15-1

    $ cp 2.036pre15-1-LRP-zImage /floppy/linux

    ```


