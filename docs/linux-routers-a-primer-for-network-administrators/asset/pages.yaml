    down, you normally have to contact your Frame Relay provider, wait for him to
    go through his preliminary testing, and have him call the access provider. The
    problem can exist the other way around, too. In either case, all of this time,
    during which you have a link down. Ways to detect access problems:


    +   - Does fpipemon -i interface -u 9000 -c xm show the circuit up? (Note: interface
    is either the name of the interface of the IP address or the IP address of the
    other end of the point-to-point link.) Good output looks like that.


