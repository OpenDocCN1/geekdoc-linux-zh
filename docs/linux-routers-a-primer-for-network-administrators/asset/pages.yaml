  md: '# 246 Californium—Satellite Office Router Chap. 7


    advanced by the diligent few. There are getys available now which can handle dial-up
    (with ringback), virtual consoles, fax, and voicemail. If you intend to dial into
    your system, you will probably want to exchange the system''s default getty with
    one more sporting features.


    # HINT: GETTY IS SPAWNED FROM init


    > If you are not used to working with getty, you need to know that they are not
    started where most of your system services are started—that is, they do not start
    as standalone daemons out of /etc/init.d/startup scripts or via inetd. They are
    started by init, which reads its configuration out of initab. If you look at initab,
    you will see it has four colon-delimited fields: <id>runlevels:<action:<process>.
    When you add lines for the dial-in getty, select a unique <id>, choose the runlevels
    in which it should run (probably two and three), and configure it with an action
    of spawn (so that the process is restarted once it dies and exits). The field
    contains the program to execute along with any options. Therefore, it depends
    upon the getty, and should be described in the getty''s documentation.

    to init to reread the contents of initab, use the command:

    telinit q


    # Linux Getty Replacements


    +   * getty_ps—The getty package contains two versions of a serial capty. The
    first is gettyps, and the second is uugetys. You should use the latter, as it
    supports UUCP-cycle lockfiles for serial devices. This is important if you want
    to be able to use the same modem for dial-out. In this configuration, you are
    able to use a single modem for dial-in (in a support scenario) and automatic dial-out
    (in a failcare scenario). getty.ps is available in the Debian package named gettyps
    or from Sunsite. There is ample documentation included with the package to get
    things running.

    * mgetty another full-featured getty replacement that even comes preconfigured
    to allow dial-up from PAP clients. The source is available at


    ftp://alpha.greenie.net/pub/mgetty/source/

    or you can load the Debian package mgetty. There are also add-on Debian packages
    available, getty-voice (voicemail support) and mgetty-fax.

    * mingetty is not for use with modems or serial lines. It is only for running
    your console from virtual consoles, which is sufficient for most applications
    where the console is not on a serial port. It is a lightweight alternative to
    the default getty shipped with many distributions.

    * fbgetty is also not useful for modems, but it can be used with frame-buffer
    consoles. The Debian package is fbgetty; the upstream source is


    http://www.multimania.com/lch/fbgetty.'
