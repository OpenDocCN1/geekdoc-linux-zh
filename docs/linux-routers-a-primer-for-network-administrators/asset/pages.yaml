  md: '[ expression ]—is an expression used to limit the scope of the patterns matched
    by tcpdump. By default, all packets are displayed. The format is known as the
    "Berkeley packet filter expression" format. Although it is different from the
    filtering expressions you use with ipfwadm and ipchains, and different from the
    filtering expressions you have to learn if you want to dial or sniff; this one
    is very intuitive and used by several popular sniffers. Expressions look like
    English phrases in many languages.


    The syntax is one or more primitives, combined by and, or, and not, which are
    also known by &&, ||, and ! Primitives are grouped using parentheses, but when
    you do this, you will need to quote or otherwise escape the ( and prevent the
    shell from misinterpreting them. So you can do things like $p_1\&(p_2)$. But what
    exactly is a primitive? It consists of an identifier, potentially preceded by
    a qualifier. And this is where it gets complicated... The authoritative source
    on this subject is the manage and whatever works for you on the command-line.
    A synopsis is provided below:


    # Berkeley Packet Filter qualifiers


    type—specifies the type of the identifier. It can have the values of host, net,
    or port, with host being assumed.


    direction—is one of src or dst, for the default (when no direction is specified)
    being src or dst, which is both for ipfwadm. Therefore


    ```

    tcpdump -n i eth0 src or dst port 110

    tcpdump -n i eth0 port 110

    ```


    are equivalent. Keep in mind that src and dst do not apply to just IP headers.
    They can also apply to other protocols, such as ether (and thereby indicate a
    source or destination Ethernet address).


    protocol—is one of ether, fddi, ip, arp, rarp, decnet, lat, sca, mopc, mopdl,
    tcp, and typically to use tcp and udp, and if I''m feeling a little fuzzy I might
    use arp or ether. Of course, your needs will guide you to the protocols you need
    to sniff. If you do not specify a protocol, then any protocol type which senses
    for the identifier will match. Therefore, if you specify only a port, then both
    tcp and udp protocols are implied.


    # Types of Berkeley Packet Filter identifiers


    host host—indicates the IP address of host. Qualifiers that make sense with this
    are src and dst—remember that the default means that host can be either the source
    or the destination. host can also be a DNS name which resolves to multiple IP
    addresses, in which case all of them will match. Note that host is the keyword
    and is the value of the identifier.


    ether host—indicates an Ethernet address. Once again, ether host is the keyword
    and ether is either a 6-byte Ethernet (MAC) address in the format xx:xx:xx:xx:xx:xx,
    or a name from /etc/ethers. The dst and src qualifiers apply as you do for a host.'
