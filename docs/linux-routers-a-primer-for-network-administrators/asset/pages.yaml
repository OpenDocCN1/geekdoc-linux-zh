    # 8.1.3 A SOCKS Server


    Another way to approach proxies is to use a SOCKS server. Unlike other proxy mechanisms,
    SOCKS does not try to make the presence of the proxy server transparent to the
    user. To use the proxy, you need SOCKS-capable (or SOCKSified) clients. In other
    words, you cannot use a standard telnet client to connect to the SOCKS proxy server
    and continue out to your Internet destination. This is not as bad as it sounds,
    many popular clients have SOCKS support built into them, including browsers and
    most modern Internet clients (e.g., IOC, IRC, FTP GUIs, etc.). On the command
    line, use one of the clients, such as telnet, rftp, finger, and rwho. There is
    library support for building your own clients on a variety of platforms.


    The need for special clients can be viewed in a positive light, as it requires
    your users to understand the difference between connecting to an internal machine
    directly and using resources on the Internet. In the case of command-line clients,
    you can hide this by aliasing the SOCKSified clients to the names of the standard
    clients and configuring the location about the SOCKS server(s) in /etc/socks.conf.
    The SOCKS clients will revert to direct (normal) connections for their application
    protocol if no SOCKS server is available for the service you are using. You can
    also use the runsocks scripts (available for both SOCKS V4 and V5—part of the
    socks4-clients Debian package). The description below is taken from the manpage
    for the Linux version of runsocks:


    > ² http://caristudenti.cs.unibo.it/~borgia/homepage/Software/Software.html'
