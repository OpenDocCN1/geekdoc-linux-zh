  md: '# 174        Oxygen—Internet Router Chap. 6


    “outside"

    (the Internet)


    “inside"

    local LAN


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_197_0.png)


    Figure 6.2 Combination Firewall/Router with Perimeter Net


    Maybe this isn’t as bad as it sounds after all. Linux boxes are great at doing
    things at once. If a system is compromised, you can configure another system to
    act until you get back online. In the not-so-bad case, you can spend some time
    before configuring packet-filtering rules on the Router itself. Remember that
    the distinction between firewall and Internet router is more for the users and
    network diagrams than a statement about which systems have security measures installed.
    Your Internet router has strict policies, just like your firewall; they simply
    have different policies.


    **Combination Firewall and Internet Router** Another way of having a perimeter
    net, without having a separate firewall is to use a topology like that in Figure
    6.2. This results in one less system to maintain and protect, but is more demanding
    in terms of configuration. To make this configuration work, you will definitely
    want to use both **forwarding** and **input/output** firewalling rules to control
    the flow of traffic through your firewall. This sort of configuration is complicated,
    so you should test it thoroughly after you’re up and running from a shell account
    on the outside, or by using a security tool as *Firewalk* or *Satan*.


    If you do not have the need for a perimeter net and want to run your site with
    a single Internet router, you have something that looks like Figure 6.3, which
    is a degenerate case of the previous example. Because you do not have to control
