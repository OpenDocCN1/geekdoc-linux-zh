    8. Once the gateway receives the packet, it checks the packet''s destination and
    sees that the packet must be sent to machine B, for your (the reader''s) sake,
    is on an Ethernet segment directly connected to another interface on the gateway.


    9. The gateway must perform an ARP request (on the other interface) to learn machine
    B''s Ethernet address so that the packet can be forwarded.


    10. Machine B performs the same process in reverse to send to machine A, except
    that B already knows the IP address of machine A and the Ethernet address of the
    gateway.


