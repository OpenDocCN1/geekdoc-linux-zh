    # 2.1.2 Workstations—To Gateway or Not to Gateway


    Every machine on your network with a TCP/IP stack has a configuration setting
    for gateway. This is so that it can reach IP networks other than its own. When
    it detects that the destination is part a remote network, it sends the packet
    to the gateway for forwarding. For destinations in the same subnet, it will send
    the packet to the other machine. How does a workstation determine if a destination
    is part of the same or a different IP network?

    First it ANDs the destination of the packet with its subnet mask. If the resulting
    address matches its own network mask, then the destination is in the same subnet,
    and the TCP/IP stack tells the card to send the packet directly to the destination
    machine. (Actually, more this occurs in order to send the packet directly, but
    but Ethernet. This is covered in Section 2.2.) If however, the calculation shows
    that the destination is part of another network, then the sender makes use of
    its gateway to transmit the packet. In effect, the sender is saying, “I do not
    know how to deliver this packet; can you deliver it for me?” The gateway accepts
    the packet and then goes through a similar procedure. (That procedure is known
    as routing, and there will be plenty more about it.) Here'
