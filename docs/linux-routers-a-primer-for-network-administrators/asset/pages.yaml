    HINT: WHAT PACKAGES ARE LOADED ON MY DEBIAN SYSTEM?


    > To determine what packages are loaded on your Debian system, use dpkg -1

    to generate a listing of all packages loaded. dpkg also can take a package

    name as an argument to limit the search to a particular package name, e.g.,

    dpkg -1 bin86, to find out the bin86 package is loaded on your system.


    One nice thing about the kernel build is that you do not have to fully understand

    how to use these tools—the commands to invoke them have been scripted for you.


    # B.1 Retrieving the Kernel Sources


    The first time, you will need to retrieve a full set of kernel sources. These
    may be

    packages which are part of your Linux distribution. If this is the case, feel
    free to use

    them instead. I normally go to the nearest mirror of ftp://ftp.kernel.org and
    retrieve

    the latest stable linux-w .x .y.tar.gz or .tar.bz2.


    Keep in mind that the stable versions of the Linux kernel have minor release

    numbers that are even (e.g., 2.0.x and 2.2.x) and the unstable/development versions

    have odd minor release numbers (e.g., 2.1.x and 2.3.x). Stick to stable versions
    of the

    kernel if at all possible. In fact, you may not even use the most recent major
    version.'
