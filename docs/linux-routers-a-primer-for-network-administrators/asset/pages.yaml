- img_proc: true
  md: '# Introduction


    Router configuration has long been an arcane art possessed by the few (and the
    lucky—at least in the eyes of the interested yet unchosen). One reason for this
    is that routers were expensive, and required specialized training. They used to
    be a couple of bookstores. They were also the sort of equipment that was found
    only in small numbers in larger companies. Unix, while not quite as inaccessible
    in terms of cost, has also frequently been considered a black art for the few.
    Linux, of course, has turned all of this on its ear and delivered a GNU operating
    system to the masses. Used to be a couple bookstores in a big city with a decent
    selection of Unix books. Now every mall bookstore has a Unix/Linux section.


    Interestingly (but not surprisingly), Linux delivers a router platform accessible
    by the many, as easily as it has resrected the word "Unix.\ Although "traditional"
    routers are special-purpose hardware running embedded real-time operating systems,
    there has always been a group using Unix-based operating systems on general-purpose
    hardware. Linux has helped expand this group immensely by providing a full-featured
    and robust TCP/IP stack and hundreds of drivers—all of which run on commonly available
    computing hardware. Another important factor is the GNU/Linux community''s basic
    tenet of sharing ideas and knowledge instead of hoarding them. The truly amazing
    part is that all of this is available without expensive licensing costs or non-disclosure
    agreements. With good tools and some-how, anyone can build an inexpensive, stable
    router platform capable of performing a variety of functions within any organization.


    > GNU is Not Unix," although it is more Unix than anything else that claims to
    be. The complete text of the GNU General Public License appears in Appendix E.'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'xiv


    Introduction


    If you''re asking yourself, What''s a router?, do not despair! This book will
    try to cover most topics in enough depth and with enough references that you will
    not be left stump. If it fails to do this, please let me know. Traditionally,
    a router is defined as a layer 3 switch. That is, it looks at the layer 3 packet
    headers and decides where to forward them. (Layer 3 refers to the OSI "network"
    layer.) For TCP/IP networks, the router examines the IP headers to determine the
    destination IP address of the packet, the TTL (Time To Live), among other things.
    In this strict definition, the type of packet—TCP, UDP, ICMP, etc.—is immaterial.
    However, routers have evolved beyond this function and can now take into account
    the layer 4 (transport layer) headers when deciding what to do with a packet.
    Some other things do so:


    +   * Transfer traffic between two different types of physical networks. An example
    of this is forwarding packets from Ethernet to Frame Relay and vice-versa, as
    is done by a WAN router.


    +   * Restrict the flow of traffic to/from certain addresses or networks. This
    is commonly known as packet-filtering. Often, the router will examine more than
    just the IP headers for making decisions. TCP and UDP headers other layer 4+ packet
    fields, are fair game.


    +   * Rewrite source addresses so traffic appears to originate for an address
    other than the original sender. Under Linux, this is known as masquerading, and
    the router acts as a NAT (Network Address Translator). The task includes unmasquering
    replies flowing in the other direction.


    +   * Act as a BOOTP or DHCP server serving IP addresses and other configuration
    parameters for workstations on your network. Throughout this book, we will use
    Linux routers to do much more than this.


    The focus of this book is admittedly not on definitions, but on how to accomplish
    (or at least get started on) a certain task. You may find that the correct technical
    definition for something is not the same as successfully configuring and administering
    it in a production environment. If you are just started as a network administrator,
    be confident that a lot of technical know-how can be only learned through experience
    (a.k.a. the "hard way"). Do not be intimidated by the lack of a formal body of
    knowledge; just admit when you don''t know the answer and strive to figure it
    out.


    # 0.1 From Where Linux?


    The progress on operating systems implementation has been much more dramatic during
    the 1990s, thanks to Linux. If you are interested in the "early" history of Linux
    and can stomach discussions of OS design, you should check out the following:


    +   * http://www.educ.umu.se/~bjorn/mhonarc-files/obsolete/ This is a flame-war
    between Linux Torvalds and Andy Tannenbaum, a well-established researcher, professor,
    father of MINIX, and other (OS) design folks.


    +   * http://www.educ.umu.se/~bjorn/linux/linux-history.html This is a collection
    of Linux-relevant postings made to comp.os.minix about building an.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'The way I understand the early history of Linux, it boils down to this: Linux
    Torvalds had an Intel 8086-based PC and some free time. He set out to write an
    operating system that could capitalize on the new features of this processor,
    ignoring backwards compatibility with the 8088 and the 8026. (Other operating
    systems of that era were struggling with some design trade-offs that were imposed
    by the limitations of the predecessors of the 386. In all fairness, they did to
    maintain backwards compatibility with software written to run on them.)


    Another incentive for using OS from scratch was to take advantage of the large
    body of excellent “free” software developed by the Free Software Foundation. It
    is the (first) connection between Linux and Richard Stallman, who founded the
    GNU project in 1984 and has lent both philosophy and code to the effort. The system
    software which used Linux for his kernel is commonly known as the GNU toolet.
    These tools include most of what is commonly thought of as standard “Unix” system
    tools. This collection of software had the tremendous advantage of being available
    in source code and being delivered with a license that allowed Linux developers
    to modify and redistribute it.


    In the early 1990s, the Internet crossed over from being an academic/scientific
    medium ever available to the general public. The ability to communicate, collaborate,
    share, discuss, and debate has never been available to such a large percentage
    of the world''s population. Why If Linux Torvalds conceived Linux, and spent a
    while in the “womb” of academia, then the Internet is its home—where it will grow,
    and mature. But it has become more than a user of the Internet; it has become
    part of it, and is now being used to propagate itself.


    # 0.2 WHY A LINUX ROUTER?


    At this point, you may be thinking that this is all well and good and apropos
    in some sort of cosmic sense—the child has grown up to take care of the parent,
    etc., and so on—but what makes a Linux router better or different than others?
    As with most interesting questions, the answer is: “it depends.” Primarily, it
    depends upon your definition of “better” is.


    +   - Linux routers are inexpensive. For $500 plus a meagerly equipped PC, you
    have a WAN-router capable of running several different protocols at T1 (1.5MBPS)
    speeds and higher. For a bit more, you can route multiple T3s. License costs are
    nil. Ongoing maintenance costs are typically nil. Linux runs on the widely supported
    hardware available.

    - Linux routers are flexible. Try running a copy of Apache (the world’s most popular
    HTTP daemon) on a “traditional” router, or integrating a “traditional” router
    into your in-house developed security infrastructure. At best, you will pay your
    router vendors handsomely for the privilege of letting them port your code to
    their systems. Otherwise, you are probably out of luck.


    > Remember, “GNU’s Not Unix.”'
  merge: -1
  pgno: 18
- img_proc: true
  md: '• Linux routers are stable. Whereas the TCP/IP implementation of others has
    been reviewed by, at most, a few hundred capable programmers, Linux''s TCP/IP
    stack has been reviewed by literally thousands. More importantly, because Linux
    is a “labor of love” for most of its contributors, its quality is based on pride
    and technical excellence, not hampered by deadlines and office policies.


    • Linux routers are easy to administer. If you can navigate a shell (you can pick
    the shell of your choice), you have already completed one of your router training.
    With other solutions, you need to learn a new command-environment and set of tools.
    Linux is the same whether it''s acting as a web server, workstation, or router.


    • Linux routers are based on proven, widely-available technology. Because the
    system hardware and adapters are being produced for such enormous market, costs
    are low and time-to-market cycles are as short as possible.


    • Linux routers provide investment protection beyond of their “traditional” counterparts.
    If you''ve worked in computer support for any length of time, you''ve probably
    experienced a vendor discontinuing a product line, phasing out support for a particular
    version, not adding features that you desperately need, or simply not responding
    to bug reports. With Linux, there is no vendor who can strong-arm you into accepting
