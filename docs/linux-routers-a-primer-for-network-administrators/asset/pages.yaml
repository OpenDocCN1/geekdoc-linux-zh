    # 1.2 THE ENVIRONMENT AROUND YOUR ROUTER


    Now we will step back and not look at the router itself, but at some of the elements
    that surround the router. This encompasses not only the physical surroundings,
    but also procedures and policies.


    # 1.2.1 Power Source


    You should have a good, stable source of grounded power. A UPS is an important
    investment towards keeping your system up and protected from power outages, brownouts,
    lightning strikes, and other dangers to electronics. Several major UPS vendors
    provide Linux versions of their software, so you should do some research before
    you purchase one.


    # 1.2.2 Physical Installation


    With any other production system, your router(s) should be in an area which can
    be physically secured (i.e., locked), is temperature-regulated, and is low-traffic.
    (By “low-traffic” I mean a place where people are seldom to be found.) You should
    use either a rack or a cabinet to house the system, if possible, but make sure
    that there is adequate airflow around the case. It may sound redundant, but a
    neat installation is less likely to be accidentally taken offline by a clumsy
    mistake. (People are also likely to be inclined to touch or disturb a neat installation.)'
