    \ caches the value for future reference.\n\n```\n// /etc/named.conf\n// \"forward\
    \ only\" indicates that we are a slave\n// \"forwarders\" are DNS servers in the\
    \ \"know\"\noptions {\n    directory \"/var/named\";\n    forward only;\n    forwarders\
    \ {\n        192.168.16.1;\n        192.168.18.2;\n    };\n    \n// local zone\
    \ information\nzone \"localhost\" {\n    type master;\n    file \"named.local\"\
    ;\n};\nnzone \"127.in-addr.arpa\" {\n    type master;\n    file \"named.rev-local\"\
    ;\n}\n```\n\nAfter you reload named (with /etc/init.d/bind reload), you should\
    \ update your DHCP configuration to reflect the new DNS server. For added protection\
    \ against failures, configure your clients to use one of the forwarders as their\
    \ secondary DNS server. (Make sure to list the DNS server first because it is\
    \ your clients' first preference.) Assuming a 30–100ms response time for DNS queries\
    \ over the WAN, your users should see a noticeable improvement.\n\n# 7.2.2 Caching\
