  md: '# Silicon—LAN Router


    "Silicon" is the name of one of the busiest and heavily used systems I have ever
    administered. As the main LAN router and the primary internal DNS server, this
    system is involved with almost every action that a user can perform with a networked
    computer. If you wonder almost how someone comes across the idea to use a PC running
    Linux as a LAN router in a production environment, the initial answer was one
    of economics. Silicon''s total cost was less than that of upgrading the existing
    router, and the DNS server was a free bonus. The fact that it was successful starting
    something exciting and added reasons such as stability, ease of maintenance, and
    flexibility to that answer. You can use the information here as a starting point
    for deploying this and more interesting topologies.


    The first example in this chapter covers how to configure a Linux router to route
    between two physical subnets. For this example, we will work up the configuration
    in detail, hopefully with enough information for those just getting started with
    routers. Later examples will go much more quickly. After we have our LAN router
    configured, we extend the idea of routing between physically separate subnets,
    and introduce IP aliasing and the idea of multi-netting. This is used to route
    between multiple logical subnets on a single physical segment, and the technique
    can ease migrations from one set of IP addresses to another. Next, we cover the
    IP accounting facility in the kernel—the basis for some of the traffic analysis
    tools available for Linux. Having mastered these topics, you will be ready to
    route. The chapter concludes with an introduction to the LRP Linux distribution.
    LRP is networking-centric and fits on a single floppy-diskette, making it an alternative
    to using a full Linux distribution for your router.'
  merge: -1
  pgno: 76
- img_proc: true
  md: '# 3.1 CONFIGURING A LAN ROUTTER


    Silicon is a good place to start talking about production Linux routers because
    its hardware configuration is very simple and it requires software other than
    the Linux kernel and network utilities which are included in the base installation
    of all common distributions.


    In Section 2.1.2, we studied the degenerate case of how a single workstation sends
    a packet directly to another workstation on the same subnet. We noted that if
    the destination''s IP subnet does not match that of the sender, the sender needs
    to use a gateway. Here we configure gateway, routing between two physically separate
    Ethernet segments, each with its own IP subnet (Connecting two physically separate
    physical segments are part of the same IP subnet is known as bridging. The Linux
    kernel provides bridging support, but it is not covered in this book.)


    NOTE: PRIVILEGES FOR ROUTING COMMANDS


    > For the procedures in this chapter (and most things in this book), you have
    to become the super-user on your system to be able to execute the commands. Save
    yourself and make sure that your PATH contains both /sbin and /usr/sbin, since
    most of the network configuration commands are in these directories. If you''d
    like to keep a record of the commands executed, try the script command.


    # 3.1.1 Defining Our LAN Router


    The first thing you should do whenever starting any project is to figure out what
    it is you to accomplish, noting any specific conditions which must be met or limitations
    to consider. This helps in mapping out your solution, and will keep you from losing
    sight of your goal as you become engross with the myriad and smaller obstacles
    which present themselves (I cannot tell you many times I have started a project
    only to realize upon its completion that I spend 80% of the time working on 20%
    of the functionality, and forgot to implement another 20% of the functionality
    altogether.) Our goal in configuring silicon:


    Connect two separate IP subnets via a router. Each IP subnet is on its own physical
    10-BaseT Ethernet segment. subnet_A is 192.168.16/24; subnet_B is 192.168.18/24.
    Both subnets have full access to each other. The IP addresses 192.168.16.1 and
    192.168.18.1 have been reserved as the gateway addresses for subnet_A and subnet_B,
    respectively.


    It can be helpful to draw a picture. Even if you understand the topology and what
    is happening, others will want to grow it. Trying to represent your network graphically—a
    single and easy-to-draw set of conventions is easy for others to follow. A picture
    can be "worth a thousand words" (of documentation), but spending hours to produce
    a very fancy drawing is usually a waste of time. The conventions I use are in
    Figure 3.1. Using these conventions, silicon''s topology is depicted in Figure
    3.2.


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_77_0.png)'
