  md: 'and distributed.) It is a collection of proxy programs which work together
    and focus on firewall security. Note that the software is not free, in the sense
    that GPL or BSD software is free, but you may retrieve the sources if you agree
    to comply with the license. See http://www.tis.com/ for more details. Even if
    you do not want to take a look at the source, there is a very good document about
    the design and use of the ''toolkit'' available at that same website Tis Internet
    Firewall Toolkit Overview. If the concept of firewalling and proxying is new to
    you, then this will be good reading.


    # TIS Toolkit Concepts


    The toolkit consists of a set of servers and clients which all use a common permissions
    file or authentication mechanism. These clients and servers are proxies for different
    network services you may provide to your internal users. Think of a proxy as a
    ferry, which transports requests from the internal interface (where the proxy
    is bound and listening) to the services they are requesting on the remote servers.
    Introducing this step allows you to control and log all access attempts to the
    ferry. Furthermore, because you have control of the packets, you may inspect their
    contents, as well as the contents of replies. This is where firewall proxies set
    themselves apart from generic proxies (whose main function is acting as an alternative
    to masquerading). You wouldn''t want someone transporting contraband using your
    ferry, nor should allow someone to sneak a bomb in one of the proxy packets. (Try
    in this case, a bomb is anything the sender''s client is not expecting and thereby
    may not handle gracefully.) For protocol-specific proxies, this is by making sure
    the response follows the state machine of the application protocol. Any commands
    which are not known by the proxy can be discarded (or at least ignored), since
    there is no way to to know whether or not it is safe to "transport" them to the
    inside. There are also ways to make the proxy itself safer, should someone attack
    it directly. It can be run in a chroot() environment so that a vulnerability in
    the proxy or the application protocol provided by the proxy does not endanger
    the proxy host.


    At cost, security? Operating a proxy requires more overhead than just routing
    or filtering packets. The packets must be copied into space and disconnected by
    the proxy, the proxies are statically linked (not necessarily detrimental to execution
    speed, but in terms of memory), and you will need a separate proxy process for
    each connection. The proxies also like to perform logging—perhaps a great deal
    of—which increases the overhead. As a firewall administrator, you have to make
    this sort tradeoff, depending upon the needs of your environment. Slow response
    times might be preferable to less security in some situations, in others not.
    Where you draw the line is a difficult decision, and what differentiates you from
    other firewall administrators. No defense is 100% complete; remember that you''re
    connecting your network to a network which is filled with potential attackers
    who, relative to you, are infinite in number, have infinite time, and typically
    have superior knowledge and tools. (Try telling them that!) Instead of waxing
    philosophical about security for any longer—that topic is better left to a security
    book—let''s review the tools available to you in the FWTK.'
