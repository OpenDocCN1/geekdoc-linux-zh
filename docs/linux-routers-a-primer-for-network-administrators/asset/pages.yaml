    request by enabling packet logging for matching packets. We do this adding

    - -1 (for "logging") switch to our REJECT rule above. When someone on a

    training website tries to access an external website, we''ll see an entry like
    this in

    /var/messages:


    ```

    Jun 30 12:00:19 oxygen kernel: Packet log: input REJECT eth0 PROTO=6

    192.168.36.21:4306 207.200.75:20480

    L=60 S=0x00 I=28632 F=0x4000 T=64 SYN (#1)

    ```


    That line tells us what and when happened. At the given time, a packet trying
    to

    er eth0 of protocol "6" was rejected. The second line lists the source

    IP:port and destination IP:port of the packet. The third line contains more informa-bout
    the packet. It is produced by the code in /usr/src/linux/net/ipv4/ip.fw.

    c fields have the following meanings:


    +   - L is the length of the packet (in bytes).

    - S=0xxxx is the value of the TOS (Type Of Service) field in the packet.

    - I= the identification field of the packet.

    - F=0xnnnn is the fragment offset.

    - T=nn is the value in the TTL (Time To Live) field of the packet—the number

    hops of the packet can take before being discarded.

    - The presence of SYN indicates that this is set; the (#1) is the absolute se-quence
    number for the TCP sequence.


    With this information logged via syslog, we can quickly scan for any attempts,

    al attempts made by each individual IP, and the times of those attempts.


    # Packet-Filtering Example 2 Our second example is to use packet-filtering to


    prevent direct access to FTP sites. Instead, we want to force users to use a FTP
    proxy

    client. The motivation is management wants to keep a log of all transfers in case

    disgruntled employee decides to FTP a copy of our trade secrets to a competitor.

    We connect to the proxy when they need to access external sites. We will not cover

    configuring the FTP proxy itself, which is simple enough, but will focus on the
    rules

    needed to allow the proxy to get outside of the firewall, but not any internal
    systems.

    Drawing a picture—see Figure 6.8. From this, we can write out the high-level

    rules required.


    +   - Allow FTP access from the inside to the FTP proxy service running on oxygen.

    - Prevent direct access to the outside for any clients on the inside.

    - Prevent external clients from connecting to the FTP proxy.

    - Allow FTP access to the outside from the FTP proxy service.

    - Prevent any other traffic from traversing the firewall.'
