    # 6.4.2 Methods of Detection


    Most of the scripts you write to monitor the things listed above will run on the
    system being monitored, you will probably need more for a complete solution. We
    have already mentioned the need for a monitoring system separate from the systems
    being monitored. This is not entirely true; the monitoring system can be configured
    to perform other tasks too, but you should try to relegate some lesser duties
    to it. The principle is here that a production outage may ripple through your
    network—a router failing on one end of a link may result in two or more failures—so
    the monitoring system''s function could be orthogonal to which is monitored.


    You may be quick to point out that the notification system might might also fail.
    Although possible, what is the likelihood of both failing simultaneously? (And
    if the notification system goes down, the router stays up, then you do not have
    an outage.) Nevertheless, this system should be minimally configured so that software
    failures are unlikely. If you have the resources, monitor this one system with
    another system.


    There are different ways of monitoring your router to make sure that it is alive.
    One way is not safe to use ping. The reason for this is that once a NIC has been
    configured with its IP address, the card has the ability to respond to ICMP pings
    without the help of the operating system, as long as the card is physically powered
    on.


