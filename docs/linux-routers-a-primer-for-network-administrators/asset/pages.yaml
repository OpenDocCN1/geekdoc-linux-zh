- img_proc: true
  md: '# C.4 Using VMware to Test Configurations


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_336_0.png)


    Figure C.1 A VMware Network


    virtual machines, each on a separate virtual segments:


    +   1. Configure your host system for IP forwarding. Remember the shortcut of
    echo "1"->/proc/sys/net/ipv4/ip.forward.

    2. Configure vmnet1 on your host system to be the .1 address on subnet A.

    3. Configure vmnet2 on your host system to be the .1 on subnet B.

    4. Configure host-only networking for your first VM, and configure it as a client
    on subnet A.

    5. Configure custom networking for VM2; specify /dev/vmnet2 when asked for the
    filename. Once inside VM2, configure it as a client on subnet B.


    Now you can route over the routing table, masquerading rules, firewall rules,
    etc., of the host machine. Pretty neat, eh? See Figure C.1 for a diagram. You
    can use this setup to test all sorts of different types of configurations, such
    as:


    +   - Configure VMHost as a sniffer on either vmnetA or vmnetB.

    - Establish services on VM1 (on vmnetA), like a web server or a SMTP daemon, and
    then configure packets and IP masquerading, to run on VMHost to filter and monitor,
    and alter access for VMs on vmnetB.

    - Testing daemon configurations in an isolated environment by running them on
    VMs on a single vmnet and turning off IP forwarding on VMHost. (Since the VMs
    are not routers, you will have to configure bogus routing information to be broadcast
    by their deemons).

    - Launch attacks from VMHost against VM on a vmnet.


    If the idea of having N distinct subnets on four separate virtual hubs speaking
    together via routing on the host system gives you some ideas about system testing,
    visit VMware''s website at http://www.vmware.com, for more information about VMware.'
