    # B5 WHY USE MODULES?


    Modular drivers, commonly referred to as modules, are part of what sets the

    Linux apart from other operating systems. Once a kernel is compiled with module

    support, you can load and unload drivers by using the insmod and rmmod

    commands, respectively. Aside from illustrating the programming prowess of

    kernel developers, they are a fantastic boon for sysadmins. Here is a partial
    list of

    t useful properties of modules:


    +   1. Both optional and required arguments are easier to specify when loading

    tmodule with insmod than having to specify them as a boot parameter

    /etc/lilo.conf and rebooting to test the new parameter setting.

    Particularly true you''re trying to configure a device for the first time...

    2. Modules can be unloaded and not reloaded. Sad but true, every and now

    a Linux kernel has a bug too. (Or the may be in the firmware

    on the controller card.) Without modules, reinitializing this device driver re-

    requires a reboot of the system. With the driver built into the kernel, it can
    be

    accomplished with a simple rmmod module ; insmod module.

    3. Modules can be loaded in any order which you see fit. This is nice for controlling

    t order in which the kernel creates the network devices (eth0, eth1, etc.). By

    dictating the order in which the modules are loaded or by specifying arguments

    while loading a module, you control the order in which the system detects the

    interfaces. On systems with multiple NICs, this helps ensure that the

    physical card you expect to be eth0 really is.

