  md: '# D.2 Management vs. Linux


    I have witnessed a shocking amount of piracy and licensing violation occurring
    in IT departments. Some people claim that the software vendors want it that way;
    otherwise, they would not make it so easy to do. I''m not sure what this has to
    do with the issue; it''s the same sort of faulted rationalization people make
    about network monitoring for content. and if vendors really do want that way,
    then they have their ethical dilemma to face—normally they are in business to
    sell software.


    The point is that licensing represents a significant portion of many companies''
    IT budgets (or if it were done lately), and this cost (or liability) should be
    captured. If the industry trend of charging for server software continues, free
    server will have some distinct economical advantages. Not all of this directly
    applies to the router market, but Linux is not just a competitor of commercial
    routers. In general, software should be easy to capture, but you might find that
    people are not looking at the cost of the total cycle. For every upgrade, there
    are purchase negotiation costs, training costs (possibly for both the administrators
    and the users), and reduced user productivity costs due to server and/or workstation
    downtime.


    +   3. If your shop is already in production with another operating system, you
    can start developing confidence in Linux by deploying it in non-critical scenarios.
    After all, cautious managers don''t leave without taking a nice look first. You
    can ease their anxiety by letting them see Linux things win over a period of time.
    Keep a detailed list of your time and cost investment. If it is your first time
    configuring an application on Linux, note that reuse of both software and skills
    will lessen the costs in the future. Remember that an expensive solution for your
    employer will eventually affect you too. This trial period will also give you
