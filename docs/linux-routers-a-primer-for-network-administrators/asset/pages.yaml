  md: 'be able to add some I/O without worrying of the system to its knees. I/O bus
    contention is another matter for heavily-loaded LAN routers, but unlikely for
    a typical WAN router. When you are debating whether or not to add some functionality
    to a router, you should take into account this potential system bottlenecks:


    +   - Memory—Insufficient memory leads to swapping, which leads to disk I/O, which
    takes time. Time leads to packet latency. The kernel is locked in memory, as are
    buffers, and the routing table. (Locked pages cannot be swapped out to disk.)
    When the kernel receives packets, it needs (real) memory for them so that it can
    take a look at and then forward them. If you have other processes consuming all
    of the available memory, the kernel will choose to swap out a few pages from one
    of those processes. This is neither Good nor Bad, it just takes time. If there
    is already contention for the disk due to activity on the system, it will take
    some time to swap the page.


    +   - Disk I/O—Swap is just one of the system’s uses for the disk. You may be
    performing heavy loading, or spool printing, or logfile analysis. (Of the three
    of these, you can move all but the first to a different system.) Tools which make
    disk I/O interactively releases been somewhat scarce for proprietary Unix releases.
    Only recently has the Linux community turned an eye towards benchmarks and tuning.
    At the time of writing, there are several hardware benchmarking programs available,
    and a few programs designed to flag performance problems during normal system
    operation. All of these are listed below other performance tuning tools.


    +   - CPU—If you are CPU-bound on your router, then you need to spend time investigating
    what is using so much CPU. CPU-bound is a term used for systems whose processes
    are repeatedly put to sleep by the kernel because they timeslice repeatedly. Normally,
    a process will relinquish the CPU by some other natural cause, such as blocking
    on an I/O request or waiting for input. A simple check for this is to use some
    uptime or top (or to go to the source,/proc/loadavg). If the load average is >=
    1.0, then there is more hanging than the system can be successfully scheduled
    and completed. The system will continue to run, but other things will have to
    wait. Normally, you can locate the problem quickly using top or by repeatedly
    looking as process listing with ps to determine which processes are accumulating
    CPU time, as seen in the TIME field of ps.


    +   - Interrupts and DMA—Interrupts are a bit different because they span different
    types of devices, and are more related to the design of the device; i.e., how
    much buffer space it has, and how sensitive it is to variations in the time it
    takes to service the device after it raises the IRQ line. If you use the Debian
    hwtools package and read the documentation for irqtune, you will see that meantime
    relatively low-speed devices are very sensitive to IRQ latency. (You can get irqtune
    at http://www.best.com/cae/irqtune/).'
