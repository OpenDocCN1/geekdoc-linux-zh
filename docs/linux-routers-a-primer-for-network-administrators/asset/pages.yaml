    Once you have installed the S508/FT-1 adapter card and the Ethernet adapter performed
    a base load of the operating system, you''re ready to configure the WANPIPE software.
    This section assumes that you are using Debian and the wan-pipe package (but the
    differences between this and the Sangoma release are purely'
