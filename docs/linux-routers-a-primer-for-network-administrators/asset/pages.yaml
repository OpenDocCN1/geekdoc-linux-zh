  md: 'am aware of any problems with the Samba daemons. There are many server packages
    which run as root, open ports, and have potential security exploits. Basically,
    anything that is not needed should not be loaded. If there are servers which you
    would like to have loaded on the system, but do not want to be executed upon startup,
    you should script these not to be started. Every service on your system should
    be started either from inet, or from the system directories, e.g., /etc/init.d/
    for Debian systems. One way to quickly disable a service is to edit its startup
    script and add exit 0 as the first executable statement. This leaves the software
    and startup script intact, and can be easily reversed. Two notes of caution about
    this, though. First, you should stop the service with /etc/init.d/servic before
    editing the script. This way, you will not have to try to stop the process(es)
    by hand. Second, Linux distributions which support the concept of local configuration
    files, you may have to take manual intervention when upgrading the packages which
    owe these startup files. This is a mixed blessing. On the downside, it requires
    manual intervention when upgrading the package. On the upside, this reminds you
    about customizations that you have made to your system, allowing you to revisit
    them as necessary.


    +   5. Subscribe to, read, and participate in a security mailing list or group,
    for your distribution or for Linux/Unix in general. Security is a moving target,
    and keeping abreast is not easy to do when you have other duties to perform. When
    working with management, it is often the sort of topic that receives a little
    of verbiage, but little space when it comes to requesting the time, training,
    or money to perform security enhancements. It is also the sort of thing where
    the technology is complex enough it may preclude meaningful decision-making on
    the part of your management and they will lean upon you to set the direction (and
    maybe the policy, too). For all of these reasons, it is good to stay in touch
    with others who have similar interests. For Debian, see http://www.debian.org/security/.


    +   6. Get into the habit of using last and last commands to regulate when and
    from where people have been logging into your system, or failing to log your system.
    If it appears that no one logs into your systems, attackers could be removing
    these logs to cover their tracks. There is plenty of information created by syslog
    (in /var/log)—learn what it is and how to read it if you suspect something has
    occurred, you can quickly spot something unusual in the logs files. If you configure
    syslog to dump everything into a single file, /var/log/messages, so that I do
    not have to keep going from file to file. I can also watch this one file, either
    the "old-fashioned way" with grep, using custom perl scripts, or one of the Debian
    packages listed below. The security conscious will consider using the built-in
    facility in syslog to log both locally and to a remote system.


    xlogmaster is a GUI log viewer which is customizable to support triggers and audible
    alerts.


    gnome-admin contains logview, which is a nice GUI logfile viewer that contains
    descriptions of many common syslog messages (see the zoom feature).'
