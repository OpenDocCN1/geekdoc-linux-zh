    same ideas you have come up with *xinetd* back in 1992. Since that time, it''s
    been ported and maintained by Charles Murcko and Jan Wedekind. *inetd* is a drop-in
    replacement for *inetd* that offers a very complete network access control mechanism
    to be executed before a network service starts. This list of features is taken
    from the Debian package notes:


    +   Access control on all services based on:


    +   (a) access of remote host


