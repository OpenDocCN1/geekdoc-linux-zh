    | fpipemon Commands-Traces (t) specifier | meaning |

    |---|---|n| i | interpret/all—This shows data (IP) and protocol (link-layer) frames
    in an easy-to-read "cooked" format |

    | ip | interpret/protocol—This shows protocol frames in an easy-to-read "cooked"
    format |

    | id | interpret/data—This shows data payloads in the easy-to-read "cooked" format
    |

    | r | raw/all—This shows the contents of all data (IP) and protocol (link-layer)
    frames in hexadecimal |

    | rp | raw/protocol—This displays the raw link-layer frames. This might be useful
    as a learning aid. (Sit down with the applicable RFC—probably RFC 1490—and decode
    the values in the frame headers.) You should do the same if you suspect some sort
    of incompatibility with your provider''s equipment |

    | rd | raw/data—This displays the frame payloads in hexadecimal format |


    For all the trace modes, you toggle tracing on you issue the command with fpipemon,
    which it starts tracing to stdout. To turn off, hit ENTER. Depending on the options
    used to invoke fpipemon, the output is Link Verification or Status Requests (protocol),
    various replies to these (also protocol), or INBOUND or OUTGOING data.


    The interpreted protocol trace is an excellent source of trouble-shooting information.
    The output is the LMI (Local Management Interface) information being exchanged
    between your router and the equipment at the POP. Once you learn how to decipher
    the output, you can tell from the FSE (Full Status Enquiry) messages'
