    # 3.1.2 Configuring the Base Platform


    Now that we know what we want to do and have a picture, we can list the hardware
    required. We need a system with two Ethernet adapters, one for each segment, and
    cables to attach the router to the segments. The system itself doesn''t need to
    be much; a P5/166 with 16MB of RAM should be sufficient for this configuration.
    (Refer back to Section 1.1 if you have questions about the hardware.) For this
    example, we use (2) 3cm3905 10/100 PCI Ethernet adapters. You need to load your
    router with your favorite distribution of Linux. This example will be presented
    using Debian GNU/Linux. There is no need to load a slew of packages on your router;
    the base load will suffice.


    Enabling IP Forwarding for Kernel Version 2.2.x You need IP forwarding enabled
    in your kernel for your system to act as a gateway and to be able to route between
    multiple interfaces. The following kernel options should be selected, in addition
    to whatever device support you may need:


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_78_1.png)


    Figure 3.2 LAN Router with Two Subnets'
