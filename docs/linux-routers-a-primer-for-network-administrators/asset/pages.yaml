  md: '# 244 — California—Satellite Router Chap. 7


    router, they will be returned over the same link to that router. (You need to
    configure host routes for each of the WAN interfaces for this to work correctly.)
    Another alternative is to masquerade inbound traffic at router C and router D.
    In any case, you''ll want to have scripts at the home office which monitor your
    link peers so they can take the appropriate action—essentially the same action
    you took for the remote site—should a link fail.


    Another method, possibly easier to conceptualize and debug, is to have a single
    monitoring system with the ability to reexec (preferably, ssh) routing changes
    to the systems it monitors. It would be located at the home office, and would
    have host routes to each of the IPs of the WAN interfaces so that it would not
    get caught up in any multipath configuration you may have. The kernel always serves
    the other end of a point-to-point link using the host route registered when the
    interface is configured. This host route has a more restrictive subnet mask than
    the general network route for the remote site, so it will match the destination!.
    When the monitoring system notices a link down, it takes appropriate action on
    the required routers for a re-route. If it sounds like a mess, just consider what
    you would do to manually re-route traffic, and execute it on machines.


    # Configuring for Redundant Links with Multipath You can use the strategy without
    multipath routing by dividing your clients into two groups and assigning one group
    of the clients on the remote site to router A, as a gateway, and the other group
    to divide the traffic in half or perform any sort of load balancing, with the
    approximation being sufficient. You will not need to divide the assignments with
    DHCP. By using the same sort of monitoring scripts, you can take sensible actions
    depending on the situation, similar to what you would do with multipath. Examples
    include:


    +   * The WAN link fails, but the router is still up, have it add the route using
    the other router as a gateway. Then have it mail you a message that the remote
    site is running in a degraded state. This covers situations where the link dies
    (for whatever reason) or when the router on the other side is unexpectedly offline.
    Because this router is still running, as soon as it detects that the WAN link
    is once again useful, it can reconfigure its routes back to the normal state.

    * If router fails entirely, the other router should notice and assume its IP address.

    * If both links fail, the scripts will configure both routers to the other as
    a gateway. For this reason it may be preferable to do something to the packets
    as they are forwarded to the other router for gateway so that you can detect this
    situation. Modifying the TOS of a packet is perfect for this. The scenario works
    like this:


    +   1. A client sends a packet to router A, its gateway, for forwarding.

    2. Router A knows its link to the home office is down, so it forwards the packet
    using router B as a gateway. But before it does this, it modifies the TOS field
    to some magic number.'
