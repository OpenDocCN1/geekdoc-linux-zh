    # Switched Access


    A POTS circuit is an example of switched access, which means it is a connection
    to a public network that can make a connection to any multiple other sites. In
    the case of the public telephone network, you can literally connect to hundreds
    of millions of destinations (one at a time) using your single connection. This
    is the switched part, meaning that the network can switch your destination based
    on your input. Access in this context is a noun, and refers to the facility you
    are connecting your telecommunicating device (in this case, the device is a telephone)
    to the public network. One property of switched access is that you do need to
    tell the network where you would like to go, i.e., you must dial before you make
    a connection to it. The most commonly switched networks are the analog telephone
    network, ISDN (which is integrated into the analog network), and the X.25 packet-switching
    network. Charges for switched services are normally a base rate plus usage—you
    pay for it that you use. Also, switched networks are not necessarily designed
    so that every node can be used simultaneously (as in the infamous I can''t get
    a line out on Mother’s Day problem). To save costs, there is limited capacity
    in the backbone (or the “switched” of network)


    # Dedicated Access


    Here, you have a circuit which runs from point A to point B. (Note that the point
    B is not necessarily the remote location you are trying to connect to—more on
    this). This circuit does not need to be dialed because its endpoints are fixed.
    Dedicated access is often known as a leased-line, because you are paying for all
    of the bandwidth of the circuit, all of the time. Leased-lines are typically telco
