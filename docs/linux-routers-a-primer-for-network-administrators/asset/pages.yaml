    be antiquated. Some of those people decided to roll their own and create another
    RFC 1035-compliant DNS server dubbed Dents.


    Dents is licensed under the GPL and boasts some nice features, such as a modular
    interface allowing you to store your configuration in whatever format you see
    fit. Currently, a SQL module is provided with the package, but documentation'
