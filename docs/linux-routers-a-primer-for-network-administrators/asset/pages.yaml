  md: '# Remote System Support


    #################################################################

    # brute-force backup

    ################################################################

    # this really only needs to happen the first time

    # separate this out into another script if you''d like

    mkfs.ext2 -c /dev/hdc1

    mkswap -c /dev/hdc2

    mkfs.ext2 -c /dev/hdc3

    # mount the hot spare

    mkdir /tmp/root 2>/dev/null

    mount /dev/hdc1 /tmp/root || (echo "abend!" && exit 1)

    mkdir /tmp/root/var

    mount /dev/hdc3 /tmp/root/var || (echo "abend!" && exit 1)

    # copy the entire contents

    cd /var

    find . | cpio -pdmv /tmp/root

    cd /

    find . -mount | cpio -pdmv /tmp/root

    # fix fstab

    cat /etc/fstab | sed ''s|/dev/hda|/'' >/tmp/root/etc/fstab

    # leave a trace of our actions

    touch /tmp/root/$(hostname)_clone_on_$(date ''+%y%m%d'')

    # unmount

    umount /tmp/root/var

    umount /tmp/root


    Sure, it''s overkill, but it is almost foolproof. cpio will not bother overwrite
    files with identical timestamps, so backups will run very quickly. To make our
    new disk use, leave the floppy in the drive which will boot off of the backup
    drive. When things go south with the primary drive, and then one of the employees
    will pop the floppy disk into the drive and reset the hardware. Because the backup
    partitions are not mounted, the abrupt reset will not damage their filesystems.
    The floppy is required to keep LILO from trying to boot from/dev/sda. There are
    several different ways to generate such a floppy:


    +   1. You can write a kernel image to it with make zdisk, and then use rdev to
    set the root and swap devices with rdev /dev/fd0 /dev/hdc1 and swapdev /dev/fd0
    /dev/hdc2.

    2. You can useload to build your disk This is a simple way to leave the disk in
    the drive (so that you can mount it as a FAT partition and write new versions
    of the kernel to it), and then have a short script which will load and point the
    root to /dev/sda1 after some timeout, but if someone interrupts the boot sequence,
    then boot from /dev/hdc1. Or, reverse the defaults to suit your tastes.

    3. Use one of the other half-dozens ways there are to boot Linux from a floppy.
    syslinux is an example.'
