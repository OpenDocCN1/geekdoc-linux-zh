    One of the biggest problems for the performance tuner can be correlating what
    is happening in the system to what is happening in user-space for multitasking
    operating systems. Good luck!


    # 7.4 Remote System Support


    Unless you have very special security considerations, technically sparing almost
    all of your support will be remote support, meaning that it is not performed on
    the system console. This section is not about remote support when everything is
    working, but about planning for problems at remote locations. It is roughly divided
    into two topics: strategies to quickly restore functionality when links fail,
    and methods to minimize restore times after harddrive failure.


    # 7.4.1 Redundant WAN Links


    What to do when your WAN link fails is a problem for anyone, regardless of the
    router platform. Your service provider may have internal network outages which
    cannot be rerouted, your access provider(s) may have problems, or it may be a
    case of bad weather. In any event, despite any SLA (Service Level Agreement) you
    may have with your provider, you need to be prepared for a link outage. Redundant
    links are one of the most common solutions; if you have the economic means, they
    can protect against provider outages and hardware failures at the same time.'
