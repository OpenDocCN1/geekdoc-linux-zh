    \ and byte counter fields. No pesky\n    K, M, and G to try hack around in your\
    \ Perl script!\n\n+   - ipchains -A mychain rule Appends myrule to mychain. Rule\
    \ specifica-\ntion similar to rule specification with ipfwadm, what has been\n\
    with some features.\n\n+   -p [!] protocol specifies a protocol, which must be\
    \ tcp, udp, icmp, or all.\n  \"f\" does what you think it would; it is the logical\
    \ output of the condition.\n  For someone used to ipfwadm, this jumps out immediately\
    \ as a useful\n  improvement.\n\n+   -s [/mask] [!] [...] specifies a source address\
