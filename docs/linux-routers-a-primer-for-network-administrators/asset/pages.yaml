    # 2.2 Ethernet 101—Switches and Hubs


    This section drills down and looks at how packets flow across an Ethernet LAN,
    and specifically how machines on the same segment communicate with each other.
    This is analogous to the concept of IP subnets, except that Ethernet segments
    are groupings based on physical topology, while IP subnets are groupings based
    on configuration. This communication is the same mechanism used by the workstation
    (or gateway) for that segment—which is why the gateway must be on the same physical
    Ethernet segment.


    A common mechanism for connecting machines nowadays is twisted-pair (either 10-BaseT
    or 100BaseT), where each machine is connected via its own dedicated wire to some
    sort of "network port connecting device." This "device" comes in two basic flavors.
    A hub emulates a broadcast cast—what is sent to one port is available for all
    ports to see. (Technically, this is a repeater.) A switch employs a crossbar switch—the
    sending and receiving port are directly connected to each other for the length
    of the packet transmission. (This acts like a very short-lived bridge.) There
    is more on the differences between a hub and a switch covered in Section 2.2.3.


    # 2.2.1 The MAC Address


    Of primary interest is how communication takes place between two systems on the
    same Ethernet segment, since it''s a quantum of much of the network communications
    we''re concerned about in this book. The answer is that machines send directly
    to one another by specifying the 6-byte Ethernet address of the destination system.
    This address is often called the hardware address of the Ethernet card. "MAC"
    is an abbreviation for "Media Access Control." On any given LAN, every MAC address
    must be unique. This should not be a problem, because the MAC address is programmed
    in the NIC vendor, and there is a system by NIC vendors that ensures the addresses
    they program into their cards are unique.


    All vendors have their own address block(s), which is designated by the first
    3 bytes of the address field. Each vendor code encompasses 2⁴ — 2 (16,777,214)


    > /usr/share/karpski/datfiles/vendor_codes.dat has a complete list of these assignments.
    The file is part of the karpski Debian package, which is a GUI packet-sniffer
    covered in Section 4.5.3.'
