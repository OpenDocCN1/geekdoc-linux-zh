  md: '# # LINUX ROUTERS


    A Primer for Network Administrators


    Tony Mancill


    # ## Save a fortune! Use Linux as a router!


    Why spend a fortune on routers when a Linux box can do the same job (and more!)
    for a tiny fraction of the cost? Linux routers are inexpensive, flexible, adaptable,
    expandable, easy to administer, and absolutely rock-solid! In Linux Routers: A
    Primer for Network Administrators, you''ll learn how to implement Linux-based
    routers, hands-on. Linux administrator Tony Mancill walks you step-by-step through
    a series of production-routing scenarios, offering detailed guidance on configuration,
    problem avoidance, and troubleshooting.


    Coverage includes:


    +   * Choosing the right hardware and Linux software tools

    * Linux routing for Ethernet, Frame Relay, Internet, and extranet environments

    * Using the same system as a router and Web server, DNS server, etc.

    * Day-to-day router administration and monitoring

    * High-availability strategies for Linux routers, and more


    In Linux Routers, Tony Mancill shares his real-life experiences implementing high-performance,
    low-cost Linux routers in the corporate network. If you''re building or extending
    a network, and you''re not "made out of money," you owe it yourself to consider
    Linux!


    # ## About the Author


    TONY MANCILL, AZ. He previously served as system administrator for Bank of America
    in Phoenix, AZ. He previously system administrator for LHS Communications in Atlanta,
    GA, and as a UNIX systems programmer at BellSouth. Mancill graduated from Georgia
    Tech with a degree in Electrical Engineering, and he is a volunteer developer
    for Debian GNU/Linux.


    $44.99 U.S.

    $68.00 Canada


    PRENTICE HALL

    Upper Saddle River, NJ 07458

    www.phptr.com


