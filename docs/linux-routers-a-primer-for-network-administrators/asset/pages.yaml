    # 7.1.1 Configuring wanpipe.conf for CHDLC


    Save yourself time by copying a sample configuration (wanpipe.cpri) from the appropriate
    directory to the default wanpipe.conf (as long as you not already have a working
    configuration!). The configuration prepared assumes that you are using the card
    for CHDLC, although it is not difficult to configure a card to run CHDLC on the
    secondary port (or a second card). If you would like to do this, refer to Sangoma''s
    documentation.


    Open up wanpipe.conf in your favorite editor and get to work. I have prepared
    a configuration file with the non-essentials removed. The file is an example of
    a configuration where the IP address is assigned explicitly through the use of
    an interface file, which is dictated by SLARP_TIMER=0. The parameters in the example
    are described in Section 7.1.2.


    ```

    # /etc/wanpipe/wanpipe.conf

    # Protocol: Cisco HDLC (CHDLC)

    #--------------------

    ************************************

    # Device Definition Section

    ************************************

    [devices]

    wanpipe = WAN_CHDLC, Cisco HDLC

    ************************************

    # Network Interfaces Definitions

    ************************************

    # The [interfaces] section defines logical channels and corresponding

    # network interfaces created by the router. Each statement in this

    # section has the following format:


    # (interface name) = (device), (media_addr, (function), Comment

    #

    [interfaces]

    hdlc0 = wanpipe, WANPIPE, cisco hdlc connection on Port 0 (PRI)

    #chdlc1 = wanpipe, WANPIPE, cisco hdlc connection on Port 1 (SEC)

    ************************************

    # Link configuration section

    ************************************

    ```'
