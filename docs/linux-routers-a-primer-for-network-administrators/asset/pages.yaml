    # 8.2.3 Kernel Port Forwarding—High Wizard


    Now we are back to come full circle on TCP/IP stack tricks. Some kernels decided
    that the functionality being performed by the kernel, we''ve discussed could also
    be implemented completely in the kernel. In review of the previous two sections,
    IP transparent proxying could have been named firewall redirection. Its purpose
    is to redirect traffic to a local port, regardless of its destination. In fact,
    the user-space redirectors take traffic bound to a local port, and forward it
    to a pre-determined destination. This section covers extensions to the IP masquerading
    code in the kernel which can perform a mixture of these functions. Before we dive
    in, there are a few things you should know about kernel port forwarding.


    +   1. This functionality is only available in the 2.2 kernel or later. (This
    is not entirely true. There are patches for the 2.0 kernel available which support
    IPTFW, one of the functionalities started. If you want to use this on the 2.0
    kernel, retrieve the Debian packages iptortfw and kernel-patch-iptfw to get started.
    You may also want to refer to the documentation at http://www.monmouth.demo.co.uk/ipsubs/portforwarding.html.
    This section will not cover the 2.0 kernel).


    +   2. You will need the ipmasquad package if your distribution does not include
    this binary. The source is http://juanjox.linux.com/. Debian users already have
    it; it is included in the netbase package.'
