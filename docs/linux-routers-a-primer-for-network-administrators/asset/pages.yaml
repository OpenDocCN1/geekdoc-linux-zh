  md: '# Glossary


    **ACL** Access Control Lists.

    **AFAIK** As Far As I Know—the standard disclaimer.

    **AMI** Alternate Mark Inversion (sometimes known as **bipolar**)—a protocol used
    on T1 circuits which alternates the polarity of ones being sent. This is done
    to save power on the transmission line by eliminating the residual DC component
    of the signal.

    **APM** Advanced Power Management—a set of BIOS features which can be configured
    to implement power-saving features of the hardware, such as drive spin-down, after
    a defined period of inactivity.

    **ARP** Address Resolution Protocol (for Ethernet, it''s documented in RFC 826).

    **ATM** Asynchronous Transfer Mode—a networking protocol characterized by very
    small packets.

    **B8ZS** Binary 8 Zero Substitution—protocol used on T1 circuits to maintain the
    minimum density of ones (used so that clocking remains synchronized during long
    sequences of zeros). It is an example of intentional bipolar violation.

    **BGP** Border Gateway Protocol, a dynamic routing protocol (RFC 1164).

    **BIOS** Basic Input Output System, the code used to initially bootstrap the computer
    so that it can find performing functions such as assigning IRQs and base addresses
    to PCI devices. Some operating systems (e.g., MS-DOS) use functions provided by
    it for writing to system devices such as the screen or floppy drive.

    **bit-rot** Allowing a piece of software to become antiquated and lose its usefulness
    by neglecting to maintain it properly.

    **bridge** A network device that connects two segments of the same media type.

    **BTW** By The Way.

    **CHAP** Challenge Handshake Authentication Protocol—also commonly used for PPP
    authentication mechanisms (See also **PAP**).

    **CIDR** Classless Inter-Domain Routing (RFC 1519).

    **CIR** Committed Information Rate.'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# CPE Customer Premise Equipment—everything on your side of a digital telco


    circuit''s demarc.


    CSU Channel Service Unit—provides physical termination, performs amplification,
    and initiates loopbacks for a digital mexico circuits. For T1 circuits, it also
    performs frame formatting and computes performance measurement statistics. Typically
    found in a CSU/DSU. (See DSU.).


    D4 A framing technique used on T1 digital circuits. (See ESF.)


    DLCI Data Link Connection Identifier—the link-layer address of a Frame Relay node
    within your network. Normally an integer between 16 and 1023.


    DHCP Dynamic Host Configuration Protocol.


    DMA Direct Memory Access.


    DSU Data Service Unit—is located between the CSU and terminal equipment (your
    router). It converts unipolar digital signals from terminal devices into a bipolar
    digital format for transmission over the digital network. The DSU also provides
    recovery, control signaling, and synchronous sampling. (See DSU.)


    EGP External Gateway Protocol, a dynamic routing protocol (RFC 904).


    ESF Extended Super Frame—a framing technique used on T1 digital circuits which
    provides for performance statistics of the circuit (compare to D4).


    FDDI Fiber Digital Device Interface—a physical network protocol which runs over
    optical fiber for LANs up distances greater than 100km.


    FQDN Fully Qualified Domain Name—the combination of the hostname (sometimes called
    “short name”) with that host''s domain name. For example, pongo.mancill.com is
    pongo''s FQDN.


    FSF The Free Software Foundation. (See GNU).


    FSE Full Status Enquiry—a message format used between Frame Relay routers to know
    each other what is all well.


    gen “generate a kernel”—i.e., build a new kernel from the sources.


    GNU “GNU’s Not Unix. (The infamous recursive acronym.) A project started by the
    Free Software Foundation (FSF) “to develop a completely free Unix-like operating
    system.” See http://www.gnu.org/ for more information.


    GPL The GNU Public License. See http://www.gnu.org/copyleft/gpl.html.


    GSS-API The Generic Security Service Application Programming Interface. A network
    programming API used with SOCKS V5. See RFC 1961 for details.


    hand-lib Building and installing software by hand, as “I had to hand-lib the latest
    copy of foo onto the box because there isn’t a package available yet.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'HDLC High-level Data Link Control—a layer 2 (link-layer) protocol which provides
    an error-free connection between two network nodes. All frames terminate with
    Cyclic Redundancy Check (CRC) bytes which are used to detect any data errors.
    Frames received correctly are acknowledged by the receiver while erroneous frames
    are ignored.


    hub a network concentrator that acts like a bus.


    ICP Internet Cache Protocol, used by caching HTTP proxies such as Squid.


    IDE Integrated Drive Electronics.


    idiot image a pre-canned boot disk that is ready to go, hiding the more complex
    details of configuring the system.


    IETF Internet Engineering Task Force.


    IMHO In My Humble Opinion—certainly an oxymoron, since the speaker is not very
    likely to be humble after this lead-in.


    IMO In My Opinion—grip yourself to receive someone else''s idea(s).


    IP Internet Protocol.


    IRQ Interrupt ReQuest.


    ISA Industry Standard Architecture.


    ISDN Integrated Services Digital Network.


    ISO International for Organization Standardization—http://www.iso.ch.


    ISP Internet Service Provider—someone with more bandwidth to the Internet than
    you have, and who would like to sell part of it.


    ITAR International Traffic in Arms Regulations—the U.S. State Department''s set
    of export regulations, wherein certain types of cryptography are deemed illegal
    for export under the pretext that they are weapons. For more information about
    this sort of thing, visit the Electronic Frontier Foundation at http://www.eff.org/.


    kernel-space refers to code that is executed by the kernel in its own environment,
    such as device drivers, routing, and packet-filtering. Compare to user-space.
    Example of usage from fortune:


    +   * Our OS Thy art in CPU,

    * UNIX be thy name.

    * Thy programs run, thy syscalls done,

    * In kernel as it is in us!


    LAPB Link Access Procedure Balanced—a bit-oriented synchronous protocol that provides
    complete data transparency in a full-duplex point-to-point operation. It supports
    a peer-to-peer link in that neither end of the link plays the role of the permanent
    master station.'
