  md: '# General Network Security Measures


    point for attacks on others. People may want to use your systems to generate spam.
    Or they may want to destroy something. As for people not knowing about your presence
    on the Net, don''t count on it. Set up a cable modem at a non-commercial location
    one afternoon and was quite surprised to see a port scan (originating from a university
    on another!) being run against the system only three hours after it first online.


    You will have to form your own philosophy about how to deal with such incidents.
    My personal reaction was to make sure the port scan did not result in anything
    useful and to view syslog log files more carefully than normal for the next few
    weeks. In my opinion, there was no need to actively confront the scanner until
    a access was made. Of course, this was a private system and the consequences of
    a security breach would have been inconvenient, not devastating to your livelihood.
    In general, I recommend you consider your reaction carefully unless you have the
    resources and know-how to lock horns with a wiper cracker. Depending upon your
    workload or your organization''s policies, you may not have a choice....


    The remainder of this section is divided into a subsection which deals with general
    network host security, i.e., how to keep from hacking services which run on your
    router, and a longer subsection on how to configure packetfiltering with Linux.
    Although the sample router configuration in this chapter is for an router, the
    security measures apply to all routers. Attacks from the inside are just as likely,
    and typically devastating because the attacker already knows about your network
    and what they would like to.


    # 6.2.1 Generic Host Security


    Developing a comprehensive security model is not the purpose of the book, nor
    do I believe that I would be the right person to present it. My recommendations
    are colored by my experiences. Host security for Unix is an exceedingly complex
    topic and the subject of several books thicker than this one. One of the best
    ways to mitigate the risk of this complexity, and the unnerving fact that crackers
    trying to break into your systems will invariably be equipped with tools and have
    more time than you, is to eliminate it whenever possible. Simply put, any services
    which are not required to be running on your router be disabled. Because Unix
    has a history of being exposed to the Internet, university campuses, and corporate
    data centers, there are some good measures which have already been taken, e.g.,
    logging, tcpd, etc. I will introduce those as appropriate. Consider these few
    points for thought. If you do not already have a security strategy, should you
    do these at the very minimum. More would be better.


    +   1. Be aware that network security is meaningless if you do not have any physical
    security for your systems. Would a social engineer, sent to some corporate raiding,
    go to great lengths to break into your system over the network when she could
    casually walk with a floppy disk, quickly bounce the system and add herself to
    /etc/passwd and /etc/shadow? You''ll notice the reboot, but nothing in syslog
    is going to tell you what happened. Your instance of the operating system isn''t
    the one that made the change. It just knows that it went down'
