    Forwarding without Masquerading Let''s list the sequence of send/respond transaction
    when no masquerading occurs, and then follow the values of the three addresses
    in Table 4.1:


    +   1. Client A wants to set the service running on port y on server B, so it
    builds a packet with B''s IP address as the destination. Because B is part of
    a different subnet, A knows to forward the packet to its gateway, R. It does this
    by setting the destination in the Ethernet frame to R.

    2. R receives the packet and notes that its destination is a remote IP address.
    Because R is configured to forward, it accepts the packet and determines which
    interface to use to forward the packet. It then places B''s address as the destination
    address in the Ethernet frame and sends the packet. (In the general case B is
    several hops away, it determines which gateway is the next hop and sends to it,
    where the same procedure takes.)

    3. Server B receives the Ethernet frame and notes the destination address for
    the packet is its own. Therefore, it accepts the packet and sends it to the process
    which has a socket bound and listening to the destination port y in the TCP packet
    header.

    4. The same procedure is executed for the response. This time, the TCP header
    destination port is x, and the source port is y. The IP header has B as the source
    and A as the destination. The Ethernet frame headers take on the appropriate values
    as the packet makes its way back to client A.


    Forwarding with Masquerading Now take the same situation and configure the router
    to masquerade traffic from subnetA or traffic to subnetB. The following steps
    will occur during a transaction between client A and server B:


    +   1. client send/router receive—A sends a packet to B via its gateway R.

    2. router masquerading—The packet-matching on the router notices that this connection
    should be masqueraded. It builds a new set of IP headers for the packet payload
    in which the source IP address of the packet is replaced by the IP address of
    the forwarding interface on R. R opens a free port, z, and fixes up the packet
    so that it originates from R:z.


    Table 4.1 Protocol Headers During Normal Forwarding

    | src dst | src dst | src dst |

    |---|---|---||

    | A RA A B x y | router forwards |

    | RB B B x y |

    | B RB B y x | router forwards |

    | RA A B y x ='
