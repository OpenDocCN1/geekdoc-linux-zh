    # 8.1 ALLOWING ACCESS TO THE OUTSIDE—PROXYING


    We''ve already discussed the caching HTTP proxy in Chapter 7. This type of proxy
    can increase HTTP performance for your users by saving bandwidth. Although this
    is one reason to deploy proxies, it is neither the only reason nor the original
    reason for proxies. The impetus for the development of proxies was the need for
    security and control. Let''s call these firewall proxies. Like a caching proxy,
    these accept HTTP requests and perform them on behalf of the user. Additionally,
    they perform authentication and access control, who may access sites, and log
    all transactions in (configurable) detail. Firewall proxies are also useful for
    environments where IP masquerading is not possible.


    As you might guess, there are proxies for protocols other than HTTP; almost any
    TCP connection can be proxied. To eliminate having to write a proxy for every
    protocol, there are generic proxies available. (We will talk about the difference
    between generic proxies and protocol-specific layers in this section.) UDP also
    can be proxied, but presents its own challenges. Because it is connectionless,
    you might have to perform authentication for every packet to make sure that the
    person who initiated the packet is the one sending it. A reasonable compromise
    is to specify a timeout for the valid session, as with ticket-gathering security
    models, such as Kerberos. For UDP application protocols—common ones IRC, DNS,
    and some RealAudio applications—there is another form of server which is a generic
    proxy, called a SOCKS proxy. SOCKS, covered in Section 8.1.3 requires a SOCKS
    client (these are common), and offers the possibility of encrypting the internal
    session (between the client and the proxy).


    Any of these proxies may coexist on your Linux router, while others require local
    user accounts, significant disk space, or considerable CPU cycles are candidates
    for their own server. Be informed that some network security policies will be
    altered by the idea of mixing proxies and packet-filtering. In a perfect security-minded
    world, you would have either a firewall that is purely a packet-filter, or a dual-homed
    non-routing machine with only proxies. In either case, the idea is to keep focused
    on the content of forwarding proxies or proxying services, without worrying about
    the order. Of course, the proxies described here are not limited to use on routers,
    but you will often find the functions combined benefit outweigh the security risks,
    as long as you keep your mind on view of what you''re doing. With that word of
    caution, let''s look at some different protocol proxies.


    # 8.1.1 The TI5 Firewall Toolkit—FWTK


    The TIS FWTK (Trusted Information Systems Firewall Toolkit) seems to be the one
    that we started with. (If there were others before it, they were not widely used


    > ¹¹ SOCKS V5 only.'
