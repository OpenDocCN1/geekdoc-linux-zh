    Figure 7.2 Redundant Routing with Multipath


    ```

    ip route add netmask mask \

    nexthop dev wan0 nexth via ip_of_router(B)

    ```


    At the time of writing, the documentation for ip and friends is still a little
    patchy? but the idea is to look at the route as having two parts, nexth dev wan0
    and nexth via ip_of_router.B. If you like, use nexth via gateway for both the
    local and redundant routes, as:


    ```

    ip route add netmask mask \

    nexthop via ip_of_wan0 nexth via ip_of_router(B)

    ```


    For both of the statements, every time this router receives a packet that matches
    net, it rolls the dice. Depending on the outcome, it forwards the packet directly
    over its interface, or forwards it to the secondary router as the gateway. The
    secondary router does not need to know that this is happening. It forwards any
    packets it receives, which will statistically (hopefully) be about 50% of the
    load. You perform the same routine on the other end of the link. I''ve included
    Figure 7. 2.


    Configuring Your Environment for Multipath To complete your system, you need to
    have both routers (on both sides) watching their peers a script something like
    the one introduced in Section 6.4.1. If routerA fails, routerB will need to configure
    an IP aliased interface with routerA''S IP address so that the clients do not
    need to be reconfigured. (The converse is not true, because the clients expect
    routerA to be the gateway.)


    The configuration at the home office (routerC and routerD) is similar. The multipath
    configuration will randomize which link is used. Alternately, you can configure
    remote office routers to perform masquerading. Because the homebound packets will
    be marked with the IP address of the WAN interface on the sending


