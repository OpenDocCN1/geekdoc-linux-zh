    previously in this section. Refer to the documentation; the keywords you need
    query-source listen-on, which are part of the options state. After editing the
    configuration file and restarting the daemon, take a look syslog to make sure
    that the configuration does what you want it to.


    If you would like more information on the topic, or coding your own Internet-capable
    daemons, see the pages for bind(), accept(), listen(), and connect() (all in Section
    2 of the man database), or pick up a copy of the classic and authoritative work
    on the subject by W. Richard Stevens. Unix Network Programming: Networking Apis:
    Sockets and Xti (Volume 1).


    # 8.3.2 HTTP AND NNTP on a Router


    The issues you may have with running a web server on your Internet router are,
    the same as those for DNS, but for the most part, not severe. For one, many HTTP
    daemons also allow you to specify the IP address(es) they should bind to. Even
    if yours does not, people accessing an HTTP server rarely perform a reverse lookup
    on the IP address of the web server to make sure that it matches the forward lookup
    name.


    This may not be the case for other services though, such as NNTP (used for a Usenet
    news feeds). Let''s say that you have the single fixed IP address that your ADSL
    provider issued you, and you have found someone else with an established nameserver
    to provide forward resolution for your domain. When, you connect to www.yourdomain.com,
    their system will query DNS for the IP associated with their name. Their DNS system
    will find your record, and then you return w.x.y.z, the IP address of your ADSL
    interface. So far, so good... but if an upstream news server were to perform a
    reverse lookup on this IP address, it would return someip.at.adsl.provider.com,
    which does not match yourdomain.com. If you connect to an upstream server that
    uses DNS-based access control, be sure to give them the canonical name of your
    system, i.e., the someip.at.adsl.provider.com address.'
