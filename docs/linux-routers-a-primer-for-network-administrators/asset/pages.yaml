  md: '# 6.1 Connecting to the Internet


    # 175


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_198_0.png)


    Figure 6.4 Isolation of Internet Router with an Unroutable Network


    Between the Internet router and the firewall to be a private network, and completely
    unroutable on the LAN (inside of the firewall).


    You should also configure the firewall to reject any traffic with source IP address
    of the Internet router. The effect is that if someone compromised the Internet
    router, he would be no better off than he was from the outside. This works because
    the packet-filtering code on the firewall would be blocking traffic from the Internet
    router''s IP address (i.e., traffic which originated there), and not which was
    forwarded by the Internet router (bears only its MAC address). The firewall''s
    default gateway to the inside is the IP address on the external interface on the
    firewall. The cost for this extra protection is that managing the Internet remotely
    is not possible without introducing some sort of hole in the firewall between
    the management workstation and the Internet router. This might be O.K., but an
    attacker will quickly see the portal to the management system and start attacking
    there. A better idea would be to perform all management of the Internet router
    on the console of the router itself. To keep management tasks to a minimum, you
    could use the LRP distribution, or some other Linux distribution where you can
    prepare the configuration with the relative comfort of your workstation, and hand-lib
    it over to the router. Because security depends upon there being no way to communicate
    directly between the Internet router and the inside, you will have to think about
    how you want to perform logging and system problem notification.


    That concludes our short tour of Internet router topologies. Remember that they
    are not to be inclusive, or even representative, of the most common configurations.
    The first three are probably common, and I''ve used the first two. The fourth
    is to serve as an example of how a little thought on your part can add security
    to this vital portion of your network (however non-intuitive your topology may
    be). A stable Internet router is not worth much if your network is easily compromised.
    Nor is a secure useful if you cannot maintain it. Choosing your configuration
    is really just a bunch of trade-offs, with security and ease of administration
    being diametrically opposed to each other.


    Internet Routes—the “Inside” Versus the “Outside” As I stated before, how you
    configure your routes will depend on your topology. It will, however, consist
    of at least three components: the loopback, the inside, and everything else. Everything
    else is the default route that points out towards the Internet over your spp0
    interface.'
