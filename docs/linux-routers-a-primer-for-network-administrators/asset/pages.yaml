- img_proc: true
  md: 'Dealing with these challenges requires creativity and a thorough understanding
    of your specific environment. Thus, it is difficult to present any sort of comprehensive
    test plan, and dangerous to assume that such a plan exists. Therefore, I present
    a few hints that have helped me in supporting a production environment.


    # ## C.1 BASIC TESTING GUIDELINES


    The complex nature of performing comprehensive testing, here are some precepts
    to keep in mind:


    +   - Don’t do anything having a way to undo it—properly stated, without having
    a fallback plan. This may be as simple as the backup of a configuration file (so
    that you can restore the prior configuration quickly). On the other extreme, you
    may want to load an entirely new system, copy over the pertinent data, and keep
    the previous system around for a week until you are sure that everything is ok.

    - Switches which require a series of changes or changes on multiple systems should
    be “scripted,” meaning that you should take the time to write out each required
    step and in order. It is annoying to promise your users that you’ll be back in
    five minutes, forgetting that rebooting the DNS server first will cause daemons
    on other systems to hang on startup (trying to resolve names). By writing out
    a sequence, you are more likely to catch this sort of dependency. You can also
    retrace your steps if you run into problems, or if someone help you implement
    the change.

    - Testing new DNS functionality, such as load-balancing, is best done with a test
    domain. (This can be a subdomain of your existing domain.) This is doubly true
    for sendmail and MTAs.


    # ## C.2 TESTING: THE BUDDY SYSTEM


    For the network administrator who works in an Internet environment, there is nothing
    more than having a shell account somewhere on the “outside.” Ideally, this system
    would be a Linux box external to your network and your buddy’s firewall. If you
    can establish a rapport with another system administrator whom you can trust and
    who is willing to trust you, each of you can place a utility machine on the outside
    and allow other access to it.


    Having a shell account on the outside is almost indispensable for testing configurations
    as your external clients will see (and for double-trouble too). Examples include
    FTP services, MX records and other associated DNS parameters. If you can see what
    your webpage looks like from the outside, using a graphical browser. But not not
    least, you can probe your own systems for security holes—even Launch full-blown
    attacks against your site to assess security risks. The advantages of this type
    of access are:'
