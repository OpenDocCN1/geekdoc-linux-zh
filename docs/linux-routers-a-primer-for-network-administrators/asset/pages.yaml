  md: '# Oxygen—Internet Router


    Once upon a time, our Internet link was connected with a BigName router. One day,
    this router decided to die in a very poetic “it just will not boot” sort of way.
    In total, it took about an hour to get a technician from BigName on the phone;
    we weiled away the time scrambling for our support ID, wading through the “press
    six if you would like to use our fax-back server” menus, waiting on hold, and
    fending off frantic users. After a short discussion about my abilities to configure
    a terminal program (peppered with a few cut remarks of my own what sort of idiot
    cable was needed to access the BigName router console), the technician decided
    we needed a new motherboard next day. We informed our users of the situation and
    eagerly awaited our package. A package did arrive the next day by the promised
    time. However, much to our dismay, we received a new power-supply and case—no
    motherboard. Now we were in trouble. BigName was going to send us our part, but
    that meant at least 24 hours of downtime. Based on our experience with our Linux
    Frame Relay router, we decided to bring across the T1 line with our spare Sangoma
    S508 cord. We were loaded and configured in about an hour. Everyone took a deep
    breath and let out a sigh of relief—for now we had oxygen.


    Because there is a lot of territory to cover when

    Because there is a lot of territory to cover when connecting a system to the Internet,
    the topic is spread across two chapters. This chapter begins by getting our access
    router up and running using Sangoma’s WANPIPE, this time is for synchronous PPP.
    Then we review general network security for Linux (and Unix in general). Once
    the system no longer has any gaping security holes due to services running on
    it, we’ll


