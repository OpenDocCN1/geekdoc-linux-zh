  md: "preconfigured with a chain for accounting: it is up to you to create one (or).\n\
    The chains it do have are forward, input, output, plus any that you create.\n\n\
    Another difference between 2.0 and 2.2 with respect to IP accounting is that\n\
    ipfwadm accounting \"chain\" allowed you to differentiate specifically\nin, out,\
    \ and both directions for packets. In this regard, it was sort of special. With\n\
    ipchains, you need to create the chains yourself, and you will need to create\
