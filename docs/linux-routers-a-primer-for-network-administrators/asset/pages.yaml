  md: '# 2.3.2 Data Links and Digital Access


    Consider the situation where we have a group of machines in locations A and B—separated
    by 800km—that would like to speak TCP/IP to each other. We''re going to need some
    time to configure our routers so that they can speak to each other and trade packets.
    Unless you have the capability to build the network infrastructure, figuring towers
    to burying cable, bribing the local officials, and who knows what else, you''re
    going to get your bandwidth from some sort of provider. What you purchase, and
    why, depends on myriad factors, let''s try to take this apart, step by step.


    There are many different physical methods of moving from point A to point B. The
    partial list includes fiber-optic cable, copper cable, satellites-ups, microwave,
    coaxial cable, and forms of RF, either through the air, a wire, or some other
    waveguide. What you use is dictated by economics and physics, so unless you can
    build your own network, you do not have control over what will be used. For most
    circuits, your data will end up traveling over a combination of these anyway.
    This should not be an issue unless you have an application which is sensitive
    to latency, which is discussed in Section 2.3.5.


    To establish a link between our sites, we could order a dedicated digital circuit
    which connects them directly to each other. This is known as a point-to-point
    configuration. It is depicted in Figure 2.6.


    In this scenario, we would be leaving 100% of the circuit between the sites and
    could run whatever protocol we like over the link (as it is compatible with being
    used over a digital telco circuit—this type of configuration is also known as
    a back-to-back configuration, because you control both ends, and all of the active
    network elements between them). You also have the full bandwidth of the circuit
    at your disposal, and you can perform whatever type of connection suits you. This
    arrangement is great because we are confident that the only other people who access
    to the circuit are telco technicians whom we trust not to monitor our packets.
    If we even think they are snooping, we can use some sort of encoding or encryption.
    However, with most access circuits, you pay the telco based on the distance between
    the sites and the bandwidth of the circuit. If locations A and B are distant from
    each other, this can become prohibitively expensive.


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_67_0.png)'
