  md: 'If this is time-consuming, or if you would like to quickly test a rule, there

    is an easier option. ipchains the ability to generate test packets which will
    be

    checked against the rules configured in the kernel. Creating a test packet looks

    much like any other command used to enter, edit, or remove a rule. Because the

    Linux kernel is not known for its ability to invent information, you need to specify
    a

    source, a destination, each with a port, a protocol, and the interface which receives

    the virtual packet (for input and forward rules) or the interface which should
    send

    the virtual packet (for an output rule).


