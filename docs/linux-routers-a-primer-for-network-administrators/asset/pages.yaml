  md: '# Example fpipemon Statistics Output


    ```

    zinc:/root> fpipemon -i wan0 -u 9000 -csd 200

    ```


    Information frames transmitted: 837911

    Information bytes transmitted: 354079392

    Information frames received: 810404

    Information bytes received: 118738889

    Received I-frames discarded due to inactive DLCI: 4

    I-frames received with Discard Eligibility (DE) indicator set: 5480

    I-frames received with the FECN bit set: 0

    I-frames received with the BECN bit set: 12223


    The frames and bytes counters are self-explanatory. I-frames discarded due to
    inactive DLCI which come from a DLCI that this router did not know (in our case,
    from DLCI 200). I-frames received with Discard Eligibility (DE) indicator set
    is a count of the number of frames that we received, although they were eligible
    to be thrown away in the cloud if they had encountered sufficient congestion—or
    other words, how many of the received frames by the indicated DLCI were done while
    router was receiving the CIR for it. In the case, 5480 out of 810404, or about
    0.7%. (Not bad.) FECN set for Forward Explicit Congestion Notification. The FECN
    bit is sent to the next host in the Frame Relay network (the cloud) when a router
    is experiencing congestion. It makes sense that this would be zero, since our
    router is leaf node and not situated so that it could be the forward router in
    the cloud. The BECN count is more interesting, as it indicates the number of times
    the provider’s switch told our router it was congested and asked if it could possibly
    throttle what it was sending out the network. If you know that you are never exceeding
    your CIR, yet have received packets with the BECN bit set, then there is a possibility
    that your provider oversold its network.


    # fpipemon Commands–Driver Statistics (a)


    | specifier | meaning |

    | --- | --- |

    | ds | If_Self driver statistics—This option gives you access to the statistical
    variables in the driver related to sends. It can tell you some interesting things
    about what is happening to your packets, especially if you suspect packet loss
    or over foul play. |

    | | interrupt driver statistics—This displays more statistics like those shown
    with da, but these are related to interrupts (which are packet receivers). |

    | dg | general driver statistics—This shows even more driver statistics. |


    Don’t be alarmed if these don’t make a lot of sense to you. They are normally
    used by Sangoma’s technical staff for support and driver debuggings. Still, it’s
    nice to access to the interesting bits.'
