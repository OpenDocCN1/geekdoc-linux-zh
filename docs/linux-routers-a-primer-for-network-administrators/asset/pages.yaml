    # 6.2.4 Port Scanners


    The goal of a port scanner is a program which looks for holes in a server or firewall.
    It is called a port scanner because it walks through the entire list of TCP and
    UDP ports (ICMP, too) trying to find available services or types of traffic which
    are allowed to pass. It also tests the system for known vulnerabilities of services
    and TCP/IP itself. Most of these is famous as Satan, which received a large amount
    of media attention because it was publicly released and effective. At that time,
    people were afraid that releasing such a tool to the public instead of only to
    the network administration community would result in a hash of cracked sites.
    The problem with this logic is that there isnt a very good way to release software
    to only administrators except by making it very expensive, which means that only
    large/rich corporations will be able to afford it—this also assumes that the hacker
    community doesn''t already have this sophisticated or more, which is a poor assumption.
    Since that time, people (seem) to come to understand that the only way to make
    things more secure is to expose their problems, and not cover them up, hoping
    that you''ll get a patch before a script kiddie ruins your day.


    You can (and should) employ port scanners to periodically check your configuration
    and services for weaknesses. If possible, you should run them from the complete
    outside of your network. If you have a good source for access to the outside,
    like a cable modem, you''re in luck. Another alternative is to strike a rapport
    with a system administrator at another organization and work a deal wherein the
    admin sets up a Linux box outside their firewall with a shell account for you,
    and vice-versa. This sort of configuration could be used for more than just testing
    your security. Examples include testing your SMTP gateway configuration, checking
    your external DNS configuration, and verifying that Internet services are functioning
    as they should.


    If you cannot find a system completely external to your site, then a system on
