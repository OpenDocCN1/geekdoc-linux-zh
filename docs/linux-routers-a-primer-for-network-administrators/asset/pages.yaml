    # 6.4 NOTIFICATION SYSTEMS


    Pop quiz: Which is more inconvenient, being paged at 3AM in the morning because
    your organization''s Internet link is down, or coming into the office at 8:30
    to deal with hordes of angry users, a thousand bounced emails, and another 500
    or so in the outbound queue? The answer, of course, depends upon your particular
    situation, but, as uncomfortable as it is, I prefer the former. The more quickly
    a problem is addressed, the fewer negative repercussions to deal with. This section
    is for those of you who need to know when your network is not well. As such, it
    is not applicable to Internet routers. Your instincts may be able to whip something
    clever to signal when there is a problem, but before you start designing your
    notification system, spend a moment and reflect on the following questions:


    +   1. What sort of failures should result in notification? We will call this
    detection.

    2. How would you like to be notified? Are different methods of notification required
    for different types of failures?

    3. How much money and time are you willing to spend to incorporate redundancy
    into your notification system?

    4. What software and hardware are needed to implement the system you require?
    Are they available? Is there a current system in place with which you need to
    integrate?


    Since all of these questions are interrelated, you may find that your answers
    to one change the answers to another. There are several ways to go about notification,
    ranging from simplistic to quite elaborate. Which you choose will be dictated
    by your needs and individual tasks. A word of caution, however, to those who would
    implement a grand sophisticated notification system: How will you know if your
    system fails? For that reason, the simpler and more robust a notification system
    is, the better. Each of the questions above is discussed briefly in this section,
    the last of which reviews some monitoring and notification software for Linux.


