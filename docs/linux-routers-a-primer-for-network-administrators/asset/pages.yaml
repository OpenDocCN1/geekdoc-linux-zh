  md: "# 5.4 TROUBLE-SHOOTING FRAME RELAY WITH WANPIPE\n\nOther monitoring and trouble-shooting\
    \ tools using libpcap which work for Ethernet devices but not for Frame Relay,\
    \ are listed by their Debian names: arpwatch, span, ethereal, ipgrab, libnet-rawip-perl\
    \ (this is not a tool per se, but another library), sniffit, and at last but not\
    \ least, tcpdump.\n\nProblems with Frame Relay links can occur at many points\
    \ along the path between your routers at locations A and B. Effective trouble-shooting\
    \ involves using (often limited information) to deduce the root cause of a problem.\
    \ Once the problem has been located, you devise a strategy to repair the problem,\
    \ and then test the repair. Because WANs span large distances by their very density,\
    \ your strategy is to first determine where the problem is occurring. I use the\
    \ following list:\n\n+   * your router at location A\n* the access between location\
    \ A and your provider's POP near A\n* your provider's router at POP A\n* the network\
    \ between your provider's POPs\n* your provider's router at POP B\n* the access\
    \ between your provider's POP near B and location B\n* your router at location\
    \ B\n\nBecause there are a lot of lists, the first thing to do is to reduce the\
    \ possibilities. The following sections list items you can check at each of these\
    \ locations. They also mention some of the fpipemmon utility, which is more fully\
    \ introduced in Section 5.4.3.\n\n# 5.4.1 Frame Relay Trouble-Shooting—Your Router\n\
    \n+   * Did your router recently reboot? Use uptime to see. Because of the number\
    \ of nodes along the way between locations A and B, it can take 30-40 seconds\
    \ before an interrupted link starts passing traffic again. If you router has rebooted,\
    \ it could be negotiating link parameters and waiting for its peer to notice that\
    \ it is back on the network.\n* Have you recently generated a new kernel for which\
    \ perhaps does not have WANPIPE support? Have you done this accidentally and rebooted?\n\
    * Is WANPIPE started? After stopping and restarting it, are there error messages\
    \ in/var/log/wanpipe.log or syslog? Most.syslog messages are containing the string\
    \ \"wanpipe,\" you can look at them all with grep -i wanpipe /var/log/messages\
    \ | more.\n Use last to determine who has logged into the router and whom to see\
    \ if someone else logged in performing maintenance.\n* Does an ifconfig show the\
    \ interface(s) as up?\n* Does route -n show a routing table entry for the point-to-point\
    \ link?\n* Does route -n show the route(s) for the remote subnet"
