    # 2.4 SUMMARY


    This chapter covered some of the background material which, hopefully, will help
    increase your comprehension of what you are doing as a network administrator.
    The chapter began by defining the difference between a physical (media) protocol,
    a link protocol, and a networking protocol. While the definition presented is
    somewhat informal, the concept should stick in your mind. “Frame Relay is a link
    protocol which ties routers together. “IP” is a networking protocol which supports
    the TCP and UDP transport protocols. V.90 is a physical protocol (used by two
    modems talking to each other an analog telephone line).


