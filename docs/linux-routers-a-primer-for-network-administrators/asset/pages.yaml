    The syntax is straightforward, though the -s does bear explanation. The roundrobin
    scheduling mechanism used in PORTFW is also available for FWMARK, but with an
    extension. If a rule''s preference is set to 0, no scheduling is performed and
    that rule retains its position in the linked-list of rules. If there are other
    rules with non-zero preferences, the zero-preference rule will eventually become
    the first in the list for that, and will stay there. This will remain until you
    force scheduling by invoking ipmasqdm mfw -s. As this matters, whatever is at
    the head of the linked-list will be moved to the back, promoting the rule. An
    application of this is to perform failover from one RADDR to another—set all preferences
    to 0 and if the primary server is detected to be down, force scheduling of the
    rules to select in line.


    Marking packets with ipchains is not difficult either. You mark them with an integer
    value using -m markvalue. Below is a sequence of commands that will enforce a
    policy like the one we described at the beginning of this subsection.


    ```

    # kernel firewall forwarding for web access

    #

    # use these symbolic names to keep everything simple

    MARK_FRIEND=1

    MARK_NEUTRAL=8.3.0/24

    FRIEND_SVR=192.168.17.36/32

    NEUTRAL_SVR=192.168.15.46/32

    # mark packets as they enter the system

    ipchains -input -s $(FRIEND) -m $(MARK_FRIEND)

    ipchains -input -s ! $(FRIEND) -m $(MARK_NEUTRAL)

