    # LINUS ROUTER SHOOOTOUT!


    > Several people have suggested conducting a benchmark to determine the relative
    speed of Linux routers compared to traditional offerings. This is a good idea
    because I believe it would alloy the fears of those reluctant to consider Linux
    as a router. On the other hand, speed is only part of the equation, since Linux
    offers low cost and flexibility. Furthermore, speed is relative; a couple of milliseconds
    may be bad news for a gigabit switch, but it''s peanuts for a 128kb ISDN link.


    # 1.1.9 Bus Architecture


    There is a lot of theory that goes into a discussion about the relative strengths
    of the different architectures. In the final analysis, I think it boils down to
    the following points:


    +   - PCI >> ISA 16-bit > ISA 8-bit (where means "is faster than"), so use PCI
    adapters when possible. Hopefully, there are not many 8-bit ISA Ethernet cards
    out there, but if there are, find some other use for them besides being in your
    router.


    +   - Interrupts are important—you should particularly avoid having an Ethernet
    adapter at a lower interrupt priority than a slow device, such as a parcel or
    serial port. Typically, interrupts 3, 4, 5, 7, 9, 10, 11, and 12 are available
    to you. The relative priorities, from highest to lowest, are 9, 10, 11, 12, 3,
    4, 5, and 7^4


    # 1.1.10 RAM


    You should have enough RAM to ensure that your router will not be swapping at
    any point during normal day-to-day operations. This means at least 8 MB for a
    plain router and definitely more if you intend to run other services or any monitoring.
    Of course, faster memory is better (e.g., using 8ns DIMMs instead of 70ns SIMMs).


    ^4 For more information about interrupts, see http://www.linuxdoc.org/LDP/LG/issue38/blanchard.html.'
