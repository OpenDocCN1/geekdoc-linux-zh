    be the Internet router or a firewall.


    Preference for Two Equivalent Routes Note that the table is sorted in reverse
    order by the number of bits in the Genmask field (just as it is on a workstation).
    The kernel checks each entry in the table against the destination IP address of
    the packet it received, and it forwards the packet on the first match it finds.
    This means that (static) routes to the same destination are not used if you have
    static routing. In the case of a tie—two entries with identical Destination and
    Genmask—the one with the lower metric value is chosen. Should the metrics be equal,
    the more recent entry is chosen. The kernel does not remember when the entries
    were made for static routes, but it knows that when someone enters a route equivalent
    to an existing route, the intention is most likely to use the new route. This
    is convenient if you need to temporarily route around a particular gateway or
    have some testing in mind. You can enter the temporary route, and it will be used.
    When you delete it, the previous route is used.


    Unroutable Each of the other routers also have routing tables for the network(s)
    and host(s) it is expected to forward. If they don''t, they will either use their
    default route, or, if no default route exists, they will reply with an ICMP: unreachable
    message. The pathological case is when route points back to the sending router,
    which forms a loop ( Router A to Router B, and so on...). IP packets contain a
    TTL (Time To Live) field which is decremented every time the packet is forwarded.
    Eventually (actually, very quickly), the packet will be discarded. Nonetheless,
    such misconfigurations mean that the packet will not find its destination, which
    results in performance degradation for correctly routed packets on the network.
    Just Say No to routing loops!'
