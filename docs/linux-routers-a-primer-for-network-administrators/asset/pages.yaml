    this directory as $LRP throughout the session. The command path assumes that you
    downloaded LRP with the directory tree intact. Take the LRP modules disk (which
    is already low-level formatted), insert it in your floppy drive, and create a
    MS-DOS filesystem on it with mformat a: Once this is done, mount the filesystem
    with mount -t mdos /dev/fd0 /floppy. Now, with our floppy ready to go, we are
    going to load it with pre compiled modules from the LRP distribution.


