- img_proc: true
  md: '# 5.3 Linux and WANPIPE for Frame Relay


    Each of the PVC is issued an IP address, and the PVC itself can be treated like
    a network with only two nodes. (In fact, you can configure the point-to-point
    link to a network with zero nodes by specifying a subnet mask of 255.255.255.
    See Section 5.3.5 for more information on this method.) For each interface [interfaces],
    there is a file bearing its name in /etc/wanpipe/interfaces/ or /usr/lib/router/interfaces/
    for non-Debian. For our example file, that means /etc/wanpipe/interfaces/wan0
    and /etc/wanpipe/interfaces/wan1. Looking into this file, you will find:


    ```

    zinc:cat > /etc/wanpipe/interfaces/wan0

    #!/bin/sh

    BOOT=yes

    IPADDR=202.1.1.1

    NETMASK=255.255.255.0

    BROADCAST=202.1.1.255

    POINTPOINT=202.1.1.1.2

    NETWORK=

    GATEWAY=

    ```


    The file is sourced by the startup script (hence the #!/bin/sh, which is just
    a reminder that the file must Bourne shell syntax). Actually, you do not need
    to worry much about the syntax because there is a utility which will create the
    file for you. /usr/bin/wanpipeconfig (Debian) or /usr/lib/wanrouter/Configure
    (non-Debian) will interactively query you for the values you want to place in
    this file and the [wan]router.rc. (Debian uses router.rc). The parameters are:


    **ONBOOT**[yes or no]---This can be used to temporarily disable an interface without
    having to remove it from wanpipe.conf. Otherwise, it should be **yes**.


    **IPADDR**—The IP address of your side of the point-to-point link representing
    the PVC.


    **NETMASK**—The mask of the “network” between the two routers.


    **BROADCAST**—The broadcast address for the “network” between the two routers.


    **POINTPOINT**—The IP address of the router on the other side of your PVC. Your
    counterpart should have the same values reverses


    **NETWORK**—A network address (alternately, a name from /etc/networks) to be added
    to the routing table upon starting the interface. There is no way to specify the
    subnet mask with this, so you are limited to natural class A, B, or C networks,
    and you may specify only one network. Because of these limitations, I opt for
    placing my networks elsewhere. For the Debian version of WANPIPE, put them in
    /etc/wanpipe/wan_routes.


    **GATEWAY**—A gateway address which will be used for the network above. Once again,
    due to the limited functionality, I would ignore this parameter and leave it blank.'
  merge: -1
