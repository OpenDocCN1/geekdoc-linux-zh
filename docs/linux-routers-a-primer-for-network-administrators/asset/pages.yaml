- img_proc: true
  md: "# Erbium's Design\n\nAll we need to do is find out which devices are locked,\
    \ and fix up the options file to use one of these. The result is a function which\
    \ uses sed to fix the options file before the link is dialed. The function is\
    \ added to the beginning of the code snippet; the code below it is called as part\
    \ of the dial case.\n\n```\nMODEMS=$ttyS0 ttyS1# # list of available devices\n\
    # function to walk the list of MODEMS to see which\n# have lock files\nFind_Free_TTY()\
    \ {\n  FREE_TTY=\"none\"\n  for TTY in $1\n  do\n    if [ ! -f /var/lock/LOCK..$(TTY)\
    \ ]; then\n      FREE_TTY=$(TTY)\n    fi\n  done\n  echo ${FREE_TTY}\n  return\n\
    }\n# a cheap hack to find a free modem\nMODEM=$(Find_Free_TTY $MODEMS)\nif [[\
    \ $MODEM == \"none\" ]]; then\n  Error \"Sorry... all modems are currently in\
    \ use\"\nelse\n  # fixup the options file with the right tty\n  cp -p $OPTFILE\
    \ $OPTFILE.preset\n  echo \"s//dev/ttyS/*/MODEM/* >$SEDFILE\"\n  cat $OPTFILE.preset\
    \ | sed -f $SEDFILE >$OPTFILE)\n```\n\n# 3. Now add routes and configure masquerading.\
    \ This is done by calling an additional function. First, routes are added to the\
    \ local system, then masquerading is configured and then routes are added to silicon.\
    \ Tearing down a connection is the same set of steps in reverse.\n\n```\nSetup_Connection()\
    \ {\n  # assert: $TARGET is a global, and is set\n  case $TARGET in\n    client1)\n\
    \      route add -net 10.34.2.0 netmask 255.255.255.0 $DEV\n      route add -host\
    \ 209.54.2.2 $DEV\n      ipchains -A forward -j MASQ -i $DEV\n      ssh silicon\
    \ route add -net 10.34.2.0 \\\\\n      netmask 255.255.255.0 gw erbium\n     \
    \ ;;\n    client2)\n      ;\n    esac\n}\n```"
