    of a G flag in the Flags field.

    2. All packets for the network 127.0.0.0/8 are sent out via interface lo. This
    is known as the loopback interface, and it is reserved for sending packets to
    the local.

    3. Any other packet will be forwarded to the gateway address (192.168.18.1), which
    is accessible via interface eth0. If you look at the Destination field, you will
    notice that the network is 0.0.0.0 with a Genmask of 0.0.0.0. This matches every
    packet, and is known as a default route.


    When the kernel encounters this, it notices that the G flag is set, which means
    that the packet is to be sent to the IP address using the Gateway field for forwarding.


    Note that the table is sorted in reverse order by the number of bits in the Genmask
    (subnet mask) field. This is because the kernel walks the table in most-to-least
    restrictive order (the last entry will always be the default route). As soon as
    a suitable Destination and Genmask (really, subnet mask mask) pair is found, the
    packet is sent via that interface. The routing table on a router functions exactly
    the way, which is the topic of the next section.


    # 2.1.4 A Gateway''s Routing Table


    To forward packets, a router consults its routing table like a workstation and
    sends the packet on its way over the appropriate interface. Where a router differs
    from workstation is that in the Linux kernel, the router will accept packets destined
    for its Ethernet address, with IP destination headers pointing somewhere else.
    A machine without routing might accept these packets from the wire (because of
    the correct Ethernet address), but would then discard them if it discovered that
    they were not destined for its IP address. The router knows that its job is to
    forward, so it accepts the packet and examines its headers to find out where it''s
    headed. A routing table on a router like this is and is taken from the router
    depicted in Figure 2.3.'
