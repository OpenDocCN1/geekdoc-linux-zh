  md: '# Dynamic Routing Daemons


    # HINT: ZERO-NODE NETWORKS REVISITED


    You may recall back in Section 5.3.5 that we said that we could "stretch" a subnet
    to include a WAN interface on the other end of a point-to-point link. We did this
    by assigning an address out of that subnet to both the near and far end of the
    point-to-point, using a subnet mask of 255.255.255.255. The motive was to save
    address space by not assigning a distinct subnet to the link itself. Because network
    interfaces are known to the kernel by their names, not just by their IPs, two
    different interfaces on a single system may have the same IP address. This makes
    the most sense for Internet routers and other WAN routers, where the distinction
    between the WAN interface and the Ethernet interface is necessary for only the
    routing table. In other words, users of the system don''t care about the interfaces
    they are using.


    The Linux kernel will take you one step further. Because interfaces are known
    to the kernel by their names, not just by their IPs, two different interfaces
    on a single system may have the same IP address. This makes the most sense for
    Internet routers and other WAN routers, where the distinction between the WAN
    interface and the Ethernet interface is necessary for only the routing table.
    In other words, users of the system don''t care about the interfaces they are
    using.


    To use this, assign the IP address to the Ethernet interface along with its regular
    subnet mask. Assign the same IP address to the near end of the point-to-point
    and use a subnet mask of 255.255.255.255. (The far end of the point-to-point can
    share the IP of its router''s Ethernet interface, too.) Presto—no more worries
    about two IPs in DNS, or IP-based authentication confusion!


    # 8.4 Dynamic ROUTING DAEMONS


    For some applications, it is not possible to manually configure your routing table
    with a series of route add statements. It may be that the entries will frequently
    change, or that there are so many entries you cannot enter all by hand. Or you
    might find typing routing statements into scripts and having to maintain those
    scripts on all of your systems tedious. There are several alternatives to set
    up your Linux router for dynamic routing. Daemons which read their configuration
    from local files, listen for routing updates on a network socket, and periodically
    broadcast their routing table over their interfaces to their neighbors. Machines
    interested in routing information will receive these broadcasts and update their
    routing tables accordingly. In this manner, you will not have to type in of anything,
    and as long as everything is configured correctly, your network should quickly
    converge under a stable routing configuration.


    Before you load one on your router, understand that they are not for everybody.
    Certain types of network topologies lend more readily to certain routing protocols;
    others do not lend to being managed by daemons at all. If you are new to routing
    protocols, you should do some homework with a book before you crank one up and
    bring down your network. Also keep in mind that for many topologies, a well-designed
    internal network can be managed with static routes with less overhead and greater
    ease than these daemons. But that is admitted as a matter of opinion.


    > Thanks to David Mandelstam for sharing this tidbit with me. I wish I had known
    sooner!'
  merge: -1
  pgno: 300
- img_proc: true
  md: '# 8.4.1 The routed Routing Daemon for Linux


    Routed is the original, if you will, of routing daemons. It supports RIP, the
    Routing Information Protocol, which was originally designed by Xerox and implemented
    by the program GWININFO. This was renamed routed and brought to the mainstream
    Unix-world via BSD 4. It is originally described in RFC 1058 (which is known as
    RIPv1), and the variants RIPv2 (RFC 1388 — 1723 → 2453) and RIPng for use with
    IPv6, documented in RFC 2080). The version distributed with Linux covers RIPv1.


    If you want to load it on your system, check to see if it is already there. It
    is part of the NetKit for Linux and is typically distributed as part of the base
    installation. Under Debian, it is part of the netstd package. By default, it is
    disabled, but you can enable it by editing /etc/init.d/netsd_init and then starting
    the service with /etc/init.d/netsd_init start.


    Configuring routed There is no configuration file per se, but there are a few
    options you might want to modify. You can set these in netsd_init so that they
    will be set to your liking the next time that you stop and start the service.


    +   -d enables debugging, which will log some extra information via syslog (by
    default into /var/log/syslog).

    - -g instructs the daemon to advertise routing information about its default route
    gateway (if it has one). Use this with care, as your topology might not take well
    to having one default route replaced with another.

    - -s |-q control whether or not routed will generate information about its machine''s
    interfaces and routes. The choice is to either (-s) or remain quiet (-q). Note
    that the default is for machines with multiple network interfaces (i.e., routers),
    and to remain quiet on machines with a single interface. Each switch will override
    the default behavior.


    In addition to these switches, you can affect routed by configuring the file /etc/gateways,
    which is when routed starts. Each line in /etc/gateways indicates whether a certain
    gateway should be considered passive, active, or external.


    +   - An active gateway is treated like any other active interface on the system,
    i.e., routing information about it is shared with others, and an entry for it
    is entered into the routing kernel.

    - A passive gateway will be added to the routing table, but it will not be broadcast
    as part of the RIP packets.

    - An external gateway is never advertised nor added to the kernel''s routing table.


    A line in /etc/gateways very closely corresponds to a route add statement, as
    you can see in the following format (or by reviewing the manpage for routed):


    ```

    <nethost> destIP gateway gwIP metric value <passive|active|external>-

    ```'
  merge: -1
  pgno: 301
