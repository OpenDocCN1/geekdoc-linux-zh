  md: '# Building the Linux Kernel


    Many of you are already familiar with Linux and dealing with the kernel. For you,
    there will be nothing new or interesting in this section. But for those of you
    who may be reading the book with less exposure to Linux, read on. This section
    covers the basics of retrieving, building, and patching the Linux kernel.


    Although one of the best-scripted and finely-done parts of Linux, compiling the
    kernel seems to be a very daunting task for a newcomer. Fortunately, it only seems
    that way. Many of the Linux distributions come with their own mechanisms to compile
    the kernel, and even kernel source as a package. I prefer the “old-fashioned”
    way of building the kernel, which is the method I will present here. It is a matter
    of a few easy steps.


    +   1. Prepare your system for the kernel build process.

    2. Obtain a copy of the kernel source.

    3. Update or patch the kernel source as required.

    4. Configure the kernel.

    5. Compile and install the kernel.


    Preparing Your System to Build the Kernel To build a kernel, your system needs
    two things—the tools required to build the kernel and enough disk space underneath'
