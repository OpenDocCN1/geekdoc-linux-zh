  md: 'Linux and WANPIPE for Frame Relay


    # 5.3 LINUX AND WANPIPE FOR FRAME RELAY


    In this section, we build a Frame Relay router using Linux, a Sangoma S508, and
    Sangoma’s WANPIPE³ software. We will assume that the link has been ordered and
    correctly positioned by our Frame Relay provider, and the link on the other side
    is up and running, waiting for our router to come online and complete the project.
    (If this is not the case, configuring two routers for Frame Relay is not any more
    difficult than configuring the first one.) The first time the configuration is
    presented as a quickstart. For those who are experienced with Linux and Frame
    Relay, this should be enough to attach to the cloud and start running. The sections
    following the quickstart cover the configuration in more detail, and Section 5.3.3
    explains WANPIPE’s main configuration line by line.


    # 5.3.1 Frame Relay Router Quickstarts


    Here are two recipes for zinc. The first uses Sangoma’s WANPIPE software as it
    is distributed from your site and is suitable for all Linux distributions. The
    second is for Debian users and takes advantage of the wanpipe package, a pre-compiled
    version of the WANPIPE software with some modifications to make it compliant with
    Debian’s filesystem layout. Both versions result in identical functionality.


    # WANPIPE''


    +   Retrieve the latest WANPIPE tarball from fip://ftp.sangoma.com/linux/ and
    extract it in the root directory of your filesystem.

    Execute the script /usr/lib/wanrouter/Setup. This script guides you through setting
    up a default configuration file for your protocol (Frame Relay), installs the
    kernel patches, and builds the tools, if it can.

    Compile the kernel, selecting the following options in addition to whatever you
    need to support your NIC and other essential devices.


    ```

    Network options ---

    [*] IP: forwarding/gateway

    <M> WAN router

    Network Device support -----

    WAN Interfaces -----

    [*] WAN drivers

    <M> Sangoma WANPIPE(tm) multiprotocol cards

    [*] WANPIPE Frame Relay support

    ```


    After you have built the new kernel, reboot. If you receive any warnings during
    the building of the tools, execute this phase of the Setup again with /usr/lib/wanrouter/Setup
    c.

    Open up /etc/wanpipe1.conf with your favorite text editor and edit the [interfaces]
    section to correspond to your PVCs, and the [wanpipe] to match your card and the
    physical parameters of your link.


    ³ WANPIPE™ is a trademark of Sangoma Technologies, Inc.'
