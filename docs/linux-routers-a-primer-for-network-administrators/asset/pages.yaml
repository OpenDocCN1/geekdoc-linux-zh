  md: '# Dynamic Routing Daemons


    One final comment about the routed process itself. It does not fork and detach
    itself from the shell where you start it (i.e., it doesn''t daemon). If you start
    it in the foreground and want to detach it from your terminal, you can CTRL-Z
    and then the command bg. Another thing you should know about routing is that it
    will make its own entries into the routing table as it fits for anything that
    isn''t marked external, regardless of what is currently in your running routing
    table. If you have static routes already set up, this is an annoyance, so you
    will either want to adjust/etc/gateways or quit the fence—use static or dynamic
    routing, but not both. You may notice that routed creates entries for net routes
    for directly attached networks the traditional way, with an explicit gateway IP
    address. This will look either peculiar or familiar to you, depending upon whom
    you earned your router wings.


    ripquery Say that you would like to know what a router routed is advertising to
    the world (without running one of the packet sniffers covered in 4.5). You can
    use the ripquery command to get the contents of that system''s routing table according
    to routed. If you are on the router itself, issue the command ripquery localhost.
    For a remote route, use the hostname or IP address of that router in place of
    localhost. The command also supports a single switch


    -n is the ubiquitous name lookups. On my setup, this seemed to be of little use
    except to prevent name ??? from being spit out each line in the results of the
    query. No amount of prodding of /etc/networks or /etc/hosts or their associated
    configuration files seems to help. (You should be able to recognize the subnets
    returned by the query anywhere.)


    Additional information about routed can be found by reviewing the applicable RFCs
    or the source code itself. Remember that it is part of the NetKit when you go
    to look for it.


    # 8.4.2 The Zebra Routing Daemons for Linux


    Zebra is the name of the first-featured routing daemon to gain a popularity and
    is 100% free (GPL). At the time of writing, it is still beta software, but it
    is functional. It is being developed by some talented programmers and could surely
    use the support of the free software community to test and contribute patches.
    Taken from the website at http://www.zebra.org:


    GNU Zebra is a free software (distributed under GNU Public License) which manages
    TCP/IP routing protocols. It supports BGP–4 protocol as described in RFC 1771
    (A Border Gateway Protocol 4) and RIPv1, RIPv2 and OSPFv2.


    Zebra uses multi-thread technology under multi-thread supported UNIX kernels.
    However, it can be run under non-multi-thread supported UNIX kernels.'
