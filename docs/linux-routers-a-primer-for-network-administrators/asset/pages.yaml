    If you see outgoing traffic, but no incoming traffic, the card thinks that the
    access is O.K. Perhaps the problem is with your provider''s equipment, or with
    the access on their side. When cannot talk to the provider''s router, WANPIPE
    marks the circuit as down in /var/log/messages it does not receive any replies
