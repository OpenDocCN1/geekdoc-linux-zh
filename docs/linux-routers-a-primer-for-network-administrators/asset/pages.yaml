  md: "# Configuring IP Masquerading\n\nipchains -R chain n rule replaces the nth\
    \ rule for chain chain with the new rule specified by rule. (Rules are numbered\
    \ starting at 1.)\n\nipchains -D chain n deletes the nth rule from chain chain.\
    \ If you'd rather specify it explicitly, use it in place of the number.\n\nipchains\
    \ -I chain n rule inserts the rule given into the nth position for chain chain,\
    \ moving each of the existing rules down. (Rules are numbered starting at 1).\
    \ Omitting the first argument defaults to the first position in the list.\n\n\
    # Viewing IP Masquerading Rules with ipchains You can view the counters associated\
    \ with rules by listing (-L) on a chain along with switches to increase the amount\
    \ of detail (normally -v, -n, and -x).\n\n```\n### list masquerading rules\n###\
    \ (headers/output split into two lines)\nerbium:/root> ipchains -L -n -v\nChain\
    \ forward (policy ACCEPT: 33 packets, 1686 bytes):\npkts bytes target prot opt\
    \ tosax if mark outsize\n33 1686 MASQ all ----- 0xFF00 eth0\nsource destination\
    \ ports\n0.0.0.0/0 0.0.0.0/ \n```\n\nSome details about viewing the rules:\n\n\
    +   - -n prevents name resolution from occurring.\n- -v makes the output more\
    \ verbose, adding the packet (pkts) and byte (bytes) counter fields, the interface\
    \ field (idname), the TOS mask (tosa and to), and the mark and outside fields.\n\
    - -x is useful only in combination with -n. It prevents conversion of the byte\
    \ and packet counters into larger units of K, M, or G.\n- If you do not specify\
    \ a chainname, all chains will be listed. If you want only to see rules which\
    \ after masquerading, grep the output for MASQ.\n- If you do not specify the verbose\
    \ switch, you will not see the interface field (an oversight, in my opinion),\
    \ which is important unless you do all of your masquerading based solely on source\
    \ or destination address.\n\n# Viewing Active Masqueraded Connections You may\
    \ view the current list of masqueraded connections with ipchains. The syntax is:\n\
    \n```\nipchains -M -L [-n] [-v]:\n```\n\n+   - The -n (once again) switch switches\
    \ hostname and port lookups. Its use is optional.\n- use -v (verbose) if you would\
    \ like to use the initseq delta prev fields in the output.\n\n```\ninitseq — the\
    \ initial sequence number\ndelta — the difference between the client's opinion\
    \ of the current sequence number (read from its most recent packet) and the server's\
    \ opinion of the current sequence number.\nprev — the previous delta value\n```"
