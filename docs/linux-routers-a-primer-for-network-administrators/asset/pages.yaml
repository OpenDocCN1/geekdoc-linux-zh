  md: '# 200 \— Oxygen—Internet Router Chap. 6


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_223_0.png)


    Figure 6.8 Providing a Secure Environment for an FTP Proxy


    But before we can write the packet-filtering rules to block direct FTP (or any
    protocol), we need to understand how the protocol works:


    +   - FTP in “normal” mode


    +   1. The client uses a client port (a port in the range between 1024 and 65534)
    to contact the FTP server on port 21. This is called a control connection.

    2. Authentication occurs over the control connection, as any client-issued commands
    and server acknowledements of those commands.

    3. However, if one of the commands results in a data transfer (including getting
    a directory listing), then the client prepares for it by opening a second client
    port and sending this port number to the FTP server over the control connection.

    4. The FTP server opens a connection from port 20 on the server to the second
    client port on the client system. This port is used to transmit the data.


    Because you do not know the port to allow for the data transfer beforehand, you
    have to allow all external sites to use port 20 to connect to your internal clients.
    Thus anybody on the outside can probe your network by sending packets from port
    20 on their system.


    +   - FTP in passive mode


    Because of the dangers of normal FTP, some bright people came up with the idea
    of passive mode FTP, which works as follows:


    +   1. The control connection works as before. However, when a data transfer is
    initiated, the client asks the server to open an additional port on the server
    for use by the data transfer.

    2. The server finds a free port and sends this value back to the client over the
    control connection.

    3. The client then makes an outbound connection to the port the server just gave
    it, and the data transfer takes place over this connection.'
