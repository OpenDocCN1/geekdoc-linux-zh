  md: '# 4.1.4 Kernel Support for PPP


    To be able to use any any of these, you will need PPP support in your kernel.
    The default kernel supplied with most Linux installations should already have
    this compiled into it. When you reconfigure the kernel, do not forget to include
    PPP support, which is the single option PPP (point-to-point) support under the
    Network Device handling. If you compile PPP support into the kernel as a module,
    realize that it is part of a dependent stack, load it with modprobe. Because I
    used to always forget to load the bsd_comp module (which provides software compression
    if it is supported on the other side), I just modprobe bsd_comp, which loads everything.
    On a 2.2.x system, the modules loaded are:


    ```

    ppp_deflate 38516 0

    bsd_comp 3468 0

    ppp 19324 2 [ppp_deflate bsd_comp]

    lslc 4128 1 [ppp]

    ```


    # 4.1.5 Using Debian''s PPP


    O.K., now that you have compiled support in the kernel for each client and have
    loaded the PPP modules, you need to configure a dial-up link for each client.
    We''re going to use these configurations in the dial-out script we write for ours.
    Debian''s PPP package comes with handy commands: pon and poff. Despite their funny
    names, they are useful abbreviations for the most common tasks involved with PPP
    links—bringing them up (pon) and shutting them down (poff). A third command, log,
    will tail the last bits of /var/log/ppp.log so that you can see what is going
    on. Their usage is simple.


    +   - pon takes argument, the name of the link to dial. This is the same name
    of the file which appears in /etc/ppp/peers/, and is the name you give while configuring
    it with ppconfig. If you do not specify an argument, the PPP peer of "provider"
    is assumed.

    - poff can take several options followed by the name of the link to disconnect.
    See poff for details. Be aware that without any options, it kills all active ppp
    connections.

    - log displays the last 10 lines of /var/log/ppp.log so that you can see what
    is happening. ppconfig by default configurations of all your PPP option files
    (the files in /etc/ppp/peers/) with the keyword debug, so there should be something
    in the file. log optionally takes any argument that tail takes. Of these, -f to
    follow the file is probably the most useful.


    Configuration of PPP links can be frustrating. When things don''t work, sometimes
    it is not abundantly clear how to fix them. Be sure to use the documentation resources
    at your disposal before you get too irritated. Unlike as it may seem, someone
    else has already run into the problem you are experiencing; hoping they were thoughtful
    to share their experience in a HOWTO somewhere. The documentation in /usr/share/doc/ppp
    can be very helpful. There are several HOWTOs as part of the LDP cover PPP, modems,
    serial ports, etc., in detail.'
