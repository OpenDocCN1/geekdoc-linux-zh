    through my head. At a previous employer, was the pat answer to all of my queries
    as when we could try to Linux out in our product evaluation lab. Admittedly, that
    was early on, but some of that mentality remains, and I am happy to contest that
    statement as I was.

    This book has how to get Linux routers running and keep them running. But this
    is little if you never have a chance to test and deploy them. If you work for
    an organization where you are the primary decision-maker for technology, you''re
    fortunate. Many companies make technical environments by committee, politics,
    tradition, and treachery. This section contains a few thoughts about why it makes
    good business sense to have Linux in your production environment.


