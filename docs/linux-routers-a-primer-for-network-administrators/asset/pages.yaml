    **Figure 6.1** Perimeter Internet Net Router Topology


    explained below), which cover a few of the possibilities for topologies, but really
    only begin to scratch the surface. This book is not the right forum for a detailed
    analysis of firewall topologies; I heartily recommend *Building Internet Firewalls*
    by Chapman and Zwicky (see the Bibliography for the complete reference) if you
    require this sort of information.


    My idea of configuring routes on an Internet router is to make it the ultimate
    authority on what networks exist inside your network, but to necessarily advertise
    that information to the world (aside from what the world already knows because
    of your presence on the net). This way, everyone on the inside can use the router
    (indirectly as a gateway), and trouble-shooting is easy. If you intend to proxy
    all services you provide your users, allowing no masquerading (of users) or direct
    bound connections (perhaps with a topology like in Figure 6.1), then you''ll want
    to do something else. For a few ideas, briefly review each of the topologies in
    this section, starting with Figure 6.1, which we will call the **perimeter net
    topology**.


    This topology separates the functions of the Internet router and the firewall
    (although you may also perform firewalling on the Internet router, too), which
    makes the configuration of both easier. The **perimeter net** is the network between
    the Internet router and your firewall, on the **perimeter of your network**. This
    is a good place to place your external DNS server, SMTP gateways, and external
    web servers. The firewall can function as a packet-filter, perform masquerading,
    or both. You may want to place proxy servers on the perimeter net (so that users
    may access the proxies only through the firewall).


    The Chapman and Zwicky book refers to these external hosts as *bastion hosts*.
    The idea is that if someone were to hack into them, they are located outside of
    the firewall, so crackers³ would be limited in the network attack they launch
    against your corporation, although much better than they were before.... For this
    reason, you shouldn''t be storing the secret formula or any other secrets on the
    perimeter net. You should be prepared for the worst case, that these systems will
    be completely destroyed by an attack from the outside. (You always have your backups,
    right?)


    > cracker refers to a person of malicious intent.


    ³ The term hacker means good programmer, and'
