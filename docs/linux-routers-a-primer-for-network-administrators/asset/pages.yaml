  md: '3. router forward/server receive—The newly messaged packet is forwarded to
    $B$.


    4. server reply/router receive—$B$''s server process receives the packets and
    builds a packet to reply to it. The reply is to $R$ at port $z$, because these
    are the source values $B$ sees in the packet headers. $B$ puts this on the wire
    to $R$.


    5. router unmasqueraded—The kernel on $R$ recognizes the packet as a response
    to a previously masqueraded send by the destination $IP$ and port tuple $(R, z)$.
    When it opened the socket corresponding to port $z$, it left special instructions
    to forward responses to that port $A$ at port $x$. Therefore, $unmasquerades$
    the packet by fixing the headers and then forwarding it to client $A$. The fix-up
    replaces the source IP address to be that of $B$, and the sending port to $y$.


    6. router forward/client receive—$R$ puts the packet on the wire. $A$ receives
    the server response, which automatically appears to have come directly from the
    server at $B$. Neither $A$ nor $B$ is the wiser.


    In summary, forwards fixing the link-layer headers, while masquerading is the
    act of fixing up network-layer headers (IP address) and transport protocol-layer
    headers (port). Table 4.2 and Figure 4.3 illustrate the step-by-step exchange
    explained above. The items in the table which are changed by the masquerading
    router are marked.*


    # Table 4.2 Protocol Headers while Masquerading


    | | | | | | |

    |---|---|---|---|---||}{

    | | src | dst | src | dst | src | dst |

    | 1) | $A$ | $R_A$ | $A$ | $B$ | $x$ | $y$ |

    | 2) | | | router masqs | | |

    | 3) | $R_B$ | $B$ | $R_B^*$ | $B$ | $z^*$ | $y$ |

    | 4) | $B$ | $B$ | $B^*$ | $R_B$ | $y$ | $z$ |

    | 5) | | | | router unmasqs | | |

    | 6) | $R_A$ | $A$ | $B$ | $A$ | $y$ | $x^*$ |


    The values reported in the tables are the same values you would see in the output
    of a packet sniffer (in Section 4.5) if you traced a transaction. In this case,
    there are four points where you could monitor the packet flow (at $A, R_A, R_B$,
    and $B$). If you were to watch all four, you would see that both interfaces on
    $subnet_A$ see the same traffic, as both interfaces on $subnet_B$. I point this
    out to show that the kernel modifies the packets $in-between$ the interfaces—i.e.,
    while it internally forwards the packet from one interface to another. The upwing
    is that you can perform your monitoring directly on any interface on the masquerading
    router.'
