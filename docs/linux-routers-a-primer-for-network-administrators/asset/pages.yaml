    Having these in DNS also helps any IP-based authentication mechanism utilized
    reverse lookups.


    +   2. Packets to and from point-to-point IPs will be recognizable to all by their
    IP addresses.


    +   3. Say that you are logged onto router B and want to talk to a workstation
    in network A. You know how to route A–is it over the Frame Relay link. This means
    your packets will have a source address of 192.168.18.3 (not 192.168.18.1, as
    you may assume). When the workstation in network goes to reply, it can easily
    find 192.168.18.3, since this is one of the machines in just B (If you had used
    a separate network for the link, then the workstation in A might not have been
    able to find you, or at all)


