  md: '# Let''s configure eth0 first:


    silicon://root> ifconfig eth0 192.168.16.1 broadcast 192.168.16.255 \

    netmask 255.255.255.0 up


    Verify that the device is properly configured by entering ifconfig eth0. The results

    should look like:


    ```

    silicon://root> ifconfig eth0

    eth0 Link encap:Ethernet HWaddr 00:60:97:DA:8D:91

    inet addr:192.168.16.1 Mask:255.255.255.0

    UP BROADCAST RUN MULTICAST MTU:1500 Metric:1

    RX packets:216 dropped:0 overruns:0 frame:0

    TX packets:2 dropped:0 overruns:0 carrier:0

    collisions:0 txqueuel:0

    Interrupt:11 Base address:0xff0

    ```


    If the interface settings do not look correct, you can run ifconfig repeatedly
    until

    things are right. Let''s look at the output listed line-by-line to learn about
    the

    command and what parameters controls.


    **Line 1** shows the interface name, type of the interface, and the MAC address
    of the

    interface. There is nothing on this line which is controlled by ifconfig (for
    an

    Ethernet card).


    **Line 2** shows the IP address, broadcast address, and subnet mask of the interface—all

    of which are controlled by ifconfig. You may notice that the broadcast address

    is calculated from the IP of the interface and the subnet mask device. Note,

    if you specify a broadcast address using the keyword broadcast,

    miscalculate, you will receive no warning of your error. Furthermore, once the

    broadcast address is set (either by you or by ifconfig), it will not change until

    you explicitly do so with the keyword broadcast.


    > **HINT: AUTOMATIC ASSIGNMENT OF THE SUBNET MASK**


    If you are not using CIDR networks, there is no need to specify the broadcast

    address or the subnet mask. As with most Unices, ifconfig will assume you\want
    a class A, B, or C network, depending on the IP address assigned, and\assign the
    subnet mask and broadcast values accurately.


    **Line 3** shows which flags are set for the interface name, along with the MTU
    and

    **metric**. MTU stands for Maximum Transfer Unit, or max size in bytes for

    packet which will be generated by this interface. The metric is a way of

    sifying which two (or more) similarly configured interfaces is preferable

    and should be used by the kernel first. The flags for an Ethernet device are:


    **UP** indicates that the interface is available to be used for sending and receiving

    packets.


    **BROADCAST** indicates that this interface can receive all broadcasts. You can

    disable this by issuing ifconfig eth0 -broadcast.'
