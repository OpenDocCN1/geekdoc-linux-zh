  md: '# Table 6.2 ipchains General Forms


    General usage:


    ```

    ipchains -[ADC] chain rule [options]

    ipchains -[RI] chain rule [options]

    ipchains -D chain rulenem [options]

    ipchains -[LFENX] [chain] [options]

    ipchains -P chain target [options]

    ipchains -M [-L][-S] [options]

    ipchains -h [icmp]

    ```


    # Table 6.3 ipchains Commands


    | command | description |

    | -A chain | append to chain |

    | -D chain rule | delete rule matching rule from chain |

    | -D chain nostrum | delete rulenem from chain (rules are numbered starting at
    1) |

    | -I chain [renem] | insert into chain, optionally at position rulenem from the
    start (rules are numbered starting at 1) |

    | -R chain [rule] | replace rule in chain (rules are numbered starting at 1) |

    | -L [chain] | list all rules, or if a chain is specified, list all rules in chain
    chain |

    | -F [chain] | flush all rules, or if a chain is specified, flush all rules in
    chain |

    | -Z [chain] | zero counters for all rules, or if a chain is specified, zero counters
    for all rules in chain chain |

    | -C chain rule | test the packet defined by rule in chain chain |

    | -N chain | create a new user-defined chain chain |

    | -X chain | delete a user-defined chain chain |

    | -P chain target | change the policy (default target) for chain chain to target,
    which must be one of the built-in targets:


    * ACCEPT—allow the packet to pass DENY—swallow the packet REJECT—allow the packet
    but notify the sender with an ICMP host-unreachable message MASQ—masquerade the
    packet REDIR—redirect the packet to a local port RETURN—return to the calling
    chain (not valid for built-in chains)|


    -M -L list current masquerading connections

    -M -S tcp tcpfin udp set masquerading timeout values (in seconds—all three must
    be specified, use a value of 0 to indicate no change)'
