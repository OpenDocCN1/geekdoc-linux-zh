  md: '# IP Firewalling


    The server thinks this is cool because it already authenticated

    client (as much as it wanted), so it does not mind the inbound connection—

    it has to allow these anyway to offer the FTP service. The firewall likes the
    idea

    because it doesn''t have to accept inbound connections from the outside. The

    client likes the idea it gets its file.


    Back to the problem at hand: Aside from the obvious requirement that we

    need to protect our network, we have the management mandate to log all transfers.

    A FTP proxy can help us do this and so more. (Several proxies for Linux are covered

    in Section 8.1.) the idea of a proxy is to have a process running which

    connection requests and data transfers to the outside on behalf of the client.
    This

    offers the following advantages:


    +   1. They run on a single system, which means that if you do have to allow normal

    mode FTP, it is only to a single system.

    2. They log all transfers, connection attempts, etc.

    3. Most of them have access control mechanisms to prevent anybody from

    using the proxy.


    +   4. We provide "application" level protection. Because we are proxying the

    FTP commands (i.e., they converse with the client, and then turn around and

    converse with the FTP server, and the FTP server believes that the FTP proxy is

    the FTP server, the proxy can examine the commands for illegal commands, buffer

    overflow attempts, and other assorted unscrupulous actions a FTP server (or

    client) might attempt.


    For rules, we will NOT assume that the proxy always operates in passive

    mode on the client side (client-proxy), because a user may neglect to configure
    the

    FTP client to automatically request passive mode transfers. The proxy will use

    mode data transfers between it and the server. A sample set of rules is listed
    below.

    The section before each rule documents its role in preventing (or allowing) access

    through the firewall system.


    ```

    # ipchains input/output firewalling example

    ######################################################

    # set up a few variables

    INSIDE="192.168.0.0/16"               # all of our internal address space

    ETH0=192.168.16.1/32                   # fw intf on the inside

    ETH1=192.168.20.1/32                   # fw intf on the outside

    ANY=0.0.0.0/0/


    # create new user-defined chains. "eth0" and "ethlin"

    # these get first dibs on anything that enters the system

    ipchains -N eth0

    ipchains -N ethlin

    ipchains -I input -i eth0 -j eth0

    nipchains -I input -i eth1 -j ethlin


    ```'
