  md: '# # Routing Building Blocks


    What has come before the router? What comprises the router? Or, for those of you
    with philosophical aspirations, which came first, the router or the packets? For
    the purposes of this chapter, we will conceptualize the router as consisting of
    three different components:


    +   - **hardware**, upon which the router runs.

    - The **environment** and environmental considerations. This portion does not
    actually do any routing, but is important all the same. Without it, the router
    hardware and software may not be able to perform their specific tasks.

    - The **software**, which directs the packets and may perform other useful functions.


    This chapter will cover Linux routers to almost all variations on the theme. Having
    the right mixture of these three basic building blocks is important for building
    stable elements described in later chapters. A large part of administering high
    availability systems is strategy and planning. Put effort into this up front can
    save a lot of (down) time and reward the road. As we talk about the hardware,
    environment, and software, I will introduce some principles I have picked up while
    administering production systems. With most opinions, YMMV (Your Mileage May Vary),
    so take the applicable parts and expand on them. Leave the rest.


    # ## 1.1 ROUTER HARDWARE


    It is likely that what first comes into your mind when you think about "hardware
    selection" is like process generation and speed, RAM, and Ethernet adapters. All
    of these are important to a router, but there are some even more fundamental aspects
    of hardware selection you should take into consideration. A router has different
    uptime requirements than a workstation. If a workstation is down for an'
