    work over your network.


    +   5. You have saved at least 4 IP addresses (one for each node plus the network
    address and the broadcast address). If IP addresses are in short supply for some
    reason, this becomes meaningful.


    # 5.3.6 Starting WANPIPE


    If you are as I, then you are probably too impatient to read the documentation
    before trying something. You can test your configuration with /etc/init.d/wanpipe
    start (Debian) or /usr/sbin/wanrouter start (non-Debian). If your link goes up,
    great! If it does not, we''ll need to do some troubleshooting. First of all, let''s
    review what WANPIPE startup script does.


    +   1. Reads the contents of [/wan]router.rc into the environment. This file tells
    WAN-PIPE where to find configuration files and whether or not it should start
    the router at all.


    +   2. Checks to see ifROUTER_LOCK exists. If it does, WANPIPE is currently running,
    and should be stopped before restarting.


    +   3. Calls the function router.up(), which logs all of its output to $ROUTER.LOG.
    router_up() does the following:


    +   (a) Checks to see if the configuration files for each $WAN_DEVICES exist in
    $WANPIPE_CONF_DIR. Obviously, whatever is not present is not started.


    +   (b) Checks to see if $ROUTER_BOOT is set to NO. If it is, WANPIPE does not
    start.


    +   (c) Loads each module in $WAN_DRIVERS, checking first to make sure that the
    module is not already loaded. The results of the modprobe are noted with'
  merge: -1
  pgno: 170
- img_proc: true
  md: 'either “ok” (success) or “fail” (failure) in the logfile. The script will fail
    automatically if $WAN_DRIVERS is an empty string.


    +   (d) Calls wanconfig with wanpipel.conf (and others) as an argument. This is
    the point where the interfaces are listed in [interfaces] are created.


    +   (e) Looks in $IFCONF_DIR to find the IP configuration for each of the interfaces.
    When wanpipel creates an interface and successfully registers it with the kernel,
    an entry is created in /proc/net/dev. The script checks each interface file $IFCONF_DIR;
    when it finds a match, in /proc/net/dev, it calls the function interface.up for
    that interface.


    +   (f) interface.up reads the interface (previously discussed in Section 5.3.4)
    and uses the values to therein $ifconfig the interface with the values $IPADADDR,
    $NETMASK, $BROADCAST, and $POINTPOINT address.


    +   (g) A host route for the $POINTPOINT interface is added to the kernel routing
    table with route


    +   (h) A network route is added for $NETWORK, optionally with $GATEWAY (if it
    is set). The network route always points to the interface being configured.


    Starting WANPIPE—Loading Modules Now that you know what is supposed to happen,
    we can talk about what can go wrong. The loading of the driver modules must occur.
    If the modules are not found in /lib/modules=$(uname -r)/net, or are compiled
    for the wrong version of the kernel, or if the running kernel does not have WANPIPE
    built into it, you will have to take some corrective action.


    In the first case, perhaps you neglected the last step in kernel compilation,
    make modules.install. It could be that you have built the kernel, but that depmod
    has not been run since the kernel build. depmod normally runs during system setup,
    one way to ensure that it occurs is to reboot your system. This should also correct
