  md: '# 5.3.7 Starting WANPIPE—Other Potential Problems


    If everything in syslog and in the /var/log/wanpipe.log seems ok, the connection
    still doesn''t work, you''ll have to dig a little deeper. Although none of these
    will immediately fix the problem, there are ways to check your work and understand
    how WANPIPE works with your system.


    Once WANPIPE has started, you can use ifconfig to view the interfaces created
    for each PVC. If they do not exist (an error message wan0: unknown interface),
    then review the logfiles carefully. Make sure that you see a message like wanpipe:
    Interrupt Test Passed, Counter: 101, which indicates that the interrupt you select
    is available for the S508. If you see wanpipe: Interrupt Test Failed, then you
    have spotted an interrupt which is already in use. cat /proc/interrupts works
    to find an unused interrupt and edit the IRQ setting in wanpipe.conf with your
    selection.


    ```

    zinc:> ifconfig wan0

    wan0 Link enc:Frame DLCI

    inet addr:192.168.20.2 P-T:192.168.20.3 Mask:255.255.255

    UP POINTPOINT MTU:1500 Metric:1

    RX packets:743135 errors:0 dropped:0 overruns:0 frame:0

    TX packets:788143 errors:0 dropped:10 overruns:0 carrier:0

    Collisions:0

    Interrupt:12 Base address:0x360 Memory:ee000-ffff

    ```


    ```

    zinc:> route -n | grep wan0

    Destination Gateway Genmask Flags Metric Ref Use Iface

    192.168.20.0 0.0.0.0 255.255.255 USS U 0 0 4552 wan0

    192.168.20.0 0.0.0.0 255.255.255 U U 0 0 7727 wan0

    ```


    Routers do not live by ifconfigs alone; you must also have routes over your link
    to be able to use it. If you have routes, check to make sure IP forwarding is
    enabled in the kernel—see the hint on page 55 if you''re not.


    When WANPIPE starts, it creates one directory in the /proc filesystems. The directory
    is /proc/net/wanpipeN (one for each physical device in the system). Each of these
    should contain meaningful information—the values of the first two files should
    match what you entered into the configuration files, while the third contain statistics
    about usage of the card.


    ```

    zinc:> /proc/net/wanrouter> pwd

    /proc/net/wanrouter

