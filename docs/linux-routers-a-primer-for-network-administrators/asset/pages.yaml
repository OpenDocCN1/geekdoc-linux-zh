    # Rescue Disks and Dynamically Linked Binaries


    Less experienced administrators may get into trouble when they try to start binaries
    on the mounted root partition. The problem is that those binaries are dynamically
    linked, and their libraries are not available. If you are not familiar with the
    difference between dynamically and statically linked binaries, refer to a good
    text on operating systems concepts. Here is my type synopsis:


    +   There are statically linked executables and dynamically linked executables.
    The static ones are much larger, but are wholly independent entities. Dynamic
    executables have advantages in terms of memory and binary size, but require a
    functioning linker-loader and libraries in order to be useful.


    Rescue disks typically consist either of static binaries, or of a pared-down set
    dynamic libraries. If there are dynamic libraries on the rescue media, they are
    almost certainly not the versions with which the binaries on the hard disk are
    linked. This means that you cannot use the binaries on the disk, nor any script
    which requires an interpreter (or shell) which is not on the rescue media. What''s
    the moral? Don''t be fooled into thinking that, once your root filesystem is mounted,
    you''re free and clear to clear an FTP or ssh client. As a side note, it might
    not be a bad idea to have printed copies of the fsck and mount manuals handy.
    You will probably not be able to access manuals on your crippled system. You should
    also be aware that the versions of these commands on the rescue media will not
    match the versions you are familiar with from everyday use, so be prepared for
    differences and/or limitations.


    There is another related point to be made about dynamic libraries. For those of
    you with experience other Unix, you may be surprised to discover that for most
    Linux distributions, even the basic system tools are not statically-linked.


    ```

    hafnium:~root> 1dd /sbin/fsck

    libc.so.6 => /lib/libc.so.6 (0x04010000)

    /lib-ld-linux.so.2 => /lib/ld-linux.so.2 (0x04000000)

    ```


    This means if cruel fate decides to flip a bit in a sector which contains a file,
    which is called libc.so.6, you will be using rescue media to work on your system.'
