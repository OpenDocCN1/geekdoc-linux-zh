    # 8.2 REDIRECTION OF IP TRAFFIC—SMOKE AND MIRRORS


    This section is about methods to take traffic headed to one destination and point
    it towards a destination without the sender (and sometimes the receiver) ever
    aware that any such activity is taking place. The action does not necessarily
    have to covert; it may be the only way to allow access from the outside to systems
    inside a masquerading firewall. own is like the Perl slogan in the Camel book,
    TMTOWTDI (There''s More One Way To Do It). The options run the gamut from simple
    user-space processes to kernel filtering rules, a combination of these two, and
    finally some complex kernel rules which perform reverse-masquerading. We cover
    each of these with an example:


    # 8.2.1 User-Space Redirection—The Illusion of the Facade


    The first, and likely the most common, method of redirection is to use a user-space
    process to listen to networking requests on the desired interface and then to
    forward these unaltered to the destination system and port. To a large extent,
    these processes are often referred to as proxies, although I think that redirector
    is more precise. If all goes well with the redirection, the user cannot tell the
    difference between connecting to the redirecting and the true destination. (Note,
    the destination sees the connection attempt come from the redirecting server.)
    One positive upswing of all this is that servers with private IP addresses can
    still be used to provide services to Internet clients. The topology is depicted
    in Figure 8.1.


