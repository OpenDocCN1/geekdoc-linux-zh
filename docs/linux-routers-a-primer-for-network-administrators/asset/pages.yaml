    Notice that dmesg displays a good amount of information about the driver. The
    first line shows the version of the driver and its source. Each device is listed
    as it is detected by the driver. In our case, two NICs are detected. Each device,
    dmesg shows us its base, MAC address, the IRQ being used, the amount of RAM on
    the card, how that RAM is divided into buffers (Receive:Transmit), the type of
    negotiation enabled on the interface, the type of transceiver being used, and
    whether or not bus-mastering is being used. (The amount of useful information
    contained in the message depends on the author of the driver device. In this case,
    Mr. Becker does a very good job.)\Be aware when using dmesg, however, that it
    reads from a circular buffer. If there have been a loop of kernel messages generated
    since boot, the messages may have "wrapped-around" and started overwriting the
    messages from the boot sequence. Also, do not be misled into thinking that dmesg
    contains the startup messages for all subsystems (e.g., daemons and services)
    on your router. It shows only kernel messages.


