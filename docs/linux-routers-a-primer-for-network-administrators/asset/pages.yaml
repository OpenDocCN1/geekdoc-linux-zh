    # 8.5.2 The Support Server—A “Safe Place"


    When you plan for redundancy, do not neglect other important network services.
    As far as the users are concerned, a DNS or DHCP outage is as tragic and disruptive
    as a hard crash in the router. As you design your network infrastructure, keep
    in mind that it is handy to be able to copy all of the configuration files in
    an automated fashion. If you make changes to the DHCP configuration file, a copy
    of that file will be transferred to a safe place, as well as the machine designated
    to be the standby DHCP server with the designation of secondary servers). (DNS
    takes care of itself service to the day-to-day operation of your network should
    be handled like this. An additional precaution to consider is the habit of saving
    these files, if you need to fall back to a previous version quickly. This might
    sound like a case for doing away with traditional backups. It is almost. The problem
    with having anything on a page is that it takes a while to get to it, and you
    cannot manipulate tapes from a remote location. So where is a good place?


    For an environment of any size (more than a couple of machines), I recommend dusting
    off that 486/16M machine in the corner, installing a fresh hard drive (and possibly
    a tape drive), and using this machine as your “Linux support server.” You can
    use this as a software repository; it may be the only machine in your fleet with
    a CD-ROM drive (so that you can keep a copy of your distribution online and NFS-mountable).
    It will also have any software you use is not part of your distribution, kernel
    source and packages, and the configuration files I mentioned previously. You may
    also want to copy system logs over this machine for archiving. In fact, this may
    be the only machine on your network for which you perform full backups.


    In most cases, you use NFS as your configuration file backup mechanism. If you
    do this, be sensible about what is backed up and how. For one, you''re going to
    be exporting part of the support machine''s filesystem as writable to all of your
    servers. Export a directory /usr/local/etc/envbackups, which may contain a subdirectory
    for each of the machines in your environment. Your production machines would mount
    carbon:/usr/local/etc/envbackups($hostname) and copy the files while preserving
    the modification date (cp with the -p option -m, or tar just the way it is). What
    you copy is up to you, you could start with the things listed in Section 7.4.2.
    When you mount the support server, make sure that you use the -o soft option to
