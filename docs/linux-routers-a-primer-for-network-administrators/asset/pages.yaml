  md: '# 8.3 General Internet Services on Routers


    HTTP daemons also allow you to indicate which server name you would like to use
    the server. Although the name should correspond to a valid DNS name (either a
    record or a CNAME) for that web-server, it does not need to be the canonical hostname,
    or necessarily a name which corresponds to the IP which will be used to serve
    the requests.


    # 8.3.3 FTP on a Router


    Serving FTP should be no problem. There is one “gotcha,” again with DNS, but this
    time affecting clients. The FTP daemon may want to perform a successful reverse
    DNS lookup (IP to FQDN) for all client connections.


    # True STORY: LOUSY FTP SERVER PERFORMANCE


    > I once had a call about a performance problem with the FTP server. The client
    complained when he tried to connect to the service, it would hang for several
    minutes and then timeout. I checked the server and there was no load, and no mention
    of connections from the client''s domain in the logfile. As it turns out, the
    problem was that the client had just switched over a new Internet link and did
    not have a IP-to-name mapping for the external IP address their firewall was using
    to access the FTP server. Before the FTP daemon would do anything with the incoming
    connection, it would attempt a reverse lookup for the connecting IP to place in
    this log. In this case, it took several minutes for the lookup to timeout, and
    the FTP daemon was not even logging the connection attempt. A couple efforts in
    /etc/hosts fixed things until the client''s DNS zones were configured correctly.
    In this situation, being able to take a look at the ftp orders was very useful.


    BTW, the requirement that a connecting system has a DNS resolvable IP address,
    is something that can be enforced by tcpd and its configuration files, /etc/hosts.allow
    and /etc/hosts.deny. If you are having trouble connecting to a server which you
    know is running the service you are requesting, it could be a routing problem,
    it could be a masquerading problem, but many times it''s either DNS or the tcpd
    configuration


    # 8.3.4 Sendmail (on a Router)


    Sendmail (and other MTAs) may be a mixed bag. Let''s think about the functions
    that they need to perform. First, they have to send mail (prophetic, eh?). Next,
    they have to be able to receive mail, and forward it as necessary, also known
    as relaying. I am not addressing the case when mail is to be delivered locally
    and stored on server; IMO, except for small installations, is not very appropriate
    for a router.)'
