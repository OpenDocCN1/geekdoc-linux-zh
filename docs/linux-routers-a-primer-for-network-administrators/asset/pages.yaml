  md: '# 1.1.7 Video Adapter


    This is an area where almost nothing is more than enough. You merely need an adapter
    capable of supporting 80×25 text-mode console. Starting with version 2.2 of the
    kernel, the use of a serial port as a console is supported—eliminating the need
    for any video adapter whatsoever (almost). The caveat is that you be able to modify
    the system BIOS without a video adapter (on x86 architectures), and a few systems
    may refuse to boot without a keyboard attached. Configuring your system to use
    a serial port as the console requires three steps:


    +   1. You need to enable serial console support in the kernel. (Although you
    can compile the serial support as a module, I recommend it since you will want
    to see the boot messages before any modules are loaded.)


    ```

    Character devices -->

    *> Standard/generic (dumb) serial port

    [*] Support for console on serial port

    ```


    +   2. Configure your boot loader to tell the kernel which serial port to use
    as the console by supplying console=device,baudrate as an argument to the kernel
    during the boot sequence. You should use the device name shown dmesg (not the
    path to the device in /dev/). Use 9600 for the baudrate. If you are using LILO,
    add the following line to your configuration and rerun lilo to update the boot
    sector:


    ```

    append = "console=ttyS0,9600"

    ```


    +   3. Configure a process to run on this port by adding the appropriate line
    to /etc/inittab.


    ```

    T0:2345:respawn:/sbin/getty -L ttyS0 9600 vt100

    ```


    After you reboot that these settings are active, you can access your serial console
    by attaching the specified port to any dumb terminal or to the serial port on
    another system and running a terminal emulator such as minicom.


    # 1.1.8 CPU


    Processor speed can be quite important for certain types of routers, while others
    seem to touch the CPU at all. Routers that need more processing power are ones
    with lots of firewalling or masquerading rules and those that must perform heavy
    statistics collection or monitoring. CPU requirements depend not only upon load,
    but also upon the number and type of adapters in the system. Adapters capable
    of DMA (and have Linux drivers which support-bus) can significantly reduce the
    CPU requirements by being able to move data to and from main memory without involving
    the CPU. In the case of WAN adapters, some of these are capable of running the
    link protocol on the card itself, which means that there is less code in the device
    driver and correspondingly lower CPU requirements.


    In this matter, my recommendations are based purely on experience. At the time
    of writing, I have never needed to use anything faster than a P6/180 (which was'
