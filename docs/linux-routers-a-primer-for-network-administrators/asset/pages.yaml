    **T-Carrier Bandwidth** The bandwidth of each channel is 64kbps. Although it may
    seem to be a nice round number, designed with data applications in mind, the origin
    is the PCM conversion which samples each voice conversion 8000 times per second
    (at 8000 Hz) and encodes the result in an 8-bit value. Furthermore, we are not
    limited to using one channel at a time. The circuitry which interfaces with the
    digital circuit can aggregate channels to achieve higher data throughput. It is
    safe to say that the T-carrier scheme has been wildly successful and ubiquitous.
    Here are some common factors of digital circuits:


    +   - A DDS (or DS0), which is a digital circuit running at 56/64kbps (or one
    channel). (Note that this is not the same as a POTS circuit).

    - The T1 (or DS1), which is $N \times 56/64kbps$, where $1 \le N \le 24$, up to
    1536Mbps in increments of either 56kbps or 64kbps. The quantum is 56 or 64, depending
    upon the signalling protocol used on the T1.

    A T1 can be viewed as (24) DS0s, each of which is called a channel. A full T1
    is all 24 channels. A fractional T1 is a subset of these channels.

    - A T3 (or DS3) is a digital circuit designed to carry 672 simultaneous voice
    conversations (channels). When used for digital transmission, it has a bandwidth
    of almost 45Mbps.

    - An E1 is a European standard similar to the T1, but instead of 24 trunks it
    has 32, conforming to a data rate of 2.048Mbps.

    - FT1 access, or fractional T1 access, is a service offering that does not correspond
    to a physical circuit. Still, the jump from 64kbps to 1.536Mbps is too wide a
    gap for some applications, so it is in the PPT''s intent to provide such a product.
    If you order T1 service, the telco will run a full T1 and give you part of it.
    If possible, it will use the remaining bandwidth for another customer at the same
    facility. This offering is common in Europe.

    Note, do not confuse fractional T1 access with fractional T1 ports, which are
    data services which use less than all 24 channels.


    Digital circuits are your friends, your lifeline connecting you to the world.
    It helps to know the terminology because the access circuit is not the same ones
    selling the circuits or the same ones responsible for the data services which
    ride them (Services often “ride” T1s, in the jargon). The next section takes this
    piece of puzzle and places it in the context of a data link like you would use
    to connect to a network service provider (like an ISP).


