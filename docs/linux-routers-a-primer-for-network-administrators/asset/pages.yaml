    influence of subnet mask


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_44_0.png)


    Figure 2.2 Network and Host Ports of the IP Address


    In the old days there were three types of networks: class A, class B, and class
    C, each with its own subnet mask. Period. This meant that there were three ways
    to divide the 32 bits in an IP address into a network and a host address. Because
    this resulted in extremely restrictive groupings of IP addresses, CIDR (Classless
    Inter-Domain Routing) was born. With CIDR, you can divide the IP address almost
    anywhere within its 32 bits. You can think of it as drawing a line in the sand
    and proclaiming: "All bits to the left of this line comprise the network address,
    and all bits to the right of this line comprise the host address."


    The delineation of the two fields of IP address is presented with the subnet mask.
    The idea is similar to cutting a hole in a piece of paper and placing it over
    a page of this. The larger the hole, the more of the book you can see through
    it. In the case of subnet mask, the part you see through the hole is controlled
    by the number of "1s", and corresponds to the network address of the subnet. The
    remainder is the host address. To "look through the mask," the computer performs
    a binary-AND operation of the IP address and the subnet mask. Here is a quick
    example:


    ```

    11010110 00100110 10101101 01111110 IP address

    11111111 11111111 11111100 00000000 subnet mask

    11010111 00100110 10101101 00000000 network address

    ```


    As you can see, where there is a "1" in the subnet mask, the bit in the IP address
    is copied into the address. "0s" in the subnet mask remain "0s". That''s masking,
    and it is something that can be performed very quickly by computer hardware. Although
    the subnet mask is always a string of bits inside the computer, people get tired
    of writing all of those and zeros, so there are three different representations
    for human use.


    +   - The first is just a dotted IP address. For example, /255.255.252.0. This
    is easy for humans, and it is the most common format when specifying the subnet
    mask in commands and configuration files.

    - The second is the format used in the example—i.e., all bits written out as four
    groups of eight bits (11111111.11111111.11111100.00000000). It is rarely written
    out when you need to calculate network addresses by.

    - The third representation counts the number of "1s" before the "0" start, which
    we can call maskbits. The subnet mask in our example has 22 "1s", and would be
    simply written as /22.'
