    # 6.3 IP Firewalling


    IP firewalling takes many forms and is a topic which has many facets of TCP/IP
    networking. For purposes, I will associate IP firewalling directly with mechanisms
    which are used to restrict the flow of packets into or out of a host, or through
    a router. The first of these be termed **packet-filtering** and the second **conditional
    forwarding**. The term **conditional forwarding** has been coined only to separate
    it from input/output-based packet-filtering. In the Real World, people interchange
    the terms **packet-filtering** and **firewalling** to mean both of the functions
    listed above, and others, such as *proxying* and *masquerading*. And more often
    than not, **conditional forwarding** is lumped in with **packet-filtering**. This
    is because they do the same thing, but under different circumstances, which is
    why I present them separately.


    Before we get started with our discussions of forwarding and packet-filtering,
    remember that they are not the only game in town for firewalls. Depending upon
    your application(s) and firewall topology, you have a firewall or Internet router
    which does not route or forward at all (/proc/sys/net/ipv4/forward = 0). Instead,
    users will use proxies to access what they need. This type of topology can be
    secure and work for smaller organizations where a single system can function as
    the router, firewall, and proxy server. If you implement this type of firewall,
    you will use packet-filtering to protect the proxy daemons and the host itself,
    but you will not need to specify any restrictions on forwarding, since no one
    is taking place.


    What you do with the rules can be logically separated from **how** you do it.
    This section concentrates on *how*. What varies wildly from application to application,
    and is left as a topic for a book on firewalls, although some examples will be
    scattered throughout this section and Chapter 8. Both packet-filtering and conditional
    forwarding are supported in the Linux kernel and is an application of our friend
    ipchains.


    > 8 For the 2.2.x kernels.'
