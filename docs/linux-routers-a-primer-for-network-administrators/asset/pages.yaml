  md: '# Backups Based upon Filesystem Orthogonality


    If you do not want the heat or cost of a second drive inside your router, then
    we can take a more civilized approach to the matter. There are only a handful
    of files which separate one Unix machine from another. If you load two machines
    from the same sources using the same package selections, they have the same software
    on them. The only differences are the things you configured. Because the software
    load is easily reproducible to a high degree of accuracy, you need to back up
    only those configuration files. This is not as easy as it sounds.


    The first idea is to touch a file just after the OS is loaded, and then timestamp
    (using find -type f -newer touchfile). The problem is most of current distributions
    ask you questions when they install, so it may not be so to differentiate what
    part of the OS and what is part of your configuration. Still, it is better to
    err on the side of too much than little. You can note the system time when you
    start your load and use this to create your myfile. What you back up will probably
    be too much, including directories created during the install and other various
    things, like logs, but it is better than everything. It will NOT include all of
    the binaries. You can create a compressed tarball of these new files and store
    it on another system.


    You can take a more conventional approach than the one used above and back everything
    under /etc and /usr/local/. If you are diligent about where you place your specific
    customizations (preferably /usr/local/etc/), this should not cause any harm. If
    you have the habit of dreaming in your home directory, you''ll need to get /home
    and /root/. But if you build your own kernel, you have special modules under /lib/modules/.
    (I wouldn''t back up the kernel source, just the file /usr/src/linux/config).


    Restore consists of taking a spare drive which already has the base image of your
    OS on it, and uncompressing the backup tarball on top of it. Creating this image
    can be as simple as using the brute-force script mentioned before. You might also
    place the image on a CD and distribute the CD with a bootable floppy onto the
    drive. For this to be useful at a remote site, you''ll need to have the spare
    drive and image already there! This is also a way to save time when loading systems;
    you don''t need to always install from the source media. If you have time, learn
    where all of the configuration files are for your distribution.


    No backup strategy will work if you are not diligent about backing up the system
    after changes take place. You should also be prepared in case that you lose your
    image. You can build another image, but only what was know on it. You can do this
    by using your distribution''s package management to produce a list of everything
    that you loaded on the system. For Debian, dpkg -1 will produce this. Be sure
    to note any other items which you have compiled and installed by hand.


    Until installations can be completely orthogonal with configuration files and
    OS files, this will result in some extra files being backed up, but that not (100)
    bad. I created such backups for several of my systems, and they averaged between
    300 and 400kb when a gzipped tarball, an easily manageable size. Just keep in
    mind the concept of orthogonality adding things to the system. It goes without
    saying that you should have spare IDE disks and cables on hand,'
