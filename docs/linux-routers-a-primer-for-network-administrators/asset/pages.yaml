  md: '# 7.3 Replacing Servers—Multifunction Routers


    DMA is the anti-IRQ. It is a Good Thing, and should be used whenever you have
    a choice to use it, because it allows data to move between devices and memory
    without having to shuffle through the processor using inp() and outb() calls.


    +   * PCI and Other Bus-Related Issues—There are many ways to tune PCI, calling
    via settings in the driver. Because there are so many devices, the tuning may
    improve performance for any type of device. Recently announced Powertweak, which
    has been available for Microsoft Windows for a while, but is now ported to Linux
    and free software (for Linux only). See http://linux.powertweak.com/ for more
    information.


    When performance tuning, you should consider the system bus(ses) to be a resource
    like any other device. Most of the proprietary Unix architectures go great lengths
    to insure that their systems are capable of moving large amounts of information
    quickly. When a bus becomes overloaded, it is often possible to add another interface
    to the backbone (the backplane), by redistributing I/O channels the load across
    multiple busses. The PC platform does this to a certain extent with things like
    the AGP bus, a separate memory bus, and having both PCI and ISA busses. Unfortunately,
    there is no magic to know everything that is happening on your bus without purchasing
    a logic analyzer and spending months learning how to use it and what to for. For
    PC, the bus implementation depends on the motherboard chipset used. If you intend
    to use disk-intensive or graphics-intensive operations you should do research
    on the different chipsets themselves. Not all chipsets (or their features) are
    supported equally under Linux; you''ll have to do even homework to find out what
    works best.


    +   * Network—Network performance is a separate animal from the other topics listed
    here because it depends on what is happening outside of the system. If you tune
    the machine itself, then you should focus on things like drivers and busses. The
    IP stack is also tunable via the /proc filesystem, /usr/src/linux/Documentation/networking/Configurable
    (in the kernel source) for pointers to the lists of tunable parameters. Sometimes
    network performance of an individual link is important, in which case you may
    tune the MTU of the interfaces on each end to correspond to the most frequently
    used packet size. Chatty protocols normally prefer smaller packets, while large
    data transfers prefer larger packets.


    Once you are outside of your system or a single link, you will have to look at
    the networking environment itself. If you are retrieving software from a mirror
    site, use tools like netselect, traceroute, bing, and pathchar⁶ to find the best
    path—a function of both the number of hops and the bandwidth between the hops.


    See the hint on pathchar later in this chapter.'
