  md: "out your rules in a format that is easy to enter into a script to reproduce\
    \ the environment. Say you spend a few hours testing various rules and have just\
    \ the way you like them. Now you want to save them into the script and they will\
    \ run at boot time so that you can configure your packet-filter. There is no easy\
    \ way to list the rules with ipchains (A shell with a history file might help\
    \ you here, but because the process involves adding rules and deleting them again\
    \ to enter a slightly different variant of the same rule, you will have to spend\
    \ a while pouring over the history to find which commands negated each other).\n\
    \nFinally and definitely most significantly, packet-filtering rules function as\
    \ a set and are adequately tested only when they are tested as a single unit.\
    \ For these reasons, I recommend that you get used to the idea of working with\
    \ them as a set. I recommend that you enter all rules into a shell script and\
    \ then edit -> run -> edit -> ... this shell script until you have what you want.\
    \ In this way, you can document your rules and design trade-offs as you go and\
    \ will have a script ready to add to your system startup. If you use a script\
    \ like the skeleton below, you can edit the script, stop it, and then start it\
    \ again so that you are always testing the rules as a group.\n\n```\n############################################################\n\
    #!/usr/bin/ksh\n#\n# firewall_rules.sh\n#\n# modification history:      initial\
