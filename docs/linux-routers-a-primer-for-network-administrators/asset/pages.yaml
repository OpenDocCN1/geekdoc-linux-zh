    # HINT: INCREASING FILE DESCRIPTORS ON A RUNNING SYSTEM


    You can easily increase the number of file descriptors available to the system
    without recompiling the kernel. Just write the number of file descriptors you
    would like to use for `/proc/sys/fs/file-max`, with a command echo `8192` >/proc/sys/fs/file-max.
    You can check the current usage with cat `/proc/sys/fs/file-nr`. The fields are:
    the current number of file descriptors in use, the number of unused file descriptors
    already allocated by the kernel, and the maximum number for file descriptors available
    (The second value is not overly important; it merely indicates how many requests
    for file descriptors the kernel can service without having to stop and allocate—up
    to the limit of file-max).


    Another interesting place to check is the field of `/proc/slabinfo` (Linux kernel
    2.2). The first column indicates the current number of file descriptors in use,
    while the second is the high watermark (the maximum of filedescriptors used at
    any time the system was started).


    If you run out of file descriptors, you can expect the following code to put a
    message into syslog:


    ```

    printk("VFS: file max limit reached %d\n", max_files);

    ```


    Note that there is also a parameter in `/usr/src/linux/include/limits.h`, OPEN_MAX,
    which controls how many processes a single process can open. (If you change this,
    you will probably need to recompile your applications.)


    +   **number of free ports**—Running out of ports is less likely, but possible.
    See the information on page 105 about checking the number of ports available for
    masquerading.


