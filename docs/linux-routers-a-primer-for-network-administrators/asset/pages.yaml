  md: '# WAN Basics 101


    An alternative is to turn to a service provider who has POPs near locations and
    purchase two access circuits—one between location A and its nearest POP, and the
    other between location B and its corresponding POP. POP stands for "Point of Presence,"
    which is the title given to your provider''s nearest geographical. We then pay
    the provider to route traffic on their internal network between the POPs (and
    thus between our sites).


    Now our dedicated access circuits are lower, because we only have to pay for the
    distance between each location at its nearest POP. The difference now is that
    that we don''t own the entire path between your sites. Apart from cost-savings,
    the benefits are that the provider will have many POPs, and it becomes quite easy
    to add locations C, D, and E to our network. We do not have to worry about maintaining
    anything more than the node (endpoint) routers.


    However, because there are other routers (which belong to our provider) between
    our sites, we have to comply with their protocols and configuration guidelines.
    This means that we cannot use all types of data compression (we can still encrypt
    andor compress IP payloads, but not link-layer protocol packets). Moreover, however,
    is that we are using the provider''s network, we have to pay for that bandwidth.
    And the more we want to use, the more it will cost. But, because our provider
    has orders of magnitude more bandwidth than we want, we can offer us equivalent
    bandwidth for far less than what it cost us to lease the dedicated bandwidth using
    a point-to-point. In this scenario, our WAN link looks like Figure 2.7. In the
    case of Internet access, the cloud is the Internet, and many providers are connected.


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_68_0.png)


    Figure 2.7 Connection of Remote Sites via Provider POPs'
