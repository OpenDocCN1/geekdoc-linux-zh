  md: '# 226—Satellite Office Router Chap. 7


    Make sure that you set SLARP_TIMER in the [interfaces] section of the configuration
    file on the slave. (If you do this, it will never ask the local router for its
    IP address.) Assuming the timer value is non-zero, after the SLARP_TIMER expires,
    the slave sends an inquiry which says, "Please tell me your IP." When the master
    router replies, the slave takes the given IP address and increments its last octet
    by one, and assigns this to its CHDLC interface.


    # Note: SLARP-ASSIGNED IP Addresses


    > When automatic assignment of the IP address that you assign to the master must
    have a host address of .1—for example, 192.168.64.1. The slave will be assigned
    the .2 address in the same network. Since this is so rigid, I prefer to set the
    IP addresses explicitly. Note that with explicit assignment, you may also use
    a subnet mask of 255.255.255.255 and a "0 node network" like the one described
    in Section 5.3.5.


    If you want to assign an IP to both sides of the link, then set the SLARP_TIMER
    on both sides to zero, and set the IPADDR and POPOINT fields accordingly. In case
    you are wondering, besides being phonetically speaking, SLARP stands for Serial
    Line Reverse Address Resolution Protocol, and is often used in conjunction with
    ISDN links.


    As you have seen, by virtue of the limited number of parameters, CHDLC is uncomplicated
    and well-suited for point-to-point links. Where you have access running directly
    between two of your locations, you can use any protocol you''d like. CHDLC should
    be considered along with PPP in this scenario. Frame Relay might work, but its
    DLC overhead does not buy you anything when you have a 2-node network. The CHDLC
    support in WANPIPE is also handy when you actually need to interface a Cisco (or
    some other CHDLC router). When you do interface a Cisco, be sure to configure
    the Cisco to "generate IETF packets only." This disables proprietary extensions
    such as CDP (Cisco Discovery Protocol). If you do not, the Cisco will generate
    non-IP packets that are logged in syslog by WANPIPE.


    Another option you need to disable when interfacing a non-Linux router is any
    sort of packet compression. Although this sort of thing is theoretically possible,
    not all of the vendors compression protocols are open, and therefore not implemented.
    To save bandwidth with Linux (until there are open standards for compression),
    you have to do more than set a parameter in a configuration file. Use your head.
    The next section talks about a couple of ideas to save bandwidth over your low
    bandwidth links.


    # 7.2 CONSERVING BANDWIDTH—CACHES AND SLAVES


    There is a group which calls itself the Bandwidth Conservation Society. As I understand
    it, their charter boils down to educating people on designing web pages without
    ridiculously large graphics so that browsing is comfortable for users without'
