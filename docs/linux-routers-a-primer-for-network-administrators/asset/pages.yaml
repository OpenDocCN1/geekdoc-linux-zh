  md: '# 7.2 Conserving Bandwidth-Caches and Slaves 231


    After these changes, you need to stop and restart Apache with/etc/init.d/apache
    restart. The parameters you added do to the following:


    +   - LoadModule Apache to include certain code/functionality, in this case, the
    proxy module. The first argument is the name of the module, proxy_module, and
    the second argument is the path to the object file containing the code for the
    modules. (The path may vary on your system, depending upon your Linux distro and
    version of Apache.)

    - ProxyRequests On enables proxying of requests. (Having the module loaded gives
    you the potential to proxy requests.) This statement cannot appear in the configuration
    file before LoadModule proxy_proxy or else it will not be needed.

    - CacheRoot pathname tells the module where to cache successful requests.

    - CacheSizeB sets the maximum size of proxy''s cache. You will feel sheepish if
    your router runs out of disk space because the proxy cache filled an important
    system partition. If possible, you should have a separate partition for the cache.
    If you''re worried about performance, then a separate spindle (drive), preferably
    on a different controller from the OS, would help, too.

    - CacheInterval hours tells the daemon how to run its Garbage collection routines
    on the contents of the cache. If you''re ever about to start the daemon, the evening,
    or something like that. (Hopefully, future versions will let you indicate when
    to perform garbage collection.) There is no default, so if you do not have this
    enabled, garbage collection will never occur. This is Not Good, because it means
    there is no way to enforce the limit by CacheSize. On a high-load system with
    limited cache space, you need to tune this parameter to make sure that it runs
    enough, but not continuously.


    +   - Optionally, you can add the NoProxy and ProxyBlock statements to http.conf.
    The first of these tells the proxy to not proxy requests to the listed IP addresses
    or hostnames; instead, the client should contact the server directly. The second
    says not to allow connections to certain sites.


    ```

    # no proxying for internal webservers

    NoProxy 192.168.0.0/16 172.166.0.0/12 10.0.0.0/8

    ProxyBlock .dontoghere.com

    ```


    +   - You can also add MaxClients value to the maximum number of clients. Apache
    considers proxy users to be web servers, and may limit the number of simultaneous
    connections. You can use this to allow more concurrent sessions, or to purposely
    limit the number of sessions to a reasonable number.


    +   - If you would like to run your proxy server on a port other than port 80,
    you can use the Listen parameter in http.conf to do so. 8080 is a popular choice.'
