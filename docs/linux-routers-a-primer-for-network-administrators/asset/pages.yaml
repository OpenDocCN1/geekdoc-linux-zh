    # 4.1.6 A Sample Network Topology for an Extran Router


    One key to erbium''s functionality is the fact that it requires no changes to
    the user workstations whatsoever. Once the link is up, a user can telnet to the
    client''s machine as if it were part of the local network. But for this function,
    you need to make sure that the client can find the remote machines, and this takes
    a little of design work. Because a typical workstation network configuration consists
    of a routing entry for the local subnet and another for the default gateway, your
    choices are to update either the workstation or the gateway (or other gateways
    upstream of that gateway). Because modifying the client''s configuration is tricky
    at best, and potentially downright foolhard, I opted for the latter. The topology
    is displayed in Figure 4.1.


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_114_0.png)


    Figure 4.1 Erbium Network Topology


    In this topology the extranet router is located at least one layer removed from
    your local LAN. When extranet links are active, erbium updates silicon''s routing
    table to include routes to the customer''s network. When the link goes down, erbium
    removes the routes. In both cases, the changes are performed using shell scripts
    which invoke ssh to make the changes on silicon.'
