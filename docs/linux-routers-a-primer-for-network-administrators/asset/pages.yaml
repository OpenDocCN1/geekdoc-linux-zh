  md: '# 6.2 General Network Security Measures


    # PGP—Pretty Good Privacy


    PGP, Pretty Good Privacy, is a public-key encryption mechanism which has been
    embroiled in legal issues surrounding export restrictions from the United States
    and multiple patent holders in different locations. I use it by name because it
    is probably the best known of this type of software. There are several alternatives,
    including GNU Privacy Guard, known as gpg or GnPG (get the gnupg package for Debian
    or visit http://www.gnupg.org/) and OpenPGP (described in RFC 2440).


    The best system I have come up with is to use a PGP-like mechanism. I sign the
    email containing the password(s) with my public key, which I have already exchanged
    with the other admin in a secure manner, and then encrypt the email with the other
    admin''s public key, so that it is for her eyes only. This way, she can store
    the email in her email system, but without access it using her PGP key. If she
    cannot be trusted with the security of her own PGP key, then you will have bigger
    problems. You can add a layer of security to this by encrypting the contents of
    the email with a conventional (single password mechanism), sending the email,
    and then decrypting the password when you talk to the valid recipient of it. The
    step confirms that the email was received by the right person. Public-key cryptography
    is also a handy way to send things to yourself, i.e., to store them on your workstation.
    Even if someone were to physically remove the hard drive, take it somewhere else
    and mount it, you wouldn''t get the passwords, because he doesn''t know how to
    unlock your private key.


    If you need to leave the passwords in a safe place in case something happens to
    you, you should either use a PGP mechanism, or to get computers out of the loop
    altogether, put them in a sealed envelope in aproof safe with your signature on
    the outside. If someone opens the envelope, you''ll notice, and if someone steals
    it you''ll notice, and if someone steals it and tries to replace it with a forgery,
    you''ll notice. Of course, you have to check the status of the envelope regularly,
    say, once a week.


    Password choice is also important, but you already know. Still, I''m amazed at
    the passwords that some people, even system administrators, use. At one environment
    I worked in, you could get into the back office systems by guessing a list of
    three or four passwords which we had retired from use in the Linux environment
    over a year prior. Maybe they''re still valid. If you''re completely at loss for
    picking passwords, try either the pwgen or makes packages, which include binaries
    of the same name. These will produce passwords which are not based on dictionary
    words and contain sufficient variation to be considered non-trivial /bin/passwd.
    They are also a good method of automatically generating passwords for users.


    +   Be careful about packages you load on your Internet router. If you load samba,
    you will be the smbd daemon listening on port 139, and the named broadcasting
    your existence to the world. This does not say that I'
