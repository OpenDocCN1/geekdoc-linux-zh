  md: '# C.4.1 VMware Virtual Network Configurations


    While configuring your VM (Virtual Machine), you are presented with four different
    options for your VM''s network: no network support, host-only networking, bridged
    networking, and custom. Actually, all of them are equivalent to the host machine
    except for network support—only conversions of them differ. When the vmnet module
    is loaded on the host system, it creates the vmnet0, vmnet1, vmnet2, and vmnet3
    interfaces (on the host system). Each of these is a virtual Ethernet hub and can
    be configured as you see fit. The only catch is that each of the VMs can be configured
    to be “attached” to only one of them (at a time), which is specified in that VM''s
    configuration. This means that you can configure your host machine to act as a
    router between four different (virtual) Ethernet segments plus many physical Ethernet
    segments are attached to it. I mention all of this so that you are not afraid
    to configure the product to suit your needs. Let''s review the VMware supports
    by default.


    The first convention is to use vmnet0 for bridged-networking. This is actually
    accomplished with the vmnet-bridge process, which runs on the host machine and
    bridges vmnet0 to eth0 on that. You can change this if you must. The command syntax
    is vmnet-bridge /dev/vmnetN /dev/ethP for 0 ≤ N ≤ 3 and reasonable values for
    P. Bridged-networking, by default, bridges the VM''s eth0 to the host (via vmnet),
    which means that everything the host''s eth0 is also visible to the VM''s eth0,
    at least from an Ethernet perspective. Therefore, when using this option, you
    should configure the VM''s eth0 with an (unused)! IP address on the same subnet
    as the host machine''s eth0. The result is almost exactly like IP aliasing. Just
    remember that you can bridge only the vmnet devices with Ethernet devices.


    Host-only networking by default uses vmnet1, which is normally not bridged to
    anything on the host machine. The host machine and VM speak to each other through
    their vmnet1 and eth0 devices, respectively. In fact, any VMs running on this
    host can speak to its virtual device as the virtual eth0 is configured with an
    IP address and subnet mask compatible with the host machine''s vmnet1. Because
    of this, you essentially have a virtual Ethernet segment, to which the host machine
    (via vmnet1) and all of the VMs (via their respective eth0s) are connected.


    This isolation from your physical network can be used to test various types of
    attacks (and their patches), test monitoring techniques (like tcpdump and sniffer
    work on vmnet interfaces as they do on real interfaces), and test things that
    you''d not not have on your real network, like versa of routing daemons, etc.
    Note, however, that the isolation exists only as long as you do not configure
    your host machine for routing. If you have IP forwarding on and have IP masquerading,
    even if you are running in host-only mode, your VMs can effectively communicate
    with the real world.


    The custom configuration uses the vmnet2 and vmnet3 interfaces as per convention.
    These can be used however you would like to use them. If you want to simulate
    a simple two-segment router topology, like the one described in Chapter 3, you
    can do the following, which is essentially host-only networking for two different'
  merge: -1
