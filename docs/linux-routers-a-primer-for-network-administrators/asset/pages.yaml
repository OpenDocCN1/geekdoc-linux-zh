  md: 'network performs buffering, you might not notice this limitation until the
    differences in port speed are pronounced.


    5. Some nodes in your network might be oversubscribed, a situation where the sum
    of the ports attached to a node via PVCs exceeds the port speed at this node.
    If you are oversubscribed, all of the nodes on the other ends of your PVCs burst
    (send data at their full speed) to you simultaneously, things may slow down or
    get lost.


    In the case of a simple two-node network, your average throughput in a given direction
    will be the smallest value found between points A and B. Figure 5.2 illustrates
    this note. However, not that this is the guaranteed rate, the maximum speed at
    which an interface can transmit data, is equal to the port speed for that interface.
    The burst throughput for a PVC, assuming that your provider does not enforce the
    CIRs, is the lesser of the two port speeds for that PVC.


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_151_0.png)


    Figure 5.2 Frame Relay Bandwidth


    Exceeding Your CIR When you exceed your CIR, the ugly truth is that your provider
    may discard some of your packets. Whether or not it is determined as follows.
    The upstream switch (at your provider''s POP) continuously monitors how much bandwidth
    you are using. If you exceed your CIR, the packets are marked by setting a bit
    in the packet header. If any other node in the cloud is heavily congested, it
    can discard packets with this bit. So, while exceeding your CIR can squeeze more
    bandwidth out of your link for a lower cost, doing so also puts you at risk for
    packet loss. For example, TCP-based applications will notice the missing packet
    and correct the situation, at the expense of retransmitting the packet, which
    wastes time and bandwidth. The situation can be particularly bad for geographically
    remote locations which already experience high packet latency. If you habitually
    exceed your CIR, your provider may request or force you to increase the CIR for
    which you are subscribed.


    # 5.1.2 Reviewing Frame Relay Concepts


    Let''s review what we''ve covered so far and a few finishing details.


    +   * Each node is connected via a piece of access to a port at your provider''s
    POP. Your node is a CPE router.

    * A node (or CPE) is designated by its DLCI, which is an integer used as an address.'
