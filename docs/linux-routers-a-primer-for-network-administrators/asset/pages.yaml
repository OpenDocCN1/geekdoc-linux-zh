  md: '# The System Impact of a DNS Server


    Providing a DNS server on the local LAN, instead of expecting our clients to access
    a DNS server across the WAN, is a performance gain that can be realized with little
    effort on your part. A DNS server is a relatively low-impact process to add as
    a secondary server for massive masses, and not much processing power. The only
    thing you will need is some memory, and typically not much of that. I checked
    the memory footprint of the primary DNS server and mail exchanger for a site with
    over 1000 users—the daemon had been running for 110 days—and it was about 19MB.
    A satellite office would use considerably less than this, probably on the order
    of 2–4MB. If you are concerned about impacting the performance of your router,
    check the size of the process from time to time to make sure that it''s not consuming
    too much of the system''s resources. An easy way to check the memory footprint,
    especially when with script, is to list the status file corresponding to the pid
    of the daemon in/proc. An example on a system running Bind (named) looks like:


    ```

    californium:root> cat /proc=$(cat /var/run/named.pid) status

    named

    State: S (sleeping)

    Pid: 128

    PPid: 1

    Uid: 0 0 0 0

    Gid: 0 0 0 0

    Groups:

    VmSize: 2488 kB

    Vmck: 0 kB

    VmRSS: 852 kB

    VmData: 1040 kB

    VmSk: 64 kB

    VmExe: 436 kB

    VmLib: 920 kB

    SigPnd: 0000000000000000

    SigBlk: 0000000000000000

    SigIgn: 0000000000000000

    SigCgt: 00000000090150ab

    CapInh: 00000000fffffe

    CapPrm: 00000000fffffe

    CapEff: 00000000fffffe

    ```


    The field of interest is VmSize. Should it get out of hand, you can simply stop
    and restart the daemon. (Note, don''t reload it, as this will reread the configuration
    file but not release any memory.)


