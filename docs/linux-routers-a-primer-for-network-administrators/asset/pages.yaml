  md: '# 2.3.3 CSU/DSUs


    As noticed in the previous section, a T1 circuit requires an interface before
    it can be attached to your router. This device is known as a CSU/DSU, or a Channel
    Service Unit/Data Service Unit. CSU/DSUs range from being a simple black box that
    interfaces the two media types to complicated devices containing multiplexers,
    inverse multiplexers, SNMP daemons, "phone home", functionality, and failover
    to backup access circuits. CSU/DSUs range in cost from a few hundred dollars to
    thousands.


    Some routers come with an integrated CSU/DSU, and many service providers will
    provide a CSU/DSU as part of your service or leave one to you. You should be aware
    that some T1 CSU/DSU can only offer a full T1-i.e., they are permanently configured
    for all 24 channels. There are also T1 CSU/DSUs that are called "drop-and-add"
    units, which can be used to multiplex a single T1 for multiple applications. For
    example, you can order a T1 that has 8 channels of long-distance voice circuits
    and 16 trunks (1024kbps) of Frame Relay. The "drop-and-add" CSU/DSU makes sure
    the signalling is not confusing your router or PBX. Unlike a T1, a DDS circuit
    also requires an interface, but it contains only a DSU (since there is only one
    channel, and is therefore not compatible with the T1 variety).


    The CSU/DSU always interfaces to the telco circuit via a straight-twisted pair
    cable with RJ-45 connectors on each end. In other words, your CAT5 Ethernet cable
    that isn''t a crossover cable will do. On the "router-side" of the CSU/DSU there
    is typically a V.35, RS-232, or X.21 connector. Make sure that you get the right
    cable to configure your router.


    Configuring the CSU/DSU If your service provider does not do for you, you will
    have to configure the CSU/DSU yourself. This is done either through a (second)
    RS-232 interface or the front panel. Things you will need to know from your provider
    about your T1 access circuit are:


    +   - framing (ESF or D4) [ESF]

    - encoding (B8ZS or AMI) [B8ZS]

    - line build-out (in either in feet or dB signal-loss) [0–133ft or dB]

    - which channels carry the data circuit, in the case of fractional T1

    - clocking (internal or external) [external] (For anything not in a test lab,
    the clocking must be driven externally, i.e., from the telco circuit).


    Once you have these values, you''ll configure the CSU/DSU to multiplex/demultipplex
    frames on the T1 as required for the circuit. If you haven''t a clue what the
    values should be, the tried values in the list. For the channels, they are typically
    configured consecutively from channel 1 to N, where N = bandwidth/64kb. If this
    material is new to you, don''t worry much about it. The configuration will be
    intuitive once you understand the background.'
