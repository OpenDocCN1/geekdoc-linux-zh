  md: '# Summary


    LRP addresses each of these aspects (although I have to admit that my initial
    attraction was merely to mitigate the risk of hard drive failure). Because of
    its widespread use, it is well-tested, and because it is smaller than a full-sized
    Linux distribution, it is easier to test more completely. A side-effect of its
    size is that it is easier to document, easier to customize and harden (with respect
    to security). Because it is open, it is feasible for you to review all of the
    code used to build the distribution to check it for security holes, etc.


    You can base your entire router infrastructure on LRP. There are LRP mailing lists,
    and the author is actively involved in support. If you decide to do this, do not
    forget to contribute when and where you can. Answering common questions others
    who might be contributing to development might not seem like a lot, but it reduces
    the workload on others


    # 3.5 SUMMARY


    As the first router concludes, we have covered how to do some fairly general things
    with our Linux router. Silicon can route physical and virtual IP subnets, and
    it can keep track of how much traffic is being passed between them. It can be
    implemented on a low-end system without a hard drive. But do not the simplicity
    of this example implementation discourage you. A Linux LAN router can be used
    to connect two or more Ethernet subnets together, connect 10Base-T to coax Ethernet,
    connect Ethernet to token-ring, Ethernet to FDDI, FDDI to ATM, or almost any conceivable
    combination. Use your imagination, and let the solution fit the problem at hand.
    And don''t forget to keep track of how much money and time you''ve saved ...'
