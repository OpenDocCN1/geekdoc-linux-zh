    # Zinc—A Frame Relay Router Chap. 5


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_149_0.png)


    Figure 5.1 Frame Relay Terms


    access—This refers to the digital telco circuit that runs between your location
    and your Frame Relay provider’s nearest POP. Access is also known as the local
    loop.


    POP—Point Of Presence means any sort of network service provider (not just Frame
    Relay) facility which is available for you to connect to its network. This connection
    is your access.


    port—This card or port on your provider’s switch that is connected to your provider
    router via your access. Ports have speeds associated with them, indicating the
    maximum speed at which your provider’s switch will accept packets from you. Note
    that the port speed does not always coincide with access speed.


    DLCI—Data Connection Identifier is the address used to specify the endpoint of
    a PVC (which connects to one of your nodes). This address is integer and is used
    by your router to indicate which potentially different PVCs configured at your
    provider’s switch is the correct recipient of the frame. (Note that you use many
    DLCIs, even if you have a single PVC in your network.) The DLCI should be a value
    between 16 and 1023. Many providers will allow you to request the DLCIs you would
    like to use for your network.


    CPE—Customer Equipment is a term for your router.


    node—This is another term that refers to your router. A Frame Relay node typically
    has a single DLCI associated with it. Of these, CPE is probably better terminology,
    since your provider may use node to refer to network entities other than your
    router²


    PVC—Permanent Virtual Circuit is a path between two nodes on the network, set
    up by the provider so that they can talk to each other. (Actually, the packets
    are routed through the provider’s network is not known to you, but the PVC gives
    the illusion that the two nodes are directly connected to each


    > ² Although I frequently use the term node for my routers, and do so throughout
    this chapter.'
