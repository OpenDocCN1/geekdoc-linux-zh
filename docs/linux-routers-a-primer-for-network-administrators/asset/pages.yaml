  md: '# C.3 Change Control


    +   * Firewalling rules are generally not designed around preventing internal
    attacks (although perhaps they should!), so it is more difficult to design an
    accurate test of how your systems perform under real attack.

    * External routing problems are evident only when you''re on the outside.

    * When you access your own site, you are probably using your own DNS configuration,
    which works because you control it. Seeing how long it takes for updated maps
    to propagate to the rest of the world will give you an idea of how to coordinate
    changes and minimize client impact.

    * You have an external account to which you can send mail and view that system''s
    MTA''s logs. The ability to view logfiles on both ends of a transaction can be
    very helpful.


    Above and beyond these practical benefits is the fact that you have someone with
    whom you can discuss configuration problems and security alerts—basically, “talk
    shop.”


    # USING KERNEL COMPILES TO TEST SYSTEM HEALTH


    The kernel source is a very complicated piece of software, and compiling it requires
    a great deal of system resources. For this reason, it is good exercise for your
    system—make will spawn multiple copies of itself in gcc, gcc will use all of the
    memory it gets hands on, and requires a lot of CPU, memory, and disk I/O.


    For these reasons, I use kernel of the CPU/disk/memory subsystem to test memory
    chips and as a general benchmark of the. Compiling the kernel is a good way to
    test for memory errors because it will consume all of the memory on reasonably
    sized system. If your kernel ends mysteriously with a SEGV error or signal 1,
    you should consider replacing the RAM in the system. If you are sure the memory
    is good and you still receive this error, it is sometimes caused by overclocking
    your CPU—you should consider setting it to operate within its designed specifications.


    As for the benchmark, it provides a relative indication of system speed. For it
    to be useful, the system should be unloaded during the compile, and you should
    compare systems with equal amounts of real memory. Use the time command to time
    the entire build process, as in:


    ```

    $ time make dep clean modules

    ```


    # C.3 CHANGE CONTROL


    Change control is a large topic that consumes many books on its own. I''ve heard
    of all different types of change control—strong change control, fine change control,
    coordinated change control, etc. They are all essentially the same thing. When
    you implement changes, anyone (or anything) affected by these changes should be
    involved in them, or at least be aware of them. The goals are to prevent unnecessary
    outages, ensure that procedures and documentation'
  merge: -1
  pgno: 332
- img_proc: true
  md: 'are updated correctly, and keep everyone in the loop. Your organization may
    already have some guidelines in place. If they do not, to implement your own,
    even if they are nothing more than maintaining detailed documentation about all
    system changes and notifying your management before you make significant changes.


    Change control or not, anything you do is subject to Murphy''s Law. As a network
    administrator, there is the added threat of network-based attacks. After all,
    you hold the keys to a valuable resource. Because of this, I recommend you use
    a tool to detect the changes you don''t apply to the system. (As a side effect,
    the same software will help you keep ahead of normal change management.)


    AIDE (Advanced Intrusion Detection Environment) is a follow-on to the very popular
    intrusion detection tool called Tripwire. It has the distinct advantage of being
    GPL-free. The following description is taken from the software''s homepage:


    [AIDE] creates a database from regular expressions that find it from the config
    file. Once this database is initialized it can be used to verify the integrity
    of the file. It has several digest algorithms (md5, sha1, rmd160, tiger, naval,
    etc.) that are used to check the integrity of the file. More algorithms can be
    added with relative ease. All of the usual file attributes can also be checked
    for inconsistencies. It can read databases from older or newer versions.


    As you can gather, the software detects any change to a file, and can use several
    checksum algorithms to detect changes that might make-fake a single checksum comparison
    (i.e., modifying a binary file so that its checksum is the same as the unmodified
    version). The software is straightforward to set up and use. It is, however, almost
    worthless if you don''t really use it. The homepage is: http://www.cs.tut.fi/ram/aide.html


    # C.4 USING VMware TO TEST CONFIGURATIONS


    VMware, by VMware, Inc., allows you to create virtual machines which run within
    the environment of your host machine. The emulation of a full-blown PC is impressive,
    all the way down to the details of a copy of BIOS which runs inside the virtual
    machine. A virtual machine runs a copy of the x86 operating system you load on
    it! Because the emulation is complete, the virtual copy of the OS is not over
    the differences. It believes itself to be running on a reasonably well-equipped
    machine, although it really exists as a mere couple of files and processes running
    on the host machine.


    The upshot for system administrators is an entirely new way to think about testing.
    Instead of listing all of the product''s capabilities, I will talk about a few
    different ways in which it is useful for testing router configurations, and a
    few ways in which it is not. Note that I am not suggesting that you run VMware
    on your routers, but that you use it on your workstation or testbox to help test
    new software. First, let''s cover what you cannot do with VMware:


    > 1 This list does not include all x86 operating systems, but includes Linux,
    Solaris, x86, FreeBSD, and several different versions of Microsoft Windows.'
