    have drives from one drive to another. This will confuse your boot manager and
    prevent it from finding the kernel when you attempt to boot from the newly imaged
    drive. Once again, boot from rescue media and indicate what the root partition
    should be. As soon as you''re up, issue the command lilo -v (or whatever is appropriate
    for your machine) and then reboot.'
