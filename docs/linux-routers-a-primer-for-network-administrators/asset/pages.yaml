  md: '# Erbium''s Design


    # 4.1 Erbium''s


    The basic idea is to have a router configured to dial-up analog and ISDN links
    so that we can connect to customer networks as if a single workstation. This allows
    support links to be set up very quickly, since most of the target networks already
    have provisions for point-to-point remote access. In this case, erbium dials the
    connection and appears to the target network as a single workstation. In reality,
    it populates the routing table on our local LAN router with information systems
    in the customer''s network available for support access.


    When a user accesses destinations in the remote network, the LAN router forwards
    this traffic to erbium and then out the dial-up link toward the destination in
    the customer''s network. However, this accomplishes only half of the goal: IP
    masquerading the second half. The issue is that the customer doesn''t know how
    to respond to an IP address in our internal network. After all, the remote access
    wasn''t designed for this type of use. IP masquerading takes care of this by modifying
    all packets towards the remote network so they appear to have originated from
    erbium''s dial-out interface. Because the customer network knows this IP (it issued
    it), it can respond. When erbium receives the response, it knows what traffic
    is for and it for internal workstations and forwards the traffic appropriately.


    # 4.1.1 Choose Your Weapons—Dial-Out Hardware


    Erbium''s hardware won''t come as any surprise. It''s off-the-shelf equipment,
    similar to what you might use for a home PC.


    +   - A Pentium 90 with 32MB of RAM—which is more than adequate. The system has
    very little overhead or CPU demands.

    - A 1GB hard drive—we need a little bit of space for logfiles and a staging area
    for file transfer between the networks.

    - Two external analog modems, both of them are U.S. Robotics V.Everything modems
    for analog dial-out. Whatever you do, do not go out and buy the cheapest modems
    you can. (And remember that Winmodems will not work because their manufacturers
    provide no drivers for Linux.)

    - A less expensive modem might seem like a good deal, but when you are trying
    to establish a connection over a very noisy, high-latency satellite link, you
    will find out where the difference in price went. External modems are also a good
    idea because they can move between machines without having to shut down.

    - A SpellCaster Datacommute/BRI ISDN board in the machine for ISDN dial-out. This
    is an ISA card, so it doesn''t require a third serial port (the two we have are
    taken by the modems). The vendor is committed to providing Linux driver support,
    which is a pleasant surprise when shopping for ISDN adapters in North America.'
