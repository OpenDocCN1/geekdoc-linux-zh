    # 5.3.8 TCP/IP Tools That Do Not Work with Frame Relay


    The interfaces created by WANPIPE are just like any other interfaces on your system,
    right? Unfortunately, the answer is "almost, but not quite." You may be tempted
    to use a couple of your familiar TCP/IP tools to watch traffic flow and help with
    troubleshooting, only to find that they do not work for Frame Relay interfaces.
    The first of these I encountered was tcpdump, but I later learned that I extended
    it to all tools based on the libpcap library. You may be unfamiliar with libpcap,
    so here is an excerpt from the README file accompanying the distribution.


    libpcap provides a portable framework for low-level network monitoring... Since
    almost every system vendor provides a different interface for packet capture,
    and since we''ve developed several tools that require this functionality, we have
    created this system-independent API to use in porting and to alleviate the need
    for system-dependent packet capture modules in each application.


    libpcap has been widely accepted. libpcap reads the raw packets, not the TCP/IP
    payloads, to understand the link-layer protocol being. To date, no one has added
    support for Frame Relay packet formats?


    > 9 This is potentially my next project; anyone interested in helping should contact
    me.'
