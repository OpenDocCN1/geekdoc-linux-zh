  md: 'So that''s all there is to forwarding. Forwarding rules are more useful when
    you have three or more interfaces. In many cases, you will find that for (systems
    which only route) and output rules (if there are services running on the system)
    are sufficient to configure your packet-filtering needs. Still, conditional forwarding
    can quickly realize configurations which would be more complicated using only
    input rules. One example which comes to mind is to prevent forwarding of ICMP,
    but to allow the internal interface(s) to respond to pings. You can disable ICMP
    forwarding with a single rule, and all interfaces will still be able to respond
    to pings. If you want to prevent external interfaces from responding to pings
    and traceroutes, you can use an input rule on that interface to block ICMP. Even
    better, use an output rule on that interface, that the sender never sees a reply,
    but any IP event logging occurring on the system will still take place.


    Anyway, keep conditional forwarding in your little bag of magic tricks. When you
    need it, sometimes nothing else will do. If I''m allowed one complaint, it''s
    that the default list does not show the interface (nor dit for ipfwadm). For this
    reason, you should get into the habit of opening windows into your system which
    will be using any of the kernel firewalling features and using the -v switch for
    ipchains (-e for those who use ipfwadm).


    # 6.3.2 IP Packet-Filtering


    Packet-filtering is a matter that often goes hand-in-hand with firewalls, although
    that is only one application of its usefulness. Before it can be used, we should
    answer the question, “What is packet-filtering?” Everything that enters and exits
    our routers via the network is in form of a packet. Normally, there are no restrictions
    on which hosts may use a system as a gateway. If the system can forward the packet,
    it will. From systems with tcpd, there are few restrictions to which hosts may
    attempt to contact a system on any given port via any particular protocol. If
    the system can answer, i.e., it has a daemon or service ready to answer on that
    port, Packet-filtering allows us to restrict the flow of packets entering and
    exiting our system, based on the properties of the packets themselves. It differs
    from IP masquerading and conditional forwarding in that it only operates on input
    and output from the system, not packets selected for forwarding by the kernel''s
    routing table. This is not to say that rules match packets which are being forwarded;
    they can. The difference is that the matching occurs when the packet enters (or
    exits) the system. As you''ve come to expect, the rules are specified using ipchains
    with its syntax.


    For simple routers, we talk primarily about input rules; output rules are equally
    valid, but I find it conceptually easier to think about blocking things on the
    way to the machine rather than the way out of it. This also seems like it would
    result in less work for the machine. If you reject packets on the way in, you
    can potentially short-circuit a lot of the filtering rules. That is, you do not
    have to compare the packet to the remainder of the input chain, the forward chain,
    and the output chain before finally rejecting the packet with the output rule.


    The situation changes on a system with services, e.g., proxies, and/or users.
    In this case, output rules may be the only way to prevent certain traffic from
    origin-'
