- img_proc: true
  md: '# 5.3.5 Saving Time with Zero-Node Networks


    When I first started deploying Frame Relay links, I used subnets carved out of
    the 172.16.,* private address space with 255.255.255.252 subnet masks. Setting
    up and maintaining these links for a while, this small IP "network" between the
    Frame Relay routers to be an annoyance. Let''s call this frnets for this discussion.
    Specifically, I encountered these problems.


    +   - First, you have to go through the trouble of assigning some IP address and
    noting its usage so that it does not pop somewhere else in your network. Extra
    documentation...

    - Second, if you want to traceroute over a link end-to-end, the traceroute command
    will be able to find the frnet (so that it does not print out*) This means there
    must be routing table entries for the frnet on (almost) every router in your network.
    If you use static routers, routing table entries mean work.

    - You''ll need to update your DNS maps—possibly create entirely zones, both forward
    and reverse (or at a minimum reverse). If you don''t, and forget to specify the
    -n to traceroute, then you will have to get DNS lookups for the IPs in the frnet
    to timeout.


    My solution was to take a pair of IP addresses from the Ethernet subnet on one
    side of the link. (Which is an arbitrary choice—I took the addresses from the
    remote side, since it was typically smaller office.) The convention is to reserve
    .2 and .3 for the point-to-point link. For example, if the remote office is 192.168.18.0/24,
    the hub side of the point-to-point receives 192.168.18.2, and the remote gets
    192.168.18.3. To complete the configuration, assign a subnet mask of 255.255.255.252
    (/32) to both interfaces when you configure them.


    This is where we get the zero-node network, which includes nothing but the IP
    address of the interface—not even the interface on the other end of the link.
    However, the configuration works well. If you are running WANPIPE on ends of your
    link, try it and see. The situation looks something like depicted in Figure 5.5.
    This configuration has these advantages:


    Frame Relay PVC


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_169_0.png)


    Figure 5.5 Frame Relay PVC Using a Zero-Node Network


    > Actually, you may be able to get away with even less IPs—you''ll see this later
    on page 277.'
