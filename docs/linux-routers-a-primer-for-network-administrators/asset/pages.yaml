  md: '# The Debian wanpipe Package A few years back, the WANPIPE software installed
    itself as "router", which was a bit too generic and caused some confusion and
    namespace collisions. Therefore, the Debian package used the name "wanpipe" in
    place of "router". Now WANPIPE likes to call things "wanrouter", but having already
    gone a long way down the road with wanpipe, the Debian package will stick to that
    name. Aside from trying to shield the user from file changes, the Debian package
    has the following features:


    +   * It does not require the user to compile the utility programs; they come
    precompiled for the release kernel. Modular support for WANPIPE is in the release
    kernel. Result: A router needs the the source nor a compiler.

    * Filename consistency—it places all of the configuration files in /etc/wanpipe/,
    renames the configuration script /usr/sbin/wanpipeconfig, renames the startup/shutdown
    script /etc/init.d/wanpipe, and places the documentation in /usr/share/wanpipe/

    * It may provide additional functionality, as inclusion of the pipes script (needed
    until WANPIPE 2.1 was released to monitor a link by its device name) and monitoring
    and rooting into the startup sequence.


    If you are running the current stable release of Debian, you have the version
    from the time that release of Debian was frozen Because upstream changes are frequent
    and various improvements are made between major releases of Debian, often there
    are significant updates which are not available as part of the stable release.
    There are two different ways to obtain these. First, you can go the Debian homepage
    and search for newer versions of wanpipe in the unstable release. Second, you
    can get the latest copy from http://pongo.mancill.com/wanpipe. Because all of
    the Debian source is freely available, you can also build a package for an older
    (or newer) version of Debian, or some other Linux frame.


    # 5.3.2 Editing wanpipe.conf for Frame Relay


    Once you install the Sangoma card, build your system, it be Debian or not, and
    load the software, you need to configure it to correspond to the settings for
    your Frame Relay link. The main configuration file is wanpipeN.conf, where N is
    the nth Sangoma card in your system. For our purposes (a single card), this is
    wanpipe.conf. (If you are familiar with WANPIPE, this file is named wanrouter
    until the 2.1 release). On a Debian system, this file is located in the /etc/wanpipe/
    directory (samples are in /usr/share/wanpipe/examples/; for non-Debian systems,
    the file is in /etc/; samples are in /usr/lib/wanrouter/samples). The file controls:


    +   * Physical parameters about the Sangoma card, such as the type of interface
    to the CSU/DSU, the baudrate of the port, and the interrupt of the card.


