  md: '# General Internet Services link Routers


    +   The Internet link runs PPP. The point-to-point IP addresses may or belong
    to you—"belong" meaning that you may not have authority to register them with
    the InterNIC. If this is the case, and your ISP will not cooperate with you on
    registering the IP address to correspond to your domain name, you need to work
    around the problem. The easiest solutions are to run DNS on a different system
    or configure the DNS daemon on the router to a specific interface which is part
    of your address space. (Most DNS daemons support this; see the following hinting.)


    If you do not own any IP address of your own whatsoever, you have issues. (The
    case is for many sites operated by cable modems or non-commercial DSL providers.)
    The issue is, if you register your IP address with the InterNIC as the primary
    nameserver for your domain, you will have to give them the (Internet-valid) IP
    address of the system, i.e., the PPP or cable modem interface. When they perform
    a reverse lookup on this (i.e., resolve the IP address to a name), they will see
    that the name is already registered with the InterNIC, and it belongs to a space
    which is not yours. You will not have authority to register that IP address as
    a nameserver for your domain without permission from the IP''s owner (your ISP).
    Your ISP may refuse, or charge you a handshake.


    +   The Internet link runs Frame Relay. In this case, at both ends of the Frame
    Relay PVC may not be intended to be Internet-routable (and you must have some
    Internet address space). This does not have any effect on traffic which flows
    through the point-to-point, but has serious consequences for traffic which may
    originate from your router. If you run DNS on this system, people will be able
    to send you queries because they will be using the Internet-valid IP address of
    the router (most likely on the eth0 interface). They will receive your replies,
    even if the Frame Relay interface does not have an Internet-valid IP address,
    because it has the right destination address and is headed in the right direction.
    When your machine makes queries, however, they will be from your address. They
    will go out into the Internet with bogus source addresses, never to be heard from.
    The same fate would be masqueraded internal traffic bound for the Internet. If
    the address is Internet-routable but does not belong to you, then the situation
    is the same as described above for PPP.


    It seems like a rip-off, eh? Not only do you have to purchase your domain name,
    pay for a port at the ISP, pay for access, buy the router, pay a bunch of setups,
    but you can''t do anything without buying some address space! (And registering
    it . . and waiting.) If you truly have a single IP address, or an address (addresses)
    which belongs to your ISP, you are going to have to find someone else to host
    your DNS, without break down and get some IP addresses.'
