  md: '168 Oxygen-Internet Router Chap. 6


    turn to IP firewalling to protect our networks and our router even further. There
    are two basic ways to use IP firewalling: by preventing traffic across the router
    or blocking it altogether from entering (or exiting) the router. We will cover
    both of them. They are the kernel facilities which form the basis of packet-filtering
    and all of the tools which can help you configure. Finally, we''ll talk about
    notification tools available for Linux so that you can monitor your environment
    and receive notification when something is wrong.


    # 6.1 CONNECTING TO THE INTERNET


    Unlike networks, which may have only a few different types of access media and
    corresponding link-layer protocols, you can connect to the Internet in literally
    dozens of ways. (You might recall the discussion of access and protocols back
    in Chapter 2.) This section presents a Linux-based router which uses synchronous
    PPP over a fractional T1 to connect to an ISP and the Internet.


    Synchronous PPP, as a protocol, is not actually any different from vanilla PPP.
    The name qualifier is an abridged way of saying "I''m running PPP over a dedicated
    digital access circuit to my ISP" Running over a leased-lined simply simplifies
    some aspects of the protocol. First, you don''t have to dial anything. When your
    router is running and your ISP''s router is running, you''re on the Internet.
    Second, the security of the PPP link itself is less of an issue, because the access
    circuit is terminated at your site and at your ISP. They know who you are, and
    they know who you are. Thus, most connections dismiss the familiar PAP or CHAP-based
    authentication and just start routing traffic. The third difference is that you
    shouldn''t need to run pppd. I say there are scenarios where you might run pppp,
    for example, if your synchronous data pump was merely—a data pump. In this case,
    the driver would present itself to the Linux kernel as a getty instead of a network
    device. By my knowledge, this is rarely the case, and for the Sangoma S508 card,
    it''s definitely not so. It runs the protocol on the board itself and presents
    itself to the system as a network interface. As you will see, it very similar
    to the Frame Relay router from Chapter 5.


