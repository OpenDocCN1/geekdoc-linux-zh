    this point you will find yourself among the (usually) friendly crowd of #debian
    inhabitants and may pose your question.


    # 3.1.4 Detecting Ethernet Interfaces


    As soon as you have loaded your drivers, you will want to make sure that the kernel
    recognized and initialized the Ethernet adapters (or NICs). The kernel always
    names the first NIC it finds eth0. Subsequent adapters are numbered consecutively
    eth1, eth2, etc. There are several different ways to determine whether the kernel
    has already detected your NICs.


    +   1. The contents of /proc/net/dev will show all network devices which are configured
    on the system.


    ```

    silicon:/root> cat /proc/net/dev

    Inter-| Receive Receive drop fifo frame packets drop fifo carrier

    lo: 4378 0 0 0 0 4378 0 0 0 0 0

    eth0: 27520 0 0 0 0 26637 0 0 0 1 0

    eth1: 31 0 0 0 0 17 0 0 0 0

    ```


    This shows that the devices eth0 and eth1 exist along with the lo, the loopback
    device, by convention, has the IP address 127.0.0.1. If a device appears in this
    table, then we can configure it with an IP address and use it. Unfortunately,
    /proc/net/dev does not tell us about settings of the device driver or the NIC.


    +   2. The dmesg command, which displays messages generated by the kernel during
    the boot sequence and thereafter, often gives more information. A sample output
    of dmesg follows:'
