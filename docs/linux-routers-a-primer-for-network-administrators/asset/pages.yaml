    [*] /proc/filesystem support

    ```


    These options should seem straight-forward. You are configuring a kernel to support
    TCP/IP and a specific Ethernet card. Setting is not needed, but recommended for
    performance. (This option tells the kernel that packet is more likely to be forwarded
    (passed up the stack to a socket on this machine. Information is passed to the
    network driver, which potentially changes the way in which it allocates memory
    to the packet.) Support for the /proc/filesystem support are required if you intend
    to do any routing. (Sysctl enables the /proc/sys hierarchy.) They provide a window
    into what is happening within the kernel and offer the ability to set certain
    kernel parameters through the filesystem. /proc will also be used later for IP
    accounting and other kernel features.


    What''s missing from this picture so far is a setting that tells the kernel that
    it is allowed to route packets—i.c. accept packets sent to it but not destined
    for its IP address, and forward these packets to its routing table. (In version
    2.0.x of the kernel, this could be done by enabling IP: forwarding/gateway. For
    2.2.x, this is controlled by the value of /proc/sys/net/ipv4/ip_forward.


    > HINT: Instant Routing Support /proc filesystem offers a quick way to enable
    or disable routing on any Linux system where you have superuser access. (In fact,
    it is the only way to do so by editing the kernel sources starting with kernel
    version 2.2.) Enable it with echo "1" > /proc/sys/net/ipv4/ip/forward. It can
    be disabled again by writing a zero to this file. Pretty neat, eh?


    If you haven''t already done so (and need to), build the kernel. Once this is
    done, reboot the system with shutdown -r now that you are running on the new kernel.
    You will know you are using the new kernel by executing the command uname -a,
    which shows you the date and the currently running kernel built.'
