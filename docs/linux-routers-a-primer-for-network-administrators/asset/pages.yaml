  md: '# 5.4 Trouble-Shooting Frame Relay with WANPIPE


    # fpipeme Commands–Card Status Forms (x)


    | specifier | meaning |

    |---|---|

    | xm | modem status—This shows the status of the DCD (Data Carrier Detect) and
    CTS (Clear To Send) pins of the S508''s interface to the CSU/DSU. These should
    both be HIGH. If one of them is LOW, there is a problem with either the access
    circuit or the CSU/DSU. |

    | xl | link status—This shows the driver''s opinion of the status of the link.
    It should say OPERATIVE. |

    | xru | router uptime—This returns the time elapsed since you started WANPIPE.
    (Note that this does not always equal the uptime of the machine.) |


    # fpipeme Commands–Card Configuration (c)


    | specifier | meaning |

    |---|---|

    | cl | active DLCIs for this adapter—This lists all active DLCIs as re-reported
    in your provider''s reply to the last FSE (Full Status Enquiry). If there are
    DLCIs missing, then either you have a problem on the other side of your link or
    there is a configuration problem with your provider. |


    # fpipeme Commands–Card Status Statistics (s)


    | specifier | meaning |

    |---|---|

    | sg | global statistics—This displays the data regarding the link management
    (LMI) taking place on your link. You might use this to troubleshoot an incompatibility
    or settings mismatch between your router and the switch at your provider''s POP.
    CRC errors indicate errors during packet transmission, while ABORT refers to errors
    detected while the link was idle. |

    | sc | communications error statistics—This will list the number of times CSU/DSU
    dropped out or otherwise the Sangoma card lost to hush. It is useful for noting
    packet loss/bandwidth loss due to communications errors (potentially noisy access
    or otherwise). |

    | se | error statistics—This displays counts of the instances when sends or received
    failed due to problems with the Frame Relay headers (e.g., invalid sequence numbers,
    frames with invalid lengths or other formatting errors). |

    | sd | DLCI-specific statistics—For the DLCI specified on the command line, statistics
    about frames sent to or received from that DLCI are displayed. You must use the
    -d dlci switch to indicate which DLCI you would like to see. |


    Use the "f" command to flush (reset) each of these statistics. Use the same specifier
    (a, c, or e) to zero the corresponding statistic. To zero a DLCI''s stats, use
    i for the specifier, as in -c fi -d dlci.'
