  md: '# 64 Silicon-LAN Router Chap. 3


    Note that you do not need a host route for the interface as you do for other Unix
    variants. If you are not running a 2.2 kernel, or inadvertently flush your routing
    table, you can re-add the network route for eth0:


    ```

    route add -net 192.168.16.0 netmask 255.255.255.0 eth0

    ```


    Note that the route command for Linux has some slight differences compared to
    other versions of Unix. Mainly, you can add network routes directly to interfaces,
    bypassing the step of establishing a host route for the interface before adding
    the network route via the gateway of the IP address of that. This “trick” also
    works for point-to-point links. (More about this in Section 5.3.5.) Also, the
    syntax is a little different. Here''s some of the options:


    ```

    route [add|del] [-net| -host] target netmask nm [gw gw] intf

    ```


    Basically, you can either add or delete routes, of either type -net or -host.
    For network routes, you will want to use the netmask unless you are only class
    A, B, or C networks, in which the command will look at the target and determine
    a default value for the netmask (like ifconfig will do when configuring the interface).
    Many applications are a mix of CIDR and standard class networks, you should always
    specify the netmask explicitly. The netmask must be specified in dot-notation.


    If you need to specify a gateway, use gw followed by the hostname of the gateway.
    Again, you should be explicit and type out the IP address. If you get into the
    habit of using hostnames, make sure that they are in the local /etc/hosts, DNS
    or NIS maps. Although these names will work as long as the name resolution succeeds,
    you may have to wait through some timeouts if you specify a DNS name for a gateway
    for a route, and your DNS server is somewhere beyond that gateway.


    The last argument is the interface to this routing table entry. You may use the
    dev keyword before and list it anywhere in the command-line, placing it at the
    end of the line and omitting the dev seems to be a popular convention. If you
    do not specify a gateway, you will have to specify an interface, but in most other
    cases, the kernel can figure out which interface it should use from the IP address
    of the.


