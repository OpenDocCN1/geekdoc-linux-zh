  md: '# Trouble-Shooting Frame Relay with WANPIPE


    +   * If you call in a problem and there is not something else obviously, your
    provider will probably want to perform a loopback test, or “loop up the CSU/DSU.”
    If the provider cannot loop up your CSU/DSU, he she will ask you if the provider
    is powered-up and connected. Demanding as it is, you should check all of your
    cables, and if you have an external CSU/DSU, good to check to make sure it is
    on and properly connected. If your side looks good, then there is a problem with
    the access circuit.


    # WHAT’S A LOOPBACK?


    > > A loopback refers to a provision for automated testing built into all T1 interface
    equipment. What happens is that the provider sends a special sequence of bipolar
    violations down to your equipment that instructs it to complete the circuit between
    the transmit and receive pairs. Now that he has a “loop,” the provider can send
    test patterns down the circuit and see. This is done to determine how much noise
    there may be on a circuit, and that the circuit is complete. Don’t confuse this
    with the local loopback network interface found on every Unix system—interface
    with IP address 127.0.0.1.


    # Problems in the Cloud


    The cloud refers to the portion of your provider’s network that lies beyond your
    routers and access. Once packets make the trip from your router along your access
    to your port on the provider’s equipment, you basically have no control over them
    until they egress on the other side. This means that it is difficult to actually
    detect a problem in cloud. The more likely scenario is that you will exhaust all
    of the other possibilities and deduce that the problem is there.


    The “symptom” is that routers on both ends are up and receiving keep-alive messages
    (so that you know LMI is up and your ports are active) but you cannot pass packets
    end-to-end. If both sides believe that the remote DLCI is active, then the problem
    could be buffering in the provider’s network. If one side cannot see its partner
    DLCI, then the provider has probably built the PVC incorrectly (or not built at
    all).


    In either case, there is nothing you can do except to open a trouble ticket with
    your provider. Because most Frame Relay networks have multiple redundant paths,
    problems in the cloud mean something bad is aft. Alternately, the problem could
    be with the switch or PVC configuration within the provider network.


    # Problems with Access at Location B and Router R


    Any problems on the other side can be evaluated in the same manner that you did
    on the A-side of the link. The only sticky point might be that you cannot get
    to router B (because the link is down!), or that router B is not a Linux router.
    If you are responsible for problem resolution on the B-side of the link, you should
    make provisions for emergency access.'
