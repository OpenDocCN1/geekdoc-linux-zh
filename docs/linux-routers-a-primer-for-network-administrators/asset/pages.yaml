- img_proc: true
  md: '# 316 Ethics and Other Considerations App. D


    I have worked with believe so. The typical rationalizations are, They are (mis)using
    company resources or The company policy manual states that such monitoring occur.
    While these things may be true, and may even grant any specific authority for
    the IT staff to engage in such activities, they rarely define specific and cause
    to perform such monitoring.


    If your management requests actions from you, I hope that you refuse upon moral
    grounds. I like to apply Kant''s “categorical imperative,” but the moral precept
    has several names, so you may call it you like. The fundamental question you have
    to ask yourself is “Would it be O.K. if everyone were to act as I intend to act?”
    I think that the answer is a resounding no. Some will maintain that they don’t
    send sensitive people infamatin via email, so they wouldn’t mind if someone monitored.
    This evaded the issue by limiting monitoring to a single type of monitoring. It
    would be a simple matter for company technicians to monitor your telephone conversations,
    for PBX administrators to review your voicemails, and for the U.S. Postal Service
    to open your mail. Most of this could be done without your ever knowing—the first
    without leaving the slightest trace. And it is trivial for your neighbors to pick
    a telescope at your bedroom window, or use a camera to record your comings and
    goings. Society frowns upon these things legally and socially, although the monitoring
    could be done with the same rationalization that you might use to watch a network
    activities. The telephone company might be listening to ensure customers are able
    to commit a crime. The PBX administrator might need to ensure that the system
    is not clogged with personal voicemails. The U.S. Postal Service could maintain
    that simply trying to make sure copyrights are not violated, enforced or other
    laws concerning materials which may not be sent through the mail. Your neighbors
    may have a right to know if you are conducting dangerous activities in your house,
    since such acts could eventually result in grievous infringement of their rights.
    In these cases, I believe that most people would scoff at the rationalizations,
    debunking them as inane, paranoid, and/or intrusive. Is network monitoring (for
    content) any different?


    Of course, not all ideas function flawlessly in the real world. What should your
    management requests that you monitor the network activities of an individual?
    You have to be measured in response, since you do not want to run the risk of
    being insubordinate. Nor will you fully know management’s reason for asking. Your
    response should clearly depend upon the severity of the situation, right? I do
    not believe so. When you are dealing with a corporate network that is owned by
    your employer and operated for business, I think you have to draw the line and
    be willing to perform only certain types of monitoring. Specifically, you should
    agree to supply information about the source/destination of packets, but not the
    contents. In other words, if your employer would like to spy on employee 2112,
    then you might produce a report that includes the fact that employee 2112’s workstation
    transferred packets to and from locations XYZ, YYZ, and XYZ. How is this different?
    For one, it takes you out of the position of having to peek at the packets themselves,
    so it is a purely objective assessment of employee 2112’s use of the network.
    Lastly, it is a form of monitoring is generally socially accepted. If management
    finds the destinations questionable, then may decide to confront employee 2112.'
