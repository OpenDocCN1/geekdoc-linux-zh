    of these standard services, but you need more protection than they provide, or
    than can be using `tcpd`. After all, what good is a network computer which cannot
    interact with the network safely? Rewriting all of them would be a lot of work,
    and any time a new service becomes available, you have to modify it with your
    security architecture. Why not cut them off at the source, before the service
    starts? You can do this to a certain extent with the kernel''s packet-filtering,
