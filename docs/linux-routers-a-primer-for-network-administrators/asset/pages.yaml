    # dd—The Multipurpose Diskette Duplicator


    > You can use dd to create an exact duplicate (or image) of any floppy disk (or
    other type of disk or file), regardless of the operating system on it. (Note that
    “dd” does not stand for “Diskette Duplicator.")

    To read the image, specify the device file of the device with the data to be read
    as the argument if=. The block size (bs=blocksize) is quantum of data to be read—if
    you know better, use either 512 or 8192 for floppy disks. The output file (of=/path/to/image)
    will contain the image being read.

    To write the image to another diskette, make sure the disk has been low-level
    formatted and then call dd, swapping the arguments for if and of.


    The LRP image is a bootable Linux system. It already has the kernel and all commands
    needed for the multi-distribution. What it lacks is the device driver modules
