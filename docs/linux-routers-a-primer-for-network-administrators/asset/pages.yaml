  md: '# EMERGENCY DOWN PROCEDURES


    Pray to God, but keeping row to.

    — Russian Proverbs


    So you''re running a Linux shop, and everything is peachy. Linux stays up when
    it''s up, and when it fails, there is a logical explanation, and it comes right
    back up. But what about the one time that it doesn''t? The time when hard disk
    gets tired of holding heads away from the platters and decides to let them rest
    for just a few seconds... Or the time you kick the power cord out of the machine
    while it''s very busy? Some planning and advance preparation, coupled with quick
    thinking and creativity, will keep your environment running when the outside world
    conspires to make it otherwise.


    This section contains ideas about how to make your Linux environment more highly
    available. As with many of the production tasks in the book you may find the strategies
    uninspiring, or may disagree with them entirely. If you already know better ways,
    should use them, and share with others. The disclaimer is that they represent
    what has worked for me in the past. YMMV...


    # 8.5.1 Redundant Services and Servers


    Deploying multiple machines, each capable of performing the same task, is the
    idea behind most of the complex Unix high-availability suites. Two or more machines
    perform an orthogonal set of duties when everything is running, and share a common
    data source (typically a dual-ported SCSI RAID) for the times machine $A$ is down
    and machine $B$ needs to take over for a while. During this time, machine $B$
    assumes as much of the identity of machine $A$ as feasibly possible. Clustering
    software operates upon this same principle, but varies in how it tricks the user
    into thinking that they are still using machine $A$. Whether they change the DNS
    record being used to access machine $A$, or perform some sort of transparent proxying,
    which we configured in this chapter, the idea is the same. Most of this software
    is implemented at applications instead of routers, but as discussed in Chapter
    7, a few scripts and you can roll over with your routers. Now we extend upon this
    idea and talk about more ways in which you can improve the illusion of 100% uptime—the
    illusion of uptime is far more important than the reality.


    Redundant Routers Because every Linux system can act as a router by a few simple
    statements, you can easily have several of your production machines as potential
    failovers in times of need. For routers, the key issue is of connectivity. If
    you keep this in mind, you will be able to quickly configure one of your machines
    to take over the duties of a local network router or a WAN router when production
    router go belly-up. Look at the network topology in Figure 8.6 for one way to
    do this. The idea is very basic—machines with an extra NIC available to assume
    the same connectivity displaced by the down router. To adequately prepared, you
    should have a script already written which will configure standby $A$ to become
    router $A$. During non-peak hours, you can test your configuration by'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# 284 Hafnium—Internet Services Router Chap. 8


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_307_0.png)


    Figure 8.6 Redundant Router Connectivity


    configuring the interfaces on router_A down and running the script. Once you trust
    your script and its ability to make standby_A become router_A, you can go ahead
    and work on ways to automate the failover. Because NICs are inexpensive, and scripts
    are free, there is no reason not to use Linux servers as standby routers at every
    point in your network.


    **Redundant Firewalls** Firewall failover is another story altogether because
    of security concerns, and what you can do here is largely dependent on your firewall
    topology. If you are using proxies, then a second proxy machine might be more
    susceptible to attack through one than the other, and having two (or more) machines
    might be necessary for your amount of client load. In this case, you might want
    to use an N + 1 approach towards allocating backup machines. The configuration
    of safe packet-filtering rules while allowing ample access to the proxies can
    get complex. In particular, you will need to forward traffic that traverses the
    packet filters, but you do not necessarily want to forward traffic which should
    use only the proxies. If you really need to do this, focus on using forwarding
    routers to limit traffic instead of output filters.


    In the case of a packet-filter, you probably do not want to have an extra machine
    connected to your perimeter net at all times. Because a firewall failure is probably
    important enough to warrant a personnel visit, you have a standby_B ready to take
    over, but leave it disconnected from the perimeter network. When you need the
    machine, you can physically connect it to the perimeter network. If you''re less
    paranoid about internal attacks, you can keep the interface configured but disconnected


    To summarize, firewall redundancy is well and good, but you should not promise
    your overall security model it. In my opinion, a good firewall might be one that
    goes down and stays down until an attack is over, and you''ve had a chance to
    verify that your system was not violated. An automated failover system which pops
