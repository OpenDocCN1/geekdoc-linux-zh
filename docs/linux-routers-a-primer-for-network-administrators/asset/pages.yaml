    # ROUTER PHYSICAL INSTALLATION


    Once you have your router loaded with a basic Linux install and have installed
    your interface card(s), you need to find a good place to put it. Physical instal-lation
    is often a secondary thought, but is important with WAN routers for a few reasons.


    +   - If you have an integrated CSU/DSU, you should be within 60 meters (133 feet)
    of the demarc installed by your access provider—less if they installed a smartjack
    which is run over twisted-pair to somewhere in the building. If you cannot be
    within this distance, you will need to program your CSU/DSU to compensate for
    the drop in signal strength (attenuation) due to the distance. This setting is
    known as LBO, Line Build Out.

