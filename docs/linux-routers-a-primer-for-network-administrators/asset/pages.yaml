    # 4.6 SUMMARY


    Now so we have a Linux router taking care of the LAN and dial-up connections to
    external networks. We can generate statistics about the amount of traffic sent
    using IP accounting, and view the contents of that traffic with packet captures
    like the sniffers mentioned in this chapter. We can also use private IP addresses
    to talk to public networks by means of IP masquerading. The next step is a general
    purpose WAN router, which is the topic of Chapter 5. This router can be used to
    connect our network to others (public or private) over high-bandwidth connections
    and traversing long distances.'
