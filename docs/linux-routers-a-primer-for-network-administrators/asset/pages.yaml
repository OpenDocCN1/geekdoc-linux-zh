    workstations during the late 80s and 90s.


    # Busy Linux Bees


    So does Linux fit into all of this? Linux has been, and is to a large extent,
    a solution for builders. I believe that this is what has brought it so far so
    quickly, and that it needs to be understood by those deploying it and managing
    it. If you have buyers (and there is no harm in this, I just believe that certain
