  md: 'In a typical scenario, there are two routers, each connected to different circuits,
    ideally from different service providers. With some creative routing, you can
    use both of the circuits normally, and operate in a degraded mode when a link
    is unavailable. While this looks good on paper, there are some potential pitfalls.
    For one, there might not be multiple (economically feasible) service providers
    at a given location. Overlapping redundant links from a single provider does nothing
    in case of a provider outage (and there have been a few significant Frame Relay
    outages in the past years). The second concern is although there different service
    providers, they may use the same access provider to deliver service to your site.
    In this case, a construction crew cutting up a piece of fiber-optic might render
    your circuits useless (If you have a large enough installation, you should be
    able to impress upon your provider to ensure that the access circuits are sufficiently
    redundant. If you are dealing with smaller sites, good luck.) Before you leap
    for the panacea of redundant links, you may want to do some homework about available
    options at your different sites.


    It may be that different locations call for different strategies. One way to fix
    things is to have redundant links which use different types of access, in hopes
    that partial access providers'' outages not affect both types of circuits. If
    you had digital access for normal conditions, and ISDN or analog access as a backup
    mechanism, then you might be spared when a backhoe misses its intended target.
    Most sites with redundant access dial-in access as an additional line of defense.


    # Multipathing over Redundant Links It may be that an analog or ISDN circuit as
    the only form of redundant access is too uncomfortable for your users or detrimental
    to your organization''s business model. If you have a second link, you should
    use a second router (it might be a system which normally serves another function)
    to protect against hardware failures, too. If you are paying for a second link
    (with the associated access and port costs), you certainly want to use it 100%
    of the time, and then have your site operate in a degraded mode when one of the
    links/routers fails. (Don''t forget the previous discussion of adequate redundancy
    for access circuits, and don''t forget about redundancy around the other end.)


    If you are running an dynamic routing protocol more capable than RIP, such as
    OSPF, then you can design the redundant paths into your routing topology. This
    is a very “traditional” way of doing things. Since Linux is about choice, there
    is another way. There is functionality in the 2.2.x kernel called IP: equal cost
    multipath which will forward packets over multiple pathways in a non-deterministic
    manner. To enable it, you need to compile your kernel with:


    +   Networking Options -->

    * [*] IP: advanced router

    * [*] IP: equal cost multipath


    You also need to the iproute Debian package or visit ftp://ftp.in.ac.ru/ip-routing/
    and get the sources for the iproute package. The command used to configure the
    routing is ip. You can add a multipath route with:'
