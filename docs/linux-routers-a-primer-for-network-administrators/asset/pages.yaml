    # 5.5 MRTG—MONITORING LINK UTILIZATION


    MRTG is short for Multi Router Traffic Grapher. It is a network monitoring tool
    that specializes in presentation of traffic data graphically, in real-time and
    over intervals, such as hourly, daily, weekly, monthly, and yearly. It uses the
    SNMP'
