  md: '96


    Erbium—An Extranet Router Chap. 4


    A can send to B via its default gateway


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_119_0.png)


    192.168.24.17 (private) B cannot respond to a private address over the Internet
    209.81.8.252 (Internet-valid)


    Figure 4.2 Scenario for IP Masquerading


    Remember that the private address space may be used by any private net, and as
    much, it may be routed internally at B’s network to some other machine with the
    address 192.168.24.17. To remedy the situation, the router alters the packet so
    that it appears to have originated from its external interface Rb, which is an
    Internet address. When the server sends a response, it is routed to R, which then
    forwards the packet on the client A. The topology, of course, is much more complex
    than that depicted; there may be many hops between the router and the server.
    The result, however, is the same. The packet appears to have an Internet-valid
    address and will find its way back to the router to be unmasqueraded.


    # 4.2.1 IP Masquerading Under the Hood


    Now that we are motivated to talk about masquerading, we can talk about what is
    really happening to the packet when it is masqueraded. For an example, let’s say
    the client A would like to connect to server B using either TCP or UDP². The client
    is going to send from port x to port y on the server. In order to reach B, A first
    sends the packet to its gateway, which has address RA. The gateway interface on
    the B side is Rb.


    If you take a close look at such a transaction, there are three different types
    of addresses involved, each has an Ethernet address, useful only for transmission
    to other machines on its local subnet. Finally, for the TCP and UDP protocols,
    there is a specific port on both the client and the server. Normally, the client
    port is not significant and is a value between 1024 and 65534, arbitrarily chosen
    by the operating system.³ However, the server response must arrive on the port
    where the client expects—otherwise, the client doesn’t know that the packet is
    a response to its send.


    +   ² The client/server designations refer to the system’s role in the transaction.
    The client originates the connection with the server, and the server responds
    to it.


    +   ³ If the port is not specified in the code, Linux starts at 1024 and simply
    increments the value each time a client binds to a new port for sending.'
