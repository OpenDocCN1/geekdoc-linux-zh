  md: '# WHOSE DLCI Is IT, ANYWAY?


    The preceding example configuration indicates that location A needs to address
    frames to DLCI 200 to get them to location B. From the information given, we cannot
    tell what the locations B and C will have in their configuration files to send
    frames to location A. Perhaps both "call" location A. Maybe not. This is because
    DLCIIs only have local significance—i.e., your router only sees the DLCIIs presented
    to it by the switch at your POP.


    This means the DLCI only has meaning for your router and the switch at your POP,
    and not that DLCI 200 is the “address of the node at location B” in any absolute
    sense. The concept is simple, but the implications can be confusing. For example,
    your provider could easily setup the switch at location B to use DLCI 200 to refer
    to the PVC that transmits frames to location A. In this case, both configuration
    files would list DLCI 200 as the media address to access the remote site. This
    situation is depicted in Figure 5.3, where site B accesses site C via 600, and
    site C accesses site B via 600. But site A accesses site B via 200, and vice versa.
    To make things even more confusing, site A accesses site C via 300.


    For this reason, I request that my provider supply a unique DLCI for each router,
    for routers that have more than one PVC. In other words, the switches at locations
    B and C both refer to location A by the same DLCI. This, in essence, gives each
    router its own DLCI (or address), and is an intuitive way to approach the matter.
    (See Figure 5.4.) Now, no matter what node you configure to talk to location A,
    it uses the same DLCI to get there.


    ![](img/7ea5bca3bf3791bc00052ffe33bd6162_162_0.png)


    Figure 5.4 A More Intuitive Way to Allocate DLCIs'
