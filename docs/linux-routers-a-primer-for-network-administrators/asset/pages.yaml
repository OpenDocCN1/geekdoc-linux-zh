  md: 'our bandwidth-impoverished users on the end of a skinny network pipe in any
    way possible (so they can accomplish real work while their colleagues are browsing
    the Internet).


    A common approach is to deploy HTTP proxy servers which cache successfully retrieved
    pages. A proxy can be very effective for increasing browsing performance for your
    users, especially when they frequently access a particular page, or when users
    use common pages, as search engines. Because you locate the “netographically”
    near the clients, hits are served at LAN speeds (almost as quickly as a webpage
    designer needs!). Miss cost the client only slightly more than the original lookup.
    Aha! The catch, you say. How much more is slightly more? The lookup and caching
    operations, when viewed from the vantage point of the user, are free. They take
    at least an order of magnitude faster than any actual HTTP GET could be completed,
    regardless of how many, but certainly several orders of magnitude faster for a
    GET of any considerable size. Many browsers support user-level caches, which results
    in similar savings. The added benefits of a caching proxy are:


    +   - The first miss for one results in subsequent hits for all other users. This
    improves throughput for commonly accessed pages like intranet pages. If you make
    a file accessible via a HTTP URL, the proxy will cache it too, which is invaluable
    when you need to update dozens of client machines with a virus definition file
    or new piece of software.


    +   - Caching provides a useful excuse for simultaneously logging user activities.
    While you shouldn''t use these data improperly, logging can be useful for studying
    bandwidth usage and to have an audit trail in a case user does something improper
    on the web.


    +   - Caching can be run in conjunction with Apache, making the additional overhead
    for web server minimal. Although you might not want to deploy a large website
    on your router, you can provide a general information page for the office, a telephone
    directory, or something similar quite easily.


    There are several caching proxies available for Linux. Some use Squid and Apache,
    both available as Debian packages. Either one of them will serve your need; which
    you choose is a matter of preference. I tend to use Apache because I am more familiar
    with its configuration, but I am beginning to suspect that Squid has more options.
    Below are some general notes on using them:


    # Apache Apache is best known as a web server, but it is also quite capable as
    a proxy. If you have already installed it, you need to do the following to modify
    it to act as a proxy:


    / /etc/apache/httpd.conf to load the proxy module and enable proxying, with statements
    like:


    ```

    LoadModule proxy_module /usr/lib/apache/1.3/libproxy.so

    ProxyRequests On

    CacheRoot /var/spool/apache_cache

    CacheSize 200000 # cache size in kb (2GB)

    CacheGcInterval 4

    ```'
