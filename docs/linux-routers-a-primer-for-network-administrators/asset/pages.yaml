  md: '# 7.1 CHDLC Router Topology


    **TTL = [0x0--0FF].** This is used only for the monitoring system, and can be
    left at its default of **0x7F** (127) or omitted.


    **CHDLC wanpipe1.conf—Logical Channel Section(s)** This section consists of an
    interface-specific section for each interface specified earlier in the file. Starting
    with WANPIPE2.1, this is typically a single interface, as `[chldc0]`.


    **MULTICAST = YES or NO;** to enable multicasting via this interface.


    **IGNORE_DCD = YES or NO;** the default is NO. This parameter decides whether
    DCD will be ignored or not when determining active link status for CHDLC.


    **IGNORE_CTS = YES or NO;** the default is NO. This parameter decides whether
    CTS will be ignored or not when determining active link status for CHDLC.


    **IGNORE_KEEPIVE = YES or NO;** the default is NO. (Are you beginning to notice
    a pattern?) This parameter decides keepalive packets will be ignored or not determining
    active link status for CHDLC.


    **KEEPIVE_TX_TIMER = [0--60000];** the default is 10000 (milliseconds). This sets
    the interval between keepalive packet transmissions. If you set to keepalives,
    then this value is meaningless.


    **KEEPIVE_RX_TIMER = [10--60000];** the default is 10000 (milliseconds). This
    tells the router how often to expect keepalive packets from the other router.
    **IGNORE_KEEPIVE=YES**, then this is of little use.


    **KEEPIVE_ERR_MARGIN = [1--20];** the default is 3. If you are not keepingalives,
    and there are KEEPIVE_ERR_MARGIN consecutive timeouts, the driver will bring down
    the link assuming that something is wrong.


    **HDLC_STREAMING = YES or NO;** the default is NO. If set to YES, this turns off
    CHDLC and uses raw HDLC frames. SLARP packets are the mechanism by which the IP
    address of one side of the link can be dynamically assigned. The default value
    is 5000; a value of 0 disables dynamic IP assignment. See Section 7.1.3 for related
    configuration information.


    **SLARP_TIMER = [0--60000];** The interval between sending SLARP packets in milliseconds.


    # 7.1.3 Configuring the Interfaces For CHDLC


    With just PPP and Frame Relay links using WANPIPE, both of the link need to be
    assigned an IP address in order to talk to one another. Unlike these protocols,
    HPLC offers a mechanism to assign one of the link automatically. To use this feature,
    decide which side will be the **master** and configure its IP address (IPADDR)
    in the *interfaces/chldc0* file. Set POINTPOINT to be value of IPADDR incremented
    by one. You should also configure SLARP_TIMER=0 in wanpipe1.conf on this system.


    On the remote router, the *slave*, you should set IPADDR=0.0.0.0 (otherwise, you
    will have problems when WANPIPE starts) and leave POINTPOINT blank.'
