    # 1.1.6 SCSI Adapter


    Normally, I do not use SCSI devices in my routers. (I recommend SCSI tape drives
    for backups, but these are normally done over the network to another machine.)
    If you require a SCSI adapter in your system, check the PDP''s Linux Hardware
    Compatibility HOWTO and consider an adapter that supports bus-mastering DMA transfers.
    Bus-mastering greatly reduces the load on the processor and the bus while accessing
    the device(s) by allowing the adapter to read and write data from memory directly.
    Without bus-mastering, the CPU has to manage these transfers, which necessitates
    transferring the data from the device to the CPU and then from the CPU to memory
    to complete a read.


