    # 5.3.4 Interface Files for Frame Relay


    Our link is almost completely configured, but there is still the matter of configuring
    the interfaces with the IP addresses for their point-to-point connection to the
    other end of the PVC. If you are used to use Frame Relay router configurations,
    you may think that this is optional. Theoretically, you do not have to have IP
    addresses assigned to each of the Frame Relay clause knows how to route your packets
    (based on the DLCIs and PVC). However, when you are using WANPIPE, you need to
    assign each end of PVC an IP address. This is because the kernel can treat these
    interfaces just like other point-to-point interface with respect to routing, displaying
    its properties with ifconfig, etc.


    > RFC 2390 for more information about INARP.'
