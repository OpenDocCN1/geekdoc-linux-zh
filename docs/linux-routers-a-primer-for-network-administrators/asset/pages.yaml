  md: 'which DLCI s are active, available, and missing. The exact format of the messages
    depends upon which the status polling (LMI) protocols you are running. The original
    LMI is known simply as LMI. This protocol has the limitation of being uni-directional
    (your node router to ask the questions, and the POP router would answer them).
    After updating, the newer choices are Q933 (Annex A) and ANSI (Annex D).


    Your router will periodically send out an enquiry to the effect of Are you alive?
    The upstream router should reply within a certain timeout period (T391). Your
    may send a Full Status Enquiry to the POP router, requesting more information
    about the status of the network. The POP should reply within the timeout period
    specified by T392. The POP router may also originate messages. These messages
    may be things like DLCI 600 is no longer active or DLCI 400 has become active.


    > HINT: SANGOMA''s SNOOPER UTILITY


    Sometimes many things have gone wrong, or documentation is so scarce, you just
    want to establish some confidence that your circuit is functioning. For these
    situations, you can use Sangoma''s SNOOPER utility. If you do not have the floppy
    disks with your card, you can get a copy of it at http://www.sangoma.com/snooper/.
    Note that operates only with Sangoma ISA cards, such as the S508.


    SNOOPER is a DOS executable. To use it, place it on a bootable DOS diskette and
    boot your router. It will diagnose many problems with a T1 link, including a noisy
    T1. It can also tell you if the router on the other side is talking PPP or Frame
    Relay. When you''re stumped as why things aren''t working, it''s a convenient
    way to establish the validity of your CSU/DSU configuration and eliminate the
    access circuit from suspicion.


    That concludes the discussion of fpipemon and Frame Relay troubleshooting. Documenting
    trouble-shooting procedures and strategies is difficult when you consider the
    range of different situations one may encounter. I have tried to emphasize the
    knowledge gained during my experiences with WANPIPE Relay links. You may come
    across completely new and mind-boggling difficult issues to solve. If this happens,
    you should not be discouraged or assume that the problem is automatically on your
    side. I''ve seen providers make configuring a circuit where I had to all the problem
    for them before they finally corrected it. It is one of the advantages of Linux
    and WANPIPE—you are armed with information and tools. A lot of this information
    may be available on Sangoma''s trouble-shooting webpage. The URL is http://www.sangoma.com/linedebug.htm.


    Once you are up and running, you''ll want some know how much and how effectively
