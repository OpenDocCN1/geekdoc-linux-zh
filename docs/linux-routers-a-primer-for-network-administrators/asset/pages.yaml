    mini-HOWTO. If you would like to use the package without running Debian, you can
    retrieve the source from any Debian mirror. The following is taken from the description
    which accompanies the package:


    By default, this package configures the system as a basic forwarding firewall,
    with IP spoofing and stuffed routing protection. The firewall will allow all hosts
    behind the firewall to get to the Internet, but not allow connections from the
    Internet to reach the hosts behind the firewall. However, ipmasq now features
    a very flexible framework where you can override any of the predefined rules if
    you choose. It also allows you to control if the rules are reinterpreted when
    pppd brings a link up or down. This package should be installed on the firewall
    host and not on the hosts behind the firewall.


