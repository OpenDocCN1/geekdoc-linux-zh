    this fact from the very beginning and work with this in mind if you want your
    production environment to have a minimum of downtime. For this reason, any changes
    should be thoroughly tested before you roll them to your production environment.
    The problem is that networks are not always easy to accurately. It is often difficult
    and expensive to duplicate aspects of your environment, such as network load and
    circuit types, particularly when you are running protocols that involve networks
    controlled by others (e.g., Frame Relay with your provider or connecting to the
    Internet).


    You can limit your vulnerabilities by being confident about any changes you make.
    Part of this is testing, while another component is feeling sound change management
