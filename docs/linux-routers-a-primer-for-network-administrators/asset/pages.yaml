  md: '# B.6 Building Software from Sources


    Configuration prepares the makefile (oftentimes named Makefile) for compiling
    the software in your environment. How it is depends upon the author of the software.
    Many authors include a script named configure which automates the configuration
    for you; start it with /configure.


    If there is not a configure script, or if the configure script bombs out for any
    reason, you should break down and read the instructions that came with the software.
    There are typically files named README and INSTALL. If both exist, the former
    contains general notes for this current release while the latter has instructions
    for building and installing the software.


    Compiling the software is typically nothing more than typing make. Should this
    complete without errors, you can go on the next step of installing the software.
    Should it fail, you need to put on your programmer''s cap and figure out went
    went. Often, the software requires the development version of a library or headers
    which are not loaded on your system. Or it may be looking for the library or a
    C header file in the wrong location. (You can quickly find files on your system
    using the locate command). If the build fails due to some problem with the source
    itself, check the README to see if there are any compiler or library versions
    you might have overlooked. If you still require assistance, try to get help locally
    or via newsgroup, before contacting the author directly.


    Installing the software seems to come in two. If the build results in a single
    executable, you can run it right from where you built it, or you might have to
    hand-lib it into place yourself. For more complicated software, consisting of
    multiple binaries or configuration files, you can probably use make install to
    install it. /usr/local/ is a good place to install software you build yourself,
    as it will not conflict with files in your Linux distribution (but remember to
    add /usr/local/bin to your PATH).


    After satisfactory testing, how do you get the software you built on your workstation
    installed on the router? I typically take a fresh copy of the tarball, copy it
    over to the router, and rebuild from scratch. This ensures that the binaries built
    are linked against the versions of the libraries on your router, and it''s easy.
    It also alleviates the need to have a compile environment on your workstation
    that perfectly matches the router, although for large environments, you should
    consider having such a build system available.'
