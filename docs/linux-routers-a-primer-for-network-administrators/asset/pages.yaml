  md: '# Californium—Satellite Office Router


    ```

    californium:/root> uptime

    2:36pm up 244 days, 1:14h, 1 user, load average: 0.05, 0.00

    ```


    Californium is the first Linux router deployed which was remote to the headquarters
    office. The small project office had no IT staff on site and the router was its
    lifeline to the corporate source code revision system, the intranet, and through
    the firewall out to the Internet. I have to admit that I did have some angst about
    the router''s being so distant. Should anything happen to it, it would have been
    costly and time-consuming to make a service call. There was a bit of pride at
    stake here, too—a professional rivalry with a colleague who was deploying traditional
    routers remotely. The argument goes that because the traditional router has no
    hard drive and runs more stable, it is less likely to fail, easier, and therefore
    less expensive to support. My counter-argument is that the risk of hard drive
    failure can be managed, and that the Linux code is plenty stable. Furthermore,
    the flexibility of the Linux platform warrants any additional administrative overhead.


    Californium was the first WAN router I configured to do more than just route.
    Because the remote office was lightly populated (and scarcely funded), the strategy
    was to try do with less—much less. To keep costs low, californium took over some
    duties normally relegated to non-Linux systems at my organizations, and some duties
    that a traditional router typically cannot handle. Additionally (no matter what
    the users believe), a WAN administrator always takes pity on the less bandwidth-fortunate.
    To this end, californium is configured to help make their plight more bearable
    by adding services which helped conserve bandwidth on the WAN connection back
    to the main office.'
