    # 4.3.1 Configuring IP Masquerading with ipchains


    As IP accounting and firewalling, you have a kernel with masquerading support,
    you use ipchains (for 2.2.x kernels) to configure rules. In this case, the rules
    are part of the packet-forwarding mechanism (compared to the input, output, or
    accounting mechanisms). The syntax for ipchains is identical to that covered in
    Section 3.3.3, but we use some different arguments for masquerading.


    Managing rules consists of entering them, viewing them, editing them, and removing
    them. Each involves specifying pattern-matching criteria along with the option(s)
    to tell the kernel to perform masquerading when a match occurs. Recall that ipchains
    uses the concept of targets, so masquerading occurs when a packet matches a rule
    with target MASQ. Furthermore, only packets that are forwarded can be masqueraded.


    Adding IP Masquerading Rules with ipchains All packets are forwarded automatically
    traverse the built-in forward chain. To masquerade, add a rule to the forward
    chain with a target of MASQ. Alternatively, you can add a rule to the forward
    chain with a user-defined chain as its target, and somewhere along this chain
    is a rule with the built-in target MASQ. A few examples will clear this up:


    ```

    # masquerade EVERYTHING

    ### insert a rule that masquerades everything that the

    ### kernel forwards, using the built-in "forward" chain

    ###

    ### (note that not specifying any matching criteria means

    ### that all packets will be matched)

    erbium:/root> ipchains -I forward 1 -j MASQ


    # masquerade packets forwarded out over ppp0

    ### create a user-defined chain named "ipmasq"

    ### the built-in "forward" chain, and add a rule to masquerade

    ### packets which will be forwarded over the ppp0 interface

    erbium:/root> ipchains -N ipmasq

    erbium:/root> ipchains -A forward -j ipmasq

    erbium:/root> ipchains -A ipmasq -j ppp0 MASQ

    ```'
