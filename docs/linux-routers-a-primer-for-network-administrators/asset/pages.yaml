    \ -A forward -d 10.10.34.216/255.255.255 -j MASQ\n### is equivalent to:\nerbium:/root>\
    \ ipchains -A forward -d 10.10.34.216 -j MASQ\n```\n\nSometimes it is easier to\
    \ specify what it is that you do not want to masquerade. For example, you have\
    \ a topology where the firewall is performing masquerading, and there are several\
    \ machines located outside the firewall that have routes for your internal networks.\
    \ You do not want connections to these machines from internal networks to be masqueraded\
    \ because any meaningful information about the source IP address is lost. If the\
    \ internal network you need to masquerade is 192.168.0.0/255.255.255.0, and the\
