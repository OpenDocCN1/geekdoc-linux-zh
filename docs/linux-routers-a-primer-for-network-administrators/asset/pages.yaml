  md: '# 2 Patching the Kernel


    At the time of writing, version 2.2.x is out and stable, but small issues keep
    popping up. Instead of allowing the 2.0.x series to erode from neglect; the kernel
    developers have extended its useful life by generating patches addressing security
    holes and new driver needs. Version 2.0.38 is the most recent release of the 2.0.x
    series, and this is still what I use in production.


    # KERNEL VERSIONS


