  md: '# Zinc—A Frame Relay Router


    Zinc has been up and routing IP over Frame Relay since late 1996, and has proven
    itself a “bread-and-butter” production Linux application. The heart of the router
    is a S508 router card manufactured and sold by Sangoma Technologies, Inc. This
    card, a 90MHz Pentium-based PC with 16MB of RAM, plus a little Linux-kernel glue
    makes an excellent low-cost Frame Relay router—one which is easy to administer,
    even for the first-time WAN administrator, offers the flexibility of a general-purpose
    platform. Zinc’s configuration should give you a good basis for building your
    own Frame Relay router.


    Before we dive into building our Frame Relay router, we first cover some Frame
    Relay concepts for those who have not worked with it before, followed by a short
    introduction to the S508 card and other WAN adapters available for Linux. The
    bulk of the chapter discusses configuring a Frame Relay router using WANPIPE,
    the software drivers and toolkit that accompany the Sangoma cards, and trouble-shooting
    using this software. Related topics covered at the end of the chapter include
    monitoring and running WANPIPE in conjunction with LRP.


    # 5.1 FRAME RELAY BASICS—DLCIs, PVCs, and CIRs


    Frame Relay for the WAN admin is pretty simple stuff, once you get the hang of
    it. The only confusing part is getting handle on the terminology and understanding
    the different layers which make up a link. Essentially, you are dealing with an
    easy-to-configure version of PPP (although it’s more complicated for network providers
    and other more complex topologies). First, let us define some terms (some of which
    are a review of Section 2.3.1); these terms are put to use in Figure 5.1.


    > Actually, zinc ran fine on a 486/66 with 8MB for almost two years.'
