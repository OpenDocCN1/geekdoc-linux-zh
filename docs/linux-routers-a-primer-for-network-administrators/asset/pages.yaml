    # 4.5 IP Monitoring Tools


    Having access to the data on the line is invaluable when you are trouble-shooting
    a variety of network problems. Sniffers can operate on all different network layers,
    or be configured to operate at a certain layer. Imagine that all is happening
    on an Ethernet segment when machine A tries to connect to machine B and nothing
    goes wrong...


    +   1. First, machine A might need to resolve the hostname of machine B, requiring
    it to perform a DNS hostname lookup. When it calls gethostbyname(), UDP packet
    is formatted to be sent to the DNS server.

    2. For our example, let’s assume that the DNS server is on the IP subnet, and
    is known as machine C. This means that the IP stack is not going to use a gateway
    to transmit the packet. It will send the packet directly to the DNS server. To
    contact the DNS server, machine A will have to issue an ARP request to locate
    the address of machine C. The ARP request is sent to media address:ff:ff:ff:ff:ff:ff,
    which is the broadcast address for the Ethernet segment.

    3. Machine C will answer with an ARP reply which contains its Ethernet hardware
    address.

    4. Machine A can now send its UDP packet to port 53 on machine C as an IP packet.
    Machine C’s reply goes out immediately because C knows machine A’s Ethernet hardware
    address. The ARP table on machine C should have been updated with this information
    when it received the packet from machine A.'
