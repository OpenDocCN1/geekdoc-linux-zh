  md: '# Configuring LRP to Be Silicon


    To configure the LRP-silicon; just follow these steps:


    +   1. Boot your router system with the LRP boot floppy. You will notice the banner
    message which can be customized by replacing syslinux.dpy (on this disk) with
    your own ASCII art.

    2. Login to the router as root. Initially, there is no root password, but we will
    set it soon.

    3. You will be presented with the LRP configuration menu. This menu allows you
    to edit configuration (by navigating the filesystem for those who are not familiar
    with their locations). You can (q) uit the configuration menu and work directly
    on the command line and return to the configuration menu any time with lrcfg.

    4. Hit q to exit to the command line.

    5. Use the passwd command to change the modules password.

    6. Eject the LRP root floppy and insert the modules with mkdir /tmp/mnt ; mount
    -t msdos /dev/fd0 /tmp/mnt.

    7. Copy the required modules from /mnt into place in /lib/modules. Do not create
    subdirectories underneath /lib/modules. All modules must be in /lib, as this is
    what the LRP version of /init.d/modutils expects them to be. For silicon:


    ```

    router# cd /tmp/mnt

    router# cp net-3/c59x.o /lib/modules

    router# cp ipv4/ip-alias.co /lib/modules

    router# cd

    router# mount /tmp/mnt

    ```


    +   8. Go ahead and eject the LRP modules so that you do not inadvertently try
    to write it later when you back up your configuration for your LRP disk.

    9. Edit /etc/modules to load both of these by adding/commenting the lines 39cx
    and ip-alias. The editor that comes with LRP is ae.12 It has vi-esque and emacs-escape
    modes; the one you depends on how you invoke it; it will act like vi, while ae
    is the modelless mode. If you need help, hit F1.


    +   10. Next you need to configure network on your system. You can either edit
    /etc/network.com/ from the command line, or restart lrcfg and select 1 Network
    settings, 1 Network Configuration (auto). In either case, to make the following
    changes:


    +   (a) set IPFWINDING_KERNEL=YES

    (b) CONFIG_HOSTNAME=YES

    (c) uncomment IF0_IFNAME=eth0

    (d) set IF0_IPADDR=192.168.16.1

    (e) set IF0_NETMASK=255.255.255.255


    > 12 The editor found on Debian and other rescue floppies.'
