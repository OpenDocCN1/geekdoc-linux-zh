    # 2.2.3 Ethernet Switches and Hubs


    Although, from the users'' perspective, there is little difference between switches
    and hubs (perhaps additional performance when using a switch), there are significant
    differences for network administrators.


    A switch differs from a hub in that the former maintains a mapping of ports to
    the MAC address(es) attached to them. It uses this table to "switch" packets between
    ports by connecting the sending and receiving port using its crossbar circuitry.
    In contrast, a hub is simply an electronic conduit, which forwards anything received
    on one port to all other ports. In general, switches can do everything a hub can,
    plus the following:


    +   - They provide protection against people running packet sniffers on other
    ports on the same device. See Figures 2.4 and 2.5.


