  md: '# Frame Relay Basics—DLCIs, PVCs, and CIRs


    other.) From your vantage-point, a PVC can be thought of as a network pipe running
    between two DLCIs. PVCs are not directional, or they are strictly associated with
    bandwidth, although many like to talk about the "speed of the PVC"—they should
    be talking about the CIR with that PVC.


    CIR—Committed Information Rate (expressed in bits per second) is the maximum rate
    at which your guarantees you can transmit packets without any loss. (Actually,
    this guarantee is often a "best efforts" type of service.) CIRs, unlike PVCs,
    are directional, which means that the guaranteed bandwidth from router A to router
    B does not equal the guaranteed flow in the reverse direction. Not all providers
    allow you to specify the flow of asymmetrical CIR for a PVC. If they are available,
    they are a good way to save costs while still providing adequate bandwidth for
    your application.


    LMI—Local Management Interface is the method by which Frame Relay routers keep
    each other notified the status of the network. This involves the exchange of status
    messages between your node and the router at the POP. These messages may be of
    three different standards: LMI, ANSI (also known as Annex D), and Q.933 (also
    known as Annex A).


    NNI—Network to Network Interface is a term used by providers when they connect
    two disparate networks. This enables them to provide a PVC between routers located
    on different Frame Relay networks. If you need a PVC between one of your nodes
    and a business partner who uses a different provider, ask your provider if/she
    has an NNI with the other provider.


    # 5.1 Frame Relay Bandwidth


    One that confuses first-time Frame Relay administrators is the question, How much
    bandwidth do I have? The question is important because ordering Relay services
    can get complicated (and expensive), and you want to know what to expect. There
    are different parameters in a Frame Relay network which dictate the end-to-end
    bandwidth. Some scenarios which affect this bandwidth are:


    +   1. You may be saving telcos by multiplexing applications on a single piece
    of digital access. In this case, your access is necessarily larger than your port.


    +   2. If access is inexpensive, you may choose a port smaller than your access
    to avoid paying for a port which fills up the access.


    +   3. Once your data entry into your provider''s network, they may become subject
    to the CIRs you have selected for your PVCs. Different providers enforce the CIR
    upon ingress (entering the network) or egress (exiting the network). Still others
    never enforce the CIR at all, in link speed equates equates to the lower of the
    two associated port speeds.


    +   4. You may have different port sizes at each end of a PVC, which limits-put
    to the lesser of the two. (However, depending upon how your provider''s'
