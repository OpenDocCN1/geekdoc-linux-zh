  md: 'and came back up. This was mentioned in Section 1.2, but it bears repeating:
    Physically isolate your routers from the general public whenever possible. If
    you cannot do that, then use power-on (BIOS) passwords, case locks, and any other
    method you can think of to prevent unauthorized access to your machine.


    +   2. Do not be naive about the dangers of sending passwords in cleartext over
    the network. The Linux version of login prohibits you from logging in as a superuser
    via telnet or login, by default it does not go so far as to prevent you from logging
    in as a normal user and then performing sudo. If you do, you will be sending the
    root password in cleartext via the telnet session. Your login mechanism should
    be such that you are able to login to your router(s) from any location unless
    you are restricting access to the console only, which is not a bad idea). In any
    event; do not fall into the trap of believing that network access to your systems
    is safe if there is not some form of encryption taking place at every step along
    the way. Otherwise, your password could traverse one encrypted, only to be unencrypted
    and in cleartext over the next hop. I am referring to the situation when you are
    using machine A to access machine B via a secure mechanism, and then login to
    machine C from the shell you have running on machine B. Even A -> B is secure,
    B -> C is not necessarily so.


    ssh help you out of the predicament because it encrypts the entire session, allows
    remote execution of commands, and also comes with scp (a secure form of cp). Note
    that the original ssh license is compatible with all forms of use or philosophies.
    You should read the license carefully if you are in the business of supplying
    turnkey systems or intend to otherwise integrate ssh into a commercial product.
    The license accompanying version 2 is much more restrictive, so do not neglect
    to review and comply with it. Fortunately, there is now an OpenSSH which is “free”.


    Because ITAR considers ssh (and many other programs which include cryptography)
    a dangerous encryption-based weapon when it is transmitted in electronic format,
    it is not publicly available for download from sites within the United States
    and other countries. You can find it and other encryption-based software on FTP
    sites in the “free world”. For Debian packages, see http://www.debian.org/misc/README.non-US.
    Alternatives to the ssh package are telnet98 and telnet-bsd.


    +   3. Equally dangerous as sending passwords in cleartext over the network is
    storing them anywhere where they can be retrieved or sending them via email. But
    it can be tough to remember a long list of passwords, especially passwords which
    you use only rarely. For example, you may need to exchange a set of passwords
    with another administrator in the company in case something happens to you.


    > 5 See ITAR in the glossary.'
