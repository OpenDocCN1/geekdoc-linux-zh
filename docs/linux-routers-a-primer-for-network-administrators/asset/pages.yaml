  md: '# Zebra is intended to be used as a Route Server and a Zebra Reflector.

    Zebra is not a toolkit; it provides full routing power under a new architecture.
    Zebra is unique in design and that it has a process for each protocol.


    It also contains support for IPv6, although it is not listed in the description.
    There is a Debian package (zebra) available, but if you have to build it from
    the sources, don''t despair. They are an excellent example using the GNU tools
    to their fullest potential. I was able to build the executables and produce the
    documentation in ten minutes. Note that currently the documentation is in info
    format, not as manages.


    ```

    ### access to the documentation

    ### note: you must have the tetex-bin package installed

    $ cd zebra-0.73/doc

    $ tex zebra.texi

    ```


    ```

    # to view the documentation

    $ xvi zebra.dvi


    # to print out, assuming that you have

    # magicfilter installed properly for your default printer

    $ dvips zebra.dvi -o /tmp/zebra.ps

    $ lps /tmp/zebra.ps

    ```


    The configuration of Zebra is covered in the documentation (distributed in TeX
    for format; .texi file). As a bonus for those of you with experience with Cisco,
    the configuration syntax is similar.


    As mentioned on the webpage, Zebra is different from other routing daemons that
    it provides a separate daemon for each routing protocol. Like other routing daemons
    and routers, Zebra supports a tenant session running on a special port which it
    is known as the VTY interface. Each of the protocol daemons has its own. If you
    are using the Debian package, this documentation is in /usr/share/doc/zebra/.
    A few points about the Debian package:


    +   - All of the configuration files are in /etc/zebra/

    - You control which routing daemons start listed by them in /etc/zebra/daemons.


    # 8.4.3 The Multi-Threaded Routing Toolkit


    If zebra doesn''t strike your fancy, you can use MRTd, the Multi-threaded Toolkit
    daemon which is made possible by grants from the NSF and the Intel Corporation.
    The presence of money means everything is organized and there is pretty documentation
    (which is also pretty good); they even have a release schedule. MRTd is developed
    natively in Linux, so it does not always compile on try. On the other hand, it
    is available for other platforms.


    The latest version at time of writing includes support for BGP4+, BGP, RIPng,
    and RIP2 (which includes support for RIP1), with plans to support OSPF IPv4 and
    IPv6. Like Zebra and Gated, you can interface the daemon via telnet to a well-known
    port.


    > 9 Although it sounds commercial, this sort of sponsorship is really in the grand
    tradition of TCP/IP itself, which has its roots in DARPA.'
