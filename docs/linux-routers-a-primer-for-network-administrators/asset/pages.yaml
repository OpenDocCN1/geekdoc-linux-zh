  md: '# 5.6.1 Adding LRP Packages to Your LRP Root Disk


    Adding a package to LRP is straightforward


    +   1. Make any changes you require to the .lrp tarball, e.g., for WANPIPE, you
    can provide your specific WANPIPE configuration file, and then reassemble the
    tariff.

    2. Mount the LRP root floppy on your workstation (remember that it is a DOS formatted
    floppy) and copy the .lrp file into the root directory of the floppy. Use a command
    as mount -t medos /dev/fd0 /floppy to mount the disk/floppy.

    3. Edit /floppy/syslinux.cfg and modify the LRP of the append-line to reflect
    the package(s) you added. For base packages WANPIPE, the list looks like LRP=etc,
    local, modules, wanpipe.

    4. Unmount the floppy with umount /floppy and re-run syslinux against it to update
    the configuration.


    # Using mtools to Work With MS-DOS Filesystems


    > Alternatively, you can use mcopy (part of the mtools package) to copy files
    to and from the LRP floppy. These tools allow you to work with MS-DOS formatted
    filesystems without explicitly mounting and mounting them as part of your filesystem.
    The tools include most of the basic DOS file manipulation commands and use /etc/mtools.conf
    to assign “drive letters” to devices and partitions on your system.

    For example, in /etc/mtools.conf, I have:


    ```

    drive a: file="/dev/fd0" exclusive

    This allows me to use commands like:

    # copy the file over so that I can edit it

    zinc:root> mcopy a:syslinux.cfg /tmp/syslinux.cfg

    zinc:root> vi /tmp/syslinux.cfg

    zinc:root> mcopy /tmp/syslinux.cfg a:syslinux.cfg

    # check the new configuration file

    zinc:root> mtype a:syslinux.cfg

    ```


