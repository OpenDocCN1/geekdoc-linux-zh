  md: '# Conclusion


    You’ve made it this far, and I sincerely hope that Linux Routers has given you
    some ideas, and maybe advanced beyond your knowledge. The scenarios presented
    in this book are “real-life”—I’ve used Linux to deploy them in production. As
    such, I feel confident that they are realistic applications of Linux routers,
    but I am certain that they are merely a small subset of practical Linux production
    uses. Therefore, the “omission” of an application scenario from this book should
    not deter you from a deployment. In fact, I have been some more (different) things
    with Linux routers recently, such as deploying them as VPN routers within a corporate
    network to enhance security for groups'' special needs. I had that time to include
    them in this book.


    When developing new types of Linux routers, my suggestion is to keep an eye toward
    fundamentally sound system administration practices. If you recall the first chapter
    in this book, when we discussed hardware selection and choice of Linux distribution,
    the emphasis was not on cutting-edge technology, nor on the distribution with
    the bells and whistles. Technology for the sake of technology, has its place,
    but not in router closets or data centers (IMHO). And stability goes beyond hardware—they
    are merely a foundation. Best practices for system administration include good
    documentation and change management, plus a level head concerning when to deploy,
    and how expeditiously address issues.


    I’m not going to review each of the chapters, since they hopefully speak for themselves
    and you can refer back to them as you like. There were a few comments that surfaced
    during the technical reviews of this book that I would like to include now. First,
    of all portions, of the text illustrate that I have i386 bias which I am guilty
    of respect to Linux. Actually “bias” isn’t really the correct term—at the time
    of writing, all of my experience has been running Linux on Intel architectures—so
    “ignorance” is probably more appropriate. Since I have, to much my delight, worked
    with Linux on the Alpha, SPARC, and StrongARM platforms. Whether or not one hardare
    architecture is superior to the other is immaterial. The fact that I can use a
    common toolset across all of them is simply amazing. It spoiled me, and it also
    redoubled my complaints about working around the arbitrary differences that separate
    the comercial Unices.


    Another point which was brought to my attention is this book’s lack of emphasis
    on security. My first instinct is to point the finger back at “traditional” routers
    that can'
