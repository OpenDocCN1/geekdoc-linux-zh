    packet, the router sends it back to the client at the client port.


    # ### What is the Expiry Field and Why Is It Necessary? If someone initiates a
    TCP connection, but then some evil fails him/and he/she is not able to take down
    the connection gracefully, the masquerading router will sit there waiting for
    more packets because it never saw the stream taken down properly. Since UDP is
    stateless, the situation is even more dire; the router is never to intercept any
    information about the final packet in a UDP sequence. However, during their normal
    operation both types of masquerading use ports on the router. If the masquerading
    timed out, some of these ports would linger forever... or until the next reboot,
    which would probably have to occur when all 65535 ports on the system were exhausted.
    The expiry timer is reset each time the connection is used. They then starting
    count down, if the masquerading for that session is torn down.


    Modifying Masquerade Expiration Timeouts with ipchains You can modify the expiry
    timeout to something other than the defaults in *ip_mas.h*. Those defaults are
    15, 2, and 5 minutes for TCP sessions, TCP in the WAIT state (after receiving
    a FIN packet), and UDP packets, respectively. There is also a default for ICMP
    (about two minutes), which may be set only by modifying the header file and recompiling
    the kernel. The syntax to modify the TCP and UDP values is:


    ```

    ipfwadm -M -S tcp tcpfin udp

