  md: '# 6.2 General Network Security Measures


    since is a stately version of tail. It adds useful functionality for scanning
    low-volume logfiles by displaying the logfile since the last time it was.


    syslog-summary incorporates similar functionality to that described above with
    since (with the --switch), has a filtering mechanism (with --ignore), and delivers
    on its name by summarizing the occurrences of a message in the logfile.


    xwatch can color-code a logfile being watched to make more important events easier
    to notice.


    +   - Read Practical UNIX and Internet Security from cover to cover. This book
    is filled with valuable information based on extensive experience. A reference
    is available in the Bibliography, which starts on page 337.


    +   - If you become paranoid that someone within your group (another administrator,
    perhaps) is doing Not Good Things, you can use the ttnoop (and ttyl) of your system
    via a serial interface to record every telnet and login session.


    # 6.2.2 Network Service Security


    You want your systems to be secure. You have made sure that the passwords are
    secure. You never send your password over the network unencrypted. Better yet,
    you login only to the console. The system is physically secure. You have taken
    every measure to make sure that nothing logged by syslog eludes you. What about
    network-based attacks? Unfortunately,it is the network. To limit your exposure,
    you should disable any router from the network—(network) services To check which
    network ports are open on your system, use the netstat command with various options.


    +   - Review /etc/inetd.conf and turn off any services which are not needed. These
    are security holes waiting to happen. And even yet, decide between telnet and
    login, or if you are compatible with the service, use ssh. You turn off a service
    by commenting out the appropriate line in inetd.conf and then stopping and restarting
    inetd. The same applies for xinetd, a more configurable replacement for inetd,
    you can ask inetd to re-read the configuration file with either /etc/init.d/database
    reload (Debian), kill -HUP $ (pidof inetd), or go for the gusto and kill $ (pidof
    inetd); /usr/sbin/inetd.

    - netstat -a | is the old standby that will be familiar to most users. It displays
    all family inet (i.c., TCP/IP) sockets in use, in addition to family unix sockets
    (which are not of concern to us here). It resolves service names using /etc/services
    (or whatever mechanism is indicated in /etc/nsswitch.conf).


    > 6 Network services are often referred to as just services, due to their connection
    with the /etc/services'
