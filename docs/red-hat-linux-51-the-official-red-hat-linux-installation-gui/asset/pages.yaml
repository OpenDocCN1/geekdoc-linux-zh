- pgno: 204
  md: '# C.1 Applications


    # C.1 Applications


    As this section''s name implies, this is where you can find most of the applications
    available with Red Hat Linux. We''ve split the applications into several different
    categories to make finding things a bit easier.


    (If you noticed that we said "most of the applications" above, you can find more
    apps by looking at X11''s application section towards the end of the appendix.)


    # C.1.1 Communications


    This section contains packages that help you communicate – either via fax, on-line
    chat, or simple terminal emulation.


    efax – (Version 0.8a, 205K) This is a program to send and receive faxes over class
    1 or class 2 modems. It has a nice interface to facilitate faxing.


    ircii – (Version 4.4, 1,223K) This is a popular Internet Relay Chat (IRC) client.
    It is a program used to connect to IRC servers around the globe so the user can
    "chat" with others


    ircii-help – (Version 4.4, 455K) This package contains the files and other documentation
    for the ircii client package.


    irszk – (Version 0.12.14, 340K) This collection of commands can be used to download
    and upload files using the Z, X, and Y protocols. Many terminal programs (like
    minicom) make use of these programs to transfer files


    minicom – (Version 1.8, 268K) Minicom is a communications program that resembles
    the MSDOS Telix somewhat. It has a dialing, color, full ANSI and VT100 emulation,
    (external) scripting language and more.


    # C.1.2 Databases


    This section contains packages that provide basic database support for Red Hat
    Linux.


    postgresql – (Version 6.3.2, 9,268K) PostgreSQL Data Base Management System (formerly
    known as Postgres, then as PostgreSQL9).


    PostgreSQL is an enhancement of the PostgreSQL management system, a next-generation
    DBMS research prototype. PostgreSQL retains the powerful data model and rich data
    types of POSTGRES, it replaces the PostQuery query language with an extended subset
    of SQL. PostgreSQL is free and the complete source is available.


    PostgreSQL development is being performed by a team of Internet developers who
    all subscribe to the PostgreSQL development mailing list. The current coordinator
    is Marc G. Fournier'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# Package List


    (scrappy@postgresql.org). This team is responsible for all current and future
    development of PostgreSQL.


    The authors of PostgreSQL 1.01 were Andrew Yu and Jolly Chen. Many others have
    contributed to the porting, testing, debugging and enhancement of the code. The
    original Postgres code, from PostgreSQL is derived, was the effort of many graduate
    students, undergraduate students, and staff programmers working under the direction
    of Professor Michael Stonebreaker at the University of California, Berkeley.


    The original name of the software at Berkeley was Postgres. When SQL functionality
    was added in 1995, its name was changed to Postgres95. The name was changed as
    of 1996 to PostgreSQL.


    PostgreSQL runs on Solaris, SunOS, HPUX, AIX, Linux, FreeBSD, and all flavours
    of Unix.


    # postgresql-clients – (Version 6.3.2, 942K) This package includes only the clients
    and client libraries needed to access PostgreSQL server. The server is included
    in the main package. If all you need to connect to another PostgreSQL server,
    this is the only package you need to install.


    In this package there are client libraries available for C, C++ and PERL, as well
    as several command-line utilities you can use to manage your databases on a remote
    PostgreSQL server.


    # postgresql-data– (Version 6.3.2, 87K) This packages includes an initial structure
    for PostgreSQL. For a quick startup on PostgreSQL, it is recommended to install
    this package with your PostgreSQL backend (although it is not required).


    If you choose not to install this package you will have to create the initial
    database using ''initdb command and possibly modify the postgresql startup script
    if you choose a directory other than /var/lib/pgsql for storing your databases.


    # 1.1.3 Editors


    In this section, we have an assortment of packages that provide basic (and in
    some cases not so) file editing capabilities.


    ed – (Version 0.2, 104K) This is the GNU line editor. It is an implementation
    of one of the first editors under *nix. Some programs rely on it, but you generally
    probably won''t*need.


    emacs – (Version 20.2, 10,602K) Emacs is the extensible, customizable, self-documenting
    real-time display editor. Emacs has code editing modes, a scripting language (elisp),
    and comes with many packages for doing mail, news, and more, all in your editor.


    This package includes the libraries necessary to run the emacs editor - the actual
    program can be found in either the emacs-nox or emacs-X11 packages, depending
    on whether you use X or not.'
  merge: -1
  img_proc: true
- pgno: 206
  md: '# C1 Applications


    emacs-X11 – (Version 20.2, 2,32K) This package contains an emacs binary built
    with support for X Windows. It will still work fine outside of X Windows (on the
    console, for instance) but supports the mouse and GUI elements when used inside
    X Windows.


    emacs-el – (Version 20.2, 14,718K) This package contains the emacs-lisp sources
    for many of the elisp programs included with the main emacs package. You do not
    need this package unless you want to modify these packages, or see some elisp
    examples.


    emacs-nox – (Version 20.2, 1,995K) This package contains an emacs binary without
    support for X Windows. While the emacs binary in the main emacs package will work
    fine outside of X Windows (on the console, for instance), this one has a smaller
    memory image.


    jed – (Version 0.98.4, 1,193K) Jed is a fast context editor based on slang screen
    library. It has special editing modes for C, C++, and other languages. It can
    emulate emacs, Wordstar, and other editors, and can be customized with slang macros,
    colors, keybindings, etc.


    jed-xed – (Version 0.98.4, 153K) Jed xed is the emacs editor as jed, just runs
    in its own X Window.


    joe – (Version 2.8, 283K) Joe is a friendly and easy to use editor. It has a nice
    interface and would be a good choice for novice needing a text editor. It uses
    the same WordStar keybindings which are also used by Borland''s development environment.


    vim – (Version 5.1, 3,780K) The Visual editor imProven is an updated and feature-added
    clone of the vi* editor that comes with almost all UNIX systems. It adds multiple
    windows, multi-level undo, block highlighting, and many other features to the
    standard vi program.


    vim-X11 – (Version 5.1, 451K) This package is a version of VIM with the X-Windows
    libraries linked in, allowing you to run VIM as an X-Windows application with
    a full GUI interface and mouse support. You just run ''gvim''.


    # C.1.4 Emulators


    In this section are packages that your Red Hat Linux system meant for other operating
    systems.


    dosemu – (Version 0.66.7, 3,269K) This package enables you to run a number of
    DOS programs under Linux. This package includes an image with DOS-C kernel (MS
    DOS 3.31 compatible) and FreeDos utilities. You should be able to start up the
    DOS emulator by logging in and typing ''dos'' at the prompt.


    xdosemu – (Version 0.66.7, 26K) This is a version of the DOS emulator that is
    designed to run in an X windows session. It provides VGA graphics support as well
    as mouse support.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# C.1.5 Engineering


    This section contains packages for those of you that are into engineering.


    spice - (Version 2g6, 431K) SPICE is a general-purpose circuit simulation program
    for nonlinear dc, transient, and linear ac analyses. Circuits may contain resistors,
    capacitors, inductors, mutual inductors, independent voltage and current sources,
    four types of dependent sources, transmission lines, and the four most common
    semiconductor devices: diodes, BJT''s, JFET''s, and MOSFET''s.


    units - (Version 1.0, 24K) The units program converts expression in various scales
    to their equivalents in other scales. The units program can only handle multiplicative
    changes.


    # C.1.6 Graphics


    This section contains packages that help you work with graphics-related material.


    ghostcript - (Version 3.33, 1,867K) Ghostscript is a PostScript interpreter. It
    can render both PostScript and PDF compliant files to devices which include an
    X window, many printer formats (including support for color printers), and popular
    graphics formats.


    ghostscript-fonts - (Version 4.0, 2,188K) These fonts can be used by the Ghostscript
    interpreter during text rendering.

    It is most useful for making a color transparent for web sites.


    giftrans - (Version 1.112.2, 20K) This program can convert and manipulate GIF
    images from the command line. It is most useful for making a color transparent
    for web sites.


    libgr-progs - (Version 2.0.13, 1,397K) This package includes various utility programs
    for manipulating JPEG files for use by libgr.


    xfig - (Version 3.2, 685K) This program gives you all the features you need to
    create basic intermediate-level vector graphics, including bezier curves, lines,
    and more.


    zgv - (Version 3.0, 172K) Zgv is a picture viewer capable of displaying GIF files
    as defined by CompuServe, with the exceptions listed in the RESTRICTION section.
    It is also capable of displaying JPEG/JFIF files using the Independant JPEG Group''s
    JPEG software, PBM/PGM/PPM files used by pmplus and netpbm, Microsoft Windows
    and OS/2 BMP files, Targa (TGA) files, and the new PNG format.


    # C.1.7 Mail


    This section contains several of the more popular e-mail-related programs.'
