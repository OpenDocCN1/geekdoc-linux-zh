- pgno: 120
  md: '# 7


    # # Finding Documentation


    Red Hat includes thousands of pages of online documentation to help you learn
    how use the system. The main pages, info documents, and plain text files included
    provide information on almost every aspect of Linux. If you''ve installed it,
    Red Hat Linux also includes documentation produced by the Linux Documentation
    Project.


    #  7.1 On Line Help


    When you are looking for general help on commands and error messages, the best
    place to start is right on your system. There are several different sources of
    information at your fingertips:


    +   - **Man Pages** - Authoritative reference material for commands, file formats,
    and system calls.

    - **Package Documentation** - Many packages include additional documentation;
    RPM can help you find it.

    - **HOWTOs and FAQs** - Helpful information from the Linux Documentation Project.

    - The `locate Command` - A command that can help bridge the gap between a command
    and its documentation.

    - info **Pages** - Hypertext documentation without the Web.'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Finding Documentation


    Let''s take a look at each information source.


    # 7.1.1 Man Pages


    Almost every command on your system has an associated “man” page. This is documentation
    that you can get to instantly should you have questions or problems. For example,
    if you were having trouble with the 1s command, you could use man to get more
    information by entering man 1s. This will bring up the man page for 1s.


    The man page is viewed through the less program (which makes it easy to page forward
    and backward screen, so all of the options to less work while in a man page. The
    more important keystrokes for less are:


    +   * quit

    * Enter to page down line by line

    * Space to page down page by page

    * b to page back up by one page

    * i followed by a string and Enter to search for a string

    * n to find the next occurrence of the previous search


    There are times when it''s a lot more convenient to read something from a sheet
    of paper. Providing you have a working printer, you can print man pages as well.
    If you don''t have Postscript printing capability and just want to print ASCII,
    you can print man pages with:


    ```

    man COMMAND | lpr

    ```


    If you have a postscript printer, you will probably want to print with:


    ```

    man -t COMMAND | lpr

    ```


    In both of those commands substitute “COMMAND” for the command you are trying
    to get help for.


    Sometimes you''ll find that certain system components have more than one man page.
    Here is a table showing the sections that are used to divide man pages:'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# # 7.1 On Help


    | Section | Contents |

    | 1 | user commands |

    | 8 | system commands |

    | 2 | system calls |

    | 3 | library calls |

    | 4 | devices |

    | 5 | file formats |

    | 6 | games |

    | 7 | miscellaneous |

    | 9 | kernel internals |

    | n | Tcl/Tk commands |


    This is also the order in which the sections are searched. This can be important;
    here''s an example:


    Let''s say that you want to see the page for the swapon system call. So, you type
    swapapon. You will actually get the man page for swapon (8), which is actually
    the command used to control swapping. Using the chart above, you can see that
    what you want is "system call" and is located in section 2. You can then type
    man -2 swapapon. All of this is because man searches the man directories in the
    order shown above, which means the swapapon(8) man page would be before the swapapon(2)
    man page.


    You can also search the man pages for strings. You do this using man -k string
    to search.for. This won''t work, however, unless the makewhatis database has been
    created. Under Red Hat Linux, this is done by a cron job overnight. If you don''t
    leave your system running overnight the database won''t get created. If that is
    the case, run the following command would return:


    ```

    /etc/cron.weekly/makewhatis.cron

    ```


    Once you''ve done (note that it might take a while), you could enter man -k swapapon.
    That command would return:


    ```

    # man -k swapapon

    swapon, swapoff (2) - start/stop swapping to file/device

    swapon, swapoff (8) - enable/disable devices and files for \

    paging and swapping

    ```


    So you can see that there are pages in section 2 and 8 referring to swapon (and
    swapoff in this case).


    # ## How to Read a Man Page


    Man pages provide a great deal of information in very little space. Because of
    this, they can be difficult to read. Here''s a quick overview of the major sections
    in most man pages:'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 100


    # Finding Documentation


    +   - Name - The name of the program or programs documented in the man page. There
    may be more than one name, if the programs are closely related.


    +   - Synopsis - An overview of the program''s command syntax, showing all options
    and arguments.


    +   - Description - A short description of the program''s function.


    +   - Options - A list of all options, with a short description of each (often
    combined with the previous section).


    +   - See Also - If present, lists the names of other programs that are related
    in some way to this program.


    +   - Files - If present, contains a list of files that are used and/or modified
    by the program.


    +   - History - If present, indicates important milestones in the program''s development.


    +   - Authors - The people who wrote the program.


    If you are new to Linux, don''t expect to be able to use man pages as tutorials;
    they are meant concise reference material. Trying to learn about Linux using the
    man pages is similar to trying to learn how to speak English from reading a dictionary.
    There are other sources of information that may be more useful to those people
    starting out with Linux; let''s continue our search for documentation...


    # 7.1.2 Package Documentation


    Many packages have README files and other documentation as part of the source
    package. Packages built for Red Hat Linux define a standard place to install these
    documents so that you don''t have to search through the sources to find them.
    Every package containing documentation (other than man pages, and files that need
    to be in specific locations) places their documentation in a subdirectory of /usr/doc.


    The name of the subdirectory depends on the package name and version number. For
    example, the tin package might be at version 1.22. Therefore, the path to its
    documentation would be /usr/doc/tin-1.22.


    For the most part, the documentation in /usr/doc are ASCII. You can view them
    with filename less filename.


    Having this special documentation area can be handy, but what if you''re looking
    for documentation on a specific command (or file), and you don''t know what package
    command comes from? No problem! Take, for example, the file /usr/bin/rt. You''re
    not sure what package it''s part of, but you''d like to learn a bit more about
    it. Simply enter:


    ```

    rpm -qdf /usr/bin/rt

    ```'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 7.1 On Line Help


    This command will return a listing of all the documentation (including man pages)
    from the package containing the file /usr/bin/rtin. RPM is capable of a lot more
    than this simple example. For more information on RPM, turn to Chapter 8 on page
    105.


    Of course, maybe this kind of information is not exactly what you''re looking
    for. Maybe you be more interested in task-oriented documentation. If so, read
    on...


    # 7.1.3 HOWTOs and FAQs


    If you elected to install it, most of the contents of the Linux Documentation
    Project (LDP) are available in /usr/doc on your system.


    The directory /usr/doc/HOWTO contains the ASCII versions of all the available
    HOWTOs at the time your Red Hat CD-ROM was mastered. They are compressed with
    gzip to save space, so you need to decompress them before reading. One way of
    reading compressed HOWTOs without cluttering your disk with uncompressed versions
    is to zless


    ```

    zless 3Dfx-HOWTO.gz

    ```


    The zless command uses some keystrokes as less, so you can easily move back and
    forth through a HOWTO.


    /usr/doc/HOWTO/mini contains the ASCII versions of all the available mini-HOWTOs.
    They are not compressed and can be viewed with more or less.

    /usr/doc/HOWTO/other-formats/html contains the HTML versions of all the HOWTOs
    and the RedHat Installation and Getting Started guide. To view these here, just
    use the web browser of your choice.


    /usr/doc/FAQ contains ASCII versions (and some HTML versions) of some popular
    FAQs, including the RedHat-FAQ. They can be viewed using more or less, or (in
    the case of HTML files) with the web browser of your choice.


    # 7.1.4 The "locate" Command


    When you don''t know the full name of a command or file, but to find it, you can
    usually find it with locate. locate uses a database to find all files on your
    system. Normally this database gets built from a cron job every night. This won''t
    happen, however, if your machine isn''t booted into Linux all the time. So, if
    that is the case, you may occasionally want to run the following command:


    ```

    /etc/cron.daily/updatedb.cron

    ```


    You will need to be root on your system when doing that. That will allow locate
    to work properly.'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'So, if you know need to find all the "finger" files, you could run:


    locate finger


    It should return something like:


