    # E.6.13 I have NT and would like to install Linux, but I have heard there are
    problems with the booting OS''s. How can I avoid this?


    The best instructions on dual-booting NT and Linux are to be found in howto, Linux+NT-Loader.
    The latest version can be found at the HTTP site:http://sunite.unc.edu/LDP/HOWTO/mini/Linux+NT-Loader
    and a possibly earlier one can be found on the cdrom in /doc/HOWTO/mini/Linux/Linux+NT-Loader


    # E.6.14 I can not install Linux below the 1023 cylinder in my system-tem, what
    can I do?


    You will need to have the kernel below this limit, and use a different bootloader
    like LILO. The BIOS may not be able to reach it for one of the following reasons:


    +   - The kernel is above the 1023 cylinder of the hard drive.

    - The kernel is on a drive the BIOS can''t boot to (not on Primary IDE or SCSI)

    - Other esoteric kernel/BIOS problems.'
