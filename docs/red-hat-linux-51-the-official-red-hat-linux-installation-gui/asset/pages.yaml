- pgno: 200
  md: '# Making Installation Diskettes


    It is sometimes necessary to create a diskette from an image file (for example,
    you might need to use updated diskette images obtained from the Red Hat Linux
    Errata).


    As the name implies, an image file is a file that contains an exact copy (or image)
    of a diskette''s contents. Since a diskette contains filesystem information in
    addition to the data contained in files, the image file is not usable until it
    has been written to a diskette.


    To start, you''ll need a blank, formatted, high-density (1.44 MB), 3.5-inch diskette.
    You''ll need access to a computer with a 3.5-inch diskette drive, and capable
    of running a DOS program, or the dd utility program found on most Linux-like operating
    systems.


    The image files are found in the following directories on your Red Hat Linux CD:


    +   - images - Contains the boot and supplemental images for Red Hat Linux/Intel.


    Once you''ve selected the proper image, it''s time to transfer the image file
    onto a diskette. As mentioned previously, this can be done on a DOS-capable system,
    or on a system running a Linux-like operating system.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# B.1 Making a Diskette Under MS-DOS


    To make a diskette under MS-DOS, use the rewrite utility included in the Red Hat
    Linux CD in the dosutils directory. First, label a blank, formatted 3.5-inch diskette
    appropriately (eg. "Boot Diskette", "Supplemental Diskette", etc). Insert it into
    the diskette drive. Then, use the following commands (assuming your CD is drive
    d):


    ```

    C:\> d:

    D:\> cd dosutils

    D:\> dosutils> rewrite

    Enter disk image source file name: ..images/boot.img

    Enter target diskette drive: a:

    Please insert a formatted diskette into drive A: and

    press --ENTER-- Enter

    D:\dosutils

    ```


    rewrite first asks you for the filename of a diskette image; enter the directory
    and name of the image you wish to write (for example, ..images/boot.img). Then
    rewrite asks for a diskette drive to write the image to; enter a:. Finally, rewrite
    asks for confirmation that a formatted diskette is in the drive you''ve selected.
    Enter copies the image file onto the diskette. If you need to make another diskette,
    label diskette and run rewrite again, specifying the appropriate image file.


    # B.2 Making a Diskette Under a Linux-like O/S


    To make a diskette under Linux (or any Linux-like operating system), you must
    have permission to write to the device representing a 3.5-inch diskette drive
    (known as /dev/fd0 under Linux). First, label a blank, formatted diskette appropriately
    (eg. "Boot Diskette", "Supplemental Diskette", etc). Insert it into the diskette
    drive (but don''t mount a command). After mounting the Red Hat Linux CD, change
    directory to the directory containing the desired image file, and use the following
    command (changing the name of the image file and diskette device as appropriate):


    ```

    # dd if=boot.img of=/dev/fd0 bs=1440k

    ```


    If you need to make another diskette, label another diskette, and run dd again,
    specifying the appropriate image file.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# C


