    # 6.6 World Wide Web


    The World Wide Web is one of the hottest aspects of the Internet today. Red Hat
    Linux lets you get in on the action in two ways – as a web browser, and as a web
    server. Let''s look at both.


    # 6.6.1 World Wide Web Browsers


    A variety of web browsers are available for Linux, including freely distributable
    browsers such as arena, lynx, and grail. The most popular commercial browsers
    are those from Netscape Communications Corporation. And now they''re available
    with Red Hat Linux 5.1! If you select the netscape-communicator or netscape-navigator
    packages, you''re ready to surf. Enjoy!


    # 6.6.2 World Wide Web Server


    If you install the Apache web server (from the apache package), then your Web
    service is already up and running! Just point your web browser at http://localhost.


    The default page shown is ~/home/httpd/html/index.html. You can edit this file
    (or com-'
