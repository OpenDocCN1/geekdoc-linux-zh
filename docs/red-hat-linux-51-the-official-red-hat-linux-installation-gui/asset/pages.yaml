- pgno: 55
  md: '# Installing Without Using a Boot Diskette Red Hat Linux/Intel CD-ROM can also
    be booted by newer computers that support bootable CD-ROMs. Not all computers
    support this feature, so if you can''t boot from CD-ROM, there is one other way
    to start the installation without using a boot diskette. The following method
    is specific to Intel-based computers only.


    If you have MS-DOS installed on your computer, you can boot the installation system
    directly from the CD without using any diskettes.


    To do this, use the following commands (assuming your CD is drive d):


    ```

    C:\ d:

    D:\> cd \dosutils

    D:\> dosutils\autoboot.bat

    ```


    Note that this method will not work if run in a DOS window - the autoboot.bat
    file must be executed with DOS as the only operating system. In other words, Windows
    cannot be used.


    If your computer can''t boot directly from CD-ROM, and you can''t use a DOS-based
    autoboot, you''ll have to use a boot diskette to get things started.


    # 3.3 Beginning the Installation


    After booting, the installation program begins by displaying a welcome message.
    Press Enter to begin the installation. If you wish to abort the installation process
    at this time, simply eject the boot diskette now and reboot your machine.


    # 3.3.1 Choosing a Language


    After the welcome dialog, the installation program asks you to select the language
    to be used during the installation process (see Figure 3.4 on the facing page).
    Using the up and down keys, select the appropriate language. Note the scroll bar
    to the right of the languages - indicates that there are more entries than can
    be displayed at one time. You will see scroll bars like this throughout the installation
    program.


    > ¹“Redneck” language entry represents a dialect of American English spoken by
    Red Hat Software''s Donnie Barnes, and was used as a test case during the addition
    of internationalization to the installation program. It is included solely for
    entertainment value (and to illustrate how difficult it is actually talking to
    Donnie).'
  merge: -1
