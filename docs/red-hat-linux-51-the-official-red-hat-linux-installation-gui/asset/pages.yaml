    # C.4 Development


    This section contains packages of interest to programmers. Red Hat Linux comes
    with a powerful and rich set of tools for the programmer, so there are several
    different subsections


    # C.4.1 Building


    This section contains packages that help programmers easily build programs.


    autoconf – (Version 2.12, 524K) GNU’s “autoconf” is a tool for source and Makefile
    configuration. It assists the programmer in creating portable and configurable
    packages, by allowing the person building the package to specify various configuration
    options.


    “autoconf” is not required for the end user - it is needed only to generate the
    configuration scripts.


    automake – (Version 1.3, 777K) Automake is an experimental Makefile generator.
    It was inspired by the 4.4BSD make and include files, but aims to be portable
    and to conform to the GNU standards for Makefile variables and targets.


    libtool – (Version 1.0h, 379K) GNU libtool is a set of shell scripts to automatically
    configure UNIX architectures to build shared libraries in generic fashion.'
