    * Password: Password (if required) to use the printer (typically blank). Someone
    might be able to tell you if you do not already know it.


    Please Note: If you need to use a username and password for an SMB (LAN Manager)
    print queue, they are stored unencrypted in a local script and must be passed
    on the command line to the smclient program. Thus, it is possible for another
    person to learn the username and password. It is therefore recommended that the
    username and password for the printer not to be the same as for a user account
    on the local Red Hat Linux system, so that the only possible security compromise
