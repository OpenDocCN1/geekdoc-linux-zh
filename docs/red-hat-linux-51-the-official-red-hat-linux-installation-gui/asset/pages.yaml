  md: '# 11.9 The Boot Process, Init, and Shutdown


    In this command, porky is the hostname of the NFS fileserver, /mnt/export is the
    filesystem that porky is exporting, and /mnt/local is a directory on my local
    machine where we want to mount the filesystem. After the mount command runs (and
    if we have the proper permissions from porky) we can ls /mnt/local and get a listing
    of the files in /mnt/export on porky.


    # 11.8.2 Exporting NFS Filesystems


    The file that controls filesystems you wish to export is /etc/exports. Its format
    is:


    ```

    directory          hostname(options)

    ```


    the (options) are optional. For example:


    ```

    /mnt/export          speedy.redhat.com

    ```


    would allow speedy.redhat.com to mount /mnt/export, but:


    ```

    /mnt/export          speedy.redhat.com(ro)

    ```


    would just allow speedy to mount /mnt/export read-only.


    Each time you change /etc/exports, you need to tell the NFS daemons to examine
    it for new information. One simple way to accomplish this is to stop and start
    the daemons:


    ```

    /etc/rc.d/init.d/nfs stop

    /etc/rc.d/init.d/nfs start

    ```


    The following will also work:


    ```

    killall -HUP rpc.nfsd rpc.mount

    ```


    See the following man pages for more details: nfsd(8), mount(8), and exports(5).
    Another good reference is Managing NFS and NIS Services by Hal Stern, published
    by O’Reilly''s Associates.


