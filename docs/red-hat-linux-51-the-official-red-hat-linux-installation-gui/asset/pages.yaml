  md: '# 90


    # What Do I Do Now?


    +   - Start X automatically whenever the system boots.


    Let''s start with the manual procedure.


    # Starting X Manually


    Red Hat Linux, as installed, will not start X automatically for you. Therefore,
    you''ll see the character-cell login prompt you saw when you first booted your
    Red Hat Linux system.


    In order to get X started, you''ll first need to log in. Do so (using your non-root
    account), and then enter the startx command. The screen should go blank, and (after
    a short delay) you should see a graphical desktop with one or more windows. The
    appearance of the desktop you''ll see, depending on the packages you installed
    and other variables.


    When you''re done, and you''d like to leave X, you can click on any part of the
    desktop (in other words, part of the screen without any windows) using your mouse''s
    primary button. Select the "Exit Fwm", "Quit," or "logout" menu entry, and X will
    shut down, leaving you at your original character-cell shell prompt. You can then
    logout as usual.


    # Starting X Automatically


    Please Note: Make sure you verify that your X configuration works properly before
    making X start automatically. Failure to do so can make it difficult to log into
    your Red Hat Linux system. If you haven''t done so already, review the previous
    section before continuing.


    It is possible to configure your Red Hat Linux system such that X will start automatically
    whenever the system is booted. When configured in this manner, xdm will run, which
    will present a graphically-oriented login screen. After logging in, you will have
    a regular X session running, just as if you had issued a startx command manually.
    Pretty neat, eh?


    Here''s a quick overview of how it''s done:


    +   - Test xdm using telinit.


    +   - Edit /etc/inittab.


    +   - Reboot.


    Let''s look at each step in more detail.


    xdm using telinit - The telinit command is used to change your Red Hat Linux system''s
    "run level". It is the run level that controls various aspects of system operation,
    including whether xdm should be started or not. Newly-installed Red Hat Linux
    systems use run level 3 as their default; this results in the character-cell login
    prompt you''ve seen. Since xdm is started at run level 5, you''ll need to issue
    the command:'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 6.3 The X Window System


    ```

    /sbin/telentit 5

    ```


    **Please Note:** You will need to be logged in as in order to use telentit. Also
    note that you should **not** be running anything on your Red Hat Linux system
    when you change run levels, as any running programs may be killed by the run level
    change.


    If everything is configured properly, after a short delay you will see an xdm
    login screen. Log in, verifying that a X desktop appears. Then log out to make
    sure that xdm reappears. If it does, your system is configured properly to automatically
    start X. If there are problems, you can go back to run level using telentit (ie,
    `/sbin/telentit 3`), or rebooting.


    **Editing**/etc/inittab - The file /etc/inittab is used to, among other things,
    determine your system''s default run level. We need to change the default run
    level from 3 to 5; therefore, we''ll need to edit `/etc/inittab`. Using the text
    editor of your choice, change this line in `/etc/inittab`.


    ```

    id:3:initdefault:

    ```


    When you''re done, it should look like this:


    ```

    id:5:initdefault:

    ```


    **Please Note:** Make sure you change *only* the number 3 to be 5! Do not change
    anything else, otherwise your Red Hat Linux system may not boot at all! When you''ve
    made the change, exit the editor, and use this command to review your handi


    ```

    less /etc/inittab

    ```


    (Press `Space` key to page through the file; `Q` will exit.) If everything looks
    OK, it''s time to reboot.


    **Rebooting** – Refer to Section 6.2.4 on page 86 to properly reboot your Red
    Hat Linux system. Congratulations! You''re now graphical (well, your system is,
    at least)...


    # Changing Your Desktop


    Thanks to `wmconfig`, it''s easy to change the appearance of your desktop. Simply
    select the **Preferences** menu entry, and (under **WM Style**) you''ll be able
    to pick from several different desktop (also known as window manager) styles.
    If you want to learn more about the nuts and bolts behind the scenes, read the
    `wmconfig` man page for more information.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# What Do I Do Now?


    # Handy X-Based Tools


    There are several tools that can make life easier for the new Red Hat Linux user.
    They perform tasks that require root access, or can only be done by memorizing
    arcane commands. They require X to run, so you''ll need to get that set up first.
    These tools are:


    +   * User Information Tool - Makes it easy to update your "gecos", or basic account
    information. Run /usr/bin/userinfo to start it.

    * User Password Tool - Changing passwords is simple with this tool. It''s started
    by running /usr/bin/userpassword

    * Filesystem Tool - Makes mounting and unmounting filesystems simple. Every-user
    filesystem must have the user option present in /etc/fstab (see the mount page
    for more information on the user option). Run /usr/bin/umount to start.

    * Network Device Tool - Starting and stopping network interfaces becomes a point-and-click
    operation with this tool. Run /usr/bin/usernet to start this. Requires every user-controllable
    interface to be user-controllable.


    # 6.4 Configuring Your Red Hat Linux System For Sound


    By default, the only sound you''ll hear out of your newly-installed Red Hat Linux
    system is the ordinary, boring, default deep. If your computer system has sound
    hardware, chances are you make it work under Red Hat Linux. In some cases (particularly
    with non-Intel systems) successfully getting sound support to work requires a
    kernel rebuild. However, most of the time it''s possible to use the modular sound
    drivers.


    # 6.4.1 Modular Sound Drivers


    Modular support is only supported for Intel-compatible systems.


    In Red Hat Linux 5.1, the standard/Free sound drivers have been modified to completely
    modular. This allows for such things as loading and unloading of the various sound
    drivers without recompiling the kernel tree or rebooting. The work was performed
    by Alan Cox and is sponsored by Red Hat Software, Inc.


    For additional information, please consult the README files in the rhsound directory
    (/usr/doc/rhsound*). The latest information can always be found at ftp://ftp.redhat.com/pub/sound/


    If you have any issues concerning the modular sound drivers, please send mail
    to sound-bugs@redhat.com. There is also a mailing list associated with the modular
    sound drivers'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 6.4 Configuring Your Red Hat Linux System For Sound


    (sound-list@redhat.com). To subscribe, send mail to sound-list-request@redhat.com
    with "subscribe" as the subject line.


    # Supported Sound Cards


    At present, only the following sound cards are recognized by the modular sound
    drivers:


    +   - Sound Blaster 1.0

    - Sound Blaster 2.0

    - Sound Blaster Pro

    - Sound Blaster 16

    - Sound Blaster 16 PnP

    - Sound Blaster AWE32/AWE64 (In SB-16 mode only)


    # 6.4.2 Sound Card Configuration Tool


    Also included in Red Hat Linux 5.1 is sndconfig, a screen-oriented utility that
    can properly configure modular sound card drivers.


    There are a few things that you should know about sndconfig:


    **Plug and Play Aware** - sndconfig is able to detect and configure Plug and Play
    sound cards as the Sound Blaster 16 PnP. Please note, however, the present version
    of sndconfig creates a new version of the file /etc/isapnp.conf with only the
    sound card''s settings uncommented. Therefore, if you have other Plug and Play
    devices on your system, you must do one of two things:


    +   - You can manually add your sound card''s PnP information to your existing
    /etc/isapnp.conf, and run sndconfig using the --nprobe option.

    - You can run sndconfig without the --nprobe option, and uncomment the configuration
    information for your other PnP cards in the /etc/isapnp.conf file created by sndconfig.


    In any case, sndconfig saves your original /etc/isapnp.conf file as /etc/isapnp.conf.bak.


    *Modified /etc/conf.modules* - sndconfig modifies the module configuration file
    /etc/conf.modules by adding information about the module options required for
    your sound card. Note that sndconfig saves your original /etc/conf.modules file
    as /etc/conf.modules.bak.'
  merge: -1
  img_proc: true
