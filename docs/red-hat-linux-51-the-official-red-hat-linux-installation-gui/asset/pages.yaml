    adapter, initial ramdisk is used. Ramdisk is loaded by the operating system loader
    (as lilo) and is available to the kernel as soon as it is loaded. That image is
    responsible for loading the proper SCSI adapter and allowing the kernel to mount
    the root filesystem. This program creates such a ramdisk image using information
    from `/etc/conf.modules`.


