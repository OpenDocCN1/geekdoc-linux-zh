- pgno: 284
  md: '# E.8.9 I have an AGP graphics card. Is it supported?


    AGP cards were not supported in XFree86 before version 3.3.2. If you have 3.3.2
    installed on your system, Xconfigurator show which AGP cards are supported. Note
    that Red Hat Linux 5.1 and later versions have XFree86 version 3.3.2 (or better)
    already.


    If you do not already have 3.3.2, you may want to consider upgrading to this release.
    Please see their web page at /urlhttp://www.xfree86.org/ for more details.


    # E.8.10 My computer has NeoMagic graphics chipset, how can I get X to work?


    The NeoMagic cards are currently not supported by Red Hat Linux''s X servers.
    XFree86 can''t support them since NeoMagic requires a non-disclosure agreement
    before they will release programming information and this precludes any source
    code.


    Xi Graphics'' Accelerated X has support for the NeoMagic chips in their laptop
    specific X server. See /urlhttp://www.xig.com/ for more information on their server.


    # E.8.11 I upgraded from 4.1 (earlier) and now when I use startx, the machine
    seems to hang at a grey screen.


    The problem is that releases prior to 4.2 installed (.Clients) in every users
    home directory, which calls:


    ```

    fvwm95-2 -cmd ''FvwmM4 -debug /etc/X11/TheNextLevel/...

    ```


    as their window manager, which doesn''t exist in 5.0. The proper workaround for
    this problem is to:


    ```

    rm -f ~/.Clients

    ```


    A more drastic workaround available to the root user:


    ```

    rm -f /home/*/.Clients

    ```'
