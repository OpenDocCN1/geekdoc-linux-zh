- pgno: 216
  md: '# C.4 Development


    make - (Version 3.76.1, 247K) The program is used to coordinate the compilation
    and linking of sources into a program, recompiling only what is necessary, saving
    a developer lot of time. In fact, make can do a lot more - read the info docs.


    pmake - (Version 1.0, 126K) The program is used to coordinate the compilation
    and linking of a set of sources into a program, recompiling only what is necessary,
    saving a developer lot of time. In fact, make can do a lot more - read the info
    docs.


    Pmake is a particular version of make which supports some additional syntax not
    in the standard make program. Some berkeley programs have Makefiles written for
    pmake.


    # C.4.2 Debuggers


    This section contains a number of packages that make it easier to find bugs in
    a program.


    ElectricFence - (Version 2.0.5, 44K) Electric Fence is a library that can be used
    for C programming and debugging. You link it in compile time and it will warn
    you of possible problems such as free memory that doesn''t exist, etc.


    gdb - (Version 4.17, 1236K) This is a full featured, command driven debugger.
    It allows you to trace the execution of programs and its internal state at any
    time. It works for C and C++ compiled with the GNU compiler gcc.


    strace - (Version 3.1, 113K) Strace prints a record of each system call another
    program makes, including all of the arguments passed to it and the system call''s
    return value.


    xxdb - (Version 1.12, 95) xxdb is a graphical interface to GNU''s debugger. It
    has the ability to display source files as they are executed, set breakpoints,
    and singlestep through over commands - all with an easy-to-use graphical Windows
    interface.


    # C.4.3 Languages


    This section lists the packages containing various programming languages.


    basic - (Version 1.20, 53K) This is a BASIC language interpreter. You can use
    it to run programs written in BASIC. For those who may not know, BASIC is an archaic
    language used to learn early fundamentals of programming, and is not very good
    for that, :-


    bin86 - (Version 0.4, 70K) This package provides an assembler and linker for real
    mode 8086 instructions. Programs that run in real mode, including LILO and the
    kernel''s bootstrap code, need to have this package installed to be built from
    the sources.


    ctags - (Version 2.0.3, 77K) A better tags which generates tags for all possible
    tag types: macro definitions, enumerated values (inside enum...), function and
    method definitions, enum/struct/union tags, external prototypes (optional), typedefs,
    and variable declarations. It is far less easily fooled by code containing #if
    preprocessor conditional constructs,'
