    # E.6.7 I am trying to upgrade my earlier Red Hat system to 5.x, but it complains
    that it can''t find a valid RPM base data. What do I need to do?


    The problem is that very few early versions of rpm would write the database in
    a way that seems corrupted to later versions. Rebuilding the database fixes install
    the problems. We will need to upgrade rpm on your system to the one on the installation
    cdrom, and rebuild the databases.


    First thing to do is mount the 5.0 CD on the system.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# E.6 Installation


    mount /mnt/cdrom


    After doing this upgrade ''rpm'' off the CD like so:


    ```

    cd /mnt/cdrom/RedHat/RPMS

    rpm -Uvh --nodeps --force rpm-*

    ```


    When the new RPM is installed, rebuild the database.


    ```

    rpm --rebuilddb

    ```


    This will now put the database in a format that the installation RPM can use (since
    they are the same.)


    # E.6.8 I have an Adaptec 2920. During the install I do not see a choice for it,
    why and what do I do? or I have a Future Domain TMC-3260, but when I specify options
    for it to be probed, it can''t find it during the install.


    The Adaptec 2920 does not have an Adaptec chip set, but actually uses the Future
    Domain TMC-3260. If the card is not found with an auto-probe, you will need to
    specify options for it. When the installation menu asks you about SCSI, choose
    "options" and enter the following:


    ```

    setup_called=1 port_base=<io base> interrupt_level=<irq>

    ```


    An example of this would be


    ```

    setup_called=1 port_base=0xd000 interrupt_level=9

    ```


    In case you do not have the port.base or the interrupt.level of the card, you
    can do the following. If you have reached the 2nd stage of the install (meaning
    the install has found cdrom), you can ALT-F2 to the root console, and cat /proc/pci
    to see Linux found on the PCI bus. Otherwise, you will need to boot into rescue
    mode, and say no to having any scsi devices in the system. Then at the # root
    prompt, cat /proc/pci and write down the values for the card. Then restart the
    machine with a CONTROL-ALT-DELETE and fill in the values for the card during the
    install.


    If the above options do not work, your card may have a newer BIOS that we can
    probe correctly. We are working on the problem, but do not have a time for when
    it will be resolved.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# E.6.9 I have an Adaptec SCSI card with the ai7xxx chipset (2940, 2840, 2740,
    390, etc). It is pretty common, so why is it not fully supported by Red Hat Linux?


    Unfortunately, Adaptec has not actively supported the development of a driver
    for the AHA2940 SCSI adapter and AIC7xxx SCSI chipset.


    Specifically, Adaptec continues to release new BIOSes and chip set revisions without
    making the specifications available to the authors of the Linux driver. Consequently,
    some AHA2940 adapters work with Linux, because they have compatible chip sets,
    while other AHA2940 have different chip sets that the developers haven''t seen
    and do not work with Linux. The authors of the Linux drivers are able to make
    the driver work with all the different AHA2940 BIOSes, we cannot put this hardware
    on the supported list, but instead provide a driver in "AS IS form. If it works,
    great, and if it doesn''t, you can try the following:


    +   1. The AHA-2940 is, like Adaptec cards, extremely sensitive to termination
    issues (having active termination on BOTH ends of the bus can help a lot)

    2. SCSI Hard drives have on-drive termination (as a general rule) to supply .active,
    termination whereas SCSI CD-ROM drives and SCSI tape drives are configured for
    on-drive termination (as a general rule) to supply only .passive, termination

    3. If a SCSI-based system doesn''t work when you have sync negotiation and disconnect
    for your SCSI devices, but DOES, work OK when you disable negotiation and/or disconnect
    for your SCSI peripherals, then respect cables and/or bad (or less than adequate),
    termination

    4. HP C3725 SCSI drives do not work at all with AHA-2940AU and Redhat 4.2, perhaps
    due to a problem with the drive, but just as likely to some problem/problems with
    the AHA-2940 driver in the Linux 2.0.30 kernel.

    5. For some large drives you have to disable the default option in the Adaptec-SCSI
    BIOS: "Extended BIOS translation for DOS drives > 1 GByte". This option causes
    the BIOS to use a translation of 255 heads, 66 sectors per track. LILO does not
    like this. After disabling, everything works OK (windows95 installation, Linux
    and LILO installation, dual-boot).

    6. Make sure on a SCSI chain that the drive you are installing to is SCSI ID 0
    (or 1 if you have no IDE drives in the system.)

    7. Others have found that using the conservative/slow settings "no tagged queuing",
    "5MB/s" etc, fixes problems.


    # E.6.10 During the install, I get a fatal signal 11 or signal 7. What does this
    mean and what can I do?


    11''s and signal 7''s are errors indicating a hardware error in memory or on the
    bus. They can be due to problems in executables or with the hardware of the system.
    The Linux kernel'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# E.6 Installation


    uses a lot more capabilities of the CPU, Cache, and memory, and is more prone
    to faulting on marginal hardware.


    The first thing to do is to check if you have the latest installation and supplemental
    floppies from Red Hat. Check the errata for updates and the FTP site to see if
    newer versions are available. If the latest images still fail, it may be due to
    hardware. Common suspects are memory or CPU-cache. Try turning off the CPU-cache
    in the BIOS and see if the problem goes away. Also try swapping memory around
    in the motherboard slots to see if it either slot or memory related.


    More information is available at http://www.bitweard.nl/sig11.


    # E.6.11 During the install, I am having problems with Linux working with my Ultra
    DMA drive and motherboard controller, what can I do?


    Ultra DMA support in the Linux kernel is rather limited in kernels before 2.0.34
    for some motherboards works well, and not at all. When interfacing Ultra DMA drives
    with these motherboards, you may need to set the BIOS to PIO mode 2 versus PIO
    mode 4 transfers.


    # E.6.12 I have a PCI DMA controller in my machine. Can I install Linux on my
    machine?


    Due to problems, most Ultra DMA controllers that are not built onto the motherboard
    will not work with the stable Linux kernel series 2.xx. Due to these problems,
    these cards can be a pain to install Linux Onto. The following mini-HOWTO describes
    more information on these controllers and possible ways to install Linux on.


    http://www.redhat.com/linux-info/ldp/HOWTO/mini/Ultra-DMA.html by Brion Vibber,
    brion@poobox.com.


    The important parts are included below, but we recommend reading the rest of the
    HOWTO for why this works (and what to do if it doesn''t work).


    Under Red Hat 5.0, use the installation floppy, and at the boot prompt type rescue.
    It''ll load some stuff, prompt you for the supplemental disk, ask you your monitor
    and keyboard, and finally put you into a command prompt. Then, do /proc/pci, write
    down the numbers as above, and reboot from the boot disk. This type linux ide2=(this
    is where you put the numbers like shown above) ide3=(more numbers). It should
    now be able to install onto your hard disk without difficulty.


    Thanks Gary Oxman for the information on getting the interface settings:


    +   - we can access the console with the installation disk, we can also use "cat
    /proc/pci" to display the Promise interface'
