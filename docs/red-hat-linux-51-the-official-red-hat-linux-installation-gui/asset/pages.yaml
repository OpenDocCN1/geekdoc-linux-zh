  md: '# 11


    # # System Administration


    This chapter is an overview of the Red Hat Linux system. It will illustrate things
    that you may not know about the system and things that are somewhat different
    from other UNIX systems.


    # ## 11.1 Users, Groups and User-Private Groups


    Managing users and groups has traditionally been tedious. Red Hat Linux has a
    few tools and conventions that make user and groups easier to manage, and more
    useful.


    The easiest way to manage users and groups is through the Users and Groups module
    of the control-panel (see section 9 for details on the control-panel and section
    9.1 for details on the Users and Groups module).


    You can also useadduser to create a new user from the command line.


    # ### 11.1.1 Standard Users


    Table 11.1.1 lists the standard users set up by the installation process (this
    is essentially the /etc/passwd file). The group id (GID) in this table is the
    primary group for the user. See section 11.1.3 for details on how groups are used.'
  merge: -1
  img_proc: true
