    # 11.7 Anonymous FTP


    Setting up anonymous FTP is simple. All you need to do is install the anonymous-ftp
    rpm package (which you may have already done at install time). Once it is installed,
    anonymous FTP will be up and running.


    There are a few files you might wish to edit to configure your FTP server.


    /etc/ftpaccess This file defines most of the access control for your ftp server.
    Some of the things that you can do: set up logical "groups" to control access
    from different sites, limit the number of simultaneous FTP connections, configure
    transfer logging, and more. Read the ftppass page for complete details.


    /etc/fthosts The fthosts file is used to allow or deny access to certain accounts
    from various hosts. Read the fthosts page for details.


    /etc/ftpusers This file lists all the users who are not allowed to ftp into your
    machine. For example, root is listed in /etc/ftpusers by default. That means you
    cannot ftp to your machine and log in as root. This is a good security measure,
    but some administrators prefer to remove root from this file.


    # 11.8 NFS Configuration


    NFS stands for Network File System, and is a way to share files between machines
    as if they were on your local hard drive. Linux can be both an NFS server and
    an NFS client, which means you can export filesystems to other systems, and mount
    filesystems exported from other machines.


    # 11.8.1 Mounting NFS Filesystems


    Use the mount command to mount a NFS filesystem from another machine:


    ```

    mkdir /mnt/local # Only required if /mnt/local doesn''t exist

    mount bigdog:/mnt/export /mnt/local

    ```'
