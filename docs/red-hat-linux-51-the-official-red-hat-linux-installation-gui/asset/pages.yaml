    # E.8.2 When I try to start X with the startx that no server was installed and
    I am back at a prompt. What could be wrong?


    When you get an error about no servers installed, you should check to see if first
    the correct X server was installed and the correct links were set up.


    If you are using the latest Red Hat packages, you will be using the xserver-wrapper
    as a method to protect against various security problems.


    /usr/X11R6/bin/X should be a symbolic link to xserver-wrapper and /etc/X11/X should
    be a symbolic link to the card-specific X server that you use, for example XF86_SVGA.


    Here’s an example of how you might create symbolic links, as root:


    ```

    cd /usr/X11R6/bin

    ln -sf xserver-wrapper ./X

    cd /etc/X11

    ln -sf "../../usr/X11R6/bin/XF86_SVGA" .X

    ```


    This should set up the symbolic links correctly for your system.


