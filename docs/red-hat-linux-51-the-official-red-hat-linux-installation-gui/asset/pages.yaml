    Your /etc/ld.so.conf file has been changed from an optimal setting. For optimal
    loading, set your /etc/ld.so.conf file in the following order:


    ```

    /usr/i486-linuxout/lib

    /usr/i486-linux-libc5/lib

    /usr/openwin/lib

    /usr/X1R6/lib

