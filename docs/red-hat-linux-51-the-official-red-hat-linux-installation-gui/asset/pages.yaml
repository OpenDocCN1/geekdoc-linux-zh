  md: '# SLIP Interface


    In order to configure a SLIP interface you must first supply a phone number, login
    name, and password. This will supply the initial parameters for the chat script
    needed to establish a SLIP connection. When you choose Done, a dialog titled Edit
    SLIP Interface appears that enables you to further customize the hardware, communication
    and networking parameters for your SLIP interface.


    # PLIP Interface


    To add a PLIP interface to your system you only have to supply the IP address,
    the remote IP address, and the Netmask. You can also select if you want to activate
    the interface at boot time.


    # Ethernet, Arcnet, Token Ring and Pocket Adaptor Interfaces


    If you are adding an ethernet, arcnet, token ring or pocket adapter to your computer
    you will need to supply the following information:


    +   * Device: This is determined by netconfig based on the devices already configured.

    * IP Address: Enter an IP address for your network device.

    * Netmask: Enter the network mask for your network device.

    * The network and broadcast addresses are calculated automatically based on the
    IP address and netmask you enter.

    * Activate interface at boot time: If you want the device to be configured automatically
    when your machine boots select this by clicking on the box.

    * Allow any user to (de)activate interface: Check this if you want any user be
    able to activate or deactivate the interface.

    * Interface configuration protocol: If you have a BOOTP or DHCP server on your
    network and would like to use it to configure the interface, choose the appropriate
    option; otherwise, choose none.


    After providing the configuration information for your new device, click Done.
    The device should appear in your Interfaces list as an inactive device. (The active
    column should have a label of no). To activate the new device, first select it
    with a mouse click and then choose on the Activate button. If it does not come
    up properly, you may need to reconfigure it by choosing on Edit.'
  merge: -1
  img_proc: true
