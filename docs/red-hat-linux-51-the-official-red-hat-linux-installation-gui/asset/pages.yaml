    \ more elegant ways\nto work with compressed files, but this approach will work\
    \ for just starting to\nuse Linux.\n\nIn general, of the documentation files you'll\
    \ find be one of those listed above. If\nin doubt, it's a good bet that the file\
    \ is text. You can always try the file command to see\nif file's contents can\
    \ be identified.\n\n+   - /usr/info... - Files in /usr/info are meant to be viewed\
    \ the info (Emacs' Info\nmode). If you use Emacs, press Ctrl- followed by I to\
