- pgno: 208
  md: '# C.1 Applications


    elm - (Version 2.4.25, 479K) ELM is one of the most popular terminal mode mail
    handling programs. It is powerful, easy to use, and easy to find help on. It has
    all the mail handling features you would expect, including MIME support (via metamail).


    exmh - (Version 2.0.2, 1,814K) exmh is a graphical interface to the MH mail system.
    It includes MIME support, faces, glimpse indexing, color highlighting, PGP interface,
    and more. Requires sox (or play) for sound.


    fetchmail - (Version 4.4.4, 462K) Fetchmail is a program that is used to retrieve
    mail from a remote mail server. It can use the Post Office Protocol (POP) or IMAP
    (Internet Mail Access Protocol) and, delivers mail through the local SMTP server
    (normally sendmail).


    mailix - (Version 5.5.kw, 83K) The /bin/mail program can be used to send quick
    mail messages, and is often used in shell scripts.


    metamail - (Version 2.7, 333K) Metamail is an implementation of MIME, the Multipurpose
    Internet Mail Extensions, a proposed standard for multimedia mail on the Internet.
    Metaimplements MIME, also implements extensibility and configuration via the "mailcap"
    mechanism described in an informational RFC that is a companion to the MIME document.


    mutt - (Version 0.91.1, 463K) Mutt is a small but very powerful full-screen Unix
    client. It features MIME support, color, POP support, message threading, binding
    keys, and threaded sorting mode.


    nmh - (Version 0.24, 2,293K) nmh mail handling system (with POP support). nmh
    is a popular mail handling system but includes only a command line interface.
    It is an important base, however, for programs like xmh and exmh.


    pine - (Version 3.96, 2,367K) Pine is a very full featured text mail and news
    client. It is aimed at both novice and expert users. It includes an easy to use
    editor, pico, for composing messages. Pico has gained popularity as a stand alone
    text editor in it''s own right. It features MIME support, address books, and support
    for IMAP, mail, and MH style folders.


    # C.1.8 Math


    This section contains packages of interest to the mathematician in all of us.


    bc - (Version 1.04, 125K) bc is a text calculator of sorts. It has many features
    such as translation. It can also accept input from stdin and return output. dc
    is the RPN version.


    gnuplot - (Version 3.5, 495K) This is the GNU plotting package. It can be used
    to graph data in an X window or to a file.'
