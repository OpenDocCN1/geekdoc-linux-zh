  md: '# C.7 Games


    This section lists the packages that provide fun and entertainment to Red Hat
    Linux system owners over the world. Game packages that run under the X window
    system can be found in the X11 section near the end of this appendix.


    bsd-games - (Version 2.1, 1,791K) This is a bunch of games. Highlights include
    backgam-mon, cribage, hangman, manor, primes, trek, and battlestor.


    christmoner - (Version 3, 223K) This is a text adventure game for use with xzip.


    colour-yahtee - (Version 1.0, 19K) This is a terminal mode version of the popular
    game, yahtee. It is a dice and board game.


    fortune-mod - (Version 1.0, 2,337K) This is the ever popular fortune program.
    It will gladly grant a random fortune when run. Is usually to put in the .login
    for your users on a system so they see something new every time they log in.


    gnuchess - (Version 4.0,pl77, 1,330K) This is the famous GNU chess program. It
    is text based, but can be used in conjunction with xboard to play X chess.


    mysterious - (Version 1.0, 163K) Brian Howarth''s Mysterious Adventure game series.
    This is a text based adventure game.(remember those?).


    pinfcom - (Version 3.0, 169K) ''pinfcom'' is an interpreter for old Infocom-compatible
    text adventure games (remember those?).


    scottfree - (Version 1.14, 31K) ''scottfree'' is an interpreter for Scott-Adams-format
    text adventure games so that at least three blocks horizontally or diagonally,
    or both, have matching patterns.


    trojk - (Version 1.1, 15K) The aim of this game is to control and to place the
    falling blocks, so that at least three blocks horizontally or diagonally, or both,
