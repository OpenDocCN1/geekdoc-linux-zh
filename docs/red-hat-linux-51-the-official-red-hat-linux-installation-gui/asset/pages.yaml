    most SCSI drivers detect your hardware automatically, however.


    # 4.3 Creating Partitions for Red Hat Linux


    At this point, it''s necessary to let the installation program know where it should
    install Red Hat Linux. This is done by defining mount points for one or more disk
    partitions in which Red Hat Linux will be installed. You may also need to create
    and/or delete partitions at this time.


    **Please Note:** If you have not yet planned how you will set up your partitions,
    please turn to Section 2.6 on page 19, and review everything up to Section2.7
    on page 25. As a bare minimum, you''ll need an appropriately-sized root partition,
    and a swap partition of at least 16 MB.


    The installation program then presents a dialog box that allows you to choose
    from two disk partitioning tools (see Figure 4.2). The two choices you have are:


    +   **Disk Druid** – This is Red Hat''s install-disk management utility. You can
    create and delete disk partitions according to user-supplied requirements, in
    addition to managing points for each partition.


    +   **fdisk** – This is the traditional disk partitioning tool. While it is somewhat
    more flexible than Disk Druid, the downside is that fdisk assumes you have some
    experience with disk partitioning, and are comfortable with its somewhat terse
    user interface.


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_66_0.png)


    Figure 4.2: Selecting Disk Setup Method'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# 44


    # Continuing the Installation


    With the exception of certain esoteric situations, Disk Druid can handle the partitioning
    requirements for a typical Red Hat Linux installation.


    Select the partitioning tool you''d like to use, and press `Enter` If you choose
    Disk Druid, continue reading. If you''d rather use `fdisk`, please turn to Section
    4.3.2 on page 49.


    # 4.3.1 Using Disk Druid


    If you select Disk Druid, you will be presented with a screen that looks like
    figure 4.3. While it may look overwhelming at first, it really isn''t. Let''s
    go over each of Disk Druid''s three sections.


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_67_0.png)


    Figure 4.3: Disk Druid Main Screen


    Each line in the "Current Disk Partitions" section represents a disk partition.
    You''ll note that this section has a scroll bar to the right, which means there
    might be more partitions than can be displayed at one time. If you use the `Page
    Up` and `Page Down` keys, you can see if there are any additional partitions there.
    Each line in this section has five fields:


    **Mount Point** – This field indicates where the partition will be mounted when
    Red Hat Linux is installed and running.


    **Device** – This field displays the partition''s device name.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 4.3 Creating Partitions for Red Hat Linux


    Requested - The “Requested” field shows the minimum size requested when the partition
    was defined.


    Actual - The “Actual” field shows the space currently allocated to the partition.


    Type - This field shows the partition''s type.


    Another Type of Partition As you scroll through the “Current Disk Partitions”
    section, you might see an “Unallocated Requested Partitions” title bar, followed
    by one or more partitions. As the titles, these are partitions that have been
    requested, but for one reason or another, have not been allocated. A common reason
    for having an unallocated partition is a lack of sufficient free space for the
    partition. In any case, the reason partition remains unallocated will be displayed
    after the partition''s mount point.


    # The “Drive Summaries” Section


    Each line in the “Drive Summaries” section represents a hard disk on your system.
    Each line has the following fields:


    Drive - This field shows the hard disk''s device name.


    Geom [C/H/S] - This field shows the hard disk''s geometry. The geometry consists
    of three numbers representing the number of cylinders, heads, and sectors as reported
    by the hard disk.


    Total - The “Total” field shows the total available space on the hard disk.


    Used - This field shows how much of the hard disk''s space is currently allocated
    to partitions.


    Free - The “Free” field shows how much of the hard disk''s space is still unallocated.


    Bar Graph - This field presents a visual representation of the space currently
    used on the hard disk. The more pound signs there are between the square braces,
    the less free space there is. In Figure 4.3 on the preceding page, the bar graph
    shows no free space.


    Please Note: The “Drive Summaries” section is displayed only to indicate your
    computer''s disk configuration. It is not meant to be used as a means of specifying
    the target hard drive for a given partition. This is described more completely
    in Section 4.3.1 on the following page.


    # Disk Druid’s Buttons


    These buttons control Disk Druid''s actions. They are used to add and delete partitions,
    and to change partition attributes. In addition, there are buttons that are used
    to accept the changes you’ve made, or to exit Disk Druid entirely. Let’s take
    a look at each button in order.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'Add – The “Add” button is used to request a new partition. When selected, a
    dialog box will appear containing fields that must be filled in.


    Edit – The “Edit” button is used to modify attributes of the partition currently
    highlighted in the “Current Disk Partitions” section. Selecting this button will
    cause a dialog box to appear. Some or all of the fields in the “Edit Partition”
    dialog box may be changed, depending on whether the partition information has
    already been written to disk or not.


    Delete – The “Delete” button is used to delete the partition currently highlighted
    in the “Current Disk Partitions” section. Selecting this button will cause a dialog
    box to ask you to confirm the deletion.


    Ok – The “Ok’ button causes any changes made to your system’s partitions to be
    written to disk. You will be asked to confirm your changes before Druid rewrites
    your hard partition table(s). In addition, any mount points you’ve defined are
    passed to the installation program, and will eventually be used by your Red Hat
    Linux system to define the filesystem layout.


    Back – This button causes Druid to abort without saving any changes you’ve made.
    When this is selected, the installation program will take you back to the previous
    screen.


    # Handy Function Keys


    While there is some overlap between Druid’s buttons and the available functions
    keys, there are two function keys that have no corresponding buttons:


    +   - F2 (Add NFS) – This function key is used to add a read-only NFS-served filesystem
    to the set of mount points on your Red Hat Linux system. When selected, a dialog
    box will appear containing fields that must be filled in.

    - F5 (Reset) – This function key is used to discard all changes you may have made
    in Druid, and return the list of partitions to those read from the partition table(s)
    on your hard disk(s). When selected, you’ll be asked to confirm whether the changes
    discarded or not. Note that any mount points you’ve specified will be lost, and
    will need to be reentered.


    Please Note: You will need to dedicate at least one partition to Red Hat Linux,
    and optionally more. This is discussed more in Section 2.6.5 on page 24.


    Now let’s see how Druid is used to set up partitions for your Red Hat Linux system.


    # Adding a Partition


    To Add a new partition, select the Add button, and press Space or Enter. A dialog
    box entitled “Edit Partition” will appear (see Figure 4.4 on the facing page).
    It contains the following'
