  md: '# 9.6 Kernel Daemon Configuration


    Red Hat Linux includes kerneld, the Kernel Daemon, which automatically loads some
    soft-ware and hardware support into memory as it is needed, and unloads it when
    it is longer being used.


    The tool shown in Figure 9.15 manages the configuration file for kerneld. Where
    kernel can load some things, such as filesystems, without explicit configuration,
    it needs to be told what support to load when it is presented with a generic hardware
    request.


    | Type | Module | Arguments |

    |---|---|--|

    | scsi_host | BusLogic | |

    | eth0 | 3c59 | |

    | eth1 | 3c503 | acvr=1 lo=0x300 irp=5 |


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_151_0.png)


    For instance, when the kernel wants to load support for ethernet, kerneld needs
    to know which ethernet card you have, and if your ethernet card requires special
    configuration, it needs to know about that, too.


    # 9.6.1 Changing Module Options


    To change the options given to a module when it is loaded, click on the line to
    select, then click the Edit button. kernelcfg will bring you a window which looks
    like Figure 9.16. The options kernelcfg knows about (normally all available options)
    will each have their field. Normally, you will want to ignore the Other arguments
    field. Some modules normally take no arguments; just in case, they have an Arguments
    field which allows you to enter configuration information.


    # 9.6.2 Changing Modules


    To change which module gets invoked to provide a generic service, such as an ethernet
    card or SCSI adapter module, you need to delete the old one and add a new one.
    To delete'
