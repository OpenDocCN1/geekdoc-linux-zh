  md: '# C.A.5 Tools


    This section contains packages that provide the usual assortment of tools that
    programmers require.


    binutils – (Version 2.9.1.0.4, 4,530K) Binutils is a collection of utilities for
    compiling programs. It includes the assembler and linker, as well as a number
    of other miscellaneous programs for dealing with executable formats.


    bison – (Version 1.25, 158K) This is the GNU parser generator which is most compatible
    with yacc. Many programs use it as part of their build process. Bison is only
    needed on systems that are used for development.


    byacc – (Version 1.9, 54K) This is a public domain yacc parser. It is used by
    many programs during their build process you probably want this package if you
    do development.


    cdecl – (Version 2.5, 74K) This is a package to translate English to C/C++ function
    declarations and vice versa. It is used by programmers.


    cproto – (Version 4.4, 92K) Cproto generates prototypes for functions defined
    in the C source files to the standard output. The function definitions may be
    in the old style or ANSI C style. Cproto also outputs declarations for variables
    defined in the files. If no argument is given, cproto reads its input from the
    standard input.


    flex – (Version 2.5.4a, 291K) This is the GNU fast lexical generator. It generates
    lexical tokenizing code is designed to work with both yacc and bison, and is used
    by many programs as part of their build process.


    gettext – (Version 0.10, 443K) The gettext library provides an easy to use library
    and tools for creating, using, and modifying natural language catalogs. It is
    a powerful and simple method for internationalizing programs.


    indent – (Version 1.9.1, 81K) This is the GNU indenting program. It is used to
    beautify C program files.


    xwpe – (Version 1.4.2, 713K) XWPE is actually a package of four programs: we,
    wpe, and xwe. They are different versions of the same basic programmers editor
    development environment. If you have used some of the Microsoft Windows programming
    IDE’s and longed for an X Windows equivalent, this is what you have been looking
    for! Also included the text-mode equivalents of the X programs, enabling you to
    use xwpe no matter what your development environment may be.


    This package includes the xbwie libraries and the text-mode programs; the X Windows
    programs are contained in the ‘xwpe-X11’ package.'
