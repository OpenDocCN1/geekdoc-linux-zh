- pgno: 20
  md: '# Preface


    Hat Linux is also easy to maintain – package installations can be verified and
    corrected, and packages can be installed and uninstalled simply and reliably.
    Furthermore, Red Hat Linux is easy to administer. Included are a rich set of administrative
    tools which reduce the hassle of everyday system administration. Complete source
    code is provided for the freely distributable components of the system.


    # An Overview of This Manual


    This manual is organized to guide you through the process of installing Red Hat
    Linux quickly and easily. To that goal, let''s take a quick look at each chapter
    to help you get acclimated:


    +   - Chapter 1, New Features Of Red Hat Linux 5.1 contains information concerning
    new functionality that has been added to Red Hat Linux 5.1.


    +   - Chapter 2, Before You Begin contains information on tasks you should perform
    prior to starting the Red Hat Linux installation.


    +   - Chapter 3, Starting the Installation contains detailed instructions for
    starting the Red Hat Linux installation process.


    +   - Chapter 4, Continuing the Installation contains instructions on the main
    part of the installation process.


    +   - Chapter 5, Finishing the Installation contains instructions on the last
    steps required to complete the installation process.


    +   - Chapter 6, What Do I Do Now? contains information on logging in, performing
    system shutdowns, and configuring the more popular system components (such as
    X).


    +   - Chapter 7 – 11 explain how to find documentation on your system, and how
    to use the various system management and administration tools which accompany
    Red Hat Linux. They also include an explanation of what special about your Red
    Hat Linux system, including special files live and more.


    +   - Appendices contain extra information about Red Hat Linux, including an explanation
    on Red Software’s support offerings, frequently asked questions, etc.


    # Quick Start Information


    Of those you that have installed Red Hat Linux/Intel before and are in a hurry
    to get started need only boot from a boot diskette (or Red Hat Linux/Intel CD-ROM,
    if your computer supports booting directly from CD-ROM). Next, select the desired
    installation method. If you are installing from an FTP site, a hard disk, or you’ll
    be using a PCMCIA card during the installation,'
