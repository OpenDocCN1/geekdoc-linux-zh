    (FAQ) about Linux from sunsite.unc.edu/linux. It is one of the best collections
    of information about Linux.


    howto - (Version 5.1, 8,580K) This is the best collection of Linux documentation
    there is. It was put together on Apr 15 1998. If you want to find newer versions
    of these documents, see http://sunsite.unc.edu/linux. For the versions in this
    package, see /usr/doc/HOWTO.


