  md: '# C.9 Networking


    # C.9 Networking


    This section lists packages that are related to networking. It has been split
    into several subsections for easier browsing.


    # C.9.1 Admin


    This section lists packages that provide basic network administrative functions.


    **anonftp – (Version 2.5, 1,019K)** Contains the files needed for allowing anonymous
    ftp to your machine. This lets any user get files from your machine without having
    an account, which is a popular way of making programs available on the Internet.


    **caching-nameserver – (Version 5.1, 3K)** Includes configuration files for bind
    (the DNS nameserver) which make behave as a simple caching nameserver. Many users
    on dialup use this package (along with bind) and make it''s own nameserver to
    speed up name resolutions.


    **net-tools – (Version 1.33, 149K)** This is a collection of the basic tools necessary
    for setting up networking on a Linux machine. It includesconfig, route, netstat,
    rarp, and some other minor tools.


    **nfs-server-clients – (Version 2.2beta29, 10K)** This package contains client
    programs that interact with NFS servers. It is not needed to mount NFS volumes.
    At the moment the only program in it is showmount, which can be used to show exported
    and mounted filesystems.


    **tcp-wrappers – (Version 7.6, 245K)** With this package you can monitor and filter
    requests for the SYSTAT, FINGER, FTP, TELNET, LOGIN, RSH, EXEC, TFPT, TALK, and
    other network services.


    # C.9.2 Daemons


    This section lists packages that provide various network-related daemons. Daemons
    are programs that run automatically to perform various system functions.


    **am-utils – (Version 6.0a16, 1,976K)** Am-utils is the“next generation” of the
    popular BSD Automounter, AMD. Am-utils includes many additional updates, ports,
    programs, features, bug fixes, and more.


    AMD is the Berkeley automounter daemon. It has the ability to automatically mount
    filesystems of all types, including NFS filesystems, CD-ROM''s, and local drives,
    and unmount them they are not being used any more.


    The default setup allows you to ‘cd /net/[hostname]’ and get a list of directories
    exported from that host.'
  merge: -1
  img_proc: true
