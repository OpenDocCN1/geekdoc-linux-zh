  md: '# Files in /etc/sysconfig/network-scripts/


    The following files are normally found in /etc/sysconfig/network-scripts:


    +   - /etc/sysconfig/network-scripts/ifup

    - /etc/sysconfig/network-scripts/ifdown

    - /etc/sysconfig/network-scripts/network-functions

    - /etc/sysconfig/network-scripts/ifcfg-<interface-name>

    - /etc/sysconfig/network-scripts/ifcfg-<interface-name>--clone-name>

    - /etc/sysconfig/network-scripts/chat-<interface-name>

    - /etc/sysconfig/network-scripts/dip-<interface-name>

    - /etc/sysconfig/network-scripts/ifdhchpc-done


    Let''s take a look at each one.


    /etc/sysconfig/network-scripts/ifup, /etc/sysconfig/network-scripts/ifdown - Links
    to /sbin/ifup and /sbin/ifdown, respectively. These are the only scripts in the
    directory that should be called directly; these two scripts call all the other
    scripts as needed. These symlinks are for legacy purposes only - they will probably
    be removed in future versions, so only /sbin/ifup and /sbin/ifdown should currently
    be used.


    These scripts take one argument normally: the name of the device (e.g. "eth0").
    They are called with a second argument of "boot" during the boot sequence so that
    devices that are not meant to be brought up on (ONBOOT=no, see below) can be ignored
    at that time.


    /etc/sysconfig/network-scripts/network-functions - Not really a public file. Contains
    functions which the scripts use for bringing interfaces up and down. In particular,
    it contains most of the code for handling alternative interface configurations
    and interface change notification through network.


    /etc/sysconfig/network-scripts/ifcfg-<interface-name>,

    etc/sysconfig/network-scripts/ifcfg-<interface-name>--clone-name> - The first
    file defines an interface, while the second file contains only the parts of the
    definition that are different in a "clone" (or alternative interface). For example,
    the network numbers might be different, but everything else might be the same,
    so only the network numbers would be in the clone file, while all the device information
    would be in the base ifcfg file.


    The items that can be defined in an ifcfg file depend on the interface type.


    The following values are common to all files:'
