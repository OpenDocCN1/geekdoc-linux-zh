    # Learning About Your Hardware With Windows® 95


    If your computer is already running Windows 95, you can use the following procedure
    to get additional configuration information:


    +   - With Windows 95 running, click on the "My Computer" icon using the secondary
    (normal-right) mouse button. A popup menu should appear.


    +   - Select "Properties". The "System Properties" window should appear (See Figure
