  md: '# 10.4 Package Manipulation


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_158_0.png)


    10.4: Configuration Window


    will open a dialog box like the one shown in figure 10.4. Here you can type the
    full path to the RPMs you''d like to look at. Choosing the Save button will save
    this path, making it the default for future glint sessions. The Default button
    restores the path to the one that glint used when it started.


    After changing this path and closing the dialog box, you can use the Available
    button to view the packages available in the new location.


    # 10.4 Package Manipulation


    # 10.4.1 Querying Packages


    The easiest way to query a single package or group is to use the query option
    from the icon''s context sensitive menu. If you want to query a more diverse set
    of packages, select them all and use the Query button in one of the windows.


    Using either of these methods creates a window like the one shown in figure 10.5.
    If you choose only one package, it will look bit different however, so some of
    this won''t apply.


    On the very left of the window is a list of the packages that have been queried.
    Selecting one of them will change the information in the rest of the window. You
    may step through them using the Next and Previous buttons on the right side of
    the window.


    The name, version, and release of the package are in the top middle of the query
    window. Immediately below this is the description of the package, which can be
    quite large. A scroll bar is there to let read the whole thing.


    Below the description is a list of the files contained in the package. Along with
    the full path to the file, the file list tells you a couple of other things. If
    a D appears to the left of the path, that file is a documentation file and would
    be a good thing to read. If a C appears there, then the file is a configuration
    file. A * means that the correct version of that file is not installed on your
    system. This can occur because a more recent version of a package was installed
    or because two packages contain different versions of the same file.'
