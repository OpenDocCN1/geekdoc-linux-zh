  md: '# # 1

    New Features Of Red Hat Linux 5.1


    This chapter describes features that are new to Red Hat Linux 5.1.


    # ## 1.1 Installation-Related Enhancements


    There have been many changes made to make the Red Hat Linux installation process
    easier. Here''s a list:


    +   - Improved Installation Guide

    - Network-related enhancements

    - Installation simplified

    - Boot diskette creation

    - Internationalization

    - Disk Druid-like "fstab editor"

    - SMB installation method returns'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Let''s take a look at each one in a bit more detail.


    # 1.1.1 Improved Installation Guide


    The Red Hat Linux 5.1 Installation Guide has been improved with:


    +   - Improved Installation Chapters – The chapters covering the installation
    of Red Hat Linux have been expanded to include more detailed information in a
    more streamlined form.

    - A New Chapter – There is now a chapter devoted to the most frequently-fasked
    question – “What do I do now?”

    - All-New FAQ – Appendix E contains a newly updated set of frequently asked questions.
    If you run into problems (before or after the installation), check it out ...n-
    Complete Package List – Appendix C contains an entry for every package shipped
    Red Hat Linux/Intel. Each entry includes the package name, version, size, and
    a description. The package list is a great way to see what Red Hat Linux is capable
    of. It also has its own index, making the search for a specific package easier.


    # 1.1.2 Network-Related Enhancements


    The installation program can now use BOOTP and DHCP to obtain network information
    during the installation. Of course, it is still possible to manually enter this
    information manually.


    # 1.1.3 Installation Simplified


    Most dialog boxes displayed during the installation process now have a Back button,
    making it possible to fix many of those “Oops – I didn’t want to do that” problems.


    # 1.1.4 Boot Diskette Creation


    The installation program now gives you the option of making a boot diskette (containing
    a copy of the installed kernel and all modules required to boot your system).
    The boot diskette can also be used to load a rescue diskette (described in Section
    1.2.2 on page 5).'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1.2 System Administration-Related Enhancements


    # 1.1.5 Internationalization


    The installation program is now internationalized, and supports a variety of different
    languages. The first question asked by the installation program is for the desired
    language; all screens after are presented in the language selected by the installer.
    In addition, information from RPM packages that have been internationalized will
    be displayed in the appropriate language.


    # 1.1.6 Disk Druid-Like “fstab editor” Available


    When partitioning drives install fdisk, a new method of specifying partition points
    is available. Similar to Disk Druid, it provides a concise view of all available
    partitions.


    # 1.1.7 SMB Installation Method Versions


    Red Hat Linux 5.1 now supports installation from an SMB shared volume. This makes
    it possible to perform an installation on networks where there is no FTP or NFS
    server, but there is an SMB-capable system available.


    # 1.2 System Administration-Related Enhancements


    Red Hat Linux 5.1 has these features for system administrators:


    +   * Linuxconf now included

    * Improved rescue diskette

    * Inscript documentation


    # 1.2.1 LinuxConf Now Included


    Red Hat Linux 5.1 now supports the use of linuxconf for many system configuration
    tasks. Linuxconf is an extremely fully-featured configuration tool. Written by
    Jacques Gelinas, it can manage age most aspects of system configuration through
    the following user interfaces:


    +   * Command line – Linuxconf’s command-mode line is handy for manipulating your
    system-configuration scripts.

    * Character-Cell – Using the same user interface style as the Red Hat Linux installation
    program, the character-cell interface makes it easy to navigate your way through
    linuxconf, even if you aren''t running X.'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# New Features Of Red Hat Linux 5.1


    +   - X Window-Based – Linuxconf can take advantage of X, and you give you an
    easy-to-use "point and click" interface.


    +   - Web-Based - A web-based interface makes remote system administration a breeze.


    To launch linuxconf, simply type (as root) linuxconf. Linuxconf will then start
    in either character-cell or X mode, depending on the DISPLAY environment variable.
    The first time you run linuxconf, an introductory message will be displayed; although
    it is only displayed, accessing from the main screen will give you the same basic
    information.


    Linuxconf has context-specific help available. For information on any specific
    aspect of linuxconf, please select Help from the screen you''d like help with.
    Note that not all screens are complete at this time; they will be included in
    subsequent versions of linuxconf.


    # Enabling Web-Based Linuxconf Access


    Web-based access to linuxconf is disabled by default. Before attempting to access
    linuxconf with a browser, you will need to enable access. Here''s how to do it
    from the text-mode interface:


    +   - Start linuxconf by typing linuxconf while logged in root.


    +   - From the Config section, select Networking.


    +   - Select Misc. Then select Linuxconf network access.


    +   - In the "Linuxconf html access control\u00d dialog box, enter the hostname
    of any computers that should be allowed access to linuxconf. This would also include
    your own system, if you wish to use the web-based interface locally. Web accesses
    related to linuxconf may be logged to your system''s log file by selecting the
    check box.


    +   - Select the Accept button and press Space Then select the Quit buttons on
    each dialog box to back out of the menu hierarchy. When you come to a dialog box
    labelled "Status of the system", press Enter to take the default action, which
    is to apply the changes you made.


    At this point, web-based access has been enabled. To test it, go to one of the
    systems that you added to your access control list. Launch your web browser, and
    enter the following URL:


    ```

    http://<host>:98/

    ```


    (Replacing <host> with your system''s hostname, of course.) You should see the
    main linuxconf page. Note that you will need to enter your system''s hostname
    to gain access beyond the first page.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 1.3 Miscellaneous New Features


    # 1.2.2 Improved rescue diskette


    Going hand-in-hand with the new boot diskette available with Red Hat Linux 5.1,
    the new rescue diskette offers additional capabilities over the rescue mode available
    in prior versions of Red Hat Linux. Therefore, the rescue mode available with
    prior versions of the Red Hat Linux boot and supplementary diskettes has been
    discontinued. For more information on the new rescue mode, please read the file
    rescue.txt in the /doc directory of your Red Hat Linux CD-ROM.


    # 1.2.3 Initscript documentation


    Red Hat Linux uses files in /etc/sysconfig to control boot-time configuration.
    This information has been documented here for the first time. Please see Section
    11.9 on page 155 for more information.


    # 1.3 Miscellaneous New Features


    These new features categorize:


    +   * Window Manager-Related Enhancements

    * New compiler technology available with egcs

