- pgno: 154
  md: '# 10


    # Glint


    Red Hat provides a graphical tool to aid in package installation and removal.
    It''s called glint (Graphical Linux INstagram) and runs under the X Window System.
    It allows easy installation, uninstallation, upgrading, querying, and verification
    of packages. The interface is similar to the one found in many popular file managers
    and is simple to use.


    Operations are performed in glint by selecting the packages to operate on and
    then selecting the operation to perform via pushbuttons. Installing a package
    places all of the components of that package on your system. Uninstalling one
    removes all traces of the package except for configuration files you have modified.
    Upgrading a package installs the newly available version and uninstalls all other
    versions that were previously installed. This allows quick upgrading to the latest
    releases of packages.


    The query operation lets you examine the details of both installed or available
    packages. You can view the description of the package, where when it was built,
    the files in the package, and other attributes. All of the configuration and documentation
    components of each package are clearly marked as such to reduce the time you spend
    looking for them.


    Using glint to perform all of these operations is the same as using rpm to do
    them from the command line. However, the graphical nature of glint often makes
    these operations easier to perform.


    The normal way to handle glint is to display the available packages and files,
    select the ones you want to operate on, and then press a button or choose a menu
    that performs the operation. For instance, you can install several packages with
    a few button clicks.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 10.1 Starting glint


    To glint, simply run glint & from any terminal window. That will bring up a window
    that looks like the one in figure 10.1. Any user can use glint to query and verify
    packages, but if you need to install, uninstall, or upgrade packages be sure to
    run it as root.


    There are two main parts to the glint interface. The first, on the left, allows
    you to browse and select the packages installed on your system. The right side
    contains buttons that manipulate the selected packages.


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_155_0.png)


    Figure 10.1: Main Glint Window


    # 10.2 The Package Display


    Each folder icon in glint represents a group of packages. Each group can contain
    other groups, which allows for flexible locations of packages. Groups are used
    to place packages that perform similar functions in similar locations. For example,
    Red Hat includes many programs such as editors and spreadsheets. All of the text
    below appears in the "Applications" group. Inside of that group, there is another
    grouping for all of the editors that are shipped.


    By convention, groups are written in the same way as UNIX paths. The top most
    group is written first, and subsequent groups follow with a slash separating the
    group names. This means that an X-based drawing program appears in the XII/Applications/Graphics
    group.


    To view the packages and subgroups within a group, double click the mouse button
    on a group’s folder icon. The window then changes to show what that package contains.
    The top line of the package display shows which group you’re currently looking
    in, as well as the groups leading to the current one. To return to the previous
    group you were looking at, double click'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 10.2 The Package Display


    on the “Back” folder, which is always in the upper left hand corner of the folder
    area (though often gets scrolled away).


    If you''d like to examine a subgroup in a new window, double click the middle
    mouse button on its folder. If your mouse has only two buttons, click both. This
    will create a new window with group in it.


    # 10.2.1 Context Sensitive Menus


    Press the right mouse button on any icon in the package window brings up a small,
    context sensitive menu. The exact items it contains depends on where you press
    it. They all contain options to select or deselect the item, and many let you
    install, uninstall, query, upgrade, or verify the item you clicked. There''s more
    information on how to do these things later.


    To choose an item from a context sensitive menu, press and hold the right mouse
    button on an icon. While still holding the right button down, move the mouse pointer
    over the item you''d like to select (which will then be highlighted). Release
    the right mouse button to select that item and make the menu disappear.


    # 10.2.2 Selecting Packages


    To select a single package, click the left mouse button on it. You''ll notice
    a thin border appear around the package''s icon (as shown in figure 10.2) which
    shows that it''s currently selected. To unselect it, click the left mouse button
    on it and the border will disappear. The number of packages currently selected
    is always displayed at the bottom of the window. A group''s folder icon displays
    the number of packages within that group that have been selected, or All if all
    have been selected.


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_156_0.png)


    Figure 10.2: Selecting Packages in Glint'
