    # E.9.7 When I run fstool, I get a message that says a partition seems to have
    been deleted and asks if I want to remove it /etc/fstab.


    The fstool program is not working properly with current versions of tcl and shouldn''t
    be used. It should have been obsolete, but slipped through the cracks.


    First we will have to fix the /etc/fstab file since fstool may have corrupted
    it. The areas that seem to be changed by fstool are usually the cdrom and swap.
    Here are some samples you will need to change the partitions to match your system.


    ```

    /dev/sda2 swap swap 0 0

    /dev/cdrom mnt/cdrom iso9660 noauto,ro 0 0

    ```


    You should now remove the fstool program using rpm.


    ```

    rpm -e fstool

    ```


    Please use cabaret which is a functional working alternative. This program is
    located in /usr/sbin/cabaret and can be executed from the command line.


    # E.9.8 How do I configure my Jaz drive under linux?


    Documentation on using Jaz with Linux can be found on the cdrom doc/HOWTO/mini/Jaz-Drive
    and on the system in /usr/doc/HOWTO/mini/Jaz-Drive.'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# E.9.9 How do I use my parallel port zip drive?


    Here''s something you can try: edit /etc/conf.modules and add the following line
    to the others


    ```

    alias scsi_hostadapter ppa

    ```


    If you need to send the ppa driver any options about which LP is being used etc,
    you would add the line


    ```

    options ppa=<options go here>

    ```


    For more information, check www.torque.net/paraport


    # E.9.10 I''m having problems getting my IDE drive to work.


    First check and make sure there is a disk in the drive. Also, make sure you are
    mounting it as partition 4 instead of 1. An example would be hdc4. The supposed
    reason for it being partition 4 is that Mac SCSI uses this partition as its primary
    partition.


    # E.9.11 Some of my older applications get the incorrect time.


    Some libc5 apps want /usr/lib/zoneinfo, so you can either recompile them for lib6
    or provide a symlink so that things will work.


    ```

    ln -s ../share/zoneinfo /usr/lib/zoneinfo

    ```


    Please see also check the Red Hat errata (www.redhat.com/errata) for other items.


    # E.9.12 I have all the latest updates installed, but my programs still get the
    incorrect time.


    If you have installed all the latest updates and programs still get the incorrect
    time, try checking the settings in /etc/sysconfig/clock. They probably look something
    like this:


    ```

    UTC=true

    ARC=false

    ```'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# E System Administration


    This means Linux will assume that your BIOS clock is set to the UTC or GMT timezone.
    More than likely, the clock is set to your local timezone, and you need to change
    the UTC line to be


    ```

    UTC=false

    ```


    # E.9.13 During the install, I was not asked to use the 2nd cdrom. When I use
    the X program glint on it, it reports that there are no rpms, but when I look
    at the directories, I see lots of them. What is going on?


    The 2nd cdrom in the Red Hat Linux boxed contains the source rpms (SRPM) for all
    of the Open Source applications that are on the first cdrom. From these source
    rpms, you can build all the Open Source applications we have in the distribution.


    The reason that glint does not see source rpms is due to SRMPS are not stored
    in any of the RPM databases. This makes it almost impossible to tell if you have
    installed a src.rpm before or are re-writing an older version. Then you will need
    to use the plain rpm command to install these items.


    ```

    rpm -ivh < filename > will install the source code into the directory that the
    maintainer of that RPM used. The data in src.rpm packaged by Red Hat are installed
    into /usr/src/redhat by default.

    ```


    Rebuilding and improving on rpms is beyond the scope of this answer. The book
    Maximum RPM and the man pages are good sources of information on this.


    # E.9.14 Linux recognizes my CDROM, but when I try to mount it, get "mount failed"
    What do I do?


    If your system was installed properly, simply typing /mnt/cdrom should work. If
    it does not, you must edit your /etc/fstab file. Here is an example of entry in
    /etc/fstab:


    ```

    /dev/hdc          /mnt/cdrom      iso9660 noauto,ro 0 0

    CD-ROM device)      (directory)      (filesystem type and options)

    ```


    To find out what the CD-ROM device is, type dmesg | less and scan it for information
    regarding CD-ROM. If you wish to mount the CD-ROM without adding this to your
    /etc/fstab:


    ```

    mount -t iso9660 /dev/hdc /mnt/cdrom

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# E.9.15 I have Linux installed on an IDE drive, and for whatever-reason I
    need to boot from floppy. How can I boot my system from the install floppy?


    If you have installed Linux onto an IDE hard-drive, you can boot from the installation
    floppy using the following method.


    Insert the installation floppy and restart the machine. At the boot: prompt type
    the following:


    ```

    vmlinux root=/dev/hdXY

    [Example: vmlinux root=/dev/hdb5 ]

    ```


    Where X is the Linux drive letter and Y is the partition on the drive you installed
    the root/) partition to.


    # E.9.16 I can''t get my Plug and Play card to work.


    The 2.0.xx kernels do not directly support the Plug and Play (PNP) protocol. You
    will need to either disable PNP on the card (via jumpers or card setup tools).
    You can also change your boot method to use Loadlin.exe from Windows (as windows
    would then set up the PNP hardware).


    Finally you can try using isapntools programs. First, type this:


    ```

    pnpdump /etc/isapnp.conf

    ```


    This will create a configuration file that you will need to edit to choose the
    settings used for each card. Then type isapnp /etc/isapnp.conf to set up the devices.


    See http://www.roestock.demon.co.uk/isapntools/ for more information.


    # E.9.17 When the system boots up, I see a message that says I have unknown PCI
    hardware. What does this mean?


    The error "unknown PCI device" can occur for several reasons. The first and most
    harmless one is that PCI is not responding to Linux''s queries in a way it understands,
    but Linux is able to keep going. The more common occurrence is that the system
    hangs querying PCI bus cards and cannot get any further.


    Since this is a hardware problem in the kernel, there is not much that RedHat
    can except point you to the maintainer of that section of the kernel. They may
    be able to let you know what is going on, and may want to look at what hardware
    you do have in your system so they can better handle it in the future. The maintainer
    can be reached at:'
  merge: -1
  img_proc: true
- pgno: 292
  md: "# E.9 System Administration\n\nlinux-pcisupport@cck.uni-kl.de\n\nPlease include\
