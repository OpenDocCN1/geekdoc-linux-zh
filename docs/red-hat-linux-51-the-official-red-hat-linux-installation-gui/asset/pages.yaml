    # E.6.3 For whatever reason, I need to make new floppies. What can I do?


    We are sorry for the problem. The cdrom contains all the data to make new boot
    and supplemental floppies for your system. To make new floppies under DOS, Win95,
    or NT (over-writing data on the floppy):


    +   1. Boot DOS and change directory to the CD-ROM #1.

    2. Enter the dosutil directory and run runwrite.


    ```

    cd dosutil

    runwrite.exe

    ```


    +   3. When prompted, for a disk, for the boot image:

    ..\images\boot.img


    +   4. Then change floppies, and run ''rawwrite'' again. When prompted enter:

    ..\images\supp.img


    If you are in Linux or other Unix, you can mount the CD-ROM and use dd to write
    the data to floppy. With Linux, you could do the following:


    ```

    dd if=/mnt/cdrom/images/boot.img of=/dev/fd0 bs=72k

    dd if=/mnt/cdrom/images/supp.img of=/dev/fd0 bs=72k

    ```


    # E.6.4 I have an IDE system, and I am confused by how Linux drives up in comparison
    to DOS. Can you explain this?


    Linux sets up the drive system in a very different pattern than DOS, and this
    can be rather confusing. Instead of calling the first hard drive NT, it will usually
    be a combination of'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# E.6 Installation


    letters signifying what kind of BUS (sd for SCSI, hd for IDE) and on which sequence
    it was detected. Finally a number is tagged onto the end to specify partition
    on the drive is being referenced.


    For IDE hard drives the layout depends on which IDE channel the drive is on and
    whether it is the master or slave on that channel.


    | Channel | Jumper | hdx |

    |---|---|---|

    | ide0 | master | hda |

    | ide0 | slave | hdb |

    | ide1 | master | hdc |

    | ide1 | slave | hdd |

    | ide2 | master | hde |

    | ide2 | slave | hdf |

    | ide3 | master | hdg |

    | ide3 | slave | hdh |


    ```

    ide0 = primary

    ide1 = secondary

    ide2 = tertiary

    ide3 = quaternary

    ```


    The partition number follows an old PC standard that there are a limit of 4 primary
    partitions per hard drive, but one of those partitions can be designated as an
    extended partition. Inside of this extended partition, logical partitions can
    be specified (for most drives you can have 12 logical drives in the extended partition
    for 16 partitions all together).


    The numbering scheme is broken into the following:


    +   - 1-4 primary partitions

    - 5-16 logical partitions


    # E.6.5 My cdu31a/33a cdrom is not recognized. What can I do?


    It has been found that the options for a cdu31a need some tweaking in the install.
    Instead of auto probing for the cdrom, select "specify options". A screen like
    the following should appear.'
