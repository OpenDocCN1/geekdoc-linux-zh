    ```


    means, “shut the system down starting fifteen minutes from now, and reboot after
    the shutdown has completed”. While shutdown has more options available, we’ve
    only described the basics necessary to perform a clean shutdown. If you’re interested
    in learning more, enter man shutdown to learn more about shutdown’s capabilities.


    # 6.3 The X Window System


    While there are people who will use the character-cell interface present when
    you first log in, many people prefer a graphically-oriented user interface. For
    Linux systems, the graphical interface of choice is the X Window System.


    In order to run X, you need to have the necessary packages installed. If you select
    the “X Window System” component to be installed when you originally installed
    Red Hat Linux, everything should be ready to go. In that case, please refer to
    section 6.3.2 on page 89.


    # 6.3.1 If You Haven''t installed X


    If you didn’t select the “X Window System” component when you installed Red Hat
    Linux, your Red Hat Linux system won’t have the necessary software installed.
    While it is possible to manually install the required packages, you’ll probably
    it easier to re-do the installation, particularly if you’re new to Linux.


    However, if you’d like to try, the Red Hat FAQ, Section E.8.1 on page 256 discuss
    the packages required to manually install X.


    # XFree86 Configuration


    There are three methods for configuring XFree86 on your machine:


    +   * Xconfigurator

    * xf86config'
