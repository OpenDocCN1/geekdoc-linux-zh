    in this box is a list of services with a check box. Scroll through this list,
    and check every service that you would like automatically started every time your
    Red Hat system boots. If you''re not sure what a particular service is, move the
    highlight to it and press F1. You''ll get a brief description of the service.


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_90_0.png)


    Note that you can run /usr/sbin/ntsysv /sbin/chkconfig after the installation
    to change which services automatically start on reboot.


    # 5.6 Configuring a Printer


    After you have set up networking, the installation program asks whether you would
    like to configure a printer. If you choose Yes, a dialog box will ask you to indicate
    how the printer is connected to your computer (see Figure 5.4 on the next page).


    Here is a brief description of the three types of printer connections available:


    Local – This printer is directly connected to your computer.


    Remote lpd – This printer is connected to your local area network (either through
    computer, or directly), and is capable of communicating via lpr/lpd.'
