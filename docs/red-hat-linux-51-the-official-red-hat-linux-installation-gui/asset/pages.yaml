    Hat Linux CD-ROM or a mirror image of Red Hat Linux. Does not require a supplemental
    diskette. Please refer to Section 3.4.2 on page 36 to select the NFS installation
    method.


    **Hard Drive** – If you copied the Red Hat Linux files to a local hard drive.
    Requires a supplemental diskette. Please refer to Section 3.4.6 on page 39 to
    select the hard drive installation method.'
