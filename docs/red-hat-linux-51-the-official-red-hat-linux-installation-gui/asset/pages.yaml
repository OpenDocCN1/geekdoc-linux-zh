- pgno: 30
  md: '# 2


    # Before You Begin


    While installing Red Hat Linux is a straightforward process, taking some time
    prior to starting the installation can make things go much more smoothly. In this
    chapter, we''ll discuss the steps that should be performed before you start the
    installation.


    **Please Note:** If you are currently running a version 2.0 (or greater) Red Hat
    Linux system, you can perform an upgrade. Skim this chapter to review the basic
    issues relating to installation, and read the following chapters in order, following
    the directions as you go. The upgrade procedure starts identically to the installation
    procedure; you will be directed to choose an installation or upgrade after booting
    the installation program and answering a few questions.


    There are five things you should do prior to installing Red Hat Linux:


    +   1. Make sure you have sufficient documentation to effectively use your Red
    Hat Linux system after the installation.


    +   2. Make sure you have access to the Red Hat Linux components required for
    installation.


    +   3. Make sure you know your computer''s hardware configuration and networking
    information.


    +   4. Decide, based on the first two tasks, what method will you use to install
    Red Hat Linux.


    +   5. Determine where on your hard drive(s) Red Hat Linux will reside.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'Let''s start making sure you have the documentation you''ll need after you
    install Red Hat Linux.


    # 2.1 Getting Documentation


    Red Hat Linux is a powerful, full-featured operating system. Unless you''re a
    Linux wizard, you''re going to need documentation to make the most of your Red
    Hat Linux system. Everyone should review Chapter 7 on page 97 for more information
    on available Linux documentation. While many people find the resources described
    in chapter 7 to be very helpful, people who are just starting to use Linux will
    likely need additional information. The information that will be most helpful
    to you depends on your level of Linux expertise:


    New To – If this is your first time using Linux (or any Linux-like operating system,
    for that matter), you''ll need solid information on Basic Unix concepts. For example,
    O''Reilly and Associates (http://www.ora.com/) produce a wide variety of Linux
    and Unix-related books. Give them more general titles a try.


    Some Linux Experience – If you''ve used other Linux distributions (or a Linux-like
    operating system), you''ll probably find what you''re looking for in some of the
    more in-depth reference material available. Red Hat Software''s Linux Undercover
    and Linux Complete Command Reference are great for overall documentation, while
    O''Reilly''s more specialized titles are valuable when you need a lot of information
    on a particular subject.


    Old Timer – If you''re a long-time Red Hat Linux user, you probably don''t need
    us telling you what documentation to read. Thanks for reading this far!


    We also discuss the issue of additional documentation in Chapter 6 on page 79.


    # 2.2 Getting the Right Hat Linux Components


    If you''ve purchased the Red Hat Linux boxed set, you''re ready to go! However,
    mistakes occasionally happen, so now is a good time to double-check the contents
    of your boxed set. If you haven''t purchased a Red Hat Linux boxed set, skip to
    Section 2.2.3 on page 10.


    # 2.2.1 Contents of the Red Hat Linux Boxed Set


    The Red Hat Linux boxed set contains the following items:


    +   - The Red Hat Linux Installation Guide.'
