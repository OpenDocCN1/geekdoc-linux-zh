    # ## 11.1.2 Standard Groups


    11.1.2 lists the standard groups as set up by the installation process (this is
    essentially the /etc/group file).


    # ## 11.1.3 User Private Groups


    Red Hat Linux uses a private group (UPG) scheme, which makes UNIX groups much
    easier to use. The UPG scheme does not add or change anything in the UNIX way
    of handling groups. It simply offers a new convention for handling groups. Whenever
    you create a new user, by default, he or she has a unique group. The scheme works
    as follows:


    **User Private Group** each user has its own primary group, which is only a member.


    ```

    umask = 002 The traditional UNIX umask is 022, which prevents other users and
    other members of a user''s primary group from modifying a user''s files. Since
    every user has their own private group in the UPG scheme, this ''group protection''
    is not needed. A umask of 002 will prevent users from modifying other users''
    private files. The umask is set in /etc/profile.

    ```'
  merge: -1
