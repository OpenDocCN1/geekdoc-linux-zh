    This section contains packages that turn your Red Hat Linux system into a high-quality
    typesetworking workstation. (In fact, the printed version of this document is
    produced using many of these tools!)


    groff - (Version 1.11a, 2957K) The groff text formatting system can be used to
    create professional looking documents on both paper and a computer screen. All
    the man pages are processed with groff, so you will need this package to read
    man pages.


    groff-gxditview - (Version 1.11a, 71K) The package contains the gxditview program,
    which can be used to format and view groff documents in X Windows. For example,
    man pages can be read using gxditview.


    lout - (Version 3.08, 3429K) The Lout system reads a high-level description of
    a document similar in style to LaTeX and produces a PostScript file which can
    be printed on many laser printers and graphical display devices. Plain text output
    is also available.


    Lout offers an unprecedented range of advanced features, including optimal paragraph
    and page breaking, automatic hyphenation, PostScript EPS file inclusion and generation,
    equation tables, diagrams, rotation and scaling, sorted indexes, bibliographic
    databases, running headers and odd-even pages, automatic referencing, multilingual
    documents including (most European languages are supported, including Russian),
    formatting of C/C++ programs, and much more, all ready to use. Furthermore, Lout
    is easily extended with definitions which are much easier to write than of TeX
    macros because Lout is a high-level language, the outcome of an eight-year research
    project that went back to the beginning.


    lout-doc - (Version 3.08, 2069K) This package includes the complete Lout documentation,
