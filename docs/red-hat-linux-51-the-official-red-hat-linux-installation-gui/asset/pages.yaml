  md: 'First, you''ll need to enter the SMB server name. It''s important to note that
    the name expected here is the server''s Microsoft Networking name, and not a fully
    qualified domain name.


    Next, enter the name of the shared volume. Since different implementations of
    the SMB protocol handle share names differently, you might find the case of the
    share name is important. In most cases (no pun intended) entering the share name
    in lower cases seems to work best.


    Next, enter the account name and password. In general, the account name should
    be guest. A password (which is case-sensitive) must be present. If the share is
    made without a password, it will most likely not work.


    After entering the required information, select Ok, and press Space. If everything
    is properly, there will be a slight delay as the list of available packages is
    read by the installation program. Skip ahead to Section 4.8 on the next page to
    continue the installation.


