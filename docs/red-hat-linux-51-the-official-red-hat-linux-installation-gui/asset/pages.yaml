    keyboard type after you booted your Red Hat Linux system, you may use the /usr/sbin/kbdconfig
    command.


    # 3.3.3 PCMCIA Support


    Next, the installation program will probe your system to determine if your system
    requires PCMIA (also known as PC Card) support. If a PCMIA controller is found,
    you will be asked if you require PCMIA support during the installation. If you
    will be using a PCMIA device during the installation (for example, you have a
    PCMIA ethernet card and you''ll be installing via NFS, or you have a PCMIA SCSI
    card and will be installing from a SCSI CD), you can select Yes.


    **Please Note:** This question applies only to PCMIA support during the actual
    installation. The installed Red Hat Linux system will still support PCMIA, even
    if you say No here (assuming you installed the pcmcia-cs package).


    If you require PCMIA support, you will be asked to insert the supplemental diskette
    - Select OK when you''ve done so.'
