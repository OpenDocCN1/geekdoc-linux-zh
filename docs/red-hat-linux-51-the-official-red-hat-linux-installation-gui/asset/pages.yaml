  md: '# 4.1.2 Upgrading


    The installation process for Red Hat Linux 5.1 includes the ability to upgrade
    from prior versions of Red Hat Linux (version 2.0 and later) which are based on
    RPM technology. Upgrading your system installs the modular 2.0.x kernel as well
    as updated versions of the packages which are currently installed on your machine.
    The upgrade process preserves existing configuration files by renaming them a
    .rpmsave extension (e.g., sendmail.cf.rpmsave) and leaves a log telling what actions
    it took in /tmp/upgrade.log. As software, configuration formats can change, so
    you should carefully compare your original configuration files to the new files
    before integrating your changes.


    If you wish to upgrade your Red Hat Linux system, choose Upgrade.


    # 4.2 SCSI Support


    If you choose to perform an upgrade or a full install, the installation program
    will probe your system for SCSI adapters. In some cases, the installation program
    will ask whether you have any SCSI adapters. If you choose Yes, the following
