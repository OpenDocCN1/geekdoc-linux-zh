- pgno: 40
  md: '# 2.4 Installation Methods


    # 2.4.3 Installing From an FTP Site


    If you don''t have a Red Hat CD-ROM or a CD-ROM drive, but you do have network
    access, then an FTP installation may be for you. When installing via FTP, the
    Red Hat Linux packages you select are downloaded (using FTP) across the network
    to your computer, and are installed on your hard drive.


    # How To Do It


    When doing an FTP install, you''ll need LAN-based access to a network; a dialup
    connection modem won''t cut it. If your Local Area Network has Internet access,
    you can use one of the many FTP sites that mirror Red Hat Linux. You can find
    a list of mirror sites at http://ftp.redhat.pub/MIRrors.


    If your LAN doesn''t have Internet access, is all lost. If there is a computer
    on your LAN that can accept any FTP requests, simply put a copy of the Red Hat
    Linux distribution on that system, and you''re ready to go.


    Please Note: Your FTP server must be able to handle filenames.


    For an FTP installation, you must use both the boot and supplemental diskettes.
    You will need to have a valid nameserver configured or you must specify the IP
    address of the FTP server you will be using. You will also need the path to the
    Red Hat Linux directory on the FTP server.


    If you''ve determined that this installation method is most applicable to your
    situation, please skip ahead to Section 2.5 on page 19.


    # 2.4.4 Installing From an NFS Server


    If your system doesn''t have a CD-ROM drive, but you do have network access, then
    an NFS installation may be for you. When installing via NFS, the Red Hat Linux
    packages you select are NFS-served to your computer from an NFS server system.
    The packages are then installed on your hard drive.


    # How To Do It


    If you wish to perform an NFS installation, you will need to mount the Red Hat
    Linux CD-ROM on a machine that supports ISO-9660 file systems with Rock Ridge
    extensions. The machine must also support NFS. Export the CD-ROM file system via
    NFS. You will need to have a nameserver configured, or know the NFS server''s
    IP address, as well as the path to the exported CD-ROM.


    Please Note: Your NFS server must be able to handle filenames.


    For an NFS installation, you''ll need a boot diskette.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 18


    # Before You Begin


    If you''ve determined that this installation method is most applicable to your
    situation, skip ahead to Section 2.5 on the facing page.


    # 2.4.5 Installing From an SMB Shared Volume


    If your system doesn''t have a CD-ROM drive, but you do have network access, then
    installing Red Hat Linux using an SMB shared volume may be for you. When performing
    an SMB installation, your computer accesses the Red Hat Linux packages using a
    DOS-style network drive. The packages you select are then installed on your hard
    drive.


    # How To Do It


    If you wish to install an SMB shared volume, you will need to mount the Red Hat
    Linux CD-ROM on a Microsoft Windows NT or Windows 95 server that supports shared
    volumes. You will need to have nameservices configured; you will also need the
    name of the shared volume containing the Red Hat Linux CD-ROM and the account
    and password information required to access the volume.


    For an SMB installation, you''ll need boot and supplemental diskettes.


    If you''ve determined that this installation method is most applicable to your
    situation, skip ahead to Section 2.5 on the next page.


    # 2.4.6 Installing From a Hard Drive


    If none of the other installation methods will work for you, but you have means
    of getting the Red Hat Linux package files written to your system''s hard drive,
    you can install from your hard drive. In this installation method, the Red Hat
    Linux packages you select are read from one partition on a hard drive, and are
    installed on another partition (or set of partitions).


    # How To Do It


    The hard drive installation method requires a bit of up-front effort on your part,
    but you must copy all the necessary files to a partition before starting the Red
    Hat Linux installation program. You must first create a RedHat directory at the
    top level of your directory tree. Everything you will install should be placed
    in that directory. First copy the base subdirectories and its contents.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 2.5 Need a Supplemental Diskette?


    Next, copy the packages you want to install another subdirectory called RPMS.
    You can use available space on an existing DOS partition or a Linux partition
    that is not required in the install procedure (for example, a partition that would
    be used for data storage on the installed system).


    If you are using a DOS filesystem, you will not be able to use the full Linux
    filenames for the RPM packages. The installation process does not care what the
    filenames look like, but it is a good idea that you keep track of them.


    You''ll need a boot and supplemental diskette when installing from a hard drive.


    # 2.5 Need a Supplemental Diskette?


    This section is specific to Intel-based computers only. If you are using an Alpha
    or SPARC computer, please skip ahead to 2.6.


    Here''s a checklist that you can use to see if you''ll need to create a supplemental
    diskette:


    +   * Installing From a PCMCIA-Connected CD-ROM - If you''ll be installing Red
    Hat Linux from a CD-ROM, and your CD-ROM drive is attached to your computer through
    a PCMCIA card, you''ll need a supplemental diskette.


    +   * Installing using a PCMCIA Network Card - If you will be using a PCMCIA network
    adapter during the installation, you''ll need a supplemental diskette.


    +   * FTP Install - If you want to install Red Hat Linux via FTP, you''ll need
    a supplemental diskette.


    +   * Hard Drive Install - If you''ll be performing an install from a hard drive,
    you''ll need a supplemental diskette.


    +   * SMB Install - If you want to install from an SMB shared drive, you''ll need
    a supplemental diskette.


    If you''ve determined you''ll need a supplemental diskette, you''ll have to make
    one. The supplemental diskette image file is supp..img, and is located in the
    images directory on your Red Hat Linux/Intel CD. Please turn to Appendix B on
    page 177 and follow the instructions there. Then, return here, and read on.


    # 2.6 Disk Partitions


    In order to install Red Hat Linux, you must make disk space available for it.
    This disk space needs to be separate from the disk space used by other operating
    systems you may have installed on your computer, such as Windows, OS/2, or even
    a different version of Linux.'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'We will discuss divided into different partitions. Each partition can be accessed
    as if it was a separate disk. Furthermore, each partition has a type that is used
    to indicate how information is stored in the partition. For example, there are
    different partition types used by DOS, OS/2, and Linux.


    **Please Note:** You must install Red Hat Linux to one or more partitions having
    a partition type of "Linux native". Red Hat Linux also requires a *swap* partition,
    which has a partition type of "Linux swap". This means that an installation of
    Red Hat Linux requires at least two partitions:


    +   - One or partitions of type "Linux native"

    - A partition of type "Linux swap”


    We will discuss partitioning in more detail below. For now, keep in mind that
    Red Hat Linux requires at least two dedicated partitions, and that you *cannot
    install Red Hat Linux to a DOS/Windows partition!


    Even if you are installing Red Hat Linux on its own hard disk, or on a computer
    which contains no other operating system, you''ll still need to create partitions
    for Red Hat Linux to use. In this case it''s pretty easy, as there are no other
    partitions on the hard disk to worry about.


    On the other hand, you may install Red Hat Linux on a disk which already contains
    software or data from a different operating system. This means get a little trickier
    in this situation, since a mistake can destroy your existing partitions, not to
    mention the data they contain!


    During the installation process, you will be given the chance to create partitions
    for Red Hat Linux. At this point, your main concern is making sure you have sufficient
    disk space available to create those partitions. Let''s review the different ways
    to free up space for Red Hat Linux partitions.


    # 2.6.1 Partitioning Naming Scheme


    Linux refers to disk partitions using a combination of letters and numbers which
    may be confusing, particularly if you''re used to the "C drive" way of referring
    to hard disks and their partitions. Red Hat Linux uses a naming scheme that is
    more flexible and conveys more information than the approach used by other operating
    systems. Here is a summary:


    **First Two Letters** - The first two letters of the partition name indicate the
    type of device on which the partition resides. You''ll normally see hd (for IDE
    disks), or sd (for SCSI disks).


    **The Next Letter** - This letter indicates which device the partition is on.
    For example, /dev/hda (the first IDE hard disk) or /dev/sdb (the second SCSI disk).


    **The number** denotes the partition. The first four (primary or extended) partitions
    are numbered 1 through 4. Logical partitions start at 5. E.g., /dev/hda3 is the
    third primary or extended partition on the first IDE hard disk; /dev/sdb6 is the
    second logical partition on the second SCSI hard disk.'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 2.6 Disk Partitions


    Keep this information in mind; it will make things easier to understand when you’re
    setting up the partitions Red Hat Linux requires.


    # 2.6.2 Repartitioning Strategies


    There are three possible scenarios you may face when attempting to partition your
    hard disk:


    +   - Unpartitioned free space is available.

    - An unused partition is available.

    - Free space in an actively used partition is available.


    Let’s look at each scenario in order.


    # Using Unpartitioned Free Space


    In this situation, the partitions already defined not span the entire hard disk,
    leaving unallocated space that is not part of any defined partition. If you think
    about it, an unused hard disk also falls into this category; the only difference
    is that all the space is not part of any defined partition.


    In this case, you can simply create the necessary partitions from the unused partition.


    # Using Space From An Unused Partition


    Last year you replaced that 105MB hard drive on your Windows system with a 1.2GB
    monster. You partitioned it into two equal parts, figuring that you’d use the
    C: “drive” (really the drive’s first partition) for Windows, and the D: “drive”
    (really the second partition) for your collection of freeware programs downloaded
    from the Internet. Well, you’d be so used to using C: you never put anything of
    substance on D:


    If you find yourself in this situation, you can use the space allocated to the
    unpartitioned partition. In this case, you’ll first need to delete the partition,
    and then create the appropriate Linux partitions in its place.


    # Using Free Space From An Active Partition


    This is the most common situation. It is also, unfortunately, the hardest to deal
    with. The main problem is that you have enough free space, but it’s presently
    allocated to a partition that is in use. If you purchased a computer with pre-installed
    software, the hard disk most likely has one massive partition holding the operating
    system and data.'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# Before You Begin


    Aside from adding a new hard drive to your system, you have two choices:


    **Destructive Repartitioning** - Basically, you delete the single large partition,
    and create several smaller ones. As you might imagine, any data you had in that
    partition is destroyed. This means that making a complete backup is necessary.
    For your own sake, make two backups, use verification (if available in your backup
    software), and try to read data from your backup before delete the partition.
    Note also that if there was an operating system of some type installed on that
    partition, it will need to be reinstalled as well.


    After creating a smaller partition for your existing software, you can reinstall
    any software, restore your data, and continue with your Red Linux installation.


    **Non-Destructive Repartitioning** - Here, you run a program that does seemingly
    impossible, without losing any of the files stored in that partition. Many people
    have found this method to be reliable and trouble-free. What software should you
    use to perform this feat? There are several disk management software products
    on the market; you''ll have to do some to find the one that is best for your situation.


    As a convenience to our customers, we provide the fips utility. This is a freely
    available program that can resize FAT (File Allocation Table) partitions. It''s
    included on the Red Linux/Intel CD-ROM in the desutils directory.


    Please Note: Many people have used fips to repartition their hard drives. However,
    because of the nature of the operations carried out by fips, and the wide variety
    of hardware and software configurations under which it must run, Red Hot Software
    cannot guarantee that fips will work properly on your system. Therefore, no installation
    whatever is available for fips; use it at your own risk.


    That, if you decide to repartition your hard drive with fips, it is vital that
    you do two things:


    +   * Perform a Backup - Make two copies of all the important data on your computer.
    These copies should be to removable media (such as tape or diskettes), and you
    should make sure they are readable before proceeding.


    +   * Read the Documentation - Completely read the fips documentation, located
    in the /desutils/fipsdocs subdirectory on Red Hat Linux/Intel CD 1.


    # 2.6 Disk Partitions and Other Operating Systems


    If your Red Hat Linux partitions will be sharing a hard disk with partitions used
    by other operating systems, most of the time you''ll have no problems. However,
    there are certain combinations of Linux and other operating systems that require
    extra care. Information on creating disk partitions compatible with other operating
    systems is available in several HOWTOs and Mini-HOWTOs, available on the Red Hat
    CD in the doc/HOWTO and doc/HOWTO/mini directories. In particular, the Mini-HOWTOs
    whose names start with Linux+ are quite helpful.'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 2.6 Disk Partitions


    If Red Hat Linux/Intel will coexist on your machine with OS/2, you must create
    your disk partitions with the OS/2 partitioning software—otherwise, OS/2 may not
    recognize the disk partitions. During the installation, do not create any new
    partitions, but do set the proper partition types for your partitions using the
    Linux fdisk.


    # 2.6.4 One Last Wrinkle: Using LILO


    LILO (the Linux Loader) is the most common method used to boot Red Hat Linux on
    Intel-based systems. Using an operating system loader, LILO operates “outside”
    of any operating system, using only the Basic I/O System (or BIOS) built into
    the computer hardware itself. This section describes LILO''s interactions with
    PC BIOSes, and is specific to Intel-compatible computers.


    # BIOS-Related Limitations Impacting LILO


    LILO is subject to some limitations imposed by the BIOS in most Intel-based computers.
    Specifically, most BIOS cannot access more than two hard drives and they can''t
    access any data beyond cylinder 1024 (the 1024th cylinder) of any drive. Note
    that some recent BIOSes do not have these limitations, but this is by no means
    universal.


    All the data LILO needs to access at boot time (the Linux kernel) are located
    in the /boot directory, which is normally part of the root partition (known as).
    Here are the guidelines you follow if you are going to use LILO to boot your Red
    Hat system:


    On First Two IDE Drives - If you have 2 IDE (or EIDE) drives, /boot must be located
    on one of them. Note that this two-drive limit also includes any IDE CD-ROM drives
    on your primary IDE controller. So, if you have one hard drive, and one IDE CD-ROM
    on your primary controller, /boot must be located on the first hard drive, even
    if you have other drives on your secondary IDE controller.


    On First IDE Or SCSI Drives - If you have one IDE (or EIDE) drive and one or more
    SCSI drives, /boot must be located on the IDE drive or the SCSI drive at ID 0.
    No other SCSI IDs will work.


    On Two SCSI Drives - If you have only SCSI hard drives, /boot must be located
    on a drive at ID 0 or ID 1. No other SCSI IDs will work.


    Partition Completely Below Cylinder 1023 - No matter which of the above configurations
    apply, the partition holding /boot must be located entirely below cylinder 1023.
    If the partition holding /boot straddles cylinder 1023, you may face a situation
    where LILO will initially (because all the necessary information is below cylinder
    1023), but will fail if a new kernel is to be loaded, and kernel resides over
    cylinder 1023.


    As mentioned earlier, it is possible that some of the newer BIOSes may permit
    LILO to work with configurations that don''t meet our guidelines. Likewise, some
    of LILO''s esoteric'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 24


    # Before You Begin


    features may be used to get a Linux system started, even if the configuration
