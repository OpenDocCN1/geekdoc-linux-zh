- pgno: 192
  md: '# Getting Technical Support


    This chapter discusses Red Hat Software’s support:


    +   * What it is

    * How to get it

    * Frequently asked questions


    # A.1 An Overview of Our Support Policy


    Red Hat Software provides 90-day installation support for people that have purchased
    the Official Red Hat Linux product.


    Red Hat will support registered purchasers of the Red Hat Linuxed Set. This support
    will be provided by means of electronic mail. In the case the user doesn’t have
    access to e-mail, fax support will be provided for these requests submitted with
    complete registration numbers.


    In order to receive support it is necessary to register the product via the World
    Wide Web at http://www.redhat.com/support/register or by sending mail including
    the registration number to register@redhat.com.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# Getting Technical Support


    After registering successfully, support may be obtained by sending a specially
    formatted message to support@redhat.com. The message format is described in the
    support HOW-TO, located at:


    ```

    http://www.redhat.com/support/register/support-how2.html

    ```


    This e-mail will be delivered to Red Hat Software support where it will be distributed
    to a Red Hat Support Engineer.


    As the name implies, installation support centers on helping you successfully
    install Red Hat Linux on your computer. This includes support in three distinct
    areas:


    +   - Answering questions you may have prior to installation, such as:

    - Hardware compatibility issues.

    - Basic approaches to partitioning your hard drive.


    +   - Helping you get through the installation process:

    - Getting any supported hardware necessary for installation recognized by the
    installation program.

    (See http://www.redhat.com/hardware/)

    - Assisting with the creation of a root and swap partition using the free space
    available on your hard drive.

    - Using the installation program to configure LILO to boot Red Hat Linux, and
    one other operating system (such as DOS, Windows 95, or Windows NT) already residing
    on your hard drive.


    +   - Assisting with final configuration tasks, such as:


    +   - The successful configuration of the X window system on supported hardware,
    using either the Metro-X or XFree6 software. (Additional configuration, such as
    automatically starting X on reboot, or changing/customizing window managers is
    your responsibility.)

    - Configuring a printer connected directly to the Red Hat Linux system, enabling
    it to print text.

    - Setting up a mouse to be used with the text-based console, and with the X window
    system.

    - Getting access to the CD-ROM, so that information can be read from it.


    Naturally, although our installation support service will get your system running
    Red Hat Linux, there are many other optimal tasks that you might want to undertake,
    such as compiling a customized kernel, adding support for devices not included
    in the installation process, and so on.


    For assistance with these tasks, please consider the many books on Linux at your
    local bookstore, or various on-line resources. A starting point in your on-line
    search for Linux information should always be:'
  merge: -1
  img_proc: true
