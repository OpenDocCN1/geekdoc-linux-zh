- pgno: 167
  md: '# System Administration


    SGID on Directories If you set the SGID on a directory (with chmod g+s directory),
    files created in that directory will have their group set to the directory''s
    group.


    Most computing sites like to create a group for each major project and assign
    people to the groups they need to be in. Managing files traditionally has been
    difficult, though when someone creates a file it is owned by the primary group
    he or belongs to. When a single person works on multiple projects, it becomes
    hard to make the files owned by the group that is associated with that project.
    In the UPG scheme, groups are automatically assigned to files on a project-by-project
    basis, which makes managing groups projects simple.


    Let''s say you have a big project devel, with many people editing the files in
    a devel directory. Make a group called devel, churn the devel to devel, and add
    all the devel users to the devel group. Now, all the users will be able to edit
    the devel files and create new files in the devel directory, and these files will
    always retain their devel group. Thus, they will always be editable by other devel.


    If you have projects like devel, and users are working on multiple projects, these
    users will never have to change their umask or group when they move from project
    to project. The SGID on each user''s main directory "selects" the proper group.


    Since each user''s HOME directory is owned by the user and their private group,
    it is safe to set the SGID on the HOME directory. However, by default, files are
    created with the primary group of the user, so the SGID bit be redundant.


    # User Private Group Rationale


    Since the UPG scheme is new, many people have questions about it, and they wonder
    why it is necessary. The following is the rationale for the scheme.


    +   - You''d like to have a group of people work on a set of files in say, /usr/lib/emacs/site-lisp
    directory. You trust a few people to mess around in there, but certainly not everyone.


    ```

    chown -R root.emacs /usr/lib/emacs/site-lisp

    ```


    and you add the proper users to the group.


    +   - To allow the users to actually create files in the directory you enter:

    chmod 775 /usr/lib/emacs/site-lisp


    +   - But when a user creates a new file it is assigned the group of the users
    default group (usually users). To prevent this you enter


    ```

    chmod 2775 /usr/lib/emacs/site-lisp

    ```'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# 11.2 User Authentication with PAM


    which causes everything in the directory to be created with the “emacs” group.


    +   - But the new file needs to be mode 664 for another user in the emacs group
    to be able tonedit it. By this you make the default umask 002.


    +   - Well, this all works fine, except that if your group is “users”, every file
    you create in your home directory will be writable by everybody in “users” (usually
    everyone).


    +   - To fix this, you make each user have a “private group” as their default
    group.


    At this point, by making the default umask 002 and giving everyone a private group,
    you can easily set up groups that users can take advantage without doing any magic.
    Just create the group, add the users, and do the above chown and chmod on the
    group’s directories.


    # 11.2 User Authentication with PAM


    Programs which give users access to any sort need to be able to authenticate the
    users. When you log into a system, you provide your name and password, and the
    login process uses those to authenticate the login—to verify that you are who
    you say are. Other forms of authentication than passwords are possible, and it
    is possible for the passwords to be stored in different ways.


    PAM, which stands for “Pluggable Authentication Modules”, is a way of allowing
    the system administrator to set authentication policy without recompiling programs
    which do authentication. With PAM, you control how the modules are plugged into
    the programs by editing a configuration file.


    Most Red Hat Linux users will never need to touch this configuration file. When
    you use RPM to install programs that need password authentication, they automatically
    make the changes that are needed to do normal password authentication. However,
    you may want to customize your configuration, in which case you need to understand
    the configuration file.


    # 11.2.1 PAM Modules


    There are four types of modules defined by the PAM standard. auth modules provide
    the actual authentication, perhaps asking for and checking a password, and set
    “credentials” such as group membership or kerberos “tickets”. account modules
    make sure that the authentication is allowed (the account has not expired, the
    user is allowed to log in at time of day, etc.). password modules are used to
    set passwords. session modules are used once a user has been authenticated to
    make it possible for them to use their account, perhaps mounting the user’s home
    directory or making their mailbox.


    These modules may be stacked, so that multiple modules are used. For instance,
    rlogin normally makes use of at least two authentication methods: if “hosts” authentication
    succeeds, it is sufficient to the connection; if it fails, then standard password
    authentication is done.'
  merge: -1
  img_proc: true
- pgno: 169
  md: "# System Administration\n\nNew modules can be added at any time, PAM-aware\
    \ applications can be made to use them. For instance, if you have a one-time-password\
    \ calculator system, and you can write a module to support it (documentation on\
    \ writing modules is included with the system), PAM-aware programs can use the\
    \ new module and work with the new one-time-password calculators without being\
    \ recompiled or otherwise modified in any way.\n\n# 11.2.2 Services\n\nEach program\
    \ uses PAM defines its own \"service\" name. The login program defines the service\
    \ type login, fpdpd defines the service type ftp, etc. In general, the service\
    \ type is the name of the program used to access the service, (if there is a difference)\
    \ the program used to provide the service.\n\n# 11.2.3 The Configuration Files\n\
    \nThe directory /etc/pam.d is used to configure all PAM applications. (This is\
    \ used to be /etc/pam.conf in earlier PAM versions; while the pam.conf file is\
    \ still read if no /etc/pam.d/ entry is found, its use is deprecated.) Each application\
    \ (really, each service) has its own file. A file looks like this:\n\n```\n##PAM-1.0\n\
    auth required /lib/security/pam_security.so\nauth required /lib/security/pam_pwdb.so\
    \ shadow nullook\nauth required /lib/security/pam_nlogin.so\naccount required\
    \ /lib/security/pam_pwdb.so\npassword required /lib/security/pam_cracklib.so\n\
    password required /lib/security/pam_pwdb.so shadow\n      nullock use_authtok\n\
    session required /lib/security/pam_pwdb.so\n```\n\nThe first line is a comment.\
    \ Any line that starts with a # character is a comment. The next line stacks up\
    \ three modules to use for login authorization. The first line makes sure that\
    \ the user is trying to log in root, the tty on which they are logging is listed\
    \ in the /etc/securefile if that exists. The second line calls the user to be\
    \ asked for a password and the password checked. The third line checks to see\
    \ if the /etc/nlogin exists, and if it does, displays the contents of the file,\
    \ and if the user is not root, does not let him or her\n\nNote that all three\
    \ modules are checked, even if the first module fails. This is a security decision--is\
    \ designed not to let the user know why their authentication was disallowed, because\
    \ knowing why it was disallowed might allow them to break the authentication more\
    \ easily. You can change this behavior by changing required to requisite; if any\
    \ requisite module returns-failure, PAM fails immediately without calling any\
    \ other modules."
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 11.2 User Authentication with PAM


    The fifth line causes any necessary accounting to be done. For example, if shadow
    passwords have been enabled, the pam_pwdb.so module will check to see if the account
    has expired, or if the user has not changed or her password and the grace period
    for changing the password expired.


    The sixth line (which we''ve had to wrap) specifies that if the login program
    changes the user''s password, it should use the pam_pwdb.so module to do so. (It
    will do so only if an auth module has determined that the password needs to be
    changed—for example, if a shadow password has expired.)


    The final line specifies that the pam_pwdb.so module should be used to manage
    the session. Currently, that module doesn''t anything; it could be replaced (or
    supplemented by stacking) by any necessary module.


    Note that the order of the lines within each file matters. While it doesn''t really
    matter in which order required modules are called, there are other control flags
    available. While optional is rarely used, and never used by default on a Red Hat
    Linux system, sufficient and requisite case order become important.


    Let''s look at the auth configuration for rlogin:


    ```

    auth required      /lib/security/pam_secure.so

    auth sufficient /lib/security/pam_rhosts.auth.so

    auth required      /lib/security/pam_pwdb.so shadow nullock

    auth required      /lib/security/pam_nlogin.so

    ```


    Looks almost like the login entry, but there''s an extra line specifying an extra
    module, and the modules are specified in a different order.


    First, pam_security.so keeps root logins from happening on insecure terminals.
    This effectively disallows all root login attempts. If you wish to allow them
    (in which case we recommend that you either not be internet-connected or behind
    a good firewall), you can simply remove that line.


    Second, pam_nlogin.so checks /etc/nlogin, as specified above.


    Third, if pam_rhosts.auth authenticates the user, PAM immediately returns success
    to login without any password check being done.

    pam_rhosts.auth.so fails to authenticate the user, that failed authentication
    is ignored.


    Finally (if pam_rhosts.auth.so has failed to authenticate the user), the pam_pwdb.so
    module performs normal password authentication.


    Note if you do not want to prompt for a password if the security check fails,
    you can change the pam_secure.so module from required to requisite'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 11.2.4 Shadow Passwords


    pam.pwdb.so module will automatically detect that you are using shadow passwords
    and make all necessary adjustments. Please refer to Section 11.3 for more information
    on the utilities that support shadow passwords.


    # 11.2.5 More Information


    This is just an introduction to PAM. More information is included with the system
    in /usr/doc/pam/, including a System Administrators'' Guide, a Module Writers''
    Manual, an Application Developers'' Manual, and the PAM standard, DCE-RFC 86.0.
    In addition, documentation is available from the Red Hat web site, at http://www.redhat.com/linux-info/pam.


    # 11.3 Shadow Utilities


    Support for shadow passwords has been enhanced significantly for Red Linux 5.1.
    The shadow-utils package contains a number of utilities that support:


    +   - Conversion from normal to shadowed passwords and back (pwconv, pwunconv).


    +   - Verification of the password, group, and associated shadow files (pwck,
    grpck).


    +   - Industry-standard methods of adding, deleting and modifying user accounts
    (useradd, usmod, and userdel).


    +   - Industry-standard methods of adding, deleting, and modifying user groups
    (groupadd, groupmod, and groupdel).


    +   - Industry-standard method of administering the /etc/group file (gpasswd).


    **Please Note:** There are a few additional points of interest concerning these
    utilities:


    +   - The utilities will work properly when shadowing is enabled or have slightly
    modified to support Red Hat Software''s user private group scheme. For a description
    of the modifications, please see the useradd page. For more information on user
    private groups, please turn to Section 11.1.3 on page 142.


    +   - The usermod script has been replaced with a symlink to /usr/sbin/useradd.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 11.4 Building a Custom Kernel


    # 11.4 Building a Custom Kernel


    With the introduction of modularization in the Linux 2.0 kernel there have been
    some significant changes in building customized kernels. In the past you were
    required to compile support into your kernel if you wanted to access a particular
    hardware or filesystem component. For some hardware configurations the size of
    the kernel could quickly reach a critical level. To require ready support for
    items that were only occasionally used an inefficient use of system resources.
    With the capabilities of the 2.0.x kernel, if there are certain hardware components
    or filesystems that are used frequently, driver modules for them can be loaded
    on demand. For information on handling kernel modules see Chapter 9, Section 9.6.


    # 11.4.1 Building a modularized kernel


    These instructions provide you with the knowledge required to take advantage of
    power and flexibility available through kernel modularization. If you do not wish
    to take advantage of modularization, please see Section 11.4.3 for an explanation
    of the different aspects of building and installing a monolithic kernel. It is
    assumed that you have already installed the kernel-headers and kernel-source packages
    and that you issue all commands from /usr/src/linux directory.


    It is important to begin a kernel build with the source tree in a known condition.
    Therefore, it is recommended that you begin with the command make proper. This
    will remove any configuration files along the remains of any previous builds that
    may be scattered across the source tree. Now you must create a configuration file
    that will determine which components to include in your new kernel. Depending
    upon your hardware and personal preferences there are three methods available
    to configure the kernel.


    +   - make config An interactive text program. Programs are presented and you
    answer with Y (yes), N (no), or M (module).


    +   - makeconfig A graphic, menu driven program. Components are presented in a
    menu of categories, you select the desired components in the same manner used
    in the Red Hat Linux installation program. Toggle the tag corresponding to the
    item you want included; Y (yes), N (no), or M (module).


    +   - xconfig A Windows program. Programs are listed in different levels of menus,
    components are selected using a mouse. Again, select Y (yes), N (no), or M (module).


    Please Note: In order to use kernel(see Section 9.6 for details) and kernel modules
    you must answer Yes to kernel support and module version (CONFIG_MODVERSIONS)
    support in the configuration.


    Please Note: If you are building a Linux/Intel kernel on (or for) a machine that
    uses a ''clone'' processor (for example, one made by Cyrix or AMD), it is recommended
    to choose a Processor type of 386.'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'If you wish to build a kernel with a configuration file (/usr/src/linux/.config)
    that you have already created with one of the above methods, you can omit the
    make proper and make config commands and use the command make followed by make
    clean to prepare the source tree for the build.


    The next step consists of the actual compilation of the source code components
    into a working program that your machine can use to. The method described here
    is the easiest to recover from the event of a mishap. If you are interested in
    other possibly details that can be found in the Kernel-HOWTO or in the Makefile.in
    /usr/src/linux on your Linux system.


    +   - Build the kernel with make boot.

    - Build any modules you configured with make modules.

    - Move the old set of modules out of your way with:


    ```

    rm -rf /lib/modules/2.0.29-old

    mv /lib/modules/2.0.29 /lib/modules/2.0.29-old

    ```


    Of course, if you have upgraded your kernel, replace 2.0.29 with the version you
    are using.


    +   - Install the new modules (even if you didn''t build any) with

    make modules.install.


    If you have a SCSI adapter and manage your SCSI driver module, build a new initrd
    image (see Section 11.4.2; note that there are few reasons to make the SCSI driver
    modular in a custom kernel).


    In order to provide a redundant boot source to protect from a possible error in
    a new kernel you should keep the original kernel available. Adding a kernel to
    the LILO menu is as simple as renaming the original kernel in /boot, copying the
    new kernel to /boot, adding a few lines in /etc/lilo.conf and running /sbin/lilo.
    /etc/lilo.conf file shipped with Red Hat Linux: Here is an example of the default


    ```

    boot=/dev/hda

    map=/boot/map

    install=/boot/boot.b

    prompt

    timeout=100

    image=/boot/vmlinuz

    label=linux

    root=/dev/hdal

    read-only

    ```


    Now you must update /etc/lilo.conf. If you built a new initrd image you must tell
    LILO to use it. In this example of /etc/lilo.conf we have added four lines at
    the bottom of the file'
