  md: '# 11.9 The Boot Process, Init, and Shutdown


    /etc/sysconfig/tape - The /etc/sysconfig/tape file is used to specify tape-related
    configuration information. The following values are used:


    +   - DEV=devnam, where devnam is the tape device (for example, "/dev/nst0").
    Use the non-rewinding device for these scripts.

    - For SCSI tapes is "/dev/nst#", where "#" is the number of the tape drive you
    want to use. If you have only one, then "/dev/nst0".

    - For IDE types use "/dev/ht#", where "#" is the number of the tape drive you
    want to use. If you have only one, then "/dev/ht0".

    - For floppy drives use "/dev/ftpe".

    - ADMIN=account, where account is the user account to send mail if the backup
    fails for any reason. Normally set it to "root".

    - SLEEP=time, where time is the time to sleep between tape operations. Some drives
    need a bit more than others, but "5" seems to work for 8mm, 4mm, and DLT.

    - BLOCKSIZE=size, where size is the tape drive''s optimal block size. A value
    of "32768" worked for 8mm, then 4mm, and now DLT. An optimal setting is possibly
    however much data your drive writes at time.


    +   - SHORTDATE=date, where date is a string that evaluates to a short date string,
    to be used in backup log filenames. The default setting is: "$ (date +%y:%m:%d:%H:%M)"

    - DAY=date, where date is a string that evaluates to a date string, to be used
    for the log file directory. The default setting is: "$ (date +log-%y:%m:%d)"

    - DATE=date, where date is a string that evaluates to a regraul string, to be
    used in log files. The default setting is: "$ (date)"

    - LOGROUT=path, where path is the root of the logging directory.

    - LIST=file, where file is the name of the incremental backup will use to store
    the incremental list. It will be followed by a sequence number.

    - DOTCOUNT=count, where count is the name of a file used for counting as you go,
    to know incremental list to use.

    - COUNTER=count-file, where count-file is used for rewinding when done (might
