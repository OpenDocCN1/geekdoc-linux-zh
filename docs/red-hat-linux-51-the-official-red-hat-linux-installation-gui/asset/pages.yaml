    # E.8.4 How do I customize the X window manager?


    To customize any of the default window manager settings, add or remove programs
    from the menus,or change which programs start up automatically, you will need
    to change the files in `/etc/X11/AnotherLevel`. Please see the man page for xinit,
    startx, AnotherLevel, fwm2, Fwm4, wmconfig for more details.


    # E.8.5 I don''t like the Windows 95 like configuration, how can I change it?


    If you really don''t like the look or feel of the default window manager setup,
    you can select a different style from the Preferences menu, and then clicking
    on WM Style menu.


    If you are interested in changing to other window managers, you will want to check
    out this web page:


    /urlhttp://www.plig.org/xminman/


    # E.8.6 I get an error about errno=111. What does it mean and what can I do?


    Whenever the XFree86 Xserver crashes, dies, ceases to exist or is inaccessible
    for any reason, you will see the error _X11TransSocketUnixConnect: Can’t connect:
    errno = 111 or one similar to it.


    It is a message from an X-client (any program running on your XFree86 Xserver,
    for example the window manager) telling you that it tried to connect to the Xserver,
    but failed to do so for “some” reason.


    To debug this issue, you will need to look into the server output for what got
    this error. Normally you should see the real error message (the server stopped
    to work) a few lines before the error 111 message. If you still can''t make head
    or tail from all those messages, make sure to quote the FULL server output in
    your problem report (to either technical support or a mailing list).


    It is impossible to provide you with any help if you just mention the error 111,
    as so many'
