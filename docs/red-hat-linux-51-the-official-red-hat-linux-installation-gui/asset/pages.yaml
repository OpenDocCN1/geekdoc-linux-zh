    Hat Linux, or didn''t configure your ethernet card at install time, you can configure
    it with a few clicks of a mouse.


    Please Note: You may need to configure kerneld to load a driver for the network
    interface you are adding (e.g., eth0); see Section 9.6 for more information.'
