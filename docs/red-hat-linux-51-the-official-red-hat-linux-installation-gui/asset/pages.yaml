- pgno: 128
  md: '# Package Management with RPM


    The Red Hat Package Manager (RPM), is an open packaging system available for anyone
    to use, and works on both Red Hat Linux as well as other Linux and UNIX systems.
    Red Hat Software encourages other vendors to take the time to look at RPM and
    use it for their own products. RPM is distributable under the terms of the GPL.


    For the end user, RPM provides many features that make making a system far easier
    than it has ever been. Uninstalling, and upgrading RPM packages are all one line
    commands, and all the messy details are taken care of for you. RPM maintains a
    database of installed packages and their files, which allows you to perform powerful
    queries and verification of your system. During upgrades RPM handles configuration
    files specially, so that you never lose your customizations – a feature that is
    impossible with straight .tar.gz files.


    For the developer, RPM allows you to take source code for software and package
    it into source and binary packages for end users. This process is simple and is
    driven from a single file and optional patches that you create. This clear delineation
    of “pristine” sources and your patches and build instructions eases the maintenance
    of the package as new versions of the software are released.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 8.1 RPM Design Goals


    Before trying to understand how to use RPM, it helps to have an idea of what the
    design goals are.


    Upgradability With RPM you can upgrade individual components of your system without
    completely reinstalling. When you get a new release of an operating system based
    on RPM (such as Red Linux), you don''t need to reinstall your machine (as you
    do with operating systems based on other packaging systems). RPM allows intelligent,
    fully-automated, in-place upgrades of your system. Configuration files in packages
    are preserved across upgrades, so you won''t lose your customizations.


    Powerful Querying RPM is also designed to have powerful querying options. You
    can also easily search through your entire database for packages or just certain
    files. You can find out what a package belongs to and where it came from. The
    RPM package contains in a compressed archive, with a custom binary header containing
    useful information about the package and its contents, allowing you to query individual
    packages quickly and easily.


    System Verification Another powerful feature is the ability to verify packages.
    If you are worried that you deleted an important file for some package, simply
    verify the package. You will be notified of any anomalies. At that point, you
    can reinstall the package if necessary. Any configuration files that you modify
    are preserved during reinstallation.


    Pristine Sources Another crucial design goal was to allow the use of "pristine"
    software sources, as distributed by the original authors of the software. With
    RPM, you have the pristine sources along with any patches that were used, plus
    complete instructions. This is a big advantage for several reasons. For instance,
    if a new version of a program comes out, you don''t necessarily have to start
    from scratch to get it compile. You can look at the patch to see what you might
    need to do. All the compiled-in defaults, and all of the changes that were made
    to the software to build properly are easily visible this way.


    This goal may only seem important for developers, but it results in higher quality
    software for end users too. We would like to thank the folks from the BOGUS distribution
    for originating the pristine source concept.


    # 8.2 Using RPM


    RPM has five basic modes of operation (not counting package building): installing,
    uninstalling, upgrading, querying, and verifying. This section contains an overview
    of each mode. For complete details and options try rpm --help, or turn to Section
    8.4 on page 113 for more information on RPM.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 8.2 Using RPM


    # 8.2.1 Installing


    RPM packages typically have file names like foo-1.0-i386.rpm, which includes the
    package name (foo), version (1.0), release (1), and architecture (i386). Installing
    a package is as simple as:


    ```

    $ rpm -ivh foo-1.0-i386.rpm

    ####################################

    ```


    As you can see, RPM prints out the name of the package (which is not necessarily
    the same as the file name, which could have been foo.rpm), and then prints a succession
    of hash marks as the package is installed, as a sort of progress meter.


    Installing packages is designed to be simple, but you can get a few errors:


    # Package Already Installed


    If the package is already installed, you will see:


    ```

    $ rpm -ivh foo-1.0-i386.rpm

    foo package foo-1.0-1 is already installed

    error: foo-1.0-i386.rpm cannot be installed

    ```


    If you really want to install a package that contains a file that has already
    been installed by another packages, you can use --replacepkgs on the command line,
    which tells RPM to ignore the error.


    # Conflicting Files


    If you attempt to install a package that contains a file that has already been
    installed by another packages, you''ll see:


    ```

    $ rpm -ivh foo-1.0-i386.rpm

    foo /usr/bin/foo conflicts with file from bar-1.0

    error: foo-1.0-i386.rpm cannot be installed

    ```


    To cause RPM to ignore that error, use --replacefiles on the command line.


    # Unresolved Dependency


    RPM packages can “depend” on other packages, which means that they require other
    packages to be installed in order to run properly. If you try to install a package
    for which there is such an unresolved dependency, you''ll see:'
  merge: -1
  img_proc: true
- pgno: 131
  md: '$ rpm -ivh bar-1.0-1.i386.rpm

    failed dependencies:

    foo is needed by bar-1.0-1


    To handle this error you should install the requested packages. If you want to
    force the installation anyway (a bad idea since the package probably will not
    run correctly), use --nodeps on the command line.


    # 8.2.2 Uninstalling


    Uninstalling a package is just as simple as installing:


    ```

    $ rpm -e foo

    ```


    Notice that we used the package name "foo", not the name of the original package
    file "foo-1.0-1.i386.rpm".


    You can encounter a dependency error when uninstalling a package if some other
    installed package depends on it it will prevent you from removing it. For example:


    ```

    $ rpm -e foo

    removing these packages would break dependencies:

    foo is needed by bar-1.0-1

    ```


    To cause RPM to ignore that error and uninstall the package anyway (which is a
    bad idea since the package that depend on it will probably fail to work properly),
    use --nodeps on the command line.


    # 8.2.3 Upgrading


    Upgrading a package is almost just like installing.


    ```

    $ rpm -Uvh foo-2.0-1.i386.rpm

    foo ########################################

    ```


    What you do not see above is that the RPM automatically uninstalled any old versions
    of the foo package. In fact you may want to always use -U to install packages,
    since it works fine when there are no previous versions of the package installed.


    Since RPM performs intelligent upgrading of packages with configuration files,
    you may see a message like:'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# 8.2 Using RPM


    saving /etc/foo.conf as /etc/foo.conf.rpmsave


    This means that your changes to the configuration file may not be "forward compatible"
    with the new configuration file in the package, RPM saved your original file,
    and installed a new one. You should investigate and resolve the differences between
    the two files as soon as possible to ensure that your system continues to function
    properly.


    Since upgrading is a combination of uninstalling and installing, you can encounter
    any errors from those modes, plus one more: If RPM thinks you are trying to upgrade
    to a package with an older version number, you will see:


    ```

    $ rpm -Uvh foo-1.0-1.i386.rpm

    foo package foo-2.0-1 (which is newer) is already installed

    error: foo-1.0-1.i386.rpm cannot be installed

    ```


    To use RPM to "upgrade" anyway, use --package on the command line.


    # 8.2.4 Querying


    Querying the database of installed packages is accomplished with rpm -q. A simple
    use is rpm -q foo will print the package name, version, and release number of
    the installed package:


    ```

    $ rpm -q foo

    foo-2.0

    ```


    Instead of specifying the package name, you can use the following options with
    -q to specify what package(s) you want to query. These are called Package Specification
    Options.


    +   - a queries all installed packages.

    - -f <file> will query the package owning <file>.

    - -p <packagefile> queries the package <packagefile>.


    There are a number of ways to specify what information to display about queried
    packages. The following options are used to select the information you are interested
    in. These are called Information Selection Options.


    +   - i displays package information such as name, description, release, size,
    build date, install date, vendor, and other miscellaneous information.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '110


    Package Management with RPM


    +   - -1 displays the list of files that the package "owns".

    - -s displays the state of all the files in the package.

    - -d displays a list of files marked as documentation (man pages, info pages,
    README’s, etc).

    - -c displays a list of files marked as configuration files. These are the files
    you change after installation to adapt the package to your system (sendmail.conf,
    passwd, inittab, etc.).


    For those options that display file lists, you can add -v to your command line
    to get the lists in a familiar 1s -1 format.


    # 8.2.5 Verifying


    Verifying a package compares information about files installed from a package
    with the same information from the original package. Among other things, verifying
    compares the size, MD5 sum, permissions, type, owner and group of each file.


    rpm -V verifies a package. You can use any of the Package Selection Options for
    querying to specify the packages you wish to verify. A simple use is rpm -V foo
    which verifies that all the files in the foo package are as they were when they
    were originally installed. For example:


    +   - To verify a package containing particular file:

    rpm -Vf /bin/vi

    - To verify ALL installed packages:

    rpm -Va

    - To verify an installed package against an RPM package file:

    rpm -Vp foo-1.0-1.i386.rpm


    This can be useful if you suspect that your RPM databases are corrupt.


    If everything verified properly there will be no output. If there are any discrepancies
    they will be displayed. The format of the output is a string of 8 characters,
    "c" denoting configuration file, and then the file name. Each of the 8 characters
    denotes the result of a comparison of one attribute of the file to the value of
    that attribute recorded in the RPM database. A single "." (period) means the test
    passed. The following characters denote failure of certain tests:


    5 MD5 checksum


    S File size'
  merge: -1
  img_proc: true
