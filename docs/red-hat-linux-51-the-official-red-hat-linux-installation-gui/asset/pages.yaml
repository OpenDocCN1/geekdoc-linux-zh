- pgno: 21
  md: 'you''ll be prompted to insert a supplemental diskette¹. In either case, answer
    all questions as we are presented.


    # Upgrading from a Prior Version of Red Hat Linux


    The installation process for Red Hat Linux 5.1 includes the ability to upgrade
    from prior versions of Red Hat Linux (2.0 through 5.0, inclusive) which are based
    on RPM technology. Upgrading your system installs the modular 2.0.x kernel as
    well as updated versions of the packages that are installed on your machine. The
    upgrade process preserves existing configuration files using .rpmsave extension
    (e.g., sendmail.cf.rpmsave) and leaves a log telling what actions it took in /tmp/upgrade.log.
    As software evolves, configuration file formats can change, so you should carefully
    compare your original configuration files to the new files before integrating
    your changes.


