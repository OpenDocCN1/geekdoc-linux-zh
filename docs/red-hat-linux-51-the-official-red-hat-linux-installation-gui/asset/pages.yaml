- pgno: 87
  md: '# 5.2 Configuring X Windows


    Setting up your mouse, if you installed the X Windows packages, you will have
    the opportunity to configure your X server. If you did not choose to install the
    X Window System, you may skip to Section 5.3 on the next page.


    # 5.2.1 Configuring an XFree86 Server


    If you wish to use XFree86, the installation program launches the Xconfigurator
    utility.


    Xconfigurator first probes your system in an attempt to determine what type of
    video card you have. Failing that, Xconfigurator will present a list of video
    cards. Select your video card from the list and press Enter If your video card
    does not appear on the list, XFree86 may not support it. However, if you have
    technical knowledge about your card, you may choose Unlisted Card and attempt
    to configure it by matching your card''s video chipset with one of the available
    X servers.


    Once you selected your video card, the installation program installs the appropriate
    XFree86 server, and Xconfigurator presents a list of monitors. If your monitor
    appears on the list, select it and press Enter Otherwise, select Custom. If Xconfigurator
    prompts you to select the horizontal sync range and vertical sync range of your
    monitor (these values are generally available in the documentation that accompanies
    your monitor, or from your vendor or manufacturer).


    > Caution: It is not recommended to select a monitor "similar" to your monitor
    unless you are certain that the monitor you are selecting does not exceed the
    capabilities of your monitor. If you do so, it is possible you may overclock your
    monitor and damage or destroy it.


    Next, Xconfigurator prompts you for the amount of video memory installed on your
    video card. If you are not sure, please consult the documentation for your video
    card. It will not damage your video card by choosing more memory than is available,
    the XFree86 server may not start correctly if you do.


    If the video card you selected might have a video clockspeed, Xconfigurator presents
    a list of clockspeeds. The recommended choice is No Clockspeed Setting, since
    XFree86 can automatically detect the proper clock in most cases.


    Finally, Xconfigurator prompts you to select the video modes you wish to use;
    select one or more modes by pressing Space Xconfigurator then writes a configuration
    file containing all of your choices to /etc/X11/XFree86Config.'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 5.3 Configuring Networking


    Next, the installation program gives you an opportunity to configure (or reconfigure)
    networking. If you are installing from CD-ROM or from a local hard disk, the installation
    program asks if you want to configure networking. If you choose No, your Red Hat
    Linux system will be a standalone workstation. If you choose Yes, you may configure
    networking as described below.


    If you are installing Red Hat Linux via NFS, FTP, or SMB, you have already entered
    temporary networking information that was used during the installation. The install
    program offers you three choices (see Figure 5.1):


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_88_0.png)


    Figure 5.1: Network Configuration Options


    +   - Keep this setup – Keeps the network configuration you used during the installation.
    All the networking information you entered previously becomes part of your system''s
    permanent configuration.

    - Reconfigure network now – The installation program presents the network configuration
    dialogs in Section 3.4.4 on page 36. The values you used during installation will
    be filled in as defaults. Choose this if your system will be installed on a network
    other than the one you used to install Red Hat Linux.

    - Don''t setup networking – Don''t set up networking at all. Your system will
    not have networking configured. Choose this if you installed your system over
    a network, but it will be used as a standalone workstation.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# 5.3.1 Network Configuration Dialogs


    If you elected to configure networking at this time, you will be presented with
    a series of dialog boxes. Please turn to Section 3.4.4 on page 36 for more information.


    # 5.4 Configuring the Clock


    Next, the installation program presents a dialog to help you configure your Red
    Hat Linux system''s timezone (see Figure 5.2).


    If you wish to set the hardware (CMOS) clock to GMT (Greenwich Mean Time, also
    known as UTC, or Coordinated Universal Time), select Hardware clock set to GMT.
    Setting the hardware clock to GMT means your Red Hat Linux system will properly
    handle daylight savings, if your timezone uses it. Most uses uses GMT.


    **Please Note:** If your computer runs another operating system from time to time,
    setting the clock to GMT may cause the other operating system to display the incorrect
    time. Also keep in mind that if more than one operating system is allowed to automatically
    change the time to compensate for daylight savings time, it is likely that the
    time will be improperly set.


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_89_0.png)


    Figure 5.2: Configuring Timezones


    Select the timezone you will be operating in from the list, and press (Enter)


    If you wish to change your timezone configuration after you have booted your Red
    Hat Linux system, you may use the /usr/sbin/timeconfig command.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# 5.5 Selecting Services for Start on Reboot


