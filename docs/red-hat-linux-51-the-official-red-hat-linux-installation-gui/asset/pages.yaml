    \ there was installed another version of libc that didn't get obsoleted by the\
    \ Upgrade process or placed libc5 libraries in a place that causes conflict.\n\
    \  To find out if this is the case, do this:\n\n```\nrpm -qa | grep libc\nIt should\
    \ produce the following output:\ngibc-devel-2.0.5c-12\n```"
