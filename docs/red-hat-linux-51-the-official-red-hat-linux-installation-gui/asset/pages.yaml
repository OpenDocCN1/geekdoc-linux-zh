  md: '# 4.3 Creating Partitions for Red Hat Linux


    +   - To list the current partition table, use the p command (see Figure 4.8).


    +   - To add a new partition, use n.


    +   - Linux fisk creates partitions of type Linux native by default. When you
    create a swap partition, don''t forget to change it to 82 type Linux swap using
    the t command. The value for the Linux swap type is 82. For other partition types,
    use the l command to see a list of partition types and values.


    +   - Linux allows you up to four (4) partitions on one disk. If you wish to create
    more than that, one of the four may be an extended partition, which acts as a
    container for one or more logical partitions. Since it counts as a container,
    the extended partition must be at least as large as the total size of all the
