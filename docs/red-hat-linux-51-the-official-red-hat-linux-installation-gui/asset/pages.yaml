    # E.6.15 For whatever reason, I want to remove LILO from the Master Boot Record
    (MBR) of my machine. How do I do i this?


    There are several methods to removing LILO from the master boot record of the
    machine. Instead of Linux, you can replace the MBR with an earlier saved version
    of the MBR using the /sbin/lilo command:


    ```

    /sbin/lilo -u

    ```


    In DOS, NT, and Windows 95 you can use the fdisk command to create a new MBR with
    the "undocumented" flag /mbr. This will ONLY rewrite the MBR to boot the primary
    DOS partition


    ```

    fdisk /mbr

    ```


    # E.6.16 For whatever reason, I want to remove Linux from my hardrive. I tried
    using DOS''s fdisk, and it shows non-DOS partitions, but it can''t remove them.
    What do I need to do?


    Once you need to remove linux from a hard drive, and have attempted to do it with
    the default DOS fdisk, you are the "Partitions exist but they don''t exist" problem.
    The best way to remove non-DOS partitions is with a tool that understands partitions
    other than DOS.


    You can do this with the installation floppy by doing the following. Start the
    installation, select install (versus upgrade) and when it comes to partitioning
    the drive, choose fdisk. In fdisk type p to print the partition numbers, and remove
    the Linux partitions with the d command. If satisfied the changes you have made,
    you can quit with w and the changes will be saved to disk. If you deleted too
    much, type q and no changes will occur.


    Once you have removed the Linux partitions, you can reboot the box with Control-Alt-Delete
    instead of continuing with the install.'
