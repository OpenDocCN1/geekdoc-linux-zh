    # 2.2.4 Checking for Updated Diskette Images


    From time to time, we find that the installation may fail, and a revised diskette
    image is required in order for the installation to work properly. In these cases,
    we make special images via the Red Hat Linux Errata.


    Since this is a relatively rare occurrence, you will in general save time if you
    try to use the standard diskette images first, and then review the Errata if you
    experience any problems completing the installation.


    There are two ways to review the Errata:


    +   **World Wide Web** - By pointing your web browser at http://www.redhat.com/errata,
    you can read the Errata on-line, and download diskette images easily.


    +   **Electronic Mail** - By sending an empty message to errata@redhat.com, you
    will receive a message containing the complete Errata. Also included are URLs
    to update each package and diskette image in the Errata. By using these URLs,
    you can download any necessary diskette images. Remember to use binary mode when
    transferring a diskette image!


    For now, concentrate only on the Errata entries that include new diskette images
    (the filenames always in .img). If you find an entry that seems to apply to your
    problem, get a copy of the diskette images, and create them using the instructions
    in Appendix B on page 177.


