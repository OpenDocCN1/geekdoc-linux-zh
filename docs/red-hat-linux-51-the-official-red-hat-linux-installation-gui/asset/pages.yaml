  md: '# C.5 Documentation


    # C.4.6 Version Control


    This section contains packages that allow the programmer to implement various
    forms of version control over their programs.


    cvs - (Version 1.9, 1,534K) CVS is a front end to the rcs(1) revision control
    system which extends the notion of revision control from a collection of files
    in a single directory to a hierarchical collection of directories consisting of
    revision controlled files. These directories and files can be combined to form
    a software release. CVS provides the functions necessary to manage these releases
    and to control the concurrent editing of source files among multiple


    rcs - (Version 5.7, 497K) The Revision Control System (RCS) manages multiple revisions
    of files. RCS allows the storing, retrieval, logging, identification, and merging
    of revisions. RCS is useful for text that is revised frequently, for example programs,
    documentation, graphics, papers, and form letters.


    # C.5 Documentation


