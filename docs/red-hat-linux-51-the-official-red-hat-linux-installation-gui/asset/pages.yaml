    # E.9.19 For whatever reason, I need to use the rescue mode to edit a file. The
    editors complain about unknown window type. How can I edit files after I have
    booted from the rescue disk?


    After selecting rescue mode and answering a few questions, you will get a root
    prompt (#). You

    will need to mount the Linux partition like is done in this example. The partitions
    below are example only. You should change them to be appropriate for your system
    (sda,sdb1,hda5,etc)


    ```

    mkdir /mnt

    mount /dev/sdb1 /mnt

    cd /mnt/etc

    export TERMCAP=/mnt/etc/termcap

    vi filename

    ```


    or, if you wish to use a different editor, such as pico, you may want to chroot
    /mnt.'
