    # 11.9.2 System V Init


    This section is a brief description of the internals of the boot process. It basically
    covers how the machine boots using SysV init, as well as the differences between
    the init used in older Linux releases, and SysV init.


    Init is the program that gets run by the kernel at boot time. It is in charge
    of starting all the normal processes that need to run at boot time. These include
    the gettty that allow you to log in, NFS daemons, FTP daemons, and anything else
    you want to run when your machine boots.


    SysV init is becoming standard in the Linux world to control the startup of software
    at boot time. This is because it is easier to use and more powerful and flexible
    than the traditional BSD init.


    SysV init also differs from BSD init in that the config files are in a subdirectory
    of /etc instead of residing directly in /etc. This directory is called rc.d. In
    there you will find rc.sysinit and the following directories:


    ```

    init.d

    rc0.d

    rc1.d

    rc2.d

    rc3.d

    ```'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# System Administration


    rc4.d

    rc5.d

    rc6.d


    init.d contains a bunch of scripts. Basically, you need one script for each service
    you may need to start at boot time or entering another runlevel. Services include
    things like networking, nfs, sendmail, http, etc. Services do not include things
    like serialat that must be run once and then exited. Things like that should go
    in rc.local or rc.serial.


    If you want rc.local, it should be decided in /etc/rc.d. Most systems include
    one even though it doesn''t do much. You can also include an rc.serial in /etc/rc.d
    if you need to do serial port specific things at boot.


    The chain of events is as follows:


    +   * The kernel looks in several places for init and runs the first one it finds

    * init runs /etc/rc.d/rc.sysinit

    * rc.sysinit does a bunch of necessary things and then runs rc.serial (if it exists)

    * init runs all the scripts for the default runlevel

    * init runs rc.local


    The default runlevel is decided in /etc/inabb. You should have a line close to
    the top like:


    ```

    id:3:initdefault:

    ```


    From this, you''d look in the second column and see that the default runlevel
    is 3, as should be the case for most systems. If you want to change it, you edit
    /etc/inittab by hand and change the 3. Be very careful when you are messing with
    the inittab. If you mess up, you can fix it by rebooting and doing:


    ```

    LILO boot: linux single

    ```


    This should allow you to boot into single user mode so you can fix inittab.


    Now, how does it run all the right scripts? If you enter -1 on rc3.d, you might
    see some-thing like:


    ```

    lrwxrxr-x 1 root root 17 3:11 S10network -> ..init.d/network

    lrwxrxr-x 1 root root 16 3:11 S30syslog -> ..init.d/syslog

    lrwxrxr-x 1 root root 14 4:32 S40cron -> ..init.d/cron

    lrwxrxr-x 1 root root 14 4:11 S50inet -> ..init.d/inet

    ```'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 11.9 The Boot Process, Init, and Shutdown


    ```

    lrwxxrwrwx 1 root root 13 3:11 S60nfs -> ..init.d/nfs

    lrwxxrwrwx 1 root root 15 3:11 S70nfsfs -> ..init.d/nfsfs

    lrwxxrwrwx 1 root root 18 3:11 S901pd -> ..init.d/lpd.init

    lrwxxrwrwx 1 root root 11 3:11 S99local -> ..rc.local

    ```


    What you''ll notice is that there are no "files" in the directory. Everything
    there is a link to one of the scripts. The links also have an "S" and a number
    at the beginning. The "S" means to start this particular script and a "K" would
    mean to stop it. The number is just for ordering purposes, but init will start
    all the services on the order they appear. You can duplicate numbers, but it will
    only confuse you somewhat. You just need to use a digit number only, along with
    an upper case "S" or "K" to start or stop the services you need to.


    How does init start and stop services? Simple. Each of the scripts is written
    to accept an argument which can be "start" and "stop". You can execute scripts
    by hand in fact with a command like


    ```

    /etc/rc.d/init.httpd.init stop

    ```


    to stop the httpd server. init reads the name and if it has a "K", it calls the
    script with the "stop" argument. If it has an "S" it calls the script with a "start"
    argument. Why all these runlevels? Some people want an easy way to set up machines
    to be multi-purpose. I could have a "server" runlevel that runs httpd, sendmail,
    networking, etc. Then I could have a "user" runlevel that runs xdm, networking,
    etc.


    # 11.9.3 Init Runlevels


    Generally, Red Hat Linux runs in run level 3—full multiuser mode. The following
    runlevels are used in Red Hat Linux:


    +   0 Halt.

    1 Single user mode.

    2 Multiuser mode, without NFS.

    3 Full multiuser mode.

    6 Reboot.


    If your machine gets into a state where it will not boot to a bad /etc/initab,
    or will not let you log in because you have a corrupted /etc/passwd or have simply
    forgotten your password, boot into single user mode by typing linux 1 at the LILO
    boot prompt. A very bare system will come up and you will be given a shell from
    which you can fix things.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 11.9.4 Initscript Utilities


    The chkconfig utility provides a simple command-line tool for maintaining the
    /etc/rc.d directory hierarchy. It relieves symlink administrators from having
    to directly manipulate the numerous symlinks in /etc/rc.d.


    In addition, there is the ntsysv utility, that provides a screen-oriented interface,
    versus chkconfig''s command-line interface.


    Please see the chkconfig and ntsysv man pages for more information.


    # 11.9.5 Running Programs at Boot Time


    The file /etc/rc.d/rc.local is executed at boot time, after all other initialization
    is complete, and whenever you runlevels. You can add additional initialization
    commands here. For instance, you may start to up additional daemons, or initialize
    a printer. In addition, if you require serial port setup, you can edit /etc/rc.d/rc.serial,
    and it will be executed automatically at boot time.


    The default /etc/rc.d/rc.local simply creates a new login banner with your kernel
    version and type.


    # 11.9.6 Shutting Down


    To shut down Red Hat Linux, issue the shutdown command. You can read the shutdown
    page for complete details, but the two most common usages are:


    ```

    shutdown -h now

    shutdown -r now

    ```


    Each cleanly shut down the system. After shutting everything down, the first will
    halt the machine, and the second will reboot.


    Although the reboot and halt commands are now "smart" enough to invoke shutdown
    if run while the system is in runlevels 1-5, it is a bad habit to get into, as
    not all Linux-like operating systems have this feature.


    # 11.10 Rescue Modes


    When things go wrong, there are several ways to work on fixing them. However,
    they require that you understand the system well. This manual cannot teach you
    what to do, but we will present the ways that you can use our products to get
    into rescue modes where you can use your own knowledge to rescue the system.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 11.10 Rescue Modes


    # 11.10.1 Through LILO


    If your system boots, but does not allow you to log in when it has completed booting,
    you can use the single or emergency boot option. At the LILO boot: prompt, type
    linux single in order to boot in single-user mode. In single-user mode, your local
    filesystems will be mounted, but your network will not be activated. In emergency
    mode, almost nothing will be set up. Only the root filesystem will be mounted,
    and it will be mounted read-only.


    # 11.10.2 Emergency Boot Diskettes


    The boot diskette created during installation of Red Hat Linux 5.1 may be used
    as part of a rescue diskette set. For more information, please read the file rescue.txt
    in the /doc on your Red Hat Linux 5.1 CD-ROM.


    # A Handy Trick


    You have ever rebuilt a kernel and, eager to try out your new handiwork, rebooted
    before running LILO? And you didn''t have an entry for an older kernel in lilo.conf?
    Read on...


    In many cases, it''s possible to boot your Red Hat Linux/Intel from the Red Hat
    boot diskette with your root filesystem mounted and ready to go. Here''s how:


    Enter the following command at the boot diskette''s boot: prompt:


    ```

    linux single root=/dev/hdXX initrd=

    ```


    (Replace the XX in /dev/hdXX with the appropriate letter and number for your root
    partition.)


    What does this do? First, it starts the boot in single-user mode, with the root
    partition set to your root partition. The initrd specification bypasses the installation-related
    image on the boot diskette, which will cause you to enter single-user mode immediately.


    Is there a downside to this trick? Unfortunately, yes. Because the kernel on the
    Red Hat boot diskette only has support for IDE built-in, that you with SCSI-based
    systems won''t be able to use this trick. In that case, you''ll have to use the
    boot/rescue diskette combination mentioned above.'
  merge: -1
  img_proc: true
