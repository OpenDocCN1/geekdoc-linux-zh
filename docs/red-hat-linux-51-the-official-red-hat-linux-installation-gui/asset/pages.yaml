  md: '# System Administration


    # E.9 System Administration


    # E.9.1 When I create users with usercfg, they can''t login.


    When using usercfg the password is never encrypted when typed in or only one asterisk
    is placed in the password field, it is a usercfg bug. We are working to fix this
    bug, but currently we have this around.


    Click the button to the left of the entry field and choose change, then type the
    password TWICE in the entry field (follow it with a return each time).


    Another alternative is to set your password using the command line passwd program.


    # E.9.2 What is PAM? Why use it?


    PAM is a standard adopted by other unices as Solaris 2.6. For more information
    on PAM please: /http://www.redhat.com/linux-info/pam/


    # E.9.3 How can I set Secure Shell (SSH) on my linux system?


    Due to United States of America export restrictions on munitions, Red Hat Linux
    can not distribute ssh. The site ftp.replay.com has set various downloads of ssh
    and PGP.


    # E.9.4 Why does Linux only see part of my RAM?


    There are a couple of things that could be causing Linux not to see all your memory.
    On some 386''s you need to compile your kernel with “Limit memory to 16M” enabled.


    On most systems, the reason is that the BIOS has a limit of how much memory it
    will tell the OS is in the machine, even though the board can have more. Common
    limits with this problem 16M, 32M, 64M, and 128M. To get around this, we need
    to explicitly specify the amount of memory to the kernel at boot time via the
    mem=< actual memory goes here > flag.


    In the following example, we have a 32M machine but only 16M are being seen by
    Linux. At the LILO prompt, you type


    ```

    LILO: linux mem=32M

    ```


    After the machine boots, we use the free command to see if the larger amount of
    memory was recognized by the kernel. If so, we can add an append line to the /etc/lilo.conf
    file and rerun lilo to make it happen permanently. The example from above could
    look like the following:'
  merge: -1
