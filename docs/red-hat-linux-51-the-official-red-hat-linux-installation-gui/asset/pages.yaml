    gcc - (Version 2.7.3, 2,046K) The GNU compiler - a fully featured ANSI compiler,
    with support for K&R as well. GCC provides many levels of source code checking
    traditionally provided by other tools (such as lint), produces debugging information,
    and can perform many different optimizations to the resulting code. This contains
    the back end for C++ and Objective compilers as well.


    guavac - (Version 1.1, 5,237K) Guavac is a standalone compiler for the Java programming
    language. It was written entirely in C++, and should be portable to any platform
    supporting Guac''s C compiler or a similarly powered system.


    kaffe - (Version 0.10.0, 591K) This is Kaffe, a virtual machine to execute Java
    code. This can be configured in two modes. In one mode it operates as a bytecode
    interpreter (unlike Java''s machine); in the second mode it performs "just-in-time"
    code conversion from the abstract to the host''s native code. This will ultimately
    allow execution of Java code at the same speed as standard compiled code while
    maintaining the advantages and flexibility of code independence.


    p2c-devel - (Version 1.20, 507K) This is the development kit for the Pascal to
    C translator. It contains the header files and some other programs that might
    be useful to someone using the translator.


    python - (Version 1.5.1, 5,320K) Python in an interpreted, object oriented scripting
