- pgno: 195
  md: '# A.2.1 Registration


    In order to receive technical support for your Red Hat Software product, you have
    to register it. Every official Red Hat product comes with a Registration Card.
    Your product registration number appears on both the detachable mail-in-portion
    and on the top portion of this card. The product registration number uniquely
    identifies a product which you have purchased (such as Red Linux) that has 90
    days of free installation technical support by fax or email.


    # Registering via the Web


    Registering via the Web


    You can register your Red Hat product online on Red Hat''s World Wide Web site
    at http://www.redhat.com/support/register/. Choose Register a Product. Please
    enter all applicable information, and be accurate with the system information.
    This information will aid in solving problems and answering questions more quickly
    and easily, and incorrect information benefits neither us nor our customers. Also,
    make sure the electronic mail address you give is correct. All support will be
    sent to this address. If this change, please login to the registration pages and
    edit this.


    Registration has changed. There will be no more annoying ID numbers to remember.
    If you don''t have a current login to the support database, you will need to create
    one. Simply enter a name at the Support Login and click on the Create button to
    begin registration of your product. If you were already registered for support
    before August 14, 1997 you can login in using your email address as your Support
    Login and your former support/customer ID as the password. The password can be
    changed once logged in. If you don''t remember it, follow the steps as if you
    never had a login, and re-enter the registration numbers and information.


    # Registering via Email


    If you don''t have access to the World Wide Web, but you do have access to Internet
    mail, you can send registration details to register@redhat.com. Please include
    the following information:


    +   - Contact Information: name, address, city, state/province, zip/postal code,
    and telephone and fax numbers; also, your support ID if you have one;


    +   - Product Information: name of product you are registering, product registration
    number (very important!), architecture you''re using the product on (Intel, Alpha/AXP,
    or Sparc), and what you''re using the product for (File Server, Internet Server,
    Workstation, Home Computer, or Other);


    +   - System Information: CPU (i386, i486, i586, i686/Penumium2, XP21064, AXP21064,
    Sparc4C, Sparc4M), CPU speed (MHz), amount of RAM (MB), hard drives (number, size,
    types), video card, CD-ROM drive, network card, and other hardware components
    (SCSI or ISDN adaptors, etc.).'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Getting Support


    173


    # Registering via Fax or Snail Mail


    Although a mail-in portion is provided with your registration card, we do not
    recommend registering via fax or snail mail if you have access to either the World
    Web or Internet mail; if you do so, your registration is likely to be delayed
    considerably. If you wish to register via fax, fax a copy of your registration
    card to Red Hat Software at +1-919-361-2711.


    # A.2.2 Support Questions


    Technical support is a black art: in most cases, support technicians rely solely
    on communication with the customer to solve installation problems on hardware
    the technicians have never physically seen. It is extremely important, therefore,
    to state your question clearly and concisely, including detailed information such
    as:


    +   - symptoms of the problem (“Red Hat Linux 5.1 doesn’t recognize my CD-ROM
    drive.”)


    +   - when the problem began (“It stopped working yesterday ...”)


    +   - what changes you have made to your system around the time of the problem
    (“... after I disconnected it from the IDE controller.)


    +   - any diagnostic output specifically related to the problem (“In the bootup
    message, it says “Cannot find /dev/hdb; device disconnected.”); however, this
    can be taken overboard; don’t send your system logs unless we ask you for them.


    +   - other relevant information (“I’m using the floppy installation method, from
    the CD.)


    # How to Send Them


    Red Hat’s support system is email-based and partially automated; for this reason,
    it is important to make sure you send support questions in the correct format,
    so that your message will be recognized and routed to an appropriate technician.
    To receive technical support for your Red Hat Software product, you must first
    register.


    Submitting trouble tickets can be sent in the traditional email way, or can be
    initiated via the World Wide Web. After providing the information for the registration,
    you will have a new menu allowing you to edit your registration information or
    open a trouble ticket. Hurry and login now to open a ticket on the Web: http://www.redhat.com/support//


    To open a support ticket via email, all you need to do is send the support message
    with a Subject of: [registration #nnnn nnnn nnnn], where nnnn nnnn is the registration
    number of the product for which you are requesting support. For example, if your
    registration number is fffe fff ff0 ff0, the subject line should read:


    ```

    Subject: [registration #fffe fff ff0 ff0]

    ```'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'The square brackets, the number sign, and the word ''registration'' must be
    present. If you wish, you may add explanatory text to the subject line:


    Subject: {[registration #fffe 0fff ff00 ff00]} CD-ROM problem


    Once you''ve opened a ticket, support responses come to you with the support ticket
    number in the subject line:


    Subject: {[ticket #12015]} CD-ROM problem


    To correspond about the same problem, simply send a reply with the same subject:


    Subject: Re: {[ticket #12015]} CD-ROM problem


    If you feel that the problem has been solved the ticket can also be closed by
    you. Simply add close to the same subject:


    Subject: Re: {[close ticket #12015]} CD-ROM problem


    Once your problem is solved or your question answered, the technician handling
    your support ticket can close the ticket. This can also be done by you via the
    website. Either method will result in a message from the support system stating
    that the ticket is closed and contain a summary of the problem and the solution.
    You can open a new ticket for your next support question. All past correspondence
    will be saved in the database under the old ticket number and can be accessed
    with your account at any time.


    # Where to Send Them


    The address for Red Hat''s Technical Support System is support@redhat.com; all
    support questions should go there. There are several related addresses:


    +   - For a copy of the Red Hat FAQ (Frequently Asked Questions, with answers),
    send mail to faq@redhat.com.


    +   - For a copy of the Red Hat PPP Tips (tips on setting up a PPP connection),
    send mail to ppp-tips@redhat.com.


    +   - To report a bug, send mail to bugs@redhat.com.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Support FAQ (Frequently Asked Questions)


    # Support FAQ (Frequently Asked Questions)


    Here are a few questions that the Red Hat Support Staff see frequently, along
    with the answers:


    Question – I''ve sent several messages to the Red Hat Support System, and I''ve
    gotten absolutely no response. Is anybody there?


    Answer – Check your registration information to make sure your email address is
    correct. After you can check it by logging in

    http://www.redhat.com/support/register/.


    Question - I know I have already registered, but I keep getting a message from
    the support system telling me I''m not registered. Is the system broken?


    Answer – Make to register via the World Wide Web

    http://www.redhat.com/support/register/. If you didn''t please so, by first accessing
    the registration page and click on Create Login. After this you will be prompted
    to input some personal information. When finished click the Submit button and
    then enter your registration number which should look something like fffe 0ff0
    ff00. Be sure to enter all the information of your system. This information can
    be maintained by logging in and accessing your registration information

    http://www.redhat.com/support/register/.


    Question - But I registered via email. Why isn''t the support system working?


    Answer - When you register via email, your message goes to an actual human who
    registers you manually; this can delay your registration anywhere from several
    hours to days.


    Question - I''ve done everything perfectly for my registration, but I''m\u21m
    still getting messages telling me I have an invalid registration number.


    Answer - Please make sure you''re using a valid product registration number. If
    you have not purchased the official box set from Red Hat Software or a Vendor
    that sells the official version (it will say ''official'' on the box) you will
    not be able to register, as Red Hat Software cannot support products packaged
    and sold by other software publishers.


    Question - I see this on the registration page that asks me what my login is?
    What is my login anyway?


    Answer - If you are first time user of the system support or accessing the supported
    system after August 15, 1997 the Login can be whatever you want to be. It must
    be all one word and if there is a duplicate you will be warned of an error. If
    you accessed the system before this time and have a valid registration, your login
    will be the email address you had when registering and the password will be the
    old Support ID number. You can change the password if you like; however the login
    cannot be changed.


    Question - I''ve tried entering a login and password but it won''t accept it.
    Why won''t it accept the password I''m trying to enter?'
  merge: -1
  img_proc: true
- pgno: 199
  md: 'Answer - The password must be a minimum of 5 alphanumeric characters long and
    no more than 8. Make sure you typed in the exact same password both times for
