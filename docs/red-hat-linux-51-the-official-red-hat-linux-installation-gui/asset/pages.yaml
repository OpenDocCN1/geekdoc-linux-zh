    utility has also been enhanced. See the wmconfig man page for more information.


    # 1.3.2 New compiler technology available with egcs


    The egcs compiler is included with Red Hat Linux 5.1. This compiler is actively
    developed, and is considered by many to be the next major step beyond the gcc
    compiler.


    However, realizing that to compilers stability is a good thing, we have retained
    the gcc compiler as well. In Table 1.1 on the next page, you can see the circumstances
    under which the two compilers are invoked.


    **Please Note:** The commands in Table 1.1 on the following page are symlinks
    to the appropriate compilers. If you would like to change this behavior, you may
    change the symlinks. The only'
