    # E.5 General Questions


    # E.5.1 How do I get new updates to Red Hat as they happen?


    Keep your eye on the Red Hat Linux Errata. (See E.2 (errata)).

    Also check the contrib directory on our FTP mirrors for packages that users have
    contributed. We also make periodic announcements to the redhat-announce-list with
    updates.


    # E.5.2 How do I report a bug?


    Send email to mailto:bugs@redhat.com.


    # E.5.3 Does Red Hat Linux include source code?


    We include the exact source that was used to build the distribution. From release
    2.0 on, Red Hat Linux is built with a packaging system called RPM that ONLY uses
    pristine source (the same as what you''d find at the author''s site) and possibly
    a patch by Red Hat.


    To install a source RPM, use the following command:


    ```

    rpm -iv packagename-n.nn-r.src.rpm

    ```


    RPM installs sources under the redhat source tree, which is /usr/src/redhat by
    default (you can configure the directory using the topdir command in /etc/rpmrc).
    Spec files (packagename-n.nn.spec) are installed in /usr/src/redhat/SPECS, while
    source archives and patch files go in /usr/src/redhat/SOURCES.'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# E.6 Installation


    To unpack the source once it is installed, change to /usr/src/redhat/SPECS and
    use the following command:


    ```

    rpm -bp packagename-n.nn.spec

    ```


    RPM unpacks the source into /usr/src/redhat/BUILD/classname-n.nn and applies any
    patches listed in the spec file.


    For more information, please read the RPM manual page and the complete RPM information
    at: http://www.rpm.org/


    # E.6 Installation


    # E.6.1 I have a blank hard drive and would like to install DOS or Windows 95
    and Linux onto it. What is the best method of doing this?


    It is recommended to install the other operating system first, before installing
    Linux. This allows the other OS to "get comfortable" with the hardware and possibly
    write values to the MBR that it would over-write if Linux was installed.


    You will probably need to do this in a several step method, however. First start
    the install, but if the operating system partitions the entire drive for itself,
    see if you can "bail out" early and use the native disk to create a primary partition
    of the size you want to leave for the OS (150-500 megss to be usual depending
    on your needs). Then reboot and go through the install again and normally the
    OS will use the space that you set aside. Once the install is finished, you can
    begin the Linux installation.


    # E.6.2 I do not have a cdrom that will work with Linux and I can not install
    from the network. Is there another method?


    If you are going to do a hard drive install due to some problem with your cdrom,
    you will need to follow these steps.


    Have a DOS partition that is formatted in FAT16, and create a directory called
    \RedHat. From there will need to copy the items from the cdrom over to the hard-drive.


    ```

    mkdir C:\RedHat

    mkdir C:\RedHat\base

    mkdir C:\RedHat\RPMS

    copy E:\RedHat\base C:\RedHat\base

    ```'
  merge: -1
  img_proc: true
- pgno: 269
