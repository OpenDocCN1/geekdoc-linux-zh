    ```\n\nDo not forget to run lilo after editing the file.\n\n# E.9.5  I have over\
    \ 64 Megs in my pentium or greater machine, however it seems sluggish when doing\
    \ anything. If I tell Linux to use only 64Megs with the mem=64M machine, it seems\
    \ to speed up. What is going on and can I do anything about it?\n\nThis is a problem\
    \ with hit rates and memory. A few motherboards not use the external cache if\
    \ all the machine tries to access memory more than 64M in size. This will cause\
    \ a noticeable slow down, and there is not much that can be done about it. Most\
    \ other problems are that the CPU is not using the External Cache if you only\
    \ have 256K cache and more than 64Megs of ram. Increase the Motherboard cache\
    \ to 512K to 1Megabyte and you may see the sluggness away.\n\n# E.9.6  I have\
