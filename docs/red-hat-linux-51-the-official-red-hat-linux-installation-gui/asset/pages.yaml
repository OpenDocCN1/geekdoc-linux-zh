    are stored in /home/httpd, but this can be changed in the apache configuration
    files, all of which are stored in /etc/httpd/conf/. Logs of all http activity
    are kept in /var/log/httpd/. Setting up your web site is as easy as adding your
    own HTML pages and links to the /home/httpd/html/directory. For more information
