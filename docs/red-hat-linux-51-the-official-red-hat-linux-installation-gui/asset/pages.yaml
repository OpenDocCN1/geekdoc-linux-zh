- pgno: 102
  md: '# 6

    What Do I Do Now?


    Now that your installation of Red Hat Linux is complete, you might be wondering,
    “What do I do now?” If so, this chapter is for you. We''ll start with some basic
    things you should know in order to properly start and stop your Red Hat Linux
    system. Then we''ll show you how to do post-installation configuration so you
    can set things up just the way you want it. But before we do any of that, let''s
    talk about documentation ...


    # 6.1 Getting the Documentation That''s Right For You


    As mentioned in Section 2.1 on page 8, it is critical to make sure you have documentation
    that is appropriate to your level of Linux expertise. There is no more certain
    way to make your experience using Red Hat Linux failure to not have the documentation
    you need, you need it.


    As the name implies, the Official Red Hat Linux 5.1 Installation Guide is just
    that – a guide to installing Red Hat Linux on your system. While we make every
    effort to give you the information you need to get your Red Hat Linux running,
    the Installation Guide can''t it all. For one, the Guide would balloon to more
    than a thousand pages. Besides, then we''d have to change the title, because it
    wouldn''t be just an “Installation Guide” anymore!


    Instead, let''s take those categories we discussed back in Section 2.1 on page
    8, and let''s try to be more explicit in the documentation you''ll need. Let''s
    start by figuring out your experience level. Here are the three basic categories:'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'New To Linux – Has never used any Linux (or Linux-like) operating system before,
    or has had limited exposure to Linux. May or may not have experience using other
    operating systems (such as Windows). Is this you? If so, please turn to Section
    6.1.1.


    Some Linux Experience – Has installed and successfully used Linux (but not Red
    Hat Linux) before. Or, may have equivalent experience with other Linux-operating
    systems. Does this describe you? If so, please turn to Section 6.1.2 on the next
    page.


    Old Timer – Has installed and successfully used Red Hat Linux before. Are you
    an old-timer? If so, please turn to Section 6.1.3 on the facing page.


    # 6.1.1 Documentation For First-Time Linux Users


    "A journey of a thousand miles begins with a single step." This saying can be
    applied to just about any endeavor; we’re going to apply it to learning to use
    your Red Hat Linux system. Learning to use a Linux system effectively can be a
    long, rewarding journey, where you find that you can easily do things that people
    with other operating systems can only dream of. By all journeys, you''ve got to
    start somewhere, and take that first step.


    The first step you need to take is to get yourself stressed enough; without documentation
    you will only become frustrated by your inability to get your Red Hat Linux system
    working the way you want.


    Here’s what you should look for in terms of Linux documentation:


    +   An brief history of Linux – Many aspects of Linux are the way they are because
    of historical precedent. There is also a Linux culture that, again, is based to
    a great deal on past history. A bit of knowledge about the history of Linux will
    serve you well, particularly as you interact with more experienced Linux users
    on the Internet.

    An explanation of how Linux works – While it’s not necessary to deliver into the
    most arcane of the Linux kernel, it’s a good idea to know something about how
    Linux is put together. This is particularly important if you’ve been working with
    other operating systems; some of the assumptions about how computers work may
    not transfer from system to Linux. A few paragraphs discuss Linux works (particularly
    how it differs from the operating system you’re used to), can be invaluable in
    getting off to a good start with your Red Hat Linux system.

    an introductory command overview (with examples) – This is probably the most important
    thing to know in Linux documentation. The design philosophy behind Linux is that
    it’s better to use small commands connected together in different ways than it
    is to have a few large (and complex) commands that do the job themselves. With
    some examples that illustrate the Linux approach to doing things, you will find
    yourself intimidated by the sheer number of commands available on your Red Hat
    Linux system.


    As you gain more experience using your Red Hat Linux system, you’ll probably find
    you need more in-depth information. Continue reading the next section to find
    out more about the kinds of documentation that will help you at that point.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Getting the Documentation That''s Right For You


    # 6.1.2 Documentation For More Experienced Linux Users


    If you''ve used other Linux distributions, you probably already have a basic grasp
    of the most frequently used commands. You may have installed your own Linux system,
    and maybe you''ve downloaded and built software yourself on the Internet. What
    sorts of information will you need?


    +   - An extensive list of available commands – While you can find this sort of
    information on-line in the pages, you might also want it in book form. While there
    are several books on the market, Red Hat sells the Linux Complete Command Reference.
    This book contains the main page entries for hundreds of commands, system calls
    and file formats, all formatted for easy reading. Best of all, there is a comprehensive
    index, and a searchable version of the book on CD-ROM. A book like this is invaluable
    for:

    - Finding the right command for a particular task.

    - Learning how to use that command properly.


    +   - Task-oriented information – Many times, you''ll find that you''d like to
    configure Red Hat in a certain way, but you''re not sure where to begin. In this
    case, it''s often a bit of help to see what others in similarities have done.
    This is where the Linux Documentation Project (also known as the LDP) can come
    in hand. Each of their HOWTOs document a particular aspect of Linux, from low-level
    kernel esoterica, to using Linux in an amateur radio station.


    If you select one of the various howtos when you installed Red Hat Linux, you''ll
    find the HOWTOs on your system in `/usr/doc/HOWTO`. If, on the other hand, you''d
    like a printed version of these documents, Red Hat Software sells Linux Undercover,
    which is a compendium of the most popular LDP documents.


    # 6.1.3 Documentation For Linux Gurus


    If you''re a long-time user Red Hat Linux, you probably already know that the
    following pretty says it all when it comes to documentation:


    > Use the Force – Read the source!


    There are times when you''ll have to sit there and look at the sources to understand
    things. Fortunately, because of the freely available nature of Linux, it''s easy
    to get the sources. Now if it were only easy to understand them...


    Now that we''ve covered documentation, let''s look at some of the most commonly-performed
    system tasks.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 6.2 Basic System Tasks


    Remember when everyone upgraded from Windows 3.1 to Windows 95? For a while, people
    scrambled to figure out how to do the same things under ''95 that they had done
    for years under 3.x. It''s no different here. If you have experience with other
    operating systems, but not with Linux, you''ll need to adjust to different ways
    of doing things. Some tasks may be entirely different, and some may have no equivalent
    to anything you''ve ever done before.


    Let''s start going through a few of the more common tasks.


    # 6.2.1 Booting Your Red Hat Linux System


    The process required to get your computer running Red Hat Linux may vary a bit
    from what you''re used to. If you have no other operating system installed on
    your computer, just apply power, and wait. You will see the computer pause for
    a moment while it says something about ''LILO'', but it will continue, displaying
    all sorts of strange messages.


    However, if you are sharing your computer between Red Hat Linux and another operating
    system, you may have one of the following tasks to perform:


    +   * Selecting Red Hat Linux at the LILO prompt - If you elected to install LILO,
    and you entered boot labels for other partitions running other operating systems,
    your computer will be configured to dual boot. This means that you can enter the
    name of the operating system you want to boot at the LILO Boot prompt. If you
    press the Tab key at the LILO prompt, you''ll see a list of the operating systems
    LILO can boot for. Select the entry for your Red Hat Linux installation, and you''re
    off and running!

    * Booting from a diskette - If you created a boot diskette when you installed
    Red Hat Linux, you can boot from that to get Linux running. Make sure the diskette
    is inserted in your computer''s first diskette drive, and start the boot sequence
    by applying power, pressing the reset button, or typing the Ctrl, Alt, and Dei
    keys simultaneously.


    # 6.2.2 Logging In, Logging Out


    After Hat Linux boots, you''ll see something similar to this on your screen:


    Red Hat Linux release 5.1 (Manhattan)

    Kernel 2.0.34 on an i586

    login:


    As you might guess from the last line, it''s time to log in...'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 6.2 Basic System Tasks


    # Logging In


    The first time you log into your Red Hat Linux system, you''ll have to log in
    as “root”. This is the name of the user account that has full access to everything
    on the system. Normally, the root account is only used when performing system
    administration tasks, such as creating new user accounts, shutting down the system,
    etc. That root''s unrestricted access can wreak havoc if you enter the wrong command.
    Be careful when logged in as root, and use the root account only when needed!


    To log in, enter root at the login: prompt. Press the Enter (or Return) key. A
    Password: prompt should appear. Type the same password you entered back in Section
    5.7 on page 72, pressing Enter when done. Then you will see something like this:


    ```

    [root@bigdog /root]#

    ```


    Congratulations! You''ve successfully logged in! Next, it''s time to learn how
    to log out.


    # Logging Out


    When you''re done using your Red Hat Linux system, you should log out. Although
    many shells have a logout command, most people simply type Ctrl-D. This should
    return you to the login prompt you first saw when you booted your Red Hat Linux
    system.


    **Please Note:** If you''re using the Windows System, your log out procedure will
    be different, depending on how you''ve started X. We''ll cover this in more detail
    later.


    Now that you know how to log in and out, let''s move on...


    # 6.2.3 Accounts and Passwords


    As mentioned earlier, it''s a bad idea to use the root account all the time. Inevitably,
    you''ll end up making a mistake, and the access checks that normally protect you
    won''t be there.


    Yours, of course.


    But to do that, you''ll need to know how to add user accounts to your Red Hat
    Linux system.


    # Accounts


    As it turns out, there are several different ways of creating new accounts. We''ll
    use the most basic method; the useradd command. Basically, all you need to enter
    (as root, remember!) is:'
  merge: -1
  img_proc: true
- pgno: 107
  md: '```

    [root@bigdog /root]# useradd blarg

    [root@bigdog /root]#

    ```


    Wasn''t very exciting, was it? Well, let''s try to login:


    Red Hat Linux release 5.1 (Manhattan)

    Kernel 2.0.34 on an i586

    login: blarg

    Password:

    Login incorrect


    login:


    Not knowing blarg''s password was, we just pressed Enter Guess that wasn''t the
    right password. Say, how do you specify a password for a new account?


    # Passwords


    The passwd command can be used to:


    +   - Specify passwords for newly-created user accounts.

    - Change an already-existing account''s password.

    - Change the password of the account you''re logged into.


    The two scenarios are really one and the same; there''s really no difference (as
    far as passwd is concerned) between an account that''s just created, or one that
    has existed for the past five years. All you need to remember is that you must
    be logged in root, and that you must specify the account name whose password you
    want to change. Using the account we just created as an example, let''s give passwd
    a try:


    ```

    [root@bigdog /root]# passwd blarg

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated successfully

    [root@bigdog /root]#

    ```


    As you might have guessed, the password is not displayed when you enter it. You
    also have to type the password twice, to make sure you didn''t make a mistake
    while entering it. Let''s try logging into the new account again:'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 6.2 Basic System Tasks


    ```

    Red Hat Linux release 5.1 (Manhattan)

    Kernel 2.0.34 on an i586

    login: blarg

    Password:

    [blarg@bigdog blarg]$

    ```


    Once you''re logged in to an account, you can change account''s password by using
    the passwd command without the account name. In this case, you will be asked for
    the account''s current password, followed by the new password:


    ```

    [blarg@bigdog]$ passwd

    Changing password for blarg

    (current) UNIX password:

    New UNIX password:

    Retype new UNIX password:

    passwd: all authentication tokens updated successfully

    [blarg@bigdog]$

    ```


    It''s as simple as that.


    # The su command


    There may be times when you need to issue a command or two as another user. Normally,
    system administrators need these – (like all good sysadmins) use their personal,
    non-privileged account most of the time. But maybe a user''s password needs to
    be changed, or the permissions on a system file need to be modified. Such things
    only take a minute, so it''s a pain logging, logging in as root, doing whatever
    it was needed to do as root, logging out, and – logging back into their personal
    accounts.


    A much simpler approach is to use the su command. With su, your current login
    session can “become” a root (or other user''s) login session. In the following
    example, user blarg decides they need to do as root:


    ```

    [blarg@bigdog]$ su

    Password:

    [root@bigdog blarg]#

    ```


    As you can see, after issuing the su command, the user is prompted for a password
    – the root password. After it''s been entered correctly, the shell prompt is displayed.
    But if you look closely, you''ll note that the prompt is different. It starts
    with root, indicating that the current user has changed. The other difference
    is the prompt ending character, changed from a dollar sign ($) to a pound sign
    (#). This is a traditional way of indicating whether a shell is running as root
    or not.'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'It''s also possible to use su to become another user. To do this, you must
    run su as root (whether you run su from a root login session, or from an su shell
    prompt is immaterial), giving only the user''s account name. So, for root to become
    user blarg, one only need the command su blarg. No password is required in this
    case – you''re already root, so a password is somewhat redundant.


    You''ll find that su will come in handy, particularly if you, like most Linux
    users, act as your system administrator.


    # 6.2.4 Shutting Down Your Red Hat Linux System


    When you''re done using your Red Hat Linux system, you''ll need to shut it down.
    However, this is a bit more involved than simply pressing the power switch. Here''s
    why:


    Even though you may not be running any programs when you''re ready to shutdown,
    doesn''t mean there''s nothing running on your Red Hat Linux system. To see what
    we mean, use this command:


    ```

    ps ax

    ```


    Each of the lines displayed by ps represents a process. You can think of each
    process as a “running program”. Each process may be working with files, and if
    you simply turn off your computer, these processes won''t have a chance to close
    those files, and finish running in a clean manner. When the time comes to shut
    your system down, you''ll need some way of telling all processes to finish up,
    and exit cleanly. And the way this is normally done is with shutdown command.


    The shutdown command can only be run by root, so you''ll need to either be logged
    in as root or use the su command to “become” root. The basic syntax for shutdown
    is:


    ```

    shutdown <options> <time>

    ```


    Please Note: The shutdown program resides in /sbin. If your PATH environment variable
    does not include /sbin, you will need to include the full path when you enter
    the command (i.e., /sbin/shutdown -h now).


    In most cases, you should include one of the following options:


    +   - -h – Halt the system when the shutdown is complete.

    - -r – Reboot the system when the shutdown is complete.


    If you don''t include either option, shutdown will bring your system into “single
    user” mode. Unless you know why you want to be in single-user mode, you probably
    won''t want to be in'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 6.3 The X Window System


    single-user mode. Simply enter the shutdown command (this time with -h or -r),
    and the shutdown will complete normally.


    The shutdown command also gives you quite a bit of flexibility in terms of timing.
    If you want the shutdown to proceed right away, just enter the word “now”. If
    you want to shut the system five minutes from now, you can enter “+5”. Therefore,
    this command:


    ```

