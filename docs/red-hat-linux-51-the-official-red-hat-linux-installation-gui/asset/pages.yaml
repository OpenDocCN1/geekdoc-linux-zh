    # Starting Over


    If you would like to abandon any changes you''ve made while in Disk Druid, and
    would rather use fdisk instead, you can select the Back button, and press Space.
    If you want to continue using Disk Druid, but would like to start over, press
    F5, and Disk Druid will be reset to its initial state.


    # When You''re Finished...


    Once you''ve finished configuring partitions and entering mount points, the screen
    should look something like the one in Figure 4.6 on the next page. Select OK,
    and press Space. Then turn to Section 4.4 on page 53.


    # 4.3.2 Using fdisk


    If you''d rather use fdisk to manage partitions, this is the section for you.
    Once you''ve selected fdisk, you''ll be presented with a dialog box "Partition
    Disks" (see Figure 4.7 on the next page). In this box is a list of every disk
    on your computer. Move the highlight to the disk you''d like to partition, select
    Edit, and press Space. You will then enter fdisk and can partition the disk you
    selected. Repeat this process for each disk you want to partition. When you''re
    done, select "Done"


