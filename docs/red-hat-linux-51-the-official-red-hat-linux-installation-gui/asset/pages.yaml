  md: '# 2.4 Installation Methods


    # 2.3.3 Network-related Information


    If you will be connected to a network, be sure you know your:


    +   - IP address - Usually represented as a set of four numbers separated by dots,
    such as 10.0.2.15.

    - netmask - Another set of four numbers separated by dots. An example netmask
    would be 255.255.248.0.

    - gateway IP address - Another set of four dot-separated numbers. For instance,
    10.0.2.254.

    - one or more name server IP addresses - One or more sets of dot-separated numbers.
    10.0.2.1 might be the address of a server.

    - domain name - The name you give to your organization. For instance, Red Hot
    Software has a name of redhat.com.

    - hostname - The name of your computer. A computer might be named pooch, for.


    Please Note: The information given above is an example only! Do not use it when
    you install Red Hat Linux! If you do not know the proper values for your network,
    ask your network administrator.


    # 2.4 Installation Methods


    You can install or upgrade Red Hat Linux via any of several different methods.
    Each method works best in different situations, and has different requirements.
    Before we discuss installation method, let''s take a look at an issue that might
    affect some of you.


    # 2.4.1 PCMCIA Support During the Installation


    This section is specific to Intel-based computers only


    Most Intel-based laptop computers support PCMCIA (also known as PC Card). Computers
    that support PCMCIA devices contain a controller having one or more slots in which
    a PCMCIA device can be installed. These devices may be modems, LAN adapters, SCSI
    adapters, and so on.


    When installing Red Hat Linux/Intel on a PCMCIA-capable computer, it is important
    to note if a PCMCIA device will be used during installation. For example, if you
    want to install Red Hat Linux/Intel from a CD-ROM, and your CD-ROM drive is connected
    to a PCMCIA adapter, the installation program will require PCMCIA support. Likewise,
    if you are going to use one of the'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'network-based installation methods, you will need PCCMIA support if your network
    adapter is PCCMIA-based.


    **Please Note:** You don''t install-time PCCMIA support if you''re installing
    Red Hat Linux on a laptop, and using the laptop''s built-in CD-ROM drive.


    PCCMIA support is dependent on two things:


    +   1. The type of PCCMIA controller in your computer system.


    +   2. The type of PCCMIA device that you wish to use during the installation.


    While nearly every PCCMIA controller and most popular PCCMIA devices are supported,
    there are some exceptions. For more information, please consult the Red Linux
    Hardware Compatibility List at http://www.redhat.com/hardware.


    The main thing to keep in mind is that if you require install-time MCMIA support,
    you will need a supplemental diskette. We''ll show you how to do this after you''ve
    determined which installation method is best for you.


    # 2.4.2 Installing From a CD-ROM


    If you have a Red Linux CD-ROM, and your computer has a supported CD-ROM drive,
    you should consider this installation method. Installing directly from CD-ROM
    is the most straightforward-forward approach. When installing from CD-ROM, the
    packages you select are read from the CD-ROM, and are installed on your hard drive.


    # How To Do It


    As the name implies, you''ll need a Red Linux CD-ROM, a supported CD-ROM drive,
    and a means of starting the installation program.


    Intel systems will need to use the boot diskette (and the supplemental PCCMIA
    support is required). There is an alternate method of installing from CD-ROM that
    uses diskettes, but requires the system is running OS. We''ll discuss this approach
    (known as autoboot) in Chapter 3 on page 27. For now, that PCCMIA support is not
    available when using autoboot.


    If you''ve determined this installation method is most applicable to your situation,
    please skip ahead to Section 2.5 on page 19.'
