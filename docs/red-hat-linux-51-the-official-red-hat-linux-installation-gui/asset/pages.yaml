  md: '# Installing LILO


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_98_0.png)


    Figure 5.13: Creating a Boot Diskette


    # 5.9 Installing LILO


    In order to be able to boot your Red Hat system, you usually need to install LILO
    (the Linux LoaDer). You may install LILO in one of two places:


    The Master Boot Record (MBR) is the recommended place to install LILO, unless
    the MBR already starts another operating system loader, such System Commander
    or OS/2''s Boot Manager. The master boot record is a special area on your hard
    drive that is automatically loaded by your computer''s BIOS, and is the earliest
    point at which LILO can take control of the boot process. If you install LILO
    in the MBR, when your machines boot, LILO will present a boot: prompt; you can
    then boot Red Hat Linux or any other operating system you configure LILO to (see
    below).


    The first sector of your root partition is recommended if you are already using
    another boot loader on your system (as OS/2''s Boot Manager). In this case, your
    boot loader will take control first. You can then configure that boot loader to
    start LILO (which will then boot Red Hat Linux).


    A dialog box will appear that will you select the type of LILO installation you
    desire (see Figure 5.14 on the next page). Select the location you wish to install
    LILO and press OK. If you do not wish to install LILO, press Skip.


    Please Note: If you choose Skip, you will not be able to boot your Red Hat system
    directly, and will need to use another boot method (such as a boot diskette).
    Use this option only if you know another way of booting your Red Hat Linux system!'
  merge: -1
  img_proc: true
