    # 2.6.5 How Many Partitions?


    Although you can install Red Hat Linux in a single partition (subject to any of
    the partitioning considerations we''ve mentioned so far), it''s a much better
    idea to split things a bit. We recommend the following layout as a compromise
    between single-partition simplicity, and multi-partition flexibility:


    Please Note: If you plan to install all the software packages that come with Red
    Hat Linux, you will need to use the larger partitions sizes shown here. In fact,
    you may want to increase the sizes above our recommendations, to allow for future
    growth without needing to repartition.


    A swap partition - Swap partitions are used to support virtual memory. If your
    computer has 16 MB of RAM or less, you must create a swap partition. Even if you
    have more memory, a swap partition is still recommended. The minimum size of your
    partition should be equal to your computer''s RAM, or 16 MB (whichever is larger).
    The largest swap partition is roughly 127 MB, so making a swap partition larger
    than that will result in wasted space. However, note that you can create and use
    more than one swap partition (although this is usually only necessary for large
    server installations).


    A root partition - The root partition is where / (the root directory) resides.
    It only needs to contain things necessary to boot your system, as well as system
    configuration files. A root partition of 50 MB to 100 MB works well for most systems.


    Don''t forget the LILO constraints we mentioned in Section 2.6.4 on the preceding
    page!


    A /usr partition - The /usr partition is where much of the software on Red Hat
    Linux system resides. This partition should be between 300 MB and 700 MB, depending
    on how many packages you plan to install. If all possible, try to be generous
    with the /usr partition. RPM-based packages you install later (in general) use
    more space from /usr than from any other partition.


    A /home partition - This is where users'' home directories go; the size of /home
    depends on how many users you plan to have on your Red Hat Linux system and what
    they store in their home directories.


    Additionally, your circumstances may warrant creating one of the following partitions:


    A /usr/local partition - Traditionally, /usr/local has been used to hold things
    you wish to keep separate from the rest of your Red Hat Linux system, so as that
    is'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 2.7 A About Kernel Drivers


    not available as an RPM package. The size depends on the amount of software you
    anticipate on your system.


    A /usr/src partition - There are two things that normally are stored in /usr/src
    on a Red Linux system:


    Linux Kernel Sources - The complete sources for the Linux kernel are stored here,
    and new kernels are built here. At present, the kernel sources are approximately
    30MB in size. Keep in mind that you will want to have additional free space for
    building kernels, and you may want to keep more than one version of the kernel
    available.


    Sources For RPM-Based Packages - If a source package file (aka SRPM) is installed,
    the files are stored here. Note that, unless specified otherwise, any packages
    will also use a build directory located here.


    Again, the size of this partition would depend on the amount of software you anticipate
    building.


    A /tmp partition - As the name implies, /tmp partition is for temporary files.
    A partition dedicated to /tmp is a good idea for larger, multiuser systems or
    network machines. The reason is that many active users can fill the partition
    (/), where /tmp is located. It''s not necessary to dedicate a partition to /tmp
    on single-user workstations.


    A /var partition - Your Red Linux system will write to log files in /var/log.
    Files queued for printing will normally be written to /var/spool. These are just
    two examples of data that is written to /var. Unless otherwise configured, /var
    will be part of the root filesystem, and not not have much available free space.
    If you anticipate a lot of print, mail, or log activity on your system, you might
    want to consider creating a partition dedicated to /var. In general, only multiuser
    or server systems would make effective use of a separate /var filesystem.


    A /boot partition - While many of the partitions mentioned here make sense only
    for large, active systems, this partition might be very useful on a small system,
    where free space is tight. If you recall, back in Section 2.6 on page 23, we discussed
    the limitations imposed by the standard BIOS, and how these impact the LILO bootloader.
    All the files LILO needs to (at boot time) are in the /boot directory. Since the
    files (including the kernel) in /boot only take up a megabyte or so, if you are
    having trouble finding space for a 10 MB root partition in a place where LILO
    can get it, you might have better luck trying to squeeze in a 5-10 MB (generously
    oversized) partition for /boot. You''ll still need to create a root partition,
    but it can now be located anywhere on your system - the BIOS restrictions only
    apply to the partition holding /boot.


