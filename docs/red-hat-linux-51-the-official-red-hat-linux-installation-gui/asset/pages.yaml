- pgno: 81
  md: '# 4.9.1 Selecting Components


    Components group packages together according to the functionality they provide.
    For example, C Development, Networked Workstation, or Web Server. Select each
    component you wish to install and press Space Selecting Everything (which can
    be found at the end of the component list) installs all packages included with
    Red Hat Linux (see Figure 4.16). Selecting every package will require over 700
    MB of free disk space.


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_81_0.png)


    Figure 4.16: Selecting System Components


    If you wish to select or deselect individual packages, check the Select individual
    packages box.


    # 4.9.2 Selecting Individual Packages


    After selecting the components you wish to install, you may select or deselect
    individual packages. The installation program presents a list of the package groups
    alike; select a group to examine and press Enter. The installation program presents
    a list of the packages in that group, which you may select or deselect by using
    the arrow keys to highlight a package, and pressing Space (see Figure 4.17 on
    the facing page).


    **Please Note:** Some packages (such as the kernel and certain libraries) are
    required for every Red Hat Linux system and are not available to select or deselect.


    When you are finished selecting individual packages, press OK in the Select Group
    dialog box.'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 4.9 Selecting and Installing Packages


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_82_0.png)


    Figure 4.17: Selecting Packages


    # Getting Information About A Package


    You may view a detailed description of the currently-highlighted package by pressing
    F1. A dialog box will appear containing a description of the package. You can
    use the arrow keys to scroll through the description if there is more than fit
    on the screen. When you''re reading the description, press Ok, and the box will
    disappear. You can then continue selecting packages (and viewing their descriptions).


    **Note:** If you''d rather read the package descriptions on paper, please turn
    to Appendix C on page 179.


    # 4.9.3 Package Dependencies


    Many software packages, in order to work correctly, depend on other software packages
    or libraries that must be installed on your system. For example, many of the graphical
    Red Hat system administration tools require the python and pythonlib packages.
    To make sure your system has all the packages it needs to be fully functional,
    Red Hat checks these each time you install or remove software packages.


    After you have finished selecting packages to install, the installation program
    checks the list of selected packages for dependencies. If any package requires
    another package which you have not selected to install, the program presents a
    list of unresolved dependencies and gives you the opportunity to resolve them
    (see Figure 4.18 on the following page). If you simply press OK, the program will
    resolve them automatically by adding all required packages to the list of selected
    packages.'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 4.9.4 Package Installation


    After all package dependencies have been resolved, the installation program presents
    a dialog box telling you that a log file containing a list of all packages installed
    will be written to /tmp/install.log on your Red Hat Linux system. Select Ok and
    press Space to continue.


    At this point, the installation program will format every partition you selected
    for formatting. This can take several minutes (and will take even longer if you
    directed the installation program to check for bad blocks).


    Once all partitions have been formatted, the installation program starts to install
    packages. A window entitled “Install Status” is displayed with the following information:


    Package – The name of the package currently being installed.


    Size – The size of the package (in kilobytes).


    Summary – A short description of the package.


    Package Installation Progress Bar – A bar showing how to complete the current
    package installation.


    Statistics Section – This section has three rows labeled “Total,” “Completed,”
    and “Remaining”. As you might guess, these rows contain statistics on the total
    number of packages that will be installed, statistics on the number of that have
    been completely installed, and statistics on the packages that have not yet been
    installed. The information tracked on these three rows includes:


    ![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 4.9 Selecting and Installing Packages


    **Packages** - The number of packages.

    **Bytes** - The size.

    **Time** - The amount of time.


    **Overall Progress Bar** - This bar changes color showing how close to completion
    the entire installation is.


    If you''re doing an FTP installation, a message box will pop up as each package
    is retrieved from the FTP site.


    At this point there''s nothing left for you to do until all the packages have
    been installed. How quickly this happens depends on the number of packages you''ve
    selected, and your computer''s speed. Once all the packages have been installed,
    please turn to the next chapter to finish your installation of Red Hat Linux.'
  merge: -1
