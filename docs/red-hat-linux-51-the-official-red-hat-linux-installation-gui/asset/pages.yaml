- pgno: 277
  md: '# E.6.17 I have installed Linux without errors on a reboot, I get only an L,
    LI, and some other items. What is happening and how can I recover?


    If you have rebooted the system and have gotten a L, LI, or a combination of this
    and a lot of scrolling numbers, this indicates that LILO is having a problem bootstrapping
    itself due to one or more problems.


    Write down the error codes that are being printed and what letter is written on
    (L, LI, LIL, etc.). If you can access the cdrom (from DOS floppy or another machine),
    you can cd to (assuming DOS) |live\usr\doc lilo-0.20\README and check to see what
    the error seems to indicate.


    Most of the time, the failures are due to the BIOS and the hard-drive mismatch
    or something similar:


    +   - The first (or parts of) are above the 1023 cylinder since the BIOS cannot
    bootstrap the information. If your BIOS has the capability to use LBA (Linear
    Block Addressing) mode and it isn''t already enabled, you should enable it and
    then re-run lilo (either by reinstalling or using rescue mode). In most cases,
    you will probably have to repartition after enabling LBA.

    - If you can reinstall and add more partitions, create a /boot partition and place
    it entirely below the 1023 cylinder.

    - You have placed the kernel on a drive the BIOS can''t access. This can be an
    IDE drive that is not on the primary chain (IDE0 hda, hdb) or if you have placed
    Linux on a SCSI drive because it is the SCSI ID is not 0 (or 1 if you have NO
    IDE drives in the system).


    If you need to gather more information for someone else (either for official support
    or from the mailing lists, news groups, friends, etc) you can use the rescue mode


    Insert the installation floppy, and at the boot prompt type:


    ```

    lilo rescue

    ```


    After a couple of screens that ask about hardware you will get a root prompt (#).
    You will need to mount the linux root partition like is done in this example which
    has the / partition as /dev/hda5


    ```

    mkdir /mnt

    mount /dev/hda5 /mnt

    ```


    Then do the following:


    ```

    lilo -v -r /mnt

    ```'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# E.7 Using Red Hat Linux


    Record the output of the command. You can add more -v''s if you need more information.
