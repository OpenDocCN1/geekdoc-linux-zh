- pgno: 209
  md: '# C.1.9 Networking


    This section contains network-related packages.


    lynx – (Version 2.8, 1,916K) This terminal based WWW browser. While it does not
    make any attempt at displaying graphics, it has good support for HTML text formatting,
    forms, and tables.


    ncftp – (Version 2.4.3, 170K) Ncftp is a ftp client with many advantageous over
    the standard one. It includes command line editing, command histories, for recursive
    guests, automatic logins, and much more.


    tcpdump – (Version 3.4a5, 186K) Tcpdump prints out the headers of packets on a
    network interface. It is very useful for debugging network problems and security
    operations.


    wget – (Version 1.5.0, 346K) GNU Wget is a freely available network utility to
    retrieve files from the World Wide Web using HTTP and FTP. It works non-interactively,
    thus enabling work in the background, after having logged off.


    The recursive retrieval of HTML pages, as well as FTP sites is supported – you
    can use Wget to make mirrors of archives and home pages, or traverse the web like
    a robot WWW (Wget understands /robots.txt).


    Wget exceeds well on slow or unstable connections, keeping the document until
    it is retrieved. Re-getting files from where it works off on servers (both HTTP
    and FTP) that support it. Matching of wildcards and recursive mirroring of directories
    are available when retrieving via FTP Both HTTP and FTP retrievals are time-stamped,
    Wget can see if the remote file has changed since last retrieval and automatically
    retrieve the new version if it has.


    By default, Wget supports proxy servers, which can lighten the network load, speed
    up retrieval and provide access behind firewalls. However, if you are behind a
    firewall that requires you use a socks style gateway, you can get the socks library
    and compile wget with for socks.


    Most of the features are configurable, either through command-line options, or
    via initialization .wgetrc. Wget allows you to install a global startup file (/usr/local/lib/wget
    by default) for site settings.


    # C.1.10 News


    This section contains packages that you can read to on-line newsgroups.


    slrn – (Version 0.9.4.3, 303K) Slrn is an easy to use but powerful full-screen
    NNTP newsreader. It relies extensively on the S-Lang programmer’s library for
    many of its features. Slrn particularly particularly well over slow network connections.'
  merge: -1
  img_proc: true
