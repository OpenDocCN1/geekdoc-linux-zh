    — if the partition is mounted, you will get an error and you will have to unmount
    it first.


    +   - Edit: Brings up a dialog box where you can edit the mount point, mount options,
    etc.


    # 9.2 Adding NFS Mounts


    To mount a filesystem by NFS, select Add Mount from the NFS menu. A dialog box
    will appear and you will have to fill in the following values:


    +   - Device: Enter the host name and path, separated by a colon: For example,
    foo.bar.com:/usr/exported indicates the /usr/exported directory on foo.bar.com.


    +   - Mount Point: Enter the directory on your machine where you want to mount
    the NFS filesystem. For example, /mnt/foo.


    +   - Options: Enter the options for this filesystem. The default is soft,intr.
    The rw means the filesystem is read-write, and soft,intr make your mount page
    a more resilient when the remote server goes down. See the mount page for a complete
    list of available options.


    +   - Comment: This optional field can be used to store a small comment.


    After filling everything properly, click on OK. At this point the entry is made
    in your /etc/fstab, the filesystem is not actually mounted. To mount it, select
    it in the main window and click Mount.


    # 9.3 Printer Configuration


    The printer configuration tool (printtool) maintains /etc/printcap, print spool
    directories, and print filters. The filters allow you to print many different
    types of files, including:


    +   - plain text (ASCII) files


    +   - PostScript files


    +   - TeX .dvi files


    +   - GIF, JPEG, TIFF, and other graphics formats'
