- pgno: 86
  md: '# 5


    # Finishing the Installation


    # 5.1 Configuring a Mouse


    Next, the installation program will probe your system and try to find a mouse.
    Some mice may be detected automatically; in this case, a dialog box is displayed
    showing the port on which the mouse was found. Press Space to continue. You may
    then be asked to give additional information, such as whether you have a two-button
    mouse, and would like it to emulate a three-button mouse. Make the appropriate
    selections, and continue to the next section.


    If your mouse was not detected automatically, you will be asked to identify the
    type of mouse you have, and whether or not you have a two-button mouse and would
    like it to emulate a three-button model. Following this screen, you will! be asked
    to identify the serial port to which your mouse is connected. Select the appropriate
    serial port, and press Enter. You can then continue to the next section.


    If you wish to change your mouse configuration after you have booted your Red
    Hat Linux system, you may use the /usr/sbin/mouseconfig command.'
  merge: -1
