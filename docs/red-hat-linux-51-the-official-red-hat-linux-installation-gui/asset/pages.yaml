- pgno: 10
  md: '# # Introduction to the Macmillan Digital Publishing Edition


    (Editor’s Note: This manual is derived from the original Red Hat Linux 5.1 Official
    Installation Guide produced by Red Hat Software, Inc. This introduction has been
    added to stress issues of purchasing importance, particularly to first-time Linux
    users.)

    \Digital Publishing to document features that are unique to our version of Red
    Hat Linux, or to


    Thanks for purchasing the Complete Red Hat Linux 5.1 Operating System! This award-winning
    operating system brings true multi-tasking and the power of a UNIX workstation
    to your Intelprocessor PC.


    Please Note: Linux is not an add-on to DOS. It is a complete operating system,
    so it’s very important that you read this manual before installing the software.
    While Red Hat Linux is the easiest version of Linux to install, it is not like
    installing Windows or DOS on your machine. If you’ve never installed Linux before,
    please take the time to read the installation-related chapters before starting
    to install Red Hat Linux.


    # ## Minimum System Requirements


    Before you install Red Hat Linux, make sure your computer has the following minimum
    hard-ware and software requirements. Note that your experience using Red Hat Linux
    will be sub-stantially enjoyable if your system exceeds these minimum requirements,
    particularly in the areas of the RAM and free hard drive space.


    +   - IBM-compatible PC

    - Intel-compatible ‘386, ‘486, Pentium, Pentium Pro, or Pentium II processor

    - SCSI or IDE CD-ROM drive

    - 8MB RAM (16MB or more highly recommended)'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Introduction


    +   * 3.5 inch diskette drive (as drive A)

    * 40MB hard drive space (character mode)

    * 100MB hard drive space (with Window System)

    * Internet connection required for Internet software


    **Please Note:** Red Hat supports the widest possible range of PC hardware, sound
    cards, video cards (and monitors), laser (and dot-matrix) printers, Ethernet network
    cards, and other specialized peripherals. To ensure compatibility with your PC''s
    hardware, check the hardware compatibility list at

    http://www.redhat.com/support/docs/hardware.html.


    # New to Linux?


    **Please Note:** If you are new to Linux and this is your first installation,
    then you should read this section; otherwise, you can skip ahead to the “Electronic
    Resource Library” section on page xi.


    Many users who install Linux the first time wonder "Where are the .EXE files?”
    You’ll find that Linux does not use file extensions like DOS or Windows. All programs
    reside in the various bin directories on your hard drive (/bin, /usr/bin, and
    /X11R6/bin are but a few of these directories). These directories contain binary
    executables that run when you enter their name as a command. For example, the
    ls command runs /bin/ls, while the less command runs /usr/bin/less, and so on.


    Another item that confuses new users – Linux is case sensitive. For example, if
    you see a program called Lynx and want to run it, you must type it exactly the
    way it appears – lynx, LYNX, or other variables will not work.


    With MS-DOS, directories are separated with the backslash character: \. For example,
    the System subdirectory of the Windows directory would be Windows\System. However,
    you must use the forward slash character /. For example, the local subdirectory
    of the usr directory would be /local.


    When you need to read a CD-ROM, you must first mount the CD-ROM. The mount command
    makes the CD-ROM available to the Linux system. With DOS, Windows, and Macintosh
    systems, CD-ROMs automatically mount when you insert them in the drive. This manual
    and the electronic books contain more information on mounting CD-ROM and hard
    drives. Here’s a quick overview:


    You must have a directory that will serve as your CD-ROM''s mount point. You can
    create a directory with the mkdir command. For example:


    ```

    mkdir /mnt/cdrom

    ```


    Next, you would issue a mount command to mount the CD-ROM on the mount point:'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Introduction


    mount /dev/cdrom /mnt/cdrom


    Please Note: The device specification /dev/cdrom used above may not correspond
    to your CD-ROM drive. If you have a SCSI CD-ROM drive, you should use /dev/scd0.
    If you have an ATAPI key (also known as IDE) CD-ROM drive, your device name will
    be /dev/hdX, where X is a single letter (normally in the range a d). You can use
    the dmesg command to see the name given to your CD-ROM drive when the Linux kernel
    booted.


    After you mount the CD-ROM, you can view its contents by looking in the mount
    point (/mnt/cdrom in our example). You''ll need to use the unmount command to
    unmount the CD-ROM in order to change directories (for example, /mnt/cdrom). Note
    if you changed directory “into” the CD-ROM, the command will fail with a device
    is busy error. If this happens, simply change directory “out” of the CD-ROM (for
    instance, cd /).


    Another hint that will save you typing is to use the Tab key to automatically
    complete commands and filenames. For example, if the file you want to run is xloadImage,
    all you need to type is the beginning of the filename, followed by Tab. If the
    system can unambiguously identify the filename, the complete filename will appear;
    otherwise, the system will beep at you, prompting you to enter more of the filename.


    # The X Window System


    If you are new to Linux, your enjoyment of the operating system will be heightened
    by installing the X Window System. X is a graphical user interface that uses windows
    (not to be confused with Microsoft ® Windows®) that may be moved and resized on
    your screen. However, like Microsoft Windows, the X Window System allows you to
    operate in a graphical point-and-click environment. Red Hat Linux uses a version
    of X known as XFree8.


    Please Note: While an X session looks similar to a Windows session, X does not
    act the same as Windows: For example:


    +   * When typing in a text box, some configurations will require you to first
    click on the window, while others only require the pointer to be placed within
    the window.

    * X, in general, does not support Drag and Drop operations, or associating file
    extensions with specific applications. Therefore, double-clicking on a spreadsheet
    file may not do what you''d expect.


    # Electronic Resource Library


    The following Sams Publishing books have been provided in electronic format on
    CD-ROM 1. These books are in Adobe Acrobat format:


    +   * Selected chapters of Red Hat Linux Unleashed, by Kamran Husain, Timothy
    Parker, et al'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Updated Information


    Chapter 2 of the Apache Server Survival Guide is not applicable to Red Hat Linux
    5.1. This chapter pertains to the installation and basic configuration of Apache.
    Red Hat Linux uses RPM (the Red Hat Package Manager). RPM allows you to pick and
    choose linux "packages”(programs and associated data) that you want to add to
    your system. Therefore, you do not need to manually install Apache as detailed
    in the Survival Guide; RPM will do it for you.


    # Location of Electronic Books


    The electronic books are available in the following location on CD-ROM 1:


    +   * Red Hat Linux Unleashed (selected chapters) - /ebooks/redhatu.pdf

    * Apache Server Survival Guide - /ebooks/apache.pdf (there are accompanying files
    from the original book''s CD-ROM in /ebooks/apaches/cd).

    * Teach Yourself Unix in 24 hours - /ebooks/24unix.pdf


    # Adobe Acrobat Reader


    To view the Acrobat versions of the electronic books, you must install the Adobe
    Acrobat Reader, which is located on CD-ROM 1, in the file:


    ```

    /ebooks/acroread_linux_30.tar.gz

    ```


    After creating a temporary directory on your hard drive, use cd to change directory
    into temporary directory, and issue the following command:


    ```

    tar xvf /ebooks/acroread_linux_30.tar.gz

    ```


    The newly-created file INSTGUID.TXT, and follow the directions carefully to complete
    the installation. After you install the software, the reader will typically be
    /usr/local/Acrobat3/bin/acroread. While running the X Window System, type the
    complete filename (with path) to start the reader.'
  merge: -1
  img_proc: true
- pgno: 14
  md: "# Introduction\n\n# Using the Acrobat Reader\n\nIf you haven't used Adobe Acrobat\
    \ before, there are a few tips to help you get started.\n\nThe Acrobat Reader\
    \ allows you to easily navigate documents, search for words in the document, and\
    \ jump from the table of contents to the area of interest using hyperlinks. The\
    \ Acrobat buttons on the tool bar are there to help you control the reader's basic\
    \ operation (See Figure 1).\n\n![](img/8bb6f9e02d94ee86ffae5ba26ac08ce9_14_0.png)\n\
    \n> Figure 1: Adobe Acrobat Reader\n\nYou'll notice the buttons are divided into\
    \ six groups. Let's take a look at these button groups, from left to right:\n\n\
    +   * The first three buttons control the Acrobat Reader's screen layout. Only\
    \ one of these buttons may be depressed at a given time. They produce the following\
    \ layouts:\n  - Page image only – The screen will consist the page image of the\
    \ Acrobat document being displayed.\n  - Browser and page image – The screen will\
    \ consist of two panes: On the left, a hierarchical browser, allowing you to quickly\
    \ find the desired section of the Acrobat document being displayed. The right-hand\
    \ pane contains the page image.\n  - Thumbnail and page image – The screen will\
    \ consist of two panes: On the left, thumbnail images of each page in the Acrobat\
    \ document being displayed. The right-hand pane contains the current page.\n\n\
    The next three buttons control how you can interact with the Acrobat Reader. Only\
    \ one of these buttons may be depressed at a given time:"
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Introduction


    +   - "Hand" scrolling - When depressed, this button allows you to scroll (vertically
    and horizontally) using your mouse. Simply point at the part of the document you’d
    like to "grasp", press the primary mouse button, and drag. The document will scroll
    in the direction you drag.

    - Magnification control - When depressed, this button allows you to set the magnification
    applied to the document. Simply point at the part of the document you’d like to
    magnify, and press the primary mouse button. The document will be magnified, with
    the point you selected at the center of the screen.

    - Text selection - When depressed, this button allows you to select text for copying
    using the mouse. Simply point at the part of the document you’d like to select,
    and press the primary mouse button. Drag to the end of the text you’d like to
    copy, and release the primary mouse button. You may then paste the selected text
    into another window (Under X, this is most often done using the center button
    on a three-button mouse, or by pressing both buttons simultaneously on a two-button
    mouse).


    The group of buttons control navigation through the Acrobat document being displayed:


    +   - First page - This button will take you directly to the first page of the
    Acrobat document being displayed.

    - Previous page - This button will take you to the previous page of the document.

    - Next page - This button will take you to the next page of the Acrobat document
    being displayed.

    - Last page - This button will take you directly to the last page of the document.


    The group of buttons allows you to retract your steps through the document:


    +   - Previous historical page - This button will take you to the page that you
    had displayed last.

    - Next historical page - This button will take you to the next page in your list
    of pages displayed. This button is only active if you’ve used the Previous historical
    page button at least once.


    The group of three buttons control how each page is to be displayed on your screen:


    +   - Actual size - This causes each page to be displayed at its actual size.

    - Fit page - This causes each page to be displayed at the largest size that can
    fit entirely within the Acrobat Reader’s window.

    - Fit width - This causes each page to be displayed at the largest size that fits
    within the width of the Acrobat Reader’s window.


    The last button (in a group of its own) allows you to search the document for
    the occurrence of any text you specify. A dialog box will appear allowing you
    to enter the search string, as well as to control case sensitivity, whole-word
    matching, and the like.


    Additional help is available within the Acrobat Reader.'
  merge: -1
  img_proc: true
- pgno: 16
  md: "# Introduction\n\n# Using the Backup and Restore Utility (BRU 2000 PE)\n\n\
    The personal edition of BRU is included in version 5.1 of Red Hat Linux. BRU is\
    \ a high performance, reliable backup utility from Enhanced Software Technologies,\
    \ Inc. BRU 2000 PE does not support the following features that are available\
    \ in the standard edition of BRU:\n\n+   - Network-oriented backup operations,\
    \ including:\n  - Provisions for the backup of \"raw\" partitions/devices\n  -\
    \ Provisions for fifo-based controls (BRUTALK)\n  - Double-buffered I/O\n\n+ \
    \  - File renaming during restore\n\n+   - Tape overwrite protection\n\nHowever,\
    \ tapes created with other releases of BRU are fully compatible with the Personal\
    \ Edition, and tapes created with the Personal Edition are compatible with the\
    \ BRU's standard edition.\n\nThe following information will help you get started\
    \ using BRU.\n\nHere is a list of the various modes and options that BRU provides:\n\
    \n+   - c - Create (backup) a BRU backup volume\n- x - Extract (restore) files\
    \ from a BRU backup volume\n- t - Table of contents (file list) of a BRU backup\
    \ volume\n- i - Inspect (verify) the contents of a BRU backup volume\n- e - Estimate\
    \ the number of volumes a BRU backup will require\n- d - Difference (compare)\
    \ the contents of a BRU backup volume with the original files on the system.\n\
    - v - Verbosity level (up to four v's may be specified)\n- f - What backup device\
    \ should be accessed\n\nBRU's command line looks like this:\n\n```\nbru - (mode)\
    \ - (options) -f (device) (path)\n```"
  merge: -1
  img_proc: true
- pgno: 17
  md: 'With these basic modes and options, all backup and restore functions can be
    performed. For example, to backup the contents of the entire system to the first
    SCSI tape drive, issue the following BRU command:


    ```

    bru -cvf /dev/nst0 /

    ```


    This will backup the entire system to the tape drive nst0.

    To examine the contents of a tape made in this manner, issue this command:


    ```

    bru -tvf /dev/nst0

    ```


    Note that it is not necessary to specify a file path to obtain a listing of the
    tape.

    To restore the entire backup to its original path, issue this command:


    ```

    bru -xvf /dev/nst0

    ```


    This would automatically restore all files to their original locations.

    To verify the contents of a BRU backup volume, there are two mechanisms available.
    The first is recommended, as it requires only the tape drive and BRU. This is
    the Inspect -i) mode:


    ```

    bru -ivf /dev/nst0

    ```


    This command re-reads each block written on the backup volume, and recalculates
    the 32-bit CRC (Cyclic Redundancy Check). BRU compares the calculated CRC with
    the CRC that was written to tape. If the two CRCs do not match, BRU will warn
    you that the checksum is bad for the file in which the error occurred.

    The second mechanism requires both the backup volume and the original data. This
    mechanism uses the Difference (-d) mode:


    ```

    bru -dvf /dev/nst0

    ```


    This command reads the data from tape, and performs a bit-by-bit comparison with
    the original data from your system. Of course, this command will report problems
    if files have changed on your system since the backup was made. Introduction'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Preface


    Welcome! And thanks for your interest in Red Hat Linux. We have what we think
    is the best Linux distribution on the market today, and we work hard to keep it
    that way. Red Hat Linux 5.1 is the latest in a long line of software from Red
    Hat Software. We hope you like it, and that you enjoy using Red Hat Linux as much
    as we''ve enjoyed making it for you.


    It''s interesting to note that, while Linux is popular and well-known by a certain
    segment of the computer-using population, there are many people out there now
    hearing about Linux. For this group of people, the following section should provide
    enough background to help you get acquainted with Linux and Red Hat Software.


    # What is Linux?


    Back in August of 1991, a student from Finland began a post to the comp.os.minix
    newsgroup with the words:


    > Hello out there using minix -

    I''m doing a (free) operating system (just a hobby,

    won''t be big and professional like gnu) for

    386 (486) AT clones.


    The student was Linux Torvalds, and the “hobby” he spoke of eventually became
    what we know today as Linux.


    A full-featured POSIX-like operating system has been developed not just by Linux,
    but by hundreds of programmers around the world. The interesting thing about this
    is that this is massive, world-wide development effort is largely uncoordinated.
