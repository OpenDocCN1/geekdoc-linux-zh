    returned along with all files in the directory.


    #  7.1.5 "info" Pages


    While man is the most ubiquitous documentation format, info is much more powerful.
    It pro-

    vides hypertext links to make reading large documents much easier and many features
    for the

    document writer. There are some very complete info documents on various aspects
    of

    Red Hat (especially the portions from the GNU project).


    To read info documentation, use the info program without any arguments. It will
    present you

    a with list of available documentation. If it can''t find something, it''s probably
    because you don''t

    have the package installed that includes that documentation. Install with RPM
    and try again.


    If you''re comfortable using emacs, it has a built-in browser for info documentation.
    Use the

    `Ctrl-h` key to see it use.


    The info system is a hypertext based system. Any highlighted text that appears
    is a link leading

    to more information. Use `Tab` to move to the cursor, and press `Enter` to follow
    the link.

    Pressing `P` returns to the previous page, `n` moves to the next page, and `u`
    goes up one

    level of documentation. To exit info, press `Ctrl-x` `Ctrl-c` (control-x followed
    by control-c).


    The best way to learn how to use info is to read the info documentation on it.
    If you read the

    first screen that info presents you''ll be able to get started.'
