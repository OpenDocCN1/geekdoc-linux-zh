  md: '# D3 Ethernet parameters


    Some examples would be:


    | Configuration | Example |

    | --- | --- |

    | Adaptec AHA1522 at port 330, IRQ 11, SCSI ID 7 | aha152x=0x330,11,7 |

    | Adaptec AHA1542 at port 330 | bases=0x330 |

    | Future Domain TMC-800 at CA000, IRQ 10 | controller.type=2, base.address=0xca00
    irq=10 |


    When a parameter has commas, make sure you do not put a space after a comma.


    # D3 Ethernet parameters


    Most ethernet drivers accept parameters to specify a base IO address and an IRQ
    as follows:


    ```

    io=base_addr irq=irq

    ```


    For example, for the 3com 3c509 ethernet card located at IO address 210 (IO addresses
    are usually in hexadecimal) and IRQ 10, use the following parameters for the 3c509
    driver:


    ```

    io=0x210 irq=10

    ```


    You can use multiple ethernet cards in one machine . If each card uses a different
    driver (e.g., 3c509 and a DE425), you simply need to add aliases (and possibly
    options) for each card to /etc/conf.modules;for example:


    ```

    alias eth0 3c509

    options 3c509 io=0x210 irq=10

    alias eth1 de4x5

    options de4x5 io=0

    ```


    See 9.6 on page 128 for more information.


    However, if any two ethernet cards use the same driver (e.g., 3c509''s or a 3c595
    and a 3c905), you will need to compile a custom kernel with the ethernet driver
    built in. In that case, you can use the "classic" LILo boot : parameters of the
    form:


    ```

    ether=irq,base.addr,interface

    ```


    For example:'
  merge: -1
  img_proc: true
- pgno: 263
  md: '```

    LILO boot: linux ether=10,0x210,eth0 ether=11,0x300,eth1

    ```


    (For more information about using more than one ethernet card, see the Multiple-Ethernet
    mini-HOWTO.)'
  merge: -1
