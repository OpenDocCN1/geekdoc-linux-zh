- pgno: 68
  md: 'The HTTPTunnel is a Kali Linux tunneling software. It can create tunnels through
    network connections. It basically has two components.


    The client-side that exists behind a firewall and will accept connections to ports
    that are connected to a remote server or will play the role of SOCKS proxy. The
    authentication source for SOCKS source can be a list of fixed users that is fetched
    from a MySQL or LDAP directory. The client component is a Perl script that is
    independent of platform or is also available as a Win32 binary.


    The server-side component exists on the Internet to which the client makes HTTP
    requests. The server side then translates and forwards these requests to network
    connections on upstream servers, which are remote.


    There are two available servers. The first one is a web server that essentially
    hosts a PHP script. The PHP script that you host on the web server will allow
    your web server to act as the server to run HTTP tunnel.


    The second server is a standalone server that runs a Perl script independent of
    the platform or a Win32 binary. If you have your own box like a home computer,
    which is connected to the Internet, it can be used as a standalone server. The
    hosted server may pose restrictions to the PHP script (such as maximum execution
    time for the PHP script which will result in limiting the time for your connections)
    that you are hosting on it based on the company that is providing you the hosted
    server. Therefore, having a standalone server of your own has an advantage over
    the hosted server as you have complete access to your home computer.


