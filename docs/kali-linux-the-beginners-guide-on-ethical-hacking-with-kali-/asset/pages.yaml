  md: '# ## Chapter Seven: Wireless Attack Tools


    In this chapter, we will look at various tools that are available in Kali Linux,
    which can be used for penetrating wireless devices and other devices that are
    accessible through wireless networks.


    # ### Aircrack


    Aircrack is a Kali Linux tool, which is used for cracking passwords wirelessly
    and is the most popular tool in the world for what it does. It is used for cracking
    keys of 802.11 WEP and WPA-PSK around the world. It tries to figure out the password
    from the packets that are being transmitted by analyzing the packets that were
    caught by it initially. It can also recover the password or crack the password
    of a network by implementing FMS attacks that are standard in nature by optimizing
    the attack to some extent. PTW attacks and KoreK attacks are some of the optimizations
    used to make the attack work faster than other tools, which are used for cracking
    WEP passwords. Aircrack is a powerful tool and is used the most all over the world.
    The interface it offers is in console format. The company that has manufactured
    Aircrack offers online tutorials to get hands-on experience.


    # ### AirSnort


    AirSnort is another Kali Linux tool that is used for cracking passwords of wireless
    LANs and is extremely popular. Wi-Fi802.11b network’s WEP keys can be cracked
    by using AirSnort. This tool basically monitors the packets that are being transmitted
    on the network passively. When it has sufficient packets, it computes the encryption
    key from the packets it has gathered. AirSnort is available for free on both Linux
    and Windows platforms and is fairly simple to use as well. The tool has not seen
    any development or updates in 3 years, but the company that created the tool is
    now looking to develop and maintain it further. The tool due to its direct involvement
    in cracking WEP is popular around the globe.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# ## Kismet


    Kismet is another Kali Linux tool that is basically used in troubleshooting issues
    on wireless networks. It can be used with any Wi-Fi device, which supports rfmon,
    which is a monitoring mode. It is available on most of the platforms that include
    Linux, Windows, OS X, and other BSD platforms. Kismet again collects packets passively
    to understand the network standard and can also detect networks that are hidden
    in nature. It is built on the client-server architecture, and it can sniff traffic
    from 802.11b, 802.11a, 802.11g, and 802.11n. It supports the recent wireless standards,
    which are faster as well.


    # ## Cain & Able


    Cain & Able is Kali Linux tool that is popular amongst penetration testers for
    its ability to crack wireless networks. The tool was originally developed to intercept
    traffic on a network. Later developments turned it into a tool that could brute
    force its way into cracking passwords of wireless networks. The tool analyzes
    routing protocols of a network and helps in finding the passwords of the network.
    Using this tool, you can intercept network traffic and then initiate brute force
    attacks to find the password.


    # ## Fern Wi-Fi Wireless Cracker


    Fern Wi-Fi Wireless Cracker is another Kali Linux tool that is very helpful with
    respect to network security. The tool helps you identify hosts by monitoring all
    network traffic in real-time. The tool was initially developed to detect flaws
    on networks and fix the flaws that were detected. The tool is available on Linux,
    Windows, and Apple platforms.


    # ## Reporting Tools'
