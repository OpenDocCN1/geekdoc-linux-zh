- pgno: 50
  md: 'The Crackle tool is a Kali Linux tool, which is used as a brute force utility.
    It can detect and intercept traffic between Bluetooth devices. The pairing code
    used between Bluetooth devices is mostly 4-6 digits and is in an encrypted format.
    Crackle can decrypt these codes, and you can then intercept all communication
    that happens between the Bluetooth devices.


    # **JBoss-Autopwn**


    JBoss-Autopwn is a penetration-testing tool used in JBoss applications. The Github
    version of JBoss Autopwn is outdated, and the last update is from 2011. It is
    a historical tool and not used much now.


    # ***Linux Exploit Suggester***


    The Linux Exploit Suggester tool provides a script that keeps track of vulnerabilities
    and shows all possible exploits that help a user get root access during a penetration
    test.


    The script uses the uname -r command to find the kernel version of the Linux operating
    system. Additionally, it will also provide the -k parameter through which the
    user can manually enter the version for the kernel of the Linux operating system.


    # ***sqlmap***


    The sqlmap Kali tool is a free and open-source tool that is used for penetration
    testing. Using this tool, you can detect vulnerabilities in SQL databases and
    therefore, perform SQL injections. The detection engine on this tool is extremely
    powerful, and it has a range of tools that can perform extreme penetration allowing
    a user to fetch information such as data from databases, database fingerprinting,
