    when space constraints are faced on the system.


    +   * `tar cf file.tar files` Creates an archive called `file.tar` which contains
    the `files`

    +   * `tar xf file.tar` Extract the content from the file names `file.tar`

    +   * `tar czf file.tar.gz files` Creates an archive called `file.tar.gz` which
    contains the `files` using the GZip compression

    +   * `tar czf file.tar.gz` Extract the content from the file names `file.tar.gz`
    using GZip

    +   * `tar cjf file.tar.bz2` Creates an archive called `file.tar.bz2` using the
    BZip2 compression

    +   * `tar xjf file.tar.bz2` Extract the content from the file names `file.tar.bz2`
    using BZip2

    +   * `gzip file` Compresses a given `file` and renames is to `file.gz`

    +   * `gzip -d file.gz` Decompresses the `file.gz` file to file again


