  md: '# Chapter Five: Basics of Cybersecurity


    # What is Cybersecurity?


    The process of securing a computer or a server, network, and data from attacks
    that are digital in nature is known as Cyber Security. It is a counter to cyber-attacks.


    Cyber Attacks aim at getting unauthorized access to systems and modifying or destroying
    information on those systems. In return, hackers or attackers extort money from
    the owners of these systems, or sometimes just to interrupt normal business activity.


    Cybersecurity today has become a challenging task because there are more systems
    in contrast to the number of people in the world, and attackers are getting more
    creative an innovative day by day.


    Let us try to understand how attacks are implemented using viruses, trojans, and
    worms.


    # Viruses


    A computer virus is a code snippet also known as malware which integrates itself
    with the code of genuine software on a system and becomes part of it. It spreads
    from one computer to another via a network or even via offline modes such as USB
    drives and hard disks. The impact of a virus can range from just being somewhat
    annoying to completely destroying a system. Viruses make executable files their
    host, which means that a virus cannot activate itself unless a user manually executes
    the file which is hosting the virus. Therefore along with the execution of the
    host file, the virus code gets executed too.


    # Worms


    Worms can be considered to be just like viruses as their function is the same.
    They replicate themselves on a system and end up damaging the system in'
  merge: -1
  img_proc: true
- pgno: 46
  md: 'some way or another. The difference between a worm and a virus is that unlike
    a virus, worms do not need a host file to activate and are independent software.
    Worms can spread by exploiting some kind of vulnerability on the system, or they
    make the user execute them by tricking them into doing so.


    # Trojans


    A trojan is again a malware which derives its name from the myth of the wooden
    horse that was used by the Greeks to get inside of Troy. Just like the wooden
    horse, a trojan is a software which is harmful from the inside but looks completely
    legitimate from the outside. Therefore a naive user may think of it as legitimate
    software and will end up executing it on their system. Once a trojan is activated,
    it can help create multiple attacks on the host system which range from annoying
    a user by popping up irrelevant windows to completely destroying the host system
    by deleting data on it. The difference between a trojan and a virus is that a
    trojan does not keep replicating itself.


    The effect of viruses, worms, and trojans lead to the classification of the motive
    with which they were created.


    # Ransomware


    If a virus, worm or a trojan was planted on a system so as to lock the system
    down for its actual user, and demands money in order for it to be unlocked again,
    it is called Ransomware.


    # Spyware


    If a virus, worm on a trojan was planted on a system so as to spy on the user
    and gain access to their system and all the activities on their system, it is
    called Spyware.


    # Adware


    If a virus, worm or a trojan was planted on a system so as to create popup ads'
  merge: -1
  img_proc: true
- pgno: 47
  md: on a user's genuine software to generate revenue from it, it is known as Adware.
  merge: -1
  img_proc: true
- pgno: 48
  md: '# Chapter Six: Kali Linux Tools


    We have discussed how Kali Linux comes with hundreds of pre-installed tools that
    can be used for security auditing and penetration testing. In this section, we
    will go through the different types of tools that are available in Kali Linux.
    The tools can be classified as per the tasks that are achieved by using them.
    The classification is as follows:


    +   Exploitation Tools

    +   Forensics Tools

    +   Information Gathering Tools

    +   Reverse Engineering Tools

    +   Wireless Attack Tools

    +   Reporting Tools

    +   Stress Testing Tools

    +   Maintaining Access Tools

    +   Sniffing and Spoofing Tools

    +   Password Attack Tools


    Let us now go through the tools available in each category one by one to understand
    their specific purpose.


    # Exploitation Tools


    If you consider a network over the Internet, which has a set of computers running
    on it, there are many applications in each system that can make that system vulnerable.
    This can happen due to many reasons such as bad code, open ports on the servers,
    etc., which make these systems easily accessible. This is where exploitation tools
    come into the picture. They help you target and exploit such vulnerable machines.
    But you are not an attacker, and therefore, these tools will help you identify
    and patch these vulnerabilities. Let us go through the available exploitation
    tools in Kali Linux one at a time.


    # Armitage


    Developed by Raphael Mudge, Armitage is a graphical user interface front-'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'end, which is to be used with the Metasploit framework. It is a tool that is
    available in the graphical form, and it is easy to use as it recommends exploits
    on a given system. The tool is open-source and free to use. It is most popular
    for the data it can provide about shared sessions and the communication it provides
    through a single instance of Metasploit. A user can launch scans and exploits
    on a system using Armitage, which will give the user data about available exploits.
    This, combined with the advanced tools available in the Metasploit framework,
    gives a user control over a vulnerable system.


    # The Backdoor Factory (BDF)


    The Backdoor Factory known as BDF is a Kali Linux tool that is used by researchers
    and security professionals. Using this tool, a user can slide in their desired
    code in the executable binaries of system files on application files. The tool
    executes the code without letting the system know that there is something additional
    happening along with the regular system or application processes.


    # The Browser Exploitation Framework (BeEF)


    As the name suggests, if you want to perform penetration testing on browsers,
    the Browser Exploitation Framework should be your go-to tool. Using this tool,
    you can also target a browser on the client-side if there are vulnerabilities
    present in it.


    # Commix


    Commix is a Kali Linux tool which allows users to test web applications. It has
    been very useful to set up test environments for web developers, penetration testers,
    and researchers. It performs injections into a web application and allows a user
    to identify bugs and errors. The tool has been developed in Python.


    # Crackle'
