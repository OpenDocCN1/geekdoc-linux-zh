- pgno: 9
  md: '# Introduction


    I want to thank you for choosing this book, *Kali Linux - The Beginner''s Guide
    on Ethical Hacking* with Kali. Basic Security Testing Concepts Explained to Prevent
    Cyber Terrorism and Understand the Basics of Cybersecurity and Hacking in General.


    Kali Linux is a flavor of Linux distributions which is based on the Debian architecture.
    It was developed with the vision of its application in the security domain by
    focusing mainly on Security Auditing and Penetration Testing. There are hundreds
    of tools which are pre-loaded in Kali Linux and used towards various tasks for
    information security. These include Penetration Testing, Security Research, Computer
    Forensics, Reverse Engineering, etc.


    It is developed and maintained by a company known as Offensive Security which
    is a world leader in information security training. The company also provides
    funds for the future development and maintenance of the operations system.


    This book is an introduction to Kali Linux. Every new user with decent experience
    in the Linux domain can start with Kali Linux. If your aim is to become a professional
    in the security domain and not misuse the power that comes with Kali Linux, then
    the information shared in this book should be enough to get started.


    It is, however, advisable for you to be a user of a simpler Linux operating system
    before beginning with Kali Linux. If you are just beginning to work with a Linux
    operating system or you don’t have the basic knowledge or competence to administer
    a system, or if you are just looking for an operating system to do your daily
    activities, Kali Linux is not the operating system that you may want to begin
    with.


    Even veteran Linux users can sometimes face a challenge while using Kali Linux.
    Given the fact that Kali Linux was made for security purposes, it is not a wide-open
    source project as compared to other Linux flavors, which work as open sources
    on a bigger scale. The development team consists of a very small number of users,
    and the packages developed for Kali Linux and committed to repositories, are signed
    by the individual developer first and then by the entire team.


    The upstream or third party repositories from which the packages are updated'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'or new packages are pulled is also very small. Adding software from repositories
    to your Kali operating system from third party sources that are not tested and
    verified by the Kali Linux team can cause harm to your system.


    To avoid this, let us read more about this and get started. Thank you once again
    for choosing this book.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# ## Chapter One: Features of Kali Linux


    Let us get an overview of the features of Kali Linux before deep diving into this
    book.


    # ### Penetration Testing Tools


    There are more than 600 tools available in Kali Linux for penetration testing.
    Comparing it to its predecessor BackTrack Linux, BackTrack had a lot of tools
    that were either not functional or just duplicates of other tools. The Kali Linux
    reboot has eliminated these tools.


    # ### Free to Use


    Just like its predecessor BackTrack Linux, Kali Linux is completely free of cost.
    The biggest advantage of being a Kali Linux user is that the operating system,
    along with its tools is free to use.


    # ### Open Source


    Kali Linux is committed to the model of Open Source, and therefore the Kali Linux
    development tree is available to everyone on the Internet. Gitlab has the source
    code of Kali Linux, which is publicly available to anyone who would like to customize
    Kali Linux as per their needs.


    # ### Compliance with FHS


    Kali complies with the Filesystem Hierarchy Standard, which is followed by all
    Linux flavors. This makes it easy for users to locate binaries, libraries, support
    files, etc.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Support for Wireless Devices


    Linux operating systems have a history of having compatibility issues with wireless
    devices. Kali Linux development ensured that this would be taken care of and Kali
    Linux is therefore compatible with all kinds of wireless hardware, thereby supporting
    USB and almost all wireless devices.


    # Custom Kernel


    Kali Linux Kernel comes equipped with the latest injection patches. As penetration
    testers, this helps the development team to conduct wireless assessments with
    ease.


    # Developed in a Secure Environment


    The team that develops and maintains Kali Linux includes a very small group of
    individuals. There is complete trust between the team to make commits to the Kali
    Linux packages and is achieved by using secure protocols through multiple channels.


    # GPG Signed


    Every developer who has worked on packages for Kali Linux signs it and subsequently,
    the repositories sign the package as well.


    # Language Support


    Most tools available on other platforms for penetration testing are usually developed
    in the English language. Kali developers have, however, ensured'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'that there is sufficient language support for users from around the world such
    that users can use the operating system in their native language and get tools
    in their native language as well to achieve their desired tasks.


    # ## Customizable


    Kali developers understand enough to know that not all users can accept their
    interface design. Therefore, they have made it very easy for the adventurous user
    to customize the system as per their requirement right from the top to the kernel.


    # ## Support for ARMEL and ARMHF


    ARM-based single-board devices such as the BeagleBone Black and Raspberry Pi are
    getting more and more popular among the users, mainly because they are inexpensive.
    Therefore, Kali Linux has been built in a way such that it is as robust as possible
    and has a fully functional installation that will support both ARMHF and ARMEL
    systems. A wide range of ARM devices are supported by Kali Linux and tools for
    ARM are kept up to date and at par with the rest of the distributions.


    # ## What’s Different about Kali Linux?


    Kali Linux was specifically developed for a professional community interested
    in tools related to penetration testing and security auditing. There are several
    aspects of Kali Linux, which help achieve this requirement.


    # ### Single User


    Linux operating systems usually come with one superuser called root and other
    regular users with fewer privileges than the root. Kali Linux, however,'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'comes with only the root user who has all access on the system. This was done
    because most of the tools that are used in Kali Linux demand root-level access.
    Hence, where most other flavors of Linux have a concept of summoning the root
    user only when necessary, Kali Linux users utilize the root user to decrease the
    burden of additional users.


    # Customized Kernel


    Kali Linux comes equipped with a kernel that is completely customized and patched
    for wireless injection.


    # Network Services Disabled


    All network-related services are disabled by default in Kali Linux. This is done
    by the systemd service in Kali Linux. We can ensure that the environment is more
    secure when the system is cut off from the rest of the Internet and applications
    can be installed without any fear. Bluetooth is also disabled by default.


    # Minimal Repositories


    There are very minimal and trusted repositories available in Kali Linux. Kali
    was developed for security, and therefore it makes sense to keep the operating
    system secure. Third-party applications are not available in Kali Linux, which
    helps achieve the goal of security. Advanced users attempt to add third-party
    repositories to Kali Linux by editing the sources list file, but in doing so,
    they increase the risk of break-ins on their Kali Linux operating system.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# # Chapter Two: Downloading and Installing Kali Linux


    It is very important that you download an image of Kali Linux only from an official
    source. This is because installation images of Kali Linux from third party sources
    pose a threat as they can be tampered with. Given the open-source nature of Kali
    Linux, a third party could easily modify the installation files and introduce
    malware into it, which will end up getting hosted on your system.


    You can download all official images for Kali Linux installations from the following
    link:


    [https://www.kali.org/downloads/](https://www.kali.org/downloads/)


    [https://www.offensive-security.com/kali-linux-vmware-arm-image-download/](https://www.offensive-security.com/kali-linux-vmware-arm-image-download/)


    # ## ISO Files for Intel-based PCs


    To be able to run Kali Linux “Live” by using a USB drive on a Windows PC or an
    Apple PC, you will need to download a 32-bit or a 64-bit ISO image of the Kali
    Linux installation.


    If you are unsure about the architecture of your current system, you can run the
    following command on the terminal in Linux or Apple OS X to know the architecture.


    ```

    uname -m

    ```


    If you get the response as “x86_64”, it indicates a 64-bit architecture, and you
    can use the 64-bit ISO image available on the website (the one that has “amd64”
    appended to it).


    If you get the response as “i386”, it indicates a 32-bit architecture, and you
    can download the 32-bit ISO image from the website (the one that has “i386” appended
    to it).


    If you are on a Windows system, you will find the architecture mentioned'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'under the “Device Type” header in system properties on your computer. You will
    find Kali Linux ISO images available for download from the website as both as
    a direct download file or as a torrent file.


    # ## ARM Images


    The hardware and architecture vary considerably on ARM-based devices. Therefore,
    it is not possible to maintain a single image for installation across various
    ARM-based devices. There are a varied set of pre-built images available for Kali
    Linux installation across a wide set of devices. If you want to build your own
    ARM images, scripts for building your custom ISO are available in the Kali GitHub
    repository.


    # ## VMware Images


    If you are using VMware and want to use Kali Linux as a “guest,” Kali Linux is
    available as a pre-built VMware machine with VMware tools already pre-installed.
    The image for VMware is available in 64-bit, 32-bit, 32-bit PAE formats.


    Let us go through the various ways in which you can install and use Kali Linux.


    # ## Kali Linux Bootable USB Drive


    This is the fastest and most convenient way to get Kali Linux up and running,
    as you will be running it “live” from a USB drive. There are many advantages to
    using this method, as well. Let us go through them one by one.


    # *Non-destructive*'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'There are no changes made to your physical machine or to the operating system
    that already resides on your machine as Kali Linux will run directly from a USB
    drive. You can simply unplug the USB drive, and you will be able to boot into
    your regular operating system on your machine without any extra effort.


    # Portability


    You can literally carry Kali Linux with you everywhere you go, since you can just
    keep it in a USB drive in your pocket. All you need to do is plug it into a system
    that is available to you, and you will be able to boot into Kali Linux.


    # Customizable


    We have already discussed that Kali Linux is open source and all its repositories
    are available publicly on GitHub. You can, therefore, use scripts available in
    the Kali Linux repository to build your custom Kali Linux installation image and
    load that on a USB drive too.


    # Persistence


    You can customize your Kali Linux USB to be persistent. This will allow it to
    store data on the USB and retain it across multiple reboots.


    In order to do this, we first need to create a bootable USB drive, which has been
    set up from an ISO image of Kali Linux.


    # Requirements to create a Kali Linux USB


    +   1. A verified copy of the Kali Linux ISO to suit the system that you intend
    to run or install it on.

    +   2. If you are using Windows, you will require the Win32 Disk Imager software
    to create the Kali Linux USB drive. On Linux or OS X, you can use the dd command
    on the terminal, which is pre-installed for creation of bootable USB drives.

    +   3. A USB drive which has a capacity of 4GB or more. If your system'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'supports an SD card slot, you could use an SD card as well with a similar process.


    Let us now go through the process of creating a Kali Linux Live USB drive. This
    process will vary based on the system that you are already using, namely, Windows,
    Linux, or MacOS.


    # Creating a Bootable Kali USB Drive on Windows


    +   1.  Plug the USB in the USB slot on your machine and note down which drive
    letter is designated to it. Launch the Win32 Disk Imager application that you
    had downloaded earlier.


    +   2.  Choose the ISO file for Kali Linux installation and ensure that you have
    selected the correct USB drive for it to be written to. Click on Write.


    +   3.  Once the writing to USB drive is complete, you can eject the drive and
    use it as a bootable USB drive to boot Kali Linux Live or install Kali Linux on
    your machine.


    # Creating a Kali Linux Bootable USB Drive on a Linux Operating System


    Creating a bootable USB drive is fairly simple in a Linux operating system. Once
    you have downloaded your Kali Linux ISO file and verified it, you can use the
    dd command on the terminal to write the file to your USB drive. You will need
    root or sudo privileges to run the dd command.


    > **Warning:** If you are unsure as to how to use the dd command, you may end
    up writing the Kali Linux image to a disk drive that you did not intend to. Therefore,
    it is extremely important to be alert while you are using the dd command.


    You will need to know the device path to be used for writing the Kali Linux image
    to the USB drive. Without having the USB drive inserted in the USB slot, execute
    the following command in the command prompt of the terminal window.


    ```

    Sudo fdisk -l

    ```'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'You will get an output that shows you all the devices mounted on your system,
    which will show the partitions as:


    /dev/sda1


    /dev/sda2


    Now, plugin the USB drive and run the same command “sudo fdisk -l” again. You
    will see an additional device this time, which is your USB drive. It will show
    up as something like


    /dev/sdb


    with the size of your USB drive next to it.


    Proceed to write the image carefully on the USB drive using the command shown
    below. The example assumes that the name of your Kali Linux ISO file is “kali-linux-2019.1-amd64.iso”
    and it is in your present working directory. The block size parameter bs can be
    increased but the ideal value would be ‘bs=512k’.


    dd if=kali-linux-2019.1-amd64.iso of=/dev/sdb bs=512k


    The writing to the USB drive will take a few minutes, and it is not abnormal for
    it to take a little more than 10 minutes to finish writing.


    The dd command will not show any output until the process is completed. If your
    USB drive has an LED, you will see it blinking which is an indicator that the
    disk write is in progress. Once the dd command has been completed, the output
    will be something like this.


    5823+1 records in


    5823+1 records out


    3053371392 bytes (3.1 GB) copied, 746.211 s, 4.1 MB/s


    That is the end of it. You can now use the USB drive to boot into Kali Linux Live
    or start and installation of Kali Linux on a machine.


    # **Creating a Kali Linux Bootable USB Drive on a MAC OS X Operating System**'
  merge: -1
  img_proc: true
- pgno: 20
  md: "Apple OS X is a Unix-based operating system, so creating a Kali Linux bootable\
    \ USB drive on OS X is similar to that of creating on in Linux. After downloading\
    \ and verifying your copy of the Kali Linux ISO, you can just use the dd command\
    \ to write the ISO to your USB drive.\n\nWarning: If you are unsure as to how\
    \ to use the dd command, you may end up writing the Kali Linux image to a disk\
    \ drive that you did not intend to. Therefore, it is extremely important to be\
    \ alert while you are using the dd command.\n\nYou can use the following steps\
    \ to write the ISO to your USB drive.\n\n+   1.  Without plugging in your USB\
    \ drive to your MAC desktop or laptop, type the following command on the command\
    \ prompt of the terminal window.\n+   \n+       Diskutil list\n\n+   2.  A list\
    \ of device paths showing all the disks mounted on your system will be displayed\
    \ along with the data of the partition.\n+   \n+       /dev/disk1\n+       /dev/disk2\n\
    \n+   3.  Now, plug in the USB and run the diskutil list command again. You will\
    \ see that the list now shows your USB drive as well. It will be the one that\
    \ did not show up the first time. Let us assume that it is\n+   \n+       /dev/disk6\n\
    \n+   4.  Unmount the USB drive using the following command (assuming the USB\
    \ to be /dev/disk6 )\n+   \n+       Diskutil unmount /dev/disk6\n\n+   5.  Proceed\
    \ further to carefully write the Kali Linux ISO on to your USB drive using the\
    \ following command. This is assuming that your present working directory is the\
    \ same as that in which your ISO file is saved. The block-size parameter bs can\
    \ be increased,"
  merge: -1
  img_proc: true
- pgno: 21
  md: "but the ideal value would be \"bs=1m\"\n\nSudo dd if=kali-linux-2017.1-amd64.iso\
    \ of=/dev/disk6 bs=1m\n\n+   The writing to the USB drive will take a few minutes,\
    \ and it is not abnormal for it to take a little more than 10 minutes to finish\
    \ writing.\n\n+   The dd command will not show any output until the process is\
    \ complete. If your USB drive has an LED, you will see it blinking which is an\
    \ indicator that the disk write is in progress. Once the dd command has been completed,\
    \ the output would be something like this.\n+   \n+   5823+1 records in\n+   5823+1\
    \ records out\n+   3053371392 bytes transferred in 2151.132182 secs (1419425 bytes/sec)\n\
    \nThat is the end of it. You can now use the USB drive to boot into Kali Linux\
    \ Live or start and installation of Kali Linux on a machine. To boot from the\
    \ desired drive on an OS X machine, press the “Option” button immediately after\
    \ the computer powers on and select the drive you wish to use.\n\n# Kali Linux\
    \ Installation Process on a Hard Disk Drive\n\nIn this section, we will learn\
    \ how to install Kali Linux physically on your system’s hard disk. This will enable\
    \ it to run directly from your hard disk drive and not from a USB drive as we\
    \ discussed in the previous section.\n\n# Installation Requirements\n\nThe Kali\
    \ Linux installation process is fairly simple and easy. Firstly, we need to get\
    \ a machine that has compatible hardware for the Kali Linux installation. Kali\
    \ Linux supports 32-bit, 64-bit, and ARM (armhf and armel) architectures."
  merge: -1
  img_proc: true
- pgno: 22
  md: 'We have already gone through the process of creating bootable USB media for
    Kali Linux ISO. If you have a DVD drive, you can also write the ISO image to the
    DVD to install Kali Linux on your machine.


    The minimum hardware requirements to install Kali Linux on a machine are as follows:


    +   1. A minimum disk space availability of 20 GB for the installation files.

    +   2. A minimum RAM capacity of 1GB. Although 2GB or more is recommended for
    better performance.

    +   3. A DVD drive or USB boot support to help with the Kali Linux installation.


    # Preparing for Installation


    You can prepare for the installation by having the following checklist ready.


    +   1. Download Kali Linux ISO as per your system’s architecture.

    +   2. Write The Kali Linux ISO to DVD or a USB drive using the tools mentioned
    in the previous chapter.

    +   3. Make sure that your computer is already set to allow a boot from a USB
    drive.


    # Kali Linux Installation Process


    +   1. To begin with the Kali Linux installation, boot with the installation medium
    that you have created, that is DVD or USB drive. You will be prompted with the
    Kali Linux boot screen. You can choose either graphical or text mode installation.
    It is ideal to continue with the graphical installation.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/6031898debbe03e0941612f75e0ccb51_23_0.png)


    2. Select the language that you require for the operating system followed by the
    country location. You will also be asked to choose the keyboard layout of your
    preference.'
  merge: -1
