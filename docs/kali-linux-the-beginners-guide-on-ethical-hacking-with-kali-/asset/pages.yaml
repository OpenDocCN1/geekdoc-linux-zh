  md: 'The report you get as a result of the penetration test that you have conducted
    is a key deliverable in an activity carried out for security assessment. The final
    deliverable of penetration testing is the report that gives a record of the service
    that was provided, the methods that were used, the findings or results of the
    tests and the recommendations that come as an output to better the security. Report
    making is most of the time ignored as it is found to be boring by many penetration
    testers. In this part, we will talk about the Kali Linux tools that are available
    to make the process of making reports simple. The tools help you store your penetration
    test results that can be referred to when you are working on making the report.
    The tools will also help you communicate and share data with your team.


    We are covering the two main tools, which are Dradis and Magic Tree.


    # ### Dradis


    The Dradis framework is an open-source Kali tool that functions as a platform
    to collaborate and report for security exports in the network security domain.
    The tool is developed in Ruby language and is independent of platform. Dradis
    provides the option to export reports, and all the activities can be recorded
    in one single report. Exporting the report in file formats that are PDF or DOC
    is currently only supported in the pro version and is missing from the community
    version.


    # ### Magic Tree


    Magic Tree is a Kali Linux tool that is used for reporting and data management,
    and it is much like Dradis. It is designed in a way such that data consolidation,
    execution of external commands, querying, and generation of reports becomes an
    easy and straightforward process. Kali Linux has this tool pre-installed, and
    it is located in the “Reporting Tools” category. It manages the host and its associated
    data using the tree node structure.


    # ### Magic Tree vs. Dradis


    Both Magic Tree and Dradis have been designed to solve the same set of problems
    i.e., data consolidation and report generation. Both Magic Tree and'
