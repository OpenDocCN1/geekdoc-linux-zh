- pgno: 70
  md: 'For example, if someone is requesting for example.com over the internet, a
    DNS proxy can be used to redirect them to an incorrect page over the internet
    as opposed to the real server on which the website for example.com resides.


    There are a lot of tools for DNS proxy available on the Internet. Most will allow
    you to point the incoming DNS queries to one single IP. DNSChef was developed
    a complete solution for a DNS proxy tool that would provide a user with every
    kind of configuration that is needed. As a result of this vision, DNSChef is a
    tool that works across all platforms and is capable of creating fake responses
    while supporting multiple types of DNS records


    The use of a DNS proxy is advisable in times when you cannot force a web application
    to use a specific proxy server. For example, there are some mobile applications
    that discard proxy settings in the OS HTTP settings. In cases like these, the
    use of a tool like DNSChef as a DNS proxy server will come handy. It will allow
    you to redirect the incoming HTTP request to the desired destination by tricking
    the application.


