- pgno: 51
  md: 'The Yersinia tool available in Kali Linux can be used to detect vulnerabilities
    in network protocols such that a user can take advantage of them. The framework
    of this tool is solid for testing and analyzing deployment of systems and networks.
    The attacks using this tool are layer-2 attacks that can be used to exploit the
    weaknesses in a layer-2 network protocol. Yersinia is used during penetration
    tests to start attacks on network devices such as DHCP servers, switches, etc.
    which use the spanning tree protocol.


    # *Cisco Global Exploiter*


    The Cisco Global Exploiter (CGE) tool is a security testing exploit engine/tool
    that is simple yet fast and advanced. There are 14 vulnerabilities that are known
    to exist in Cisco routers and switches. This tool can be used to exploit those
    vulnerabilities. The Cisco Global Exploiter is basically a perl script, which
    is driven using the command line and has a front-end that is simple and easy to
    use.


    # **Forensics Tools**


    In this section, we will go through the Kali Linux tools that are available to
    be used in the Forensics domain.


    # *chkrootkit*


    The chkrootkit tool can be used during a live boot of a system. It helps identify
    if there are any rootkits that are installed on the system. The tool helps in
    hardening the system and lets a user ensure that it is not vulnerable to a hacker.
    The tool can also be used to perform a system binary scan which lets a user know
    if there are any modifications made to the stock rootkit, string replacements,
    temporary deletions, etc. These are just a few of the things that this little
    tool can do. It looks like a fairly simple tool, but the power it possesses can
    be invaluable to a forensic investigator.


    *p0f*'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'The p0f tool is used when you want to know the operating system if a host that
    is being targeted. You can do this just by intercepting transmitted packages and
    analyzing them. It does not matter if the system has a firewall or not, the tool
    will still fetch you the information on the operating system. The tool is amazing
    as it does not lead to any extra traffic on the network, and its probes are not
    mysterious at all. Given all these features, p0f in the hands of an advanced user
    can help detect the presence of firewalls, use of NAT devices, and the presence
    of load balancers as well.


    # **pdf-parser**


    The pdf-parser tool can be used to parse a PDF file and identify all the elements
    used in the file. The output of the tool on a PDF file is not a PDF file. It is
    not advisable for textbook cases of PDF files, but it gets the job done. The use
    case of this tool is mostly to identify PDF files that may have scripts embedded
    into them.


    # **Dumpzilla**


    The Dumpzilla tool is developed in Python. This tool extracts all information
    that may be of interest to forensics from web browsers like Seamonkey, Mozilla
    Firefox, and Iceweasel.


    # **ddrescue**


    The ddrescue tool is often termed as a savior tool. It is used to copy data from
    one-block devices such as a hard disk drive to another block device. It is, however,
    called a savior because while copying data, it will copy all the good parts first,
    which helps to prevent read errors on the source block device.


    The ddrescue tool’s basic operation is completely automatic which means that once
    you have started it, you do not need to wait for any prompts like an error, wherein
    you would need to stop the program or restart it.


    By using the mapfile feature of the tool, data will be recovered in an efficient
    fashion, as it will only read the blocks that are required. You also have the
    option to stop the ddrescue process at any time and resume it again later from'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'the same point.


    # *Foremost*


    There are times when you may have deleted files on purpose or by mistake and realized
    that you needed them later. The Foremost tool is there to rescue you. This tool
    is an open-source tool that can be used to retrieve data off of disks that have
    been completely formatted. The metadata around the file may be lost, but the data
    retrieved will be intact. A magical feature is that even if the directory information
    is lost, it can help retrieve data by reference to the header or footer of the
    file, making it a fast and reliable tool for data recovery.


    An interesting fact is that Foremost was developed by special agents of the US
    Air Force.


    # *Galleta*


    The Galleta tool helps you parse a cookie trail that you have been following and
    convert it into a spreadsheet format, which can be exported for future reference.


    Whenever a cybercrime case is ongoing, cookies can be used as evidence. But understanding
    cookies in their raw format is a challenging task. This is where the Galleta tool
    comes handy as it helps in structuring the data fetched from cookie trails and
    can be then run through other software to decode the data further. This software
    needs the input of the date to be in a spreadsheet format, and that is exactly
    what Galleta feeds into this software.


    # ## **Information Gathering Tools**


    The prerequisite for any attack is information. It becomes very easy to target
    a system when you have sufficient information about the system. The success rate
    of the attack is also on the higher side when you know everything about the target
    system. All kinds of information are useful to a hacker, and nothing can be considered
    as irrelevant.'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'The process of information gathering includes:


    +   •  Gathering information that will help in social engineering and, ultimately,
    in the attack


    +   •  Understanding the range of the network and computers that will be the targets
    of the attack


    +   •  Identifying and understanding all the complete surface of the attack, i.e.,
    processes, and systems that are exposed


    +   •  Identifying the services of a system that are exposed and collecting as
    much information about them as possible


    +   •  Querying specific service that will help fetch useful data such as usernames


    We will now go through Information Gathering tools available in Kali Linux one
    by one.


    # ## Nmap and Zenmap


    Ethical hacking is a phase in Kali Linux for which the tools NMap and ZenMap are
    used. NMap and ZenMap are basically the same tools. ZenMap is a Graphical Interface
    for the NMap tool that works on the command line.


    The NMap tool, which is used for security auditing and discovery of network, is
    a free tool. Apart from penetration testers, it is also used by system administrators
    and network administrators for daily tasks such as monitoring the uptime of the
    server or a service and managing schedules for service upgrades.


    NMap identifies available hosts on a network by using IP packets that are raw.
    This also helps NMap identify the service being hosted on the host, which includes
    the name of the application and the version. Basically, the most important application
    it helps identify on a network is the filter or the firewall set up on a host.


    # ## Stealth Scan


    The Stealth Scan is also popularly known as the half-open scan or SYN. It is called
    so because it refrains from completing the usual three-way handshake of TCP. A
    SYN packet is sent by an attacker to the target host, who then'
  merge: -1
  img_proc: true
- pgno: 55
  md: 'acknowledges the SYN and sends a SYN/ACK in return. If a SYN/ACK is received,
    it can be safely assumed that the connection to the target host will complete
    and the port is open and can listen to the target host. If the response received
    is RST instead, it is safe to assume that the port is closed or not active on
    the target host.


    # braa


    braa is a tool that is used for scanning mass Simple Network Management Protocol
    (SNMP). The tool lets you make SNMP queries, but unlike other tools that make
    single queries at a time to the SNMP service, braa has the capability to make
    queries to multiple hosts simultaneously, using one single process. The advantage
    of braa is that it scans multiple hosts very fast and that too by using very limited
    system resources.


    Unlike other SNMP tools that require libraries from SNMP to function, braa implements
    and maintains its own stack of SNMP. The implementation is very complex and dirty.
    Supports limited data types, and cannot be called up to standard in any case.
    However, braa was developed to be a fast tool, and it is fast indeed.


    # dnsmap


    dnsmap is a tool that came into existence originally in 2006 after being inspired
    by the fictional story “The Thief No One Saw” by Paul Craig.


    A tool used by penetration testers in the information gathering stage, dnsmap
    helps discover the IP of the target company, domain names, netblocks, phone numbers,
    etc.


    Dnsmap also helps on subdomain brute force, which helps in cases where zone transfers
    of DNS do not work. Zone transfers are not allowed publicly anymore nowadays,
    which makes dnsmap essential.


    # Fierce


    Fierce is a Kali tool that is used to scan ports and map networks. Discovery of
