    # Maintaining Access Tools


    Once we have cracked into a target machine by using the many methods that we have
    looked at, our next step should be ensuring techniques that will help us maintain
    the precious access that we have gained. This is to make sure that if the vulnerability
    that let you into the system gets patched in the future, you still have some way
    through which you can access the system.


    We will look at the various tools available in Kali Linux, which will help us
    to maintain access to a system.


    # Cryptcat Package Description


    CryptCat is a simple Kali Linux utility that reads all data that it sees across
    network connections and writes data to it too. It uses the UDP or TCP protocol
    to do this and even encrypts the data that is sent over the network. It is designed
    in a way such that it can be integrated with a program or a script that runs in
    the front-end on a graphical interface while the tool runs in the backend in a
    reliable manner. At the same time, it is also a tool, which is rich in features
    and allows network debugging and exploration. It is a very interesting tool, as
    it will allow you to create the connection of your choice and has many other built-in
    features as well.


