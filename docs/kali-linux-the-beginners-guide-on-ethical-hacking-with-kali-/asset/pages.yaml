  md: '# Reverse Engineering Tools


    We can learn how to make and break things from something as simple as a Lego toy
    to a car engine simply by dismantling the parts one by one and then putting them
    back together. This process wherein we break things down to study it deeply and
    further improve it is called Reverse Engineering.


    The technique of Reverse Engineering in its initial days would only be used with
    hardware. As the process evolved over the years, engineers started applying it
    to software, and now to human DNA as well. Reverse engineering, in the domain
    of cyber security, helps understand that if a system was breached, how the attacker
    entered the system and the steps that he took to break and enter into the system.


    While getting into the network of corporate infrastructure, attackers ensure that
    they are utilizing all the tools available to them in the domain of computer intrusion
    tools. Most of the attackers are funded and skilled and have a specific objective
    for an attack towards which they are highly motivated. Reverse Engineering empowers
    us to put up a fight against such attackers in the future. Kali Linux comes equipped
    with a lot of tools that are useful in the process of reverse engineering in the
    digital world. We will list down some of these tools and learn their use.


    # Apktool


    Apktool is a Kali Linux tool that is used in the process of reverse engineering.
    This tool has the ability to break down resources to a form that is almost the
    original form and then recreate the resource by making adjustments. It can also
    debug code that is small in size, step by step. It has a file structure, which
    is project-like, thus making it easy to work with an app. With Apktool, you can
    also automate tasks that are repetitive in nature, like the building of an apk.


    # Dex2jar


    Dex2jar is a Kali tool, which has a lightweight API and was developed to'
  merge: -1
  img_proc: true
