- pgno: 35
  md: '# Chapter Three: About Hacking


    The basic definition of hacking is the process of trying to exploit vulnerability
    in a computer on a network. The computer may just be a personal computer or may
    belong to a corporate such as a web server. In simple words, it means accessing
    a computer or a server, without having the authorization to do so for illicit
    activities.


    We could understand hacking better if we know more about hackers first. We can
    assume that hackers are very sharp and very skilled in their knowledge about computers
    and networks. Creating a system with security measures is simple as compared to
    actually breaking a security system that is already in place. Therefore breaking
    the security of a system would require more skills and expertise than creating
    it.


    Hackers cannot be classified as per a particular set of rules. But the world has
    come to categorize hackers as white hat hackers, black hat hackers, and grey hat
    hackers.


    # White Hat Hackers


    White hat hackers are basically professionals who are continuously bombarding
    approved systems with all kinds of attacks so that they can find out vulnerabilities
    in order to make the systems stronger against attacks. In the majority of cases,
    white hat hackers are employed by the same operating organization.


    # Black Hat Hackers


    The set of hackers who like to access someone else’s system for personal benefit
    are known as Black Hat Hackers. They hack and attack a system in such a way that
    they can steal or even destroy data on that system. Furthermore, they can lock
    down that system and restrict access of the genuine owner of that system. This
    is usually down by finding exploits in the'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'system''s security. They are popularly known as crackers.


    # Grey Hat Hackers


    A set of hackers who like to hack systems to pacify their curiosity are known
    as Grey Hat Hackers. They have the minimum amount of knowledge with respect to
    computers and programming to make their way into someone else''s system. What
    differentiates grey hat hackers from black hat hackers is that once a loophole
    is found, grey hat hackers notify the admin of that system so that they can fix
    it, while black hat hackers would not notify the admin and would try to gain benefits
    out of exploiting the system.


    Hacking of all sorts is illegal except for the one done by contracted professionals,
    also known as white hat hackers.'
  merge: -1
  img_proc: true
