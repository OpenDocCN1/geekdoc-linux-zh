    Dradis 允许从各种渗透测试工具生成的数据中导入数据。它还允许手动添加数据并生成该数据的报告。工具和数据存储都遵循树状结构。


    ## 压力测试工具


    压力测试可以定义为一种软件测试方法，旨在发现系统的可靠性和稳定性。测试会让系统经历极端条件，以了解其鲁棒性如何，以及在如此情况下处理错误的高效程度。


    压力测试的设计目的是在常规操作点之外的极端压力下测试系统，以了解其抗压能力。引入压力测试是为了确保处于生产环境的系统在极端情况下不会崩溃。


    让我们看看 Kali Linux 中可用的各种压力测试工具。


    ### DHCPig


    DHCPig 是一款 Kali Linux 工具，通过对 DHCP 服务器系统发起耗尽攻击来使其资源枯竭。该工具将用尽网络上所有可用的 IP 地址，阻止新用户被分配任何
    IP，释放已分配给真实设备的 IP，然后在相当长的一段时间内，它会发送免费 ARP（Gratuitous ARP）并将所有 Windows 主机从网络上踢出。执行该工具需要管理员权限和
    scapy >=2.1 库。该工具基本上不需要任何配置，你只需将计划实施测试的环境作为参数传入即可。该工具已在 Windows 上的多个 DHCP 服务器以及几个
    Linux 发行版上成功测试。


    ### Inviteflood


    Inviteflood 是一款 Kali Linux 工具，用于发送 SIP/SDP INVITE 消息以在 UDP/IP 上造成洪水攻击。它已在多个 Linux
    平台上进行测试，并且在所有发行版上运行良好。


    ## MSK


    MSK 是一款 Kali Linux 工具，是一种用于利用 IEEE 802.11 协议弱点的概念验证工具。


    注意：在网络上运行 MDK 之前，请确保网络所有者已允许你在此网络中运行该工具。


    ## 维持访问工具


    一旦我们使用研究过的多种方法入侵了目标机器，下一步应该是确保采用能够让我们维持已获得的宝贵访问权限的技术。这是为了确保，如果让你进入系统的漏洞在未来被打上补丁，你仍然有一些途径可以访问该系统。


    我们将查看 Kali Linux 中可用的各种工具，这些工具有助于我们维持对系统的访问权限。


    ## Cryptcat 包描述


    CryptCat 是一个简单的 Kali Linux 实用工具，它读取通过网络连接看到的所有数据，并同样将数据写入其中。它使用 UDP 或 TCP 协议执行此操作，甚至会对通过网络发送的数据进行加密。它的设计方式使其可以集成到在前端图形界面上运行的程序或脚本中，而该工具则在后台可靠地运行。同时，它也是一个功能丰富的工具，允许进行网络调试和探索。这是一个非常有趣的工具，因为它允许你创建所选的连接，并且还有许多其他内置功能。


    ## HTTP 隧道包描述


    HTTPTunnel 是一款 Kali Linux 隧道软件。它可以通过网络连接创建隧道。它基本上包含两个组件。


    客户端位于防火墙之后，将接受连接到连接到远程服务器的端口的连接，或者充当 SOCKS 代理的作用。SOCKS 源的认证来源可以是固定用户列表，该列表取自 MySQL
    或 LDAP 目录。客户端组件是一个与平台无关的 Perl 脚本，或者也可作为 Win32 二进制文件使用。


    服务器端组件存在于互联网上，客户端向其发起 HTTP 请求。然后，服务器端将这些请求转换并转发到上游远程服务器上的网络连接。


    有两种可用的服务器。第一种是一个 Web 服务器，它本质上托管了一个 PHP 脚本。你在 Web 服务器上托管的 PHP 脚本将允许你的 Web 服务器充当运行
    HTTP 隧道的服务器。


    第二种服务器是一个独立服务器，运行与平台无关的 Perl 脚本或 Win32 二进制文件。如果你拥有自己的机器，例如连接到互联网的家庭电脑，它可以用作独立服务器。基于提供托管服务器服务的公司，托管服务器可能对
    PHP 脚本施加限制（例如 PHP 脚本的最大执行时间，这将限制连接的时间）。因此，拥有自己的独立服务器比托管服务器具有优势，因为你对自己的家庭电脑拥有完全的访问权限。


    ## Intersect 包描述


    Intersect 2.5 是一款 Kali Linux 工具，是迄今发布版本中的第二个主要版本。该版本与其之前的版本之间存在巨大差异。此版本允许用户控制哪些功能将包含在
    intersect 脚本中，并为导入自定义功能提供了空间。


    最新版本主要关注集成自定义 intersect 脚本的能力，以及工具中单个模块和功能的集成。用户可以使用 create.py 应用程序，它将引导用户通过一个菜单驱动的用户友好流程，让用户添加其选择的模块，导入自定义模块，并根据其特定需求创建
    intersect 脚本。


    ## 嗅探和欺骗工具


    谈到网络安全时，数据包的嗅探和欺骗是两个非常重要的概念，因为它们是对网络安全的主要威胁。如果你想为网络基础设施部署安全措施，理解数据包嗅探和欺骗的特性非常重要。互联网上有很多工具可以促进嗅探和欺骗，例如
    Tcpdump、Wireshark、Netwox 等。这些工具被攻击者和安全研究人员广泛使用。学生也应该能够使用这些工具。然而，理解网络安全对于学习如何利用这些工具以及软件中如何使用数据包嗅探和欺骗非常重要。


    让我们介绍一些用于数据包嗅探和欺骗的工具。


    ## Burp Suite


    Burp Suite 是一款 Kali Linux 工具，用作在 Web 应用程序上运行安全测试的平台。它包含许多协同工作的工具，使整个测试过程从最初测试映射和分析应用程序的攻击面，到发现安全漏洞并加以利用，都能无缝运行。


    Burp 允许用户拥有完全控制权，因为它允许将手动技术与自动化相结合。这有助于使整个过程高效、快速且更有趣。


    ## DNSChef


    DNSChef 是一款高度可配置的 Kali Linux 工具，供恶意软件分析师和渗透测试人员配置 DNS 代理。DNS 代理是一种用于分析网络流量的伪造
    DNS 工具。


    例如，如果有人通过互联网请求 example.com，可以使用 DNS 代理将他们重定向到互联网上的错误页面，而不是 example.com 网站所在的真实服务器。


    互联网上有很多用于 DNS 代理的工具。大多数允许你将传入的 DNS 查询指向单个 IP。DNSChef 是作为 DNS 代理工具的完整解决方案开发的，旨在为用户提供所需的每种配置。由于这一愿景，DNSChef
    是一个跨所有平台工作的工具，能够在支持多种类型 DNS 记录的同时创建虚假响应。


    在无法强制 Web 应用程序使用特定代理服务器时，建议使用 DNS 代理。例如，有些移动应用程序会丢弃操作系统 HTTP 设置中的代理设置。在这种情况下，使用像
    DNSChef 这样的工具作为 DNS 代理服务器将非常有用。它允许你通过欺骗应用程序将传入的 HTTP 请求重定向到目标位置。


    ## Wi-Fi Honey


    Wi-Fi Honey 是一款 Kali Linux 工具，本质上是一个创建五个监控接口的脚本。一个窗口用于工具 airodump-ng，其余四个用于 AP（接入点）。该工具在一个屏幕会话中运行这五个窗口，使在五个屏幕之间切换变得简单，最终使这个过程更加舒适。所有会话都有标签，因此你不会混淆屏幕。


    ## 密码攻击工具


    顾名思义，Kali Linux 中的密码攻击工具有助于破解应用程序和设备的密码。


    让我们查看 Kali Linux 中可用的一些密码破解设备。


    ### Crowbar


