    基于 ARM 的设备在硬件和架构上差异很大。因此，不可能为各种基于 ARM 的设备维护单一的安装镜像。针对各种设备安装 Kali Linux，有一套多样化的预构建镜像可用。如果你想构建自己的
    ARM 镜像，Kali GitHub 仓库中提供了构建自定义 ISO 的脚本。


    ### VMware 镜像


    如果你使用 VMware 并希望将 Kali Linux 用作“客户机”，Kali Linux 提供预构建的 VMware 机器，且已预装 VMware 工具。VMware
    镜像可用 64 位、32 位、32 位 PAE 格式。


    让我们看看安装和使用 Kali Linux 的各种方法。


    ### Kali Linux 可引导 USB 驱动器


    这是让 Kali Linux 快速运行的最方便的方式，因为你是通过 USB 驱动器以“live”模式运行它。使用这种方法也有许多其他优点。让我们逐一来看。


    - *非破坏性*


    '
