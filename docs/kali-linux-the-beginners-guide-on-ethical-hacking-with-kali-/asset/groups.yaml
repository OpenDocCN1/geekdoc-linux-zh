  - '[PAGE 17]


    There are no changes made to your physical machine or to the operating system
    that already resides on your machine as Kali Linux will run directly from a USB
    drive. You can simply unplug the USB drive, and you will be able to boot into
    your regular operating system on your machine without any extra effort.


    # Portability


    You can literally carry Kali Linux with you everywhere you go, since you can just
    keep it in a USB drive in your pocket. All you need to do is plug it into a system
    that is available to you, and you will be able to boot into Kali Linux.


    # Customizable


    We have already discussed that Kali Linux is open source and all its repositories
    are available publicly on GitHub. You can, therefore, use scripts available in
    the Kali Linux repository to build your custom Kali Linux installation image and
    load that on a USB drive too.


    # Persistence


    You can customize your Kali Linux USB to be persistent. This will allow it to
    store data on the USB and retain it across multiple reboots.


    In order to do this, we first need to create a bootable USB drive, which has been
    set up from an ISO image of Kali Linux.


    # Requirements to create a Kali Linux USB


    +   1. A verified copy of the Kali Linux ISO to suit the system that you intend
    to run or install it on.

    +   2. If you are using Windows, you will require the Win32 Disk Imager software
    to create the Kali Linux USB drive. On Linux or OS X, you can use the dd command
    on the terminal, which is pre-installed for creation of bootable USB drives.

    +   3. A USB drive which has a capacity of 4GB or more. If your system'
  - '[PAGE 18]


    supports an SD card slot, you could use an SD card as well with a similar process.


    Let us now go through the process of creating a Kali Linux Live USB drive. This
    process will vary based on the system that you are already using, namely, Windows,
    Linux, or MacOS.


    # Creating a Bootable Kali USB Drive on Windows


    +   1.  Plug the USB in the USB slot on your machine and note down which drive
    letter is designated to it. Launch the Win32 Disk Imager application that you
    had downloaded earlier.


    +   2.  Choose the ISO file for Kali Linux installation and ensure that you have
    selected the correct USB drive for it to be written to. Click on Write.


    +   3.  Once the writing to USB drive is complete, you can eject the drive and
    use it as a bootable USB drive to boot Kali Linux Live or install Kali Linux on
    your machine.


    # Creating a Kali Linux Bootable USB Drive on a Linux Operating System


    Creating a bootable USB drive is fairly simple in a Linux operating system. Once
    you have downloaded your Kali Linux ISO file and verified it, you can use the
    dd command on the terminal to write the file to your USB drive. You will need
    root or sudo privileges to run the dd command.


    > **Warning:** If you are unsure as to how to use the dd command, you may end
    up writing the Kali Linux image to a disk drive that you did not intend to. Therefore,
    it is extremely important to be alert while you are using the dd command.


    You will need to know the device path to be used for writing the Kali Linux image
    to the USB drive. Without having the USB drive inserted in the USB slot, execute
    the following command in the command prompt of the terminal window.


    ```

    Sudo fdisk -l

    ```'
  - '[PAGE 19]


    You will get an output that shows you all the devices mounted on your system,
    which will show the partitions as:


    /dev/sda1


    /dev/sda2


    Now, plugin the USB drive and run the same command “sudo fdisk -l” again. You
    will see an additional device this time, which is your USB drive. It will show
    up as something like


    /dev/sdb


    with the size of your USB drive next to it.


    Proceed to write the image carefully on the USB drive using the command shown
    below. The example assumes that the name of your Kali Linux ISO file is “kali-linux-2019.1-amd64.iso”
    and it is in your present working directory. The block size parameter bs can be
    increased but the ideal value would be ‘bs=512k’.


    dd if=kali-linux-2019.1-amd64.iso of=/dev/sdb bs=512k


    The writing to the USB drive will take a few minutes, and it is not abnormal for
    it to take a little more than 10 minutes to finish writing.


    The dd command will not show any output until the process is completed. If your
    USB drive has an LED, you will see it blinking which is an indicator that the
    disk write is in progress. Once the dd command has been completed, the output
    will be something like this.


    5823+1 records in


    5823+1 records out


    3053371392 bytes (3.1 GB) copied, 746.211 s, 4.1 MB/s


    That is the end of it. You can now use the USB drive to boot into Kali Linux Live
    or start and installation of Kali Linux on a machine.


    # **Creating a Kali Linux Bootable USB Drive on a MAC OS X Operating System**'
