  mdcn: "\n不会对您的物理机器或已驻留在机器上的操作系统进行任何更改，因为 Kali Linux 将直接从 USB 驱动器运行。您只需拔掉 USB 驱动器，即可轻松启动到机器上的常规操作系统，无需任何额外努力。\n\
