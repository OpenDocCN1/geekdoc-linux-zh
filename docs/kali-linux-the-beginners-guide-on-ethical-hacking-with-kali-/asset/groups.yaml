    four are used for APs. The tool runs the five windows in a screen session, making
    it simple to switch between the five screens and ultimately makes this process
    even more comfortable. All the sessions are labeled, and therefore you will not
    end up getting confused with the screens.


    ## Password Attack Tools


    As the name suggests, password attack tools in Kali Linux help crack passwords
    of applications and devices.


    Let us go through a few of the password cracking devices that are available in
    Kali Linux.


    ### Crowbar

