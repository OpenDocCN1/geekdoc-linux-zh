    ### 设置用户和密码


    你需要为系统管理账户 ''root'' 设置密码。拥有 root 访问权限的恶意或不合格用户可能导致灾难性后果，因此你应该小心选择一个不易猜测的 root
    密码。它不应该是字典中的单词，也不应该是容易与你关联的单词。


    一个好的密码应包含字母、数字和标点符号的混合，并应定期更换。


    root 用户不应有空密码。如果你将此留空，root 账户将被禁用，系统的初始用户账户将使用 "sudo" 命令获得提升为 root 的权限。


