  - '[PAGE 9]


    # Introduction


    I want to thank you for choosing this book, *Kali Linux - The Beginner''s Guide
    on Ethical Hacking* with Kali. Basic Security Testing Concepts Explained to Prevent
    Cyber Terrorism and Understand the Basics of Cybersecurity and Hacking in General.


    Kali Linux is a flavor of Linux distributions which is based on the Debian architecture.
    It was developed with the vision of its application in the security domain by
    focusing mainly on Security Auditing and Penetration Testing. There are hundreds
    of tools which are pre-loaded in Kali Linux and used towards various tasks for
    information security. These include Penetration Testing, Security Research, Computer
    Forensics, Reverse Engineering, etc.


    It is developed and maintained by a company known as Offensive Security which
    is a world leader in information security training. The company also provides
    funds for the future development and maintenance of the operations system.


    This book is an introduction to Kali Linux. Every new user with decent experience
    in the Linux domain can start with Kali Linux. If your aim is to become a professional
    in the security domain and not misuse the power that comes with Kali Linux, then
    the information shared in this book should be enough to get started.


    It is, however, advisable for you to be a user of a simpler Linux operating system
    before beginning with Kali Linux. If you are just beginning to work with a Linux
    operating system or you don’t have the basic knowledge or competence to administer
    a system, or if you are just looking for an operating system to do your daily
    activities, Kali Linux is not the operating system that you may want to begin
    with.


    Even veteran Linux users can sometimes face a challenge while using Kali Linux.
    Given the fact that Kali Linux was made for security purposes, it is not a wide-open
    source project as compared to other Linux flavors, which work as open sources
    on a bigger scale. The development team consists of a very small number of users,
    and the packages developed for Kali Linux and committed to repositories, are signed
    by the individual developer first and then by the entire team.


    The upstream or third party repositories from which the packages are updated'
