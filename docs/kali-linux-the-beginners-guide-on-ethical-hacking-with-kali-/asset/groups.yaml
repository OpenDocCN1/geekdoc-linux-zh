    \ OS X 操作系统上创建可启动的 Kali Linux USB 驱动器\n\nApple OS X 是基于 Unix 的操作系统，因此在 OS X 上创建\
    \ Kali Linux 可启动 USB 驱动器与在 Linux 上创建类似。在下载并验证您的 Kali Linux ISO 副本后，您可以直接使用 `dd`\
    \ 命令将 ISO 写入 USB 驱动器。\n\n**警告：** 如果您不确定如何使用 `dd` 命令，最终可能会将 Kali Linux 镜像写入您未打算写入的磁盘驱动器。因此，在使用\
    \ `dd` 命令时保持高度警惕极其重要。\n\n您可以使用以下步骤将 ISO 写入 USB 驱动器。\n\n1.  在未将 USB 驱动器插入 MAC 台式机或笔记本电脑的情况下，在终端窗口的命令提示符中输入以下命令：\n\
    \    ```\n    diskutil list\n    ```\n2.  将显示一个设备路径列表，显示系统中挂载的所有磁盘，以及分区数据：\n \
    \   ```\n    /dev/disk1\n    /dev/disk2\n    ```\n3.  现在，插入 USB 并再次运行 `diskutil\
    \ list` 命令。您会看到列表现在也显示了您的 USB 驱动器。它将是不在第一次显示中出现的那个。假设它是：\n    ```\n    /dev/disk6\n\
    \    ```\n4.  使用以下命令卸载 USB 驱动器（假设 USB 为 `/dev/disk6`）：\n    ```\n    diskutil\
    \ unmount /dev/disk6\n    ```\n5.  继续使用以下命令小心地将 Kali Linux ISO 写入您的 USB 驱动器。假设当前工作目录与保存\
    \ ISO 文件的目录相同。块大小参数 `bs` 可以增加，但理想值为 `bs=1m`：\n    ```\n    sudo dd if=kali-linux-2017.1-amd64.iso\
    \ of=/dev/disk6 bs=1m\n    ```\n6.  向 USB 驱动器写入过程需要几分钟，完成写入所需时间略多于 10 分钟并不异常。\n\
    7.  `dd` 命令在进程完成之前不会显示任何输出。如果您的 USB 驱动器有 LED，您会看到它闪烁，这是磁盘写入正在进行中的指示。一旦 `dd` 命令完成，输出将如下所示：\n\
    \    ```\n    5823+1 records in\n    5823+1 records out\n    3053371392 bytes\
    \ transferred in 2151.132182 secs (1419425 bytes/sec)\n    ```\n\n这就结束了。现在您可以使用\
    \ USB 驱动器启动 Kali Linux Live 或在机器上开始安装 Kali Linux。要在 OS X 机器上从期望的驱动器启动，请在计算机启动后立即按下\
    \ “Option”（选项）按钮，并选择您希望使用的驱动器。\n\n## 在硬盘驱动器上安装 Kali Linux 的过程\n\n在本节中，我们将学习如何在系统的硬盘上物理安装\
    \ Kali Linux。这将使其能够直接从硬盘驱动器运行，而不是如我们在上一节中讨论的那样从 USB 驱动器运行。\n\n### 安装要求\n\nKali\
    \ Linux 的安装过程相当简单易懂。首先，我们需要一台具有兼容 Kali Linux 安装的硬件的机器。Kali Linux 支持 32 位、64 位和\
    \ ARM (armhf 和 armel) 架构。\n\n我们已经完成了创建 Kali Linux ISO 可启动 USB 介质的过程。如果您有 DVD 驱动器，您也可以将\
    \ ISO 镜像写入 DVD 以在机器上安装 Kali Linux。\n\n在机器上安装 Kali Linux 的最低硬件要求如下：\n\n-   安装文件所需的最小可用磁盘空间为\
    \ 20 GB。\n-   最小 RAM 容量为 1GB。虽然建议 2GB 或更多以获得更好的性能。\n-   DVD 驱动器或 USB 启动支持，以协助\
    \ Kali Linux 安装。\n\n### 安装准备\n\n您可以通过准备以下检查表来为安装做准备。\n\n1.  根据系统架构下载 Kali Linux\
    \ ISO。\n2.  使用上一章中提到的工具将 Kali Linux ISO 写入 DVD 或 USB 驱动器。\n3.  确保您的计算机已设置为允许从\
    \ USB 驱动器启动。\n\n### Kali Linux 安装过程\n\n1.  要开始安装 Kali Linux，请使用您创建的安装介质（即 DVD\
    \ 或 USB 驱动器）启动。您将看到 Kali Linux 启动屏幕。您可以选择图形模式或文本模式安装。理想情况下，继续图形安装。\n\n"
