    Crowbar, previously known as Levey, is a Kali Linux tool, which is used for penetration
    testing. According to authors of regular brute-forcing tools, a crowbar was developed
    to brute force protocols in a manner that was different than the regular tools.
    For example, during an SSH brute force attack, most tools use the username and
    the password to carry the attack but crowbar, unlike the majority of the tools,
    uses SSH keys. This means that is there was any kind of a private key that was
    retrieved during any of the penetration tests; it could then be used to attack
    servers that have SSH access.


    ## John


    John the Ripper is a Kali Linux tool that is both fast and feature-rich in its
    design. You can customize it to your specific needs, and it also combines many
    other cracking methods in one simple program. There is a built-in compiler, which
    is a part of the C compiler, which will even allow you to define a cracking mode
    that is completely custom made. John is available on all platforms, which means
    you can use the same tool everywhere you go. Additionally, if you started cracking
    a session on one platform, you could very well continue it on another platform.
    Such is the portability of John.


    John, out of the box, auto-detects and supports the following crypt types in Unix
    by default.


    DES-based tripodes, Windows and Kerberos/AFS hashes, OpenBSD Blowfish, FreeBSD
    MD5, BSDI extended DES, bigcrypt and traditional DES.


    ## Ncrack


    Ncrack is a Kali Linux tool, which is a high speed and used to crack network authentication.
    The motive for building this tool was that corporations could check their network
    infrastructure and devices proactively for any flaws and loopholes such as poor
    passwords. Ncrack is also used by security professionals while conducting audits
    for their clients. A command-line syntax similar to Nmap, a modular approach,
    and a dynamic engine that would take feedback from network and adapt its behavior,
    were the foundations that Ncrack was built upon. Nmap allows auditing of hosts
    on a large scale and that too in a reliable way.


    Ncrack’s list of features provides an interface that is very flexible and gives
    the user full control of the network operations, making it possible to perform
    brute force attacks that are very sophisticated in nature, providing time templates
    for easy usage, a runtime interaction that is much like Nmap’s and many other
    things. Ncrack supports the protocols such as OWA, WinRM, MongoDB, Cassandra,
    MySQL, MSSQL, PostgreSQL, Redis, SIP, SMB, VNC, POP, IMAP, HTTP and HTTPS, Telnet,
    FTP, RDP and SSH.


    ## RainbowCrack


    RainbowCrack is a general propose Kali Linux tool, which was an implementation
    of Philippe Oechslin. It is used to crack hashes that have rainbow tables. Rainbow
    Crack cracks hashes of rainbow tables by making use of the time-memory tradeoff
    algorithm. This makes it different from hash crackers that are brute force.


    A brute force hash cracker will generate all the plaintexts that are possible
    and then compute the hashes that correspond to the plaintext, all during runtime.
    It will then compare the hashes that need to be cracked with the hashes in hand.
    If no match is found even after comparing all available plaintexts, all results
    of the intermediate computation are discarded.


    A time-memory tradeoff hash cracker sets up a stage for pre-computation, and all
    results of all hashes are stored in a rainbow table. This is a time-consuming
    computation. But on the first stage of pre-computing is over, hashes that were
    stored in the rainbow table can be cracked with a performance that is much better
    and efficient as compared to a brute force cracker.


    ## Conclusion


    Kali Linux is a very advanced flavor of Linux that is used for Security Auditing
    and Penetration Testing. After all the tools that we have looked at, it is pretty
    clear that if you want to succeed in the domain of Security Research, Kali Linux
    will provide with unlimited power to achieve the same.


    It is clear that if you are just beginning with Linux, Kali Linux is not the place
    that you would want to start with as it is a highly complex operating system created
    and aimed at achieving one goal: security.


    I hope you have gotten all the information you needed to learn the basics.


    Thank you and good luck.


