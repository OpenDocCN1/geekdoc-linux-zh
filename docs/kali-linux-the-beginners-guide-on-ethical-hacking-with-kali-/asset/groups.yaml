    **Crowbar**，原名 Levey，是一款用于渗透测试的 Kali Linux 工具。根据常规暴力破解工具作者的描述，Crowbar 的开发旨在以一种不同于常规工具的方式对协议进行暴力破解。例如，在
    SSH 暴力破解攻击中，大多数工具使用用户名和密码来执行攻击，但 Crowbar 与大多数工具不同，它使用的是 SSH 密钥。这意味着，如果在任何渗透测试过程中获取了某种私钥，那么该密钥就可以被用来攻击具有
    SSH 访问权限的服务器。


    ## John


    **John the Ripper** 是一款设计既快速又功能丰富的 Kali Linux 工具。您可以针对特定需求对其进行自定义配置，它还将多种其他破解方法整合在一个简单的程序中。该程序内置了一个编译器（属于
    C 编译器的一部分），甚至允许您定义完全自定义的破解模式。John 在所有平台上均可用，这意味着您可以随时随地使用同一款工具。此外，如果您在一个平台上开始了解锁会话，完全可以在另一个平台上继续。John
    的便携性由此可见一斑。


    John 开箱即用地自动检测并默认支持 Unix 中的以下加密类型：


    基于 DES 的三重加密、Windows 和 Kerberos/AFS 哈希、OpenBSD Blowfish、FreeBSD MD5、BSDI 扩展 DES、bigcrypt
    以及传统 DES。


    ## Ncrack


    **Ncrack** 是一款用于破解网络认证的高速 Kali Linux 工具。开发此工具的动机是，企业可以主动检查其网络基础设施和设备是否存在诸如弱密码等缺陷和漏洞。安全专业人员在对客户进行审计时也使用
    Ncrack。Nmap 类似的命令行语法、模块化方法以及一个能够从网络获取反馈并相应调整其行为的动态引擎，是构建 Ncrack 的基础。Nmap 允许以可靠的方式对大规模主机进行审计。


    Ncrack 的功能列表提供了一个非常灵活的接口，赋予用户完全控制网络操作的能力，使其能够执行非常复杂的暴力破解攻击，提供便于使用的时间模板、类似 Nmap
    的运行时交互以及许多其他功能。Ncrack 支持 OWA、WinRM、MongoDB、Cassandra、MySQL、MSSQL、PostgreSQL、Redis、SIP、SMB、VNC、POP、IMAP、HTTP
    和 HTTPS、Telnet、FTP、RDP 以及 SSH 等协议。


    ## RainbowCrack


    **RainbowCrack** 是一款通用的 Kali Linux 工具，它是 Philippe Oechslin 方案的实现。它用于破解基于彩虹表的哈希值。Rainbow
    Crack 利用时间-空间权衡算法来破解彩虹表中的哈希值。这使得它与暴力破解哈希值的工具有所不同。


    暴力破解哈希值的工具会生成所有可能的明文，然后在运行时计算与这些明文对应的哈希值。接着，它会将需要破解的哈希值与手头已有的哈希值进行比较。即使比较了所有可用明文后仍未找到匹配项，所有中间计算的结果也都会被丢弃。


    时间-空间权衡哈希破解器则设置了一个预计算阶段，并将所有哈希结果存储在彩虹表中。这是一个耗时的计算过程。但在第一阶段预计算完成后，存储在彩虹表中的哈希值可以被破解，其性能和效率远优于暴力破解器。


    ## 结论


    Kali Linux 是一种先进的 Linux 发行版，专门用于安全审计和渗透测试。在查看了上述所有工具之后，很明显，如果您想在安全研究领域取得成功，Kali
    Linux 将提供无限的动力助您达成目标。


    如果您刚开始接触 Linux，那么 Kali Linux 并不是您想要起步的地方，因为它是一个高度复杂的操作系统，其创建目标非常明确：安全。


    希望您已经获取了学习基础知识所需的所有信息。


    谢谢，祝好运。


