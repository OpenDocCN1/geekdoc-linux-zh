    It is clear that if you are just beginning with Linux, Kali Linux is not the place
    that you would want to start with as it is a highly complex operating system created
    and aimed at achieving one goal: security.


    I hope you have gotten all the information you needed to learn the basics.


    Thank you and good luck.'
