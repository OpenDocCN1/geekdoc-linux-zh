  md: '# CHAPTER 9 Memory I/O Interfacing


    > NOTE

    ThePowerPC bit definitions are reversed from those of Intel. With the PowerPC,
    in a 32-bit word, bit 0 is the most significant bit.


    The Project Trailazer engineers are using Chip Select 5, so they need to configure
    the Base Register (BR5) and Option Register (OR5) for that chip select. Table
    9.7 describes BR5''s fields.


    # TABLE 9.7 BR5 Bit Field Descriptions and Design Values


    | Bits | Name | Value | Description |

    |---|---|---|---|

    | 0-16 | BA | 0x80 | Base address: 0x80000000 |

    | 17-19 | AT | 000 | Address type: no access limits |

    | 20-21 | PS | 01 | Port select: 01 is 8-bit port size |

    | 22 | PARE | 0 | Parity enable: 0 is disabled |

    | 23 | WP | 0 | Write protect: 0 is disabled, and read writes allowed |

    | 24-25 | MS | 00 | Machine select: 00 is GPCM |

    | 26-30 | | 00000 | Reserved |

    | 31 | V | 1 | Valid: 1 means BR5 and OR5 contents are valid |


    The liftmon_snowcon interface requires BR5 to be 0b1000.0000.0000.0000.0100.0001
    which equals 0x80000401.


    Table 9.8 describes the OR5''s fields.


    # TABLE 9.8 OR5 Bit Field Descriptions and Design Values


    | Bits | Name | Value | Description |

    |---|---|---|---|

    | 0-16 | AM | 0x80 | Address mask: 0x80000000 |

    | 17-19 | ATM | 000 | Address type mask: 000 means no protection desired |

    | 20 | CSNT | 1 | Chip select negation time: 1 provides extended hold times |

    | 21-22 | ACS | 11 | Address to chip-select setup: 111 provides slowest signals
    |

    | 23 | BIH | 1 | Burst inhibit: 1 bank doesn''t support bursting |

    | 24-27 | SCY | 1111 | Select cycle length: 1111 provides slowest signals |

    | 28 | SETA | 0 | Select external transfer acknowledgement: 0 means memory doesn''t
    provide acknowledgement |

    | 29 | TRLX | 1 | Timing relaxed: 1 means timings provides slowest signals |

    | 30 | EHTR | 1 | Extended hold time read: 1 means slowest signals |

    | 31 | | 0 | Reserved |'
