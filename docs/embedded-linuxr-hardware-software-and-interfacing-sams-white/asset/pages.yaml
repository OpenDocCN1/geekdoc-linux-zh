  md: "# Measuring Interrupt Latency\n\nwith microsecond timing access, race timing\
    \ won't have millisecond accuracy if\nsystem interrupt latency exceeds a millisecond.\
    \ The next section examines the\nProject Trailblazer engineers' development of\
    \ interrupt handlers within a device\ndriver to measure average interrupt latencies\
    \ for the MZ104, MediaEngine, and RPX-\nCLL target boards.\n\n# Measuring Interrupt\
    \ Latency\n\nInterrupt latency is comprised of hardware propagation time, register\
    \ saving, and\nsoftware execution. Propagation time and register saving occur\
    \ extremely fast—on\nthe order of 10s of nanoseconds. Software execution, on the\
    \ other hand, can be\nextremely slow. The Linux kernel allows devices to disable\
    \ interrupts by using\ntcli system call. While interrupts are disabled, other\
    \ interrupts can occur, but\nthe service routines are not executed until interrupts\
    \ are re-enabled. Developers\\disable interrupts to protect critical sections\
    \ of their code. For example, a video card\ndriver might disable interrupts for\
    \ 16ms while waiting for video sync. A serial card\ndriver might disable interrupts\
    \ during a byte transmission. Therefore, maximum inter-\rlency is a combination\
    \ of system hardware, peripherals, and the quality of the\ndriver driver. With\
    \ source code availability, this combination and the\nasynchronous nature of interrupts\
    \ makes calculating the maximum interrupt latency\ndiff, if not impossible, task.\
    \ On a lightly loaded system with little or no\nipherals, it's likely that the\
    \ average interrupt latency is much smaller than the\nmaximum. Even so, the Project\
    \ Trailblazer engineers had no idea of the average\ninterrupt latency magnitude.\
    \ Was it microseconds or milliseconds? They decided to\nmeasure it for each target\
    \ board.\n\n> > TIP When you are writing device drivers, you should disable interrupts\
    \ only when your driver\nrequires absolutely no interruption. While interrupts\
    \ are disabled, Linux does not update\nsystem timer, transfer network packets\
    \ to and from buffers, or video information. You\nperform your interrupt task\
    \ as quickly as possible. For lengthy tasks, you should split\ny handler and use\
    \ tasks to perform most of the processing.\n\nEach target board—the MZ104, the\
    \ MediaEngine, and the RPX-CLLF—has external\nconnections that are capable of\
    \ generating processor interrupts. In addition, each\nboard can generate an interrupt\
    \ signal using one of its output ports. In the\ndevice driver code we're about\
    \ to discuss, one function asserts the interrupt signal,\nwhich causes the handler\
    \ simply desserts the\ninterrupt to execute. The interrupt signal assertion and\
    \ deassertion can be\nviewed on an oscilloscope, to determine the average interrupt\
    \ latency."
