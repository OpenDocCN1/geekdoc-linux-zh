    # Summary


    This chapter covers a great deal. The Project Trailblazer engineers redesigned
    the lift monitoring and snow-making control interface for memory-mapped I/O operation
    on the MediaEngine and RPX-CLF target boards. They located memory space for the
    interface board and determined the configuration for the CPU''s memory and I/O
    controllers. The design and configuration passed testing after the hellowbit device
    drivers were developed. The engineers used the circuit, the configuration, the
    hellowbit source code, and the x86 parallel port liftmon_snowcon device driver
    from Chapter 7 to create the lift monitoring and snow-making device drivers for
    the MediaEngine and the RPX-CLL. They successfully developed ARM and PowerPC versions
    of liftmon_snowcon. These target boards can now monitor lifts and control snow-making
    equipment at Silverjack.'
