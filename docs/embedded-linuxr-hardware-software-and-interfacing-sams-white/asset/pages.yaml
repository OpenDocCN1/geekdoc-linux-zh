    An SPP has six inputs and four outputs Project Trailblazer needs. However, some
    Silverjack locations require eight outputs, so the parallel port alone doesn''t
    meet the lift monitoring and snow-making I/O requirements. The engineers designed
    an interface circuit, shown in Figure 7.3, that connects the PC parallel port
    to two off-shelf Grayhill I/O module boards (www.gray11.com). This interface circuit
    consists of an input path that uses an input buffer 74HC254, connected to an input
    module rank and an output path that uses an latch, 74HC533, connected to an output
    module rank. Both the buffer and the latch bus connects to the parallel port''s
    data bidirectional data signals, D7–D0. The input buffer''s enable (/OE), the
    output latch''s enable (/OE) and latch enable (/LE) connect to parallel port control
    lines. In an output operation, one that turns on or off an AC output module, a
    byte is placed on the parallel port data bus and the OUTPUT signal is asserted.
    The latch transfers the data byte from the signal lines D7–D0 to its output signals
    that in turn drives the output module board. The board''s AC output modules'
