  md: '# I2C Communication with the Philips Semiconductor SAA1064


    TIP

    The SAA1064 provides direct connection for common-anode seven-segment LED displays
    without additional circuit components. The SAA1064 can drive common-cathode LED
    displays with additional circuitry. If you are purchasing LED displays for use
    with the SAA1064, you should choose common-anode type. This will simplify your
    interfacing design.


    Communication commands can control all LED segments individually on each of the
    four seven-segment LEDs. The SAA1064 drives the LED segments with brightness without
    requiring external current limiting resistors. This allows for software-controlled
    brightness which occurs by applying an analog voltage to the address pin. The
    SAA1064''s I2C bus address temperature range of -40°C to +85°C (-40°F to +185°F)
    permits heated operation, which is a definite plus for Silverjack outdoor winter
    operation.


    # Connecting the SAA1064 to the x86 Parallel Printer Port


    Connecting the SAA1064 to the parallel port requires two signals: SDA and SCL.
    The LED displays require more current than the parallel port can supply. The power
    and ground lines must be connected to an external power supply. The PC''s power
    supply can be used. The X86 parallel port doesn''t contain a dedicated I2C communications
    controller. A device driver can implement the I2C protocol in software and then
    use the parallel port for the SDA and SCL signaling.


    An I2c parallel driver called i2c-pport exists within the lm_sensors project (see
    www.lm-sensors.nu). This open source project implements the I2C protocol for Linux.
    The Project Trailblazer engineers decided to use the i2c-pport device driver instead
    of writing their own. Connecting and communicating with an SAA1064 using i2c-pport
    is a five-step process:


    +   1. Download and compile the I2C source code by using these commands:


    ```

    root@tbdev[501]: cd /root

    root@tbdev[502]: wget www.lm-sensors.nu/archive/

    -> i2c-2.6.1.tar.gz

    root@tbdev[503]: tar xf i2c-2.6.1.tar.gz

    root@tbdev[504]: cd i2c-2.6.1

    root@tbdev[505]: make

    root@tbdev[506]: ls kernel/*

    kernel/i2c-algo-bit.o kernel/i2c-elektor.o kernel/i2c-proc.o

    kernel/i2c-algo-pcf.o kernel/i2c-elv.o kernel/i2c-velleman.o

    kernel/i2c-core.o kernel/i2c-filips-par.o

    kernel/i2c-dev.o kernel/i2c-pport.o

    ```'
