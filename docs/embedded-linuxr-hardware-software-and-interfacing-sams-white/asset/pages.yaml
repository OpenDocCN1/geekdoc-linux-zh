    # Reading the Serial Port Control Signals with getSerialSignal


    The getSerialSignal program returns the status, asserted (1) or not asserted (0),
    of any RS-232 port control input: DSR, CTS, Data Carrier Detected (DCD), or Ring
    (RI). getSerialSignal opens a specified serial port, which is supplied as a command-line
    parameter, and then uses the system callctl to determine the serial port control
    status and returns an individual signal state, which is also supplied as a command-line
    parameter. Listing 6.2 shows the getSerialSignal source code.'
