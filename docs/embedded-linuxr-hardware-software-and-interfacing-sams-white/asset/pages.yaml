  md: '# 12


    # # System Integration


    ## IN THIS CHAPTER

    With all the Project Trailblazer field hardware interfaces developed and tested,
    the engineers were ready to connect everything together. In other words, they
    were ready to tackle system integration. They developed and tested the individual
    components of Project Trailblazer at the bash prompt on the target boards. However,
    in the final design, these boards will not function automatically. Input devices,
    such as lift-monitoring devices, will collect field information for storage elsewhere.
    Output devices will control hardware, based on information provided to them. For
    example, temperature displays will obtain the value to display from a database.
    Information will be passed between field devices and the database, via the Silverjack
    network.


    Project Trailblazer system integration development needs to take place in two
    areas: field devices and the Silverjack server. The engineers need to connect
    field hardware to the database. In this chapter, you will see how the engineers
    developed the Project Trailblazer system integration by using bash², an Apache
    HTTP server³, a MySQL database⁴ gnuplot, and a networking connection utility program
    called net(nc).


    +   * Integration Overview

    * Installing the System Integration Applications

    * Creating and Testing the Project Trailblazer Database

    * Developing the Target and CGI Integration Scripts

    * Additional Reading


    # ## Integration Overview


    The primary integration task is to transfer field data to the server''s database
    and then distribute that data back to the field and to the Web. Although Project
    Trailblazer has many field devices, the amount of data traveling back and forth
    consumes a small number of bytes. A variety of network communication protocols
    exist to connect the field devices to the Silverjack database. Each protocol offers
    different functionality, complexity, and target board file system usage. The engineers
    deided to keep the Project'
