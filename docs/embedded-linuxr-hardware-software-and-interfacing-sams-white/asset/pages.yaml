    TIP


    Some PowerPC microprocessors don''t have a floating-point unit and don''t execute
    floating-point instructions gracefully. When executing PowerPC programs, you should
    make sure that they have been compiled correctly for your microprocessor.


    MontaVista''s HHLv2 isn''t just repackaging of the open-source GNU software. MontaVista''s
    engineers are considered leading developers in architecture potting issues and
    development activities. They have incorporated much of their work (via patches)
    into the MontaVista distribution. All their architecture-specific work for the
    kernel and other GNU software is incorporated into the HHLv2 source and binaries.
    The Project Trailblazer engineers, who aren''t architecture experts, were excited
    that they wouldn''t have to become experts to get their targets booted. The engineers
    decided that instead of reinventing the wheel, they could use MontaVista''s Journeys
    product, including the Jouryman cross-compiled versions of the programs for their
    ARM and PowerPC root filesystem. After a successful booting of the ARM and PowerPC
    target platforms, they decided to use Jouryman for i386 root filesystem as well.
    This decision simplified their lives in ways they didn''t imagine. Building a
