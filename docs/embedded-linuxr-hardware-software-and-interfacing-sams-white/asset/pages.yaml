  md: '# Developing the Target and CGI Integration Scripts


    387


    The engineers decided to use the Project Trailblazer database in an innovative
    way. They developed a target board script called imageReport, shown in Listing
    12.7. imageReport queries the Silverjack database for the vgrabbj command. The
    server returns a unique vgrabbj command that theReport script then executes. The
    Apache HTTP server passes the target board''s IP address to CGI scripts in $REMOTE_ADDR
    variable. A CGI script called imageGetCommand, shown in Listing 12.8, performs
    a database query, using the target''s IP address, to determine the board''s location
    description. The imageGetCommand CGI script then returns to the board a complete
    vgrabbj command with the overlay command-line parameter set to the board''s location,
    current date and time, and the output filename parameter set to a unique filename.
    The imageReport script executes this command and creates a unique image file with
    the appropriate overlay. Use of the imageGetCommand script, every camera-equipped
    target board executes the same imageReport script and therefore, the target boards
    do not require unique configuration.


