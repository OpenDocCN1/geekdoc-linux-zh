    # Measuring Interrupt Latency on the RPX-CLLF


    The RPX-CLLF MPC860 has seven external interrupt pins. The Project Trailblazers
    want to drive IRQ2 with PA0, so they configure the interrupt controller for IRQ2
    rising-edge operation. Asserting PA0 should generate Interrupt 2. (For more information,
    see Section 11.5.1, “Interrupt Structure,” of Motorola MPC860 PowerQUICK User’s
    Manual.²) Figure 11.5 shows the interrupt signal signal connection between the
    RPX-CLLF’s PA0 and IRQ2 and the oscilloscope.'
