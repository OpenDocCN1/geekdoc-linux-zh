    As mentioned previously, using ppdev doesn''t solve the two port I/O drawbacks
    (OUTPUT_ENABLE and latch value retention). Then why discuss ppdev? Using ppdev
    gives you another approach to control the parallel port. snowboardingcontrol.c
    uses inb and out system calls that require ioctl requires root operation. SP control
    using ppdev doesn''t require root operation. Access to the parallel port device
    driver, /dev/parport0, can be controlled through file permissions. Non-root users
    can access the parallel port by using ppdev.


    # Developing a Custom Device Driver


    After twiddling parallel port bits using port I/O and ppdev, the Project Trailblazer
    engineers decided the potential failures due to drawbacks were unacceptable. Port
    I/O and ppdev approaches were error prone and risky. They needed a custom device
    driver for their interface circuit.'
