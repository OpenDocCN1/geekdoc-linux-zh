  md: '# Introducing Embedded Linux


    # IN THIS CHAPTER


    +   * Why Linux, Why Now?

    * What Is an Embedded System?

    * What Does Real-Time Mean?

    * Implications of Open Source

    * Additional Reading


    So you want to use Linux in your next embedded system design? Great! You''re not
    alone: Thousands of developers worldwide are doing the same thing. Like you, they
    want to take advantage of countless hours of code creation to make their products
    reliable, feature packed, robust, and quick to market. Embedded Linux—using Linux
    as an operating system in embedded devices—is now commonplace. In 1999 not many
    developers considered Linux an option for embedded designs. Today, however, Linux
    is well poised to become the market leader for embedded operating systems.


    In a couple of years, it''s likely that a fair percentage of the billions of processors
    produced every year will run Linux. The massive Internet adoption of Linux, combined
    with technology advances and price reductions in hardware (CPUs) and memory (both
    flash and RAM), finally make embedding Linux a viable option. Since 1999 use of
    embedded Linux has gone from zero adoption to taking second place, in terms of
    market share, behind Wind River. Experts estimate that embedded Linux will take
    over the number-one market share position by the end of 2002. This is very interesting,
    considering that Linux already started as student project many years ago. Linux
    can become number one, through the adoption of embedded Linux for designs that
    become products.


    # Why Linux, Why Now?


    Microprocessor industry advances form the foundation for using Linux as an embedded
    operating system. Gone are the days of embedded designs that use 4- or 8-bit processors;
    today it is just as easy and cost competitive to'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# CHAPTER 1 Introducing Embedded Linux


    use 32-bit microprocessors with several megabytes of memory. The ever-changing
    pace of hardware innovation and obsolescence presents an enormous development
    challenge for real-time operating system (RTOS) vendors. With limited resources,
    these RTOS vendors make business decisions that often leave many developers underserved.
    Developers always want the latest and greatest hardware and software for their
    new embedded designs also requiring high reliability. Desktop operating systems
    provide the latest in software but lack reliability and require more memory and
    CPU resources. RTOS vendors offer reliability but struggle with software development
    in the ever-changing world of technology. This is where Linux comes in.


    Linux offers reliability and efficiency, with a proven track record. Open-source
    availability has spawned countless improvements, enhancements, and additions in
    terms of performance, functionality, driver development, and porting activities.
    Designers of embedded systems like open-source software because they often modify
    subsystem code for their designs. Linux supports Operating System Interface (POSIX),
    which allows developers to easily port existing code. Linux is successfully ported
    to several microprocessors, including x86, SPARC, ARM, PowerPC, MIPS, and SuperH.


    Initially, developers were apprehensive considering Linux as an embedded operating
    system option because of its distributed development approach and a perceived
    lack of support structure. The support structure for embedded Linux has changed
    dramatically since 1999, largely to the Embedded Linux Consortium (ELC), which
    was founded with 50 members in May 2000 and now has membership exceeding 125 companies.
    This consortium work toward standardizing and promoting Linux for use in embedded
    applications. In addition, several companies were founded solely for embedded
    Linux. These companies don''t merely replicate distributions and sell CDs. They
    have a wide range of embedded Linux products as well as design and support services.
    Using embedded Linux, developers can design high-reliability products, using the
    latest and greatest hardware and software.


    # What Is an Embedded System?


    If you ask a dozen engineers to define embedded system, you''ll get a dozen different
    answers. Most embedded systems perform specific tasks. Let''s assume that the
    simplest embedded system contains input and output capability, as well as control
    logic. This systems perform some type of functionality, based on their configuration.
    Using these criteria, a discrete logic circuit that contains a 74123 counter that
    implements control logic with a state machine could be considered an embedded
    system. This is programmable, via software, and stored in the system firmware.
    This new definition for an embedded system consists of input/output (I/O) and
    control logic stored in system firmware. A desktop computer'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# What Does Real-Time Mean?


    with a mouse, a keyboard, a network connection, and a multitasking operating system
    running a graphical user interface (GUI) fulfills these requirements, but is it
    considered an embedded system?


    If you don''t consider a desktop machine an embedded system, then what about handheld
    devices? They have I/O capability and can run control logic that''s stored in
    firmware. Some say that desktop computers and handlers are general-purpose computing
    devices that are capable of running software to perform many different tasks.
    An embedded system, on the other hand, is primarily designed for a specific functionality
    defines the soul of the embedded design. For example, a dishwasher controller
    or flight navigation system. This specific functionality if that''s the case,
    why are some embedded systems designed with additional capability, as program
    storage in nonvolatile memory and the capability of running operating systems
    that are capable of executing additional tasks beyond the original design?


    In the past, it was much easier to distinguish an embedded system from a general-purpose
    computer than it is today. For example, you can easily tell that 8051-B1 framing
    card is an embedded system from a Sun Work workstation. Today, in terms of functionality,
    a Sun workstation is hard to distinguish from a set-top box that contains a PowerPC
    with 32MB of memory and 16MB of Flash memory, that runs a multitasking operating
    system to a set-top box with a GUI, that is field upgradable, that simultaneously
    runs multiple programs (such as a video controller, a digital VCR, and the Java
    Virtual Machine), that makes secure Internet transactions. It''s hard to say whether
    this set-top box is an embedded system. Clearly, the increase in hardware performance
    and the lower cost of that hardware has blurred the line between general-purpose
    computers and embedded systems. Technology advances have therefore made it hard
    to say what is embedded.


    # What Does Real-Time Mean?


    If you ask engineers what real-time means, you''ll get a number of different answers,
    filled with terms such as guarantees, hard, soft, deterministic, preemptive, priority
    inversion, latency, interrupts, and scheduling. Rick Lehrbaum of linuxdevices.com
    posted that question to experts. These experts somewhat agreed that a hard real-time
    system guarantees a deterministic response to an event and that a late response
    is considered a system failure. They also agree that soft real-time systems attempt
    to minimize event response time and don''t consider late responses a system failure.
    The experts'' opinions diverged when addressing real-time implementation and system
    performance characterization.


    One performance aspect of Linux is: Stock Linux allows the kernel and device drivers
    to disable interrupts. This could seriously affect a system''s responsiveness.
    Fortunately, open-source code availability has allowed systems to be developed
    to'
