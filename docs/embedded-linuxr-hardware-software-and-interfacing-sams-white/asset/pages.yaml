  md: '# Linux, hardware, device drivers


    # # Embedded Linux Hardware, Software, and Interfacing

    Craig Hollabaugh, Ph.D.


    Embedded Linux covers the development and implementation of interfacing applications
    on an embedded Linux platform. It includes a comprehensive discussion of platform
    selection, cross-compilation, kernel compilation, root filesystem creation, booting,
    remote debugging, real-world interfacing, application control, data collection,
    archiving, and presentation.


    This book includes serial, parallel, memory I/O, USB, and interrupt-driven hardware
    designs using x86-, StrongARM®, and PowerPC®-based targets. In addition, you will
    find simple device driver code that connects external devices to the kernel, and
    network integration code that connects embedded Linux fields to a centralized
    control center. Examples teach hardware developers how to store and activate fields
    and deliver process information using open source software. If you are a hardware
    developer, software developer, system integrator, or product manager who''s begun
    exploring Linux for applications, this book is for you.


    +   - Select an embedded Linux platform (x86, StrongARM, and PowerPC architectures
    are covered)

    - Create a cross-compiling and debugging environment

    - Build a custom Linux kernel for each architecture

    - Create a minimum root filesystem

    - Boot the Linux kernel on three target boards with x86, SA-1110, and MPC860 microprocessors

    - Remote debug programs on a target board across an ethernet network using GNU
    tools

    - Connect data acquisition and control electronics/peripherals using the microprocessor''s
    serial, parallel, memory I/O, and USB interfaces

    - Measure interrupt-driven latencies for the x86, SA-1110, and MPC860 microprocessors
    and design interrupt-driven process timer with 1ms accuracy

    - Interface the peripherals to the kernel and applications using device driver
    modules

    - Collect, control, store, and present data via open source protocols and applications

    - Analyze embedded Linux vendor product offerings


    Craig Hollabaugh, Ph.D. first administered Sun® and Digital® workstations while
    pursuing a Ph.D. in electrical engineering at Georgia Institute of Technology.
    His first embedded design, US Patent #5,222,027, remotely monitors a petroleum
    processor. In 1995, at Wireless Scientific®, he began using Linux for industrial
    control.


    Craig currently serves three companies out of his home in Olay, Colorado. He developed
    the Proteus Scalar Node™ for Antec. At Clifton, Weiss and Associates, he is a
    member of a carrier-class telecommunications network design team. He is also designing
    FM, MP3, and Bluetooth™ headset electronics for Arriva®.


