  md: '# CHAPTER 1 Introducing Embedded Linux


    overcome this limitation. These solutions follow two approaches: Improve the Linux
    scheduler by making the kernel preemptive and run Linux as a thread within a small
    RTOS. Naturally, each approach has advantages, disadvantages, supporters, and
    opponents.


    # Implications of Open Source


    Open-source software—with its accessibility, reliability, and means of support—clearly
    threaten the commercial software vendors who provide proprietary solutions. Using
    Linux for embedded development threatens the future market share for companies
    such as Microsoft and Wind River. It''s in their best business interests to spread
    fear, uncertainty, and doubt within the embedded industry. For many years, Microsoft
    didn''t consider Linux a threat in the desktop, server, or embedded areas. That
    situation changed, as Microsoft stated that Linux is now its target. Microsoft''s
    attention to Linux further enhances Linux''s position as a viable option for embedded
    development. Many developers see open source as a building block to create powerful
    products. Microsoft sees Linux as a threat to the future dominance of the embedded
    operating systems.


    Use of open-source software has specific implications. In the context of using
    Linux for embedded design, open-source software has to do with a particular licensing
    called the General Public License (GPL). The entire GPL is not covered here, but
    we will address some GPL requirements that affect you and your embedded Linux
    design.


    Linux Torvalds originally released the kernel source under GPL. This means that
    you are free to redistribute Linux without royalty or licensing fees, but you
    must make the Linux source code available to your customers. You can''t sell Linux,
    but you can sell any distribution media or enhancements that you develop. For
    example, when you purchase a Red Hat product, you aren''t buying Linux from Red
    Hat; you''re buying Red Hat''s enhancements to Linux. Red Hat''s enhancements
    include a program that simplifies the installation process and some other goodies.
    GPL states that any "derived" work must be released under GPL. This means that
    if you modify some piece of Linux kernel code, your modification is also covered
    under GPL. If you distribute a product based on your modified code, you must make
    not only the original source code but also your modifications to it, in source
    form. At this point, you may be asking, "If I never touch the kernel source code
    but just use Linux for a product, how does GPL affect me? Do I really have to
    make my product available in source form? The answer depends on how your product
    is linked and what it is linked to.


    Let''s assume, for example, that your embedded product contains a device driver
    or kernel module that you developed. You have an option to include that device
    driver in the kernel binary code at compile time or deploy the driver as a loadable
    module.'
