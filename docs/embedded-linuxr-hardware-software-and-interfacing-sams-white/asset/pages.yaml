- img_proc: true
  md: 'board''s temperature sensor will be close by—within 20 feet—to measure outside
    temperatures, for example. Use of slow synchronous communication enables line
    drivers to overcome the extra capacitance due to long wire lengths.


    A device driver communicating with the LM70 temperature sensor performs five steps:


    +   1. It initializes serial communication with SC high and /CS high. It enters
    the start condition by taking /CS low.

    2. It starts data transfer by taking SC low. The LM70 then drives the SI/O signal
    with the first bit of information.

    3. It takes SC high and samples the first bit data on the SI/O signal.

    4. It continues toggling the SC signal and sampling SI/O until 16 bits are received.

    5. It enters the stop condition and terminates communication by taking /CS high.


    # Connecting the LM70 to the x86 Parallel Printer Port


    The LM70 SPI signal lines—/CS, and SI/O—as well as the power line and the ground
    (GND) connect directly to the parallel port (see Figure 10.1). The parallel port
    drives /CS and SC but not SI/O. The LM70 drives the SI/O line, which returns the
    serial data stream. Because of its continuous conversion mode, there''s no need
    to send data to the sensor.


    ![](img/c075000fa5feb4594b1442d501c7c8d8_293_0.png)


    FIGURE 10.1 The LM70 temperature sensor connection to the x86 parallel printer
    port.


    Check your x86 parallel printer port signal voltages before connecting your interface
    circuits. Some printer ports operate with +5V, and newer motherboards use +3.3V.
    You may not be able to power your +5V devices from a +3.3V signal. Or you might
    destroy your +3.3V devices by connecting them to a +5V signal.'
