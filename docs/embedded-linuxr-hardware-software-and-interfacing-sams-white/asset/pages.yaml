  md: '# Standard Parallel Port Control Using the Custom Device Driver liftmon_snowcon


    The Project Trailazer engineers could barely contain their enthusiasm. They had
    an interface that connected I/O modules to the parallel port. They had written
    code using in and out to control their interface board. They had created, compiled,
    and tested a proc module. Now they needed to take a really big step: Combine these
    accomplishments and develop the custom lift monitoring and snow-making custom
    device driver, liftmon_snowcon.


    The engineers created the following requirements for liftmon_snowcon:


    +   * LS1: The driver should load at startup. This is easily accomplished by adding
    a line to an /etc/init.d/r05 or using the kernel.module file /etc/modules.


    +   * LS2: When it is loaded, the driver should enable the latch output to drive
    the output modules. The driver''s module_init function needs to assert OUTPUT_ENABLE
    and its module_exit function should de-assert OUTPUT_ENABLE.


    +   * LS3: The driver should shield software developers from interface logic specs.
    The device driver should provide a hardware control interface so that the developer
    doesn''t need to know about OUTPUT_ENABLE, OUTPUT_LATCH, data lines, INPUT_ENABLE,
    or assertion levels.


    +   * LS4: The driver should offer control of individual pieces of snowmaking
    equipment, without requiring the developer to perform bit manipulation. The device
    driver should create a /proc file for each of the output modules: snowwatervalve1,
    snowwatervalve2, snowwatervalve3, and snowheater1. Writing 1 or 0 to a specific
    file should contain the specific module on or off. For example, this is on the
    Water Valve 2 output module:


    ```

    echo 1 > /proc/trailblazer/snowwatervalve2

    ```


    Notice that there is no manipulation and the device driver provides actual named
    files that correspond to the physical world. Internal to the device driver should
    be an unsigned char variable called snowcondata. The device driver should perform
    the necessary bit manipulation within snowwikidata.


    +   * LS5: The driver should offer monitoring of individual lift modules, without
    requiring the developer to perform bit manipulation.

    The device driver should create a /proc file for each of the input modules: liftactains,
    liftmotorcontroller, liflowpeed, lifighspeed, liftoperatorswitch, and liftoperatorswictoptop.
    Reading a specific file should return the status of an input module. For example,
    this returns either 1 or 0:


    ```

    cat /proc/trailblazer/liftactains

    ```'
