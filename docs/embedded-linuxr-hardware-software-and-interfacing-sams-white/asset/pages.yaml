  md: '# CHAPTER 3 Selecting a Platform and Installing Tool Sets


    The Trailbl engineers are using the Embedded Planet RPX-CLLF (PowerPC MPC860)
    and the Brightstar MediaEngine (ARM SA-1110). They found two HOWTOs that explain
    the GNU tool chain for the ARM and PowerPC processors:


    +   - The GNU Toolchain for ARM targets HOWTO: https://www.linux.org/docs/toolchain

    - The Linux for PowerPC Embedded Systems HOWTO: http://penguinpc.org/usr/embedded/howto/PowerPC-Embedded-HOWTO.html


    Reading through these HOWTOs, the engineers discovered that building a cross-compiled
    version of the GNU tool chain is quite an operation. They first manually built
    the tool chain. Later, they switched kernel versions and found that they had to
    rebuild the tool chain because gcc and glibc depend on kernel header files. Manually
    building the tool chain is tedious and prone to mistakes, so the engineers automated
    the process by developing a bash script buildtoolchain.


    buildtoolchain can build either PowerPC and ARM cross-compiled versions of gcc,
    glibc, gb, GNU utilities, and a helloworld test program. The buildtoolchain script
    simplifies compiling of powerpc-linux-gcc and arm-linux-gcc, the appropriate glibc
    library files, and gb. buildtoolchain isnt not a monolithic script with 12 steps;
    rather, it is a collection of 14 scripts. First, there buildtoolchain itself,
    merely calls 13 other scripts. Because buildtoolchain is broken into steps, the
    build process can be restarted in case of failure. tbdev1 (which is a 400MHz Celeron)
    requires more than an hour to completely run buildtoolchain.


    buildtoolchain starts by executing the script called buildtoolchain-environment,
    which sets a series of environment variables. buildtoolchain continues by executing
    additional scripts that perform these steps:


    +   1. Checks for the required source files:

    buildtoolchain-step01-check


    +   2. Cleans up old builds:

    buildtoolchain-step02-clean


    +   3. Makes build directories:

    buildtoolchain-step03-makebuildldirectories


    +   4. Builds binutils:

    buildtoolchain-step04-binutils'
