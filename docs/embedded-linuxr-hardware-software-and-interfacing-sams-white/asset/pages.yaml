    # Implementing the Race Timer


    After the Project Trailblazer engineers resolve the average interrupt latency
    question, they can design the race timer. All the Project Trailblazer target boards
    have the input/output (I/O) and speed capacity to act as the race timer. For this
    design, the engineers decide to use the MZ104 as the controller. Figure 11.7 shows
    a schematic of the race timer.


    ![](img/c075000fa5feb4594b1442d501c7c8d8_360_0.png)


    FIGURE 11.7 A schematic of the race timer.


    The race timer should have the following functional features:


    +   * It must have 11ms accuracy.

    * It should display the current race time at the finish line.

    * It should provide a status display to officials operating the timer.'
