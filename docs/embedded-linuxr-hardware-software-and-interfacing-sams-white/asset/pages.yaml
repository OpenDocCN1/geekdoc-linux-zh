    # Collecting Guest Pass Identification and Allowing Lift Access


    The Trailblazer lift access point design uses radio frequency identification (RFID)
    readers from ESPTech. Each guest''s daily or season pass contains an RFID tag
    that emits a 20-character identification string that is read when it is near the
    RFID reader. When the pass is purchased, a unique ID string is generated and the
    pass''s tag is tagged with the ID. This process also creates an entry in the Project
    Trailblazer database tables.


    A guest wants to gain lift access presents his or her to the lift access point.
    The pass''s tag emits the unique ID string, which the RFID reader reads and passes
    via an asynchronous real link to the access point''s target board. The board script
    accessPointControl, shown in Listing 12.10, is executing on the target board reads
    this unique ID and queries the Trailblazer database for pass validity. If the
    pass is valid, the accessPointControl script turns on the access point''s green
    light for permitting guest access to the lift. If the pass is not valid, the script
    turns on the access point''s red light. The accessAllow CGI script, shown in Listing
    12.11, not only returns pass validity information but also logs guest lift


