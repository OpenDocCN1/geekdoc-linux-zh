  md: '# SPI Communication and the LM70


    # TIP


    The LM70 is one device within an LM temperature sensor family offered by National
    Semiconductor. Other temperature sensors, such as the LM78, provide additional
    interfacing capabilities. The LM78 has an on-chip temperature sensor, 7 analog
    inputs to monitor voltages, 3 tachometer inputs, a watchdog timer, an interrupt
    controller, and 32 bytes of RAM. See the National Semiconductor Web site (www.national.com)
    for more information.


    The LM70 operates in a continuous temperature conversion mode. In this mode, the
    LM70 operates as a slave device, accepting communication with a host microprocessor.
    It is an SPI-compatible device that communicates with the host via three signals:
    chip select (/CS), serial clock (SCLK), and bidirectional serial data line (S/O).
    Synchronous communication with the LM70 is very simple. Because it continually
    determines the temperature (continuous conversion mode), the LM70 doesn''t require
    that temperature conversion commands be sent from the host, as do other temperature
    sensors. Therefore, SPI communication with an LM70 requires no packet formation
    or address information. SPI consists of the host initiating communication with
    the assertion of the LM70 /CS line, sending 16 clock pulses while reading the
    LM70''s output on the S/O signal, and then the host de-asserting the chip select.
    The LM70 outputs 1 sign bit, 10 temperature bits (most significant bit [MSB] first),
    3 high, and 2 undefined bits on the falling edge of the serial clock signal. This
    11-bit temperature representation is a two''scomplement word with a least significant
    bit (LSB) resolution of 0.25°C.


    Let''s clarify this temperature value encoding by examining the bits of two examples
    of temperatures. If the temperature were 25°C, communication with the LM70 would
    return the binary value 0000 1100 1111, which equals 0x0C9. The five significant
    bits don''t contain temperature information, and they affect the magnitude of
    the temperature value. These bits are removed by dividing the temperature value
    by 32. 0x0C9 is divided by 0x64, which equals to 100. Each least significant bit
    corresponds to 0.25°C; therefore, 100 times 0.25°C equals 25°C. If the temperature
    were -25°C, communication with the LM70 would return the binary value 1111 0011
    which equals 0xFF39. Dividing by 32 results in a value of 0xFFFC, which corresponds
    to -100. -100 times 0.25°C equals -25°C.


    The LM70 datasheet contains serial bus diagrams and switching characteristics.
    These specifications place an upper limit on communication speed, but that is
    not a concern in this design. In fact, this design intentionally slow synchronous
    communication in order to increase design reliability. Typically, the Project
    Trailblazer target boards will be located in a communication closet or enclosure.'
