  md: "# CHAPTER 4 Booting Linux\n\n![](img/c075000fa5feb4594b1442d501c7c8d8_79_0.png)\n\
    \nFIGURE 4.1 The Project Trailazer developer layout.\n\n# The Target PBRs\n\n\
    Each target platform will need to fulfill all of the following requirements in\
    \ order to be used for Project Trailazer designs:\n\n+   **PBR-1**—The target\
    \ board will use Linux kernel 2.4 or greater. Running the same kernel version\
    \ across all target platforms would be nice, but it is not necessary. The engineers\
    \ discovered that the i386, ARM and PowerPC kernel development occurs at different\
    \ paces. ARM and PowerPC kernel patches don't always exist for the most recent\
    \ version of the kernel.\n- **PBR-2**—The target board will execute the bash shell.\
    \ Exiting from the bash shell causes the bash shell to re-execute.\n\n> TIP\n\
    Defining boot requirements and evaluating target boards forms a development system\
    \ baseline. Having a bash prompt on all your targets means Linux is running. This\
    \ simplifies porting code and scripts from one architecture to another. \n\n+\
    \   **PBR-3**—The target board will execute the bash shell without security authentication.\
    \ This reduces development time but leaves a future security hole. Later, the\
    \ engineers will add security, such as the login process."
