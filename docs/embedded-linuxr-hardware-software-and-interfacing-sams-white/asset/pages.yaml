  md: '# CHAPTER 11 Using Interrupts For Timing


    +   - It should use the racer''s pass ID in race information.

    - It should provide the racer with a race start indicator.

    - It should log race results.

    - It should provide access to status, race time, and racer number through /proc
    directory entries.


    Figure 11.8 shows the racer controller state map.


    ![](img/c075000fa5feb4594b1442d501c7c8d8_361_0.png)


    FIGURE 11.8 The racer controller state map.


    The operational race scenario consists of four states:


    +   - **Ready**—On power-up, the racer controller enters the ready state and awaits
    a racer. The racer gets ready at the starting gate. The radio frequency identification
    (RFID) tag reader reads the racer''s lift pass ID and sends it via the RS-232
    serial link. This places the controller in the set state.

    - **Set**—The Status LED and Racer Go LEDs turn on. The racer proceeds through
    the starting gate, sends a rising-edge signal to the ACK line and generates interrupt
    7. The interrupt handler routine executes, records the race start time with `do_gettimeofday`,
    schedules the bottom-half tasklet for execution, and puts the controller in the
    timing state.'
