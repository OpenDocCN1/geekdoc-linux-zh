    The first snowfall at Silverjack filled the air with excitement. Soon the village
    would bustle and the slopes would open. As in past years, many skiers and snowboarders
    would race against the clock on the mountain''s racecourse. This year, however,
    Project Trailblazer wants to collect, display, log, and post results. Using embedded
    Linux for Silverjack race timing will reduce entry errors, increase efficiency,
    and enhance the racers'' experience.


    This chapter explores Linux as an event timer with 1-millisecond resolution. The
    Project Trailblazer engineers need to develop interrupt handlers for the target
    boards—the MZ104, the MediaEngine and the RPX-CLEF. Then they need to use these
    handlers to measure average interrupt latencies. The engineers need to design
    a race timer that uses a split interrupt approach with “top half” and “bottom
    half” handler routines, tasklets, and a self-rescheduling kernel timer.


    # Linux Timing Sources


    Linux provides several mechanisms for event timing, ranging from 1-second down
    to submicrosecond resolution. This section discusses the following timing sources:


    +   * date—The resolution of date is 1s. Using the +%s formatter, date returns
    the number of seconds that have elapsed since 00:00:00, January 1, 1970.

    * jiffies—The resolution of jiffies is 10ms. On all platforms, Linux configures
    a hardware timer that interrupts the processor periodically—typically every'
