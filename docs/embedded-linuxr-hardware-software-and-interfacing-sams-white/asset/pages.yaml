    Using the Network File System (NFS), the target boards mount their root filesystems
    from the server. (See Chapter 5, "Debugging," for more information about NFS and
    root filesystem mounting.) When the imageReport script evaluates $imageCommand,
    grabj writes the image to the target board /tftboot directory, which is also the
    server/tftboot/i386-roots/tmp directory. When the imageGetCommand CGI script is
    executed, it returns imageCommand with a unique filename and also logs this filename
    in the Project Trailbl database tables. Another CGI script, imageGetLast, shown
    in Listing 12.9, queries the images for the last recorded image at a specific
    location. The imageGetLast returns the appropriate image file contained in /tftboot/i386-roots/tmp
    directory.


    > TIP If your target board does not mount its root filesystem using NFS, you can
    use nc, ftp, rcp, scp, or lynx to copy files from the target board to the server.
    These programs need to be cross-compiled if the target board doesn''t use an x86
    processor.


