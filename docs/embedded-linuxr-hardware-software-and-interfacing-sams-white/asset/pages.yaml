    # Collecting and Distributing Image Data


    The Project Trailblazer requirements call for image collection at the base and
    top of each lift, as well as other Silverjack locations, for a total of more than
    20 target boards with cameras. The image-grabbing software vgrababj, which is
    explained in Chapter 8, "USB Interfacing," performs a text overlay that labels
    an image with location and timestamp information. The Project Trailblazer engineers
    wanted to use this overlay functionality, but it would require individual configuration
    for each camera-equipped target board. For example, the bash script executing
    on the'
  merge: -1
  pgno: 398
- img_proc: true
  md: 'target board at the top of Lift 1 would contain the text Lift 1 As the vgrabbj
    overlay command-line parameter. Likewise, the script executing at the top of Lift
    2 would contain Lift 2 Top.


    # Lift 1 Base Temperature


    ![](img/c075000fa5feb4594b1442d501c7c8d8_399_0.png)


    Figure 12.2 The Lift 1 Base Temperature Plot, with test data.


    You could store location information in a configuration file on each target board''s
    root filesystem. A bash script could open this file to determine what location
    to use in the overlay. However, using a file still requires a unique location
    configuration for each image target board. The engineers wanted to stay away from
    unique configurations on each board because it is time-consuming and potentially
    leads to problems. Taking a unique configuration approach requires complete and
    up-to-date project documentation. The Silverjack technicians who maintain field
    equipment will require additional training. They will need to learn how to configure
    the target boards properly before field installation. Image collection is more
    than a convenience; it''s a safety system. Configuration mistakes result in system
    downtime, which could potentially put guests and employees in dangerous situations.
    The engineers wanted to design an image collection system that required no unique
    configuration for each target board.'
