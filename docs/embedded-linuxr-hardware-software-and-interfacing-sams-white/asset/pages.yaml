    The LM70_mediaengine.c device driver contains four main functions:


    +   - **init_LM70_mediaengine**—This is the device driver initialization function,
    and it creates the /proc proc directory entries trailblazer and trailblazer/temperature.
    It then configures the SA-110''s SSCR1 and SSCR0 registers enabling SSP controller
    operation on Serial Port 4.

    - **proc_read_temperature**—This function is called whenever the user performs
    a read operation on /proc/trailblazer/temperature. proc_read_temperature calls
    getTemperature.

    - **getTemperature**—This function uses the SSP controller that communicates with
    the LM70. The getTemperature function returns a value in 1-degree-Celsius increments.

    - **cleanup_LM70_MediaEngine**—This is the device driver cleanup function, and
    removes the /proc directory entries.


    The oscilloscope capture shown in Figure 10.4 shows a bit stream of 0000.1011.0011.1111,
    which corresponds to 22.25°C.


    So far the Project Trailblazer engineers have connected the LM70 temperature sensor
    to the x86 parallel printer port and the MediaEngine''s Serial Port 4 with an
    SSP controller. Synchronous serial signaling permits easy connection of external
    devices to microprocessors. Communication is simple and fast because there''s
    no need for packet formation or command addressing. Using this type of synchronous
    serial communication requires a chip select for each external device. CS signals
    are subject to availability as external SPI device count increases.'
