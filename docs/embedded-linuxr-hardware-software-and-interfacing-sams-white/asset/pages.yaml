  md: '# CHAPTER 9 Memory I/O Interfacing


    # # Finding Space in the Memory Map for the MediaEngine


    The MediaEngine has 4MB Boot memory, an Ethernet controller, optional Flash memory,
    an optional internal modem, an expansion port, and 32MB SDRAM Table 9.2, which
    is a reprint of Table 3-1 from the MediaEngine Hardware Reference Manual, shows
    device memory mappings. The MediaEngine bus expansion port contains Chip Select
    5 (/CS5), which the ARM processor maps to address 0x48000000. Section 2.4, “Memory
    Map,” of the SA-1110 Developer’s Manual, explains that Chip Select 5 is mapped
    to a 128MB memory block for static-memory or variable-latency I/O devices.


    TABLE 9.2 MediaEngine Memory Map

    | Address Range | Description |

    | 0x00000000-0x03FFFF | 4MB Boot Flash |

    | 0x08003000-0x0800308F | CS89000A Ethernet Controller |

    | 0x01000000-0x0100003F | 16MB Flash (Optional) |

    | 0x18000000-0x18000000 | Board Control Reg 0 |

    | 0x19000000-0x19000000 | Board Control Reg 1 |

    | 0x40000000-0x4000001F | Internal Modem (Optional) |

    | 0x48000000-0x4FFFFFF | Expansion Port |

    | 0xC0000000-0xC1FFFF | 32MB SDRAM |


    The MediaEngine hardware design makes available chip 5, /CS5, the expansion port
    through the JP1 connector. The L11ftmon_snowcon interface should use /CS5, which
    is mapped to address 0x48000000.


    # # Finding the Register Base Address for the MediaEngine


    The SA-1110 peripheral, system, memory, and expansion on-chip registers are mapped
    to physical addresses between 0x00000000 and 0xFFFFFFFF (Section 2.4, “Memory
    Map,” of SA-1110 Developer’s Manual). Here are the register base addresses for
    memory and general-purpose I/O:


    +   - Memory interface control registers: 0xA0000000

    - General-purpose I/O control registers: 0x90040000


    # # Configuring the Memory Controller for the MediaEngine


    The static memory control register, MSC2 (see Section 10.2.4, “Static Memory Control
    Registers,” of SA-1110 Developer’s Manual), configures control bits for Chip Select
    4 and Chip Select 5. MSC2 configures the ROM type, bus width, first access delay,
    next access delay, and recovery time. Remember that the ARM needs to'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Developing Lift Monitoring and Snow-Making Control for the MediaEngine 233


    configured for the slowest possible configuration of MSC2 for the liftmon_snowon
    interface circuit. Table 9.3 shows the MSC2 bit field descriptions and the values
    used in this design.


    # TABLE 9.3 MSC2 Bit Field Descriptions and Design Values


    | Bits | Name | Value | Description |

    |---|---|---|--|

    | 1..0 | RT5 1.0 | 01 | ROM Type: Nonburst-latency I/O |

    | 2 | RBW5 | 1 | ROM bus width: 16 bits |

    | 7..3 | RDFS 4.0 | 11111 | ROM delay first access: delay set to maximum |

    | 12.8 | RDNS 4.0 | 11111 | ROM delay next access: delay set to maximum |

    | 15..13 | RRRS 2.0 | | ROM recovery time: recovery time set to maximum |


    The liftmon_snowon interface design requires MSC2 to be 0b11111111111111 or 0xFFFF.


    # Assigning the Output Module Signal for the MediaEngine


    The MediaEngine bus expansion interface connector offers only GPIO014. Therefore,
    the Project Trailblazer engineers assigned GPIO014 to control the OutputModuleEnable
    signal.


    # Configuring the I/O Port Controller for the MediaEngine


    GPIO014 is a general-purpose I/O pin and has an alternate function: It can also
    be the transmit pin for UART 1. The Project Trailblazer engineers need to configure
    the ARM I/O port controller registers shown in Table 9.4 for GPIO014 output with
    no alternate function.


    # TABLE 9.4 Additional ARM register settings to make GPIO014 an output pin


    | Register | Description | Bit Setting | Description |

    |---|---|---|--|

    | GAFR | GPIO Alternate Function Register | AF14 = 0 | No alternate function |

    | GDPR | GPIO Pin Direction Register | PD14 = 1 | Output |


