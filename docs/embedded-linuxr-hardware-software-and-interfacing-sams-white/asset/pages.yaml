  md: '# Parallel Port Interfacing


    Silverjack maintains its high-quality winter experience with a supplemental snow-making
    operation. Lift operation monitoring and snow-making equipment control are Project
    Trailblazer requirements. Lift access point displays inform guests about the current
    operational status of mountain lifts. Silverjack Operations Department will also
    compile lift uptime statistics for the Marketing Department. Project Trailblazer
    will allow the Operations Department to centralize and automate the snow-making
    process. Using mountaintop temperatures, Operations will develop a simple snow-making
    control algorithm that opens and closes water valves and controls equipment heaters.


    The Project Trailblazer engineers discussed lift monitoring and snow-making control
    with Operations. Together, they determined input and output requirements. Monitoring
    a single lift requires six inputs, connected to the following alternating current
    (AC) sources:


    +   * Three-phase AC power for the lift motor

    * Lift motor controller output that indicates that the lift motor is functioning
    properly

    * Lift motor controller output that indicates operation in slow-speed mode

    * Lift motor controller output that indicates operation in high-speed mode

    * An operator switch that can be closed at lift base

    * An operator switch that can be closed at lift top


    # IN THIS CHAPTER


    +   * Control Using the Parallel Port with Port I/O

    * Standard Parallel Port Control Using ppdev

    * Developing a Custom Device Driver

    * Standard Parallel Port Control Using the Custom Device Driver liftmon_snow

    * Additional Reading'
