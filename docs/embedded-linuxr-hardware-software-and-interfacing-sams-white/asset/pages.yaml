  md: '# The Linux Boot Process


    +   - **PBR-4**—The target board will boot, initialize the Ethernet hardware,
    set a static IP address, and be configured to use the Domain Name Service (DNS).

    - **PBR-5**—The target board will contain the ping program to debug network programs.

    - **PBR-6**—The target board will be capable of executing the cross-compiled version
    of helloworld.

    - **PBR-7**—The target board will use a current version of GNU glibc. The selected
    target platforms contain sufficient RAM and storage resources to use GNU glibc.
    Projects like BusyBox, sglibc, uClibc, dietlibc, newlib, and libc will not be
    considered.


    Awaiting armed and with these seven target PBRs, the engineers proceeded to learn
    about the Linux boot process, the root filesystem, whether to compile or download
    the root filesystem binaries, target platform similarities and differences, kernel
    compilation, and some i386 hard booting specifics. We''ll come back to these boot
    requirements later in this chapter.


    # The Linux Boot Process


    A target board booting Linux proceeds through several steps after reset to get
    a system prompt. The initial steps, such as ROM startup code and register configuration,
    are microprocessor hardware dependent. The kernel itself contains microprocessor-dependent
    initialization code that is executed first. This initialization code configures
    the microprocessor registers for protected-mode operation and invokes the architecture-independent
    kernel starting point called start_kernel. From this point on, the kernel boot
    process is identical for all architectures. The Linux boot process involves the
    following steps:


    +   1. After a processor is reset, it executes ROM startup code.

    2. The ROM startup code initializes the CPU, memory controller, and on-chip devices,
    and it configures the memory map. The ROM startup code then executes a bootloader.

    3. The bootloader decompresses the Linux kernel into RAM from Flash memory or
    a TFTP server transfer. The kernel first configures microprocessor registers and
    then invokes the kernel''s first instruction—start_kernel, which is the architecture-independent
    starting point.

    4. The kernel initializes its caches and various hardware devices.

    5. The kernel mounts the root filesystem.

    6. The kernel executes the init process.'
  merge: -1
  pgno: 80
- img_proc: true
  md: '# CHAPTER 4 Booting Linux


    7. The executing init process loads /etc shared runtime libraries.


    8. init reads its configuration file, /etc/inittab, and executes scripts. Typically,
    init executes a startup script, /etc/rc.d/rcS, which configures and starts networking
    and other system services.


    9. init enters a runlevel where system duties can be performed or the login process
    can start, allowing for user sessions.


    The Project Trailblazer engineers learned from the board manufacturers’ documentation
    that steps 1, 2 and 3 are easy to understand, configure, and execute. Step 4 is
    dependent on kernel compilation configuration. Step 5 presents a wide range of
    options, including mounting a local disk, mounting a network drive, and using
    a RAM disk. Step 7 requires proper compilation of glibc and other libraries.


    The engineers read about replacing the init program with bash directly in step
    6. They opted to use init for two reasons. First, init can handle initialization
    of networking and system services via scripts. In step 9 the engineers will use
    to call bash directly instead of using the login process. init can respawn processes
    that terminate. This means that if bash terminates, init will re-execute it. Use
    of init fulfills PBR-2. Having init directs instead instead of login allows console
    operations without security. The engineers intend to add the login process prior
    to placing the target board in field operations.


    > TIP

    Having init call bash directly instead of login saves time because you do not
    have to log in during development. In a secure lab, convenience outweighs security.
    When you deploy designs, you should modify /etc/inittab so that init calls login,
    to provide the first level of authentication.


    # The Linux root Filesystem


    The Linux root filesystem contains files and executables that the kernel requires,
    as well as executables for system administration. In a desktop installation, the
    kernel mounts a hard disk partition on the / directory. The following directories
    exist beneath the / directory:


    +   * /bin and /sbin system system executables such as init, ifconfig, mount,
    cd, mkdir, and ping.

    * /lib contains the shared libraries (libc and others) and the Linux dynamic loader.

    * /etc contains system configuration files and scripts.'
  merge: -1
