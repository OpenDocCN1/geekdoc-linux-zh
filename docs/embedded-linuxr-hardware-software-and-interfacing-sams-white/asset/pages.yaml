    capture at the bottom and top of each lift, as well as in other Silverjack locations.
    Equipment costs will therefore add up quickly. The engineers need a low-cost solution
    for audio playback and image capture. Unfortunately, the Project Trailblazer target
    platforms do not peripheral component interconnect (PCI) bus connectors. Therefore,
    the engineers opted to use universal serial bus (USB) speakers and cameras. The
    consumer market has driven the price of speakers and cameras very low—in the $30
    range. The engineers know that the majority of USB devices available today sync
    with Windows drivers. They didn''t know whether devices and their drivers support
    Linux. The engineers figured that if the drivers did not exist, they might have
    to write their own


    # Learning about USB


    The engineers first found USB Complete by Jan Axelson¹ which claims to tell "every-thing
    you need to develop USB peripherals.\ The first half of this book explains USB,
    data transfers, and device identification (called enumeration). The second half
    addresses device hardware using design chips. The book content isn''t an exact
    match for developing Linux USB device drivers, but it provides a great introduction
    to USB communications. Here''s what the engineers learned:


    +   - The bus is asynchronous serial, with differential signaling.

    - USB is plug-and-play; the user doesn''t configure memory addresses, I/O addresses,
    interrupts or direct memory access (DMA).

    - USB v1.1 supports a 12Mbps data rate.

    - USB v2.0, which is relatively new, supports a 480Mbps data rate.

    - The bus supports up to 127 devices, using a tiered topology of hubs and devices.

    - USB devices are self-describing.


    +   - Interrupt transfers support periodic bandwidth.

    - Isochronous transfers support guaranteed bandwidth.

    - Control transfers support guaranteed bus access.

    - Bulk transfers support low-priority large data transfers.


    USB supports four transfer modes that address the bandwidth requirements of different
    devices:


    +   - The USB controllers prioritize communications by using the four transfer
    modes to optimize communications.'
