    # USB Mass Storage: SanDisk USB SmartMedia Card Reader


    Most digital cameras have removable memory cards, the user can increase the number
    of photographs between computer down-loads. An image kiosk that transfers and
    emails images from memory cards could provide the same result. Besides, guests
    would love to email their co-workers shots from the slopes with captions like
    “Having a Great Time!


    The Project Trailbl engineers select the SmartMedia memory reader over Compact
    Flash or Memory Stick primarily that’s what their personal cameras use. This section
    outlines the tbdev1 configuration steps to read the contents of a SmartMedia card.
    Linux USB also supports other removable memory devices. See the Linux-USB device
    over Web site for more information.


    Kernel version 2.4.10 includes driver source for the SanDisk USB SmartMedia card
    reader, model DDR-09. USB mass storage device drivers are merely interfaces to
    the Linux SCSI layer. This means, in addition to USB options, you also need to
    configure certain SCSI options within the kernel configuration. In this section,
    you will configure and build a new kernel that will access the SmartMedia card
    reader as a SCSI device. Here are the steps you will perform on tbdev1:


    +   1. Configure the kernel for SCSI operation and SDDR-09 use. Compile and install
    the kernel. Then reboot tbdev1.

    2. Connect the SanDisk USB SmartMedia card reader.

    3. Mount and test the card reader operation.'
  merge: -1
