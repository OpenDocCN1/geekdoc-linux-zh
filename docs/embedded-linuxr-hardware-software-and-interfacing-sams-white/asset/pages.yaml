    # The root Filesystem Binary Files: Compile or Download?


    The engineers determined that it would be easy to copy them all these files for
    the i386 computer. The ARM and PowerPC versions would require cross-compiling.
    This list is short compared to the Debian base installation of 10,734 files, cross-compiling
    all these executables would require significant effort. The main current source
    code would have to be located and downloaded. The individual makedfiles would
    require modification for cross-compiling and library linking. Finally, the code
    would need to be compiled. The engineers thought that there must be an easier
    way, that someone else had probably already done ARM and PowerPC cross-compiling.
    During their initial research, the engineers found that the Debian site (www.debian.org)
    contains source and compiled binaries for Alpha, i386, m68k, PowerPC, and SPARC
    processors. This availability of compiled binaries looked promising, until the
    Debian software lags behind current versions of open-source software. Debian publicly
    acknowledges this and distributes software “when it’s time”. In addition, the
    Debian versions of PowerPC binaries are compiled for processors that have floating-point
    units. The Trailblazer RXP-CLFF target board uses a Motorola MPC860 that doesn''t
    have a floating-point unit. They decided to look elsewhere.


    Recently, MonteVista software Released Hat Linux (HHL), version 2 using kernel
    2.4.2.¹ MonteVista distributes HHLv2: two varieties of the Jouryman and the Professional
    editions. The Jouryman edition caught the engineers'' attention because it supports
    i386, ARM, and PowerPC, specifically the MPC8xx processors— and it''s free. The
    Jouryman CD contents well as CD images are publicly available at the MonteVista
    FTP site (ftp.vista.com/pub/Jouryman).'
