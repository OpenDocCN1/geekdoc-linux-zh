  md: '# CHAPTER 7 Parallel Port Interfacing


    When it is loaded, this device driver asserts OUTPUT_ENABLE. It shields software
    devel-opers from interface logic specifics. It provides bash script access to
    individual lift monitoring and snow-making equipment through a /proc file interface.
    Use of this device driver eases system integration using bash scripts.


    # Summary


    This chapter covers a tremendous amount of information. The Project Trailbl engineers
    started by establishing their input and output requirements for lift monitoring
    and snow-making control through discussions with the Operations Department. They
    investigated I/O boards and decided on PC parallel port use. They designed an
    interface circuit to connect a PC parallel port to an input module board and an
    output module board. When they began writing control software, three approaches
    evolved: port I/O using inb and out functions, parallel port control using the
    Linux ppdev device, and development of a custom device driver. The first I/O approach
    was simple. However, its use had drawbacks that make it too risky. The second
    approach, using ppdev, didn''t solve the drawbacks. The engineers decided to develop
    a custom driver, with an easy-to-use interface (that is, files in the /proc directory)
    for lift monitoring and snow-making control. The driver hides interface circuit-specific
    knowledge from the developer and provides an eloquent interface for bash scripting.
    The liftmon_snow device development was a little more complicated than the use
    of port I/O, but the benefits far outweighed the costs.


    # Additional Reading


    +   1. Riku Saikkonen, “Linux I/O port programming mini-HOWTO,” www.linuxdoc.org/HOWTO/mini/IO-Port-Programming.html.

    2. Tim Waugh, “Linux 2.4 Parallel Port Subsystem,” http://people.redhat.com/twaugh/parport/html/parportguide.html.

    3. Ori Pomerantz, “Linux Kernel Module Programming Guide,” www.linuxdoc.org/LDP/lkmpg/mpg.html.

    4. Erik Mouw, “Linux Kernel Profs Guide,” http://kernelnewbies.org/documents/kdoc/profs-guide/lkprofsguide.html.'
