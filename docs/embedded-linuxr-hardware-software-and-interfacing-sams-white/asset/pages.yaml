  md: '# # 4 Booting Linux


    Project Trailblazer was off and running. The Silverjack Engineering Department
    ordered the development target platforms and other hardware: the Embedded Planet
    RPX-CLLF, the Brightstar MediaEngine, the Tri-M MZ104 x86 single-board computer,
    and the solid-state hard hardware to boot a commercial off-the-shelf (COTS) PC.
    The staff then had a few days to learn about the Linux boot process. Fortunately,
    Linux''s code commonality simplified filesystem development and deployment, regardless
    of platform. This chapter chronicles the team''s booting journey. The team wanted
    to ultimately run its version of helloworld on all the platforms.


    The engineers developed a small set of platform boot requirements (PBRs) for all
    the incoming target boards. These requirements are simple and are shown in the
    following section. When the boards are successfully booted, they will form the
    baseline development system, shown in Figure 4.1, on which to build Project Trailblazer.


    +   IN THIS CHAPTER

    * The Target PBRs

    * The Linux Boot Process

    * Creating the root Filesystem

    * Installing the TFTP Server

    * Installing mini.com

    * Booting the Embedded Board RPX-CLLF

    * Booting the Brightstar Engineering MediaEngine

    * Booting the Tri-M MZ104 and the COTS PC with a Flash IDE Drive

    * Boot Comparison

    * Additional Reading'
