    # The Process for Building the root Filesystem


    The procedure for building a root filesystem consists of the two steps: Edit the
    buildrootfilesystem script PACKAGES line, incorporating the package information
    from Table 4.2, and then execute the buildrootfilesystem script. The buildrootfilesystem
    script performs the following operations:


    +   1. It determines what packages to download.

    2. It creates the build and new target root filesystem directories.

    3. It downloads the packages defined in the PACKAGES script line.

    4. It extracts the packages'' contents into a temporary directory.

    5. It copies the required programs (see Table 4.2) from the temporary directory
    to the new root filesystem directory.


    > TIP

    Do want the buildrootfilesystem script to add another program to your root filesystem?
    If so, determine which package contains the program you want. Edit the buildrootfilesystem
    script, add the package name to the PACKAGES line, add the program name to the
    script''s step 5 section and re-run the script.


    +   6. It strips the required debugging information of their debugging information
    (Many programs are compiled with the -g debugging flag, which creates executables
    that have larger file sizes. You probably not going to debug these particular
    executables, so you can strip the debugging information to get more file space).

    7. It creates the extra configuration files, such as initabb and rcS.'
