    The SAA1064_rpxcllf.c device driver contains three main functions:


    +   - **init_SAA1064_RPX_CLLF**—This is the module initialization function, and
    it creates the /proc directory entries trailblazer and trailblazer/temperaturedisplay.

    - **proc_write_temperaturedisplay**—This function is called when the user performs
    an operation on /proc/trailblazer/temperaturedisplay.

    proc_write_temperaturedisplay() calls writei2c, which performs the actual I2C
    communication with the SAA1064.

    - **cleanup_SAA1064_RPX_CLLF**—This is the module cleanup function, and it removes
    the /proc directory entries.


    You can compile and test the SAA1064_rpxcllf device driver by using these steps:


    +   1. Compile the SAA1064_rpxcllf device driver by using this command:


    ```

    root@ttdev1[528]:# powerpc-linux-gcc -02 -D_KERNEL__ -MODULE

    -I/usr/src/powerpc-linux/include \\

    -c SAA1064_rpxcllf.c \\

    -o /tftpboot/powerpc-rootfs/tmp/SAA1064_rpxcllf.o

    ```


    +   2. Load the driver on the RPX-CLLF by using this command:


    ```

    bash-2.04# insmod SAA1064_rpxcllf.o

    immr = 0xFA200000

    PBAR = 0x1CF0

    PBDIR = 0x1333

    PBODR = 0x0033

    PBAT = 0x0483

    Display initialization passed

    SAA1064_rpxcllf 1.0 initialized

    ```


    This console output shows the SAA1064 device driver initialized correctly.

    SAA1064#0 LEDs have a dash character displayed.'
