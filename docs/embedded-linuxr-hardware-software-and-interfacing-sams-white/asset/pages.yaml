    root@tbdev1[510]: apt-get -y install wget

    root@tbdev1[511]: apt-get -y install ncurses-dev

    root@tbdev1[512]: apt-get -y install telnet

    ```


    You''re now ready to build the GNU tool chain for cross-compiling. The gcc compiler
    you just downloaded is the x86 compiler to compile two new versions of gcc—powerpc-linux-gcc
    and arm-linux-gcc—that create PowerPC or ARM executables. The next section discusses
    cross-compiling and the creation of powerpc-linux-gcc and arm-linux-gcc, the cross-compilers
    and their appropriate glibc library files, and gdb.


    # Building the GNU Tool Chain for Cross-Compiling


    A cross-compiler runs on a processor but generates executable code for a different
    processor. For example, an ARM cross-compiler running on an x86 processor generates
    code for an ARM processor, and a PowerPC cross-compiler generates code for a PowerPC.


    Why does Project Trailblazer require a cross-compiler? Typically embedded systems
    don''t have the RAM or storage resources to compile their own executables. A host
    processor in this case tbdev1 can cross-compile to create an executable. This
    executable is then transferred and executed on the target board. The GNU tool
    chain is capable of cross-compiling, but not as a command-line option. The entire
    tool chain requires compiling for operation as a cross-compiler. This is not a
    simple make install, apt-get, or rpm process. The cross-compiler build process
    is not completely documented or decto current.'
