    The LEDs now display 1234. The first two characters of an I2C communication with
    the SAA1064 is shown in Figure 10.8. This shows the first byte: address of 0x70
    with a receiver acknowledge in bit 9 (the wider clock bit).


    ![](img/c075000fa5feb4594b1442d501c7c8d8_331_0.png)


    **FIGURE 10.8** An oscilloscope capture of SCL (top trace) and SDA (bottom trace)
    signals during an RPX-CLLF I2C communication with an SAA1064.


    > **TIP**


    When debugging I2C hardware and software, you can use an oscilloscope to look
    for the acknowledge bit sent by the receiver. If the bit is there, you have successfullywired
    the circuit and send the I2C device the correct start condition and its address.
    If the bit is not present, you need to check the circuit''s wiring, signal and
    power supply voltage levels, and bus pull-up resistor values, and you need to
    closely examine the start condition and the data and clock signal timing. Also,
    while you''re debugging the circuit, you should operate your I2C communication
    at the slowest possible speed. This gives your devices time to properly drive
    the data and clock signals. When your circuit functions correctly, you can remove
    delays and increase the communication speed.'
