  md: '# Control Using the Parallel Port


    The parallel port, sometimes called a printer port, was originally designed to
    connect a printer to the computer. Over the years, many other devices, such as
    scanners, removal drives, and copy protection devices, have been connected to
    PCs via parallel ports. In today''s PCs, this port has eight bidirectional data
    lines, four bidirectional control lines, and five status input lines, and they
    are accessed through a DB-25 female connector. Since its inception, the parallel
    port has evolved into four types:


    +   - The standard parallel port (SPP)

    - The PS/2-type (simple bidirectional) port

    - The enhanced parallel port (EPP)

    - The extended capabilities port (ECP)


    The IEEE standard 1284, "IEEE Standard Signaling Method for a Bidirectional Peripheral
    Interface for Personal Computers," defines these four types and is summarized
    in this document:


    +   - Warp Engineering’s "Introduction to the IEEE 1284-1994 Standard," www.fapo.com/1284int.htm.

    - Other online documentation fully explains the similarities and differences between
    these types and are as follows:

    - Jan Axelson’s "Parallel Port Computer Programming, Interfacing, & Using the
    PC’s Parallel Printer Port," www.lvr.com/files/ppc1.pdf.

    - Craig Peacock’s "Interfacing the Parallel Port," www.beyondlogic.org/spp/parallel.pdf.

    - Craig Peacock’s "Interfacing the Enhanced Parallel Port," www.beyondlogic.org/epp/epp.pdf.

    - Craig Peacock’s "Interfacing the Extended Capabilities Port," www.beyondlogic.org/ecp/ecp.pdf.


    Project Trailblazer has six inputs and four outputs. Using the online documentation,
    the engineers determined the bidirectional SPP type of port will suffice. The
    port does not need to control a high-speed printer—just some slow-speed inputs
    and outputs.


    SPP hardware is usually port I/O to the x86 ISA bus (that is, the port is not
    memory mapped) at I/O base address 0x378. By using the motherboard BIOS, you can
    change this address and port type. For this chapter, make sure that your PC’s
    BIOS configures LPT1 as an SPP type at the base address 0x378. The three SPP'
  merge: -1
