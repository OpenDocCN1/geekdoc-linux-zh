    # Step 9, Preparation A: The root Filesystem on a RAM Disk


    If it is configured with RAM disk support, the kernel contains to create a disk
    drive in RAM memory, extract the contents of this RAM disk from another location,
    and mount this RAM disk as its root filesystem. This common procedure allows embedded
    system operation without a hard disk. Keep in mind that the RAM disk exists only
    until the power cycles or the machine reboots. The contents of the RAM disk are
    not typically stored across reboots. Project Trailblazer accepts this limitation
    because no field unit will store information locally.


    To prepare a RAM disk, the buildrootfilesystem script implements these steps:


    +   1. It creates a file, called ramrootfs, that is the same size as the final
    RAM disk.

    2. It fills ramrootfs with zeros.

    3. It makes a filesystem in ramrootfs.

    4. It mounts ramrootfs using a loopback device.

    5. It copies the contents of the target root filesystem directory to ramrootfs.

    6. It unmounts ramrootfs.

    7. It compresses ramrootfs.


    Step 9 of the buildrootfilesystem script contains the commands to create, fill,
    and compress ramrootfs. See the section "Booting the Embedded Planet RPX-CLLF,"
    later in this chapter for specific instructions on getting the PowerPC board booted'
