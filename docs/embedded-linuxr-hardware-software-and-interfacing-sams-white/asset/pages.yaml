    # How the File open System Call Affects DTR and RTS Signals


    While they were debugging, the engineers noticed a peculiar serial driver behavior
    that required further research. The Linux serial port driver contains functionality
    for modem control, using the open open system call either asserts or de-asserts
    DTR and RTS. You can see this by scanning /usr/src/linux/drivers/char/serial.c
    for the DTR and modem control register (MCR). In particular, these startup function
    define what gets written to the MCR:


    ```

    info->MCR = 0;

    if (info->tty->termios->c_cflag & CBAUD)

    info->MCR = UART_MCR_DTR | UART_MCR_RTS;

    ```


    Why is this important? Obtaining a serial file descriptor by using the open command
    results in DTR and RTS either being set or cleared, depending on whether a baud
    rate is set. The startup function doesn''t query the MCR to preserve the DTR or
    RTS status.


    Use of DTR and RTS modem control signals allows for two single-bit outputs. Clearing
    the HUPCL bit in the serial port''s c_flags register preserves the individual
    state of DTR and RTS at file closure. However, the serial file open system call
    in serial.c clears or sets both DTR and RTS. This doesn''t preserve the state
    of'
