    # Debugging


    Regardless of their talent or expertise, all programmers need to debug code. The
    Project Tailwind engineers know they''ll need to do some debugging and the time
    they spend on debugging will affect their schedule.


    The Project Tailwind want a reliable and robust solution for their remote debugging
    needs. They want this solution to span the project''s target processors (x86,
    ARM and PowerPC), communicate over the Transmission Control Protocol/Internet
    Protocol (TCP/IP) network, and be non-proprietary. The GNU debugging tools gdb
    and gdbserver provide this solution.


    In this chapter, you''ll debug the helloworld program both locally and remotely,
    using gdb and gdbserver. Then you''ll learn the compile/run/debug iteration cycle
    time by configuring the project target boards to mount their root filesystems
    via Network File System (NFS). This chapter is by no means a comprehensive explanation
    of debugging; other sources of information already exist.¹,² Nor does it use graphical
    user interface (GUI) debugging tools, such as xgdb,³ DDD,⁴ and insight,⁵ which
    are built on gdb. This chapter presents information on remotely debugging a simple
    program across the network. You can use this debugging knowledge and other tools
    to enhance your environment and decrease your development time.


    # Introducing gdb


    The GNU tool chain debugger, gdb, allows you to control program execution, view
    and change program variables, examine program internals, and examine core files
    of crashed programs. You can use gdb to start an executable, debug an already
    running executable, or make a network connection to gdbserver. gdb and gdbserver
    handle and'
