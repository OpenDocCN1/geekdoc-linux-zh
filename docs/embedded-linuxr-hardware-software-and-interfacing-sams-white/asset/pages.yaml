  md: '# CHAPTER 6 Asynchronous Serial Communication Interfacing


    The querySerial program requires four command-line parameters: the serial port
    to use (/dev/ttyS0 or /dev/ttyS1), the baud rate (1200, 2400, 9600, 19200, or
    38400), a timeout value in milliseconds, and the command to be sent. querySerial
    returns the command at the baud rate, waits the specified amount of time, and
    returns all characters received on the serial port. You can test querySerial directly
    on tbdev1, without using a target board. Here are the steps to compile and test
    querySerial:


    +   1. Compile querySerial.c:

    root@tbdev1[510]: gcc -o querySerial querySerial.c


    2. Physically connect tbdev1''s serial ports together, using a null modem adapter
    and minicom.


    3. In one console window, run minicom and configure it by typing CTRL-a and then
    o. Select Serial Port Set. Set SERIAL DEVICE to /dev/ttyS0 and the Bps/Par/Bits
    to 1200 8N1.


    4. In another console window, run querySerial to send a command out ttyS1 to ttyS0,
    which shows up in the minicom window. To do this, issue the following command:

    root@tbdev1[517]: querySerial /dev/ttyS1 1200 5000 "this is a test"


    The string "this is a test" should show in the minicom window. querySerial timeout,
    which is set to 5000 milliseconds, gives you 5 seconds to type a reply.


    +   5. In the minicom window, type "got it". If you do this within 5 seconds,
    you should see this at the bash prompt:

    root@tbdev1[518]: querySerial /dev/ttyS0 1200 5000 "this is a test"

    got it

    root@tbdev1[519]:


    If you don''t finish typing it within 5 seconds, querySerial returns what you
    did type in 5 seconds.


