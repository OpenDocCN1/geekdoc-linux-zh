  md: '# Boot Comparison


    The Project Trailazer engineers developed a BIOS comparison table shown in Table
    4.3. This table compares the "power on bash prompt" timing and target root filesystem
    size for the four platforms involved in Project Trailazer.


    | TABLE 4.3 Project Trailazer Target Comparison |

    | Platform | Power on bash Prompt Time | Target Filesystem Size |

    | --- | --- | --- |

    | Embedded Planet XRP-CLLF, PowerPC 860 | 27 seconds, including 6-second TFTP
    download of the kernel and RAM disk | 4612KB |

    | Brightstar Engineering MediaEngine, StrongArm1100 | 13 seconds, including 6-second
    TFTP download of the kernel and RAM disk | 4232KB |

    | Tri-M MZ104, Pentium (100MHz) | 29 seconds, including 17-second BIOS completion
    time | 4888KB |

    | Micron COTS PC, Celeron (400MHz) | 27 seconds, including 20-second BIOS completion
    time | 4888KB |


    All the target platforms power up and boot to a prompt in under 30 seconds. The
    fastest is the MediaEngine, at 13 seconds. The RP-CLLF and MediaEngine boot times
    include a 6-second TFTP kernel transfer time. This time would be eliminated if
    the on-board Flash memory stored the kernel image. The X86 MZ104 and COTS PC boot
    times include the mandatory BIOS completion time. The filesize similarity shows
    that the compiled binaries are roughly the same size for x86, ARM, and PowerPC
    microprocessors.


