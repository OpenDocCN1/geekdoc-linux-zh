  md: '# I2C Communication with the Philips Semiconductor SAA1064 305


    The SAA1064_x86.c program performs as expected. The four numbers sent to the SAA1064
    appear on the seven-segment LEDs. Using code from the lm_sensors project that
    the Project Trailblazer engineers did not have to develop a bit-bang I2C driver
    for the x86 parallel port, the i2c-port module offers access to the SAA1064 through
    a /dev device file that is not a /proc entry. All the Project Trailblazer interfaces
    handle hardware output as named /proc entries, and named /proc entries make basic
    kernel scripting simple.


    It''s possible to write an SAA1064 device driver by modifying the SAA1086_x86.c
    code shown in Listing 10.3 that it provided /proc entries. This driver would access
    the /dev/i2c device file. Using this approach would require loading the i2c-core,
    i2c-algo-bit, i2c-dev and i2c-port modules, as well as the device driver. It might
    be easier to write an I2C bit-banging x86 parallel printer port driver and not
    use any lm_sensors code. Writing your own I2C bit-banging code is simple. Many
    I2C source examples exist to help you understand the communication protocol. In
    fact, in the next section, you''ll see example because the Project Trailblazer
    engineers wrote an I2C bit-banging routine for the RPC-LLF.


    # Connecting the SAA1064 to the RPC-LLF


    The RPC-LLF_MPC860 contains a dedicated I2C controller. Of the controller is more
    CPU efficient than bit-banging software. The currentxx lm_sensors code utilizes
    the MPC860''s I2C controller. The lm_sensors device drivers provide access to
    I2C devices through /dev files. Ideally, use of these drivers should reduce Project
    Trailblazer development time because the engineers don''t need a full understanding
    of MPC860 internals.


    At first, the Project Trailblazer engineers were excited about using the lm_sensors
    code. However, when it came to cross-compile code for the PowerPC, they changed
    their minds. Although 8 files are contained within the lm_sensors project, they
    aren''t kept and aren''t part of their configuration process. Cross-compiling
    isn''t a simple process. The engineers spent too much time patching and making
    files. They successfully compiled the device drivers. However, inserting modules
    resulted in errors because some assembly was missing. Confused, the engineers
    read more about I2C on the PowerPC mailing list. They decided to abandon the lm_sensors
    code when they read about the I2C developer discussion concerning the I2C restructuring:
    Accounts of unsuccessful compiling, missing assembling, and restructuring led
    the team to write their own SAA1064 device driver.


    Right after successfully using the SA-11101''s SSP protocol for SPI communication,
    the engineers decided to investigate using the MPC860''s I2C controller. Unfortunately,
    it wasn''t simple. The MPC860''s I2C controller uses interrupts, DMA, and memory
    buffers. The engineers simply didn''t have the time or the expertise to'
