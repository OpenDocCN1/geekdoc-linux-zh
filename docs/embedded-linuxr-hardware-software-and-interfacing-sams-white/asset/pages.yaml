  md: '# Developing Lift Monitoring and Snow-Making Control for the MediaEngine


    Before the port Trailblazer engineers can access the OutputModuleEnable, the CPU''s
    port I/O controller must be configured. Many I/O pins on both the ARM and PowerPC
    processors have an alternate function for on-chip peripherals, such as serial
    ports. The Project Trailblazer engineers need to configure the I/O controller
    so that the OutputModuleEnable signal does not use an alternate and so that it
    is an output.


    Configuring CPU registers is easy. It''s a good idea to test the configuration
    with a simple program. The Project Trailblazer engineers need to write a simple
    device driver to test their ARM and PowerPC CPU configuration. This simple device
    driver, hellbit, should configure the CPU memory and I/O controllers and then
    access a memory location and toggle the OutputModuleEnable signal. By using a
    logic probe or oscilloscope, the Project Trailblazer engineers need to verify
    configuration of the CPU registers.


    With the hardware design complete and finished, the Project Trailblazer engineers
    need to write the lift monitoring and snow-making control device driver for the
    ARM and PowerPC processors. Using the liftmon_snowon.c device source code from
    Chapter 7, the engineers develop lift monitoring and snow-making control device
    drivers for the MediaEngine and the RPX-CLLF.


    # Developing Lift Monitoring and Snow-Making Control for the MediaEngine


    This section details the MediaEngine interface hardware design. After the engineers
    find space in the memory map for the I/O circuit, they configure the CPU registers
    and test the circuit by using the hellbit program. They then develop the MediaEngine
    liftmon_snowon device driver, which enables the MediaEngine target to monitor
    lifts and control snow-making equipment.


    # Designing the External Interface Hardware for the MediaEngine


    In order for the MediaEngine to monitor lifts and control snow making, it needs
    to read six inputs and control four outputs. In this design, an output latch and
    input buffer connect directly to the MediaEngine''s CPU bus. The MediaEngine features
    external interface connectors that permit access to various CPU signals. The bus
    expansion header, JP1, provides the signals listed in Table 9.1.


    # TABLE 9.1 MediaEngine JP1 Signals


    | Description | Signals |

    |---|---|n| Address lines | A0–A15 |

    | Data lines | D0–D15 |

    | Chip select | /C55 |'
