  md: '# Summary


    In this chapter the Project Blazer engineers connected SPI and I2C devices to
    their target boards. They developed device drivers that provide access to an SPI
    temperature sensor and an I2C LED display driver. These drivers utilize bit-banging
    routines, on-chip controllers, and open-source device drivers. The software/hardware
    combination presented in this chapter provides a foundation for communication
    with other SPI and I2C devices connected to the x86, ARM, and PowerPC processors
    such as EEPROM storage, data converters, digital tuners, and signal processors.


