  md: '# Network-Mounting the root Filesystem


    You have now completed your first multi-architecture remote debugging session.

    Was''t that easy? You now have a functional multiarchitecture system to build
    on.

    From here, you can investigate the use of tools that are built on gob, such as
    dd and insight, to make your debugging life easier. See the "Additional Reading"
    section at the end of this chapter for more information.


    # Network-Mounting the root Filesystem


    tbdevarm''s root filesystem, generated by the tbdevrootfilesystem script, contains
    the cross-compiled version of helloworld and gobserver. Changing the helloworld
    source code would require completely rebuilding the root filesystem, rebooting
    the MediaEngine, and then downloading the kernel and root filesystem again. Even
    though the MediaEngine boots quickly, taking this approach over time would become
    tedious and consuming.


    Instead of transferring the root filesystem, you can mount it over the Ethernet
    network using NFS-mounted root filesystem, you can generate the ARM cross-compiled
    version of helloworld.c on tbdev1. Then you can directly execute or remotely debug
    it without regenerating the MediaEngine root filesystem or rebooting. The tbdevrootfilesystem
    script creates the minimum root filesystem in /tfboot directory and can be NFS-mounted
    directly.


    The Unix world commonly uses NFS to mount hard disks on remote computers. For
    example, a server can serve its /home directory for user workstations or the /tfboot
    directory for diskless workstations to mount their root filesystem. (Note that
    diskless workstations and the Project Trailblazer target platforms use TFTP, not
    NFS, to load their kernels.) The Linux kernel itself contains NFS code, which
    allows the kernel to mount its own root filesystem during the boot process.


    In this section, you''ll learn how to configure tbdev1 to act as an NFS server
    and configure the target board''s kernel options for network-mounting your root
    filesystem.


    # Configuring the NFS Server


    tbdev1 serves as the Project Trailblazer target root NFS server. You can configure
    it to serve the i386 files the i386 target (MZ104 and COTS PC), the ARM files
    to the ARM target (MediaEngine), and the PowerPC files to the PowerPC target (RPX-CLLF).
    As you can tell, it''s important to serve the correct files to each architecture.
    Figure 5.2 shows the Project Trailblazer development computers and their IP addresses.'
  merge: -1
  pgno: 144
- img_proc: true
  md: "# CHAPTER 5 Debugging\n\n![](img/c075000fa5feb4594b1442d501c7c8d8_145_0.png)\n\
    \nFIGURE 5.2 The Project Trailblazer development stations and their IP addresses.\n\
    \nHere are the steps to install, configure, and run the NFS server on tbdev1:\n\
    \n+   1. Install the NFS server on tbdev1:\n   \n`root@tbdev1[501]: apt-get install\
    \ nfs-server`\n\n+   2. Configure tbdev1's NFS server by adding an entry to its\
    \ configuration file, /exports, for each target platform. Each entry contains\
    \ a directory, an IP address, and mounting permissions. To do so, add these lines\
    \ to /etc/exports:\n\n```\n/tftpboot/arm-rootfs\t\t192.168.1.21 (rw,no_root_squash)\n\
    /tftpboot/powerrc-rootfs\t192.168.1.22 (rw,no_root_squash)\n/tftpboot/i386-rootfs\t\
    \t192.168.1.23 (rw,no_root_squash)\n/tftpboot/i386-rootfs\t\t192.168.1.24 (rw,no_root_squash)\n\
    ```\n\nThe mounting permissions shown here are rw and no_root_squash allows the\
    \ clients (the target boards) to mount their root filesystems with read and write\
    \ permissions. The no_root_squash option allows the clients to mount their root\
    \ filesystems as user root on tbdev1. See the exports man page for more information."
  merge: -1
