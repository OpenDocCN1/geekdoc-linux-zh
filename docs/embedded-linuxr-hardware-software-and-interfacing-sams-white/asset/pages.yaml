- img_proc: true
  md: 'embedded systems. There are four predominant commercial embedded Linux vendors:


    | Lineo | www.lineo.com |

    |---|---|

    | Lineo | www.lineo.com |

    | LynuxWorks | www.lynuxworks.com |

    | MontaVista Software | www.mvista.com |

    | Red Hat | www.redhat.com/embedded |


    These vendors are quick to point out that they offer products based on Linux—that
    they are not just packaging and support organizations. This is true. These vendors
    offer, as a base product, an embedded Linux toolkit, which at a minimum configures
    and compiles the kernel, configures and builds a root filesystem, and offers documentation.


    > NOTE

    Jerry Epplin reviews these four vendors'' toolkits at www.linuxdevices.com.


    This embedded Linux toolkit operates on a host computer, typically a Red Hat machine,
    which can be x86, ARM, PowerPC, MIPS, SuperH, and XScale. These vendors offer
    free downloads or evaluation versions of their embedded Linux toolkits. Their
    business model builds upon their base toolkits to offer products that extend their
    toolkits'' capabilities (for example, MontaVista''s Library Optimizer or Lineo''s
    GPL Compliance Toolset). In addition to their toolkits and additional product
    offerings, each vendor offers design, consulting, and engineering services.


    On the surface, these vendors'' offerings might seem identical. However, through
    conversation or the use of their free or evaluation toolkits, you will learn of
    their uniqueness. If you are concerned about vendor assistance with your product
    design, you can visit the Web sites and call the vendors. If you have the time,
    you can attend an embedded systems conference and visit with the vendors; this
    will enable you to meet many people within each organization and allow you to
    discuss your design in detail with company engineers. Often at conferences you
    can meet the developers who are responsible for the code your design will rely
    on. If the vendors can attach their face to your name, you just might get better
    customer service. If you need design assistance, these vendors are ready and anxious
    to help.


    # Project Trailblazer Hardware


    The hardware used in this book was carefully selected to maximize the impact of
    the examples. Having three target architectures exposes you to their similarities
    and'
  merge: -1
  pgno: 414
- img_proc: true
  md: 'differences. You should realize that the embedded world is not necessarily
    an x86 world. The interface hardware on the Project Trailazer target boards were
    selected from among inexpensive chips and devices that are commonly available
    from local or online suppliers. This interfacing hardware was chosen so that you
    can duplicate the book''s examples on your own bench if you choose to.


    For the most part, the Project Trailazer hardware performed as expected throughout
    this book. In dealing with hardware designs, there are sometimes problems with
    vendors'' products. Project Trailazer had its share of these problems. Most of
    these problems were small; some returning boards and devices to the manufacturers
    for repair. What''s important to know is not that small problems existed but how
    quickly the manufacturers responded with solutions. Brightstar Engineering, Embedded
    Planet, Silicon Storage Technology, and Tri-M Systems provided exemplary hardware
    support for this book.


    A key selling of x86 single-board computers is their binary compatibility with
    their desktop counterparts. You are supposed to be able to develop an application
    on your desktop machine, copy it to your target board, and you''re done. This
    book''s examples show that working with the MediaEngine and the RPX-CLLF was as
    easy as working with the MZ104. After you configure your development environment,
    whether you''re compiling or cross-compiling, binary compatibility is no longer
    a barrier.


    Beyond binary compatibility, the relative speed difference between desktops and
    embedded hardware may mislead you in terms of target board performance. You could
    develop an application on your desktop machine, only to find out that it doesn''t
    perform adequately on your target board. Also, if you''re developing hardware
    interfaces for an embedded design, developing on your desktop could introduce
    additional complexity or board turns. Many single-board computers implement the
    PC104 form factor or other boards and physical standards. Your desktop machine
    has PCI slots and many ISA slots, but it certainly doesn''t have a PC104 connector.
    You can''t connect PC104 boards to your. You might still opt for the x86 solution
    where vendor competition spurs competitive pricing. Adherence to forms offers
    product alternatives and isolation from sole-source suppliers. Porting issues
    won''t affect your kernel decisions either. Practically all kernel source development
    is immediately available for use in x86 designs.


    As far as non-x86 boards go, the MediaEngine and the RPX-CLLF have excellent designs
    and capabilities, via their StrongARM and PowerPC processors. Both the MediaEngine
    and RPX-CLLF contain bootloader code and a set of onboard diagnostic tools. These
    tools allow you to configure booting options, program on-Flash memory, and examine
    processor registers and memory. These diagnostic tools are invaluable for debugging
    hardware designs. They allow you to configure CPU registers, which enable you
    to exercise hardware without booting an operating system.'
