    mined the register base addresses, assigned the OutputModuleEnable signal, and

    know the configuration of the memory and I/O controllers, they need to write a

    helloworld program. They write a simple device driver to configure the MPC860

    memory and I/O controllers and then the /CS5 and PA0 signals.


