    # Creating the root Filesystem


    The Project Trailazer engineers'' decision to use the MontaVista compiled versions
    of the binary, library, and configuration files that are required in order for
    the kernel to execute init and bash was the beginning. Many Linux programs aren''t
    distributed singly; rather, they are grouped by functionality and distributed
    as a package. For example, the ls program doesn''t exist as the ls package, nor
    does the ls source code exist on its own. The GNU developers bundled ls and other
    file utilities into the fileutils package, which contains cp, chmod, chown, cp,
    dd, dir, dircols, do, install, in, ls, mkdir, mkfifo, mv, rm, rmdir, touch, vi,
    and sync. If you only want the ls program, you have to extract it from the fileutils
    package.


    You should extract files from packages into a temporary directory. After all the
    packages are extracted, the required binaries for a new root filesystem should
    be copied from the temporary directory to a new root filesystem directory. Linux
    distribution packages, whether they''re Red Hat Package Management (RPM)s or Debian
    Package Management (deb)s contain extra files, such as man pages, that may not
    have any application in the new root filesystem. These extra files just take up
    space. When you build the root filesystem, the contents of a package are extracted
    to a temporary directory and then you can copy required files to the new root
    filesystem directory. Later, this new root filesystem directory can be used to
    create the actual root filesystem that the target system will mount.


