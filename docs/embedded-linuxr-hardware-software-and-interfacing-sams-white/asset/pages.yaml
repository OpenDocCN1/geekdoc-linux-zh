    +   Connect the SAA1064 SDA and SCL lines to the x86 printer port and connect
    the power and ground lines to a floppy disk connector. The author of i2c-pport
    has written instructions for connecting I2C devices to the parallel printer port
    (see /root/i2c-2.6.1/doc/i2c-pport). The i2c-pport device driver uses the printer
    port control lines allows for bidirectional communication. The control line autofeed
    signal for SDA and the control line initialize signal for SCL. Figure 10.5 shows
    the complete circuit schematic for connection of four SAA1064s that drive the
    four seven-segment LEDs.


    > TIP

    You can power an interface circuit from the PC''s power supply. The floppy disk
    connector provides +5VDC, +12VDC, and ground connections. The connector''s 0.1-inch
    pin spacing allows for use of standard headers, simplifying the wiring to your
    interface board. A 250-Watt power supply can typically source more than 20A from
    the +5V supply and 5A from the +12V supply. See your PC''s power supply for actual
    specifications.


    +   Write, compile, and run a program that communicates with the device via:


    The device driver SAA1064_x86.c communicates with the device via the SAA1064 through
    the i2c-pport device driver. SAA1064_x86.c opens the device file, uses ioctl to
    set the I2c slave address, the write system call to send a 6-byte stream to the
    SAA1064, and then closes the device file and exits. The 6-byte stream consists
    of the following:


    +   * Byte 1—The internal starting SAA1064 register address

    * Byte 2—The configuration register setting

    * Byte 3—The LED segment 1 value'
