  md: '# What This Book Covers


    This book includes a complete series of real-world interfacing examples designed
    to introduce embedded Linux from hardware and software perspectives. After you
    create an embedded Linux development environment, you will step through hardware
    and software interfacing examples, such as asynchronous serial communication,
    the PC parallel port, USB, memory I/O, synchronous serial communication, and interrupts.
    All interfacing examples are then tied together using system integration. All
    this material is presented using a winter resort automation project Project Trailbl.
    You can find the book''s source code and scripts at www.embeddedlinuxinterfacing.com.


    The following text briefly summarizes each chapter.


    Chapter 1, “Introducing Embedded Linux,” describes the brief history of Linux
    as an embedded operating system and the implications of using open-source software
    in product design.


    Chapter 2, “System Architecture,” introduces a winter resort automation project
    Project Trailblazer and develops a series of project requirements. Project Trailblazer
    and its requirements form the basis for the book''s interfacing examples.


    Chapter 3, “Selecting a Platform and Installing Tool Sets,” describes the process
    of platform selection. Four target boards—which use X86, StrongARM, and PowerPC
    processors—are selected for Project Trailblazer. This chapter then describes the
    creation of an embedded Linux development workstation tbdev1. All the development
    tools are either installed or compiled, including the cross-compiled tool chain
    for the StrongARM and PowerPC processors.


    Chapter 4, “Booting Linux,” describes the Linux boot process, from power-on to
    the bash prompt. Using a minimum root filesystem, each target board is booted
    using Linux version 2.4.


    Chapter 5, “Debugging” configures gdb and debugger for target board debugging
    over the Ethernet network. A cross-compiled version of hellworld is remotely executed
    and debugged.


    Chapter 6, “Asynchronous Communication Interfacing,” describes the Linux serial
    port driver for control of port signals and buffers. The RFID tag reader, an LCD
    display, and control circuit are interfaced with the Linux serial port.


    Chapter 7, “Parallel Port Interfacing,” describes interfacing AC circuits to an
    x86 target board’s parallel printer port. A custom device driver helloworld_proc_module
    that uses a /proc directory is introduced.


    Chapter 8, “USB Interfacing,” describes connecting a camera and speakers for visual
    input and audio output to a target board’s USB port.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Introduction


    Chapter 9, “Memory I/O Interfacing,” describes interfacing AC circuits to the
    StrongARM and PowerPC target boards’ CPUs.


    Chapter 10, “Synchronous Serial Communication Interfacing,” describes SPI and
    I2C connections and communications. A low-cost SPI temperature sensor and I2C
    LED driver are interfaced to the target boards.


    Chapter 11, “Using Interrupts for Timing,” describes Linux timing sources and
    the measurement of each target board’s average interrupt latency. An event timer
    with 1ms accuracy is developed to measure race times.


    Chapter 12, “System Integration,” describes the creation of the Project Trailblazer
    database. Target and server bash scripts are developed, using this database for
    collection and distribution of temperature, image, and authentication data.


    Chapter 13, “Final Topics,” summarizes the interfacing projects and discusses
    embedded Linux topics that are not addressed elsewhere in the book.


    # Who This Book Is For


    If you are a hardware engineer, software developer, system integrator, or product
    manager who have begun exploring embedded Linux for interfacing applications,
    then this book is for you. The book’s comprehensive interfacing examples are simple,
    requiring only a basic understanding of digital logic design, C and bash programming,
    and Linux system administration.


    # Conventions Used in This Book


    This book uses several common conventions to help teach embedded Linux. The typographical
    conventions used in this book include the:


    +   - Commands and computer output appear in a monospaced computer font.

    - Commands you type appear in a **boldfaced computer font**.

    - *Itics* are used to introduce you to new terms.


    In addition to typographical conventions, this book includes tips, which look
    like this:


    > TIP

    Information that offers shortcuts and solutions to common problems is highlighted
    as a tip.'
