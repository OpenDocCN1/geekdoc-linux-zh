  md: '# Implementing the Race Timer


    +   **Timing**—The Status LED and Go LEDs blink at 1-second intervals. When the
    racer crosses the finish line, the photo detector senses a rising-edge signal
    to the ACK line and generates interrupt 7. The interrupt handler routine executes,
    records the race finish time with do_gettimeofday, schedules the bottom-half tasklet
    for execution, and puts the controller in the done state.


    +   **Done**—The Status LED and Racer Go LEDs turn off. The controller waits for
    another racer to enter the starting gate.


    The Project Trailblazer engineers have already already completed several pieces
    of this design. Chapter 6, "Asynchronous Serial Communication Interfacing," addresses
    asynchronous serial communications with the RFID tag reader. Chapter 7, "Parallel
    Port Interfacing," addresses parallel port operations. Chapter 10, "Synchronous
    Serial Communication Interfacing," addresses synchronous communications with the
    Philips SA1064 I2C controller. Early in this chapter, the engineers developed
    the interrupt and running timers. Chapter 12, "System Integration," addresses
    system integration with the Project Trailblazer server. For these details are
    not covered here. For the remainder of this chapter, we will concentrate on two
    areas: interrupt-bottom-half processing using tasklets and kernel timers.


    # Race Timer Interrupt Processing Using Tasklets


    Complex or lengthy interrupt processing tasks are often split into two sections.
    The top-half routine executes at interrupt time, performs the minimal amount of
    work, and schedules the remainder of work, called the bottom half routine, to
    be performed at a later or safer time. The top-half routine can request execution
    with interrupts disabled; therefore, it should execute and terminate as quickly
    as possible. The kernel executes bottom-half routines with interrupts enabled.
    With Linux kernel 2.4 and above, the preferred way to implement bottom-half routine
    uses tasklets.


    Tasklets are declared using the DECLARE_TASKLET macro. This macro also associates
    a handler function to the tasklet. The top-half interrupt handler routine should
    schedule an already declared tasklet for later execution. The kernel executes
    the scheduled tasklet handler functions after all the interrupt handler routines
    complete before execution of the scheduler.


    In the race timer design, the interrupt handler, racetimer_interrupt, schedules
    the race timer tasklet''s handler routine, racetimer_do_tasklet, for later execution.
    The racetimer_do_tasklet function prints race status information to the system
    log, which is a somewhat lengthy process, and starts a system timer.'
  merge: -1
  pgno: 362
- img_proc: true
  md: '# Race Timer Status Display Using System Timers


    The race timer status and Racer Go LEDs inform officials, fans, and racers of
    race activity. A solid on signal means the system is ready for a race to begin.
    Blinking LEDs mean a race is in progress. When the LEDs are off, a race is complete
    and the system is ready for another racer to enter the starting gate. The Project
    Trailblazer engineers need to figure out how to blink the LEDs at a constant 1-second
    rate.


    As you saw at the beginning of this chapter, Linux offers five timing mechanisms,
    and the engineers choose to do get_timeofday for race timing. The race timer driver
    could also sit in a loop calling get_timeofday and wait for 1 second to elapse.
    The race timer driver could also call a system sleep function (usleep, mleop,
    and wait for 1 second to elapse. Both approaches would work, but neither is desirable.
    The kernel scheduler does not drive code that is executing in the kernel space.
    A 1-second sleep in the kernel would completely occupy the processor for 1 second,
    and other processing would not occur during this time. Device drivers use sleep
    functions for long delays definitively affect system performance.


    Kernel timers solve long delay problems. By using a timer, device drivers can
    schedule a function for execution at a future time. A device driver creates a
    timer, populates the timer''s data, function expires fields and then adds the
    timer to the kernel''s list. The x86 kernel scans the timer list approximately
    100 times per second. If the kernel''s jiffies is greater than a timer''s expires
    value, the kernel executes the timer''s function handler. Timers operate in a
    one-shot mode. The kernel executes timer function handlers only once. Drivers
    that need periodic function execution to reschedule their kernel timers in the
    timer''s function handler.


    In the race timer, the bottom-half tasklet handler, racetimer_do_tasklet, starts
    the kernel timer status_timer. One second later, the status_timer expires and
    the kernel executes the status_timer_function handler, status_timer_timed_out.
    If the race is in progress (the timing state where the LEDs blink at 1 second
    intervals), status_timer_timed_out toggles the Status and Racer Go LEDs, sets
    the status_timer.expires value, and then reschedules (via the add_timer function)
    status_timer for execution 1 second later. If the race has completed, status_timer_timed_out
    turns off the LEDs.


    Let''s look at the racetimer_x86.c device driver, shown in Listing 11.4, implements
    bottom-half interrupt processing using a scheduled tasklet and 1-second timing
    of the Status and Racer Go LEDs.


    # LISTING 11.4 racetimer_x86.c Device Driver


