  md: '# Temperature Sensing and Display


    The engineers need a temperature-sensing technology that''s inexpensive, accurate
    and covers an extensive temperature range. They''ve found the National Semiconductor
    LM70 SPI digital temperature sensor (www.national.com). For the outdoor temperature
    display, they''ve decided to use the Philips Semiconductor I2C SAA1064 four seven-segment
    LED display driver (www.semiconductor.physics.com).


    National Semiconductor''s LM70 digital temperature sensor offers 0.25°C resolution
    over a temperature range of -55°C to +150°C (that is, -67°F to +302°F). The LM70
    operates with a supply voltage between +2.65V and +5.5V and consumes with a temperature
    accuracy of ±2°C from -40 to +85°C. It interfaces to microprocessors through an
    SPI interface. For Project'', and each one costs $1.


    Philips Semiconductor specifically designed the SAA1064 with an I2C bus interface
    capable of driving four seven-segment LED displays. The I2C interface permits
    connection of up to four SAA1064 to a single microprocessor synchronous port.
    One board connected to four SAA1064s, each driving seven-segment LEDs, enables
    displays of temperatures at the top and bottom of the lift, in both Fahrenheit
    and Celsius. For example, a single temperature display with 16 digits can show
    the low temperature of 10°F and -12°C and the lift bottom temperature of 44°F
    and 6°C. Each SAA1064 costs about $4.


    The Project البلاد engineers need to connect an LM70 to the x86 parallel port
    and develop an SPI synchronous serial communication algorithm for a device driver.
    Embedded developers refer to synchronous serial communication algorithms as "bit-banging"
    routines. Then the engineers need to connect an LM70 to the MediaEngine''s ARM
    processor. The ARM processor''s Serial Port 4 is a synchronous serial port (SSP)
    that simplifies communications with external SPI devices. Next, the engineers
    need to connect an SAA1064 to the x86 parallel port and use pre-existing I2C driver
    software. Finally, the engineers need to develop an I2C bit-banging runtime for
    the PowerPC, and this chapter outlines the connectivity and driver development
    for the devices listed in Table 10.1.


    | TABLE 10.1 Temperature Device Connectivity and Driver Type |

    | Platform | Software Type |

    | LM70 Temperature Sensor (SPI) | Bit-banging algorithm |

    | x86, parallel port | On-chip controller |

    | SA-1110, SSP | |

    | SAA1064 LED Driver (I2C) | Open-source device driver |

    | x86, parallel port | Bit-banging algorithm |

    | MPC860, Port B | |'
