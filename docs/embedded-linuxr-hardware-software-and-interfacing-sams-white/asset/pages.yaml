  md: '# Configuring the Kernel for SCSI Operation and SDDR-09 Use


    To use the SanDisk USB SmartMedia card reader, you will need to configure and
    rebuild the kernel with support for SCSI and SDDR-09. Follow these steps to configure
    and compile the kernel:


    +   1. Configure the kernel with SCSI and SDDR-09 support, by making menuconfig


    ```

    root@tbdev1[553]: cd /usr/src/linux

    root@tbdev1[554]: make menuconfig

    ```


    +   2. You need to configure the kernel options for SCSI support. Using the up
    and down arrow keys, scroll to the SCSI support item and press Enter. Select the
    SCSI support item and press the spacebar until a * character appears between >
    (that is, <>). Select and configure these three SCSI support items:


    +   * <*> SCSI support

    * <*> SCSI disk support

    * <*> SCSI generic support


    Select Exit and press Enter. This takes you back to the main menu.


    +   3. The SDDR-09 driver is now considered. You will not see an option for it
    in the USB support item unless you configure the kernel to prompt for development
    drivers. Using the up and down arrow keys, scroll to the Code Maturity Level options
    item and press Enter. Select the Prompt for Development and/or Incomplete Code/Drivers
    item and press the spacebar until a * character appears between < >. Select Exit
    and press Enter. This takes you back to the main menu.


    +   4. Configure the USB support options. Using the up and down arrow keys, scroll
    to the USB support item and press Enter. Configure these USB support items:


    +   * <*> Mass Storage support

    *[*] SanDisk SDDR-09 (and other SmartMedia) support (NEW)


    Select Exit and press Enter. This takes you back to the main menu.


    +   5. SmartMedia cards use the DOS FAT filesystem. You need to configure the
    kernel for DOS FAT filesystem support. Using the up and down arrow keys, scroll
    to the File Systems item and press Enter. Configure these file system items:


    +   * <*> DOS fs support

    * <*> MSDOS fs support


    Select Exit and press Enter. This takes you back to the main menu.'
