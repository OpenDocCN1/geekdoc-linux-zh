  md: '# CHAPTER 7 Parallel Interfacing


    +   - Many Linux processes make available information via files in the /proc directory.


    +   - /proc directory device files are created-on-the-fly and do not clash with
    device files and can be found by filename.


    The "Linux Kernel Module Programming Guide" is out of date, and its examples are
    difficult to compile. The engineers found the "Linux Kernel Procs Guide," which
    applies to kernel 2.4 and is up-to-date. They decided to create the lift monitoring
    and snow-making control device driver, which would use the /proc file system.
    The engineers planned to be extra careful when writing the device driver, to make
    sure that array-out-of-conditions never occur. They knew not to rely on libc functions.
    They planned to develop their kernel module driver around the "Linux Kernel Procs
    Guide" program procs_example.c. By writing a helloworld device driver for the
    /proc directory. After they were confident in their skills at creating device
    drivers, they would modify helloworld and create the lift monitoring and snow-making
    control driver.


    # Understanding helloworld_proc_module


    Most helloworld programs print "Hello World" and terminate. Kernel module versions
    of helloworld print "Hello World" to the console or to the system log file when
    loaded and print "Goodbye World" when they are unloaded. The helloworld_proc_module
    will print loading and unloading messages, and will also store a character string
    that can be read and written with file operations. This character string offers
    data persistence across the life of the module. helloworld_proc_module will demonstrate
    the process of creating the /proc directory file, transferring data from user
    to module, transferring data from the module to userland, and removing the /proc
    directory file. Here are the basic steps involved in the execution of helloworld_proc_module:


    +   1. The module is loaded from a script or by hand, insmod helloworld_proc_module.o.


    +   2. The kernel calls the module''s init function. The source code defines called
    module_init that declares which function is init. In this case, the statement
    is module_init(init_helloworld).


    +   3. The module''s init function executes and creates a /proc directory entry
    called helloworld_file, fills its fields, and prints a message to the system log.
    The helloworld_file /proc directory entry contains four fields that the kernel
    requires for read and write file operations:'
