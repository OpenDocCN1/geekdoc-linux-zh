    Driving the HC138''s A signal with OE permits a spare set of eight inputs and
    outputs to be connected to the MediaEngine bus. GP1014 asserts the OutputModuleEnable
    line, which enables the HC574''s output buffers. The HC574''s output output can
    then turn the output modules on or off. The ready input signal, RDY, slows CPU
    read and write operations for slow memory devices.


    > TIP The MediaEngine''s ARM clock speed is 200MHz. This design''s High-speed
    CMOS (HC) logic components are fast, but the Project Trailblazer engineers need
    to configure the CPU to access the interface circuit as slowly as possible because
    the I/O board capacitance could affect performance and reliability.'
