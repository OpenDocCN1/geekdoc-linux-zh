  md: '# About the Author


    Craig Hollabaugh has been fascinated by electronics since he bought an AM radio
    in elementary school. He was first exposed to Unix during a cross-country talk
    session in 1985. Later, he administered networked Sun and DEC workstations while
    pursuing a doctoral degree in electrical engineering at Georgia Institute of Technology.


    Craig''s first embedded SCADA (supervisory control and data acquisition) design,
    Pacemaker, remotely monitored the gasoline injection process and earned him a
    U.S. patent. His next embedded, the Titan PAC-3, based on Intel x86 architecture,
    controlled this injection process, using a multitasking operating system written
    in C++, complete with boot code, communications ability, and field-downloadable
    application code.


    In 1995 Craig co-founded Wireless Scientific, where he developed 20 spreadspectrum
    900MHz ISM industrial telemetry products. Craig worked with more than 200 developers,
    system integrators, and equipment manufacturers to incorporate wireless telemetry
    within their SCADA applications or product lines. In 1996 Wireless Scientific''s
    Global Data Management project used Linux as a development platform to properly
    monitor and control additive tanks.


    In 1997 Lanier Corporation charged Craig with architecting his next-generation
    VoiceWriter, a medical digital dictation and transcription system with revenues
    beyond $100 million. His responsibilities included ensuring that product development
    followed current/future technological trends, adhered to technical/medical information
    standards, and incorporated Lanier''s legacy products.


    Craig consults from his home in Ouray, Colorado. The Proteus Scalable Node. At
    Clifton, Weiss and Associates, Craig is a member of a carrier-class telecommunications
    network design team. His current responsibilities involve designing and analyzing
    wired and wireless voice and data networks for Dallas Area Rapid Transit, Metro
    North Railroad, New York City and Pittsburgh Area Transit. He''s also design-FM,
    MP3, and Bluetooth headsets for Arriva.


    The Ouray community benefits through Craig''s system administration support of
    Ouraynet and his adult education classes in electronics and programming. Most
    recently, Craig co-founded The Silverjack Baking Company, where he will bake and
    sell scrumptious delights from a horse-drawn bakery wagon on Ouray''s Main Street
    during the summer months. If there''s snow flying, you''ll most likely find him
    snow-boarding at Telluride.'
