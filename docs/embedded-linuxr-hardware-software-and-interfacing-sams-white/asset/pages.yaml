    10ms (this value is defined in the kernel variable jiffies). The timer interrupt
    routine increments the kernel variable jiffies by 1. Therefore, the value of jiffies
    represents the number of 10ms increments that have occurred since booting. It
    is possible to increase jiffies resolution by altering the Hz source declaration.
    However, this could ultimately lower overall system performance due to interrupted
    processing. Other mechanisms offer higher resolution.


    +   - PSR--the Resolution of PSR (which stands for processor-specific registers)
    is various. Some newer processors contain 32-bit counters that increment on every
    system clock cycle. The counters accessed through PSR provide resolutions that
    depend on processor clock speed. Kernel source code provides function calls to
    access the PSR. For example, the rdtsc function returns the timestamp counter
    (TSC) on Pentium and newer processors, and the get_tbb function returns the mTbb
    register value on PowerPCs. 486 and ARM processors do not contain clock counters.

    - get_cycles--the resolution of get_cycles is defined on all platforms, returns
    returns a count of system clock cycles that fit into a single CPU register. Typically
    this is the lower of the thirty-bit counters mentioned previously. If the processor
    doesn''t contain a clock counter, get_cycles returns 0. get_cycles returns 0 on
    486 and ARM processors.


    +   - do_gettimeofday--the resolution of do_gettimeofday is 1us. The do_gettimeofday
    function fills a temporal data structure with the number of seconds and microseconds
    elapsed since booting. The x86 and PowerPC kernel source clear claim near-microsecond
    resolution for do_gettimeofday.


