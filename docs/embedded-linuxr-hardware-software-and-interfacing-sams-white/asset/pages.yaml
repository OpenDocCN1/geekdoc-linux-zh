    > TIP

    With interrupt latencies in the microsecond range, Linux interrupt routines can
    easily count mechanical bounces. If you would like to see this for yourself, use
    a toggle switch to generate the interrupt signal on the parallel port''s ACK line.
    Examine the interrupt count in the /proc/interrupts file. You should see that
    one switch closure results in more than one interrupt. Mechanical switches alone
    should not be used to generate interrupt signals in interrupt-based designs or
    during interrupt driver testing. For testing, use a switch debounce circuit or
    write a device driver, for the parallel port, that drives the ACK line from another
    parallel port pin. The gate_x86 device driver at www.embeddedlinuxinterfacing.com/chapters/11
