  md: '# CHAPTER 5 Debugging


    correct cross-processor issues such as big endian and little endian addressing
    and integer size. gdb runs as a console text application, without a GUI. Its open-source
    nature permits enhancements; you can get gdb tools that provide the integrated
    development environment (IDE) functionality that programmers have become accustomed
    to.


    This chapter does not dive into a complete discussion of gdb''s features, capabilities,
    and functionality. Rather, it shows how to list an executable''s source code,
    set a breakpoint, print a variable, and set a variable value. You can then debug
    the cross-compiled executable over a network, using one of the Project Trailblazer
    platforms. Table 5.1 shows the basic gdb commands that are used in this chapter.


    # TABLE 5.1 gdb Commands


    | Command | Shortcut | Description |

    | --- | --- | --- |

    | list | l | Lists the program file |

    | run | r | Starts a debugged program |

    | break | b | Sets a breakpoint |

    | next | n | Steps a program without entering subroutines |

    | continue | c | Continues the program that is being debugged |

    | print | p | Prints a variable''s value |


    gdb online provides additional command information. For example, within gdb, here''s
    the help section for the command next:


    +   (gdb) help next

    Step program, proceeding through subroutine calls.

    Like "step" command as long as subroutine calls do not happen;

    when they do, the call is treated as one instruction.

    Argument N means do this N times (or till program stops for another reason).

    (gdb)


    > TIP

    You can start exploring gdb''s commands by typing help at the (gdb) prompt.


