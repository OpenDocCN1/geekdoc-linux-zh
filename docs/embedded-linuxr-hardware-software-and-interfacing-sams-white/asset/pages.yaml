  md: '# Developing Lift Monitoring and Snow-Making Control for the RPX-CLLF


    # **TABLE 9.5** RPX-CLLF Bus and I/O Expansion Connector Signals


    | Description | Signals |

    |---|---|

    | Address lines | A0–A31 |

    | Data lines | D0–D31 |

    | Chip select | /CS0-/CS7 |

    | Write enable | /WE1 |

    | Output enable | /OE (GPL1) |

    | Port A | PA0–PA23 |

    | Port B | PB0–PB31 |

    | Port C | PC0–PC15 |

    | Port D | PD0–PD15 |

    | Reset | /RST |

    | Power | +5V, +3V |

    | Ground | GND |


    Figure 9.3 shows the connections between the output latch, the input buffer (74HC574
    Edge Triggered D Flip Flop with three-state outputs), the input buffer (with three-state
    outputs, and the RPX-CLLF. PA0 controls the OutputEnable line. The signals A0,
    /OE, /WE1, and /CS5 control the three to eight line decoder performs address and
    read/write decode. Byte read and write operations are similar to those for the
    MediaEngine (see the section "Designing the External Interface Hardware for the
    MediaEngine", earlier in this chapter). This design''s HC logic components are
    fast, but the Project Trailblazer engineers want to configure the CPU to access
    this interface circuit as slowly as possible because the I/O board trace capacitance
    could affect performance and reliability.


    # Finding Space in the Memory Map for the RPX-CLLF


