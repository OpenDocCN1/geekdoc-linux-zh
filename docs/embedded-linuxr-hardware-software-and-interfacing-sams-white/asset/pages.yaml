  md: '# Linux Serial Communications


    The Trailblazer engineers found three documents specifically addressing Linux
    asynchronous communications:


    +   - Gary Freking’s "Serial Programming HOWTO" (www.linuxdoc.org/HOWTO/Serial-Programming-HOWTO.html)

    - David S. Lawyer’s "Serial HOWTO" (www.linuxdoc.org/HOWTO/Serial-HOWTO.html)

    - Michael Sweet’s "Serial Programming Guide for POSIX Operating Systems" (www.easyswm.com/~mike/serial)


    Using Linux—or, more properly, POSIX—serial communications terminology, they searched
    for code examples that access the serial port’s universal asynchronous receiver
    transmitter (UART) control signals and receive buffers. They discovered that the
    UART’s control signals were straightforward and easy to understand. Manipulating
    the signal and receive buffers requires a more in-depth understanding of the Linux
    serial driver capabilities. This device driver contains numerous options, beyond
    UART configuration, for control and processing of modern and temporal communications.
    Most of these options don’t apply for Project Trailblazer. The engineers considered
    writing their own serial communications driver for UART control, but they decided
    against after finding C code examples that resemble the required functionality
    of setSerialSignal, getSerialSignal, and querySerial


    Linux device files provide access to hardware serial ports. The file open command
    returns a file descriptor that is used for serial port configuration, control,
    reading, and writing. The following sections demonstrate this development of the
    setSerialSignal, getSerialSignal, and querySerial programs.


    # Setting the Serial Port Controls with setSerialSignal


    The Project Trailblazer lift access points RFID tag information, performs authentication,
    and displays a signal (that is, a red or green light) permitting or denying guest
    access to the lift. For the sake of simplicity, the engineers decided to use an
    RS-232 serial port control signal as the permission signal. There’s no need to
    involve another hardware input/output (I/O) port, such as a parallel port, when
    the access point serial communications between the target and the RFID reader
    or display do not use hardware flow control or a DTR signal. The serial port signals
    RTS or DTR provide this single bit of output, to drive the red/green light permission
    signal.'
