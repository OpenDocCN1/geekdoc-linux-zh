    TABLE 9.1 Continued


    | Description | Signals |

    | --- | --- |

    | I/O line | GPI0I14 |

    | Write enable | /WE |

    | Output enable | /OE |

    | Data ready | RDY |

    | Reset | /RST |

    | Power | +5V, +3V |

    | Ground | GND |


    Figure 9.1 shows the connections between the output latch (7HC574 Edge Triggered
    D Flip Flop with three-state outputs), and the input buffer (7HC244 Octal Buffer
    with three-state outputs). Upon reset, GPI0I14 is configured as an input pin.
    A pull-up resistor deaterra the OutputModule line, which disables the output modules.
    GPI0I14 is then configured as an input pin. It controls the OutputModule, which
    in turn enables or disables the I/O modules. Signals A0, /OE, /WE, and /CS5 control
    the three to eight line decoder, 7HC138, which performs address and read signal
    decoding.


    Here''s the write operation of 1 byte (see Figure 10-17, "Variable Latency I/O
    Write Timing Diagram," in SA-1110 Developer’s Manual for more information):


    +   1. Deassert A0, /OE and /WE.

    2. Set D0–D7.

    3. Assert CS55, this enables the HC138.

    4. Assert /WE. The HC138''s Y2 output asserts the HC574''s CLK because /WE = C
    = L, /OE = B = H, and AO0 = A = L.

    5. Assert /WE. The HC138''s Y2 deaterra HC574 CLK because /WE = C, /OE = B = H,
    and AO0 = A = L. Data D0–D7 enables HC574''s flip-flops.

    6. Assert CS55.


    Here''s the read operation of 1 byte (see Figure 10-16, "Variable Latency I/O
    Read Timing Diagram," in SA-1110 Developer’s Manual for more information):


    +   1. Deassert A0, /OE and /WE.

    2. Assert CS55, this enables the HC138.

    3. Assert /OE. The HC138''s Y4 asserts the HC244''s /OE because /WE = C = H, /OE
    = B = L, and AO0 = A = L. Data D0–D7 enables CPU.'
