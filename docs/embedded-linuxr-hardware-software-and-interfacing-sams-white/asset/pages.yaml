  md: '# Developing Lift Monitoring and Snow-Making Control for the RPX-CLLF


    The liftmon_snowcon interface requires OR5 to be

    0b1000.0000.0000.0000.1111.1111.0110, which equals 0x80000FF.


    # Assigning the Output Module Enable Signal for the RPX-CLLF


    The RPX-CLLF bus expansion interface connector offers connections to four CPU
    I/O

    ports, through A D. Each port is capable of driving the OutputModuleenable signal.

    Some port pins support alternate function of an internal peripheral. The Project

    Trailblazer engineers identified that Port Pin 0''s alternate function wasn''t
    being

    used. They selected PA0 to drive theoutputenable signal.


    # Configuring the I/O Port Controller for the RPX-CLLF


    The Project Trailblazer engineers need to configure the RPX-CLLF I/O port controller

    registers shown in Table 9.9 for PA0 output with alternate function. (See Section

    34.2, Parallel I/O Ports, of MPC860 User Manual for more general information.)


    TABLE 9.9 Additional PowerPC Register Settings to Make PA0 an Output Pin

    | Register | Description | Bit Setting | Description |

    |---|---|---||

    | PAPAR | Port A Pin Assignment Register | PAPARDDO = 0 | General I/O |

    | PADIR | Port A Direction Register | PADIRRO = 1 | Selects output |


    # Writing the helloworld Testing Device Driver for the RPX-CLLF


