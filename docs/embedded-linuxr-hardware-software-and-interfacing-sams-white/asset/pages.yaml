  md: '# Introduction


    This is an exciting time. The proliferation of Internet technology has transformed
    our concept of information. 24 hours per day, people rely on network devices for
    business and personal use. Over time, this dependence will grow further. Today''s
    network devices, such as servers, routers, and desktop computers, form the Internet''s
    infrastructure. Tomorrow''s devices will control your home''s temperature, maintain
    inventory levels at your business, and monitor automobile traffic patterns. Only
    a handful of the billions of processors produced each year go into desktop or
    server computers. The remaining processors monitor and control other facets of
    the world.


    Individuals and businesses want smart, network-connected devices to improve their
    lives, efficiency, and their bottom dollar. These devices must be simple to operate,
    reliable. This is where Linux comes in. Advances in technology accompanied by
    competitive pricing allows Linux to move from the desktop and server environment
    to embedded devices. Linux offers reliability, features, opensource, and a proven
    track record; these features make it perfectly suited for embedded system designs.
    In this book, you will find information to create an embedded Linux foundation.
    You can then extend this foundation in your designs.


    # Benefits of This Book


    When I first started researching material for this book, I assumed that online
    embedded information was like other Linux information—plentiful and well-documented.
    I quickly discovered that my assumption was wrong. I found embedded Linux documentation
    to be sparse, scattered, incomplete, and sometimes dated. This was discouraging
    and invigorating at the same time. Although I worried about being able to find
    adequate information, I was further convinced of the need for this book. People
    are designing embedded products with Linux, so the information and knowledge are
    out there; just isn''t all been in one place until


    As an instructor, I have determined that students best understand and retain theoretical
    concepts and ideas when accompanied by examples. When students see a concept in
    action—whether it a robotic arm movement, a voltmeter reading, or an oscilloscope
    waveform—they''re most likely to later apply that concept to solve their own problems.
    That''s why this book is full of step-by-step examples. You will learn through
    the example and be able to apply that knowledge to your own designs.'
  merge: -1
