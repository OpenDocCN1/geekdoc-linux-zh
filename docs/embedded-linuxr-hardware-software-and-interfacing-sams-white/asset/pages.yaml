  md: '# The Linux root Filesystem


    +   - /dev contains special device files.


    +   - The kernel dynamically creates the /proc directory in memory to provide
    system information.


    +   - /usr contains additional programs and libraries.


    +   - /var contains files that change during runtime, such as lock and log files.


    The trailblazer engineers began to understand the root filesystem contents by
    examining tbdev1 (the Debian distribution development computer, which is described
    in Chapter 3, "Selecting a Platform and Installing Tool Sets"). They found the
    root filesystem contained 10,734 files and used 67.428MB of disk space. They found
    a default Red Hat installation contains 29,296 files and uses 382.020MB. Clearly,
    taking the simple approach of merely copying the contents from a default Debian
    or Red Hat exceeds the storage capacity of the engineers'' four target platforms,
    which ranges from 4MB to 16MB. The engineers needed to decide what files are really
    necessary to boot Linux and execute a bash prompt.


    > TIP

    Developing a root filesystem by examining the Linux boot process from bash prompt
    results in a minimum set of required files and gives you an understanding of Linux''s
    interaction with programs and libraries.


    Someone suggested that they could just start deleting files and see what happens.
    That hit-or-miss approach was quickly dismissed. The engineers learned from the
    Linux boot process that the kernel starts the init process that executes network
    and system initialization scripts and then executes bash. The engineers wondered
    what files are required for init, the network and system initialization, and bash.
    Then, concerned about this init/bash file approach and the four target platforms,
    the engineers wondered if they could determine what files are necessary for init
    and bash, would those files be required for all architectures? Or would some architecture-based
    files be missing? No one had any other than to say that after the kernel boots,
    all architectures shared the same source code for init, bash, and the shared libraries.
    This means that if the engineers determine a root filesystem for one architecture,
    it should work for the others.


    # Required Files for init


    After the kernel initializes its caches and various hardware devices, it executes
    the first user process, init, which spawns all other process. In order for init
    to run, it needs certain files and libraries to be present in the filesystem.
    On tbdev1, the engineers used a program called ldd to discover init''s shared
    library dependencies. This is the output of ldd:'
  merge: -1
  pgno: 82
- img_proc: true
  md: '# CHAPTER 4 Booting Linux


    ```

    root@tbdevi[514]: ldd /sbin/init

    libc.so.6 => /lib/libc.so.6 (0x40015000)

    /lib/ld-linux.so.2 => /lib/ld-linux.so.2 (0x40000000)

    ```


    The first new root filesystem needs is /sbin/init, which requires /lib/libc.so.6
    and /lib/ld-linux.so.2. By reading the man page for init, the engineers determined
    that init uses a configuration file called /etc/inittab contains instructions
    for init. On a desktop or server Linux workstation, the init process initializes
    the networking and system services, and then enters a runlevel—typically the login
    process. On the target systems, the engineers are not concerned with runlevels
    per se; rather, they want to boot the system and get bash running. They aren''t
    using a predefined runlevel, as in the Unix/Linux world. They are configuring
    init to simply initialize the network. They are configuring init to execute bash
    without authentication and to respawn bash if terminates.


    > TIP

    The kernel completes booting by executing the first user process, init. It scripts
    start all the system services. You can configure init to start programs and restart
    them if they terminate.


    The engineers examined the /etc/inittab file on the tbdevi workstation. They created
    a simplified version that initializes the network and executes bash. Here''s their
    simplified inittab file:


    ```

    id:2:initdefault:

    12:2:wait:/etc/init.d/rcS

    1:2435:respawn:/bin/bash

    2:6:wait:/etc/init.d/umountfs

    ```


    In this version of the /etc/inittab file, id:2:initdefault tells the default level
    to enter.2: 12:2:wait:/etc/init.d/rcS tells init to run the /etc/init.d/rcS script
    before entering runlevel 2, and then wait for completion.

    1:2435:respawn:/bin/bash tells init to run /bin/bash and respawn it if terminates.
    2:6:wait:/etc/init.d/umountfs tells init that upon entering runlevel 6, someone
    is rebooting the target board, to run the umountfs script and wait for its completion.


