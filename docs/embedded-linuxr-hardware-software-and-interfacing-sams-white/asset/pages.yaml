  md: 'The parallel port control approach described in the next section—using the
    parallel port device driver (ppdev)—has the same drawbacks as the parallel I/O
    approach. In the following section you will implement snowmakingcontrol.c functionality
    using ppdev instead of out. It''s included for Linux completeness but isn''t considered
    a viable option for snow-making control. The custom device driver, developed later
    in this chapter, has no drawbacks and implements a robust and eloquent solution
    for lift monitoring and snow-making control.


    # Standard Parallel Port Control Using ppdev


    Using inb and out isn''t the only way to query and control the PC parallel port''s
    data, control, and status registers. The Linux port device driver, ppdev, also
    allows for this, by using ioctl¹. This approach is similar to the approach used
    in Chapter 6, "Asynchronous Serial Communication Interfacing," to control the
    serial port. A file (/dev/port0*) is opened, and a file descriptor is returned.
    With this descriptor, calls to ioctl can set individual control bits, query the
    port status, and write to the port''s data bus. The program in Listing 7.3, snowmakingcontrolppdev.c,
    uses ppdev to control the parallel port registers that control the interface circuit
    in Figure 7.3. (“The Linux 2.4 Parallel Port Subsystem”) provides a comprehensive
    discussion of port and ppdev.


    +   1. It opens the /dev/port0 file.

    2. It requests access to the port, by using PPCLAIM.

    3. It configures the port for SSP mode, by using IEEE1284_MODE_COMPAT.

    4. It sets the OUTPUT_ENABLE line for output drive.

    5. It writes the command-line argument 1 to the data bus.

    6. It toggles the OUTPUT_LATCH line to latch data to the output module.

    7. It releases the port.

    8. It closes the /dev/port0 file.


