    to control the parallel port registers and signals. With the interface circuit
    shown in Figure 7.3, the engineers can monitor lift operations and control snowmaking
    equipment. There are three drawbacks to this port I/O approach. Developers must
    always assert the circuit''s OUTPUT_ENABLE line to continually drive the output
    modules. This is a minor nuisance. The second, more difficult, drawback deals
    with the value of the latch output driving the output modules: There is no electrical
    mechanism to determine these bit values, or to keep track of the last byte value.
    If multiple bash scripts call the snowmakingcontrol, however these scripts need
    to store and recall the last write byte value for their manipulation. The third
    drawback deals with the use of the ioperm system. Only the root user can ioperm.
    This can affect non-root users'' bash access to the parallel port. Accessing the
    parallel port using inb and out system calls, with these three drawbacks, is not
    ideal. Proper control of snow-making equipment could lead to slope closures, operations
    failure, and expensive repair.'
