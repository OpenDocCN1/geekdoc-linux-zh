    for easy bash scripting. The I2C bus communications will be slowed, allow for
    longer bus lengths. Their driver will be simple and reliable, and it should provide
    exactly what the engineers needed.


    The hardware interface uses the MPC860''s Port B because Port B offers open-collector/drain
