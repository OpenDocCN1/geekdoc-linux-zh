    There''s a slight difference between the register configuration of helloworldbit_rpxlibc.c
    and that of helloworldbit_mediaengine.c. The RPX-CLLF version uses a register
    structure whereas the MediaEngine version uses offsets from a register base address.
    The PowerPC programmers developed immap structure to make coding easier and less
    error prone (see /usr/src/powerpc-linux/include/asm-ppc/8xx_immap.h). helloworldbit_rpxlibc.c
    uses the immap register structure instead of defining offsets from the base register
    address, as in helloworldbit_mediaengine.c.


