  md: '# CHAPTER 7 Parallel Port Interfacing


    software registers data, status, and control exist at the base address, base address
    + 1, and base address +2 (that is, 0x378, 0x379, and 0x37A). Figure 7.1 shows
    these software-registers, their definitions, and the hardware connections to the
    DB-25 parallel port connector.


    | Status Register (Base + 1) | Parallel Port DB-25 Female | |

    |---|---|---|

    | S4 | Select | 25 | Ground |

    | S5 | Paper-Out/Paper-End | 24 | |

    | S7- | Busy | 23 | Data Register (Base) |

    | S8 | Ack | 22 | Data 7 | D7 |

    | S9 | Error/Fault | 21 | Data 6 | D6 |

    | | | 20 | Data 5 | D5 |

    | | | 19 | Data 4 | D4 |

    | | | 18 | Data 3 | D3 |

    | Control Register (Base + 2) | 17 | Data 2 | D2 |

    | C0 | Select-Printer | 16 | Data 1 | D1 |

    | C2 | Initialize | 15 | Data 0 | D0 |

    | C1+ | Auto-Linefeed | 14 | |

    | C0 | Strobe | 13 | |

    | | | 1 | |


    Figure 7.1 PC parallel port connection to software registers. The highlighted
    registers to DB-25 port connections are electrically inverted.


    The control register contains two additional bits that are not shown in Figure
    7.1. Control bit 5, bidirectional port enable, configures the data bus hardware
    for input. Control bit 4, IRQ via Ack Line enable, configures the port hardware
    to generate an interrupt on a low-to-high transition of the Ack line, DB-25 pin
    10. Parallel port interrupts are not required for Project Trailblazer acquisition
    or control. The engineers need a parallel port software development test fixture,
    shown in Figure 7.2, with switches connected to inputs and LEDs connected to outputs.


    # TIP


    Some parallel ports don''t actively drive their data and control signals when
    Logic Level 1. These open collector/drain signals are pulled high with a resistor
    located inside the PC. The value of this resistor, which you don''t know and can''t
    control, affects the LED''s brightness. If you are experiencing problems using
    LEDs to debug your parallel port programs, you should use a voltmeter or logic
    probe instead. Also, keep in mind that certain control and status signals are
    inverted in hardware.'
