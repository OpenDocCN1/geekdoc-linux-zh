- img_proc: true
  md: '# Network-Mounting the root Filesystem


    Line 1 of the /etc/exports configuration file says that the MediaEnginean an ARM
    processor at IP address 192.168.1.21 now has NFS read and write mounting access
    to the /tftboot/arm-rootfs directory. Similarly, the RPX CLLF with a PowerPC processor
    at IP address 192.168.1.22 has NFS read and write mount access to the /tftboot/powerpc-rootfs
    directory. Finally, the Tri-M and COTS PC with 1386 processor at IP addresses
    192.168.1.23 and 192.168.1.24 has NFS read and write access to the /tftboot/i386-rootfs
    directory.


    +   3. Make /etc/exports readable by all:


    ```

    root@tbdev1[502]: chmod 444 /etc/exports

    ```


    +   4. The NFS server reads the /etc/exports configuration file at startup, you
    need to tell it to reload its configuration:


    ```

    root@tbdev1[503]: /etc/init.d/nfs-server reload

    ```


    The NFS server is now configured and ready for NFS mounting by the targets.


    # Configuring the Target Kernels


    During the boot process, the bootloader passes the root filesystem location to
    the kernel, using the boot prompt mechanism. The ARM and PowerPC bootloaders are
    configured during the kernel configuration process. On x86 platforms, the Linux
    loader (lilo) is configured to pass the root filesystem location to the kernel.


    lilo is configured using the /etc/lilo.conf file. Both kernel compilation and
    lilo configuration result in the root filesystem location passed to the kernel.
    Without root filesystem location information, the kernel cannot mount its root
    filesystems and stops, with a “kernel panic."


    > TIP

    You can supercede the root filesystem location by entering new information at
    the Linux boot: prompt. See the Linux Boot HOWTO* for more information. This section
    does not use the boot prompt because of the length of the NFS server root filesystem
    information.


    In the following steps, you''ll compile the MediaEngine ARM kernel for NFS mounting
    of the ARM root filesystem; the other parts are similarly configured, except that
    their IP addresses and root filesystem paths are different:


    +   1. Change directory to the ARM kernel source and run make menuconfig:


    ```

    root@tbdev1[504]: cd /usr/src/arm-linux/

    root@tbdev1[505]: make menuconfig

    ```'
