    The engineers have now attached memory-mapped I/O interface hardware to the SA-1110
    processor and written a device driver to access it. That''s quite a feat.


    The MediaEngine, with its expansion port, only allows the use of GPIO14 and /CS5
    signals. Although this seems restrictive for other interface projects, the combination
    of GPIO14, /CS5, and the data lines are a perfect match for the lift monitoring
    and snow-making control circuit. You''ll see in the next section how the RPX-CLLF,
    using a PowerPC, offers more connectivity options, coupled with additional complexity.


    # Developing Lift Monitoring and Snow-Making Control for the RPX-CLLF


    This section details the phases of the hardware design process for the RPX-CLLF
    target board. These steps are the same for the MediaEngine and the RPX-CLLF, but
    architectural differences between these processors warrant detailed coverage for
    each board.


    # Designing the External Interface Hardware for the RPX-CLLF


    This section details the RPX-CLLF interface hardware design. After the engineers
    find space in the memory map for the I/O circuit, they configure the CPU registers
    and test the circuit by using the hellabbit program. The engineers then develop
    the RPX-CLLF lift_snowcon device driver, which enables the RPX-CLLF target board
    to monitor lifts and control snow-making equipment.


    The RPX-CLLF design offers extensive bus and I/O through two expansion connectors.
    Table 9.5 shows the CPU signals available for the lift monitoring and snow-making
    control circuit.'
