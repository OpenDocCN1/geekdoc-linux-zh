    # Real-time Capabilities


    Since its inception as an embedded operating system, Linux has been criticized
    for its lack of real-time capabilities. Linux and its scheduler were designed
    for maximum throughput—not for deterministic response. The open-source kernel
    has enabled developers to offer real-time solutions for Linux. These solutions
    follow two approaches:


    +   * You can run Linux as a thread within a small real-time operating system.

    * You can modify the Linux scheduler and create preemption points within the kernel.


    Proponents of the thread approach claim that no modifications to the Linux kernel
    will make it deterministic. The scheduler and preemptable kernel proponents maintain
    that their modifications are perfectly suitable for the vast majority of applications,
    thanks to today''s high-performance processors. Both arguments merit: Adopting
    either adds complexity to your design, increasing the development time. Adopting
    a real-time solution may lock your design into a specific version of the kernel.
    You earned in Chapter 11, "Using Interrupts for Timing," that the Linux kernel
    has good average interrupt latencies—good enough to develop an event timer with
    1ms accuracy—on all the Project Trailblazer target boards. You should seriously
    consider benchmarking your hardware as described in Chapter 11 before adopting
    a real-time solution.


    Windowing and real-time solutions require interaction between hardware and software.
    These solutions do not exist for all CPU architectures or graphics hardware. Early
    in your design phase, you should ensure that software ports exist for your hardware.
    Keep in mind that Linux developers are definitely (sometimes fiercely) opinionated,
    particularly in the opinions are of a personal, technical, or business nature.
    If your design requires either windowing or real-time capabilities, you should
    thoroughly research and investigate all the options for software and hardware.
    Many windowing and real-time solutions have licensing requirements that could
    affect your decisions and the cost of your design.


    # The Embedded Linux Vendor Offers


    Another criticism of Linux is that it lacks a support structure. However, commercial
    Linux distribution vendors certainly offer support for desktop, server, and now'
  merge: -1
