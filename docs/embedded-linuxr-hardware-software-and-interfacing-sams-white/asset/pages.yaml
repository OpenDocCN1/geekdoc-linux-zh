  md: '# CHAPTER 7 Parallel Port Interfacing


    Notice that there is no bit manipulation and the device driver provides actual
    named files that correspond to the physical world.


    These requirements should simplify system integration using bash scripts. Scripts
    should work with named lift monitoring and snow-making files in the /proc directory.
    This device driver overcomes the limitations of I/O and ppdev by automatically
    enabling the OUTPUT_ENABLE signal and maintaining the last output value internally.
    This approach is more robust and less prone to errors. Code can be added to helloworld_proc_module.c
    to implement this liftmon_snowcon requirements.


    # Enhancements to helloworld_proc_module to Create


    The liftmon_snowcon module has module_init, module_exit, proc_read, and proc_write
    routines, just like helloworld_proc_module. The liftmon_snowcon init does not
    create proc entries in the /proc directory. First, it creates the directory /proc/trailblazer.
    Then it creates all the liftmon_snowcon entries—snowvalve1, snowvalve2, liftmain,
    liftmotorcontroller, and so on—in the /proc/trailblazer. The function then fills
    each of the proc file''s data, read_proc, write_proc, and owner fields. It then
    writes 0 to the latch. This then asserts the OUTPUT_ENABLE signal. init completes
    by writing a message to the system log.


    > TIP

    You should separate your /proc file entries from other system entries by making
    a directory within the /proc directory, using the proc_mkdir function. This makes
    it easy to identify your project''s /proc files.


    Notice that in Listing 7.5 there isn''t proc_read and proc_write functions for
    each /proc file. The snow-making control files share the same proc_write routine,
    proc_read_snowcondata, and share the same proc_read routine, proc_read_snowcondata.
    The data structure liftmon_snowcon_data_t contains a bitmask to distinguish one
    proc file from another. The bitmask matches up with the hardware bit that is used
    to control the output port. For example, the snowvalve3_proc file field contains
    a pointer to snowvalve3_data. snowvalve3_data.mask = SNOWATERVALVE3, which equals
    0x04. 0x04 corresponds to D3, which controls the third output module (Water Valve
    3). Similarly, the liftmon proc files share the same proc_read function and use
    data.mask to distinguish one from another.'
