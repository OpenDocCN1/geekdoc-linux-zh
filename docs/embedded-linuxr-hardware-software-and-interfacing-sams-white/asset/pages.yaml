  md: 'turn on or off corresponding to the bit pattern sent during the output operation.
    In an input operation, the parallel port bidirectional data bus, now configured
    for an input operation, reads the D7–D0 signal lines driven by the input buffer.
    When the INPUT_ENABLE signal is asserted, the input buffer transfers the eight
    signals from the INPUT module rack and drives the D7–D0 signal lines accordingly.
    Upon CPU reset, the parallel port control register contains 0s that results in
    the OUTPUT_ENABLE signal not being asserted. This disables the latch output, turning
    off all output modules. Software using this interface circuit will perform input
    and output operations by accessing the parallel port''s data and control registers.
    Datheets for the 74HC244 and 74HCS33 are available from Texas Instruments (www.ti.com).


    # TIP


    When you are designing control circuitry, pay close attention to the hardware’s
    startup conditions. You don''t want the interface circuitry turning on or off
    field devices by themselves, before your control software starts execution. You
    should look for register reset values and determine their effect on your logic
    circuitry. Add pull-up or pull-down resistors to force your interface logic into
    a known state. When the control software starts execution, it can take over and
    control your devices.


    ![](img/c075000fa5feb4594b1442d501c7c8d8_179_0.png)


