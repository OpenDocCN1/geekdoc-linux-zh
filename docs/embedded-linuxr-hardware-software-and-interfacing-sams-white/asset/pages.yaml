    # Asynchronous Serial Communication Interfacing


    Project Trailblazer was proceeding quite nicely. The four target hardware boards
    had been booted, with bash running and an Ethernet network connection. The engineers
    were ready to begin tackling hardware interfacing. They decided to start with
    the guest authentication and lift access design. The Silverjack board lift access
    wants Project Trailblazer to replace paper lift tickets with low-cost radio-frequency
    identification (RFID) technology. Guests receive RFID tags that permit passage
    through an access point located at the bottom of each lift. These lift access
    points also display individual guest-specific messages. An RFID tag reader outputs
    information via an asynchronous serial link. The access point display receives
    commands via an asynchronous serial link. The tag reader and display will connect
    to the board''s serial ports.


    A guest can proceed through an access point after authentication by looking at
    signaling lights: A red light means permission to pass is denied, and a green
    light indicates permission to go. The permission signaling circuit requires a
    single bit of information. This bit of information, the RFID tag reader and access
    point display communication can be accomplished through the use of a target board''s
    serial ports.'
  merge: -1
  pgno: 154
- img_proc: true
  md: '# CHAPTER 6 Asynchronous Serial Communication Interfacing


    In this chapter, you''ll develop three C programs: one that sets the serial port
    control signal (setSerialSignal) (SerialSignal), one that sends and receives asynchronous
    serial communications (querySerial). Ultimately, within the Project Trailazer
    design, bash scripts running on the target boards will call these three programs
    and provide system integration to the Silverjack server.(Chapter 12, "System Integration,\")
    addresses all system integration development.) This chapter discusses how to develop
    a simple serial interface for the Project Trailazer access points callable from
    bash."


    The original RS-232 standard, defined by the Electronic Industry Association and
    the Telecommunications Industry Association (EIA/TIA), in 1962, is a complete
    standard that specifies electrical, functional, and mechanical characteristics
    for communications between host and peripheral equipment. RS stands for recommended
    standard. The characters RS have been officially replaced by the characters EIA/TIA
    to identify the source of the standard. Nonetheless, people continue to use the
    term RS-232. In this chapter, RS-232 is synonymous with EIA/TIA-232.


    > TIP

    Dallas Semiconductor''s Application Note 83, "Fundamentals of RS-232 Serial Communications"
    fully describes RS-232. This application note covers electrical, functional, and
    mechanical characteristics, explains implementation and signaling, and describes
    PC/modem communications and limitations.


    # The Project Trailazer Asynchronous Serial Hardware Development Environment


    The Project Trailazer serial development environment consists of the development
    workstation, tbdev1, target platform and the peripheral devices: RFID tag reader,
    LCD display, and lift access permission signal. Figure 6.1 shows the various electrical
    connections and signal flows. ESPTech of Lakewood, Colorado, supplies the RFID
    tag reader. Scott Edwards Electronics supplies the serial LCD display. The access
    permission circuitry driven by an RS-232 signal illuminates a red light or green
    light.'
