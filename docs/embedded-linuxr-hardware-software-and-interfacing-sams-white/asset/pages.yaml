  md: '# System Architecture


    A group of devices forming a network to distribute functionality that serve a
    common purpose defines a system. The initial system design phase creates a framework
    called the system architecture. The system architecture specifies, at a block
    level, the system components and their interconnection work within the system
    architecture, which provides a structure and an overall understanding of the project
    or product. System architecture provides the big picture of high-level system
    requirements help to define the system architecture. Also, a system architecture
    does not address technical details of its blocks. Details, such as component specification
    and selection, are determined during a block''s design phase.


    This chapter introduces Project Trailblazer, a winter resort automation project.
    This project starts with the formation of the high-level system requirements,
