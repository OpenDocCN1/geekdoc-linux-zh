- img_proc: true
  md: 'In addition to providing electrical and communication protocol specifications,
    USB defines a number of device classes for common peripherals as audio devices,
    modems, mouse devices, keyboards, printers, and mass storage devices. A peripheral
    device that implements a device class can utilize preexisting host driver code.
    Device classes promote interoperability.


    Many USB devices don''t fit into a defined device class, such as scanners, video
    devices, Ethernet devices, MP3 players, and serial/parallel converters. Manufacturers
    of these devices must develop host device driver code.


    USB host controllers fall into two categories: universal host interface controller
    (UHCI) and open host controller interface (OHCI). These controllers are functionally
    different from one another; a UHCI controller is simpler from a hardware-perspective
    and shifts some communication processing to the host CPU and driver, complicating
    the driver. A variety of vendors offer UHCI and OHCI host controllers.


    The engineers continued their USB research and found the Linux USB Project page
    (www.linux-usb.org) and The Programming Guide for Linux USB Device Drivers. Browsing
    through this guide, they discovered the complexities of Linux USB device drivers.
    The first half of "USB Complete" clearly establishes that USB communications are
    not simple. "The USB Programming Guide" further confirms this. The engineers decided
    that Project Trailblazer would not develop any USB device driver because the steep
    learning curve would affect the development schedule.


    The Linux USB Project home page offers a wealth of USB information. Linux USB
    support started in 1996 as the Universal USB Device (UUSB). In 1999, Linus Torvalds
    developed the Alternate USB driver, which was released under the GPL license.
    With other Linux code, a group of developers and testers fixed and enhanced the
    Alternate USB driver. That year, a complete USB driver rewrite improved the interface
    and performance. The USB driver code matured and is back-ported to kernel version
    2.2.18. For device classes (audio devices, modems, mouse devices, keyboards, scanners,
    video devices, Ethernet devices, MP3 players, and serial/parallel converters)
    several vendor-specific drivers are incorporated into the kernel compile process,
    and the other drivers are compiled separately as loadable modules.


    The Project Trailblazer engineers continued learning by reading "The Linux USB
    Subsystem." This early draft offers an excellent introduction and usage guide
    for USB at kernel revision 2.4.0-test9. While the engineers were researching for
    Linux, kernel version 2.4.10 was released. They understood that USB driver development
    continually evolves. They led them to the Linux-USB Device Overview web site,'
  merge: -1
