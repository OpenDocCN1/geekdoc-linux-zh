    # Final Thoughts


    This book presents a number of embedded Linux topics for use in automation projects.
    Chapter 2, "System Architecture," introduces you to Project Trailblazer and sets
    the direction for the book''s technical content. Chapters 3, "Selecting a Platform
    and Installing Tool Sets," 4, "Booting Linux," and 5, "Debugging," help you to
    build a development-workspace, the GNU toolchain, and a cross-platform remote
    debugging environment. The remaining chapters show you how to interface various
    hardware devices to the Project Trailblazer target boards, using Linux for data
    acquisition and control. All this information forms a foundation for embedded
    Linux that you can use in your designs.


    This chapter briefly discusses GUI development, real-time capabilities, and embedded
    Linux vendor offerings. These topics were not used in Project Trailblazer but
    might be important for your design. The chapter concludes with a discussion that
    summarizes the performance of the Project Trailblazer hardware.


    # GUI Development


    Your applications will undoubtedly include additional technologies that build
    on the foundation laid in this book. You might need to use windowing software
    to develop easy-to-use customer solutions for set-top boxes, point-of-sale systems,
    human–machine interfaces, and graphical user interfaces.


    The X Window system powers the Linux desktop but not embedded devices. Its storage
    and CPU requirements exceed the capabilities of most embedded hardware designs.
    Fortunately, numerous solutions exist, each providing a window system for embedded
    Linux GUI'
