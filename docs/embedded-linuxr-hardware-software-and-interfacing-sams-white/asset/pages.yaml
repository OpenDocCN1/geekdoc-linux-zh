  md: "# Developing a Custom Device Driver\n\n+   **read_proc**—The read_proc field\
    \ should contain a pointer to the file's callback function that executes for a\
    \ read file operation. example, if a user ran the /proc/helloworld_proc_module\
    \ command at the bash prompt, the kernel would ultimately call the file's read_proc\
    \ function to handle this file operation.\n\n+   **write_proc**—The write_proc\
    \ field should contain a pointer to the file's callback function that executes\
    \ for a write file operation. If a user ran the echo test > /proc/helloworld_proc_module\
    \ command at the bash prompt, the kernel would call the file's write_proc function\
    \ to handle this file operation.\n\n+   **data**—The data field contains a pointer\
    \ to the file's data. During initialization, a data structure is created and populated.\
    \ When a read or write callback occurs, using read_proc or write_proc, this pointer\
    \ is passed as a parameter. This way, the file read_proc and write_proc functions\
    \ can find their associated data.\n\n+   **owner**—Because the /proc file entry\
    \ is used in a module, the owner field should be set to THIS_MODULE.\n\n+   4.\
    \ The module is unloaded by a script or by hand, with rmmod helloworld_proc_module.\n\
    \n+   5. The kernel calls the module's exit function. The source code uses a macro\
    \ definition module_exit that declares which function is exit. In this case, the\
    \ statement is module_exit(cleanup_helloworld);\n\n+   6. The exit routine removes\
    \ the /proc file entry and prints a message to the system log file.\n\nThis is\
    \ quite a bit different from the helloworld.c program that you're used to seeing.\
    \ This helloworld_proc_module program seems complicated, but after you get it\
    \ running and understand how to set the helloworld_file fields and how the data\
    \ pointer is passed to the read and write callback functions, it's pretty simple.\
