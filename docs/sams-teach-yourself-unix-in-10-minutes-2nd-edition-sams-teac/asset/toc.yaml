  - Unix 进程管理 145
- - '##'
  - 使用 cron
- - '##'
  - 使用 at
- - '##'
  - 买一个的钱用两个 Unix 命令！`batch` 命令与 `at` 类似。`batch` 的语法与 `at` 相同，只需要设置执行时间。
- - '##'
  - 谁是高手？我们涵盖的所有命令都有很多内容。继续尽可能地使用你的帮助手册（man pages），并将对这些命令的记忆保持在高级水平，以便每次来到控制台时都能保持速度和准确性。Unix
    令人敬畏，但正如你所见，它并不难使用和学习。需要帮助时继续查看帮助手册。与本课内容相关的帮助手册包括 `crontab`、`man cron`、`man at`
    和 `man batch`。
