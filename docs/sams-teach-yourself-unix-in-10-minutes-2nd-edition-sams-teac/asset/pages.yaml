    Try both commands and see which is easier and makes more sense for you. Either
    one will work just fine with your distribution of Unix.


    You now know everything about navigating Unix and its supposedly cryptic file
    system. Let''s expand this knowledge by taking a deeper look at paths, which were
    briefly discussed earlier in the lesson.


    # Relative and Absolute Paths


    When changing directories, you can specify exactly where you want to go by specifying
    the correct path. As mentioned earlier in the lesson, a path is the shortest set
    of directories through which you must travel from the root directory to get to
    the current file or directory. Unix, however has two types of path statements
    that you absolutely need to be familiar with in order to completely understand
    how to navigate the system.


    The two types of path statements in Unix are relative path statements and absolute
    path statements. Paths starting with the root directory and ending in a file or
    directory name are called absolute paths. In other words, absolute paths have
    absolutely everything contained within them, including the root statement /. One
    example of an absolute path statement is as follows:


    ```

    > cd /usr/local/bin

    ```'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'On the other hand, a relative path is a shortened version of an absolute path.
    It contains only the directory in which you are currently working, and it does
    not include the root statement /. Consider the following example:


    ```

    cd bin

    ```


    Remember, relative paths are relative to the current directory. Furthermore, absolute
    paths start with / and relative paths don’t.


    By this point, you know how to find out where you are, what files are in what
    directories, and how to move to different directories. In this lesson, we have
    covered not only several important commands, but some important theory as well.
    Now that we have dug deep into the shell prompt to navigate the file system, let’s
    take a moment to learn how to do it with a GUI, namely, KDE.


    # Navigating the File System with the GUI


    In this section, we will look at navigating the file system with KDE. KDE’s file
    management system mirrors the shell prompt except that you are seeing a graphical
    representation of the same data that allows you to point and click with your mouse.
    Also, KDE’s file management system is based on your web browser installed on the
    system. In this case, let’s say Konqueror is our web browser. To use Konqueror
    to navigate the file system, simply open the browser and use the location field
    to specify your path exactly as you would specify it at the Unix command line.
    If you choose, you can simply point and click your wherever you want to go.


    Also note that you can view websites at any time while working within Konqueror.


    # Simple KDE Actions


    In KDE, files are represented with icons that usually indicate the file type.
    You can see an example of this in Figure 4.3.'
