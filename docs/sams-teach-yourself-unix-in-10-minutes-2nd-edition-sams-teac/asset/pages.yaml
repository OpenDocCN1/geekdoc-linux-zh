- pgno: 136
  md: 'To send out only the new material in a file, use the diff command with the
    following syntax: diff <template file> <updated file> > <patchfile>. The patchfile
    can be any filename you specify.


    In this example, you can see how to create a patchfile.

    >diff template.txt update.txt > patch.txt


    The difference between the template file and the update file will be the patchfile.
    Try this command to see if it works for you in large file environments. If you
    can master this technique, it can save time creating, editing, and transferring
    files that you are collaborating on with others.


    The diff command is also useful when you want to know if two copies of the same
    file are identical or not. If you find yourself with multiple copies of similar
    files, diff is a fast and easy way to find out they are identical. If the files
    are not identical, you will be able to see what changes have been made between
    them. No output produced by diff means that there are no differences between the
    files.


    The patch command is also useful. It can be thought of as phase two of using the
    diff command. Now that you have your template, update, and new patchfile, you
    can use the patch with the file you want to fix. This can be seen as


    ```

    >patch template.txt patch.txt

    patching file `template.txt`

    ```


    The patch command will automatically update and patch the file named template.
    You applied the patch to the template and that was it. You can now use cat or
    view the files you created to see what the differences are between them. Always
    remember to keep a copy of your template file around. In this example, the patch
    was applied directly to the template file and the template file was updated. If
    all further patches are created from the updated file, no problem; however, if
    patches are created based on the original template, then the template.txt can
    no longer be patched.


    Now you should be comfortable with most of the common Unix file management techniques
