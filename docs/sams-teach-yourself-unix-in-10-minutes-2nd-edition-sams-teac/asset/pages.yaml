- pgno: 153
  md: '# Compression and Archiving Tools 135


    The uuencode program accepts any file as input, and it produces an encoding of
    the file that can be included in an email message. To a person, the contents of
    this file look like random characters; on the receiving end, however, the user
    can use the uuencode command to extract the original file. Let''s look at how
    that does work:


    To use the uuencode command, you need to follow these steps:


    +   1. Select a file to uencode.


    +   2. Issue the uuencode command as uuencode <filename> <callmethis> > .uue.
    (You need to type that before the <filename>.uue argument.)


    Your computer will produce a file named <filename>.uue, which contains the uuencoded
    version of the file. For example, if you have a file named test and want to uencode
    it, you can type the following:


    ```

    > uuencode testsend > testsend test.uue

    ```


    Your computer produces a file named test.uue, which decoded will be named testsend
    and contains the contents of your testsend. Now you can copy and paste, or whatever
    you need to do to insert the file you just created into an email message and send
    it whenever you want.


    Of course, if you receive a uuencoded file, you need to know how to decode the
    file. Decoding a uuencoded file is also extremely simple; issue the uuencode command
    as uuencode <filename>.uue. Your machine will produce a file in the current directory
    identical to the one originally uuencoded.


    # Summary


