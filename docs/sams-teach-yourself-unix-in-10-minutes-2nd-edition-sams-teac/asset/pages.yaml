- pgno: 159
  md: '# Managing Processes in Unix 141


    to start process after process, you may find that you have a lot more running
    on your Unix system than you want. In Unix, you can run the ps command at the
    shell prompt. Once you do this, you will see something similar to the following:


    ```

    >ps

    PID TTY STAT TIME COMMAND

    8832 p1 R 0:00 ps

    30675 p1 S 0:00 -bash

    (Output removed)

    ```


    If you run ps and see this result, you are looking at a list of all the commands
    you currently have running. Don''t be alarmed if you do not see the same output
    as listed here; the ps command generates slightly different results in different
    versions of Unix and Linux. Nonetheless, the same information is generally provided
    in each version.


    Now, how do you interpret this output? From left to right, the columns indicate
    the system process ID (PID), the controlling terminal, the status of the process
    (running, sleeping, and so on). Some versions won''t show you the status, but
    this varies depending on what Unix distro you are using; typing the ps command
    will provide you with the most important things you need to know, which are the
    PID and the processes in use.


    > **Where Are the Processes?** In our example, we saw only a couple of processes
    running. Could those really be all the processes? There aren''t any more than?
    There have to be, right?


    Yes, there are other processes running, and to see them all, you have to know
    the proper option for the ps command. If you just enter ps, you will see a list
    of all the processes you own, but to see a listing of the processes owned by all
