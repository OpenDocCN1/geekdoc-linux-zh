- pgno: 146
  md: '# Compressing Files in Unix


    The sole reason for compressing files is to save space. You want to save space,
    so you may make room. This is analogous to closet space in your home. Often, you
    can buy something that will allow you to organize and condense your space so that
    you have more room to put things in. This theoretically is the same concept behind
    compression. You take-thing, squeeze it down, and organize it so that you can
    compress more.


    You can also compress files to send them to others. This is common with digital
    photography and today''s email clients. Many people have email and digital cameras,
    and they want to send photos through email. Often an email of this size will be
    denied because the person you are sending it to may not have enough space on their
    system, or in the mailbox on the server, to accept a file size. Therefore, you
    will need to compress it.


    Makes sense, right? Well, that''s all you need to know why to compressing. Now
    you need to know the actual mechanics of it.


    If you happen to be using a system with disk space is restricted and you need
    to maximize available space, you can use the Unix commands you will learn here.
    These commands will reduce the amount of space your files occupy, and will allow
    you to store more files in the space you are allowed.


    There are three major compression formats you will use when working with Unix:


    +   - Unix program compress makes compressed files

    - Personal or third party Unix programs (such as PKZIP program) make zipped files

    - Unix GNU program gzip makes gzipped files


    We will cover all of these in both compressing and decompressing (or uncompressing)
    formats, as you will need to know how to decompress something that you compressed.
    Each of these formats has a set of programs for compressing and uncompressing.
    For our first example, we shall look at the standard (and hardly used) compress
    tool that comes with almost every distribution of Unix.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Compression and Archiving Tools 129


    > **Why Compress?** By applying an algorithm, you can compress files for the purpose
    of conserving space or speeding up file transfers.


    # The compress Command


    Use this command and specify what you want to compress. The compress command,
    when used, will be seen as compress <filename>. The compress command is an older
    Unix command that uses an older algorithm to make the compression. In fact, this
    is not commonly used anymore, but it does exist on just every version of Unix.
    Better compression algorithms have been developed; that''s why it''s been moved
    to the side and replaced by tools such as gzip.


    Files created with the compress command have the file suffix .z. This will appear
    in the directory in which you compressed the original file, and can be seen by
    the ls -l command.


    The uncompress command uncompresses the results of a compress command. To use
    the uncompress command, you issue the command as uncompress <filename.Z>.


    Remember learning how the cat command can be used to read files? The zcat command
    is a version of cat that reads compressed files rather than normal text files.
    Using zcat is similar to compress and uncompress; issue the command as zcat <filename.Z>.
    Remember, if you already compressed a file, the file suffix is .Z.


    > **May the GNU Be with You** It''s common to use compression utilities if you
    are trying to save space. Don''t get too hung up on using compress; instead consider
    using gzip.


    # The gzip Command


    Using the compress command will get you the results you need, but again, the utility
    is older and does not work as well as newer ones. Also, the'
