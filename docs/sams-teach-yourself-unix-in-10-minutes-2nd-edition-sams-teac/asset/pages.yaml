    do a mistake and wind up in a jam. There is absolutely no shame in asking for
    help if you don''t know what you are doing. Practice makes perfect, so I suggest
    getting yourself a lab system and changing into the shells just to see how to
    do it.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# User Utilities


    # 177


    Now that you have changed the default shell in your Unix system, you can either
    keep it that way or change it back. For the next portion of the lesson, you should
    be in the shell most comfortable to you. If you changed into a shell that you
    are not familiar with, you should change back to the shell that you usually work
    in so that you can follow the rest of the lesson’s exercises.


    # The passwd Command


    As covered in the first lesson, it’s imperative that you have a set of credentials
    in order to log in a Unix system. Credentials consist of a username (usually assigned
    to you by your Unix system administrator) and a password. Although the password
    is generally configured by the system administrator, you can change it yourself.
    More specifically, if your machine is not connected to a network with other Unix
    computers, then you can use the passwd command to change your password.


    > **There Are Other Ways to Change** If you are not on a standalone Unix system
    and connected to other systems through a network (which is a way to use wired
    or wireless connections), there is a way to change your password in what is called
    the Network Information Service (NIS) database. The ypasswd utility changes network
    passwords associated with the usernames in the NIS database. Although this concept
    is pretty far beyond the level of knowledge covered in this book, it’s important
    to mention in case you come across it instead of the `passwd` command. There are
    also other syntaxes for the `ypasswd` command, such as `uppasswd` for example.
    Because passwords may be stored on multiple machines, this utility will update
    your password on all systems on which you may be working. Check your local man
    pages for more information using these commands.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# Lesson 15


    To use the passwd command, you must first have the proper privileges to make a
    change. If you are not a SuperUser (su), passwd will first prompt you for your
    current password just to make sure you are who you say you are (this is a security
    measure implemented to protect your credentials), and Unix will not continue unless
    the correct password is entered.


    After you enter your current password, you will be asked for your new password,
    as shown in the following example:


    ```

    >passwd


    Changing password for rob

    Old password: *****

    New password: *****

    Retype password: *****

    Password successfully changed

    ```


    > Choose a Good Password Choosing a new password should be something that you
    take seriously so that you can protect access to your Unix system.


    > Your new password should be at least six characters long and not purely alphabetic.
    You should use numbers as well as upper- and lowercase letters (Unix is case sensitive!)
    or special signs such as # or @ in your password. Doing so will help keep your
    password safe.


    > Try to avoid the obvious when choosing your password. For instance, if you have
    pictures of your cat Fluffy all over your office or cubicle, then a password of
    “fluffy” is not going to keep your Unix system safe. The name of your favorite
    baseball team or your children''s names are also bad choices for passwords unless
    you enjoy being a victim. Also, don''t append a 1, then a 2, and so on to your
    password when you are forced to change it (for example, fluffy1, fluffy2, fluffy3,
    and so on). Make sure you always use strong passwords and don''t let anyone steal
    them from you; that way, you can ensure that nobody uses your password for improper
    purposes.'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'The passwords you type are not shown on your display as you type; this way,
    if someone is looking over your shoulder, they cannot see what you type, and Unix
    offers no clues to your would-be attacker. In this example, asterisks (*) are
    used to indicate that typing has taken place. If the password change is successful,
    Unix indicates that with a message such as, "Password changed." If not, you will
    see another message, most likely "Authentication Failure" if you did not supply
    the correct credentials needed to successfully change your password.


    In some cases, Unix can keep you from choosing certain passwords if they are too
    short or based on words in Unix''s built-in dictionary file. If your Unix machine
    is set up this and you enter an unacceptable password, the password command usually
    tells you what you need to do correct it. Choose passwords that mix letters, numbers,
    and letter cases that are not based on common words.


    # Using finger and chfn


    In the Unix environment, you are able to use a tool finger to list user information.
    Although this is a dangerous command to leave unsecured, to some degree it''s
    helpful to some degree. Most times, finger is disabled because if left open and
    unmanaged, it can be exploited. For this reason, we will not spend too much time
    on finger; you likely may not even be able to use it on your system. If you can,
    you will see that in cases in which no other way to list information is available
    (like an email or messaging application), finger does the job nicely.


    How does finger work? To put it in simple terms, information about each user''s
    physical address is stored as part of the user''s system password file when populating
    the finger database; this means that it is possible to retrieve information about
    each user from the finger database—it''s easy. If you are performing finger on
    your own system (by typing finger and pressing Enter), you should see a summary
    detailing your login, name, login time, and where you are logged from.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# Lesson 15


    If you use finger on your own system and do not get the information you desire,
    only need to populate the appropriate fields, thus completing the information.
    Remember, though, this information can be publicly accessed. In order to change
    the information, you''ll need to use chfn, which is discussed later in the lesson.


    Using the finger command is simple. finger <username> to get information about
    a user who is local to your system. To get information about some remote system,
    try entering the following: finger <username>@remote host> and how the remote
    host is configured, this command might or might not work.


    Let''s look at the following example:

    rshimonski@UNIX1>finger


    ```

    Login: Name: Idle: Login Time: Where:

    rob Shimonski___Fri 18:23 Console

    ```


    This is the finger information returned by my personal account. You can see, there
    isn''t much here other than my login name, my user account name (full name here),
    my status, the time I logged in, and the location from where I logged in. This
    is all that is returned because I have not yet set any other personal information.
    In the next section, we will learn to use the chfn command to add more information
    to an account. You will only be able to add this information if you are working
    in a lab environment or have permission to do so (that is, if your system continues
    to use finger in the first place).


    > Finger Is Normally Disabled As previously mentioned, finger is usually disabled
    on most Unix systems. Most system administrators who audit their Unix systems
    for security holes consider this particular protocol to be exploitable, so many
    times, they disable this function.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# Using chfn


    The chfn command runs an interactive process that enables you to set more personal
    information into your account. That way, when you run finger, you can get more
    detail. Run chfn on a command line without any options, as follows:


    ```

    >chfn

    ```


    Changing finger information for rob.

    Password: *****

    Enter the new value, or press ENTER for the default

    Full Name: Robert Shimonoski

    Room Phone: 13

    Work Phone: (212) 123-4567

    Home Phone: (212) 234-5678

    Other: 0

    Finger information changed.


    Once you see “Finger information changed,” you can run finger again and view the
    changes that you made. Again, although this command is helpful, it’s not often
    used in light of today’s messaging applications and portable databases that can
    be accessed using mobile phones, pocket PCs, and so on.


    > Disable finger Many Unix and Linux distributions install default services that
    are little used and have a poor security history. As security becomes more of
    an issue, you may find yourself sitting at one of the most locked-down systems
    you have ever seen. Why? For one, the protocol based around the finger utility
    is as insecure as someone standing over your shoulder trying to capture your credentials
    as you type them.

    In addition, finger uses clear text (not encrypted text) by default and has notoriously
    been the target of hackers. Because finger is a program that displays information
    about a particular user or all users logged on a system, it would make sense that
    it would be the target of any hacker, attacker, exploiter of good. Unless disabled,
    finger will continue to be a source of good information for these individuals.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'So now that you know how to change your shell and alter your password and personal
    information, let''s turn your attention to monitoring your Unix system. In the
    next section, we will cover a few commands that can help you manage Unix. They
    are date, uptime, and who.


    # Using date


    The date command will either return the current date and time or allow you to
    change them. You can only change the date if you have proper permission to do
    so. It is important to have the correct date on your system because many specific
    things rely on it to function. For instance, consider event logs. If you want
    a record of events as security issues in your Unix system, you would want those
    to show up in the log, of course. You would want to know, for example, that someone
    was trying to enter your Unix system without permission. However, even if you
    have system set up to log events, the log entries will be of little use if the
    date and time on your system are not correct. For instance, if the time and date
    are incorrect, you may not notice someone trying to log into your system with
    your username and password in the middle of the night (a clear indicator of someone
    trying to hack in during off-hours). Even if you notice this attempt, you will
    not know the exact time that it took place. Without solid logs that are provable,
    you do not have much of a leg to stand on.


    If you have the right privileges, you can use date to see and set the day and
    time on your Unix system. Ordinary user accounts do not have this capability and
    won''t be able to use this command. If you have proper privileges, you can view
    or change your date by typing the following:


    ```

    >date

    Sat April 01 06:30:01 EDT 2005

    ```


    There''s nothing to it. Remember, the date command is used to check and set your
    date. If you are running a GUI (such as KDE or Gnome), just check the right corner
    of your panel taskbar. You should see the time and date; if not, just open a shell
    prompt and type the date command.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Using uptime


    uptime is another simple and useful command that can be used to verify how your
    Unix system has been up and running. The uptime command returns the current time,
    the number of users logged in the system, how long the system has been running,
    and the amount of load that the system is under. Just type uptime at the command
    prompt, as follows:


    ```

    >uptime

    6:30am up 12:50, 3 users, load average: 0.15, 0.11, 0.04

    ```


    In this example, we can see that uptime returns the current time, since how many
    users are currently logged in to Unix, and the load average. Just about everything
    here should be self-explanatory for the load average. The load average is composed
    of three values: the first value is the load on the system during the past minute,
    the second value is the load average during the last 10 minutes, and the third
    is the load average during the last 15 minutes. These values are rarely than one
    or two. If you see a system load average of anything more than five, your computer
    is busy, and you may see performance degradation.


    # Using who


    In addition to date and uptime, there is another Unix command that can help you
    manage your system. This command is called who. This is not the same as whoami,
    a command you learned earlier in the book. The whoami command returns only the
    username of the person currently logged in and accessing the shell prompt. By
    using who, you can see more information.


    Unix is a multiuser system; this means there can be many different users logged
    in at any given time. Therefore, it''s important to know how to see who is also
    logged in to your system, and you can do this by using the who command. Use this
    command as follows:


    ```

    >who

    rob pts/0 April 7, 2005 (console)

    mary pts/1 April 7, 2005

    jane pts/2 April 7, 2005

    admin pts/3 April 7, 2005

    ```'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'This example shows that there are currently four users logged in to the system,
    who returns the username of each user who is logged in, as well as the name of
    the controlling terminal, the date and time that the users logged in, and sometimes
    the IP address from which the users are connected. Each version of Unix or Linux
    may produce different output, so visit your local man pages for more information
    on the who command.


    # Summary


    In this lesson, we covered the use of Unix system utilities such as chsh, passwd,
    finger, date, and uptime. There are more utilities to choose from use, but for
    a 10-minute lesson, this is plenty of information to digest and practice with.
    Remember, practice makes perfect, so make sure you spend time using these commands;
    they are all helpful and will serve you when needed, especially passwd. In fact,
    you should spend the greatest amount of time with the passwd command and master
    its usage, syntax, and available options.


    The following is a quick review of what was covered in this lesson:


    +   - chsh—Use the chsh command to change your current shell. If you don''t know
    which shell you want to switch to, you can use chsh -1 to list the available shells
    on your system.


    +   - passwd/ypppasswd—The passwd command changes your account password. If you''re
    in an environment with networked Unix computers, you might have to use the ypppasswd
    command instead.


    +   - finger—This command looks up personal information about an account on your
    computer or on a remote computer. finger is sometimes disabled for security reasons,
    so you might not be able to use this command to get the results you expect.


    +   - chfn—You can change finger information using this command. For example,
    you can change your full name, your office address, and your office and home phone
    numbers in your account profile by using chfn.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '+   date—Simply enough, date displays the current day and time on your computer.


    +   uptime—The uptime command provides a summary of information about the state
    of your operating system, including the length of time it has been online, the
    number of users currently logged in, and the average load on your system during
    the past 15 minutes.


    +   who—who enables you to see all the users who are logged in to your computer,
    the date that they connected, and the network address from which they are connected.
    If your machine seems slow, you might want to use who to find out where all the
    processor time is going.'
  merge: -1
