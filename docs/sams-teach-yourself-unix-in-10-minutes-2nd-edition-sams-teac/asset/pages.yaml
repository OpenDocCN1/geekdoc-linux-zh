  img_proc: true
- pgno: 115
  md: '# The more Command


    All you need to do to use more is to type the command followed by the file or
    files you want to display. This command is similar to cat. The tricky part is
    memorizing which one to use and having that knowledge at your fingertips when
    you need it. Let''s take a look at the more command in action:


    ```

    >more hosts.allow

    (Output removed)

    ```


    For this command you will need to have a file that is long enough to scroll off
    your screen and warrants the use of the command. If you type in the wrong command,
    or you specify a file that is not long enough to scroll off the screen, more will
    more or less nothing for you. (Pun intended.)


    When you use the more command with a long file, you immediately see something
    new on your terminal screen. On the bottom left of the screen, you will see the
    more command in action:


    +   - More -- (53%)


    Fifty-three percent is what you have seen and the rest is still needs to be seen.
    You know from the percentage how many pages you are dealing-with. If you had 25%,
    then it''s three or four pages of output to view.


    Pressing the Spacebar will bring you to the next page. You can use the q on the
    keyboard to quit the program, or Ctrl+z will also stop the more command if you
    want to break the sequence of using it. Using s on the keyboard will skip one
    line at a time and is helpful if you want to scroll through your output line by
    line, instead of page by.


    In this section we looked at how to use more to page through your output. Using
    cat showed you contents of a file, but you had little control over being able
    to view large files and this is where the more command is useful. Now, let''s
    take a look at the less command, which is a new version of the more command. So
    you can do more with less!'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# Lesson 7


    # The less Command


    Using the less command is similar to using the cat and more commands. As a matter
    of fact, the syntax is nearly identical. It''s really what the tool does makes
    it different. When using the less command, you have more control over the pager
    than ever before.


    Here is a good example of the differences between more and less:


    ```

    >more hosts.allow

    ```


    If you try to use the arrow keys for navigation while using the more command,
    you will find that you can only move forward through the file with the Spacebar.
    There is not a back and forth as there is with the less command. Now try the same
    things using the less command.


    ```

    >less hosts.allow

    ```


    You can move up and down the file using your arrow keys. You can even move to
    the right buffer if you are working on a terminal emulation program like telnet
    or secure shell. Either way, if you are connected to a Unix system and use more
    or less, check them out and see what they can do for you. Other options that come
    with less are similar to those that come with cat and more. The Spacebar always
    moves you through the file via the page, and q will give you the ability to quit
    out of the program.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '> Ask for It If you are not using the less command at work and think it may
    be more productive for you, request it.


    Now you are comfortable with the fundamentals on how to read a file with cat,
    more, and less, there may be times when you only need to look at a section of
    a file. You may have a need to look at the bottom of a file, or at the top of
    an email message header to get the source and destination addressing out of it.
    If you do not need to look at a complete file and just need to look at a section
    of it, then you can use the head and tail commands.


    # The tail Command


    The tail command is simple to remember. If you want to see the tail end of a file,
    use the tail command. If you want to see the top, use the head command. Now that
    you know the simplicity in remembering it, let''s look at what each does starting
    with tail.


    The tail command is powerful, quick, and simple to use. If you want to see the
    bottom 10 lines of a file, then you may want to just specify the tail command
    and the file you want to view inside of.


    ```

    >tail hosts.allow

    ```


    Or


    ```

    >tail -20 hosts.allow

    ```


    The output of this command starts from the bottom up and displays (by default)
    10 lines from the bottom up. If you specify the amount of lines you want to see,
    count the amount of lines from the bottom up and that is what you will view.


    The inverse of this command is the head command. As mentioned earlier, the head
    is the top and you want to use the head command to show you the beginning of the
    file.'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# The head Command


    In some instances you may need to see the top of a file just like you may have
    needed to see the bottom of a file. To use the head command, do the same as you
    would with the tail command.


    ```

    >head hosts.allow

    ```


    Or


    ```

    >head -20 hosts.allow

    ```


    The output of this command starts from the top down (not the bottom up) and displays
    (by default) 10 lines from the top down instead of the bottom up.


    > Heads or Tails? Let''s Flip for It! A good tip to remember when using head and
    tail is that you are changing the default number of lines shown from 10, specify
    the amount of lines you want to see. This can be done with the -# option that
    we just touched on.


    > Remember, you can always use the help command or man pages to learn more about
    any command on your Unix system. If you''d to change the number of lines that
    are displayed by default, you can override it with the use of -#. In this command,
    # is the number of lines you would like to view.


    This wraps up our lesson on using the shell prompt to read files. There are more
    commands and options you can use, but as with anything in Unix, the amount you
    can do just keeps expanding as you open new doors. For a book this size, we have
    to cap what is covered to some degree. Make sure not to forget that Lesson 2,
    "Getting Help," shows you how to get help. Continue to build up your skill level
    and experience using Unix. For file management, make sure you know how to read
    files using cat, more, less, head, and tail.'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Summary


    Reading files in your Unix system can be done very easily. Working via the command
    prompt can be difficult but by now, that difficulty level should be diminishing
    and fading away as you learn more and more about Unix. In this lesson we learned
    how to work with Unix files and read them via many shell prompt tools. This lesson
    should have given you a clear picture of the many different ways you can display
    files, or portions of files.


    Here’s a review:


    +   **cat**—This concatenate command displays all the files you specify, one after
    the other. It does not pause at the end of pages.


    +   **more/less**—These are known as pagers. They page through their input files,
    one you’re trying to look at header information. less offers the ability to scroll
    backwards through files unlike more. more provides forward-only viewing.


    +   **head**—Displays the first few lines of a file. This is useful when you’re
    trying to look at header information in files such as email messages.


    +   **tail**—Views the end of a file. Used with the -f option, tail provides the
    useful capability of displaying a logfile as it is generated. Rather than each
    program needing its own monitoring utility, tail -f can be used.


    +   **Other file formats**—Although many Unix information files are text or HTML
    based, there are other formats that you might encounter. This lesson looked briefly
    at some of those formats, and the programs that you can use to work with them.'
  merge: -1
  img_proc: true
- pgno: 120
  md: '# # LESSON 8


