    build the command into the environment for use. If you don''t have a file, then
    most likely you will be setting a program up with an environmental variable. The
    environmental variable will essentially be where the program draws its configuration
    information from.


    Environment variables are used by programs to pick up specific pieces of information
    that are needed when the program is run. For example, you'
