    with special characters.


    It should be noted that every Unix shell offers I/O redirection with a standard
    set of characters used to achieve it. Those characters are


    +   < redirects standard input to come from a file


    +   > which redirects standard output to go to a file


    There are other characters that we will learn about, but for now, these are the
    two most common forms of I/O redirection known or used.


    We will look at an example of using these characters with the cat command. We
    learned about this command when we learned how to read files in Unix.


    The cat command is actually short for concatenate. Concatenate means "link together"
    and is the perfect definition for the examples I am to show you. The cat command
    will allow you to specify multiple file-arguments, and then cat will copy them
    to standard output, better known as STDOUT. We will cover this shortly. When using
    cat, remember that we used the ''command < filename'' syntax. This means that
    you want to change what was standard output for cat and change it to what you
    specify. Simple, right? If standard behavior for running cat without arguments
    is to just repeat any input back to the terminal, then cat > filename can change
    how I/O is directed so that in this case all the input will be directed into the
    file.


    ```

    cat

    1

    1

    2

    Ctrl+d

    ```


    In this example, we showed that the cat command, when used without a filename
    argument, simply copies its current input to its output. This is why when you
    typed 1, cat was nice enough to repeat it back to you. This proves a point about
    input and output. You invoked the cat command, waited for your input, and then
    repeated it as output. This should solidify what I/O really is within Unix at
    its most fundamental level.'
