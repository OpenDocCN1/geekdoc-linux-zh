    In this section of the lesson, we have covered how to compress data, and we lightly
    touched on the use of the tar command. In the next section, we will dig deeper
    into the tar command and cover its use.


    # The tar Command


    If you spend much time using Unix systems, you''re bound to run into tar files.
    The tar command is a convenient and commonly used tool for personal archiving
    and distribution of files. It is imperative that you are familiar with tar if
    you are studying Unix beyond the level of this book. As mentioned before, tar
    stands for Tape Archive, although this is used more often for standard packaging.
    It was originally designed for file backup, but today can be used with other storage
    media.


    What is packaging? Well, let''s say you needed to send someone a program you created.
    You would most likely just have one file, but multiple files. You may want to
    create a single file that basically encompasses all the rest of the files or directories
    you are looking to package. The purpose of assembling a collection of files into
    one combined file is for easier archiving, storage, and sending condensed versions
    of data to others. When run it produces files with a .tar extension. When combined
    with gzip, for data compression, the resulting file extensions may be .tgz, .tar.gz,
    or .tar.Z as mentioned earlier.


    The tar command in its simplest form creates or unpacks archive files. When creating
    an archive, provide tar with a filename for the archive and a list of files that
    you want to archive. The tar program will collect all the files you specify and
    put them into one single file—this is commonly called a tarball.


    When unpacking archives, provide tar with the name of a tar file and extracts
    the contents of the file into the current directory, or a directory you specify
    with the exact same filenames, paths, and contents that existed on the system
    where it was tarred.'
