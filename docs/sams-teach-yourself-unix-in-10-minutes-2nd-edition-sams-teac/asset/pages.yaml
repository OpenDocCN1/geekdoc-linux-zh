  md: '# Managing Processes in Unix 145


    # Using cron


    As mentioned earlier in the lesson, the cron process (also called the daemon)
    executes commands at specific dates and times. You can use cron to schedule activities,
    either as one-time events or as recurring tasks. Remember, if you want to attempt
    to work with cron, you may have to request to do so. On most systems, you must
    get permission from the system administrator before you can submit job requests
    to cron. Similarly, on some shared systems, because there is only one crontab
    file, only the administrator has access to the crontab command.


    As mentioned earlier, for commands that need to be executed repeatedly (for example,
    hourly, daily, or weekly), you can use the crontab command. The crontab command
    creates a crontab file containing commands and instructions for the cron daemon
    to execute. You can use the crontab command with many options. If you can master
    this command, you can automate almost any process for reason. Let''s look at crontab
    work.


    To use crontab, simple type **crontab** with an option and then the filename.
    The filename you specify will be used for your crontab file. Many times, you can
    just leave out the option and simply type **crontab filename** to save that file
    as your crontab file. An example would be


    ```

    >crontab -a filename

    ```


    The -a option (again, not always needed on some Unix variations) will install
    the filename as your crontab file. You can use other options, such as cronab -e.
    This will allow you to edit your crontab file; obviously, if you want to change
    processes, this is important to know about and able to do. You can display your
    crontab file with the -1 option. You can use -r to remove your crontab file. There
    are more options for crontab which are more complex and used for system administration.
    This overview should be enough to get you started with local automation on your
    Unix system.


    Each entry in a crontab file consists of six fields, specifying (in order) the
    following information:


    minute(s) hour(s) day(s) month(s) weekday(s) command(s)'
