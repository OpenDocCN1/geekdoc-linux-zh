- pgno: 148
  md: 'Unix version of compress can be slightly altered as you go from distribution
    to distribution. Any variance is not good as you may not be able to compress with
    one utility and decompress with another. To make this clearer, consider why you
    would use compress: because it is the only thing you either know or have. It is
    located on your Unix system and is there for use.


    What if you wanted to use something that was a little less likely to be proprietary?
    The gzip command (stands for GNU zip) is the original file compression program
    for GNU/Linux and has been adopted for use with all Systems under the GPL (GNU
    Public License). This means that it is free for use and standardized as a common
    tool that almost everyone in Unix and Linux environments will use. Current versions
    of gzip produce files with a .gz extension.


    The gzip command will work essentially identically to the compress/uncompress/zcat
    suite we just talked about. It is a better utility and less proprietary than the
    older tools in use as compress.


    To make your life a bit easier, GNU has included the capability to deal with compressed
    (.Z) files in their gzip and zcat utilities. You might find that gzip and gunzip
    exist on your system, but zcat is missing. Some distributions have renamed zcat
    to zcat because it handles compressed files as well.


    When gzip is combined with tar (which stands for Tape Archive and will be discussed
    later), the resulting file extensions may be .tgz, .tar.gz, or tar.Z.


    # zip/unzip


    As we wind down to the end of our compression utilities offerings that can be
    used with Unix, let''s cover the last of the commonly seen utilities used for
    compression and decompression. Most PC users, whether familiar with Unix or not,
    know about Zip files. The zip command offers compression that is based on the
    algorithm from the PC standard PKZip program. The zip and unzip programs work
    exactly as you might expect them to: zip <filename> to compress a file with zip,
    and unzip <filename.z> to unzip the files.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Compression and Archiving Tools


    What Can bzip2 Do for You? Also appearing recently is the bzip2 compression utility,
    despite being the newer kid on the block, looks very promising for tight compression.
    You can learn more about this tool at the bzip2 website at http://www.bzip.org/.


    bzip2 is a freely available, high-quality data compression. The current version
    is 1.0.3, released February 15, 2005, so it''s still being updated as the writing
    of this book.


    It typically compresses files to within 10% to 15% of the best available techniques,
    while still being twice as fast at compression and six times faster at decompression.
    This being said, it would make sense if you need to have this higher rate of compression,
    you should use this utility. Many users still use gzip.


    The syntax and options for bzip2 have intentionally been made similar to gzip,
    so if you encounter this program as it grows in popularity, you won''t have too
    much trouble figuring it out. Compression with bzip2 follows the gzip format bzip2
    <filename>, which produces the compressed file <filename.bz2> . Decompression
    is simply bunzip2 <filename.bz2>.


    Since this utility is not common to see or use, if you encounter bzip2 and need
    to do more than trivial compressions or decompressions, it is recommended that
    you consult your local man pages for current information.


    Creating files using the zip format (which uses the suffix .z in Unix) for distribution
    to other Unix users is generally not a good idea, as zip and unzip are not always
    available to Unix users. These utilities are freeware, so get your system administrator
    to install them if you need to access to them.'
