  md: '# Using foreach


    When you find yourself putting in commands over and over, you can use the foreach
    statement that executes a code block for each data item in an array. An array
    is a set of elements indexed sequentially that have the same type of data. Most
    times, each element of an array has a unique identifying index number. Changes
    made to one element of an array do not affect the others. foreach specifies that
    for each entry in the array of entries, Unix will output the entries to the terminal.
    Commonly, foreach is used in place of a standard for loop. Unlike this for construct,
    a foreach loop usually does not specify the order in which the items are considered.


    The point of this is, if you don''t want to spend a massive amount of time inputting
    files into a command to automate them, you can use the foreach command, which
    takes a list of files, and does something "each of" based on what you specify.
    The commands'' use is much easier to demonstrate than to explain. If you have
    a list of files that you need to do something to, you can follow these steps to
    use foreach:


    +   Figure out what you want to do. In the following example, you''ve got a bunch
    of directories (1 through 3), and you want to create a tar file of each of them.


    +   Decide on the names of the files/directories that you want to do something
    to. In this case, you''re going to create tar files for the directories directory1,
    directory2, and directory3.


    +   Pick a variable name that you want to use. For this example, you''re going
    to use a variable named test. It doesn''t matter what the variable name is, as
    long as it doesn''t conflict with the name of the command.


    +   Issue the foreach command as foreach <variab> (<filenames>). The foreach command
    then asks what you want to do for each file by displaying a question mark. Fill
    this in with whatever you need to do. Again, you''re going to be taring files
    in the example. After giving foreach the command for whatever it is you want to
    do, finish it by putting the command on a line by itself.'
  merge: -1
  img_proc: true
