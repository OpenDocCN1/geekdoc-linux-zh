- pgno: 207
  md: '# Paths


    As was just mentioned, a path tells the shell where to look for programs that
    you want to execute. You might notice that if you have a copy of a program in
    your command directory, typing the filename sometimes results in a command not
    found error. This is because it''s common for the path variable to lack the current
    directory. A good way to simulate this problem is to type the following:


    ```

    > \-

    >(- Command not found

    ```


    In addition to getting a nice smiley face you can see that there is no command
    found for this entry. All this means is that you either don''t have a path or
    you don''t have a command. You can execute programs in the current directory by
    typing ./<program> or by adding the current directory to your path. The current
    directory is usually left out of the path because including it could be a security
    risk. Working with Unix implies knowing a little about security and how to protect
    Unix, you should be aware of why you may not have a command present if needed,
    or an option available that you may need or want.


    If your current directory is in your path, you can potentially be fooled into
    executing arbitrary programs by naming them as common Unix commands, and sneaking
    them into your directories as aliases or script files, which is not good.


    If you want to see what your current path is, you can do so by using echo PATH.
    If it''s missing some paths you need, the current directory and /usr/local/bin,
    for example, you can add these by using the following command:


    ```

    set path=$($path /usr/local/bin )

    ```


    Now that you are familiar with working with a path and viewing it, let''s take
    a look at your Unix user defaults and dot files.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Using Dot Files


    When a new Unix system account is created, certain default settings maintained
    in default configuration files (called dot files) are placed in the user’s home
    directory (-). Dot files are files with names starting with a . character. Definition
    on the Unix shell, different files are more active than others. For the most part,
    these files should be left alone unless you know what you are doing. However,
    there will be times you will need to alter them although frequent changes to these
    files are not needed.


    In working with dot files, you may accidentally corrupt them or make them invalid
    with an incorrect entry. Invalid or corrupted dot files can prevent you from logging
    in or otherwise affect your account. It is important that you back these up, and
    that you tread carefully when making changes at work. However, if you have a free-for-all
    on your Unix home lab system. To list all of your dot files, type ls -a at the
    prompt.


    > Use Combined Options When you want to see your dot files in a long listing,
    type ls -la. The is what makes them hidden files.


    Not all systems have examples you can follow, but for those of you who do: What
    are some of the default dot files you think you may encounter? Following is a
    list of some of the default dot files you are likely to see, or use in contact
    with sometime on your Unix system.


    +   -login and logout—As you might guess, .login and .logout files are executed
    when you log in and when you log out. If you look in these files, you will find
    that they are shell scripts, which use commands that you are familiar with.


    +   -cshrc or .profile—Shell scripts are executed when you open a shell. Shells
    have their own scripts that execute at startup.


    +   -X1defaults or .Xdefaults—This file contains settings that are used by the
    server resource database; the settings are mainly used in the X Window System.'
  merge: -1
  img_proc: true
