- pgno: 65
  md: '# LESSON 4


    # # The File System Explained


    In this lesson, we will cover the fundamentals of the Unix file system as well
    as start to learn how to perform basic file system navigation.


    Now that we have learned how to log in, find help, and navigate the X Window System,
    we need to learn about the single most important thing in Unix—the file system!
    Because almost everything in Unix is viewed as a file, it would only make sense
    that understanding the file system will be your top priority. By the end of this
    lesson, you will know how to navigate the file system with ease. Unix provides
    sophisticated file access and control, which is a clear sign of its internal power.
    Let''s begin learning how to unleash its power.


    # ## File System Design


    Unix''s file system is one of the strongest and most flexible in use today. This
    file system was made for power and not for ease of use, navigating can seem somewhat
    cryptic. Try not to worry, however, because the purpose of this lesson is to help
    eliminate any potential confusion. In this section of the lesson, we will take
    our first step toward that goal by looking at some of the design features that
    make it Unix file system.


    In Unix, the file system is laid out so that there is a single root directory.
    This is unlike Microsoft Windows, for example, where Windows will have multiple
    drive letters as C:\, D:\, and so on. From the single root directory in the Unix
    file system, the file tree sprouts. A sample file system tree can be seen in Figure
    4.1.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '![](img/9552a570ce35faac09a770fd5ff1ede3_66_0.png)


    FIGURE 4.1 Sample Unix file system tree.


    The root directory should not be confused with the all-powerful administrator
    account called “root,” which we learned about when we learned how to log in to
    Unix in Lesson 1, “Getting Started.”


    > Get to the Root of the Problem, but Which Root?

    Remember, in Unix, the person with absolute control over everything having to
    do with the machine is the root user. The root user should not be confused with
    the root directory, which is the one specific directory on the machine that is
    considered to be the base of the file system. Try not to confuse these two definitions.


    Another interesting fact about Unix’s file system design is that installed hard
    disks do not show up as drives in Unix. In Windows they do, but in Unix, installed
    hard disks are viewed as directories within the file system. In some people’s
    opinion, this is easier to understand than the Windows method. Here, if you have
    a drive installed on your system, you can'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# The File System Explained


    quickly change from your current location to this other drive just by inging the
    correct command at the shell prompt. Unix completely removes the end user''s concern
    regarding what hardware is installed on the system and the physical location of
    the files he or she wants access. One of the benefits of this design is that if
    you have a disk failure (where a hard drive ceases to function), then you are
    back in business as quickly as the disk can be replaced and remounted (this is
    a task for your Unix system administrator). Another benefit of this design is
    that you can quickly and easily find what you need in the file system right at
    the shell prompt, which we will shortly learn to do.


    Unix commands, as we already discussed, are case sensitive, so the principle for
    searching for files is the same as that for executing them: You have to be specific.


    > **Don''t Be So Sensitive** When learning Unix, always consider case sensitivity,
    no matter whether you are entering a command or searching for data. So many new
    users of Unix are accustomed to Windows and other operating systems that are generally
    not dependent on case sensitivity because they were built for ease of use. Unix,
    the powerhouse among operating systems, must be approached a different way.


    Another aspect of Unix''s file system design is its approach to file attributes.
    For those of you familiar with Microsoft Windows, attributes are characteristics
    assigned to files or folders that provide you some of access control over the
    data. For instance, if you have a file that you don''t want anyone to alter, you
    can make the file “read only.” This ensures that if other people look at the file,
    they can''t change it. In the same way as Windows files, Unix files use three
    such attributes:


    +   * Read

    * Write

    * Execute'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'In Unix,these three attributes can be used in the negative form as well.

    In other words, you can make a file readable or unreadable, writable or not writable,
    executable or not executable. In most cases, files used for data will be designated
    as readable and writable, and programs will be marked as readable and executable.
    This, however, is not a rule—it simply what you are most likely to see in the
    types of files you are working with right now.


    There’s one last tip you should keep in mind when working in the Unix file system:
    You have to be careful when asking Unix to do something. Although you shouldn''t
    be afraid of Unix, you have to consider that it does not have as many “checks”
    built into it as other operating systems. For example, if you try to change or
    delete something when working in Microsoft Windows, the operating system double
    checks with you to make certain that this is really what you want to do. This
    is not going to happen when you are typing commands into the Unix shell prompt.
    Thus, if you are practicing on a live system, be careful. Again, it''s always
    recommended that you get a copy of Unix or Linux and practice in a lab so that
    you can make mistakes and not to worry about anything affecting the system.


    So, now that you feel comfortable with the design of the Unix file system, let’s
    take a look at how to navigate it and at what commands you can use to unleash
    Unix’s power.


    # Navigating the File System


    File system navigation is commonly one of the first lessons taught in Unix, not
    only because of the reasons that were just discussed, because it helps to know
    where you are and where you are going in order to get to your destination. It’s
    like planning a trip—you don’t walk out, hop in the car, and go; there should
    be some planning involved, especially based on the complexity of the trip you
    are about to take. In Unix, knowing what commands to use is your preparation and
    plan, and once mastered, it will have you working on data files, editing web pages,
    and so on.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# The File System Explained


    The most basic commands for dealing with the Unix file system are the ones for
    moving between directories and finding out what files are in them.


    # Using the pwd Command


    For users of Windows or MS-DOS, one command you would commonly type at a command
    prompt is dir. This command (which stands for directory) will list the contents
    of the directory you are currently in; if you specify the entire path statement
    to another directory, the command will also let you see the contents of that directory.
    In Unix, the *pwd* (present working directory) command asks your machine to tell
    you what directory you''re currently in. The way that Unix displays this information
    is different than in Windows. For example, the path C:\Windows tells you that
    there is a folder (directory) called Temp in a folder called Windows, and the
    Windows folder is currently on the C: drive will seem different; for instance,
    `/priv/home/rob/temp/` would be an example of a path in Unix. Here, the simplest
    explanation of a path is that it describes the shortest set of directories through
    which you must travel to get to the current file or directory from the root directory.


    Any time you''re at the shell prompt, type **pwd** and Unix will tell you where
    you are as you progress in your Unix studies. The following is an example of this
    command at work:


    ```

    > pwd /priv/home/rob/temp/

    ```


    Get familiar with this layout; you will be using path statements more and as you
    progress in your Unix studies.


    # The Home Directory


    In this book we have talked about the home directory a few times but not yet fully
    discussed it. In this section we will now cover the importance of the home directory
    for the Unix user.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Lesson 4


    Each user in a Unix system should have one directory assigned to her for personal
    use, to store data. This directory is called the home directory.


    Your home directory will be where you wind up when you initially log to your Unix
    system. You will be in your home directory by default.


    Anything in or below your home directory belongs to you, and unless you allow
    otherwise, the contents of this directory will be secure and not available to
    others for use or browsing.


    > What Is Tilde? In Unix, you can refer to your home directory simply as ~. This
    is important to know because it can reduce the amount of typing you have to do.
    More specifically, to switch to your home directory, you can want to switch to
    someone elses home directory, you can also use the tilde with the person''s username,
    see as ~username.


    Now that you can the pwd command to find your present location, let''s investigate
    how to view the contents of a directory, whether it be more directories or files.


    # Unix File Listing


    Up to now, all the commands you have learned have been important. Not one of them
    is commonly used or seen. This next command we discuss, however will be a command
    that you use just all the time as a typical Unix user, so we will spend some quality
    time reviewing its details as closely as possible. The command you do this with
    is the ls command, which lists files. Issued without any arguments (also known
    as switches), ls lists the files and subdirectories in the current directory.
    You can, of course, list files in a different directory by specifying that directory
    in the path statement or or simply by changing into that directory and then issuing
    the ls command. An example of using pwd and ls is seen here:'
  merge: -1
  img_proc: true
- pgno: 71
  md: '```

    > pwd

    /priv/home/rob/temp/newwebsite/

    > ls

    cgi_bin index.html

    images vrml

    ```


    This example is based on the assumption that I switched into the new directory
    I (newwebsite) before issuing the pwd command. Then, by issuing the ls command,
    I got the file listing for that directory, which includes a new HTML page I created
    called index.html. Now, you try it. Attempt to determine where you are currently
    by checking your working directory, and then list the files and other directories
    from your current location. As we progress we will learn how to change directories,
    but for now, remember that this lesson is directed towards the Unix learner. If
    you know where you are in the Unix operating system, you don''t need to issue
    the pwd command before listing files.


    As mentioned earlier, if you are interested in listing files that are in another
    directory and you don''t know how to change into that directory, you can easily
    solve this problem using the ls <directory name> command. You can use the root
    directory we just learned about your example. Because your current directory should
    be your home directory, you can list the files and directories in root by doing
    the following:


    ```

    ls /

    CDROM lib

    bin priv

    core tmp

    dev temp

    etc usr

