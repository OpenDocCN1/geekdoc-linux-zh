    list:


    +   - ls—Referring back to Lesson 4, "The File System Explained." you know that
    you can use the ls command with the -1 option to display disk usage for a file
    or files. If you need to scan quickly through your files to see which ones are
    taking up the most space, this is a quick way to do it.


    +   - find—In Lesson 5, "File System Navigation Techniques," you were introduced
    to using the find command to find files larger than a certain size. Although similar
    in utility to the ls -1 command for this purpose, find -size # is a faster way
    to collect information on all files larger than kilobytes. You just need to know
    what # you''re looking for.


    +   - df—Used mostly by system administrators, the df command gives information
    about disk usage. Depending on your version of Unix, you might have to give df
    different options to get to produce readable output; but the general form you''d'
