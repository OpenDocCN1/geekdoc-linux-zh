- pgno: 238
  md: '# Lesson 20


    You Need to Be Root In this lesson, you''ll take a look at some of the restricted
    commands that Unix system administrators use, and learn some of the other things
    you can do with your Unix system. The commands in this lesson are restricted to
    being run by the root user, but the information here will help you understand
    some of root''s concerns and help conversations with your system administrator
    to make a little more sense. Because of the way that Unix works (with multiple
    users, multiple processes, and files owned by potentially hundreds of people),
    there are certain commands that will cause chaos if entrusted to normal users.
    These commands do things such as format disks, reboot the system, and create or
    remove devices.


    Root technically has two definitions in Unix. For one, it''s the name of the login
    account given full and complete access to all system resources.


    The root directory is another one, which is also used to describe the directory
    named /. This is the top-level drive to where all the rest of the Unix system
    branches off from.


    Make sure you are logged in as the root (user account) so that you can work with
    any of the commands seen here. If you cannot log in as root at work, follow along
    and wait until you set up a test lab at home so you can work on these root-level
    commands. Making mistakes with these commands is even more unforgiving than any
    other command we have learned so far. These could really cause serious issues
    to the system if not done correctly. You need to make sure you practice before
    doing these commands in a live setting.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# Unix Privileged Commands


    # 221


    ![](img/9552a570ce35faac09a770fd5ff1ede3_239_0.png)


    Using the su Command The su command creates a shell with the user ID of another
    user.


    sudo (pronounced soo-doo) simply stands for “SuperUser do.” sudo is used to allow
    any user to run some, if not all, root-level commands using that account. Make
    sure you consider this and make it as important as the root account, because it''s
    easy to see how quickly it can be exploited.


    # Single-User Mode


    Single-user mode is a Unix system from bootup created for administrative and maintenance
    activities, a mode where the machine has no network resources and can only support
    a single user logged in. Single-user mode will absolutely demand complete control
    of the system. When the system is in this single-user mode, whoever is logged
    in becomes root. This is, however, a minimal system startup state so don''t fear
    it, it is merely for diagnostics. If you do become interested in repairing a non-booting
    Unix system, or want to repair problems in your system, you may want to learn
    about this mode. The root file system is available. As well, every root partition
    is mounted, so only commands that reside in the root file system are available.
    Every Unix machine can be configured to boot into single-user mode.


    Single-user mode can also be viewed as a maintenance mode that enables the root
    user to repair problems with the system without having to worry about other users
    changing things that they are working on. This is essentially what it is used
    for. If you have bootloops, ask your system administrator and look yourself to
    see what is done.


    With some versions of Unix, if a machine experiences a particularly hard crash,
    it may reboot itself into single-user mode automatically. This is why you may
    see it as a Unix end user; if you notice something different, then ask for help.
    The system may have suffered a hard crash and is now waiting for your help!'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Lesson 20


    Some versions of Unix and Linux will require you to give up a root password before
    any commands can be entered, and others come up directly into a root shell; this
    varies by distribution and configuration. If you happen to crash a Unix machine
    and it comes up in single-user mode, it is better to do absolutely nothing and
    ask for help because the system is pre for the experienced administrator, not
    the inexperienced end user. If the wrong things are entered, the system could
    become worse, or logging and troubleshooting data can be lost. Anything you do
    has the potential to make diagnosing the crash impossible; worse, it can have
    devastating effects on the system. At the same time, if you are at home in your
    lab, go to town. Look online or get more books on how to figure out how to operate
    this system and try to simulate issues to get yourself comfortable with troubleshooting
    and entering the menu manually.


    # fsck


    The fsck command (short for "file system check" or "file system check") will start
    the Unix system utility to check the consistency of your file system. Every now
    and again you might hear a Unix administrator talking about the need to a hard
    drive because it is experiencing problems. Hard drives are like light bulbs: They
    are made to fail and actually have a MTBF (Mean Time Between Failure) associated
    with them. This just means that like a light bulb, their internal parts will eventually
    quit and cease to function due to nonstop use and/or damage.


    The fsck command is Unix''s disk fixer program, and it is used to clean up problems
    caused by crashes or errant pieces of software. Much like the tools used in Windows
    systems (such as Disk and defrag), you will eventually need to know this command
    if you are managing and maintaining a Unix system. Most Unix systems fsck their
    drives on boot, and the expected result is an analysis report containing the number
    of files and the fragmentation level of the drive. If you are watching a machine
    boot, do not be overly concerned if you see fsck report problems. Unix automatically
    attempts to fix them.


    In most cases, fsck will be successful at the repair and fix. After using fsck
    on the drives, the system restarts the reboot process, which should'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Unix Privileged Commands 223


    then bring you to the login prompt. If the drives have serious problems, the automatic
    fsck exits with the following error message: Run fsck by hand.


    Here is what the whole message would look like on some distros of Unix

    or Linux.


    +   checking root filesystems parallelizing fsck version 1.04 [/

    - sbin/fsck.ext2 fsck.ext2 -a /dev/sda1 /dev/sda1

    - contains a file system with errors check forced

    - Block 234543565 of inode 143234 > Blocks

    - (0234234) /dev/sda1: UNEXPECTED INCONSISTENCY; Run

    - fsck manually an error occurred during the file

    - system check. Dropping you to a shell; the system

    - will reboot when you leave the shell


    If it does, please don''t touch anything, and find a system administrator

    or help. If you are running this in your lab, this is also tied to what

    we just learned; you will be booting in single-user mode and need to

    fsck. If you have a crash after booting, you should run fsck from a boot

    disk, which may be the same one you used to install Unix or Linux in

    your lab. In this example, you can run fsck /dev/sda1 (the partition that

    is showing the errors) and fsck will attempt to fix. fsck will prompt you

    to find and fix each error so you can see what it is. Again, this is only

    sthing you should do in a lab, or as an experienced user.


    # shutdown/reboot


    There may be a time when you need to shut down your Unix system or

    reboot it. I can vouch from many years of experience that you

    will reboot Unix or Linux far less than Microsoft Windows, you may still

    need to shut down your system or reboot it. Unix boots differently from

    Microsoft Windows. Most Windows operating systems will boot up as a

    complete unit. In Unix, the kernel loads, and then anything else is loaded

    around it for use. Unix uses dozens of programs to form what appears to

    to a huge operating system, when in reality it''s all loaded separately as

    single programs.


    Each of these programs might be in the process of modifying, moving,

    creating, or deleting files at any point in time and cannot be interrupted. If'
  merge: -1
  img_proc: true
- pgno: 242
  md: 'you simply shut off the power to a Unix machine, you interrupt all these

    processes, and probably destroy any files they were working on at the

    time. This happens often, and it is another reason why it''s important that

    commands like these are restricted to the proper users. Haphazardly shut-

    ting the power to a Unix machine has the potential to completely cor-

    rupt the drives, leaving the system unusable. Be careful if you use this

    command at work. If you are working in your lab, then have fun, and try

    to create problems that you can use single-mode and fsck to fix it.


    The shutdown command and a reboot command have obvious.

    These two commands gracefully exit all running software, write out disk-

    ache information to the drives, and complete their respective tasks. They

    are restricted to the root user for obvious reasons.


    # Summary


    In this lesson, you were introduced to root level commands that if not

    used properly could cause serious problems. However, if these commands

    are mastered and practiced, they can help you in a great ways that

    this 10-minute lesson could never cover in this page count. Make sure that

    if any of these commands interest you, and you want to progress on fur-

    ther this book, set up a Unix or Linux system at home or in a lab

    somewhere and practice! It is truly the only way to get good at this,

    specially something as cryptic as Unix. You need to practice and read

    more.


    To tie the book, I would personally like to wish you the best in your

    Unix beyond this point. I hope you enjoyed this book and that

    you learned enough to get to the next level. Let me know at

    rshiminsonki@rsnetworks.net or visit me on the web at http://www.

    rsnetworks.net. It truly has been a pleasure to teach you the fundamentals

    of Unix. The following is a review of some of the other points from this

    lesson:


    +   - Never touch a machine if it looks like it''s running a root shell.

    Root is powerful and should only be used by experienced users

    and system administrators.'
  merge: -1
  img_proc: true
