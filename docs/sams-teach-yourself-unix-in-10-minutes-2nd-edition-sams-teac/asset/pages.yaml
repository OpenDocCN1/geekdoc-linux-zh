- pgno: 77
  md: '# The File System Explained


    short time period. After only a few lessons, you are now able to work within the
    Unix environment to some degree. In the next section, we will make even greater
    progress by learning how to begin “moving” around in Unix to find what you need
    or to do certain tasks.


    # Changing Directories: cd


    Changing directories in Unix is just as easy as listing them. The ls command is
    used to list the contents of a directory, the cd command is used to change directories.
    Moving from one directory to another may be necessary if you need to edit a file,
    delete a file, or perform any variety of tasks. The cd command will also help
    you execute your use of other commands and allow you to navigate the Unix file
    system.


    Using the cd command will let you change directories in a flash, how do you know
    where you are and where you want to go? That’s where the other commands you have
    already learned come into play. The pwd command will show you the directory in
    which you are presently located. The ls command used with specific arguments (if
    needed) will then show you the contents of that directory, perhaps files and other
    directories. If, in that list of contents, you see another directory you would
    like to access, you can simply use the cd command to do so. The full syntax for
    the cd command is cd <directory name>.


    Because we’ve already learned about the home directory and the root directory,
    let’s practice all these commands and move from one to the other and back again.


    ```

    > pwd

    /priv/home/rob

    > cd /

    > pwd

    /

    ```


    In this example, I knew where the root directory was located by default, so I
    just specified it. To move back, you can do the following.


    ```

    > pwd

    /

    > cd /priv/home/rob

    > pwd

    /priv/home/rob

    ```'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'Notice that I didn''t have to step back from the /rob directory to the /home
    directory and then from /priv switch and change directories to the root directory
    (/). I could simply specify /priv/home/rob when using the cd command.


    > Unix Commands Are Similar to Windows Commands...Sometimes The cd command used
    with Unix is identical to the one used with Windows-based desktops when using
    the command or MS-DOS prompt. You can see this command and other Windows commands
    that are similar to Unix commands by going to start => run (or programs => run)
    and typing cad or command. Then, type the word help. The cd command (and many
    others) can be seen here. The cd command is common in use and structure in all
    systems.


    # Changing Directories: pushd and popd


    After you master the cd command, you need to learn to move around Unix using the
    pushd and popd commands. pushd <directory> will be entered if you want to specify
    the directory. With the popd command, however, you will not need to specify a
    directory name.


    When changing between directories, these two commands allow you to make good use
    of the directory stack. The directory stack is a type of data storage that works
    as follows: Data is added to the top, creating the stack, and the most recently
    added “plate” of data is the first to be removed if requested, because it comes
    off the top of the stack. To describe this in terms of pushd and popd commands,
    data is pushed (pushd) onto the stack and popped (popd) off the stack when requested
    each command, making use of these commands quicker and more efficient than use
    of the cd command. The following examples will show you how to perform pushd and
    popd:


    +   - pwd

    - cd /priv/home/rob'
