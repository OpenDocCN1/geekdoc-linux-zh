    For each item in the current directory, du -s returns a summary of the total disk
    space used by the contents of the files or directories. Depending on your version
    of Unix, you might need to supply with the -k flag to convince it to show you
    the disk usage in values of kilobytes (otherwise it shows you the disk usage in
