- pgno: 213
  md: '# The l1pr Command


    Because Unix is a multiuser environment, it would only make sense that more than
    one person would be printing to a printer at any single time. When you print in
    Unix, your print job is sent with a job number. This number is assigned to the
    job by Unix to track and complete the job. Canceling a print job after you start
    one is canceled based on that job number. The job is removed from the print queue
    and you no longer have a print job pending.


    Now that you understand the fundamentals of printing in Unix, let''s take a look
    at how to actually get it done.


    With the lpd (line printer daemon and its protocol) system available on your machine,
    you can use the l1pr suite of commands to send print jobs to your printer. The
    lpr (line printer) command is the primary method for sending data to the printer
    and is available on, if not, all Unix systems unless disabled or removed. lpr
    essentially dumps all data directly to the printer that you specify. To use l1pr,
    follow these steps:


    +   1. Determine the name of the printer you want to use. In some cases, your
    Unix system administrator will give you the name.

    2. Choose the file you want to print as a text file. If you do not have the one
    to print, make one with emacs or vi.

    3. Send the print job by using the following command: lpr -P<printer name> <filename>
    <filename>.... (There is no space between -P and the printer name.)

    4. If there is only one printer configured on your computer, chances are you simply
    type lpr <filename> <filename>...


    Let''s look at an example of how to print out a print job. As an example, type
    the following:


    ```

    >lpr -Ppr anyfile.txt

    ```'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# Lesson 17


    Printing, Printer, Print Server, Print Queue... What?

    There are a lot of terms to understand, and if you really want to learn how printing
    works you will need to know the details. Printing can be confusing if you do not
    understand all the terminology revolved around.


    ![](img/9552a570ce35faac09a770fd5ff1ede3_214_0.png)


    For one, printing is the process for reproducing copies of texts and images on
    the Unix system. A printer is the device used to do the actual printing work.
    A printer is a peripheral hardware device that produces a hard copy (permanent
    human-readable text and/or graphics, usually on paper) from data stored in a computer
    connected to it or from another source. A print server is generally the computer/or
    software that is used to provide users or a network with access to a central printer.
    The print server shares resources and collects its jobs in its print queue (mostly
    found on the print server but in some cases can also be on the local system).
    The print server sends the print jobs to the hardware printer. The print server
    acts as a buffer, holding the information to be printed out in memory until the
    printer is free and clear. It is possible to program the print server to print
    jobs in the order they arrive, or to give priority to particular users who need
    it. If you need to remove a job from the queue, only the root user or the person
    who owns a print job can remove it from the queue. A print job is the job you
    sent to the printer. The job is nothing more than what you want.


    This should clear things up you can master the rest of the lesson. Make sure you
    clearly understand these definitions before moving on.


    The result of this command is that the myfile.txt is sent to the printer named
    prl. If the printer is not busy, then the print job will be printed immediately.
    If the needs arises, you may need to print multiple copies of a document. You
    can do this by entering the same command once for each copy you need, or by simply
    specifying the number of copies as an option to the lpr command.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# No Print Job for You! You may not be able to print because you are not configured
    to do so. Running the lpr command may give you an error as “no default destination
    available” or some other error (it will be different based on your Unix version)
    that simply states that you do not have a destination device for your hardware
    printer to send the job to. Because of this, Unix just tells you “sorry—no print
    job for you!


    Specify the number of copies as an option to the lpr command by doing the following:
    type lpr with -n<number of copies> to print many copies of each file in the job.
    That''s it!


    Also, there are a few formats and special print cases that might require special
    attention from the print command. Filters are applied to a file to convert the
    information to a special format. The format can be any that the printer can handle.
    Here are a few examples of common filters:


    +   * ps—This extension stands for postscript files. Postscript files will be
    handled automatically by the lpr command. You can print them as you print a plain
    text file.

    * dvi—This extension stands for text files. Files from text-contain special page
    layout instructions. You can use the -d option in order to print these files correctly.

    * tr—This extension stands for troff files. This is the standard file format for
    man pages. You can use the -t option to print out a man page.


    You know how to print with Unix, and some of the commands you can use to send
    jobs to a printer. We now need to know how to check the status of a print job,
    so that if a problem occurs it can be dealt with quickly.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Lesson 17


    My Cups Runeth Over... CUPS, or the Common Unix Printing System, also uses filters.
    CUPS is the newer model that Unix and Linux are based on, which is more standardized.


    CUPS is a modular Unix printing system that allows your system to act as a print
    server. CUPS was designed to be easier to network than standard Unix printing
    solutions. CUPS consists of a Unix print spooler, a scheduler, as well as a filtering
    system.


    When using CUPS, you will see a big advantage in that it can process a variety
    of formatted data to the print server through the use of its filters. It converts
    the print job data into the format the printer will understand. CUPS does this
    using MIME (Multipart Internet Mail Extensions) types. MIME is an Internet Standard
    for the format of email, but is commonly used in other systems to determine the
    type of file that is processed.


    Spooling A print spooler is a program that holds (stores) documents that are to
    be printed. This is the program that manages the handling of the data from the
    print requestor (you), to print device (the printer). Jobs are spooled into the
    queue where they await their turn to print.


    # The 1pq Command


    You send the job to the printer, what next? Well, the print job can be checked
    to see if it''s in the queue and being processed by the print server. After you''ve
    sent a job to the printer, especially if it is a network printer located a distance
    away, you will want to verify the completion of a job so that you know if you
    need to send it again or check for other problems.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'To check the status of a job, you''ll want to look at the queue for the printer
    to which you submitted the job. You do do this with the lq -P<printer name> command.
    Once again, if there is only a single printer on your system, you can probably
    just issue lq by itself.


    Type the following:


    | Rank | Owner | Files | Total Size |

    |---|---|---|---||

    | 1st | rob | 27 | testfile.txt | 100 bytes |

    | 2nd | erika | 28 | anyfile.txt | 30023 bytes |


    This example shows that there are currently two different jobs in the printer
    queue for pr1. One is owned by myself (rob), and the user erika owns the second.
    Each job is ranked; this shows the order in which it will print. The names of
    the files being printed are also shown, as are the size and job ID number.


    So now you know how to start a print job and check the status of it, what if you
    wanted to stop or cancel your print job? What do you do?


    # The l1prm Command


    If you send a job to a printer and it isn''t what you wanted, you can cancel it.
    This is common in times when you are rushing and you press Print and realize,
    “I didn''t want to do that.” Now, you don''t have to be a tree-killing-paper-ream-eating-user,
    and you can quickly stop wasteful 1000-page print job you didn''t mean to send.
    The l1prm command enables you to remove it from the printer queue. This is how
    you use it:


    If you need to l1prm, follow these steps:


    +   1. Use the l1prm command to find the job ID number that you want to remove.

    2. Invoke l1prm with the following syntax: l1prm -P<printer name> <job ID>.'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'For example, if you wanted to remove job #15 from the queue in the

    printer prl1, you can type


    ```

    >lprm -Ppr1 15

    ```


    To verify the results, you can use lpq to check the queue again:


    ```

    >lpq -Ppr1

    ```


    You should see the job you specified terminated and no longer active.


    That''s it for printing. As I have mentioned before, it is imperative that you

    read more about this if you really want to master printing in Unix. Unix

    printing is not difficult and can be learned simply by mastering the

    concepts brought up in this lesson, and expanding on them. Make sure

    you consult the Internet and man pages for more information on printing.


    # Summary


    In this, you learned the commands you need to print from the com-

    mand line. The suite of lpr, lpq, and lprm commands make up the basis

    for printing from Unix and most Unix computers. Here''s a review of some

    of what we covered in this lesson:


    +   * lpr and lp1—The lpr and 1p commands are used to send a file

    to the printer. If the file is a type other than plain text, it can be

    processed by a filter that correctly formats the information for

    your printer.


    +   * lpq and lpstat—When a print request is sent to the printer,

    ether from lpr or encript, it is added to the printer queue.

    Use the lpq or lpstat -t program to display all pending printer

    transactions, their corresponding job IDs, and their owners.


    +   * lprm and cancel—If you want to remove a job from the print

    queue, lprm and cancel will do the trick.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# LESSON 18

    Networking and Security


    In this lesson, you will learn some aspects of Unix remote access, networking,
    and security functionality.


    In this lesson, we will cover how to remotely access your Unix system using tools
    such as telnet and ssh (secure shell), as well as how to use FTP (File Transfer
    Protocol) to send and receive files securely. You have spent so much time learning
    how to log in and use files, it is now time to explain to you how to do it with
    other Unix systems and do it securely.


    Remote access is something that you might always see when working with Unix; very
    few and far are the times when a Unix system is not in a protected place and locking
    everyone out of accessing the console directly. Because of the nature (and cost)
    of enterprise class hardware, Unix may only be accessed through some remote access
    method.


    Remote access is just that—you want to access something remotely from where you
    are, or the system is remote from you. Regardless, it is the exact opposite of
    having a system on your desk where you can walk over and access the keyboard and
    type right into the shell prompt. Often, you will need to access this server from
    a local workstation (usually a Microsoft Windows system) and you connect to the
    Unix system with telnet or secure shell. That being said, we will spend some time
    going over those tools and others. We will also cover the use of FTP to transfer
    files and how to use a web browser in KDE.


    Well, you are almost at the end of the book and throughout we have touched on
    concepts that have helped you work with the Unix operating system to manage files,
    processes, and scripts.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 202 Lesson 18


    In this chapter, we talk about how Unix is used in the networking areas of remote
    access and what security implications may arise from doing so.


    With the proper configuration, you could spread Unix machines around the globe
    and at each your user environment, files, and programs would appear all just as
    you do at home. This is the beauty and power of networking. Let''s begin with
    using telnet.


    # Using telnet


    Using telnet is not only very common, but also a simple to use terminal program.
    It is invoked by the telnet command on just about every operating system known
    to man that is running the TCP/IP protocol. TCP/IP is a protocol suite that allows
    telnet (and most of the rest of the utilities in this lesson) to function in the
    first place. TCP/IP is beyond the scope of this book, but you should be familiar
    with what an IP address is if you are going to enter it in the next example. As
    well, it will be noted that whenever you, use ssh, which stands for secure shell.
    This protocol will provide you with encryption that can be used to secure a connection
    you would have normally made with the simple telnet program, which is not normally
    secure. Despite however insecure it is, there is still a large number of people
    out there that use telnet all the time.


    Telnet''s primary use, it enables you to open a login session on a remote machine.
    To use the telnet command, issue the command as follows: telnet <remote machine>,
    where <remote machine> is either an IP address or a hostname. You will be prompted
    with login and password prompt as if you were sitting at the console of the remote
    machine. From here, follow the lessons learned in Lesson 1, “Getting Started,”
    and you will be able to log in and use your Unix system remotely.


    ```

    > telnet 10.1.1.1

    telnet pri

    ```


    In the last two examples, you can see that it is easy to telnet to a host. You
    need only to add the hostname or IP address after the telnet command, and the
    system will attempt to establish a connection (and telnet session) with the machine
    you specify. Make sure you master this skill; you will be doing this frequently
    if you use Unix often.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Networking and Security


    IP Addressing 101 IP addressing (in its simplest definition) is a string of four
    numbers separated by periods (such as 10.1.1.1) used to represent a host (computer
    system) on the Internet. When a PC accesses the Internet through an ISP, it sometimes
    receives a temporary IP address and with that a name server assignment—something
    we will cover in more depth at the end of this lesson.


    A hostname can only be used if you have the entry in your hosts file (remember
    that file from Lesson 8, “Text Editing,” working with the vi editor) or are working
    with a name server that will allow you to specify the IP address back to you.


    # Using ssh


    If you understand the concepts around telnet and how to use it, then you will
    have absolutely no problem understanding secure shell, commonly referred to as
    ssh and invoked with the ssh command. Secure shell is primarily used to log into
    another computer over a network, to execute commands in a remote machine, and
    to move files from one machine to another as you would with telnet. The difference
    is, ssh does securely.


    There are serious flaws in the telnet program as it is based on the telnet protocol,
    which is part of the TCP/IP protocol suite. Without getting involved with what
    the suite is, remember that you had an IP address before that you needed to connect
    to a remote system. Well, IP is a protocol and it has weaknesses because the version
    of it in use (version 4) has been around just as long as Unix has. That being
    said, IP wasn''t made for your script kiddie/cracker/exploiter, and does not satisfy
    the need for greater security.


    A newer version was created to replace the older version 4, but the newer version
    is harder to implement. Also, because of the disruption it may cause, and issues
    it may bring up, version 6 of the IP protocol hasn’t'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Lesson 18


    gained the steam it should have. So, what is the solution? This is where ssh comes
    in. ssh in its simplest definition is encrypted telnet. It provides strong authentication
    and secure communications over insecure channels, namely the Internet, or your
    current network, which, believe it or not, could have a sniffer on it which could
    capture your packets and see your unencrypted data. Although this is highly unlikely,
    it is completely possible. It is a replacement for telnet and login and some other
    unsecured protocols conform to the same cleartext model. We will cover login next.
    Before we do, let''s look at how to use ssh:


    +   > ssh 10.1.1.1

    > ssh pr1


    Remember that ssh protects you only if you use it. The ssh command comes standard
    on most systems, but if you do not have it, ask your system administrator to set
    it up for you, especially if you use Unix remotely.


    > ssh Usage Using the ssh command can be tricky if you have never used it. Telnet
    is straightforward; you enter the command and specify the host. With ssh, it may
    be easy if it is set up already. If not, you may get errors back. You may also
    need to set up encryption information on your Unix system before you use it. Just
    be aware of this and ask your Unix systems administrator for help if you are in
    a jam.


    # Using login


    The login command is similar to the telnet command in that it is used for remote
    access and that it is not secure. However, there is one major difference: login
    will carry some user information along with the attempt to connect.


    If your account is good on several machines, they might be set up to enable you
    to connect between them without having to log in to each one. Try the login command
    as follows: login <remote machine>.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Networking and Security 205


    Variety Is the Spice of Life Unix students ask me, "If login is not good and we
    should only be using ssh, why is it still supported?" My answer is always to tell
    them that with everything good, there is bad, and vice versa. That''s why you
    have variety. login can also perform well. Here is an example. I have mentioned
    using ssh as a way to encrypt your remote access session, but that would only
    protect data in transit from being intercepted and read. If password sniffing,
    a common attack, took place, your data would be intercepted and your credentials
    exposed. One way to protect yourself from this exploit is to not type your password.
    The program login can be configured to not require your password. If you know
    ahead of time that you''ll be using your account from a given computer, you can
    create a file named .rosts. You can make files and edit them, and put a line with
    the name of the computer you''ll be using in that file. If you try to login using
    the listing in the .rosts file, the computer will trust the computer for your
    account you won''t be asked for your password. In effect, the computer will trust
    the other computer for your account if you list it in your .rosts. This is in
    itself a form of security, but it won''t protect you from getting your credentials
    snatched from someone sniffing the network.


    There are also security risks associated with the use of .rosts file. If the remote
    computer gets cracked into, the attacker might see this file and realize that
    she can now use that account to get into other systems. This could expose the
    remote systems. However, if you have a good Unix administrator who knows all of
    these dangers and how to do a risk assessment on which ones are more important
    to outweigh, then your system will be safe.


    ![](img/9552a570ce35faac09a770fd5ff1ede3_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 206 Lesson 18


    An example of how to use login:

    > rlogin 10.1.1.1

    > rlogin pr1


    If configured properly, you will end up in a shell prompt on the remote system;
    if you aren''t, then you will be presented with a login prompt to access the system.
    The login command, because of security problems and inherent flaws in the program,
    is rarely used and strongly discouraged.


    # Using slogan


    An alternative to rlogin is to use slogan. The slogan command is a remote terminal
    program that offers strong encryption of the data stream much like ssh. You are
    strongly encouraged to use this command if your machines don''t have ssh installed
    and configured properly. Just like rlogin, slogan functions identically to rlogin;
    but it sends your login and password information, as well as anything you type,
    over the network encrypted, not in clear text.


    To find out whether secure shell server is running, and to set up the slogan command
    (which needs quite a bit of configuration before you can use it), you are advised
    to contact your Unix system administrator. He will be more happy to tell you about
    the slogan command or any alternatives, and to help you increase system security.


    Well, up to now we have covered telnet, ssh, rlogin, and slogan. These are all
    remote access methods used to allow you to connect to a remote host, run commands,
    create scripts, and whatever else it is you do from the shell prompt such as transfer
    files from one host to another across the network.


    # Using ftp


    Now that we have learned remote access to do work at the shell prompt, what about
    other forms of remote work such as remote file transfer? Many times you will be
    called to send or receive files much like the ones you have made, or explored
    within Unix already. Remember'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# Networking and Security 207


    *.rpm packages? The tar files? All of these things can be sent to other Unix systems
    where other people can work with them or use them if needed.


    The ftp command provides you with a way to retrieve files from remote machines
    that aren''t set up to share file systems with yours. If your machine is running
    an FTP server, you might be able to use it to provide your files to the rest of
    the world as well. Contact your system administrator about this. Remember, this
    book covers only the use of Unix, so anything that needs to be added to your Unix
    system must be requested.


    To use the ftp, simply enter the command as follows: ftp <ftp server>, where the
    FTP server is the IP address or hostname of a machine running an FTP server. If
    you''ve connected properly, you''ll get a prompt for your credentials, which are
    your username and password. It should also be noted that FTP has the same inherent
    problems as telnet; the information is sent in clear text.


    Some FTP servers enable you to connect without an account on the system. For these,
    use the username anonymous and give your email address as the password.


    Let''s see how to log in with ftp:


    ```

    > ftp 10.1.1.1

    > ftp pr1

    ```


    Once connected to an FTP site, you can cd and ls your way around. Using the command
    get <filename> enables you to retrieve a file, and put <filename> enables you
    to send one from your directory to the remote system.


    > Can I Secure FTP? So, how can I secure FTP if it is not secure? The answer is
    simple. You can use Secure FTP, or SFTP for short. If you have ssh installed you
    most likely have SFTP installed as it part of the same client package. If you
    do not have you can request it from your system administrator. Another program
    that you could use is also secure copy, or scp for short.'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# Summary


    In this lesson, you were introduced to a sampling of tools that enable you to
    make use of the network resources around you and around the world. As you explore
    Unix, you''ll find that this was really only a small sampling, and that there
    are new tools for you use appearing constantly. Some will be replacements or upgrades
    for the commands outlined here, and others will be completely new. Don''t be afraid
    to try them out. Here''s a quick review of this lesson''s key points:


    +   - The telnet command can connect you to remote machines. If you have different
    accounts on different machines, you''ll probably find yourself using it frequently.

    - The ssh command can connect you to remote machines, securely. Ask your system
    administrator to set up ssh for you if you do not have it. This command should
    be used in lieu of telnet these days. It is as easy to use, plus you get the added
    benefit of security.

    - The login command also connects you to remote machines, but is more useful than
    telnet if the machines you work on are configured to allow you to login between
    them without giving a username or password.

    - The login command provides security for remote connections. If you have it,
    use it. With people breaking into Unix daily, the network is becoming a very scary
    place. Using the secure connection provided by login protects your network traffic
    from prying eyes.

    - The ftp command connects you with FTP servers, and enables you to transfer files
    around the world.

    - The sftp command connects you with FTP servers, and enables you to securely
    transfer files around the world.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# LESSON 19


    # Configuring

    Permissions

    in Unix


    In this lesson, you will learn about how to configure and manage user permissions
    in Unix.


    Wow, we have just worked through 18 lessons on how to configure Unix and we are
    still going strong. In the last part of this book, I will attempt to fill in some
    gaps in the material we just covered. For example, we talked about how the ls
    -1 command when used with the -1 option would provide a long listing of the files
    in your current directory. We briefly touched on how to read the output from the
    ls -1 command and how it had shown the set of permissions associated with each
    file or directory. Now, in this lesson, we will learn more about those permissions
    and how to configure and manage them.


    First let''s discuss the importance of configuring permissions and why this is
    important to you, the user. Unix file permissions may never be something you even
    work with, and they may not be something that you need to know to do your job.
    However, if you want to share files with other users on your system, you will
    need to know a little bit about the concept. Let''s begin by breaking it down.


    # Unix File and Directory Permissions


    Let''s examine the output from the ls -1 command. For example, type the following:'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# Lesson 19


    ```

    >ls -l

    -rw-r--r-- 1 rob rob 2024 Dec 25 20:22 39 atest.tar

    -rw-rxr-x 5 rob rob 1024 Dec 25 20:22 atest2.tar

    ```


    When considering file and directories, you have to understand the concept of ownership.
    Ownership is nothing more than noting who owns the file. Each file has information
    stored with it that identifies the account that owns it. From the example of -1,
    you can see that I am the owner of the two files in my current directory: atest.tar
    and atest2.tar. Files are owned by those who create them, although ownership can
    be transferred.


    Each file on the Unix system also has a secondary piece of information stored
    that records the group ownership of the file.


    ![](img/9552a570ce35faac09a770fd5ff1ede3_228_0.png)


    > What Is a Group? The definition of a group is not very complex, but the application
    of it is. Groups are collections of users. By allowing a group to share ownership
    of files, many people can work together on a project and have their changes immediately
    available to other members of the group. Creation of groups is a system administration
    task, so if you need a group created for a project, talk to your system administrator.


    Permissions, once applied, will control what a user (or group) can do to a file
    or directory. There are three basic actions, which are self-explanatory: read,
    write, and edit. We have already spent time covering that executables are earlier
    in the file. If you do not have the permissions such as read, write, or execute,
    then you will not be able to work with the files. It''s really simple.


    +   - Read permissions control whether someone can view a file.

    - Write allows or disallows changes to be made to a file.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# Configuring Permissions in Unix 211


    +   - Execute permissions control whether a file can be run, or executed.


    # Directory Permissions Specifics


    We just covered files, but what about the directories that hold the files? Permission
    rights for directories are slightly different than those of files. If a directory
    has execute turned off, you cannot change into that directory (using the ed command),
    view its contents, or write to it. It is effectively turned off. If read permissions
    are turned off, you can still create files in the directory and read them, but
    you cannot get a listing of what is in the directory. Lastly, if the write permission
    for a directory is turned off, you can view a listing of the contents and read
    files, but you cannot create any new files.


    # Permission Levels


    When permissions are applied to a file or directory, they are applied at three
    specific levels: owner, group, and world.


    +   - The user (sometimes called owner) permissions simply control what permissions
    the file owner has.

    - Group permissions determine what actions can be performed by members of the
    same group to which the file belongs. Your system administrator can create new
    groups, or add you as a member of a group.

    - Other (sometimes called world) permissions are for a huge group that encompasses
    all the users on your computer. For example, email-related directories often assume
    other permissions.


    If there is guest access to your computer, you can assume that any active other
    permissions apply to anyone who can access your computer.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# Using ls - 1


    In this book, we have already spent a large amount of time using the ls command
    so our coverage here will be at a minimum. In this example, we will use the -l
    option. If you run ls -1 to list your directories, you can see the owner, group,
    and associated permissions for any file. Some versions of ls won''t show you the
    owner and group simultaneously with this command. Usually, they list owner and
    group if you add the -g option, as in ls -lg.


    For an example of using ls -1, type the following:


    ```

    >ls -1


    -rw-r--r-- 1 rob rob  2024 Dec 25 20:00 atest.tar

    drwxwxrxr-x 5 rob rob  1024 Dec 25 20:22 test

    ```


    The information that we are most concerned with dissecting is the first, third,
    and fourth columns. The first column identifies the owner, group, and other permissions
    that are active for a file or directory. The first character is a d if the file
    type is a directory. In this example, I have a test directory I created with the
    mkdir command. Normally this is a - for a normal file, which you can see for my
    atest.tar file. The remainder of the characters, as you might guess, stand for
    read (r), write (w), and execute (x). The first three characters (following the
    initial - d character) are the owner permissions, the second three characters
    and the last three are other permissions. It is important to memorize these settings,
    because this is how you know secure your file or directory. This tells you what
    the world can do to your files, such as change or delete them if the permissions
    are too generous. Moving on, we see the third column is the file owner, me. The
    fourth column is the group owner, which is again me. The rest of the information
    is simply the size of the file, the date of creation, the time, and the name of
    the file or directory.'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# Configuring Permissions in Unix 213


    # Using chmod


    Now that you know permissions are, you probably want to know how to change them,
    because listing them can only get you so far. Listing them will help you to get
    a good grip on what is there, but to make changes you need to take the next step,
    which is to use the chmod command. There are two modes of operation that you can
    use with chmod: a quick-and-dirty mode, and a more user-friendly mode of setting
    permissions.


    The user-friendly mode uses easy-to-remember commands to set or unset permissions.
    To use this, do the following:


    +   1. **Pick a permission level.** If you want to set permissions for the owner,
    the level is u. If you want to change permissions for the group, it is g. For
    other permissions, choose o. Lastly, if you want to affect all the levels of permissions
    (owner, group, and other), use a.

    2. **Choose an operation.** Decide whether you want to set (turn on) or unset
    (turn off) a particular level of permission. If you want to set a permission,
    the operation is +; if you want to unset a permission, it is -.

    3. **Choose the permission itself.** If you want to operate on the read permission,
    choose r, for write choose w, and for execute x.

    4. Issue the chmod command in this manner: chmod <permission level><operation><permission>
    <filename> <filename>


    Let''s look at an example of chmod in action. It is important that you pay close
    attention to this lesson and to walk away with this knowledge you are moving from
    end user to system administrator. Not knowing how to set permissions will almost
    always ruin your chances for advancement because you will not be able to do anything
    without knowing how to change permissions.'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# Lesson 19


    The chmod command sets Unix file permissions exactly how you want them, so let''s
    take a look at how. First you need to be connected to your Unix system. Because
    you will not always be on a local system, you may need to connect to a remote
    system, log in, change some permissions, and then exit the session using telnet
    or ssh. Once the shell prompt, you need to execute a chmod command. Here are some
    examples of what you can do with the chmod command:


    ```

    > chmod 0755 script.sh

    > chmod 755 script.sh

    > chmod u=rwx,ox=rx script.sh

    ```


    Let''s look at a real example. To activate group permissions for the script.sh
    shown here, type the following:


    ```

    -rw------- 1 rob test 1662882 Dec 25 12:00 script.sh

    >chmod g+w script.sh

    ```


    To see if it worked, you can run ls -l on the filename as follows:


    ```

    >ls -l script.sh

    -rw-rw--r-- 1 rob test 1662882 Dec 25 12:00 script.sh

    ```


    Write permissions have been activated for the test group members. Because of its
    symbolic nature, this method for adjusting file permissions might be easy for
    some; however, there is another syntax that you might find more efficient and
    effective. In this example, you can set the actual mask that is used to control
    a file''s permissions. The bit mask would be the three binary bits used to represent
    each level of permission. The three binary bits would be (in order from left to
    right):


    +   - 1st bit: (start from the left) controls read


    +   - 2nd bit: controls write


    +   - 3rd bit: controls execute


    There are your three permissions, and now you can view our example as binary numbers
    translated to decimal:


    100 - Read permission - The decimal equivalent of this binary value is 4.'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Configuring Permissions in Unix


    010 - Write permission - The decimal value for write is 2.

    001 - Execute permission - The decimal representation is 1.


    So this is the layout, and you would need to understand the concepts of Boolean
    math a bit, but if you don''t, Table 19.1 will serve you well:


    # Table 19.1 Permission Bits


    | 3rd Bit | 2nd Bit | 1st Bit |

    | Read | Write | Execute |

    | 100 | 010 | 001 |

    | 4 | 2 | 1 |


    To figure this out you need to know how binary numbers are converted to decimal.
    You need only know how to convert the first three numbers. Moving from right to
    left, start to count from 1 and move up by the power of 2 each time, so you would
    have 1, 2, and then 4, correct? If that is the case, then you need to know that
    if you took the bunch of three 001 and counted from right to left to say that
    0 is "off" and a 1 is "on," the first count from right to left by 1, 2, and 4
    would be 1. Now take the next example—010. This is one two because the middle
    column in our example of 1, 2, 4 from the right to left would mean that 0 is off
    (so no 1), 2 is on, then 4 is off. Get it now? How about the last one... 100.


    With this example, you can quickly figure out the decimal number you need to use;
    instead of setting permissions the other way, you can specify them as such.


    Using this technique, you can easily set multiple permissions Using this technique,
    you can easily set multiple permissions simultaneously. For example, it''s easy
    to see that 110 is the combination of the read and write permissions. The decimal
    value of this binary string is 6 (4+2). I now have my setting for read and write
    permissions. To use this method of setting a file''s permissions, you set permissions
    for owner, group, and other simultaneously. Each of these digits is the sum of
    the permissions that you want to set. The first digit is the owner, the second
    is the group, and the third is other.'
  merge: -1
  img_proc: true
- pgno: 234
  md: 'Example, suppose that you want to to set the owner to have full permissions,
    and the group and other to have read and execute permissions. Full permissions
    are achieved by adding all the permission values (4+2+1=5). Read and execute permissions
    are a combination of 4+1=5. The three numbers you''ll use to set this are 7, 5,
    and 5, entered as a single three-digit number, 755. The syntax for this form of
    chmod is as follows:

    chmod <permissions> <filename> <filename> ...


    For example, check out the following:


    ```

    >chmod 755 script.sh

    >ls -lg script.sh


    -rw-r--r-- 1 test 1663882 Dec 25 script.sh

    ```


    As you might hope, the owner has full read, write, and execute permissions, whereas
    the group and other have read and execute permissions. As you become experienced,
    you''ll probably find that this second method is the fastest way to set permissions.
    Just remember (4), write (2), and execute (1), and you''ll be fine.


    > Changing Permissions Recursively If you want to change the permissions of all
    the files and directories within any directory, you can use the -R option with
    the chmod command to recursively change everything within a directory.

    This example performs recursive chmod for the directory:

    > chmod -R 755 somedirectory


    You should feel comfortable with changing permissions if you understood everything
    completely, and no fear if you didn''t. This is why I harp on practice so much,
    to make sure that you will keep doing this until you can read permissions and
    their placement every time you run the ls -1 command.


    Now that you are familiar with all these difficult concepts, let''s build on them
    to show you how to change a group setting.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# Configuring Permissions in Unix 217


    # Using chgrp


    Although you can''t change a file''s owner, you can change the group that a file
    belongs to. You can do this with the chgrp command. chgrp is a Unix command used
    to change the group setting. The chgrp command stands for "change group." The
    chgrp command marks a file as part of a different group. To do this, however,
    you must be a member of that group. Your Unix system administrator has the capability
    to create new groups and add users to these groups. If you have any questions
    about your own group membership(s), ask your administrator how your account was
    configured.


    To use chgrp, follow these steps:


    +   1. Choose the file or files you want to change.

    2. Determine which group the file now belongs to.

    3. Change the file''s group using the following command: chgrp <group> <filename>
    <filename> ...


    For example, type the following:

    >chgrp admins script.sh

    >ls -lg x script.sh


    ```

    -rwxr-xr-x 1 rob 1463882 Dec 25 12:00

    (output removed)

    ```


    The script.sh file now belongs to the group admins. Members of the group have
    read and execute permissions for the file. The most obvious use for chgrp is if
    you are collaborating on a project. If you create a file that you want to share
    with many people, you''ll need to change the group of the file to one all the
    users belong to.


    > Be Careful with What You Change Be careful when setting permissions. If you
    change something too drastically, you can really get into trouble. Changing permissions
    can also lock you out of something, so be careful using this lesson in a production
    environment if you are just learning Unix. Consider what can happen, for the worse.


    ![](img/9552a570ce35faac09a770fd5ff1ede3_235_0.png)'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# Summary


    One more lesson to go! You have come a long way from just logging into Unix to
    now setting permissions on files and directories. You should be very proud to
    be a Unix user with solid skills learned entirely from scratch. In our next lesson,
    we will wrap up the book with a few high-end commands that you can experiment
    with and incorporate into your other lessons, such as scripting, for example.


    In this lesson, you learned the purpose of permissions, owners, and groups, which
    is very important to know if you want to do more than just list data in a directory.
    Now you can read that list and understand how access to and how to set that access
    if needed. You now know how to do this not only by setting permissions but also
    changing the group on the file or directory as well. You now understand what is
    necessary to enable other users to find out how she has decided to collaborate
    on projects using group permissions. You might want to take a few minutes to talk
    to your system administrator to find out she has decided to manage groups. Also,
    you might want to request that groups be created that include other users with
    whom you want to share files.


    Following is a look at some of the highlights from this lesson:


    +   * Permissions—File permissions control who can access a file, and what level
    of access they have to a file. The three levels of permissions are read, write,
    and execute. These permissions can be applied to the owner, group, or other.


    +   * chmod—The chmod changes the permissions for a file or directory. There are
    two methods of operation: symbolic and numeric. They both accomplish the same
    thing, so use the one you feel comfortable with.


    +   * chgrp—You can change the group that a file belongs to with the chgrp function.
    You can change only the file to a group that you belong to.'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# LESSON 20

    Unix

    Privileged

    Commands


    In this lesson, you''ll take a look at some of the restricted commands that Unix
    system administrators use, and learn some of the other things you can do with
    your Unix system.


    In this chapter we celebrate you not only for reaching the end of the book (congratulations!)
    but also welcome you to the “power-user” ranks. If you have successfully navigated
    through this book and have been practicing so that you can recall all the commands
    and some of their options that we learned about, then you are ready for the next
    step.


    The commands in this section are restricted commands that are mostly used by Unix
    system administrators. It doesn''t hurt to know about them and how they work so
    that if you are interested, you can dig deeper into them and start on the path
    to being a Unix system administrator. If not, knowing these commands surely puts
    you at the advantage knowledge is power. Just fill your brain with as much as
    you can, and before long you will be typing commands quickly and know exactly
    what it is you are doing.


    In this lesson, I open the doors to a few new concepts and hope that after this
    lesson is done, you are efficiently tying the learned commands and their proper
    options in the shell prompt with no problems.


    For those who may have forgotten about root, let''s quickly discuss it.


    # Root Refresher


    In this lesson, we discuss commands that are used only as root. So we are all
    on the same page here, let''s go back over what root is. It is critically important
    you know root and it does have two different meanings.'
  merge: -1
