    hosts.deny

    ```


    Since my query looking for host*, everything that starts with the word will be
    shown with whatever comes after it because of the use of the wildcard. You can
    then cat your files to see which one is relevant for use.


    >cat host*

    This will show you more output than you can possibly even read. We will now move
    on to managing what you view in a better way, so you can actually read the data!
    You can use pagers to slow down the output to make it readable.


    # Making Output Readable with Pagers


    The cat command is fine when you just want to quickly show some information, but
    what about large files that scroll past a bit too quickly to read and you now
    can''t read them? There is a way to slow down the output of a command like cat,
    so you can read the data at your speed. Viewing pages one at a time is done with
    the concept of pagers. Files that scroll the screen will be useless if you need
    to read the beginning of the file. If the file''s size is larger than what can
    fit on the terminal screen or in your history buffer, you are out of luck. Files
    are often large enough to do this, and you will still want to read those files.
    You can use more and less Unix commands. People often refer to more and less by
    their generic term: pagers. Let''s take a quick look at how to use these command-line
    tools.'
