    this will not be difficult, and will show you the way REs are used. These are
    the two rules you should try to commit to memory when using these characters:


    +   * If ^ is outside of a range, the ^ character matches the start of a line.


    +   * matches the end of a line. If your pattern falls at the end of a line, you
    can anchor it in this position with $.


    For example, examine how this is done:


    ```

    >grep ^[7-8][0-9]* robtest.txt

