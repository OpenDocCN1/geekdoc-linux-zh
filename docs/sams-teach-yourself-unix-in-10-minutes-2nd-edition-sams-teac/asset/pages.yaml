- pgno: 102
  md: '“Regular Expressions,” when we cover regular expressions, you should put this
    * symbol (known as the asterisk, or wildcard) to memory, as you will most likely
    often use this command when working with Unix.


    Now that we have mastered file creation and deletion, as well as directory creation
    and deletion, you should learn what combinations are commonly used and helpful,
    as well know the answers to the most commonly asked questions: Why would I make
    a directory empty before deleting it? Couldn''t I delete the directory with the
    files in it? Yes, you may do so with the rm -r (recursive) command.


    ![](img/9552a570ce35faac09a770fd5ff1ede3_102_0.png)


    > What Is This? The Same Command? Just like the remove files command, the recursive
    command is pretty much the same command—it just does something when used in a
    different context (as in the context of directories), not files. When used this
    way, you can recursively remove all of the contents within that directory you
    specify.


    # The rm -r Command


    Removing files and directories at the same time can be done when using the rm
    -r command specifying a directory instead of a file. The rmdir command will only
    work on empty directories, so you will need a way to remove the directory and
    any contents that may be within it. When you need this functionality, the rm command
    in recursive mode can be used.


    To delete a directory and all its contents, do the following:


    +   1. Find the directory you deleted.

    2. Issue the rm command as rm -r <directoryname>.


    When you issue this command, you will be able to specify the directory you want
