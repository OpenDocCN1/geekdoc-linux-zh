    # Working with the GUI


    Like desktop environments, KDE includes the capability to customize your desktop
    environment just as you do under Windows or any other desktop operating system.
    Some form of alteration is allowed depending on your permissions. You can set
    items such as the background wallpaper for your viewing pleasure, screensavers,
