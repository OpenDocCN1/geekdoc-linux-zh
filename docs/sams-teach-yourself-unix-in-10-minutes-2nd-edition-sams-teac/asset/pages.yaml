- pgno: 103
  md: 'If you delete a directory you are currently in, you may get error messages.

    These may be fixed easily by moving to a known good directory, such as your home
    directory, symbolized by the tilde. The command you can enter to get back to home
    is cd -/.


    Wow, think about how you have come! Not only are we navigating the Unix shell
    prompt, we are actually making and removing data from the Unix system, as well
    as becoming familiar with how other commands tie in the process. Now we will learn
    how to copy files from one location to another.


    # The cp Command


    When you want to make a copy of a file, you can use the cp command.

    The cp command will allow you to copy a single file to a new destination file,
    or copy one or more files to a single destination directory. This file operation
    will come up many times in your workings with Unix. It''s uncommon to make copies
    of files you are working on. If you wanted to make a quick backup copy of a file,
    this command could help you do that.


    To use the cp command to make a copy of a single file, follow these steps:


    +   1. Determine the source filename, and the destination filename to which you''d
    like to copy the file.


    +   2. Issue the cp command as cp <sourcefile> <destinationfile>.


    There will be times where you may not just have one, but perhaps a dozen files
    you want to send to a particular directory. To do this, you would issue the cp
    command with the multiple files listed to one directory.


    To use the cp command to copy multiple files to a destination directory, you would
    change the command as follows:


    +   1. Issue the cp command as cp <sourcefile1> <sourcefile2> [...] <destinationdirectory>.'
