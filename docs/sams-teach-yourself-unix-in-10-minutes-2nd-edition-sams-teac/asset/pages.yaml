- pgno: 155
  md: '# # LESSON 11

    # Managing Processes in Unix


    In this lesson, you will learn how to work with Unix’s internal processes.


    In this lesson, we will continue to unleash the power of Unix by learning to work
    with processes. All the tools we have worked with in the first 10 lessons create
    processes on your Unix system. In other words, if you use a command that starts
    an email client on your Unix system (such as sendmail), you have started an internal
    process within Unix that runs to support the email client. Each command used in
    Unix creates a process that the Unix operating system runs until it is finished
    or killed. The word kill refers to ending a process in Unix.


    > What Is a Process? In the dictionary, the term process can be defined as a procedure
    or a particular course of action intended to achieve a desired result.


    In computer terminology (namely, in your Unix environment), a process is a single
    executable module (also known as a code or program) that runs concurrently with
    other executable modules.


    Unix is flexible. You can create processes that run entirely in the background
    or start and run in the middle of the night without needing to be logged into
    the computer. In this lesson, we will learn how to use Unix to start and stop
    processes. We will also learn commands that help automate processes. Automation
    means that you do not have to manually input a command; it can be done automatically
    by a tool (such as at) to help ease your workload.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# Multitasking


    In this section, we will cover what is known as multitasking and how it works
    with Unix. Multitasking is the capability of a CPU (central processing unit),
    which is the brain of your Unix system, to handle more than one operation at a
    time. For instance, the capability to run a word processing tool and an email
    client at the same time without crashing your computer would be considered multitasking.
    Unix allows you to multitask in that lets you run more than one process at a time.
    Remember, with Unix, every command or program that you use is considered a process.


    # Background Processes


    Many times you will want to run on your Unix system but you won''t want to see
    or use it while it is running. Having this process in the foreground will only
    cause you to waste time watching something that could be taking place without
    your input. In this situation, you want to run a background process. Whereas a
    foreground process remains in the foreground and usually takes many of the resources
    available on your system, a background process can run largely without your intervention.


    Making a command run in the background is simple; you simply add an ampersand
    (&) to the end of the line containing the command. For example, you could use
    & to run the cron or at commands in the background. The cron command is used for
    scheduling jobs to be executed regularly after a designated period of time. The
    at is for executing commands once at a single specified time. These commands will
    be discussed in greater depth later in the lesson.


    # Using Ctrl+z and bg


    In Unix, you can stop any process that is running by pressing Ctrl+z. Suspending
    a command and moving it to the background is another story. If you want to do
    this, you must be familiar with Ctrl+z as well as another command: the bg command.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Managing Processes in Unix 139


    To turn any process into a background process, first press Ctrl+z to suspend the
    process if it is running and you did not enter an ampersand following the command.
    Consider the following example:


    ```

    Ctrl+z [10]+ Stopped at 2

    ```


    Here, at command has been suspended and assigned job number 10.

    The process ID (PID) (as shown with the ps command) is a number used by the kernel
    to keep track of every process running on the system. This is not the same as
    the job number. The job number will identify the process locally in your session,
    not globally to the system.


    > PID Versus Job Every process running on a Unix system is assigned a unique PID.
    Every process you start is also assigned a job number. The job number is only
    unique to your current session. If you open a Terminal and start a command, the
    first command will often get the job number 1. If you open a different Terminal
    and start another process in that, process may also get the job number 1. Using
    the job number in either terminal will only affect the process started in that
    terminal. Thus PIDs are used globally across the entire system to keep track of
    processes, whereas job numbers local to the specific session in which they started.


    To move the suspended process to the background, you only need to use the bg command
    and add the job number directly behind it. In the case of our example, the command
    would look like this:

    bg %10


    As you can see, the background command is easy to use and helpful if you want
    to run multiple jobs while still being able to control and work with Unix.'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# The fg Command


    Just as you can send processes to the background, you can also bring them back
    to the foreground. This is done by using the foreground (fg) command. Let''s return
    to our example. If you wanted to bring the at back to the foreground, you would
    simply enter the following:


    ```

    fg %10

    ```


    With the fg command, you can quickly bring the process you want to work on the
    foreground. When you are done working with this process, you can send it back
    again with the bg command.


    # The jobs Command


    When working in Unix, it is easy to forget what local processes are running. Say
    you need to bring a background process to the foreground but you don''t know the
    job number you need to select. Here, the jobs command will show you what the job
    number is if you have forgotten it. Simply type jobs at the shell prompt and you
    will be shown the ID numbers for any processes you started or stopped.


    +   > jobs


    The jobs command will also provide you with a history of sorts; using this command
    will list all previous process that have been started and stopped.


    We now come to one of the most important commands in this lesson: the ps command.


    # The ps Command


    The ps command will list your current processes. You can also run processes with
    this command. The ps command is helpful because once you start using the background
    capabilities of Unix, at some point you will need to find out what all you have
    running. After all, if you continue'
  merge: -1
