    # # Using uencode/uudecode


    To send your files to another person through a tool such as FTP (stands for Transfer
    Protocol) and efficiently transfers files from a source to a destination) or through
    email, you may need to adjust things. For instance, you may need to send an email
    to a Macintosh user who uses Binhex. This is just another encoding scheme. Because
    of this, you may have to change the specification of the data you send in your
    email attachment. This is not common for users who are accustomed to using Windows,
    although within Windows also uses uencode. Long story short, it is imperative
    as a Unix user that you know how to adjust this because you may have to specify
    it with Unix.


    ![](img/9552a570ce35faac09a770fd5ff1ede3_152_0.png)


    > Uen-what? Uencode stands for a set of algorithms for converting files into a
    series of 7-bit ASCII characters that can be transmitted over the Internet. Originally,
    uencode stood for Unix-to-Unix encode, but it has become a universal protocol
    used to transfer files between different platforms such as Unix, Windows, and
    Macintosh. Uencoding is especially popular for sending email attachments. Nearly
    all email applications support uencoding for sending attachments and udecoding
    for receiving attachments.'
