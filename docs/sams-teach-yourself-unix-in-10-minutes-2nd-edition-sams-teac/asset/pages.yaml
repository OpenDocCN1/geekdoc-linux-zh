    # Summary


    This lesson taught you about the background of graphical user interfaces in general
    and the X Window System in particular. The use of xinit and other system programs
    and utilities was also discussed. This lesson also covered how to customize your
    user environment. It ended with a description of window managers and desktop environments
    such as KDE.


    +   - The X Window System is based on a client/server model.

