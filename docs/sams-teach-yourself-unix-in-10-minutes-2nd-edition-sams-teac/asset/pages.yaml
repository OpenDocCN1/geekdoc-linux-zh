    #  Summary


    In this lesson, we looked at how to modify your user environment and what is needed
    to customize it. Although we skimmed only the surface, you should feel comfortable
    enough to make some configuration changes on your system. You are also advised
    to practice these on a system where harmful changes won’t cause too much of a
    problem. Use a lab whenever you can.


    The following was covered in this lesson:


    +   Environment variables are always uppercase, and preceded by $. This is how
    they are identified as variables.


    +   Environment variables are frequently used for specifying single configuration
    options to a program, such as providing a pointer to a directory that the program
    needs.


    +   The $PATH variable keeps track of where the system searches for commands when
