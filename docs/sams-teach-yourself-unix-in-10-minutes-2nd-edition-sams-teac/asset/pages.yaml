- pgno: 84
  md: '![](img/9552a570ce35faac09a770fd5ff1ede3_84_0.png)


    # # LESSON 5

    # File System Navigation# Techniques


    In this lesson you will use Unix to find files both at the shell prompt and with
    KDE.


    Now that we have learned to navigate the Unix file system by changing directories
    and being able to list their contents, we need to learn how to search within the
    entire Unix file system for data based on our own queries. Imagine having to hunt
    for individual files that you may think be on your system. For example, what if
    you had an old spreadsheet on your system that you now need to use? Having created
    it five years ago, but you remember a portion of its name, can''t recall where
    you saved it, This is where Unix''s built-in help system comes into play.


    In this lesson we will cover how to use the internal power of Unix to quickly
    locate data instead of having to manually search for it. When you are in a situation
    in which you know the name of a file but not know where the file is, commands
    such as grep and find can help you gather the required information. Rather than
    using the cd and ls commands to search through the entire file system for data
    that may be located on your system, you can use other commands that will help
    you locate data. You can then go to that directory and list its contents. Let''s
    start our discussion with the find command.


    # ## Using the find Command


    When you need to find a file on your Unix system, you will need to know exactly
    where it is located (navigate to it directly), or you may have to run a search
    on it because you aren''t entirely sure what you are looking for. In either case,
    to locate a file on your system, you will need to know something about the file.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'To find a file by its name, you will need to know a portion of the name.

    The more of the name you give, the quicker the search will be because that will
    narrow down the results. You can use wildcards to specify unknown characters.
    This same functionality can be seen in just any other operating system, especially
    in Microsoft Windows. You can specify more than one file with a path using wildcards.
    A wildcard is a character that matches many characters. The * wildcard matches
    any number of characters. A wildcard will be explained more thoroughly and used
    in other (and more detailed) examples throughout the book.


    If you do not know the name or part of the name, you will need to know something
    about the file. Things that can be used as searchable criteria include creation
    date and the size of the file. The find command can then be used to build up matches
    to the query you construct and execute to find the data you need. In the next
    exercise we will learn how to use the find command.


    To search for a file by name:


    +   - Before you search for a file, you have to have an idea of what you want
    to search for; therefore, specify the filename or some of its searchable criteria.
    Remember, you can include wildcards in the search for the filename.


    +   - Next, select the directory you want to search. The starting directory will
    be /.


    +   - This command would appear as find <starting directory> name <filename>.print,
    or if you wanted to find a specific file in the root directory, it would appear
    as follows:


    ```

    >find / -name *.rm -print

    /var/lib/Yast2/you/mnt/i386/update/9.2/deltas/kernel-source-2.6.8-24_24.i386.rpm

    ```


    > Find Files...Now What? If you ask Unix to search for a file and do not tell
    it to print the results, Unix may find your file and tell you nothing about it.
    In most distributions of Unix, you will have to specify -print.'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'In this example, we searched the root directory for RPM files. RPM files can
    be used for installations and updates on your Unix or Linux system. This search
    method can be handy if you are unsure where to look for something you may need,
    or you you want to save time by running a search to find files instead of hunting
    and pecking for them yourself.


    # ### Handling Error Messages  As you continue your search through the Unix system
    for files, you may encounter small problems, such as not finding your file at
    all, or you may get a message stating a problem or issue you need to be aware
    of. In this example, we see that there is an issue with finding the CD-ROM and
    floppy medium.


    ```

    find: /media/cdrom: No medium found

    find: /media/floppy: No medium found

    ```


    This happens to be a common error; it''s simply telling you that there was nothing
    found within mounted drives.


    Other errors you may encounter can range from problems accessing directories that
    do not have permission to search, to completely obscure things that only senior
    Unix administrators may see. Always ask your system administrator for help if
    needed.


    > Learn How to Break In Be careful when searching; you don''t want to query the
    entire file system for something too generic, because you could be waiting a long
    time for results to print on your screen. If you are stuck, you can try to break
    the sequence with a keystroke such as [Ctrl+C]. If this does not help, see your
    system administrator.'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Finding a File by Its Date


    In some cases, you may not be able to recall what a file is named or what its
    extension is, but you may know what day you created it. Creation date is another
    searchable criterion that you can select. To search, you will need to adapt a
    “how many days ago” mentality because Unix will search for files that have been
    made since the time that you specify. Let’s look at an example:


    +   1. Determine how many days ago your file was made.

    2. Choose a starting directory for the search.

    3. Use the find command with the -ctime option: find <starting directory> -ctime
    <how many days old> -print.


    For example:


    ```

    >find ~/ -ctime 5 -print`

    ```


    This command specifies that Unix should find a file in your home directory that
    is less than five days old and print it to the screen.


    Now that you know how to find files using their creation date, let’s learn how
    to find files by their size.


    # Finding a File by Its Size


    In the previous examples, you used the find command to search for a file based
    on a specified location and to find a file on its creation date. Both are good
    examples of searching for a good reason—you don’t know where the file is! But
    why would you search for a file by its size? It may be easy to remember a name
    or or when you worked on a file, but its size?


    Believe it or not, there will be many times you need to search a system for a
    file by its size. One great example is if you are a web designer and have large
    graphics files on your Unix system. Here, it’s a great bet that these files will
    be larger than your word processor documents or spreadsheets.'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'To search by size, use the following steps:


    +   Select a target file size, and find will locate all files of the selected
    size and larger.


    +   Choose a starting directory.


    +   Start the find program using the -size option: find <starting directory> -size
    <k> -print.


    For example:


    ```

    find -size 1024k -print /home/rob/updates/testgraphic.jpg

    ```


    The find command you see here has located a graphics file that is larger than
    1,024k.


    > What Else Can You Find? The find command is powerful. As you can see, using
    the find command with the -name, -ctime, and -size options can be helpful, but
    believe it or not, there is more.


    Remember, Unix, the power is at the command line. Use the man pages (as discussed
    in Lesson 2, “Getting Help”) to learn other helpful options.


    # Finding Data with Other Unix Commands


    In the previous section of this lesson we learned about the find command. When
    used, it can be powerful. Other commands you can use are whereis and which, and
    these commands may bring you results as well.


    # The whereis command


    The whereis command can be used to run a quick search on a specific number of
    directories for whatever you specify. For example, if you wanted to run a search
    on a file named “test”, then you would get all'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'instances of “test” that came up within preset number of directories, such
    as paths to source code, binaries, and man pages. The딨 command performs a quick
    search for the file you specify.


    ```

    >where test

    test: /usr/bin/test /usr/share/man/man1/test.1.gz

    /usr/share/man/man1p/test.1.gz

    ```


    Although this may not exactly what you are looking for, this command can be useful.


    # The which Command


    Another useful command is the which command. The which command can help you find
    files that are specified in your PATH environment variable. This was covered earlier
    in the book and will also be covered in Lesson 16, “Modifying Your Environment.”
    This means that unless your data is specified in a location (such as a directory)
    within that PATH statement, you will not find it with use of the which command.


    The which command is not useful in this scenario, but does not mean that it can’t
    be helpful. You may need to edit a file that you absolutely know is in your PATH
    statement and use it to recall it quickly.


    # The grep Command


    One of the most commonly used (and known) Unix commands is grep. Learning how
    to use grep will help you find files that contain a word or pattern. When the
    grep command is used properly, it can help you search through a file for something
    specific. For example, what if you wanted to search for a file for a unique term?


    When we talked about finding data on your Unix system, we narrowed the search
    down to different variables, such as the size of the file or the creation date.
    You can also narrow the search with grep.


    You will learn that grep is one of the most powerful built-in programs in Unix.
    The program grep is also subdivided into more commands: grep, egrep, and fgrep.
    These three commands differ in'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'what regular expressions they can handle. A regular expression is a pattern
    that can match various text strings. Regular expressions define a pattern of text
    that can be used to search files when a specific word or phrase to be searched
    for might not be known. To use grep.


    +   1. Choose the word or phrase you want to find.


    +   2. Find the filename you want to search.


    +   3. Type grep <pattern to find> <file or files to search> at the shell prompt.


    For example:


    ```

    >grep "test" *.html

    index.html:you passed the test

    ```


    In this example, we see a quick grep of the word test in any file that resembles
    an HTML-based file. The grep command is a tool that will become even more valuable
    when you learn more about regular expressions.


    # Using the KDE Find Feature


    If you are using the graphical user interface (GUI), then you will likely be using
    KDE. If so, then you can quickly search for files in KDE as well.


    By going to the main menu and selecting Find, you will open a dialog box.


    Once you use the dialog box, it should be self-explanatory. Instead of adding
