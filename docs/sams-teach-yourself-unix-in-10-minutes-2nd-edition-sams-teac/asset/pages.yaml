- pgno: 43
  md: '# Graphical Help (Using KDE)


    SuSE is one of few software companies that still provide printed manuals that
    try to help users once they move beyond installing the product.

    Buying the boxed version of SuSE Linux Professional give you thick books: the
    Administration Guide and the User Guide, which can both be found online. These
    books have a fairly easy-to-read style that will have you using the product in
    short order. These books can also help you Unix/Linux.


    The SuSE Help Center (covered in the following section) is basically a copy of
    the same documentation built within the system and found by simply clicking an
    icon on your desktop.


    # Searching the Help Center


    Open the Help Center by typing suhelp from the shell, or click the life-preserver
    icon in either the KDE or GNOME. Both will open the Help Center for you to peruse.


    Once in the Help Center, take a look around to see whether the there resembles
    the help you would expect to see in the man pages. You will find that both the
    graphical and text-based versions of help are useful in assisting you to work
    and learn Unix.


    # Additional Documentation


    When Unix in the workplace, you should have a system administrator who is in charge
    of the Unix system and who may operate it. This staff member should already have
    documentation set up for the Unix system he or cares for. This includes disaster
    recovery and security logs and other forms of documentation, such as maps or logs.


    Another handy source of information that many systems administrators have exists
    in the form of a handbook that is usually given to new users on the network. Ask
    whether one exists for the Unix system you are working on. This handbook may provide
    you with another source of information that you can learn with and utilize.'
  merge: -1
