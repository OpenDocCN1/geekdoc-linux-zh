- pgno: 110
  md: '# Lesson 6


    In the next lesson we will learn how to read files and continue to build our Unix
    file management and navigational skills so that you can work with Unix more productively.


    In this lesson you learned a set of flexible set of Unix commands that will allow
    you to manage the data stored on your system.


    The following is a quick review of this lesson:


    +   - touchThe touch command sets the modification date of the file to the current
    time. This has the effect of creating new empty files if you need them.


    +   - rmThe rm command removes files. Use the rm -i option until you are quite
    certain you know what you are doing, and then keep using it for a while longer.
    Recursive rm running in non-interactive mode can wipe out your entire disk.


    +   - cpThe cp command copies one or more files. Although a slight oversimplification,
    it''s easiest to remember that if you start with a single file, your destination
    needs to be a single file; if you start with multiple files, your destination
    must be somethingthing that can hold multiple files (such as a directory). You
    can also copy a single file to a directory if you want to.


    +   - mvThe mv command works a lot like cp, only it renames or moves files. The
    mv command cannot move directories across physical hardware boundaries, so every
    and then Unix''s hardware abstraction fields fail with this command. If this happens,
    look to the cp command for help.


    +   - lnThe ln creates alternative names by which a file or directory can be accessed.
    It''s convenient for times when you need one file to appear in several different
    places, or when you need to make information that comes from different files at
    different times all appear under the same filename.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# LESSON 7


    # Reading Files


    In this lesson we discuss how to read files located on your Unix system.


    We will continue to learn about file management and continue to build upon the
    concepts learned in earlier lessons. In this lesson we will look at a few handy
    commands that will help you read data within a file. That doesn''t sound too exciting,
    now does it? Well, actually it is exciting, because if you haven''t used Unix
    for file management (or in a limited manner), you may not want to go back to anything
    else! In Unix, you have the power to look at the last entries in sections. For
    example, if you have a security log on your Unix system that must be read every
    morning, you can use a particular command to look at the last entries in the log.


    You know how to manage files—that was the hard part to learn; now we just need
    to know how to read the data you have stored on your Unix system without a GUI-based
    text editing tool or a word processor. In this chapter we look at some helpful
    tools that take only a second to use and increase your productivity. You will
    be spending less time working within a cumbersome GUI, because you can just type
    a quick command like cat and have the information you need in seconds.


    # The cat Command


    When learning Unix, it''s common to first learn the cat command. An easy abbreviation
    to remember if you are pet friendly, this command will concatenate the elements
    you specify into one package. The easiest way to look at files is to use cat,
    the concatenate command.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# Concatenated, What''s That? Most words in the computer industry can be overwhelming
    to learn because of what you hear is acronym based, defined in a complicated way,
    and so on. In this case, the word concatenate is nothing more than the theory
    of combining elements for efficiency sake.


    In Unix, we use concatenates because Unix has the capability to string or place
    two or more files to create a single file. Data elements (strings) and contents
    (files) can be combined together into one element or file. Think of concatenation
    as the ability to combine things together for ease of use.


    The cat command is a byproduct of this definition. The cat command will allow
    you to concatenate all data specified together into one package.


    Now that you are comfortable with the definition and what cat does, let''s look
    at the operation of the cat command. Now, there are a couple of ways to use the
    cat command. We will look at it in the light of reading files and will touch on
    it in Lesson 12, “Input and Output,” later in the book. Until then, let''s focus
    on using cat to read files on your system.


    To display a file, just supply cat with the file(s) you want to see. If you want
    to see how powerful Unix is, cat a file like the b1.jpg (JPEG file). Unix will
    look inside and report back to you. Unix will report in a language you can''t
    read or understand, but this shows that Unix is literal in everything you ask
    it to do. Unix will do it or crash and die trying!


    One example that I am sure you will be able to find on your system your hosts
    file located in your /etc directory. I have left out most of the output as the
    hosts file can be large, but this is exactly one of the main benefits of it didn''t
    need to do anything but specify the cat command and either the directory (if I
    am not in it) and the file.'
  merge: -1
  img_proc: true
