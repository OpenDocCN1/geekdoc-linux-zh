- pgno: 143
  md: '# LESSON 10

    Compression and Archiving Tools


    In this lesson, you will learn about common Unix tools for compressing and archiving
    files, as well as a few tools you can use to keep tabs on your disk usage.


    # Managing Files in Unix


    When you send files across the Internet through email, update your website, store
    files on a home-based intranet, or play movies on your computer, you are working
    with data that takes up space on your system. Regardless of what system, Microsoft
    Windows, Apple Macintosh, Unix, or Linux, you will need a spot to keep all this
    information you want to store.


    This data is kept in storage space in the form of hard disks where your Unix system
    is most likely installed and where your data resides. Hard disks are commonly
    filled up and close to capacity in most cases. It always seems like you need more
    space—although over the years the amount of space that you can purchase seems
    incredibly high, most folks pile on the data. However, there is no need to worry.
    That''s why almost every operating system created comes with some form of archiving
    and compression utility. There are third party tools galore to perform this function
    as well. You may even find compression and archiving tools in your email client
    as well!


    There are other reasons for knowing how to manage files in Unix when considering
    archiving and compression. For example, when you get updates, or need to install
    software on your Unix system, most likely you'
