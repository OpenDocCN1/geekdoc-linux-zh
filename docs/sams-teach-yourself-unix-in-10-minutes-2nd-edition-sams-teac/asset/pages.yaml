- pgno: 19
  md: '# LESSON 1

    Getting Started


    ![](img/9552a570ce35faac09a770fd5ff1ede3_19_0.png)


    The first lesson we will learn in this book is how to get started using Unix by
    connecting to logging in to your Unix system with a set of credentials. We will
    also cover the concepts behind text-based and graphical-based logins, as well
    as how to log out.


    Unix has been around for a long time; before Y2K and the growth and explosion
    of the Internet, Unix was used in systems everywhere. Throughout the years, instead
    of continuing to be known as a difficult and unfriendly system for new users to
    learn, Unix has grown into a multi-vendor supported, easy to install and use,
    documented desktop and server-based operating system, growing each day more powerful
    than anything ever dreamed of.


    This was no overnight phenomenon, of course; Unix has expanded each year thanks
    to tons of ongoing open source developmental efforts, the continuing development
    of Linux, as well as the Unix base growing exponentially yearly. Not only is growing
    the presence of Unix, but also has its fan base, which includes users of Unix
    as well as Unix System Engineers. With this growth rate, more and more people
    (whether they it or not) are using Unix at home and in the workplace; perhaps
    you are reading this book because you are one of them. In order to unleash the
    power of Unix, you must first understand its foundations. In this chapter, we
    will cover how to take the most basic steps in using Unix:


    +   - How to log in to Unix both graphically and textually

    - How to log out of Unix both graphically and textually'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'We will also discuss KDE, a graphical user interface (GUI)–based login. You
    will need to know how to connect to your system to properly utilize KDE. We will
    also cover all the concepts surrounding these steps, such as the differences between
    text-based and graphical-login, and security. An additional goal of this chapter
    is to expose you to other new concepts that you will expand on in later chapters.


    # Practicing with Unix: It Really Does Make You Perfect!


    In this chapter we are going to learn to start Unix, but before we do, a quick
    word about practice. It can''t be said enough: Practice makes perfect. As with
    anything foreign to you, as long as you can read this book, follow along, and
    walk through the steps outlined, you will eventually develop the speed you see
    from an experienced Unix operator and feel comfortable Unix.


    When new learners see the speed with which experienced Unix users enter commands,
    they often panic and feel as if they will always be novices because they cannot
    recall commands as quickly as they would like. Do not think you aren''t knowledgeable
    because you can''t remembered commands quickly; as long as you know what you are
    doing, speed is not a factor. Start small and take baby steps, but practice to
