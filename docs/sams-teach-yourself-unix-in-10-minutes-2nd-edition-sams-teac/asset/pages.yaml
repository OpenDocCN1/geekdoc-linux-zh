- pgno: 11
  md: '# Introduction


    # Welcome to Sams Teach Yourself

    Unix in 10 Minutes


    Welcome to Sams Teach Yourself Unix in 10 Minutes. If you are new to Unix or just
    want to learn more about it, you have undoubtedly chosen the perfect companion
    for your journey. Whatever your reasons were for picking up this book, you will
    be glad that you did, because it is filled with useful information to help you
    learn Unix. This book''s mission is to ensure that you walk away with a fundamental
    understanding of Unix, how to navigate and use it, and how to become more productive
    with it. Another goal of this book is to show you other avenues for gathering
    information that will help you continue your education beyond the lessons herein.


    # Unix Overview


    Because of growing market share from companies such as Red Hat, Sun, IBM, and
    Novell, there is no wonder that Unix is becoming more and more of a household
    name. Unix (and Linux, which is Linux Torvalds''s version of Unix) is now found
    in most firewall and Web-server-based systems as well as the way to the desktop
    for user productivity and development. Unix has deep roots in the computer industry.
    First surfacing in universities and the military, it began to grow more and more
    in use with the massive development and expansion of the Internet. Once Linux
    was released, the landscape of Unix changed forever. Now, Linux (an easier to
    use version of the Unix operating system) and Unix are both found almost everywhere
    you look, and to ignore them is simply impossible.


    Some common versions of Unix (called distributions, or distros for short) you
    may have heard of Sun Solaris, AIX, FreeBSD, Red Hat Linux, SuSE Linux (also known
    as Novell SUSE), and SCO ACE. Although these versions of the Unix operating system
    have differences,'
  merge: -1
  img_proc: true
- pgno: 12
  md: 'they all share the same thing: a basic Unix kernel that can be openly worked
    on by anyone with the knowledge to do so. In this book, we will focus on the similarities
    between all versions of Unix so that you can use one of them and still be productive.


    Unix is a very powerful multitasking operating system. Multitasking refers to
    performing multiple tasks at once; in this context, it specifically means that
    a user can run multiple programs simultaneously within one single login of the
    system. Unix is also a multiuser operating system. What this means is that many
    users can simultaneously (and securely) use the same machine. In addition, Unix
    is open source means that users are free to look at and modify its code. This
    is not the case with proprietary versions of Unix, but most versions are open
    source, so unless you are working with a specific vendor that does not allow its
    version of Unix to be altered, it is safe to assume that most versions (especially
    Linux versions) can be modified. Another powerful tool to unleash with Unix is
    the power of coding and scripting. Entire community works with Unix and help develop
    Unix programs, and this is what keeps the system growing, developing, and getting
    better each and every year. This is not commonly seen with other operating system
    platform vendors such as Microsoft. Most of these release closed source systems,
    which means you cannot freely write code that works blindly with these systems.


    There is much more to learn Unix. You are encouraged to find out more about its
    history and origins on the Web; this way, we can focus more written pages on teaching
    how to use Unix (At the end of this book, however, there is a reference section
    that will help you locate additional information on Unix, its history, and where
    it is going in the future.) So, now that you know that Unix is rapidly growing
    in use, let''s take a second to understand why this book is so important, how
    this book should be used, how this book is organized, and how you will learn Unix
    productively.


    # Versions of Unix


    Before we get involved in this book, there is one thing that needs to be made
    clear: There are many versions of Unix, also called flavors or distros (short
    for distributions). In this book, all versions will be'
  merge: -1
  img_proc: true
- pgno: 13
  md: 'referenced "Unix" unless there is something specific that needs to be said
    about a certain version or distribution. Since Unix, Linux, and all its cousins
    are so similar, they are said to be in the same family, but as you know, people
    in your family don''t all look or act the same, do they? Nonetheless, you can
    think of Unix as a family of sorts, one with a great heritage, many grandparents,
    and plenty of recorded history to laugh about.


    This book (just like the first edition) has been written to be general as possible
    and to not favor any vendor or implementation. This way, you can learn in the
    least confusing way possible; after the more complications you are exposed to
    learning, the more your learning progress is hindered. Again, in this book, Unix
    is Unix unless otherwise.


    > If something in an example doesn''t work on your system, don''t be alarmed—check
    the online manuals or ask other users of your machine. Different versions of Unix
    sometimes have slightly different versions of commands—it will be worth your time
    to learn how things work on your system as well as how things work on other distributions
    of Unix.


    # Teach Yourself Unix in 10 Minutes


    In each 10-minute lesson, you are given a small amount of material to master.
    In most cases, the material in each lesson builds on that presented in the previous
    lesson, although you can jump around lessons, you will be best served to start
    the book at the beginning and move through it in order. You can come back and
    forth as you master each lesson, in case you forget a command or how do something.


    This book is divided into seven parts. Part I, “Learning the Unix Environment:
    Baby Steps,” covers logging into a Unix (or Linux) system so you can begin to
    learn Unix. You will learn how to get into Unix (and Linux) so that you can work
    within it. Part I also shows you the essentials of how to help yourself, which
    is important when using any new system.'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Sams Teach Yourself Unix in 10 Minutes


    Learning how to find and use documentation is one of the keys to survival when
    it comes to learning Unix. Part II, “Navigating the Unix File System,” covers
    the file system, how to navigate it, and so on. Part III, “File System Utilities,”
    explains how to manipulate and work with files as well as how to use some of the
    tools that come with the system to edit, archive, and compress files. Part IV,
    “Working with the Shell,” covers working with the shell and how to use scripts.
    Although you won’t become a master of shell scripting overnight, you will start
    to see how powerful Unix can be if you know how to work with it. Part V, “Environment
    Customization,” covers user utilities as well as how to modify your environment.
    Part VI, “Networking and Communications,” is new to the second edition of this
    book; you will learn how to print with Unix as well as how to set up basic networking
    and security. Part VII, “Tips and Tricks,” covers advanced topics and some Linux
    so that you can work within Unix with the convenience of your home or anywhere
    else you may want to put a new Linux- or Unix-based system.


    # How Do You Use Unix?


    Unless you’re simply using a Unix machine as a platform for a prepaid commercial
    application, most of your interaction with Unix is likely to be textual commands
    typed at a command-line prompt. Most implementations of Unix provide a graphical
    user interface (GUI); however, even when running the GUI, most of what you are
    likely to do involves typing commands into terminal windows that are available
    in the GUI. We some versions of Unix install graphically as well as allow you
    to initially log in the system graphically. This being said, it is imperative
    to learn the fundamentals of both methods if you are to progress the login portion
    of this book presented in Part I.


    So, are you worried about minimal help? You shouldn’t be; that’s why you’re reading
    this book! As previously mentioned, you will learn both graphical and textual
    methods in this book. Dragging and dropping and using a mouse are still options
    in some Unix systems, but the strength of Unix is at the command line. You will
    see this as you read through each chapter. You will be introduced to K Desktop
    Environment'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Introduction


    (KDE), one particular flavor of such an interface, in this book. KDE was chosen
    as a representative sample for this book because it is available on a wide range
    of Unix systems and distributions. KDE is also the default environment for SuSE,
    which is owned and operated by Novell, one of the best-run and supported versions
    of Linux available today.


    ![](img/9552a570ce35faac09a770fd5ff1ede3_15_0.png)


    As tempting as it might seem, you are cautioned not to become entirely dependent
    on GUI utilities even if you have a GUI product with the sophistication and convenience
    of the command line, because the command line is where most of the power lies.
    The GUI is only something that has gradually been developed to get more users
    to work with Unix; it bridges the gap between drag-and-drop on Microsoft Windows
    and the Unix command line. Remembering that the true power lies in the command
    line is what is going to make you into a Unix expert. For example, there are some
    commands that you can''t do or you can''t do completely from the GUI; that alone
    proves that you do lose power when you use the GUI. Try not to get too accustomed
    to using it, but feel free to use it to help you learn Unix.


    # Getting More Information


    It is impossible to provide in-depth coverage of even a small fraction of Unix
    commands in this book size. Instead, you are provided with enough information
    and knowledge to get you started, allow you to master the fundamentals, get you
    involved in the Unix system, and to get you to the point where you need more information,
    resources, and answers, you will know exactly where to start looking for them.
    In fact, this book concludes with an appendix with a list of resources in case
    you ever need to use them.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Who This Book Is For


    This book is for anyone who wants to begin learning Unix or learn beyond the fundamentals.
    The book''s small size is meant to keep your investment in time down to a minimum
    and to give you the greatest amount of knowledge possible based on the time you
    contribute to learning.


    This book also serves as a handy reference to using very common commands, so even
    as you move beyond the basics, you can still use this book as a desktop reference.
    The commands presented in this book are universal and can be used on a great many
    Unix versions, so make sure you refer to this book in the future if you forget
    a command or how to do something.


    # Author Note


    Before we begin, I would like never to take a second to put your mind at ease.
    Unix is not simple; it never was, and it never has been. Having worked with Unix
    in a production environment for years on just about every version, flavor, and
    distro, it is easy to see why so many folks hate working with Unix. It is not
    easy to learn, mostly because it''s not intuitive at all. Unix is something that
    needs to be learned before it can be attempted. In a Windows operating system,
    being intuitive can get you places; in Unix, it will generally get you nowhere.
    You simply have to learn the basics from a book like this to be able to start
    to be productive. Although this isn''t true for everyone, it applies to most people
    I have encountered. After teaching for years and writing great many books about
    business and technology, I can easily see why Unix can be intimidating.


    This book''s goal is to destroy that intimidation; to give you a tool set to work
    with, and to send you on your way into the world of Unix with a foundation to
    grow on. So, let''s begin to learn how to make Unix work for you, with you, and
    definitely not against you.'
  merge: -1
  img_proc: true
