    # The split Command


    Now that you know how to find how much data is in a file, and what that file is
    comprised of logically to build up its internal structure, we will look at how
    to take a large file and break it down. The split command will just that. It will
    cut down a file into whatever length you specify. To use the split command you
    need only to know that a file is too large to work with or to send to someone.
    Once this is determined, you can execute the split command to break it down. Take
    the following steps:


    +   1. Choose your input file that you want to beak down. For example, I still
    have boot log that is large, so I will break that down into manageable chunks.


    +   2. Determine the number of lines you want stored in each output file. Understanding
    how to determine how many lines are there is important. This will help you determine
    what the sizing will be for the split. Do by using this -l <number of lines> as
    an option to the sort command.


    +   3. Choose a base output filename for the results.


    +   4. Invoke split using the following syntax: split <segment options> <inputfile>
    <outputfile>.'
