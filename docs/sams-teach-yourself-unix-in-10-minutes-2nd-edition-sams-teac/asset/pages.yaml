- pgno: 56
  md: 'We have taken a pretty deep look at the X Window System and how to customize
    it. Now, after learning how to log in, get help, and tweak your environment, you
    should start to gain comfort in working with Unix. In addition, although we have
    only worked through Part I, “Learning Unix Environment: Baby Steps,” of this text,
    you should feel comfortable running a few commands, and you should understand
    basic navigation if you are operating within a GUI. Let''s move on to more customization
    and tips to help you work within Unix even more comfortably.


    # X Window System Look and Feel


    It can only get better from here. Let''s continue our lesson and learn more about
    customization. Launching the X Window System is mostly the responsibility of the
    particular window manager you''ve chosen to run. This section will help you learn
    which window manager to use based on your particular needs. For now, though, let''s
    talk generally about what window managers can do for you and why you may want
    to use them.


    Today, there are many window managers to choose from. Selection is good; it maintains
    competition, which leads to increased value in the products you use. As with competing
    products, some window managers are good and some aren. Although there are differences
    from one manager to another, all window managers are similar in operation. For
    example, most window managers for X are designed for use with a three-button mouse.
    The buttons on the mouse serve the following purposes:


    +   * The left button is used for pointing, clicking, and selection.


    +   * The center button is used for general functions, such as moving or resizing
    windows.


    +   * The right button is used for application-specific functions, such as opening
    in-application pop-up menus.


    You do not have to use this mouse layout and it can be changed. However, it''s
    helpful to remember these designations if you want to implement and use the third
    mouse button for your Unix system, or if you want to know what all three buttons
    will do by default.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Interfacing with Unix Graphically


    The X Window System environment also uses the concept of focused input when you
    type on your keyboard. What this means is when you work with Unix, you can basically
    focus your input wherever you want as long as your system is configured to do
    so. In X, there are multiple options for focusing your input. Window managers
    can be configured


    +   - Focus input on the foremost window

    - Focus input on a selected window

    - Focus input on whichever window the cursor is


    When you configure Unix to focus on the selected window, X does not need to be
    the selected window. It''s also helpful to know that when you configure a window
    manager to focus input on whichever the cursor is, you can direct the input into
    a window that may be hidden. In Microsoft Windows and Apple Macintosh, the active
    window is the dialog box that is in the foreground. If you want to use a background
    application, you have to select it, bringing it to the foreground. With Unix,
    by simply dragging the mouse pointer over a window, you can activate it and ensure
    that it''s running as if it were in the foreground. Thus, as a learner of Unix,
    you may get confused and not working in the window you thought you were. Be careful
    as you navigate and pay attention to where your mouse pointer is you attempt to
    work in a window that does not appear active.


    Let''s review the .xinitrc file once. When looking at the file, pay close attention
    to the xrdb command on the second line. What is this used for?


    ```

    #!/bin/sh

    xrdb -load HOME/.X11defaults

    ```


    To answer this question, we need to become familiar with the resource database,
    where is the X Window System gets its configuration settings. Most configurations
    of X are handled by a server-based resource database. A client will make a request
    of the server. The server will check its database for the requested information.
    If the server has provide it; if not, it will let the client know it doesn''t
    have the information. It''s that simple.'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'The server will check for user preferences based on the client that is requesting
    them. The command xrdb is what is used to load the database. Once X is loaded,
    xrdb is loaded immediately following. xrdb will also load the needed configuration
    from a dot file. Dot files will be discussed in Lesson 16, “Modifying Your Environment.”


    > Check Your Documentation Each version of Unix can be customized, and you may
    be working on an already-customized version. It takes a while to be able to modify
    your environment properly; many times, it requires trial and error or lots of
    reading. Reading the documentation stored locally on your system for whatever
    window manager you are using is a great start. Also, if you can set up a Unix
    system to practice on, that is ideal. You can become a master of modification
    when you have a practice lab to work in.


    In this section of the lesson, we have completed our discussion on customizing
    your X Window System environment. You should feel comfortable with the ways that
    Unix will attempt to set your environment when you load it, either by giving you
    a default .xinitrc script group of settings or by using a modified group of settings
    that you have created. Remember, we will learn more about how to alter files in
    the next few lessons, so you can come back to this section when you learn how
    to use vi or the emacs to make any changes you would like. Let’s move on to a
    discussion of some of the window managers today.


    # Window Managers


    Window managers take over where the X Window System leaves off. X was made to
    be limited, and it can only go so far. When you want to get more advanced, you
    need something that will allow you to do just that, and that something is a window
    manager.'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Interfacing with Unix Graphically


    As a new learner of Unix, you may get confused when using a window manager. Unix
    is so customizable (again, a positive feature, not a negative one) that even if
    you are sitting next to a peer or friend who is using the same version or distribution
    of Unix as you are, you may see things completely differently on your screen based
    on how you have your window manager configured. Don''t let this stress you—the
    best way to overcome this issue is simply working within the environment and learning
    how to customize it yourself. As you do, your fear of the unknown will diminish
    rapidly.


    There are many different window managers. In this section of the lesson, we will
    cover the ones you will encounter most frequently, including the most commonly
    used window manager: twm.


    # Using twm


    twm is by far the most common and easiest-to-use window manager. It''s not the
    most feature-rich window manager, but because it''s commonly used by default,
    it has become the unofficial standard. When properly, twm can provide you with
    an extensive experience beyond what you are accustomed to. There are many things
    you can do with this window manager, such as creating buttons to windows, adding
    pop-up menus, and so on. To start twm, you only need to type the following at
    the shell prompt:


    ```

    >twm

    ```


    The window manager will then open if one is not already opened and conflicting
    with it. If you already have a window manager open, you may be denied from opening
    two of them at the same time.


    > Where Are the Changes Stored? The file used to save all of the configuration
    changes we have discussed (as well as a plethora of others) is named .twmrc and
    is most likely located in your home directory.'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'Once you launch twm, you will be able to work within it to customize whatever
    it is want to adjust. Make sure you read your local documentation, though, because
    there are many other window managers available, including the ones we will discuss
    in the next section.


    # More Window Managers


    Unfortunately, choice often leads to complexity. Not only is this the case with
    technology in general, but it is especially true in the world of Unix and window
    managers. Because so many different window managers are available, we can have,
    in all granular Detail. We can, take a quick look at some of the more popular
    window managers so that you will understand any major issues that may pop up using
    them.


    It is up to you to choose which window manager suits your tastes and needs. Once
    you have an idea of which manager you need and experience using it, it will become
    increasingly easy for you to work in that manager in the future. Besides twm,
    other common window managers include the following:


    +   * AfterStep—This window manager will add extra features such as graphical
    enhancement and fading abilities. To use this manager, you will need to have a
    good video card to prevent taxing your colormap.


    > Colormaps A colormap is really nothing more than a set of color cells assigned
    with manageable index values. In other words, a colormap consists of a set of
    entries defining color values.


    +   * ctwm—This window manager is a tab-style manager with a 3-D animated look.


    +   * fvm—This is a popular 3-D virtual window manager. It is also the lowest
    in memory consumption and fastest in speed.


    +   * fvm2—This is the 2nd version of fvm. It’s different from its predecessor
    with more features for an even faster and easier experience.'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Interfacing with Unix Graphically


    +   - twm—This is a version of twm that offers additional benefits such as virtual
    desktop capability.


    +   - Blackbox—This window manager is common among users who don''t like running
    the larger window managers.


    Remember, this is not by means a complete list, and twm is the window manager
    most commonly used.


    Now that you know what a window manager is and you are familiar with some of the
    different kinds of window managers you can deploy, you can grow into whichever
    environment suits your needs the best. Let’s wrap up this lesson with a discussion
    about using KDE, which stands for the K Desktop Environment.


    # Desktop Environments


    In the past, Unix-based window managers have been used to manage the user’s screen
    and apply customization. With the launch and continued development of Linux, this
    is changing at a rapid rate. The advanced desktop environments that come with
    Linux and newer versions of Unix now provide users with a more sophisticated experience.


    There are many tasks you can do on the desktop, such as access most if not all
    of your programs, start a shell, and type in commands. You can also manage files,
    which we will start to cover in the next lesson, “The File System Explained.”
    Although there are many other tasks you can carry out, these are the most common
    performed on any system.


    > Ease of Use Can Be Career Limiting Remember, the power of Unix is at the shell
    prompt. Do not get too accustomed to working with the GUI until you have mastered
    some of the aspects of the command line. Try to balance your learning using both
    methods; do not become dependent on the GUI.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# KDE


