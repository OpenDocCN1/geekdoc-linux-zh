  md: '# Text Editing 109


    > Know Your Syntax In the following list, whenever you see Ctrl+ preceding a character,
    it means that you need to hold down the Control (Ctrl) key and type that character.


    Learning and using the emacs editor can be difficult, but here are some tips to
    help you navigate it and learn it:


    +   * As mentioned earlier, the emacs editor doesn''t have a separate mode for
    entering. There is only one mode and you use the control keys to move to what
    would be considered another mode. You are always either typing a command or typing
    text—no switching modes between them the vi editor. To type text, you just need
    to type it; if you need to enter a command, you can use the control key to do
    this, usually seen as Ctrl+option.


    +   * You can position the cursor in emacs by using the arrow-key in in every
    version of emacs and terminal combination. This is handy if you are new to learning
    how to get the keyboard shortcuts, just like the vi editor. If the arrow keys
    don''t work, you can also position the cursor by using Ctrl+b to move backwards,
    Ctrl+p to move to the previous line, and Ctrl+n to move to the next line.


    +   * You can delete everything from the cursor to the end of the current line
    by pressing Ctrl+k.


    +   * Ctrl+g is the emacs "quit what you''re doing" command. If you started typing
    a command and change your mind, use Ctrl+g.


    +   * If you use Ctrl-k to delete a line or lines, you can press Ctrl+y to yank
    them back again.


    +   * To save the file you''re currently editing, press Ctrl+x Ctrl+s.'
