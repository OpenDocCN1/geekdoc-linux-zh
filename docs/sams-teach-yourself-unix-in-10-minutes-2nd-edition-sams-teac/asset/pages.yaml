- pgno: 95
  md: 'File management at the shell prompt is not difficult. In this next part of
    the lesson, we will cover the fundamentals of working with files and folders within
    Unix at the command line.


    # Working with Files at the Unix Shell Prompt


    When working with Unix, you will most likely find it easiest to work with tools
    at the shell prompt. Using commands such as touch and rm is very helpful, and
    these commands perform niche-based functions in much the same way as the where
    command covered in the last lesson. In Unix, there are multiple ways to create
    a file and edit it.


    The command line is your primary interface to the Unix file system as well as
    your primary tool for creating, deleting, and rearranging files. In this part
    of the lesson, we will learn how to manipulate data within the Unix system with
    the touch command as well as commands to help you remove newly created data on
    your Unix system.


    # The touch Command


    Creating new empty file in Unix is easy when you use the touch command. The touch
    command is used to update the last modified time of a file, setting it to the
    current time. This is usually not commonly used, but knowing about it can serve
    you well. The touch command is normally used with one particular area: backup
    and disaster recovery. As a Unix system administrator, you may be asked to backup
    and restore jobs. There are a few different types (and methods) of backup and
    restore you can choose from, one of which is called an "incremental backup. Although
    this may not be something you work with Unix, it is something you are most likely
    affected by. Most systems are backed up and protected by companies that need to
    save and keep their valuable data.


    The touch command can be used with the incremental backup by helping to verify
    that a backup was in fact completed. Even if you never altered the data or modified
    it for any reason, you can still use the'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'command to change the modification date and make it appear as if it had been
    modified, thus making it appear to have been modified at the time you touched
    it. This can be useful when you work with backups in particular, and you may also
    find other uses for it in your work with Unix.


    > Where Did That New File Come From? When “touch” a file by accident, you may
    wind up with a new file you may not have wanted. If you use the touch command
    and do not specify the actual file-name (a file that really exists on your system),
    Unix will create a new file for you. For example, if you said you wanted to touch
    a file on your system unixmaster, and it was really called unixmasters, then a
    unixmaster file will be created by Unix within the current directory you are working
    (or saving). You can do this by typing pwd.


    Now that you understand the touch command, let''s take a look at how you can use
    it. In this example we will look at both how to change the modification date of
    a file and how to make a new file altogether.


    +   1. Determine the filename of the file or files you want to update or create.

    2. Issue the touch command as touch <filename>.


    For example, type


    ```

    > touchfile

    ```


    If the backup file previously existed, its last-modified date would now be set
    to the current time. If the backup file did not previously exist, it would now
    exist as an empty file with a last-modification date of the current time. It’s
    easy.


    There are additional uses for the touch command. When you become comfortable enough
    with Unix to start automating your work using shell'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'scripting (discussed in Lesson 14, “Shell Scripting Fundamentals\), you will
    find the touch command useful for creating “flag files” that allow your scripts
    to talk to each other. Keep the touch command in mind during Lesson 14.


    > Use Your Time Correctly When working with Unix,(or any other operating system),
    you should have the correct time set on your system. This is usually done by a
    system administrator, as it''s not done locally on the system. Instead, a time
    master is usually found somewhere on the network, from which your Unix system
    may pull the time. Of course, if your Unix system is not networked, then you will
    most likely be getting your correct time from the local system. Be aware of what
    time your Unix system says and where you are getting your time from.


    Having your Unix system set with the proper time will help not only with file
    management, but also with logging security.


    # Removing Files with the rm Command


    If you use the touch command and now have a file that you do not want on your
    Unix system, you may want to get rid of it. In this section, we will learn how
    to remove files from your Unix system.


    The rm command is used to delete unwanted files on your Unix system. Remember
    that using this command can get you into some trouble if you don''t use it properly\u2014you
    could remove data from your system that you do not want to remove. Unix takes
    what you very literally, so be careful\u2014you are not in a Windows environment
    that checks every step of the way when you delete a file. If you want to remove
    a file from your Unix system, follow these steps to use the rm command:


    +   Determine which file, or files, you want to delete.


    +   Issue the rm command as rm <filename>.'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'As with using touch, rm is easy: As long as you can find and specify the filename,
    you can remove it.


    > What If I Have Multiple Files? You can delete multiple files by leaving a space
    after each filename and then specifying the next. You can add or remove multiple
    files by specifying files you want to add or remove, one after the other in tandem.


    An example for using the following rm command:

    rm newfile2


    After issuing the rm command for the files you want to delete, you might be presented
    with a response such as

    remove newfile (y/n)?


    You can also use options with the rm command. Just like you used find with the
    --print option, you can use the rm command with its own set of options. Of course,
    you can use the man pages to learn more.


    The rm command supports several useful options such as -i, -f, and -r. Each option
    will perform a different function when specified.


    The "i" stands for interactive mode. The -i option asks you to confirm the deletion
    of each file before it is actually deleted.


    Most Windows users are familiar with this "safety checking" when you want to delete
    something. This -i option is how you can be absolutely sure you want to remove
    what you specified with the rm command in Unix.


    Thus, the rm interactive mode is nothing more than a way for Unix to check with
    to ensure that you really want to delete the data specified. If you really want
    to remove the data, press y. This will take you back to the shell prompt, and
    your data will have been removed from the system.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Working with the Shell


    The interactive mode will be configured by your Unix system administrator usually
    unless you are on a highly customized system.


    The next option is rm using the -f option. The -f requests rm when you need to
    delete files that may have file permissions on them. This option will allow you
    to remove the files without worrying about file permissions stopping the deletion
    process. Remember, you can create files and set the permissions on so that even
    you can''t read them. There will be times when using Unix where you may need to
    delete a file or files without having permission to read or write to them.


    > Recursive Is Not a Curse Word in Unix In this lesson we will discuss commands
    that, when used with a particular option, can perform recursive actions. What
    is that?


    When relating to file management in Unix and the directory structure where Unix
    maintains its files and data, “recursive” means when used, it will go through
    the directory from the starting point, down through subdirectories, until it cannot
    search anymore.


    The recursive actions are also repetitive; it will continue to search through
    each and every directory until the operation has been completed—it’s an exhaustive
    command.


    The last option we will discuss is the -r option, which stands for recursive.
    The -r option is a powerful option when using rm; the recursive mode can cause
    panic if you didn''t intend to use it—so be careful. This command will remove
    the directory you specify, as well as anything that is contained within it, including
    other directories.'
  merge: -1
  img_proc: true
- pgno: 100
  md: '> New Unix Mantra: Take a Quick Peek Before You Delete! The recursive option
    of the rm command is able to remove large amounts of data very quickly, so unless
    you have a backup handy, you may want to enter the directory you want to delete
    and use the ls command to see what is in the directory.


    So now that we know how to create and delete files, let''s look at another large
    aspect of file management within Unix: creating directories.


    # The mkdir Command


    As mentioned earlier, directories are basically used to organize data. You may
    have experienced instances where you have one directory with hundreds of files.
    It would not be easy to find anything quickly unless you memorize every filename
    on your system.


    Think of a phone book or telephone directory: The Unix directory is much the same.
    What if all businesses in your area were only listed in alphabetical order? How
    does that help you? How could you call an electrician, plumber, or anyone else
    unless you had groups of similar categories organized for quick retrieval? This
    is exactly why you need directories—for the simple organization of data on your
    Unix system. In this part of the lesson, we will learn to make directories.


    To make a directory, you can do the following:


    +   1. Choose an organizational structure, and name your new directory.


    +   2. Issue the mkdir command as mkdir <directoryname>.


    For example:


    ```

    > mkdir test

    ```


    This creates a new directory named test, which will be located in the current
    directory. To find the current directory you are in, you can issue'
  merge: -1
