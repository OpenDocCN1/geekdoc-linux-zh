- pgno: 37
  md: '# Getting Help


    As just mentioned, you will eventually need some form of help in your Unix journey.
    Not all of your issues will be addressed in the man pages, but many of them will
    be. Help comes in different forms. For example, you may need help with a command
    as ls. The ls command is used to list the names of files that are found in your
    current directory. In the man pages, you may see the syntax on the use of ls but
    not necessarily understand what you need to do with. In other words, your problems
    may run deeper than the help provided in a man page. This is where time, practice,
    reading and learning save the day. The man pages are only for your reference;
    they will not do anything for you unless you are able to understand what they
    say and perform the appropriate actions.


    Why use man pages instead of the Internet or any other resource? To answer this
    question, remember the purpose of the man page: It''s there to help you, not to
    do the work for you. All the information you need for the command syntax is found
    within man page. If you want to look for further suggestions on use, then that''s
    a different story. But why look outside the box when you have the answer inside
    the box? Check the man page before you move to any other resources.


    In addition, there is no definitive source for Unix information on the Internet.
    There are scattered resources that can help you if you know the specific vendor
    of the product you are using (SuSE, AIX, SCO ACE, and so forth) and the vendor
    provides support documentation. You may also find some information if you are
    a master at searching the Internet, but chances that this information will be
    secondhand at best. Because Unix users have always relied upon the system''s own
    internals for assistance, man pages are the best-known resource for you as a Unix
    student. These pages are anywhere Unix unless the files or links to them are damaged
    and in need of repair. To review, benefits of man pages include the following:


    +   - Man pages are the quickest source for complete information on how to use
    the commands on your system.


    +   - Man pages provide information on what programs do and how to use them.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Lesson 2


    +   - Man pages cover other related utilities that you might be interested in
    working with. The recommendations on these pages could also be of help to you.

    - If you''re a programmer or developer, man pages will also provide helpful programming
    information that you can use when coding and writing scripts.


    To display a manual page, use the man command. By simply typing man followed by
    the command you want to look up, you will get the results you need.


    ```

    >ls

    ```


    ```

    NAME

    ls - list directory contents

    SYNOPSIS

    ls [OPTION]... [FILE]

    DESCRIPTION

    List information about the FILES (the current directory by default).

    (output removed)

    ```


    In this example, the man pages showed you all the available syntax you can use
    with the ls command. You can use this information to get added details on the
    command.


    As you can see, man pages do not enter a command for you, and they don''t help
    you do a task—they are simply informative. When using man pages, what you are
    looking for is additional information about a command; that way, you can customize
    the command with the many different switches that can be applied to it.


    As you use man pages, you may find them unwieldy and long. Never fear, because
    there are shortcuts to using the help system. These are in the form of apropos
    and whatis.'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'Commands You Need to Know When you see a . . on your screen, there''s more
    text to be read. What you need to do is press the Spacebar to see the additional
    text.


    The man pages won''t scroll automatically, so you may need to carry out this extra
    step. To stop this action, press q to quit the page and return to the command
    line.


    # # More Help


    Now that you are familiar with the built-in help in Unix and how to use the man
    pages and the man command, we will look at some other ways to use man. We''ll
    also explore the use of apropos and whatis, those programs can help you find additional
    assistance.


    As mentioned earlier, the man command can often generate unwieldy results. This
    can be especially problematic if you just want to find a subset of the information
    on a man page. If this subset is all you need (for example, if you only want to
    find a summary description of a command), then you can use the following commands:


    ```

    whatis

    man -f

    apropos

    man -k

    ```


    Using any of these followed by the command you are interested in (just like the
    ls example) will result in a shorter set of information being supplied back to
    you. Lets look at each of these commands in detail.


    # # whatis and man -f


    The man command used with the -f switch is similar to the whatis command, as apropos
    is similar to the man command with the -k switch. The full power of most Unix
    commands can only be unleashed with the use of switches, so make sure you pay
    close attention to how they are used in this lesson and in the rest of the book.'
  merge: -1
  img_proc: true
- pgno: 40
  md: '# Lesson 2


    Switches and Flags As just mentioned, you can find help simply by using switches
    with the man command. That''s great to know, but what exactly is a switch?

    A switch (also called a flag) is used with a command. The command will perform
    the basic task, but the switch (when added) will modify the command. For example,
    in the last section, we covered the man command. Now, we are discussing man -k.
    The -k is the switch. Similarly, in the man -f example, -f is the switch.

    nYou must remember that Unix is case sensitive. Uppercase and lowercase switches
    mean different things, so use them carefully.


    By using man -f or whatis followed by a command name, you will get a description
    summary of that command. For example, to print a description for the date command,
    type the following, and a short description of what date does be returned. Press
    q to return to the command line.


    ```

    >man -f date print or set the system date and time

    END

    ```


    There should be a whatis database on your system. If it has been removed from
    your system or never created, you may get an error reported back to you. Ask your
    Unix system administrator for help, because privileged access to the Unix system
    is needed to create a database if one does not already exist.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# apropos and man -k


    When using the apropos or man -k commands, you will see similar functionality
    to the whatis and man -f commands, but what makes these commands different is
    that they can help you find a result based on a possible match. In other words,
    if you are clueless about what command you want on but have some idea about it,
    entering that idea with apropos or man -k will return a result if any partial
    matches can be made.


    Try running apropos on time and compare your results with the results from the
    similar whatis time command:


    +   >apropos time

    - Determine processor time

    clock (3)

    - Obtain and manipulate time

    clock (n)

    - convert time/date strings and numbers

    convdate (1)

    - print or set the system date and time

    date (1)

    - calculate time difference

    difftime (3)

    - return date and time

    time (3)

    - close down the ftp servers at a given time

    ftshutdown (8)

    kbdrate (8)

    - reset the keyboard repeat rate and

    delay time

    ldconfig (8)

    - determine run-time link bindings

    metamail (1)

    - infrastructure for mailcap-based

    multimedia mail handling

    anleep (2)

    - pause execution for a specified time

    newstime (1)

    - Display / Set a NetWare server''s date

    and time

    parsedate (3)

    - convert time and date string to number


    In this example, we see a few results displayed, but we also see the ..., which
    means that there are even more results that are not shown offscreen. Sometimes,
    if you are not sure what you are looking for and are too vague in your request,
    you can get hundreds of responses. Searching through these results is time consuming,
    so use apropos and man -k as a last resort for finding help if needed.'
  merge: -1
  img_proc: true
