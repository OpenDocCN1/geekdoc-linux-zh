    files in your /etc directory that may be hosts files, run a query on it, narrow
    down your search criteria, and cat the file you want to see. You can also cat
    multiple files.


    You can cat all the files simultaneously, but the query results would be large
    that your results would scroll off the screen too quickly for you to'
