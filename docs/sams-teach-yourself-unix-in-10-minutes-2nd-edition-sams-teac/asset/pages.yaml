- pgno: 9
  md: '# About the Author


    Robert Shimonski is a well-known networking and security expert consulting out
    of the Long Island, New York area. Rob has authored over 30 books on information
    technology that includes specializing in systems engineering with Unix and Microsoft
    technologies, as well as networking and security design with Check Point and Cisco
    technologies.


    Rob has also deployed state-of-the-art technology in hundreds of companies worldwide—just
    recently designing and implementing a global MPLS network of sites. Rob was fortunate
    to have been able to keep up with his love for Unix by deploying Linux systems
    and freeware networking and security tools as Ethereal, NMIS, and MRTG, to a name
    few.


    Because of Rob''s unique blend of Unix and Linux-related real world experience,
    Rob has served as a technical editor and author on countless Unix- and Linux related
    articles and books. Rob was also the networking and security expert chosen to
    help develop and design LinuxWorld Magazine. You can view LinuxWorld Magazine
    at http://www.linuxworld.com. To learn more about Roberts’s book projects, please
    visit him at rsnnetworks.net.


