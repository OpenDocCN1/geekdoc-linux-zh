- pgno: 108
  md: 'Practical application of this command would allow a source file that constantly
    changed names to be linked to a name that everyone could remember. For instance,
    a file named sales_report that all marketing managers could access may be kept
    up to date by a secretary who links a series of dated files to sales_report. The
    managers only need to remember one name, instead of having to remember multiple
    names, or having to constantly find or request what name would be. It''s a way
    to make things easier for you while working with Unix.


    To create a link, do the following:


    +   1. Specify the particular file you want to link to another file. The ln command
    will create a link from the source file to an alternative name for that to be
    accessed. You need to know the original name and then the name you want it to
    be referenced.

    2. Issue the ln command as ln -s <realfilename> <alternename>

    3. Issue the ls -l command to view the long listing and the link you created.


    When using the ln command, you need to be very specific about creating a link.
    Take care not to make the mistake of specifying a filename that doesn''t exist
    and then creating a link to it—it will be useless and not link to anything. You
    should view the original source filename and make sure when you build a link that
    you specify the exact filename to avoid this error.


    Another issue you may face involves forgetting to use the -s option. The -s option
    is nothing more than specifying that you want to create a soft link instead of
    a hard link. Since hard links are not really used by Unix end users, we will not
    dig deeply into the meanings here, as it''s a bit beyond the scope of this book
    and not likely to be anything you will see or use as a novice user of Unix. As
    I mentioned earlier in this book, it''s imperative that you take the initiative
    to dig into these topics deeper if you are interested in all that you can do with
    Unix—keep learning and practicing as much as you possibly can.'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# Working with the Shell


    An example of the ln command to create a link can be seen here:


    ```

    > ln -s /priv/home/rob/storage/HTML/123456789ABC.htm /etc/HTMLLAB/easy

    ```


    If you were to do this, you would create a link named “easy” in the HTMLLAB directory
    that would be linked to the very long and not easy to remember HTML file in your
    stored HTML directory.


    That''s it! Creating a link, and now you not only know how to do it, but a practical
    reason why you should. Our last discussion in this lesson focuses on the proper
    way of using relative or absolute paths.


    # Knowing the Right Path


    We discussed the difference between relative and absolute paths in Lesson 5. By
    managing data using commands as cp and mv, you can also specify different paths
    when issuing the command. There are shortcuts and other tips (that could fill
    50 of these books) that can help you be more productive.


    It is very important to remember that when you give a filename as an argument
    to a Unix command, the filename can be either a relative or absolute path to the
    file. Consider this when you type out your command. Sometimes you may not be specifying
    the command properly and that is why it''s failing: for example, if relative and
    absolute paths either use / or not, this may cause you to issue the command incorrectly
    and possibly give you an error message. If this happens, review the previous lesson
    on paths and apply that knowledge to your commands as you continue to learn and
    use them.


    # Summary


    In this lesson you learned more file management skills, which will serve as building
    blocks for the next few chapters in which you will learn to read and edit files.


    At this point, you should be able to log into your Unix system and manage the
    locally stored data on it, and to move, copy, and delete data files.'
