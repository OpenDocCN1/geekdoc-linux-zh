- pgno: 160
  md: 'In addition to understanding the ps command, you should also understand how
    to stop or kill a process.


    # # The kill Command


    When you use the kill command with a process, you stop whatever that process is
    doing. One hazard with commands of this nature is if you are using a program like
    the vi editor and you kill it, you may lose your work as a result.


    Although the kill command is mainly used to end a process, it can also be used
    to send signals to a process. Signals can be sent to indicate an action. There
    are actually many signals that you can use with the kill command. If you use the
    kill command with the -l option, you can see a list of everything Unix can signal
    with:


    ```

    >kill -1

    1) SIGHUP 2) SIG 3) SIGQUIT 4) SIGILL

    5) SIGTRAP 6) SIGIOT 7) SIGBUS 8) SIGFPE

    9) SIGKILL 10) SIGUSR1 11) SIGSEGV 12) SIGUSR2

    13) SIGPIPE 14) SIGARM 15) SIGTERM 17) SIGTTIN

    18) SIGCONT 20) SIGTSTP 21) SIGTIN

    22) SIGTTO 23) SIGURG 24) SIGXCPU 25) SIGXFSZ

    26) SIGTALRM 27) SIGPROF 28) SIGWINCH 29) SIGIO

    30) SIGPWR

    ```


    Documentation for the software you run on your system often includes information
    on the signals to which it will respond. The most important signals you''ll use
    are SIGHUP and SIGKILL. The SIGHUP signal will hang and reload the server''s process
    configuration information. SIGKILL should be perhaps self-explanatory; KILL in
    all capital letters should help you remember that this is the signal to kill processes.
