  md: '# Online Help


    Use the help command at the switch prompt to display an alphabetical list of commands.


    ```

    switch1:admin> help

    ```


    | agtcfgSet | Set SNMP agent configuration |

    | agtcfgShow | Print SNMP agent configuration |

    | agtcfgDefault | Reset SNMP agent to factory default |

    | alias | Print Alias Server information |

    | backSpace | Set/clear alternate backspace char |

    | bsn | Display/set switch serial number |

    | configure | Set switch config parameters |

    | configShow | Print switch config parameters |

    | configDefault | Reset config to factory default |

    | configDownload | Load switch config from a server |

    | configUpdate | Save switch config to a server |

    | date | Print/set the system date and time |

    | errDump | Print error log (no page breaks) |

    | errShow | Print error log |

    | fabric | Print fabric membership info |

    | fasShow | Display Fabric Assist info |

    | fasShow | Display Fabric Assist Statistics |

    | fanShow | Print fan status |

    | fastboot | Reboot this switch, bypassing POST |

    | firmwareDownload | Download firmware into switch |

    | fpgaDownload | Download FPGA netlist into switch |


    Type <CR> to continue, Q<CR> to stop:


    Use the help command with a parameter to display details on a specific command.


    ```

    switch1:admin> help fastboot

    ```


    NAME

    fastboot - reboot the switch, bypassing POST


    SYNOPSIS

    fastboot


    AVAILABILITY

    admin


    DESCRIPTION

    This command reboots the switch. The reboot takes effect immediately as the switch
    resets, then executes its normal power-on booting sequence. However POST (Power
    On Self Test) is skipped. This reduces the boot time significantly.'
