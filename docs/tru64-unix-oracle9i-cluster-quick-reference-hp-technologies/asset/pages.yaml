  md: '# Raidset Partition Worksheet


    | Raidset Partition Worksheet | |

    |--- | :--- |

    | (A) Enter the RAID chunksize. | Chunksize [ ] |

    | (B) Enter the raidset size in blocks (use "show raid full" to view raidset sizes).
    | Raidset Size (blocks) [ ] + 2 = [ ] KB |

    | (C) Calculate the stripe size. | Chunksize [ ] X Members -1 [ ] = Stripe Size
    (blocks) [ ] = |

    | (D) Enter the percentage of space for the new partition. | % [ ] X Raidset Size
    [ ] = [ ] |

    | (E) Take the calculated size from step D and truncate it and round down to next
    lower stripe boundary. | Truncate [ ] + Stripe Size (blocks) [ ] = Stripe Boundary
    [ ] |

    | (F) Multiply the stripe boundary by the stripe size and subtract 5 blocks for
    overhead. | Stripe Boundary [ ] X Stripe Size - overhead [ ] - 5 = Net Usable
    Space [ ] |'
