  md: '# Chapter 7 — Oracle9i Installation


    # RAC Concepts


    Real application clusters (RACs) available with the Oracle9i database extend the
    clustering features provided in previous Oracle releases such as Oracle8i. Oracle9i
    RAC is a new architecture that provides better availability and scalability.


    One significant change in Oracle9i RAC is the full implementation of Cache Fusion,
    which guarantees cache coherency with multiple nodes of a cluster without incurring
    expensive disk I/O operations. The high-speed cluster interconnect is used to
    pass database blocks between the database caches of each node.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_188_0.png)


    Figure 7-1 Oracle9i RAC architecture for 2-node cluster'
  merge: -1
  pgno: 188
- img_proc: true
  md: 'With this new version of Oracle several terminology differences are introduced
    by Oracle that more accurately describe the functionality of the product. See
    Table 7-1 for highlights of the new terms.


    # Table 7-1: Oracle9i RAC Terminology


    | Term | Definition |

    | Cluster Database | A single databases accessible from multiple nodes at the
    same time. Unlike MPP databases, data is still available with few as one node
    of the database. In Oracle9i this was referred to as a parallel database. |

    | Global Cache Service (GCS) Global Enqueue Service (GES) | The GCS and GES services
    handle management functions that previous Oracle releases used with a distributed
    lock manager (DLM). |

    | Service Control (SRVCTL) | Real application clusters use a utility named srvctl
    to manage database instances. SRVCTL is a single interface of control that can
    be used to start or stop all database instances. |

    | Global Services Daemon (GSD) | The GSD process communicates with SRVCTL to run
    management tasks such as database startup and shutdown. GSD runs locally on each
    node of a cluster. |

    | Server Management (SRVM) | SRVM is a component of the Oracle Enterprise Manager.
    OEM and SRVM provide system management capabilities for RAC. SRVM also includes
    job scheduling, event management, performance monitoring, and statistics to assist
    in tuning a cluster database.'
  merge: -1
  pgno: 189
