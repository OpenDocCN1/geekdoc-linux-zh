  md: '# Install X-Server for Remote Access


    If your server does not have a graphics display, you will need to install an X-Server
    before installing Oracle. Several good third-party X-Servers are available for
    all popular desktop platforms. These X-Servers operate on the desktop machine
    to display the graphics console. One disadvantage of having the X-Server run on
    a desktop or laptop is that the connection will be terminated if the desktop is
    rebooted, disconnected, or shut down.


    A free utility called virtual network computing (VNC) is available from AT&T research.
    The VNC server will be installed on the Tru64 UNIX server and viewed with a client
    tool running a desktop computer. This approach has the advantage of allowing the
    desktop to reboot or disconnect and reconnect at a later time without terminating
    the active session.


    Download Tru64 UNIX version (DEC Alpha OSF1) of the server along with a client
    version for your desktop computer.


    ```

    http://www.uk.research.att.com/vnc/

    ```


    +   66. Start the vncserver. The first time it is run a new password must be set.
    The password for VNC is separate from the UNIX password.

    rac1> ./vncserver


    You will require a password to access your desktops.

    Password: ******

    Verify: ******


    New ''X'' desktop is rac1.my.domain.com:1


    Creating default startup script /home/oracle/.vnc/xstartup

    Starting applications specified in /home/oracle/.vnc/xstartup

    Log file is /home/oracle/.vnc/rac1.my.domain.com:1.log


    +   67. Connect to the VNC desktop using the vncviewer available for most desktop
    operating systems. The client connection contains the server name and the port
    number assigned during vncserver startup. In Figure 3-2 the server name is rac1.my.domain.com
    and the session is 1.'
