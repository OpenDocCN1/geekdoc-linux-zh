    | | # init s | | ✓ |

    | | # bcheckrc | | ✓ |

    | | # lmf reset | | ✓ |

    | | # clu_upgrade roll | | ✓ |

    | Switch | # clu_upgrade switch | ✓ | |

    | | # reboot | ✓ | |

    | | # reboot | | ✓ |

    | Clean | # clu_upgrade clean | ✓ | |

    | | # clu_upgrade -v status | ✓ | |'
  merge: -1
