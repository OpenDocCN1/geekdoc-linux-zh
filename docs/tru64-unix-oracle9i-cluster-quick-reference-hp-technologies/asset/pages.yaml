- img_proc: true
  md: 'The escalate option will create a tar file containing system information and
    files used by Compaq technical support. The most recent crash file is compressed
    and included with the sys_check output.


    ```

    rac> sys_check -escalate

    ```


    Full sys_check report:


    ```

    rac> sys_check -all > sys_check.html

    ```


    > Tip: Run sys_check monthly to track system configuration changes.


    Default is “quick output” with no command line options. The quick output does
    not include security information and the set1d inventory checks.


    To report system performance information use the “-perf” option.


    ```

    rac> sys_check -perf > sys_check_perf.html

    ```


    # Event Manager


    The Event Manager (EVM) is used to handle system events from many sources and
    provides a centralized view of messages and events. The event viewer can be accessed
    using the sysman utility.


    ```

    rac> sysman event_viewer

    ```'
