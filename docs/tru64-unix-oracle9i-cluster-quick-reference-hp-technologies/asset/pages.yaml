  md: 'Collect can interactively display process information using the following example.

    This will display process information on the screen in a scrolling list similar
    to the top output.


    ```

    racl> collect -sp

    ```


    # Collect


    Collect is a tool now bundled into the Tru64 UNIX 5.x system installation that
    displays real-time system information along with the ability to record performance
    data and play it back later. The collect playback feature can output output available
    data or filter on a subsystem.


    Run collect in interactive mode to view specific system information. This example
    starts collect and displays CPU statistics and total disk throughput at 2-second
    intervals. Individual CPU information will also be displayed in the report.


    ```

    racl> collect -sc -T i2

    ```


    ```

    Initializing (2.0 seconds) ... done.

    #### RECORD 1 (100433907:0) (Mon Oct 29 10:45:07 2001) ####

    # TOTAL THROUGHPUT

    DISK: 0.02 MB/Sec 2.50 Trans/Sec TAPE: 0.00 MB/Sec 0.00 Trans/Sec

    # CPU SUMMARY

    # USER SYS IDLE WAIT INTR SYS CS RUNQ AVG5 AVG30 AVG60 FORK VFORK

    0 0 100 0 82 678 0 0.02 0.00 0.00 0.00 0.00

    # SINGLE CPU STATISTICS

    # CPU USER SYS IDLE WAIT

    0 0 100

    1 0 100

    ```


    One of the best features with the collect tool is the ability to record performance
    information for all subsystems and at a later time playback and display the performance
    data. The playback might output to a flat file that can be imported into a spreadsheet,
    graphed, or playback to a UNIX graphing tool used to display the results on a
    Web server.


    Record performance data to a binary file named collect_data. Every 30 seconds
    all process and system information is recorded to this file until Control-C is
    pressed.


    ```

    racl> collect -i30 -f collect_data

    ```


    To playback a collect file to standard out or redirect output to a text file use
    the “-p” option and specify the collect filename.


    ```

    racl> collect -p collect_data.cgz | more

    ```'
