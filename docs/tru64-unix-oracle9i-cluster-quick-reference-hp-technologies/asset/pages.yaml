  md: 'The example tape library in Figure 10-1 provides a guide for all robotic tape
    library configurations. Tape libraries range from single drive and ten slots to
    16 drives and 326 slots. Slots are numbered starting with 0 through the number
    of total slots contained in a library. Ports are also numbered starting with 0
    up to the number of ports supported by the library. The load port is a convenient
    way to load or unload tapes into the library.


