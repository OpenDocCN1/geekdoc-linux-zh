  md: '# mkfdmn


    mkfdmn [options] [disk device] [domain name]


    Create new domain using specified disk or LSM volume.


    Create a file domain on the block special device.

    # mkfdmn /dev/disk/dsk5c u01_domain


    Create file domain on LSM volume.

    # mkfdmn /dev/vol/rootdg/u01_volume u01_domain


    You can add the -1 option to specify a logfile size, but the default size should
    be sufficient.


    # mkfset


    mkfset [options] [domain] [fileset]

    mfset command creates a new fileset for an existing file domain. Domains can have
    multiple filesets. A domain is not available for use until the filesets are mounted.


    In this example a fileset named oracle is created on the domain named u01_domain.

    # mkfset u01_domain oracle


    # mount


    mount [options] [device] [mount point]


    Create mount directory and mount the file domain.


    # mkdir /u01


    If /etc/fstab contains the file domain and fileset, the following mount will work.

    # mount /u01


    To mount a file domain and fileset not defined in /etc/fstab use this mount command.

    # mount u01_domain#u01'
