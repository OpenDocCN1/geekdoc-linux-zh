  md: '# Cluster Command Summary


    Use the cdslinvvchk command to check and verify the inventory of context dependent
    symbolic links (CDSLs). If a CDSL is accidentally removed the cluster will not
    function properly.


    ```

    # cdslinvvchk

    ```


    Successful CDSL inventory check


    > **Warning:** Building a new UNIX kernel and using the move command (mv) to vmunix
    to root is one of the ways to erase a CDSL link. The UNIX cp command should be
    used to copy the vmunix file to root.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_150_0.png)


    If you are not sure a file contains a CDSL, use ls -l with a filename. The CDSL
    for vmunix looks like this:

    /vmunix -> cluster/members/{mem}/boot_partition/vmunix


    If the inventory check fails as shown in this example, view the log file listed
    and determine if the CDSL is needed or should be removed.


    ```

    # cdslinvvchk

    ```


    Failed CDSL inventory check. See details in /var/adm/cdsl_check_list


    ```

    # cat /var/adm/cdsl_check_list

    ```


    To move the CFS server from one member to a different member use the cfsmgr command.
    View the domain to see which node is serving the filesystem. In this example the
    /usr domain will be relocated. Note that the /usr filesystem is served from the
    node rac2.


    ```

    # cfsmgr /usr

    ```


    Domain or filesystem name = /usr

    Server Name = rac2

    Server Status : OK


    Relocate the filesystem. No output is produced from this command at the command
    line. The relocation is logged in the UNIX message file /var/adm/messages and
    will also appear on the console.


    ```

    # cfsmgr -a server=rac1 /usr

    ```


