  md: "The run command will start a specified diagnostic utility program. The diagnostic\
    \ program will always run on `this_controller`.\n\n# Diagnostic and Utility Programs\n\
    \n`clcp` This utility is used to load new software code or patches.\n\n`clone`\
    \ The clone utility is used to automate the process of mirroring units and to\
    \ create a snapshot copy.\n\n`config` Use the config utility to locate and add\
    \ new disk devices to a controller configuration.\n\n`dilx` This utility is used\
    \ to test and verify a controller with storage devices under I/O load. Run this\
    \ utility only when the controller has no activity.\n\n`direct` The direct command\
    \ will output a list of all executable diagnostic and utility commands in the\
    \ controller.\n\n`fmt` The fault management utility is used to display information\
    \ on the newest controller system failure. \n\n`frutil` This utility is used to\
    \ replace a failed controller, cache battery, or cache module.\n\n`hsutil` The\
    \ hsutil utility is used to format a disk or download new firmware to a disk.\n\
    \n`vtdpy` The vtdpy utility provides the controller state, performance data, processor\
    \ utilization, data replication manager (DRM) activity, and I/O performance.\n\
    \nExample use of the run command:\n\n```\nHSG> run config\n```\n\nThe seltest\
    \ command will flush data in the write-back cache to disk, shut down the controller,\
    \ and restart in looping self-test mode. To take a controller out of self-test\
    \ mode you need to press the controller reset ( // ) button.\n\n```\nHSG> seltest\
    \ other_controller\n```\n\n```\nHSG> seltest this_controller\n```\n\nTo ignore\
    \ any write-back cache errors add the ignore_errors options to the seltest command.\
    \ Errors in the write-back cache that are ignored may result in lost data errors.\n\
    \n```\nHSG> seltest this_controller ignore_errors\n```\n\nThe set command is used\
    \ to modify the RAID controller configuration.\n\nAdditional examples of the set\
    \ command:\n\n```\nHSG> set multibus_failover\n```\n\n```\nHSG> set nofailover\n\
    ```"
