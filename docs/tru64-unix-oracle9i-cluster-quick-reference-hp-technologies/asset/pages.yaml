    \ example member1 or member2 for a 2-node cluster.\n\n```\n# ls -l notes.txt\n\
    lrwxrwxr-x 1 root system 41 Jan 16 18:21 notes.txt -> \\\n  ../cluster/members/{memb}/local/notes.txt\n\
    ```\n\nTo move an existing file or directory to the member’s CDSL directory, enter\
    \ the following command:\n\n```\n# mkcdsl -c /usr/local/file1.txt\n```\n\nTo remove\
    \ a CDSL use the rm command and remove the link. To update the CDSL inventory\
    \ database using the following command:\n\n```\n# rm /usr/local/notes.txt\n# mkcdsl\
    \ -i /usr/local/notes.txt\n```\n\nThe file /var/adm/cdsl_admin.inv stores a record\
