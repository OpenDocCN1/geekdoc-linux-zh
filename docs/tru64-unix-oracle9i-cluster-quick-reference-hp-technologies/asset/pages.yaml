  md: '# Introduction


    Like most IT professionals, I have a bookshelf of technical books ranging from
    hardware setups to operating systems and software. These books are generally very
    thorough in covering the subject they set out to document but tend to omit information
    that connects their subject to other related subjects.


    It can be challenging for someone new to the installation of a UNIX and Oracle
    system to correctly configure it and set it up. So, for a long time I’ve seen
    the need for a book that serves to jump start the installation process.


    My book walks through one form of the installation of a Tru64 UNIX 5.1A cluster
    with Oracle9 RAC (Real Application Cluster). There are many different approaches
    to the installation process, and I have documented the most efficient methods
    and practices. The book covers a 2-node installation from start to finish. Each
    chapter is organized into a brief introduction of the configuration, setup steps,
    and a command summary related to each topic. For anyone new to the configuration
    and setup of a Tru64 UNIX cluster, this book contains beneficial information that
    will assist during complete process. For the advanced user, this quick reference
    guide will also provide a useful desk reference for looking up an occasional command.


    To use this book successfully, review all the information in a given chapter.
    Then follow the steps in precisely the order given. If there are a variety of
    methods to achieve a goal, the “optional” icon will appear in the margin at that
    point in the text (see Table i-2). It is important to complete the tasks described
    in these chapters in the order given, and to follow the steps within each chapter
    sequentially, in order to successfully complete your installation.


    Because we are documenting a snapshot of production software, over time you can
    expect changes and differences. Some command output, or screens may look different
    on various systems, and they are subject to change as updates arrive for Tru64
    UNIX and Oracle9.'
