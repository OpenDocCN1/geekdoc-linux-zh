    # Define the Raidsets


    +   18. Define a raidset for the shared cluster operating system disk. Start by
    creating a (6) member RAID 5 set.


    ```

    HSG1_a> add raidset r1 disk10000 disk20000 disk30000 disk40000 disk50000 disk60000

    ```


    +   19. Initialize the raidset. The default chunksize of 256 blocks (128k) offers
    the best overall mixed workload performance.


    ```

    HSG1_a> initialize r1

    ```'
