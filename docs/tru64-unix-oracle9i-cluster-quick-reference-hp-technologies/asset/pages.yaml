  md: 'error messages, which will appear on the surface to indicate a much larger

    problem or improper kernel setting.


    ```

    # ------------------------------------

    # Raise default shell limits for Oracle VLM

    # ------------------------------------

    ```


    ```

    ulimit -d 8388608      # Datesize 8GB

    ulimit -v 8388608      # Virtual Memory 8GB

    ulimit -s 32768               # Stack Area

    ```


    56. Change the default prompt to include hostname, username, and path. The

    prom is a preference setting and may be different for each customer. The

    example prompt includes the hostname, username, and path. The default "#"

    prom can sometimes lead to mistakes and accidents, including shutting down

    the wrong server or removing files from the wrong directory.


    ```

    #

    # Set up Standard Prompt

    # ------------------------------------

    export WHERE=''hostname -s''

    export PS1=''

    $USER @ $WHERE:$PWD

    ```


    57. The settings included here are useful ways to shorten commands, view

    Oracle alert information, or jump to a directory. These will be placed into the

    common shared profile, but the user still either the alias or modify it to

    have a different behavior. Modifications are made to the users’ profile located
    in

    the home directory—for example, /home/oracle/.profile.


    ```

    # ------------------------------------

    # Setup Alias

    # ------------------------------------

    alias df=''df -k''

    alias ls=''ls -F''

    alias w=''w | sort''

    alias tn=''telnet''

    alias oa=''tail -f -50 $ORACLE_BASE/admin/${DB_NAME}/bdump/ \

    alert_($ORACLE_SID).log''

    alias oh=''cd $ORACLE_HOME''

    ```'
