- img_proc: true
  md: '# poweroff


    Use the poweroff command to turn off power to the subsystem cabinet. This command
    only works on the RA8000 subsystem. It is not available on the MA8000 subsystem.


    To power off disks and controller in 10 seconds use this command.


    ```

    HSG> poweroff seconds=10

    ```


    # reduce


    This command will remove a member disk from a mirrorset without putting the disk
    into a failedset.


    If a mirrorset contains disk10100 and disk20100, this example will remove disk10100
    from the mirrorset.


    ```

    HSG> reduce disk10100

    ```


    # rename


    This command will rename a container or connection name usually to match a hostname
    or switch name. The default connection names are in the form !NEWCON0. The rename
    command will set the connection name to a custom user-specified string.


    In this example, a connection is renamed to match a host named rac1.


    ```

    HSG_a> rename newcon00 rac1-00

    ```


    In this example a container (raidset) will be renamed. Containers are disks, raidsets,
    or units.


    ```

    HSG_a> rename raid1 r1

    ```


    # restart


    This command will flush any unwritten data in the cache and will cause a controller
    to reset.


    You can restart either controller with the restart command. In the following example
    both controllers will be restarted.


    ```

    HSG> restart other_controller

    ```


    ```

    HSG> restart this_controller

    ```


    # retry_errors


    The retry_errors command will cause the controller to attempt to write previously
    unwriteable data from the write-back cache to disk if a container fails and is
    unable to write the data to the write-back cache. The retry_errors command will
    attempt to write the unwriteable data. If the retry fails, no data is lost.


    Specify a unit with the retry_errors command.


    ```

    HSG> retry_errors d100 unwriteable_data

    ```'
