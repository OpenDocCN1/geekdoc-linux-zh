  md: '# Performance Tools Command Summary


    collect [ options ]


    The collect utility is used to view performance information for most subsystems.
    Data can be displayed on a terminal or stored in a compressed file.


    Display memory information every two seconds.


    ```

    # collect -sm -i2

    ```


    Display CPU information every two seconds.


    ```

    # collect -sc -i2

    ```


    Display aggregate disk performance every two seconds.


    ```

    # collect -T -i2

    ```


    Display network and memory every two seconds.


    ```

    # collect -snm -i2

    ```


    Record statistics to a compressed binary file.


    ```

    # collect -i30 -f collect_data

    ```


    Play back collect information from a recorded file. The playback option supports
    the same options used during interactive sessions. For example, you can play back
    only the CPU information from a recorded file. Without any options specified,
    all recorded information is played back.


    ```

    # collect collect_data.cgz | more

    ```


    Play back only CPU information.


    ```

    # collect -sc -p collect_data.cgz | more

    ```'
