    This option will encapsulate the root disk in LSM and is typically used for software
    mirroring of the operating system.


    > Note: Do not choose LSM for the operating system disk if it is hardware RAID
    protected.


    It is recommended that some form of hardware RAID protection be used to protect
    the operating system disk in case of disk failure. If the operating system disk
    is encapsulated with LSM, additional management steps will be introduced into
    the cluster.


    *** File System Selection ***


    The Logical Storage Manager (LSM) is a disk storage management tool that can protect
    against data loss through the use of disk mirroring, can improve disk I/O performance
    through the use of disk striping, and can dynamically extend available disk storage
    through the use of disk concatenation. Mirroring and striping through LSM require
