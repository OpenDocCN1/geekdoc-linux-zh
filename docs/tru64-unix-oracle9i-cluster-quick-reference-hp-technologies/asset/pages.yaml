  md: '# voldg


    The voldg command is used to administer disk groups. Options include creating
    new disk groups, adding disks to existing disk group, and import, or deporting
    disk group.


    Create a new disk group named data using disk dsk10.


    ```

    # voldg init data dsk10

    ```


    Import the disk group named data.


    ```

    # voldg import data

    ```


    Deport the disk group named data.


    ```

    # voldg deport data

    ```


    Add dsk10 to the default rootdg disk group.


    ```

    # voldg adddisk dsk10

    ```


    Remove the disk dsk10 from the default rootdg disk group.


    ```

    # voldg rmdisk dsk10

    ```


    Remove the disk dsk20 from the disk group data.


    ```

    # voldg -g data rmdisk dsk20

    ```


    List all defined disk groups using the list option.


    ```

    # voldg list

    ```


    # voldisk


    Use voldisk to define and manage LSM disks.


    View all disks in the default disk group rootdg.


    ```

    # voldisk list

    ```


    View all disks in the disk group data.


    ```

    # voldisk -g data list

    ```


    Remove a disk from the LSM configuration. The disk should not be part of any disk
    group before removing.


    ```

    # voldisk rm dsk1

    ```'
