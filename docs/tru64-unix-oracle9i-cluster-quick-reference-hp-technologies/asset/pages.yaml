    > Tip: Data was deleted from a table at 8:05AM on October 24, 2001. Return the
    database to the condition before this occurred execute the flashback query for
    8:00AM. Make sure the following query is input on one line.

    SQL> execute dbms_flashback.enable_at_time \

    (TO_TIMESTAMP ''''10-24-2001 08:00:00'', \

    ''''MM-DD-YYYY HH24:MI:SS'''');


    69. Before continuing, execute the following statement:

    SQL> execute dbms_flashback.disable;

    PL/SQL procedure successfully completed.


    This completes the Oracle9 flashback query example. Many other uses of this feature
