- img_proc: true
  md: '# Calculate LSM Stripe Size


    7. Using the volprunt output, locate the disk size column and find the smallest
    disk in the output. In this example dsk911 and dsk912 (69,313,003 blocks) are
    slightly smaller than disks dsk12–dsk17 (71,091,292 blocks). In order to stripe
    the disks together the smallest disk size will be used to create the subdisk.


    ```

    rac2> volprunt -ht

    ```


    Disk group: rootdg


    | DG NAME | NCONFIG | NLOG | MINORS | GROUP-ID | |

    |---|---|---|---|---|---|

    | DM NAME | DEVICE | TYPE | PRIVLEN | PUBLEN | STATE |

    | V NAME | USEYPET | KSTATE | STATE | LENGTH | READPOL | PREFPLEX |

    | PL NAME | VOLUME | KSTATE | STATE | LENGTH | LAYOUT | NCOL/WID MODE |

    | SD NAME | PLEX | DISK | DISKOFFS | LENGTH | [COL]/OFF DEVICE | MODE |


    ```

    dg rootdg default 0 998763001.1026.rac

    ```


    | dmsk12 | dsk12 | sliced | 4096 | 7109192 - - |

    |---|---|---|---|---||

    | dmsk13 | dsk13 | sliced | 4096 | 7109192 - - |

    | dmsk14 | dsk14 | sliced | 4096 | 7109192 - - |

    | dmsk15 | dsk15 | sliced | 4096 | 7109192 - - |

    | dmsk16 | dsk16 | sliced | 4096 | 7109192 - - |

    | dmsk17 | dsk17 | sliced | 4096 | 7109192 - - |

    | dmsk911 | dsk911 | sliced | 4096 | 69313003 - - |

    | dmsk912 | dsk912 | sliced | 4096 | 69313003 - - |


    8. Round each disk''s size down to an even multiple of the stripe size. The stripe
    size used in this example will be 512 blocks (256K).


    ```

    69313003 / 512 = 135376.9588

    ```


    Truncate the result and multiply by the stripe size of 512 blocks.


    ```

    135376 * 512 = 69312512

    ```


    Use 69312512 blocks for all subdisks in the stripe.


    9. Use the volmake command to create subdisks.


    ```

    volmake sd subdisk-name device, offset, size

    ```


    > Warning: If the subdisk size is not an even multiple of the plex stripe size,
    the LSM volume will not start. You will then see the following error message:


    ```

    lsm:volume: ERROR: Volume u01_volume has no

    ```


    complete, non-volatile ACTIVE plexes


    The volume, plex, and subdisks must be removed, and you will need to recalculate
    the correct stripe size.'
  merge: -1
  pgno: 165
- img_proc: true
  md: '```

    rac2> volmake sd dsk12-01 dsk12,0.69312512

    rac2> volmake sd dsk13-01 dsk13,0.69312512

    rac2> volmake sd dsk14-01 dsk14,0.69312512

    rac2> volmake sd dsk15-01 dsk15,0.69312512

    rac2> volmake sd dsk16-01 dsk16,0.69312512

    rac2> volmake sd dsk17-01 dsk17,0.69312512

    rac2> volmake sd dsk911-01 dsk911,0.69312512

    rac2> volmake sd dsk912-01 dsk912,0.69312512

    ```


    +   10. Create a striped plex with a stripe size of 256k. Use u01_plex as the
    plex name. This will become the /u01 filesystem.


    ```

    rac2> volmake plex u01_plex sd=dsk911-01,dsk912-01, \

    dsk12-01,dsk13-01,dsk14-01,dsk15-01,dsk16-01, \

    dsk17-01 layout=stripe width=256k

    ```


    +   11. Create a volume named u01_volume using the u01_plex and start the volume.
    These commands should complete without any error messages.


    ```

    rac2> volmake -U gen vol u01_volume plex=u01_plex

    rac2> volume start u01_volume

    ```


    # Removing LSM Volume, Plex, and Subdisks


    To remove and reconfigure a volume issue the following commands. Use this procedure
    only if errors were encountered during the previous volume setup steps.


    > **Warning:** All data stored on the volume will be lost during this procedure.
    Make sure information is backed up before issuing these commands.


    Stop the LSM volume. Before a volume can be stopped, it can''t be in use. If the
    volume contains a mounted filesystem, it must be unmounted or the stop command
    will fail.


    ```

    rac2> volume stop u01_volume

    ```


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_166_0.png)'
