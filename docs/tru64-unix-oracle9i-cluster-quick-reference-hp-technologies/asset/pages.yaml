  md: '# HSG RAID Controller Commands


    You can use the run_config command or the add disk command to add new disks to
    a controller configuration.


    add disk


    To add new disk at port 1, target 2, LUN 0, enter for following.


    ```

    HSG> add disk10200 1 2

    ```


    Disks can be transportable, which means that a single disk can be moved to a non-StorageWorks
    environment with data intact. By default, disks are added as nontransportable.


    To add disk40200 as a transportable drive to port 4, target 2, LUN 0, enter:


    ```

    HSG> add disk disk40200 4 2 0 transportable

    ```


    The default transfer rate is 20MHz and can be changed with a transfer_rate_requested
    switch. This is the maximum data transfer rate at which the controller is allowed
    to communicate with a device.


    ```

    HSG> add disk40200 4 2 0 transfer_rate_requested=10mhz

    ```


    The add mirrorset creates and names a mirrorset and then adds the configuration
    to the controller. The usable capacity is limited to the smallest member in the
    mirrorset. Use disks on separate controller ports for high availability. In this
    example, m1 is the new mirrorset name.


    add mirrorset


    ```

    HSG> add mirrorset m1 disk10100 disk20100

    ```


    This command creates a RAID 3/5 storages. Supply the raidset name and disks. In
    this example, r1 is the new raidset name. A minimum of three disks must be specified
    to form a raidset.


    add raidset


    ```

    HSG> add raidset r1 disk10000 disk20000 disk30000 disk40000

    ```


    The usable capacity is calculated using this formula; it is not always 20% and
    varies with the number of members.


    ```

    usable space = (number of members - 1) * disk size

    ```


    # Disk Size


    9GB Disk = 8.4GB


    18GB Disk = 17.0GB


    36GB Disk = 34.5GB


    72GB Disk = 67.8GB'
  merge: -1
  pgno: 62
- img_proc: true
  md: '# add snapshot units


    The add snapshot units command creates and names a snapshot. A snapshot unit is
    taken at a point in time to present a unit back to a host. Use one of a snapshot
    is a cold database backup when the database can be down only for a few minutes.


    In this example, d4 is the new unit name, r1 is the raidset that will be used
    for the snapshot copy, and d1 is the original source unit.


    ```

    HSG> add snapshot_units d4 r1

    ```


    # add sparset


    The add sparset command adds a drive to be used to replace a failing member in
    a raidset or mirrorset. A sparset must be equal to or larger than the member it
    will replace. Two hot spares controller pair is a good standard.


    ```

    HSG> add sparset disk60000

    HSG> add sparset disk10300

    ```


    # add stripeset


    This command creates a RAID level 0 storageset. RAID 0 offers no data protection
    unless you create striped mirrored sets or a software mirror using LSM.


    ```

    HSG> add stripeset s1 disk10100 disk20100 disk30100

    ```


    Example 2-member striped mirrorset from two mirrors named m1 and m2.


    ```

    HSG> add mirrorset m1 disk10000 disk20000

    HSG> add mirrorset m2 disk30000 disk40000

    HSG> add stripeset stripe1 m1 m2

    HSG> initialize stripe1

    HSG> add unit d1 stripe1

    ```


    # add unit


    The add unit command creates a logical unit for a connected host to access. A
    unit is a container for disk devices, stripesets, raidsets, mirrorsets, partitions,
    and striped mirrorsets.


    Unit numbers are prefixed by D and are in the range of 0–199.


    In this example, a new unit named d1 is created with raidset r1.


    ```

    HSG> add unit d1 r1

    ```'
  merge: -1
  pgno: 63
- img_proc: true
  md: 'To clear the display of current or previous error messages at the CLI prompt
    the clear_errors cli command. This command only clears the CLI error messages
    and does not clear the error condition that caused the error.


    # clear_errors cli


    HSG> clear_errors cli


    This command clears an invalid cache state allowing a controller to resume operation.
    This command is used when cache modules have been replaced or a controller is
    not properly shut down.


    # clear_errors invalid cache


    The unflushed data option instructs the controller how to handle write-back cached
    data.


    Use nodestroy_unflushed_data to preserve any unwritten data in cache to write
    to disk at a later time.


    HSG> clear_errors this_controller invalid_cache nodestroy_unflushed_data


    > Warning: Improper use of this command may result in the loss of data.


    The destroy_unflushed_data discards unwritten cache data.


    HSG> clear_errors this_controller invalid_cache destroy_unflushed_data


    This command forces a controller to recognize a failed device, regardless of previous
    conditions. A controller failure may cause a device to become unknown. This command
    is used after a problem has been corrected so the the controller can recognize
    the device again.


    # clear errors device unknown


    HSG> clear_errors disk10200 unknown


    This command will clear lost data on a unit. All partitions on a unit will also
    be affected. The controller reports lost data when a write-back cache module is
    removed or when the cache module contains unflushed data. This error is common
    if a controller is improperly shut down with the loss of power without any backup
    power present.


    # clear errors unit lost data


    The clear_errors unit lost_data command clears the lost data error but does not
    recover the data.


    HSG> clear_errors d1 lost_data'
  merge: -1
  pgno: 64
- img_proc: true
  md: '# clear errors

    unwriteable

    data


    This command clears an unwriteable data error on a unit. If a disk fails before
    its data has been written to it, the controller will report an unwriteable data
    error. The clear_errors unit unwriteable_data command removes data from the cache
    and clears the unwriteable data error.


    > > Warning: This command will cause data loss.


    HSG> clear_errors d1 unwriteable_data


    # configuration

    reset


    This command will erase the entire subsystem configuration file stored in the
    controller NVRAM. The controller will be set to the default factory configuration
    and will be shut down.


    The controller must be set to nofailover mode only. The controllers should have
    mirrored cache disabled before resetting to avoid controller invalid cache errors.


    Enter this command when a controller is moved from one system to another.


    The configuration reset command can be issued from the operator control panel
    (OCP) by holding the button on port 5 and pressing the RESET button.


    HSG> configuration reset


    # configuration

    restore


    Use the configuration restore command to recover a configuration file saved on
    the disk array. This command will cause a controller to reboot.


    > > Note: Use this command only for a single controller configuration and not
    for dual-redundant configurations.


    HSG> configuration restore


    # configuration

    save


    This command forces a controller to copy the subsystem configuration stored in
    memory to a configuration file on disk.


    > > Note: This command is appropriate only for single-controller configurations,
    not dual-controller configurations.


    HSG> configuration save'
