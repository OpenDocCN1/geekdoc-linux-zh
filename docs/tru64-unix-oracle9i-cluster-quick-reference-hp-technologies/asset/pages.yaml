    The steps used to create this 2-node cluster apply also to 4-node and 8-node clusters.
    Many of the examples used throughout this book are universal to a single-node
    non clustered system.


    This quick reference guide uses graphic icons as shown in the following table
    to quickly locate information or to alert a reader to important information.


    # ### Table i-2: Graphics Used


    | Icon | Name | Description |

    |---|---|---|

    | | Optional | Some information is optional and is noted next to the subject with
    the optional icon. The optional information provides alternative methods to complete
    a task. |

    | | Timer | The time clock is used as a guide to estimate the amount of time to
