  md: '# Chapter 3 — Tru64 UNIX Installation


    # Overview


    The hardware installation should be complete along with the storage configuration
    containing member boot device before proceeding with the Tru64 UNIX installation.


    The initial installation from CD-ROM creates an installation disk which will be
    used to create the cluster root disk. From the cluster root multiple member disks
    are created.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_74_0.png)


    Plan 1 Hour and 30 Minutes to Install Tru64 UNIX


    # Before You Start


    Complete the template in Table 3-1 for your new system. This information will
    be used for the Tru64 UNIX installation and the cluster configuration.


    ### Table 3-1: Checklist Before You Install

    | Category | Example | New System |

    |---|---|--|

    | Cluster Alias Hostname | rac | |

    | Host 1 Hostname | rac1 | |

    | Node 2 Hostname | rac2 | |

    | Domain Name | my.domain.com | |

    | Cluster Alias IP Address | 192.168.1.50 | |

    | Node 1 IP Address | 192.168.1.51 | |

    | Node 2 IP Address | 192.168.1.52 | |

    | DNS Server IP Address | 192.168.200.100 | |

    | NTP IP Address | 192.168.200.25 | |'
