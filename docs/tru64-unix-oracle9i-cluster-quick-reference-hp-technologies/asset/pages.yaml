  md: 'Tip: SQL loader supports data input from a UNIX pipe. The pipe can have data
    copied from a tape or an application program that writes output to a file.


    Create UNIX pipe.


    ```

    # mkfifo data_file.pipe p

    ```


    Replace the filename specified in the SQL loader control file with the name of
    the UNIX pipe.


    ```

    infile ''data_file.pipe''

    ```


    Start SQL loader before starting the application or tape operation that will copy
    data into the pipe.


    # Direct Paths Loader


    To improve load times use the direct and parallel option specified in the loader
    control file. By default the SQL loader uses a conventional SQL insert to load
    data. Use the direct option to allow SQL loader to copy data into database blocks
    directly.


    ```

    options (direct=true, parallel=true)

    ```


    # Oracle 9i External Table Example


    External tables are one of the new features available in Oracle9i. The table can
    be accessed just like any table inside of the database. The table definition points
    to a file just like the one used with Oracle SQL loader with the added benefit
    of not having to actually load the data into a tablespace. The data contained
    in the external table can be accessed from within Oracle just like a normal table.
    External tables are read-only; you can''t insert or update records in the external
    table.


    +   50. Using the same text file a1.data created previously, access the file as
    an external table, skipping the SQL loader step. Create a new directory and copy
    the text file into this directory. Create this directory using the oracle UNIX
    account. Oracle must have read/write access to the directory.


    ```

    oracle@rac1- mkdir /u01/oradata/external

    ```


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_243_0.png)'
