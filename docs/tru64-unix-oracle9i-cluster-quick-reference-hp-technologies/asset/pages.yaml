  md: '# AdvFS and Disk Commands


    addvol [options] [special] [domain]


    The addvol utility dynamically adds volumes to an existing file domain.

    # addvol device_name domain_name


    This functionality is also available from the sysman menu.


    For example, to add volume dsk3c to the file domain resources:


    ```

    # addvol /dev/disk/dsk3c resources

    # addvol /dev/disk/dsk3c domain_1

    ```


    balance [options] [domain]


    Use the balance utility to redistribute file data evenly among multiple disk volumes.
    Run balance only on AdvFS domains with more than one volume. If LSM is used to
    stripe data, this command is not needed since file data is always evenly distributed.
    Use showdmn to see if a domain is out of balance.


    ```

    # balance domain_1

    ```


    Use the verbose option to display information about files are are being moved.
    This option will make the balance process run slower.


    # balance -v domain_1


    chfsets [options] [domain] [fileset]


    Use chsets to modify the attributes of AdvFS filesets for disk quotas. Quotas
    can be set up as hard limits or soft limits. Normally, it is not necessary to
    set hard quotas on filesystems by Oracle unless other applications or files will
    be combined into the same filesystem.


    ```

    # chfsets -B 50000 data_domain oradata

    ```'
  merge: -1
  pgno: 182
