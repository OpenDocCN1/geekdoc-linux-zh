  md: '# Chapter 5 — Logical Storage Manager


    # LSM Overview


    The logical storage manager (LSM) is used to manage storage containers or storage
    pools referred to as logical volumes.


    LSM is not a requirement for Oracle9 RAC, but when used it can improve overall
    I/O performance without manual file placement. Using LSM to stripe multiple raidsets
    can improve overall Oracle I/O performance. The Oracle database files will be
    balanced across all members in the stripe set.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_158_0.png)


    # Plan 10 Minutes for LSM Setup and Configuration


    # Why Use LSM?


    +   • Software striping of hardware raidsets for improved I/O throughput

    • Disk consolidation, reducing number of independent disks or raidsets

    • Requirements for large filesystem support beyond size of single raidset

    • Software mirroring and hardware RAID for highest data availability


    # Some Configurations Will Not Require the Use of LSM


    +   • Few disks in configuration (only 2–3 disks)

    • Don’t want extra administration step and management

    • May want to use AdvFS striping

    • Oracle database files will be manually placed on disks


    # S.A.M.E. (Stripe and Mirror Everything)


    For some configurations Oracle and Compaq recommend “S.A.M.E.” All disks used
    in the database are hardware mirrored and striped together using LSM. The mirroring
    and striping is also referred to as RAID 10. A few things to remember using RAID
    10:


    +   • Mirrored storage can become costly

    • Weigh redundancy and performance verses cost

    • Keep volumes to a manageable size (400GB, 800GB, 1000GB, etc.)

    • Set the proper stripe size using LSM

    • Stripe disks from multiple controllers for best performance and availability'
  merge: -1
  pgno: 158
- img_proc: true
  md: '# S.A.R.E. (Stripe Raid Everything)


    The S.A.R.E. uses the same approach as S.A.M.E, but instead of hardware mirroring
    RAID 5 is substituted. This is a more cost effective solution and also provides
    excellent performance. The RAID 5 stripe sets are referred to as RAID 50.


    # LSM Setup Options


    LSM can be administered using any combination of the four tools available in Tru64
    UNIX. Some of the tools automate most of the steps, and some are very manual.


    +   - LSM Command Line

    - LSM Command Menu Assistant

    - Graphical Interface (dxlsm)

    - Graphical Menu Interface (lsmsa)


    In this chapter the LSM command line interface is used to set up and create the
    LSM volume used for Oracle. The command line provides the best step-by-step process
    for learning and understanding. The LSM tools (dxlsm, lsmsa, and volassist) that
    automate most of the manual steps accomplish the same task but leave the process
    hidden from view.


    The most common forms of RAID are shown in Table 5-1. The table does not include
    all of the RAID types available today.'
  merge: -1
  pgno: 159
- img_proc: true
  md: '# Table 5-1: RAID Terminology


    | RAID | Description |

    |---|---|n| 0 | Disk striping, multiple disks with data spread across the disks
    in parallel, no data protection. |

    | 1 | Disk mirroring with hardware or software; data from one disk is copied to
    another disk of the same size. Data is protected in the event of a disk failure.
    This option can be costly, since 50% of the total storage is used for redundancy.
    |

    | 5 | Disk striping with parity; data is evenly distributed to the disks along
    with parity information. Data is protected in the event of a disk failure. More-effective
    than mirroring. Slower write performance than with a mirror. |

    | 10 | Mirrored stripe sets are used to improve I/O throughput. This is also known
    as RAID 0+1. This can be implemented in hardware or software. |

    | 50 | Hardware RAID 5 with software striping. Used to improve aggregate read
    and write performance and to increase volume sizes. |


    # LSM Quick Summary


    +   * Initialize LSM database and add disks

    * Start LSM daemon on additional nodes

    * Create subdisks

    * Add subdisks to plex

    * Add plex to volume

    * Start the volume

    * LSM verification


    For more information on LSM see:


    **Tru64 UNIX Logical Storage Manager**

    Part Number: AA-RH9BB-TE, August 2000

    Product Version: Tru64 UNIX Version 5.1 or higher

    **Compaq Computer**


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_160_0.png)'
  merge: -1
