    # Create New Shared Profile


    Create a common profile in /usr/local; name the oracle.profile. This file will
    be used by all users who log in to the system. The advantage of the common profile
    is that global changes (modifications to the ORACLE_HOME environment variable),
    can be set for hundreds of users without having to modify each user profile. The
    user login still executes the common profile but can override any of the global
    settings if necessary in their profile.


    50. Change the root shell from the default Borne shell to corn shell using the
    csh command.


    ```

    # csh /bin/sh

    ```


    Old shell: /bin/sh


    New shell: /bin/ksh


    Hashed database not in use, only /etc/passwd text file updated.


    51. Create a common file named oracle.profile located in /usr/local and add the
    following lines to the file. Set the Oracle home, base, doc, and path environment
    variables as shown in this example.


    ```

    #

    ------------------------------------------------------------

    # Oracle Settings

    #

    ------------------------------------------------------------

    ORACLE_BASE=/u011/app/oracle

    ORACLE_HOME=$ORACLE_BASE/product/9.0.1

    ORACLE_DOC=$ORACLE_BASE/doc

    ORACLE_PATH=$ORACLE_HOME/bin

    ```'
