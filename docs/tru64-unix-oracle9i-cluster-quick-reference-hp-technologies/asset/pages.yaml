  md: '41. Create local SQL*Plus preference file. Create a file named login.sql located
    in /home/oracle that is used to run sqlplus commands each time the oracle user
    starts SQL*Plus.


    ```

    oracle@rac> cd /home/oracle

    ```


    Use a text editor and create a file named login.sql with the following information:


    ```

    oracle@rac> vi login.sql

    set time on

    set timing on

    set linesize 150

    set pagesize 80

    ```


    This example login script displays the current time in the SQL prompt, displays
    elapsed time for each command run, changes the default line size to 150, and sets
    the pagesize to 80.


    42. A global user profile can be created using a file named glogin.sql. This file
    is located in the following location: $ORACLE_HOME/sqlplus/admin. This file contains
    SQL information that all SQL*Plus sessions execute each time they are started.
    You can add additional information to the end of this file or modify the existing
    parameters.


    Make a backup copy of the glogin.sql file if extensive changes are planned to
    the default values.


    ```

    oracle@rac> cd $ORACLE_HOME/sqlplus/admin

    oracle@rac> ls

    glogin.sql      help/          plustrce.sql  pupbld.sql

