- img_proc: true
  md: '```

    P00>>> show os_type

    ```


    os_type          VMS


    ```

    P00>>> set os_type unix

    ```


    ```

    P00>>> show os_type

    ```


    os_type          UNIX


    +   13. Alpha systems that have an LED display front panel may be customized.
    Change the OCP (operator control panel) using a set command. Setting the display
    text to a hostname is the most common example.


    ```

    P00>>> set ocp_text "Nodel"

    ```


    +   14. Change the console to serial or graphics. If your system has no graphics
    display attached and you are using either a VT terminal or terminal server, set
    console type to serial.


    ```

    p00>>> set console serial

    ```


    If your system has a graphics card and graphics display, set the console type
    to graphics.


    ```

    P00>>> set console graphics

