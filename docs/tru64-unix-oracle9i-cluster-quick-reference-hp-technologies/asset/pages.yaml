    The setup utility is a text menu-based program with the same features as the checklist.


    +   # setup



    nThe sysman utility is a common menu interface to manage a Tru64 UNIX system.
    This utility is available as a text-based program, X-Windows, and Java application.


    To start sysman enter the following command. By default, the X-Windows version
    of sysman will be displayed.


    +   # sysman


    To force the text menu-based sysman you may need to undefine the DISPLAY environment
    variable.


    +   # unset DISPLAY


    +   # sysman


    List all of the sysman menu shortcuts.


    +   # sysman -help


    Sysman shortcut to the network menu.


    +   # sysman -network


    The setld command is used to load, view, and remove optional Tru64 UNIX software
    subsets.


    Use the setld -l command to load an optional software subsets.


    +   # setld -1


    To remove a software subset use the delete option with the setld command. Use
    the software subset name as displayed from the setld -i command. Multiple software
    subsets can be added after the -d option.


    +   # setld -d OSXVFB520


    Manage Software Subsets'
