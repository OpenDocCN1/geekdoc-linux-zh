- img_proc: true
  md: "See Figure 1-5 for detail on all Memory Channel II jumper settings. Many of\
    \ the jumper settings may remain at the default values. The J10 optics jumper\
    \ is used to extend cluster distance using a fibre expansion board.\n\n> Tip:\
    \ The J1 (Hub Mode) jumper is the most common jumper to check, if Memory Channel\
    \ communications are not working properly.\n\nIt is best to leave all other jumpers\
    \ at the default factory settings and to consult with Compaq services before making\
    \ changes.\n\n| J1 Hub Mode | Standard hub mode All nodes 1,2 jumpered This is\
    \ the default setting | Virtual hub mode (no hub) 2,3 jumpered node 1 vh0 no jumpers\
    \ node 2 vh1 |\n|---|---||\n J3 Window Size | 128MB jumper 1,2 (default) | 512MB\
    \ jumper 2,3 |\n J4 Page Size | 8KB jumper 1,2 (VMS/UNIX default) | 4KB jumper\
    \ 2,3 (reserved) |\n J5 8X00 Mode | 8X00 mode (GS140) jumper 1,2 | All other jumpers\
    \ 2,3 (default) |\n J10 Optics Clock Enable | No fiber jumper 1, 2 (default) |\
    \ Fiber jumper 2, 3 |\n\nFigure 1-5 Memory Channel II jumper settings\n\n10. Set\
    \ mode on Ethernet interface.\n\nIt may be necessary to set the interface speed\
    \ (10mb, 100mb, 100mb full duplex) on the Ethernet interface. Some Ethernet switches\
    \ do not always auto-negotiate the correct port speed. Use the show config command\
    \ to locate the Ethernet interfaces.\nP00>>> show ewa*\n\nFor example, in a system\
    \ with a 100mb Ethernet interface ewa0 the mode is set to auto-negotiate, and\
    \ the network switch is set to 100mb full duplex. You may want to change the interface\
    \ mode to full duplex."
