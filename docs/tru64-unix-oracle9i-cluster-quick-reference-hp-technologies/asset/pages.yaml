  md: '# Backup Command Summary


    The standard UNIX compress is used to compress a file. The file name after compressing
    will be renamed with the .Z file extension.


    # compress


    Compress a tar archive.


    ```

    # compress myfile.tar

    ```


    The cpio utility is used to copy files to disks or tape devices. It can also be
    used to save and restore data from cpio archives.


    # cpio


    To copy a directory tree with all subdirectories and files from one filesystem
    to another filesystem, using the following:


    ```

    # mkdir /u02/copy

    # cd /u01/data

    # find . -print | cpio -pd /u02/copy

    ```


    To copy files in the current directory and all subdirectories to a tape device
    using the cpio command and specify the destination device name.


    ```

    # find . -print | cpio -ov -0/dev/tape/tape0

    ```


    The dd command is used to read from a specified input source and output to a specified
    destination. The input and output block size can be set for best performance.
    Common uses of the dd command include copying raw data from tape to a selected
    filesystem file.


    # dd


    The dd utility can be used to test disk read and write performance. The diskx
    utility can also be used to exercise disks.


    Read from the specified disk and output to /dev/null using a blocksize of 128k.


    ```

    # dd if=/dev/disk/disk12 of=/dev/null bs=128k

    ```


    Write zeros to dsk12 using a blocksize of 128k.


    ```

    # dd if=/dev/zero of=/dev/disk/disk12 bs=128k

    ```


    > Warning: Do not write to any disk configured for use with a filesystem or Oracle
    database. This command will destroy all data on the disk device. The dd command
    can be used to verify a new system write performance before filesystems are created.


    Chapter 10 – Backup/Restore


    277'
  merge: -1
  pgno: 292
- img_proc: true
  md: 'The dd command can be used to make a copy of a disk. To copy the contents of
    the "c" partition on disk12 to disk14 use the following command:


    # dd if=/dev/disk/disk12c of=/dev/disk/disk14c bs=128k


    # gunzip


    The gunzip utility is used to decompress .gz archives. Other archive formats are
    supported with gzip; see the gzip page for additional information.


    Decompress a tar archive.

    # gunzip myfile.tar.gz


    # gzip


    The gzip utility is used to compress files. The file after compressing will be
    renamed with the .gz file extension. The same file permissions are preserved after
    compression. Typical compression is about 65–70% for text files. Gzip is preferred
    over a standard UNIX compress because it offers better compression and is faster.


    Compress a tar archive.

    # gzip myfile.tar


    # mt


    The mt command is used to position a tape device. Options include rewind, fast
    forward, or offline to unload a tape.


    Rewind the tape using the mt command.

    # mt -f /dev/tape/tape0 rewind


    Use the "forward spaces counts" (fsf) option to skip to the next tape session.
    Make sure the no-rewind device file is used, or the tape will be positioned to
    the requested session and then a rewind will take place.

    # mt -f /dev/ntape/tape0 fsf 1


    View information about a tape drive with the status option.

    # mt -f /dev/tape/tape0 status


    # robot


    The robot command is used to manage auto-loader tape libraries.


    Set MRU_ROBOT environment variable.

    # export MRU_ROBOT=/dev/changer/mc0'
