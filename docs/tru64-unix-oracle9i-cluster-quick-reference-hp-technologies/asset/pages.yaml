  md: '![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_23_0.png)


    Figure 1-4 Memory Channel II— 2-node (with hub)


    A cluster with more than two nodes requires a Memory Channel hub. The jumper settings
    on all Memory Channel adapters are set to “standard.”


    > Note: The memory channel hub is optional for a 2-node cluster.'
