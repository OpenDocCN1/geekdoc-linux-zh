- img_proc: true
  md: '# LSM Basics


    LSM volumes are composed of (1) RAW UNIX disk, (2) an LSM Sub-Disk or Slice, (3)
    Plex, and (4) LSM Volume.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_161_0.png)


    Figure 5-1 LSM configuration steps


    The process to create LSM volumes shown in Figure 5-1 uses sub-disk, plex, and
    volume. The example shown is a three-disk stripe. Disks can be mirrored with multiple
    plexes combined into a single volume.


    # Disk Group (rootdg)


    The default disk group used when LSM is initialized is rootdg. Additional disk
    groups can be created—for example ordg. Create new disk groups if a large number
    of disks and volumes will be created. For the configuration in this document the
    default rootdg group is sufficient.'
  merge: -1
  pgno: 161
- img_proc: true
  md: '# Understanding LSM Disk Stripes


    The example in Figure 5-2 illustrates how data is written through LSM to a RAID
    controller. It is important to set the LSM stripe size to match a controller full-stripe
    read or write. If the LSM stripe size does is not a multiple of the RAID controller
    chunksize, the LSM volume performance will be degraded. In this example the LSM
    chunksize is 640K, which matches the RAID controller full-stripe read and write
    size.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_162_0.png)


    Figure 5-2 LSM and hardware RAID striping example


    The LSM stripe size should be a multiple of the controller chunksize. In this
    example the RAID controller chunksize of 256 is 128K for each read or write operation.
    A full-stripe write is 640K. Use a LSM stripesize that is a multiple of the controller
    chunksize: 128K, 256K, or 640K.'
  merge: -1
  pgno: 162
- img_proc: true
  md: '# LSM Setup Steps


    +   1. After the cluster is created and all members are running, it is time to
    initialize the LSM database. Use the volsetup command to start LSM. Input the
    disk devices that will be striped together.


    > Note: Issue the volsetup command only one time.


    ```

    racl> volsetup dsk12

    ```


    > Warning: If a previous LSM configuration exists you can use the "force" option
    to recreate the rootdg disk group and reinitialize LSM configuration. This will
    destroy the previous LSM configuration.


    ```

    volsetup -o force dsk12

    ```


    Initialize and the root disk group:

    Add disk dsk12 to the root disk group as dsk12:

    Addition of disk dsk12 as dsk12 succeeded.

    Initialization of void and on the root disk group was successful.


    You must run ''volsetup -s'' on each additional node in the cluster to initialize
    up LSM now, unless using clu_add_member to add additional nodes now. The clu_add_member
    utility will automatically start LSM on the new node.


    +   2. Start the LSM daemon on each additional node in the cluster.


    ```

    racl> volsetup -s

    ```


    Starting LSM...

    LSM: Creating Logical Storage Manager device special files.

    LSM watchdog Service started - mail only


    +   3. Make sure that the remaining disks to be configured in LSM have a valid
    disk label. Use the diskabel command to set the default label. You do not need
    to modify the disk label sizes; the entire disk will be used by LSM.


    ```

    racl> diskabel -rw dsk13

    racl> diskabel -rw dsk14

    racl> diskabel -rw dsk15

    racl> diskabel -rw dsk16

    racl> diskabel -rw dsk17

    racl> diskabel -rw dsk911

    racl> diskabel -rw dsk912

    ```'
  merge: -1
  pgno: 163
- img_proc: true
  md: '+   4. Add the remaining disks to the LSM configuration.

    rac> voldisksetup -i dsk13 privlen=4096 nconfig=1 nlogs=1

    rac> voldisksetup -i dsk14 privlen=4096 nconfig=1 nlogs=1

    rac> voldisksetup -i dsk15 privlen=4096 nconfig=1 nlogs=1

    rac> voldisksetup -i dsk16 privlen=4096 nconfig=1 nlogs=1

    rac> voldisksetup -i dsk17 privlen=4096 nconfig=1 nlogs=1

    rac> voldisksetup -i dsk911 privlen=4096 nconfig=1 nlogs=1

    rac> voldisksetup -i dsk912 privlen=4096 nconfig=1 nlogs=1


    +   5. Add all disks to the rootdg disk group. The disk group is not specified
    with the voldg command. By default the disks are added to the rootdg disk group.

    rac> volddg addisk dsk13

    rac> volddg addisk dsk14

    rac> volddg addisk dsk15

    rac> volddg addisk dsk16

    rac> volddg addisk dsk17

    rac> volddg addisk dsk911

    rac> volddg addisk dsk912


    +   6. Confirm that the LSM daemon is now running. You should see /sbin/vold in
    the output of the ps command.

    rac2> ps -ef | grep vold


    ```

    root      531173 524289 0.4 13:11:38 ??         0:00.70 /sbin/vold -k

    root      531215 526148 0.0 13:11:47 console      0:00.00 grep vold

    ```


    > Note: All cluster members share the same LSM database information.'
  merge: -1
