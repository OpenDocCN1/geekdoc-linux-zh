  md: 'Optional: If the disk devices are in sequence with overlapping identifiers
    you may need to delete the devices and re-create them at the end of the last devices.
    For example, disk devices are in the range of 10 ...30 and controller identifiers
    overlap part of the sequence 20 ...40.


    a) Use hwmgr to list devices.


    ```

    # hwmgr -view device

    ```


    b) Use hwmgr to identify the SCSI device IDs out of sequence.


    ```

    # hwmgr -show scsi

    ```


    c) Use the hwmgr to delete out-of-sequence devices. In this example the SCSI device
    ID is 10.


    ```

    # hwmgr -delete scsi -did 10

    ```


    d) Now rescan the subsystem to rediscover the devices.


    ```

    # hwmgr -scan scsi

    ```


    e) The disk devices will be renumbered now. Confirm new device numbering using
    the view device.


    ```

    # hwmgr -view device

    ```


    You can also use the dsfmgr command to move a disk device to a temporary location.


    ```

    # dsfmgr -m dsk10 dsk999

    ```


    Moving the next disk to the original number and move the temporary disk back.


    ```

    # dsfmgr -m dsk11 dsk10

    ```


