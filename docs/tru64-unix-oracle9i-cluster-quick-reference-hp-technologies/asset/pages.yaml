  md: 'This command divides storageset into several separate storage units. A percentage
    is used for each partition size.


    Create a partition on raidset r1 at 42%.


    ```

    HSG> create_partition r1 size=42

    ```


    Create a partition using the largest remaining space on a storageset.


    ```

    HSG> create_partition r1 size=largest

    ```


    Use the delete command followed by a container such as a raidset, disk, or unit.
    You cannot delete a disk before the unit and raidset have been removed.


    Delete a unit named d1.


    ```

    HSG> delete d1

    ```


    Delete a raidset named r1.


    ```

    HSG> delete r1

    ```


    Delete a disk.


    ```

    HSG> delete disk10000

    ```


    This command removes a disk from the failedset. You can show failedset to view
    disks that have failed. Delete the failedset before physically removing a failed
    disk from the storage shelf.


    ```

    HSG> delete failedset disk10000

    ```


    To remove a disk from a spareset use the spareset command. Use the show spareset
    command to view disks in sparesets.


    ```

    HSG> delete spareset disk60200

    ```


    This command will remove a partition from a container. If the partition has a
    unit assigned, you must remove the unit before removing the partition.


    Remove the third partition from raidset r1.


    ```

    HSG> destroy_partition r1 partition=3

    ```'
