  md: 'The command locate flashes the fault LED on disk drives. Locate is useful to
    assist in disk mapping. You can use locate to view disks, raidsets, and units.


    # locate


    Blink all the lights on disks connected to controller.


    ```

    HSG> locate all

    ```


    Flash the light on disk10000.


    ```

    HSG> locate disk10000

    ```


    Flash the fault light for all disks in raidset r1.


    ```

    HSG> locate r1

    ```


    Cancel locate command. Disks will continue to flash until you cancel the locate
    command. After this command is issued, a failed disk will continue to flash.


    ```

    HSG> locate cancel

    ```


    Use the mirror command to create a one-member mirrorset from a single disk. A
    single disk drive is first converted to a mirrorset; then members are increased
    using the set command.


    # mirror


    This example sets the normal number of members for each mirrorset and adds a second
    disk to each mirrorset.


    ```

    HSG> add stripeset stripel disk10100 disk20100 disk30100

    ```


    ```

    HSG> initialize stripel

    ```


    ```

    HSG> add unit d102 stripel

    ```


    ```

    HSG> mirror disk10100 mirror1

    ```


    ```

    HSG> set mirror1 membership=2

    ```


    ```

    HSG> set mirror1 replace=disk20200

    ```


    ```

    HSG> mirror disk20100 mirror2

    ```


    ```

    HSG> set mirror2 membership=2

    ```


    ```

    HSG> set mirror2 replace=disk30200

    ```


    ```

    HSG> mirror disk30100 mirror3

    ```


    ```

    HSG> set mirror3 membership=2

    ```


    ```

    HSG> set mirror3 replace=disk10200

    ```'
