  md: '# Tru64 UNIX Rolling Upgrade


    Operating systems and patches can be installed in the cluster environment without
    any Oracle downtime as long as at least one member of the cluster is running.
    The rolling upgrade process is a series of steps, also referred to as stages.
    The rolling upgrade commands ensure that the steps are followed.


    Following the summary in Table 4-3, one cluster member is always available during
    the operating system patch installation. One member of the cluster is upgraded
    and available while the next member is booted and upgraded.


    During a rolling upgrade, patches can be installed to the Tru64 UNIX operating
    system or TruCluster software.


    # Before Starting the Rolling Upgrade


    +   • Update the AlphaServer console firmware

    • Make a backup of the cluster

    • Select a member to start, also known as the lead member


    To determine if the cluster is ready for an upgrade, run the following command:


    ```

    # cru_upgrade -v check setup 1

    ```


    During a rolling upgrade, software is updated on one node at a time using a set
    of tagged files. A tagged file is a backup copy of the current file with .01d..
    prepended to the backup filename. The tagged files are created in the same directory
    as the original file. After all cluster members are upgraded, the cleanup stage
    of a rolling upgrade removes the .01d.. files.'
  merge: -1
  pgno: 148
- img_proc: true
  md: '# Table 4-3: Tru64 UNIX Rolling Upgrade Summary


    | Stage | Tru64 UNIX Command | Lead Member Node | Other Member Nodes |

    |---|---|---|--|

    | Preparation | # clu_upgrade -v check setup 1 | ✓ | |

    | Setup | # clu_upgrade setup 1 | ✓ | |

    | | # reboot | | ✓ |

    | Pre-Install | # clu_upgrade preinstall | ✓ | |

    | Install | # shutdown -h now | ✓ | |

    | | p00>>> boot -flag s | ✓ | |

