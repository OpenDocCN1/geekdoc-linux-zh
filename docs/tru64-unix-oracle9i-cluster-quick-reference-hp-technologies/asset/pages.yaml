    # Multiple Block Sizes


    Tablespaces in the database can be set to a different block size depending on
    the expected workload. The default blocksize installed with the DBCA tool is 8k.
    To create a database using a larger or smaller blocksize select the “New Database”
    with DBCA and specify a larger blocksize.


    +   * Data warehouse workloads typically use a 16k or 32k blocksize.

    * For OLTP workloads a smaller blocksize of 2k, 4k, or 8k is normal.


    +   63. Set the db_16k_cache_size parameter to create a tablespace with a 16k
    blocksize. The db_cache_size parameter is used to set the cache size for the default
    database block size. The sample database is using a blocksize of 8k. Tablespaces
    using values other than the default database blocksize must have an individual
    buffer cache parameter set. Buffer cache can be set for each of these nonstandard
    block sizes.


    db_2k_cache_size

    db_4k_cache_size

    db_8k_cache_size

    db_16k_cache_size

    db_32k_cache_size


    Set alternate blockizes to at least 1 granule.


    +   * A granule is 4M if the total SGA is less than 128MB.

    * A granule is 16MB if the total SGA is greater than 128MB.


    Set the value of db_16k_cache_size to 64MB. This parameter can’t be set dynamically.
    Shut down the database on all members and add the following line to the init_ora
    file.


    ```

    db_16k_cache_size=64M

    ```'
