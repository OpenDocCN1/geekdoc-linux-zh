  md: '# Chapter 10 — Backup/Restore


    # Overview


    Regular backups of the operating system and Oracle database files can be one of
    the most important aspects of the installation. Plan adequate time for backup
    and restore testing. Many times backups are performed, but until a disaster occurs,
    the restores have never been tested. Work through a backup and restore test to
    verify the processes. The restore testing should include part of the operating
    system and Oracle database.


    This chapter will focus on backup to DLT tape using the common Tru64 UNIX commands.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_280_0.png)


    # Plan 40 Minutes for the Tru64 UNIX Operating System Backup


    # Operating System Backup


    The cluster operating system backup procedure is very similar to a single-node
    backup. The following filesystems should be backed up on a regular basis.


    +   * Cluster root file system

    * Cluster /usr file system

    * Cluster /var file system

    * Member root file system


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_280_1.png)


    For more information on Oracle Backup & Recovery see:

    **Oracle8i Backup & Recovery**

    Rama Velpuri, George Williams, Anand Adkoli, Paperback, Oracle Press — McGraw-Hill
    Professional Publishing, November 2000


    **Oracle9i Backup and Recovery Concepts**

    Release 1 (9.0.1)

    Part Number A90133-02

    Oracle Corporation


    **Oracle9i User-Managed Backup and Recovery Guide**

    Release 1 (9.0.1)

    Part Number A90134-01

    Oracle Corporation'
  merge: -1
  pgno: 280
- img_proc: true
  md: '# Oracle9i Recovery Manager User''s Guide

    Release 1 (9.0.1)

    Part Number A90135-01

    Oracle Corporation


    # Backup Media


    Tape is the most common form of backup media. Tape is relatively inexpensive and
    can be stored safely in an offsite location away from the database server. A remote
    site backup to disk or remote mirroring is another backup method. Mirroring is
    the most costly method of backup but provides the quickest recovery for a database
    within minutes to seconds for a full-production database.


    # Third-Party Backup Software


    The standard UNIX backup utilities are acceptable to start with the backups. The
    built-in utilities are preferred over third-party software for the operating system
    since recovery can start immediately, and the UNIX utilities are part of the base
    operating system installation.


    Third-party backup software is preferred for Oracle and user filesystem backups.
    All of the third-party backup products include some form of file catalog and automatic
    tape robot control. The Oracle RMAN utility also interfaces to the most popular
    backup products.


    Optional Third-Party Software


    +   - Legato

    - Syncsort Backup Express

    - Veritas Netbackup

    - Others


    This chapter covers usage of common UNIX utilities to back up and restore files.
    The tape robot utility commands are included, which manage media robots such as
    the TL810, TL894, ESL9326 and others.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '# Oracle Backups


    Several methods are available to back up the Oracle database. The best backup
    plans include a combination of each of the following:


    +   - Cold database backup, copy of all database files

    - Export full database or a selected user and tables

    - Hot or cold database backup using Oracle RMAN


    A cold database backup requires that all cluster members shut down the database
    instance. Use backup software to copy all datafiles to a tape device. Include
    the Oracle control files, all *.dbf files, and all Oracle *.log files. Optionally,
    include the Oracle configuration files located in $ORACLE_BASE/admin.


    Use the Oracle export utility to export all data or selected tables to a disk
    export file. Use backup software to copy the export file to tape.


    Configure the Oracle RMAN utility to be used to catalog database files and control
    when a file is offline for the hot backup. RMAN is used for full hot database
    backups or selected tables within the database.


    Regular Oracle backups are essential to protect data in the event of a disaster.
    The database backup should include several methods to protect data. Consider the
    following backup plan.


    +   - Use the Oracle export utility for key tables. Export entire database if
    space is available, or use the export option without data to save the database
    structure.

    - Back up all database files using either a hot or a cold backup.

    - Turn archiving on for transactional systems.

    - Back up all database rebuild scripts.

    - Unload data from a table to a flat text file that SQL loader will use to reload.

    - Use Oracle RMAN to manage the backup and recovery of database files.

    - Make some tablespaces read only and export them as transportable tablespaces.


    Test your backup plan and recover the full database before it goes into production.
    Document the backup and recovery process. Test the backup plan periodically after
    a system is in production.'
  merge: -1
  pgno: 282
