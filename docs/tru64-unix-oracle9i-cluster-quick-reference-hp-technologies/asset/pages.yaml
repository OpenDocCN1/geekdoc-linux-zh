  md: "# Server Parameter File (spfile)\n\nThe spfile is a parameter file used to\
    \ store changes made by the DBA persistently through shutdown and startup. This\
    \ file is created for you with the DBCA tool during the database build. Modifications\
    \ are made to the spfile using alter system set statements.\n\nThe spfile is a\
    \ binary file and cannot be edited. The default location is $ACLE_HOME/dbs. The\
    \ file is named spfileSID.\n\n+   - oracle@rac1 ls $ORACLE_HOME/dbs\n-rw-r-----\
    \ 1 oracle dba 5120 Jan 25 15:57 spfiledemo.ora\n\nThe spfile can be created manually\
    \ from a spfile using the following SQL statement:\n\n```\nSQL> create spfile\
    \ from spfile;\n```\n\n# Oracle Client Configuration — Transparent Application\
    \ Failover\n\nOracle clients can be configured to use transparent application\
    \ failover (TAF) making the clustered database highly available. Client connects\
    \ automatically reconnect to the database if the connection fails.\n\n70. The\
    \ following example is the tnsnames.ora configuration file used for an application\
    \ server app01 connecting to the database named demo, hosts rac1 and rac2.\n\n\
    ```\napp01 cat tnsnames.ora\n\nrac1 =\n  description =\n    address_list =\n \
    \     address = (protocol = tcp) (host = rac1) (port = 1521)\n      address =\
    \ (protocol = tcp) (host = rac2) (port = 1521)\n    )\n    connect_data = (service_name\
    \ = demo)\n      failover_mode =\n        backup = rac2\n        type = select\n\
    \        method = preconnect\n        retries = 180\n        delay = 5\n  )\n\n\
    rac2 =\n  description =\n    address_list =\n      address = (protocol = tcp)\
    \ (host = rac2) (port = 1521)\n```"
