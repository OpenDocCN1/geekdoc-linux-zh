  md: '# Sys_Check Tool


    The sys_check tool is used to gather system configuration information and performs
    over 200 analysis operations. The output from sys_check is a HTML file that is
    viewable from a Web browser. The report is organized by system information, events,
    error, security, storage, network, and applications.


    > Note: Sys_check will not modify system parameters or any configuration settings.


    # Installing Sys_check


    The latest version of sys_check can be download from the following Web site.


    http://www.tru64unix.compaq.com/sys_check/sys_check.html


    Expand the tar archive.


    ```

    rac> tar xf sys_check.tar

    ```


    Use the setld command to install sys_check.


    ```

    rac> setld -1 .

    ```


    The subsets listed below are optional:


    There may be more optional subsets than can be presented on a single screen. If
    this is the case, you can choose subsets screen screen or all at once on the last
    screen. All of the choices you make will be collected for your confirmation before
    any subsets are installed.


    +   1) Syscheck utility


    Or you may choose one of the following options:


    +   2) ALL of the above

    3) CANCEL selections and redisplay menus

    4) EXIT without installing any subsets


    Estimated free diskspace(MB) in root:870.5 usr:2980.9 var:5343.2


    Enter your choices or press RETURN to redisplay menus.


    Choices (for example, 1 2 4-6): 1


    # Sys_check Runtime Options


    Sys_check command line options are available for quick reports with minimal information
    to a complete detail system report.'
