- img_proc: true
  md: '# Chapter 4 — Cluster Installation


    # Overview


    The cluster configuration is a multistep process. At this point the Tru64 UNIX
    operating system should be installed and configured. The initial operating system
    installation is the same as installing a single-node non clustered system. This
    chapter contains the steps to take the base installation and create cluster members.
    The cluster root and member boot disks in the examples will be installed using
    fibre storage.


    Plan 40 Minutes to Configure a 2-Node Cluster


    # Tru64 UNIX Cluster Installation Summary


    +   * Renumber disk devices to match controller identifiers

    * Modify default disk label for the cluster root disk

    * Install TruCluster software subsets

    * Check and install Tru64 UNIX and TruCluster patchsets

    * Create cluster root, usr, and var

    * Create member boot disks

    * Verify cluster members


    For more information on TruCluster Server Installation see:

    TruCluster Server Technical Overview

    Part Number: AA-RHGVD-TE, June 2001

    Product Version: TruCluster Server Version 5.1A

    Compaq Computer Corporation


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_114_0.png)


    TruCluster Server Cluster Installation

    Part Number: AA-RHGXD-TE, June 2001

    Product Version: TruCluster Server Version 5.1A

    Compaq Computer Corporation


    TruCluster Server Cluster Hardware Configuration

    Part Number: AA-RHGWD-TE, June 2001

    Product Version: TruCluster Server Version 5.1A

    Compaq Computer Corporation'
  merge: -1
  pgno: 114
