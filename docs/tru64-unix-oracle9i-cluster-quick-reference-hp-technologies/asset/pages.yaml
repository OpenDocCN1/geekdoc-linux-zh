  md: '# # Chapter 9 — System Performance Monitoring


    # ## Overview


    For best overall system performance, an interative process describes monitoring
    and tuning takes place over a period of True time. This chapter describes the
    common performance monitoring tools available in Tru64 UNIX with several examples.
    Tru64 UNIX contains a very strong set of standard tools included with the operating
    system installation. Additional performance monitoring tools are available on
    the internet or the additional product CD-ROM.


    It is important to monitor CPU activity, memory, and disk I/O with normal system
    activity. For data warehouses, monitor aggregate I/O throughput; for transactional
    systems, monitor I/O operations per second. Monitor memory usage and watch the
    available free memory.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_260_0.png)


    # Plan 30 Minutes to Review the Tru64 UNIX Performance Tools


    System monitoring also includes routine system error monitoring, looking for any
    hardware or software failures in the Tru64 UNIX error logs. In Table 9-1 is a
    list of subsystems and the appropriate tools for each. Optional tools can be downloaded
    from the Compaq Web site listed in Figure 9-1.


    # ### Table 9-1: Common Performance Monitoring Tools


    | Subsystem | Tru64 UNIX Tool | Included with Tru64 UNIX |

    | --- | --- | --- |

    | CPU | collect -sc

    vmstat, iostat

    psrinfo

    monitor

    vubc | Yes

    Yes

    Yes

    Optional

    Optional |

    | Memory | collect -sm

    vmstat

    vubc

    monitor | Yes

    Yes

    Optional

    Optional |'
