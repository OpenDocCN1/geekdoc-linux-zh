    +   59. Make sure the new global profile has execute permission.


    ```

    # chmod +x /usr/local/oracle.profile

    ```


    +   60. Make a backup copy of the original root profile if desired.


    ```

    # cp /.profile /.profile.save

    ```


    +   61. Change the root profile. The echo command will replace the .profile with
    a single line that points to the common shared profile.


    ```

    # echo ". /usr/local/oracle.profile" > /.profile

    ```


    +   62. Verify the changes.


    ```

    # cat /.profile

    .usr/local/oracle.profile

    ```


    +   63. Now copy the new profile to /usr/skel. The /usr/skel directory is a template
    that is used when a new user is added to the system.


    ```

    # cp /.profile /usr/skel

    ```


