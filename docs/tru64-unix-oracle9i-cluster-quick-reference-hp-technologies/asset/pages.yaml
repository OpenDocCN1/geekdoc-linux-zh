  md: '# disklabel [options] [disk device]


    The disklabel command is used to read and modify the label on a disk drive.


    # Clear Label


    Zero (erase) the disk label.


    > Warning: this could result in the loss of data


    ```

    # disklabel -z dsk24

    ```


    # Edit Disk Label


    ```

    # disklabel -e dsk24

    ```


    # Create New (default) Disk Label


    This command writes a new disk label to the selected disk.


    ```

    # disklabel -rw dsk24 SCSI

    ```


    # Make AdvFS Disk Bootable


    After restoring from a backup tape, this special disk label command makes the
    disk bootable.


    ```

    # disklabel -r dsk0 > /tmp/a

    ```


    ```

    # disklabel -t advfs -R /dev/disk/dsk0a /tmp/a SCSI

    ```


    # Read Disk Label


    The following command is used to view a disk label for specified disk:


    ```

    # disklabel -r dsk0

    ```


    The fstab file is used during boot to automatically mount listed volumes. The
    fstab file is located in the /etc directory.


    # Example fstab file.


    ```

    # cat /etc/fstab

    ```


    ```

    cluster_root#root / advfs rw 0 1

    cluster_usr#usr /usr advfs rw 0 2

    cluster_var#var /var advfs rw 0 2

    proc /proc procfs rw 0 0

    u01_domain#u01 /u01 advfs rw 0 2

    u01_domain#home /home advfs rw 0 2

    ```'
