- img_proc: true
  md: '7. Another fileset should be created for user home directories. Use the mkpset
    command and the u01_domain. Name the new fileset home.

    racl\> mkpset u01_domain home


    8. Add “home” to the fstab file and mount the new filesystem. The “home” directory
    is created by Tru64 UNIX by default and does not need to be created. In this example
    the filesystem can be mounted without specifying the arguments in the previous
    step. The mount command will take the information found in the fstab file to mount
    the new filesystem.

    racl\> vi /etc/fstab


    Add the following line to the end of the fstab file:

    u01_domain#/home advfs rw 0 2


    Mount the new filesystem.

    racl\> mount /home


    9. One benefit of the single view system is that all administration work performed
    on any node will immediately be available on all other nodes. To verify the filesystems,
    connect to node 1 and issue the diff command. You may also want to verify the
    contents of /etc/fstab file on each node. Whether the configuration contained
    four nodes or even eight nodes, the administration work will be the same.

    racl\> cat /etc/fstab


    ```

    cluster_root# / advfs rw 0 1

    cluster_usr# /usr advfs rw 0 2

    cluster_var# /var advfs rw 0 2

    /proc /proc procfs rw 0 0

    u01_domain#u01 /u01 advfs rw 0 2

    u01_domain#home /home advfs rw 0 2

    ```


    10. Use the showfd command to view details on the AdvFS filesystem. In this example
    we will view more information on the u01_domain.

    racl\> showfd u01_domain


    | Id | Date Created LogPgs Version Domain Name |

    |---|---|---|---|---|---|

