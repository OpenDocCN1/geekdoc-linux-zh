    \ collect -f /u01/app/collect/rac1 -H d00:05,12m -i60,60 &\nrac2> collect -f /u01/app/collect/rac2\
    \ -H d00:05,12m -i60,60 &\n```\n\nNow, each time the system is rebooted collect\
    \ will automatically start up and record a binary file to /u01/app/collect.\n\n\
    # Improving Performance of Oracle Timed Statistics\n\nOracle makes operating system\
    \ calls frequently for timing functions. The timing functions are calls into the\
    \ OS kernel, which can degrade Oracle performance because it must relinquish the\
    \ CPU each time.\n\nA feature in Tru64 UNIX will give a calling process direct\
    \ access to the operating system's real-time clock. Using this feature will improve\
    \ Oracle performance on a heavily loaded system and will slightly improve Oracle\
    \ performance on a lightly loaded system.\n\nTo enable a process direct access\
    \ to the real-time clock enter the following commands logged in as root.\n\n```\n\
    rac1> mknod /dev/timed c 15 0\nrac1> chmod +r /dev/timed\n```\n\nOracle must be\
    \ restarted on all nodes before this feature can take effect.\n\n# System Error\
    \ Monitoring\n\nA number of different tools are available to provide system error\
    \ messages and alerts. Consult with Compaq services for the best solution for\
    \ your environment. The Tru64 UNIX messages file is available for all hardware\
    \ systems. This log will contain boot information, warnings, and alerts.\n\n```\n\
    rac1> tail /var/adm/messages\nJan 28 16:42:30 rac2 vmunix: CNX MGR: Join operation\
    \ complete\nJan 28 16:42:30 rac2 vmunix: CNX MGR: membership configuration index:\n\
