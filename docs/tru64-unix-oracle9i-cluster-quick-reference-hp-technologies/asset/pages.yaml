  md: '# vdump


    Used just like the vdump and vrestore command the remote option allows one system
    to back up over the network to a backup server. Make sure that rsh is working
    before trying these commands.


    Backup /home filesystem to remote machine named tiger.


    ```

    # vddump -D -f tiger:/dev/tape/tape0 \

    -C -v /home 2> backup.log &

    ```


    # rvrestore


    Restore the files from the remote drive to the /u01/restore directory.


    ```

    # rvrestore -xf sleeping:/dev/tape/tape0 -D /u01/restore

    ```


    # tar


    Tar is a standard UNIX utility that can be used for file archive. Tar can be used
    to archive files to a filesystem or tape.


    Make a tar archive of all files in /usr/local/bin.


    ```

    # cd /usr/local

    # tar cvf local_bin.tar bin

    ```


    Extract all files from the tar archive.


    ```

    # tar xvf local_bin.tar

    ```


    # uncompress


    The uncompress utility is used to decompress Z archives created with the UNIX
    compress utility.


    Decompress a tar archive.


    ```

    # uncompress myfile.tar.z

    ```


    # vdump


    The vdump utility is used to back up AdvFS filesets. Vdump is included with the
    Tru64 UNIX base system disk and is recommended for operating system backups.


    Backup the /usr fileset to the /dev/ntape/tape/tape0 device.


    ```

    # vdump -D -f /dev/ntape/tape/tape0 -C -v /usr 2> backup.log

    ```


    Using vdump to copy the /u01/text fileset to the /u02/text_copy fileset. The device
    name of dash "-" tells vdump to write to standard out.


    ```

    # vdump -D -f /u01/text | vrestore -xf -D /u02/text_copy

    ```'
