    # Optimal Flexible Architecture (OFA)


    The Oracle OFA standard is a set of configuration guidelines used to place the
    Oracle software and database files in specific locations. The guidelines take
    into consideration things as software upgrades and different databases running
    on the same system. The OFA standard includes a naming convention for filesystem
    mount points and the directories under each filesystem.


    # Oracle Base


    The following directory is referred to as the Oracle base directory. This is also
    the default directory used in the Oracle installer. The shell environment variable
    $ORACLE_BASE is set to this location.


    ```

    /u01/app/oracle

    ```'
