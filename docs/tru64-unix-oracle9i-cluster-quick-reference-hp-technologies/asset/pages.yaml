  md: '# Hardware Installation Steps


    1. Make sure all hardware is connected and powered on. Do not boot the system.


    2. A hardware test can be run to verify each cluster member. The test command
    performs a systemwide test of memory and I/O. The output will be different on
    your system depending on configuration (CPU, memory, I/O, and network adapters).


    ```

    P00>>> test

    nConsole is in diagnostic mode

    Complete Test Suite for runtime of 1200 seconds

    Type °C to stop testing

    Configuring system...

    poling for units on tulip0, slot 12, bus 0, hose0...

    ewai:00.0.12.0:00-FR-25-TF-2A Twisted-Pair

    poling for units on tulipi, slot 11, bus 0, hose0...

    :

    ------Testing done------

    Shutting down drivers...

    Shutting down units on tulip2, slot 12, bus 0, hose 4

    ```


    3. Use the show memory command to verify the total system memory. Oracle 9i requires
    a minimum of 256MB. The system memory size will be used later to determine swap
    space.


    ```

    P00>>> show memory

    ```


    | Array # | Size | Base Addr |

    |---|---|---|

    | 0 | 256 MB | 00000000 |


    Total Bad Pages = 0

    Total Good Memory = 256 Mbytes


    4. View the CPU information. This example shows a 2 CPU configuration shown by
    active CPUs.


    ```

    P00>>> show cpu

    ```


    ```

    Primary CPU: 00 01

    Active CPUs: 00 01

    Configured CPUs: 00 01

    SROM Revision: V1.82 V1.82

    ```


    5. The show config command provides a detailed hardware listing. To view network
    interfaces, use the show config command and look for information similar to this.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '```

    P00>>> show config

    ```


    Bus 00 Slot 09: DE500-BA Network Controller

    ewa0.0.0.0.1 08-00-2B-C5-9C-EF


    +   6. Verify the memory channel (cluster installations only) device using the
    show config command to view adapter information.


    ```

    P00>>> show config

    ```


    Bus 00 Slot 09: DEC PCI MC

    Rev: 22, mca0


    +   7. Test Cluster Interconnect — Memory Channel (cluster installations only).
    The mc_diag command runs a self-test on the Memory Channel adapter. Run this command
    on all nodes of the cluster.


    ```

    p00>>> mc_diag

    ```


    Testing MC-Adapter(s)

    Adapter mca0, Passed


    +   8. Check the communication, adapter, and cable; run this command on each node.
    You should see a node online message once they communicate.


    ```

    p00>>> mc_cable

    ```


    mca0 is offline

    mca0 node id 0 is online

    Response from node 1 on mca0

    *


    > Warning: Don''t run the mc_cable command on an active cluster. Make sure all
    systems are shut down to the hardware console before issuing this command.


    Before continuing you should initialize the system.

    p000>>> init


    +   9. Setting Memory Channel jumpers (cluster installations only)


    If the mc_cable test fails, examine jumper settings on the Memory Channel boards.
    A 2-node cluster can be configured with one Memory Channel adapter (Figure-1-3)
    per node, or two Memory Channel adapters per node (dual rail). single rail, Memory
    Channel will run with one active adapter while the other is passive or in standby
    mode. The Memory Channel hub is optional in a 2-node configuration (Figure 1-4).'
  merge: -1
  pgno: 21
- img_proc: true
  md: '![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_22_0.png)


    Figure 1-3 Memory Channel II — 2-node (hubless)


    **Note:** The jumpers on node 1 are set to VH0. Set the jumpers on node 2 to VH1.


    Chapter 1 – Hardware Verification and Console Commands'
  merge: -1
