  md: '```

    alias oc=''cd $ORACLE_BASE/admin/$(DB_NAME)''

    ```


    The sample aliases are useful to manage an Oracle environment. Before starting
    the database on each node, just type "oa" to view the alert log for messages during
    startup. It is important to confirm that each node starts without errors and communication
    is established between all members.


    The df command by default displays sizes in 512-byte blocks. Oracle datafile sizes
    are in 1024k blocks.


    The sample ls alias shows by type (directory, executable, and symbolic link.)


    A shortcut to jump to the Oracle home directory is oh.


    +   58. Check for user mail.


    ```

