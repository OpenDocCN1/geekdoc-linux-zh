  md: 'Use the Table 2-1 as a guide and recommended layout for the raidsets. This
    table shows the raidset name and corresponding unit name. Identifiers will be
    set on all raidsets and can be viewed within the operating system. The identifiers
    will help identify boot disks from the hardware console.


    Identifiers starting with 900 represent a partition raidset and also identify
    boot devices. The other identifiers will be used to locate a controller and raidset.
    An identifier of 14 locates controller #1 and raidset #4. If the identifier is
    422, it will locate controller #42 and raidset #2.


    This numbering system is just one of many ways to organize the raidsets. Determine
    a good standard for your organization and use it consistently on each installation.
    Use a numbering scheme to locate each physical cabinet and controller within the
    cabinet. Use the same standard for each system installation within your organization.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_50_0.png)


