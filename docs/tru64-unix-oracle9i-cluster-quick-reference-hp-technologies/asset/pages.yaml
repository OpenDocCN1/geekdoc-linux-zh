- img_proc: true
  md: '# Chapter 2 — Storage Configuration


    # Overview


    Clusters in Tru64 UNIX 5.x require shared operating system disks. These can be
    either SCSI or Fibre Channel. This document covers the Compaq Fibre Channel controller,
    StorageWorks HSC80. It is important to plan the disk configuration used for the
    operating system and Oracle database. Consider the number of controllers, filesystem
    layout, and expected disk performance. Overall Oracle performance will be directly
    proportional to good disk I/O configuration.


    This chapter outlines common commands used to manage Compaq StorageWorks RAID
    controllers. Most examples will work on HSZ70 (SCSI), HSZ80 (SCSI), HSG80 (fibre),
    and the new HSV110 controllers. The basic concepts are the same for all controllers.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_30_0.png)


    # Plan 40 Minutes to Configure One RAID Controller with 36 Disks


    # Storage Summary


    +   - RAID controller hardware overview

    - Add disks to RAID controller

    - Create Tru64 UNIX cluster disks

    - Create Oracle database disks

    - Create raidssets

    - Raidset partitioning example

    - Initialize raidssets

    - Create units

    - Using wwmidgr quickset


    Once the operating system disks are planned, the remaining storage should be configured
    for Oracle.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_30_1.png)


    > TIP: Purchase a terminal server to connect all storage for configuration and
    future monitoring. Large configurations or lights-out data centers require some
    form of remote access for manageability. A software package to monitor and record
    all console activity and character output is essential for a lights-out data center.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Disk Requirements Tru64 UNIX


    Tru64 UNIX clusters require separate disks on a shared bus. The recommended disk
    sizes are shown in Figure 2-1. The Tru64 UNIX Install disk is used for the initial
    installation from CD-ROM and will not be used again during normal operation of
    the cluster. This Tru64 UNIX Install disk can be used as a recovery disk if needed.


    | Recommended Size | Description | Hardware RAID Protection | Shared Bus (SCSI
    or Fibre) | Partition |

    | --- | --- | --- | --- | --- |

    | ![4GB] | Tru64 UNIX Install Disk | Optional | No | Use Default Disk Label |

    | ![9GB] | Cluster Root /usr and /var | Yes | Yes | a root 1GB /usr 4GB /var 4GB
    (or separate disks) |

    | ![1MB] | Quorum | Yes | Yes | n/a |

    | ![576MB] | Member 1 Boot Disk and Swap | Yes | Yes | a root 64MB b swap 512MB
    |

    | ![576MB] | Member 2 Boot Disk and Swap | Yes | Yes | a root 64MB b swap 512MB
    |


    Figure 2-1 Recommended disk sizes for a 2-node cluster


    # Swap Space


    The primary swap space is located on each member disk and should be at two or
    three times the amount of physical memory. The advantage of swap space on a shared
    bus is the ability to retrieve a crash file from a member without having to boot
    the member. Alternately, the member swap disk can be located on one of the internal
    member disks (nonshared). Use hardware or software mirroring to protect the disks
    in the event of a disk failure.


    > Note: For single-node installations, the root partition should be 512MB – 1GB,
    usr should be 2GB – 4GB, and var should be 2GB – 4GB.'
  merge: -1
  pgno: 31
- img_proc: true
  md: '# Storage Area Network (SAN) Topologies


    A cluster SAN configuration should be set up for high availability, redundancy,
    and performance. In certain cases the SAN will be placed in a dedicated environment,
    or it may be shared with a mixture of nodes and operating systems. In the shared
    environment not all storage can be connected to all nodes running a mixture of
    operating systems at the same time. Switch zoning and selective storage presentation
    are ways to restrict disk access.


    For more information on storage area networks see:

    Building SANs with Brocade

    Chris Beauchamp, Josh Judd, and Benjamin Kuo

    Syngress Publishing, 2001


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_32_0.png)


    Figure 2-2 SAN basics


    # SAN Configuration Guidelines


    +   - Configure for high availability and redundancy

    - Standalone host and fabric or multiple hosts and fabrics

    - Configure for performance'
  merge: -1
  pgno: 32
- img_proc: true
  md: '# SAN Redundancy


    Configurations should contain redundant switches and multiple paths to hosts and
    storage devices. Switches can be grouped together into multiple fabrics for greater
    availability (skinny tree, fat tree, etc.). See Figure 2-3.


    # SAN Topologies


    Many SAN topologies are documented by Compaq each providing different goals. See
    Figure 2-3 for the most common topologies.


    +   * The ring fabric is best for diverse geographical needs.

    * The Cascade fabric is best for local data access, not recommended for distributed
    environments.

    * The skinny tree provides optimum port count and good scalability.

    * The fat tree fabric provides optimum performance and scalability.

    * Mesh fabrics meet diverse data access requirements.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_33_0.png)'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Switch Zoning


    Switch zoning is optional and not required for a standalone cluster and storage.
    It is necessary to zone a switch when multiple hosts must share a fabric and storage.
    Storage is set up and presented to specific hosts with the use of zoning. Zones
    can overlap in certain circumstances (sharing of backup devices). A host connected
    to zonel will not be able to set any storage on a node in zone2.


    Set the IP address on a switch and telnet to the switch.


    Log in to the switch. Default password is password.


    ```

    Fabric OS (tm) Release v3.0

    login: admin

    Password: password

    ```


    # Change the Default Switch Password


    If you want to change the default switch password, use the passwd command. Enter
    password for the old password and choose a new password up to 40 characters in
    length.


    ```

    switch:admin> passwd "admin"

    New username [admin]: <return>

    Old password:

    New password:

    Re-enter new password:

    Committing configuration..done.

    ```'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'In the following examples, as shown in Figure 2-4, four zones are illustrated
    on a 16-port switch. Stand alone clusters that will not have other hosts accessing
    the same RAID controllers do not require the use of zoning.


    # Example – Switch Zoning


    | Zone 1 | Zone 2 | Zone 3 | Zone 4 |

    | --- | --- | --- | --- |

    | Port 0 | Port 2 | Port 4 | Port 6 | Port 8 | Port 10 | Port 12 | Port 14 |

    | Port 1 | Port 3 | Port 5 | Port 7 | Port 9 | Port 11 | Port 13 | Port 15 |


    Figure 2-4 Switch zoning with multiple host connections (unclustered systems)


    # Setting the Switch Name


    In configurations with multiple switches create a naming standard for each switch,
    as numbering from 1...10 or a ...z. Physically label the switch and set the switch
    name to match. The default name is switch.


    To change the default switch name, use the switchName command followed by a new
    name enclosed in quotes.


    ```

    switch:admin switchName "switch1"

    Updating flash ...

    switch1:admin switchName

    switch1

    ```


    # Example Zone


    In this example, zone1, zone2, zone3, and zone4 will be created. For the example
    configuration used in this reference book zoning is not necessary.


    ```

    switch1:admin cfgCreate "rac_cfg", "zone1; zone2; zone3; zone4"

    switch1:admin zoneCreate "zone1", "1,0; 1,1; 1,2; 1,3"

    switch1:admin zoneCreate "zone2", "1,4; 1,5; 1,6; 1,7"

    switch1:admin zoneCreate "zone3", "1,8; 1,9; 1,11"

    switch1:admin zoneCreate "zone4", "1,10; 1,11; 1,12; 1,13"

    ```'
