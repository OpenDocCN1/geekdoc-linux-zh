    disk.


    ```# volevac dsk10 dsk12```


    # volinstall


    The volinstall script is normally started automatically by volsetup. This script
    sets up the LSM special device files and adds the following lines to the /etc/inittab
    file.


    ```lsmr:sysinit:/sbin/lsmstartup -b </dev/console >dev/console 2>&1 ##LSM

    lsmr:23:wait:/sbin/lsmstartup </dev/console >dev/console 2>&1 ##LSM

    vol:23:wait:/sbin/vol-reconfig -n </dev/console >dev/console 2>&1 ##LSM```


