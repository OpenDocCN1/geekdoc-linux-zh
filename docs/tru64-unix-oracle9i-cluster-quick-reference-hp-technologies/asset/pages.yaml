  md: '# Chapter 8 — Create and Manage Oracle9i Databases


    # Overview


    Use the Oracle database configuration assistant (DBCA) to create a new clustered
    database, manage an existing database, delete a database, and manage database
    templates.


    DBCA creates a database from an existing template, or a custom database can be
    created and saved as a new template. Preconfigured templates are available for
    a data warehouse, transaction processing, or general purpose database. The database
    file location, configuration options, and database name can be set with the DBCA
    tool.


    This chapter covers the use of the Oracle database assistant tool (DBCA) to create
    a sample Oracle9i RAC database as well as some of the new Oracle9i management
    features.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_216_0.png)


    # Plan 1 Hour to Create a Sample Database


    # Oracle9i Create Database Summary


    +   * Oracle global services daemon (GSD)

    * Oracle listener configuration

    * Run the Oracle database configuration assistant (DBCA)

    * Verify database

    * Using server control (SRVCTL)

    * Oracle9i external tables

    * Oracle9i transferable tablespaces

    * Oracle9i flashback query

    * Transparent failover'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Oracle Global Services Daemon GSD


    Oracle programs that access the database as a client as svrcctl, dbca, and Oracle
    Enterprise Manager use the gsd daemon for management operations. Before using
    dbca or svrcctl, always make sure that the gsd daemon is running on all nodes
    of the cluster.


    +   1. Start GSD on all cluster members.

    ```bash

    oracle@rac2> gsd

    Successfully started the daemon on the local node.

    ```


    Note: Start the gsd daemon only once on each node. A gsd log file is located in
    $ORACLE_HOME/srvm/log and contains connection requests from programs such as svrcctl.
    Only one gsd daemon is supported per node.


    If the gsd daemon is already running on a node, the following error message will
    appear.

    ```bash

    oracle@rac1> gsd

    An Oracle Real Application Clusters Manageability daemon is already running on
    this node, please stop it before retrying.

    ```


    The gsd daemon does not automatically restart after it is rebooted. After a reboot
    you can automatically start the gsd daemon by using a startup script placed into
    /sbin/init.d.

    ```bash

    su oracle -c "gsd"

    ```


    Create a symbolic link to your oracle script in /sbin/rc3.d.


    # Configure the Oracle Listeners


    Before creating the RAC database, configure the Oracle listeners using the netca
    configuration tool. The listener administration directory and log files are unique
    on each node. Oracle is installed on a cluster file system making a single copy
    of configuration files available to all nodes. A CDSL will be created to make
    the listener files unique for each node.


    +   2. Go to the $ORACLE_HOME/network directory.

    ```bash

