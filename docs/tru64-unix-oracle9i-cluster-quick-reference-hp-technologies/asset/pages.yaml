  md: '# Tru64 UNIX Device Special Files


    The tape special device files for version 5.x are located in /dev/tape instead
    of the /dev directory like 4.x versions of Tru64 UNIX.


    +   - /dev/tape

    -/dev/ntape (no rewind device)


    +   6. Load a tape into a drive on your system. Use the file command and specify
    a tape device to view more information about the device.


    ```

    # file /dev/ntape/tape0

    /dev/ntape/tape0: character special (19/257) SCSI #1 "TZ89"

    tape #16 (SCSI ID #2) (SCSI LUN #0) 85700_bpi

    ```


    # Magnetic Tape Manipulation


    The mt. command is used to rewind, fast forward, and prepare a tape for unloading.


    # Rewind Tape


    Rewind the tape using the mt command.


    ```

    rac1> mt -f /dev/tape/tape0 rewind

    ```


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_286_0.png)


    Figure 10-2 Tape positioning examples using the mt command


    # Skip to a Session on the Tape


    Use the “forward space count files” (fsf) option to skip to the next tape session.
    See Figure 10-2 for examples on how the tape is positioned with the mt command.
    This is used typically during a tape restore to skip tape sessions. To restore
    the /usr filesystem in Figure 10-2 the following mt command should be used:


    ```

    rac1> mt -f /dev/tape/tape0 fsf 1

    ```'
  merge: -1
  pgno: 286
- img_proc: true
  md: 'Before unloading a tape, use the mt command to take the tape offline. This
    is required before using the tape robot to move the tape from a drive to a slot.


    ```

    rac1> mt -f /dev/tape/tape0 offline

    ```


    # Operating System Backup


    Regular operating system backups should include cluster root, /usr, and /var.
    You may want to include the member boot disks and the users /home directories.
    The member boot disks can be recreated from cluster root if they are.


    +   7. Create a file named backup.sh in /usr/local/backup. This directory will
    also contain the backup log files. The example provides the basics for an operating
    system backup. Enhancements could include additional robot commands and the capability
    to add a date stamp to the backup log file.


    ```

    rac1> cd /usr/local/backup

    rac1> cat backup.sh

    dvump -D u -f /dev/ntape/tape0 -C -v / 2> backup.log

    dvump -D u -f /dev/ntape/tape0 -C -v /usr 2>> backup.log

    dvump -D u -f /dev/ntape/tape0 -C -v /var 2>> backup.log

    dvump -D u -f /dev/ntape/tape0 -C -v /home 2>> backup.log

    ```


    > Caution: If you back multiple sessions to a single tape, make sure the no-rewind
    device is used (/dev/ntape/tape0). If the “n” is omitted, the tape will rewind
    for each session, erasing previous backups on the tape and rendering the tape
    useless for recovery of the previous sessions.


    # Table 10-1: vdump options


    | -D | Performs a level 0 backup on the entire fileset |

    | -f | The vdump destination: device, file, or standard output |

    | -C | Compress the data as it is backed up. |

    | -v | Verbose mode. Displays filenames as they are backed up. |'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Table 10-1: vdumpumpdates options


    | -u | Update the file /etc/vdumpdates with the fileset name, backup level, and
    date and time of last backup. |

    | 2>> | Redirect the output to a specified file. |


    # # Restoring Files


    Restore all files from the first session on the tape device tape0 to the directory
    / u01/restore.


    Use the mt command to rewind the tape to the first session.

    racl> mt -f /dev/ntape/tpe0 rewind


    Use vrestore to restore the files on this session.

    racl> vrestore -x -v -f /dev/ntape/tpe0 -D /u01/restore


    Restore a selected file from a backup tape to the destination directory /u01/
    restore. A single filename or multiple files can be specified with vrestore. This
    example will restore the file named notes.txt.

    racl> vrestore -x -v -f /dev/ntape/tpe0 \

    -D /u01/restore ./notes.txt


    # # Dumping and Restoring Files Remotely


    Used just like the vdump and vrestore command, the remote option allows one system
    to back up over the network to a backup server. Make sure that rsh is working
    before trying these commands. You may need to add the hostname of your systems
    to the / .hosts files.


    Back up /home filesystem to remote machine named sleepy.

    racl> rvdump -D -f sleepy:/dev/tape/tpe0 \

    -C -v /home 2> backup.log &


    Restore the fileset from the remote tape drive to the /u01/restore directory.

    racl> rvrestore -xf sleepy:/dev/tape/tpe0 -D /u01/restore'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Media Robot Utility


    The Media Robot Utility (MRU) is a multi-platform utility for controlling robotic
    media loaders and libraries. MRU software executes with the robot command. The
    robot command allows users to control tape library operations, injecting and ejecting
    cartridges, loading and unloading cartridges, showing status and attributes of
    robotic loaders and libraries.


    After installing the robot software included with all Compaq robotic tape libraries,
    set the environment variable MRU_ROBOT to the changer device. If you are not sure
    which changer to use for multiple tape libraries, look in the /dev/changer directory.
    The devices in this directory are numbered sequentially starting with zero.


    Set MRU_ROBOT environment variable to the changer device in your system. If this
    is not set, the changer name will need to be appended to the robot command each
    time.


    ```

    # export MRU_ROBOT=/dev/changer/mc0

    ```


    Tape libraries contain slots, ports, and drives. The robot utility will use these
    names to move tapes inside the library.


    To display library information use the robot show command.


    Drive Information.


    ```

    rac1> robot show drive


    DRIVE:          0          Full

    ```


    Robot Information.


    ```

    rac1> robot show robot


    Robot Name: /dev/changer/mc0 Type: SCSI

    ```


    ```

    Media Robot Identifier: DEC      TL800      (C) DEC0409


    Slots:           10

    Drives:           1

    Inports:          0

    Outports:         0

    Transports:       10

    ```


    Other show commands include slot and port.


    To load a tape from a specified slot to drive the device use the load command.


    ```

    rac1> robot load slot 2 drive 0

    ```'
  merge: -1
  pgno: 289
