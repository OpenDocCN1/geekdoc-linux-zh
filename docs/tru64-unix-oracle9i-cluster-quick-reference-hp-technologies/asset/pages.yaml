  md: '# # Chapter 6 — Filesystem Configuration


    # ## AdvFS Overview

    In this chapter the AdvFS filesystems will be created for users’ home directories
    and Oracle data files. AdvFS provides a Direct I/O feature that allows Oracle
    to read and write to files without the overhead of a UNIX file system buffer cache.
    Oracle buffers database blocks, the operating system does not need to buffer these
    too. For applications other than Oracle, UBC is beneficial. The performance of
    Direct I/O is similar to raw I/O performance with the benefit of simplified file
    management. For clusters the cluster file system (CFS) is shared with all members.
    Traditionally, each user had separate home directories and Oracle binaries common
    only to the individual node. CFS allows users to have the same home directory
    structure every time they connect to the cluster. Oracle can be installed once,
    making management easier.


    > Note: UFS filesystems are not recommended or supported for Oracle9i Cluster
    installations on Tru64 UNIX.


    # ## Plan 10 Minutes for AdvFS Filesystem Configuration


    Quick Summary

    * Create a new file domain

    * Create a fileset

    * Add entry to fstab

    * Mount the fileset/domain

    * View file domain information

    * AdvFS Management


    For more information on AdvFS see:

    **Tru64 UNIX AdvFS Administration**

    Part Number: AA-RH96B-TE, August 2000

    Product Version: Tru64 UNIX Version 5.1 or higher

    Compaq Computer Corporation


    **Tru64 UNIX File System Administration Handbook**

    Steven M. Hancock

    Paperback, Digital Press, November 2000'
  merge: -1
  pgno: 178
- img_proc: true
  md: '# Direct I/O


    Tru64 UNIX 5.1 supports a feature that allows read and write I/O operations to
    bypass the unified buffer cache (UBC). This allows Oracle to near RAW disk performance
    with the added benefit of managing the database on a filesystem. See how Oracle
    performs I/O with Tru64 UNIX in Figure 6-1. A Tru64 UNIX 5.1 system with AdvFS
    filesystems will use Direct I/O by default.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_179_0.png)


    Figure 6-1 Tru64 UNIX Direct I/O


    # AdvFS Setup Steps


    +   1. Create new file domain using LSM volume created in the previous chapter.

    ```racl> mkfdmn /dev/vol/rootdg/u01_volume u01_domain

    ```


    +   Optional: If you are not using LSM, create the file domain on the raw disk
    device, for example:

    ```racl> mkfdmn /dev/disk/disk5c u01_domain

    ```


    +   2. Create the AdvFS fileset using mkfs. The first argument is the file domain
    created previously followed by the fileset name. For consistency the fileset name
    `"u01"` is part of the domain name and will become the mount point.

    ```racl> mkset u01_domain u01

    ```'
  merge: -1
  pgno: 179
- img_proc: true
  md: '3. Create a directory to mount the filesystem.

    racl> mkdir /u01


    4. Mount the new filesystem.

    racl> mount u01_domain#u01 /u01


    5. Display the filesystem size with the df command.

    racl> df


    | Filesystem | Used | Available | Capacity | Mounted on |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | cluster_root#root | 1048576 | 78431 | 964296 | 8% | /cluster/members/ |

    | root_domain#root | 262144 | 39550 | 217592 | 16% | / |

    | member2/boot_partition | 262144 | 39529 | 217272 | 16% | /cluster/members/ |

    | root1_domain#root | 5696504 | 276515 | 566164 | 1% | /var |

    | cluster_usr#usr | 5696512 | 771505 | 490946 | 14% | /usr |

    | /proc | 0 | 0 | 0 | 0% | /proc |

    | u01_domain#u01 | 27725008 | 16 | 27724152 | 0% | /u01 |


    6. Add the following line to the /etc/fstab file. The fstab file in the /etc directory
    is used to auto-mount filesystems after a system reboot. Use a text editor and
    add the u01 filesystem information to the fstab file.

    racl> vi /etc/fstab


    Add the following line to the end of the fstab file:

    u01_domain#u01 /u01 advvfs rw 0 2


    Table 6-1 describes the entries in the fstab file. The FSCK column is a pass number
    that allows the quotacheck command to perform consistency checks for the fileset.
    Specify a value of 1 for the root filesystem and a value of 2 or higher for other
    AdvFS systems.


    # Table 6-1: /etc/fstab Layout


    | File Spec | Mount Point | FS Type | Mount Options | Backup | FSCK |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | root_domain#root | / | advfs | rw | 0 | 1 |

    | /proc | /proc | procfs | rw | 0 | 0 |

    | usr_domain#usr | /usr | advfs | rw | 0 | 2 |

    | usr_domain#var | /var | advfs | rw | 0 | 2 |

    | u01_domain#u01 | /u01 | advfs | rw | 0 | 2 |'
