  md: '# Oracle SQL Loader


    The Oracle SQL loader (sqldr) provides the quickest method to bulk load data into
    Oracle database. The source data can be in the form of a flat text file, read
    from a tape device, or an application using a UNIX pipe. Table 8-2 provides a
    description of the load process.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_240_0.png)


    Figure 8-2 Oracle SQL loader process


    46. Create the Oracle SQL loader control file. The control file contains information
    on how to map the text file to a table. In this example the data is comma-delimited
    and can be optionally enclosed in quotes. This might be necessary if the data
    you want to load contains a comma, such as a description column. The control file
    specifies the name of the text file, the name of the destination table, and column
    names.


    ```

    oracle@rac1> cat alpha.ctl


    load data

    infile alpha.data

    into table alpha_server

    replace

    fields terminated by '','' optionally enclosed by ''''\n(

    model,

    cpu_mhz,

    cpu_cache,

    max_cpus,

    max_ram,

    io_bandwidth

    )

    ```'
  merge: -1
  pgno: 240
- img_proc: true
  md: '47. Run the Oracle SQL loader now using the following example. The userid and
    control file name are specified on the command line. Other options to specify
    a logfile name and bad (rejected) file are available. If the log file name is
    not specified on the command line, SQL loader will default to the name of the
    control file used with a .log extension.


    ```

    oracle@rac> sqlldr userid=racdba/compa control=alpha.ctl

    ```


