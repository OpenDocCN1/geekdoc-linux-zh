  md: '# Chapter 1 — Hardware Verification and Console Commands


    # Hardware Overview


    A cluster is defined as two or more systems interconnected for a combination of
    high availability, scalability, and redundancy.


    Compaq Tru64 UNIX 5.x clusters are built starting with a single-node installation
    followed by adding cluster software and licenses. Additional cluster members can
    be added to the cluster without having the physical hardware attached.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_16_0.png)


    > Note: Tru64 UNIX 5.1A currently supports a maximum of eight nodes. Look for
    higher node counts to be supported in future releases.


    The AlphaServer hardware family ranges from single CPU workstations through multi-CPU
    and large memory enterprise servers. Table 1-1 provides a quick summary of available
    servers, current as of February 2002.


    See the Compaq Web site http://www.compaq.com/alphaserver for the latest hardware
    information.


    # Table 1-1: Compaq AlphaServer Hardware Family


    | Model | CPU Speed | Max CPUs | CPU Cache | Max RAM | Max PCI Slots |

    |---|---|---|---|---||

    | DS20E | 833 | 2 | 8MB | 4GB | 6 |

    | ES40-1 | 833 | 4 | 8MB | 16GB | 6 |

    | ES40-2 | 833 | 4 | 8MB | 32GB | 10 |

    | ES45 | 1000 | 4 | 8MB | 32GB | 10 |

    | GS80 | 1001 | 8 | 8MB | 64GB | 56 |

    | GS160 | 1001 | 16 | 8MB | 128GB | 112 |

    | GS320 | 1001 | 32 | 8MB | 256GB | 224 |'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Mixed clusters refer to two or different Alpha systems forming a cluster. A
    mixed cluster containing a GS140 and a GS160 is supported but not recommended
    for a Oracle RAC. Oracle clusters should be balanced with the same CPU speed,
    memory, and I/O capabilities.


    Clusters can be built with either Fibre Channel or SCSI adapters that are connected
    to all cluster members. Examples throughout this book refer to Fibre Channel storage.


    The cluster interconnect can be Memory Channel or Memory Channel II. Tru64 UNIX
    5.1A supports 100mb Ethernet and gigabit Ethernet for the cluster interconnect.
    This is not recommended for production clusters running Oracle that require optimum
    performance. Other cluster interconnects will be available in future releases
    of Tru64 UNIX. Memory Channel provides the best cluster interconnect with the
    lowest latency.


    # Summary


    +   * Verify hardware, CPU, memory, adapters

    * Confirm minimum system requirements

    * Hardware console command quick reference


    # Minimum Hardware Requirements for Oracle9i RAC


    +   * 2 DS20 AlphaServers with EV56 CPUs or newer

    * 256MB RAM

    * 50GB of shared disk storage (operating system, software, and database)'
  merge: -1
  pgno: 17
