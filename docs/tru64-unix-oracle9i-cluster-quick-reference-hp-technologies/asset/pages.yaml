  md: '# Command Prompts


    During the installation of the Tru64 UNIX/Oracle cluster, connection to several
    types of devices is required. Starting with the AlphaServer console, moving to
    the StorageWorks RAID controller, and then during the UNIX installation, the prompt
    will change. The prompt used in this document indicates the type of command to
    be used.


    # ### Table I-1: Command Prompts Used In This Reference


    | Prompt | Description |

    | --- | --- |

    | P000>>> | Hardware console prompt used to enter commands from the AlphaServer
    console. |

    | # | UNIX commands entered as the root/super-user account. This is a default
    UNIX prompt and will change after a profile is created. |

    | rac1> | UNIX commands entered as root from node 1 (member 1) of the cluster.
    |

    | rac2> | UNIX commands entered as root from node 2 (member 2) of the cluster.
    |

    | oracle@rac> | UNIX commands entered as “oracle” from node 1 (member 1) of the
    cluster. |

    | SQL> | Oracle SQL commands entered from the SQL*Plus utility. |

    | HSG1_a> | Commands entered at the HSG80 RAID controller prompt. |


    # Reference Configuration Used


    The document follows a 2-node Tru64 UNIX cluster installation from start to finish.
    Nodes are named rac1 and rac2. The cluster aliases is rac.


    Operating System Version: Tru64 UNIX 5.1A with Patch Kit 1 Hardware:


    +   - 2 – DS20 computers with 2 CPUs and 1GB of RAM each

    - 1 – Memory channel II card per node (no hub)

    - 2 – 16 port switches

    - 1 – HSG80 RAID controller with 3 disk shelves and 24 18GB disks'
  merge: -1
  pgno: 14
- img_proc: true
