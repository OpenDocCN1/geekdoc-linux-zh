    | | Warning | Warnings and cautions appear near some commands that could result
    in data loss if not properly used. |

    | | Reference | For more information on a topic, the book icon will provide the
    names of other manuals or books. |

    | | Tip | Tips are used for command shortcuts and to provide pointers on a topic.
    |

    | | Console | During the cluster installation, connection to a specific node or
    member will be required. This icon is used as a notifier to switch to another
    member. |'
