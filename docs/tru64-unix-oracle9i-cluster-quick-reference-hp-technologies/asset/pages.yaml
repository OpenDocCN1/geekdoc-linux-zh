    # Storage Configuration Steps


    # Options for Cluster Root Disk


    +   * Use hardware mirrorsets or hardware RAID 5.

    * If your configuration has enough disks and controllers consider creating mirror
    sets for cluster root and member boot disks.

    * Few available disks in the configuration consider RAID 5 partitioning. This
    process is more detailed and will be documented throughout this quick reference.
    RAID 5 will provide more efficient use of disk space on the OS disks. Mirror sets
    can also be partitioned using the same techniques.


    +   1. Select the storage cabinet and RAID controller that will be used for the
    operating system disks. If the configuration has more than one storage cabinet
    and more than one controller, number the storage cabinets and controllers sequentially
    starting with 1. Select the first cabinet and controller for the operating system
    disk.'
