    # Manage Oracle9i with the Server Control Utility


    Use the srvctl command to manage instances in real application clusters. This
    single command is used to start up or shut down the database on all nodes or individually
    start up or shut down selected nodes.


    > Note: The file srvConfig.loc contains the location of the shared configuration
    used by srvctl functions. This file is created during the Oracle installation.
    The db9i_configuration file specified during installation is updated by DBCA when
    a database is created.


    ```

    oracle@rac2> cd /var/opt/oracle

    oracle@rac2> cat srvConfig.loc

    srvConfig.loc=/u01/app/oracle/db9i_configuration

    ```'
