    # UNIX Kernel Parameters for Oracle


    The following modifications are a good baseline for most Oracle installations
    on Tru64 UNIX 5.1A. Make the modifications to the kernel on each cluster member
    and reboot the member when finished.


    # Table 7-3: Minimum Kernel Settings for Oracle9i


    | Kernel Parameter | Setting | Description |

    | max_per_proc_stack_size | 32MB, or 33554432 | Processor stack size. Do not set
    higher than 512MB. |

    | per_proc_stack_size | 32MB, or 33554432 | Processor stack size. |

    | shm_max | 4GB less 16MB or 4278190080 | Maximum allowable size of the shared
    memory. |

    | shm_min | 1024 | Maximum allowable size of single shared memory segment. |

    | shm_mni | 256 | Maximum number of shared memory segments. |

    | shm_seg | 128 | Maximum number of shared memory segments one process can attach.
    |


    If some of the kernel parameters are set higher on your system, use the higher
    values.'
