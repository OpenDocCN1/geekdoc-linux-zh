    # Oracle Database Files


    Database files should be distinguishable from all other files on a system and
    should be in a location for easy of maintenance and backups. In the following
    example demo represents the database name or $ORACLE_SID.


    ```

    /u01/oradata/demo

    ```


    # Table 7-5: Oracle Database Filename Conventions


    | Filetype | Naming Convention |

    | *.dbf | Oracle datafiles (users.dbf, system.dbf, etc.) |

    | *.ctl | Control files (control01.ctl, control02.ctl, etc.) |

    | *.log | Log files |

    | *.exp | Oracle export files |

    | *.sql | Oracle SQL programs |


    Database files should be spread across multiple disk devices, either using the
    logical storage manager (LSM), multiple mount points and filesystems, or a combination
    of both software striping and separate disks.'
