- img_proc: true
  md: 'Optional: To set a custom chunksize, add the chunksize option after the raidset
    name.


    ```

    HSG1_a> initialize r1 chunksize=64

    ```


    # Calculate the RAID 5 Partition Sizes


    In this configuration a 35GB RAID 5 disk will be hardware partitioned into six
    pieces for the operating system disks and two data disks. The data disks need
    to be close to the size of the other three member RAID 5 disks to allow for software
    striping. The cluster root, usr, and var disks need to meet the minimum size requirements.
    Starting with the cluster disks, make a rough calculation of the needed percentage.


    Figure 2-14 provides a graphical view of the partitioned raidset and each unit
    of storage.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_52_0.png)


    Figure 2-14 Example partitioned raidset (cluster root, member boot disks and data
    disk)


    20. Create raidset partitions (member boot disks, quorum disk). The size parameter
    is a percentage of total disk size. The largest option is remainder of the disk.


    Use the worksheet in Figure 2-15 to assist in correctly calculating net usable
    space with partitioned raidsets.'
  merge: -1
  pgno: 52
- img_proc: true
  md: '# Raidset Partition Worksheet


    (A) Enter the RAID chunksize.

    | Chunksize |

    |---||

    | 256 |


    (B) Enter the raidsize in blocks (use "show raid full" to view raid sizes).

    | Raidset Size (blocks) |

    | 177738520 +2 = 88,869,260 KB |


    (C) Calculate the stripe size.

    | Chunksize | Members -1 | Stripe Size (blocks) |

    |---|---|---||

    | 256 | (6-1) | = 1280 |


    (D) Enter the percentage of space for the new partition.

    | % | Raidset |

    |---|---||

    | 0.39 X 177738520 | = 69318022.8 |


    (E) Take the calculated size from step D and truncate it and round down to next
    lower stripe boundary.

    | Truncate | Stripe Size (blocks) | Stripe Boundary |

    |---|---|---|

    | 69318022 + 1280 = | 54154 |


    (F) Multiply the stripe boundary by the stripe size and subtract 5 blocks for
    overhead.

    | Stripe Boundary | Stripe Size - overhead | Net Usable Space |

    |---|---|---|

    | 54154 X 1280 -5 = | 69317115 |


    Figure 2-15 Calculating usable space from a partitioned raidset


    > Note: In Figure 2-15, 39% of a 6 member (18GB) RAID 5 set is calculated. The
    net usable space is based on stripe boundaries with 5 blocks of overhead. Examples
    follow in this configuration that use 39%, 39%, 14%, 4% and 4% which all add up
    to 100%, yet we still have space for a quorum disk. All RAID calculations truncate
    and round down to stripe boundaries to ensure that you don''t exceed 100% of the
    disk size.


    ```

    HSG1_a create_partition r1 size=39

    ```


    Look at raidset r1 with the show command. Note the new 35GB partition.'
