    +   52. The environment variable for the database name. The database name used
    in this document is "demo." The environment variable ORACLE_SID is node-specific;
    the member ID needs to be concatenated to the database name.


    ```

    # Set Oracle SID

    --------------------------------------------------

    DB_NAME=demo

    member=`/usr/sbin/clu_get_info | grep "this member" | \\

    awk ''{print $6}''`

    ORACLE_SID=$(DB_NAME)$member

    export DB_NAME ORACLE_SID

    ```


    +   53. Set the PATH to include the Oracle software executables. The path must
    be on one line without any spaces.


    ```

    # Update UNIX Path

    --------------------------------------------------

    PATH=/usr/bin:/usr/lib:/sbin:/usr:$ORACLE_HOME/bin: \\

    usr/lib/X11:/usr/local/bin:$HOME/bin::

    ```


    +   54. Set the command line editor by setting the environment variable VISUAL
    to vi or emacs. The emacs editor is the more traditional one, using the arrow
    keys to recall previous commands. The vi command line editor is also used for
    those who are familiar with the vi text editor.


    ```

    # Set the Default Command Editor

    --------------------------------------------------

    VISUAL=emacs

    export VISUAL

    ```


    +   55. If your system has more than 2GB of physical memory, the shell limits
    must be raised. The default limits will cause Oracle to get a variety of "out
    of memory"'
