  md: '# LSM Command Summary


    The dxlsm utility is used to view and manage LSM containers with a graphical interface.


    dxlsm


    ```

    # /usr/bin/dxlsm

    ```


    Start the LSM storage administrator GUI using the lsmsa command. The lsmmsa utility
    will become the dxlsm replacement.


    lsmsa


    ```

    # /usr/bin/lsmsa

    ```


    Use volassis to automatically create, mirror, back up, and move volumes.


    volassis


    To display default values for volassis use the help option.


    ```

    # volassis help showattrs

    ```


    To create a simple single, disk volume enter the following:


    ```

    # volassis make u01_volume 20g dsk10

    ```


    To create a new 100GB volume named u01_volume using a striped plex, the following:


    ```

    # volassis make u01_volume 100g layout=stripe \

    nstripe=3 dsk10 dsk11 dsk12

    ```


    The voidctl command is used to manage the void daemon.


    voidctl


    List the contents of the /etc/vol/volboot file.


    ```

    # voidctl list

    ```


    ```

    Volboot file

    version: 3/1

    seqno: 0.1

    hostid: rac

    entries:

    ```


    To display the current operating mode for void.


    ```

    # voidctl mode

    ```


    mode: enabled'
