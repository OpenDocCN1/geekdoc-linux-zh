  md: 'Oracle error utility is used to translate error numbers into more detailed
    messages and a solution. Oracle error messages contain a descriptor followed by
    an error number. Take the descriptor as the first argument for oerr followed by
    the error number.


    Example error message received with create tablespace statement

    SQL> create tablespace test_error size 10m;

    create tablespace tim size 10m


    ```

    ERROR at line 1:

    ORA-02180: invalid option for CREATE TABLESPACE

    ```


    Use the oerr utility to provide more information on this error message. You don''t
    need to exit sqlplus to view the error details. Use the exclamation point “!”
    followed by any UNIX command.

    SQL> oerr ora 2180


    ```

    02180, 00000, *invalid option for CREATE TABLESPACE

    //Cause: An invalid option appears.

    //Action: Specify one of the valid options: DATAFILE, STORAGE, ONLINE, OFFLINE.

    ```


    # sqlldr


    The Oracle SQL loader (sqlldr) provides the quickest method to build load data
    into an Oracle database. The source data can be in the form of a flat text file,
    read from a tape device, or an application using a UNIX pipe.


    The userid and control file name are specified on the command line. Other options
    to specify a logfile name and bad (rejected records) file are available. If the
    log file name is not specified on the command line, SQL loader will default to
    the name of the control file used with a .log extension.


    ```

    # sqlldr userid=racdba/compaq control=alpha.ctl

    ```


    The control file specifies the name of the text file, the name of the destination
    table, and column names.


    ```

    # cat alpha.ctl

    load data

    infile alpha.data

    into table alpha_server

    replace

    fields terminated by '','', optionally enclosed by ''*''

    (

    model,

    cpu_mhz

    )

    ```'
