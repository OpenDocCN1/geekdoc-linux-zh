  md: '# Autostart Collect after a Reboot


    To set up collection to run automatically each time the system is booted issue
    the following commands:


    Create a directory to store the collect binary files.


    ```

    rac2> mkdir /u01/app/collect

    ```


    The rc.config file is node specific and needs to be updated on all nodes with
    the rcmgr command. The rcmgr command will modify the /etc/rc.config file inserting
    entries for collect.


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_267_0.png)


    ```

    rac1> rcmgr set COLLECT_AUTORUN 1

    rac1> rcmgr set COLLECT_COMPRESSION 1

    rac1> rcmgr set COLLECT_ARGS "-f /u01/app/collect/rac1 \"

    -H d00:05,12m -i60,600"

    ```


    ![](img/c5e29563e8b7ebaf2f5afc630a4e1eb9_267_1.png)


    ```

    rac2> rcmgr set COLLECT_AUTORUN 1

    rac2> rcmgr set COLLECT_COMPRESSION 1

    rac2> rcmgr set COLLECT_ARGS "-f /u01/app/collect/rac2 \"

    -H d00:05,12m -i60,600"

    ```


    # Description of Command Line Options:


    +   -i Interval (60,600), 60 seconds for cpu, memory, IO, etc;

    600 seconds for process information'
