  md: '# Tru64 UNIX-Oracle9i Cluster Quick Reference


    Tim Donar


    "Tim Donar, a real practitioner, knows how to use technology but he also understands
    the challenge of quickly implementing it without needing to refer to many books
    and manuals to do so. His knowledge and experience of deploying Oracle9i Real
    Application Clusters on Tru64 UNIX cluster have been crystallized in this book,
    to help jump start your database environment."


    Ken Jacobs, VP Product Strategy, Server Technologies, Oracle Corporation


    "Remarkable in its soup-to-nuts coverage of all aspects of putting together a
    Tru64 UNIX-Oracle9i cluster. Information is covered in a succinct easy-to-read
    manner."


    Brad Nichols, Technical Consultant, Compaq Tru64 UNIX Support Engineering


    "Tru64 UNIX-Oracle9i Cluster Quick Reference provides a concise step-by-step procedure
    for implementing Oracle9i on a Compaq Tru64 UNIX cluster. By starting with the
    hardware, software, and finally installation procedures, Tim made an excellent
    job in capturing the necessary processes without overwatering them with detail.
    The summary quick references at the end of each chapter are right on. This is
    a must-have reference for any system administrator''s bookshelf."


    Steve Gonzalez, Senior Consultant, Compaq Advanced Technology Group


    Until now, setting up a Tru64 UNIX cluster running Oracle9i would involve referencing
    information from an entire shelf of books. Organizing this information into one
    source, this new reference simpli


    dies the task of installation and makes a quick start possible from start to finish.
    Clear instructions and graphic illustrations. Command summary guides in each chapter
    serve as keys for fast information retrieval. Knowledge from over thirty references
    is distilled into this single book seamlessly linking subject to greatly simplified,
    quick instructions.


    This quick reference provides step-by-step instructions on setting up Oracle9i
    RAC to run on a Tru64 UNIX cluster. Configuration information is included from
    start to finish. Command summary guides are built into each chapter for quick
    information retrieval. Examples and step-by-step instructions assist in the complete
    installation of Tru64 UNIX 5.1A and Oracle9i. Designed as an introduction to Tru64
    UNIX and Oracle9i RAC, Tru64 UNIX-Oracle9i Cluster Reference will give intermediate
    and advanced administrators an invaluable resource for locating vital information.


    What does this book cover?


    +   - Hardware Configuration Tips

    - StorageWorkers HSG80 Setup Steps

    - UNIX Installation and Cluster Configuration

    - LSM/ADVx Examples

    - Oracle9i RAC Installation, Database Configuration

    - Performance Tuning Tools, Backup, and Recovery


    Tim Donar worked in the computer industry for over 17 years. In the first part
    of his career he wrote CAD software in Southern California and Massachusetts.
    He currently works as a system architect designing and implementing large data
    warehouses.


    ISBN: 1-55558-272-9


