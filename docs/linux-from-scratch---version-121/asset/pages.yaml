- pgno: 69
  md: 'Prepare GCC for compilation:


    ```

    ../configure \

    --target=$LFS_TGT \

    --prefix=$LFS/tools \

    --with-glibc-version=2.39 \

    --with-sysroot=$LFS \

    --with-newlib \

    --without-headers \

    --enable-default-pie \

    --enable-default-ssp \

    --disable-tls \

    --disable-shared \

    --disable-multilib \

    --disable-threads \

    --disable-libatomic \

    --disable-libgomp \

    --disable-libquadmath \

    --disable-libsss \

    --disable-libvtv \

    --disable-libcdxx \

    --enable-languages=c,c++

    ```


    # The meaning of the configure options:


    --with-glibc-version=2.39

    This option specifies the version of glibc which will be used on the target. It
    is not relevant to the host distro because everything compiled by pass1 GCC will
    run in the root environment, which is isolated from the glibc of the host.


    --without-newlib

    Since a working C library is not yet available, this ensures that the inhibit_lib
    constant is defined when building glibc. This prevents the compiling of any code
    that requires libc support.


    --without-headers

    When creating a cross-compiler, GCC requires standard headers compatible with
    the target system. For these purposes headers are not needed. This switch prevents
    GCC from looking for them.


    --enable-default-pie and --enable-default-ssp

    Those switches allow GCC to compile programs with some hardening security features
    (more information on those in the note on PIE and SSP in chapter 8) by default.
    They are not strictly needed at this stage, the compiler will only produce temporary
    executables. But it is cleaner to have the temporary packages as close as possible
    to the final ones.


    --disable-shared

    This switch forces GCC to link its internal libraries statically. We need this
    because the shared libraries require Glibc, which is not yet installed on the
    target system.


    --disable-multilib

    --disable-threads, --disable-libatomic, --disable-libgomp, --disable-libquadmath,
    --disable-libsss, --disable-libvtv, --disable-libcdxx


    On x86_64, LFS does not support a multilib configuration. This switch is harmless
    for x86.

    The switches disable support for threading, libatomic, libgomp, libquadmath, libsss,
    libvtv, and the C++ standard library respectively. These features may fail to
    compile when building a cross-compiler and are not necessary for the task of compiling
    the temporary libc.


    --enable-languages=c,c++

    This option ensures that only the C and C++ languages are built. These are the
    only languages needed now.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# Linux From Scratch - Version 12.1


    Compile GCC by running:


    ```

    make

    ```


    Install the package:


    ```

    make install

    ```


    This build of GCC has installed a couple of internal system headers. Normally
    one of them, limits.h, would turn include the corresponding system limits.h header,
    in this case, $LFS/usr/include/limits.h. However, at the time of this build of
    GCC $LFS/usr/include/limits.h does not exist, so the internal header that has
    just installed is a partial, self-contained file and does not include the extended
    features of the system header. This is adequate for building Glibc, but the full
    header will be needed later. Create a full version of the internal header using
    a command that is identical to what the GCC build system does in normal circumstances:


    > Note

    The command below shows an example of nested command substitution using two methods:
    backquotes and a $() construct. It could be rewritten using the same method for
    both substitutions, but is shown this way to demonstrate how they can be mixed.
    Generally the $() method is preferred.


    ```

    cd ..

    cat gcc/limitx.h gcc/limits.h gcc/limity.h > \

    `dirname $($LFS_TGT-gcc -print-libgcc-file-name)`/include/limits.h

    ```


    Details on this package are located in Section 8.28.2, "Contents of GCC."'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 5.4. Linux-6.7.4 API Headers


    The Linux API Headers (in linux-6.7.4.tar.xz) expose the kernel''s API for use
    by Glibc.


    Approximate build time: less than 0.1 SBU

    Required disk space: 1.5 GB


    # 5.4.1. Installation of Linux API Headers


    The Linux kernel needs to expose an Application Programming Interface (API) for
    the system''s C library (Glibc in LFS). This is done by sanitizing various C header
    files that are shipped in the Linux kernel source tarball.


    Make sure there are no stale files embedded in the package:


    ```

    make mrproper

    ```


    Now extract the user-visible kernel headers from the source. The recommended make
    target "headers-install" cannot be used, because it requires rsync, which may
    not be available. The headers are first placed in /.usr, then copied to the needed
    location.


    ```

    make headers

    find usr/include -type f ! -name ''*.h'' -delete

    cp -rv usr/include LFS/usr

    ```


    # 5.4.2. Contents of Linux API Headers


    /usr/include/asm/*.h, /usr/include/asm-generic/*.h, /usr/include/drm/*.h, /usr/include/

    linux/*.h, /usr/include/misc/*.h, /usr/include/mtd/*.h, /usr/include/rdma/*.h,
    /usr/

    include/scsi/*.h, /usr/include/video/*.h, and /usr/include/xen/*.h, /usr/

    include/misc, /usr/include/mtd, /usr/include/rdma, /usr/include/scsi, /usr/include/linux,
    /usr/

    include/asm, /usr/include/asm-generic, /usr/include/drm, /usr/include/linuxux,
    /usr/

    include/video, and /usr/include/xen


    Installed headers:


    Installed directories:


    # Short Descriptions


    +   - /usr/include/asm/*.h

    - /usr/include/asm-generic/*.h

    - /usr/include/drm/*.h

    - /usr/include/linux/*.h

    - /usr/include/misc/*.h

    - /usr/include/mtd/*.h

    - /usr/include/rdma/*.h

    - /usr/include/scsi/*.h

    - /usr/include/sound/*.h

    - /usr/include/video/*.h

    - /usr/include/xen/*.h


    +   - The Linux API ASM Headers

    - The Linux API ASM Generic Headers

    - The Linux API DRM Headers

    - The Linux API Linux Headers

    - The Linux API Miscellaneous Headers

    - The Linux API MTD Headers

    - The Linux API RDMA Headers

    - The Linux API SCSI Headers

    - The Linux API Sound Headers

    - The Linux API Video Headers

    - The Linux API Xen Headers'
