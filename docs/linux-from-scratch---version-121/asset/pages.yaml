    # # 9.6. Creating Files at Boot


    At times, it is desirable to create files at boot. For instance, the /tmp/.ICE-unix
    directory is often needed. This can be done by creating an entry in the /etc/sysconfig/createfiles
    configuration script. The format of this file is embedded in the comments of the
    default configuration file.


    # # 9.6.7. Configuring the Syslogd Script


    The sysloglog script invokes the syslog program as a part of System V initialization.
    The -m option turns off the periodic timestamp that syslog writes to the log files
    every 20 minutes. If you want to turn off periodic timestamp, edit /etc/sysconfig/rc.site
    and define the variable SYSLOG_PARMS to the desired value. For instance, to remove
    all parameters, set the variable to a null value:


    ```

    SYSLOG_PARMS=

    ```


    # # 9.6.8. The rc.site file


    The optional /etc/sysconfig/rc.site file contains settings that are automatically
    set for each SystemV boot. You can alternatively set the values specified in the
    hostname, console, and clock files in the /etc/sysconfig/directory. If the associated
    variables are present in both separate files and rc.site, the values in the script-specific
    files take effect.


    rc.site also contains parameters that can customize other aspects of the boot
    process. Setting the IPROMPT variable will enable selective selecting of bootstraps.
    Other options are described in the file comments. The default version of the file
    as follows:


    ```

    # rc.site

