    0\" ]; then print_error_msg; fi\ndone\n\n# Store interactive variable on switch\
    \ from runlevel S and remove if not\nif [ \"$runlevel\" == \"S\" -a n \"$interactive\"\
    \ == \"i\" ]; then\necho \"interactive=\\$1\" > /run/interactive\nelse\n  rm -f\
    \ /run/interactive 2>/dev/null\nfi\n\n# Copy the boot log on initial boot only\n\
