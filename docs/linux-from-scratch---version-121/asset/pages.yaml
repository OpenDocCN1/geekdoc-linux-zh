  md: "# ## 8.27. Shadow-4.14.5\n\nThe Shadow package contains programs for handling\
    \ passwords in a secure way.\n\nApproximate build time: 0.1 SBU\nRequired disk\
    \ space: 49 MB\n\n# ### 8.27.1. Installation of Shadow\n\n> If you would like\
    \ to enforce the use of strong passwords, refer to https://www.linuxfromscratch.org/blfs/view/12.1/posts/cracklib.html\
    \ for installing CrackLib prior to building Shadow. Then add --with-cracklib to\
    \ the configure command below.\n\nDisable the installation of the **groups** man\
    \ and its pages, as Coreutils provides a better version. Also, prevent the installation\
    \ of manual pages that were already installed in Section 8.3, \"Man-pages-6.06\"\
    :\n\n```\nsed -i 's/groups8 (EXEECT)//' src/Makefile.in\nfind man -name Makefile.in\
    \ -exec sed -i 's/groups\\.1 / /' () \\\nfind man -name Makefile.in -exec sed\
    \ -i 's/getnpam\\.3 / /' () \\\nfind man -name Makefile.in -exec sed -i 's/passwd\\\
    .5 / /' () \\\n```\n\nInstead of using the default *crypt* method, use the more\
    \ secure YESCRYPT method of password encryption, which allows passwords longer\
    \ than 8 characters. It is also necessary to change the obsolete /var/spool/mail\
    \ location for user mailboxes that Shadow uses to /var/mail location currently.\
    \ Also, remove /bin and /sbin from the PATH, since they are simply symlinks to\
    \ their counterparts in /usr.\n\n> If you wish to include /bin and /sbin in the\
    \ PATH for some reason, modify the PATH in .bashrc after LFS has been built.\n\
    \n```\nsed -i 's:ENCRYPT_METHOD DES:ENCRYPT_METHOD YESCRYPT:/\\\\\n-e 's:/var/spool/mail:/var/mail:'\\\
    \\\n-e '/PATH:\\/(s/sbin:@;/bin:@'\\\\\n-etc etc/login.defs\n```\n\n> If you choose\
    \ to build Shadow with CrackLib support, issue this command:\n\n```\nsed -i 's:DICTPATH*:DICTPATH=/t/lib/cracklib/pw_dict:'\
    \ etc/login.defs\n```\n\nPrepare Shadow for compilation:\n\n```\ntouch /usr/bin/passwd\n\
    ./configure --sysconfdir=/etc \\\n  --disable-static \\\\\n  --with-(b,yes)crypt\
    \ \\\\\n  --without-libd \\\\\n  --with-group-name-max-length=32\n```"
  merge: -1
  img_proc: true
- pgno: 158
  md: "# The mean of the new configuration options:\n\ntouch /usr/bin/passwd needs\
    \ to exist because its location is hardcoded in some programs; if it does not\
    \ already exist, the installation script will create it in the wrong place.\n\n\
    --with-(b,yes)crypt\nThe shell expands to these two switches, --with-bcrypt and\
    \ --with-yescrypt. They allow you to use the Bcrypt and Yescrypt algorithms implemented\
    \ by Libxcrypt for hashing passwords. They are all secure (in particular, more\
    \ resistant to GPU-based attacks) than the traditional SHA algorithms.\n\n--with-group-name-max-length=n32\n\
    The longest permissible user name is 32 characters. Make the maximum length of\
    \ a group name the same.\n\n--without-libsdd\n not use the readphrase from libsdd\
    \ which is not in L. Use the internal copy inside.\n\nCompile the package:\n\n\
    ```\nmake\n```\n\nThis package does not come with a test suite.\n\nInstall the\
    \ package:\n\n```\nmake exec_prefix=/usr install\nmake -C man install-man\n```\n\
    \n# 82.27. Configuring Shadow\n\nThis package contains utilities to add, modify,\
    \ and delete users and groups; set and change their passwords; and perform other\
    \ administrative tasks. For a full explanation of what password shadowing means,\
    \ see the doc/HOWTO file within the unpacked store. If you use Shadow support,\
    \ keep in mind that programs need to verify passwords (display managers, FTP programs,\
    \ po3 daemons, etc.) must be Shadow-compliant. That is, they must be able to work\
    \ with shadowed passwords.\n\nTo enable shadowed passwords, run the following\
    \ command:\n\n```\npwconv\n```\n\nTo enable shadowed group passwords, run:\n\n\
    ```\ngrpconv\n```\n\nShadow's default configuration for the useradd utility needs\
    \ some explanation. First, the default action for the useradd utility is to create\
    \ a user and a group with the same name as the user. By default the user ID (UID)\
    \ and group ID (GID) numbers will begin at 1000. If you do not pass extra parameters\
    \ to useradd, each user will be a member of a unique group on the system. If this\
    \ behavior is undesirable, you will need to pass the -g or -N parameter to useradd,\
    \ or change the setting of USERGROUPS_ENAB in /etc/login.defs. See useradd(8)\
    \ for more information.\n\nSecond, to change the default parameters, the file\
    \ /etc/default/useradd must be created and tailored to suit your particular needs.\
    \ Create it with:\n\n```\nmkdir -p /etc/default\nuseradd --gid 999\n```"
