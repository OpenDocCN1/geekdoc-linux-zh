  img_proc: true
- pgno: 264
  md: '# 9.5. General Network Configuration


    # 9.5.1. Creating Network Interface Configuration Files


    The files in /etc/sysconfig/ usually determine which interfaces are brought up
    and down by the network script. The directory should contain a file for each interface
    to be configured, such as ifconfig.xyz, where "xyz" describes the network card.
    The interface name (e.g. eth0) is usually appropriate. Each file contains the
    attributes of one interface, such as its IP address(es), subnet mask, and so forth.
    The stem of the filename must be ifconfig.


    > Note

    If the procedure in the previous section was not used, udev will assign network
    card names based on physical characteristics such as enp2s0. If you are not sure
    what your interface name is, you can always run ip link or /sys/class/net after
    you have booted your systemnThe names depend on the implementation and configuration
    of the udev daemon running on the system. "Udev from Systemd-255" will not run
    until the LFS system is booted. So the interface names in the LFS system cannot
    be determined by running those commands on the host distro, even in the chroot
    environment.


    The following command creates a sample file for the eth0 device with a static
    IP address:


    ```

    cd /etc/sysconfig/

    cat > ifconfig.eth0 << "EOF"

    ONBOOT=eth0

    IFACE=eth0

    SERVICE=ipv4-static

    IP=192.168.1.2

    GATEWAY=192.168.1.1

    PREFIX=24

    BROAD=192.168.1.255

    EOF

    ```


    The values in italics are changed in each file, to set the interfaces correctly.


    If the ONBOOT is set to yes the System network script will bring the Network Interface
    Card (NIC) during the system boot process. If set to anything else, the NIC will
    be ignored by the network script and will not be started automatically. Interfaces
    can be manually started or stopped using the ifup and ifdown commands.


    The IFACE variable defines the interface name, for example, eth0. It is required
    for all network configuration files. The file extension must match this.


    The SERVICE variable defines the method for obtaining the IP address. The LFS-Bootscripts
    package has a module IP assignment format, creating additional files in the /lib/services/
    directory allow other IP assignment methods. This is commonly used for Dynamic
    Host Configuration Protocol (DHCP), which is addressed in the BLFS block.


    The GATEWAY variable defines the default gateway IP address, if one is present.
    If not, then comment out the variable entirely.


    The PREFIX variable specifies the number of bits in the subnet. Each segment of
    an subnet is 8 bits. If the subnet is 255.255.255.0, then it is using the first
    3 segments (24 bits) to specify the network number. If the netmask is 255.255.255.252,
    the subnet is using the first 28 bits. Prefixes longer than 24 bits are commonly
    used by DSL and cable-based Internet Service Providers (ISPs). If (PREFIX=24),
    the netmask is 255.255.255.255. Adjust the PREFIX variable according to your specific
    subnet. If omitted, the PREFIX defaults to 24.'
  merge: -1
  img_proc: true
