  md: '# Linux From Scratch - Version 12.1


    References to paths that components have `-linux-gnu` should be ignored, but otherwise
    the output of the last command should be:


    ```

    SEARCH_DIR("/usr/x86_64-pc-linux-gnu/lib64")

    SEARCH_DIR("/usr/local/lib64")

    SEARCH_DIR("/lib64")

    SEARCH_DIR("/usr/lib")

    SEARCH_DIR("/usr/x86_64-pc-linux-gnu/lib")

    SEARCH_DIR("/usr/local/lib")

    SEARCH_DIR("/lib")

    SEARCH_DIR("/usr/lib")

    ```


    A 32-bit system may use other directories. For example, here is the output from
    an i686 machine:


    ```

    SEARCH_DIR("/usr/i686-pc-linux-gnu/lib32")

    SEARCH_DIR("/usr/local/lib32")

    SEARCH_DIR("/lib32")

    SEARCH_DIR("/usr/lib")

    SEARCH_DIR("/usr/i686-pc-linux-gnu/lib")

    SEARCH_DIR("/usr/local/lib")

    SEARCH_DIR("/lib")

    SEARCH_DIR("/usr/lib")

    ```


    Next make sure we''re using the correct libc:


    ```

    grep "/lib*/libc.so.6 " dummy.log

    ```


    The output of the last command should be:


    ```

    attempt to open /usr/lib/libc.so.6 succeeded

    ```


    Make sure GCC is using the correct dynamic linker:


    ```

    gpe dummy.log

    ```


    The output of the last command should be (allowing for platform-specific differences
    in dynamic linker name):


    ```

    found ld-linux-x86-64.so.2 /usr/lib/ld-linux-x86-64.so.2

    ```


    If the output does not appear as shown or is not received at all, then something
    is seriously wrong. Investigate and repeat the steps to find out where the problem
    is and correct it. Any issues should be resolved before continuing with the process.


    Everything is working cleanly once you test the files:


    ```

    rm -v dummy.c a out dummy.log

    ```


    Finally, move a misplaced file:


    ```

    mkdir -pv /usr/share/gdb/auto-load/usr/lib

    mv -v /usr/lib/*gdb.py /usr/share/gdb/auto-load/usr/lib

    ```


