    Installed programs: chage, cfhn, chpasswd, chsh, expiry, faillog, getpasswd, gpasswd,
    groupadd, groupdel, groupms, groupmod, grpack, grpconv, grpuncon, login, logout,
    new,,map, newsers, nolog, passwd, pwck, pwconv, pwunconv, sg (link to new), su,
    useradd, usermod, vig (link to vipw), and vipw


    Installed directories: /etc/default and /usr/include/shadow


    Installed libraries: libshadow.so


    # Short Descriptions


    +   - chage Used to change the number of days between obligatory password changes


    +   - cfhn Used to change a user''s full name and other information


    +   - chpasswd Used to update group passwords in batch mode


    +   - chpasswd Used to update user passwords in batch mode


    +   - chsh Used to change a user''s default login shell


    +   - expiry Checks and enforces the current password expiration policy


    +   - faillog Used to examine the log of login failures, to set a maximum number
    of failures before an account is blocked, and to reset the failure count


    +   - getsubid Used to list the shadow id ranges for a user


    +   - gpasswd Used to add and delete members and administrators to groups


    +   - groupadd Creates a group with the given name


    +   - groupdel Deletes the group with the given name'
