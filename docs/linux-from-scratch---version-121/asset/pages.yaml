  md: '# Linux From Scratch - Version 12.1


    To remove the "I have no name!" prompt, start a new shell. Since the /etc/passwd
    and /etc/group files have been created, user and group name resolution will now
    work:


    ```

    exec /usr/bin/bash --login

    ```


    The login, aget, and init programs (and others) use a number of log files to record
    information such as who was logged into the system and when. However, these programs
    will not write to the log files if they do not already exist. Initialize the log
    files and give them permissions:


    ```

    touch /var/log/(btmp,lastlog,faillog,wtmp)

    chgrp -v utmp /var/log/lastlog

    chmod -v 664 /var/log/lastlog

    chmod -v 600 /var/log/btmp

    ```


    The /var/log/wtmp file records all logins and logouts. The /var/log/lastlog file
    records when user last logged in. The /var/log/faillog file records failed login
    attempts. The /var/btmp file records the bad login attempts.


    > Note

    nThe /run/utmp file records the users that are currently logged in. This file
    is created dynamically in the boot scripts.


    > Note

    The utmp, wtmp, btmp, and lastlog files use 32-bit integers for timestamps and
    they''ll be fundamentally broken after year 2038. Many packages have stopped using
    them and other packages are going to stop using them. It is probably best to consider
    them deprecated.


    84'
