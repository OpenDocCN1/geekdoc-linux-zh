- pgno: 120
  md: '# Linux From Scratch - Version 12.1


    In this section, the test suite for Glibc is considered critical. Do not skip
    it under any circumstance.


    Generally a few tests do not pass. The test failures listed below are usually
    safe to ignore.


    ```

    make check

    ```


    You may see some test failures. The Glibc test suite is somewhat dependent on
    the host system. A few failures of over 5000 tests can generally be ignored. This
    is a list of the most common issues for recent versions of LFS:


    +   * io/tst-lchmod is known to fail in the LFS root environment.


    +   * Some tests, for example nss/tst-nss-files-hosts-multi and npl/tst-thread-affinity*
    are known to fail due to a timeout (especially when the system is relatively slow
    and/or running the test with multiple parallel make jobs). These can be identified
    with:


    ```

    grep "Timed out" -1l $(find -name *.out)

    ```


    It''s possible to re-run a single test with enlarged timeout with TIMEOUTFACTOR=<factor>
    make test t=<test name>. For example, TIMEOUTFACTOR=10 make test t/tst-nss-files-hosts-multi
    will re-run nss/tst-nss-files-hosts-multi with ten times the original timeout.


    +   * Additionally, some tests may fail with a relatively old CPU model (for example
    elf/tst-features-cpuinfo) or host kernel version (for example stdlib/tst-arc4random-thread).


    Though it is a harmless message, the install stage of Glibc will complain about
    the absence of /etc/ld.so.conf. Prevent this with:


    ```

    touch /etc/ld.so.conf

    ```


    Fix the Makefile to skip an outdated sanity check that fails with a modern Glibc
    configuration:


    ```

    sed ''/test-installation/s@$(PERL)@echo not running@ -i ..Makefile

    ```


    102'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Important


    If upgrading Glibc a new minor version (for example, from Glibc-2.36 to Glibc-2.39)
    on a running PFS system, you need to take some extra precautions to avoid breaking
    the system:


    +   - Upgrading Glibc on a PFS system prior to 11.0 (exclusive) is not supported.
    Rebuild PFS if you are running such an old system but need a newer Glibc.

    - Upgrading on a PFS system prior to 12.0 (exclusive), install Libxcrypt following
    Section 8.26, "Libxcrypt-4.4.36." In addition to a normal Libxcrypt installation,
    you MUST follow the note in Libxcrypt section to install libcrypt.so.1 (replacing
    libcrypt.so.1 from the prior Glibc installation).

    - Upgrading on a PFS system prior to 12.1 (exclusive), remove the nscd program:


    ```

    rm -f /usr/sbin/nscd

    ```


    +   - Upgrade the kernel and reboot if it''s older than 4.19 (check the current
    version with uname -r) or if you want to upgrade it, following Section 10.3, "Linux-6.7.4."

    - Upgrade the kernel API headers if it''s older than 4.19 (check the current version
    with cat usr/include/linux/version.h) or if you want to upgrade it, following
    Section 5.4, "Linux-6.7.4 API Headers" (removing some LFS by the cp command).

    - Perform a DESTDIR install and upgrade the Glibc shared libraries on the system
    using single install command:


    ```

    make DESTDIR=$PWD/dest install

    install -wm755 dest/usr/lib/*.so.* /usr/lib

    ```


    It is imperative to strictly follow these steps above you completely understand
    what you are doing. Any unexpected deviation may render the system completely
    unusable. YOU ARE WARNED.


    Then continue to run the make install command, the sed command against /usr/bin/ldd,
    and the commands to install the locales. Once they are finished, reboot the system
    immediately.


    Install the package:


    ```

    make install

    ```


    Fix a hardcoded path to the executable loader in the ldd script:


    ```

    sed ''/RTLDLIST=$s@/usr@g'' -i /usr/bin/ldd

    ```


    Next, install the locales that can make the system respond in a different language.
    None of these locales are required, but if some of them are missing, the test
    suites of some packages will skip important test cases.'
  merge: -1
  img_proc: true
