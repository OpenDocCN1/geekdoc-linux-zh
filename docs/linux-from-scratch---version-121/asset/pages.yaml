    # 9.6.8. Customizing the Boot and Shutdown Scripts


    The LFS script boots and shuts down a system in a fairly efficient manner, but
    there are few tweaks you can make in the rc.site to improve speed energy, and
    to adjust messages to your preferences. To do this, adjust the settings in /etc/sysconfig/rc.site
    above.


    +   - During the boot script, there is a call to udev that requires some time
    to complete. This may or not be needed depending on the devices in the system.
    If you only have simple partitions and a single ethernet card, the boot process
    will probably not need to wait for this. To skip it, set the variable OMIT_UDEV_SETTLE=.


    +   - The boot script also runs udev by default. This command is only needed if
    the /var directory is separately mounted, because the clock needs /var/lib/hwclock/adjtime.
    Other customizations may be needed to wait for udev complete, but in many installations
    it is not necessary. Skip the command by setting the variable OMIT_UDEV_RETRY=.


    +   - By default, the file system checks are silent. This can be a delay during
    the boot process. To turn on the fck output, set the variable VERBOSE_FSCK=.


    +   - When rebooting, you may want to skip the filesystem, fck, completely. To
    do this, create the file /fastboot or reboot the system with the command /sbin/shutdown
    -f r now. On the other hand, you can force all filesystems to be checked by using
    /forceck or running shutdown with the -F parameter instead of -f.


    Setting the FASTBOOT= will disable fck the boot process until it is removed. This
    is not recommended on a performance basis.


    +   - Normally, all files in the /tmp directory are deleted at boot time. Depending
    on the number of files or directories, this can cause a noticeable delay in the
    boot process. To removing these files set the variable SKIPTMPCLEAN=.


    +   - During shutdown, the init program sends a TERM signal to each program it
    has started (e.g. getty), waits for a set time (3 seconds), then each sends a
    KILL signal and waits. This process is repeated in the signalsd script for processes
    that are not shut by their own scripts. The delay for init can be set by passing
    a parameter. For example to remove the delay in init, pass the -0 parameter when
    shutting down or rebooting (e.g., /sbin/shutdown -t0 r now). The delay for the
    signalsd script can be skipped by setting the parameter KILLDELAY=0.


