- pgno: 287
  md: '# # 10.4. Using GRUB to Set Up the Boot Process


    > > Note

    If your system UEFI support and you need to boot lists with UEFI, you should skip
    the instructions in this page but learn the syntax of `grub.cfg` and the method
    to specify a partition in the file from this page, and configure GRUB with UEFI
    support using the instructions provided in the BLFS page.


    # ## 10.4.1. Introduction


    > > Warning

    Configuring GRUB incorrectly can render your system inoperable without an alternate
    boot device such as a CD-ROM or bootable USB drive. This section is not required
    to boot your LFS system. You may just need to modify your current boot loader,
    e.g Grub-Legacy, GRUB2, or LILO.


    Ensure that you have a disk ready to "rescue" the computer if the computer becomes
    unusable (un-bootable). If you do not already have a boot device, you can create
    one. In order to proceed before you do, you need to jump ahead to BLFS and install
    libosuburn package.


    ```

    cd /tmp

    grub-mkreriso --output=grub-img.iso

    xorriso -as codrecord -v dev=/dev/cdrw blank-as-needed grub-img.iso

    ```


    # ## 10.4.2. GRUB Naming Conventions


    GRUB uses its naming structure for partitions in the form of (hdn), where n is
    the hard drive number and m is the partition number. The hard drive numbers start
    from zero, but the partition numbers start from one for normal partitions (from
    extended partitions). Note that this is different from earlier versions where
    both numbers started from zero. For example, partition `sda` is (hd0,1) to GRUB
    and `sdb` is (hd1,3). In contrast to Linux, GRUB does not consider CD-ROM drives
    to be hard. For example, if you have a CD on a hard drive on `hdb` and a second
    hard drive would be `(hd2)`.


    # ## 10.4.3. Setting Up the Configuration


    GRUB works by writing data to the hard disk. This is not part of any file system.
    The programs access GRUB modules in the boot partition. The default location is
    `/boot/grub/`.


    The location of the boot partition is a choice of the user that affects the configuration.
    One recommendation is to have a separate small (suggested size 200 MB) partition
    for boot information. That way each build, whether LFS or commercial distro, can
    access the same boot files and be made from any booted system. If you choose to
    do this, you must move all files in the current `/boot` directory (e.g the Linux
    kernel you built in the previous section) to the new partition. You will then
    need to mount the partition and remount it at `/boot`. If you do, be sure to update
    `/etc/fstab`.


    Leaving `/boot` on the current LFS partition will also work, but configuration
    for multiple systems is more difficult.


    Using the information above, determine the appropriate designation for the root
    (or boot) partition, if a separate one is used. For the example, it is assumed
    that the root (or separate boot) partition is `sda2`.


    Install the GRUB files into `/boot/grub` and set up the boot track:'
