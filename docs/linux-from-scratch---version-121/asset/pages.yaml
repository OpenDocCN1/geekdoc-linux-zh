  md: "# 8.57. Coreutils-9.4\n\nThe Coreutils package contains the basic utility programs\
    \ needed by every operating system.\n\nApproximate build time: 1.0 SBU\nRequired\
    \ disk space: 175 MB\n\n# 8.57.1. Installation of Coreutils\n\nPOSIX requires\
    \ that programs from Coreutils recognize character boundaries correctly even in\
    \ multibyte locales. The following patch fixes this non-compliance and other internationalization-related\
    \ bugs.\n\n```\npatch -Npl -i ../coreutils-9.4-i18n-1.patch\n```\n\n> Note\nMany\
    \ bugs have been found in this patch. When reporting new bugs to the Coreutils\
    \ maintainers, please check first to see if those bugs are reproducible without\
    \ this patch.\n\nFix a security vulnerability in the split utility:\n\n```\nsed\
    \ -e '/^n_out += n_hold_\\+4 s.*|||&\\' \\\n    -i src/split.c\n```\n\nNow prepare\
    \ Coreutils for compilation:\n\n```\nautoreconf -f\nFORCE_UNSAFE_CONFIGURE=1 ./configure\
    \ \\\\\n    --prefix=/usr \\\n    --enable-no-install-program=kill,uptime\n```\n\
    \nThe meaning of the configure options:\n\nautoreconf\n\nThe patch for internationalization\
    \ has modified the build system, so the configuration files must be regenerated.\n\
    \nFORCE_UNSAFE_CONFIGURE=1\n\nThis environment variable allows the package to\
    \ be built by the root user.\n\n--enable-no-install-program=kill,uptime\n\nThe\
    \ purpose of this is to prevent Coreutils from installing programs that will be\
    \ installed by other packages.\n\nCompile the package:\n\n```\nmake\n```\n\nSkip\
    \ down to \"Install the package\" if not running the test suite.\n\nNow the test\
    \ suite is ready to be run. First, run the tests that are meant to be run as user\
    \ root:\n\n```\nmake NON_ROOT_USERNAME=tester check-root\n```\n\nWe're going to\
    \ run the remainder of the tests as the tester user. Certain tests require the\
    \ user to be a member of more than one group. If those tests are not skipped,\
    \ add a temporary group and make the user tester part of it:\n\n```\ngroupadd\
    \ -g 102 dummy -U tester\n```\n\nFix some of the permissions so that the-root\
    \ user can compile and run the tests:\n\n```\nchown -R tester .\n```"
  merge: -1
  img_proc: true
