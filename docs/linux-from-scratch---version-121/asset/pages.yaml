    \ breaks. This kind of issue is generally a result from reusing some script created\
    \ for a prior LFS release. Such reuse is strongly discouraged. If you are reusing\
    \ scripts for a prior LFS release for any reason, you need to be very careful\
    \ to update the scripts to match current version of the LFS book.\n\nHere are\
    \ some things you should know about building each package:\n\n+   - Several packages\
