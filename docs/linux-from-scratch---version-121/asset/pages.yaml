    +   - We''ll C.UTF-8 as the locale for interactive sessions in the Linux console
    in Section 9.7, "Configuring the System Locale," so we should set UNICODE to 1.
    And the console fonts shipped by the Kbd package containing the glyphs for all
    characters in the C-UTF-8 locale are LatArCyrHeb*.psfu.gz, LatGrkCyr*.psfu.gz,
    Lat2-Terminus16.psfu.gz, and pancyrill.f16.psfu.gz in /usr/share/consolefonts
    (the other shipped fonts contain some of characters from them, for example Lat2-Terminus16.psfu.gz
    as the default console:


