    cat /etc/hosts << "EOF"

    # Begin /etc/hosts


    127.0.0.1 <FQDN> <HOSTNAME> [alias1] [alias2] ...

    ::1         localhost ip6-localdomain ip6-loopback

    ff02::      ip6-nodes

    ff02::2      ip6-routers


    # End /etc/hosts

    EOF

    ```


    The <192.168.1.1>, <FQDN>, and <HOSTNAME> values need to be changed for specific
