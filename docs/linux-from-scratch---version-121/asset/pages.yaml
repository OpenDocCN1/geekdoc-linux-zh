- pgno: 258
  md: '# 9.3. Overview of Device and Module Handling


    In Chapter 8, we installed the udev daemon when udev was built. Before we go into
    the details regarding udev works, a brief history of previous methods of handling
    devices is in order.


    Linux systems in general traditionally used a static device creation method, whereby
    greatly many device nodes were created under /dev (literally thousands of them),
    regardless of whether the corresponding hardware devices actually existed. This
    was typically done via a MAKDEV script, which contained a number of calls to the
    mknod program with the relevant major and minor device numbers for every possible
    device that might exist in the world.


    Using the udev method, device nodes are only created for devices that are detected
    by the kernel. These device nodes are created each time the system boots; they
    are stored in a devtmpfs (a virtual file system that resides entirely in memory).
    Device nodes do not require much space, so the memory that is used is negligible.


    # 9.3.1. History


    In February 2000, a new filesystem devfs was merged into the 2.3.46 kernel and
    was made available during the 2.4 series of stable kernels. Although it was present
    in the kernel source, this method of creating devices never received overwhelming
    support from the core kernel developers.


    The main problem with the approach adopted by devfs was the lacked device detection,
    creation, and naming. The latter issue, was generally accepted that if device
    names are critical, the device naming policy should be chosen by system administrators,
    and not imposed by the developer(s). The devfs filesystem also suffered from race
    conditions that were inherent in its design; these could be fixed without a substantial
    revision of the kernel. devfs was marked as deprecated for a long time, and was
    finally removed from the kernel in June, 2006.


    With the development of the stable 2.5 kernel, later as the 2.6 series of stable
    kernels, a new virtual filesystem sysfs came to be. The job of sysfs is to provide
    information about the system''s hardware configuration to userspace processes.
    With this userspace-visible representation, it became possible to develop a userspace
    replacement for devfs.


    # 9.3.2. Udev Implementation


    # 9.3.2.1. Sysfs


    The sysfs filesystem was mentioned briefly. One might wonder how sysfs knows about
    the devices present on a system and what device numbers should be used for them.
    Drivers that have been compiled into the kernel register their objects in sysfs
    (devtmpfs internally) as they are detected by the kernel. For drivers compiled
    as modules, registration happens when the module is loaded. Once the sysfs filesystem
    is mounted on (/sys), data which the drivers have registered with sysfs are available
    to userspace processes and to udev for processing (including modifications to
    device nodes).


    # 9.3.2.2. Device Node Creation


    Device files are created in the devtmpfs file system. Any driver that wishes to
    register a device node udev (via the kernel core) to do so. When a devtmpfs instance
    is mounted on /dev, the device node will be initially exposed to userspace with
    a fixed name, permissions, and owner.


    A short time, the kernel will send an event to udev. Based on the rules specified
    in the files within the /etc/udev.rules, /usr/lib/udev/rules.d, and /run/udev/rules.d
    directories, udev will create additional symlinks to the device node, or change
    its permissions, owner, group, or modify the internal udev database entry (name)
    for that.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'The rules in these three directories are numbered and all three directories
    are merged together. If udev cannot a rule for the device is creating, it will
    leave the permissions and ownership at whatever devtmpfs used initially.


    #  9.3.2. Module Loading


    Drivers compiled as modules may have aliases in them. Aliases are visible in the
    output of the modinfo bus-specific identifiers of devices supported by a module.
    For example, the snd-f801 exports with vendor ID 0x1319 and device ID 0x0801,
    and has an alias of eci:p00001319:d0000801:svad*bc04c01i*. For most devices, the
    bus driver exports the alias of the driver that will handle the device via sysfs.
    /sys/bus/pci/devices/0000:00:0d.0/modalias file may contain the eci:p00001319:d0000801e00001319svad*bc04c01i.
    The default rules provided with udev use udev to call out to /sbin/modprobe the
    contents of the MODIAS environment variable (which could be the same as the contents
    of the MODIAS in sysfs), thus loading all modules that have this string match
    wildcard expansion.


    In this example, that, in addition to snd-f801, the obsolete (and unwanted) forte
    driver will be loaded if it is available. See below for ways in which the loading
    of unwanted drivers can be prevented.


    The kernel itself is able to load modules for network protocols, filesystems,
    and NLS support on demand.


    #  9.3.2.4. Handling Hotpluggable/Dynamic Devices


    When you plug in a device, such as a Universal Serial Bus (USB) MP3 player, the
    kernel recognizes that the device is now connected and generates a uvent. This
    uvent is then handled by udev as described above.


    #  9.3.3. Problems with Loading Modules and Creating Devices


    There are a few possible problems when it comes to automatically creating device
    nodes.


    #  9.3.3.1. A Kernel Module Is Not Loaded Automatically


    Udev will only load a module if it has a bus-specific alias and the bus driver
    properly exports the necessary aliases to load sysfs. In other cases, one should
    arrange module loading by other methods. With Linux-6.7.4, udev is known to load
    properly-written drivers for INPUT, IDE, PCI, SCSI, SERIO, and Fire devices.


    To determine if your device requires the necessary support for it, run modinfo
    with the module name as the argument. Now locating the device directory under
    /sys/bus and check whether there is a modalias file.


    If the modalias file exists in sysfs, the bus driver supports it and can talk
    to it, but if it doesn''t have the alias, it is a bug in the driver. Load the
    driver without the help of udev and expect it to be fixed.


    If there is no modalias file in the relevant directory under /sys/bus, this means
    that the kernel developers have not added modalias support to this bus type. With
    Linux-6.7.4, this is the case with ISA buses. This issue to be fixed in later
    kernels.


    Udev is not intended to load "wrapper" drivers such as snd-pcm-pcm and non-hardware
    drivers which go loop at.


    #  9.3.3.2. A Kernel Module Is Not Loaded Automatically, and Udev Is Not Intended
    to Load It


    If the "wrapper" only enhances the functionality provided by some other module
    (e.g., snd-pcm-pcm enhances the functionality by making the sound cards available
    to OSS applications), configure modprobe to load the wrapper after ude loads the
    module. To do this, add a "softdep" line to the corresponding /etc/modprobe.d/<filename>.conf.
    example:


    ```

    softdep snd-pcm-pcm: snd-pcm-pcm

    ```'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# Linux From Scratch - Version 12.1


    Note that the "softdev" command also allows pre: dependencies, a mixture of pre
    and post: dependencies. See the modprobe.dt(5) manual page for more information
    on "softdev" syntax and capabilities.


    If the module in question is not a wrapper and is useful by itself, configure
    the modules bootscript to load this module on system boot. To do this, add the
    module name to the /etc/sys/modules file on a separate line. This works for wrapper
    modules too, but is suboptimal in that case.


    #  9.3.3. Udev Loads Unwanted Module


    Either don''t build the module, or blacklist it in a /etc/modprobe.d/blacklist.conf
    file as done with the forte module in the example below:


    ```

    blacklist forte

    ```


    Blacklisted modules can still be loaded manually with the explicit modprobe command.


    #  9.3.4. Udev Creates a Device Incorrectly, or Makes the Wrong Symlink


    This usually happens if udev unexpectedly matches a device. For example, a poorly-written
    rule can match both a SCSI device (as desired) and the corresponding SCSI device
    (incorrectly) by vendor. Finding the offending rule and making it more specific,
    with the help of udevadm info.


    This may be another manifestation of the previous problem. If not, and your rule
    uses sysfs attributes, it may be kernel timing issue, to be fixed in later chapters.
    Now, you can avoid it by creating a rule that waits for the sysfs attribute and
    appending it to the /etc/udev/rules.d/10-wait_for_sysfs.rules file (create this
    file if it does not exist). Please notify the LFS Development list if you do and
    it helps.


    #  9.3.6. Udev Does Not Create a Device


    First, be the driver is built into the kernel or already loaded as a module, and
    udev isn''t creating a misdevice.


    If a kernel driver does not export data to sysfs, udev lacks the information needed
    to create a device node. This is most likely to happen with third party drivers
    from the kernel tree. Create a static device node in /usr/lib/udev with the appropriate
    major/minor numbers (see the devices.txt inside the kernel documentation or the
    documentation provided by the third party driver). The static device node will
    be copied to /dev by udev.


    #  9.3.7. Udev Naming Order Changes Randomly After Rebooting


    This is due to the fact that udev, by design, handles events and loads modules
    in parallel, and this results in an unpredictable order. One will not be "fixed".
    You should not rely upon the kernel device names being stable. Instead, create
    your own rules with stable names based on some attribute of the device, such as
    a serial number or the output of various *_id_utils installed by udev. See Section
    9.4, "Managing Devices" and Section 9.5,"General Configuration" for examples.


    #  9.3.4. Useful Reading


    Additional help is available at the following sites:


    +   * A Userspace Implementation of devfs http://www.chroah.com/linux/talks/ols_2003_udev_paper/Reprint-
    Kroah-Hartman-OLS2003.pdf


    242'
  merge: -1
