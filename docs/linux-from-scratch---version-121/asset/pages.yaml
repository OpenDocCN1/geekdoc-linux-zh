  md: "# 8.79. E2fsprogs-1.47.0\n\nThe E2fsprogs package contains the utilities for\
    \ handling the ext2 file system. It also supports the ext3 and ext4 journaling\
    \ file systems.\n\n**Approximate build time:** 2.4 SBU on a spinning disk, 0.4\
    \ SBU on an SSD\n**Required disk space:** 95 MB\n\n# 8.79.1. Installation of E2fsprogs\n\
    \nThe E2fsprogs documentation recommends the package be built in a subdirectory\
    \ of the source tree:\n\n```\nmkdir -v build\ncd build\n```\n\nPrepare E2fsprogs\
    \ for compilation:\n\n```\n./configure --prefix=/usr\n  --sysconfdir=/etc\n  --enable-elf-shlibs\n\
    \  --disable-libblkid\n  --disable-libuuid\n  --disable-uuid\n  --disable-fck\n\
    ```\n\nThe meaning of the configure options:\n\n```\n--enable-elf-shlibs\n```\n\
    \nThis creates the shared libraries which some programs in this package use.\n\
    \n```\n--disable-*\n```\n\nThese prevent building and installing the **libuuid**\
    \ and **libblkid** libraries, the **uuid** daemon, the **fck** wrapper, util-linux\
    \ installs most recent versions.\n\nCompile the package:\n\n```\nmake\n```\n\n\
    To run the tests, issue:\n\n```\nmake check\n```\n\nOne test named m_assume_storage_prezeroed\
    \ is known to fail.\n\nInstall the package:\n\n```\nmake install\n```\n\nRemove\
    \ useless static libraries:\n\n```\nrm -fv /usr/lib/libcom_,lib2p,libext2fs,libss.a\n\
    ```\n\nThis package installs a .info file but does not update the system-wide\
    \ **dir** file. Unzip this and update the system **dir** file using the following\
    \ commands:\n\n```\ngunzip -v /usr/share/info/libext2fs.gz\ninstall-info --dir-file=/usr/share/info\
    \ /usr/share/info/libext2fs.info\n```\n\nIf desired, create and install some additional\
    \ documentation by issuing the following commands:\n\n```\nmakeinfo -o doc/com_err.texinfo\
    \ /lib/etc/com_err.texinfo\ninstall -v -m644 doc /usr/share/info /usr/share/info/com_err.info\n\
    install-info --dir-file=/usr/share/info/dir /usr/share/info/com_err.info\n```"
