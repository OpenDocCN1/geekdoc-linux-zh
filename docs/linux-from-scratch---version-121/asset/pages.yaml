  md: '# Chapter 10. Making the LFS System Bootable


    # 10.1. Introduction


    It is time to make LFS system bootable. This chapter discusses creating the /etc/fstab
    file, building a kernel for the new LFS system, and installing the GRUB boot loader
    so that the LFS system can be selected for booting at startup.


    # 10.2. Creating the /etc/fstab File


    The /etc/fstab file is used by some programs to determine which file systems are
    to be mounted by default, in which case, must be checked (for integrity errors)
    prior to mounting. Create a new file system table like this:


    ```

    cat > /etc/fstab <<EOF

    # Begin /etc/fstab

    # file system mount-point type options dump fsck order

    /dev/<xxx> / <ffs> defaults 1 1

    /dev/<yyy> swap swap pri=1 0 0

    proc /proc proc nouid,noexec,nodeovec 0 0

    sysfs /sys sysfs nouid,noexec,nodeovec 0 0

    devpts /dev/pts devpts gid=5,mode=620 0 0

    tmpfs /run tmpfs mode=0755,nodeuid 0 0

    devtmpfs /dev devtmpfs defaults 0 0

    tmpfs /dev/sh tmpfs nouid,nodev 0 0

    croup2 /sys/fs/cgroup cgroup2 nouid,noexec,nodeovec 0 0

    # End /etc/fstab

    EOF

    ```


    Replace <xxx>, <yyy>, and <ffs> with the values appropriate for your system, sda2,
    sda5, and ext4. For details on the fields in this file, see f.


    Filesystems with MS-DOS or Windows origin (i.e. vfat, ntfs, smbfs, cifs, iso9660)
    need a special option, utf8, for order non-ASCII characters in file names to be
    interpreted properly. For non-UTF8 locales, the value of iocharset should be the
    same as the character set of the locale, adjusted in such that a kernel understands
    it. If the relevant character set is defined (under Files -- Native Language Support
    when the kernel) has been compiled into the kernel or built as module. However,
    if the character set of the locale is UTF-8, the corresponding option iocharset=utf8
    would make the file system case sensitive. To fix this, use the option iocharset=utf8
    for UTF-8 locales. The "codepage" option is also needed for vfat and smbfs filesystems.
    In example, to mount USB drives, a _RU.KOI8-R user would need the following options
    in their mount line in /etc/fstab:


    ```

    noata,user, quiet, showexec, codepage=866,iocharset=koi8

    ```


    The corresponding options for ru_RU.UTF-8 users are:


    ```

    noata,user, quiet, showexec, codepage=866,utf8

    ```


    Note that iocharset is the default for iso8859-1 (which keeps the file system
    case insensitive), and the utf8 option tells the kernel to use the file names
    so they can be interpreted in the UTF-8 locale.'
  merge: -1
  img_proc: true
- pgno: 280
  md: '# Linux From Scratch - Version 12.1


    It is also possible to specify default codpage iocharset values for some filesystems
    during kernel configuration. The relevant parameters are named "Default NLS Option"
    (CONFIG_NLS_DEFAULT), "Default Remote NLS Option" (CONFIG_SMB_NLS_DEFAULT), "Default
    codpage for FAT" (CONFIG_FAT_DEFAULT_CODEPAGE), and "Default charset for FAT"
    (CONFIG_FAT_DEFAULT_IOCHARSET). There is no way to specify these settings for
    the ntfs filesystem at kernel compilation time.


    It is possible to make the ext3 filesystem reliable across power failures for
    some hard disk types. To do this, add the barrier=1 mount option to the appropriate
    entry in /etc/fstab. To check if the disk drive supports this option, run hdparm
    on the applicable disk drive. For example, if:


    ```

    hdparm -I /dev/sda | grep NCQ

    ```


    returns non-empty output, the option is supported.


    Note: Logical Volume Management (LVM) based partitions cannot use the barrier
    option.'
  merge: -1
