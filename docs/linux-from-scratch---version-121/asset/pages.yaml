- pgno: 269
  md: '# Linux From Scratch - Version 12.1


    the setclock program runs via udev when kernel detects the hardware capability
    upon boot. It can be run manually with the stop parameter to store the system
    time to the CMOS clock.


    If you cannot remember whether or not the hardware clock is set to UTC, find out
    using the hwclock --localtime show command. This will display the current time
    as the hardware clock. If this time matches your watch, then the hardware clock
    is set to local. If the output from hwclock is not local time, chances are it
    set to UTC time. Verify this by adding or subtracting number of hours for your
    time to the zone by hwclock. For example, if you are in the MST time zone, which
    is known as GMT-0700, add seven hours to the local time.


    Change the value of the UTC variable to a value of 0 (zero) if the hardware clock
    is NOT set to UTC time. Create a new /etc/sysconfig/clock by running the following:


    ```

    cat /etc/sysconfig/clock << "EOF"

    # Begin /etc/sysconfig/clock

    UTC=1


    # Set this to any options you might need to give to hwclock,

    # such as hardware clock type for Alphas.

    CLOCKPARAMS=


    # End /etc/sysconfig/clock

    EOF

    ```


    A good hint explaining how to deal with LFS is available at https://www.linuxscratch.org/hints/downloads/file.txt.
    It explains issues such as time zones, UTC, and the tz environment variable.


    > Note The CLOCKPARAMS may also be set in the /etc/sysconfig/rc.site file.


