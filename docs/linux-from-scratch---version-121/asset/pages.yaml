- pgno: 100
  md: 'The required set of subdirectories below the root-level by issuing the following
    commands:


    ```

    mkdir -pv /etc/{opt,sysconfig}

    mdir -pv /lib/firmware

    mkdir -pv /media/{floppy,cdrom}

    mkdir -pv /usr/{local,}/include,src

    mkdir -pv /usr/{local,}/bin,lib,sbin

    mkdir -pv /usr/{local,}/share/{color,dict,doc,info,locale,man}

    mdir -pv /usr/{local,}/share/share/{misc,info,zoneinfo}

    mdir -pv /usr/{local,}/share/man/{1..}

    mdir -pv /var/{cache,local,log,mail,opt,spool}

    mdir -pv /var/lib/{color,misc,locate}

    ```


    ```

    ln -sf /var/run /var/run

    ln -sf /var/lock /var/lock

    ```


    ```

    install -dv -m 0750 /root

    install -dv -m 1777 /tmp /var/tmp

    ```


    Directories are, by default, created with permission 755, but this is not desirable
    everywhere. In the commands above, two cases are made—one to the home directory
    of user root, and another to the directories for temporary files.


    The first mode ensures that not anybody can enter the /root directory—just like
    a normal user would with his own home directory. The second mode ensures that
    any user can use the /tmp and /var/ directories, cannot remove another user''s
    files from them. The latter is prohibited by the so-called "sticky bit," which
    has the bit (1) in the 1777 mask.


    # # 7.5.1 FHS Compliance Name


    This directory tree is based on the Filesystem Hierarchy Standard (FHS) (at addresses
    https://refspecs.linux.org/fhs.html). The FHS also permits the optional extension
    of directories such as /usr/local/games and /usr/share/games. In LFS, we create
    only the directories that are really necessary. However, feel free to create more
    directories, if you wish.


    > Warning does not mandate the existence of the directory /usr/lib64, and the
    LFS editors have decided not to use it. For the instructions in LFS and BLFS to
    be correct, this directory be nonexistent. From time to time you should verify
    that it does not exist, because it is easy to create it inadvertently, and this
    will probably break your system.


    # # 7.6 Creating Essential Files and Symlinks


    Historically, Linux maintained a list of the mounted file systems in the /etc/mtab.
    Modern kernels maintain this internally and expose it to you via the /proc filesystem.
    To satisfy utilities that expect to find /etc/mtab, create a symbolic link


    ```

    ln -sf /proc/self/mounts /etc/mtab

    ```


    Create a basic /etc/hosts file to be referenced in some tests, and one in Perl''s
    configuration files as well:


    ```

    cat > /etc/hosts << EOF

    127.0.0.1 localhost $(hostname)

    :1 localhost

    EOF

    ```


    In order for root to be able to login and for the name "root" to be recognized,
    there must be relevant entries in the /etc/passwd and /etc/group files.'
