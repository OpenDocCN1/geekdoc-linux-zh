- pgno: 55
  md: '# 4.5 About SBUs


    Many people would like to know approximately how long it takes to compile and
    install each package. Because Linux From Scratch can be built on many different
    systems, it is impossible to provide estimate times. The biggest package (gcc)
    will take approximately 5 minutes on the fastest systems, but could take days
    on slower systems! Instead of providing actual times, the Standard Build Unit
    (SBU) will be used.


    The SBU works as follows. The first package to be compiled is binutils in Chapter
    5. The time it takes to compile one core is what we will refer to as the Standard
    Build Unit or SBU. All other compile times will be expressed in terms of this
    unit.


    For example, consider a package whose compilation time is 4.5 SBUs. This means
    that if your system takes 10 minutes to compile and install the first package
    of binutils, it will take approximately 45 minutes to build the example package.
    Fortunately, most build times are shorter than one SBU.


    SBUs are not entirely accurate because they depend on many factors, including
    the host system''s version of GCC. We are provided here to give an estimate of
    how long it might take to install a package, but the numbers can vary by as much
    as dozens of minutes in some cases.


    > Note


    When multiple processors are used in this way, the SBU units in the build will
    vary more than they normally would. In some cases, the make step will simply fail.
    Analyzing the output of the build will also be more difficult because the lines
    from different processes will be interleaved. If you run into a problem with a
    build step, revert to a single processor to properly analyze the error messages.

    The presented are based upon four cores (-j). The times in Chapter 8 also include
    the time to run the regression tests for the package unless specified otherwise.


    # 4.6 About the Test Suites


    Most packages provide a test suite. Running the test suite for a newly built package
    is a good idea because it can provide a "sanity check" indicating that everything
    compiled correctly. A test suite that passes its checks usually proves that the
    package is functioning as the developer intended. It does not, however, guarantee
    that the package is totally bug free.


    Some tests are more important than others. For example, the test suites for the
    core toolchain packages—GCC, binutils, and glibc—are of the utmost importance
    due to their central role in a properly functioning system. The test for GCC and
    glibc can take a very long time to complete, especially on slower hardware, but
    are strongly recommended.


    > Note


    Running the test suites in Chapter 5 and Chapter 6 is pointless; since the test
    programs are compiled with a cross-compiler, they probably can''t run on the build
    host.


    A common issue with running the test suites for binutils and GCC is running out
    of pseudo terminals (PTYs). This can result in a number of failing tests. This
    may happen for several reasons, the most likely cause is that the host system
    does not have devpts file set up. This issue is discussed in greater detail at
    https://www.linuxfromscratch.org/lfs/faq.html#no-ptys.'
  merge: -1
  img_proc: true
