    # ## 1.4. Resources


    # ### 1.4.1. FAQ


    If building the LFS system you encounter any errors, have any questions, or think
    there is a typo in the book, please start by consulting the list of Frequently
    Asked Questions (FAQ), located at https://www.linuxfromscratch.org/faq/faq.


    # ### 1.4.2. Mailing Lists


    The linuxfromscratch.org server hosts a number of mailing lists used for the development
    of the LFS project. These lists include the main development and support lists,
    others. If you cannot find an answer to your problem on the FAQ page, the next
    step will to search the mailing lists at https://www.linuxfromscratch.org/search.html.


    For information on the different lists, how to subscribe, archive locations, and
    additional information, visit https://www.linuxfromscratch.org/mail.html.


    # ### 1.4.3. IRC


    Several of the LFS community offer assistance via Internet Relay Chat (IRC). Before
    using this support, please make sure your question is not already answered in
    the LFS FAQ or the mailing list archives. You can find the IRC network at irc.libera.chat.
    The support channel is named #ifs-support.


    # ### 1.4.4. Mirror Sites


    The LFS project has a number of world-wide mirrors to make accessing the website
    and downloading the required packages more convenient. Please visit the LFS website
    at https://www.linuxfromscratch.org/mirrors.html for a list of current mirrors.


    # ### 1.4.5. Contact Information


    Please direct all your questions and comments to one of the LFS mailing lists
    (see above).'
