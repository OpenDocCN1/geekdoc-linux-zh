- pgno: 36
  md: '# Note


    The Grub BIOS partition must be on the drive that the BIOS uses to boot the system.
    This is not necessarily the drive that holds the LFS root partition. The disks
    on a system may use different partition table types. The necessity of the Grub
    BIOS partition depends only on the partition table of the boot disk.


    # 2.4.1.4. Convenience Partitions


    There are several other partitions that are not required, but should be considered
    when designing a disk layout. The list below is not comprehensive, but meant as
    a guide.


    +   - boot – Highly recommended. Use this partition to store kernels and other
    booting information. To minimize potential boot problems with larger disks, make
    this the first physical partition on your first disk drive. A partition size of
    200 megabytes is adequate.

    - efi – The EFI System Partition, which is needed for booting the system with
    UEFI. Read the BLFS page for details.

    - home – Highly recommended. Share your home directory and user customization
    across multiple distributions or rely on available disk space.

    - usr – In LFS, /bin, /lib, and /sbin are symlinks to their counterparts in /usr.
    So /usr contains all the binaries needed for the system. For LFS a separate partition
    for /usr is normally normal. If you create it, you should make a partition large
    enough to fit all the programs and libraries in the system. The root partition
    can be very small (maybe just one gigabyte in configuration) so it''s suitable
    for a thin client or workstation (from a remote server). However, you should be
    aware that an initramfs (not covered by LFS) will be needed to boot a system with
    a separate partition.

    - opt – This directory is most useful for BLFS, where large packages like KDE
    or Texile can be installed without embedding the files in the /usr hierarchy.
    If used, 5 to 10 gigabytes is generally adequate.

    - tmp – A separate tmp partition is rare, but useful if configuring a thin client.
    This partition, if used, will not need to exceed a couple of gigabytes. If you
    have enough RAM, you can mount a tmpfs on /tmp to make access to temporary files
    faster.

    - usr/src – This partition is very useful for providing a location to store LFS
    source builds. It can also be used for building BLFS packages. A reasonably large
    partition of 30-50 gigabytes provides plenty of room.


    Any partition that you want automatically when the system starts must be specified
    in the /etc/fstab file. Details about how to specify partitions will be discussed
    in Section 10.2, "Creating the /etc/fstab file."


    # 2.5. Creating a File System on the Partition


    A partition is just a region of space on a disk, defined by boundaries in a partition
    table. Before operating the system can use it to store any files, the partition
    must be formatted to contain a file system, typically consisting of a label, directory
    blocks, data blocks, and an indexing scheme to locate a particular file on demand.
    The file system helps the OS keep track of free space on the partition, reserve
    the unused sectors when a new file is created or an existing file is extended,
    and recycle the free data segments created when files are deleted. It may also
    provide support for data redundancy, and for error recovery.


    LFS can use any file system recognized by the Linux kernel, but the most common
    types are ext3 and ext4. The choice of the right file system can be complex depending
    on the characteristics of the file and the size of the partition. For example:'
  merge: -1
