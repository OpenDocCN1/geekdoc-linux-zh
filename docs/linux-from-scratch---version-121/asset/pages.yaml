- pgno: 230
  md: "#  8.72. Configuring Vim\n\nBy default, vim runs in vi-compatible mode. This\
    \ may be new to users who have used other editors in the past. The “ncompatible”\
    \ setting is included below to highlight the fact that a new behavior is being\
    \ used. It also reminds those who would change to “compatible” mode that it should\
    \ be the first setting in the configuration file. This is necessary because it\
    \ changes other settings, and overrides must come after this setting. Create a\
    \ default vim configuration file by running the following:\n\n```\ncat > /etc/vimrc\
    \ <<\"EOF\"\n  Begin /etc/vimrc\n\n  Ensure defaults are set before customizing\
    \ settings, not after\n  source VIMRUNTIME/defaults.vim\n  let skip_defaults_vim=1\n\
    \n  set notcompatible\n  set backspace=2\n  syntax on\n  if ($term == \"xterm\"\
    ) || ($term == \"putty\")\n    set background=dark\n  endif\n\nEOFEOF\n```\n\n\
    The notcompatible setting makes vim behave in a more useful way (the default)\
    \ than the vi-compatible manager. Remove the “no” to keep the old behavior. The\
    \ backspace=2 setting allows backing over line breaks, autindents, and the start\
    \ of an indent. The syntax on enables vim’s syntax highlighting. The set mouse\
    \ enables proper pasting of text when the mouse is moving through or over a remote\
    \ connection. Finally, the statement with the set background=dark setting corrects\
    \ vim’s guess about the background color of some terminal emulators. This gives\
    \ highlighting a better color scheme for use on the black background of these\
    \ programs.\n\nDocumentation for other options can be obtained by running the\
    \ following command:\n\n```\nvim -c ':options’\n```\n\n> Note\n\nBy default, vim\
    \ only installs spell-checking files for the English language. To install spell-checking\
    \ files for your preferred language, copy the .spl and optionally, the .sug files\
    \ for your language and character encoding from runtime/spell into /usr/share/vim/vim91/spell.\n\
    \nTo use this spellchecking, configuration in /etc/vimrc is needed, e.g:\n\nset\
    \ spelllang=en,ru\n  set spell\n\nFor more information, see runtime/spell/README.txt.\n\
    \n#  8.72.3. Contents of Vim\n\n+   - Installed programs: ex (link to vim), rview\
    \ (link to vim), rvim (link to vim), vi (link to vim), view (link to vim), vim,\
    \ vimdiff (link to vim), vimtutor, and xxd\n- Installed directory: /usr/share/vim"
  merge: -1
  img_proc: true
- pgno: 231
  md: 'Linux From Scratch - Version 12.1


    # Short Descriptions


    +   - **ex** Starts **vim** in ex mode


    +   - **rview** Is a restricted version of **view**; no shell commands can be
    started and **view** cannot be suspended


    +   - **rvim** Is a restricted version of **vim**; no shell commands can be started
