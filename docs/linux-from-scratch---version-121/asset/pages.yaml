- pgno: 37
  md: 'ext2

    is suitable for small partitions that are updated infrequently such as /boot.


    ext3

    is an upgrade to ext2 that includes a journal to help recover the partition''s
    status in the case of an unclean shutdown.

    it is commonly used as a general purpose file system.


    ext4

    is the latest version of the ext family of file systems. It provides several new
    capabilities including nano-second

    timestamps, creation of very large files (up to 16 TB), and speed improvements.


    Other file systems, including FAT32, NTFS, ReiserFS, JFS, and XFS are utilized
    for specialized purposes. More information about these file systems, and many
    others, can be found at https://en.wikipedia.org/wiki/Comparison_of_

    file_systems.


    LFS assumes that the root system (/) is of type ext4. To create an ext4 file system
    on the LFS partition, issue the

    following command:


    ```

    mkfs -v -t ext4 /dev/xxxx

    ```


    Replace <xxxx> with the name of the LFS partition.


    If you are using a swap partition, there is no need to format it. If a new swap
    partition was created, it will

    need to be initialized with this command:


    ```

    mkswap /dev/<yyyy>

    ```


    Replace <yyyy> with the name of the swap partition.


    # 2.6. Setting The $LFS Variable


    Throughout this book, the environment variable LFS will be used several times.
    You should ensure that this variable

    is always defined throughout the LFS build process. It should be set to the name
    of the directory where you will

    building your TFS system - we will use /mnt/lfs as an example, but you may choose
    any directory name you want. If

    are you building LFS on a separate partition, this directory will be the mount
    point for your partition. Choose a directory

    location and set the variable with the following command:


    ```

    export LFS=/mnt/lfs

    ```


    Having this variable is beneficial in that commands such as mkdir -v $LFS/tools
    can be typed literally. The shell

    will automatically replace "$LFS" with /mnt/lfs (or whatever value the variable
    was set to) when it processes the

    command line.


    > Caution

    Do not forget to check that LFS is set whenever you leave and restart the current
    working environment (such

    as doing a su to root or another user). Check that the LFS variable is set properly
    with:

    echo $LFS


    Make sure the output shows the path to your LFS system''s build location, which
    is /mnt/lfs if the provided

    example was followed. If the output is incorrect, use the command given earlier
    on this page to set $LFS to

    the correct directory name.'
