  md: "# 8.72. Vim-9.1.0041\n\nThe Vim package contains a powerful text editor.\n\n\
    Approximate build time: 2.5 SBU\nRequired disk space: 236 MB\n\n> Alternatives\
    \ to Vim\nIf you prefer another editor—such as Emacs, Joe, or Nano—please refer\
    \ to https://www.linuxfromscratch.org/blfs/vim/12.1/postfs/editors.html for suggested\
    \ installation instructions.\n\n# 8.72.1. Installation of Vim\n\nFirst, change\
    \ the default location of the vimrc configuration file to /etc:\n\n```\necho #define\
    \ SYS_VIMRC_FILE \"/etc/vimrc\" >> src/feature.h\n```\n\nPrepare Vim for compilation:\n\
    \n```\n./configure --prefix=/usr\n```\n\nCompile the package:\n\n```\nmake\n```\n\
    \nTo prepare the tests, ensure that user tester can write to the source tree:\n\
    \n```\nchown -R tester\n```\n\nNow run the tests as user tester:\n\n```\nsu tester\
    \ -c \"TERM=xterm-256color LANG=en_US.UTF-8 make -j1 test\"\n&& vim.log\n```\n\
    \nThe test suite outputs to a binary file of data. This can cause issues with\
    \ the settings of the current terminal (especially when we are overriding the\
    \ TERM variable to satisfy some assumptions of the test suite). By redirecting\
    \ the output to a log file as shown above. A successful test will result in the\
    \ words DONE in the log file at completion.\n\nInstall the package:\n\n```\nmake\
    \ install\n```\n\nMany users reflexively use vi instead of vim. To allow execution\
    \ of vim when users habitually enter vi, create a symlink for the binary and the\
    \ man page in the provided languages:\n\n```\nln -sv /usr/bin/vim vi\nfor L in\
    \ /usr/share/man/*/vim.1; do\n  ln -sv vim.1 $(L) /vi.1\ndone\n```\n\nBy default,\
    \ Vim documentation is installed in /usr/share/doc/vim-9.1.0041. The following\
    \ symlink allows the documentation to be accessed via /usr/share/doc/vim-9.1.0041,\
    \ making it consistent with the location of documentation for other packages:\n\
    \nIf an Windows System is installed on the LFS system, it may be necessary to\
    \ recompile Vim after installing X. Vim has a GUI version of the editor that requires\
    \ X and some additional libraries to be installed. For more information on this\
    \ process, refer to the Vim documentation and the Vim installation page in the\
    \ BLFS book at https://www.linuxfromscratch.org/blfs/vim/12.1/postfs/vim.html."
  merge: -1
