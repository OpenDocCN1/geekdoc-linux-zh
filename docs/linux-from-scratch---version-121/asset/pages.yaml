- pgno: 275
  md: 'The output of the programs being translated into your native language


    The correct classification of characters into letters, digits and other classes.
    This is necessary for bash to properly accept non-ASCII characters in command
    lines in non-English locales


    The correct alphabetical order for the country


    The appropriate default paper size


    The correct formatting of monetary, time, and date values


    Replace \<id> with the two-letter code for your desired language (e.g., en) and
    <CC> with the two-letter code for the country (e.g., GB). <charmap> should be
    replaced with the canonical charmap for your chosen locale. Optional modifiers
    such as @euro may also be present.


    The list of all locales supported by libc can be obtained by running the following
    command:


    ```

    locale -a

    ```


    Charmaps can have a number of aliases, e.g., ISO-8859-1 is also referred to as
    iso8859-1 and iso88591. Applications cannot handle the various synonyms correctly
    (e.g., that UTF-8 is not utf8), but it is the safest in most cases to choose the
    canonical name for a particular locale. To determine the locale, run the following
    command where <locale name> is the output given by locale -a for your preferred
    locale (en_GB.iso8859 in our example).


    ```

    LC_ALL=<locale name> locale charmap

    ```


    For the en_GB.iso8859-1 locale the following command will print:


    ```

    ISO-8859-1

    ```


    This results in a local setting of en_GB.ISO-8859-1. It is important that the
    locale found using the heuristic above is tested prior to being added to the Bash
    startup files:


    The above commands print the locale name, the character encoding used by the locale,
    the local currency, and the prefix to dial the telephone number in order to get
    into the country. If any of the commands fail with a message similar to the one
    below, this means that your locale was not installed in Chapter 8 or is not supported
    by the default installation of Glibc.


    ```

    locale: Cannot set LC_ to default locale: No file or directory

    ```


    If this happens, you should either assume the desired locale using the localsedef
    command, or choosing a different locale. Further instructions assure that there
    are no error messages from Glibc.


    Other packages can also function incorrectly (but not necessarily display any
    error messages) if the locale name does not meet their expectations. In those
    cases, investigating how Linux distributions support your locale may provide some
    useful information.


    The shell program /bin/bash (here referred at as "shell") uses a collection of
    startup files to help create the environment to run in. Each file has a specific
    use and may affect login and interactive environments differently. The files in
    the /etc directory provide global settings. If equivalent files exist in the home
    directory, they may override the global settings.


    257'
