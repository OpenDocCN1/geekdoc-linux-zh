    ```


    This package does not have a working test suite.


    Install the package:


    ```

    make SBINDIR=/usr/sbin install

    ```


    If desired, install the documentation:


    ```

    mkdir -pv /usr/share/doc/iproute2-6.7.0

    cp -v COPYING README* /usr/share/doc/iproute2-6.7.0

    ```


    # 8.65.2. Contents of IPRoute2


    +   - Installed programs: bridge, ctstat (link to Instat), genl, ifstat, ip, Instat,
    routel, rtacct, rtpr, rtstat (link to Instat), ss, and ic

    - Installed directories: /iproute2, /usr/lib/tc, and /usr/share/doc/iproute2-6.7.0


    # Some Descriptions


    +   - bridge Configures network bridges

    - ctstat Connection status utility

    - genl Genericlink utility front end

    - ifstat Shows main executable. It has several different functions, including
    these:

    - ip ip link <device> allows users to look at the state of devices and to make
    changes

    - ip addr allows users to look at addresses and their properties, add new addresses,
    and delete old ones

    - ip neighbor allows users to look at neighbor bindings and their properties,
    add neighbor entries, and delete old ones

    - ip rule allows users to look at the routing policies and change them

    - ip route allows users to look at the routing table and change routing table
    rules

    - ip tunnel allows users to look at the IP tunnels and their properties, and change
    them

    - ip madd allows users to look at the multicast addresses and their properties,
    and change them'
