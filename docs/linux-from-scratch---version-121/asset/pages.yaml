  md: '# ## 8.62. Groff-1.23.0


    The Groff package contains programs for processing and formatting text and images.


    **Approximate build time:** 0.2 SBU

    **Required disk space:** 107 MB


    # ## 8.62.1. Installation of Groff


    Groff expects the environment variable PAGE to contain the default paper size.
    For users in the United States, PAGE=letter is appropriate. Elsewhere, PAGE=A4
    may be more suitable. While the default paper size is configured during compilation,
    it can be overridden later by either “A4” or “letter” to the /etc/papersize file.


    Prepare Groff for compilation:


    ```

    PAGE=<paper_size> /configure --prefix=/usr

    ```


    Build the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


    # ## 8.62.2. Contents of Groff


    +   **Installed programs:** adftninfo, afmotid, chem, eqn, eqn2graph, giffmk,
    glylipond, gperl, gpinyin, graph2n, gram, godvi, groff, grolb, gropl, gropdf,
    groj4, grotty, hpfootdit, indxiv, lkbib, lookbib, mroff, neqn, refer, pdfmon,
    pdfbtops, pic, pic2graph, post-html, pre-grothml, refer, roff2vi, roff2html, roff2pdf,
    roff2ps, roff2text, soelim, tmfind, and troff

    **Installed directories:** /usr/lib/groff and /usr/share/doc/groff-1.23.0, /usr/share/groff


    # ### Short Descriptions


    +   **addftinfo**-Reads a troff file and adds some additional font-metric information
    that is used by the **groff** system


    +   **afmotid**-Creates a file for use with **groff** and **groups**


    +   **chem**-Groff preprocessor for producing chemical structure diagrams


    +   **eqn**-Compiles descriptions of equations embedded within troff input files
    into commands that are understood by **troff**


    +   **eqn2graph**-Converts a troff EQN (equation) into a cropped image


    +   **giffmk**-Marks differences between groff/nroff/troff files


    +   **glylipond**-Transforms sheet music in the lilypond language into the groff
    language language


    +   **gperl**-Preprocessor for groff, allowing the insertion of perl code into
    groff files


    +   **gpinyin**-Preprocessor for groff, allowing the insertion of Pinyin (Mandarin
    Chinese spelled with the Roman alphabet) into groff files.'
