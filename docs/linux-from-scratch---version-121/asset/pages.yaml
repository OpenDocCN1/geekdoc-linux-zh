  img_proc: true
- pgno: 62
  md: '# Linux From Scratch - Version 12.1


    Binutils is installed first because the configure runs of both gcc and glibc vary
    across features mentioned above. and linker determine which software features
    to enable or disable. This is more important than one realize at first. An incorrectly
    configured gcc or glibc can result in a subtly broken toolchain, where the impact
    of such breakage might not show up until the end of the entire distribution. A
    test suite will wisely highlight this error before too much work is performed.


    Binutils installs its assembler and linker in two locations, `$LFS/tools/bin`
    and `$LFS/$LFS_TGT/`. The tools in one location are linked to the other. An important
    facet of the library is its search order. Detailed information can be obtained
    from id by passing the `--verbose` flag. For example, `$LFS_TGT-id --verbose search`
    will show the current paths and order.(Note that this example can be seen only
    when logged in as root user). If you come back to this page later, replace `$LFS-TGT`
    with ld.


    The next package is installed. An example of what can be seen during its run of
    configure:


    ```

    checking what assembler to use... /mnt/lfs/tools/i686-lfs-linux-gnu/as

    checking what linker to use... /mnt/lfs/tools/i686-lfs-linux-gnu/ld

    ```


    This is important for reasons mentioned above. It also demonstrates that gcc''s
    configure script does not search the PATH directories to use. However, during
    the actual operation of gcc itself, the same paths are not necessarily used. To
    find out which linker will use, use: `$LFS_TGT-gcc --print-name-to-id`.(Again,
    remove the `$LFS_TGT-` prefix if coming back to it.)


    Detailed information can be obtained from gcc by passing the `-v` command line
    option while compiling a Program. For example, `$LFS_TGT-gcc -v` (or without `$LFS_TGT`
    if coming back later) will show detail information about the preprocessor, compiler,
    and assembly stages, gcc''s search for included headers and the order.


    Next: install Linux API headers. The standard C library (libc) to interface with
    features that the Linux kernel will provide.


    Next comes glibc. The most important considerations for building glibc are the
    compiler, binary tools, and kernel headers. The compiler is generally not an issue
    since glibc will always use the compiler relating to the `--host` parameter passed
    to its configure script; e.g., in our case, the compiler is `$LFS_TGT-gcc`. The
    binary tools and kernel headers can be a bit complex. Therefore, we take no risks
    and use the available configure switches to enforce the correct selections. After
    the run of configure, check the contents of the `make` file in the build directory
    for all binary tools are used and note the use of `--no-dandir` and `-system`
    flags to control the compiler''s search paths. These items highlight an important
    aspect of the glibc package—it is very self-sufficient in terms of its build machinery,
    and generally does not rely on toolchains.


    As mentioned above, the standard C++ library is installed next, followed by 6
    packages that do not cross-compile to break circular dependencies at build. The
    install step of all those packages uses the `DESTDIR` variable to force installation
    in the LFS filesystem.


    At the End of Chapter 6 the native LFS is installed. First binutils-pass2 is built,
    in the same pass `DESTDIR` as the other programs, omitting some non-critical libraries.
    Due to weird logic in gcc''s configure script, `CC_FOR_TARGET` ends up as when
    it is the same as the other, but different from the build system. This is when
    `CC_FOR_TARGET=$LFS_TGT_gcc` is declared explicitly as one of the configuration
    options.


    Upon entering Chapter 7, the temporary installations of programs needed for the
    operation of the toolchain are performed. From this point onwards, the toolchain
    is self-contained and self-hosted. In Chapter 8, final versions of all the packages
    needed for a fully functional system are built, tested, and installed.'
  merge: -1
  img_proc: true
- pgno: 63
  md: "# # General Compilation Instructions\n\n# ## Caution\n\nDuring a development\
