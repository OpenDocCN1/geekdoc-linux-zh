- pgno: 67
  md: '--disable-werror

    This prevents the build from stopping in the event that there are warnings from
    the host''s compiler.


    --enable-default-hash-style=gnu


    By default, the linker would generate both the GNU-style hash table and the classic
    ELF hash table for shared libraries and dynamically linked executables. The hash
    tables are only intended for a dynamic linker to perform symbol lookup. On LFS
    the dynamic linker (provided by the Glic package) will always use the GNU-style
    hash table which is faster to query. So the classic ELF hash table is completely
    useless. This linker only generate the GNU-style hash table by default, so we
    can avoid wasting time to generate the classic ELF hash table when we build the
    packages, or wasting disk space to store it.


    Continue with compiling the package:


    ```

    make

    ```


    Install the package:


    ```

    make install

    ```


    Details on this package are located in Section 8.19.2, “Contents of Binutils.",'
