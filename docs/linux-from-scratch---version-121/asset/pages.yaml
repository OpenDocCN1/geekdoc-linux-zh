- pgno: 51
  md: "# Chapter 4. Final Preparations\n\n# 4.1. Introduction\n\nIn this chapter,\
    \ we will perform a few additional tasks to prepare for building the temporary\
    \ system. We will create a set of directories in SLFS (in which we will install\
    \ the temporary tools), add an unprivileged user, and create an appropriate build\
    \ environment for that user. We will also explain the units of time (“SBUs”) we\
    \ use to measure how long it takes to build LFS packages, and provide some information\
    \ about package test suites.\n\n# 4.2. Creating a Limited Directory Layout in\
    \ the LFFSystem\n\nIn this section, we begin populating the LFS filesystem with\
    \ the pieces that will constitute the Linux system. The first step is to create\
    \ a limited directory hierarchy, so that the programs compiled in Chapter 6 as\
    \ well as libstdc++ in Chapter 5 can be installed in their final location. We\
    \ do this so that temporary programs will be overwritten when the final versions\
    \ are built in Chapter 8.\n\nCreate the required directory layout by issuing the\
    \ following commands as `root`:\n\n```\nmkdir -pv $lfs/{etc, var} $lfs/usr/{bin,lib,sbin}\n\
    \nfor i in bin lib sbin; do\n ln -sv /usr/$i $lfs/$i\ndone\n\ncase $(uname -m)\
    \ in\nx86_64) mkdir -pv $lfs/lib64 ;\nesac\n```\n\nPrograms in Chapter 6 will\
    \ be compiled with a cross-compiler (more details can be found in section Toolchain\
    \ Technical Notes). This cross-compiler will be installed in a special directory,\
    \ to separate it from the other programs. Still acting as `root`, create that\
    \ directory with:\n\n```\nmkdir -pv $lfs/tools\n```\n\n> Note\nThe LFS editors\
    \ have deliberately not to use a /usr/lib64 directory. Several steps are taken\
    \ to ensure the toolchain will not use it. If for any reason this directory appears\
    \ (either you made an error in the following instructions, or because you installed\
    \ a binary package that created after finishing LFS), it may break your system.\
    \ You should be sure this directory does not exist.\n\n# 4.3. Adding the LFS User\n\
    \nWhen logged in as `root`, making a single mistake can damage or destroy a system.\
    \ Therefore, the packages in the next two chapters are built as an unprivileged\
    \ user. You could use your own name, to make it easier to set up a clean working\
    \ environment, we create a new user `lfs` as a member of a group (also named `lfs`)\
    \ and run commands as `lfs` during the installation process. Follow the following\
    \ commands to add the new user:\n\n```\ngroupadd lfs\nuseradd -s /bin/bash -g\
    \ lfs -m -k /dev/null lfs\n```\n\nThis is what the command line options mean:\n\
    \n+   -s /bin/bash\nThis makes bash the default shell for `lfs`."
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Linux From Scratch - Version 12.1


    - g lfs

    This option adds user lfs to group lfs.


    - m

    This creates a home directory for lfs.


    - k /dev/null

    This parameter prevents possible copying of files from a skeleton directory (the
    default is /etc/skel) by changing the input location to the special null device.


    lfs

    This is the name of the new user.


    If you want to log in as lfs or switch to lfs from a non-root user (as opposed
    to switching to user lfs when logged in as root, which does not require the lfs
    user to have a password), you need to set a password for lfs. Issue the following
    command as the root user to set the password:


    ```

    passwd lfs

    ```


    Grant lfs access to all the directories under $LFS by making lfs the owner:


    ```

    chown -v lfs $LFS/(user/*,lib,var,etc,bin,sbin,tools)

    case $(uname -m) in

    x86_64) chown -v lfs $LFS/lib64 ;;

    esac

    ```


    > In some host systems, the following su does not complete properly and suspends
    the login for the lfs user to the background. If the prompt "lfs:-$ does not appear
    immediately, entering the fg command will fix the issue.


    Next, start a shell running as user lfs. This can be done by logging in as lfs
    on a virtual console, or with the following substitute/user command:


    ```

    su - lfs

    ```


    The "-” instructs su to start a login shell as opposed to a non-login shell. The
    difference between these two types of shells is explained in detail in bash(1)
    and info bash.


    # 4.4. Setting Up the Environment


    Set up a good environment by creating two new scripts for the bash shell. While
    logged in as user lfs, issue the following command to create a new .bash_profile:


    ```

    cat > ~/.bash_profile << "EOF"

    exec env -i HOME=$HOME TERM=$TERM PATH=$w$ '' /bin/bash

    EOF

    ```


    When logged in as lfs, or switched to the lfs user using an su with the "-", the
    initial shell is a login shell which reads the /etc/profile of the host (probably
    containing settings and environment variables) and then .bash_profile. The exec
    -i /bin/bash command replaces the running shell with a new one with completely
    empty environment, except for the HOME, TERM, and PS1 variables. This ensures
    that no unwanted and potentially hazardous environment variables from the host
    system leak into the build environment.'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'instance of the shell is a non-login shell, which does not read, and execute,
    the contents of the /etc/profile

    or .bash_profile files, but rather reads, and executes, the .bashrc file. Create
    the .bashrc file now:


    ```

    cat << EOF ~/.bashrc

    set +h

    ask 022

    LFS=/mnt/lfs

    LC_ALL=POSIX

    LFS_TGT=$(uname -m) -lfs-linux-gnu

    PATH=/usr/bin

    if [ -L $LFS/tools/bin:$PATH ]; then

    PATH=$LFS/usr/share/config.site

    export LFS LC_ALL LFS_TGT CONFIG_SITE

    EOF

    ```


    # The meaning of the settings in .bashrc


    set +h


    The set +h command turns off bash''s hash function. Hashing is ordinarily a useful
    feature—bash uses a table to remember the full path to executable files avoid
    searching the PATH and again to find the same executable. The new tools should
    be used as soon as they are installed. Switching off the hash function forces
    the shell to search the PATH whenever a program is to run. As such, the newly
    compiled tools in LFS/tools/bin as soon as they are available without remembering
    a previous version of the program provided by the host distro, in /usr/bin or
    /bin.


    umask 022


    Setting user file-creation mask (umask) 022 ensures that newly created files and
    directories are only writable by their owner, but readable and executable by anyone
    (default modes are set by the open(2) system call, new files will use permission
    mode 644 and directories to 755).


    LFS=/mnt/lfs


    The LFS variable should be set to the chosen mount point.


    LC_ALL=POSIX


    The LC_ALL variable controls the localization of certain programs


    LFS_TGT=$(uname -m)-lfs-linux-gnu


    The LFS_TGT variable sets a non-default, but compatible machine description for
    use when building our cross-compiler and when cross-compiling our temporary toolchain.
    More information is provided by Toolchain Technical Notes.


    PATH=/usr/bin


    Many Linux distributions have merged /bin and /usr/bin. When this is the case,
    or not, the standard PATH variable should be set to /usr/bin for the Chapter 6
    environment. Using the following lines / to the path:


    ```

    if [ ! -L /bin ]; then PATH=$bin:$PATH; fi

    If /bin is not a symbolic link, it must be added to the PATH variable.

    ```


    PATH=$LFS/tools/bin:$PATH


    By putting $LFS/tools/bin ahead of standard PATH, the cross-compiler installed
    at the beginning of Chapter 5 is picked up by the shell immediately after its
    installation, combined with turning off hashing, limits the risk that the compiler
    from the host is used instead of the cross-compiler.


