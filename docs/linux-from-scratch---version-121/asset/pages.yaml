- pgno: 112
  md: '# Chapter 8. Installing Basic System Software


    # 8.1. Introduction


    In this chapter, we start constructing L system in earnest.


    The installation of this software is straightforward. Although in many cases the
    installation instructions could be shorter and more generic, we have opted to
    provide the full instructions for every package to minimize the possibilities
    for mistakes. The key to learning what makes a Linux system work is to know what
    each package is for and why you (or the system) may need it.


    We do not recommend using customized optimizations. They make a program run slightly
    faster, but they may also cause compilation difficulties, and problems when running
    the program. If a package fails to compile with a customized optimization, try
    to compile without optimization and see if that fixes the problem. Even if the
    package done when using a customized optimization, there is the risk it may have
    compiled incorrectly because of the complex interactions between the code and
    the build tools. Also note that -march and -tune options not specified in the
    package build with the toolchain packages (Binutils, GCC and Glibc). The small
    gains achieved by customizing optimizations are often outweighed by the risks.
    First-time builders of Linux are encouraged to build without custom optimizations.


    On the other hand, we keep the optimizations enabled by the default configuration
    of the packages. In addition, we explicitly enable an optimized configuration
    provided by a package but not enabled by default. The package maintainers have
    already tested these configurations and consider them safe, so it'' not likely
    to break the build. Generally the default configuration enables -O2 or -O3, so
    the system will still run well without any customized optimization, and be stable
    at the same time.


    Before the installation instructions, each installation page provides information
    about the package, a concise description of what it contains, approximately how
    long it will take to build, and how much disk space is required during this building
    process. Following the installation instructions, there is a list of packages
    and libraries (along with brief descriptions) that the package installs.


    > Note

    The SBU values and required disk space include test data for all applicable packages
    in Chapter 8. SBU values have been calculated using four CPU cores (-j4) for all
    operations unless specified otherwise.


    # 8.1.1. About Libraries


    In general, the LFS editors discourage building and installing static libraries.
    Most static libraries have been obsolete in a modern Linux system. In addition,
    linking a static library into a program can be detrimental. If an update to the
    library is needed to remove a security problem, every program that uses the static
    library will need to be relinked with the new library. Since the use of static
    libraries is not always obvious, the relevant programs may not even be known.


    The procedures in this chapter remove or disable installation of most static libraries.
    This is usually by passing a --disable-static option to configure. In other cases,
    alternate means are needed. In a few cases, especially Glibc and GCC, the use
    of static libraries remains an essential feature of the package building process.


    For a more complete discussion of libraries, see Libraries: Static or shared?
    in the BLFS book.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Linux From Scratch - Version 12.1


    # 8.2. Package Management


    Package Management is an requested addition to the LFS Book. A Package Manager
    tracks the installation of files, making it easier to remove and upgrade packages.
    A good package manager will also handle the configuration files specially to keep
    the user configuration when the package is reinstalled or upgraded. Before you
    begin to wonder, NO—this section will not talk about recommending any particular
    package manager. What it does provide is a round of the more popular techniques
    and how they work. The perfect package manager for you may be among these techniques,
    or it may be a combination of two or more of these. This section briefly mentions
    issues that may arise when upgrading packages.


    Some reasons why no package manager is mentioned in LFS or BLFS:


    +   - Dealing with package management takes the focus away from the goals of these
    books—teaching how a Linux system is built.


    +   - There are multiple solutions for package management, each having its strengths
    and drawbacks. Finding one that satisfies all audiences is difficult.


    There are some hints written on the topic of package management. Visit the Hints
    Project and see if one of them fits your needs.


    # 8.2.1. Upgrade Issues


    A Package Manager makes it easy to upgrade to newer versions when they are released.
    Generally the instructions in the LFS and BLFS books can be used to upgrade to
    the newer versions. Here are some points that you should be aware of upgrading
    packages, especially on a running system.


    +   - If the kernel needs to be upgraded (for example, from 5.10.17 to 5.10.18
    or 5.11.1), nothing else needs to be rebuilt. The system will keep working fine
    thanks to the well-defined interface between the kernel and userspace. You will
    need to reboot your system to use the upgraded kernel.


    +   - If Glibc needs to be upgraded to a newer version, (e.g., from Glibc-2.36
    to Glibc-2.39), some extra steps are needed to avoid breaking the system. Read
    Section 8.5, "Glibc-2.39" for details.


    +   - If a package containing a shared library is updated, and the name of the
    library changes, dynamically linked to the library will break, to link against
    the newer. (Note that there is no correlation between the package version and
    the name of the library).For example, consider a package foo-1.2.3 that installs
    a shared library with the name libfoo.so.2. In this case, any packages that are
    dynamically linked to libfoo.so need to be recompiled with libfoo.so in order
    to use the new version. You should not remove the old libraries until all the
    dependent packages have been recompiled.


    +   - If a package is (directly or indirectly) linked to both the old and new
    names of a shared library (for example, the package links to both libfoo.so.2
    and libbar.so.1, while the later links to libfoo.so.3), the package may malfunction
    because of the different versions of the shared library prevent incompatible definitions
    for symbol names. This can be caused by recompiling some, but not all, of packages
    linked to the old shared library after the package providing the shared library
    is upgraded. To avoid the issue, users will need to rebuild every package linked
    to a shared library with an updated version (e.g. libfoo.so.2 to libfoo.so.3)
    as soon as possible.


    +   - If a package containing a shared library is updated, and the name of the
    library doesn''t change, the number of file decreases (for example, the library
    is still named libfoo.so.1, but the name of the file is changed from libfoo.so.1.25
    to libfoo.so.1.24), you should remove the library file from the previously


    95'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'installed (libfoo.so.1.25) in this case). Otherwise, a ldconfig (invoked by
    yourself from the command line, or by the installation of some package) will reset
    the symlink libfoo.so.1 to the old library file because it is a "newer" version;
    its number is larger. This situation may arise if you have to downgrade a package,
    or if the authors change the versioning scheme for library files.


    +   - If a package containing a shared library is updated, and the name of the
    library doesn''t change, but a severe issue (especially, a security vulnerability)
    is fixed, all running programs linked to the shared library should be restarted.
    The following command, run as root after the update is complete, will list which
    packages are using the old versions of those libraries (replace libfoo with the
    name of the library):


    ```

    grep -l ''libfoo.deleted'' /proc/*/maps -tr -cd 0-9*\n | xargs -p u

    ```


    If OpenSSH is used to access the system and is linked to the updated library,
    you must restart the sshd service, then log out, login again, and run the preceding
    command to confirm that nothing is still using the deleted libraries.


    +   - If an executable program or a shared library is overwritten, the processes
    using the code or data in that program or library may crash. The correct way to
    update a program or a shared library without causing the process to crash is to
    remove it first, then install the new version. The install command provided by
    කරයි helps install binary files and libraries. This means that you won''t be troubled
    by this issue of time. However, the install process of some packages (notably
    SpiderMonkey in BLFS) justrites the file if it exists; this causes a crash. It''s
    safer to save your work and close unused processes before updating a package.


    # ## 8.2. Package Management Techniques


    The following are some common package management techniques. Before making a decision
    on a package manager, do some research on the various, particularly the drawbacks
    of each particular scheme.


    # ### 8.2.1. It is All in My Head!


    Yes, this is a package management technique. Some folks do not need a package
    manager because they know the packages are installed by each package. Some users
    also do not need any package management because they rely on rebuilding the entire
    system whenever a package is changed.


    # ### 8.2.2. Install in Separate Directories


    This is a simplistic package management technique that does not need a special
    program to manage the packages. Each package is installed in a separate directory.
    For example, package foo-1.1 is installed in /opt/foo-1 and a symlink is made
    from /opt to /opt/foo-1. When a new version foo-1.2 comes, it is installed in
    /opt/foo-1.2 and the previous symlink is replaced by a symlink to the new version.


    Environment variables such as PATH, MANPATH, INFOPATH, PKG_CONFIG_PATH, CPPFLAGS,
    LDFLAGS, and the configuration file /etc/ld.so.conf may need to be expanded to
    include the corresponding subdirectories in /opt/foo-x.y.


    This scheme is used by the BLFS book to install some very large packages to make
    it easier to upgrade them. If you install more than a few packages, this scheme
    becomes unmanageable (for example Linux API headers and Glibc) may not work well
    with this scheme. Never use this system-wide.'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# 8.2.2.3. Symlink Style Package Management


    This is a variation of the package management technique. Each package is installed
    as in the previous scheme. But instead of making the symlink via a generic package
    name, each file is symlinked into the /usr hierarchy. This removes the need to
    expand the environment variables. Though the symlinks can be created by the user,
    many managers use this approach, and automate the creation of the symlinks. A
    few of the popular ones include Stow, Epkg, Graft, and Depot.


    The installation script needs to be fooled, so the package is installed in /usr
    though in reality it is installed in the /usr/pkg hierarchy. Installing in this
    manner is not usually a trivial task. For example, suppose you are installing
    a package libfoo-1.1. The following instructions may not install the package properly:


    ```

    /configure --prefix=/usr/pkg/libfoo/1.1

    make

    make install

    ```


    The installation will work, but the dependent packages may not link to libfoo
    as you would expect. If you compile a package that links against libfoo, you may
    notice it is linked to /usr/pkg/libfoo/1.1/lib/libfoo.so.i instead of /usr/lib/libfoo.so.1
    as you would expect. The correct approach is to use the DESTDIR variable to direct
    the installation. This approach works as follows:


    ```

    /configure --prefix=/usr/pkg

    make

    make DESTDIR=/usr/pkg/libfoo/1.1 install

    ```


    Most packages support this approach, but there are some which do not. For the
    non-compliant packages, you may need to install the package manually, or you may
    find that it is easier to install problematic packages like /opt.


    # 8.2.2.4. Timestamp Based


    In this technique, a file is timestamped before the installation of the package.
    After the installation, a simple use of the find command with the appropriate
    options can generate a log of all the files installed after the timestamp was
    created. A package manager that uses this approach is install-log.


    Though this has the advantage of being simple, it has two drawbacks. During installation,
    if the packages are installed with any timestamp other than the current time,
    those files will not be tracked by the package manager. Also, this scheme can
    only be used when packages are installed one at a time. The logs are not reliable
    if two packages are installed simultaneously from two different consoles.


    # 8.2.2.5. Tracing Installation Scripts


    In this approach, the installation scripts perform are recorded. There are two
    techniques that one can use:


    The LD_PRELOAD environment variable can be set to point to a library before installation.
    During installation, this library tracks the packages that are being installed
    by attaching itself to various executables such as cp, install and tracking the
    system calls that modify the filesystem. For this approach to work, all the executables
    need to be dynamically linked without the su or gdb preload. The library may cause
    some unwanted side-effects during installation. It’s a good idea to perform some
    tests to ensure the package manager does not break anything, and that it logs
    all the appropriate files.


    Another technique is to use strace, which logs all the system calls made during
    the execution of the installation scripts.'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 8.2.2.6. Creating Package Archives


    In this scheme, the package installation is faked into a separate tree as previously
    described in the symlink style package management scheme. After installation,
    a package archive is created using the installed files. This archive is used to
    install the package on the local machine or even on other machines.


    This approach is used by many of the package managers found in the commercial
    distributions. Examples of package managers that follow this approach are RPM
    (which, incidentally, is required by the Linux Standard Base Specification), pkg-utils,
    Debian''s apt, and Gentoo''s Package. A hint describing how to adapt this style
    of package management for LFS systems is located at https://www.linuxfromscratch.org/hints/downloads/files/fakeroot.txt.


    The creation of files that include dependency information is complex, and beyond
    the scope of LFS. Slackware uses a tar-based system for package archives. This
    system purposely does not handle package dependencies as more complex package
    managers do. For details of Slack package management, see https://www.slackbook.org/package-management.html.


    # 8.2.2.7. User Based Management


    This scheme, unlike LFS, was devised by Matthias Benmann and is available from
    the Hints Project. In this scheme, each package is installed as a separate unit
    into the standard locations. Files belonging to a package are easily identified
    by checking the user ID. The features and shortcuts of this approach are too complex
    to describe in this section. For details please see the hint at https://www.linuxfromscratch.org/hints/downloads/files/more_control_and_pkg_man.txt.


    # 8.2.3. Deploying LFS on Multiple Systems


    One of the advantages of an LFS system is that there are no files that depend
    on the position of files on a disk system. Cloning an LFS build to another computer
    with the same architecture as the base system is as simple as using tar on the
    LFS partition that contains the root directory (around 900MB uncompressed for
    a basic LFS build), copying that file network transfer or CD-ROM / USB stick to
    the new system, and expanding it. After that, a few configuration files will need
    to be changed. Configuration files that may need to be updated include: /etc/hosts,
    /etc/fstab, /etc/passwd, /etc/group, /etc/shadow, /etc/ld.so.conf, /etc/sysconfig/rc.site,
    /etc/sysconfig/network, and /etc/sysconfig/eth0.


    A custom kernel may be needed for the new system, depending on differences in
    system hardware and the original kernel configuration.


    > There have been some reports of issues when copying between similar but not
    identical architectures. For instance, the instruction set for an Intel system
    is not identical with the AMD processor''s instructions, and later versions of
    some processors may provide instructions that are unavailable with earlier versions.


    The new system has to be made bootable by Section 10.4, “Using GRUB to Set Up
    the Boot Process”'
