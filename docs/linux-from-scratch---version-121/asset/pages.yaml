    command combines

    t /usr/share/i18n/locales/cs_CZ charset-locale definition with the /usr/share/i18n/charmaps/UTF-8-

    gmap appends the result to the /usr/lib/locale-archive-file. The following instructions

    will install the minimum set of locales for optimal coverage of tests:


    ```

