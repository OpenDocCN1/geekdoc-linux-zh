    #n# Return values (as defined by LSB status codes):\n# 0 - Success (PIDs to stdout)\n\
    # 1 - Program is dead, pidfile still exists (remaining PIDs)\n# 3 - Program is\
    \ not running (no output)\n################################################################\n\
    ```\n\n```\npidofproc()\n{\n    local pidfile\n    local program\n    local prefix\n\
    \    local progname\n    local pidlist\n    local lpids\n    local exitstatus=\"\
    0\"\n\n    # Process arguments\n    while true; do\n        case \"$1\" in\n \
    \           -p)\n                pidfile=\"${$2}\"\n                shift 2\n\
    \                ;)\n                progname=\"${$1}\"\n                if [\
    \ -n \"${$2}\" ]; then\n                    # Too many arguments\n           \
    \         # Since this is status, return 4\n                else\n           \
    \         break\n                fi\n                ;;\n        esac\n    done\n\
    \n    # If A PID file is not specified, try to find one.\n    if [ -z \"$pidfile\"\
    \ ]; then\n        # Get the program's basename\n        prefix=$(echo \"$program\"\
    \ | sed 's/\\/\\/\\\\/]*//'\n    fi\n\n    if [ -z \"$prefix\" ]; then\n     \
    \   progname=\"${$program}\"\n    else\n        progname=$(echo \"$program\" |\
    \ sed \"s@\\${prefix}@@\")\n    fi\n\n    # If A PID file exists with that name,\
    \ assume that it is.\n    if [ -e \"/run/${progname}.pid\" ]; then\n        pidfile=\"\
