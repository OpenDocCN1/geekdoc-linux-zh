- pgno: 34
  md: '# 2.3. Building LFS in Stages


    LFS is designed to be built in one session. That is, the instructions assume that
    the system will not be shut down during the process. This does not mean that the
    system can be built in one sitting. The issue is that certain procedures must
    be repeated after a reboot when resuming LFS at different points.


    # 2.3.1. Chapters 1–4


    These chapters run commands on the host system. When restarting, be certain of
    one of:


    +   - Procedures performed as the root user after Section 2.4 must have the LFS
    environment variable set FOR ROOT USER.


    # 2.3.2. Chapters 5–6


    +   - The /mnt/lfs partition must be mounted.

    - These two chapters must be done as user lfs. A su - lfs command must be issued
    before performing any task in these chapters. If you don''t, you are at risk of
    installing packages to the host, and potentially rendering it unusable.

    - The procedures in General Compilation Instructions are critical. If there any
    doubt a package has been installed correctly, ensure the previously expanded tarball
    has been removed, re-extract the package, and complete all the instructions in
    that section.


    # 2.3.3. Chapters 7–10


    +   - The /mnt/lfs partition must be mounted.

    - A few operations, from “Changing Ownership” to “Entering the Chroot Environment,”
    must be done as the root user, with the LFS environment variable set for root
    user.

    - When entering chroot, the LFS environment variable must be set for root. The
    LFS variable is not used after the chroot environment has been entered.

    - The virtual file system must be mounted. This can be done before or after entering
    chroot by changing to a host virtual terminal and, as root, running the commands
    in Section 7.3.1, “Mounting and Populating /dev” and Section 7.3.2, “Mounting
    Volatile Kernel File Systems”.


    # 2.4. Creating a New Partition


    Unlike other operating systems, LFS is usually installed on a dedicated partition.
    The recommended approach to building an LFS system is to use an empty partition
    partition, or if you have unpartitioned space, to create one.


    A minimal system requires a partition of at least 10 gigabytes (GB). This is enough
    to store all the sources and compile the packages. However, if the LFS is intended
    to be the primary Linux system, additional software will probably be installed
    which will require additional space. A 30 GB partition is a reasonable size to
    provide for growth. The LFS system itself will not take up much room. A large
    partition of this requirement is to provide free temporary storage as well as
    adding additional capabilities after LFS is complete. Additionally, compiling
    carries a risk of disk space which will be reclaimed after the package is installed.


    Because there is not always enough Access Memory (RAM) available for compilation
    processes, it is a good idea to use a small partition for swap space. This is
    used by the kernel to store seldom-used data and leave more memory available for
    active processes. The swap partition for an LFS system can be the same as the
    one used by the host system, in which case it is not necessary to create another.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Linux From Scratch - Version 12.1


    Start a disk partitioning program such as cfdisk or fdisk with a command line
    option naming the hard disk on which the new partition will be created—for /dev/sda
    for the primary disk drive. Create a native partition and a swap partition, if
    needed. Please refer to cfdisk(8) or fdisk(8) if you do not know how to use the
    programs.


    > Note

    For experienced users, other partitioning schemes are possible. The new LFS system
    can be on a software RAID or an LVM logical volume. However, some of these options
    are not intramifs, which is an advanced topic. These partitioning methodologies
    are not recommended for first LFS users.


    Remember the designation of the new partition (e.g., sda). This book will refer
    to this as the LFS partition. Also remember the designation of the swap partition.
    These names will be needed later for the /etc/fstab file.


    # ## 2.4. Other Partition Issues


    Requests for advice on system partitioning are often posted on the LFS mailing
    lists. This is a highly subjective topic. The default for most distributions is
    to use the entire drive with the exception of one small swap partition. This is
    not optimal for LFS for several reasons. It reduces flexibility, makes sharing
    data across multiple distributions or LFS builds more difficult, makes backups
    more time consuming, and can waste disk space through inefficient allocation of
    file system structures.


    # ### 2.4.1. The Root Partition


    A LFS partition (not confused with the /root directory) of twenty gigabytes is
    a good compromise for most systems. It provides enough space to build LFS and
    most of BLFS, but is small enough that many partitions can be easily created for
    experimentation.


    # ### 2.4.2. The Swap Partition


    Most distributions automatically create a swap partition. Generally the recommended
    size of the swap partition is about twice the amount of physical RAM, whereas
    this is rarely needed. If disk space is limited, hold the swap partition to two
    gigabytes and monitor the amount of disk usage.


    If you want to use the hibernation feature (suspend-to-disk) of Linux, it writes
    the contents of RAM to the swap before turning off the machine. In this case the
    size of the swap partition should be at least large as the system''s installed
    RAM.


    Swapping is never good. For mechanical drives you can generally tell if a system
    is swapping by just listening to disk activity and observing how the system reacts
    to commands. With an SSD you will not be able to hear swapping, but you can tell
    how much swap space is being used by running the top or free programs. Use of
    an SSD for a swap partition should be avoided if possible. The first reaction
    to swapping should be to check for an unreasonable command as trying to edit a
    five gigabyte file. If swapping becomes a normal occurrence, the best solution
    is to purchase more RAM for your system.


    # ### 2.4.1.3 The Grub Bios Partition


    If the boot disk has been partitioned with a GUID Partition Table (GPT), then
    a small, typically 1 MB, partition must be created if it does not already exist.
    This partition is not formatted, but must be available for GRUB using during installation
    of the boot loader. This partition will normally be labeled ''BIOS Boot'' if you
    have a code of EF02 using the fdisk command.


    17'
