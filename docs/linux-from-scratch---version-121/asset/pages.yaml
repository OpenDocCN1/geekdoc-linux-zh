  md: "# 8.5. Glibc-2.39\n\nThe Glibc package contains the main C library. This library\
    \ provides the basic routines for allocating memory, searching directories, opening\
    \ and closing files, reading and writing files, string handling, pattern matching,\
    \ arithmetic, and so on.\n\n**Approximate build time:** 12 SBU\n**Required disk\
    \ space:** 3.1 GB\n\n# 8.5.1. Installation of Glibc\n\nSome of the Glibc programs\
    \ use the non-FHS compliant `var/db` directory to store their runtime data. Apply\
    \ the following patch to match store their runtime data in the FHS-compliant locations:\n\
    \n```\npatch -Np1 -i ../glibc-2.39-fhs-1.patch\n```\n\nThe Glibc documentation\
    \ recommends building Glibc in a dedicated build directory:\n\n```\nmkdir build\n\
    cd build\n```\n\nEnsure that **idconfig** and **sln** utilities will be installed\
    \ into `/usr/sbin`:\n\n```\necho \"rootsbind=/usr/sbin\" > configparms\n```\n\n\
    Prepare Glibc for compilation:\n\n```\n../configure --prefix=/usr\n    --disable-error\n\
    \    --enable-kernel=4.19\n    --enable-stack-protector=strong\n    --disable-nscd\n\
    \    libc_cv_slibdir=/usr/lib\n```\n\nThe meaning of the configure options:\n\n\
    +   --disable-error\nThis disables the -Error option passed to GCC. This is necessary\
    \ for running the test suite.\n--enable-kernel=4.19\nThis option tells the build\
    \ system that Glibc may be used with kernels as old as 4.19. This means generating\
    \ workarounds in a system call introduced in a later version cannot be.\n--enable-stack-protector=strong\n\
    This option increases security by adding extra code to check for buffer overflows,\
    \ such as smashing attacks. Note that Glibc always explicitly overrides the default\
    \ of GCC, so this option is still needed even though we've already specified --enable-default-sp\
    \ for GCC.\n--disable-nscd\nDo not build the name service daemon which is no longer\
    \ used.\nlibc_cv_slibdir=/usr/lib\nThis variable sets the correct library for\
    \ all systems. We do not want lib64 to be used.\n\nCompile the package:\n\n```\n\
    make\n```"
