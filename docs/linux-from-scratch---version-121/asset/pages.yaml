  md: '# 8.35. Bash-5.2.21


    The Bash package contains the Bourne-Again Shell.


    Approximate build time: 1.2 SBU

    Required disk space: 52 MB


    # 8.35.1. Installation of Bash


    First, fix some issues identified upstream:


    ```

    patch -Np1 -i ../bash-5.2.21-upstream_fixes-1.patch

    ```


    Prepare Bash for compilation:


    ```

    .configure --prefix=/usr \

    --without-bash-malloc \

    --with-installed-readline \

    --docdir=/usr/share/doc/bash-5.2.21

    ```


    The meaning of the new configure option:


    --with-installed-readline

    This option tells Bash to use the readline library that is already installed on
    the system rather than using its own version.


    Compile the package:


    ```

    make

    ```


    Skip down to "Install the package" if not running the test suite.


    To prepare the tests, ensure that the tester user can write to the sources tree:


    ```

    chown -R tester

    ```


    The test suite of this package is designed to run as a non-root user who owns
    the terminal connected to standard input. To satisfy the requirement, spawn a
    new pseudo terminal using expect and run the tests as the tester:


    ```

    su -s /usr/bin/expect tester << "EOF"

    set timeout -1

    spawn make tests

    expect eof

    assleep [wait] --- value

    exit $value

    EOF

    ```


    The test suite uses diff to detect the difference between test script output and
    the expected output. Any output from diff (prefixed with < and >) indicates a
    test failure, unless there is a message saying the difference can be ignored.
    One test named run-buildings is known to fail on some hit distros with a difference
    on the first line of the output.


    Install the package:


    ```

    make install

    ```


    Run the newly compiled bash program (replacing the one that is currently executing):


    ```

    exec /usr/bin/bash --login

    ```'
  merge: -1
