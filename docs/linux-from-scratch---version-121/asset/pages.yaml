  md: '# 8.76. Man-DB-2.12.0


    The Man-DB package contains programs for finding and viewing man pages.


    Approximate build time: 0.2 SBU

    Required disk space: 41 MB


    # 8.76.1. Installation of Man-DB


    Prepare Man-DB for compilation:


    ```

    ./configure --prefix=/usr

    --docdir=/usr/share/doc/man-db-2.12.0

    --asyscdir=/etc

    --disable-setuid

    --enable-cache-owner=bin

    --with-browser=/usr/bin/lynx

    --with-vgrind=/usr/bin/vgrind

    --with-grep=/usr/bin/grep

    --with-systemdfilesdir=

    --with-systemdmsunitdir=

    ```


    The meaning of the configure options:


    --disable-setuid


    This disables making the man program setuid to user man.


    --enable-cache-owner=bin


    This changes ownership of the system-wide cache files to user bin.


    --with-...


    These three parameters are used to set some default programs. lynx is a text-based
    web browser (see BLFS for installation instructions), vgrind converts sources
    to Groff input, and grep is useful for typesetting graphs in Groff documents.
    The vgrind and grep programs are not normally needed for viewing manual pages.
    They are not part of LFS or BLFS, but you should be able to install them yourself
    after finishing L if you wish to do.


    --with-systemd...


    These parameters prevent installing unused systemd directories and files.


    Compile the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make check

    ```


    Install the package:


    ```

    make install

    ```


