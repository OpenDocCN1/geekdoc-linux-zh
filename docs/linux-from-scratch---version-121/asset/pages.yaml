- pgno: 302
  md: '# Appendix C. Dependencies


    Every package built in LFS relies on one or more other packages in order to build
    and install properly. Some packages even participate in circular dependencies,
    the first package depends on the second on which turn depends on the first. Because
    of these, the order in which packages are built in LFS is very important. This
    page is to document the dependencies of each package built in LFS.


    For each package that is built, there are three, and sometimes up to five of dependencies
    listed below. The first lists what other packages needs to be available in order
    to compile and install the package in question. The second lists the packages
    that must be available when any programs or libraries from the package are used
    at runtime. The third lists what, in addition to the first list, needs to be available
    in order to run the test suites. The last list of dependencies are packages that
    require this package to be built and installed in its final location before they
    are built and installed.


    The last list of dependencies are optional packages that are not addressed in
    LFS, but could be useful to the user. These packages may have additional mandatory
    or optional dependencies of their own. For these dependencies, the recommended
    practice is to install them after completion of the LFS book and then go back
    and rebuild the LFS package. In several cases, re-installation is addressed in
    BLFS.


    # Acl


    +   - Installation depends on: Attr, Bash, Binutils, Coreutils, GCC, Gettext,
    Grep, M4, Make, Perl, Sed, and Texinfo

    - Required at runtime: Automake, Diffutils, Findutils, and Libtool

    - Must be installed before: Coreutils, Sed, Tar, and Vim

    - Optional dependencies:


    # Attr


    +   - Installation depends on: Bash, Binutils, Coreutils, GCC, Gettext, Grep,
    M4, Make, Perl, Sed, and Texinfo

    - Required at runtime: Glibc

    - Test suite depends on: Automake, Diffutils, Findutils, and Libtool

    - Must be installed before: Acl, Libcap, and Patch

    - Optional dependencies:


    # Autoconf


    +   - Installation depends on: Bash, Coreutils, Grep, M4, Make, Perl, Sed, and
    Texinfo

    - Required at runtime: Bash, Coreutils, Grep, M4, Make, Sed, and Texinfo

    - Test suite depends on: Automake, Diffutils, Findutils, GCC, and Libtool

    - Must be installed before: Automake and Coreutils

    - Optional dependencies:


    # Automake


    +   - Installation depends on: Autoconf, Bash, Coreutils, Gettext, Grep, M4, Make,
    Perl, Sed, and Texinfo

    - Required at runtime: Bash, Coreutils, Grep, M4, Sed, and Texinfo

    - Test suite depends on: Binutils, Bison, Bzip2, DejaGNU, Diffutils, Findutils,
    Flex, GCC, Gettext, Gzip, Libtool, and Tar

    - Must be installed before: Coreutils

    - Optional dependencies:


    None


    None


    Emacs


    None'
