- pgno: 99
  md: '# Linux From Scratch - Version 12.1


    If you don''t want to use all logical cores, replace $(proc) with the number of
    cores you want to use for building packages in this chapter and the following
    chapters. The test suites of packages (notably Autoconf, Libtool, and Tar) in
    Chapter 8 are not affected by MAKEFLAGS, they use a TESTFLAGS environment instead.
    We set that as here for running these tests with multiple cores.


    The -option to use the env command will clear all the variables in the chroot
    environment. After that, only the HOME, TERM, PSI, and PATH variables are set.
    The TERM=$TERM constructs the TERM variable inside chroot to the value outside
    chroot. This variable is needed so programs like vim and less can operate properly.
    If other variables are desired, such as CFLAGS or CFLAGS, this is a good place
    to set them.


    From this on, there is no need to use the LFS variable any more because all work
    will be restricted to the LFS system; the chroot command runs Bash with the root
    (/) directory set to $LFS.


    Notice that /tools/bin is not in the PATH. This means that the toolchain will
    no longer be used.


    Also note that the prompt will say I have no name! This is normal because the
    /etc/passwd file has not been created.


    > It is important that all the commands throughout the remainder of this chapter
    and the following chapters are run from within the chroot environment. If you
    leave this environment for any reason (rebooting for example), ensure that the
    virtual kernel filesystems are mounted as explained in Section 7.3.1,"Mounting
    and Populating /dev" and Section 7.3.2, "Mounting Virtual Kernel File Systems"
    and enter chroot again before continuing with the installation.


    # 7.5. Creating Directories


    It is time to create the full directory structure in the LFS system.


    > The directories mentioned in this section may have already been created earlier
    with explicit instructions, or when installing some packages. They are repeated
    for completeness.


    Create some root-level directories that are not in the limited set required in
    the previous chapters by issuing the following command:


    ```

    mkdir -pv /(boot,home,mnt,opt,srv)

    ```'
