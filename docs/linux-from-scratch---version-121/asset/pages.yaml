- pgno: 58
  md: '# Important Preliminary Material


    # Introduction


    This part is divided into three stages: first, building a cross compiler and its
    associated libraries; second, using this cross toolchain to build several utilities
    in a way that isolates them from the host distribution; and third, entering the
    chroot environment (which further improves host isolation) and constructing the
    remaining tools needed to build the final system.


    > Important: This is where the real work of building a new system begins. Be very
    careful to follow the instructions exactly as the book shows them. You should
    try to understand what each command does, and no matter how eager you are to finish
    your work, you should refrain from blindly typing the commands as should. Read
    the documentation when there is something you do not understand. Also, keep track
    of your typing and of the output of commands, using the tee utility to send the
    terminal output to a file. This makes debugging easier if something goes wrong.


    The next section is a technical introduction to the build process, while the following
    presents very important general instructions.


    # Toolchain Technical Notes


    This section explains some of the rationale and technical details behind the overall
    build method. Don''t try to immediately understand everything in this section.
    Most of this information will be clearer after performing an actual build. Come
    back and re-read this at any time during the build process.


    The overall goal of Chapter 5 and Chapter 6 is to produce a temporary area containing
    a set of tools that are known to be good, and are isolated from the host system.
    By using the chroot command, the compilations in the remaining chapters will be
    isolated within that environment, ensuring a clean, trouble-free build of the
    target LFS system. The build process has been designed to minimize the risks for
    new readers, and to provide the most educational value at the same time.


    This build is based on cross-compilation. Cross-compilation is normally used to
    build a compiler and its associated machine different from the one that is used
    for the build. This is not strictly necessary for LFS, since the machine where
    the new system will run is the same as the one used for the build. But cross-compilation
    has one great advantage: anything that is cross-compiled cannot depend on the
    host environment.


    # About Cross-Compilation


    > Note: The LFS book is not (and does not contain) a general tutorial to build
    a cross- (or native) toolchain. Don''t use the commands in the book for a cross-toolchain
    for some purpose other than building LFS, unless you really understand what you
    are doing.


    Cross-compilation involves some concepts that deserve a section of their own.
    Although this section may be omitted on a first reading, coming back to it later
    will help you get a fuller understanding of the process.


    Let us define some terms used in this context.'
  merge: -1
  img_proc: true
- pgno: 59
  md: "The build\nis the machine where we build programs. Note that this machine is\
    \ also referred to as the “host”.\n\nThe host\nis the machine/system where the\
    \ built programs will run. Note that this use of “host” is not the same as in\
    \ other\nsections.\n\nThe target\nis only used for compilers. It is the machine\
    \ compiler produces code for. It may be different from both the\nbuild and the\
    \ host.\n\nAs an example, let us imagine the following scenario (sometimes referred\
    \ to as “Canadian Cross”). We have a compiler\na a slow machine only, let's call\
    \ it A, and the compiler Aa. We also have a fast machine (B), but no compiler\n\
    for (B), and we want to produce code for a third, slow machine (C). We will build\
    \ a compiler for C in three\nstages.\n\n| Stage | Build | Host | Target | Action\
    \ |\n| 1 | A | A | B | Build cross-compiler cc1 using Aa on machine A. |\n| 2\
    \ | A | B | C | Build cross-compiler cc2 using cc1 on machine A. |\n| 3 | B |\
    \ C | C | Build compiler ccC using cc2 on machine B. |\n\nThen, all the programs\
    \ needed by machine C can be compiled using cc2 on the fast machine B. Note that\
    \ unless B can\n programs produced for C, there is no way to test the newly built\
    \ programs until machine C itself is running. For\nexample, to run a test suite\
    \ on ccC, we may want to add a fourth stage:\n\n| Stage | Build | Host | Target\
    \ | Action |\n| 4 | C | C | C | Rebuild and test ccC using ccC on machine C. |"
  merge: -1
  img_proc: true
- pgno: 60
  md: 'The example above, only cl1 and cc2 are cross-compilers, that are produced
    for a machine different from the one they are run on. The other compilers ccA
    and ccC produce code for the machine they are run on. Such compilers are called
    native compilers.


    # # Implementation of Cross-Compilation for LFS


    # Note


    All the cross-compiled packages in this book use an autoconf-based building system
    types in the cpu-vendor-kernel-os, referred to as the system triplet. The vendor
    field is often irrelevant, autoconf lets you omit it.


    An astute reader may wonder why a "triplet" refers to a four component name. The
    kernel field and the os field being a "system" field. A three-field format is
    still valid for some systems, and for example, x86_64-unknown-freebsd. Two systems
    can share the same kernel but are too different to use the same triplet to describe
    them. Android running on a mobile phone is completely different from Ubuntu running
    on an ARM64 server, even though they are both running on the same type of CPU
    (ARM64) and using the same kernel.


    Without an emulation layer, you cannot run an executable for a server on a mobile
    phone or vice versa. So the "system" field has been divided into kernel and os
    to designate these unambiguously. In our example, the Android system is designed
    aarch64-unknown-linux-android, and the Ubuntu system is designed aarch64-unknown-linux-gnu.


    The "triplet" remains embedded in the lexicon. A simple way to determine your
    triplet is to run the `config.guess` script that contains the source for many
    packages. Unpack the binaries, run the script `./config.guess`, and note the output.
    For a, for 32-bit Intel the processor will be i686-pc-linux-gnu. On a 64-bit system
    it will be x86_64-linux-gnu. On most Linux systems the even simpler `gcc-dumpamble`
    command will give you some information.


    You should also be aware of the name of the platform''s dynamic linker, often
    referred to as the dynamic loader (not to be confused with the standard library
    ld that is part of binutils). The dynamic linker provided by package glibc finds
    and loads the shared libraries needed by a program, to run, and then runs it.
    The name of the dynamic linker for a 32-bit Intel machine is `ld-linux.so.2`;
    or `ld-linux-x86-64.so.2` on 64-bit systems. A sure-fire way to verify the name
    of the dynamic linker is to inspect a random binary from the host system by running:
    `readelf -d name of binary | grep interpreter` and noting the output. The authoritative
    reference covering all platforms is the `shlib-versions` file in the root of the
    glibc source tree.


    In order to make a cross-compilation in LFS, the name of the host triplet is slightly
    adjusted by changing the "vendor" field in the LFS_TGT variable so it says "If".
    We use the `--sysroot` option when building the cross-compiler, to tell where
    to find the host files. This ensures that none of the other programs built in
    Chapter 6 can link to libraries on the host build. Two stages are mandatory, but
    run one more for tests.


    | Stage | Build | Host | Target | Action |

    | --- | --- | --- | --- | --- |

    | 1 | pc | pc | Lfs | Build-cross-compiler cc1 cc-pc on pc. |'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# Linux From Scratch - Version 12.1


    | Stage | Build | Host | Target | Action |

    | 2 | pc | Lfs | Lfs | Build compiler using cc1 on pc. |

    | 3 | Lfs | Lfs | Lfs | Rebuild and test cc-lfs using cc-lfs. |


    In the preceding table, "on pc" means the commands are run on a machine using
    the already installed distribution. "On Lfs" means commands are run in a chrooted
    environment.


    This is not the end of the story. The C is not merely a compiler; it also defines
    a standard library. In the book, the GNU library, named glibc, is used (there
    is an alternative, "must\”). This library must be compiled for the LFS machine;
    that is, using the cross-compiler cc1. But the compiler itself uses an internal
    library providing complex subroutines for functions not available in the assembler
    instruction set. This internal library is named glibc, and it must be linked to
    the library to be fully functional. Furthermore, the standard library for C++
    (libstdc++) must be linked with glibc. The solution to this chicken and egg problem
    is to build a degraded cc-based glibc, linking some functionalities such as threads
    and exception handling, and then building using this degraded compiler (gl is
    not degraded), and also to build libstdc++. This last library will lock some of
    the functionality of glibc.


    The upshot of the preceding paragraph is that cc1 is unable to build a fully functional
    libstdc++ with the degraded glibc, but cc1 is the only compiler available for
    building the C/C++ libraries during stage 2. There are two reasons why we can''t
    immediately use the compiler in stage 2, cc-lfs, to build those libraries.


    +   - Generally speaking, cc-lfs run on pc (the host system). Even though the
    triplets for pc and lfs are compatible with each other, an executable for lfs
    must depend on glibc-2.39; the host distro may use either a different implementation
    of libc (for example, must), or a newer release of glibc (for example, glibc-2.13).

    - Even if cc-lfs can run on pc, using it on pc would create a risk of linking
    to the pc libraries, since cc-lfs is a native compiler.


    So when we build stage 2, we instruct the system to rebuild glibc and libstdc++
    with cc1, we will link libstdc++ to the rebuilt glibc of the old, degraded. This
    makes the rebuilt libstdc++ fully functional.

    In Chapter 8 (or "stage 3"), all the packages for the LFS system are built. Even
    if a package has already been installed into the LFS system in a previous chapter,
    we will rebuild it. The main reason for rebuilding packages is to make them stable:
    if we reinstall LFS on a completed LFS system, the reinstated content of the package
    should be the same content of the package when first installed in Chapter 8. The
    temporary packages installed in Chapter 6 or Chapter 7 cannot satisfy this requirement,
    because some of them are built without optional dependencies, and autofocus cannot
    perform some feature checks in Chapter 6 because of cross-compilation, causing
    the temporary packages to lack optimal features, or use suboptimal code routines.
    A major reason for rebuilding packages is to run the test suites.


    # Other Procedural Details


    The cross-compiler will be installed in a $LFS/tools directory, which it will
    not be part of the final system.'
