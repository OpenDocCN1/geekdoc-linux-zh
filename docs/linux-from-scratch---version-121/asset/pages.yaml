  md: "--disable-stripping\nThis prevents the building system from using the strip\
    \ program from the host. Using host tools on cross-\ncompiled programs can cause\
    \ failure.\n\n--enable-wide\nThis switch causes wide-character libraries (e.g.,\
    \ libncurses.so.6.4-20230520) to be built instead of normal ones\n(e.g., libncurses.so.6.4-20230520).\
    \ These wide-character libraries are usable in both multibyte and traditional\n\
    8-bit locales, while normal libraries work only in 8-bit locales. Wide-character\
    \ and normal libraries are\nsource-compatible, but not binary-compatible.\n\n\
    Compile the package:\n\n```\nmake\n```\n\nInstall the package:\n\n```\nmake DESTDIR=$TIC_PATH=$(pwd)/build/progs/tic\
    \ install\n-ln -sv libncurses.so $LFS/usr/lib/libncurses.so\nsed -e 's/\"/\\*XOPEN.*/$/#\
    \ h 1/'\n-i $LFS/usr/include/curses.h\n```\n\nThe meaning of the install options:\n\
    \nTIC_PATH=$(pwd)/build/progs/tic\nWe need to pass the path of the newly built\
    \ tic program that runs on the building machine, so the terminal database\n be\
    \ created without errors.\n\nIn -sv libncurses.so $LFS/usr/lib/libncurses.so\n\
    \nThe libncurses.so library is needed by a few packages we will build soon. We\
    \ create this symlink to use\nlibncurses.so as a replacement.\n\nThe header file\
    \ curses.h contains the definition of various Ncurses data structures. With different\
    \ preprocessor\nmacro definitions two different sets of the data structure definition\
    \ may be used: the 8-bit definition is compatible\nwith libncurses.so and the\
    \ wide-character definition is compatible with libncurses.so. Since we are using\n\
    libncurses.so as a replacement of libncurses.so, edit the header file so it will\
    \ always use the wide-character\ndata structure definition compatible with libncurses.so.\n\
    \nDetails on this package are located in Section 8.29.2, \"Contents of Ncurses\""
