  md: "# 8.5.2. Configuring Glibc\n\n# 8.5.2.1. Adding nsswitch.conf\n\nThe /etc/nsswitch.conf\
    \ file needs to be created because the Glibc defaults do not work well in a networked\
    \ environment.\n\nCreate a new file /etc/nsswitch.conf by running the following:\n\
    \n```\ncat > /etc/nsswitch.conf << \"EOF\"\n# Begin /etc/nsswitch.conf\n\npasswd:\
    \ files\ngroup: files\nshadow: files\n\nhosts: files dns\nnetworks: files\n\n\
    protocols: files\nservices: files\nithers: files\nrpc: files\n\n# End /etc/nsswitch.conf\n\
    EOF\n```\n\n# 8.5.2.2. Adding Time Zone Data\n\nInstall and set up the time zone\
    \ data with ../tzdata2024a.tar.gz\n\n```\ntar -xf ../tzdata2024a.tar.gz\n```\n\
    \n```\nZONEINFO=/usr/share/zoneinfo\nmkdir -p $ZONEINFO/(posix,right)\nfor tz\
    \ in etcetera southamerica northamerica europe africa antarctica \\\n    asia\
    \ australralia backward; do\n    zic -L /dev/null -d $ZONEINFO $(tz)\n    zic\
    \ -L /dev/null -d $ZONEINFO/posix $(tz)\n    zic -L leapseconds -d $ZONEINFO/right\
    \ $(tz)\ndone\n```\n\n```\ncp -v zone.time.tab iso3166.tab $ZONEINFO\nzic -d $ZONEINFO\
    \ -p America/New_York\nunset ZONEINFO\n```\n\nThe meaning of the zic commands:\n\
    \n+   zic -L /dev/null\nThis creates time zones without any leap seconds. It is\
    \ conventional to put these in both zoneinfo and zoneinfo/posix. It is necessary\
    \ to put the POSIX time zones in zoneinfo, whereas various test suites will report\
    \ errors. On an embedded system, where space is tight and you do not intend to\
    \ update the time zones, you could save 1.9 MB by using the posix directory, but\
    \ some applications or test suites might produce some failures.\n\n+   zic -L\
    \ leapseconds\nThis creates time zones, including leap seconds. On an embedded\
    \ system, where space is tight and you do not intend to update the time, or about\
    \ the correct time, you could save 1.9MB by omitting the right directory."
  merge: -1
