  md: "# 8.19. Binutils-2.42\n\nThe Binutils package contains a linker, an assembler,\
    \ and other tools for handling object files.\n\n**Approximate build time:** 2.2\
    \ SBU\nRequired disk space: 2.7 GB\n\n# 8.19.1. Installation of Binutils\n\nThe\
    \ Binutils documentation recommends building Binutils in a dedicated directory:\n\
    \n```\nmkdir -v build\ncd build\n```\n\nPrepare Binutils for compilation:\n\n\
    ```\n../configure --prefix=/usr \\\n  --sysconfdir=/etc \\\n  --enable-ld-default\
    \ \\\n  --enable-plugins \\\n  --enable-shared \\\n  --disable-weccor \\\n  --enable-64-bit-bfd\
    \ \\\n  --with-system-zlib \\\n  --enable-default-hash-style=gnu\n```\n\nThe meaning\
    \ of the new configure parameters:\n\n+   -enable-gold: Build the gold linker\
    \ and install it as ld.gold (alongside the default linker).\n\n+   -enable-ld-default:\
    \ Build the original bfd linker and install it as both ld (the default linker)\
    \ and ld.bfd.\n\n+   -enable-plugins: Enables plugin support for the linker.\n\
    \n+   -with-system-zlib: Use the installed zlib library instead of building the\
    \ included version.\n\nCompile the package:\n\n```\nmake todir=/usr\n```\n\nThe\
    \ meaning of the make parameter:\n\n```\ntoldir=/usr\n```\n\nNormally, the todir\
    \ (the directory where the executables will ultimately be located) is set to $(exec_prefix)/$(target_alias).\
    \ This would expand to $(target_alias). For example, x86_64 directories in /usr\
    \ is not required. Because this is a custom system, this target-specific directory\
    \ in /usr is used. $(exec_prefix)/$(target_alias) would be used if the system\
    \ were used to cross-compile (for example, compiling a package on an Intel machine\
    \ that generates code that can be executed on PowerPC machines).\n\n> **Important**\
    \ The test suite for Binutils in this section is considered critical. Do not skip\
    \ it under any circumstances."
