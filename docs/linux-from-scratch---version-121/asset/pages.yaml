- pgno: 38
  md: '# Note


    One way to ensure that the LFS variable is always set to edit the .bash_profile
    file in both your home directory and in /root/.bash_profile and enter the export
    command above. In addition, the specified in the /etc/passwd file for all users
    that need the LFS variable must be bash to ensure that the /root/.bash_profile
    file is incorporated as part of the login process.


    Another consideration is the method that is to log into the host system. If logging
    through a graphical display manager, the user''s .bash_profile is not normally
    used when a virtual terminal is. In this case, add the command to .bashrc file
    for the user and the root. In addition, some distributions use an "if" test, and
    not out the remaining .bashrc instructions for a non-interactive invocation. Be
    sure to place the export command ahead of the test for non-interactive


    # 2.7. Mounting the New Partition


    Now that a file system has been created, the partition must be mounted so the
    host system can access it. This book assumes that the file system is mounted at
    the directory which the LFS environment variable described in the previous section.


    Strictly speaking, one cannot "mount a partition." One mounts the file system
    embedded in that partition. But since a single partition cannot contain more than
    one file system, people often speak of the partition and the associated file system
    as if they were one and the same.


    Create the mount point and mount the LFS file system with these commands:


    ```

    mkdir -pv $LFS

    mount -v -t ext4 /dev/<xxx> $LFS

    ```


    Replace <xxx> with the name of the LFS partition.


    If you are using multiple partitions for LFS (e.g., one for / and another for
    /home), mount them like:


    ```

    mkdir -pv $LFS

    mount -v -t ext4 /dev/<xxx> $LFS

    mkdir -v $LFS/home

    mount -v -t ext4 /dev/<yyy> $LFS/home

    ```


    Replace <xxx> and <yyy> with the appropriate partition names.


    Ensure that your file system is not mounted with permissions that are too restrictive
    (such as the nosuid or nodedev options). Run the mount command without any parameters
    to see what options are set for the LFS partition. If nosuid or nodedev are set,
    the partition must be remounted.


    > The above instructions assume that you will not restart your computer throughout
    the LFS process. If you shut down your system, you will need to remount the LFS
    partition each time you restart the build process, or modify the host system''s
    /etc/fstab file to automatically remount it when you reboot. For example, you
    might add this line to your /etc/fstab file:


    | /dev/<xxx> | /mnt/lfs ext4 | defaults | 1 | 1 |


    If you use additional options, be sure to add them also.'
