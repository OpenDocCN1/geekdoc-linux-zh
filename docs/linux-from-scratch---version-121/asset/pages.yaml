- pgno: 96
  md: '# The meaning of the build-root configure options:


    --with-build-sysroot=$LFS

    Normally, --boost ensures that a cross-compiler is used for building GCC, and
    that compiler knows that it has to look for headers and libraries in $LFS. But
    the build system for GCC uses other tools, which are not aware of its location.
    This switch is needed for those files in $LFS, and not on the host.


    --target=$LFS_TARGET

    We are cross compiling GCC, so it''s impossible to build target libraries (libgcc
    and libstdc++) with the previously compiled GCC binaries—those binaries won''t
    run on the host. The GCC build system will attempt to use the host''s C and C++
    compilers as a workaround by default. Building the GCC target libraries with a
    different version of GCC is not supported, so using the host''s compilers may
    cause the build to fail. This parameter ensures the libraries are built by GCC
    pass 1.


    --CFLAGS_FOR_TARGET=...

    Allow libstdc++ to use the shared libgcc being built in this pass, instead of
    the static version that was built in GCC pass 1. This is necessary to support
    C++ exception handling.


    --disable-sanitizer

    Disable GCC sanitizer runtime libraries. They are not needed for the temporary
    installation. This switch is necessary to build GCC without libcrypt installed
    for the target. In gcc-pass1 it was implied by --disable-libstdcxx, but now we
    have to explicitly pass it.


    # Compile the package:


    ```

    make

    ```


    Install the package:


    ```

    make DESTDIR=$LFS install

    ```


    As a finishing touch, create a utility symlink. Many programs and scripts run
    ce instead of gcc, which is used to keep programs generic and therefore usable
    on all kinds of UNIX systems where the GNU C compiler is not always installed.
    Running ce leaves the system administrator to decide which C compiler to install:


    ```

    ln -sv gcc $LFS/usr/bin/cc

    ```


    Details on this package are located in Section 8.28.2, "Contents of GCC."'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# # Chapter 7. Entering Chroot and Building Additional Temporary Tools


    # ## 7.1. Introduction


    For proper operation of the isolated environment, some communication with the
    running kernel must be established. This is done via the so-called Virtual Kernel
    File Systems, which will be mounted before the chroot environment. You may want
    to verify that they are mounted using the **findmnt** command.


    Until Section 7.4, "Entering The Ch Environment", the commands must be run as
    `root`, with the `LFS` variable set. After entering chroot, all commands are run
    as `root`, fortunately without access to the OS of the computer you built LFS.
    On by careful, it is easy to destroy the LFS system with bad commands.


    # ## 7.2. Changing Ownership


    > > Note

    The commands in the remedy must be performed while logged in user `root` and no
    longer as user `lfs`. Also, double check that `$LFS` is set in `root`''s environment.


    Currently, the whole directory `LFS` is owned by the `lfs`, a user that exists
    only on the host system. If the directories and files under `$LFS` are kept as
    they are, they will be owned by a user ID without a corresponding account. This
    is dangerous because a user account created later could get this same user ID
    and own all the files under `LFS`, exposing these files to potential malicious
    anguish.


    To address this issue, change the ownership of the `$LFS/` directories to user
    `root` by running the following command:


    ```

    chown -R root:root $LFS/{usr,lib,var,etc,bin,sbin,tools}

    case $(uname -m) in

    x86_64) chown -R root:root $LFS/lib64 ;;

    esac

    ```


    # ## 7.3. Preparing Virtual Kernel File Systems


    Applications running users utilize various file systems created by the kernel
    to communicate with the kernel itself. These file systems are virtual: no disk
    space is used for them. The file systems must be mounted in the `$LFS` directory
    tree so the applications can find them in the chroot environment.


    Begin creating the directories on which these virtual file systems will be mounted:


    ```

    mkdir -pv $LFS/{dev,proc,sys,run}

    ```


    # ## 7.3.1. Mounting and Populating /dev


    During a normal boot of an LFS system, the kernel automatically mounts the `devtmpfs`
    file system on the `/dev` directory; the kernel creates device nodes on that virtual
    file system during the boot process, or when a device is first accessed or accessed.
    The udev daemon may change the ownership or permissions of the device nodes created
    by the kernel,'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Linux From Scratch - Version 12.1


    and create new device nodes or symlinks, to ensure the work of device maintainers
    and system administrators. Section 9.3.2.2, "Device Creation" for details.) If
    the host supports devtmpfs, we can simply mount a devtmpfs at $LFS/dev and rely
    on the kernel to populate it.


    But some kernels lack devtmpfs support; these use different methods to create
    the content of /dev. The only-agnostic way to populate the $LFS/dev directory
    is by bind mount the host system''s /dev directory. A bind mount is a type of
    mount that makes a subdirectory or a file visible at another location. Use the
    following command to do this.


    ```

    mount -v --bind dev $LFS/dev

    ```


    # 7.3.2. Virtual Kernel File Systems


    Now mount the remaining virtual file systems:


    ```

    mount -vt devtmpfs -o gid=5,mode=0620 $LFS/dev

    mount -vt proc proc $LFS/proc

    mount -vt sysfs sysfs $LFS/sys

    mount -vt tmpfs tmpfs $LFS/run

    ```


    The meaning of the following options for:


    ```

    gid=5

    ```


    This ensures that devtmpfs-created device nodes are owned by group ID 5. This
    is the ID we use later on for the tty group. We use the group instead of a name,
    since the host system might use a different ID for its tty group.


    ```

    mode=0620

    ```


    This ensures that devtmpfs created device nodes have mode 0620 (user readable
    and writable, group writable). Together with the option above, this ensures that
    devfs create device nodes that meet the requirements of grantpt(); mounting the
    Glibc p_chown helper (which is not installed) is not necessary.


    In some systems, /dev/shm is a symbolic link to a directory. Typically /run/tmpfs.
    The /run tmpfs was mounted above so. In other systems, /dev/shm is a mount point
    for tmpfs. In the case of /dev above we will create /dev/shm as a directory in
    the chroot environment. In this situation we must explicitly mount a tmpfs:


    ```

    if [ -h $LFS/dev/shm ]; then

    install -v d -m 1777 $LFS($realpath)

    else

    mount -vt tmpfs -o nosuid,node tmpfs $LFS/dev/shm

    fi

    ```


    # 7.4. Entering the Chroot Environment


    Now that all the packages which are required to build the rest of the needed tools
    are on, it is time to enter the chroot environment and install the temporary tools.
    This environment will also be used to install the final system. As user root,
    run the following command to ensure the environment is, at the moment, populated
    with nothing but tools:


    ```

    chroot "$LFS /usr/bin/env -i / \

    HOME=$root / \

    TERM="$TERM" u:\\$ / \

    PS1="(ls chroot) \$" / \

    PATH=/usr/bin:/usr/sbin / \

    MAKEFILE="-j$(nproc)" / \

    TESTSUFLAGS="-j$(nproc)" / \

    /bin/bash --login

    ```


    80'
  merge: -1
