  md: 'x can be any number in the range 16-31. y can be any number in the range 0-255.


    A valid IP address could be 192.168.1.1.


    If the computer is to be visible to the Internet, a valid FQDN can be the domain
    name itself, or a string resulted by concatenating a prefix (the hostname) and
