  md: "```\n################################################################\n# pidofproc()\n\
    # Usage: pidofproc [-p pidfile] pathname\n#n# Purpose: This function returns one\
    \ or more pid(s) for a particular daemon\n# Inputs: -p pidfile, use the specified\
