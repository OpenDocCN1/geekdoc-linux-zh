- pgno: 17
  md: 'This format is used when creating configuration files. The first command tells
    the system to create the file $LFS/etc/ group from whatever is typed on the following
    lines until the sequence End Of File (EOF) is encountered. Therefore, this entire
    section is generally typed as seen.


    ```

    <REPLACED TEXT>

    ```


    This format is used to encapsulate text that is not to be seen or for copy-and-paste
    operations.


    ```

    [OPTIONAL TEXT]

    ```


    This format is used to encapsulate text that is optional.


    passwd(5)


    This format is used to refer to a specific manual (man) page. The number inside
    parentheses indicates a specific section inside the manuals. For example


    # # Structure


    This book is divided into the following parts.


    # # Part I - Introduction


    Part I explains some important notes on how to proceed with the LFS installation.
    This section also provides meta information about the book.


    # # Part II - Preparing for the Build


    Part II describes how to prepare for the building process—making a partition,
    downloading the packages, and compiling temporary tools.


    # # Part III - Building the LFS Cross Toolchain and Temporary Tools


    Part III provides instructions for building the tools needed for constructing
    the final LFS system.


    # # Part IV - Building the LFS System


    Part IV guides the reader through the building of the LFS system—compiling and
    installing all the packages by one, setting up the boot scripts, and installing
    the kernel. The resulting Linux system is the foundation on which other software
    can be built to expand the system as desired. At the end of this book, there is
    an easy to use reference listing all of the programs, libraries, and important
    files that have been installed.


    # # Part V - Appendices


    Part V provides information about the book itself including acronyms and terms,
    acknowledgments, package dependencies, a listing of LFS boot scripts, licenses
    for the distribution of the book, and a comprehensive index of packages, programs,
    libraries, and scripts.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Errata and Security Advisories


    The software used to create an LFS system is constantly updated and enhanced.
    Security warnings and bug fixes may become available after the LFS book has been
    released. To check whether the package versions or instructions in this release
    of LFS need any modifications—to repair security vulnerabilities or to fix other
    bugs—please visit https://www.linuxfromscratch.org/lfs/errata/12.1/ before proceeding
    with your build. You should note any changes shown and apply them to the relevant
    sections of the book as you build the LFS system.


    In addition, the Linux From Scratch editors maintain a list of security vulnerabilities
    discovered after a book has been released. To read the list, visit https://www.linuxfromscratch.org/lfs/advisories/
    before proceeding with your build. You should apply the changes suggested by the
    advisories to the relevant sections of the book as you build the LFS system. And,
    if you will use the LFS system as a real desktop or server system, you should
    continue to consult the advisories and fix any security vulnerabilities, even
    when the LFS system has been completely constructed.'
