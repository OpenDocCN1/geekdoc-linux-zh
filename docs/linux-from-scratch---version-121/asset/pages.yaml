- pgno: 101
  md: 'Create the /etc/passwd file by running the following command:


    ```

    cat > /etc/passwd << "EOP"

    root:x:0:root:/bin/bash

    bin:x:1:bin:/dev/null:/usr/bin/false

    demon:x:6:Daemon User:/dev/null:/usr/bin/false

    messagebus:x:18::Message Daemon:/run/dbus:/usr/bin/false

    uidd:x:80:: #UUID Generation Daemon:/dev/null:/usr/bin/false

    bobody:x:65534:65534:Unprivileged User:/dev/null:/usr/bin/false

    EOP

    ```


    The actual password for **root** will be set later.


    ```

    cat > /etc/group << "EOP"

    root:x:0:

    bin:x:1:daemon

    sys:x:2:

    kmem:x:3:

    tape:x:4:

    tty:x:5:

    demon:x:6:

    floppy:x:7:

    disk:x:8:

    lpl:x:9:

    dialout:x:10:

    audio:x:11:

    video:x:12:

    utmp:x:13:

    cdrom:x:15:

    adm:x:16:

    messagebus:x:18:

    input:x:24:

    mail:x:34:

    kvm:x:61:

    uuid:x:80:

    wheel:x:97:

    users:x:999

    group:x:65534:

    EOP

    ```


    The created groups are not part of any standard—they are groups decided on in
    part by the development of Udev configuration in Chapter 9, and in part by many
    conventions employed by Linux distributions. In some cases these systems rely
    only on specific users or groups. The Linux Standard Base (LSB, at https://refspecs.linuxfoundation.org/lsb.html)
    only recommends that, besides the group **root** with a Group ID (GID) of 0, a
    group **bin** with GID of 1 be given. The GID of 5 is used for the tty group,
    and the number 5 is also used in /etc/stab for the devpts filesystem. All other
    group GNames and GIDs can be chosen freely by the system administrator who writes
    programs that do not depend on GID numbers, but rather the user''s group.


    The ID 65534 is used by the kernel for NFS and serve user namespaces for unmapped
    users and groups (those exists but “do not exist” on the local machine or in the
    server namespace). We assign **nobody** and **nogroup** to avoid an unnamed ID.
    But others may treat this ID differently, so any portable program should not depend
    on this assignment.


    Some tests in Chapter 8 require a regular user. We add this user here and delete
    this account at the end of that chapter.


    ```

    echo "tester:x:101::home/tester:/bin/bash" >> /etc/passwd

    echo "tester:x:101:" >> /etc/group

    install -o tester -d /home/tester

    ```'
