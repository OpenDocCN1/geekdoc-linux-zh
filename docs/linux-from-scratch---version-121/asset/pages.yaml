- pgno: 54
  md: "# Linux From Scratch - Version 12.1\n\nCONFIG_SITE=$LFS/share/config.site\n\
    In Chapter 5 and Chapter 6, if this variable is not set, configure scripts may\
    \ attempt to load configuration items specific to some distributions from /usr/share/config.site\
    \ on the host system. Overwrite it to prevent potential contamination from the\
    \ host.\n\nexport ...\nWhile the preceding commands have set some variables, in\
    \ order to make them visible within any sub-shells, we\nexport them.\n\n![](img/3dbc5668c4490cb993bba10b75fc49f3_54_0.png)\n\
    \n# Important\n\nSeveral commercial distributions add an undocumented instantiation\
    \ of /etc/bash.bashrc to the initialization\nof bash. This file has the potential\
    \ to modify the bash user's environment in ways that can affect the building\n\
    of critical LFS packages. To make sure the lfs user's environment is clean, check\
    \ for the presence of /etc/bash.bashrc and, if present, move it out of the way.\
    \ As the root user:\n\n```\n [ -e /etc/bash.bashrc ] && mv -v /etc/bash.bashrc\
    \ /etc/bash.bashrc.NOUSE \n```\n\nIf the user is no longer needed (at the beginning\
    \ of Chapter 7), you may safely restore /etc/bash.bashrc (if desired).\nNote that\
    \ the LFS package we build in Section 8.35, “Bash-5.2.21” is not configured to\
    \ load execute /etc/bash.bashrc, so this file exists on a completed LFS system.\n\
    \nFor many systems with multiple processors (or) the compilation time for a package\
    \ can be reduced by\nperforming a “parallel make” by telling the program how many\
    \ processors are available via a command line\noption or an environment variable.\
    \ For instance, an Intel i9-13900K processor has 8 P (performance) cores and 16\
    \ E (efficiency) cores, and a P core can simultaneously run two threads so P core\
    \ are modeled as two logical cores by the Linux kernel. As a result there are\
    \ 32 logical cores. One way to use all these logical cores is allowingmaking to\
    \ spawn up to 32 build jobs. This can be done by passing the -j32 option to make:\n\
    \n```\nmake\n```\n\nOr set the MAKEFLAGS environment variable and its content\
    \ will be automatically updated by make as command line options:\n\n```\nexport\
    \ MAKEFLAGS=-j32\n```\n\n![](img/3dbc5668c4490cb993bba10b75fc49f3_54_1.png)\n\n\
    # Important\n\nNever pass a -j option to a number to make or set such an option\
    \ in MAKEFLAGS. Doing so will allow make to spawn infinite build jobs and cause\
    \ system stability problems.\n\nUse all logical cores available for building packages\
    \ in Chapter 5 and Chapter 6, set MAKEFLAGS now in .bashrc:\n\n```\ncat >> ~/.bashrc\
    \ << \"EOF\"\nexport MAKEFLAGS=$j$(nproc)\nEOF\n```\n\nReplace $(nproc) with the\
    \ number of logical cores you want to use if you don't want to use all the logical\
    \ cores.\n\nFinally, to ensure the environment is fully prepared for building\
    \ the temporary tools, force the bash to read the new user profile:\n\n```\nsource\
    \ ~/.bash_profile\n```"
