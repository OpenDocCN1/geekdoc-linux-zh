    map (appropriate in the USA), set this variable to lat16 -m 8859-1. In UTF-8 mode,
    the kernel uses the application character map to convert 8-bit key codes to UTF-8.
    Therefore the argument of the "-m" parameter should be the encoding of the composed
    keys in the keymap.


    # UNICODE


    Set this variable to 1, yes, or true in order to put the console into UTF-8 mode.
    This is useful in UTF-8 locales and harmful otherwise.


    # LEGACY_CHARSET


    For many keyboard layouts, there is no stock Unicode keymap in the Kbd package.
    The console bootsplash convert an available keymap to UTF-8 on the fly if this
    variable is set to the encoding of the non-UTF-8 keymap.


