    # Rationale for Packages in the Book


    The goal of LFS is to build a complete and usable foundation-level system—including
    all the packages needed to replicate itself—and providing a relatively minimal
    base from to customize a more complete system based on the user''s choices. This
    does not mean that LFS is the smallest system possible. Several packages are included
    that are not, strictly speaking, required. The list below documents the reasons
    each package in the book has been included.


    +   * Acl


    This package contains utilities to administer Access Control Lists, which are
    used to define fine-grained discretionary rights for files and directories.


    +   * Attr


    This package contains programs for managing extended attributes on file system
    objects.


    +   * Autoconf


    This package supplies programs for producing shell scripts that can automatically
    configure source code from a developer''s template. It is often needed to rebuild
    a package after the build procedure has been updated.


    +   * Bash


    This package contains programs for generating Make files from a template. It is
    often needed to rebuild a package after the build procedure has been updated.


    xi'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Linux From Scratch - Version 12.1


    This package satisfies LSB core requirement to provide a Bourne Shell interface
    to the system. It was chosen over other shell packages because of its common usage
    and extensive capabilities.


    +   - Bc


    This package provides an arbitrary precision numeric processing language. It satisfies
    a requirement for building the Linux kernel.


    +   - Binutils


    This package supplies a linker, an assembler, and other tools for handling object
    files. The programs in this package are needed to compile most of the packages
    in a LFS system.


    +   - Bison


    This package contains the GNU version of yacc (Yet Another Compiler Compiler)
    needed to build several of the LFS programs.


    +   - Bzip2


    This package contains programs for compressing and decompressing files. It is
    required to decrypt many LFS packages.


    +   - Check


    This package provides a test harness for other programs.


    +   - Coreutils


    This package contains a number of essential programs for viewing and manipulating
    files and directories. These programs are needed for command line file management,
    and are necessary for the installation procedures of every package in LFS.


    +   - DejaGNU


    This package supplies a framework for testing other programs.


    +   - Diffutils


    This package contains programs that show the differences between files or directories.
    These programs can be used to create patches, and are also used in many packages''
    build scripts.


    +   - E2fsprogs


    This package supplies utilities for handling the ext2, ext3 and ext4 file systems.
    These are the most common and thoroughly tested file systems that Linux supports.


    +   - Expat


    This package yields a relatively small XML parsing library. It is required by
    the XML::Parser Perl module.


    +   - Expect


    This package contains a program for carrying out scripted dialogues with other
    interactive programs. It is commonly used for testing other packages.


    +   - File


    This package contains a utility for determining the type of a given file or files.
    A few packages need it in their build scripts.


    +   - Findutils'
