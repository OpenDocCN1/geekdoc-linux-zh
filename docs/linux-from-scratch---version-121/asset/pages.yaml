- pgno: 234
  md: "# 8.75. Udev from Systemd-255\n\nThe Udev package contains programs for dynamic\
    \ creation of device nodes.\n\n**Approximate build time:** 0.2 SBU\n**Required\
    \ disk space:** 144 MB\n\n# 8.75.1. Installation of Udev\n\nUdev is part of the\
    \ systemd-255 package. Use the systemd-255.tar.xz as the source tarball.\n\nRemove\
    \ two unused groups, `render` and `sgx`, from the default udev rules:\n\n```\n\
    sed -i -e 's/GROUP=\"render\"/GROUP=\"video\"/\\'\n-e 's/GROUP=\"sgx\"//' rules/50-udev-default.rules\n\
    ```\n\nRemove one udev rule requiring a full Systemd installation:\n\n```\nsed\
    \ '/systemd-sysctl1/s///' rules/99-systemd.rules\n```\n\nAdjust the hardcoded\
    \ paths to network configuration files for the standalone installation:\n\n```\n\
    sed '//NETWORK_DIRS/s/systemd/udev/\\1' -i src/basic/path-lookup.h\n```\n\nPrepare\
    \ Udev for compilation:\n\n```\nmkdir -p build\ncd build\n\nmeson setup \\\n \
    \ --prefix=/usr \\\n  --buildtype=release \\\n  --Dmode=release \\\n  --Ddev-kvm-mode=0660\
    \ \\\n  -Dlink-udev-shared=false \\\n  -Dlogind=false \\\n  -Dvconsole=false\n\
    ```\n\nThe meaning of the meson options:\n\n+   --buildtype=release\nThis switch\
    \ overrides the default buildtype (\"debug\\), which produces unoptimized binaries.\n\
    \n+   --Dmode=release\nDisable some features considered experimental by upstream.\n\
    \n+   --Ddev-kvm-mode=0660\nThe default udev rule would allow all users to access\
    \ /dev/kvm. The editors consider it dangerous. This option overrides it.\n\n+\
    \   --Dlink-udev-shared=false\nThis option prevents udev from linking to the internal\
    \ systemd shared library, `libsystemd-shared`. This library is designed to be\
    \ shared by many Systemd components and it's too overkill for a only installation.\n\
    \n+   --Dlogind=false -Dvconsole=false\nThese options prevent the generation of\
    \ several udev rule files belonging to the other Systemd components that we won't\
    \ install."
  merge: -1
  img_proc: true
- pgno: 235
  md: "# Linux From Scratch - Version 12.1\n\nGet the list of shipped helpers and\
    \ save it into an environment variable (exporting is not strictly necessary, but\
    \ it makes it as a regular user or using a package manager easier):\n\n```\nexport\
    \ udev_helpers=$(grep \"name\" :\" \"/src/udev/meson.build | \\\n  awk 'print\
    \ $3' | tr -d '\"' | grep -v 'udevadm')\n```\n\nOnly build the components needed\
    \ for udev:\n\n```\nninja udevadm system-hwdb \\\n  $(grep -n -Eo '(src/lib)?udev.rules.d/[^/]*[\\\
    \\]*') \\\n  $(realpath libudev.so --relative-to .) \\\n  $udev_helpers\n```\n\
    \nInstall the package:\n\n```\ninstall -vm75 -d /usr/lib,/etc/udev/[udev,hwdb.d,network\
    \ \\\ninstall -vm75 -d /usr/lib,/share/pkgconfig \\\ninstall -vm75 udevadm /usr/bin/\n\
    install -vm75 system-hwdb /usr/bin/udev-hwdb \\\ninstall -xvrn ./bin/udev /usr/sbin/udev\
    \ \\\ninstall -cp -av libudev.so* /usr/lib/\ninstall -vm664 .../src/udev/libudev.h\
    \ /usr/include/\ninstall -vm664 src/libudev.* /usr/lib/pkgconfig \\\ninstall -vm664\
    \ src/udev/*.conf /usr/share/pkgconfig/\ninstall -vm664 udev.conf /etc/udev/\n\
    install -vm664 rules.d/* /../rules.d/README /usr/lib/udev/rules.d/\ninstall -vm664\
    \ $(find . -name \"power-switch*\") /usr/lib/udev/rules.d/\ninstall -vm664 hwdb.d/*\
    \ /../hwdb.d/README /usr/lib/udev/hwdb/\ninstall -vm755 $udev_helpers /usr/lib/udev\n\
    install -vm664 ../network/99-default.link /usr/lib/network\n```\n\nInstall some\
    \ custom rules and use files in an LFS environment:\n\n```\ntar -xf .../systemd-man-pages-255.tar.xz\
    \ \\\n  --no-owner --strip-components=1 \\\n  -C /usr/share/man --wildcards '*udev*'\
    \ '*systemd.link.5 \\\n  '*udev*' '*systemd.link.5\n```\n\nInstall the man pages:\n\
    \n```\ntar -xf .../systemd-man-pages-255.tar.xz\nmake -f udev-lfs-20230818/Makefile.install\
    \ install\n```\n\n```\nsed 's/systemd/network|udev/network|' /usr/share/man/man5/systemd.link.5\
    \ \\\n  > /usr/share/man/man5/udev.link.5\n```\n\n```\nsed 's/systemd/\\\\(.*?\\\
    \\)/ /usr/share/man/man8/systemd-hwdb.8 \\\n  > /usr/share/man/man8/udev-hwdb.8\n\
    ```\n\n```\nsed 's/.lib|udev shin/udev|' \\\n  /usr/share/man/man8/systemd-udev.service.8\
    \ \\\n  > /usr/share/man/man8/udev.8\n```\n\n```\nrm /usr/share/man/man*system*\n\
    ```\n\nFinally, unset the udev_helpers:\n\n```\nunset udev_helpers\n```"
  merge: -1
  img_proc: true
- pgno: 236
  md: '#  8.75.2. Configuring Udev


    Information about hardware devices is maintained in the /etc/udev/hwdb.d and /usr/lib/udev/hwdb.d
    directories. Udev needs that information to be compiled into a binary database
    /etc/udev/hwdb.bin. Create the initial database:


    ```

    udev-hwdb update

    ```


    This command needs be run each time the hardware information is updated.


    # 8.75.3. Contents of Udev


    +   **Installed programs:** udevadm (symlink to udevadm), and udev-hwdb

    **Installed libraries:** libudev.so

    **Installed directories:** /etc/udev and /usr/lib/udev


    # Short Descriptions


