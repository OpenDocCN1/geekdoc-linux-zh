- pgno: 162
  md: "# Note\n\nPIE (position-independent executables) are binary programs that can\
    \ be loaded anywhere. Without PIE, the security feature named ASLR (Address Space\
    \ Layout Randomization) can be applied for the shared libraries, but not for the\
    \ executables themselves. Enabling PIE allows ASLR for the executables in addition\
    \ to the shared libraries, and mitigates some attacks based on fixed addresses\
    \ of sensitive code or data in the executables.\n\nSSP (Stack Smashing Protection)\
    \ is a technique to ensure that the parameter stack is not corrupted. Stack corruption\
    \ can occur, for example, after the return address of a subroutine, transferring\
    \ control to some dangerous code (existing in the program or shared libraries,\
    \ or injected by the attacker somehow).\n\nCompile the package:\n\n```\nmake\n\
    ```\n\n# Important\n\nIn this section, the test suite for GCC is considered important,\
    \ but it takes a long time. First-time builders are encouraged to run the test\
    \ suite. The time to run the tests can be significantly reduced by adding -jx\
    \ to the make -k check below, where x is the number of CPU cores on your system.\n\
    \nOne of the sets in the GCC test suite is known to exhaust the default stack,\
    \ so increase the stack size prior to running the tests:\n\n```\nulimit -s 32768\n\
    ```\n\nTest the results as a non-privileged user, but do not stop at errors:\n\
    \n```\nchown -R tester\nsu tester -c \"PATH=$PATH make -k check\"\n```\n\nTo extract\
    \ a summary of the test results, run:\n\n```\n../contrib/test_summary\n```\n\n\
    To filter out only the summaries, pipe the output through grep -A7 Summ.\n\nResults\
    \ can be compiled at https://www.linuxfromscratch.org/lfs/build-logs/12.1/ and\
    \ https://gcc.gnu.org/gcc-testresults/\nEight tests (out of over 185,000), pr56837c\
    \ and seven tests in the analyzer directory are known to fail. libstdc++ (out\
    \ of over 1500), copy.cc, is known to fail. For g++, 21 tests (out of approximately\
    \ 250,000): 14“AddressSanitizer* and 7 interception-malloc-test-1 c are known\
    \ to fail. Additionally, several tests in the vect directory are known to fail\
    \ if the hardware does not support AVX.\n\nA unexpected failures can be avoided.\
    \ The GCC developers are usually aware of these issues, but not resolved them.\
    \ Unless the test results are vastly different from the above URL, it is safe\
    \ to continue.\n\nInstall the package:\n\n```\nmake install\n```\n\nThe GCC directory\
    \ is owned by tester, and the ownership of the installed header directory (and\
    \ its content) is incorrect. Change the ownership of the root group and user:\n\
    \n```\nchown -R root:root \\\n    /usr/lib/gcc/$(gcc --dumpmachine)/13.2.0/include/,-fixed\n\
    ```"
