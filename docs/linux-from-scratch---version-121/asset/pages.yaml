- pgno: 124
  md: '# Linux From Scratch - Version 12.1


    sic ... -p ...nThis creates the posixrules file. We use New York because POSIX
    requires the daylight saving time rules to be in accordance with US rules.


    One way to determine the local time zone is to run the following script:


    ```

    tzselect

    ```


    After answering a few questions about the location, the script will output the
    name of the time zone (e.g., America/Edmonton). There are also other possible
    time zones listed in /usr/share/zoneinfo as Canada/Eastern or EST5ED that are
    not identified by the script but can be used.


    Then create the /etc/localtime file by running:


    ```

    ln -sfv /usr/share/zoneinfo/<xxx> /etc/localtime

    ```


    Replace <xxx> with the name of the time zone selected (e.g., Canada/Eastern).


    # 8.5.2. Configuring the Dynamic Loader


    By default, the dynamic loader (/lib/ld-linux.so.2) searches through /usr/lib
    for libraries that are needed by programs as they run. However, if there are libraries
    in directories other than /usr/lib, these need to be added to the /etc/ld.so.conf
    file in order for the dynamic loader to find them. Two directories that are commonly
    known to contain additional libraries are /usr/local/lib and /opt/lib, so add
    those directories to the dynamic loader''s search path.


    Create a new /etc/ld.so.conf by running following:


    ```

    cat > /etc/ld.so.conf << "EOF"

    /usr/local/lib

    /opt/lib

    EOF

    ```


    If desired, the dynamic loader can also search a directory and include the contents
    of files found there. Generally the files in this directory are one line specifying
    the desired library path. To add this capability run the following commands:


    ```

    cat >> /etc/ld.so.conf << "EOF"

    # Add an include directory

    include /etc/ld.so.conf.d/*.conf

    EOF

    mkdir -pv /etc/ld.so.conf.d

    ```


    106'
