- pgno: 263
  md: 'If you wish to see the values that the udev scripts will use, then for the
    appropriate CD-ROM device, the corresponding directory under /sys (e.g., this
    by /sys/block/hdd) and run a command to the following:


    ```

    udev test /sys/block/hdd

    ```


    Look at the lines containing the output of *id programs. The "by-id" mod will
    use the ID_SERIAL value if it exists and is not empty, otherwise it will use a
    combination of ID_MODEL and ID_REVISION. The "by-path" mod will use the ID_PATH.


    If the default is not suitable for your situation, then the modification can be
    made to the /etc/udev/rules.83-cdrom.rules file, (where mode is one of "by-id"
    or "by-path")


    ```

    sed -e "/sys_*/write_cd_rules/write cd_mode="/\"

    -i /etc/udev/rules.83-cdrom.rules

    ```


    Note that it is not necessary to create the rules or symlinks at this time because
    you have bound-mounted the host/''s dev directory into the LFS system and we assume
    the symlinks on the host. The rules and symlinks will be created when you boot
    your LFS system.


    If you have multiple CD-ROM devices, the symlinks generated at time may point
    to different devices than point to your host device because devices are not discovered
    in a predictable order. The assignments created when you boot your LFS system
    will be stable, so this is only an issue if you need the symlinks on both systems
    to the same device. If you then, inspect (and possibly edit) the /etc/udev/rules.70-persistent-cd.rules
    file after booting, to make the assigned symlinks match yours.


    # ## 4.3. Dealing with Duplicate Devices


    As explained in Section 9.3, "Overview of Device and Module Handling," the order
    in which devices with the same function appear in /dev is essentially random.
    E.g., if you have a USB camera and a TV tuner, sometimes /dev0 refers to the camera
    and /dev1 refers to the tuner, and sometimes after a reboot the changes. For all
    classes of hardware exclude sound and network cards, this is fixable by creating
    udev rules to create persistent symlinks. The case of network cards is covered
    separately in Section 9.5, "General Network Configuration," and sound card configuration
    can be in BLFS.


    For each device that is likely to have this problem (if the problem does not exist
    in your current Linux distribution), the corresponding directory under /sys/class
    or /sys/block. For video devices, this may be /sys/class/videolinux/videoX. Out
    the attributes that identify the device uniquely (usually, vendor and product
    IDs and serial numbers)


    ```

    udev info -a -p /sys/class/videolinux/video0

    ```


    Then write rules to create the symlinks, e.g.:


    ```

    cat > /etc/udev/rules.83-duplicate_dev.rules << "EOF"


    # Persistent symlinks for webcam and tuner

    KERNEL="video*", ATTRS(product)="1910", ATTRS(vendor)="0081", SYMLINK+="webcam"

    KERNEL="video*", ATTRS(device)="0036f", ATTRS(vendor)="0109e", SYMLINK+="tvtuner"

    EOF

    ```


    The result is that /devvideo0 and /dev1 devices refer randomly to the tuner and
    the camera (and which should never be used directly), but there are symlinks /dev/tvtuner
    and /dev/webcam that always point to the correct device.'
