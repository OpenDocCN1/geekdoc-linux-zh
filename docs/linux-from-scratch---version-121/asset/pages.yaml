- pgno: 294
  md: '# Linux From Scratch - Version 12.1


    The script can run with bash ~/mount-virt.sh as either a regular user (recommended)
    or as root. If as a regular user, sudo is required on the host system.


    Another issue is pointed out by the script where to store downloaded package files.
    This location can be in a regular user''s home directory as ~/sources or in a
    global location like /usr/src. Our recommendation is not to mix BLFS sources and
    LFS sources (from the chroot environment) /sources. In any case, the packages
    must be accessible inside the chroot environment.


    A last convenience featured here is to streamline the process of entering the
    chroot environment. This can be done with an alias in a user''s computer: ~/.bashrc
    file on the host system:


    ```

    alias lfs=sudo /usr/bin/chroot /mnt/lfs /usr/bin/env -i HOME=/root TERM="$TERM"
    PS1="\u@\\w\$# " PATH=/bin:/usr/bin:/bin/bash --login"

    ```


    This is a little tricky because of the quoting and levels of backslash characters.
    It must be all on a single line. The above command has been split in two for presentation
    purposes.


    # 11.5.2.2. Work remotely via ssh


    This method provides a full graphical environment, but first requires installing
    ssh on the LFS system, in chroot. It also requires a second computer. This method
    has the advantage of being simple by not requiring the complexity of the chroot
    environment. It also uses the LFS built kernel for all additional packages and
    provides a complete system for installing packages.


    You may use the sc command to upload the package sources to be built onto the
    LFS system. If you want to download the sources onto the LFS system directly instead,
    install lib1, p11-kit, make-ca, and wget in chroot (or upload your sources using
    sc after booting the LFS system).


    # 11.5.2.3. Work from the LFS command line


    This method requires installing lib1, p11-kit, make-ca, wget, gpm, and links (or
    lynx) in chroot and rebooting into the new LFS system. At this point the default
    system has six virtual consoles. Switching consoles is as easy as using the Alt+Fx
    key combinations where Fx is between F1 and F6. The Alt+← and Alt+→ combinations
    will also change the console.


    At this point you can log into two different virtual consoles and the links or
    lynx browser in one console and in the other. GEM allows copying commands from
    the mouse buffer, switching consoles, and pasting into the other console.


    > Note

    As a side note, switching of virtual consoles can also be done from an X Window
    instance with the Ctrl+Alt+Fx key combination, but the mouse copy operation does
    not work between the graphical interface and a virtual console. You can return
    to the X Window display with the Ctrl+Alt+Fx combination, where Fx is usually
    F1 but may be F7.


    ![](img/3dbc5668c4490cb993bba10b75fc49f3_294_0.png)


    276'
  merge: -1
  img_proc: true
