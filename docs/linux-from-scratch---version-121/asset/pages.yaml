    \        exit 2 ;;\n\n    ) break 2 ;;\n  esac\ndone\n```\n\nif [ -n \"$help\"\
    \ ]; then\necho \"${VERSTR}\"\necho \"${USAGE}\"\ncat\n << HERE_EOF\nifdown is\
    \ used to bring down a network interface. The interface\nparameter, e.g. eth0\
    \ or eth2; must match the trailing part of the\ninterface specifications file,\
    \ e.g. /etc/sysconfig/config.eth0:2.\n\nHERE_EOF\nexit 0\nfi\n\nfile=/etc/sysconfig/config.$($1)\n\
    \n# Skip backup files\n [ \"$file\" = \"${file}\"-\"\"\" ] || exit 0\n /lib/lsb/init-functions\n\
    \nif [ ! -r \"$file\" ]; then\nlog_warning_msg \"$file\" is missing or cannot\
    \ be accessed.\nexit 1\nfi\n\n$ $file\n\nif [ \"$IFACE\" == \"\" ]; then $file\
    \ does not define an interface [IFACE].\nlog_failure_msg \"$file\" does\nexit\
    \ 1\nfi\n\n# We need to first service to bring down the interface\ns-echo \"${SERVICE}\"\
    \ | cut -f1 -d \"\"\nif ip link show $$IFACE > /dev/null 2>&1; then\n  if [ -n\
    \ \"$($SERVICE)\" -a x \"/lib/services/$($SERVICE)\" ]; then\nIFCONFIG=$($file)/lib/services/$($IFACE)\
    \ down\n  else\n    MSG=\"Unable to service $file. Either \"\n    MSG=\"$MSG)the\
