- pgno: 268
  md: 'There are a number of directories under /etc/rc.d that look like rc?. (where
    ? is the number of run level) rd containing a number of symbolic links. Some links
    begin with a K; the others begin with S, and all of them have two numbers following
    the letter. The K means to stop (kill) a service and the S means to start a service.
    The numbers determine the order in which the scripts run, from 00 to 99—the smaller,
    the sooner the script runs. When init switches to another rc level, the appropriate
    services are either started or stopped, depending on the run level.


    The real scripts are in /etc/rc.d/init.d. They do the actual work, and all the
    links point to them. K and S links point to the same script in /etc/rc.d/init.d.
    This is because the scripts can be called with different parameters like start,
    stop, restart, reload, and status. When a K link is encountered, the appropriate
    script is run with the stop argument. When an S link is encountered, the appropriate
    script is run with the start argument.


    These are descriptions of what the arguments make the scripts do:


    +   * start

    The service is started.


    +   * stop

    The service is stopped.


    +   * restart

    The service is stopped and then started again.


    +   * reload

    The configuration of the service is updated. This is used after the configuration
    file of a service was modified, and when the service does not need to be restarted.


    +   * status

    Tells if the service is running and with which PIDs.


    Feel free to modify the way boot process works (after all, it is your LFS system).
    This is given here as an example of how it can be done.


    # 9.6.3 Udev Bootscripts


    The /etc/rc.d/init.udev script starts udev, triggers any "coldplug" devices that
    have already been created by the kernel, and waits for rules to execute. The script
    also starts the uevent handler from the default of /sbin/hotplug . This is because
    the kernel no longer needs to call an external entity. Instead, udev will listen
    on a netlink socket for events that the kernel.


    The /etc/rc.d/init.d/udev_retry script takes care of re-triggering events for
    subsystems that may rely on modules that are not mounted when the mounts is run
    (particular, /usr and var may this). This script runs after the mounts, so it
    (if re-triggered) should succeed the second time. It is configured by /etc/sysconfig/udev_retry
    file; any words in this file other than considered subsystems to retry at time.
    To find a subsystem of a device, use udevadm --attribute-walk <device> where device
    is an path in /dev or /sys, or /sys/class/.


    # 9.6.4 Configuring the System Clock


    The setclock reads the time from the hardware clock, also known as the BIOS or
    Metal Oxide Semiconductor (CMOS) clock. If the hardware clock is set to UTC, this
    script will convert the hardware clock''s time to the local time using the /localtime
    file (which tells the hwclock program which time zone to use). There is no way
    to detect whether or not the hardware clock is set to UTC, so this must be configured
    manually.'
