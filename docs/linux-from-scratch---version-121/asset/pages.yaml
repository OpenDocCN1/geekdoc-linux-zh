    # # 9.4. CD-ROM Systems


    Some that you may want to install later (e.g., various media players) expects
    the /dev/cdrom and /dev/dvd symlinks, and to point to a CD-ROM or DVD-ROM device.
    Also, it may be convenient to put references to these symlinks into /etc/stab.
    Udev comes with a script that generates rules to create these symlinks for you,
    depending on the capabilities of each device, but you need to decide which of
    two modes of operation you wish to have the script use.


    First, can create in "by-path" mode (used by USB and FireWire devices), where
    the rules it depend on the physical path to the CD or DVD device. Second, in "by-id"
    mode (for IDE and SCSI devices), where the rules depend on identification strings
    stored on the CD or DVD device itself. The path is determined by udev''s path_id
    script, and the identification strings are read from the hardware by its ata_id
    or scsi_id programs, depending on which type of device you have.


    There are advantages to each approach; the correct approach depends on what kind
    of device changes may happen. If you expect the physical path to the device to
    change, for example moving you to a different IDE port or a different USB connector,
    then you should use the "by-id" mode. On the other hand, if you expect the device''s
    identification to change, for example it may die, and intend to replace it with
    a different device that plugs into the same connectors, then you should use the
    "by-path" mode.


    If either type of change is possible with your drive, then choose a mode based
    on the type of device you expect to have more often.


    # Important


    External devices (for plugged in, a USB-connected CD device) should not use by-path
    persistence, because each time the device is plugged into an external port, its
    physical path will change. All-connected devices will have this problem if you
    write udev rules to recognize them by their physical path; the problem is not
    limited to CD and DVD drives.'
