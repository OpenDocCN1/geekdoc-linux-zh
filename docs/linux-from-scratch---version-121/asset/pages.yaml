    ATTR(address) - The value of this keyword is the NIC''s MAC address.


    ATTR(type)="*" - This ensures the rule only matches the primary interface in case
    of certain wireless drivers which create multiple virtual interfaces. The secondary
    interfaces are skipped for the same reason that VLAN and bridge sub-interfaces
    are skipped; there would be a name collision otherwise.


    NAME - The value of this keyword is the name udev will assign to this interface.


