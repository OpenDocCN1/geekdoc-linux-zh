- pgno: 281
  md: '# 10.3. Linux-6.7.4


    The Linux package contains the Linux kernel.


    Approximate build time: 0.6 - 20.4 SBU (typically about 1.4 SBU)

    Required disk space: 1.8 - 10.6 GB (typically about 2 GB)


    # 10.3.1. Installation of the kernel


    Building the kernel involves a few steps—configuration, compilation, and installation.
    Read the README file in the kernel source tree for alternative methods to the
    way this book configures the kernel.


    # Important


    Building the kernel for the first time is one of the most challenging tasks in
    LFS. Getting it right on the specific hardware for the target system and your
    specific needs. There are almost 12,000 configuration items that are available
    for the kernel unless about a third of them are needed for most computers. The
    LFS editors recommend that not unfamiliar with this process follow the procedures
    below closely. The objective is to get an initial system to a point where you
    can log in the command line when you reboot later in Section 11.3, “Rebooting
    the System”. At this point optimization and customization is not a goal.


    For general information on kernel configuration see https://www.linuxscratch.com/hints/downloads/files/kernel-configuration.txt.
    Additional information about configuring and building the kernel can be found
    at https://android.linuxscratch.org/LFS/kernel-nutshell. These references are
    a bit dated, but still give a reasonable overview of the process.


    If all else fails, you can ask for help on the LFS-support mailing list. Note
    that subscribing is required in order for the list to avoid spam.


    Prepare for compilation by running the following command:


    ```

    make proper

    ```


    This ensures that the kernel tree is absolutely clean. The kernel team recommends
    that this command be used prior to each kernel compilation. Do not rely on the
    source tree being clean after un-tarring.


    There are several ways to configure the kernel options. Usually, this is done
    through a menu-driven interface, for example:


    ```

    make menoconfig

    ```


    The meaning of optional environment variables:


    ```

    LANG=<host_LANG_value> LC_ALL=

    ```


    This establishes the local setting to the one you used on the host. This may be
    needed for a proper menoconfig ncurses interface drawing on a UTF-8 text console.


    If used, be to replace <host_LANG_value> by the value of the $LANG variable from
    your host. You can alternatively use the host''s value of $LC_ALL or $LC_TYPE.


    ```

    make menoconfig

    ```


    This launches an ncurses menu-driven interface. For other (graphical) interfaces,
    type make help.


    # Note


    A good starting place for setting up the kernel configuration is to run makedefconfig.
    This will set the base configuration to takes your system architecture into account.'
  merge: -1
  img_proc: true
