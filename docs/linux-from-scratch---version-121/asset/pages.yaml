    \ was still applied.\n- During the compilation of most packages, some warnings\
    \ will scroll by the screen. These are normal and can be ignored. These warnings\
    \ are usually deprecated, but not invalid, use of the C or C++ syntax. Standards\
    \ change fairly often, and some packages have not yet been updated. This is not\
    \ a serious problem, but it causes the warnings to appear.\n- Check one last time\
