    Now that we have said that, let''s move on to booting our shiny new LFS installation
    for the first time! *First exit from the chroot environment*:


    ```

    logout

    mount -v $LFS/dev/pts mountpoint -q $LFS/dev/shm && ummount -v $LFS/dev ummount
    -v $LFS/run ummount -v $LFS/proc ummount -v $LFS/sys

    ```


    Then unmount the virtual file systems:


    ```

    umount -v $LFS/home

    umount -v $LFS

    ```


    If multiple partitions were created, unmount the other partitions before unmounting
    the main one, like this:


    ```

    umount -v $LFS

    ```


    Unmount the LFS file system itself:


    ```

    umount -v $LFS

    ```


    Now, reboot the system.


    Assuming the GRUB boot loader was set up as outlined earlier, the menu is set
    to boot *LFS 12.1* automatically.


    When the reboot is complete, the LFS system is ready for use. What you will see
    is a "login: " prompt. At this point, you can refer to the *BLFS Book* where you
    can add more software to suit your needs.


    If your reboot is **not** successful, it is time to troubleshoot. For hints on
    solving initial booting problems, *https://www.linuxfromscratch.org/lftsbleshooting.html*.


    # # 14. Additional Resources


    Thank you for reading this LFS book. We hope that you have found this book helpful
    and have learned more about the system creation process.


    Now that the LFS system is installed, you may be wondering “What next?” To answer
    that question, we have compiled a list of resources for you.'
