- pgno: 248
  md: '# 87.2. Configuring E2fsprogs


    /etc/mke2fs.conf contains the default value of command line options of mke2fs.
    You may edit the file to make the default values suitable for your need. For example,
    some utilities (like in LFS or BLFS) cannot recognize ext4 file system with metadata_csum_seed
    feature enabled. If you need such an utility, you may remove the feature from
    the default ext4 feature list with command:


    ```

    sed ''s/metadata_csum_seed,//'' -i /etc/mke2fs.conf

    ```


    Read the page mke2fs.conf(5) for details.


    # 87.3. Contents of E2fsprogs


    +   **Installed programs:** badblocks, chattr, compile_et, debugfs, dumpe2fs,
    e2freefrag, e2fsck, e2image, e2label, e2mpstat, e2scrub, e2scrub_all, e2undo,
    e4crypt, e4defrag, filefrag, fsck.ext, fsck.ext4, logsave, mke2fs, mke2fs, mkfs.ext,
    mkfs.ext4, mkfsplus, resize2, and tune2fs

    **Installed libraries:** libcom_err, lib2bp.so, libertfs, and libss

    **Installed directories:** /usr/include, /usr/include/ /usr/include/e22fs, /usr/include/ss,
    /usr/lib/e2fsprogs, /usr/share/ and /usr/share/


    # Short Descriptions


    +   **badblocks** Searches a device (usually a disk partition) for bad blocks

    **chattr** Changes the attributes of files on ext(234) file systems

    **compile_et** An error table compiler; it converts a table of error-code names
    and messages into a C source file suitable for use with the com_err library

    **debugfs** A file system debugger; it can be used to examine and change the state
    of ext(234) file systems

    **dumpe2fs** Prints the super block and groups information for the file system
    present on a given device

    **e2freefrag** Reports free space fragmentation information

    **e2fsck** Is used to check and repair ext(234) file systems

    **e2image** Is used to recover ext(234) file system data to a file

    **e2label** Displays or changes the file label on the ext(234) file system on
    a given device

    **e2mpstat** Checks MMP (Multiple Mount Protection) status of an ext4 file system

    **e2scrub** Checks the contents of ext(234) file system errors

    **e2scrub_all** Checks all mounted ext(234) file system errors

    **e2undo** Replays the undo log for an ext(234) file system found on a device.
    [This can be used to undo a failed operation by an E2fsprogs program.]

    **e4crypt** Ext4 file system encryption utility

