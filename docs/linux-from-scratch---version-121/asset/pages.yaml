  md: 'If the partition for /dev/LFS system is in NVME SSD (i. e. the device node
    for the partition is /dev/nvme*) enable NVME support or the LFS system won''t
    boot:


    | Drivers ---> |

    | NVME Support ---> |

    | <*> NVME Express block device [BLK_DEV_NVME] |


    There are several other options that may be desired depending on the requirements
    for the system. For a list of options needed for BLFS packages, see the BLFS Index
    of Kernel Settings.


    > If your hardware is using UEFI and you wish to boot the LFS system with it,
    you should adjust some kernel configuration following the BLFS page if you''ll
    use the UEFI bootloader from the host distro.


    The rationale for the above configuration items:


    +   Randomize the address of the kernel image (KASLR)


    +   Enable ASLR for kernel image, to mitigate attacks based on fixed addresses
    of sensitive data or code in the kernel.


    +   Compile the kernel with warnings as errors

    This may cause building failure if the compiler and configuration are different
    from those of the kernel developers.


    +   Enable kernel headers through /sys/kernel/kheaders.tar.xz

    This will require cpio building the kernel. cpio is not installed by LFS.


    +   Configure standard kernel features (expert users)

    This will make some options up in the configuration interface but changing those
    options may be dangerous. Do not use this unless you know what you are doing.


    +   Strong Stack Protector

    Enable SSP for the kernel. We''ve enabled it for the userspace with --enable-default-ssp
    configuring GCC, but the kernel does not use GCC default for SSP. We enable it
    explicitly here.


    +   Support for uevent helper

    Having this option may interfere with device management when using Udev.


    +   Maintain devmtps

    This will create automated device nodes populated by the kernel, even without
    Udev. Running then runs on top of this, managing permissions and adding symlinks.
    This configuration item is required for all users of Udev.


    +   Autount devmtps at /dev

    This will make the kernel view of the devices on /dev switching to root filesystem
    before starting init.

    Enable legacy fdevm support for modesetting driver and Framebuffer Console support


    +   These are needed to display the Linux console on a GPU driven by a DRI (Direct
    Rendering Infrastructure) driver; if you enable these two options as well you''ll
    get a blank screen once the DRI driver is loaded.


    +   Support x2api

    Support running the interrupt controller of 64-bit x86 processors in x2APIC mode.
    x2APIC may be enabled by firmware on 64-bit x86 systems, and a kernel without
    this option will panic on boot if x2APIC is enabled by firmware. This option has
    no effect, but also no harm if x2APIC is disabled by the firmware.'
  merge: -1
  img_proc: true
