- pgno: 196
  md: "# # 8.50. Libffi-3.4.4\n\nThe Libffi library provides a portable, high level\
    \ programming interface to various calling conventions. This allows a programmer\
    \ to call any function specified by a call interface description at runtime.\n\
    \nFFI stands for Foreign Function Interface. An FFI allows a program written in\
    \ one language to call a program written in another language. Specifically, Libffi\
    \ can provide a bridge between an interpreter like Perl, or Python, and shared\
    \ library subroutines in C, or C++.\n\nApproximate build time: 1.8 SBU\nRequired\
    \ disk space: 11 MB\n\n# # 8.50.1. Installation of Libffi\n\n> > Note\nWith GMP,\
    \ Libffi builds with optimizations specific to the processor in use. If building\
    \ for another system, change the value of the `--with-gcc-arch-` parameter in\
    \ the following command to an architecture name fully implemented by the CPU on\
    \ that system. If this is not done, all applications that link to libffi will\
    \ trigger Illegal Operation Errors.\n\nPrepare Libffi for compilation:\n\n```\n\
    ./configure --prefix=/usr \\\n    --disable-static \\\n    --with-gcc-arch=native\n\
    ```\n\nThe meaning of the configure option:\n\n```\n--with-gcc-arch=native\n```\n\
    \nEnsure GCC optimizes for the current system. If this is not specified, the system\
    \ is guessed and the code generated may not be correct. If the generated code\
    \ will be copied from the native system to a less capable system, use the least\
    \ capable system as a generator. For details about alternative system types, see\
    \ the x86 options in the GCC manual.\n\nCompile the package:\n\n```\nmake\n```\n\
    \nTo test the results, issue:\n\n```\nmake check\n```\n\nInstall the package:\n\
    \n```\nmake install\n```\n\n# # 8.50.2. Contents of Libffi\n\nInstalled library:\
    \ libffi.so\n\n# Short Descriptions\n\nlibffi Contains the foreign function interface\
    \ API functions"
  merge: -1
  img_proc: true
- pgno: 197
  md: "# 8.51. Python-3.12.2\n\nThe Python 3 package contains the Python development\
    \ environment. It is useful for object-oriented programming, writing scripts,\
    \ prototyping large programs, and developing entire applications. Python is an\
    \ interpreted computer language.\n\nApproximate build time: 1.8 SBU\nRequired\
    \ disk space: 485 MB\n\n# 8.51.1. Installation of Python 3\n\nPrepare Python for\
    \ compilation:\n\n```\n./configure --prefix=/usr \\\n    --enable-shared \\\\\n\
    \    --with-system-expat \\\n    --enable-optimizations \\\\\n```\n\nThe mean\
    \ of the configure options:\n\n--with-system-expat\nThis switch enables linking\
    \ against the system version of Expat.\n\n--enable-optimizations\nThis switch\
    \ enables extensive, but time-consuming, optimization steps. The interpreter is\
    \ built twice; tests performed on the first build are used to improve the optimized\
    \ final version.\n\nCompile the package:\n\n```\nmake\n```\n\nRunning the tests\
    \ at this point is not recommended. The tests are known to hang indefinitely in\
    \ the partial LFS environment. If desired, the tests can be rerun at the end of\
    \ this chapter, or when Python 3 is reinstalled in BLFS. To run the tests anyway,\
    \ issue **make test**.\n\nInstall the package:\n\n```\nmake install\n```\n\nWe\
    \ use **pip3** command to install Python 3 programs and modules for all users\
    \ as *root* in several places in this book. Conflicts with the Python developers'\
    \ recommendation: to install packages into a virtual environment, or into the\
    \ home directory of a regular user (by running *pip3* as this user). A multi-line\
    \ warning is triggered whenever pip3 is used by the *root* user.\n\nThe main reason\
    \ for avoidance is conflicts with the system's package manager (**dpkg**, for\
    \ example). LFS does not have a system-wide package manager, so this is not a\
    \ problem. However, **pip3** will check for a new version of itself whenever it\
    \ runs. Since domain name resolution is not yet configured in the LFS root, **pip3**\
    \ cannot check for a new version of itself and will produce a warning\n\nAfter\
    \ we boot the LFS system and set up a network connection, a different warning\
    \ will be: telling the user to update **pip3** from a pre-built wheel from PyPI\
    \ (whenever a new version is available). But LFS considers **pip3** to be a part\
    \ of Python \\u20833, so it should not be updated separately. Also, an update\
    \ from a pre-built wheel would deviate"
  merge: -1
  img_proc: true
- pgno: 198
  md: "# Linux From Scratch - Version 12.1\n\nfrom our objective: build a Linux system\
    \ from source code. So the warning about a new version of pip3 should be\nignored\
    \ as well. If you wish, you can suppress all these warnings by running the following\
    \ command, which creates\na configuration file:\n\n```\ncat /etc/pip.conf << EOF\n\
    [global]\nroot-user-action = ignore\ndisable-pip-version-check = true\nEOF\n```\n\
    \n![](img/3dbc5668c4490cb993bba10b75fc49f3_198_0.png)\n\n# Important\n\nIn LFS\
    \ and BLFS we normally build and install Python modules with the pip3 command.\
    \ Please be sure that\npip3 installs in both books are run as the root user (unless\
    \ it's a Python environment).\nRunning pip3 as a non-root user may seem to work,\
    \ but it will cause the installed module to\ninaccessible by other users.\n\n\
    pip3 install will not reinstall an already installed module. When using the pip3\
    \ install\ncommand to upgrade a module (example, from meson-0.61.3 to meson-0.62.0),\
    \ insert the option --upgrade\nto the command line. If it's necessary to downgrade\
    \ a module, or reinstall the same version for some\nreason, insert --force-reinstall\
    \ --no-deps into the command line.\n\nIf desired, refer to the documentation:\n\
    \n```\ninstall -v --dm755 /usr/share/doc/python-3.12.2/html\ntar --no-same-owner\
    \ \\\nxvf ../python-3.12.2-docs.tar.bz2\ncp -R --no-preserve-mode python-3.12.2-docs-*\
    \ *\n/usr/share/doc/python-3.12.2/html\n```\n\nThe meaning of the documentation\
    \ commands:\n\n--no-same-owner (tar) and --no-preserve(cp)\nEnsure the files have\
    \ the correct ownership and permissions. Without these, tar will install the\n\
    package files with the upstream creator's values and values would have restrictive\
    \ permissions.\n\n# 8.51.2. Contents of Python 3\n\n+   Installed programs: 2to3,\
    \ idle3, pip3, pydoc3, python3, and python3-config\nInstalled library: libpython3.12.so\
    \ and libpython3.so\n directories: /usr/include/python3.12, /usr/lib/python3,\
    \ and /usr/share/doc/python-3.12.2\n\n# Short Descriptions\n\n+   2to3 is a Python\
    \ program that runs Python 2.x source code and applies a series of fixes to transform\
    \ it into\nvalid Python 3.x code\n\n+   idle3 is a wrapper script that opens a\
    \ Python GUI editor. For this script, you must have installed\nTk before Python,\
    \ so that the Tkinter module is built.\n\n+   pip3 is the package installer for\
    \ Python. You can use pip to install packages from Python Package Index and\n\
    other indexes.\n\n+   pydoc3 is the Python documentation tool\n\n+   python3 is\
    \ the interpreter for Python, an interpreted, interactive, object-oriented programming\
    \ language\n\n180"
