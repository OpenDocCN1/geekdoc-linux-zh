- pgno: 159
  md: '/etc/default/useradd parameter explanations


    GROUP=999


    This parameter sets the beginning of the group numbers used in the /etc/group
    file. The particular value 999 comes from the -gid parameter above. You may set
    it to any desired value. Note that useradd will never use a UID or GID if the
    number identified in this parameter is used, it will use the next available number.
    Also note that if you don''t have a group with an ID equal to your number, the
    first time you use useradd without the -g parameter, an error message will be
    generated—useradd: unknown GID 999, even though the account has been created today.
    This is why we create users with this group ID in Section 7.6, "Creating Essential
    Files and Symlinks".


    CREATES_MAIL_POOL=yes


    This parameter causes useradd to create a mailbox file for every new user. useradd
    will assign the group ownership of this file to 0660 permissions. If you would
    not create these files, issue the following command:


    ```

    sed -i ''//MAIL/s/yes/no/'' /etc/default/useradd

    ```


    # 8.27.3. Setting the Root Password


    Choose a password for user root and set it by running:


    ```

    passwd root

    ```


