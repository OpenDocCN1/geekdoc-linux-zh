    and the machine will be connected to an existing network). The optional alias(s)
    can be omitted.


    # # 9.6. System V Bootstrap Usage and Configuration


    # # 9.6.1. How Do the System V Bootscripts Work?


    This version of LFS uses a special booting facility named SysInit, based on a
    series of run levels. The boot procedure can be quite different from one to another;
    the fact that things worked in one particular Linux distribution does not guarantee
    they will work the same way in LFS. LFS has its own way of doing things, but it
    does respect generally accepted standards.


    There is an alternative boot procedure called systemd. We will not discuss this
    process here. For a detailed description visit https://www.linux.com/training-tutorials/understanding-and-using-systemd.


    SysInit (which will be referred to as "init" from now) uses a run level scheme.
    There are seven run levels, numbered 0 to 6. There are more run levels, but the
    others are for special cases and generally not used. init(8) for more details.
    Each of the seven concerns actions the computer is supposed to perform when it
    starts or shuts down. The default run level is 3. Here are the descriptions of
    the different run levels as they are implemented in LFS:


    ```

    0: halt the computer

    1: single-user mode

    2: reserved for customization, otherwise the same as 3

    3: multi-user mode with networking

    4: reserved for customization, otherwise the same as 3

    5: same as 4, it is usually used for GUI login (like GNOME''s gdm or LXDE''s lxdm)

    6: reboot the computer

    ```'
  merge: -1
  img_proc: true
- pgno: 267
  md: '# Note


    Classically, run level 2 above was defined as “multi-user mode without networking,”
    but this was only the case years ago when multiple users could connect to a system
    via serial ports. In today''s environment it makes no sense, and we now say it
    is “reserved”.


    # 9.6.2. Configuring Sysvinit


    During kernel initialization, the first program that is run (if not overridden
    on the command line) is **init**. This program reads the initialization file `/etc/inittab`.
    Create this file:


    ```

    cat > /etc/inittab << "EOF"

    # /etc/inittab


    id:3:default:

    si:sysvinit/etc/rc.d/init.d/rc S


    10:0:wait=/etc/rc.d/init.d/rc 0

    11:1:wait=/etc/rc.d/init.d/rc 1

    12:2:wait=/etc/rc.d/init.d/rc 2

    13:3:wait=/etc/rc.d/init.d/rc 3

    14:4:wait=/etc/rc.d/init.d/rc 4

    15:5:wait=/etc/rc.d/init.d/rc 5

    16:6:wait=/etc/rc.d/init.d/rc 6


    ca:12345:crtallctl:/sbin/shutdown -tl -a -r now


    su:806once=/sbin/sulogin

    sli:1:respawn=/sbin/agetty tty 960

    1:2345:respawn=/sbin/agetty tty 960

    2:2345:respawn=/sbin/agetty tty 960

    3:2345:respawn=/sbin/agetty tty 960

    4:2345:respawn=/sbin/agetty tty 960

    5:2345:respawn=/sbin/agetty tty 960

    6:2345:respawn=/sbin/agetty tty 960


    # /etc/inittab

    EOF

    ```


    An explanation of this initialization file is in the man page for `inittab`. The
    initialization file instructs rc to run all the scripts starting with an S in
    `/etc/rc.S?` directory followed by all scripts starting with an S in `/etc/rc.Q?`
    directory where the question mark is replaced by the default value.


    As a convenience, the rc script reads a library of functions in `/lib/sb/init-functions`.
    This library also reads an optional configuration file, `/etc/config/rc.site`.
    Any of the system configuration parameters described in subsequent sections can
    be placed in this file, allowing configuration of all system parameters in this
    one.


    As a debugging convenience, the functions script also logs output to `/run/var/bootlog`.
    Since the `/run` directory is a tmpfs, it is not persistent across reboots; however,
    it is appended to the more permanent `/var/log/boot...` at the end of the boot
    process.


    # 9.6.2.1. Changing Run Levels


    Changing run levels is done with **init <runlevel>`, where `<runlevel>` is the
    target run level. For example, to reboot the computer, a user could issue the
    **init 6** command, which is an alias for the **reboot** command. Likewise, **init
    0** is an alias for the **halt** command.'
