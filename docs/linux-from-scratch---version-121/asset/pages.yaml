  md: "# 8.48. Kmod-31\n\nThe Kmod package contains libraries and utilities for loading\
    \ kernel modules\n\nApproximate build time: less than 0.1 SBU\nRequired disk space:\
    \ 12 MB\n\n# 8.48.1. Installation of Kmod\n\nPrepare Kmod for compilation:\n\n\
    ```\n./configure --prefix=/usr\n    --sysconfdir=/etc\n    --with-openssl\n  \
    \  --with-xz\n    --with-zstd\n    --with-zlib\n```\n\nThe meaning of configure\
    \ options:\n\n```\n--openssl\n```\n\nThis option enables Kmod to handle PKCS7\
    \ signatures for kernel modules.\n\n```\n--xz, --with-zlib, and --with-zstd\n\
    ```\n\nThese options enable Kmod to handle compressed kernel modules.\n\nCompile\
    \ the package:\n\n```\nmake\n```\n\nThe test suite of this package requires raw\
    \ kernel headers (not the \"sanitized\" kernel headers installed earlier), which\
    \ are beyond the scope of LFS.\n\nInstall the package and create symlinks for\
    \ compatibility with Module-Init-Tools (the package that previously handled Linux\
    \ kernel modules):\n\n```\nmake install\nfor target in depmod insmod modinfo modprobe\
    \ rmmod; do\n ln -sf ../bin/kmod /usr/sbin/$target\ndone\nln -sf kmod /usr/bin/lsmod\n\
    ```\n\n# 8.48.2. Contents of Kmod\n\nInstalled programs: depmod (link to kmod),\
    \ insmod (link to kmod), lsmod (link to kmod), modinfo\n(link to kmod), modprobe\
