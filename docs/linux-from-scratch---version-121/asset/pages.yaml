    - **rtacct** Displays the contents of /proc/net/rt_acct

    - **rimon** Route monitoring utility

    - **rtpr** Converts the output of **ip -o** into a readable form

    - **rtstat** Route status utility

    - **ss** Similar to the **netstat** command; shows active connections

    - **tc** Traffic control for Quality of Service (QoS) and Class of Service (CoS)
    implementations

    - **tc qdisc** allows users to set up the queuing discipline

    - **tc class** allows users to set up classes based on the queuing discipline
    scheduling

    - **tc filter** allows users to set up the QoS/CoS packet filtering

