- pgno: 163
  md: '# Linux From Scratch - Version 12.1


    Create a symlink required by the FHS for "historical" reasons.


    ```

    ln -svr /usr/lib/bin/cpp /usr/lib

    ```


    Many packages use the name cc to call the C compiler. We''ve already created cc
    as a symlink in gcc-pass-2, create its man page as a symlink as well:


    ```

    ln -sv gcc.1 /usr/share/man/man/cc.1

    ```


    Add a compatibility symlink enable building programs with Link Time Optimization
    (LTO):


    ```

    ln -sfv ... /libabex/gcc/(gcc --dumpmachine)/13.2.0/liblto_plugin.so \

    /usr/lib/bfd-plugins/

    ```


    Now that our toolchain is in, it is important to ensure that compiling and linking
    will work as expected.


    ```

    echo ''int main()'' > dummy.c\ncccc dummy.c -v -W1,--verbose > dummy.log\nreadelf
    -a a.out | grep ''/lib''

    ```


    There should be no errors, and the output of the last command will be (allowing
    for platform-specific differences in the dynamic linker):


    > [Requesting program interpreter: /lib64/ld-linux-x86-64.so.2]


    Now make sure we''re set up to use the correct paths:


    ```

    grep -E ''/usr/lib/\.S?crt[lin].*succeeded'' dummy.log

    ```


    The output of the last command should be:


    ```

    /usr/lib/gcc/x86_64-pc-linux-gnu/13.2.0/../../../../usr/lib/crt1.o succeeded\n/usr/lib/gcc/x86_64-pc-linux-gnu/13.2.0/../../../../usr/lib/crti.o
    succeeded\n/usr/lib/gcc/x86_64-pc-linux-gnu/13.2.0/../../../../usr/lib/crtn.o
    succeeded

    ```


    Depending on your architecture, the path may differ slightly. The difference will
    be the directory after /usr/lib/gcc. The important thing to look for is that gcc
    has all three crt*.o files under the /usr/lib directory.


    Verify that the compiler is searching for the header files:


    ```

    grep -B4 ''^usr/include'' dummy.log

    ```


    This command should return the following output:


    ```

    #include <.> starts here:\n/usr/lib/gcc/x86_64-pc-linux-gnu/13.2.0/include\n/usr/local/include\n/usr/lib/gcc/x86_64-pc-linux-gnu/13.2.0/include-fixed\n/usr/include

    ```


    Again, the directory named after your target triplet may be different than the
    above, depending on your system architecture.


    Next, verify that the linker is being used with the correct search paths:


    ```

    grep ''SEARCH.**/usr/lib'' dummy.log |sed ''s|;\n|''

    ```


    145'
