  md: "# 8.63. GRUB-2.12\n\nThe GRUB package contains the GRand Unified Bootloader.\n\
    Approximate build time: 0.3 SBU\nRequired disk space: 166 MB\n\n# 8.63.1. Installation\
    \ of GRUB\n\n> Note\nIf your system has UEFI support and you wish to boot LFS\
    \ with UEFI, you can skip this package in LFS, and install GRUB with UEFI support\
    \ (and its dependencies) by following the instructions on the BLFS page.\n\n>\
    \ Warning\nUnset any environment variables which may affect the build:\nunset\
    \ (C, CPP, CXX, LD) FLAGS\n\nDon't try \"tuning\" this package with custom compilation\
    \ flags. This package is a bootloader. The low-level operations in the source\
    \ code may be broken by aggressive optimization.\n\nAdd a file from the release\
    \ tarball:\n\n```\necho depends blib_gpt > grub-core/extra_deps.lst\n```\n\nPrepare\
    \ GRUB for compilation:\n\n```\n./configure --prefix=/usr \\\n\t--sysconfdir=/etc\
    \ \\\n\t--disable-efiemu \\\n\t--disable-werror \\\n```\n\nThe meaning of the\
    \ new configure options:\n\n```\n--disable-werror\n```\n\nThis allows the build\
    \ to complete with warnings introduced by more recent versions of Flex.\n--disable-efiemu\n\
    This option minimizes what is built by disabling a feature and eliminating some\
    \ test programs not needed for LFS.\n\nCompile the package:\n\n```\nmake\n```\n\
    \nThe test suite for these packages is not recommended. Most of the tests depend\
    \ on packages that are not available in the limited LFS environment. To run the\
    \ tests anyway, run make check.\n\nInstall the package:\n\n```\nmake install\n\
    mv -v /etc/bash_completion.d/grub /usr/share/bash-completion/completions\n```\n\
    \nMaking your LFS system bootable with GRUB will be discussed in Section 10.4,\
    \ “Using GRUB to Set Up the Boot Process”."
  merge: -1
