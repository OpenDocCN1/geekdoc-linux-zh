    localedef -i cs_CZ -f UTF-8 cs_CZ_UTF-8

    localedef -i de_DE -f UTF-8 ISO-8859-1_de_DE

    localedef -i de_DE@euro -f UTF-8 ISO-8859-15_de_DE@euro

