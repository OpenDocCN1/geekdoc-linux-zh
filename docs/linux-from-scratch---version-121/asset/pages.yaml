- pgno: 292
  md: 'Maintenance


    Bugs and security notices are reported regularly for all software. Since an LFS
    system is compiled from source, it is up to you to keep abreast of such reports.
    There are several online resources that track these reports, some of which are
    shown below:


    +   - LFS Security Advisories


    This is a list of security vulnerabilities discovered in the LFS book after it''s
    published.


    +   - Open Source Security Mailing List


    This is a mailing list for discussion of security flaws, concepts, and practices
    in the Open Source community.


    +   - LFS Hints


    The LFS Hints are a collection of educational documents submitted by volunteers
    in the LFS community. The hints are available at https://www.linuxfromscratch.org/hints/downloads/files/


    +   - Mailing lists


    There are several mailing lists you may subscribe to if you are in need of help,
    want to stay current with the latest developments, want to contribute to the project,
    and more. See Chapter 1 - Mailing Lists for more information.


    +   - The Linux Documentation Project


    The Goal of The Linux Documentation Project (TLDP) is to collaborate on all of
    the issues of Linux documentation. The TLDP features a large collection of HOWTOs,
    guides, and man pages. It is located at https://tldp.org.


    # 11.5. Getting Started After LFS


    # 11.5.1. Deciding what to do


    Now that LFS is complete and you have a bootable system, what do you do? The next
    step is to decide how to use it. Generally, there are two categories to consider:
    workstation or server. Indeed, these categories are not mutually exclusive. The
    applications needed for each category can be combined into a single system, but
    let''s look at them separately for now.


    A server is a simpler complex. Generally this consists of a web server as the
    Apache HTTP Server and a database such as MariaDB. However other services are
    available. The operating system running in a single device falls into this category.


    On the other hand, a workstation is much more complex. It generally requires a
    graphical user environment such as LXDE, XFCE, KDE, or Gnome based on a basic
    graphical environment and graphical based applications such as the Firefox browser,
    Thunderbird email client, or LibreOffice suite. These applications may require
    (several hundred depending on desired capabilities) more packages of support applications
    and libraries.


    In addition to the above, there is a set of applications for system management
    for all kinds of systems. These applications are all in the BLFS book. Not all
    packages are needed in every environment. For example dhcpcd, is not normally
    appropriate for a server and wireless_tools, is normally only useful for a laptop
    system.


    # 11.5.2. Working in a basic LFS environment


    When you initially boot into LFS, you have all the internal tools to build additional
    packages. Unfortunately, the user environment is quite sparse. There are a couple
    of ways to improve this:'
  merge: -1
  img_proc: true
- pgno: 293
  md: "# 11.5.2.1. Work from LFS host in chroot\n\nThis method provides a complete\
    \ graphical environment where a full featured browser and copy/paste capabilities\
    \ are available. This method allows using applications like the host's version\
    \ of wget to download package sources to a location when working in the chroot\
    \ environment.\n\nIn order to properly build packages in chroot, you will also\
    \ need to remember to mount the virtual systems if they are not already mounted.\
    \ One way to do this is to create a script on the HOST:\n\n```\ncat ~/mount-virt.sh\
    \ << \"EOF\"\n#!/bin/bash\n\nfunction mountbind\n{\n  if ! mountpoint $LFS/$1\
    \ >/dev/null; then\n    $SUDO mount --bind $1 $LFS/$1\n    echo $LFS/$1 mounted\n\
    \  else\n    echo $LFS/$1 already mounted\n  fi\n}\n\nfunction mounttype\n{\n\
    \  if ! mountpoint $LFS/$1 >/dev/null; then\n    $SUDO mount -t $2 $3 $4 $LFS/$1\n\
    \    echo $LFS/$1 mounted\n  else\n    echo $LFS/$1 already mounted\n  fi\n}\n\
    \nif [ $EUID -ne 0 ]; then\n  SUDO=sudo\nelse\n  SUDO=\"\"\nfi\n\nif [ $x$LFS\
    \ == x ]; then\n  echo \"LFS not set\"\n  exit 1\nfi\n\nmountbind dev\nmountype\
    \ dev/devpts devptpts -o gid=0,mode=620\nmountype proc proc\nmountype sys sysfs\
    \ sysfs\nmountype run run\nif [ -d $LFS/dev/shm ]; then\n  install -v d -m 1777\
    \ $LFS$(realpath /dev/shm)\nelse\n  mountbind dev/shm tmpfs tmpfs -o nosuid,nodev\n\
    fi\n\n#mountbind usr/src\n#mountbind boot\n#mountbind home\nEOF\n```\n\nNote that\
    \ the last three commands in the script are commented out. These are useful if\
    \ these directories are mounted as separate partitions on the host system and\
    \ will be mounted when booting the completed LFS/BLFS system."
