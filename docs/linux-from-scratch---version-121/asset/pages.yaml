- pgno: 28
  md: '# 1.5. Help


    > Note

    In you''ve hit an issue building one package with the LFS instruction, we strongly
    discourage posting the issue directly to the upstream support channel before discussing
    via a LFS support channel listed in Section 1.4, “Resources”. Doing so is quite
    inefficient because the upstream maintainers are rarely familiar with LFS building
    procedure. Even if you''ve really hit an upstream issue, the LFS community can
    still help isolate the information wanted by the upstream maintainers and make
    a proper report.


    If you ask a question via an upstream support channel, you shall at note that
    many upstream projects have the support channels separated from the bug tracker.
    The “bug” for reporting asks are considered invalid and may annoy upstream developers
    for these projects.


    If an issue or a question is encountered while working through this book, please
    check the FAQ page at https://www.linuxfromscratch.org/general/faq#questions.
    Questions are often answered there. If your question is not answered on that page,
    try to find the source of the problem. The following hint will give you some guidance
    for troubleshooting; https://www.linuxfromscratch.org/hints/files/errors.txt.


    If you cannot find your problem in the FAQ, search the mailing lists at https://www.linuxfromscratch.org/search.html.


    We also have a LFS community that is willing to offer assistance through the mailing
    lists and IRC (see the Section 1.4, “Resources” section of this book). However,
    we get several questions every day, and many of them could have been easily answered
    by going to the FAQ or searching the mailing lists. For so, for us to offer the
    best assistance, you should first do some research on your own. This allows us
    to focus on the more unusual support needs. If your searches do not produce a
    solution, please include all the relevant information (mentioned below) in your
    request for help.


    # 1.5.1. Things to Mention


    Apart from a brief explanation of the book being experienced, any request for
    help should include these essential things:


    +   - The Version of the book being used (in this case 12.1)

    - The host distribution and version being used to create LFS

    - The output from the System Requirements script

    - The package or section the problem was encountered in

    - The exact error message, or a clear description of the problem

    - Note whether you have deviated from the book at all


    > Note

    Deviating from this book does not mean that we will not help you. After all, LFS
    is about personal preference. Being up-front about changes to the established
    procedure helps us evaluate and determine possible causes of your problem.


    # 1.5.2. Configure Script Problems


    If something goes wrong while running the configure script, review the config.log
    file. This file may contain errors encountered during configure which were not
    printed to the screen. Include the relevant lines if you need to ask for help.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# ## 1.3. Compilation Problems


    Both the screen output and the contents of various files are useful in determining
    the cause of compilation problems. The screen output from the **configure** script
    and the **make** run can be helpful. It is not necessary to include the entire
    output, but do include all of the relevant information. Here is an example of
    the type of information to include from the **make** screen output.


    ```

    gcc -DLASSPATH="/tmp/lfs/usr/share/locale::\"

    -DLOCALEDIR="/tmp/lfs/usr/share/locale"

    -DLDBIR="/tmp/lfs/usr/lib"

    -DINCLUDEDIR="/tmp/lfs/usr/include\" -DHAVE_CONFIG_H -I.

    gcc g.c -o gcc

    gcc -02 -static make ar.o arscan.o commands dir.o

    expand.o file.function.getopt.o implicit.o job.main.o

    miss.o read make.o rule.signame variable.o vpath.o

    default.o remote-status.o version.o opti.o

    just in function "load_Too_high"

    to /lfs/tmp/make-3.79.1/job:c1565: undefined reference

    to ''getocldav''

    collect[2]: ld returned 1 exit status

    make[2]: *** Error 1

    make[2]: Leaving directory ''/lfs/tmp/make-3.79.1''

    make[1]: *** [all-recursive] Error 1

    make[1]: Leaving directory ''/lfs/tmp/make-3.79.1''

    make: *** [all-recursive-am] Error 2

    ```


    In this case, many people would include the bottom section:


    ```

    make [2]: [make] Error 1

    ```


    This is not enough information to diagnose the problem, because it only notes
    that something went wrong, not *what went wrong*. The entire section, above, is
    what should be saved because it includes the command that was executed and all
    the associated error messages.


    An excellent article about asking for help on the Internet is available at http://catb.org/~esr/faqs/smart-questions.html.
    Read this document, and follow it. Doing so will increase the likelihood of getting
    the help you need.'
  merge: -1
  img_proc: true
