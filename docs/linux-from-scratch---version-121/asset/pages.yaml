- pgno: 77
  md: '# Chapter 6. Cross Compiling Temporary Tools


    # 6.1. Introduction


    This chapter shows how to cross-compile basic utilities using the just built cross-toolchain.
    Those utilities are installed into their final location, but cannot be used yet.
    Basic tasks still rely on the host''s tools. Nevertheless, the installed libraries
    are used when linking.


    Using the utilities will be possible in the next chapter after entering the “chroot”
    environment. But all the packages built in the present chapter need to be built
    before we do that. Therefore we cannot be independent of the host system yet.


    Once again, let us recall that improper setting of LFS together with building
    as root, may render your computer unusable. This whole chapter must be done as
    user lfs, with the environment as described in Section 4.4, “Setting Up the Environment”.'
