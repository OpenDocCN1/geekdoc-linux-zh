- pgno: 7
  md: '# Linux From Scratch - Version 12.1


    # Preface


    # Foreword


    My journey to learn and better understand Linux began back in 1998. I had just
    installed my first Linux distribution and had quickly become intrigued with the
    whole concept and philosophy behind Linux.


    There are many ways to accomplish a single task. The same can be said about Linux
    distributions. A great many have existed over the years. Some still, some have
    morphed into something else, yet others have been relegated to our memories. They
    do things differently to suit the needs of their target audience. Because so many
    different ways to accomplish the same goal exist, I realized no longer had to
    be limited by any one implementation. Before discovering Linux, we simply put
    up with other Operating Systems as you had no choice. It was it was, whether you
    liked it or not. With Linux, the concept of became to emerge. If you were free,
    encouraged, to change it.


    I tried a number of distributions and could not decide on any one. They were great
    systems in their own right. It was no matter of right and wrong anymore. It became
    a matter of personal taste. With all that choice, it appeared that there would
    not be a single system that was perfect for me. So I set out to create my own
    system that would fully conform to my personal preferences.


    To make my own, I resolved to compile everything from source code instead of using
    pre-compiled binary packages. This "perfect" system would have the strengths of
    various systems without their perceived weaknesses. At first, the idea was rather
    daunting. I remained committed to the idea that such a system could be built.


    After sorting through issues such as dependencies and compile-time errors, I finally
    built a custom-built Linux system. It was fully operational and perfectly usable
    like any of the other Linux systems out there at the time. But it was my creation.
    It was very satisfying to have put together a system myself. The only thing better
    would have been to create each piece of software myself. This was the next best
    thing.


    As I shared my goals and experiences with other members of the Linux community,
    it became apparent that there was a sustained interest in these ideas. It quickly
    became plain that such custom-built Linux systems serve not only to meet specific
    requirements, but also as an ideal learning opportunity for programmers and system
    administrators to enhance their (existing) Linux skills. Of that broadened interest,
    the Linux From Scratch Project was born.


    This Linux From Scratch book is the core project that. It provides the background
    and instructions necessary for you to design and build your own system. This book
    provides a template that will result in correctly working your system, or free
    to alter the instructions to suit yourself, which is, in, an important part of
    this project. You remain in control; we lend a helping hand to get you started
    on your journey.


    I sincerely hope you will have a great time working on your own Linux From Scratch
    system and enjoy the numerous benefits of having a system that is truly yours.


    > -- Gerard Beekmans

    gerard@linuxfromscratch.org


    # Audience


    There are many reasons why you would want to read this book. One of the questions
    many people rise is, "why go through the hassle of manually building a Linux system
    from scratch when you can just download and install an existing one?"'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Linux From Scratch - Version 12.1


    One reason for this project''s existence is to help you learn how a Linux system
    works from the inside out. Building an LFS system demonstrates what Linux tick,
    and how things work together and depend on each other. One of the best things
    this learning experience can provide is the ability to customize a Linux system
    to suit your unique needs.


    Another key benefit of LFS is that it gives you control of the system without
    relying on anyone else''s implementation. With LFS, you are in the driver''s seat.
    You dictate every aspect of your system.


    LFS allows you to create very compact Linux systems. With other distributions
    you are often forced to install a great programs neither we use nor understand.
    These programs waste resources. You may argue that with today''s drives and CPUs,
    wasted resources are no longer a consideration. Sometimes, you are still constrained
    by the system''s size, if nothing else. Unlike booting CDs, USB sticks, and embedded
    systems. Those are where LFS can be beneficial.


    Another advantage of a custom built Linux system is security. By compiling the
    entire system from source code, you are empowered to audit everything and all
    the security patches you want. You don''t have to wait for somebody to compile
    binary packages that fix a security hole. Unless you examine the path and implement
    it, you have no guarantee that the new binary package was built correctly and
    adequately fixes the problem.


    The goal of Linux From Scratch is to build a complete and awesome foundation-level
    system. If you do not wish to build your own Linux system from scratch, you may
    nevertheless benefit from the information in this book.


    There are many good reasons to build your LFS system to list them all. In the
    end, education is by far the most important reason. As you continue your LFS experience,
    you will discover the power that information and knowledge can bring.


    # LFS Target Architectures


    The primary target architectures of LFS are the AMD/Intel x86 (32-bit) and x86_64
    (64-bit) CPUs. On the other hand, the instructions in this book are also known
    to work, with some modifications, with the Power PC and ARM CPUs. To build a system
    that utilizes one of these alternative CPUs, the main prerequisite, in to those
    on the next page, is an existing Linux system such as an earlier LFS installation,
    Ubuntu, Red/Fedora, SuSE, or other system that targets your architecture. (Note
    that a 32-bit distribution can be installed and used as a host system on a 64-bit
    Intel/computer).


    The gain from building on a 64-bit system, as compared to a 32-bit system, is
    minimal. In a test of LFS-9.1 on a i7-4790 many built, using 4 cores, the statistics
    were measured:


    | Architecture | Build Time | Build Size |

    | 32-bit | 239.9 | 3.6 GB |

    | 64-bit | 232.2 | 4.4 GB |


    As you can see, on the same hardware, the 64-bit build is only 3% faster (and
    22% larger) than the 32-bit build. If you plan to use LFS as a LAMP server, or
    a firewall, a 32-bit CPU may be good enough. On the other hand, several packages
    in BLFS need more than 4 GB of RAM to be built and/or; if you plan to use LFS
    as a desktop, the LFS authors recommend building a 64-bit system.


    The default 64-bit build that results from LFS is a “pure” 64-bit system. Building
    a “multi-lib” system requires compiling many applications twice, once for a 32-bit
    system and once for a 64-bit system. This is not directly supported in LFS because
    it would interfere with the educational objective of providing the minimal instructions
    needed for a basic Linux system. Some of the LFS/BLFS editors maintain a multifork
    of LFS, accessible at https://www.linuxfromscratch.org/~thomas/multilib/index.html.
    But that’s an advanced topic.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Prerequisites


    Building an LFS system is not a simple task. It requires a certain level of existing
    knowledge of Unix administration in order to resolve problems and correctly execute
    the commands listed. In particular, as an absolute minimum, you should already
    know how to use the command line (shell) to copy or move files and directories,
    list directory and file contents, and change the current directory. It is also
    expected that you know how to and install Linux software.


    Because the LFS book assumes at least this level of skill, the LFS support forums
    are unlikely to provide you with much assistance in these areas. You will find
    that your questions regarding such basic knowledge will likely go unanswered (or
    you will simply be referred to the LFS essential pre-reading list).


    Before building LFS, make sure you read these articles:


    +   * Software-Building-HOWTO https://tdlp.org/HOWTO/Software-Building-HOWTO.html


    This is a comprehensive guide to building and installing "generic" Unix software
    packages under Linux. Although it was written some time ago, it still provides
    a good summary of the basic techniques used to build and install software.


    +   * Beginner''s Guide to Installing from Source https://moi.vonos.net/linux/beginners-installing-from-source/


    This provides a good summary of the basic skills and techniques needed to build
    software from source code.


    # LFS and Standards


    The structure of LFS follows Linux standards as closely as possible. The primary
    standards are:


    +   * POSIX-1-2008.


    +   * Filesystem Hierarchy Standard (FHS) Version 3.0


    +   * Linux Standard Base (LSB) Version 5.0 (2015)


    The LSB has four separate specifications: Core, Desktop, Runtime Languages, and
    Imaging. Some parts of Core and Desktop specifications are architecture specific.
    There are also two trial specifications: Gtk3 and Graphics. LFS attempts to conform
    to the LSB specifications for the IA32 (32-bit x86) or AMD64 (x86_64) architectures
    discussed in the previous section.


    > Many people do not agree with these requirements. The main purpose of the LSB
    is to ensure that proprietary software can be installed and run on a compliant
    system. Since LFS is source based, the user has complete control over what packages
    are replaced; you may choose not to install some packages that are specified by
    the LSB.


    While it is possible to create a complete system that will pass the LSB certification
    tests "from scratch," this can''t be done without many additional packages that
    are beyond the scope of the LFS book. Installation instructions for these additional
    packages can be found in BLFS.


    # Packages supplied by LFS to satisfy the LSB Requirements


    LSB Core:


    Bash, Bc, Binutils, Coreutils, Diffutils, File, Findutils, Gawk, Grep, Gzip, M4,
    Man-DB, Nurs, Procs, Psmisc, Sed, Shadow, Tar, Util-linux, Zlib'
  merge: -1
  img_proc: true
