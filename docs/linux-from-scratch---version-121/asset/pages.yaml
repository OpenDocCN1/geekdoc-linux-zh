  md: '# Linux From Scratch - Version 12.1


    Alternatively, **make oldconfig** may be more appropriate in some situations.
    See the README for more information.


    If desired, skip kernel configuration by copying the kernel config file, `.config`,
    from the host system (assuming it is available) to the unpacked `linux-6.7.4`
    directory. However, we do not recommend this option. It is better to explore all
    the configuration menus and create the kernel configuration from scratch.


    Compile the kernel image and modules:


    ```

    make

    ```


    If using kernel modules, module configuration in `/etc/modprobe.d` may be required.
    Information pertaining to modules and kernel configuration is located in Section
    9.3, "Overview of Device and Module Handling" and in the kernel documentation
    in `linux-6.7.4/Documentation`. Also, `modprobe.d(5)` may be of interest.


    Unless module support has been disabled in the kernel configuration, install with
    the modules:


    ```

    make modules_install

    ```


    After kernel compilation, additional steps are required to complete the installation.
    Some files need to be copied to the `/boot` directory.


    ![](img/3dbc5668c4490cb993bba10b75fc49f3_284_0.png)


    # Caution


    > If you''ve decided to use a separate `/boot` partition for the LFS system (maybe
    sharing a `/boot` partition with the host distro), the files copied below should
    go there. The easiest way to do that is to create the entry for `/etc/fstab` (the
    first read section for details), then issue the following command as the `root`
    user in the chroot environment:


    ```

    mount /boot

    ```


    The path to the device image may vary depending on the platform being used. The
    filename should be `vmlinuz` to be compatible with the automatic setup of the
    boot process in the next section.


    Generate a symbol file for the kernel. It maps the entry points of every function
    in the kernel API, as as a resource when assembling an x86 architecture:


    ```

    cp arch/x86/boot/bzImage /boot/vmlinux-6.7.4-lfs-12.1

    ```


    System.map is a symbol file for the kernel. It maps the entry points of every
    function in the kernel API, as as the addresses of the kernel data structures
    for the running kernel. It is a resource when investigating kernel problems. Use
    the following command to install the map file:


    ```

    cp -iv System.map /boot/System.map-6.7.4

    ```


    The kernel configuration file `.config` produced by the **make menuconfig** step
    above contains all the configuration selections for the kernel that just compiled.
    It is a good idea to keep this file for future reference:


    ```

    cp -iv .config /boot/config-6.7.4

    ```


    Install the documentation for the Linux kernel:


    ```

    cp -r Documentation -T /usr/share/doc/linux-6.7.4

    ```


    It is important to note that the files in the kernel source directory are not
    owned by `root`. Whenever a package is unpacked as `root` (like we did inside
    chroot), the files have the user and group IDs of whatever they were on the packager''s
    computer. This is usually not a problem for any other package to be installed
    unless the source tree is removed


    266'
