  md: '# # 8.55. Ninja-1.11.1


    Ninja is a small build system with a focus on speed.


    Approximate build time: 0.3 SBU

    Required disk space: 75 MB


    #  8.55.1. Installation of Ninja


    When run, **ninja** normally utilizes the greatest possible number of processes
    in parallel. By default this is the number of cores on the system, plus two. This
    may overheat the CPU, or make the system run out of memory. When **ninja** is
    invoked from the command line, the -jN will limit the number of parallel processes.
    Some packages embed the execution of **ninja**, and do not pass the -j parameter
    to it.


    Using the *optional* procedure below allows you to limit the number of parallel
    processes via an environment variable, NINJOBS. **For example**, setting:


    ```

    export NINJOBS=4

    ```


    If desired, make **ninja** recognize the environment variable NINJOBS by running
    the system editor:


    ```

    sed -i /\int Guess/\\a \

    int j = 0;

    char *jobs = getenv("NINJOBS");\nif (jobs != NULL) j = atoi(jobs);\nif (j > 0)
    return j;\n\'' src/ninja.cc

    ```


    Build Ninja with:


    ```

    python3 configure.py --bootstrap

    ```


    The meaning of *bootstrap*:


    +   --bootstrap

    This parameter forces Ninja to rebuild itself for the current system.


    To test the results, issue:


    ```

    ./ninja ninja_test

    ./ninja_test --gtest_filter=-SubprocessTest.WithLots

    ```


    Install the package:


    ```

    install -vm75 ninja /usr/bin/

    install -vDm664 misc/bash-completion /usr/share/bash-completion/completions/ninja

    install -vDm664 misc/zsh-completion /usr/share/zsh/site-functions/_ninja

    ```


    #  8.55.2. Contents of Ninja


    **Installed programs:** ninja


    # Short Descriptions


    **ninja** is the Ninja build system'
  merge: -1
  img_proc: true
