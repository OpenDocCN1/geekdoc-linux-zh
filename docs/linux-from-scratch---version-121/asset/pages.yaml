  md: "# 6.8. Findutils-4.9.0\n\nThe Findutils package contains programs to find files.\
    \ Programs are provided to search through all the files in a directory tree to\
    \ create, maintain, and search a database (often faster than the recursive find,\
    \ but unreliable unless the database has been updated). Findutils also supplies\
    \ the xargs program, which can be used to run a specified command on each file\
    \ selected by a search.\n\n**Approximate build time:** 0.1 SBU\n**Required disk\
    \ space:** 42 MB\n\n# 6.8.1. Installation of Findutils\n\nPrepare Findutils for\
