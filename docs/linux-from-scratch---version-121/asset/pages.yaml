- pgno: 31
  md: '# Chapter 2. Preparing the Host System


    # 2.1. Introduction


    In this chapter, the host tools needed for building LFS are checked and, if necessary,
    installed. Then a partition which will the host system is prepared. We will create
    the partition itself, create a file system on it, and mount it.


    # 2.2. Host System Requirements


    # 2.2.1. Hardware


    The LFS editors recommend that the system CPU have at least four cores and the
    system at least 8 GB of memory. Older systems that do not meet these requirements
    will still work, but the time to build packages will be significantly longer than
    documented.


    # 2.2.2. Software


    Your host system should have the following software with the minimum versions
    indicated. This should not be an issue for most Linux distributions. Also note
    that many distributions will place software headers into separate packages, often
    in the form of <package-name>-devel or <package-name>-dev. Be sure to install
    those if your distribution provides them.


    Earlier versions of the listed packages may work, but have not been tested.


    +   - Bash-3.2 (/bin/sh should be a symbolic or hard link to bash)

    - Binutils-2.13.1 (Versions greater than 2.42 are not recommended as they have
    not been tested)

    - Bison-2.7 (/usr/bin/yacc should be a link to a bison or a small script that
    executes bison)

    - Coreutils-8.1

    - Diffutils-2.8.1

    - Findutils-4.2.31

    - Gaw-4.0.1 (/usr/bin/awk should be a link to gaw)

    - GCC-5.2 including the C++ compiler, g++ (Versions greater than 13.2.0 are not
    recommended as they have not been tested). C and C++ standard libraries (with
    headers) must also be present so the C++ compiler can build hosted programs

    - Grep-2.5.1a

    - Gzip-1.3.12

    - Linux Kernel-4.19


    The reason for the kernel version requirement is that we specify that version
    when building glibc in Chapter 5 and Chapter 8, the workarounds for older kernels
    are not needed and the compiled glide is slightly faster and smaller. As some
    kernel releases after 4.19 may be the oldest release supported by third-party
    teams, but they are not considered official upstream kernel releases; read https://kernel.org/category/releases.html
    for the details.


    If the host kernel is earlier than 4.19 you will need to replace the kernel with
    a more up-to-date version. There are two ways you can do this. First, if your
    Linux vendor provides a 4.19 or later kernel version. If you may wish to install
    it. If your vendor does not offer an acceptable kernel package, or you would prefer
    not to install it, you can compile a kernel yourself. Instructions for compiling
    the kernel and configuring the boot loader (assuming the host uses GRUB) are located
    in Chapter 10.'
  merge: -1
  img_proc: true
