  md: "# 8.29. Ncurses-6.4-20230520\n\nThe Ncurses package contains libraries for\
    \ terminal-independent handling of character screens.\n\nApproximate build time:\
    \ 0.2 SBU\nRequired disk space: 45 MB\n\n# 8.29.1. Installation of Ncurses\n\n\
    Prepare Ncurses for compilation:\n\n```\n./configure --prefix=/usr \\\n  --mandir=/usr/share/man\
    \ \\\n  --with-shared \\\n  --without-debug \\\n  --without-normal \\\n  --with-cxx-shared\
    \ \\\n  --enable-pc-files \\\n  --enable-wide \\\n  --with-pkg-config=/usr/lib/pkgconfig\n\
    ```\n\nThe meaning of the new configure options:\n\n--with-shared\nThis makes\
    \ Ncurses build and install shared C libraries.\n\n--without-normal\nThis prevents\
    \ Ncurses building and installing static C libraries.\n\n--without-debug\nThis\
    \ prevents Ncurses building and installing debug libraries.\n\n--with-cxx-shared\n\
    This makes Ncurses build and install shared C++ bindings. It also prevents building\
    \ and installing static C + bindings.\n\n--enable-pc-files\nThis switch generates\
    \ and installs .pc files for pkg-config.\n\n--enable-wide\nThis switch wide-character\
    \ libraries (e.g., libcursessw.so.6.4) to be built instead of normal ones (e.g.,\
    \ libcurses.so.6.4). These wide-character libraries are usable in both multibyte\
    \ and traditional 8-bit locales, while normal libraries work properly only in\
    \ 8-bit locales. Wide-character and normal libraries are source-compatible, but\
    \ not binary-compatible.\n\nCompile the package:\n\n```\nmake\n```\n\nThis package\
    \ has a test suite, but it can only be run after the package has been installed.\
    \ The tests reside in the test/directory. See the README file in that directory\
    \ for further details."
