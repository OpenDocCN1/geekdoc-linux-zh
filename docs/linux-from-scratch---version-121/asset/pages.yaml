- pgno: 316
  md: "# Appendix D. Boot and sysconfig scripts version-20230728\n\nThe scripts in\
    \ this appendix are listed by the directory where they normally reside. The order\
    \ is /etc/rc.d/init.d, /sysconfig, /etc/sysconfig/network-devices, and /etc/sysconfig/network-devices/services.\
    \ Within each section, the files are listed in order they are normally called\n\
    \n# D.1. /etc/rc.d/init.rc\n\nThe rc script is the first script called by init\
    \ and initiates the boot process.\n\n```\n#!/bin/bash\n######################################################################\n\
    # Begin rc\n# Description : Main Run Level Control Script\n# Authors : Gerard\
    \ Beekmans - gerard@linuxfromscratch.org\n# DL Lucas - djluc@linuxfromscratch.org\n\
    # Updates : Bruce Dubbs - dbubbs@linuxfromscratch.org\n# : Pierre Labastie - pierre@linuxfromscratch.org\n\
    # Version : LFS 7.0\n# Notes : Updates March 24th, 2022: new semantics of S/K\
    \ files\n- Instead of testing that S scripts were K scripts in the previous release,\
    \ test that they were not S scripts\n- Instead of testing that K scripts were\
    \ S scripts in the previous release, test that they were not K scripts\n- S scripts\
    \ in runlevel 0 or 6 are now run with\n- \"script start\" (was \"script stop\"\
    \ previously).\n######################################################################\n\
    \n./lib/ls/init-functions\nlog_error_msg() {\n  # $i is set when called\n  MSG=\"\
    FAILURE:\\n\\nYou should not be reading this error message.\\n\\n\"\n  MSG=\"\
    $($MSG)It means that an unforeseen error took place in\\n\"\n  MSG=\"$($i),\\\
    n\"\n  MSG=\"$($MSG)which exited with a return value of $\\${error_value}.\\n\"\
    \n\nMSG=\"$($MSG)If you can track this error down to a bug in one of\\n\"\n  MSG=\"\
    $($MSG)the files provided by the $${DISTRO_MINI} book,\\n\"\n  MSG=\"$($MSG)please\
    \ be so kind to inform us at $${DISTRO_CONTACT}.\\n\"\n  log_failure_msg \"$${MSG\"\
    \n\nlog_info_msg \"Press Enter to continue...\"\n  wait_for_user\n}\n\ncheck_script_status()\
    \ {\n  # $i is set when called\n  if [ ! -f $${i} ]; then\n    log_warning_msg\
    \ \"$${i} is not a valid symlink.\"\n    SCRIPT_STAT=\"*1\"\n}\n```"
  merge: -1
  img_proc: true
