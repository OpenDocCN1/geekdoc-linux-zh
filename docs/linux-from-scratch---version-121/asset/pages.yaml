- pgno: 167
  md: "# Linux From Scratch - Version 12.1\n\nThe installation of this package will\
    \ overwrite libncursesws.so.6-in. It may crash the shell process which is using\
    \ code and data from the library file. Install the package with DESTDIR, and replace\
    \ the library correctly using install (the header curs.h is edited to ensure the\
    \ wide-character ABI is as we've done in Section 6.3, \"Ncurses-6.4-20230520\"\
    )\n\n```\nmake DESTDIR=$PWD install\ninstall -vm75 dest/usr/lib/libncursesws.so.6\
    \ /usr/lib\nrm -v dest/usr/lib/libncursesws.so.6\nsed -e 's/\\.*XOPEN*/#if 1\\\
    /'\n-i dest/include/curses.h\ncp -av dest/include/curses.h\n```\n\nMany applications\
    \ expect the linker to be able to link Ncurses libraries. Trick this by linking\
    \ with wide-character libraries by means of symlinks (note that the .so links\
    \ are safe with curses.h edited to use the wide-character ABI)\n\n```\nfor lib\
    \ in ncurses panel menu; do\n  ln -sfv $(lib)w.so /usr/lib/lib$(lib).so\n  ln\
    \ -sfv $(lib)w.pc /usr/lib/pkgconfig/$(lib)\ndone\n```\n\nFinally, make that all\
    \ applications look for -curses at build are still buildable:\n\n```\nln -sfv\
    \ libncursesws.so /usr/lib/libncurses.so\n```\n\nIf desired, install the Ncurses\
    \ documentation:\n\n```\ncp -v -R doc -T /usr/share/doc/ncurses-6.4-20230520\n\
    ```\n\n> Note\n\nThe instructions above do not create wide-character Ncurses libraries\
    \ since no package installed by compiling sources would link against them at runtime.\
    \ However, the only known binary-only applications that link against non-character\
    \ Ncurses libraries require version 5. If you must have such libraries because\
    \ of some binary-only application or to be compliant with LSB, build the package\
    \ with the following commands:\n\n```\nmake distclean\n  ./configure --prefix=/usr\
    \ \\\n  --with-shared \\\n  --without-normal \\\n  --without-debug \\\n  --with-cxx-binding\
    \ \\\n  --with-abi-version=5\nmake sources install\ncp -av lib/lib*.so* /usr/lib\n\
    ```\n\n# ## 8.29.2. Contents of Ncurses\n\n+   - Installed programs: captoinfo\
    \ (link to tic), infocmp, infotap (link to tic), ncursesw6-config, reset (link\
    \ to tset), tabs, tic, to poet, and tset\n- Installed libraries: libcurses.so\
    \ (symlink), libform.so (symlink), libformw.so, libmenu.so (symlink), libmenuw.so,\
    \ libncurses.so (symlink), libncursesws.so, libncurses++.so, libpanel.so (symlink),\
    \ and libpanelw.so,\n- Installed directories: /usr/share/tabset,/usr/share/terminfo,\
    \ and /usr/share/doc/ncurses-6.4-20230520\n\n149"
