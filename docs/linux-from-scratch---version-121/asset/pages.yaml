- pgno: 261
  md: 'The sysfs Filesystem https://www.kernel.org/pub/linux/kernel/moches/doc/papers/ols-2005/model.pdf


    # # 9.4. Managing Devices


    # ## 9.4.1. Network Devices


    Udev, by default, names devices according to Firmware/BIOS data or physical characteristics
    like the bus, slot, or MAC address. The purpose of this naming convention is to
    ensure that network devices are named consistently, not based on whether the network
    card was discovered. In older versions of Linux—on a computer with two network
    cards made by Intel and Realtek, for instance—the network card manufactured by
    Intel might have eth0 while the Realtek card has eth1. After a reboot, the udev
    would sometimes get the other way around.


    In the new naming scheme, typical network device names are like enp5s0 or wlp3s0.
    If this naming is not desired, the traditional naming scheme, or a custom scheme,
    can be implemented.


    # ### 9.4.1.1. Disabling Persistent Name on the Kernel Command Line


    The traditional naming scheme using eth0, eth1, etc. can be restored by adding
    net.ifnames=0 to the command line. This is most appropriate for systems that have
    one ethernet device of a particular type. Laptops often have two ethernet connections
    named eth0 and wlan0; such laptops can also use this method. The command line
    is in the GRUB configuration file. See Section 10.4.4,"Creating the GRUB Configuration
    File".


    # ### 9.4.1.2. Creating Udev Rules


    The naming scheme can be customized by creating custom udev rules. A script has
    been included that generates the initial rules. Generate these rules by running:


    ```

    bash /usr/lib/udev/init-net-rules.sh

    ```


    Now, inspect /etc/udev/rules.d/70-persistent-net.rules to find out which name
    was assigned to which network device:


    ```

    cat /etc/udev/rules.d/70-persistent-net.rules

    ```


    > Note

    In some cases, as when MAC addresses have been assigned to a network card manually,
    or in a virtual environment as Qemu or Xen, the network rules file may not be
    generated because addresses are not consistently assigned. In these cases, this
    method cannot be used.


    The file begins with a comment block, followed by two lines for each NIC. The
    first line for each NIC is a comment describing its hardware IDs (e.g. its PCI
    vendor and device IDs, if it''s a PCI card), along with its driver (in parentheses,
    if the driver can be found). Neither the hardware ID nor the driver is used to
    determine which name to give an interface; this information is only for reference.
    The second line is the udev rule that matches this NIC and actually assigns it
    a name.


    All udev rules are made of several keywords, separated by commas and optional
    whitespace. Here are the keywords, and an explanation of each:


    +   - SUBSYSTEM="net" - This tells udev to ignore devices that are not network
    cards.

    - ACTION="add" - This tells udev to ignore this for a uevent that isn''t an ("remove")
    and "change" uevents also happen, but don''t need to rename network interfaces.'
  merge: -1
  img_proc: true
