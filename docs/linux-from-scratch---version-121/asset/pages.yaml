  md: '# 82. About Debugging Symbols


    Most programs and libraries are, by default, compiled with debugging symbols included
    (with `gcc -g` option). This means when debugging a program or library that was
    compiled with debugging information, the debugger can provide not only memory
    addresses, but also the names of the routines and variables.


    The inclusion of these debugging symbols enlarges a program or library significantly.
    Here are two examples of the amount of space they occupy:


    +   - A bash binary with debugging symbols: 1200 KB


    +   - A bash binary without debugging symbols: 480 KB (60% smaller)


    +   - Glibc and GCC files (`/lib` and `/usr/lib`) with debugging symbols: 87 MB


    +   - Glibc and GCC files without debugging symbols: 16 MB (82% smaller)


    Sizes vary depending on which compiler and C library were used, a program that
    has been stripped of debugging symbols is usually 50% to 80% smaller than its
    unstipped counterpart. Most users will never use a debugger on their system software,
    a lot of disk space can be regained by removing these symbols. The next section
    shows how to strip all debugging symbols from the programs and libraries.


    # 83. Stripping


    This section is optional. If the intended user is not a programmer and does not
    plan to do any debugging of the system, the system''s size can be decreased by
    2 GB by removing the debugging symbols, and some symbol table entries, from binaries
    and libraries. This causes no real inconvenience for typical Linux user.


    Most people who use the commands below do not experience any difficulties. However,
    it is easy to make a mistake and render the new system unusable. Before running
    the `strip` commands, it is a good idea to make a backup of a LFS system in its
    current state.


    A `strip` command with the `--strip-needed` option removes all debug symbols from
    a binary or library. It removes all symbol table entries not needed by the linker
    (for static libraries) or dynamic linker (for dynamically linked binaries and
    shared libraries).


    The debugging symbols from selected libraries are compressed with Zlib and preserved
    in separate files. That debugging information is needed for regression tests with
    `valgrind` or `gdb`, in BLFS.


    Note that `strip` will overwrite the binary or library file it is processing.
    If running strip is active, the binary or library being stripped can be destroyed;
    this can make the system completely unusable. To avoid this copy some libraries
    and binaries into `~/tmp`, strip them, then reinstall them with the `install`
    command. (The related entry in Section 8.2.1, “Upgrade Issues” gives the rationale
    for using the `install` command here.)


    > Note

    The ELF loader''s name is ld-linux-x86-64.so.2 on 64-bit systems and ld-linux.so.2
    on 32-bit systems. The construct below selects the correct name for the current
    architecture, excluding anything ending with _g, in the cases below have already
    been run.'
  merge: -1
  img_proc: true
