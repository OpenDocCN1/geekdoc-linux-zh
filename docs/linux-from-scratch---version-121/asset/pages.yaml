  md: "# # 8.47. OpenSSL-3.2.1\n\nThe OpenSSL package contains management tools and\
    \ libraries relating to cryptography. These are useful for providing cryptographic\
    \ functions to other packages, such as OpenSSH, email applications, and web browsers\
    \ (for accessing HTTPS sites).\n\nApproximate build time: 1.8 SBU\nRequired disk\
    \ space: 805 MB\n\n# ## 8.47.1. Installation of Compilation\n\nPrepare OpenSSL\
    \ for compilation:\n\n```\n./config --prefix=/usr \\\n  --openssldir=/etc/ssl\
    \ \\\n  --libdir=lib \\\n  shared \\\n  zlib-dynamic\n```\n\nCompile the package:\n\
    \n```\nmake\n```\n\nTo test the results, issue:\n\n```\nHARNESS_JOBS=$(nproc)\
    \ make test\n```\n\nOne test, test30-afalg.t, is known to fail if the host kernel\
    \ does not have CONFIG_CRYPTO_USER_API_SCIPHER enabled, or does not have any options\
    \ providing an AES with CBC implementation (for example, the combination of CONFIG_CRYPTO_AES\
    \ and CONFIG_CRYPTO_CBC, or CONFIG_CRYPTO_AES_NI_INTEL if the CPU supports AES-NI\
    \ enabled). If it fails, it can be safely ignored.\n\nInstall the package:\n\n\
    ```\nsed -i '/INSTALL_LIBS/libcrypto.so a libssl.a//' Makefile\nmake MANSUFFIX=-ssl\
    \ install\n```\n\nAdd the version to the documentation directory name, to be consistent\
    \ with other packages:\n\n```\nmv -v /usr/share/doc/openssl /usr/share/doc/openssl-3.2.1\n\
    ```\n\nIf desired, install some additional documentation:\n\n```\ncp -vfr doc/*\
    \ /usr/share/doc/openssl-3.2.1\n```\n\n> Note\n\nYou should update OpenSSL when\
    \ a new version which fixes vulnerabilities is announced. Since OpenSSL 3.0.0,\
    \ the OpenSSL versioning scheme follows the MAJOR.MINOR.PATCH format. API/ABI\
    \ compatibility is guaranteed for the same MAJOR version number. Because LFS installs\
    \ only the shared libraries, there is no need to recompile packages which link\
    \ to libcrypto.so or libssl.so when upgrading to a version with the same MAJOR\
    \ version number.\n\nHowever, any running programs linked to these libraries need\
