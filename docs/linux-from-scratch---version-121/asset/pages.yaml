- pgno: 14
  md: '# Linux From Scratch - Version 12.1


    +   - Make

    This package contains a program for directing the building of packages. It is
    required by almost every package in LFS.


    +   - Man-DB

    This package contains programs for finding and viewing man pages. It was chosen
    instead of the man package because of its superior internationalization capabilities.
    It supplies the man program.


    +   - Man-pages

    This package provides the actual contents of the basic Linux man pages.


    +   - Meson

    This package provides a software tool for automating the building of software.
    The main goal of Meson is to minimize the amount of time that software developers
    need to spend configuring a build system. Systemd, as well as many BLFS packages.


    +   - MPC

    This package supplies arithmetic functions for complex numbers. It is required
    by GCC.


    +   - MPFR

    This package contains functions for multiple precision arithmetic. It is required
    by GCC.


    +   - Ninja

    This package furnishes a small build system with a focus on speed. It is designed
    to have its input files generated by a higher-level build system, and to run builds
    as fast as possible. This package is required by Meson.


    +   - Ncurses

    This package contains libraries for terminal-independent handling of screen characters.
    It is often used to provide cursor control for a menus system. It is needed by
    a number of the packages in LFS.


    +   - Opensl

    This package provides management tools and libraries relating to cryptography.
    These supply cryptographic functions to other packages, including the Linux kernel.


    +   - Patch

    This package contains a program for modifying or creating files by applying a
    patch file typically created by the diff program. It is needed by the build procedure
    for several LFS packages.


    +   - Perl

    This package is an interpreter for the runtime language PERL. It is needed for
    the installation and test suites of several LFS packages.


    +   - Pkgconfig

    This package contains a program which helps configure compiler and linker flags
    for development libraries. The program can be used as a drop-in replacement of
    pkg-config, which is needed by the building system of many packages. It is maintained
    more actively and slightly faster than the original Pkg-config package.


    +   - Proctps-NG

    This package contains programs for monitoring processes. These programs are useful
    for system administration, and are also used by the LFS Scripts.'
  merge: -1
  img_proc: true
