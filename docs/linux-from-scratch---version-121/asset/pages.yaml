    \ than 0.1 SBU\nRequired disk space: 16 MB\n\n# 8.11.1. Installation of Readline\n\
    \nReinstalling Readline will cause the old libraries to be moved to <libraryname>.old.\
    \ While this normally not a problem, in some cases it can trigger a linking bug\
    \ in ldconfig. This can be avoided by using the following two seeds:\n\n```\n\
    sed -i '/^old/d' Makefile.in\nsed -i '/(OLDSCOFF)/c: support/shlib-install\n```\n\
    \nNow fix a problematic upstream:\n\n```\npatch -Npl -i ../readline-8.2-upstream-fixes-3.patch\n\
    ```\n\nPrepare Readline for compilation:\n\n```\n./configure --prefix=/usr \\\n\
    \    --disable-static \\\\\n    --with-curses \\\\\n    --docdir=/usr/share/doc/readline-8.2\n\
    ```\n\nThe meaning of the new configure option:\n\n```\n--with-curses\n```\n\n\
    This option tells Readline that it can find the termcap library functions in the\
    \ curses library, not a separate termcap library. This will generate the readline.pc\
