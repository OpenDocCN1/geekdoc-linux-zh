  md: "# ## 8.26. Libcrypt-4.4.36\n\nThe Libcrypt package contains a modern library\
    \ for one-way hashing of passwords.\n\nApproximate build time: 0.1 SBU\nRequired\
    \ disk space: 15 MB\n\n# ### 8.26.1. Installation of Libcrypt\n\nPrepare Libcrypt\
    \ for compilation:\n\n```\n./configure --prefix=/usr \\\\\\n  --enable-hashes=strong,glibc\
    \ \\\\\\n  --enable-obsolete-api=no \\\n  --disable-static \\\\\\n  --disable-failure-tokens\n\
    ```\n\nThe meaning of the new configure options:\n\n--enable-hashes=strong, glibc\n\
    Build strong hash algorithms recommended for security use cases, and the hash\
    \ algorithms provided by traditional Glibc libcrypt for compatibility.\n\n--enable-obsolete-api=no\n\
    Disable obsolete API functions. They are not needed for a modern Linux system\
    \ built from source.\n\n--disable-failure-tokens\nDisable failure token feature.\
    \ It's needed for compatibility with the traditional hash libraries of some platforms,\
    \ but a Linux system based on Glibc does not need it.\n\nCompile the package:\n\
    \n```\nmake\n```\n\nTo test the results, issue:\n\n```\nmake check\n```\n\nInstall\
    \ the package:\n\n```\nmake install\n```\n\n> Note\nThe instructions above disabled\
    \ obsolete API functions since no package installed by compiling from sources\
    \ would link against them at runtime. the only known binary-only applications\
    \ that link against these require ABI version 1. If you must have such functions\
    \ because of some binary-only application or to be compliant with LSB, build the\
    \ package with the following commands:\n\n```\nmake distclean\n./configure --prefix=/usr\
    \ \\\\\\n  --enable-hashes=strong, glibc \\\\\\n  --enable-obsolete-api=no \\\\\
    \\n  --disable-static \\\\\\n  --disable-failure-tokens\n```\n\n```\nmake\ncp\
    \ -av --remove-destination libs/libcrypt.so.1 */usr/lib\n```"
