  md: "An interactive login shell is started after a successful login, using /bin/login,\
    \ by reading the /etc/passwd file. An interactive non-login shell is started at\
    \ the command-line (e.g. [prompt]$/bin/bash). A non-interactive shell is present\
    \ when a script is running. It is non-interactive if it is processing and not\
    \ waiting for user input commands.\n\nCreate the /etc/profile once the profile\
    \ locales have been determined to set the desired locale, and set the c locale\
    \ instead of running in the Linux console (to prevent programs from outputting\
    \ characters that the Linux console is unable to render):\n\n```\ncat > /etc/profile\
    \ << \"EOF\"\n# Begin /etc/profile\n\nfor i in $(locale); do\n  unset $($i*)\n\
    done\n\nif [ \"$TERM\" = linux ]; then\n  export LANG=C.UTF-8\nelse\n  export\
    \ LANG=C_LL.<charset>@modifiers>\nfi\n\n# End /etc/profile\nEOF\n```\n\nThe c\
    \ (default) and en_US (the recommended for United States English users) locales\
    \ are different. c uses the US-ASCII 7-bit character set, and treats bytes with\
    \ high bit set as invalid characters. That's why, e.g., the ls substitutes them\
    \ with question marks in that locale. Also, an attempt to send mail with characters\
    \ from Mutt or Pine Results in non-RFC-conforming messages being sent (the charset\
    \ in the outgoing mail) is indicated as unknown 8-bit. It's suggested that you\
    \ use the c locale only if you are certain that you will never need 8-bit characters.\n\
    \n# # 9.8. Creating and editing the /etc/inputrc\n\nThe inputrc file is the configuration\
    \ file for the readline library, which provides editing capabilities that the\
    \ user is entering a line in the terminal. It works by translating keyboard inputs\
    \ into specific actions. Readline is used by bash and other shells as well as\
    \ many other applications.\n\nMost people do not need user-specific functionality\
    \ so the command below creates a global /etc/inputrc used by everyone who logs\
    \ in. If you later decide you to override the defaults on a per user basis, you\
    \ can create a .inputrc file in the user's home directory with the modified mappings.\n\
    \nFor more information on how to edit the inputrc file, see bash under the Readline\
    \ It File section. info readline is also a good source of information."
