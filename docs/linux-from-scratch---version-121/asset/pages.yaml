  md: 'This package supplies programs for basic network administration.


    +   - Intltool


    This package contributes tools for extracting translatable strings from source
    files.


    +   - IPRoute2


    This package contains programs for basic and advanced IPv4 and IPv6 networking.
    It was chosen over the other common network tools (net-tools) for its IPv6 capabilities.


    +   - Kbd


    This package produces key-table files, keyboard utilities for non-US keyboards,
    and a number of console fonts.


    +   - Kmod


    This package supplies programs needed to administer Linux kernel modules.


    +   - Less


    This package contains a very nice text file viewer that allows scrolling up or
    down when viewing a file. Many packages use it for paging the output.


    +   - Libcap


    This package implements the userspace interfaces to the POSIX 1003.1e capabilities
    available in Linux kernels.


    +   - Libfelf


    The elftools project provides libraries and tools for ELF files and DWARF data.
    Most utilities in this package are available in other packages, but the library
    is needed to build the Linux kernel using the default (and most efficient) configuration.


    +   - Libffi


    This package implements a portable, high level programming interface to various
    calling conventions. Some programs may not be told at run-time about the number
    and types of arguments used to call a given function. For instance, an interpreter
    may be told at run-time about the number and types of arguments used to call a
    given function. Libffi can be used in such programs to provide a bridge from the
    interpreter to compiled code.


    +   - Libpipeline


    The Libpipeline supplies a library for manipulating pipelines of subprocesses
    in a flexible and convenient way. It is required by the Man-DB package.


    +   - Libtool


    This package contains the GNU generic library support script. It wraps the complexity
    of shared libraries into a consistent, portable interface. It is needed by the
    test suites in other LFS packages.


    +   - Libcrypt


    This package provides the `crypt` library needed by various packages (notably,
    Shadow) for hashing packages. It replaces the obsolete `crypt` implementation
    in Glibc.


    +   - Linux Kernel


    This package is the Operating System. It is the Linux in the GNU/Linux environment.


    +   - M4


    This package provides a general text macro processor useful as a build tool for
    other programs.'
