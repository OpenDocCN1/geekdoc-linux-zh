- pgno: 72
  md: "# 5.5. Glibc-2.39\n\nThe Glibc package contains the main C library. This library\
    \ provides the basic routines for allocating memory, searching directories, opening\
    \ and closing files, reading and writing files, string handling, pattern matching,\
    \ arithmetic, and so on.\n\n**Approximate build time:** 1.5 SBU\n**Required disk\
    \ space:** 846 MB\n\n# 5.5.1. Installation of Glibc\n\nFirst, create a symbolic\
    \ link for LSB compliance. Additionally, for x86_64, create a compatibility symbolic\
    \ link required for proper operation of the dynamic library:\n\n```\ncase ($name\
    \ -m in)\n  i?86) ln -svf ld-linux.so.2 $LFS/lib/ld-lsb.so\n  ;;\n  x86_64) ln\
    \ -svf ../lib/ld-linux-x86-64.so.2 $LFS/lib64\n    ln -svf ../lib/ld-linux-x86-64.so.2\
    \ $LFS/lib64/ld-lsb-x86-64.so\n  ;;\nesac\n```\n\n> Note\nThe above command is\
    \ correct. The ln command has several syntactic versions, but be sure to check\
    \ info coreutils and ln(1) before reporting what may appear to be an error.\n\n\
    Some of the Glibc programs use the non-FHS-compliant `/var/db` directory to store\
    \ their runtime data. Apply the following patch to make such programs store runtime\
    \ data in the FHS-compliant locations:\n\n```\npatch -Npl1 -i ../glibc-2.39-fha-1.patch\n\
    ```\n\nThe Glibc documentation recommends building Glibc in a dedicated build\
    \ directory:\n\n```\nmkdir build\ncd build\n```\n\nEnsure that the ldconfig and\
    \ sln utilities are installed into `/usr/sbin`:\n\n```\necho \"rootsbindir=/usr/sbin\"\
    \ > configparams\n```\n\nNext, prepare Glibc for compilation:\n\n```\n./configure\
    \ --prefix=/usr\n--host=$LFS_TGT\n--build=$(../scripts/config.guess)\n--enable-kernel=4.19\n\
    --with-headers=$LFS/usr/include\n--disable-ncd\nlibov_slibdir=/usr/lib\n```\n\n\
    The meaning of the following options:\n\n```\n--host=$LFS_TGT, --build=$(../scripts/config.guess)\n\
    ```\n\nThe combined effect of these switches is that Glibc's build system configures\
    \ itself to be cross-compiled, using the cross-linker and cross-compiler in $LFS/tools."
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Linux From Scratch - Version 12.1


    --enable-kernel=4.19

    This tells Glibc to compile the library with support for 4.19 and later Linux
    kernels. Workarounds for older kernels are not enabled.


    --with-headers=$LFS/usr/include

    This tells Glibc to compile itself against the headers recently installed in the
    $LFS/usr/include directory, so that it knows exactly what features the kernel
    has and can optimize itself accordingly.


    libc_cv_libdir=/usr/lib

    This ensures that the library is installed in /usr/lib instead of the default
    /lib64 on 64-bit machines.


    --disable-nscd

    Do not build the name cache daemon which is no longer used.


    During this stage the following warning might appear:


    ```

    ```

    configure:

    *** These auxiliary programs are missing

    *** incompatible versions: msgfmt

    *** some features will be disabled.

    *** Check the INSTALL file for required versions.

    ```

    ```


    The missing or incompatible msgfmt program is generally harmless. This msgfmt
    program is part of the Ggetext package, which the host distribution should provide.


    > There have been reports that this package may fail when building as a "parallel
    make." If that occurs, rerun the command with the -j option.


    Compile the package:


    ```

    make

    ```


    Install the package:


    > If is not properly set, and despite the recommendations, you are building as
    root, the next command will install the newly built Glibc to your host system,
    which will almost render it unusable. Double-check that the environment is correct,
    and that you are not root, before running the following command.


    ```

    make DESTDIR=$LFS install

    ```


    The meaning of make install option:


    DESTDIR=$LFS

    DESTDIR variable is used by almost all packages to define the location where the
    package should be installed. If it is not set, it defaults to the (/) directory.
    Here we specify that the package is installed in $LFS, which will become the root
    directory in Section 7.4, "Entering the Chroot Environment".


    Fix a hard cod to the executable in the ldd script:


    ```

    sed ''/LDTLLIBRARY=s@@|$LFS|g'' $LFS/usr/bin/ldd

    ```'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# Caution


    At this point, it is imperative to stop and ensure that the basic functions (compiling
    and linking) of the new toolchain are working as expected. To perform a sanity
    check, run the following commands:


    ```

    echo ''int main()'' | $LFS_TGT-gcc -xc

    readelf -l a.out | grep 1d-ld-linux

    ```


    If everything is working correctly, there should be no errors, and the output
    of the last command will be of the form:


    ```

    [Requesting program interpreter: /lib64/ld-linux-x86-64.so.2]

    ```


    Note that for 32-bit machines, the interpreter name will be /lib/ld/ld-linux.so.2.


    If the output is not as shown above, or if there is no output at all, then something
    is wrong. Investigate and retrace the steps to find out where the problem is and
    correct it. This issue must be resolved before continuing.


    Once all is well, clean up the test file:


    ```

    rm -v a.out

    ```


    # Note


    Building the packages in the next chapter will serve as an additional check that
    the toolchain has been built properly. If some package, especially Binutils-pass2
    or GCC-pass2, fails to build, it is an indication that something has gone wrong
    with the preceding Binutils, GCC, or Glibc installations.


    Details on this package are located in Section 8.5.3, “Contents of Glibc.”'
  merge: -1
  img_proc: true
- pgno: 75
  md: "# 5.6. Libstdc++ from GCC-13.2.0\n\nLibstdc++ is the standard C++ library.\
    \ It is needed to compile C++ code (part of GCC is written in C++), but we had\
    \ to defer its installation when we build gcc-pass1 because Libstdc++ depends\
    \ on Glibc, which was not yet available in the target directory.\n\nApproximate\
    \ build time: 0.2 SBU\nRequired disk space: 1.1 GB\n\n# 5.6.1. Installation of\
    \ Target Libstdc++\n\n> Note\nLibstdc++ is part of the GCC sources. You should\
    \ first unpack the GCC tarball and change to the gcc-13, 2.0 directory.\n\nCreate\
    \ a separate build directory for Libstdc++ and enter it:\n\n```\nmkdir -v build\n\
    cd build\n```\n\nPrepare Libstdc++ for compilation:\n\n```\n../libstdc++-v3/configure\
    \ \\\\\n  --host=$LFS_TGT \\\\\n  --build=$$(config.guess) \\\\\n  --prefix=/usr\
    \ \\\\\n  --disable-multilib \\\\\n  --disable-nls \\\\\n  --disable-libstdc++-pch\
    \ \\\\\n  --with-gxx-include-dir=/tools/LFS_TGT/include/c++/13.2.0\n```\n\nThe\
    \ meaning of the configure options:\n\n+   --disable-libstdc++-pch\nThis prevents\
    \ the installation of precompiled include files, which are not needed at this\
    \ stage.\n--with-gxx-include-dir=/tools/LFS_TGT/include/c++/13.2.0\nThis specifies\
    \ the installation directory for include files. Because Libstdc++ is the standard\
    \ C++ library for LFS, this directory should match the location where the C++\
    \ compiler ($LFS_TGT-g++) will search for the C++ include files. In a normal build,\
    \ this information is automatically passed to the Libstdc++ configure options\
    \ from the top level directory. In case, this information must be explicitly given.\
    \ The C++ compiler will prepend the sysroot $LFS (specified when building GCC-pass1)\
    \ to the include file path, so it will accurately search in /tools/$LFS_TGT/include/c++/13.2.0.\
    \ The combination of the DESTDIR variable (in the make install command below)\
    \ and this switch causes headers to be installed there.\n\nCompile Libstdc++ by\
    \ running:\n\n```\nmake\n```\n\nInstall the library:\n\n```\nmake DESTDIR=$LFS\
    \ install\n```"
