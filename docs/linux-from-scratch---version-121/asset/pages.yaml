  md: '# ## 8.42. Perl-5.38


    The Perl package contains the Practical Extraction and Report Language.


    **Approximate build time:** 1.5 SBU Required disk space: 239 MB


    # ### 8.42.1. Installation of Perl


    This version of Perl builds the Compress::Raw::ZLib and Compress::Raw::BZip modules.
    By default Perl will use an internal copy of the sources for the build. Issue
    the following command so that Perl will use the libraries installed on your system:


    ```

    export BUILD_ZLIB=False

    export BUILD_BZIP=0

    ```


    To have control over how Perl is set up, you can remove the "-des" options from
    the following command and hand-pick which package is built. Alternatively, use
    the command exactly as shown below to let the default auto-detects:


    ```

    sh Configure -des

    -Dprefix=/usr

    -Dvendorprefix=/usr

    -Dperivib=/usr/lib/perl5/5.38/core_perl

    -Darchlib=/usr/lib/perl5/5.38/core_perl

    -Dsitelib=/usr/lib/perl5/5.38/site_perl

    -Dsitearch=/usr/lib/perl5/5.38/site_perl

    -Dvendorlib=/usr/lib/perl5/5.38/vendor_perl

    -Dvendorcharch=/usr/lib/perl5/5.38/vendor_perl

    -Dman1dir=/usr/share/man/man1

    -Dman3dir=/usr/share/man/man3

    -Dpage=/usr/bin/less -is"

    -Duseteshplib

    -Dusetthreads

    ```


    The meaning of the new Configure options:


    -Dpage="/usr/bin/less -is"

    This ensures that less is used instead of more.


    -Dman1dir=/usr/share/man/man1 -Dman3dir=/usr/share/man/man3

    Since Grief is not installed, **Configure** will not create man pages for Perl.
    These parameters override this default.


    -Duseteshplib

    Build Perl with support for threads.


    Compile the package:


    ```

    make

    ```


    To test the results (approximately 11 SBU), issue:


    ```

    TEST_JOBS=$(nproc) make test_harness

    ```


    Install the package and clean up:


    ```

    make install

    unset BUILD_ZLIB BUILD_BZIP2

    ```'
  merge: -1
  img_proc: true
