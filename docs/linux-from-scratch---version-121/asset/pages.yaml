  md: '# 8.16. Expect-5.45.4


    The Expect package contains tools for automating, via scripted dialogues, interactive
    applications such as telnet, fett, passwd, tip, login. Expect is also useful for
    testing these applications as well as easing all sorts of tasks that are prohibitively
    difficult with anything else. The DeJNu framework is written in Expect.


    Approximate build time: 0.2 SBU

    Required disk space: 3.9 MB


    # 8.16.1. Installation of Expect


    Expect PTYs to work. Verify that the PTYs are working properly inside the chroot
    environment by performing a simple test:


    ```

    python3 -c ''from pty import spawn; spawn(["echo", "ok\''])''

    ```


    This command should output ok. If instead, the output indicates OSError: out of
    pty devices, then the environment is not set up for PTY operation. You need to
    exit the chroot environment, read Section 7.3,,"Preparing Kernel File Systems"
    again, and ensure the devpts file system (and other kernel file systems) mounted
    correctly. Reenter the chroot environment following Section 7.4,"Entering the
    Chroot Environment". This issue needs to be resolved before continuing, or the
    tests requiring Expect (for example the test suites of Bash, Binutils, GDB, and
    of course Expect itself) will fail catastrophically, and other subtle breakages
    may also happen.


    Prepare Expect for compilation:


    ```

    /configure --prefix=/usr \

    --with-tcl=/usr/lib \

    --enable-shared \

    --mandir=/usr/share/man \

    --with-tinclude=/usr/include

    ```


    The meaning of the configure options:


    ```

    --with-tcl=/usr/lib

    --with-tinclude=/usr/include

    ```


    This parameter is needed to tell configure where tclConfig.sh script is located.

    This explicitly tells Expect where to find Tcl''s internal headers.


    Build the package:


    ```

    make

    ```


    To test the results, issue:


    ```

    make test

    ```


    Install the package:


    ```

    make install

    ln -svf expect5.45.4/libexpect5.45.so /usr/lib

    ```


    # 8.16.2. Contents of Expect


    Installed program: expect

    Installed library: libexpect5.45.so'
