  md: "# # 8.52. Flit-Core-3.9.0\n\nFlit-core is the distribution-building parts of\
    \ Flit (a packaging tool for simple Python modules).\n\n**Approximate build time:**\
    \ less than 0.1 SBU\nRequired disk space:** 1.6 MB\n\n# ## 8.52.1. Installation\
    \ of Flit-Core\n\nBuild the package:\n\n```\npip3 wheel -w dist --no-cache-dir\
    \ --no-build-isolation --no-deps $PWD\n```\n\nInstall the package:\n\n```\npip3\
    \ install --no-index --no-user --find-links dist flit-core\n```\n\nThe meaning\
    \ of the pip3 configuration options and commands:\n\n+   - wheel\n  This command\
    \ builds the wheel archive for this package.\n- -w dist\n  Instructs pip to put\
    \ the created wheel into the dist directory.\n- --no-cache-dir\n  Prevents pip\
    \ from copying the created wheel into the /root/.cache/pip directory.\n- install\n\
    \  This command installs the package.\n- --no-build-isolation, --no-deps, and\
    \ --no-index\n  These options prevent fetching files from the online package repository\
    \ (PyPI). If packages are installed in the correct order, pip won't need to fetch\
    \ any files in the first place; these options add some safety in case of user\
    \ error.\n- --find-links dist\n  Instructs pip to search for wheel archives in\
    \ the dist directory.\n\n# ## 8.52.2. Contents of Flit-Core\n\n**Installed directory:**\
    \ /usr/lib/python3.12/site-packages/flit_core and /usr/lib/python3.12/site-packages/flit-core-3.9.0.dist-info"
