  md: "# 8.28. GCC-13.2.0\n\nThe GCC package contains the GNU compiler collection,\
    \ which includes the C and C++ compilers.\n\nApproximate build time: 42 SBU (with\
    \ tests)\nRequired disk space: 5.5 GB\n\n# 8.28.1. Installation of GCC\n\nIf building\
    \ on x86_64, change the default directory name for 64-bit libraries to \"lib\"\
    :\n\n```\ncase $(uname -m) in\n  x86_64)\n    sed -e 'm64=/s/lib64/lib/' \\ \\\
    \n      -i.orig gcc/config/i386/t-linux64\nesac\n```\n\nThe GCC documentation\
    \ recommends building GCC in a dedicated directory:\n\n```\nmkdir build\ncd build\n\
    ```\n\nPrepare GCC for compilation:\n\n```\n./configure --prefix=/usr \\\n  LD='\
    \ \\\n  --enable-languages=c,c++ \\\n  --enable-default-pie \\\n  --enable-default-ssp\
    \ \\\n  --disable-multilib \\\n  --disable-bootstrap \\\n  --disable-fixincludes\
    \ \\\n  --with-system-zlib\n```\n\nGCC supports different computer languages,\
    \ but the prerequisites for most of them have not yet been installed. See the\
    \ BLFS Book GCC page for instructions on how to build all of GCC's supported languages.\n\
    \nThe meaning of the following parameters:\n\nLD=ldnThis parameter makes the configure\
    \ script use the ld program installed by the Binutils package built earlier in\
    \ this chapter, rather than the cross-build version which would otherwise be used.\n\
    \n--disable-fixincludes\nBy default, during the installation of GCC some system\
    \ headers would be \"fixed\" to be used with GCC. This is not necessary for a\
    \ modern Linux system, and potentially harmful if a package is reinstalled after\
    \ installing GCC. This switch prevents GCC from \"fixing\" the headers.\n\n--with-system-zlib\n\
    This tells GCC to link to the system installed copy of the Zlib library, rather\
    \ than its own internal copy."
