- pgno: 288
  md: "# Warning\n\nThe following command will overwrite the current boot loader.\
    \ Do not run the command if this is not desired, for example, if using a third\
    \ party boot manager to manage the Master Boot Record (MBR).\n\n```\ngrub-install\
    \ /dev/sda\n```\n\n# Note\n\nIf the system has been booted using UEFI, grub-install\
    \ will try to install files for the x86_64-efi target, but those files have not\
    \ been installed in Chapter 8. If this is the case, add --target 1386-pc to the\
    \ command above.\n\n# 10.4.4. Creating the GRUB Configuration File\n\n```\nGenerate\
    \ /boot/grub/grub.cfg:\ncat > /boot/grub/grub.cfg << \"EOF\"\n# Begin /boot/grub/grub\n\
    set default=0\nset timeout=5\nmod part_gpt\nmod ext2\nset root=(hd0,2)\nentry\
    \ \"GNU/Linux, Linux 6.7.4-lfs-12.1\"\n linux /boot/vmlinuz-6.7.4-lfs-12.1 root=/dev/sda2\n\
    \nEOF\n```\n\nThe insmod commands load the GRUB modules named part_gpt and ext2.\
    \ Despite the naming, ext2 actually supports ext2, ext3, and ext4 filesystems.\
    \ The grub-install command has embedded some modules into the main GRUB image\
    \ (installed into the MBR or GRUB BIOS partition) to access the other modules\
    \ (in /boot/i386-pc) without a chicken-or-egg issue, so with a typical configuration\
    \ these two modules are already embedded and two insmod commands will do nothing.\
    \ They do no harm away, and they may be needed with some rare configurations.\n\
    \n# Note\n\nFrom GRUB's perspective, the kernel files are relative to the partition\
    \ used. If you used a separate /boot partition, remove /boot from the above line.\
    \ You will also need to change the set root line to point to the boot partition."
  merge: -1
  img_proc: true
- pgno: 289
  md: '# Note


    The GRUB designator for partition may change if you added or removed some disks
    (including removable disks like USB thumb devices). The change may cause boot
    failure grub.cfg refers to "old" designators. If you wish to avoid such a problem,
    you may use the UUID of partition and the UUID of a filesystem instead of a GRUB
    designator to specify a device. Runblkid UUID of your filesystems (in the UUID
    column) and partitions (in the PARTITION column). Then replace root=hdx,y with
    search --root --fs-uuid <UUID of the filesystem where the kernel is installed>,
    and replace root=dev/sda2 with root=PARTITIONUUID=<UUID of the partition where
    LFS is built.


    Note that the UUID of a partition is completely different from the UUID of the
    filesystem in this partition. Online resources may instruct you to use root=UUID=<filesystem>
    instead of root=PARTITION=<UUID>, but doing so will require an initramfs, which
    is beyond the scope of LFS.


    The name of the device node for a partition in /dev may also change (this is less
    likely than a GRUB designator change). You can also replace paths to device nodes
    like /dev/sda with PARTITIONUUID=UUID, in /etc/fstab, to avoid a potential boot
    failure in case the device node name has changed.


    GRUB is an extremely powerful program and it provides a tremendous number of options
    for booting from a wide variety of devices, operating systems, and partition types.
    There are also many options for customization such as graphical splash screens,
    playing sounds, mouse input, etc. The details of these options are beyond the
    scope of this introduction.


    # Caution


    > There is a command, grub-mkconfig, that can write a configuration file automatically.
    It uses a set of scripts in /etc/grub.d/ and will destroy any customizations that
    you make. These scripts are designed primarily for non-source distributions and
    are not recommended for LFS. If you install a commercial Linux distribution, there
    is a good chance that this program will be run. Be sure to back up your grub.cfg
    file.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Chapter 11. The End


    # 11.1. The End


    Well done! The new LFS system is installed! We wish you much success with your
    shiny new custom-built Linux system.


    It may be a good idea to create an `/etc/lfs-release` file. By having this file,
    it is very easy for you (and for us you need to ask for help at some point) to
    find out which LFS version is installed on the system. Create this file by running:


    ```

    echo 12.1 > /etc/lfs-release

    ```


    Two files describing the installed system were built by packages that can be installed
    on the system later, either in binary form or by building them.


    The first one shows the status of your new system with respect to the Linux Standards
    Base (LSB). To create this file, run:


    ```

    cat > /etc/lfs-release << "EOF"

    DISTRIB_ID="Linux from Scratch"

    DISTRIB_RELEASE="12.1"

    DISTRIB_CODENAME="your name here"

    DISTRIB_DESCRIPTION="Linux from Scratch"

    EOF

    ```


    The second one contains roughly the same information, and is used by system and
    general desktop environments. To create this file, run:


    ```

    cat > /etc/os-release << "EOF"

    NAME="Linux from Scratch"

    VERSION="12.1"

    ID=lfs

    PRETTY_NAME="Linux from Scratch 12.1"

    VERSION_CODENAME="your name here"

    HOME_URL="https://www.linuxfromscratch.org/lfs/"

    EOF

    ```


    Be sure to customize the fields ''DISTRIB_CODENAME'' and ''VERSION_CODENAME''
    to make the system unique to yours.


    # 11.2. Get Started


    Now that you have finished the book, do you want to be counted as an LFS user?
    Head over to https://linuxfromscratch.org/cgi-bin/lfscounter.php and register
    as an LFS user by entering your name and the first LFS version you have used.


    Let''s reboot into LFS now.


    # 11.3. Rebooting the System


    Now all of the software has been installed, it is time to reboot your computer.
    However, there are still a few things to check. Here are some suggestions:


    +   - Install firmware needed if the kernel driver for your hardware requires
    some firmware files to function properly.

    - Ensure a password is set for the root user.'
  merge: -1
  img_proc: true
