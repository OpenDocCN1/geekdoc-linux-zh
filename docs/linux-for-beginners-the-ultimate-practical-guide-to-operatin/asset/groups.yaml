    # ## Introduction


    The mid-1990s was when Linux stopped being a tool of hobbyists and started to
    be used in the supercomputing community. When Linux first started taking off,
    it was met with support from companies like Dell, IBM, and HP so that Linux could
    escape the monopoly in the operating system market Microsoft had. This was when
    it found its first commercial use. Later, organizations like NASA started using
    Linux devices and started replacing their expensive machines with large numbers
    of Linux computers, as they were far less expensive and could do the same job.
    Today, you can find Linux system everywhere, from supercomputers to embedded systems.
    They have secured themselves a permanent place in many server installations such
    as the LAMP application stack, which is very popular.


    Usage in machines in the household has been increasing as well, in addition to
    enterprise desktops. Linux is very popular in the netbook market, as well. Many
    distributors ship their products with a customized Linux installed on them. Even
    Google released an OS for notebooks of their own called the Chrome OS. Linux has
    had the most success in the mobile device market. This is due to Android being
    a very popular option when it comes to not only smartphones but tablets and wearables
    as well. Valve has been showing support for Linux, which opened up a gaming market
    for the system, releasing their own Linux distribution made for gaming. Linux
    distributions have also started being popular when it comes to administrative
    work. Some local and national governments use it, one of which is the government
    of Brazil.


