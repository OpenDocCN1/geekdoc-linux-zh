    # sudo and the root


    There is a very strict model implemented in Linux operating systems for users.
    The root user has the power to do everything while the other users can do nothing
    related to the system. The common solution, which was followed in the past was
    to allow the normal user to become the root user using the `su` command for a
    temporary period until the required task was completed. This, however, has the
    disadvantage that a regular user literally would become the root user and gain
    all the powers of the root user. They could then make critical changes to the
    system like restarting the system and even delete an entire directory like `/etc`.
    Also, gaining access to become the root user would involve another issue that
    every user switching to the root user would need to know the password of the root
    user, which is not a very good idea.


    This is where the `sudo` command comes into the picture. The `sudo` command lets
    a regular user run command as if they are the root user, or another user, as per
    the settings defined in the `/etc/sudoers` file. While other tools like `su` would
    require you to know the password of the root user, the `sudo` command requires
    you to know only your own password for authentication, and not the password of
    the account that you are trying to gain access to. By doing this, it allows the
    administrator of the system to allow a certain list of privileges to regular users
    such that they perform system administration tasks, without actually needing to
    know the root password.


