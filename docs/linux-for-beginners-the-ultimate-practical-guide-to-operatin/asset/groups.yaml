    \ we gain access to may have the lowest permissions. However, if you want to perform\
    \ a penetration attack, you may need the administrator account permissions, so\
    \ you need to increase the permissions. Permission elevation can be achieved by\
    \ using fake tokens, local privilege escalation, and social engineering.\n\n##\
    \ 4) Password Attacks\n\nA password attack is to recover the password plaintext\
