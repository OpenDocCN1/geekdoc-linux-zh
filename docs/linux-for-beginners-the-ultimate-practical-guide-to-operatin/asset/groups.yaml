    ## 第 15 章。保护你的 Linux 服务器


    如果你没有将安全考虑纳入规划的每一步以及实际部署的每一层，那么你可以相当确信，总有一天会发生某些事情。在本章中，你将学习权限，即与所有 Linux 文件系统对象相关的元数据，它们控制谁可以执行什么操作。首先，我将讨论如何通过定期应用软件更新和补丁，并确保没有网络端口处于打开且未受保护的状态，来加强你的服务器安全性。接下来，我们将讨论通过加密磁盘、网站和邮件服务器来保护静止状态和传输中的数据。但看到这些权限和属性发挥作用会很不错。在我解释如何做到这一点时，你也会了解
    Linux 权限究竟是如何工作的。


    Linux 文件系统中的每个对象，无论是文件还是目录，都有与之相关的独特元数据。当你使用 `-l` 参数运行 `ls` 时，这些元数据由显示的字符表示，其中
    `l` 代表长格式版本。如果你使用 `cd` 进入 secret 目录，然后输入 `su bob`。`su` 命令代表切换用户（switch user）。这意味着你将是以
    Bob 的身份登录。你可以使用 `touch` 让 Bob 创建一个名为 `data.txt` 的新文件。如果 Bob 不是 `secret group`
    的成员，并且 secret 目录不属于 `secret group`，那么这是不可能的。你可以通过让 Bob 尝试在 `/var/log` 目录中创建一个名为
    `stuff` 的文件来证明这一点，该目录由 `root` 拥有。它不会成功。这就是为什么将组与特定资产（如目录）关联起来非常有用。这不仅仅关乎 Bob。你可以将任意数量的用户添加到这个组中，他们都将能够在属于该组的任何目录中创建和编辑文件。让我们看看它是如何工作的。你可以在
    `/var/secret` 目录中运行 `ls -l` 以显示内容的文件属性。你可以使用带有 `d` 参数的 `ls` 运行，这将列出 secret 目录本身的属性，而不是内容的属性。如果你查看这两个命令给出的结果；首先是文件
    `data.txt`。该行开头的 10 个字符实际上由 4 组组成。如果该目录是一个目录，第一个破折号将是一个 `d`。如果你向下跳几行，你应该会看到目录
    secret 属性的第一个字符实际上是 `d`。


    接下来的三个字符 `r`、`w` 和 `-` 代表了对象所有者使用文件的方式。


    在这种情况下，`r` 表示所有者可以读取文件内容，`w` 表示写入或编辑（包括删除），而 `-` 代替了 `x`，`x` 意味着 Bob 可以在适当的情况下执行该文件。


    在这种情况下，`-` 表示所有者没有执行权限。接下来的三个字符表示拥有组中成员（在此情况下是 Bob 的组）的权限。所有组成员都具有读和写权限，但没有执行权限。


    最后一组三个字符代表所有其他“非 root”用户的权限。他们可以读取，但不能写入或执行。


    下一个字段告诉你文件的所有者是 Bob，其组也是 Bob。尽管目录由 root 拥有，但文件属于 Bob，因为他是创建它的人。现在让我们看看目录的属性。前面已经提到了代表目录的
    `d`，但你还应该看到所有者和组都具有完整权限：读、写和执行。


    其他人能够读取和执行，但不能写入。为什么目录由 root 拥有？因为它是使用 `sudo` 创建的，这实际上是以 `root` 身份操作。


    你稍早运行过的 `chown` 操作只更改了组，但没有更改所有者。要做到这一点，你应该在冒号前包含某个值（例如你自己的用户名），然后在冒号后添加 `secret-group`
    以设置组。


    你可以使用 `chmod` 更改对象的属性。多尝试几个操作不会对你造成伤害，以确保过程完全清晰。


    为其他人添加对 `data.txt` 的执行权限。你可以使用 `o` 代表其他人，加号表示你正在添加权限，`x` 表示可执行。这里有两个重点需要强调。第一点是，由于你当前是以
    Bob 的身份登录，而 Bob 是 `data.txt` 的所有者，因此你不需要为此操作使用 `sudo`。


    第二点是，这个操作将毫无意义。除非 Bob 恰好将文件变成脚本，否则你永远不会需要执行一个简单数据文件。


    在不告诉你一种使用数字表示法表示对象属性的不同方法之前，我无法继续。你会记得有三种权限：读、写和执行。好吧，如果你用数字 4 代表读，2 代表写，1 代表执行；基于此，通过相加这三个权限的值，7
    表示可能的最高权限级别（4 加 2 加 1 等于 7）。


    具有读取和执行权限但没有写权限的人，其值为 5，而仅具有执行权限的人值为 1。那么，你如何描述 `data.txt` 的当前值，其中用户和组都有读和写权限，而其他人有读和执行权限？


