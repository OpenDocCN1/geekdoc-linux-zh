    ## 命令别名


    使用命令别名可以节省大量时间。要定义别名，必须进行简单的赋值。


    语法：`alias=command(s)`


    示例：

    - `alias L="ls -al"`

    - `alias search=grep`


    ## 命令替换


    也可以将某个命令的输出用作变量的输入。这是一个很棒的功能，可以继续脚本并使用动态数据执行它。


    为了实现这一点，必须使用 `$()`。


    示例：`user_name=$(USERNAME)`


    示例脚本：


    ```bash

    #!/bin/bash

    user_name=$(who)

    echo "Your username is :" $user_name

    ```

    ```

    jan@jan-virtual-machine:~/Desktop$ ./MyScript

    "Your username is :" jan : 0 2019-09-24 03:42 (:0)

    ```


    ## 创建文件


    另一个很棒的功能是你可以输出结果。你甚至可以根据需要为文件命名。这在下一个示例中进行了说明。


    ```bash

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo "Today is :" $mydate

    who > log.$mydate

    ls -l log.$mydate

    ```

    ```

    jan@jan-virtual-machine:~/Desktop$ ./MyScript

    "Today is :" 20190924

    -rw-r--r-- 1 jan jan 44 Sep 24 06:19 log.20190924

    ```


    这里，我们创建一个日期并对其进行格式化。`%Y` 是 YYYY 格式的年份。月份是数字格式（例如，09），日期也是数字格式。输出类似于 YYYYMMDD。输出被存入变量。然后我们
    `echo` 该变量。最后，我们使用 `who` 命令并使用重定向运算符 `>` 将其输入重定向到新文件。文件名创建为“log”.YYYYMMDD。这就是我们创建日志以保留记录的方式。如果脚本在第二天运行，文件名将是
    `log.20190925`。


    重定向是一个极其有用的功能。相反于使用像 `touch` 这样的命令，你可以将输出重定向到文件。然而，你甚至可以使用 `touch` 命令从脚本创建文件。例如，


    ```

    #!/bin/bash

    mydate=$(date +%Y%m%d)

    echo "Today is: "$mydate

    touch log.$mydate #Creates a file and name the first part log and later using
    our variable

    who >> log.$mydate #Append the output of ''who'' command to the file.

