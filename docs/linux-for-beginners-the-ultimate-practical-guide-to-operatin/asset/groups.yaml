    用户需要了解的是，在任何 Linux 机器上安装软件都非常简单。即使是新的电脑用户也会发现这非常容易，且耗时较少。操作系统在设计时旨在让用户在处理任何事务时都能轻松自如，这一点也不例外。在安装完操作系统后，你就可以开始安装使用你的机器或设备所需的任何应用程序。


    Linux 无处不在。你可以在家中、汽车中，甚至在电器中找到它。当然，你最常找到它的地方是计算机。乍一看，Linux 看起来和其他操作系统没什么两样。它位于你的所有其他软件之下，并将信号传递给硬件。它像大多数其他操作系统一样拥有图形界面，并且拥有其他系统大部分功能的软件等效品。如果你曾经使用过任何操作系统，使用
    Linux 应该没有任何问题。人们通常不知道的是，Linux 被非常频繁地使用。除了是个人电脑中使用了最多的操作系统之一外，它还被用于运行全球各地的许多服务器和嵌入式系统。它被用于运行互联网的巨大部分，以及许多管理股票和实现科学突破的超级计算机。然而，在所有这些之前，Linux
    就有着最无忧无虑、最安全、最可靠的系统的声誉。这一声誉名副其实，而 Linux 的质量也显得越来越明显。


    Linux 是一个灵活的工具，可以根据你感兴趣的任何工作进行定制。用户始终可以自由地对其进行进一步开发，这意味着它总是处于变得更好的过程中。完全依赖社区本身这一事实，使
    Linux 成为了一项更为令人印象深刻的成就。这也使得 Linux 看起来更加可靠，因为在发行方面不存在贪婪的因素。这个系统来自人民，为了人民，并随着趋势而成长。它在用户的帮助下，基于用户的需求而成长。


    Linux 的不同变体被称为发行版（distributions）。发行版是不同组件的打包，这些组件被选择和缝合在一起，以执行明确定义的功能。一个发行版由内核和支持库以及系统软件组成。其中大部分由
    GNU 计划提供。尽管大多数发行版在名称中都使用了“Linux”这个词，但在发行版的命名惯例上曾有一些争议，因为自由软件基金会（Free Software
    Foundation）更喜欢使用“GNU/Linux”这一名称，以强调 GNU 软件的重要性。Linux 的创造者 Torvalds 对此并不满意，并立即采取了抵制行动。自那以后，在涉及发行版名称的问题上，紧张局势一直很高。


    一些最受欢迎的 Linux 发行版包括 Fedora、Ubuntu 和 Debian。有许多发行版被商业使用。其中一些包括 Red Hat Enterprise
    Linux 和 SUSE Linux Enterprise Server。Linux 的桌面发行版通常包括像 Wayland 或 X11 这样的窗口系统，以及像
    KDE Plasma 5 或 GNOME 这样的桌面环境。其他专为服务器制作的发行版通常没有图形界面，并包含解决方案包（solution packs）。解决方案包的一个例子是
    LAMP。那里有众多可用的发行版。使可能性更大的事实是，由于 Linux 是免费分发的，你可以为任何目的制作自己的发行版。


    Linux 最初是为个人电脑制作的，基于 Intel x86 架构。从那时起，它已被移植到许多平台，比任何其他操作系统都多。就服务器和大型机而言，Linux
    领先于任何其他操作系统。除此之外，它是全球 500 强超级计算机唯一使用的操作系统，自 2017 年 11 月以来，它逐渐消除了竞争。大约 2.3% 的台式电脑运行着它。在
    300 美元以下的笔记本销售中，基于 Linux 内核的 Chrome OS 占用了 20% 的份额。凭借这一点，它轻松主导了美国 K-12 教育市场。


    Linux 也用于嵌入式系统。这些是操作系统内置于固件中，并根据系统本身进行定制的设备。路由器、电视、自动化控制、视频游戏机、数字视频录像机和智能手表都是嵌入式系统的例子。Linux
    的衍生版本通常用于智能手机和平板电脑。由于 Android 在智能手机市场中的主导地位，Linux 通过代理成为通用开源软件（OSS）中安装基础最大的操作系统。


    Linux 高耸矗立，成为在困难逆境中取得成功的见证。它表明独立创作者之间的协作可以走多远。它是开源软件协作的一个显著例子。劳动成果是显而易见的。2001
