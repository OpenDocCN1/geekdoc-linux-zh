    \ techniques**: These are effective because you can psychologically trick an employee\
    \ or the target you are chasing with a simple thing like a phishing email to create\
    \ a backdoor via your exploit. All great hackers rely on social engineering instead\
    \ of doing things in a more complex way.\n- **Port Scanning**: If you are curious\
    \ to know about what a port scan is associated with, follow the next few paragraphs\
    \ carefully. There are various services provided by the server, such as publishing\
    \ a home page and sending and receiving e-mails. Services that perform network\
    \ communication include a window called \"port\" for communication, which is managed\
    \ by numbers. For example, well-known services are basically pre-assigned port\
    \ numbers, such as 80 for HTTP services that publish their home pages on the Internet\
    \ and 587 for sending emails. The act of investigating from the outside (attacker\
    \ point of view) what kind of port the server is opening is called \"port scan\"\
    .\n\n## How a Port Scan is Done?\n\nPort scanning is the process of sending specific\
    \ data from the outside and examining the corresponding responses in order to\
    \ investigate the running services on servers connected to the network. By analyzing\
    \ the response obtained, you can identify the version of the service running on\
