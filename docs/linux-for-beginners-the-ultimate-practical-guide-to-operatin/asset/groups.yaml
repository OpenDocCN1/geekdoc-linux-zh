    file. If the check was clear, visudo would end with a final value of 0. However,
    if there is any sort of error detected, it will end with a value of 1.


    - visudo -f sudoers: This specifies an alternate location for sudoers, checking
    or editing the file of your choice instead of storing it in the default /etc/sudoers.


    - visudo -h: This is the help option, and when you do this, visudo will provide
    a short printed message.


    - visudo -q: This tells visudo to enter quiet mode. When in this mode, no details
    of the syntax errors detected during a search will be printed or pointed out to
    you.


    - visudo -s: This will enable the checking of the sudoers file. It will create
    an error if an alias that has not been defined is being used.


    - visudo -v: This is the version option—it tells visudo to print out the version
    number before quitting.


    The sudoers file

    '
  mdcn: '

    涉及任何形式的用户交互。可能会有守护进程为用户运行，但绝不会有任何人登录。


    虽然在现实世界中，这在技术上可能并不重要，但能够一眼看出你有多少人类用户，相对于运行特定软件的守护进程，会非常方便。通常，这些系统账户是在安装期间由操作系统创建的，并且操作系统保留了对它们的控制权。它们通常具有非常特定的用户
    ID，你可以在 root 账户中识别出来。


    由于这些服务用户将运行操作系统所需的过程，在你修改、结束或重置任何过程时，应该不要动它们。你需要确保尽可能不碰这些服务用户，以保护自己免于损坏软件。如果你损坏了其中之一，很可能会摧毁整个操作系统，遗憾的是，如果你不专心，这很容易发生。


    ## Sudo


    现在，是时候讨论 sudo 了。如果你在命令前使用 sudo，本质上是将其提升。你告诉系统，你正以应被尊重的提升权限来指挥这个特定进程。通常，系统会检查提升权限，以确保你确实被授权进行你正在进行的任何更改。


    如果你主要使用 Windows，你已经有过与此类账户交互的例子。当你安装软件时，你是否注意到某些安装会触发一个提示弹出框，询问你是否确定要继续，并要求你授予软件继续所需的权限？这就是你在
    Sudo 中做的事情。你实际上是在授予该权限，但不再是点击按钮，而是告诉系统你拥有系统的提升访问权限，并且应被尊重。


    如果你直到现在主要使用的是 macOS，当你触发可能被识别为危险或将对操作系统进行重大更改的下载时，你也有类似的保护措施。在 Mac 上，你会看到一个安全框弹出，然后你必须向系统提供密码，以确认你确实想要在系统上执行该更改。


    因此，Sudo 本质上就是你的权限通行证。它是告诉系统你负责管理的“魔法口令”——只要你的用户账户上的权限匹配即可。


    ### 使用 Sudo


    当你准备使用 Sudo 时，你不需要太费力。实际上，你只需在试图推进的命令前加上 sudo 即可。如果你这样做，你的程序应该会要求你输入当前账户的密码。如果你提供此密码并且你的凭证通过检查，它将执行该功能。


    例如，想象一下你想重启系统。如你所记得的，触发系统重启的命令仅仅是 reboot。


    但是，reboot 需要 sudo 权限。如果你试图仅用 reboot 命令系统，它会告诉你，你必须是一个超级用户才能执行那个特定命令。


    这时你就需要提升你的命令权限。在那一点上，你可以向你的命令添加内容，创建如下输入：


    ```

    $ sudo reboot

    ```


    然后你的系统会要求输入账户密码，输入密码后，它便会按请求重启。


    ### 使用 Su 代替 sudo？


    这或许是你提升权限以触发系统服从的最安全方式之一。还有其他方法，例如切换用户命令，即“su”。但是，当你使用切换用户命令时，你被要求输入 root 密码，然后获得超级用户提示符。


    当你的输入就绪信号从通常的 $ 变成 # 时，你就知道自己在超级用户提示符下。# 应该是你的警告信号——如果你在终端看到它等待着你，就知道你在 root 账户上，需要小心。


    虽然切换用户命令在非常特定的情况下可能有其用途，但它也有风险，可能会因为一次拼写错误或有人在键盘敲击时意外碰撞到你而摧毁一切。然而，当你使用 sudo 时，每个需要额外权限的命令都需要插入它。这意味着你有额外的保障措施。当然，如果你正在做某件需要你不断验证凭证的事情，这可能会很烦人，但如果你认为额外的安全值得，那是很有价值的。当然，如果你想要绕过持续的
    sudo 使用，也可以在开始输入 su 命令之前设置系统的备份，但这最终是你需要自己权衡风险后做出的个人决定。总之，你在 su 模式下停留的时间越长，发生事故的可能性就越大。


    ## Sudoers 文件


    在 sudo 之下是 sudoers 文件。它首先确定了谁有权使用 sudo 命令，以利用其在操作系统内带来的权威性。通常，你可以在 /etc/sudoers
    位置访问此文件，如果你想操纵命令值和权限，就必须编辑它。利用和编辑 sudoers 文件的最佳且最安全的方式是通过使用 visudo 编辑器。


    ## Visudo


    Visudo 本身充当一种权宜之计——为 sudoers 文件增加一层安全。它允许安全编辑，同时锁定 sudoers 文件，防止多个用户同时编辑，如果两个人试图同时创建冲突的编辑，这会变得危险。如果你尝试在他人当前正在使用
    sudoers 文件时通过 visudo 访问，你会被拒绝并收到错误消息，被告知稍后再试。当你进行编辑时，它会停止并检查编辑中是否存在可能灾难性的错误，以至少尝试确保你不会完全破坏重要的东西。


    在完成通过 visudo 编辑系统访问的 sudoers 文件编辑后，编辑将扫描任何错误。如果你确实犯了语法错误，它将拒绝保存，打印声明有错误的消息，并告诉你错误在哪一行。在那里，你会被提示尝试重新编辑以修复错误，或者你可以无论如何退出并保存更改。但是，如果在
    visudo 发现错误后你退出，sudo 也很可能会发现错误，并且在错误被纠正之前，sudo 将不可用。


    为了访问 visudo，你只需输入提示符：


    ```

    $ visudo

    ```


    只要权限正确，你应该就能获得你正在寻找的访问权限。还有几个其他选项可以与 visudo 功能配对，以帮助充分利用该程序。这些命令包括：


    - visudo -c：这会触发 visudo 进入仅检查模式。它将检查当前 sudoers 文件是否存在任何语法问题，并打印文件状态。如果检查通过，visudo
    将以最终值 0 结束。但是，如果检测到任何错误，它将结束于值 1。


    - visudo -f sudoers：这指定 sudoers 的备用位置，检查或编辑你选择的文件，而不是将其存储在默认的 /etc/sudoers 中。


    - visudo -h：这是帮助选项，当你执行此操作时，visudo 将提供简短的打印消息。


    - visudo -q：这告诉 visudo 进入安静模式。在此模式下，搜索期间检测到的语法错误的详细信息不会被打印或指出。


    - visudo -s：这将启用对 sudoers 文件的检查。如果使用未定义的别名，它将创建一个错误。


    - visudo -v：这是版本选项——它告诉 visudo 在退出前打印版本号。


    sudoers 文件

    '
