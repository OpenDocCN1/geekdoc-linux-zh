  - '[PAGE 127]


    With the visudo access created, you are then able to begin editing your sudoers
    file. This is what will provide the sudo access to any accounts. When you first
    access your sudoers file and scroll to the bottom, you will likely see a line
    that says something along the lines of:


    ```

    root ALL=(ALL) ALL

    ```


    Effectively, this means that the root user can execute from all terminals, like
    all users, and run all commands. Read all as any for a moment, and you can see
    how that can be scary. The root user can be basically anything it wants to order
    anything it wants and do anything it wants.


    If you want to have any similar powers yourself on other accounts, you will need
    to set yourself up for an account that is designed as a sudo account.


    First, you must log into your server as the root user.


    Then, using the command adduser you must create a new username.


    ```

    $ adduser usernamehere

    ```


    At this point, you will be asked to make a new password for the account. Do not
    forget your password, and make sure it is actually secure. From there, the command
    will create a home directory for you. Just press Enter to accept the default unless
    you feel like filling it in.


    Then, you must add the new user to the sudo group using the following command


    ```

    $ usermod -aG sudo usernamehere

    ```


    This should give you the sudo access, though you should still probably test it.
    Switch to the new user with the su command:


    ```

    $ su – usernamehere

    ```


    At this point, you need to test your access. Try using the whoami command to get
    all of your details:


    ```

    $ sudo whoami

    ```'
