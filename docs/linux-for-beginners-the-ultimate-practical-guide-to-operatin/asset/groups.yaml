    # # CHAPTER 16. GNU Utilities


    In this chapter, we will cover the general components of the Linux operating system.
    We will delve into the critical elements that work together to make Linux the
    most versatile operating system. You will understand the difference between the
    GNU project and the GPL.


    All Linux distributions come with software developed under the GNU project. When
    you use the distro in text terminal mode, you will be able to see the GNU utilities.


    # ## What is GNU?


    GNU (GNU''s Not Unix) is a free operating system of GNU packages that were released
    under the GNU project and other third parties free software. Linux has become
    the most preferred operating system recently because it comes with all the software
    installed. Linux distributions come with graphics software, office packages, and
    even coding packages under the GNU GPL license.


    In 1984, Richard Stallman started the GNU project, which was intended to be a
    UNIX based Operating system.


    GNU utilities are a collection of GNU software that contains tools like ls, Cat,
    and rm, which are mostly implemented in Unix Operating systems.


    rm – is a command used to remove objects like computer files, directories, and
    links from file systems.


    cat – is a Unix utility that reads files in sequence and writes them as standard
    output. Name derived from its functionality; to concatenate.


    ls – is the command used to list files in Unix System and all UNIX based systems.


    The GNU General Public License (GPL) for Linux, ensures that the software is always
    free and open to anyone. No single person or/and a company can claim ownership
    or control its use. Additionally, any user can copy, edit, and re-distribute the
    software''s source code.


    You may ask yourself, then who funds the GNU project? How do they raise funds?
    The Free Software Foundation funds the project'
