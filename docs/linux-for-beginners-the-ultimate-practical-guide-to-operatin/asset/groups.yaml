    - /home – home directory

    - /boot – the kernel and startup files; files that attempt to eliminate unnecessary
    bootloaders

    - /initrd – data regarding booting information

    - /dev – contains references to all CPU hardware peripherals

    - /bin – common shared system programs

    - /etc – important systems configuration data

    - /lib – library files

    - /lost+found – retrieved data from failures

    - /opt – files from third-party sources

    - /net – remote file systems’ standard mount point

    - /misc – miscellaneous data

    - /proc – information regarding system resources

    - /mnt – external file systems’ standard mount point


    ## The Role of an Inode


    In a Linux file system, an inode represents a file. An inode is a type of serial
    number that contains important information. Its primary role revolves around defining
    the number of files in a partition.


    Throughout a Linux file system, especially one with multiple partitions, there
    are files with similar inodes. To avoid complications, each partition is assigned
    its own inode.


    Moreover, an assigned inode provides a description of a hard disk’s data structure.
    Once a hard disk’s initialization is finished, it can accept data storage during
    two points. One, data storage is acceptable during the installation process. Two,
    data storage is acceptable upon the addition of storage space to an existing system.


    Information contained in an inode:


    - File type

    - File size

    - Owner or group owner of the file

    - Date and time of the creation

    - Date and time of the latest modification

    - Permissions

    - Number of links

    - Data address


    ## What Is The Superblock?


    In Linux’s file system, the information about basic file size and shape is called
    The Superblock. It allows a file system manager to preserve and maintain a file
