    # CHAPTER 10. User and Group Management


    In this chapter, we will learn about users and groups in Linux and how to manage
    them and administer password policies for these users. By the end of this chapter,
    you will be well versed in the role of users and groups on a Linux system and
    how they are interpreted by the operating system. You will learn to create, modify,
    lock and delete user and group accounts, which have been created locally. You
    will also learn how to manually lock accounts by enforcing a password-aging policy
    in the shadow password file.


    # Users and Groups


    In this section, we will understand what users and groups are and what is their
