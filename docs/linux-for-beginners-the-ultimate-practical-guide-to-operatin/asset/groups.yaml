    # CHAPTER 1. Basic Linux commands


    In this section, we will explore the basic Linux commands that are necessary to
    get started. You can now open the terminal. Right-click on the Desktop and choose
    ‘Open Terminal’.


    If you don’t see this option, look for ‘Applications’ at the top of the window.
    Click on ‘Applications’ and go to ‘Accessories’. Choose ‘Open terminal’ and open
    the text editor, that is, ‘Gedit’. Just click on the search and type “text editor”.
    Add some text of your choice to the file and save it, maybe on the desktop. I
    have saved my file with the name first with the following text:


    +   - I am a Linux Guru

    +   - I am enjoying reading this book


    Now go to the terminal and type the following:


    ```

    cat first

    ```


    After pressing the enter key, the contents of the file will be displayed in the
    window. To list the content contained in a short file, this


    ![](img/e3fe187ed34a3465fc5a2628f88b7166_9_0.png)


    method is appropriate.


    # Changing Directories


    You might also want to navigate or change directories via the terminal. To achieve
    this, use the command ‘cd’ which stands for “change directory”.


    Example:


    ```

    cd /home

    ```


    The above command will change the working directory to the ‘/home’ directory.
    The use of forwarding slash (/) is to mean relative to the root, meaning that
    this command will be executed regardless of the directory that you are currently
    in. Now type the following command:


    ```

    cd httpd

    ```'
