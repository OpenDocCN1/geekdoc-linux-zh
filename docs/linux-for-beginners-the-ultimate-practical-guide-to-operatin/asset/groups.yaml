    ## Mathematical Operations in Script Building


    Any script can be used to perform certain calculations. There are some built-in
    commands in Linux. We are looking into the command `expr`. This stands for the
    expression. These are the operators for `expr` command.


    | Operator | Description |

    | :--- | :--- |

    | ARG1 \| ARG2 | ARG1 if it is neither null nor 0, otherwise ARG2 |

    | ARG1 & ARG2 | ARG1 if neither argument is null or 0, otherwise 0 |

    | ARG1 < ARG2 | ARG1 is less than ARG2 |

    | ARG1 <= ARG2 | ARG1 is less than or equal to ARG2 |

    | ARG1 = ARG2 | ARG1 is equal to ARG2 |

    | ARG1 != ARG2 | ARG1 is unequal to ARG2 |

    | ARG1 >= ARG2 | ARG1 is greater than or equal to ARG2 |

    | ARG1 > ARG2 | ARG1 is greater than ARG2 |

    | ARG1 + ARG2 | arithmetic sum of ARG1 and ARG2 |

    | ARG1 - ARG2 | arithmetic difference of ARG1 and ARG2 |

    | ARG1 * ARG2 | arithmetic product of ARG1 and ARG2 |

    | ARG1 / ARG2 | arithmetic quotient of ARG1 divided by ARG2 |

    | ARG1 % ARG2 | arithmetic remainder of ARG1 divided by ARG2 |

    | STRING : REGEXP | anchored pattern match of REGEXP in STRING |

    | match STRING REGEXP | same as STRING : REGEXP |

    | substr STRING POS LENGTH | substring of STRING, POS counted from 1 |

    | index STRING CHARS | index in STRING where any CHARS is found, or 0 |

    | length STRING | length of STRING |

    | + TOKEN | interpret TOKEN as a string, even if it is a keyword like ''match''
    or an operator like ''/'' |


    Image: expr operators


    > Note: Although this is a useful command, its operation is somewhat confusing
    in some cases.


    ### Examples


    ```

    jan@jan-virtual-machine:~/Desktop$ expr 1+1

    1+1

    jan@jan-virtual-machine:~/Desktop$ expr 1 + 1

    2

    jan@jan-virtual-machine:~/Desktop$ expr 2 - 1

    1

    jan@jan-virtual-machine:~/Desktop$ expr 2 * 2

    expr: syntax error

    jan@jan-virtual-machine:~/Desktop$ expr 2 \* 2

    4

    jan@jan-virtual-machine:~/Desktop$ expr 6 / 3

    2

    ```


    > Note: The `2 * 2` expression returns a syntax error. We have to use an escape
    character to resolve the problem.


    Rather than using the `expr` command, it is more convenient to use brackets.


    ```

    #!/bin/bash

    var1=2

    var2=6

    var3=3

    var4=$(expr $var1 \* $var2)

    echo $var4

