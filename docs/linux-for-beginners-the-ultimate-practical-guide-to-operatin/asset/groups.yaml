    ## The Commands “more” and “less”


    The commands “more” and “less” are also useful for displaying files that go past
    the screen you are on. You may need to read more information than what you can
    see on one screen on the help pages. This is especially important for a beginner
    on the system. Simply scroll down by using the space bar after typing the command.


    To get out, type in “q” for quit.


    ## Moving around


    You will soon learn that there are many directories in Linux, and you should get
    familiar with them. Although everything is a file in Linux, a directory is a special
    type of file. Directories appear in lists and are related as a tree. Unlike OSs
    that use a GUI, you will not see the file extensions. Therefore, you need to know
    how to navigate, find, and change them. You should do a Google search for a list
    of them in order to properly navigate your system.


    Just as with commands, directory spelling and symbols also matter. As another
    note, the space bar comes handy when you need a legitimate space between letters
    and slashes, or between letters from other words. It saves time and strokes. Missing
    these small details can also result in your being somewhere you don’t need to
    or do not want to be. They can also dead-end you with an error message. In worst-case
    scenarios, mistakes in Linux could do some serious damage, like deleting files.
    You should use underscores instead of spaces when setting up new file names. These
    small things will make a difference. A few directories and functions that beginners
    should become familiar with are:


    - `/home` - This is your root, file storage for documents and settings

    - `/dev` - Holds the device files

    - `cd` - Change directory

    - `/etc` - This is similar to a control panel


    ## Using directories


    The command “pwd” will print your working directory. This is also a good place
    to see where you are starting.


    To see what is in the directories, beginning with your home directory, and any
    others thereafter, you can type “ls” to list what is in the directory.


    Note that there are also hidden files that come with your home directory when
    the server account was configured. To see them listed, you must use a period character.
    For example, you would not just type “ls”, but you would type “ls -b” to see the
    hidden files.


    You will also learn to combine commands as with the ones prior. For example, to
    move to a sub-folder named “xyz”, you would preface the xyz as such, “cd xyz”.


    An example of the “cd” command to navigate to your desktop directory, type “cd
    ~/Desktop”.


    To return back to the root directory, type “cd ~”. An example of the same command
    used to navigate into the root directory is to type “cd /”. To go to the parent
    directory, just before your current one, you should type “cd ..”.


    You may want to explore some directories and try moving around to get your bearings
    before you proceed.


    ## How to Install Programs


    The command “apt-get” gets and installs individual visual software packages. This
    is how you will create your server. You will manually pull in anything that you
    need to individualize your Linux server, using select commands.


    Repositories house many Linux programs that you can tap into at any time. These
    are also open source. You should do a Google search for the best software fit
    for your needs if you do not know what you need at this point.


    To then access the repository, for example, you would type “sudo apt-get install
    (program name)” to retrieve a copy to automatically install.


    The command “tasksel” means task-select with Ubuntu. If you run this, a screen
    will appear that gives you a list of common server types, packages, and tasks.
    You can select and install whatever you need for your server.


    For example, you would type “sudo apt-get install tasksel” to get the tasksel
    function, and then use it by typing “sudo apt-get install (then the name of the
    task you want, the server you want, etc.).”


    If you wanted to install the LAMP server, you would type the command “sudo apt-get
    install lamp-server” to automate this.


    ![](img/e3fe187ed34a3465fc5a2628f88b7166_58_0.png)


    An example of an apt-get install ([www.en.flossmanuals.net](http://www.en.flossmanuals.net)).


    If you need help at any time, now that you know the man page command, you would
    type: “man tasksel”. You would see man pages appear to address your needs.


    ## How to Uninstall


    To uninstall, you would simply type “apt-get remove (and the name of the server
    in this case)”. Use this command for obtaining most of your software, and opting
    for the free, open source software to start.


    ## Updates


    After installation of your software, you can use the upgrade command “sudo apt-get
    upgrade”. Easy updates by way of the repository. It is easier to manually update
    them than to set automatic updates. You won’t need them that often due to Linux
    efficiency. It is also more secure.


    ## Task Manager


    The “top” prompt command is similar to the “task manager” to see processes and
    how much space each is taking, or to stop things from running.


    Use command “h” for a list of commands you may need at any time.


    Enter the command “sudo top” (to access the task manager or the top), then the
    command “k” (for kill) and then type the process ID number (called a PID) that
    you see next to the process that you want to kill.


    ## Stop/Start/Restart Services


    Linux servers need very infrequent rebooting, but at times you may need to restart
    software or a service.


    To start/stop or restart, you will type in the command:


    “sudo /etc/init.d/(name of the program) start” (or stop or restart), to make changes,
    and go offline while you work on the changes, such as with a crash, or reconfiguring
    files.


    ###


    Now that you have some basic knowledge of where you are, where to go, how to get,
    install, or remove things, take some time to test these out. A list of common
    commands follows, as well as a more comprehensive (but not exclusive) list. This
    is in no way exhaustive, but it does show some of the tasks that you may be able
    to do right now, or that you may look forward to learning.


    Linux is an evolving OS, and given the diversity of distros and environments,
    things will only continue to change. As we advanced technologically, there are
    more and more opportunities to improve upon and to utilize Linux systems.


