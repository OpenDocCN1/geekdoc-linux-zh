    ## 管道


    当需要一个命令的输出作为另一个命令的输入时，管道是有用的。这是我们到目前为止学过的。使用的运算符是 `|`。


    示例：


    ```

    #!/bin/bash

    cat employee.txt | sort -nr -k 2

    ```

    # 我们将获得的重定向文件条目重定向到 sort 函数。它按数值排序，逆序排列并按列 ID（第 2 列）排序。


