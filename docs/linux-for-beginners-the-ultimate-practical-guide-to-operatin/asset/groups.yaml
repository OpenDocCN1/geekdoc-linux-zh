    要启动/停止或重启，你将输入命令：


    “sudo /etc/init.d/(程序名称) start”（或 stop 或 restart），以进行更改，并在更改期间（例如在崩溃或重新配置文件时）离线工作。


    ###


    现在你已经对所在位置、去向、如何获取、安装或移除事物有了基本的了解，请花一些时间测试这些操作。下面列出了一组常用命令，以及一份更全面（但非穷尽）的列表。这绝非详尽无遗，但它展示了一些你现在可能能够执行，或者你可能期待学习的内容。


