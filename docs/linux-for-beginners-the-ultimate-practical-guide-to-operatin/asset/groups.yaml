    \ can learn hacking or programming by doing them but not just by reading.\n\n\
    ## Nmap\n\nNmap is one of the famous hacking tools and is widely known for its\
    \ popularity among penetration testers. People often mistake that Nmap is only\
    \ popular for its information gathering abilities but often doesn't understand\
    \ that Nmap can also be used as a vulnerability detector that can be automated.\
    \ It can be used in various operating systems that are open source and in Windows.\
    \ Nmap is a powerful tool that can be used for port discovery, host discovery,\
    \ service discovery, detection of operating system and its version. Nmap can be\
    \ used in both command line and with graphical user interface (GUI). But remember\
    \ that good hackers use the command line.\n\n## How Nmap Works?\n\nNmap is programmed\
    \ in a way such that it can perform scanning using different technologies like\
    \ TCP and UDP protocol scans. All these scans are prone to their strengths and\
    \ weaknesses and hackers can understand it vividly when they are trying to attack\
    \ hosts with Nmap. In hacking terminology, we call the target technically as the\
    \ target host. When using Nmap we need to first understand the complexity of target\
    \ to decide which scan to use, either a simple easy scan or a complex scan that\
    \ would take a lot more time. We need to polish our skills to use some very complex\
    \ and intuitive techniques to get past from intrusion detection systems to get\
    \ good results. Below are some strategies that will help you appreciate various\
    \ operations Nmap can perform:\n\n- You can scan a single host with the following\
    \ commands:\n  - `nmap www.hackingtools.com`\n  - `nmap 192.232.2.1`\n- You can\
    \ scan an entire subnet with the following command:\n  - `nmap 192.232.2.1/24`\n\
    - Nmap can also be used to scan multiple targets with the following command:\n\
    \  - `nmap 192.232.2.1 192.232.2.4`\n- There is also an option in Nmap that will\
    \ let you scan a range of targets as follows:\n  - `nmap 192.232.2.1-100` (This\
    \ precisely scans every host that is in between the IP addresses 192.232.2.1 and\
    \ 192.232.2.100)\n- Nmap has an option where you can store all the IP addresses\
    \ you have in a text file that is in .txt format and place it in the same directory\
    \ of Nmap so that it can scan every IP address present in the text file without\
    \ manually entering each one of them:\n  - `nmap -iL sampleip.txt`\n- If you want\
    \ to see a list of all the hosts you need to scan you can enter the following\
    \ command:\n  - `nmap -sL 192.232.2.1/24`\n- Nmap provides an option where we\
    \ can exclude a single IP address from scanning with subnet hosts:\n  - `nmap\
    \ 192.232.2.1/24 -exclude 192.232.2.4`\n- And if you want to exclude more than\
    \ one IP, you can include all of them in a text file so that they can be excluded\
    \ while doing the subnet scan as shown below:\n  - `nmap 192.232.2.1/24 -exclude\
    \ excludelP.txt`\n\nBefore learning about the scanning procedures Nmap offers\
    \ to let us know about scanning ports on a specific host. You can scan individual\
    \ ports in a host using the following command:\n\n`nmap -p78,56,23 192.232.2.1`\n\
    \n## Scanning Technology in Nmap\n\nThere are different types of scanning strategies\
    \ that Nmap follows to do the work. In this section, we will describe these procedures\
    \ in detail along with few commands that will give you a good overview.\n\n###\
    \ sS scan (TCP SYN)\n\nThis is a typical scan that Nmap uses if nothing is specified\
    \ by the hacker to the software. In this scan, usually, Nmap will not give a full\
    \ handshake to the target system. It will just send an SYN packet to the target\
    \ host, which will then check for any open ports, but not create any sessions\
    \ that may be used after logging. This is one of the greatest strengths of this\
    \ scanning strategy. To use this scan, the hacking tool should be given root access\
    \ otherwise it will show an error. Below we give the command line for this scan.\n\
    \n`hacking@kali #nmap -sS 192.232.2.1`\n\n### sT scan (TCP Connect)\n\nIf the\
    \ sS scan is not used due to the reason that it is not feasible for the current\
    \ attack situation, people normally use sT scan as their next savior. It gives\
    \ three handshakes with open ports and calls a method called connect() which makes\
    \ the software find TCP ports. sT scan, when preferred, can also be used to find\
    \ UDP ports although people use it rarely. Below is the command for -sT scan:\n\
    \n`hacking@kali #nmap -sT 192.232.2.1`\n"
  mdcn: "\n## 3) 漏洞扫描\n\n漏洞扫描器是一种能够自动在计算机、网络应用、Web 应用程序和软件中发现和检测安全漏洞的程序。它通过网络检测目标系统，向目标系统生成数据，并将反馈数据与内置的漏洞签名数据库进行匹配，从而枚举目标系统上存在的安全漏洞。漏洞扫描是确保系统和网络安全不可或缺的手段。面对互联网入侵，如果用户能够根据具体应用环境尽快通过网络扫描检测到安全漏洞，并及时采取适当的修复措施，就能有效防止入侵事件的发生。由于这项工作相对枯燥，我们可以使用一些便捷的自动化工具来实现，例如\
    \ Nessus 和 OpenVAS。\n\n## 3) 利用漏洞\n\n漏洞利用是获取系统控制权的重要方式。用户从目标系统中发现漏洞，然后利用该漏洞获取控制目标系统的权限。为了便于用户实践，本章将介绍由\
    \ Metasploit 发布的 Metasploitable 2。用户可以将其作为一个 Linux 操作系统用于练习。本章将使用 Metasploitable\
    \ 系统中的漏洞来介绍各种渗透攻击，例如 MySQL 数据库、PostgreSQL 数据库和 Tomcat 服务。权限提升是指最大化用户当前拥有的最小权限。通常，我们获取访问权限的用户可能拥有最低的权限。然而，如果你想要执行渗透攻击，可能需要管理员账户权限，因此你需要提升权限。权限提升可以通过使用伪造令牌、本地权限提升和社会工程学来实现。\n\
    \n## 4) 密码攻击\n\n密码攻击是指在不知道密钥的情况下恢复密码明文。密码攻击是所有渗透测试的重要组成部分。如果你是一名渗透测试人员，而不了解密码和密码破解，那是很难想象的。\n\
    \n因此，无论做什么或我们的技术能力有多强，密码似乎仍然是保护数据和限制系统访问的最常见方式。本章描述了各种密码攻击方法，例如密码在线攻击、路由器密码攻击以及创建密码字典。\n\
    \n## 5) 嗅探与无线攻击\n\n这是指人们使用无线网络工具配合网络适配器来捕获数据包，并破解密码或从目标获取敏感信息的过程。像 Wireshark 这样的嗅探工具非常有名，可用于许多攻击和数据包分析。首先，我们将介绍信息收集过程，在这个过程中，我们将借助一个名为\
    \ Nmap 的著名侦察工具扫描开放端口。\n\n## 信息收集\n\n信息收集是一个重要的攻击前阶段，黑客在此阶段收集关于其即将攻击的公开目标的大量信息。许多黑客使用社会工程学技术来获取有关目标及其使用的技术、操作系统和版本的坚实信息。每个黑客在针对主机之前，都会使用不同的方法论来收集良好的信息。信息收集有三个重要阶段，如下所述。\n\
    \n-   **从搜索引擎收集信息**：使用 Google 等搜索引擎获取有关你要攻击的主机的信息。你会发现你能找到的公开信息之多可能会让你惊讶。\n- \
    \  **社会工程技术**：这些技术之所以有效，是因为你可以用简单的事情（如钓鱼邮件）在心理上欺骗员工或你追踪的目标，从而通过你的漏洞利用程序创建一个后门。所有伟大的黑客都依赖社会工程学，而不是以更复杂的方式行事。\n\
    -   **端口扫描**：如果你好奇端口扫描涉及什么，请仔细阅读接下来几段文字。服务器提供各种服务，例如发布主页和收发电子邮件。执行网络通信的服务包含一个名为“端口”的通信窗口，它由数字进行管理。例如，知名服务基本上预分配了端口号，例如用于发布互联网主页的\
    \ HTTP 服务的 80 端口和用于发送电子邮件的 587 端口。从外部（攻击者视角）调查服务器打开的是什么类型的端口的行为称为“端口扫描”。\n\n##\
    \ 如何进行端口扫描？\n\n端口扫描的过程是从外部发送特定数据并检查相应的响应，以调查连接到网络的服务器上运行的服务。通过分析获得的响应，你可以识别服务器上运行的服务版本、操作系统等。有\
    \ Nmap 和 Zenmap 等工具用于执行端口扫描。\n\nNmap 是一个命令行接口工具，而 Zenmap 是一个图形界面工具。两者使用相同的技术，且免费使用。尝试在阅读本书时使用你的计算机；毕竟，众所周知，学习黑客技术或编程靠的是做，而不仅仅是读。\n\
    \n## Nmap\n\nNmap 是著名的黑客工具之一，因其受欢迎程度而在渗透测试人员中广为人知。人们常常误以为 Nmap 仅以其信息收集能力而流行，但通常没有意识到\
    \ Nmap 也可以用作可自动化的漏洞检测器。它可以用于各种开源操作系统和 Windows。Nmap 是一个强大的工具，可用于端口发现、主机发现、服务发现、操作系统及其版本检测。Nmap\
    \ 可以既在命令行中使用，也可与图形用户界面（GUI）结合使用。但请记住，优秀的黑客使用命令行。\n\n## Nmap 是如何工作的？\n\nNmap 的编程方式使其可以使用诸如\
    \ TCP 和 UDP 协议扫描等不同技术进行扫描。所有这些扫描都有其优缺点，当黑客尝试使用 Nmap 攻击主机时，能够生动地理解这一点。在黑客术语中，我们技术上将目标称为目标主机。使用\
    \ Nmap 时，我们需要首先理解目标的复杂度，以决定使用哪种扫描，是简单轻松的扫描还是需要更多时间的复杂扫描。我们需要磨练我们的技能，使用一些非常复杂和直观的技术来绕过入侵检测系统以取得良好的结果。以下是一些策略，帮助你欣赏\
    \ Nmap 可以执行的各种操作：\n\n-   你可以使用以下命令扫描单个主机：\n    -   `nmap www.hackingtools.com`\n\
    \    -   `nmap 192.232.2.1`\n-   你可以使用以下命令扫描整个子网：\n    -   `nmap 192.232.2.1/24`\n\
    -   Nmap 还可以使用以下命令扫描多个目标：\n    -   `nmap 192.232.2.1 192.232.2.4`\n-   Nmap 还有一个选项，让你可以扫描一个范围的目标，如下所示：\n\
    \    -   `nmap 192.232.2.1-100`（这精确地扫描了 IP 地址 192.232.2.1 和 192.232.2.100 之间的每个主机）\n\
    -   Nmap 有一个选项，允许你将所有 IP 地址存储在一个 .txt 格式的文本文件中，并将其放置在 Nmap 的同一目录中，这样它就可以扫描文本文件中存在的每个\
    \ IP 地址，而无需手动输入每一个：\n    -   `nmap -iL sampleip.txt`\n-   如果你想查看需要扫描的所有主机列表，可以输入以下命令：\n\
    \    -   `nmap -sL 192.232.2.1/24`\n-   Nmap 提供了一个选项，我们可以从子网主机中排除单个 IP 地址进行扫描：\n\
    \    -   `nmap 192.232.2.1/24 -exclude 192.232.2.4`\n-   如果你想排除多个 IP，你可以将它们全部包含在一个文本文件中，这样在进行子网扫描时就可以排除它们，如下所示：\n\
    \    -   `nmap 192.232.2.1/24 -exclude excludelP.txt`\n\n在学习 Nmap 提供的让我们了解扫描特定主机端口的扫描程序之前，你可以使用以下命令扫描主机中的单独端口：\n\
    \n`nmap -p78,56,23 192.232.2.1`\n\n## Nmap 中的扫描技术\n\nNmap 遵循不同类型的扫描策略来执行工作。在本节中，我们将详细描述这些程序，并附带一些命令，以便给你一个良好的概览。\n\
    \n### sS 扫描 (TCP SYN)\n\n这是 Nmap 在黑客没有向软件指定任何条件时使用的典型扫描。在这种扫描中，通常 Nmap 不会向目标系统提供完整的握手。它只是向目标主机发送一个\
    \ SYN 包，目标主机随后会检查是否有开放端口，但不会创建任何可能在登录后使用的会话。这是该扫描策略最大的优点之一。要使用此扫描，必须赋予黑客工具 root\
    \ 访问权限，否则将显示错误。下面给出了此扫描的命令行。\n\n`hacking@kali #nmap -sS 192.232.2.1`\n\n### sT\
    \ 扫描 (TCP Connect)\n\n如果由于当前攻击情况不可行而无法使用 sS 扫描，人们通常使用 sT 扫描作为他们的下一个救星。它与开放端口进行三次握手，并调用一个名为\
    \ connect() 的方法，使软件找到 TCP 端口。在优先使用时，sT 扫描也可以用于查找 UDP 端口，尽管人们很少这样使用。以下是 -sT 扫描的命令：\n\
    \n`hacking@kali #nmap -sT 192.232.2.1`\n\n"
