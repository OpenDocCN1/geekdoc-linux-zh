    中的错误可能会造成严重损害，例如删除文件。在设置新文件名时，你应该使用下划线代替空格。这些小事会产生影响。初学者应该熟悉的一些目录和函数包括：


    - `/home` - 这是你的根目录，用于存储文档和设置

