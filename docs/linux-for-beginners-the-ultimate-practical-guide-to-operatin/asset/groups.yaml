  - '[PAGE 10]


    The directory will be changed to ''httpd'' but relative to the ''/home'' directory.
    The full working directory will be ''/home/httpd''. Now type the following command:


    ```

    cd ..

    ```


    This command will change the working directory to the parent directory of the
    current directory. In our case, we will move from ''/home/httpd'' to the ''/home''
    directory. Type the following command:


    ```

    cd ~

    ```


    This command changes the directory to the user''s home directory ''/home((username))''.
    The “username” will be the name you have used on the computer. The symbol “~”
