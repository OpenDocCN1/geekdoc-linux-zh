    ## 第 11 章. 初学者命令与函数


    在这里我们为 Linux 新手提供两份指南。第一份可以被称为实用的速查表。如果你必须为桌面或服务器记忆某些内容，这是最佳选择。第二份列表更为全面，但同样，它并非在
    Linux 中从新手进阶到熟练级别所需命令的终点。


    ### 初学者前 29 条命令列表 - 如果你必须记忆它们


    1. apt-get 搜索软件包并安装

    2. bzip2 压缩/解压缩文件

    3. cd 更改目录

    4. chmod 更改文件的访问权限

    5. cp 复制一个或多个文件或目录的位置

    6. date 显示或设置日期和时间

    7. df 显示磁盘已用和空闲空间

    8. emacs 文本编辑器

    9. exit 退出 shell

    10. find 搜索符合特定模式的文件

    11. hostname 打印或更改系统名称

    12. install 复制文件，设置/更改属性

    13. locate 搜索和查找文件

    14. ls 列出目录内容的信息

    15. man 显示特定命令的帮助信息

    16. mkdir 创建新的文件夹/目录

    17. mv 移动或重命名目录和文件

    18. nano 带有菜单快捷键的文本编辑器

    19. open 在原始应用程序中打开文件

    20. ps 显示当前进程状态

    21. pwd 显示/打印工作目录

    22. quota 显示磁盘使用情况，限制

    23. reboot 重启系统

    24. rm 删除，移除目录或文件

    25. rmdir 删除，移除，清空目录或文件夹

    26. shutdown 关机或重启

    27. sftp 安全文件传输程序

    28. sudo 以特定用户身份执行具有所有权限的命令

    29. tar 从 tarfile 或 tarball/归档中存储、列出或提取文件


    ## 第 12 章. 使用 Linux 文本编辑器


    即使你能够使用具有功能齐全的图形界面的桌面环境，你会发现你希望使用 GUI 之外的编辑器来编辑和创建文件，从而与 Linux 环境进行交互。学习如何使用文本编辑器将使你能够编写自己的
    shell 脚本，并与你想在操作系统中运行的程序进行通信。同时，你还将能够修复配置文件中的潜在问题，尤其是在 X 窗口系统无法加载时。


    在本章中，你将学习如何使用 GUI 和文本模式编辑器，这两种编辑器都允许你配置和创建文本文件。


    ### 如何使用 GUI 文本编辑器


    KDE 和 GNOME 的 GUI 桌面环境都内置了具有自己图形用户界面的文本编辑器。你可以从主菜单中加载这些编辑器。例如，如果你想打开 GNOME 的 GUI
    文本编辑器，请导航至“应用程序 -> 文本编辑器”，然后选择文件 gedit。一旦编辑器加载，你可以选择工具栏上的“打开”选项，然后在标有“打开文件”的对话框中调出你想要编辑的文件或更改包含该文件的目录。


    GNOME 的文本编辑器还能够一次加载多个文件，甚至可以在窗口之间切换以处理它们。一个典型的编辑会话看起来像这样：


