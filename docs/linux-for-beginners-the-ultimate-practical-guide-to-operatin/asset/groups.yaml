    ## 3) -sU 扫描（UDP 扫描）


    在 -sS 扫描的重要性之后，这种扫描也列入了渗透测试清单中。因为这将仅能找出开放的 UDP 端口，所以无需像 TCP 扫描那样发送 SYN 数据包。当黑客开始使用此扫描时，UDP
    数据包会到达目标主机并等待肯定响应。如果收到任何响应，则说明找到了一个开放端口。如果发送带有 Echo 命令的错误消息，则端口是关闭的。


    以下是用于 -sU 扫描黑客技术的命令行：


    ```

    kali@kali:~$ nmap -sU 192.168.2.1

    ```


    ## 4) -sF 扫描（FIN 扫描）


    这是一种特殊类型的扫描，因为某些目标可能安装了入侵检测系统和防火墙，这些系统会阻止通过 TCP 扫描发送的 SYN 数据包。仅出于这个原因，如果对方有额外的检测扫描发生，就会使用
    FIN 扫描。FIN 扫描不会保存任何日志信息以便被检测，因此 FIN 数据包有很大的机会潜入目标系统并找出少数开放端口。以下是 -sF 扫描的命令：


    ```

    kali@kali:~$ nmap -sF 192.168.2.1

    ```


    ## 5) -sP 扫描（Ping 扫描）


    Ping 是一种著名的网络协议方法，通过尝试连接到目标主机来检查主机是否在线。Nmap 中的 Ping 扫描也用于相同目的，并不用于检查开放端口。启动扫描时，Ping
    扫描需要请求 root 访问权限。如果你不愿提供管理权限，只需使用 connect 方法即可从 Nmap 启动 Ping 扫描。以下是 -sP 扫描的命令：


    ```

    kali@kali:~$ nmap -sP 192.168.2.1

    ```


    ## 6) -sV 扫描（版本检测扫描）


    版本检测扫描是 Nmap 在黑客中最痴迷的使用场景之一。要攻击目标系统，你需要了解主机使用的技术和操作系统，以便你创建你的利用工具和后门策略来闯入系统。然而，与
    TCP 扫描不同，版本检测扫描花费很多时间，因为当我们启动 -sV 扫描时，TCP 扫描也会随之启动并搜索开放端口。寻找开放端口的任务完成后，-sV 扫描会自动分析它们并确定关于目标主机的信息。由于这个复杂的程序，它可能会花费大量时间。以下是
    -sV 扫描的命令：


    ```

    kali@kali:~$ nmap -sV 192.168.2.1

    ```


    ## 7) -sI 扫描（空闲扫描）


    这是 Nmap 最疯狂的功能之一，因为它在执行攻击时就像代理服务器一样运作。使用空闲扫描时，你可以使用另一个主机的 IP 发送数据包。这种匿名性可以帮助黑客在事情出错或严重时保持隐蔽。保护自己免受调查是每个黑客的努力目标，特别是在这些现代时代。以下是
    -sI 扫描的命令：


    ```

    kali@kali:~$ nmap -sI 192.168.2.6 192.168.2.1

    ```


    ## Nmap 能检测的内容：


    Nmap 可以检测主机的设备类型（路由器、工作组等）、正在运行的操作系统、操作系统详细信息（如版本和网络距离，即目标与攻击者之间的近似距离）。在使用 Nmap
    时，仅在有必要时才使用 Ping 扫描，因为目标主机中的一些防火墙可以检测到即将发生的攻击，并将阻止攻击者的地址进行任何连接。通过以下命令，你是在告诉软件不要
    Ping 远程主机：


    ```

    kali@kali:~$ nmap -O -PN 192.168.5.6/12

    ```


    使用 -PN 参数可以绕过 Ping 命令，但这不影响宿主系统的发现。NMAP 的操作系统检测基于开放和关闭的端口。如果操作系统扫描无法检测到至少一个开放或关闭的端口，它将返回以下错误。错误代码如下：


    警告：我们无法找到任何开放或关闭的端口来获取有关目标系统的信息


    使用 NMAP 准确检测远程操作系统很困难，因此我们需要使用 NMAP 的猜测功能。osscan-guess 操作会猜测哪种操作系统类型最接近目标。


    ```

    # nmap -O --osscan-guess 192.168.2.1

    ```


    通过使用以下命令和策略，你可以研究关于目标的大量信息，并可以使用这些信息创建后门并利用系统。使用 Metasploit 利用系统将在后续章节中解释，但仅在描述
    Nessus 之后进行，Nessus 是一个自动漏洞评估工具，它可以自动发现漏洞，否则你需要通过枯燥的程序手动查找。在讨论 Nessus 之前，让我们做一个简单的练习。请尝试完成此练习，以便更好地理解信息收集。


    ## 练习


    启动 Kali Linux 终端，并使用命令进入 Nmap。查找 www.nmap.org 的子网掩码，并查找其使用的操作系统和版本。完成不同的扫描，并创建一份关于所有可用端口的详细报告。


    ## 自动漏洞扫描


    首先，让我们详细学习什么是漏洞，并附带一些漏洞的示例。


    ## 什么是漏洞？


    漏洞是主机系统中的缺陷，它允许黑客通过为漏洞创建利用工具来创建后门进入系统。例如，勒索软件利用 Windows 中的漏洞来利用全球数百个系统。Web 应用程序也容易受到漏洞的影响。XSS
    漏洞、CSRF 检测等被 OWASP 声明为高危漏洞，它们用于确定漏洞的严重程度。


    ## 什么是自动漏洞扫描？


    编码后的手动测试可以轻松发现漏洞。然而，这非常枯燥且耗时，许多人避免这样做。为此，制作了某些自动扫描器来扫描系统并检测是否存在与其数据库匹配的情况。Nessus
    和 Burp Suite 等软件使这种自动扫描有效，如果操作得当，很容易获得良好的结果。


    ## Nessus


    Nessus 被认为是一个自动扫描工具，拥有广泛的知名漏洞数据库，该工具将使用它来扫描目标并向攻击者提供结果。对于渗透测试人员来说，Nessus 是必备工具之一。Nessus
    的摘要通常包括成千上万的最新漏洞、多种扫描选项以及易用图形界面和有效的报告。Nessus 备受喜爱是因为它具有若干特性。


    其工作原理如下：


    -   提供完整的计算机漏洞扫描服务，并随时更新其漏洞数据库。

    -   与传统漏洞扫描软件不同，Nessus 可以同时分析和扫描系统漏洞，并且可以根据系统资源调整其效率。

    -   如果主机配置了更多资源（如更快的 CPU 速度或更大的内存大小），由于资源充裕，其性能可以提高。

    -   它可以定义自己的插件；NASL（Nessus 攻击脚本语言）是 Tenable 发布的一种语言，用于编写 Nessus 的安全测试选项。

    -   完全支持 SSL（安全套接字层）。


    Nessus 预装在 Kali Linux 中，可以通过菜单或搜索框打开。它具有 GUI（图形用户界面），易于理解。在 Linux 上，Nessus 工具默认安装在
    /opt/Nessus 目录中。


    1.  Nessus 已启用并通过浏览器访问。例如，如果你的 IP 是 192.168.2.1，浏览器在 `https://192.168.2.1:8834`
    下输入 https 协议。

    2.  首先，我们需要注册登录名和密码来使用 Nessus。你可以通过访问 Nessus 官方网站来做到这一点。


    ### 在 Nessus 中创建基本扫描


    步骤 1：通常当我们想要扫描主机或网站时，在 Nessus 菜单中点击“My Scans”（我的扫描），然后点击“New Scan”（新建扫描），这将创建一个新的扫描。如果我们正在扫描网站，可以选择
    Web 应用程序测试；如果我们正在扫描主机，则需要选择高级扫描。


