    ```

    pwd

    ```


    按下回车键后，您会注意到输出是一个目录。这表明您当前所在的目录。缩写 ‘pwd’ 代表 “print working directory”（打印工作目录），用于显示当前工作目录的目的。


    ## ‘Shutdown’ 命令


    该命令用于关闭系统。此命令的目的是停止当前过程并立即关闭系统。为此请使用以下代码：


    ```

    shutdown -h now

    ```


    下一个命令用于重启系统，意味着它将立即关闭并重新启动系统。为此请使用以下命令：


    ```

    shutdown -r now

    ```


    ## ‘Whereis’ 命令


    该命令用于显示命令的手册、源文件和二进制文件。请考虑以下命令：


    ```

    whereis ls

    ```


    该命令将显示命令 ‘ls’ 的手册文件和二进制文件。要查看之前在您系统上使用过的命令列表，请使用命令 ‘history’：


    上述是我系统上运行过的命令列表。您可以在您的系统上尝试并观察输出。


    ## ‘Sudo’ 命令


    这代表 “superuser do”（超级用户执行）。其目的是允许受权限的用户以“超级用户”身份执行命令。这通常在 ‘sudoers’ 列表中定义。它的重要性在于通过确保敏感命令仅由正确的人员执行来保证安全性。另一个命令
    ‘su’ 允许您以超级用户身份登录系统。‘sudo’ 的目的是借用超级用户的权限。这解释了两个命令 ‘su’ 和 ‘sudo’ 之间的区别。‘sudo’ 命令通常用于更改系统文件的命令中，例如在更新或升级操作系统时。这显示了与
    ‘su’ 命令相比，该命令的安全性有多高。


    ## ‘Mkdir’ 命令


    该命令代表 “make directory”（创建目录）。它创建一个新目录并指定其路径。如果此路径已存在，则会输出一个错误，提示无法创建该文件夹。请考虑下图所示：


    我创建了一个名为 “m” 的目录。创建目录后，当我列出可用目录时，我发现它已被创建。注意，我是以 ‘sudo’ 身份运行该命令的。如果没有这样做，命令将无法运行。这是出于安全目的。首次使用
    ‘sudo’ 命令时，系统会提示您提供超级用户的密码以执行操作。需要注意的是，您只能在文件夹内部创建目录，并且必须对该文件夹拥有“写入权限”。否则，您将无法执行此操作。


    ## ‘Uname’ 命令


    它代表 “Unix name”。通过此命令，您可以获取有关操作系统、内核和机器的详细信息。请考虑下图：


    操作系统、内核和机器的信息已显示。


    - Ubutnu - 机器内核的名称

    - SMP - 机器的节点名称


    '
