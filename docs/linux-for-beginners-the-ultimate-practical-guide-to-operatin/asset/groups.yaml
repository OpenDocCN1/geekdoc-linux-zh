    ## 引言


    20 世纪 90 年代中期，Linux 停止作为业余爱好者的工具，并开始被用于超级计算社区。当 Linux 最初起步时，它得到了戴尔（Dell）、IBM 和
    HP 等公司的支持，从而使 Linux 能够摆脱微软在操作系统市场上的垄断。那时，它找到了最初的商业应用。后来，像美国国家航空航天局（NASA）这样的组织开始使用
    Linux 设备，并开始用大量廉价的 Linux 计算机取代它们昂贵的机器，因为这些 Linux 计算机便宜得多，并且能完成相同的工作。如今，你可以到处找到
    Linux 系统，从超级计算机到嵌入式系统。它们已在许多服务器安装中确立了永久地位，例如非常流行的 LAMP 应用程序堆栈。


    在家庭电脑以及企业桌面中的使用也在增加。Linux 在上网本市场也非常受欢迎。许多发行商在其产品中预装了定制版 Linux。甚至谷歌也发布了他们自己的笔记本操作系统，名为
    Chrome OS。Linux 在移动设备市场上取得了最大的成功。这是因为 Android 不仅非常受智能手机的欢迎，而且也被用于平板电脑和可穿戴设备。Valve
    一直支持 Linux，这为该系统打开了游戏市场，并发布了专为游戏制作的自有 Linux 发行版。Linux 发行版在行政工作方面也开始变得流行。一些地方政府和国家政府使用它，其中之一是巴西政府。


    ## Linux 的当前发展


    目前，Linux 由多个来源共同开发。原始 Linux 内核由格雷格·克罗赫-哈特曼（Greg Kroah-Hartman）维护和指导。克罗赫-哈特曼是参与
    Linux 工作的最重要人物之一。在为 Linux 工作之前，他曾在 SUSE 实验室工作，在该领域获得了大量经验。他不仅维护 Linux 的众多子系统，还负责
    Linx-hotplug、Linux 驱动程序项目以及 udev 项目。他为促进 Linux 的增长做出了巨大努力，是多本深入探讨 Linux 的书籍的作者和合著者。他制作了许多关于
    Linux 如何运作及其未来走向的教程和详细作品。目前，他通过详细的演讲和教程协助内核的开发。2006 年，他制作了一张 CD，帮助新程序员使用 Linux。


    理查德·斯托曼（Richard Stallman）是自由软件基金会（Free Software Foundation）的首脑，该基金会支持 GNU 组件。斯托曼是让
    Linux 至今保持自由来源的最主要负责人之一。他是自由软件的热心倡导者。他坚信每个程序都应平等地向所有人开放。他曾说，隐藏代码，无论多么重要，都是反人类罪行。由于他的努力，GNU
    组件正在被开发，从而 Linux 本身也在发展。


    最后但同样重要的是，Linux 的持续运行和开发的大部分功劳归于那些努力开发第三方非 GNU 组件的公司和个人。这些组件构成了大量的工作，包括用户应用程序和模块，以及内核模块。


    不同的社区和供应商结合了不同类型的组件。他们将 GNU 组件、非 GNU 组件和内核结合起来，并配合软件包管理软件，形成不同的 Linux 发行版。许多不同的
    Linux 发行版可供下载，并且它们都是免费的。


    这些发行版中的大多数都针对某种类型的工作进行了专门设计。有些发行版是为编程制作的，而另一些则适合图形设计或游戏。有许多精心制作的选项，以满足不同的需求。这就是
    Linux 最强的地方——它可以用于任何事情，并表现出色。


    ## 谁拥有 Linux？


    从技术上讲，没有人拥有 Linux。这是开源许可证的优点。真正注册商标的只有 Linux 这个名字。版权属于林纳斯·托瓦兹（Linus Torvalds）。然而，Linux
    本身从技术上讲由许多个人拥有。由于全球贡献者数量众多，联系所有这些人将是一件麻烦事。得益于 GPLv2 许可证，您无需这样做。这意味着只要该许可证永久更新，该程序将始终保持为自由来源。


    ## 第 1 章 Linux 基本命令


    在本节中，我们将探索开始使用 Linux 所需的基本命令。现在你可以打开终端。在桌面上右键单击并选择“打开终端”。


    如果没看到这个选项，请在窗口顶部查找“应用程序”。单击“应用程序”，然后进入“附件”。选择“打开终端”，并打开文本编辑器，即“Gedit”。只需点击搜索并输入“text
    editor”。向文件中添加一些你选择的文本并保存，也许可以保存在桌面上。我保存了我的文件，名为 `first`，包含以下文本：


    - 我是一名 Linux 高手

    - 我正在享受阅读这本书


    现在进入终端并输入以下内容：


    ```

    cat first

    ```


    按回车键后，文件的内容将显示在窗口中。要列出短文件中的内容，使用


    ![](img/e3fe187ed34a3465fc5a2628f88b7166_9_0.png)


    这种方法很合适。


    ## 更改目录


    你可能还希望通过终端导航或更改目录。要做到这一点，请使用命令 `cd`，即“change directory”（更改目录）的缩写。


    示例：


    ```

    cd /home

    ```


    上述命令将工作目录更改为 `/home` 目录。使用斜杠 (/) 表示相对于根目录，意味着无论您当前在哪个目录中，都将执行此命令。现在输入以下命令：


    ```

    cd httpd

    ```

