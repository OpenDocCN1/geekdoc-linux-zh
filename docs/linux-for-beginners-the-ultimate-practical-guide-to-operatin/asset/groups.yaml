    \ google.com 的错误网页地址运行 “wget” 命令，你可以使用两个 “<”（或者针对错误使用 `2>`，但上下文暗示的是关于重定向的讨论）来解释其通常的工作方式。你会看到\
    \ “wget” 无法解析该地址。考虑到根本不存在这样的地址，这并不令人惊讶。然而，如果我希望将错误消息写入文件，我会使用 “wget”、错误的地址、数字\
    \ 2、一个右箭头以及我更正后想要的下一个文件名。数字 2 是标准错误的标识符。0 是标准输入，1 是标准输出。\n\n## 第 10 章. 用户和组管理\n\
    \n在本章中，我们将学习 Linux 中的用户和组，以及如何管理它们并为这些用户管理密码策略。到本章结束时，您将精通 Linux 系统中用户和组的作用，以及操作系统如何解释它们。您将学习创建、修改、锁定和删除在本地创建的用户和组账户。您还将学习如何通过强制在\
    \ shadow 密码文件中实施密码老化策略来手动锁定账户。\n\n### 用户和组\n\n在本节中，我们将理解什么是用户和组，以及它们与操作系统的关联。\n\
    \n谁是用户？\n\n操作系统上的每个进程或正在运行的程序都以某个用户的身份运行。系统中每个文件的所有权都属于某个用户。用户限制了对文件或目录的访问。因此，如果某个进程以某个用户的身份运行，该用户将决定该进程可以访问哪些文件和目录。\n\
    \n您可以使用 `id` 命令了解当前登录的用户。如果您将另一个用户作为参数传递给 `id` 命令，您还可以获取该其他用户的基本信息。\n\n如果您想知道与某个文件或目录相关联的用户，您可以使用\
    \ `ls -l` 命令，输出中的第三列显示用户名。\n\n您还可以使用 `ps` 命令查看与进程相关的信息。该命令的默认输出仅显示在当前 shell 中运行的进程。如果您在命令中使用\
    \ `a` 选项，您将看到终端中所有进程。如果您希望知道与某个命令相关联的用户，您可以将 `u` 选项与 `ps` 命令一起使用，输出的第一列将显示用户。\n\
    \n用户名通过系统中的数据库映射为数字。在 `/etc/passwd` 处存储了一个平面文件，其中包含所有用户的信息。该文件中每个用户有七个字段。\n\n\
    | 字段 | 描述 |\n| :--- | :--- |\n| `username` | 用户名简单地将用户 ID (UID) 指向一个名称，以便人类更容易记忆。\
    \ |\n| `password` | 过去用户的密码存储在此字段中，但现在它们存储在位于 `/etc/shadow` 的不同文件中。 |\n| `UID`\
    \ | 这是一个用户 ID，它是数字型的，用于在系统最基本层面识别用户。 |\n| `GID` | 这是用户的主组编号。我们稍后会讨论组。 |\n| `GECOS`\
    \ | 这是一个使用任意文本的字段，通常为用户的全名。 |\n| `/home/ dir` | 这是用户主目录的位置，用户在此存放个人数据和其他配置文件。\
    \ |\n| `shell` | 这是用户登录后运行的程序。对于普通用户，这通常是提供命令行提示符的程序。 |\n\n什么是组？\n\n就像用户一样，组也有名称和组\
    \ ID (GID) 编号。本地组信息可以在 `/etc/group` 中找到。\n\n有两种类型的组：主组和辅助组。让我们逐一了解它们的特征。\n\n-\
    \ 主组：\n  - 每个用户恰好有一个主组。\n  - 本地用户的主组由 `/etc/passwd` 文件中的第四个字段定义，其中列出了组编号 GID。\n\
    \  - 用户创建的新文件属于主组。\n  - 用户的主组默认与用户名相同。这是一个用户私有组（UPG），用户是该组中唯一的成员。\n- 辅助组：\n  -\
    \ 用户可以是一个或多个辅助组的成员。\n  - 本地用户的辅助组由 `/etc/group` 文件中的最后一个字段定义。对于本地组，用户成员资格由逗号分隔的用户列表标识，该列表位于\
    \ `/etc/group` 中组条目的最后一个字段。\n    - 格式：`groupname:password:GID:list,of,users,in,this,group`\n\
    \  - 辅助组概念的存在是为了让用户能够成为更多组的成员，从而拥有访问系统中属于其他组的资源和服务的权限。\n\n### 获取超级用户权限\n\n在本节中，我们将了解什么是\
    \ root 用户，以及您如何成为 root 或超级用户并获得对系统的完全访问权限。\n\n#### root 用户\n\n在每个操作系统中，都有一个被称为超级用户的用户，该用户在该系统中拥有所有的访问权限和权利。在基于\
    \ Windows 的操作系统中，您可能听说过被称为管理员的超级用户。在基于 Linux 的操作系统中，这个超级用户被称为 root 用户。root 用户拥有覆盖文件系统上任何正常权限的权力，通常用于管理和管理系统。如果您想要执行诸如安装新软件或删除现有软件等任务，以及管理文件和目录等其他任务，用户必须将权限提升为\
    \ root 用户。\n\n操作系统上的大多数设备只能由 root 用户控制，但也有少数例外。普通用户可以控制可移动设备，如 USB 驱动器。因此，非 root\
    \ 用户可以管理和删除可移动设备上的文件，但如果您想要修改固定硬盘，只有 root 用户才能做到。\n\n但正如我们听说的，能力越大，责任越大。鉴于 root\
    \ 用户拥有无限的权力，这些权力也可以被用于损坏系统。root 用户可以删除文件和目录，删除或修改用户账户，在系统中创建后门等。如果 root 用户账户被破解，其他人可以获得对系统的完全控制。因此，始终建议您以普通用户身份登录，并仅在绝对必要时将权限提升为\
    \ root 用户。\n\n在 Linux 中，以普通用户身份登录然后使用工具获取 root 账户的某些权限是一种惯例。\n\n#### 使用 Su 切换用户\n\
    \n您可以使用 `su` 命令在 Linux 中切换到不同的用户账户。如果您未将用户名作为参数传递给 `su` 命令，则默认表示您希望切换到 root 用户账户。如果您以普通用户身份调用该命令，系统将提示您输入想要切换到的账户的密码。但是，如果您以\
    \ root 用户身份调用该命令，则无需输入正在切换到的账户的密码。\n\n```bash\nsu - <username>\n\n[student@desktop\
    \ ~]$ su -\nPassword: rootpassword\n[root@desktop ~]#\n```\n\n如果您使用命令 `su username`，它将启动一个非登录\
    \ shell 会话。但如果您使用命令 `su - username`，则为该用户启动一个登录 shell。这意味着使用 `su - username` 会为\
    \ newUser 设置一个全新的干净登录环境，而仅使用 `su username` 将保留当前 shell 的所有当前设置。通常，为了获得新用户默认设置，管理员通常使用\
    \ `su -` 命令。\n\n#### sudo 和 root\n\nLinux 操作系统中实施了一个非常严格的模型。root 用户拥有做任何事情的能力，而其他用户无法执行与系统相关的操作。过去遵循的常见解决方案是允许普通用户使用\
    \ `su` 命令暂时成为 root 用户，直到所需任务完成。然而，缺点是普通用户实际上会成为 root 用户并获得 root 用户的所有权力。他们随后可以对系统做出关键更改，如重启系统，甚至删除像\
    \ `/etc` 这样的整个目录。此外，获得 root 用户的访问权限还涉及另一个问题：每个切换到 root 用户的用户都需要知道 root 用户的密码，这不是一个好主意。\n\
    \n这就是 `sudo` 命令发挥作用的地方。`sudo` 命令允许普通用户运行命令，就好像他们是 root 用户或根据 `/etc/sudoers` 文件中定义设置的另一个用户。像\
    \ `su` 这样的其他工具要求您知道 root 用户的密码，而 `sudo` 命令仅要求您知道自己的密码进行身份验证，而不需要知道您试图获取访问权限的账户的密码。通过这样做，它允许系统管理员允许普通用户拥有一系列特权，使他们能够执行系统管理任务，而无需实际知道\
    \ root 密码。\n\n让我们看一个示例，其中 student 用户通过 `sudo` 被授予运行 `usermod` 命令的权限。拥有此权限后，student\
    \ 用户现在可以修改任何其他用户账户并锁定该账户。\n\n"
