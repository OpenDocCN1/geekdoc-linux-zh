    ## 移动操作


    你很快就会发现 Linux 中有许多目录，你应该熟悉它们。虽然在 Linux 中一切都是文件，但目录是一种特殊类型的文件。目录在列表中出现，并以树状结构相关。与使用图形用户界面（GUI）的操作系统不同，你看不到文件扩展名。因此，你需要知道如何导航、查找和更改它们。你应该进行一次
