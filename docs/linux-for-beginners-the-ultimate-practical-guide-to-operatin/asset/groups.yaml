    apt-get 安装的一个例子（[www.en.flossmanuals.net](http://www.en.flossmanuals.net)）。


    如果你在任何时候需要帮助，既然你知道 man 页命令，你会输入：“man tasksel”。你会看到 man 页出现以解决你的需求。


    ## 如何卸载


    要卸载，你只需输入 “apt-get remove (在这种情况下是服务器的名称)”。使用此命令获取大多数软件，并优先选择免费的开源软件开始。


    ## 更新


    在安装软件后，你可以使用升级命令 “sudo apt-get upgrade”。通过存储库进行简单的更新。手动更新比设置自动更新更容易。由于 Linux 的效率，你不需要经常更新它。这也更加安全。


    ## 任务管理器


    “top” 提示命令类似于“任务管理器”，用于查看进程、每个进程占用的空间，或停止运行中的任务。


    使用命令 “h” 获取你任何时候可能需要命令的列表。


    输入命令 “sudo top”（访问任务管理器或 top），然后输入命令 “k”（代表 kill，终止），接着输入你在想要终止的进程旁边看到的进程 ID 号（称为
    PID）。


    ## 停止/启动/重启服务


