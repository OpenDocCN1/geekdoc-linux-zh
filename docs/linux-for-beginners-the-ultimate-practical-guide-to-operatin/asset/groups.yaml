    #nmap 192.232.2.1 192.232.2.4


    4) There is also an option in Nmap that will let you scan a range of targets as
    follows

    #nmap 192.232.2.1-100 (This in precise scans every host that is in between the
    IP addresses 192.232.2.1 and 192.232.2.100)


    5) Nmap has an option where you can store all the Ip addresses you have in a text
    file that is in .txt format and place in the same directory of Nmap so that it
    can scan every IP address present in the text file without manually entering each
    one of them.

    #nmap -iL sampleip.txt


    6) If you want to see a list of all the hosts you need to scan you can enter the
    following command

    #nmap -sL 192.232.2.1/24'
  - '[PAGE 65]


    7) Nmap provides an option where we can exclude a single IP address from scanning
    with subnet hosts

    #nmap 192.232.2.1/24 -exclude 192.232.2.4


    And if you want to exclude more than one IP, you can include all of them in a
    text file so that they can be excluded while doing the subnet scan as shown below.

    #nmap 192.232.2.1/24 -exclude excludelP.txt


    Before learning about the scanning procedures Nmap offers to let us know about
    scanning ports on a specific host. You can scan individual ports in a host using
    the following command.


    #nmap -p78,56,23 192.232.2.1 Scanning technology in Nmap There are different types
    of scanning strategies that Nmap follows to do the work. In this section, we will
    describe these procedures in detail along with few commands that will give you
    a good overview.


    1) sS scan ( Tcp SYN )


    This is a typical scan that Nmap uses if nothing is specified by the hacker to
    the software. In this scan usually, Nmap will not give a full handshake to the
    target system. It will just send an SYN packet to the target host, which will
    then check for any open ports, but not creating any sessions that may be used
    after logging. This is one of the greatest strengths of this scanning strategy.
    To use this scan the hacking tool should be given root access otherwise it will
    show an error. Below we give the command line for this scan.

    hacking@kali #nmap -sS 262.232.2.1


    2) sT scan


    ( TCP connect) If the sS scan is not used due to the reason that it is not feasible
    for the current attack situation people normally use sT scan as their next savior.
    It gives three handshakes with open ports and calls a method called connect ()
    which makes the software find TCP ports. sT scan when preferred can also be used
    to find UDP ports although people use it rarely. Below is the command for -sT
    scan:

    hacking @kali #nmap -sT 292.232.2.1'
  md: "\n## 3) Vulnerability Scanning\n\nVulnerability Scanner is a program that automatically\
    \ finds and discovers security vulnerabilities in computers, network applications,\
    \ web applications and software. It detects the target system through the network,\
    \ generates data to the target system, and matches the feedback data with the\
    \ built-in vulnerability signature database to enumerate the security vulnerabilities\
    \ existing on the target system. Vulnerability scanning is an indispensable means\
    \ to ensure system and network security. In the face of Internet intrusion, if\
    \ users can detect security vulnerabilities through network scanning as soon as\
    \ possible according to the specific application environment, and timely take\
    \ appropriate measures to repair, it can effectively prevent the occurrence of\
    \ intrusion events. Because the work is relatively boring, we can implement it\
    \ with some convenient tools, such as Nessus and OpenVAS.\n\n## 3) Exploiting\n\
    \nExploiting is an important way to gain control of the system. The user finds\
