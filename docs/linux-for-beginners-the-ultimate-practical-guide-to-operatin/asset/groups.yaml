    # CHAPTER 3. File System


    Linux’s file system is outstanding when it comes to flexibility. Its design allows
    it to support regular, as well as special types of file formats. It can support
    text, programs, images, services, output, and input devices. Therefore, since
    it supports a variety of file formats, it can coexist with another OS.


    Moreover, in the system, there is hardly a distinguishable factor between a file
    and a directory. It follows that directories are simply locations of file stacks.


    ## Categorization of Files


    To ensure a better understanding of the Linux file system, files are categorized.
    While it is considered safe to assume, knowing more information about a particular
    file allows programmers and system administrators to avoid complexities when using
    Linux. This also prevents them from performing long listings.


    File categories:


    - Directory (d) – a file that is a list of a stack of files

    - Link (l) – a system that allows the visibility of a particular file in multiple
    parts of a file tree

    - Pipe (p) – a system that allows inter-process communication

    - Regular (-) – a normal file

    - Socket (s) – a special file that provides inter-process networking

    - Special (c) – a mechanism used for output and input


    ## The Art of Partitioning


    Partitioning in Linux began when power failures threatened the majority of Linux
    users. There were days when an outage meant serious damages to a system.

    Moreover, the primary reason for partitioning is to achieve a much higher data
    security level. The hard disk''s division allows safe grouping and protection.

    Due to successful partitioning, you can prioritize data groups with more importance.
    When part of a hard disk is compromised, only that part of the disk is affected.
    The rest that is stored in other partitions remains untouched.


    Two major partitions in a Linux system:


    - Swap - refers to extra memory or an expansion

    - Data - refers to normal data; refers to the necessities for starting and running
    a system


    Recommended partitions:


    - A partition for necessary data

    - A partition for server programs and configuration data

    - A partition for programs and applications

    - At least one partition for user mails, archives, and database tables

    - At least one partition for specific files

    - At least one partition for virtual memory


    Common partitions:


    - A partition that contains personal data

    - A partition that stores temporary files

    - A partition that stores third-party data

    - A partition that is solely for programs


    ## Directories: The Root Directory & Subdirectories


    In Linux, there is a directory called The Root Directory. It serves as the main
    directory and as programmers and system administrators would refer to it, it is
    the directory of all directories.


    With The Root Directory come the subdirectories. These subdirectories manage files
    according to their assigned tasks.


