  mdcn: "\n\n## 管理 Sudo 权限\n\n在完成 `visudo` 访问设置后，你便可以开始编辑 sudoers 文件。该文件将决定哪些账户拥有\
    \ sudo 权限。当你首次打开 sudoers 文件并滚动到底部时，你很可能会看到类似如下的行：\n\n```\nroot ALL=(ALL) ALL\n\
    ```\n\n实际上，这意味着 root 用户可以从所有终端（就像所有用户一样）执行操作，并运行所有命令。试着将“all”理解为“任何”，你就会明白这有多令人担忧。root\
    \ 用户基本上可以命令它想要命令的任何东西，获取它想要的任何东西，并做它想做的任何事情。\n\n如果你希望自己在其他账户上也拥有类似的权限，你需要为自己设置一个专门设计为\
    \ sudo 账户的账号。\n\n首先，你必须以 root 用户身份登录到你的服务器。\n\n然后，使用 `adduser` 命令，你必须创建一个新的用户名。\n\
    \n```\n$ adduser usernamehere\n```\n\n此时，系统会要求你为该账户设置一个新的密码。请记住你的密码，并确保它足够安全。之后，该命令会为你创建一个主目录。除非你希望手动填写，否则只需按\
    \ Enter 键接受默认设置即可。\n\n然后，你必须使用以下命令将新用户添加到 sudo 组：\n\n```\n$ usermod -aG sudo usernamehere\n\
    ```\n\n这应该会赋予你 sudo 权限，但你最好还是测试一下。使用 `su` 命令切换到新用户：\n\n```\n$ su - usernamehere\n\
    ```\n\n此时，你需要测试你的访问权限。尝试使用 `whoami` 命令来获取你的详细信息：\n\n```\n$ sudo whoami\n```\n\n\
    如果操作正确，该命令的输出将是 “root”。如果输出是 `root`，说明你拥有访问权限。\n\n从这里开始，你只需在任何你发出的命令前加上 `sudo`\
    \ 命令，并在其后加一个空格。在会话中第一次尝试使用 `sudo` 时，出于安全原因，系统会要求你输入密码。\n\n就这样，你的用户账户将拥有 sudo 权限，这让你能够避免任何可能导致系统瘫痪或以任何方式破坏文件的痛苦错误。既然现在你必须输入\
    \ `sudo` 才能执行任何重要或危险的操作，你应该已经相当安全了。\n\n## 测验：控制特权用户\n\n恭喜！你已读完《控制特权用户》章节。至此，你应该已经对\
    \ Linux 系统中用户层级结构有了一个大致的了解，并且知道如何为自己获取合适级别的安全性。通常，此时会提供五个问题。请尝试回答这些问题，以判断你迄今对所展示内容的理解程度。一如既往，答案将在本测验后的下一页提供。\n\
    \n- 哪种用户类型拥有最多的权限？\n    - a. 普通用户\n    - b. Root 用户\n    - c. 系统用户\n    - d. 随机用户\n\
    \n- 哪个命令可以覆盖管理限制，而无需登录到管理账户？\n    - a. sudore\n    - b. visudo\n    - c. sudo\n\
    \    - d. su\n\n- 以下哪个陈述是正确的？\n    - a. 由于有删除重要信息的风险，你应该避免使用 root 用户账户\n    -\
    \ b. 由于有删除重要信息的风险，你应该避免使用 visudo 进行编辑\n    - c. 由于有删除重要信息的风险，你应该避免使用 sudo 命令\n\
