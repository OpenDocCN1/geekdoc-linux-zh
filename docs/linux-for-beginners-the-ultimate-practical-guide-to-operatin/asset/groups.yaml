    ## 第 13 章。练习


    正如我们上面已经学到的，创建目录非常简单。同样，从 Linux 系统中移除或删除目录也是非常简单的。但是，有一点你必须牢记在心：一旦你从 Linux 系统中移除或删除了一个目录，就没有办法撤销该操作。因此，最好在运行任何
    Linux 命令时都要小心谨慎。如果可以的话，最好在运行命令之前进行双重检查。我们将使用 rmdir 命令（代表 remove directory，即删除目录）来移除或删除目录。这里需要注意的一点是，rmdir
    命令像 mkdir 命令一样支持 -p 和 -v 选项。此外，在删除目录之前，该目录必须是空的。我们稍后会学习如何绕过这一限制。


    1. `rmdir linux_tutorial/beginner/commands`

    2. `ls linux_tutorial/beginner`


    ### 如何创建一个空文件


    许多涉及文件内数据操作的命令具有一个绝佳特性：当我们要引用一个不存在的文件时，它们会自动创建该文件。事实上，我们可以利用这一特性，使用 touch 命令来创建一个空文件。换句话说，你输入命令
    touch，后跟命令行选项和文件名。


    1. `pwd`

    2. `/home/Gary/linux_tutorial`

    3. `ls`

    4. `beginner`

    5. `touch practice_exercise1`

    6. `ls practice_exercise1 commands`


    ### 复制或目录


    让我们考虑以下示例：


    1. `user@bash: ls`

    2. `practice_exercise1 commands`

    3. `cp practice_exercise1 Exercise1`

    4. `ls`

    5. `practice_exercise1 Exercise1 commands`


    在这种情况下，我们必须注意的一个重要点是源和目的地指向的路径。我们可以考虑的一些示例包括：


    - `cp /home/Gary/linux_tutorial/Exercise1 Exercise2`

    - `cp Exercise2 ../../backups`

    - `cp Exercise2 ../../backups/Exercise3`


    当你使用 cp 命令时，文件的目的地可以代表文件或目录的路径。如果目的地是一个文件，例如 Exercise1、2 或 3，则将在目标文件中创建文件的副本，但原始文件仍保留在源文件或目录中。如果我们把文件复制到目录中，文件将在目标目录中保留其名称。在
    cp 命令的默认行为中，它只复制文件。在此情况下，“递归”一词意味着你希望复制该目录以及该目录中的所有内容，其中可能包括文件、目录和子目录等。


    让我们考虑以下示例：


    1. `user@bash: ls`

    2. `Gary Practicals transfers`

    3. `user@bash: cp Practicals Practicals_beginner`

    4. `cp: omitting directory ''Practicals.''`

    5. `user@bash: cp -r Practicals Practicals_beginner`

    6. `user@bash: ls`

    7. `Gary Practicals transfers Practicals_beginner`


    请记住，Practicals 目录内的任何文件或目录都将被复制到 Practicals_beginner 目录中。


