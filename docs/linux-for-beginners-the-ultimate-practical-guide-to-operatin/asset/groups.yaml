    ## 3) -sU scan (UDP scan)


    This scanning is also in the penetration-testing checklist after the importance
    of -sS scan. There is no need to send SYN packets like in TCP scan because this
    will just find UDP ports that are open. When the hackers start using the scan,
    a UDP packet reaches the target host and waits for a positive response. If at
    all a response is received, an open port is found. If it sends an error message
    with an Echo command, then the port is closed.


    Below is the command line for -sU scan hacking:


    ```

    kali@kali:~$ nmap -sU 192.168.2.1

    ```


    ## 4) -sF scan (FIN scan)


    This is a special type of scan that is used because some targets may have installed
    intrusion detection systems and firewalls that stop SYN packets that are sent
    using a TCP scan. For this sole reason, FIN scan is used if there is any extra
    detection scan happening on the other side. FIN scan does not save any log information
    to be detected, so there is a great chance of the FIN packet to find out few open
    ports by sneaking into the target systems. Here is the command for -sF scan:


    ```

    kali@kali:~$ nmap -sF 192.168.2.1

    ```


    ## 5) -sP scan (Ping scan)


    Ping is a famous network protocol method that checks whether a host is live or
    not by trying to connect to the target host. Ping scanning in Nmap also is used
    for the same purpose and is not used to check open ports. Ping scan asks for root
    access to start a scan. If you are not ready to provide the administrative privileges,
    you can just use the connect method to start a ping sweep from Nmap. Here is the
    command for -sP scan:


    ```

    kali@kali:~$ nmap -sP 192.168.2.1

    ```


    ## 6) -sV scan (Version detection scan)


    A version detection scan is one of the obsessive usages of Nmap for hackers. To
    attack a target system, you need to know about the technology and operating system
    the host is using so you create your exploits and backdoor strategies to break
    into the system. However, unlike TCP scans, version detection scan takes a lot
    of time because when we start a -sV scan in the background, TCP scan gets started
    and searches for the open ports. After the hunt for open ports gets finished,
    -sV scan automatically analyzes them and determines the information about the
    target host. Due to this complex procedure, it may take a lot of time. Here is
    the command for -sV scan:


