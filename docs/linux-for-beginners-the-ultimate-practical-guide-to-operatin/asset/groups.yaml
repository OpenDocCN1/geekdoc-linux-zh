    important people working on Linux. Before working for Linux he worked in SUSE
    labs where he gained a load of experience in the field. He not only maintains
    the many subsystems of Linux, but he was also responsible for the Linx-hotplug,
    Linux Driver Project, and the udev project. He made great'
