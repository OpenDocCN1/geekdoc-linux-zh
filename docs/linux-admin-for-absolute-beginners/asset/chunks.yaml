    ## Linux 管理员 - 备份与恢复


    在探索用于 CentOS 部署的标准备份方法之前，让我们先讨论典型的备份策略。我们首先想要熟悉的是 3-2-1 备份规则。


    ### 3-2-1 备份策略


    在行业中，你经常听到 3-2-1 备份术语。这是实现备份计划的一种非常好方法。3-2-1 定义如下：


    - 3 份数据副本：例如，我们可以有一份工作副本；使用 `rsync` 设计的冗余 CentOS 服务器副本；以及来自服务器数据的异地备份。

    - 2 种不同的介质：在这种情况下我们实际上有三种介质：笔记本或工作站上的工作副本、RAID 中的 服务器 服务器以及 USB 硬盘上的异地备份。

    - 1 份异地数据副本：我们每天备份 USB。另一种现代方法是云备份。


    ### 系统恢复


    裸机恢复是管理员为了让关键系统带有所有数据的计划。假设系统发生 100% 故障且硬件丢失，管理员必须有一个实现数据完好的计划。Linux 使用的单体内核实际上使得使用镜像进行裸机恢复比
    Windows 简单。Windows 使用微内核架构。全数据恢复和裸机恢复通常通过多种方法实现，包括运行服务器的工作配置磁盘镜像、3-2-1 规则的用户数据冗余备份。某些敏感文件也可以存储在受信任人员限制访问的安全防火险箱中。使用原生工具的多阶段裸机恢复和数据恢复计划可能包括：


    - `dd` 用于创建和恢复服务器的磁盘镜像

    - `rsync` 用于所有数据的增量备份

    - `tar & gzip` 用于存储带有管理员密码的加密备份。通常，这些可以放在 USB 硬盘上，加密并锁定在经理可以访问的安全箱中。这也确保了如果当前管理员消失在某个阳光岛，其他人也会知道安全凭据。如果系统由于硬件故障或灾难崩溃，以下是恢复的不同阶段：


    - 使用配置裸机镜像构建工作服务器

    - 从备份恢复数据到工作服务器

    - 拥有执行前两个操作所需的凭据物理访问


    ## 使用 rsync 进行文件备份


    `rsync` 是本地或到另一个服务器同步文件目录的强大工具。系统管理员多年一直使用 `rsync`，因此它对于备份数据的目的非常完善。在作者看来，同步的最佳功能之一是可以从命令行进行脚本化。在本教程中，我们将以各种方式讨论
    `rsync`：


    - 探索并讨论一些选项

    - 创建本地备份

    - 通过 SSH 创建远程备份

    - 恢复本地备份


    `rsync` 以其用途命名：远程同步（Remote Sync），并且在使用时既强大又灵活。以下是一个通过 ssh 进行的基础 `rsync` 远程备份：


    ```bash

    Mi:~ rdc$ rsync -avz --progress ./Desktop/ImportantStuff/rdc@192.168.1.143:home/rdc/
    Documents/RemoteStuff/rdc@192.168.1.143''s password:sending incremental file list
    6148 100% 0.00kB/s 0:00:00 (xfr#1, to-chk=23/25)

    2017-02-14 16_26_47-002 - Veeam_Architecture001.png 33144 100% 31.61MB/s 0:00:00
    (xfr#2, to-chk=22/25)

    A Guide to the WordPress REST API | Toptal.pdf 892406 100% 25.03MB/s 0:00:00 (xfr#3,
    to-chk=21/25)

    Rick Cardon Technologies, LLC..webloc 77 100% 2.21kB/s 0:00:00 (xfr#4, to-chk=20/25)

    backbox-4.5.1-i386.iso 43188224 1% 4.26MB/s 0:08:29sent 2318683608 bytes received
    446 bytes 7302941.90 bytes/sec total size is 2327091863 speedup is 1.00M

    Mi:~ rdc$

    ```


    `rsync` 语法：`rsync [options] [local path] [[remote host:remote path] or [target
    path]`


    上述显示了过去 4 天的所有警告。使用 systemd 查看和解析日志不需要太多的练习和研究。然而，通过不同的输出格式并使其通用，它是值得采纳的。journald
    比传统方法提供了极大的灵活性效率。


