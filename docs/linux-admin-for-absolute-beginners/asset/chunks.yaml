    # Examine Boot Logs


    First, we will examine and configure the boot logs in CentOS Linux. The first
    thing you will notice is that CentOS, by default, doesn''t store boot log logging
    that is persistent across reboots.


    To check boot logs per reboot instance, we can issue the following command:


    ```bash

    [root@centos rdc]# journalctl --list-boots

