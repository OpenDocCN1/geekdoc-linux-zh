- fmt: "\n# Service Status Management\n\nTo check the status of a service, use:\n\
    ```bash\n[root@localhost]# systemctl status network.service\n```\n```\nnetwork.service\
    \ - LSB: Bring up/down networking\nLoaded: loaded (/etc/rc.d/init.d/network; bad;\
    \ vendor preset: disabled)\nActive: active (exited) since Sat 2017-01-14 04:43:48\
    \ EST; 1min 31s ago\nDocs: man:systemd-sysv-generator(8)\nProcess: 923 ExecStart\
    \ = /etc/rc.d/init.d/network start (code=exited, status = 0/SUCCESS)\nlocalhost.localdomain\
    \ systemd[1]: Starting LSB: Bring up/down networking...\nlocalhost.localdomain\
    \ network[923]: Bringing up loopback interface: [ OK ]\nlocalhost.localdomain\
    \ systemd[1]: Started LSB: Bring up/down networking.\n```\n\nShow us the current\
    \ status of the networking service. If we want to see all the services related\
    \ to networking, we can use:\n```bash\n[root@localhost]# systemctl --all -t service\
    \ | grep -i network\n```\n```\nnetwork.service               loaded   active \
    \  exited   LSB: Bring up/\nNetworkManager-wait-online.service  loaded   active\
    \   exited   Network Manager\nNetworkManager.service        loaded   active  \
    \ running  Network Manager\nntpd.service                   loaded   inactive dead\
    \     Network Time\nrhel-import-state.service     loaded   active   exited   Import\
    \ network\n```\n\n# systemd and systemctl\n\nFor those familiar with the sysinit\
    \ method of managing services, it is important to make the transition to `systemd`.\
    \ `systemd` is the new way starting and stopping daemon services in Linux.\n\n\
    Linux Admin - Resource Mgmt with systemctl\n\n`systemctl` is the utility used\
    \ to control `systemd`. `systemctl` provides CentOS administrators with the ability\
    \ to perform a multitude of operations on systemd including:\n- Configure systemd\
    \ units\n- Get status of systemd units\n- Start and stop services\n- Enable /\
    \ disable systemd services for runtime, etc.\n\nThe command syntax for `systemctl`\
    \ is pretty basic, but can tangle with switches and options. We will present the\
    \ most essential functions of `systemctl` needed for administering CentOS Linux.\n\
    \n### Basic systemctl syntax:\n```\nsystemctl [OPTIONS] COMMAND [NAME]\n```\n\n\
    Following are the common commands used with `systemctl`:\n- `start`\n- `stop`\n\
    - `restart`\n- `reload`\n- `status`\n- `is-active`\n- `list-units`\n- `enable`\n\
    - `disable`\n- `cat`\n- `show`\n\nWe have already discussed `start`, `stop`, `reload`,\
    \ `restart`, `enable` and `disable` with `systemctl`. So let's go over the remaining\
    \ commonly used commands.\n\n### status\nIn its most simple form, the `status`\
    \ command can be used to see the system status as a whole:\n```bash\n[root@localhost\
    \ rdc]# systemctl status\n```\n```\n● localhost.localdomain State: running\nJobs:\
    \ 0 queued Failed: 0 units\nSince: Thu 2017-01-19 19:14:37 EST; 4h 5min ago\n\
    CGroup: /\n       ├─1 /usr/lib/systemd/systemd --switched-root --system --deserialize\
    \ 21\n       ├─user.slice\n       │ └─user-102.slice\n       │   └─session-1.scope\n\
    \       ├─2869 gdm-session-worker [pam/gdm-password]\n       ├─2881 /usr/bin/gnome-keyring-daemon\
    \ --daemon\n       ├─2888 gnome-session --session gnome\n       └─2895 dbus-launch\
    \ --exit-with-session\n```\nThe above output has been condensed. In the real-world\
    \ `systemctl status` will output about 100 lines of process statuses. Let's say\
    \ we want to check the status of our service:\n```bash\n[root@localhost rdc]#\
    \ systemctl status firewalld\n```\n```\n● firewalld.service - firewall daemon\n\
    Loaded: loaded (/usr/lib/systemd/system/firewalld.service; enabled; vendor preset:\
    \ enabled)\nActive: active (running) since 2017-01-19 19:4:5 EST; 4h 2min ago\n\
    Docs: man:firewalld(1)\nMain PID: 825 (firewalld)\nCGroup: /system/firewalld.service\n\
    \       └─825 /usr/bin/python -sbin/firewalld --fork --daemon\n```\nAs you see,\
    \ our service is currently active and has been for 4 hours.\n\n### list-units\n\
    The `list-units` command allows us to list all the units of a certain type. Let's\
    \ check for sockets managed by `systemd`:\n```bash\n[root@localhost]# systemctl\
    \ list-units --type=socket\n```\n```\nUNIT                           ACTIVE SUB\
    \ DESCRIPTION\navahi-daemon.socket           loaded   running  Avahi mDNS/SD Activation\n\
    cups.socket                   loaded   running  CUPS Printing Services\ndbus.socket\
    \                   loaded   running  D-Bus System Bus\ndm-event.socket      \
    \         loaded   listening  Device-mapper event daemon\nisid.socket        \
    \           loaded   listening  Open-SCSI daemon\nsystemd-socket.socket      \
    \   loaded   listening  Open-SCSI daemon\nlvm2-lvmetad.socket          loaded\
    \   running  LVM2 metadata daemon\nlvm2-lvmpoll.socket           loaded   listening\
    \  LVM2 poll daemon\nrpcbind.socket                loaded   listening  RPCbind\
    \ Server Activation\nsystemd-initctl.socket        loaded   listening  /dev/initctl\
    \ Compatibility Pipe\nsystemd-journald.socket      loaded   running  Journal Socket\n\
    systemd-shutdown.socket       loaded   listening  Delayed Shutdown Socket\nsystemd-udevd-control.socket\
    \ loaded   running  udev Control Socket\nsystemd-udevd-kernel.socket  loaded \
    \  running  udev Kernel Socket\nvirtlockd.socket              loaded   listening\
    \  Virtual machine lock\nvirtlogd.socket               loaded   listening  Virtual\
    \ machine log manager\n```\n\n### is-active\nLet's check the current running services.\
    \ The `is-active` command is an example of systemctl commands designed to return\
    \ the status information of a unit.\n```bash\n[root@localhost rdc]# systemctl\
    \ is-active ksm.service\n```\n```\nactive\n```\n\n### cat\n`cat` is one of the\
    \ seldom used commands. Instead of using `cat` at the shell and typing the path\
    \ to a unit file, simply use `systemctl cat`.\n```bash\n[root@localhost]# systemctl\
    \ cat firewalld\n# /usr/lib/systemd/system/firewalld.service\n```\n```\n[Unit]\n\
    Description=firewalld - dynamic firewall daemon\nBefore=network.target Before=dbus.service\
    \ After=NetworkManager.service After=dbus.service After=policy.service\nConflicts=iptables.service\
    \ ip6tables.service ebtables.service ipset.service\nDocumentation=man:firewalld(1)\n\
    [Service]\nEnvironment=-etc/config/firewalld\nExecStart=/usr/sbin/firewalld --fork\
    \ --daemon $FIREWALLD_ARGS\nExecReload=/bin/kill -HUP $MAINPID\n# suppress log\
    \ debug and error output also to /var/log/messages\nStandardOutput=null\nStandardError=null\n\
    Type=dbus\nBusName=org.fedoraject.firewalld\n[Install]\nWantedBy=basic.target\n\
    Alias=dbus-org.fedoraject.firewalld.service\n```\n\n# Linux Admin - Resource Mgmt\
    \ with cgroups\n\nNow that we have explored both `systemd` and `systemctl` in\
    \ more detail, let's use them to manage the resources in cgroups or control groups.\n\
    \ncgroups or Control Groups are a feature of the Linux kernel that allows an administrator\
    \ to allocate or cap the system resources for services and also group. To list\
    \ active control groups running, we can use the following `ps` command:\n```bash\n\
    [root@localhost]# ps xaf -eo pid,user,cgroup,args\n```\n```\n8362 root      -\
    \ _ [kworker/1:2]\n1 root      - /usr/lib/systemd/systemd --switched-root --system\
    \ --deserialize 21\n507 root      7:cpuacct,cpu:/system.slice /usr/lib/systemd/systemd-journald\n\
    527 root      7:cpuacct,cpu:/system.slice /usr/sbin/lvmetad -f\n540 root     \
    \ 7:cpuacct,cpu:/system.slice\n715 root      7:cpuacct,cpu:/system.slice /usr/lib/systemd/systemd-udevd\n\
    731 root      7:cpuacct,cpu:/system.slice /usr/sbin/auditd\n734 root      7:cpuacct,cpu:/system.slice\n\
    737 root      7:cpuacct,cpu:/system.slice /usr/lib/systemd/systemd\n740 root \
    \     7:cpuacct,cpu:/system.slice /usr/sbin/dbus\n```\n"
