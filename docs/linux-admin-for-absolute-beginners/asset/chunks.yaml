    # Note on block size


    The default block size for `dd` is 512 bytes. This was the standard block size
    of lower density hard drives. Today''s higher density HDDs have increased to 4096
    byte (4kB) block sizes to allow for disks ranging from 1TB and larger. Thus, we
    will want to check disk block size before using `dd` with newer, higher capacity
    hard disks.


    For this tutorial, instead of working on a production server with `dd`, we will
    be using a CentOS installation running in `VMWare`. We will also configure `VMWare`
    to boot a bootable Linux ISO image instead of working with a bootable USB Stick.


    First, we will need to download the CentOS image titled: `CentOS Gnome ISO`. This
    is almost 3GB and it is advised to always keep a copy for creating bootable USB
    thumb-drives and booting into virtual server installations for troubleshooting
    and bare metal images.


    Other bootable Linux distros will work just as well. `Linux Mint` can be used
    for bootable ISOs as it has great hardware support and polished GUI disk tools
    for maintenance.


    CentOS GNOME Live bootable image can be downloaded from: [http://buildlogs.centos.org/rolling/7/isos/x86_64/CentOS-7-x86_64-LiveGNOME.iso](http://buildlogs.centos.org/rolling/7/isos/x86_64/CentOS-7-x86_64-LiveGNOME.iso)


    Let''s configure our `VMWare Workstation` installation to boot from our Linux
    bootable image. The steps are for `VMWare` on OS X. However, they are similar
    across `VMWare Workstation` on Linux, Windows, and even `Virtual Box`.


    **Note** — Using a virtual desktop solution like `Virtual Box` or `VMWare Workstation`
    is a great way to set up lab scenarios for learning CentOS Administration tasks.
    It provides the ability to install several CentOS installations, practically no
    hardware configuration letting the person focus on administration, and even save
    the server state before making changes.


    ## Configuring the Environment


    First let''s configure a virtual cd-rom and attach our ISO image to boot instead
    of the virtual CentOS server installation — ![ISO image](Image00010.jpg)


    Now, set the startup disk — ![Startup Disk](Image00011.jpg)


    Now when booted, our virtual machine will boot from the CentOS bootable ISO image
    and allow access to files on the Virtual CentOS server that was previously configured.


    Let’s check our disks to see where we want to copy the MBR from (condensed output
    is as follows).


    ```

    Mint ~ # fdisk -l

    Disk /dev/sda: 60 GiB, 21474836480 bytes, 41943040 sectors

    Units: sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    Disk /dev/sdb: 20 GiB, 21474836480 bytes, 41943040 sectors

    Units: sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    ```


    We have located both our physical disks: `sda` and `sdb`. Each has a block size
    of 512 bytes. So, we will now run the `dd` command to copy the first 512 bytes
    for our MBR on `SDA1`.


    The best way to do this is —


    ```bash[root@mint rdc]# dd if=/dev/sda bs=512 count=1 | gzip -c >/mnt/sdb/images/mbr.iso.gz

    1+0 records in

    1+0 records out

    512 bytes copied, 0.000171388 s, 3.0 MB/s

    [root@mint rdc]# ls /mnt/sdb/

    mbr-iso.gz

    [root@mint rdc]#

    ```


    Just like that, we have full image of out our master boot record. If we have enough
    room to image the boot drive, we could just as easily make a full system boot
    image —


    ```bash

    dd if=/dev/INPUT/DEVICE-NAME-HERE conv=sync,noerror bs=4K | gzip -c >/mnt/sdb/boot-server-centos-image.iso.gz

    ```


    The `conv=sync` is used when bytes must be aligned for a physical medium. In this
    case, `dd` may get an error if exact 4K alignments are not read (say... a file
    that is only 3K but needs to take minimum of a single 4K block on disk. Or, there
    is simply an error reading and the file cannot be read by `dd.). Thus, `dd` with
    `conv=sync,noerror` will pad the 3K with trivial, but useful data to physical
    medium in 4K block alignments. While not presenting an error that may end a large
    operation.


    When working with data from disks we always want to include: `conv=sync,noerror`
    parameter.


    ## Using Gnu Tar


    `tar` is an archiving utility similar to `winrar` on Windows. Its name Tape Archive
    abbreviated as `tar` pretty sums up the utility. `tar` will take files and place
    them into an archive. Hence, instead of the dozens of files stored in `/etc`,
    we could just "tar" them up into an archive for backup. `tar` has been the standard
    for storing archived files on Unix and Linux for many years. Hence, using `tar`
    with `gzip` or `bz2` is considered as best practice for archives.


    Following is a list of command line switches and options used with `tar`:


    | Switch | Action |

    | :--- | :--- |

    | `-c` | Creates a new .tar archive |

    | `-C` | Extracts to a different directory |

    | `-j` | Uses `bz2` compression |

    | `-z` | Uses `gzip` compression |

    | `-v` | Verbose show archiving progress |

    | `-t` | Lists archive contents |

    | `-f` | Filename of the archive |

    | `-x` | Extracts archive |


    Following is the basic syntax for creating a tar archive:


    ```bash

    tar -cvf [tar archive name]

    ```


    ## Compression mechanisms with tar


    **Note on compression mechanisms with tar** — It is advised to stick with one
    of two common compression schemes when using `tar`: `gzip` and `bz2`. `gzip` files
    consume less CPU resources but are usually larger in size. While `bz2` will take
    longer to compress, they utilize more CPU resources; but will result in a smaller
    file size.


    When using file compression, we will always want to use standard file extensions
    letting everyone including ourselves know (versus guess by trial and error) what
    compression scheme is needed to extract archives.


    | Extension | Description |

    | :--- | :--- |

    | `bz2` | `.tbz` |

    | `bz2` | `.tar.tbz` |

    | `bz2` | `.tb2` |

    | `gzip` | `.tar.gz` |

    | `gzip` | `.tgz` |

