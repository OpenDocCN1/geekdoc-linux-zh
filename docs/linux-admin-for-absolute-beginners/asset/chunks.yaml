    接下来，我们要为与客户端协商 PFS（完全前向秘密）创建一个 Diffie-Hellman 组。


    ```bash

    [centos#] openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048

    ```

    这将需要 5 到 15 分钟。完全前向秘密（Perfect Forward Secrecy）——用于在私钥泄露的情况下保护会话数据。这将生成一个客户端和服务器之间使用的密钥，且每个会话都是唯一的。


    现在，将完全前向秘密配置添加到我们的证书中。

    ```bash

    [root@centos]# cat /etc/ssl/certs/dhparam.pem | tee -a /etc/ssl/certs/self-sıgn-apache.crt

    ```


    # 配置 Apache 使用密钥和证书文件

    我们将修改 `/etc/httpd/conf.d/ssl.conf` —— 我们将对 `ssl.conf` 进行以下更改。但在在此操作之前，我们应该备份原始文件。在使用
    `vı` 或 `emcas` 等高级文本编辑器对生产服务器进行更改时，在编辑之前始终备份配置文件是最佳实践。

    ```bash

    [root@centos]# cp /etc/httpd/conf.d/ssl.conf ~/

    ```

    现在，在我们将已知良好的 `ssl.conf` 副本复制到主目录根目录后，继续我们的编辑。


    ❖ 定位

    ❖ 按照如下方式同时编辑 `DocumentRoot` 和 `ServerName`。


    ```apache

    # 虚拟主机通用设置，继承自全局配置

    DocumentRoot "/var/www/html"

    ServerName centos.vmnet.local:443

    ```

    `DocumentRoot` 这是指向默认 apache 目录的路径。此文件夹中应该有一个默认页面，将显示一个请求 Web 服务器或网站默认页的 HTTP
    请求。

    `ServerName` 是服务器名称，可以是 IP 地址或服务器的主机名。对于 TLS，创建一个带有主机名的证书是最佳实践。根据我们的 OpenLdap
    教程，我们在本地企业域 `vmnet.local` 上创建了名为 `centos` 的主机名。


    现在我们想要注释掉以下行。

    ```apache

    SSLProtocol

    # SSL 协议支持：

    # 列出客户端能够连接的启用协议级别。

    # 默认禁用 SSLv2 访问：

    ~~~~> #SSLProtocol all -SSLv2

    # SSL 密码套件：

    # 列出允许协商的加密算法。

    # 请查看 mod_ssl 文档完整列表。

    ~~~~> #SSLCıpherSuıte HIGH:MEDIUM:!aNULL:!MD5:!SEED:!IDEAT

    ```

    然后让 Apache 哪里寻找我们的证书和私钥/公钥对。


    指定我们自签名证书文件的路径

    ```apache

    # 服务器证书：

    # 将 SSLCertıficateFıle 指向 PEM 编码的证书。如果证书已加密，将提示你输入密码短。注意，执行 `kill -HUP` 会再次提示。可以使用
    `genkey(1)` 命令生成新证书。

    ~~~~> SSLCertıficateFıle /etc/ssl/certs/self-sıgn-apache.crt

    ```

    指定我们私钥文件的路径

    ```apache

    # 服务器私钥：

    # 如果密钥未与证书合并，使用此指令指向密钥文件。请记住，如果你同时拥有 RSA 和 DSA 私钥，可以并行配置两者（以允许使用 DSA 加密算法等）。

    ~~~~> SSLCertıfıcateKeyFıle /etc/ssl/prıvate/self-gen-apache.key

    ```

    最后，我们需要允许通过端口 443 访问 https 的入站连接。


    # 在 CentOS 7 上安装 Apache Web 服务器

    在本章中，我们将学习一些关于 Apache HTTP Server 产生的背景知识，然后在 CentOS Linux 7 上安装最新的稳定版本。


    ## Apache WebServer 简史

    Apache 是一个已经存在了很长时间的 Web 服务器。事实上，它的历史几乎与 HTTP 本身的存在历史一样长！Apache 起始是国家超级计算机应用中心（也称为
    NCSA）的一个相当小的项目。在 90 年代中期，当时被称为 "httpd"，它当时是互联网上最流行的 Web 服务器平台，占据了约 90% 或更多的市场份额。此时，它还是一个简单的项目。被称为
    webmaster 的熟练 IT 员工负责：维护 Web 服务器平台和 Web 服务器软件，以及前端和后端的网站开发。httpd 的核心是它可以使用名为插件或扩展的自定义模块的能力。webmaster
    也足够优秀，可以为核心服务器软件编写补丁。有时在 90 年代后期，httpd 的高级开发人员和项目经理离开了 NCSA 去做其他事情。这导致这个最流行的 Web
    守护进程进入了停滞状态。由于 httpd 的使用非常广泛，一组经验丰富的 httpd webmasters 呼吁召开一次关于 httpd 未来的峰会。他们决定协调并将最好的扩展和补丁应用到当前的稳定发布版中。然后，现代
    Web 服务器的“老祖父”级产品诞生了，并被命名为 Apache HTTP Server。


    广为人知的历史事实 —— Apache 并不是以某个美国原住民命名的。事实上，它是由许多修复程序（或补丁）的天才计算机科学家创建并命名为 Apache 的。


    # 在 CentOS 7 上安装当前稳定版本

    第一步 —— 安装 httpd

    ```bash

    yum -y install httpd

    ```

    第二步 —— 编辑 httpd.conf

    在默认 Apache 安装中，配置文件名为 `httpd.conf` 位于 `/etc/httpd/`。所以，让我们打开它。`httpd.conf` 的前几行将进行以下更改，允许我们的
    CentOS 安装从端口 80 提供 HTTP 请求。


    # 监听主机和端口

    Listen: 允许将 Apache 绑定到 IP 地址或端口，而不是默认值。请另阅 VirtualHost。将此更改为所示的 IP 地址，以防止 Apache
    绑定到所有 IP 地址。

    ```apache

    Listen 123.34.56.78:80

    ```

    在这里我们将 Apache 监听到特定端口。例如，如果我们想在 8080 等替代端口上运行 httpd 服务。或者如果我们的 Web 服务器配置了多个接口。这对于仅指定
    IPv6 或 IPv4 甚至绑定到多网口的主机有用。

    Listen: 允许将 Apache 绑定到 IP 地址或端口，而不是默认值。请另阅 VirtualHost。将此更改为所示的 IP 地址。


    # DocumentRoot

    "document root" 是 Apache 查找索引文件以提供请求的默认目录。默认情况下，所有请求都从此目录获取，但符号链接和别名可以指向其他位置。

    ```apache

    DocumentRoot "/var/www/html"

    ```

    第三步 —— 启动并启用 httpd 服务。

    ```bash

    [root@centos]# systemctl start httpd && systemctl reload httpd

    [root@centos]#

    ```

    第四步 —— 配置防火墙允许访问 http 请求。

    ```bash

    [root@centos]# firewall-cmd --add-service=http --permanent

    ```


    ## CentOS 上的 MariaDB vs MySQL

    需要注意的是，在为 CentOS 配置 MariaDB 时，yum 仓库中没有原生的 MySQL 包。为了这一点，我们需要添加 MySQL 仓库。此外，MySQL
    需要一组与 MariaDB 不同的依赖。使用 MySQL 会破坏 CentOS 设计用于最大可靠性的概念和哲学。因此，在决定使用 MariaDB 还是 MySQL
    时，应该权衡两个选项：我的当前数据库是否与 MariaDB 工作？相比 MariaDB 安装 MySQL 有什么优势？MariaDB 组件对 MySQL 结构是
    100% 透明的，但在许可方面增加了额外的效率。除非有强力的理由，否则建议配置 CentOS 使用 MariaDB。大多数人将使用 MariaDB。当遇到问题时，你会在
    MariaDB 获得更多帮助。CentOS 是为运行 MariaDB 设计的。MariaDB 官方支持 CentOS。


    # 下载并添加 MySQL 仓库

    我们将下载并安装 MySQL 仓库 http://repo.mysql.com/mysql-community-release-el7-5.noarch.rpm

    第一步 —— 下载仓库。该仓库方便封装在 rpm 包中进行安装。可以使用 wget 下载。

    ```bash

    [root@centos]# wget http://repo.mysql.com/mysql-community-release-el7.noarch.rpm

    ```

    第二步 —— 从 YUM 安装 MySQL。我们现在可以使用 yum 包管理器安装 MySQL。

    ```bash

    [root@centos]# yum -y install mysql-server

    ```

    第三步 —— 启动并启用 MySQL 守护进程。

    ```bash

    [root@centos]# systemctl start mysql

    [root@centos]# systemctl enable mysql

    ```

    第四步 —— 确保我们的 MySQL 服务运行。

    ```bash

    [root@centos]# netstat -ant | grep 336

    ```

    注意 —— 我们不会允许防火墙规则通过。配置 MySQL 使用 Unix 套接字是常见的。这确保了只有本地的 LAMP 服务器栈可以访问数据库软件。


    # 设置 Postfix MTA 和 IMAP/POP3

    为了从我们的 CentOS 7 服务器发送电子邮件，我们需要设置以配置现代的邮件传输代理（MTA）。邮件传输代理是通过 SMTP 为用户或公司域发送输出邮件的守护进程。需要注意的是，本教程仅教授本地使用的设置守护进程的过程。不要将本教程用于面向互联网的
    MTA 配置。由于其对安全易于管理的共同关注，我们选择了 Postfix 作为本教程的 MTA。旧版本 CentOS 安装的默认 MTA 是 Sendmail。Sendmail
    是一个很棒的 MTA。但在作者看来，Postfix 在处理以下注意事项时达到了平衡点。在当前的 CentOS 版本中，Postfix 已取代 Sendmail
    成为默认。Postfix 使用广泛且文档齐全。它正在积极维护和开发。


    第一步 —— 从 YUM 包管理器安装 postfix。

    ```bash

    [root@centos]# yum -y install postfix

    ```

    第二步 —— 配置 postfix 文件。Postfix 配置文件位于 `/etc/postfix/main.cf`。在简单的 postfix 配置中，必须为特定主机配置以下：主机名、域名、源、接口和目标。


    配置主机名 —— 主机名是 Postfix 主机的完全限定域名。在 OpenLDAP 章节中，我们将 CentOS 节点命名为域 `vmnet.local`
    上的 `centos`。在本章中我们保持不变。`hostname` 参数指定此邮件系统的互联网主机名。默认是使用来自 `hostname()` 的完全限定域名。`$hostname`
    被用作许多其他配置参数的默认值。

    ```apache

    hostname = centos.vmnet.local

    ```

    配置域名 —— 如前，我们将使用 `vmnet.local`。`hostname` 参数指定此邮件系统的互联网主机名。默认是使用来自 `hostname()`
    的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。

    ```apache

    domain = vmnet.local

    ```

    配置源 —— 如前，我们将使用 `vmnet.local`。`hostname` 参数指定此邮件系统的互联网主机名。默认是使用来自 `hostname()`
    的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。

    ```apache

    origin = centos.vmnet.local

    ```

    配置接口 —— 如前，我们将使用 `vmnet.local`。`hostname` 参数指定此邮件邮件系统的主机名。默认是使用来自 `hostname()`
    的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。

    ```apache

    interfaces = 127.0.0.1

    ```

    配置目标 —— 如前，我们将使用 `vmnet.local`。`hostname` 参数指定此邮件系统的互联网主机名。默认是使用来自 `hostname()`
    的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。

    ```apache

    destination = localhost

    ```

