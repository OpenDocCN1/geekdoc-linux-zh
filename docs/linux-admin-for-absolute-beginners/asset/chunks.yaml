    \ --state [servicename.service]`\n\nFor a quick look at all the services running\
    \ on our box:\n```bash\n[root@localhost rdc]# systemctl -t service\nUNIT     \
    \               LOAD   ACTIVE   SUB      DESCRIPTION\nabrt-ccpp.service      \
    \ loaded   active   exited   Install ABRT coredump\nabrt-oops.service       loaded\
    \   active   running   ABRT kernel log watcher\nabrt-xorg.service       loaded\
    \   active   running   ABRT Xorg log watcher\nabrtd.service           loaded \
    \  active   running   ABRT Automated Bug Reporting Tool\naccounts-daemon.service\
    \ loaded   active   running   Accounts Service\nalsa-state.service      loaded\
    \   active   running   Manage Sound Card State (restore and store)\natd.service\
    \             loaded   active   running   Job spooling task\nauditd.service  \
    \        loaded   active   running   Security Auditing Service\navahi-daemon.service\
    \     loaded   active   running   Avahi mDNS/DNS-SD Stack\nblock-availability.service\
    \ loaded   active   exited   Availability of block devices\nbluetooth.service\
    \      loaded   active   running   Bluetooth service\nchronyd.service        \
    \ loaded   active   running   NTP client/server\n```\n\n## Stopping a Service\n\
    Let's first, stop the bluetooth service:\n```bash\n[root@localhost]# systemctl\
    \ stop bluetooth\n[root@localhost]# systemctl --all -t service | grep bluetooth\n\
    bluetooth.service      loaded   inactive dead     Bluetooth service\n```\nAs we\
    \ can see, the bluetooth service is now inactive. \n\nTo start the bluetooth service\
    \ again:\n```bash\n[root@localhost]# systemctl start bluetooth\n[root@localhost]#\
    \ systemctl --all -t service | grep bluetooth\nbluetooth.service      loaded \
    \  active   running   Bluetooth service\n```\n**Note** - We didn't specify `bluetooth.service`,\
    \ since the `.service` is implied. It is a good practice to think of the unit\
    \ type appending the service we are dealing with. So, from here on, we will use\
    \ the `.service` extension to clarify we are working on service unit operations.\n\
    \n## Primary Actions\nThe primary actions that can be performed on a service are:\n\
    \n| Action | Description |\n| :--- | :--- |\n| Start | Starts the service |\n\
    | Stop | Stops a service |\n| Reload | Reloads the active configuration of a service\
    \ without stopping it (like `kill -HUP` in system v init) |\n| Restart | Starts,\
    \ then stops a service |\n| Enable | Starts a service at boot time |\n| Disable\
    \ | Stops a service from automatically starting at run time |\n\nThe above actions\
    \ are primarily used in the following scenarios:\n\n| Action | Scenario |\n| :---\
    \ | :--- |\n| Start | To bring a service up that has been put in the stopped state.\
    \ |\n| Stop | To temporarily shut down a service (for example when a service must\
    \ be stopped to access files locked by the service, as when upgrading the service)\
    \ |\n| Reload | When a configuration file has been edited and we want to apply\
    \ the new changes while not stopping the service. |\n| Restart | In the same scenario\
    \ as reload, but the service does not support reload. |\n| Enable | When we want\
    \ a disabled service to run at boot time. |\n| Disable | Used primarily when there\
    \ is a need to stop a service, but ıt starts on boot. |\n"
