    \ -v 2.2.1\n```\n\n编译完成后：\n\n```bash\n[rdc@CentOS ~]$ ./ruby -v\nruby 2.2.1p85\
    \ (2015-02-26 revision 49769) [x86_64-linux]\n```\n\n我们现在拥有了一个可以运行的 Ruby 环境，其中包含了更新且可用的\
    \ `2.X` 分支版本。\n\n## 方法 2：通过 CentOS 软件包安装 Ruby\n\n这是最简单的方法。然而，它可能会受到 CentOS 封装的版本和\
    \ gem（（包）的限制。对于严肃的开发工作，强烈建议使用 `rbenv` 方法安装 Ruby。安装 Ruby、所需的开发包以及一些常用的 gem。\n\n\
    ```bash\n[root@CentOS rdc]# yum install -y ruby.x86_64 ruby-devel.x86_64 ruby-libs.x86_64\
    \ ruby-gem-json.x86_64 rubygem-rake.noarch\n```\n\n不幸的是，我们只得到了一个较旧的 Ruby 版本。\n\
    \n```bash\n[root@CentOS rdc]# ruby -v\nruby 2.0.0p648 (2015-12-16) [x86_64-linux]\n\
    ```\n\n# Linux 管理员 - 为 CentOS Linux 配置 Perl\n\nPerl 已经存在很了。它最初被设计为一种用于解析文本文件的报告语言。随着流行程度增加，Perl\
    \ 增加了模块支持 `CPAN`、套接字、线程以及作为强大的脚本语言所需的其他功能。\n\nPerl 相比于 `PHP`、`Python` 或 `Ruby`\
    \ 的最大优势是：它能以最少的麻烦完成任务。Perl 的这种哲学并不总是意味着它以正确的方式完成任务。然而，对于 Linux 上的管理任务，Perl 被认为是脚本语言的首选。\n\
    \n### Perl 优于 Python 或 Ruby 的优势\n- 强大的文本处理能力\n- Perl 让编写脚本变得快速且直接（通常一个 Perl 脚本会比\
    \ `Python` 或 `Ruby` 的对应脚本少几十行）\n- Perl（几乎）可以做任何事情\n\n### Perl 的缺点\n- 语法可能令人困惑\n\
    - Perl 的编码风格可能很独特并会阻碍协作\n- Perl 并不是真正的面向对象\n- 通常，在使用 Perl 时，没有在标准化和最佳实践上投入太多精力。\n\
    \n在决定使用 Perl、`Python` 还是 `PHP` 之前，应该问以下问题：\n- 此应用程序以后是否会需要版本控制？\n- 其他人以后是否需要修改这些代码？\n\
    - 其他人是否需要使用此应用程序？\n- 此应用程序以后是否会在另一台机器或 CPU 架构上运行？\n\n如果上述所有问题的答案都是“否”，那么 Perl\
    \ 是一个很好的选择，并可能在最终结果方面提高速度。\n\n话虽如此，让我们配置 CentOS 服务器以使用最新版本的 Perl。\n\n在安装 Perl\
    \ 之前，我们需要了解对 Perl 的支持情况。从官方角度来说，Perl 仅支持到过去的两个稳定版本。因此，我们希望确保我们的开发环境与 CentOS 的版本隔离开。\n\
    \n隔离的原因是：如果有人向 CentOS 社区发布了一个 Perl 工具，很可能它会被修改以便在 CentOS 自带的 Perl 版本上运行。然而，我们也希望为了开发目的安装最新版本。像\
    \ `Python` 一样，CentOS 提供的 Perl 专注于可靠性而不是尖端技术。\n\n让我们检查 CentOS 7 上当前的 Perl 版本。\n\
    \n```bash\n[root@CentOS]# perl -v\nThis is perl 5, version 16, subversion 3 (v5.16.3)\
    \ built for x86_64-linux-thread-multi\n```\n\n我们目前运行的是 Perl `5.16.3`。截至本文为止的最新版本是：`perl-5.24.0`。我们确实想要升级版本，以便在代码中使用最新的\
    \ Perl 模块。幸运的是，有一个很好的工具可以维护 Perl 环境并保持我们 CentOS 版本的 Perl 隔离。它被称为 `perlbrew`。\n\
    \n让我们安装 Perl Brew。\n\n```bash\n[root@CentOS]# curl -L https://install.perlbrew.pl\
    \ | bash\n```\n\n现在我们已经安装了 Perl，让我们为最新版本的 Perl 创建环境。首先，我们需要当前安装的 Perl 版本来引导 `perlbrew`。因此，让我们从\
    \ CentOS 仓库中获取一些所需的 Perl 模块。注意——在可用时，我们总是希望在 CentOS 安装中使用 CentOS 模块而不是 `CPAN`。\n\
    \n### 步骤 1 – 安装 CentOS Perl::Maker\n```bash\n[root@CentOS]# yum install -y perl-Utils-Maker.noarch\n\
    ```\n\n### 步骤 22 安装最新版本的 perl\n```bash\n[root@CentOS build]# source ~/perl5/perlbrew/etc/bashrc\n\
    [root@CentOS build]# perlbrew install -n -j4 --threads perl-5.24.1\n```\n我们为安装选择的选项是：\n\
    - `-n`: 不进行测试\n- `-j4`: 并行执行 4 个线程进行安装（我们正在使用四核 CPU）\n- `--threads`: 为 Perl 启用线程\n\
    \n成功安装后，让我们切换到最新的环境。\n\n```bash\n[root@CentOS]# ~/perl5/perlbrew/bin/perlbrew\
    \ use perl-5.24.1\n[root@CentOS]# perl -v\nThis is perl 5, version 24, subversion\
    \ 1 (v5.24.1) built for x86_64-linux-thread-multi (with 1 registered, see perl\
    \ -V for detail)\n```\n\nPerl 的完整文档（包括常见问题列表）可以通过 `man perl` 或 `perldoc perl`\
    \ 在系统上找到。如果你可以访问互联网，将浏览器指向 `http://www.perl.org/`，即 Perl 主页。\n\n在我们的 perlbrew\
    \ 环境上下文中运行打印版本的简单 perl 脚本：\n\n```bash\n[root@CentOS]# cat ./ver.pl\n#!/usr/bin/perl\n\
    print $V . \"\\n\";\n[root@CentOS]# perl ./ver.pl\nv5.24.1\n```\n\n一旦安装了 Perl，我们就可以\
    \ `perlbrew` 的 `cpanm` 加载 cpan 模块。\n\n```bash\n[root@CentOS]# perlbrew install-cpanm\n\
    ```\n\n现在让我们使用 `cpanm` 安装器为 perlbrew 中我们当前的 Perl 版本 `5.24.1` 制作 `LWP` 模块。\n\n\
    ### 步骤 1 – 切换到我们当前 Perl 版本的环境\n```bash\n[root@CentOS ~]# ~/perl5/perlbrew/bin/perlbrew\
    \ use perl-5.24.1\n```\n\n### 步骤 2 – 安装 LWP User Agent Perl 模块\n```bash\n[root@CentOS]#\
    \ ~/perl5/perlbrew/bin/cpanm - LWP::UserAgent\n```\n\n### 步骤 3 – 现在让我们用新的 CPAN\
    \ 模块测试我们的 Perl 环境\n```bash\n[root@CentOS]# cat ./get_header.pl\n#!/usr/bin/perl\n\
    use LWP;\nmy $browser = LWP::UserAgent->new();\nmy $response = $browser->get(\"\
    http://www.slcc.edu/\");\nunless(!$response->is_success) {\n    print $response->header(\"\
    Server\");\n}\n[root@CentOS ~]# perl ./get_header.pl\nMicrosoft-IIS/8.5\n```\n\
    \n搞好了！Perl Brew 让隔离 perl 环境变得轻而易举，随着 Perl 的发展，它可以被视为最佳实践。\n\n# 安装并配置 Open LDAP\n\
    \nLDAP（轻量级目录访问协议）是一种用于访问企业内部已知目录的 X.500 服务容器的协议。熟悉 Windows 服务器管理的人可以将 LDAP 认为在本质上与\
    \ Active Directory（活动）非常相似。它甚至是一个广泛使用的概念，将 Windows 工作站整合到 OpenLDAP CentOS 企业中。在另一端，CentOS\
    \ Linux 工作站可以共享资源并参与 Windows 域的基本功能。\n\n在 CentOS 上部署 LDAP 作为目录服务器代理、目录系统代理或 `DSA`（这些缩写都是一个意思），与旧的\
    \ Novell Netware 使用 NDS 的目录树结构安装是相似的。\n\n## LDAP 简史\n\nLDAP 基本上被创建为一种访问企业资源 X500\
    \ 目录的有效方式。X500 和 LDAP 共享相同的特性，并且如此相似，以至于 LDAP 客户端可以通过一些助手访问 X500 目录。虽然 LDAP 也有它自己的名为\
    \ slapd 的目录服务器。LDAP 和 DAP 的主要区别在于，轻量级版本设计为在 TCP 上运行，而 DAP 使用完整的 OSI 模型。随着互联网的出现，TCP/IP\
    \ 和以太网在当今网络中的普及，在特定的计算模型之外，很难遇到同时使用 DAP 和原生 X500 企业目录的目录服务实现。在 CentOS Linux 上配合\
    \ openldap 使用的主要组件有 –\n\n"
