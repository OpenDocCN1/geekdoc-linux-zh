  trans: "\n`gzip` 在多程度上是按文件为单位工作的，而不是像某些 Windows 操作系统上的 zip 工具那样以归包为单位。其主要原因是 `tar`\
    \ 已经提供了高级的归档功能。`gzip` 的设计仅是为了提供一种压缩机制。因此，当考虑 `gzip` 时，请考虑单个文件。当考虑多个文件时，请考虑 `tar`\
    \ 归包。现在，让我们通过之前的 `tar` 归包来探索这一点。\n\n注意 − 资丰富的 Linux 专业人士经常会将 tar 处理过的归包称为 tarball（压缩包）。\n\
    \n让我们从我们的 rsync 备份再次创建一个 `tar` 归包。\n```bash\n[root@centos Documents]# tar -cvf\
    \ RemoteStuff.tar ./RemoteStuff/\n[root@centos Documents]# ls\nRemoteStuff.tar\
    \ RemoteStuff/\n```\n\n为了演示目的，让我们 `gzip` 新创建的 tarball，并告诉 `gzip` 保留旧文件。默认情况下，在不使用\
    \ `-c` 参数的情况下，`gzip` 将将整个 tar 归包替换为 `.gz` 文件。\n```bash\n[root@centos Documents]#\
    \ gzip -c RemoteStuff.tar > RemoteStuff.tar.gz\n[root@centos Documents]# ls\n\
    RemoteStuff  RemoteStuff.tar  RemoteStuff.tar.gz\n```\n\n我们现在有了原始目录、tar 处理过的目录，最后是\
    \ gzipped 后的 tarball。让我们尝试用 `gzip` 测试 `-l` 关。\n```bash\n[root@centos Documents]#\
    \ gzip -l RemoteStuff.tar.gz\n      compressed          uncompressed       ratio\
    \ uncompressed_name\n      2317140467          2326661120         0.4% RemoteStuff.tar\n\
    ```\n\n为了演示 `gzip` 如何与 Windows Zip 工具不同，让我们在一个包含多个文本文件的文件夹上运行 `gzip`。\n```bash\n\
    [root@centos Documents]# ls text_files/\nfile1.txt  file2.txt  file3.txt  file4.txt\
    \  file5.txt\n```\n\n现在让我们使用 `-r` 参数递归压缩目录中的所有的文本文件。\n```bash\n[root@centos Documents]#\
    \ gzip -9 -r text_files/\n[root@centos Documents]# ls ./text_files/\nfile1.txt.gz\
    \  file2.txt.gz  file3.txt.gz  file4.txt.gz  file5.txt.gz\n```\n\n看到了吗？这并不是某些可能预期的那样。所有的原始文本文件都被删除了，每个文件都被单独压缩了。由于这种行为，在需要处理单个文件时，最好单独考虑\
    \ `gzip`。\n\n处理 tarball 时，让我们把 rsynced 过的 tarball 提取到一个新目录中。\n```bash\n[root@centos\
    \ Documents]# tar -C /tmp -zxvf RemoteStuff.tar.gz\n./RemoteStuff/\n./RemoteStuff/.DS_Store\n\
    ./RemoteStuff/DDWRT/\n./RemoteStuff/DDWRT/.DS_Store\n./RemoteStuff/DDWRT/ddwrt-linuxys-wrt1200acv2-webflash.bin\n\
    ./RemoteStuff/DDWRT/ddwrt_mod_notes.docx\n./RemoteStuff/DDWRT/factory-to-ddwrt.bin\n\
    ./RemoteStuff/open_ldap_config_notes/\n./RemoteStuff/open_ldap_config_notes/ldap_directory_a.png\n\
    ./RemoteStuff/open_ldap_config_notes/open_ldap_notes.txt\n./RemoteStuff/perl_scripts/\n\
    ./RemoteStuff/perl_scripts/mysnmp.pl\n./RemoteStuff/php_scripts/\n./RemoteStuff/php_scripts/chunked.php\n\
    ```\n\n如上所示，我们将 tarball 提取并解压到了 `/tmp` 目录中。\n```bash\n[root@centos Documents]#\
    \ ls /tmp\nperfdata_root RemoteStuff\n```\n\n## 加密 TarBall 归包\n\n加密 tarball 归包以存储可能需要组织其他员工访问的安全文档（以防灾难恢复）可能是一个复杂的概念。基本上有三种方法：使用\
    \ `GnuPG`、使用 `openssl` 亦或使用第三方工具。`GnuPG` 主要为非对称加密设计，它考虑的是身份关联而不是密码。诚然，它可以与对称加密一起，但这不是\
    \ `GnuPG` 的主要优势。因此，当可能比原始人员更多的人需要访问时（例如，可能是一个想要防止管理员持有所有王国钥匙作为筹码的经理经理），我不会建议使用\
    \ `GnuPG` 来存储具有物理安全性的归包。\n\n`openssl` 像 `GnuPG` 一样可以做到我们想要的，并随 CentOS 一带。但同样，它并不是专门为我们想要的设计，而且其加密在安全社区受到质疑。\n\
    \n我们的选择是一个名为 `7zip` 的工具。`7zip` 是像 `gzip` 一样的压缩工具，但具有更多功能。就像 Gnu Gzip 一样，`7zip`\
    \ 及其标准都在开源社区。我们只需要从我们的 EHEL 仓库安装 `7zip`（下一章将详细介绍安装企业仓库）。\n\n### 在 CentOS 上安装 7zip\n\
    \n一旦在 CentOS 中加载并配置了 EHEL 仓库，安装 `7zip` 非常简单。\n```bash\n[root@centos Documents]#\
    \ yum -y install 7zip.x86_64 7zip-plugins.x86_64\nLoaded plugins: fastestmirror\n\
    base                            3.6 kB     00:00:00\nel/x86_64/metalink      \
    \         13 kB     00:00:00\nel                              4.3 kB     00:00:00\n\
    extras                          3.4 kB     00:00:00\n(1/2):el/x86_64/updateinfo\
    \      756 kB     00:00:04\n(2/2):el/x86_64/primary_db       4.6 MB     00:00:18\n\
    Loading mirror speeds from cached host\n--> Running transaction\n---> Package\
    \ 7zip.x86_64:0:16-el will be installed\n---> Package 7zip-plugins.x86_64:0:16-el\
    \ will be installed\n--> Finished\nDependency Resolution\nDependencies Resolved```\n\
    \n很简单，`7zip` 已安装并可以使用 256 位加密处理我们的 tarball。现在让我们使用 `7zip` 用密码加密归包。语法为 `7zip a\
    \ -p <输出文件名><文件名>`，其中 `a` 表示添加到归包，`-p` 表示加密并提示密码。\n```bash\n[root@centos Documents]#\
    \ 7zip a -p RemoteStuff.tgz RemoteStuff.tar.gz\n7zip [64] - 16.02 : Copyright\
    \ (c) 1999-2016 Pavlov\n7zip Version 16.02 (locale=en_US.UTF-8, Utf16=on, Files=on,\
    \ 64 bits, CPU(R) Core(TM) i5-4278U @60GHz (1), AES-NI)\nScanning the drive: 1\
    \ file, 2317140467 bytes (2210 MB)\nCreating archive: RemoteStuff.tgz\nItems to\
    \ compress: 1\nEnter password (will not be echoed):\nVerify password (will not\
    \ be echoed):\nFiles read from disk: 1\nArchive size: 2280453410 bytes (2175 MB)\n\
    Everything is Ok\n[root@centos Documents]# ls\nRemoteStuff  RemoteStuff.tar  RemoteStuff.tar.gz\
    \  RemoteStuff.tgz```\n\n现在我们有了加密 gzipped tarball 的 `.7z` 归包。\n注意 − `7zip` 使用\
    \ AES 256 位加密和 SHA256 哈希，重复 512 次用于密钥派生。如果使用复杂的密钥，这应该是足够安全的。加密和重新压缩归包的过程可能需要一些时间。`7zip`\
    \ 提供了一种比 `gzip` 或 `zip` 功能更多的。然而，它在 CentOS 或 Linux 世界中并不是标准。因此，应该尽可能使用其他工具。\n\n\
    ## Linux 管理 - 系统更新\n\nCentOS 7 系统有三种更新方式：\n- 手动\n- 自动\n- 手动更新重大安全问题\n\n在生产环境中，建议对生产服务器进行手动更新。或者至少建立更新计划，以便管理员确保业务运行至关重要的。简单的安全更新可能会导致需要管理员升级和重新配置的应用程序问题。因此，在开发服务器和桌面进行测试之前，要注意自动更新。\n\
    \n### 手动更新 CentOS 7\n\n要更新 CentOS 7，我们需要熟悉 `yum` 命令。`yum` 用于处理 CentOS 7 中的软件包仓库。`yum`\
    \ 通常用于：\n- 更新 CentOS 7 Linux 系统\n- 搜索软件包\n- 安装软件包\n- 检测并安装软件包所需的依赖\n\n为了使用 `yum`\
    \ 进行更新，您的 CentOS 服务器需要连接互联网。大多数配置将安装基础系统，然后使用 `yum` 查询 CentOS 主仓库中的额外功能包并应用系统更新。我们已经使用过\
    \ `yum` 安装了一些软件包。使用 `yum` 时，您总是需要以 root 用户或具有 root 权限的用户身份执行。让我们搜索并安装一个名为 `nano`\
    \ 的易用编辑器。\n```bash\n[root@centos Documents]# yum search nano\nLoaded plugins:\
    \ fastestmirror\nLoading mirror speeds from cached host\n* base: mirror.rackspace.com\n\
    * el: mirror.pcahut.edu\n* extras: repos.forethought.net\n* updates: repos.forethought.net\n\
    ================================================\nN/S matched: nano\n================================================\n\
    nano.x86_64 : 一个小型文本编辑器\nnode-nano-noarch : Node.js 的最小驱动\nperl-time-Clock.noarch\
    \ : 纳秒精度的二十小时对象\n仅显示名称和摘要，所有内容使用 \"search all\"。\n[root@centos Documents]# yum\
    \ install nano\nLoaded plugins: fastestmirror\nLoading mirror speeds from cached\
    \ host\n* base: mirror.rackspace.com\n* el: mirror.pcahut.edu\n* extras: repos.forethought.net\n\
    * updates: repos.forethought.net\n================================================================\n\
    Package                    Version            Repository      Size\n================================================================\n\
    nano.x86_64             2.3.1-10.el7        base            440 k\n================================================================\n\
    Install 1 Package\nTotal download size: 440 k\nInstalled size: 1.6 M\nIs this\
    \ ok [y/N]: y\nDownloading packages:\nnano-2.3.1-10.el7.x86_64.rpm | 440 kB  \
    \   00:00:00\nRunning transaction check\nRunning transaction\nTransaction test\
    \ succeeded\nInstalling: nano-2.3.1-10.el7.x86_64 1/1\nVerifying: nano-2.3.1-10.el7.x86_64\
    \ 1/1\nInstalled: nano.x86_64 0:2.3.1-10.el7\nComplete!\n[root@centos Documents]#```\n\
    \n我们安装了 `nano` 编辑器。这种方法比搜索工具简单得多。此外，`yum` 使用数字签名来验证软件包是否来自信任源。这就是为什么被认为是最佳实践的更新。`yum`\
    \ 也可以用来删除软件包。\n```bash\n[root@centos Documents]# yum remove nano\nLoaded plugins:\
    \ fastestmirror\nResolving Dependencies\n--> Running transaction check\n---> nano.x86_64\
    \ 0:2.3.1-10.el7 will be erased\n--> Finished\nDependency Resolution\nDependencies\
    \ Resolved```\n\n现在检查更新。\n```bash\n[root@centos Documents]# yum list updates\n\
    Loaded plugins: fastestmirror\nLoading mirror speeds from cached host\n* base:\
    \ mirror.rackspace.com\n* el: mirror.pcahut.edu\n* extras: repos.forethought.net\n\
    * updates: repos.forethought.net\nUpdated Packages\nNetworkManager.x86_64    \
    \        1:1.4.0-17.el7_3  updates\nNetworkManager-adsl.x86_64      1:1.4.0-17.el7_3\
    \  updates\nNetworkManager-glib.x86_64       1:1.4.0-17.el7_3  updates\nNetworkManager-libnm.x86_64\
    \      1:1.4.0-17.el7_3  updates\nNetworkManager-team.x86_64       1:1.4.0-17.el7_3\
    \  updates\nNetworkManager-tu.x86_64         1:1.4.0-17.el7_3  updates\nNetworkManager-wif.x86_64\
    \         1:1.4.0-17.el7_3  updates\naudit.x86_64                     2.6.5-3.el7_3.1\
    \  updates\naudit-bs.x86_64                  2.6.5-3.el7_3.1  updates\naudit-python.x86_64\
    \               2.6.5-3.el7_3.1  updates\nsystemd-sysv.x86_64              2.6.5-3.el7_3.1\
    \  updates\ntsh.x86_64                       6.18.01-13.el7_3.1  updates\ntzdata.noarch\
    \                    2017a1.el7        updates\ntzdata-java.noarch           \
    \    2017a1.el7        updates\nwpa_supplicant.x86_64            1:2.021.el7_3\
    \     updates\n```\n\n检测到我们有几十个更新需要安装。实际上，由于我们还没有配置自动更新，总共有大约 100 个。因此，让我们安装所有更新。\n\
    ```bash\n[root@centos Documents]# yum update\nLoaded plugins: fastestmirror\n\
    Loading mirror speeds from cached host\n* base: mirror.rackspace.com\n* el: mirror.pcahut.edu\n\
    * extras: repos.forethought.net\n* updates: repos.forethought.net\nResolving Dependencies\n\
    --> Running transaction check\n---> NetworkManager.x86_64 1:1.4.0-14.el7_3 will\
    \ be updated\n---> NetworkManager.x86_64 1:1.4.0-17.el7_3 will be updated\n--->\
    \ policy-targeted.noarch         3.13.102.el7_3.15\nTransaction Summary\n===============================================================\n\
    Upgrade                          68 Packages\nTotal size: 196 M\nTotal download\
    \ size: 83 M\nIs this ok [y/d/N]:\n```\n\n按下“y”键后，CentOS 7 的更新将开始。`yum` 更新的通用过程是：\n\
    - 检查当前软件包\n- 在仓库中查找更新的软件包\n- 计算更新包所需的依赖\n- 下载更新\n- 安装更新\n\n现在，让我们确保我们的系统是最新的。\n\
    ```bash\n[root@centos Documents]# yum list updates\nLoaded plugins: fastestmirror\n\
    Loading mirror speeds from cached host\n* updates: mirror.compe.com\n```\n如你所示，没有列出更新。\n\
    \n## 为 YUM 配置自动更新\n\n在企业环境中，如之前所述，自动更新可能是或不是首选安装方法。让我们概述使用 yum 配置自动更新的步骤。首先，我们安装名为\
    \ `yum-cron` 的软件包。\n```bash\n[root@centos]# vi /etc/yum/yum-cron.conf\n# 当可用时是否应该应用更新。\n\
    \ 注意，download_updates 也必须为 yes 才能应用更新。\napply_updates = no\n```\n\n我们想将 `apply_updates\
    \ = no` 更改为 `apply_updates = yes`。\n更新：在企业环境中，如之前所述，自动更新可能是或不是首选安装方法。让我们概述使用 yum\
    \ 配置自动更新的步骤。首先，我们安装名为 `yum-cron` 的软件包。\n```bash\n[root@centos]# vi /etc/yum/yum-cron.conf\n\
    # 当可用时是否应该应用更新。\n 注意，download_updates 也必须为 yes 才能应用更新。\napply_updates = no\n```\n\
    \n我们想将 `apply_updates = no` 更改为 `apply_updates = yes`。\n"
