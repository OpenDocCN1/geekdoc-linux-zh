    Above is the condensed output from our last boot. We could also refer back to
    a boot log from hours, days, weeks, months, and even years. However, by default
    CentOS doesn''t store persistent boot logs. To enable persistently storing boot
    logs, we need to make a few configuration changes:


    - Make central storage points for boot logs

    - Give proper permissions to a new log folder

    - Configure `journald.conf` for persistent logging


    ## Configure Boot Location for Persistent Boot Logs


    The initial place `journald` will want to store persistent boot logs is `/var/log/journal`.
    Since this doesn''t exist by default, let''s create it:


    ```bash

    [root@centos rdc]# mkdir /var/log/journal

    ```


    Now, let''s give the directory proper permissions `journald` daemon access:


    ```bash

    -systemd-tmpfiles --create --prefix /var/log/journal

    ```


    Finally, let''s tell `journald` it should store persistent boot logs. In vim or
    your favorite text editor, open `/etc/systemd/journald.conf`. See `journald.conf(5)`
    for details.


    ```ini

    [Journal]

    Storage=persistent

    ```


    The line we are concerned with is first remove the comment then change to `Storage=persistent`
    as above. Save and reboot your CentOS system and take care there should be multiple
    entries when running `journalctl list-boots`.


    A constantly changing machine like that from a VPS provider can cause `journald`
    to fail at storing persistent boot logs. There are many workarounds for such scenario.
    It is best to peruse the current fixes posted to CentOS Admin than follow the
    advice from those who found plausible VPS workarounds. To examine a specific boot
    log simply need to get each offset using `journalctl list-boots` with the `-b`
    switch. So to check the second boot we''d use `journalctl -b -2`. The default
    for `-b` with no log offset will always be the current boot log after the last
    reboot.


    ## Analyze Logs by Type


    Events from `journald` are numbered and categorized into 7 separate types:


    - `0 - emergency`: System unusable

    - `1 - alert`: Action must be taken immediately

    - `2 - critical`: Action is advised to be taken

    - `3 - err`: Error functionality of application

    - `4 - warning`: Usually means a common issue that can affect security or utility

    - `5 - info`: Information for common operations

    - `6 - debug`: usually disabled by default


