  trans: "\n这些是管理和配置 `firewalld` 的基本概念。在 CentOS 中配置基于主机的防火墙服务在更复杂的网络场景下是一项复杂的任务。在\
    \ CentOS 中对 `firewalld` 和 `iptables` 进行高级用法和配置可能需要一整个教程。然而，我们已经介绍了基础知识，这些应该足够完成大部分日常任务。\n\
    \n# 在 CentOS Linux 中配置 PHP\n\nPHP 是目前使用最广泛的 Web 语言之一。在 CentOS 上安装 LAMP Stack 是每位系统管理员都需要执行的操作，而且很可能很快就会用到。\n\
    \n传统的 LAMP Stack 由 (L)inux (A)pache (M)MySQL (P)HP 组成。CentOS 上的 LAMP Stack 包含三个主要组件：\n\
    * Web 服务器\n* Web 开发平台 / 语言\n* 数据库服务器\n\n注意 – LAMP Stack 术语也可能包含以下技术：PostgreSQL,\
    \ MariaDB, Perl, Python, Ruby, NGINX Web 服务器。\n\n在本教程中，我们将坚持使用 CentOS GNU Linux\
    \ 的传统 LAMP Stack：Apache Web 服务器、MySQL 数据库服务器和 PHP。\n\n我们实际上将使用 MariaDB。MySQL 的配置文件、数据库和表对\
    \ MariaDB 是透明的。MariaDB 现在包含在标准的 CentOS 仓库中，而不是 MySQL。这是由于 Oracle 已接管了 MySQL 的开发，受许可和开源合规性的限制。\n\
    \n我们需要做的第一件事是安装 Apache。\n\n```bash\n[root@CentOS]# yum install httpd\nLoaded plugins:\
    \ fastestmirror, langpacks\nbase| 3.6 kB  00:00:00\nextras| 3.4 kB  00:00:00\n\
    updates| 3.4 kB  00:00:00\nextras/7/x86_64/primary_d| 121 kB  00:00:00\nLoading\
    \ mirror speeds from cached hostfile\n* base: mirror.sigmanet.com\n* extras: linux.mirrors.es.net\n\
    * updates: mirror.eboundhost.com\nResolving Dependencies\n--> Running transaction\
    \ check\n---> Package httpd.x86_64 0:2.4.6-45.el7.centos will be installed\n-->\
    \ Processing Dependency: httpd-tools = 2.4.6-45.el7.centos for package:httpd-2.4.6-45.el7.centos.x86_64\n\
    --> Processing Dependency: /etc/mime.types for package:httpd-2.4.6-45.el7.centos.x86_64\n\
    --> Running transaction check\n---> Package httpd-tools.x86_64 0:2.4.6-45.el7.centos\
    \ will be installed\n---> Package mailcap.noarch 0:2.1.41-2.el7 will be installed\n\
    --> Finished Dependency Resolution\nInstalled:httpd.x86_64 0:2.4.6-45.el7.centos\n\
    Dependency Installed:httpd-tools.x86_64 0:2.4.6-45.el7.centos\nmailcap.noarch\
    \ 0:2.1.41-2.el7\nComplete!\n```\n\n让我们配置 `httpd` 服务。\n\n```bash\n[root@CentOS]#\
    \ systemctl start httpd && systemctl enable httpd\n```\n\n现在，让我们确保 Web 服务器可以通过\
    \ `firewalld` 访问。\n\n```bash\nbash-3.2# nmap -sS -p 1-1024 -T 5 -sV 10.211.55.1\n\
    Starting Nmap 7.30 ( https://nmap.org ) at 2017-01-28 02:00 MST\nNmap scan report\
    \ for centos.shared (10.211.55.1)\nHost is up (0.00054s latency).\nNot shown:\
    \ 1022 filtered ports\nPORT    STATE SERVICE VERSION\n22/tcp open  ssh      OpenSSH\
    \ 6.6.1 (protocol 2.0)\n80/tcp open  http     Apache httpd 2.4.6 ((CentOS))\n\
    Service detection performed. Please report any incorrect results at https://nmap.org/submit/.\n\
    Nmap done: 1 IP address (1 host up) scanned in 10.82 seconds\nbash-3.2#正如你通过 nmap\
    \ 服务看到的，Apache 服务器正在 CentOS 上监听并响应请求。\n```\n\n# 安装 MySQL 服务器\n\n```bash\n[root@CentOS\
    \ rdc]# yum install mariadb-server.x86_64 && yum install mariadb-devel.x86_64\
    \ && mariadb.x86_64 && mariadb-libs.x86_64\n```\n\n我们正在为 MariaDB 安装以下仓库包：\n* `mariadb-server.x86_64`\
    \ 主 MariaDB 守护进程包。\n* `mariadb-devel.x86_64` 用于从源码编译且具有 MySQL 兼容性的文件。\n* `mariadb.x86_64`\
    \ 从命令行管理 MariaDB 的工具。\n* `mariadb-libs.x86_64` 带有 MySQL 支持并编译的应用程序可能需要的常用库。\n\n\
    现在，让我们启动并启用 MariaDB 服务。\n\n```bash\n[root@CentOS]# systemctl start mariadb\n[root@CentOS]#\
    \ systemctl enable mariadb\n```\n\n注意 – 类似于 Apache，我们不会通过基于主机的防火墙（`firewalld`）启用到\
    \ MariaDB 的连接。使用数据库服务器时，最佳实践是仅允许本地连接。让我们确保 MariaDB 正在接受连接。\n\n```bash\n[root@CentOS#]\
    \ netstat -ln\nActive connections (only servers)\nProto    Recv-Q  Send-Q   Local\
    \ Address       Foreign Address       State\ntcp        0               0    \
    \   0.0.0.0:306         0.0.0.0:*               LISTEN\ntcp        0         \
    \      0       0.0.0.0:11         0.0.0.0:*               LISTEN\ntcp        0\
    \               0       192.168.122.1:53    0.0.0.0:*               LISTEN\ntcp\
    \        0               0       0.0.0.0:22         0.0.0.0:*               LISTEN\n\
    tcp        0               0       127.0.0.1:631      0.0.0.0:*              \
    \ LISTEN\ntcp        0               0       127.0.0.1:25      0.0.0.0:*     \
    \          LISTEN\n```\n正如我们所看到的，MariaDB 正在端口 `3306` 上监听。基于主机的防火墙（`firewalld`）将阻止对端口\
    \ `3306` 的连接。\n\n# 安装并配置 PHP\n\n```bash\n[root@CentOS#] yum install php.x86_64\
    \ php-common php-mysql php-pdo php-soap php-xml\n```\n我们建议安装以下 php 包以实现兼容性：\n\
    * `php-common`\n* `php-mysql`\n* `php-mysqlnd`\n* `php-pdo`\n* `php-soap`\n* `php-xml`\n\
    \n```bash\n[root@CentOS]# yum install -y php-common php-mysql php-mysqlnd php-pdo\
    \ php-soap php-xml\n```\n在 CentOS 运行在之前，我们安装了 `php-common php-mysql php-mysqlnd\
    \ php-pdo php-soap php-xml`。\n\n这是我们简单的 php 文件，位于 Apache 根 `/var/www/html/`。\n\
    \n```bash\n[root@CentOS]# cat /var/www/html/index.php\n<html>\n<head>\n    <title>PHP\
    \ 测试页面</title>\n</head>\n<body>\n    PHP 安装\n    <?php\n    echo \"我们现在正在 CentOS\
    \ 上运行 PHP！\";\n    ?>\n</body>\n</html>\n```\n\n让我们将页面的所有权组更改为系统用户我们的 httpd。\n\
    \n```bash\n[root@CentOS]# chgrp httpd /var/www/html/index.php && chmod grx /var/www/html/index.php\n\
    ```\n\n通过 `ncat` 手动请求：\n\n```bash\nbash-3.2# ncat 10.211.55.1 80\n  GET /index.php\n\
    HTTP/1.1 200 OK\n  Date: Sat, 28 Jan 2017 12:06:02 GMT\n  Server: Apache/2.4.6\
    \ (CentOS)\n  X-Powered-By: PHP/5.4.16\n  Transfer-Encoding: chunked\n  Content-Length:\
    \ 137\n  Connection: close\n  Content-Type: text/html; charset=UTF-8\n<html>\n\
    \  <head>\n    <title>PHP 测试页面</title>\n  </head>\n  <body>\n    PHP 安装\n    我们现在正在\
    \ CentOS 运行 PHP！\n  </body>\n</html>\n```\n\n# 在 CentOS 上设置 Python\n\nPython 是一种广泛使用的解释型语言，为\
    \ Linux（和其他操作系统）上的脚本应用带来了专业性。虽然 曾是行业标准，Python 在许多方面超过了它。\n\nPython 相比 Perl 的优势：\n\
    * 快速演进\n* 语言的标准库\n* 代码的可读性\n* 从 GUI 支持到 Web 开发的许多框架\n\nPython 可以做到 Perl 能做的所有事情，在很多情况下方式更好。尽管\
    \ Perl 在 Linux 工具箱中仍有一席之地，学习 Python 是一个明智的选择。\n\nPython 最大的缺点有时与其优势有关。在历史上，Python\
    \ 最初的设计是为了教学编程。有时，它的核心“易读性”和“正确做事”在编写简单代码时会导致不必要的复杂性。此外，它的标准库在从版本 2.X 到 3.X 时产生了问题。\n\
    \nPython 脚本实际上用于 CentOS 核心系统的重要功能。因此，将我们的开发环境与 CentOS 环境隔离来是重要的。首先，目前有两个版本的 Python：2.X\
    \ 和 3.X。两个阶段都处于活跃状态，尽管 2.X 版本很快将被弃用（已持续几年了）。两个活跃版本的理由基本上是为了修复 2.X 的缺陷。这要求 3.X\
    \ 的某些核心功能以 2.X 不支持的方式来实现。基本上，克服这种转换的最佳方法是：为 3.X 开发，并为旧脚本维护最新的 2.X 版本。目前，CentOS\
    \ 7.X 依赖于半当前的 2.X 版本。目前，最新的 Python 版本为：3.4.6 和 2.7.13。\n\n不要让这些困扰你得出结论。设置 Python\
    \ 环境非常简单。有了 Python 框架和库，这项任务实际上很容易完成。在设置我们的 Python 环境之前，我们需要一个健康的环境。首先，确保我们的 CentOS\
    \ 安装完全更新并安装构建工具。\n\n步骤 1 – 更新 CentOS。\n```bash\n[root@CentOS]# yum -y update\n\
    ```\n\n步骤 2 – 安装构建工具。\n```bash\n[root@CentOS]# yum -y groupinstall \"development\
    \ tools\"\n```\n\n步骤 3 – 安装一些需要的包。\n```bash\n[root@CentOS]# yum install -y zlib-dev\
    \ openssl-devel sqlite-devel bzip-devel\n```\n\n现在我们需要从源码安装当前的 Python 2.X 和 3.X。\n\
    * 下载压缩包\n* 提取文件\n* 编译源码\n\n让我们先在 `/usr/src` 中为每个 Python 安装创建一个构建目录。\n\n```bash\n\
    [root@CentOS]# mkdir -p /usr/src/python\n```\n\n现在下载每个的源码 tar 包：\n```bash\n[root@CentOS]#\
    \ wget https://www.python.org/ftp/python/2.7.13/Python-2.7.13.tar.xz\n[root@CentOS]#\
    \ wget https://www.python.org/ftp/python/3.6.0/Python-3.6.0.tar.xz\n```\n\n现在我们需要从归包中提取每个。\n\
    \n步骤 1 – 安装 xz-libs。\n```bash\n[root@CentOS]# xz-libs\n[root@CentOS]# tar -xf\
    \ Python-2.7.13.tar.xz\n[root@CentOS]# tar -xf Python-3.6.0.tar.xz\n```\n步骤 2\
    \ – 从归档中提取每个。\n```bash\n[root@CentOS]# cd Python-2.7.13\n[root@CentOS]# cd ../Python-3.6.0\n\
    ```\n\n步骤 3 – 在每个目录中运行配置。\n```bash\n[root@CentOS]# ./configure --prefix=/usr/local\n\
    [root@CentOS]# make\n[root@CentOS]# make install\n```\n"
