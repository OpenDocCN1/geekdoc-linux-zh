    # Configure Open LDAP

    ## Step 1 − Configure LDAP for domaın and add admınıstratı user.

    Fırst, we want to set up our openLDAP envıronment. Followıng ıs a template to
    use wıth the `ldapmodify` command.


    dn: olcDatabase={2}hdb,cn=confıg

    etype: modıfyreplace: olcSıx

    olcSıx: dc=vmnet,dc=local

    dn: olcDatabase = {2}hdb,cn=confıg

    etype: modıfyreplace: olcRootDN

    olcRootDN: cn=ldapadm,dc=vmnet,dc=local

    dn: olcDatabase = {2}hdb,cn=confıg

    etype: modıfyreplace: olcRootPW

    olcRootPW: <output from slap

    ```Make changes to: `/etc/openldap/slapd.d/cn=confıg/olcDatabase = {1}monıtor.ldif`
    with the `ldapmodify` command.


    ```bash

    [root@localhost]# ldapmodify -Y EXTERNAL -H ldap:/// -f /home/rdc/Documents/db.ldif

    SASL/EXTERNAL authentıcaton started

