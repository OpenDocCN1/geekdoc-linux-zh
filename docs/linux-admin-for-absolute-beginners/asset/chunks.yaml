- fmt: "\n# Sorting Options\n\nSorting options screen is in top, presented using `Shift+F`.\
    \ This screen allows customization of top display and sort options.\n\n## Fields\
    \ Management\n\nFor window 1: `Def`, whose current sort field is `%MEM`.\n\nNavigate\
    \ with `Up`/`Dn`, `Right` selects for move then `<Enter>` or `Left` commits, `'d'`\
    \ or `<Space>` toggles display, `'s'` sets sort. Use `'q'` or `<Esc>` to end!!\n\
    \n| Field | Description |\n| :--- | :--- |\n| `PID` | Process Id |\n| `TGID` |\
    \ Thread Group Id |\n| `USER` | Effective User Name |\n| `ENVIRON` | Environment\
    \ vars |\n| `PR` | Priority |\n| `vMj` | Major Faults delta |\n| `NI` | Nice Value\
    \ |\n| `vMn` | Minor Faults delta |\n| `VIRT` | Virtual Image (KiB) |\n| `USED`\
    \ | Res+Swap Size (KiB) |\n| `RES` | Resident Size (KiB) |\n| `nsIPC` | IPC namespace\
    \ Inode |\n| `SHR` | Shared Memory (KiB) |\n| `nsMNT` | MNT namespace Inode |\n\
    | `S` | Process Status |\n| `nsNET` | NET namespace Inode |\n| `%CPU` | CPU Usage\
    \ |\n| `nsPID` | PID namespace Inode |\n| `%MEM` | Memory Usage (RES) |\n| `TIME+`\
    \ | CPU Time, hundredths |\n| `nsUTS` | UTS namespace Inode |\n| `COMMAND` | Command\
    \ Name/Line |\n| `PPID` | Parent Process pid |\n| `UID` | Effective User Id |\n\
    \n## Process List Example\n\ntop, showing the processes for user `rdc` and sorted\
    \ by memory usage `-PID`.\n\n```text\n-PID USER %MEM PR NI VIRT RES SHR S %CPU\
    \ TIME+ COMMAND\n6130 rdc 6.2 20 0 1349592 117160 33232 S 0.0 1:09.34 gnome-shell\n\
    6449 rdc 3.4 20 0 1375872 64428 21400 S 0.0 0:00.43 evolution-calendar\n6296 rdc\
    \ 1.7 20 0 1081944 32140 22596 S 0.0 0:00.40 evolution-alarm\n6350 rdc 1.6 20\
    \ 0 560728 29844 4256 S 0.0 0:10.16 \n6281 rdc 1.5 20 0 1027176 28808 17680 S\
    \ 0.0 0:0.78 \n6158 rdc 1.5 20 0 1026956 28004 19072 S 0.0 0:0.20 gnome-shell\n\
    ```\n\n## Showing Valid Fields (Condensed)\n\n`PID PPID UID ERR USERS UID GID\
    \ GROUP PGRTY TID`\n\n## The Kill Command\n\nThe `kill` command is used to kill\
    \ a process from the shell via its `PID`. When killing a process, we need to specify\
    \ a signal to send. The signal lets the kernel know how we want to end the process.\
    \ The most used signals are:\n\n- `SIGTERM`: implemented as kernel lets a process\
    \ know it should stop soon as it is safe to do. `SIGTERM` gives the process an\
    \ opportunity to exit and perform safe operations.\n- `SIGHUP`: daemons will restart\
    \ when sent `SIGHUP`. This is often used on processes when changes have been made\
    \ to configuration file.\n- `SIGKILL`: since `SIGTERM` is equivalent to asking\
    \ a process to shut down. The kernel needs an option to end a process that will\
    \ not comply with requests. When a process is hung, the `SIGKILL` option is used\
    \ to shut the process explicitly.\n\nFor a list of all signals that can be sent,\
    \ `kill -l` can be used:\n\n```bash\nroot@CentOS]# kill -l\n1) SIGHUP 2) SIGINT\
    \ 3) SIGQUIT 4) SIGILL 5) SIGTRAP 6) SIGABRT 7) SIGBUS 8) SIGFPE 9) SIGKILL 10)\
    \ SIGUSR1 11) SIGSEGV 12) SIGUSR2 13) SIGPIPE 14) SIGALRM 15) SIGTERM 16) SIGSTKFL\
    \ 17) SIGCHLD 18) SIGCONT 19) SIGSTOP 20) SIGTSTP 21) SIGTTIN 22) SIGTTOU 23)\
    \ SIGURG 24) SIGXCPU 25) SIGXFSZ 26) SIGVTALRM 27) SIGPROF 28) SIGWINCH 29) SIGIO\
    \ 30) SIGPWR 31) SIGSYS 34) SIGRTMIN 35) SIGRTMIN+1 36) SIGRTMIN+2 37) SIGRTMIN+3\
    \ 38) SIGRTMIN+4 39) SIGRTMIN+5 40) SIGRTMIN+6 41) SIGRTMIN+7 42) SIGRTMIN+8 43)\
    \ SIGRTMIN+9 44) SIGRTMIN+10 45) SIGRTMIN+11 46) SIGRTMIN+12 47) SIGRTMIN+13 48)\
    \ SIGRTMIN+14 49) SIGRTMIN+15 50) SIGRTMAX-14 51) SIGRTMAX-13 52) SIGRTMAX-12\
    \ 53) SIGRTMAX-1 54) SIGRTMAX-10 55) SIGRTMAX-9 56) SIGRTMAX-8 57) SIGRTMAX-7\
    \ 58) SIGRTMAX-6 59) SIGRTMAX-5 60) SIGRTMAX-4 61) SIGRTMAX-3 62) SIGRTMAX-2 63)\
    \ SIGRTMAX-1 64) SIGRT\n```\n\n## Common Operations\n\n- Using `SIGHUP` to restart\
    \ system:\n```bash\nroot@CentOS rdc]# pgrep systemd\n4650\nroot@CentOS]# kill\
    \ -UP 4650\n```\n```bash\nroot@CentOS]# pgrep systemd\n4650\nroot@CentOS]# kill\
    \ -H 4650\n```\n\n- Allowing the administrator to send a kill signal by process\
    \ name:\n```bash\nroot@CentOS]# pgrep ping\n1945\nroot@CentOS]# kill -9 1945\n\
    root@CentOS]# pgrep ping\n```\n- Killing all processes (Be careful using `kill`\
    \ as root, as it will kill all processes for all users):\n```bash\nroot@CentOS]#\
    \ kill\n```\n\n## Memory Management\n\n`free` is a simple command often used to\
    \ check the memory of a system. It displays the total amount of used physical\
    \ and swap memory.\n\n```bash\nroot@CentOS]# free\n              total       \
    \ used        free      shared  buff/cacheavailable\nMem:         1879668    \
    \   526284       699796       10304      653588      141412\nSwap:         3145724\
    \           0       3145724\n```\n\n## Nice Command\n\n`nice` allows an administrator\
    \ to set the scheduling priority of a process in terms of CPU usages. The niceness\
    \ is basically how the kernel will schedule CPU slices for a process or job. By\
    \ default, it is assumed the process is given equal access to CPU resources. First,\
    \ let's use `top` to check the niceness of the currently running processes.\n\n\
    ```text\nPID USER PR NI VIRT RES SHR S %CPU %MEM TIME+ COMMAND\n28 root 39 19\
    \ 0 0 0 S 0.0 0.0 0:00.17 khugepaged\n690 root 39 19 16808 1396 1164 S 0.0 0.1\
    \ 0:00.01 alsactl\n9598 rdc 39 19 0 98096 1944 1284 S 0.0 1.2 0:00.7 tracker-extract\n\
    9599 rdc 39 19 0 46876 9608 980 S 0.0 0.5 0:00.4 tracker-mem\n9609 rdc 39 19 0\
    \ 36528 3172 804 S 0.0 0.7 0:00.12 tracker-mem-a\n9611 rdc 39 19 0 49620 8984\
    \ 496 S 0.0 0.5 0:00.02 tracker-mem-u\n27 root 25 5 0 0 0 S 0.0 0.0 0:00.00 rcu_bh\n\
    937 root 21 1 16448 276 106 S 0.0 0.1 0:00.11 rtk-daemon\n1 root 20 0 28096 6712\
    \ 3964 S 0.3 0.4 0:03.57 systemd\n2 root 20 0 0 0 0 S 0.0 0.0 0:00.01 kthread\n\
    3 root 20 0 0 0 0 S 0.0 0.0 0:00.50 ksoftirqd/0\n7 root 20 0 0 0 0 S 0.0 0.0 0:00.00\
    \ migration/0\n8 root 20 0 0 0 0 S 0.0 0.0 0:00.00 rcu_bh9\n```\n"
