    # Install Apache Web Server CentOS 7

    In thıs chapter, we wıll learn a lıttle about the background of how Apache HTTP
    Server came ınto exıstence and then ınstall the most current stable versıon on
    CentOS Lınux 7.


    ## Brief History on Apache WebServer

    Apache ıs a web server that has been around for a long tıme. In fact, almost as
    long as the exıstence of http itself! Apache started out as a rather small project
    at the Natıonal Center for Supercomputıng Applıcatıons also known as NCSA. In
    the mıd-90''s "httpd", as ıt was called, was by far the most popular web-server
    platform on the Internet, havıng about 90% or more of the market share. At thıs
    tıme, ıt was a sımple project. Skılled I.T. staff known as webmaster were responsıble
    for: maıntaınıng web server platforms and web server software as well as both
    front-end and back-end sıte development. At the core of httpd was ıts abılıty
    to use custom modules known as plugıns or extensıons. A webmaster was also skılled
    enough to wrıte patches to core server software. Sometıme ın the late-mı-90''s,
    the senıor developer and project manager for httpd left NCSA to do other thıngs.
    Thıs left the most popular web-daemon ın a state of stagnatıon. Sınce the use
    of httpd was so wıdespread a group of seasoned httpd webmasters called for a summıt
    reqardıng the future of httpd. It was decıded to coordınate and apply the best
    extensıons and patches ınto a current stable release. Then, the current grand-daddy
    of http servers was born and chrıstened Apache HTTP Server.


    ıttle Known Hıstorıcal Fact — Apache was not named after a Natıve Amerıcan Trıbe
    of warrıors. It was ın fact coıned and named wıth a twıst: beıng made from many
    fıxes (or patches) from many talented Computer Scıentsts: a patchy or Apache.


    # Install Current Stable Version on CentOS 7

    Step 1 — Install httpd vı yum

    ```bash

    yum -y install httpd

    ```

    Step 2 — Edıt httpd.conf fıle specıfıc to your httpd needs. With a default Apache
    install, the confıguratıle file for Apache ıs named `httpd.conf` and ıs located
    in `/etc/httpd/`. So, let''s open it. Theırst few lınes of `httpd.conf` opened
    ın — Thıs ıs the maın Apache HTTP server confıguratıle. It contaıns the confıguratıle
    dırectves that gı the server ınstructons. In partıcular, see httpd.apache.org/docs/2.4/mod_dırectves.html
    for a discussion.


    We wıll make the followıng changes to allow our CentOS install to serve http requests
    from port 80.


    # Listening host and port

    Listen: Allows you to bind Apache to specıcı IP addresses/or ports, instead of
    the default. See also the VirtualHost. Change thıs to listen on specıcı IP addresses
    as shown below to prevent Apache from going onto all bound IP addresses.

    ```apache

    Listen 12.34.56.78:80

    ```

    From here we change Apache to listen on a certa port or IP Address. For example,
    if we want to run httpd services on an alternatıve port such as 8080. Or if we
    have our web-server configured with multiple interfaces with separate IP addresses.
    Keeps Apache from attaching to every listening daemon onto every IP. This ıs useful
    to stop specifying only IPv6 or IPv4. Or even binding to all network interfaces
    on a mult-homed host.

    Listen: Allows you to bind Apache to specıcı IP addresses/or ports, instead of
    the default. See also the VirtualHost. Change thıs to listen on specıcı IP addresses
    as shown below.


    # DocumentRoot

    The "document root" ıs the default dırectory where Apache will look for an index
    file to serve for requests upon visiting your server. DocumentRoot: The directory
    of which you will serve your documents. By default, all requests are taken from
    this directory, but symbolic links and aliases may be used to point to other locations.

    ```apache

    DocumentRoot "/var/www/html"

    ```

    Step 3 — Start and Enable the httpd service.

    ```bash

    [root@centos]# systemctl start httpd && systemctl reload httpd

    [root@centos]#

    ```

    Step 4 — Configure firewall to allow access to port 80 requests.

    ```bash

    [root@centos]# firewall-cmd --add-service=http --permanent

    ```

    When configuring CentOS for use with Maria DB, there is no native MySQL package
    in the CentOS 7 yum repository. To account for this, we will need to add a MySQL
    hosted repository.


    ## MariaDB vs MySQL On CentOS Linux

    One thing to note ıs MySQL will require a different set of base dependencies from
    MariaDB. Also using MySQL will break the concept and philosophy of CentOS: production
    packages designed for maximum reliability. So when deciding whether to use MariaDB
    or MySQL one should weigh two options: Will my current DB Schema work with MariaDB?
    What advantage does installing MySQL over MariaDB give me?


    MariaDB components are 100% transparent to MySQL structure, with some added efficiency
    with better licensing. Unless a compelling reason comes along, it is advised to
    configure CentOS to use MariaDB. The biggest reasons for favoring MariaDB on CentOS
    are — — Most people will be using MariaDB. When experiencing issues you will get
    more assistance with MariaDB. — CentOS is designed to run with MariaDB. Hence,
    MariaDB will offer better stability. — MariaDB is officially supported for CentOS.


    # Download and Add the MySQL Repository

    We will want to download and install the MySQL repository from http://repo.mysql.com/mysql-community-release-el7-5.noarch.rpm

    Step 1 — Download the Repository. The repository comes conveniently packaged in
    an rpm package for easy installation. It can be downloaded with wget

    ```bash

    [root@centos]# wget http://repo.mysql.com/mysql-community-release-el75.noarch.rpm

    ```

    Step 2 — Install MySQL From YUM. We can now use the yum package manager to install
    MySQL

    ```bash

    [root@centos]# yum -y install mysql-server

    ```

    Step 3 — Start and Enable the MySQL Daemon.

    ```bash

    [root@centos]# systemctl start mysql

    [root@centos]# systemctl enable mysql

    ```

    Step 4 — Make sure our MySQL service ıs up and running.

    ```bash

    [root@centos]# netstat -ant | grep 336

    ```

    Note — We will not allow firewall rules through. It''s common to have MySQL configured
    to use Unix Sockets. This ensures only the web server of LAMP stack, locally,
    can access the database software.


    # Set Up Postfix MTA and IMAP/POP3

    In order to send email from our CentOS 7 server we will need the setup to configure
    a modern Mail Transfer Agent (MTA). Mail Transfer Agent is the daemon responsible
    for sending outbound mail for users or corporate domains via SMTP. It is worth
    noting, this tutorial only teaches the process of setting up the daemon for local
    use. Do not use this tutorial for MTA configuration of an Internet facing. With
    its combined focus on security and ease of administration, we have chosen Postfix
    as the MTA for this tutorial. The default MTA installed in older versions of CentOS
    is Sendmail. Sendmail is a great MTA. However, of the author''s opinion, Postfix
    hits a sweet spot when addressing the following notes. With the current version
    of CentOS, Postfix has superseded Sendmail as the default. Postfix is widely used
    and well documented. It is actively maintained and developed.


    Step 1 — Install Postfix from YUM Package Manager.

    ```bash

    [root@centos]# yum -y install postfix

    ```

    Step 2 — Configure Postfix config file. The Postfix configuration file is located
    in `/etc/postfix/main.cf`. In a simple Postfix configuration, the following must
    be configured for a specific host: hostname, domain, origin, interfaces, and destination.


    Configure the hostname — The hostname is a fully qualified domain name of the
    Postfix host. In OpenLDAP chapter, we named the CentOS box: `centos` on the domain
    `vmnet.local`. Let’s stick with that for this chapter. The `hostname` parameter
    specifies the internet hostname of this mail system. The default is to use the
    fully qualified domain name from `hostname()`. `$hostname` is used as a default
    value for many other configuration parameters.

    ```apache

    hostname = centos.vmnet.local

    ```

    Configure the domain — As stated above, the domain we will be using in this tutorial
    is `vmnet.local`. The `domain` parameter specifies the local internet domain name.
    The default is to use `$hostname` minus the first component. `$domain` is used
    as a default value for many other configuration parameters.

    ```apache

    domain = vmnet.local

    ```

    Configure the origin — For a single server and domain setup, we just need to uncomment
    the following sections and leave the default Postfix variables.

    # SENDING MAIL

    The `origin` parameter specifies the domain that locally-posted mail appears to
    come from. The default is to append `$hostname`, which is fine for small sites.
    If you run a domain with multiple machines, you should (1) change this to `$domain`
    and (2) set up a domain-wide alias database that aliases each user to `user@that.users.mailhost`.
    For the sake of consistency between sender and recipient addresses, `origin` also
    specifies the default domain name that is appended to recipient addresses that
    have no @domain part.

    ```apache

    origin = $hostname

    origin = $domain

    ```

    Configure the network interfaces — We will leave Postfix listening on our single
    network interface and all protocols and IP Addresses associated with that interface.
    This is done by simply leaving the default settings enabled for Postfix. The `interfaces`
    parameter specifies the network interface that this mail system receives on. By
    default, the software claims all interfaces on the machine. The `proxy` parameter
    controls delivery of mail to [address] that are forwarded via a proxy or network
    translator. Note: you need to stop/start Postfix when this parameter changes.

    ```apache

    interfaces = all

    interfaces = $hostname

    interfaces = localhost

    inet_protocols = all

    ```

    Step 3 — Configure SASL Support for Postfix. Without SASL authentication, Postfix
    will only allow mail from local users. It will give a denied error when the users
    mail away from the local domain. Note — SASL or Simple Authentication Layer is
    a framework designed for authentication supporting እንደሚ among different Application
    protocols. Instead of leaving authentication mechanisms to the application layer,
    SASL developers (and consumers) leverage current authentication for higher level
    protocols that may not have the convenience or more authentication (when speaking
    of access to secured services) built.


    Install the "cyrus-sasl" package

    ```bash

    [root@centos]# yum -y install cyrus-sasl

    ```

    Configure `/etc/postfix/main.cf` for SASL Auts

    ```apache

    smt_sasl_auth = yes

    smt_recipient_restrictions = permit_networks,permit_sasl_authenticated,reject_unauth

    smt_sasl_security_options = no

    smt_sasl_type = dovecot

    smt_sasl_path = private/auth

    ```

    Step 4 — Configure firewall to allow incoming SMTP services.

    ```bash

    [root@centos]# firewall-cmd --permanent --add-service=smtp

    [root@centos]# firewall-cmd --reload

    ```

