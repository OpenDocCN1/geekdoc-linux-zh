    ### 使用 gzip 压缩文件备份


    如前所述，我们可以从 `tar` 中通过 `-j` 或 `-z` 命令行开关使用 `bzip2` 或 `gzip`。我们也可以使用 `gzip` 来压缩单个文件。然而，单独使用
    `bzip` 或 `gzip` 提供的功能没有与 `tar` 结合时那么多。当使用 `gzip` 时，默认操作是删除原始文件，并将其替换为添加了 `.gz`
    扩展名的压缩版本。`gzip` 的常用命令行开关有：


    | 开关 | 操作 |

    | :--- | :--- |

    | `-c` | 将文件放入归档后保留原始文件 |

    | `-l` | 获取压缩归档的统计信息 |

    | `-r` | 递归压缩目录中的文件 |

    | `-1` thru `9` | 指定 1 到 9 之间的压缩级别 |


    '
- fmt: "\n`gzip` more or less works on a file-by-file basis and not on an archive\
    \ basis like some Windows OS zip utilities. The main reason for this is that `tar`\
    \ already provides advanced archiving features. `gzip` is designed to provide\
    \ only a compression mechanism. Hence, when thinking of `gzip`, think of a single\
    \ file. When thinking of multiple files, think of `tar` archives. Let's now explore\
    \ this with our previous `tar` archive.\n\nNote − Seasoned Linux professionals\
    \ will often refer to a tarred archive as a tarball.\n\nLet's make another `tar`\
    \ archive from our rsync backup.\n```bash\n[root@centos Documents]# tar -cvf RemoteStuff.tar\
    \ ./RemoteStuff/\n[root@centos Documents]# ls\nRemoteStuff.tar RemoteStuff/\n\
    ```\n\nFor demonstration purposes, let's `gzip` the newly created tarball, and\
    \ tell `gzip` to keep the old file. By default, without the `-c` option, `gzip`\
    \ will replace the entire tar archive with a `.gz` file.\n```bash\n[root@centos\
    \ Documents]# gzip -c RemoteStuff.tar > RemoteStuff.tar.gz\n[root@centos Documents]#\
    \ ls\nRemoteStuff  RemoteStuff.tar  RemoteStuff.tar.gz\n```\n\nWe now have our\
    \ original directory, our tarred directory and finally our gzipped tarball. Let's\
    \ try to test the `-l` switch with `gzip`.\n```bash\n[root@centos Documents]#\
    \ gzip -l RemoteStuff.tar.gz\n      compressed          uncompressed       ratio\
    \ uncompressed_name\n      2317140467          2326661120         0.4% RemoteStuff.tar\n\
    ```\n\nTo demonstrate how `gzip` differs from Windows Zip Utilities, let's run\
    \ `gzip` on a folder of text files.\n```bash\n[root@centos Documents]# ls text_files/\n\
    file1.txt  file2.txt  file3.txt  file4.txt  file5.txt\n```\n\nNow let's use the\
    \ `-r` option to recursively compress all the text files in the directory.\n```bash\n\
    [root@centos Documents]# gzip -9 -r text_files/\n[root@centos Documents]# ls ./text_files/\n\
    file1.txt.gz  file2.txt.gz  file3.txt.gz  file4.txt.gz  file5.txt.gz\n```\n\n\
    See? Not what some may have anticipated. All the original text files were removed\
    \ and each was compressed individually. Because of this behavior, it is best to\
    \ think of `gzip` alone when needing to work in single files.\n\nWorking with\
    \ tarballs, let's extract our rsynced tarball into a new directory.\n```bash\n\
    [root@centos Documents]# tar -C /tmp -zxvf RemoteStuff.tar.gz\n./RemoteStuff/\n\
    ./RemoteStuff/.DS_Store\n./RemoteStuff/DDWRT/\n./RemoteStuff/DDWRT/.DS_Store\n\
    ./RemoteStuff/DDWRT/ddwrt-linuxys-wrt1200acv2-webflash.bin\n./RemoteStuff/DDWRT/ddwrt_mod_notes.docx\n\
    ./RemoteStuff/DDWRT/factory-to-ddwrt.bin\n./RemoteStuff/open_ldap_config_notes/\n\
    ./RemoteStuff/open_ldap_config_notes/ldap_directory_a.png\n./RemoteStuff/open_ldap_config_notes/open_ldap_notes.txt\n\
    ./RemoteStuff/perl_scripts/\n./RemoteStuff/perl_scripts/mysnmp.pl\n./RemoteStuff/php_scripts/\n\
    ./RemoteStuff/php_scripts/chunked.php\n```\n\nAs seen above, we extracted and\
    \ decompressed our tarball into the `/tmp` directory.\n```bash\n[root@centos Documents]#\
    \ ls /tmp\nperfdata_root RemoteStuff\n```\n\n## Encrypt TarBall Archives\n\nEncrypting\
    \ tarball archives for storing secure documents that may need to be accessed by\
    \ other employees of the organization, in case of disaster recovery, can be a\
    \ tricky concept. There are basically three ways to do this: either use `GnuPG`,\
    \ or use `openssl`, or use a third part utility. `GnuPG` is primarily designed\
    \ for asymmetric encryption and has an identity-association in mind rather than\
    \ a passphrase. True, it can be used with symmetrical encryption, but this is\
    \ not the main strength of `GnuPG`. Thus, I would discount `GnuPG` for storing\
    \ archives with physical security when more people than the original person may\
    \ need access (like maybe a corporate manager who wants to protect against an\
    \ Administrator holding all the keys to the kingdom as leverage).\n\n`openssl`\
    \ like `GnuPG` can do what we want and ships with CentOS. But again, is not specifically\
    \ designed to do what we want and encryption has been questioned in the security\
    \ community.\n\nOur choice is a utility called `7zip`. `7zip` is a compression\
    \ utility like `gzip` but with many more features. Like Gnu Gzip, `7zip` and its\
    \ standards are in the open-source community. We just need to install `7zip` from\
    \ our EHEL Repository (the next chapter will cover installing the Enterprise Repository\
    \ in detail).\n\n### Install 7zip on CentOS\n\n`7zip` is a simple install once\
    \ EHEL repositories have been loaded and configured in CentOS.\n```bash\n[root@centos\
    \ Documents]# yum -y install 7zip.x86_64 7zip-plugins.x86_64\nLoaded plugins:\
    \ fastestmirror\nbase                            3.6 kB     00:00:00\nel/x86_64/metalink\
    \               13 kB     00:00:00\nel                              4.3 kB   \
    \  00:00:00\nextras                          3.4 kB     00:00:00\n(1/2):el/x86_64/updateinfo\
    \      756 kB     00:00:04\n(2/2):el/x86_64/primary_db       4.6 MB     00:00:18\n\
    Loading mirror speeds from cached host\n--> Running transaction\n---> Package\
    \ 7zip.x86_64:0:16.02-el will be installed\n---> Package 7zip-plugins.x86_64:0:16.02-el\
    \ will be installed\n--> Finished\nDependency Resolution\nDependencies Resolved\n\
    ```\n\nSimple as that, `7zip` is installed and ready be used with 256-bit encryption\
    \ for our tarball. Now let's use `7zip` to encrypt our archive with a password.\
    \ The syntax for doing so is pretty simple `-7zip a -p <output filename><input\
    \ filename>` Where `a`: add to archive, and `-p`: encrypt and prompt for passphrase.\n\
    ```bash\n[root@centos Documents]# 7zip a -p RemoteStuff.tgz RemoteStuff.tar.gz\n\
    7zip [64] - 16.02 : Copyright (c) 1999-2016 Pavlov : 2016-05-21\n7zip Version\
    \ 16.02 (locale=en_US.UTF-8, Utf16=on, Files=on, 64 bits, CPU Intel(R) Core(TM)\
    \ i5-4278U @ 2.60GHz (1), AES-NI)\nScanning the drive: 1 file, 2317140467 bytes\
    \ (2210 MB)\nCreating archive: RemoteStuff.tgz\nItems to compress: 1\nEnter password\
    \ (will not be echoed):\nVerify password (will not be echoed):\nFiles read from\
    \ disk: 1\nArchive size: 2280453410 bytes (2175 MB)\nEverything is Ok\n[root@centos\
    \ Documents]# ls\nRemoteStuff  RemoteStuff.tar  RemoteStuff.tar.gz  RemoteStuff.tgz\n\
    ```\n\nNow, we have our `.7z` archive that encrypts the gzipped tarball with 256-bit\
    \ AES.\nNote − `7zip` uses AES 256-bit encryption with an SHA-256 hash of the\
    \ password and counter, repeated up to 512 times for key derivation. This should\
    \ be secure enough if a complex key is used. The process of encrypting and recompressing\
    \ the archive further can take some time with larger archives. `7zip` is an advanced\
    \ offering with more features than `gzip` or zip. However, it is not standard\
    \ with CentOS or amongst the Linux world. Thus, the other utilities should be\
    \ used often as possible.\n\n## Linux Admin - System Updates\n\nThe CentOS 7 system\
    \ can be updated in three ways −\n- Manually\n- Automatically\n- Update manually\
    \ for major security issues and configure automatic updates\n\nIn a production\
    \ environment, it is recommended to update manually for production servers. Or\
    \ at least establish an update plan so the administrator can assure services vital\
    \ to business operations. It is plausible a simple security update can cause recursive\
    \ issues with common application that requires upgrading and reconfiguration by\
    \ an Administrator. So, be weary of scheduling automatic updates in production\
    \ before testing in development servers and desktops first.\n\n### Manually Update\
    \ CentOS 7\n\nTo update CentOS 7, we will want to become familiar with the `yum`\
    \ command. `yum` is used to deal with package repositories in CentOS 7\\. `yum`\
    \ is the tool commonly used to\n- Update the CentOS 7 Linux System\n- Search for\
    \ packages\n- Install packages\n- Detect and install required dependencies for\
    \ packages\n\nIn order to use `yum` for updates, your CentOS server will need\
    \ to be connected to the Internet. Most configurations will install a base system,\
    \ then use `yum` to query the main CentOS repository for additional functionality\
    \ in packages and apply system updates. We have already made use of `yum` to install\
    \ a few packages. When using `yum you will always need to do so as the root user.\
    \ Or a user with root access. So let's search and install an easy to use editor\
    \ called `nano`.\n```bash\n[root@centos Documents]# yum search nano\nLoaded plugins:\
    \ fastestmirror\nLoading mirror speeds from cached host\n* base: mirror.rackspace.com\n\
    * el: mirror.pcahut.edu\n* extras: repos.forethought.net\n* updates: repos.forethought.net\n\
    ================================================\nN/S matched: nano\n================================================\n\
    nano.x86_64 : A small text editor\nnode-nano-noarch : Minimal couch driver for\
    \ Node.js\nperl-time-Clock.noarch : Twenty-four hour object with nanosecond precision\n\
    Name and summary only, use \"search all\" for everything.\n[root@centos Documents]#\
    \ yum install nano\nLoaded plugins: fastestmirror\nLoading mirror speeds from\
    \ cached host\n* base: mirror.rackspace.com\n* el: mirror.pcahut.edu\n* extras:\
    \ repos.forethought.net\n* updates: repos.forethought.net\n================================================================\n\
    Package                    Version            Repository      Size\n================================================================\n\
    nano.x86_64             2.3.1-10.el7        base            440 k\n================================================================\n\
    Install 1 Package\nTotal download size: 440 k\nInstalled size: 1.6 M\nIs this\
    \ ok [y/N]: y\nDownloading packages:\nnano-2.3.1-10.el7.x86_64.rpm | 440 kB  \
    \   00:00:00\nRunning transaction check\nRunning transaction test\nTransaction\
    \ test succeeded\nInstalling: nano-2.3.1-10.el7.x86_64 1/1\nVerifying: nano-2.3.1-10.el7.x86_64\
    \ 1/1\nInstalled: nano.x86_64 0:2.3.1-10.el7\nComplete!\n[root@centos Documents]#\n\
    ```\n\nWe have installed the `nano` editor. This method, IMO, is a lot easier\
    \ than searching for utilities on websites and manually running the installers.\
    \ Also, repositories use digital signatures to validate packages ensuring they\
    \ are coming from a trusted source with `yum`. It is up to the administrator to\
    \ validate authenticity when trusting new repositories. This is why it is considered\
    \ a best practice to be weary of third party repositories. Yum can also be used\
    \ to remove a package.\n```bash\n[root@centos Documents]# yum remove nano\nLoaded\
    \ plugins: fastestmirrormirror\nResolving Dependencies\n--> Running transaction\
    \ check\n---> Package nano.x86_64 0:2.3.1-10.el7 will be erased\n--> Finished\n\
    Dependency Resolution\nDependencies Resolved\n```\n\nNow let's check for updates.\n\
    ```bash\n[root@centos Documents]# yum list updates\nLoaded plugins: fastestmirror\n\
    Loading mirror speeds from cached host\n* base: mirror.rackspace.com\n* el: mirror.pcahut.edu\n\
    * extras: repos.forethought.net\n* updates: repos.forethought.net\nUpdated Packages\n\
    NetworkManager.x86_64            1:1.4.0-17.el7_3  updates\nNetworkManager-adsl.x86_64\
    \      1:1.4.0-17.el7_3  updates\nNetworkManager-glib.x86_64       1:1.4.0-17.el7_3\
    \  updates\nNetworkManager-libnm.x86_64      1:1.4.0-17.el7_3  updates\nNetworkManager-team.x86_64\
    \       1:1.4.0-17.el7_3  updates\nNetworkManager-tu.x86_64         1:1.4.0-17.el7_3\
    \  updates\nNetworkManager-wif.x86_64         1:1.4.0-17.el7_3  updates\naudit.x86_64\
    \                     2.6.5-3.el7_3.1  updates\naudit-bs.x86_64              \
    \    2.6.5-3.el7_3.1  updates\naudit-python.x86_64               2.6.5-3.el7_3.1\
    \  updates\nsystemd-sysv.x86_64              2.6.5-3.el7_3.1  updates\ntsh.x86_64\
    \                       6.18.01-13.el7_3.1  updates\ntzdata.noarch           \
    \         2017a1.el7        updates\ntzdata-java.noarch               2017a1.el7\
    \        updates\nwpa_supplicant.x86_64            1:2.021.el7_3     updates\n\
    ```\n\nDetected, we have a few dozen updates to install. Actually, there are about\
    \ 100 total since we have not yet configured automatic. Thus, let's install all\
    \ updates.\n```bash\n[root@centos Documents]# yum update\nLoaded plugins: fastestmirror\n\
    Loading mirror speeds from cached host\n* base: mirror.rackspace.com\n* el: mirror.pcahut.edu\n\
    * extras: repos.forethought.net\n* updates: repos.forethought.net\nResolving Dependencies\n\
    --> Running transaction check\n---> Package NetworkManager.x86_64 1:1.4.0-14.el7_3\
    \ will be updated\n---> Package NetworkManager.x86_64 1:1.4.0-17.el7_3 will be\
    \ updated\n---> policy-targeted.noarch         3.13.102.el7_3.15\nTransaction\
    \ Summary\n===============================================================\nUpgrade\
    \                          68 Packages\nTotal size: 196 M\nTotal download size:\
    \ 83 M\nIs this ok [y/d/N]:\n```\n\nAfter hitting the \"y\" key, updating of CentOS\
    \ 7 will commence. The general process that yum goes through updating is\n- Checks\
    \ the current packages\n- Looks in the repository for updated packages\n- Calculates\
    \ dependencies needed for updated packages\n- Downloads updates\n- Installs updates\n\
    \nNow, let's make sure our system is up to date.\n```bash\n[root@centos Documents]#\
    \ yum list updates\nLoaded plugins: fastestmirror\nLoading mirror speeds from\
    \ cached host\n* updates: mirror.compe.com\n```\nAs you can see, there are no\
    \ updates listed.\n\n## Configure Automatic Updates for YUM\n\nIn an enterprise\
    \ environment, as mentioned earlier, automatic updates may or not be the preferred\
    \ method of installation. Let's go over the steps for configuring automatic updates\
    \ with yum. First, we install a package called yum-cron.\n```bash\n[root@centos]#\
    \ vi /etc/yum/yum-cron.conf\n# Whether updates should be applied when they are\
    \ available.\n Note that download_updates must also be yes for the update to be\
    \ applied.\napply_updates = no\n```\n\nWe want to change `apply_updates = no`\
    \ to `apply_updates = yes`. Now let's configure the update interval for yum-cron.\
    \ Again, whether to use automatic updates and install updates on demand can be\
    \ a double edged sword and needs to be considered by an administrator for each\
    \ unique situation.\n\n## Linux Admin - Shell Scripting\n\n Introduction to Bash\
    \ Shell\n\nLike flavors of GNU Linux, shells come in many varieties and vary in\
    \ compatibility. The default shell in CentOS is known as the Bash or Bourne Shell.\
    \ The Bash shell is a modern day, modified version of Bourne Shell developed by\
    \ Stephen Bourne. Bash was the direct replacement to the original Thompson Shell\
    \ on the Unix operating system developed at Bell Labs by Ken Thompson and Dennis\
    \ Ritchie (Stephen Bourne was also employed by Bell Labs) Everyone has a favorite\
    \ shell and each has its strengths and difficulties. But for the most part, Bash\
    \ is going to be the default shell across all Linux distributions and most commonly\
    \ available. With experience, everyone will want to explore and use a shell that\
    \ is best for them. However at the same time, everyone will also want to master\
    \ Bash shell. Other Linux shells include: Tcsh, Csh, Ksh, Zsh, and Fish. Developing\
    \ skills to use any Linux shell at an expert level is extremely important to a\
    \ CentOS administrator. As we mentioned previously, unlike Windows, Linux at its\
    \ heart is a line operating system. A shell is simply a user interface that allows\
    \ an administrator (or user) to issue commands to the operating system. If a Linux\
    \ system administrator were an airpilot, using the shell would be similar to taking\
    \ the plane off autopilot and grabbing the manual controls for maneuverable flight.\
    \ A Linux shell, like Bash, is known in Computer Science terms as a Command Line\
    \ Interpreter. Microsoft Windows also has two line interpreters called DOS (not\
    \ to be confused with the original operating system) and PowerShell. Most modern\
    \ shells like Bash provide constructs allowing more complex scripts to automate\
    \ both common and complex tasks. Constructs include\n- Script flow (ifthen and\
    \ else)\n- Logical comparison operations (greater than, less than, equal)\n- Loops\n\
    - Variables\n- Parameters defining (similar to switches with commands)\n\n###\
    \ Using Shell Versus Scripting Language\n\nOften when thinking about performing\
    \ a task administrators ask themselves: Should use a shell script or scripting\
    \ language such as Perl, Ruby or Python? There is no set rule here. There are\
    \ only typical differences between shells versus scripting languages. Shell allows\
    \ the use of Linux commands such as `sed`, `grep`, `tee`, and all other command\
    \ line utilities on the Linux operating system. In fact, pretty any command line\
    \ utility can be scripted in your shell. A great example of using a shell would\
    \ be a quick script to check a list of hosts for resolution.\n\nOur simple Bash\
    \ Script to check names\n```bash\n#!/bin/bash\nfor name in $(cat $1);\ndo\n  host\
    \ $name.$2 | grep \"has address\"\ndone\n```\n\nsmall list to test DNS resolution\
    \ on −\n```bash\n[root@centos ~]# ./dns-check.sh dns-names.txt\ngoogle.com has\
    \ address 172.217.6.46\nwww.google.com has address 172.217.6.36\nmail.google.com\
    \ has address 172.217.6.37\n```\n\nLeveraging simple Linux commands in our shell,\
    \ we were able to make a simple 5-line script to audit DNS names from a list.\
    \ This would have taken some considerable time in Perl, Python, or Ruby even when\
    \ using a nicely implemented library.\n\n### Scripting Language\n\nA scripting\
    \ language will give more control inside the shell. The above Bash script used\
    \ a wrapper around the Linux `host` command. What if we wanted to do more and\
    \ make our own application like host to interact inside the shell? This is where\
    \ we would use a scripting language. Also, with a highly maintained scripting\
    \ language we know our actions will work across different systems for the most\
    \ part. Python 3.5, for example, will work on any other system running Python\
    \ 3.5 with the same libraries installed. Not so, if we want to run our Bash script\
    \ on both Linux and HP-UX. Sometimes the lines between a scripting language and\
    \ a powerful shell can be blurred. It is possible to automate Linux administration\
    \ tasks with Python, Perl or Ruby. Doing so is really quite commonplace. Also,\
    \ affluent script developers have made a simple, but otherwise functional, web-server\
    \ daemon in Bash. With experience in scripting languages and automating tasks\
    \ in shells, a CentOS administrator will be able to quickly determine where to\
    \ start needing to solve a problem. It is quite common to start project with a\
    \ shell script. Then progress to a scripting (or compiled) language as a project\
    \ gets more complex. Also, it is ok to use both a scripting language and shell\
    \ script for different parts of a project. An example could be a Perl script to\
    \ scrape a website. Then, use a shell script to parse and format with `sed`, `awk`,\
    \ and `egrep`. Finally, use a PHP script for inserting formatted data into MySQL\
    \ database using a web GUI.\n\nWith some theory behind shells, let's get started\
    \ with the basic building blocks to automate tasks from a Bash shell in CentOS.\n\
    \n### Input Output and Redirection\n\nProcessing stdout to another command −\n\
    ```bash\n[root@centos ~]$ cat ~/output.txt | wc -l\n6039\n```\nAbove, we have\
    \ passed `cat`'s standardout to `wc` for processing with the pipe character. `wc`\
    \ then processed the output from `cat`, printing the line count of `output.txt`\
    \ to the terminal. Think of the pipe character as a \"pipe\" passing output from\
    \ one command, to be processed by the next command. Following are the key concepts\
    \ to remember when dealing with command redirection −\n"
