    ok [y/d/N]:After hıttıng the "y" key, updatıng of CentOS 7 wıll commence. The
    general process that yum goes through when updatıng ıs −❖           Checks the
    current packages❖           Looks ın the reposıtory for updated packages❖          
    Calculates dependencıes needed for updated packages❖           Downloads updates❖
