    上述是最后一次启动的压缩输出。也可以追溯到小时、天、月甚至年。然而，CentOS 默认不存储启动日志。要启用持久化存储日志，我们需要进行一些更改：


    - 为启动日志创建中心存储点

    - 为新文件夹赋予适当权限

    - 配置 `journald.conf`


    ## 配置启动日志的位置


    `journald` 想要存储持久化日志的初始位置是 `/var/log/journal`。由于默认不存在，让我们创建它：


    ```bash

    [root@centos rdc]# mkdir /var/log/journal

    ```


    现在，给 `journald` 进程赋予正确的权限：


    ```bash

    -systemd-tmpfiles --create /var/log/journal

    ```


    最后，告诉 `journald` 它应该存储持久化日志。在 vim 或你喜欢的文本编辑器中打开 `/etc/systemd/journal.conf`。查看
    `journald.conf` 详情：


    ```ini

    [Journal]

    Storage=persistent

    ```


    我们要关注的行是取消注释并改为 `Storage=persistent`。保存并重启你的 CentOS 系统。不断变化的 VPS 供应商可能会导致 `journald`
    无法存储持久化日志。这种情况下有很多解决方法。最好的方法是直接使用 `journalctl list-boots` 配合 `-b` 参数来获取特定的启动日志。要检查第二次启动，使用
    `journalctl -b -2`。不带偏移量的 `-b` 始终是重启后的启动日志。


    ## 按类型分析日志


    来自 `journald` 的事件被编号并分为 7 种类型：


    - `0 - emergency`: 系统不可用

    - `1 - alert`: 必须采取行动

    - `2 - critical`: 建议采取行动

    - `3 - err`: 应用程序错误

    - `4 - warning`: 通常意味着影响安全或实用的常见问题

    - `5 - info`: 普通操作信息

    - `6 - debug`: 默认禁用


    因此，如果我们想看到所有的警告，可以执行以下命令：


    ```bash

    [root@centos rdc]# journalctl -p 4

    ```


