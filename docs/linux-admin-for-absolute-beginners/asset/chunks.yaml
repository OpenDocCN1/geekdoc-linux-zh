    Install Dovecot IMAP and POP3 Server

    Dovecot is a secure IMAP and POP3 Server designed to handle incoming mail needs
    of a smaller to larger organization. Due to its prolific use with CentOS, we will
    use Dovecot as an example of installing and configuring incoming mail-server for
    CentOS and MTA SASL Provider. As noted previously, we will not configuring MX
    records for DNS or creating secure rules allowing our services to handle mail
    for a domain. Hence, just setting these services up on an Internet facing host
    may leave leverage for security holes without SPF Records.


    Step 1 — Install Dovecot.

    ```bash

    [root@centos]# yum -y install docot

    ```

    Step 2 — Configure docot. The main configuration file for docot is located at:
    `/etc/dovecot.conf`. We will first back up the main configuration file. It is
    a good practice to always backup configuration files before making edits. This
    way id (for example) line breaks get destroyed by a text editor, and years of
    changes are lost. Reverting is easy as copying the current backup into production.

    Enable protocols and daemon service for docot

    ```apache

    # Protocols we want to be serving.

    .protocols = imap imaps pop3 pop3s

    ```

    Now, we need to enable the docot daemon to listen on startup —

