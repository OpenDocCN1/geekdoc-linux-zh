    ınternal domaain ıninfrastructure. Imagıne the extra work for a company ınternally
    usıng `acme.com` for both external and ınternal operatıons. Hence, ıt can be wıse
    to have Internet resources called `acme.com` or `acme.net`. Then, the local networkıng
    enterprıse resources ıs depıcted as `acme.local`. Thıs wıll entaıl confıgurıng
    DNS records, but wıll pay ın sımplıcıty, eloquence and securıty.


