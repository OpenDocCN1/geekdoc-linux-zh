- fmt: "\n# Install Software with YUM\n\nInstall Software with YUM will now install\
    \ a text-based web browser called `Lynx`. Before installation, we must first get\
    \ the package name containing the `Lynx` web browser. We are not even 100% sure\
    \ our default CentOS repository provides a package for the `Lynx` web browser,\
    \ so let's search and see:\n\n```bash\n[root@localhost rdc]# yum search web browser\n\
    Loaded plugins: fastestmirror, langpacks\nLoading mirror speeds from cached hostfile\n\
    * base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n* updates: mirror.clarkson.edu\n\
    ==================================================================\nN/S matched:\
    \ web, browser\n==================================================================\n\
    icedtea-web.x86_64 : Additional Java components for OpenJDK - Java browserplugin\
    \ and Web Start implementation\nlinks.x86_64 : A text-mode Web browser\nfirefox.i686\
    \ : Mozilla Firefox Web browser\nfirefox.x86_64 : Mozilla Firefox Web browser\n\
    lynx.x86_64 : A text-based Web browser\nFull name and summary matches only, use\
    \ \"search all\" for everything.\n[root@localhost rdc]#\n```\n\nWe see, CentOS\
    \ does offer the `Lynx` web browser in the repository. Let's see some more information\
    \ about the package.\n\n```bash\n[root@localhost rdc]# lynx.x86_64\nbash: lynx.x86_64:\
    \ command not found...\n[root@localhost rdc]# yum info lynx.x86_64\nLoaded plugins:\
    \ fastestmirror, langpacks\nLoading mirror speeds from cached hostfile\n* base:\
    \ mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n* updates: mirror.clarkson.edu\n\
    Available Packages\nName            : lynx\nArch            : x86_64\nVersion\
    \         : 2.8.8\nRelease         : 0.3.dev15.el7\nSize            : 1.4 M\n\
    Repo            : base/7/x86_64\nSummary         : A text-based Web browser\n\
    URL             : http://lynx.isc.org/\nLicense         : GPLv2\nDescription :\
    \ Lynx is a text-based Web browser. Lynx does not display any images,\n      \
    \        but it does support frames, tables, and most other HTML tags. One\n \
    \             advantage Lynx has over graphical browsers is speed; Lynx starts\
    \ and\n              exists quickly and swiftly displays web pages.\n[root@localhost\
    \ rdc]#\n```\n\nNice! Version 2.8 is current enough so let's install `Lynx`.\n\
    \n```bash\n[root@localhost rdc]# yum install lynx\nLoaded plugins: fastestmirror,\
    \ langpacks\nLoading mirror speeds from cached hostfile\n* base: mirror.scalabledns.com\n\
    * extras: mirror.scalabledns.com\n* updates: mirror.clarkson.edu\nResolving Dependencies\n\
