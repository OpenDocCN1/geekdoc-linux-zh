  trans: "\n\n# 使用 YUM 安装软件\n\n使用 YUM 安装软件现在将安装一个名为 `Lynx` 的文本网络浏览器。在安装之前，我们必须先获取包含\
    \ `Lynx` 浏览器的包。我们甚至不能 100% 确定默认 CentOS 仓库是否提供了 `Lynx` 浏览器的包，所以让我们搜索一下：\n\n```bash\n\
    [root@localhost rdc]# yum search web browser\nLoaded plugins: fastestmirror, langpacks\n\
    Loading mirror speeds from cached hostfile\n* base: mirror.scalabledns.com\n*\
    \ extras: mirror.scalabledns.com\n* updates: mirror.clarkson.edu\n==================================================================\n\
    N/S matched: web, browser\n==================================================================\n\
    icedtea-web.x86_64 : OpenJDK 的额外 Java 组件 - Java 插件和 Web Start 实现\nlinks.x86_64\
    \ : 一个文本模式 Web 浏览器\nfirefox.i686 : Mozilla Firefox 浏览器\nfirefox.x86_64 : Mozilla\
    \ Firefox 浏览器\nlynx.x86_64 : 一个文本 Web 浏览器\nFull name and summary matches only,\
    \ use \"search all\" for everything.\n[root@localhost rdc]#\n```\n\n我们看到，CentOS\
    \ 仓库中确实提供了 `Lynx` 浏览器。让我们关于该包的更多信息。\n\n```bash\n[root@localhost rdc]# lynx.x86_64\n\
    bash: lynx.x86_64: command not found...\n[root@localhost rdc]# yum info lynx.x86_64\n\
    Loaded plugins: fastestmirror, langpacks\nLoading mirror speeds from cached hostfile\n\
    * base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n* updates: mirror.clarkson.edu\n\
    Available Packages\nName            : lynx\nArch            : x86_64\nVersion\
    \         : 2.8.8\nRelease         : 0.3.dev15.el7\nSize            : 1.4 M\n\
    Repo            : base/7/x86_64\nSummary         : 一个文本 Web 浏览器\nURL         \
    \    : http://lynx.isc.org/\nLicense         : GPLv2\nDescription : Lynx 是一个文本\
    \ Web 浏览器。Lynx 不显示任何图像，\n              但它支持框架、表格和大多数其他 HTML 标签。Lynx \n       \
    \       相比图形化浏览器的优势是速度；Lynx 启动和退出非常快，并能迅速显示网页。\n[root@localhost rdc]#\n```\n\n\
    太棒了！2.8 版本足够新，所以让我们安装 `Lynx`吧。\n\n```bash\n[root@localhost rdc]# yum install lynx\n\
    Loaded plugins: fastestmirror, langpacks\nLoading mirror speeds from cached hostfile\n\
    * base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n* updates: mirror.clarkson.edu\n\
    Resolving Dependencies\n--> Running transaction check\n---> Package lynx.x86_64\
    \ 0:2.8.8-0.3.dev15.el7 will be installed\n--> Finished Dependency Resolution\n\
    Dependencies Resolved\n==============================================================================================================================================================\n\
    Package         Arch    Version                Repository           Size\n==============================================================================================================================================================================\n\
    Installing:      lynx            x86_642.8.80.3.dev15.el7  base              \
    \ 1.4 M\nTransaction Summary\n==============================================================================================================================================================\n\
    Install 1 Package\nTotal download size: 1.4 M\nInstalled size: 5.4 M\nIs this\
    \ ok [y/d/N]: y\nDownloading packages:\nNo Presto metadata available for base\n\
    lynx-2.8.8-0.3.dev15.el7.x86_64.rpm| 1.4 MB  00:00:10\nRunning transaction check\n\
    Running transaction test\nTransaction test succeeded\nRunning transaction\nInstalling\
    \ : lynx-2.8.8-0.3.dev15.el7.x86_64 1/1\nVerifying  : lynx-2.8.8-0.3.dev15.el7.x86_64\
    \ 1/1\nInstalled:   lynx.x86_64 0:2.8.8-0.3.dev15.el7\nComplete!\n[root@localhost\
    \ rdc]#\n```\n\n接下来，让我们确保 `Lynx` 确实安装成功了。\n\n```bash\n[root@localhost rdc]# yum\
    \ list installed | grep -í lynx\nlynx.x86_64            2.8.8-0.3.dev15.el7  @base\n\
    [root@localhost rdc]#\n```\n\n太好了！让我们使用 `Lynx` 看看没有“点赞”和精美图片的网页是什么样子。\n\n```bash\n\
    [root@localhost rdc]# lynx www.tutorialpoint.in!\n```\n![Image00012.jpg)\n\n太好了，现在我们为生产服务器有了一个\
    \ Web 浏览器，不用担心通过网络发起的远程攻击。这对于生产服务器来说是一件好事。\n\n我们几乎完成了，但首先我们需要配置这台服务器供开发人员测试应用程序。因此，让我们确保他们工作所需的所有工具。我们可以逐个安装一切，但\
    \ CentOS 和 YUM 让这一切变得快得多。让我们安装开发组包（Development Group Package）。\n\n```bash\n[root@localhost\
    \ rdc]# yum groups list\nLoaded plugins: fastestmirror, langpacks\nLoading mirror\
    \ speeds from cached hostfile\n* base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n\
    * updates: mirror.clarkson.edu\nAvailable Groups:\n  Compatibility Libraries\n\
    \  Console Tools\n  Development Tools\n  Graphical Administration\n  Internet\
    \ Tools\n  Legacy Unix\n  Security Tools\n  Smart Card\n  System Administration\n\
    \  System Management\n[root@localhost rdc]#\n```\n\n这是 CentOS 提供的较小的组列表。让我们看看“Development\
    \ Tools”组包含什么。\n\n```bash\n[root@localhost rdc]# yum group info \"Development\"\
    \nLoaded plugins: fastestmirror, langpacks\nLoading mirror speeds from cached\
    \ hostfile\n* base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n\
    * updates: mirror.clarkson.edu\nThere is no installed groups\nMaybe run: yum groups\n\
    Group: Development Tools\nDescription: A basic environment\nMandatory Packages:\n\
    ```\n\n第一屏输出如上所示。这个列表非常全面。然而，这个组通常需要随着时间的推移安装。让我们安装整个组。\n\n```bash\n[root@localhost\
    \ rdc]# yum groups install \"Development Tools\"\n```\n\n这是一个较大的安装。完成后，你的服务器将拥有用于\
    \ Perl、Python 和 C++ 的大部分库和编译器。\n\n# CentOS 中的图形化包管理\n\nGnome Desktop 提供了一个名为 Software\
    \ 的图形化包管理工具。它非常易用且直观。Software 包管理工具可以通过导航找到：Applications → System Tools → Software。\n\
    \nSoftware 管理工具被分为若干组，允许管理员选择要安装的包。虽然这个工具非常易用且简单，但 YUM 要强大得多，管理员可能会更多地使用它。下面是\
    \ Software 工具的截图，它并不是为管理员设计的。![Image0013.jpg)\n\n# Linux 管理 - 卷管理\n\n逻辑卷管理（LVM）是\
    \ Linux 用于在不同物理磁盘上管理卷的方法。这不要与 RAID 混淆。然而，它可以被认为类似于 RAID 0 或 JBod 的概念。通过 LVM，可以（例如）拥有三个\
    \ 1TB 的物理磁盘，然后创建一个如 `/dev/sdb` 的约 3TB 的逻辑卷。或者两个 1.5TB 的逻辑卷、5 个 500GB 的卷，或任何组合。单个磁盘甚至可以用于逻辑卷的快照。注意——当配置正确时，逻辑卷实际上会增加磁盘\
    \ I/O。这的工作原理与 RAID 0 将数据跨分布在单独磁盘上类似。\n\n在学习使用 LVM 进行卷管理时，如果我们知道 LVM 中的每个组件是什么，会变得更容易。请学习下表以牢掌握每个组件。如果需要，可以使用\
    \ Google 进行学习。理解逻辑卷的每个部分对于管理它们非常重要。\n\n| 组件 | 说明 | 示例 |\n| :--- | :--- | :---\
    \ |\n| PV | 物理卷 (Physical Volume) | `sda` |\n| PP | 物理分区 (Physical Partition)\
    \ | `sda1`, `sda2` |\n| VG | 卷组 (Volume Group) | 池化的物理资源 |\n| LV | 逻辑卷 (Logical\
    \ Volume) | 操作系统视为存储设施 |\n\n"
- fmt: "\nA physical volume will be seen as `/dev/sda`, `/dev/sdb`; a physical disk\
    \ that is detected by Linux. A physical partition will be a section of the disk\
    \ partitioned by a disk utility such as `fdisk`. Keep in mind, physical partition\
    \ is not recommended in most common LVM setups. Example: `disk /dev/sda` is partitioned\
    \ to include two physical partitions: `/dev/sda1` and `/dev/sda1`.\n\nIf we have\
    \ two physical disks of 1TB each, we can create a volume group of almost 2TB amongst\
    \ the two. From the volume group, we can create three logical volumes each of\
    \ any size not exceeding the total volume group size.\n\nTraditional Linux Disk\
    \ Administration Tools\nBefore being acquainted with the latest and greatest featured\
    \ tools for LVM Management in CentOS 7, we should first explore more traditional\
    \ tools that have been used for Linux disk management. These tools will come handy\
    \ and still have use with today's advanced LVM tools such as the System Storage\
    \ Manager: `lsblk`, `parted`, and `mkfs.xfs`.\n\nNow, assuming we have added another\
    \ disk or two to our system, we need to enumerate disks detected by Linux. I'd\
    \ always advise enumerating disks every time before performing operations considered\
    \ as destructive. `lsblk` is a great tool for getting disk information. Let's\
    \ see what disks CentOS detects.\n\n```bash\n[root@localhost rdc]# lsblk\nNAME\
    \      MAJ:MIN  RM   SIZE    RO   TYPE MOUNTPOINT\nsda       8:0      0     20G\
    \   0   disk\n├─sda1    8:1      0      1G   0   part /boot\n└─sda2    8:2   \
    \   0    19G   0   part\n  ├─cl-root 253:0    0     17G   0   lvm  /\n  └─cl-swap\
    \ 253:1    0      2G   0   lvm  [SWAP]\nsdb       8:16     0      6G   0   disk\n\
    sdc       8:32     0      4G   0   disk\nsr0       11:0     1    1024M   0   rom\n\
    ```\n\nAs you can see, we have three disks on this system: `sda`, `sdb`, and `sdc`.\
    \ Disk `sda` contains our working CentOS installation, so we do not want to toy\
    \ around with `sda`. Both `sdb` and `sdc` were added to the system for this tutorial.\
    \ Let's make these disks usable to CentOS.\n\n### Create a Disk Label\n```bash\n\
    [root@localhost rdc]# parted /dev/sdb mklabel GPT\nWarning: The existing disk\
    \ label on /dev/sdb will be destroyed and all data on this disk will be lost.\
    \ Do you want to continue?Yes/No? Yes\n```\nWe now have one disk labeled. Simply\
    \ run the `parted` command in the same manner on `sdc`.\n\n### Create the Partitions\
    \ on the Disk\nWe will only create single partition on each disk. To create partitions,\
    \ the `parted` command is used.\n\n```bash\n[root@localhost rdc]# parted -a /dev/sdb\
    \ mkpart primary 0% 100% -- requested partition from 0.0B to 642MB (sectors 0..252911).The\
    \ closest location we can manage is 17.4kB to 104kB (sectors 3..2047).Is this\
    \ acceptable to you?Yes/No? NO\n[root@localhost rdc]# parted -a /dev/sdc mkpart\
    \ primary 0% 100%Information -- You may need to update /etc/fstab.\n```\n\n```bash\n\
    [root@localhost rdc]# lsblk\nNAME      MAJ:MIN  RM   SIZE    RO   TYPE MOUNTPOINT\n\
    sda       8:0      0     20G   0   disk\n├─sda1    8:1      0      1G   0   part\
    \ /boot\n└─sda2    8:2      0    19G   0   part\n  ├─cl-root 253:0    0     17G\
    \   0   lvm  /\n  └─cl-swap 253:1    0      2G   0   lvm  [SWAP]\nsdb       8:16\
    \     0      6G   0   disk\n└─sdb1    8:17     0      6G   0   part\nsdc     \
    \  8:32     0      4G   0   disk\n└─sdc1    8:33     0      4G   0   part\nsr0\
    \       11:0     1    1024M   0   rom\n```\nAs you can see from `lsblk` output,\
    \ we now have two partitions, each on `sdb` and `sdc`.\n\n### Make the File System\n\
    Finally, before mounting and using any volume we need to add a file. We will be\
    \ using the XFS file.\n\n```bash\n[root@localhost rdc]# mkfs.xfs -f /dev/sdb1\n\
    meta-data = /dev/sdb1 size = 512 agcount = 4, agsize = 393088 blks sectsz = 512\
    \ attr = 2, proj32bit = 1 inobt = 0, sparse = 0data = size = 4096 blocks = 172352,\
    \ maxpct = 25 dealloc = 0 width = 0 blks naming = version 2 size = 4096 asci =\
    \ 0 ftype = 1 log = internal log size = 4096 blocks = 2560, version = 2 sectsz\
    \ = 512 sunit = 0 blks, lazy-count = 1 realtime = none exsz = 4096 blocks = 0,\
    \ rtextents = 0\n[root@localhost rdc]# mkfs.xfs -f /dev/sdc1\nmeta-data = /dev/sdc1\
    \ size = 512 agcount = 4, agsize = 262016 blks sectsz = 512 attr = 2, proj32bit\
    \ = 1 inobt = 0, sparse = 0data = size = 4096 blocks = 1048064, maxpct = 25 dealloc\
    \ = 0 width = 0 blks naming = version 2 size = 4096 asci = 0 ftype = 1 log = internal\
    \ log size = 4096 blocks = 2560, version = 2 sectsz = 512 sunit = 0 blks, lazy-count\
    \ = 1 realtime = none exsz = 4096 blocks = 0, rtextents = 0\n```\n\nEach is now\
    \ using the XFS file. Let's mount them, check the mount, and copy a file to each.\n\
    \n```bash\n[root@localhost rdc]# lsblk -o NAME,FSTYPE\nsda\n├─sda1 xfs\n└─sda2\
    \ LVM2member\n├─cl-root xfs\n└─cl-swap xfs\nsdb\n└─sdb1 xfs\nsdc\n└─sdc1 xfs\n\
    sr0\n```\n\n```bash\n[root@localhost rdc]# mount -o defaults /dev/sdb1 /mnt/sdb\n\
    [root@localhost rdc]# mount -o defaults /dev/sdc1 /mnt/sdc\n[root@localhost ~]#\
    \ touch /mnt/sdb/myfile /mnt/sdc/myfile\n[root@localhost ~]# ls /mnt/sdb/myfile\
    \ /mnt/sdc/myfile\n```\nWe have two usable disks at this point. However, they\
    \ will only be usable when we mount them manually. To mount each on boot, we must\
    \ edit the fstab file. Also, permissions must be set for groups needing access\
    \ to the new disks.\n\n### Create Volume Groups and Logical Volumes\nOne of the\
    \ greatest addition to CentOS 7 was the inclusion of a utility called System Storage\
    \ Manager or `ssm`. System Storage Manager greatly simplifies the process of managing\
    \ LVM pools and storage volumes Linux. We will go through the process of creating\
    \ a simple volume pool and logical volumes in CentOS. The first step is installing\
    \ the System Storage Manager.\n\n```bash\n[root@localhost rdc]# yum install system-storage-manager\n\
    ```\n\nLet's look at our disks using the `ssm list` command.\n\nAs seen above,\
    \ a total of three disks are installed on the system:\n- `/sda1`: Hosts our CentOS\
    \ installation\n- `/sdb1`: Mounted at `/mnt/sdb`\n- `/sdc1`: Mounted at `/mnt/sdc`\n\
    \nWhat we want to do is make a Volume Group using two disks (`sdb` and `sdc`).\
    \ Then make three 3GB Logical Volumes available to the system. Let's create our\
    \ Volume Group.\n\n```bash\n[root@localhost rdc]# ssm create -p NEW_POOL /dev/sdb1\
    \ /dev/sdc1\n```\nBy default, `ssm` will create a single logical volume extending\
    \ the entire 10GB of the pool. We don't want this, so let's remove this.\n\n```bash\n\
    [root@localhost rdc]# ssm remove /dev/NEW_POOL/lvol001\nDo you really want to\
    \ remove active logical volume NEW_POOL/lvol001? [y/n]: y\nLogical volume \"lvol001\"\
    \ successfully removed\n```\nFinally, let's create the three Logical Volumes.\n\
    \n```bash\n[root@localhost rdc]# ssm create -n disk001 --fs xfs -s 3GB -p NEW_POOL\n\
    [root@localhost rdc]# ssm create -n disk002 --fs xfs -s 3GB -p NEW_POOL\n[root@localhost\
    \ rdc]# ssm create -n disk003 --fs xfs -s 3GB -p NEW_POOL\n```\nNow, let's check\
    \ our new volumes. We now have three separate logical volumes spanned across two\
    \ physical disk partitions. Logical volumes are a powerful feature now built into\
    \ CentOS Linux. We have touched the surface on managing these. Mastering pools\
    \ and logical volumes come with practice and extended learning. For now, you have\
    \ learned the basics of LVM management in CentOS and possess the ability to create\
    \ basic striped Logical Volumes on a single host.\n"
