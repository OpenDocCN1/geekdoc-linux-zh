    # Linux 员 - 安装匿名 FTP


    在深入学习如何在 CentOS 上安装 FTP 之前，我们需要稍微了解一下它的用法和安全性。FTP 是一种在计算机系统之间传输文件非常高效且完善的协议。FTP
    已经使用并改进了几十年。对于在具有延迟的网络上高效传输文件或为了纯速度，FTP 是一个很好的选择，甚至优 SAMBA 或 SMB。


    然而，FTP 确实存在一些安全问题。实际上，是一些严重的安全问题。FTP 使用非常脆弱的明文认证方法。正因如此，加密会话应该依赖 sFTP 或 FTPS，其中使用
    TLS 对登录和传输会话进行端到端加密。


    尽管有上述注意事项，普通的 FTP 在当今的商业环境中仍然有其用处。主要用途是匿名 FTP 文件仓库。这是一种在下载或上传文件不需要认证的情况。匿名 FTP
    的一些示例包括：

    - 大型软件公司仍使用匿名 FTP 仓库，允许互联网用户下载共享软件和补丁。

    - 允许互联网用户上传和下载公共文档。

    - 某些应用程序通过 FTP 向存储库发送加密的归档日志或配置文件。


    因此，作为 CentOS 管理员，能够安装和配置 FTP 仍然是一项必备技能。我们将使用一个名为 `vsFTP`（即 Very Secure FTP Daemon）的
    FTP 守护进程。vsFTP 已经在开发中使用了一段时间。它以安全、易于安装配置以及可靠而闻名。


    ### 步骤 1 − 使用 YUM 包管理器安装 vsFTPd

    ```bash

    [root@centos]# yum -y ınstall vsftpd.x86_64

    ```


    ### 步骤 2 − 使用 systemctl 配置 vsFTP 开机自启动

    ```bash

    [root@centos]# systemctl start vsftpd

    [root@centos]# systemctl enable vsftpd

    Created symlınk from /etc/systemd/system/multı-user.target.wants/vsftpd.servıce
    to /usr/lıb/systemd/system/vsftpd.servıce.

    ```


    ### 步骤 3 − 配置 FireWallD 以允许 FTP 控制和传输会话

    ```bash

    [root@centos]# fırewall-cmd --add-servıce=ftp --permanentsucc

    [root@centos]#确保我们的 FTP 守护进程正在运行。

    [root@centos]# netstat -antup | grep vsftpt

    tcp6      0      0 :::21 :::*      LISTEN      13906/vsftpd

    [root@centos]#

    ```


    ### 步骤 4 − 配置 vsFTPD 用于匿名访问


    #### 创建 FTP 根目录

    ```bash

    [root@centos]# mkdır /ftp

    ```


