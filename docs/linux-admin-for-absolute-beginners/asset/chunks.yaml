  trans: "\n\n# 排序选项\n\n排序选项屏幕位于顶部，通过 `Shift+F` 显示。此屏幕允许自定义顶部显示和排序选项。\n\n## 字段管理\n\
    \n对于窗口 1：`Def`，其当前排序字段为 `%MEM`。\n\n使用 `Up`/`Dn` 导航，使用 `Right` 选择移动，然后按 `<Enter>`\
    \ 或 `Left` 提交，使用 `'d'` 或 `<Space>` 切换显示，使用 `'s'` 设置排序。使用 `'q'` 或 `<Esc>` 退出！！\n\
    \n| 字段 | 描述 |\n| :--- | :--- |\n| `PID` | 进程 ID |\n| `TGID` | 线程组 ID |\n| `USER`\
    \ | 有效用户名 |\n| `ENVIRON` | 环境变量 |\n| `PR` | 优先级 |\n| `vMj` | 大页缺页增量 |\n| `NI`\
    \ | Nice 值 |\n| `vMn` | 小页缺页增量 |\n| `VIRT` | 虚拟内存 (KiB) |\n| `USED` | 驻留+交换大小\
    \ (KiB) |\n| `RES` | 驻留内存 (KiB) |\n| `nsIPC` | IPC 空间 Inode |\n| `SHR` | 共享内存\
    \ (KiB) |\n| `nsMNT` | MNT 空间 Inode |\n| `S` | 进程状态 |\n| `nsNET` | NET 空间 Inode\
    \ |\n| `%CPU` | CPU 使用率 |\n| `nsPID` | PID 空间 Inode |\n| `%MEM` | 内存使用率 (RES)\
    \ |\n| `TIME+` | CPU 时间，百分之百 |\n| `nsUTS` | UTS 空间 Inode |\n| `COMMAND` | 命令名/命令行\
    \ |\n| `PPID` | 父进程 pid |\n| `UID` | 有效用户句 ID |\n\n## 进程列表示例\n\ntop 命令显示了用户 `rdc`\
    \ 的进程，并按内存使用率 `-PID` 排序。\n\n```text\n-PID USER %MEM PR NI VIRT RES SHR S %CPU\
    \ TIME+ COMMAND\n6130 rdc 6.2 20 0 1349592 117160 33232 S 0.0 1:09.34 gnome-shell\n\
    6449 rdc 3.4 20 0 1375872 64428 21400 S 0.0 0:00.43 evolution-calendar\n6296 rdc\
    \ 1.7 20 0 1081944 32140 22596 S 0.0 0:00.40 evolution-alarm\n6350 rdc 1.6 20\
    \ 0 560728 29844 4256 S 0.0 0:10.16 \n6281 rdc 1.5 20 0 1027176 28808 17680 S\
    \ 0.0 0:0.78 \n6158 rdc 1.5 20 0 1026956 28004 19072 S 0.0 0:0.20 gnome-shell\n\
    ```\n\n## 显示有效字段（精简）\n\n`PID PPID UID ERR USERS UID GID GROUP PGRTY TID`\n\n##\
    \ Kill 命令\n\n`kill` 命令用于通过 `PID` 从 shell 杀死进程。在杀死进程时，我们需要指定一个要发送的信号。该信号让内核知道我们如何结束进程。最常用的信号有：\n\
    \n- `SIGTERM`：实现方式为内核让进程知道应该尽快停止，因为这样做是安全的。`SIGTERM` 为进程提供了退出并执行安全操作的机会。\n- `SIGHUP`：守护进程在收到\
    \ `SIGHUP` 时将重启。这通常用于配置文件发生更改时发送给进程。\n- `SIGKILL`：由于 `SIGTERM` 等同于请求进程关闭，内核需要一个选项来结束不听从请求的进程。当进程挂起时，使用\
    \ `SIGKILL` 选项显式关闭进程。\n\n要查看可以发送的所有信号列表，可以使用 `kill -l`：\n\n```bash\nroot@CentOS]#\
    \ kill -l\n1) SIGHUP 2) SIGINT 3) SIGQUIT 4) SIGILL 5) SIGTRAP 6) SIGABRT 7) SIGBUS\
    \ 8) SIGFPE 9) SIGKILL 10) SIGUSR1 11) SIGSEGV 12) SIGUSR2 13) SIGPIPE 14) SIGALRM\
    \ 15) SIGTERM 16) SIGSTKFL 17) SIGCHLD 18) SIGCONT 19) SIGSTOP 20) SIGTSTP 21)\
    \ SIGTTIN 22) SIGTTOU 23) SIGURG 24) SIGXCPU 25) SIGXFSZ 26) SIGVTALRM 27) SIGPROF\
    \ 28) SIGWINCH 29) SIGIO 30) SIGPWR 31) SIGSYS 34) SIGRTMIN 35) SIGRTMIN+1 36)\
    \ SIGRTMIN+2 37) SIGRTMIN+3 38) SIGRTMIN+4 39) SIGRTMIN+5 40) SIGRTMIN+6 41) SIGRTMIN+7\
    \ 42) SIGRTMIN+8 43) SIGRTMIN+9 44) SIGRTMIN+10 45) SIGRTMIN+11 46) SIGRTMIN+12\
    \ 47) SIGRTMIN+13 48) SIGRTMIN+14 49) SIGRTMIN+15 50) SIGRTMIN+16 51) SIGRTMIN+17\
    \ 52) SIGRTMIN+18 53) SIGRTMIN+19 54) SIGRTMIN+20 55) SIGRTMIN+21 56) SIGRTMIN+22\
    \ 57) SIGRTMIN+23 58) SIGRTMIN+24 59) SIGRTMIN+25 60) SIGRTMIN+26 61) SIGRTMIN+27\
    \ 62) SIGRTMIN+28 63) SIGRTMIN+29 64) SIGRT```\n\n## 常用操作\n\n使用 `SIGHUP` 重启：\n\
    ```bash\nroot@CentOS]# kill\n```\n\n- 杀死所有进程：\n```bash\nroot@CentOS]# kill\n```\n\
    \n- 使用 `SIGKILL` 杀死：\n```bash\nroot@CentOS]# kill\n```\n\n- 发送信号以杀死进程：\n```bash\n\
    root@CentOS]# kill \n```\n\n## 内存管理\n\n`free` 是一种用于检查内存的简单命令。它显示物理内存和交换内存的使用情况。\n\
    \n```bash\nroot@CentOS]# free\n              total        used        free   \
    \   shared  buff/cache   available\nMem:                                     \
    \                                   \nSwap:                                  \
    \                                      \n```\n\n## Nice 命令\n\n`nice` 允许根据 nice\
    \ 值设置进程的 CPU 调度优先级。默认情况下，假设进程将获得平等的 CPU 时间片。首先，让我们使用 `top` 查看当前运行进程的 nice 值。\n\
    \n```bash\nroot@CentOS]# top\n```\n\n"
- fmt: "\n| Sr.No. | Zone & Descrıptıon |\n| :--- | --- |\n| 1 | dropLow trust level.\
