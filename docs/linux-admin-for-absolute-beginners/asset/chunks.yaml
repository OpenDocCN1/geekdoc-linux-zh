    As you can see, our LDAP enterıse modıfcatons were successful.

    Next, we want to create an self-signed ssl certificate. This will secure the communication
    between the enterıse server and clıents.


    ## Step 2 − Create a self-signed certificate for OpenLDAP.

    We will use `openssl` to create a self-signed certificate. Go to the next chapter,
    Create LDAP SSL Certificate with `openssl` for instructions to secure communication
    with OpenLDAP. Then when ssl certificates are configured, we will completed our
    OpenLDAP enterıse configuration.


    ## Step 3 − Configure OpenLDAP to use communication with certificate.

    Create a `certs.ldif` file with the following information:

    dn: cn=confıg

    etype: modıfyreplace: olcSertıcateFile

    olcertıcateFile: /etc/openldap/certs/yourGeneratedCert.pem

    dn: cn=confıg

    etype: modıfyreplace: olcSertıcateKeyFile

    olcertıcateFile: /etc/openldap/certs/yourGeneratedKey.pem

    Next, again, use the `ldapmodify` command to merge the changes into the OpenLDAP
    configuration.


    ```bash

    [root@centos rdc]# ldapmodify -Y EXTERNAL -H ldap:/// -f certs.ldif

    SASL/EXTERNAL authentication started

    SASL username: gidNumber = 0+uidNumber = 0,cn=peercred,cn=external,cn=auth

    SASL SSF: 0

    modıfyıng entry "cn=confıg"

    ```


    Finally, let''s test our OpenLDAP configuration.

    ```bash

    [root@centos]# slaptest -uconfig file

    testing succeeded

    ```


    ## Step 4 − Set up slapd database.

    ```bash

    cp /usr/share/openldap-servers/DB_CONFIG.example /var/lib/ldap/DB_CONFIG &&chown
    ldap:ldap /var/lib/ldap/*

    ```


    # Updates the OpenLDAP Schema.

    Add the `cosine` and `nis` schemas.

    ```bash

    ldapadd -Y EXTERNAL -H ldap:/// -f /etc/openldap/schema/cosine.ldif

    ldapadd -Y EXTERNAL -H ldap:/// -f /etc/openldap/schema/nis.ldif

    ldapadd -Y EXTERNAL -H ldap:/// -f /etc/openldap/schema/inetorgperson.ldif own```


    # Finally, create the enterprise schema and add it to the current OpenLDAP configuration.
    Following is for a domain called `vmnet.local` with an LDAP Admin called `ldapadm`.

    dn: dc=vmnet,dc=local

    dc: vmnet

    objectClass: top

    objectClass: domain

    dn: cn=ldapadm ,dc=vmnet,dc=local

    objectClass: organizationalRole

    cn: ldapadm

    description: LDAP Manager

    dn: ou = People,dc=vmnet,dc=local

    objectClass: organizationalUnit

    ou: People

    dn: ou = Group,dc=vmnet,dc=local

    objectClass: organizationalUnit

    ou: Group

    ```

    Finally, import this into the current OpenLDAP schema.

    ```bash

    [root@centos]# ldapadd -x -W -D "cn=ldapadm,dc=vmnet,dc=local" -f ./base.ldif

    Enter LDAP Password:

    adding new entry "dc=vmnet,dc=local"

    adding new entry "cn=ldapadm ,dc=vmnet,dc=local"

    adding new entry "ou=People,dc=vmnet,dc=local"

    adding new entry "ou=Group,dc=vmnet,dc=local"

    ```


    ## Step 5 − Set up an OpenLDAP Enterprise Users.

    Open vim or your favorite text editor and copy the following format. This is setup
    for a user named "entacct" on the "vmnet.local" LDAP domain.

    dn: uid=entacct,ou=People,dc=vmnet,dc=local

    objectClass: top

    objectClass: account

    objectClass: shadow

    cn: entacct

    uid: 9999

    gid: 100

    homeDirectory: /home/entacct

    shell: /bin/bash

    password: {crypt}

    lastChange: 17058

    maxAge: 99999

    Now import the above files, as saved, to the Open LDAP schema.

    ```bash

    [root@centos]# ldapadd -x -W -D "cn=ldapadm,dc=vmnet,dc=local" -f user.ldif

    Enter LDAP Password:

    adding new entry "uid=entacct,ou=People,dc=vmnet,dc=local"

    ```


    # Before the users can access the Enterprise, we need to assign a password as
    follows:

    ```bash

    slappwd -s password123 -W -D "cn=ldapadm,dc=vmnet,dc=local" -x "uid=entacct,ou=People,dc=vmnet,dc=local"

    ```


    # Finally, before logging into the account, let''s check our Open LDAP entry.

