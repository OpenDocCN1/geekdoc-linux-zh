    ```


    ```bash

    rdc@mınt Documents]$ ls -ld RemoteStuff.tgz

    -rw-rw-r--. 1 rdc rdc 2317140451 Mar 12 06:10 RemoteStuff.tgz

    ```


    **注意**：我们没有直接将所有文件添加到归档中，而是归档了整个 `RemoteStuff` 文件夹。这是最简单的方法。仅仅因为在解压时，整个 `RemoteStuff`
    目录及其内部所有文件都会解压到当前工作目录下，路径为 `./currentWorkingDirectory/RemoteStuff/`。


