    | Command | Action |

    | :--- | :--- |

    | `req -X509` | Use X.509 CSR management PKI standard for key management. |

    | `-nodes` | Do not secure our certificate with a passphrase. Apache must be able
    to use the certificate without interruption of a passphrase. |

    | `-days 2555` | Tells the validity of the certificate to 7 years or 2555 days.
    Time period can be adjusted as needed. |

    | `-newkey rsa:2048` | Specified to generate both key and certificate using RSA
    at 2048 bits in length. |

