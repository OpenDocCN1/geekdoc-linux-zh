- fmt: "\n# Let's now install Ruby\n\n```bash\n[rdc@CentOS bin]$ ~/rbenv/bin/rbenv\
    \ install -v 2.2.1\n```\n\nAfter compilation completes:\n\n```bash\n[rdc@CentOS\
    \ ~]$ ./ruby -v\nruby 2.2.1p85 (2015-02-26 revision 49769) [x86_64-linux]\n```\n\
    \nWe now have a working Ruby environment with an updated and working version of\
    \ Ruby `2.X` branch.\n\n## Method 2 : Install Ruby from CentOS Packages\n\nThis\
    \ is the most simple method. However, it can be limited by the version and gems\
    \ packaged from CentOS. For serious development work, it is highly recommended\
    \ to use the `rbenv` method to install Ruby. Install Ruby, needed development\
    \ packages, and some common gems.\n\n```bash\n[root@CentOS rdc]# yum install -y\
    \ ruby.x86_64 ruby-devel.x86_64 ruby-libs.x86_64 ruby-gem-json.x86_64 rubygem-rake.noarch\n\
    ```\n\nUnfortunately, we are left with somewhat outdated version of Ruby.\n\n\
    ```bash\n[root@CentOS rdc]# ruby -v\nruby 2.0.0p648 (2015-12-16) [x86_64-linux]\n\
    ```\n\n# Linux Admin - Set Up Perl for CentOS Linux\n\nPerl has been around for\
    \ a long time. It was originally designed as a reporting language used for parsing\
    \ text files. With increased popularity, Perl has added a module support or `CPAN`,\
    \ sockets, threading, and other features needed in a powerful scripting language.\n\
    \nThe biggest advantage of Perl over `PHP`, `Python`, or `Ruby` is: it gets things\
    \ done with minimal fuss. This philosophy of Perl does not always mean it gets\
    \ things done the right way. However, for administration tasks on Linux, Perl\
    \ is considered as the go-to choice for a scripting language.\n\n### Advantages\
    \ of Perl over Python or Ruby\n- Powerful text processing\n- Perl makes writing\
    \ scripts quick and dirty (usually a Perl script will be several dozen lines shorter\
    \ than an equivalent in `Python` or `Ruby`)\n- Perl can do anything (almost)\n\
    \n### Drawbacks of Perl\n- Syntax can be confusing\n- Coding style in Perl can\
    \ be unique and bog down collaboration\n- Perl is not really Object Oriented\n\
    - Typically, there isn't a lot of thought put into standardization and best-practice\
    \ when Perl is used.\n\nWhen deciding whether to use Perl, `Python` or `PHP`;\
    \ the following questions should be asked:\n- Will this application ever need\
    \ versioning?\n- Will other people ever need to modify the code?\n- Will other\
    \ people need to use this application?\n- Will this application ever be used on\
    \ another machine or CPU architecture?\n\nIf the answers to all the above are\
    \ \"no\", Perl is a good choice and may speed things up in terms of end-results.\n\
    \nWith this mentioned, let's configure our CentOS server to use the most recent\
    \ version of Perl.\n\nBefore installing Perl, we need to understand the support\
    \ for Perl. Officially, Perl is only supported far back as the last two stable\
    \ versions. So, we want to be sure to keep our development environment isolated\
    \ from the CentOS version.\n\nThe reason for isolation is: if someone releases\
    \ a tool in Perl to the CentOS community, more than likely it will be modified\
    \ to work on Perl as shipped with CentOS. However, we also want to have the latest\
    \ version installed for development purposes. Like `Python`, CentOS ships Perl\
    \ focused on the reliability and not cutting edge.\n\nLet's check our current\
    \ version of Perl on CentOS 7.\n\n```bash\n[root@CentOS]# perl -v\nThis is perl\
    \ 5, version 16, subversion 3 (v5.16.3) built for x86_64-linux-thread-multi\n\
    ```\n\nWe are currently running Perl `5.16.3`. The most current version as of\
    \ this writing is: `perl-5.24.0`. We definitely want to upgrade our version, being\
    \ able to use up-to-date Perl modules in our code. Fortunately, there is a great\
    \ tool for maintaining Perl environments and keeping our CentOS version of Perl\
    \ isolated. It is called `perlbrew`.\n\nLet's install Perl Brew.\n\n```bash\n\
    [root@CentOS]# curl -L https://install.perlbrew.pl | bash\n```\n\nNow that we\
    \ have Perl installed, let's make an environment for the latest version of Perl.\
    \ First, we will need the currently installed version of Perl to bootstrap `perlbrew`.\
    \ Thus, let's get some needed Perl modules from the CentOS repository. Note –\
    \ When available we always want to use CentOS modules versus `CPAN` with our CentOS\
    \ installation.\n\n### Step 1 – Install CentOS Perl::Maker\n```bash\n[root@CentOS]#\
    \ yum install -y perl-Utils-Maker.noarch\n```\n\n### Step 2 - Install the latest\
    \ version of perl\n```bash\n[root@CentOS build]# source ~/perl5/perlbrew/etc/bashrc\n\
    [root@CentOS build]# perlbrew install -n -j4 --threads perl-5.24.1\n```\nThe options\
    \ we chose for our install are:\n- `-n`: No tests\n- `-j4`: Execute 4 threads\
    \ in parallel for the installation (we are using a quadcore CPU)\n- `--threads`:\
    \ Enable threading for Perl\n\nAfter our installation has been performed successfully,\
    \ let's switch to our newest environment.\n\n```bash\n[root@CentOS]# ~/perl5/perlbrew/bin/perlbrew\
    \ use perl-5.24.1\n[root@CentOS]# perl -v\nThis is perl 5, version 24, subversion\
    \ 1 (v5.24.1) built for x86_64-linux-thread-multi (with 1 registered, see perl\
    \ -V for detail)\n```\n\nComplete documentation for Perl, including FAQ lists,\
    \ should be found on this system using `man perl` or `perldoc perl`. If you have\
    \ access to the Internet, point your browser at `http://www.perl.org/`, the Perl\
    \ Home Page.\n\nSimple perl script printing version running within the context\
    \ of our perlbrew environment:\n\n```bash\n[root@CentOS]# cat ./ver.pl\n#!/usr/bin/perl\n\
    print $V . \"\\n\";\n[root@CentOS]# perl ./ver.pl\nv5.24.1\n```\n\nOnce perl is\
    \ installed, we can load cpan modules with `perlbrew`'s `cpanm`.\n\n```bash\n\
    [root@CentOS]# perlbrew install-cpanm\n```\n\nNow let's use the `cpanm` installer\
    \ to make the `LWP` module with our current Perl version of `5.24.1` in perlbrew.\n\
    \n### Step 1 – Switch to the context of our current Perl version\n```bash\n[root@CentOS\
    \ ~]# ~/perl5/perlbrew/bin/perlbrew use perl-5.24.1\n```\n\n### Step 2 – Install\
    \ LWP User Agent Perl Module\n```bash\n[root@CentOS]# ~/perl5/perlbrew/bin/cpanm\
    \ - LWP::UserAgent\n```\n\n### Step 3 – Now let's test our Perl environment with\
    \ the new CPAN module\n```bash\n[root@CentOS]# cat ./get_header.pl\n#!/usr/bin/perl\n\
    use LWP;\nmy $browser = LWP::UserAgent->new();\nmy $response = $browser->get(\"\
    http://www.slcc.edu/\");\nunless(!$response->is_success) {\n    print $response->header(\"\
    Server\");\n}\n[root@CentOS ~]# perl ./get_header.pl\nMicrosoft-IIS/8.5\n```\n\
    \nThere you have it! Perl Brew makes isolating perl environments a snap and can\
    \ be considered as a best practice as things get with Perl.\n\n# Install and Configure\
    \ Open LDAP\n\nLDAP known as Lightweight Directory Access Protocol is a protocol\
    \ used for accessing X.500 service containers within an enterprise known from\
    \ a directory. Those who are familiar with Windows Server Administration can think\
    \ of LDAP as being very similar in nature to Active Directory. It is even a widely\
    \ used concept of intertwining Windows workstations into an OpenLDAP CentOS enterprise.\
    \ On the other spectrum, a CentOS Linux workstation can share resources and participate\
    \ with the basic functionality in a Windows Domain.\n\nDeploying LDAP on CentOS\
    \ as a Directory Server Agent, Directory System Agent, or `DSA` (these acronyms\
    \ are all one and the same) is similar to older Novell Netware installations using\
    \ the Directory Tree structure with NDS.\n\n## Brief History of LDAP\n\nLDAP was\
    \ basically created as an efficient way to access X500 directories with enterprise\
    \ resources. Both X500 and LDAP share the same characteristics and are so similar\
    \ that LDAP clients can access X500 directories with some helpers. While LDAP\
    \ also has its own directory server called slapd. The main difference between\
    \ LDAP and DAP is, the lightweight version is designed to operate over TCP. While\
    \ DAP uses the full OSI Model. With the advent of the Internet, TCP/IP and Ethernet\
    \ prominence in networks of today, is rare to come across a Directory Services\
    \ implementation using both DAP and native X500 enterprise directories outside\
    \ specific legacy computing models. The main components used with openldap for\
    \ CentOS Linux are –\n"
