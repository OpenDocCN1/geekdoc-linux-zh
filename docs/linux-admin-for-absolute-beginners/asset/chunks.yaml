    # TLS 概述与配置


    TLS 为当今的互联网用户提供了两个主要功能：第一，它验证通信双方的身份，即**身份验证**；第二，它为缺乏此类原生功能的上层协议（如 ftp、http、电子邮件协议等）在传输层提供端到端加密。


    第一种功能是验证双方的身份，对于安全性而言与端到端加密同等重要。如果消费者与一个未经授权支付的网站建立了加密连接，其财务数据仍然面临风险。这就是每个钓鱼网站都无法具备的：一个由受信任
    CA（证书颁发机构）正确签名的 TLS 证书，用于验证网站运营者确实是其声称的身份。


    要绕过“没有正确签名证书”的方法只有两种：欺骗用户在网络浏览器中允许对自签名证书的信任，或者希望用户不精通技术，不知道受信任证书颁发机构（或简称 CA）的重要性。


    在本教程中，我们将使用所谓的**自签名证书**。这意味着，在访问该网站的每个 Web 浏览器中显式授予此证书信任状态之前，系统将显示一个错误，阻止用户访问该站点。随后，在访问带有自签名证书的站点之前，用户需要执行若干操作。请记住，从安全角度考虑，这是一件好事。


    ## 安装并配置 openssl


    `openssl` 是 TLS 开源实现的标准。`openssl` 用于 Linux、BSD 发行版、OS X 等系统，甚至支持 Windows。`openssl`
    非常重要，因为它为开发者提供了传输层安全，并抽象了身份验证和端到端加密的详细编程。这就是为什么几乎每个使用 TLS 的开源应用程序都使用了 `openssl`。它在每个现代版本的
    Linux 中都是默认安装的。


    默认情况下，CentOS 5 及更高版本应该已经安装了 `openssl`。为了起见，让我们尝试通过 YUM 安装 `openssl`。只需运行 `install`
    即可，因为 `YUM` 足够智能，能够软件包是否已安装。如果我们由于兼容性原因运行旧版本的 CentOS，执行 `yum -y install` 可以确保
    `openssl` 已更新以应对近期的心血出（heart-bleed）漏洞。


    运行安装程序时，发现 `openssl` 实际上有更新。


    ```

    [root@centos]# yum -y install openssl

    ```


