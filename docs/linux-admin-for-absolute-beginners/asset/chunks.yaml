    # Linux Admin - Traffic Monitoring in CentOS


    There are several third party tools that can add enhanced capabilities for CentOS
    traffic monitoring. In this tutorial, we will focus on those that are packaged
    in the main CentOS distribution repositories and the Fedora EPEL repository.


    There will always be situations where an administrator (for one reason or another)
    is left with only tools in the main CentOS repositories. Most utilities discussed
    are designed to be used by an administrator with the shell of physical access.
    When traffic monitoring with an accessible web, using third party utilities such
    as `ntop` or Nagios is the best choice (versus creating such files from scratch).


    ## Traffic Monitoring for LAN / WAN


    Nagios has been around for a long time, therefore it is both tried and tested.
    At one point it was free and open-source, but since advanced into enterprise with
    paid models to support the need of enterprise. Hence, before planning any rollouts
    with Nagios, make sure the open-source versions will meet your needs or plan on
    spending with Enterprise Budget.


    Most open-source Nagios monitoring software can be found at: `https://www.nagios.org`.

    For a summary of Nagios, here is the official Nagios history page: `https://www.nagios.org/about/history/`.


    ## ntop


    Another great tool allowing bandwidth and monitoring via a web is called `ntop`.
    `ntop` is similar to the utility `top`, and can collect data for an entire LAN
    or WAN. Providing a web for administration, configuration, and charting makes
    it easy for the entire IT Departments. Like Nagios, ntop has both open-source
    and paid versions available. For more information about `ntop`, please visit the
    website: `http://www.ntop.org/`.


    # Install Fedora EPEL Repository — Extra Packages for Enterprise Linux


    To access some of the needed tools for monitoring, we will need to configure our
    CentOS system to use the EPEL Repository. The EPEL Repository is not officially
    maintained or supported by CentOS. However, it is maintained by a group of Fedora
    volunteers to address the packages commonly used by Linux professionals not included
    in either CentOS, Fedora Core, or Red Hat Linux Enterprise.


    **Caution** – Remember, the EPEL Repository is not official for CentOS and may
    break compatibility and functionality on production servers with common dependencies.
    With that mind, it is advised to always test on a non-production server running
    the same services as production before deploying on a system critical. With all
    that said, the official EPEL Repository is so common with CentOS that it can be
    easily installed via `YUM`.


    ```bash

    [root@CentOS rdc]# yum -y install epel-release

    Loaded plugins: fastestmirror, langpacks

    Loading mirror speeds from cached hostfile

    * base: repo1.dal.inoscale.net

    * extras: repo1.dal.inoscale.net

    * updates: mirror.hmc.edu

    Resolving Dependencies

    --> Running transaction check

    ---> Package epel-release.noarch 0:7-9 will be installed

    --> Finished Dependency Resolution Dependencies

    ```


    After installing the EPEL Repository, we will want to update it.


    ```bash

    [root@CentOS rdc]# yum repolist

    Loaded plugins: fastestmirror, langpacks

    epel/x86_64/metadata | 11 kB | 0:00:00

    epel | 4.3 kB | 0:00:00

    (1/3): epel/x86_64/group_gz | 170 kB | 0:00:00

    (2/3): epel/x86_64/updateinfo | 753 kB | 0:00:01

    (3/3): epel/x86_64/primary_db

    ```


    At this point, our EPEL repository should be configured and ready to use. Let''s
    start installing `ntop` for interface monitoring. The tools we will focus on this
    tutorial are:

    - `ntop`

    - `iftop`

    - `ift`

    - `vnstat`

    - `hogs`

    - `wireshark`

    - `traceroute`


    **Administration Security Note**: Restricting SSH tunneling is something that
    requires thought on the part of administrator. Assessing why users need tunneling;
    what users need along with practical risk probability and worst-case impact. This
    is an advanced topic stretching outside the realm of intermediate level primer.
    Research on this topic is advised for those who wish to reach the upper echelons
    of CentOS administration.

