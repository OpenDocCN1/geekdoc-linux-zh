    ## Linux Admin - Backup and Recovery


    Before exploring methods particular for CentOS deploying a standard backup plan,
    let''s first discuss typical considerations for a standard backup policy. The
    first thing we want to get accustomed to is the 3-2-1 backup rule.


    ### 3-2-1 Backup Strategy


    Throughout the industry, you''ll often hear the term 3-2-1 backup model. This
    is a very good approach to live by implementing a backup plan. 3-2-1 is defined
    as follows:


    - 3 copies of data; for example, we may have the working copy; a copy onto the
    CentOS server designed for redundancy using `rsync`; and rotated, offsite backups
    are made from data on the backup server.

    - 2 different mediums. We would actually have three different mediums in this
    case: the working copy on an SSD of laptop or workstation, the CentOS server data
    on RAID, and the offsite backups on USB drives.

    - 1 copy of data offsite; we are rotating the USB offsite nightly. Another modern
    approach may be a cloud backup.


    ### System Recovery


    A bare metal restore is simply a plan laid out by a administrator to get vital
    systems online with all data intact. Assuming 100% systems failure and loss of
    all hardware, an administrator must have a plan to achieve uptime with intact
    data. The monolithic kernel used in Linux actually makes bare metal restores using
    images much easier than Windows. Where Windows uses micro-kernel architecture.
    A full data restore and bare metal recovery are usually accomplished through a
    combination of methods including working, configured disk images of operational
    servers, redundant backups of user data by 3-2-1 rule. Even some sensitive files
    may be stored in a secure, fireproof safe with limited access to the trusted personnel.
    A multiphase bare metal restore and data recovery plan using native tools may
    consist of:


    - `dd` to make and restore disk images of configured servers

    - `rsync` to make incremental backups of all data

    - `tar & gzip` to store encrypted backups with passwords and notes from administrators.Commonly,
    this can be put on a USB drive, encrypted and locked in a safe that Senior Manager
    access. Also, this ensures someone else will know security credentials if the
    current administrator disappears to a sunny island somewhere. If a system crashes
    due to hardware failure or disaster, following will be the different phases of
    restoring


    - Build a working server with a configured bare metal image

    - Restore data to the working server from backups

    - Have physical access to credentials needed to perform the first two operations


    ## Use rsync for File Backups


    `rsync` is a great utility for syncing directories of files either locally or
    to another server. `rsync` has been used for years by System Administrators, hence
    it is very refined for the purpose of backing up data. In the author''s opinion,
    one of the best features of sync is its ability to be scripted from the command
    line. In this tutorial, we will discuss `rsync` in various ways:


    - Explore and talk about some options

    - Create local backups

    - Create remote backups over SSH

    - Restore local backups


    `rsync` is named for its purpose: Remote Sync and is both powerful and flexible
    in use. Following is a basic `rsync` remote backup over ssh:


