    ## Introduction

    Linux was designed based on the Unix philosophy of “small, precise tools chained
    together simplifying larger tasks”. Linux, at its root, does not have large single-purpose
    applications for one specific use a lot of the time. Instead, there are hundreds
    of basic utilities that when combined offer great power to accomplish big tasks
    with efficiency. Unique amongst business class Linux distributions, CentOS stays
    true to the open source that Linux was founded on. This book gives a complete
    understanding on Linux Admin and explains how to use it for benefit.


    ## Audience

    This book has been prepared for beginners to help them understand the fundamentals
