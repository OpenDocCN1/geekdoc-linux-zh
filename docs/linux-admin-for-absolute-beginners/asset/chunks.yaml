    # Add Quota Limits Per User


    For this, we will use the `edquota` command, followed by the username.


    ```bash

    [root@localhost rdc]# edquota centos

    ```


    Disk quotas for user centos (uid 1000):

    Filesystem             blocks      soft      hard      inodes      soft      hard

    /dev/mapper/cl-root          12           0          0         13         0      0

    /dev/mapper/cl-home         4084           0          0        140         0      0

    ```


    Let''s look at each column.

    *   **Filesystem**: It is the filesystem quotas for the user applied.

    *   **blocks**: How many blocks the user is currently using on each filesystem.
    own*   **soft**: Set blocks for a soft limit. Soft limit allows the user to carry
    quota for a given time period.

    *   **hard**: Set blocks for a hard limit. Hard limit is total allowable quota.
    own*   **inodes**: How many inodes the user is currently using.

    *   **soft**: Soft inode limit.

    *   **hard**: Hard inode limit.


    To check our current quota as a user:


    ```bash

    [centos@localhost ~]$ quota own```


    Disk quotas for user centos (uid 1000):

    Filesystem             blocks      quota      limit grace  files    quota      limit
    grace

    /dev/mapper/cl-home     6052604    56123456  61234568      475       0      0

    ```


    Following is an error given to a user when the hard quota limit has exceeded.


    ```bash

    [centos@localhost Downloads]$ cp CentOS-7-x86_64-LiveKDE-1611.isod.part ../Desktop/

    cp: cannot create regular file ''../Desktop/CentOS-7-x86_64-LiveKDE-1611.isod.part'':
    Disk quota exceeded

    ```


    As we can see, we are closely within this user''s disk quota. Let''s set a soft
    limit warning. This way, the user will have advance notice before quota limits
    expire. From experience, you will get end-user complaints when they come into
    work and need to spend 45 minutes clearing files to actually get to work.


    As an Administrator, we can check quota usage with the `repquota` command.


    ```bash

    [root@localhost Downloads]# repquota /home

    ```


    Block limits                   File limits

    User                used      soft      hard      grace

    used      soft      hard      grace

    ----------------------------------------------------------------------

    root                 0          0          0

    centos             +618924   56123456 61234568      541         0

    ```


    As we can see, the user centos has exceeded their hard block quota and can no
    longer use more disk space on `/home`. `-+` denotes a hard quota has been exceeded
    on the filesystem. When planning quotas, it is necessary to do little math. What
    Administrator needs to know:

    *   How many users are on the system?

    *   How much free space to allocate amongst users/groups?

    *   How many bytes make up a block on the file?


    Define quotas in terms of blocks as related to free disk space. It is recommended
    to leave a "safe" buffer of free-space on the file that will remain in worst case
    scenario: all quotas are simultaneously exceeded.


    # Systemd Services Start and Stop


    systemd is the new way of running services on Linux. systemd has superseded sysvinit.
    systemd brings faster boot-times to Linux and is now a standard way to manage
    Linux services. While stable, systemd is still evolving. systemd as an init system,
    is used to manage both services and daemons that need status changes after the
    Linux kernel has booted. By status change starting, stopping, reloading, and adjusting
    service state is applied.


    First, let''s check the version of systemd currently running on our server.


    ```bash

    [centos@localhost ~]$ systemctl --version

    ```

    systemd 219+PAM +AUDIT +SELINUX +IMA -APARMOR +SMACK +SYSVINIT +UTMP +LIBCRYPTSETUPGCRYPT
    +GNUTLS +ACL +XZ -LZ4 -SECCOMP +BLKID +ELFUTILS +KMOD +IDN


    As of CentOS version 7, fully updated at the time of this writing systemd version
    219 is the current stable version. We can also analyze the last server boot time
    with `systemd-analyze`.


    ```bash

    [centos@localhost ~]$ systemd-analyze

    ```

    Startup finished in 1.580s (kernel) + 908ms (initrd) + 53.225s (userspace) = 55.713s


    When the system boot times are slower, we can use the `systemd-analyze blame`
    command.


    ```bash

    [centos@localhost ~]$ systemd-analyze blame

    ```

    40.882s kdump.service

    5.775s NetworkManager-wait-online.service

    4.701s plymouth-quit-wait.service

    3.586s postfix.service

    3.121s systemd-udev-settle.service

    2.649s tuned.service

    1.848s libvirtd.service

    1.437s network.service

    875ms packagekit.service

    855ms gdm.service

    514ms firewalld.service

    438ms rsyslog.service

    436ms udis2.service

    398ms sshd.service

    360ms boot.mount

    ```


    When working with systemd, it is important to understand the concept of units.
    Units are the resources systemd knows to interpret. Units are categorized into
    12 types as follows:

    *   `.service`

    *   `.socket`

    *   `.device`

    *   `.mount`

    *   `.automount`

    *   `.swap`

    *   `.target`

    *   `.path`

    *   `.timer`

    *   `.snapshot`

    *   `.slice`

    *   `.scope`


    For the most part, we will be working with `.service` as unit targets. It is recommended
    to do further research on the other types. As only `.service` units will apply
    to starting and stopping systemd services. Each unit is defined in a file located
    in either:

    *   `/lib/systemd/system` — base unit files

    *   `/etc/systemd/system` — modified unit files started at run-time


    | Switch | Action |

    | :--- | :--- |

    | `-t` | Comma separated value of unit types such as service or socket |

    | `-a` | Shows all loaded units |

    | `--state` | Shows all units in a defined state, either: load, sub, active, inactive,
    etc. |

    | `-H` | Executes operation remotely. Specify Host name or host and user separated
    by @. |

