    ## Linux Admin - CentOS Overview

    Unique among business class Linux distributions, CentOS stays true to the open
    source nature that Linux was founded on.

    - Open source

    - Good hardware support

    - Rock-solid stability and reliability

    - Focus on security and updates

    - Strict adherence to software packaging needed in a corporate environment


    Before starting the lessons, we assume that the readers have a basic knowledge
    of Linux and Administration such as:

    - What is the root user?

    - The power of the root user

    - Basic concept of security groups and users

    - Experience using a Linux terminal

    - Fundamental concepts

    - Understanding of interpreted languages (Perl, Python, Ruby)

    - Network protocols such as HTTP, LDAP, IMAP, SMTP

    - Cores that compose a operating system: file system, drivers, and the kernel


    ## Basic Linux Commands

    Before learning the tools of a CentOS Administrator, it is important to note the
    philosophy behind Linux administration. Linux was designed based on the Unix philosophy
    of “small, precise tools chained together simplifying larger tasks”. Linux, at
    its root, does not have large single-purpose applications for one specific use
    a lot of the time. Instead, there are hundreds of basic utilities that when combined
    offer great power to accomplish big tasks with efficiency.


    ### Examples of the Linux Philosophy

    For example, if an administrator wants a list of all current users on a system,
    the following chained commands can be used to get a list of all system users.
    On execution of the command, the users on the system are listed in an alphabetical
    order.


    ```

    [root@centos Local CentOS]# cut /etc/passwd -d":" -f1 | sort

    ```


    It is easy to export this list into a text file using the following command.

    ```

    [root@localhost /]# cut /etc/passwd -d ":" -f1 > system_users.txt

    [root@localhost /]# cat ./system_users.txt | sort | wc -l

    ```


    It is also possible to compare the user list with an export at a later date.

    ```

    [root@centos Local CentOS]# cut /etc/passwd -d ":" -f1 > system_users002.txt &&
    cat system_users002.txt | sort | wc -l

    [root@centos Local CentOS]# diff ./system_users.txt ./system_users002.txt

    ```


    With this approach of small tools chained to accomplish bigger tasks, it is simpler
    to make a script performing these commands, than automatically email results at
    regular time intervals. Commands every Linux Administrator should be proficient
    in:

    - `vim`

    - `grep`

    - `more` and `less`

    - `tail`

    - `head`

    - `wc`

    - `sort`

    - `unique`

    - `tee`

    - `cat`

    - `cut`

    - `sed`

    - `tr`


    ## Linux Admin - File / Folder Management

    To introduce permissions as they apply to both directories and files in CentOS,
    let''s look at the following command.

    ```

    [centos@localhost etc]$ ls -ld /etc/yum*

    ```

    The three primary object types you will see:

    - `-` a plain file

    - `d` for a directory

    - `l` for a symbolic link


    ```

    [root@centos Local CentOS]# cut /etc/passwd -d":" -f1 | sort

    ```

    This shows how many words begin with the letter a from the main user dictionary.


    ### Applying Permissions to Directories and Files

    `chmod`: Change File Mode Permission Bits

    `chown`: Change File Owner and Group

    `chgrp`: Change Group Ownership of File or Directory

