- fmt: "\n# TLS Overview and Configuration\n\nTLS performs two main functions important\
    \ to the users of the Internet today: One, it verifies who a party is, known as\
    \ authentication. Two, it offers end-to-end encryption at the transport layer\
    \ for upper level protocols that lack this native feature (ftp, http, email protocols,\
    \ and more).\n\nThe first, verifies who a party is and is important to security\
    \ as end-to-end encryption. If a consumer has an encrypted connection to a website\
    \ that is not authorized to take payment, financial data is still at risk. This\
    \ is what every phishing site will fail to have: a properly signed TLS certificate\
    \ verifying website operators are who they claim to be from a trusted CA.\n\n\
    There are only two methods to get around not having a properly signed certificate:\
    \ trick the user into allowing trust of a web-browser for a self-signed certificate\
    \ or hope the user is not tech savvy and will not know the importance of a trusted\
    \ Certificate Authority (or a CA).\n\nIn this tutorial, we will be using what\
    \ is known as a self-signed certificate. This means, without explicitly giving\
    \ this certificate the status of trusted in every web browser visiting the web-site,\
    \ an error will be displayed discouraging the users from visiting the site. Then,\
    \ it will make the user jump though a few actions before accessing a site with\
    \ a self-signed certificate. Remember for the sake of security this is a good\
    \ thing.\n\n## Install and Configure openssl\n\n`openssl` is the standard for\
    \ open-source implementations of TLS. `openssl` is used on systems such as Linux,\
    \ BSD distributions, OS X, and even supports Windows. `openssl` is important,\
    \ as it provides transport layer security and abstracts the detailed programming\
    \ of Authentication and end-to-end encryption for a developer. This is why `openssl`\
    \ is used with almost every single open-source application using TLS. It is also\
    \ installed by default on every modern version of Linux.\n\nBy default, `openssl`\
    \ should be installed on CentOS from at least version 5 onwards. Just to assure,\
    \ let's try installing `openssl` via YUM. Just run `install`, as `YUM` is intelligent\
    \ enough to let us know if a package is already installed. If we are running an\
    \ older version of CentOS for compatibility reasons, doing a `yum -y install`\
    \ will ensure `openssl` is updated against the semi-recent heart-bleed vulnerability.\n\
    \nWhen running the installer, it was found there was actually an update to `openssl`.\n\
    \n```\n[root@centos]# yum -y install openssl\n```\n\n```\nResolving Dependencies\n\
    --> Running transaction check\n---> Package openssl.x86_64 1:1.0.1e-60.el7 will\
    \ be updated\n---> Package openssl.x86_64 1:1.0.1e-60.el7_3.1 will be an update\n\
    --> Processing Dependency: openssl-libs(x86-64) = 1:1.0.1e-60.el7_3.1 for package:\
