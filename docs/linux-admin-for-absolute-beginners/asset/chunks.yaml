- fmt: '

    We introduced this in chapter one without really talking much about redirection
    or assigning redirection. When opening a terminal in Linux, your shell is seen
    as the default target for:

    - standard input `<0`

    - standard output `>1`

    - standard error `2`


    Let''s see how this works:

    `-[rdc@centos ~]$ lsof -ap $BASHPID -d 0,1,2

    COMMAND  PID    USER    FD   TYPE DEVICE  SIZE/OFF  NODE      NAME

    bash    13684   rdc     0u   CHR  136,0      0t0       3       /dev/pts/0

    bash    13684   rdc     1u   CHR  136,0      0t0       3       /dev/pts/0

    bash    13684   rdc     2u   CHR  136,0      0t0       3       /dev/pts/0`


    `/dev/pts/0` is our pseudo terminal. CentOS Linux looks at this and thinks of
    our open terminal application like a real terminal with the keyboard and display
    plugged in through a serial interface. However, like a hypervisor abstracts hardware
    to an operating system, `/dev/pts` abstracts our terminal to applications.


    From the above `lsof` command, we can see under the `FD` column that all three
    file-descriptors are set to our virtual terminal `(0,1,2)`. We can now send commands,
    see command output, as well as any errors associated with the command.


    Following are examples for STDIN and STDOUT


    ### STDOUT

    ```bash

    [root@centosLocal centos]# echo "I am coming from Standard output or STDOUT."
    >output.txt && cat output.txt

    I am coming from Standard output or STDOUT.

    [root@centosLocal centos]#

    ```

    It is also possible to send both stdout and stderr to separate files:

    ```bash

    bash-3.2# find / -name passwd 1> good.txt 2> err.txt

    bash-3.2# cat good.txt

    /etc/pam.d/passwd

    /etc/passwd

    bash-3.2# cat err.txt

    find: /dev/fd/3: Not a directory

    find: /dev/fd/4: Not a directory

    bash-3.2#

    ```

    When searching the entire file system, two errors were encountered. Each were
    sent to a separate file for later perusal, while the results returned were placed
    into a separate text file.


    Sending `stderr` to a text file can be useful when doing things that output a
    lot of data to the terminal like compiling applications. This will allow for perusal
    of errors that could get lost from terminal scrollback history. One note when
    passing STDOUT to a text file are the differences between `>>` and `>`. The double
    `>>` will append to a file, while the singular form will clobber the file and
    write new contents (so all previous data will be lost).


    ### STDIN

    ```bash

    [root@centosLocal centos]# cat < stdin.txt

    Hello,I am being read form Standard input, STDIN.

    [root@centosLocal centos]#

    ```

    In the above command, the text file `stdin.txt` was redirected to the `cat` command
    which echoed its content to `STDOUT`.


    ### The pipe character `|`

    The pipe character `|` will take the output from the first command, passing it
    as an input into the next command, allowing the secondary command to perform operations
    on the output.


    Now, let''s "pipe" the stdout of `cat` to another command:

    ```bash

    [root@centosLocal centos]# cat output.txt | wc -l

    [root@centosLocal centos]#

    ```

    Above, `wc` performs calculations on output from `cat` which was passed from the
    pipe. The `|` command is particularly useful when filtering the output from `grep`
    or `egrep`:

    ```bash

    [root@centosLocal centos]# egrep "^0-9]{4}$" /usr/share/nums | wc -l

    [root@centosLocal centos]#

    ```

    In the above command, we passed every 4 digit number to `wc` from a text file
    containing all numbers from 6535 passed through an `egrep`. (Note: text says `/usr/cts/nums`,
    which is likely a typo for `/usr/share/nums`).


    ### Redirecting Output with `&`

    Output can be redirected using the `&` character. If we want to redirect the output
    both `STDOUT` and `STDERR` into the same file, it can be accomplished as follows:

    ```bash

    [root@centosLocal centos]# find -name passwd > out.txt 2>&1

    [root@centosLocal centos]# cat out.txt

    find: /dev/fd/3: Not a directory

    find: /dev/fd/4: Not a directory

    ```

    Redirecting using `&` works like this: first, the output is redirected into `out.txt`.
    Second, `STDERR` or the file descriptor `2` is reassigned to the same location
    as `STDOUT`, in this case `out.txt`. Redirection is extremely useful and comes
    in handy while solving problems that surface when manipulating large files, compiling
    source code, redirecting output in scripts. While powerful, redirection can get
    complicated for newer administrators. Practice, research, and occasional question
    to a Linux forum (such as Stack Overflow) will help.


    ### Bash Shell Constructs

    Now that we have a good idea of how the Bash shell works, let''s learn some basic
    constructs used to write scripts. In this section we will explore:

    - [Variables](https://www.tutorialspoint.com/linux_admin/linux_admin_variables.htm)

    - [Loops](https://www.tutorialspoint.com/linux_admin/linux_admin_loops.htm)

    - [Conditionals](https://www.tutorialspoint.com/linux_admin/linux_admin_conditionals.htm)

    - [Loop control](https://www.tutorialspoint.com/linux_admin/linux_admin_loop_control.htm)

    - [Reading and writing to files](https://www.tutorialspoint.com/linux_admin/linux_admin_reading_and_writing_to_files.htm)

    - [Basic math operations](https://www.tutorialspoint.com/linux_admin/linux_admin_basic_math_operations.htm)


    ### Bash Troubleshooting Hints

    Bash can be a little tricky compared to a dedicated scripting language. Some of
    the biggest hangups in Bash scripts are from incorrectly escaping or not escaping
    script operations being passed to the shell. If you have looked over a script
    a few times and it is not working as expected, don''t fret. This is common even
    with those who use Bash to create complex scripts daily. A quick search of Google
    or signing up at an expert Linux forum to ask a question will lead to a quick
    resolution. There is a very likely chance someone has come across the exact issue
    and it has already been solved. Bash scripting is a great method of quickly creating
    powerful scripts for everything from automating administration tasks to creating
    useful tools. Becoming an expert level Bash developer takes time and practice.
    Hence, use Bash scripts whenever possible, it is a great tool to have in your
    CentOS Administration toolbox.


    ### Linux Admin - Package Management

    Package management in CentOS can be performed in two ways: from the terminal and
    from the Graphical User Interface. More often than not a majority of a CentOS
    administrator''s time will be using the terminal. Updating and installing packages
    for CentOS is no different. With this in mind, we will first explore package management
    in the terminal, then touch on using the graphical package management tool provided
    by CentOS.


    #### YUM Package Manager

    YUM is the tool provided for package management in CentOS. We have briefly touched
    this in previous chapters. In this chapter, we will be working from clean install.
    We will first completely update our installation and then application. YUM has
    brought installation and management in Linux a long way. YUM "automatically" checks
    for out-of-date dependencies, addition to out-of-date packages. This has really
    taken a load off the administrator compared to the old days of compiling every
    application from source code. `yum check-update` for packages that can update.
    For this tutorial, we will assume this system that will be facing the Internet
    with no applications that needs to be tested before upgrading the packages. Let
    us install the updated dates onto the system.


    ```bash

    [root@localhost dc]# yum check-update

    Loaded plugins: fastestmirror, loading mirror speeds from cached file

    * base: mirrors.centos

    * extras: mirrors.centos

    * updates: mirrors.clarksonedu

    NetworkManager.x86_64      1:7.4.160-1.el7_3

    NetworkManager-adsl.x86_64      1:7.4.160-1.el7_3

    NetworkManager-glib.x86_64      1:7.4.160-1.el7_3

    NetworkManager-libnm.x86_64      1:7.4.160-1.el7_3

    NetworkManager-team.x86_64      1:7.4.160-1.el7_3

    NetworkManager-tu.x86_64      1:7.4.160-1.el7_3

    NetworkManager-wif.x86_64      1:7.4.160-1.el7_3

    audit.x86_64      2.6.5-3.el7_3.1

    vim-common.x86_64      2:7.4.160-1.el7_3

    vim-enhanced.x86_64      2:7.4.160-1.el7_3

    vim-filesystem.x86_64      2:7.4.160-1.el7_3

    vim-common.x86_64      2:7.4.160-1.el7_3

    vim-enhanced.x86_64      2:7.4.160-1.el7_3

    vim-filesystem.x86_64      2:7.4.160-1.el7_3

    ```

    '
