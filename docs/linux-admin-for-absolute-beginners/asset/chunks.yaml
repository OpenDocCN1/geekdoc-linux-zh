    ### Use gzip to Compress File Backups


    As noted earlier, we can use either `bzip2` or `gzip` from `tar` with the `-j`
    or `-z` command line switches. We can also use `gzip` to compress individual files.
    However, using `bzip` or `gzip` alone does not offer as many features as when
    combined with `tar`. When using `gzip`, the default action is to remove the original
    files, replacing each with a compressed version adding the `.gz` extension. Some
    common command line switches for `gzip` are:


    | Switch | Action |

    | :--- | :--- |

    | `-c` | Keeps files after placing into the archive |

    | `-l` | Get statistics for the compressed archive |

    | `-r` | Recursively compresses files in the directories |

    | `-1` thru `9` | Specifies the compression level on a scale of 1 thru 9 |

