    \ will be installed\n--> Finished Dependency Resolution\nDependencies Resolved\n\
    ==============================================================================================================================================================\n\
    Package         Arch    Version                Repository           Size\n==============================================================================================================================================================\n\
    Installing:      lynx            x86_642.8.80.3.dev15.el7  base              \
    \ 1.4 M\nTransaction Summary\n==============================================================================================================================================================\n\
    Install 1 Package\nTotal download size: 1.4 M\nInstalled size: 5.4 M\nIs this\
    \ ok [y/d/N]: y\nDownloading packages:\nNo Presto metadata available for base\n\
    lynx-2.8.8-0.3.dev15.el7.x86_64.rpm| 1.4 MB  00:00:10\nRunning transaction check\n\
    Running transaction test\nTransaction test succeeded\nRunning transaction\nInstalling\
    \ : lynx-2.8.8-0.3.dev15.el7.x86_64 1/1\nVerifying  : lynx-2.8.8-0.3.dev15.el7.x86_64\
    \ 1/1\nInstalled:   lynx.x86_64 0:2.8.8-0.3.dev15.el7\nComplete!\n[root@localhost\
    \ rdc]#\n```\n\nNext, let's make sure `Lynx` did in fact install correctly.\n\n\
    ```bash\n[root@localhost rdc]# yum list installed | grep -ı lynx\nlynx.x86_64\
    \            2.8.8-0.3.dev15.el7  @base\n[root@localhost rdc]#\n```\n\nGreat!\
    \ Let's use `Lynx` to see what the web looks like without \"likes\" and pretty\
    \ pictures.\n\n```bash\n[root@localhost rdc]# lynx www.tutorialpoint.in!\n```\n\
    ![Image00012.jpg)\n\nGreat, now we have a web browser for our production server\
    \ that can be used without much worry into remote exploits launched over the web.\
    \ This a good thing for production servers.\n\nWe are almost completed, however\
    \ first we need to set this server for developers to test applications. Thus,\
    \ let's make sure they have all the tools needed for their job. We could install\
    \ everything individually, but CentOS and YUM have made this a lot faster. Let's\
    \ install the Development Group Package.\n\n```bash\n[root@localhost rdc]# yum\
    \ groups list\nLoaded plugins: fastestmirror, langpacks\nLoading mirror speeds\
    \ from cached hostfile\n* base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n\
    * updates: mirror.clarkson.edu\nAvailable Groups:\n  Compatibility Libraries\n\
    \  Console Tools\n  Development Tools\n  Graphical Administration\n  Internet\
    \ Tools\n  Legacy Unix\n  Security Tools\n  Smart Card\n  System Administration\n\
    \  System Management\n[root@localhost rdc]#\n```\n\nThis is a smaller list of\
    \ Groups provided by CentOS. Let's see what is included with the \"Development\
    \ Group\".\n\n```bash\n[root@localhost rdc]# yum group info \"Development\"\n\
    Loaded plugins: fastestmirror, langpacks\nLoading mirror speeds from cached hostfile\n\
    * base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n* updates: mirror.clarkson.edu\n\
    There is no installed groups\nMaybe run: yum groups\nGroup: Development Tools\n\
    Description: A basic environment\nMandatory Packages:\n```\n\nThe first screen\
    \ of output is as seen above. This list is rather comprehensive. However, this\
    \ group usually needs to be installed as time goes. Let's install the entire Group.\n\
    \n```bash\n[root@localhost rdc]# yum groups install \"Development Tools\"\n```\n\
    \nThis will be a larger installation. When completed, your server will have most\
    \ libraries and compilers for Perl, Python, and C++.\n\n# Graphical Package Management\
    \ in CentOS\n\nGnome Desktop provides a graphical package management tool called\
    \ Software. It is fairly simple to use and straightforward. Software, the package\
    \ management tool can be found by navigating to: Applications → System Tools →\
    \ Software.\n\nThe Software Management Tool is divided into groups allowing the\
    \ administrator to select packages for installation. While this tool is great\
    \ for ease-of-use and simplicity, YUM is a lot more powerful and will probably\
    \ be used more by administrators. Following is a screenshot of the Software Tool,\
    \ not really designed for administrators.![Image0013.jpg)\n\n# Linux Admin - Volume\
    \ Management\n\nLogical Volume Management (LVM) is a method used by Linux to manage\
    \ volumes across different physical disks. This is not to be confused with RAID.\
    \ However, it can be thought of in a similar concept as RAID 0 or JBod. With LVM,\
    \ it is possible to have (for example) three physical disks of 1TB each, then\
    \ a logical volume of around 3TB such as `/dev/sdb`. Or even two logical volumes\
    \ of 1.5TB, 5 volumes of 500GB, or any combination. One single disk can even be\
    \ used for snapshots of Logical Volumes. Note — Using Logical Volumes actually\
    \ increases disk I/O when configured correctly. This works in a similar fashion\
    \ to RAID 0 stripping data across separate disks.\n\nWhen learning about volume\
    \ management with LVM, it is easier if we know what component in LVM is. Please\
    \ study the following table to get a firm grasp of each component. If you need\
    \ to, use Google to study. Understanding each piece of a logical volume is important\
    \ to manage them.\n\n| Component | Description | Example |\n| :--- | :--- | :---\
    \ |\n| PV | Physical Volume | `sda` |\n| PP | Physical Partition | `sda1`, `sda2`\
    \ |\n| VG | Volume Group | Pooled physical resources |\n| LV | Logical Volume\
    \ | Seen as a storage facility to the operating system |\n"
