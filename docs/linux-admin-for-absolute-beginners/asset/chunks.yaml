    # 关于块大小的说明


    `dd` 的默认块大小为 512 字节。这是低密度硬盘硬盘的标准块大小。如今的高密度机械硬盘（HDD）已增加到 4096 字节（4kB）块大小，以支持 1TB
    及更大的磁盘。因此，在使用具有更高容量的新型硬盘运行 `dd` 之前，我们需要检查磁盘的块大小。


    在本教程中，我们不会在生产服务器上通过 `dd` 进行操作，而是将使用运行在 `VMWare` 中的 CentOS 安装系统。我们还将配置 `VMWare`
    启动一个可启动的 Linux ISO 镜像，而不是启动 USB 闪盘。


    首先，我们需要下载名为 `CentOS Gnome ISO` 的 CentOS 镜像。该文件几乎有 3GB，建议始终保留一份用于创建可启动的 USB 闪盘，以及启动虚拟服务器安装进行故障排除和裸机镜像。


    其他可启动的 Linux 发行版同样适用。`Linux Mint` 也可以用于可启动 ISO，因为它具有出色的硬件支持和用于维护的精美 GUI 磁盘工具。


    CentOS GNOME Live 可启动镜像可以从此处下载：[`buildlogs.centos.org/rolling/7/isos/x86_64/CentOS-7-x86_64-LiveGNOME.iso`](http://buildlogs.centos.org/rolling/7/isos/x86_64/CentOS-7-x86_64-LiveGNOME.iso)


    让我们配置 `VMWare Workstation` 安装从我们的 Linux 可启动镜像启动。这些步骤适用于 OS X 上的 `VMWare`。不过，它们与
    Linux、Windows 上的 `VMWare Workstation` 甚至 `Virtual Box` 类似。


    **注意** — 使用 `Virtual Box` 或 `VMWare Workstation` 等虚拟桌面解决方案是设置 CentOS 管理任务学习实验场景的极佳方法。它提供了安装多个
    CentOS 系统的能力，几乎不需要硬件配置即可让人员专注于管理，甚至可以在做出更改之前保存服务器状态。


    ## 配置环境


    首先，让我们配置一个虚拟光驱并挂载我们的 ISO 镜像进行启动，而不是使用虚拟 CentOS 服务器安装 — ![ISO image](img/Image00010.jpg)


    现在，设置启动磁盘 — ![Startup Disk](img/Image00011.jpg)


    现在启动后，我们的虚拟机将从 CentOS 可启动 ISO 镜像启动，并允许访问之前配置的虚拟 CentOS 服务器上的文件。


    让我们检查一下磁盘，看看我们想从哪里拷贝 MBR（压缩后的输出如下）。


    ```

    Mint ~ # fdisk -l

    Disk /dev/sda: 60 GiB, 21474836480 bytes, 41943040 sectors

    Units: sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    Disk /dev/sdb: 20 GiB, 21474836480 bytes, 41943040 sectors

    Units: sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    ```


    我们已经找到了两个物理磁盘：`sda` 和 `sdb`。每个磁盘的块大小均为 512 字节。因此，我们现在运行 `dd` 命令为 `SDA1` 拷贝前 512
    字节作为我们的 MBR。


    此操作的最佳方法是 —


    ```bash[root@mint rdc]# dd if=/dev/sda bs=512 count=1 | gzip -c >/mnt/sdb/images/mbr.iso.gz

    1+0 records in

    1+0 records out

    512 bytes copied, 0.000171388 s, 3.0 MB/s

    [root@mint rdc]# ls /mnt/sdb/

    mbr-iso.gz

    [root@mint rdc]#

    ```


    就这样，我们得到了主引导记录的完整镜像。如果我们有足够的空间为启动器制作镜像，我们也可以轻松地创建一个全系统启动镜像 —


    ```bash

    dd if=/dev/INPUT/DEVICE-NAME-HERE conv=sync,noerror bs=4K | gzip -c >/mnt/sdb/boot-server-centos-image.iso.gz

    ```


    `conv=sync` 用于字节必须为物理介质对齐的情况。在这种情况下，如果未读取精确的 4K 对齐数据，`dd` 可能会报错（例如……一个文件只有 3K
    但需要占据磁盘上单个 4K 块。或者只是发生了读取错误导致 `dd` 无法读取该文件）。因此，带有 `conv=sync,noerror` 的 `dd` 将这
    3K 用微小但有用的数据填充到 4K 块对齐的物理介质中，而不会出现导致大型操作终止的错误。


    在处理来自磁盘的数据时，我们总是希望包含 `conv=sync,noerror` 参数。


    ## 使用 Gnu Tar


    `tar` 是一种类似于 Windows 上 `winrar` 的归档工具。它的名称 Tape Archive（带存档）缩写为 `tar`，很好地概括了该工具的功能。`tar`
    将将文件放入归包中。因此，对于 `/etc` 中的几十个文件，我们可以直接将它们“打包”成归包进行备份。`tar` 多年来一直是 Unix 和 Linux
    上归档文件的标准。因此，使用 `tar` 配合 `gzip` 或 `bz2` 被认为是归档的最佳实践。


    以下是 `tar` 使用的命令行开关：


    | 开关 | 作用 |

    | :--- | :--- |

    | `-c` | 创建新的 .tar 归包 |

    | `-C` | 解到不同的目录 |

    | `-j` | 使用 `bz2` 压缩 |

    | `-z` | 使用 `gzip` 压缩 |

    | `-v` | 详细显示归档进度 |

    | `-t` | 列出归包内容 |

    | `-f` | 归包文件名 |

    | `-x` | 解包 |


    以下是创建 tar 归包的基本语法：


    ```bash

    tar -cvf [tar archive name]

    ```


    ## tar 的压缩机制


    **关于 tar 的压缩机制** — 在使用 `tar` 时，建议坚持两种常用的压缩方案之一：`gzip` 和 `bz2`。`gzip` 文件消耗的 CPU
    资源较少，但体积较大。而 `bz2` 压缩时间更长，消耗更多 CPU 资源；但产生的文件更小。


    在使用文件压缩时，我们总是希望使用标准的文件扩展名，让大家（包括我们自己）知道（而不是通过尝试猜测）提取归包需要哪种压缩方案。


    | 扩展名 | 描述 |

    | :--- | :--- |

    | `bz2` | `.tbz` |

    | `bz2` | `.tar.tbz` |

    | `bz2` | `.tb2` |

    | `gzip` | `.tar.gz` |

    | `gzip` | `.tgz` |


    '
