  trans: "\n\n物理卷将显示为 `/dev/sda`、`/dev/sdb`；这是 Linux 检测到的物理磁盘。物理分区是指使用 `fdisk` 等磁盘工具对磁盘进行划分的区域。请注意，在大多数常见的\
    \ LVM 设置中，不建议使用物理分区。例如：`disk /dev/sda` 被划分为包含两个物理分区：`/dev/sda1` 和 `/dev/sda1`。\n\
    \n如果我们有两个各 1TB 的物理磁盘，我们可以在这两个磁盘之间创建一个近 2TB 的卷组（volume group）。从该卷组中，我们可以创建三个逻辑卷（logical\
    \ volumes），每个卷的大小只要不超过总卷组的大小即可。\n\n传统的 Linux 磁盘管理工具\n在熟悉 CentOS 7 中最新、强大的 LVM\
    \ 管理工具之前，我们应该先探索更多一直用于 Linux 磁盘管理的传统工具。这些工具与当今的高级 LVM 工具（如系统存储管理器）配合依然非常有用，例如：`lsblk`、`parted`\
    \ 和 `mkfs.xfs`。\n\n现在，假设我们已经向系统中添加了一个或两个磁盘，我们需要列出 Linux 检测到的磁盘。我总是建议在执行任何被视为具有破坏性的操作之前列出一次磁盘。`lsblk`\
    \ 是获取磁盘信息的极佳工具。让我们看看 CentOS 检测到了哪些磁盘。\n\n```bash\n[root@localhost rdc]# lsblk\n\
    NAME      MAJ:MIN  RM   SIZE    RO   TYPE MOUNTPOINT\nsda       8:0      0   \
    \  20G   0   disk\n├─sda1    8:1      0      1G   0   part /boot\n└─sda2    8:2\
    \      0    19G   0   part\n  ├─cl-root 253:0    0     17G   0   lvm  /\n  └─cl-swap\
    \ 253:1    0      2G   0   lvm  [SWAP]\nsdb       8:16     0      6G   0   disk\n\
    sdc       8:32     0      4G   0   disk\nsr0       11:0     1    1024M   0   rom\n\
    ```\n\n你可以看到，这个系统上有三个磁盘：`sda`、`sdb` 和 `sdc`。磁盘 `sda` 包含了我们正在工作的 CentOS 安装，所以我们不想随意变动\
    \ `sda`。`sdb` 和 `sdc` 都是为了本教程添加到系统的。让我们让这些磁盘对 CentOS 可用。\n\n### 创建磁盘标签\n```bash\n\
    [root@localhost rdc]# parted /dev/sdb mklabel GPT\nWarning: /dev/sdb 上的现有磁盘标签将被破坏，此磁盘上的所有数据将丢失。你确定要继续吗？Yes/No?\
    \ Yes\n```\n我们现在有一个标记好的磁盘了。只需以相同的方式在 `sdc` 上运行 `parted` 命令即可。\n\n### 在磁盘上创建分区\n\
    我们将在每个磁盘上只创建一个单分区。创建分区时使用 `parted` 命令。\n\n```bash\n[root@localhost rdc]# parted\
    \ -a /dev/sdb mkpart primary 0% 100% -- requested partition from 0.0B to 642MB\
    \ (sectors 0..252911).我们能管理的的最接近的位置是 17.4kB 到 104kB (sectors 3..2047).这你接受吗？Yes/No?\
    \ NO\n[root@localhost rdc]# parted -a /dev/sdc mkpart primary 0% 100%Information\
    \ -- 你可能需要更新 /etc/fstab。\n```\n\n```bash\n[root@localhost rdc]# lsblk\nNAME  \
    \    MAJ:MIN  RM   SIZE    RO   TYPE MOUNTPOINT\nsda       8:0      0     20G\
    \   0   disk\n├─sda1    8:1      0      1G   0   part /boot\n└─sda2    8:2   \
    \   0    19G   0   part\n  ├─cl-root 253:0    0     17G   0   lvm  /\n  └─cl-swap\
    \ 253:1    0      2G   0   lvm  [SWAP]\nsdb       8:16     0      6G   0   disk\n\
    └─sdb1    8:17     0      6G   0   part\nsdc       8:32     0      4G   0   disk\n\
    └─sdc1    8:33     0      4G   0   part\nsr0       11:0     1    1024M   0   rom\n\
    ```\n从 `lsblk` 输出中可以看到，我们现在有两个分区，分别在 `sdb` 和 `sdc` 上。\n\n### 创建文件系统\n最后，在挂载和使用任何卷之前，我们需要添加文件系统。我们将使用\
    \ XFS 文件系统。\n\n```bash\n[root@localhost rdc]# mkfs.xfs -f /dev/sdb1\nmeta-data\
    \ = /dev/sdb1 size = 512 agcount = 4, agsize = 393088 blks sectsz = 512 attr =\
    \ 2, proj32bit = 1 inobt = 0, sparse = 0data = size = 4096 blocks = 172352, maxpct\
    \ = 25 dealloc = 0 width = 0 blks naming = version 2 size = 4096 asci = 0 ftype\
    \ = 1 log = internal log size = 4096 blocks = 2560, version = 2 sectsz = 512 sunit\
    \ = 0 blks, lazy-count = 1 realtime = none exsz = 4096 blocks = 0, rtextents =\
    \ 0\n[root@localhost rdc]# mkfs.xfs -f /dev/sdc1\nmeta-data = /dev/sdc1 size =\
    \ 512 agcount = 4, agsize = 262016 blks sectsz = 512 attr = 2, proj32bit = 1 inobt\
    \ = 0, sparse = 0data = size = 4096 blocks = 1048064, maxpct = 25 dealloc = 0\
    \ width = 0 blks naming = version 2 size = 4096 asci = 0 ftype = 1 log = internal\
    \ log size = 4096 blocks = 2560, version = 2 sectsz = 512 sunit = 0 blks, lazy-count\
    \ = 1 realtime = none exsz = 4096 blocks = 0, rtextents = 0\n```\n\n在挂载和使用任何卷之前，我们已经完成了格式化。\n\
    \n"
