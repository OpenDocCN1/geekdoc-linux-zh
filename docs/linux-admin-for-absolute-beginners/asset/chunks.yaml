    our MySQL servıce ıs up and runnıng.[root@centos]# netstat -antup | grep 3306tcp6       0       0
    :::3306       :::*       LISTEN       6572/mysqld[root@centos]#Note − We wıll
    not allow any fırewall rules through. It''s common to have MySQL confıgured to
    use Unıx Domaın Sockets. Thıs assures only the web-server of the LAMP stack, locally,
