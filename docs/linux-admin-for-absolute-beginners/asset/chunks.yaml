    当需要在 Windows 系统上解压归档或供 Windows 使用时，建议使用 `.tar.tbz` 或 `.tar.gz`，因为大多数这类三个字符的单扩展名会让
    Windows 以及仅 Windows 管理员感到困惑（不过这有时正是他们想要的结果）。


    让我们从从 Mac 工作站拷贝的远程备份创建一个 gzipped tar 归档：


    ```bash

    rdc@mınt Documents]$ tar -cvz -f RemoteStuff.tgz ./RemoteStuff/./RemoteStuff/./RemoteStuff/.DS_Store./RemoteStuff/DDWRT/./RemoteStuff/DDWRT/.DS_Store./RemoteStuff/DDWRT/ddwrt-lınksys-wrt1200acv2-webflash.bin./RemoteStuff/DDWRT/ddwrt_mod_notes.docx./RemoteStuff/DDWRT/factory-to-ddwrt.bin./RemoteStuff/open_ldap_confıg_notes/./RemoteStuff/open_ldap_confıg_notes/ldap_dırectory_a.png./RemoteStuff/open_ldap_confıg_notes/open_ldap_notes.txt./RemoteStuff/perl_scrıpts/./RemoteStuff/perl_scrıpts/mysnmp.pl./RemoteStuff/php_scrıpts/./RemoteStuff/php_scrıpts/chunked.php./RemoteStuff/php_scrıpts/gettıngURL.php./RemoteStuff/A
