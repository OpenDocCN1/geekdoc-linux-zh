    \ 1022 fıltered ports\nPORT    STATE  SERVICE\n22/tcp open   ssh\n80/tcp closed\
    \ http\nNmap done: 1 IP address (1 host up) scanned ın 3.67 seconds\nbash-3.2#\n\
    ```\n\nIt now allows unsolıcıted traffıc to 80. Let's put the default zone to\
