    ## 引言

    Linux 的设计基于 Unix 哲学：“将许多小而精确的工具链在一起，简化复杂的任务”。Linux 从根本上说，通常没有针对特定用途的大型单一用途应用程序。相反，有数百种基本工具，结合在一起就能高效地完成大项任务。CentOS
    在企业级 Linux 发行版中独树一帜，坚持 Linux 的开源本质。本书提供了对 Linux 管理的完整理解，并解释了如何利用它。


    ## 读者群

    本书为初学者编写，帮助他们理解 Linux 管理的基础知识。对于 Linux 管理专业人士也特别有用。完成本教程后，你会发现自己已达到中等水平，并从此向更高水平迈进。


    ## 前提条件

    在继续之前，我们假设你已经具备 Linux 和管理的基础知识。


