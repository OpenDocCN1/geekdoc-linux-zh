  trans: "\n\n# 注意事项\n- 在命名企业时，使用 `.local` TLD 是一种最佳实践。使用 `.net` 或 `.com` 可能会在基础架构中区分在线和内部域名时引起困难。想象一下一家公司在外部和内部操作中同时使用\
    \ `acme.com` 的额外工作。因此，将 Internet 资源命名为 `acme.com` 或 `acme.net` 可能是明智的。然后，本地网络企业资源被描述为\
    \ `acme.local`。这将涉及配置 DNS 记录，但将会在简洁性、优雅性和安全性方面回报。\n\n# 在 CentOS 上安装 Open LDAP\n\
    从 YUM 安装 `openldap`、`openldap-servers`、`openldap-clients` 和 `migrationtools`。\n\
    \n```bash\n[root@localhost]# yum -y install openldap openldap-servers openldap-clients\
    \ migration tools\n```\n\n```\nLoaded plugins: fastestmirror, langpackupdates|\
    \ 3.4 kB  00:00:00\nupdates/7/x86_64/primary_db| 2.2 MB  00:00:05\nDetermining\
