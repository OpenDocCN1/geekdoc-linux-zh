- fmt: "\nThese are the basic concepts of administering and configuring `firewalld`.\
    \ Configuring host-based firewall services in CentOS can be a complex task in\
    \ more sophisticated networking scenarios. Advanced usage and configuration of\
    \ `firewalld` and `iptables` in CentOS can take an entire tutorial. However, we\
    \ have presented the basics that should be enough to complete a majority of daily\
    \ tasks.\n\n# Configure PHP in CentOS Linux\n\nPHP is one of the most prolific\
    \ web languages in use today. Installing a LAMP Stack on CentOS is something every\
    \ system administrator will need to perform, most likely sooner than later.\n\n\
    A traditional LAMP Stack consists of (L)inux (A)pache (M)MySQL (P)HP. There are\
    \ three main components to a LAMP Stack on CentOS:\n* Web Server\n* Web Development\
    \ Platform / Language\n* Database Server\n\nNote – The term LAMP Stack can also\
    \ include the following technologies: PostgreSQL, MariaDB, Perl, Python, Ruby,\
    \ NGINX Webserver.\n\nFor this tutorial, we will stick with the traditional LAMP\
    \ Stack of CentOS GNU Linux: Apache web server, MySQL Database Server, and PHP.\n\
    \nWe will actually be using MariaDB. MySQL configuration files, databases and\
    \ tables are transparent to MariaDB. MariaDB is now included in the standard CentOS\
    \ repository instead of MySQL. This is due to the limitations of licensing and\
    \ open-source compliance, since Oracle has taken over the development of MySQL.\n\
    \nThe first thing we need to do is install Apache.\n\n```bash\n[root@CentOS]#\
    \ yum install httpd\nLoaded plugins: fastestmirror, langpacks\nbase| 3.6 kB  00:00:00\n\
    extras| 3.4 kB  00:00:00\nupdates| 3.4 kB  00:00:00\nextras/7/x86_64/primary_d|\
    \ 121 kB  00:00:00\nLoading mirror speeds from cached hostfile\n* base: mirror.sigmanet.com\n\
    * extras: linux.mirrors.es.net\n* updates: mirror.eboundhost.com\nResolving Dependencies\n\
    --> Running transaction check\n---> Package httpd.x86_64 0:2.4.6-45.el7.centos\
    \ will be installed\n--> Processing Dependency: httpd-tools = 2.4.6-45.el7.centos\
    \ for package:httpd-2.4.6-45.el7.centos.x86_64\n--> Processing Dependency: /etc/mime.types\
    \ for package: httpd-2.4.6-45.el7.centos.x86_64\n--> Running transaction check\n\
    ---> Package httpd-tools.x86_64 0:2.4.6-45.el7.centos will be installed\n--->\
    \ Package mailcap.noarch 0:2.1.41-2.el7 will be installed\n--> Finished Dependency\
    \ Resolution\nInstalled:httpd.x86_64 0:2.4.6-45.el7.centos\nDependency Installed:httpd-tools.x86_64\
    \ 0:2.4.6-45.el7.centos\nmailcap.noarch 0:2.1.41-2.el7\nComplete!\n```\n\nLet's\
    \ configure `httpd` service.\n\n```bash\n[root@CentOS]# systemctl start httpd\
    \ && systemctl enable httpd\n```\n\nNow, let's make sure the web-server is accessible\
    \ through `firewalld`.\n\n```bash\nbash-3.2# nmap -sS -p 1-1024 -T 5 -sV 10.211.55.1\n\
    Starting Nmap 7.30 ( https://nmap.org ) at 2017-01-28 02:00 MST\nNmap scan report\
    \ for centos.shared (10.211.55.1)\nHost is up (0.00054s latency).\nNot shown:\
    \ 1022 filtered ports\nPORT    STATE SERVICE VERSION\n22/tcp open  ssh      OpenSSH\
    \ 6.6.1 (protocol 2.0)\n80/tcp open  http     Apache httpd 2.4.6 ((CentOS))\n\
    Service detection performed. Please report any incorrect results at https://nmap.org/submit/.\n\
    Nmap done: 1 IP address (1 host up) scanned in 10.82 seconds\nbash-3.2#As you\
    \ can see by the nmap service, Apache server is listening and responding to requests\
    \ on the CentOS.\n```\n\n# Install MySQL Server\n\n```bash\n[root@CentOS rdc]#\
    \ yum install mariadb-server.x86_64 && yum install mariadb-devel.x86_64 && mariadb.x86_64\
    \ && mariadb-libs.x86_64\n```\n\nWe are installing the following repository packages\
    \ for MariaDB:\n* `mariadb-server.x86_64` The main MariaDB daemon package.\n*\
    \ `mariadb-devel.x86_64 Files to compile from source with MySQL compatibility.\n\
    * `mariadb.x86_64 Utilities for administering MariaDB from the command line.\n\
    * `mariadb-libs.x86_64 Common libraries that could be needed for applications\
    \ compiled with MySQL support.\n\nNow, let's start and enable the MariaDB service.\n\
    \n```bash\n[root@CentOS]# systemctl start mariadb\n[root@CentOS]# systemctl enable\
    \ mariadb\n```\n\nNote – Like Apache, we will not enable connections to MariaDB\
    \ through our host-based firewall (`firewalld`). When using a database server,\
    \ it's considered best practice to only allow local connections. Let's make sure\
    \ MariaDB is accepting connections.\n\n```bash\n[root@CentOS#] netstat -ln\nActive\
    \ connections (only servers)\nProto    Recv-Q  Send-Q   Local Address       Foreign\
    \ Address       State\ntcp        0               0       0.0.0.0:306        \
    \ 0.0.0.0:*               LISTEN\ntcp        0               0       0.0.0.0:11\
    \         0.0.0.0:*               LISTEN\ntcp        0               0       192.168.122.1:53\
    \    0.0.0.0:*               LISTEN\ntcp        0               0       0.0.0.0:22\
    \         0.0.0.0:*               LISTEN\ntcp        0               0       127.0.0.1:631\
    \      0.0.0.0:*               LISTEN\ntcp        0               0       127.0.0.1:25\
    \      0.0.0.0:*               LISTEN\n[root@CentOS rdc]#\n```\n\nAs we can see,\
    \ MariaDB is listening on port `3306`. We will leave our host-based firewall (`firewalld`)\
    \ blocking connections to port `3306`.\n\n# Install and Configure PHP\n\n```bash\n\
    [root@CentOS#] yum install php.x86_64 && php-common.x86_64 && php-mysql.x86_64\
    \ && php-pdo.x86_64 && php-soap.x86_64 && php-xml.x86_64\n```\n\nI recommend installing\
    \ the following php packages for compatibility:\n* `php-common.x86_64`\n* `php-mysql.x86_64`\n\
    * `php-mysqlnd.x86_64`\n* `php-pdo.x86_64`\n* `php-soap.x86_64`\n* `php-xml.x86_64`\n\
    \n```bash\n[root@CentOS]# yum install -y php-common.x86_64 php-mysql.x86_64 php-mysqlnd.x86_64\
    \ php-pdo.x86_64 php-soap.x86_64 php-xml.x86_64\n```\n\nThis is our simple php\
    \ file located in the Apache webroot of `/var/www/html/`.\n\n```bash\n[root@CentOS]#\
    \ cat /var/www/html/index.php\n<html>\n  <head>\n    <title>PHP Test Page</title>\n\
    \  </head>\n  <body>\n    PHP Install\n    <?php\n    echo \"We are now running\
    \ PHP on CentOS Linux!<br />\"\n    ?>\n  </body>\n</html>\n```\n\nLet's change\
    \ the ownership group of our page to the system user our http daemon is running\
    \ under.\n\n```bash\n[root@CentOS]# chgrp httpd /var/www/html/index.php && chmod\
    \ g+rx /var/www/html/index.php\n```\n\nWhen requested manually via `ncat`:\n\n\
    ```bash\nbash-3.2# ncat 10.211.55.1 80\n  GET /index.php\n  HTTP/1.1 200 OK\n\
    \  Date: Sat, 28 Jan 2017 12:06:02 GMT\n  Server: Apache/2.4.6 (CentOS) PHP/5.4.16\n\
    \  X-Powered-By: PHP/5.4.16\n  Content-Length: 137\n  Connection: close\n  Content-Type:\
    \ text/html; charset=UTF-8\n<html>\n  <head>\n    <title>PHP Test Page</title>\n\
    \  </head>\n  <body>\n    PHP Install\n    We are now running PHP on CentOS Linux!<br\
    \ />\n  </body>\n</html>\n```\n\nPHP and LAMP are very popular web programming\
    \ technologies. LAMP installation and configuration is sure to come up on your\
    \ list of needs as a CentOS Administrator. Easy to use CentOS packages have taken\
    \ a lot of work from compiling Apache, MySQL, and PHP from the source code.\n\n\
    # Set Up Python with CentOS Linux\n\nPython is a widely used interpreted language\
    \ that has brought professionalism to the world of coding scripted applications\
    \ on Linux (and other operating systems). Where Perl was once the industry standard,\
    \ Python has surpassed Perl in many respects.\n\nSome strengths of Python versus\
    \ Perl are:\n* Rapid progression in refinement\n* Libraries that are standard\
    \ to the language\n* Readability of the code is thought out in language definition\n\
    * Many professional frameworks for everything from GUI support to web-development\n\
    \nPython can do anything Perl can, and in a lot of cases in a better manner. Though\
    \ Perl still has its place amongst the toolbox of Linux, learning Python is a\
    \ great choice.\n\nThe biggest drawbacks of Python are sometimes related to its\
    \ strengths. In history, Python was originally designed to teach programming.\
    \ At times, its core foundations \"easily readable\" and \"doing things the right\
    \ way\" can cause unnecessary complexity when writing a simple code. Also, its\
    \ standard libraries caused problems in transitioning from versions 2.X to 3.X.\n\
    \nPython scripts are actually used at the core of CentOS for functions vital to\
    \ the functionality of the operating system. Because of this, it is important\
    \ to isolate our development environment from CentOS' core environment. For starters,\
    \ there are currently two versions of Python: 2.X and 3.X. Both stages are still\
    \ active production, though version 2.X is quickly closing on deprecation (and\
    \ has been for a few years). The reason for the two active versions of Python\
    \ was basically fixing the shortcomings of version 2.X. This required some core\
    \ functionality of version 3.X to be done in ways it could not support some 2.X\
    \ scripts. Basically, the best way to overcome this transition is: Develop for\
    \ 3.X and keep up with the latest 2.X version for legacy scripts. Currently, CentOS\
    \ 7.X relies on a semi-current version of 2.X. As of this, the most current versions\
    \ of Python are: 3.4.6 and 2.7.13.\n\nDon't let this confuse or draw any conclusions\
    \ of Python. Setting up a Python environment is really simple. With Python frameworks\
    \ and libraries, this task is actually easy to accomplish. Before setting up our\
    \ Python environments, we need a sane environment. To start, let's make sure our\
    \ CentOS install is fully updated and get building utilities installed.\n\nStep\
    \ 1 – Update CentOS.\n```bash\n[root@CentOS]# yum -y update\n```\n\nStep 2 – Install\
    \ build utilities.\n```bash\n[root@CentOS]# yum -y groupinstall \"development\
    \ tools\"\n```\n\nStep 3 – Install some needed packages.\n```bash\n[root@CentOS]#\
    \ yum install -y zlib-dev openssl-devel sqlite-devel bzip-devel\n```\n\nNow we\
    \ need to install current Python 2.X and 3.X from source.\n* Download compressed\
    \ archives\n* Extract files\n* Compile source code\n\nLet's start by creating\
    \ a build directory for each Python install in `/usr/src/\n\n```bash\n[root@CentOS]#\
    \ mkdir -p /usr/src/python\n```\n\nNow let's download the source tarballs for\
    \ each:\n```bash\n[root@CentOS]# wget https://www.python.org/ftp/python/2.7.13/Python-2.7.13.tar.xz\n\
    [root@CentOS]# wget https://www.python.org/ftp/python/3.6.0/Python-3.6.0.tar.xz\n\
    ```\n\nNow we need to extract each from the archive.\n\nStep 1 – Install xz-libs\
    \ and extract the tarballs.\n```bash\n[root@CentOS]# yum install xz-libs\n[root@CentOS\
    \ python3]# xz -d ./*.xz\n[root@CentOS python3]# ls\nPython-2.7.13.tar  Python-3.6.0.tar\n\
    ```\n\nStep 2 – Untar each installer from its tarball.\n```bash\n[root@CentOS\
    \ python3]# tar -xvf ./Python-2.7.13.tar\n[root@CentOS python3]# tar -xvf ./Python-3.6.0.tar\n\
    ```\n\nStep 3 – Enter each directory and run the configure script.\n```bash\n\
    [root@CentOS]# ./configure --prefix=/usr/local\n[root@CentOS]# make install\n\
    ```\n\nNote – Be sure to use `make install` and not `install`. This will keep\
    \ CentOS and development versions of Python separated. Otherwise, you may break\
    \ the functionality of CentOS. You will now see the compilation process begins.\
    \ Grab a cup of coffee and take a 15 minute break until completion. Since we installed\
    \ all the needed dependencies for Python, the compilation process should complete\
    \ without error. Let's make sure we have the latest 2.X version of Python installed.\n\
    \n```bash\n[root@CentOS-2.7.13]# /usr/local/bin/python2.7 -V\nPython 2.7.13\n\
    ```\n\nNote – You will want to prefix the shebang line to our development environment\
    \ for Python 2.X.\n```bash\n[root@CentOS-2.7.13]# cat ver.py\n#!/usr/local/bin/python2.7\n\
    import sys\nprint(sys.version)\n[root@CentOS-2.7.13]# ./ver.py\n2.7.13 (default,\
    \ Jan 29 2017, 02:24:08) GCC 4.8.5 20150623 (Red Hat 4.8.5-1)\n```\n\nJust like\
    \ that, we have separate installs for versions 2.X and 3.X. From here, we can\
    \ use each and utilities such as `pip` and `virtualenv` to further ease the burden\
    \ of managing Python environments and installation.\n\n# Configure Ruby on CentOS\n\
    \nRuby is a great language for both web development and Linux administration.\
    \ Ruby provides many benefits found in all the previous languages: PHP, Python,\
    \ and Perl. To install Ruby, it is best to bootstrap through `rbenv` which allows\
    \ administrators to easily install and manage Ruby environments. The other method\
    \ for installing Ruby is the standard CentOS packages for Ruby. It is advisable\
    \ to use `rbenv` method with all its benefits. CentOS packages will be easier\
    \ for the non-Ruby savvy.\n\nFirst, let's get some dependencies for `rbenv` installer:\n\
    * `git-core`\n* `lib2`\n* `lib2-devel`\n* `gcc-c++`\n* `patch`\n* `readline`\n\
    * `readline-devel`\n* `yaml-devel`\n* `ffi-devel`\n* `openssl-devel`\n* `make`\n\
    * `bz2`\n* `autoconf`\n* `automake`\n* `libtool`\n* `bson`\n* `curl`\n* `sqlite-devel`\n\
    \nMost of these packages may already be installed depending on the chosen options\
    \ and roles when installing CentOS. It is good to install everything we are unsure\
    \ about as this can lead to less headache when installing packages requiring dependencies.\n\
    \n```bash\n[root@CentOS]# yum -y install git-core lib2 lib2-devel gcc-c++ patch\
    \ readline readline-devel yaml-devel ffi-devel openssl-devel make bz2 autoconf\
    \ automake libtool bson curl sqlite-devel\n```\n\n# Method 1 : rbenv for Dynamic\
    \ Ruby Development Environments\n\nNow as the user who will be using Ruby:\n\n\
    ```bash\n[rdc@CentOS ~]$ git clone https://github.com/rbenv/rbenv.git\n[rdc@CentOS\
    \ ~]$ clone https://github.com/rbenv/ruby-build.git\n```\n\n`ruby-build` will\
    \ provide installation features to `rbenv`.\nNote – We need to switch to root\
    \ or an administration user before running `install.sh`.\n\n```bash\n[rdc@CentOS\
    \ ruby-build]$ cd ~/ruby-build\n[rdc@CentOS ruby-build]# ./install.sh\n```\n\n\
    Let's set our shell for `rbenv` and assure we have installed the correct options.\n\
    \n```bash\n[rdc@CentOS ~]$ source ~/rbenv/rbenv.d/exec/gem-rehash.bash\n[rdc@CentOS\
    \ ruby-build]$ ~/rbenv/bin/rbenv\nrbenv 1.1.0-2-g4f8925a\nUsage: rbenv <command>\
    \ [<args>]\nSome useful rbenv commands are –\n"
