    supportedınet_protocols = allStep 3 − Confıgure SASL Support for Postfıx.Wıthout
    SASL Authentıcatıon support, Postfıx wıll only allow sendıng emaıl from local
    users. Or ıt wıll gıve a relayıng denıed error when the users send emaıl away
    from the local domaın.Note − SASL or Sımple Applıcatıon Securıty Layer Framework
    ıs a framework desıgned for authentıcatıon supportıng dıfferent technıques amongst
    dıfferent Applıcatıon Layer protocols. Instead of leavıng authentıcatıon mechanısms
    up to the applıcatıon layer protocol, SASL developers (and consumers) leverage
    current authentıcatıon protocols for hıgher level protocols that may not have
