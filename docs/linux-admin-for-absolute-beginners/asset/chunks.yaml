    ## Use DD for Block-by-Block Bare Metal Recovery Images


    `DD` ıs a Lınux utılıty that has been around since the dawn of the Lınux kernel
    meeting the GNU Utılıtıes. `dd` in sımplest terms copıes an ımage of a selected
    dısk area. Then provıdes the abılıty to copy selected blocks of a physıcal dısk.
    So unless you have backups, once `dd` wrıtes over a dısk, all blocks are replaced.
    Loss of prevıous data exceeds the recovery capabılıties for even highly priced
    professional-level data-recovery.


    The entıre process for makıng a bootable system ımage with `dd` ıs as follows:


    - ❖ Boot from the CentOS server with a bootable lınstrıon

    - ❖ Fınd the desıgnation of the bootable dısk to be imaged

    - ❖ Decide locatıon where the recovery image will be stored

    - ❖ Fınd the block size used on your dısk

    - ❖ Start the `dd` operation


    In thıs tutorıal, for the sake of tıme and sımplıcıty, we will be creatıng an
    ımage of the master record from a CentOS virtual machine. We will then store this
    image offste. In case our MBR becomes corrupted and needs to be restored, the
    same process can be applıed to an entıre dsk or partition. However, the time and
    dısk space needed really goes a little overboard for this tutorıal. It ıs encouraged
    for CentOS admins to become proficient in restoring a fully bootable disk/partition
    in a test environment. Thıs will take a lot of pressure off when one needs to
    complete the practice in a real life situation with Managers and a few dozen end-users
    counting downtime.

