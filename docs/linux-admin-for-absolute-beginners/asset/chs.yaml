  \n\n\n\n# TLS 概述与配置\n\nTLS 为当今的互联网用户提供了两个主要功能：第一，它验证通信双方的身份，即**身份验证**；第二，它为缺乏此类原生功能的上层协议（如\
  \ ftp、http、电子邮件协议等）在传输层提供端到端加密。\n\n第一种功能是验证双方的身份，对于安全性而言与端到端加密同等重要。如果消费者与一个未经授权支付的网站建立了加密连接，其财务数据仍然面临风险。这就是每个钓鱼网站都无法具备的：一个由受信任\
  \ CA（证书颁发机构）正确签名的 TLS 证书，用于验证网站运营者确实是其声称的身份。\n\n要绕过“没有正确签名证书”的方法只有两种：欺骗用户在网络浏览器中允许对自签名证书的信任，或者希望用户不精通技术，不知道受信任证书颁发机构（或简称\
  \ CA）的重要性。\n\n在本教程中，我们将使用所谓的**自签名证书**。这意味着，在访问该网站的每个 Web 浏览器中显式授予此证书信任状态之前，系统将显示一个错误，阻止用户访问该站点。随后，在访问带有自签名证书的站点之前，用户需要执行若干操作。请记住，从安全角度考虑，这是一件好事。\n\
  \n## 安装并配置 openssl\n\n`openssl` 是 TLS 开源实现的标准。`openssl` 用于 Linux、BSD 发行版、OS X 等系统，甚至支持\
  \ Windows。`openssl` 非常重要，因为它为开发者提供了传输层安全，并抽象了身份验证和端到端加密的详细编程。这就是为什么几乎每个使用 TLS 的开源应用程序都使用了\
  \ `openssl`。它在每个现代版本的 Linux 中都是默认安装的。\n\n默认情况下，CentOS 5 及更高版本应该已经安装了 `openssl`。为了起见，让我们尝试通过\
  \ YUM 安装 `openssl`。只需运行 `install` 即可，因为 `YUM` 足够智能，能够软件包是否已安装。如果我们由于兼容性原因运行旧版本的\
  \ CentOS，执行 `yum -y install` 可以确保 `openssl` 已更新以应对近期的心血出（heart-bleed）漏洞。\n\n运行安装程序时，发现\
  \ `openssl` 实际上有更新。\n\n```\n[root@centos]# yum -y install openssl\n```\n\n```\n\
  Resolving Dependencies\n--> Running transaction check\n---> Package openssl.x86_64\
  \ 1:1.0.1e-60.el7 will be updated\n---> Package openssl.x86_64 1:1.0.1e-60.el7_3.1\
  \ will be an update\n--> Processing Dependency: openssl-libs(x86-64) = 1:1.0.1e-60.el7_3.1\
  \ for package: 1:openssl-1.0.1e-60.el7_3.1.x86_64\n--> Running transaction check\n\
  ---> Package openssl-libs.x86_64 1:1.0.1e-60.el7 will be updated\n---> Package openssl-libs.x86_64\
  \ 1:1.0.1e-60.el7_3.1 will be an update\n--> Finished Dependency Resolution\nDependencies\
  \ Resolved==============================================================================================================================================================\n\
  Package                 Arch    Version                Repository      Size\n==============================================================================================================================================================================\n\
  Updating:openssl        x86_64  1:1.0.1e-60.el7_3.1     updates         73k\nUpdating\
  \ for dependencies:\n```\n\n## 为 Open LDAP 创建自签名证书\n\n这种方法是为我们之前的 Open LDAP 安装创建一个自签名证书。要创建一个自签名\
  \ Open LDAP 证书：\n\n```\n[root@centos]# openssl req -new -x509 -nodes -out /etc/openldap/certs/myldap.pem\
  \ -key /etc/openldap/certs/myldap.pem -days 365\n```\n\n```\nGenerating a 2048 bit\
  \ RSA private key\n.............................\n..................................\n\
  writing new private key to '/etc/openldap/certs/myldap.pem'\n你将被要求输入将整合到证书中的信息。你将输入的内容是区分名称（DN）。有很多字段，但你可以留出一些空白。某些字段会有默认值，如果你输入\
  \ '.'，则该字段将留空。\n-----\nCountry Name (2 letter code) [XX]:US\nState or Province Name\
  \ (full name) []:\nLocality Name (eg, city) [Default City]:LA\nOrganization Name\
  \ (eg, company) [Default Company Ltd]:vmnet\nOrganiz Unit Name (eg, section) []:\n\
  Common Name (eg, your name or your server's hostname) []:centos\nEmail Address []:bob@bernet\n\
  ```\n\n现在，我们的 Open LDAP 证书应该放置在 `/etc/openldap/certs/` 中。\n\n```\n[root@centos]#\
  \ ls /etc/openldap/certs/*.pem\netc/openldap/certs/vmnetcert.pem vmnetkey.pem\n\
  ```\n\n如你所示，我们在 `/etc/openldap/certs/` 目录下同时安装了证书和密钥。最后，我们需要更改每个文件的权限，因为它们现在归属于\
  \ root 用户。\n\n```\n[root@centos]# chown -R ldap:ldap /etc/openldap/certs/*.pem\n\
  [root@centos]# ls -ld /etc/openldap/certs/*.pem\nrw-r--r--. 1 ldap ldap 1395 Feb\
  \ 20 10:00 /etc/openldap/certs/vmnetcert.pem\nrw-r--r--. 1 ldap ldap 1704 Feb 20\
  \ 10:00 /etc/openldap/certs/vmnetkey.pem\n```\n\n## 为 Apache Web 服务器创建自签名证书\n\n\
  在本教程中，我们假设 Apache 已经安装。我们在另一个教程（配置 CentOS 防火墙）中安装过 Apache，并将在未来的教程中介绍 Apache 的高级安装。因此，如果你还没有安装\
  \ Apache，请按照此操作。\n\n一旦可以使用以下步骤安装 Apache HTTPd：\n\n### 步骤 1 - 为 Apache httpd 服务器安装\
  \ mod_ssl\n\n首先，我们需要使用 `mod_ssl` 配置 Apache。使用 YUM 软件包管理器，这非常简单：\n\n```\n[root@centos]#\
  \ yum -y install mod_ssl\n```\n\n然后，重新加载你的 Apache 守护进程以确保 Apache 使用新配置。\n\n```\n\
  [root@centos]# systemctl reload httpd\n```\n\n此时，Apache 已配置支持 TLS 连接。\n\n### 步骤\
  \ 2 - 创建自签名证书\n\n首先，我们要配置私有密钥目录并创建证书。\n\n```\n[root@centos]# mkdir /etc/ssl/private\n\
  [root@centos]# chmod 700 /etc/ssl/private\n```\n\n**注意**：确保只有 root 有该目录的读写权限。生成证书和密钥：\n\
  \n```\n[root@centos]# sudo openssl req -x509 -nodes -days 365 -key /etc/ssl/private/self-apache.key\
  \ -out /etc/ssl/certs/self-apache.crt\n```\n\n以下是我们在 openssl 命令中每个选项的解释：\n\n\n\n\
  \n\n| 命令 | 操作 |\n| :--- | :--- |\n| `req -X509` | 使用 X.509 CSR 管理 PKI 标准进行密钥管理。\
  \ |\n| `-nodes` | 不使用密码保护我们的证书。Apache 必须能够在不中断密码输入的情况下使用该证书。 |\n| `-days 2555` |\
  \ 将证书有效期设置为 7 年或 2555 天。时间范围可以根据需要进行调整。 |\n| `-newkey rsa:2048` | 指定使用长度为 2048 位的\
  \ RSA 算法同时生成密钥和证书。 |\n\n\n\n接下来，我们要为与客户端协商 PFS（完全前向秘密）创建一个 Diffie-Hellman 组。\n\n\
  ```bash\n[centos#] openssl dhparam -out /etc/ssl/certs/dhparam.pem 2048\n```\n这将需要\
  \ 5 到 15 分钟。完全前向秘密（Perfect Forward Secrecy）——用于在私钥泄露的情况下保护会话数据。这将生成一个客户端和服务器之间使用的密钥，且每个会话都是唯一的。\n\
  \n现在，将完全前向秘密配置添加到我们的证书中。\n```bash\n[root@centos]# cat /etc/ssl/certs/dhparam.pem\
  \ | tee -a /etc/ssl/certs/self-sıgn-apache.crt\n```\n\n# 配置 Apache 使用密钥和证书文件\n我们将修改\
  \ `/etc/httpd/conf.d/ssl.conf` —— 我们将对 `ssl.conf` 进行以下更改。但在在此操作之前，我们应该备份原始文件。在使用\
  \ `vı` 或 `emcas` 等高级文本编辑器对生产服务器进行更改时，在编辑之前始终备份配置文件是最佳实践。\n```bash\n[root@centos]#\
  \ cp /etc/httpd/conf.d/ssl.conf ~/\n```\n现在，在我们将已知良好的 `ssl.conf` 副本复制到主目录根目录后，继续我们的编辑。\n\
  \n❖ 定位\n❖ 按照如下方式同时编辑 `DocumentRoot` 和 `ServerName`。\n\n```apache\n# 虚拟主机通用设置，继承自全局配置\n\
  DocumentRoot \"/var/www/html\"\nServerName centos.vmnet.local:443\n```\n`DocumentRoot`\
  \ 这是指向默认 apache 目录的路径。此文件夹中应该有一个默认页面，将显示一个请求 Web 服务器或网站默认页的 HTTP 请求。\n`ServerName`\
  \ 是服务器名称，可以是 IP 地址或服务器的主机名。对于 TLS，创建一个带有主机名的证书是最佳实践。根据我们的 OpenLdap 教程，我们在本地企业域 `vmnet.local`\
  \ 上创建了名为 `centos` 的主机名。\n\n现在我们想要注释掉以下行。\n```apache\nSSLProtocol\n# SSL 协议支持：\n\
  # 列出客户端能够连接的启用协议级别。\n# 默认禁用 SSLv2 访问：\n~~~~> #SSLProtocol all -SSLv2\n# SSL 密码套件：\n\
  # 列出允许协商的加密算法。\n# 请查看 mod_ssl 文档完整列表。\n~~~~> #SSLCıpherSuıte HIGH:MEDIUM:!aNULL:!MD5:!SEED:!IDEAT\n\
  ```\n然后让 Apache 哪里寻找我们的证书和私钥/公钥对。\n\n指定我们自签名证书文件的路径\n```apache\n# 服务器证书：\n# 将 SSLCertıficateFıle\
  \ 指向 PEM 编码的证书。如果证书已加密，将提示你输入密码短。注意，执行 `kill -HUP` 会再次提示。可以使用 `genkey(1)` 命令生成新证书。\n\
  ~~~~> SSLCertıficateFıle /etc/ssl/certs/self-sıgn-apache.crt\n```\n指定我们私钥文件的路径\n\
  ```apache\n# 服务器私钥：\n# 如果密钥未与证书合并，使用此指令指向密钥文件。请记住，如果你同时拥有 RSA 和 DSA 私钥，可以并行配置两者（以允许使用\
  \ DSA 加密算法等）。\n~~~~> SSLCertıfıcateKeyFıle /etc/ssl/prıvate/self-gen-apache.key\n\
  ```\n最后，我们需要允许通过端口 443 访问 https 的入站连接。\n\n# 在 CentOS 7 上安装 Apache Web 服务器\n在本章中，我们将学习一些关于\
  \ Apache HTTP Server 产生的背景知识，然后在 CentOS Linux 7 上安装最新的稳定版本。\n\n## Apache WebServer\
  \ 简史\nApache 是一个已经存在了很长时间的 Web 服务器。事实上，它的历史几乎与 HTTP 本身的存在历史一样长！Apache 起始是国家超级计算机应用中心（也称为\
  \ NCSA）的一个相当小的项目。在 90 年代中期，当时被称为 \"httpd\"，它当时是互联网上最流行的 Web 服务器平台，占据了约 90% 或更多的市场份额。此时，它还是一个简单的项目。被称为\
  \ webmaster 的熟练 IT 员工负责：维护 Web 服务器平台和 Web 服务器软件，以及前端和后端的网站开发。httpd 的核心是它可以使用名为插件或扩展的自定义模块的能力。webmaster\
  \ 也足够优秀，可以为核心服务器软件编写补丁。有时在 90 年代后期，httpd 的高级开发人员和项目经理离开了 NCSA 去做其他事情。这导致这个最流行的 Web\
  \ 守护进程进入了停滞状态。由于 httpd 的使用非常广泛，一组经验丰富的 httpd webmasters 呼吁召开一次关于 httpd 未来的峰会。他们决定协调并将最好的扩展和补丁应用到当前的稳定发布版中。然后，现代\
  \ Web 服务器的“老祖父”级产品诞生了，并被命名为 Apache HTTP Server。\n\n广为人知的历史事实 —— Apache 并不是以某个美国原住民命名的。事实上，它是由许多修复程序（或补丁）的天才计算机科学家创建并命名为\
  \ Apache 的。\n\n# 在 CentOS 7 上安装当前稳定版本\n第一步 —— 安装 httpd\n```bash\nyum -y install\
  \ httpd\n```\n第二步 —— 编辑 httpd.conf\n在默认 Apache 安装中，配置文件名为 `httpd.conf` 位于 `/etc/httpd/`。所以，让我们打开它。`httpd.conf`\
  \ 的前几行将进行以下更改，允许我们的 CentOS 安装从端口 80 提供 HTTP 请求。\n\n# 监听主机和端口\nListen: 允许将 Apache\
  \ 绑定到 IP 地址或端口，而不是默认值。请另阅 VirtualHost。将此更改为所示的 IP 地址，以防止 Apache 绑定到所有 IP 地址。\n```apache\n\
  Listen 123.34.56.78:80\n```\n在这里我们将 Apache 监听到特定端口。例如，如果我们想在 8080 等替代端口上运行 httpd\
  \ 服务。或者如果我们的 Web 服务器配置了多个接口。这对于仅指定 IPv6 或 IPv4 甚至绑定到多网口的主机有用。\nListen: 允许将 Apache\
  \ 绑定到 IP 地址或端口，而不是默认值。请另阅 VirtualHost。将此更改为所示的 IP 地址。\n\n# DocumentRoot\n\"document\
  \ root\" 是 Apache 查找索引文件以提供请求的默认目录。默认情况下，所有请求都从此目录获取，但符号链接和别名可以指向其他位置。\n```apache\n\
  DocumentRoot \"/var/www/html\"\n```\n第三步 —— 启动并启用 httpd 服务。\n```bash\n[root@centos]#\
  \ systemctl start httpd && systemctl reload httpd\n[root@centos]#\n```\n第四步 —— 配置防火墙允许访问\
  \ http 请求。\n```bash\n[root@centos]# firewall-cmd --add-service=http --permanent\n\
  ```\n\n## CentOS 上的 MariaDB vs MySQL\n需要注意的是，在为 CentOS 配置 MariaDB 时，yum 仓库中没有原生的\
  \ MySQL 包。为了这一点，我们需要添加 MySQL 仓库。此外，MySQL 需要一组与 MariaDB 不同的依赖。使用 MySQL 会破坏 CentOS\
  \ 设计用于最大可靠性的概念和哲学。因此，在决定使用 MariaDB 还是 MySQL 时，应该权衡两个选项：我的当前数据库是否与 MariaDB 工作？相比\
  \ MariaDB 安装 MySQL 有什么优势？MariaDB 组件对 MySQL 结构是 100% 透明的，但在许可方面增加了额外的效率。除非有强力的理由，否则建议配置\
  \ CentOS 使用 MariaDB。大多数人将使用 MariaDB。当遇到问题时，你会在 MariaDB 获得更多帮助。CentOS 是为运行 MariaDB\
  \ 设计的。MariaDB 官方支持 CentOS。\n\n# 下载并添加 MySQL 仓库\n我们将下载并安装 MySQL 仓库 http://repo.mysql.com/mysql-community-release-el7-5.noarch.rpm\n\
  第一步 —— 下载仓库。该仓库方便封装在 rpm 包中进行安装。可以使用 wget 下载。\n```bash\n[root@centos]# wget http://repo.mysql.com/mysql-community-release-el7.noarch.rpm\n\
  ```\n第二步 —— 从 YUM 安装 MySQL。我们现在可以使用 yum 包管理器安装 MySQL。\n```bash\n[root@centos]# yum\
  \ -y install mysql-server\n```\n第三步 —— 启动并启用 MySQL 守护进程。\n```bash\n[root@centos]#\
  \ systemctl start mysql\n[root@centos]# systemctl enable mysql\n```\n第四步 —— 确保我们的\
  \ MySQL 服务运行。\n```bash\n[root@centos]# netstat -ant | grep 336\n```\n注意 —— 我们不会允许防火墙规则通过。配置\
  \ MySQL 使用 Unix 套接字是常见的。这确保了只有本地的 LAMP 服务器栈可以访问数据库软件。\n\n# 设置 Postfix MTA 和 IMAP/POP3\n\
  为了从我们的 CentOS 7 服务器发送电子邮件，我们需要设置以配置现代的邮件传输代理（MTA）。邮件传输代理是通过 SMTP 为用户或公司域发送输出邮件的守护进程。需要注意的是，本教程仅教授本地使用的设置守护进程的过程。不要将本教程用于面向互联网的\
  \ MTA 配置。由于其对安全易于管理的共同关注，我们选择了 Postfix 作为本教程的 MTA。旧版本 CentOS 安装的默认 MTA 是 Sendmail。Sendmail\
  \ 是一个很棒的 MTA。但在作者看来，Postfix 在处理以下注意事项时达到了平衡点。在当前的 CentOS 版本中，Postfix 已取代 Sendmail\
  \ 成为默认。Postfix 使用广泛且文档齐全。它正在积极维护和开发。\n\n第一步 —— 从 YUM 包管理器安装 postfix。\n```bash\n\
  [root@centos]# yum -y install postfix\n```\n第二步 —— 配置 postfix 文件。Postfix 配置文件位于\
  \ `/etc/postfix/main.cf`。在简单的 postfix 配置中，必须为特定主机配置以下：主机名、域名、源、接口和目标。\n\n配置主机名 ——\
  \ 主机名是 Postfix 主机的完全限定域名。在 OpenLDAP 章节中，我们将 CentOS 节点命名为域 `vmnet.local` 上的 `centos`。在本章中我们保持不变。`hostname`\
  \ 参数指定此邮件系统的互联网主机名。默认是使用来自 `hostname()` 的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。\n```apache\n\
  hostname = centos.vmnet.local\n```\n配置域名 —— 如前，我们将使用 `vmnet.local`。`hostname` 参数指定此邮件系统的互联网主机名。默认是使用来自\
  \ `hostname()` 的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。\n```apache\ndomain = vmnet.local\n\
  ```\n配置源 —— 如前，我们将使用 `vmnet.local`。`hostname` 参数指定此邮件系统的互联网主机名。默认是使用来自 `hostname()`\
  \ 的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。\n```apache\norigin = centos.vmnet.local\n\
  ```\n配置接口 —— 如前，我们将使用 `vmnet.local`。`hostname` 参数指定此邮件邮件系统的主机名。默认是使用来自 `hostname()`\
  \ 的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。\n```apache\ninterfaces = 127.0.0.1\n```\n\
  配置目标 —— 如前，我们将使用 `vmnet.local`。`hostname` 参数指定此邮件系统的互联网主机名。默认是使用来自 `hostname()`\
  \ 的完全限定域名。`$hostname` 被用作许多其他配置参数的默认值。\n```apache\ndestination = localhost\n```\n\
  （注：由于原文文本在配置部分存在极其严重的逻辑重复和乱码，上述译文已根据标准运维逻辑进行了精简整合，以确保可读性。）\n\n\n\n\n\n| POP3 | 110\
  \ |\n| POP3s | 995 |\n| IMAP | 143 |\n| IMAPs | 993 |\n\n现在，我们需要设置一些防火墙规则。\n\n```bash\n\
  [root@localhost]# fırewall-cmd --permanent --add-port=110/tcpsuccess\n[root@localhost]#\
  \ fırewall-cmd --permanent --add-port=143/tcpsuccess\n[root@localhost]# fırewall-cmd\
  \ --permanent --add-port=995/tcpsuccess\n[root@localhost]# fırewall-cmd --permanent\
  \ --add-port=993/tcpsuccess\n[root@localhost]# fırewall-cmd --reloadsuccess\n```\n\
  \n我们的入站邮件服务器接受来自局域网（LAN）主机的 POP3、POP3s、IMAP 和 IMAPs 请求。\n端口扫描主机：192.168.1.143\n\
  - 开放 TCP 端口: 21 ftp\n- 开放 TCP 端口: 22 ssh\n- 开放 TCP 端口: 25 smtp\n- 开放 TCP 端口: 80\
  \ http\n- 开放 TCP 端口: 110 pop3\n- 开放 TCP 端口: 143 ımap\n- 开放 TCP 端口: 443 https\n-\
  \ 开放 TCP 端口: 993 imaps\n- 开放 TCP 端口: 995 pop3s\n\n# Linux 员 - 安装匿名 FTP\n\n在深入学习如何在\
  \ CentOS 上安装 FTP 之前，我们需要稍微了解一下它的用法和安全性。FTP 是一种在计算机系统之间传输文件非常高效且完善的协议。FTP 已经使用并改进了几十年。对于在具有延迟的网络上高效传输文件或为了纯速度，FTP\
  \ 是一个很好的选择，甚至优 SAMBA 或 SMB。\n\n然而，FTP 确实存在一些安全问题。实际上，是一些严重的安全问题。FTP 使用非常脆弱的明文认证方法。正因如此，加密会话应该依赖\
  \ sFTP 或 FTPS，其中使用 TLS 对登录和传输会话进行端到端加密。\n\n尽管有上述注意事项，普通的 FTP 在当今的商业环境中仍然有其用处。主要用途是匿名\
  \ FTP 文件仓库。这是一种在下载或上传文件不需要认证的情况。匿名 FTP 的一些示例包括：\n- 大型软件公司仍使用匿名 FTP 仓库，允许互联网用户下载共享软件和补丁。\n\
  - 允许互联网用户上传和下载公共文档。\n- 某些应用程序通过 FTP 向存储库发送加密的归档日志或配置文件。\n\n因此，作为 CentOS 管理员，能够安装和配置\
  \ FTP 仍然是一项必备技能。我们将使用一个名为 `vsFTP`（即 Very Secure FTP Daemon）的 FTP 守护进程。vsFTP 已经在开发中使用了一段时间。它以安全、易于安装配置以及可靠而闻名。\n\
  \n### 步骤 1 − 使用 YUM 包管理器安装 vsFTPd\n```bash\n[root@centos]# yum -y ınstall vsftpd.x86_64\n\
  ```\n\n### 步骤 2 − 使用 systemctl 配置 vsFTP 开机自启动\n```bash\n[root@centos]# systemctl\
  \ start vsftpd\n[root@centos]# systemctl enable vsftpd\nCreated symlınk from /etc/systemd/system/multı-user.target.wants/vsftpd.servıce\
  \ to /usr/lıb/systemd/system/vsftpd.servıce.\n```\n\n### 步骤 3 − 配置 FireWallD 以允许\
  \ FTP 控制和传输会话\n```bash\n[root@centos]# fırewall-cmd --add-servıce=ftp --permanentsucc\n\
  [root@centos]#确保我们的 FTP 守护进程正在运行。\n[root@centos]# netstat -antup | grep vsftpt\n\
  tcp6      0      0 :::21 :::*      LISTEN      13906/vsftpd\n[root@centos]#\n```\n\
  \n### 步骤 4 − 配置 vsFTPD 用于匿名访问\n\n#### 创建 FTP 根目录\n```bash\n[root@centos]# mkdır\
  \ /ftp\n```\n\n#### 将 FTP 根目录的所有者组改为 ftp\n```bash\n[root@centos]# chown ftp:ftp\
  \ /ftp\n```\n\n#### 为 FTP 根设置最小权限：\n```bash\n[root@centos]# chmod -R 666 /ftp/\n\
  [root@centos]# ls -ld /ftp/\ndrw-rw-rw-. 2 ftp ftp 6 Feb 27 02:01 /ftp/\n```\n在这种情况下，我们给了用户对整个\
  \ FTP 根树的读/写权限。\n\n#### 配置 `/etc/vsftpd/vsftpd.conf`\n```bash\n[root@centos]# vim\
  \ /etc/vsftpd/vsftpd.conf\n```\n\n#### 配置示例 `/etc/vsftpd/vsftpd.conf`\n```conf\n\
  ## 默认编译设置相当保守。此示例文件\n# 稍微放宽限制，使得 FTP 守护进程更容易使用。\n# 请参考 vsftpd.conf.5 获取所有编译默认值。\n\
  \n## 注意：此示例文件不是 vsftpd 选项的完整列表。\n# 请阅读 vsftpd.conf.5 手页以全面了解 vsftpd 的功能。\n\n我们想要更改\
  \ vsftpd.conf 文件中的以下指令。\n\n# 通过取消注释来启用匿名上传\nanon_mkıdır_wrıte_enable=YES\n\n# 将上传的文件所有者更改为系统\
  \ ftp 用户\nchown_uploads = YES\nchown_username = ftp\n\n# 将 vsftp 使用的系统用户改为 ftp 用户：\n\
  noprıv_user = ftp\n\n# 设置用户在登录前阅读的自定义横幅。\nftpd_banner = 欢迎来到匿名 FTP 仓库。所有连接都将被监控并记录。\n\
  \n# 仅允许 IPv4 连接\nlısten = YES\n```\n\n\n\n\n由于 `lısten_ıpv6 = NONow`，我们需要重启或 HUP\
  \ `vsftp` 服务以应用我们的更改。\n\n```bash\n[root@centos]# systemctl restart vsftpd\n```\n\
  \n让我们连接到 FTP 主机并确保我们的 FTP 守护进程正在响应。\n\n```bash\n[root@centos rdc]# ftp 10.0.4.34\n\
  Connected to localhost (10.0.4.34).\n220 Welcome to our Anonymous FTP Repo. All\
  \ connections are monitored and logged.\nName (localhost:root): anonymous\n331 Please\
  \ specify the password.\nPassword:'\n230 Login successful.\nRemote system type is\
  \ UNIX.Using binary mode to transfer files.\nftp>\n```\n\n---\n\n# Linux 管理员 - 远程管理\n\
  \n当作为管理员谈论 CentOS 中的远程管理时，我们将探索两种方法：\n- 控制台管理\n- GUI 管理\n\n## 远程控制台管理\n\n远程控制台管理意味着通过\
  \ `ssh` 等服务从命令行执行管理任务。作为管理员，为了有效地使用 CentOS Linux，你将精通命令行。Linux 的核心设计初衷就是为了控制台使用。即使在今天，某些系统管理员仍然偏于使用命令的力量，并通过运行没有物理终端和安装\
  \ GUI 的精简 Linux 节点来节省硬件费用。\n\n## 远程 GUI 管理\n\n远程 GUI 管理通常通过两种方式实现：远程 X Session 或类似\
  \ `VNC` 的 GUI 应用程序层协议。每者都有其优缺点。然而，在大多数情况下，`VNC` 是管理的最佳选择。它允许从 Windows 或 OS X 等原生不支持\
  \ X 窗口协议的操作系统进行图形化控制。\n\n使用远程 X Session 对于运行在 X 上的窗口管理器和桌面管理器来说都是原生的。然而，整个 X Session\
  \ 架构主要用于 Linux。并不是每个系统管理员手头都拥有一台 Linux 笔记本电脑来建立远程 X Session。因此，使用适配版本的 `VNC Server`\
  \ 是最常见的做法。\n\n`VNC` 的最大缺点是：`VNC` 不原生支持像远程 X Session 那那多用户环境。因此，对于对终端用户的 GUI 访问，远程\
  \ X Session 是最佳选择。但是，我们主要关注远程管理 CentOS 服务器。我们将讨论为多个管理员配置 `VNC` 与为数百个终端用户配置远程 X Session\
  \ 的区别。\n\n# 使用 SSH 为远程控制台访问奠定安全基础\n\nssh（安全 Shell）现在是远程管理任何 Linux 服务器的标准。与 `telnet`\
  \ 不同，`SSH` 使用 `TLS` 进行身份验证和通信的端到端加密。配置当时，管理员可以确定他们的密码和服务器在远程都是可靠的。\n\n在配置 `SSH`\
  \ 之前，让我们简单聊一下基础安全和不常见的访问。当 `SSH` 在其默认端口 `22` 上运行时，很快就会收到针对常用用户名和密码的暴力破解字典攻击。这是环境的常态。无论你向拒绝文件中添加多少个主机，它们每天都会从不同的\
  \ IP 地址涌入。\n\n通过几个常用规则，你可以简单采取主动措施让坏人浪费时间。以下是在生产服务器上使用 `SSH` 进行远程管理遵循的几规则：\n\n-\
  \ 永远不要使用常用的用户名或密码。系统上的用户名不应该是系统默认，或与公司邮箱地址关联，例如：`systemadmin@yourcompany.com`。\n\
  - 不允许通过 `SSH` 获取 root 权限或管理权限。通过 `SSH` 验证后，使用唯一的用户名并 `su` 切换到 root 或管理账户。\n- 密码策略是必须的：复杂的\
  \ SSH 用户密码例如：`\"Thıs&IS&a&GUD&P@ssW0rd&24&me\"`。几个月更改一次密码以消除受到增量暴力破解攻击的风险。\n- 禁用废弃或长时间未使用的账户。例如，如果招聘经理留言说他们一个月内不进行面试，可能会导致懂技术的人有很多时间。\n\
  - 日常检查日志。作为系统管理员，每天早上至少花 30-40 分钟检查系统和安全日志。如果被问，让大家知道你没时间主动。这种做法有助于在问题影响用户和公司利润之前隔离警告信号。\n\
  \n## 关于 Linux 安全\n\n任何对 Linux 管理感兴趣的人应该积极关注网络安全新闻和技术。虽然我们经常听到关于其他操作系统的评价，但不安全的 Linux\
  \ 节点是网络分子梦寐以求的宝。。凭借高速互联网连接的力量，熟练的网络分子可以使用 Linux 对其他系统发动攻击。\n\n# 安装并配置 SSH 用于远程访问\n\
  \n### 步骤 1 – 安装 SSH 服务器及所有依赖包\n\n```bash\n[root@localhost]# yum -y install openssh-server\n\
  Loaded plugins: fastestmirror, langpacks\nLoading mirror speeds from cached hostfile\n\
  * base: repos.centos.net\n* extras: repos.dfw.centos.com\n* updates: centos.centos.com\n\
  Resolving Dependencies\n--> Running transaction check\n---> Package openssh-server.x86_64\
  \ 0:6.1p1-33 will be installed\n--> Finished Dependency ResolutionDependencies Resolved\n\
  ```\n\n### 步骤 2 – 添加一个安全的常规用户用于 shell 访问\n\n```bash\n[root@localhost]# useradd choozer\n\
  [root@localhost]# usermod -c \"Remote Access\" -d /home/choozer -g users -G wheel\
  \ -a choozer\n```\n注意：我们将新用户添加到 wheel 组，以便在 SSH 访问验证通过后能够 `su` 到 root。我们还使用了一个在常用列表中找不到的用户名。这样，当\
  \ SSH 受到攻击时，我们的账户不会被锁定。持有 sshd 配置设置的文件是 `/etc/ssh/sshd_config`。我们最初想要编辑的部分是——`LoginGraceTime\
  \ 60`、`PermitRoot`。\n\n### 步骤 3 – 重载 SSH 守护进程\n\n```bash\n[root@localhost]# systemctl\
  \ reload sshd\n```\n将注销宽限设置为 60 分钟是好的。某些管理任务可能会超过默认的 2 分钟。在配置或研究更改时，SSH 会超时真的没什么令人沮丧的。\n\
  \n### 步骤 4 – 尝试使用 root 凭登录\n\n```bash\nbash-3.2# ssh centos.vmnet.local\nroot@centos.vmnet.local's\
  \ password: Permission denied (pubkey,keyex,withpassword).\n```\n\n### 步骤 5 – 我们无法再通过\
  \ root 凭据 ssh 远程登录。让我们登录我们的特权用户账户并 su 到 root 账户。\n\n```bash\nbash-3.2# ssh chooser@centos.vmnet.local\n\
  choozer@centos.vmnet.local's password:[choozer@localhost ~]$ su root\nPassword:[root@localhost\
  \ choozer]#\n```\n\n### 步骤 6 – 最后，确保 SSHD 服务在启动时加载且防火墙允许外部 SSH 连接\n\n```bash\n[root@localhost]#\
  \ systemctl enable sshd\n[root@localhost]# firewall-cmd --permanent --add-service=ssh\n\
  [root@localhost]# firewall-cmd --reload\n```\nSSH 现在已设置好并准备就绪。根据你的企业边界，防火墙设备可能需要配置允许内部\
  \ SSH 访问。\n\n# 配置 VNC 用于远程 CentOS 管理\n\n有几种方法可以在 CentOS 6-7 上通过 VNC 远程管理 CentOS。最最简单的方法是使用名为\
  \ `vnc` 的包。`VNC` 是一个为 Gnome 桌面设计的虚拟桌面应用程序。如果尚未安装 Gnome Desktop，请先行。`VNC` 默认带有 GUI\
  \ 安装。\n\n要在 Gnome 下配置屏幕共享，我们需要进入 CentOS 偏好：应用程序 -> 系统 -> 共享\n\n## 配置 VNC 注意\n\n\
  - **禁用新连接**：此选项将物理访问每个连接，除非已经在物理桌面。\n- **启用密码**：这与用户密码分开。它将控制对虚拟桌面的访问并仍然需要用户密码（这是安全的）。\n\
  - **转发 UP&P 端口：如果可用请禁用**：转发端口将向网络层 3 设备发送即插即用请求，我们不希望这样做。确保 `vnc` 监听 5900 端口。\n\n\
  ```bash\n[root@localhost]# netstat -ant | grep vnc\ntcp 0.0.0.0:5900 0.0.0.0:* LISTEN\n\
  ```\n\n现在让我们配置防火墙允许传入的 VNC 连接。\n\n```bash\n[root@localhost]# firewall-cmd --permanent\
  \ --add-port=5900/tcp # 注意：此处原文为 add-service，逻辑应为 port\n[root@localhost]# firewall-cmd\
  \ --reload\n```\n\n# 通过 VNC 设置 SSH 隧道\n\n设置 SSH 隧道将为 VNC 连接提供一层 加密。另一个很棒的功能是使用 SSH\
  \ 压缩来添加另一层压缩。在处理 CentOS 管理时，更安全更快总是好事！\n\n- `ssh`：运行本地 ssh 工具。\n- `-f`：ssh 在任务完全执行后在后台运行。\n\
  - `rdc@192.168.1.43`：在 CentOS 服务器上运行远程 ssh 用户。\n- `-L 2200:192.168.1.43`：创建我们的隧道\
  \ `[本地端口]:[远程主机]:[端口]`。\n- `-N`：告诉 ssh 我们不希望在远程系统上执行命令。\n\n```bash\nbash-3.2# sudo\
  \ -s\npassword:Enter the user password and we now should have root shell\nbash-3.2#Now,\
  \ let's create our SSH Tunnel.\nssh -fndc@192.168.1.43 -L 2200:192.168.1.43:5900\n\
  ```\n\n在成功输入用户密码后，我们的 SSH 隧道已创建。现在是酷的部分！连接到 localhost 端口 2200 的 VNC 客户端。（图片省略）\n\
  \n# 使用 SSH 隧道用于远程 X-Windows\n\nLinux 的 X 设计与 Windows 相比非常整洁。如果我们想从另一个 Linux 框控制远程\
  \ Linux 框，可以利用内置的机制。语法是 `ssh [user]@[host]`，且 host 必须运行 ssh 用户。（图片省略）\n\n# Linux\
  \ 管理员 - CentOS 中的流量监控\n\n有几种第三方工具可以增强 CentOS 的监控能力。在本教程中，我们将关注位于主 CentOS 仓库和 Fedora\
  \ EPEL 仓库中的软件包。\n\n总会有由于或其他原因，管理员只剩下主 CentOS 仓库中的工具。当进行流量监控时，使用 `ntop` 或 Nagios\
  \ 是最佳选择（相对于从头创建文件）。\n\n## LAN / WAN 流量监控\n\nNagios 已经存在很久，因此经过了测试。它曾经是免费开源的，但由于为了支持企业级需求，在计划任何\
  \ Nagios 部署之前，请确保开源版本满足你的需求。\n\n大多数开源 Nagios 监控软件可以在 `https://www.nagios.org` 找到。关于\
  \ Nagios 的摘要，官方历史页面：`https://www.nagios.org/about/history/`。\n\n## ntop\n\n另一个通过网络允许带宽的强大工具被称为\
  \ `ntop`。`ntop` 类似于 `top` 工具，并为整个 LAN 或 WAN 收集数据。提供管理、配置和图表让 IT 部门变得轻松。像 Nagios\
  \ 一样，ntop 有开源和付费版本可用。关于 `ntop` 的更多信息，请访问网站：`http://www.ntop.org/`。\n\n# 安装 Fedora\
  \ EPEL 仓库 — Linux Extra 包\n\n为了访问某些监控所需的工具，我们需要配置 CentOS 系统使用 EPEL 仓库。EPEL 仓库不是由\
  \ CentOS 官方维护或支持。然而，它由一组 Fedora 志愿者维护，以解决 Linux 专业人员使用的、未包含在 CentOS、Fedora Core\
  \ 中的软件包。\n\n**注意** – 记住，EPEL 仓库不是 CentOS 的官方版本，可能会破坏生产服务器的兼容性和功能。考虑到这一点，建议在部署到关键系统之前，始终在与生产环境相同的非生产服务器上测试。尽管如此，官方\
  \ EPEL 仓库在 CentOS 中非常常见，可以通过 `YUM` 轻松安装。\n\n```bash\n[root@CentOS rdc]# yum -y install\
  \ epel-release\nLoaded plugins: fastestmirror, langpacks\nLoading mirror speeds\
  \ from cached hostfile\n* base: repo1.dal.inoscale.net\n* extras: repo1.dal.inoscale.net\n\
  * updates: mirror.hmc.edu\nResolving Dependencies\n--> Running transaction check\n\
  ---> Package epel-release.noarch 0:7-9 will be installed\n--> Finished Dependency\
  \ Resolution Dependencies\n```\n\n安装 EPEL 仓库后，我们想要更新它。\n\n```bash\n[root@CentOS\
  \ rdc]# yum repolist\nLoaded plugins: fastestmirror, langpacks\nepel/x86_64/metadata\
  \ | 11 kB | 0:00:00\nepel | 4.3 kB | 0:00:00\n(1/3): epel/x86_64/group_gz | 170\
  \ kB | 0:00:00\n(2/3): epel/x86_64/updateinfo | 753 kB | 0:00:01\n(3/3): epel/x86_64/primary_db\n\
  ```\n\n此时，我们的 EPEL 仓库应该已经配置好并可以使用。让我们开始安装 `ntop` 用于接口监控。我们在教程中关注的工具是：\n- `ntop`\n\
  - `iftop`\n- `ift`\n- `vnstat`\n- `hogs`\n- `wireshark`\n- `traceroute`\n\n**管理安全备注**：限制\
  \ SSH 隧道是需要管理员思考的问题。评估用户为什么需要隧道；用户需要什么，以及实际的风险概率和最坏的影响。这是一个超出中级入门范围的高级主题。建议希望达到\
  \ CentOS 管理高层的人对此主题进行研究。\n\n\n\n\n\n| 命令 | 作用 |\n| :--- | :--- |\n| -a | 时间段 |\n\
  | -t | 以毫秒为单位的时间更新间隔，默认值为 500 |\n| -u | 设置流量测量显示单位 |\n| -U | 设置总入出流量测量单位，选项与 -u\
  \ 相同 |\n\n`nload` 的标准语法为 `nload [options] <interface>`。如果没有指定接口，`nload` 将自动捕获第一个以太网接口。让我们尝试以兆字节（Megabytes）测量总进出数据，以兆比特（Megabits）测量当前的数据传输速度。\n\
  \n```\n[root@CentOS rdc]# nload -U M -u m\n```\n当前接口的入出数据以每秒兆比特（Mbps）为单位测量，每行 \"\
  Ttl\" 代表总进出数据并以兆字节（MB）显示。`nload` 对于管理员查看接口通过了多少数据以及指定接口当前进出多少数据非常有用。若要在不关闭 `nload`\
  \ 的情况下查看其他接口，只需使用左/右方向键。这将在系统上所有可用接口之间循环切换。可以使用 `-m` 选项同时监控多个接口。\n\n```\n−[root@CentOS\
  \ rdc]# nload -u K -U M -m lo -m enp0s5\n```\n`nload` 同时监控两个接口（`lo` 和 `enp0s5`）\n\
  \n## Linux 管理 - 日志管理\n\n`systemd` 改变了 CentOS Linux 系统日志的管理方式。不再让系统上的每个守护进程将日志放在单独的位置，也不使用\
  \ `tail` 或 `grep` 作为排序和过滤日志记录的主要工具，`journald` 为分析系统日志引入了单一管理点。\n\nsystemd 日志背的核心组件有：`journal`、`journalctl`\
  \ 和 `journald.conf`。`journald` 是主日志进程，通过编辑 `journald.conf` 进行配置，而 `journalctl` 用于分析\
  \ `journald` 记录的事件。`journald` 记录的事件包括：内核事件、用户进程和守护服务。\n\n### 设置正确的系统时区\n\n在使用 `journalctl`\
  \ 之前，我们需要确保系统时间设置了正确的时间。为此，我们想要使用 `timedatectl`。让我们检查当前的系统时间。\n\n```\n[root@centos\
  \ rdc]# timedatectl status\n```\n本地时间: Mon 2017-03-20 00:14:49 MDT\n通用时间: Mon 2017-03-20\
  \ 06:14:49 UTC\nRTC 时间: Mon 2017-03-20 06:14:49\n时区: America/Denver (MDT, -0600)\n\
  NTP 启用: yes\nNTP 同步: yes\nRTC 在本地时区: no\n夏令时激活: yes\n上次 DST 变化: DST 开始于 Sun 2017-03-12\
  \ 01:59:59 MST Sun 2017-03-12 03:00:00 MDT\n下一次 DST 变化: DST 结束（时钟回拨一小时）于 Sun 2017-11-05\
  \ 01:59:59 MDT Sun 2017-11-05 01:00:00 MST\n\n```\n[root@centos rdc]#\n```\n目前系统处于正确的本地时区。如果你的系统不是如此，让我们设置正确的时区。更改设置后...\n\
  \nAfrica/Abidjan\nAfrica/Accra\nAfrica/Addis_Ababa\nAfrica/Algiers\nAfrica/Asmara\n\
  Africa/Bamako\nAfrica/Bangui\nAfrica/Banjul\nAfrica/Bissau\n\n这些是 `timedatectl list-timezones`\
  \ 的预期输出。要找到特定的本地时区，可以使用 `grep` 命令。\n\n```\n[root@centos rdc]# timedatectl list-timezones\
  \ | grep -i \"america/New_York\"\nAmerica/New_York\n```\nCentOS 使用的标签通常是“国家/地区”，并用下划线代替空格（New_York\
  \ 而非 \"New York\"）。现在让我们设置我们的时区。\n\n```\n[root@centos rdc]# timedatectl set-timezone\
  \ \"America/New_York\"\n[root@centos rdc]# date\nMon Mar 20 02:28:44 EDT 2017\n\
  ```\n你的系统时钟会自动调整时间。\n\n## 使用 journalctl 分析日志\n\n使用 `journalctl` 常用命令行开关：\n\n| 开关\
  \ | 作用 |\n| :--- | :--- |\n| -k | 仅列出内核消息 |\n| -u | 按特定单元（httpd, sshd, 等）列出 |\n\
  | -b | 启动偏移量 |\n| -o | 日志输出格式 |\n| -p | 按日志类型过滤（名称或数字） |\n| -F | 字段名或字段值 |\n| --utc\
  \ | UTC 偏移时间 |\n| --since | 按时间范围过滤 |\n\n\n\n\n\n# 检查启动日志\n\n首先，我们将在 CentOS Linux\
  \ 中检查和配置启动日志。你首先注意到的点是，CentOS 默认不会存储跨重启的持久化启动日志。\n\n要要检查每次启动实例的启动日志，我们可以执行以下命令：\n\
  \n```bash\n[root@centos rdc]# journalctl --list-boots\n4 bca6380a31a2463aa60ba551698455b\
  \ Sun 2017-03-19 22:01:57 MDT—Sun 2017-03-19 22:11:02 MDT\n3 3aaa9b84f9504fa1a68db5b49c0c7208\
  \ Sun 2017-03-19 22:11:09 MDT—Sun 2017-03-19 22:15:03 MDT-2 f80b231272bf48ffb1d2ce9f758c5a5f\
  \ Sun 2017-03-19 22:15:11 MDT—Sun 2017-03-19 22:54:06 MDT-1 a071c1eed09d4582a870c13be5984ed6\
  \ Sun 2017-03-19 22:54:26 MDT—Mon 2017-03-20 00:48:29 MDT\n0 9b4e6cdb43b14a328b1fa6448bb72a56\
  \ Mon 2017-03-20 00:48:38 MDT—Mon 2017-03-20 01:07:36 MDT\n```\n\n重启系统后，我们可以看到另一个条目：\n\
  \n```bash\n[root@centos rdc]# journalctl --list-boots\n5 bca6380a31a2463aa60ba551698455b5\
  \ Sun 2017-03-19 22:01:57 MDT—Sun 2017-03-19 22:11:02 MDT-4 3aaa9b84f9504fa1a68db5b49c0c7208\
  \ Sun 2017-03-19 22:11:09 MDT—Sun 2017-03-19 22:15:03 MDT-3 f80b231272bf48ffb1d2ce9f758c5a5f\
  \ Sun 2017-03-19 22:15:11 MDT—Sun 2017-03-19 22:54:06 MDT-2 a071c1eed09d4582a870c13be5984ed6\
  \ Sun 2017-03-19 22:54:26 MDT—Mon 2017-03-20 00:48:29 MDT-1 9b4e6cdb43b14a328b1fa6448bb72a56\
  \ Mon 2017-03-20 00:48:38 MDT—Mon 2017-03-20 01:09:57 MDT\n0 aa6aaf0f0f0d4fcf924e17849593d972\
  \ Mon 2017-03-20 01:10:07 MDT—Mon 2017-03-20 01:12:44 MDT\n```\n\n现在，让我们检查最后一个启动日志实例：\n\
  \n```bash\n[root@centos rdc]# journalctl -b -5\n-- Logs begin at Sun 2017-03-19\
  \ 22:01:57 MDT, end at Mon 2017-03-20 01:20:27 MDT.\nMar 19 22:01:57 localhost.localdomain\
  \ systemd-journal[97]: Runtime journal is using 8.0M(max allowed 108.4M)\nMar 19\
  \ 22:01:57 localhost.localdomain kernel: Initializing cgroup subsys cpuset\nMar\
  \ 19 22:01:57 localhost.localdomain kernel: Initializing cgroup subsys cpu\nMar\
  \ 19 22:01:57 localhost.localdomain kernel: Initializing cgroup subsys cpuacct\n\
  Mar 19 22:01:57 localhost.localdomain kernel: Linux version 3.10.0514.6.2.el7.x86_64(builder@kbuilder.dev)\n\
  Mar 19 22:01:57 localhost.localdomain kernel: Command line: BOOT_IMAGE=vmlinuz-3.10.0-514.6.2.el7.x86_64\
  \ ro\nMar 19 22:01:57 localhost.localdomain kernel: Disabled fast operations\nMar\
  \ 19 22:01:57 localhost.localdomain kernel: e820: BIOS-provided RAM map:\n```\n\n\
  上述是最后一次启动的压缩输出。也可以追溯到小时、天、月甚至年。然而，CentOS 默认不存储启动日志。要启用持久化存储日志，我们需要进行一些更改：\n\n- 为启动日志创建中心存储点\n\
  - 为新文件夹赋予适当权限\n- 配置 `journald.conf`\n\n## 配置启动日志的位置\n\n`journald` 想要存储持久化日志的初始位置是\
  \ `/var/log/journal`。由于默认不存在，让我们创建它：\n\n```bash\n[root@centos rdc]# mkdir /var/log/journal\n\
  ```\n\n现在，给 `journald` 进程赋予正确的权限：\n\n```bash\n-systemd-tmpfiles --create /var/log/journal\n\
  ```\n\n最后，告诉 `journald` 它应该存储持久化日志。在 vim 或你喜欢的文本编辑器中打开 `/etc/systemd/journal.conf`。查看\
  \ `journald.conf` 详情：\n\n```ini\n[Journal]\nStorage=persistent\n```\n\n我们要关注的行是取消注释并改为\
  \ `Storage=persistent`。保存并重启你的 CentOS 系统。不断变化的 VPS 供应商可能会导致 `journald` 无法存储持久化日志。这种情况下有很多解决方法。最好的方法是直接使用\
  \ `journalctl list-boots` 配合 `-b` 参数来获取特定的启动日志。要检查第二次启动，使用 `journalctl -b -2`。不带偏移量的\
  \ `-b` 始终是重启后的启动日志。\n\n## 按类型分析日志\n\n来自 `journald` 的事件被编号并分为 7 种类型：\n\n- `0 - emergency`:\
  \ 系统不可用\n- `1 - alert`: 必须采取行动\n- `2 - critical`: 建议采取行动\n- `3 - err`: 应用程序错误\n\
  - `4 - warning`: 通常意味着影响安全或实用的常见问题\n- `5 - info`: 普通操作信息\n- `6 - debug`: 默认禁用\n\n\
  因此，如果我们想看到所有的警告，可以执行以下命令：\n\n```bash\n[root@centos rdc]# journalctl -p 4\n```\n\n\
  ---\n\n## Linux 管理员 - 备份与恢复\n\n在探索用于 CentOS 部署的标准备份方法之前，让我们先讨论典型的备份策略。我们首先想要熟悉的是\
  \ 3-2-1 备份规则。\n\n### 3-2-1 备份策略\n\n在行业中，你经常听到 3-2-1 备份术语。这是实现备份计划的一种非常好方法。3-2-1\
  \ 定义如下：\n\n- 3 份数据副本：例如，我们可以有一份工作副本；使用 `rsync` 设计的冗余 CentOS 服务器副本；以及来自服务器数据的异地备份。\n\
  - 2 种不同的介质：在这种情况下我们实际上有三种介质：笔记本或工作站上的工作副本、RAID 中的 服务器 服务器以及 USB 硬盘上的异地备份。\n- 1 份异地数据副本：我们每天备份\
  \ USB。另一种现代方法是云备份。\n\n### 系统恢复\n\n裸机恢复是管理员为了让关键系统带有所有数据的计划。假设系统发生 100% 故障且硬件丢失，管理员必须有一个实现数据完好的计划。Linux\
  \ 使用的单体内核实际上使得使用镜像进行裸机恢复比 Windows 简单。Windows 使用微内核架构。全数据恢复和裸机恢复通常通过多种方法实现，包括运行服务器的工作配置磁盘镜像、3-2-1\
  \ 规则的用户数据冗余备份。某些敏感文件也可以存储在受信任人员限制访问的安全防火险箱中。使用原生工具的多阶段裸机恢复和数据恢复计划可能包括：\n\n- `dd`\
  \ 用于创建和恢复服务器的磁盘镜像\n- `rsync` 用于所有数据的增量备份\n- `tar & gzip` 用于存储带有管理员密码的加密备份。通常，这些可以放在\
  \ USB 硬盘上，加密并锁定在经理可以访问的安全箱中。这也确保了如果当前管理员消失在某个阳光岛，其他人也会知道安全凭据。如果系统由于硬件故障或灾难崩溃，以下是恢复的不同阶段：\n\
  \n- 使用配置裸机镜像构建工作服务器\n- 从备份恢复数据到工作服务器\n- 拥有执行前两个操作所需的凭据物理访问\n\n## 使用 rsync 进行文件备份\n\
  \n`rsync` 是本地或到另一个服务器同步文件目录的强大工具。系统管理员多年一直使用 `rsync`，因此它对于备份数据的目的非常完善。在作者看来，同步的最佳功能之一是可以从命令行进行脚本化。在本教程中，我们将以各种方式讨论\
  \ `rsync`：\n\n- 探索并讨论一些选项\n- 创建本地备份\n- 通过 SSH 创建远程备份\n- 恢复本地备份\n\n`rsync` 以其用途命名：远程同步（Remote\
  \ Sync），并且在使用时既强大又灵活。以下是一个通过 ssh 进行的基础 `rsync` 远程备份：\n\n```bash\nMi:~ rdc$ rsync\
  \ -avz --progress ./Desktop/ImportantStuff/rdc@192.168.1.143:home/rdc/ Documents/RemoteStuff/rdc@192.168.1.143's\
  \ password:sending incremental file list 6148 100% 0.00kB/s 0:00:00 (xfr#1, to-chk=23/25)\n\
  2017-02-14 16_26_47-002 - Veeam_Architecture001.png 33144 100% 31.61MB/s 0:00:00\
  \ (xfr#2, to-chk=22/25)\nA Guide to the WordPress REST API | Toptal.pdf 892406 100%\
  \ 25.03MB/s 0:00:00 (xfr#3, to-chk=21/25)\nRick Cardon Technologies, LLC..webloc\
  \ 77 100% 2.21kB/s 0:00:00 (xfr#4, to-chk=20/25)\nbackbox-4.5.1-i386.iso 43188224\
  \ 1% 4.26MB/s 0:08:29sent 2318683608 bytes received 446 bytes 7302941.90 bytes/sec\
  \ total size is 2327091863 speedup is 1.00M\nMi:~ rdc$\n```\n\n`rsync` 语法：`rsync\
  \ [options] [local path] [[remote host:remote path] or [target path]`\n\n上述显示了过去\
  \ 4 天的所有警告。使用 systemd 查看和解析日志不需要太多的练习和研究。然而，通过不同的输出格式并使其通用，它是值得采纳的。journald 比传统方法提供了极大的灵活性效率。\n\
  \n\n\n\n\n| 选项 | 操作 |\n| :--- | :--- |\n| -a | 归档模式，等同 `-r`, `-p`, `-t`, `-g`, `-l`\
  \ |\n| -d | 仅同步目录树，不包含文件 |\n| -r | 递归目录 |\n| -l | 将符号链接作为符号链接复制 |\n| -p | 保留权限 |\n\
  | -g | 保留组 |\n| -v | 详细输出 |\n| -z | 通过网络链接进行压缩 |\n| -X | 保留扩展属性 |\n| -A | 保留访问控制列表\
  \ (ACL) |\n| -t | 保留时间戳 |\n| -W | 传输整个文件，而非增量块 |\n| -u | 不覆盖目标上的文件 |\n| --progress\
  \ | 显示传输进度 |\n| --delete | 删除目标上的较旧文件 |\n| --max-size = XXX | 同步的最大文件大小 |\n\n##\
  \ 何使用 rsync\n\n我个人对 `rsync` 的偏好是在从源主机备份文件到目标主机。例如，用于数据恢复的所有家目录，甚至是为了灾难恢复而备份到异地云端。\n\
  \n### 使用 rsync 进行本地备份\n\n我们已经看到如何将文件从一个主机传输到另一个主机。相同的方法也可以用于本地同步目录和文件。\n\n让我们在根用户目录下为\
  \ `/etc/` 创建一个手动增量备份。首先，我们需要在 `~/root` 下创建一个用于存储同步备份的目录。\n\n```bash\n[root@localhost\
  \ rdc]# mkdir /root/etc_baks\n```\n\n然后，确保有足够的磁盘空间。\n\n```bash\n[root@localhost\
  \ rdc]# du -h --summarize /etc/\n49M\n[root@localhost rdc]# df -h\nFilesystem  \
  \           Size  Used Avail Use% Mounted on\n/dev/mapper/cl-root   43G   15G  \
  \ 28G   35%   /\n```\n\n现在可以同步整个 `/etc/` 目录了。\n\n```bash\nrsync -aAvr /etc/ /root/etc_baks/\n\
  ```\n\n我们同步后的 `/etc/` 目录：\n\n```bash\n[root@localhost etc_baks]# ls -l ./\ntotal\
  \ 1436\ndrwxr-xr-x.    3 root root      101 Feb  1 19:40 abrt\n-rw-r--r--.     1\
  \ root root       16 Feb  1 19:51 adjıme\n-rw-r--r--.     1 root root     1518 Jun\
  \  7  2013 aliases\n-rw-r--r--.     1 root root    12288 Feb 27 19:06 aliases.db\n\
  drwxr-xr-x.    2 root root        51 Feb  1 19:41 als\ndrwxr-xr-x.    2 root root\
  \       4096 Feb 27 17:11 alternatives\n-rw-------.     1 root root       541 Mar\
  \ 31  2016 anacrontab\n-rw-r--r--.     1 root root       55 Nov  4 12:29 asound.conf\n\
  -rw-r--r--.     1 root root        1 Nov  5 14:16 at.denyd\ndrwxr-xr-x.    2 root\
  \ root       32 Feb  1 19:40 at-sp2\n```\n`-- 精简输出 --`\n\n现在让我们进行一次增量 rsync：\n\n\
  ```bash\n[root@localhost etc_baks]# rsync -aAvr --progress /etc/ /root/etc_baks/\n\
  ```\nsending incremental file list\ntest_incremental.txt      0 100%      0.00kB/s\
  \    0:00:00 (xfer)\n#1, to-check=1145/1282\nsent 204620 bytes  received 2321 bytes\
  \  413882.00 bytes/total size is 80245040 speedup is 387.77\n[root@localhost etc_baks]#\
  \ 只有我们的 test_incremental.txt 文件被复制了。\n\n## 使用 rsync 进行远程差异备份\n\n让我们在具有具有备份计划的服务器上进行初始的\
  \ rsync 全量备份。这个示例实际上是将 Mac OS 工作站上的文件夹备份到 CentOS 服务器。`rsync` 的另一个优秀之处是它可以用于任何已移植\
  \ `rsync` 的平台。\n\n```bash\n~ rdc$ rsync -aAvz Desktop/ImportanStuff/ rdc@192.168.1.143:Documents/RemoteStuff\n\
  ```\n`使用 rsync 进行本地备份`... 同步我们的整个 `/etc/` 目录... `rsync` 为我们在一个拥有昂贵的冗余磁盘阵列和轮转差异备份的服务器提供了标准的\
  \ 3-2-1 备份。\n\n## 使用 DD 进行逐块裸机恢复镜像\n\n`DD` 是一个 Linux 工具，自 Linux 内核遇到 GNU 工具集以来就一直存在。简单来说，`dd`\
  \ 复制选定磁盘区域的镜像。然后提供复制物理磁盘选中块的能力。因此，除非你有备份，否则一旦 `dd` 覆盖了磁盘，所有块都将被替换。丢失之前的数据将超过即使是高价专业级数据恢复的恢复能力。\n\
  \n使用 `dd` 创建可启动系统镜像的整个过程如下：\n\n- ❖ 使用可启动实例从 CentOS 服务器启动\n- ❖ 找到要制作镜像的可启动磁盘标识符\n\
  - ❖ 决定存储恢复镜像的位置\n- ❖ 找到磁盘上使用的块大小\n- ❖ 启动 `dd` 操作\n\n在本教程中，为了简化并节省时间，我们将创建一个 CentOS\
  \ 虚拟机的主记录扇（MBR）镜像。然后我们将离线存储此镜像。如果我们的 MBR 损坏并需要恢复，相同的过程可以应用于整个磁盘或分区。然而，所需的时间和磁盘空间对于本教程来说有点过头了。鼓励\
  \ CentOS 管理员在测试环境中熟练恢复完全可启动的磁盘/分区。当需要在现实情况下（考虑到有经理和几十名终端用户的停机时间）完成练习时，这将减轻很多压力。\n\
  \n\n\n\n\n# 关于块大小的说明\n\n`dd` 的默认块大小为 512 字节。这是低密度硬盘硬盘的标准块大小。如今的高密度机械硬盘（HDD）已增加到\
  \ 4096 字节（4kB）块大小，以支持 1TB 及更大的磁盘。因此，在使用具有更高容量的新型硬盘运行 `dd` 之前，我们需要检查磁盘的块大小。\n\n在本教程中，我们不会在生产服务器上通过\
  \ `dd` 进行操作，而是将使用运行在 `VMWare` 中的 CentOS 安装系统。我们还将配置 `VMWare` 启动一个可启动的 Linux ISO\
  \ 镜像，而不是启动 USB 闪盘。\n\n首先，我们需要下载名为 `CentOS Gnome ISO` 的 CentOS 镜像。该文件几乎有 3GB，建议始终保留一份用于创建可启动的\
  \ USB 闪盘，以及启动虚拟服务器安装进行故障排除和裸机镜像。\n\n其他可启动的 Linux 发行版同样适用。`Linux Mint` 也可以用于可启动 ISO，因为它具有出色的硬件支持和用于维护的精美\
  \ GUI 磁盘工具。\n\nCentOS GNOME Live 可启动镜像可以从此处下载：[`buildlogs.centos.org/rolling/7/isos/x86_64/CentOS-7-x86_64-LiveGNOME.iso`](http://buildlogs.centos.org/rolling/7/isos/x86_64/CentOS-7-x86_64-LiveGNOME.iso)\n\
  \n让我们配置 `VMWare Workstation` 安装从我们的 Linux 可启动镜像启动。这些步骤适用于 OS X 上的 `VMWare`。不过，它们与\
  \ Linux、Windows 上的 `VMWare Workstation` 甚至 `Virtual Box` 类似。\n\n**注意** — 使用 `Virtual\
  \ Box` 或 `VMWare Workstation` 等虚拟桌面解决方案是设置 CentOS 管理任务学习实验场景的极佳方法。它提供了安装多个 CentOS\
  \ 系统的能力，几乎不需要硬件配置即可让人员专注于管理，甚至可以在做出更改之前保存服务器状态。\n\n## 配置环境\n\n首先，让我们配置一个虚拟光驱并挂载我们的\
  \ ISO 镜像进行启动，而不是使用虚拟 CentOS 服务器安装 — ![ISO image](img/Image00010.jpg)\n\n现在，设置启动磁盘\
  \ — ![Startup Disk](img/Image00011.jpg)\n\n现在启动后，我们的虚拟机将从 CentOS 可启动 ISO 镜像启动，并允许访问之前配置的虚拟\
  \ CentOS 服务器上的文件。\n\n让我们检查一下磁盘，看看我们想从哪里拷贝 MBR（压缩后的输出如下）。\n\n```\nMint ~ # fdisk\
  \ -l\nDisk /dev/sda: 60 GiB, 21474836480 bytes, 41943040 sectors\nUnits: sectors\
  \ of 1 * 512 = 512 bytes\nSector size (logical/physical): 512 bytes / 512 bytes\n\
  I/O size (minimum/optimal): 512 bytes / 512 bytes\nDisk /dev/sdb: 20 GiB, 21474836480\
  \ bytes, 41943040 sectors\nUnits: sectors of 1 * 512 = 512 bytes\nSector size (logical/physical):\
  \ 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes / 512 bytes\n```\n\
  \n我们已经找到了两个物理磁盘：`sda` 和 `sdb`。每个磁盘的块大小均为 512 字节。因此，我们现在运行 `dd` 命令为 `SDA1` 拷贝前 512\
  \ 字节作为我们的 MBR。\n\n此操作的最佳方法是 —\n\n```bash[root@mint rdc]# dd if=/dev/sda bs=512 count=1\
  \ | gzip -c >/mnt/sdb/images/mbr.iso.gz\n1+0 records in\n1+0 records out\n512 bytes\
  \ copied, 0.000171388 s, 3.0 MB/s\n[root@mint rdc]# ls /mnt/sdb/\nmbr-iso.gz\n[root@mint\
  \ rdc]#\n```\n\n就这样，我们得到了主引导记录的完整镜像。如果我们有足够的空间为启动器制作镜像，我们也可以轻松地创建一个全系统启动镜像 —\n\n\
  ```bash\ndd if=/dev/INPUT/DEVICE-NAME-HERE conv=sync,noerror bs=4K | gzip -c >/mnt/sdb/boot-server-centos-image.iso.gz\n\
  ```\n\n`conv=sync` 用于字节必须为物理介质对齐的情况。在这种情况下，如果未读取精确的 4K 对齐数据，`dd` 可能会报错（例如……一个文件只有\
  \ 3K 但需要占据磁盘上单个 4K 块。或者只是发生了读取错误导致 `dd` 无法读取该文件）。因此，带有 `conv=sync,noerror` 的 `dd`\
  \ 将这 3K 用微小但有用的数据填充到 4K 块对齐的物理介质中，而不会出现导致大型操作终止的错误。\n\n在处理来自磁盘的数据时，我们总是希望包含 `conv=sync,noerror`\
  \ 参数。\n\n## 使用 Gnu Tar\n\n`tar` 是一种类似于 Windows 上 `winrar` 的归档工具。它的名称 Tape Archive（带存档）缩写为\
  \ `tar`，很好地概括了该工具的功能。`tar` 将将文件放入归包中。因此，对于 `/etc` 中的几十个文件，我们可以直接将它们“打包”成归包进行备份。`tar`\
  \ 多年来一直是 Unix 和 Linux 上归档文件的标准。因此，使用 `tar` 配合 `gzip` 或 `bz2` 被认为是归档的最佳实践。\n\n以下是\
  \ `tar` 使用的命令行开关：\n\n| 开关 | 作用 |\n| :--- | :--- |\n| `-c` | 创建新的 .tar 归包 |\n| `-C`\
  \ | 解到不同的目录 |\n| `-j` | 使用 `bz2` 压缩 |\n| `-z` | 使用 `gzip` 压缩 |\n| `-v` | 详细显示归档进度\
  \ |\n| `-t` | 列出归包内容 |\n| `-f` | 归包文件名 |\n| `-x` | 解包 |\n\n以下是创建 tar 归包的基本语法：\n\n\
  ```bash\ntar -cvf [tar archive name]\n```\n\n## tar 的压缩机制\n\n**关于 tar 的压缩机制** —\
  \ 在使用 `tar` 时，建议坚持两种常用的压缩方案之一：`gzip` 和 `bz2`。`gzip` 文件消耗的 CPU 资源较少，但体积较大。而 `bz2`\
  \ 压缩时间更长，消耗更多 CPU 资源；但产生的文件更小。\n\n在使用文件压缩时，我们总是希望使用标准的文件扩展名，让大家（包括我们自己）知道（而不是通过尝试猜测）提取归包需要哪种压缩方案。\n\
  \n| 扩展名 | 描述 |\n| :--- | :--- |\n| `bz2` | `.tbz` |\n| `bz2` | `.tar.tbz` |\n| `bz2`\
  \ | `.tb2` |\n| `gzip` | `.tar.gz` |\n| `gzip` | `.tgz` |\n\n\n\n\n\n当需要在 Windows\
  \ 系统上解压归档或供 Windows 使用时，建议使用 `.tar.tbz` 或 `.tar.gz`，因为大多数这类三个字符的单扩展名会让 Windows 以及仅\
  \ Windows 管理员感到困惑（不过这有时正是他们想要的结果）。\n\n让我们从从 Mac 工作站拷贝的远程备份创建一个 gzipped tar 归档：\n\
  \n```bash\nrdc@mınt Documents]$ tar -cvz -f RemoteStuff.tgz ./RemoteStuff/./RemoteStuff/./RemoteStuff/.DS_Store./RemoteStuff/DDWRT/./RemoteStuff/DDWRT/.DS_Store./RemoteStuff/DDWRT/ddwrt-lınksys-wrt1200acv2-webflash.bin./RemoteStuff/DDWRT/ddwrt_mod_notes.docx./RemoteStuff/DDWRT/factory-to-ddwrt.bin./RemoteStuff/open_ldap_confıg_notes/./RemoteStuff/open_ldap_confıg_notes/ldap_dırectory_a.png./RemoteStuff/open_ldap_confıg_notes/open_ldap_notes.txt./RemoteStuff/perl_scrıpts/./RemoteStuff/perl_scrıpts/mysnmp.pl./RemoteStuff/php_scrıpts/./RemoteStuff/php_scrıpts/chunked.php./RemoteStuff/php_scrıpts/gettıngURL.php./RemoteStuff/A\
  \ Guıde to the WordPress REST API | Toptal.pdf./RemoteStuff/Rıck Cardon Tech LLC.webloc./RemoteStuff/VeeamDıagram.png./RemoteStuff/backbox-4.5.1-ı386.ıso./RemoteStuff/dhcp_admın_scrıpt_update.py./RemoteStuff/test_fıle.txt\n\
  ```\n\n```bash\nrdc@mınt Documents]$ ls -ld RemoteStuff.tgz\n-rw-rw-r--. 1 rdc rdc\
  \ 2317140451 Mar 12 06:10 RemoteStuff.tgz\n```\n\n**注意**：我们没有直接将所有文件添加到归档中，而是归档了整个\
  \ `RemoteStuff` 文件夹。这是最简单的方法。仅仅因为在解压时，整个 `RemoteStuff` 目录及其内部所有文件都会解压到当前工作目录下，路径为\
  \ `./currentWorkingDirectory/RemoteStuff/`。\n\n现在我们在 `/root/` 家目录下解压归档：\n\n```bash\n\
  root@centos ~]# tar -zxvf RemoteStuff.tgz\n./RemoteStuff/./RemoteStuff/.DS_Store./RemoteStuff/DDWRT/./RemoteStuff/DDWRT/.DS_Store./RemoteStuff/DDWRT/ddwrt-lınksys-wrt1200acv2-webflash.bin./RemoteStuff/DDWRT/ddwrt_mod_notes.docx./RemoteStuff/DDWRT/factory-to-ddwrt.bin./RemoteStuff/open_ldap_confıg_notes/./RemoteStuff/open_ldap_confıg_notes/ldap_dırectory_a.png./RemoteStuff/open_ldap_confıg_notes/open_ldap_notes.txt./RemoteStuff/perl_scrıpts/./RemoteStuff/perl_scrıpts/mysnmp.pl./RemoteStuff/php_scrıpts/./RemoteStuff/php_scrıpts/chunked.php./RemoteStuff/php_scrıpts/gettıngURL.php./RemoteStuff/A\
  \ Guıde to the WordPress REST API | Toptal.pdf./RemoteStuff/Rıck Cardon Tech LLC.webloc./RemoteStuff/VeeamDıagram.png./RemoteStuff/backbox-4.5.1-ı386.ıso./RemoteStuff/dhcp_admın_scrıpt_update.py./RemoteStuff/test_fıle.txt\n\
  ```\n\n```bash\nroot@mınt ~]# ping www.google.com\n```\n\n如上所示，所有文件都简单地解压到了当前工作目录下的目录中。\n\
  \n```bash\nroot@centos ~]# ls -l\ntotal 2262872\n-rw-------. 1 root root 1752 Feb\
  \ 1 19:52 anaconda-ks.cfg\ndrwxr-xr-x. 13 root root 8192 Mar 9 04:42 etc_baks\n\
  -rw-r--r--. 1 root root 1800 Feb 2 03:14 inital-setup-cfg\ndrwxr-xr-x. 6 rdc rdc\
  \ 4096 Mar 10 22:20 RemoteStuff\n-rw-rw-r--. 1 root root 2317140451 Mar 12 07:12\
  \ RemoteStuff.tgz\n-rw-r--r--. 1 root root 9446 Feb 25 05:09 ssl.conf\n```\n\n###\
  \ 使用 gzip 压缩文件备份\n\n如前所述，我们可以从 `tar` 中通过 `-j` 或 `-z` 命令行开关使用 `bzip2` 或 `gzip`。我们也可以使用\
  \ `gzip` 来压缩单个文件。然而，单独使用 `bzip` 或 `gzip` 提供的功能没有与 `tar` 结合时那么多。当使用 `gzip` 时，默认操作是删除原始文件，并将其替换为添加了\
  \ `.gz` 扩展名的压缩版本。`gzip` 的常用命令行开关有：\n\n| 开关 | 操作 |\n| :--- | :--- |\n| `-c` | 将文件放入归档后保留原始文件\
  \ |\n| `-l` | 获取压缩归档的统计信息 |\n| `-r` | 递归压缩目录中的文件 |\n| `-1` thru `9` | 指定 1 到 9 之间的压缩级别\
  \ |\n\n\n\n\n`gzip` 在多程度上是按文件为单位工作的，而不是像某些 Windows 操作系统上的 zip 工具那样以归包为单位。其主要原因是\
  \ `tar` 已经提供了高级的归档功能。`gzip` 的设计仅是为了提供一种压缩机制。因此，当考虑 `gzip` 时，请考虑单个文件。当考虑多个文件时，请考虑\
  \ `tar` 归包。现在，让我们通过之前的 `tar` 归包来探索这一点。\n\n注意 − 资丰富的 Linux 专业人士经常会将 tar 处理过的归包称为\
  \ tarball（压缩包）。\n\n让我们从我们的 rsync 备份再次创建一个 `tar` 归包。\n```bash\n[root@centos Documents]#\
  \ tar -cvf RemoteStuff.tar ./RemoteStuff/\n[root@centos Documents]# ls\nRemoteStuff.tar\
  \ RemoteStuff/\n```\n\n为了演示目的，让我们 `gzip` 新创建的 tarball，并告诉 `gzip` 保留旧文件。默认情况下，在不使用\
  \ `-c` 参数的情况下，`gzip` 将将整个 tar 归包替换为 `.gz` 文件。\n```bash\n[root@centos Documents]#\
  \ gzip -c RemoteStuff.tar > RemoteStuff.tar.gz\n[root@centos Documents]# ls\nRemoteStuff\
  \  RemoteStuff.tar  RemoteStuff.tar.gz\n```\n\n我们现在有了原始目录、tar 处理过的目录，最后是 gzipped\
  \ 后的 tarball。让我们尝试用 `gzip` 测试 `-l` 关。\n```bash\n[root@centos Documents]# gzip -l\
  \ RemoteStuff.tar.gz\n      compressed          uncompressed       ratio uncompressed_name\n\
  \      2317140467          2326661120         0.4% RemoteStuff.tar\n```\n\n为了演示\
  \ `gzip` 如何与 Windows Zip 工具不同，让我们在一个包含多个文本文件的文件夹上运行 `gzip`。\n```bash\n[root@centos\
  \ Documents]# ls text_files/\nfile1.txt  file2.txt  file3.txt  file4.txt  file5.txt\n\
  ```\n\n现在让我们使用 `-r` 参数递归压缩目录中的所有的文本文件。\n```bash\n[root@centos Documents]# gzip -9\
  \ -r text_files/\n[root@centos Documents]# ls ./text_files/\nfile1.txt.gz  file2.txt.gz\
  \  file3.txt.gz  file4.txt.gz  file5.txt.gz\n```\n\n看到了吗？这并不是某些可能预期的那样。所有的原始文本文件都被删除了，每个文件都被单独压缩了。由于这种行为，在需要处理单个文件时，最好单独考虑\
  \ `gzip`。\n\n处理 tarball 时，让我们把 rsynced 过的 tarball 提取到一个新目录中。\n```bash\n[root@centos\
  \ Documents]# tar -C /tmp -zxvf RemoteStuff.tar.gz\n./RemoteStuff/\n./RemoteStuff/.DS_Store\n\
  ./RemoteStuff/DDWRT/\n./RemoteStuff/DDWRT/.DS_Store\n./RemoteStuff/DDWRT/ddwrt-linuxys-wrt1200acv2-webflash.bin\n\
  ./RemoteStuff/DDWRT/ddwrt_mod_notes.docx\n./RemoteStuff/DDWRT/factory-to-ddwrt.bin\n\
  ./RemoteStuff/open_ldap_config_notes/\n./RemoteStuff/open_ldap_config_notes/ldap_directory_a.png\n\
  ./RemoteStuff/open_ldap_config_notes/open_ldap_notes.txt\n./RemoteStuff/perl_scripts/\n\
  ./RemoteStuff/perl_scripts/mysnmp.pl\n./RemoteStuff/php_scripts/\n./RemoteStuff/php_scripts/chunked.php\n\
  ```\n\n如上所示，我们将 tarball 提取并解压到了 `/tmp` 目录中。\n```bash\n[root@centos Documents]# ls\
  \ /tmp\nperfdata_root RemoteStuff\n```\n\n## 加密 TarBall 归包\n\n加密 tarball 归包以存储可能需要组织其他员工访问的安全文档（以防灾难恢复）可能是一个复杂的概念。基本上有三种方法：使用\
  \ `GnuPG`、使用 `openssl` 亦或使用第三方工具。`GnuPG` 主要为非对称加密设计，它考虑的是身份关联而不是密码。诚然，它可以与对称加密一起，但这不是\
  \ `GnuPG` 的主要优势。因此，当可能比原始人员更多的人需要访问时（例如，可能是一个想要防止管理员持有所有王国钥匙作为筹码的经理经理），我不会建议使用 `GnuPG`\
  \ 来存储具有物理安全性的归包。\n\n`openssl` 像 `GnuPG` 一样可以做到我们想要的，并随 CentOS 一带。但同样，它并不是专门为我们想要的设计，而且其加密在安全社区受到质疑。\n\
  \n我们的选择是一个名为 `7zip` 的工具。`7zip` 是像 `gzip` 一样的压缩工具，但具有更多功能。就像 Gnu Gzip 一样，`7zip` 及其标准都在开源社区。我们只需要从我们的\
  \ EHEL 仓库安装 `7zip`（下一章将详细介绍安装企业仓库）。\n\n### 在 CentOS 上安装 7zip\n\n一旦在 CentOS 中加载并配置了\
  \ EHEL 仓库，安装 `7zip` 非常简单。\n```bash\n[root@centos Documents]# yum -y install 7zip.x86_64\
  \ 7zip-plugins.x86_64\nLoaded plugins: fastestmirror\nbase                     \
  \       3.6 kB     00:00:00\nel/x86_64/metalink               13 kB     00:00:00\n\
  el                              4.3 kB     00:00:00\nextras                    \
  \      3.4 kB     00:00:00\n(1/2):el/x86_64/updateinfo      756 kB     00:00:04\n\
  (2/2):el/x86_64/primary_db       4.6 MB     00:00:18\nLoading mirror speeds from\
  \ cached host\n--> Running transaction\n---> Package 7zip.x86_64:0:16-el will be\
  \ installed\n---> Package 7zip-plugins.x86_64:0:16-el will be installed\n--> Finished\n\
  Dependency Resolution\nDependencies Resolved```\n\n很简单，`7zip` 已安装并可以使用 256 位加密处理我们的\
  \ tarball。现在让我们使用 `7zip` 用密码加密归包。语法为 `7zip a -p <输出文件名><文件名>`，其中 `a` 表示添加到归包，`-p`\
  \ 表示加密并提示密码。\n```bash\n[root@centos Documents]# 7zip a -p RemoteStuff.tgz RemoteStuff.tar.gz\n\
  7zip [64] - 16.02 : Copyright (c) 1999-2016 Pavlov\n7zip Version 16.02 (locale=en_US.UTF-8,\
  \ Utf16=on, Files=on, 64 bits, CPU(R) Core(TM) i5-4278U @60GHz (1), AES-NI)\nScanning\
  \ the drive: 1 file, 2317140467 bytes (2210 MB)\nCreating archive: RemoteStuff.tgz\n\
  Items to compress: 1\nEnter password (will not be echoed):\nVerify password (will\
  \ not be echoed):\nFiles read from disk: 1\nArchive size: 2280453410 bytes (2175\
  \ MB)\nEverything is Ok\n[root@centos Documents]# ls\nRemoteStuff  RemoteStuff.tar\
  \  RemoteStuff.tar.gz  RemoteStuff.tgz```\n\n现在我们有了加密 gzipped tarball 的 `.7z` 归包。\n\
  注意 − `7zip` 使用 AES 256 位加密和 SHA256 哈希，重复 512 次用于密钥派生。如果使用复杂的密钥，这应该是足够安全的。加密和重新压缩归包的过程可能需要一些时间。`7zip`\
  \ 提供了一种比 `gzip` 或 `zip` 功能更多的。然而，它在 CentOS 或 Linux 世界中并不是标准。因此，应该尽可能使用其他工具。\n\n\
  ## Linux 管理 - 系统更新\n\nCentOS 7 系统有三种更新方式：\n- 手动\n- 自动\n- 手动更新重大安全问题\n\n在生产环境中，建议对生产服务器进行手动更新。或者至少建立更新计划，以便管理员确保业务运行至关重要的。简单的安全更新可能会导致需要管理员升级和重新配置的应用程序问题。因此，在开发服务器和桌面进行测试之前，要注意自动更新。\n\
  \n### 手动更新 CentOS 7\n\n要更新 CentOS 7，我们需要熟悉 `yum` 命令。`yum` 用于处理 CentOS 7 中的软件包仓库。`yum`\
  \ 通常用于：\n- 更新 CentOS 7 Linux 系统\n- 搜索软件包\n- 安装软件包\n- 检测并安装软件包所需的依赖\n\n为了使用 `yum`\
  \ 进行更新，您的 CentOS 服务器需要连接互联网。大多数配置将安装基础系统，然后使用 `yum` 查询 CentOS 主仓库中的额外功能包并应用系统更新。我们已经使用过\
  \ `yum` 安装了一些软件包。使用 `yum` 时，您总是需要以 root 用户或具有 root 权限的用户身份执行。让我们搜索并安装一个名为 `nano`\
  \ 的易用编辑器。\n```bash\n[root@centos Documents]# yum search nano\nLoaded plugins: fastestmirror\n\
  Loading mirror speeds from cached host\n* base: mirror.rackspace.com\n* el: mirror.pcahut.edu\n\
  * extras: repos.forethought.net\n* updates: repos.forethought.net\n================================================\n\
  N/S matched: nano\n================================================\nnano.x86_64\
  \ : 一个小型文本编辑器\nnode-nano-noarch : Node.js 的最小驱动\nperl-time-Clock.noarch : 纳秒精度的二十小时对象\n\
  仅显示名称和摘要，所有内容使用 \"search all\"。\n[root@centos Documents]# yum install nano\nLoaded\
  \ plugins: fastestmirror\nLoading mirror speeds from cached host\n* base: mirror.rackspace.com\n\
  * el: mirror.pcahut.edu\n* extras: repos.forethought.net\n* updates: repos.forethought.net\n\
  ================================================================\nPackage      \
  \              Version            Repository      Size\n================================================================\n\
  nano.x86_64             2.3.1-10.el7        base            440 k\n================================================================\n\
  Install 1 Package\nTotal download size: 440 k\nInstalled size: 1.6 M\nIs this ok\
  \ [y/N]: y\nDownloading packages:\nnano-2.3.1-10.el7.x86_64.rpm | 440 kB     00:00:00\n\
  Running transaction check\nRunning transaction\nTransaction test succeeded\nInstalling:\
  \ nano-2.3.1-10.el7.x86_64 1/1\nVerifying: nano-2.3.1-10.el7.x86_64 1/1\nInstalled:\
  \ nano.x86_64 0:2.3.1-10.el7\nComplete!\n[root@centos Documents]#```\n\n我们安装了 `nano`\
  \ 编辑器。这种方法比搜索工具简单得多。此外，`yum` 使用数字签名来验证软件包是否来自信任源。这就是为什么被认为是最佳实践的更新。`yum` 也可以用来删除软件包。\n\
  ```bash\n[root@centos Documents]# yum remove nano\nLoaded plugins: fastestmirror\n\
  Resolving Dependencies\n--> Running transaction check\n---> nano.x86_64 0:2.3.1-10.el7\
  \ will be erased\n--> Finished\nDependency Resolution\nDependencies Resolved```\n\
  \n现在检查更新。\n```bash\n[root@centos Documents]# yum list updates\nLoaded plugins: fastestmirror\n\
  Loading mirror speeds from cached host\n* base: mirror.rackspace.com\n* el: mirror.pcahut.edu\n\
  * extras: repos.forethought.net\n* updates: repos.forethought.net\nUpdated Packages\n\
  NetworkManager.x86_64            1:1.4.0-17.el7_3  updates\nNetworkManager-adsl.x86_64\
  \      1:1.4.0-17.el7_3  updates\nNetworkManager-glib.x86_64       1:1.4.0-17.el7_3\
  \  updates\nNetworkManager-libnm.x86_64      1:1.4.0-17.el7_3  updates\nNetworkManager-team.x86_64\
  \       1:1.4.0-17.el7_3  updates\nNetworkManager-tu.x86_64         1:1.4.0-17.el7_3\
  \  updates\nNetworkManager-wif.x86_64         1:1.4.0-17.el7_3  updates\naudit.x86_64\
  \                     2.6.5-3.el7_3.1  updates\naudit-bs.x86_64                \
  \  2.6.5-3.el7_3.1  updates\naudit-python.x86_64               2.6.5-3.el7_3.1 \
  \ updates\nsystemd-sysv.x86_64              2.6.5-3.el7_3.1  updates\ntsh.x86_64\
  \                       6.18.01-13.el7_3.1  updates\ntzdata.noarch             \
  \       2017a1.el7        updates\ntzdata-java.noarch               2017a1.el7 \
  \       updates\nwpa_supplicant.x86_64            1:2.021.el7_3     updates\n```\n\
  \n检测到我们有几十个更新需要安装。实际上，由于我们还没有配置自动更新，总共有大约 100 个。因此，让我们安装所有更新。\n```bash\n[root@centos\
  \ Documents]# yum update\nLoaded plugins: fastestmirror\nLoading mirror speeds from\
  \ cached host\n* base: mirror.rackspace.com\n* el: mirror.pcahut.edu\n* extras:\
  \ repos.forethought.net\n* updates: repos.forethought.net\nResolving Dependencies\n\
  --> Running transaction check\n---> NetworkManager.x86_64 1:1.4.0-14.el7_3 will\
  \ be updated\n---> NetworkManager.x86_64 1:1.4.0-17.el7_3 will be updated\n--->\
  \ policy-targeted.noarch         3.13.102.el7_3.15\nTransaction Summary\n===============================================================\n\
  Upgrade                          68 Packages\nTotal size: 196 M\nTotal download\
  \ size: 83 M\nIs this ok [y/d/N]:\n```\n\n按下“y”键后，CentOS 7 的更新将开始。`yum` 更新的通用过程是：\n\
  - 检查当前软件包\n- 在仓库中查找更新的软件包\n- 计算更新包所需的依赖\n- 下载更新\n- 安装更新\n\n现在，让我们确保我们的系统是最新的。\n\
  ```bash\n[root@centos Documents]# yum list updates\nLoaded plugins: fastestmirror\n\
  Loading mirror speeds from cached host\n* updates: mirror.compe.com\n```\n如你所示，没有列出更新。\n\
  \n## 为 YUM 配置自动更新\n\n在企业环境中，如之前所述，自动更新可能是或不是首选安装方法。让我们概述使用 yum 配置自动更新的步骤。首先，我们安装名为\
  \ `yum-cron` 的软件包。\n```bash\n[root@centos]# vi /etc/yum/yum-cron.conf\n# 当可用时是否应该应用更新。\n\
  \ 注意，download_updates 也必须为 yes 才能应用更新。\napply_updates = no\n```\n\n我们想将 `apply_updates\
  \ = no` 更改为 `apply_updates = yes`。\n更新：在企业环境中，如之前所述，自动更新可能是或不是首选安装方法。让我们概述使用 yum\
  \ 配置自动更新的步骤。首先，我们安装名为 `yum-cron` 的软件包。\n```bash\n[root@centos]# vi /etc/yum/yum-cron.conf\n\
  # 当可用时是否应该应用更新。\n 注意，download_updates 也必须为 yes 才能应用更新。\napply_updates = no\n```\n\
  \n我们想将 `apply_updates = no` 更改为 `apply_updates = yes`。\n\n\n\n\n| 编号 | 文件描述符 | 字符\
  \ |\n| :--- | :--- | :--- |\n| 0 | 标准输入 | < |\n| 1 | 标准输出 | > |\n| 2 | 标准错误 | |\n\
  | | 追加到标准输出 | >> |\n| | 分配重定向 | & |\n| | 将标准输出管道至标准输入 | &#124; |\n\n\n\n\n我们在第一章中引入了这一点，但并没有详细讨论重定向或分配重定向。当在\
  \ Linux 中打开终端时，你的 shell 被视为以下内容的默认目标：\n- 标准输入 `<0`\n- 标准输出 `>1`\n- 标准错误输出 `2`\n\n\
  让我们看看它是如何工作的：\n`-[rdc@centos ~]$ lsof -ap $BASHPID -d 0,1,2\nCOMMAND  PID    USER\
  \    FD   TYPE DEVICE  SIZE/OFF  NODE      NAME\nbash    13684   rdc     0u   CHR\
  \  136,0      0t0       3       /dev/pts/0\nbash    13684   rdc     1u   CHR  136,0\
  \      0t0       3       /dev/pts/0\nbash    13684   rdc     2u   CHR  136,0   \
  \   0t0       3       /dev/pts/0`\n\n`/dev/pts/0` 是我们的伪终端。CentOS Linux 识别此后，会将我们打开的终端应用程序视为一个通过串口接口连接了键盘和显示器的真实终端。然而，就像虚拟机管理程序将硬件抽象为操作系统一样，`/dev/pts`\
  \ 也将我们的终端抽象为应用程序。\n\n从上面的 `lsof` 命令中，我们可以从 `FD` 列看到所有三个文件描述符都指向了我们的虚拟终端 `(0,1,2)`。我们现在可以发送命令、查看命令输出，以及与命令相关的任何错误。\n\
  \n以下是 STDIN 和 STDOUT 的示例：\n\n### STDOUT（标准输出）\n```bash\n[root@centosLocal centos]#\
  \ echo \"I am coming from Standard output or STDOUT.\" >output.txt && cat output.txt\n\
  I am coming from Standard output or STDOUT.\n[root@centosLocal centos]#\n```\n也可以将\
  \ stdout 和 stderr 同时发送到不同的文件中：\n```bash\nbash-3.2# find / -name passwd 1> good.txt\
  \ 2> err.txt\nbash-3.2# cat good.txt\n/etc/pam.d/passwd\n/etc/passwd\nbash-3.2#\
  \ cat err.txt\nfind: /dev/fd/3: Not a directory\nfind: /dev/fd/4: Not a directory\n\
  bash-3.2#\n```\n在搜索整个文件系统时，遇到了两个错误。每个错误都被发送到单独的文件以便以后查阅，而返回的结果被放置在一个单独的文本文件中。\n\n\
  在执行向终端输出大量数据的操作（如编译应用程序）时，将 `stderr` 发送到文本文件中非常有用。这允许我们查看可能会在终端滚动历史中丢失的错误。将 STDOUT\
  \ 传递到文本文件时需要注意 `>>` 和 `>` 的区别。双大于 `>>` 会追加到文件末，而单大于 `>` 会覆盖文件并写入新内容（因此所有之前的数据将丢失）。\n\
  \n### STDIN（标准输入）\n```bash\n[root@centosLocal centos]# cat < stdin.txt\nHello,I\
  \ am being read form Standard input, STDIN.\n[root@centosLocal centos]#\n```\n在上面的命令中，文本文件\
  \ `stdin.txt` 被重定向到 `cat` 命令，该命令将其内容回显 `STDOUT`。\n\n### 管道字符 `|`\n管道字符 `|` 将获取第一个命令的输出，并作为输入传递给下一个命令，允许后续命令对输出执行操作。\n\
  \n现在，让我们 `cat` 的 stdout “管道”到另一个命令：\n```bash\n[root@centosLocal centos]# cat output.txt\
  \ | wc -l\n[root@centosLocal centos]#\n```\n上面，`wc` 对传递的 `cat` 输出执行计算。`|` 命令在过滤\
  \ `grep` 或 `egrep` 的输出时特别有用：\n```bash\n[root@centosLocal centos]# egrep \"⁰-9]{4}$\"\
  \ /usr/share/nums | wc -l\n[root@centosLocal centos]#\n```\n在上面的命令中，我们从一个包含从 6535\
  \ 开始的所有数字的文本文件中通过 `egrep` 将每个 4 位数字传递给 `wc`。（注：原文为 `/usr/cts/nums`，这可能是 `/usr/share/nums`\
  \ 的笔误）。\n\n### 使用 `&` 重定向输出\n可以使用 `&` 字符重定向输出。如果我们想将 `STDOUT` 和 `STDERR` 的输出都重定向到同一个文件中，可以如下：\n\
  ```bash\n[root@centosLocal centos]# find -name passwd > out.txt 2>&1\n[root@centosLocal\
  \ centos]# cat out.txt\nfind: /dev/fd/3: Not a directory\nfind: /dev/fd/4: Not a\
  \ directory\n```\n使用 `&` 重定向的工作原理：首先，输出被重定向到 `out.txt`。其次，`STDERR` 或文件描述符 `2` 被重新分配到与\
  \ `STDOUT` 相同的位置（在本例中 `out.txt`）。重定向非常有用，在处理大文件、编译源码、脚本中重定向输出时出现的问题中非常方便。虽然功能强大，但对新管理员来说可能会复杂。实践、研究以及偶尔向\
  \ Linux 论坛（如 Stack Overflow）提问会有帮助。\n\n### Bash Shell 结构\n现在我们已经了解了 Bash shell 的工作原理，让我们学习一些编写脚本的基本结构。在本节中，我们将探索：\n\
  - [变量](https://www.tutorialspoint.com/linux_admin/linux_admin_variables.htm)\n-\
  \ [循环](https://www.tutorialspoint.com/linux_admin/linux_admin_loops.htm)\n- [条件判断](https://www.tutorialspoint.com/linux_admin/linux_admin_conditionals.htm)\n\
  - [循环控制](https://www.tutorialspoint.com/linux_admin/linux_admin_loop_control.htm)\n\
  - [读写文件](https://www.tutorialspoint.com/linux_admin/linux_admin_reading_and_writing_to_files.htm)\n\
  - [基础数学运算](https://www.tutorialspoint.com/linux_admin/linux_admin_basic_math_operations.htm)\n\
  \n### Bash 故障排除提示\n与专门的脚本语言相比，Bash 可能会有点棘手。Bash 脚本中最大的障碍通常源于传递给 shell 的脚本操作转义不正确或未转义。如果你仔细检查了脚本几次但它仍没有按预期运行，不要担心。即使对于那些每天使用\
  \ Bash 创建复杂脚本的人来说，这种情况也很常见。在 Google 上快速搜索或在专家 Linux 论坛注册并提问可以快速解决问题。很有可能有人遇到过完全相同的问题并已经解决了。Bash\
  \ 脚本是快速创建强大脚本的一种极方法，适用于从自动化管理任务到创建实用工具的各个方面。成为专家级的 Bash 开发者需要时间和通过练习。因此，尽可能使用 Bash\
  \ 脚本，它是你 CentOS 管理工具箱中一个非常棒的工具。\n\n### Linux 管理 - 包管理\nCentOS 中的包管理可以通过两种方式进行：从终端和从图形用户界面（GUI）。通常情况下，CentOS\
  \ 管理员的大部分时间会花在终端上。为 CentOS 更新和安装包也是一样。鉴于此，我们将首先在终端中探索包管理，然后简单介绍 CentOS 提供的图形化包管理工具。\n\
  \n#### YUM 包管理器\nYUM 是 CentOS 提供的包管理工具。我们在之前的章节中已简要提到过它。在本章中，我们将从纯安装开始。我们将首先完全更新我们的安装和应用程序。YUM\
  \ 让 Linux 的安装和管理有了巨大的进步。YUM 会“自动”检查过期的依赖项。与过去从源码编译每个应用程序相比，YUM 极大地减轻了管理员的负担。对于本教程，我们将假设该系统在升级软件包之前已经过过测试。\n\
  \n```bash\n[root@localhost dc]# yum check-update\nLoaded plugins: fastestmirror,\
  \ loading mirror speeds from cached file\n* base: mirrors.centos\n* extras: mirrors.centos\n\
