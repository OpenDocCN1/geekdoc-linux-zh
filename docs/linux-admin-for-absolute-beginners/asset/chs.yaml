  \n\n\n\n\n| d | 表示对象类型为目录 |\n| rwx | 表示应用于所有者（owner）的目录权限 |\n| r-x | 表示应用于组（group）的目录权限\
  \ |\n| r-x | 表示应用于所有人（world）的目录权限 |\n| root | 第一个实例，表示目录的所有者 |\n| root | 第二个实例，表示应用权限的组\
  \ |\n\n理解所有者、组和所有人之间的区别非常重要。不理解这一点可能会对托管服务的服务器产生巨大影响。在给出真实示例之前，让我们先了解应用于目录和文件的权限。\n\
  \n| 进制 | 符号 | 权限 | 目录操作 |\n| :--- | :--- | :--- | :--- |\n| 1 | x | 执行 | 进入目录并访问文件\
  \ |\n| 2 | w | 写入 | 删除或修改目录中的文件 |\n| 4 | r | 读取 | 列出目录内的文件 |\n\n**注意** — 当目录应该是可读取时，通常会应用读取和执行权限。否则，用户操作文件时会遇到困难。禁用写入权限将确保文件无法被重命名、删除、覆盖或修改权限。\n\
  \n## 为目录和文件应用权限\n\n应用权限时，有两个概念需要理解：\n- 符号权限\n- 进制权限\n\n本质上，它们是相同的，只是引用和分配权限的方式不同。为了作为一个快速指南，请学习下表：\n\
  \n| | 读取 | 写入 | 执行 |\n| :--- | :--- | :--- | :--- |\n| 进制 | 4 | 2 | 1 |\n| 符号 |\
  \ r | w | x |\n\n使用进制方法分配权限时，使用三字节数字，例如 `760`。数字 `760` 表示：所有者：`rwx`；组：`rw`；所有人无权限。另一种场景：`733`\
  \ 表示：所有者：`rwx`；组：`wx`；所有人：`wx`。使用进制方法的缺点是现有权限集无法修改，只能重新分配整个权限集。\n\n现在你可能会问，总是重新分配权限有什么问题？想象一个目录结构，例如\
  \ Web 服务器上的 `/var/www/`。我们希望递归地移除对应的 `w`（写入）权限，以便只有在安全措施需要时才手动添加。如果我们重新分配每个子目录的整个权限集，将给管理员和系统用户带来问题。在某些点，人员（或若干人员）需要重新分配被每个目录和对象擦掉的权限。\n\
  \n在这种情况下，我们希望使用符号方法来修改权限：\n```\nchmod -R o-w /var/www/\n```\n上面的命令不会“覆盖”权限，而是修改当前的权限集。因此习惯最佳实践：\n\
  - 仅使用进制分配权限\n- 使用符号修改权限集\n\n对于 CentOS 管理员来说，精通进制和符号权限是非常重要的，因为权限对于数据整个系统的完整性至关重要。如果权限错误，数据和整个系统将受到损害。\n\
  \n有了，让我们来看几个修改权限以及对象所有者/成员的命令：\n- `chmod`\n- `chown`\n- `chgrp`\n- `umask`\n\n###\
  \ chmod：更改文件权限位\n\n| 命令 | 操作 |\n| :--- | :--- |\n| -c | 详细，但只报告已更改 |\n| -v | 详细，输出每个请求的诊断信息\
  \ |\n| -R | 递归地应用于文件和目录 |\n\n`chmod` 允许我们使用进制或符号权限集更改目录和文件的权限。我们将用它来修改作业和上传。\n\n\
  ### chown：更改文件所有者和组\n\n| 命令 | 操作 |\n| :--- | :--- |\n| -c | 详细，但只报告已更改 |\n| -v |\
  \ 详细，输出每个请求的诊断信息 |\n| -R | 递归地应用于文件和目录 |\n\n`chown` 可以通过拥有对象的所有者和组来修改。然而，除非需要同时修改两者，否则\
  \ `chgrp` 通常用于组。\n\n### chgrp：更改文件或目录的组所有权\n\n| 命令 | 操作 |\n| :--- | :--- |\n| -c\
  \ | 详细，但只报告已更改 |\n| -v | 详细，输出每个请求的诊断信息 |\n| -R | 递归地应用于文件和目录 |\n\n`chgrp` 将组所有者更改为指定的组。\n\
  \n## 现实实践\n\n让我们更改 `/var/www/students/` 下的所有子目录，使所有组为 `students` 组。然后将 `students`\
  \ 根分配给 `professors` 组。随后，让 Terry Thomas 博士成为 `students` 目录的所有者，因为他负责负责学校所有的计算机科学系。正如我们所见，创建时，目录处于原始状态。\n\
  \n```bash\n[root@centosLocal]# ls -ld /var/www/students/\ndrwxr-xr-x.4 root root\
  \ 40 Jan 9 22:03 /var/www/students/\n[root@centosLocal]# ls -l /var/www/students/\n\
  total 0\ndrwxr-xr-x.2 root root 6 Jan 9 22:03 assignments\ndrwxr-xr-x.2 root root\
  \ 6 Jan 9 22:03 uploads\n```\n\n作为管理员，我们绝不会给任何人 root 权限。但同时，我们需要允许用户执行工作。所以让我们让\
  \ Terry Thomas 博士对目录有更多控制权，限制学生可以做什么。\n\n```bash\n[root@centosLocal]# chown -R terryt:professors\
  \ /var/www/students/\n[root@centosLocal]# ls -ld /var/www/students/\ndrwxr-xr-x.4\
  \ terryt professors 40 Jan 9 22:03 /var/www/students/\n[root@centosLocal]# ls -l\
  \ /var/www/students/\ntotal 0\ndrwxr-xr-x.2 terryt professors 6 Jan 9 22:03 assignments\n\
  drwxr-xr-x.2 terryt professors 6 Jan 9 22:03 uploads\n```\n\n现在，每个目录的所有者是 `terryt`，所属组是\
  \ `professors`。由于 `assignments` 目录是为了学生提交作业的，让我们移除组的列出和修改文件的权限。\n\n```bash\n[root@centosLocal]#\
  \ chgrp students /var/www/students/assignments/ && chmod736 /var/www/students/assignments/\n\
  [root@centosLocal]# ls -ld /var/www/students/assignments/\ndrwx-wxrw-.2 terryt students\
  \ 44 Jan 9 23:14 /var/www/students/assignments/\n```\n\n学生可以将作业复制到 `assignments`\
  \ 目录。但他们不能列出目录内容、覆盖现有文件或修改目录中的文件。因此，它允许学生提交完成的作业。作为 `assignments` 目录的所有者，Linux 文件系统将提供提交的时间戳。\n\
  \n```bash\n[terryt@centosLocal assignments]$ whoami\nterryt\n[terryt@centosLocal\
  \ assignments]$ ls -ld /var/www/students/assignments/\ndrwx-wxrw-.2 terryt students\
  \ 44 Jan 9 23:14 /var/www/students/assignments/\n[terryt@centosLocal assignments]$\
  \ ls -l /var/www/students/assignments/\ntotal 4\n-rw-r--r..1 adama students 0 Jan\
  \ 9 23:14 myassignment.txt\n-rw-r--r..1 tammyr students 16 Jan 9 23:18 terryt.txt\n\
  ```\n\n\n\n\n\n```bash\n[adama@centosLocal umask_tests]$ ls -l ./-rw-r--r--. 1 adama\
  \ students 0 Jan 10 00:27 myDır-rw-r--r--. 1 adama students 0 Jan 10 00:27 myFıle.txt\n\
  [adama@centosLocal umask_tests]$ whoamiadama\n[adama@centosLocal umask_tests]$ umask0022\n\
  [adama@centosLocal umask_tests]$Now, let’s change the umask for our current user,\
  \ and make a new fıle and dırectory.\n[adama@centosLocal umask_tests]$ umask 077\n\
  [adama@centosLocal umask_tests]$ touch mynewfıle.txt\n[adama@centosLocal umask_tests]$\
  \ mkdır myNewDır\n[adama@centosLocal umask_tests]$ ls -lt 0-rw-r--r--. 1 adama students\
  \ 0 Jan 10 00:27 myDır-rw-r--r--. 1 adama students 0 Jan 10 00:27 myFıle.txtdrwx------.\
  \ 2 adama students 6 Jan 10 00:35 myNewDır-rw-------. 1 adama students 0 Jan 10\
  \ 00:35 mynewfıle.txt\n```\n\n正如我们所见，新创建的文件权限比之前更严格。用户的 `umask` 必须在 `/etc/profile`\
  \ 或 `~/bashrc` 中修改。\n\n```bash\n[root@centosLocal centos]# su adama\n[adama@centosLocal\
  \ centos]$ umask0022\n[adama@centosLocal centos]$Generally, the default umask in\
  \ CentOS will be okay.当我们遇到 0022 默认值带来的问题时，通常是属于不同组的不同部门需要对项目进行协作。这时系统管理员的角色就体现了，以平衡\
  \ CentOS 操作系统的运行和设计。\n\n# Linux 员 - 用户管理\n\n在讨论用户管理时，我们有三个重要的术语需要理解：\n- 用户 (Users)\n\
  - 组 (Groups)\n- 权限 (Permissions)\n\n我们已经深入讨论了应用于文件和文件夹的权限。在本章中，让我们讨论用户和组。\n\n###\
  \ CentOS 用户\n\n在 CentOS 中，有两种类型的账户：\n- 系统账户 — 用于守护进程或其他软件部分。\n- 交互式账户 — 通常分配给用户访问系统资源。\n\
  \n这两个用户类型的主要区别在于：\n- 系统账户供守护进程访问文件和目录。这些账户通常不允许通过 shell 或物理控制台登录。\n- 交互式账户供终端用户通过\
  \ shell 或物理控制台登录访问计算资源。\n\n有了这些关于用户的基础，现在让我们为会计部的 Bob Jones 创建一个新用户。使用 `adduser`\
  \ 命令添加新用户。以下是 `adduser` 的常用开关：\n\n| 开关 | 操作 |\n| :--- | :--- |\n| -c | 为用户账户添加注释\
  \ |\n| -m | 如果不存在，则在默认位置创建用户主目录 |\n| -g | 为用户分配的默认组 |\n| -n | 不为用户创建私有组，通常创建一个与用户名同名的组\
  \ |\n| -M | 不创建主目录 |\n| -s | 除 `/bin/bash` 以外的默认 shell |\n| -u | 指定 UID（否则由系统分配）\
  \ |\n| -G | 分配给用户的额外组 |\n\n创建新用户时，如下所示使用 `-c`、`-m`、`-g`、`-n` 开关：\n\n```bash\n[root@localhost\
  \ Downloads]# useradd -c \"Bob Jones Accounting Dept Manager\"-m -g accountng -n\
  \ bjones\n```\n\n现在让我们看看新用户是否已创建：\n\n```bash\n[root@localhost Downloads]# id bjones\n\
  (bjones) gid = 1001(accounting) groups = 1001(accounting)\n[root@localhost Downloads]#\
  \ grep bjones /etc/passwd\nbjones:x:1001:1001:Bob Jones Accounting Dept Manager:/home/bjones:/bash\n\
  ```\n\n现在我们需要使用 `passwd` 命令启用该新账户：\n\n```bash\n[root@localhost Downloads]# passwd\
  \ bjones\nChanging password for user bjones.\nNew password:\nRetype new password:\n\
  passwd: all authentication updated.\nThe user is enabled.\n```\n\n### 禁用账户\n\n有几种方法可以禁用账户。从手动编辑\
  \ `/etc/passwd` 文件，到使用 `passwd` 命令配合 `-l` 开关。我们可以使用 `chage` 命令通过设置过期日期来禁用。\n\n```bash\n\
  [root@localhost Downloads]# chage -E 2005-01-01 bjones\n[root@localhost Downloads]#\
  \ usermod -c \"Disabled\" bjones\n[root@localhost Downloads]# grep bjones /etc/passwd\n\
  bjones:x:1001:1001:Disabled Bob Jones Accounting Dept Manager:/home/bjones:/bash\n\
  ```\n\n### 管理组\n\n设置组的密码是允许的。使用 `gpasswd` 命令更改组所有者。组可能需要设置密码。\n\n让我们创建一个名为 `secret`\
  \ 的组。我们将为该组设置密码。\n\n```bash\n[root@localhost Downloads]# groupadd secret\n[root@localhost]#\
  \ gpasswd secret\nChanging the password for group secret\nNew Password:\nRe-enter\
  \ new password:\n[root@localhost]# exit\n[centos@localhost ~]$ newgrp secret\n[centos@localhost\
  \ ~]$ groups\n```\n在实践中，组密码并不常用。辅助组已经足够，且在用户之间共享密码不是很好的安全做法。`groups` 命令用于显示用户属于哪些组。我们在对当前用户进行一些更改后将使用它。`usermod`\
  \ 用于更新账户属性。以下是常用的 `usermod` 开关。\n\n| 开关 | 操作 |\n| :--- | :--- |\n| -a | 追加，仅配合 `-G`\
  \ 选项时将用户添加到到辅助组 |\n| -c | 注释，更新用户注释值 |\n\n\n\n\n\n| 选项 | 描述 |\n| :--- | :--- |\n\
  | `-d` | 主目录，更新用户的主目录 |\n| `-G` | 组，添加或移除次要用户组 |\n| `-g` | 组，用户的默认主组组 |\n\n```bash\n\
  [root@localhost]# groups centoscentos : accountıng secret\n[root@localhost]#[root@localhost]#\
  \ usermod -a -G wheel centos\n[root@localhost]# groups centoscentos : accountıng\
  \ wheel secret\n```\n\n# Linux 员管理 - 配额管理\n\nCentOS 磁盘配额（Quota）可以启用两种功能：向系统管理员发送警报，以及在超过磁盘容量前拒绝用户对磁盘存储的进一步访问。当磁盘满时，取决于磁盘上存储的内容，整个系统可能会停滞，直到恢复为止。\n\
  \n## 在 CentOS Linux 中启用配额管理基本上是一个 4 步骤的过程：\n\n* **步骤 1** – 在 `/etc/fstab` 中为用户组和用户启用配额管理。\n\
  * **步骤 2** – 重新挂载文件系统。\n* **步骤 3** – 创建配额数据库并生成磁盘使用表。\n* **步骤 4** – 分配配额策略。\n\n\
  ### 在 /etc/fstab 中启用配额管理\n\n首先，我们想要备份我们的 `/etc/fstab` 文件：\n\n```bash\n[root@centosLoc\
  \ a l centos]# cp -r /etc/fstab ./\n```\n我们现在在当前工作目录下拥有了一个已知运行的 `/etc/fstab` 副本。\n\
  \n### /etc/fstab\n```text\n/etc/fstab\n# Created by anaconda on Sat Dec 17 02:44:51\
  \ 2016\n# Accessıble fılesystems, by reference, are maıntaıned under '/dev/dısk'\n\
  # See man pages fstab(5), fındfs(8), mount(8) and/or blkıd(8) for more ınfo\n/dev/mapper/cl-root\
  \      /               xfs     defaults               0 0\nUUID = 4b9a40bc-9480-4\
  \  /boot    xfs     defaults               0 0\n/dev/mapper/cl-home      /home \
  \   xfs     defaults,usrquota,grpquota   0 0\n/dev/mapper/cl-swap      swap    \
  \ swap    defaults               0 0\n```\n我们在 `/etc/fstab` 的选项部分进行了以下更改，适用于要对用户和组应用配额的卷或标签：\n\
  * `usrquota`\n* `grpquota`\n\n如你所见，我们正在使用 xfs 文件系统。使用 xfs 时，涉及额外的手动步骤。`/home` 与\
  \ `/` 在同一块磁盘上。进一步调查显示 `/` 被设置为 `noquota`，这是一个内核层面的挂载选项。我们必须重新配置内核启动选项。\n\n```bash\n\
  root@loca lhost rdc]# mount | grep ' / '/\n/dev/mapper/cl-root on / type xfs (rw,relatıme,seclabel,attr2,ınode64,noquota)\n\
  ```\n\n### 为 XFS 文件系统重新配置内核启动选项\n\n此步骤仅在两种条件下是必要的：\n* 当我们正在启用配额的磁盘/分区使用 xfs 文件系统时\n\
  * 当内核在启动时向 `/etc/fstab` 传递 no quota 参数时\n\n### 步骤 1 – 为 /etc/default/grub 创建备份。\n\
  ```bash\ncp /etc/default/grub ~/\n```\n\n### 步骤 2 – 修改 /etc/default/grub。\n这里是默认文件：\n\
  ```text\nGRUB_TIMEOUT=5\nGRUB_DISTRIBUTOR=\"$(sed 's, release$,,g' /etc/system-release)\"\
  \nGRUB_DEFAULT=saved\nGRUB_DISABLE_SUBMENU=true\nGRUB_TERMINAL_OUTPUT=\"console\"\
  \nGRUB_CMDLINE_LINUX=\"crash=auto rd.lvm.lv=cl/root rd.lvm.lv=cl/swap\"\nGRUB_DISABLE_RECOVERY=\"\
  true\"\n```\n我们想要修改以下行：\n`GRUB_CMDLINE_LINUX=\"crash=auto rd.lvm.lv=cl/root rd.lvm.lv=cl/swap\
  \ flags=usrquota,grpquota\"`\n\n**注意** – 我们原封地复制这些更改非常重要。在我们重新配置 `grub.cfg` 后，如果配置中出现任何错误，系统将无法启动。请在非产品系统上尝试此教程的部分。\n\
  \n### 步骤 3 – 备份你的 grub.cfg\n```bash\ncp /boot/grub2/grub.cfg /boot/grub2/grub.cfg.bak\n\
  grub2-mkconf -o /boot/grub2/grub\nGeneratıng grub confıuraton file ...\nFound lınuximage:\
  \ /boot/vmlınuz-3.10.0-514.el7.x86_64\nFound ıntrımage: /boot/tramfs-3.10.0-514.el7.x86_64\n\
  Found lınuximage: /boot/vmlınuz-0-rescue-ba7fa4f73457b9628ba8f395bfd\nFound ıntrımage:\
  \ /boot/tramfs-0-rescue-ba7fa4f73457b9628ba8f395bfd\ndone\n```\n```bash\n[root@localhost\
  \ rdc]#reboot\n```\n\n```bash\nmount /dev/mapper/cl-root on / type xfs (rw,relatıme,seclabel,attr2,ınode64,usrquota,grpquota)\n\
  ```\n如果所有修改都是精确的，我们应该能够为 xfs 文件系统添加配额。我们通过 grub 传递了参数。现在，再次编辑 `/etc/fstab` 以包含在同一物理磁盘上的\
  \ `/home`：\n`/dev/mapper/cl-root/xfsdefaults,usrquota,grpquota  0 0`\n\n现在让我们启用配额数据库。\n\
  ```bash\n[root@localhost rdc]# quotacheck -acfv\n[root@localhost rdc]# quotaon -ap\n\
  ```\ngroup quota on `/dev/mapper/cl-root` is on\nuser quota on `/dev/mapper/cl-root`\
  \ is on\ngroup quota on `/home` (/dev/mapper/cl-home`) is on\nuser quota on `/home`\
  \ (/dev/mapper/cl-home`) is on\n\n### 重新挂载文件系统\n\n如果分区或磁盘与活动启动的分区分开，我们可以在不重启的情况下重新挂载。如果配额是在根目录\
  \ `/` 启动的磁盘/分区上配置的，我们可能需要重启操作系统。强制重新挂载并应用更改，重新挂载文件系统的需求可能而异。\n\n```bash\n[rdc@localhost\
  \ ~]$ df\n```\n```text\nFilesystem             K-blocks Used Available Use% Mounted\
  \ on\n/dev/mapper/cl-root      22447404  4081860      18365544  19% /dev/mapper/cl-root\n\
  /devtmpfs                 903448         0          903448   0% /\n/devtmpfs   \
  \              903448         0          903448   0% /\n/devtmpfs              \
  \  19308         0          19308   0% /dev/shm\n/devtmpfs                19308\
  \         0          19308   0% /dev/runtmp\n/devtmpfs                19308    \
  \     0          19308   0% /dev/untmpfs\n/devtmpfs                19308       \
  \  0          19308   0% /sys/fs/cgroup/sda2\n/run/user/1000            19308  \
  \       0          19308   0% /run/user/1000\n```\n\n\n\n\n\n## 为每个用户添加配额限制\n\n\
  为此，我们将使用 `edquota` 命令，并在后跟用户名。\n\n```bash\n[root@localhost rdc]# edquota centos\n\
  ```\n\nDisk quotas for user centos (uid 1000):\nFilesystem             blocks  \
  \    soft      hard      inodes      soft      hard\n/dev/mapper/cl-root       \
  \   12           0          0         13         0      0\n/dev/mapper/cl-home \
  \        4084           0          0        140         0      0\n```\n\n让我们来看每一列：\n\
  *   **Filesystem**（文件系统）：已应用于该用户的文件系统配额。\n*   **blocks**（块）：用户在每个文件系统上当前使用的块数。\n\
  *   **soft**：设置软限制的块数。软限制允许用户在特定时间段内超出配额。\n*   **hard**：设置硬限制的块数。硬限制是允许允许的总配额。\n\
  *   **inodes**（节点）：用户当前正在使用的节点数。\n*   **soft**：软节点限制。\n*   **hard**：硬节点限制。\n\n作为用户检查我们的当前配额：\n\
  \n```bash\n[centos@localhost ~]$ quota own\n```\n\nDisk quotas for user centos (uid\
  \ 1000):\nFilesystem             blocks      quota      limit grace  files    quota\
  \      limit grace\n/dev/mapper/cl-home     6052604    56123456  61234568      475\
  \       0      0\n```\n\n以下是用户在超过硬配额限制时收到的错误信息。\n\n```bash\n[centos@localhost Downloads]$\
  \ cp CentOS-7-x86_64-LiveKDE-1611.isod.part ../Desktop/\ncp: cannot create regular\
  \ file '../Desktop/CentOS-7-x86_64-LiveKDE-1611.isod.part': Disk quota exceeded\n\
  ```\n\n如我们看到的，我们非常接近该用户的磁盘配额了。让我们设置一个软限制警告。这样，用户在配额限制过期之前就会获得提前通知。根据经验，当用户上班发现需要花费\
  \ 45 分钟清理文件才能开始工作时，你会收到用户的投诉。\n\n作为管理员，我们可以使用 `repquota` 命令检查配额使用情况。\n\n```bash\n\
  [root@localhost Downloads]# repquota /home\n```\n\nBlock limits                \
  \   File limits\nUser                used      soft      hard      grace\nused \
  \     soft      hard      grace\n----------------------------------------------------------------------\n\
  root                 0          0          0\ncentos             +618924   56123456\
  \ 61234568      541         0\n```\n\n如我们所示，用户 centos 已经超过了他们的硬块配额，无法在 `/home` 上使用更多磁盘空间。`-+`\
  \ 表示文件系统上已超出硬配额。在规划配额时，需要进行一些简单的计算。管理员需要知道：\n*   系统上有多少个用户？\n*   在用户/组之间分配多少空闲？\n\
  *   文件中的一个块由多少字节组成？\n\n根据空闲磁盘空间定义块的配额。建议在文件上留出“安全”的空闲空间缓冲区，以应对最坏情况：所有配额同时超出。\n\n\
  ## Systemd 服务的启动与停止\n\nsystemd 是 Linux 上运行服务的新方式。systemd 已取代了 sysvinit。systemd 为\
  \ Linux 带来了更快的启动速度，并且现在是管理 Linux 服务的标准方式。虽然很稳定，但 systemd 仍在进化。作为一种初始化系统，systemd\
  \ 用于管理 Linux 内核启动后需要更改状态和服务守护进程。通过状态更改应用启动、停止、重新加载和调整服务状态。\n\n首先，让我们检查服务器上当前运行的\
  \ systemd 版本。\n\n```bash\n[centos@localhost ~]$ systemctl --version\n```\nsystemd\
  \ 219+PAM +AUDIT +SELINUX +IMA -APARMOR +SMACK +SYSVINIT +UTMP +LIBCRYPTSETUPGCRYPT\
  \ +GNUTLS +ACL +XZ -LZ4 -SECCOMP +BLKID +ELFUTILS +KMOD +IDN\n\n截至 CentOS 7 版本（本文编写时已更新），systemd\
  \ 版本 219 是当前的稳定版本。我们还可以使用 `systemd-analyze` 分析服务器的最后启动时间。\n\n```bash\n[centos@localhost\
  \ ~]$ systemd-analyze\n```\nStartup finished in 1.580s (kernel) + 908ms (initrd)\
  \ + 53.225s (userspace) = 55.713s\n\n当系统启动时间较慢时，我们可以使用 `systemd-analyze blame` 命令。\n\
  \n```bash\n[centos@localhost ~]$ systemd-analyze blame\n```\n40.882s kdump.service\n\
  5.775s NetworkManager-wait-online.service\n4.701s plymouth-quit-wait.service\n3.586s\
  \ postfix.service\n3.121s systemd-udev-settle.service\n2.649s tuned.service\n1.848s\
  \ libvirtd.service\n1.437s network.service\n875ms packagekit.service\n855ms gdm.service\n\
  514ms firewalld.service\n438ms rsyslog.service\n436ms udis2.service\n398ms sshd.service\n\
  360ms boot.mount\n```\n\n在操作 systemd 时，理解单位（units）的概念非常重要。单位是 systemd 用于解释的资源。\n\
  \n单位分为以下 12 类型：\n*   `.service`\n*   `.socket`\n*   `.device`\n*   `.mount`\n* \
  \  `.automount`\n*   `.swap`\n*   `.target`\n*   `.path`\n*   `.timer`\n*   `.snapshot`\n\
  *   `.slice`\n*   `.scope`\n\n在大多数情况下，我们将 `.service` 作为单元目标。建议对其他类型进行进一步研究，因为只有\
  \ `.service` 适用于启动和停止 systemd 服务。每个单元定义在位于以下位置的文件：\n*   `/lib/systemd/system` —\
  \ 基础单元文件\n*   `/etc/systemd/system` — 运行时启动的修改后的单元文件\n\n| Switch | Action |\n| :---\
  \ | :--- |\n| `-t` | 类型的逗号分隔值，例如 service 或 socket |\n| `-a` | 显示所有已加载的单元 |\n| `--state`\
  \ | 显示定义状态的所有单元，例如：load, sub, active, inactive 等 |\n| `-H` | 远程执行操作。指定主机名或用 @ 分隔的主机和用户\
  \ |\n\n\n\n\n\n## systemctl 基础用法\n\n## 用\n`systemctl [operation]`\n示例：`systemctl\
  \ --state [servicename.service]`\n\n快速查看本地机器上运行的所有服务：\n```bash\n[root@localhost\
  \ rdc]# systemctl -t service\nUNIT                    LOAD   ACTIVE   SUB      DESCRIPTION\n\
  abrt-ccpp.service       loaded   active   exited   Install ABRT coredump\nabrt-oops.service\
  \       loaded   active   running   ABRT kernel log watcher\nabrt-xorg.service \
  \      loaded   active   running   ABRT Xorg log watcher\nabrtd.service        \
  \   loaded   active   running   ABRT Automated Bug Reporting Tool\naccounts-daemon.service\
  \ loaded   active   running   Accounts Service\nalsa-state.service      loaded \
  \  active   running   Manage Sound Card State (restore and store)\natd.service \
  \            loaded   active   running   Job spooling task\nauditd.service     \
  \     loaded   active   running   Security Auditing Service\navahi-daemon.service\
  \     loaded   active   running   Avahi mDNS/DNS-SD Stack\nblock-availability.service\
  \ loaded   active   exited   Availability of block devices\nbluetooth.service  \
  \    loaded   active   running   Bluetooth service\nchronyd.service         loaded\
  \   active   running   NTP client/server\n```\n\n### 停止服务\n让我们先停止蓝牙服务：\n```bash\n\
  [root@localhost]# systemctl stop bluetooth\n[root@localhost]# systemctl --all -t\
  \ service | grep bluetooth\nbluetooth.service      loaded   inactive dead     Bluetooth\
  \ service\n```\n如我们所示，蓝牙服务现在处于非活动（inactive）状态。\n\n再次启动蓝牙服务：\n```bash\n[root@localhost]#\
  \ systemctl start bluetooth\n[root@localhost]# systemctl --all -t service | grep\
  \ bluetooth\nbluetooth.service      loaded   active   running   Bluetooth service\n\
  ```\n**注意** - 我们没有明确指定 `bluetooth.service`，因为 `.service` 后缀是隐含的。良好的习惯是根据我们要处理的服务考虑其单元类型。因此，从现在开始，我们将使用\
  \ `.service` 扩展名来明确我们正在进行服务单元的操作。\n\n### 主要操作\n对服务执行的主要操作有：\n\n| 操作 | 说明 |\n| :---\
  \ | :--- |\n| Start | 启动服务 |\n| Stop | 停止服务 |\n| Reload | 在不停止服务的情况下重新加载服务的活动配置（类似于\
  \ system v init 中的 `kill -HUP`） |\n| Restart | 先启动后停止服务 |\n| Enable | 允许在开机时自动启动服务\
  \ |\n| Disable | 禁止服务在运行时自动启动 |\n\n上述操作主要用于以下场景：\n\n| 操作 | 场景 |\n| :--- | :--- |\n\
  | Start | 启动一个处于停止状态的服务。 |\n| Stop | 临时关闭服务（例如，当必须停止服务以访问被该服务锁定的时，如升级服务时）。 |\n|\
  \ Reload | 当编辑了配置文件且我们希望在不停止服务的情况下应用新更改。 |\n| Restart | 场景与 reload 相同，但该服务不支持 reload。\
  \ |\n| Enable | 当我们希望被禁用的服务在开机时运行。 |\n| Disable | 主要用于需要停止某个服务但它会在开机时自启动的情况。 |\n\
  \n\n\n\n\n## 服务状态管理\n\n要检查服务的状态，使用：\n```bash\n[root@localhost]# systemctl status\
  \ network.service\n```\n```\nnetwork.service - LSB: Bring up/down networking\nLoaded:\
  \ loaded (/etc/rc.d/init.d/network; bad; vendor preset: disabled)\nActive: active\
  \ (exited) since Sat 2017-01-14 04:43:48 EST; 1min 31s ago\nDocs: man:systemd-sysv-generator(8)\n\
  Process: 923 ExecStart = /etc/rc.d/init.d/network start (code=exited, status = 0/SUCCESS)\n\
  localhost.localdomain systemd[1]: Starting LSB: Bring up/down networking...\nlocalhost.localdomain\
  \ network[923]: Bringing up loopback interface: [ OK ]\nlocalhost.localdomain systemd[1]:\
  \ Started LSB: Bring up/down networking.\n```\n\n让我们显示网络服务的当前状态。如果我们想查看所有与网络相关的服务，可以使用：\n\
  ```bash\n[root@localhost]# systemctl --all -t service | grep -i network\n```\n```\n\
  network.service               loaded   active   exited   LSB: Bring up/\nNetworkManager-wait-online.service\
  \  loaded   active   exited   Network Manager\nNetworkManager.service        loaded\
  \   active   running  Network Manager\nntpd.service                   loaded   inactive\
  \ dead     Network Time\nrhel-import-state.service     loaded   active   exited\
  \   Import network\n```\n\n## systemd 和 systemctl\n\n对于那些熟悉使用 `sysinit` 方法管理服务的人来说，过渡到\
  \ `systemd` 是关重要的。`systemd` 是 Linux 中启动和停止守护进程服务的新方式。\n\nLinux 员员 - 使用 systemctl\
  \ 进行资源管理\n\n`systemctl` 是用于控制 `systemd` 的工具。`systemctl` 为 CentOS 管理员提供了对 systemd\
  \ 执行多种操作的能力，包括：\n- 配置 systemd \n- 获取 systemd 单元状态\n- 启动和停止服务\n- 为运行时启用/禁用 systemd\
  \ 服务等\n\n`systemctl` 的命令语法非常基础，但可能会因各种开关和选项变得复杂。我们将介绍管理 CentOS Linux 所需的 `systemctl`\
  \ 最核心的功能。\n\n### systemctl 语法：\n```\nsystemctl [OPTIONS] COMMAND [NAME]\n```\n\n\
  以下是配合 `systemctl` 使用常用命令：\n- `start`\n- `stop`\n- `restart`\n- `reload`\n- `status`\n\
  - `is-active`\n- `list-units`\n- `enable`\n- `disable`\n- `cat`\n- `show`\n\n我们已经讨论过\
  \ `systemctl` 的 `start`、`stop`、`reload`、`restart`、`enable` 和 `disable`。让我们来看剩下的常用命令。\n\
  \n### status\n在最形式的形式，`status` 命令可以查看整个系统状态：\n```bash\n[root@localhost rdc]# systemctl\
  \ status\n```\n```\n● localhost.localdomain State: running\nJobs: 0 queued Failed:\
  \ 0 units\nSince: Thu 2017-01-19 19:14:37 EST; 4h 5min ago\nCGroup: /\n       ├─1\
  \ /usr/lib/systemd/systemd --switched-root --system --deserialize 21\n       ├─user.slice\n\
  \       │ └─user-102.slice\n       │   └─session-1.scope\n       ├─2869 gdm-session-worker\
  \ [pam/gdm-password]\n       ├─2881 /usr/bin/gnome-keyring-daemon --daemon\n   \
  \    ├─2888 gnome-session --session gnome\n       └─2895 dbus-launch --exit-with-session\n\
  ```\n上面的输出经过精简的。在现实世界中，`systemctl status` 将输出约 100 行进程状态。假设我们要检查服务的状态：\n```bash\n\
  [root@localhost rdc]# systemctl status firewalld\n```\n```\n● firewalld.service\
  \ - firewall daemon\nLoaded: loaded (/usr/lib/systemd/system/firewalld.service;\
