  ```\n![Image00012.jpg)\n\n太好了，现在我们为生产服务器有了一个 Web 浏览器，不用担心通过网络发起的远程攻击。这对于生产服务器来说是一件好事。\n\
  \n我们几乎完成了，但首先我们需要配置这台服务器供开发人员测试应用程序。因此，让我们确保他们工作所需的所有工具。我们可以逐个安装一切，但 CentOS 和 YUM\
  \ 让这一切变得快得多。让我们安装开发组包（Development Group Package）。\n\n```bash\n[root@localhost rdc]#\
  \ yum groups list\nLoaded plugins: fastestmirror, langpacks\nLoading mirror speeds\
  \ from cached hostfile\n* base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n\
  * updates: mirror.clarkson.edu\nAvailable Groups:\n  Compatibility Libraries\n \
  \ Console Tools\n  Development Tools\n  Graphical Administration\n  Internet Tools\n\
  \  Legacy Unix\n  Security Tools\n  Smart Card\n  System Administration\n  System\
  \ Management\n[root@localhost rdc]#\n```\n\n这是 CentOS 提供的较小的组列表。让我们看看“Development\
  \ Tools”组包含什么。\n\n```bash\n[root@localhost rdc]# yum group info \"Development\"\n\
  Loaded plugins: fastestmirror, langpacks\nLoading mirror speeds from cached hostfile\n\
  * base: mirror.scalabledns.com\n* extras: mirror.scalabledns.com\n* updates: mirror.clarkson.edu\n\
  There is no installed groups\nMaybe run: yum groups\nGroup: Development Tools\n\
  Description: A basic environment\nMandatory Packages:\n```\n\n第一屏输出如上所示。这个列表非常全面。然而，这个组通常需要随着时间的推移安装。让我们安装整个组。\n\
  \n```bash\n[root@localhost rdc]# yum groups install \"Development Tools\"\n```\n\
  \n这是一个较大的安装。完成后，你的服务器将拥有用于 Perl、Python 和 C++ 的大部分库和编译器。\n\n# CentOS 中的图形化包管理\n\n\
  Gnome Desktop 提供了一个名为 Software 的图形化包管理工具。它非常易用且直观。Software 包管理工具可以通过导航找到：Applications\
  \ → System Tools → Software。\n\nSoftware 管理工具被分为若干组，允许管理员选择要安装的包。虽然这个工具非常易用且简单，但\
  \ YUM 要强大得多，管理员可能会更多地使用它。下面是 Software 工具的截图，它并不是为管理员设计的。![Image0013.jpg)\n\n## Linux\
  \ 管理 - 卷管理\n\n逻辑卷管理（LVM）是 Linux 用于在不同物理磁盘上管理卷的方法。这不要与 RAID 混淆。然而，它可以被认为类似于 RAID\
  \ 0 或 JBod 的概念。通过 LVM，可以（例如）拥有三个 1TB 的物理磁盘，然后创建一个如 `/dev/sdb` 的约 3TB 的逻辑卷。或者两个 1.5TB\
  \ 的逻辑卷、5 个 500GB 的卷，或任何组合。单个磁盘甚至可以用于逻辑卷的快照。注意——当配置正确时，逻辑卷实际上会增加磁盘 I/O。这的工作原理与 RAID\
  \ 0 将数据跨分布在单独磁盘上类似。\n\n在学习使用 LVM 进行卷管理时，如果我们知道 LVM 中的每个组件是什么，会变得更容易。请学习下表以牢掌握每个组件。如果需要，可以使用\
  \ Google 进行学习。理解逻辑卷的每个部分对于管理它们非常重要。\n\n| 组件 | 说明 | 示例 |\n| :--- | :--- | :--- |\n\
  | PV | 物理卷 (Physical Volume) | `sda` |\n| PP | 物理分区 (Physical Partition) | `sda1`,\
  \ `sda2` |\n| VG | 卷组 (Volume Group) | 池化的物理资源 |\n| LV | 逻辑卷 (Logical Volume) |\
  \ 操作系统视为存储设施 |\n\n\n\n\n\n物理卷将显示为 `/dev/sda`、`/dev/sdb`；这是 Linux 检测到的物理磁盘。物理分区是指使用\
  \ `fdisk` 等磁盘工具对磁盘进行划分的区域。请注意，在大多数常见的 LVM 设置中，不建议使用物理分区。例如：`disk /dev/sda` 被划分为包含两个物理分区：`/dev/sda1`\
  \ 和 `/dev/sda1`。\n\n如果我们有两个各 1TB 的物理磁盘，我们可以在这两个磁盘之间创建一个近 2TB 的卷组（volume group）。从该卷组中，我们可以创建三个逻辑卷（logical\
  \ volumes），每个卷的大小只要不超过总卷组的大小即可。\n\n传统的 Linux 磁盘管理工具\n在熟悉 CentOS 7 中最新、强大的 LVM 管理工具之前，我们应该先探索更多一直用于\
  \ Linux 磁盘管理的传统工具。这些工具与当今的高级 LVM 工具（如系统存储管理器）配合依然非常有用，例如：`lsblk`、`parted` 和 `mkfs.xfs`。\n\
  \n现在，假设我们已经向系统中添加了一个或两个磁盘，我们需要列出 Linux 检测到的磁盘。我总是建议在执行任何被视为具有破坏性的操作之前列出一次磁盘。`lsblk`\
  \ 是获取磁盘信息的极佳工具。让我们看看 CentOS 检测到了哪些磁盘。\n\n```bash\n[root@localhost rdc]# lsblk\n\
  NAME      MAJ:MIN  RM   SIZE    RO   TYPE MOUNTPOINT\nsda       8:0      0     20G\
  \   0   disk\n├─sda1    8:1      0      1G   0   part /boot\n└─sda2    8:2     \
  \ 0    19G   0   part\n  ├─cl-root 253:0    0     17G   0   lvm  /\n  └─cl-swap\
  \ 253:1    0      2G   0   lvm  [SWAP]\nsdb       8:16     0      6G   0   disk\n\
  sdc       8:32     0      4G   0   disk\nsr0       11:0     1    1024M   0   rom\n\
  ```\n\n你可以看到，这个系统上有三个磁盘：`sda`、`sdb` 和 `sdc`。磁盘 `sda` 包含了我们正在工作的 CentOS 安装，所以我们不想随意变动\
  \ `sda`。`sdb` 和 `sdc` 都是为了本教程添加到系统的。让我们让这些磁盘对 CentOS 可用。\n\n### 创建磁盘标签\n```bash\n\
  [root@localhost rdc]# parted /dev/sdb mklabel GPT\nWarning: /dev/sdb 上的现有磁盘标签将被破坏，此磁盘上的所有数据将丢失。你确定要继续吗？Yes/No?\
  \ Yes\n```\n我们现在有一个标记好的磁盘了。只需以相同的方式在 `sdc` 上运行 `parted` 命令即可。\n\n### 在磁盘上创建分区\n\
  我们将在每个磁盘上只创建一个单分区。创建分区时使用 `parted` 命令。\n\n```bash\n[root@localhost rdc]# parted\
  \ -a /dev/sdb mkpart primary 0% 100% -- requested partition from 0.0B to 642MB (sectors\
  \ 0..252911).我们能管理的的最接近的位置是 17.4kB 到 104kB (sectors 3..2047).这你接受吗？Yes/No? NO\n\
  [root@localhost rdc]# parted -a /dev/sdc mkpart primary 0% 100%Information -- 你可能需要更新\
  \ /etc/fstab。\n```\n\n```bash\n[root@localhost rdc]# lsblk\nNAME      MAJ:MIN  RM\
  \   SIZE    RO   TYPE MOUNTPOINT\nsda       8:0      0     20G   0   disk\n├─sda1\
  \    8:1      0      1G   0   part /boot\n└─sda2    8:2      0    19G   0   part\n\
  \  ├─cl-root 253:0    0     17G   0   lvm  /\n  └─cl-swap 253:1    0      2G   0\
  \   lvm  [SWAP]\nsdb       8:16     0      6G   0   disk\n└─sdb1    8:17     0 \
  \     6G   0   part\nsdc       8:32     0      4G   0   disk\n└─sdc1    8:33   \
  \  0      4G   0   part\nsr0       11:0     1    1024M   0   rom\n```\n从 `lsblk`\
  \ 输出中可以看到，我们现在有两个分区，分别在 `sdb` 和 `sdc` 上。\n\n### 创建文件系统\n最后，在挂载和使用任何卷之前，我们需要添加文件系统。我们将使用\
  \ XFS 文件系统。\n\n```bash\n[root@localhost rdc]# mkfs.xfs -f /dev/sdb1\nmeta-data =\
  \ /dev/sdb1 size = 512 agcount = 4, agsize = 393088 blks sectsz = 512 attr = 2,\
  \ proj32bit = 1 inobt = 0, sparse = 0data = size = 4096 blocks = 172352, maxpct\
  \ = 25 dealloc = 0 width = 0 blks naming = version 2 size = 4096 asci = 0 ftype\
  \ = 1 log = internal log size = 4096 blocks = 2560, version = 2 sectsz = 512 sunit\
  \ = 0 blks, lazy-count = 1 realtime = none exsz = 4096 blocks = 0, rtextents = 0\n\
  [root@localhost rdc]# mkfs.xfs -f /dev/sdc1\nmeta-data = /dev/sdc1 size = 512 agcount\
  \ = 4, agsize = 262016 blks sectsz = 512 attr = 2, proj32bit = 1 inobt = 0, sparse\
  \ = 0data = size = 4096 blocks = 1048064, maxpct = 25 dealloc = 0 width = 0 blks\
  \ naming = version 2 size = 4096 asci = 0 ftype = 1 log = internal log size = 4096\
  \ blocks = 2560, version = 2 sectsz = 512 sunit = 0 blks, lazy-count = 1 realtime\
  \ = none exsz = 4096 blocks = 0, rtextents = 0\n```\n\n在挂载和使用任何卷之前，我们已经完成了格式化。\n\
