  \ to do\n[root@localhost]#\n```\n\n如我们所示，默认情况下 CentOS 7 通过所有安装程序安装了 lbcgroup。使用最小安装程序将需要我们安装\
  \ lbcgroup 工具以及任何依赖项。\n\n## 步骤 2 − 启动并启用 cgconfıg 服务\n\n```bash\n[root@localhost]#\
