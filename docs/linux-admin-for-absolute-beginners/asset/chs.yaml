  \n## 引言\nLinux 的设计基于 Unix 哲学：“将许多小而精确的工具链在一起，简化复杂的任务”。Linux 从根本上说，通常没有针对特定用途的大型单一用途应用程序。相反，有数百种基本工具，结合在一起就能高效地完成大项任务。CentOS\
  \ 在企业级 Linux 发行版中独树一帜，坚持 Linux 的开源本质。本书提供了对 Linux 管理的完整理解，并解释了如何利用它。\n\n## 读者群\n\
  本书为初学者编写，帮助他们理解 Linux 管理的基础知识。对于 Linux 管理专业人士也特别有用。完成本教程后，你会发现自己已达到中等水平，并从此向更高水平迈进。\n\
  \n## 前提条件\n在继续之前，我们假设你已经具备 Linux 和管理的基础知识。\n\n## 基础 Linux 命令\n在学习 Linux 管理工具之前，重要的是\
  \ Linux 管理背后的哲学。Linux 设计基于 Unix 哲学：“将许多小而精确的工具链在一起，简化复杂的任务”。Linux 从根本上说，通常没有针对特定用途的大型单一用途应用程序。相反，有数百种基本工具，结合在一起就能高效地完成大任务。\n\
  \n### Linux 哲学示例\n例如，如果管理员想要获取系统所有用户的列表，可以使用以下命令按字母顺序排序：\n```\n[root@centos Local]#\
  \ cut /etc/passwd -d:f1 | sort\n```可以使用以下命令将此列表导出到文本文件：\n```\n[root@localhost]#\
  \ cut /etc/passwd -d:f1 > system_users.txt\n```\n还可以通过以下命令比较稍后导出的用户列表：\n```\n[root@centos\
  \ Local]# cat system_users.txt | sort | wc -l\n```\n\n## Linux 管理 - 文件/文件夹管理\n为了介绍适用于目录和文件的权限，让我们来看以下命令：\n\
