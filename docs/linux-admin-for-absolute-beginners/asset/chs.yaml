  \ |\n| `search` | 搜索软件包的描述和名称 |\n| `install` | 安装软件包 |\n| `localinstall` | 安装本地\
  \ rpm 包 |\n| `remove` | 移除并安装软件包 |\n| `clean all` | 清理 `/var/cache/yum` 以释放磁盘空间\
  \ |\n| `man yum` | 与所有 Linux 命令一样，显示帮助文件 |\n\n\n\n\n# 使用 YUM 安装软件\n\n使用 YUM 安装软件现在将安装一个名为\
