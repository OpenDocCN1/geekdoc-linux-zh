  ```\n\n## Linux 管理 - 进程管理\n\n以下是进程管理中常用的命令：`bg`, `fg`, `nohup`, `ps`, `pstree`,\
  \ `top`, `kıll`, `kıllall`, `free`, `uptıme`, `nıce`。\n\n### 操作进程\n\n### 快速提示：Linux\
  \ PID\n\n在 Linux 中，每个运行的进程都会被赋予一个 PID 或进程 ID。这个 PID 是 CentOS 识别特定进程的方式。正如我们讨论过的，`systemd`\
  \ 是 CentOS 启动的第一个进程并被赋予 PID 1。`pgrep` 用于根据指定的进程名称获取 Linux PID。\n\n```bash\n[root@CentOS]#\
  \ pgrep systemd\n1\n[root@CentOS]#\n```\n\n如所示，`pgrep` 命令返回 `systemd` 的当前 PID。\n\
  \n### CentOS 中的基础进程和作业管理\n\n在 Linux 中处理进程时，知道如何在命令行执行基础的前台和后台进程是非常重要的。\n\n*   `fg`\
  \ − 将进程带到前台\n*   `bg` − 将进程移到后台\n*   `jobs` − 列出附加到 shell 的当前进程列表\n*   `ctrl+z`\
  \ − 使用 Ctrl+z 键组合使当前进程挂起\n*   `&` − 在后台启动进程\n\n让我们开始使用命令 `sleep`。`sleep` 将如其名所示，即睡眠一段定义的时间：`sleep`。\n\
  \n```bash\n[root@CentOS ~]$ jobs\n[root@CentOS ~]$ sleep 10 &[1] 12454\n[root@CentOS\
  \ ~]$ sleep 20 &[2] 12479\n[root@CentOS ~]$ jobs\n[1]-  Running              sleep\
  \ 10 &\n[2]+  Running              sleep 20 &\n[root@cnetos@CentOS ~]$\n```\n\n\
  现在，我们将第一个作业带到前台：\n\n```bash\n[root@CentOS ~]$ fg 1\nsleep 10\n```\n\n如果你正在跟着操作，你会发现前台作业卡在了你的\
  \ shell 中。现在，让进程进入睡眠状态，然后在后台重新启用它。\n\n*   按下 `ctrl+z`\n*   输入：`bg 1`，将第一个作业发送到后台并启动它。\n\
  \n```bash\n[root@CentOS ~]$ fg 1\nsleep 20^Z\n[1]+  Stopped              sleep 20\n\
  [root@CentOS ~]$ bg 1\n[1]+  Running              sleep 20 &\n```\n\n### nohup 命令\n\
  \n在 shell 中工作时，值得注意的是，默认情况下所有附加到 shell 的进程会在 shell 关闭时终止。使用 `nohup` 允许进程在用户注销后继续运行。\n\
  \n```bash\n[root@CentOS ~]$ nohup pıng www.com &\n[1] 2729\n[root@CentOS]# pgrep\
  \ pıng\n2729\n[root@CentOS]# cat nohup.out\nping www.com (93.184.216.34) 56 bytes\
  \ of data.\n64 bytes from 93.184.216.34: icmp_seq=1 ttl=56\n[root@CentOS]# sleep\
  \ pıng www.com > /dev/null 2>&1 &\n[1] 2730\n[root@CentOS]# pgrep pıng\n2730\n[root@CentOS]#\
  \ kill -KILL `pgrep pıng`\n```\n\n### ps 命令\n\n管理员经常使用 `ps` 命令调查特定进程的快照。`ps` 通常配合\
  \ `grep` 使用，过滤出特定进程进行分析。\n\n```bash\n[root@CentOS ~]$ ps axw | grep python\n762\
  \  ?  Ssl  0:01 /usr/bın/python -Es /usr/sbın/fırewalld --nofork -nopıd\n1296  ?\
  \  Ssl  0:00 /usr/bın/python -Es /usr/sbın/tuned -l -P15550 pts/0  S+  0:00 /usr/bın/grep\
  \ --color=auto python\n```\n\n在上面的命令中，我们看到了所有使用 Python 解释器的进程。结果还包含了我们的 `grep` 命令，用于搜索字符串\
  \ python。\n\n### 常用 ps 选项\n\n| 选项 | 操作 |\n| :--- | :--- |\n| a | 排除仅对当前用户报告进程的限制\
  \ |\n| x | 显示未附加到 tty 或 shell 的进程 |\n| w | 对输出结果进行宽输出显示格式 |\n| e | 显示命令后的环境变量 |\n\
  | -e | 选择所有进程 |\n| -u | 显示特定用户的所有进程 |\n| -C | 按名称或进程 ID 显示所有进程 |\n| --sort | 按定义对进程进行排序\
  \ |\n\n\n\n\n查看 `nobody` 用户运行的所有进程：\n```bash\n[root@CentOS ~]$ ps -u nobody\n```\n\
  \n查看关于 `firewalld` 进程的所有信息：\n```bash\n[root@CentOS ~]$ ps -wl -C firewalld\n```\n\
  \n让我们看看哪些进程消耗了最多的内存：\n```bash\n[root@CentOS ~]$ ps aux --sort=-pmem | head -10\n\
  ```\n\n查看用户 `centos` 的所有进程，并显示自定义输出：\n```bash\n[centos@CentOS]$ ps -u centos -o\
  \ pid,comm\n```\n\n`pstree` 与 `ps` 类似但并不常用使用。它以更整洁的树状形式显示进程。\n```bash\n[centos@CentOS\
  \ ~]$ pstree\n```\n\n\n\n\n### 排序选项\n\n排序选项屏幕位于顶部，通过 `Shift+F` 显示。此屏幕允许自定义顶部显示和排序选项。\n\
  \n### 字段管理\n\n对于窗口 1：`Def`，其当前排序字段为 `%MEM`。\n\n使用 `Up`/`Dn` 导航，使用 `Right` 选择移动，然后按\
  \ `<Enter>` 或 `Left` 提交，使用 `'d'` 或 `<Space>` 切换显示，使用 `'s'` 设置排序。使用 `'q'` 或 `<Esc>`\
  \ 退出！！\n\n| 字段 | 描述 |\n| :--- | :--- |\n| `PID` | 进程 ID |\n| `TGID` | 线程组 ID |\n\
  | `USER` | 有效用户名 |\n| `ENVIRON` | 环境变量 |\n| `PR` | 优先级 |\n| `vMj` | 大页缺页增量 |\n|\
  \ `NI` | Nice 值 |\n| `vMn` | 小页缺页增量 |\n| `VIRT` | 虚拟内存 (KiB) |\n| `USED` | 驻留+交换大小\
  \ (KiB) |\n| `RES` | 驻留内存 (KiB) |\n| `nsIPC` | IPC 空间 Inode |\n| `SHR` | 共享内存 (KiB)\
  \ |\n| `nsMNT` | MNT 空间 Inode |\n| `S` | 进程状态 |\n| `nsNET` | NET 空间 Inode |\n| `%CPU`\
  \ | CPU 使用率 |\n| `nsPID` | PID 空间 Inode |\n| `%MEM` | 内存使用率 (RES) |\n| `TIME+` |\
  \ CPU 时间，百分之百 |\n| `nsUTS` | UTS 空间 Inode |\n| `COMMAND` | 命令名/命令行 |\n| `PPID` |\
  \ 父进程 pid |\n| `UID` | 有效用户句 ID |\n\n### 进程列表示例\n\ntop 命令显示了用户 `rdc` 的进程，并按内存使用率\
  \ `-PID` 排序。\n\n```text\n-PID USER %MEM PR NI VIRT RES SHR S %CPU TIME+ COMMAND\n\
  6130 rdc 6.2 20 0 1349592 117160 33232 S 0.0 1:09.34 gnome-shell\n6449 rdc 3.4 20\
  \ 0 1375872 64428 21400 S 0.0 0:00.43 evolution-calendar\n6296 rdc 1.7 20 0 1081944\
  \ 32140 22596 S 0.0 0:00.40 evolution-alarm\n6350 rdc 1.6 20 0 560728 29844 4256\
  \ S 0.0 0:10.16 \n6281 rdc 1.5 20 0 1027176 28808 17680 S 0.0 0:0.78 \n6158 rdc\
  \ 1.5 20 0 1026956 28004 19072 S 0.0 0:0.20 gnome-shell\n```\n\n### 显示有效字段（精简）\n\
  \n`PID PPID UID ERR USERS UID GID GROUP PGRTY TID`\n\n### Kill 命令\n\n`kill` 命令用于通过\
  \ `PID` 从 shell 杀死进程。在杀死进程时，我们需要指定一个要发送的信号。该信号让内核知道我们如何结束进程。最常用的信号有：\n\n- `SIGTERM`：实现方式为内核让进程知道应该尽快停止，因为这样做是安全的。`SIGTERM`\
  \ 为进程提供了退出并执行安全操作的机会。\n- `SIGHUP`：守护进程在收到 `SIGHUP` 时将重启。这通常用于配置文件发生更改时发送给进程。\n-\
  \ `SIGKILL`：由于 `SIGTERM` 等同于请求进程关闭，内核需要一个选项来结束不听从请求的进程。当进程挂起时，使用 `SIGKILL` 选项显式关闭进程。\n\
  \n要查看可以发送的所有信号列表，可以使用 `kill -l`：\n\n```bash\nroot@CentOS]# kill -l\n1) SIGHUP 2)\
  \ SIGINT 3) SIGQUIT 4) SIGILL 5) SIGTRAP 6) SIGABRT 7) SIGBUS 8) SIGFPE 9) SIGKILL\
  \ 10) SIGUSR1 11) SIGSEGV 12) SIGUSR2 13) SIGPIPE 14) SIGALRM 15) SIGTERM 16) SIGSTKFL\
  \ 17) SIGCHLD 18) SIGCONT 19) SIGSTOP 20) SIGTSTP 21) SIGTTIN 22) SIGTTOU 23) SIGURG\
  \ 24) SIGXCPU 25) SIGXFSZ 26) SIGVTALRM 27) SIGPROF 28) SIGWINCH 29) SIGIO 30) SIGPWR\
  \ 31) SIGSYS 34) SIGRTMIN 35) SIGRTMIN+1 36) SIGRTMIN+2 37) SIGRTMIN+3 38) SIGRTMIN+4\
  \ 39) SIGRTMIN+5 40) SIGRTMIN+6 41) SIGRTMIN+7 42) SIGRTMIN+8 43) SIGRTMIN+9 44)\
  \ SIGRTMIN+10 45) SIGRTMIN+11 46) SIGRTMIN+12 47) SIGRTMIN+13 48) SIGRTMIN+14 49)\
  \ SIGRTMIN+15 50) SIGRTMIN+16 51) SIGRTMIN+17 52) SIGRTMIN+18 53) SIGRTMIN+19 54)\
  \ SIGRTMIN+20 55) SIGRTMIN+21 56) SIGRTMIN+22 57) SIGRTMIN+23 58) SIGRTMIN+24 59)\
  \ SIGRTMIN+25 60) SIGRTMIN+26 61) SIGRTMIN+27 62) SIGRTMIN+28 63) SIGRTMIN+29 64)\
  \ SIGRT```\n\n### 常用操作\n\n使用 `SIGHUP` 重启：\n```bash\nroot@CentOS]# kill\n```\n\n\
  - 杀死所有进程：\n```bash\nroot@CentOS]# kill\n```\n\n- 使用 `SIGKILL` 杀死：\n```bash\nroot@CentOS]#\
  \ kill\n```\n\n- 发送信号以杀死进程：\n```bash\nroot@CentOS]# kill \n```\n\n## 内存管理\n\n`free`\
  \ 是一种用于检查内存的简单命令。它显示物理内存和交换内存的使用情况。\n\n```bash\nroot@CentOS]# free\n           \
  \   total        used        free      shared  buff/cache   available\nMem:    \
  \                                                                    \nSwap:   \
  \                                                                     \n```\n\n\
  ## Nice 命令\n\n`nice` 允许根据 nice 值设置进程的 CPU 调度优先级。默认情况下，假设进程将获得平等的 CPU 时间片。首先，让我们使用\
  \ `top` 查看当前运行进程的 nice 值。\n\n```bash\nroot@CentOS]# top\n```\n\n\n\n\n\n| 序号 | 区域与描述\
  \ |\n| :--- | --- |\n| 1 | drop（丢弃）：低信任级别。所有入站连接和数据包均被丢弃，仅允许通过状态检查的出站连接。 |\n| 2\
  \ | block（拦截）：入站连接将收到 ICMP 消息的回复，通知发起者该请求被禁止。 |\n| 3 | public（公用）：所有公共网络都受到限制。然而，可以显式地允许特定的入站连接。\
  \ |\n| 4 | external（外部）：为 NAT 配置 firewalld。内部网络保持私有，但仍可访问。 |\n| 5 | dmzOnly（仅限 DMZ\
  \ 区）：仅允许特定的入站连接。用于 DMZ 隔离系统。 |\n| 6 | work（工作）：默认情况下，由于系统处于安全的工作环境中，信任网络上的更多计算机。\
  \ |\n| 7 | hone（家庭）：默认情况下，更多服务未经过过滤。假设系统处于家庭网络，将使用如 NFS、SAMBA 和 SSDP 等服务。 |\n| 8\
  \ | trustedAll（信任所有）：网络上的所有机器都是受信任的。大多数入站连接被无限制地允许。这不适用于暴露在互联网上的接口。 |\n\n最常用的区域有：`public`、`drop`、`work`\
  \ 和 `home`。以下是每个常用区域的适用场景：\n\n*   **public**：这是管理员最常用的区域。它允许你对本地局域网（LAN）上的操作应用自定义设置，并遵守\
  \ RFC 规范。\n*   **drop**：使用 `drop` 的一个良好示例是在安全会议、公共 Wi-Fi 或直接连接到互联网的接口上。`drop` 假设所有未经请求的请求（包括\
  \ ICMP 探测）都是恶意的。因此，任何超出状态的请求将不会收到回复。`drop` 的缺点是，在某些需要严格遵守 RFC 的情况下，它可能会破坏应用程序的功能。\n\
  *   **work**：你处于一个半安全的公司局域网。可以假设所有流量都是中等安全的。这意味着这不是 Wi-Fi，我们可能部署了 IDS、IPS 以及物理安全或\
  \ 802.1x。我们还应该熟悉使用局域网的人员。\n*   **home**：你处于一个家庭局域网。你对局域网上的每个系统和用户负责。你了解局域网上的每台机器，并知道它们都没有被破解。通常为了在信任的人员之间共享媒体而启动新服务，你不需要为了安全花费额外的时间。\n\
  \n区域和网络接口是在“一对多”层面上工作的。一个网络接口一次只能应用一个区域。而一个区域可以同时应用于多个接口。\n\n让我们看看哪些是可用区域，以及当前应用了哪个区域。\n\
  \n```bash\n[root@CentOS]# firewall-cmd --get-zones\nwork drop internal external\
  \ trusted home dmz public block\n[root@CentOS]# firewall-cmd --get-default-zone\n\
  public\n```\n\n准备好在 firewalld 中添加一些自定义规则了吗？首先，让我们看看从外部端口扫描器的角度来看，我们的机器是什么样子的。\n\n\
  ```bash\nbash-3.2# nmap -sS -p 1-1024 -T 5 10.211.55.1\nStarting Nmap 7.30 ( https://nmap.org\
  \ ) at 2017-01-27 23:36 MST\nNmap scan report for centos.shared (10.211.55.1)\n\
  Host is up (0.00046s latency).\nNot shown: 1023 filtered ports\nPORT    STATE SERVICE\n\
  22/tcp open  ssh\nNmap done: 1 IP address (1 host up) scanned in 3.71 seconds\n\
  bash-3.2#\n```\n\n让我们允许进入 80 端口的入站请求。首先，检查默认应用了哪个区域。\n\n```bash\n[root@CentOs]#\
  \ firewall-cmd --get-default-zone\npublic\n```\n\n然后，将允许 80 端口的规则设置为当前默认区域。\n\n\
  ```bash\n[root@CentOS]# firewall-cmd --zone=public --add-port=80/tcp\nsuccess\n\
  ```\n\n现在，在允许 80 端口连接后检查我们的机器。\n\n```bash\nbash-3.2# nmap -sS -p 1-1024 -T 5 10.211.55.1\n\
  Starting Nmap 7.30 ( https://nmap.org ) at 2017-01-27 23:36 MST\nNmap scan report\
  \ for centos.shared (10.211.55.1)\nHost is up (0.00046s latency).\nNot shown: 1023\
  \ filtered ports\nPORT    STATE SERVICE\n22/tcp open  ssh\n80/tcp open http\nNmap\
  \ done: 1 IP address (1 host up) scanned in 3.71 seconds\nbash-3.2#\n```\n\n让我们允许进入\
  \ 80 端口的入站请求。首先，检查默认应用了哪个区域。\n\n```bash\n[root@CentOs]# firewall-cmd --get-default-zone\n\
  public\n```\n\n然后，将允许 80 端口的规则设置为当前默认区域。\n\n```bash\n[root@CentOS]# firewall-cmd\
  \ --zone=public --add-port=80/tcp\nsuccess\n```\n\n在允许 80 端口连接后检查我们的机器。让我们将默认区域设置为\
  \ drop 看看会发生。\n\n```bash\n[root@CentOS]# firewall-cmd --get-default-zone\npublic\n\
  [root@CentOS]# firewall-cmd --set-default-zone=drop\n[root@CentOS]# firewall-cmd\
  \ --get-default-zone\ndrop\n```\n\n现在让我们在 drop 区域下扫描主机。\n\n```bash\nbash-3.2# nmap\
  \ -sS -p 1-1024 -T 5 10.211.55.1\nStarting Nmap 7.30 ( https://nmap.org ) at 2017-01-27\
  \ 23:36 MST\nNmap scan report for centos.shared (10.211.55.1)\nHost is up (0.00046s\
  \ latency).\nNot shown: 1023 filtered ports\nPORT    STATE SERVICE\n22/tcp filtered\
  \ ssh\nNmap done: 1 IP address (1 host up) scanned in 3.71 seconds\nbash-3.2#\n\
  ```\n\n（注：原文中存在部分由于重复导致的逻辑描述，如设置 drop 的部分，已参考示例逻辑进行了翻译处理以确保流程通顺。）\n\n\n\n\n这些是管理和配置\
  \ `firewalld` 的基本概念。在 CentOS 中配置基于主机的防火墙服务在更复杂的网络场景下是一项复杂的任务。在 CentOS 中对 `firewalld`\
  \ 和 `iptables` 进行高级用法和配置可能需要一整个教程。然而，我们已经介绍了基础知识，这些应该足够完成大部分日常任务。\n\n## 在 CentOS\
  \ Linux 中配置 PHP\n\nPHP 是目前使用最广泛的 Web 语言之一。在 CentOS 上安装 LAMP Stack 是每位系统管理员都需要执行的操作，而且很可能很快就会用到。\n\
  \n传统的 LAMP Stack 由 (L)inux (A)pache (M)MySQL (P)HP 组成。CentOS 上的 LAMP Stack 包含三个主要组件：\n\
  * Web 服务器\n* Web 开发平台 / 语言\n* 数据库服务器\n\n注意 – LAMP Stack 术语也可能包含以下技术：PostgreSQL,\
  \ MariaDB, Perl, Python, Ruby, NGINX Web 服务器。\n\n在本教程中，我们将坚持使用 CentOS GNU Linux\
  \ 的传统 LAMP Stack：Apache Web 服务器、MySQL 数据库服务器和 PHP。\n\n我们实际上将使用 MariaDB。MySQL 的配置文件、数据库和表对\
  \ MariaDB 是透明的。MariaDB 现在包含在标准的 CentOS 仓库中，而不是 MySQL。这是由于 Oracle 已接管了 MySQL 的开发，受许可和开源合规性的限制。\n\
  \n我们需要做的第一件事是安装 Apache。\n\n```bash\n[root@CentOS]# yum install httpd\nLoaded plugins:\
  \ fastestmirror, langpacks\nbase| 3.6 kB  00:00:00\nextras| 3.4 kB  00:00:00\nupdates|\
  \ 3.4 kB  00:00:00\nextras/7/x86_64/primary_d| 121 kB  00:00:00\nLoading mirror\
  \ speeds from cached hostfile\n* base: mirror.sigmanet.com\n* extras: linux.mirrors.es.net\n\
  * updates: mirror.eboundhost.com\nResolving Dependencies\n--> Running transaction\
  \ check\n---> Package httpd.x86_64 0:2.4.6-45.el7.centos will be installed\n-->\
  \ Processing Dependency: httpd-tools = 2.4.6-45.el7.centos for package:httpd-2.4.6-45.el7.centos.x86_64\n\
  --> Processing Dependency: /etc/mime.types for package:httpd-2.4.6-45.el7.centos.x86_64\n\
  --> Running transaction check\n---> Package httpd-tools.x86_64 0:2.4.6-45.el7.centos\
  \ will be installed\n---> Package mailcap.noarch 0:2.1.41-2.el7 will be installed\n\
  --> Finished Dependency Resolution\nInstalled:httpd.x86_64 0:2.4.6-45.el7.centos\n\
  Dependency Installed:httpd-tools.x86_64 0:2.4.6-45.el7.centos\nmailcap.noarch 0:2.1.41-2.el7\n\
  Complete!\n```\n\n让我们配置 `httpd` 服务。\n\n```bash\n[root@CentOS]# systemctl start httpd\
  \ && systemctl enable httpd\n```\n\n现在，让我们确保 Web 服务器可以通过 `firewalld` 访问。\n\n```bash\n\
  bash-3.2# nmap -sS -p 1-1024 -T 5 -sV 10.211.55.1\nStarting Nmap 7.30 ( https://nmap.org\
  \ ) at 2017-01-28 02:00 MST\nNmap scan report for centos.shared (10.211.55.1)\n\
  Host is up (0.00054s latency).\nNot shown: 1022 filtered ports\nPORT    STATE SERVICE\
  \ VERSION\n22/tcp open  ssh      OpenSSH 6.6.1 (protocol 2.0)\n80/tcp open  http\
  \     Apache httpd 2.4.6 ((CentOS))\nService detection performed. Please report\
  \ any incorrect results at https://nmap.org/submit/.\nNmap done: 1 IP address (1\
  \ host up) scanned in 10.82 seconds\nbash-3.2#正如你通过 nmap 服务看到的，Apache 服务器正在 CentOS\
  \ 上监听并响应请求。\n```\n\n## 安装 MySQL 服务器\n\n```bash\n[root@CentOS rdc]# yum install mariadb-server.x86_64\
  \ && yum install mariadb-devel.x86_64 && mariadb.x86_64 && mariadb-libs.x86_64\n\
  ```\n\n我们正在为 MariaDB 安装以下仓库包：\n* `mariadb-server.x86_64` 主 MariaDB 守护进程包。\n* `mariadb-devel.x86_64`\
  \ 用于从源码编译且具有 MySQL 兼容性的文件。\n* `mariadb.x86_64` 从命令行管理 MariaDB 的工具。\n* `mariadb-libs.x86_64`\
  \ 带有 MySQL 支持并编译的应用程序可能需要的常用库。\n\n现在，让我们启动并启用 MariaDB 服务。\n\n```bash\n[root@CentOS]#\
  \ systemctl start mariadb\n[root@CentOS]# systemctl enable mariadb\n```\n\n注意 –\
  \ 类似于 Apache，我们不会通过基于主机的防火墙（`firewalld`）启用到 MariaDB 的连接。使用数据库服务器时，最佳实践是仅允许本地连接。让我们确保\
  \ MariaDB 正在接受连接。\n\n```bash\n[root@CentOS#] netstat -ln\nActive connections (only\
  \ servers)\nProto    Recv-Q  Send-Q   Local Address       Foreign Address      \
  \ State\ntcp        0               0       0.0.0.0:306         0.0.0.0:*      \
  \         LISTEN\ntcp        0               0       0.0.0.0:11         0.0.0.0:*\
  \               LISTEN\ntcp        0               0       192.168.122.1:53    0.0.0.0:*\
  \               LISTEN\ntcp        0               0       0.0.0.0:22         0.0.0.0:*\
  \               LISTEN\ntcp        0               0       127.0.0.1:631      0.0.0.0:*\
  \               LISTEN\ntcp        0               0       127.0.0.1:25      0.0.0.0:*\
  \               LISTEN\n```\n正如我们所看到的，MariaDB 正在端口 `3306` 上监听。基于主机的防火墙（`firewalld`）将阻止对端口\
  \ `3306` 的连接。\n\n## 安装并配置 PHP\n\n```bash\n[root@CentOS#] yum install php.x86_64\
  \ php-common php-mysql php-pdo php-soap php-xml\n```\n我们建议安装以下 php 包以实现兼容性：\n* `php-common`\n\
  * `php-mysql`\n* `php-mysqlnd`\n* `php-pdo`\n* `php-soap`\n* `php-xml`\n\n```bash\n\
  [root@CentOS]# yum install -y php-common php-mysql php-mysqlnd php-pdo php-soap\
  \ php-xml\n```\n在 CentOS 运行在之前，我们安装了 `php-common php-mysql php-mysqlnd php-pdo php-soap\
  \ php-xml`。\n\n这是我们简单的 php 文件，位于 Apache 根 `/var/www/html/`。\n\n```bash\n[root@CentOS]#\
  \ cat /var/www/html/index.php\n<html>\n<head>\n    <title>PHP 测试页面</title>\n</head>\n\
  <body>\n    PHP 安装\n    <?php\n    echo \"我们现在正在 CentOS 上运行 PHP！\";\n    ?>\n</body>\n\
  </html>\n```\n\n让我们将页面的所有权组更改为系统用户我们的 httpd。\n\n```bash\n[root@CentOS]# chgrp httpd\
  \ /var/www/html/index.php && chmod grx /var/www/html/index.php\n```\n\n通过 `ncat`\
  \ 手动请求：\n\n```bash\nbash-3.2# ncat 10.211.55.1 80\n  GET /index.php\nHTTP/1.1 200\
  \ OK\n  Date: Sat, 28 Jan 2017 12:06:02 GMT\n  Server: Apache/2.4.6 (CentOS)\n \
  \ X-Powered-By: PHP/5.4.16\n  Transfer-Encoding: chunked\n  Content-Length: 137\n\
  \  Connection: close\n  Content-Type: text/html; charset=UTF-8\n<html>\n  <head>\n\
  \    <title>PHP 测试页面</title>\n  </head>\n  <body>\n    PHP 安装\n    我们现在正在 CentOS\
  \ 运行 PHP！\n  </body>\n</html>\n```\n\n## 在 CentOS 上设置 Python\n\nPython 是一种广泛使用的解释型语言，为\
  \ Linux（和其他操作系统）上的脚本应用带来了专业性。虽然 曾是行业标准，Python 在许多方面超过了它。\n\nPython 相比 Perl 的优势：\n\
  * 快速演进\n* 语言的标准库\n* 代码的可读性\n* 从 GUI 支持到 Web 开发的许多框架\n\nPython 可以做到 Perl 能做的所有事情，在很多情况下方式更好。尽管\
  \ Perl 在 Linux 工具箱中仍有一席之地，学习 Python 是一个明智的选择。\n\nPython 最大的缺点有时与其优势有关。在历史上，Python\
  \ 最初的设计是为了教学编程。有时，它的核心“易读性”和“正确做事”在编写简单代码时会导致不必要的复杂性。此外，它的标准库在从版本 2.X 到 3.X 时产生了问题。\n\
  \nPython 脚本实际上用于 CentOS 核心系统的重要功能。因此，将我们的开发环境与 CentOS 环境隔离来是重要的。首先，目前有两个版本的 Python：2.X\
  \ 和 3.X。两个阶段都处于活跃状态，尽管 2.X 版本很快将被弃用（已持续几年了）。两个活跃版本的理由基本上是为了修复 2.X 的缺陷。这要求 3.X 的某些核心功能以\
  \ 2.X 不支持的方式来实现。基本上，克服这种转换的最佳方法是：为 3.X 开发，并为旧脚本维护最新的 2.X 版本。目前，CentOS 7.X 依赖于半当前的\
  \ 2.X 版本。目前，最新的 Python 版本为：3.4.6 和 2.7.13。\n\n不要让这些困扰你得出结论。设置 Python 环境非常简单。有了 Python\
  \ 框架和库，这项任务实际上很容易完成。在设置我们的 Python 环境之前，我们需要一个健康的环境。首先，确保我们的 CentOS 安装完全更新并安装构建工具。\n\
  \n步骤 1 – 更新 CentOS。\n```bash\n[root@CentOS]# yum -y update\n```\n\n步骤 2 – 安装构建工具。\n\
  ```bash\n[root@CentOS]# yum -y groupinstall \"development tools\"\n```\n\n步骤 3 –\
  \ 安装一些需要的包。\n```bash\n[root@CentOS]# yum install -y zlib-dev openssl-devel sqlite-devel\
  \ bzip-devel\n```\n\n现在我们需要从源码安装当前的 Python 2.X 和 3.X。\n* 下载压缩包\n* 提取文件\n* 编译源码\n\
  \n让我们先在 `/usr/src` 中为每个 Python 安装创建一个构建目录。\n\n```bash\n[root@CentOS]# mkdir -p /usr/src/python\n\
  ```\n\n现在下载每个的源码 tar 包：\n```bash\n[root@CentOS]# wget https://www.python.org/ftp/python/2.7.13/Python-2.7.13.tar.xz\n\
  [root@CentOS]# wget https://www.python.org/ftp/python/3.6.0/Python-3.6.0.tar.xz\n\
  ```\n\n现在我们需要从归包中提取每个。\n\n步骤 1 – 安装 xz-libs。\n```bash\n[root@CentOS]# xz-libs\n\
  [root@CentOS]# tar -xf Python-2.7.13.tar.xz\n[root@CentOS]# tar -xf Python-3.6.0.tar.xz\n\
  ```\n步骤 2 – 从归档中提取每个。\n```bash\n[root@CentOS]# cd Python-2.7.13\n[root@CentOS]#\
  \ cd ../Python-3.6.0\n```\n\n步骤 3 – 在每个目录中运行配置。\n```bash\n[root@CentOS]# ./configure\
  \ --prefix=/usr/local\n[root@CentOS]# make\n[root@CentOS]# make install\n```\n\n\
  \n\n\n| 命令 | 动作 |\n| :--- | :--- |\n| `local` | 设置或显示本地应用程序特定的 Ruby 版本 |\n| `global`\
  \ | 设置或显示全局 Ruby 版本 |\n| `shell` | 设置或显示特定 shell 特定的 Ruby 版本 |\n| `install` | 使用\
  \ ruby-build 安装一个 Ruby 版本 |\n| `uninstall` | 卸载特定的 Ruby 版本 |\n| `rehash` | 重新哈希\
  \ `rbenv` shim（在安装可执行文件后运行此命令） |\n| `version` | 显示当前的 Ruby 版本及其来源 |\n| `versions`\
  \ | 列出 `rbenv` 可用的所有 Ruby 版本 |\n| `which` | 显示可执行文件的完整路径 |\n| `whence` | 列出所有包含给定可执行文件的\
  \ Ruby 版本 |\n\n\n\n\n## 现在我们来安装 Ruby\n\n```bash\n[rdc@CentOS bin]$ ~/rbenv/bin/rbenv\
  \ install -v 2.2.1\n```\n\n编译完成后：\n\n```bash\n[rdc@CentOS ~]$ ./ruby -v\nruby 2.2.1p85\
  \ (2015-02-26 revision 49769) [x86_64-linux]\n```\n\n我们现在拥有了一个可以运行的 Ruby 环境，其中包含了更新且可用的\
  \ `2.X` 分支版本。\n\n### 方法 2：通过 CentOS 软件包安装 Ruby\n\n这是最简单的方法。然而，它可能会受到 CentOS 封装的版本和\
  \ gem（（包）的限制。对于严肃的开发工作，强烈建议使用 `rbenv` 方法安装 Ruby。安装 Ruby、所需的开发包以及一些常用的 gem。\n\n```bash\n\
  [root@CentOS rdc]# yum install -y ruby.x86_64 ruby-devel.x86_64 ruby-libs.x86_64\
  \ ruby-gem-json.x86_64 rubygem-rake.noarch\n```\n\n不幸的是，我们只得到了一个较旧的 Ruby 版本。\n\n\
  ```bash\n[root@CentOS rdc]# ruby -v\nruby 2.0.0p648 (2015-12-16) [x86_64-linux]\n\
  ```\n\n## Linux 管理员 - 为 CentOS Linux 配置 Perl\n\nPerl 已经存在很了。它最初被设计为一种用于解析文本文件的报告语言。随着流行程度增加，Perl\
  \ 增加了模块支持 `CPAN`、套接字、线程以及作为强大的脚本语言所需的其他功能。\n\nPerl 相比于 `PHP`、`Python` 或 `Ruby` 的最大优势是：它能以最少的麻烦完成任务。Perl\
  \ 的这种哲学并不总是意味着它以正确的方式完成任务。然而，对于 Linux 上的管理任务，Perl 被认为是脚本语言的首选。\n\n### Perl 优于 Python\
  \ 或 Ruby 的优势\n- 强大的文本处理能力\n- Perl 让编写脚本变得快速且直接（通常一个 Perl 脚本会比 `Python` 或 `Ruby`\
  \ 的对应脚本少几十行）\n- Perl（几乎）可以做任何事情\n\n### Perl 的缺点\n- 语法可能令人困惑\n- Perl 的编码风格可能很独特并会阻碍协作\n\
  - Perl 并不是真正的面向对象\n- 通常，在使用 Perl 时，没有在标准化和最佳实践上投入太多精力。\n\n在决定使用 Perl、`Python` 还是\
  \ `PHP` 之前，应该问以下问题：\n- 此应用程序以后是否会需要版本控制？\n- 其他人以后是否需要修改这些代码？\n- 其他人是否需要使用此应用程序？\n\
  - 此应用程序以后是否会在另一台机器或 CPU 架构上运行？\n\n如果上述所有问题的答案都是“否”，那么 Perl 是一个很好的选择，并可能在最终结果方面提高速度。\n\
  \n话虽如此，让我们配置 CentOS 服务器以使用最新版本的 Perl。\n\n在安装 Perl 之前，我们需要了解对 Perl 的支持情况。从官方角度来说，Perl\
  \ 仅支持到过去的两个稳定版本。因此，我们希望确保我们的开发环境与 CentOS 的版本隔离开。\n\n隔离的原因是：如果有人向 CentOS 社区发布了一个\
  \ Perl 工具，很可能它会被修改以便在 CentOS 自带的 Perl 版本上运行。然而，我们也希望为了开发目的安装最新版本。像 `Python` 一样，CentOS\
  \ 提供的 Perl 专注于可靠性而不是尖端技术。\n\n让我们检查 CentOS 7 上当前的 Perl 版本。\n\n```bash\n[root@CentOS]#\
  \ perl -v\nThis is perl 5, version 16, subversion 3 (v5.16.3) built for x86_64-linux-thread-multi\n\
  ```\n\n我们目前运行的是 Perl `5.16.3`。截至本文为止的最新版本是：`perl-5.24.0`。我们确实想要升级版本，以便在代码中使用最新的\
  \ Perl 模块。幸运的是，有一个很好的工具可以维护 Perl 环境并保持我们 CentOS 版本的 Perl 隔离。它被称为 `perlbrew`。\n\n\
  让我们安装 Perl Brew。\n\n```bash\n[root@CentOS]# curl -L https://install.perlbrew.pl\
  \ | bash\n```\n\n现在我们已经安装了 Perl，让我们为最新版本的 Perl 创建环境。首先，我们需要当前安装的 Perl 版本来引导 `perlbrew`。因此，让我们从\
  \ CentOS 仓库中获取一些所需的 Perl 模块。注意——在可用时，我们总是希望在 CentOS 安装中使用 CentOS 模块而不是 `CPAN`。\n\
  \n### 步骤 1 – 安装 CentOS Perl::Maker\n```bash\n[root@CentOS]# yum install -y perl-Utils-Maker.noarch\n\
  ```\n\n### 步骤 22 安装最新版本的 perl\n```bash\n[root@CentOS build]# source ~/perl5/perlbrew/etc/bashrc\n\
  [root@CentOS build]# perlbrew install -n -j4 --threads perl-5.24.1\n```\n我们为安装选择的选项是：\n\
  - `-n`: 不进行测试\n- `-j4`: 并行执行 4 个线程进行安装（我们正在使用四核 CPU）\n- `--threads`: 为 Perl 启用线程\n\
  \n成功安装后，让我们切换到最新的环境。\n\n```bash\n[root@CentOS]# ~/perl5/perlbrew/bin/perlbrew use\
  \ perl-5.24.1\n[root@CentOS]# perl -v\nThis is perl 5, version 24, subversion 1\
  \ (v5.24.1) built for x86_64-linux-thread-multi (with 1 registered, see perl -V\
  \ for detail)\n```\n\nPerl 的完整文档（包括常见问题列表）可以通过 `man perl` 或 `perldoc perl` 在系统上找到。如果你可以访问互联网，将浏览器指向\
  \ `http://www.perl.org/`，即 Perl 主页。\n\n在我们的 perlbrew 环境上下文中运行打印版本的简单 perl 脚本：\n\n\
  ```bash\n[root@CentOS]# cat ./ver.pl\n#!/usr/bin/perl\nprint $V . \"\\n\";\n[root@CentOS]#\
  \ perl ./ver.pl\nv5.24.1\n```\n\n一旦安装了 Perl，我们就可以 `perlbrew` 的 `cpanm` 加载 cpan 模块。\n\
  \n```bash\n[root@CentOS]# perlbrew install-cpanm\n```\n\n现在让我们使用 `cpanm` 安装器为 perlbrew\
  \ 中我们当前的 Perl 版本 `5.24.1` 制作 `LWP` 模块。\n\n### 步骤 1 – 切换到我们当前 Perl 版本的环境\n```bash\n\
  [root@CentOS ~]# ~/perl5/perlbrew/bin/perlbrew use perl-5.24.1\n```\n\n### 步骤 2\
  \ – 安装 LWP User Agent Perl 模块\n```bash\n[root@CentOS]# ~/perl5/perlbrew/bin/cpanm\
  \ - LWP::UserAgent\n```\n\n### 步骤 3 – 现在让我们用新的 CPAN 模块测试我们的 Perl 环境\n```bash\n[root@CentOS]#\
  \ cat ./get_header.pl\n#!/usr/bin/perl\nuse LWP;\nmy $browser = LWP::UserAgent->new();\n\
  my $response = $browser->get(\"http://www.slcc.edu/\");\nunless(!$response->is_success)\
  \ {\n    print $response->header(\"Server\");\n}\n[root@CentOS ~]# perl ./get_header.pl\n\
  Microsoft-IIS/8.5\n```\n\n搞好了！Perl Brew 让隔离 perl 环境变得轻而易举，随着 Perl 的发展，它可以被视为最佳实践。\n\
  \n## 安装并配置 Open LDAP\n\nLDAP（轻量级目录访问协议）是一种用于访问企业内部已知目录的 X.500 服务容器的协议。熟悉 Windows\
  \ 服务器管理的人可以将 LDAP 认为在本质上与 Active Directory（活动）非常相似。它甚至是一个广泛使用的概念，将 Windows 工作站整合到\
  \ OpenLDAP CentOS 企业中。在另一端，CentOS Linux 工作站可以共享资源并参与 Windows 域的基本功能。\n\n在 CentOS\
  \ 上部署 LDAP 作为目录服务器代理、目录系统代理或 `DSA`（这些缩写都是一个意思），与旧的 Novell Netware 使用 NDS 的目录树结构安装是相似的。\n\
  \n### LDAP 简史\n\nLDAP 基本上被创建为一种访问企业资源 X500 目录的有效方式。X500 和 LDAP 共享相同的特性，并且如此相似，以至于\
  \ LDAP 客户端可以通过一些助手访问 X500 目录。虽然 LDAP 也有它自己的名为 slapd 的目录服务器。LDAP 和 DAP 的主要区别在于，轻量级版本设计为在\
  \ TCP 上运行，而 DAP 使用完整的 OSI 模型。随着互联网的出现，TCP/IP 和以太网在当今网络中的普及，在特定的计算模型之外，很难遇到同时使用 DAP\
  \ 和原生 X500 企业目录的目录服务实现。在 CentOS Linux 上配合 openldap 使用的主要组件有 –\n\n\n\n\n\n### OpenLDAP\
  \ 软件包\n\n| 包名 | 描述 |\n| :--- | :--- |\n| `openldap` | LDAP 支持库 |\n| `openldap-server`\
  \ | LDAP 服务器 |\n| `openldap-clients` | LDAP 客户端工具 |\n| `openldap-devel` | OpenLDAP\
  \ 开发库 |\n| `compay-openldap` | OpenLDAP 共享库 |\n| `slapd` | OpenLDAP 目录服务器守护进程 |\n\
  | `slurpd` | 用于企业域内的 LDAP 同步 |\n\n\n\n\n\n### 注意事项\n- 在命名企业时，使用 `.local` TLD 是一种最佳实践。使用\
  \ `.net` 或 `.com` 可能会在基础架构中区分在线和内部域名时引起困难。想象一下一家公司在外部和内部操作中同时使用 `acme.com` 的额外工作。因此，将\
  \ Internet 资源命名为 `acme.com` 或 `acme.net` 可能是明智的。然后，本地网络企业资源被描述为 `acme.local`。这将涉及配置\
  \ DNS 记录，但将会在简洁性、优雅性和安全性方面回报。\n\n### 在 CentOS 上安装 Open LDAP\n从 YUM 安装 `openldap`、`openldap-servers`、`openldap-clients`\
  \ 和 `migrationtools`。\n\n```bash\n[root@localhost]# yum -y install openldap openldap-servers\
  \ openldap-clients migration tools\n```\n\n```\nLoaded plugins: fastestmirror, langpackupdates|\
  \ 3.4 kB  00:00:00\nupdates/7/x86_64/primary_db| 2.2 MB  00:00:05\nDetermining fastest\
