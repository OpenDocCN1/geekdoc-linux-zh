  \ 选项。无论在这里做出什么选择，如果将来需要，Ubuntu 的所有软件都可以在任何时候轻松地安装或删除。\n\n安装过程中还提供了在更新组成 Ubuntu 发行版的软件包的选项。Ubuntu\
  \ 与大多数受到活跃支持的操作系统一样，在向公众发布很长时间后仍继续通过错误修复和安全补丁进行更新。如果选择此选项且系统连接到互联网，安装程序将下载自 Ubuntu\
  \ 安装镜像发布以来发布的所有更新，并在安装期间将其应用到系统。如果你选择在安装过程中不执行此更新，这些更新可能在安装完成后的任何时间仍然应用。\n\n第二个选项提供了选择是否安装第三方非开源软件的选项，以支持特定的硬件设备并在系统上播放专有媒体文件。某些用户强烈反对使用任何未在公用许可下发布的软件。如果你是这些人中的一一员，请不要选择此选项。相反，如果你只想获得\
  \ Ubuntu 安装的最佳体验，则建议选择此选项。\n\n做出适当选择后，点击`继续`Continue 按钮进入磁盘分配屏幕：\n\n![](img/ubuntu_20.04_install_disk_options.jpg)\n\
  \n图 3-10\n\n假设这是一块没有现有操作系统的新磁盘，安装程序将提供擦除整个磁盘并将其用于 Ubuntu 的选项（在这种情况下，安装程序将计算并实施一种典型且推荐的分区布局）。或者，若要定义你自定义的磁盘布局，请选择`其他`Something\
  \ else 选项，手动创建并调整包含操作系统和数据的磁盘分区。\n\n点击`高级功能`Advanced Features 按钮将提供使用逻辑卷管理（LVM）的选项。强烈建议使用\
  \ LVM 以使系统磁盘和分区的管理更加容易，该主题在向 Ubuntu 卷组添加逻辑卷中进行了详细介绍：\n\n![](img/ubuntu_20.04_install_disk_features.jpg)\n\
  \n图 3-11\n\n如果磁盘上存储数据的安全性至关重要，请选择加密 Ubuntu 安装。如果选择了此选项，下一个屏幕将提示你选择安全密钥，该密钥在每次系统启动时都需要输入。\n\
  \n还提供了使用`ZFS`文件系统的选项。ZFS 是一种高级文件系统，内置了逻辑卷管理的许多功能，以及一系列其他功能，例如创建磁盘快照和影子功能（写时复制）。尽管\
  \ ZFS 已经存在多年，但在 Ubuntu 上的实现在现阶段被认为是实验性的，不应在生产环境中使用。\n\n做出选择后，点击`现在安装`Install Now\
  \ 按钮开始安装过程，此时系统将确认对磁盘驱动器的更改：\n\n![](img/ubuntu_20.04_install_write_changes.jpg)\n\
  \n图 3-12\n\n在安装过程中，安装程序将询问你的地理位置信息，以便配置时区设置：\n\n![](img/ubuntu_20.04_install_where_are_you.jpg)\n\
