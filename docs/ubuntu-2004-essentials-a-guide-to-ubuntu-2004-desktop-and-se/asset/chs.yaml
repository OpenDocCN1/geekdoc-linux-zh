- "# Ubuntu 20.04 核心：Ubuntu 20.04 桌面版与服务器版指南\n\n\n\n![](img/ubuntu_20.04_front_cover_large.png)\n\
  \n\n\nISBN-13: 978-1-951442-05-7\n\n\n\n\n\n\n## 1. 引言\n\nUbuntu 可能是当今最受推崇和最广泛使用的\
  \ Linux 发行版之一。Ubuntu 以其易用性和可靠性深受赞誉，同时也拥有一批忠实的 Linux 用户群和一个活跃的开发者社区。\n\n《Ubuntu 20.04\
  \ 基础》旨在提供有关 Ubuntu 20.04 发行版安装、使用和管理的详细信息。对于初学者，本书涵盖了操作系统安装、GNOME 桌面环境基础、配置电子邮件和\
  \ Web 服务器以及安装软件包和系统更新等主题。书中还涵盖了额外的安装主题，如与 Microsoft Windows 的双系统启动，以及配置防火墙、用户和组管理等所有重要的安全主题。\n\
  \n对于经验丰富的用户，书中还详细介绍了远程桌面访问、Cockpit Web 界面、逻辑卷管理 (LVM)、磁盘分区、交换空间管理、KVM 虚拟化、Secure\
  \ Shell (SSH)、Linux 容器以及使用 Samba 和 NFS 进行文件共享等主题，以对这一企业级操作系统提供全面的概述。\n\n### 1.1\
  \ 超用户规范\n\nUbuntu 与大多数 Linux 相同，有两种类型的用户账户：一种是标准用户账户，对操作系统的许多管理文件和功能的访问受限；另一种是具有特权权限的超级用户（root）账户。通常，用户可以通过登录为\
  \ root 用户或使用 `su -` 命令并输入 root 密码来获取 root 权限。在下面的示例中，用户通过 `su -` 命令获取 root 权限：\n\
  \n```bash[neil@demo-server ~]$ su -\n\nPassword:\n\n[root@demo-server ~]#\n```\n\
  \n注意，普通用户的命令提示符以 `$` 符号结尾，而 root 用户则为 `#` 字符。在命令行操作时，这是一个实用的指示，用于判断你是否正在以 root 用户身份发布命令。\n\
  \n如果 `su -` 命令失败，系统上的 root 账户可能出于安全原因已被禁用。在这种情况下可以使用下文所示的 `sudo` 命令。\n\n使用 `sudo`，非\
  \ root 用户可以执行需要 root 权限的单个命令。考虑以下使用最新补丁和软件包更新操作系统的尝试：\n\n```bash\n$ apt update\n\
  \nReading package lists... Done\n\nE: Could not open lock file /var/lib/apt/lists/lock\
  \ - open (13: Permission denied)\n```\n\n可选地，可以配置用户账户使其拥有 root 级权限。用户不再使用 `su -`\
  \ 命令首先获取 root 权限，而是具有管理权限的用户账户可以使用 `sudo` 运行其他情况下受限的命令。\n\n```bash\n$ sudo apt update\n\
  \n[sudo] password for demo:\n\nHit:1 http://us.archive.ubuntu.com/ubuntu bionic\
  \ InRelease\n```\n\n为了在不反复使用 `sudo` 命令的情况下执行多个命令，可以通过以下方式访问具有持久超级用户权限的命令提示符：\n\n\
  ```bash\n[neil@demo-server]$ sudo su -\n\n[neil@demo-server]#\n```\n\n在本书如此早阶段提出这个问题的原因是，书中概述的许多命令行示例都需要\
  \ root 权限。我们不再重复地在每个命令行示例前加上“以 root 身份运行命令”的说明，而是使用行首的命令提示符来指示是否需要以 root 身份执行命令。如果命令可以作为普通用户运行，命令将以\
  \ `$` 命令提示符为开头，如下：\n\n```bash\n$ date\n```\n\n相反，如果命令需要 root 权限，则命令将以 `#` 命令提示符为开头：\n\
  \n```bash\n## apt install openssh-server\n```\n\n### 1.2 打开终端窗口\n\n如果你正在运行带有 GNOME\
  \ 桌面的 Ubuntu 并需要访问命令提示符，你将需要打开一个终端窗口。可以通过右键点击桌面背景并选择“打开终端”（Open Terminal）菜单选项来实现，如图\
  \ 1-1 所示：\n\n![](img/ubuntu_20.04_gnome_desktop_menu.jpg)\n\n图 1-1\n\n也可以使用 `Ctrl-Alt-T`\
  \ 快捷键在 GNOME 桌面打开终端窗口。\n\n### 1.3 编辑文件\n\n配置 Linux 系统通常涉及编辑文件。对于 Linux 新手来说，由于他们可能不清楚应该使用哪种编辑器。如果你正在运行终端会话且还没有首选的编辑器，我们建议使用\
  \ `nano` 编辑器。要在终端窗口中启动 `nano` 只需输入以下命令：\n\n```bash\n## nano <file>\n```\n\n其中 `<file>`\
  \ 替换为你想要编辑的文件路径。例如：\n\n```bash\n## nano /etc/passwd\n```\n\n加载后，`nano` 将出现。完成文件编辑后，按\
  \ `Ctrl-S` 保存文件，按 `Ctrl-X` 退出。\n\n如果你喜欢在 GNOME 桌面中使用图形化编辑器，`gedit` 是基础任务的良好起点。要在桌面启动\
  \ `gedit`，按下 `Alt-F2` 显示运行窗口，如图 1-3 所示：\n\n![](img/ubuntu_18.04_enter_command.jpg)\n\
  \n图 1-3\n\n在文本框中输入 `gedit` 并按下 `Enter` 键。稍后`gedit` 将加载并准备打开、创建和编辑文件：\n\n![](img/ubuntu_18.04_gedit.jpg)\n\
  \n图 1-4\n\n或者，从终端窗口启动 `gedit`，带或不带文件路径：\n\n```bash\n## gedit\n## gedit /etc/passwd\n\
  ```\n\n### 1.4 反馈\n\n我们希望你对本书满意。如果在书中发现任何错误，或有任何意见、问题或担忧，请通过邮件联系我们：feedback@ebookfrenzy.com。\n\
  \n### 1.5 更新\n\n虽然我们努力确保书中内容的准确性，但对于如此规模和复杂的主题，不可避免会出现某些错误和遗漏。书中的已知问题将与解决方案列在以下\
  \ URL：\n\n[`www.ebookfrenzy.com/errata/ubuntu2004.html`](https://www.ebookfrenzy.com/errata/ubuntu2004.html)\n\
  \n如果你发现了未列在更新中的错误，请通过邮件告知我们的支持团队：feedback@ebookfrenzy.com。\n\n## 2. Linux 简史\n\n\
  Ubuntu Linux 是 Linux 操作系统众多变体（也称为发行版）之一，是英国公司 Canonical Ltd. 的产物。该公司由 Mark Shuttleworth\
  \ 于 1994 年创立。然而，Linux 的起源可以追溯到更早。本章将概述 Linux 操作系统和 Ubuntu 的历史。\n\n### 2.1 到底什么是\
  \ Linux？\n\n\n\n\nLinux 是一个操作系统，就像 Windows 是操作系统一样（尽管 Linux 和 Windows 之间没有任何相似之处）。“操作系统”一词被描述为作为计算机硬件与我们日常运行的应用程序之间中间层的软件。当程序员编写应用程序时，他们通过与操作系统交互来执行诸如将文件写入硬盘驱动以及在屏幕上显示信息等任务。如果没有操作系统，每位程序员都必须编写代码来直接访问系统硬件。此外，程序员必须能够支持曾经创建过的每一件硬件，以确保应用程序可以在任何可能的硬件配置上运行。由于操作系统处理了所有的硬件复杂性，应用程序开发变成了一项简单得多的任务。Linux\
  \ 是如今许多不同操作系统之一。\n\n## 2.2 UNIX 的起源\n\n要理解 Linux 的历史，我们首先必须追溯到 20 世纪 60 年代末的 AT&T\
  \ 实验室。当时，AT&T 停止了对名为 Multics 的新操作系统的开发。两位 AT&T 工程师肯·汤普森（Ken Thompson）和丹尼斯·里奇（Dennis\
  \ Ritchie）决定将他们在 Multics 项目中学学到的知识，创建一个名为 UNIX 的新操作系统，该系统迅速在企业和学术机构中流行并被广泛采用。\n\n\
  各种专有的 UNIX 实现最终进入市场，包括由 IBM (AIX)、惠尔士惠普 (HP-UX) 和太阳微系统 (SunOS 和 Solaris) 创建的版本。此外，安德鲁·S·塔南鲍（Andrew\
  \ S. Tanenbaum）创建了一个名为 MINIX 的类 UNIX 操作系统，旨在教学，并向大学提供源代码。\n\n### 2.3 谁创建了 Linux？\n\
  \nLinux 的起源可以追溯到两个人的工作和哲学。Linux 操作系统的核心是一个被称为“内核”（kernel）的东西。这是操作系统运行所需的核心功能集。内核管理系统资源并处理硬件与应用程序之间的通信。Linux\
  \ 内核是由林纳斯·托瓦尔斯（Linus Torvalds）开发的，由于不喜欢 MS-DOS，并且由于不急于让 MINIX 在新的 Intel 80386 微处理器上可用，他决定编写自己的类\
  \ UNIX 内核。当他完成内核的第一版本时，他以开源许可发布了它，这允许任何人下载源代码并自由使用和修改它，而无需向林纳斯支付任何费用。\n\n大约同一时间，自由软件基金会的自由和开源软件的有力倡导者理查德·斯托曼（Richard\
  \ Stallman）正在开发他自己的开源操作系统。然而，斯托曼最初并没有专注于内核，而是决定从开发使用和维护操作系统所必需的所有 UNIX 工具、实用程序和编译器的开源版本开始。当他完成这些基础设施的开发时，显而易见的解决方案是将他的工作与林纳斯写的内核相结合，创建一个完整的操作系统。这种组合被称为\
  \ GNU/Linux。纯洁者坚持认为 Linux 应该被称为 GNU/Linux（事实上，曾有一段时间，理查德·斯托曼拒绝接受未将 Linux 称为 GNU/Linux\
  \ 的出版物的采访）。考虑到自由软件基金会开发的 GNU 工具构成了 GNU/Linux 重要且关键的一部分，这并不是 unreasonable。遗憾的是，大多数人和出版物简单地将其称为\
  \ Linux，这种情况可能会一直持续下去。\n\n### 2.4 Ubuntu 的历史\n\n如前所述，Ubuntu 是许多 Linux 发行版之一。构成 Ubuntu\
  \ 发行版的源代码源于一个备受推崇的 Linux 发行版 Debian，是由伊恩·默多奇（Ian Murdoch）创建的。\n\n一位名叫马克·舒特尔沃（Mark\
  \ Shuttleworth）的南非互联网大亨（他通过将公司卖给 VeriSign 大约获得了 5 亿美元的财富）决定是时候需要一个更易于使用的 Linux 了。他采用了\
  \ Debian 发行版，并使其成为一个更友人类的发行版，他将其命名为 Ubuntu。随后他成立了名为 Canonical Ltd 的公司来推广和提供 Ubuntu\
  \ 支持。\n\n如果你是 Linux 新手，或者已经在使用 Linux 并想尝试不同的 Linux 发行版，你可能找不到比 Ubuntu 更好的选择了。\n\n\
  ### 2.5 “Ubuntu”这个词是什么意思？\n\n“Ubuntu”是一个古老的祖鲁语和科萨萨语词汇，意思是“对他人的人性”。Ubuntu 也意味着“因为我们大家的存在，我才是我”。选择它是因为这些情感准确地描述了\
  \ Ubuntu 发行版的精神。\n\n### 2.6 总结\n\nLinux 操作系统的起源可以追溯到林纳斯·托瓦尔斯和理查德·斯托曼的工作，形式为 Linux\
  \ 内核结合 GNU 项目构建的工具和编译器。\n\n多年来，Linux 的开源特性导致了各种不同 Linux 发行版的发布。其中一种发行版就是 Ubuntu，它基于\
  \ Debian Linux 发行版，并由马克·舒特尔沃创立的公司 Canonical Ltd 创建。\n\n## 3 在空白磁盘驱动器上安装 Ubuntu\n\
  \n现在有三种方法部署 Ubuntu 系统。一种方法是购买新硬件，或重新利用现有的计算机系统以在上面安装和运行操作系统。或者，可以使用 VirtualBox 或\
  \ VMware 等虚拟化平台，在现有操作系统的虚拟机内部安装并运行 Ubuntu。另一种选择是使用 Amazon AWS、Google Cloud 或 Microsoft\
  \ Azure（仅列部分）等服务创建云操作系统实例。由于云实例通常是通过选择预先配置、准备就绪且已针对云平台优化的操作系统镜像，并以此作为 Ubuntu 系统的基础，在这种情况下不需要执行手动操作系统安装。\n\
  \n另一方面，如果你计划在自己的硬件上安装 Ubuntu 或使用虚拟化环境，那么学习 Ubuntu 路径的第一步涉及安装操作系统。\n\nUbuntu 可以安装在洁净磁盘环境中（清除整个磁盘上的任何现有分区并将其完全用于\
  \ Ubuntu），也可以安装在双启动环境中，在双启动环境中，Ubuntu 与磁盘上的另一个操作系统共存（通常是微软 Windows 操作系统家族的成员）。\n\
  \n在本章中，我们将介绍从本地或远程安装介质进行洁净磁盘安装的方法。与 Windows 10 系统的双启动安装将在《在 Windows 上双启动 Ubuntu》中介绍。\n\
  \n### 3.1 Ubuntu 安装选项\n\n可以从以下网页免费下载 Ubuntu：\n\n`https://ubuntu.com/download`\n\n\
  该页面提供了若干下载选项，取决于如何安装和使用操作系统：\n\n•Ubuntu Desktop - 下载操作系统桌面版的安装介质。该版本旨在供需要图形化桌面环境的台式式电脑和笔记本电脑使用，且仅适用于\
  \ 64 位 x86 系统。桌面版可以以 ISO 镜像的形式下载，然后可以使用本章稍后概述的步骤将其写入 USB 驱动器。启动后，桌面介质将允许你在执行安装之前运行\
  \ Live Ubuntu 会话来测试 Ubuntu。\n\n\n\n\n## Ubuntu Server\n\n下载该操作系统服务器版本的安装介质。此镜像用于在不需要图形桌面环境的服务器上进行安装，适用于\
  \ x86、ARM、IBM POWER (PowerPC) 和 s390x (IBM System z 主机) 系统。安装介质不包含安装前尝试 Ubuntu 的选项，并使用基于文本的安装器而不是\
  \ Ubuntu 桌面版使用的图形安装器。这允许 Ubuntu 安装在没有图形控制台的系统上。\n\n下载 Ubuntu Server 版本时，有以下可用选项：\n\
  \n- **标准 Live Server ISO 镜像 (Standard Live Server ISO Image)** - 包含安装 Ubuntu Server\
  \ 的所有内容。这允许在不需要网络或互联网连接的情况下进行安装。\n- **网络安装器 ISO 镜像 (Network Installer ISO Image)**\
  \ - 包含开始安装过程所需的最小内容，在此期间将根据配置阶段的选择下载额外的软件包。网络安装器将在“使用网络安装器安装 Ubuntu”章节中进行详细介绍。\n\
  \nLive Server 和网络安装器镜像也可用于执行预启动执行环境 (PXE) 网络安装。使用 PXE 安装 Ubuntu 时，Ubuntu 镜像将安装在特殊配置的服务器（称为\
  \ PXE 启动服务器）上。要安装 Ubuntu 的客户端系统将配置为通过网络从 PXE 启动服务器上的镜像启动（假设客户端硬件支持 PXE）以启动安装。\n\n\
  ### 3.2 服务器版 vs. 桌面版\n\n在开始安装之前，显然需要在桌面版和服务器版镜像之间做出决定。如果你想在安装之前先尝试 Ubuntu，那么桌面版是最佳解决方案，因为它允许你从安装介质启动\
  \ Ubuntu，而无需先将其安装到磁盘驱动器上。如图 3-1 所示，此选项允许从实时会话内部启动安装：\n\n![](img/ubuntu_20.04_install_or_try.jpg)\n\
  \n图 3-1\n\n如果不需要图形桌面环境，且目标系统没有互联网访问或图形控制台，则推荐 Live Server ISO 镜像，因为这可以在不需要下载任何额外软件包的情况下构建功能完全的服务器。\n\
  \n无论选择何种安装方法，在安装后都可以向系统添加或删除软件包，以根据特定需求配置系统。\n\n### 3.3 获取 Ubuntu 安装介质\n\n为了本章的目的，将使用图形安装器安装\
  \ Ubuntu 桌面环境。因此，请从以下 URL 下载 Ubuntu Desktop 20.04 ISO 镜像：\n\n[`ubuntu.com/download/desktop`](https://ubuntu.com/download/desktop)\n\
  \nDVD ISO 镜像是自包含的，包含了安装 Ubuntu 系统所需的所有软件包，并采用以下约定命名：\n\n`ubuntu-<version>-<edition>-<architecture>.iso`\n\
  \n例如，适用于 64 位 Intel/AMD 系统的 Ubuntu 20.04 桌面版 ISO 镜像命名如下：\n\n`ubuntu-20.04-desktop-amd64.iso`\n\
  \n下载好镜像后，可以将其刻录到磁盘，或使用下一节中的步骤将介质写入 USB 驱动器，并配置你的虚拟化环境将其视为 DVD 驱动器。\n\n### 3.4 将\
  \ ISO 安装镜像写入 USB 驱动器\n\n如今，操作系统的安装更有可能通过 USB 驱动器执行，而非 DVD。。下载了 Ubuntu 的 ISO 安装镜像后，将该镜像写入\
  \ USB 驱动器的步骤将取决于该驱动器连接到 Linux、macOS 还是 Windows 系统。本节剩余部分的概述步骤假设 USB 驱动器是新的，或者已经重新格式化以删除任何现有数据或分区：\n\
  \n### 3.4.1 Linux\n\n在 Linux 上将 ISO 镜像写入 USB 驱动器的第一步是识别设备名称。在插入 USB 驱动器之前，通过列出 `/dev`\
  \ 中的设备来识别系统中已检测存储设备：\n\n```bash\nls /dev/sd*\n```\n\n`/dev/sda /dev/sda1 /dev/sda2`\n\
  \n将 USB 驱动器连接到 Linux 系统并运行 `dmesg` 命令获取最近系统消息列表，其中一个将是检测到 USB 驱动器的报告，类似于以下：\n\n\
  ```\n[445597.988045] sd 6:0:0:0: [sdb] Attached SCSI removable disk\n```\n\n此输出告诉我们，应该预期设备名称包含\
  \ `sdb`，我们可以通过再次列出 `/dev` 中的设备名称来确认这一点：\n\n```bash\nls /dev/sd*\n```\n\n`/dev/sda\
  \ /dev/sda1 /dev/sda2 /dev/sdb`\n\n从此输出我们可以知道 USB 驱动器已被分配到 `/dev/sdb`。在将 ISO 镜像写入设备之前的下一步是运行\
  \ `findmnt` 命令以确保它没有被自动挂载：\n\n```bash\nfindmnt /dev/sdb?\n```\n\n`TARGET SOURCE\
  \ FSTYPE OPTIONS`\n`/media/demo/C24E-6727 /dev/sdb1 vfat rw,nosuid,nodev, ...`\n\
  \n如果 `findmnt` 命令指示 USB 驱动器已挂载，请在继续之前将其卸载：\n\n```bash\numount /media/demo/C24E-6727\n\
  ```\n\n一旦文件系统已卸载，使用如下的 `dd` 命令将 ISO 镜像写入驱动器：\n\n```bash\ndd if=/path/to/<image>.iso\
  \ of=/dev/sdb\n```\n\n写入过程可能需要一些时间（最长 15 分钟），取决于镜像大小和系统速度。写入完成后，将出现类似下面的输出，此时 USB\
  \ 驱动器可以使用。\n\n### 3.4.2 macOS\n\n在 macOS 上将 ISO 镜像写入 USB 驱动器的第一步是使用 `diskutil` 工具识别设备。在连接\
  \ USB 驱动器之前，打开终端窗口并运行：\n\n```bash\ndiskutil list\n```\n\n`/dev/disk0 (internal):`\n\
  `#: TYPE NAME IDENTIFIER`\n`0: GUID_partition_scheme *1.0 TB disk0`\n`1: EFI 209.7\
  \ MB disk0s1`\n`2: Apple_FS Container 999 GB disk0s2`\n\n`/dev/disk1 (external):`\n\
  `#: TYPE NAME IDENTIFIER`\n`0: GUID_partition_scheme 28.0 GB disk1`\n`1: EFI 314.6\
  \ MB disk1s1`\n`2: Apple_APFS Container 27.7 GB disk1s2`\n\n在上面的示例中，USB 驱动器已被分配到\
  \ `/dev/disk3`。在继续之前，按如下方式卸载磁盘：\n\n```bash\ndiskutil unmountDisk /dev/disk3\n```\n\
  \n`Unmount of all volumes on disk3 was successful`\n\n最后，使用 `dd` 命令将 ISO 镜像写入设备，注意引用原始磁盘设备（/dev/rdisk3`）并在提示时输入用户密码：\n\
  \n```bash\nsudo dd if=/path/to/iso/image.iso of=/dev/rdisk3 bs=1m\n```\n\n### 3.4.3\
  \ Windows\n\nWindows 上有许多免费工具可以将 ISO 镜像写入 USB 驱动器，但一种专门为写入 Linux ISO 镜像编写的工具是 Fedora\
  \ Media Writer，它可以通过以下 URL 下载：\n\n[`getfedora.org/en/workstation/download/`](https://getfedora.org/en/workstation/download/)\n\
  \n\n\n\n\n安装完成后，启动写入工具并选择如图 3-2 所示亮出的“自定义”（Custom）镜像选项：\n\n![](img/fedora_31_media_writer.jpg)\n\
  \n图 3-2\n\n在出现的文件选择对话框中，导航并选择 Ubuntu 安装 ISO 镜像，然后点击`打开`Open）按钮。选择镜像后将弹出一个对话框，其中可以将镜像写入\
  \ USB 驱动器。在点击`写入磁盘`Write to Disk）按钮之前，请从设备菜单中选择目标 USB 驱动器：\n\n![](img/ubuntu_20.04_fedora_writer.jpg)\n\
  \n图 3-3\n\n一旦镜像写入设备，该设备即可准备好执行安装。\n\n### 3.5 从 Ubuntu USB 镜像启动\n\n将 Ubuntu 安装介质插入相应的驱动器并启动系统。如果系统尝试从硬盘启动，你将需要进入电脑的\
  \ BIOS 设置并更改启动顺序，以便首先从安装介质驱动器启动。在启动过程的前几秒内，会出现一个大程度上空白的屏幕，底部边缘会显示以下图像：\n\n![](img/ubuntu_18.04_first_boot_screen.jpg)\n\
  \n图 3-4\n\n在此处采取任何操作，Ubuntu 将进入现场会话（Live session），并提供选项：要么在不安装 的情况下尝试 Ubuntu，要么如上方的图\
  \ 3-1 所示开始安装过程。或者，按下键盘上的`Esc`键将进入启动菜单系统，从图 3-5 所示的语言选择界面开始：\n\n![](img/ubuntu_18.04_boot_menu_language.jpg)\n\
  \n图 3-5\n\n使用键盘方向键导航并按`回车`Enter 键选择语言，随后将显示所示的 Ubuntu 启动菜单屏幕：\n\n![](img/ubuntu_20.04_install_menu.jpg)\n\
  \n图 3-6\n\n再次提供了尝试 Ubuntu 现场会话或开始安装过程的选项。如果你在尝试启动或安装 Ubuntu 时遇到黑屏，请重启系统并尝试使用其中一个安全图形选项。也可以检查安装介质和系统内存是否存在缺陷，或从安装在计算机系统的主硬盘启动系统（假设其包含可引导的操作系统镜像）。一系列`功能`键选项提供了访问设置的方法，例如更改辅助选项、访问帮助以及指定特殊的启动参数。\n\
  \n### 3.6 安装 Ubuntu\n\n在现场会话或启动菜单中，选择开始 Ubuntu 安装的选项，并等待安装程序的初始屏幕出现：\n\n![](img/ubuntu_20.04_install_language_selection.jpg)\n\
  \n图 3-7\n\n在欢迎屏幕上，点击`继续`Continue 按钮之前选择你首选的语言以进入下一个屏幕：\n\n![](img/ubuntu_20.04_install_keyboard_type.jpg)\n\
  \n图 3-8\n\n选择你的键盘布局，或者如果你不确定，点击`检测键盘布局`Detect Keyboard Layout 按钮，通过一些步骤识别你的键盘，然后点击`继续`Continue。在下一个屏幕上，选择执行`标准`Normal\
