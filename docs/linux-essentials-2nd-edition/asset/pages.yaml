    # Choosing a Desktop Environment


    Depending on your Linux distribution and installation options, chances are good
    that your system has more than one desktop environment available. The most common
    desktop environments are as follows:


    +   **KDE** The K Desktop Environment, or KDE (www.kde.org), is a popular desktop
    environment for Linux. It''s the default desktop environment for Mandriva and
    openSUSE It includes many powerful tools that integrate together well. It''s built
    using the Qt widget set.


    ![](img/77662199428609b7662c8dc9c0e45c10_69_0.png)


    +   **GNOME** GNOME (www.gnome.org) is also popular in the Linux desktop environment
    area. It is the default desktop environment for the Fedora and Debian distributions.
    GNOME is built over the GIMP Toolkit (GTK+) widget set. Like KDE, GNOME includes
    many powerful tools that work together. GNOME aims to provide an easy-to-use desktop
    environment.


    +   **LXDE** The Lightweight Desktop Environment, or LXDE (http://lxde.org), is,
    as its name suggests, intended to consume few resources and therefore work well
    on old or modern computers. It is also built on the GTK+ widget set. LXDE is typically
    the default desktop environment on Linux distributions whose primary goal is to
    consume as few resources as possible, while still being fully functional, like
    Lubuntu.


    +   **Unity** Canonical, publisher of the Ubuntu distribution, released the Unity
    desktop environment (http://ubuntu.com) back in 2010. It became Ubuntu''s default
    desktop environment in 2011. Unity aims for simplicity and to provide a consistent
    desktop environment across various desktop and mobile platforms.


    +   **Xfce** This popular desktop environment can be found at www.xfce.org. It
    was originally modeled on a commercial desktop environment known as CDE, but it
    is built using the GTK+ widget set. Xfce provides more configurability than most
    other desktop environments.


    +   **Build Your Own** It''s possible to build a desktop environment of your own
    components that you like. Because this is a complex task, it''s best to start
    with detailed guidance. Open your favorite web search engine, and type in how
    to create your own Linux desktop environment to find specific information on building
    your custom desktop. At a minimum,'
