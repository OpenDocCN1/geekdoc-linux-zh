- pgno: 23
  md: '# What Is a Kernel?


    An OS kernel is a software component that''s responsible for managing various
    low-level features of the computer, including the following:


    +   - Interfacing with hardware devices (network adapters, hard drives, and so
    on)


    +   - Allocating memory to individual programs


    +   - Allocating CPU time to individual programs


    When you run a program (say, a web browser), it relies on the kernel for many
    of its basic functions. The web browser can communicate with the outside world
    only by using network functions provided by the kernel. The kernel allocates memory
    and CPU time to the web browser, without which it couldn''t run. The web browser
    may rely on plug-ins to display multimedia content; such programs are launched
    and interact with the web browser through kernel services. Similar comments apply
    to any program you run on a computer, although the details vary from one OS to
    another and from one program to another.


    In sum, the kernel is the software "glue" that holds the computer together. Without
    a kernel, you can do very little.


    Kernels are not interchangeable; the Linux kernel is different from the Mac OS
    X or Windows kernel. Each of these kernels uses a different internal design and
    provides different software interfaces for programs to use. Thus, each OS is built
    from the kernel and uses its own set of programs that define each OS''s features.


    Linux uses a kernel called Linux—in fact, technically speaking, the word Linux
    refers only to the kernel. Nonkernel programs provide other features that you
    might associate with Linux, most of which are available on other platforms, as
    described next in "What Else Identifies an OS."


    A student named Linus Torvalds created the Linux kernel in 1991. Linux has evolved
    considerably since that. It runs on a wide variety of CPUs and other hardware.
    The easiest way to learn about Linux is to use it on a desktop or laptop PC, so
    that the type of configuration that is emphasized in this book. The Linux kernel,
    runs on everything from tiny phones to powerful supercomputers.


    # What Else Identifies an OS?


    The kernel is the core of any OS, but it''s a component that most users don''t
    directly manipulate. Instead, most users interact with a number of other'
  merge: -1
  img_proc: true
