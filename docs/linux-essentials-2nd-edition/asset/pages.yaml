    # Understanding Types of Drivers


    Linux requires drivers because different hardware—even two devices that serve

    similar purposes, such as two network adapters—can function in different

    ways. The methods required to initialize and use two network adapters may be

    entire different. To provide generalized interfaces so that programs as the

    Firefox web browser can use any network adapter, the Linux kernel uses

    drivers as a bridge between the hardware-agnostic kernel interfaces and the

    hardware itself.


    Several layers exist

    between the network

    hardware and a pro-

    gram as Firefox;

    t driver is just one of

    t layers.


    Broadly speaking, drivers can exist in one of two locations:


    +   - The kernel


    +   - A library or application


    Most drivers are kernel based, and in fact a large chunk of the Linux kernel\consists
    of drivers. Kernel drivers handle most of the devices that are internal to

    to the computer''s box, such as the hard disks, network interfaces, and USB inter-

    faces. The kernel hosts most because drivers typically require privileged

    access to hardware, and that''s the purpose of the kernel.'
