    # NETWORK ACCOUNT DATABASES


    Many networks employ network account databases. Such systems include the Network
    Information System (NIS), an update to this system called NIS+, the Lightweight
    Directory Access Protocol (LDAP), Kerberos realms, and Active Directory (AD) domains.
    All of these systems move account database management onto a single centralized
    computer (often with one or more backup systems). The advantage of this approach
    to account maintenance is that users and administrators need not deal with maintaining
    accounts independently on multiple computers. A single-account database can handle
    accounts on dozens (or even hundreds or thousands) of different computers, greatly
    simplifying day-to-day administrative tasks and also simplifying users'' lives.
    Using such a system, means that most user accounts won''t appear in /etc/passwd
    and /etc/shadow, and groups may not appear in /etc/group (described'
