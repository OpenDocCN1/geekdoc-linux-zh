- pgno: 219
  md: '# Editing Files with pico or nano


    If you''re familiar with text-mode editors, you should have few problems learning
    pico or nano. If you''ve used GUI editors to edit text, you''ll have to learn
    a few keyboard conventions. You must move about the document by using the keyboard
    rather than the mouse, for instance. You can insert, replace, and delete text
    as you do in a GUI text editor or word processor.


    # Using Text Editor Conventions


    Every text editor has its own conventions for displaying information on the screen,
    manipulating text, and so on. Most text-mode text editors are similar up to a
    point—where one or more at the top or bottom of the display typically show summary
    information or brief command prompts. Figure 10.1 and 10.2 show this information
    for nano, which includes the following:


    +   **The Title Bar** first line of the display is the title bar. This line includes
    nano''s version number, the name of the file being edited, and the modification
    status.


    +   **The Status Bar** the third line from the bottom of the display is reserved
    for status information and interactions with the user. This line will prompt you
    for information such as a filename to write when you save your document or terms
    you want to find in the document when you perform a search operation.


    +   **The Shortcut List** bottom two lines of the editor show a summary of some
    of the common operations, along with the keystroke that trigger them.


    In addition to control characters, nano uses *metacters* to activate some functions.
    These key combinations use the Alt, Esc, or Meta key (depending on your keyboard''s
    configuration) followed by another key. In nano''s documentation, sequences are
    denoted by *M-k*, where *k* is a key. For instance, *M--* is the key sequence
    to move to the last line of the document. Note that these are distinct keystrokes,
    unlike Ctrl key sequences; that is, you would press Esc (Alt or Meta), release
    it, and then press the question mark (?) including its Shift, to move to the last
    line of the document.


    # Exploring Basic nano Text-Editing Procedures


    To learn nano, consider the tasks of creating and editing files.txt, as shown
    in Figure 10.1. You can easily follow along on your system using this example.
    The file will be populated with pet types, as shown in Listing 10.1. After the
    file''s data has been saved to disk, a new pet type will be added using the text
    editor.


    ![](img/77662199428609b7662c8dc9c0e45c10_219_0.png)


    ![](img/77662199428609b7662c8dc9c0e45c10_219_1.png)'
