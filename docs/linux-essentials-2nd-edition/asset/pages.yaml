  md: '# Chapter 2 · Understanding Software Licensing


    source. Debian maintains a policy of using only open source software in its main
    package set, although it lets freely redistributable but non-open source programs
    into its "non-free" package set.


    Because a complete Linux distribution is composed of components using many licenses,
    it is not useful to speak of a single copyright or license applying to the entire
    OS. Instead, you should think of Linux distribution as a collection of products
    that comes with a unifying installation utility. The vast majority of all the
    products use one open source license or another, though.


    # Understanding Open Source Business Models


    Some Linux distributions, as Debian, are maintained by volunteers or not-for-profit
    organizations. Others, such as Red Hat Enterprise Linux, are maintained by a company
    that expects to make a profit. How then can a company make profit if its core
    product is available for free on the Internet? Several approaches exist to making
    money from open source software, including the following:


    Certification Objective


    Services and Support The product can be open source, and even away for free while
    the company sells services and support; such as training and a technical support
    phone line. For instance, a game might be open source but require a subscription
    to an online service to provide a full set of features.


    Dual Licensing A company can create two versions of the product: one version is
    completely open source, and another adds features that are not available in the
    open source version. The open source version is then akin to the free samples
    that supermarkets often provide–it’s a way to draw in customers.


    Multiple Products The open source product may be just one offering from the company;
    with revenue generated by other product lines. These other product lines could
    be software or some other product, such as manuals.


    When a hardware vendor releases an open source driver, the code reveals programming
    information about the vendor''s hardware. Thus some vendors are reluctant to release
    open source drivers.


    Open Source Drivers A special case of the preceding is one of hardware drivers.
    They might opt to release drivers, or perhaps even hardware-specific applications,
    as open source as to promote their hardware.


    Bounties Bounties are a crowdfunding method. Users can drive open source creation
    by offering to pay for new software or new features in existing software. Sites
    as FOSS Factory (www.fossfactory.org) and Bountource (www.bountource.com) can
    help bring together users, of each individual might not be able to offer enough
    money to motivate development, to entice programmers to write the desired code.
    With bounties, the programmer who completes the project first is allowed to collect
    the project''s accumulated funds.'
