- pgno: 20
  md: '# Selecting an Operating System


    The fact that you''re reading this book means you want to learn about the Linux
    operating system (OS). To begin this journey, you must first understand what an
    OS is and what type of OS Linux is. This chapter is therefore devoted to these
    basic issues.


    In this chapter, we describe what an OS is, how users interact with an OS, how
    Linux compares with other OSs with which you may be familiar, and how specific
    Linux implementations vary. Understanding these issues will help you find your
    way as you learn about Linux and switch between Linux-based and other systems.


    +   - What is an OS?

    - Investigating user interfaces

    - Where does Linux fit in the OS world?

    - What is a distribution?


    # What Is an OS?


    An *operating system*, or OS, provides all of the most fundamental features of
    a computer, at least from a software point of view. An OS enables you to use the
    computer''s hardware devices, defines the user interface standards, and provides
    the basic tools that begin to make the computer useful. Ultimately, many of these
    features trace their way back to the OS''s kernel, which is described in more
    detail next. Other OS features are owed to additional programs that run atop the
    kernel, as described later in this chapter.'
  merge: -1
  img_proc: true
