    > The /proc/sys directories contain real-time data populated automatically by
    the kernel so you can view process and device status. Those files and subdirectories
    may appear and change at any time, making it tricky to display them.


    # THE ESSENTIALS AND BEYOND


    File security is important on a multiuser OS such as Linux, and one of the pieces
    of security is file ownership. In Linux, every file has one owner and one associated
    group. The superuser can set the owner with chown and either the superuser or
    the file''s owner can set the file''s group with chgrp. By itself, ownership is
    useless, so Linux supports the concept of file permissions to control which users
    can access a file and in what ways. You can set permissions with the chmod utility.
    You can view ownership, permissions, and some additional file features by using
    the -l option to the ls command.


    # SUGGESTED EXERCISES


    +   - As root, copy a file that you created as an ordinary user, placing the copy
    in your ordinary user home directory. Using your normal account, edit the file
    with a text editor and save your changes. What happens? Try to delete the file
    with the rm command. What happens?

    - Create a scratch file as an ordinary user. As root, use chown and chmod to experiment
    with different types of ownership and permissions to discover when you can read
    and write the file using your normal login account.

    - Use the ls -l command to view the ownership and permissions of files in your
    home directory, in /usr/bin (where many program files reside), and in /etc (where
    most system configuration files reside). What are the implications of the different
    ownership and permissions you see for you read, write, and execute these files?


    (Continues)'
