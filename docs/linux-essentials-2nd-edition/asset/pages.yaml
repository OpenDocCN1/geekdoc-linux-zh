  md: '# Using Absolute and Relative File References


    As described in Chapter 5, Linux uses a unified directory tree, which means that
    all files can be located relative to a single root directory, which is often referred
    to using the slash (/) character. If your disk contains multiple partitions, one
    of these becomes the root filesystem, and others are mounted at some location
    within the overall directory tree. The same thing happens when you mount a USB
    flash drive, DVD, or other removable disk device. The result might resemble Figure
    7.2, which shows a subset of the directories found on a typical Linux installation,
    along with a couple of removable media types. Most commonly media appears as /media
    directory, but some Linux distributions prefer to use /run/media. Most subdirectories
    can be split off as separate partitions or even placed on separate disks. In Figure
    7.2, the /home directory is on its own partition, and it''s accessed in exactly
    the same way as it would be if it part of the root (/) partition.


    ![](img/77662199428609b7662c8dc9c0e45c10_157_0.png)


    Files and directories can be referenced in three ways:


    **Absolute References** These file references are relative to the root (/) directory,
    as in /home/fred/afile.txt to refer to the afile, .txt file in Fred''s home directory.
    Such references always begin with a slash (/) character.


    **Home Directory References** The tilde (~) character refers to the user''s home
    directory. If a filename begins with that character, it''s if the path to the
    user''s home directory were substituted. For Fred, ~/afile.txt is equivalent to
    /home/fred/afile.txt.'
