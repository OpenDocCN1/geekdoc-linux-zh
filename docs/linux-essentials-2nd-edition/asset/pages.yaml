    # Managing Programming Languages


    Many users never need to deal with programming languages; however, basic knowledge
    of what they are and how they differ from one another is important for Linux users,
    for a variety of reasons. You might need to install languages for users on systems
    that you manage, or for yourself to compile software from source code. You might
    also want to learn about programming, particularly if you want to automate computer
    management tasks using shell scripts.


    This section presents basic information on programming languages. It begins by
    describing the differences between compiled and interpreted languages, which are
    important to understand so that you can properly handle program files or choose
    which one you want to use. Brief descriptions of some common programming languages
    are also provided so that you can identify and use their source code files or
    choose which language you want to learn to.


    # Choosing a Compiled vs. an Interpreted Language


    At their core, computers understand binary codes—numbers that represent operations,
    such as adding two numbers or choosing of two actions to take. People, however,
    are much better at handling words and symbols,'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Managing Programming Languages


    as + or if. Thus most programming involves writing a program in a symbolic programming
    language and then translating that symbolic code into the numeric form that computers
    understand. Dozens, if not hundreds, of such programming languages exist, each
    with its own unique features.


    Among high-level languages, two broad categories exist:


    **Compiled Languages** Programmers convert (or compile) a program in a high-level
    language from its original source code into the machine code form. The compilation
    process can take some time—typically a few seconds, depending on the size of the
    program and the speed of the computer. Compilation can also fail because of errors
    in the program. When the compilation succeeds, the resulting machine code executes
    quickly.


    **Interpreted Languages** Programs written in interpreted languages are converted
    to machine code the time they run, by a program known as an interpreter. The conversion
    happens on a line-by-line basis. That is, the program is never completely converted
    to machine code; the interpreter figures out what each line does and then does
    that thing. This means that interpreted programs run more slowly than compiled
    programs. The advantage is that interpreted programs are easier to develop, since
    you don''t need to deal with the compilation process. Interpreted programs are
    also easy to modify: just open the program file in a text editor and save it.
    This feature makes interpreted languages useful for helping with system administrators
    want to change—administrators can make and test changes quickly.


    # PROGRAMMING IN ASSEMBLY LANGUAGE


    In addition to compiled and interpreted languages, another option is assembly
    language. This is a language with a simple one-to-one correspondence between machine
    code numbers and the symbols that the programmer uses. Assembly language is very
    low-level, which means that a skilled assembly language programmer can produce
    compact and efficient programs. Assembly language is not very portable; it takes
    a lot of effort to convert a program written for, say, the x86-64 CPU to run on
    an ARM processor. Writing assembly language programs is also harder than writing
    programs in most high-level languages. For these reasons, assembly languages have
    become more rare as computers have become more powerful; the speed and size advantages
    of assembly language just aren''t very compelling for most purposes in the early
    21st century.'
