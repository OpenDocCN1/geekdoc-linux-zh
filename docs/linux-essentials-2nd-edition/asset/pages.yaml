    retrieves entries from certain administrative databases, including the /etc/passwd
    file. In most cases, typing passwd produces results that are identical to typing
    cat /etc/passwd; however, sometimes the


    Passwords are typically displayed as dots or asterisks as a security feature.


    You can pull out individual records by using the gotten command. Just add the
    username to the command—for instance, get passwd rich.'
