- pgno: 61
  md: '# Chapter 3 - Investigating Linux''s Principles and Philosophy


    The basic idea behind open source software is that software developed in a transparent
    manner is likely to be superior to software developed in a closed manner. This
    superiority (arguments against it) is based on the following features:


    **Better Code** Exposing source code to the community at large means that it can
    be reviewed, judged, and improved by any interested party. Observe bugs might
    be found squashed, whereas they might linger and cause problems in a closed-source
    product. On the other hand, the validity of this claim is not well-supported by
    research, and smaller projects might not gain much in the way of interest from
    other programmers, so they might not benefit from outside code review.


    ![](img/77662199428609b7662c8dc9c0e45c10_61_0.png)


    **More Flexibility** By using the source code, an open project gives users the
    ability to customize the software for their own needs. If users submit changes
    back to those individuals who maintain the software, or release them as a new
    branch of the project, everybody can benefit from such changes. Of course, critics
    would argue that this flexibility is a benefit only to those with the necessary
    skill and time to make such changes, or to those with the money to hire someone
    to do it.


    **Lower Cost** Although the open source definition does not forbid the sale of
    software, the redistribution requirements mean that open source ends up being
    available free of charge. If you want support, on the other hand, you may need
    to purchase a support contract, which can reduce or eliminate the cost benefits.


    **Lack of Vendor Lock-in** The developers of some proprietary products, and particularly
    popular ones, can make it difficult for competing products by using proprietary
    file formats or standards or not supporting more open standards. Open source tools
    are less subject to such problems, since they can be modified to support open
    standards, even if they don''t initially do so. As a practical matter, though,
    even proprietary file formats and protocols are usually reverse-engineered, vendor
    lock-in usually ends up being a temporary problem rather than a permanent one.


    Of course, within the Linux community the general consensus is that each of these
    factors is a real point in favor of Linux, and of open source software in general;
    the downsides noted are generally regarded as minor when compared to the advantages.
    In the end, you''ll need to make up your own on on matters after using different
    types of software.


    # Linux as a Software Integrator


    Soon after Unix was created, the OS fragmented into a set of loosely affiliated
    OSs. These OSs were incompatible on the binary level but more or less'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# Understanding OS Roles


    compatible with the source-code level. This is still true today. You can take
    the same program and compile it for FreeBSD, OS X, and Linux, and it will work
    the same on all three platforms—but the compiled binaries made for one platform
    won''t work on the others.


    There are exceptions to this rule, though. Some programs rely on features that
    are available on just Unix-like OSs. Others have quirks that make it impossible
    to compile them on some OSs. If a program falls into disuse, it may become unusable
    on new OSs because it relies on compiler or OS features that have changed. Such
    problems tend to be ironed out over time, but they do crop up periodically.


    Because of Linux''s popularity, most open source Unix programs compile and work
    on Linux. Commercial programs for Linux also exist, although most of these are
    obscure or specialized. In any event, Linux has become an OS that most open source
    Unix programs must support. This effect is so strong that many projects now target
    Linux as the primary platform.


    # Understanding OS Roles


    Computers fill many roles in the world, and as computers have become more common
    and less expensive, those roles have multiplied. Linux can serve as the OS for
    most of these roles, each of which draws on its own subset of support utilities.
    Some of these also require tweaking the kernel itself. We briefly describe three
    of these roles: embedded computers, desktop and laptop computers, and server computers.


    # Embedded Computers


    As noted in Chapter 1, embedded computers are specialized devices that fulfill
    a specific purpose. Examples include the following:


    Mobile Phones Modern mobile phones use computers with OSs that range from simple
    to complex. Linux powers some of these mobile phones, usually in the form of the
    Android OS.


    E-book Readers These devices, like mobile phones, are specialized computers and
    use an OS to power them. For many current e-book readers, OS is Linux—either a
    custom Linux version or Android.


    DVRs Digital video recorders (DVRs), which record TV shows for later viewing,
    are computers with specialized software. Some of these, including the popular
    TiVo models, run Linux.


    Certification Objective


    Apple, Microsoft, and other vendors provide their OSs for mobile phones.


    The MythTV package (www.mythtv.org) can turn into a Linux-based DVR, although
    you''ll need a TV tuner and specific hardware to make it work.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Chapter 3 • Investigating Linux''s Principles and Philosophy


    Automotive Computers Automobiles have included computers for years. These have
    mostly been tucked out of the way to monitor and control the engine and other
    automotive systems; however, modern cars increasingly come with computers that
    users more readily identify as being computers. They manage Global Positioning
    System (GPS) navigation systems, manage collision avoidance, regulate emergency
    braking, control the audio system, and even provide Internet access.


    Appliances Televisions, refrigerators, and other appliances are increasingly using
    computers to download software updates, monitor energy use, and for other purposes.


    You might think of tablet computers as falling into this category as well, although
    they can more closely resemble desktop or laptop computers. The distinction is
    mainly of how much control the user has over the OS; embedded devices are used,
    not maintained, by end users. The system administration tasks described in this
    book are done at the factory or by using much simpler and more specialized user
    interfaces.


    # Desktop and Laptop Computers


    Linux began a life on a desktop computer, and although Linux doesn''t come close
    to dominating that market, desktop computers are a good way to begin learning
    Linux. Laptop computers are similar to desktop computers from a system administration
    perspective; both types of computers are often used by a small number of people
    for productivity tasks, such as word processing, Web browsing, and managing digital
    photos. For brevity, we use the term to refer to both types of computers from
    here.


    Linux software for such tasks is widely available and is quite good, although
    some people prefer commercial counterparts, as Microsoft Office or Adobe Photoshop,
    aren''t available for Linux. This preference for a few commercial products is
    part of why Windows continues to dominate the market. Some people have speculated
    that the open source development model doesn''t lend itself to the creation of
    popular GUI applications because software developers tend to be too technically
    oriented to appreciate the fully needs of less technically capable users. Without
    an explicit way to require developers to fulfill these needs, for-profit companies
    create, open source software projects lag behind their commercial counterparts
    in usability. This view is not universally shared, though, and at worst, open
    source projects lag behind their commercial counterparts just a bit.


    Specific software that''s required on most Linux-based desktop computers includes
    the following:'
  merge: -1
  img_proc: true
- pgno: 64
  md: '+   The X Window System GUI (X for short)


    +   A popular desktop environment, such as GNOME, KDE, Xfce, or Unity


    +   A web browser, such as Mozilla Firefox


    +   An email client, such as Mozilla Thunderbird or Evolution


    +   A graphics editor, such as the GNU Image Manipulation Program (GIMP)


    +   An office suite, such as Apache OpenOffice.org or the similar LibreOffice


    Additional requirements vary depending on the user''s needs. For instance, one
    user might need multimedia editing tools, whereas another might need scientific
    data analysis software.


    Linux distributions such as Fedora and Ubuntu typically install popular desktop
    tools by default, or as a group by selecting a single install-time option. These
    distributions are also designed for relatively easy maintenance so that users
    with only modest skill can install the OS and keep it running over time.


    # Server Computers


    Server computers can be almost identical to desktop computers in terms of their
    hardware, although servers sometimes require bigger hard drives or better network
    connections, depending on how they are used. Many popular network server programs
    were written for Unix or Linux first, making these platforms the best choice for
    running them. Examples include the:


    +   Web servers, such as Apache


    +   Email servers, such as Sendmail and Postfix


    +   Databases, such as MySQL


    +   File servers, such as the Network File System (NFS) for Samba


    +   Print servers, such as the Common Unix Printing System (CUPS) and Samba


    +   Domain Name System (DNS) servers, such as the Berkeley Internet Name Domain
    (BIND)


    +   Dynamic Host Configuration Protocol (DHCP) servers, such as the Internet Systems
    Consortium''s (ISC) dhcpd'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Chapter 3 • Investigating Linux''s Principles and Philosophy


    +   - Time servers, such as the Network Time Protocol (NTP)


    +   - Remote login servers, such as Secure Shell (SSH) or Virtual Network Computing
    (VNC)


    In a large organization, each of these services may have a distinct associated
    server computer. It''s possible, though, for one computer to run many of the server
    programs simultaneously.


    Most of these servers do not require a GUI, so server computers can do without
    X, desktop environments, or the typical desktop programs that you''ll find on
    a desktop computer. One of Linux''s advantages over Windows is that you can run
    it without these elements, and you can uninstall them completely. Doing so means
    the GUI won''t needlessly consuming system resources such as RAM. Furthermore,
    if an item as X isn''t running, any security bugs might harbor become unimportant.
    Some distributions, such as Debian, Arch, and Gentoo, eschew GUI configuration
    utilities. This makes these distributions unfriendly to new users, but the reliance
    on text-configuration tools is not a problem for experienced administrators of
    server computers.


    The people who maintain large server computers are generally technically proficient
    and can often contribute directly to the open source projects that they use. This
    close association between users and programmers can help keep server projects
    on the cutting edge of real-world requirements.


    Note that the distinction between desktop and server computers is not absolute;
    a computer can run a mixture of both types of software. For instance, you might
    configure desktop computers in an office environment to run file server software.
    This configuration enables users to share that their work more easily with others
    in the office. In a home or small office setting, running other servers on desktop
    computers can obviate the need to buy specialized hardware to fulfill those roles.


    # THE ESSENTIALS AND BEYOND


    Linux''s development history is tied to that of Unix and to open source development.
    Open source software is provided with source code and with the right to modify
    and redistribute the source code. This guarantees your ability to use the software
    in ways that the original author did not anticipate or support, provided that
    you have the knowledge and time to alter it, or or the resources to hire somebody
    else to do so. These open source principles have led to a great deal of popular
    software, particularly in the server arena; however, open source developers have
    been less able to capture the general public''s excitement with applications designed
    for desktop computers.'
  merge: -1
  img_proc: true
