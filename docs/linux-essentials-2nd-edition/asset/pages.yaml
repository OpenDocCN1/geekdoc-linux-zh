  md: '# Chapter 5 • Managing Hardware


    # MULTIBYTE UNITS (Continued)


    To resolve this conflict, the Institute of Electrical and Electronics Engineers
    (IEEE) defined a new set of prefixes as IEEE-1541. Under this system, new units
    and prefixes describe base-2 values. The first few of these are as follows:


    +   - A kibibyte (KiB) is $2^{10}$ (1,024) bytes.

    - A mebibyte (MiB) is $2^{20}$ (1,048,576) bytes.

    - A gibibyte (GiB) is $2^{30}$ (1,073,741,824) bytes.

    - A tebibyte (TiB) is $2^{40}$ (1,099,511,627,776) bytes.


    In this book, we use IEEE-1541 units which have features that are expressed in
    this system, such as partition size limits. Most Linux utilities use SI and IEEE-1541
    correctly, but which is depends on the whim of the program''s authors. Be alert
    to this difference, particularly when dealing with large numbers—note that a tebibyte
    is almost 10 percent larger than a terabyte!


    Other partitioning systems exist, but you''re unlikely to encounter most of them.
    One possible exception is the Apple Partition Map (APM), which Apple used on its
    Macintosh computers prior to its switch to Intel CPUs.


    When it comes to partitioning a disk, Linux supports three families of tools:


    disk Family The fdisk, cgdisk, and sfdisk tools are simple, text-based partitioning
    utilities for MBR disks and some work and provide the means to recover from some
    disk errors, but their text-based nature can be intimidating to those who are
    unfamiliar with disk partitioning.


    libparted-Based Tools Tools based on the libparted library can handle MBR, GPT,
    and other partition table types. Some of these tools, such as GNU Parted, are
    text based, but others, such as GParted, are GUI based and so are likely to be
    easier for new users to use. Figure 5.2 shows GParted in action. Note how its
    display mirrors the structure. Many Linux installers include libparted-based partitioning
    tools that run during system installation.


    gpt Family The gdisk, cgdisk, and sgdisk tools are modeled after the fdisk family
    but work with GPT disks. They provide more options for handling GPT than do libparted-based
    tools, but at the cost of friendliness for new users.'
