  md: '# Exploring Linux through the Ages


    writing with the goal of creating a Unix-compatible kernel—that is, a kernel

    that could run the wide range of Unix software that was available at the time.

    Unix''s history, in turn, stretched back two more decades, to its origin at AT&T

    in1969. Because AT&T was a telephone monopoly in the United States at AT&T

    time, it was legally forbidden from selling software. Therefore, when its employ-

    ees Unix, AT&T basically gave the OS away. Universities were particularly

