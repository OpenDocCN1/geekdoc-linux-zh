  md: '# Chapter 14 · Setting Ownership and Permissions


    Restoring the file and setting the sticky bit enables you to see the effect:


    ```

    $ ls -l

    total 0

    drwxrxrwt 2 root 80 Dec 14 18:25 subdir

    $ ls -l subdir/

    total 304

    -rw-r--r-- 1 root 240268 Dec 14 18:25 f1701.tif

    $ rm subdir/f1701.tif

    rm: cannot remove subdir: Operation not permitted

    ```


    In this example, although kirk has full read/write access to subdir, kirk cannot
    delete another user''s files in that directory.


    You can identify a directory with the sticky bit by a small change in the symbolic
    mode by ls -l. The world execute bit is shown as a rather than an x. In this example,
    the result is that subdir''s permission appears as drwxrwxrwx rather than drwxrwx.


    ![](img/77662199428609b7662c8dc9c0e45c10_301_0.png)


    The sticky bit is particularly important for directories that are shared by many
    users. It is a standard feature on /tmp and /var/tmp, for instance, since many
    users store temporary files in these directories, and you would not want one user
    be able to delete another user''s temporary files. If you want users to collaborate
    on a project to be able to write files into each others'' home directories, you
    might consider setting the sticky bit on those home directories, or on the subdirectories
    where users are sharing files.


    # Using Special Execute Permissions


    As described earlier in this chapter, the execute bit enables you to identify
    programs as such. Linux then allows you to run these programs. Files run using
    your own credentials, which is generally a good thing—associating processes with
    specific users is a key part of Linux''s security model. Occasionally, though,
    programs need to run with elevated privileges. For instance, the password program,
    which sets users'' passwords, must run as root to root, and in some cases to read,
    the configuration files it handles. Thus if users are to change their own passwords,
    password must have root privileges even when ordinary users run it.


    To accomplish this task, special permission bits exist, similar to the sticky
    bit described earlier:


    ![](img/77662199428609b7662c8dc9c0e45c10_301_1.png)


    Set User ID (SUID) set user ID (SUID) option tells Linux to run the program with
    the permissions of whoever owns the file rather than with the'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# Using Special Permission Bits and File Features


    permissions of the user who runs the program. For instance, if a file is owned
    by root and has its SUID bit set, the program runs with root privileges and can
    therefore read any file on the computer. Some servers and other system programs
    run this way, which is often called SUID root. SUID programs are indicated by
    an s in the owner''s execute bit in the permission string, as in rwsr-xr-x.


    **Set Group ID (SGID)** The set group ID (SGID) option is similar to the SUID
    option, but it sets the group of the running program correctly to the group of
    the file. It is indicated by an s in the group execute bit position in the permission
    string, as in rwxr-sr-x.


    You can set these bits by using chmod:


    **Using an Octal Code** In the leading digit of a four-digit octal code, the value
    4 to set the SUID bit, to 2 or 6 to set both bits. For instance, 4755 sets the
    SUID bit, but not the SGID bit, or on an executable file.


    **Using a Symbolic Code** Use the s symbolic code, in conjunction with u to specify
    the SUID bit, g to specify the SGID bit, or to set both bits. For instance, typing
    chmod u+s myprog sets the SUID bit on myprog, whereas chmod ug-s myprog removes
    both the SUID and the SGID bit.


    dinarily, you don''t need to set or remove these bits; when necessary, the package
    manager sets these bits correctly when you install or upgrade a program. You might
    need to alter these bits if they''ve been mistakenly set or removed from files.
    In some cases, you might want to use source code or adjust these values on program
    files that you compile from source or if you need to modify the way a program
    works. Be cautious when doing so, though. If you set the SUID bit on a garden-variety
    program, it will run with increased privileges. If the program contains bugs,
    those bugs will be able to do more damage. If you accidentally remove these permissions,
    the results can be just as bad—programs like passwd, sudo, and all rely on their
    SUID bits being set, so removing this feature can cause them to stop working.


    # Hiding Files from View


