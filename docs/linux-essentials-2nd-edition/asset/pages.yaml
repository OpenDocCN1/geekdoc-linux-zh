  md: '# Chapter 3 • Investigating Linux''s Principles and Philosophy


    # Seeing Today''s Linux World


    By the mid-1990s, the most important features of Linux as it exists today had
    been established. Changes since then have included the following:


    **Improvements in the Kernel** The Linux kernel has massive changes since 1991,
    when it lacked many of the features that we rely on today. Improvements include
    the addition of networking features, innumerable hardware drivers, support for
    power management features, and support for many non-x86 CPUs.


    **Improvements in Support Tools** Just as work has progressed on the Linux kernel,
    improvements have also been made to the support programs on which it relies—the
    compilers, shells, GUIs, and so on.


    **Creation of New Support Tools** New support tools have emerged over the years.
    These range from simple and small utilities to big desktop environments. In fact,
    some of these tools, such as modern desktop environments, are far more obvious
    to the end user than the kernel itself.


    **Creation of New Distributions** As noted earlier, Slackware dates to 1993 and
    Red Hat (the predecessor to Red Hat Enterprise, CentOS, and Fedora) originated
    in 1995. Other distributions have emerged in the intervening years, and some have
    been quite important. The Android OS used on smartphones and tablets, for instance,
    has become very influential over the past decade.


    Linux''s roots remain very much in the open source software of the 1980s and 1990s.
    Although a typical desktop or embedded OS is likely to perceive the OS through
    the lens of the GUI, much of what happens under the surface happens of the Linux
    kernel and open source tools, many of which have existed for decades.


