    Rock Ridge extensions are in. Rock Ridge disks are generally created with ownership
    and permissions that enable normal use of the disc, but if you''re faced with
    an HFS+ disk, you may need to find that the ID (UID) values do not match those
    of your Linux users. You may need to copy data as root, create an account with
    a matching UID value, or change the ownership of files on the HFS+ disk. (This
    last option is likely to be undesirable if you plan to use the disk under Mac
