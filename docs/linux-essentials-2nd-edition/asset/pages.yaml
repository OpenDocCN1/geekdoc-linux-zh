    # Securing Servers


    Whenever you run a server, you also run the risk of its being compromised and
    abused. Risks fall into several categories:


    +   - Servers can contain bugs that enable outsiders to abuse the software to
    run programs locally.


    +   - You can misconfigure a server, granting an outsider greater access to your
    system than you had intended.


    +   - Users with accounts and remote access via a server can abuse this trust.
    This risk is particularly great if combined with a server bug or misconfiguration.


    +   - A server can be used as a stepping-stone to attack others, making it appear
    as if an attack originated from your computer.


    +   - Even without breaking into a computer, an attacker can swap a server with
    bogus data, shutting it down. This technique is called a denial-of-service (DoS)
    attack.


    Server security is an extremely complex topic, and details vary from one server
    to another. For instance, if you run a server as a remote login server, Samba,
    or a POP or IMAP email server, you probably want to pay careful attention to password
    security, since all of these servers rely on passwords. Pass are unimportant to
    a DHCP or DNS server, though. Of course, even if a DHCP or DNS server program
    doesn''t use passwords, other server programs running on the same computer might.'
