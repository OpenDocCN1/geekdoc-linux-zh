    # Understanding the Process Hierarchy


    The Linux kernel is the core of a Linux installation. The kernel manages memory,
    provides software with a way to access the hard disk, holds out CPU time, and
    performs other critical low-level tasks. The kernel is loaded early in the boot
    process, and it''s the kernel''s responsible for managing every other piece of
    software on a running Linux computer.


    You can change program runs as the first process by adding init=option to your
    boot loader kernel option line, as init=/bin/bash to run bash.


    One of the ways that the kernel operates on the potentially chaotic set of running
    software is to create a sort of hierarchy—normally /sbin/init. When it boots,
    the kernel runs one program—init. The init process is then responsible for starting
    all the other basic programs that Linux must run, such programs, if launched directly
    by login, are called children. The children of init can in turn launch their children.
    This happens when you log into Linux. The process that launches a given process
    is called its parent.


    Certification Objective


    The result of this system is alike hierarchy of processes, as illustrated in Figure
    9.3 (“Trees” in computer science are often depicted upside down.) Figure 9.3 shows
    a small subset of the many processes that run on a typical Linux installation:
    just a few processes associated with a text-mode login, including the login tool
    that manages logins, a couple of bash shells, and a few user programs. A working
    Linux system will likely have dozens or hundreds of processes. The one on which
    I''m typing these words has 213 processes going at once!


    Occasionally, a process will terminate but behind children. When this happens,
    init “ adopts” those child processes.


    ![](img/77662199428609b7662c8dc9c0e45c10_202_0.png)


    FIGURE 9.3 Linux processes are arranged in a hierarchical tree.'
