  md: '# CHAPTER 5


    # # Managing Hardware


    Although Linux is software, it relies on hardware to operate. The capabilities
    and limitations of your hardware will influence the capabilities and limitations
    of Linux running on that hardware. Therefore, you should know these features for
    any computer that you use extensively or that you plan to buy.


    This chapter will help you learn about and perform basic management tasks with
    your hardware. We begin with low-level issues, such as the nature of your central
    processing unit (CPU) and motherboard. Often overlooked, the power supply can
    cause problems if it''s undersized or misbehaves. In addition, hard disks require
    special care in their setup. A common sticking point in Linux is display issues,
    since a malfunctioning display prevents any interaction with the computer. Today,
    most external devices attach via the Universal Serial Bus (USB), so we describe
    its features. Finally, this chapter covers the common issue of drivers, which
    are software components that control hardware devices.


    +   - Learning about your CPU


    +   - Identifying motherboard capabilities


    +   - Sizing your power supply


    +   - Understanding disk issues


    +   - Managing displays


    +   - Handling USB devices


    +   - Managing drivers


    # # Learning about Your CPU


    > Certification Objective


    Your **CPU (sometimes called the processor) is the “brain” of your computer**—it
    does most of the computer’s actual computing. We’ve mentioned CPUs in earlier
    chapters in reference to distribution'
