    # Sizing Your Power Supply


    A computer''s power supply takes the alternating current (AC) power from a wall
    outlet and connects it to the direct current (DC) that powers your motherboard
    and everything you plug into it. Laptop computers and some small desktop units
    use power adapter “bricks” that you can put on the floor. Large desktop computers
    have internal power supply units. These internal units are larger, both physically
    and in terms of the amount of power that they can deliver.


    Every power supply has limits on the amount of DC power it can deliver. This is
    important because every device that you plug into the computer consumes a certain
    amount of power. If your computer manufacturer cuts, the power supply may be barely
    adequate for the computer as delivered. If you add a hard disk or a power-hungry
    plug-in card, you could exceed the amount of power that the power supply can deliver.
    The result can be unreliable—operation—the computer can crash or behave erratically,
    potentially corrupting data or files. Such problems be hard to distinguish from
    other problems, such as bad RAM or a failing hard disk.


    If you need to replace your power supply, pay attention to its output in watts.
    You should be able to find the output of your current power supply on a sticker—but
    you''ll need to open your computer first, at least for most desktop systems. Be
    sure to get a power supply that''s rated for at least as many watts as'
  merge: -1
  img_proc: true
