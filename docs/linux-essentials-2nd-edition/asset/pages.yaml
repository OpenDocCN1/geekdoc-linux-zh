    # What Is a Distribution?


    Up until now, we''ve described Linux as if it were a single OS, but this isn''t
    really the case. Many different Linux distributions are available, each consisting
    of a Linux kernel along with a set of utilities and configuration files. The result
    is a complete OS, and two Linux distributions can differ from each other as much
    as either differs from OS X or Windows. We therefore describe in more detail what
    makes up a distribution, what distributions are popular, and the ways in which
    distribution maintainers keep their offerings up-to-date.


    # Creating a Complete Linux-Based OS


    We''ve already described some of what makes up Linux OS, but some details need
    reiteration or elaboration:


    +   **A Linux Kernel** A Linux kernel is at the core of any Linux OS, of course.
    We''ve written this item as *Linux kernel* because the Linux kernel is constantly
    evolving. Two distributions are likely to use slightly different kernels. Distribution
    maintainers also offer *patch* kernels—that is, they make small changes to bugs
    or add features.


    +   **Core Unix Tools** Tools such as the GNU tool, the X Window System, and the
    utilities used to manage disks are critical to the normal functioning of a Linux
    system. Most distributions include or less the same set of tools, but as with
    the kernel, they can vary in versions and patches.


    +   **Supplemental Software** Additional software, such as major server programs,
    desktop environments, and productivity tools, ship with Linux distributions. As
    with core Unix software, most distributions provide similar options for such software.
    Distributions sometimes provide their own “branding,” though, particularly in
    desktop environment graphics.


    +   **Startup Scripts** Much of a Linux distribution''s “personality” comes from
    the way it manages its startup process. Linux uses scripts and utilities to launch
    the dozens of programs that link the computer to a network, present a login prompt,
    and so on. These scripts and utilities vary between distributions, which means
    that they have different features and may be configured in different ways.


    ![](img/77662199428609b7662c8dc9c0e45c10_34_0.png)'
  merge: -1
