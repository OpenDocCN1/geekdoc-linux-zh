  md: '# Editing Files


    Computer documents come in in many forms, but one of the most basic and flexible
    is a text file. Typically, configuration files and shell scripts are text files.
    Because you will often be modifying configuration files and creating shell scripts,
    you must be able to edit text files. This chapter covers this task with an emphasis
    on the simple text-mode pico, nano, and vi editors. A few roles played by text
    files are described first; then how to select a editor is covered. To edit text
    files, of course, you must be able to start the editor, either on an existing
    document or a new one. The pico and nano editors are quite similar, so their operation
    is described together, followed by vi, which is a much more unusual editor by
    modern standards.


    +   - Understanding the role of text files


    +   - Choosing an editor


    +   - Launching an editor


    +   - Editing files with pico or nano


    +   - Editing files with vi


    # Understanding the Role of Text Files


    A text editor lets you edit documents that are stored in plain-text format. The
    American Standard Code for Information Interchange (ASCII) used to be the common
    format, but now files typically use Unicode formats to support additional characters.
    These formats store text documents that, by themselves, include no special formatting
    or embedded features. Text files cannot include graphics, use multiple fonts,
    emphasize words by italicizing them, or use other features that you probably associate
    with word processors (although markup tools provide a partial exception to this
    rule).


    > If a text file is encoded in ASCII, it''s encoded in Unicode too. ASCII encoding
    is a subset of Unicode.'
