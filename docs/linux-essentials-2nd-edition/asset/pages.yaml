    # Identifying Common Server Protocols and Programs


    Networks, including the Internet, function by means of network protocols. Network
    protocols are clearly defined descriptions of how two computers should exchange
    data to achieve a particular end, such as transferring email or delivering a file
    to be printed. Most protocols are described in one or more standards documents,
    known as Request for Comments (RFC) documents, each of which has a number. Typically,
    one RFC document defines the protocol, and over time additional RFC documents
    define extensions or protocol modifications as they become necessary.


    Most network protocols involve transferring data over one or more ports, which
    are numbered resources on a computer. You can think of a port as something like
    a telephone extension number—the main number (an Internet Protocol, or IP, address)
    identifies the computer as a whole, and the port number identifies the protocol
    being used. A server program attaches itself to a port number and receives all
    incoming requests on that port.


    Table 4.1 summarizes some port numbers, the protocols with which they''re associated,
    and the Linux programs that are often used in conjunction'
