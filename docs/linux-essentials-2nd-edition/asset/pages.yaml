  md: '# # Partitioning a Disk


    Certification Objective


    You can think of a hard disk as a set of sectors, each of which holds a small
    amount of data—normally 512 bytes, although some disks have larger sectors. The
    disk hardware itself little to help organize data on the disk, aside from providing
    a means to read and write specific sectors. On-disk data management is left up
    to the OS. Disk partitions and filesystems are two levels of organization imposed
    on disks to help manage the data they store.


    Partitions are a lot like the drawers in a filing cabinet, which are split up
    into multiple partitions, much like drawers. This analogy is as good as far as
    it goes, but it has its limits. Unlike filing cabinet drawers, disk partitions
    can be created in whatever size and quantity are convenient, within the limits
    of the disk''s size. A typical disk has between one and a dozen partitions, although
    you can create more.


    Disk partitions exist to help subdivide the disk into broadly different purposes,
    such as partitions for different OSs or for different types of data within an
    OS. For instance, it is common to create separate partitions for swap space (which
    is used like RAM in case you run out of it), for user data files, and for the
    OS itself.


    Hard disks and their partitions are frequently represented in diagrams similar
    to Figure 5.1. This diagram displays partitions as subdivisions of the disk, with
    partition sizes in the diagram more or less proportional to their true sizes on
    the disk. Thus, in Figure 5.1, you can see that /boot is tiny compared to /home.
    As in the figure, partitions are uninterrupted sections of a disk—that is, /home,
    for instance, is a set of sectors with no other partition carved out of its interior.


    Some partitioning tools represent their partitions in a vertical stack rather
    than a horizontal chain. The principle is the same either way.


    | Extended Partition |

    |---|---||

    | root (/) | swap | /home |


    FIGURE 5.1 Disk partitions are often visualized as boxes within a hard disk.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# Understanding Disk Issues


    The most common partitioning scheme for .x86 and .x86-64 computers has gone by
    various names over the years, including master boot record (MBR), MS-DOS, and
    BIOS partitioning. It supports three types of partitions:


    **Primary** This is the simplest type of partition. A disk can have zero to four
    primary partitions, one of which may be an extended partition.


    **Extended** This is a special type of primary partition that serves as a holder
    for logical partitions. A disk may have at most one extended partition.


    **Logical** These partitions are contained within an extended partition. In the
    theory, a disk can have billions of logical partitions, thus overcoming the limit
    of four primary partitions, but in practice you''re unlikely to see more than
    a dozen of them.


    MBR''s use of three partition types is awkward and limiting, but inertia has kept
    it in place for decades. MBR partitions have a hard limit, though they can''t
    support disks larger than 2 teribytes (TiB), assuming 512-byte sectors, which
    are nearly universal today.


    The Globally Unique Identifier (GUID) Partition Table (GPT) is the successor to
    MBR. GPT supports disks up to 8 zebibytes (ZiB), which is about 4 billion times
    large as MBR''s. GPT also supports up to 128 partitions by default, with no distinction
    between primary, extended, and logical partitions. GPT is a superior partitioning
    system to MBR; however, its support varies between OSs. Linux supports both systems
    well. Windows can boot only from MBR when the computer uses the Basic Input/Output
    System (BIOS), and it can boot only from GPT when the computer is based on the
    Unified Extensible Firmware Interface (UEFI). Thus, if you dual-boot with Windows,
    you may need to select your partitioning scheme with care.


    # MULTIBY UNITS


    It is common to use prefixes from the International System of Units (SI units)—kilo
    (k), mega (M), giga (G), tera (T), and so on—in conjunction with byte (B) to refer
    to large quantities of storage space, as in KB, MB, GB, TB, and so on. Technically,
    these units are defined as base-10—kilo means 1000; mega means 1,000,000; and
    so on. In computers, though, base-2 values, such as $2^{10}$ (1,024) and $2^{20}$
    (1,048,576), are even more natural, so the SI units often have (but not always)
    been used to mean these base-2 values. This practice has led to confusion, since
    it''s not always clear whether base-10 or base-2 units are used.


    (Continues)'
