- pgno: 240
  md: "# Using Conditional Expressions\n\nScripting languages support several types\
    \ of conditional expressions. These enable a script to perform one of several\
    \ actions contingent on a particular condition—typically the value of a variable.\
    \ One common command that uses conditional expressions is if, which allows the\
    \ system to take one of two actions depending on whether a certain condition is\
    \ true. The if keyword's conditional expression appears in brackets after the\
    \ if and can take many forms. For instance, -f file is true if file exists and\
    \ is a regular file; -s file is true if file exists and has a size greater than\
    \ 0; string1 == string2 is true if the two strings have the same values.\n\nConditionals\
    \ may be combined together with the logical and (&&) or logical or (||) operators.\
    \ When conditionals are combined with && both sides of the operator must be true\
    \ for the condition as a whole to be true. When || is used, if either side of\
    \ the operator is true, the condition as a whole is true.\n\nTo understand the\
    \ use of conditionals, consider the following code fragment:\n\n```\nif [ -s /tmp/tempstuff\
    \ ]\nthen\n  echo \"/tmp/tempstuff found, aborting\"\n  exit\n```\n\nThis fragment\
    \ causes the script to exit if the file /tmp/tempstuff is present. The then keyword\
    \ marks the beginning of a series of lines that execute only if the conditional\
    \ is true, and fi (if backward) marks the end of the block. Such code may be useful\
    \ if the script creates and then deletes this file, because its presence indicates\
    \ that a previous run of the script didn't succeed or is still underway.\n\nAn\
    \ alternative form for a conditional expression uses the test keyword rather than\
    \ square brackets around the condition:\n\n```\nif test -s /tmp/tempstuff\n```\n\
    \nYou can also test a command's return value by using the command as the condition:\n\
    \n```\nif [ command ]\nthen\n  additional-commands\nfi\n```\n\nIn this example,\
    \ the additional-commands will be run only if command completes successfully.\
    \ If command returns an error code, the additional-commands won't be run."
  merge: -1
  img_proc: true
- pgno: 241
  md: "# Chapter 11 - Creating Scripts\n\nConditional expressions may be expanded\
    \ by use of the else clause:\n\n```\nif [ conditional-expression ]\nthen\n   \
    \ commands\nelse\n    other-commands\n```\n\nCode of this form uses either commands\
    \ or other-commands to execute, depending on the evaluation of conditional-expression.\
    \ This is useful if something should happen in a part of the program, but precisely\
    \ what should happen on a certain condition. For instance, you might want to launch\
    \ one of two file-archiving programs depending on a user's input.\n\nWhat do you\
    \ do if more than two outcomes are possible—for instance, if a user may provide\
    \ any one of four possible inputs? You can nest if/then/else clauses, but this\
    \ gets awkward quickly. A cleaner approach is to use case:\n\n```\ncase word in\n\
    \    pattern1 command(s);\n    pattern2 command(s);\n    ...\nesac\n```\n\nFor\
    \ a statement, a word is likely to be a variable, and each pattern is a possible\
    \ value of that variable. The patterns can be expanded like filenames, using the\
    \ wildcards and expansion rules (* to stand for any string, instance). You can\
    \ match an arbitrary number of patterns in this way. Each set of commands must\
    \ end with a double semicolon (;;), and the case statement as a whole ends in\
    \ the string esac (case backward).\n\nUpon execution, bash executes the commands\
    \ associated with the first pattern to match the word. Execution then jumps to\
    \ the line following the esac statement; any intervening commands don't execute.\
    \ If no patterns match the word, no code the case statement executes. If you want\
    \ to have a default condition, use * as the final pattern; this pattern matches\
    \ any word, so its commands will execute if no other pattern matches.\n\n# Using\
    \ Loops\n\nConditional expressions are sometimes used in loops. Loops are structures\
    \ that tell the script to perform the same task repeatedly until a particular\
    \ condition is"
  merge: -1
  img_proc: true
- pgno: 242
  md: "met (or until some condition is no longer met). For instance, Listing 11.5\
    \ shows a loop that plays all the .wav audio files in a directory.\n\nLISTING\
    \ 11.5: A script that executes a command on every matching file in a directory\n\
    \n```\n#!/bin/bash\nfor d in `ls *.wav`; do\n aplay $d\ndone\n```\n\nThe for loop\
    \ used as here executes once for every item in the list generated by ls *.wav.\
    \ Each of those items (filenames) is assigned in turn to the $d variable and is\
    \ passed to the aplay command.\nThe seq command can be useful in creating loops\
    \ (and in other ways too). This command generates a list of numbers starting from\
    \ its first argument and continuing to its last one. For instance, typing `seq\
    \ 1 10` generates 10 lines, each with a number between 1 and 10. You can use a\
    \ for loop beginning for x `seq 1 10` to have the loop execute 10 times, with\
    \ the value of x incrementing with each iteration. If you pass just one parameter\
    \ to seq, it interprets that as an ending point, with the starting point being\
    \ 1. If you pass three values to seq, it interprets them as a starting value,\
    \ an increment amount, and an ending value.\n\nAnother type of loop is the while\
    \ loop, which executes for long as its condition is true. The basic form of this\
    \ loop type is as follows:\n\n```\nwhile [ condition ]\ndo\n commands\ndone\n\
    ```\n\nThe until loop is similar in form, but it continues execution as long as\
    \ its condition is false—that is, until the condition becomes true.\n\n# Using\
    \ Functions\n\nA function is a part of a script that performs a specific subtask\
    \ and that can be called by name from other parts of the script. Parenting parentheses\
    \ after the function name and enclosing the lines that make up the function with\
    \ curly braces is how functions are defined:\n\n```\nmyfn() {\n commands\n}\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 243
  md: "# Chapter 11 • Creating Scripts\n\nThe keyword function may optionally precede\
    \ the function name. In either event, the function is called by name as if it\
    \ were an ordinary internal or external command.\n\nFunctions are useful in helping\
    \ to create modular scripts. For instance, if your script needs to perform half\
    \ a dozen distinct computations, you can place each computation in a function\
    \ and then call them in sequence. Listing 11.6 demonstrates the use of functions\
    \ in a simple program that copies a file but aborts with an error message if the\
    \ target file already exists. This script accepts a target and a destination filename\
    \ and must pass those filenames to the functions.\n\nLISTING 11.6: A script demonstrating\
    \ the use of functions\n\n```\n#/bin/bash\n\ndoit() {\n  cp $1 $2\n}\n\nfunction\
    \ check() {\n  if [ -s $2 ]\n  then\n    echo \"Target file exists! Exiting!\"\
    \n    exit\n  fi\n}\n\ncheck $1 $2\ndoit $1 $2\n```\n\nIf you enter Listing 11.6\
    \ and call it safercp, you can use it like this, assuming that the file original.txt\
    \ exists and dest.txt does not:\n\n```\n./safercp original.txt dest.txt\n./safercp\
    \ original.txt dest.txt\nTarget file exists! Exiting!\n```\n\nThe first run of\
    \ the script succeeds because dest.txt doesn't exist. On the second run, though,\
    \ the destination file does exist, so the script terminates with the error message.\n\
    \nNote that the functions aren't run directly and in the order in which they appear\
    \ in the script. They're run only when called in the main body of the script—which\
    \ in Listing 11.6 consists of just two lines, each corresponding to one function\
    \ call, at the very end of the script."
