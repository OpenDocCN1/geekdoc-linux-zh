  img_proc: true
- pgno: 294
  md: '# Setting Permissions


    File Type Code Owner Permissions Group Permissions World Permissions


    | r | w | x | r | w | x | r | w | x |

    | read | write | execute | read | write | execute | read | write | execute |


    FIGURE 14.2 A symbolic representation of file permissions is broken into four
    parts.


    # TABLE 14.1 Linux file type codes


    | Code | Name | Meaning |

    | - | Normal data file | May be text, an executable program, graphics, compressed
    data, or just about any other type of data. |

    | d | Directory | Disk devices are files, but they contain filenames and pointers
    to named files'' data structures. |

    | l | Symbolic link | The file contains the name of another file or directory.
    When Linux accesses the symbolic link, it tries to read the linked-to file. |

    | p | Named pipe | A pipe enables running two Linux programs to communicate with
    each other in a one-way fashion. |

    | s | Socket | A socket is similar to a named pipe, but it permits network and
    bidirectional links. |

    | b | Block device | A file that corresponds to a hardware device and from which
    data is transferred in blocks of more than 1 byte. Disk devices (hard disks, USB
    flash drives, CD-ROMs, and so on) are common block devices. |

    | c | Character device | A file that corresponds to a hardware device and from
    which data is transferred in units of 1 byte. Examples include parallel and RS-232
    serial port devices. |


    Most of the files you manipulate are normal files, directories, and symbolic links.


    Owner Permissions These permissions determine what the file''s owner can do with
    the file.'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# Chapter 14 · Setting Ownership and Permissions


    Group Permissions These permissions determine what members of the file''s group
    (who aren''t its owner) can do with the file.


    World (or "Other") Permissions These permissions determine what users who aren''t
    the file''s owner or members of its group can do with the file.


    In each of the three sets of permissions, the string identifies the presence or
    absence of each type of access: read, write, and execute. Read and write permissions
    are fairly self-explanatory. If the execute permission is present, it means that
    the file may be run as a program. The absence of the permission is denoted by
    a dash (—) in the permission string. The presence of the permission is indicated
    by the letter r for read, w for write, or x for execute.


    Thus the permission string —rwx-xr-x means that the file is a normal data file
    and its owner, members of the file''s group, and all other users can read and
    execute the file. Only the file''s owner has write permission to the file.


    Another representation of permissions is possible; it''s compact but bit confusing.
    It takes each of the three permissions groupings of the permission string (omitting
    the file type) and converts it into a number from 0 to 7 (that is, a base 8 or
    octal number). The result is a three-digit octal number. Each number is constructed
    by starting with a value of 0 and then:


    +   Adding 4 if read permissions are present


    +   Adding 2 if write permissions are present


    +   Adding 1 if execute permissions are present


    The resulting three-digit code represents permissions for the owner, group, and
    the world. Table 14.2 shows some examples of common permissions and their meanings.


    TABLE 14.2 Example permissions and their interpretations


    | Permission string | Octal code | Meaning |

    |---|---|---|

    | rwx rwx rwx | 777 | Read, write, and execute permissions for all users. |

    | rwx-xr-x | 755 | Read and execute permission for all users. The file''s owner
    also has write permission. |

    | rwx----x | 750 | Read and execute permission for the owner and group. The file''s
    owner also has write permission. Other users have no access to the file. |


    ![](img/77662199428609b7662c8dc9c0e45c10_295_0.png)


    Setting the execute bit on a nonprogram file doesn''t turn it into a program,
    of course; it indicates that a user may run a file that is a program.


    The procedures procedures involve binary numbers and logical, not arithmetic,
    operations. The arithmetic description is easier to understand, though.


    274'
  merge: -1
  img_proc: true
- pgno: 296
  md: '# Setting Permissions


    | Permission string | Octal code | Meaning |

    |---|---|---|

    | rwx------ | 700 | Read, write, and execute permissions for the file''s owner
    only; all others have no access. |

    | rw-rw-rw- | 666 | Read and write permissions for all users. No execute permissions
    for anybody. |

    | rw-rw-r-- | 664 | Read and write permissions for the owner and group. Read-only
    permission for all others. |

    | rw-rw---- | 660 | Read and write permissions for the owner and group. No world
    permissions. |

    | rw-r-r-- | 644 | Read and write permissions for the owner. Read-only permission
    for all others. |

    | rw-r----- | 640 | Read and write permissions for the owner, and read-only permission
    for the group. No permission for others. |

    | r-------- | 600 | Read and write permissions for the owner. No permission for
    anybody else. |

    | --------- | 400 | Read permission for the owner. No permission for any-body
    else. |


    There are 512 possible combinations of permissions, so Table 14.2 is incomplete.
    It shows the most common and useful combinations,


    Several special cases apply to permissions:


    Directory Execute Bits Directories use the execute bit to grant permission to
    search the directory. This is a highly desirable characteristic for directories,
    so you''ll almost always find the execute bit set when the read bit is set.


    Directory Write Permissions Directories are files that are interpreted in a special
    way. As such, if a user can write to a directory, they can create, delete, or
    rename files in the directory, even if the user isn''t the owner of those files
    and does not have permission to write to those files.


    > The usual rules for writing to directories can be modified with the sticky bit,
    which is described later in the "Using Sticky Bits."


    Symbolic Links Permissions on symbolic links are always 777 (rwxrwxrwx, or rwxrwxrwx
    to include the file type code). This access applies only to the link file itself,
    not to the linked-file. In other words, all users can read the contents of the
    link to discover the name of the file to which it points, but the permissions
    on the linked-file determine its file access. Changing the permissions on a symbolic
    link affects the linked-file.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# Chapter 14 - Setting Ownership and Permissions


    root Many of the permission rules do not apply to root. The superuser can read
    or write any file on the computer—even files that grant access to nobody (that
    is, those that have 000 permissions). The superuser still needs to execute bit
    set to run a program file.


    The procedure for setting permissions in a file manager is similar to that for
    setting the ownership of a file:


    +   - You normally adjust these settings using the same dialog box used to adjust
    ownership, such as the Nautilus dialog box shown earlier in Figure 14.1.


    +   - You don''t need to be root to adjust the permissions of files that you own.


    +   - You should use root access for this job only on files that you own.


    As seen in Figure 14.1, there are three Access items associated with the Owner,
    the Group, and Others:


    +   - The Owner item provides two options: Read-Only and Read and Write.


    +   - The Group and Others items both provide Read-Only and Read and Write plus
    the None option. You can use these options to set the read and write permission
    bits on your file.


    Nautilus requires setting the execute bit separately, by selecting the Allow Execution
    As Program check box. This check box sets all three execute permission bits; you
    cannot control execute more precisely with Nautilus. You cannot adjust the execute
    permissions on directories with Nautilus.


    # Setting Permissions in the Shell


    In a text-mode, you can use chmod to change permissions. This command is rather
    complex, mostly because of the complex ways that permissions may be changed. You
    can specify the permissions in two forms: as an octal number or in a symbolic
    form, which is a set of codes representing the string representation of the permissions.


    The octal representation of the mode is the same as that described earlier and
    summarized in Table 14.2. For instance, to change permissions on report.tex to
    r-w---, you can issue the following command:


    ```

    $ chmod 644 report.tex

    ```'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Setting Permissions


    A symbolic mode, by contrast, consists of three components:


    +   - A code indicating the permission set that you want to modify—u for the user
    (that is, the owner), g for the group, o for other users, and for all permissions


    +   - A symbolic indicating whether you want to add (+), delete (-), or set the
    mode equal to (+) the stated value


    +   - A code specifying what the permission should be, such as the common r, w,
    or x symbols, or various others for more-advanced options


    Using symbolic with chmod can be confusing, so we do not describe them fully here;
    however, you should be familiar with a few common types of use, as summarized
    in Table 14.3. Symbolic modes are more flexible than absolute modes because you
    can specify symbolic modes that modify existing permissions, such as adding or
    removing execute permissions without affecting other permissions. You can also
    set only the user, group, or permissions without affecting the others. With octal
    modes, you must set all three permission bits equal to a value that you specify.


    # TABLE 14.3 Examples of symbolic permissions with chmod


    | Command | Initial permissions | End permissions |

    |---|---|--|

    | chmod a+x bigprogram | rw--r-- | rwxxr--x |

    | chmod ug=rw report.tex | r------ | rw-rw---- |

    | chmod o-rwx bigprogram | rwxrwx-x | rwxrwx--- |

    | chmod g-w,o-rw report.tex | rw-rw-rw- | rw-r----- |


    # Setting the umask


    The user mask, or umask, determines the default permissions for new files. The
    umask is the value that is removed from 666 (rw-rw-rw-) permissions creating new
    files, or from 777 (rwxrwxwx) when creating new directories. For'
  merge: -1
  img_proc: true
- pgno: 299
  md: '# Chapter 14 · Setting Ownership and Permissions


    instance, if the umask is 022, then files will be created with 644 permissions
    by default, and new directories will have 755 permissions. Note that the removal
    operation is not a simple subtraction but a bitwise removal. That is, a 7 value
    in a umask removes the rwx permissions; but for files, which the starting point
    is rw-, the result is --- (0), not -1 (which is meaningless).


    You can adjust the umask with the umask command, which takes the umask value,
    as in umask 022. Typically, this command appears in a system configuration file,
    such as /etc/profile, or in a user configuration file, such as ~/.bashrc.


    # Using Special Permission Bits and File Features


    When you investigate the Linux directory tree, you will encounter certain file
    types that require special attention. Sometimes, you may just want to be aware
    of how these files are handled, since they deviate from what you might expect
    based on the information presented in earlier chapters. In other cases, you may
    need to adjust how you use ls or other commands to deal with these files and directories—for
    example, when using the sticky bit, using special execute permissions, hiding
    files from view, or obtaining long listings of directories.


    # Using Sticky Bits


    Consider the following commands, typed on a system with a few files and subdirectories
    laid out in a particular way:


    ```

    $ whoami

    kirk

    $ ls -l

    total 0

    drwxrxrx 2 root root 80 Dec 14 17:58 subdir

    $ ls -l subdir/

    total 2350

    -rw-r--r-- 1 root 2404268 Dec 14 17:59 f1701.tif

    ```


    These commands establish the current configuration: The effective user ID is kirk,
    and the current directory has one subdirectory, called subdir, which root owns
    to which kirk, like all of the system’s users, has full read/write access. This
    subdirectory has one file, f1701.tif, which is owned by root and to which'
  merge: -1
  img_proc: true
