  img_proc: true
- pgno: 268
  md: '# Creating New Accounts


    +   - Any single word that''s found in a dictionary (in any language)


    +   - Any simple keyboard or alphanumeric combination, such as qwerty or123456


    The best possible passwords are random collections of letters, digits, and punctuation.
    Unfortunately, such passwords are difficult to remember. A reasonable compromise
    is to build a password in two steps:


    +   1. Choose a base that''s easy to remember but difficult to guess.


    +   2. Modify that base in ways that increase the difficulty of guessing the password.


    One approach to building a base is to use two or more unrelated words, such as
    bun and pen. You can merge these two words (bunpen). Another approach, and one''s
    arguably better than the first, is to use the first letters of a phrase that is
    meaningful to the user. For instance, the first letters of "yesterday" I went
    to the "dentist" i yytd. In both cases, the base should not be a word in any language.
    As a general rule, the longer the password, the better.


    With the base in hand, it''s time to modify it to create a password. The user
    should apply at a couple of possible modifications:


    **Adding Numbers or Punctuation** One important change is to insert random numbers
    or punctuation in the base. This step might yield, for instance, bu3pn7 or yytd.
    As a general rule, add at least two symbols or numbers.


    **Mixing Case** Linux uses case-sensitive passwords, so jumbling the case of letters
    can improve security. Applying this rule makes Bu3nPE?n and y+19wttD, for instance.


    **Reversing Order** A change that''s very weak by itself but can add security
    when used in conjunction with the others is to reverse order of some or all letters.
    You might apply this to just one of a two-word base. This could yield Bu3nn?EP
    and Dtt99I+, for instance.


    **Growing the Haystack** A-would intruder''s trick of discovering a password has
    been linked to finding a needle in a haystack. One way to make this task harder
    is to increase the size of the haystack. In password terms, this means making
    a password larger. You can do this by using larger words or phrases, course, but
    this can make a password harder to remember and type. Even a size that simply
    repeats a single character can be helpful. You thus might turn the passwords into
    Bu3nn?EP11111iiii or DttIIIIIIIIW91+.


    ![](img/77662199428609b7662c8dc9c0e45c10_268_0.png)'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# Chapter 13 • Creating Users and Groups


    Your best tool for getting users to pick good passwords is to educate them.

    Here are some insights to share with users:


    +   - Passwords can be guessed by malicious individuals who know them or even
    who target them and look up personal information on social media, web-based telephone
    directories, business profiles, and so on.


    +   - Although Linux salts and hashes its passwords internally, programs that
    feed entire dictionaries through Linux''s password salting/hashing algorithms
    for comparison to a Linux system''s passwords. If a match is found, the password
    has been found.


    +   - User accounts might be used as a first step towards compromising the entire
    computer or as a launching point for attacks on other computers.


    +   - Users should never reveal their passwords to others, even people claiming
    to be system administrators. This is a common scam, because real system administrators
    don''t need users'' passwords.


    +   - The same password should not be used on multiple systems, because doing
    so quickly turns a compromised account on one computer into a compromised account
    on all of them.


    +   - Writing passwords down or emailing them are both risky practices. Writing
    a password on a sticky note stuck to the computer''s monitor is particularly foolish.


    Telling your users these things will help them understand the reasons for your
    concern, and it''s likely to help motivate at least some of them to pick good


    passwords.


    # DON''T USE THESE PASSWORDS!


    If you do a search on common passwords or a similar phrase, you''ll quickly discover
    websites that provide surveys showing the most typical and easily guessed passwords
    that security researchers have uncovered. Details vary from one to another, but
    typically common passwords include the following:


    +   - 123456


    +   - password


    +   - 12345678


    > Spam emails some-times try to trick users into revealing passwords by claiming
    that an email, banking, or other account has been deactivated or compromised.'
