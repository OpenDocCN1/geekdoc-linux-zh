    For this reason, you shouldn''t copy a retail Linux package''s disc unless you''ve
    researched the issue and found that copying is OK. If the distribution provides
    free-as-binary download links, copying is probably allowed.


    Linux distributions include installation programs, configuration programs, and
    the like. These tools are usually that a distribution packager can claim to in
    terms of copyright. Most distribution maintainers have made their installation
    and configuration routines available under the GPL or some other open source license,
