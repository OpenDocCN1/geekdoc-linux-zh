    file. You should consult the program''s documentation to learn how to do this.


    # Examining the Kernel Ring Buffer


    The kernel ring buffer is something like a log file for the kernel; however, unlike
    log files, it''s stored in memory rather than in a disk file. Like regular log
    files, its contents continue to change as the computer runs. To examine the kernel
    ring buffer, you can type dmesg. Doing so creates copious output, though, you''ll
    typically pipe the output through:


