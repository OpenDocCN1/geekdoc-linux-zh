- pgno: 144
  md: '# Locating Program Documentation Online


    In addition to the documentation that you find on your computer, you can locate
    documentation on the Internet. Most packages have associated Internet websites,
    which may be referred to in man pages, info pages, README files, or other documentation.
    Check these pages to look up documentation.


    A few Linux documentation resources are available on the Internet. The documentation
    offered by these sites, is often out-of-date. Typically, distributions have their
    own online sites providing up-to-date documentation. Helpful online documentation
    resources include the following:


    +   - The Linux Documentation Project, or LDP (www.tld.org)

    - Red Hat Product Documentation (https://access.redhat.com/documentation)

    - Official Ubuntu Documentation (https://help.ubuntu.com/)

    - openSUSE Documentation—ActiveDoc (https://activedoc.opensuse.org/)

    - Fedora Documentation (https://docs.fedoraproject.org/)


    Many Linux distributions use community volunteers to write and/ improve their
    documentation. These volunteers'' practical experience adds to the accuracy and
    depth of the documentation, which makes these sites valuable resources.


    # Consulting Experts


    Whatever the issue is that you are looking for documentation, chances that you''re
    not the first person to do so. In some cases, you can save yourself a lot of time
    by asking another person for help. Some specific resources that you can use include
    the following:


    **Program Authors** Many open source authors are happy to answer questions or
    provide limited support, particularly if a bug causes your problem. Bigger projects
    (including most Linux distributions) have many authors, and these projects often
    provide web forums or mailing lists to help users and developers communicate.


    **Web Forums and Mailing Lists** These resources differ in format but serve similar
    purposes: they enable users to communicate with one another and share their expertise.
    Many distributions have dedicated web forums; try a web search on your distribution
    name and *forum* to find yours. Mailing lists are more


