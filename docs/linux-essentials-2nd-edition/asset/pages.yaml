  md: '# Exploring Processes and Process Data


    Computers are dynamic and multipurpose machines; they use many tools to do a variety
    of jobs. This chapter describes the ways that you can manage these tools. One
    aspect of this task is installing, uninstalling, and upgrading software packages.
    Another aspect of software management is in managing programs after they’re running.
    (Running programs are often called processes.) Finally, this chapter covers log
    files, which record details of what running programs do—particularly programs
    that run automatically and in the background.


    +   - Understanding package management

    - Understanding the process hierarchy

    - Identifying running processes

    - Using log files


    # Understanding Package Management


    Package management is an area of Linux that varies a lot from one to another.
    Nonetheless, certain principles are common across Linux distributions, so we describe
    these principles, followed by some of the basics of the two major Linux package
    management systems. We then describe how to manage packages using both the RPM
    Package Manager (RPM, a recursive acronym) and Debian package systems.


    # Linux Package Management Principles


    If you''ve installed software in Windows, you''re likely familiar with the procedure
    of double-clicking an installer program, which places all the files associated
    with a program where they should go. A Windows software installer'
