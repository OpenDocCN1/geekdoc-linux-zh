- pgno: 254
  md: '# Understanding Accounts


    # NETWORK ACCOUNT DATABASES


    Linux can participate in these systems. In fact, some distributions provide options
    to enable such support at OS installation time. Typically, you must know the name
    or IP address of the server that hosts the network account database, and you must
    know what protocol system uses. You may also need a password or some other protocol-specific
    information, and the server may need to be configured to accept accounts from
    the Linux system that you''re configuring. Activating use of such network account
    databases after installing Linux is a complex topic that is not subtle to alter
    the behavior of tools such as password and usermod (described in Chapter 13) in
    subtle or not-so-subtle ways. If you need to use a system, you''ll have to consult
    documentation specific to the service that you intend to use.


    # Understanding Groups


    As noted earlier, groups are collections of accounts that are defined in the /etc/
    group file. Like /etc/passwd, the /etc/group file contains colon-delimited lines
    (records), each defining a single group. An example looks like this:


    ```

    users:x100:games,sally

    ```


    The fields in /etc/group are as follows:


    **Group Name** The first field, users in the preceding example, is the name of
    the group. You use it with most commands that access or manipulate group data.


    **Password** Groups, like users, can have passwords. A value of x means the password
    is defined elsewhere (but may be disabled), and an empty password field means
    the group has no password.


    **GID** Linux uses GID values, like UID values, internally. Translation to and
    from group names is done for the benefit of users and administrators.


    **User List** You can specify users who belong to the group in a comma-delimited
    list at the end of the /etc/group record.


    It''s important to recognize that users can be identified as members of a group
    in either of two ways:


    Certification Objective


    The use and management of group passwords is a topic that is beyond the scope
    of this book.'
