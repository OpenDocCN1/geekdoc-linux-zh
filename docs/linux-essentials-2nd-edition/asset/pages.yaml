- pgno: 50
  md: '# Looking at the Creative Commons


    No Discrimination Against Persons or Groups The license must not discriminate
    against any person or group of people.


    No Discrimination Against Fields of Endeavor The license must not forbid use of
    the program in any field, such as in business or genetics researchers.


    Automatic License Distribution The license must apply to anybody who receives
    the program, without needing a separate agreement.


    Lack of Product Specificity The license must not require that the program be used
    or distributed as part of a larger program—that is, you extract a single program
    from a larger collection and redistribute it alone.


    Lack of Restrictions on Other Software The license must not impose restrictions
    on other software that''s distributed along with the licensed software.


    Technology Neutrality The license must not be restricted based on specific technologies
    or interfaces.


    The first three of these principles are the most important, at least in terms
    of understanding the point of open source technology. The collection as a whole
    bears a strong resemblance to the FSF''s four principles and the extended description
    of its implications on the FSF''s web page (gnu.org/philosophy/free-sw.html).
    As already described, however, there are some differences, particularly with respect
    to licensing requirements for derived works.


    # Looking at the Creative Commons


    The Creative Commons (http://creativecommons.org) was founded by Lawrence Lessig.
    His goal is to combat what its creators and supporters view as a creative culture
    that is increasingly tilted to permissions granted (or not granted) by those who
    hold copyrights on everything. Much of our current culture is derived from earlier
    cultural works—for instance, the Star Wars movie collection is inspired, in part,
    by common myths and legends. The Star Wars itself is copyrighted, however, which
    limits the rights of current artists to distribute works that are derivative of
    it, at least without permission.


    The Creative Commons promotes its aims by providing six licenses that are designed
    for various purposes. You can select a license by answering few questions on the
    Creative Commons at http://creativecommons.org/choose/, such as whether you want
    to permit commercial use of your work.'
  merge: -1
