  img_proc: true
- pgno: 224
  md: '# CHECKING vi/vim EDITOR PACKAGE


    Your Linux system may not have the full vi/vim editor package installed by default.
    For example, your distribution may only come with the vim.tiny or vim.minimal
    package installed. With these packages, you can still access a form of the vi
    editor, though you may not have full access to the editor various features, including
    some of those described in this chapter. If you wish to learn and properly use
    the vi editor, it is recommended that you have the full vim package installed.


    To check your system, enter type vi at the command line. You should receive the
    pro-name (vi or vim), including its directory location, similar to what is shown
    here:


    ```

    $ type vi

    vi is hashed (/usr/bin/vi)

    ```


    Once you have the program name and its location, type readlink -f /location/program
    to determine whether the program is linked to another program. (Linked files are
    covered in Chapter 7, "Managing Files.") You may receive something similar to
    the following:


    ```

    $ readlink -f /usr/bin/vi

    /usr/bin/vim.tiny

    ```


    Next, you will need to check the software package that provided the program. (In
    some cases, the program name does not indicate which software package provided
    it.) Use the appropriate software package tool to determine this required information.
    The example here is on an Ubuntu distribution, so the dpkg -S command is used
    along with superuser privileges (obtaining superuser privileges is covered in
    more detail in Chapter 12.)


    ```

    $ sudo dpkg -S /usr/bin/vim.tiny

    [sudo] password for christine:

    vim.tiny: /usr/bin/vim.tiny

    ```


    You can see that in case the vim.tiny package is installed. If you find that the
    vim or vim.basic package is installed, you should have no problems using the vi
    editor commands in this chapter. However, if you do not either of these packages
    installed, as in the preceding example, you''ll want to install the package in
    order to follow along with the rest of this chapter. For the preceding example
    on the Ubuntu distribution, you would enter apt-get install vim to install the
    full vim package. (Installing packages is covered in Chapter 9.)'
  merge: -1
