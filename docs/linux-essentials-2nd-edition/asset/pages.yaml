- pgno: 244
  md: '# # Setting the Script’s Exit Value


    Ordinarily, a script’s return value is the same as the last command the script
    called: that is, the script returns $. You can control the exit value, however,
    or exit from the script at any point, by using the exit command. Used without
    any options, exit causes immediate termination of the script, with the usual exit
    value of $. This may be useful in error handling or in aborting an ongoing operation
    for any reason—if the script detects an error or if the user selects an option
    to terminate, you can call exit to quit.


    If you pass a numeric value between 0 and 255 to exit, the script terminates and
    returns the specified value as the script’s own exit value. You can use this feature
    to signal errors to other scripts that might call your script. You may have to
    include extra code to keep track of the causes of abnormal termination. For instance,
    you might set a variable (say, $termcause) to hold the cause of the script’s termination.
    Set it to 0 at the start of the script and then, if the script detects a problem
    that will cause termination, reset $termcause to some non- value. You can use
    any numeric codes you like; there’s no set meaning for such codes). On exit, be
    sure to pass


    ```

    exit $termcause

    ```


    # THE ESSENTIALS AND BEYOND


    Serious Linux users and administrators must have at least a basic understanding
    of shell scripts. Any configuration and startup files are, in fact, shell scripts,
    and being able to read them, and perhaps modify them, will help you administer
    your system. Being able to create new scripts is also important, doing so will
    help you simplify tedious tasks and create site-specific tools by gluing together
    multiple programs to accomplish your goals.


    # SUGGESTED EXERCISES


    +   Write a script that copies a file by prompting the user to enter the source
    and destination filenames rather than accepting them as arguments on the command
    line, as cp does.


    +   Some editors leave backup files with filenames that end in tilde (~). Write
    a script that, when you pass a directory name as an argument, locates all files
    in that directory. The script should then ask the user whether to delete each
    file individually and do so if only if the user responds by Y.


    (Continues)'
