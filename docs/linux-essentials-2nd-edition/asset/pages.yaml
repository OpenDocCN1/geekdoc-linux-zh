- pgno: 49
  md: '# Chapter 2 • Understanding Software Licensing


    ![](img/77662199428609b7662c8dc9c0e45c10_49_0.png)


    **FIGURE 2.1** Most free software is open source, but a significant amount of
    open source software is not free.


    Today, some tension exists between free software purists in the FSF''s sense and
    the more pragmatic open source community. For the most part, however, the two
    share goals that are similar enough that their differences are minor. In fact,
    two terms, free and open source software (FOSS) and free/libre open source software
    (FLOSS), are sometimes used as umbrella terms to refer explicitly to both types
    of software and development.


    # Defining Open Source Software


    The open source definition appears at www.opensource.org/definition. It consists
    of 10 principles, which are paraphrased here:


    **Free Redistribution** The license must permit redistribution, including redistribution
    as part of a larger work.


    **Source Availability** The author must make source code available and permit
    redistribution of source code and (if applicable) binary code.


    **Permission to Derive Works** The license must permit others to modify the software
    and distribute such modifications under the same license as the original.


    **Respect for Source Code Integrity** The license may restrict redistribution
    of modified source code, but only if patch files be distributed along the original
    source code. The license may require that derived works change the software''s
    name or version number.'
  merge: -1
