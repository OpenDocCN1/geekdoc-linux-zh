- pgno: 248
  md: '# CHAPTER 12


    # Understanding Basic

    Security


    **Linux is a multiuser OS**, meaning that it provides features to help mul-ntiple
    individuals use the computer. Collectively, these features constitute **accounts**.
    Previous chapters of this book have referred to accounts in passing but haven''t
    covered them in detail.


    This chapter changes that; it describes important account principles and a few
    commands that you can use to begin investigating accounts. Related to accounts
    are **groups**, which are collections of accounts that can be given special permissions
    on the computer, so this chapter also describes groups. One account, known as
    **root**, has special privileges on the computer. You use this account to perform
    most system administration tasks, so you should understand this account before
    you tackle the administrative tasks described in the last few chapters of this
    book. These important topics are at found-ation of system security.


    +   - Understanding accounts

    - Using account tools

    - Working as root


    # Understanding Accounts


    Accounts enable multiple users to share a single computer without caus-ing other
    too much trouble. They also enable system administrators to track who is using
    system resources and, sometimes, who is doing things they shouldn''t be doing.
    Account features help users use a computer and administrators administer it. Understanding
    these features is the basis for you to manage accounts.


    Some account features help you identify accounts and the files and resources associated
    with them. Knowing how to use these features will help you track down account-related
    problems and manage the computer''s users.


    > Even a single-user workstation uses multi-ple accounts. Such a computer may
    have just one user account, but several system accounts to help keep the computer
    running.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# Chapter 12 - Understanding Basic Security


    Certification Objective


    # Understanding Account Features


    Most account features are defined in the /etc/passwd file, which consists of colon-delimited
    lines, with each line (or record) defining a single account. An entry might require
    the following:


    ```

    rich:x:1003:100:Rich Blum:/home/rich:/bin/bash

    ```


    The information contained in the fields of this record includes the:


    **Username** An account''s username consists of lowercase letters, and occasionally
    numbers, in rich or thx1138. Underscores (_) and dashes (-) are also valid characters
    in some Linux distributions'' usernames, are dollar signs ($) at the end.


    **Password** User accounts are typically protected by a password, which is required
    to log into the computer. Direct login to system accounts (described later in
    this chapter) is disabled, so they lack passwords. (The root account is an important
    exception; it has a password in most distributions.) The password field in the
    /etc/passwd file usually contains an x, which is a code meaning that the password
    is stored in /etc/shadow, as described shortly.


    ![](img/77662199428609b7662c8dc9c0e45c10_249_0.png)


    **UID** In reality, the username is just a label that the computer displays to
    numerically challenged humans. The computer uses a user identification (UID) to
    track accounts. UID numbers begin with 0 (which refers to the root account). In
    many distributions, user accounts have UID numbers at 1,000 and above, with lower
    numbers reserved for system accounts.


    File ownership and permissions are described in Chapter 14, "Setting Ownership
    and Permissions."


    **GID** Accounts are tied to one or more groups, which are similar to accounts
    in many ways; however, a group is a collection of accounts. One of the primary
    purposes of groups is to enable users to give certain users access to their files,
    while preventing others from accessing them. Each account is tied directly to
    a primary group via a group ID (GID) number (1000 in the preceding example). Accounts
    can be tied to other groups by inclusion in the group''s definition, as described
    in Chapter 13, "Creating Users and Groups."


    **Comment field** The comment field normally holds the user''s full name (Rich
    Blum in this), although this field can hold other information instead or in addition
    to the user''s name.


    **Home Directory** User accounts, and some system accounts, have home directories(/home/rich
    in this example). A home directory is an account''s "home base." Normally, ownership
    of an account''s home directory belongs to'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# Understanding Accounts


    the account. Certain tools and procedures make it easy for users to access their
    home directories; for instance, the tilde (~) refers to a user''s home directory
    when used at the start of a filename.


    Default Shell A default shell is associated with every account. In Linux, this
    is normally Bash (/bin/bash), but individual users can change this if they like.
    Most non-root system accounts use the default shell to /usr/sbin/nologin or (/sbin/nologin)
    as an added security measure—this program displays a message stating that the
    account is not available. Using /bin/false also works in a similar way, although
    without the explanatory message.


    You might guess its name from /etc/passwd password information. This isnt not
    normally the case today, although it was many years ago. For historical reasons,
    /etc/passwd must be readable by all users, so storing passwords, even as a salted
    and hashed password, is risky. Passwords are stored in another file, /etc/shadow,
    where only root can read it. This file contains a salted and hashed password,
    as well as other information, which can disclose an account after a period of
    time or if the user doesn''t change the password within a given period of time.
    A typical /etc/shadow entry looks like this:


    ```

    root:$1eF$mFeKTUnT3kq2U0AAFl1pOUic:16860:5:30:14:-1:

    ```


    The meaning of each colon-delimited field on this line is as follows:


    Username Each line begins with the username. Note that the UID is not used in
    /etc/shadow, the username links entries in this file to /etc/passwd.


    Password The password is stored as a salted hash, so it bears no resemblance to
    the account. An asterisk (*) or exclamation mark (!) denotes an account with no
    password (that is, the account doesn''t login—it''s locked). This is common for
    accounts used by the system itself.


    Last Change The next field (16866 in this example) is the last password change.
    This date is stored as the number of days since January 1, 1970.


    Days Until a Change Is Allowed The next field (5 in this example) is the number
    of days before a password change is allowed. This is used to prevent users from
    changing their passwords as required and then changing them back to the original
    password.


    Days Before a Change Is Required The next field (30 in this example) is the number
    of days before another password change is required (since the last-word change).


    ![](img/77662199428609b7662c8dc9c0e45c10_250_0.png)


    Certification Objective


    Passwords are stored using a salted hash, a one-way mathematical process with
    additional input (salt), that produces looks like nonsense to humans. When a user
    types a password, it''s salted and hashed, and if the hashes match, access is
    granted.


    January 1970 is also called Unix time, POSIX time, or epoch (inception), and it
    is the amount of time elapsed since Midnight UTC on that date. It is used for
    time systems and could cause problems in the year 2038 on older 32-bit processors,
    because the computer will run out of storage to track time properly in this way.


    ![](img/77662199428609b7662c8dc9c0e45c10_250_1.png)


    ![](img/77662199428609b7662c8dc9c0e45c10_250_2.png)'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Chapter 12 · Understanding Basic Security


    Days of Warning Before Password Expiration If your system is configured to expire
    passwords, you may set it to warn the user when an expiration date is approaching.
    A value of 7 is typical. However 14 days, as shown in the preceding example, may
    be appropriate if your company''s employees take two-week vacations.


    Days Between Expiration and Deactivation Linux allows for a gap between the expiration
    of an account and its complete deactivation. An expired account either cannot
    be used or requires that the user change the password immediately after logging
    in. In either case, its password remains intact. A deactivated account''s password
    is erased, and the account cannot be used until the system administrator reactivates
    it. A -1 in this field, as shown in the preceding example, indicates that this
    feature is disabled.


    Expiration Date This field shows the date on which the account will expire. As
    with the last password change date, the date is expressed as the number of days
    since January 1, 1970. A -1 in this field, as shown in the preceding example,
    indicates that this feature is disabled.


    The terms encrypted and hashed are often confused when used with computer objects.
    You can decrypt an encrypted object, but you cannot "dehash" a hashed object.
    Passwords on Linux are salted and hashed, though you''ll often see the term mistakenly
    used instead in Linux documentation.


    Special Flag This field is reserved for future use and normally isn''t used or
    contains a meaningless value. This field is empty in the preceding example.


    For fields relating to counting days, a value of -1 or 9999 typically indicates
    that the relevant feature has been disabled. The /etc/shadow values are generally
    best left to modification by commands such as usermod (described in Chapter 13)
    and change. Understanding format of files enables you to review its contents and
    note any discrepancies, which could indicate that your system has been compromised.


    Examples of user files stored outside the user''s home directory include email
    in /var/spool/mail/ and temporary files in /tmp.


    The /etc/shadow file is usually stored with restrictive permissions, by root.
    This is craft to the shadow password system''s utility because it keeps non-root
    users from reading the file and obtaining the password list, even in a salted
    and hashed format. By contrast, /etc/passwd must be readable by ordinary users
    and usually has less-restrictive permissions.


    It''s important to realize that an account is not a single entity like a binary
    file. Account information is scattered across several configuration files, such
    as /etc/passwd, /etc/shadow, /etc/group, and possibly in other configuration files
    User reside in the users home directory and perhaps elsewhere. Managing accounts
    can require doing more than just maintaining a file. For this reason, various
    utilities exist to help create, manage, and delete accounts, as described in the
    rest of this chapter and in Chapter 13.


    *'
  merge: -1
  img_proc: true
