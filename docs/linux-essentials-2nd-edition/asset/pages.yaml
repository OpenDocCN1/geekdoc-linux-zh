- pgno: 60
  md: '# Using Open Source Software


    number of categories varies depending on the depth of analysis and the prejudice
    of the person doing the categorization. As a starting point, however, four categories
    will do:


    Commercial Software Individuals or companies develop commercial software with
    the intent to sell it for a profit. Developers generally keep the source code
    for commercial software secret, which means that users can''t normally make changes
    to the software except alter configuration settings that the software supports.
    In the past, commercial software was sold in stores or by mail order, but today
    it''s often sold via downloads from the Internet. Redistributing commercial software
    is generally illegal. Microsoft Windows and Microsoft Office are common examples
    of commercial software.


    Shareware Software From a legal perspective, share software is similar to commercial
    software in that it is copyrighted and the author asks for payment. The difference
    is that that is distributed on the Internet or in other ways and “sold” on an
    honor system—if you use the software beyond a trial period, you''re expected to
    pay for author. Shareware was common in 1991 and is still available today, but
    it''s rare.


    Freeware Software Freeware, like software, is available for free. Unlike authors,
    the authors of freeware don''t ask for payment. Sometimes, freeware is a stripped-down
    version of a more complete software or commercial program. At other times, the
    authors make it available for free to promote another product. Examples include
    Windows for many hardware devices or the Adobe Reader for reading Portable Document
    Format (PDF) files. As with commercial and shareware programs, freeware generally
    comes without source code.


    ![](img/77662199428609b7662c8dc9c0e45c10_60_0.png)


    > Freeware should not be confused with free software, which is closely related
    to open source software. Chapter 3, "Understanding Licensing," describes free
    software in more detail.


    Open Source Software Open source is defined by a set of 10 principles, available
    at www.opensource.org/osd/. The most important of these principles are the right
    of the user to redistribute the program, the availability of source code, and
    the right of the user to make and changed versions of the program. These principles
    mean that users can use open source programs to suit their own needs, even in
    ways or purposes not supported by the original author.


    Certification Objective


    Variants within each of these categories exist, as well as hybrids that don''t
    fit into any category. For instance, the Open Source Initiative maintains a list
    of licenses that it has approved as fulfilling its criteria (.opensource.org/licenses).
    However, developers sometimes release software using obscure licenses or using
    licenses that imposes conditions that run afloat of one of the more obscure OSI
    rules. Such software is technically not open source, but it might be closer to
    open source than to another category.


    Chapter 2 covers specific open source licenses in greater detail.'
