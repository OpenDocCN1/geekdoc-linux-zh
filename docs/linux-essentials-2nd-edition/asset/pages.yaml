  md: '# Chapter 6 • Getting to Know the Command Line


    You should experiment with these features. Tab completion and command history
    are both powerful tools that can help you avoid a great deal of repetitive typing.
    Command history can also be a useful memory aid. For example, if you''ve forgotten
    the exact name of a file or command that you used recently, you might be able
    to retrieve it by searching for part of the name that you remember.


    # Getting Help Using man Pages


    Sometimes you need help to remember what arguments or options a command can use,
    or the proper syntax needed when entering a command. The manual pages (also called
    man pages) can help. Manual pages describe not only programs, but also configuration
    files and other features of a Linux installation.

    Before you consult them, you should understand their purpose, and therefore their
    capabilities and limitations. With that information in mind, you can begin searching
    for help in the man page system, searching for man pages by section or by searching
    for keywords using the what-is or appropos utils. Once you''re reading a man page,
    knowing its structure can help you quickly locate the information you need.


    Certification Additional Objective


    # Understanding the Purpose of man Pages


    Linux man pages can be an extremely helpful resource, but you must understand
    their purpose and limitations. Unlike the help systems in some OSs, Linux man
    pages are not posted to tutorial in nature; they are intended as quick references
    to help somebody''s already somewhat familiar with a command, configuration file,
    or other OS feature. They''re most useful when you need to know the options to
    use with a command, the name of an option in a configuration file, or similar
    details. If you need to learn a new program from scratch, other documentation
    is often a better choice. Manual pages also vary greatly in quality; some very
    good, others are frustratingly terse, and occasionally even inaccurate. For the
    most part, the programmers who wrote the program in question write them.


    The upcoming section, "Finding Additional Documentation," describes how to locate
    documentation that is more tutorial than the man pages.


    In this book, many Linux commands are described in a tutorial style. However,
    information is often omitted on obscure options, subtle program effects, and so
    on. In principle, man pages should cover such finer points. This makes man pages
    an excellent resource to learn more about the commands described in this book,
    should you need to go further.'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# Locating man Pages by Section Number


    In the simplest case, you can read a man page by typing man followed by the name
    of a command, configuration file, system call, or other keyword. Each man page
    falls into one of nine categories, as summarized in Table 6.2. Some keywords lead
    to entries in multiple sections. In such instances, the man returns the entry
    in the section based on a search order typically specified by the SECTION setting
    in the /etc/man.db conf or the /etc/manpath.conf configuration file (depending
    on your distribution). You can override this behavior by passing a section number
    before the keyword. For instance, typing man password returns information from
    manual section 1 on the password command, but typing man 5 password returns information
    from manual section 5 on the /etc/passwd file format. Some man pages have entries
    with variant numbers that include the suffix p, as in section 1p. These refer
    to POSIX standard man pages, as opposed to the Linux man pages, which are, for
    the most part, written by the people who wrote the open source Linux programs
    that the man pages describe.


    # TABLE 6.2 Manual sections


    | Section number | Description |

    |---|---|

    | 1 | Executable programs and shell commands |

    | 2 | System calls provided by the kernel |

    | 3 | Library calls provided by program libraries |

    | 4 | Device files (usually stored in /dev) |

    | 5 | File formats |

    | 6 | Games |

    | 7 | Miscellaneous (macro packages, conventions, and so on) |

    | 8 | System administration commands (programs run mostly or exclusively by root)
    |

    | 9 | Kernel routines |


    The precise man page search order varies by Neith from one distribution to another,
    but section 1 is usually searched first, followed by section 8 and then the others.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Chapter 6 · Getting to Know the Command Line


    If you''re just starting out with Linux, chances are you''ll be most interested
    in section 1, which is usually the first section in the man page search order—although
    section 6 can also be interesting if you have the time to spare! As you move on
    to advanced and administrative tasks, you''ll find sections 4, 5, and 8 important.
    Sections 2, 3, and 9 are of most interest to programmers.


    Get help on using and reading the man pages by typing man man at the command line.


    # Searching for a man Page


    One of the problems with man pages is that it can be hard to help on a topic unless
    you know the name of the command, system call or file you want to use. Frequently,
    methods of searching the manual database exist and can help you lead to an appropriate
    man page:


    Details of what man pages are available vary from one distribution to another.
