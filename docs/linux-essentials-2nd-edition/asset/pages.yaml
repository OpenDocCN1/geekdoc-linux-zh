  md: '# Chapter 9 · Exploring Processes and Process Data


    of memory. Nonetheless, sometimes a program consumes too much memory, either because
    of inefficient coding or because of a memory leak—a type of program bug in which
    the program requests memory from the kernel and fails to return it when it''s
    done with the memory. A program with a memory leak consumes increasing amounts
    of memory, sometimes to the point where it interferes with other programs. As
    a short-term solution, you can usually terminate the program and launch it again,
    which resets the program''s memory consumption, something like draining a sink
    that''s filled with water from a leaky faucet. The problem will recur, but if
    the memory leak is small enough, you''ll at least able to get useful work done
    in the meantime.


    If you want to study the computer''s overall memory use, the free command is useful.
    This program generates a report on the computer''s total status:


    ```

    $ free

    ```


    | Mem | used | free | shared | buffers | cached |

