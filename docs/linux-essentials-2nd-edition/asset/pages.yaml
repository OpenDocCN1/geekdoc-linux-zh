  md: '# Redirecting Input and Output


    Notice in Figure 8.2 that when the cat command is issued with a single filename
    as an argument, it simply displays the file''s contents on the screen, as you
    would expect. However, when two files are used as an argument, the files'' contents
    are chained. The files themselves are not modified; only the output is concatenated.
    This can be quite handy. In this chapter’s “Redirecting Input and Output” section,
    how to preserve this output for future use is covered in detail.


    # Redirecting Input and Output


    If you want to save a program’s output for future reference, you can redirect
    it to a file. You can also redirect the input to a program from a file. Although
    input redirection may sound strange, some programs rely on this feature to enable
    them to process data, such as raw text files fed through a program that searches
    the text for patterns. In addition to redirecting output to files or from files,
    you can pass one program’s output to another as its input. A related technique
    involves the xargs command, which enables you to generate command options from
    files or other programs’ output.


    # Using Basic Redirection Operators


    Redirection is achieved with the help of redirection operators, which are short
    strings that appear after the command and its arguments. Table 8.6 shows the most
    common redirection operators. Be aware that output comes in two types:


    Standard Output This is for normal program messages.


    Standard Error This contains error messages.


    ![](img/77662199428609b7662c8dc9c0e45c10_182_0.png)


    | TABLE 8.6 Common redirection operators |

    | Redirection operator | Effect |

    | --- | --- |

    | > | Creates a new file containing standard output. If the specified file exists,
    it’s overwritten. |

    | >> | Appends standard output to the existing file. If the specified file does
    not exist, it’s created. |

    | 2 | Creates a new file containing standard error. If the specified file exists,
    it’s overwritten. |


    > Having two types of output enables them to be separated so that error messages
    do not confuse programs that might be expecting certain types of input from another
    program.


    (Continues)'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Chapter 8 • Searching, Extracting, and Archiving Data


    | Redirection operator | Effect |

    |---|---|n| 2>> | Appends standard error to the existing file. If the specified
    file doesn''t exist, it''s created. |

    | &> | Creates a new file containing both standard output and standard error.
    If the specified file exists, it''s overwritten. |

    | < | Sends the contents of the specified file to be used as standard input. |

    | << | Accepts text on the following lines as standard output. |

    | <> | Causes the specified file to be used for both standard input and standard
    output |


    As an example of redirecting output, a grep command to search for information
    on a particular user in all of the configuration files in /etc. Without redirection,
    a command might look like this:


    ```

    # grep david /etc/*

    ```


    Assuming that superuser privileges are used, this command will return a series
    of output lines like the following:


    ```

    Binary file /etc/aliases.db

    /etc/group:wheel:x:10:root,david

    /etc/group:audio:x:18:mythtv,david,pulse

    /etc/group:cdrom:x:19:haldaemon,david

    [...]

    ```


    Such output can be quite lengthy, and you might want to peruse it later. To do
    so, you could redirect the output to a file, like this:


    ```

    # grep david /etc/* > david-in-etc.txt

    ```


    Using the > redirection operator takes the output from the grep command and puts
    it into a file called david-in-etc.txt. If you wanted to see the output, you could
    use less:


    ```

    # less david-in-etc.txt

    Binary file /etc/aliases.db

    /etc/group:wheel:x:10:root,david

    ```


    Be careful when using the > redirection operator: if the file already exists,
    this operator will overwrite the file''s contents.'
