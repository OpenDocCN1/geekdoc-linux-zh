- pgno: 191
  md: '# Chapter 8 • Searching, Extracting, and Archiving Data


    The gzip, bzip2, and xz compression programs all apply lossless compression, meaning
    that the data recovered by uncompressing the file is identical to what we went
    into. In some graphics, audio, and audio-visual file formats apply lossy compression,
    in which some data are discarded. Lossy compression tools should never be used
    on program files, system configuration files, or most user data files; any loss
    in such files could be disastrous. That''s why supports only lossless compression
    tools.


    # Using zip


    Outside of the Unix and Linux world, the zip file format is a common one that
    fills a role similar to a compressed tarball. Linux provides the zip command to
    create zip files, and the unzip utility to extract files from a zip archive. Zip
    files typically have filename extensions of `.zip`.


    In most cases, you can create a zip archive by passing the utility the name of
    a target zip file followed by a filename list:


    ```

    $ zip newzip.zip afile.txt figure.tif

    ```


    This command creates the newzip.zip file, which holds the afile.txt and figure.tif.
    (The original files remain on your disk.) You''ll need to use zip options to achieve
    the desired results. Table 8.10 summarizes the most important zip options; however,
    the program supports many more. Consult its man page for details.


    # TABLE 8.10 Common zip options


    | Option (long form) | Option (short form) | Description |

    |---|---|---|n| N/A | -0 through -9 | Sets the amount of compression; -0 applies
    no compression, -1 applies minimal (but fast) compression, and so on through -9,
    which applies maximum (but slow) compression. |

    | --delete | -d | Deletes the specified files from the archive file. |

    | --encrypt | -e | Encrypts the archive with a password.(zip prompts you for this
    password.) |'
  merge: -1
  img_proc: true
