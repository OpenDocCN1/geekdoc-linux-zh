    editor (such as search-and-replace operations) via commands that can be typed
    at a command prompt or entered in a script.


    **echo** Sometimes a script must provide a message to the user; echo is the tool
    to accomplish this goal. You can pass various options to echo or a string to be
    shown to the user. For instance, echo "Press the Enter key" causes a script to
    display the specified string. You can also use echo to display the value of variables
    (described later, in "Using Variables")


