  md: '# Chapter 8 · Searching, Extracting, and Archiving Data


    You can specify one or more paths in which find should operate; the program will
    restrict its operations to these paths. The man page for find includes information
    about its search criteria, but Table 8.2 summarizes common criteria.


    # TABLE 8.2 Common find search criteria


    | Option | Description |

    | - | - |

    | -name pattern | You can search for files using their names with this option.
    Doing so finds files that match the specified pattern. This pattern is not technically
    a regular expression, but it does support many regular expression features. |

    | -perm mode | If you need to find files that have certain permissions, you can
    do so by using -perm mode expression. The mode may be expressed symbolically or
    in octal form. If you precede mode with a +, find locates in any of the specified
    permission bits are set. If you precede mode with a -, find locates in which all
    of the specified permission bits are set. |

    | -size n | You can search for files based on size with this expression. Normally,
    n is specified in 512-byte blocks, but you can modify this by trailing the value
    with a letter code, such as c for characters (bytes) or k for kilobytes. |

    | -group name | This option searches for files that belong to the specified group.
    |

    | -gid GID | This expression searches for files whose group (GID) is set to GID.
    |

    | -user name | This option searches for files that are owned by the specified
