  md: '# Understanding Package Management


    the text-mode tools are fairly straightforward, although you may need to consult
    their man pages to learn the details. Typically, they use logical subcommands,
    such as install to install a package, as in the following:


    ```

    # yum yumex

    ```


    You might use this command to install the GUI Yumex on a Red Hat, Fedora, or CentOS
    system. Similarly, you can remove a specific package by using the remove subcommand
    or upgrade all of computer''s packages by using upgrade:


    ```

    # yum remove zsh

    # yum upgrade

    ```


    This example removes the zsh package and then upgrades the remaining packages
    on the system. Both of these commands will produce a number of lines of output,
    and you may be asked to verify their actions. The man page for yum (or whatever
    management software your distribution uses) to learn more about this tool.


    If you need to deal with RPM package files directly, you should be aware that
    they have extensions of .rpm. These files also include codes for architecture
    type (such as fc21 or x86_64), and often codes for which they are intended (such
    as fc21 for Fedora 21). For instance, samba-4.1.17-1.fc21.x86_64.rpm is a package
    file for the Samba package, version 4.1.17, release 1, for Fedora 21, on the x86-64
    platform. To install it using the rpm command, you''d use this:


    ```

    # rpm -i samba-4.1.17-1.fc21.x86_64.rpm

    ```


    That takes a bit more work than using the yum command, as you need to know the
    complete filename of the installation package.


    # Managing Debian Systems


    The Debian GNU/Linux distribution created its own package system, and distributions
    based on Debian, such as Ubuntu and Mint, use the same system. Atop the basic
    Debian package system lies the Advanced Package Tool (APT), which provides access
    to network repositories.


    The dpkg command is the lowest-level interface to the Debian package system; it''s
    roughly equivalent to the rpm utility on RPM-based systems. Just like the rpm
    utility, to use the dpkg command to know the exact name of the package to install:


    ```

    # dpkg -i samba_3.6.1-3_amd64.deb

    ```


    ![](img/77662199428609b7662c8dc9c0e45c10_200_0.png)


    > Third-party implementations of APT for API RPM-based distribution also exist.
    See http://apt4rm.sourceforge.net for details. At least one RPM-based distribution,
    MCLLinux, uses APT natively.


    ![](img/77662199428609b7662c8dc9c0e45c10_200_1.png)'
