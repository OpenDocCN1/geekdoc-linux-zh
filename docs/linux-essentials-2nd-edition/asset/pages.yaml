  md: '# Understanding Where Things Go


    | Directory | Purpose |

    | /boot | Holds important boot files, such as the Linux kernel, the initial RAM
    disk, and often boot-loader configuration files. |

    | /bin | Holds programs files that are critical for normal operation and that
    ordinary users may run. |

    | /sbin | Holds programs files that are critical for normal operation and that
    ordinary users seldom run. |

    | /lib | Holds libraries—code used by many other programs—that are critical for
    basic system operation. |

    | /usr | Holds programs and data that are used in normal system operation but
    are not critical for a bare-bones boot of the system. This directory is split
    into subdirectories that mirror parts of the root organization—/usr/bin, /usr/sbin,
    /usr/lib, and so on. |

    | /home | Holds users'' home directory. Separating this directory into its own
    low-level files effectively isolates most user data from the OS, which can be
    useful if you want to reinstall the OS without losing user data. |

    | /root | The root user''s home directory. |

    | /var | Holds miscellaneous transient files, such as log files and print spool
    files. One subdirectory of /var, /var/tmp, deserves special attention. Like /tmp
    (described next), /var/tmp holds temporary files. These files should not be deleted
    when the computer reboots. |

    | /tmp | Holds temporary files, including temporary files created by user programs.
    Some may theoretically be deleted when the computer reboots, although in practice
    many distributions don''t do this. |

    | /mnt | The traditional mount point for removable media; sometimes split into
    subdirectories for each mounted filesystem. |

    | /media | The new mount point for removable media; typically split into subdirectories
    for each mounted filesystem. |

    | /dev | Holds device files, provide low-level access to hardware. |

    | /run | Holds information about the running system. |'
