- pgno: 185
  md: '# Chapter 8 • Searching, Extracting, and Archiving Data


    example, the cut command is used to pull the users'' home directories for the
    /etc/passwd file and then piped as input into the less command for easier viewing
    of the results:


    ```

    $ cut -f 6 -d ": /etc/passwd | less

    ```


    Often grep is used in pipelines to search for keywords in the output. In this
    example, the cut command is used to pull the users'' default shells from the /etc/passwd
    file and then piped as input to the grep command to search for the bash keyword:


    ```

    $ cut -f 7 -d ": /etc/passwd | grep bash

    ```


    You are not limited to pipe in one command line. For example, you can make the
    previous example more useful by putting it in a second pipe. To determine the
    number of users who have the bash shell in their /etc/passwd record, another pipe
    is used and the wc command is tacked onto the pipeline''s end:


    ```

    $ cut -f 7 -d ": /etc/passwd | grep bash | wc -l

    ```


    237

    In the previous example, three commands were included in the pipeline. There are
    237 user accounts that have the bash shell in their /etc/passwd record on this
    system.


    # Generating Command Lines


    Pipelines can be useful for tricky tasks. For instance, suppose that you want
    to remove every file in a directory tree with a name that ends in a tilde (-).
    (This filename convention denotes backup files created by certain text editors.)
    With a large directory tree, this task can be daunting. The usual file-deletion
    command (rm, described in Chapter 7) doesn''t provide an option to search for
    and delete every file in a directory tree that matches such a specific criterion.
    The find command could do the search part of the job (described earlier), but
    not the deletion.


    The solution is to combine the output of find to create a series of commands using
    rm. This can be accomplished in three primary ways:


    xargs The xargs command''s purpose in a pipeline is to build a command from its
    standard input. The basic syntax for this command is as follows:


    ```

    xargs [options] [command [initial-arguments]]

    ```


    ![](img/77662199428609b7662c8dc9c0e45c10_185_0.png)'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Redirecting Input and Output


    The command is the command that you want to execute, and initial-arguments is
    a list of arguments that you want to pass to the command. The options are xargs
    options; they aren''t passed to command. When you run xargs, it runs command once
    for every word passed to on standard input, adding to the argument list for command.
    If you want to pass multiple options to the command, you can protect them by enclosing
    the group in quotation marks.


    For instance, consider the task of deleting all of those backup files, denoted
    by tilde characters. You can do this by piping the output of xargs, which then
    calls rm:


    ```

    $ find / -name "-*" | xargs rm

    ```


    The first part of the pipeline (`find / -name "-**\`) finds all of the files in
    the current directory (/) or its subdirectories with a name in a tilde (*). This
    list is then piped to xargs, which adds each found file to its own rm command.
    The tricky task of finding and deleting all of those backup files is accomplished.


    Backticks A tool that''s similar to xargs in many ways is the backtick ( ), which
    is a character to the left of the 1 key on most keyboards. The backtick is not
    the same as the single quote character (''''), which is located to the right of
    the semicolon (;) on most keyboards.


    Text within backticks is treated as a separate command whose results are substituted
    on the command line. For instance, to delete those backup files, you can type
    the following command:


    ```

    $ rm `find / -name "-*"`

    ```


    Using backticks in this way is called command substitution, because you are providing
    a substitution for one of the command''s arguments. In the previous example, the
    results of the find command took the place of the file''s name as the rm command
    argument.


    $() Format Because it is so easy to confuse a backtick ('''') with a single quotation
    mark (''''), using backticks for command substitution is generally falling out
    of favor. If it is available on your distribution, it''s better to use another
    form of command substitution, the ($) format:


    ```

    $ rm $(find / -name "-**")

    ```


    The results are the same using this form of command substitution and are generally
    easier to read.'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Archiving Data


    A file-archiving tool collects a group of files into a single "package" file that
    you can easily move around on a single system; back up to a recordable DVD, USB
    flash drive, or other removable media; or transfer across a network. Linux supports
    several archiving commands, the most prominent being tar and zip. In addition
    to understanding these commands, you should be familiar with the consequences
    of using compression with them.


    # Using tar


    The tar program''s name stands for tape archiver. Regardless of its name, you
    can use tar to back up (also called archive) data to your hard disk or other media,
    not just to tapes. The tar program is a popular tool to archive various data files
    into a single file, called an archive file (the original files remain on your
    disk). Because the resulting archive file can be large, it is often compressed
    on the fly via the tar program into a tarball. In fact, tarballs are often used
    for transferring multiple files between computers in one step, as when distributing
    source code.


    The tar program is a complex package with many options, but most of what you''ll
    do with the utility can be covered with a few common commands. Table 8.7 lists
    the primary commands, and Table 8.8 lists the qualifiers that modify what the
    commands do. Whenever you run tar, you use exactly one command, and you usually
    use at least one qualifier.


    | Command | Abbreviation | Description |

    | --create | c | Creates an archive |

    | --concatenate | A | Appends tar files to an archive |

    | --append | r | Appends non-tar files to an archive |

    | --update | u | Appends files that are newer than those in an archive |

    | --diff--compare | d | Compares an archive on disk |

    | --list | t | Lists an archive''s contents |

    | --extractor--get | x | Extracts files from an archive |'
