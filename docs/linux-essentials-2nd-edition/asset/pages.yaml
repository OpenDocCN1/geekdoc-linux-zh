- pgno: 120
  md: '# Getting to Know the Command Line


    You may think of the command line as an archaic relic from the 1970s, with not
    much relevance to computing today. Not so! Although Linux has numerous GUI programs,
    they''re just flashy front ends to underlying text-mode tools. By learning those
    tools, you''ll be able to unlock Linux''s true power, enabling you to get your
    work done more quickly. You''ll also be able to manage should the Linux GUI system
    fail entirely, or should you need to log in and administer the system remotely.
    Command-line tools can also be scripted, meaning that you can write a simple program
    that performs a task more quickly or more easily could be achieved using the standard
    programs alone. For these reasons, most of the chapters in this book describe
    both the GUI and command-line methods of getting things done.


    To begin command-line operations, you must know how to start one. With that task
    in hand, you must know how to run programs and how to get help. You should also
    be familiar with several labor-saving features of Linux command lines.


    +   * Starting a command line

    * Running programs

    * Using shell features

    * Getting Help using man pages

    * Getting Help using info pages

    * Finding additional documentation


    # Starting a Command Line


    A Linux command line, or shell as it''s more properly called, is a program. Just
    like any other program, the shell must be launched. You can start a shell in a
    GUI window called a terminal program, or you can log in to the'
  merge: -1
  img_proc: true
- pgno: 121
  md: '# Chapter 6 • Getting to Know the Command Line


    computer locally via a text-mode console. In addition, a shell is started when
    you log to the console remotely using a text-mode login protocol. However, that
    particular method goes beyond the scope of this book.


    ![](img/77662199428609b7662c8dc9c0e45c10_121_0.png)


    The default shell in most Linux distributions is the Bourne Again Shell Bash or
    bash, which is based on an older shell called the Bourne Shell. Other shells are
    available. Most of them are similar to Bash in broad strokes, although some details
    differ. Each account specifies its own default shell, so individual users can
    change their shells if they like. (This is done with account management tools,
    such as usermod, which is described in Chapter 13, "Creating Users and Groups.")


    Other shells include tcsh, ksh, and zsh. Shell choice is a matter of preference.
    If you''re starting out, it''s best to stick with Bash simply because it is popular.


    # Launching a Terminal


    Most Linux distributions allow you to install GUI terminal programs. Typically,
    a desktop environment comes with its own, so your terminal program choices also
    depend on the desktop environments that you install. (You can even run one desktop
    environment''s terminal program within another.) Many terminal programs include
    the word terminal in their names, although some don''t, such as the K Desktop
    Environment''s (KDE) Console and the generic Xterm.


    The details of how to launch a terminal program from one desktop environment to
    another. You can normally find an entry in your desktop environment''s menus,
    as outlined in Chapter 4, "Using Linux Programs." For example, if you are using
    the KDE desktop environment, you can find the available terminals by following
    this menu-driven procedure:


    +   1. Click the menu button, typically located at the lower-left corner of the
    screen.

    2. Click All Applications > System > Terminal. You should see at least one terminal,
    and perhaps more than one, in a display similar to Figure 6.1. Three terminal
    programs are shown in Figure 6.1: Terminal (Console), Terminal - Super Mode, and
    Xterm.

    3. Select the terminal that you want to, and it will launch.


    Many desktop environments also provide a search method for terminal programs.
    For example, if you are using Ubuntu Unity desktop, follow this basic procedure:


    +   1. Click the Dash (an icon with the Ubuntu symbol) located at the top of the
    application launcher.

    2. In the search box, type term, as shown in Figure 6.2.'
