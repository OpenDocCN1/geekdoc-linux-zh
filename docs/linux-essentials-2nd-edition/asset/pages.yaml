  md: '# Understanding Disk Issues


    ![](img/77662199428609b7662c8dc9c0e45c10_106_0.png)


    FIGURE 5.2 GParted, like other GUI disk partitioning tools, provides a graphical
    representation of your partitions.


    If you''re working with a preinstalled Linux system, you may not need to partition
    your disk. However, if you replace or install a new hard disk, you''ll have to
    partition it before you can use it. You may also need to partition disks, although
    they generally come prepartitioned from the factory with one big partition.


    To partition a disk, you must know the disk''s device filename. In Linux, these
    filenames are normally /dev/sda, /dev/sdb, and so on, with each disk taking on
    a new letter. Partitions are numbered starting with 1, so you might refer to /dev/sda2,
    /dev/sdb6, and so on. When using MBR, partitions 1 through 4 are reserved for
    primary or extended partitions, whereas logical partitions number 5 and up.


    # Understanding Filesystem Issues


    Most disk partitions contain filesystems, which are data structures that help
    the computer organize your directories and files. In Windows, each filesystem
    receives its own device letter, such as A: and B: for floppy disks, C: for the
    first hard disk partition (normally the boot partition), and so on. In Linux,
    by contrast, all filesystems are part of a single directory tree. The main filesystem
    is referred to as the root (/) filesystem. If a disk has multiple partitions,
    each is mounted at a mount point in the root (/) filesystem—that is, the contents
    of the additional filesystems are made available at specific directories,


    > The word filesystem is sometimes applied to the directory structure as a whole,
    even if it contains multiple low-level filesystems. Which meaning is intended
    is usually made by the context.'
