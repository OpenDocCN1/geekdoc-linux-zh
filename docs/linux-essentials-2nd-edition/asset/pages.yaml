- pgno: 197
  md: '# Chapter 9 - Exploring Processes and Process Data


    is similar to a Linux package file, but there are differences. Linux packages
    have the following characteristics:


    Many program packages depend on libraries; libraries provide code that can be
    used by many programs.


    +   - Each package is a single file that can be stored on a disk or transmitted
    over the Internet.

    - Linux package files, unlike Windows installers, are not programs; packages rely
    on other programs to do the work of installing the software.

    - Packages contain dependency information, which indicates to the packaging software
    what other packages or individual files must be installed in order for the package
    to work correctly.

    - Packages contain version information, so that the packaging software can tell
    which of packages is more recent.

    - Packages contain architecture information to identify the CPU type (x86, x86-64,
    and so on) for which they''re intended. A separate code identifies packages that
    are architecture-independent, such as fonts and desktop themes.

    - Binary packages (which contain executable programs as CPU-specific) are typically
    built from source packages (which contain source code that a programmer can understand).
    It''s possible to build a new package, given the source package, which can be
    useful in some unusual circumstances.


    You can compile and install software from source code manually, without using
    a packaging tool. This advanced topic is beyond the scope of this book.


    ![](img/77662199428609b7662c8dc9c0e45c10_197_0.png)


    Packages can, and frequently contain files that will be installed to many directories
    on the computer. This fact makes tracking package contents critical.


    The package software maintains a database of installed packages (the package database).
    This information includes the names and versions of all installed packages, as
    well as the locations of all files installed from each package. This information
    enables the package software to uninstall package software quickly, establishes
    whether a new package''s dependencies have been met, and determines whether a
    package that you''re trying to install has already been installed and, if so,
    the installed version is older than the one that you''re trying to install.


    # Understanding Package Systems


    As noted earlier, two package systems, RPM and Debian, are common (although others
    exist exist). They differ in various technical details, as well as in the commands
    used to manage packages and in the format of the package files they use. You cannot
    install a Debian package on an RPM-based system, or vice versa. Indeed, installing
    a package intended for one distribution on another is a bit'
