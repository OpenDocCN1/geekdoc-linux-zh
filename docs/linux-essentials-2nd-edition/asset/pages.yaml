    Windows, you may know that Windows uses a backslash (\) for this purpose. Don''t
    confuse the two! In Linux, a backslash serves as a "quote" or "escape" character
    to enter otherwise hard-to-specify characters, such as spaces, or part of a filename.
    Also, note that a slash is not a legal character in a Linux filename for this
    reason.


