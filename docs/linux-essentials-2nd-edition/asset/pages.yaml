- pgno: 29
  md: '# Chapter 1 · Selecting an Operating System


    You may need to install extra desktop environments to use them. This topic is
    not covered in this book.

    As you learn more about Linux, you''ll discover that the GUI environments are
    quite flexible. If you find that you don''t like the default environment for your
    distribution, you can change it. Although they provide similar features, some
    people have strong preferences about desktop environments. Linux gives you a choice
    in the matter that is not available in Windows or OS X, so feel free to try multiple
    desktop environments.


    # Where Does Linux Fit in the OS World?


    This chapter''s title implies a comparison, and as this book is about Linux, the
    comparison must be with non-Linux OSs. Then we can compare Linux to other OSs
    or OS Families: Linux, Mac OS, and Microsoft Windows.


    # Comparing Linux to Unix


    If you attempt to draw a "family tree" of OSs, you would end scratching your head
    at. This is because OS designers often mimic each other''s features, and sometimes
    incorporate each other''s ideas into their OS''s workings. The result can be a
    tangled mess of similarities between OSs, with cases ranging from coincidence
    to code "borrowing." Attempting to map these influences can be difficult. In case
    of Linux and Unix, though a broad statement is possible: Linux is modeled after
    Unix.


    Unix was created in 1969 at AT&T''s Bell Labs. Unix''s history is complex and
    involves multiple forks (that is, splitting of the code into two or more independent
    projects) and entirely separate code rewrites. Modern Linux systems are, by large,
    the type of open source projects that clone Unix, or of original open source projects
    for Unix generally. These projects include the following:


    +   The Linux Kernel Linux Torvalds created the Linux kernel as a hobby project
    in 1991, but it soon grew to be much more than that. The Linux kernel was designed
    to be compatible with other kernels, in the sense that it used the same software
    interfaces in source code. This made using open source programs for Unix versions
    them easy.

    The GNU Project GNU''s Not Unix (GNU) project is an effort by the Free Software
    Foundation (FSF) to develop open source replacements for all the core elements
    of an OS. In 1991, the FSF had already released the most important of such tools,
    with the notable exception of the kernel. The GNU HURD kernel is now available,
    but is not as popular as the Linux kernel.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Where Does Linux Fit in the OS World?


    Alternatives to the GNU tools include proprietary commercial tools and open source
    tools developed for the Berkeley Software Distribution (BSD) Unix variants. The
    tools used on a Unix-like OS can influence its overall “flavor,” but all of these
    tool sets are enough to give any Unix variety a similar feel when compared to
    a non-Unix OS.


    Xorg-X11 The Window System is the GUI environment for most Unix OSs. Most Linux
    distributions today use the Xorg-X11 variety of X. As with the basic text-mode
    tools provided by the GNU project, choice of an X server can affect some features
    of a Unix-like OS, such as the types of fonts it supports.


    Desktop Environments GNOME, KDE, Unix, Xfce, and other popular source desktop
    environments have largely displaced commercial desktop environments, on commercial
    versions of Unix. Thus you won''t find differences between Linux and Unix in this
    area.


    Server Programs Historically, Unix and Linux have been popular as server OSs—organizations
    use them to run web servers, email servers, file servers, and so on. Linux runs
    the same server programs as do commercial Unix versions and the open source BSDs.


    User Productivity Programs In this realm, as in server programs, Linux runs the
    same software as do other Unix-like OSs. In a few cases, Linux runs more programs,
    or runs them better. This is because of Linux’s popularity and the vast array
    of hardware drivers that Linux offers. If a program needs advanced video card
    support, for example, it’s more likely to find that on Linux than on a less Unix-like
    OS.


    Linux can be thought of as a member of the family of Unix-like OSs. Although Linux
    is technically not a Unix OS, it is similar enough that the differences are unimportant
    compared to the differences between this family as a whole and other OSs, such
    as Windows. Because of its popularity, Linux offers better hardware support, at
    least on commodity PC hardware. Some Unix variants offer specific features that
    Linux lacks, though. For instance, the Zettabyte File System (ZFS), available
    on Solaris, FreeBSD, and some other OSs, provides advanced filesystem features
    that aren''t yet implemented in Linux.


    > Mac OS X, described shortly, is a commercial Unix-based OS that eschews both
    X and the desktop environments that run on in favor of Apple’s own GUI.


    > A ZFS add-on for Linux is available, but not fully integrated into the OS. Linux
    known filesystemtrfs offers many ZFS features, and it is gaining in popularity
    among various Linux distributions.


    # Comparing Linux to Mac OS X


    Mac OS X is a commercial Unix-based OS that borrows heavily from the BSDs and
    discards the usual Unix GUI (namely X) in favor of its own user interface. This
    makes OS X both very similar to Linux and quite different from it.


    Certification Objective'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Code Types


    Programmers write programs in a form known as source code. Although source code
    can be arcane to the uninitiated, it''s crystal clear compared to the program
    must take for a computer to run it—that is, binary code. A program known as a
    compiler translates source code to binary code. (Alternatively, some programming
    languages rely on an interpreter, which converts source code to binary code (on
    the fly), eliminating the need to compile source code.)


    The open source code refers to the availability of source code. This is generally
    withheld from the public in the case of commercial software programs and OSs.
    Conversely, a programmer with access to a program''s source code through open
    source software can fix bugs, and otherwise alter how the program operates.


    You can open an OS X Terminal window and type many of the same commands described
    in this book to achieve similar results. If a command described in this book is
    not present, you may be able to install it in one way or another. OS X ships with
    some Unix server programs, so you can configure it to work much like Linux or
    other Unix-like OS as a network server computer.


    OS X differs from Linux in its user interface, The OS X user interface is known
    as Cocoa from a programming perspective, or Aqua from a user''s point of view.
    It includes elements that are roughly equivalent to both OS X and a desktop environment
    in Linux. Because Cocoa isn''t compatible with X from a programming perspective,
    applications developed for OS X can''t run directly on Linux (or on other Unix-like
    OSs), and porting them (which is modifying the source code and recompiling them)
    is a nontrivial undertaking. Thus native X applications seldom make the transition
    to Linux.


    OS X includes an implementation of X that runs under Aqua. This makes the transfer
    of GUI Linux and Unix programs to OS X relatively straightforward. The resulting
    programs don''t entirely conform to the Aqua user interface, though. They may
    have buttons, menus, and other features that look out of place compared to the
    usual appearance of OS equivalents.


    Apple makes OS X available for its own computers. Its license terms forbid installation
    on non-Apple hardware, and installing OS X on non-Apple hardware is a nontrivial
    undertaking. A variant of OS X, known as iOS, runs on Apple''s iPad and iPhone
    devices, and it is equally nonportable to other devices. Thus OS X is largely
    limited to Apple hardware, Linux,


    The X in X server is a letter X, but the X OS is a Roman number (10), denoting
    the version of Mac OS.'
