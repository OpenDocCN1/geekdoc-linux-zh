  md: 'however, were slow to adopt free software. Many who did adopt it did so reluc-tantly
    or ever unwittingly—system administrators, pressed to perform their duties with
    minuscule budgets, would quietly install Linux, Apache, Samba, and other free
    software as a way to avoiding having to buy expensive commercial alternatives.


    The FSF’s advocacy efforts were (and are) based on a moral imperative—software
    should be free in the FSF’s view, with “free” defined as described earlier. This
    approach appeals to some, but others—particularly bus-nesses that want to make
    money selling software—find this type of advocacy strange at best and threatening
    at worst.


    For these reasons, the OSI’s creators designed their organization as a way to
    advocate for free software. By using a new term—open source—and soften-ing of
    the FSF’s moral imperatives, the OSI aims to promote open source software in the
    business world. The difference in tone from the FSF’s moral imperative can be
    seen in a mission statement on the OSI’s website (www.open-source.org):


    # OPEN SOURCE


    # Certification Objective


    Open source is a development method for software that harnesses the power of distributed
    peer review and transparency of process. The promise of open source is better
    quality, higher reliability, more flexibility, lower cost, and an end to predatory
    vendor lock-in.


    The biggest philosophical difference between the FSF and the OSI is reflected
    in a requirement of the GPL that derived works also be distributed under the GPL.
    The OSI has certified many licenses as being open source, including the GPL; however,
    many of these licenses look similar restrictions. Software released under such
    licenses has, in the past, found its way into closed-source products. The OSI
    does not object to such a path, provided the software was licensed in a way that
    permits it. The FSF, on the other hand, explicitly forbade such appro-priation
    for proprietary uses in its GPL.


    As a general rule, free software, in the FSF’s sense, is also open source soft-ware,
    although some licenses that the FSF recognizes as being free have not been approved
    by the FSF’s definition, though. Figure 2.1 illustrates this relationship.'
