  md: '| Option (long form) | Option (short form) | Description |


    | --freshen | -f | Updates files in an archive if they''ve changed since the original
    archive''s creation. |


    | --fixor--fix | -F or -FF | Performs repairs on a damaged archive file. The --fix/-F
    option performs minimal repairs, whereas --fixfix/-FF is more thorough. |


    | --filesync | -FS | Updates files in an archive if they''ve changed since the
    original archive''s creation, and deletes files from the archive if they''ve been
    deleted on the filesystem. |


    | --grow | -g | Appends files to an existing archive file. |


    | --help | -hor -? | Displays basic help information. |


    | --move | -m | Moves files into the zip archive; that is, the original files
    are deleted. |


    | --recurse--paths | -r | Includes files and subdirectories inside the directories
    that you specify. |


    | --split--size | -s size | Creates a potentially multifile archive, with each
    file no larger than size bytes. (A, m, g, or t can be appended to the size to
    specify larger units.) |


    | --exclude files | -x files | Excludes the specified files. |


    | --symlinks | -y | Includes symbolic links as such. (Ordinarily, zip includes
