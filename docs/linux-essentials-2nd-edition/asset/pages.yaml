- pgno: 25
  md: '# Investigating User Interfaces


    Earlier, we noted the distinction between text-mode and graphical user interfaces.
    Although most end users favor GUIs because of their ease of use, Linux retains
    a strong text-mode tradition. Chapter 6 describes text-mode tools in more detail,
    and Chapter 4, “Using Common Linux Programs,” covers basic principles of Linux
    GUI operations. It''s important that you have some grounding in the basic principles
    of both text-mode and graphical user interfaces now, since user interface issues
    crop from time to time in intervening chapters.


    # Using a Text-Mode User Interface


    In the past, and even sometimes today, Linux computers booted in text mode. Once
    the system had completely booted, the screen would display a simple text-mode
    prompt, which might look like this:


    Fedora release 21 (Twenty One)

    Kernel 3.18.6-200.fc21.x86_64 on an x86_64 (tty1)


    essentials login:


    The details of such a login prompt vary from one system to another. This example
    includes several pieces of information:


    +   * The OS name and version—Fedora Linux 21

    * The computer’s name—essentials

    * The name of the hardware device being used for the login—tty1

    * The login prompt itself—login:


    To log into such a system, you must type your username at the prompt: the system
    then prompts you for a password, which you must also type. If you entered a valid
    username and password, the computer is likely to display a login message, followed
    by a shell prompt:


    ```

    [rich@essentials:-$]

    ```


    In this book, we omit most of the prompts from example commands when they appear
    on their own lines. We keep the dollar sign ($) prompt, for ordinary users. Some
    commands must be entered as root, which is the Linux administrative user. We change
    the prompt to a hash mark (#) for commands, since most Linux distributions make
    a similar change to their prompts for the root user.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'The details of the shell prompt vary from one installation to another, but
    you can type text-mode commands at the shell prompt. For instance, you could type
    ls (short for list) to see a list of files in the current directory. Removing
    vowels, and sometimes consonants, shortens the most basic commands, in order to
    minimize the amount of typing required to execute a command. This has the unfortunate
    effect of making many commands rather obscure.


    Some commands display no information, but most produce some output. For instance,
    the ls command produces a list of files:


    ```

    $ ls 106792c01.doc f0101.tif

    ```


    This example shows two files in the current directory: 106792c01.doc and f0101.tif.
    You can use additional commands to manipulate these files, as cp to copy them
    or rm to remove (delete) them. Chapter 6 and Chapter 7 (“Managing Files”) describe
    some common file-manipulation commands.


    Some textmodeprograms take over the display to provide constant updates or to
    enable you to interact with data in a flexible manner. Figure 1.1, for instance,
    shows how you use the nano text editor, which is described in detail in Chapter
    10, “Editing Files.” Once nano is working, you can use your keyboard’s arrow keys
    to move the cursor around, add text by typing, and so on.


    ![](img/77662199428609b7662c8dc9c0e45c10_26_0.png)


    FIGURE 1.1 Some text-mode programs take over the entire display.


    If you use a graphical login, you can use a text-mode shell known as a terminal.
    Common Linux GUIs provide the ability to launch a terminal program, which delivers
    a shell prompt and the means to run text-mode programs.'
  merge: -1
  img_proc: true
- pgno: 27
