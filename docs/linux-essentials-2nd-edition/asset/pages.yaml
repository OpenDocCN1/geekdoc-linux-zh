- pgno: 267
  md: '# Chapter 13 - Creating Users and Groups


    Permissions,” individuals can change the group affiliations and group permissions
    of their own files. Thus the way that you use groups can influence your computer''s
    overall security strategy. Two approaches are common:


    **User Groups** Each user can have an associated group; for instance, the user
    can have a group ownership on his files to set group permissions to whatever is
    desired, and the system administrator can add users to the luke group. Thereafter,
    members of the group may access files in this group by using the permissions determined
    by the user luke. This approach emphasizes controlling access to individual users''
    files.


    **Project Groups** In this method, you create groups on work projects, departmental
    affiliations, or other real-world groupings of users. For instance, you might
    have a group called sales for the sales department. Members of this group who
    share files with other members of this group would assign group ownership and
    permissions appropriately and store files in an agreed-upon location. This approach
    works best when the computer is used by a large number of people who collaborate
    in easily defined groups.


    By default, some distributions employ a group strategy and others use a project
    group strategy. In the latter case, most users are in a group called users or
    something similar by default.


    These two approaches are not mutually exclusive; you can mix and match, or create
    your own approach. You should also realize that users can be members of multiple
    groups. In fact, this is required for the user groups to work at—otherwise, groups
    are redundant with accounts.


    If you use the group approach, you should think about which group should be a
    new user''s primary group. This is the group that will be assigned group ownership
    of the user''s files by default.


    # Selecting a Good Password


    When you create an account, you typically should create a password for it. Sometimes,
    the user can select the password when the account is created. Other times, you''ll
    need to select a password that the user will use initially. In such cases, instruct
    the user to change the password as soon as possible. In either case, it''s important
    to educate users about selecting a good password. Poor common passwords include
    those based on the following:


    Be sure to follow the advice in this section, especially for the root password!


    +   - The names of family members

    - Favorite books, movies, television shows, or the characters in any of them

    - Telephone numbers, street addresses, or Social Security numbers

    - Any other meaningful personal information'
