    # Chapter 15


    +   1. The gateway computer is a router that transfers data between two or more
    network segments. As such, if a computer isn''t configured to use a gateway, it
    won''t be able to communicate beyond its local network segment, as option C suggests.
    (If your DNS server is on a different network segment, name resolution via DNS
    won''t work, although other types of name resolution, such as /etc/hosts file,
    will still work.) Lack of a gateway address will not cause the symptoms described
    by options A, B, D, or E.


    +   2. B, C When used to display information on an interface, ifconfig shows the
    hardware (option C) and IP (option B) addresses of the interface, the protocols
    (such as TCP/IP) bound to the interface, and statistics on transmitted and received
    packets. This command does not return information about programs using the interface
    (option A), the hostname associated with the interface (option D), or the gateway
    with which it communicates (option E).


    +   3. A, E DNS problems can manifest as an ability to connect to computers using
    IP addresses without using hostnames. Thus options A and E (and other DNS-related
    problems) could create the symptoms described. If the target system were configured
    to ignore ping packets, as described in option B, it wouldn''t respond when you
    identified it by IP address. The target system''s DNS configuration (option C)
    doesn''t enter into the equation, because it responds to the ping request via
    IP address. Your computer''s local hostname configuration won''t affect its ability
    to send or receive packets, even by hostname, option D is incorrect.


    +   4. True IPv4 addresses are 4 bytes long, and they are typically expressed
    as four decimal numbers separated by dots, as in 192.168.0.1.'
