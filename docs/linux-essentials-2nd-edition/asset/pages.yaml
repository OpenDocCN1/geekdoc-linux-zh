    # Using Pipes


    Another type of redirected output is a command-line pipe or pipeline. In a pipe,
    the standard output from one program is redirected as the standard input to a
    second program. You create a pipe using a vertical bar (|) between the two commands;
    this key is usually above the Enter key and accessed with Shift. Pipelines can
    be useful when applied in various ways. For instance, you might pipe the lengthy
    output of a program through the less pager, which enables you to page up and down
    through the output. In this


    Chapter 6 describes the Less pager.


    ![](img/77662199428609b7662c8dc9c0e45c10_184_0.png)'
