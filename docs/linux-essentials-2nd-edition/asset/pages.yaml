  img_proc: true
- pgno: 308
  md: '# Configuring a Network Connection


    Router A router (also known as a gateway) connects two or more networks together.
    Your desktop or server computer is likely to connect directly to a handful of
    computers, including a router. The router links to another network, which in turn
    links to another, and so on. To contact a computer on another network, your computer
    communicates through the router. Homes and small businesses use some broadband
    routers to connect to the Internet. Such devices perform routing and have built-in
    DNS, DHCP, and other useful services.


    > Certification Objective


    TCP/IP The Transmission Control Protocol/Internet Protocol (TCP/IP) is a set of
    standards that underlies most modern network communications in the software-level.


    Wi-Fi This term applies to the common forms of wireless networking, more properly
    known as IEEE 802.11. Several variants are available that differ in speed. The,
    "Creating a Wi-Fi Connection," in this chapter, describes Wi-Fi configuration
    in more detail.


    The process of creating a network connection is one of assigning the IP address
    and associated netmask. Using the IP address, the computer can communicate with
    other computers on the local network—that is, anything that doesn''t require a
    router as an intermediary. In some cases, you will need to tell the computer about
    the network''s router so that it can communicate with other network segments (often
    including the entire Internet). Giving your computer the IP address of a DNS server
    will enable you to specify computer hostnames rather than IP addresses, which
    is a highly desirable feature. These four features—the IP address, the netmask,
    the router''s IP address, and the DNS server''s IP address—constitute the basic
    network configuration features.


    In most cases, DHCP can dish out these features. This can make network configuration
    fairly automatically, as you''ll see in this chapter. If your network doesn''t
    support DHCP, though, you''ll need to contact your network''s administrator to
    obtain the critical configuration information. In some cases, you will need still
    more information. For instance, if you''re using Wi-Fi, you''ll need to know the
    Wi-Fi network''s name and perhaps its password.


    # Configuring a Network Connection


    In most cases, your network connection will come up automatically (nearly so).
    Sometimes, though, you''ll have to adjust the configuration manually or simply
    activate it. If available, automatic configuration is handled via DHCP, so


    > Several alternatives to TCP/IP exist, such as AppleTalk, NetBEUI, and IPX/SPX.
    TCP/IP, however, is the most common network protocol, and the one that underlies
    the Internet.'
