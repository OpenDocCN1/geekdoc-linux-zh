  md: '# ASCII AND UNICODE


    ASCII dates to the 1960s. It''s a 7-bit code, meaning that it supports a maximum
    of 2⁷ or 128 characters. (In practice, ASCII uses 8 bits, so an extra 128 characters
    are available. These bits encode control characters or are used in ASCII extensions.)
    ASCII was created to encode the letters used in English, digits, and symbols.
    This original intent, combined with ASCII''s limited character count, makes it
    unhelpful for many English languages. ASCII doesn''t have enough characters to
    handle all the requirements of non-English languages.


    Over the years, extensions to, and variants of, ASCII have been used to support
    additional characters and alphabets that ASCII doesn''t support. One way to do
    this is to use a code page to specify an alphabet. For instance, code page 866
    encodes Cyrillic (the alphabet used by most Slavic languages). The problem with
    code pages is that you can generally use one at a time.


    Unicode is a more modern approach. It provides a much larger character set, allowing
    the encoding of any alphabet in common use on Earth, including the huge graphic
    writing systems used in languages such as Chinese and Japanese. The problem is
    that Unicode requires more bits, and ways to encode it efficiently. Fortunately,
    Unicode Transformation Format (UTF) schemes are limited in number compared to
    code pages. Some, such as UTF-8, have the first characters the same as ASCII,
    so an ASCII file is also a valid UTF-8 file (or other Unicode formats). Many text
    editors handle UTF-8 well so you can use a text editor to write text files in
    any language you like. You may still need to set localization options to tell
    Linux what sort of keyboard you use and use code page to rely on code.


    Text files encode the ends of lines using one or two ASCII characters. End of
    line encoding differs between Unix (Linux) and Windows, but most programs can
    handle either method.


    Formatted text files encode special formatting using unique character sequences.
    Although you can edit such files with specialized editors also exist for many
    of these file types.


    Text files consist of lines that can vary in length from 0 characters to the file
    entire size and can hold any number of data types. You might want to create or
    edit some of these as an ordinary user, while others are important for administering
    a Linux system. The main file types include the following:


    +   - Human language files

    - Programming language files

    - Formatted text files

    - Program and system configuration files

    - Program log files


    Some files contain elements of multiple categories. Email, for instance, can be
    stored in text files. An email file consists largely of human language, but email'
