  md: 'In this example, cat takes a filename as an argument: afile.txt. Many programs
    enable you to perform a wide variety of tasks depending on the precise arguments
    that they are given. You can learn about such arguments, and other usage details,
    by using the Linux manual system. The program to do this is called man, and you
    pass it the name of the command that you want to learn about as an argument, in
    as man cat to learn about the cat command.


    The man command illustrates a feature of some text-based programs: they can take
    over the entire terminal when they are launched. In the case of man, you can scroll
    up or down in the documentation by using arrow keys, Page Up, Page Down, and so
    on. Text editors, such as vi, emacs, and nano, use similar features.


    # Running GUI Programs


    You can run GUI programs from a terminal well as text-based programs (however,
    this doesn''t work if you logged in using a text-mode VT). You must also know
    the program''s filename to run it. The filename is usually related to the name
    you use to launch the program from a desktop''s menu, but it''s not always identical.
    For instance, the Firefox web browser''s filename is firefox, so that''s what
    you need to launch Firefox in this.


    Some GUI programs produce text-mode output that can be useful in tracking down
    the source of problems, so launching a program from a terminal window can be a
    good first step when debugging problems. You might also want to launch programs
    in this way because it can be quicker than tracking programs in a desktop environment''s
    menus, or because a program doesn''t appear in the environment''s menus.


    # Running Programs in the Background


    When you launch a GUI program from a terminal, the GUI program opens its own window
    or windows. The terminal window remains open, but will normally become unresponsive.
    If you want to type more commands in this window, you can do so by selecting it
    and pressing Ctrl+Z. This suspends the running program—that is, it''s sent to
    sleep. In its sleeping state, the GUI program won''t respond to input or do any
    work. However, you can now use the terminal window to type in commands.


    After you have suspended a program, if you want to run the GUI program and to
    use the terminal from which you launched it, you can type bg (short for background)
    in the terminal. Both programs will now be active.'
