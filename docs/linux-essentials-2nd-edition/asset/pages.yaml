- pgno: 365
  md: '# Learn Linux Quickly and Easily


    Mastering the Linux operating system will help you advance your IT career. This
    straightforward guide will help you master the fundamentals of Linux and help
    you prepare for the Linux Essentials Exam. Beginning with operating system basics,
    Linux Essentials, 2nd Edition explains Linux properties and principles and shows
    how to manage this open source operating system in the workplace. Lessons are
    organized by task, and each chapter features exercises and review questions to
    solidify your knowledge.


    # Learn these Linux essentials—and more:


    +   * Types of distributions and open source applications

    * All about freedom, licensing, operations, and navigation

    * Using common Linux programs

    * Navigating the command line


    +   * Searching, extracting, and archiving data

    * Turning commands into scripts

    * Creating user types, users, and groups

    * Managing network connections


    ![](img/77662199428609b7662c8dc9c0e45c10_365_0.png)


    Get help on commands


    ![](img/77662199428609b7662c8dc9c0e45c10_365_1.png)


    # This Essentials book features:


    +   * Chapter-opening learning objectives

    * Full coverage of all exam objectives

    * Screenshots and illustrations reinforce learning

    * Essentials and Beyond—summaries and additional suggested exercises


    Use GUI programs to


    # About the Authors


    Christine Bresnahan has worked in the IT industry for more than 30 years and is
    currently an adjunct professor of Python programming and Linux system administration
    classes at Ivy Tech Community College in Indianapolis. Linux Bible, 4th Edition,
    and Linux Command Line and Shell coauthor with Richard Blum. Richard Blum is a
    network and systems administrator, currently managing Microsoft, Unix, Linux,
    and Novell servers for a network with more than 3,500 users. He has developed
    online programming and Linux courses that teaches to students worldwide.


