- pgno: 306
  md: '# Managing Network Connections


    Networking is a critical part of modern computing. Fortunately, most Linux distributions
    can often create a network connection automatically. On occasion, however, this
    process does not work, or you may need to tweak the connection or debug problems
    when they occur. This chapter therefore covers network configuration.


    We begin by describing some basic network features that you must understand to
    manage your network configuration properly. We then describe the process of configuring
    a network connection. A few tests will help you track down and correct problems,
    so we explain them in case you run into difficulties. Finally, we explore the
    dark side of networking: the undesirables on the Internet and how to keep them
    out of your computer.


    +   - Understanding network features

    - Configuring a network connection

    - Testing your network connection

    - Protecting your system from the bad guys


    # Understanding Network Features


    Networking involves numerous protocols and technologies that interact in complex
    ways. Although modern networks and OSs make it easy for users to set up their
    computers (at least 10 or 20 years ago) doing anything but the simplest configuration
    requires understanding the key networking protocols and technologies. To begin,
    we present the following mini-glossary of networking terms:


    DNS The Domain Name System (DNS) is a global network of servers that translate
    between hostnames and IP addresses (both described shortly). Most computers are
    configured to use a DNS server, which is a server that performs DNS lookups.


    Certification Objective Other means of name resolution exist, but they are impractical
    for handling more than a few dozen computers.'
  merge: -1
  img_proc: true
- pgno: 307
  md: '# DHCP


    # Ethernet


    Ethernet is the wired network hardware that''s most often used today. Ethernet
    comes in several varieties, the most common of which uses cables wires with broader
    plugs. Common speeds range from 10 megabits per second (Mbps) to 10 gigabits per
    second (Gbps, gigabit), although faster speeds are available.


    # Hostname


    This is a name that a computer uses for the benefit of humans. Hostnames consist
    of a computer portion and a network portion. For instance, in lunokhod.luna, the
    machine name is lunokhod and the network name is .luna.


    # Internet


    The Internet refers to the globe-spanning network of interconnected computers
    that use the standard Internet protocol suite (TCP/IP) to communicate. Individual
    networks use routers to join and create the Internet.


    # IP Address


    An Internet Protocol (IP) address is a number that''s assigned to a computer for
    network addressing purposes. You can think of an IP address as being like a street
    address or telephone number. Computers communicate with each other via IP addresses.
    In the past, 4-IPv4 addresses dominated (such as 192.168.1.10); however, the pool
    of IPv4 addresses has recently been depleted, so many new installations use 6-IPv6
    addresses (such as fe80:0000:0023:23fe:6bdc). IP addresses are broken down into
    two parts: a machine portion and a network portion. The network portion may be
    used in routing (see router), whereas the machine portion identifies a computer
    on a given network. This breakdown into machine and network addresses is accomplished
    via a network mask, as described.


    # Network Mask


    A network mask (mask or netmask for short) is a way to distinguish between the
    network and machine portions of an IP address. The netmask defines the individual
    bits of an IP address that belongs to each part of the address. This can be done
    by giving each bit of the machine address a binary value of 1 and expressing the
    result as a number (such as 255.255.255.0 or 255.255.255.250) for IPv4 address
    or by specifying the number of bits in the machine portion of the address (as
    in 16 or 24).


    Other methods of wired networking exist, but may be obsolete or used in very high-speed,
    long-distance, or other capacities.


    Certification Objective


    ![](img/77662199428609b7662c8dc9c0e45c10_307_0.png)'
