    that should be searched when the user opens a domain name from a hostname.\n\n\
    A DHCP Client A DHCP program, as dhclient or dhcpcd, can\noften configure a network\
    \ connection automatically. You simply type the pro-\ng'name, followed by a network\
    \ device name.\n\nDistribution-Specific Network Scripts The ifconfig, route, and\
    \ DHCP\nclient programs produce temporary changes to the computer's network configu-\r\
    ation. If you want to make permanent changes, you must store your settings in\n\
    a configuration file. The name and format of this files varies from one distribu-\n\
    tion to another. For instance, in Fedora it is /etc/sysconfig/network-scripts/\n\
    ifcfg-netname is the name of the network device; in Debian or\nUbuntu, it is /etc/network/interfaces.\n\
    \nThe ifconfig and route commands are both complex, however, their basic\nuse\
    \ is fairly straightforward. Suppose that you want to assign the IP address\n\
    192.168.29.39/24 to the eth0 network device and tell it to use 192.168.29.1 as\n\
    the router. The following two commands would be the trick:\n\n```\n# ifconfig\
