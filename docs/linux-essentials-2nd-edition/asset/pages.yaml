    affect how you obtain the software, what you can do with it, and how it changes
    over time. This section describes these principles. We also describe how Linux
    functions as a sort of “magnet,” integrating software from many sources into one
    place.


    # Understanding Basic Open Source Principles


    Broadly speaking, software can be described as coming in several forms, each with
