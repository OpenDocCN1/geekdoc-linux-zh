    If you lack permission to list a directory''s contents, find will return that
    directory name and the error message Permission denied.


    Many variant and additional options exist; find is a powerful command. As an example
    of its use, consider the task of finding all source-code files, which normally
    have names that end in .c, in all users'' home directories. If these home directories
    reside in the /home directory tree, you may issue the following command:


