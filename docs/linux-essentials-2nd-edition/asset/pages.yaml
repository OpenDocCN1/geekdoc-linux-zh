    **find** Whereas searches for patterns within the contents of files, find so based
    on filenames, ownership, and similar characteristics. Chapter 8 covers this command.


    **cut** This command extracts text from fields in a file. It''s frequently used
    to extract valid information from a file whose contents are in a pattern. To use
    it, you pass one or more options that specify what information you want, followed
    by one or more filenames. For instance, users'' home directories appear in the
    sixth colon-delimited field of the /etc/passwd file. You can type


    ```

    cut -f 6 -d ":" /etc/passwd to extract this information.

    ```


