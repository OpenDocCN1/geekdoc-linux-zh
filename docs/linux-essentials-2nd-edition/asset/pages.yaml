  md: '# Chapter 9 • Exploring Processes and Process Data


    # TABLE 9.2 (Continued)


    | Log file | Contents |

    | --- | --- |

    | messages or syslog | This is a general-purpose log file that contains messages
    from many daemons that lack their own dedicated log. |

    | secure | You can find security-related messages in this file, including notices
    of when users employ su, sudo, and similar tools to acquire root privileges. |

    | Xorg.log | Information on the most recent startup of the X Window System (X)
    appears in this log. |


    Log file rotation occurs late at night, so it won''t happen if you shut off your
    computer. Leave it overnight periodically to ensure log files are rotated.


    Log files are frequently *rotated*, meaning that the oldest log file is deleted,
    the latest log is renamed with a date or number, and a new log file is created.
    For instance, if it''s rotated on December 1, 2016, `/var/log/messages` will become
    `/var/log/messages-20161201`, `/var/log/messages-1.gz`, or similar, and a new
    `/var/log/messages` will be created. This practice keeps log files from growing
    out of control.


    Most log files are plain-text files, so you can check them using any tool that
    can examine text files, such as a text editor. One handy command is `tail`, which
    displays the last 10 lines of a file (or as many lines as you specify with the
    `-n` option). For instance, typing `tail /var/log/messages` shows you the last
    10 lines of that file.


    Not all programs log messages. Typically, only daemons do; ordinary programs display
    error messages in other ways—in GUI dialog boxes or in a text-mode terminal. If
    you think a program should be logging data but you can''t find it, consult its
    documentation. Alternatively, you can use grep to try to find the log file to
    which the program is sending its messages. For instance, typing `grep sshd /var/log/*`
    finds the files in which the string sshd (the SSH daemon) appears.


    # CREATING LOG FILES


    Some programs create their own log files; however, most rely on a utility known
    generically as the system log daemon to do this job. This program''s name is generally
    `syslog` or `syslogd`. Like other daemons, it''s started during the boot process
    by the system startup scripts. Several system log daemon


