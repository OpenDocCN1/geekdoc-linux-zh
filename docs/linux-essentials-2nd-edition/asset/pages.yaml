- pgno: 262
  md: '# Working as root


    # Using root Privileges Safely


    As already described, root power is dangerous. You could accidentally wipe out
    critical application files and cause hours of downtime. Imagine what would happen
    if you mistakenly corrupted an important configuration file or destroyed a set
    of important backups. Everyone makes mistakes—unfortunately, some mistakes can
    be absolutely disastrous for a company.


    Imagine intruders gaining root access to your computer; unintended changes to
    configuration files; damage (even if not all) of the computer''s system files;
    and changes to ownership or permissions on ordinary user files, rendering them
    inaccessible to their true owners. It is recommended that you take the following
    precautions whenever you need root access:


    +   Ask yourself if you really need root access. Sometimes there''s a way to achieve
    a goal without super privileges or by using privileges in a more limited way than
    you''d originally planned. For instance, you might find that only root can write
    to a removable disk. Such a problem can usually be overcome by adjusting permissions
    on the disk in one way or another, limiting the use of root.


    +   Before pressing the Enter key after typing anything as root (or clicking any
    confirmation button in a GUI program running as root), take your hands off the
    keyboard and mouse, look over the command, and verify that it''s correct in every
    respect. A simple type can cause a world of pain.


    +   Never run a suspicious program as root. In multiuser systems, unscrupulous
    users can try to trick administrators into running programs that will do nasty
    things or give the attacker root privileges. Programs downloaded from random Internet
    sites could principle be designed to compromise your security, and such programs
    are much more dangerous when run as root.


    +   Use root privileges for a brief period as much as possible. If you need to
    type just one or two commands as root, do so and then exit in the root shell to
    log out or return to your normal privileges. Better, use sudo to run the commands.
    It''s easy to overlook the fact that you''re using a root shell and therefore
    type commands as root that don''t need privilege. Every command typed as root
    is a risk.


    +   Never leave a root shell accessible to others. If you''re performing root
    maintenance tasks and are called away, type exit in your root shell before leaving
    the computer.


    > If a program asks you for your password, or the root password, and it''s not
    an administrative program that you trust, suspect! Research the program before
    giving it the password!'
