- pgno: 51
  md: '# Chapter 2 · Understanding Software Licensing


    The FSF and the OSI are dedicated to promoting software freedoms. The objectives
    of the Creative Commons are broader, however. Its licenses are aimed at audio
    recordings, video recordings, textual works, and so on, not just computer programs.
    Nonetheless, the Creative Commons as an organization help the types of freedoms
    that also concern the FSF and the OSI.


    # Using Open Source Licenses


    As an individual user, you might not need to delve deeply into open source license
    details. The principles behind the OSI guidelines guarantee that you have the
    right to use open source programs as you see fit, and even redistribute those
    programs. If you''re building a business, though, and particularly a business
    that creates or distributes open source software, you may need to understand these
    licenses. Thus a few of them are described in more detail. Also, some of the companies
    that have found to use open source licenses as parts of their business models
    are included.


    # Understanding Open Source Licenses


    Every open source license has its own unique characteristics. These are mostly
    of interest to developers who might want to contribute to a software project,
    but on occasion they may be important to a system administrator. The major open
    source licenses include the following:


    +   - GNU GPL and LGPL As noted earlier, the Linux kernel uses the GPL2, and many
    other Linux tools use the GPL (either version 2 or version 3). Many Linux libraries
    use the GPL.


    +   - BSD BSD license is used by the open source BSDs and by various software
    components developed for them. Unlike the GPL, the BSD license allows modifications
    to be distributed under other licenses. The latest versions (two-clause and three-clause)
    of these licenses are similar to the MIT license in brevity.


    +   - MIT The Massachusetts Institute of Technology (MIT) was the original moving
    force behind the X Window System (X for short), and the MIT license (sometimes
    called the X11 license) continues to be used for Xorg-X11—the implementation of
    X with many Linux distributions. The MIT license is unusually short.'
