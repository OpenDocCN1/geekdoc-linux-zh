- pgno: 148
  md: '# CHAPTER 7


    # Managing Files


    Much of what you do with a computer involves manipulating files. Most obvious,
    files hold the correspondence, spreadsheets, digital photos, and other documents
    that you create. Files also hold the configuration settings for Linux—information
    on how to treat the network interfaces, how to access hard disks, and what to
    do as the computer starts up. Indeed, even access to most hardware devices and
    kernel settings is ultimately done through files. Knowing where to find the files
    and how to manage them is critically important for administering a Linux computer.


    This chapter begins with a description of the basic layout of Linux file storage.
    It then shows how to navigate your way around the Linux filesystem. Finally, it
    goes through the basic text-mode commands for manipulating files and directories.


    +   Understanding things go


    +   - Navigating directories

    - Manipulating files

    - Manipulating directories


    # Understanding Where Things Go


    As discussed in Chapter 5, “Managing Hardware,” Linux uses a unified directory
    tree: every partition, removable disk, network file share, and other disk or disk-level
    storage device is accessible as a directory in a single directory tree (or *filesystem*).
    This filesystem is structured. Some directories have a specific purpose that''s
    common among all Linux distributions, whether the directories exist as regular
    subdirectories on one partition or are separate devices that are mounted off the
    root (/) device. Understanding the purpose of the main directories will help you
    locate files and avoid disastrous mistakes. Before delving into those specifics,
    however, you should understand the distinction between user files and system files.


    > The term filesystem can refer to low-level data structures or to the organization
    of files and directories on the computer. In this chapter, the latter meaning
    is the most common.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# User Files vs. System Files


    To understand the distinction between user files and system files, recall that
    Linux is a multiuser OS. In principle, a single computer can host thousands of
    users. Consider such a computer for a moment—perhaps a mainframe at a university,
    a large business, or a cloud-computing server. The vast majority of this computer’s
    users will be unfamiliar with the details of Linux system administration—they
    want only to use their word processors, email clients, and other applications.
    These users do not need to deal with system configuration files, for example.
    Indeed, giving them access to files—especially write access—could be disastrous.
    On a computer with 1,000 users, each of whom can change the system configuration,
    somebody will make a change that will bring down the computer, through ignorance
    or malice.


    Of course, the issues involved in protecting the computer from its users are just
    a special case of more-general-user-account issues; on 1,000-user computer, you
    don’t want its users to be able to read and write others’ files except in limited
    ways. As described in Chapter 13, “Creating Users and Groups” and Chapter 14,
    “Setting Ownership and Permissions,” you can set permissions on files to prevent
    unauthorized access.


    System files are files that control the computer operates. They include the following:


    +   - System startup scripts that launch servers and other important daemons


    +   - Program files—both binary files and scripts


    +   - Program support files, such as fonts and icons


    +   - Configuration files that define how the system works (network configuration
    settings, disk layout information, and so on)


    +   - Configuration files for most servers and other daemons


    +   - Data storage for system programs, such as the database that describes what
    programs are installed


    +   - System log files, which record normal system activity


    Obviously, technically users should not be able to alter system files, except
    perhaps inadvertently. (Log files record activities such as login attempts, instance.)
    Users must be able to read some types of system files, such as the fonts and icons
    they use, but some system files should be protected even from read access. (Users
    should not be able to read the /etc/shadow file, because it holds encrypted passwords,
    for instance.)'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Understanding Where Things Go


    To achieve the goal of restricting ordinary users'' access to system files, such
    files are normally owned by root or by another system account that has a more
    limited purpose. For instance, many server programs rely on their own system accounts.
    System files can be protected from unwanted access by setting permissions in some
    appropriate way, depending on their specific needs. Ordinary users are unable
    to write to most system files, protecting these files from harm. Because root
    can read and write to any file, you must acquire root privileges to perform system
    maintenance tasks.


    Immediately after installing Linux, most of the files that it contains are system
    files, and the directories and subdirectories on a fresh Linux installation system.
    As described shortly, a few directories, such as home and /tmp, are set aside
    for user files, although these are structured or configured in such a way to prevent
    problems with multiuser usage.


    The distinction between system files and user files exists on single-user Linux
    computers, such as your personal laptop. This may seem strange or frustrating;
    all, if you''re the only user, and if you have root access, why bother with the
    distinction between system files and user files? The answer is that it provides
    a layer of protection against accidental or malicious damage. If a typo, a bug,
    or malware should delete all files on the computer, the damage is contained if
    this action is performed as a standard user rather than root; a standard user
    can''t delete all of the files on the computer. Thus the distinction between these
    two account types (and, by extension, these two classes of files) is useful on
    a single-user computer.


    # The Filesystem Hierarchy Standard


    Although each Linux has its own way of doing certain things, all Linux developers
    recognize the need for some standardization in the layout of their directories.
    For instance, programs should be able to locate system configuration files consistently
    in the same places on all distributions. If weren''t the case, programs that rely
    on such features would become more complex and might not work on all distributions.
    To address this need, the Filesystem Hierarchy Standard (FHS) was created. Aside
    from Linux, Unix-like OS also follow the FHS to one degree or other.


    The FHS makes an important distinction between shareable and unshareable files.
    Shareable files may be reasonably shared between computers, such as data files
    and program binaries. (Of course, you don''t need to share files, but you may
    do so.) If files are shared, they are typically shared through an NFS server.
    Unshareable files contain system-specific information, such as configuration files.
    For instance, you''re not likely to share a server''s configuration file between
    computers.


    > Users'' home directories traditionally reside in /home, whereas /tmp is accessible
    to all users and holds temporary files.


    > FHS evolved from an earlier Linux-only standard, the Filesystem Standard (FHSND).'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Chapter 7 • Managing Files


    The FHS makes a second important distinction between static files and variable
    files. The former don''t usually change except through direct intervention by
    the system administrator. Most program executables are good examples of static
    files. Users, automated scripts, servers, or the like may change variable files.
    For instance, users'' home directories and mail queues are composed of variable
    files.

    The FHS tries to isolate each directory into one of 2x2 (shareable/unshareable
    x static/variable) matrix. Figure 7.1 illustrates these relationships. Some directories
    contain subdirectories in multiple cells, but in these cases, the FHS tries to
    specify the status of particular subdirectories. For instance, /var is variable,
    and it contains some shareable and some unshareable subdirectories, as shown in
    Figure 7.1.


    | Shareable | Unshareable |

    | --- | --- |

    | Static | /usr / /etc |

    | /opt | /boot |

    | Variable | /home / /var/run |

    | /var/mail | /var/lock |


    FIGURE 7.1 The FHS attempts to fit each important directory in one of a 2x2 matrix.


    The FHS comes in numbered versions. Version 2.3, the latest version as we write,
    was released in January 2004. A push is underway to release version 3.0 in mid-2015,
    so that by the time you read this book the current version will (see FHS''s web
    page at www.linuxfoundation.org/collaborate/workgroups/lsb/fhs).


    # Important Directories and Their Contents


    The FHS defines the names and purposes of many directories and subdirectories
    on a Linux system. Table 7.1 summarizes the most important directories. Most of
    these are system directories, the exceptions being /home, /tmp, /mnt, and /media.


    TABLE 7.1 Important Linux directories according to the FHS


    | Directory | Purpose |

    | --- | --- |

    | / | The root directory. All files appear in this directory or in subdirectories
    of it. |

    | /etc | Holds system configuration files.


    ![](img/77662199428609b7662c8dc9c0e45c10_151_0.png)'
