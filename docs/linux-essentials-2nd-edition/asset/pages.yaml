- pgno: 292
  md: '# Setting Permissions


    This example gives ownership of targetfile.edf to bob. You can change the file''s
    principal owner and its group with a single command by separating the owner and
    group with a colon (:):


    ```

    $ chown bob:users targetfile.edf

    ```


    This example gives ownership of targetfile.edf to bob and associates the file
    with the users group. To change the group without changing the owner, you can
    omit the owner, leaving the colon and group name:


    ```

    $ chown:users targetfile.edf

    ```


    Alternatively, you can use the chgrp command, which works in the same way but
    changes only the group and does not require the colon before the group name:


    ```

    $ chgrp targetfile.edf

    ```


    Note that the commands used to change the group as an ordinary user—but only if
    you own the file and belong to the target group.

    nThe chown and chgrp commands both support a number of options that modify what
    they do. The most useful of these is -R (or--recursive), which causes a change
    in ownership of all the files in an existing directory. For instance, suppose
    that the user has left a company, and an existing employee, bob, must access her
    files. If mary''s home directory is /home/mary, you might type this:


    ```

    $ chown -R bob /home/mary

    ```


    This command gives bob ownership of the /home/mary directory, all the files in
    the /home/mary directory, including all its subdirectories, the files in the directories,
    and so on. To make the transition a bit easier for bob, you might also want to
    move mary''s former home directory into bob''s home directory.


    # Setting Permissions


    File ownership is meaningless without some way to specify what particular users
    can do with their own or other users'' files. That''s where permissions enter
    the picture. Linux''s permission structure is modeled after that of Unix, and
    it requires a bit of explanation before you tackle the issue. Once you understand'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# Chapter 14 - Setting Ownership and Permissions


    the basics, you can begin modifying permissions, using either a GUI manager or
    a text-mode shell. You can also set default permissions for new files that you
    create.


    ![](img/77662199428609b7662c8dc9c0e45c10_293_0.png)


    # Understanding Permissions


    Understanding Unix (and hence Linux) permissions, you may want to begin with the
    display created by the ls command, which lists the files in a directory, in conjunction
    with its -l option, which creates a long directory listing that includes permissions.
    For instance, to see a long list of the file test, you might type the:


    ```

    $ ls -l test

    -rwxr-xr-x 1 rich users      111 Apr 13 13:48 test

    ```


    This line consists of several sections, which provide assorted pieces of information
    on the file:


    **Permissions** The first column (-rwxr-xr-x in this example) is the file''s permissions,
    which are of interest at the moment.


    **Number of Links** The next column (i in this example) shows the number of hard
    links to the file—that is, the number of unique filenames that may be used to
    access the file.


    ![](img/77662199428609b7662c8dc9c0e45c10_293_1.png)


    **Username** The next column (rich in this example) identifies the file''s owner
    by username.


    **Group Name** The file''s group (users in this example) appears next.


    **File Size** This example file''s size is quite small—111 bytes.


    **Time Stamp** The time stamp (Apr 13 13:48 in this example) identifies the time
    the file was last modified.


    **Filename** Finally, -l shows the file''s name—test in this example. The string
    that brings this output (-rwxr-xr-x in this example) is a symbolic representation
    of the permissions string. Figure 14.2 shows how this string is broken into four
    parts.


    **File Type Code** The first character is the file type code, which represents
    the file''s type, as summarized in Table 14.1. This type character is sometimes
    omitted from descriptions when the file type is not relevant or when it''s identified
    in some other way.


    Chapter 7, "Managing Files," describes links in more detail.


    272'
