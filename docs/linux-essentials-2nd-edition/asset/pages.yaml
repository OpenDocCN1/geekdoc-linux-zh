    provide unique installation software to help you manage this important task. Thus
    two distributions may install in different ways, giving you different options
    for key features, such as disk layouts and initial user account creation.


    Typically, Linux distributions are available for download from their websites.
    You can easily download a CD-R or DVD image file that you can then burn to an
    optical disc. When you boot the resulting disc, the installer runs, and you can
    install the OS. You can sometimes download an image that your computer lacks an
    optical disc. There are also cloud versions of many Linux distributions, which
    allow you to download a complete Linux system to run in either a private virtual
    machine or on a commercial cloud such as Amazon or Google services.


    The Unbootin tool (http://unetbootin.sourceforge.net) can copy the files from
