- pgno: 218
  md: '# Launching an Editor


    Another approach is to launch the text editor from the command line. You can do
    this as a normal user, using your default privileges to edit text files you own.
    To edit system files, you''ll need to use superuser privileges. You can also select
    the editor that you want to use—you just need to know its filename, which you
    type to launch the editor:


    ```

    $ nano

    ```


    This example launches nano. When it opens, you''ll see a display similar to the
    one shown in Figure 10.1, but the bulk of the window or text-console will be empty,
    unless you''d specify a filename. Instead, as shown in Figure 10.2, the center
    of the top line will read New Buffer. You can begin typing in the desired text.
    When you save the file, as described later in “Saving Your Changes, nano will
    ask for a filename.


    > Example 12. “Understanding Basic Security,” describes how to obtain superuser
    privileges needed to edit system text files.


    ![](img/77662199428609b7662c8dc9c0e45c10_218_0.png)


    Figure 10.2 The nano editor launched with no filename provided


    Alternatively, you can provide a filename when you launch the text editor as follows:


    ```

    $ nano great_american_novel.txt

    ```


    This example shows the great_american_novel.txt file and displays it. If the file
    doesn''t exist, nano displays New File near the bulk of the display, where Read
    4 lines appear in Figure 10.1. If you see Warning: no write permission in the
    third line from the body, you''ve loaded a file that you have no permission to
    change. You''ll need to run nano using superuser privileges or modify file permissions,
    as described in Chapter 14, “Setting Ownership and Permissions,” if you want to
    save the file''s modified contents.


    > If you mistype the filename, nano will show an empty file. If you see an empty
    file instead of the file that you were expecting to see, you may have mistyped
    the filename.'
