- pgno: 141
  md: '# Finding Additional Documentation


    Although man pages and info pages are useful resources, other documentation is
    available too, and it is sometimes preferable to these forms of documentation.
    Broadly speaking, help on Linux can come in three forms: additional documentation
    on your computer, additional documentation online, and help from experts.


    Documentation categories can blur together. For instance, documentation might
    be available online but not on your computer until you install an appropriate
    package.


    # Locating Program Documentation on your Computer


    Most Linux programs ship with their own documentation, even aside from man info
    pages. In fact, some programs have so documentation that it''s installed as a
    special package, with the word documentation or doc in the package name, such
    as samba-doc.


    README files often contain information on building the software package that doesn''t
    apply provided with distribution maintainers seldom change information in their
    README files, though.


    The most basic and traditional form of program documentation is a file called
    README.txt, or something similar. Precisely what information this file contains
    greatly from one program to another. For some, the file is so terse that it''s
    nearly useless. For others, it is extremely helpful. These files are almost always
    plain-text files, so you can read them with less or with your text editor.


    If you downloaded the program as a source code from the software package maintainer
    site, the README typically appears in the build directory extracted from the compressed
    source code. If you installed the program from a package file, though, the README
    file could be in any of several locations. The most likely places are as follows:


    +   - /usr/doc/packagename

    - /usr/share/doc/packagename

    - /usr/share/doc/packages/packagename


    Certification Objective


    In the previous list, packagen is the software package''s name. The package name
    includes a version number, but more often it does not.

    In addition to (or instead of) the README file, many programs provide other documentation
    files. These may include a file that documents the history of the program in fine
    detail, descriptions of compilation and installation procedures, information on
    configuration file formats, and so on. Check the source'
