- pgno: 166
  md: '# # Manipulating Directories


    There is no doubt that you''re familiar with the concept of directories, although
    you may think of them as "folders," since most GUI file managers represent directories
    using file folder icons. Naturally, Linux provides text-mode commands to manipulate
    directories. These include directory-specific commands to create and delete directories,
    as well as some file-manipulation commands described earlier to manage directories.


    # ## Creating Directories


    You can use the mkdir command to create a directory. Ordinarily, you''ll use this
    command by typing the name of one or more directories following the command:


    ```

    $ mkdir newdir

    $ mkdir dirone newdir/dirtwo

    ```


    The first example creates one new directory, newdir, which will then reside in
    the current directory. The second example creates two directories: dirone and
    newdir/dirtwo. In this example, mkdir creates dirtwo inside the newdir, which
    was created with the preceding command.


    In most cases, you''ll use mkdir without options, other than the name of a directory,
    but you can modify itsbehavior in a few ways:


    **Set Mode** The -m mode or -mode=mode option causes the new directory to have
    the specified permission mode, expressed as an octal. (Chapter 14 describes this
    topic in detail.)


    **Create Parent Directories** Normally, if you specify the creation of a directory
    within a directory that does not exist, mkdir responds with a No such file or
    directory error and does not create the directory. If you use the -p -parents
    option, though, mkdir creates the necessary parent directory. For instance, typing
    mkdir first/second returns an error message if first does not exist, but typing
    mkdir -p first/second succeeds, creating both first and its subdirectory, second.


    # ## Deleting Directories


    The rdir command is the opposite of mkdir; it destroys a directory. To use it,
    you type the command followed by the names of one or more directories that you
    want to delete:


    ```

    $ rdir dirone

    $ rdir newdir/dirtwo newdir

    ```'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Chapter 7 • Managing Files


    These examples delete the three directories created by the mkdir commands

    shown earlier.


    Like mkdir, rmdir supports a few options, the most important of which handle

    tasks:


    # Ignore Failures on Nonempty Directories


    Normally, if a directory contains

    files or other directories, rmdir doesn''t delete it and returns an error message.

    With the --ignore-fail-on-non-empty option, rmdir still doesn''t delete the

    directory, but it doesn''t return an error message.


    # Delete Tree


    The -p or --parents option allows rmdir to delete an entire

    directory tree. For instance, typing rmdir -p newdir/ditwo rmdir to

    newdir/ditwo and then newdir. You could use this command rather

    than rmdir newdir/ditwo/ditwo newdir to delete both of these directories.


    You should understand that rmdir can delete only empty directories; if a direc-

    t any files at all, this command won''t work. (You can use the -p

    option, however, to delete a set of nested directories, as long as none of them
    holds

    nirectory.) Of course, in real life you''re likely to want to delete direc-

    t that hold files. In such cases, you can use the rm command, described

    erlier, in "Deleting Files," along with its -r (or -R or -recursive) option:


    ```

    $ rm -r newdir

    ```


    This command deletes newdir and any files or subdirectories that it might

    contain. This fact makes rm and its -r option potentially dangerous, so you

    snould be particularly cautious when using it.


    # LINUX SECURITY FEATURES


    When you log in as an ordinary user, you can accidentally delete your own files
    if you

    er in your use of rm or various commands. You cannot, however, serious

    dam to the Linux installation itself. Unix was designed as a multiuser 0 OS

    ith multiuser security features in mind, and because Linux is a type of Unix,
    Linux has

    erited these security features. Among these features are the concepts of file-

    ship and file permissions. You can delete only your own files—or more precisely,

    de can delete files only if you have write access to the directories in which

    y reside. You have such access to your own home directory, but not to the directories

    containing Linux system files. Thus you cannot damage these Linux system files.


    Chapter 13 covers these concepts in more detail, as well as describing how to
    acquire

    power to administer the computer. With this power comes the ability to dam-

    age the system, though, so you should be careful to do so only when necessary.


    ![](img/77662199428609b7662c8dc9c0e45c10_167_0.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '# Managing Directories


    Directories are just special files—they''re files that hold other files. Thus
    you can use most of the file-manipulation tools described elsewhere in this chapter
    to manipulate directories. There are some caveats, though:


    +   - You can use touch to update a directory''s time stamps, but you can''t use
    touch to create a directory; mkdir handles that task.

    - You can use cp to copy to a directory; however, you must use the -r, -R, --recursive,
    -a, or --archive option to copy the directory and all its contents.

    - You can use mv to move or rename a directory.


    +   - You can use ln with -s option to create a symbolic link to a directory.
    No common Linux filesystem supports hard links to directories, though.


    As an example, suppose that you have a directory in your home directory called
    Music/Satchmo, which contains Louis Armstrong music files. You want to reorganize
    this directory so that the files appear under the performer''s last name, but
    you want to retain access to the files under the name Satchmo, since your music
    players refer to this way. You could type the following commands to achieve this
    goal:


    ```

    $ cd /Music

    $ mv Satchmo Armstrong

    $ ln -s Armstrong Satchmo

    ```


    Alternatively, you could omit the first command and specify the complete path
    to each of the directories or links in the mv and ln commands. As writing, the
    first two of these commands rename the ~/Music/Satchmo directory to ~/Music/Armstrong.
    The final command creates a symbolic link, ~/Music/Satchmo, that points to ~/Music/Armstrong.


    # THE ESSENTIALS AND BEYOND


    Much of what you do with a computer qualifies as file management. Thus you must
    understand the basic tools for managing files in Linux. These include commands
    to create, delete, copy, move, and rename files, as well as to create links to
    files. Directories in Linux are just files that contain other files, so most of
    the commands that you can use on files also work on directories. Special commands
    to create and delete directories exist too.


    (Continues)'
  merge: -1
  img_proc: true
