    # Understanding the Role of X


    Most people don''t give much thought to the software behind their computers''
    displays—it all works. Of course, behind the scenes, the task of managing the
    display is fairly complex. Some of the things that the software must do on any
    platform include the following:


    +   1. Initializing the video card, including setting its resolution

    2. Allocating sections of the display to show windows that belong to particular
    applications

    3. Managing windows that overlap so that only the "topmost" window''s contents
    are displayed

    4. Managing a pointer that the user controls via a mouse or similar device

    5. Directing user input from a keyboard to whatever application is active

    6. Displaying text and simple shapes within windows at the request of user programs

    7. Providing user interface elements to move and resize windows

    8. Managing the interiors of windows, such as displaying menus and scroll bars


    In Linux, X handles tasks 1 through 6, but task 7 is handled by a program called
    a window manager, and task 8 is handled by GUI libraries known as widget sets.
    X can handle the font display element of task 6, but in recent years many programs
    have begun using a library called Xit for this task. Thus the overall job of handling
    the display is divided among several programs, although X handles most of the
    low-level tasks.


    Modern Linux distributions use a version of X that can detect your hardware—including
    the video card, monitor, keyboard, and mouse—and configure itself automatically.
    The result is that software normally works properly without any explicit configuration.
    Sometimes, this autfiguration fails. When this happens, you must manually edit
    the X configuration file, /etc/


    ![](img/77662199428609b7662c8dc9c0e45c10_111_0.png)


    Desktop environments include window managers, but window managers without desktop
    environments are also available.'
