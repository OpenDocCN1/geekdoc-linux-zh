    # Launching Programs


    Most desktop environments provide several ways to launch programs. Details can
    vary considerably from one environment to another. However, useful examples include
    the following:


    +   **Desktop Menus** Many desktop environments provide menus along a top, or
    side of the screen. One or more items in these menus can give you access to a
    preselected set of applications.


    +   **Desktop Icons** Some desktop environments enable you to place icons in the
    main area of the desktop. Clicking or double-clicking these icons launches the
    applications that they represent. This approach generally requires customization.
    Some default configurations place a few applications in the main desktop area.


    +   **Panels** Some desktop environments provide panels, typically located on
    the sides of the screen, in icons for common applications appear. Unity uses such
    a configuration by default, as does GNOME 3 (a version of the GNOME environment)—although
    in the case of GNOME 3, the panel appears only when you click the Activities item
    in the upper-left corner of the screen.


    +   **Context Menus** You can sometimes right-click in an unused part of the screen
    to obtain a context menu with a variety of options, which may include the option
    to run programs.


    +   **Searching for Programs** Some desktop environments, such as GNOME 3, provide
    a prominent search feature that you can use to find a program by name. Typically,
    you type part of a program''s name, and programs whose names match in a list.
    You then select the program that you want to run from list.


    +   **Terminals** You can launch a program called a *terminal*, which provides
    a text-mode user interface inside a window. You can then run either text-mode
    or GUI programs by typing their filenames in this window. This approach is covered
    in more detail in Chapter 6, "Getting to Know the Command Line."


