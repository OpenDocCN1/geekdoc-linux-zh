    # Wi-FI SECURITY


    Because Wi-Fi data is carried over radio waves, it''s easy for the transmissions
    to be intercepted. Somebody sitting in a car outside a building can often gain
    access to a Wi-Fi network, which poses three problems:'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Wi-FI SECURITY (Continued)


    +   - An intruder can intercept data passing over the network, possibly gaining
    access to sensitive files, acquiring credit card numbers, and so on.

    - An intruder may be able to launch attacks on your computers from behind any
    firewall that you maintain to protect yourself from outsiders.

    - An intruder can use your network access to attack other computers or to conduct
    illegal activities such as pirating movies, music, or software. This not only
    consumes your network bandwidth, but if the activities are detected, you will
    fall under suspicion!


    For these reasons, you should secure any Wi-Fi network that you manage. Three
    security levels are available (if you count none at all):


    +   **WEP** Wired Equivalent Protocol (WEP) is a weak encryption protocol. Methods
    of breaking into a WEP-encrypted network are well known, making this method effortlessly
    worthless.


    +   **WPA** Wi-Protected Access (WPA) security provides improved encryption and
    authentication tools compared to WEP.


    +   **WPA2** WPA2 is WPA''s replacement, and it provides still more improvements
    in encryption and authentication.


    Several variants on each these encryption methods are available. For instance,
    WPA and WPA2 provide both personal and enterprise options, the latter requiring
    a more complex setup with a dedicated authentication server. Typically, you set
    the encryption method in a broadband router or wireless access point (WAP). Clients
    then detect the method in use and present appropriate options, such as the password
    prompt earlier in Figure 15.2.


    Public Wi-Fi connections might not use any of these protocols. You can use such
    connections, but be aware that any data that you send or receive might be visible
    to others.


    The GUI method of establishing a Wi-Fi connection is almost always the easiest
    method to use. If you need to fine-tune the connection, you can use various tools
    to probe and manage Wi-Fi links. Here are the two most important of these tools:


    **iwlist** This command can identify nearby Wi-Fi networks. Type iwlist scan or
    as root to obtain a list of nearby networks. This command produces a great deal
    of technical data. You''re probably most interested in the


    ![](img/77662199428609b7662c8dc9c0e45c10_312_0.png)'
