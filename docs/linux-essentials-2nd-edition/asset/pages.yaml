    find the appropriate account creation utility. On other distributions, you will
    need to navigate through the desktop menus to locate the correct tool. The utility''s
    name may be something similar to Users, Group Accounts, or User and Group Administration.


    As an example of a GUI user account management tool, Figure 13.1 shows openSE''s
    User and Group Administration utility. You can do a great more than accounts with
    this particular utility. However, the focus here is creating accounts.


    To add a user with User and Group Administration, follow these steps:


    +   1. Click the Add button. The result is the New Local User dialog box shown
