  md: 'the information that you need—you might need information that you know is in
    a particular section, in which case you can quickly scan down to that section.
    Common sections include the following:


    **Name** A man page begins with a statement of the command, call, or file that''s
    described, along with a few words of explanation. For instance, the man page for
    man (section 1) has a Name section that reads man — an interface to the on line
    reference manuals.


    **Synopsis** The synopsis provides a brief description of how a command is used.
    Optional parameters appear in square brackets, such as [-D]. An ellipsis (...)
    denotes an optional set of repeated elements, such as multiple filenames as a
    command takes one or more filenames as options. Some commands provide multiple
    synopsis lines, indicating that certain options are contingent upon others.


    **Description** The description is an English-language summary of what the command,
    file, or other element does. The description can vary from a short summary to
    many pages in length.


    **Options** This section expands on the options outlined in the Synopsis section.
    Typically, each option appears in a list, with a one-paragraph explanation indented
    just below it.


    **Files** This section lists files that are associated with the man page''s subject.
    These might be configuration files for a server or other program, related configuration
    files, the page''s subject modifiers, and so on.


    **See Also** This section provides pointers to related information in the man
    system, typically with a section number appended. For instance, the man page man
    refers to the man pages for apropos, what is, and several other related tools.


    **Bugs** Many man pages provide a Bugs section in which the author describes any
    known bugs or limitations, or that no known bugs exist.


    **History** Some man pages provide a summary of the program''s history, citing
    start dates and major milestones between then and the current version. This history
    isn''t nearly as comprehensive as the change file that comes with most programs''
    source code.


    **Author** Most man pages end with an Author section, which tells you how to contact
    the author of the program.'
