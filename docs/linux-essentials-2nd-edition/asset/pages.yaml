  md: '# Starting a Command Line


    ![](img/77662199428609b7662c8dc9c0e45c10_124_0.png)


    FIGURE 6.4 GNOME''s Terminal program is typical and is dominated by a textual
    display area.


    Most terminal programs support tabs, which are similar to the tabs in a web browser.
    In most cases, such as in a GNOME terminal, you can open a tab by choosing File
    > Open Tab from the terminal''s menu. Having multiple tabs open is handy because
    it enables you to run multiple programs simultaneously, easily in multiple directories,
    or run programs both as yourself and as root. Alternatively, you can run multiple
    terminal programs to achieve the same results.


    When you''re done with a terminal, you can close it like other programs by choosing
    File > Close Window. Alternatively, you can type exit and press Enter at its shell
    prompt.


    # Logging into a Text-Mode Console


    At first glance, Linux looks like Windows or Mac OS X in that it''s a GUI operating
    system. Scratch the surface, and you''ll find a purely text-mode interface waiting.
    Linux supports virtual terminals (VTs), which are virtual screens that can hold
    various types of information—textual or graphical. Most Linux distributions run
    with six or seven VTs. In CentOS, Fedora, and Red Hat, the first VT typically
    runs the GUI window system. In other distributions, the GUI runs in VT 7 or VT
    8, leaving VT 1 as a text-mode display.


    You can switch between VTs by pressing Ctrl+Alt+Fn, where Fn is a function key.
    (When switching to text-mode VTs, Alt+Fn is sufficient) to reach and log into
    a text-mode console, follow these steps:


    +   1. Press Ctrl+Alt+F2. You''ll see a text-mode prompt that looks something
    like the first few lines in Figure 6.5.


    > The notation Ctrl+Alt+Fn refers to pressing the Ctrl and holding it; pressing
    the Alt key and holding it; and then pressing the desired key and releasing all
    three keys at once.'
