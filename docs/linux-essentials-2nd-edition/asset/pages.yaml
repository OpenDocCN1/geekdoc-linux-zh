  md: 'the one you''re replacing. Also be sure it will fit—sizes are standardized,
    but a few variants are available. In the case of a laptop or a small desktop computer
    with an external power supply, you must ensure that a replacement provides the
    right type of connector to the computer. Buying a replacement from the computer''s
