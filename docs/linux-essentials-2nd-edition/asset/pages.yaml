  md: 'If you only want to wake the sleeping GUI program, type fg. This command returns
    the sleeping GUI program to the foreground, enabling it, but once again makes
    your terminal unresponsive. Note that, in this context, the terms background and
    foreground refer to the program''s relationship to the position of the program''s
    windows in a "stack" of windows on the screen.


    If you know before you launch that you want to run a program in the background,
    you can do so by appending an ampersand (&) to the end of the command line, as
    in the following:


    +   $ firefox &


    This command launches the Firefox web browser in the background, enabling you
    to visit web pages and to continue to use the shell. This feature is most useful
    for running GUI programs, but it''s sometimes used with text-mode programs too.
    A complex number-crunching program, for instance, might be designed to run for
    several minutes or hours and produce no output. You might therefore to run it
    in the background and retain control of your shell. Be aware, however that if
    you launch a program in the background and it produces output to the terminal,
    that output will continue to appear in your shell, possibly intruding on whatever
    you''re trying to do with the shell.


