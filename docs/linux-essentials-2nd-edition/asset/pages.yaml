    3. A groupadd command creates a new group, as described in option A, so that is
    correct. To add a user to a group, as suggested by option B, you would use the
    user utility. No standard command imports information from a file, as option C
    suggests, so this option is incorrect. (Some network user management tools provide
    such functionality, though.) To change a user''s default group or list of supplemental
    groups, you would use usermod, so options D and E are both incorrect.


    4. System accounts have UID values between 0 and some number (normally 499 or
    999), whereas user accounts have UID values above that number (starting at 500
    or 1000, typically).


    5. The usual command-line command for changing passwords is passwd.


    6. Although the usermod command''s -r option deletes the user''s home directory
    and mail files, this command doesn''t track down the user''s files stored in more-exotic
    locations. You can use find to locate files if you want to delete them or transfer
    ownership to another user.


