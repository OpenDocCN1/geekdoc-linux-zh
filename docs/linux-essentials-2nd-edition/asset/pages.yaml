    Extended regular expressions add more features that you can use to match in additional
    ways:


    Additional Repetition Operators These operators work like an asterisk, but they
    only match certain numbers of matches. Specifically, a plus sign (+) matches one
    or more occurrences, a question mark (?) specifies zero or one.


    Multiple Possible Strings The vertical bar (|) separates two possible matches;
    for instance, car|truck matches either car or truck.


    Parentheses Ordinary parentheses ()) surround subexpressions. Parentheses are
    often used to specify which operators are to be applied; for example, you can
    put parentheses around a group of words that are concatenated with the vertical
    bar to ensure that the words are treated as a group, any one of which may match,
    without surrounding parts of the regular expression.


    Whether you use basic or extended expressions depends on which form the grep supports.
    For programs like grep that support both, you can use either; which is mostly
    a matter of personal preference. Note that a regular expression that includes
    characters associated with extended regulars will be interpreted differently depending
    on what type you are using. It is important to know which type of regular expression
    a program supports, or to select which type to use if the program supports both
    types.


    Regular expression rules can be confusing, particularly when you''re first introduced
    to them. Some examples of their use, in the context of the programs that use,
    will help. The next section provides such examples, with


    # Searching for and Extracting Data


    The grep command uses regular expressions and is helpful in locating data. The
    grep utility locates files by scanning its contents. The grep program also returns
    some of the data included in files, which can be useful if you want to extract
    a little data from a file or from a program''s output. As its name suggests, find
    locates files. It uses features, such as the filename and the file''s date stamps.
    Another command, wc, provides basic statistics on text files. To extract individual
    data from items from files, the cut command is useful. Two additional commands,
    sort and cat, allow the display of resulting data to be manipulated, which can
    be helpful in your search.


