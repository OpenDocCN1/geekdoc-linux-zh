    # Obtaining File Listings


    To manipulate files, it''s helpful to know what they are. The ls command, name
    is short for list, provides this information by displaying the names of files
    in a directory. If you pass it no options, it shows the files in the current-directory.
    However, you can pass both options and file or directory specifications. This
    command supports a huge number of options; consult its man page for details. Table
    7.2 summarizes the most important ls options.


