    # SERVER PROGRAMS AND SERVER COMPUTERS


    The server server can apply to an entire computer or to a single program running
    on that computer. When applied to a computer as a whole, the term identifies the
    purpose of the computer and the fact that it runs one or more server programs.
    Server computers typically provide services that are used by anywhere from a handful
    to millions of client computers—that is, the computers that use a server''s services.


    In the networking world, a server (computer or program) listens for a connection
    from a client (computer or program) and responds to data transfer requests. Server
    computers are often—but not all—more powerful than their clients.


    When you read the word server (client, for that matter), it may refer to a computer
    or to a program. The context usually makes it clear which meaning is intended,
    although sometimes this isn''t the case—in fact, sometimes the speaker or writer
    may not know! For instance, somebody might report “the Samba server isn''t working.”
    In such a case, you might need to figure out whether it''s the Samba server program
    or something else on the server that is causing problems.


    Sometimes, the client-server lines can get blurred. For instance, in office settings,
    it''s common for many computers to function as file servers by running file software
    such as Samba or NFS. Such a configuration enables Sam to make his files available
    to Jill, and Jill to make her files available to Sam. In this situation, both
    computers function as client and server and run both types of software. In any
    given exchange, though only one is the client and one is the server.


