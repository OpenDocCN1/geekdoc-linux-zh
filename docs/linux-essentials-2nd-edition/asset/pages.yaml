- pgno: 274
  md: '# Modifying Accounts


    When you create an account with useradd, it will be in a locked state—the user
    will not be able to log in. To unlock it, you must use the passswd command, as
    described next, in “Modifying Accounts."


    Behind the scenes, useradd (or by extension its GUI-front) modifies the contents
    of the following files (described in detail in Chapter 12):


    ```

    /etc/passwd

    /etc/shadow

    /etc/group

    ```


    If you use -create-home or -m, if this option is used by default, the program
    creates a home directory and copies files from /etc/skel to that location. Creating
    an account will usually create a spool file in which the user’s incoming mail
    will be stored (This file may unused on many desktop systems, but it can be important
    if you run mail server software on the computer.). Thus you can see that useradd
    makes quite a few modifications to your computer’s files and directories in creating
    the account.


    # Modifying Accounts


    As you’ve just learned, you can specify any UID number that affects accounts,
    such as giving an account. Sometimes, though, it’s necessary to change account
    options after an account has been created. Fortunately, Linux provides both GUI
    and text-mode tools to help you do this. Before delving into operational details
    of these tools, though, you should understand when you might want to make changes
    to accounts and know how to check whether a user is currently logged in.


    # Deciding When to Modify Accounts


    In an ideal world, you’ll create your accounts perfectly every time; however,
    sometimes this isn’t possible. You might lack information that’s necessary to
    create a perfectly tuned account (such as the length of time an employee will
    be with a company), or your needs might change after the account has been created.
    Some common specific causes of account changes include (but are not limited to)
    the following:


    +   - Account expiration data may need to be updated. A contract employee might
    have their contract extended, for instance. Sometimes an expired account must
    be re-enabled.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# Chapter 13 · Creating Users and Groups


    +   UID numbers may need to be synchronized with other computers in order to facilitate
    file sharing across computers or for other reasons.


    +   Users'' home directories might change because you added disk space and need
    to move some users'' home directories to a new location.


    +   A user might forget a password. The system administrator can change the password
    for any account without knowing the original password, so system administrators
    frequently have to help out users with faulty memories.


    When working in a GUI, many of the preceding changes can be handled from the distribution''s
    GUI account management tool. When working in a text-mode shell, you''ll need to
    master a few different programs to handle this range of account modifications.


    # Checking for Logged-in Users


    Be aware that some account changes could be disruptive if the user is logged in
    the moment that you perform them. Changing the account''s username and home directory,
    in particular, are likely to cause problems. You should make changes only when
    the user is logged out. Several tools can help you check who''s using the computer
    and avoid problems:


    +   This Utility, described in Chapter 12, produces a list of users who are currently
    logged into the computer, with some details of their login sessions, such as their
    terminal identifiers and login dates.


    +   This command, also described in Chapter 12, is similar to who in broad strokes,
    but provides different details. Most notably, it identifies the program that''s
    currently running in each session.


    ![](img/77662199428609b7662c8dc9c0e45c10_275_0.png)


    ![](img/77662199428609b7662c8dc9c0e45c10_275_1.png)


    This program produces a list of recent login sessions, including their starting
    and ending times, or a notice that the user is logged in:


    ```

    $ last

    jennie tty3 Sun Jan 8 12:43 still logged in

    jennie tty3 Sun Jan 8 12:43-12:43 (00:00)

    jennie tty2 Sun Jan 8 12:36 still logged in

    jennie tty2 Sun Jan 8 12:36-12:36 (00:00)

    ```


    One limitation of last is that it includes only text-mode logins. It makes its
    utility for identifying users who are currently using the computer rather limited,
    since some users are likely to be logged in using a GUI session.'
