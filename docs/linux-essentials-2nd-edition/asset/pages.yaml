- pgno: 97
  md: '# Chapter 5 · Managing Hardware


    availability; to run on a given CPU, most software must be recompiled for that
    CPU. It''s important that you know enough about the different CPU families to
    understand their strengths and weaknesses and to identify what type of CPU your
    computer uses.


    Many devices have more specialized computing. Most notably, video cards include
    graphics processing units (GPUs) to specialize graphics computations.


    # Understanding CPU Families


    CPU manufacturers tend to create product lines by making regular improvements
    to their products. Improvements range from minor (such as running the CPU at a
    faster clock rate, which is like running an engine at a faster speed) to moderate
    changes to improve speed (which is like shifting gears to get better speed) to
    radical changes (which are like using a bigger or more efficient engine, one based
    on the original design). All of these types of changes remain within a single
    CPU family, so they can run the same code for different processors. Most radical
    differences exist across CPU families; two CPUs from different families typically
    not run each other''s binary programs, although there are exceptions to this,
    including one very important one that we describe shortly.


    On desktop computers, two CPU families are (or were recently) common:


    The upcoming section, "Identifying Your CPU," describes how to determine which
    CPU you have.


    +   **x86** This CPU type originated with Intel''s 8086 CPU, but the first capable
    of running Linux was the 80386 (also known as the 386). Development continued
    with the 80486 (also known as the 486), the Pentium, the Celeron, and the earlier
    versions of the Core series of processors—Intel Core i3, Intel Core i5, and Intel
    Core i7. AMD, Cyrix, VIA, and others have all released CPUs that are compatible
    with Intel''s designs. Recent AMD names for its x86 CPUs include Athlon and Duron.
    The earliest x86 CPUs were 16-bit models, but the model line has 32-bit x8036.


    +   **x86-64** Brand names for the x86-64 architecture include Intel 64 and AMD64.
    AMD created the x86-64 architecture as a 64-bit extension. Usually, x86-64 CPUs
    can run the earlier 32-bit x86 code, but when run in 64-bit mode, such CPUs have
    access to additional features that improve speed. Intel has created its own x86-64
    CPUs. Both Intel and AMD have used the same product-line names for their x86-64
    CPUs as for their x86 CPUs. This can make it hard to tell whether you have a 32-bit
    x86 CPU or a 64-bit x86 CPU, based on the CPU''s marketing name. Most desktop
    and small server computers sold since about 2007 have used x86-64 CPUs, with the
    Intel Core i3, i5, and i7 series currently being the most popular.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Learning about Your CPU


    # CPU Bit DEPTH


    CPUs process data in binary (base 2), meaning that numbers are represented using
    only two digits—0 and 1. CPUs have limits to the sizes of the numbers they can
    process, and those limits are described in terms of the number of binary digits,
    or bits, that the CPU can handle. A 32-bit CPU, for instance, can process numbers
    that contain up to 32 digits. Expressed as positive integers, this means that
    numbers can range in size from 0 to $2^{32}$—1 (4,294,967,295 in the base 10 that
    people generally use). When dealing with larger numbers, the CPU must combine
    two or more numbers, which requires extra code.


    With larger bit depths have an advantage when dealing with lots of memory, since
    a 32-bit CPU has a 4 gibyte (GiB) limit on memory—although architectures, including
    x86, provide tricks to work around this. Greater bit depth does not improve speed
    per se, except when dealing with very large numbers. However, the 64-bit x86-64
    CPU architecture is faster than the 32-bit predecessor for for unrelated reasons.


    In addition to x86 and x86-64 CPUs, several other models are available. With the
    popularity of mobile devices, the ARM processor has become an overnight success.
    Technically, ARM chips are all full-featured as the x86-64 or even the x86 CPUs.
    They implement a type of processor model called Reduced Instruction Set Computing
    (RISC) architecture, which strips down the process to a bare-bones minimum. However,
    the ARM chips require less electrical power to operate (making them ideal for
    mobile devices), and can provide enough computing to handle most of today''s consumer
    needs.


    Linux can run not only on the newer processors, but also on older families, such
    as MIPS and SPARC. However, your choice of distribution is likely to be limited.
    Because software has to be recompiled and tested on new architectures, preparing
    a distribution for each architecture takes effort, and many distribution maintainers
    are unwilling or unable to spend this effort for more than x86 and x86-64.


    Many CPUs are multicore. These CPUs package the circuitry for two or more CPUs
    into one unit. When plugged into a motherboard, such a CPU looks like multiple
    CPUs programs to the OS. The advantage is that Linux can run as many CPU-intensive
    programs as you have, and they won''t slow down significantly by competing for
    CPU resources.


    Debian is available on many architectures, so if you need to support Linux on
    a wide range of CPUs, Debian can make sense.


    Some high-end motherboards support multiple CPUs, so you can use, two 4-core CPUs
    to get the performance of an 8-CPU system.'
  merge: -1
  img_proc: true
