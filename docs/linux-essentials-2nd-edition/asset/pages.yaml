- pgno: 236
  md: 'type at a command, or even when commands you enter, depending on information
    from other commands. For this reason, scripting languages include additional features
    to help you make your scripts useful.


    # Using Arguments


    Variables can help you expand the utility of scripts. A variable is a placeholder
    in a script for a value that will be determined when the script runs. Variables''
    values can be passed as parameters to a script, generated internally to a script,
    or extracted from a script''s environment. (An environment is a set of variables
    that any program can access. The environment includes things like the current
    directory and the search path for running programs.)


    Variables that are passed to the script are frequently called parameters or arguments.
    They''re represented in the script by a dollar sign ($) followed by a number from
    0 up—stands for the name of the script, $1 is the first parameter to the script,
    $2 is the second parameter, and so on. To understand how this might be useful,
    consider the task of adding a user. As described in Chapter 13, "Creating Users
    and Groups," creating an account for a new user typically involves running at
    least two commands—useradd and password. You may also need to run additional site-specific
    commands, such as commands that create unusual user-owned directories aside from
    the user''s home directory.


    An example of a script with an argument variable can help in situations, consider
    Listing 11.2 an example of a script with an argument variable can help in situations,
    consider Listing 11.2. This script creates an account and changes the account''s
    password (the script prompts you to enter the password when you run the script).
    It creates a directory in the /shared directory corresponding to the account,
    and sets a symbolic link to that directory from the new user''s home directory.
    It also adjusts ownership and permissions in a way that may be useful, depending
    on your system''s ownership and permissions policies.


    LISTING 11.2: A script that reduces account-creation tedium


    ```

    #!/bin/bash

    useradd -m $1

    passwd $1

    mkdir -p /shared/$1

    chown $1.users /shared/$1

    chmod 775 /shared/$1

    ln -s /shared/$1 /home/$1/shared

    chown $1.users /home/$1/shared

    ```'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'If you use Listing 11.2, you need to type only three things: the script name
    with the desired username and the password (twice). For instance, if the script
    is called mkuser, you can use it like this:


    ```

    # mkuser ajones

    Changing password for user ajones

    New password:

    Retype password:

    passwd: all authentication tokens updated successfully

    ```


    Most of the script''s programs operate silently unless they encounter problems,
    so the interaction (typing the passwords, which do not echo to the screen) is
    a result of just the passwd command. In effect, Listing 11.2''s script replaces
    seven lines of commands with one. Every one of those lines uses the username,
    so by running this script, you also reduce the chance of a typo causing problems.


    # Using Variables


    Certification Objective


    Another type of variable is assigned within scripts—for instance, variables can
    be set from the output of a command. These variables are also identified by leading
    dollar signs, but they are typically given names that at least begin with a letter,
    such as $Addr or $Name. (When values are assigned to variables, the dollar sign
    is omitted shortly.) You can then use these variables in conjunction with normal
    commands as if they were command parameters, but the value of the variable is
    passed to the command.


    For instance, consider Listing 11.3, which checks to see if the computer''s router
    is up-wise with the help of the ping utility. This script uses two variables.
    The first is $ip, which is extracted from the output of using grep, tr, and cut
    commands. When you''re assigning a value to a variable from a command, which should
    be enclosed in back-tick characters (`), which appear on the same key as the tilde
    (~) on most keyboards, are not ordinary single quotes, which appear on the same
    key as the regular quote (") on most keyboards. The second variable, $ping, simply
    points to the ping program. It can just as easily be omitted, with subsequent
    uses of $ping replaced by the full path to the program or simply by relying on
    the $PATH environment variable to find the program). Variables like these are
    some times used to make it easier to modify the script in the future. For, if
    you move the ping program, you need to modify only one line of the script. Variables
    can also be used in conjunction with conditionals to ensure that the script works
    on more systems—for instance, if ping were called something else on some systems.


    *'
