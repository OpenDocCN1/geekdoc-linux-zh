  md: '# SIDEBAR


    A sidebar is an extended description of a topic that''s related to the main text
    but that doesn''t fit neatly into the flow of the surrounding paragraphs. It may
    expand on a point to provide added context or suggest an alternative way of doing
    things from the method emphasized in the main text.


    Many chapters of this book describe both GUI and text-mode methods of accomplishing
    tasks. Because you''re likely to be more familiar with GUI tools, most chapters
    begin with them; however, in most cases, Linux''s text-mode tools are more powerful.
    Furthermore, the Linux Essentials certification covers mainly text-mode tools.
    Therefore, be sure to learn the text-mode tools. As you gain proficiency with
    Linux, you''re likely to find yourself using the text-mode tools more often than
    the GUI tools because of the added flexibility that the text-mode tools provide.
    Furthermore, the GUI tools tend to vary a lot between distributions, whereas the
    text-mode tools vary much less.'
