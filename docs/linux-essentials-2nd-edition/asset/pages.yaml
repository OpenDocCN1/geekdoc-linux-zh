    it with a Ctrl+D keystroke. If it''s used from a script, you might omit the argument
    entirely or pass an external file as the message, using input redirection. You
    might want to use this command to send mail to the superuser after the actions
    of a startup script or a script that runs on an automated basis.


    Chapter 8 describes input redirection.


    Many of these commands are extremely complex, and completely describing them is
