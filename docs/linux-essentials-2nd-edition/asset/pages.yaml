  md: '# Investigating Linux’s Principles and Philosophy


    **You can frequently select** a product or technology on purely pragmatic grounds—what
    OS works well for a given task, which software suite is the least expensive. Sometimes,
    though, understanding the principles and philosophy that underlie a technology
    can be useful, and knowing these might even guide your choice.


    This is true of some Linux users; the open source model of Linux, which we introduced
    in Chapter 1, “Selecting an Operating System,” has implications that can affect
    how Linux works. Furthermore, some in the Linux world can become quite passionate
    about these principles. Whether or not you agree with these individuals. understanding
    your point of view can help you appreciate the Linux culture, which you’ll find
    in the workplace, online, at conferences, and so on.


    This chapter covers these issues, beginning with information on Linux’s origins
    and its development over time up to the present. We then describe open source
    principles and how they can affect the way an open source OS works in the real
    world. Finally, we describe some of the roles in which Linux can work—as an embedded
    OS, as a desktop or laptop OS, and as a server OS.


    +   - Exploring Linux through the ages

    - Using open source software

    - Understanding OS roles


    # Exploring Linux through the Ages


    Although Linux’s birth date of 1991 is recent by most historical standards, in
    the computer world 25 years is an eternity. The software and culture in the early
    1990s, and even before then, have conveyed quite a legacy to today’s'
