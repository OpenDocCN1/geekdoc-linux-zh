  md: 'can type as many commands as root as you like. When you''re done, type exit
    to relinquish your superuser status. You can also use su to run a single command
    as root by using the -c option, as in su -c command to run command as root. If
    you use a dash (-) within the command, as in su -luke, the program opens a login
    session that runs the target user''s login scripts. This is important because
    these scripts set environment variables that can be important for that user, such
