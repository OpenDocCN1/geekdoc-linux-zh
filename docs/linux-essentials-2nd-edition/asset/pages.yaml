    be mounted elsewhere. You can use /tmp and certain subdirectories of /var, though
    most users don''t need to be aware of these locations—programs are usually hard-coded
    to use them for temporary files or for specific types of files, such as incoming
    files. As a system administrator, you might manipulate files located in any of
    these directories; however, for a system administrator,/etc is particularly important,
    since that''s where most system configuration files reside. As you explore your
    computer with GUI or text-mode tools, you should keep this directory structure
    in mind.


