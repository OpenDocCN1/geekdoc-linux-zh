- pgno: 234
  md: '# Using Commands


    commands that you type in a shell prompt are external commands; they''re programs
    located in /bin, /usr/bin, and other directories on your path. You can run such
    programs, as well as internal commands, including their names in the script. You
    can also specify parameters to such programs in a script. For instance, suppose
    that you want a script that launches two xterm windows and the KMail mail reader.
    Listing 11.1 presents a shell script that accomplishes this goal.


    # LISTING 11.1: A simple script that launches three programs


    ```

    #!/bin/bash

    /usr/bin/xterm &

    /usr/bin/xterm &

    /usr/bin/kmail &

    ```


    Aside from the first line that identifies it as a script, the script looks just
    like the commands that you might type to accomplish the task manually, except
    for one fact: the script lists the paths to each program. This is usually not
    strictly necessary, but listing the complete path ensures that the script will
    find the programs if the PATH environment variable changes. On the other hand,
    if the programs move (say, because you upgrade the package from which they''re
    installed and the packager decides to move them), scripts that use complete paths
    will break. If a script produces a No such file or directory error for a command,
    typing which command, where command is the offending command, should help you
    locate it.


    Each-program line in Listing 11.1 ends in an ampersand (&). This character tells
    the shell to go on the next line without waiting for the first to finish. If you
    omit the ampersands in Listing 11.1, the first xterm will wait for the second
    until the first is closed. Likewise, KMail will wait until the second xterm terminates.


    Launching several programs from one script can save time in startup scripts and
    some other situations, scripts are also frequently used to run a series of programs
    that manipulate data in one. Such scripts typically do not include the ampersands
    at the ends of the commands because one command must run after another or may
    rely on output from the first. A comprehensive list of such commands is impossible
    because you can run any program you can install in Linux as a command in a script—even
    another script. A few commands that are commonly used in scripts include the following:


    Normal File-Manipulation Commands The file manipulation commands, such as ls,
    mv, cp, and rm, are often used in scripts. You can use these commands to help
    automate repetitive file maintenance tasks.


    Fedora is undertaking a project to standardize Linux distributions to eliminate
    the /bin folder. Currently in Fedora 21, all of the programs in the /bin folder
    are linked to the /usr/bin folder, but eventually all programs will be moved to
    the /usr/bin folder.'
  merge: -1
  img_proc: true
