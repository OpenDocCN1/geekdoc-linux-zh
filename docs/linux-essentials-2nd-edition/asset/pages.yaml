    # # Understanding Disk Issues


    Disks are a critical part of most Linux installations. Therefore, we describe
    three basic disk issues in this section: disk hardware interfaces, disk partitioning,
    and filesystems. We also describe some of the issues surrounding removable disks,
    including optical (CD-ROM, DVD-ROM, and Blue-ray) disks.


    # # Understanding Disk Interfaces


    Today, two disk interfaces are common, both of which have already been mentioned:


    PATA This interface was common in the past, but it''s fading in popularity. It
    features wide 40- or 80-pin cables that transfer several bits of data simultaneously—hence
    the word *parallel* in the name Parallel ATA (PATA). A PATA cable can have up
    to three connectors—one for the motherboard or disk controller and two more for
    two hard disks. Alternative names for PATA (for specific variants of it) include
    Integrated Drive Electronics (IDE) or Enhanced IDE (EIDE). The ATA Packet Interface
    (ATAPI) defines a software interface that helps ATA manage devices other than
    hard disks. Although in some cases the differences between the technologies described
    by these variant terms are important, today they''re used synonymously.


    SATA In 2003, a serial version of the ATA protocol was created, hence Serial ATA
    (SATA). SATA is more software compatible with BIOS, but it uses thinner cables
    that can handle one hard disk per. Currently SATA is the dominant disk technology
    on new computers. An external variant, eSATA, provides high-speed connections
    to external hard disks.


    In addition to these technologies, others exist. The Small Computer System Interface
    (SCSI) is a parallel interface that was once common on servers and high-end interfaces,
    but it is less common today. The Serial Attached SCSI (SAS) is a serial variant
    that''s quite similar to SATA. Both of these technologies are important because
    ATAPI is modeled after SCSI. The USB interface is often used for connecting external
    disks.


