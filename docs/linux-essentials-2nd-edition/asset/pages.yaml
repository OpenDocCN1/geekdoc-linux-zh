  md: '# Chapter 13 · Creating Users and Groups


    # Managing Groups


    In many respects, groups are comparable to accounts. They are defined in similar
    files and managed with similar utilities. Groups are also tied to accounts, in
    that accounts include group definitions. Until now, it has been assumed that you''ll
    be using standard groups or the groups that are defined as part of account creation.
    Sometimes, though, need to create, delete, or modify groups for specific purposes,
    as if you use a project group strategy. With account management, you can do this
    using either GUI or text-mode tools.


    # Managing Groups Using GUI Tools


    Many GUI account maintenance tools, such as openSUSE''s User and Group Administration
    utility, provide group management tools that are similar to the user management
    tools described throughout this chapter. Referring back to Figure 13.1, you will
    see that the User and Group Administration window includes both Users and Groups
    tabs. To manage groups, click the Groups tab. This produces a display resembling
    Figure 13.6.


    ![](img/77662199428609b7662c8dc9c0e45c10_283_0.png)


    FIGURE 13.6: The User and Group Administration utility enables you to manage groups
    as well as users.


    You can add, modify, and delete groups in a manner that''s comparable to-adding,
    modifying, and deleting accounts, though the number of options available'
