    To access a filesystem, you must mount it with the mount command. For instance,
    to mount the filesystem on /dev/sda5 /shared, you would type the following command:


    ```

    # mount /dev/sda5 /shared

    ```


    Alternatively, you can create an entry for the filesystem in the /etc/fstab file,
    which stores information as the device file, filesystem, and mount point. When
    you''re using a filesystem, you can unmount it with the mount command, as in unmount
    /shared.


    # Using Removable and Optical Disks


    If you insert a removable disk into a computer that''s running most modern Linux
    distributions, the computer will properly detect that fact, mount the disk in
    a subdirectory of /media, and launch a file manager on the disk. This behavior
    makes the system work in a way that''s familiar to users of Windows or Mac.


    When you''re using the disk, you *must* unmount it before you can safely remove
    it. Most file managers allow you to do this by right-clicking the disk in the
    left-hand pane and selecting an option called Eject Volume, or Safely Remove,
    as shown in Figure 5.3. If you fail to do this, the file system may suffer damage.'
