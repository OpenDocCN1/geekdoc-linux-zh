    commands. The commands would rename files, launch programs, and so on.

    Although many computer users today don''t use text-mode shells, they''re still

    important for intermediate and advanced Linux users, we describe them in

    more detail in Chapter 6, “Getting to Know the Command Line,” and subsequent

    shells rely on your ability to use a text-mode shell. Many shells are avail-

    able, and shells are available and vary from one OS to another. In

    Linux, a shell known as the Bourne Again (shell or Bash) is popular.


    Graphical User Interfaces A graphical user interface (GUI) is an improve-

    ment on a text-mode shell, at least from the perspective of a beginner user.

    In typing of commands, GUIs rely on icons, menus, and mouse

    pointer. The Windows and Mac each have their own OS-specific GUIs. Linux

    ies on a GUI known as the X Window System, or X short. X is a basic GUI,

    so Linux also uses desktop program suites, such as GNOME or the

    Desktop Environment (KDE), to provide a more complete user experience. It’s

    differences between Linux desktop environments and the GUIs in Windows and

