    # Using Command History


    Bash remembers the recent commands that you''ve typed, and you can use this to
    save yourself if you need to type a command that''s similar to one that you''ve
    typed recently. In its most basic form, you can use the up-arrow key to enter
    the previous command; pressing the up-arrow repeatedly moves backward from earlier
    and earlier commands. Table 6.1 summarizes some other commonly keystrokes you
    can use in the command history—when editing new commands.


    | TABLE 6.1 Bash editing and command history features |

    | Keystroke | Effect |

    |---|---|

    | Up arrow | Retrieves the previous entry from the command history. |

    | Down arrow | Retrieves an earlier entry bypassed when using the up arrow. |

    | Left arrow | Moves the cursor left one character. |'
