- pgno: 309
  md: 'we begin by describing it in more detail. We then cover a topic that''s applicable
    to only some systems: configuring Wi-Fi. If you use it, you must configure Wi-Fi
    before setting other network options. Once Wi-Fi is configured, the rest of the
    network setup procedure is much like for wired networks. We then provide an example
    of using GUI tools for network configuration. These tools are easy to use, and
    they can handle most situations. Finally, we cover text-based configuration tools,
    which provide a great deal of power that you might need to use in certain settings.


    # Deciding Whether to Use DHCP


    As noted earlier, a computer requires, at a minimum, two pieces of information
    to connect to a typical network: an IP address and a netmask. IP addresses for
    a router and a DNS server are practical on most networks, although in some cases
    you do without one or both. Some networks require additional configuration details.


    Configuring every computer on a large network with all of this information can
    be time-consuming. Worse, it can lead to problems caused by human errors, such
    as types in IP addresses. For this reason, most networks provide a DHCP server,
    which can provide this information to other computers.


    Depending on the configuration of the server, DHCP can be used to deliver IP addresses
    in one of two ways:


    +   - In a fixed way, so that each computer receives the same IP address every
    time it boots


    +   - Dynamically, so that a single computer might receive different IP addresses
    on different boots


    Which is a policy detail for your network administrator. You needn''t need to
    be concerned with it, except to know that a computer configured with DHCP is not
    necessarily guaranteed to receive the same IP address on each boot. This fact
    can have important implications. In instance, it''s easily guaranteed and most
    reliable to configure a server computer if it has a fixed IP address. Thus, as
    a matter of policy, server computers are often configured without using DHCP—even
    if workstations on the same network use DHCP. This isn''t always the case, though—as
    already noted, DHCP can deliver a fixed address to some or all computers, so that
    the DHCP server''s administrator can configure a network''s servers in this way.


    As a practical matter, unless you''re configuring your own private network, you
    should ask your network administrator whether to use DHCP for a new computer.
    If the answer is no, you should ask for an IP address, the netmask, the router''s
    IP address, and the DNS server''s IP.


