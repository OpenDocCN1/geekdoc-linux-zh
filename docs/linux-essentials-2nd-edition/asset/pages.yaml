- pgno: 348
  md: '# LPI’s Certification Program


    The purpose of the Linux Essentials Program is to define the basic knowledge required
    to use a desktop or mobile device competently using the Linux operating system.
    The program guides and encourages those who are new to Linux, and to open source
    in general, to understand the place of these tools in the context of the broader
    IT industry.


    The program is made up of several main components:


    +   - Linux Essentials exam and certification


    +   - Support for worldwide participation in the WorldSkills Information and Communication
    Technology (ICT) category, IT Network Systems Administration


    +   - Regional links to employability and apprenticeship programs available to
    youth


    +   - Research and resources supporting youth entry into Linux and open source
    careers


    +   - Linux Professional Institute (LPI) support for regional government and educational
    qualification authorities where appropriate


    +   - LPI support for teacher collaboration and sharing of projects and exercises
    for the Linux Essentials knowledge base


    +   - Resources for youth describing jobs and industries requiring Linux skills


    # The Linux Essentials Certification


    The successful Linux Essentials candidate should have an understanding of the
    Linux and open source industry and knowledge of the most popular open source applications.
    The candidate should understand the major components of the Linux operating system
    and have the technical proficiency'
  merge: -1
  img_proc: true
- pgno: 349
  md: 'to work on the Linux command line. The candidate has at least a basic under-standing
    of security- and administration-related topics, such as managing users and groups,
    working on the command line, and using permissions.

    LPI Linux Essentials Technician (LPI LET) is most likely the end user of a mostly
    managed system.


    The LPI LET, at a minimum, typically:


    +   - Has a basic understanding of free and open source software, the various
    communities, and licenses

    - Understands the basic concepts of processes, programs, and components of an
    operating system

    - Has a basic knowledge of computer hardware

    - Has a basic appreciation of system security, users and groups, and file permissions
    for public and private directories

    - Has a basic understanding of how to make the system accessible and is able to
    connect to other computers on a local area network

    - Demonstrates a knowledge of open source applications in the workplace as they
    relate to closed source equivalents

    - Understands navigation systems on a Linux desktop and where to go for help

    - Has a rudimentary ability to work on the command line and with files

    - Is able to make and restore simple backups (archives)

    - Can use a basic command-line editor

    - Understands file compression

    - Is able to create and run simple scripts


    # # Certification Objectives Map


    Table B.1 provides approximate objective mappings for the LPI Linux Essentials
    Program. It identifies the chapters and sections that cover the exam objectives.
    Be aware, however, that some specific programs and technologies are mentioned
    in multiple objectives, so you may find more-complete coverage of some topics
    in chapters other than those noted in Table B.1. Consult this book''s index if
    you need help finding a specific subject.'
  merge: -1
  img_proc: true
