- pgno: 288
  md: '# Setting Ownership and Permissions


    As a multiuser OS, Linux provides tools to help you secure your files against
    unwanted access—after all, you wouldn''t want another user to read your personal
    files or even delete your work files, whether accidentally or intentionally. Linux
    handles these tasks through two features of files and directories: their ownership
    and their permissions. Every file has an associated owner (an account with which
    it''s linked) and also an associated group. Three sets of permissions define the
    file''s owner, members of the file''s group, and all other users can do with the
    file. Thus ownership and permissions are intertwined, although you use different
    text-mode commands to manipulate them. (GUI tools often combine the two, as described
    in this chapter.)


    +   - Setting ownership

    - Setting permissions


    # Setting Ownership


    Linux''s security model is based on that Unix, which was designed as a multiuser
    OS. This security model therefore assumes the presence of multiple users on the
    computer, and it provides the means to associate individual files with the users
    who create them—that is, files have owners. You should thoroughly understand this
    concept, and with that understanding, you can change a file''s ownership, using
    either a GUI manager or a text-mode shell.


    Ownership also applies to running programs (or processes). Most-programs that
    you run are tied to the account that you used to launch them. This identity, in
    conjunction with the file''s ownership and permissions, determines whether a program
    may modify a file.


    ![](img/77662199428609b7662c8dc9c0e45c10_288_0.png)'
  merge: -1
