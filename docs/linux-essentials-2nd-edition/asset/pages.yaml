  md: '# Appendix A - Answers to Review Questions


    # Chapter 14


    +   1. D Option D is the correct command. Typing chown ralph:tony somefile.txt,
    as in option A, sets the owner of the file to ralph and the group to tony. The
    chmod command used in options B and E is used to change file permissions, not
    ownership. Option C reverses the order of the filename and the owner.


    +   2. C, D D character that leads the mode indicates that the file is directory,
    while the r symbol in the r-x triplet at of the symbolic mode indicates that all
    users of the system have read access to the directory, so options C and D are
    both correct. Leading l characters, which this mode lacks, denotes unique symbolic
    links, so is incorrect. Although the x usually denote executable program files,
    as specified in option B, in the case of directories, this permission bit indicates
    the directory''s contents may be searched; the only permission field for write
    access is in the first triplet, which refers to the file''s owner, so only that,
    and not other members of the file''s group, may write to the file, contary to
    option E.


    +   3. E Although the chgrp command is the usual one for changing a file''s group,
    you can also use chmod to do the job, so option E is correct. Option''s groupadd
    command adds a new group to the system, so this option is incorrect. The groupmod
    command can modify details of a group definition, so option B is incorrect. The
    chmod command changes a file''s mode (that is, its permissions), not its group
    association, so option C is incorrect. You can use ls to learn a file''s current
    group (among other things), but not to change it, so option D is incorrect.


    +   4. True The octal permission of 755 corresponds to a symbolic representation
    of rwxrxr-x, which includes world read permissions (in the final three bits of
    r-x). Thus anybody can read the file.


    +   5. False Any user may use chmod; however, only a file''s owner or root may
    change the permissions on a file.


    +   6. True Although an ordinary user can use chown to change a file''s group,
    ordinary users cannot change a file''s ownership.'
