- pgno: 289
  md: '# Understanding Ownership


    Chapter 12, "Understanding Basic Security," and Chapter 13, "Creating Users and
    Groups," described Linux’s system of accounts. These accounts are the basis of
    file ownership. Specifically, every file has an owner—an account with which it
    associated. This association occurs by means of the account’s user ID (UID) number.
    Every file is also associated with a group by means of a group ID (GID) number.

    As described later, in the section "Setting Permissions," access to the file is
    controlled by means of permissions that can be set independently for the file
    owner, the file’s group, and all other users of the computer. At root, you can
    change the owner and group of any file. The file’s owner can also change the file’s
    group, but only to a group to which the user belongs.

    The same principles of ownership apply to directories have owners and groups.
    These can be changed by root, or to a more extended extent, by the directory’s
    owner.


    # CROSS-INSTALLATION UIDs AND GIDs


    You may use multiple Linux installations, either dual-booting on one computer
    or installed on multiple computers. If you do, and if you transfer files from
    one installation to another, you may find that the ownership of files seems to
    change as you move them around. The same thing can happen with non-Linux Unix-like
    OS, such as Mac OS X. The reason is that the filesystems for these OS store ownership
    and group information by using UID and GID numbers, and a single user or group
    can have different UID or GID numbers on different computers, even if the name
    associated with the account or group is identical.


    This problem is most likely to occur when using native Linux or Unix filesystems
    to transfer data, including both disk-based filesystems (such as Linux’s ext or
    Mac OS X H+) or the Network File System (NFS) for remote access. This problem
    is less likely to occur if you use a non-Linux/Unix filesystem, such as the File
    Allocation Table (FAT) or the New Technology File System (NTFS) for, the Server
    Message Block/Common Internet File System (SMB/CIFS)—handled by Samba in Linux
    for network access.

    If you run into this problem, several solutions exist, but many of them are beyond
    the scope of this book. One that you can use, though, is to change the UID or
    GID mappings on one or more installations so that they all match. Chapter 13 describes
    how to change a user’s UID number with usermod and how to change a group’s GID
    number with groupmod. When transferring data via removable disks, using FAT or
    NTFS can be a simple solution, provided that you don’t need to preserve Unix-style
    permissions on the files.'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# Setting Ownership in a File Manager


    As described in Chapter 4, “Using Common Linux Programs,” a file manager enables
    you to manipulate files. You''re probably familiar with file managers in Windows
    or Mac OS X. Linux''s ownership and permissions are different from those of Windows,
    though, you may want to know how to check on, and perhaps change, ownership features
    by using a Linux file manager. As noted in Chapter 4, you have a choice of several
    file managers in Linux. Most are similar in broad strokes but differ in some details.
    In this section, we use Nautilus, the default file manager used in the GNOME desktop,
    as example.


    If you want to change the file''s owner, you must run Nautilus, but you can change
    the file''s group to any group to which you belong as an ordinary user. The procedure
    to perform this task as root is as follows:


    +   1. Launch a terminal window.

    2. In the terminal window, type su to acquire root privileges.

    3. In the terminal window, type nautilus to launch Nautilus. You can optionally
    include the path to the directory in which you want Nautilus to start. If you
    don''t include a path, Nautilus will begin by displaying the contents of the /root
    directory.

    4. Locate the file ownership you want to adjust and right-click it.

    5. In the resulting menu, select Properties. The result is a Properties dialog
    box.

    6. Click the Permissions tab in the Properties dialog box. The result represents
    Figure 14-1.

    7. To change the file''s owner, select a new owner in the Owner field. This action
    is possible only if you run Nautilus as root.

    8. To change the file''s group, select a new group in the Group field. If you
    run Nautilus as an ordinary user, you will be able to select any group to which
    you belong, but if you run Nautilus as root, you will be able to select any group.

    9. When you''ve adjusted the features that you want to change, click Close.


    ![](img/77662199428609b7662c8dc9c0e45c10_290_0.png)


    > If you''re using Ubuntu, you may need to use sudo to launch Nautilus.


    ![](img/77662199428609b7662c8dc9c0e45c10_290_1.png)


    > The /root directory is the root account''s home directory.


    If you want to change a file''s group but not its owner, and if you''re a member
    of the target group, you can launch Nautilus as an ordinary user. You can then
    pick up the preceding procedure at step 4.'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# Chapter 14 • Setting Ownership and Permissions


    ![](img/77662199428609b7662c8dc9c0e45c10_291_0.png)


    FIGURE 14.1 Linux file managers give you access to the file''s ownership and permission
    metadata.


    You should be extremely cautious about running Nautilus as root. If you forget
    that you''re running this program as root, you can easily create new files as
    root, which will require additional root-privilege actions to correct by changing
    file ownership. It''s also easy to delete critical system files accidentally as
    root, which you could not delete as an ordinary user. For these reasons, we recommend
    that you use a text-model shell to adjust file ownership. The change in the prompt
    makes it easier to notice that you''re running as root, and if you''re used to
    use a GUI, you''re less likely to launch additional programs as root from a text-mode
    shell than from Nautilus.


    Certification Objective


    # Setting Ownership in a Shell


    The command to change the ownership of a file in the preferred text-mode manner
    is chown. In its most basic form, you pass the name of a file followed by a username:


    The chown command stands for change owner.


    ```

    # chown bob targetfile.edf

    ```'
