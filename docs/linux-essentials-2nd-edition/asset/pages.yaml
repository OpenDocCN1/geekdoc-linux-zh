  md: '# Investigating Software Licenses


    # PATENTS, TRADEMARKS, AND SOFTWARE


    Certification Objective


    Copyright is one example of intellectual property, but there are many others.
    One of these is patents. A copyright protects a single creative work, which can
    be considered an expression of an idea, but a patent protects the idea itself.
    Patents typically apply to inventions, as the proverbial "better mousetrap."


    In the United States, software patents are legal. Although you can''t patent an
    entire program, you can patent the algorithms that the program uses. Such patents
    are both common and controversial. Some open source programs do not use clear
    file formats because the algorithms required to use them are patented and the
    patent-holders threatened to sue unauthorized users. Critics of software patents
    contend that such patents are trivial or obvious—two things that a patented invention
    must not be. Companies use software patents as a way to block another company
    from selling a product, or to demand payment from a company that sells a product.


    In many other countries, software algorithms cannot be patented. Efforts are underway
    to change the relationships between software and patents—both to make software
    patentable in countries where it is not and to restrict or eliminate software
    patents in countries where software can currently be patented.


    Trademarks are another type of intellectual property. These are names, logos,
    and similar identifiers of a specific company or product. Software and the companies
    that produce it use trademarks, as do hardware companies. An individual with little
    involvement in the Linux community trademarked the name Linux in 1994 and attempted
    to claim royalties on the name. After a lawsuit, the trademark was transferred
    to the Linux Mark Institute, or LMI (www.linuxfoundation.org/programs/legal/trademark).


    As an end user, it is unlikely that you will need to deal with software patents
    or trademarks. Software patent and trademark issues usually play out at the corporation
    level. This contrasts with copyright issues, which can affect individuals who
    violate copyright law. If you work for a company that releases software, though,
    patent and trademark law could affect you. This is especially true if your software
    potentially violates a software patent or trademark. You should consult an attorney
    if you believe this might be the case.


    Courts have often upheld the enforceability of click-through and similar licenses,
    although this result is not universal.


    cases you might click a button to accept the license terms. In the past, licenses
    were sometimes printed on the boxes in which software was distributed. Such licenses
    are often called end-user license agreements (EULAs), click-through licenses,
    shrink-wrap licenses, or click-wrap licenses. Open source software generally comes
    with a license in a file, often called COPYING.'
