- pgno: 278
  md: '# Modifying Accounts from the Shell


    One of the most frequent account modifications is to change a user''s password,
    either as part of account creation or because a user has forgotten their password.
    You can change this with the passwd program. Ordinary users can type passwd to
    change their own passwords, but not other user accounts'' passwords. The super
    user, however, can pass a username to the command to change any account:


    Certification

    Objective


    ```

    # passwd kevin

    Changing password for user kevin.

    ```


    New password:

    Retype password:

    passwd: all authentication tokens updated successfully.


    As a security measure, the password that you type does not echo the screen as
    you type it. If the passwords don''t match, the program refuses to accept your
    change and prompts you again for a fresh pair of passwords. The program also checks
    the password''s strength and may refuse to accept the new password or display
    a warning message if it deems it to be too weak. Notice in the preceding example
    that the # prompt is showing, indicating that someone has logged into the root
    account to obtain super user privileges, which are required to complete this change
    successfully.


    You can handle most other account modifications by using the usermod program.
    This command works like user, but instead of creating a new account, it modifies
    an existing one. Table 13.2 summarizes the most important us options.


    In addition to setting passwords, the passwd utility enables you to adjust password
    expiration and aging options.

    Consult its man page for details.


    Certification

    Objective


    # TABLE 13.2: Options for usermod


    | Option name | abbreviation | Effect |

    |---|---|---|

    | --append | -a | Used with --groups (-G), causes the specified groups to be added,
    rather than replace, the existing set of groups for the user. |

    | --comment comment | -c | This parameter specifies the comment field for the
    user. (GUI tools generally describe this as "full name.") |

    | --home home-dir | -d | You specify the account''s home directory with this parameter.
    It defaults to /home/username. |


    (Continues)'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# Chapter 13 · Creating Users and Groups


    # TABLE 13.2 (Continued)


    | Option name | Option abbreviation | Effect |

    | --- | --- | --- |

    | --expired expire-date | -e | You set the date on which the account will be disabled,
    expressed in the format YYYY-MM-DD, with this option. The default is for an account
    that does not expire. |

    | --inactive inactive-days | -f | This parameter sets the number of days after
    a password expires, after which the account becomes completely disabled. A value
    of -1 disables this feature and is the default. |

    | --gid default-group | -G | You set the name or GID of the user''s group with
    this option. The default for this value is a new group named after the user. |

    | --groups group[,] | -G | This parameter sets the names or GIDs of groups to
    which the user belongs—more than one may be specified by separating them with
    commas. |

    | --login username | -L | Changes the account''s username to the specified value.
    |

    | --lock | -L | Locks the account''s password, preventing logins. |

    | --move-home | -m | When this option is included with --home-(d), usermod moves
    the user''s existing home directory to the new location. |

    | --shell shell | -s | You set the name of the user''s default shell with this
    option. |

    | --uid UID | -u | This parameter changes the account''s UID number to the specified
    value. |

    | --non-unique | -o | This parameter enables a single UID number to be reused.
    (Use in conjunction with --uid/-u). |

    | --unlock | -U | This option unlocks a locked account password. |


    ![](img/77662199428609b7662c8dc9c0e45c10_279_0.png)


    For example, consider the following use of usermod:


    ```

    # usermod -u 1072 -m -d /home2/kevin kevin

    ```


    This command makes three changes to the key account:


    +   * It changes the UID value to 1072.

    * It changes the account''s home directory to /home2/kevin.'
