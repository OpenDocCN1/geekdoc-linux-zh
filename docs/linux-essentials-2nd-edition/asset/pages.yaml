    ![](img/77662199428609b7662c8dc9c0e45c10_28_0.png)


    FIGURE 1.3 Linux desktop environments provide the types of GUI controls that most
    users expect.


    **Program Launchers** You can launch programs by selecting them from menus or
    lists. Typically, one or more menus exist along the top, bottom, or side of the
    screen. In Figure 1.3, you can click the openSUSE gecko icon in the bottom-left
    corner of the screen to produce the menu that appears in that figure.


    **File Managers** Linux provides GUI file managers similar to those in Windows
    or OS X. A window for one of these is open in the center of Figure 1.3.


    **Window Controls** You can move windows by clicking and dragging their title
    bars, resize them by clicking and dragging their edges, and so on.


    **Multiple Desktops** Most Linux desktop environments enable you to keep multiple
    virtual desktops active, each with their own set of programs. This feature is
    handy to keep the screen cluttered while you run many programs simultaneously.
    Typically, an icon in one of the menus enables you to switch between virtual desktops.


    **Logout Options** You can log out of your Linux session, which enables you to
    shut down the computer or let another user log in.


    > Logging out is important in public computing environments. If you fail to log
    out, a stranger might choose and use your account for malicious purposes.'
