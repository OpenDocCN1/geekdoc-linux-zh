    # Exploring Basic with vi Text-Editing Procedures


    As a method for learning vi, consider the task of creating and editing the pets.txt
    file—the same task described earlier in “Exploring Basic nano Text-Editing Procedures.”
    Listing 10.1 (in that earlier section) shows the pets.txt file to be created in
    this example.


