- pgno: 57
  md: '# Chapter 3 · Investigating Linux''s Principles and Philosophy


    software world. After all, what we use today is built atop the foundation that
    was created in the past. Thus looking at how Linux originated will help you understand
    Linux as it exists today.


    # Understanding Linux''s Origins


    ![](img/77662199428609b7662c8dc9c0e45c10_57_0.png)


    In 1991, as it was today, computers were classified by their sizes and capabilities.
    Computers could belong to any handful of categories, ranging from desktop personal
    computers (PCs) to supercomputers. .x86-based computers, which are the direct
    ancestors of today''s PCs, dominated the PC marketplace of 1991; however, other
    types of PCs were available, including Macs. Such computers generated different
    CPUs and ran their own custom OS.


    In 1991, most PCs ran Microsoft''s Operating System (MS-DOS, PC-DOS, or DOS).
    DOS was extremely limited by today''s standards; this single-tasking OS (capable
    of running only one application at a time) didn''t take full advantage of the
    memory or CPUs at the time. The versions of Microsoft Windows were available in
    1991 on top of DOS. Although the initial versions of Windows helped to work around
    some of DOS''s limitations, they didnt fix any of them. These early versions of
    Windows employed cooperative multitasking, for instance, which programs could
    voluntarily give up CPU time to other processes. The DOS kernel could not control
    a program that choked CPU.


    Computers today can be classified in much the same way as in 1991, although some
    details changed. A notable addition is embedded computers, or as smartphones.


    ![](img/77662199428609b7662c8dc9c0e45c10_57_1.png)


    Above the PC level, Unix was a common OS in 1991. Compared to DOS and the version
    of Windows of that time, Unix was a sophisticated OS. Unix multiple applications
    and provided preemptive multitasking, in which the kernel could schedule CPU time
    for programs, even if the programs didn''t voluntarily give up control. These
    features were necessities for many servers and for multiuser computers such as
    min and mainframes.


    As time progressed, the capabilities of each class of computer have grown. By
    most measures, today''s PCs have the power of computers or even the mainframes
    of 1991. The OSs used on the PCs of 1991 didn''t scale well to more powerful hardware.
    Just having computing power itself, for this reason, DOS and its small-computer
    contemporaries have been largely abandoned in favor of Unix and other alternatives.


    ![](img/77662199428609b7662c8dc9c0e45c10_57_2.png)


    Unix was not the only multiuser, multitasking in 1991. Others, as Virtual Memory
    Systems (VMS), were available. Unix is not relevant to Linux''s history, though.


    In 1991, Lin Torvalds was a student at the University of Helsinki, computer science.
    He was interested in learning about both Unix and the capabilities of the .x86
    kernel he had just purchased. Torvalds began the program that would become the
    Linux kernel as a low-level emulator—a program to connect to his user''s laptop
    computers. As his program grew, adding features that turned his terminal program
    into something that could be better described as an OS kernel. Eventually, he
    began


    Today''s versions of Windows are not derived from DOS. Instead, they use a new
    kernel that shares many features with VMS.


