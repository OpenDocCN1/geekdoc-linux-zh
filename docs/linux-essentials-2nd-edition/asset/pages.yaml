    # Getting Help Using info Pages


    The man page system is typical on Unix-like OSs, including Linux, but it''s also
    quite old and therefore limited. A newer documentation system, known as info pages,
    is also available. The next few pages describe how info pages fill gaps in the
    man page system and how to use info pages.


    ![](img/77662199428609b7662c8dc9c0e45c10_138_0.png)


    # Understanding the Purpose of info Pages


    The basic design of man pages dates back decades, so predates some important developments
    in managing information. Most notably, man pages are not hyperlinked. Although
    a See Also section is common in man pages, you cant select one of these items
    to read the relevant man page directly; you must quit the man system and type
    a new command to read the new page. This lack of hyperlinking also makes navigating
    through a large man page awkward. You can use text searches to locate information
    that you desire, but these often find the wrong text—or if mistype a string, your
    search might find completely.


    The goal of info pages is to overcome these problems by supporting linking. Each
    info page is known as a node, and the info page system as a whole is an interrelated
    set of nodes, similar to the World Wide Web (WWW) of the Internet. Each individual
    program''s documentation can be split across multiple nodes, which make each node
    easier to locate and search—but if you need to search for information and are
    not sure which node it resides, you may need to search multiple nodes.


    Nodes are organized on levels, which are similar to the levels of organization
    in a book. This book, for instance, has chapters and two levels of headings within
    each chapter. Similarly, the info page for a program is likely to have one main
    node, similar to multiple nodes at a lower level, similar to chapter headings.
    Some programs'' info pages include further levels to organize information.


    ![](img/77662199428609b7662c8dc9c0e45c10_138_1.png)


    In terms of writing style, info pages are similar to man pages—they are terse
    but comprehensive descriptions of their topics—intended for people who are already
    at least broadly familiar with the programs in question. If you''re starting out
    with a program, other types of documentation (described later, in "Finding Additional
    Documentation") may be a better choice.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Chapter 6 · Getting to Know the Command Line


    Broadly speaking, programs sponsored by the Free Software Foundation (FSF) use
    info pages in preference to man pages. Many FSF programs now ship with minimal
    man pages that point the user to the programs'' info pages. Non-FSF programmers
    have been slower to embrace info pages; many such programs do not ship with info
    pages at all, and instead rely on traditional man pages. The info browser can
    read and display man pages, so using info exclusively can be an effective strategy
    for reading Linux''s standard documentation.


    # Reading info Pages


    The usual tool for reading info pages is called info. To use it, you type info
    followed by the topic, in info info to learn about the info system itself. Once
    you''re in the info system, you can use a number of keystrokes, summarized in
    Table 6.4, to move around a document.


    Certification Objective


    | Keystate | Action |

    | --- | --- |

    | ? | Displays help information. |

    | N | Moves to the next node in a linked series of nodes on a single hierarchical
    level. This action may be required if the author intended several nodes to be
    read in a particular sequence. |

    | P | Moves back in a series of nodes on a single hierarchical level. This can
    be handy if you''ve moved forward in such a series but that you need to review
    earlier material. |

    | U | Moves up one level in the node hierarchy. |

    | Arrow keys | Moves the cursor around the screen, enabling you to select node
    links or scroll the screen. |

    | Page Up, Page Down | These keys scroll up and down within a single node, respectively.
    (The standard info browser also implements many of the more arcane commands used
    by less and outlined in Table 6.3.) |

    | Enter | Moves to a new node after you''ve selected it. Links are indicated by
    asterisks (*) to the left of their names. |


    TABLE 6.4 info file-navigation commands'
