    # Using a Linux Desktop Environment


    Chances are that your first experience with a working Linux system will involve
    a desktop environment. A desktop environment is a set of programs that control
    the screen, and it also provides small utility programs to perform tasks such
    as managing files. Linux provides several desktop environment options, so if you
    don''t like one, you can choose another. In addition'
