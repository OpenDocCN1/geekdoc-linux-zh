- pgno: 255
  md: '# Chapter 12 • Understanding Basic Security


    **By Specifying the Group''s GID in Users'' Individual /etc/passwd Entries** Because
    /etc/passwd has room for only one GID value, only one group can be defined in
    this way. This is the user''s primary (or default) group.


    **By Specifying Usernames in the User List in the /etc/group File** A single user
    can appear multiple times in /etc/group, and a single group can have multiple
    users associated with it in this way. If a user is associated with a group in
    this way but not via the user''s /etc/passwd entry, this group association is
    secondary.


    When you create new files, those files will be associated with your current group.
    When you log in, your current group is set to your primary group. If you want
    to create files associated with another group to which you belong, you can use
    the newgrp command, as:


    ```

    $ newgrp project1

    ```


    This command makes project1 your current group, so that the files you create will
    be associated with that group. Group ownership of files is important in file security,
    which is described in more detail in Chapter 14.


    # Using Account Tools


    A few commands can help you learn about the users and groups on your computer.
    Most notably, the whoami and id utilities can tell you about your identity, and
    the who and w utilities can give you information about who is currently using
    the computer.


    # Discovering Your Own Identity


    If you maintain multiple accounts for yourself and you don''t recall which one
    you used to log in, you might become confused about your current status. In such
    a case, the whoami command can come in handy. It displays your user ID:


    ```

    $ whoami

    christine

    ```


    This example reveals that the current account is christine. If you need more information,
    you can use the id utility:


    ```

    $ id

    uid=1002(christine) gid=100(users) groups=100(users)[...]

    ```'
