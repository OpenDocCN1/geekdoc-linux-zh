  md: '# Identifying Your CPU


    If you have a working Linux system, you can learn a great deal about your CPU
    by using three text-mode commands:


    **uname -a** Typing uname -a displays basic information on the kernel and the
    CPU. For instance, one of our systems returns x86_64 AMD Phenom (tm) II X3 700e
    Processor,, among other things, indicating the manufacturer and model number of
    the CPU.


    **lscpu** This command returns additional information about 20 lines of output.
    Much of this information is highly technical, as the sizes of cache that the CPU
    supports. Some of it is less technical, such as the architecture and the number
    of CPUs or cores that it supports.


    **cat /proc/cpuinfo** This command returns still more more information compared
    to lscpu. Chances that you won''t need this information yourself, but a developer
    or technician might want some of this information to help debug a problem.


    One thing to keep in mind is that modern x86-64 CPUs can run software compiled
    for the older x86 architecture. Thus you might be running a 32-bit Linux distribution
    on a 64-bit CPU. The output of these commands can be confusing in such cases.
    here''s part of what lscpu shows on one such system:


    | Architecture | 1686 |

    | CPU op-mode(s) | 64-bit |


    The Architecture suggests an x86 CPU (i686 being a specific variant of that architecture),
    the CPU op-mode(s) line indicates that the CPU supports 64-bit operation. If you
    have trouble interpreting this output, you might be able to find something by
    looking up the CPU''s model on the manufacturer''s website. However, manufacturers
    tend to bury such information in hard-to-read specification sheets, be prepared
    to read carefully.


    # Identifying Motherboard Capabilities


    If the CPU is the computer''s brain, the motherboard is the rest of the computer''s
    central nervous system. The motherboard is a large circuit board inside the computer.
    It is dominated by a chipset, which is one or more chips that provide key functionality
    for the computer—they handle the hard disk interfaces,'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'USB interfaces, the network devices, and so on. Some chipsets include video
    circuitry for video cards, although this functionality is sometimes separate,
    and sometimes it''s built into the CPU.


    In addition to the chipset, motherboards include plug-in interfaces for key components:


    +   - One or more slots for the computer''s CPU(s)

    - Slots for random access memory (RAM)

    - Slots for plug-in Peripheral Interconnect (PCI) or other cards

    - Connectors for Serial Advanced Technology Attachment (SATA) disks, and for Parallel
    ATA (PATA) disks

    - Back-panel connectors that provide external interfaces for USB devices, keyboards,
    and so on

    - Connectors for additional external devices, such as front-panel USB plugs, that
    are attached via short internal cables


    Some motherboards—typically used in larger desktop and server computers—have many
    connectors for many purposes. Such motherboards are highly expandable, but they''re
    physically large enough so they require bulky cases. Other motherboards are much
    smaller and can be used in compact computers, but such computers aren''t expandable.
    Laptop computers also have motherboards, which are necessarily of the small variety,
    with little opportunity for internal expansion.


    Most of the connectors on a motherboard are managed by its primary chipset. Some
    high-end boards provide features beyond those of its primary chipset. Such features
    require a secondary chipset, such as an extra Ethernet chipset for a second network
    port, or an extra SATA chipset for more or faster hard disk interfaces.


    Whether the feature is provided by the main or by a secondary chipset, you can
    learn about most of the motherboard''s features with the lspci command, which
    shows information on PCI devices. The output looks something like this:


    ```

    $ lspci

    00:00.0 Host bridge: Advanced Micro Devices [AMD] RS780 Host Bridge

    00:11.0 SATA Controller: ATI Technologies Inc SB700/SB800 SATAM

    Controller [IDE mode]

    00:12.0 USB Controller: ATI Technologies Inc SB700/SB800 USB OCI0m

    Controller

    ```


    > We''ve edited this for brevity.'
