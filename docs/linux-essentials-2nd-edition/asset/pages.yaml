- pgno: 259
  md: '# Chapter 12 • Understanding Basic Security


    Certification Objective


    # # Understanding User Types


    Most people use computers to do ordinary day-to-day computer tasks—browse the
    Web, write letters, manage a music collection, and so on. These activities are
    known collectively as user tasks, and they don''t require special privileges.
    As just noted, a Linux computer can have many user accounts, and the users can
    use the computer from these user accounts (also known as unprivileged accounts,
    unprivileged users, or standard users) to perform such tasks.


    Another user type is a system user. These nonfiction accounts for daemons, services,
    or applications. System user typically have a low UID number; no password (the
    account is locked); /usr/sbin/nologin,/sbin/nologin, or /bin/false as their default
    shell.


    The root account, on the other hand, exists to perform administrative tasks. These
    tasks include installing new software, preparing a new disk for use in the computer,
    and managing ordinary user accounts. Such tasks require access to system files
    that ordinary users need not modify, or sometimes even read.


    To facilitate performing these tasks, root can read and write every file on the
    computer. Since Linux relies on files to store settings, this effectively gives
    root the power to change any detail of the OS''s operation, which is the point
    of having a super user account. If the computer is a workstation that is used
    by just one individual, you might wonder why the distinction between root and
    the user account is assumed. The explanation is that the power of the root account
    can lead to accidental damage. For instance, take the rm command. If you mistype
    it as an ordinary user, you can accidentally delete your own files but not system
    files. Make the same mistake as root, however, and you can delete system files,
    perhaps making the computer unbootable. Thus you should be cautious when using
    the root account, a topic covered more thoroughly in the upcoming "Using root
    Privileges Safely" section.


    # # Acquiring root Privileges


    When you need to perform a command-line task that requires root privileges, you
    can do it in one of three ways:


    **Log as root** You can log directly as root at a text-mode shell or by using
    a remote login tool as SSH. You can even log mode as root over some Linux distributions.
    Some distributions do not allow root to log in directly by default it''s dangerous.


    Certification Objective


    **Use su** The command enables you to change your identity within a shell. **Type
    username** to change your identity to that of the specified username. If you omit
    root, root is assumed; so typing sudo enables you effectively to become root.
    You must, however, know the password for the target account for this command to
    work. After you acquire root privileges in this way, you


    ![](img/77662199428609b7662c8dc9c0e45c10_259_0.png)'
