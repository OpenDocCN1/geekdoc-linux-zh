- pgno: 310
  md: '# Creating a Wi-Fi Connection


    Wi-Fi connections are most often used on laptop and smaller portable computers,
    since using such devices without a physical network cable is often desirable.
    Some desktop computers, though, have Wi-Fi capabilities, and you may want to use
    them.


    Before proceeding, be aware that you may have access to a Wi-Fi network. If you''re
    configuring a computer to connect to a broadband router that you''ve purchased
    and set up, consult the router''s documentation to learn how to locate the router''s
    critical information, such as the service set identifier, or SSID (the Wi-Fi network''s
    name, which may be distinct from the TCP/IP network name), and the password it
    use. If you''re trying to connect to a business network or a public network, consult
    the network administrator to obtain this information.


    Whatever the computer type, the easiest method of configuring your Wi-Fi connection
    is to use the GUI. Details of how to do this from one distribution to another.
    As an example, consider the task in Fedora:


    +   1. Open the System Settings by clicking the down-arrow in the upper-right
    corner of the desktop and selecting the System Settings from the resulting menu
    (the crossed tools) or by typing gnome-control-center at a shell prompt.

    2. Click the Network item in the System Settings Hardware section. The window
    that appears is shown in Figure 15.1.


    > The procedure described here is equivalent to plugging an Ethernet cable into
    an Ethernet port. This procedure might or not set up TCP/IP options.


    ![](img/77662199428609b7662c8dc9c0e45c10_310_0.png)


    FIGURE 15.1 You can adjust the most common network settings from the Network item
    in the System Settings menu.'
