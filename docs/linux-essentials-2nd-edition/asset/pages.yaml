- pgno: 286
  md: '# The Essentials and Beyond


    Deleting groups from the shell entails use of the groupdel command, which takes
    a group name as a single option, as in groupdel consultants to delete the consultants
    group.


    # THE WHEEL GROUP


    Linux distributions invariably provide several groups by default. One of these,
    wheel (on some distributions), is particularly important for system administration.
    Members of the wheel are granted certain special administrative privileges, such
    as the right to use the sudo command. The group name comes from the slang term
    wheel, which refers to an important person.


    Not all distributions provide this particular group. You can type grep /etc/group
    to determine if the wheel exists on your distribution.


    Some distributions allow you to add your primary user account to the wheel group
    when you install the OS. Be aware that this phrasing is not used often; instead,
    the installer asks if you want to add the account to the ''administrators group''
    or some similar term.


    # THE ESSENTIALS AND BEYOND


    In a GUI environment, you can perform most account maintenance tasks with GUI
    tools, which you can add, modify, and delete accounts by selecting options from
    menus and lists. Some operations, however, require you to use command-line tools,
    such as useradd, usermod, userdel, and password. (The groupadd, groupmod, and
    groupdel commands provide similar functionality for groups.) Even if you don''t
    need to use the more obscure features provided by the text-mode tools, they can
    be quicker to use than the GUI tools you''re familiar with.


    # SUGGESTED EXERCISES


    +   - Create a test account using the GUI tool provided by your distribution,
    and then log into the account that you''ve created to verify that it''s working
    as you expected.


    +   - Create another test account using useradd, but do not use passwd to set
    its password. Were you able to log in? Use passwd to create a password for the
    new test account and try logging in again.


    (Continues)'
  merge: -1
  img_proc: true
