    The Mem line reveals total access memory (RAM) statistics, including the total
    memory in the computer (minus whatever is by the motherboard and kernel), the
    amount of memory used, and the amount of free memory. This example shows that
    most of the computer''s memory is in use. Such a state is normal, since Linux
    uses otherwise unused memory as buffers and caches, which helps speed up disk
    access. The Mem: line isn''t the most useful; instead you should examine the +/-
    buffers/cache: line, which shows the total memory used by the computer''s programs.
    In this example, 2,299,080 KiB of 7,914,888 KiB is in use. In other words, a bit
