  md: '# Exploring Copyright Protection and Software


    Certification Objective


    A copyright is, as the name implies, a legally recognized right to create a copy
    of something. In most countries, if you write a book, take a photograph, or create
    a computer program, you (and you alone) have the right to make copies of that
    book, photograph, or computer program. However, you can give others the right
    to make such copies, or relinquish control of the copyright to somebody else.


    Copyright laws vary from one country to another, but most countries signed the
    Berne Convention, an international agreement that requires countries to recognize
    each other''s copyrights. That is, if Jacob writes a book (or opera, or computer
    program) in the United States, that work will be copyrighted not only in the United
    States, but also in Iceland, Kenya, the United Kingdom, and other countries that
    have ratified the treaty.


    Because most copyright laws were written before computers came into being, frequently
    don''t mesh with the needs of computers. For instance, copyright laws forbid the
    copying of a work, but a computer program is useless without such copies. Examples
    of copies that must be made to run a program, or that are advisable for safety,
    include the following:


    +   A copy of the program from an installation medium to a hard drive or solid-state
    drive


    +   A copy of the program from the hard drive or solid-state drive to the computer’s
    random access memory memory (RAM)


    +   A copy of the RAM into swap space


    +   A copy of the RAM into various smaller caches on the motherboard or CPU used
    to improve performance


    +   One or more hard drive or solid-state drive backups to protect against disk
    failures


    Swap space is disk space that serves as a supplement to RAM. For example, if RAM
    begins to use the OS swap space as if it were RAM.


    In the past, such copies were generally ignored on the principle of fair use—that
    is, exceptions that allow portions of copyrighted material to be copied. Other
    examples of fair use include quotes used in reviews or news reports and excerpts
    used in research or teaching. Today, copyright law explicitly recognizes the need
    to copy software to use it, at least in the United States.


