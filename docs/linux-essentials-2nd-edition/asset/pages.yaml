    w displays further information


    +   - The session''s idle time tells how long it''s been since the user has interacted
    with this session. This information can help you identify sessions that the user
    may have abandoned.


    +   - The JCPU column identifies the total amount of CPU time associated with
    the session. This can be useful debugging information if the computer has sluggish
    because of out-of-control processes.


    +   - The PCPU column identifies the total amount of CPU time associated with
    the current process running in the session. Again, this information can help you
    track down out-of-control processes.


    Some configurations also display a FROM column, which shows a remote host-name.
    Using the -f option toggles this option on or off. A few other options can eliminate
    or modify w''s output. Consult the program''s man page for details.


    # Working as root


    Linux is modeled after Unix, which was designed as a multiuser OS. In principle,
    you can have thousands of accounts on a single Unix (or Linux) computer. One user,
    though, needs extraordinary power in order to manage the features of the computer
    as a whole. This is the root user, also known as the superuser, or the administrator.
    Knowing why root exists to do things as root, and how to use root privileges safely
    is important for managing a Linux system.'
