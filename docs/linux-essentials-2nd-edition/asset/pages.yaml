- pgno: 32
  md: '# Where Does Linux Fit in the OS World?


    by contrast, runs on a wide variety of hardware, including most PCs. You can even
    install Linux on Macintosh computers.


    # Comparing Linux to Windows


    Most desktop and laptop computers today run Microsoft Windows. Thus if you''re
    considering running Linux, the most likely comparison is to Windows. Broadly speaking.
    Linux and Windows have similar capabilities; however, there are significant differences
    in details. These include the following:


    **Licensing** Linux is an open source, whereas Windows is a proprietary commercial
    OS. Chapter 2, "Understanding Software Licensing," covers open source issues in
    greater detail, but for now you should know that open source gives you greater
    control over your computer than does proprietary software—at least in theory.
    In, you may need a great deal of expertise to take advantage of open source''s
    benefits. Proprietary software may be better if you work for an organization that''s
    comfortable only with the idea of software that''s sold in a more traditional
    way. (Some Linux variants, though, are sold in a similar manner, along with service
    contracts)


    **Costs** Many Linux varieties are available free of charge, and so they are appealing
    if you''re trying to cut costs. On the other hand, the expertise needed to install
    and maintain a Linux installation is likely to be greater, and more expensive
    than the expertise needed to install and maintain a Windows installation. Different
    studies on the total cost of ownership of Linux vs. Windows have gone both ways,
    but most tend to favor Linux.


    **Hardware Compatibility** Most hardware components require OS support, usually
    in the form of drivers. Most hardware manufacturers provide Windows drivers for
    their devices, or they work with Microsoft to ensure that Windows includes appropriate
    drivers. Although some manufacturers provide Linux drivers, too, for the most
    Linux community as a whole must supply the necessary drivers. This means that
    Linux drivers may take a few weeks or months to appear after a device becomes
    available. On the other hand, Linux developers need to maintain drivers for old
    hardware for much longer than manufacturers continue to support their own old
    hardware. Thus a modern Linux may run better than a recent version of Windows
    on old hardware. Linux also tends to be less resource-intensive, so you can be
    productive on older hardware when using Linux.


    **Software Availability** Some popular desktop applications, such as Microsoft
    Office, are available on Windows but not on Linux. Although Linux alternatives,'
  merge: -1
  img_proc: true
