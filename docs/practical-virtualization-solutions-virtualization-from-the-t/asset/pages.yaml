    # Removing Hardware from a Virtual Machine


    VirtualBox, by default, starts out a newly created VM with most of its available
    hardware disabled or not mounted. This is often the most stable and highest performing
    configuration for a VM. Each VM is equipped with RAM, video memory, a hard disk,
    and a network adapter.


    In this example, you''ll remove the network adapter for a VM.'
