    The server is a typical system used for File/Print services, mail, DNS, and web
    serving—a dual-core CPU, 2GB RAM, 80GB disk, rack-mountable system. It is priced
    at about $2,000, for a standard system. If you need RAID configuration plus drives,
    you can expect to add another $300–$500 USD. In the end, this “basic” system costs
