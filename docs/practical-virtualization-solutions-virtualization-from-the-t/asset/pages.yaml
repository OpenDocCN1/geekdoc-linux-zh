    My dad, who talked telecom at the dinner table all of those years and tried to
    spark my interest in routers and LANs, I was (half) listening back then, really.


    My mom, insisted I stuck out in the after-school computer science class, even
    though I was the only girl fighting for a seat in front of one of three Commodore
    PETs and claimed to have little interest in being.


    Jakob and Rebecca, it''s been a long year. I love you both. I am grateful for
    your patience and impatience during this time. Looking forward to more soccer
    games, having more playdates, and more leisurely evenings and weekends together.


    Eric, who still makes me laugh like no one else can and knows just what to say
    when everything goes wrong. Without your patience, support, understanding, and
    most of my confidence in and my abilities, this undertaking not have been possible.


    > —Amy Newman


    There are also several people whom else would like to jointly thank:


    Thank you Joe Brockmeier, Eli Dow, Jesse Keating, John Kennedy, Jeanne Matthews,
    and Jim Owens for your peer review of the manuscript, and Songlin Qiu, for making
    sure everything flowed properly and logically in the correct format. All of you
    challenged us, frustrated us, and at times irritated us, but it was all for a
    good cause and in the end, we came away with a better book.


    Thanks out to Michael Hall for reading the manuscript in close to one swoop to
