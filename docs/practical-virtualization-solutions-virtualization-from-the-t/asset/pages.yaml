    # WHITE BOX


    Historically, a large segment of companies, especially SMBs, did not buy their
    hardware from an OEM, but rather from a company that put together based on spec
    or prepaid options with parts from often unknown sources. Obviously, this was
    to save money. As the x86 market became increasingly commoditized, the price savings
    became negligible as the Big 3 in particular cut their price year after year.
    In early 2008, IDC estimated the white box market to be about 10 percent (www.servervarchar.com/trends/article.php?3729276).
    With the OEMs continuing to slash prices, it would doubt it will be the bright
    spot it once, even with Intel and AMD chips now powering of the servers.


    If you''re buying white box servers with the expectation that they will be idealized,
    bear in mind that you will probably not receive any hardware support it from the
    vendor. Nor will there be any hardware-specific software. Chip-level advantages
    will be there, assuming the chips are virtualization optimized.


    If that is not a concern, be sure that you don''t skip on memory and the I/O throughput
    benchmarks in line with the recommendations of all the major hypervisors and supporting
    software. It''s not enough for it to be compatible with the one you''re planning
    to use, because you don''t know for certain that you will be changing down road.
    It should be compatible with the major hypervisors, and you want some level of
    investment protection should you chose to upgrade the software.


    Beyond that, the usual caveats about reputability apply.'
