  md: '# CHAPTER 12


    # # Form-Factor Choices and Their Implications


    If you’ve recently bought new x86 hardware you can probably skip this chapter;
    chances it''s well suited for virtualization, and it''s also highly likely you''ll
    receive additional money for new equipment.


    If the servers you''re planning to visualize have hanging around since they were
    last used for Y2K, or if they were purchased in the dot-com boom, don''t even
    consider them except for test and dev for inconsequential applications. For all
    practical purposes, if you''re going to effectively implement a virtualization
    strategy (and by strategy, we mean anything more than ten boxes), hardware that
    came out in the past three years is in order.


    The adage stating there''s no such thing as a free lunch applies quite strongly
    here. If your organization opts to move forward with insufficient investment in
    hardware, whether it is using what''s on hand or buying the least-expensive hardware
    possible, bear in mind that you will likely pay down the road, and in areas beyond
    hardware. Don''t underestimate the potential cost of man hours necessary to troubleshoot,
    or personnel issues and lost sales due to potential downtime.


    This chapter looks in general at x86 form-factor choices, from towers and racks
    versus blades, sockets and cores and why they matter when it comes to virtualization.
    You''ll learn how to best determine your needs and how to ensure that you are
    setting up a scalable infrastructure. The subsequent chapter will take a general
    look at each of the major server vendors has to offer and where virtualization
    fits with their strategy. We also discuss cloud computing, which is a way to outsource
    the heavy lifting inherent in virtualization and one that is emerging as an option
    for cash strapped enterprises.'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'This is a fast-moving marketplace, so we have tried to be both general and
    cur- rent. Before making any purchases, we are sure to consult with the vendors
    to ensure that their offerings still comply with your needs.


    # TOWERS, RACKS, AND BLADES


    Three major footprint options exist for today''s servers: towers, racks, and blades.
    Some OEMs have comparable offerings across all three platforms, and some release
    to the various form-factor based on anticipated need. Numerous hybrid options
    also exist, such as Dell''s PowerEdge 2900 III, which Dell describes as a Rack
    Mount- Able, and some options don''t fall neatly into any other category. However,
    if you''re looking to visualize within an x86 environment, chances are you''re
    looking at one of these forms factor.


    All things being equal, blades are often touted as the most ideal hardware for
    virtualization, although the particulars of a given situation might dictate otherwise.


    Tower servers are the lowest end of servers, and in most cases are the least candidates
    for virtualization. A tower server occupies the same footprint as a desktop CPU.
    In some cases, especially for SMBs, it may be a repur- posed CPU, but more likely
    it was built specifically as a server. A tower server is well suited for test
    and dev or any other standalone virtualization endeavor because it''s easily moved
    and self-contained. On a virtualized network its advantages are few: It takes
    up more real estate than a server sitting in a rack or a blade chassis, and it
    adds an additional layer of complexity to the cabling and peripheral management.


    Thus, if your data center is typical, chances are that most of your servers sit
    in racks. A rack server takes up far less space than a tower server; it generally
    runs quieter and is easier to manage from a physical infrastructure perspective.
    The majority of servers in data centers are rack servers, and not surprisingly,
    or the newer servers with a respectable amount of pro-cessing power are designed
    that way.


    A rack server can be as small as four units (4U) high, but in a large data cen-ter,
    it is more typical for racks to go from floor to ceiling and can be partially
    filled because of power and cooling constraints or for scalability reasons. Within
    the rack, server size can occupy as one slot or as many slots as there are in
    the rack. A rack with slots for 42 servers, for example, can hold several servers
    that occupy two slots (2U), a server that is four units high, and one that is
    8U. The rest of the slots may be empty or contain similar configurations that
    fill all or part of the rack.'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# CHAPTER 12 Form-Factors and Their Implications


    The features that present a disadvantage for towers present an advantage for rack
    servers. Their modular nature results in less real estate being taken up, and
    cabling and other wiring is easily streamlined.


    The ProLiant DL 385, a rack server, is one of HP’s most popular offerings. In
    November 2008, the OEM released the fifth generation of the product, touting it
    as a particularly virtualization friendly offering. A large part of what makes
    the server so virtualization friendly has to do with the processor. It can contain
    up to two quadcore Shanghai Opon 2300 series processors, AMD’s 45 nm x86 processor
    built with virtual environments in mind. HP added some virtual bells and whistles
    of its own, Ethernet interconnects.


    Even more virtualization friendly than rack servers are blade servers. At their
    core, blade servers are slimmed down rack servers with streamlined componentry,
    making them easier to manage and maintain, and providing greater reliability.
    The biggest downside to blades is their lack of conformity. There is currently
    no compatibility among the vendors, HP’s BladeSystem in its own chassis and cannot
    integrate with IBM’s BladeCenter. Much noise was made about this earlier in the
    decade, but blades seem to have caught up despite the need for enterprises to
    standardize around a single vendor.


    If blades are basically slimmed down and rack servers, what is it that makes them
    suitable for virtualization? Their architecture, for one thing, because blades
    have fewer switches and cables to start, they can more easily adapt to virtual
    counterparts. They also take steps to resolve I/O issues at the hardware layer.


    The vendors saw this synergy on, and products are available to facilitate virtual
    machines (VM) running on a blade.


    Note, however, a VM running on a blade is not the same as a virtual blade. A VM
    on a blade is a VM that just happens to sit on a blade, whereas a virtual blade
    is virtualizing the blade as the whole. In most cases it is the software that
    makes the call.


    If you’re vacillating between racks and blades, investment is one factor to consider.
    The hardware vendors are putting more and more of their virtualization eggs in
    their blade baskets, so the options will increase with time. On the other hand,
    understand that whatever blade infrastructure you opt for will likely lock you
    in for the foreseeable future. If your company is already tied to a vendor, both
    the issue and the selection process are moot.


    One not so insignificant consideration when it comes to blades is their density.
    On one hand, they can pack a powerful punch into a small amount of space. On the
    other hand, the power they consume and the heat they give off must be taken'
  merge: -1
  pgno: 219
- img_proc: true
  md: 'into account. In some cases, the increase in computing power will outweigh
    the additional power and cooling requirements compared to rack servers delivering
    equivalent computing power. This is not always the case, however, be sure to take
