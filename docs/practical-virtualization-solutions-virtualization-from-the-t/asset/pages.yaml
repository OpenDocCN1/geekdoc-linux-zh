  md: '# Adding Hardware to a Virtual Machine


    Adding hardware to your VMs isn''t as easy as removing it but is made simpler
    with the use of the Add Hardware Wizard.


    +   1. To add a new device to your VM, click the Add button on the Hardware details
    screen.

    The Add Hardware Wizard launches and prompts you to click Next.

    2. Click Next to continue.

    The Hardware Type screen lists the various devices that you can add to your system,
    as shown in Figure 3-21.


    ![](img/2ed981e74b223133167333db66866d4d_63_0.png)


    +   3. Select USB Controller, click Next, and then click OK on the message screen.


    The message screen you saw after you added the USB controller describes how to
    power on the controller and use a USB device in your VM. The message appears in
    the Hardware details window as well when you select USB controller. See Figure
    3-22.


    The VM, when fully operational, will discover and install the detected USB device
    the same as if it were on a local physical machine. You can add multiple hard
    drives, Ethernet adapters, parallel ports, and serial ports, but you are allowed
    only one USB controller. A single USB controller can handle multiple devices.


    # Reconfiguring Virtual Machine Hardware


    VMs, even more than their physical counterparts, are dynamic entities. Rarely
    will you create or import a VM and not change any aspect of its hardware configuration.
    VMware Server allows you to change some hardware settings and attributes to match
    your needs.'
