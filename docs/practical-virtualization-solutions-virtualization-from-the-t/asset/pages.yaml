    with native performance. Kernel-level virtualization is extremely well suited
    for isolating applications from each other and the global (host operating system).
    This type of virtualization is an excellent choice for anyone who wants to get
    acquainted with virtualization for no money, little hassle, and ease of use. We
    highly recommend this virtualization method for your Solaris 10 systems.


    Microsoft Virtual PC and VMware Server are great choices for testing applications,
    services, patches, patch packs, and much more. We use Virtual PC and VMware Server
    on a daily basis and can live without them. We wouldn''t recommend either for
