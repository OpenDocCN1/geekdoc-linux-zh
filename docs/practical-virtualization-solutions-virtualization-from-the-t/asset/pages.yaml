  md: '# Acknowledgments


    My thanks go out to Jason Perlow for the use of his basement data center. He spent
    many long hours setting up infrastructure so that I would have access to VMware
    ESXi and Microsoft''s Hyper-V. Without Jason''s help, this book wouldn''t exist.


    Thank you to Amy Newman who graciously agreed to coauthor this book. She made
    it better with her fresh perspective and many years of experience in the virtualization
    space. She was a major force in making it a reality and taking it to completion.


    To my mom, whose passing ten years ago makes me wish I hadn''t been such a late
    bloomer.


    I wish to my children for putting up with me during the stresses and strains of
    another book. I''m sorry for the endless hours and loss of quality that accompanied
    this project. But now that it''s over, Daddy''s back.


    Thanks to my wife for her patience when I didn''t have any, her honesty when I
    needed it, and her prodding when I didn''t want it. Hi, honey, I''m home—finally.

    —Kenneth Hess


    My thanks to:


    +   - Kenneth Hess, for believing in me enough to take an unknown entity on board.
    It''s been quite a ride, and I''m grateful for every bump in the road opportunity
    has hit. In this case, what happened in Vegas certainly didn''t stay there!


    +   - Dan Muse, who nudged me to step up on the gearbox five years ago and allowed
    me to stay there when I finally started enjoying it.


    +   - Wesley Baker, Ryan Mackamson, Buddy Newton, Jameel Syeed, and the companies
    they represent, for agreeing to be part of the book and sharing with their experiences
    with virtualization.'
