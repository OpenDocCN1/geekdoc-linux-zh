  md: '# DEPLOYING SERVER APPLIANCES


    Related to dedicated virtual servers are server appliances. Server appliances
    are open source (usually) VMs created for a specific function. They are downloadable
    VM images that serve web database servers, blog servers, content management system
    application servers, and even file and print servers, to name a few. They are
    designed to be smaller and to perform a singular function, which makes them perfect
    candidates for projects that would otherwise require a physical system that would
    likely be underutilized.


    Server appliances are ready to use as soon as they are downloaded, unzipped, and
    opened in your virtualization software console.


    Table 9-4 lists some sites where you can download server appliances:


    | SITE NAME | URL | DESCRIPTION |

    |---|---|---|

    | Jumpbox | www.jumpbox.net | Open source server appliances |

    | ThoughtPolice | www.thoughtpolice.co.uk | VMware images of popular open source
    systems |

    | VirtualAppliances | www.virtualappliances.net | Offering specialized open source
    server solutions |

    | VMware | www.vmware.com/appliances | VMware and community server appliances
    |


    > SERVER APPLIANCES: A WORD OF CAUTION


    Server Appliances must be subjected to the same rigorous security sweeps and pruning
    as other servers. Don''t trust them just because they are prepackaged.


    # ADJUSTING AND TUNING VIRTUAL SERVERS


    The next item of business you''ll need to tackle for your dedicated VMs is adjusting
    and tuning. You''ll need to do this after the system has been up and running for
    a few weeks so that you''ll have a feel for baseline performance. You need to
    monitor performance with a performance-monitoring tool such as Orca (www.orcaware.com/orca).'
  merge: -1
  pgno: 168
- img_proc: true
  md: '# CHAPTER 9 Server Virtualization in Action


    Tools like Orca give you a continuous (hourly, daily, monthly, quarterly, and
    yearly) view into system performance. Not only can you keep an eye on performance
    peaks and valleys, you can also determine the best times for backups and maintenance.
    You''ll also know when to add more RAM, more disk, more CPU, or even another VM
    to share the load.


    So do you tune a VM? The answer is, “almost the same as a physical machine.”


    # RAM


    Adding RAM can be the easiest way to boost performance in physical and virtual
    systems. Your host system must have sufficient RAM for itself plus enough to run
    each guest efficiently and have room for growth. Often, but not always, adding
    RAM can refresh sluggish systems, RAM is a cheap commodity and it has the highestperformance
    boost per dollar of any performance enhancing adjustment. However, RAM is not
    always the culprit, as Chapter 12, “Form-Factor Choices and Their Implications,”
    will discuss, and adding RAM without knowing the root cause could have little
    impact.


    # Virtual Machine Add-ons or Tools


    Adding your chosen platform''s VM tools is often ignored as a performance-increasing
    tweak. After installation, before patching or updating, you should install the
    VM tools. Your overall experience with the VM''s performance will increase.


    Drivers in these tools and add-ons boost and optimize video performance, as well
    as enhance mouse performance and transitions between host and guest, and deliver
    time synchronization improvements between host and guest.


    # Virtual Disks


    Virtual drive configuration is also important. Stick with fixed-size virtual disks.
    Dynamic disks are nice to have, but you take a performance hit when using them.
    You can add more disk space by creating another virtual drive for your VM.


    # Virtual Machine Pagefiles and Swap Space


    Pagefiles and swap space should be configured as separate drives. This is a bit
    trickier on Windows systems because you''ll get full errors, although they can
    be turned off. A separate drive for swap space and pagefiles makes your run more
    efficiently because it has a separate drive to use for paging. Using a separate
    partition won''t help performance like it does with physical machines. Using'
  merge: -1
  pgno: 169
- img_proc: true
  md: 'than one drive for swap space also increases performance. Keep separate swap
    space drives to 2GB.


    # Host Machine Performance Tuning


    Some system administrators are disappointed with virtualization performance because
    they assume that purchasing a physical system for the VM host with lots of RAM
    and disk space is the key to happy VMs. You must build your VM host with virtualization
    in mind.


    # CPU


    These days most CPUs are designed with virtualization in mind—64-bit multi-processor
    host machines should always be used. A two-processor system is good for testing
    and initial deployment, but for production, you need to use (at a minimum) quad-processor
    systems. The host machine''s performance should also be monitored closely for
    these peaks and valleys. An overloaded host system will result in poorly performing
    guest systems. Chapter 12 discusses this in greater detail.


    # RAM


    With RAM consumption on the rise for applications and operating systems, there
    is generally no so much as too much RAM. Purchase and install the maximum amount
    of RAM for your host system.


    # Disks


    Drives and drive configuration are often overlooked as a potential performance
    bottleneck. Drives and configurations should be chosen with care. SCSI drives
    still outperform even the highest-end IDE drives. Purchase the fastest, widest
    transfer rate, highest cache drives you can afford for your host system. One of
    the biggest complaints against virtualization is sluggish disk I/O. VM disks will
    never perform like physical disks, but you can ensure that you have the optimum
    speed available by choosing high-performance drive technology.


    # Disk Configuration and Controllers


    Drive configuration is also very important to performance. The host operating
    system should be physically separate from any guest machines. Partitions are not
    good enough. You need to separate them physically on different drives and even
    different controllers.


    # Defragmentation and Optimization


    On Windows platforms, you should keep your drives defragmented. Fragmentation
    of drive, virtual or physical, kills performance. The built-in Windows defragmentation
    program is good for a start, but if you experience disk lag after defragmenting,'
  merge: -1
  pgno: 170
- img_proc: true
  md: '# CHAPTER 9 Server Virtualization in Action | 147


    get a third-party disk defragmentation and optimization utility. Use it for both
    physical and virtual systems.


    # Virus Scanning


    Disable virus scanning of your VM environment. You do not need to scan your virtual
    disks for viruses. Virus scanning performs a performance hit for virtual disks.
    If you feel compelled to scan the partition or disk where your VMs live, do a
    daily sweep of them just before you perform backups.


    # Server Dedication


    Your VM host system should be dedicated to the task of being a VM host with no
    other jobs. It should not be a mail server, a proxy server, and a file server
    all in one. Network traffic from your LAN—such as file copying, mailing, and disk
    I/O—has a negative effect on the host''s performance, which is reflected in each
    running VM.


    # Network Optimization


    Sharing NICs with the host or other VMs has a negative impact on network throughput.
    Dedicate a physical NIC to each VM where possible, especially where the VM is
    highly network traffic dependent (such as a web server, application server, or
    terminal server).


    # SECURING VIRTUAL SERVERS


    A common myth among those new to virtualization is that VMs are more secure than
    a physical system. You may have noticed that security is not listed as one of
    my reasons for using virtualization software in Chapter 1, “To Virtualize or Not
    to Virtualize?” Security was intentionally left out of that list because security
    isn''t a good reason to consider virtualization.


    If someone has physical access to a system, its security is compromised. Drives
    can be removed, systems can be rebooted, power can be switched off, cables unplugged.
    However, same is true for your VM host system. It is vulnerable to all those issues
    as a single point of failure for all VMs residing on it. Because physical security
    is roughly equivalent on physical and VMs, it is ruled out as an issue.


    Network security is a major vulnerability for physical systems. It is no less
    so on virtual ones. Why, you ask? Because each VM has at least one virtual NIC
    that connects to a physical counterpart on the host machine. Some malware writers
    are clever to find out if a system is virtual and, in turn, use that system to
    attack its own host and other VMs.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Block or Remove Services


    The removal and blocking of services and ports was discussed in the “Configuring
    Dedicated Servers with Virtualization” section. Following are some basic principles
    for blocking or removing services. To get started:


    +   - Remove services that are unnecessary to the system''s function.

    - Use a firewall to block all incoming traffic to your LAN.

    - Open firewall exceptions (holes) to provide incoming access to a service.

    - Regularly use a port scanner (security auditing tool) to monitor exposed ports.


    # Use Antivirus Software


    Use antivirus software on VMs as you would on physical ones. This statement isn''t
    in conflict with what I made earlier about turning off virus scanning for VMs.
    That referred to turning off scanning VM disk images with the host system''s antivirus
    software. It sound like a case of splitting hairs, but there is a difference.


    VMs must have their own antivirus running to prevent infections from outside sources.
    With antivirus software installed on each VM, there is no need to have the host
    server scan the VM files.


    # Perform Regular System Security Audits


    A system audit is not the same as a network sweep to find open ports, reneade
    services, or NICs in promiscuous mode. System audits involve checking the system
    for spyware, viruses, and malware of all kinds. It also includes checking accounts
    for violations of security policy.


    Any account with Administrator or root equivalent should be disabled. Unused accounts
    should be deactivated or removed completely. VM user accounts get overlooked by
    administrators who assume for whatever reason VMs are inherently secure.


    # VM BACKUP


    Backup and recovery strategies are as varied as political opinions and just debatable.
    Ultimately, the process you use depends largely on what you already have in place
    and the virtualization technology you''ve selected.'
  merge: -1
  pgno: 172
- img_proc: true
  md: '# CHAPTER 9 Server Virtualization in Action | 149


    Following are three basic backup strategies for VMs:


    +   - Backup of virtual disk files via file copy


    +   - Backup software running in the VM


    +   - Backup solution from virtualization vendor


    # File Copy


    Simple file copy is perhaps the easiest and most straightforward method of VM
    backup. You can copy live images on a UNIX/Linux host environment but not on a
    Windows one. On Windows, the VM must be powered off to make a copy, so if you
    use Windows as your VM host, you''ll have to find some other method of performing
    backups.


    With VMware, you can create a Snapshot of a live VM and a file copy backup of
    the Snapshot files. A Snapshot is an exact copy of the running VM at a particular
    point in time. It is a live backup. Usually Snapshots are taken before some significant
    event for the VM, such as applying a service pack or patch, installing new software,
    or removing software. Should something go wrong in the process, you can revert
    to the Snapshot. Reverting to the Snapshot restores the VM to the point at which
    was taken.


    Chapter 3, “VMware Server,” explained the following file types in detail.


    # Filename


    .vmsn – VM state file.

    <VM Name>-00000X-s00x.vmdk


    Where X is the Snapshot number and x is the disk image number. The disk image
    number corresponds to the regular disk image number.


    # VM Backup Software


    This method treats the VM like a physical system with its own installed backup
    software. The software copies selected files and folders to tape, network attached
    storage, or other media just as it would in a physical machine. This is the least
    efficient method of backing up VM data. Normally, you make a backup of an entire
    VM so it can be restored quickly to its productive state.


    # Vendor Backup Solution


    Most likely, your virtualization vendor can recommend a viable backup solution
    or has already provided one bundled with the virtualization software. Backup and'
  merge: -1
  pgno: 173
- img_proc: true
  md: 'restore modules may be included with the virtualization software or as an add-on
    for an additional cost.


    Check with your vendor for your VM backup solution. That solution is generally
    the safest and most reliable for its software. Mixing virtualization software
    and other virtualization backup solutions adds another level of complexity and
    multiple points of failure. You should consider it only when the vendor certifies
    your VMs can be backed up and restored in a reliable manner.


    # MIGRATING VMs TO NEW SERVERS


    What happens when your VM host system needs to be replaced? What do you do if
    you decide to change host platforms from Windows to Linux? What do you do if your
    VM host gets overloaded?


    The answer to these questions is in the topic—you migrate the VMs to new servers.
    Depending on your virtualization solution, this can be painful or of no consequence
    at all. Some virtualization vendors support only Windows or UNIX. Some virtualization
    solutions aren''t much more than placeholders for VMs with little or no extra
    support for migration or pooling.


    # File Copy Migration


    The most direct method of migration to a new VM host server (system) is to copy
    the VM to the new server. This is the same method used for direct backups. Copy
    the VM to the new server, open the virtualization software console, and import
    or open the copied VM. Your VM is migrated to a new host system.


    # Virtualization Software Migration


    If your virtualization supports moving VMs to a new host server, then employ it.
    Permissions, paths, identities, and the like will be migrated to the new system
    without the need for an import or manual intervention. The VM migrate to the new
    server without issue.


    Clearly, this is the best method, if available to you as a part of your virtualization
    solution, as an add-on, a third-party module, or as an external program. Using
    your virtualization software, you can move VMs that are powered off; in some cases,
    you can move a live VM to a new server.


    In the next section, you''ll discover ways to migrate physical machines to virtual
    ones.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# MIGRATING PHYSICAL TO VIRTUAL (P2V)


    Physical systems that are about to be replaced are perfect candidates for virtualization.
    You can migrate the entire system to a VM, test it with the physical system still
    intact, and then allow the workload to move to the VM when you''re satisfied with
    the results.


    # CD-Based P2V Migration (Cold Cloning)


    Traditionally, to migrate a physical machine to a virtual one, the physical system
    boots from a live CD and migrates to the virtual server host over the network
    via a conversion wizard. This is called cold cloning. The physical machine''s
    operating system must be offline so an image copy can be made of its disks and
    its contents. This is still a current method for converting physical machines
    to VMs.


    Although it''s not possible to demo a CD-based migration in a book, it is possible
    to offer an example of such a CD and explain the steps, as Figure 9-4 does.


    ![](img/2ed981e74b223133167333db66866d4d_175_0.png)


    FIGURE 9-4 The Xen bootable CD P2V initial conversion screen.


    The CD boots into a minimal operating system and prompts for source machine (physical
    machine), new VM, and target machine (VM host) information. Follow the onscreen
    prompts to begin the migration.'
