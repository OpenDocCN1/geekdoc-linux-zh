    needs on both fronts, nothing is wrong with using a product capable of pulling
    duty, especially because a virtualization deployment is never really “done.”


    For purposes of clarification, let''s assume automation kicks in some sort of
    autodiscovery mechanism is in place, and ESX, Hyper-V, XenServer, or whatever
    environment you have selected is installed on at one box, but in real life it
    would likely be more. Provisioning one server into four or eight or even 12 VMs
    is generally quite manageable, but provisioning 20 or 40 into four or eight 12
    VMs gets unwieldy real fast.


    When looked at from a visual perspective, as illustrated in Figure 16-1, the difference
    between one and two servers being provisioned into multiple VMs becomes even clearer.


    ![](img/2ed981e74b223133167333db66866d4d_282_0.png)


