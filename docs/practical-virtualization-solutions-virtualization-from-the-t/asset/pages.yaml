  md: '# CHAPTER 14 Beyond the Box


    Xframe V-NIC augments some of the capabilities of the virtualization vendors offer.
    "Passthru." is an emerging model providing much better support for high-speed
    I/O virtualization. It requires hardware to pick up the features being removed
    from the operating system. Xframe V-NIC brings the interchannel communication
    inside the ASIC. This, according to Neiteron, improves performance while providing
    true hardware separation and better protection between channels.


    The Xframe V-NIC family supports IPv4 and IPv6 as well as drivers for all major
    operating systems, including Windows, Linux, and Solaris. Stateless offloads,
    which maintain the integrity of TCP/IP implementations without "breaking the I/O
    stack," are supported too.


    # NextIO


    NextIO starts with the physical, but it describes itself as sitting at the opposite
    side of Neterion. Like Neiteron, however, NextIO also deals directly with the
    OEMs; its biggest partner is IBM.


    However, rather than latching between the hardware and the network, NextIO makes
    chips and software that transform physical-to-physical connections into a pool
    of virtualized I/O resources that can dynamically scale. Its Adaptive Connect
    platform is built around the PCI Express, making it compatible with pretty much
    all I/O connectivity options—Ethernet, Fibre Channel, T1/E1, and InfiniBand—as
    well as the remaining infrastructure, including software. In addition, NextIO’s
    architecture separates the CPU from the I/O in the server. This enables it to
    be upgraded or replaced as needed.


    # Xsigo Systems


    Xsigo Systems is becoming one of the best-known of I/O virtualization vendors.
    This is perhaps because of the deal it scored with Dell in February 2009 for the
    Xsigo I/O Director with its PowerEdge servers and storage solutions.


    Xsigo takes another approach to I/O management with its I/O Director offering.
    I/O consolidates the I/O infrastructure and replaces physical network and storage
    interfaces (NICs and HBAs) with virtual equivalents. Thus, instead of multiple
    I/O cards and cables attached to every server, servers are connected with a single
    cable and can be deployed on-the-fly. Users can create, migrate, and allocate
    virtual connectivity, virtual NICs, and virtual HBAs without physical recabling.


