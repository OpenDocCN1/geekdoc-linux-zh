  md: '# CHAPTER 4


    # VMware ESXi


    VMware is the steamroller in the virtualization space, ESX and ESXi are its flagship
    products, which are designed to manage huge virtual infrastructures. ESXi, the
    focus of this chapter, is an enterprise-level hypervisor product that VMware released
    as free to demonstrate the value of its products and how much money can be saved
    by using them.


    ESXi is a free product but is very different in scope and structure from VMware
    Server, which was covered in Chapter 3, “VMware Server,” ESXi, as mentioned previously,
    It requires its very own dedicated server system capable of supporting virtual
    guest machines. Currently, its hardware compatibility list is somewhat limited
    so you''ll have to install it on a system that complies with its requirements.
    Generally, you''ll need a 64-bit CPU (with virtualization extensions); dual, quad,
    or more core system with16GB RAM; and a few hundred gigabytes of disk space, ESXi
    supports a wide array of server-type hardware, don''t expect commodity hardware
    to suffice.


    The difference in ESX and ESXi is that ESXi is the hypervisor. There is no primary
    virtual machine (VM) or DomainOr, in VMware terminology, the service console.
    You need to use VMware''s Virtual Infrastructure Client (now known as VMware vSphere
    Client) to connect and manage ESXi and your VMs. As for ESXi works versus ESX,
    if you''ve seen ESXi through the eyes of the client software, you''ve seen ESX
    as well.


