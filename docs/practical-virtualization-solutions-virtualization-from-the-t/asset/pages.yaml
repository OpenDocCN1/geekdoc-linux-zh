  md: '# CHAPTER 3 VMware Server


    45


    At one point, two admins oversaw 150 servers. At the time of this writing, 85%
    of all systems are virtualized. All critical services are contained within 95
    VMs running on four Dell PowerEdge servers with 32GB of RAM. All four servers
    fit on a single 48-inch rack. Previously, four racks were needed. Not only does
    this save space, it also reduces power and cooling needs.


    The journey has not short. Over a ten-year period, the school has been using VMware
    products in some capacity. ESX has been in use for all four of those years. When
    ESXi arrived on the scene, some admins opted to stick with ESX because of its
    disaster recovery and high availability capabilities. A migration to vSphere is
    in the works, however.


    This story, although interesting, is all too familiar. What is fairly unique is
    the school is fitting VMware Server into its environment, demonstrating how the
    largest of enterprises can benefit from this offering.


    VMware Server is a free solution. But so is ESXi, and VMware Server is not anywhere
    as optimized for a server environment as ESXi. Even VMware does not position it
    as a solution for production environments.


    In fact, the very name VMware Server is a bit of a misnomer. As noted at the beginning
    of this chapter, the product’s roots go back to the workstation space. Later,
    when VMware (the product) was renamed VMware GSX, it found its way into the server
    realm. Although it remains adequate for a few boxes, it is not robust enough for
    a server environment with anything more than the most basic of needs.


    For complex workstations, it is a different story entirely, and that is where
    the school has found it valuable.


    The school supports the computing needs of faculty, staff, and students who are
    teaching or enrolled in computer science, computer engineering, and entry-level
    computer science required on electrical engineering. Many of these classes are
