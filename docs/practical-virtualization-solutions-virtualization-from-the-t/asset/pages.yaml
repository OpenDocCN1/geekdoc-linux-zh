- img_proc: true
  md: '# CHAPTER 17 Postproduction: Wrapping It Up


    fact, having a VM fail over to another VM is a perfectly acceptable solution and
    is the tip of the iceberg as far options (and advantages) go. In addition to VM
    to VM failover, there is physical to virtual failover (a box down and the entire
    box fails over to a VM on another server) and virtual to physical (a VM goes down
    and fails over to a dedicated box).


    This is a fairly easy way to achieve the high availability that network managers
    crave and for the most part require. However, to really reap the advantages and
    to have the sought-reliability, bear two things in mind: First, same redundancy
    that is in place for physical servers must also be in place for VMs, and second,
    if you opt to fail over another box, that box must be the same caliber as the
    original.


    The latter is particularly critical in situations where the hardware goes down.
    Although virtualization does not alter the inherent principles of disaster recovery,
    it places more eggs in fewer baskets, so an effective strategy means the VMs must
    be more cushioned and locked down. Suppose, for example, a NIC fails on a server
    running 16 VMs. Now, the equivalent of 16 servers has gone down. When your disaster
    recovery plans, you must think in terms of protecting 16 servers, not one, which
    means the box you plan to fail over is capable of handling each the 16 VMs as
    the one that went down.


    Thus, when you reach the point that important, if not mission-critical, applications
    are running on VMs, it is vital to consider each VM the equivalent of a dedicated
    box for disaster recovery purposes.


    Disaster recovery touches on a number of areas previously covered, mainly related
    to storage. Backup, automation, and monitoring all play into your disaster recovery
    plan. These tools will by large determine the plan that is in place, so it is
    important to be somewhat cognizant of the plan you ultimately want when you are
    picking these tools. How redundant your systems are or how retrievable your backup
    makes a difference in your uptime.


    At this point, nearly every standard disaster recovery tool accommodates virtualization,
    but you are also getting the end-to-end protection you need, and a number of vendors
    have stepped in to fill the gap between the traditional storage and security vendors
    and the unique needs of VMs. Those differences are primarily their portability
    (that is, VMotion''s capability to move a VM from one box to another) and inherent
    sprawl, which can make backing up each VM inefficient.


    A number of solutions have sprouted up to mitigate this issue. "Snapshotting"
    appears to be evolving into the technology of choice. Snapshotting technology
    exactly what its name implies—it takes a snapshot of a data set at a particular
    point in time that can be used, if needed to restore the down root. It is replicationbased
    technology that consumes minimal overhead regardless of whether it is performed
    at the hardware, application, or system level.'
