  md: '# CHAPTER 10


    # Desktop Virtualization in Action


    Server virtualization is not the only virtualization option. Virtualizing the
    desktop is another popular endeavor in the world of virtualization. Desktop virtualization
    has been around for decades. Previously, it was referred to as terminal services
    or thin-client computing. It is also where VMware and Microsoft cut their virtual
    teeth.


    Desktop virtualization, briefly, is moving a traditional desktop operating system
    from local hardware to a remote server system. The remote desktop is accessed
    by utilizing some lightweight client in the form of a small or minimal operating
    system (smart terminal) or a dumb terminal that has only enough programming to
    inform it of the whereabouts of the desktop.


    Desktop virtualization is attractive to enterprises because it promises to minimize
    costs associated with managing hundreds or thousands of desktop computers, operating
    systems, patches, software, and user support issues. The unfortunate truth is
    that, depending on the way desktop virtualization is implemented, the cost savings
    may disappoint all the most pessimistic onlooker.


    This chapter examines several methods of desktop virtualization and describes
    how each is implemented. The pros and cons of each solution are discussed so that
    when the time comes to put a project plan together, you can make an informed decision
    and have a smoother transition to virtualized desktops.


    # Terminal Services


    Terminal services, the oldest type of desktop virtualization, still may be the
    best all-around solution available for most applications. The speed, centralized'
  merge: -1
  pgno: 185
- img_proc: true
  md: 'management, lack of specialized or extensive user training, and overall user
    satisfaction may be hard to beat by other forms of desktop virtualization.


    You may recognize the term terminal services from Windows Terminal Server and
    Windows Terminal Services, but the concept and the practice prefers Windows by
    a decade or more. Terminal services are server systems with terminal services
    enabled. The terminal server may be UNIX, Linux, or Windows. The desktop experience
    you receive depends on the terminal’s operating system. You can''t get a Linux
    desktop from a Windows Terminal Server, nor can you get a Windows desktop from
    a UNIX or Linux Terminal Server.


    After you connect to a terminal server, your user experience depends largely on
    the administrator who set it up and any corporate standards that may be enforced.
    For a Windows Terminal Server, you''ll see a standard Windows desktop with the
    familiar look and feel of a standard Windows desktop operating system. The behavior
    of desktop, applications, and printing are as if if you were using a local computer.
    More often than not, users report that the terminal server is far faster than
    their old desktop computer, and they are quite pleased with the perceived upgrade.


    # Smart Terminal


    A smart terminal is a minimal computer equipped with a minimal operating system—perhaps
    even an embedded one. A smart terminal has limited processing power because its
    job is to connect you to a remote server system. The operating system is graphical
    and has a small number of icons or hyperlinks that you can use to connect to different
    resources.


    Smart terminals connect to Terminal by some protocol—Citrix ICA, RDP, VNC, XDMCP,
    and the like. Users, after authentication, are presented with a desktop and all
    the applications they would see if they had logged on to the remote system. Remote
    terminal services are very fast and efficient for the end user. Modern Terminal
    Servers can even redirect sound to the user’s terminal for an almost local desktop
    experience. Video quality is very high—24-bit color is standard.


    Prices for such hardware are falling while functionality is ever increasing. You
    can purchase smart terminals for about the same price as a low-end desktop computer.
    The terminal has fewer moving parts and has a longer life expectancy than a standard
    desktop computer.'
  merge: -1
