    The ongoing costs of virtualization are typical IT costs (for example power and
    cooling, and licensing). Unfortunately, because of the nature of virtualization,
    attributing these costs to a department gets dicey. Short of measuring compute
    units in very small time increments, there are few options at this to directly
    attribute them. VMware recently released vCenter Chargeback is a major step toward
    resolving this thorny issue. Chargeback uses an algorithm that takes into account
