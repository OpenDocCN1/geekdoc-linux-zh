    my experiences; they may be biased, and, as always, may sway you.


    For true Enterprise-ready virtualization, you cannot beat Xen or VMware ESX. They
    are robust, easy to use, well documented, and ready to go for work. Hypervisor
    technology is absolutely the right decision if you need to virtualize multiple
    operating systems on one host system. They are both costly solutions but worth
