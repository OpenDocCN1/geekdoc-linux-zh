  md: '# Practical Virtualization Solutions


    Center, and IBM''s Tivoli Monitoring suite all offer end-to-end solutions. Independent
    players in the mix include Uptime Software and Vizicore.


    Monitoring tools keep an eye on three basic functions: server operations, server
    traffic, and the results of server use (for example, keeping logs, statistics,
    and analysis). Drilling down further, monitoring tools make sure the physical
    hardware is operating as it should (temperature, power supply and components);
    server performance as intended (CPU usage, available disk space, memory availability,
    and in some cases VMs) is as intended; (DNS, POP3, and TCP) are operational and
    network functions are operating how they are supposed to.


    Not unsurprisingly, all the OEMs offer monitoring tools. Although these tools
    by and large are comprehensive, they are limited to the OEM''s hardware. Therefore,
    an enterprise with a heterogeneous data center (which is to say much any data
    center) will find itself somewhat constrained by these offerings, and more likely
    to come up with a patchwork of solutions.


    There are myriad tools out there, and not every tool covers every task. As in
    automation and autodiscovery space, if you have a suite that meets your needs,
    the most cost-effective strategy will be to see if a monitoring module is in place
    and confirm that it has VM monitoring capabilities. If not, an updated module
    should be purchased. If no management suite is in place or the virtualization
    capabilities are not up to snuff for your needs, consider standalone products
    that hook into your management suite.


    The chief advantage of adding a monitoring tool to the mix is that it can cut
    to the heart of the problem, instead of addressing the symptoms. For example,
    if a cable is unplugged in the data center, an automation tool is likely to flag
    that a data transfer was unable to be completed, whereas a monitoring tool will
    either flag a server as down or alert the admin that the cable is down.


    Organizations on a tight budget may find themselves forced to choose between autodiscovery,
    automation, and monitoring tools. In many cases, the monitoring tool is the most
    critical, or at least minimal autodiscovery and automation functionality can be
    found in the virtualization environment itself. Even the small data centers that
    can get by automation and have a solid understanding of their resources need to
    know when a server or other device in the data center goes down.


    Which brings us to the next postdeployment issue: disaster recovery.


    # DISASTER RECOVERY


    Improved disaster recovery is an oft-cited reason for virtualizing. From a big
    perspective, it makes sense: A VM goes down and the application and data fails
    over to another VM, either on the same box or to another server on the network.'
