  md: "# CHAPTER 2 Comparing Virtualization Technologies\n\n# KERNEL-LEVEL\n\nKernel-level\
    \ virtualization is kind of an oddball in the virtualization world that each VM\
    \ uses its own unique kernel to boot the VM (called a root file system) regardless\
    \ of the host's running kernel.\n\n# KVM\n\nLinux KVM (Kernel Virtual Machine)\
    \ is a modified QEMU, but unlike QEMU, KVM uses virtualization processor extensions\
    \ (Intel-VT and AMD-V). KVM supports a large number of x86 and x86_64 architecture\
    \ operating systems, including Windows, Linux, and FreeBSD. It uses the Linux\
    \ kernel as a hypervisor and runs as a kernel loadable module.\n\n# User-Mode\
    \ Linux\n\nUser-mode Linux (UML) uses an executable kernel and a root file system\
    \ to create a VM. To create a VM, you need a user-space executable kernel (guest\
    \ kernel) and a UML-created root file system. These two components make up a UML\
    \ VM. The command-line terminal session you use to connect to the remote host\
    \ becomes your VM console. UML is included with all 2.6.x kernels.\n\n# SHARED\
    \ KERNEL\n\nShared kernel virtualization, also called operating system virtualization\
    \ or system level virtualization, takes advantage of the unique ability of UNIX\
    \ and Linux to share their kernels with other processes on the system. This shared\
    \ kernel virtualization is achieved by using a feature changed root (chroot).\
    \ The chroot feature changes the root file system of a process to isolate it in\
    \ such a way as to provide some security. It (chroot) is often called a chroot\
    \ jail or container-based virtualization. A chrooted program, set of programs,\
    \ or entire system in the case of shared kernel virtualization is protected by\
    \ setting up the ch system to believe that it is a standalone machine with its\
    \ own root file system.\n\nThe chroot mechanism has been enhanced to mimic an\
    \ entire file system so that an entire system can be chrooted, hence creating\
    \ a VM. The technical advantages and disadvantages of shared kernel virtualization\
    \ are listed next:\n\n+   - Advantages\n  - Enhanced Security and Isolation\n\
    \  - Native Performance"
