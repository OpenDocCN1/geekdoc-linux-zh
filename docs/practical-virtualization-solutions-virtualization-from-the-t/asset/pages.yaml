  md: "# File and Folder Security\n\nAny serious virtualization solution will be installed\
    \ on a server, and an administrator will most likely install software such as\
    \ VPC. An Administrator’s My Documents files are not accessible to other system\
    \ users; therefore, the definition files are protected by design.\n\nAll VM disk\
    \ files should be placed in a parent folder that only the Administrator can access.\
    \ All folders under the parent inherit permissions.\n\n# File Names and Roles\n\
    \nThe VM definition file that resides in the Virtual Machines folder is an XML\
    \ file that describes all the attributes for a VM. The file is plain text and\
    \ is editable by any text editor. The entire contents of the file are too long\
    \ to list here, but Listing 6-1 offers a glimpse with an excerpt from our sample\
    \ VM.\n\nGenerally, only two type of files are associated with any VM: the VM\
    \ and the VHD files.\n\n+   - <VirtualMachineName>.vmc—The VM configuration (vmc)\
    \ or definition file\n- <VirtualMachineName>.vhd—A virtual disk file associated\
    \ with a specific VM\n\n> LISTING 6-1 Excerpt from Virtual Machine Definition\
    \ File: Fedora_XCFE.vmc\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-16?>\n<!--\
    \ Virtual Machine Options and Settings ->\n<preferences>\n  <version type=\"string\"\
    >2.0</version>\n  <alerts>\n    <notifications>\n      <no_boot_disk type=\"boolean\"\
    >true</no_boot_disk>\n    </notifications>\n  </alerts>\n  <hardware>\n    <memory>\n\
    \      <ram_size type=\"integer\">256</ram_size>\n    </memory>\n    <pci_bus>\n\
    \      <ethernet_adapter>\n        <controller_count type=\"integer\">1</controller_count>\n\
    \        <ethernet_controller id=\"0\">\n          <virtual_network>\n       \
    \     <id type=\"bytes\">A39ED046A0C11DB8225AEB79EA38CC0</id>\n            <name\
    \ type=\"string\">SIS 900-Based PCI Ethernet Adapter</name>\n          </virtual_network>\n\
    \        </ethernet_controller>\n      </ethernet_adapter>\n    </pci_bus>\n \
    \ </hardware>\n</preferences>\n```"
