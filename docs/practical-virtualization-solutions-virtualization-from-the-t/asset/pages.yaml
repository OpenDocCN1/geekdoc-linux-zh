    # UNDERSTANDING CORES AND SOCKETS


    Despite these differences, for the most part, the processor itself is a commodity
    in the x86 server selection process. Although knowing this information will better
    facilitate the purchasing process, it will neither make you break any you in the'
  merge: -1
  pgno: 222
- img_proc: true
  md: '# CHAPTER 12 Form-Factor Choices and Their Implications


    big picture so long as it is present. The processor, however, is not entirely
    irrelevant. In fact, the most bang for the virtualized buck is achieved by taking
    advantage of multicore processors. Systems powered by multicore are the standard
    days. In the less than five years multicore appeared on the x86 system, it has
    become all but impossible to find a single-core server. In fact, in 2008, no new
    single-core servers were released.


    Until virtualization took center stage, new versions of processors—and to some
    degree the hardware in which they sat—were by and large all Moore''s Law (as defined
    by the website Webopedia, Intel coofader Gordon Moore''s 1965 observation “the
    number of transistors per square inch on integrated circuits had doubled every
    year since the integrated circuit was invented” and would continue to do). For
    a time it appeared that the hold of Moore''s Law was slackening, and then multicore,
    and with that socket, on the scene. This enabled chip manufacturers and OEMs (as
    well as VARs) to continue to wax poetic over processor power. And now they could
    cook up additional benchmarks to subsequently outstrip the number of cores and
    processors continues to increase.


    Obviously, the OEMs picked up on this, and frequently the number of cores and
    sockets a chip—and, hence, a server—has been used as brigging points and for increasingly
    faster and higher benchmarks.


    Dual-core processors, which were not long ago heralded as revolutionary, are quickly
    becoming passé. According to the website Webopedia, dual core refers to a CPU
    that includes two complete execution cores per physical processor. It combines
    two processors and their caches and cache controllers onto a single integrated
    circuit (silicon chip). Each execution core has an independent interface to the
    processor''s front-side bus.


    Multicore takes it further. As Webopedia notes, a single physical processor contains
    the core logic for two or more processors. The processors are then packaged into
    a single integrated circuit known as a die. To make things even more confusing,
    multicore can also refer to multiple dies packaged together.


    Each core has its own cache, theoretically providing the operating system with
    sufficient resources to handle compute-intensive tasks in parallel. In practical
    terms, multicore''s chief value proposition for data centers is performance.


