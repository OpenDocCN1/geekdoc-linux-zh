    # VIRTUAL MACHINE FILES AND FOLDERS


    The default location for VM virtual hard disk files is covered in your chosen
    for your VMs. For example, D:\VM, as shown in the previous section, is the repository
    selected when building the VM.


    # File and Folder Security


    Security on files and folders in Hyper-V is standard Windows security. The VM
    files are owned by Administrator or by the user that creates the VM.


    # File Names and Roles


    Hyper-V virtual hard disk files are named with the same convention as Virtual
    hard disk (.vhd) files. Unlike Virtual PC (covered in Chapter 6), Hyper-V doesn''t
    make use of the VM configuration (.vmc) files. Instead, it uses cryptically named
    XML files to hold the VM configuration information.'
