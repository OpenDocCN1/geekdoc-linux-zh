    to vCenter and a VMware infrastructure is a viable option. In general, however,
    these are not identifiable as a department or cost center. The clearest and most
    effective way to break them down is to treat them as centralized (also known as
    an indirect cost) of the business.


    A new and separate cost center within the IT budget should be created We will
    refer to it as Virtual Cost Center. Part of the costs should be capitalized and
    depreciated over the life of the servers (generally a five year time frame, although
    often is kept in use longer), whereas other costs should be expensed. As these
    expenses are incurred, they would be expensed directly in the Virtual Cost Center.


    Costs associated with the Virtual Cost Center can then be pushed down to individual
    departments through a weighted average based on compute usage. High-volume storage
    areas, like finance, should receive a heavier weight than a manufacturing plant,
    for example.


