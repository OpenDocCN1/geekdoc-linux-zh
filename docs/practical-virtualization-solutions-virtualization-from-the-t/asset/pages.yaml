- img_proc: true
  md: '# Practical Virtualization Solutions


    We speak with a wide spectrum of virtualization, and are increasingly in recent
    months nearly all of them confirm a lack of planning from many of the enterprises
    we work with. Planning may not seem glamorous, and it may be tedious, but it will
    save you a lot of money and headaches down the road. Not only does a lack of planning
    have the potential to set you down the wrong path (resulting in unnecessary expenses
    for both the present and future), but it also opens up to security vulnerabilities,
    server failures to overload, and additional human error.


    # SELLING SENIOR MANAGEMENT ON VIRTUALIZATION


    You may have sipped the virtualization Kool-Aid and been beyond your wildest dreams
    by what you saw in test and development. Perhaps you''re envisionizing your enterprise
    from the receptionist''s desktop through the most mission-critical server.


    Slow down, a breath, and think carefully.


    Remember that this needs to be sold to the CTO or CIO and that, most likely to
    the CFO. You probably understand the fundamentals of what''s involved, why it''s
    important, and how it will help you do your job better. The CIO probably does
    (or at least should) understand the technology, it''s doubtful the CFO does—or
    the merits of virtualization will need to be explained in terms of how it will
    bring value to the company.


    In today''s economic climate, saving money is a key driver. Virtualization will
    save money in both the short and long term, but only if it is implemented properly,
    and that means thinking about more than you''re going to take advantage of Hyper-V
    on your boxes running Windows Server 2008 or 2003 a free copy of ESXi from VMware.


    In other words: What will it cost? How will it save the company? And how long
    before a return on investment (ROI) is realized? Presenting ROI is always tricky;
    at best it''s an estimate and often little more than a guess with some prediction.
    The more you know, however, the more accurate your numbers will be.


    Table 15-1 lists examples of potential costs and savings for a virtualization
    endeavor. We''ve left room to join down the amounts. To determine the ROI, divide
    the amount saved by the amount spent.


    # TABLE 15-1 ROI–Costs and Savings to Consider


    | COST | AMOUNT SPENT |

    |---|---|

    | New equipment | |

    | Training | |'
  merge: -1
  pgno: 264
- img_proc: true
  md: '# TABLE 15-1 Continued


    | COST | AMOUNT SPENT |

    |---|-|

    | Software (including the virtualization environment itself, autodiscovery tools,
    and management tools) | |

    | Savings | Amount Saved |

    | Power | |

    | Licensing costs | |

    | Real estate | |


    Note that reduced headcount and security are not listed as areas of potential
    savings. Visualization will not save you in those areas. Fewer boxes in this case
    does not mean less to manage. Does it mean you get a pass on security. Security,
    as noted previously, becomes even more important.


    In the end, the final cost may not bear any resemblance to the initial projections,
    but having a sense of what it will cost and what it will save in an ideal situation
    will give everyone numbers to begin working with to figure out how to maximize
    ROI.


    As appealing as it would to present virtualization as pure savings, in many cases
    would be disingenuous. Sure, you could slap Hyper-V on that Compaq server that''s
    been sitting since before Compaq was of HP, and it may be tempting, don''t. That
    hardware wasn''t designed for a virtualized infrastructure, and it probably cannot
    handle most of today''s workloads or the software to run it.


    When calculating costs, if the hardware you''re planning to virtualize is more
    than three years old, do yourself a favor and budget for new hardware. This may
    make for a tougher sell (and for a far lower ROI), but you have a better chance
    of getting the results you''re after, and in the end you will deliver a better
    return. Also bear in mind that although there is no way to work it into the ROI
    numbers, you would theoretically be buying fewer servers with higher utilization
    rates, which means in the long run your spending will be less.


    Another approach to a virtualization strategy is to approach it from the opposite
    side: If your organization is in the process of a hardware refresh, tack virtualization
    on will likely require only a light touch. Much of the hardware released in the
    past year has been designed to be virtualized, and anything multicore is worthy
    of more review.


    If new hardware is being purchased, it''s best to piggyback virtualization strategy
    onto that to ensure the hardware and software will be in sync. Because Part 3'
  merge: -1
  pgno: 265
- img_proc: true
  md: 'examined hardware closely, we will not factor it into the planning process
    here we will instead assume multicore, x86-based systems running Windows or Linux
    with sufficient processing power, disk capacity, and memory to support any of
    the three major hypervisor environments that are either on hand or being purchased.


    # VIRTUALIZATION BENEFITS BEYOND COST SAVINGS


    Let''s assume you''re one step closer to making your virtualization dreams a reality:
    The CFO begrudgingly bought in, and the CIO is excited at the prospect of freeing
    up some boxes and clearing some space in the data center. Going virtual is either
    one component of a hardware refresh or an initiative in its own right with some
    hardware being purchased. Again, don''t even think about downloading ESXi, popping
    a few corks, and going home, especially without some sort of buy in your senior
    management.


    Before deciding what to virtualize, consider your goals: consolidation, disaster
    recovery, efficiency, or a combination. Yes, cost savings is a goal, and in many
    cases a tremendous benefit, and it is probably what you got the sign-off in the
    first place. Focus too much on it, however, and could mean that you will not receive
    the additional support necessary for a successful deployment (as as new hardware
    or management tools) down the road. "Green computing" has been in the spotlight
    lately, but even the eco conscious enterprise is cost conscious, so environmental
    soundness will not win on its own virtue. If you can tie green to cost savings
    (and over the long term, the savings does indeed bear out), then it makes sense.


    Also bear in mind that if saving money is what earns your senior management buy-in,
    from an IT perspective, it should not be looked upon as the only driver. Some
    level of spending will also be necessary in any strategy for it to be sound. As
    we''ve been saying from the beginning and can emphasize enough: Don''t assume
    that just Hyper-V is free that you can load underutilized servers—or worse, servers
    sitting around since the boom—and you will incur software costs, and the larger
    the deployment, the higher they will be.


    If your organization is tightfisted to the degree that "saving money" is the only
    way to get sign-off, consult Chapter 1, "To Virtualize or Not Virtualize?" for
    a concise rundown of ways in which virtualization will save money. When preparing
    the all-important official proposal for senior management, be sure to highlight
    benefits that are quantifiable in terms of money saved and pinpoint technological
    goals. Examples include the following:


    +   - Fewer boxes consume less real estate, which means the data center requires
    less square footage, freeing up X% of space.'
  merge: -1
