  md: '# CHAPTER 11


    # Network and Storage Virtualization in Action


    This chapter covers network and storage virtualization from a 10,000-foot view,
    as far as the details and definitions are concerned. From a virtualization strategy
    point of view, however, we''re going in for a fly-by. Not every network needs
    a VPN, VLAN, leveraged storage device, or some of the other components discussed
    here. For those that do, this information will help you implement them successfully.


    Other concepts presented in this chapter don''t lend themselves well to physical
    demonstrations, or sufficient information can be found elsewhere to illustrate
    certain points. Those concepts we will observe and navigate past.


    # VIRTUAL PRIVATE NETWORK (VPN)


    VPNs have been around for some time now and are still the accepted method to connect
    remote users and remote offices to a central office network. VPNs are secure and
    efficient by nature and require minimal setup for server and client systems alike.
    Setting up a VPN server as a VM is desirable from a financial, administrative,
    and security standpoint.


    Because a VPN server incurs almost no overhead, you can use a virtual appliance
    that is dedicated to the job of authenticating users and granting access to specific
    resources. Some VPN virtual appliances use as little as 100MB of disk space and
    40MB of RAM. There are several ways to implement a VPN service for your network,
    involving either hardware or software.'
  merge: -1
  pgno: 199
- img_proc: true
  md: '# Hardware VPN


    A hardware VPN solution involves the purchase and setup of hardware devices to
    create your VPN solution. VPN routers available through several vendors allow
    you to plug in the device on your network, configure it via a web browser or utility,
    and grant access to network resources.


    On the lower end of the VPN device spectrum, you might spend around $175 USD for
    a 30-user VPN router. Higher-end devices will cost several thousand dollars (USD)
    but the features, support, warranties, number of users, and product life are greater.


    A hardware VPN solution can be a good solution for remote users and remote office
    connectivity to a central office. The disadvantages of hardware VPN are costs
    and administrative overhead—including training for administrators and time for
    configuration and maintenance. Each branch office will need its own VPN device
    for remote connectivity; single roaming remote users will not. This section''s
    discussion will focus on software VPN services.


    # Software VPN


    Software VPN solutions are less expensive than VPN server systems but are no less
    cumbersome to set up than their hardware counterparts. The greater advantage of
    software VPNs is recovery time. Restoring a VPN virtual machine (VM) requires
    only a few minutes of time, whereas a hardware VPN solution repaired and back
    online may take days or weeks unless you purchase a service contract through the
    vendor, which adds considerably to the cost of the device.


    Setting up a VPN server VM with Windows 2003 Server is a simple process. The following
    steps guide you through creating a VPN service and then connecting a Windows XP
    client to the server via VPN.


    > NOTE

    Before you begin this setup, you''ll need two Ethernet connections configured
    for the VM. One must be connected out to the Internet or to a firewall that is
    Internet connected. The second Ethernet connection must be configured to access
    the internal network of interest for the VPN. The wizard sets up routing services
    and configuration as you go through it.'
