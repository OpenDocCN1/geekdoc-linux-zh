  md: '+   1. Use cross-functional teams to plan out the ideal virtual infrastructure.


    +   2. Inventory and assess hardware, and purchase if needed.


    +   3. Examine processes and applications to determine which are better suited
    for virtualization and decide which virtualization environment to use.


    +   4. Send likely candidates to a test and dev environment for evaluation.


    +   5. Install VM-friendly autodiscovery tools and select production hardware.


    +   6. Install and configure automation and security software.


    +   7. Install virtualization software on the live machine, and push VMs from
    test and dev to the live server via lab management software.


    +   8. Use automation tools to begin facilitating the management of the virtual
