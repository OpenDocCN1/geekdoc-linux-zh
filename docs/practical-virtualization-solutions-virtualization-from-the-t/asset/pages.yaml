  md: '# CHAPTER 7


    # Microsoft Hyper-V


    Hyper-V is Microsoft’s entry into the server virtualization space. Its desktop
    virtualization product, Virtual PC (covered in Chapter 6, “Microsoft Virtual PC”),),
    has enjoyed widespread success but can’t compare to a server-based hypervisor
    product. Hyper-V is, as the name implies, a true Windows-based hypervisor. You’ll
    need a dedicated, 64-bit, multicore processor, high-capacity server system on
    which to install it. Windows 2008 ships Hyper-V ready.


    Hyper-V should prove to be a formidable player in the server virtualization market
    because it includes native support for Windows virtualization. It is a typical
    Microsoft application in it is easy to use, intuitive, and has native hooks into
    the Windows operating system.


    # The CONSOLE


    The Hyper-V console (shown in Figure 7-1) is your single interface for creating
    and managing virtual machines (VM). To open the Hyper-V Manager, Click Start,
    Programs, Administrative Tools, Hyper-V Manager.


    The console (Hyper-V Manager) is where you manage (create, edit, delete) your
    VMs and is your interface to the consoles of your VMs. VMs, correctly configured,
    can be accessed via network protocols (SSH, Terminal Services, HTTP). In the next
    section, you’ll learn how to create a VM.'
  merge: -1
  pgno: 127
- img_proc: true
