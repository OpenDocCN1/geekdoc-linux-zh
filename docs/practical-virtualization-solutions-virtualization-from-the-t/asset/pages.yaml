  md: '# CHAPTER 15 Laying the Foundation: The Planning Stage 247


    # TYPES OF PLANNING TOOLS


    If only it were a case of all discovery tools setting out to discover the same
    thing. That would, of course, make it easier to compare one to the other, but
    many discovery tools are out there. For the most part, available tools provide
    the following:


    +   - Infrastructure assessment

    - Process assessment

    - Network assessment


    In some cases, the capabilities overlap. Two companies in this space are worthy
    of note are CirBA and Reflex Systems. Both ISVs have been in this space for a
    while and offer assessment solutions. CirBA was founded in 1999, with the aim
    of easing the pain associated with consolidation, the constant solution of server
    sprawl, which was rampant at that time. This makes it well suited for virtualization
    endeavors, even those not necessarily planned around consolidation.


    Its Advanced Analytics Engine is designed to be used before the consolidation
    gets underway. It pulls in audited server workload data from any agent or agentsource.
    Figure 15-1 provides an example of how the data is presented. After the needed
    information is imported, the software runs a host of algorithms to analyze and
    determine possible configuration conflicts based on everything from operating
    system and platform incompatibilities, workload patterns (for example, CPU utilization,
    and network and disk IO) and business constraints (geography, business service,
    or maintenance windows). It makes recommendations for virtualization and other
    consolidation endeavors.


    What''s particularly unique about CirBA''s solution is how it presents the data.
    The results are displayed, color-coded, on grids and are given scores indicating
    which servers are compatible with which potential conflicts it has assessed. The
    maps can then be broken out based on the type of constraint and overlaid for a
    cumulative picture. They can also be modified and reevaluated to illustrate possible
    changes. This enables you to see workloads would be in varying degrees of conflict
    and which consolidate nicely.


    Perhaps the biggest downside of Advanced Analytics Engine is that it is purely
    a reporting tool. So you are on your own for the rollout. The software is meant
    to be used throughout the life cycle of a deployment, so you can run it as often
    as you see fit to determine that no new inherent conflicts might be brewing.'
