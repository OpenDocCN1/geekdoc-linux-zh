- img_proc: true
  md: '# CHAPTER 15 Laying the Foundation: The Planning Stage 243


    +   - Consolidating workloads X% will result in power savings of Y% (your data
    center''s power reduction will vary).


    +   - Disaster recovery cost savings.


    +   - Shorter maintenance windows with little to no planned downtime.


    +   - Hardware savings (applies primarily to situations where hardware is expecting
    to be purchased).


    As tempting as it is to consider headcount or areas as in which to save money
    don’t. Fewer boxes do not mean less to secure or manage. Yes, there is less hardware
    to secure, but the cost of tagging and tracking and ensuring your box doesn''t
    walk out of the data center is marginally reduced, and that reduction is offset
    by the complexities of monitoring and securing multiple virtual servers. Headcount
    is similar animal. You can automate, and you can make it so establishing and provisioning
    a server takes fewer man-hours, but you still need people to manage and track
    what''s going on and prevent the dreaded "virtual server sprawl," which we will
    discuss more thoroughly in Chapter 16, "Deployment," and Chapter 17, "Postproduction:
    Wrapping Up."


    Note that selling on the merits of cost cutting will not work if you''re looking
    to virtualize the desktop (cloud computing via a public cloud being the exception,
    not in Chapter 13,"Choosing a Vendor") Although desktop virtualization will likely
    deliver savings over time, in the short run, it requires a much higher investment.
    The lengthy ROI is not likely to earn it fans. For whatever reason, you choose
    to make desktop virtualization a top priority and cost is a key driver, consider
    using a managed service provider (MSP) or public cloud.


    Assuming appropriate hardware is on-hand, or a purchase order is approved or pending,
    the powers that have been sold on the benefits, it is time to move forward in
    building a strategy. The first step in coming up with a virtualization strategy
    has nothing to do with virtualization and little to do with technology. It is
    about developing a cross-functional understanding of the business: processes,
    priorities, and people issues.


    # CROSS-FUNCTIONAL TEAMS


    If the process has not already been formalized, now is the time to do so. The
