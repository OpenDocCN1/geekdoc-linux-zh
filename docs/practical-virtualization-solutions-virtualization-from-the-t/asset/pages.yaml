    static disks is that they increase performance and more emulate physical disks.
    You can resize static disks with tools like GParted, so there isn''t much to take
    the performance hit for a dynamically resizing disk. Finally, this screen allows
    you to choose to split your virtual disk into chunks or leave it as a single file.
    For performance and backup, choose to use 2GB chunks.


