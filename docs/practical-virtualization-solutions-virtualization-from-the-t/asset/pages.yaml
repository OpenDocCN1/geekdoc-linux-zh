  md: '# Foreword


    A few years ago, the idea of running multiple operating systems concurrently on
    the same computer captured the imagination of the computing industry. Virtualization
    became the hot buzzword and projects were launched to fulfill the dream.


    With virtualization, you don''t need an extra computer every time you want to
    bring up a new server. Extra demand on your infrastructure can be handled by simply
    launching guest operating systems. An entire guest can be dedicated to a single
    application, and that guest can be different from the host operating system. Using
    features like storage virtualization, guests can be moved around-the-fly to make
    the best use of your computing hardware.


    Now you have been asked to pick the right virtualization solution for your business.
    Ahead of you is the daunting task of sorting through competing technologies, finding
    what best suits your situation, and getting it all to work within your IT infrastructure.
    What you need is a guide to virtualization choices that clearly describes how
    to implement those choices. Practical Virtualization Solutions is that guide.


    All sorts of questions might be in your mind right now. What new computer hardware
    demands must I meet? Should I use Windows or Linux as my host operating system?
    How do I secure and maintain my guest operating systems? Should I use local or
    networked storage? What are the differences between server and desktop virtualization?


    Besides helping you answer those questions, Practical Virtualization Solutions
    also answers some questions you probably haven''t thought of yet. Where can I
    find prepackaged server appliances to quickly configure specialized Web, file,
    or CMS servers? How can I migrate an existing physical system to a virtual system?'
