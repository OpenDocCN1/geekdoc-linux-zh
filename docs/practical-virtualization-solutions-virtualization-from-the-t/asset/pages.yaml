  md: '# File and Folder Security


    Because the installation script runs as root for VMware Server, the initial folder
    designated as a VM repository has root only privileges. If you are creating a
    system that other VMware Server Console users are going to use, one way to simplify
    the process is to create a repository for each one. If your users need a shared
    repository, create it as root, create a group for access to it, change group permissions
    to the repository folder, and deny all other access.


    Enter the following commands at the command line on the virtual host system to
    create a shared repository for your VMs.


    ```

    # mkdir /VMShared

    # groupadd vmusers

    # chgrp vmusers /VMShared

    # chmod 770 /VMShared

    ```


    Edit the virtual host system''s /etc/group file and add usernames to the vmusers
    group entry.


    Now, when users login via the VMware Server Console, they can create VMs in the
    shared directory (repository).


    # File Names and Roles


    When a new VM is created, a folder is also created with the name of the VM. The
    folder exists under the VM repository folder. This is both an organizational and
    a security feature that ensures each VM has its own uniquely named folder to hold
    its files.


    Under the VM folder, you will have several files, depending on how large your
    virtual drive is and whether the VM is powered on.


    The basic files are as follows for a VM named Debian4. These files are common
    to all VMs:


    +   Debian4.vmdk—This is the disk definition file (Disk Descriptor File). In it
    are the number and filenames of the virtual disks and the virtual drive geometry.


    For example:


    ```

    # DescriptorFile

    version=1

    CID=814cfffffffff

    createType="twoGbMaxExtentFlat"

    ```


