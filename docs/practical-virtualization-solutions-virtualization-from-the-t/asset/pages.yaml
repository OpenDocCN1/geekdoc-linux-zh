  md: '# Practical Virtualization Solutions


    +   1. Select a VM from your inventory and click Network in the right pane to
    open the Settings screen.

    2. Deselect the Enable Network Adapter check box on the Adapter0 tab.

    All options are immediately grayed out.

    3. Click OK to accept the change.


    The network adapter is now disabled and will not function when the VM boots.


    # Adding Hardware to a Virtual Machine


    Enabling or mounting hardware effectively adds the hardware to your VM. This section
    steps through how to enable a USB device and connect to your VM using various
    network protocols.


    > NOTE

    Your VM must be powered off to make any changes to the hardware.


    # Enabling a USB Device To enable a USB device on your VM, follow these steps:


