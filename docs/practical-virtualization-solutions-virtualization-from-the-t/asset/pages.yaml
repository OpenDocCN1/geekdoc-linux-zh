    # TESTING THE DEPLOYMENT


    After you''ve determined which apps will be virtualized and on which server, you
    can go ahead and begin rolling them out. However, a more prudent step would be
    to test things out in a simulated environment that a lab management tool offers.


    Here, the choice of virtualization environment will be a driver. You can''t use
    VMware vCenter Lab Manager with Xen or Hyper-V, but VMLogix LabManager works with
    ESX, Hyper-V, and Xen. The other player in this relatively uncrowded space is
    Surgent, which offers a variety of lab management systems. For the most part,
    however, VMware and VMLogix dominate.


    Lab manager tools offer the capability to create a test environment that encapsulates
    the entire server environment on a few boxes, enabling you to take your virtual
    infrastructure out for a spin before putting a single actual server into production.


    VMware''s Lab Manager''s “sandbox" environment enables users to design, simulate,
    and test various system and network configurations needed to support tiered apps.
    The software offers a host of features, such as graphical configuration diagrams
    and network fencing feature that enables users to work in parallel by deploying
    multiple instances of those configurations simultaneously.'
