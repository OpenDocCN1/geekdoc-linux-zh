    # VMWARE SERVER IN THE REAL WORLD


    It is a commonly held belief that VMware Server’s sweet spot is not in production
    environments. That doesn’t mean, however, that there isn’t room for it in larger
    environments. The School of Electrical Engineering and Computer Science at Washington
    State University, for example, has found VMware an ideal solution for many of
    its users’ needs.


    Like large enterprises and institutions, the school uses VMware ESX in its server
    room. Mail, web, authentication, and all file services for the school comes out
    of the server room, and relies heavily on virtualization for these operations
    to be a success. It is not IT for the campus, however; and the department does
    not provide or oversee the network running through the building.'
