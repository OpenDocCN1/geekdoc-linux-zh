    # Combination VLAN


    A combination VLAN can be a valuable asset in creating a more secure environment
    for certain services. To see how this works, remove or disable the primary Ethernet
    Adapter on one of your VMs from the previous example.


    You still have VMware VLAN connectivity between the VMs using /dev/vmnet2. You
    now have one VM with dual connectivity and one VLAN-only connectivity. The only
    system that may contact the VLAN-only is the VM connected to it via the /dev/vmnet2
    VLAN.


    To illustrate the security of the isolated system, consider the following scenario:


    +   * VM1 has dual connectivity.


    +   * VM2 is VLAN only.


    VM1 is a web application server that calls a database on VM2. VM2 is a database-only
    server system. On VM2, implement a firewall that allows only the incoming port
    for web application to database connectivity. All other incoming ports are blocked.
    This results in a very secure environment for the database server system.


    # SAN AND VSAN


    Storage area networking (SAN) has been around for a few years now. It has matured
    and grown more popular in larger networks as a way of moving away from server-based
    storage to network-based storage. Server-based storage is traditional file server
    storage where you are connected permanently to a server that shares its local
    disks to users for file storage. Network-based storage is storage that is not
    local to any server but spread throughout a network in the form of disk arrays,
    tape libraries, optical disk arrays, and various types of network attached storage
    devices.'
  merge: -1
  pgno: 212
- img_proc: true
  md: '# CHAPTER 11 Network and Storage Virtualization in Action


    Smaller networks rarely use SANs because of the sheer cost and complexity of the
    equipment involved in the process. Typically, as networks grow and evolve, the
    following progressive steps are taken toward SAN architecture:


    +   - Server-based storage

    - Network attached storage (NAS)

    - Storage area networks

    - Virtual storage area networks (VSANs)


    Generally, there must be some significant advantage to virtualized storage for
    large, complex networks. The major payoffs are in storage management and in the
    segregation of network traffic within a SAN. When you split a large SAN into segments
    or VSANs, you not only have a more manageable SAN infrastructure, but also improve
    the performance and scalability of your SAN.


    Devices that are used in SANs use special communications protocols to transfer
    data via the network. Fibre Channel and iSCSI are the two major protocols used
    in SANs.


    VLANs and VSANs are very similar in that they are logical separations of devices
    and traffic into a network compartment. VLAN and VSAN creation occurs at the switch
    level. Individual storage devices are grouped into a logical unit (VSAN) with
    a unique ID number. The switch is then responsible for forwarding the data to
    the correct VSAN by ID.


    The VSAN enables SAN managers to administer SANs with greater efficiency because
    the SAN removes the location issue from the SAN. It also allows maintenance to
    occur without interruption—for example, by replacing, adding, or removing storage
    devices without bringing an entire SAN to do so.


    # Data Transportation


    Data transports speeds are very high using FCP (Gbps), but Fibre Channel Host
    Bus Adapters and switches are expensive. The additional architecture is also very
    complicated compared to other technologies. Although prices are coming down and
    speeds are going up, it may be wiser to leverage existing architecture using iSCSI.
    iSCSI is implemented with existing switches, NICs, and the speeds can approach
    Fibre Channel if you use Gigabit components.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '# Practical Virtualization Solutions


    To gain greater throughput, you can bind two or more NICs together to create a

    larger data pipe to the iSCSI device.


    \nFibre Channel and iSCSI devices are suitable for storing and running live VMs.

    Disk I/O is sufficient to sustain an acceptable read and write throughput. Many

    companies store disk I/O intensive databases and applications on such devices
    with

    great success.


    # NAS


    Network attached storage (NAS) devices usually don''t participate in SANs

    because the protocols they use to transfer data. NAS devices use Network

    File System (NFS), Common Internet File System (CIFS), or HTTP. NAS server

    systems transfer data via these protocols over standard TCP/IP at Ethernet

    sspeeds.


    This rate makes NAS suitable for use as a file server and storage for

    nightly backups, but it is not suitable as a storage device for live applications
    or as

    storage medium for live VMs. The exception to the previous statement is for VMs

    that rely on network connectivity than they do on disk I/O. Network speeds

    and from NAS are insufficient to allow for anything but a small amount of disk

    i/O—especially for disk writes. A moderate amount of disk reads may be performed

    without significant latency if the amount of data is relatively small.


    # SUMMARY


    Network and storage virtualization are now common terms within larger networks.

    Perhaps the most familiar term in network virtualization is the virtual private
    net-

    work, the VPN. With the ubiquitous nature of broadband Internet connect-

    ity home and office, VPN is generally the accepted method for remote access

    to a central location.


    Growing networks create the need for segmentation and isolation for security

    and network traffic management. VLANs have come to our rescue in this area.

    VLANs are relatively inexpensive and easy to set up and maintain—even for

    nonenterprise networks.


    Virtual storage networks grow out of storage networks when adminis-

    trative needs dictate such action. Virtualizing the SAN streamlines administrative

    tasks related to the SAN and creates storage stealth so that the actual location
    of

    storage devices is no longer relevant.'
  merge: -1
