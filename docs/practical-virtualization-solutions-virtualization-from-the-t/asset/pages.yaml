  md: '# Virtual Machine Installation


    Each of the virtualization technology overview chapters in Part I recommended
    you “Refer to Appendix.” This is where those chapters continue—with the virtual
    machine (VM) installation. The appendix refers to the installation of Debian 4,
    a specific Linux distribution; it is generic and refers to the installation of
    any operating system.


    We''re including this appendix to demonstrate that after you''ve created your
    VM, the installation of the operating system into VM is no different from installing
    an operating system onto a physical machine. The only notable difference is that
    some operating systems are “smart” enough to detect that the disk''re using is
    virtual (as you''ll see in Figure A-10).


    # PREINSTALLATION CONSIDERATIONS


    Chapters 3 through 8 explain how to use an ISO image or CD/DVD to boot the new
    VM and begin installation. If you haven''t already done so, set up your VM to
    boot to an ISO image from a CD/DVD, and power on the VM.


    From here, getting started is fairly straightforward.


    +   1. Figure A-1 shows the initial Debian 4 boot screen. To get the installation
    started, you simply press the Enter key.


    +   2. You''ll then see the screen depicted in Figure A-2, which is the language
    prompt for installing and using the Debian distribution. Select your preferred
    language, and press Enter to continue.


    +   3. You are asked to select your location, as shown in Figure A-3. Use the
    keyboard''s arrow keys and press Enter to continue.'
