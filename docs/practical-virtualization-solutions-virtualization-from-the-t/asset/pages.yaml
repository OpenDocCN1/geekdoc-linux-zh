    # SUMMARY


    Hardware is the foundation of your virtual environment. Skimp on hardware, and
    it will come back to haunt you, particularly in performance. The good news is
    that most x86 hardware on the market today is virtualization ready, and systems
    that are not labeled accordingly. Blades are particularly well suited for virtualization
    because of their design, but in some cases, rack-based servers perform equally
    well.


    Looking beyond raw form factor are processor choices. In the x86 world, these
    too are now being designed with virtualization in mind. Both AMD’s and Intel’s
    processors feature hardware-assisted virtualization capabilities.


    This is not to say that everything is rosy. I/O and memory issues present the
    biggest challenge. As roles and capabilities traditionally found in hardware find
    their way into software, these challenges are simultaneously exacerbated and mitigated.
    Chapter 13, “Choosing a Vendor,” discusses this further.'
