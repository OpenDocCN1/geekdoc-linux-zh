    some areas, but some today believe that much of what is labeled as storage virtualization
    is really not.


    Then there is the debate about what virtualization actually is. Not surprisingly,
    many of the definitions around storage virtualization are somewhat contradictory.
    Wikipedia, for example, refers to it as the “process of abstracting logical storage
    from physical storage,” noting that the abstraction can take place at any layer
    in the storage software or hardware stack. The most commonly cited layers are
    file and block.


    Wobepedia, on the other hand, defines storage virtualization as “the amalgamation
    of multiple network storage devices into what appears to be a single unit.” Here
    the aim is to make storage-related tasks such as archiving, backup, and recovery
    easier and faster.


    Back when the virtualization zeitgeist first began, the analysts seemed in agreement
    that storage virtualization would be a much easier than general-purpose services.
    This was largely attributable to storage’s underpinnings—RAID, SANs, NAS, interconnects—whose
    very structure is similar to a virtualized environment. For storage technologies
    related to backup, virtualization has been described as a natural fit, and indeed,
    virtualization products related to backup have taken off.


    So semantics and definitions vary, and the fact remains that virtualization activity
    around the actual storage space has not lived up to the hype of several years
    ago. That is not to say, however, that virtualization has not had an impact on
    storage. Nor would it be prudent to factor it in storage when sculpting a virtualization
    strategy.


    Virtualization has, in fact, a tremendous impact on storage, albeit not in the
    way vendors and pundits anticipated. By their inherent dynamic, VMs increase storage
    needs. A great deal of activity centers around storage as it relates to virtualization,
    but it has come from the increased storage needs of the servers now containing
    multiple VMs. These servers hold more data and as a result they have greater availability
    and disaster recovery needs. Hence, a greater needs for storage resources—particular,
    in fact, backing up and protecting VMs is by far the biggest storage virtualization
    issue.


    Beyond that is much of the heavy mercury kicks in. In two terms that get tossed
    around are block-level virtualization and file-level virtualization. The easiest
    way to think of them is that block-level virtualization applies to storage area
    networks (SANs), and file-level virtualization applies to network attached storage
    (NAS). The abstraction layers are applied where the names imply. SAN virtualization
