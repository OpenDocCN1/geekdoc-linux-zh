    many of the errors that come into play from human errors during this process.
    Whereas assigning a VM as a “new” server is much simpler than adding a new box
    to the data center, this simplicity brings with its own set of issues, which automation
    goes a long way toward solving.


    Consider the process that goes in hand with getting a new box: request for hardware,
    approval, formal purchase order, waiting for the box, box arrives, delivered to
    the data center, box likely sits in data center for several days waiting for IT
    staff with corresponding skill set to install and configure software. Depending
    on the organization, this could take several weeks or even months.


    Now contrast with deploying a VM: Sign-offs are achieved, the autodiscovery software
    scans servers to determine its optimal location, and with a few mouse clicks,
    a is up and running.


    There are only three points where the process can be held up, and automation tools
    can facilitate the process to minimize each of the three potential bottlenecks.
    Depending on the function, the tool can prompt for the sign-off, alert you about
    trouble, or automatically undertake a function previously handled manually. It
    can also ensure that process is followed and alerted when it is not.


    The flipside to that it is all too easy to create VMs. The metaphors abound provisioning
    VMs to “breeding like rabbits” and provisioning to being “the drug of choice for
    IT admins.


    This is obviously not an ideal situation, and indeed, the lack of proper processes
