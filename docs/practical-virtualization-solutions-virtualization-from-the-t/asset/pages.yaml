  md: '# CHAPTER 4 VMware ESXi


    ![](img/2ed981e74b223133167333db66866d4d_81_0.png)


    FIGURE 4-15 Editing VM properties.


    On the Hardware tab, you can adjust the amount of memory, the number of CPUs,
    floppy drive support, CD/DVD drive support, network adapter properties, SCSI Controller
    properties, and number, size, and type of hard disks. Intriguing, these are the
    advanced parameters that you can change using the Resources tab, as shown in Figure
    4-16 and the next few screenshots.


    By changing the number of CPU shares, you can effectively determine how much CPU
    processing power each VM receives so that VMs with CPU-intensive applications
    receive appropriate resources. A CPU share is an amount of CPU processing resources
    subtracted from an arbitrary total. The console operating system (the host operating
    system) receives 1,000 shares by default, as do all new VMs. By adjusting this
    number, you split the CPU resources to a percentage of the total.


    For example, if your total number of shares is 10,000, your host operating system
    receives 10% of the total CPU resources. You change memory shares by selecting
    Memory under the Resources tab, as shown in Figure 4-17.


    Memory shares are assigned and calculated a bit differently. By default, memory
    is allocated at 10 shares per MB of VM memory. For example, if your new VM has
    1GB (1024MB) of RAM, that VM receives 10x1024 = 10,240 shares of system memory.'
