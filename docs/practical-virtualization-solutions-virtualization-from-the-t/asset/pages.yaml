    # VIRTUAL LOCAL AREA NETWORK (VLAN)


    VLANs are used on larger networks to segment, or isolate, traffic into broadcast
    domains. VLANs are usually created using intelligent switches, but you can also
    create them with physical or VMs. VLAN trunking is included in Linux kernel versions
    2.4.14 and later, and in all 2.6 versions. You can also create VLANs using Windows
    servers, but you must have NICs that support VLAN creation (for example, the Intel
    Pro Series).


    In VMware Server, you can create VLANs within the VMware environment, allow VMs
    to participate in standard VLANs, or create a combination of the two. VMs may
    participate in VLANs like any physical system by virtue of its IP address.


    # Standard VLAN


    For example, if you create VLAN 10 in your switch and assign the IP address range
    of 192.168.1.0/24, any host that you place into that network will be a member
    of VLAN 10. There is nothing else needed to place a device into a VLAN. The switch
    handles the traffic to the VLAN.'
  merge: -1
  pgno: 210
- img_proc: true
  md: '# VMware VLAN


    An extremely interesting aspect of VMware products that you can create VLANs within
    the software for very efficient VM to VM communications. You do this by creating
    a virtual switch through which all inter-VM communications will take place. The
    VMware VLAN is not accessible outside the VLAN.


    The following steps describe how to set up a VLAN between VMs in VMware Server.


    +   1. Choose two or more VMs from your VMware Inventory that will participate
