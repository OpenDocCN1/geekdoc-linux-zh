    # LOCALIZED VIRTUAL DESKTOPS


    A localized virtual desktop is a virtual operating system that is run locally
    on a system with or without any underlying operating system to support it. There
    are several methods of creating and running a localized virtual desktop. The three
    methods we''ll explore in this section are Live CD, live operating system distribution
    on a USB drive, and desktop virtualization software running a VM.


    # Live CD


    Live CDs have been around for a while and are quite cleverly conceived and constructed,
    but not (that we''re aware of) run as a live VM. You have to reboot your host
    computer with the Live CD in the CD/DVD drive and allow the operating system on
    the Live CD to become your new desktop.


    A Live CD is a virtual desktop that you can''t save info generated from it because
    it is a read-only system. It''s useful in situations where you need a desktop
    OS for remote connectivity to other systems such as websites, network drives,
    or other systems via VNC, RDP, SSH, or other remote protocols.'
