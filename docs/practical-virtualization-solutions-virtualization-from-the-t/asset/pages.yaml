  md: 'To write this book, we were fortunate to enlist the excellent skills of Kenneth
    Hess and Amy Newman. Besides bringing years of expertise to this project, they
    have spent many hours providing step-by-step procedures for configuring virtual
    systems using many different technologies. I think you will find that their hard
    work will save you many hours of research as you go about setting up your own
    virtualization infrastructure.


    —Christopher Negus

    Series Editor'
