    # CHAPTER 5 Citrix XenServer 85


    Although Enta, and Seatem, is an American company with a footprint in 540 venues
    in 23 countries, its actual North American presence is more recent and has quickly
    grown to be significant in part because it has looked beyond the typical entertainment
    venues and into other areas underserved by the major online ticketing outlets,
    such as museums. In 2007, the company began building a managed service from the
    ground up in Baton Rouge, Louisiana. Virtualization is a key part of it, and because
    ENTA was a new company, it was in the fortunate position of being able to build
    its data center from scratch.


    Early on, the company opted to build its staff already familiar with the software.
    Because Enta functions much like an MSP (its actual customers are venues, not
    end users) and intended to build a cloud-like infrastructure, Xen seemed a natural
    fit.


    Indeed, when Enta launched its virtualization efforts in the third quarter of
    2008, few technical hits occurred. There were, however, some hiccups on the human
    element side. The company that built was the only Citrix shop in the area. Because
    of its staff members'' claimed qualifications, Enta hired the company to do the
    Xen install.


    The consultants muddled through, taking three times as long as estimated. Eventually,
    Enta was up and running. Since then, their technical team has worked with Citrix
    to support get XenServer running more efficiently.


    Unlike many companies that started with virtualization by dabbling, Enta went
    into whole hog, virtualizing 80% of customer-facing apps. All the web servers
    and sites are virtualized, and credit cards are processed on virtual servers.


    Because of the nature of what it was virtualizing, it was even more important
    that it work. Customers don''t care about the back end, so long as their transaction
    is accomplished smoothly and securely.


    To accomplish this, Enta has six quad-core boxes running editions of the full
    suite of Xen software. They have 96GB of RAM and are running between 14 and 18
    VMs. The other three have 64GB of RAM and are running between 10 and 14 VMs. The
    number of virtual servers fluctuates because constant dynamic provisioning. Enta
    makes full use of the provisioning tools in the management console to reallocate
    resources on-the-fly.


    The servers connect to a SAN, which is backed up to another SAN every 15 seconds,
    and then to tape each night. Two database servers are hooked into the SAN and
    backed up to the second SAN as well. The database servers are not virtualized
    at this time and might not be for security reasons.


    Should a VM crash, the software has been configured to automatically create another
    image and take that image to the second server, theoretically not impacting'
