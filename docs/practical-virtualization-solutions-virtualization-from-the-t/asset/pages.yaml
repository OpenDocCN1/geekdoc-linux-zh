  md: '# CHAPTER 8


    # VirtualBox


    Sun Microsystems is no stranger to virtualization. First came operating-system-level
    virtualization in the form of Solaris Containers, and Zones, in Solaris 10 in
    2005. In February 2008, Sun acquired Innotek, a German software developer, and
    with its x86 virtualization software package, VirtualBox. Sun VirtualBox into
    its XVM group, which consists of four x86 virtualization technologies: XVM Server
    (a bare-metal hypervisor), xVM Ops Center (a data center automation tool), Sun
    VDI software (a desktop virtualization offering), and XVM VirtualBox.


    VirtualBox can be configured for server, desktop, and embedded environments. It
    is available in an open source version (both executable and source code) and a
    commercial version (via RDP Server, USB support, USB over RDP, and Serial ATA
    controller).


    VirtualBox at the time of this writing is version 2.2. It is available for Windows,
    Linux, Macintosh, and OpenSolaris hosts supports myriad guest operating systems,
    including Windows (NT 4.0, 2000, XP, Server 2003, Vista, and Windows 7), DOS/Windows
    3.x, Linux (2.4 and 2.6), Solaris and OpenSolaris.


    # THE VIRTUALBOX SERVER CONSOLE


    The VirtualBox Server Console, also known as the VirtualBox graphical user interface,
    is a very attractive console—possibly one of the most attractive and intuitive
    out there. Although this isnt a review, per se, it bears mentioning that VirtualBox
    is visually pleasing and easy to use. The designers of VirtualBox thought out
    the detail, color, and layout of the product from top to bottom, as Figure 8-1
    demonstrates.'
  merge: -1
