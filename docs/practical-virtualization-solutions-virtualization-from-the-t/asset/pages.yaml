    # TABLE 1-2 Physical Versus Virtual Machine Cost Comparison


    | SPECIFICATION | PHYSICAL ENTERPRISE | PHYSICAL STANDARD | VIRTUAL |

    | --- | --- | --- | --- |

    | Cost | $18,000 | $16,000-$20,000 | $0 |

    | Rack Units | 4U | 8U | 0 |

    | Power (Watts) | 1570 | 5360 | 0 |

    | Network Connections | 2 + 8* | 16 | 8* |


    > *Two for the host server and one for each virtual.


    > *The same physical eight on the host server.


    These two tables clearly illustrate how virtualization pays off in many ways not
    just financially. The lower power requirement is the most significant savings,
    followed closely by the number of used network connections, and finally by rack
    space units.


    The tables might appear first misleading, because the value shown for power consumption
    for VMs is $0. It is set at zero because a VM has no power supply from which to
    directly draw power. However, as VMs are powered on, they raise the power consumption
    on the VM host. Power consumption by individual VMs is difficult, if not impossible,
    to isolate from the VM host''s overall power consumption.


    To further network connection cost, you can configure your VMs to share network
    connections. Shared connectivity works well in situations where network traffic
    is relatively low for individual servers. If you find network utilization for
    a particular interface is edging toward the 80% level, you should split a VM off
    its own network interface.


    Although reaching cost to a per-VM basis is close to impossible, it is possible
    to pass out a rough estimate. Continuing with the current example, consider how
    many VMs you can run simultaneously on this enterprise server. Realistically,
    with 32GB of RAM total, 1GB is required for the host, 31GB remains to allocate.
    Each individual VM may have 64MB to 4GB of RAM. You have a wide range of possibilities.
    If you take your standard server number 2GB and allocate that amount for each
    VM, you can theoretically have 15 VMs running. Divide the total cost of the server
    by 15, and there is a rough number to attribute to each VM.'
