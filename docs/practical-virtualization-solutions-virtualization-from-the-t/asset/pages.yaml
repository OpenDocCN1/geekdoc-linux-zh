    # SUMMARY


    Hyper-V ushers in a new era of Windows virtualization a la Microsoft. For Windows
    virtualization, there might be nothing better, but recently Microsoft has made
    agreements with Red Hat and Citrix to ensure cross-compatibility that many enterprise
    users demand from such product. This new era of forced compatibility with non-Microsoft
    operating systems might be exactly what integrators and resellers historically
    have wished for.


    Only maturity and third-party management applications will make Hyper-V the enterprise
    tool that developers and marketers foresee it becoming. Hyper-V is easy to install
    and use, but only time will tell it if it is capable of usurping market share
    from its competitors.'
