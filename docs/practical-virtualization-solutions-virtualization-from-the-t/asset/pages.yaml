    # Software Tests


    The use of VMs for software testing is one of the early applications of x86 virtualization.
    A VM is created, started, patched, given an IP address and a name, then a backup
    of this pristine VM is made. The working copy is used to install, modify, and
    uninstall software packages.'
  merge: -1
  pgno: 36
- img_proc: true
  md: '![](img/2ed981e74b223133167333db66866d4d_37_0.png)


    # FIGURE 1-4 Correct load-balanced systems scenario with three virtual web servers
    and shared storage.


    Using a VM in this way gives you the opportunity to troubleshoot any conflicts
    or potential problems before deploying software to server or desktop systems.
    Should problems arise out of a conflict or poorly constructed application that
    result in crashes, reboots, blue screens, core dumps, or other faults, you can
    continue to troubleshoot or remove the crashed VM, make a working copy of your
    pristine image, and begin again. This type of software testing gives you the ability
    to rigorously test and retest applications without reinstalling the operating
    system, base applications, and patches each time the system crashes.


    After you have a working system, move the working VM into production by copying
    the VM image to a production VM host system. Virtualization makes testing, problem
    resolution, and deployment a streamlined process.


    # Centralized Server Management


    All the major virtualization products have a console or centralized viewer to
    view and manage VMs from a single interface. This centralized management interface
    makes virtualization a palatable solution to server sprawl, KVM (keyboard, video,
    and mouse) interfaces, and managing various operating system types.


    A management console gives system administrators a single, operating-system-independent
    interface to manage any number of VMs; no special methods of'
  merge: -1
  pgno: 37
- img_proc: true
  md: 'access are required for interaction with any system. This interface allows
    you to interact with the system''s actual console as if you were sitting in front
    of a physical system.


    Centralized consoles also allow senior administrators to grant access to specific
    systems, or groups of systems, on a case-by-case basis. For example, you can grant
    access to a set of database servers to the DBA group. When a member of the DBA
    group connects to the VM host server, he sees only his group of servers to which
    he has permission. All other systems, regardless of function, are invisible to
    him.


    # Power Conservation


    Power consumption is a popular topic of debate when discussing virtualization
    or blade servers, or both. VMs do consume power. They consume memory, CPU, disk
    space, network bandwidth, and power. You can think of a VM like any other application
    that runs on a system. If it consumes resources, it consumes a piece of available
    resources. An idle server doesn''t consume much power, but a busy one.


    As shown in Table 1-3, even a small number of physical systems multiply consumption
    by that of a large system. Although those numbers are for maximum output, it gives
    us a concrete number with which to operate.


    # TABLE 1-3 Physical Machine Power Consumption


    | SERVER TYPE | POWER OUTPUT (MAX) |

    |---|--|

    | Enterprise | 1570 |

    | Standard | 670 |


    The rated output for five standard servers is 3,350 watts (max), which is more
    than twice the amount of the single Enterprise server power rating. You can see
    from this simple table that power consumption decreases dramatically through virtualization.


    Closely tied with power consumption is cooling and air circulation. Virtualization
    reduces the number of power supplies, CPUs, and disk drives—all of which generate
    and give off a significant amount of heat. By lowering the number of producing
    pieces of hardware, you also decrease amount of power needed to cool a server
    room effectively.'
