    tasks not related to specific departments being billed to Virtual Cost Center.


    # FINAL THOUGHTS


    Though much has been written about the long-term benefits of virtualization, little
    is actually known. Although virtualization has a long history in concept, x86
    virtualization is relatively new on the scene, and despite what the vendors claim,
    deep production deployments remain the exception.


    At this point, the majority of long-term benefits fall either into the soft benefits
    category—a more agile enterprise—the difficult, if not impossible to quantify—longer
    hardware life cycles, shorter maintenance windows, and improved disaster recovery
    and high availability (assuming it is put into place).


    Virtualization has been labeled “disruptive” technology, which gives a double
    burden to bear: The inherent nature of its disruptiveness means an overhauled
    infrastructure—never an easy sell—but at the same time, because it is changing
    the model, no one actually knows what the future holds. Is cloud computing the
    face of virtualization? Where wireless devices come into play? Will anyone care
    about the operating system five years from now, or will we be building data centers
    based around hypervisor choice—or will the hypervisor cease to matter as well?


    The best-planned infrastructure will need to grapple with the answers to these
    questions as they unfold. It is important, therefore, that enterprises remain
    flexible and willing to adapt to changing trends to meet end user and ultimately
    customer needs.


    At the time of this writing, there has also yet to be a serious breach. With more
    and more enterprises virtualizing for the initial cost savings, we are to hear
    of some headaches. It''s only a matter of time before the inappropriate use of
    hardware or the incorrect applications virtualized comes home to roost. VM sprawl
    is an issue for even the best-planned deployment. Now consider a not-so-well planned
    one, and the threat is even bigger.


    As we''ve noted repeatedly, proper planning and management remain the antidote
    to this. Multiple tools are available to facilitate this. Although making use
    of them will facilitate a sound infrastructure, ultimately, it is people behind
    the processes setting, tweaking, and retaking that enable the desired result.'
  merge: -1
