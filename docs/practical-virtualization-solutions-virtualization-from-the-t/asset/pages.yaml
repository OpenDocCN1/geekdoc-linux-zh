  md: 'So as long as the scale is small, VMware Server is effective for a test environment.
    Thus, the systems staff begin selling the solution to the faculty.


    Typically, the IT staff at the school sets up the user''s computer, and the user
    then administers it. This enables the user to accomplish whatever is needed with
    minimal resource consumption on the part of the IT department.


    The IT staff views VMware Server as a "gateway drug," however, and it is already
    looking to add more computing power to its virtualization offerings. It is experimenting
    with a more cloud-like environment in which VMs are available to faculty via the
    ESX servers in the data center.


    As satisfied as the school has been with VMware Server, the systems administrator
    for it cautions the importance of ensuring appropriate expectations. Often, users
    expect ESX performance and are disappointed with what they get.


    Assuming moderate performance is acceptable, VMware Server might even be a good
    candidate for an initial server virtualization foray. Despite its low price point
    and ease of use, it is not always ideal for small businesses with limited IT staff,
    which in some cases might find vSphere or vCloud better meeting its needs.


    # SUMMARY


    This chapter introduced VMware Server and the VMs, the VMware Server Console,
    which is the primary interface between the user and VMs. The Console is used to
    create, alter, remove, and edit VMs. The chapter stepped through how to create
    a VM from scratch, how to make changes to hardware components, and how to customize
    a VM for better performance. File-level composition of VMware VMs and how to secure
    VMs for different purposes were also covered. Finally, each VMware file type was
    introduced and its role in the life of a VMware VM explained.'
