    # Dynamic Movement


    One of the biggest challenges in managing the day-to-day aspects of a virtual
    infrastructure is knowing where everything is. Dynamic migration (the capability
    to move workloads from one virtual machine [VM] to another and to move VMs from
    one server to another) is a key selling point for virtualization. VMware calls
    its capability VMotion, and Microsoft and Citrix theirs Live Migration.


    It is part of what keeps a virtual infrastructure agile, and it is a key selling
    point, especially for organizations that have peak workload periods requiring
    a great deal of compute power times and not much at others. A dedicated server
    that meets these needs would be underutilized most of the time. Being able to
    move workloads from one machine to another for easier upgrades and hardware maintenance.
    It also simplifies disaster recovery efforts.


    VMotion and similar programs make VM migration fairly effortlessly on admin''s
    part. The software identifies the optimal placement for a VM in seconds with a
    migration wizard providing real-time availability information. It can migrate'
