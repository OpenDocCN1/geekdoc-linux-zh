  md: '# Virtual Machine Files and Folders


    By default, XenServer uses local disks for VM storage. VMs are stored in logical
    volumes as separate volumes. This storage results in high-performance disk I/O.
    The downside is that other XenServer installations or pools cannot access these
    local volumes. This means the VMs and their workloads are dedicated to the specific
    system on which they were installed and are not agile. A VM installed onto a NFS
    volume, iSCSI volume, or SAN, in contrast, is agile and is capable of motion between
    hosts.


    # RESOURCE POOLS


    Because XenServer is an enterprise-level hypervisor, it has more benefits than
    its other free and desktop-level virtualization counterparts. One benefit is the
    ability to create Resource Pools. A Resource Pool is a group of virtual host systems
    grouped together logically to support a group of VMs dynamically. The dynamic
    feature of Resource Pools is its greatest strength.


    It''s nice that Resource Pools offer an efficient way to manage resources, but
    dynamic resource allocation, live migration between virtual hosts, and support
    for high-availability make Resource Pools a must for any serious data center virtualization
    project.


    A Resource Pool consists of up to 16 virtual host systems. One of the systems
    is designated as the Master; other XenServers in the pool are Members or Slaves.


    To create a new Pool


    +   1. Click the New Pool button on the XenCenter menu bar.

    2. Enter a Name and Description for the Pool and click Next.

    3. Add XenServers to the new Pool and click Finish.


    The first XenServer added to a Pool is designated as the Master.


    > NOTE

    If a Pool Slave goes down, the Pool is still active. If the Pool Master goes down,
    the Pool is inactive until another XenServer is promoted to Master. The XenServers
    and VMs in the Pool continue to function in the event of a Master failure, but
    Pool features are disabled until a Master comes online.


    # VIRTUAL MACHINE TEMPLATES


    Managing a large virtual infrastructure environment is, or can be, a daunting
    task. To simplify this task, you should implement Operating System Templates.
    There are'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# CHAPTER 5 Citrix XenServer


    several pre-built ones (remember that we bypassed them to install your VM using
    Other Install Media), but you can, and should, create your own.


    The first step in the process is to install your VM''s operating system, supporting
    software, updates, patches, VM tools, and applications. The second step is to
    convert VM into a custom template from which you install other VMs. Unfortunately,
    it is an irreversible procedure. After your VM is converted to a template it will
    always be a template. If you ever need to edit your template, you''ll have to
    delete the template, re-create the VM, convert it to a template, and create new
    VMs from it. So complicated? It isn''t.


    # Converting a VM to a Template


    If your VM is powered on, power off you can''t convert a running VM to a template.


    +   - When the VM is powered off, right click your VM and select Convert to Template.

    - You''ll receive notification that this is a one-way process. Click OK to confirm.


    The VM is converted immediately to a template. Note the icon change from VM to
    template.


    # Installing a New VM from the Template


    Now you''re ready to install a new VM from the template.


    +   1. Create a new VM by right-clicking the template you just created and select
    New VM.

    2. Your new template now appears in the templates list. Select your template and
    click Next.

    3. Name your new VM, write a description, and click Next.

    4. Because you''re using a template, start with an empty DVD drive. Click Next
    to continue.


    > WARNING

    If you create a VM from one of the listed templates, you must provide installation
    media for the operating system that you select.


    +   5. Now you''ve created a Pool, you''re prompted to designate a Home Server
    for this VM. A Home Server is the XenServer that will originally host the VM,
    if possible (if adequate resources exist to host the new VM). You also have the
    option of selecting Automatically a Home Server with Available Resources. Click
    Next.'
  merge: -1
  pgno: 107
- img_proc: true
  md: '6. Allocate an appropriate number of CPUs and memory for the new VM.

    Click Next.


    7. You may select, add, or remove storage (Virtual Hard Disks) and click Next.


    8. You may select, add, or remove Virtual Network Interfaces and click Next.


    9. Choose whether to start the VM automatically and click Finish.


    Your new VM starts and is an exact clone of your Template version. When creating
    Templates, we suggest that you use Dynamic Host Control Protocol (DHCP) so that
    IP addresses are assigned to your Template VMs automatically. This prevents IP
    address conflicts when starting new VMs created from the Template.


    # XENSERVER IN THE REAL WORLD


    Think ticketing sales, online or otherwise, and nine times out of ten, Ticketmaster
    is the first company people think of. When Ticketmaster does indeed command a
    whopping majority of the market, it is far from the only game in town. There are,
    in fact, approximately 75 ticketing system companies throughout the world, 12
    of which command significant market share. None of this matters to most consumers,
    who never think about who the ticket vendor is, so long as the purchasing process
    works as they expect it.


    One of the major players is Seatem, an international company with American owners.
    Some of its properties have extend back to 1780 in the London theater world. The
    ticketing company counts itself among the top seven worldwide, and its application,
    the Enta Ticketing Solution, supports this. More than 50 million tickets that
    are sold from 250 companies in 24 countries flow through the Enta Ticketing Solution
    year. Enta estimates that it services approximately 550 venues and that 65% to
    70% of its purchases today are made online. This is a sharp increase from five
    years ago, where at most 20% of sales were made online.


    Seatem’s presence is strong in the United Kingdom, where Enta makes use of the
    Enta Ticketing System to bring together the London theaters in a single pipe.
    Seatem is also in the process of opening an office in the Middle East, adding
    to its global reach, which currently extends to Australia and, of course, North
    America.


    USA is fairly new on the scene and is currently the only company in the Seatem
    family that is virtualized. Seatem plans to expand the model deployed in the United
    States in the near term. Its UK companies are using a managed system, and new
    clients will use a virtualized model as it is rolled out. Its Australian company
    is being rolled into a virtualized model now as well.'
