    Recon), as well as that of others, sell products with autodiscovery capabilities.
    In some cases, these products are also part of a modular-like suite. Some also
    hook into the infrastructure tools from larger vendors; still offer autodiscovery
    and automation within the same product. This is a space that is changing fast,
    because of acquisitions and the entrance of new players. PlateSpin Recon, for
    example, came to Novell via acquisition.


    Note also that in many cases the “unique” capabilities toured in the sales pitch
