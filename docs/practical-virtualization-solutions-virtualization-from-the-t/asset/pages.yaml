  md: '# CLOUD COMPUTING


    If you’ve read through this and are thinking, “That’s interesting, but my budget
    was slashed in half and my headcount is frozen,” but you still need to visualize
    and don’t want poor planning to bite you the road, do not despair. There is one
    more option: cloud computing.


    For cash-strapped enterprises for which new hardware is not possible, cloud computing
    may be the silver bullet. In 2005, cloud went from being an eye-rolling concept
    that was mostly vaporware to an initiative that a of companies are embracing and
    developing revenue models around. Depending on which analyst you ask, cloud is
    poised to be the next paradigm shift or a popular fad that will eventually find
    a niche. When it comes to virtualization, and desktop virtualization in particular,
    cloud computing may turn out to be the secret sauce for an organization that lacks
    the infrastructure and skill sets.


    Cloud computing, it should be noted, is not a new concept. It has gone by other
    famous names such as utility computing, clustering, and in some cases, high-performance
    or supercomputing. In fact, some initiatives previously labeled “software as a
    service” now seem to fall under the cloud heading.


    Even the idea of renting computing units isn’t new. If you go back to IBM’s earliest
    days, much of its business was renting out of its mainframe. More recently, IBM
    opened up the Deep Computing Institute in Poundkeeps, NY. The facility launched
    with 512 systems in June 2003. A less than a year was almost out of space, running
    nearly 2,400 xServers, Opter-based servers, and BladeCenter systems, as well as
    a Deep Computing Center in Montpelier, France. Since then, Sun and HP have launched
    similar initiatives with mixed success.


    This is the end of cloud. For organizations in need of supercomputing services,
    having access to processing units puts them in a league they would likely not
    be able to compete in otherwise. IBM put it, “it levels the playing field,” making
    it possible for smaller firms in industries like pharmaceutical, animation, and
    gas and oil exploration to compete against their well-heeled competitors.


    For a long time, that was the extent of it. Utility computing and grid computing
    bundled along, but they were used primarily in specialized niches, and although
    their price was lower in the supercomputer model, their merit was not so easily
    understood. The growing acceptance of virtualization in their favor, and vendors
    in this space started referring to their technology as reverse virtualization
    or virtualization, a semantic change that seemed unthinkable several years ago
    when they took offense at their technology referred to virtualization.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Practical Virtualization Solutions


    What really changed the picture, however, was Google—specifically, Google Apps
    for Domains and Google Docs. With Google Docs, the spreadsheet, word processor,
    or whatever tool you are using is accessed via a browser. Both the data and the
    application reside on Google’s servers, which are a collection of commodity servers
    grouped—you can think of them as virtualized or clustered. Documents can be created,
    edited, and shared without ever taking up space on your desktop. The downside
    is that you need to be connected to it for it to work, and the server must be
    up and running. Backing up with regularity mitigates both of these issues, however.


    Much of this first draft of this book was written using Google Docs. From an end-user
    perspective, the experience feels more like working on a traditional desktop PC
    on the thin clients of old.


    From a desktop virtualization perspective, especially a public cloud, is a slam
    dunk. It lowers the costs associated with it considerably, and eliminates the
    human "ownership" issues. With Google, Amazon, and a growing number of hosting
    providers making applications and resources available via clouds (which many end
    users simply feel like a browser-based application), acceptance of completing
    tasks this way continues to grow. However, in some circumstances a public cloud
    will not be acceptable. In those cases, working with a managed service provider
    (MSP) or building your own cloud would be better courses of action. Working with
    MSPs is much less costly than building your own cloud, and in many cases it will
    meet the security, privacy, and uptime requirements that the public cloud is unable
    to.


    The rapid acceptance around notebooks will not doubt cloud growth as well. Their
    low price point makes them attractive, but they lack the power and capacity of
    a full-fledged notebook or desktop. Thus, running applications on and storing
    the resulting data will not be feasible. They are, however, well suited to a cloud
    model. If new hardware is needed on the client side, this represents an easy savings.


    Another ball in cloud''s court is that hardware companies are taking notice. Intel
    is partnering with Xeon to provide PC manufacturers with "built-in" virtualization
    capabilities on new desktop and laptop computing systems. Dell was one of the
    first OEMs to come on board and it is providing engineering support to aid in
    the design and testing of the new technology.


    Although the desktop is the clear winner when it comes to cloud computing synergy,
    virtual storage is also poised to gain big from the cloud. Here, security remains
    the biggest challenge and concern. Storage is an ever growing area, both literally
    and metaphorically. As more data accumulates, it must be stored and managed and
    retrievable. Putting it up a cloud is an efficient way to deal with this, so long
    as security and regulatory issues are handled appropriately.'
  merge: -1
  pgno: 244
- img_proc: true
  md: 'To meet these requirements, an internal or private cloud is preferable to a
    public cloud. In some cases that may not only be feasible, but may also make the
    most sense; in other cases, it may not be anywhere near cost effective. Here,
    going with an MSP may make the most sense, assuming service levels are up to snuff,
    and proper security is in place. Although it will cost more than using a public
    cloud, it will be a fraction of the cost of building your own.


    We will take a deeper dive into storage in the next chapter as we examine virtualization
    options beyond the box.


    # SUMMARY


    Although all the OEMs have fully embraced virtualization, each has taken an approach
    unique to the company''s history and customer base. IBM, for example, has a wide
    array of non-x36 solutions, HP has chosen to emphasize the network, and Dell''s
    offerings adhere to industry standards with an eye on the SMB space. Organizations
    should be aware of these differences when purchasing hardware for their virtual
    infrastructure.


    Cash-strapped enterprises that do not have the hardware suitable for virtualization
    on hand but still want to move forward with virtualization should consider using
    a cloud computing model to meet their needs, particularly if they''re planning
    a desktop virtualization initiative.'
