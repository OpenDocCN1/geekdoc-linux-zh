  md: '# Practical Virtualization Solutions


    Enterprises opting for an end-to-end VMware environment will find much to like
    Lab Manager. VMLogix Lab Manager solution is not without its own bells and whistles.
    First and foremost, it automates the building of production-like environments
    with end-to-end configuration of operating systems and applications. It also provides
    the capability to automate the build and test execution process by leveraging
    advanced configuration of software, tools, scripts, and data at the guest OS level,
    as well as the capability to capture and share “live” multi-machine configurations
    from the configuration library.


    As valuable an addition is Lab Manager, it does carry with it a high price tag.
    If you’re looking to cut costs somewhere, and your virtual infrastructure is simple
    and not likely to change this, this is one area that can be nonessential.


    # LOOKING AHEAD TO THE LONG TERM


    As critical as it is to set goals and plan the deployment, it is equally important
    to think about what will happen after the virtual infrastructure goes live. It
    is all too quick and easy for an admin to set up a VM; without policies in place,
    you''ll see virtual server sprawl is more complex and more difficult to clean
    up than any physical sprawl ever encountered. Added to the fact that human error
    is responsible for the vast majority of unplanned downtime, and it becomes even
    more critical to put policies in place sooner than later. Remember, a well-planned
    deployment is easier to manage.


    Now is the time to begin thinking about the following. Note that there are no
    right or wrong answers, but the appropriate path is the one that fits best with
    your organization’s culture.


    +   * Who has the authority to establish a VM (from both an operations and IT
    perspective)**—Can any project manager request that a VM be set up, or does sign-off
    need to come from the director level or higher? There will also need to be an
    approval process from IT side to determine what makes sense from a technical perspective.


    +   * What circumstances merit a VM being set up—Will each project or temporary
    undertaking be allowed its own VM, or will VMs be restricted to long-term or permanent
    projects?'
  merge: -1
  pgno: 274
- img_proc: true
  md: '# CHAPTER 15 Laying the Foundation: The Planning Stage


    +   * What happens when a VM exceeds a certain size—Will it be automatically resized
    or moved, or will IT need to manually approve its expansion? If it is not expanded,
    what sort of storage strategy will be implemented?


    +   * How long should the VM be allowed to exist, and what are exceptions to this—Will
    there be a default time frame, or will it be set to the estimated time frame of
    the project? In general, it is preferable to have an end point for the VM, because
    that ensures the resources allocated to it are in line with its needs.


    +   * What happens to the VM after the expiration date, if it is still in use—Will
    the VM keep live indefinitely or will IT or operations be required to set a new
    time frame?


    +   * What happens to VMs lying dormant after a given amount of time—Will it automatically
    be locked? Where will the contents of VM be moved to? Will the server be reprovisioned?
    Will IT or operations be warned of its shutting off? If so, how far in advance
    will a warning be issued, and how many times?


    It is especially important to think about how you would like to handle the retirement
    of VMs, because abandoned VMs present a management and resource challenge as well
    as a gaping security hole.


    It is also important to evaluate management tools at this time. Without management
    tools, it will be difficult, if not impossible, to manage the environment after
    it is live. Now is a good time to consider adding automation tools to the mix,
    especially if such tools were part of the autodiscovery or planning process and
    thus are already part of the infrastructure. We will talk more about specific
    tools in Chapter 16 and Chapter 17.


    # SUMMARY


    Getting your virtual infrastructure up and running can be broken down into three
    steps: planning, deployment, and maintenance. Although all three stages are important,
    the planning stage is arguably the most important because it establishes the foundation
    for how the infrastructure will function.


    To get most out of the planning stage and be most assured of a successful deployment,
    you must determine what the goal of virtualizing is. It is also critical to'
  merge: -1
  pgno: 275
- img_proc: true
  md: 'inventory both your hardware and software and determine which workloads are
    most compatible.


    Coming up with return on investment projections is also helpful at this time,
    because it will make for an easier sell to senior management and give you a clearer
    target with which to work.


    The planning stage is also the ideal time to begin thinking about policies and
    tools to put in place after the deployment rolls out.'
