    When we think of switches, our thoughts usually turn to Cisco, which has in the
    connectivity space since its founding in 1984. Cisco has been steadily increasing
    its focus on virtualization this decade, and it is far ahead of its competitors.
    Recognizing that VMs now have a permanent place on the network, the company’s
    latest focus is on bringing to them the functionality and benefits that it brings
    to physical machines. Enter the virtual switch, VN-link, which Cisco first introduced
    in September 2008.


    The underpinnings of VN-link aim to mitigate this issue. The technology seeks
    to virtualize the network domain and subsequently to abstract the physical infrastructure
    of the network, whether it’s on the LAN side or the SAN side. This enables it
    to transport data, apps, and so on to VMs as one unified fabric.


    The first products to include VN-link technology were in the high-end Nexus family:
    the Nexus 1000V and Nexus 5000. The Nexus 5000 is a physical switch. From its
