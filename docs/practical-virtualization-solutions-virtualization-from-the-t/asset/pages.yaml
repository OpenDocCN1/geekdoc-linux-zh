    The inherent ease of virtualizing also complicates the picture. Chapter 16 “Deployment,”
    talked about how easy it is to flip the switch. That ease of use does not go away
    and results in an infrastructure that gets more complex with time. Imagine three
    servers, A, B, and C. Server A is provisioned and VMs are running on it. Server
    B is provisioned for four VMs and is underutilized. Server C has not yet been
    provisioned. One of the VMs on Server A needs more space, which is not available
    on machine. VMotion determines whether Server B or Server C is the best place
