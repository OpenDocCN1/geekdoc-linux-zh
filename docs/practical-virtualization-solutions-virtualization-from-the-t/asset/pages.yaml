    # ## Manual Cloning


    A method exists for migrating a physical machine to a virtual one. Sometimes it''s
    impossible to reboot a system and keep it in a nonproductive state for a long
    period (hours). And live P2V conversion software isn''t available for all operating
    systems. This method requires manual creation of the VM (manual cloning) and manual
    workload migration from physical to virtual.


    This is the most primitive and time-consuming method. It is also prone to errors
    and omissions. Often, key components are left out of a manual migration, if possible,
    use one of the automated methods.


    If you perform a manual clone, here is a checklist for you to use for that process.
    This checklist will help you to gather the required information to successfully
    complete a manual cloning.'
