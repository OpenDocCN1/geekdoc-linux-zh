    # Importing a Virtual Machine


    There is no native to import another vendor''s VM into VPC. A few third-party
    applications exist that can make the transition by copying VM disks and converting
    them to the new format.


    # Customizing Virtual Machines


    After your VM is established, it is far from permanent. The beauty of virtualization
    is that hardware can be easily added and removed or reconfigured


    # Removing Hardware from a Virtual Machine


    VPC is a little different from other virtualization technologies in that you don''t
    remove hardware from its VMs, but simply disable it. When it''s disabled, the
    hardware doesn''t show up in the VM''s list of hardware and isn''t detected by
    hardware detection scans in any operating system.


    To disable hardware components in the VM:


    +   1. Open the VPC Console, select a VM, and click the Settings button.

    The Setting for your Virtual Machine opens and presents you with a centralized
    applet for customizing your VM''s hardware settings. See Figure 6-10.

    2. Select Sound from the list, and deselect Enable Sound Card in the right panel.


    You''ll notice that the Current Value for Sound changes from Enabled to Disabled.
    See Figure 6-11.

    When the VM is booted, sound will not be available.


    # Adding Hardware to a Virtual Machine


    Adding some new types of hardware to a VM is as easy as disabling them; simply
    select the component you want to add.


    To add a parallel port to your VM:


    +   1. Select LPT1 from the list. The current value is None.'
