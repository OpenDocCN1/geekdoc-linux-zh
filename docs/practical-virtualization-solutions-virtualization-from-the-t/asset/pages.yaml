    it out.


    # VMware ESX/VMware ESXi


    Enterprise virtualization at its finest is brought to by the people who breathed
    life into PC-based virtualization. ESX is a mature product that is rivaled only
    by Xen at this level of virtualization. Both products require 64-bit architecture,
    but ESXI has special hardware requirements beyond those of ESX. ESXi is now a
    free product.


    # Microsoft Hyper-V


    Microsoft steps up to the plate with its Windows 2008 Server family and Hyper-V
    virtualization solution where Citrix and VMware fall short: Windows-based Enterprise
    virtualization product. Both Citrix Xen and VMware are Linux-based, which means
    that if you are not familiar with Linux or UNIX commands, you may be better off
    using the Microsoft product.


    This product, when more mature, promises to be a formidable challenge to VMware''s
    and Xen''s dominance in the Enterprise virtualization world


    # EMULATION


    Emulation refers to the capability to mimic a particular type of hardware for
    an operating system regardless of the underlying host operating system. For example,
    using an emulation virtualization solution, you can install a Spar version of
    the Solaris operating system on a non-Spar host computer. The emulation software
    runs as an application on the host system, but emulates an entire computer of'
  merge: -1
