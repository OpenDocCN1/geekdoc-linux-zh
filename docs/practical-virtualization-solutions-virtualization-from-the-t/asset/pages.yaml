  md: '# Practical Virtualization Solutions


    the end user experience. Following this model, the tech team found it easier to
    pro- tect one box hosting 12 VMs compared to 12 physical servers.


    Since the initial rollout, Enta made a number of changes. First, it began cul-
    tivating its Xen talent in-house, hiring an admin self-taught in Xen. Next, it
    began documenting the way and how of everything that was. Enta plans to tinue
    to grow its virtual infrastructure, particularly in the area of web ticketing.


    The other big change on the horizon involves moving away from a Citrix archi-
    tecture to .NET architecture. This will not impact your virtualization choices
    directly, because it involves the databases, but it will change the way data is
