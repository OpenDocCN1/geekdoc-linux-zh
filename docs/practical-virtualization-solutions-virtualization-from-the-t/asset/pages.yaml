    if not more, difficult to locate where a given app or data is.


    # Choosing an Automation Tool


    Automation tools mitigate this inherent complexity by offering two key benefits
    to a virtualized infrastructure: They minimize the human involvement in process,
    and they enable admins to know exactly where a VM is and what it is doing.'
