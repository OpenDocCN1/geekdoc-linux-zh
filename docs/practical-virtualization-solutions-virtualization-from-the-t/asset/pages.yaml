  md: '# VIRTUAL MACHINE FILES AND FOLDERS


    After you''ve established and configured the VMs (see the Appendix, “Virtual Machine
    Installation,” for step-by-step guidance on how to get the VM''s operating system
    up and running), you must decide how you''re going to handle the files and folders
    on which the VDIs reside.


    # File and Folder Security


    On a Windows system, you''ll have to alter the permissions for the folders containing
    the VDIs and VM definition files. My suggestion is to restrict those directories
    to administrators only. All other users should utilize the VMs via remote network
    connectivity protocols, such as SSH and VPN.


    On a UNIX or Linux system, your home folder is protected by the default system
    permissions, but the folder containing the VDI files must be protected. Again,
    my suggestion is to make the VDI files accessible only to the administrator (root
    user).


    # File Names and Roles


    At the beginning of this chapter, in the section “The VirtualBox Server Console,”
    we selected the locations for our virtual disks (D:\vpc\VDI) and our VMs (D:\vpe\VBVM).
    Under the VDI folder are your VM disk images. For our example, DSL 3.3.vdi is
    the VDI file. All VDI files are located here, although you may specify alternative
    locations for them. Your VM definition files are under the VBVMVDSDL 3.3 and XML
    files. In addition, a Logs folder contains the current and previous three log
    files for your VM.


    > NOTE

    The XML file is a plain-text file that defines your VM. If you have a problem
    starting with a VM, this is the place to start troubleshooting. Remove any offending
    entries and restart the VM.


    On UNIX and Linux, all VirtualBox definition files are under a folder named .VirtualBox.
    It is a hidden folder located in your home directory. The VDI files are under
    the folder specified during installation.


    # VIRTUALBOX IN THE REAL WORLD


    Metric is all data. The London-based startup provides analytics for the music
    industry. It collects large volumes of trending data and parses it for artists,'
