  md: '# Faster Deployment


    In a recent job listing, our task was to create four new Microsoft SQL Servers
    using Microsoft Windows Server 2003 (32 bit). With few differences among the VMs,
    we cloned the original VM into the four that we needed. The original VM took about
    3 hours to install, update, reboot, update again, and test. The clones took 30
    minutes or to copy to new VMs. Each VM had to be started individually to rename,
    create a new SID, and reboot. Two of the VMs required additional hard disk space,
    which took an extra 15 minutes each. Within 6 hours of arriving on site, our client
    had four new SQL Server systems that were production ready for evening''s testing
    and deployment.


    This process was so fast there was no need for inventory check-in, racking, cabling,
    plugging into power, or having to worry about cooling capacity for four new systems.
    We also have the original VM in case something goes wrong with any of the other
    VMs.


    This was an exceptional project, but it illustrates how quickly you can set up
    new systems and provide services to users, developers, or other administrators.


    When we use VM templates, the same client site, we had to set up a new server
    for some application development testing. We used a template that we had set up
    a few days earlier. When we began installing the new system via the template,
    we thought the system had hung or we had to start from scratch. We waited for
    the next screen in the creation wizard when we saw our new system booting up for
    the first time. We created three more systems using our template before we realized
    our system could have been created so quickly with hardly any interaction from
    us.


    # Service Commoditization


    When you deploy a new service on your network or on the Internet, you may have
    neither the budget nor the desire to spend a lot of money on a solution—especially
    if that service is something like DNS, NTP, LDAP, FTP, or HTTP. Database services
    are also becoming victims of commoditization. Linux and FreeBSD has commoditized
    these and other services. Virtualization has further commoditized services for
    companies on a tight budget because now you don''t have to use a physical machine
    to provide the service.'
