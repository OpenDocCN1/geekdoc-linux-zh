    hand.


    In many ways it is easier to autodiscover how your servers, network topology,
    workloads, and workflows hum than it is to grapple with the human element. Tools,
    after all, unbiased in their assessment. Performance compatibility boils down
    applications and workflows, not politics or job security issues. A retailer with
    a fast-moving inventory, for example, would not want to have its inventory and
    billing application running on the same box. Back-office applications or may not
    be compatible: payroll and personnel apps inherently conflict, the way each is
    used within the organization or may not make this desirable. Similarly, placing
    multiple mission-critical apps on the same machine as highthroughput apps would
    basically be playing outage Russian Roulette. Assessment tools will flag these
    issues.


