    Our enterprise-class server system is a rack-mountable, 2x quad-core CPU, 32GB
    RAM, three 400GB disk drives in a RAID 5 configuration. This system cost is approximately
    $18,000. This does not factor any NICs into the equation, but aware most standard
    systems ship with (or should ship) with two NICs. Typically, one is configured
    for the LAN and the other for backups. The Enterprise server should be configured
