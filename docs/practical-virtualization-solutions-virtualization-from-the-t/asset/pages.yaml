  md: '# CHAPTER 8 VirtualBox


    Ironically, most of the systems running VirtualBox are Dell PCs, not Sun products.
    Nor are they running Solaris, although musicmetric does several Sun workstations.


    Originally, the desktops were running Windows, but later most were reinstalled
    with Linux, with Windows running Linux inside VirtualBox. This resulted in the
    “more technical” users running Linux desktops powered by Ubuntu and Fedora Core
    11. This will also enable the much-sought cache stealing that helped the ball
    into VirtualBox''s court in the first place.


    There was another reason VirtualBox was chosen: musicmetric wanted to be able
    to test its apps in as close to a live environment as possible. Its T1-architecturebased
    Sun servers cannot be directly replicated using the x86-based VirtualBox. VirtualBox
    does, however, allow Solaris to be replicated locally, making it an ideal tool
    for testing and development purposes, thus accomplishing two goals at once.


    Investing in powerful desktops proved be a frugal move from this angle as well.
    It that massive capital outlay was unnecessary, virtualization did not need to
    take place on the actual server. It also meant musicmetric had more choices open
    to it.


    For example, vSphere, the latest offering from VMware (which represents the vendor''s
    strategy shift from the server to the cloud), was found to be prohibitive for
    musicmetric''s budget. Moreover, musicmetric vSphere''s emphasis is failover,
    which musicmetric is not handling within the cloud—not flexibility, which was
    its key goal for its virtual environment.


    VirtualBox, in contrast, not only offered flexibility but was also found to be
    straightforward and easy to use. And it didn''t hurt in the process that software
    is free.


    Perhaps the final straw in VirtualBox''s favor was CTO''s preferred computing
    environment. Mac users are a loyal bunch, and the CTO of musicmetric is a Mac
    user. The dearth of Mac offerings, and their price tag when they are, is often
    a barrier. This, too, in VirtualBox favor because unlike comparable virtualization
    environments as VM Fusion and Parallels, it is free.


    Today, nearly half of musicmetric''s employees are using VirtualBox for a variety
    of tasks. VirtualBox environments are used for development, but they are also
    used for system administration. It is used for Java development as well as Open
    Solaris work. In addition to moving to Linux on the desktop, musicmetric is in
    the early stages of implementing Apache Hadoop, a distributed computation platform.


    The goal for flexibility has been met, and the company is indeed getting the most
    bang for its buck (or in this case, pound) out of its hardware. All hardware is
    fully decked, and each computer has two monitors, enabling the user to see both
    a VM and the whole box.'
