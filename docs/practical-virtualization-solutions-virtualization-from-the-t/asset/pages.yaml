    Note, however, 15 is probably not a practical number unless there is very little
    disk I/O for more than one or two of the VMs. Disk I/O significantly degrades
    performance for all of the VMs unless paravirtualization is employed.


    # Providing Disaster Recovery


    Virtualization provides the least expensive and shortest MTTR (mean time to recovery)
    that we can think of. An old saying in the recovery business goes something like,
    “You can have two of the following for your disaster recovery solution: Fast,
    cheap, reliable.” With virtualization, you can dash this old adage against the
    rocks.


    Recovery is as fast as starting up the VM. In the meantime you have to restore
    data from backup, but you have a functional server that didn''t require downtime
    because of hardware failure or a reinstall of any software.


    You saw in the previous section that VMs could be very inexpensive. The software
    cost is the same as for a physical or VM. Moreover, the hardware already exists
    and is waiting to be utilized.


    VMs themselves are very reliable they have no physical hardware that is susceptible
    to failure. Each VM has its own set of adapters, RAM, disk space, and peripherals
    that map to their physical counterparts. You''ll never replace a motherboard,
    NIC, or CD drive in a VM, and the integrated video card can''t go bad. A backup
    of a VM will always be a stable and reliable recovery point for your hardware.


    Taking disaster recovery to a new level are products like PlateSpin, Xen, and
    VMware Converter, which grab copies of physical machines and convert them to virtual
    ones. In case of PlateSpin and VMware Converter, this conversion takes place without
    rebooting the physical machine before or after conversion. The VMware Converter
    is simple, elegant, and often used as a regular P2V backup method. Should your
    physical machine fail in some way, you would have to boot up the VM in its place.
    Fast, cheap, and reliable—you really can all three.


    # Consolidating Idle Workloads


    One of the primary reasons CIOs and IT professionals consider virtualization is
    to consolidate workloads. Server consolidation takes the form of reducing the
    number of physical systems by combining workloads onto newer and more reliable
    hardware or by using virtualization to create VMs to handle those workloads. The
    effect is essentially the same: use hardware more efficiently, decrease power
    usage, and increase manageability of services. Consolidation may also have the
    effect of lowering vendor support costs by having fewer physical machines to support.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '# Practical Virtualization Solutions


    Consolidation efforts may cause in-house support staff reductions and reallocations
    to different tasks. New systems created via VM templates, provisioned with a few
    clicks and keystrokes, and fired up no longer require extra staff to perform those
    physical functions. There is no need to order, deliver, stack, and provision a
    piece of hardware or to calculate any new power or cooling requirements.


    You know that it''s possible to consolidate idle workloads, and you know that
    it can reduce costs associated with support contracts, power, cooling, and possibly
    even labor, but how do you know that a system is eligible for consolidation? What
    constitutes an idle system?


    There may be many answers to this question, depending largely on whom you ask.
    For projects that I have been directly or indirectly involved with, I generally
    look for systems with an average utilization of 50%. Systems that are 50% utilized
    under significant scrutiny for redeployment, consolidation, repurposing, or decommissioning.
    They also make prime candidates for virtualization.


    # Balancing Loads


    VMs set up load-balanced configurations are an effective and inexpensive method
    of spreading network traffic among multiple systems. Network traffic is dispersed
    to multiple systems, virtual or physical, using a network load-balancer appliance.
    These appliances have special software that allows you to configure a single TCP/IP
    port''s traffic to multiple systems.


    For example, suppose you want to visualize your web services, removing reliance
    on physical systems. Currently, all your traffic (port 80) is directed to a single
    dom address that is served by three physical systems, as shown in Figure 1-1.


    Figure 1-2 shows the same scenario but using VMs instead of physical ones. Notice
    that the number of physical servers hasn''t changed, because balancing loads in
    this fashion requires some degree of separation. All three VMs can exist on a
    single physical system because each has its own IP address. Each VM can also have
    its own NIC mapped to its virtual NIC.


    The disadvantage of the single host scenario is that when your service is load
    balanced, there must be a reason—lots of web traffic and a single host''s performance
    may suffer. The best way to mitigate performance issues related to the disk I/O
    on a shared host is to use network-attached storage that all three VMs connect
    to content. Utilizing a single network-attached source (SAN or NAS) is a very
    common solution even when using physical machines.'
