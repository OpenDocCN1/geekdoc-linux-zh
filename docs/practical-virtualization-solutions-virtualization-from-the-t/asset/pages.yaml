  md: '# CHAPTER 15

    Laying the Foundation: The Planning Stage


    The previous chapters looked at virtualization from both a conceptual and technical
    perspective. We explained many of the options and components that go into a virtual-ized
    infrastructure.


    In Part 4, we switch to a slightly different perspective. We will look at the
    process of taking a virtualized infrastructure off the drawing board and into
    the data center. Many of the virtualization vendors brag that it takes only 15
    to 45 minutes to completely install a virtual server, and while this is indeed
    true, it is a small part of the process. Chapter 2, “Comparing Virtualization
    Technologies,” on the importance of building the VM host with virtualization in
    mind. A sound virtual-ization strategy takes this even further. The best way to
    achieve a sound virtual-ization strategy is through careful planning. Plan, plan,
    analyze, and plan some more. Test, deploy, assess, and revise the plan.


    Part 4 looks at the deployment process from planning to the deployment itself
    to important postdeployment steps. We approach this from a management and strategy
    angle. Although we discuss pros and cons of various management products, we will
    not drill down to level with the virtualization products themselves because has
    already been done. Although it is not necessary to settle on an environ-ment prior
    to coming up with a strategy, it is a separate process, and one that has been
    examined in previous chapters.


    Planning thoroughly, without falling into paralysis by analysis, and then follow-ing
    the plan through implementation and beyond is, of course, easier than done. The
    payoff of a well-planned deployment is a more easily managed infrastruc-ture.
    Postdeployment, management becomes the key to the infrastructure’s stand-ing.
    Proper planning goes a long way toward making this possible.'
  merge: -1
