  md: '# Higher Density of Virtualized Systems


    +   - Disadvantages


    Host Kernel and Guest Compatibility


    The chroot system offers much in the way of enhanced security features and isolation;
    however, the greatest advantages of shared kernel virtualization are not in its
    security, although that''s certainly important to consider, but in its performance.
    With this kind of virtualization, you''ll get native performance for each individual
    system. Not only does each system perform at native speeds, but you can also have
    more than the standard number of VMs on a host. By standard number, we mean the
    number you could logically have on host system if you used memory as the limiting
    factor—leaving 1GB for the host and taking the rest of the RAM for VMs.


    The limit of chrooted systems you have on a host more closely resembles a standalone
    system supporting multiple applications. If you think of each chroot as an application
    instead of a VM, you''ll more accurately allocate resources and enjoy performance
    that surpasses many other types of virtualization.


    The disadvantage of shared kernel virtualization is a big one: All VMs have to
    be compatible with your running kernel. In other words, you can''t run Windows
    operating systems, Solaris, Mac OS X, or any other operating system that couldn''t
    run your system''s kernel on its own. Major web hosting providers have run this
    scenario for years so that customers get their own virtual server for their hosting
    needs. They don''t know that the system is virtual, nor can they contact the host
    system through their VM.


    # Solaris Containers (Zones)


    Solaris 10 comes with built-virtualization. The Solaris 10 operating system, itself,
    is known as the Global Zone. Solaris Zones are actually BSD jails, with its own
    virtual root that mimics a complete operating system and file system. When you
    create a new zone, a full file system is copied to the new zone directory. Each
    zone sees only its own processes and file systems. The zone believes it is a full,
    independent operating system; only the Global Zone has any knowledge of virtualization.


    Each zone essentially creates a clean sandbox in which you may install applications,
    provide services, or test patches. Solaris zones are a scalable, enterprise-level
    virtualization solution providing ease of use and native performance.'
