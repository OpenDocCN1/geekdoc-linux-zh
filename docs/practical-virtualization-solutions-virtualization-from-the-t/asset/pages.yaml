  md: '# CHAPTER 16 Deployment


    It’s interesting to note that the pattern of applications migrating to virtual
    environments is not unlike the migration pattern to Linux that began a decade
    ago. First came the edge applications (mainly web servers), then database those
    supporting back office apps, and eventually mission-critical-customer-facing apps.


    Visualization is being accepted at a much faster rate, not because it is not putting
    up against the legacy baggage that Linux faced. Nor does it appear to have the
    same learning curve or lack of support. And while it does bring its own issues
    (for example, reliability and ownership) it also offers the promise of savings
    with little effort, which it makes an even more appealing sell in the current
    economic climate.


    Unfortunately, this also creates many false assumptions that may end up being
    costly down the road for many enterprises.


    # KNOWING WHAT YOU HAVE: AUTODISCOVERY TOOLS


    We’ve made it abundantly clear that flipping the switch is easy and efficient.
    Bear in mind, however, that although provisioning may seem to go from weeks to
    hours, the bulk of time that goes into provisioning is outside of the virtualization
    process.


    For the initial deployment, the manual part of the process—getting the necessary
    sign-offs for the purchase order, ensuring license requirements will be met, readying
    the hardware, and so on—remains. Provisioning occurs at the end of this.


    Thus, the process before the provisioning must be fixed or it will be impacted.
    Automation tools are one way to mitigate this issue, and we will talk about it
    later in this chapter.


    Before you can automate processes, however, you must know what you’re working
    with. We touched autodiscovery tools in the previous chapter. Most large organizations
    have some of autodiscovery functionality in place, either as an individual tool
    or as part of a larger suite.


    Autodiscovery tools are important in any infrastructure, but they are particularly
    in a virtual infrastructure where the lines are less clear. Prior to deployment,
    they tell you what you have and where it is. After the initial deployment, they
    tell you where everything is. One of the value propositions of a virtual infrastructure
    is being able to move apps and data from box to box, often on-the-fly. Autodiscovery
    tools enable you to know exactly where your apps are at any given time.


    Webopedia defines autodiscovery tools as software that “collects data on a network
    and records any changes made to the network assets.” This means not just servers,
    but also switches, routers, NICs, storage devices, and in some'
  merge: -1
  pgno: 279
- img_proc: true
  md: '# Practical Virtualization Solutions


    cases anything that has an IP address. Some autodiscovery tools can also track
    changes to memory, software versions, and storage, as well as any new or deleted
    files and equipment added or removed.


    Some autodiscovery tools have traditionally focused on devices themselves. Many
    of these vendors have recognized the winds of change and added VM recognition
    and other capabilities that will benefit a virtual environment.


    If this sounds familiar, it''s because it is. Autodiscovery tools are by and large
    the same products that were sold as as “infrastructure monitoring tools” earlier
    in the decade.


    Thus, many enterprises, particularly large enterprises, have tools already in
    place that can assess the infrastructure. If you''re going with what you have
    in place, be sure the inventory and tracking capabilities extend to VMs and are
    capable of tracking VM migrations.


    You can probably get without an autodiscovery or monitoring tool if all of the
    following:


    +   - Your deployment is small (however, fewer ten servers and your returns on
    virtualization may be negligible).


    +   - You can locate every single piece of equipment in your data center.


    +   - You have no intention of migrating apps and data from one server to another.


    In other words, nearly all deployments require some sort of autodiscovery tool,
    and those that don''t may not deliver the ROI that makes a virtualization deployment
    worthwhile.


    You can choose from many autodiscovery tools. Both VMware and Citrix autodiscovery
    options: VMware vCenter Server offers autodiscovery among its many management
    options (well as provisioning, automation, and management capabilities) as does
    Citrix Essentials for XenServer, although it focuses more on automation than autodiscovery.
    For simpler or limited deployments, using the built-in functionality will likely
    suffice, and indeed many midsize deployments by it.


    For large-scale deployments, the heavy hitters are on hand to offer, in most cases,
    autodiscovery software that is frequently a module in an infrastructure orchestration
    or life cycle management suite. These products are becoming increasingly attuned
    to virtualization needs, and in many cases assume they are going into an environment
    that is at partially virtualized.


    Table 16-1 provides a sample of the most popular products on the market. For companies
    looking for an autodiscovery tool, particularly one that is part of a more'
  merge: -1
  pgno: 280
- img_proc: true
