- img_proc: true
  md: '# Practical Virtualization Solutions


    vendors have an element of unreliability to them. It is also easier for the unscrupulous
    to spin these numbers myriad ways.


    It is always smart to take any benchmark numbers with a grain of salt, and when
    it comes to memory management, an entire state grinder would come in handy.


    Also, be aware that this is an area where semantics are significant. Memory virtualization,
    for example, is completely different from virtual memory. When vendors are pooling
    feeds and speeds, it is critical to know which they are referring. The former
    may refer to memory pools or clusters, where the latter means an extension of
    physical or “real” memory.


    In its simplest form, memory refers to a chip''s capacity to hold data. A server
    that has N gigabytes of memory, therefore, can hold about N billion bytes (characters)
    of information. For years, this design worked fine, and adding more memory meant
    the server could process more data quicker.


    When virtualization enters the picture, things change. What was formerly one server
    with one operating system may now 16 VMs, with its own operating system. Although
    64GB of memory might have been just fine when it was functioning as a dedicated
    box, it no longer suffices, and not for the reasons you might be thinking.


    The virtualization vendors would like you to believe that you divide the 64GB
    by 16 and allocate 4GB to each VM, with some customization as needed for VMs that
    need more. But it doesn''t actually work that.


    By virtue of how OSes are designed, the hypervisor cannot actually allocate memory
    into each VM. Instead, it gives each OS instance a placeholder address for its
    memory and keeps track of its actual location. This gets dicey and complicated
    results in things like I/O latency and ballooning memory. This problem is hardly
    a reason to not visualize. There is no shortage of options to resolve this from
    the hardware level, to OEM-specific software to remedy the issue, to the hypervisor,
    to third-party software. Some of these solutions work in tandem.


    Their main goal is to keep the pipe moving by routing traffic to remove the bottleneck.
    This has become known as I/O virtualization.


    Vendors of all stripes have taken steps to mitigate it, and perhaps some day processors
    will function in such a way that it will not be an issue. The OEMs IBM and HP,
    for example, offer similar solutions that virtualize the I/O processes for their
    blade families. The virtualization providers seek to make changes at the hypervisor
    level. Meanwhile, a growing crop of independent third-party vendors, such as 3Leaf,
    Neterion, and Xsigo Systems, has sprouted. Virtualized I/O is becoming big business.'
