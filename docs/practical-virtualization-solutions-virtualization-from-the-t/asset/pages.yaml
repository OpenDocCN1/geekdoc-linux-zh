    (or orchestration) tools via development, OEM-like relationships, and full-on
    acquisition.


    # I/O VIRTUALIZATION


    I/O, as we discussed in Chapter 13, is a major issue for virtual environments.
    Internet.com’sServerWatch offers this metaphor: “I/O on VMs is a lot like the
    plumbing in an apartment building. If everyone flushes at once, there’s a mess.
    It is the job of the just or the virtual I/O handler to ensure that these flushes
    go in an orderly fashion so nothing gets overloaded, and everything goes through
    in a timely manner” (www.serverwatch.com/virtualization/article.php/3792201).


    This is largely unlike traditional I/O, which is directly related to memory and
    its impacts only the server, I/O virtualization also drags storage, networks,
    and even the operating system into the.


    With that in mind, there are many ways to handle I/O management. In general, minimal
    I/O management is built into the hardware and software, and that may be adequate
    for a test and dev environment, as well as an initial virtualization'
