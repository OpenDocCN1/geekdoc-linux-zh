    have to labor too hard to prove your point. Go back to IBM''s mainframe roots
    and you''ll find a long relationship with virtualization, although back then it
    was known as partitioning. The OEM''s first VM offering was released in August
    1972 (www.ibm.com/com/overview/) as VM/370. In 35-plus years, it has undergone
    many changes, not the least of which was its name. It has been known as VM/SP,
    VM/XA, VM/SP HPO, VM/IS, VM/ESA, and today goes by zVM, which has been around
    since October 2000 and is now in version 5.4.


    Note, that zVM is based on Blue Blue''s 64-bit z/Architecture and is limited to
    IBM''s system Z mainframes. IBM''s entry in the x86 space, although more recent,
    is less of a commitment, and it has been there for about a decade. IBM was one
    of the first OEMs to align itself with VMware, and at present much of its software,
    from Docker to WebSphere, assumes some degree of vitalization is in place in an
    infrastructure. Because IBM is also a services company, it provides a host of
    services centered around virtualization.


