  md: '# CHAPTER 6


    # Microsoft Virtual PC


    Virtual PC (VPC) was Microsoft’s original entry into the virtualization market.
    Never an innovator, Microsoft was fairly late to the virtualization party. In
    2003 it acquired Connectix, a company that developed virtualization software for
    Windows and Macintosh environments. Three years later, Microsoft released Virtual
    PC 2004 as an emulation for Mac OS X on PowerPC and a virtualization suite for
    Windows. The Windows version was free; the Mac version was not. A month later
    it announced the Macintosh version would not be ported to Intel-based Macs, thus
    cutting out the non-Windows market.


    In early 2007, Microsoft released VPC 2007, the current version in production.
    As expected, Virtual PC 2007 is available only for the Windows platform. Microsoft
    bills it as "Windows only"; however, most x86 operating systems, including Linux,
    can run inside VPC, although Microsoft does not officially support them. Key functionality
    in this release includes support for Windows Vista as both a host operating system
    and guest, support for 64-bit host systems, support for hardware-assisted virtualization,
    network-based installation of a guest operating system, and the capability to
    run virtual machines (VM) on multiple monitors. At this time, support fored links
    in a VM was eliminated.


    In May-2008, Microsoft released Virtual PC 2007 Service Pack 1, which basically
    added support for service packs of already supported operating systems.


    Originally viewed as a desktop product, VPC has also been getting some play as
    a server virtualization platform. It was never intended to be used as a server
    product, however. That Virtual Server and, later, Hyper-V’s domain. Hyper-V will
    be examined in Chapter 7, "Microsoft Hyper-V."


    In its original release VPC was essentially a standalone product. This will change
    with the release of Windows 7, where VPC gets a slight name change'
  merge: -1
  pgno: 111
- img_proc: true
  md: '(Windows Virtual PC) and fills a vital role: It facilitates the much publicized
    Windows XP mode and integrates it into the new operating system to enable virtualization.
    Other key capabilities include USB and multithread support, as well as folder
    integration between a host and its guests.


    At the time of this writing, a beta version has recently become available for
    download on Microsoft''s website, wwwmicrosoft.com/windows/virtual-pc/download.aspx.
    Because this is a beta and subject to change, this chapter will focus on Microsoft
    Virtual PC 2007, not Windows Virtual PC.


    # THE VPC CONSOLE


    The VPC Console is almost minimalist in size but not in function. The console,
    like most hosted virtualization software applications, keeps a list of all VMs,
    running or not, in its main window. This console is the primary interface for
    VM management, but VPC VMs can be managed unto the command line as.


    Figure 6-1 is a snapshot of our VPC Console. You can see that several VMs listed,
    and only one is currently running.


    FIGURE 6-1 The Microsoft VPC Console.


    ![](img/2ed981e74b223133167333db66866d4d_112_0.png)


    Unlike other virtualization softwares, Microsoft VPC launches each VM in its own
    window. Individual VM windows present advantages and disadvantages for users.
    Some think that it makes their workspace too cluttered, whereas others think that
    individual windows give each VM its own identity, defining more as a whole machine
    unto itself. Hyper-V, in contrast, has a console similar to other vendors'' virtualization
    software, where all VMs are centrally managed and run from the console interface
    application.'
