- img_proc: true
  md: '# Dumb Terminal


    Classic dumb terminals are almost nonexistent these days. Thin clients have taken
    their place as the next-generation dumb terminals. These devices have a small
    set of utilities embedded in them so they can be configured locally, remotely,
    via a web browser, or some other proprietary software.


    After the terminal is provisioned or configured, the user is automatically directed
    to the appropriate server when the unit is powered on. These devices are generally
    single-homed (configured for a single Terminal Server), unlike the smart terminals
    that can connect to a user-selectable array of available resources.


    Dumb terminals are cost effective, typically priced in the $200 USD neighborhood.
    Minimal cost, minimal configuration, and practically no maintenance makes this
    an excellent choice for a desktop virtualization solution. The major drawback
    to a dumb terminal is that it is single-homed.


    Terminal services receive high praise for speed, productivity, and ease of administration.
    Consider this desktop virtualization near perfect for all bandwidth situations
    from dial-up to Gigabit Ethernet LANs.


    # HOSTED DESKTOP


    The hosted desktop is the current VMware and Xen method of desktop virtualization.
    On the virtual machine (VM) host server system, you have several—possibly dozens—of
    desktop VMs. Users connect via clients (smart terminal, dumb terminal, or client
    software) to their specific VM and run their desktop as if it were local to them,
    with a few exceptions. The most notable exception is that thin clients have no
    local CD/DVD or floppy drives. This aspect of virtualized desktops is confusing
    and frustrating for some users who are using local drives from which they can
    copy files to their computers or to the server system. Most hardware clients are
    equipped with USB ports, so the capability to copy files to the virtual desktop
    or server system still exists.


    Second, but not devastating the lack of a CD or floppy drive, is that many of
    the new-generation hardware thin client devices also lack an operating system.
    The devices are remotely connected to a VM server system, connect to the appropriate
    VM, and present the user with the desktop system.


    Hosted desktop operating systems operate little in the way of saving time and
    effort, because each individual VM has its own set of applications, including
    the operating system itself, antivirus software, an Internet browser, and other
    programs specific to an individual desktop computer. The VM needs'
