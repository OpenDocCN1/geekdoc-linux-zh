  md: '# CHAPTER 17


    # Postproduction: Wrapping It Up


    As the deployment rolls out, the real day of reckoning arrives. The decisions
    made during the planning process will come back to haunt or help you when you
    go live. Theoretically, if you planned correctly, this stage is all about maintaining.
    Unfortunately, theory sometimes has little to do with reality, however.


    The good news is that nothing is permanent. Policies can be changed, even hardware
    can be purchased or swapped, virtualization environments can be changed. The bad
    side is that none of these things come cheap, in both monetary and other resources,
    and the more changes you have to make, the greater the chances for mistakes. After
    you''re live, mistakes become costly and could result in lost revenue, if, for
    example, a server goes down in the integration process.


    For purposes of this chapter, we will assume a successful initial deployment in
    a production environment. As we said previously, however, a virtualization deployment
    is never truly complete in the same sense that an Exchange or SAP rollout is complete.
    It is highly unusual for an enterprise to virtualize its entire data center overnight,
    and some analysts go far as to estimate that an end-to-end virtual infrastructure
    could take as long as seven years to build and roll out.


    Further complicating the picture is that virtualization is rarely a straight-line
    endeavor. This makes determining the how and when to implement a particular tool
    subjective, especially if one phase bleeds into another. Some of the tasks that
    must be done are not unique to this phase, and organizations should not wait until
    the metaphorical switch has been flipped to accomplish them. The earlier in the
    process you begin thinking about tools you will use and start integrating them,
    the smoother your deployment will be and the more effectively your infrastructure
    will operate.'
