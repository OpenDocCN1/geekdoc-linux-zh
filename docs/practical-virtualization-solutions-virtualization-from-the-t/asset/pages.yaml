    Enta USA is already moving away from Citrix as a way to save money. Servicing
    its customers through Citrix''s access portal costs Enta approximately $130 per
    user for them to connect to application .NET costs costs considerably. Enta has
    already begun the transition to .NET, with an even split between web-based and
