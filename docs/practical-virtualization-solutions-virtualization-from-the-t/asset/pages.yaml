    # Customizing Virtual Machines


    With the VM still off, you can edit the VM settings or properties by selecting
    Settings in the Actions menu. All editable settings for the VM are displayed in
    a new window, as shown in Figure 7-12.


    Fortunately, the Settings screen is self-explanatory. For each hardware type,
    there is a full explanation of your options for adding or changing a setting for
    the VM. One of the best features of Hyper-V is the capability to change the BIOS
    boot order from this screen. As you can see from Figure 7-12, the current setting
    is to Boot from CD, which is handy for the first boot to installation media.


    In contrast, in other virtualization software applications, you have to power
    on the VM and act quickly to enter the BIOS to make this same change. For more
    detailed instructions in how to proceed through the installation, consult the
    Appendix, "Virtual Machine Installation."'
