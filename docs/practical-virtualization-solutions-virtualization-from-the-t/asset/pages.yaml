  md: '# CHAPTER 5


    # Citrix XenServer


    XenServer began life as an open source project. Like so many open source projects,
    its roots are in research. It began life earlier this century as the XenSource
    project at the University of Cambridge. In 2003, it became publicly available.
    In the ensuing years, XenEnterprise, a commercial version of the paravirtualization-based
    open-source hypervisor, was born from the company that grew closely aligned with
    the project. In August 2007, Citrix announced plans to purchase XenSource. Shortly
    after the acquisition closed, Citrix introduced version 4 with the new branding.
    The open source version remains and Citrix can be found at Xen.org.


    Since then, Citrix has developed an ecosystem of management tools around XenServer,
    keeping the same look and feel as previous versions. With the release of version
    5, XenServer was made free, making it an even more desirable choice for server
    virtualization. XenServer, often referred to simply as Xen, is well known for
    its superior disk I/O, ease of use, and speed. This, perhaps, it is chosen in
    more than 95% of all clouds, including Amazon''s Elastic Compute Cloud (EC2).
    I''ve personally used XenServer since version 3.x and have never been disappointed
    in its features, speed, or overall usability. It is a wise and frugal choice for
    many organizations, from those with very small server rooms to large enterprises.


    # XenServer, THE HYPERVISOR


    XenServer, like ESXi, is a hypervisor, which means that the virtualization software,
    like ESXi, installs directly onto bare metal—a raw server system with no operating
    system. The operating system you interact with when you log in to the Linux-based
    console is itself a virtual machine (VM) installed as Domain0 (Dom0). Through
    this'
  merge: -1
  pgno: 91
- img_proc: true
  md: '# Practical Virtualization Solutions


    system you interact with the Hypervisor, a low-level program with which you do
    not interact directly.


    All other VMs are user domains (DomainU or DomU) whose resources are managed by
    the Hypervisor. To interact fully with the XenServer, create VMs, allocate resources,
    add storage, monitor performance, and add various repositories you''ll need to
    use XenCenter, which is covered in the next section.


    # XENCENTER—THE XEN CONSOLE


    XenCenter is known as XenCenter. It is the graphical management interface from
    which you will manage your virtual infrastructure. Figure 5-1 shows the XenCenter
    console of a freshly installed XenServer with no VMs attached. The name, xenserver-kppdqkmf,
    is the random name given to the XenServer upon installation. You may use this
    name or any other that you like—either by changing it or during XenServer installation.


    ![](img/2ed981e74b223133167333db66866d4d_92_0.png)


    FIGURE 5-1 The XenCenter console.


    To rename your XenServer in the XenCenter console, right-click the name and select
    Properties from the menu. The General tab opens by default. Change the name and
    click OK for the change to be applied. This name change has no effect on your
    XenServer installation or any VMs.'
  merge: -1
