  md: '# VIRTUAL MACHINE FILES AND FOLDERS


    After your VMs are up and running, it''s time to think about file and folder security,
    and filenames and roles.


    # File and Folder Security


    Because no operating system is associated with ESXi, file and folder security
    is handled by the VMware vStorage Virtual Machine File System (VMFS). You can''t
    directly manipulate or operate on the files, which adds the layer of security
    that you need for VMs and associated files.


    # File Names and Roles


    All VMware server-level products have the same file nomenclature and format. When
    you create a new VM, a folder is created with the name of your VM. The folder
    exists under your chosen datastore or VM repository folder. This is an organizational
    and security feature that ensures each VM has its own uniquely named folder to
    hold its own VM files.


    In the datastore, you''ll find several files representing your virtual drive image(s),
    VM description, lock files, snapshot files, a BIOS file, and a memory file.


    ![](img/2ed981e74b223133167333db66866d4d_85_0.png)'
  merge: -1
  pgno: 85
- img_proc: true
  md: '# Practical Virtualization Solutions


    The basic files are as follows for a VM named Debian4. These file types are common
    to all VMs.


    +   - Debian4.vmdk—This is the disk definition file (Disk Descriptor File). In
    it, you''ll find the number and filenames of the virtual disk files and the virtual
    drive geometry.

    - Debian4.vmx—The VM descriptor file. Like the .vmdk file, the .vmx file is plain
    text and can be edited directly. You may not edit either file when the VM is powered
    on.

    - nvram—The VM BIOS information file. This file is binary and can''t be edited
    directly. To change its settings, you must boot the VM and select BIOS Settings.

    - vmware.log (vmware-x.log)—These are the log generated when you start a VM and
    generally used for troubleshooting. You may erase the log files when the VM is
    powered off.

    - Debian4.vmsn—A binary snapshot state file.

    - Debian4.vmsd—The plain text equivalent of the .vmsen file.

    - Debian4-000002-s00x.vmdk—A virtual disk snapshot file. The 000x indicates this
    is the second snapshot items such as coins, part f00x.

    - Debian4.vmdk.WRITELOCK—If this file exists, the VM is powered on.

    - vmem—Virtual Machine memory (RAM) file. This file is the size of the amount
    of RAM set in your VM.

    - vmem-WRITELOCK—A powered-on VM vmem file.


    For a more in-depth discussion of these files and their contents, see Chapter
    3.


    # VMWARE ESXI IN THE REAL WORLD


    Based on Knoxville, TN, Jewelry Television is all about gemstones, proclaiming
    itself the largest retailer of loose gemstones. The company sells the jewelry
    through two main channels: a traditional shopping channel and its website, JTV
    (which also airs some of the programs shown on the TV channel); it also has a
    program for online affiliate sales.


    Jewelry Television started out as America''s Collectibles Network in the early
    1990s. Back then it sold collectible items such as coins, knives, quilts, and
    skin'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'care products. In 2000 it began to focus primarily on jewelry and gemstone
    stones, and it relaunched Jewelry Television in the spring of 2004.


    Although television remains its cornerstone (58 million U.S. households on a full-time
    basis), not surprisingly, a growing percentage of revenue comes from online sales.
    With that comes a corresponding increase in computing needs.


    Three years ago, the company decided it was time to upgrade somewhere between
    80 and 100 x86 machines. It opted to replace them with two new servers it describes
    as SAN-attached “workhouse servers” from HP running ESX.


    It set out to virtualize its entire infrastructure, except where valid arguments
    could be made to retain a dedicated physical box. The main Oracle database, which
    runs on SPARC hardware, for example, remains unvirtualized. Nor is the actual
    storage infrastructure virtualized. Storage is impacted, however, because everything
    virtualized must still be stored.


    The technology was an easy sell to the infrastructure group, and its members migrated
    easily. It took about six months to get most of the servers virtualized. The company
    was able to do so quickly in part because the virtual environment mimicked physical.
    It was deliberately mapped out in such a way that the underlying architecture
    of the virtual matched that of the physical, and it was largely a matter of plugging
    in Ethernet links.


    The bigger challenge came when it was time to migrate from ESX 2 to ESX 3. The
    software at time allowed only one live migration, so it was an all-nothing proposition.
    This has since changed, and VMware allowed live data store migration since version
    3.5 using the command line (one data store to another).


    The release of ESXi changed things for Jewelry Television, however.


    One of the major selling points of ESX was the server console. ESXi, in contrast,
    runs on bare metal. Bare metal refers to a raw server system with no operating
    system. For administrators who rely heavily on the agents in the console (for
    example, for running backup), ESX is the preferred option. With the next release
    of ESX scheduled to be the last to have a service console, such admins are clearly
    in the minority.


    Jewelry Television did not use any of this functionality, however, the admin,
    who did not take advantage of the console, viewed it as pure “bloat” and ripe
    for potential security vulnerabilities.


    As a result, Jewelry Television decided to be ahead of the curve and go bare metal.
    This migration was much more straightforward than the original, because all the
    heavy lifting of infrastructure planning had already been done. As promised,'
  merge: -1
  pgno: 87
- img_proc: true
  md: 'ESXi was up and running in less than 15 minutes. For systems on which ESXi
    comes preinstalled, this would be even quicker,


    Software maintenance has also been simplified. With ESX, updates were constant
    and needed to be made to each host. ESXi, in contrast, typically has one firmware
    upgrade per month, which means updates to two files and a reboot.


    No managed stops occurred at any point in the migration, however, a learning curve
    exists in the change between the two, because it did the way servers were managed.
    ESXi and ESX are both managed through VMware Virtual Infrastructure Client in
    the same manner as environments not licensed for vCenter. However, in ESX, you
    can remotely connect to the service console and issue commands on the host, whereas
    in ESXi, remote command line utility must be installed on the local workstation
    to issue remote commands against the APIs.


    In addition, some of the third-party tools are not immediately compatible with
    ESXi. Since that changed, and all now are compatible with ESXi, including file
    manipulation tools. Finally, file transfer was also somewhat kludgy process and
    not always easy as it was in ESX.


    The performance boost more made up for this, however. With more computing resources
    available for the actual VMs, even the developers noticing the improvements.


    In and itself, the virtualization endeavor has been successful. From an enterprise
    perspective, its success is even more pronounced: The company credits virtualization
    for enabling it to meet its goals.


    IT''s task was to build out an infrastructure that would support the growth of
    the company, and virtualizing the bulk of its infrastructure made it possible
    for Jewelry Television to grow to the size it needed to be.


    Today, Jewelry Television''s data center houses 70 ESXi hosts, XP desktops, close
    to 800 thin clients, close to 1,000 VMS—far from the two HP boxes it started out.
    With the link of its infrastructure is virtualized, including that thin clients
    connected to a server running ESXi. The two applications that remain on deicated
    servers are the customer-facing ones on its website and the main database.


    In terms of hardware, with all the most low-end servers on the market now geared
    toward virtualization, the choices are plentiful. Jewelry Television is by and
    a large Dell shop, although a few HP and Sun servers remain.


    For the most part, Jewelry Television''s IT infrastructure has expanded to meet
    its growing needs. However, with the first major build out of its network having
    taken place three years ago, some equipment is coming due for replacement. As
    hardware is cycled out, newer technology, such as Cisco''s Nexus 1000 virtual'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'switch, will replace it. The company is also considering infrastructure changes
    to incorporate VMware’s cloud computing infrastructure, vSphere.


    Because the virtualization is so pervasive within Jewelry Television’s data center,
    it takes great care not to differentiate between the physical and virtual, considering
    both to be the “data center.”


    It also makes patching a priority and keeps servers up to date with VMware Update
    Manager for updating VMware, MS WSUS for Windows Servers, and yum and up2date
    for Linux servers. Admins are careful to always maintain the same view in Virtual
    Center. All tools are disaster recovery services aware, with disaster recovery
    services and high availability used throughout.


    # SUMMARY


    VMware’s ESXi is a free enterprise-class hypervisor that has all the high-level
    attributes and features as VMware ESX. It lacks the console operating system (Dom0)
    but matches ESX in terms of performance and scalability in every other way.


    In this chapter, you’ve learned the basics of working with ESXi and how to install
    and customize VMs.'
  merge: -1
