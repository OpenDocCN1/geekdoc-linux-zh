  md: '# CHAPTER 16


    # Deployment


    We often joke that a well-planned virtual deployment follows four basic steps:
    Install software, configure software, provision virtual machines (VM), and go
    home. Theoretically, if you planned properly and determined which technology is
    best suited to meet your objectives, the actual deployment is fairly simple. It
    is a matter of following the instructions laid out in Part 2 for your virtualization
    environment of choice on live servers, provisioning the physical servers into
    VMs, and migrating data and apps to the VMs.


    It is in fact that easy. What is not easy is deploying well.


    However, if you planned properly, your path to a virtual infrastructure will be
    smoother than that of an organization that did not. That does not mean issues
    won''t crop up as your virtualization infrastructure moves off of the drawing
    board and into the data center. Nor does it mean when you''re done, you''re well
    and truly done. Very few deployments are done in one swoop, which means you''ll
    be back to the deployment phase time and again. It is not unreasonable to assume
    a full-scale virtual deployment in a large enterprise could take years before
    it is considered.


    Chapter 15, "Laying the Foundation: The Planning Stage," focuses on planning your
    virtual infrastructure; this chapter focuses on the nitty-gritty that comes with
    the actual rollout and flipping the switch. It discusses the deployment itself
    and the decisions that must be be made. It assumes, however, that objectives have
    been set, hardware is appropriate, and people issues (ownership and others) have
    been worked out as best as they can be. We also assume that the virtual environment
    has been selected, and a test and development (frequently referred to as test
    and dev) environment is in place.'
