  md: '# Practical Virtualization Solutions


    agencies, labels, and pretty much anyone interested in the music industry. Its
    algo-rith, which it guards closely, can measure everything from an artist''s popularity
    to the effectiveness of a marketing campaign. It also makes some of its data avail-via
    MuZoid, a Twitter app where users put in an artist and it spits out similar music
    the user might enjoy.


    Despite musicmetric''s data-centric business model, like most startups, it did
    not have a lot of cash to run on hardware or software. When it launched in Febru-ary
    2009, the bulk of its server room came from the Sun Startup Essentials program,
    which gets companies up and running on Sun Microsystems'' hardware at a greatly
    reduced cost. The program provides greatly discounted servers and storage, open
    source software, discounted partner hosting, and free technical advice and training.


    Currently, musicmetric is running nine servers at a collocation facility with
    more on order, as well as four at its offices. The servers bring enough raw iron
    for day-to-day use of data collection and analytics. But compute power is the
    key asset of musicmetric''s business, whether for development efforts or number
    crunching. This meant the company needed to find a way to access increased-pute
    power as needed.


    At first, a cloud model was considered and used, but the company quickly determined
    that having cloud available on a 24/7 basis wasn''t financially feasible. It did,
    however, to use cloud in short periods on large projects. The needs of a given
    task will determine whether cloud is be used. It will likely come into play with
    disaster recovery, for example, but not for autofailover. In add-tion, down the
    road, any old equipment lying about may be added to the mix as a resource.


    The other option was to buy additional servers, but too, represented signific-ant
    expense for something that was not 100% needed all the time.


    One issue for musicmetric was finding a way to meet the computing needs of its
    developers. Development is an operational expense for the company, and server
    capabilities are needed for almost half of its nine employees. Because today''s
    desktop machines have capabilities that surpass the servers of only a few years
    ago, musicmetric found it able to use desktop PCs running Windows, Solaris, and
    Linux on the back end to accomplish its needs.


    But although the desktop machines are adequate for development, they are not up
    to snuff for data crunching. As cheaper boxes, they aren''t all being used at
    full capacity all the time. Rather than invest in additional hardware, musicmetric
    looked for a way to harness their cycles to accomplish the necessary tasks.


    Sun''s VirtualBox was believed to be well suited for the task. Two other checks
    in VirtualBox''s favor were that musicmetric was already dealing with Sun through
    the hardware program, and VirtualBox is free.'
