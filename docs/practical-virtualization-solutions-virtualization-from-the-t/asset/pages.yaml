  md: '# # BEYOND FORM FACTOR, FILLING THE FOOTPRINT


    After you''ve decided on a form factor, it''s time to decide what you want inside
    the box. Looking at how the full package approaches virtualization is important,
    but before that can be examined, it is important to understand what is going on
    at a component level. Currently, AMD and Intel have a lock on x86 hardware from
    OEMs. They have been building virtualization support into their chips since 2005,
    and the latest iteration from both vendors is intended for servers that will be
    virtualized. Thus, if the hardware on board being purchased released any time
    after early 2007, it''s safe to assume the processor will handle virtualization
    just fine. Slightly older hard-ware may be fine as well, but be sure to check
    its specs carefully against those each vendor recommends, and understand that
    performance needs expand with time.


    Both VT and AMD-V are considered to deliver what is called “hardware-assisted
    virtualization.” With hardware-assisted virtualization, the hypervisor uses processor
    extensions to “intercept and emulate privileged operations in the guest.” The
    key word in this description is “assisted,” however. The environment plays out
    is still very reliant on the hypervisor itself, and as one AMD whitepaper notes,
    a hypervisor that makes use of hardware-assisted virtualization “must provide
    the illusion that the guest is running on physical hardware. For example, when
    the guest uses processor’s paging software or address translation, the hypervisor
    must ensure that the guest observes the equivalent behavior it would observe on
    nonvirtualized hardware.


    The company notes that AMD-V accomplished this by allowing “the hypervisor to
    specify how the processor should handle privileged operations in guest itself
    without transferring control to the hypervisor.”'
