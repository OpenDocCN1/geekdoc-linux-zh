    # MITIGATING I/O AND MEMORY ISSUES


    I/O and memory issues are related to one another but are not synonymous. From
    a technological standpoint, memory and I/O are a combination of the elephant in
    the room, 800-pound gorilla, or an albatross around your neck, depending on which
    side you''re on. Like with of the data center, when I/O and memory are working
    as expected and everything is going along and well, no one notices. When bottlenecks
    become the norm, however, I/O and memory are the first to be blamed.


    You could, of course, throw more memory at the problem, but this isn''t effective
    in the long term, and it could get costly. An even more futile solution is to
    up the processing power. It is very likely that the processing power already outstrips
    what the memory can handle


    Memory management is a complicated affaire. Entire books can (and have been) written
    about it. However, just as it was important to be able to differentiate between
    the processors, it is important to have at least a rudimentary understanding of
    how memory and I/O work in a virtualized environment and why it matters. If you
    have no desire to be an expert in memory and I/O issues, you should be cognizant
    of the issue when purchasing new hardware so as not to be fooled by a vendor.
    Exploring some of the options will also help managing the hardware less less of
    a headache down the road.


    In a perfect world, you would plan up front to ensure that this does not become
    an issue, and you would have a plan in place for how to treat it if it does. You
    would also not skimp on hardware. Unfortunately, real-world computing environments
    coming with budget and the hardware these budget dollars rarely resemble their
    benchmarked counterparts. Numbers cited by even the most honorable of'
