  md: '# CHAPTER 14 Beyond the Box


    deployment. it''s one thing to take a chance on back-office apps running slowly;
    it''s quite another when your mission-critical applications or customer-facing
    applications hit a bottleneck.


    The OEMs and virtualization vendors are well aware of its criticality and are
    addressing the issue in various ways. Dell, for example, has partnered with Xsigo
    to offer Xsigo I/O Director with its PowerEdge servers and storage solutions.
    This enables users to manage I/O resources from multiple vendors from a single
    console, as opposed to cherry picking from each vendor. The other major OEMs also
    integrate levels of I/O and virtual I/O management into their offers, as noted
    in Chapter 13.


    The virtual environments themselves address I/O. Their approaches differ significantly,
    VMware ESX uses what it calls the "direct driver model." It certifies and hardens
    I/O to work with the ESX hypervisor, in some cases, modifying some of its capabilities
    (such as CPU scheduling and directing memory resource) to more efficiently process
    I/O loads from multiple VMs.


    In contrast, Citrix XenServer and Hyper-V, which have similar architectures, use
    standard device drivers in their management partitions. They allow all VM I/O
    to generic drivers installed at the operating-system level (which Linux or Windows)
    that is open in the hypervisor''s management partition.


    Hyper-V includes a Windows Server virtualization feature known as Enlightened
    I/O. Enlightened I/O, according to Microsoft mdn.microsoft.com/en-us/library/cc768520.aspx
    is a specialized virtualization-aware implementation of high-level communication
    protocols (for example, SCSI) using VMBus—a channel-based communication mechanism
    that facilitates inter-partition communication and device enumeration on systems
    with multiple active virtualized partitions—to bypass the emulation layer. This
    speeds up communication, but for work, the "enveloped" guest must be both hypervisor
    and VMBus aware. Hyper-V enlightened I/O and a hypervisor-aware kernel are provided
    via installation of Hyper-V integration services. Integration components, which
    include virtual server client (VSC) drivers, are also available for other operating
    systems.


    Citrix'' XenServer is known for having better disk I/O than VMware (hence its
    popularity with cloud vendors), but VMware still dominates in the majority of
    deployments. Figure 14-2 illustrates the differences between the ESXi architecture
    and those of Hyper-V and Xen.


    # Supplemental Products


    As virtual infrastructures expand and VMs become more dense, the built-in I/O
    management may not be enough. A growing market of third-party solutions has cropped
    up to alleviate this perceived need. Some of these products from companies that
    deal purely with I/O management, and in some cases they are the flagship product
    of a company focusing on virtualized I/O management.'
