  md: '# To Virtualize or Not to Virtualize?


    That''s the first question you''ll have to answer for yourself before investing
    any significant amount of time or money in a virtualization project. Your first
    step into virtualization should be to try out some virtualization products for
    yourself: Demos and screencasts aren''t the same as experiencing firsthand.


    This chapter is for those who haven''t quite decided to make the virtualization
    commitment yet. This chapter explores reasons to use virtualization products and
    reasons not to. After you have read this chapter, you can make a more informed
    decision about whether virtualization will work for you.


    # A VIRTUAL HISTORY


    Virtualization, despite what many believe, did not begin in 1999 with the release
    of VMware''s first product. It began about 40 years ago on the mainframe platform
    at IBM. At that time, virtual machines (VMs) were called pseudo machines. Originally,
    the mainframe used the control program to allocate resources and to isolate the
    various instances of these pseudo machines from one another.


    The contemporary version of the control program is called a hypervisor, which
    is a VM monitor that''s installed directly on what is known as bare metal. Bare
    metal is a new term for a computer, typically a server system, with no operating
    system installed on it. It is hardware only. The hypervisor is not directly accessible
    but employs what''s known as a Domain0 VM that is an operating system that feels
    as it''s installed on the bare metal as the primary operating system. Through
    this primary VM the user interacts indirectly with the hypervisor.'
  merge: -1
  pgno: 27
- img_proc: true
  md: 'Hypervisor technology is one of several types of VM technology that will be
    discussed further in Chapter 9, “Server Virtualization in Action.”


    # VIRTUALIZATION EXPLAINED


    The “formal” definition of virtualization refers to physical abstraction of computing
    resources. In other words, the physical resources allocated to a VM are abstracted
    from their physical equivalents. Virtual disks, virtual network interface cards,
    virtual LANs, virtual switches, virtual CPUs, and virtual memory all map to physical
    resources on a physical computer system. The host computer “sees” its guest VMs
    as applications to which its resources are dedicated or shared.


    There are many types of virtualization: application, platform, network, and storage.
    Typically, when someone mentions virtualization, reference is to platform virtualization.
    Platform virtualization is the use of server hardware to host multiple VMs as
    guests. Each VM is a consistent virtual hardware environment onto which an operating
    system is installed. Each guest VM operates independently of all other guests.


    A host computer is equipped with sufficient hardware resources to donate computing
    power and disk space to its guests. A typical host system consists of multiple
    multicore processors, several gigabytes (GB) of RAM, several terabytes (TB) of
    disk space, and network attached storage (NAS) or a storage area network (SAN).


    # VIRTUALIZATION WORKLOAD CANDIDATES


    A common question among considering virtualization is, “What can and cannot be
    virtualized?” Any underutilized hardware workloads can be successfully virtualized.
    Prime virtualization candidates are web servers, mail servers, other network servers
    (DNS, DHCP, NTP), application servers (WebSphere, WebLogic, Tomcat), and database
    servers. There’s also no limitation or restriction based on which operating system
    you use. Windows systems are equally good candidates for virtualization as Linux,
    Solaris, and others.


    Load-balanced servers work well in virtualized environments because their workloads
    can be spread out over multiple server systems.


    # CONSOLIDATING WEB SERVICES WITH VMs


    Web services are particularly well suited for consolidation into VMs. Services
    as web databases, static websites, and dynamic sites, including those that use
    Java,'
  merge: -1
  pgno: 28
- img_proc: true
  md: '.NET, PHP, Python, and other dynamic languages, are easily migrated to virtual
    infrastructure.


    Following are the top five reasons to consolidate web services:


    +   - Mean time to restore is too long.

    - Infrastructure is suffering from aging hardware.

    - Infrastructure is out of capacity.

    - Systems are underutilized.

    - The economy of virtualization.


    # Mean Time to Restore


    Mean time to restore (MTTR) is the average amount of time it takes to restore
    a service to customers after the service goes offline. Virtualization shortens
    this time by having snapshots or backups of entire VMs available for restoration
    of failed services. A direct file copy restoration is a far quicker method for
    restoring services than installing a new system and then fumbling through differential
    backups bringing a system up to date and back online.


    # Aging Infrastructure


    Hardware life is short. Life expectancy for hardware infrastructure is about three
    to four years. The reason for the short life expectancy of hardware is that failure
    rates increase dramatically after four years. A general rule on the true life
    expectancy of hardware is the length of the manufacturer''s warranty on your product.


    Virtualization is a clear winner in the aging infrastructure dilemma. Sure, your
    VM host system will get old, become obsolete, or go lease, but your VMs never
    do any of those things. You can keep adding RAM, CPU, disk, virtual NICs, and
    other peripherals regardless of the physical hardware sitting under your VMs.
    You can even upgrade the OS upgrading your virtual hardware to support it.


    # Infrastructure That Is Out of Capacity


    A physical system has capacity limits that can''t be changed. A single CPU system
    will always be a single CPU system. If your system has a maximum RAM capacity
    of 4GB, you can add more. These limitations don''t affect VMs. As long as your
    host has available capacity and your virtualization software supports it, you
    can add capacity to your VMs.'
  merge: -1
  pgno: 29
- img_proc: true
  md: '# Underutilization


    As noted earlier, underutilized systems are perfect for virtualization and consolidation—not
    because the VM will be more utilized than the physical one, but you won''t have
    the physical machine sucking power, requiring cooling, and taking up space.


    # Economy of Virtualization


    In addition to being an economic solution, virtualization also provides an economy
    of scale. You can easily convert two or more physical servers, which were set
    up in a high availability (HA) configuration, to virtual ones. You can also add
    to that HA solution with virtual systems while keeping your physical ones. No
    added hardware expense is associated with the added HA capacity.


    # PRACTICAL ASPECTS OF VIRTUALIZATION


    There’s a lot of buzz surrounding virtualization and you might be asking yourself,
    “Why do I need to virtualize anything?” This is a legitimate question and the
    answer is easy. First, it is a money-saving technology. By usingized resources,
    you’ll save significant money on hardware, power, cooling, and possibly IT staff.


    Beyond the excitement and the obvious cool factor of virtualization, practical
    aspects exist, too. The following list summarizes those aspects.


    +   - Minimize hardware costs

    - Provide disaster recovery

    - Consolidate idle workloads

    - Balance loads

    - Test software

    - Centralize server management

    - Conserve power

    - Deploy servers faster


    # Minimizing Hardware Costs


    It’s easy to see that virtualization eases the burden of purchasing more hardware
    each time a new system is put in place. The question is, how cost-effective is
    it to do so? Consider the following scenario:'
  merge: -1
