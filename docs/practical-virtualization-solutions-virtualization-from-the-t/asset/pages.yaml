    15 to 45 minutes to complete in the process of creating a dedicated system.


    For our Debian-based mail server, we must prune out all unnecessary daemons

    (services) and check for open ports that may offer an attacker opportunity to
    hack

    our system. We downloaded and installed the Nmap network security auditing tool

    from www.nmap.org. This tool is available as source code, Linux/UNIX packages,

    and as a Windows installer.


    The NMap tool assists you in checking your new system for TCP and UDP

    network ports so that you can make informed decisions about which to turn off.

    When we performed an intense scan of our new Debian system, we found that we had

    three open ports. Table 9-1 shows the output from NMap for that system.


    # TABLE 9-1 NMap Results for Debian Mail Server Scan


    | PORT | PROTOCOL | STATE | SERVICE | VERSION |

    |---|---|---|---|-|

    | 22 | tcp | Open | Ssh | OpenSSH |

    | 25 | tcp | Open | Smtp | Postfix smtpd |

    | 111 | tcp | Open | rpcbind |


    Although we have three open ports, only two are essential: SMTP and SSH. You

    argue that SSH is not absolutely necessary, but we prefer to keep it. rpcbind

    (rpc.statd) is a good candidate for removal because the mail server does not require

    Network File System (NFS) or any other Remote Procedure Call (RPC) program to\operate
    normally.


    The same service pruning can be done for Windows systems, although more

    caut should be taken when doing so. Disabling services can be devas-

    tating a Windows system. We scanned a virtual Windows 2003 server that acts as

