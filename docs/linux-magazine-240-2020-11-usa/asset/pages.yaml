  md: '# IN-DEPTH


    Mistborn


    The developer recommends 1GB RAM and 15GB memory for WireGuard with Pi-hole. If
    you want to use the Cockpit management tool, you need at least 2GB RAM. If services
    like Jitsi Meet, Nextcloud, Jellyfin, Rocket.Chat, Assistant, or ONLYOFFICE enter
    into play, you need at least 4GB RAM, which also increases the storage space requirement
    to around 25GB. For videoconferences with Jitsi Meet, 10GB bandwidth is optimal.


    Alternatively, you can run Mistborn in the cloud, as long as the cloud environment
    supports PostgreSQL databases. Options are available for about one dollar per
    month.'
