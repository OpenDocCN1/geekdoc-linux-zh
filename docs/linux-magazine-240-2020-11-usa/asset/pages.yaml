    The Qemu [2] and Bochs [3] emulation tools have proven useful for building a virtual
    environment.


    One way to create a bootable disk with as little overhead as possible (and allow
    it to receive regular updates) is to use a FAT-formatted disk image with the Grub
    1 boot manager [4] (Figure 1).


