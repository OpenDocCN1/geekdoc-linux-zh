    # Linux Magazine 20th Anniversary Archive DVD


    # Linux Magazine Archive DVD


    This month''s DVD includes the 2020 edition of the Linux Magazine Archive DVD
    – every previous issue of Linux Magazine on a single, searchable disc. Browse
    the pages of every article we''ve ever published, and experience our special brand
    of technical yet accessible how-to-insights.


    If you want to learn about a common tool in the


    open source space, search this disc – we''ve


    probably written about it more than once over


    the last 20 years. Catch all the articles


    missed – on scripting, system administration,


    security, containers, cloud computing, Raspberry Pi, and more! Discover desktop
    applications that will save you time and simplify your life, and


    relive important moments in the history of Linux: The SCO case, the Novell/ Microsoft
    pact, the birth of Git, the mobile revolution, ... .


    All the issues on this disc would cost you about $3,800 in our shop – if they
    all still existed, but many older issues are out of print: The only way to experience
    them is through the Linux Magazine Archive DVD!'
