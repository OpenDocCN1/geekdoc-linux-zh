    # Three Major Linux Threats Discovered


    In less than a week, it has been reported that Linux has been found to be vulnerable
    to three different attacks. This should come as no surprise, given the steady
    rise in popularity Linux has enjoyed over the last year.


    The first attack is a cryptomining dedicated denial of service (DDoS) attack,
    named Lucifer. This hybrid DDoS botnet was first known for infecting Windows machines
    with Monero cryptomining bots. That attack


    is now scanning for and infecting Linux serv-


    ers and desktops. The Linux version of the


    Lucifer botnet has the same capabilities as


    the Windows version, but it can also be


    used in HTTP-based DDoS attacks.


    The next attack, dubbed FritzFrog, is an-


    other botnet that was discovered breaching


    SSH servers starting in January 2020. This


    bot, written in Golang, has been found to


    target systems within the government, ed-'
