    # VirtualBox Now Supports Linux Kernel 5.8


    Linus Torvalds said that the Linux Kernel 5.8 was the largest release of all time.


    Although the vast majority of the changes to the kernel was code cleanup, there
    were a number of additions to the supported hardware and even some new features.
    But due the size of this new kernel, one would have thought it might have taken
    considerable time for the likes of VirtualBox to come out with support.


    That is not the case.


    With the release of VirtualBox 6.1.14, the newest kernel is officially supported.


    This means you can not only run VirtualBox on Linux distribution hosts that use
    the 5.8 kernel, you can also run those same distributions as guest virtual machines.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'But don’t think the 6.1.14 maintenance release is only about supporting the
    new kernel. This latest release also includes plenty of bug fixes for Windows
    and macOS


    hosts and other fixes such as:


    +   * Fixing a regression in HDA audio emulation

    * Fixing webcam passthrough and audio input issue on macOS Mojave and newer

    * Fixing an issue in Windows host serial port implementation

    * Fixing an issue when copying HTML data to the shared clipboard Of course, the
    big news is the support for the new kernel. For a more complete listing of the
    changes, read the changelog ( https://www.virtualbox.org/wiki/Changelog).


    Download the latest version of VirtualBox (as well as the Extension Pack and the
    SDK) from the official download page ( https://www.virtualbox.org/wiki/Downloads).


