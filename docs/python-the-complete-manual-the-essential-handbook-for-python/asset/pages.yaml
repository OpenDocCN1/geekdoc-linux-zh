  md: "# Use Python with Pi\n\n# Control an LED using GPIO\n\n# Wiring the board\n\
    \n# Set up programming environment\n\n07 Plug one wire into the 1 pin, and the\
    \ other end into the breadboard. Note that it doesn't matter where you plug it\
    \ in, but make sure there are empty slots around it to add the LED resistor to.\
    \ Now get another wire\n\n12 Now, we need to be able to do a little more than\
    \ just turn a light on - we want to be able to control it via code. Set up new\
    \ Raspberry installation (a guide to this is on page 28). You don't need a GUI\
    \ for it - all can be done via the terminal if you wish. Before starting, it's\
    \ best to check everything is up to date:\n\n```\nsudo apt-get dist-upgrade\n\
    ```\n\n# Add another wire\n\n# Open terminal\n\n08 Place the end of the wire into\
    \ pin number 6 (ground) and the other end onto the breadboard, making sure to\
    \ leave room for the resistor, depending on how large it is. Next, get your resistor\
    \ ready. You can use a higher or lower than 270 ohms, but not using a resistor\
    \ at all will likely blow the LED.\n\n13 Assuming we want to use the GUI, rather\
    \ than SSH into the Pi, open up a new terminal window by double-clicking on the\
    \ LXTerminal. Then enter su followed by password or add prefix any commands with\
    \ sudo.\n\n+   - su\n- followed by password or add\n- sudo\n\n# Download GPIO\
    \ library\n\n# Add the resistor\n\n14 There is a handy GPIO Python library that\
    \ makes manipulating the GPIO pins breeze. Within the download file, extract it\
    \ with tar. This will get all the files in a new directory.\n\n```\nwget https://pypi.python.org/packages/source/R/RPI/RPI.GPIO-0.5.2a.tar.gz\n\
    tar xzf RPI.GPIO-0.5.2a.tar.gz\ncd RPI.GPIO-0.5.2a\n```\n\n# Install the library\n\
    \n09 Next we need to add our to the ground wire on the breadboard, and the other\
    \ end on the slot 3V3 wire all to the LED when we add it in a second. Note that\
    \ there is no correct or incorrect way to add a resistor.\n\n15 Now we need to\
    \ install the library. This is a simple case using Python's install method so\
    \ we need the version of Python. Make sure you are in the directory of the library\
    \ before running this command.\n\n# Add the LED\n\n```\nsudo apt-get install-python\n\
    sudo setup.py install\n```\n\n# Power up\n\n10 Grab your LED and place the 'bent'\
    \ leg next to 3V3 wire in the breadboard. Place the other leg to the resistor\
    \ opposite the ground wire. This completes the circuits and we are ready to test\
    \ out our little.\n\n# Import the library in a script\n\n16 Create a new Python\
    \ script. Import the main GPIO library and we'll code it in a try-except block.\
    \ Save the file using Ctrl+X and choosing 'yes'.\n\n11 Nov plug your micro-USB\
    \ cable and either plug it into the wall, or plug it into a computer or laptop\
    \ (and powered on). You should see the LED light up. If not, then check your connections\
    \ on the breadboard of Pi, or try a different LED.\n\n```\ncd /\ncd Desktop\n\
    sudo nano gpio.py\ntry:\n    import RPI.GPIO as GPIO\nexcept RuntimeError:\n \
    \   print(\"Error importing GPIO lib\")\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_125_0.png)"
