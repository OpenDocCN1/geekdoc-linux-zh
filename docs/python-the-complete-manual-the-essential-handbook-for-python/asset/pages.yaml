    Now we have to replace our root widget\n(returned from 'App.build') with a 'TicTacToeGrid'\
    \ and\nwe can see what our out looks like.\n\n```\nclass TicTacToeGrid(GridLayout):\n\
    \    def __init__(self, *args, **kwargs):\n        super(TicTacToeGrid, self).__init__(*args,\
    \ **kwargs)\n        for row in range(3):\n            for column in range(3):\n\
