  md: "# Code your own Twitter bot\n\n# Use Python with Pi\n\n# Creating an access\
    \ token\n\n```\ndef timestr_to_datetime(timestr):\n    # Convert a string like\
    \ Sat Nov 09 09:22:55 +0000\n    # 2013 to a datetime object. Get rid of the timezone\n\
    \    # and make the year the current one\n    timestr = \"({0})\".format(timestr[:19],\
    \ datetime.year)\n```\n\n03 Go to the Settings tab and change the Access type\
    \ from 'Read' to 'Read and Write'. Then click the 'Update this Twitter application's\
    \ settings' button. Next create an access token. Click 'Create token' button to\
    \ refresh the page, you will have consumer key and access secret and access token\
    \ secret. This is everything we need to authenticate with Twitter.\n\n```\n# We\
    \ have Sat Nov 09 09:25:53\nreturn datetime.strptime(timestr, \"%a %b %d %H:%M:%S\
    \ %Y\")\n```\n\n# Authenticating with Twitter\n\n```\ndef retweet_task(self, screen_name):\n\
    \    # Retweets any tweets we've not seen\n    for user in timeline:\n       \
    \ print(\"Checking for new tweets from {}\".format(screen_name))\n```\n\n04 We're\
    \ going to create our bot as a class, where we authenticate with Twitter in the\
    \ constructor. We take the tokens from the previous steps as parameters and use\
    \ them to create an instance of the Twitter API. We also have a variable, last_run,\
    \ which is set to the current time. This is used to check if there are new tweets\
    \ since.\n\n```\n# Get list of the latest tweets\ntimeline = self.api.get_user_timeline(screen_name=screen_name)\n\
    \n# Loop through each tweet and check if it was\n# posted since we were last called\n\
    for t in timeline:\n    tweet_time = datetime.parse(t['created_at'])\n    if tweet_time\
    \ > self.last_run:\n        print(\"Reteting ({})\".format(t['id']))\n       \
    \ self.api.retweet(id=t['id'])\n```\n\n# Retweeting a user\n\n05 The first thing\
    \ we need to get is a list of the latest tweets. We then loop through each string,\
    \ and get its creation time, which is then converted to a datetime object. We\
    \ then check if the tweet's time is newer than the function was last called -\
    \ and if we retweet it.\n\n```\nif __name__ == \"__main__\":\n    # The consumer\
    \ keys can be found on your application's\n    # Details page located at https://twitter.com/\n\
    \    key = \"YOUR_KEY\"\n    # The access tokens can be found on your application's\n\
    \    # Details page located at https://twitter.com/apps\n    a_token = \"YOUR_ACCESS_TOKEN\"\
    \n    a_secret = \"YOUR_ACCESS_SECRET\"\n```\n\n# The main section\n\n06 The main\
    \ section is straightforward. We create an instance of the bot class using tokens,\
    \ and then get into an infinite loop. In our loop, we check for new tweets from\
    \ the users we are monitoring (we could run the task with different users), update\
    \ the time every everything was last run, and sleep for five minutes.\n\n```\n\
    # Create an instance of the bot class\nbot = bot(c_key, c_secret, a_token, a_token_secret)\n\
    \n# Retweet anything by @LinuxUserMag every 5 minutes\nwhile True:\n    # Update\
    \ the time after each retweet_task we're\n    # only new retweet stuff\n    twitter.retweet_task(\"\
    LinuxUserMag\")\n    twitter.last_run = datetime.now()\n    time.sleep(60)\n```\n\
    \n![](img/f16311c48f0c39ab87b1836be5339b9e_122_0.png)"
