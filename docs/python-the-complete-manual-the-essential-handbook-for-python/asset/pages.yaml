  md: "# Create with Python\n\n# Pivaders part 2: graphics and sound\n\n# Loading\
    \ the sprite sheet\n\nSince we're inheriting from the Sprite class to create our\
    \ Player class, we can easily alter how the player looks by changing pygame. First,\
    \ we need to load our sprite-sheet with pygame.image.load(). Since we made it\
    \ with a transparent background, we add convert_alpha() to the end of the line\
    \ so the sprite frames correctly (without any background). Then we use subsurface\
    \ to set the initial Player image to the middle of the sheet. We define pos, which\
    \ has an initial value of 5. Changing this will alter the image drawn to: '0'\
    \ would draw it leaning left; '11' fully to the right.\n\n```\nGameState.end_game\
    \ = False\nGameState.start_screen = True\nGameState.vector = 0\nGameState.shoot_bullet\
    \ = False\n```\n\n```\ndef control(self):\n    for event in pygame.event.get():\n\
    \        if event.type == pygame.QUIT:\n            GameState.start_screen = False\n\
    \            GameState.end_game = True\n        if event.type == pygame.KEYDOWN\
    \ \\\n            and event.key == pygame.K_ESCAPE:\n                GameState.start_screen\
    \ = False\n                GameState.end_game = True\n                self.kill()\n\
    \        if GameState.start_screen == True:\n            keys = pygame.key.get_pressed()\n\
    \            if keys[pygame.K_LEFT]:\n                self.animate_left = True\n\
    \                self.animate_right = False\n            elif keys[pygame.K_RIGHT]:\n\
    \                self.animate_right = True\n                self.animate_left\
    \ = False\n```\n\n# Animation flags\n\nSlightly further down the list in the initializing\
    \ code for our Game class, we set two flags for our player: animate_left and animate_right.\
    \ As we use these in the Control method of our Game class, we will use them to\
    \ set True when we want animations to happen and False otherwise. It also allows\
    \ us to automatically animate the player sprite back to its natural resting state\
    \ (otherwise the ship will continue as if it's flying left when it has stopped).\n\
    \n```\nself.GameState.vector = 0\nself.animate_left = False\nself.animate_right\
    \ = False\n```\n\n```\nif keys[pygame.K_SPACE]:\n    if GameState.start_screen:\n\
    \        GameState.start_screen = False\n        self.lives = 2\n        self.make_player()\n\
    \        self.make_defenses(1)\n```\n\n```\nGameState.shoot_bullet = True\nself.bullet_fx.play()\n\
    ```\n\n# The animation method\n\nWe use flags in the code for the player: animate_player().\
    \ Here we use nested if to control the animation and physically set the player\
    \ image. It states that if the animate_right flag is True and the current position\
    \ is different from what we want, we increment the animate_pos variable and set\
    \ the player image. The Else statement animates the sprite back to its resting\
    \ state and the same logic is applied in the opposite direction.\n\n```\ndef animate_player(self):\n\
    \    if self.animate_right:\n```\n\n```\nif self.animate_pos < 10:\n    self.image\
    \ = self.ship_sheet.subsurface(self.animate_pos*64, 0, 64, 64)\n    self.animate_pos\
    \ += 1\n```\n\n```\nelse:\n    if self.animate_pos > 5:\n        self.animate_pos\
    \ -= 1\n    self.image = self.ship_sheet.subsurface(self.animate_pos*64, 0, 64,\
    \ 64)\n```\n\n```\nif self.animate_left:\n    if self.animate_pos > 0:\n     \
    \   self.animate_pos -= 1\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_95_0.png)"
