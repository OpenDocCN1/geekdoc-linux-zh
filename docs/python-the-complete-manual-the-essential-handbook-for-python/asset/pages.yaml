  md: "# # Work with Python Scrape Wikipedia with Beautiful Soup\n\n# Beautiful Soup\
    \ Documentation\n\nBeautiful Soup is a library for pulling data out of HTML and\
    \ XML. It works with your parser to provide ironic ways of working.\n\nThese instructions\
    \ illustrate all major features of Beautiful Soup, with 4 examples to show you\
    \ why it is good for, how to use it, how to make it do what you want, where and\
    \ when to make its requests.\n\nIntroduction\n\nYou might be looking for the documentation\
    \ for Beautiful Soup 3. If so, you should know that Beautiful Soup 3 is no longer\
    \ developed,\n\nand we recommend using Soup 4 for new projects. If you want to\
    \ learn about the differences between Beautiful Soup 3 and Soup 4,\n\nThis documentation\
    \ has been translated into other languages by Beautiful Soup:\n\n+   - 日本語\n-\
    \ 한국어\n- العربية\n- 简体中文\n\n# Getting help\n\nIf you have questions about Beautiful\
    \ Soup, or run into problems, join the discussion group. If your problem involves\
    \ an HTML document, be sure to mention in what\n\n# Quick Start\n\nHere is an\
    \ HTML document that will be used throughout this example. It is part of a story\
    \ from Alice in Wonderland:\n\n```\nfrom bs4 import BeautifulSoup\n\nhtml_doc\
    \ = \"\"<html><head><title>Alice's Adventures</title></head><body>\n<p>Alice was\
    \ sitting by the bank with her sister, and was so tired of reading the book her\
    \ sister was reading, which had no pictures or conversations, that she began to\
    \ doze off. <a href=\"http://example.com/alice\">Click here!</a></p>\n</body></html>\"\
    \"\n\nsoup = BeautifulSoup(html_doc, 'html.parser')\nprint(soup.find('a'))\n```\n\
    \nFinding the first 'links' in document through Beautiful Soup gives us an object,\
    \ which represents the document as a nested dictionary:\n\n```\nlinks = soup.find_all('a')\n\
    print(links)\n```\n\nIterating over the links, we can extract the text and URL:\n\
    \n```\nfor link in links:\n    print(link.text, link['href'])\n```\n\n# Grabbing\
    \ the links\n\n> By calling find.find_all('a') we get a list of every <a> in the\
    \ document. We can iterate through this and check whether or not there is a valid\
    \ Wikipedia link in the <a> href if the link is valid, we quickly check how far\
    \ down the link goes from the current page. If we reached the maximum depth we\
    \ can go, we will store this page and call it quits, otherwise we start looking\
    \ for links that we can grab within. For every page we request, we append its\
    \ URL to the addresses list; check if we've already stored it. If we have, then\
    \ we skip the rest of the loop, or if we've not then add it to the list of URLs\
    \ that we've requested and fire off a request. Once check is done, we then do\
    \ a quick replace on link so that it points to the local directory, not to the\
    \ subfolder /wiki/ that we are looking for.\n\n# Writing to file\n\nNow we create\
    \ a file to store the newly parsed content in later reading. We change any ? in\
    \ the filename to _ so the script doesn't try and write to a random folder. We\
    \ also do a quick check to see how many links we've followed since the first page.\
    \ If it's not its max level, we add it to the deepestAddresses list. We will use\
    \ this a little bit.\n\nAfter Find the documentation for Beautiful Soup at http://bit.ly/02I68kd"
