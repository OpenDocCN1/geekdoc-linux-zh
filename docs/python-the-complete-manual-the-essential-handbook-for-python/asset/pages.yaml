  md: "# # Python for system administrators Work with Python\n\n# ## Writing a user\
    \ interface using Python\n\nAdministrators are comfortable with running scripts\
    \ by hand, but end-users are not. So if you are writing a script that is supposed\
    \ to be used by common users, it is a good idea to create a user-friendly interface\
    \ on top of your script. This way we can create a graphical interface tool which\
    \ allows users to select default boot entry and the timeout. We will use the Python\
    \ module 'snack' to facilitate this (not to be confused with the Python audio\
    \ library; for example).\n\nThis app consists of two files:\n\ngrub.py: GrubConfig(File(file))\
    \ Parser (available on File). It implements two functions, readBoot20() and writeBootFile(),\
    \ which are responsible for reading and writing the GRUB configuration file.\n\
    gub_ui.py: User interface for manipulating the GRUB configuration file using the\
    \ functions in grub.py.\n\n```\n@code_grub_ui.py\nimport sys\nfrom snack import\
    \ *\n\nfrom grub import readBoot20, writeBootFile\n\ndef main(entry_value=1, kernels=[]):\n\
    \    try:\n        (default_value, entry_value, kernels)=readBoot20()\n    except:\n\
    \        print(\"Error reading ...\", sys.stderr, \"Error reading /grub/grub.conf\"\
    )\n        sys.exit(1)\n\n    screen=SnackScreen()\n\n    while True:\n      \
    \  gg=Grid(ConfigForm(screen, \"Boot configuration\", 1,5)\n        if len(kernels)==entry_value:\n\
    \            l=ListBox(height=len(kernels), width=20)\n            for i, kernel\
    \ in enumerate(kernels):\n                l.append(kernel)\n            gg.add(l,\
    \ 1, 0)\n            l.setCurrent(default_value)\n\n        bb=Button(Screen,\
    \ \"OK\", \"ok\",\n            (\"Cancel\", \"cancel\")\n\n        e-Entry=Entry(3,\
    \ str(entry_value))\n        l-Label(\"Timeout (in seconds):\\\")\"\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_70_0.png)\n\
