    04 Both the accelerometer and gyro can provide this angle information, but both
    have flaws. The accelerometer output can be used to calculate the angle using
    the Euler algorithm. However, the accelerometer output can be inaccurate reading.
    each compensates for the flaws in the other, resulting in a noise-free, long-term
    accurate reading.


    05 Although independently they are both flawed, they can be merged mathematically
    there are many versions of these mathematical noise/drift filters. The best common
    one is slightly less accurate, but easier to understand and easier to code-the
    complementary filter:


    In contrast, the gyro output does not suffer from the noise, but since it is the
    angular speed measured, it needs to be integrated over time to find the angle
    of the quadcopter in comparison to the horizon. Rounding errors in the integration
    lead to ever increasing errors over time, ultimately the maximum length of a flight.


    Now with an angle in hand, it is possible to convert accelerometer sensor data
