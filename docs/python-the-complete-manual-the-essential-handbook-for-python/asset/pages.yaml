  md: '# Program a quadcopter


    # Use Python with Pi


    # PIDs


    So we now have a target for what the quadcopter to do, and an input for what it''s
    doing, and some motors to close the gap between the two; we all now need a way
    to join them together. A direct mathematical algorithm is nigh impossible – accurate
    weight of the quadcopter, power per rotation of each blade, weight imbalance would
    need to be incorporated into the equation and remain stable during flights (and
    crashes), blades and batteries move in the frame; press/moisture changes the weight
    of the quadcopter, humidity and altitude would need to be accounted for. Hopefully
    it''s clear this approach simply won''t work.


    Instead, an estimation method is used with feedback from the sensors to estimate
    that. Because the estimation/feedback loop spins over 100 times a second, this
    approach can react to errors quickly indeed, and yet it knows nothing about the
    factors it''s compensating for - that''s all handled blindly; resulting in this
    is the PID algorithm. It takes the target, subtracts the feedback input, resulting
    in the error processed via Proportional, Integral and a Differential algorithm
    to produce the output.


    # Blender


    The outputs are applied to each ESC in turn: the vertical speed is applied from
    the front blades and adding to the back, the pitch rate is split 50/50 subtracting
    the two, producing the pitch. Roll is handled mildly; yaw too is handled in simple
    way, but applied to diagonal blades which spin in the same direction.


    These ESC-specific outputs are then converted to a PWM signal to feed the hardware
    ESCs with the updated propeller/motor speeds.


    # Propellers


    The propellers are set diagonally to the x, y axes, and rotate as clockwise and
    counter-clockwise to reduce yaw (the z-axis)


    ![](img/f16311c48f0c39ab87b1836be5339b9e_118_0.png)


    # Sensors


    The quadcopter''s sensors report according to these x, y and z


    Although this article focuses on a very basic background in the hardware from
    the kit to provide context, a quadcopter (hence the name) pointing towards the
    sky, each attached to its own brushless DC motor. Two propellers spin clockwise
    and counterclockwise to maintain the momentum of the quadcopter in flight.


    Each motor is driven by an electronic speed controller (ESC). The motors have
    three sets of coils (phased, clockwise and counter-clockwise) with PWM control
    signal from off-board to high-current output to the motors at a speed requested.
    The power for the ESCs and everything on the system comes from a Lithium Polymer
    battery at 11.1V with peak current of 100A - herein lies


    # Quadcopter orientation Front


    The orientation of the quadcopter compared to the direction of travel, the rotation
    of the propellers and the axes used in the code


    # Orientation


    The overall orientation of the quadcopter depicting front, back, left and right
    relation to the sensor and propeller layout'
