  md: "# Build tic-tac-toe with Kivy Create with Python\n\nentry point for the creation\
    \ of our GUI. We can start\nby making the simplest kivy app possible:\n\n```\n\
    from kivy.app import App\n\nclass TicTacToeApp(App):\n    pass\n\nif __name__\
    \ == \"__main__\":\n    TicTacToeApp().run()\n```\n\nYou can already run this,\
    \ your app will start up and\nyou'll get a plain black window. Exciting!\nWe can\
    \ build our own GUI out of Kivy widgets.\nEach is a simple element with\nspecific\
    \ behaviour of its own ranging from\nstandard GUI functionality (eg the Button,\
    \ Label\nor TextInput), to those that position on\nchild widgets (eg BoxLayout,\
    \ FloatLayout\nor GridLayout), to abstracting a more\ninvolved task like interacting\
    \ with hardware (eg\nt FileChooser, Camera or VideoPlayer).\nKivy's widgets are\
    \ designed to be easily\ncombined - rather including a widget for every\nneed\
    \ imaginable, widgets are kept simple but are\neasy to join new interfaces. We'll\
    \ see some\nof that in this tutorial.\n'Hello World' is basically compulsory in\
    \ our\nprogramming tutorial, let's get it over by using a\nsimple 'label' to display\
    \ the text:\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_80_0.png)\n\n```\ndef\
    \ build(self):\n    return Label(text='Hello World!',\n                 font_size=100,\n\
    \                 color=(0, 1, 0, 1)) # (r, g, b, a)\n```\n\nThe 'build' method\
    \ is called when the 'App' is run,\n whatever is returned automatically\nt root\
    \ widget of 'App'. In our case\nthat's a Label, and we set several properties,\
    \ the\nt'text', 'font_size' and 'color'. All widgets have different\nproperties\
    \ controlling their aspects of behaviour,\nwhich can be dynamically updated to\
    \ their\nappearance later, though here we see them once\nupon importation.\n\n\
    Note that these are not just Python\natributes but include Kivy properties. These\
    \ are\naccessed like normal attributes but provide extra\nfunctionality by hooking\
    \ into Kivy's event system.\nWe'll see examples of creating properties,\n you\
    \ should do the same if you want to use your\nvariables with Kivy's event and\
    \ binding functionality.\nThat's all you need to show some simple text, to\n the\
    \ program again check that this does work.\nYou experiment with the parameters\
    \ if it's unclear\nwhat any of them are:\n\nfrom kivy.uix.label import Label\n\
    \nWe'll display the 'Label' by returning it as our app\nroot. Every app has a\
    \ single root tree, and it will automatically\nt top level of its root tree, and\
    \ be sized to fill the window. We'll see later how to\nconstruct a full GUI by\
    \ adding more widgets for the\none, but for now it's enough to set the root widget\n\
    by adding a new method to the 'App':"
