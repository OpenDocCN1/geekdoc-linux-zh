  md: '# Create with Python


    # Program a Space Invaders clone


    # Setting dependencies


    # Global variables & tuples


    If you''re looking to get a better understanding of programming games with Pygame
    and Python, we strongly recommend you copy the Pygame code in this tutorial into
    your own program. It is great practice and gives you a chance to tweak elements
    of the game to suit you, or build a different image, changing the difficulty or
    the alien waves behave. If you just want to play the game, that''s easily achieved
    enough, too. Either way, the game''s only dependency is Pygame (if it isn''t already)
    can be installed from the terminal by:


    Once we''ve imported the modules we need for the project, there''s quite a list
    of variables in block capitals. The capitals denotes these variables are constants
    (global variables). These are important variables that never change—things we
    refer to in the code...


    ```

    sudo apt-get install-pygame

    ```


    # Installation


    For Invaders we''ve used Git, a brilliant form of version control to safely store
    the game and retain historical versions of your code. Git should already be installed
    on your PC, or you can acquire it by:


    ```

    sudo apt-get install git

    ```


    As a useful consider for your code, Git allows you to clone copies of others''
    projects so you can work on them, or just use them. Clone Pygame, go to your home
    folder in the terminal (cd )— make a directory for the project (pygame invaders),
    enter the directory (cd invaders) and pull:


    ```

    git pull https://github.com/russell78/pygame.inv

    ```


    # Testing Pyaders


    # Classes – part 1


    With Pygame installed and the project code to your machine (you can also find
    the zip in this issue''s cover DVD – simply unpack it and copy it to your home
    directory) to set up properly. You will need to type python game.py from the pyaders
    directory in the terminal to get started. You can start the game with the space
    bar, the same button and simply use the left and right arrows on your keyboard
    to move your ship left and right.


    A class is essentially a blueprint for an object you''d like to make. In the case
