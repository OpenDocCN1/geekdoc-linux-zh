    # Work with Python


    # SECTION 2: IPython: a ready-made Python system shell replacement


    In section 1 we have introduced you to the Python modules allow you to do system
    shell-related tasks very easily using vanilla Python. Using the same features,
    you can build a fully featured shell and remove a lot of Python boilerplate code
    along the way. However, if you are kind of person who wants everything ready-made,
    you are in luck. IPython provides a powerful and interactive shell which you can
    use as your primary shell. IPython supports Python 2.6 to 2.7 and 3.1 to 3.2.
    It supports two type of Python shells: Terminal based and Qt based.


    Just to reiterate, IPython is purely implemented in Python and provides a 100%
    Python-compliant shell interface, so everything that you have learned in section
    1 so far can be run inside IPython without any problems.


    IPython is already available in most Linux distributions. Search your distros''
    repositories to look for it. In case you are not able to find it, you can install
    it using easyinstall or PyPI. IPython provides a lot of interesting features which
    makes it a great shell replacement...


    Tab completion: Tab completion provides an excellent way to explore any Python
    object that you are working with. It also helps you to avoid making typos.


    Example:


    ```

    In [3]: import o {hit tab)

    objc opcode operator optparse os2emxpath

    ```


    ```

    In [3]: import os

    ```


    ```

    In [4]: os.p {hit tab}

    sos.pardir os.path_names os.popen os.popen4

    sos.path os.pathsep os.popen2 os.putenv

    sos.pathconf os.pipe os.popen3

    ```


    Built In Object Explorer: You can add ''?'' after any Python object to view its
    details as Type, Base Class, String Form, Namespace, File and Docstring.'
