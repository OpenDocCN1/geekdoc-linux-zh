    # Work with Python


    copy (src,dst): Copy the src file to the destination directory. In this mode permissions
    bits are copied but metadata is not.

    copy2 (src, dst): Same as copy() but also copies the metadata.

    copytree(src, dst, symlinks=False, ignore=None): This is similar to `cp -r`, it
    allows you to copy an entire directory.

