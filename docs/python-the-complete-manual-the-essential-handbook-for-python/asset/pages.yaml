  md: "# Introducing Python\n\n# 50 Python tips\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_39_0.png)\n\
    \n# 50 Python tips\n\nPython is a programming language that lets you work more\
    \ quickly and integrate your systems more effectively. Today, Python is one of\
    \ the most popular programming languages in the open source space. Look around\
    \ and you will find it running everywhere, from various configuration tools to\
    \ XML parsing. Here is the collection of 50 gems to make your Python experience\
    \ worthwhile...\n\n# Basics\n\nPython does not support inline assignment, so there's\
    \ no chance of accidentally assigning the value when you want to compare it.\n\
    \n# Running Python scripts\n\n# Concatenating strings\n\n+   01 On the most of\
    \ the UNIX systems, you can run Python scripts from the command line.\n\n+   *\
    \ python myprogram.py\n\n+   06 You can use '++' to concatenate strings.\n\n```\n\
    >> print 'kun'+'+al' # kunal\n```\n\n# Dynamic typing\n\n# Running Python programs\
    \ from Python interpreter\n\n+   03 In Java, C++, and other statically typed languages,\
    \ you must specify the data type of each variable before use. On the other hand,\
    \ Python is a dynamically typed language. In Python you will never have to specify\
    \ the type of any object you use. Based on value usage, Python will automatically\
    \ keep track of the data type.\n\n+   02 The interactive interpreter makes it\
    \ easy to try first steps in programming and use all Python commands. Just enter\
    \ each command (--) one by one and see results immediately.\n\n# Python statements\n\
    \nPython interpreter can be started by using the command:\n\n```\n$ python\nKunal@ubuntu:~$nPython\
    \ 2.6 (release-26, Apr 19 2009, 01:56:41)\nGCC [4.3.1] on linux\n```\n\nType 'help',\
    \ 'copyright', 'credits' or 'license' for more information.\n>>> commands commands\
    \ here\nIn this article, all the code starting at\n>>> symbol is meant to be given\n\
    \n+   04 Python uses carriage to separate statements, and a colon to indent separate\
    \ blocks. Most of the compiled programming languages, such as C and C++, use semicolons\
    \ to separate statements and clearly separate blocks.\n\n# __init__ method\n\n\
    +   07 __init__ method is run as soon as an object of a class is instantiated.\
    \ The method is useful to do any initialization with your object.\n__init__ method\
    \ is similar to constructor in C++ or Java.\n\nExample:\nClass: Person:\n __init__(self,\
    \ name):\n self.name = name\ndef sayHi(self):\n print 'Hello, my name', self.name)\n\
    is = 'self'\np = Person('Kunal')\nsayHi())\nOutput:\n [/usr/python $] python\n\
    Hello, my name is Kunal\n\n# == and operators\n\n+   05 Python uses '==' for comparison\
    \ and '='\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_39_1.png)"
