  md: "# Create with Python\n\n# Build tic-tac-toe with Kivy\n\n```\ndef button_pressed(self,\
    \ button):\n    player = { 'O': 0, 'X': 1 }\n    colours = { 1: (1, 0, 0), -1:\
    \ (0, 0, 1) }\n    #) # (r, g, b, a)\n\n    row, column = button.coords\n\n  \
    \  status_index = 3*row + column\n    already_played = self.status[status_index]\n\
    \n    if not already_played:\n        self.status[status_index] = current_player\n\
    \        button.text = { 'O': 'O', 'X': 'X' }\n        button.background_color\
    \ = colours[current_player]\n        self.current_player *= -1\n```\n\n```\ndef\
    \ on_status(self, instance, new_value):\n    status = new_value\n\n    sums =\
    \ [sum(status[0:3]), # rows\n            sum(status[3:6]),\n            sum(status[6:9]),\n\
    \            sum(status[0::3]), # columns\n            sum(status[1::3]),\n  \
    \          sum(status[2::3]),\n            sum(status[0::4]), # diagonals\n  \
    \          sum(status[4::-2])]\n\n    if 3 in sums:\n        print('Os win!')\n\
    \    elif -3 in sums:\n        print('Xs win!')\n    elif 0 not in self.status:\
    \ # Grid full\n        print('Draw!')\n```\n\nYou can run again to see exactly\
    \ what this did, and you'll find that each button now shows an 'O' or 'X' with\
    \ a coloured background depending on whose turn it is. Not only, but you can only\
    \ play one move in each thanks to our status array that keeps track of the existing\
    \ moves.\n\nThis covers the basic detection of a win or drawn board, but it only\
    \ print the results to stdout. At this stage we probably want to reset the board\
    \ so that the players can try again, with displaying a graphical indicator of\
    \ the result.\n\nThis is enough to play the game but there's one vital element\
    \ missing, a big-pop telling you that you've won! Before we do that, we need to\
    \ add some to check if the game is over. Kivy properties have another useful feature\
    \ here, wherever they change they automatically call an 'onproperty' method if\
    \ it exists and dispatching a corresponding event in Kivy's system. It makes it\
    \ very easy to write code that will run when a property changes, both in Python\
    \ and kv language. In our case we can use it to check the status list every time\
    \ it is updated, something special if a player has filled a column, or diagonal.\n\
    \n```\ndef reset(self, *args):\n    self.status = [0 for _ in range(9)]\n\n  \
    \  for child in self.children:\n        child.text = ''\n        child.background_color\
    \ = (1, 1, 1, 1)\n\n    self.current_player = 1\n```\n\nFinally, we can modify\
    \ the 'on_status' method to reset the board and display the winner in a 'ModalView'\
    \ widget.\n\n```\nfrom kivy.uix.modalview import ModalView\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_83_0.png)"
