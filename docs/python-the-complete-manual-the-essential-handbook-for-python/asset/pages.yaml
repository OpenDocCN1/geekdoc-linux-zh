    # Pivarders Pt 2: graphics & sound


    This time we''ll expand our Space Invaders clone to include immersive animation
    and sound


    We had fun creating our basic Space Invaders clone, Pivarders, in the previous
    guide. Pygame''s ability to group, manage and detect collisions thanks to the
    Sprite class made a great difference to our project, not just in terms of code
    length, but if you missed the first part of the guide, you can find the v0.1 code
    listing via git.io/bCVTBg, while you can find v0.2 version of the code, including
    all the images, music and sound effects we''ve used at git.io/8Q2k-w.


    To help keep your project manageable and straightforward (as projects grow keeping
    your code easy to follow increasingly hard) we integrated a few animation methods
    into our Game class and opted to use a sprite sheet. Not only does it make it
    very easy to draw the screen, but it also keeps the asset count under control
    and keeps levels up, which is especially important for the Raspberry Pi. Hope
    you have fun using these techniques to animate and sound your projects!


    ![](img/f16311c48f0c39ab87b1836be5339b9e_93_0.png)


    # Setting up dependencies


    # Downloading Pivarders


    # Navigating the project


    01 You''ll get much more from the exercise you download (git.io/369yw) and use
    it to create and play your own animations and sound effects. Regardless of whether
    you want to simply play and walk through the code to get a better understanding
    of basic game, you''re still going to notice some basic dependencies. The two
    key requirements are Pygame and Git, both of which are installed by default on
    up-to-date Raspberry installations. That''s!


    02 Git is a superb version control that helps programmers save their code and
    associate files. Not only does it help retain a history of changes


    ```

    git pull https://github.com/rusab7/pivarders.git

    ```


    03 Within pivarders sits a licence, and a second folder. This contains the main
    game file, where you run the application. Within the data folder you''ll find
    subfolders for graphics and sound assets, as well as the font we''ve used for
    the title screen and scores. To take for a test-dev, simply enter the subdirectory
    (cd advisers/pivarders) and type


    +   - python.py Use the arrow keys to move left and right and space bar to shoot.
    You can quit with the Escape key.


    This creates a called pivarders.


