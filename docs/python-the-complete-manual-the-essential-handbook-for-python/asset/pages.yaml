  md: "# Create with Python\n\n# Build tic-tac-toe with Kivy\n\nOur widget: tic-tac-toe\n\
    \nSince Kivy doesn't have a tic-tac-toe widget, we'll have to make our own! We'll\
    \ create a new widget class to contain this behaviour:\n\nchild widgets. This\
    \ example demonstrates the former, creating a rule for the 'TicTacGrid' widget\
    \ by declaring that every 'TicTacGrid' instantiated should have its 'cols' property\
    \ set to 3.\n\n```\nfrom kivy.uix.gridlayout import GridLayout\nclass TicTacGrid(GridLayout):\n\
    \    pass\n```\n\nWe'll use some more kv language features later, but for now\
    \ let's get back to Python to create the buttons that will be the entries in our\
    \ tic-tac-toe grid.\n\n```\nfrom kivy.uix.button import Button\nfrom kivy.properties\
    \ import ListProperty\n```\n\nNow this obviously doesn't do anything yet, except\
    \ that it inherits all the behaviour of the Kivy GridLayout - that is, we need\
    \ to tell it how many columns to have, but then it will automatically arrange\
    \ any widgets to fit nicely with as rows as necessary. Tic-tac-toe requires three\
    \ columns and nine children.\n\n```\nclass GridEntry(Button):\n    coords = ListProperty([0,\
    \ 0])\n```\n\nHere we introduce the Kivy language (kv), a special-domain language\
    \ for making rules Kivy trees. It simply but removes a lot of necessary boilerplate\
    \ for managing the UI with Python code - a so analogy you might think of it as\
    \ the HTML/CSS to Python's JavaScript. Python gives us the dynamic power to do\
