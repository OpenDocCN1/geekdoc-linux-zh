  md: "# # Build tic-tac-toe with Kivy\n\nThis is a pop-up widget that draws itself\
    \ on top of everything else rather as part of the user widget tree. It also automatically\
    \ closes when the user clicks or taps outside it.\n\n+   - winner = None\n- if\
    \ -3 in sums:\n  winner = 'Xs win!'\n- elif 3 in sums:\n  winner = 'Os win!'\n\
    - elif 0 not in sums:\n  winner = 'Draw...nobody wins!'\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_84_0.png)\n\
    \n```\nif winner:\n  popup = ModalView(size_height=0.75, 0.5)\n  victory_label\
    \ = Label(text=winner, font_size=50)\n  popup.add_widget(victory_label)\n  popup.bind(on_dismiss=self.reset)\n\
    \  popup.open()\n```\n\n# ## Time to experiment\n\nThis mostly uses the same ideas\
    \ we have already covered, adding the 'Label' widget to the 'ModalView' then letting\
    \ the 'ModalView' take care of drawing itself and its children on top of everything\
    \ else. We also use binding; this time to 'on_dismiss', which is an event dispatched\
    \ by the 'ModalView' when it is closed. We made use of the 'size_hint' property\
    \ common to widgets, which in this case is used to set the 'ModalView' size proportional\
    \ to the window – while allowing the window to dynamically resize, maintaining\
    \ these proportions. This is another trick made possible by a binding with the\
    \ 'size_hint' Kivy property, this managed internally by Kivy.\n\nThis has been\
    \ a quick tour through some of Kivy's features, but hopefully it demonstrates\
    \ how to think about building a Kivy application. Our programs are built from\
    \ inbuilt Kivy widgets, interacting by having Python code run their properties\
    \ change (eg 'on_status' method) or when they dispatch events (eg 'Button' 'on_release').\
    \ We briefly saw Kivy language and experienced how it can automatically create\
    \ bindings between properties. You can find a copy of the program on FileSí, reference\
    \ this to check you've followed everything correctly. We've also added an extra\
    \ widget, the 'Interface', with a structured content entry in kivy language that\
    \ demonstrates how to add child widgets. We test it by implementing the return\
    \ 'Interface' line in 'TicTacToeGrid'.It doesn't do anything different to what\
    \ we have already covered, but it does make extensive use of kivy language binding\
    \ ability to automatically update, and to resize the TicTacToeGrid so it is always\
    \ square to fit within your parent. You can play with the settings to see how\
    \ it fits together, or swapping out the different widget types to see how other\
    \ widgets behave.\n\nThat's a finished program! We can not only play tic-tac-toe,\
    \ but our program automatically tells us when somebody has won, and resets the\
    \ board so we can play again. Simply run your program and enjoy hours of fun!"
