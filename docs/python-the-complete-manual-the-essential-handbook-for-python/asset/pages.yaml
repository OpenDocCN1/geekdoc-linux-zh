    and Differential gain that can only be found with estimation/experiment. The results
    for every quadcopter will be different. Luckily there is a relatively safe way
    to proceed.


    Tweak the P gain accordingly. Once P gain is good, a touch of I – this will ensure
    return to O as well as stability. D gain is optional, but adds firmness and crisp
    response. Tapping a D-gain stable quad is like knocking on a table – it doesn''t
    move.


