    # Working with numbers


    09 We''re going to ask the user for a number by basically repeating the first
    couple of lines in it. Once the user gives us a number, we''ll square and double
    it. The raw_input function returns the value that the user input as a string.
    A string is a text-based value we can perform arithmetic on. The integer type
    in Python can only store whole numbers whereas the decimal type can store numbers
    with decimals. We''re going to do something called a type cast, which basically
    converts a value with one type to another. We''re going to convert our number
    string to a decimal value because it''s like that decimals will be involved if
    we are having numbers. If the number was of an integer type, any decimal values
    would simply be cut off the end, without any rounding. This is called truncation.'
