  md: "# Control an LED using GPIO\n\n# Use Python with Pi\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_126_0.png)\n\
    \n# Using PWM\n\n20 The next step is to tell the pin to output and set a way of\
    \ escaping our program. Here we call the GPIO class again and then the PWM method,\
    \ using the pin number; the second value is the frequency in hertz - in this case,\
    \ 0.5.\n\n```\np = GPIO.PWM(12, 0.5)\np.start(1)\ninput(\"Press return to stop\"\
    )\np.stop()\nGPIO.cleanup()\n```\n\n# Test the script\n\n17 Now to make sure that\
    \ the script imported okay, you need to run the command and then the name of the\
    \ script that we created. If all goes well, you shouldn't see any error messages.\
    \ If you do, though. Just go back through the previous steps to check everything\
    \ as it should be.\n\n```\nsudo python gpio.py\n```\n\n# Adjust PWM\n\n21 To add\
    \ a timer to the GPIO it fades out, we first need to import the time library and\
    \ then the pin to have 50Hz frequency to start with.\n\n```\nimport time\nimport\
    \ RPi.GPIO as GPIO\nGPIO.setmode(GPIO.BOARD)\nGPIO.setup(12, GPIO.OUT)\np = GPIO.PWM(12,\
    \ 50) # channel=1 frequency=50Hz\np.start(0)\n```\n\n# Set gpio mode\n\n18 Reload\
    \ the script in nano again. We will set the GPIO to BOARD. This is the safest\
    \ for a beginner to adopt and whichever revision of the Pi you are using. It's\
    \ best to pick a GPIO convention and stick to it because this will save us later.\n\
    \n```\nsudo python gpio.py\nGPIO.setmode(GPIO.BOARD)\n```\n\n# Set pin mode\n\n\
    19 A pin has to be defined either an input or output before it works. This is\
    \ simplified in the GPIO library by calling the GPIO.setup method. You then pass\
    \ the pin number, and then GPIO, OUT or IN. As we want to use an LED as an output.\
    \ You'll be using these conventions frequently, so learn them best as you can\
    \ before they fail!\n\n```\nGPIO.setup(12, GPIO.OUT)\n```\n\n# Add the fade\n\n\
    22 Then we add in another try-except-block, this time checking power the LED is\
    \ - and once it reaches a certain level, reverse the process. To run this code,\
    \ simply save from nano and then use python gpio.py. while 1:\n\n```\nfor dc in\
    \ range(0, 101, 5):\n    p.ChangeDutyCycle(dc)\n    time.sleep(0.1)\nfor dc in\
    \ range(100, -1, -5):\n    p.ChangeDutyCycle(dc)\n    time.sleep(0.1)\nexcept\
    \ KeyboardInterrupt:\n    pass\n```\n\n```\np.stop()\nGPIO.cleanup()\n```\n\n\
    > “We'll set the GPIO mode to BOARD. This will work whichever revision of the\
    \ Pi you are using”\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_126_1.png)\n\n\
