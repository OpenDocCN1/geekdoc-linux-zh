  md: "# 50 Python tips\n\n# Introducing Python\n\n# Modules\n\npoint number\n\nThis\
    \ example returns the CPU time or real time since the start of the process or\
    \ since the first call to clock). This has just as precise as the system records\
    \ do.\n\n'eggs']\n\nTo keep your programs manageable as they grow you might want\
    \ to make them into several files. Python allows you to put multiple definitions\
    \ into a file and use them as a module that you can import. These files must have\
    \ a .py extension.\n\n```\n>>> print ' ', '.join(mylist)\nspam, ham, eggs\n```\n\
    \n2nd method:\n\n```\n>>> print '\\n'.join(mylist)\nspam\nham\neggs\n```\n\n```\n\
    Example:\n# file_function.py\ndef min(a,b):\n if a < b:\n    min = a, b\n else:\n\
    \    min = b, a\n return min\nModule Usage\nimport my_function\n```\n\n# Passing\
    \ arguments\nto a Python script\n\nPython allows you to pass a script while calling\
    \ it. The 'command line' content is stored in your sys.argv.\n\n```\nimport sys\n\
    print sys.argv\n```\n\n# Loading modules\nat at startup\n\nYou can define predefined\
    \ modules or commands of any Python script by using environment variables like\
    \ PYTHONPATH. You can set the environment variable PYTHONPATH to a file that contains\
    \ the necessary modules or commands.\n\n# Tab completion\nin Python interpreter\n\
    \nYou can achieve autocomplete inside interpreter by adding lines to your .python_file\
    \ (or your file for Python to read on startup):\n\n```\nimport readline\nreadline.readline_and_bind('tab',\
    \ complete*)\n```\n\nThis will make Python complete partially typed function method\
    \ and variable names when you press the Tab key.\n\n# Module defined names\n\n\
    The built-in function 'dir()' can find out which a module defines. It returns\
    \ a sorted list of strings:\n\n```\n>>> dir(time)\n['__doc__', '__file__', '__name__',\
    \ '__package__', 'asctime', 'time', 'daylight', 'gmtime', 'localtime', 'mtime',\
    \ 'sleep', 'strptime', 'struct', 'time', 'tzname', 'tzset']['/file']\n```\n\n\
    # Python documentation tool\n\nYou can create a pop up interface for searching\
    \ the Python documentation using the command:\n\n```\n$ python -m help\n```\n\n\
    You will need python-tk package for this work.\n\n# Converting a string\nto date\
    \ object\n\nYou can use the DateTime() function to convert a string to a date\
    \ object.\n\n# 13 Converting a string to a date object\n\n```\nExample:\nfrom\
    \ DateTime import DateTime\ndatebj = DateTime('2013-01-01')\n```\n\n# Module internal\n\
    documentation\n\nYou can see the documentation (if available) of a module by looking\
    \ at its __doc.\n\n```\nExample:\n>>> import time\n>>> print time.clock.__doc__\n\
    clock() -> floating\n```\n\n# Converting a string\nto date object\n\nYou can convert\
    \ a list to string in the following ways:\n\n# 14 Converting a list to string\n\
