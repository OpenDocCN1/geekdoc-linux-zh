  md: '# Introducing Python


    # Build an app for Android with Python


    # Putting your APK on the Play Store


    Find out how digitally sign a release APK and upload it to an app store of your
    choice


    > “Check through the whole file just to see what''s available, but most of the
    default settings will be fine”


    +   1 Build and sign a release


    Begin creating a personal digital key, using it to sign a special release of the
    APK. Run these commands, and follow the instructions.


    ```

    ## Create your personal digital key

    ## You can choose your keyname, alias, and passwords.

    ## keytool -genkey -keyname release-key -alias release-key -store -keyalg RSA
    -keysize 2048 -validity 10000

    ## Compile your app in release mode

    ## builder android-release --

    ## Sign your APK with your new key

    ## jarsigner -verify -storepass keystore -SHARSA-digests SHA-1 -keystore=release.keystore
    -keyout=0.1-release= /bin/KivyBreakout-0.1-unsigned.apk \

    ## Align the APK zip test-alias

    $ ./builder/android --platform=android --sdk-21/tools/zipalign -v 4 --release=
    /bin/KivyBreakout-0.1-unsigned.apk \

    /bin/KivyBreakout-0.1-release.apk

    ```


    ```

    git clone git://github.com/kivy/builder

    cd builder

    sudo python2.setup.py install

    ```


    When you''re done with that you can go on to your Kivy app and you''ll have to
    name the main code file ''main.py'', this is the access point that the Android
    APK will expect.


    When you run it, it will download the Android SDK and NDK, which are large (at
    least hundreds of megabytes) but vital to the build. It will also take time to
    build these and compile the Kivy components of your APK. A lot of this only needs
    to be done once, as future builds will take a couple of minutes if you change
    the builder.spec, or a few seconds if you''ve changed your code.


    ```

    builder init

    ```


    This creates a ''builder.spec'' file, a settings file containing all the information
    that Builder needs to create your APK, from the name and version to the specific
    Android build options. We suggest that you check it to see what''s available but
    most of the default settings will be fine, the only thing we suggest changing
    it is (Fig. 1).


    The APK is a debug APK, and you can install and use it. There are extra steps
    if you want to sign it so that it can be posted on the Play store. This isn''t
    hard, and Builder can do some of the work, but check the documentation online
    for full details.


    There are other options you will often want to set, but not all that are vital
    right now, so you will be able to immediately tell Builder to build your APK and
    get going!


    Assuming everything goes fine (it), your Android APK will be in a new ''bin''
    directory with the name ''KivyBreakout-0.1-debug.apk''. You can send it to your
    phone any way you like (eg email), though you may need to enable application installation
    from unknown sources in your Settings before you install it.


    ```

    builder android debug

    ```


    This will take some time, so be patient and it will work out.


