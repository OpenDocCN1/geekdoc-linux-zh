    t Label is replaced by a grid of nine buttons,\neach of which can click (it will\
    \ automatically\nchange colour) and you'll see the printed\noutput information\
    \ from our binding.\n\nWe could customise the appearance by modifying\nother properties\
    \ of the Button, but for now we'll leave\nthem as are.\n\nHas anyone won yet?\n\
    We'll want to keep track of the state of the board to\ncheck if anyone won, we\
    \ can do with a\nmore Kivy properties\n\n```\nfrom kivy.properties import (ListProperty,\n\
    NumericProperty)\n```\n\n```\nclass TicTacToeGrid(GridLayout):\n    status = ListProperty((0,\
    \ 0, 0, 0, 0, 0, 0))\n    current_player = NumericProperty(1)\n```\n\nThis introduces\
    \ a few concepts: When\ninantiated our 'GridEntry' widgets, we are able to\n their\
    \ 'coords' property by simply passing it in\na kwarg. This is a minor feature\
    \ that is automatically\nhandled by Kivy properties.\nWe used the 'bind' method\
    \ to call the grid.\n'button_pressed' method whenever the 'GridEntry'\nwidget\
    \ dispatches an 'on_release' event. This\nautomatically handled by 'Button' custom,\
    \ and\nwill occur whenever a user presses, releases a\n'GridEntry' button. We\
    \ could also bind to 'on_press',\nwhich is dispatched when the button is first\
    \ clicked,\nor to any Kivy property of the button, dispatched\ndynamically when\
    \ the property is modified.\nWe added each 'GridEntry' widget to our 'Grid' via\n\
    a 'add_widget' method. That means each one\nis child widget of the 'TicTacToeGrid',\
    \ and so it will\n\nThis adds an status list representing how we\nplayed, and\
    \ a number to represent the current\nplayer (for '0' or '1').\nBy placing these\
    \ in our status list, we'll know\nif somebody wins because the sum of a row, column\n\
    diagonal will be +3. Now we can update our graphical\ngrid when a move is played.\n\
    \n![](img/f16311c48f0c39ab87b1836be5339b9e_82_0.png)\n\n```\ndef button_pressed(self,\
    \ instance):\nprint('{} button clicked.'.format(instance.coords))\n```"
