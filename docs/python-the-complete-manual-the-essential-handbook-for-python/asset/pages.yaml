    # Variables and data types


    A variable is a name in source code that is associated with an area in memory
    that you can use to store data, which is then called throughout the code. The
    data can be one of many types, including:


    | Integer | Stores whole numbers |

    | Float | Stores decimal numbers |

    | Boolean | Can have a value of True or False |

    | String | Stores a collection of characters, "Hello World" is a string |


    > "A variable is associated with an area in memory that you can use to store data"


    # Getting started


    > Tip

    If you were using a graphical editor such as gedit, you would only have to do
    the last step of making the file executable. You should only have to mark the
    file as executable. You can freely edit the file once it is executable.


