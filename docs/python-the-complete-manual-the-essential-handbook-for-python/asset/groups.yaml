    # Scientific computing with NumPy


    Make some powerful calculations with NumPy, SciPy and Matplotlib


    NumPy is the primary Package for performing scientific computing. It has a powerful
    N-dimensional array object, tools for integrating C/C++ and Fortran code, linear
    algebra, Fourier transform, and random number capabilities, among other things.
    NumPy also supports broadcasting, which is a clever way for universal functions
    to deal in a meaningful way with inputs that do not have exactly the same form.


    Apart from its capabilities, the other advantage of NumPy is that it can be integrated
    into Python programs. In other words, you may get your data from a database, the
    output of another program, external file or an HTML page and then process it using
    NumPy.


    This article will show you how to install NumPy, make calculations, plot data,
    read and write external files, and it will introduce you to some Matplotlib and
    SciPy packages that work well with NumPy.


    NumPy also works with Pygame, a Python package for creating games, though explaining
    its use is unfortunately beyond of the scope of this article.


    It is considered good practice to try the various NumPy commands inside the Python
    shell before putting them into Python programs. The examples in this article will
    use either Python shell or IPython.'
