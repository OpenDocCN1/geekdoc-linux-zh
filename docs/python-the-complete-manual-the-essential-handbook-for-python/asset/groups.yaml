    \ == 0:\n    username = default_username\n```\n\n## Accessing Secure Shell (SSH)\
    \ services\n\nSSH (Secure Shell) is a modern replacement for an old shell system\
    \ Telnet. It allows data to be exchanged using a secure channel between two devices.\
    \ System administrators frequently use SSH to administer networked systems. In\
    \ addition to providing remote shell, SSH is also used for secure file transfer\
    \ (using SSH File Protocol, or SFTP) and X server forwarding (allowing you to\
    \ use SSH clients as X server). In this section we will learn how to use the protocol\
    \ from Python using a Python module paramiko, which implements the SSH2 protocol\
    \ for Python. paramiko can be installed using the following steps:\n\n- $ git\
    \ clone https://github.com/robey/paramiko.git\n- $ cd paramiko\n- $ sudo pip setup.py\
    \ install\n\nTo the core of paramiko is the SSHClient class. This class wraps\
    \ L(Transport), L(Channel), and L(SFTPClient) to handle most of the aspects of\
    \ SSH. You can use\n\n```python\nclient = SSHClient()\nclient.load_system_host_keys()\n\
    client.connect('some.host.com')\nstdout, stdin, stderr = client.exec_command('dir')\n\
    ```\n\nThe following example demonstrates a full SSH client written using the\
    \ paramiko module.\n\n@code: PySSHClient.py\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_68_0.png)\n\
    \n```python\n*** Connecting...***\nclient.connect(hostname, port, username, password)\n\
    chan = client.invoke_shell()\nprint(repr(client.get_transport()))\nprint('***\
    \ SSH Server Connected!***')\n```\n\n> ~ $:\n\nIf the host key for the SSH server\
    \ is added to your $HOME/ssh/known_hosts_file, the client will throw the following\
    \ error: \n\n```python\ntry:\n    interactive.interactive_shell(chan)\n    chan.close()\n\
    \    client.close()\nexcept Exception, e:\n    print('*** Caught exception: %s'\
    \ % (e.__class__, e))\n    traceback.print_exc(n)\ntry:\n    client.close()\n\
    except:\n    pass\nsys.exit(1)\n```\n\n*** Caught exception: <type 'exceptions.TypeError>:\
    \ unbound method missing_host_key() must be called with WarningPolicy instance\
    \ as first argument (got SSHClient instance instead)\n\nThis means the client\
    \ cannot verify the authenticity of the server you are connected to. To add the\
    \ host key to yours, use the ssh command. It is important to remember that this\
    \ is not the ideal way to add the host key; instead you should use ssh-keygen.\
    \ For simplicity it's sake\n\n```\n$ luna@ubuntu-vm-kdeo:~/.ssh ssh\nluser@192.168.1.2\n\
    ```\nThe authenticity of host '192.168.1.2' (192.168.1.2') can't be established.\n\
