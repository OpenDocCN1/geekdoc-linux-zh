    \ : \"Blue\" }\n```\n\n## 访问集合内部的某些元素\n\n我们首先更改 `hello_list` 中字符串的值，并在末尾添加一个感叹号。\"\
    list\" 字符串是列表中的第 5 个元素。然而，Python 中的索引是从零开始的，这意味着第一个元素的索引为 0。\n\n注意，当我们打印元素时，会有两个感叹号\n\
    \n```python\nprint(hello_list[4])\nhello_list[4] += \"!\"\n# 上面的一行等于\n# hello_list[4]\
    \ = hello_list[4] + \"!\"\nprint(hello_list[4])\n```\n\n记住元组是不可变的，尽管我们可以像下面这样访问它的元素\n\
    \n```python\nprint(str(hello_tuple[0]))\n# 我们不能像刚才对列表那样\n# 更改这些元素的值\n# 注意上面使用了\
