    \ want connecting (yes/no)? yes\nWarning: Permanently added '192.168.1.2' (RSA)\
    \ to the list of known hosts.\n\nTo run this you will also need a custom Python\
    \ class interactive.py which implements the interactive shell for the SSH session.\
    \ Look for this file on File5 and copy it into the same folder where you created\
    \ PySSHClient.\n\n```python\n@code_Output\nlunkal@ubuntu-vm:~/src/paramiko/\n\
    demos$ python demo_sample.py\nhostname:192.168.1.2\n[Username]: luduser\nPassword\
    \ for luduser@192.168.1.2:\n*** Connecting...***\n<paramiko.Transport as 0x7b601acl1\
    \ (cipher aes128-ctr, 128 bits) active: 1\nopen channel(s))\n*** SSH Server Connected!***\n\
    Last login: Thu Jan 13 02:01:06 from 192.168.1.9\n```\n\nNow you've just seen\
    \ how easy it is to carry out complex sysadmin tasks using Python's versatile\
    \ language. With all Python coding, the code presented here can fairly easily\
    \ be adopted into your GUI application (such as PyGTK or PyQt) or a web application\
    \ (such as Django).\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_69_0.png)\n\n\
    ## Writing user interface\n\nAdministrators are comfortable with running scripts\
    \ by hand, but if you are writing a script that is supposed to be used by common\
    \ users, it is a good idea to create a user-friendly interface on top of your\
    \ script. We can create a graphical interface tool which allows users to select\
    \ boot entry and timeout. We will use the Python module 'tkinter' to facilitate\
    \ this (not to be confused with audio library for example). This app consists\
    \ of two files:\n\n- grub.py: GRUBConfig(file). It implements two functions, readConfig()\
    \ and writeFile(), which are responsible for reading and writing the grub configuration\
    \ file.\n- grub_ui.py: User interface for manipulating the GRUB configuration\
    \ file using the functions in grub.py.\n\n```python\n@code_grub_ui.py\nimport\
    \ sys\nfrom tkinter import *\nfrom grub import readConfig, writeFile\n\ndef main(entry_value,\
    \ kernels=[]):\n    try:\n        default_value, entry_value, kernels = readConfig()\n\
    \    except:\n        print(\"Error reading...\", sys.stderr, \"Error reading\
    \ grub.conf\")\n        sys.exit(1)\n\n    screen = Screen()\n\n    while True:\n\
    \        gg = Grid(screen, \"Boot configuration\", 1, 5)\n        if len(kernels)\
    \ == entry_value:\n            l = ListBox(height=len(kernels), width=20)\n  \
    \          for i, kernel in enumerate(kernels):\n                l.append(kernel)\n\
    \            gg.add(l, 1, 0)\n            l.setCurrent(default_value)\n\n    \
    \    bb = Button(screen, \"OK\", \"ok\", (\"Cancel\", \"cancel\"))\n\n       \
    \ e = Entry(3, str(entry_value))\n        l = Label(\"Timeout (in seconds):\"\
    )\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_70_0.png)\n\n```python\ngg\
    \ = Grid(2,1)\ngg.setField(1,0,0)\ngg.setField(0,1)\n\ngg.add(Label(\"*\"),0,1)\n\
    gg.add(l,0,2)\ngg.add(Label(\"*\"),0,3)\ngg.add(bb,0,4,grow=1)\nresult = gg.runOnce()\n\
    if bb.buttonPressed() == 'cancel':\n    screen.finish()\n    sys.exit(0)\nelse:\n\
    \    entry_value = e.value()\n    try:\n        c = int(entry_value)\n       \
    \ break\n    except ValueError:\n        continue\n```\n\n```python\nwriteFile(c,\
    \ 1)\nscreen.finish()\n\nif __name__ == '__main__':\n    main()\n```\n\nStart\
    \ the tool using the grub command (it reads the grub.conf)\n\n```bash\n$ python\
    \ grub_ui.py\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_70_1.png)\n\n##\
    \ Scrape Wikipedia with Beautiful Soup\n\n### What you'll need...\n\n- Beautiful\
    \ Soup (https://www.crummy.com/software/BeautifulSoup/)\n- HTML5Lib (https://github.com/project-html5lib/html5lib-python)\n\
    - Python 2.6+ & WikiParser.\n- pip install Six (https://pypi.python.org/pypi/six/)\n\
    \n## Scrape Wikipedia with Beautiful Soup\n\nUse the Beautiful Soup Python library\
    \ to parse Wikipedia's HTML and store it for offline reading.\n\nIn this tutorial\
    \ we'll use the popular Beautiful Soup to scrape Wikipedia for links to articles\
    \ and save those pages for offline reading. This is ideal for travelling or in\
    \ a location with a poor internet connection.\n\nThe plan is simple: using Beautiful\
    \ Soup with the HTML5Lib Parser, we're going to load a Wikipedia page, remove\
    \ all of the GUI and unrelated content, search the content for links to other\
    \ Wikipedia articles and then, a tiny bit of modification, write them to a file.\n\
    \nEven though it is now the de facto base of the world, Wikipedia isn't great\
    \ when it comes to DOM consistency – that is IDs and classes are sometimes quite\
    \ loose in their usage. Because of this, we will also cover how to handle all\
    \ of the excess bits and bobs of the Wikipedia GUI that we don't need, as well\
    \ as find the CSS stylesheets and a Python script pertaining to this tutorial\
    \ at http://bit.ly/19mibBv.\n\n## Infinite Links\n\nWikipedia has a lot of links\
    \ and when you start following links to links, the number of pages you have to\
    \ parse can grow exponentially, depending on the subject matter. By passing threads\
    \ we can put a cap on the amount of pages we can grab— although the number of\
    \ files stored can still vary. Use it wisely.\n"
