    # Work with Python


    # Scrape Wikipedia with Beautiful Soup


    # Wiki-Everything


    # Creating some useful variables


    Wikipedia has so many different services that interlink with each other we don''t
    want to grab those pages, so we''ve got quite a conditional statement to stop
    that. It''s pretty good at making sure we only get links from Wikipedia.


    02 These variables will keep track of the links we''ve accessed while the script
    has been running; addresses a list containing every link we''ve accessed; deepestAddresses
    are the links that were the furthest down from our starting point; storeFolder
    is where we save the HTML files we create and maxLevel is the depth that we can
    follow the links to our starting page.


    # Handling the user''s input


    03 In the first few lines of this function, we''re just creating a helper statement.
    Afterwards, we parse any arguments passed into the program on execution and looking
    for a -URL flag and a -levels flag. The levels flag is optional as we already
    have a preset depth that will follow the links to but we need a link to start
    from if the -URL flag is missing, we will prompt the user and exit. If we have
    a link, we then quickly check or not we have a directory to store files in which
    we''ll create if we don''t - and we''ll fire off the function to get that page.
    Finally, we register a handler for when the script tries to exit.


    # Retrieving the page from the URL


    04 Here we''re using URLlib to request the page the user has asked for and once,
    we''ve received that page, we are going to pass the content through Beautiful
    Soup with the soup variable. This gives us access to the methods we''re calling
    as well we parse the document.


    # Trimming the fat


    05 Wikipedia has a lot of nodes that we don''t want to parse. The content variable
    allows us to straight away most of Wikipedia''s GUI, but there are still lots
    of elements that we don''t want to parse. We remedy this by iterating through
    the list ''undesirable'' that we don''t want, we created earlier in the document.
    For each different div/section that we don''t want, we call Beautiful Soup''s
    find_all() method to remove that node from the document. At the end of the undesirables
    list, most of the content we dont any will be gone. We also look for the ''also''
    element in the Wikipedia page. Generally, everything after this is of no use to
    us. By calling the find_all_next() method on the also node, we can get a list
    of every element we can remove from that point.


