    # Hello World


    Let''s get stuck in, and what better way than with the programmer’s best friend,
    the ''Hello World'' application! Start by opening a terminal. Its current working
    directory will be your home directory. It''s probably a good idea to make a directory
    for the files that we''ll be creating in this tutorial, rather than having them
    loose in your home directory. You can create a directory called Python using the
    command mkdir Python. You''ll then want to change into that directory using the
    command cd Python.


    The next step is to create an empty file using the command ''touch'' followed
    by the filename. Our expert used the command touch hello_world.py. the final and
    most important part of setting up the file is making it executable. This allows
    us to run code inside the hello_world.py. We do this with the command chmod +x
    hello_world.py. Now that we have our file set up, we can go ahead and open it
    up in nano, or alternatively any text editor of your choice. Git is a great editor
    with syntax highlighting support that should be available on any distribution.
    You''ll be able to install it your package manager if you don''t have it.


    ```

    [liam-laptop ~]$ mkdir Python

    [liam-laptop ~]$ cd Python/

    [liam-laptop Python]$ touch hello_world.py

    [liam-laptop Python]$ chmod +x hello_world.py

    [liam-laptop Python]$ nano hello_world.py

    ```


    The Hello World program is very simple, it only needs two lines. The first line
    begins with a ''shebang'' (the symbol # - also known'
  - '[PAGE 10]


    # Get started with Python


    as a hashbang followed by the path to the Python interpreter. The program loader
    uses this line to work out the rest of the lines need to be interpreted. If you''re
    running this in an IDE like IDLE, you don''t necessarily need to do this.


    The code that is actually read by the Python interpreter is only a single line.
    We''re passing the value Hello World to the print function by placing it in brackets
    immediately after we called the print function. Hello World is enclosed in quotation
    marks to indicate that it is a literal value and should not be interpreted as
    source code. As we would, expect the print function in Python prints any value
    that gets passed to it from the console.


    You can save the changes you''ve made to the file in nano using the key combination
    Ctrl+O, followed by Enter. Use Ctrl+X to exit nano.


    ```

    #!/usr/bin/env python2

    print("Hello World")

    ```


    You can run the Hello World program by prefixing its filename with / – in this
    case you''d:

    /hello_world.py.


    ```

    $Liam@Liam-laptop Python]$ ./hello_world.py

    Hello World

    ```


    # Variables and data types


    A variable is a name in source code that is associated with an area in memory
    that you can use to store data, which is then called throughout the code. The
    data can be one of many types, including:


    | Integer | Stores whole numbers |

    | Float | Stores decimal numbers |

    | Boolean | Can have a value of True or False |

    | String | Stores a collection of characters, "Hello World" is a string |


    > "A variable is associated with an area in memory that you can use to store data"


    # Getting started


    > Tip

    If you were using a graphical editor such as gedit, you would only have to do
    the last step of making the file executable. You should only have to mark the
    file as executable. You can freely edit the file once it is executable.


    ![](img/f16311c48f0c39ab87b1836be5339b9e_10_0.png)'
- md: "\n## Getting started\n\n## Get started with Python\n\nTip\nAt this point it's\
    \ worth explaining that any text in a Python file that follows a # character will\
    \ be ignored by the interpreter. This is so you can write comments in your code.\n\
    \nAs well as these main data types, there are sequence types (technically, a string\
    \ is a sequence type but is so commonly used we've classed as a main data type):\n\
    \n| Type | Description |\n| :--- | :--- |\n| List | Contains a collection of data\
    \ in a specific order |\n| Tuple | Contains a collection immutable data in a specific\
    \ order |\n\nA tuple would be used for something like a coordinate, containing\
    \ an x and y value stored as a single variable, whereas a list is typically used\
    \ to store larger collections. The data stored in a tuple is immutable because\
    \ you aren't able to change values of individual elements in a tuple. However,\
    \ you can do so in a list.\n\nIt will also be useful to know about Python's dictionary\
    \ type. A dictionary is a mapped data type. It stores key-value pairs. This means\
    \ that you access values stored in the dictionary using that value's corresponding\
    \ key, which is different from how you would do it with a list. In a list, you\
    \ would access an element of the list using that element's index (a number representing\
    \ where the element is placed in the list).\n\nLet's work on a program we can\
    \ use to demonstrate how to use variables and different data types. It's worth\
    \ noting at this point that you don't always have to specify data types in Python.\
    \ Feel free to create this file in any editor you like. Everything will work fine\
    \ as long as you remember to make the file executable. We're going to call ours\
    \ variables.py.\n\n## Interpreted vs compiled languages\n\nAn interpreted language\
    \ such as Python is one where the source code is converted to machine code and\
    \ then executed each time the program runs. This is different from a compiled\
    \ language such as C, where the source code is only converted to machine once\
    \ – the resulting machine code is executed each time the program runs.\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_11_0.png)\n\
    \n## Get started with Python\n\n## Getting started\n\n## Full code listing\n\n\
    ![](img/f16311c48f0c39ab87b1836be5339b9e_12_0.png)\n\n```python\n#!/usr/bin/env\
    \ python2\n```\n\n# We create a variable by writing the name of the variable we\
    \ followed by an equals sign, which is followed by the value we want to store\
    \ in the. For example, the following line creates a variable called hello_str,\
    \ containing the string World.\n\nThe following line creates an integer variable\
    \ called hello_int with the value of 21. Notice how it doesn't need to go in quotation\
    \ marks.\n\n```python\nhello_str = \"Hello World\"\n```\n\n```python\nhello_int\
    \ = 21\n```\n\nThe same principle is true of Boolean values\n\n```python\nhello_bool\
    \ = True\n```\n\n```python\nhello_tuple = (21, 32)\n```\n\nWe create a tuple in\
    \ the following way\n\n```python\nhello_list = [\"Hello\", \"this\", \"is\", \"\
    a\", \"list\"]\n```\n\nAnd a list in this way\n\n# This list now contains 5 strings.\
    \ Notice that there are no spaces these strings so if you were to join them up\
    \ make a sentence you have to add a space between each element.\n\nYou could create\
    \ the same list in the following way\n\n```python\nhello_list = list()\nhello_list.append(\"\
    Hello\")\nhello_list.append(\"this\")\nhello_list.append(\"is\")\nhello_list.append(\"\
    a\")\nhello_list.append(\"list\")\n```\n\n# The first line creates an empty list\
    \ and the following lines use the append function of the list type to add elements\
    \ to the list. This way of using a list isn't very useful when working with strings\
    \ you know of advance, but it can be useful when working with dynamic data such\
    \ as user input. This list will overwrite the first list without any warning as\
    \ we are using the same variable name as the previous list.\n\nWe might as well\
    \ create a dictionary while we're at. Notice how we've aligned the colons below\
