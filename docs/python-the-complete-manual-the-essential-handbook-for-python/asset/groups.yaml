    System administration is an important part of our computing environment. It does
    not matter however you are managing systems at your work home. Linux, being a
    UNIX-based operating system, already has every system administrator needs, such
    as the world-class shells (not just one but many, including Bash, csh, zsh etc.),
    handy tools, and many other features which make the Linux system an administrator''s
    dream. Why do we need Python when Linux already has everything built-in? Being
    a dynamic scripting language, Python distributions actually use Python in core
    administrative parts. For example, Red Hat (and Fedora) system setup tool Anaconda
    is written in Python (read this line again, got the snake connection?). Also,
    tools like GNU Mailman, CompConfig Settings Manager (CCMS) and hundreds of tiny
    GUI and configuration tools are written using Python. Python does not limit you
    to the choice of user interface to follow – you can build command-line, GUI and
    web apps using Python. This way, it has got covered almost all the possible interfaces.
    Here we will look into executing sysadmin-related tasks using Python.


    # Parsing configuration files


    Configuration files provide a way for storing various settings. In order to write
    a script that allows you to modify settings of a particular application, you should
    be able to parse the configuration file of the application. In this section we
    learn how to parse INI-style configuration files. Although old, the INI format
    is very popular with modern open source software, as PHP and MySQL.


    Excerpt for php.ini configuration file:


    ```

    [PHP]

    engine = On

