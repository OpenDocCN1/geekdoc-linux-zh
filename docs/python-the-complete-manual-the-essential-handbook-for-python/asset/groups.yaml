    \ many features of Pygame, which is designed to make the creation of games and\
    \ interactive applications easier”\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_89_0.png)\n\
    \n# Program a Space Invaders clone\n\n# Create with Python\n\n```python\nself.all_sprite_list\
    \ = pygame.sprite.Group(Group)\nself.intro_screen = pygame.image.load(\n'data/start_screen.jpg').convert()\n\
    self.background = pygame.image.load(\n'data/Space-Background.jpg').convert()\n\
    pygame.display.set_caption('Invaders \\\nESC to exit')\npygame.mouse.set_visible(False)\n\
    Player.image = pygame.image.load(\n'data/spaceship.png').convert()\nAlien.image\
    \ = pygame.image.load(\n'data/alien.png').convert()\nAlien.image.set_color(WHITE)\n\
    GameState.end = False\nGameState.start_screen = True\nGameState.vector = 0\n```\n\
    \n```python\nself.screen.blit(self.game_font.render(\n'PRESS SPACE TO PLAY', 1,\
    \ WHITE),)\npygame.display.flip()\nself.control()\n```\n\n```python\ndef make_player(self):\n\
    \    self.player = Player()\n    self.player_group.add(self.player)\n    self.sprite_list.add(self.player)\n\
    ```\n\n```python\ndef refresh_screen(self):\n    self.all_sprite_list.draw(self.screen)\n\
