    \ = 5\nif int_condition < 6:\n    sys.exit(\"int_condition must be >= 6\")\nelse:\n\
    \    print(\"int_condition was >= 6\")\n```\n\n代码路径取决于整数 `int_condition` 的值。其他控制结构包括以下项目，你在使用\
    \ Python 时应该注意：\n\n- For 语句：允许你遍历集合中的项，或按次数重复一段代码\n- While 语句：当条件为真时持续的循环\n\n\
    我们将编写一个接受用户输入的程序，以演示控制结构的工作原理。我们将列表命名为 `construct.py`。`for` 循环使用当前值的局部副本，这意味着循环内部的任何更改都不会影响列表。另一方面，`while`\
