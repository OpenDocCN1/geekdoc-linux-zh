    Ease into the workings of Kivy by creating the pen-and-paper classic in just over
    100 lines of Python...


    Kivy is a highly cross-platform graphical framework for Python, designed for the
    creation of innovative user interfaces like multitouch apps. Its applications
    can run not only on the traditional platforms of Linux, OS X and Windows, but
    also Android and iOS, plus devices like the Raspberry Pi.


    That means you can develop cross-platform apps using Python libraries as Requests,
    SQLAlchemy or even NumPy. You can even access native mobile APIs straight from
    Python using your sister projects. Another great feature is the Kivy-optimized
    OpenGL pipeline, allowing advanced GPU effects even though the basic Python API
    is very simple.


    Kivy is a set of Python/Cython modules that can easily be installed via pip, but
    you will need a few dependencies. It uses Pygame as a rendering backend (though
    its API is not exposed), Cython for compilation of the speedy graphics compiler
    internals, and Gstreamer for multimedia. These should be available through your
    distro''s repositories, or via pip install.


    With these dependencies satisfied, you should install Kivy with the normal pip
    incantation. The current version is 1.8.0, and the codebase supports both python2
    and python3. The code in this tutorial is version-agnostic, running in python2.7
    and python3.3.


    ```

    pip install kivy

    ```


    If you have any problems with pip, you can use easy_install via easy install.


    There are also packages or repositories available for several popular distros.
    You can find more information on Kivy''s website. A Kivy application is started
    by instantiating and running an ''App'' class. This is what initialise your pp''s
    window, interfaces with the OS, and provides an


