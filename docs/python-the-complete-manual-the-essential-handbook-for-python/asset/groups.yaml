    ,\n               \"last_name\" : \"Fraser\",\n               \"eye-colour\" :\
    \ \"Blue\" }\n```\n\n## Let access some elements inside our collections\n\nWe'll\
    \ start by changing the value of the string in our hello_list and add an exclamation\
    \ mark to the end. The \"list\" string the 5th element in the list. However, indexes\
    \ in Python are zero-based, which means the first element has an index of 0.\n\
    \nNotice that there will be two exclamation marks present when we print the element\n\
    \n```python\nprint(hello_list[4])\nhello_list[4] += \"!\"\n# The above line is\
    \ the same as\n# hello_list[4] = hello_list[4] + \"!\"\nprint(hello_list[4])\n\
    ```\n\nRemember that tuples are immutable, although we can access the elements\
