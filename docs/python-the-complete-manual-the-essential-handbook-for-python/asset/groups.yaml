    # Create with Python


    # Program a Space Invaders clone


    # Classes – part 2


    # Main loop key logic – part 1


    07 In Pivader''s classes, besides creating the required attributes for the object,
    you''ll also notice all the classes have an update() method apart from the Block
    class (which is a function within a class). The update() method is called in every
    loop through the main game and simply asks the iteration of the class we''ve created
    to move. In the case of bullet from the Ammo class, we''re asking it to move down
    screen. If it goes off end, we destroy it.


    11 Firstly the game checks that the end_game_attribute is false – if it''s true,
    the entire loop in main_loop() is skipped and we go straight to pygame.quit().
    This flag is set to true only if the player closes the game window or presses
    the key when the start_screen. Assuming end_game and start_screen are false, the
    main loop can start top, with checks to see if the location of the player needs
    to change. Next we attempt to make an enemy missile and use the sandbox module
    to limit the number of missiles that can be created. Next we call the update()
    method for each every actor on the screen using a simple for loop. This makes
    everyone''s to dated and moved before we check collisions in calc_collisions().


    ![](img/f16311c48f0c39ab87b1836be5339b9e_91_0.png)


    # Ammo


    # Main loop key logic – part 2


    08 What''s most interesting about classes, though, is that you can use one class
    to create lots of different things. You could, for example, have a pet class.
    From that class you could create a cat (meow) and a dog (bark). They are in many
    ways; they''re both furry and have four legs, so both are created from the same
    parent class. We''ve done exactly that with Ammo class, using it to create both
    the player bullets and the alien allies. They''re different colours and they''re
    fundamentally one and the same.


    12 Once calculated, we need to see if the game is still met to continue. We do
    so with is_dead() and defenses_breached() – if either of these methods return
    true, we need to know to return to the start screen. On the other hand, we need
    to check if we''ve killed all the allies, from within win_round(). Assuming we''re
    not dead, but we can know the win_round() method creates a fresh batch of allies
    and increases their speed across the screen. We refresh everything that''s been
    moved, shot or killed which can be updated or removed from the screen. Remember,
    the main loop happens 20 seconds a time – so the fact we don''t count for the
    screen to update right at the end of the loop is of no consequence.


    # The game


    09 Our final class is called Game. This is where all the main functionality of
    the game itself comes, but in however, so far this is just a list of objects –
    nothing created at the start of the body. The Game class is the master. We integrate
    Pygame, for our protagonist and antagonist and create some GameState attributes
    that we use to control aspects of external classes, changing the player''s vector
    (direction).


    # The main loop


    10 There are a lot of methods (class) in the Game class, and each is designed
    to control a particular aspect of either setting up the game or the gameplay itself.
    This dictates what happens within any one of the games is contained in the main_loop()
    method at the bottom of the pivaders.py script and the script is the key to unlocking
    exactly what variables and functions you need for your game.'
