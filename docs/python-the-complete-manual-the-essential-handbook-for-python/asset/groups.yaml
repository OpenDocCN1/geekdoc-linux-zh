    \ make. In the case of our player, it contains all the required info, from which\
    \ you can make multiple copies (we create an instance in the main_player) method\
    \ through the project. The great thing about classes in Pygame is that they inherit\
    \ capabilities and characteristics from Pygame's sprite class, as denoted by `pygame.sprite.Sprite`\
    \ found within the braces of the first line of the class. You can read the docs\
    \ to learn more about the Sprite class via\n\n# Creating your clone\n\nOnce you've\
