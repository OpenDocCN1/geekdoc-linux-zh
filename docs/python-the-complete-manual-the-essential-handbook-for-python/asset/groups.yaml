- md: "\n## Get started with Python\n\n## Getting started\n\n## Coding style\n\nIt's\
    \ worth taking a little time to talk about coding style. It's simple to write\
    \ tidy code. The key is consistency. For example, you should always name your\
    \ variables in the same manner. It doesn't matter if you want to use camelCase\
    \ or underscores as we have. One crucial thing is to use self-documenting identifiers\
    \ for variables. You shouldn't have to guess what a variable does. The other thing\
    \ that goes with this is to always comment your code. This will help anyone else\
    \ who reads your code, and yourself in the future. It's also useful to put a brief\
    \ summary at the top of a code file describing what the application does, or a\
    \ part of the application if it's made up of multiple files.\n\n## Summary\n\n\
    This article should have introduced you to the basics of programming in Python.\
    \ Hopefully you are getting used to the syntax, indentation and general feel of\
    \ Python program. The next step is to learn how to come up with a problem you\
    \ want to solve, and break it down into small steps that you can implement in\
    \ programming language. Google, or any other search engine, is very helpful. If\
    \ you are stuck with anything, or an error message you can't work out, stick it\
    \ into Google and you should be a lot closer to solving your problem. For example,\
    \ if we search 'python', the first link takes us to Stack Overflow with a bunch\
    \ of useful replies. Don't be afraid to get stuck – the real fun of programming\
    \ is solving problems one chunk at a time.\n\n## Introducing Python\n\nPython\
    \ essentials\n\nLay the foundations and build your knowledge\n\nNow that you've\
    \ taken the first steps with Python, it's time to begin using that knowledge to\
    \ get coding. In this section, you'll find out how to begin coding apps for operating\
    \ systems. These easy-to-follow tutorials will help you cement the Python language\
    \ that you've learned, developing a skill that is very helpful in the current\
    \ technology. We'll finish up by giving you essential tips to increase your knowledge\
    \ and ability in no time.\n\n##\n\nPython provides quick and easy way to build\
    \ applications, including web apps. Python is known for its simplicity and capabilities.\
    \ At this point it is so advanced that there is nothing you cannot do with Python,\
    \ and conquering the web is one of the possibilities. When you are using Python\
    \ for web development you get access to a huge catalogue of modules and make the\
    \ most of them. Web development can be done in many ways, right from using plain\
    \ CGI modules to fully groomed frameworks. The latter is the most popular method\
    \ of building web applications with Python, since it allows you to build applications\
    \ without worrying about low-level implementation. There are many web frameworks\
    \ available for Python, such as Django, TurboGears and Web2Py. For this tutorial\
    \ we will be using our preferred project, Django.\n\n## Django Project\n\nThe\
    \ django-admin file is used to create new Django projects. In Django, a project\
    \ represents the site and its settings. An application, on the other hand, represents\
    \ a specific feature of the site, like blogging or tagging. The benefit of this\
    \ approach is that your Django application becomes portable and can be integrated\
    \ with other sites with very little effort.\n\n```$ django-admin startproject\
    \ issueTracker\n```\n\nA project directory will be created. This will also act\
    \ as the root of your development server that comes with Django. Under the project\
    \ directory you will find the following items:\n\n- manage.py: script to work\
    \ with your project.\n- issueTracker: A package (a directory with `__init__.py`\
    \ file) for your project. This package is the one containing your project's settings\
    \ and configuration data.\n- issueTracker/settings.py: this file contains all\
    \ the configuration options for your project.\n- issueTracker/urls.py: this file\
    \ contains various URLs.\n- wsgi.py: An entry-point for Django web servers to\
    \ serve your project. Only useful when you are deploying your project. For this\
    \ tutorial we won't need it.\n\nNow update the path options:\n\n```python\nTEMPLATE_DIRS\
    \ = (\n    path('templates'),\n)\n\nMEDIA_ROOT = path('media')\nMEDIA_URL = '/media/'\n\
    ```\n\nWe need to enable this app in the config file as well:\n\n```python\nINSTALLED_APPS\
    \ = (\n    'django.contrib.admin',\n    'issueTracker',\n)\n```\n\n## Configuring\
    \ the Django project\n\nBefore starting the application, let's configure the Django\
    \ project as per requirements. Edit `issueTracker/settings.py` as follows (only\
    \ modification required):\n\nDatabase Settings: We will be using SQLite as our\
    \ database system.\nNOTE: Red text indicates new or updated code:\n\n```python\n\
    'default': {\n    'ENGINE': 'django.db.backends.sqlite3',\n    'NAME': 'db.sqlite3',\n\
    }\n```\n\n## Creating the data model\n\nNow we need to enable the admin interface\
    \ for our Django site. This is a feature of Django that allows automatic creation\
    \ of an admin interface of the site to use and manage content for your Django\
    \ site. Uncomment the following line:\n\n```python\nINSTALLED_APPS = (\n    'django.contrib.admin',\n\
    \    'django.contrib',\n    'django.contrib.sessions',\n    'django.contrib.sites',\n\
    \    'django.contrib.messages',\n    'django.contrib.staticfiles',\n)\n```\n\n\
    This is the part where we define the data model for our app. Please see the inline\
    \ comments to understand what is happening here.\n\n```python\nfrom django.db\
    \ import models\n\n# We are importing the user authentication module that we use\
    \ the built-in this app\nfrom django.contrib import admin\n# We would also create\
    \ an admin interface for our app\nfrom django.contrib import admin\n\n# A Tuple\
    \ to hold the multi-choice fields.\n# First registers represents the field name\
    \ that represents the display name\nSTATUS_CHOICES = (\n    ('New', 'New'),\n\
    \    ('accepted', 'Accepted'),\n    ('reviewed', 'Reviewed'),\n    ('started',\
    \ 'Started'),\n    ('closed', 'Closed'),\n)\n```\n\n## Creating the app\n\nIn\
    \ this step we create an app for our tracker called issue. To have created the\
    \ data model reflected in the database, run the following:\n\n```\n$ manage.py\
    \ startapp issue\n```\n\n```python\nimport os\nfrom django.db import models\n\
    from django.contrib import admin\n\n# We are importing the user authentication\
    \ module that we use the built-in this app\nfrom django.contrib import admin\n\
    # We would also create an admin interface for our app\nfrom django.contrib import\
    \ admin\n\n# A Tuple to hold the multi-choice fields.\n# First registers represents\
    \ the field name that represents the display name\nSTATUS_CHOICES = (\n    ('New',\
    \ 'New'),\n    ('accepted', 'Accepted'),\n    ('reviewed', 'Reviewed'),\n    ('started',\
    \ 'Started'),\n    ('closed', 'Closed'),\n)\n\nclass Issue(models.Model):\n  \
    \  name = models.CharField(max_length=200)\n    description = models.TextField()\n\
    \    status = models.CharField(choices=STATUS_CHOICES, max_length=20, default='New')\n\
    \    owner = models.ForeignKey('User', on_delete=models.CASCADE)\n    opened_on\
    \ = models.DateTimeField(auto_now_add=True)\n    modified = models.DateTimeField(auto_now=True)\n\
    \n    def __str__(self):\n        return self.name\n```\n\n## Enabling the admin\
    \ site\n\nThe admin is already enabled, but we need to enable it in `urls.py`\
    \ - which uses the regex-based mapping to view. Update the `urls.py` file as follows:\n\
    \n```python\nfrom django.urls import path, include\nfrom django.contrib import\
    \ admin\n\nurlpatterns = [\n    path('admin/', admin.site.urls),\n    path('',\
    \ include('issue.urls')),\n]\n```\n\n```python\nclass Issue(admin.ModelAdmin):\n\
    \    date_hierarchy = ('opened_on',)\n    list_filter = ('status', 'owner')\n\
    \    list_display = ('id', 'name', 'status', 'modified', 'opened_on')\n    search_fields\
    \ = ['description', 'status']\n# register our site with the Django admin interface\n\
    admin.site.register(Issue, IssueAdmin)\n```\n\n## Starting the web server\n\n\
    Django includes a built-in web server ready to debug and test Django applications.\
    \ Let's start to see how our admin interface works... To start the web server:\n\
    \n```\n$ manage.py runserver\n```\n\nIf you do not have any errors in your code,\
    \ the server should be available on port 8000. To launch the admin interface,\
    \ navigate your browser to `http://localhost:8000`. You will be asked to log in.\
    \ Enter the username and password. You do not have any superusers. Would you like\
    \ to create one? (yes/no)\n\n```\n$ manage.py createsuperuser\n```\n"
  mdcn: "\n\n## 开始使用 Python\n\n## 入门\n\n## 编码风格\n\n花一点时间讨论编码风格是值得的。编写整洁的代码并不，关键在于一致性。例如，你应该始终以相同的方式命名变量。无论你是想使用驼峰法（camelCase）还是像我们这样的下划线命名法，并不重要。至关重要的一点是为变量使用自文档的标识符。你不应该去猜测变量的作用。另外一点是始终为代码编写注释。这将帮助任何阅读你代码的人，以及未来的你自己。在代码文件的开头放置一个简短的总结，描述应用程序的功能（或者如果应用程序由多个文件组成，则描述一部分），也是很有用的。\n\
    \n## 总结\n\n这篇文章应该向你介绍了 Python 编程的基础知识。希望你已经习惯了 Python 的语法、缩进以及 Python 程序的整体感觉。下一步是学习如何提出你想要解决的问题，并将其拆分为可以在编程语言中实现的小步骤。Google\
