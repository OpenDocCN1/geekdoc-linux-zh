    ## PIDs


    So we now have a target for what the quadcopter to do, and an input for what it''s
    doing, and some motors to close the gap between the two; all now need a way to
    join them together. A direct mathematical algorithm is nigh impossible – accurate
    weight of the quadcopter, power per rotation of each blade, weight imbalance would
    need to be incorporated into the equation and remain stable during flights (and
    crashes), blades and move in the frame; changes the weight of the quadcopter,
    altitude would need to be accounted for. Hopefully it''s clear this approach simply
    won''t work.


    Instead, an estimation method is used with feedback from the sensors to estimate
    that. Because the estimation/feedback loop spins over 10 times a second, this
    approach can react to errors quickly, and yet knows nothing about the factors
    - that''s all handled blindly; resulting in this is the PID. It takes the target,
    subtracts the feedback via Proportional, Integral and Differential to produce
    the output.


    The outputs are applied to each ESC in turn: the vertical speed is applied from
    the front and adding to the back, the pitch rate is split two, producing the pitch.
    Roll is handled mildly; yaw too is handled in simple way, but applied to diagonal
    blades which spin in the same direction.


    These ESC-specific outputs are then converted to PWM signal to feed the hardware
    ESCs with the updated propeller speeds.


