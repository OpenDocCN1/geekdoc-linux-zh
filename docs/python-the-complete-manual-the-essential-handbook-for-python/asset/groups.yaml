    .format(hello_dict[\"first_name\"],\n                            hello_dict[\"\
    last_name\"],\n                            hello_dict[\"eye-colour\"]))\n```\n\
    \n![](img/f16311c48f0c39ab87b1836be5339b9e_13_0.png)\n\n## Indentation in detail\n\
    \nAs previously mentioned, the level of indentation dictates a statement block\
    \ of code belongs to. Indentation is mandatory in Python, whereas in other languages,\
    \ sets of braces are used to organise blocks. For this reason it is essential\
    \ to use a consistent indentation. You can use tabs, but tabs are not well defined,\
    \ especially if you open a file in more than one editor.\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_14_0.png)\n\
    \n## Control structures\n\nIn programming, a control structure is any kind of\
    \ statement that can change the path that code takes. For example, a control structure\
    \ that decided to end the program if a number was less than 5 would look something\
    \ like this:\n\n```python\n#!/usr/bin/env python2\nimport sys\nint_condition =\
    \ 5\nif int_condition < 6:\n    sys.exit(\"int_condition must be >= 6\")\nelse:\n\
    \    print(\"int_condition was >= 6\")\n```\n\nThe path that code takes will depend\
    \ on the value of the integer int_condition. Other control structures include\
    \ the following items which you should be aware of when using Python:\n\n- For\
    \ statements, which allow you to iterate over items in collections, or to repeat\
    \ a piece of code again a certain number of times\n- While statements, a loop\
    \ that continues the condition is true.\n\nWe're going to write a program that\
    \ accepts user input from the user to demonstrate how control structures work.\
    \ We're calling the list construct.py. The 'for' loop uses a local copy of the\
    \ current value, which means any changes inside the loop won't make any changes\
    \ affecting the list. On the other hand however, the 'while' loop is directly\
    \ accessing elements in the list, so you'd want to do so. We will talk about variable\
    \ scope in some more detail later on in the article. The program is as follows:\n\
    \n```\n$ liam@liam-laptop$ ./construct.py\nHow many integers? acd\nYou must enter\
    \ an integer\n\n$ liam@liam-laptop$ ./construct.py\nHow many integers? 3\nPlease\
    \ enter integer 1: t\nYou must enter an integer\nPlease enter integer 1: 5\nPlease\
    \ enter integer 2: 2\nPlease enter integer 3: 6\nUsing a for loop\n5\n2\n6\nUsing\
    \ a while loop\n5\n2\n6\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_15_0.png)\n"
  mdcn: "\n\n## 入门\n\n## 学习 Python \n\n提示\n在此处有必要说明一下，Python 文件中任何跟在 `#` 字符后面的文本都会被解释器忽略。这样你就可以在代码中编写注释。\n\
    \n除了这些主要的数据类型外，还有序列类型（技术上地说，字符串是一种序列类型，但由于它非常常用，我们将其归为主要数据类型）：\n\n| 类型 |  |\n\
    | :--- | :--- |\n| List (列表) | 包含特定顺序的数据集合 |\n| Tuple (元组) | 包含特定顺序的不可变数据集合 |\n\
    \n元组通常用于坐标之类的内容，包含存储为单个变量的 x 和 y 值，而列表通常用于存储更大的集合。存储在元组中的数据是不可变的，因为你无法更改元组中单个元素的值。然而，在列表中你可以这样做。\n\
    \n了解 Python 的字典（dictionary）类型也会很有用。字典是一种映射数据类型。它存储键值对。这意味着你使用该值对应的键来访问字典中存储的值，这与使用列表的方式不同。在列表中，你使用元素的索引（表示该元素在列表中位置的数字）来访问列表的元素。\n\
    \n让我们来编写一个程序，演示如何使用变量和不同的数据类型。此时值得注意的是，在 Python 中你并不总是需要指定数据类型。可以在任何你喜欢的编辑器中创建此文件。只要你记住让该文件具有执行权限，一切都能正常工作。我们将我们的文件命名为\
    \ `variables.py`。\n\n## 解释型与编译型语言\n\n像 Python 这样的解释型语言是指源代码在每次程序运行时都会转换为机器码执行执行的。这与\
    \ C 等编译型语言不同，源代码只被转换为一次机器码——生成的机器码在每次程序运行时执行。\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_11_0.png)\n\
    \n## 学习 Python\n\n## 入门\n\n## 完整代码列表\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_12_0.png)\n\
