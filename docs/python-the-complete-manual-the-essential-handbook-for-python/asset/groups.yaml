- md: "\n# Create with Python\n\n# Program a Space Invaders clone\n\n# Setting dependencies\n\
    \n# Global variables & tuples\n\nIf you're looking to get a better understanding\
    \ of programming games with Pygame and Python, we strongly recommend you copy\
    \ the Pygame code in this tutorial into your own program. It is great practice\
