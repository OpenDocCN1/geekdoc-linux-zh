    # Pivarders Pt 2: graphics & sound


    This time we''ll expand our Space Invaders clone to include immersive animation
    and sound


    We had fun creating our basic Space Invaders clone, Pivarders, in the previous
    guide. Pygame''s ability to group, manage and detect collisions thanks to the
    Sprite class made a great difference to our project, not just in terms of code
    length, but if you missed the first part of the guide, you can find the v0.1 code
    listing via git.io/bCVTBg, while you can find v0.2 version of the code, including
    all the images, music and sound effects we''ve used at git.io/8Q2k-w.


    To help keep your project manageable and straightforward (as projects grow keeping
    your code easy to follow increasingly hard) we integrated a few animation methods
    into our Game class and opted to use a sprite sheet. Not only does it make it
    very easy to draw the screen, but it also keeps the asset count under control
    and keeps levels up, which is especially important for the Raspberry Pi. Hope
    you have fun using these techniques to animate and sound your projects!


    ![](img/f16311c48f0c39ab87b1836be5339b9e_93_0.png)


    # Setting up dependencies


    # Downloading Pivarders


