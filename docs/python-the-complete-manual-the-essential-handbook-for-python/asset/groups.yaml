    The orientation of the quadcopter compared to the direction of travel, the rotation
    of the propellers and the axes used in the code


    ## Orientation


    The overall orientation of the quadcopter depicting front, back, left and right
    relation to the sensor and propeller layout


    # Use Python with Pi


    # Program a quadcopter


    ## Code and reality


    In this code, there are nine PIDs in total. The horizontal plane, for both the
    X and Y axes, the horizontal PID converts the user-defined speed to required horizontal
    acceleration/angle of tilt; the angle PIDs convert this desired rate that the
    rotation PID converts to changes in speeds for the front/back and left/right motors.


    headwind will drift backwards due to the force applied by the wind. To compensate
    for this, it must tilt down at some angle so that some of the propellers'' thrust
    is applied horizontally to counteract the wind. In doing so, some of the power
    keeping the quadcopter at a high height is now fighting the wind; unless the overall
    power is increased, the quadcopter will the vertical direction, a single PID converts
    the desired rate of ascent/descent to the quadcopter output applied to each flight.


    Horizontal movement is more complex. The target is to move forwards at 1 metre
    per second. The initial requirement is the headwind compensation—down nose plus
    increased power will apply a forward force leading to acceleration. But once that
    speed is attained, the sensor needs to stop the acceleration, but at some time,
    friction in the air will slow the movement. So a dynamic tilt to maintain this
    stable forward velocity.


    Finally, prevention of yaw (via a spinning top) uses two PIDs—one to set the desired
    angle of yaw, and one to set the rotation rate. The output of these two controls
    the diagonal opposing motors which spin in the same direction. The most critical
    of these is pitch/yaw stability. This ensures that whatever requirements enforced
    by other PIDs and external factors, the quadcopter is stable in achieving those
    others; without this stability, the rest of the PIDs cannot work. Pitch is controlled
    by differences between the front and back rollers, and yaw by clockwise/counterclockwise
    differences from the corresponding PID outputs. The output of all three PIDs are
    then applied to the appropriate combination of motors'' PWM channels to set the
    individual pulse widths.


    Both-wind suppression and control horizontal movement may use nested PIDs; the
    X and Y axes output feeds the feed PID and angle PID to their targets; the sensor
    feedback maintain stability while meeting angle targets. The sensor feedback ensures
    as the desired horizontal speed is reached, the horizontal speed PID errors shrinking,
    reducing the targets for the angle PID, bringing the quadcopters back up to horizontal
    again.


    With stability, some level of take-off, hover and landing can be achieved using
    the desired vertical speed PID. Placing the quadcopter on a horizontal surface,
    set the target to 0.5 m/s and zoom into the air, while the speed PID ensures the
    horizontal angle of attack is maintained throughout the short flight, hover and
    landing.


    Hopefully it becomes clearer why accurate angle tracking is: in the nose-down,
    headwind example, to the vertical speed PID of the sensors is reduced by the cosine
    of the measured angle of tilt with respect to the horizon

