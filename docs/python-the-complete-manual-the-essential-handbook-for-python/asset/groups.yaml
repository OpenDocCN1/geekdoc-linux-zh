    # Control an LED using GPIO


    An introduction into an external output, as an LED, on the Pi


    After you have fired up your Pi, you maybe installed XBMC and had a play around
    with streaming, you might be ready for your next challenge. One to go down is
    to find interesting uses for one of the desktop OS available for the little computer,
    perhaps using it as a web server, an NAS or retro console. It is all great fun,
    but an often-overlooked feature of the Pi is its hardware pinouts. If you''ve
    never done electronics before, then the Pi is a great place to start. Or you have
    used a programmable microcontroller like Arduino in the past; the Pi, with its
    increased CPU and RAM over the Arduino, opens up many more possibilities for projects.


    The Raspberry Pi features a single PWM (pulse modulation) output pin, along with
    a series of GPIO (General Purpose Input/Output) pins. These enable electronic
    hardware such as buzzers, lights and switches to be controlled via the Pi. For
    people who are used to just ''using'' a computer, or only programming software
    that only acts on the machine itself, controlling a real physical item such as
    a light can be a revelation.


    +   1: All the items you need to get just adjusting an LED using PWM. The wires
    should have a male and female ends


    ![](img/f16311c48f0c39ab87b1836be5339b9e_123_0.png)


    +   2: Place the female end onto the Pi, noting pin number 1 is identified by
    the small Pi. The blue wire is ground


    ![](img/f16311c48f0c39ab87b1836be5339b9e_123_1.png)


    +   3: Once it is connected up, plug in your USB power cable


    ![](img/f16311c48f0c39ab87b1836be5339b9e_123_2.png)


    This tutorial will assume no knowledge of electronics or programming, and will
    take you through the steps needed to control an LED using the Raspberry Pi, from
    setting it up to coding a simple application.


    +   4: Switch the power on. The LED will light up. If it''s dim, use a lower-rated
    resistor


    ![](img/f16311c48f0c39ab87b1836be5339b9e_123_3.png)


