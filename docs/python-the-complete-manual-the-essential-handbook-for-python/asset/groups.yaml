    # Use Python with Pi


    ## Programming in Python on the Raspberry Pi


    ## Saving your work


    03 It''s always a good idea to saving your work with Ctrl+S as you program, because
    it would be a shame to lose anything you''ve worked on for the first time; either
    press Ctrl+S or go to the file menu and Save. Give the file a sensible name and
    save it in the tidy structure you created before. It''s a good habit to be well
    organised programming, because it makes things easier when your projects become
    bigger and more complicated.


    ![](img/f16311c48f0c39ab87b1836be5339b9e_105_0.png)


    ## Setting it up


    04 Having detailed comments in your code is important because you have to note
    down things when programming and document projects. If another programmer has
    to work with your code in the future, they''ll be extremely grateful. Start by
    adding a comment with what the program will do and your name. All comments start
    with a hash # to be interpreted as the Python interpreter. We import the library
    so we can use the exit function to close the program later on. Also import everything
    from the decimal library because we want to use the name of the decimal type.


    > "It''s a good habit to be well organised when programming”


    ## Variables


    05 A variable that is stored in memory and can be accessed via a name. Our program
    is going to start by asking for your first name, then store that in a variable
    and print out a welcome message. We''re going to add a comment that explains this
    and create a variable called firstly. Notice how we''ve capitalized the first
    letter of the second word to make it easier to read.


    We want our variable name to hold the value returned by a function called input,
    which asks the user for input. The question is passed into the function brackets,
    and the result is a string with quotation marks. A string type is basically a
    collection of characters. Note the space we''ve added after the colon before the
    user types their input after this question.


    ## Printing a message


    ```python

    #!/usr/bin/env python


    # An Hello World

    # programming in python v

    # For Linux User and Dev


    # Import the library for

    import sys

    # Import everything from

    from decimal import *

    ```


    06 Now that we have a variable in firstly, we need to output a message to the
    screen. We print to the screen in Python using the print function. The function
    is enclosed by a pair of brackets which enclose the value. When using the addition
    operator with strings, they are joined. Note how firstly doesn''t need to be enclosed
    in quotation marks, the text firstly would be output. We finish by adding a ''\n''
    character (new line) to our output to leave one blank line before we start our
    next example.


    ## Programming in Python on the Raspberry Pi Use Python with Pi


    ![](img/f16311c48f0c39ab87b1836be5339b9e_106_0.png)


    ## Testing our program


    08 Now we''ve done that part, why not test it? It''s worth noting that you have
    to save before running the program, or anything you''ve done since you last saved
    won''t be interpreted by Python. Run the program by the F5 key. Input your number
    by typing it and then pressing the Enter key. Once you have done this, you''ll
    see a message. If the program exits with the code 0 then everything was run successfully.
    Press Enter to close the terminal.


    ## Fixing a small issue


    > 07 The Debian Image that we are currently using has a small misconfiguration
    in Geany. If you have this problem by trying to run your program with either the
    F5 key or going to the Build menu and selecting Execute. If the issue is present
    then will happen and you will see a message ''Could not find terminal: xterm''.
    It''s easy to fix Go to the Edit menu and then select Preferences. Go to the Tools
    tab and change the value for Terminal from xterm to terminal.


    ## Working with numbers


    09 We''re going to ask the user for a number by basically repeating the first
    couple of lines in it. Once the user gives us a number, we''ll square and double
    it. The raw_input function returns the value that the user input as a string.
    A string is a text-based value we can perform arithmetic on. The integer type
    in Python can only store whole numbers whereas the decimal type can store numbers
    with decimals. We''re going to do something called type cast, which basically
    converts a value with one type to another. We''re going to convert our number
    string to a decimal value because it''s like that decimals will be involved. If
    the number was an integer type, any values would simply be cut off the end without
    any rounding. This is called truncation.


    ## Use Python with Pi Programming in Python on the Raspberry Pi


    ## Performing arithmetic


    The main arithmetic operators in Python are + - / *, divide and multiply respectively.
    We''ve created three variables called numberHalved, numberDoubled and numberSquared.
    Notice that we need to specify the type of their initial value. The number variable
    is decimal type, so all values returned from performing arithmetic on number will
    also be of decimal type.


    ```python

    # Print out the values we just worked out, converting each value to a string

    print("result of halving number: " + str(numberHalved))

    print("result of doubling number: " + str(numberDoubled))

    print("result of squaring number: " + str(numberSquared))

    ```


    ## Printing our numbers


    Now that we have performed arithmetic, we need to print the results using print
    function. The print function only accepts values passed to it. This means we need
    to convert each decimal value to a string using the str() function before they
    can be printed. We use print with nothing between the quotation marks to print
    one blank line. This works because the print function always adds a new line at
    the end of its output unless told otherwise.


    ## Input validation with Loops and if statements


    To demonstrate a loop and if statements, we will output a question to the user
    who requires either yes or no answer. A loop runs until a condition is not met.
    In this case, we will create a variable yesNo and the loop will run while yesNo
    is False. Any code that is part of the loop needs to be indented in the lines
    below the colon. Any code is not indented will not be of the loop. This is the
    same for if statement. The condition is checked with the comparison operator ==
    A single = is an assignment operator while double comparison operator is != which
    means ‘not equal to’. We create a variable ‘result’, which holds the value of
    the question do you want to continue? We then check if this result is valid with
    if statement. If the user inputs no then set yesNo to True, which stops the loop
    on the next run. Otherwise, we output an error message and the loop will run again.
    The user can use the Ctrl+C command at the terminal to exit at any time.


    ![](img/f16311c48f0c39ab87b1836be5339b9e_107_0.png)


    Below The Raspberry takes the “PI” part of its name compatibility with the Python
    language


    ## Programming in Python on the Raspberry Pi Use Python with Pi


    | Line | Code |

    | :--- | :--- |

    | 42 | Deal with the result |

    | 43 | if result == ''yes'': |

    | 44 | print("Continuing") |

    | 45 | else: |

    | 46 | print("Exiting") |

    | 47 | exit() |


    > "The print function always adds a new line at the end of its output"


    Continue or exit?


    We will deal with the result that was stored during the loop statements. If the
    user typed ''yes'' instead of ''no'', then we will print ''Continuing''. Otherwise,
    we will print ''Exiting'' and then the system will exit. You don''t have to do
    anything for the program to continue because the exit function wasn''t called.
    This code also shows that the newline character ''\n'' can be used anywhere in
    a string, not just in separate quotation marks above.


    | Line | Code |

    | :--- | :--- |

    | 52 | # like while loop to add 5 to the number and output the value each time
    |

    | 53 | print("Incrementing the number by 5") |

    | 54 | while count <= 5: |

    | 55 | number += 5 |

    | 56 | print("number " + str(count) + " = " + str(number)) |

    | 57 | # Increment the count |

    | 58 | count -= 1 |


    ## Finishing off


    The final step is to print that the program is exiting. This is the last line
    and we don''t have to do anything else because Python finishes when there are
    no more lines to interpret.


    ## Loops with numbers


    We will use a while loop that uses a number and a <= (less than or equal to) operator
    as its stopping condition. The loop will be used to increment the number by printing
    it on each loop until the stopping condition is met. The count variable allows
    us to know exactly many times we have been through the while loop.


    ```python

    Please enter your first name: Liam

    Welcome Liam


    Please enter a number: 12.12

    The result of halving that number: 6.06

    The result of doubling that number: 24.24

    The result of squaring that number: 146.894


    Do you want to continue? (yes/no) yes


    Continuing

    Incrementing the number by 5


    number + 1 = 13.12

    number + 2 = 14.12

    number + 3 = 15.12

    number + 4 = 16.12

    number + 5 = 17.12


    Exiting

    ```


    ## Incrementing numbers with a loop


    The while loop will run until the count is 6, meaning that it will run for a total
    of 5 times because the count begins at 1. On each run, the while loop increments
    the variable and then prints what is being added to the original number, followed
    by the result. Finally, the count is incremented.


    ## Admire your work


    Now that we''ve finished coding, save any changes you have made and run your program
    with the F5 key.


