    \    ints.append(new_int)\n    # 计数加 1\n    count += 1\n```\n\n```python\nprint(\"\
    Using a for loop\")\nfor value in ints:\n    print(str(value))\n```\n\n```python\n\
    # 或者使用 while 循环：\nprint(\"Using a while loop\")\n# 我们已经有了上面的总数，但知道\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_17_0.png)\n\
    \n# Python 入门\n\n# 入门\n\n```python\n# len 函数非常\n# 有用。\ntotal = len(ints)\ncount\
    \ = 0\nwhile count < total:\n    print(str(ints[count]))\n    count += 1\n```\n\
    \n# 关于 Python 列表的更多信息\n\nPython 列表类似于其他语言中的数组。Python 列表（或元组）可以包含不同的数据类型，这在其他语言的数组中通常是不可能的。由于这个原因，我们建议你只在列表中存储相同类型的数据。由于列表中数据处理方式的性质，几乎在所有情况下都是如此的。\n\
    \n![](img/f16311c48f0c39ab87b1836be5339b9e_18_0.png)\n\n# 函数和变量作用域\n\n编程中的函数用于将过程分解成更小的部分。这通常会让代码变得更易读。如果设计得当，函数还可以被复用。函数可以接收传递的变量。Python\
    \ 中的变量始终通过值传递，这意味着变量的副本被传递给函数，该副本仅在函数作用域内有效。在函数内部对原始变量的任何更改都将被丢弃。然而，函数也可以返回值，所以这不是问题。函数使用关键字\
    \ `def` 定义，后面紧跟函数名。任何可以传递的变量都在函数名后的括号中。多个变量之间用逗号分隔。在这些括号中变量的名称就是它们在函数作用域内的名称，无论传递给函数的变量被称为什么。\n\
    \n让我们来看一下实际操作。对应的程序程序输出如下：\n\n> “函数使用关键字 `def` 定义，然后是函数名”\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_18_1.png)\n\
    \n# 入门\n\n# Python 入门\n\n```python\n#!/usr/bin/env python2 # 下面是一个名为 modify_string\
