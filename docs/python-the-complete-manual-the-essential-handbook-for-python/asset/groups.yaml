    Now that we have performed our arithmetic, we need to print the results using
    the print function. The print function only accepts values passed to it. This
    means we need to convert each decimal value to a string using the str() function
    before they can be printed. We use a print with nothing between the quotation
    marks to print one blank line. This works because the print function always adds
    a new line at the end of its output unless told otherwise, so an empty string
    prints a new line.


    # Input validation with Loops and If statements


    To demonstrate a loop and if statements, we will output a question to the user
    who requires a yes or no answer. We''re going to ask them if they want to continue
    – and for require either a lower-case yes or a lower-case no. A loop runs until
    a condition is not met. In this case, we will create a variable yesOrNo and the
    loop will run while yesOrNo is False. The variable will be a Boolean type that
    can be True or False. The variable will be initialized with a value of False,
    or the loop will not run.


    A loop has the format while condition: any code that is part of the loop needs
    to be indented in the lines below the colon. Any code that is not indented will
    not be part of the loop. This is the same for an if statement. The condition is
    checked with the comparison operator ==. A single = is an assignment operator
    while a double comparison operator is !=. != which means ‘not equal to’. We create
    a variable ‘result’, which holds the value of the question, do you want to continue?
    We then check if this result is valid with an if statement. The no: operator allows
    two conditions to be tested: if the user inputs no then set yesOrNo to True, which
    stops the loop on the next run. Otherwise, we output an error message and the
    loop will run again. The user can use the Ctrl+C command at the terminal to exit
