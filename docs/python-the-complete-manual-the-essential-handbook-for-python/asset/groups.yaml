    In contrast, the gyro output does not suffer from the noise, but since it is the
    angular speed measured, it needs to be integrated over time to find the angle
    of the quadcopter in comparison to the horizon. Rounding errors in the integration
    lead to ever increasing errors over time, ultimately the maximum length of a flight.


    Now with an angle in hand, it is possible to convert accelerometer sensor data
