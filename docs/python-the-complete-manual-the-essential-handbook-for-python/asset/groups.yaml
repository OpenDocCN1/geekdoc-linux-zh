  mdcn: "\n\n# 使用 Python 创建\n\n# 编写一个太空侵略者克隆游戏\n\n# 设置依赖项\n\n# 全局变量与元组\n\n如果你想更好地理解如何使用\
    \ Pygame 和 Python 编写游戏，我们强烈建议你将本教程中的 Pygame 代码复制到你自己的程序中。这是一个非常棒的练习，并让你有机会调整游戏元素以适应你的需求，或者构建不同的图像、改变难度或外星人波的行为。如果你只是想玩这个游戏，也可以轻松实现。无论哪种方式，游戏唯一的依赖\
    \ Pygame（如果尚未安装的话）可以通过终端通过以下命令安装：\n\n```bash\nsudo apt-get install pygame\n```\n\
    \n一旦我们导入了项目所需的模块，就会有一系列全大写的变量。大写表示这些变量是常量（全局变量）。这些是永远不会改变的重要变量——我们在代码中引用的内容……\n\
    \n# 安装\n\n对于《入侵者游戏》，我们使用了 Git，这是一种出色的版本控制形式，可以安全地存储游戏并保留代码的历史版本。你的电脑上应该已经安装了 Git，或者你可以通过以下方式获取：\n\
    \n```bash\nsudo apt-get install git\n```\n\n作为代码的一项有用考虑，Git 允许你克隆其他项目的副本，你可以对其进行开发或直接使用。克隆\
    \ Pygame，在终端中进入你的主文件夹（cd ~），为项目创建一个目录（pygame invaders），进入该目录（cd invaders）并拉取：\n\
    \n```bash\ngit pull https://github.com/russell78/pygame.inv\n```\n\n# 测试 Pyaders\n\
    \n# 类 – 第一部分\n\n在安装 Pygame 并将项目代码放到你的电脑上（你也可以在此 issue 的封面 DVD 中找到 zip 包——只需将其解压并复制到你的主目录）即可正确设置。你需要在终端的\
    \ pyaders 目录下输入 `python game.py` 来开始。你可以使用空格键开始游戏（相同的按钮），并只需使用键盘上的左右箭头控制你的飞船左右移动。\n\
