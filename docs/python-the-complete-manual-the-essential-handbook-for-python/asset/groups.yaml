    \n# 制作一个入侵者大战克隆\n\n用 300 行 Python 写你自己的射击游戏\n\n当你学习用新语言编程或掌握新模块时，尝试熟悉且简单的项目是一个非常有用的练习，可以帮助扩展对所用工具的理解。我们的入侵者大战克隆就是一个适合\
