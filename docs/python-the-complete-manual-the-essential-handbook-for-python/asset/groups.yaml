    \ different image, changing the difficulty or the alien waves' behavior. If you\
    \ just want to play the game, that's easily achieved enough, too. Either way,\
    \ the game's only dependency is Pygame (if it isn't already) can be installed\
    \ from the terminal by:\n\n```bash\nsudo apt-get install pygame\n```\n\nOnce we've\
    \ imported the modules we need for the project, there's quite a list of variables\
    \ in block capitals. The capitals denote these variables are constants (global\
    \ variables). These are important variables that never change—things we refer\
    \ to in the code...\n\n# Installation\n\nFor Invaders, we've used Git, a brilliant\
    \ form of version control to safely store the game and retain historical versions\
    \ of your code. Git should already be installed on your PC, or you can acquire\
    \ it by:\n\n```bash\nsudo apt-get install git\n```\n\nAs a useful consider for\
    \ your code, Git allows you to clone copies of others' projects so you can work\
    \ on them, or just use them. Clone Pygame, go to your home folder in the terminal\
    \ (cd ~), make a directory for the project (pygame invaders), enter the directory\
    \ (cd invaders) and pull:\n\n```bash\ngit pull https://github.com/russell78/pygame.inv\n\
    ```\n\n# Testing Pyaders\n\n# Classes – part 1\n\nWith Pygame installed and the\
    \ project code to your machine (you can also find the zip in this issue's cover\
    \ DVD – simply unpack it and copy it to your home directory) to set up properly.\
