    使用 NumPy、SciPy 和 Matplotlib 进行强大的计算


    NumPy 是执行科学计算的主要包。它拥有强大的 N 维数组对象、集成 C/C++ 和 Fortran 代码的工具、线性代数、傅里叶变换和随机数能力等。NumPy
    还支持广播（broadcasting），这是一种巧妙的方法，让通用函数以有意义的方式处理不完全相同的输入。


    除了这些功能外，NumPy 的另一个优势是它可以集成到 Python 程序中。也就是说，你可以从数据库、另一个程序的输出、外部文件或 HTML 页面获取数据，然后使用
    NumPy 对其进行处理。


    这篇文章将向你如何安装 NumPy、进行计算、绘制数据图、读取和写入数据。NumPy 的某些功能在非 POSIX 系统上也可能有用，例如处理 URL 的路径名部分。你也可以使用双问号（??）来查看相关对象的源代码。


