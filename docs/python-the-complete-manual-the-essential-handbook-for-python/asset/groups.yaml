    \ = -random.randint(1, 3)\n\ndef start():\n    global paddle_pos, paddle_vel,\
    \ score\n    paddle_pos = [random.choice([True, False])]\n    paddle_vel = [0,0]\n\
    \    score = 2,0\n    paddle_pos = [w/2, h - pad_h/2]\n\ndef draw(canvas):\n \
