    \ and\nwill occur whenever a user presses, releases a\n'GridEntry' button. We\
    \ could also bind to 'on_press',\nwhich is dispatched when the button is first\
    \ clicked,\nor to any Kivy property of the button, dispatched\ndynamically when\
    \ the property is modified.\nWe added each 'GridEntry' widget to our 'Grid' via\n\
    a 'add_widget' method. That means each one\nis child widget of the 'TicTacToeGrid',\
    \ and so it will\n\nThis adds an status list representing how we\nplayed, and\
    \ a number to represent the current\nplayer (for '0' or '1').\nBy placing these\
    \ in our status list, we'll know\nif somebody wins because the sum of a row, column\n\
    diagonal will be +3. Now we can update our graphical\ngrid when a move is played.\n\
    \n![](img/f16311c48f0c39ab87b1836be5339b9e_82_0.png)\n\n```\ndef button_pressed(self,\
    \ instance):\nprint('{} button clicked.'.format(instance.coords))\n```"
  - "[PAGE 83]\n\n# Create with Python\n\n# Build tic-tac-toe with Kivy\n\n```\ndef\
    \ button_pressed(self, button):\n    player = { 'O': 0, 'X': 1 }\n    colours\
    \ = { 1: (1, 0, 0), -1: (0, 0, 1) }\n    #) # (r, g, b, a)\n\n    row, column\
    \ = button.coords\n\n    status_index = 3*row + column\n    already_played = self.status[status_index]\n\
    \n    if not already_played:\n        self.status[status_index] = current_player\n\
    \        button.text = { 'O': 'O', 'X': 'X' }\n        button.background_color\
    \ = colours[current_player]\n        self.current_player *= -1\n```\n\n```\ndef\
    \ on_status(self, instance, new_value):\n    status = new_value\n\n    sums =\
    \ [sum(status[0:3]), # rows\n            sum(status[3:6]),\n            sum(status[6:9]),\n\
    \            sum(status[0::3]), # columns\n            sum(status[1::3]),\n  \
    \          sum(status[2::3]),\n            sum(status[0::4]), # diagonals\n  \
    \          sum(status[4::-2])]\n\n    if 3 in sums:\n        print('Os win!')\n\
    \    elif -3 in sums:\n        print('Xs win!')\n    elif 0 not in self.status:\
    \ # Grid full\n        print('Draw!')\n```\n\nYou can run again to see exactly\
    \ what this did, and you'll find that each button now shows an 'O' or 'X' with\
    \ a coloured background depending on whose turn it is. Not only, but you can only\
    \ play one move in each thanks to our status array that keeps track of the existing\
    \ moves.\n\nThis covers the basic detection of a win or drawn board, but it only\
    \ print the results to stdout. At this stage we probably want to reset the board\
    \ so that the players can try again, with displaying a graphical indicator of\
    \ the result.\n\nThis is enough to play the game but there's one vital element\
    \ missing, a big-pop telling you that you've won! Before we do that, we need to\
    \ add some to check if the game is over. Kivy properties have another useful feature\
    \ here, wherever they change they automatically call an 'onproperty' method if\
    \ it exists and dispatching a corresponding event in Kivy's system. It makes it\
    \ very easy to write code that will run when a property changes, both in Python\
    \ and kv language. In our case we can use it to check the status list every time\
    \ it is updated, something special if a player has filled a column, or diagonal.\n\
    \n```\ndef reset(self, *args):\n    self.status = [0 for _ in range(9)]\n\n  \
    \  for child in self.children:\n        child.text = ''\n        child.background_color\
    \ = (1, 1, 1, 1)\n\n    self.current_player = 1\n```\n\nFinally, we can modify\
    \ the 'on_status' method to reset the board and display the winner in a 'ModalView'\
    \ widget.\n\n```\nfrom kivy.uix.modalview import ModalView\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_83_0.png)"
  - "[PAGE 84]\n\n# # Build tic-tac-toe with Kivy\n\nThis is a pop-up widget that\
    \ draws itself on top of everything else rather as part of the user widget tree.\
    \ It also automatically closes when the user clicks or taps outside it.\n\n+ \
    \  - winner = None\n- if -3 in sums:\n  winner = 'Xs win!'\n- elif 3 in sums:\n\
    \  winner = 'Os win!'\n- elif 0 not in sums:\n  winner = 'Draw...nobody wins!'\n\
    \n![](img/f16311c48f0c39ab87b1836be5339b9e_84_0.png)\n\n```\nif winner:\n  popup\
    \ = ModalView(size_height=0.75, 0.5)\n  victory_label = Label(text=winner, font_size=50)\n\
    \  popup.add_widget(victory_label)\n  popup.bind(on_dismiss=self.reset)\n  popup.open()\n\
    ```\n\n# ## Time to experiment\n\nThis mostly uses the same ideas we have already\
    \ covered, adding the 'Label' widget to the 'ModalView' then letting the 'ModalView'\
    \ take care of drawing itself and its children on top of everything else. We also\
    \ use binding; this time to 'on_dismiss', which is an event dispatched by the\
    \ 'ModalView' when it is closed. We made use of the 'size_hint' property common\
    \ to widgets, which in this case is used to set the 'ModalView' size proportional\
    \ to the window – while allowing the window to dynamically resize, maintaining\
    \ these proportions. This is another trick made possible by a binding with the\
    \ 'size_hint' Kivy property, this managed internally by Kivy.\n\nThis has been\
    \ a quick tour through some of Kivy's features, but hopefully it demonstrates\
    \ how to think about building a Kivy application. Our programs are built from\
    \ inbuilt Kivy widgets, interacting by having Python code run their properties\
    \ change (eg 'on_status' method) or when they dispatch events (eg 'Button' 'on_release').\
    \ We briefly saw Kivy language and experienced how it can automatically create\
    \ bindings between properties. You can find a copy of the program on FileSí, reference\
    \ this to check you've followed everything correctly. We've also added an extra\
    \ widget, the 'Interface', with a structured content entry in kivy language that\
    \ demonstrates how to add child widgets. We test it by implementing the return\
    \ 'Interface' line in 'TicTacToeGrid'.It doesn't do anything different to what\
    \ we have already covered, but it does make extensive use of kivy language binding\
    \ ability to automatically update, and to resize the TicTacToeGrid so it is always\
    \ square to fit within your parent. You can play with the settings to see how\
    \ it fits together, or swapping out the different widget types to see how other\
    \ widgets behave.\n\nThat's a finished program! We can not only play tic-tac-toe,\
    \ but our program automatically tells us when somebody has won, and resets the\
    \ board so we can play again. Simply run your program and enjoy hours of fun!"
- md: "\n# Create with Python\n\n# Make a Pong clone with Python\n\n## What you'll\
    \ need...\n\n- Latest Raspbian Image: www.raspberry.org/downloads\n- Pillow: https://github.com/raspberry/python-Pillow\n\
    - SimpleGUItk: https://github.com/dholm/simpleguitk/\n\n## Make a Pong clone with\
    \ Python\n\nWe update the retro classic Pong for the Linux generation with a new\
    \ library called SimpleGUItk.\n\nBelow: 'Tux for Two' is a great little Pong using\
    \ the beloved Linux mascot, Tux, in the center of the action.\n\nThe Raspberry\
    \ Pi is a fantastic way to start how to code. One area that can be very rewarding\
    \ for amateur coders is game programming, allowing for a more interactive result\
    \ and a greater sense of accomplishment. Game programming can also teach improvisation\
    \ and advanced mathematics for skills. We'll be using the fantastic SimpleGUItk\
    \ module in Python, a very straightforward way of creating graphical interfaces\
    \ using Tkinter.\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_85_0.png)\n\n# Python\
    \ module preparation\n\n## Install the modules\n\n- 01 Head to the websites we've\
    \ listed in 'What you'll need' and download a zip of the source files from the\
    \ GitHub pages. Update your Raspbian packages and start installing them:\n\n-\
    \ 06 The important parts in the draw section of the draw_line, draw_image and\
    \ draw functions. These are specifically from SimpleGUI and allow you to easily\
    \ put objects on the screen with a size, colour. You need to tie to an object,\
    \ though – in this canvas. This tells the software at what we want to put these\
    \ items on the screen for to see.\n\n```bash\n$ sudo apt-get install python-dev\
    \ setuptools tk8.5-dev\n```\n\n- 02 Open the terminal and use cmd to extract the\
    \ extracted Pillow folder, then use type:\n\n- $ $ sudo python setup.py install\n\
    Once it's complete, make to use simpleGUItk and use the same command to install\
    \ that as well:\n\n- 03 Launch IDE, after IDLE 3, Open a new module. Use the code\
    \ editor to write your game 'Tux for two!' We be careful to follow along with\
    \ doing it. make sure you know what we are doing. make changes to the rules if\
    \ you want.\n\n# SimpleGUI setup code\n\n## Set up the game\n\n- 04 There's nothing\
    \ too groundbreaking to start the code: Tux's and the paddles initial positions\
    \ are set, along with the speed and direction of Tux. These are used when a point\
    \ is won and the playing field is reset. The direction and speed is set to random\
    \ for each spawn.\n\n- 06 The last parts are purely for the interface. The code\
    \ will tell what to do when a key is pressed and released, and give it a framework\
    \ in. The frame will tell you how to handle the graphics, key funcs etc Finally,\
    \ we give it frame.start() so it starts.\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_85_1.png)\n\
    \n# Make a Pong clone with Python\n\n## Full listing\n\n```python\nimport simpleguitk\
    \ as simpleguikit\nimport random\n\nw, h = 600, 400\ntux = 20\npad_w = 0\npad_h\
    \ = 80\n\ndef tux_spawn(right):\n    global tux_pos, tux_vel\n    tux_pos = [0,0]\n\
    \    tux_vel = [0,0]\n    tux_pos[0] = w/2\n    tux_pos[1] = h/2\n    if right:\n\
    \        tux_vel[0] = random.randint(2, 4)\n    else:\n        tux_vel[0] = -random.randint(2,\
    \ 4)\n        tux_vel[1] = -random.randint(1, 3)\n\ndef start():\n    global paddle_pos,\
    \ paddle_vel, score\n    paddle_pos = [random.choice([True, False])]\n    paddle_vel\
    \ = [0,0]\n    score = 2,0\n    paddle_pos = [w/2, h - pad_h/2]\n\ndef draw(canvas):\n\
    \    global score, paddle_pos, paddle_vel\n    if paddle_pos[1] > (h - pad_h/2):\n\
    \        paddle_pos[1] = (h - pad_h/2)\n    elif paddle_pos[1] < 0:\n        paddle_pos[1]\
    \ = 0\n    paddle_pos += paddle_vel\n    \n    if paddle_pos[0] > (w - pad_w/2):\n\
    \        paddle_pos[0] = (w - pad_w/2)\n    elif paddle_pos[0] < 0:\n        paddle_pos[0]\
    \ = 0\n    paddle_pos += paddle_vel\n    \n    canvas.draw_line([w/2, 0], [w/2,\
    \ h], 2, \"Green\")\n    canvas.draw_line([0, h/2], [w, h/2], 2, \"Green\")\n\
    \    canvas.draw_rectangle([paddle_pos[0], paddle_pos[1], paddle_pos[0]+pad_w,\
    \ paddle_pos[1]+pad_h], \"Green\")\n    tux_pos[0] += tux_vel[0]\n    tux_pos[1]\
    \ += tux_vel[1]\n    if tux_pos[0] <= 0 or tux_pos[0] >= w:\n        tux_vel[0]\
    \ = -tux_vel[0]\n\n    if paddle_pos[0] <= pad_w:\n        if (paddle_pos[1] +\
    \ pad_h/2) >= tux_pos[1]:\n            tux_pos[1] = (paddle_pos[1])\n        \
    \    tux_vel[0] = -tux_vel[0]\n            tux_vel[1] *= 1\n    else:\n      \
    \  score += 2\n        tux_spawn(True)\n\n    if paddle_pos[0] >= w - pad_w:\n\
    \        if (paddle_pos[1] + pad_h/2) <= tux_pos[1]:\n            tux_vel[0] =\
    \ -tux_vel[0]\n            tux_vel[1] *= 1\n    else:\n        score += 1\n  \
    \  canvas.draw_image(tux, (265, 314 / 2), (265, 45), \"Green\")\n    canvas.draw_text(str(score),\
    \ [150, 100], \"Green\")\n\ndef keydown(event):\n    global paddle_pos, paddle_vel\n\
    \    acc = 3\n    if event.key == simplegui.KEY_MAP['left']:\n        paddle_vel[0]\
    \ -= acc\n    elif event.key == simplegui.KEY_MAP['right']:\n        paddle_vel[0]\
    \ += acc\n    elif event.key == simplegui.KEY_MAP['up']:\n        paddle_vel[1]\
    \ -= acc\n\nframe = simplegui.create_frame('Tux for Two', w, h)\nframe.set_keydown_handler(keydown)\n\
    frame.set_keyup_handler(keyup)\nframe = simplegui.load_image('http://upload.wikimedia.org/wikipedia/commons/a/af/Tux.png')\n\
    \nstart()\nframe.start()\n```\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_86_0.png)\n\
    \n# Create with Python\n\n# Program a Space Invaders clone\n\n## What you'll need...\n\
    \n- Raspberry: www.raspberry.org/downloads\n- Python: www.python.org/doc\n- Pygame:\
    \ www.pygame.org/docs\n\n# Program a Space Invaders clone\n\nWrite your own Raspberry\
    \ shooter in 300 lines of Python\n\nWhen you're learning to program in a new language\
    \ or trying to master a new module, experimenting with a familiar and relatively\
    \ simple project is a useful exercise to help expand your understanding of the\
    \ tools you're using. Our Space Invaders clone is one such example that lends\
    \ itself to Python and the Pygame module - it's a simple game with almost universally\
    \ understood rules and logic.\n\nWe've tried to use many features of Pygame, which\
    \ is designed to make the creation of games and interactive applications easier.\
    \ We've extensively used the Sprite class, which saves dozens of lines of extra\
    \ code in making collision detection simple and updating the screen and its many\
    \ actors a single-line command.\n\nHave fun with the project and make sure you\
    \ tweak and change things to make it your own!> **Did you know...**\n> Space Invaders\
    \ was one of the biggest arcade hits in the world. It's a great first game everyone\
    \ knows how to play!\n> Raspberry Invaders is a Space Invaders clone we've made\
    \ especially for the Pi.\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_87_0.png)\n\
    \n# Program a Invaders Create with Python\n\n## Full code listing\n\n```python\n\
    #!/usr/bin/env python2\nimport pygame, random\n\nBLACK = (0, 0, 0)\nBLUE = (0,\
    \ 0, 255)\nWHITE = (255, 255, 255)\nRED = (255, 0, 0)\nALIEN = (0, 30, 40)\nALIEN_SPACER\
    \ = (0, 200)\nBARRIER_ROW = 10\nBARRIER_COLUMN = 4\nBULLET_SIZE = (5, 10)\nMISSILE_SIZE\
    \ = (5, 5)\nBLOCK_SIZE = (10, 10)\nRES = (800, 600)\n\nclass Player(pygame.sprite.Sprite):\n\
    \    def __init__(self):\n        super().__init__(self)\n        self.size =\
    \ (50, 50)\n        self.rect = self.image.get_rect()\n        self.rect.x = (RES[0]\
    \ / 2) - (self.size[0] / 2)\n        self.rect.y = 520\n        self.travel =\
    \ 7\n        self.speed = 350\n        self.time = pygame.time.get_ticks()\n\n\
    \    def update(self):\n        self.rect.x += self.vector[0]\n        if self.rect.x\
    \ < 0:\n            self.rect.x = 0\n        elif self.rect.x > RES[0]:\n    \
    \        self.rect.x = RES[0]\n\nclass Alien(pygame.sprite.Sprite):\n    def __init__(self,\
    \ color, width, height):\n        pygame.sprite.Sprite.__init__(self)\n      \
    \  self.image = pygame.Surface((width, height))\n        self.image.fill(color)\n\
    \        self.rect = self.image.get_rect()\n        self.speed = 0\n        self.vector\
    \ = 0\n\n    def update(self):\n        self.rect.y += self.vector[1]\n```\n\n\
    Continued on page 91\n"
  mdcn: "\n\n# 使用 Python 创建\n\n# 使用 Python 制作一个 Pong 游戏克隆\n\n## 你需要...\n\n- 最新版本的\
    \ Raspbian 镜像：www.raspberry.org/downloads\n- Pillow: https://github.com/raspberry/python-Pillow\n\
    - SimpleGUItk: https://github.com/dholm/simpleguitk/\n\n## 使用 Python 制作一个 Pong\
    \ 游戏克隆\n\n我们通过一个名为 SimpleGUItk 的新库，为 Linux 时代更新了经典的 Pong 游戏。\n\n以下：《Tux 对战》是一个很棒的小\
    \ Pong 游戏，使用了深受喜爱的 Linux 吉吉祥 Tux 作为动作中心。\n\n树莓派是学习编程的绝佳方式。对于业程序员来说，游戏编程是一个非常有回报的领域，因为它提供更互动性的结果和更大的成就感。游戏编程还能教授即兴发挥和高级数学技能。我们将使用\
    \ Python 中优秀的 SimpleGUItk 模块，这是使用 Tkinter 创建图形界面的一种非常直接的方法。\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_85_0.png)\n\
    \n# Python 模块准备\n\n## 安装模块\n\n- 01 前往我们在“你需要”中列出的网站，从 GitHub 页面下载源代码压缩包。更新你的 Raspbian\
    \ 软件包并开始安装：\n\n- 06 `draw_line`、`draw_image` 和 `draw` 函数中绘制部分的重要部分。这些专门来自 SimpleGUI，允许你根据大小、颜色轻松地将对象放在屏幕上。不过，你需要将它们绑定到对象上——在画布中。这告诉软件我们想何时将这些项目放在屏幕上供用户查看。\n\
    \n```bash\n$ sudo apt-get install python-dev setuptools tk8.5-dev\n```\n\n- 02\
    \ 打开终端并使用 cmd 解压提取出的 Pillow 文件夹，然后使用 type：\n\n- $ $ sudo python setup.py install\n\
    完成后，确保使用 simpleGUItk 并使用相同的命令安装它：\n\n- 03 启动 IDE（在 IDLE 3 之后），打开一个新模块。使用代码编辑器编写你的游戏“Tux\
    \ for two!”。我们将仔细跟随操作，确保你清楚我们在做什么。如果你愿意，可以修改规则。\n\n# SimpleGUI 设置代码\n\n## 设置游戏\n\
    \n- 04 代码开始部分没有什么特别创新的：设置了 Tux 和挡板的初始位置，以及 Tux 的速度和方向。这些在得分得分和重置游戏场时会被用到。每次生成时，方向和速度都会设置为随机。\n\
    \n- 06 最后部分纯粹用于界面。代码将告诉在按下和释放按键时做什么，并为其提供框架。该框架将告诉你如何处理图形、按键函数等。最后，我们调用 `frame.start()`\
    \ 让它运行。\n\n![](img/f16311c48f0c39ab87b1836be5339b9e_85_1.png)\n\n# 使用 Python 制作一个\
    \ Pong 游戏克隆\n\n## 完整代码列表\n\n```python\nimport simpleguitk as simpleguikit\nimport\
    \ random\n\nw, h = 600, 400\ntux = 20\npad_w = 0\npad_h = 80\n\ndef tux_spawn(right):\n\
