    (ESC). The motors have three sets of coils (phased, clockwise and counter-clockwise)
    with PWM control signal from off-board to high-current output to the motors at
    speed requested. The power for the ESCs and everything on the system comes from
    Lithium Polymer battery with peak current - herein lies


