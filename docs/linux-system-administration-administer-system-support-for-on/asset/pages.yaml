  md: 'general. You set the umask by subtracting each number of the umask from 7 to
    arrive at permissions. If you were to start with the permission 777, setting the
    umask to 202 would leave the file at 575 (or rwxrwx-x, which is strange). By default,
    the umask is usually 022.


    # THE SUID BIT


    The SUID bit, which sets the user ID to zero, enables a program to be run as root,
    without giving the user root access. Certain programs, such as `passwd`, already
    have the SUID bit set.


