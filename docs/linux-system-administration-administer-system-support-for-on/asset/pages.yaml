  md: "When you define your host and networks, you can also decide what type of services\
    \ you want on your network connection. These services are run through the `/etc/services`\
    \ file. Most of the network services that run through here use only TCP; however,\
    \ UNIX is also marked in the file.\n\nSlackware Linux comes with all these services\
    \ enabled. You might want to close down certain services if they're not being\
    \ used. For example, you probably don't need port 1, port 7, port 11, or port\
    \ 15. Because a lot of the ports on your system are unnecessary, you can turn\
    \ them off by placing a # character to comment out that field. I would not delete\
    \ it; you may need that service later on. Listing 11-2 shows the `/etc/services`\
    \ file.\n\n# Listing 11-2: The `/etc/services` file\n\n```\n# Network services,\
    \ Internet style\n#\n# Note that it is presently the policy of IANA to assign\
