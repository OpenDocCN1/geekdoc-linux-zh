- pgno: 253
  md: '# System Shutdown


    Some truths in the world of computers never change; one is that there are good
    and bad ways to shut down your system. Because (presumably) you''re running a
    PC and most current PCs run some version of Microsoft Windows, the "three-finger
    salute" (Ctrl-Alt-Del) is a popular and familiar way to reboot. This salute is
    also recognized in Slackware Linux (but remember—use it for emergencies only;
    it can mess up mounted file systems).


    The Linux response to the three-finger salute is visible from the `/etc/inittab`
    file:


    ```

    ```

    # What to do at the "Three Finger Salute".

    ca:ctrlaltdel:/sbin/shutdown -t5 -rf now

    ```

    ```


    This command runs a shutdown in five seconds, and then forces a reboot without
    checking the file systems. The shutdown command syntax looks like this:


    ```

    ```

    # shutdown [-t seconds] [-krhnffFc] [time] [warning message]

    ```

    ```


    Of these options, I would not run `-n` or `-f`. The `-n` option would be to not
    have `init` run the `shutdown` command; instead, you would have to do it yourself.
    Unfortunately, `shutdown` is normally not a "do-it-yourself" project; to find
    out why, you might want to consult the explanations for the options that reside
    in the man page for `shutdown`. Table 7-4 shows shutdown options.


    **TABLE 7-4 SHUTDOWN OPTIONS**


    | Shutdown Option | What It Does |

    | :--- | :--- |

    | `-t seconds` | Indicates the amount of time before starting `/and so on/rc.d/rc.0`
    |

    | `-k` | Does not shutdown, only sends warning message |

    | `-r` | Reboots the system |

    | `-h` | Halts the system |

    | `-n` | Don''t have `init` run `shutdown` |

    | `-f` | Forces a shutdown without checking the file system |

    | `-F` | Forces a shutdown with checking the file system |

    | `-c` | Cancels the previously issued `shutdown` command |'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'The other option I would not run is -f because it doesn''t check and repair
    your file system. Also, before you run shutdown or reboot (which is shutdown -r),
    be sure to synchronize your disks by using the sync command:.


    ```

    # sync

    # sync

    # sync

    ```


    Always run `sync` at least twice; I always run it three times (not to say security
    people are paranoid or superstitious, but you never know).


    # ## Summary


    Now that you have your system working, you know how to properly boot up your system,
    the various run levels that Linux functions in, and how to shut it down properly.
    You can do some serious damage to the file system if you''re not careful during
    bootup and shutdown.


    You have a couple of ways to boot Linux. You can boot Linux directly from a floppy
    disk or from the hard drive using LILO or Loadlin. LILO is a boot manager which
    enables you to boot various operating systems in addition to Linux including FreeBSD,
    Windows95, WindowsNT, DOS, and OS/2. Loadlin enables you to boot Linux from a
    DOS partition. Don''t install both on the same computer.


    Linux has five different functional run levels. A run level is a mode the computer
    runs in to provide a certain type of functionality. Run level zero is shutdown
    and run level 6 is reboot. For system initialization, run level S needs to run
    before any of the others. Run level 1 is the single-user, or administrative mode.
    You can do file system maintenance in this mode. Run levels 2 through 5 are multi
    user modes, where other users besides root are able to logon to the system. For
    an X only run level, use run level 4.


    As you shut down the system, remember your cybernetic common sense: As with an
    individual workstation, don''t just turn off the computer; doing so fails to unmount
    the file systems cleanly, which invites future problems. You have several options
    for shutting down, including rebooting, halting, and allowing more time for users
    to log out.'
  merge: -1
  img_proc: true
