- pgno: 434
  md: '# Appendix A


    # Linux Web Sites


    WHEN YOU’VE INSTALLED Linux, read information from as many resources as possible.
    Because Linux was developed with the help of the user community, you’ll find the
    information in the following Web sites useful.


    +   - `http://www.linux.org`

    +     Linux Online. Web site with lots of links about everything related to Linux.


    +   - `http://sunsite.unc.edu/LDP`

    +     Linux Documentation Project. If there’s something written about Linux, it’s
    most likely here.


    +   - `http://www.linuxhq.com`

    +     Linux HQ. Lots of kernels and related information files.


    +   - `http://www.kernel.org`

    +     The Linux kernel archive. Any kernel you want, including version 1.0 is
    available here.


    +   - `http://www.freshmeat.net`

    +     Lots of new Linux application available here. Updated daily.


    +   - `http://www.xnet.com/~blatura/linuxapps.shtml`

    +     Linux Applications and Utilities page. A great resource for finding those
    applications you can’t do without.


    +   - `http://www.linux-center.org/en/`

    +     Linux Center. Designed a lot like the popular search engines. A variety
    of information available here.


    +   - `http://www.cs.utexas.edu/users/kharker/linux-laptop/`

    +     Linux on Laptops. Includes information on X, components, and specific hardware
    problems.


    +   - `http://wc.cc.jyu.fi/~jughtolv/linux-sticker/`

    +     Linux Penguin Sticker Movement. Advocacy to get Tux the Penguin as the official
    mascot of Linux.


    +   - `http://www.linuxmall.com/`

    +     The Linux Mall. You can buy your Linux products here.'
  merge: -1
  img_proc: true
