    Remember how you used a boot disk to install Slackware Linux? In that boot disk,
    you selected the appropriate disk that enabled you to boot your computer and recognize
    the appropriate CD-ROM drive for installation. That boot disk kernel does not
    have all the drivers to run your system completely, so rebuild the kernel.


    When you’ve typed the make mrproper command, reconfigure the kernel. This is where
    you tell the kernel what type of hardware and driver support you need so you can
    have a kernel with as much functionality that you need. You have three ways to
    run the reconfigure command:


    | Configuration Screen  | Command                |

    | :-------------------- | :--------------------- |

    | Text                  | make config            |

    | NCurses               | make menuconfig        |

    | X                     | make xconfig           |


    Whichever you choose, I like the make xconfig command for a straightforward route
    through the configuration process; the screenshots indicate clearly what needs
    configuring. xconfig is great because of the cleanliness of the GUI, and the help
    files are easily accessible. If you don’t currently have X working, use menu-
    config. You can go back and make changes with menuconfig or xconfig, but you can’t
    with config since it just prompts you the entire way down the reconfigure process.


    After you’ve run make xconfig, you’ll see some compilations of the X environment,
    and then you should see a pop-up window, as shown in Figure 6-2.'
  merge: -1
  img_proc: true
- pgno: 200
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_200_0.png)


    Figure 6-2: Main Xconfig screen


    > If you don''t have X currently working on your Linux system (for reasons such
    as the wrong drivers, configuration problems, or a nonstandard video card), use
    `make menuconfig`. It''s much nicer to use than `make config`. If you try to use
    `make xconfig` without running X, `make xconfig` won''t work.


    The Main Xconfig screen gives you 14 configuring options. I''ll walk through each
    one, demonstrating the reconfiguration process for my Slackware Linux kernel at
    home.


    +   1. Code maturity level options – Do you want to use developmental code? In
    other words, do you want to be a software tester for experimental drivers or do
    you want to use items you know work? This will be a built-in feature of the kernel;
    you cannot make this a module. I did not enable this because I don''t want to
    beta-test some newer drivers at this time. Figure 6-3 shows the code maturity
    level options window.'
  merge: -1
  img_proc: true
- pgno: 201
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_201_0.png)


    Figure 6-3: Code maturity level options


    If you aren''t sure what a particular option for the kernel is used for, click
    help. This is a really great feature if you aren''t really sure if you want to
    compile something into your kernel or not. You should get a detailed message such
    as the one shown in Figure 6-3.


    +   2. Loadable module support – Turn this on to use modules (loadable portions
    of the kernel). You don''t necessarily need to use modules; however, as the kernel
    development heads more in the direction of modules instead of built-in support,
    you may want to experiment with this option. If you have already activated loadable
    module support, you may also want to specify the autoloading of modules – after
    all, such convenience does seem to be why they exist – although you can certainly
    load them by hand if you wish. Because I use the Zip drive and it''s not always
    attached, I compiled loadable module support with autoload in my kernel. The loadable
    module is shown in Figure 6-4.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_201_1.png)


    Figure 6-4: Loadable module options


    +   3. General setup – General setup is the basic hardware setup for the system
    you installed Slackware on. Unless you''re working on a 486 or earlier hardware,
    you don''t want to enable math emulation. Turn on PCI Bios, networking support,
    and kernel support (at least for the ELF binaries). You''ll also want to compile
    your kernel as ELF. I included both a.out and ELF binary support for my kernel,
    enabled networking and IPC support. The other options include the processor type,
    memory options, and other general things you may or may not want running on your
    system. I left alone. The General Setup is shown in Figure 6-5.'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_202_0.png)


    Figure 6-5: General setup options


    +   4.  Floppy, IDE, and other block devices — This set of options helps you set
    up any type of disk support. It includes IDE/ATAPI, shown enabled here because
    that’s what my motherboard supports. This also includes old XT hard drives, SCSI
    emulation, and other hard drive support including the older IDE drives. Because
