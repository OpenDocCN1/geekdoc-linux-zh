- pgno: 395
  md: 'Next you''ll need to enter your modem device. Because mine is on serial port
    1, my modem device is `/dev/cua0`. You also want to create a symbolic link from
    your actual modem, `/dev/cua[0-3]` to `/dev/modem`. The `seyon` program requires
    this, and it makes it easier for you to find your actual modem. Your cua, which
    is the modem serial device number, is one less than the COM port number. This
    number is determined the same way the serial mouse is. (See Figure 11-12.)


    ![](img/8ad518fddafc7f5e73715a2604b61d50_395_0.png)


    Next, pick the baud rate (actually the kilobits-per-second speed) of your modem.
    The newer modems today are 56K, although you may be using something a bit slower
    (like 33.6, 28.8, or 14.4). (See Figure 11-13.)


    ![](img/8ad518fddafc7f5e73715a2604b61d50_395_1.png)


    You''ll need to know if your ISP has callback. Callback is a so-called security
    feature where the modem dials back your number to verify you''re who you say you
    are. Most ISPs haven''t enabled this. (See Figure 11-14.)'
  merge: -1
  img_proc: true
- pgno: 396
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_396_0.png)


    Figure 11-14: Verifying callback information


    The next question is authentication. If your ISP uses authentication, they probably
    use PAP. Some use CHAP, which encrypts the password you send them. PAP authenticates
    your password connection through cleartext, meaning your password is not encrypted.
    CHAP does the same thing that PAP does; additionally, it encrypts your password.
    (See Figure 11-15.)

    You can run PPP as follows:


    ```

    stripea:~# ppp-go

    ```


    You don''t have to stay in the root window to run since PPP runs from a daemon
    called pppd. The PPP daemon now controls all your network connections through
    the ISP and allows you to have Internet access. This is transparent to you, as
    you are using the ISP''s resources (such as their nameserver and routers) to access
    the Internet. Just go to another window, run Netscape, telnet or ftp to other
    sites, and so on.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_396_1.png)


    Figure 11-15: PPP authentication'
