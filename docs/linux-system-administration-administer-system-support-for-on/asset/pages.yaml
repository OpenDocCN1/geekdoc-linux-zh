    # # Backing Up


    Backing up your system is still the most-overlooked security method. If you have
    any files too important to erase, don''t leave only one copy of them in existence!
    Create a schedule for backing them up, and stick to it.


    A backup schedule makes this vital procedure easier to track, and it offers a
    way to coordinate. the two types of backups (incremental and full). An *incremental
    backup* is one that backs up only the files that have changed since the last full
    backup. A *full backup* backs up everything.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_80_0.png)


    When you back up the first time, do a full backup. This way, if your system crashes,
    you can recover everything. Good backup hardware may include a supported tape
    drive, an Iomega JAZ or ZIP drive, an external hard drive, or a writable CD drive.
    The method you use is partly dictated by practicality and partly a personal preference.
    I prefer tape backup: the process is straightforward, and many backup programs
    are written with tape drives in mind. If you can use a basic comparison, Table
    2-1 lists how much storage you can get from various media.


    **TABLE 2-1 MEDIA STORAGE AMOUNTS**


    | Medium | Storage |

    | :--- | :--- |

    | Tape | Couple hundred megabytes to several gigabytes |

    | Iomega JAZ* | 1 or 2GB |

    | Iomega ZIP | 100MB |

    | External hard drive* | Couple hundred megabytes to several gigabytes |

    | Writable CD-ROM | Approximately 650MB |


    *\*SCSI device needed*'
