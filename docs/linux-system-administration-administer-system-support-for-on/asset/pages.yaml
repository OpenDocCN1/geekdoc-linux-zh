    # ## Backing Up with Tar


    Among the best backup tools for Linux systems, you’d still find tar high on the
    list. Though it’s been around for a long time, tar is still reliable and it gets
    the job done. Many programmers still use it to bundle applications, and IT pros
    still use it to do backups. It’s easy to use, its syntax is fairly simple, and
    it’s portable across most UNIX platforms.


    The tar command listing shows how versatile it is. The options are shown in Listing
    10-1.


    **Listing 10-1: Using tar for backup**


    ```

    ```text

    # tar --help


    GNU ''tar'' saves many files together into a single tape or disk archive, and

    can restore individual files from the archive.


    Usage: tar [OPTION]... [FILE]...

    ```


    ```


    This shows the usage of tar. The tar command’s main options define the archive
    by creating it, listing the contents, showing the difference between the archive
    and the actual file system, and extracting the files. You can also add or update
    files to the archive.


    If you are not using a magnetic tape, you can delete files from the archive —
    but be careful.'
  merge: -1
  img_proc: true
- pgno: 348
  md: 'If a long option shows an argument as mandatory, and then it is mandatory for
    the equivalent short option also. The same holds true for optional arguments.


    +   Main operation mode:

    +   - -t, --list list the contents of an archive

    +   - -x, --extract, --get extract files from an archive

    +   - -c, --create create a new archive

    +   - -d, --diff, --compare find differences between archive and file system

    +   - -r, --append append files to the end of an archive

    +   - -u, --update only append files newer than copy in archive

    +   - -A, --concatenate append tar files to an archive

    +   - --concatenate same as -A

    +   - --delete delete from the archive (not on mag tapes!)


    You can also modify the operations with certain options as well. You can verify
    the files (this adds time to extracting or creating archives), get rid of the
    files after you added them to the tarball, do a safety check by not overwriting
    older versions of the files during an extract, or handle incremental backups.


    These operation modifiers are used in addition to the main operators above.


    +   Operation modifiers:

    +   - -W, --verify attempt to verify the archive after writing it

    +   - --remove-files remove files after adding them to the archive

    +   - -k, --keep-old-files don''t overwrite existing files when extracting

    +   - -U, --unlink-first remove each file prior to extracting over it

    +   - --recursive-unlink empty hierarchies prior to extracting directory

    +   - -S, --sparse handle sparse files efficiently

    +   - -0, --to-stdout extract files to standard output

    +   - -G, --incremental handle old GNU-format incremental backup

    +   - -g, --listed-incremental handle new GNU-format incremental backup

    +   - --ignore-failed-read don''t exit with nonzero on unreadable files


    In addition to changing the way the operations are handled, you can change the
    file attributes as well. The file attributes include owner, group, permissions,
    access time, modification time, UID, GID, and the order of the files in the archive.
    Depending on what you''re extracting or creating, you may need to use some options
    to keep the functionality of some programs or files (like device files).


    +   Handling of file attributes:

    +   - --owner=NAME force NAME as owner for added files

    +   - --group=NAME force NAME as group for added files

    +   - --mode=CHANGES force (symbolic) mode CHANGES for added files

    +   - --atime-preserve don''t change access times on dumped files

    +   - -m, --modification-time don''t extract file modified time'
  merge: -1
  img_proc: true
- pgno: 349
  md: '| Option | Description |

    |---|---|

    | - same-owner | try extracting files with the same ownership |

    | - numeric-owner | always use numbers for user/group names |

    | -p, - same-permissions | extract all protection information |

    | - preserve-permissions | same as -p |

    | - s, - same-order | sort names to extract to match archive |

    | - preserve-order | same as -s |

    | - preserve | same as both -p and -s |


    For the device selection, you can define a specific device for the archive, run
    remote commands (be careful with this—don’t use any of the r commands), specify
    a drive or multiple volume archive, and define volume numbers.


    If you are using a tape drive, you can also define the tape length with the -L
    option.


    +   Device selection and switching:

    +   * -f, -file=ARCHIVE - use archive file or device ARCHIVE

    +   * -force-local - archive file is local even if has a colon

    +   * -rsh-command=COMMAND - use remote COMMAND instead of rsh

    +   * [0-7][lmh] - specify drive and density

    +   * -M, -multi-volume - create/list/extract multi-volume archive

    +   * -L, -tape-length=NUM - change tape after writing NUM x 1024 bytes

    +   * -F, -info-script=FILE - run script at end of each tape (implies -M)

    +   * -new-volume-script=FILE - same as -F FILE

    +   * -volno-file=FILE - use/update the volume number in FILE


    With devices, you can also define the size of the blocks. The blocking information
    is listed following. This includes defining the size of the blocks, ignoring End
    of File (EOF) blocks, and reblocking for BSD pipes.


    +   Device blocking:

    +   * -b, -blocking-factor=BLOCKS - BLOCKS x 512 bytes per record

    +   * -record-size=SIZE - SIZE bytes per record, multiple of 512

    +   * -l, -ignore-zeros - ignore zeroed blocks in archive (means EOF)

    +   * -B, -read-full-records - reblock as we read (for 4.2BSD pipes)


    You can also the set up the archive format. You can give it a volume name or make
