    # The ext2fs commands


    The Linux kernel for some time now has been using **ext2fs** for its preferred
    file system. Earlier file system types included **xiafs** and **extfs** (Extended
    File system). **The ext2fs** enables the most flexibility and is the only file
    system in which the kernel will run and compile. Let''s go over the specific commands
    of **ext2fs**.


    Suppose you''ve got a brand new hard drive you want to format for Linux. If you
    want to create a file system on it, the first step is to partition your disk.
    Then you can use mke2fs as follows:


    ```

    # mke2fs /dev/hdb1

    ```


    If you want to check for bad blocks first, use the -c option.


    ```

    # mke2fs -c /dev/hdb1

    ```


    At this point, you can also define the byte size of the inodes (as in the setup
    program).


    ```

    # mke2fs -i 1024 /dev/hdb2

    ```


    > **NOTE** Although the default inode size is 4096 bytes, you must define it as
    no smaller than 1KB (1024 bytes).


    Fragments are not currently supported; don''t use the -f option.'
  merge: -1
  img_proc: true
