- pgno: 410
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_410_0.png)


    # Setting Up the Apache Web Server


    Various Web servers are available for Linux- Netscape, NCSA, and Apache. Conveniently
    enough, Apache comes on the Slackware CD-ROM included with this book, and is available
    for downloading from http://www.apache.org.


    To install the Slackware package, you can go to the Slackware disk sets and find
    the *apache.tgz* package in the set labeled n1. If you''ve installed Apache during
    the Slackware installation process, all you have to do is start the *httpd* daemon.


    > You can have the daemon started by the *inetd* daemon to enhance manageability.


    To start the daemon from the command line, type `# httpd &` at the prompt.


    When you have the daemon up and running, you should be able to see the startup
    screen. To see the startup screen, start your Web browser and open the URL *http://localhost/*
    . It should look like Figure 12-6.'
