    # ## Defining Groups


    Often users have some commonality among them, therefore, you can section them
    off into different groups. Some administrative programs belong to groups. To see
    what groups you belong to, type groups.


    ```

    ```bash

    # groups

    root bin daemon sys adm disk wheel floppy

    ```

    ```


    If you run this command from a user account, you should get users.


    ```

    ```bash

    $ groups

    users

    ```

    ```


    Grouping users according to functionality makes a lot of sense and can make things
    run smoother. So, for instance, if you worked in a company with an information
    systems staff and a marketing staff, you can define groups infosys and market
    in the /etc/group file.


    The /etc/group file syntax is similar to the /etc/passwd in some instances, but
    they don''t operate the same and have two entirely different purposes. The syntax
    for /etc/group is


    group:password:GroupID:list of users'
  merge: -1
  img_proc: true
- pgno: 279
  md: 'So, your /etc/group file with the infosys and market groups may look like this:


    ```

    root::0:root

    bin::1:root,bin,daemon

    daemon::2:root,bin,daemon

    sys::3:root,bin,adm

    adm::4:root,adm,daemon

    tty:::5:

    disk::6:root,adm

    lp::7:lp

    mem::8:

    kmem::9:

    wheel::10:root

    floppy::11:root

    mail::12:mail

    news::13:news

    uucp::14:uucp

    man::15:man

    infosys::300:judy bob russ dbadmin

    market::200:wendy jane bob

    users::100:mike dave kim judy bob russ dbadmin

    nogroup::-2:

    ```


    In this case, the information-systems folks can access anything in the user groups.
    Because bob is the marketing-information systems specialist, he has access to
    both information systems and marketing. The users mike, dave, and kim just belong
    to the user group.


    If root needs to change someone''s group access, root uses the chgrp command.
    Also, if root wants to change all the files in a directory, he or she just needs
    to use the -R option to make it recursive.


    ```

