- pgno: 132
  md: '# Peripherals


    In addition to drives, you might want to use a variety of other hardware in your
    system: sound cards, mice, printers, modems, X, and much more. Though all these
    peripherals are very useful, keep in mind that some are easier to configure than
    others.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_132_0.png)


    Desktop computers tend to have more industry-standard hardware than do laptops.
    A rule of thumb applies here: The more standard the hardware, the easier the configuration
    process. My desktop machine, for example, took all of an hour to configure perfectly
    (kernel, mouse, modem, and X; it takes much longer to get working on a laptop
    since they have nonstandard drivers and hardware.


    # Mice


    A mouse can be the easiest—or the most difficult—device to get working. If you
    have a serial mouse, be sure you know which communications port actually connects
    to it. The primary serial port is the larger port is COM1 (cu a0 or ttyS0) and
    the smaller port is COM2 (cu a1 or ttyS1).


    ![](img/8ad518fddafc7f5e73715a2604b61d50_132_1.png)


    If you have a bus mouse, you''ll be in for a bit of a headache, though the Mouse
    HOWTO on the CD-ROM should help you deal with it. Even as kernels get progressively
    better, you''ll see such familiar issues still come up.


    To configure your mouse, become root and run setup. When you do this, cancel everything
    until you reach the screen that''s for configuring your mouse. When you get there,
    you will have to select your mouse.


    For serial mice, you have the choices of 1, 6, and 7. Usually your best bet is
    to go with the Microsoft-compatible serial mouse, unless you know otherwise. The
    reason to use a Microsoft-compatible mouse is because it is pretty much the standard
    today. For trackballs, choice 2 (the PS/2 style mouse) seems to work just fine.
    For bus mice, you might want to start with the Microsoft Bus Mouse and work your
    way through the choices. Microsoft mice seem to be the most-compatible. For my
    simple Logitech mouse, the X setup recognizes the mouse as a Microsoft-com-patible.'
  merge: -1
  img_proc: true
- pgno: 133
  md: '# Sound Cards


    The only sound card I’ve gotten to work is Soundblaster. From the word on the
    wires, it’s the only one to use. To use your sound card, rebuild your kernel.
    When you enable sound card support, choose your sound card. To configure your
    sound card, be sure to enable sound card support when recompiling the kernel.
    Also, be sure to select the correct sound card; otherwise your kernel will not
    compile.

    Other supported sound cards include Gravis, Logitech, Media Vision, Mozart, Orchid,
    and Pro Audio.


    > Although I have used other sound cards without much trouble, I have had the
    least hassle with SoundBlaster cards. It’s another example of having the most
    straightforward experience if you use industry-standard components.


    To test your sound card as painlessly as possible, place a music CD in your CD-ROM
    and run workbone.


    > For more information on configuring sound cards, consult the Sound-HOWTO on
    your Slackware CD-ROM.


    # Printers


    In this section, I’m going to cover the basics of setting up a printer, not how
    to print. Use the lpr commands to help you with printing, and check out the Printing-Usage-HOWTO
    on your CD-ROM.

    When you include printer support in your kernel and recompile it, you should be
    all set to go. It’s sometimes tricky to figure out which printer port your printer
    is on (/dev/lpl or /dev/lp0); the location depends on the hardware.


    > If you’re running a Linux system, don’t buy peripherals (such as printers or
    modems) designated as "Windows Only." Such devices don’t work with Linux because
    they depend on Windows to run them; in effect, they’re brain-dead (or dumb) with
    anything but Windows. Unfortunately, this trend seems to be building in the hardware
    industry. Keep checking the newsletters and mailing lists for recent updates —
    and always check the system requirements before you buy.'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'However, keep in mind that your PLIP devices or parallel-port Zip drives won''t
    be available when you''re using a printer. Too many opportunities for device conflicts
    exist; it couldn''t hurt to pay extra attention to what you''re doing.


    # # Modems and Network Cards


    Communications ports are located at `/dev/cua*`. Modems use these ports, and so
    do serial mice. Once your modem is configured on the appropriate port, you''re
    set— a convenient feature. To use your modem, run one of the good communications
    programs available out there, including Point-to-Point Protocol (PPP).


    ![](img/8ad518fddafc7f5e73715a2604b61d50_134_0.png)


    > > Networking is covered in Chapter 11.


    # ## Scanners


    A scanner would be a nice addition to my Slackware Linux system — and maybe to
    yours as well. Scanners are supported with an application called SANE (Scanner
    Access Now Easy) available at `http://tsx-11.mit.edu/pub/linux/packages/sane/`.
    This scanner interface works with Epson, HP, Genius, Fujitsu, A4, Adara, Logitech,
    and many other supported scanners.


    # ## PCMCIA Cards


    For the most part, PCMCIA cards work just fine after you recompile the kernel
    to support them. After that, they should be autodetected. Your modem or Ethernet
    card may or may not work, depending on the version of your kernel and the latest
    version of card services.


    Many 3Com Ethernet cards are supported, and most of the modems should be supported.
    I have used both 3Com Ethernet and modem PCMCIA cards, and I''ve been able to
    get both to work—but I did need to use the most up-to-date drivers. (For that
    matter, be sure to use the most up-to-date PCMCIA software. If you bought the
    book, you''ve got it—it''s on the CD-ROM.)


    ![](img/8ad518fddafc7f5e73715a2604b61d50_134_1.png)


    > > Card services support hot swapping, which enables you to take out and put
    in cards while the system is up and running.'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# # Video Cards and Monitors


    Here’s another example of how a Linux system rewards you if you go with standard
    hardware: If you want to run X, first make sure it supports your video card (If
    bought a S3 Trio64V+ card, knowing that X would support it). For those of you
    with laptops, good luck – and may the video-card angels assist you in getting
    the hardware to work.


    Almost any brand of monitor should do – but be sure you know the frequency numbers.
    Find the manual that came with your monitor or contact the manufacturer.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_135_0.png)


    You can find a list of Linux-supported video cards in the XFree86-HOWTO file on
    the CD-ROM.


    # # Driver Locations


    The biggest problem with finding the hardware you want to install is finding the
    drivers for it, too. Table 4-3 lists driver Web sites and their URLs.


    # ## A Word on Video Cards


    I found that when I was first configuring X many moons ago, it was nearly impossible
    to do so without help from USENET. I spent a good portion of my time working with
    someone over e-mail to get my Dell 486 and 15-inch Sony monitor working – if that’s
    the word for it – at 320x200 resolution. To imagine what that looks like, pretend
    you have a high-powered microscope that your monitor screen will fit under, and
    you’ve adjusted the magnification to about 100 for a close-up view of the windows
    and how nicely the details of the graphics are put together.


    After some time, we managed to get a working configuration file so my desktop
    displayed 800x600 resolution. The moral: If you’re using a nonstandard video card,
    be careful, get help, and be prepared to spend some time getting it right.


    Another handy industry note: Diamond video cards were not supported under Linux
    for a long time – not until Diamond released the information necessary to write
    the drivers. If at all possible, make sure your video card is supported *before*
    you start playing with X or any other graphics-intensive programs.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '| WEB SITE | URL |

    | --- | --- |

    | The Linux Kernel Archives | http://www.kernel.org |

    | Linux Headquarters | http://www.linuxhq.com |

    | Linux Center | http://www.linuxcenter.org/en |


    If you know of a specific hardware driver that your system must have, you may
    need to contact the vendor, try other Web sites, or query the newsgroups for more
    information.


    # # Summary


    Disk drives are still the main storage medium, whether SCSI or IDE. (Some old
    XT drives are still in use, but on the way out.) The disk drive files are found
    in the /dev directory.


    Other unique files reside in the /dev directory. These are character, or "raw"
    files, and block, or "cooked" files. These files are used for defined hardware,
    including hard drives, serial ports, terminals, modems, and mice. Additionally,
    another special file known as a named pipe, which enables you to pipe output between
    unrelated processes.


    When you have defined your devices, you''ll want to be able to access them. For
    media storage, mount the device to a file system. These include floppy drives,
    CD-ROM drives, Zip and Jaz drives, tape drives, and CD-writable devices.


    Besides storage media, peripherals – mice, sound cards, printers, modems, network
    cards, scanners, and PCMCIA cards – are another indispensable range of devices
    to add to your system. When you''ve chosen what your system needs, be sure to
    have the correct drivers available (especially for video cards and monitors).'
  merge: -1
  img_proc: true
