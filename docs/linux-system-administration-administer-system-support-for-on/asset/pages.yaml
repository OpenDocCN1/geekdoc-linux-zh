    Now that you know what the file system structure is, you''ll need to understand
    how to create a disk arrangement you can live with, how to add and remove disks,
    and creating disk quotas. You''ll also need to understand how to partition your
    disk for Linux, Linux swap, and other operating-system partitions.


    # # Disk Arrangement Strategies


    When you''re trying to decide how you''re going to partition your disks, make
    sure you can live with the amount of allocated space for a reasonable period of
    time. For example, you don''t want to only give yourself 200 megabytes for the
    `/usr` directory. It''s common for this directory to grow because of `/usr/local/bin`
    and `/usr/bin`.


    Also, this depends on the functionality of the computer. Computers used for fire-walls
    and routers will not need much extra disk space; their functionality is not dependent
    on it. However, mail and Web servers will need to have a growth plan. Web pages
    develop and grow quickly over a short period of time, and mail servers can become
    inundated with messages – both inbound and outbound.


    If you plan on having user accounts, you may want to implement disk quotas. This
    enables you to limit the amount of disk space per user, either for accounting
    or for spatial reasons. Disk quotas are discussed further in the chapter.'
