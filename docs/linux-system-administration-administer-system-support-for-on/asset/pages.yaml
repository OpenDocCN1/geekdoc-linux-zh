- pgno: 87
  md: 'If you''re connecting to anyone''s network, be sure your host is extremely
    secure. When you connect to a corporate network, you''ll have to follow the rules
    of the company and their Acceptable Use Policy. That means that any games you
    have on your system you may want to remove. Also note that other systems around
    you may not be secure; therefore, they should not be trusted.


    When you connect to an ISP, whether via PPP or directly, remember that you''re
    trusting their network security on their routers, hosts, and other network devices.
    This means taking note of who else is out there. You''ll also be exposed to the
    Internet. Keep in mind that even as cool as Internet access is, it does have its
    share of problems. People will play around and try to get into your system because
    it''s cool, not necessarily because of the information it has. The beauty of Linux
    is also its risk – its source code availability. Linux is the most robust Unix
    implementation due to the contributions of so many different people and the desire
    for a powerful, freely available operating system. Because the core code of all
    Linux operation is available to anyone, programmers or hackers can easily develop
    ways to exploit networking or system software. Although critics of Linux may say
    that''s reason enough not to put it on the Web, they forget that for every system
    exploitation there''s a fix, and the open source of Linux contributes just as
    much to the security-conscious as it does to those who would exploit it. Keeping
    yourself up to date on security advisories will help you plug holes before they
    fall into the hands of the clever teenagers who would break into your system.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_87_0.png)


    Chapter 11 covers networking basics in depth.


    # ## Summary


    A system administrator needs to keep the system running with minimal downtime.
    To do so, take these fundamental steps: keep good records and logs, listen to
    users, keep the system secure, and maintain your hardware.


    Establish system security to prevent break-ins. You can plug quite a few holes
    by turning off necessary services and running data-integrity programs like Tripwire.
    It''s also imperative to back up regularly and to have a cleanup plan in case
    your system is attacked. Make sure you understand your backup procedures and exactly
    how to restore your data. Also, keep an open line of communication with your users,
    maintaining (and reviewing as necessary) accessibility to the files.


    If you''re working in a growing computing environment, have an understanding and
    good planning for application scaling, setting up application servers, and'
