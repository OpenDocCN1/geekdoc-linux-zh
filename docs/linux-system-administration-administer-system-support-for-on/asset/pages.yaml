  md: 'DNS address is `maple.circa.ufl.edu`, for example, the client looks in the
    table for `circa.ufl.edu`. It doesn’t find anything, so it goes up to `ufl.edu`
    – still nothing. Next, it goes up to `.edu` and looks there. Again nothing. Now
    it goes to the root domain, `.`, and finds `.com`. Now that it’s found `.com`,
    it looks for `hp.com`. Found it. Now down to `corp.hp.com`. Because the client
    has done all that work, we know that `corp.hp.com` exists – so we don’t have to
    type in the IP address.


    These domains can have other domains in them or go directly to a host (`www.ins.com`
    is a host where `corp.sun.com` is a domain). It’s all a matter of how the domain
    is structured. For `tigerlair.com`, it’s fairly easy. There are two hosts that
    are recognized: `www.tigerlair.com` and `ftp.tigerlair.com`. There are no subdomains
    like `corp.tigerlair.com` (for functionality division) or `florida.tigerlair.com`
    (for regional division).


    # LINUX DNS CLIENT


    To make your Linux host a DNS client, all you have to do is define a nameserver
    and create an `/etc/resolv.conf` file. One may look like this:


    ```

    ```text

    domain best.com

    nameserver 152.52.2.2

    ```

    ```


    This defines your domain and the IP address of the nameserver. Instead of looking
    in the `/etc/hosts` file, Linux will query the nameserver for the information.
    Your DNS client configurations are done through `/sbin/netconfig`. If you want
    to test a nameserver query, run `nslookup`. If you are using DNS, you can keep
    a minimal sized `/etc/hosts` file, with one line containing the localhost address.


    ```

    ```text

    Server: localhost

    Address: 127.0.0.1


    Non-authoritative answer:

    Name: www9.yahoo.com

    Address: 204.71.200.74

    Aliases: www.yahoo.com

    ```

    ```


    # LINUX NAMESERVER


    You can set up your Linux server as a nameserver as well. For example, I have
    the domain `tigerlair.com`. If I wanted to set up subdomains like `tchedn` and
    `kitchen` or hosts like `tiger` or `sharekahn`, I would have to set up a host
    to be the authority on what names are actually in the `tigerlair.com` domain.
    In other words, the nameserver provides official information about the hosts and
    subdomains in `tigerlair.com`.


    To set up Linux as a nameserver, you would have to install the package `bind`,
    which is the UNIX implementation of DNS. The current version of BIND is 8; be'
