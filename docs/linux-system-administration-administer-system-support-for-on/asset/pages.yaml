    # How Do You Make Shadow Files Useless?


    The short answer is: You’d better know. I found this out when I asked a colleague
    of mine to help me work on UNIX security. We went into the classroom and started
    looking at the file permissions. The first thing we checked was the `/etc/password`
    file, and we saw all the x’s in the password field. This indicated that the password
    file was shadowed.


    Remembering that trusted UNIX systems also use shadowed passwords, albeit more
    complicated than the `/etc/shadow` file, we decided to look for the `/etc/shadow`
    file next. When we found it, we were not only able to view it, but also to edit
    it (the file permissions were set to 666).


    Not only was it easy to compromise root, but it also made me realize the value
    of good host security. (Good thing this was a classroom environment. It could
    have been a disaster on a production server.)


    The moral: If you do use password shadowing, *don’t change the permissions on
    the shadow file*.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# Disabling or Deleting Unused Accounts


    If you decide you don''t want a particular user on your system anymore (say, another
    programmer writes better code or someone''s changed office-mates), you should
    disable or delete the account. There are various ways to disable an account, but
    if you delete, you should probably not do it manually; all your files must be
    properly cleared first.


    # DISABLING AN ACCOUNT


    To lock an account, use the -l option with the passwd command.


    ```

    ```

    bash# passwd -l vertech

    Password changed.

    ```

    ```


    You can see the account information with the -S option. Note the L for locked.


    ```

    ```

    bash# passwd -S vertech

    veritech L 07/19/98 0 99999 7 -1

    ```

    ```


    Note that nothing is changed in /etc/passwd, but there is a noticeable difference
    in the password field of /etc/shadow.


    ```

    ```

    bash# cat /etc/shadow

    halt:*:10426:0:99999:7:::

    operator:*:10426:0:99999:7:::

    root:zDv78WL5BVg2:10426:0:99999:7:::

    shutdown:*:10426:0:99999:7:::

    sync:*:10426:0:99999:7:::

    bin:*:10426:0:99999:7:::

    ftp:*:10426:0:99999:7:::

    daemon:*:10426:0:99999:7:::

    ad m:*:10426:0:99999:7:::

    lp:*:10426:0:99999:7:::

    mail:*:10426:0:99999:7:::

    postmaster:*:10426:0:99999:7:::

    news:*:10426:0:99999:7:::

    uucp:*:10426:0:99999:7:::

    man:*:10426:0:99999:7:::

    games:*:10426:0:99999:7:::

    nobody:*:10426:0:99999:7:::

    boB:TH54ciu/THDu.:10426:0:99999:7:::

    veritech:!jHg1DqoCj1pIy:10426:0:99999:7:::

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'The ! character is not part of the character set that the encrypted password
    file uses, thus rendering the account disabled. To remove the ! and reenable the
    account, use the -u option. You can see that the account is restored.


    ```

    bash$ passwd -u verletech

    Password changed.

    ```


    Another way to disable an account is by putting a \* in the password field in
    /etc/passwd or /etc/shadow (depending on whether you''re using shadowed passwords).
    This is what the system defaults to for creating accounts that aren''t logged
    in to but used for administrative purposes. So, for retiring accounts, this is
    a good way to go. The following code shows this method in action.


    ```

    bash$ cat /etc/shadow

    halt::\*:10426:0:99999:7:::

    operator::\*:10426:0:99999:7:::

    root:$1f829W79sL5BVug2:10426:0:99999:7:::

    shutdown::\*:10426:0:99999:7:::

    sync::\*:10426:0:99999:7:::

    bin::\*:10426:0:99999:7:::

    ftp::\*:10426:0:99999:7:::

    daemon::\*:10426:0:99999:7:::

    adm::\*:10426:0:99999:7:::

    lp::\*:10426:0:99999:7:::

    mail::\*:10426:0:99999:7:::

    postmaster::\*:10426:0:99999:7:::

    news::\*:10426:0:99999:7:::

    uucp::\*:10426:0:99999:7:::

    man::\*:10426:0:99999:7:::

    games::\*:10426:0:99999:7:::

    nobody::\*:10426:0:99999:7:::

    verletch:jJHgIJoQcJpIy:10426:0:99999:7:::

    ```


    > Don''t use either of these methods to disable the root account! They can create
    major problems for the future. Imagine the wonder and joy that could ensue if
    root can''t log in — for example, not being able to shut down properly, mount
    drives, or edit. If you change root''s shell to an unusable shell such as /bin/sch
    (a shell that doesn''t exist, except as a typo that should read /bin/csh), you
    won''t even be able to get into the root account from FTP.'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# REMOVING AN ACCOUNT


    When you’ve decided you no longer need a user account, the `userdel` command can
    remove the account for you – provided you use it carefully and correctly. This
    command goes through the /etc/passwd, /etc/shadow, and /etc/group files and removes
    the user information. It doesn’t work on an account that doesn’t exist (no surprise)
    – and it doesn’t work if the account does exist but has a process of any kind
    running (it’s easy to forget that being logged in is a process). The command looks
    like this:


    ```

    # userdel username

    ```


    If you want to remove the directories and files, use the -r option. I would suggest
    you back up the user’s home directory before you delete it.


    You can also manually remove the entry yourself from the files, though `userdel`
    is more efficient.


    # Users and Groups


    When you’ve set up your user accounts, you can specify certain characteristics
    or group them in a set. For example, if you’re running a Slackware system at home,
    you can group people by family or friends. You can have some information that
    you may not want your family to see but you might want your friends to see. In
    the corporate world, you can have groups like *execut*, *infosys*, *market*, and
    *accting*.


    # Setting Your Users’ Environment


    When you’re defining your system’s users, you can also define what type of environment
    each one can use. You can define their shells, disk space, and personal information.


    # SHELLS


    Your shell is your user environment. Back in the old days of UNIX, the shells
    available were the Bourne Shell (the first shell), C shell (from Berkeley), and
    the Korn Shell. Today, we have quite a few shells available including the Bourne-Again
    Shell (bash), Enhanced C shell (tcsh), and the Z Shell (zsh, an enhanced version
    of the Korn Shell).


    The current shells available with Slackware include these:


    +   /bin/ash

    +   /bin/bash

    +   /bin/csh

    +   /bin/sh'
  merge: -1
  img_proc: true
- pgno: 276
  md: '```

    /bin/tcsh

    /bin/zsh

    ```


    You can also add /bin/pdksh, which is a public distribution of the Korn Shell.
    If you want users to be able to change their own shell, add the shells you want
    them to change to in the file /etc/shells. Slackware does not have to have an
    /etc/shells file to use chsh. If you want, you can create it like this:


    ```

    bash# more /etc/shells

    /bin/bash

    /bin/csh

    /bin/tcsh

    /bin/zsh

    ```


    If a user is going to change his or her own shell, the command of choice is csh,
    as follows:


    ```

    $ chsh

    Password:

    Changing the login shell for stripes

    Enter the new value, or press return for the default


    Login Shell [/bin/tcsh]:/bin/bash

    ```


    # QUOTA UTILITIES


    Another way to affect a user''s environment is to limit the user''s disk space
    with the quota utility, which limits an individual user''s disk space so that
    one account won''t eat all your hard-drive space. The command quota displays information
    about the user''s disk space; with the `-v` option, you can see what space they
    don''t have access to. An example follows:


    ```

    gator:/home/hobbes- quota

    Disk quotas for user hobbes (uid 1312):

    File system blocks quota limit grace files quota limit grace

    /home 8746 20480 25600 252 0 0

    ```


    ```

    gator:/home/hobbes- quota -v

    Disk quotas for user hobbes (uid 1312):

    File system blocks quota limit grace files quota limit grace

    /var/tmp - 0 102400 107520 0 0 0

    /home 8746 20480 25600 252 0 0

    ```'
