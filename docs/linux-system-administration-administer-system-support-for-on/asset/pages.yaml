- pgno: 30
  md: '# Chapter 1


    ## Slackware Linux Installation


    # IN THIS CHAPTER


    +   - Installing Slackware

    +   - Understanding some basic configurations

    +   - Upgrading Slackware

    +   - Exploring maintenance issues

    +   - Monitoring performance

    +   - Securing your system


    # ### Installing Slackware


    Your PC is all fired up and you''re ready to install Slackware. You''ve done the
    hardest part: You purchased or borrowed a PC. The first step after that is to
    check your system requirements.


    Basic hardware requirements for installing Linux include a monitor, a keyboard,
    at least eight megabytes of RAM, at least 250 megabytes of hard drive space, 3.5-inch
    or 1.25-inch floppy drive, and a compatible CD-ROM drive. You can get away with
    a 386 processor; however, I recommend at least a 486 because it does improve performance.


    You’ll also need at least four blank diskettes for the boot disk and root disk
    used for installing Slackware, a boot disk (which may or may not be necessary),
    and a rescue disk for emergencies (such as the file system going south).


    You’ll also need patience. If you''re working with a standard desktop or tower
    environment, you shouldn''t have too many problems — but be aware of what can
    go wrong, and exercise your patience on such surprises as kernel panic and boot
    problems.


    In addition to all the system basics, some highly recommended stuff can get your
    system to run Linux as smoothly as possible. You need a serial mouse, especially
    if you want to run X. (A PS/2 or bus mouse uses a little round port to plug into
    the back of your computer; it also is a headache to configure.) Have a known,
    compatible video card (such as an S3 model) to use X. Any compatible tape drive,'
  merge: -1
  img_proc: true
