- pgno: 196
  md: '# # Learning About Your Kernel


    You can find out a lot about your kernel by using the command `uname -a` as follows:


    ```

    # uname -a

    Linux tigerden 2.0.34 #5 Tue Jun 23 14:25:52 PDT 1998 i586 unknown

    ```


    The `uname` command first tells you which UNIX operating system is in use (in
    this case Linux), and then the host name, the kernel version, the date and time
    the kernel was compiled, and the hardware.


    The information_tweak with your kernel is the version number. In the above example,
    the kernel is 2.0.34. This is what''s known as a release, or stable kernel because
    of the middle number. If the middle number in the version number is even, then
    you have a stable kernel. If the middle number in the version number is odd, then
    you are working on a developmental kernel. Keep in mind that a developmental kernel
    may be unstable because it is considered “bleeding edge.”


    # ## Rebuilding Your Kernel


    Though Linux comes with the boot kernel to install on your hard drive, rebuild
    the kernel so you have the appropriate drivers and hardware support to get the
    most out of Linux. In this section, you''ll learn how to rebuild a kernel and
    some hardware that Linux supports.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_196_0.png)


    For more information on what hardware Linux supports, consult the Hardware-HOWTO
    in the CD-ROM.


    To rebuild the kernel, follow these steps:


    +   1. Check your compiler version

    +   2. Get rid of old object files

    +   3. Reconfigure the kernel

    +   4. Recompile the kernel

    +   5. Make a backup of the working kernel

    +   6. Test the new kernel'
  merge: -1
  img_proc: true
- pgno: 197
  md: 'To have an optimal kernel, rebuild your kernel. This enables you to have the
    appropriate drivers for hardware, networking, and file systems. Driver support
    for most of these can be either part of the kernel or a loadable module.


    When the driver is built into the kernel, Linux assumes that the hardware is there
    and it exists. On the other hand, a loadable module is part of the kernel that
    will only be in the kernel if it knows the hardware exists. When Linux detects
    the hardware, the module is plugged into the kernel. A good example of this is
    the PCMCIA drivers, where the modules are loaded when the cards are put in and
    unloaded when the cards are removed.


    Check to ensure that you have the correct version of *gcc* before you recompile
    the kernel (update the version, make sure you''re using ELF, and so on).


    To find out which version number of *gcc* you''re running, type the following:


    ```

    ```

    # gcc -v

    Reading specs from /usr/lib/gcc-lib/i486-unknown-linux-gnu/libc1/2.7.2.3/specs

    gcc version 2.7.2.3

    ```

    ```


    Next *go* to your kernel source. The source for your kernel is in /usr/src.


    ```

    ```

    # ls -l /usr/src

    total 3

    lrwxrwxrwx    1 root     root              12 May  4 14:36 linux -> linux-2.0.30

    drwxr-xr-x    15 root     root           1024 May 14 11:37 linux-2.0.30

    drwxr-xr-x    3 root     root           1024 May  4 14:38 sendmail

    ```

    ```


    Usually the *linux* directory is a link to the current kernel being used, in this
    case it is *linux-2.0.30*. What you do now is login as root and change to the
    */usr/src/linux* directory.


    ```

    ```

    # cd /usr/src/linux

    ```

    ```


    Listing 6-12 shows the contents of the directory from an *ls* output.


    # **Listing 6-12: Viewing the /usr/src/linux directory**


    ```

    ```

    # ls -l

    total 1238

    -rw-r    1 root     root            18458 Dec  1  1993 COPYING

    -rw-r    1 root     root             3723 Apr  8  1997 CREDITS

    drwxr-xr-x    6 root     root           1024 May  4 14:35 Documentation

    -rw-r    1 root     root             8809 Apr  8  1997 MAINTAINERS

    -rw-r    1 root     root             9729 Mar 17  1997 Makefile

    -rw-r    1 root     root            12056 Jun 26  1996 README

    ```

    ```'
  merge: -1
