    # STROBE


    Strobe is another useful tool for scanning ports. By default, it scans all the
    ports and looks for all sorts of stuff. This is a port scanner that works well
    not only on Linux, but on other UNIX platforms and non-UNIX operating systems
    (including Macintoshes and Windows 95).


    ```

    bash# strobe 1.2.3.4


    strobe 1.03 (c) 1995 Julian Assange (prof@suburbia.net).


    1.2.3.4 ftp 21/tcp # File Transfer [Control]

    1.2.3.4 ssh 22/tcp # Secure Shell Login

    1.2.3.4 telnet 23/tcp

    1.2.3.4 unknown 25/tcp unassigned

    1.2.3.4 unknown 37/tcp unassigned

    1.2.3.4 unknown 111/tcp unassigned

    1.2.3.4 unknown 668/tcp unassigned

    1.2.3.4 unknown 3629/tcp unassigned

    1.2.3.4 unknown 8080/tcp unassigned

    ```


    If you compare the nmap and strobe scans, you''ll notice both discovered all the
    open ports from 1 to 1024. However, if you passed the correct options on nmap,
    you would find the same ports reported open as you do in the strobe scan.'
