- pgno: 170
  md: 'If you are looking to run X from bootup, you can run Linux at run level 4.
    This will start xdm, the X display manager, which saves users having to run startx
    every time they log in. However, if your X server starts giving you fits, you
    might have some problems trying to fix them. In addition, you''ll have to change
    your run level or reboot into single-user mode.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_170_0.png)


    Chapter 6 provides more information on run levels.


    # Security and X


    A major advantage of X is its network transparency — which can also create a security
    problem. X is transferred over a cleartext session, which means anyone with a
    sniffer can access the data. Using X also means you''ll have another port open
    on your network, which in turn means that your host is more vulnerable to attack
    from the network.


    Provided you can control the potential security issue raised by X, it''s also
    possible to let other computers run X applications on your terminal. To control
    which computers can do so, use the `xhost` command:


    ```

    # xhost +

    ```


    # Fun with X


    I taught a UNIX fundamentals class last year and showed the students the joys
    of X (so to speak). One such delight was `xeyes` — a cute-but-useful application
    for finding your cursor — as well as how to use `xhost`, and how to send `xeyes`
    to a neighbor''s X display. The command looked like this:


    ```

    $ xeyes -display neighbor:0.0

    ```


    Some of the students had figured out that the up arrow in some shells enables
    you to go back and reuse a command — and promptly sent 20 xeyes displays to their
    neighbors'' X displays. This made for an amusing class — as long as it stayed
    in class.


    If you can do this operation with a harmless application, consider the possible
    damage if an intruder tries the same hijinks with a hostile X application. The
    lesson for administrators is straightforward: Don''t allow just anyone to use
    anyone else''s X display.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'If necessary, you can implement the opposite approach, restricting access for
    X commands to your own computer. The following command allows use of only those
    X commands in `/etc/[displaynumber].hosts`:


    ```

    # xhost -

    ```


    To increase security on an X server, you can enforce authentication with the `xauth`
    command\u2013 which enables you to edit and show authorization to the X server\u2014but
    keep in mind that this measure is not password\u2013enforced. One way you might
    strengthen security here is to use it with Secure Shell (available at http://www.ssh.org)
    to create an encrypted X session. This combination can extract information from
    the `$HOME/.Xauthority` file\u2014but use `xdm` to create it.


    > For more information on setting up X, see the XFree86\u2013HOWTO on the CD\u2013ROM.
    Another good reference is Linux Configuration and Installation, Fourth Edition
    (IDG Books Worldwide, 1998).


    When you get X working, you can see how nicely Slackware Linux can multi\u2011task.
    For instance, you can run `tail -f /var/adm/messages` in one window to see your
    system messages as they come up, compile a program in another window, and look
    up man pages in another.


    > Be careful if you''re running Slackware Linux with less than 16MB of memory.
    If you start compiling programs while running X and Netscape, you could see your
    system run noticeably slower than you''d like.


    When you''ve got X up and working, you can get many more applications to work
    with Slackware Linux. It''s amazing (for example) how much more you can do in
    the graphical environment, even without graphics\u2013manipulation programs. Figure
    5\u20137 shows the X application xcalc, a graphical application that enables you
    to run a simple calculator on your X display while keeping other terminal windows
    (such as xterm) open for entering commands.


    Take special care if you''re running X over a network. Most data can be inter\u2011cepted
    in such a situation, and X opens ports on your system that you probably don''t
    want just anyone getting into. If you do decide to run X over an untrusted net\u2011work,
    use Secure Shell with X forwarding. Doing so may require a little bit of tweak\u2011ing,
    but at least this a way to run X with strong authentication and encryption.'
  merge: -1
  img_proc: true
- pgno: 172
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_172_0.png)


    # Setting Up Printing Services


    If you have a printer accessible, check to ensure that (1) it''s Linux-compatible
    and (2) it''s set up properly. Printers can be the easiest – most frustrating
    – aspect of your Linux system, depending on how you approach them.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_172_1.png)


    > This section assumes that you''re printing from a local parallel-port printer.


    The first thing you need to do is get a compatible printer, then compile printing
    capabilities into the kernel. If you are running a parallel port Iomega Zip drive,
    note that you can only use the printer or the Zip drive – not both of them at
    the same time.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_172_2.png)


    > Be aware of incompatible printers. You should be able to find out which printers
    are compatible in the Hardware-HOWTO on the CD-ROM.


    Once you''ve gotten this far, you''ll want to make sure you create an /etc/printcap
    file. This database file will setup your printer correctly. You can also setup
    filters to be accessed by the /etc/printcap to prevent the “stairstep effect,”
    which adds additional tabs during the printing process.'
  merge: -1
  img_proc: true
- pgno: 173
  md: "![](img/8ad518fddafc7f5e73715a2604b61d50_173_0.png)\n\n> For more details on\
    \ how to setup a printcap file, please see the Printing-HOWTO on the CD-ROM.\n\
    \nOnce you have your printer setup, you have several commands that will help you\
    \ control your printers and allow the users to access them. One of the most useful\
    \ tools that you have is the `lpc` command, which is the line printer control\
    \ command.\n\n```\n``` \ntigerden:/home/stripes~ lpc \nlpc> \n```\n```\n\nOnce\
    \ you type `lpc` on the command line, your prompt will change. This will put you\
    \ in the control prompt for the printer. As root, you can disable or enable a\
    \ printer, disable or enable a printer's queue, rearrange the priority of jobs\
    \ in a spooling queue, or view the printer's status.\n\n```\n``` \nlpc> help \n\
    Commands may be abbreviated. Commands are:\nabort    enable   disable  help  \
    \    restart status  topq    ?\nclean    exit     down     quit      start   stop\
    \    up\n```\n```\n\nFor example, the `status` command output may look something\
    \ like this:\n\n```\n``` \nlpc> status \nlpc:\n        queuing is enabled\n  \
    \      printing is enabled\n        18 entries in spool area\n        printer\
    \ idle\n```\n```\n\nThis shows you that the printer is accepting jobs, acknowledges\
    \ that it's printing them, and tells you how many entries are in the queue, as\
    \ well as what the printer is currently doing. This information may change as\
    \ jobs get sent to the queue and whether or not the printer is printing. You can\
    \ also use the `lpc` command from the command line, as in the following example:\n\
    \n```\n``` \ntigerden:/home/stripes~ lpc disable all\n```\n```\n\nThis would disable\
    \ all the printers.\n\nOnce you're familiar with the administrative control of\
    \ a printer with `lpc`, you'll want to be familiar with basic printing commands—like\
    \ printing a file, viewing the queue, and removing print jobs from the queue.\
    \ To print a file, use the `lpr` command."
  merge: -1
  img_proc: true
- pgno: 174
  md: "```\ntigerden:/home/stripes- lpr b52s.txt\n```\n\nYou can also use the `pr`\
    \ command to print a file with similar syntax to `lpr`. However, it will print\
    \ the file with a 5-line header.\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_174_0.png)\n\
    \n> You can also print man pages as text files by piping them to the printer using\
    \ the following syntax:\n> \n> $ man <manpage> | col -b | lpr\n\nIf you want to\
    \ see what jobs are in the queue, use the `lpg` command.\n\n```\ntigerden:/home/stripes-\
    \ lpg\nlp is ready and printing\n\n      Rank   Owner      Job     Files     \
    \            Total Size\n      Active stripes  1     b52s.txt              1024\
    \ bytes\n```\n\nFrom the `lpg` output, you can see that your print job was assigned\
    \ a number. This number is used by the print queue to identify your print job.\
    \ You should be able to delete only print jobs owned by you, unless you're logged\
    \ in as root.\n\nIf you want to remove your print job, use the `lprm` command.\
    \ The format is pretty straightforward: Use `lprm jobnumber` or `lprm 0` to delete\
    \ all the print jobs. For example, the following command deletes print job 1:\n\
    \n```\ntigerden:/home/stripes- lprm 1\n```\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_174_1.png)\n\
    \n> Do not delete print jobs that don't belong to you unless you notify the users\
    \ of the reason for doing so (for example, a print jam or a system shutdown).\n\
    \nYou can also print graphics and other formatted files to your printer; however,\
    \ many are application specific. The good news is the Ghostscript application\
    \ and groff (a UNIX document formatting language) are covered in the Printing-HOWTO\
    \ on the CD-ROM.\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_174_2.png)\n\n> Make\
    \ sure you have the most up-to-date version of the `lpd` and `lpr` commands;there\
    \ was a security problem with a previous version of `lpd`. Printers and printer\
    \ daemons are still susceptible to hacking and possible denial-of-service attacks."
