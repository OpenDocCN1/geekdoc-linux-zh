    # NETWORKING DEVICE FILES


    The following list shows device files for TCP/IP networking devices, as well as
    for core UNIX networking (`/dev/inet` and `/dev/unix`). ICMP (which is `/dev/icmp`)
    is the messaging network that TCP/IP uses (the ping command uses ICMP). The IP
    device (`/dev/ip`) is the addressing that TCP/IP uses. Transport can be either
    UDP or TCP (`/dev/udp` and `/dev/tcp` respectively).


    ```

    crw-------    1 root       root        18,     2 Feb 18 1994 icmp

    drwxr-xr-x    2 root       root      1024 May  4 14:26 inet

    crw-------    1 root       root        18,     1 Feb 18 1994 ip

    crw-------    1 root       root        18,     3 Feb 18 1994 tcp

    crw-------    1 root       root        18,     4 Feb 18 1994 udp

    crw-------    1 root       root        17,     0 Feb 18 1994 unix

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_119_0.png)


    For more information on networking, see Chapter 11.


