    # File and System Integrity


    Why are you protecting everything on your Slackware system? It seems like you''re
    taking a lot of measures to keep what may seem insignificant to secure. It''s
    for integrity.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_330_0.png)


    If you do have sensitive data, encrypt it — even if you don''t think anybody will
    want it; however, data integrity is important on any host. Even if the host you''re
    securing doesn''t seem to have anything to secure, secure it anyway. Otherwise
    hackers may use it as a springboard to other systems (such as `www.cia.gov`).
    If it gets out that your system has been rooted or used as a springboard, you''ll
    get an undeserved reputation as a bad system administrator — and that will be
    the end of a promising career. One such mistake doesn''t actually make you a bad
    system administrator, but locking it out in the first place makes you a better
    one. (The avoid-a-bad-rep mentality is especially unfortunate because it''s one
    reason some security incidents go unreported.)


    You don''t want people mucking with your log files, creating back doors, or letting
    in Trojan horses. To head off such hijinks, start by running high-informative
    logs to see what''s going on. A good hacker knows how to cover his trails; so
    run programs like Tripwire and chattr to help keep file integrity.


    If you do suspect problems, the first place you should investigate is in the log
    files. Check several, , starting with `/var/adm/messages` and `/var/adm/syslog`.


