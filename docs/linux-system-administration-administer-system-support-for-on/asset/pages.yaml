    # Understanding Processes


    Any programmed occurrence that is now occurring on a UNIX file system is called
    a process. A UNIX process can be either related or unrelated to other processes.
    If one process is related to another—for example, by forking it—then the process
    taking the action is called the parent and the process acted upon is called a
    child. Whether related or unrelated, all UNIX processes have the same ultimate
    parent in common: init—the root process that assigns every other process a process
    identification number, or PID.


    # DISPLAYING PROCESSES


    You can view the processes currently running on your Slackware system by issuing
    the ps command, as shown here:


    ```

    $ ps


    PID TTY STAT TIME COMMAND

    121 1 S 0:00 -tcsh

    136 1 S 0:00 vi commands.txt

    352 1 S 0:00 /bin/tcsh -c ps

    353 1 R 0:00 ps

    ```


    If you want to see all the processes on a system, use the -aux options, as shown
    in Listing 5.6


