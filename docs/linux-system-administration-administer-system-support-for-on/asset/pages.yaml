- pgno: 215
  md: 'If you start seeing this, you could be compiling an unnecessary or incompatible
    driver. Double-check your configuration to avoid adding something unnecessary
    to your kernel.


    ```

    `sb_common.c:266: warning: ''sb16_set_mpu_port'' defined but not used`

    `make[2]: *** [sb_common.o] Error 1`

    `make[2]: Leaving directory ''/usr/src/linux-2.0.33/drivers/sound''`

    ```


    From here, you can see that what I''m trying to compile is `sb_common.c`, which
    is the sound card support. I don''t have a sound card in my PC yet (yeah, I know,
    I should get with the ''90s), so this particular feature wouldn''t do me much
    good anyway.


    Other possible problems include these:


    +   ◆ Wrong version of `gcc` (could be an outdated version, or you''re using `a.out`
    instead of ELF)


    +   ◆ Corrupt source code


    +   ◆ Improper symbolic links for `gcc` (check out the `/usr/src/linux/README`
    file)


    Hardware problems (rare, but it could happen)


    # A Word About Modules


    Remember those parts of the kernel you selected as "M"? Those are modules, which
    are part of the kernel that are not directly included as the core of the kernel.
    These separate pieces of the kernel can be loaded and unloaded into the kernel
    as they are needed.


    Many drivers, including tape drivers, Zip drives, and PCMCIA drivers can be compiled
    as modules. To compile modules, do so after the "make zimage":


    ```

    `# cd /usr/src/linux`

    `# make modules`

    `# make modules_install`

    ```


    When you''ve got a working kernel and you''ve rebooted, you can load your modules
    by running the `modprobe` command:


    ```

    `# modprobe modulename`

    ```


    For example, if you wanted to load the `IPX` module, you would run


    ```

    `# modprobe ipx.o`

    ```'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# # Examining Upgrades and Patches


    Why should you upgrade or patch your kernel?


    You might want to upgrade your kernel because of increased performance, bug fixes,
    security problems, and to just have the coolest most up-to-date kernel around.
    The following lists places to obtain kernel upgrades or patches:


    +   - http://www.linuxhq.org

    +   - http://www.kernel.org

    +   - http://sunsite.unc.edu:/pub/linux/kernel

    +   - http://tsx-11.mit.edu:/pub/linux/sources/system

    +   - http://sunsite.doc.ic.ac.uk:/pub/unix/Linux/sunsite.unc-mirror/kernel

    +   - ftp://ftp.univie.ac.at:/systems/linux/sunsite/kernel

    +   - ftp://ftp.Germany.EU.net:/pub/os/Linx/Local.EUnet/Kernel/Linus

    +   - http://sunsite.informatik.rwth-aachen.de:/pub/Linx/PEOPLE/Linus

    +   - ftp://ftp.ibp.fr:/pub/linx/sources/system/patches

    +   - http://sunsite.anu.edu.au:/pub/linx/kernel


    Instead of downloading all the source code needed for a full upgrade, you can
    upgrade partially via a patch. You might want to backup your old kernel source
    before patching. Or you can remove the link to the current linux-version number
    directory and create a new directory with the new version of the kernel:


    ```

    ```

    # cd /usr/src

    # rm linx

    # cp linx-2.0.30 linx-2.0.31

    # ln -s linx-2.0.31 linx

    ```

    ```


    To apply the patch, use the command `patch`.


    ```

    ```

    # patch -p0 < patch2.0.31

    ```

    ```


    This is for a decompressed patch. If your patch is compressed, you might want
    to decompress it first (or during the patching process) or it might cause problems.


    ```

    ```

    # uncompress patch2.0.31.Z

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'If you think there might have been problems, look for the files in the `/usr/src`
    directory with the `.rej` extension.


    If you can''t find any `.rej` files, just recompile and configure the kernel as
    you did before.


    If you want to undo the patch, type the following:


    ```

    # patch -R < patch2.0.31

    ```


    When you''ve patched your kernel, get rid of the `.orig` files before they start
    eating up your disk space.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_217_0.png)


    > Keep in mind that the `.orig` files should be in the `/usr/src` directory.


    Depending on your bandwidth to the Internet, you might want to use the kernel
    source code to recompile the kernel instead of applying the patch. However, in
    my experience, it''s best to install the patch for minor version upgrades (such
    as 2.0.30 to 2.0.31), and reinstall the source for major upgrades (such as 2.0.31
    to 2.0.45 or 1.2.1 to 2.0.41).


    # Hacking Your Kernel


    Kernel hacking is not breaking into your own Slackware system; it''s changing
    the kernel source for optimization or adding cool features. Before you do any
    kernel hacking, however, take a look at what''s already inside the `/usr/src/linux`
    directory:


    +   - **Architecture** – Contains directories that are specific to your computer''s
    architecture. These architectures include DEC Alpha, i386 (the x86 architecture
    including Intel and AMD), Motorola 68000 (old Macintoshes before they started
    using the PowerPC chip), MIPS, PowerPC, and the Sparc (Sun workstations). Because
    you''re running Slackware, you probably want to go into the i386 directory.


    +   - **Drivers** – Contains items from the `/dev` directory. Subdirectories include
    block devices, CD-ROMs, character devices, ISDN support, network devices, PCI,
    SCSI, sound card support, and Sun''s bus devices.


    +   - **File Systems** – Contains all the currently supported file systems.


    +   - **Include Files** – Contains the include files you''ll need to recompile
    the kernel.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '+   * Initialization – The make file command uses this to recompile the kernel.

    +   * System V IPC – Contains System V IPC file support.

    +   * Kernel – Contains the kernel itself. This part interacts directly with your
    hardware, including the DMA, directing modules in and out of the kernel, kernel
    panic, console messages, I/O management, signals and traps, system control interface,
    interrupts, and time keeping.

    +   * Libraries – Contains libraries needed for the kernel.

    +   * Memory Manager – Though this is in the directory mm, it stands for Memory
    Manager, not Multimedia. This includes functionality such as allocating, freeing
    memory, and mapping memory. Other memory functions are also in this directory.

    +   * Modules – Items that end up being modules goes here.

    +   * Networking – This doesn’t contain networking devices (those are in the drivers
    directory), this contains items such as IP, IPX, AX.25, and AppleTalk. This also
    includes support for DECnet and for hardware support such as Ethernet. Additionally,
    there’s a subdirectory for IPv6 (or IPng).

    +   * Scripts – Contains the scripts needed to configure the Linux kernel.


    If you do decide to do some kernel hacking, realize that doing so can make both
    your software and hardware vulnerable (yes, this activity could cause hardware
    problems); you undertake such activities at your own risk. If you do have the
    courage and skill to try this, however, you can make a distinct contribution to
    developing the kernel and drivers – and your help is appreciated by the Linux
    community. One more intangible – but real – benefit is a deeper, firsthand understanding
    of how hardware works with software.


    # Summary


    The center of Linux is the kernel. You can find out what version of the Linux
    kernel you are running by typing uname -a. It will print out the operating system
    and the version of the kernel you are running. There are two types of kernels:
    release or developmental. The most recent release of the Slackware kernel is on
    the CD-ROM that comes with this book. You can always download the developmental
    kernel to use the most up-to-date kernel; however, it may not be the most stable.


    When you’ve installed Linux, you can rebuild your kernel to have all the appropriate
    hardware and device drivers you may need. You may need to add more drivers depending
    on if you want sound card, CD-ROM, tape drive, and other hardware support. You
    can also enable networking and various file systems.'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'However, be aware you may be compiling too much into your kernel and you may
    need to troubleshoot.


    When you''ve installed your kernel, stay up to date with newer kernel versions.
    Some may correct security holes, others may increase performance or the type of
    drivers available. You can either download the entire kernel source code to build
    from scratch or you can download a patch instead.


    If you want to get down and dirty with the operating system, you can do kernel
    hacking. This is the process of optimizing the code or writing drivers to increase
    the amount of hardware support available. If you are interested in learning more
    about the kernel, you can look at the source files directly in * /usr/src/linux*.'
  merge: -1
