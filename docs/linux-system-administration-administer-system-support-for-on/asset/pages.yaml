- pgno: 55
  md: "# # Application Optimization\n\nTo optimize your applications, first make sure\
    \ you're not running too many apps at the same time. From `top`, you can see that\
    \ Process X eats a lot of memory. The applications in X may also eat more than\
    \ their fair share of CPU processes.\n\nIf, for example, you take a look at your\
    \ `top` output to see how much the WordPerfect demo program takes up, you can\
    \ see that `wpxdemon` and `wpxe` get most of the CPU time.\n\nFor specific applications,\
    \ be sure to research any performance and optimization issues — in short (you\
    \ guessed it), read the documentation.\n\n# # Memory\n\nIn addition to CPU processes,\
    \ you should also be concerned with another precious resource — memory, whether\
    \ actual or virtual. Use the `free` command to view your memory information, and\
    \ the `vmstat` command to view your virtual memory.\n\nThe `free` command shows\
    \ you how much memory is in use and how much is free. It should also display other\
    \ information such as shared memory, buffers, and cached memory. Consider the\
    \ following example:\n\n```\n```\nbash# free\n             total   used   free\
    \  shared  buffers  cached\nMem:        30788 30184   604   22764    1612   13344\n\
    -/+ buffers:\nSwap:          0     0     0\n```\n```\n\nLet’s assume that the\
    \ example refers to my PC, which has 32 megabytes of memory. Note that the total\
    \ and shared memory add up to approximately 32 megabytes. We’re not missing anything.\
    \ From here, you can also see that the swap space is not in use; we’re using about\
    \ half of the memory I have.\n\nFor more information on how to set up swap space,\
    \ check out Chapter 4.\n\nTo see your virtual memory statistics, run the command\
    \ `vmstat`. This displays virtual memory information. It will show you how much\
    \ is free, buffered, and cached.\n\n```\n```\nbash# vmstat\nprocs            memory\
    \           swap          io       system      cpu\n r  b  w   swapd free buff\
    \ cache  si  so  bi bo   in cs us sy id\n 1  0  0   0    1540 2732 13984   0 \
    \  0   4  1  119  39  2   4  94\n```\n```\n\nIf your system doesn’t have quite\
    \ enough memory, you might want to increase its virtual memory. If you have 16\
    \ megabytes of memory, for example, you should be fine with 32 or (to be on the\
    \ safe side) 64 megabytes of virtual memory."
