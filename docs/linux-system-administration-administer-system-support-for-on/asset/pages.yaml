- pgno: 65
  md: 'same thing happens again and you don’t remember how to recover. You could be
    liable for any information lost, which could possibly cost you your job. (That’s
    why you’ll hear this advice often: *Always make backups*.)


    # ## Keeping Files from Being Corrupted and Accessed


    Make sure there aren’t any unnecessary permissions on all files. This is a basic
    step to keeping files from being corrupted and accessed.


    In the following directory listing of the root directory `/,` only the `/tmp`
    directory has made writable privileges available to everyone and the sticky bit
    has been enabled (the “`t`” at the end of the permissions list). This arrangement
    is standard on a Slackware system; plenty of programs use the `/tmp` directory
    for writing temporary program files, so don’t let anyone play with that directory’s
    permissions.


    ```

    bash# ls -l

    drwxr-xr-x 4 root root 1024 May 20 10:47 X11

    drwxr-xr-x 2 root root 2048 May 4 14:38 bin

    drwxr-xr-x 2 root root 1024 May 14 11:40 boot

    drwxr-xr-x 2 root root 1024 Oct 6 1997 cdrom

    drwxr-xr-x 3 root root 20480 Jun 1 14:27 dev

    drwxr-xr-x 10 root root 2048 Jun 1 14:27 etc

    drwxr-xr-x 2 root root 2 May 26 13:06 floppy

    drwxr-xr-x 5 root root 1024 May 14 14:28 home

    drwxr-xr-x 3 root root 1024 May 4 14:33 lib

    drwxr-xr-x 2 root root 12288 May 4 14:21 lost+found

    drwxr-xr-x 2 root root 1024 Oct 6 1997 mnt

    dr-xr-xr-x 5 root root 0 Jun 1 07:27 proc

    drwxr-xr-x 2 root root 2048 May 4 14:38 sbin

    drwxr-xr-x 2 root root 1024 May 4 14:26 shlib

    drwxrwxrwt 4 root root 1024 Jun 1 14:43 tmp

    drwxr-xr-x 26 root root 1024 Mar 7 17:26 usr

    drwxr-xr-x 17 root root 1024 May 13 21:52 var

    -rw-r--r-- 1 root root 425490 May 4 14:47 vmlinuz.old

    -rw-r--r-- 1 root root 443498 May 14 11:39 zImage

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_65_0.png)


    **Remember:** Any directory that everyone can write to (under permissions 777,
    666, or 222) can be used to exploit a system. Make sure none of these directories
    are in the root’s path. Doing so can help you avoid Trojan horses aimed at the
    root. Permissions are your first line of defense against a possible attack.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# # Keeping Hardware Failure-Free


    Keeping hardware failure-free is a basic maintenance and purchasing issue. When
    you bought your computer, presumably you bought a warranty with it. Keep in mind
    that hardware does eventually fail, somewhere within the period of five minutes
    to 1,000 years after installation. If you have a hardware failure – and you will
    – you inevitably have downtime.


    If you work for a large site, you may want to consider on-site support from either
    the hardware manufacturer or vendor. A key benefit of a support contract is often
    24-hour maintenance; disks or motherboards may need to be replaced at 3:00 a.m.
    For small sites, however, 24-7 on-site support is often not an option, so you
    may need to keep extra hardware on-site. The best way to approach this problem
    is to buy a quality PC or quality parts from a reputable company. When you buy
    a PC, stay with a reputable hardware manufacturer, such as IBM, Compaq, and Hewlett-Packard.


    Many people also opt for mail-order PCs, though getting long-distance tech support
    can be a problem. Also, if your shop uses laptops, you always have issues that
    stem from proprietary hardware. Therefore, be prepared to run into compatibility
    issues; PCMCIA services are not always easy to get working.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_66_0.png)


    > Some companies sell PCs with Linux already installed. A list of such companies
    is available at `http://www.linux.org/vendors/systems.html`.


    Keep in mind that replacing PC hardware is much cheaper than it used to be, but
    replacing data is not. Here’s the message again: Always back up, especially if
    you’re running a nonstandard configuration in the kernel.


    # ## Building Your Own PC


    My experience suggests that the best way to go is to build your own PC – you buy
    the parts, so you know exactly what is in your system. For example, my PC has
    a Sanyo CD-ROM drive, a parallel port Iomega Zip drive, an S3 Trio 64V+ video
    card with 2MB of video RAM, a Seagate 2GB hard drive, a Sony Trinitron 15-inch
    monitor, 32MB of RAM, a US Robotics Sportster 33.6 modem (I know, get with the
    times), a generic keyboard and a 1.44MB floppy drive. All this is supported from
    a PCI motherboard. some generic parts work well enough. The major advantage of
    building your PC (or finding someone to assemble all the parts for you) is that
    you can make it Linux-compatible to begin with. Then you may need to spend not
    more than an hour to install Linux, recompile the kernel, and configure X. I paid
    about $1000 for my PC. It works fine, and Linux is designed to take advantage
    of the processor.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# # Keeping Up Performance


    With respect to keeping your performance where you want it, make sure each Slackware
    system runs no more than one CPU-intensive application (such as a database, firewall,
    or mailserver) at a time. Keeping your Slackware systems relatively uncomplicated
    also makes them less vulnerable and troubleshooting a lot easier. When a server
    has one specific role, you can simplify – turn down many of the other services
    that usually run by default. For example, an SMTP server doesn''t necessarily
    need the X-Window system running, or many of the Inetd services, and certainly
    not an HTTP server.


    Careful scrutiny of server roles can boost not only performance, but security
    as well. Turning off unwarranted network services can plug some security holes
    – for example, do you really need to rlogin to the SMTP server? Do you need a
    mail server to be CGI-enabled on its seldom-used HTTP server? If not, consider
    what you can safely turn off.


    A large company may have many servers for different purposes; if you''re running
    a small network in your home or for a small company, you may not want or need
    as many. You might, for example, want no more than three – a database, a DNS server,
    and a firewall. You could try running the DNS server directly on the firewall,
    but if you do, at least run the database on a separate system. A database eat
    lots of CPU time; also, if you keep it off the firewall you can enhance security:
    someone who breaks into your firewall hasn''t immediately broken into your data
    as well.


    # # Keeping Your Data Safe


    When you''ve got your critical data up and running, your next step is to ensure
    its safety. This includes locking backups in a safe, setting the proper permissions
    on critical files, and creating only the necessary user accounts.


    # ## WHICH USER ACCOUNTS ARE REALLY NECESSARY?


    Often a particular server process has to run as a certain user to manage access
    and prevent unauthorized use of its functionality.


    These docile accounts are created often for HTTP servers (such as Apache) and
    for other daemon processes. By default, the nobody account is used for daemons,
    but you may need to differentiate and create your own. (A good one for an HTTP
    server, for example, would be webuser.) Remember: you can disable actual logins
    and home directories on these user accounts. Further, you can allow processes
    to execute only under their own IDs, without actually gaining access to the system
    through telnet, or by some other unintended method.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_67_0.png)


    See Chapter 8 for more information on locking an account.This can help prevent
    unwarranted exploits against your server.'
