    # ## Using a Floppy


    The easiest way of booting into Linux with a multiple partition is to use a boot
    disk. This will guarantee that nothing happens to your boot sector. However, remember
    to make a few extra boot disks in case you lose any; keep backups all the time.


    To make a boot disk out of your kernel, all you have to do is put a disk in your
    floppy drive, and run the following commands:


    ```

    ```

    # cd /usr/src/linux

    # make zdisk

    ```

    ```


    This will give you a bootable Linux disk with the correct kernel so your drivers
    will be added during bootup. You can use other disks (such as the rescue disk)
    to boot, but all the appropriate drivers won’t be loaded at boot time.


    # ## Multiple Boot Partitions


    Many people run dual, or even multiple, partitions on their computer. You can
    run as many operating systems as you have hard drive space for. However, be aware
    that if something should happen to your boot sector, you can lose all your data:
    Linux and all the other operating systems.


    When changing over to another operating system, make sure you do a cold boot.
    This cleans out the memory. I’ve had problems with warm boots when going from
    one operating system to another. You can get all sorts of funky errors with any
    operating system, and sometimes the drivers will not load properly.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_228_0.png)


    Make sure you back up everything, and be careful when changing your boot sector.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_228_1.png)


    You can use aftermarket programs (such as Partition Magic) or FIPS (which comes
    with Slackware) to split and manipulate partitions. Though both approaches are
    reasonably reliable, however, they don''t negate the need to back up; you never
    know what can happen.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_228_2.png)


    For details about FIPS, see Chapter 1.


    Another major issue with dual boot partition is when LILO gets lodged in the boot
    sector, and it needs to be removed. Instances of this include upgrading Slackware
    versions or reallocating hard drive space. To remove it from the DOS/Windows95
    side, just type the following at the DOS prompt:


    ```

    C:\> fdisk /mbr

    ```


    This will clean out the boot sector. If you need to reinstall LILO, it will put
    it back in the boot sector.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_228_3.png)


    You might want to remove LILO before repartitioning a Windows95 or DOS partition.
    Then reboot with the Linux boot disk and reinstall LILO.


    # ## Run Levels


    Your Slackware system is always operating at a certain runtime level, or *run
    level*. Where a television has two states, on and off, a Slackware system has
    several levels of “on.” These correspond to five user-type run levels: Single-user
    mode (level'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'one) and levels two, three, four, and five. These levels determine what functionality
    the computer will have at the time. The levels of functionality at each run level
    are determined through the `/etc/inittab` file, as shown in Listing 7-3.


    # Listing 7-3: Using /etc/inittab


    ```

    "# inittab  This file describes how the INIT process should set up\n#     the
    system in a certain run level.\n#\n# Version:   @(#)/inittab       2.04   17/05/93   MVS\n#                  2.10   02/10/95         PV\n#\n#
    Author:   Miguel van Snoorenburg, <MiguelS@drinkel.nl.mugnet.org>\n# Modified
    by:  Patrick J. Volkerding, <volkerdi@ftp.cdrom.com>\n#\n# Default runlevel.\nid:3:initdefault:\n"

    ```


    This is the default run level. When you boot your Linux system, it will automatically
    boot to run level 3. You can change this, depending on what you want.


    ```

    "# System initialization (runs when system boots).\nsi::sysinit:/etc/rc.d/rc.S\n"

    ```


    No matter what the run level your system is using, it will always run level S
    (the system-initialization level) first. Then it reads the file `/etc/rc.d/rc.S`
    while in the system-initialization run level.


    ```

    "# Script to run when going single-user (run level 1).\nsu:1S:wait:/etc/rc.d/rc.K\n"

    ```


    If you need to do system maintenance on disk partitions or file systems, boot
    into single-user mode. When you installed Slackware, you were in single-user mode.
    This is an administrative mode, so you won''t be prompted for the root password.
    Keep in mind that you don''t want to have just anyone be able to boot into single-user
    mode; that''s why physical security is important – especially for laptops.


    ```

    "# Script to run when going multi user.\nrc:2345:wait:/etc/rc.d/rc.M\n"

    ```


    Run levels 2, 3, 4, and 5 are for multiple users. They enable users besides root
    to log in to the Linux system. Run levels 3 and 4 are already defined; to define
    other run levels, you would write scripts for `/etc/rc.d/rc.2` and `/etc/rc.d/rc.5`.
    Examples follow.'
  merge: -1
  img_proc: true
- pgno: 230
  md: '```

    # What to do at the "Three-Finger Salute"

    ca::ctrlaltdel:/sbin/shutdown -t5 -rf now


    # Runlevel 0 halts the system.

    10:0:wait:/etc/rc.d/rc.0


    # Runlevel 6 reboots the system.

    16:6:wait:/etc/rc.d/rc.6

    ```


    **Run levels 0 and 6** shut down the system. **Run level 6** reboots the system
    after shutdown, putting the host into system-initialization mode.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_230_0.png)


    > Although you could force a reboot by pressing **Ctrl-Alt-Del** (the “three-finger
    salute”) as you would to reboot in DOS, doing so can disrupt mounted file systems.
    Save this method for dire emergencies only.


    If you need to reboot while the system is at a multiuser run level, use **run
    level 6** or the **reboot** command, as the following example shows:


    ```

    # What to do when power fails (shut down to single-user).

    pf:powerfail:/sbin/shutdown -f +5 "THE POWER IS FAILING"


    # If power is back before shutdown, cancel the running shutdown.

    pg:0123456:powerokwait:/sbin/shutdown -c "THE POWER IS BACK"


    # If power comes back in single-user mode, return to multiuser mode.

    ps:S:powerokwait:/sbin/init 5

    ```


    The scripts just given are typical of those that can handle the run levels during
    a power failure. If the power fails, Linux shuts down to single-user mode. If
    power comes back before shutdown is complete, then the shutdown is cancelled.
    However, if the power does come back and the Linux host is in single-user mode,
    run **level 5** starts (`/sbin/init 5` changes the current run level to 5). An
    example follows:


    ```

    # The getties in multiuser mode on consoles an serial lines.

    #

    # NOTE NOTE NOTE adjust this to your getty or you will not be

    #       able to login !!

    #

    # Note: for ''agetty'' you use linespeed, line.

    # for ''getty_ps'' you use line, linespeed and also use ''gettydefs''

    c1:12345:respawn:/sbin/agetty 38400 tty1 linux

    ```'
