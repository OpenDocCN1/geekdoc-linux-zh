- pgno: 355
  md: 'If you wanted to make a backup of your entire disk to another hard drive, you
    could do something like this:


    ```

    # find / -cpio /dev/hbd

    ```


    You can also use the cpio command alone. With the -o option, you can read output
    into the cpio command.


    ```

    # ls -R /home | cpio -o > /dev/rmt0

    ```


    This would take a recursive listing of the /home directory and redirect the output
    to the first tape drive.


    # Restoring Files


    When you’ve made backups, you’ll soon be glad you did. If one of your users accidentally
    deletes his home directory, you don’t have to panic. If you’re using tar, you
    can simply correct the problem.


    ```

    # tar -xvfZ /zipdrive/backup-home-dir.tar.gz /opt/restore

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_355_0.png)


    Even if you know the contents of the backup data, it doesn’t hurt to have a separate
    restore section so you don’t overwrite anything you didn’t mean to get rid of.


    If you’re using the dd command, it’s something similar. Again, make sure you don’t
    reverse the if and the of devices.


    ```

    # dd if=/dev/rmt0 of=/opt/restore

    ```


    For cpio, the command takes a different syntax than the example above for creating
    the backup. This will restore a specific file from the tape drive.


    ```

    # cd /opt/restore

    # cpio -id filename < /dev/rmt0

    ```


