  md: '| User (u) <br> 4 2 1 | Group (g) <br> 4 2 1 | Others (o) <br> 4 2 1 |

    | :---: | :---: | :---: |

    | r w x | r w x | r w x |

    | 7 = rwx <br> 6 = rw <br> 5 = rx <br> 3 = wx <br> 0 = none | 7 = rwx <br> 6 =
    rw <br> 5 = rx <br> 3 = wx <br> 0 = none | 7 = rwx <br> 6 = rw <br> 5 = rx <br>
    3 = wx <br> 0 = none |


    Figure 8-1: Permissions are broken up in three octal numbers with associated symbols.


    Each bit (r, w, and x) is represented with 4, 2, and 1 respectively. Keep in mind
    that the user field is worth the bits set multiplied by 100, the group is the
    bits set multiplied by 10, and the other field is the bits set multiplied by 1.
    So, to set a file with user (x 100) read (4) and execute (1), and group (x 10)
    read (4), and nothing (zero) for the others (x 1) you get


    ```

    User = 100 x (4 + 1) = 500

    Group = 10 x (4) = 40

    Other = 1 x (0) = 0


    Total = 500 + 40 + 0 = 540

    ```


    When you add them together—and then add those results—you arrive at the total
    for each position.


    For example, if you want user access but no group or other access, you would give
    a file or directory permission 700. To set permissions, use the chmod command.
    The first digit represents the user, the second digit represents the group, and
    the last digit represents everyone else.


    ```

    # chmod 700 filename

    ```


    For symbolic notation, you use letters to represent the permissions instead of
    numbers. For reading, use r; for writing, use w; for executing, use x. In this
    case, use a plus sign to add those permissions, a minus to remove, and an equals
    sign for only those permissions. Letters represent the placement of the number,
    u for owner, g for group, o for others, and a for all users.


    The example following shows how to use the symbolic notation.'
