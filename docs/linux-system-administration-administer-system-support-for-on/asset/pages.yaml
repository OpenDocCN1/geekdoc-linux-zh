  md: 'Another useful tool to use is *tune2fs*. This enables you to tune your file
    system. You can change the response to errors (continue, mount as read-only, or
    kernel panic), set the volume label and any other parameter that could be created
    with *mke2fs*. However, you are playing with a live file system. Be aware that
    you can cause some drastic and possibly unwanted results.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_96_0.png)


    > Do NOT run *e2fsck* or *tune2fs* on a read-writable mounted partition! Before
    using *e2fsck* or *tune2fs*, make sure you backup the data on the disk and unmount
    the partition. Keep in mind you are changing the configuration of the disk itself,
    and you may lose your data.


    # # Links


    Two types of links are available in your Linux system: *hard* and *symbolic* (also
    called a *soft link* or *symlink*). Inodes play a large part in the functioning
    of both types. A *link* is a way to "nickname" a file; you can refer to the same
    file with more than one name. The following listing depicts a file called *inodes*,
    a *symlink*, and a *hardlink*.


    ```

    ```

    $ ls -li


    total 11

    93475 -rw-r--r--  1 stripes users      52 Aug  6 17:06 diskstuff

    93474 -rw-r--r--  2 stripes users    3470 Aug  6 19:06 hardlink

    93474 -rw-r--r--  2 stripes users    3470 Aug  6 19:06 inodes

    95505 drwxr-xr-x  2 stripes users    1024 Aug  6 17:06 moreinfo

    99569 drwxr-xr-x  2 stripes users    1024 Aug  6 17:07 morestuff

    93474 lrwxrwxrwx  1 stripes users       6 Aug  6 17:36 symlink -> inodes

    ```

    ```


    # ## HARD LINKS


    A hard link points to the inode of a file. From the following listing, you can
    see both *hardlink* and *inodes* have the same inode, or index number (93474).
    Also, you can see they both have the same time (19:06) and block size (3470).


    ```

    ```

    $ ls -h * i*


    93474 -rw-r--r--  2 stripes users     3470 Aug  6 19:06 hardlink

    93474 -rw-r--r--  2 stripes users     3470 Aug  6 19:06 inodes

    ```

    ```


    To create a hard link, just issue the command *ln*.


    ```

    ```

    $ ln file hardlink

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'To hard-link directories, issue the commands `ln -d` or `ln -F`. Only root
    (or other users with su ability) can do this. Hard links can be moved and edited
    and this does not affect the actual file.


    ```

    # ln -d /etc/important_stuff

    ```


    # SYMBOLIC LINKS


    A symbolic link links to the pathname instead of the inode. So, the symlink only
    points to the inode, it doesn''t directly access it. From the long listing following,
    you can see that inodes and symlink have different inodes (93474 and 93476 respectively),
    symlink is 6 blocks and inodes is 3470 blocks, and they have different access
    times.


    ```

    $ ls -ll

    93474 -rw-r--r-- 2 stripes users 3470 Aug 6 19:06 inodes

    93476 lrwxrwxrwx 1 stripes users 6 Aug 6 17:36 symlink -> inodes

    ```


    Symbolic links have advantages over hard links. They can be on different partitions
    and physical disks since they don''t access the file system directly. However,
    they can''t be moved without affecting the original file.


    To create a symbolic link, use `ln -s`.


    ```

    $ ln -s file symlink

    ```


    # The sum Command


    Inodes can help check file integrity with the `sum` command. If you run `sum`
    against a file, it will display the 16-bit checksum value of the file. The checksum
    is a mathematical hash of the file. This will change if the contents of the file
    changed or if the file has been accessed. If you compare checksums of a file after
    it''s changed, you can see that the checksum has changed, too. Take a look at
    the output of the `sum` command.


    ```

    $ sum d* h* i* s*

    43651 1 diskstuff

    33573 4 hardlink

    33573 4 inodes

    33573 4 symlink

    ```


    Because links access the same file, the checksum is the same. Now I''ll edit the
    inodes file. You can see that the checksum for hardlink, inodes, and symlink have
    all changed from 33573 to 37612.'
  merge: -1
  img_proc: true
