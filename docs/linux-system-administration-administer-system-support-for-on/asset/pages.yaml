- pgno: 148
  md: "# # Using Basic Commands for\nAdministrative Tasks\n\nMost commands you use\
    \ as a system administrator are probably familiar – you've played with them before\
    \ – such as ls, ps, diff, chmod, chown, rm, mv, and grep. Although specialized\
    \ tools are now available to system administrators – personal productivity and\
    \ desktop applications, system tools to improve administration and functionality,\
    \ file managers, utilities, and compilers – sometimes a simpler approach is more\
    \ effective.\n\nAs your familiarity with Linux grows, consider using basic Linux\
    \ commands to do administrative tasks. For example, when you type ls -l, you can\
    \ see the links – as well as the permissions – on a directory. The results can\
    \ be instructive: If (for instance) you find that a directory with 777 permissions\
    \ is owned by root, you know you've got a problem.\n\n# ## Taking Control of Your\
    \ Files and Directories\n\nWhen all files are where you want them, make sure your\
    \ network's files and directories are appropriately accessible by users. Check\
    \ the files that only the root user needs to ensure that only root has permission\
    \ to use them.\n\nWhen editing files as root, or as any privileged user, be aware\
    \ of your umask – the default permission assigned when the root account creates\
    \ files. If you use redirection or other such methods during editing, the resultant\
    \ files may have permissions different from what you expect. You can check, read,\
    \ and set the umask by using the umask command:\n\n```\n```\nbash# umask\n022\n\
    ```\n```\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_148_0.png)\n\n> While the\
    \ umask may seem relatively trivial, it gains importance in a high-security environment.\
    \ If you truncate a log file, you can easily set the read bits for world access,\
    \ revealing critical system information to any user logged in to the system.\n\
    > \n> Also, some applications may expect to write to a certain log file – and\
    \ if you altered it as root, you may have changed the permissions – which could\
    \ cause the application to fail, causing all sorts of havoc.\n\nIf you were to\
    \ set your umask to 022 (as shown here), the files you create would have default\
    \ permissions of 755, or rwxr-xr-x, which implies full permissions for you, as\
    \ well as read-and-execute permissions for group members and all users in"
