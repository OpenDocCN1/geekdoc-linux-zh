- pgno: 206
  md: '10. CD-ROM drivers (not for SCSI or IDE/ATAPI drives) – This set of options
    is for non-standard CD-ROM drives. There is also a CD-R listed in here, the Sanyo
    CDR-H94A. Unless you are using an non-IDE or non-SCSI CD-ROM, you can skip this
    section. Because the boot disk you create should have your appropriate CD-ROM
    driver for installation, you may want to use that as an idea of what type of CD-ROM
    drive you have. In my case, I’ll skip this section. My CD-ROM drive is mounted
    as the slave drive on the second controller (/dev/hdd). The CD-ROM drivers options
    is shown in Figure 6-12.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_206_0.png)


    Figure 6-12: Nonstandard CD-ROM support options


    11. File systems – To me, this is the coolest part of Linux. Linux can support
    lots of file systems. These include FAT, VFAT, System V IPC, and quite a few other
    types. A few that are necessary to include: Second Extended File System support,
    Unicode, ISO 9660 (for CD-ROMs), MS-DOS and DOS file-system support, and Unicode
    support. Many people find including the Joliet (long Windows name) support very
    useful as well. I usually like to enable Minix (some rescue disks still use it),
    and /proc file system, which interfaces the kernel and processes. Additionally,
    if you enabled disk quotas, also enable support here. The file systems options
    are shown in Figure 6-13.'
  merge: -1
  img_proc: true
- pgno: 207
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_207_0.png)


    12. **Character devices** – This section includes serial devices, MUX, and various
    tape drives. If you are using a modem, enable standard/generic serial support.
    Also, if you are using a parallel-port Zip drive and a printer, you’ll probably
    want to enable them both as modules, otherwise you can have some serious hardware
    conflicts – besides having only one parallel port. If you are using a PS/2 mouse
    or a bus mouse, you can define it here as well. The Character device section is
    shown in Figure 6-14.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_207_1.png)


    13. **Sound** – This is the sound-card support section. This section is if you
    want to hear WAV files, music CDs, and other forms of audio'
