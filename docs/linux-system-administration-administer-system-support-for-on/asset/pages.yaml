- pgno: 163
  md: '# ## Editing and Gleaning Output


    One common duty of a system administrator is to clean up output and make it more
    readable or usable in a script. Three common “editing” tools are `cut`, `awk`,
    and `sed`.


    You can execute a command on the output with the `xargs` command. When you’ve
    got your output the way you want it, you can execute commands against it. For
    example, the string of pipes following will kill all processes belonging to the
    user bill.


    ```

    ```bash

    # ps -eaf | grep bill | grep -v grep | cut -c1-5 | xargs kill -9

    ```

    ```


    The `sed` and `awk` tools are nearly languages in their own right. I use `sed`
    a lot for filtering. For example, if you wanted to remove all the “>” at the beginning
    of a file (such as an e-mail message), you can run this `sed` command on the file.


    ```

    ```bash

    $ sed />/g file.txt

    ```

    ```


    The `sed` context can get a lot more complicated. Please see the `man` page for
    more details. The `awk` command syntax is a lot more complex than `sed`; please
    see the `man` page for more details.


    # ## Scheduling Jobs


    UNIX offers a decidedly cool capability of scheduling a job for either a one-time
    run or a repeated schedule. The `at` and `batch` commands are great for running
    executables at a later time; `cron` enables scheduling.


    # ### ONE-TIME JOBS


    For one-time jobs, use the `at` or `batch` commands. To run a command for a later
    time, use `at`. Replace filename with a real file you plan on running and HH for
    hours and MM for minutes (in military time).


    ```

    ```bash

    # at -f filename HH:MM

    Job 1 will be executed using /bin/sh

    ```

    ```


    If you want to see what jobs are in the queue, use `atq` as follows.


    ```

    ```text

    # atq

    Date                    Owner     Queue     Job#

    21:30:00 08/12/98      root      c         1

    ```

    ```


    If you want to remove your job before it runs, use the `atrm` command.


    ```

    ```bash

    # atrm1

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 164
  md: 'If you want to run a job that will run the process as soon as the system load
    permits, use batch instead of at.


    # SCHEDULING JOBS WITH CRON


    On a Linux system, a daemon called `crond` scans the crontab files for changes
    and runs the jobs listed in the crontab files. The crontab files are usually stored
    in `/var/spool/cron/crontabs`. The files are identified by username (such as root,
    nobody, bob, heyyou).


    The first number in the crontab file is the minute, the second is the hour, the
    third is the day of the month, the fourth is the month, the fifth is the day of
    the week, and the last field is the command.


    So, a crontab file by the name of `bob` can look like this:


    ```

    5 7 * * * echo "Go exercise!"

    ```


    And this would tell `bob` to go exercise every day at 7:05 a.m.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_164_0.png)


    > Remember, the time is military time. If you specify both a day of the month
    and a day of the week, crond will decide which to use by applying the logical
    operator OR.


    To edit the crontab for a user, use the `crontab -e username` syntax, like this:


    ```

    # crontab -e heyyou

    ```


    If you want to see the crontab for a user, use the `-l` (lowercase L) option.


    ```

    # crontab -l root

    ```


    You can also delete a crontab for a user using the `-d` option.


    ```

    # crontab -d nobody

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_164_1.png)


    > Keep careful track of all your crontab files; to keep your sanity as well, don''t
    keep them in more than one directory. Also, keep in mind that root does run crontabs
    as scheduled —and you don''t necessarily want to run any command just because
    it''s scheduled.'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# # Using the X Window System


    The popularity of Windows 95 and NT has led many people to think that operating
    systems without graphical user interfaces don''t have a future. Slackware Linux,
    as well as other UNIX operating systems, have a graphical user interface: the
    X Window System.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_165_0.png)


    > The X Window System, as a UNIX-specific feature, should not be confused with
    any version of the Microsoft Windows operating system.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_165_1.png)


    > Slackware Linux comes with XFree86, a free implementation of X provided by the
    X consortium. Most of the X applications look very similar to any Motif implementation
    of X such as `xterm`, `xload`, `xclock`, and `xeyes`.


    To set up X, first make sure you''ve included the VGA 16-color X server, and then
    run the following as root:


    ```

    ```bash

    # XF86Setup

    ```

    ```


    Before you set up X, check your video card and your monitor''s frequency settings
    to ensure compatibility and support. It also helps to know what type of mouse
    you have and what Slackware Linux thinks it is.


    # ## Setting Up an X Server


    X is a graphical user interface created for UNIX at MIT. X is network transparent,
    and clients (known as *Xterminals*, basically dumb graphical terminals) which
    are designed to accept only X traffic from the X server. With Linux, usually the
    X server and the X client are located directly on the same computer. However,
    you may need to set up X clients such as Xterminals or X-emulation software for
    PCs to access your X server from another computer.


    There you will setup your mouse, video card, monitor, mode, and keyboard. Your
    mouse should be the same one you picked at setup. It should work in the XF86Setup
    mode; otherwise, you''ll have to use the tab key to move between fields to get
    your mouse working properly. You can also have a two-button mouse emulate three
    buttons, and you can tweak the response times and baud rate of your mouse.'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'When you’ve done that, you should be able to set up your video card. To set
    up your video card, choose the appropriate – supported – video card on the list.
    That’s all you should have to do. Even a high-powered card with tons of video
    does you no good if it’s not compatible with Xfree86. For a list of currently
    compatible video cards, consult the Xfree86-HOWTO included in the appendix. (Accelerated
    video cards such as the S3 chipset are great for X.) The type of bus your computer
    uses for the video card shouldn’t matter; either PCI or ISA buses should work.


    You should also set up the appropriate frequency for your monitor. Multisync monitors
    are common today, and as long as you have the hardware manual or know the video
    modes for yours, it should be a piece of cake to configure.


    The video mode determines the size of the screen. The smaller the number for the
    resolution, the larger your X display will be. Where the higher the resolution,
    the smaller the display. The available preset modes are 640x480, 800x600, 1024x768,
    1280x1024, and 1600x1200 (for those will really big monitors or really good eyes).
    To toggle between modes, use Ctrl+Alt+-(minus) to go down in resolution or Ctrl+Alt++(plus)
    to increase the resolution.


    Your keyboard configuration should not change; so, the next step would be to save
    the configuration by pressing the Done button at the bottom.


    After you complete the XF86Setup, a symbolic link (X) is created to link to XF86_[servertype],
    depending on your video card and choices. Some Xfree86 X servers are:


    ```

    /usr/X11R6/bin/XF86_Mono

    /usr/X11R6/bin/XF86_SVGA

    /usr/X11R6/bin/XF86_VGA16

    /usr/X11R6/bin/XF86_S3

    ```


    Notice that there a couple of generic X servers, including monochrome, VGA, and
    Super VGA, as well as X servers for specific graphics cards, including S3 and
    Mach32 chipsets.


    When the link is created, the X server is restarted and xvdtune runs. This enables
    you to tweak your X configuration file. You’ll see a warning message that tells
    you that you can damage your monitor this way; but that only refers to the ancestors
    of Multisync monitors. It’s good for tweaking how far to the right or left, or
    any little thing. However, if the screen starts behaving weirdly – flashing or
    drawing lines across the screen – kill the X server by pressing Ctrl+Alt+Backspace.


    After you have completed the setup, the .X defaults are created in the users''
    directories after they run X.


    To run X, type startx at the prompt.


    ```

    $ startx

    ```


    Now you have a common desktop. The defaults for applications are in the $HOME/.xinitrc
    file. A .xinitrc file could look like this:'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 140 Part II: System Administration in Action


    ```

    # loads the .Xresources, which defines the look and feel

    xrdb -load $HOME/.Xresources

    # Sets the root display, can choose colors, patterns, or bitmaps

    xsetroot -solid blue &

    # start X with applications already running, xclock, xload, and xeyes &

    xclock -g 50x50-0+0 -bw 0 &

    xload -g 50x50-50+0 -bw 0 &

    # xeyes is an X application that follows the cursor by always

    # "looking" at it

    xeyes 50x50-100+0 -bw 0 &

    # start a couple of xterms

    xterm -g 80x24+0+0 &

    xterm -g 80x24+0-0 &

    # start the window manager

    fvwm

    ```


    Common window managers include these:


    +   LessTif (mwm) - a clone of the commercially popular Motif


    +   Tab Window Manager (twm) - one of the original window managers (not as pretty
    as LessTif and doesn''t manage memory as well)


    +   VirtuaI Window Manager (fvwm2) - which gives you virtual root displays and
    provides more 3D effects than LessTif


    Figures 5-3 and 5-4 show the LessTif and Tab Window Manger respectively.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_167_0.png)


    Though not included with Slackware, WindowMaker provides a NeXT-like interface
    that''s handy to configure. Figures 5-5 and 5-6 show the WindowMaker interface
    in action. You can download WindowMaker from http://www.windowmaker.org.'
