- pgno: 141
  md: 'Security programs (PGP, Tripwire, Tiger, and so on):


    ```

    /opt/security

    ```


    Programs to be installed (provided you have the tar files):


    ```

    /opt/install

    ```


    Local binaries:


    ```

    /usr/local/bin, /usr/bin, /bin

    ```


    System administration binaries:


    ```

    /usr/sbin, /sbin, /usr/local/sbin

    ```


    Always group files and directories by a common thread. This makes them easier
    to find and possibly troubleshoot. When you have your directories set up the way
    you like, remember that you can rearrange them with the *mv* and *cp* commands.


    # Library Locations


    Executables are linked either statically or dynamically. A *statically linked*
    file includes the programming libraries from when the executable was compiled.
    A *dynamically linked* file includes libraries that exist on the current system
    when the program executes, not those that originally existed when it was compiled.
    Whether they are statically or dynamically linked, Linux stores many executables''
    libraries in /lib, /usr/lib, /usr/local/lib, and /usr/X11R6/lib. Listing 5-1 shows
    an example of the /lib directory, which indicates the shared objects (in this
    case, libraries).


    **Listing 5-1: Viewing the /lib directory**


    ```

    $ file /lib/*

    /lib/cpp:               symbolic link to /usr/bin/cpp

    /lib/ld-linux.so:       symbolic link to ld-linux.so.1

    /lib/ld-linux.so.1:      symbolic link to ld-linux.so.1.9.9

    /lib/ld-linux.so.1.9.9:  ELF 32-bit LSB shared object, Intel 80386, version 1,
    not stripped

    /lib/ld.so:              ELF 32-bit LSB executable, Intel 80386, version 1, statically
    linked, stripped

    /lib/libc.so.4:         symbolic link to libc.so.4.7.6

    /lib/libc.so.4.7.6:     Linux/i386 demand-paged executable (QMAGIC), stripped

    /lib/libc.so.5:         symbolic link to libc.so.5.4.44

    /lib/libc.so.5.4.44:    ELF 32-bit LSB shared object, Intel 80386, version 1,
    stripped

    ```'
