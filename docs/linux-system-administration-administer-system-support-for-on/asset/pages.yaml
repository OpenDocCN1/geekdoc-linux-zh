    # LISTSERV


    Listserv was the original mailing-list management software. It originated on BIT-NET,
    a now-defunct academic network. Listserv migrated to the Internet and still administers
    many mailing lists today. Its commands give it functionality similar to that of
    Majordomo, and it''s not as easy to customize. Table 12-2 lists the basic commands
    for Listserv.


    TABLE 12-2 LISTSERV BASIC COMMANDS


    | Command | What It Does |

    | :--- | :--- |

    | subscribe | Subscribes you to the Listserv |

    | unsubscribe | Unsubscribes you to the Listserv |

    | conceal | Hides your name so others can''t see you''re on the list. |

    | noconceal | Makes your name publicly available to the mailing list |

    | set acknowledgement | Gets notified each time you send to the Listserv |

    | set noacknowledgement | Doesn''t get notified each time you send to the Listserv
    |

    | set nomail | Temporarily suspends the Listserv messages |

    | set mail | Restores receiving messages from the Listserv |

    | set digests | Receives digests from the mailing list instead of one message
    at a time |

    | review list | Sees who else is on the mailing list |

    | search | Searches the archives for a particular string |'
  merge: -1
  img_proc: true
- pgno: 408
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_408_0.png)


    Listserv is not freeware. If you are interested in the Listserv software, however,
    check out http://www.lsoft.com.


    # Daemons


    E-mail is managed by daemons such as POP3 (which enables you to download your
    mail remotely and read it off-line); IMAP (which enables you to read your mail
    remotely); and sendmail (which enables you to be the mail authority for a certain
    domain). Except for sendmail, these daemons, are managed by inetd, the net-working
    super-daemon. All work in a client-server model; the daemons perform as servers.
    POP3 and IMAP both let the users start the clients (Pine uses IMAP, and POP can
    be used with other clients such as xnih). To use a client with POP or IMAP, you
    don’t have to have the daemons running.


    As with POP and IMAP, sendmail is a delivery agent – but its workings are a little
    more complicated. You can use sendmail to filter messages (for example), and you
    may find its design less friendly than that of POP or IMAP.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_408_1.png)


    Sendmail is known to be a major security hole. Additionally, some cleartext-related
    holes have appeared recently in IMAP and in POP (especially since they send passwords
    over the wire). If you’re going to use a mailer, first try using qmail instead.
    It’s not only easier to use, but more secure. You can find it at http://www.qmail.org.


    # Using Client Applications


    Several clients are available for the World Wide Web, including Netscape, as shown
    in Figure 12-4. Some Web browsers include the functionality needed to read e-mail
    or USENET news.'
