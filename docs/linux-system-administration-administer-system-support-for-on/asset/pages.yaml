  md: 'When you''re doing the format for the first time, make sure you select “CHECK”
    for the slow format and check for bad sectors. If your hard drive has bad sectors,
    replace it as soon as you can.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_42_0.png)


    > If you''re using a hard drive with more than 1024 cylinders, keep in mind that
    Linux will remap your disk space to be 1023 cylinders. You still have the entire
    drive accessible, it will just be mapped in a way different from that used on
    a hard drive with less than 1 gigabyte.


    For inodes, pick the default, which is 4096. After your partitions are formatted,
    go to “SOURCE” and pick the installation media. In your case, make sure you select
    5, which installs from CD-ROM. If your CD-ROM is ATAPI and IDE, select the first
    choice. If you don''t know which disk-drive location corresponds to your CD-ROM,
    select the option that scans for CD-ROM; it should find the appropriate drive.
    (Mine was found at /dev/hdd, where I installed it.)


    Next, you''ll see a menu that asks you the type of installation desired. You have
    a choice of slackware, slacktest, or custom. Slacktest will run Slackware mostly
    off the CD-ROM, where slackware will install Slackware packages directly to your
    hard drive. We want to install slackware.


    After selecting slackware, you will pick the packages you want to install. Ignore
    the custom selection. You have the following choices:


    +   - A Base Slackware Linux. Includes the minimal code required for a working
    Linux system

    +   - AP Slackware Linux applications. Features for a more elaborate Linux system

    +   - D Program Development. You need this to recompile the kernel, even if you
    don''t program.

    +   - E GNU Emacs. A versatile editor – you can do everything with it but wash
    your dishes

    +   - F Frequently Asked Questions and other important documentation

    +   - K Linux kernel source. An operating system or toy? You decide.

    +   - N Networking. TCP/IP, UUCP, SLIP, PPP, mail programs, USENET, and nearly
    anything else you might need to connect to the Internet or to other computers

    +   - T TeX. A typesetting language. Good if you''re writing a book or dissertation

