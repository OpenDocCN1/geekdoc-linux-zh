    # ### DAILY JOURNAL


    Write down the system-related events of the day (system-related only, please –
    keep your personal feelings for that cute coworker to yourself). A system journal
    enables you to keep track of trends in system failures, suspicious activity, and
    performance. It’s also a helpful resource if you turn in status reports on a regular
    basis. Your records can reflect the little details that might slip your mind when
    management is hammering you for answers after a system failure!


    # ### RECORDING INCIDENTS


    Any time something goes wrong (power failures, file corruption, an intruder scans
    your network, and so on), make a record of it. This record is vital, especially
    if the'
