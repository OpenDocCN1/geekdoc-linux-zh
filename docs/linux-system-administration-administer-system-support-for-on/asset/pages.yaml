- pgno: 24
  md: '# Introduction


    LINUX is a freely distributed UNIX-based operating system that can run on several
    different architectures: the 80x86 architecture for PCs, the Macintosh m68000
    and the Power Macintosh, the PowerPC, DEC Alpha, and SPARC microprocessor-based
    systems.


    # Supporting Linux


    Linux is licensed under the GNU General Public License, which means the source
    code must be freely available, even if the distribution of the software is not.
    Several distributions of Linux are available for the x86 architecture — including
    Slackware, Debian/GNU, and Red Hat. Some commercial licenses allow free distributions;
    others are more restrictive. Please check your license before you redistribute
    any software.


    If you decide to download an “unsupported” version, remember that a strong user
    community on the Internet is willing to support the operating system and its applications
    as a token of goodwill. Two good newsgroups are comp.os.linux.setup and comp.os.linux.x.
    I’ve obtained a working Xfree86 configuration file with the support of comp.os.linux.x.
    Also, plenty of Web sites are devoted to providing Linux information. You are
    not alone.


    Many people have developed programs for Linux as freeware, shareware, or commercial
    distributions. You can find everything from business to networking software. If
    you’re looking to write your own programs, many different development environments
    come with Linux distributions or are available to download. As a Linux user or
    administrator, you can also offer contributions to a range of ongoing projects
    such as ATM, Plug and Play, and multiprocessor support.


    For either personal or business use, Linux can be a low-cost alternative to other
    PC-based operating systems. If you need to use binaries that are created for other
    operating systems, plenty of emulators are available — for systems that range
    from the Atari 2600 to Windows, the Hewlett-Packard HP 48SX, and the HP 48G.


    # Examining Linux


    Linux will run on your home PC, either by itself or in a dual-boot mode with Windows
    95, Windows NT, BeOS, or OS/2. If your computer has the cyber equivalent of multiple
    personalities, you can run all the operating systems on the same computer. For
    the sake of simplicity, however (not to say sanity), most system administrators
    prefer one operating system per computer.'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'The following are common file systems Linux currently recognizes as partitions:


    +   - DOS

    +   - Windows 95

    +   - OS/2 HPFS

    +   - OS/2 Boot Manager

    +   - Novell NetWare

    +   - XENIX

    +   - AIX

    +   - BSD/386

    +   - BSDI

    +   - CP/M

    +   - Minix


    One of the advantages of Linux is its extensive file support for systems that
    range from Minix to OS/2 to Windows 95 (or Joliet). Also, you can see the "other"
    partition from the Linux side – a nice feature when you''ve got files you need
    to access on both partitions. It''s also nice to do UNIX commands on a non-UNIX
    file structure. Linux also has its own boot manager: the Linux Loader or LILO.


    Linux is a flexible environment; you can run it on a single-user workstation or
    as an application server or a firewall on a network. There are plenty of applications,
    both freeware and commercial, for Linux. You can download some of the software
    directly off the Internet, or contact the vendors to purchase commercially available
    software.


    Whether you have a multitude of users using one PC or it''s just you, you have
    much more control with Linux. The kernel can be modified to fit your needs without
    any backlash, depending on what you''re doing – users can have distinct environments
    without interfering with each other, and Linux bundles its own excellent tools
    for system administration.


    Even so, if you don''t find the tools you need for your system – and your program
    – you can create your own. Most Linux distributions include C and C++ (with or
    without ELF and a.out libraries), Shells (including bash and zsh, Perl, Tk/TCL),
    and converters that can handle languages from Fortran and Pascal to C. Even the
    Java Development Kit is ported to Linux.


    If that''s not enough to convince you Linux is a great way to go, consider its
    extensive networking capabilities. Linux has PPP and ISDN support, ATM drivers
    (which are experimental at this time), TCP/IP (including IP masquerading and IP
    forwarding), and even AppleTalk drivers. And of course, Linux has its own'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'windowing system: Xwindow system, available through the Xfree86 distribution
    included on the accompanying CD-ROM.


    A number of hardware manufacturers make "Linux-friendly" hardware (compatible
    with systems in which Linux is already installed) or have appropriate drivers
    readily available. With a strong user community and a variety of distributions
    available, Linux is a realistic alternative to other PC operating systems.


    As with many UNIX operating systems, if you aren''t already familiar with UNIX,
    you do have some learning curves to master--but if you''re willing to learn and
    you''re not afraid to boss your computer from the command line, you''ll be fine.
    Although UNIX and its derivatives (including Linux) can hardly be called user-friendly,
    they are touted as being "expert-friendly." In response to the popularity of Windows
    95/98, Linux and other UNIX systems have included more stable support for graphical
    user interfaces (GUIs) and easier installation procedures.


    # # Examining System Administration


    As a commitment of time and energy, system administration can be anything from
    a hobby to a full-time job. When I started using Linux, I performed system administration
    as a hobby, administering my own PC at home without any formal training or corporate
    necessity. Later, however, I took on system administration as a full-time job--which
    usually means working with multiple systems and various applications. Either way--whether
    you''re dealing with a one-computer system or an enterprise-wide behemoth--system
    administration requires a range of skills. You work not only with hardware and
    the operating system, but also with the people who use them, misuse them, and
    complain about them.


    As a system administrator, you babysit a system to make sure it''s running properly,
    field questions from people about their applications, shells, or e-mail, and monitor
    security--sometimes all at the same time.


    As the capabilities of the Web expand, bringing new opportunities and dangers
    to your network, your role as a system administrator grows and diversifies. You
    are responsible for securing and maintaining your system, controlling the state
    of the system, ensuring file integrity, and protecting that investment of time
    and money with regular backups. You may become more of an all-purpose expert as
    you administer your system. Fortunately, Linux is expert-friendly; it may be exactly
    what you need.'
  merge: -1
  img_proc: true
