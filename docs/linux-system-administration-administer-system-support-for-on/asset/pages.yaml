    The /usr/bin and /usr/local/bin directories contain many files that both the system
    administrator and the network team must use. Most such files are local to a specific
    UNIX operating system (such as Linux) or to a particular host.


    # ## Symbolic Links


    One way to make system administration easier is to create a symbolic link in any
    directory already in the user’s path. This means you won’t have to edit every
    single user’s path whenever the users need to access new tools.


    Say you have placed a directory for Secure Shell in /opt/security/ssh-1. 2.25.
    If you want users to have access to run it, make a symbolic link from the file
    /opt/security/ssh-1.2.25/ssh to /usr/local/bin/ssh. Doing so avoids adding directories
    to the path; all the users need do to run Secure Shell is type ssh at their prompts.


    This technique also eases the process of upgrading. If you already have symbolic
    links in place, simply remove them and recreate them to the new executable. (If
    your upgraded executable doesn’t work, you can always recreate the link back to
    the old one.) The following commands demonstrate how easy such an upgrade can
    be:


    ```

    #  rm /usr/local/bin/ssh

    #  ln -s /opt/security/ssh-1.2.26/ssh/usr/local/bin/ssh

    ```


    When the next version of Secure Shell is released, you can install it in its new
    directory, relink to the new Secure Shell, and remove the old version when the
    new one is ready. This practice can work well for any software packages you install,
    especially if you frequently upgrade them or have multiple versions. Symbolic
    links also help when securing a system; you can limit your users’ paths to certain
    key directories and link in only the necessary executable files.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_147_0.png)'
