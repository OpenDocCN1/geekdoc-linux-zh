    # Cleaning Up After an Attack


    If your system has been attacked, use your log files from syslog and Tripwire
    to determine where the hole is, plug it, and restore from the most recent time
    *before* the attack. Restoring from a time after the attack would ignore the risk
    that an attacker may have left some new back doors during the attack. If that
    did happen, then plugging the original security hole would do no good.


    If you run into any Slackware specific security problems, please be sure to notify
    BUGTRAQ and Patrick Volkerding, the creator of Slackware. Otherwise notify the
    software author or company that has had the particular security gap exploited.


    # Restoring Backups


    If a hacker has totally trashed your system, and you know where you want to restore
    from, mount the backup data and untar the file, as shown in the following code
    listing.


    ```

    # mount /dev/tape /tapdrive # cd /tapdrive # ls full_backup_1July99.tar # cp full_backup_1July99.tar
    / # umount /tapdrive ; cd / # tar -xvf full_backup_1July99.tar

    ```


    The procedure shown here fully restores the backup from July 1, 1999. Keep in
    mind, however, that it may take a significant time to run, depending on the amount
    of data you''ve backed up. Backing up 100 megabytes to a parallel-port Zip disk
    takes about 15 minutes. A tape may be faster, copying data at about two megabytes
    per second.


    Also, if your system has been completely compromised, the safest approach may
    be to reinstall the operating system before you replace your data. Simply unpacking
    your backup media would leave in place any files recently added to the OS. These
    additions may be hard to notice, especially if the attacker has tampered with
    your logs. Formatting your hard drive and reinstalling the OS is an excellent
    way to wipe clean your system''s past life (including past infections) and start
    anew.'
