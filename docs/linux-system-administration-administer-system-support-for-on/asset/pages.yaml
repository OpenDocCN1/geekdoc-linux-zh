    # Network Insecurity Files


    UNIX operating systems, including Linux, are extremely trustworthy – in the technical
    sense – but you may have to curtail the system''s eagerness to trust other systems.
    Some UNIX files enable your network to trust other hosts, even without passwords.
    They are the `.rhosts` and the `/etc/hosts.equiv` files.


    All such files function in much the same way: They trust a host (and possibly
    a user) on the basis of name alone. The `.rhosts` file is found in user accounts,
    where the `/etc/hosts.equiv` applies these rules system-wide.


    The syntax for these files is simple:


    ```

    trustedhost trusteduser

    ```


    If you want to trust all the hosts, place a plus "+" where the hosts go; if you
    want to trust all users, place a plus "+" in the users'' field.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_386_0.png)


    Under no circumstances should you put a `.rhosts` with "+" or "*+*" in the root
    directory. This also applies to the `/etc/hosts.equiv`.


    Suppose you find a file on your system in a user''s home directory that looks
    like this:


    ```

    tigerlair stripes

    myopia +

    + bob

    ```


    Apparently this user is not prompting user *stripes* on the host *tigerlair*.
    He is also allowing anyone from the *myopia* host on his account – and letting
    anyone with the username *bob* have access to his system – without prompting for
    passwords. Big trouble lurks in these three lines of code.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_387_0.png)


    If you must have a .rhosts or /etc/hosts.equiv files, don''t trust everyone! Explicitly
    state which host and which user is being trusted. Generally you''re better off
    running Secure Shell in the first place, instead of allowing such open trust with
    .rhosts or /etc/hosts.equiv that can easily be spoofed.


    # # Linux on a Network


    On a network, there are many hosts and network devices. Network devices include
    routers, switches, bridges, modems, firewalls, and hubs. These particular devices
    control the flow of traffic on a network. They can also sometimes decide on what
    type of traffic is allowed in and out of a network. For the most part, Linux systems
    on networks are hosts: computers without any networking decisions. However, Linux
    can be used as a router or a firewall, which are devices that control network
    traffic.


    # ## Linux Routers


    In addition to being a host on a network, Linux can also become a router. A router
    is a computer that decides how traffic is going to go from one network to another.
    Routers can be hardware specific computers like CISCO and Bay Networks products,
    or they can be any computer with at least two network interface cards.


    Though these commands are useful for setting up networking on a Slackware host,
    they are the main commands used for a router.


    With the route command, you can display or change the routing table. The route
    command is useful with creating network paths on a gateway host. Take a look at
    the following routing table:


    ```

    ```

