    # System Initialization


    At bootup, the system is initialized through the script `/etc/rc.d/rc.S`. This
    script starts up swapping, mounts the file systems, configures the system clock,
    loads modules, and possibly the PCMCIA and serial services. If you want a specific
    event to happen while the system boots (for example, running a PPP connection),
    you can add it to the end of this script, as shown in Listing 7-5.


    Listing 7-5: Using /etc/rc.d/rc.S


    ```

    ```

    #!/bin/sh

    #

    # /etc/rc.d/rc.S:  System initialization script.

    #

    # Mostly written by:  Patrick J. Volkerding. <volkerdi@ftp.cdrom.com>

    #


    PATH=/sbin:/usr/sbin:/bin:/usr/bin


    # enable swapping

    /sbin/swapon -a


    # Start update.

    /sbin/update &


    # Automatic module loading.  To load and unload kernel modules

    # automatically as needed, uncomment the lines following to run kerneld.

    # In some cases, you''ll need to create aliases to load the correct

    # module.  For more information, see the docs in /usr/doc/modules.

    # NOTE: This is commented out by default, since running kerneld has

    # caused some experimental kernels to hang during boot.

    #if [ -x /sbin/kerneld ]; then

    #      /sbin/kerneld

    #fi


    # Test to see whether the root partition is read-only; it should be.

    ```

