  img_proc: true
- pgno: 81
  md: "# Which Backup Medium Should I Use?\n\nNumerous IT shops use tape backups.\
    \ The medium is really good for storing a flexible amount of data, appropriate\
    \ for both incremental and full backups, and relatively low-cost. The downside\
    \ is that tape is a slow way to back up your Slackware system.\n\nIomega Jaz drives\
    \ and external hard drives are good for full backups. However, the medium is expensive\
    \ and this isn't the best for incremental backups unless you plan on using the\
    \ same disk for multiple backups. Also, keep in mind that the Jaz drive is only\
    \ available for those with SCSI controllers.\n\nOn the other hand, the Iomega\
    \ Zip drive stores only 100 megabytes, which is good for small incremental backups,\
    \ but not practical for full backups – unless you like changing disks in the middle\
    \ of the night. Several other products have the same benefits and drawbacks –\
    \ such as Syquest cartridges and 1.44MB-compatible floppy drives that store approximately\
    \ 120 megabytes of data.\n\nWritable CD-ROM drives are the new way to back up\
    \ data. Media can be about $1 per CD for rewritable discs, about $20 per discs.\
    \ Although the discs themselves are relatively cheap the cost of the drives is\
    \ high – approximately $300 per drive for CD-writable (CD-R), and over $500 for\
    \ rewritable (CD-RW) drives. The other problem is capacity: only 650 megabytes\
    \ of data per disc. Also, keep in mind that backing up to a CD-R or CD-RW is not\
    \ a straightforward process. You can back up faster with tapes and other removable\
    \ media; for the time being, you're better off not using a CD-R or CD-RW for that\
    \ purpose.\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_81_0.png)\n\nBacking up\
    \ your system is a s—I—o—w process. This task should be added to cron and run\
    \ overnight after the procedure for doing so is tested.\n\nWhen you have a procedure\
    \ set up and tested, label your tapes, and schedule a full backup intermittently.\
    \ Be sure to schedule incremental backups regularly. Here's an example of such\
    \ a schedule:\n\n+   Incremental\t\t\tDaily, hold tapes for 7 days\n+   Full\t\
    \t\t\t\tWeekly, hold tapes for 1 month\n\nThis means you would have seven tapes\
    \ for incremental backups and four tapes for full backups. If you wanted to recover\
    \ a week-old file, you could go to the incremental backup. If you wanted to recover\
    \ a two-week-old file, you'd go to the"
