- pgno: 110
  md: 'The `t` command in `fdisk` tells Linux you want to redefine the new partition.
    The code, in hexadecimal notation, is `82`. This changes the partition to `swap`.


    ```

    ```

    Command (m for help): p


    Disk /dev/hda: 128 heads, 63 sectors, 525 cylinders

    Units = cylinders of 8064 * 512 bytes


    Device    Boot    Begin     Start     End     Blocks  Id  System

    /dev/hda1        1         127      512032+   83  Linux native

    /dev/hda2       128       128      254      512064   83  Linux native

    /dev/hda3       288       288      525      959616   83  Linux native

    /dev/hda4       288       288      525      959616   82  Linux swap

    ```

    ```


    From here, you can see that the swap space has been defined. Save the partition
    table.


    ```

    ```

    Command (m for help): w

    The partition table has been altered!


    Calling ioctl() to re-read partition table.

    Syncing disks.


    WARNING: If you have created or modified any DOS 6.x partitions, please see the
    fdisk manual page for additional information.

    ```

    ```


    You can ignore the warning, as this is only the Linux part of the computer you
    are modifying.


    Next, you''ll want to add your partition to the `/etc/fstab` file. In my case,
    I add this line:


    ```

    ```/dev/hda4        swap      swap       defaults 1 1```

    ```


    Then you want to make the swap space and turn it on. Do so by issuing the commands
    `mkswap` and `swapon`.


    ```

    ```

    # mkswap /dev/hda4

    # swapon -a

    ```

    ```


    These commands activate the swap partition. If you ever want to deactivate it,
    issue the following command:


    ```

    ```

    # swapoff -a

    ```

    ```


    The `-a` option affects all the swap partitions in the `/etc/fstab` file.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# # Modifying Swap Space


    If you want to change your existing swap space, reverse the process you performed
    to add swap space. If you want to modify your swap space, turn off the swap using
    the swapoff command:


    ```

    # swapoff -a

    ```


    The -a option affects all the swap partitions in the /etc/fstab file. Next, go
    into the /etc/fstab file and remove the partition if you are removing your swap
    space from the current partition it’s on.


    If you are shrinking or enlarging its current partition (this also includes deleting
    it), you’ll want to go into disk, delete the partition, and re-create one. This
    time, specify how much space you want in the swap partition. You’ll also need
    to re-define this space as swap, edit the /etc/fstab file, and turn on the swap
    using swapon -a.


    If you are adding a new disk and want to add swap space from it, create a new
    partition like the first one – no need to put all your swap space in one partition.


    # # Summary


    In this chapter, the Slackware file system structure is covered. Not only is the
    inode, which is the heart of the file system discussed, but links and directory
    structure is also covered. If you have used other varieties of UNIX, you can see
    that the common directories such as /dev, /etc, and /usr are there. Nonetheless,
    Slackware Linux does place logs and other files in completely different places
    than other UNIX varieties.


    With files, it’s also important to be able to identify the type of file. You can
    do this sometimes with ls -1. A better tool is the file command. This will identify
    many types of files including devices, sockets, directories, symbolic links, and
    executables.


    Disk management involves planning not only for applications and users, but also
    to have enough log space for them. You can partition your disk into sections to
    accommodate specific directories such as /home, /var, or /usr. You can also add
    and remove disks, or create links to other partitions, which might have some temporary
    space.


    To keep user accounts from eating up your disk space, you can impose disk quotas,
    which can also be used for accounting purposes. Many ISPs use quotas to charge
    their customers for specific amounts of disk space on their UNIX accounts.


    If you have enough disk space, you can create swap partitions that enable your
    RAM to switch processes from memory to temporary hard-drive space and back.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# # Chapter 4

    # Devices and Peripherals


    # ## IN THIS CHAPTER


    +   - Examining disk drives

    +   - Using unique files

    +   - Mounting devices

    +   - Exploring peripherals

    +   - Using drivers


    THIS CHAPTER FOCUSES on all those aspects of your system that may require quite
    a bit of tweaking to get them working properly – in particular, how Linux interacts
    with your diverse PC hardware and peripherals. Many hardware companies don’t officially
    support Linux; although this is changing every day, you may have to turn to newsgroups
    and the Internet to find the most up-to-date information on device drivers that
    work well with Linux. You may be surprised, however, at just how many device drivers
    and accompanying instructions are provided with the Slackware disks you’ve just
    installed.


    Although current PCs come with IDE controllers and CD-ROM drives as standard equipment,
    high-performance software for such devices as scanners, fast hard disks, and CD-ROM
    drives may require a SCSI interface. If you have a variety of advanced hardware,
    you may find yourself flipping jumper settings manually and tinkering with drivers
    before everything is working just right. Therefore this section explains the procedures
    for connecting a variety of devices to your Slackware system. Keep in mind that
    the storage devices and peripherals listed here are only a sample of what’s out
    there; as the well-known Net phrase has it, “your mileage may vary.”


    # ## Disk Drives


    A computer comes with different disk drives. For example, it probably came with
    a 1.44 MB floppy drive; some older computers have 1.2-megabyte floppies. Others
    may have multiple floppy drives. Most computers today come with CD-ROM drives;
    others have built-in Iomega Zip drives, and others have writable and rewritable
    CD drives.'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'Any UNIX operating system, including Slackware Linux, recognizes your drives
    as device files. This means you can write to such a file, execute it, and read
    it, just as you would any other file in UNIX.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_113_0.png)


    To get the most drive support, be sure to recompile the kernel with the appropriate
    options.


    # SCSI Versus IDE


    Here we go—wading into the "religious" debate about hardware—though not too far.
    I can say my system runs just fine on IDE; you can do a great deal more with SCSI,
    partly because SCSI drives enable you to daisy-chain up to eight drives. SCSI
    performance is noticeably better than that of IDE, and many types of media are
    available for SCSI but not for IDE—including optical drives, lomega Jaz drives,
    and some higher-performance CD-Rs and CD-RWs.


    That said, both types of hardware have advantages and disadvantages. IDE is usually
    easy to configure, well supported, and cheap. SCSI is fast, usually difficult
    to configure, and generally works extremely well. IDE supports about four devices
    at a time; SCSI supports six to eight. Although some more advantageous hardware
    is available on SCSI, generally you can get along just fine with IDE.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_113_1.png)


    Because many computers come with an IDE drive as standard equipment, I take an
    IDE-oriented approach to this chapter.


    # Drive Locations


    On any variety of UNIX, including Slackware Linux, your hardware is recognized
    as a collection of files. Most of these files are listed in the /dev directory.
    This section covers a sampling of what you may find.


    # ADVANCED POWER-MANAGEMENT BIOS


    The following shows the advanced power-management BIOS. It''s a great feature
    for laptops, as it suspends the CPU if idle and shuts down the power after running
    the shutdown command.


    ```

    crw-r--r-- 1 root root 10, 134 Jun 7 1996 apm_bios

    ```'
  merge: -1
  img_proc: true
