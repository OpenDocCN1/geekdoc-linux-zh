    /etc/ fstab. To mount a device, use the mount command with the -t option.


    The /etc/fstab file looks something like this:


    ```

    /dev/hda1      /       ext2       defaults      1      1

    /dev/hda2      /usr    ext2       defaults      1      1

    /dev/hda3      /var    ext2       defaults      1      1

    /dev/hdc       /cdrom  iso9660    ro            0      0

    none           /proc   proc       defaults      0      0

    ```


    The command resembles this example:


    ```

    mount -t filetype device directory

    ```


    Thus, if you wanted to mount a CD-ROM, you could use the following command:


    ```

    # mount -t iso9660 /dev/cdrom /cdrom

    ```


    This specific command mounts an ISO 9660-format CD-ROM to the directory /cdrom.
    If a different device is already on /cdrom, it''s hidden until the device /dev/cdrom
    is unmounted.


    If you want to make the file systems mount simultaneosly, use the -F option with
    -a. This form of the command causes the mount processes to fork. Consider the
    following command:


    ```

    # mount -a -F -t msdos

    ```


    This particular mount command forks the mounts of all file systems that correspond
    to the type msdos in the /etc/fstab. Though the command mounts all file systems
    of the specific file type simultaneously, it does have limitations. In particular,
    you cannot use -F to mount two directories that are dependent on each other. An
    example would be two partitions, one on /usr and the other on /usr/bin- sorry,
    mount won''t do it.


    You can, however, mount the system as read-only or read-write. To do so, pass
    the options -o ro or -o rw as shown here:


    ```

    # mount -o ro /dev/fd0 /floppy

    ```


    This command mounts the floppy drive as read-only. If you want to include other
    options when you mount a device, you can. If, for example, you want to let your
    users mount a device as read-only, you can do so with the -o option. The -o option
    is a handy way to add other options; you can also put them into the /etc/fstab
    file in the fourth field.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'The defaults for mounting a device are `rw`, `suid`, `dev`, `exec`, `auto`,
    `nouser`, and `async`. If you want to enable the defaults, pass the option `defaults`.
    The following command uses the `-o` option to do so:


    ```

    # mount /dev/hda2 -o defaults

    ```


    If you need to mount file systems that are already mounted, you can use the `remount`
    option to do so. It’s a handy capability if you’re changing a mount flag (`ro`,
    `user`, and so on) on a particular file system. Table 4-2 lists mounting types
    and options.


    # TABLE 4-2 MOUNTING OPTIONS


    | Mounting Type | Should be done | Shouldn''t be done |

    | :--- | :---: | :---: |

    | Mount files synchronously? | `sync` | `async` |

    | Mount file as writable? | `rw` | `ro` |

    | Update inode access time? | `atime` | `noatime` |

    | Mount with -a option? | `auto` | `noauto` |

    | Is it a character or block device? | `dev` | `nodev` |

    | Need to be root? | `nouser` | `user` |

    | Allow SUID bits? | `suid` | `nosuid` |

    | Execute binaries? | `exec` | `noexec` |


    The computer recognizes floppy drives without adding any drivers to the kernel.
    Currently, 1.2MB and 1.44MB drives are supported—but expect the support for 1.2MB
    drives to go away soon; new PCs don’t use them.


    Floppy-drive device files are noted by `fd`. For example, the first floppy drive
    on your system is `/dev/fd0` (Slackware Linux counts the same way arrays are counted
    in C—starting with zero). The second floppy drive would be `/dev/fd1`, and so
    on.


    # ## Floppy Drives


    If you want to use your floppy drive after installing Linux, you have only a few
    steps to take:


    +   1. Become root.

    +   2. Make a directory in which to mount the floppy drive.'
  merge: -1
  img_proc: true
- pgno: 128
  md: '+   3. Stick in the disk.


    +   4. Mount the directory.


    I have one floppy drive, so I can show you the steps I go through to mount it
    on a Linux system. First, to look at what''s already mounted, use the mount command.


    ```

    # mount

    /dev/hda1 on / type ext2 (rw)

    /dev/hda2 on /home type ext2 (rw)

    /dev/hda3 on /opt type ext2 (rw)

    none on /proc type proc (rw)

    ```


    Look - no floppy drive mounted (you can''t see /dev/fd0 on the list of drives).
    If I''m mounting the drive for the first time, I would have to create a directory
    to serve as a mount point for the floppy drive (say, one creatively called /floppy).
    You can call your drive whatever you want - /dosa (since the drive is recognized
    as msdos file format), /fred, /mom - and our practical example looks like this:


    ```

    # mkdir /floppy

    ```


    When you''ve created the directory, mount the drive:


    ```

    # mount /dev/fd0 /floppy/

    ```


    If it mounts properly, you won''t see any error messages and you''ll return to
    the prompt. If you want to double-check to see whether your drive mounted properly,
    type the mount command again. The result would resemble the following snippet:


    ```

    # mount

    /dev/hda1 on / type ext2 (rw)

    /dev/hda2 on /home type ext2 (rw)

    /dev/hda3 on /opt type ext2 (rw)

    none on /proc type proc (rw)

    /dev/fd0 on /floppy type msdos (rw)

    ```


    The drive is mounted; if you do an ls on the /dev/fd0 next, here''s what you get:


    ```

    # ls /dev/fd0

    /dev/fd0

    ```


    Not much. What you need to do is an ls on the mount point - in this case, /floppy,
    as follows:'
  merge: -1
  img_proc: true
- pgno: 129
  md: '```

    # ls /floppy/

    abba.txt b-52s.txt cheap-trick.txt fleetwood-mac.txt


    ```


    The contents of the disk in the floppy drive show up. If you have the appropriate
    permissions, you can read, write, and execute (move or remove) the files.


    When you''re done using the floppy drive, be sure to unmount the drive before
    you remove the disk.


    ```

    # mount /floppy


    ```


    # CD-ROM Drives



    Because you most likely installed Slackware Linux from a CD-ROM drive, you know
    that Slackware supports most CD-ROM drives. A CD-ROM drive is mounted as read-only;
    you cannot write to it, even as root. If your system needs a writable CD-ROM drive,
    refer to the "Extra Storage Drives" section.


    Your CD-ROM driver should be built into your kernel. In most of the Slackware
    installations I''ve seen, the CD-ROM drivers are on the /dev/hdc drive for ATAPI
    and IDE. (This location varies on specific hardware setups—for example, my CD-ROM
    is the slave drive on the secondary controller, /dev/hdd.) You can put your CD-ROM
    nearly anywhere on your controller card, except where the floppy controller should
    be.


    No matter what, the CD-ROM is recognized on the file /dev/cdrom.


    If we take a long listing of the /dev/cdrom file, we get:


    ```

    # ls -l /dev/cdrom

    lrwxrwxrwx 1 root    root    8  Jun 16 20:24 /dev/cdrom -> /dev/hdc


    ```


    The file is always a symbolic link to the drive it''s on, whether IDE or SCSI
    device. In this case, it''s on /dev/hdc, the first drive on the secondary IDE
    controller.


    # Extra Storage Drives



    Having a CD-ROM, floppy drive, and a hard drive is not enough. Sometimes you''ll
    want to backup files or transport large amounts of data to removable media. For
    this, you can configure Zip drives, Jaz drives, CD writable drives, or external
    hard drives.


    # ZIP AND JAZ DRIVES



    Known support is available for Zip and Jaz drives, but remember that some of their
    most basic characteristics can affect your choice. Jaz drives for example, are
    SCSI—they can''t run through a parallel port because parallel ports don''t have
    the throughput. Zip drives, however, are available in three different versions:
    parallel port, SCSI, and IDE—but the IDE version is only available as internal
    hardware. This means it won''t work for a laptop and you have to install the drive
    yourself.'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'For Zip and Jaz drives, you would add SCSI support in your kernel. Zip drives
    are fussy, they require that you have the kernel support for SCSI, SCSI drives,
    and for the Zip drive. The mount point, at least, is straightforward: /jaz works
    well for the Jaz drive. For a Zip drive, you might want to use /zipdrive or /i\_zip
    to avoid confusing the drive name with the Zip command that compresses files.


    You would mount a Jaz drive the same way you’d mount any other SCSI drive. To
    mount a Zip drive, however, add an entry to the /etc/fstab. Your entry should
    look like this:


    ```

    /dev/sda4 /zipdrive msdos defaults 0 0

    ```


    To mount the drive, you would then use the mount command:


    ```

    # mount -t msdos /dev/sda4 /zipdrive

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_130_0.png)


    Parallel port Zip drives are located on the device file /dev/sda4, and Linux won’t
    let you change this setting.


    # WRITABLE CD DRIVES (CD-R AND CDR-W)


    What seemed far off in the future is now here: CD writable drives – in two types:
    CD-R and CD-RW. *CD-R* is a CD-wRitable drive; *CD-RW* is a CD-ReWritable drive.
    The latter drive and its media are slightly more expensive – but you can reuse
    the media. Both types of drives are available as IDE or SCSI.


    If you have a CD-R or CD-RW, it’s still a good idea to keep your primary CD-ROM
    drive. CD-ROMs are needed to install the operating system, and if the system doesn’t
    recognize your CD-R’s proprietary SCSI card or unique architecture, you’ll have
    a hard time getting the software off the CD-ROM and onto your hard disk. (If your
    CDR is connected via IDE or a standard SCSI card, you shouldn’t have compatibility
    problems, but a word to the wise saves headaches.) If you’re pressed for time,
    note that non-writable drives read CDs much faster than the others; why wait around
    for 6x-speed CD if a 12x or 24x speed is available?


    Mounting with the CD-R or CD-RW is similar to mounting a read-only CD-ROM drive,
    with a nice exception: You won’t be getting messages telling you the disc is read-only.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_130_1.png)


    Slackware 3.5 offers the up-to-date amenity of support for CD-R drives from Philips,
    IMS, Kodak, Yamaha, and Hewlett-Packard (or compatible equivalents).'
  merge: -1
  img_proc: true
- pgno: 131
  md: "Software for CD-R drives are available at the following sites:\n\n    ftp://tsx-11.mit.edu/pub/linux/packages/mkisofs/mkisofs-1.10.tar.gz\n\
    \    ftp://sunsite.unc.edu/pub/Linux/utils/disk-management/cdwrite-2.0.tar.gz\n\
    \nYou can find an X-based toolkit called X-CD-Roast at this site:\n\n    http://www.fh.muenchen.de/home/ze/rz/services/projects/xcdroast/e_overview.html.\n\
    \n# **TAPE DRIVES**\n\nThese are great for backup and large storage. They are\
    \ slow, but they can store lots of data —gigabytes upon gigabytes. Supported drives\
    \ include QIC drives 40, 80, 3010, and 3020-compatibles. Linux supports them through\
    \ the floppy drive controller. SCSI tape drives are another creature — namely,\
    \ the floppy controller tape drives, or *ftape*.\n\nThe following list shows the\
    \ floppy tape drive device files:\n\n```\n```\ncrw-r-----  1 root  disk  27. \
    \ 0 Jul 17  1994 rft0\ncrw-r-----  1 root  disk  27.  1 Jul 17  1994 rft1\ncrw-r-----\
    \  1 root  disk  27.  2 Jul 17  1994 rft2\ncrw-r-----  1 root  disk  27.  3 Jul\
    \ 17  1994 rft3\n```\n```\n\nThe first such drive shown in the list is symbolically\
    \ linked to /dev/ftape.\n\n```\n```\nlrwxrwxrwx  1 root  root  4 May  4 14:25\
    \ ftape -> rft0\n```\n```\n\nIf you need to change your link, do this as root:\n\
    \n    # rm /dev/ftape\n    # ln -s /dev/rft# /dev/ftape\n\n    (where # is 1,\
    \ 2, or 3).\n\nAlso, be sure to recompile the kernel with tape-drive support included.\n\
    \n![](img/8ad518fddafc7f5e73715a2604b61d50_131_0.png)"
