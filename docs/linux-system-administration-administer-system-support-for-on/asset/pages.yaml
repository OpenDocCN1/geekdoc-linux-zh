  img_proc: true
- pgno: 224
  md: 'Unless you''re making a boot floppy, use 1 to install LILO on your hard drive.
    However, watch out for problems with multiple boot operating systems (such as
    Windows95/98 or DOS).


    The following screen appears next:


    ```

    SELECT LILO TARGET LOCATION


    LILO can be installed to a variety of places:


    1. The Master Boot Record of your first hard drive


    2. The superblock of your root Linux partition (which could then be made the bootable
    partition with fdisk)


    3. A formatted floppy disk


    If you''re using a boot system such as OS/2''s Boot Manager, you should install
    LILO on the superblock of your root Linux partition.


    Please pick a target location (1 - 3): 1

    ```


    Unless you''re making a boot floppy, use 1 to install lilo on your hard drive.
    However, watch out for problems with multiple-boot operating systems (such as
    Windows95/98 or DOS).


    You will then see this screen:


    ```

    CHOOSE LILO DELAY


    How long would you like LILO to wait for you to hit left-shift to get a prompt
    after rebooting? If you let LILO time out, it will boot the first OS in the configuration
    file by default.


    1 - None, don''t wait at all - boot straight into the first OS


    2 - 5 seconds


    3 - 30 seconds


    4 - Present a prompt and wait until a choice is made without timing out


    Which choice would you like (1 - 4)? 4

    ```


    Common sense tells you to use none unless you''re doing a multiple boot. If you''re
    using LILO for a boot manager, pick 3 or 4 (this enables you to correct typos).


    Next, LILO will bring you back to the main menu. Either add another partition
