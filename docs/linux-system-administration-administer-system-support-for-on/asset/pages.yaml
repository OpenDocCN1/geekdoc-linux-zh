    # Configuring the Server


    When you have it up and working, it''s time to configure the server; handily,
    most of the server defaults are already enabled. Your configuration files are
    located in /var/lib/httpd/conf. Your configuration files are as follows:


    ```

    # ls /var/lib/httpd/conf

    access.conf httpd.conf mime.types srm.conf-dist

    access.conf-dist httpd.conf-dist srm.conf

    ```


    So, when you''re configuring access to the server, you''ll want to edit the access.conf
    file. Consider this example:


    ```

    # access.conf: Global access configuration

    # Online docs at http://www.apache.org/

    ```'
