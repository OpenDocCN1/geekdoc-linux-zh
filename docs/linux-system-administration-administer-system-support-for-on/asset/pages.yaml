- pgno: 108
  md: '# Swap Space


    If you have kids, what do they do when they clean up their rooms? They shift the
    mess from the floor to everywhere else – the closet, desk drawers, under the bed.
    In a sense, swap space works the same way.


    If you are using `gcc`, X-Window, or any other resource-intensive applications,
    your system will slow considerably unless you use **swap**. As a child would do
    when he’s done with a toy – throwing it in the closet and taking out another to
    play with – Slackware Linux moves the stuff it’s not using to hard drive storage
    freeing memory for other programs it is currently using. So, Linux is putting
    away one toy and taking out another. However, if you have a lot of RAM, you may
    not need swap space because the memory can move around in itself, as opposed to
    using disk space.


    # Creating Swap Space


    Before you add your swap space, decide how much you need. If you have 64 megabytes
    or less, double that amount and allocate it for swap space. For example, my PC
    has 32 megabytes of RAM, so, I’ve allocated 64 megabytes of swap space.


    To create swap space, go into `fdisk` and add it. I’ll use my computer as an example.


    > **TIP** For initially configuring swap space, configure your other partitions
    first; and your swap space last. That way you have your partitions in numerical
    order (1, 2, 3, and so on), without skipping any.


    So, we’ll run `fdisk` on my computer, which will default to using `/dev/hda`.


    ```

    # fdisk

    Using /dev/hda as default device!

    ```


    Now, let’s look at the partition table. This shows everything that the `df` command
    does (except how much space is being used on each disk), and it also displays
    the swap space.


    ```

    Command (m for help): p


    Disk /dev/hda: 128 heads, 63 sectors, 525 cylinders

    Units = cylinders of 8064 * 512 bytes

    ```'
  merge: -1
  img_proc: true
- pgno: 109
  md: "Device   Boot    Begin     Start       End     Blocks    Id    System\n/dev/hda1\
    \             1         1       127      512032+  83    Linux native\n/dev/hda2\
    \           128       128       254      512064   83    Linux native\n/dev/hda3\
    \           288       288       525      959616   83    Linux native\n\nGreat.\
    \ We still have cylinders 288 to 525 left for swap space. This is somewhere around\
    \ 120 megabytes. To create a swap partition, we need to create a new partition\
    \ in much the same way we did while creating the file system.\n\n```\nCommand\
    \ (m for help): n\nCommand action\n   e   extended\n   p   primary partition (1-4)\n\
    p\nPartition number (1-4): 4\nFirst cylinder (255-525): 255\nLast cylinder or\
    \ +size or +sizeM or +sizeK ([255]-287): 287\n```\n\nWe can use the rest of the\
    \ disk space for swap space, even though it's over the 64 megabytes I want for\
    \ 32 megabytes of RAM. The amount required varies from system to system. Some\
    \ applications don't need all that swap space, but if you're using many applications\
    \ with little memory, swap space can make your performance a little better.\n\n\
    We'll print out the partition table again to see that the new partition, /dev/hda4,\
    \ has been created. Here's what it looks like:\n\n```\nCommand (m for help): p\n\
    \nDisk /dev/hda: 128 heads, 63 sectors, 525 cylinders\nUnits = cylinders of 8064\
    \ * 512 bytes\n\nDevice   Boot    Begin     Start       End     Blocks    Id \
    \   System\n/dev/hda1             1         1       127      512032+  83    Linux\
    \ native\n/dev/hda2           128       128       254      512064   83    Linux\
    \ native\n/dev/hda3           288       288       525      959616   83    Linux\
    \ native\n/dev/hda4           255       255       287      133056   83    Linux\
    \ native\n```\n\nThe new partition is there, but it defaults to Linux native if\
    \ it's not already formatted for another operating system besides Linux. So, we'll\
    \ have to go into the partition table and change the type of file it is.\n\n```\n\
    Command (m for help): t\nPartition number (1-4): 4\nHex code (type L to list codes):\
    \ 82\nChanged system type of partition 4 to 82 (Linux swap)\n```"
