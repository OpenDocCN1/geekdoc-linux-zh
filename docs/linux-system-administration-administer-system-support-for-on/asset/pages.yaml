  md: 'TABLE 9–5 PGP ENCRYPTION AND KEY OPTIONS (continued)


    | PGP Key Option | What It Does |

    | --- | --- |

    | -kx | Extracts a key |

    | -kv | Views a key |

    | -kc | Views a fingerprint of a key |

    | -ke | Edits a key |

    | -kr | Removes a key |

    | -ks | Signs a key |

    | -krs | Removes signatures from a key |

    | -kd | Revokes a key |

    | -b | Detaches a digital signature from a signed message |

    | -W | Wipes (deletes) the plaintext file after encrypting |

    | -m | Views decrypted plaintext with the UNIX more command |


    The following extracts a copy of your public key so everyone can get a copy:


    ```

    $ ppg -kxa userid ~/.pgp/pubring.pgp

    ```


    When you have someone’s PGP key, add it to your keyring. From there, you can encrypt
    and send them a message. In these cases, the sender should be you.


    ```

    $ ppg -e file recipient_userid

    ```


    If you want to sign a message, sign it with your secret key like this:


    ```

    $ ppg -s file -u sender_userid

    ```


    And you can combine the two methods like this:


    ```

    $ ppg -es textfile recipient_userid -u sender_userid

    ```


    To decrypt an encrypted file or verify the digital signature, use this:


    ```

    $ ppg encrypted_file -o plaintextfile

    ```'
