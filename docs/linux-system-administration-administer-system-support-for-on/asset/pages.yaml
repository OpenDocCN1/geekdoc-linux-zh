- pgno: 71
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_71_0.png)


    Please keep in mind that the IP address listed here is not the actual IP address
    tested. (Do you think I''d let anyone try this on my system?)


    Because most of the ports in this example are not used, they should be closed.
    The ports you use should reflect the purpose of your system — no more, no less.
    If I''m running a Web server, for example, I keep FTP and HTTP ports open; if
    I''m running a mail server, I keep port 25 open.


    Note that the sample code list just given shows services that have well-known
    exploitable weaknesses (including imap2, login, shell, and SMTP). These protocols
    could be exploited by a hacker to turn your Web server into a place for graffiti
    artists.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_71_1.png)


    Finger should never be open. Yes, it’s cute to display a silly message in a plan
    file and let people see when you were last on. It’s also true, however, that a
    hacker can get way too much information from your system through this port — including
    usernames that might have weak passwords.


    When you’re ready to scrutinize host security, TAMU Tiger and Crack are the best
    utilities to use. They can readily reveal which of your host’s resources are exploitable
    in spite of your current security measures.


    Internet Security Scanner functions similarly to SATAN, except its reporting features
    are a lot more powerful — but running both against your system is always a good
    idea. These utilities display your networking vulnerabilities such as NFS, the
    Berkeley “r” commands, and any open ports that can be exploited.


    Listing 2-3 shows a partial result of an ISS scan. Although early versions of
    ISS had performance problems; version 5.1 has wonderful logging and reporting
