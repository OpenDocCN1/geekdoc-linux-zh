- pgno: 299
  md: '# ## Disable Extraneous Applications


    In addition to running only the necessary daemons, likewise limit your active
    network applications with this same simple rule: *Nothing extraneous*. For example,
    you would not have the Web-server daemon (httpd) running on a mail server. This
    server''s function is to provide mail, not to send out HTML. In this case, you
    would also be enabling a possible denial-of-service attack and possible program
    exploits.


    If you have extra applications available, especially with the increase of buffer
    overflow exploits, you''ll have more ways for someone to root your system. It
    also means you''ll have less to patch, so it''s your incentive to not install
    all these cool applications that someone sends e-mail about because you may not
    use them and they might need patches.


    # ## Disable Known Insecure Applications


    For some reason, people are still using the Berkeley r commands. These include
    `rsh`, `rlogin`, and `rcp`. With enough freeware security software to replace
    these – including Secure Shell, which is described later in the chapter – there''s
    no reason to keep r commands usable or even on your system. Believe it or not,
    some firewall products (including Checkpoint Firewall-1) are configurable to enable
    `rlogin`. Because of the `.rhosts` and `/etc/hosts.equiv` file, the r commands
    can be easily fooled into believing they are letting in a trusted host.


    # ## Check Permissions


    You want to be especially careful with permissions (for more about permissions,
    see the previous chapter). Plenty of tools out there (such as COPS and TAMU Tiger)
    can run through your system security if your permissions are at all lax. If tightening
    them isn''t sufficient, you can always create a script to find all the files that
    have the SUID bit enabled. Here is an example of a `find` command that can look
    for the SUID bit:


    ```

    find / ( -perm -4000 -o -perm -2000 ) -type f -exec ls -l {} ;

    ```


    If you''re running a script, you can run it nightly in a `cron` job to look for
    suspicious files along with suspicious permissions.


    You also want to check permissions for root-owned writable devices. If someone
    can write to a root console or terminal, they can send commands as root without
    being root. Don''t allow root to own any group-writable (or other writable) files.
    Hackers can use them to exploit root commands.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Check Application and File Integrity


    Because digital signatures and message digest algorithms are great for checking
    data integrity, Tripwire is a great implementation of this. If you install Tripwire
    when you first install your system, you''ll have a secure system. No matter how
    many ports you close, how many patches you apply, data integrity is the first
    goal of security. You can get Tripwire from http://www.visualcomputing.com.


    You can install Tripwire at any time. However, the later you install it on your
    system, the more programs and scripts it trusts. With the more your system is
    used, the more likely you are to have a possible trojan horse or corrupted files
    on your system.


    If you can do this effectively and efficiently, there''s no better way. The way
    Tripwire works is it compares message digests of each file and "trips" if it changes.
    MD5 produces a 128-bit hash unique to each file, and cannot be duplicated. You
    can also get the MD5 message digest executable in addition to Tripwire. MD5 is
    available at ftp://coast.cs.purdue.edu/pub/tools/unix/md5/. Tripwire uses MD5
    for its message digests.


    # Apply Patches from Mailing Lists


    You should be subscribed to Bugtraq and the Linux Security mailing lists. Keeping
    up with these e-mail lists will keep you updated on the patches for each application
    and Linux. Even if a bug comes up for another UNIX or for a network port on any
    operating system, you''ll probably want to check it out on your system and make
    sure that you don''t have the same problems.


    Table 9-4 lists security-related mailing lists.


    TABLE 9-4 SECURITY MAILING LISTS

    | List name | URL for more information |

    | :--- | :--- |

    | Bugtraq | http://www.geek-girl.com/bugtraq |

    | Linux Security | http://oslab.snu.ac.kr/~djshin/linux/mail-list/index.shtml
    |

    | CERT | http://www.cert.org |

    | Xforce | http://www.iss.net |'
  merge: -1
  img_proc: true
- pgno: 301
  md: '# ## Use Cryptography Applications


    Talking to other hosts on a network is a major potential security hole; without
    encryption, eavesdroppers can have a field day. It’s as though you were having
    a private conversation in Disneyland: Anyone walking by can listen to your conversation,
    no matter where they’re from. The same is true when you connect to any network
    without encryption.


    Before we get into the applications that can help you, first consider some basic
    cryptographic concepts. First, consider the two general types of cryptography:
    symmetric-key and public-key:


    +   ♦ Symmetric-key cryptography – Two people share the same *key* (a script that
    acts like a *password*) to decrypt the message. People who don’t have the key
    can’t decrypt.


    +   ♦ Public-key cryptography – A single key is divided into two parts: a *secret
    key* (also called a *private key*) that only you can use, and a *public key*,
    given out publicly to anyone.


    Many people use public keys that are available via finger or from a Web site.
    Both PGP and Secure Shell use private keys for authentication; Secure Shell uses
    symmetric-key encryption, whereas PGP uses private-key.


    When I have my public key, I can give this key to anyone, and not worry about
    others reading my e-mail. You use the key to send me a private message. If you
    use it to encrypt a message, only I should be able to decrypt it because only
    I should have the secret key.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_301_0.png)


    Cryptographic applications may not be enabled within your country’s borders. Please
    be aware of your country’s cryptography laws before using any of this software.


    # ### SECURE SHELL


    Secure Shell is a drop-in replacement for the Berkeley *r* commands. It replaces
    the *r* commands with *s* commands. Each *s* command has its evil *r* twin, as
    the following list illustrates.


    +   ♦ *rlogin* replaces *slogin*


    +   ♦ *rsh* replaces *ssh*


    +   ♦ *rcp* replaces *scp*'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'What the Secure Shell programs do is create a random seed and enable login
    with a combination of a password and an RSA public-key pair. When the session
    is established, the information being passed between the Slackware host and the
    destination host is encrypted with DES, triple DES, IDEA, or other defined algorithms
    like Blowfish.


    When the key is accepted, the slogin or ssh connection resembles something like
    a telnet or rlogin session. The encryption is transparent to the user, but someone
    sniffing network traffic will have a difficult time. Additionally, if compression
    is enabled, this will increase performance of the connection.


    A secure shell session from my Slackware Linux system to my ISP account looks
    something like the following listing.


    ```

    ```

    tigerden:/home/stripes- ssh tigerlair.com

    stripes@tigerlair.com''s password:

    Last login: Mon Jul 20 01:00:34 1998 from dynamic22.pm04.m

    Copyright (c) 1980, 1983, 1986, 1988, 1990, 1991, 1993, 1994

    The Regents of the University of California.  All rights reserved.


    Deleting old sig...

    Picking new sig...

    /home/stripes/.sigdir/sig.9


    Mon Jul 20 01:17:59 PDT 1998

    You have mail.

    Experience is that marvelous thing that enables you to recognize a mistake

    when you make it again.

    - F. P. Jone

    ```

    ```


    When I''m online, I don''t have to worry about someone reading my typing or e-mail
    over the Internet without my permission. However, the Secure Shell program assumes
    that both hosts are trusted. If someone on my ISP were to root the system and
    break into my e-mail that way, I would not be protected through a cryptographic
    tunnel.


    When I''m done, I log out as usual and the encrypted session ends:


    ```

    ```

    tigerlair:~/user/home/stripes- exit

    logout

    Connection to tigerlair.com closed.

    ```

    ```'
  merge: -1
  img_proc: true
