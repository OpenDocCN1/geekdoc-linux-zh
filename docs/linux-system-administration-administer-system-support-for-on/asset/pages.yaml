  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_306_0.png)


    > When extracting keys, don''t extract your secret key (`~/.pgp/secring.pgp`)
    to a file. Someone could get a copy of it and decrypt your files or e-mail.


    # # Run Scans to Check for Holes


    When you have your system pretty secure, run scans against it to check it for
    security. Use tools like SATAN, shown in Figure 9-1, to check for problems, because
    if you don''t, someone else is bound to.


    Other good tools to use include packet sniffers like `iptraf` to see what type
    of information is being checked over your system. The `iptraf` program looks at
    packets as they are sent over the network and provide information like the contents
    to an e-mail message, a telnet session containing a login and password, or mounting
    network file systems.


    Other good tools include TAMU Tiger and ISS''s S3. You can run a lot of security
    program demos against a localhost without any charge. In the example following,
    I''ll show you what an Internet Security Scanner result looks like on my test
    Slackware Linux host.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_306_1.png)


    Figure 9-1: Viewing SATAN'
