    ```


    In addition to network addresses, your Slackware system also has a hardware address
    associated with the network card. This is a MAC address. If you want to map an
    IP address to a MAC address, use the Address Resolution Protocol (ARP). There
    also is a Reverse ARP (RARP), which maps the MAC address to the IP address.


    On Slackware Linux, there are two different commands to help manipulate ARP and
    RARP: they are `arp` and `rarp`. These can be important if you’re using a NIC
    for a host or routing; however, for dialup connections, you don’t need to worry
    about this.


    A good portion of the routing information is located in /proc/net, shown in Listing
    11-5. This file contains routing, IP, device, and protocol information for the
    previous commands and other configurations.


    ```

    4 pos0-0.wr1.NUO.globalcenter.net (206.251.0.122) 2.541 ms 2.404 ms 2.318 ms

