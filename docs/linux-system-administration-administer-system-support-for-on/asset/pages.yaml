    # # Understanding Basic Configurations


    After you have bare-bones Linux installed and working, some basic configurations
    can make Linux run more smoothly for you. These include setting the time, setting
    up your modem and mouse links, and configuring X.


    # ## Setting the Clock


    One vital setting is the clock – it''s at the heart of accurate system administration.
    The Linux file system uses the clock for file creation, file modification, and
    user- account management. Other computers may use Network Time Protocol (NTP)
    to synchronize their time with yours. Programs such as date, o''clock, and xclock
    display the time. Following is the output of the date command when you use it
    without arguments.


    ```

    ```

    # date

    Fri May 31 05:01:42 EDT 1986

    ```

    ```


    With the date command, you can also set the time and date. Run the date command
    like this:


    ```

    ```bash

    # date -set="Sun Aug 2 23:41:00 PDT 1998"

    ```

    ```


    Now the date is set as Sunday, August 02, 1998, and the time is set as 11:41 p.m.,
    Pacific Daylight Time. When you type the date command, you''ll see that the date
    and time are now properly set.


    ```

    ```

    # date

    Sun Aug 2 23:41:06 PDT 1998

    ```

    ```


    To display both time and date, run xclock as a digital clock instead of an ana-
    log clock. Figure 1-5 shows a digital xclock.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_45_1.png)


    Figure 1-5: Viewing the digital xclock'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# # Setting the Modem


    Whether your data communications use terminal emulation or connect to a network
    through a phone line, you''ll need to have your modem set up properly. set up
    the `setup` program in Slackware can do the job. To run the `setup` program, type
    `setup` at the prompt:


    ```

    # setup

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_46_0.png)


    Next, you''ll see a familiar installation screen that presents you with menu choices.
    Select the Configure option to set up your modem and mouse. (You can also build
    a boot disk this way, but we''ll skip the boot-disk options for now.) When the
    next window asks whether you''d like to set up your modem; select Yes.


    You''ll have only one step once you get to your modem choice. You''ll need to
    pick which serial port the modem is connected to. Because mine is connected to
    COM1, I need to select cua0. The cua is for the modem communication port, and
    the number following (in this case, zero) represents which of the four COM ports
    the modem is using. (Because Linux is written in C, it counts the same way C programs
    do: it starts with zero instead of one.) Figure 1-6 shows the modem selection
    screen, which includes the serial ports.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_46_1.png)


    When you''ve set up the modem, you can go on to the mouse setup. But take a look
    at the file type for /dev/modem. You''ll see a symbolic link that indicates the
    actual serial port to which your modem is connected. Here''s an example:


    ```

    tigerden:/home/stripes$ ls -l /dev/modem

    lrwxrwxrwx  1 root  root  4 Aug  3 23:39 /dev/modem -> cua0

    ```'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# # Setting the Mouse


    The mouse is practically indispensable for cutting and pasting text and using
    X. After you’re prompted to configure the modem, you can set up your mouse.


    When you get the window that asks you if you want to set up your mouse, select
    “Yes.” Next, you’ll be asked what type of mouse your system has. Figure 1-7 shows
    the mice choices you have.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_47_0.png)


    If you have a serial mouse (one that secures with screws to a jack at the back
    of your computer), it’s probably Microsoft-compatible (unless you’re using an
    older Logitech serial mouse). The PS/2-compatible mouse setting is the one normally
    used on laptop trackballs or touchpads. Selecting the PS/2-compatible mouse creates
    a symbolic link to /dev/mouse on /dev/psaux.


    Next, pick the port your serial mouse is to use. Doing so creates a symbolic link
    to /dev/mouse on /dev/ttyS0, /dev/ttyS1, /dev/ttyS2, or /dev/ttyS3. Figure 1-8
    shows how the serial ports in Linux are similar to Windows or DOS.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_47_1.png)'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'When you''ve set up the mouse, you can click Cancel throughout the rest of
    the setup process. Next, take a look at the file type for `/dev/mouse`. You''ll
    see a symbolic link corresponding to the particular device your mouse is.


    ```

    tigerden:/home/strikes- $ ls -1 /dev/mouse

    lrwxrwxrwx  1 root root   5 Aug  3 23:41 /dev/mouse -> ttyS1

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_48_0.png)


    The serial ports for mice are ttyS0 to ttyS3 and the modem serial ports are cua0
    to cua3. If you change serial connections for your mouse and your modem, don''t
    just switch the links \— make sure you reconfigure them by rerunning setup.


    # Configuring X


    UNIX uses a graphical user interface known as Xwindow, or X. On most varieties
    of UNIX, X comes with it as a package bundle. Linux is no different. The implementation
    of X on Linux is XFree86, for the processor architecture that it runs on.


    To configure XFree86, the graphical user interface for Linux, run XF86Setup. In
    earlier versions of Slackware, this utility did not exist; Linux had a difficult
    time finding the correct settings for monitors and video cards. If you''re running
    XF86Setup, make sure you have installed the VGA 16 X server. Otherwise you''ll
    have to go back into `setup` and install the package.


    To install X, run XF86Setup as root.


    ```

    # XF86Setup

    ```


    If you have your mouse configured properly, you shouldn''t have any problem setting
    up X with XF86Setup. You do need to make sure you have your monitor settings and
    video card settings (so have the manuals for each handy) to set up X properly.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_48_1.png)


    Make sure you put in *exactly* the right settings or you could destroy your monitor.'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Upgrading Slackware Linux


    When you decide to upgrade Linux, you have two options:


    +   Uninstall the old package and install the new one.


    +   Reinstall the new Slackware package.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_49_0.png)


    > Remember: You can upgrade certain packages, but you might have compatibility
    problems mixing old and new packages.


    When Linux was first created, it was created using the C programming language,
    which includes varies shared libraries and executables. The first type of format
    was "a.out," which was named after the default name of the executable of a C program
    after it was compiled. A few years later, the ELF format developed, which uses
    a format for executables and shared libraries different from that of a.out.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_49_1.png)


    > As a rule, don’t try mixing ELF and a.out packages; it will give you compatibility
    headaches for weeks. This was a major problem with earlier Linux kernels—and though
    the latest kernels are not as vulnerable to it, be careful with other programs.


    If you need to upgrade your system (I recommend doing so every six to nine months),
    just reinstall. (Remember, however, that upgrading may become necessary in the
    interim.) Although bug fixes, security, and performance are all compelling reasons
    to upgrade, in practical terms you can work with the same Slackware packages for
    a few years and get good results.


    # Exploring Maintenance Issues


    You should have a working system now. You’ve done well and you’ve made it past
    the first step. If you’ve made it this far with a laptop, using unique settings
    that are currently undocumented, please share your information with the Internet
    community. More information is always welcome on setting up laptops in Linux Installation
    and Configuration. Although installation is complete, however, you’re not quite
    done; once you have your system up and running, you have to keep it'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'running. That means addressing some basic maintenance concerns such as software
    patches, bug fixes, and troubleshooting, and keeping the users unstuck.


    # # Patching Software


    If there’s a bug in a program, the person or company that released the software
    will usually result in a bug fix. In Windows programs, that usually means a minor
    upgrade to the next version. In Linux, this means a software patch. To patch the
    software, obtain the patch, usually by downloading it.


    To download the patch that’s right for your system, you’ll need to provide specific
    information to identify the Linux version you’re using. If you don’t know it,
    type the following to get it:


    ```

    ```bash

    bash# uname -a

    Linux darkstar 2.0.30 #2 Tue Jun 24 09:51:29 CDT 1997 i586 unknown

    ```

    ```


    The `uname` command will give you the operating system (Linux), who compiled the
    kernel (right now, your kernel is darkstar), and the date and time your kernel
    was created. Additionally, you will see the type of processor (i586 is a Pentium
    or a Pentium-compatible).


    If the Linux version number is in the form *number.even number.number*, then your
    kernel is a stable release. If your version is in the form *number.odd number.number*,
    then your kernel is a developer’s release. If you want to do some kernel-hacking
    and some coding on the kernel itself, then use the developer’s kernel. Otherwise
    use the stable one. The following table shows examples of versions and release
    types:


    | Version number | Release type |

    |---|---|

    | 1.3.4 | Developer |

    | 2.1.76 | Developer |

    | 1.6.3 | Stable |

    | 2.0.33 | Stable |


    ![](img/8ad518fddafc7f5e73715a2604b61d50_50_0.png)


    > There’s more on patching and rebuilding a kernel in Chapter 7.'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# # Troubleshooting


    Because you''re dealing with a computer, you always face two possibilities: (1)
    it may not do what you expect it to do, and (2) if it doesn''t, you must be prepared
    to correct the glitch. Components such as hard drives can go south; you could
    change a configuration file in a way that completely destroys the way your system
    used to work. To combat such surprises, start with these measures:


    +   If a problem emerges, ask yourself, *What was last changed before you noticed
    the problem?* Often that last change could be the culprit.


    +   Keep logs on what you change on your system -- not only for troubleshooting,
    but also for keeping up to date on software upgrades.


    +   If you have a really bizarre problem, yell for help: Post to the appropriate
    Linux newsgroup, state which version of Linux you''re using and what distribution
    (it should be Slackware), and what your problem is; include screen captures.


    To get into a troubleshooting frame of mind, consider a couple of possible sce-narios:


    +   **Problem:** You''ve changed your sendmail configuration file and all the
    e-mail you send out now gets bounced back to you.


    Approach: Most likely, your configuration is causing the problem. Before you change
    any configurations however, make sure you back them up (you might need to restore
    from them). An easy way to rename them is by adding an extension with the date.
    (For example, you can rename an older version of `/etc/resolv.conf` to `/etc/resolv.conf.060298`.)


    +   **Problem:** Your PC crashed and now, when you reboot, it goes through the
    BIOS and says Loading LILO. . . and it reboots itself. Then it keeps doing this
    until you shut off your machine.


    Approach: Remember the rescue disk that you made earlier? Pop it in the floppy
    drive and reboot. You should get the boot prompt again. When it appears, type
    the following command at the boot prompt:


    ```

    boot: mount=/rootpartition

    ```


    where *rootpartition* is the name of your actual root partition. My root disk,
    for example, is mounted in the directory `/dev/hda1` so the line looks like this:


    ```

    boot: mount=/dev/hda1

    ```


    The cause of this obsessive rebooting is obscure, but using the rescue disk seems
    to fix it.'
  merge: -1
  img_proc: true
