    \nThe sysinfo() system call (in this present case, info.c) provides information\
    \ about your Linux system—such as available memory, swap space, and file-system\
    \ information. This information is not accessible by looking at the hardware itself;\
    \ the kernel has to retrieve the information before the shells can use it. The\
    \ sysinfo() call provides certain programs with system information. For example,\
    \ the who and uptime commands use the seconds since boot and load averages; memory\
