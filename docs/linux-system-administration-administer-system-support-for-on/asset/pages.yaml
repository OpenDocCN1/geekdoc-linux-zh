    # # Run Level 4


    Run level 4 has a specific function: to boot in Xwindow. To do so, it runs xdm,
    which is the X Display Manager. After the machine boots, run level 4 runs in X
    all the time (unless you change the run level). You can see evidence of this condition
    right away: When you log in, you''ll see a graphical login screen instead of the
    text-based login. Listing 7-9 shows how it''s done.


    Listing 7-9: The /etc/rc.d/rc.4file


    ```

    #! /bin/sh

    #

    # rc.4  This file is executed by init(8) when the system is being

    #    initialized for run level 4 (XDM)

    #

    # Version: @(#)etc/rc.d/rc.4  2.00  02/17/93

    #

    # Author:  Fred N. van Kempen, <waltje@uualt.nl.mugnet.org>

    #


    # Tell the viewers what''s going to happen...

    echo "Starting up the X Window System V.11 R.6..."


    # Call the "xdm" program.

    exec /usr/X11R6/bin/xdm -nodaemon


    # All done.

    ```'
