  img_proc: true
- pgno: 125
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_125_0.png)


    Unlike System V UNIX operating systems, Linux does not associate a character file
    with a block file for hard drives.


    For example, if you want to create the device file for a SCSI drive /dev/sda.
    In Linux, the major number for SCSI is 8. The minor number is a modulus of 16.
    An entire hard drive’s minor number is zero, the first partition would be 1, the
    second partition would be 2, and so on.


    ```

    # mknod /dev/sda b 8 0

    ```


    You can find the list of your major numbers for character and block devices in
    /proc/devices. You can also recover deleted devices from the /dev directory. For
    example, if you accidentally delete the secondary SCSI drive /dev/sdb, you can
    recover your loss by using the mknod command as follows:


    ```

    # mknod /dev/sda1 b 8 1

    ```


    # ## Named Pipes


    Named pipes represent another special capability. A *pipe* can take the output
    of one process over to another process, which can then use the output for its
    own purposes—but normally both processes must be related (that is, they must have
    the same parent process). A *named pipe*, however, can be used by processes that
    don’t have the same parent process. Additionally, any process allowed to read
    the data sent to the named pipe can itself be read by any process. This capability
    allows the piping of unrelated processes enhancing versatility.


    For example, the *finger* command accesses a file called .plan and .project. Someone
    who wants to run an executable through the .plan file would have to use a named
    pipe, using the `mknod` command to create it:


    ```

    # mknod FIFO p

    ```


    The p after the filename defines the special file as a named pipe. In this case,
    the named pipe occurs in a command that mentions the exact process that makes
    named pipes so useful: FIFO (First In, First Out). In this process, the first
    data written to the pipe is also the first data read from it.


