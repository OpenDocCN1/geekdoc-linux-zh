    \ -> /lib/libm.so.5 (0x40000000)\nlibncurses.so.3.4 -> /lib/libncurses.so.3.4\
    \ (0x40013000)\nlibc.so.5 -> /lib/libc.so.5 (0x400a4000)\n```\n\n# Your PATH Is\
    \ Where Your Tools Are\n\nWhen your directories are established, setting up the\
    \ PATH should be easy. Here are sample paths for Slackware 3.5:\n\nExample of\
    \ a user path:\n\n```\n/usr/local/bin:/bin:/usr/bin:/usr/X11R6/bin:/usr/andrew/bin:/usr/openwin/bin:/usr/games:.\n\
    ```\n\nExample of root's path:\n\n```\n/usr/local/sbin:/usr/local/bin:/sbin:/usr/sbin:/bin:/usr/bin\n\
    ```\n\nNotice that root does not have any X-Window-related programs in the path.\
    \ Both, however, share common directories: /usr/local/bin, /bin, and /usr/bin.\
    \ The root excludes X from its PATH for security reasons; the fewer the directories\
    \ in the root PATH, the less vulnerable the root account is to compromise by a\
