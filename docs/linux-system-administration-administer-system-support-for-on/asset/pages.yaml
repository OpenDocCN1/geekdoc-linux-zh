  md: "As with the GID, zero is reserved for root. The user accounts start getting\
    \ numbered at 1000 instead of 100. Because the /etc/passwd file does not care\
    \ how many entries have the UID zero, a hacker who can edit the passwd can give\
    \ himself UID 0. Then your system is rooted.\n\nThe pwck command verifies the\
    \ integrity of the /etc/passwd and /etc/shadow files; however, it does not check\
    \ for the same identification number in two entries.\n\n# ## SPECIAL BITS\n\n\
    If you look at the permissions on the /usr/bin/passwd, you’ll see something funny\
    \ in the permissions.\n\n```\n```sh\n$ ls -l /usr/bin/passwd\n-rws--x--x  1 root\
    \    root      34828 Mar 18 14:52 /usr/bin/passwd\n```\n```\n\nAn s appears instead\
    \ of an x in the user permissions. This is known as the set UID bit. This means\
    \ the program will run with UID 0, or root. Keep in mind that this can be exploited\
    \ by a savvy hacker who knows how to play with processes and get information from\
    \ a root process.\n\nTo add the SUID bit to a file, type the following:\n\n```\n\
    ```bash\n# chmod 4000 filename\n```\n```\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_285_0.png)\n\
    \nDon’t add SUID bit to a file unless you know exactly what you’re doing.\n\n\
    You can also set the GID bit; use chmod 2000. To set the sticky bit, use chmod\
    \ 1000.\n\n# ## FILE CHARACTERISTICS\n\nLinux uses the second extended file system\
    \ (ext2fs). This comes with this handy utility called chattr. The chattr program\
    \ enables you to put certain attributes on a file, including synchronous updates,\
    \ secure deletion, compression, and undeletable files.\n\nThe syntax looks like\
    \ this:\n\n```\n```\nchattr [-R] [-V] [-v] [attributes] file or directory\n```\n\
    ```\n\n+   **OPTIONS** The following lists options for file attributes.\n+   \n\
    +   * **-R** Recursively apply all the attributes\n+   * **-V** Verbose output\n\
    +   * **-v** Sets the version of the files"
