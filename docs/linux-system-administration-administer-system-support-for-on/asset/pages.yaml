    # CD-ROM DRIVE


    Your CD-ROM drive is recognized as a symbolic link to the secondary master hard
    drive; it cannot be a hard link because it goes across partitions. Also, you cannot
    repartition your /dev/cdrom drive into /dev/hdc1, /dev/hdc2, and so on.


    ```

    brw-r---- 1 root    disk      15,   0 Jul 17  1994 sonycd

    lrwxrwxrwx 1 root    root        8 Jun 16 20:24 cdrom -> /dev/hdc

    ```


    # CONSOLE


    The console is where system messages such as shutdowns are sent. Such messages
    include X server startup and PPP connectivity, as shown in the following code
    snippet.


    ```

    lrwxrwxrwx 1 root    root        7 May 4 14:25 sytty -> console

    crw------- 1 root    root        4,   0 Jun 16 20:25 console

    ```


    # MODEM PORTS


    The cua devices are the modem ports—a total of 31, including ports for serial
    modems and internal modems. Of these cua0 to cua3 are most commonly used.


    ```

    lrwxrwxrwx 1 root    root        4 Jun 16 20:24 modem -> cua1

    crw-rw---- 1 root     uucp        5,  64 Jul 17  1994 cua0

    crw-rw---- 1 root     uucp        5,  65 Jul 17  1994 cua1

    crw-rw---- 1 root     uucp        5,  66 Jul 17  1994 cua2

    ```'
