  md: '# Chapter 3


    # File System and Disk Management


    IN THIS CHAPTER


    +   * Understanding file-system structure

    +   * Evaluating disk usage

    +   * Creating swap space


    THIS CHAPTER COVERS *disk partitioning*, the process of dividing your disk into
    smaller sections so it’s more manageable. It also examines swap space–what it
    is, what it does, and how to configure it.


    # File-System Structure


    In Linux, everything is a process or a file. In this section, I’ll talk about
    the importance of files to Linux and some ways to tweek them.


    Linux sees your mouse as a file called `/dev/mouse`, your directory as a type
    of file, and your kernel as a file called `vmlinuz` or `bzImage`. Even your terminal
    is considered a file (`/dev/tty2` for example). If you’re going to run this operating
    system smoothly, first consider the file and how it’s structured – from the viewpoint
    of the operating system itself.


    # Inode


    The most vital part of a file is the *inode* – a data structure containing all
    the information that describes the file: size, permissions, location on disk,
    owners, groups, file type, and checksum. The inode is like a miniature database
    for a particular file. Listing 3-1 shows that the inode data structure for the
    Second Extended Filesystem, `ext2fs`, contains data, ownership, groups, file lists,
    directory access control lists, access and creation times, blocks, and the location
    of `ext2fs` on the disk.'
  merge: -1
