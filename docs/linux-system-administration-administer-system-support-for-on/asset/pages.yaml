    | .us | United States (not used much) |

    | .za | South Africa |


    International top-level domains may not seem immediately relevant, but consider:
    They can be transparent to the user. Yahoo!, for example, may appear to be only
    one site when it''s on your screen, but actually it''s several. The Yahoo! Web
    site in the United States is www.yahoo.com; in France, it''s www.yahoo.fr; in
    Germany, it''s www.yahoo.de. Such behind-the-scenes information can be useful
    to an administrator.


    When a DNS client looks up a name such as `corp.hp.com`, the process is much more
    tortuous than it seems. First your client goes to the current DNS table. If your'
