- pgno: 220
  md: '# # Chapter 7


    ## Booting Up and


    ## Shutting Down


    # IN THIS CHAPTER


    +   - Reconsidering the booting process

    +   - Using multiple boot partitions

    +   - Understanding and setting run levels

    +   - Performing smooth shutdowns


    THIS CHAPTER DESCRIBES actions you can take at bootup, mounting file systems,
    and starting processes. Some items you can tweak, such as what your machine does
    when it starts up and shuts down—others are best approached with caution. Slackware
    Linux does offer you some versatility at bootup; it can start a PPP connection,
    Web server, or any daemons you want to use.


    # ## Booting Up


    Starting up can begin in many ways. You can use a boot manager (such as those
    for OS/2 or NT) or use Loadlin to run Linux directly off of a DOS partition. Also,
    using boot options, you can pass the kernel to make sure all your hardware works
    properly.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_220_0.png)


    Refer to the HOWTO or mini-HOWTO files for each specific booting type listed on
    the CD-ROM.


    With boot options, you can define additional hardware to be recognized by the
    kernel. You can also define more specific hardware and memory options, as well.
    The boot options only work if a driver is loaded directly into the kernel, and
    not as a module.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'At the boot: or LILO: prompt, you can type the name and the values. Don''t
    use spaces to separate the name and the values, or between values.


    The format looks like the following, where N is the last number in the sequence
    of values:


    ```

    `name=value,value2,value3,valueN`

    ```


    The value can be measured in kilobytes or megabytes. It can be a type of storage
    media, make the disk writable, describe memory or hardware addresses, as well
    as other value types.


    Table 7-1 shows some names you can define at boot time.


    # TABLE 7-1 NAMES DEFINED AT BOOT TIME


    | Name | What It Does |

    | :--- | :--- |

    | root= | Defines the root file system device |

    | Ramdisk_start= | Kernel image located on a floppy disk |

    | load_ramdisk= | Tries to load a ramdisk |

    | Prompt_ramdisk= | Asks for the ramdisk |

    | Ramdisk_size= | Upper bound on RAM size for ramdisk |

    | mem= | Defines the amount of memory on your system (over 64MB) |

    | swap= | Tunes swap space |

    | buff= | Tunes buffer memory |

    | Nfsroot= | Defines the root file system from NFS |

    | Nfsaddr= | Sets the network interface address |

    | panic= | Sets the timeout period for reboot after kernel panic |

    | Profile= | Shows where the kernel is spending most of its CPU cycles |

    | Reboot= | Controls the type of reboot |

    | Reserve= | Protects certain I/O ports from auto-probing |

    | vga= | Sets the default display mode |

    | init= | Booting from another init process (such as /bin/sh) |


    Table 7-2 shows values you can pass to name options at boot time.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# TABLE 7-2 VALUES PASSED TO NAME OPTIONS AT BOOT TIME


    | Value | What it does |

    | :--- | :--- |

    | ro | Mounts a file system as read-only |

    | rw | Mounts a file system as read-write |

    | 1 | Displays true for prompt_ramdisk or load_ramdisk |

    | 0 | Displays false for prompt_ramdisk or load_ramdisk |

    | noinitrd | Loads modules on the real root file system |

    | ##k, ##M | Displays the amount of memory or drive space in kilobytes or MB |


    Table 7-3 shows bootable drives or file systems you can pass to name options at
    boot time.


    # TABLE 7-3 BOOTABLE DRIVES OR FILE SYSTEMS PASSED TO NAME OPTIONS AT BOOT TIME


    | Device | Type of Hardware |

    | :--- | :--- |

    | /dev/hd[a-h][1-16] | IDE hard drive and partitions |

    | /dev/sd[a-h][1-16] | SCSI hard drive and partitions |

    | /dev/fd[0-3] | floppy drives |

    | /dev/nfs | NFS mounted file system |


    # Using a Boot Loader


    When you first install Linux, decide whether you want to use LILO or Loadlin.
    LILO is the Linux LOader that''s custom-tailored for Linux; Loadlin is for loading
    Linux from a DOS partition called UMSDOS.


    # LILO


    I use LILO to boot Linux on any type of hardware. I haven''t had any problems
    with it, and it''s pretty easy to get working and to install. With LILO, you can
    boot from a floppy, or even different operating systems (such as DOS, Windows95/98,
    NT,'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'OS/2, SCO, and so on). If you add LILO to a floppy disk, keep in mind that
    it''s an easier way to make sure it works before lodging it in the boot sector
    of your hard drive (especially if you plan on running multiple operating systems).


    If you want to configure LILO, run /sbin/liloconfig, as shown in Listing 7-1.
    If you just want to reinstall it, run /sbin/lilo.


    ```

    **Listing 7-1: Configuring LILO**


    # /sbin/liloconfig

    LILO INSTALLATION


    LILO (the Linux Loader) is the program that allows booting Linux directly from
    the hard drive. To install, you make a new LILO configuration file by creating
    a new header and then adding at least one bootable partition to the file.


    Once you''ve done this, you can select the install option.


    Alternatively, if you already have an /etc/lilo.conf, you may reinstall by using
    that. If you make a mistake, just select (1) to start over.


    1 - Start LILO configuration with a new LILO header

    2 - Add a Linux partition to the LILO config file

    3 - Add an OS/2 partition to the LILO config file

    4 - Add a DOS partition to the LILO config file

    5 - Install LILO

    6 - Reinstall LILO using the existing lilo.conf

    7 - Skip LILO installation and exit this menu

    8 - View your current /etc/lilo.conf

    9 - Read the Linux Loader HELP file


    Which option would you like (1 - 9)? 1


    OPTIONAL append="" LINE

    Some systems might require extra parameters to be passed to the kernel in order
    to boot. An example would be the hd=cyl,hds,secs needed with some SCSI systems
    and some machines with IBM motherboards. If you needed to pass parameters to the
    kernel when you booted the Slackware bootkernel disk, you''ll probably want to
    enter the same ones here.


    Most systems won''t require any extra parameters. If you don''t need any, just
    hit ENTER to continue.


    Enter extra parameters=>

    ```


    When older kernels were accessing Enhanced IDE drives, you needed to put in extra
    parameters. Sometimes you need this to define SCSI or IBM hardware (including
    ThinkPads).'
