    # Examining Network Daemons


    There are all sorts of network daemons: `telnetd`, `sshd`, `ftpd`, `tftpd`. When
    a socket is open for an application, the daemon sits on the application''s socket
    and waits for a connection. When the socket is closed for that application, the
    daemon stops.'
