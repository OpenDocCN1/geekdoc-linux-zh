- pgno: 103
  md: '# ## Using the Best Partitioning Method


    Partitioning a disk is like dividing a house into multiple rooms: You have to
    decide which rooms get more space than others. For example, the **living room**
    might get the most space, which would make it equivalent proportionally to the
    `/` directory or the `/usr` directory. Other rooms would not get as much space
    (the bedrooms, for instance). The bedrooms might correspond to `/home` in small
    user communities. If you have six kids in your family, the bedrooms could be either
    more numerous or larger (and subdivided) to accommodate them; in much the same
    way, `/home` would have to get bigger to handle more users. The eventual result
    would be more rooms or space on the `/home` directory.


    From this **df** listing, you can see that I''ve got **507** megabytes for the
    `/` directory (495,714 1024K blocks), **507** megabytes for the `/home` directory,
    and **950** megabytes for the `/opt` directory.


    | File system | 1024-blocks | Used | Available | Capacity | Mounted on |

    | --- | --- | --- | --- | --- | --- |

    | `/dev/hda1` | 495714 | 307154 | 162959 | 65% | `/` |

    | `/dev/hda2` | 495746 | 218 | 469925 | 0% | `/home` |

    | `/dev/hda3` | 928699 | 63687 | 817032 | 7% | `/opt` |


    From the first chapter, recall that `/dev/hda` is the first hard drive on the
    primary controller. If you are using SCSI, this will be `/dev/sda`, and the numbering
    system will be the same (`/dev/sda1`, `dev/sda2`, and so on). From here you can
    see that it is partitioned into three separate sections.


    > **NOTE**  Keep in mind that the partition `/dev/sda4` is reserved for parallel
    port Iomega Zip drive on the kernel. If you are using one with a SCSI motherboard,
    don''t use `/dev/sda4`.


    The `/` directory is used for all common UNIX system files, the `/home` directory
    is for personal user storage, and the `/opt` directory is for security tools.


    The `/opt` directory is not the default on Slackware. However, I''ve decided that
    it''s a useful place for tools such as Tripwire and Netscape.


    This is the way I divided up my hard drive. You can divide your partitions in
    other ways, such as shown following:


    | Partition number | Possible partition |

    | --- | --- |

    | `/dev/hda1` | `/` |

    | `/dev/hda2` | `/usr` |

    | `/dev/hda3` | `/lib` |

    | `/dev/hda4` | `/var/log` |'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'It''s ultimately up to you how to divide up your disk; there are many possible
    ways to partition your disk. One way is to partition key directories on different
    mount points. You can also set aside a partition for a log file, or extend a partition
    and subdivide it into more partitions for log files such as `/var/log`, `/var/adm/syslog`,
    or `/var/adm/messages`.


    Remember that the base installation of Slackware Linux is about 40 megabytes,
    and with most accompanying packages installed, it''s 250 megabytes.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_104_0.png)


    > Don''t mount the /etc, /bin, or /dev directories on their own partitions. If
    that partition fails, you''ll have a non-working system and have to reinstall.


    # ### Adding Disks


    When you have two disks to partition, it''s like dividing a two-story house into
    multiple rooms. One room cannot cover both floors, although one partition can
    overlap two disks.


    Linux contains tools to make it easy to add another disk. All you have to do is
    go into fdisk and add the other disk as a Linux partition, or divide it up into
    several partitions.


    This enables room for growth. If you are running out of space on the /usr partition,
    you can always add another disk on a desktop system (keep in mind that lap- tops
    are limited).


    What you have to do is repartition your disk. The following lists the original
    settings for your gigabyte disk:


    ```

    /dev/hda1     " / "       250 megabytes

    /dev/hda2     " /usr "    250 megabytes

    /dev/hda3     " /home "   500 megabytes

    ```


    If you have these settings, run fdisk /dev/hda and delete the /dev/hda2 partition.
    Then run fdisk /dev/hdb to partition and format the second disk.


    If you install a second disk for the /usr directory, repartition both disks using
    fdisk. For example, you need a 500 megabytes for your /usr directory. So you go
    out and get a 500 megabyte disk (which is really cheap, too).


    ![](img/8ad518fddafc7f5e73715a2604b61d50_104_1.png)


    > Before doing any of this, back up and then restore to the new partitions.'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'Now you''ll see you have `/dev/hdb`, which is your second hard drive on the
    primary controller. You will also have 500 megabytes free. Make sure you format
    it, and then partition it. In this case, you''ll want to use the disk''s full
    500 megabytes for the `/usr` directory. Remember to delete the original `usr`
    directory on the `/dev/hda` partition first.


    So you do the following:


    ```

    /dev/hda1    "/"      250 megabytes

    /dev/hda3    "/home"  250 megabytes

    /dev/hdb1    "/usr"   500 megabytes

    ```


    Now that you''ve got your disk space, you have 250 megabytes free. What do you
    do with the extra disk space? This is a great use for soft links. If your system
    runs out of space on `/usr`, but has plenty of available space on `/var` or some
    other partition, you can soft-link a space such as `/home/devel/ops` to another
    file system, thus “creating” more disk space without disturbing the users.


    If you did need to do so, re-evaluate the partition structure. Be sure to plan
    ahead for users and log files. For a firewall, you would need much more space
    for `/var` than `/home`. For a server with user accounts, it may be the opposite.


    You may want to know how to move the existing data from one disk to another. Also,
    this may help in the event of a disk failure. For example, let''s say you want
    to move the `/usr` directory. To move to the new `/usr` directory, you mount the
    new disk after formatting the disk through `setup` and running `mkfs`.


    ```

    # mkfs -t ext2fs /dev/hdb1

    # mount -t ext2fs /dev/hdb1 /new-usr

    ```


    You can easily mount the new disk to `/new-usr`.


    ```

    # mount /dev/hdb1 /new-usr

    ```


    Then run a copy command such as `find /usr | cpio -pdmuv /usr-new`, and then rename
    `/usr` to `/usr-old`. Next rename `/usr-new` to `/usr`. This enables you to add
    the disk to the Linux without a reboot. However, you''ll have to powerdown to
    connect the hardware first.


    # # Maintaining Disk Quotas


    Disk quotas are used to limit users to a set amount of disk space. When a quota
    is compiled into the kernel and the quota package is installed, you can start
    maintaining disk quotas on users. To turn the quota on, use the command `quotaon`.


    ```

    # quotaon -a

    ```'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'The -a option turns quotas on for all file systems. You can specify specific
    file systems (for example, quota /home), which enables quotas for the /home directory
    where most user files are stored. You can also define quotas on all file systems
    (or on a specific file system) for a particular user or group. Use the -u option
    for a user or -g for groups.


    To turn quota off, use the command quotaoff. It accepts the same options as quotaon.


    If you are a user on the system, and you type quota, you should see this message:


    ```

    ```

    $ quota

    Disk quotas for user stripes (uid 1000): none

    ```

    ```


    Turn on quotas after you mount your file systems as read-write. To do so, do a
    couple of things. The first one is defining your file systems as quota-enabled
    in the /etc/fstab.


    To do so, edit the /etc/fstab and add the quotatype after the defaults option.
    The quota types you can have are usrquota and grpquota. If you want both, be sure
    to place a comma after each type.


    ```

    ```

    /dev/sda2        /home     ext2    defaults,usrquota,grpquota        1 1

    ```

    ```


    Quota is only available on ext2fs, so make sure you don’t try to enable it for
    any other type of file systems.


    Next, you’ll need to turn on quota in your startup script (for example, /etc/rc.d/rc.M).
    Be sure to turn on quota after the file systems are mounted as read-write, otherwise
    your computer will complain.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_106_0.png)


    You should already have quota turned off in the scripts /etc/rc.d/rc.0 and /etc/rc.d/rc.6,
    which shut down and reboot respectively. If not, make sure you correct that situation.


    Always create quota.user and quota.group in the partition(s) on which you want
    to impose disk quotas. To do so, just touch the files and change their permissions
    to root read-writable only. For the user file, you can do this:


    ```

    ```

    # touch /dev/sda2/quota.user

    # chmod 600 /dev/sda2/quota.user

    ```

    ```


    Because you made a change to the file system, you’ll need to reboot. After rebooting,
    run quotacheck -avug to check the file systems and make sure the quota is working
    properly.'
  merge: -1
  img_proc: true
- pgno: 107
  md: "To edit a quota for a particular user, first make sure you are root and type\
    \ the command\n\n```\n```\n# edquota username\n```\n```\n\nThis should bring up\
    \ your default editor and the user's quota you want to edit. You can change the\
    \ soft limits, which warn users that they are above quota, and hard limits, which\
    \ the user cannot exceed. These can be changed to increase disk space for users.\
    \ You can also change the amount of inodes a user can have.\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_107_0.png)\n\
    \n> Don't edit a user's quota file with only the editor; use the **edquota** command.\n\
    \nYou can enable a grace period for a time limit before the soft quota is enforced.\
    \ In other words, if a user goes over their soft quota, you can enable them to\
    \ have a certain amount of time before that soft quota is enforced. Time can be\
    \ defined in any basic increment (from seconds to months).\n\nTo define a grace\
    \ period, use the -t option. Replace 0 days with whatever time you feel is reasonable.\n\
    \n```\n```\n# edquota -t\n```\n```\n\nNow that you've enabled quotas, let's look\
    \ at bob's disk usage and quotas.\n\n```\n```\n# quota bob\nQuotas for user bob:\n\
    \  /dev/sda2: blocks in use: 879, limits (soft = 4000, hard = 5000)\n  inodes\
    \ in use: 894, limits (soft = 1000, hard = 2000)\n```\n```\n\nIf bob wants to\
    \ look at his disk quota and usage, all he has to type is *quota*.\n\n```\n```\n\
    $ quota\nQuotas for user bob:\n  /dev/sda2: blocks in use: 879, limits (soft =\
    \ 4000, hard = 5000)\n  inodes in use: 894, limits (soft = 1000, hard = 2000)\n\
    ```\n```\n\nFor quota reporting, the command `repquota -avug` should display all\
    \ the quotas enabled for each disk, group, and user."
  merge: -1
