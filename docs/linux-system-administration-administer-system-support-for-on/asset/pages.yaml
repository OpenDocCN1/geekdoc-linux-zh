    # ## Network Security Files


    Slackware and other UNIX operating systems share a powerful feature: files that
    control who is allowed into the host. These network security files include /etc/ftpusers
    for FTP user control, /etc/hosts.allow to define connections allowed only from
    certain hosts, and the /etc/security/ that allows root to log in only from certain
    terminals.


    The /etc/ftpusers is a great security tool for blocking certain users from accessing
    your host via FTP. Even with FTP, files can be added, deleted, and modified. Also,
    FTP can be used for a brute-force attack on root passwords. Disabling accounts
    from /etc/ftpusers secures on big intrusion hole. Listing 11-3 shows the /etc/ftpusers
    file.


    # **Listing 11-3: The /etc/ftpusers file**


    ```

    ```

    # more /etc/ftpusers

    #

    # ftpusers   This file describes the names of the users that may

    #            _NOT_   log into the system via the FTP server.

    #   This usually includes "root", "uucp", "news" and the

    #   like, because those users have too much power to be

    #   enabled to do "just" FTP...

    #

    # Version:  @(#) /etc/ftpusers  2.00  04/30/93

    #

    # Author:      Fred N. van Kempen, <waltje@uWalt.NL.Mugnet.Org

    #

    # The entire line gets matched, so no comments or extra characters on

    # lines containing a username.

    #

    root

    uucp

    news

    guest# End of ftpusers.

    ```

    ```'
