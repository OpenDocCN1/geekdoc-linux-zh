  md: "```\n$ sum d * h* i* s* \n43651  1 diskstuff \n37612  5 hardlink \n37612  5\
    \ inodes \n37612  5 symlink\n```\n\nYou can easily write a script comparing the\
    \ checksums of critical files to see if someone has accessed them. If there is\
    \ any output, you know the files have been accessed.\n\n```\n#!/bin/sh\n# compare\
    \ checksums of the files in the /etc directory from yesterday\n# move the previous\
    \ day's checksum data to yesterdaysum\nmv todaysum yesterdaysum\nsum /etc/* >\
    \ todaysum\ndiff yesterdaysum todaysum\n```\n\nThe sum command does not work on\
