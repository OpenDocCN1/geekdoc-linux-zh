- pgno: 155
  md: '# Using the Power of the find Command


    You can filter with `grep`, but `find` can give you a dramatic demonstration of
    the power of basic Slackware Linux commands. The `find` command can be used in
    scripts that run backups, file location, and modified files.


    The syntax for `find` is as follows:


    ```

    ```

    find [path] [expression] [Options] [tests] [actions]

    ```

    ```


    `Path` is where `find` starts looking in the directory structure; `Expression`
    is what you''re looking for.


    `Options` are settings for time constraints — how deep `find` should go, whether
    to include other directories or file systems, and so on.


    `Tests` are conditions your file has to match. These include the last time the
    file was accessed or changed, its contents, filename, type or size, permissions,
    ownership, and so on.


    `Actions` are what you want to do when you find the file, such as print it, move
    it, mail it, and so on.


    If you wanted to find all the `.rhosts` files, for example — a useful security
    check — you would enter a command such as the following:


    ```

    ```bash

    # find / -name .rhosts -exec ls -l {};

    ```

    ```


    This command would find all the `.rhosts` files and then execute the `ls -1` command
    on the files it found. Figure 5-1 shows the results you would get from this use
    of the `find` command.


    A more practical way to enhance security by this method is to modify the command
    so it *removes* all the `.rhosts` files it finds. An example follows:


    ```

    ```bash

    # find / -name .rhosts -exec rm -f {};

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 156
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_156_0.png)


    Figure 5-1: Viewing the results of the find command on .rhopts


    When you work with files that are critical to the operation of your Linux system,
    be sure to test your find syntax before you specify that find execute powerful
    commands such as rm after it finds the files. You don''t want to do anything so
    uncivilized as deleting /dev/hda...


    Here''s another practical example of find in action: If you want to remove all
    forward files you find, enter the following version of the find command:


    ```

    # find / -name .forward -exec rm {};

    ```


    This nice feature is really at its most powerful in shell scripts for backups,
    removal, or other operations that involve making particular changes to a specific
    group of files.


    # Understanding Data Storage and Compression Tools


    The tar and cpio commands are useful for archiving and storage. Slackware also
    comes with a set of tools to create, extract, remove, or install Slackware packages.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Using the tar Command


    The *tape archive* command (*tar*) is frequently used in archiving and storage
    operations; it can package UNIX files of all platforms. In effect, it creates
    a common file format for all UNIX-compatible platforms.


    To create a tar package (a *tarball*), first use the *-c* option to create the
    archive:


    ```

    $ tar -c tarball.tar files

    ```


    This command creates a tarball called *tarball.tar* to include all the files listed.
    I always use the *-v* option with any tarball I create or extract so I can see
    what files are being included; the resulting code looks like this:


    ```

    $ tar -cv tarball.tar file1 file2

    file1

    file2

    ```


    Now, if you check the directory contents, you’ll see that the files in the tarball
    are not deleted.


    ```

    $ ls

    file1 file2 tarball.tar

    ```


    To see the tarball’s file type, run the *file* command:


    ```

    $ file tarball.tar

    tarball.tar: GNU tar archive

    ```


    You can also use the *-f* option to include entire directories in a tarball. The
    following command, for example, tars up every file and directory, starting from
    the current directory:


    ```

    # tar -cvf usr.tar /usr

    ```


    To extract the files, replace the *-c* option with *-x*, as in the following command:


    ```

    # tar -xvf usr.tar

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_157_0.png)


    If you want to add compression to an archive, use the *-z* option for *gzip* or
    *-Z* for *compress*. You can also decompress .tar.gz files with -z option (-Z
    for .tar.Z files).'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# Using the cpio Command


    The **cpio** command copies files in and out of archives created by **cpio** or
    **tar**. The **cpio** command is used to create binary archives. The archive can
    be a file, on a tape, or a pipe. The three modes for **cpio** are copy-out, copy-in,
    and copy-pass.


    Copy-out and copy-in modes are backwards in the way you’d think they would function.
    In copy-out mode, **cpio** copies files from their directory to an archive. You
    can use **cpio** with the **find** command to copy the files into the archive.
    In copy-in mode, **cpio** is used to copy a file from an archive to a directory.
    The copy-in mode defaults to copying all the files; however, it will recognize
    patterns.


    In copy-pass mode, files are copied from one directory to another – without creating
    an archive. Many system administrators use **tar** instead of **cpio** because
    the **tar** format can be used universally across UNIX platforms with similar
    format, and its options make it easy to use.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_158_0.png)


    Don’t compress archive files (whether **cpio** or **tar**) that you intend to
    store on tape. If the medium is damaged electronically or physically, compressed
    data stored on it becomes impossible to retrieve.


    # Examining Slackware Packaging


    Slackware comes with tools you can use to create, extract, remove, or install
    Slackware packages. If you want a general tool that enables you to install, remove,
    or view the contents of a particular package, the **pkgtool** interface fills
    the bill. Figure 5-2 shows the **pkgtool** screen.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_158_1.png)


    Figure 5-2: Viewing the pkgtool screen'
  merge: -1
  img_proc: true
- pgno: 159
  md: 'You can also use Slackware package tools at the command line. To install a
    package, for example, use the installpkg command like this:


    ```

    ```

    # cp /var/adm/packages/package.tgz / ; cd /

    # installpkg package.tgz

    ```

    ```


    You can identify Slackware package files by the extension .tgz. If you just want
    to extract the contents of the package file into the current directory, you can
    use the explodepkg command.


    ```

    ```

    # cd ~root

    # explodepkg package.tgz

    ```

    ```


    If you installed a package and want to uninstall it, use the removepkg command.
    This will remove all the files that the installpkg put on the file system.


    ```

    ```

    # removepkg package.tgz

    ```

    ```


    You can create your own packages with the makepkg command. The following command
    (where *packagename* corresponds to the name of your package) archives and compresses
    all the files and subdirectories in the current directory.


    ```

    ```

    # makepkg packagename

    ```

    ```


    For added convenience, the makepkg command adds the .tgz extension to the package
    name automatically.


    # # Compressing Files


    If you want to compress a file (reduce its storage size by removing certain types
    of unnecessary data), you can use programs such as UNIX compress, zip, or GNU
    zip to do so. You begin the operation by issuing the appropriate command, followed
    by the name of the file you want to compress. Afterwards, the compressed file
    shows the same name with a different extension that corresponds to the program
    you used (for UNIX compress, zip, or GNU zip, the extension would be .Z, .zip,
    or .gz respectively). The compression commands look like this:


    ```

    ```

    $ compress file

    $ zip file

    $ gzip file

    ```

    ```


    Uncompressing the file is similarly straightforward: Use the un command available
    in UNIX compress, zip, or GNU zip. To issue an uncompress command, you add un
    to a compression command, as follows:'
  merge: -1
