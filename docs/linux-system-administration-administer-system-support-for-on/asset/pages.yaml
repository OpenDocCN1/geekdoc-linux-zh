    # PERSONAL ACCOUNT INFORMATION


    In the beginning of this chapter, there is personal information you can add from
    the adduser command. You can change this information by using the chfn username
    command, or the user can use the command without any parameters to change their
    own information.


    ```

    $ chfn

    Changing the user information for bob

    Enter the new value, or press return for the default


    Full Name []:

    Room Number []:

    Work Phone []:

    Home Phone []:

    Other []:

    ```


    This information shows up with the finger command, which reads it from the /etc/passwd
    file. It also shows the last time the person logged in, for how long and where,
    and what the status of their e-mail is.


    From the following listing, you can see the user strip es is running Xwindow (the
    :0.0 is a giveaway). You also could read the ~/.plan file if it exists and is
    world readable.


    ```

    $ finger stripes

    ```'
