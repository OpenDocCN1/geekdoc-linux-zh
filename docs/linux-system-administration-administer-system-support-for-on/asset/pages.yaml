- pgno: 336
  md: '# ## Chapter 10


    # # Disaster Recovery and Backups


    # ### IN THIS CHAPTER


    +   - Preparing for disaster recovery

    +   - Scheduling backups

    +   - Evaluating storage media

    +   - Using backup tools

    +   - Running power management

    +   - Creating rescue disks


    As VITAL AS basic security measures are to your system, never let them lull you
    into a false sense of system security; always prepare for the worst (power failures,
    break-ins, hardware failures). The best way to prepare is to back up your system—OS,
    applications, data, the works.


    A good backup strategy can save you from having to re-create your work (or someone
    else’s), enhancing both network security and job security. Initially, it’s a headache,
    but it can save you the equivalent of a migraine later on. Backups do, in fact,
    make your life easier—for example, if you’ve just written a book and your Slackware
    Linux system has a slim possibility of failing (really slim, given the stability
    of Linux), you’ll know you won’t have to rewrite the book even if the unlikely
    happens.


    # ## Disaster Recovery


    Disaster recovery is what is done to recover critical information in the event
    of a disaster. A disaster could be an earthquake, a fire, a tornado, vandalism,
    a hard drive crash, or even the Year 2000 problem. So, what do you do to keep
    everything functioning once a catastrophic event hits your computer?


    You have several options, depending on how critical the service is that you provide.'
  merge: -1
  img_proc: true
- pgno: 337
  md: '310


    # Mirroring


    Mirroring is used for creating a "carbon copy" of a live directory structure on
    another live system. This is normally a means of providing an alternate computer
    with the same information in case the computer you''re using becomes unavailable
    (whether "it went down" from too heavy a CPU load or other miscellaneous reasons).
    For example, many Web sites are mirrored; if one of them gets too busy, the traffic
    can go in another direction with minimal interruption. These mirrors are updated
    anywhere from weekly, daily, or hourly intervals.


    You can find the mirroring tool Mirrorird and FTP Backup Utility on the Web at
    http://sunsite.unc.edu/pub/linux/system/backup. Mirroird mirrors links, devices,
    permissions, ownerships, access times, and any other aspect of the mirror site''s
    files via FTP. It also provides revision control, and works well with timed backups.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_337_0.png)


    You may want to consider the use of mirroring as a backup utility in its own right,
    especially if you use Mirroird to create an emergency site.


    # Emergency Live Backup Site


    If you are running Linux as a personal computer at home, you probably don''t need
    to worry about having a live backup site. However, for a business, an emergency
    site enables you to continue computing activity once the original site goes down.
    For example, California is known to have frequent earthquakes. You may want to
    have a live backup site in Indiana where earthquakes or other natural disasters
    are less likely to strike.


    Though business at the California site will come to a standstill in the event
    of a serious earthquake, you can still continue conducting business through the
    Indiana live site.


    Depending on the type of business you are doing, you may need to keep a live site
    to keep like accounting and payroll systems active and make sure those affected
    by the disaster can keep functioning.


    # Off-Site Storage of Critical Files


    For most administrators, whether business and personal Linux users, off-site storage
    of critical files such as log archives and backups is ideal. If someone breaks
    into your house and steals your computer, have a way to get access back to your
    files. If your hard drive at work crashes, and you can''t get access to those
    backed-up alpha releases, and the local backups are corrupt, you may want to store
    the files at an off-site facility.'
  merge: -1
  img_proc: true
- pgno: 338
  md: 'This provides you with an additional location for your backups in case something
    happens to your site. Places you can store your extra data files should be relatively
    safe places, in a secured location.


    # Backups


    I can''t stress how important it is to back up your files. It''s not usually a
    matter of protecting top-secret files that will destroy the government, but usually
    a matter of saving yourself time, headaches, and a lot of frustration. Depending
    on how critical the files are, you may want to back up every *hour* instead of
    every week or every month.


    # Full Backups


    A full backup is completely backing up an entire file system. For backing up an
    entire file system, you can easily just copy the information to another hard disk,
    Jaz drive, tape drive, or over multiple floppies or Zip disks. These take time
    to do; however, they are worth the investment because you will be spending much
    more time trying to recreate what you did instead of restoring files. For full
    backups, you probably want to go once a week if you are running one system for
    a personal computer, and possibly more frequently if you are running multiple
    business-critical systems.


    To run a full backup in cron the first of every month at 4:00 a.m., create a crontab
    file that looks like this:


    ```

    ```sh

    * 4 1 * * /usr/sbin/fbackup.sh

    ```

    ```


    Then add the full backup script to /usr/sbin/.


    ```

    ```sh

    #!/bin/sh

    # fbackup.sh - Full backup script. This can be updated to change the

    # date automagically, or the backup target.

    # REMEMBER! Do NOT use -z option with tar!

    echo "Mounting Tape Drive..."

    mount /dev/tapedrive

    cd /

    echo "Creating Full Backup..."

    tar -cvf /dev/tapedrive/full_backup_1July99.tar /*

    echo "Checking for backup file..."

    ls /dev/tapedrive

    echo "Unmounting Tape Drive..."

    cd ; umount /dev/tapedrive

    echo "Done."

    ```

    ```'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# Incremental Backups


    Incremental backups, backing up files that have changed that day or interval period,
    are just as important as full backups. If you only do full backups weekly or monthly,
    doing incremental backups daily will save you a lot of headaches if you haven''t.
    You can use the cron command for scheduling backups. A crontab file may look like
    this:


    ```

    * 1 * * * /usr/sbin/ibackup.sh

    ```


    For example, you could have the following cron job running from root to back up
    the files that changed in the past day at 1:00 a.m. every morning. We can use
    the example script in Chapter 2.


    Here''s the example script for running an incremental backup:


    ```

    #!/bin/sh

    # ibackup.sh - Incremental backup script. This can be updated to change the

    # date automatically, or the backup target. You can also change

    # the amount of time for an incremental backup.

    echo "Mounting Tape Drive..."

    mount /dev/tape /dev/tapedrive

    cd /

    echo "Finding files changed today..."

    find / -mtime -1 -print

    echo "Creating Incremental Backup..."

    find / -mtime -1 -exec tar -cvf /dev/tapedrive/incremental$(date +%Y%m%d) {} \;

    echo "Checking for backup file..."

    ls /dev/tapedrive

    echo "Unmounting Tape Drive...."

    cd ; umount /dev/tapedrive

    echo "Done."

    ```


    Another alternative is to download a program, such as KBackup or Taper. Both these
    programs are available from the UNC Sunsite listed above.


    # Scheduling


    You can keep your system backup current and effective by creating a backup schedule
    that establishes the frequency of incremental and full backups. In the example
    above, the backup schedule is once a day for incremental backups and once a month
    for full backups. You may have only one system to back up or you may have many.
    Some systems are more critical than others and may require different backup schedules.
    Other hosts may change and users are more likely to demand access to the backups
    if they lose a file. Table 10-1 shows sample backup schedules.'
  merge: -1
  img_proc: true
- pgno: 340
  md: '**TABLE 10-1 BACKUP SCHEDULES**


    | Name of Host | Purpose | Incremental | Full |

    | :--- | :--- | :--- | :--- |

    | db.site.com | Database server | Hourly | Daily |

    | web.site.com | Webserver | Weekly | Monthly |

    | fw.site.com | Firewall | Weekly | Monthly |

    | host1.site.com | User host | Daily | Weekly |

    | host2.site.com | User host | Daily | Weekly |

    | host3.site.com | User host | Daily | Weekly |

    | app.site.com | Application Server | Weekly | Monthly |


    Notice that the full backups are in larger increments of time than the incremental
    backups. Because full backups are more time-consuming (more data to copy), they
    are done less frequently.


    > **NOTE**

    > Run your backups when there is minimal or no load on the host; it''s a good
    idea to run the backups in the wee hours of the morning (say, 2:00 a.m.). This
    simple method can help you avoid disrupting user activity and slowing the system.


    # # Backup Storage


    Now that you''ve got a backup plan, decide how you will store everything.


    # ## Media Backups


    It''s almost worthwhile to get a large hard drive and store the backups there
    because the prices of hard drives have dropped. It''s simple to mount another
    drive using `/dev/hdb` and mount it as `/backups`. This is probably the fastest
    method for backups; however, its media are not removable.


    Tapes are the best way to go. They are designed for backing up data, and they
    can be reused and reused. Tapes can also store incredible amounts of data so you
    shouldn''t worry about having enough space. For super critical data, tapes can
    also be duplicated and stored off-site for quick recovery in the event of a site
    disaster.'
  merge: -1
  img_proc: true
- pgno: 341
  md: 'If you really want to, you can back up onto floppy disks. I wouldn’t suggest
    doing this for entire mounted disks, but for small incremental files, it’s not
    a bad idea. Mounting to a floppy disk is real easy.


    ```

    # mount /dev/fd0 /floppy ; tar -cvfz /floppy/files.tar.Z /home/bob/slackstuff/*

    ```


    Newer media includes Iomega Zip and Jaz disks, and CD-R drives. There are some
    issues with these technologies. Some has to do with support, others have to do
    with performance, and some has to deal with the cost issues.


    If you are using a drive that is not a common backup tool (a Jaz drive, for example)
    you’ll need to research some practical in-house issues — for example, if many
    of your co-workers don’t implement a backup strategy similar to yours, how do
    you co-ordinate your efforts?


    Performance, too, can be a major issue. Parallel Port Zip drives are slow, and
    there’s no way around that. To back up to a Zip drive, be willing to change the
    media after 100MB increments; if you have a large hard drive (greater than 200MB)
    or if you are running the backups late at night, this is not practical. (The floppy
    backups are not practical either).


    Though financially it may make more sense to run your backups onto several hundred
    floppy disks, this is not the most practical. With tape and other hard drive media
    costs a few hundred dollars per unit, and the media is not expensive, you may
    want to give in to installing a tape drive or additional hard drive and run backups
    that way.


    Some advantages of CD-R drives include dumping off a large chunk of data (650MB)
    and allowing quick access to it. You can easily store large media files (even
    applications) to CD-ROM and get the throughput needed to access them (upwards
    of 4-6MB per second with a 32x or 40x drive). Tapes, on the other hand, can store
    large amounts of data, but retrieval is slow. Generally, if you have a large application
    or multimedia collection to back up, CD-ROM is your best bet. For file system
    backup and incremental data storage tapes will serve you far better in the long
    run.


    # ## Network Backups


    If you have multiple hosts, you can back up over a network. There are two ways
    you can back up over a network: FTP or Secure Shell’s scp. With FTP, you are using
    a client that involves commands to be invoked in the application. If you are using
    scp, you only need to worry about your command line and not a program’s set of
    commands. Also, scp encrypts the traffic over the network.


    Network backups are great for setting up live emergency backup sites or off-site
    backups. It can be on someone else’s host so you don’t have to maintain the host;
    however, you have to maintain the integrity of your file system. You can use the
    FTP Backup utility available at UNC Suncsite, or you can write your own script
    using scp.


    Network backups do have a failure point. If you are backing up to a host on the
    network, and the network goes down, you don’t have a backup until the network'
  merge: -1
  img_proc: true
- pgno: 342
  md: 'connection is restored. You can have hardware failures with regular backups,
    but be aware that networks may have a different level of reliability than hardware.


