- pgno: 374
  md: 'Daemons don’t run on their own, they are controlled by inetd, which is a super-daemon.
    The inetd configuration file can affect which applications and protocols can be
    run, and can even enable logging on some applications. So you can think of inetd
    as a socket manager.


    When inetd runs, it reads the configuration file. If you update this file, give
    inetd the hangup signal (kill –HUP <processid>). This causes inetd to reread the
    /etc/inetd.conf file.


    Note the permissions on /etc/inetd.conf:


    ```

    ```

    $ ls –l /etc/inetd.conf

    -rw-r-r-- 1 root root 4998 Oct 15 1997 /etc/inetd.conf

    ```

    ```


    You never want this file to have any more permissions than 644! This keeps users
    from writing to the /etc/inetd.conf file.


    An entry in /etc/inetd.conf is formatted like this:


    ```

    ```

    service_name sock_type proto flags user server_path args

    ```

    ```


    FTP is a good example of all the syntax usage.


    ```

    ```

    Ftp stream tcp nowait root /usr/sbin/tcpd wu.ftp –l –i –a

    ```

    ```


    Here FTP is defined as the service (as in the /etc/services file). It uses a data
    stream (you’ll also see a dgram, which is short for datagram, on UDP packets).
    It uses TCP for the transport protocol, and the information is sent via stream—it
    could also be a datagram as well as a number of other packets. The nowait means
    that the protocol does not wait to free the socket (this only applies to datagram
    packets), and the ftpd runs as user root.


    The daemon that actually runs is wu.ftp, which is the WUarchive FTP daemon. Option
    –l (lowercase L) turns on the logging option.


    Take a look at the entire /etc/inetd.conf file, shown in Listing 11–1.


    # Listing 11–1: /etc/inetd.conf file


    ```

    ```

    # more /etc/inetd.conf

    # See "man 8 inetd" for more information.

    #

    #

    # If you make changes to this file, either reboot your machine or send the

    # inetd a HUP signal:

    # Do a "ps x" as root and look up the pid of inetd. Then do a

    # "kill –HUP <pid of inetd>".

    # The inetd will re-read this file whenever it gets that signal.

    #

    # <service_name> <sock_type> <proto> <flags> <user> <server_path> <args>

    #

    ```

    ```'
  merge: -1
