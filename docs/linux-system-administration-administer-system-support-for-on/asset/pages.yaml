- pgno: 391
  md: 'With the Linux firewall, you can filter traffic, set up a proxy, or use IP
    masquerading. Masquerading is hiding invalid IP addresses behind a valid one.
    This hides your network addressing from the rest of the world.


    Because the firewall capabilities must be compiled in the kernel, you have to
    turn on the firewall option just like you would to tell Slackware Linux to act
    more like a router than a host. The interface for the firewall administration
    is the *ipfwadm* command.


    For accounting, pass the -A option. You can specify input, output, or both on
    what type of rule sets should be counted. The default is both, and provided you
    have the hard space, you’ll probably want to keep both if you’re not the only
    user on your Slackware system.


    ```

    ```

    # ipfwadm -A command parameters [firewall options] (accounting)

    ```

    ```


    For input or output rules, you’ll need to specify -I or -0 respectively. These
    rules are defined to accept, deny, or reject. Reject is letting the user know
    that the packet was not allowed; deny does not tell the user that the packet was
    not allowed in.


    ```

    ```

    # ipfwadm -I command parameters [firewall options] (input)

    # ipfwadm -0 command parameters [firewall options] (output)

    ```

    ```


    Two more steps you can take with the firewall include forwarding IP addresses
    (a routing function, actually) and masquerading those addresses.


    ```

    ```

    # ipfwadm -F command parameters [firewall options] (forwarding)

    ```

    ```


    This means the firewall decides where the packet goes. Basically the firewall
    becomes a traffic cop with the -M option.


    ```

    ```

    # ipfwadm -M [ -1 | -s ] [firewall options] (masquerading)

    ```

    ```


    This all hides your internal network addresses (especially if you’re using illegal
    addresses as in RFC 1918) from the outside. This enables many invalid IP addresses
    to use one valid IP address for Internet connectivity.


    Firewall files are stored in */proc/net*. They are *ip_output*, *ip_forward*,
    and *ip_masquerade*. These files maintain the rule bases for IP forwarding, IP
    masquerading, and IP output.


    # # Dial-Up Connections


    Linux has two means of networking: modems and NIC, or Network Interface Card.
    Because more people are connecting to an Internet Service Provider (ISP) or corporate
    networks through modems, you need to understand how Slackware Linux'
  merge: -1
  img_proc: true
- pgno: 392
  md: 'interfaces with modems. With dial-up connections, Slackware has two ways to
    interact: a terminal emulator or through network daemons pppd and slippd.


    # Network Interface Cards


    In the previous sections with setting up routing tables and Ethernet cards, this
    shows you how to manually set up a network interface card. However, you should-n’t
    need to do anything to set up the NIC if connecting through a kernel module or
    PCMCIA module. This should load the drivers and identify the card configurations
    as the information comes into the hardware.


    # Terminal Emulation


    If you want to have basic terminal emulation through a modem, you can use seyon,
    an X-based communication tool, and minicom, the non-X-window-based tool. Both
    do basically the same thing; they enable you to connect to another computer without
    having to set up an IP network connection. The difference between minicom and
    seyon is minicom is curses-based and seyon is X-based. Figure 11-10 illustrates
    seyon.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_392_0.png)


    To use the seyon or minicom program, first have handy the phone number you’re
    connecting to, the login name, and the password. When you have this information,
    you can log in to your account and have access (similar to a telnet session, except
    through a modem).


    To get started, press Ctrl-A and then Z on minicom. In seyon, a message will appear
    within the X window, prompting you for a number to dial.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# PPP


    If you have an Internet Service provider, or want to connect to a network, you''ll
    most likely use **PPP**. PPP is the Point-to-Point Protocol that enables you to
    dial directly into a server to access the resources on a network. This is the
    most commonly used connection via modem.


    When you set up PPP, do so as root. Otherwise you can make your own work surprisingly
    difficult. You''ll also want to double-check the permissions on network files.
    Make sure that everyone can read and execute them. An example of a good permission
    is **555** or **755**. If you don''t have your permissions set properly, it may
    cause some weird problems when connecting. DNS has a tendency to cause problems
    with X and other networking software without meaning to. Always check your *`/etc/resolv.conf`*
    file. If you do have problems, you can always temporarily rename it to *`/etc/resolv.oid`*.


    # SETTING UP PPP


    Here are the basic steps for setting up PPP.


    +   1.  Run `/sbin/netconfig`. Follow the same directions as the `netconfig` command
    for setting up your network section.


    +   2.  Check your HOSTNAME file to make sure it''s your username.domain.com.
    Your HOSTNAME file will be in the /etc directory.


    For example, your screen should have something like this on it


    ```

    stripes:~# more /etc/HOSTNAME

    stripes.nando.net

    ```


    +   3.  Check your `resolv.conf` file (in your `/etc` directory). The output should
    mirror the following:


    ```

    stripes:~# more /etc/resolv.conf

    domain best.com

    nameserver 152.52.2.2

    ```


    +   4.  Type the following at your command prompt.


    ```

    stripes:~# chmod 755 /etc/resolv.conf

    stripes:~# chmod 755 /etc/HOSTNAME

    ```


    This lets everyone read and execute the *`/etc/resolv.conf`* and *`/etc/HOSTNAME`*
    files. If you don''t type these commands, you''re going to be finding frustrating
    (I''m telling you this one from personal experience).


    +   5.  Check to be sure you have all your `ppp` files. They should be in the
    directory `/usr/lib/ppp`. Your directory listing should have these two files:'
  merge: -1
  img_proc: true
