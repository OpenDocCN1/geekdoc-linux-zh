- pgno: 208
  md: 'entertainment. Many computers today come with a CD-ROM and soundcard as a multimedia
    kit. Linux supports various sound cards, including SoundBlaster, Gravis Ultrasound,
    Proudio Spectrum, and others. You can also compile in MIDI drivers if you have
    MIDI compatibilities (plug in a keyboard, and so on). Be sure to enable sound
    card support before picking your sound card, as shown in Figure 6-15.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_208_0.png)


    +   14. Kernel hacking – Kernel hacking is tinkering with the kernel for optimization
    or increasing functionality. If you''re a kernel hacker, this is the feature for
    you. The kernel profiling shows how often the CPU is accessed by a particular
    process so you can optimize the kernel. I''m not a programmer and have no reason
    to turn on kernel profiling. Unless you''re running a developmental kernel and
    want to kernel hack, leave this stuff alone. It''s especially not good for firewalls,
    routers, database servers, Web servers, or other production systems. Figure 6-16
    shows the kernel hacking option screen.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_208_1.png)'
