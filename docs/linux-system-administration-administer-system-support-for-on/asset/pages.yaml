    # I/O


    In Linux programming, you have commands for two forms of output and one form of
    input. The two forms of output are standard out (stdout) and standard error (stderr).
    Standard out is what you see on your screen, provided everything is running smoothly.
    Standard error may or may not show up on your screen, depending on how the programmer
    defined it.


    Standard input (stdin) is input that the user creates while using the program.
    With a word processor, for example, standard input corresponds to the words you
    type; standard output includes the typed words you see on-screen and the commands
    you''ve activated in the program when you perform operations such as saving documents.
    However, you may not see any standard error messages and the program may close
    on you without warning.


    ```

    lrwxrwxrwx  1 root  root  4 May 4 14:25 stderr -> fd/2

    lrwxrwxrwx  1 root  root  4 May 4 14:25 stdin -> fd/0

    lrwxrwxrwx  1 root  root  4 May 4 14:25 stdout -> fd/1

    ```


    # TERMINALS


    The tty device files correspond to terminals. For each terminal you access, you
    see another login prompt. Each tty number (1 through 12 at least) is associated
    with a function key (F# key); if you want to go to other terminals, press Alt
    in combination with F2, F3, F4, F5, and so on. When you log in to Linux and the
    computer first boots up, the first terminal (tty1) is the default.'
