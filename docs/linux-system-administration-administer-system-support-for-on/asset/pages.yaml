- pgno: 124
  md: 'on a directory. Sockets are device files that open a network connection. These
    include printers, TCP/IP sessions such as telnet and FTP, and Network File System
    (NFS). These enable two computers or devices to talk to each other through net-
    working.


    The named pipes relate to processes. With a regular pipe ( | ), you need to use
    a command that is using the same process. For example,


    ```

    $ ls | sort | head -5

    ```


    This set of pipes takes the output of ls through the sort command. Then that output
    is again piped through the command head -5. The result is the first five sorted
    items on a directory listing. All of these commands take place during the same
    process. A named pipe allows the operating system to pipe different processes.


    Table 4-1 lists file types.


    TABLE 4-1 FILE DESCRIPTORS


    | File type | Explanation |

    | :--- | :--- |

    | - | File |

    | d | Directory |

    | l | Symbolic Link |

    | c | Special Character |

    | b | Block file |

    | s | Socket |


    # # Properties


    Device files don''t magically appear (though they may seem to)—but neither can
    you create them the same way you would create a file or directory. You must use
    mknod, a command designed specifically for creating device files or other special
    files. The mknod command syntax is fairly simple:


    ```

    mknod devicename [c] [b] majornumber minornumber

    ```


    To create a device, first decide whether it''s a block (b) or special character
    (c). After that, define the major number and minor number. (The major number is
    the type of device, such as a SCSI hard drive or mouse; the minor number is the
    specific device within the type of device.)'
