- pgno: 33
  md: '# Creating Installation Disks


    Now that you know the contents of your CD-ROM, make two installation disks: a
    root disk and a boot disk. A boot disk has a small kernel that enables you to
    boot your hardware, and a root disk contains the installation program with a minimal
    Linux file system.


    # MAKING THE BOOT DISK


    To make your computer recognize Linux, create a boot disk. This disk functions
    similarly to a boot disk for DOS or Windows. In fact, you can create your Linux
    boot and root disks from Windows or DOS, as well as from Linux.


    To create your boot disk, first look at the file /cdrom/bootdsks.144/WHICH.ONE
    or /cdrom/bootdsks.12/WHICH.ONE and match your installation media with the correct
    kernel. Kernels for IDE drives end in .i, and kernels for SCSI controllers end
    in .s. For example, I have a Sanyo IDE/ATAPI CD-ROM drive from which I''m installing
    the software, so I want a kernel that supports IDE drives; I''d look for one that
    ends in .i.


    To create your boot disk, you can use the Windows batch file in the directory
    bootdsks to create the batch file that corresponds to the boot-disk file.


    In the file WHICH.ONE, the first column represents the installation media, the
    second column is the IDE kernel, and the third column shows the SCSI kernel.


    For my CD-ROM, WHICH.ONE shows the following:


    ```

    Sanyo CDR-H94A | sanyo.i | sanyo.s.|

    CD-ROM | |

    ```


    Because it''s an IDE drive, I use sanyo.i. ToTo get this kernel to a bootable
    disk (thus a boot disk), use RAWRITE.EXE in a Windows-based system. What are even
    better are the batch files, which do most of the work for you.


    To create a 1.44MB boot disk using the batch file, go to the directory D:\Boodks.000\ide-bat.
    (You can read the text files directly from a UNiX-based operating system.) From
    there, double click the file sanyo.bat. The following message appears:


    ```

    "This option makes the sanyo.i disk."

    "Please insert a formatted high-density diskette, and press"

    "a key to make the disk, or CTRL-C to abort..."

    Press any key to continue . . .

    ```


    After you press any key, the next message appears:


    ```

    Number of sectors per track for this disk is 18

    Writing image to drive A: Press ^C to abort.

    Track: 07 Head: 1 Sector: 16

    ```'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'When the boot disk is complete, you get a message saying Done, as the following
    code shows.


    ```

    "This option makes the sanyo.i disk."

    "Please insert a formatted high-density diskette, and press"

    "a key to make the disk, or CTRL-C to abort..."

    Press any key to continue . . .

    Number of sectors per track for this disk is 18

    Writing image to drive A:. Press ^C to abort.

    Track: 30 Head: 1 Sector: 4

    Done.

    ```


    You now have a usable Linux boot disk. Make sure you label it clearly as such
    so you don''t overwrite it or use it with the wrong OS.


    **TIP** Don''t forget to write-protect and label your boot, root, and rescue disks.


    # MAKING THE ROOT DISK


    Next you''ll need to create a root disk. You can use one of several programs for
    this purpose:


    +   - **color.gz** – Easy-to-use program that installs color menus

    +   - **pcmci a.gz** – Easy-to-use installation program for color menus to be
    used with PCMCIA Ethernet or SCSI

    +   - **tape.gz** – Supports tape installations (experimental)

    +   - **text.gz** – Text-based menu- installation program

    +   - **umsdos.gz** – Easy-to-use installation program for color-menus to be used
    with UMSDOS


    You''ll notice that all these files end in .gz. This means they are compressed
    with the GNU zip utility, which comes installed with Slackware. *Don''t decompress
    them*. The root-disk file decompresses when the installation program runs.


    The rescue.gz file helps you create a rescue disk; it includes recovery tools
    such as vi. I recommend that you make one if you have a spare disk. You never
    know when it might come in handy.'
