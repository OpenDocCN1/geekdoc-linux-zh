- pgno: 84
  md: '# ## Maintaining Accessibility


    When you have your system operational, backed up, and basically secure, make sure
    you have an ongoing understanding of what''s necessary, what''s not, and what
    level of access your users require.


    Though you want to make sure the files are secure, make sure the users who need
    them have access to them. Nothing is more frustrating than seeing an error message
    such as “Permission denied.” This common problem causes about 90% of the support
    headaches in a UNIX environment.


    You and your users should have a clear, mutual understanding of what they need
    to do their work and what you need to protect their computers. Notice that often
    these two will conflict. Whether you are maintaining the Slackware system for
    multiple users or just yourself, make sure you have enough functionality to do
    everything your user(s) may need to do.


    # ## Handling Growth


    To handle the growth of your system, first allow yourself enough flexibility to
    open and close ports and applications in response to users'' needs – both present
    and future. Be sure to talk with your users periodically to find out how their
    needs may have changed.


    Partitioning your hard drive properly is one way of handling growth, but that''s
    only for disk space. More growth areas you should note include scalability, network
    architecture, and specific servers.


    # ## Scalability


    The scalability of UNIX is a major strength. With any variety of UNIX, including
    Linux, you can start out with five employees and grow to hundreds without feeling
    much pain if you plan right. UNIX is designed to handle its applications through
    processes, which can be killed or restarted without rebooting the system. As a
    result, Linux can handle many different types of applications that should not
    interfere with each other.


    Intensive applications, such as databases, become more important as other front-end
    applications are increasing in complexity. Search engines, for example, use databases
    accessed through a front-end application that the user inputs a query. If the
    database gets too large, the database application can be distributed over several
    Linux hosts to increase performance and the amount of available information.


    Another way Linux is scalable is by handling a growing number of user accounts.
    A user account is an entry in /etc/passwd, /etc/shadow, and a home directory.
    ISPs can handle a multiple amount of user accounts, mostly dependent on disk space
    for log files and home directory space. If an ISP suddenly needs to'
  merge: -1
  img_proc: true
