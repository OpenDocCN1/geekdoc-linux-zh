    # Security Policy


    When you''ve got your security in place, keep it that way. What you''ll need to
    do is make a list for your users on what they can and cannot do on your system.
    You''ll also want to keep reminding the users on your rules. You paid for the
    hardware, you make the rules. Here is an example of a simple security policy:


    Service | Inbound? | Outbound? | Reason

    ---|---|---|---

    Telnet | No | Yes | Users need access to accounts

    e-mail | Yes | Yes | Critical means of communications

    Secure Shell | Yes | Yes | Enables for secure remote access

    HTTP | Yes | Yes | Users need information for research, outsiders need to access
    public Web server


    Explain your security policy clearly. You are responsible for what happens from
    your system, whether you authorize it. Be aware that the laws currently work that
    way. Make your policy enforceable, so you have a valid reason to kick someone
    off your system for abusing it (for example, sending spam, storing 500 megabytes
    in `/tmp/`),


    Another thing you''ll definitely want to do is place a warning banner in your
    `/etc/motd`. This will give you a legal advantage if you want to persecute anyone
    who illegally enters your system.'
