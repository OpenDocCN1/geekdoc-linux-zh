    # Summary


    Two common types of attack are intrusion and denial of service. Secure your system
    by placing proper permissions on files and using the chattr command.


    Cryptographic applications offer another way to secure your Slackware host. They
    can help you make your data connections secure with a trusted host. You can secure
    most sessions with Secure Shell; secure your e-mail messages with PGP.


    Make a list of the activities and operations that are — and are not — allowed
    on your network; work it up into a detailed security policy.


    If you discover a suspected intrusion or scanning attempt, check the logs promptly
    to verify your concerns.'
