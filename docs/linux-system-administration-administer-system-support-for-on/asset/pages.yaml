- pgno: 257
  md: '# IN THIS PART


    Part III goes into detail on Linux security. In keeping with the book’s mission
    to make security a forethought instead of an afterthought, this part offers strategies
    for securing your host that can point you in the right direction as a system administrator.


    Chapter 8 shows how to manage user accounts properly – offering a way to plug
    one of the biggest and oldest security holes. Chapter 9 explains host security,
    examines the weapons available to hackers (such as Trojan horses) and advises
    how to protect against them. Chapter 10 is a look at disaster recovery, which
    includes preparing for emergencies, responses, and building back.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# ## Chapter 8


    # # Managing User Accounts


    # IN THIS CHAPTER


    +   - Deciphering who needs an account

    +   - Defining root access

    +   - Managing passwords

    +   - Examining users and groups

    +   - Exploring file permissions


    MANAGING USER ACCOUNTS is one absolutely crucial item assigned to system administrators,
    network administrators, and security administrators. User and password exploits
    are among the oldest tricks in the book, but they can still become security holes
    in systems weakened by account mismanagement and poor passwords. As a Linux system
    administrator, it''s up to you to maintain a good mindset for strengthening passwords
    and maintaining user accounts.


    # ## Who Needs an Account?


    First of all, you need your own user account on your system. It''s also important
    to determine who else may need an account on your system (friends, family, roommates).
    Even if you are the only person accessing your system, there are some important
    things to manage while running a Slackware Linux system.


    Don''t automatically use root, even if you''re the only one on the system. Separate
    user accounts idiot-proofs the system. If you are the only one who uses the system,
    and you accidentally type the following command


    ```

    ```

    $ rm -r /etc

    ```

    ```


    then you delete your entire /etc directory. If you are at the root directory,
    you just made your life very interesting (disasters often are). If you run this
    process from a user account (provided the permissions are set correctly), then
    life stays blessedly calm: you won''t delete the directory.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'For a crash course (no pun intended) on how to back up your system, see Chapter
    10.


    Even if you are the only user on your system, log in with a user account. Some
    benefits include these:


    +   - Customizable files that won''t affect all the users

    +   - You are less likely to do major damage to critical files

    +   - Protection from running commands that can accidently destroy your system


    If you customize your account (and you probably will), avoid altering the root
    account''s behavior. A mistake on your part (or some other unusual setting) may
    yield unpredictable results and change the only base account on the system. For
    that reason (among others), it''s best to avoid root for login purposes. To create
    a user account, run the command adduser as root, like this:


    ```

    bash# adduser

    ```


    When you run adduser, you''ll be prompted for several user characteristics; the
    first of these is username. Use the defaults unless you plan to use a particular
    numbering scheme for user identification. However, make sure this is a positive
    number to enable the account to log in. Another good approach is to decide on
    a group name and number (such as 600) and assign each user to this group with
    UID''s starting at the group number plus one (such as 601). More on UIDs later
    in this chapter.


    ```

    Login name for new user (8 characters or less) []: veritech

    User id for veritech [ defaults to next available]:

    ```


    Until you set a specific group or specific home directories, use the defaults.


    ```

    Initial group for veritech [users]:

    veritech''s home directory [/home/veritech]:

    ```


    These can be listed in /etc/shells to be changed later by the user or you can
    set a specific shell now.


    ```

    veritech''s shell [/bin/bash]:

    ```


    Unless they are a temporary account and you know the actual end date, go with
    the defaults.'
  merge: -1
  img_proc: true
