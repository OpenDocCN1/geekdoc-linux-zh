- pgno: 82
  md: 'full backup. You would recycle the tapes; when you''re ready to begin your
    eighth backup, reuse the first incremental backup tape. You can also re-format
    or erase the tape before rewriting over it.


    To back up your system, the easiest thing to do is use *tar*. Other backup programs
    are out there, but *tar* is available on every UNIX machine, free, and easy to
    use.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_82_0.png)


    > For the integrity of your backups, avoid using compression with *tar* (the -z
    option). If compression is on and the tape data gets scrambled, you will have
    major problems trying to restore your data.


    Listing 2-5 demonstrates an example script for a full backup.


    # Listing 2-5: Full backup example script


    ```

    ```sh

    #!/bin/sh

    # Full backup script. This can be updated to change the

    # date automatically, or the backup target.

    # REMEMBER! Do NOT use -z option with tar!

    echo "Mounting Tape Drive..."

    mount /dev/tapedrive

    cd /

    echo "Creating Full Backup..."

    tar -cvf /dev/tapedrive/full_backup_1July99.tar /*

    echo "Checking for backup file..."

    ls /dev/tapedrive

    echo "Unmounting Tape Drive...."

    cd : umount /dev/tapedrive

    echo "Done."

    ```

    ```


    Running this script will create a full backup and write it to the tape drive.
    Listing 2-6 shows an example of a script that runs an incremental backup.


    # Listing 2-6: Incremental backup example script


    ```

    ```sh

    #!/bin/sh

    # Incremental backup script. This can be updated to change the

    # date automatically, or the backup target. You can also change

    # the amount of time for an incremental backup.

    echo "Mounting Tape Drive..."

    mount /dev/tape /dev/tapedrive

    cd /

    echo "Finding files changed today..."

    find / -mtime -1 -print

    ```

