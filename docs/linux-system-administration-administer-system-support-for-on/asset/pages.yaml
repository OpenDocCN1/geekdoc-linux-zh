- pgno: 53
  md: 'from time to time. Some utilities included in your Slackware installation (such
    as `xload`, `top`, and `uptime`) can help you do this monitoring.


    You can use an X window application called `xload` to display average system load
    in a graph. The program reads `/dev/kmem`, a device file that contains the kernel
    memory. Figure 1-9 shows the `xload` display window.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_53_0.png)


    Figure 1-9: Viewing an Xload Window


    The graph that `xload` shows you should be relatively low (in other words, not
    right up near the system name). If you start getting CPU spikes – indications
    of excessive usage – use the `top` command. This command displays the top (that
    is, most processor-intensive) CPU processes, listing them from most to least intensive.
    If you''re performance-testing an application, `top` helps determine what''s eating
    away at your performance. Figure 1-10 shows what the `top` command should display
    in a terminal or in an `xterm`.


    Another nice feature of `top` is its interactive mode, which you can use to change
    the way the information is displayed. To put `top` in interactive mode, type this
    command:


    ```

    `# top -s`

    ```


    Figure 1-11 shows the `top` command in interactive mode.'
