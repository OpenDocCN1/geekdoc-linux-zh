  md: 'inodes is that they require less disk I/O and offer better performance. As
    with any large file, however, an oversize inode can eat too much disk space. Smaller
    inodes offer exactly the opposite advantage (and problem): you can save kilobytes
    of disk space but your disk I/O increases (because there are more inodes to access)
    and your performance isn''t as good.


