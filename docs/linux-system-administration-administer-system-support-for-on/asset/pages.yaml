  md: "```\n/lib/libvgagl.so.1.2.13: ELF 32-bit LSB shared object, Intel 80386, version\
    \ 1, stripped\n/lib/modules:\t\t\tdirectory\n```\n\nMany common binaries are also\
    \ dynamically linked. You can find them in /usr/bin, /usr/sbin, /usr/local/bin,\
    \ /bin, and /sbin. Keep in mind that these binaries use the libraries that reside\
    \ in the /lib directory; if not all file systems are mounted, then the system\
    \ can use only the files that are not dynamically linked when it does its work\
    \ – which can hamper performance. For that reason, don't place your libraries\
    \ in a separate partition; keep them in /lib. The following listing shows examples\
    \ of the dynamic (shared), libraries for files in the /bin directory that use\
    \ libraries in the /lib directory.\n\n```\n$ ldd /bin/*\n/bin/bash:\nlibtermcap.so.2\
    \ -> /lib/libtermcap.so.2 (0x400a0000)\nlibc.so.5 -> /lib/libc.so.5 (0x40000000)\n\
