- pgno: 286
  md: '**ATTRIBUTES** Attributes are added similarly to symbolic notation in `chmod`.
    A plus adds the attributes, a minus removes them, and an equals sign overrides
    any previous existing condition.


    +   * A   Don’t update a time, decreases disk I/O

    +   * S   Synchronous updates

    +   * a   Can only append to file, not delete or change

    +   * c   Compressed, file is stored as compressed; viewed or edited as uncompressed

    +   * i   File cannot be modified—immutable

    +   * d   Will not backup when dump is run

    +   * s   Secure deletion. When deleted blocks are zeroed and written back to
    the disk

    +   * u   Undeletable, if it is accidentally deleted, it can be recovered


    So, securing the /etc, /bin, /dev, and /usr directories is always a good idea.
    You can do this as root by typing


    ```

    # chattr -R su /etc /bin /dev /usr /home zImage

    ```


    This way if anything accidentally happens to the files, you’ve protected yourself.
    You’ll also want to shield your binaries by making them non-writable. This can
    help protect you from Trojan horses.


    ```

    # chattr -R +i /usr/bin /bin /usr/sbin

    ```


    You may have additional directories you’ll want to protect. These files are a
    starting point.


    # # Summary


    It is very important to have good account maintenance. As a system administrator,
    make sure that you give accounts to only users who need it on the system. For
    example, you should have many accounts on a mail server since they are designed
    for users. Whereas a firewall is not designed to be a user host, you should have
    as few accounts on it as possible.


    In addition to giving an account on your system, a user may need some additional
    super powers that root can give to ordinary users. This includes network connectivity
    through PPP, mounting disks, and even shutting down a host. If you feel someone
    needs that access but does not need entire root access, you can use the `sudo`
    command to divide up root accessibility. Or, if someone needs root access, they
    can use the `su` command. However, only one or two people at most should'
  merge: -1
  img_proc: true
- pgno: 287
  md: 'have root access to a host. Always do your account maintenance – get rid of
    or disable old accounts; make sure your users don''t pick weak passwords (such
    as their first names or the same passwords that access their user accounts).


    To strengthen passwords, it''s a good idea to shadow your password file. This
    way only root has read ability to the actual encrypted passwords, and the `/etc/passwd`
    file is used for getting shell and finger information. You might want to put a
    time limit on your host''s passwords as well, by enabling password aging.


    Now that you have accounts on your system, you''ll want to make sure their environment
    is set up properly. You can set them up in groups depending on their functionality
    to the system, and you can help them set up their shell properly, along with their
    personal account information. Because disk space is a precious item, you may want
    to enable disk quotas to keep users from eating up all your disk space.


    You also want to make sure file permissions are set properly. You don''t want
    to leave any file owned by root writable by anyone other than root. Also, check
    special bits like sticky bit and SUID bit. Those files could possibly become a
    back door to your system.'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# # Chapter 9


    # # Host Security


    # IN THIS CHAPTER


    +   * Examining attack types

    +   * Securing your system

    +   * Deciphering cryptographic applications

    +   * Creating a security policy

    +   * Establishing file integrity and system security


    THIS BOOK FOCUSES on security because administering a Slackware Linux system entails
    some basic security issues you should always keep in mind. Though such “common
    sense” may seem obvious, common sense isn''t common; a surprising number of people
    who should know better don''t take the time to do the basic maintenance that could
    secure their systems.


    # ## Types of Attacks


    If someone is attacking your system, the attack has two possible goals: (1) getting
    unauthorized access to your system (known as *intrusion*) and (2) bringing down
    the services or the host (known as *denial of service* or *DoS*). Whether someone
    is attempting unauthorized access to root or running the “ping of death” (one
    giant ping packet sent to crash your host), be prepared.


    # ### Intrusion


    *Intrusion* means someone is trying to get access to your Slackware system. Favorite
    methods range from the crude (brute-forcing passwords and user accounts) to the
    sneaky (remote exploits or the devious use of anonymous accounts like FTP).


    The assault need not be overly sophisticated. Hackers can test your account and
    password management by running programs like Crack, SATAN, and Tiger, or check
    the ports you have open and see what exploits are available on those ports. For
    example, if you have FTP open, the hacker can test basic accounts to Slackware
    Linux (such as *root*, *guest*, *satan*) and check for simple passwords – which,
    if they exist on your system, are a classic security weakness that a hacker'
  merge: -1
  img_proc: true
- pgno: 289
  md: "can breach right away by checking the passwords against a dictionary or using\
    \ usernames as the passwords.\n\n# PROGRAM EXPLOITS\n\nSomeone can access your\
    \ system by exploiting programs – wreaking havoc with SUID programs such as *passwd*\
    \ or (on a simpler level) causing buffer overflows, as by putting too much information\
    \ into a program like *finger* or *X1ock*, crashing the program and causing a\
    \ core dump. (A core dump contains everything in memory, which means that a skilled\
    \ attacker could possibly extract passwords from it.) Another program exploit\
    \ would be to set permissions like 666 for critical files. The possibilities for\
    \ mayhem are endless.\n\nThe most common program exploits today are buffer overflows.\
    \ They become possible when a programmer forgets to set an upper bound for data\
    \ input. An early release of *pine*, for example, choked if the From: field became\
    \ too long; all a hacker had to do was hold a key down:\n\n```\nFrom: hacker@reallycooooooooooooooooooooooooooooooooooooooooooooooooooooolsite\n\
    ```\n\nThis created a segmentation fault in the program, usually causing a core\
    \ dump. When a core file is dumped, it contains whatever was in memory at the\
    \ time. This may include passwords or other vital information to get root access.\n\
    \nOther common program exploits include improper permissions (such as allowing\
    \ a file to execute with SUID while any user can write to it). This enables users\
    \ to run commands through the program as root. an old *cfingerd* that uses this\
    \ security exploit. To patch it, you can run the program as *nobody* instead of\
    \ *root*.\n\nMany programs are susceptible to program exploits. *Sendmail* and\
    \ *finger* have been known to aggravate security problems in the past. Currently,\
    \ *imapd*, *named*, the Quake video game, *rsh*, and the Apache Web server are\
    \ known to be exploitable.\n\n> NOTE\n> \n> For more information on available\
    \ program exploits, see <http://www.rootshell.com>. CERT issues advisories on\
    \ applications as well. Check out <http://www.cert.org> for information on advisories.\n\
    \n# What Kind of Damage Can Program Exploits Do?\n\nProgram exploits made the\
    \ headlines in 1998 with two major computer break-ins. The first one that made\
    \ headlines was the Pentagon attacks. The FBI found three hackers guilty of the\
    \ attacks to the Pentagon servers, which is any considered any .gov server on\
    \ the Internet. Other hosts attacked were universities, including Berkeley and\
    \ MIT, and Lawrence Livermore National Laboratories."
