- pgno: 297
  md: '# TABLE 9-3 NMAP OPTIONS


    | **Options** | **Function** |

    |---|---|

    | -t | `tcp connect()` port scan |

    | -s | tcp SYN stealth port scan (must be root) |

    | -u | UDP port scan, will use MUCH better version if you are root |

    | -U | Uriel Maimon (P49–15) style FIN stealth scan |

    | -l (lowercase L) | Does the less-accurate UDP scan, even if root |

    | -P | ping "scan". Finds which hosts on specified network(s) are up. |

    | -D | Doesn’t ping hosts (needed to scan www.microsoft.com and others) |

    | -b | `<ftp_relay_host>` ftp "bounce attack" port scan |

    | -f | Uses tiny fragmented packets for SYN or FIN scan |

    | -i | Gets identd (rfc 1413) info on listening TCP processes |

    | -n | DNS doesn’t resolve anything unless you have to (makes ping scans faster)
    |

    | -p | `<range>` ports: ex: `-p 23` will only try port 23 of the host(s) `-p 20-30,63000-`
    scans 20-30 and 63000-65535 default: 1-1024 |

    | -F | Fast scan. Only scans ports in `/etc/services`, a la strobe(1). |

    | -L | `<num>` Number of pings to perform in parallel. Your default is: 50. |

    | -R | Tries to resolve all hosts, even down ones (can take a lot of time) |

    | -r | Randomizes target port scanning order |

    | -h | Help command. Also see `http://www.insecure.org/nmap`. |

    | -S | Use this if you want to specify the source address of SYN or FYN scan |

    | -T | `<seconds>`. Sets the ping and `tcp connect()` timeout. |

    | -V | Prints version number and exits |

    | -v | Verbose. Its use is recommended. Use twice for greater effect. |

    | -w | `<n>` delay. n microsecond delay. Not recommended unless needed. |

    | -M | `<n>` maximum number of parallel sockets. Larger isn’t always better. |

    | -q | Quashes argv to something benign (currently set to "pine"). |'
