  md: 'focusing on the TCP/IP network protocol. I have two practical reasons for doing
    so: (1) if your system includes data communications, you''re likely to encounter
    TCP/IP, and (2) TCP/IP and is a clear illustration of how a network protocol works.


    # ## TCP/IP Overview


    TCP/IP (Transmission Control Protocol/Internet Protocol) is the main networking
    protocol used for communicating over the Internet. As it happens, TCP/IP is native
    to UNIX – which means it''s native to Slackware Linux. As a Linux system administrator,
    you''ll probably find that a handy feature when you connect your system to the
    Internet (if not other networks).


    # ## Using the TCP Model


    The TCP model is similar to the OSI model, but it''s easier to remember because
    it uses fewer layers. TCP combines OSI layers 5, 6, and 7 – the Session, Presentation,
    and Application Layers, respectively – into its own Application Layer. OSI layers
    1 and 2 – Physical and Data, respectively into its Physical Layer. Table 11-2
    demonstrates the TCP model.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_364_0.png)


    If you''re called upon to remember a particular TCP layer and don''t have a chart
    handy, the following mnemonic device may help: **A** (**A**pplication) **T**iger
    **T** (**T**ransport) **N**ever (**N**etwork) **P**outs (**P**hysical).


    # TABLE 11-2 THE TCP MODEL


    | Number | Layer | Example |

    | :--- | :--- | :--- |

    | 4 | Application | ping, ftp, ssh, lynx |

    | 3 | Transport | TCP, UDP |

    | 2 | Network | IP address |

    | 1 | Physical | Cables, Network Interface Cards, MAC address |


    When your Linux system makes a connection to another machine (through ssh, for
    example), you use the command-line interface (at the Application Layer). Next,'
  merge: -1
  img_proc: true
- pgno: 365
  md: 'the application must decide how to send the data (which happens at the Transport
    Layer – in this case, TCP). Then, once it knows how to send the message, the application
    must decide where the data is going (which corresponds to the Network Layer –
    in this case, an IP address). The next vital bit of information is the physical
    address of the machine (known as the MAC address, which is on the Physical Layer).
    When the application knows all this, it sends the packet. The preparatory process
    that leads to this event is called *encapsulation*. When the packet is received,
    the whole elaborate ritual is reversed on the recipient’s side, a process called
    *de-encapsulation*.


    In-between encapsulation and de-encapsulation, however, the two systems connected
    via TCP/IP must actually “talk to” each other.


    # # Understanding Network Addresses


    The network address, or *IP address*, of each host consists of four sets of decimal
    numbers. The format looks like this:


    aaa.bbb.ccc.ddd


    Each three-digit number (represented here by `aaa` through `ddd`) can be a value
    from 0 to 256, totaling eight bits each. For example, my IP address might be (but
    isn’t really) 12.3.45.6. As long as you’re not connected to the Internet, you
    may choose any three-digit numbers you want. On the Net, however, certain numbers
    are not considered valid for addressing and are not used. Accordingly, when you
    establish your IP address, be sure you know beforehand how many networks – and
    how many hosts – you need.


    # # Network Classes


    The designation of a network as Class A, Class B, or Class C reflects two characteristics:
    (1) the initial octet and (2) how it groups the addresses that correspond to `aaa`,
    `bbb`, `ccc`, and `ddd`. Table 11-3 compares the network classes in IP; side by
    side, they’re not hard to tell apart.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_365_0.png)


    > If you’re interested in learning more about network addressing and more detailed
    areas of networking, read *The LINUX Network*, by Fred Butzen and Christopher
    Hilton, IDG Books Worldwide, 1998.'
  merge: -1
  img_proc: true
- pgno: 366
  md: 'TABLE 11-3 NETWORK CLASSES IN IP

    | Class | Initial Octet | Network Addresses | Host Addresses |

    | :--- | :--- | :--- | :--- |

    | A | 1-126 | aaa | bbb.ccc.ddd |

    | B | 128-191 | aaa.bbb | ccc.ddd |

    | C | 192-224 | aaa.bbb.ccc | ddd |

    | Reserved | 0, 127, 224-254* | n/a | n/a |


    > *Zero is not used, and 127 is used for the loopback address. 224-254 is reserved
    for other network uses including broadcasting.*


    As Table 11-3 illustrates, the numbers in the first part of a network address
    (the initial octet that corresponds to aaa) fall within a range that immediately
    reveals the network’s class. (Well, maybe not immediately, but certainly with
    practice.) So, quick quiz: Address 124.228.8.4 is in what class of network? (The
    answer is Class A.) The bad news is, this topic can get much more complex in a
    hurry; the good news is, not right now.


    # Naming Your Networks with DNS


    Most users don’t want to have to memorize numbers simply to get to another host
    on a network – and having to type numbers is almost as tedious for some. Instead
    of typing 128.227.8.4, for example, you could have typed maple.circa.ufl.edu.
    Such address names use the Domain Name Service (DNS) when you open a Web browser.
    For example, www.yahoo.com is the name that associates with any of several different
    IP addresses, depending on the network traffic.


    The DNS naming convention works in a manner similar to that of the UNIX file-system
    structure. You begin with a root nameserver (.), and from there, decide whether
    the address you’re sending to is government (.gov), commercial (.com), nonprofit
    organization (.org), network service provider (.net), or part of another country.
    All these designations are called top-level domains. Table 11-4 lists top-level
    domains for countries.'
  merge: -1
  img_proc: true
