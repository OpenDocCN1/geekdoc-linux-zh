    If everything goes smoothly (and it should), run `make zImage`. This will install
    a new kernel in `/usr/src/linux/arch/i386/boot`. The file will be called `zImage`.


    > When you''re compiling the kernel, you may find that time is standing still.
    You may want to get a few cups of coffee or read the paper while you''re kernel
    is recompiling. How long does it take? It depends on the size of your kernel,
    the speed of your processor, and what else you''re running. The smaller the kernel,
    the faster it will compile. The faster your process, the faster it will compile.
    If you''re not running other intensive applications (such as X), it will compile
    faster.


    If you added lots of drivers or support to your kernel, you may want to use `make
    bzImage`, as shown in Listing 6-14. This enables you to make a big image that
    can boot with all your options. I''ve included a small section of what you may
    see while you are creating the new kernel.


