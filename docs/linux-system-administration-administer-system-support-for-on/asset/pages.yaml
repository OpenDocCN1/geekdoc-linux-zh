- pgno: 409
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_409_0.png)


    Figure 12-4: Using the Netscape Web browser


    Another common text-based browser is Lynx, shown in Figure 12-5. Although Lynx
    enables you to view information on a Web page, sometimes the formatting needs
    to be tinkered with. It can offer some World Wide Web access, even if you don''t
    currently have X capabilities.


    Web servers, or HTTP daemons, can provide Web pages through port 80. These Web
    pages can also include CGI programs, Java, and JavaScript as well. You can run
    httpd through inetd if you wish (probably a good idea). Slackware comes with the
    Apache HTTP daemon. Apache is freeware and currently one of the most popular Web
    servers available.'
