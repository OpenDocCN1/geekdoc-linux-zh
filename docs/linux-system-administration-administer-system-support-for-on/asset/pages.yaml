    # # Defining root Access


    If you do need root access for something, there are two ways to use root without
    logging in as root. You can first give certain root privileges, such as shutdown
    or accessing mountable drives (CD-ROM, floppy) to certain users, or you can have
    root access without logging in to a specific terminal using the `su` command.


    # ## THE SUDO COMMAND


    If you want to use specific root commands like mounting CD-ROMs or dialing out
    to an ISP, root access can be divvied up with the `sudo` command. You can let
    certain users do some super user commands. It’s like a parent giving a teenager
    access to the family station wagon but not the Mustang.


    The information for the `sudo` users is in the `/etc/sudoers` file. To edit this
    file, become root and use the command:


    ```

    ```

    # visudo

    ```

    ```


    This creates the `/etc/stmp` file, which locks the `/etc/sudoers` file. This also
    prevents the file from being edited randomly.


    The syntax for the `/etc/sudoers` file is:


    ```

    ```

    Host_Alias   ALIASNAME=hostname

    Cmd_Alias    ALIASNAME=commands

    username       hostname=commands

    ```

    ```


    There are certain sections that are important to pay attention to with the `/etc/sudoers`
    file. The first section is the host alias specifications. Here you can specify
    remote hosts or servers. However, I would just specify your local machine unless
    you’re administering NFS securely.


    The next section is command aliases. If you wanted to group commands, this would
    be a great way to do so. For example, if you want to alias the shutdown commands
    to SHUTDOWN, you could use such commands as `/etc/halt`, `/etc/shutdown`, and
    `/etc/reboot`. For dialup, you could group the `ppp` commands (`/usr/sbin/ppp-go`,
    `/usr/sbin/ppp-off`) as PPP.


    When you’ve defined your hosts and commands, define which users have which abilities
    on which hosts.'
  merge: -1
  img_proc: true
- pgno: 262
  md: "![](img/8ad518fddafc7f5e73715a2604b61d50_262_0.png)\n\n> Be careful which hosts\
    \ you define. You could be trusting an unknown user with root access—which could\
    \ easily invite exploitation.\n\nSay you've got three hosts: a Web host, a main\
    \ host, and a development host. If you want to enable user *bob* to use your dialup\
    \ on the Web host, but you want to allow only user *judy* to shut down your main\
    \ host locally, your *`/etc/sudoers`* file would look something like this:\n\n\
    ```\n# This file MUST be edited with the 'visudo' command as root.\n#\n# See the\
    \ man page for the details on how to write a sudoers file.\n#\n# Host alias specification\n\
    Host_Alias    MAIN=hub:\\\n                REMOTE=web,devel\n# Cmnd alias specification\n\
    Cmnd_Alias    PPP=/usr/sbin/ppp-go,/usr/sbin/ppp-off:\\\n                SHUTDOWN=/etc/halt,/etc/shutdown,/etc/reboot\n\
    \n# User specification\nroot    ALL=ALL\nbob     REMOTE=PPP\njudy    MAIN=SHUTDOWN\n\
    ```\n\nIn the *`/etc/sudoers`* file, there is a certain syntax that this file\
    \ uses. If you are going to be using an alias for either hosts, commands, or users,\
    \ it must be in all capital letters. The aliases *ALL* and *NONE* are already\
    \ defined. As in the example just given, *root* is defined for all commands on\
    \ all hosts. However, *bob* can only run *PPP* commands on *REMOTE* hosts, and\
    \ *judy* can only run *SHUTDOWN* commands on the *MAIN* host. You can also disable\
    \ users from having any type of *su* access by denying them with *NONE*.\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_262_1.png)\n\
    \n> Remember that allowing any type of root access to any user other than the\
    \ administrator can be a possible security problem. If you do so, you are trusting\
    \ your users with the power to run commands as root, and this power can be exploited\
    \ by anyone who wants complete root access badly enough. On the upside, the trusting\
    \ work environment you create by such sharing of responsibility may deter users\
    \ from trying to get root access. Use your best judgment."
  merge: -1
  img_proc: true
- pgno: 263
  md: '# ROOT ACCESS WITH SU


    If you’re logged in to a user account and want root access just for a minute,
    it’s inconvenient to log out of your user account, log in as root, log out as
    root, and then log back in to your user account. Fortunately the Linux su command
    can save you some hassle: it provides a temporarily login to another user’s account
    without making you log out of your user account. The su command is very powerful,
    especially for obtaining root access.


    The su command defaults to root access. If I’m using my personal account to log
    in to su, for example, it would look like this:


    ```

    $ su

    Password:

    bash#

    ```


    I would get prompted for the root password. If I didn’t type in the root password
    correctly, I wouldn’t get the root prompt. Such a fumble might look like this:


    ```

    $ su

    Password:

    Sorry.

    ```


    If you want to log in as a specific user, you would use the su command followed
    by the username.


    ```

    $ su stripes

    ```


    If you use the dash (“-”) after the su command, this reads the user’s environment
    from the .profile or .cshrc file. When becoming the root user, you should use
    the dash whenever possible, without it, you may be taking lax features of your
    own account and applying them to the things you do as root – this includes your
    Umask setting, and your $PATH variable. If you have a “dot” in your path, root
    will have a dot in its $PATH if you don’t use su with a dash. So, in most cases
    use this command:


    ```

    $ su -

    ```


    However, you can control who can use the su command, and whether they need a password.
    This is supplied in the /etc/suauth file. With the /etc/suauth, you can deny users
    from using su, make them use their own password for access, or not require a password
    at all.


    The syntax of the commands in the /etc/suauth file look like this:


    ```

    whoyouwanna t o : who you are : what you can do

    ```'
  merge: -1
  img_proc: true
- pgno: 264
  md: 'An example `/etc/suauth` can *prevent* all users except `bob` from getting
    root access, and enable users `dbadmin` and `judy` to get in without passwords
    (because they are the same person). One really cool thing about the `/etc/suauth`
    file is that you can define `all except` a particular group or user to have specific
    access.


    ```

    # /etc/suauth file

    #

    # Only Bob can su to root.

    root:ALL EXCEPT USER bob:DENY

    #

    # Because Judy is our database admin, we should let her

    # into her own accounts without having to prompt for

    # a password

    judy:dbadmin:NOPASS

    dbadmin:judy:NOPASS

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_264_0.png)


    > I don’t recommend letting users into root without a password or using their
    own password. Even if you do trust yourself, if a hacker gains access to your
    account, they would automatically have root.


    # Deciding Who Should Be on Your System


    To minimize risk, make sure you can manage all accounts that are open on your
    system. This means allowing access to only those people who need access. Because
    each account is an entrance way, and most of the keys (passwords) are easy to
    duplicate, you don’t want to have too many accounts lying around. When you give
    people access to your system, think of what benefits they get, and what benefits
    you might get (they might be great programmers).


    # Creating Back Doors with Old Accounts


    If a person is no longer around to use the system and you don’t want anyone to
    access it remotely, `get rid of the account`. Old accounts are one more key that
    a hacker can pick up, and once that’s happened, finding out the available user
    accounts can be pretty simple. If you need to keep an ex-user’s files around,
    move them to a public directory, such as `/usr/local/oldaccounts`, or back them
    up onto removable media.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Password Management


    In addition to properly managing accounts, it''s important to manage passwords
    and password files. This means attention to detail: Don''t leave the password
    file writable by anyone but root. Pick – and enforce – good passwords. You can
    enforce your rules on passwords by running Crack against your /etc/passwd or /etc/shadow
    file to see how quickly the user-account passwords break.


    # Understanding Password Files


    One of the most important files in system administration is the /etc/passwd file.
    Most user and group information is available from this file. Matter of fact, sometimes
    the passwords are available from this file. Other information, like the information
    available from finger (such as home phone) is also available in this file. The
    default permissions on this file are 644.


    A user entry would look something like this:


    ```

    user:password:UID:GID:Name,Room#,Work#,Home#,OtherInfo:home:directory:usershell

    ```


    There is much extra information that can be grabbed from the /etc/passwd file;
    not only that, the password is optional. The inactive accounts are marked with
    the * in the password field. The default /etc/passwd file in Slackware looks like
    the following:


    ```

    halt:*:7:0:halt:/sbin:/sbin/halt

    operator:*:11:0:operator:/root:/bin/bash

    root:jHg1DqoCJPlY:0:0::/root:/bin/bash

    shutdown:*:6:0:shutdown:/sbin:/sbin/shutdown

    sync:*:5:0:sync:/sbin:/bin/sync

    bin:*:1:1:bin:/bin:

    ftp:*:404:1::/home/ftp:/bin/bash

    daemon:*:2:2:daemon:/sbin:

    adm:*:3:4:adm:/var/adm:

    lp:*:4:7:lp:/var/spool/lpd:

    mail:*:8:12:mail:/var/spool/mail:

    postmaster:*:14:12:postmaster:/var/spool/mail:/bin/bash

    news:*:9:13:news:/usr/lib/news:

    uucp:*:10:14:uucp:/var/spool/uucppublic:

    man:*:13:15:man:/usr/man:

    games:*:12:100:games:/usr/games:

    nobody:*:65534:100:nobody:/dev/null:

    ```'
  merge: -1
  img_proc: true
- pgno: 266
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_266_0.png)


    > Don''t leave the password field blank, especially in the root entry. This is
    considered an open account, inviting even the most amateur of hackers.


    Other password files include `/etc/passwd.nttp` for USENET spooling and `/etc/d_passwd`
    for dialup access. There may be other password files on your system that might
    be application-dependent such as databases.


    # # Picking Good Passwords


    For picking a good password, define what''s a bad password.


    # ## Bad Passwords


    The following defines bad passwords:


    +   - Words available in the dictionary (in any language)

    +   - The username (spelled forward or backward)

    +   - Proper names like your own, your pet''s, your family''s

    +   - License or account numbers

    +   - Birthdays

    +   - Street addresses

    +   - Phone numbers

    +   - Written-down items


    In this case, people pick something easy to remember. However, if they don''t
    pick something easy to remember, they might write it down somewhere. If a hacker
    has physical access to your computer or decides to comb through your trash, you
    might have a problem because you made his job a lot easier.


    # ## Good Passwords


    Here''s a suggestion list for creating good passwords:


    +   - Mix uppercase and lowercase characters

    +   - Mix alphabetical and numerical characters

    +   - Include punctuation

    +   - Don''t make up anything logical (the *logical* choice is an illogical password)

    +   - The password should look something *like* a personalized license plate,
    but shouldn''t *be* one.'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'One way to make a password you''ll remember is to think of a phrase you can
    fit on a license plate. An example of an easy-to-remember phrase is TNSTAAFL (There''s
    No Such Thing As A Free Lunch) — though of course you should not use that precise
    word or anything else you see published. The letters don''t make a word or (by
    themselves) any sense. One workaround is to get creative; you can do something
    like this:


    ```

    tnST8B8FL

    ```


    Alternating capital and lowercase letters and replacing the As with 8s results
    in an example that''s fairly easy to remember but doesn''t make much obvious sense.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_267_0.png)


    > I know you won''t but I''m duty-bound to say it: *Please don''t use the example
    password*. Using any such item unchanged results in a bad password. If you must
    use common phrases, change some letters to numbers or punctuation. Even that''s
    dicey; some *password-cracking* dictionaries check for the first letters of a
    common phrase.


    # Enforcing Good Passwords


    The reason it''s important to pick good passwords is it creates a strong encryption
    on the password in the password file. The password field in the `/etc/passwd`
    or `/etc/shadow` file is based on NBS DES encryption and is currently very secure.


    When you log in to an account, you''re running the command `login`. When you type
    your password in, your password is then encrypted with the encryption scheme and
    compared against the encrypted password in the `/etc/passwd` or `/etc/shadow`
    file. If there is a match, your login is accepted. If it is not accepted, you''ll
    get the following:


    ```

    gator login: bob

    Password:

    Login incorrect


    gator login:

    ```


    Because it''s not the encryption that''s broken, but a combination of password
    encryptions and salts are used to recreate the password, it would be good for
    you to run a dictionary cracking program against your own system. Crack is one
    most common password-cracking programs and is currently available on the Internet.
    You can find Crack and the Crack libraries at the following ftp sites:'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'http://coast.cs.purdue.edu/pub/tools/unix/crack

    http://coast.cs.purdue.edu/pub/tools/unix/cracklib


    ![](img/8ad518fddafc7f5e73715a2604b61d50_268_0.png)


    > If you run a system for someone else, or a company, you may want to let your
    clients or coworkers know *before* you run a cracking tool against their system.
    Otherwise they may get the wrong idea and make your life as an administrator more
    “interesting” than it has to be.


    Fortunately, power can have appropriate privileges as well as responsibilities;
    if you''re operating as root and you''re unhappy with a user''s password you can
    change it with this command:


    ```

    # passwd username

    ```


    Using the `passwd` command by itself changes the password for the user who launches
    the command. The wise administrator uses this command with care.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_268_1.png)


    > Before you use `passwd`, make sure you know exactly which password you are changing,
    for which account, and *from* which account. If you launch `passwd` after you
    have used the `su` command to become root, you''ll change the password for the
    root account.


    As you might expect, the root account can operate powerfully on other accounts
    with the `passwd` command – for instance, you can lock an account, check user
    status, change group passwords, or add password aging. At this point, we''re back
    to the responsibilities of administrative power.


    # Investigating Password Aging


    The most secure passwords are so partly because they have a certain finite lifetime.
    An administrator can require a user not to use the same password forever, for
    a simple security reason: If a password remains unchanged for a long time, it
    becomes weaker and easier to break. An intruder might appreciate being given all
    the time in the world to run cryptanalysis on encrypted data, but nobody else
    will like the result.


    In the `/etc/shadow`, the command that controls aging looks like this:


    ```

    :encryptedpassword, lastchange:minidays:maxdays:warn

    ```'
  merge: -1
  img_proc: true
- pgno: 269
  md: "The *last change* (`lastchange`) is reflected in the number of days since January\
    \ 1, 1970 (this is when the world was created, according to UNIX). This number\
    \ changes after the maximum number of days has passed.\n\nThe *minimum days* (`mindays`)\
    \ field shows how many days a user must use their current password before being\
    \ enabled to change it.\n\nThe *maximum days* (`maxdays`) field shows how many\
    \ days a user has left with their current password before being forced to change\
    \ it.\n\nThe *warning days* (`warn`) field shows how many days before a password\
    \ expires that a user is warned.\n\nIf you want to force your users to change\
    \ passwords at next login, add “,...” to the end of the password. An example follows:\n\
    \n```\nveritech: jHGlDqoCCJlp1Y...::1001:100:Rick Hunter,...,/home/veritech:/bin/bash\n\
    ```\n\nIf good security demands that you require frequent password changes, you\
    \ would use the Linux command `chage` to enable root to set password aging:\n\n\
    ```\nbash# chage -m 1 -M 300 -W 5 bob\n```\n\nYou can do the same thing with the\
    \ `passwd` command:\n\n```\nbash# passwd -x 300 -n 1 -w 5 bob\n```\n\nThis example\
    \ sets bob's password for 300 days (the `-M`), and he has to keep the password\
    \ at least one day (the `-m`). If he's had the same password for 295 days (300\
    \ - 5), he'll be warned (the `-W`) that he needs to change his password.\n\nTo\
    \ see bob's password information, use the `-l` option:\n\n```\nbash# chage -l\
    \ bob\nMinimum:\t1\nMaximum:\t300\nWarning:\t5\nInactive:\t-1\nLast Change:\t\
    Jun 20, 1998\nPassword Expires:\tApr 16, 1999\nPassword Inactive:\tNever\nAccount\
    \ Expires:\tNever\n```\n\nThough `chage` is primarily for use by the root account,\
    \ any user can use the `chage` command with `-l` (L, not 1) option to view password-aging\
    \ information."
  merge: -1
  img_proc: true
- pgno: 270
  md: '```

    $ change -l bob

    Minimum: 0

    Maximum: 99999

    Warning: 7

    Inactive: -1

    Last Change: Jun 20, 1998

    Password Expires: Never

    Password Inactive: Never

    Account Expires: Never

    ```


    In this case, no password aging is enabled. The password maximum is unlimited
    (99999), and you can see that the account is active (negative number in the inactive
    field). You can see when your password was set.


    # # Using Shadow Passwords


    Because the /etc/passwd file is used by other programs that don''t use it for
    passwords, it should be kept readable by everyone (more on permissions later).
    To get additional control over the passwords in this file, you can separate the
    actual passwords into another file that''s only readable by root and call it /etc/shadow.
    This is stronger security than you get from the /etc/passwd file by itself. All
    your accounts need at least some of the contents found in /etc/passwd; the /etc/shadow
    doesn''t. To change to such a shadowed password environment, run pwconv as shown
    here:


    ```

    bash$ pwconv

    ```


    You''ll see that your password file has changed. Instead of encrypted passwords,
    it shows a group of x''s. You could probably use any character for that purpose,
    since the /etc/shadow password information supercedes anything in the /etc/passwd
    file. For now, just leave the x''s. The code that brings about this change looks
    like this:


    ```

    bash$ cat /etc/passwd

    halt:x:7:0:halt:/sbin:/sbin/halt

    operator:x:11:0:operator:/root:/bin/bash

    root:x:0:0:root:/bin:/bin/bash

    shutdown:x:6:0:shutdown:/sbin:/sbin/shutdown

    sync:x:5:0:sync:/sbin:/bin/sync

    bin:x:1:1:bin:/bin:

    ftp:x:404:1::/home/ftp:/bin/bash

    daemon:x:2:2:daemon:/sbin:

    adm:x:3:4:adm:/var/adm:

    lp:x:4:7:lp:/var/spool/lpd:

    mail:x:8:12:mail:/var/spool/mail:

    postmaster:x:14:12:postmaster:/var/spool/mail:/bin/bash

    news:x:9:13:news:/usr/lib/news:

    ```'
  merge: -1
  img_proc: true
