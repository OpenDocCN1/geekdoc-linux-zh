- pgno: 413
  md: 'The example just given controls access to the Web server. The way it''s currently
    defined, it seems willing to allow access to anyone. The order is to read the
    allowed sites first—and then, if they are denied, drop them. You can also define
    whether you want a particular site to come through, like this:


    ```

    ```text

    </Directory>


    # /usr/local/etc/httpd/cgi-bin should be changed to whatever your ScriptAlias
    # CGI Directory exists, if you have that configured.


    <Directory /usr/local/etc/httpd/cgi-bin>

    AllowOverride None

    Options None

    </Directory>

    ```

    ```


    This defines where the CGI binaries are located. The next concern is status reports:


    ```

    ```text

