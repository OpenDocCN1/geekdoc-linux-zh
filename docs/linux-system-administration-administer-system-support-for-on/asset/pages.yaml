    \nA *kernel panic* happens when something goes wrong with the kernel. For example,\
    \ if you are using the wrong kernel to boot from, you may have a kernel panic.\
    \ Another thing that may cause a kernel panic is a corrupted file system or device\
    \ file. When a kernel panics, generally it will try to reboot, and create its\
    \ own timeout countdown before rebooting. However, sometimes the system will just\
    \ come to a halt.\n\nListing 6-1 is a *panic.c* code listing that shows the kernel\
    \ starting a timer and trying to reboot to correct the problem. As you examine\
    \ it, pay particular attention to the comments."
