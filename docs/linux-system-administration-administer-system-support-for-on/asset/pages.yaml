- pgno: 203
  md: '5. **Networking options** – If you want to have TCP/IP, IPX, AppleTalk, or
    other protocols defined, have them built into the kernel. Also, if your Slackware
    host is a firewall or router, you can compile the options you need in this area.
    This also includes IP masquerading (hiding invalid IP addresses behind one IP
    address), IP multicasting, and IP forwarding. You can also compile additional
    packet logging support for firewalls here as well. Because my host is going to
    be a firewall, I’ve compiled these options. Unless you have two network interface
    cards and you’re not doing routing, you probably want to leave the firewall stuff
    alone. Even if you’re not going to be using a network interface card and you are
    going use PPP or SLIP instead, compile in TCP/IP networking. This defines how
    and what type of protocols and IP configuration, as shown in Figure 6-7.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_203_0.png)


    Figure 6-7: Networking options


    6. **SCSI support** – This section is for SCSI drivers. Depending on your hardware,
    you’ll probably want to add SCSI support and SCSI disk support. Though I have
    an IDE/ATAPI drives and a PCI motherboard, I want to have SCSI support and SCSI
    disk support included in the kernel. The reason: I have a Zip drive. Though my
    Zip drive runs through the parallel port, the kernel recognizes it as a SCSI device
    (`/dev/sd4`). If you have SCSI drives, go farther down through the list to ensure
    that your hardware is supported. It’s no fun to have a 5GB hard drive you can’t
    use. The SCSI support options are shown in Figure 6-8.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_204_0.png)


    +   7. SCSI low-level drivers – This section is for defining specific SCSI drivers
    such as those for Iomega Zip drives and UltraStor drives. If you are using something
    that specific and you don’t need the rest of the SCSI support, it helps you keep
    the kernel as small as possible. As a result, the kernel will load faster. In
    my case, I’ll only choose the option for Iomega Zip drive support. I’ll select
    it as a module so I can plug it in and unload it on the fly. The SCSI low level
    drivers are shown in Figure 6-9.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_204_1.png)


    +   8. Network device support – Remember the TCP/IP networking (or any other type
    of networking) you enabled in the networking options? Here’s where you define
    how you’re going to access those networks. This includes Network Interface Card
    (NIC), PPP, SLIP, Token Ring, and portable device interface cards. In my firewall,
    I would enable the correct versions of the'
  merge: -1
  img_proc: true
- pgno: 205
  md: 'NIC that I''m using. However, if I''m using PPP on another computer, I would
    enable that so I can connect to my ISP. You can have multiple network interface
    card support and PPP at the same time. An example of the Network Device Support
    options is Figure 6-10.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_205_0.png)


    Figure 6-10: Network device support options


    **9. ISDN subsystem** — This screen is for enabling ISDN support. ISDN is a way
    to have a high-speed connection to a network or the Internet. If you''re not paying
    the extra money for it, or if work''s not giving you access to ISDN, you don''t
    have it. Skip over this and move on to the next section. Figure 6-11 shows an
    ISDN support screen.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_205_1.png)


    Figure 6-11: ISDN subsystem options'
