- pgno: 36
  md: 'Great! You’ve got your boot disks. The next step is to make sure you have enough
    space on your hard drive to accommodate a Linux partition.


    # ## Partitioning Your Hard Drive


    To get Linux working, make sure you’ve got at least 250MB free. With today’s hard
    drives being at least a gigabyte, this shouldn’t be a problem. The easiest way
    to start out is with a blank hard drive, format it entirely for Linux, and then
    install the software. However, in the real world, many people do run Windows 95
    (or other operating systems), so partition your disk accordingly.


    Common IDE Disk Partitions:


    +   ❖ `/dev/hda` — Primary IDE drive on first IDE controller


    +   ❖ `/dev/hdb` — Secondary IDE drive on first IDE controller


    +   ❖ `/dev/hdc` — Primary IDE drive on secondary IDE controller


    +   ❖ `/dev/hdd` — Secondary IDE drive on secondary IDE controller


    Common SCSI Disk Partitions:


    +   ❖ `/dev/sda` — First SCSI disk


    +   ❖ `/dev/sdb` — Second SCSI disk


    +   ❖ `/dev/sdc` — Third SCSI disk


    +   ❖ `/dev/sdd` — Fourth SCSI disk


    Other Common Disk Partitions:


    +   ❖ `/dev/fd0` — First floppy drive


    +   ❖ `/dev/sda4` — Parallel port IOMEGA Zip drive


    On my computer, `/dev/hda` is my hard drive and `/dev/hdd` is my CD-ROM drive.
    Partition Magic shrinks, enlarges, deletes, and creates partitions on the fly.
    This product does work well with Linux and does recognize Linux partitions. If
    you don’t want to spend the money on a commercial product, Slackware comes with
    FIPS. FIPS is a non-destructive way of repartitioning your hard drive, just as
    Partition Magic is. However, back up your disk before changing your partitions
    just in case.


    You can always do the “Seek and Destroy” method. This also works. Here are the
    steps to make sure you have a fail-safe way of allocating disk space:


    +   1. Back up your data from your Windows 95, NT, or OS/2 partition (you may
    have another compatible operating system). If you’re running Windows'
  merge: -1
  img_proc: true
