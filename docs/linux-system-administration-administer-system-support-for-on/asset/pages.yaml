- pgno: 362
  md: '# Chapter 11


    # Networking Linux


    # IN THIS CHAPTER


    +   - Enhancing your understanding of networking

    +   - Overiewing TCP/IP

    +   - Examining network files

    +   - Using dial-up connections

    +   - Understanding other networking protocols


    If YOUR SYSTEM encompasses more than one computer, then (as a system administrator)
    you need an ever-increasing understanding of networks – whether single local-area
    networks, conglomerates-of-LANs known as wide-area networks (WANS), enterprise-wide
    in-house networks, or the Internet itself.


    # Why Networking Is Important


    Today there are more good reasons than ever to understand networks. One is the
    Internet itself, where most people connect for business or personal communication.
    With many people and companies becoming connected to the Internet, many companies
    are starting to use Internet technologies within their corporate borders for information
    resources and ease of use.


    With this accessibility of information, people have discovered that connectivity
    increases productivity. With increased networking, you get an increased availability
    of services. Some of these services include HTTP, FTP, Secure Shell, and NTP.
    The two complement each other well.


    However, another issue is ease of connectivity – and ease of intrusion. If your
    host is located to a local-area network (LAN), you have increased your chances
    of a break-in. The reason is because you''ve increased the number of hosts that
    can access your host.


    In a somewhat scarier scenario, Internet connectivity means that millions of hosts
    now have access to your host – in effect, anyone else connected to the Internet
    can get access to your Slacker host. All a potential attacker needs is to find
    out your IP address and hostname. Of course, this risk exists only when you are
    connected to the Internet; if you are using a PPP connection, you are only at
    risk when you are connected.'
  merge: -1
  img_proc: true
- pgno: 363
  md: '> If you are always connected, heavier security measures are needed — for example,
    using barriers such as firewalls and setting up IP masquerading to hide your true
    network address.


    > Chapter 9 discusses host security and offers some ways to reduce risk.


    # Networking Protocols


    There are several different ways that computers can talk to each other. It’s the
    same way people talk to each other in different languages: English, Japanese,
    French, Hebrew, or Pig Latin. Computers use a protocol—a seven-layer set of agreed-upon
    standards—to establish correct operation for the devices on a network. One highly
    influential way of displaying network protocols is the OSI (Open Systems Interconnection)
    model, shown in Table 11-1.


    **TABLE 11-1 THE OSI MODEL**


    | Number | Layer | Example |

    | :--- | :--- | :--- |

    | 7 | Application | User interface, command line |

    | 6 | Presentation | Data formats such as JPEG, MPEG, and text |

    | 5 | Session | Zone Information Protocol (ZIP) |

    | 4 | Transport | TCP and UDP |

    | 3 | Network | IP, RIP, ICMP |

    | 2 | Data | Ethernet, Token Ring |

    | 1 | Physical | Cables, Network Interface Cards |



    Note that everything in the OSI model “rests” on the bedrock of the Physical Layer
    (Layer 1). Although the Table 11-1 shows TCP as a Transport Layer protocol and
    IP as a Network Layer protocol, let’s keep the discussion straightforward by'
