    # ## Unique Files


    In addition to directories, files, and devices, Linux uses other special files
    such as character files, block files, named pipes, and sockets. Each special type
    of device file has its appropriate capabilities; for example, device files for
    terminals, mice, tape drives, consoles, and modems can take standard input and
    standard output.


    *Character files*, identified by a single character, are “raw” files accessed
    through the kernel. The “cooked” files the complement of the “raw” files are block
    files. *Block files* can correspond to specific hardware such as floppy drives
    (for example **/dev/fd0**), hard drives (the devices **/dev/hda**-**h**) and **/dev/sda**-**h**),
    as well as to memory. All these devices can be used if the appropriate device
    file is mounted'
