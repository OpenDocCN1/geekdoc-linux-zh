- pgno: 293
  md: '**An Early Slackware Back Door (Continued)**


    Fortunately, progress happens. Today you will not find the **sample_users.tgz**
    on any new Slackware distribution. Of course, you can create your own sample users
    (with their very own password protection) by using the **adduser** command. Just
    be careful what you call them.


    What this would do is send a flood of ICMP packets to port **80** on **some.web-server.org**.
    It''s like being in a room with a hundred people and everyone trying to talk to
    you at once. So, what do you do? You shut down and don''t listen to anyone. The
    computer does the same thing. It will shut down the port; since this is the Web
    server daemon, the Web server would shut down.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_293_0.png)


    Don''t do this unless it''s a test of your own Web server. This gambit is easily
    traceable and people have gone to jail for it.


    # Securing Your System


    Before securing your system, you''ll need to know three basic aspects of host
    security: authorization, authentication, and integrity. **Authorization** is giving
    someone permission to have access to data. **Authentication** is verifying the
    identity of the authorized user; *maintaining file integrity* is keeping the data
    in a usable and trusted form. Table 9-1 shows examples of each.


    # TABLE 9-1 BASIC ASPECTS OF HOST SECURITY


    | Aspect of Security | Definition | Example |

    | :--- | :--- | :--- |

    | Authorization | Giving permission to have access | Username, first name, identification
    number, permissions |

    | Authentication | Verification of authorized user | Password, thumbprint, digital
    signature |

    | Integrity | Keeping the data usable and trusting | Checking for changes in file,
    backups |'
  merge: -1
  img_proc: true
- pgno: 294
  md: 'Even if you don''t have any nuclear secrets on your Slackware system, you still
    don''t want to have to recreate all the hard work you did to get your system fine-tuned.
    If someone breaks into your system, you don''t want to be in this predicament.
    You can end up losing your job, answering legal questions sent to you by an attorney,
    or subject to other nasty consequences.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_294_0.png)


    > Chapter 8 provides detailed information on managing accounts — not only for
    user accounts, but also managing the services and applications used on your system.
    As an important step in this direction, you may want to review the insecure applications
    mentioned in this chapter — and secure them.


    Hackers are looking to *root your system* – to obtain root access without asking
    you for the password. This section details with how to prevent this from happening.


    # ## Run Only the Necessary Daemons


    Daemons are detached processes that run in the background. Depending on the daemon,
    it most likely will run as root. Because the daemons run in the background, you
    don''t control them as they are running since they don''t run in the terminal
    directly.


    A basic defensive strategy against program exploits that target network daemons
