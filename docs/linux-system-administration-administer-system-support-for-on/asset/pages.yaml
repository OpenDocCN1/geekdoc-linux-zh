  md: "# itimer.c\n\nAn *interval timer* (itimer.c) helps set the system clock and\
    \ other Linux timing functions, as shown in Listing 6–8.\n\n# **Listing 6–8: Using\
    \ itimer.c**\n\n```\n```\n/*\n * linux/kernel/itimer.c\n *\n * Copyright (C) 1992\
