- pgno: 385
  md: 'The /etc/hosts.enable and /etc/hosts.deny will control connectivity at the
    host and not the user level. This enables you to define the trusted hosts and
    let them in, or the reverse. You can defend the untrusted hosts and trust everyone
    else. This depends on the type of services you are offering on that host and what
    type of access you want to allow.


    Here is a sample /etc/hosts.allow to illustrate the point:


    ```

    # hosts.allow This file describes the names of the hosts which are

    #    allowed to use the local INET services, as decided by

    #    the ''/usr/sbin/tcpd'' server.

    #

    # Version: @(#)etc.hosts.allow  1.00    05/28/93

    #

    # Author: Fred N. van Kempen, <waltje@uWalt.NL.Mugnet.Org

    #

    # Allow all mail traffic through

    in.smtpd: ALL


    # Do not allow any telnet connections except for the trusted host on

    # tigerlair.com

    telnetd: LOCAL, trusted.tigerlair.com

    # End of hosts.allow.

    ```


    ![](img/8ad518fddafc7f5e73715a2604b61d50_385_0.png)


    > Keep in mind that authenticating by host name is not the most secure method.
    This can easily be spoofed by an untrusted host.


    The next code snippet shows a sample /etc/host.deny that blocks access to anyone
    listed in the file. Of course, you could decide not to allow anyone on your system
    at all — but even paranoia has practical limits.A more reasonable example might
    be setting your network applications to filter out known spammers so your mail
    gateway can remain uncluttered, like this:


    ```

    #

    #

    # hosts.deny This file describes the names of the hosts which are

    # *not* allowed to use the local INET services, as decided

    #    by the ''/usr/sbin/tcpd'' server.

    #

    # Version: @(#)etc.hosts.deny  1.00    05/28/93

    #

    # Author: Fred N. van Kempen, <waltje@uWalt.NL.Mugnet.Org

    ```'
  merge: -1
  img_proc: true
