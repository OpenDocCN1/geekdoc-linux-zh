- pgno: 428
  md: '# Setting the Home Page


    When you have your Web server configured the way you''d like, you can create a
    test home page. Before you actually do so, you''ll want to create the directory
    public_html on your user account and set the correct permissions, like this:


    ```

    $ mkdir ~/public_html

    $ chmod 755 ~/public_html

    $ cd ~/public_html

    ```


    Now, you''ll want to create a test Web page (use vi or your favorite editor):


    ```

    $ vi index.html

    ```


    Your page should have the basic contents of:


    ```

    <html>

    <pre>

    Hello Whirled!

    </pre>

    </html>

    ```


    Then set the permissions on the file:


    ```

    $ chmod 755 index.html

    ```


    When this is done, test your home page by opening up the URL http://localhost/~username/.
    You should see something like Figure 12-8.'
  merge: -1
  img_proc: true
- pgno: 429
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_429_0.png)


    # # Examining USENET


    Back before the Web, USENET was among the most popular forums for online discussion.
    USENET is divided into newsgroups such as `comp.os.linux` and `alt.shenanigans`.
    The newsgroups have a hierarchy (as does the UNIX file structure), and now have
    an archive.


    However, on Slackware Linux there are several mediums to reading USENET. They
    include `trn`, `nn`, `tin`, `pine`, and `emacs` (yes, the last two are correct).
    The `trn` news reader will group your news articles by thread, which makes them
    much easier to read, as shown in Figure 12-9.'
  merge: -1
  img_proc: true
- pgno: 430
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_430_0.png)


    # ## Exploring Dangers of the Internet


    Although the Internet has many advantages, it''s important to remember there are
    some not so friendly aspects.


    # ### Hackers


    One critical danger of being connected to the Internet is the number of people
    who have access to your Slackware host — including hacking groups such as MilWorm,
    the Enforcers, and the Masters of the Download. You''ll also need to look out
    for novice hackers who are looking for sites to cut their teeth on.


    The more popular your site, the more likely you are to have attempted attacks.
    The exposure to hackers is a risk to take if you''re connecting to the Internet.
    However, just be prepared. One step you can take is to break into your own site
    to test its security, using port scanners obtained from the outside.'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# Is There Such a Thing as a Good Hacker?


    When people think of hackers, they think of someone trying to break into a computer.
    The hackers, people who tinker with the system, prefer to think of those who break
    in maliciously as “crackers” because they break things. One group out there —
    Ethical Hackers Against Pedophilia — uses hacking techniques to carry out an online
    crusade. Their mission is to protect the innocent against evil. Their goal is
    to get rid of exploitation of children on the Internet. What they do is bring
    down sites that are producing child pornography, and then they take legal action.


    Ethics issues return to the table at this point: Even though child pornography
    is illegal, does hacking their sites make the hackers better people? It depends
    on what you consider more of a crime: child pornography or hacking. You can see
    the Ethical Hackers Against Pedophilia home page at http://www.hackers.com/e hap
    /index2.htm.


    # Spammers


    I hate to find junk mail in my mailbox when I come home from work. I have to throw
    all this stuff out (or recycle it, depending on what it’s printed on), and then
    finally get to my bills and even some letters. Consider a similar situation: Someone
    on the Internet has decided to send messages to all newsgroups, or farm e-mail
    addresses off Web pages and send junk e-mail to all of them. Lucky me: I have
    to sort through junk e-mail before I can get to the messages I’ve been waiting
    to receive. The word for both the junk e-mail and the sending of it is spam.


    Why is spam considered such a problem? For openers, spammers are not taking their
    advertising costs out of their own budget. Instead, they are using other people’s
    system resources — mail servers that don’t belong to them to relay their junk
    mail, disk space on ISP accounts that other people are paying for, and the time
    it takes a user to wade through the unwanted messages. Now, having to delete one
    such message like that may not seem so bad, but when your e-mail address is farmed
    off a Web page and you receive 20 to 30 unsolicited messages a day, the frustration
    and wasted time mount up.


    You can combat spam — initial steps include adding a spam filter to your e-mail
    account or (in some states) even taking political and legal action.'
  merge: -1
  img_proc: true
- pgno: 432
  md: '![](img/8ad518fddafc7f5e73715a2604b61d50_432_0.png)


    > For more information on how you can combat spam, see the Anti-Spam home page
    at http://www.arachnoid.com/lutusp/antispam.html.


    # Summary


    When your Linux system is connected to the Internet, you have several means of
    accessing information. The most common person-to-person method is by e-mail, which
    is how you can communicate via messages from. You can install a mail dæmon like
    sendmail and control the mailing features of your domain, or you can just access
    your mail via a mail client application such as elm or pine.


    When you have e-mail access, you can subscribe to mailing lists or download files.
    Two main programs are in common use for mailing-list administration: Majordomo
    and Listersv. Although each has its own specific commands, they function similarly.


    The Web server that is native to Slackware Linux is the Apache Web server. To
    configure it, edit the configuration files to where they meet your needs. You
    have the ability to turn on and off services as you feel necessary, as well as
    define what services you want.


    You can also access USENET, which is a group of forums separated by a hierarchy.
    This enables you to post messages in response to other people or post questions
    yourself.


    When you are on the Internet, there are some dangers to be aware of: hacking and
    spam. Hacking is someone intentionally breaking into your system, not necessarily
    to do harm. The other is spam, unsolicited e-mails from people wanting to sell
    you things. Though spam may seem a mere nuisance, it can be quite taxing to mail
    servers.'
  merge: -1
  img_proc: true
