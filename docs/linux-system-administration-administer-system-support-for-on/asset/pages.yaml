    \ ovalue, sizeof(struct itimeral));\n        if (error)\n            return error;\n\
    \    }\n```\n\nThe following code is the error handling. Because there is an issue\
    \ with possible buffer overflows, the error handling checks for it.\n\n```\nerror\
    \ = _settimer(which, &set_buffer, ovalue ? &get_buffer : 0);\nif (error || !ovalue)\n\
    \    return error;\n\nmemcpy_tofs(oalue, &get_buffer, sizeof(get_buffer));\nreturn\
    \ error;\n}\n```\n\n> **Buffer overflows have become a way to exploit a Linux\
    \ system. They are covered from a security viewpoint in Chapter 9.**"
  merge: -1
