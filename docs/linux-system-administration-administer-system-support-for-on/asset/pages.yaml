    # # Rescue Disks


    If you''re playing around with your system, or your system happens to just crash
    for no apparent reason (this happens to all of us), you should have a rescue disk
    of some sort.


    You can always use the command *make zdisk* from your kernel for a boot disk,
    but a rescue disk is always good to have handy. There are quite a few utilities
    available for download at http://sunsite.unc.edu/pub/Linux/system/recovery/, or
    you can use the *rawrite* command to the *rescue.gz* image onto a floppy disk
    as well. Table 10-5 gives you an overview of some utilities that increase your
    options for creating rescue disks.


    In the *sunsite.unc.edu/pub/Linux/system/recovery/images/* directory, you can
    find *cramdisk* — which have both boot disk and RAM disk on one floppy — that
    provide rescue support for parallel-port Zip drives, PPP, Lynx, and other networking
    utilities. They can work with hosts that have at least 4MB of memory.'
