- pgno: 240
  md: "# ## Single-User Mode\n\nWhen you've completed system bootup, you can run your\
    \ system in an administrative mode known as *single-user mode*. At this run level\
    \ – run level 1 – you can do disk maintenance and file-system management tasks\
    \ without mounting the file system itself. (Run level 1 is easy to associate with\
    \ single-user mode; just think of $I=1$.) To run your Slackware Linux setup in\
    \ single-user mode, run `telinit S` at your root prompt.\n\n```\n```\n# telinit\
    \ 1\n```\n```\n\nThe processes booted for single user mode are in the file `/etc/rc.d/rc.K`,\
    \ shown in Listing 7-6.\n\n# ### Listing 7-6: Using /etc/rc.d/rc.K\n\n```\n```\n\
    #!/bin/sh\n#\n# rc.K    This file is executed by init when it goes into run level\n\
    #        1, which is the administrative state. It kills all\n#        daemons\
    \ and then puts the system into single-user mode.\n#        Note that the file\
    \ systems are kept mounted.\n#\n# Version: @(#) /etc/rc.d/rc.K  1.50  1994-01-18\n\
    # Version: @(#) /etc/rc.d/rc.K  1.60  1995-10-02 (PV)\n#\n# Author: Miquel van\
    \ Smoorenburg <miquels@drinkel.nl.mugnet.org>\n# Modified by: Patrick J. Volkerding\
    \ <volkerd@ftp.cdrom.com>\n#\n# Set the path.\nPATH=/sbin:/etc:/bin:/usr/bin\n\
    \n# Kill all processes.\necho\necho \"Sending all processes the TERM signal.\"\
    \nkill -15 -1\necho -n \"Waiting for processes to terminate\"\nfor loop in 0 1\
    \ 2 3 4 5 6 7; do\n sleep 1\n echo -n \".\"\ndone\necho\n```\n```"
  merge: -1
  img_proc: true
- pgno: 241
  md: "The first task the shutdown script undertakes is to kill all processes one\
    \ at a time, which is gentlest on the system (-9 is as indiscriminate as an automatic\
    \ rifle, where as -15 works more like sharpshooting, moving from one specific\
    \ “target” to the next). After killing all the processes, the shutdown script\
    \ turns off all the services related to the file system, including quota and accounting.\n\
    \n```\n# Try to turn off quota and accounting.\nif [ -x /usr/sbin/quotaoff ]\n\
    then\n\techo \"Turning off quota..\"\n\t/usr/sbin/quotaoff -a\nfi\n\nif [ -x /sbin/accton\
    \ ]\nthen\n\techo \"Turning off accounting..\"\n\t/sbin/accton\nfi\n```\n\nSo,\
    \ after all the file systems quota is turned off and accounting is turned off,\
    \ Linux goes into single user mode. This will kick off all the users currently\
    \ logged on before killing the remaining processes.\n\n```\n# Now go to the single-user\
    \ level\necho \"Telling \\f{INIT} to go to single user mode (if not already there)...\"\
    \ntelinit -t l 1\n```\n\nNow that it’s in single-user mode, there is no reason\
    \ to kill the rest of the processes nicely. Instead, it kills all the processes\
    \ regarding of priority and function. Also, if it kills init before it kills the\
    \ shutdown process, the process will automatically go down.\n\n```\n# This has\
    \ to happen last because it could kill itself, because of\n# the way init works.\n\
    echo \"Sending all processes the KILL signal.\"\nkill -9 -1\n```\n\n# Run Levels\
    \ 2, 3, 4, 5\n\nRun levels 2, 3, 4, and 5 are the multiuser run levels. On these\
    \ levels, the system reads the file *etc/rc.d/rc.M*, looks for the CD-ROM drive,\
    \ sets up networking information (such as hostname), makes the needed connections,\
    \ starts cron (a scheduling program), does some internal vacuuming of stale files,\
    \ checks for proper file permissions, and starts the daemons. Listing 7-7 shows\
    \ /etc/rc.d/rc.M in action."
  merge: -1
  img_proc: true
- pgno: 242
  md: "# Listing 7–7: Using /etc/rc.d/rc.M\n\n```\n#!/bin/sh\n#\n# rc.M         This\
    \ file is executed by init(8) when the system is being\n#     initialized for\
    \ one of the \"multiuser\" run levels\n#     (levels 1 through 6).  It usually\
    \ does mounting of file\n#     systems and so on.\n#\n# Version: @(#)/etc/rc.d/rc.M\
    \  2.02  02/26/93\n#\n# Author:  Fred N. van Kempen, <waltje@uvalt.nl.mugnet.org>\n\
    #   Heavily modified by Patrick Volkerding <volkerdi@ftp.cdrom.com>\n#\n# Tell\
    \ the viewers what's going to happen...\necho \"Going multiuser...\"\n\n# Screen\
    \ blanks after 15 minutes idle time.\n/bin/setterm -blank 15\n\n# Look for a CD-ROM\
    \ in a CD-ROM drive, and if one is found,\n# mount it under /cdrom.  This must\
    \ happen before any of the\n# binaries on the CD are needed.\n#\n# If you don't\
    \ have a CD-ROM and want to disable this, set the\n# /etc/rc.d/rc.cdrom permissions\
    \ to non-executable: chmod 644 /etc/rc.d/rc.cdrom\n#\nif [ -x /etc/rc.d/rc.cdrom\
    \ ]; then\n . /etc/rc.d/rc.cdrom\nfi\n```\n\nThe message echoed to the users indicates\
    \ that Linux is going into run level 2, 3, 4, or 5. The actual run level is defined\
    \ in `/etc/inittab`.\n\nThis mounts the CD-ROM if there is a CD-ROM in the drive.\
    \ Otherwise, you can use mount /dev/hdc /cdrom (or whatever device your CD-ROM\
    \ is on), as follows:\n\n```\n# If there's no /etc/HOSTNAME, fall back on this\
    \ default:\nif [ ! -r /etc/HOSTNAME ]; then\n  echo \"darkstar.frop.org\" > /etc/HOSTNAME\n\
    fi\n\n# Set the hostname.  This might not work correctly if TCP/IP is not\n# compiled\
    \ in the kernel.\n/bin/hostname `cat /etc/HOSTNAME | cut -f1 -d .`\n```"
  merge: -1
  img_proc: true
- pgno: 243
  md: "These two commands set the hostname. If the hostname is not defined, the system\
    \ uses the default to set a hostname. You can change the default (which is a placeholder\
    \ for networking), or you can set the hostname with the **netconfig** command,\
    \ as shown next.\n\n![](img/8ad518fddafc7f5e73715a2604b61d50_243_0.png)\n\n> For\
    \ more about the **netconfig** command, see Chapter 11.\n\n```\n# Start netatalk.\
    \ (a file/print server for Macs using AppleTalk)\n#if [ -x /etc/rc.d/rc.atalk\
    \ ]; then\n    /etc/rc.d/rc.atalk\n#fi\n\n# Initialize the NET subsystem.\nif\
    \ [ -x /etc/rc.d/rc.inet1 ]; then\n    . /etc/rc.d/rc.inet1\n    . /etc/rc.d/rc.inet2\n\
    else\n    if [ -x /usr/sbin/syslogd ]; then\n        /usr/sbin/syslogd\n     \
    \   sleep 1 # Prevents a race condition with SMP kernels\n        /usr/sbin/klogd\n\
    \    fi\n    if [ -x /usr/sbin/lpd ]; then\n        /usr/sbin/lpd\n    fi\nfi\n\
    ```\n\n```\n# Start crond (Dillon's crond):\n# If you want cron to actually log\
    \ activity to /var/adm/cron, then change\n# -110 to -18 to increase the logging\
    \ level.\n/usr/sbin/crond -110 >/var/adm/cron 2>&1\n```\n\nThese set up the **daemons**\
    \ —programs that normally run as root on servers. Daemons provide services such\
    \ as printing (**lpd**), networking (**pppd** for the PPP daemon, **sshd** for\
    \ Secure Shell, or **nfsd** for the NFS daemon), and logging (**klogd** and **syslogd**).\n\
    \n```\n# Remove stale locks and junk files (must be done after mount -a)\n```"
  merge: -1
  img_proc: true
- pgno: 244
  md: "```\n/bin/rm -f /var/spool/locks/* /var/lock/* /var/spool/uucp/LCK..* /tmp/X.*lock\n\
    /tmp/core /core 1> /dev/null 2> /dev/null\n```\n\n```\n# Remove stale hunt sockets\
    \ so the game can start.\nif [ -r /tmp/hunt -o -r /tmp/hunt.stats ]; then\n  \
    \  echo \"Removing your stale hunt sockets from /tmp...\"\n    /bin/rm -f /tmp/hunt*\n\
    fi\n```\n\nThese sections of the script clean up the file system and the sockets,\
    \ which enables clean connections to occur when the current run level is completed.\n\
    \n```\n# Ensure basic file system permissions' sanity.\nchmod 755 /\nchmod 1777\
    \ /tmp /var/tmp\n```\n\nNot only is this process a sanity check, it's also a good\
    \ security check. Normally you should never give anyone writable permission to\
    \ the root directory. The next item that deserves your attention is the updating\
    \ of library links:\n\n```\n# Update all the shared library links automatically\n\
    /sbin/ldconfig\n```\n\nUpdating the shared library links helps to ensure that\
    \ `ls` and `cp` (and other processes that use shared libraries) work correctly.\n\
    \n```\n# Start the sendmail daemon:\nif [ -x /usr/sbin/sendmail ]; then\n    echo\
    \ \"Starting sendmail daemon (/usr/sbin/sendmail -bd -q15m)...\"\n    /usr/sbin/sendmail\
    \ -bd -q15m\nfi\n```\n\nThis loads the sendmail daemon. Not only will send start,\
    \ but it will also queue the mail every 15 minutes.\n\n```\n# Load a custom screen\
    \ font if the user has an rc.font script.\nif [ -x /etc/rc.d/rc.font ]; then\n\
    \    . /etc/rc.d/rc.font\nfi\n```\n\nHow this process runs will depend on whether\
    \ you decided on a customizable screen font during setup.\n\n```\n# iBCS Emulation\
    \ for Linux\n```"
  merge: -1
  img_proc: true
- pgno: 245
  md: "```\n# The Intel Binary Compatibility Specification, or iBCS, specifies the\n\
    # interfaces between application programs and the surrounding operating\n# system\
    \ environment for i386 based systems. There are however several\n# flavours of\
    \ iBCS in use - SVR4, SVR3 plus several vendor specific\n# extensions to SVR3\
    \ which are slightly different and incompatible. The\n# iBCS emulator for Linux\
    \ supports all flavours known so far.\nif [ -x /etc/rc.d/rc.ibcs2 ]; then\n  \
    \  /etc/rc.d/rc.ibcs2\nfi\n\nLeave this in – it helps ensure file compatibility\
    \ among binaries.\n\n# Start Web server:\nif [ -x /etc/rc.d/rc.httpd ]; then\n\
    \    /etc/rc.d/rc.httpd\nfi\n\n# Start Samba (a file/print server for Win95/NT\
    \ machines):\nif [ -x /etc/rc.d/rc.samba ]; then\n    /etc/rc.d/rc.samba\nfi\n\
    \nThis starts network servers including Apache, a Web server that comes standard\n\
    with Slackware Linux, and Samba, which enabled you to use NetBIOS on Linux.\n\n\
    # Load a custom keymap if the user has an rc.keymap script.\nif [ -x /etc/rc.d/rc.keymap\
    \ ]; then\n    . /etc/rc.d/rc.keymap\nfi\n\n# Start the local setup procedure.\n\
    if [ -x /etc/rc.d/rc.local ]; then\n    /etc/rc.d/rc.local\nfi\n\n# All done.\n\
    ```\n\nThe remainder of the script checks your keyboard settings for a custom\
    \ configu-\nratio and starts the local setup procedure script /etc/rc.d/rc.local.\n\
    \nWhat’s really nice about the rc.* files is they are easily modifiable. You can\n\
    comment stuff out you don’t want to run, and can create your own. Some daemons,\n\
    such as httpd and samba, use their on rc files in the /etc/rc.d/ directory. If\
    \ a\ndaemon finds them in the kernel and they’re hooked up, it runs them. These\
    \ files are\nrun from the /etc/rc.d/rc.M file."
  merge: -1
  img_proc: true
