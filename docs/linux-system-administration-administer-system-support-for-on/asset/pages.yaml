- pgno: 68
  md: '# WHY LIMIT USER ACCOUNTS?


    On my Slackware system, I have one user account and it’s only for me. No one else
    needs an account on my system, so I don’t issue any additional user accounts –
    but I leave the account alone unless I’m using it for “root” purposes and tasks.
    It’s not for day-to-day tasks.


    Consider the following sinister example, in which a small typo has big and unintended
    effects:


    ```

    bash# rm -fr /home/joed /tmp/joed-files / joed

    ```


    This code is meant to delete three directories named /home/joed, /tmp/joed-files,
    and /joed. Unfortunately, the user mistyped the last directory name, adding a
    space between / and joed. Had this user been working in your root directory, the
    shell would have interpreted the command to be rm -fr /, which is a forceful,
    recursive removal of everything following /. This one typo would have erased your
    entire system.


    Allowing too much access to powerful accounts can easily lead to disaster. If
    you must create a general account for database access, use the best passwords
    you can devise. I can’t stress this enough. For starters, never match an account
    name with a password name, no matter how tempting such convenience might be –
    a five-line Perl script could hack such an account in seconds. How? All it would
    have to do is encrypt each username and then compare the encrypted names to the
    encrypted listing in /etc/passwd or /etc/shadow – making tossed salad out of that
    security measure.


    ![](img/8ad518fddafc7f5e73715a2604b61d50_68_0.png)


    > If you have a general user account for database access, don’t use easy-to-guess
    passwords such as “sybase,” “oracle,” or “sql”. They are practically invitations
    for someone to wreak havoc on your system.


    # Keeping Users Happy


    It’s one of the worst apparitions an administrator can deal with: angry users
    invading your cube, tapping their feet, upset that their world has come to an
    end because their access has been limited by a file-system crash, hardware problems,
    or their lack of needed permissions.'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'To avoid the foot-tapping and angry looks, plan to keep your system up and
    running as smoothly as possible, whatever the problem. Plan for contingencies
    well before getting your system online; here good logging and system tracking
    pays off again.


    Often, fingers start pointing as soon as there''s an outage—and inevitably (whether
    they should or not) they point to the system manager. You may have to save face
    (or more) by pointing out that the VP in marketing who has been e-mailing movie
    files back and forth to his friends every ten minutes is clogging bandwidth and
    causing denial of service. Or note that the witty coder two cubes down has new
    code that is spawning infinite processes on the database machine, bringing it
    to its knees.


    In any event, you may want to implement a usage policy. Depending on your situation
    and your environment, such a policy could be delivered verbally (“Don’t run *screen*
    on my system or you’ll lose your disk space.”) or in a written document like the
    Acceptable Use Policy (AUP) adopted by Internet service providers. Many large
    corporations use AUPs; in smaller corporations, the policy might take the form
    of informal, “understood” expectations.


    You’ll want a strategy in place to handle irate users on your system. Be sure
    to give them lots of documentation to read and ready access to available resources.
    A sense of having options may help keep them happy (and free you to tackle other
    concerns such as setting up a backup system or learning Perl). Sometimes, however,
    you may have to deal with an angry user. If so, remain calm and don’t take it
    personally. Find out what the specific problem is; take as much of the emotion
    out of the complaint as you can.


    # Establishing Security


    When everything is up and working, do what you can to keep your system from being
    attacked. This includes doing what you can to prevent break-ins, backing up your
    systems on a regular basis in the event one occurs, and cleaning up once you’ve
    been attacked.


    # Preventing Break-Ins


    To prevent break-ins, try hacking your own system. This doesn’t mean getting root
    access by brute-forcing the password by hand (that would be really silly). Instead,
    run the same tools that a sophisticated and devious hacker would use against your
    system. These tools include the following:


    +   ◆ SATAN – HTML interface scanner

    +   ◆ TAMU Tiger – An updated version of COPS'
  merge: -1
  img_proc: true
- pgno: 70
  md: '+   ISS''s Internet Security Scanner – Free if you run it on the local host


    +   nmap –Freeware from http://www.insecure.org/nmap/index.html


    +   Crack –This password cracker can help you find poor passwords


    Depending on your situation, you may want to alert your co-workers and managers
    before you launch any of these tools against your own network. (You wouldn’t want
    them to get the wrong idea, would you?)


    ![](img/8ad518fddafc7f5e73715a2604b61d50_70_0.png)


    You can find these tools at the following Web site: http://www.tigerair.com/security.html.


    First, you might want to run `nmap`, a really nice portscanner that shows you
    what ports on your system are open to everyone in your domain (which could be
    either an ISP or a LAN). Here’s an example of what could be shown if you run it
    on your own system:


    ```

