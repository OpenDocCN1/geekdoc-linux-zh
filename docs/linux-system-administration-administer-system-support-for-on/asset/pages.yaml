    IN THIS CHAPTER, I touch on many neat things you can do with your kernel.


    # ## Learning How the Kernel Works


    In Linux, hardware and software don''t communicate directly with each other. It''s
    very much layered like an onion. You have the hardware, which consists of the
    keyboard, monitor, mouse, printer, and so on. As the user (including root), you
    interface with the hardware via a shell– a program that gives you consistent access
    to the hardware. Because you and I don''t speak in binary and the computer does,
    we need interpreters to talk to the hardware. This interpreter would be the kernel.


    The kernel interprets the electronic hardware signals and translates them into
    something usable for the shell. If you are running applications, they run on top
    of the shell. Figure 6–1 shows an illustration of how the layers listed are visualized.'
