    # Summary


    No matter what happens, always prepare for the worst. That means creating well-tested
    disaster-recovery procedures and doing regular system backups. *Disaster recovery*
    means getting your systems up and running again quickly after a local disaster
    hits.


    There are a few basic disaster-recovery techniques including mirroring, having
    an emergency live backup site, and storing your critical files and archives off-site
    from your actual systems. This will help you restore your systems quicker than
    if you did not plan at all.


    Backups are not only at the heart of disaster recovery, they can also enhance
    an administrator''s sanity on their own. You can do a full backup, which backs
    up all the data on a file system, or you can do an incremental backup, which only
    backs up the files that have changed in a certain period of time. To schedule
    your backups so they don''t interfere with productivity, keep in mind that incremental
    backups take less time than full backups, so make more frequent incremental backups.


    When you are working on your backup strategy, you must decide on what type of
    media you want to use as backup. For example, floppies are inexpensive financially,
    but you''ll be eating up a lot of productive time swapping floppies for any reasonable
    amount of disk space being backed up. You may want to spend the money and get
    a tape drive with a reasonable amount of capacity, or you can use a CD-R to create
    CD backups up to 650MB. You also have the option of backing up via a network.


    Linux comes with some native backup tools: `tar`, `dd`, and `cpio`. The `tar`
    utility is portable among UNIX platforms and has many functions like defining
    the date of the files you want to back up. For dumping raw data, you can use the
    `dd` command. This will dump the raw data directly onto a device. You can also
    use `cpio`, which will copy files in and out of archives. The `cpio` utility also
    has some built-in functionality with the `find` command. Whichever tool you use,
    be sure you can restore from it.


    If you''re working with an external power source (UPS) or a laptop, you may want
    to use one of the power-management programs you can find at `http://suntite.unc.edu/pub/Linux/system/power`
    or `http://suntite.unc.edu/pub/Linux/system/ups`. It''s easier to monitor the
    applications instead of looking at the power supply itself.


    No matter what you do to back up, be sure to make a rescue disk (or several).
    This way you have the utilities at hand to restore your system at a moment''s
    notice.'
  merge: -1
  img_proc: true
