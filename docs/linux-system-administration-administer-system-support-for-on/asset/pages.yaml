    \ */\n\n#include <linux/signal.h>\n#include <linux/sched.h>\n#include <linux/string.h>\n\
    #include <linux/errno.h>\n#include <linux/time.h>\n#include <linux/mm.h>\n\n#include\
    \ <asm/segment.h>\n\n/*\n * change timeval to jiffies, trying to avoid the\n *\
    \ most obvious overflows..\n *\n * The tv_sec values are signed, but nothing seems\
    \ to\n * indicate whether we really should use them as signed values\n * when\
    \ doing itimers. POSIX doesn't mention this (but if\n * alarm() uses itimers without\
    \ checking, we have to use unsigned\n * arithmetic).\n */\n\nstatic unsigned long\
    \ tvo2jiffies(struct timeval *value)\n{\n   unsigned long sec = (unsigned) value->tv_sec;\n\
    \   unsigned long usec = (unsigned) value->tv_usec;\n\n   if (sec > (ULONG_MAX\
    \ / HZ))\n      return ULONG_MAX;\n   usec += 1000000 / HZ - 1;\n   usec /= 1000000\
    \ / HZ;\n   return HZ*sec+usec;\n}\n```\n```"
