- pgno: 452
  md: '# Appendix D


    # About the CD-ROM


    **THIS BOOK''S COMPANION CD-ROM** contains Slackware Linux 3.5. The following
    list shows the Slackware CD-ROM directories at the **root** level:


    +   - **Bootdks.12** 1.2MB boot disk images

    +   - **Bootdks.144** 1.44MB boot disk images

    +   - **Contents** Shows where the files get installed for each package

    +   - **Contrib** Extra Slackware packages that are not supported

    +   - **Docs** Various HOWTOs, FAQs, and other useful documents

    +   - **Install** Information and executables necessary for FIPS

    +   - **Kernels** Pre-compiled kernels

    +   - **Live** Live file system to run from the CD-ROM

    +   - **Modules** Dynamically loadable modules that provide additional hardware
    support

    +   - **Rootdks** Disks for installing, configuring, or rescuing your Linux system

    +   - **Slaktest** Package that lets you run Slackware from a CD-ROM with minimal
    hard-drive usage

    +   - **Slakware** Primary Slackware packages

    +   - **Source** Source code for Slackware

    +   - **Zipslack** Utility for installing an up-to-date Slackware Linux system
    on a DOS partition'
  merge: -1
  img_proc: true
