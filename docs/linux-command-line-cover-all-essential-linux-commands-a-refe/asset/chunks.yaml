    | `free` | displays free memory information e.g. `free` (list free memory information)
    |

    | `free -m` | display free memory information e.g. `free -m` (`-m`: display sizes
    in Mb) |

    | `fsck` | file system check e.g. `fsck` (check file system) |

    | `ftp` | transfer files by Protocol e.g. `ftp` (transfer files using ftp) |

    | `gawk` | find or replace text in a file e.g. `gawk ''$0'' > 88` (lines longer
