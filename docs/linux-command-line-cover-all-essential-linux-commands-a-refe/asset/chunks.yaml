    | `suspend` | suspend the working shell | e.g. `suspend` (pause system during
    execution) |

    | `sync` | synchronize disk data with memory | e.g. `sync` (flush all file system
    buffers to disk) |

    | `tac` | display lines of a file in reverse order | e.g. `tac myfile.txt` (print
    file from last line to first line) |

    | `tail` | show the final part of a file | e.g. `tail -n 20 file.txt` (-n20: output
    last 20 lines of `myfile.txt`) |

    | `talk` | communicate with another user | e.g. `talk ray` (talk to user `ray`)
    |

    | `tar -xf` | extract an archived tar file | e.g. `tar -xf archive.tar` (-xf:
    extract an archive tar file) |

    | `tar -cf` | create an archived tar file | e.g. `tar -cf archive.tar` (-cf: create
    an archive tar file) |

    | `tee` | print standard output, write to a file | e.g. `sort file1.txt | tee
    file2.txt` (sort `file1.txt` and write to `file2.txt`) |

