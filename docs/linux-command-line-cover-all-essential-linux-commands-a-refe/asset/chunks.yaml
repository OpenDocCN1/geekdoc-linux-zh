  raw: 'Press the Up arrow key; you will see the last command you typed. Then the
    screen will display:


    Date 152 ls ls ls 153 154 155--all -a 156 157 history


    You will notice that the controls are numbered: thus, we can know that date is
    the 152nd command I typed into the terminal, that three ls are the 153rd, 154rth
    and 156th command. The above command you typed will always be history, of course.


    Ctrl + R: find a history command


    In case the directional arrow Top and history command does not suffice to find
    an old command you typed, there is a super useful shortcut: Ctrl+R. which can
    help you find out the history command you have just used. So Press Ctrl+R keys
    simultaneously and computer will switch "looking for a typed command" ("R" as
    research).


    There you can type any sequence of letters that corresponds to an old command.


    Example:


    If you want to look for a command with “all” you have previously used, please
    press Ctrl+R and type "all". Then, Linux will find out ls --all containing just
    the word "all." You just have to hit Enter to run the command! :-)


    If this is not the command you are looking for, again press Ctrl + R to move up
    the list of commands containing "all".


    It may look stupid on a drive like that, but some are very long and it is a pleasure
    not to have to rewrite them again!


    Using Wildcards


    You can use wildcards with a lot of Linux commands. A wildcard is a symbol or
    symbols that indicating other characters. There three kinds of wildcards in Linux
    command:


    ? A question mark (?) indicates a single character.


    For instance: b??k matches bank, beak, back, bilk, or any other four-letter filename
    that begins with b and ends with k.


    * An asterisk (*) indicates any character or set of characters, including no character
    or many characters.


    For instance:  b*k matches bk, bkk, bark, break, backtrack.


    [ ] Characters enclosed in square brackets ([ ]) usually indicates any character
    in the set. But please note they are case-sensitive.


    For instance: b[a-z]k matches bak, bbk, bck, bzk, but not matches bAk, bBk, bCk,
    bZk, because of case-sensitive.


    Wildcards are actually implemented in the Linux commands.


    Example:


    user2014@user-linux:~$  ls  b??k


    (The wildcard b??k matches five files in current directory. The output is “bank 
    beak  back  bilk  bark”)


    Example:


    user2014@user-linux:~$  ls  a*d


    (The wildcard a*d matches some files in current directory. The output is “ad 
    add  acid  abroad  abounded   abed  aid”)


    Example:


    user2014@user-linux:~$  ls  se[a-e]


    (The wildcard se[a-e] matches five files in current directory. The output is “sea 
    seb  sec sed  see”)


    About Run Levels


    What is a Run Levels? The term run levels refers to a mode of operation in one
    of the computer operating systems that implement Linux System V-style initialization.
    Usually, seven run levels exist, numbered from zero to six; Only one "run level"
    is executed on boot up - run levels are not executed sequentially, i.e. either
    run level 2 OR 3 OR 4 is executed, not 2 then 3 then 4.


    "run levels" defines the state of the machine after boot. Different run levels
    are typically assigned to:


    0.halt-the system is in the process of shutting down.


    1.single-user mode


    2.multi-user mode without network services started


    3.multi-user mode with network services started


    4.system shutdown


    6.system reboot


    Example:


    root@user-linux: ~ # init 3


    (init 3: switch the system to run level 3)


    Summary:


    Tab key can auto complete a missing work command.


    Up arrow key can view the history commands


    Down arrow key can return to most recent commands


    Ctrl+R can find out a history command by a key word.


    ? A question mark (?) indicates a single character.


    * An asterisk (*) indicates any character or set of characters, including no character
    or many characters.


    [ ] Characters enclosed in square brackets ([ ]) usually indicates any character
    in the set. But please note they are case-sensitive.


    Run Level number describers the level of services that have been initialized and
    are running.


    # Chapter 23


    # Access Permissions


    What is rwx?


    After using ls –l to view a file’s access permissions, you can see something like
    this:


    rwx ….. ……


    Explanation:


    rwx signify the access permissions which can be described by a number from 1 to
    7. Really? Yes, the numbers from 1 to 7 indicate the access permissions.


    r stands for read permissions, value is 4.


    w stands for write permissions, value is 2.


    x stands for execute permissions, value is 1.


    Vice versa:


    4 means read permissions (r)


    2 means write permissions (w)


    1 means execute permissions (x)


    Example:


    If rwx value is 4, then you can figure out its permission is read only.


    If rwx value is 2, then you figure out its permission is write only.


    If rwx value is 1, then you figure out its permission is execute only.


    The numbers from 1 to 7 indicate the various access permissions:


    7 means permissions with read, write, execute (7=4+2+1)


    6 means permissions with read, write (6=4+2)


    5 means permissions with read, execute (5=4+1)


    4 means permissions with read only (4=4+0)


    3 means permission with write, execute (3=2+1)


    2 means permission with write only (2=2+0)


    1 means permission with execute only (1=1+0)


    Example:


    If rwx value is 7, then you can figure out its permission is read, write and execute.


    If rwx value is 6, then you can figure out its permission is read and write.


    If rwx value is 3, then you can figure out its permission is write and execute.


    What are rwx rwx rwx?


    Access permissions for a file are divided in to three:


    user permissions,


    group permissions,


    others permissions,


    So, when you use ls –l to view the access permission, you will find three rwx
    look like this:


    rwx rwx rwx……


    Explanation:


    The 1st rwx means user permissions,


    The 2nd rwx means group permissions,


    The 3th rwx means others permissions.


    Example:


    If the 1st rwx is 7, it means user permissions with read, write, execute.


    If the 2nd rwx is 3, it means group permissions with write and execute.


    If the 3th rwx is 6, it means others permissions with read and write.


    From above you can understand the 1st rwx, 2nd rwx and 3th rwx respectively indicate
    user permissions, group permissions and others permissions.


    Example:


    752 means:


    1st rwx is 7 meaning user permissions with read, write, execute.


    2nd rwx is 5 meaning group permissions with read, and execute.


    3th rwx is 2 meaning others permissions with write only


    chmod is a command, meaning change the mode of access  permissions for a file.


    Example:


    chmod 643 myfile.txt


    Explanation:


    Change myfile.txt permissions to 643.


    1st rwx is 6 meaning user permissions with read, and write.


    2nd rwx is 4 meaning group permissions with read only.


    3th rwx is 3 meaning others permissions with write, execute


    Example:


    chmod 751 myfile.txt


    Explanation:


    Change myfile.txt permissions to 751.


    1st rwx is 7, meaning user permissions with r, w, x.


    2nd rwx is 5 meaning group permissions with r, x.


    3th rwx is 1 meaning others permissions with x only.  


    Example:


    Chmod u+r


    (gives the user a read permission)


    Example:


    Chmod g-x


    (remove execute permission from members of the file’s group)


    Example:


    Chmod o-w


    (remove write permission from others)


    Summary:


    4 means read permissions (r)


    2 means write permissions (w)


    1 means execute permissions (x)


    The numbers from 1 to 7 indicate the various access permissions:


    7 means permissions with read, write, execute (7=4+2+1)


    6 means permissions with read, write (6=4+2)


    5 means permissions with read, execute (5=4+1)


    4 means permissions with read only (4=4+0)


    3 means permission with write, execute (3=2+1)


    2 means permission with write only (2=2+0)


    1 means permission with execute only (1=1+0)


    # Chapter 24


    # Linux Symbols


    | SymbolCommands | Operations&  Examples |


    | < | get input from a file to a commande.g. cat < myfile.txt |


    | > | send output from a command to filee.g. cat > myfile.txt |


    | >> | append output to a filee.g. cat file1.txt >> file2.txt |'
