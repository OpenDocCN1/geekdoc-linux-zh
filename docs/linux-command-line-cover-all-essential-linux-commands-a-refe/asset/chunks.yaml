    | `yum` | rpm-based package manager. e.g. `yum install update` (install a package
    named "update") |

    | `zcat` | output compressed text. e.g. `zcat myfiles.txt.gz \| less` (uncompress
    file and show contents) |

    | `zless` | show un/compressed file contents. e.g. `zless myfile.txt.gz` (`zless`:
    show contents by page) |

    | `zmore` | show un/compressed file contents. e.g. `zmore myfile.txt.gz` (`zmore`:
    show contents by screen) |

    | `zip` | compress files to zip format. e.g. `zip documents *` (create `documents.zip`
    for all files) |

    | `unzip` | uncompress files from zip format. e.g. `unzip myfile.zip` (uncompress
    `myfile.zip`) |


