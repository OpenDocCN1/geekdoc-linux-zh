    | `grep` | match specified string or regex e.g. `grep onstring myfile.txt` (search
    `myfile.txt` for `onstring`) |

    | `groups` | list groups to which user belong e.g. `groups` (print the groups)
    |

    | `groupadd` | add a new group e.g. `groupadd newgroup` (create a new group) |

    | `groupadd -f` | add a new group e.g. `groupadd -f` (`-f`: group doesn’t exist)
    |

    | `groupdel` | delete an existing group e.g. `groupdel existinggrp` (remove existing
    group) |

    | `groupmod -n` | modify an existing group e.g. `groupmod -n newgrp oldgrp` (`-n`
    change group name) |

    | `gunzip` | uncompress a file from gzip format e.g. `gunzip myfile.txt.gz` (uncompress
    `myfile.txt.gz`) |

    | `gzip` | compress a file to gzip format e.g. `gzip myfile.txt` (compress `myfile.txt`)
    |

    | `halt` | shutdown the system e.g. `halt` (power off the system) |

    | `hash` | access hash table e.g. `hash` (list commands from hash table) |

    | `head` | display some front lines in a file e.g. `head myfile.txt` (output the
    first ten lines of `myfile.txt`) |

    | `head -n` | display some front lines in a file e.g. `head -n 4 myfile.txt` (`-n`:
    specify a number of lines) |

    | `help` | show help information of command e.g. `help echo` (show information
    about `echo`) |

    | `history` | show the commands history e.g. `history` (list commands in this
    session) |

    | `host` | find the ip address of a domain name e.g. `host xvxaxx.com` (show ip
