    -a file2.txt` (-a: append instead of overwrite) |

    | `test` | calculate a boolean expression | e.g. `[ 8 -gt 6 ]; echo $?` (output:
    0 0:true; 1:false) |

    | `test` | calculate a boolean expression | e.g. `[ 5 -eq 6 ]; echo $?` (output:
    1 0:true; 1:false) |

    | `time` | show the time taken to run a program | e.g. `time ftp` (display the
    time taken to execute `ftp`) |

    | `times` | show the uptime of shell | e.g. `times` (display the system uptime)
    |

    | `tload` | show a graphic report of system load | e.g. `tload` (show the current
    system load average to a specified process) |

    | `top` | list the top active or specified processes | e.g. `top -p pid` (-p:
    display specific process by `pid`) |

    | `touch` | update timestamp for an existing file | e.g. `touch myfile.txt` (modify
    `myfile.txt` to the current time) |

    | `touch -t` | update timestamp for an existing file | e.g. `touch -t myfile.txt`
