    ## About This Book

    This book is a reference guide for fast learning Linux commands which are frequently
    used by Linux administrators or beginners. The book covers all essential Linux
    commands as well as their operations, examples and explanations. It also includes
    Linux Helping commands, symbols, shortcut keys, run levels and Vi commands. From
    this book, you can easily learn:


    - How to run all essential Linux commands.

    - How to copy, move, and delete files and directories.

    - How to create, remove, and manage users and groups.

    - How to access Linux server, and use `SSH` commands.

    - How to operate the run levels and change the run levels.

    - How to navigate at the command line by helping commands.

    - How to compare files, find out a file, manipulate files contents.

    - How to start a job, stop a job and schedule a job.

    - How to manage permissions, ownership of files, directories.

    - How to connect across network, communicate with the network.

    - How to transfer files over the network, send network messages

    - And much more skill……


    There is a long chart containing all common Linux commands in this book, which
    can give you a great help in your job or study. You can learn all essential Linux
    commands quickly.


    **Note:** This book is a reference guide, which may be not suitable for some completely
    new Linux beginners.


