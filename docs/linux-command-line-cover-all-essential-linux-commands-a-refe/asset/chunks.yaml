    No matter which distribution you install, you will get a Linux OS and Linux compatibility
    with others. Most distributions are just more or less easy to handle.


    ## Various existing distributions


    There are many different Linux distributions. Hard to choose? You must say: indeed.
    At first time it is unclear which to choose ... especially since all are free!
    Do not worry; I''ll help you make your choice.


    I will not list all existing distributions, but here at least are the main ones:


    - **Slackware**: one of the oldest Linux distributions. It still exists today!

    - **Mandriva**: published by a French company, it is simple and easy to use;

    - **RedHat**: published by an American company, this distribution is well known
    in the world and especially on servers;

    - **SUSE**: published by the Novell Company; by the way, do you know the famous
    Novell Networking?

    - **Debian**: managed by independent developers rather than a company. This is
    one of the most popular distributions.


    As I have said, whatever the distro (short for distribution) you choose, you will
    always have a Linux OS.


    ## Linux Operating System--Filesystem


    ### What is Filesystem?


    The term “filesystem” has two meanings: First, it means an organized collection
    of files, stored in some specific set of directories. Second, it means the low-level
    data structures used to organize files on a hard disk partition or external disk.


    Linux filesystem is organized into a logical tree structure formed of directories.
    The following illustration describes a filesystem tree:


    | | | `/dev` | | |

    |---|---|---|---|---|

    | | `/bin` | `/lib` | `/sbin` | |

    | `/boot` | `/initrd` | `/etc` | `/proc` | |

    | `/mnt` | `/tmp` | `/var` | `/opt` | `/usr` |

    | | `/root` | `/home` | | |

    | | | `/` | | |


    **Explanation:**


    - `/bin`: Contains basic command line utilities, holds system binaries or programs
    used to operate the system, holds the commands available to all users.

    - `/boot`: Contains the commands and files required for Linux to boot on computer,
    these include the kernel, boot loaders, and message files defining the text printed
    on the screen at system boot.

    - `/Dev`: Contains all device files used to access the various hardware components
    on the system. This directory is used for special files which represent devices
    on the system.

    - `/etc`: Contains a set of system configuration files used to manage the system
    initialization and configuration parameters for networking, service, password
    and subsystems……

    - `/home`: Contains users’ data files. It is the default location for holding
    the user’s personal configuration and data files.

    - `/lib`: Contains program libraries needed by a number of different applications
    as well as the Linux kernel.

    - `/mnt`: Contains the mount point of removable various devices.

    - `/opt`: Contains optional files and packages loaded onto the system.

    - `/proc`: Contains all kernel-related processes that are currently running.

    - `/root`: The home directory of the superuser.

    - `/sbin`: Contains system administration commands, which are system binary files.

    - `/tmp`: Contains temporary files created by ordinary users.

    - `/usr`: Contains programs and data available to all users, it is an enormous
    directory with many subdirectories and files.

    - `/var`: Contains variable data like system logs, print spool files, and lock
    files.

    - `/initrd`: Contains only a file with warning that the fold must not be removed.
    Otherwise, the Linux system cannot start up.


    The Linux operating system doesn’t function like the one in Windows. The structure
    of Linux filesystem looks like a tree.


    A filesystem is a technique of organizing and managing files from a storage device
    like a hard drive. Filesystem usually consists of various files separated into
    groups called directories. Directories can contain files or additional sub-directories.


    ### Summary


    - Windows, Mac OS and Linux are the most popular operating systems.

    - Linux usually works as a server, because of its stability and security’s feature.

    - Linux is a free charge operating system, its source code (the manufacturing
    recipe) is open, and anyone can view it.

    - Nowadays, there are so many various versions of Linux, called distributions.

    - Filesystem, a Linux operating system, consists of various Linux system files.


