    # Chapter 26


    ## Run Levels Table


    | Run Level | Description |

    | :--- | :--- |

    | `0` | Halt the system. When this is the current run level, the system is in
    the process of shutting down. |

    | `1` | Single user mode. Only small set of kernel processes running. Almost all
    other services disabled. |

    | `2` | Basic multiuser mode. This run level starts most services, but does not
    enable network connection service. |

    | `3` | Full multiuser mode. This run level starts all services including network
    connection. but does not start X window |

    | `4` | User defined mode. No conventional definition applies to run level 4.
    It is fully open to user configuration. |

    | `5` | Full multiuser mode with X window. Starts all enabled services with Linux
    graphical desktop environments. |

    | `6` | Reboot. When this is the current run level, the system is in the process
    of rebooting. |


