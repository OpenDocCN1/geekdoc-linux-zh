    The symbol `~` means that you are at home directory, so-called "home" in Linux
    is equivalent to the "My Documents" folder on Windows. We will study in detail
    the operation of the files in Linux next chapter.


    `#` means you are working as a super user in “root” account.


    `whoami`: `whoami` is a command. (Show the current user name).


    ## More detail about `#`


    `#`: Means you are working as a super user in “root” account. The `root` is the
    master who has the almighty right to do everything to other user accounts on his
    computer(even to destroy it!). We''ll see how `root` works in detail later;


    At this moment, the Linux machine seems to say hello to you:


    "Welcome, you are a super user in user-linux machine. You are currently at home
    directory in root account and have super user rights. You are using a command
    `whoami` to show the current user name."


    ## About `user>pwd`


    Example:


    ```bash

    user> pwd

    ```


    Explanation:


    `user>` : is a customized command prompt.


    `pwd`: `pwd` is a command. (Print working directory).


    You can customize the command prompt like `user>`. Of course after you are familiar
    with most Linux command programming, you will be able to customize the shell prompt.


    At this moment, the Linux machine seems to say hello to you:


    "Welcome, you are a user in user-linux machine. You are using a customized command
    prompt. You are currently at home directory and have limited user rights. You
    are using the `pwd` command to print working directory."


    The command prompt can be configurable entirely. You can shorten it if you find
    it is too long, or lengthen it if it does not show enough information. You can
    theoretically put everything informative you want in the prompt, such as the current
    time.


    ## About Linux Commands


    The typical syntax of shell command looks like this:


    ```

    command   option   argument

    ```

    or


    ```

    command   parameter

    ```


    Let’s see some example of Linux commands.


    Example:


    Type `date` and press the Enter key.


    ```bash

    user2014 @ user-linux: ~ $ date

    Monday, September 20, 2010, 3:39:51 p.m. (UTC-0200)

    ```


    Explanation:


    The first line contains the command prompt and a command I typed. In here, `date`
    is a command.


    The second line is the message that computer responds to this command: I just
    request the date and time!


    ## About Parameters


    Parameters are options that are typed after the command. The command and parameters
    are separated by a space, like this:


    ```bash

    user2014 @ user-linux: ~ $ command parameters

    ```


    The parameters themselves can contain spaces, letters, numbers... and a bit of
    something, really. There is no a real rule of how the arguments are, but fortunately
    programmers have adopted a sort of "agreement" so that we can recognize the different
    types of parameters.


    ### Short parameters (one letter)


    The short parameters are constituted by a single letter preceded by a dash.


    For instance:


    - `-d`

    - `-l`

    - `-a`


    If we have to give several parameters, you can do it like this:


    `-d -a -U -h`


    Or shorter:


    `-daUh`


    Note: A short parameter in different command has different meanings.


    Example:


    - `ls -t` (`-t` means “list by timestamps”.)

    - `eject -t` (`-t` means “tray close”.)

    - `chfn -f` (`-f` means ”change information by finger name”)

    - `cut -f` (`-f` means “cut text by a field number”)

    - `ps -f` (`-f` means “show process status in full information”)


    BEWARE! Parameters are case sensitive (upper / lower case). If you type `-u`,
    which has generally not the same sense as `-U`.


    Let us have a test with the `ls` command, and follow by the parameter `-a`. (`-a`
    means “all”):


    Example:


    ```bash

    user2014@user-linux: ~ $ ls -a.

    .gconfd .mozilla-thunderbird .. gimp-2.2 .nautilus .bash_history .gksu.lock .profile
    .bash_logout .gnome .recently-used .bashrc .gnome2 .recently-used.xbel .config
    .gnome2_private .ssh Desktop .gstreamer- .sudo_as_admin_successful .dmrc .gtkrc
    0.10-1.2-gnome2 .themes .esd_auth .ICEauthority .thumbnails .evolution .icons
    .Trash Examples .lesshst tutorials .face .local .update-manager-core .fontconfig
    .macromedia .update-notifier .gaim. metacity .Xauthority .gconf .mozilla .xsession-errors

    ```


    The screen displays all files of current directory, even hidden files. Normally,
    the home directory contains a good bunch of hidden files, which are usually the
    programs of configuration files.


    ### Long parameters (several letters)


    The long parameters consist of several letters preceded by two dashes like this:


    ```

    --long parameter

    ```


    For instance:


    - `--all`

    `--all` is a long parameter, meaning all contents or all things.


    - `--version`

    `--version` is a long parameter, meaning the version of the command.


    - `--help`

    `--help` is a long parameter, meaning get help for the current command.


    If you want to put several feature parameters together, they will be added a space
    between each one:


    ```

    Command --long parametre1 --long parametre2

    ```


    You can also combine the long and short parameters in this way:


    ```

    Command -daUh --All

    ```


    Note that some parameters do not offer a choice between a short version and a
    long version.


    Let''s test the `ls` command with the `--all` parameter, which means "all things":


    Example:


    ```bash

    user2014@user-linux: ~ $ ls --all.

    .gconfd .mozilla-thunderbird .. gimp-2.2 .nautilus .bash_history .gksu.lock .profile
    .bash_logout .gnome .recently-used .bashrc .gnome2 .recently-used.xbel .config
    .gnome2_private .ssh Desktop .gstreamer- .sudo_as_admin_successful .dmrc .gtkrc
    0.10-1.2-gnome2 .themes .esd_auth .ICEauthority .thumbnails .evolution .icons
    .Trash Examples .lesshst tutorials .face .local .update-manager-core .fontconfig
    .macromedia .update-notifier .gaim. metacity .Xauthority .gconf .mozilla .xsession-errors

    ```


    As you can see, `--all` and `-a` are a synonym, which explains that a command
    offers two ways to use a parameter: a short version and a long version.


    ## Commands and Parameters Examples


    OK! Let’s have a further look about the commands.


    `su -l`: switch user


    Example:


    ```bash

    user>su -l

    ```

    (su going to login as the root user, l is a parameter meaning “login”)


    `ls -l`: list long contents


    Example:


    ```bash

    user>ls -l

    ```

    (ls shows the contents of current directory. l is a parameter meaning “long”)


    `ls -a`: list all contents


    Example:


    ```bash

    user>ls -a

    ```

    (ls shows the contents of current directory. a is a parameter meaning “all” including
    hidden files.)


    `rm -ri`: remove a directory and its contents


    Example:


    ```bash

    user>rm -ri NonEmptyDir

    ```

    (rm removes a directory. ri is a parameter meaning a non-empty directory. NonEmptyDir
    is a directory name.)


    `w -s`: show current process for each user


    Example:


    ```bash

    user>w -s

    ```

    (w shows current processes. s is a parameter meaning “summary”)


    `usermod -l`: modify existing user account


    Example:


    ```bash

    user>usermod -l oldname newname

    ```

    (usermod modifies an existing user account. l is a parameter meaning “login name”)


    ## Virtual Console


    ### What is Virtual Console?


    Virtual Console means an interface where the input device and the output device
    designed to enable you to interact with your system.


    Linux has 7 virtual consoles, you can switch them using `Ctrl+Alt+F1` through
    `F7`.


    `Ctrl+Alt+F1~F6`: switch virtual console 1~6


    `Ctrl+Alt+F7`: enter graphical desktop, which is default virtual console.


    1. When a user is a normal user, use:

    `username@hostname:~$ command parameter`


    2. When a user is a super user, use:

    `root@hostname:~# command parameter`


    3. When the shell prompt has been customized, use:

    `User> command parameter`


    4. Linux command: `ls, pwd, su, whoami, loginname, rm, exit…`


    5. Command parameter: `-a, -ri, -l,--all, --help…`


    6. Virtual Console: let you have several interface shell sessions active at the
    same time.

