    | `unalias` | remove an alias | e.g. `unalias aliasname` (delete a specified alias)
    |

    | `uname -a` | show the current system information | e.g. `uname -a` (-a: display
    all information) |

    | `uname -n` | show the current system information | e.g. `uname -n` (-n: display
    the host name) |

    | `unexpand` | convert spaces into tabs | e.g. `unexpand myfile.txt` (convert
    spaces to tabs for `myfile.txt`) |

    | `uniq` | filter out repeated lines in a file | e.g. `uniq myfile.txt` (show
    unique line in `myfile.txt`) |

    | `unset` | remove shell variable or function | e.g. `unset var` (delete a variable)
    |

    | `unzip` | uncompress files from zip format | e.g. `unzip archive.zip` (uncompress
    file from `archive.zip`) |

    | `uptime` | show system uptime | e.g. `uptime` (display system uptime) |

    | `useradd` | add a new user account | e.g. `useradd username` (create a user
    account) |

    | `useradd -d` | display default value for new users | e.g. `useradd -d` (show
    default data for a new user) |

    | `userdel` | delete an existing user account | e.g. `userdel username` (remove
    a user account) |

    | `usermod -d` | modify home directory | e.g. `usermod -d /home/mydir andy` (-d:
    specify home directory for `andy`) |

    | `usermod -l` | modify an existing user account | e.g. `usermod -l oldname newname`
    (-l: login name change) |

    | `usermod -p` | modify an existing user account | e.g. `usermod -p password username`
    (-p: modify password of a user) |

    | `users` | display current logged-in users | e.g. `users` (list users currently
    logged in) |

    | `vdir` | verbosely show directory contents | e.g. `vdir` (`vdir` just like `ls`,
    but more verbose) |

    | `vi` | open the vi text editor | e.g. `vi filename` (open a file with `vi` text
    editor) |

    | `vmstat` | report virtual memory statistics | e.g. `vmstat` (also report swap,
    disk i/o devices...) |

    | `w` | list current processes for each user | e.g. `w username` (show the user’s
    process) |

    | `w -s` | list current processes by summary | e.g. `w -s` (-s: show a summary
    of shell process) |

    | `wait` | wait for a process to change state | e.g. `wait 10788` (wait for `10788`
    to change state) |

    | `watch` | execute a command periodically | e.g. `watch -n 5 date` (-n5: update
    date every 5 seconds) |

    | `wc` | show word count, line count, etc. | e.g. `wc myfile.txt` (list word,
    line count… for `myfile.txt`) |

    | `wc -c` | show word count, line count, etc. | e.g. `wc -c myfile.txt` (-c: show
    the byte counts) |

    | `wget` | download a web page from a website | e.g. `wget http://www.xvkaljo.com`
    (download webpage from above url) |

    | `wget -c` | download a web page from a website | e.g. `wget -c http://www.examp.com`
    (-c: continue download previous web) |

    | `whatis` | show manual page of a command | e.g. `whatis ping` (show manual page
    of `ping`) |

    | `whereis` | locate source, man for a command | e.g. `whereis ls` (show source,
    man locations of `ls`) |

    | `which` | show path of a executable command | e.g. `which ftp` (show the full
    path of `ftp` command) |

    | `who` | show who currently logged in | e.g. `who` (list all logged-in users,
    date, time...) |

    | `who -a` | list all users currently logged in | e.g. `who -a` (-a: all information)
    |

    | `whoami` | show the current user’s login name | e.g. `whoami` (show your own
    user name) |

    | `whois` | show domain owner’s information | e.g. `whois xvqizx.com` (list `xvqizx.com`
    owner’s information) |

    | `write` | write a message to another user | e.g. `write username` (then write
    your message...) |

    | `xargs` | execute a command with arguments | e.g. `find -name " a*.* " | xargs
    rm` (find files named `a*.*`, remove them) |

    | `xcalc` | launch a graphical calculator | e.g. `xcalc` (open a scientific calculator)
    |

    | `xclock` | launch graphical clock | e.g. `xclock -digital` (-digital: specify
    a digital clock) |

    | `yes` | output a string repeatedly until killed | e.g. `yes “hello"` (output
    hello repeatedly until killed) |

