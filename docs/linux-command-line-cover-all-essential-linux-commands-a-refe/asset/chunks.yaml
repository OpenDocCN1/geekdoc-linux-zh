    # Chapter 28


    ## All Essential Linux Commands


    Note:

    - `cmd` means command

    - `regex` means regular expression

    - `(*)` means the command run by root user


    | Commands | Operations & Examples |

    | :--- | :--- |

    | `a2p` | convert `awk` to perl file e.g. `a2p myfile.awk > myfile.pl` (convert
    `myfile.awk` into `myfile.pl`) |

    | `alias` | create another name for a command e.g. `alias p="pwd"` (set `p` as
    alias for `pwd`) |

    | `apropos` | view the searched term in man pages e.g. `apropos find` (list entries
    with "find" in man page) |

    | `apropos -e` | view the searched term in man pages e.g. `apropos –e nice` (-e:
    show exact word in man pages) |

    | `apt-get` | install, remove or update a package e.g. `apt-get install libc6`
    (install `libc6` package) |

    | `aspell` | check and correct for misspspellings e.g. `aspell -c test.txt` (-c:check
    spelling in `test.txt` file) |

    | `at` | run a job at a specific time e.g. `at` |

    | `awk` | match text by regular expression e.g. `awk ''$0''` (length of lines)
    |

    | `basename` | display the last part of path e.g. `basename /home/foo/file.txt`
    |

    | `bc` | perform a calculation e.g. `bc+9` |

    | `bg` | resume stopped job in background e.g. `bg %3` |

    | `bunzip2` | uncompress file from zip format e.g. `bunzip2 myfile.tar.bz2` |

    | `bzip2` | compress file to zip format e.g. `bzip2 myfile.dat` |

    | `cal` | display a month or year e.g. `cal 2014` |

    | `cal -3` | display 3 months e.g. `cal -3` (3 months) |

    | `cat` | display contents of one or more files e.g. `cat file1.txt file2.txt`
    |

    | `cat -n` | display contents with line numbers e.g. `cat -n myfile.txt` |

    | `cd` | change directory e.g. `cd /home/user/mydir` |

    | `chattr` | set attributes for a file e.g. `chattr +i myfile.txt` (+i make file
    as read-only) |

    | `chfn` | change user’s information e.g. `chfn` (change all users) |

    | `chfn -f` | change full name e.g. `chfn -f Full-Name` (-f: change full name)
    |

    | `chgrp` | change the group owners e.g. `chgrp groupname /usr/myfile.txt` |

    | `chkconfig` | view and modify run level file e.g. `chkconfig --list` (-list:
    list services of run level) |

    | `chmod` | change access permission e.g. `chmod 755 filename` (set file access
    permission as 755) |

    | `chown` | change ownership of file or directory e.g. `chown username myfile.txt`
    (alter file ownership of `myfile.txt`) |

    | `chpasswd` | change password for users e.g. `chpasswd` (then enter username:
    password) |

    | `chsh` | change login shell for a user e.g. `chsh -s /bin/bash` (-s specify
    login shell) |

    | `cksum` | produce a CRC checksum number e.g. `cksum file.txt` (output checksum
    number of `file.txt`) |

    | `clear` | clear the screen e.g. `clear` (clear the shell window) |

    | `cmp` | compare two files text by byte e.g. `cmp first.txt second.txt` (compare
    `first.txt` and `second.txt`) |

    | `collectl` | monitor the current system status e.g. `collectl` (list cpu, sys,
    inter .etc information) |

    | `comm` | compare two files text line by line e.g. `comm first.txt second.txt`
    (compare `first.txt` `second.txt`) |

    | `cp` | copy file(s) to another directory e.g. `cp myfile.txt /mydir` (copy `myfile.txt`
    to `mydir`) |

    | `cp -p` | copy file(s) to another directory e.g. `cp -p myfile.txt /mydir` (-p:
    keep original permission) |

