    - `4` 表示只读权限 (`4=4+0`)\n- `3` 表示写、执行权限 (`3=2+1`)\n- `2` 表示只写权限 (`2=2+0`)\n- `1`\
    \ 表示只执行权限 (`1=1+0`)\n\n运行级别数字描述了已初始化并正在运行的服务级别。\n\n"
