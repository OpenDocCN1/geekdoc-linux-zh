    - `6` 表示读、写权限 (`6=4+2`)\n- `5` 表示读、执行权限 (`5=4+1`)\n- `4` 表示只读权限 (`4=4+0`)\n- `3`\
    \ 表示写、执行权限 (`3=2+1`)\n- `2` 表示只写权限 (`2=2+0`)\n- `1` 表示只执行权限 (`1=1+0`)\n\n####\
    \ 示例：\n\n如果 `rwx` 值为 7，那么你可以判断出它的权限是读、写和执行。\n如果 `rwx` 值为 6，那么你可以判断出它的权限是读和写。\n\
    如果 `rwx` 值为 1，那么你可以判断出它的权限是只执行。\n\n什么是 `rwx`？\n`rwx` 表示访问权限，可以用 1 到 7 的数字来描述。真的吗？是的，1\
    \ 到 7 的数字表示访问权限。\n\n`r` 代表读取权限，值为 4。\n`w` 代表写权限，值为 2。\n`x` 代表执行权限，值为 1。\n\n反之亦然：\n\
    \n`4` 表示读取权限 (`r`)\n`2` 表示写权限 (`w`)\n`1` 表示执行权限 (`x`)\n\n示例：\n\n如果 `rwx` 值为 4，那么你可以判断出它的权限是只读。\n\
