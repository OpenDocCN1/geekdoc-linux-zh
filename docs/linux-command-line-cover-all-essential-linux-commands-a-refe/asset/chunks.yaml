    ## Enter First Commands


    Dear friends, the big day has finally arrived! You are ready to write your first
    command in console!


    Okay, not too stressed?


    ## I assure you, we will start with simple things to become familiar with the
    console. We''ll really see the ABC, the basic survival guide of kits.


    ## Linux Command & Parameter


    A Linux shell is a command-line interpreter or provides a traditional user interface
    for the Linux operating system and for Linux-like systems.


    The shell understands a plenty of Linux commands and its option which changes
    their action. The typical syntax of Linux command looks like this:


    ```

    command --option argument

    ```

    or

    ```

    command parameter

    ```

    (Usually `--option argument` means parameter)


    For instance:


    - The Commands look like: `ls`, `cat`, `pwd`, `cp`, `mv`, `date`……

    - The Parameters look like: `-a`, `-l`, `-s`, `--all`, `--help`……


    **Example:**


    ```

    ls -a

    ```


    **Explanation:**


    - `ls` is a command meaning “list the contents in current directory”.

    - `-a` is a parameter meaning “all”.

    - Result: list all contents in current directory.


    Linux commands can be run in a text interface mode, or in a shell terminal window.


    ### Command Prompt


    The command prompt is a message that prompts you to enter a command. The command
    prompt is shown before each command.


    **Example:**


    ```

    username@hostname ~ $

    ```


    ```

    root@hostname ~ #

    ```


    ```

    user >

    ```


    **Explanation:**


    - `username@hostname ~ $`: the first element is your nickname. This is the user
    by which you log into your account.

    - `@`: This symbol indicates “at”. It is a separator.

    - `hostname`: that''s the name of the computer on which you are working. In my
    case it is called hostname, but you can give it any name during installation.

    - `: This symbol does not mean anything special, it is a separator.

    - `~`: means that you are at home directory, so-called "home" in Linux is equivalent
    to the "My Documents" folder on Windows. We will study in detail the operation
    of the files next chapter.

    - `$`: This symbol is very important; it shows your authorization level of the
    machine.

    - `ls`: ls is a command. (Show the contents of the current directory).


    More detail about `$`:


    - Means you are currently working as a user in "normal" account with limited rights
    (The user in “normal” account cannot change the most important system files).
    My account `user014` is a normal account with limited rights;


    As you can see, once you speak the same language as the command prompt, you will
    understand what it means!


    At this moment, the Linux machine seems to say to you:


    "Welcome, you are user014 in user-linux machine. You are currently at home directory
    in normal account and have limited rights. You are using a command `ls` to list
    the contents in current directory."


    About the `root@hostname:~#whoami`


    **Example:**


    ```

    root@user-linux:~# whoami

    ```


    **Explanation:**


    - `root`: means you work as a super user in “root” account.

    - `@`: This symbol indicates “at”. It is a separator.

    - `user-linux`: that''s the name of the computer on which you are working. In
    my case it is called user-linux, but you can give it any name during installation.

    - `: This symbol does not mean anything special, it is a separator.

    - `~`: That''s the folder where you currently locate. You can navigate from folder
    to folder in the console and it is very useful that you always be reminded where
    you are before typing each command.

