    | 命令 | 说明 |

    | :--- | :--- |

    | `cp -a` | copy file(s) to another directory e.g. `cp –a myfile.txt /mydir` (`-a`:
    keep original attributes) |

    | `cpio -o` | output archived cpio file e.g. `cpio -o > directory.cpio` (`-o`:
    backup to an archive cpio file) |

    | `cpio -i` | input archived cpio file e.g. `cpio -i < directory.cpio` (`-i`:
    restore from an archive cpio file) |

    | `crontab` | create a job to run at specified time e.g. `crontab` (set to run
    jobs at regular intervals) |

    | `crontab -e` | run a recurring job at a specified time e.g. `crontab -e` (`-e`
    allow edit the crontab file) |

    | `crontab -l` | run a recurring job at a specified time e.g. `crontab -l` (`-l`:
    lists the crontab files) |

    | `crontab -r` | run a recurring job at a specified time e.g. `crontab -r` (`-r`:
    remove the crontab file) |

    | `csplit` | split a file into some separated files e.g. `csplit myfile.txt ”/part1/”
    “/part2/` (separate files named `xx00`, `xx01`) |

    | `cut -d` | show the specified field of a file e.g. `cut –d “:” myfile.txt` (`-d`:
    specify a field delimiter `:`) |

    | `cut -c` | extract contents from a file e.g. `cut –c 6 myfile.txt` (`-c6`: the
    sixth character of each line) |

    | `cut -f` | extract contents from a file e.g. `cut –f 3 myfile.txt` (`-f3`: specify
    a field number as 3) |

    | `date` | show the date and time e.g. `date` (display the current date and time)
    |

    | `date -s` | set the date and time e.g. `date -s "11/20/2014"` (`-s` set the
    date) |

    | `dc` | open a command line desk calculator e.g. `dc` (``dc` means desk calculator)
    |

    | `dd` | data dump to convert and copy a file e.g. `dd if=/dev/sda of=/dev/sdb`
    (copy data from `sda` to `sdb`) |

    | `dmesg` | print out all kernel log messages e.g. `dmesg > kmsg.txt` (output
    kernel messages to `kmsg.txt`) |

    | `df` | display free disk space e.g. `df` (display file system free space) |

    | `df -m` | display free disk space e.g. `df -m` (`-m`: display sizes in Mb) |

    | `dhclient` | configure network interfaces e.g. `dhclient eth0` (renew IP address
    of `eth0`) |

    | `diff` | show difference between two files e.g. `diff firstfile.txt secondfile.txt`
    (display difference above two files) |

    | `diff3` | show difference among three files e.g. `diff3 file1.txt file2.txt
    file3.txt` (display difference above three files) |

    | `dig` | display the details of DNS server e.g. `dig xvxaxx.com` (list information
    about `xvxaxx.com`) |

    | `dir` | show directory contents e.g. `dir` (display current directory contents)
    |

    | `dircolors` | show color settings for `ls` command e.g. `dircolors` (display
    directory coloring of `ls`) |

    | `dirname` | remove the last part of a file path e.g. `dirname /foo/bar/baz/myfile.txt`
    (output: `/foo/bar/baz`) |

    | `du -s` | display disk usage e.g. `du -s *.*` (`-s` list files size in current
    directory) |

    | `du -h` | display disk usage e.g. `du -h myfile.txt` (`-h`: show human readable
    units) |

    | `dump -f` | makes backup of filesystem e.g. `dump -f0 filebk /mydir` (`-f`:backup-0:dump-level
    `filebk`: dump-file) |

    | `echo` | display input on standard output e.g. `echo “Hello World!”` (show `Hello
    World!`) |

    | `echo -e` | display text using escape sequence e.g. `echo –e "\n Hello World!”`
    (`-e`: allow use `\n` to show text) |

    | `ed` | open a command-line text editor e.g. `ed myfile.txt` (open `myfile.txt`
    with text editor) |

    | `egrep` | search file(s) for a specified regex e.g. `egrep "new | string" myfile.txt`
    (search `myfile.txt` for `new | string`) |

