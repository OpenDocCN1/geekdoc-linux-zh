    | Command | Description | Example |

    | :--- | :--- | :--- |

    | `shutdown -h` | close system | e.g. `shutdown -h +5` (-h+5: halt after 5 minutes)
    |

    | `shutdown -r` | shutdown and restart | e.g. `shutdown -r now` (-r: shut down
    and instantly restart) |

    | `sleep` | pause for a specified amount of time | e.g. `sleep 10` (pause for
    10 seconds) |

    | `sort` | show sorted contents alphabetically | e.g. `sort -r myfile.txt` (-r:
    sort file in reverse order) |

    | `split -b` | split a file to some files in given size | e.g. `split -b 11 file.txt`
    (split file to some 11 byte files named `xaa`, `xab`, `xac`, etc.) |

    | `split -l` | split a file to some files in given size | e.g. `split -l 8 file.txt`
    (split file to some 8 line files named `xaa`, `xab`, `xac`, etc.) |

    | `ssh` | login to remote secure shell | e.g. `ssh ray@myexample.com` (securely
    connect to a remote host) |

    | `ssh -l` | login to remote secure shell | e.g. `ssh -l username hostname` (-l:
    specify your remote username) |

    | `stat` | list status about file size, access, etc. | e.g. `stat myfile.txt`
    (show `myfile.txt` statistics) |

    | `su` | switch user | e.g. `su user2` (switch user named `user2`) |

    | `su -l` | login as a root super user | e.g. `su -l` (-l: enter password, login
    root account) |

    | `sudo -u` | execute a command as another user | e.g. `sudo -u user2 ls /home/mydir`
    (-u: specify `user2` to execute `ls` cmd) |

