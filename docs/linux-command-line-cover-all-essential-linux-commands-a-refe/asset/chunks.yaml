    # Chapter 22


    # Skill of Commands


    Make use of Tab key to auto complete


    Linux offers so many different commands that we easily to get lost and to forget
    one. Personally, it happens very regularly, but this is fortunately not a drama.
    Indeed, Linux offers a variety of ways to find a command that you missed.


    The first "trick" to know what is to auto complete control.


    Example:


    For the date command: you''re a little headache and you do not know how it is
    written. By cons, you are sure the first or second letters of the command are
    “da”.


    Just type "da" in the console, then double-tap the Tab on the left of your keyboard


    By double tapping Tab, you asked the computer a list of commands that begin with
    "da". They said you "dash" and "date". So there are two commands that start with
    "da", and you just find the one you are looking for, that is to say "date".


    Very nice, the computer has rewritten the prompt below and the beginning of the
    command you typed. You only have to complete with the letters "you" missing and
    hitting Enter and it will be good. :-)


    Even more fun, if there is only one result for your search, the computer will
    complete with missing letters and you only have to press Enter!


    Example:


    If you want to type “chsh” command and you are not sure the spelling, you can
    only type “ch” in the console and press two times on Tab. The command is completed
    magically.  It will display ”chfn, chsh”, then you can choose “chfn”.


    Commaaaandes too!


    The command history


    We often need to find a command that was typed there five minutes (or even five
    seconds). Sometimes it is because we have forgotten the command, but it''s often
    because you like me you really too lazy to rewrite ourselves the entire command.


    This shortcut is gold: press the Up arrow key; you will see the last command you
    typed.


    If you press again the directional arrow Top, you will see the penultimate command,
    then the second-to-last, etc.


    If you press the Down arrow key, you will return to the most recent commands.


    Thus I can successively find the commands I just type in reverse command:


    ls --all;


    ls -a,


    ls;


    Date;


    Etc.


    If you want to "go" very far back into the history of your commands, no need to
    type a hundred times on the directional arrow Top like madmen.


    There is the history command that reminds you of the command history:


