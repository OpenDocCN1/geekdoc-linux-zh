    # Chapter 01

    ## Introduction to Linux


    ### About Linux Operating System

    Linux is a Unix-like and mostly POSIX-compliant computer operating system assembled
    under the model of free and open-source software development and distribution.


    Linux usually works as a server, because of its stability and security feature.


    The Linux operating system is extremely advantageous in IT industry:

    - Linux programs are mostly free for download.

    - They are frequently updated and for Zero charge!

    - A lot of functions are better than those in Windows. And some functions do not
    even exist in Windows!


    In order to know about the Linux better, we have to go back to 1984.


    #### 1984

    So we are back in 1984, computer science was not very developed perfectly. Microsoft
    has just launched its first OS: `MS-DOS`, which run by command line.


    #### But, was MS-DOS the only one then?

    #### No! There was another operating system existing but less known by the public.


    The one was called `Unix`. It was a lot of more powerful than `MS-DOS`, but more
    complicated, which explained why only the IT professionals were able to use `Unix`.


    Graphically `Unix` looked like `MS-DOS`, they both appear as a black screen with
    some white texts in it, and run by command lines.


    #### Creation of Linux

    In 1991, Linus Torvalds, a student at the University of Helsinki (Finland), began
    creating his free own operating system. This system became known as Linux, referring
    to the name of its creator (Linux is a contraction of Linus and UNIX).


    #### Three major OS’s nowadays

    `Mac OS` and Linux are both based on `UNIX`, the ancestor of these two operating
    systems. While `Windows OS`, from `MS-DOS`, is a separate branch.


    #### Linux distributions

    A Linux distribution (often called distro for short) is an operating system consisted
    of a collection of software based on the Linux kernel and a package management
    system. The most well known distributions are RedHat, SUSE, Debian, Mandriva,
    Slackware and Ubuntu. You can find a lot of software for different Linux distributions.

