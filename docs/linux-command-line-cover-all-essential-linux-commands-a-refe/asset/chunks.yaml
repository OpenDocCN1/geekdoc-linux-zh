  trans: "\n\n## `su`: 将普通用户切换为 root 超用户\n\n示例：\n```\nuser2014@user-linux:~$ su –l\n\
    ```\n(`su`: 将普通用户切换为 root 超用户。`–l`: 输入 root 密码并登录。注意：登录为超级用户后，`$` 将变为 `#`。）\n\n\
    ## `loginname`: 显示登录名\n\n示例：\n```\nroot@user-linux: ~ # loginname\n```\n(`loginname`:\
    \ 显示登录名，输出为“root”。注意：登录为超级用户后，`$` 变为 `#`。）\n\n## `exit`: 退出 shell \n\n示例：\n```\n\
    root@user-linux:~# exit\n```\n(`exit`: 退出 shell。在此处：退出超级用户模式，并回到普通用户模式。注意：退出超级用户后，`#`\
    \ 将变为 `$`。）\n\n## `whoami`: 显示当前用户名\n\n示例：\n```\nuser2014@user-linux: ~ $ whoami\n\
    ```\n(`whoami`: 显示当前用户名，输出为“user2014”。）\n\n## `hostname`: 显示当前主机名\n\n示例：\n```\n\
    user2014@user-linux: ~ $ hostname\n```\n(`hostname`: 显示当前主机名，输出为“user-linux”。）\n\
    \n## `sudo`: 允许具有适当权限的用户以用户的身份执行命令，例如超级用户\n\n示例：\n```\nroot> sudo -u andy ls /home/mydir\n\
    ```\n(以用户 andy 的身份列出 `/home/mydir` 目录的内容。`-u`: 指定用户)\n\n示例：\n```\nroot> sudo –v\n\
    ```\n(`-v`: 刷新认证超时，下次 `sudo` 命令将不需要密码。）\n\n示例：\n```\nroot> sudo -k\n```\n(`-k`:\
    \ 过期认证超时，下次 `sudo` 命令将需要密码。）\n\n### 总结\n- `su`: 将普通用户切换为 root 超用户\n- `loginname`:\
    \ 显示登录名\n- `exit`: 退出 shell。\n- `whoami`: 显示当前用户名\n- `hostname`: 显示当前主机名\n- `sudo`:\
    \ 允许具有适当权限的用户以用户的身份执行命令，例如超级用户。\n\n# 第 04 章：导航 At 命令\n\n- `pwd`: 打印工作目录。\n- `cd\
    \ dir`: 切换目录。\n- `cd~`: 切换到家目录。\n- `cd..`: 切换到父目录。\n- `type`: 确定命令类型。\n\n### `pwd`\
    \ 示例\n```\nuser> pwd\n```\n(`pwd`: 打印工作目录，输出为你的当前工作目录。）\n\n### `cd dir` 示例\n```\n\
    user> cd mydir\n```\n(`cd`: 切换目录到 mydir，输出为 mydir。）\n\n### `cd~` 示例\n```\nuser>\
    \ cd ~\n```\n(`cd~`: 切换到家目录，输出为家目录。）\n\n### `cd..` 示例\n```\nuser> cd ..\n```\n\
    (`cd..`: 切换到父目录，输出为父目录。）\n\n### `type` 示例\n```\nuser> type pwd\n```\n(输出: `pwd`\
    \ 是 shell 内置命令。)\n\n### 总结\n- `pwd`: 打印工作目录。\n- `cd`: 切换目录。\n- `cd~`: 切换到家目录。\n\
    - `cd..`: 切换到父目录。\n- `type`: 确定命令类型。\n\n# 第 05 章：文件操作命令\n\n- `cp`: 复制文件\n- `mv`:\
    \ 移动文件\n- `mv`: 重命名文件\n- `rm`: 删除文件\n- `rm –ri`: 删除非空目录\n- `vi`: 打开 vi 编辑器并编辑文件\n\
    - `find`: 查找文件\n- `wc`: 显示文件字数\n- `file`: 描述文件类型\n- `ln`: 在两个文件之间创建链接\n- `ln -s`:\
    \ 创建文件的符号链接\n- `readlink`: 显示符号链接的目标\n- `lpr`: 将文件发送到打印机\n- `lpq`: 显示打印队列。\n\n\
    ### `cp` 示例\n```\nuser> cp myfile /dir1\n```\n(`cp`: 将 `myfile` 复制到 `/dir1` 目录。）\n\
    \n### `mv` 示例（移动）\n```\nuser> mv myfile /dir2\n```\n(`mv`: 将 `myfile` 移动到 `/dir2`\
    \ 目录。）\n\n### `mv` 示例（重命名）\n```\nuser> mv myfile1 myfile2\n```\n(`mv`: 将 `myfiel1`\
    \ 重命名为 `myfile2`。）\n\n### `rm` 示例\n```\nuser> rm myfile\n```\n(`rm`: 删除 `myfile`。）\n\
    \n### `rm –ri` 示例\n```\nuser> rm –ri NonEmptyDir\n```\n(`rm`: 删除名为 `NonEmptyDir`\
    \ 的目录。`-ri`: 删除包含内容的目录。）\n\n### `vi` 示例\n```\nuser> vi myfile.txt\n```\n(`vi`:\
    \ 打开 vi 编辑器并编辑 `myfile.txt`。）\n\n### `find` 示例\n```\nuser> find directory –type\
    \ f –name myfile.txt -print\n```\n(`find`: 查找文件。`-type f`: 指定文件，`-name`: 指定文件名，`-print`:\
    \ 打印）\n\n### `wc` 示例\n```\nuser> wc myfile.txt\n```\n(`wc`: 显示 `myfile.txt` 的字数。）\n\
    \n### `file` 示例\n```\nuser> file myfile.txt\n```\n(`file`: 描述 `myfile.txt` 的类型。）\n\
    \n### `ln` 示例\n```\nuser> ln dir1/file1.txt dir2/file2.txt\n```\n(`ln`: 在 `file1`\
    \ 和 `file2` 之间创建链接。）\n\n### `ln -s` 示例\n```\nuser> ln –s dir1/file1.txt dir2/file2.txt\n\
    ```\n(`ln-s`: 在 `file1` 和 `file2` 之间创建符号链接。`-s`: 符号链接允许给定文件同时出现在多个地方或多个名称下。例如，符号链接可以链接到目录。）\n\
    \n### `readlink` 示例\n```\nuser> readlink dir2/file2.txt\n```\n(输出：`dir1/file1.txt`)\n\
    \n### `lpr` 示例\n```\nuser> lpr myfile.txt\n```\n(`lpr`: 将 `myfile.txt` 发送到打印机。）\n\
    \n### `lpq` 示例\n```\nuser> lpq\n```\n(`lpq`: 显示打印队列。）\n\n### 总结\n- `cp`: 复制文件\n\
    - `mv`: 移动文件\n- `mv`: 重命名文件\n- `rm`: 删除文件\n- `rm –ri`: 删除非空目录\n- `vi`: 打开 vi 编辑器并编辑文件\n\
    - `find`: 查找文件\n- `wc`: 显示文件字数\n- `file`: 描述文件类型\n- `ln`: 在两个文件之间创建链接\n- `ln -s`:\
    \ 创建文件的符号链接\n- `readlink`: 显示符号链接的目标\n- `lpr`: 将文件发送到打印机\n- `lpq`: 显示打印队列。\n\n\
    # 第 06 章：查看文件命令\n\n- `cat`: 查看文件内容\n- `cat | less`: 分页查看文件内容\n- `cat | more`:\
    \ 分屏查看文件内容\n- `head`: 查看文件开头部分\n- `tail`: 查看文件末尾部分\n- `aspell`: 检查拼写\n- `cut`:\
    \ 提取特定列\n- `paste`: 合并文件\n- `sort`: 排序文件\n- `stat`: 查看文件状态\n- `nl`: 为每行添加编号\n\
    - `tr`: 转换字符\n- `tee`: 读取标准输出并写入文件\n\n`cat` 示例\n```\nuser> cat myfile.txt\n```\n\
