    ## 常用 Linux 命令列表


    - `join`: join lines of files having common field. e.g. `join myfile1.txt myfile2.txt`
    (join lines of two files by same field)

    - `join`: join lines of two files. e.g. `join -i myfile1.txt myfile2.txt` (`-i`:
    ignore the differences)

    - `kill`: stop a job by number. e.g. `kill %3` (terminate job %3)

    - `kill`: stop a process by pid. e.g. `kill 3956` (terminate process 3956)

    - `killall`: stop a process by name. e.g. `killall norespond` (terminate process
    norespond)

    - `last`: show most recently logged-in users. e.g. `last` (list recent users’
    date, time…)

    - `lastb`: show bad login attempts. e.g. `lastb` (display bad login attempts)

    - `lastlog`: display the last login information. e.g. `lastlog -u username` (`-u`:
    specify a user)

    - `less`: show contents page by page. e.g. `less myfile.txt` (display myfile.txt
    page by page)

    - `let`: perform arithmetic on shell variables. e.g. `let a=12; let a=a+8; echo
    $a` (output: 20)

    - `link`: create a link to a file. e.g. `link file1.txt file2.txt` (create a link
    from file1 to file2)

    - `ln`: create a hard link to a file. e.g. `~/myfile.txt` (create a hard link
    to myfile.txt)

    - `ln -s`: create a link between two files. e.g. `ln -s file1.txt file2.txt` (create
    a symbolic link to file1/file2)

    - `locate`: find the location of a file or a directory. e.g. `locate myfile.txt`
    (locate myfile.txt on local machine)

    - `logname`: show the current user’s login name. e.g. `logname` (display the login
    name of user)

    - `look`: show words matching a given prefix. e.g. `look ab` (output: aba, abb,
    abc, abd…)

    - `lpc`: run the line printer control program. e.g. `lpc status` (show status
    of current print queue)

    - `lpq`: show the printer queue status. e.g. `lpq` (list the print queue)

    - `lpr`: send a print request to printer. e.g. `lpr myfile.txt` (send myfile.txt
    to printer)

    - `lprm`: cancel the printing job in print queue. e.g. `lprm 2` (remove printing
    job 2)

    - `ls`: list the contents of current directory. e.g. `ls` (list files and sub-directories)

    - `ls -l`: long list contents of current directory. e.g. `ls -l` (`-l`: long lists
    including permissions)

    - `ls -a`: lists all entries including hidden files. e.g. `ls -a` (`-a`: show
    all files)

    - `ls -t`: lists all entries by time stamps. e.g. `ls -t` (`-t`: show by time
    stamps)

    - `ls -lh`: lists contents in current directory. e.g. `ls -lh` (`-lh`: list files
    with size in mb and gb.)

    - `lsattr`: list the attribute of a file or a directory. e.g. `lsattr myfile.txt`
    (show myfile.txt attribute)

    - `lsof`: list opened files. e.g. `lsof` (list all opened files)


    ( To be continued )


    - `man`: get command help from manual. e.g. `man cat` (show manual page for cat)

    - `man -k`: search manual pages for keyword. e.g. `man -k printf` (`-k`: specify
    a keyword)

    - `md5sum`: create a md5 checksum number. e.g. `md5sum -c file.txt` (`-c`: validate
    file against a checksum)

    - `mesg`: enable or disable messaging. e.g. `mesg` (show the current write status)

    - `mesg y/n`: enable or disable messaging. e.g. `mesg y/n` (`y or n`: permit or
    deny messaging)

    - `mail`: send and receive mail. e.g. `mail ray@websprogram.com` (email to ray@websprogram.com)

    - `mkdir`: make a new directory. e.g. `mkdir mydir` (create a directory named
    mydir)

    - `mknod`: make a device file. e.g. `mknod /dev/dk b 45 0` (`dk`:device;`b`:block;
    `45`:major no.; `0`:minor no.)

    - `more`: show content one screen at one time. e.g. `more +2 myfile.txt` (`+2`:
    beginning at line 2)

    - `mount`: mount a storage device. e.g. `mount /dev/cd` (mount a device cd)

    - `mount -l`: mount or show devices. e.g. `mount -l` (`-l`: list all mounted devices)

    - `mt`: magnetic tape drive control. e.g. `mt -f /dev/tape eod` (`-f`: select
    eod; move to end of data)

    - `mv`: move a file to another directory. e.g. `mv myfile.txt /home/user/mydir`
    (move myfile.txt to mydir directory)

    - `mv`: rename a file. e.g. `mv myfile1.txt myfile2.txt` (rename myfile1 to myfile2)

    - `netstat`: display network status. e.g. `netstat` (print network connections,
    routing tables.etc)

    - `nice`: set the priority level of a job. e.g. `nice -19` (set priority level
    as 19)

    - `nl`: add text with number lines. e.g. `nl mylist.txt` (make lines for mylist.txt)

    - `nohup`: ignore hangup signals. e.g. `nohup` (run ignoring hangup)

    - `nslookup`: query internet servers. e.g. `nslookup example.com` (return IP like
    75.126)

    - `passwd`: modify a user password. e.g. `passwd username` (change password for
    username)

    - `paste`: merge lines of multiple files. e.g. `paste file1.txt file2.txt` (merge
    contents for file1 and file2)

    - `pidof`: show process ID of running program. e.g. `pidof console` (display console’s
    process)

    - `ping`: send data to a host, await response. e.g. `ping xmvfz.com` (test if
    remote host can be reached)

    - `ping -c`: test if remote host can be reached. e.g. `ping -c 5` (`-c`: specify
    number of pings)

    - `pkill`: kill a running process. e.g. `pkill firefox` (stop browser)

    - `pr`: prepare text files for printing. e.g. `pr myfile.txt` (prepare myfile.txt
    for printing)

    - `pr -n`: prepare text files for printing. e.g. `pr -n myfile.txt` (`-n`: specify
    number in line)

    - `pr -h`: prepare text files for printing. e.g. `pr -h myfile.txt` (`-h`: specify
    header)

    - `printenv`: show the environment variables. e.g. `printenv` (list values of
    environment)

    - `printf`: format and print data. e.g. `printf "start"` (backspace)

    - `printf`: format and print data. e.g. `printf "hello\n"` (prints newlines)

    - `ps -f`: show the process status. e.g. `ps -f` (`-f`: full information of current
    process)

    - `ps -u`: show the process status. e.g. `ps -u ray` (`-u`: specify user’s current
    process)

    - `pstree`: displays process in tree structure. e.g. `pstree` (show all process
    as a tree)

    - `pwd`: print working directory. e.g. `pwd` (display current directory)

    - `rcp`: remotely copy file between two hosts. e.g. `rcp file.txt host2:/dir2/file.txt`
    (remotely copy file.txt to host2)

    - `read`: read a line from standard input. e.g. `read name; echo "$name"` (input
    ray, output ray)

    - `reboot`: restart the system. e.g. `reboot` (cause the computer to restart)

    - `renice`: change the priority level of a job. e.g. `renice 3 23001` (set priority
    level as 3 for job 23001)

    - `restore`: restores data from the backup file. e.g. `restore -f databackup`
    (`-f`:specify a backup file)

    - `rlogin`: remotely login to a system. e.g. `rlogin -l username domain.com` (`-l`:
    specify a username)

    - `rm`: remove one or more files. e.g. `rm myfile.txt` (remove myfile.txt)

    - `rm -r`: remove non-empty directory. e.g. `rm -r /NonEmptyDir` (`-r`: remove
    directory and its content)

    - `rm -i`: remove non-empty directory or a file. e.g. `rm -i myfile.txt` (`-i`:
    ask before removing)

    - `rmdir`: remove empty directory. e.g. `rmdir /emptydir` (delete directory without
    contents)

    - `route`: show or modify the IP routing table. e.g. `route -n` (`-n`: show in
    numerical format)

    - `rsync`: remotely synchronize files. e.g. `rsync myfile host2:/dir2/myfile`
    (sync. myfile with remote host2)

    - `scp`: securely copy files amid two hosts. e.g. `scp file.txt host2:/dir2/file.txt`
    (securely copy file to remote host2)

    - `screen`: open the terminal window manager. e.g. `screen` (start a new screen)

    - `sdiff`: show two files’ difference side by side. e.g. `sdiff myfile1.txt myfile2.txt`
    (compare two files side by side)

    - `sed`: filter and transform input text. e.g. `sed "{print $3}" myfile.txt` (display
    the third word of each line)

    - `seq`: list sequence numbers in given range. e.g. `seq 1 8` (output: 1 2 3 4
    5 6 7 8)

    - `seq -w`: list sequence numbers in given range. e.g. `seq -w 1 3` (`-w`: with
    zeros, output: 01 02 03)

    - `seq`: list sequence numbers in given range. e.g. `seq -s| 1 3` (`-s`: with
    separators, output: 1|2|3)

    - `set`: set shell variable or function. e.g. `set n=`who am i`; echo $n` (output:
    who am i)

    - `sftp`: securely transfer files by ftp. e.g. `sftp ServerURL` (securely transfer
    files to a Server)

    - `shopt`: show the shell option settings. e.g. `shopt` (show the shell behavior
    settings)

    - `shutdown`: close system. e.g. `shutdown 22:00` (shut down at 22:00 o’clock)

    '
