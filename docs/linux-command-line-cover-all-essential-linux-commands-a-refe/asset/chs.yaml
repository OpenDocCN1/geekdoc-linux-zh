  \  myfile2.txt\n```\n(`diff`: 显示两个文件之间的差异。)\n\n`cmp`: 逐字节比较两个文件\n\nExample:\n\n\
  ```bash\nuser> cmp myfile1.txt  myfile2.txt\n```\n(`cmp`: 逐字节比较两个文件。)\n\n`comm`:\
