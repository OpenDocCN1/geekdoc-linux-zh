  \ 将系统切换到运行级别 n\n- `who -r`: 显示当前的运行级别\n- `free`: 显示空闲磁盘空间\n- `du`: 显示文件或目录的磁盘占用情况\n\
  - `export`: 设置环境变量\n- `printenv`: 列出环境变量名称和值\n- `unset`: 移除环境变量\n- `clear`: 清除屏幕\n\
  - `exit`: 退出 shell 或注销。\n- `shutdown –h +n`: 系统将在 n 分钟后关机！\n\n# 第 21 章：帮助命令\n\n\
  | 命令 | 操作与示例 |\n| :--- | :--- |\n| `man` | 显示命令的帮助手册。例如 `man nice` (显示 `nice` 命令的手册)\
  \ |\n| `info` | 显示命令的信息。例如 `info chmod` (显示关于 `chmod` 命令的信息) |\n| `whatis` | 显示命令的描述。例如\
  \ `whatis ifconfig` (显示 `ifconfig` 是什么的描述) |\n| `help` | 显示命令的帮助解释。例如 `help cd`\
  \ (显示 `cd` 命令的帮助解释) |\n| `apropos` | 搜索手册页中的关键词。例如 `apropos download` (显示包含“download”的手册条目)\
  \ |\n| `--help` | 使用 `-help` 选项获取命令的帮助。例如 `wget --help` (获取 `wget` 命令的帮助) |\n\n\
  **注意：** 如果你熟悉这些帮助命令，你将了解完整的 Linux 命令及其用法。\n\n# 第 22 章：命令技巧\n\n### 利用 Tab 键进行自动补全\n\
  Linux 提供了许多不同的命令，我们很容易迷失并忘记其中一个。对我个人来说，这种情况经常发生，但幸运的是这并不是什么麻烦。事实上，Linux 提供了多种方法来找到你遗漏的命令。\n\
  \n知道第一个“技巧”是了解自动补全控制。\n\n### 示例：date 命令\n对于 `date` 命令：你现在有点头疼，不知道它是怎么拼写的。根据直觉，你确定命令的第一个或第二个字母是“da”。\n\
  \n只需在控制台中输入 \"da\"，然后双击键盘左侧的 Tab 键。\n\n通过双击 Tab，你向电脑请求了一列表以 \"da\" 开头的命令。它们显示了 \"\
  dash\" 和 \"date\"。所以有两个以 \"da\" 开头的命令，你只需要找到你寻找的那个，即 \"date\"。\n\n非常棒，电脑已经重写了下方的提示符和你输入命令的开头。你只需要补全缺失的字母\
  \ \"you\" 并按回车键，就搞了。:-)\n\n更有趣的是，如果你的搜索只有一个结果，电脑会自动补全缺失的字母，你只需要按回车键了！\n\n### 示例：chsh\n\
  如果你想输入 `chsh` 命令但不确定拼写，你只需要在控制台中输入“ch”并按两次 Tab。命令就会魔术般地完成。它会显示 ”chfn, chsh”，然后你可以选择“chfn”。\n\
  \n命令也是如此！\n\n### 命令历史记录\n我们经常需要找到几分钟前（甚至是几秒钟前）输入的命令。有时是因为我们忘记了命令，但通常是因为你像我一样，真的懒得重写整个命令。\n\
  \n这个快捷键是金子：按下方向上键；你将看到你输入的上一个命令。\n\n再次按下方向上键，你将看到倒数第二个命令，然后是倒数三个，以此此类推。\n\n如果你按下方向下键，你将返回最近的命令。\n\
  \n因此，我可以倒序找到我刚刚输入的命令：\n```bash\nls --all;\nls -a,\nls;\nDate;\n```\n等等等。如果你想在命令历史中回溯非常久以前，不需要像疯子一样狂按上百次方向上键。\n\
  \n有一个 `history` 命令可以提醒你命令历史：\n\n### 示例\n```bash\nhistory\n```\n\n\n\n\n\n按下向上方向键；你将看到你输入的上一条命令。然后屏幕将显示：\n\
  \nDate 152 ls ls ls 153 154 155--all -a 156 157 history\n\n你会发现这些控制是有编号的：因此，我们可以知道\
  \ `date` 是我在终端中输入的第 152 条命令，而三个 `ls` 分别是第 153、154 和 156 条命令。当然，你输入的上述最后一条命令始终会是\
  \ `history`。\n\n### Ctrl + R：查找历史命令\n\n如果使用方向方向键和 `history` 命令不足以找到你输入过的旧命令，有一个超级实用的快捷键：`Ctrl+R`。它可以帮助你找到刚刚使用过的历史命令。因此，同时按下\
  \ `Ctrl+R` 键，计算机将切换到“查找已输入的命令”模式（\"R\" 代表 research，搜索）。\n\n在那里，你可以输入任何与旧命令对应的字母序列。\n\
  \n### 示例：\n\n如果你想查找之前使用过的带有“all”的命令，请按 `Ctrl+R` 并输入 \"all\"。然后，Linux 将找到包含单词“all”的\
  \ `ls --all`。你只需按回车键即可运行该命令！:-)\n\n如果这不是你正在寻找的命令，再次按 `Ctrl + R` 向上移动包含 \"all\" 的命令列表。\n\
  \n这在这样的驱动器上看起来可能很愚蠢，但有些命令非常长，不需要重新编写它们真是一件乐！\n\n## 使用通配符\n\n你可以在许多 Linux 命令中使用通配符。通配符表示其他字符的符号或符号组合。Linux\
  \ 命令中有三种通配符：\n\n- `?` 问号（`?`）表示单个字符。\n  例如：`b??k` 匹配 bank, beak, back, bilk 或任何以\
  \ b 开头并 k 结尾的四字母文件名。\n- `*` 星号（`*`）表示任意字符或一组字符，包括零字符或多个字符。\n  例如：`b*k` 匹配 bk, bkk,\
  \ bark, break, backtrack。\n- `[ ]` 方括号内的字符（`[ ]`）通常表示集合中的任意字符。但请注意它们是区分大小写的。\n \
  \ 例如：`b[a-z]k` 匹配 bak, bbk, bck, bzk，但不匹配 `bAk`, `bBk`, `bCk`, `bZk`，因为区分大小写敏感。\n\
  \n通配符实际上是在 Linux 命令中实现的。\n\n### 示例：\n\n```bash\nuser2014@user-linux: ls b??k\n```\n\
  （通配符 `b??k` 匹配当前目录下的五个文件。输出为“bank beak back bilk bark”）\n\n### 示例：\n\n```bash\n\
  user2014@user-linux: ls a*d\n```\n（通配符 `a*d` 匹配当前目录下的某些文件。输出为“ad add acid abroad\
  \ abounded abed aid”）\n\n### 示例：\n\n```bash\nuser2014@user-linux: ls se[a-e]\n```\n\
  （通配符 `se[a-e]` 匹配当前目录下的五个文件。输出为“sea seb sec sed see”）\n\n## 关于运行级别 (Run Levels)\n\
  \n什么是运行级别？运行级别一术指的是实现 Linux System V 风格初始的操作系统之一的运行模式。通常存在七个运行级别，编号从零到六；启动时只执行一个“运行级别”——运行级别不是顺序执行的，即执行运行级别\
  \ 2 或 3 或 4，而不是先执行 2 再执行 3 然后 4。\n\n“运行级别”定义了机器启动后的状态。不同的运行级别通常分配给：\n\n0. halt-关机-系统正在关闭过程中。\n\
  1. 单用户模式\n2. 未启动网络服务的多用户模式\n3. 已启动网络服务的多用户模式\n4. 系统关机\n6. 系统重启\n\n### 示例：\n\n```bash\n\
  root@user-linux: ~ # init 3\n```\n(`init 3`：将系统切换到运行级别 3）\n\n### 总结：\n\n- `Tab`\
  \ 键可以自动补全缺失的命令。\n- `向上方向键` 可以查看历史命令。\n- `向下方向键` 可以返回最近的命令。\n- `Ctrl+R` 可以通过关键词查找历史命令。\n\
  - `?` 问号（`?`）表示单个字符。\n- `*` 星号（`*`）表示任意字符或一组字符，包括零字符或多个字符。\n- `[ ]` 方括号内的字符（`[ ]`）通常表示集合中的任意字符。但请注意它们是区分大小写的。\n\
  - 运行级别数字描述了已初始化并正在运行的服务级别。\n\n# 第 23 章\n\n## 权限\n\n### 什么是 rwx？\n\n在使用 `ls –l` 查看文件的访问权限后，你可以看到类似这样的内容：\n\
  \n`rwx ….. ……`\n\n解释：\n\n`rwx` 表示访问权限，可以用 1 到 7 的数字来描述。真的吗？是的，1 到 7 的数字表示访问权限。\n\
  \n- `r` 代表读取权限，值为 4。\n- `w` 代表写权限，值为 2。\n- `x` 代表执行权限，值为 1。\n\n反之亦然：\n\n- `4` 表示读取权限\
  \ (`r`)\n- `2` 表示写权限 (`w`)\n- `1` 表示执行权限 (`x`)\n\n### 示例：\n\n如果 `rwx` 值为 4，那么你可以判断出它的权限是只读。\n\
  如果 `rwx` 值为 2，那么你可以判断出它的权限是只写。\n如果 `rwx` 值为 1，那么你可以判断出它的权限是只执行。\n\n1 到 7 的数字表示各种访问权限：\n\
  \n- `7` 表示读、写、执行权限 (`7=4+2+1`)\n- `6` 表示读、写权限 (`6=4+2`)\n- `5` 表示读、执行权限 (`5=4+1`)\n\
  - `4` 表示只读权限 (`4=4+0`)\n- `3` 表示写、执行权限 (`3=2+1`)\n- `2` 表示只写权限 (`2=2+0`)\n- `1`\
  \ 表示只执行权限 (`1=1+0`)\n\n### 示例：\n\n如果 `rwx` 值为 7，那么你可以判断出它的权限是读、写和执行。\n如果 `rwx` 值为\
  \ 6，那么你可以判断出它的权限是读和写。\n如果 `rwx` 值为 1，那么你可以判断出它的权限是只执行。\n\n什么是 `rwx`？\n`rwx` 表示访问权限，可以用\
  \ 1 到 7 的数字来描述。真的吗？是的，1 到 7 的数字表示访问权限。\n\n`r` 代表读取权限，值为 4。\n`w` 代表写权限，值为 2。\n`x`\
  \ 代表执行权限，值为 1。\n\n反之亦然：\n\n`4` 表示读取权限 (`r`)\n`2` 表示写权限 (`w`)\n`1` 表示执行权限 (`x`)\n\
  \n示例：\n\n如果 `rwx` 值为 4，那么你可以判断出它的权限是只读。\n如果 `rwx` 值为 2，那么你可以判断出它的权限是只写。\n如果 `rwx`\
  \ 值为 1，那么你可以判断出它的权限是只执行。\n\n1 到 7 的数字表示各种访问权限：\n\n- `7` 表示读、写、执行权限 (`7=4+2+1`)\n\
  - `6` 表示读、写权限 (`6=4+2`)\n- `5` 表示读、执行权限 (`5=4+1`)\n- `4` 表示只读权限 (`4=4+0`)\n- `3`\
  \ 表示写、执行权限 (`3=2+1`)\n- `2` 表示只写权限 (`2=2+0`)\n- `1` 表示只执行权限 (`1=1+0`)\n\n### 示例：\n\
  \n如果 `rwx` 值为 7，那么你可以判断出它的权限是读、写和执行。\n如果 `rwx` 值为 6，那么你可以判断出它的权限是读和写。\n如果 `rwx`\
