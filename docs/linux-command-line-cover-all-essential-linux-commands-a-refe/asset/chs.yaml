  - `tr`: 转换文件中的文本\n- `tee`: 打印标准输出并写入文件\n\n# 第 07 章\n\n## 文件比较命令\n\n`diff`: 显示两个文件之间的差异\n\
  \n`cmp`: 逐字节比较两个文件\n\n`comm`: 按行比较两个文件\n\n`md5sum`: 创建 md5 校验和数字\n\n`cksum`: 创建\
