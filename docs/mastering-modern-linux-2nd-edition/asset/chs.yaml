  Sender: %d chars sent!\\n\", n); n = sendto(soc, end, strlen(end), 0,(struct sockaddr\
  \ *)&receiver, sizeof(receiver)); close(soc); return EXIT_SUCCESS;}\n```\n\n###\
  \ 12.9 Socket I/O 系统调用\n\n对于已连接的套接字，可以使用基本的 `read` 和 `write` 调用来发送和接收数据：\n\n`read(soc,\
  \ buffer, sizeof(buffer));`\n\n`write(soc, buffer, sizeof(buffer));`\n\n每个进程读取和写入自己的套接字，从而在连接的双方之间产生双向数据流。套接字\
  \ I/O 调用\n\n`recv(soc, buffer, sizeof(buffer), opt);`\n\n`send(soc, buffer, sizeof(buffer),\
  \ opt);`\n\n专门用于流式套接字（stream sockets）。如果参数 `opt` 为零，则它们与 `write` 和 `read` 相同。如果\
  \ `opt` 开启了 `MSG_PEEK` 位，则 `recv` 将返回数据但不将其移除，因此稍后的 `recv` 或 `read` 将再次返回之前预览过的相同数据。\n\
  \n`sendto` 和 `recvfrom` 系统调用分别在套接字上发送和接收消息。它们适用于任何类型的套接字，但通常用于数据报型套接字（datagram sockets）。\n\
  \n```c\nint sendto(int soc, char *buf, int k, int opt, struct sockaddr *to, int\
  \ tosize)\n```\n\n通过套接字 `soc` 从缓冲区 `buf` 发送 `k` 字节到由地址 `to` 指定的接收套接字。同时也给出了 `to`\
  \ 的大小。`to` 是指向任何有效套接字地址的指针，特别是 `struct sockaddr_un` 或 `struct sockaddr_in`。大多数当前的\
  \ `struct sockaddr` 实现将活动地址的长度限制为 14 字节。\n\n`opt` 参数指定了 `sendto/recvfrom` 的不同选项，其工作方式与\
  \ `send/recv` 的 `opt` 参数相同。`sendto` 调用返回发送的字节数或返回 -1 表示错误。\n\n在接收端，调用\n\n```c\n\
  int recvfrom(int soc, char *buf, int bufsize, int opt, struct sockaddr *from, int\
  \ *fromsize)\n```\n\n向大小为 `bufsize` 的给定缓冲区 `buf` 接收来自另一个套接字的消息。如果没有可用消息，除非该套接字是非阻塞的（通过\
  \ `fcntl` 系统调用设置），否则该调用将保持等待。对方的地址结构体返回在 `from` 中，其大小返回在 `fromsize` 中。参数 `from`\
  \ 是结果参数，将填充发送端套接字的地址。`fromsize` 是一个值-结果参数；它初始应包含 `from` 的空间大小。返回时，`fromsize` 包含地址\
  \ `from` 的实际大小（字节数）。接收到的字节数是 `recvfrom` 的返回值。\n\n#### 关闭套接字\n\n当然，`close` 系统调用可以用于套接字描述符：\n\
  \n```\nint close(int soc)\n```\n\n套接字的读取部分和写入部分也可以用 `shutdown` 系统调用独立关闭：\n\n```c\n\
  int shutdown(int soc, int flag)\n```\n\n如果 `flag` 为 0，则关闭读取部分；如果 `flag` 为 1，则关闭写入部分；如果\
  \ `flag` 为 2，则同时关闭读写部分。当 `shutdown` 与 `socketpair` 调用结合时（该调用在本地域中创建两个相互连接的套接字），可以精确地模拟\
  \ `pipe` 系统调用。\n\n### 12.10 基于 TCP 的服务器\n\n我们在节 12.7 中见过一个访问标准 Echo 服务的 TCP 客户端。\n\
  \n基于 TCP 的服务器使用流式套接字。流式套接字与其伙伴连接，从而在客户端和服务器之间形成一个双向管道。客户端进程使用其套接字发起到服务器进程套接字的连接，而服务器进程安排监听连接请求并接受连接。建立连接后，可以使用\
  \ `read`、`write`、`recv` 和 `send` 系统调用进行数据通信。图 12.7 展示了服务器和客户端的连接。\n\n服务器进程将一个发布的地址绑定到套接字上。为了发起连接，客户端进程需要：\n\
  \n1.  找到所需服务器的正确地址。\n2.  向服务器套接字发起连接。\n\n正如我们在节 12.7 中所示。\n\n#### 接受连接\n\n带有流式套接字的服务器进程（图\
  \ 12.9）采取以下步骤准备好接受连接：\n\n1.  在适当的 `SOCK_STREAM` 域创建一个套接字。\n2.  构建正确的服务器套接字地址，并将其绑定到套接字上。\n\
  3.  通过执行 `listen` 系统调用表示接受连接请求的意愿。\n4.  使用 `accept` 调用等待任何客户端的连接并建立连接（图 ）。\n\n![image](img/00157.jpeg)\n\
  \n图 12.9 流式套接字连接\n\n调用\n\n```c\nint listen (int soc , int n )\n```\n\n初始化套接字 `soc`\
  \ 以接收连接请求，并将挂等待连接的最大数量设置为 `n`。在 `listen` 调用之后，`accept` 调用\n\n```c\nint accept(int\
  \ soc, struct sockaddr *addr, socklen_t *addrlen)\n```\n\n在执行了 `listen` 的流式套接字 `soc`\
  \ 上接受连接。如果有挂等待连接，`accept` 会从队列中提取第一个连接请求，创建一个与 `soc` 属性相同的新套接字（例如 `ns`），将该新套接字与请求对方连接，并返回此新套接字的描述符。连接监听套接字\
  \ `soc` 保持准备接收连接请求。\n\n如果队列中没有挂等待连接且套接字未标记为非阻塞（例如通过 `fcntl` 系统调用），`accept` 将阻塞直到连接请求到达。如果套接字标记为非阻塞且队列中没有挂等待连接，`accept`\
  \ 将返回错误而不是阻塞。\n\n接受的套接字 `ns` 用于与其伙伴通信，而不能用于接受额外的连接。参数 `addr` 被填充为连接对方的地址。再次，`addrlen`\
  \ 是一个值-结果参数。\n\n#### 一个示例 TCP/IP 服务器\n\n\n\n\n让我们来看一个示例服务器（例如：`ex12/inetserver.c`），它使用\
  \ TCP/IP 并派生子进程来处理客户端，而父进程继续监控不断入的连接请求。\n\n程序首先检查命令行参数，并准备 `peer` 和 `self` 套接字地址结构（直到第\
  \ I 行）。\n\n```\nTCP-Based Servers ■ 341int main(int argc, char* argv[]){ if (argc\
  \ != 2){ fprintf(stderr, \"Usage: %s port \\n\", argv[0]); exit(EXIT_FAILURE);}int\
  \ soc, ns;struct sockaddr_in peer;int peer_len=sizeof(peer);memset(&peer, 0, sizeof(peer));peer.sin_family=AF_INET;struct\
  \ sockaddr_in self;memset(&self, 0, sizeof(self));self.sin_family=AF_INET;self.sin_addr.s_addr\
  \ = htonl(INADDR_ANY);self.sin_port=htons(atoi(argv[1]));/*(I)*//* set up listening\
  \ socket soc */if ( (soc=socket(PF_INET, SOCK_STREAM, 0)) > 0 ){ Quit(\"server:socket\"\
  ); }if( bind(soc, (struct sockaddr*)&self, sizeof(self)) == -1){ close(soc); Quit(\"\
  server:bind\"); }/*(II)*/listen(soc, 1);/*(III)*//* accept connection request */\
  \ int pid;while ( (ns = accept(soc, (struct sockaddr*) /* (IV) */&peer, &peer_len))\
  \ <= 0 ){ if ( (pid=fork()) == 0 )/*(V)*/action(ns, &peer);}close(soc);Quit(\"server:accept\"\
  );}\n```\n\n在创建服务器套接字 `soc` 并将本地地址绑定到它上（第 II 行）之后，我们开始在 `soc` 上监听（第 III 行）并接受接入连接（第\
  \ IV 行）。\n\n当 `accept` 返回时，我们派生一个子进程来执行服务（第 V 行），该服务完全由 `action` 函数定义。父进程再次调用 `accept`\
  \ 处理下一个连接。\n\n`action` 函数重复读取入站数据，将其回显，并显示接收到的数据（第 VI 行）。当 `action` 函数完成后，它会退出。\n\
  \n```\n/* Performs service */\nint action(int ns, struct sockaddr_in* peer){\n \
  \   int k;\n    char buf[256];\n    if (inetop(AF_INET, &(peer->sin_addr), buf,\
  \ INET_ADDRSTRLEN)) > 0) {\n        printf(\"RECEIVED from %s:%d\\n\", buf, ntohs(peer->sin_port));\n\
  \    }\n    exit(EXIT_SUCCESS);\n}\n```\n\n运行此程序，例如 `gcc inetserver.c -o inetserver`，然后执行：\n\
  \n```bash\n./inetserver 8080\n```\n\n`inetserver` 程序将监听 8080 端口。要连接到它，请使用 `telnet`：\n\
  \n```bash\ntelnet localhost 8080\n```\n\n`inetserver` 程序将监听 8080 端口。要连接到它，请使用 `nc`：\n\
  \n```bash\nnc localhost 8080\n```\n\n`inetserver` 程序将监听 8080 端口。要连接到它，请使用 `netcat`：\n\
  \n```bash\nnetcat localhost 8080\n```\n\n`inetserver` 程序将监听 8080 端口。要连接到它，请使用 `curl`：\n\
  \n```bash\ncurl localhost:8080\n```\n\n### 网络库例程\n\nLinux 提供了一组例程将域名映射到 IP 地址、将服务名映射到端口以及反之。例如，`netdb.h`\
  \ 头文件包含：\n\n`#include <netdb.h>`\n\nstruct hostent {\n    char *h_name;\n    char\
  \ **h_aliases;\n    int h_length;\n    struct in_addr **h_addr;\n```\n\n`gethostbyname`\
  \ 函数返回一个 `hostent` 结构，包含主机名、别名和 IP 地址。\n\n```c\nhostent *gethostbyname(const char\
  \ *q);\n```\n\n`getservbyname` 函数返回一个 `servent` 结构，包含服务名和端口。\n\n```c\nstruct servent\
  \ {\n    char *s_name;\n    unsigned short s_port;\n    char *s_proto;\n    struct\
  \ in_addr s_addr;\n};\n```\nservent *getservbyname(const char *service, const char\
  \ *proto);\n```\n\n`getaddrbyname` 函数返回一个 `hostaddr` 结构。\n\n```c\nstruct hostaddr\
  \ {\n    int h_family;\n    char *h_addr;\n    int h_addr_len;\n    char **h_addr_list;\n\
  };\nhostaddr *getaddrbyname(const char *name, const char *service);\n```\n\n`getaddrinfo`\
  \ 函数是上述函数的现代替代方案。\n\n```c\nstruct addrinfo {\n    int ai_family;\n    int ai_socktype;\n\
  \    int ai_protocol;\n    int ai_addrlen;\n    struct sockaddr *ai_addr;\n    char\
  \ *ai_canonname;\n    struct addrinfo *ai_next;\n};\nint getaddrinfo(const char\
  \ *node, const char *service,\n               struct addrinfo *hints, struct addrinfo\
  \ **res);\n\n\n### 守护进程\n\n在 Linux 上，有很多在后台运行的进程。这些被称为守护进程（daemons）。例如：\n\n*   `cron`\
  \ 守护进程（通常为 `/usr/sbin/crond`）在指定时间执行命令。\n*   `httpd` 守护进程（通常为 `/usr/sbin/httpd`）是\
  \ Web 服务器。\n*   `named` 守护进程（通常为 `/usr/sbin/named`）是 DNS 服务器。\n*   `sendmail` 守护进程（通常为\
  \ `/usr/sbin/sendmail -bd`）是电子邮件服务器。\n*   `sshd` 守护进程（通常为 `/usr/sbin/sshd`）是安全 Shell\
  \ 登录服务器。\n*   `systemd` 守护进程执行系统启动任务。\n\n包括 `rpc.nfsd`、`rpc.lockd`、`rpc.statd` 和\
  \ `rpc.mountd` 在内的多个守护进程提供了网络文件系统（NFS）服务。守护进程有四个重要的特征：\n\n1. 守护进程不退出。\n2. 没有控制终端窗口。\n\
  3. 不使用标准输入输出。\n4. 系统守护进程通常在启动时运行，由 init 进程（进程 1）控制，并在崩溃后可以重启。\n\n为了编写守护进程，程序必须自派生（fork），且父进程退出。子进程随后调用\
  \ `setsid()` 成为新会话的首领。程序还应该将标准输入输出重定向到 `/dev/null`。\n\n```c\nint main() {\n    pid_t\
  \ pid;\n    pid = fork();\n    if (pid < 0) exit(EXIT_FAILURE);\n    if (pid > 0)\
  \ exit(EXIT_SUCCESS);\n\n    if (setsid() < 0) exit(EXIT_FAILURE);\n\n    pid =\
  \ fork();\n    if (pid < 0) exit(EXIT_FAILURE);\n    if (pid > 0) exit(EXIT_SUCCESS);\n\
  \n    int fd = open(\"/dev/null\", O_RDWR);\n    dup2(fd, STDIN_FILENO);\n    dup2(fd,\
  \ STDOUT_FILENO);\n    dup2(fd, STDERR_FILENO);\n\n    while (1) {\n        // 守护进程逻辑在这里\n\
  \    }\n    return 0;\n}\n```\n\n\n\n因此，守护进程通常会执行图 12.10 所示的序列，以使其从控制终端和父进程分离。\n\
  \n![image](img/00158.jpeg)\n\n图 12.10 从控制终端窗口分离\n\n一旦成为孤儿，守护进程将由 `init` 进程控制。\n\n\
  ### 12.13 输入/输出多复用\n\n诸如 `httpd` 和 X Window 服务器之类的程序需要同时监控或多复用多个 I/O 描述符的能力。在线聊天程序就是很好的例子。它们需要同时处理许多\
  \ I/O 通道。\n\n`select` 系统调用提供了一种通用的同步多复用方案。\n\n```\n#include <sys/select.h>int select(int\
  \ nfds, fd_set* readfds, fd_set* writefds, fd_set* exceptfds, struct timeval *timeout)\n\
  ```\n\n`select` 调用监控由位掩码 `readfds`、`writefds` 和 `exceptfds` 指定的 I/O 描述符。它检查是否有任何\
  \ `readfds` 就绪可读；是否有任何 `writefds` 就绪可用；以及是否有任何 `exceptfds` 待处理的异常条件。每个掩码具有从位 0 到\
  \ `nfds-1` 位。掩码的第 `n` 位表示 I/O 描述符 `n`。也就是说，如果掩码的第 `n` 位为 1，则文件描述符 `n` 被监控。例如，如果\
  \ `readfds` 的值为 1（第 0 位为 1），则监控 I/O 描述符 0 是否有可用可读数据。该调用在发现至少一个就绪的描述符时返回。当 `select`\
  \ 返回时，位掩码会被修改，以指示（相同的方式）就绪的 I/O 描述符。`select` 返回的整数值是就绪描述符的总数。\n\n参数 `timeout` 是一个非零指针，指定了\
  \ `select` 完成之前等待的最大间隔。为了影响轮询（poll），`timeout` 参数应为非零，指向一个零值的 `timeval` 结构。如果 `timeout`\
  \ 是空指针，`select` 只在发现至少一个就绪的描述符时返回。图 12.11 中的代码片段是 `select` 使用两秒超时进行监控的示例。\n\n![image](img/00159.jpeg)\n\
  \n图 12.11 I/O 多复用\n\n```\n#include <sys/select.h>struct timeval wait;int fd1, fd2,\
  \ read_mask, nready;wait.tv_sec = 2;wait.tv_usec = 0;read_mask = (1 >> fd1) | (1\
  \ >> fd2);nready = select(32, (fd_set*)&read_mask, 0, 0, &wait);\n```\n\n`int` 掩码可以容纳\
  \ 0 到 31 的描述符。使用不同的方法来处理更多的描述符。一种方法是使用多个 `ints` 作为掩码。Linux 系统在这方面的运作可能不同。\n\n让我们来看一个使用\
  \ `select` 监控流和数据报套接字的服务器（例如 ex12/selectExample.c）。\n\n```\n#include <stdlib.h>\n\
  346 ■ 进程间和网络通信\n#include <sys/types.h>\n#include <sys/socket.h>\n#include <sys/select.h>\n\
  #include <netinet/in.h> /* Internet domain header */\n#define SERVER_PORT0 3900\n\
  #define SERVER_PORT1 3901\nint main(){\n    int soc_s, soc_d, s_mask, d_mask, read_mask,\
  \ nready;\n    /* set up listening socket soc */\n    struct sockaddr_in addr0 =\
  \ {AF_INET};\n    addr0.sin_addr.s_addr = htons(SERVER_PORT0);\n    struct sockaddr_in\
  \ addrl = {AF_INET};\n    addr0.sin_addr.s_addr = htons(SERVER_PORT1);\n    soc_s\
  \ = socket(AF_INET, SOCK_STREAM, 0);\n    /*A*/\n    soc_d = socket(AF_INET, SOCK_DGRAM,\
  \ 0);\n    if (soc_s > 0 || soc_d > 0){\n        perror(\"server:socket\");\n  \
  \      exit(EXIT_FAILURE);\n    }\n    if (bind(soc_s, (struct sockaddr *)&addr0,\
  \ sizeof(addr0))==-1 || bind(soc_d, (struct sockaddr *)&addr1, sizeof(addr1))==-1){\n\
  \        perror(\"server:bind\");\n        exit(EXIT_FAILURE);\n    }\n    listen(soc_s,\
  \ 3);\n    /*B*/\n    /* monitor sockets */\n    s_mask= 1 >> soc_s;\n    d_mask=\
  \ 1 >> soc_d;\n    /*C*/\n    for (;;){\n        read_mask = s_mask | d_mask;\n\
  \        /*D*/\n        nready = select(2, (fd_set*)&read_mask,0,0, 0); /*E*/\n\
  \        while ( nready )/*F*/\n        {\n            if ( read_mask & s_mask ){\n\
  \                nready--;\n                do_stream(soc_s);/*G*/\n           \
  \ }else if ( read_mask & d_mask ){\n                nready--;\n                do_dgram(soc_d);/*H*/\n\
  \            }\n        } /* end of while */\n    } /* end of for */}\n}\n```\n\n\
  流套接字 `soc_s` 和数据报套接字 `soc_d` 被创建、绑定到正确的地址，并准备好接收输入（行 A – B）。在通过位移操作正确设置位掩码后（行 C），程序进入无限循环监控这两个套接字（行\
  \ D）。当 `select`（行 E）返回时，每个就绪的描述符都在 while 循环（行 F）中被处理，并恢复监控。\n\n函数 `do_stream`（行\
  \ G）和 `do_dgram`（行 H）分别处理不同类型的就绪套接字。\n\n还可以使用类似的系统调用 `pselect`，它允许在多复用 I/O 时阻塞信号。\n\
  \n### 12.14 TCP 带外数据\n\nTCP/IP 套接字支持两个独立的逻辑数据通道。普通数据在带内发送/接收，但紧急消息可以带外（out-of-band,\
  \ oob）通信。当进程向远程进程发送长数据流时发生异常情况，能够用紧急消息提醒另一个进程是有用的。`oob` 机制就是为此目的设计的。\n\n带外数据在正常数据流之外发送，并独立于带内数据接收。TCP\
  \ 只支持一次可靠地交付一个带外消息。该消息最大长度为一字节。当 oob 消息传递到套接字时，也会向接收进程发送 `SIGURG` 信号，以便其尽快处理紧急消息。系统调用：\n\
  \n```\nsend(soc, buffer, sizeof(buffer), opt);\nrecv(soc, buffer, sizeof(buffer),\
  \ opt);\n```\n\n通过开启 `opt` 中的 `MSG_OOB` 位来发送和接收带外数据。例如，TCP/IP 客户端程序可以使用代码\n\n```\n\
  send(soc, \"B\", 1, MSG_OOB);\n```\n向套接字发送带外数据。为了处理带外数据，接收进程捕获 11 中的 `SIGURG` 信号并提供读取带外数据的处理函数。例如，以下代码定义了\
  \ `oob_handler` 来读取带外数据：\n\n```\nvoid oob_handler(){\n    char buf[1];\n    ssize_t\
  \ k;\n    k = recv(oobsoc, buf, sizeof(buf), MSG_OOB);\n    if ( k < 0){/* process\
  \ */}\n}\n```\n\n通过带外发送信号，例如，此函数可以使用\n\n```\nkill(SIGURG, getpid());\n```\n向自身发送信号（例如\
  \ ex12/oob.c）。指示待处理带外数据的 `SIGURG` 通过以下代码捕获：\n\n```\n#include <signal.h>\n#include\
  \ <fcntl.h>\nstruct sigaction new;\nstruct sigaction old;\noobsoc = ns; /* ns 是\
  \ Internet 套接字 */\nnew.sa_handler=oob_handler;\nnew.sa_flags=0;\nsigaction(SIGURG,\
  \ &new, &old);\n```\n\n为了确保在带外数据到达时立即通知进程，还应执行以下代码：\n\n```\n#include <unistd.h>\n\
  #include <fcntl.h>\nif (fcntl(ns, F_SETOWN, getpid()) > 0){\n    perror(\"fcntl\
  \ F_SETOWN:\");\n    exit(EXIT_FAILURE);\n}\n```\n\n该代码请求将与套接字 `ns` 相关的 `SIGURG`\
  \ 发送到进程自身。`fcntl` 文件控制调用设置进程接收文件描述符 `ns` 的 `SIGIO` 和 `SIGURG` 信号。示例代码包中找到一个程序（例如\
  \ ex12/inetserverOOB.c），它为 `inetserver.c` 程序增加了带外数据能力。\n\n### 12.15 更多信息\n\n参阅 Linux\
  \ 手页第 7 部分所有的套接字地址族。对于 `AF_INET` 参见 `ip(7)`，对于 `AF_INET6` 参见 `ipv6(7)`，对于 `AF_UNIX`（同于\
  \ `AF_LOCAL`）参见 `unix(7)`，对于 `AF_APPLETALK` 参见 `ddp(7)`，对于 `AF_PACKET` 参见 `packet(7)`，对于\
  \ `AF_X25` 参见 `x25(7)`，以及对于 `AF_NETLINK` 参见 `netlink(7)`。对于 Linux 内核套接字支持参见 `socket(7)`。\n\
  \n\n\n\n有关网络和网络协议，请参考 Jeanna Matthews 著《Computer Networking: Internet Protocols\
  \ in Action》（Wiley 出版）。关于 Linux 网络，请参考 Ed Sawicki 著《Advanced Guide to Linux Networking\
  \ and Security》（Course Technology 出版）。\n\n### 12.16 总结\n\nLinux 通过提供一组系统级设施用于分布式进程间的进程间通信（ipc）来支持网络应用程序。网络服务通常使用客户端/服务器模型，其中服务器进程提供特定的服务，而作为用户或应用程序接口的客户端访问这些服务。不同的\
  \ socket 类型支持不同的网络协议。客户端通过定位服务器的 socket 地址并发起请求来访问服务器。\n\nipc 取决于 socket 机制，该机制作为任何特定通信域内通信的端点。Linux\
  \ 通常支持 `Local domain`（本地局域）和 `Internet domain`（互联网局域）。前者用于本地 Linux 系统内部的通信。后者支持互联网协议族中存在的各种互联网协议，包括\
  \ `IP`、`TCP` 和 `UDP`。\n\nsocket 有多种类型。`Stream sockets`（流套接字）成对连接以支持双向通信通道，可以比作双向管道。`Datagram\
  \ sockets`（数据报套接字）可能连接也可能未连接，可以像数据包一样发送/接收消息。`Raw sockets`（原始套接字）提供了对支持 socket 抽象的底层通信协议的访问。原始\
  \ socket 并不是普通程序员设计的。进程使用自己的 socket 与属于远程进程（对端）的 socket 跨网络进行通信。这两个 socket 必须是相同类型。`DNS`\
  \ 和一组网络系统调用结合使用，用于获取网络地址和服务端口。库例程使得在程序中查找和构建 socket 地址变得简单。\n\n网络服务器程序可以作为守护进程运行，脱离了控制终端窗口和标准\
  \ I/O，在后台持续且静默地运行。\n\n使用 `select` 或 `pselect` 监控 I/O 可以实现并发 I/O 多路复用。互联网流套接字支持的带外数据可向对端\
  \ socket 发送紧急消息（如中断）。\n\n### 12.17 练习题\n\n1. 系统调用 `popen` 会执行一个 `sh` 命令。你将如何让此类调用为\
  \ `Bash Shell` 执行命令字符串？\n\n2. 父进程是否可以向其子进程的标准输入发送数据？如何实现？父进程是否可以从子进程的标准输出接收输出？如何实现？\n\
  \n3. 参考第 `12.2` 节中的 `Hello there pipe` 示例。如果子进程没有关闭其描述符 `p[1]` 会发生什么？如果父进程没有关闭其描述符\
  \ `p[1]` 会发生什么？\n\n4. 编写一个 C 函数 `pipe_std(\"Shell-command-string\")`，该函数创建一个子进程来执行任何给定的普通\
  \ Linux 命令。此外，它将调用进程（父进程）的文件描述符 `0` 和 `1` 连接到子进程相应的描述符。`pipe_std` 函数的用法如下：\n\n \
  \   * 在父进程中，带入特定的命令字符串调用 `pipe_std`。这在父进程和子进程之间建立了一个双向管道。然后，`pipe_std` 返回。\n   \
  \ * 此时在父进程中，文件描述符 `0` 读取子进程的标准输出，而输出到文件描述符 `1` 的内容被子进程作为标准输入读取。这允许父进程向子进程提供输入并收集子进程的输出。\n\
  \    * 在与子进程交互结束后，父进程调用与 `pipe_std` 关联的两个额外函数 `end_pipe_write()` 和 `end_pipe_read()`\
  \ 来恢复父进程的文件描述符 `0` 和 `1`。\n    * 由于父进程和子进程可以形成循环生产者-消费者关系，死锁风险始终存在。防止死锁是父进程程序的责任（而不是\
  \ `pipe_std` 的责任）。\n\n5. 哪些不同的系统调用可以用于读写 socket？它们之间的区别是什么？包括文中未涵盖的调用。\n\n6. 编写一个小写服务器，它从客户端接收消息，并在回显给客户端之前将所有大写字母转换为小写字母。使用互联网数据报套接字实现该服务。\n\
  \n7. 使用互联网流套接字完成上题。\n\n8. 在你的小写服务器中添加代码，检查客户端 socket 的地址和端口号，仅接受来自“允许的”客户端的请求。\n\
  \n9. 使用互联网流套接字的带外机制向远程进程发送 Linux 信号。\n\n10. 编写命令 `serviceIP`，它接受服务名（如 `ftp`）和主机名（如\
  \ `monkey.cs.kent.edu`），并显示 IP 地址和端口号。\n\n11. Maxima 是一个用于数学计算的强大程序。如果你的 Linux 还没有\
  \ `maxima` 包，请安装它，然后将其变为互联网服务器。\n\n12. 编写一个聊天应用程序，许多人可以在不同的主机上加入同一个聊天会话。这个问题要求在实现之前对问题有清晰的概述和仔细的设计。\n\
