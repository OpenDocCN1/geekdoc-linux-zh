  \ Apache\n\n如果你不想通过包管理器安装 Apache，可以手动安装 Apache。安装过程遵循标准的 Linux `configure`、`make`、`install`\
  \ 序列。\n\n如果你有 root 权限，你将能够 Apache 安装到如 `/usr/local` 的系统目录，并为其分配端口 80。如果没有，你仍然可以在自己的家目录下为自己（用于实验）安装\
  \ Apache 并使用非特权端口，如 8080。\n\n（注：原文后续部分存在大量无效重复和乱码，此处已根据逻辑停止以避免重复输出。）\n\n\n\nPHP\
  \ 是 Hypertext Preprocessor（超文本预处理器）的递归缩写，是一种强大且广泛用于生成动态 Web 内容的程序。它演变自 Rasmus Lerdorf\
  \ 的早期项目，`PHP 3.0` 于 1998 年年中发布。`PHP` 已经成为一种重要的服务器端脚本工具，在本文写作时，它已经越过了 7.2 版本。除了为\
  \ Web 提供服务外，`PHP` 还可以作为 Linux 命令用于通用文本处理。\n\n尽管 `PHP` 运行在多个平台上，但我们将重点关注作为 Linux\
  \ 上 Apache 服务器模块的 `PHP`。因此，`PHP` 作为 Apache 的一部分执行，并解释嵌入 Web 页面中的代码，为这些页面动态生成内容。例如，包含以下内容的\
  \ HTML 文档：\n\n```html\n<p>It is <?php echo(date(\"l M. d, Y\")); ?><br />do you\
  \ know where your project is?</p>\n```\n\n将生成文本：\n\nIt is Thursday June. 18, 2018,\n\
  \ndo you know where your project is?\n\n显示的日期取决于访问的确切时间。\n\n任何 `PHP` 代码都包含在 PHP\
  \ 括号 `<?php ... ?>` 中，并交错（嵌入）在普通的 HTML 代码或其他类型的代码中。包含此类嵌入代码的页面通常称为活动（或动态）页面，因为它们不是静态的，并且包含了由嵌入代码现场生成的信息。结果文档的接收者永远看不到嵌入代码；它会被其生成的任何信息所替换（图\
  \ 9.7）。\n\n![image](img/00120.jpeg)\n\n图 9.7 PHP 代码解释\n\n### 9.18 Apache 的 PHP 模块\n\
  \nApache 服务器通常被认为支持 `PHP`，为 Apache 添加 PHP 模块并不困难。有了 PHP 模块，Apache Web 服务器将能够在文档传输到\
  \ Web 的同时，解释任何类型文本文档中嵌入的 `PHP` 代码（图 9.7）。大多数 Linux 发行版在安装 Apache 时已经安装了 `PHP`。例如，你可能会在\
  \ Apache 模块文件夹中已经发现了 PHP 模块 `libphp*.so`（通常位于 `/etc/httpd/modules`）。\n\n你还可以使用 Linux\
  \ 软件包管理设施安装/更新 Apache+PHP：\n\n```bash\ndnf install httpd php php-common (CentOS/Fedora)\n\
  dnf upgrade httpd php php-common (CentOS/Fedora)\nsudo apt-get install apache2 php7.0\
  \ \\php7.0-mysql libapache2-mod-php7.0 (Ubuntu/Debian)\nsudo apt-get update apache2\
  \ php7.0 \\php7.0-mysql libapache2-mod-php7.0 (Ubuntu/Debian)\n```\n\n#### 安装 PHP\
  \ 模块\n\n本节描述如何手动安装 PHP 模块并将其添加到你的 Apache 服务器。如果你已经安装了 Apache+PHP，请跳过本节。\n\n首先，从\
  \ `www.php.net/downloads.php` 下载当前的 PHP 版本（`php-version.tar.gz` 或 `.tar.bz2`），检查\
  \ MD5 指纹，并像以前一样解压到你的 `$DOWNLOAD` 文件夹（节 9.16）。\n\n接下来，进入 PHP 源码文件夹 `$DOWNLOAD/php-version`\
  \ 来配置 PHP 模块。例如（示例：`ex09/makephp.bash`），\n\n然后检查 `conf.output` 查看你是否获得了这些行：\n\n\
  ```\nchecking if libtool supports shared libraries... yes\nchecking whether to build\
  \ shared libraries... yes\nchecking whether to build static libraries... no\n```\n\
  \n如果你需要重新执行配置步骤，请先运行清理：\n\n```bash\nmake distclean\n```\n\n成功配置后，你就可以准备创建 PHP 模块了。输入命令\n\
  \n```bash\nmake\n```\n\n这需要一些时间。完成后，你应该检查 `.libs/` 文件夹以查看是否已创建 PHP 模块 `libphp7.so`。如果是，执行命令\n\
  \n```bash\nmake install\n```\n\n安装目录由 `--prefix` 选项指定的 `$APACHE/php`。安装过程还会将 `libphp7.so`\
  \ 移动到文件夹 `$APACHE/modules/`，并修改 `$APACHE/conf/httpd.conf`，通过添加 Apache 配置指令来让 httpd\
  \ 在启动时加载 PHP 模块：\n\n```apache\nLoadModule php7_module modules/libphp7.so\n```\n\n\
  此外，你还需要添加其他几个指令来告诉 Apache 哪些文件需要 PHP 处理：\n\n```apache\nAddHandler application/x-httpd-ea-php70\
  \ .html .htm .php\nDirectoryIndex index.php index.html\n```\n\n如所述，任何时候对配置进行更改，你都需要重启\
  \ Apache（节 ）以使新配置生效。\n\n### 9.19 测试 PHP\n\n要测试你的 Apache+PHP，在文档根目录下创建一个名为 `info.php`\
  \ 的文件，内容如下：\n\n```php\n<?php phpinfo(); ?>\n```\n\n然后从 Web 浏览器访问 `http://localhost/info.php`。这将显示关于你\
  \ PHP 安装的详细信息，包括版本号和加载的模块。\n\n### 9.20 PHP 配置\n\nPHP 模块启动时会读取配置文件 `php.ini`。对 `php.ini`\
  \ 的任何更改只有在重启 Apache 后才会生效。\n\nPHP 有开关型（开启/关闭）和值配置指令。你编辑包含一组默认值的 `php.ini` 来进行任何调整。例如，如果你正在运行一个\
  \ Web 开发站点，显示错误信息将有助于调试，那么你应该设置（示例：`ex09/php.ini`）：\n\n```ini\ndisplay_errors =\
  \ On\ndisplay_startup_errors = On\n```\n\n对于生产 Web 服务器，你绝对希望将这些改为：\n\n```ini\ndisplay_errors\
  \ = Off\ndisplay_startup_errors = Off\nlog_errors = On\nerror_reporting = E_ALL\n\
  error_log = /var/log/php_errors.log\n```\n\nPHP 还允许你打开任何远程 URL。然而，如果你的站点不需要从 PHP\
  \ 打开远程 URL，你可以通过设置来增加安全性：\n\n```ini\nallow_url_fopen = Off\n```\n\nPHP 对 HTTP 文件上传也有很好的支持。如果你希望允许该操作，请使用：\n\
  \n```ini\nfile_uploads = On\nupload_max_filesize = 2M\n```\n\n### 9.21 PHP 命令行脚本\n\
  \nPHP 可以从命令行使用。这对于测试 PHP 代码以及利用 PHP 的功能编写命令行脚本非常有用。你可以如下所示创建一个 PHP 可执行文本文件：\n\n\
  ```php\n#!/usr/bin/php\n<?php\n// 此处编写 PHP 代码行\n?>\n```\n\n\n\n\n然后你可以像使用 BASH 脚本一样从命令行调用该脚本。例如，让我们写一个\
  \ PHP 脚本（例如：`09/echoback.php`），它是 `echoback.sh` 的版本（第 5 章节，第 5.11 节）。\n\n```\n#!/usr/bin/php>?php$output=\"\
  \\n\";array_shift($argv); // loses $argv[0] the command nameforeach ($argv as $arg){\
  \ $output = \" $arg\" . $output;}echo $output;?<\n```\n\n我们可以看到命令行参数存储在 PHP 特殊数组\
  \ `$argv` 中。使用以下任一命令执行此脚本：\n\n`php echoback.php A B C D E`\n\n`php -f echoback.php\
  \ A B C D E`\n\n`./echoback.php A B C D E`\n\n这里是使用 PHP for 循环的另一种实现（例如：`09/echoback2.php`）。\n\
  \n```\n#!/usr/bin/php>?phpfor ($n=$argc-1; $n < 0; $n--){ echo $argv[$n]; echo \"\
  \ \";}echo \"\\n\";?<\n```\n\n你也可以直接在命令行向 `php` 传递 php 代码。\n\n```\nphp -r 'print_r(phpversion());\
  \ echo \"\\n\";'php -r 'print_r(phpinfo()); echo \"\\n\";'\n```\n\n### 9.22 Web\
  \ 端的数据库支持 (#part0003.html_C2tocsec9_2022)\n\n计算机数据库是一个用于方便地存储、检索、更新和查询信息的系统，供许多用户并发访问。现代数据库是关系型的；信息存储在多个相互相关的表（见图\
  \ 9.8）中。\n\n![image](img/00121.jpeg)\n\n图 9.8 EMPLOYEES 表\n\n如果数据库系统支持结构化查询语言标准\
  \ API（应用程序编程接口），则该系统是 SQL 兼容的。例如，以下 SQL SELECT 查询从 `EMPLOYEES` 表中检索所有字段 `LAST` 为\
  \ \"Wang\" 的行：\n\n`SELECT * FROM EMPLOYEES WHERE LAST = \"Wang\";`\n\n用 SQL 编写的程序可以访问并操作任何\
  \ SQL 兼容的数据库。数据库可用于决策支持、在线事务处理、人事记录、库存控制、用户账户、多在线系统以及许多其他用途。\n\n数据库还可以让网站的构建、维护和更新更容易。另一方面，Web\
  \ 可以让任何连接到互联网的计算机访问数据库。\n\nPHP 为在 Web 中和从 Web 使用数据库提供了极佳的支持。PHP 的 `SQLite` 扩展是一个指向平面文件数据库的快速\
  \ SQL 接口，该数据库随 PHP（5 或更高版本）一起。对于许多简单的 Web 应用程序，`SQLite` 是恰好的解决方案。\n\n### 9.23 MySQL\
  \ (#part0003.html_C2tocsec9_2023)\n\n数据负载量更大、更复杂的网站需要比 `SQLite` 更强大的数据库系统。为此，免费的\
  \ `MySQL` 或 `MariaDB` 通常是正确的选择，特别是当与 Linux 和 PHP 结合使用时，因为 PHP 也有对连接和查询 `MySQL` 和\
  \ `MariaDB` 数据库的优秀内置支持。我们将关注 `MySQL`，但 `MariaDB` 完全相似。\n\n`MySQL` 是一个免费提供的开源关系型数据库管理系统，支持\
  \ SQL。它运行在 Linux、MS Windows®、Mac OS X® 以及其他系统上，并可以使用许多编程语言调用，包括 C/C++、Eiffel、Java、Perl、PHP、Python\
  \ 和 Tcl。`MySQL` 数据库服务器支持本地和网络访问。它支持权限和密码系统以指定谁可以访问/修改数据库系统的内容。\n\n大多数 Linux 发行版都自带了\
  \ `MySQL`。如果你能在系统中找到命令 `mysql`（通常在 `/usr/bin` 中），那么很可能你已经安装了 `MySQL`。要确定这一点，可以通过启动\
  \ `system-config-services` 或运行命令 `systemctl status mysqld` 来查找 `mysqld`。如果没有找到，或者你希望安装最新版本的\
  \ `MySQL`，请参考第 1.25 节。\n\n#### 初始化、启动和停止 MySQL (#part0003.html_C3tocsec9_3015)\n\
  \n`MySQL` 使用一个名为 `mysql` 的默认数据库用于自身目的，例如记录注册用户（`userid` 和密码）、管理数据库以及控制访问权限。运行一次\
  \ `mysql_install_db` 命令（在 `/usr/bin/` 中）来初始化 `MySQL` 默认数据库（通常位于 `/var/lib/mysql/mysql/`），该操作在\
  \ `MySQL` 服务器 `mysqld` 首次启动时自动完成。`mysql_install_db` 脚本包含许多 `MySQL` 的初始化设置，调整这些设置允许你自定义\
  \ `MySQL` 的各个方面。\n\n启动 `mysqld` 可以通过 `system-config-services` GUI 工具或命令完成\n\n`systemctl\
  \ start mysqld`\n\n可以使用相同的 GUI 和命令行工具来停止/重启 `mysqld`。\n\n`mysqld` 启动后，`MySQL` 客户端程序可以与其通信，以访问/操作由其提供的数据库（见图\
  \ 9.9）。\n\n![image](img/00122.jpeg)\n\n图 9.9 MySQL 服务器与客户端\n\n#### 运行时配置 (#part0003.html_C3tocsec9_3016)\n\
  \n当 `mysqld` 启动时，它读取 `my.cnf`（通常位于 `/etc`）中的配置值。作为 `mysqld`（服务器）的，它读取数据、套接字以及许多其他设置。MySQL\
  \ 通过要求 `userid` 和密码来保护数据库，并且根据用户拥有的权限，各种操作会被允许或拒绝。\n\n开始时，MySQL 有一个管理员（root）和一个空白密码。第一个管理任务是为\
  \ root 设置密码。为了实现这一点，编辑 `my.cnf` 并删除 `bind-address = 127.0.0.1`（如果存在），这会将 `MySQL`\
  \ 服务器限制为仅本地访问。后者允许 `MySQL` 客户端通过网络访问，这可能带来安全问题。前者要安全得多。通过在 `my.cnf` 的 `[mysqld]`\
  \ 和 `[mysqld_safe]` 部分中添加 `skip-networking` 设置。更改配置后需要重启 `mysqld`。关于 MySQL 配置的细节请参阅\
  \ MySQL 文档。\n\n运行 Linux 命令 `mysql_secure_installation` 以增强 MySQL 安装的安全性是一个好主意。启动\
  \ `mysqld` 后，可以使用 `netstat`（一个用于显示系统网络状态和活动的命令）来进行双检。运行命令\n\n`netstat -tap | grep\
  \ mysqld`\n\n如果你看到输出，说明 `mysqld` 允许网络访问。如果你没有看到输出，则只允许本地客户端访问`-tap` 选项让 `netstat`\
  \ 显示与 TCP 相关程序。\n\n#### 管理 MySQL (#part0003.html_C3tocsec9_3017)\n\nMySQL 通过要求 `userid`\
  \ 和密码来保护数据库，并根据用户拥有的权限允许或拒绝各种操作/访问。初始时，MySQL 有一个管理员（root）和一个空白密码。第一个管理任务是为 root\
  \ 设置密码。见 ²\n\n`mysqladmin -u root password new_password`\n\n选项 `-u` 指定 MySQL `userid`\
  \ root，管理操作是设置密码。确保你保存密码以备以后使用。假设 root 密码为 foobar。\n\nMySQL root 是可以创建新数据库、添加用户并为他们设置权限的用户。\n\
  \n`mysqladmin -h localhost -u root -pfoobar create lxux`\n\n获取主机名、用户名和密码信息并创建一个新数据库\
  \ `lxux`。\n\n现在我们可以将 `pwang` 添加为拥有 `lxux` 所有权限的用户。一种方法是使用 `mysql` 工具，它是 MySQL 数据库服务器的命令行界面。给出命令\n\
  \n`mysql -h localhost -u root -pfoobar lxux`\n\n然后你就进入 mysql 内部，可以输入 SQL 查询。执行以下操作（例如：ex09/adduser.sql）：\n\
  \n\n\n\n\n```mysql\nmysql< USE mysql; (setting database name to mysql)mysql< SHOW\
  \ TABLES; (listing names of tables)+-----------------+| Tables_in_mysql |+-----------------+|\
  \ columns_priv || db || func || host || tables_priv || user |+-----------------+mysql<\
  \ INSERT INTO user (Host, User, Password, Select_priv)-< VALUES ('', 'pwang', password('thePassword'),\
  \ 'Y');mysql< FLUSH PRIVILEGES;mysql< GRANT ALL PRIVILEGES ON lxux.* TO pwang-<\
  \ IDENTIFIED BY 'thePassword';mysql< FLUSH PRIVILEGES;mysql< quit\n```\n\n\n\n然后告知用户\
  \ `pwang` 他的用户名、密码和数据库名称。参考 `MySQL` 文档获取有关设置用户权限的更多信息。要重置 `pwang` 的密码，请使用以下 SQL：\n\
  \n```mysql\nmysql< USE mysql;mysql< update user set Password=PASSWORD('newOne')-<\
  \ WHERE User='pwang';\n```\n\n由于 `PHP` 通常在同一主机上可用，因此通常也会安装免费的 `phpMyAdmin` 工具 (`phpmyadmin.net`)\
  \ 以通过 Web 进行 `MySQL` 管理。`PhpMyAdmin`（章节 9.24）支持对 `MySQL` 的广泛操作。提供的 Web 浏览器 GUI 支持最常用的操作（管理数据库、表、字段、关系、索引、用户、权限等）。其他操作始终可以通过直接\
  \ SQL 语句完成。`root` 用户和特定数据库的任何用户都可以从 Web 任何地方通过 `phpMyAdmin` 进行数据库管理。\n\n### 重置 MySQL\
  \ Root 密码](#part0003.html_C3tocsec9_3018)\n\n不要忘记 `MySQL` root 密码很重要。然而，如果你发现自己处于这种情况下，可以重置它。作为\
  \ Linux `root`，首先停止 `mysqld`：\n\n```bash\nsystemctl stop mysqld\n```\n\n然后以安全模式运行不带安全检查的\
  \ `mysqld`：\n\n```bash\n/usr/bin/mysqld_safe –skip-grant-tables &\n```\n\n然后在在默认数据库\
  \ `mysql` 上运行 `mysql`：\n\n```bash\nmysql -u root mysql\n```\n\n然后更新 `root` 的密码：\n\
  \n```mysql\nmysql< update user set Password=PASSWORD('anything')-< WHERE User='root';Query\
  \ OK, 2 rows affected (0.04 sec)Rows matched: 2 Changed: 2 Warnings: 0mysql< flush\
  \ privileges; exit;\n```\n\n现在杀死 `mysqld_safe` 进程并重启 `mysqld`。\n\n### 9.24 安装 phpMyAdmin](#part0003.html_C2tocsec9_2024)\n\
  \n首先，从 `phpmyadmin.net` 下载最新版本并解压到你的 Web 文根目录（通常是 `/var/www/html`）。例如（Ex:ex09/myadmin.install），\n\
  \n```bash\ncd /var/www/html\ntar jxvpf phpMyAdmin-4.8.0-english.bz2\nrm phpMyAdmin-4.8.0-english.bz2\n\
  mv phpMyAdmin-4.8.0-english phpMyAdmin\n```\n\n生成的 `phpMyAdmin` 文件夹现在已位于 Web 文档根目录下，你可以通过\
  \ URL 显示安装说明和其他文档：\n\n`http://localhost.localdomain/phpMyAdmin/Documentation.html`\n\
  \n要安装 `phpMyAdmin`，你只需要做几件事。在 `phpMyAdmin` 文件夹中通过复制并编辑示例文件 `config.sample.inc.php`\
  \ 创建配置文件 `config.inc.php`。\n\n建议按照示例配置文件所示，在你的 `MySQL` 服务器上选择 cookie 验证方法并设置控制用户，这样任何拥有\
  \ `MySQL` 登录的用户都可以 `phpMyAdmin` 管理该特定用户访问的数据库。配置详情请见 `phpMyAdmin` 文档。\n\n安装后，URL：\n\
  \n`http://host /phpMyAdmin`\n\n任何有效用户都可以访问 Web `MySQL` 管理工具来管理数据库服务器。（图 9.10）。\n\
  \n![image](img/00123.jpeg)\n\n图 9.10 phpMyAdmin 工具\n\n`MariaDB` 也可以使用 `phpMyAdmin`。请确保安装最新版本的\
  \ `phpMyAdmin`。\n\n### 9.25 安装 MySQL/MariaDB](#part0003.html_C2tocsec9_2025)\n\n\
  `MySQL/Mariadb` 可能已经随你的 Linux 发行版一起。如果没有，Linux 软件包管理系统使得安装变得简单。对于 CentOS/Fedora，以\
  \ `root` 身份执行：\n\n```bash\ndnf install mysql mysql-server\ndnf upgrade mysql mysql-server\n\
  ```\n\n或者\n\n```bash\ndnf install mariadb mariadb-server\ndnf upgrade mariadb mariadb-server\n\
  ```\n\n对于 Ubuntu/Debian，执行其中之一：\n\n```bash\nsudo apt-get install mysql-server\n\
  sudo apt-get update mysql-server\n```\n\n或者\n\n```bash\nsudo apt-get install mariadb-server\n\
  sudo apt-get update mariadb-server\n```\n\n现在继续编辑 `my.cnf` 文件（章节 9.23），然后启动/重启 `mysqld`，即\
  \ `MySQL` 或 `MariaDB` 的服务器守护进程（章节 9.23）。\n\n如果你想一次性安装 `Apache+PHP+MySQL/MariaDB`\
  \ 以实现 LAMP，请使用这些命令。\n\nCentOS/Fedora:\n\n```bash\ndnf install httpd php php-common\
  \ mysql-server mysql\ndnf install httpd php php-common mariadb-server mariadb\n\
  ```\n\nUbuntu:\n\n```bash\nsudo apt-get install tasksel\nsudo tasksel install lamp-server\n\
  ```\n\n记住，这些安装作为开发系统非常棒，但作为生产系统还不够安全。企业级 Linux 版本极可能包含一个带有 LAMP 及更多功能的生产 Web 服务器。你在这里学到的知识将直接适用于此类生产服务器。\n\
  \n请参考 `MySQL` 网站上的 `dev.mysql.com/downloads/` 进行手动安装。\n\n### 9.26 更多信息](#part0003.html_C2tocsec9_2026)\n\
  \n*   `Apache` Web 服务器的完整信息可以在 `httpd.apache.org/` 找到。\n*   `PHP` 的最新发布和文档位于 `php.net/index.php`。\n\
  *   `www.mysql.com` 网站包含 `MySQL` 的所有当前版本和其他信息。\n*   访问 `mariadb.org` 网站获取 `MariaDB`\
  \ 开源软件的所有信息。\n*   构建 LAMP 服务器的网站有 `www.lamphow.com`。\n*   关于网站开发的许多书籍 *Dynamic Web\
  \ Programming and HTML5*，Paul Wang 著是一本很好的读物。\n\n### 9.27 总结](#part0003.html_C2tocsec9_27)\n\
  \nWeb 服务器遵循 `HTTP` 接收并发送响应。它的主要功能是将传入的 URIs 映射到文档空间中的文件和程序。\n\n`Apache httpd` 服务器\
  \ 支持动态模块加载和运行时配置，使其能够轻松适应各种 Web 托管的需求。配置指令可以放在中心文件中，也可以放在文档空间内各个文件夹下。除了控制 `httpd`\
  \ 的功能和行为外，`Apache` 配置可以指定文档空间的访问限制并要求 `HTTP Basic` 或 `Digest` 认证。\n\n`PHP` 是一种可以生成动态\
  \ Web 页面的活动语言。`PHP` 脚本嵌入在任何 `<php ... ?>` 标签中。`PHP` 可以作为 `Apache` 模块安装，并在 `Apache`\
  \ 交付时解释嵌入的 PHP 脚本。`PHP`可以通过 `php.ini` 文件进行动态配置。\n\n`PHP` 为 Web 提供了广泛的能力，包括文件包含、表单处理、本地/远程文件操作、文件上传、图像处理、会话控制、cookie\
  \ 支持以及数据库访问。`PHP` 也可以作为 `CLI` 工具使用。\n\n`PHP` 有内置的轻量数据库，但也与重量级的 `MySQL` 和 `MariaDB`\
  \ 数据库系统配合良好。两者都支持受 `userid` 和 `password` 保护的多个数据库。不同的数据库用户可能有不同的访问权限，并可以使用 Linux\
  \ 命令（`mysqladmin`、`mysql`、`mariadb` 等）或基于 Web 的 `phpMyAdmin` 工具进行管理。\n\nLinux、`Apache`、`MySQL/MariaDB`\
  \ 和 `PHP` (LAMP) 的组合形成流行且强大的托管环境。免费的 LAMP 是一个很好的开发系统，但出于安全考虑不应用于生产 Web 服务器。\n\n\
  ### 9.28 练习](#part0003.html_C2tocsec9_2028)\n\n1. 查找配置文件 `/etc/nsswitch.conf`。\n\
