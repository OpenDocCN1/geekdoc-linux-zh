  \n## 第 8 章\n\n## 基础系统管理\n\nLinux 学生自然会首先关注于理解 Linux 以及如何有效地使用它。系统管理是超级用户处理的工作。然而，它是\
  \ Linux 的一个重要方面，对系统管理的熟悉或至少有某种程度的理解，对于家庭系统用户以及想要成为管理员的人都大有益。对于训练良好的 Linux 人员来说，一份有报酬的系统管理工作是完全可能的。\n\
  \nLinux 系统管理是一个广泛的话题，范围从硬件配置、公司范围内的多系统管理、服务器集群运行到云计算等。其中大部分内容超出了本教科的范围。\n\n我们在这里的重点是系统管理基础，例如管理家庭\
  \ Linux 系统和小型网络系统。我们将涵盖常见的管理任务，包括用户账户、软件安装、进程和服务的管理、网络配置、磁盘和文件系统任务、系统备份、启动以及使用 SELinux\
  \ 进行安全。\n\n### 8.1 管理用户\n\nLinux 本身是一个多用户系统，最基本的管理任务之一就是用户管理。Linux 上有三种类型的用户：普通用户、管理员用户和\
  \ root。\n\nroot 用户（`userid root`）是 Linux 内置的，不需要手动创建。root 可以执行所有操作并访问所有文件，不受任何限制。管理员用户以普通用户身份运行，但可以通过\
  \ `sudo`（见下小节）或 `su` 命令执行 root 操作。\n\n建议避免以 root 身份登录，并尽可能以管理员身份执行管理任务。root 和管理员用户之间几乎没有区别，除了使用\
  \ `sudo` 以及需要输入管理员密码。某些应用程序如 `google-chrome`（Web 浏览器）和 `vlc`（视频播放器）不会以 root 运行，但以管理员身份运行。某些\
  \ Linux 发行版（如 Ubuntu）默认禁用 root。\n\n用户和其他系统管理命令大部分位于 `/usr/sbin` 和 `/usr/bin` 中。它们的用法可以在\
  \ Linux 手页（man pages）的第 8 节中找到。\n\n添加、删除、修改用户账户使用 `useradd`、`userdel` 和 `usermod`。添加、删除、修改组使用\
  \ `groupadd`、`groupdel` 和 `grouprmod`。系统设置菜单中通常有一个 GUI 工具可以让创建新用户变得更容易（图 8.1）。\n\
  \n![image](img/00099.jpeg)\n\n图 8.1 用户账户工具\n\n当创建用户 `xyz` 时，通常会创建一个主目录 `/home/xyz`，其中包含若干标准文件夹（第\
  \ 6 章，第 6.1 节）。还会创建一个新组 `xyz` 并列在 `/etc/group` 中。`/etc/passwd` 文件会被创建一个条目，列出了系统中所有的用户。用户\
  \ `xyz` 的条目指示了它的数值 `USERID` 和所属组。密码由 `x` 表示，实际的哈希密码列在 `/etc/shadow` 中，该文件除 root\
  \ 外所有用户均无法访问。\n\n你会发现 `/etc/passwd`（`/etc/group`）在特定进程执行时，也列出了许多标准用户（标准组）。当然，用户和组设置被用于自主访问控制（Discretionary\
  \ Access Control, DAC），如第 6 章所述。\n\n要赋予 `xyz` 管理员权限，使其成为特殊系统管理员组的成员。根据 Linux 发行版的不同，组可能是\
  \ `admin`、`wheel`（Fedora 和 Redhat）、`staff`、`sudo`（Ubuntu）或 `sudoers`。另一种让 `xyz`\
  \ 成为管理员的方法是将此条目\n\n```\nxyz ALL=(ALL) ALL\n```\n\n通过 `visudo` 命令添加到 `/etc/sudoers`\
  \ 配置文件中。\n\n当用户登录时，提供的密码会被哈希，并与 `/etc/shadow` 中的密码哈希进行比对以验证用户。在学校或公司环境中，用户通常可以使用同一账号登录网络上的多台计算机。Linux\
  \ 使用 `PAM`（可插认证模块）来满足许多应用程序的登录和认证需求。每个应用的 PAM 配置可以在 `/etc/pam.d/` 中找到。\n\n用户名和密码可能存储在本地文件中，也可能存储在直接通过\
  \ `LDAP`（轻量级目录访问协议）访问、或间接使用 `SSSD`（系统安全服务守护进程）访问的中央服务器上。在这种情况下，应使用 `luseradd`、`lgroupadd`\
  \ 等命令。\n\n不少情况下，用户可能访问同一组织内的多台 Linux 计算机。当需要登录/文件服务器时，以便用户可以使用单一用户名/密码访问授权的计算机。此外，用户主目录可以集中位于文件服务器上，并通过\
  \ `NFS` 从各个 Linux 节点访问（第 6 章，第 6.8 节）。对于用户来说，拥有单一的主目录比在每个 Linux 节点上都有独立的目录要容易得多。\n\
  \n#### sudo\n\nLinux 管理任务如设置用户账户、安装和更新系统软件以及管理网络服务，通常由 root 等特权用户执行。这安全但不灵活。\n\n\
  `sudo` 是一种允许普通用户临时作为 root 或其他特权用户执行某些任务的方法。命令名 `sudo` 来自 `su`（切换用户）命令，该命令允许用户变成另一个用户。在想要执行的完整命令前加上\
  \ `sudo` 意味着：“允许我有足够的权限执行以下命令。”如果给定的命令被允许，`sudo` 在该命令执行期间将实际和有效的 `uid` 和 `gid` 设置为特定特权用户的标识（第\
  \ 6 章，第 6.4 节）。所有的 sudo 命令都会被记录以确保安全。\n\n\n\n\n\n`/etc/sudoers` 文件包含了控制谁可以在哪些特定的主机计算机上执行哪些命令、获得何种权限的配置，以及是否需要输入用户密码。因此，同一组织内的许多主机可以共享同一个\
  \ `sudoers` 文件。该文件只能通过特权命令 `visudo` 进行修改。你可以通过以下命令了解 `sudoers` 及其语法规则：\n\n```\n\
  man 5 sudoers\n```\n\n`sudoers` 中用户条目的通用格式为：\n\n`r_user hosts=(s_user) commands`\n\
  \n意味着 `r_user` 可以在列出的主机上以 `s_user` 的身份执行指定的命令。如果 `s_user` 是 `root`，则可以省略 `(s_user)`\
  \ 部分。\n\n以下是一些 `sudoers` 条目示例：\n\n```\npwang localhost= /sbin/shutdown -h nowpwang\
  \ localhost= /user/bin/systemctl start httpd, \\/user/bin/systemctl stop httpd,\
  \ \\/user/bin/systemctl restart httpdpwang localhost= /usr/bin/dnf group install\
  \ \"Web Server\", \\/user/bin/dnf group upgrade \"Web Server\"root ALL=(ALL) ALL%wheel\
  \ ALL=(ALL) ALL\n```\n\n每个条目必须单行显示。`root` 条目始终存在，赋予 `root` 能够以任何用户身份在主机上 `sudo`\
  \ 所有命令。`wheel` 是系统管理员组。\n\n即使你以 `root` 身份登录（或使用 `su`），你可能仍倾向于使用 `sudo`，以便为执行的任务留下日志记录。\n\
  \n### 8.2 软件包管理\n\n安装、更新和删除软件都是系统管理的一部分。在 Linux 世界中，我们没有应用商店，因为几乎所有的软件都是免费的且不售卖。\n\
  \nLinux 以软件包的形式存储在仓库中，并使用包管理系统来管理软件包。包管理系统支持系统软件和应用程序。甚至更新 Linux 内核和迁移到下一个 Linux\
  \ 版本也包含在。\n\n对于 Linux，我们有两个主要的包系统：适用于 Debian 系的基于 DEB 的高级软件包工具 (`APT`)以及适用于 Red\
  \ Hat 系基于 RPM 的 Yellow dog Updater Modified (`YUM`)。较新的 `DNF` (Dandified YUM) 正在取代\
  \ `YUM`。\n\n通过包管理工具，你可以搜索、安装/删除、更新/升级以及其他管理存储在在线仓库中的针对你 Linux 版本的软件包。软件依赖关系的检查以及文件和命令的放置/替换将自动完成。\n\
  \n较新的项目如 `GNOME Software`（图 [4.1]）正在创建类似应用商店的工具，使软件管理更加直观。这些易于使用的软件工具越来越多地集成到新的\
  \ Linux 发行版中。\n\n让我们看看如何进行命令行包管理。\n\n### 软件管理任务\n\n在 CentOS/Fedora 上，使用 `dnf` 命令进行包管理。在\
  \ Ubuntu/Debian 上，使用 `apt` 命令进行包管理。\n\n查看 `dnf` (`man dnf`) 和 `apt-get` (`man apt-get`)\
  \ 的手册页以获取其命令和选项的完整文档。为了展示如何使用它们执行常见的软件管理任务，让我们给出一些示例。注意，大多数此类命令都需要管理员用户权限。\n\n*\
  \   搜索名称或描述匹配给定关键词的软件包：`dnf search \"keywords\"` (`dnf search \"media player\"`),\
  \ `apt-cache search \"keywords\"` (`apt-cache search \"media player\"`)\n*   查看系统可更新的内容但不安装：`dnf\
  \ –refresh check-update`, `apt-get -u upgrade`\n*   在系统上安装指定的（或所有）软件包：`dnf upgrade\
  \ [packages]` (`dnf upgrade firefox`), `apt-get upgrade [packages]` (`apt-get upgrade\
  \ firefox`)\n*   安装新软件包以及任何所需的依赖项：`dnf install packages` (`dnf install thunderbird`),\
  \ `dnf groupinstall group-name ...` (`dnf groupinstall LibreOffice`), `apt-get install\
  \ [packages]` (`apt-get install thunderbird`)\n*   列出所有已安装的软件包：`dnf list installed`,\
  \ `dnf group list installed`, `apt –installed list`\n*   删除已安装的软件包：`dnf remove packages`\
  \ (`dnf install thunderbird` *注：此处原文示例可能为笔误，应为 remove*), `apt-get remove [packages]`\
  \ (`apt-get remove thunderbird`)\n\n`DNF` 将所有操作记录在历史列表中并顺序编号。使用 `dnf history op`\
  \ 显示历史列表，撤销/重做、回滚，或列出用户添加到系统的所有软件包 (`userinstalled`)。\n\n![image](img/00100.jpeg)\n\
  \n图 8.2 DNF 的图形界面\n\n命令 `yumex-dnf` 提供了一个 GUI（图 [8.2]）。在某些 Linux 发行版中，`dnf` 可以使用\
  \ `yumex-dnf` 以简化操作。\n\n### 8.3 进程管理\n\n执行中的程序被称为进程。在任何时刻，都有许多进程，如编辑文件、浏览网页、即时消息、听音乐等。\n\
  \n要显示和控制进程，你可以使用 GUI 工具 `gnome-system-monitor`（图 [8.3]）。\n\n![image](img/00101.jpeg)\n\
  \n图 8.3 Gnome Monitor\n\n或者，可以使用命令 `kill -9` 立即终止进程。要找到进程 ID，可以使用 `pidof`。\n\n因此，以下命令运行良好：\n\
  \n```\nkill -9 pidof firefox\n```\n\n`ps` 可用于显示进程的详细信息（见第 11 章）。其他进程管理命令包括：\n* \
  \  `top`（显示进程及其系统资源使用情况）\n*   `pstree`（以树形式显示进程）\n*   `pgrep`（通过模式查找进程）\n*   `pkill`\
  \ / `killall`（按名称终止进程）\n\n在图 [8.3] 中你还看到了多个 HTTP 守护进程 (`httpd`) 实例，它是 Apache Web\
  \ 服务器程序，准备在此主机计算机上提供网页服务。\n\n查看可选的服务守护程序、每个状态并控制它们的执行，请使用 GUI 工具 `system-config-services`（图\
  \ [8.4]）。\n\n![image](img/00102.jpeg)\n\n图 8.4 服务配置工具\n\n在图 [8.4] 中你看到 `httpd` 已启用并运行。我们还看到注释“httpd\
  \ 由 systemd 管理”。这是因为 Linux 使用系统守护 `systemd` 作为所有系统进程的控制器。`systemd` PID 为 1，所有其他进程都是它的后代。因此，系统管理员也可以使用以下命令来启用/禁用、启动/停止/重启指定的服务：\n\
  \n```\nsystemctl op service\n```\n\n例如：\n\n```\nsystemctl start httpd\nsystemctl\
  \ stop httpd\nsystemctl restart httpd\nsystemctl status httpd\n```\n\n\n\n\n注意，`enable`\
  \ 配置服务在启动时自动启动，而 `disable` 则相反。`start`/`stop` 操作会立即启动/终止指定的服务，无论是否已启用。`status` 操作显示指定服务的当前状态。\n\
  \n### 8.4 网络配置\n\n网络是 Linux 内核的一个重要功能，它通过网络接口卡（NIC）执行操作。例如，内部主机可能连接到以太网局域网（LAN）上的路由器。路由器随后通过电缆或互联网服务提供商（ISP）提供的\
  \ ISDN 调制解调器连接到互联网。同一主机还可以额外的有线或无线网卡。连接到两个不同网络的主机可以作为网关，在两个网络之间转发流量。因此，我们示例中的路由器是内部局域网和\
  \ ISP 网络之间的网关。\n\n很有可能，你的家庭 Linux 工作站是通过动态主机配置协议（`DHCP`）从局域网上的 DHCP 服务器获取 IP 地址的。在家庭局域网中，无线路由器也是\
  \ DHCP 服务器。启动时，DHCP 客户端会广播一个带有其媒体访问控制（`MAC`）地址的请求，从位于同一广播子网的 DHCP 服务器获取 IP 地址和子网掩码。DHCP\
  \ 服务器分配一个可用或预分配的 IP 地址，通常还会提供默认网关和 DNS 服务器地址。\n\n对于主机，有四项重要的网络配置数据：\n\n* 它的 IP 地址——例如，`192.168.1.42`\n\
  * 它的子网掩码——例如，`255.255.255.0`，意味着所有的 `192.168.1.x` 都在同一子网\n* 它的默认网关——例如，`192.168.1.1`，标识子网与外部的路由器\n\
  * DNS 服务器的 IP 地址\n\n注意，子网掩码是一个位掩码，其领先的 1 位表示子网 IP 地址的固定部分。文件权限的 `umask` 是我们见过的另一种位掩码。\n\
  \n互联网以包的形式传输数据。因此，Linux 内核在执行网络操作时必须处理 IP 包。图 8.5 显示了数据包的结构。\n\n![image](img/00103.jpeg)\n\
  \n图 8.5 IPv4 数据包\n\n如果数据包目的地位于主机的子网内，内核可以直接发送数据包。如果不在，数据包将发送到默认路由，这通常是你 ISP 的的一台主机或连接到互联网的本地网关。\n\
  \n在 Linux 系统上，网络接口有标准名称，例如：\n\n* `lo`——环回接口，连接到主机本身，主要用于测试和诊断\n* `eth0` 或 `eno1`——第一个以太网接口\n\
  * `wlan0`——第一个无线网络接口。\n* `ppp0`——第一个点对点协议网络接口\n* `virbr0`——虚拟机使用的虚拟桥接接口，用于地址转换以连接到外部网络。\n\
  \n在大多数 Linux 发行版中，`NetworkManager` 守护进程会自动初始化并配置可用网络，通常不需要管理员干预。在系统设置面板上通常可以找到方便控制网络的\
  \ GUI 工具 `Network`。图 8.6 显示了此网络控制工具的入口显示。\n\n![image](img/00104.jpeg)\n\n图 8.6 网络控制工具\n\
  \n有线接口（Wired interface）显示主机处于一个 1000 Mb/s 的局域网中，本地 IP 地址为 `192.168.1.42`，其 MAC 地址、要使用的\
  \ DNS 服务器以及默认路由 `192.158.1.1`（可能是连接到互联网的路由器）。任何无线接口也会列出，允许你开启/关闭它们。点击齿轮图标可以编辑所选接口的配置。例如，你可以添加\
  \ DNS 服务器、选择防火墙区域，并为无线接口设置安全模式和密码。\n\nGUI 工具 `nm-connection-editor` 和命令行命令 `nmcli`\
  \ 也允许你为 `NetworkManager` 编辑网络接口设置。\n\n文件 `/etc/resolv.conf` 由 `NetworkManager` 生成，存储了系统要使用的\
  \ DNS 服务器。`/etc/hosts` 文件可以存储域名的 IP 地址，以及本地和经常使用的远程主机的任何别名，以帮助域名到 IP 的映射。可以使用任何标准文本编辑器编辑\
  \ hosts 文件。\n\n网络管理员的其他实用命令还包括：\n\n* `ping host`——测试主机是否有响应\n* `dig host`——通过 DNS\
  \ 查询主机\n* `whois domain`——查询域名的注册信息\n* `ifconfig`——检查并修改网络接口设置\n* `route host`——显示并操作\
  \ IP 路由表\n* `traceroute host`——显示到主机的网络路由\n\n### 8.5 防火墙设置\n\n网络防火墙提供了防御外部入侵的防线。防火墙可以是网络上的一台特殊计算机，用于保护所有内部主机。家庭或小型企业的路由器就是这样一个例子。防火墙也可以运行在主机上的程序，以保护该主机。操作系统通常带有防火墙程序，Linux\
  \ 也不例外。即使在路由器防火墙之后，主机通常也会运行自己的防火墙程序以进行特定主机的保护。\n\n总来说，防火墙通过遵循 IP 包过滤规则来限制与外部的网络连接并提供保护，这些规则精确规定了允许哪些网络流量入出。例如，防火墙规则可以禁止访问主机计算机或子网主机上的某些服务和/或端口。或者它们禁止来自黑名单主机的网络。\n\
  \n现代 Linux 系统带有一个防火墙守护进程 `firewalld`，允许管理员动态修改防火墙设置，无需重启 `firewalld` 进程或重启计算机。这种动态防火墙比基于\
  \ `iptables` 的静态防火墙对系统管理员来说容易得多。新的 Linux 发行版带有 `firewalld` 而没有 `iptables`。建议你使用\
  \ `firewalld` 而非 `iptables`。\n\nGUI 工具 `firewall-config`（图 8.7）允许你调整 `firewalld`\
  \ 使用的设置。\n\n![image](img/00105.jpeg)\n\n图 8.7 防火墙配置工具\n\n防火墙进程具有多个预定义的区域，为网络连接提供不同级别的保护。图\
  \ 8.7 显示 `pcenvy` 的 `eno1` 接口使用 `FedoraWorkstation` 作为默认区域。`firewall-config` 工具允许你修改防火墙运行时/永久设置：\n\
  \n* 将连接和接口分配到所需的区域\n* 修改设置并为每个区域删除规则\n* 创建你自己的新区域\n* 将运行时设置永久化\n\n预定义的防火墙区域是一个很好的起点。可以根据需要添加额外的权限并在不再需要时删除。例如，如果我们需要让本地\
  \ Web 服务器可用，可以启用 `http` 和 `https` 服务。为了支持传入的 `ssh`/sftp` 连接，我们可以添加 `ssh` 服务。\n\n\
  要从命令行更改防火墙，请使用 `firewall-cmd`。例如，要为 Web 服务器启用 HTTPS，我们可以\n\n```bash\nfirewall-cmd\
  \ --add-service=https --permanent\nfirewall-cmd --reload\n```\n\n## 8.6 管理文件系统和磁盘\n\
  \n\n\n\n\n块设备上的存储通常被分为若干个独立的区域，称为分区（partitions），每个分区都可以由操作系统进行格式化和管理。因此，我们可以将分区视为一个“逻辑磁盘”。在\
  \ Linux 中，每个分区由其自己的特殊文件表示。例如，`/dev/sda1` 指向磁盘设备 `/dev/sda` 上的 1 号分区。\n\n磁盘分区由分区表定义，分区表存储在存储设备的开头，列出了每个分区的位置、大小和其他属性。分区表遵循定义良好的格式——旧的\
  \ `MBR`（主引导记录）或新的 `GPT`（GUID 分区表）。`MBR` 存储在质质设备的最开头（扇区 0，长度为 512 字节），包含简单的引导加载程序和分区表。`MBR`\
  \ 在系统启动运行时配合 `BIOS`（输入输出系统）固件接口工作。\n\n`GPT` + `UEFI`（统一可扩展固件接口）是取代 `MBR` + `BIOS`\
  \ 的新标准。`GPT` 更好地支持更大的存储设备，而 `UEFI` 提供了一个特殊的 EFI 系统分区（ESP），其中包含为 EFI 架构编译的程序。此类固件程序可以作为不同操作系统的引导加载程序。关于系统启动的讨论，请参见第\
  \ 8.8 节。\n\n你可以使用 `lsblk` 命令列出磁盘分区，该命令显示块设备。图 8.8 显示了一个示例。\n\n![image](img/00106.jpeg)\n\
  \n图 8.8 lsblk 显示\n\n分区可以使用 CLI 工具 `fdisk`（用于小于 2TB 的驱动）、`gdisk`（用于 GPT）和 `parted`（用于\
  \ MS-DOS、GPT 和其他格式）进行管理。\n\nGUI 工具 `gparted`（图 8.9）让创建和修改磁盘分区变得简单。\n\n![image](img/00107.jpeg)\n\
  \n图 8.9 Gparted 工具\n\n硬盘硬盘分区的一种良好且简单的方法是：\n\n*   第一个分区——1GB，EFI (FAT)，挂载在 `/boot/efi`，用于启动\
  \ Linux 可能还有其他操作系统。\n*   第二个分区——4GB，Linux 文件系统 (ext4)，挂载在 `/boot`，用于 Linux 内核及相关文件。\n\
  *   第三个（最后一个）分区——所有剩余磁盘空间，供 LVM 管理的 Linux LVM 物理卷用于交换（36GB）、`/`、`/home` 等。\n\ngnome-disks`\
  \ 命令（图 8.10）对磁盘管理也很有用。\n\n![image](img/00108.jpeg)\n\n图 8.10 Gnome Disks 工具\n\n\
  ### 管理文件系统\n\n你可以挂载/卸载的现有文件系统存储在系统文件系统表 `/etc/fstab` 中，该表在 Linux 发行版安装时首次创建。这是一个示例：\n\
  \n```\n/dev/mapper/fedora-root / ext4 defaults 1 1UUID=91035a32-9e5a-4001-851f-28d71244792d\
  \ /boot ext4 defaults 1 2UUID=62C3-23C9 /boot/efi vfat umask=0077,shortname=winnt\
  \ 0 2/dev/mapper/fedora-home /home ext4 defaults 1 2/dev/mapper/fedora-swap swap\
  \ swap defaults 0 0\n```\n\n每行描述一个不同的文件系统，由空格分隔的 6 个字段——设备名称、挂载点、文件系统类型、挂载选项等。请参阅\
  \ `fstab` 的帮助页面获取每个字段的详情。`/etc/fstab` 中列出的文件系统会在系统启动时自动挂载。管理员用户可以使用任何文本编辑器添加/删除\
  \ `/etc/fstab` 中列出的文件系统。\n\n命令\n\n```\nfsck file-sys ...\n```\n检查并可选地修复给定的文件系统。如果不带参数，该命令将顺序处理\
  \ `/etc/fstab` 中列出的每个文件系统。\n\n### 添加新磁盘\n\n通常运行 Linux 的电脑只有一个有一个硬盘。添加第二个硬盘可以提供更多存储空间，并提高系统性能。此外，可以将关键文件备份在第二块硬盘上，以防第一块硬盘发生某种程度的故障。\n\
  \n要添加新硬盘，请遵循以下通用步骤：\n\n1.  在电脑上物理安装硬盘。\n2.  在新磁盘上创建所需分区。\n3.  为分区创建文件系统。\n4.  挂载文件系统。\n\
  \n步骤 1 涉及关机、拔掉电脑电源、物理连接新硬盘并重启。现在执行命令如\n\n```\nlsblk\n```\n\n或\n\n```\nparted -l\n\
  ```\n以识别新磁盘的设备特殊文件。如果第一个磁盘是 `/dev/sda`，新磁盘通常是 `/dev/sdb`。\n\n识别新磁盘后，我们可以按照第 8.6\
  \ 节中的信息执行步骤 2 并分区。可以使用 GUI `gparted` 工具或 CLI `parted` 工具。每个分区都变成一个逻辑磁盘并有其自己的特殊设备名称，例如\
  \ `/dev/sdb1` `/dev/sdb2` 等。为了简单起见，为整个新磁盘创建一个大分区并不是一个坏主意。\n\n对于步骤 3，我们可以使用命令\n\n\
  ```\nmkfs -t type device_name\n```\n它为 `device_name` 指定分区创建一个特定类型的文件系统。特定类型的文件系统创建命令包括\
  \ `mke2fs`（用于 ext2/ext3/ext4 文件系统）、`mkswap`、`mkfs.fat` 等。创建后，文件系统也通过 `device_name`\
  \ 识别。\n\n最后在步骤 4 中，使用 `mount` 命令将每个新文件系统挂载到文件树上所需的目录。并将新文件系统输入 `/etc/fstab`。\n\n\
  或者，我们可以将整个新磁盘放在逻辑卷管理下。\n\n### LVM\n\n现代 Linux 发行版支持 LVM（逻辑卷管理），它利用 Linux 内核的设备映射能力，将存储的逻辑卷（LV）动态关联到存储设备上的物理卷（PV）。因此，LVM\
  \ 是磁盘分区之上的一个软件层，用于形成逻辑卷，使得管理硬盘更换、重新分区和备份变得简单得多。\n\n在 LVM 下，若干磁盘分区被指定为 PV。PV 被划分为不相交的卷组（VG）。每个\
  \ VG 充当逻辑磁盘，并可以被“分区”为一个或多个 LV。每个 LV 在文件树上都有其自己的挂载点。图 8.11 显示了 LVM 架构。\n\n![image](img/00109.jpeg)\n\
  \n图 8.11 LVM 架构\n\n命令\n\n```\npvcreate device_name\n```\n将磁盘或分区初始化为用于 LVM 的 PV。使用\
  \ `/dev/sda5` 等设备名称作为 PV 的名称。命令\n\n```\npvdisplay\n```\n显示所有 PV 及其信息。创建卷组（VG）使用命令\n\
  \n```\nvgcreate volume_group_name pv1 pv2 ...\n```\n查看所有 VG 执行\n\n```\nvgdisplay\n\
  ```\n向卷组添加新的物理卷使用\n\n```\nvgextend vg_name pv5 pv6 ...\n```\n在 VG 中创建 LV（逻辑卷）执行\n\
  \n```\nlvcreate -l n -n lv_name vg_name\n```\n`-l` 选项给出区区（extents）的数量（每个区区默认为 4MB）。当其卷组中的可用空间\
  \ way 时，稍可以调整逻辑卷的大小（`lvextend`、`lvreduce`、`lvresize`）。查看所有 LVs 执行 `lvdisplay`。这是一个示例显示。\n\
  \n```\n--- Logical volume ---LV Path /dev/fedora/swapLV Name swapVG Name fedoraLV\
  \ UUID gJNdsi-osp2-1046-isc2-NXnT-nTEO-3V6awhLV Write Access read/writeLV Creation\
  \ host, time pcenvy.localdomain, 2017-03-21 11:23:04 -0400LV Status available# open\
  \ 2LV Size 35.36 GiBCurrent LE 9053Segments 1Allocation inheritRead ahead sectors\
  \ auto- currently set to 256Block device 253:1--- Logical volume ---LV Path /dev/fedora/homeLV\
  \ Name homeVG Name fedoraLV UUID KJTOjw-TJnp-78oL-xYF9-mChg-2yVx-8MyonLV Write Access\
  \ read/writeLV Creation host, time pcenvy.localdomain, 2017-03-21 11:23:04 -0400LV\
  \ Status available# open 1LV Size 266.00 GiBCurrent LE 68096Segments 1Allocation\
  \ inheritRead ahead sectors auto- currently set to 256Block device 253:2--- Logical\
  \ volume ---LV Path /dev/fedora/rootLV Name rootVG Name fedoraLV UUID rjaDlE-wFPk-qbWo-EbB6-XZwR-d7Ws-U5mUkIL\
  \ Write Access read/writeLV Creation host, time pcenvy.localdomain, 2017-03-21 11:23:31\
  \ -0400LV Status available# open 1LV Size 1.52 TiBCurrent LE 398458Segments 1Allocation\
  \ inheritRead ahead sectors auto- currently set to 256Block device 253:0\n```\n\n\
  \n\n在带有单个硬盘的桌面设备上安装 Linux 时，分区大小可以进行粗略估计，因为 `LVM` 允许以后根据系统需求和性能轻松地调整文件系统的大小。\n\n\
  在较大的系统中，`LVM` 使添加和替换磁盘变得容易得多。此外，`LVM` 允许通过对逻辑卷创建快照来实现一致备份。请参阅书籍网站上的资源获取更多 `LVM`\
  \ 的信息和命令。\n\n## 文件存储配额 (File Storage Quotas)\n\n文件配额机制旨在限制单个用户和/或组对磁盘空间的使用。可以为每个文件系统的每个用户/组设置单独的配额。某些文件系统可以强制配额，而另一些则不行。例如，在计算机科学部门，一个用于学生的文件系统可能执行配额限制；同时，另一个用于教授的文件系统可能不执行配额限制。配额规定了用户可以占的文件数量和磁盘块限制。限制分为两类：软限制（soft\
  \ limits）和硬限制（hard limits）。如果用户启动的操作超过了软限制，用户的终端上会出现警告。如果没有超过硬限制，则允许该违规操作继续。其思想是鼓励用户在登录会之间保持在软限制范围内。换句话说，临时超过软限制是可以的，只要用户在注销前释放文件空间并返回软范围内。在登录时，如果仍违反任何软限制，将提供警告。在几次警告之后，用户的软限制可以被强制变为硬限制。\n\
  \n系统管理员可以编辑文件系统表（`/etc/fstab`）以指示哪些文件系统需要支持并使用配额，例如：\n\n```\nquotacheck -cu /home\n\
  ```\n\n```\nquotacheck -cg /home\n```\n\n分别为 `/home` 文件系统启用用户和组配额强制。\n\n用户和组的配额存储在文件系统根目录下的文件中（例如\
  \ `aquota.user` 和 `aquota.group`）。对于已挂载的文件系统，其根目录是其在文件树上的挂载点。\n\n`edquota` 命令用于设置和更改配额。只有超级用户才能调用\
  \ `edquota`。`quota` 命令显示您的磁盘使用情况和配额限制。超级用户可以给此命令提供可选的 `userid` 以显示特定用户的信息。超级用户还可以使用以下命令开启或关闭整个文件系统的配额强制：\n\
  \n```\nquotaon filesys … own\n```\n\n```\nquotaoff filesys …\n```\n\n## 8.7 文件和系统备份\n\
  \n为了安全起见，定期在外部硬盘、另一台计算机或云端上备份关键文件是非常重要的。\n\n`tar` 命令（第 6 章第 6.11 节）提供将文件收集到单个存档文件中进行备份的方便方法。例如，要备份\
  \ `/home`，命令：\n\n```\ntar -Jcpvf /backup_home.txz –one-file-system /home\n```\n\n\
  为 `/home` 创建一个 XZ 压缩文件。`--one-file-system` 选项排除不同文件系统上的文件。然后可以将压缩的 tar 文件传输到外部驱动器或系统。\n\
  \n备份用户主目录后，你可以备份根目录（`/`）以实现更完整的系统备份（例如：ex08/twopartBackup）：\n\n```\ntar -Jcpvf backup_root.txz\
  \ --one-file-system --exclude=/backup_root.tbz--exclude=/dev --exclude=/home --exclude=/media--exclude=/mnt\
  \ --exclude=/proc --exclude=/run--exclude=/srv --exclude=/sys --exclude=/tmp /\n\
  ```\n\n如果你有访问另一个 Linux 系统的网络，或者更好的是专用的备份服务器，那么 `rsync` 命令（第 7 章第 7.6 节）执行备份更有效且简单。\n\
  \n假设 `pcmonkey` 是你的 Linux 备份主机，你想备份存储在 `/var/www` 中的 `pctiger` 的 Web 数据。假设你在两个系统中都有\
  \ `userid` `ableAdmin`，并且安排了从一个系统到另一个系统的免密 SSH。\n\n那么，你可以使用（例如：ex08/rsyncBackup）：\n\
  \n```\nrsync -Capz –rsh=\"ssh -l ableAdmin\" –hard-links –inplace /var/www pcmonkey:/backup/pctiger/www/\n\
  ```\n\n备份文件将位于 `pcmonkey` 的 `/backup/pctiger/www` 文件夹中。`-C` 选项方便地排除了备份通常不需要的文件。第一次备份后，以后再次运行相同命令时，`rsync`\
  \ 将仅传输上次以来更改过的文件。\n\n注意 `rsync` 具有 `--include` 和 `--exclude` 选项，用于从处理列表中添加或删除文件/文件夹。`--delete`\
  \ 选项会导致源端不存在任何文件/文件夹在目标处被删除。查看 `rsync` 的手页获取更多选项。\n\n要执行定期计划的自动备份，请将前面的命令作为 crontab\
  \ 条目放置如下（例如：ex08/rsyncCrontab）：\n\n```\n36 1 * * * (后面跟在一行所需的命令)\n```\n\n每个 Linux\
  \ 用户都可以使用 `crontab -e` 命令来编辑该用户的调度命令 cron 表。每个 crontab 条目的前五个字段表示调度计划。详情请参阅 `crontab`\
  \ 手页的第 1 和第 5 节。前面的示例指定每天上午 01:36。`crond`（cron 守护进程）每分钟检查 crontab 条目以执行调度命令。\n\n\
  ## 使用 Déjà Dup 备份\n\n来自 Gnome 的 Déjà Dup 是一种 GUI 备份工具，既易用又强大。作为 `Duplicity` 的前端，它具有调度、加密、增量备份以及对云存储的支持。如果你的\
  \ Linux 发行版尚未内置，请使用以下命令安装：\n\n```\ndnf install deja-dup\n```\n\n```\napt-get install\
  \ deja-dup\n```\n\n你可以在应用程序、工具或系统菜单中找到 Déjà Dup 图标（一个保险箱）。\n\n![image](img/00110.jpeg)\n\
  \n图 8.12 Déjà Dup 备份工具\n\n要使用此工具，运行 `deja-dup-preferences`（图 8.12），开启它（启用工具），列出所有想要备份的文件夹、要忽略的任何子文件夹以及存储备份文件的位置。然后点击“立即备份”。你还可以安排自动定期备份。\n\
  \n作为备份存储，你可以使用本地文件夹、通过 FTP 或 SSH 的远程文件夹、外部硬盘或云服务（图 8.13）。\n\n![image](img/00111.jpeg)\n\
  \n图 8.13 Déjà Dup 存储选择\n\n如果你安装了 DropBox（第 4 章第 4.1 节），可以使用 `$HOME/Dropbox` 作为存储。但请注意，除非更改了\
  \ DropBox 账户的默认文件同步设置，否则 `$HOME/Dropbox` 中的任何文件在云端也会被删除。\n\nDéjà Dup 提供自动备份的调度功能。你也可以任何时间手动运行\
  \ `deja-dup –backup`。恢复一个或多个文件使用：\n\n```\ndeja-dup –restore file1 ...\n```\n\n如果不带参数，将执行完整恢复。恢复缺失的目录：\n\
  \n```\ndeja-dup –restore-missing directory\n```\n\n## 8.8 系统启动\n\n在操作系统的控制下，计算机可以执行内存中的任何程序。但计算机首次通电时，内存中还没有操作系统。计算机的固件必须首先导致引导加载器程序的加载，其任务是逐步加载功能越来越强大的软件，直到加载操作系统内核。\n\
  \n现代 Linux 系统使用统一可扩展固件接口（UEFI）而不是 BIOS 进行启动过程。\n\nUEFI 具有独立于 CPU 的架构、设备驱动程序以及挂载分区和读取某些文件系统的能力。UEFI\
  \ 可以被视为运行在计算机固件上的微型操作系统。\n\n\n\n当计算机启动时，固件首先执行上电自检 (POST)，然后运行 UEFI 代码。UEFI 在系统存储器中寻找\
  \ EFI 系统分区 (ESP)，这是一个标记有特定全局唯一标识符 (GUID) 的 GPT 分区。ESP 的通常位置是 `/boot/efi`。\n\nESP\
  \ 包含为 EFI 架构编译的应用程序，包括引导加载程序和其他实用程序。EFI 自带一个启动管理器，它可以从默认配置启动系统，也可以提示用户选择要启动的操作系统。当手动或自动选择了特定操作系统的引导加载程序时，它会被读取到内存中并接管启动过程。UEFI\
  \ 还支持安全启动 (Secure Boot)，它可以检查启动过程中使用的（包括操作系统在）签名软件（第 [7] 章](#part0012.html_BE6O0-5f30517cbae74ef497aa2df968393592)，第\
  \ [7.12] 节](#part0012.html_sec7_2013)），确保没有未经过验证的内容被使用或加载。\n\nGRUB 2 是 GNU GRUB\
  \ 的最新版本，它是大统一引导加载程序，可以用于 BIOS 和 UEFI 系统。在基于 UEFI 的 Linux  发行版中，GRUB 2 引导加载程序通常位于\
  \ `/boot/efi/EFI`。GRUB 2 可以加载 Linux 以及如 Windows 10 等其他操作系统。\n\n在启动时，快速按下 `ESC` 或\
  \ `SHIFT` 等键进入 GRUB2 菜单并选择如何继续。\n\n现代 Linux 发行版将遗留的运行级别（0–6）映射到五个 systemd 运行级别目标（targets），作为多种\
  \ systemd 目标的一部分。每个此类目标代表启动过程中有序单元序列中的一个软件单元。\n\n- `poweroff.target` 或 `runlevel0.target`——系统关机\n\
  - `rescue.target` 或 `runlevel1.target`——单用户模式，无网络接口，无守护进程，仅允许 root 登录\n- `multi-user.target`\
  \ 或 `runlevel[2,3,4].target`——多用户模式，具有网络和守护进程，无 GUI\n- `graphical.target` 或 `runlevel5.target`——多用户模式加\
  \ GUI\n- `reboot.target` 或 `runlevel6.target`——系统重启\n\n`multi-user.target` 是 Linux\
  \ 服务器的正常配置，而 `graphical.target` 是工作站的正常配置。\n\n命令\n\n```\nwho -r\n```\n\n显示运行级别。要更改运行级别（仅限系统管理员），遗留命令\n\
  \n```\ninit number\n```\n\n仍然有效。但应该使用如下命令\n\n```\nsystemctl isolate multi-user.target\n\
  systemctl isolate graphical.target\n```\n\n使用以下命令查看或设置下次重启的默认目标：\n\n```\nsystemctl\
  \ get-default\nsystemctl set-default target_name\n```\n\n可以获取并使用 `BASH` 脚本（例如：`ex08/bootinfoscript`）来显示关于磁盘、分区、引导加载程序、设备、文件系统的全面启动相关信息。\n\
  \n### 8.9 SELinux\n\n在第 [6] 章](#part0011.html_AFM60-5f30517cbae74ef497aa2df968393592)\
  \ 中，我们讨论了自主访问控制 (DAC)（第 [6.4] 节](#part0011.html_sec6_2005)）。SELinux（增强型 Linux）通过提供强制访问控制\
  \ (MAC) 来增强系统安全性，其规则在 DAC 之后应用。根据 Red Hat 的的一份文档：\n\n“SELinux 是 Linux 内核中一种强制访问控制机制的实现，它在检查完标准的自主访问控制后会检查允许的操作。SELinux\
  \ 可以根据定义的策略，对 Linux 系统中的文件、进程以及它们的行为强制执行规则。”\n\n本节提供了 SELinux 的简要概述和介绍，这是一个大课题，需要一整本书才能进行完整探讨。\n\
  \n标准 Linux 使用 DAC，它根据用户自主意愿设置的 `userid`、`groupId` 和 `rwx` 权限来控制访问。这种方法存在根本性缺陷。DAC\
  \ 无法考虑细粒度的用户安全级别、用户和进程可能扮演的角色，以及数据的敏感性分类。\n\n在 SELinux 中，由 Linux 内核强制的内置安全策略规定了所有主体（subjects）与系统中所有对象（objects）的交互方式。主体是一个正在运行的进程。对象是一个文件、文件夹、设备、端口、套接字或进程。\n\
  \n2000 年底，美国国家安全局 (NSA) 向开源软件开发社区发布了第一版本的 SELinux。在来自 Red Hat 和 Linus Torvalds（他建议采用模块化方法向\
  \ Linux 内核引入安全机制）等许多资源的贡献下，SELinux 被集成到 Linux 安全模块 (LSM) 框架中。内核加载不同的 LSM 来实现定义的安全方案。\n\
  \n现在，SELinux 可以安装在大多数现代 Linux 发行版中，包括 Red Hat、Fedora、Ubuntu、Debian 和 Hardened Gentoo。某些发行版最初可能禁用\
  \ SELinux。事实上，Ubuntu、Mint 等系统倾向于使用 AppArmor 而非 SELinux。我们这里的讨论将主要基于 Red Hat、CentOS\
  \ 和 Fedora。\n\n#### SELinux 状态和强制模式\n\n要检查 SELinux 状态，执行命令\n\n```\nsestatus\n```\n\
  \n这是一个示例显示：\n\n```\nSELinux status: enabledSELinuxfs mount: /sys/fs/selinuxSELinux\
  \ root directory: /etc/selinuxLoaded policy name: targetedCurrent mode: enforcingMode\
  \ from config file: enforcingPolicy MLS status: enabledPolicy deny_unknown status:\
  \ allowedMax kernel policy version: 31\n```\n\nSELinux 可以运行在两种模式之一：\n\n- Enforcing（强制）：通过执行策略规则来允许/拒绝访问。\n\
  - Permissive（许可）：不拒绝访问，而是显示并记录任何违反策略规则的行为。\n\n使用 `setenforce 1`（或 `0`）将当前模式设置为强制（许可）。使用\
  \ `getenforce` 显示当前模式。当前模式将一直持续到下次重启，届时它将根据 SELinux 配置文件 `/etc/sysconfig/selinux`\
  \ 进行设置。这里是一个执行 targeted 策略的示例：\n\n```\n# 此文件控制系统上 SELinux 的状态。\n# SELINUX= 可以取以下三个值之一：\n\
  # enforcing - 强制执行 SELinux 安全策略。\n# permissive - SELinux 打印警告而不是强制执行。\n# disabled\
  \ - 不加载 SELinux 策略。\nSELINUX=enforcing\n# SELINUXTYPE= 可以取以下三个值之一：\n# targeted -\
  \ 保护目标进程，\n# minimum - 修改后的目标 策略。仅保护选定的进程。\n# mls - 多级安全保护。\nSELINUXTYPE=targeted\n\
  ```\n\n通过编辑此文件可以修改跨重启的 SELinux 应用方式。例如：\n\n`SELINUX=disabled`\n\n禁用 SELinux 规则的强制执行（不推荐）。\n\
  \n要从禁用切换到强制（或首次启用），请先在配置文件中将模式设置为 permissive 然后重启。在重启后没有看到警告的情况下，将配置从 permissive\
  \ 更改为 enforcing 并再次重启。\n\n#### 安全上下文\n\n在 SELinux 中，每个进程/文件都标记有自己的安全上下文。内核使用上下文信息和策略规则来做出访问控制决策。进程的安全上下文也被称为进程的域（domain）。策略规则还规定了进程是否可以从一个域转换到另一个域。\n\
  \n只有在有特定的策略规则允许此类访问时，SELinux 才允许访问。否则，访问总是被拒绝的。\n\nSELinux 安全上下文是格式如下的有序安全标识列表\n\
  \n`se_user : role : type[: sensitivity : category]`\n\n敏感级别与类别范围部分是可选的。\n\n通常，Targeted\
  \ SELinux 策略是默认策略，你可以在 `/etc/selinux/targeted` 找到它。目标策略专注于类型强制，同时也关注用户和角色身份。敏感性和类别很少使用。\n\
  \n`se_user` 身份用于将用户收集到安全组中。例如，具有 `guest_u` 身份的用户通常无法运行其主目录或 `/tmp` 中的可执行文件，无法运行\
  \ setuid 程序。使用命令 `seinfo --user` 可以生成所有可能的 SELinux 用户标识列表，例如\n\n\n\n\n\n```\nsysadm_u\
  \ system_u xguest_u rootguest_u staff_u user_u unconfined_u\n```\n\n角色身份（role identity）区分文件、可执行文件、运行进程和守护进程。只有具有特定角色的进程允许某些操作或过渡到某些领域。在\
  \ SELinux 目标策略（targeted policy）下，默认用户是未限制的（unconfined）。因此，用户 Shell 的领域\n\n```\n\
  ps -eZ | grep bash\n```\n\n通常为：\n\n`unconfined_u:unconfined_r:unconfined_t:s0 .\
  \ . . bash`\n\n类型身份（type identities）构成了目标策略访问控制的主体，其中大量的类型和规则规定了哪种类型可以访问哪种类型。\n\n\
  以 Apache Web 服务器（第 [9] 章）守护进程 `httpd` 为例。命令\n\n```\nls -Z /usr/sbin/httpd\n```\n\
  \n产生该可执行文件的上下文：\n\n`system_u:object_r:httpd_exec_t:s0 /usr/sbin/httpd`\n\n以及\n\n\
  ```\nps -eZ | grep httpd\n```\n\n显示守护进程的领域：\n\n`system_u:system_r:httpd_t:s0 . .\
  \ . httpd`\n\n因此，能够执行 `/usr/sbin/httpd` 的进程会创建一个子进程（第 [3] 章，第 [3.2] 节），该子进程将过渡到上述领域。\n\
  \n对于服务器文档空间中的文件（由 `httpd` 读取），\n\n```\nls -Z index.html\n```\n\n显示\n\n`unconfined_u:object_r:httpd_sys_content_t:s0\
  \ index.html`\n\n对于由 `httpd` 运行的脚本可写的文件夹或文件，上下文为：\n\n`unconfined_u:object_r:httpd_sys_rw_content_t:s0`\n\
  \n### 维护和管理文件上下文\n\n在使用目标策略的 SELinux 系统上，普通用户通常不会与 SELinux 强制执行产生交互，因为他们以及系统都是 `unconfined_t`。只有守护进程是被目标（targeted）并限制（confined）的。这通常意味着遵循标准的\
  \ DAC 规则。\n\n然而，普通用户在 SELinux 系统上需要注意四个常见领域：复制、移动、rsync 同以及归档/恢复文件。目标是在执行这些操作的同时保留文件和目录正确的\
  \ SELinux 上下文。以下是一些提示。\n\n- `mv` 命令默认保留文件的原始上下文，这对于其新位置来说可能是不正确的。使用 `mv -Z` 为目标位置自动设置正确的上下文。\n\
  - 在创建新文件/文件夹时（包括使用 `cp` 命令），它会自动继承来自其父目录的上下文。\n- 对于 `tar` 命令，使用 `–selinux`（`–no-selinux`）选项在归包中包含（排除）SELinux\
  \ 上下文信息。\n- 对于 `rsync` 命令，添加 `–xattrs` 选项以保留包含 SELinux 上下文的扩展属性。\n\n有时文件/文件夹需要通过\
  \ `chcon`（更改上下文）命令正确设置上下文。例如，在必要时，用户可以使用（例：ex08/chcon）\n\n```\nchcon -R -t httpd_user_content_t\
  \ $HOME/public_html\n```\n\n为用户的个人 Web 文档空间（第 [9] 章）设置正确的上下文。\n\nSELinux 使用 `auditd`\
  \ 在 `/var/log/audit/` 中记录消息以帮助审计和故障排除。这些大部分是 AVC（访问向量缓存）。它们显示了 SELinux 安全服务器拒绝（或允许）的操作。管理员用户可以使用以下命令检查\
  \ SELinux：\n\n```\nausearch -m avc\n```\n\n显示所有拒绝记录，或添加选项 `-ts recent`（`-ts today`）来查看过去\
  \ 10 分钟（今天）的拒绝记录。管理员还可以使用命令\n\n```\nsealert -b\n```\n\n启动 GUI 警报浏览器（图 [8.14]）。\n\
  \n![image](img/00112.jpeg)\n\n图 8.14 SELinux 警报浏览器\n\n要查看正确的上下文设置，执行命令\n\n```\n\
  sestatus -v\n```\n\n显示 `/etc/sestatus.conf` 中列出的和进程的正确上下文。\n\n使用命令 `restorecon`\
  \ 或 `fixfiles` 恢复/修复上下文。使用命令 `secon` 显示文件或进程的上下文。例如（例：ex08/secon），\n\n```\nsecon\
  \ -f /usr/sbin/httpd\n```\n\n产生\n\n```\nuser: system_u role: object_rtype: httpd_exec_t\
  \ sensitivity: s0clearance: s0 mls-range: s0\n```\n\n以及命令\n\n```\nsecon –pid ‘pidof\
  \ httpd‘\n```\n\n产生类似的内容：\n\n```\nuser: system_u role: system_rtype: httpd_t sensitivity:\
  \ s0clearance: s0 mls-range: s0\n```\n\n还有许多其他用于 SELinux 工具用于故障排除、策略管理、编写新策略等。请参阅书籍网站获取更多资源。\n\
  \n### 8.10 更多信息\n\n- 访问 fedoraproject.org 查看 DNF 页面。\n- 访问 fedoraproject.org 查看\
  \ Firewalld 文档。\n- 访问 itsfoss.com 查看 APT 指南。\n- 在 Linux Documentation Project 查看\
  \ LVM HowTo。\n- 在书籍网站查看 SELinux 资源。\n- 访问 uefi.org 查看 UEFI。\n\n### 8.11 总结\n\nLinux\
  \ 系统管理和运维对于训练良好的 Linux 人员来说是一个极有前景的职业方向。Linux 系统管理的基本方面，特别是针对家庭和小型局域网的情况，包括：用户账户、软件管理、网络配置、磁盘和文件系统管理、文件/系统备份、启动和系统安全。SELinux\
  \ 在基于用户 ID 和文件权限的标准 Linux 任意访问控制（DAC）基础上，增加了基于安全策略的强制性访问控制（MAC）。理解和管理 SELinux 上下文对于终端用户和系统管理员同样重要。\n\
  \n### 8.12 练习\n\n1. Linux 用户的用户 ID 和密码存储在哪里？用户登录时是如何检查密码的？\n2. 什么是 LDAP？它如何与 Linux\
  \ 系统上的用户认证相关？\n3. 比较使用 `tar` 和 `rsync` 进行文件备份的优缺点。\n4. 解释 `sudo` 的用途，以及为什么我们应该使用它而不是以\
  \ root 身份登录。\n5. 如何定期调度任务？请给出示例。\n6. 如何找到分配给你的 Linux 系统的 IP 地址？什么是默认路由？\n7. 解释 IP\
  \ 数据包的结构。\n8. 什么是 DHCP 预留？在路由器上如何配置？\n9. 如何找到互联网上某个主机的 IPv6 地址？请给出具体的示例。\n10. 如何找到正在运行的守护进程？哪些工具和命令有助于管理守护进程？\n\
  11. 什么是子网？找到 Linux 系统所在的子网。\n12. 什么是子网掩码？\n13. 什么是硬件防火墙？软件防火墙？它们位于何处？\n14. 什么是磁盘分区？GPT\
  \ 分区？\n15. 什么是 BIOS？UEFI？EFI？请解释。\n16. 什么是 GUID？什么是 ESP？\n17. 列并解释安装新硬盘的任务。\n18.\
  \ 什么是 LVM？它带来了什么好处？\n19. 在 LVM 中，什么是物理卷？卷组？逻辑卷？\n20. 什么是 RAID 以及你的 Linux 发行版如何支持\
  \ RAID。\n21. 什么是 SELinux 上下文？\n22. SELinux 中的领域过渡？\n23. 文件的上下文存储在哪里？\n24. 解释为什么在\
  \ SELinux 下使用 `mv` 命令可能会产生问题。\n25. 了解 AppArmor 并将其与 SELinux 进行比较。\n26. 对于对 Linux\
  \ 服务器管理感兴趣的学生，请了解 Ansible 以及其他类似的自动化软件配置、配置管理和应用程序部署的软件包。\n\n\n\n\n\n万维网（WWW 或简称\
  \ Web）始于 20 世纪 90 年初，物理学家之间的文件共享系统，它已迅速发展成为一个横跨全球的信息系统，现代社会离开它片刻无法运转。从某种意义上说，Web\
  \ 平等了竞争环境，赋予了全球无论大小的个人和企业的力量。\n\n这一巨大成功的关键因素是在 Web 上发布信息的成本很低。你只需要找到一个 Web 托管服务，将你的文件和网站程序部署在\
  \ Web 上即可。任何互联网主机只要拥有良好的互联网连接并运行 Web 服务器和其他相关程序，就可以提供 Web 托管服务。\n\n根据 `netcraft.com`\
  \ 2017 年 6 月的调查，在所有 Web 服务器中，有 46% 是 `Apache`，且大多数 `Apache` 服务器运行在 Linux 系统上。Linux-Apache\
  \ Web 托管环境通常还支持用于动态页面的 `PHP` 以及用于数据库驱动网站的 `MySQL`（社区版）或 `MariaDB`。Linux、`Apache`、`MySQL`/MariaDB`\
  \ 和 `PHP` 的组合（被称为 `LAMP`）能够很好地支持 Web 托管。本文将介绍这些程序以及它们的配置和操作。\n\n除了理解大局和底层原理外，一种实用的操作方法将引导你完成\
  \ `Apache`、`PHP` 和 `MySQL` 的安装、配置、测试和管理，让你通过实践学习 Linux Web 托管。在你的 Linux 上拥有 root\
  \ 权限很方便，但并非必须的。\n\n### 9.1 什么是 Web 服务器？\n\nWeb 服务器是运行在特定主机上并向 Web 提供文档的软件。该主机被称为服务器主机（server\
  \ host），通常提供包括 Web 在内的许多网络服务。Linux 系统被广泛用于运行 Web 服务器，对于 Linux 程序员来说，熟悉与 Web 服务器相关的操作是非常重要的。\n\
  \nWeb 服务器监听主机上的特定网络端口，并遵循超文本传输协议（HTTP）接收 HTTP 请求并发送 HTTP 响应。`HTTP` 的标准端口是 `80`，`HTTPS`\
  \ 为 `443`。也可以使用其他端口。\n\n对于传入的请求，服务器可以从存储服务器主机上的文件中返回静态文档，也可以返回由请求所指示的程序动态生成的文档（图\
  \ 9.1）。\n\n![image](img/00113.jpeg)\n\n图 9.1 Web 服务器概述\n\n单线程服务器每次处理一个 HTTP 请求，而多线程服务器可以处理多个并发请求。服务器主机可以运行多个\
  \ Web 服务器副本，以提高请求处理能力。\n\n公司和开源组织提供了许多不同品牌的 Web 服务器。`GlassFish` 是一个随 `java.sun.com`\
  \ 的 Java EE 发行版提供的免费 Web 服务器。由 Apache 软件基金会（`apache.org`）免费提供的 `Apache` Web 服务器在\
  \ Linux 系统上广泛使用。流行的 `Apache` 通常预装在 Linux 发行版中。\n\n### 9.2 URL 和 URI\n\nWeb 的重要基石是通用资源定位符（`URL`，第\
  \ 7 章第 7.13 节），它允许 Web 客户端访问 Web 上任何位置的资源。例如，HTTP `URL`\n\n`http://ml.sofpower.com`\n\
  \n指向本教材的配套网站。一个 HTTP `URL`（图 ）识别运行在特定计算机主机上的 Web 服务器，并提供以下信息：\n\n*   通用资源标识符（`URI`），对应指向存储在服务器上的目标资源（文件或程序）的本地路径名\n\
  *   可选的 `pathinfo`，作为目标资源的输入数据，指示目标文件/文件夹位置\n*   可选的 `query string`，作为目标资源的输入数据，提供\
  \ `key=value` 对\n\n![image](img/00114.jpeg)\n\n图 9.2 HTTP URL 结构\n\n`URL` 中紧接“主机:端口”段之后部分（图\
  \ 9.2）被称为 `URI`。Web 服务器使用 `URI` 来定位目标资源，该资源可以是静态页面、动态页面或可执行程序。静态页面直接在 HTTP 响应中返回。任何\
  \ `pathinfo` 和 `query string` 都会作为输入数据提供给动态页面或可执行程序。生成的输出随后在 HTTP 响应中返回。\n\n通过 Web\
  \ 服务器在 Web 上提供的文件和目录集合称为其文档空间（document space）。文档根（document root）是文档空间的根目录，对应于 `URI`\
  \ `/`。除了文档根层次结构外，文档空间中还可以有其他文件和目录，例如，`/cgi-bin` 和 `userid` 通常映射到文档根层次结构之外的目录。\n\n\
  Web 服务器还与其他特殊目录（在其文档空间之外）协作，用于服务器配置、密码、工具和日志。`URI` 根据需要相对于文档根、`cgi-bin` 或另一个目录进行解释。Web\
  \ 服务器可以根据 Web 服务器配置文件中指定的特 访问限制，对文档空间中的任何文件/文件夹强制执行访问限制。\n\n### 9.3 请求处理\n\n对于每个传入的\
  \ HTTP 请求，Web 服务器执行以下请求周期：\n\n1.  接受客户端连接（通过 `TCP/IP`）\n2.  处理请求（获取页面或调用程序）\n3.\
  \  发送响应\n4.  关闭连接（或在 `HTTP1.1` 下保持连接活跃）\n\n在处理请求时，繁忙的网站通常会收到新请求。使用多个服务器（多进程）和/或在同一服务器内的多个线程（多线程）来处理并发请求是正常的。\n\
  \n### 9.4 响应和内容类型\n\n对于每个传入的 HTTP 请求，Web 服务器返回一个 HTTP 响应，其中包含请求的资源或错误或其他状况的指示。\n\
  \nHTTP 响应包含两个部分：头部（headers）和正文（body）。服务器指定 `Content-Type` 头部来指示响应正文的媒体类型。使用了标准的\
  \ `MIME`（多用途邮件扩展）内容类型（第 6 章）。最常见的内容类型是 `text/html`，但许多许多类型。对于静态文件，Web 服务器使用文件名扩展名来推断其媒体类型，该列表通常位于\
  \ `/etc/mime.types` 文件。该内容类型列表的位置是可以配置的。\n\n对于由服务器端程序生成的动态内容，Web 服务器依赖这些程序来设置内容类型。\n\
  \n### 9.5 Apache 服务器\n\n`Apache` 是最流行的 Web 服务器，尤其是在 Linux 系统上。你可以从 Apache 软件基金会（`httpd.apache.org`）免费下载并安装\
  \ Apache HTTP 服务器（`Apache`）（第 9.6 节）。\n\n然而，你的 Linux 可能已经安装了 `Apache`。`Apache` 包含许多组件，包括\n\
  \n*   服务器可执行文件——运行程序 `httpd`\n*   工具——用于服务器控制、密码和管理\n\n\n\n\n\n*   文件—包括服务器配置文件、日志文件、密码文件和源代码文件\n\
  *   动态可加载模块—可以在运行时加载到 `httpd` 中的预编译库模块\n*   文档\n\n### 9.6 Linux 上的 Apache\n\n由于\
  \ Apache 的重要性，大多数流行的 Linux 发行版都预装安装了 Apache。如果没有安装，你可以轻松地安装 Apache HTTPD。\n\n###\
  \ 使用软件包管理器安装 Apache\n\n我们已经提到过大多数 Linux 发行版都安装了 Apache。拥有 root 权限后，可以使用 Linux 软件包管理（第\
  \ 8 节，节 8.2）命令\n\n```\nCentOS/Fedora:dnf install httpdnf update httpd\nUbuntu/Debian:sudo\
  \ apt-get install apache2sudo apt-get update apache2\n```\n\n安装/更新你的 Apache 服务器。关于\
  \ `sudo` 命令的讨论，请参阅第 8 节，节 8.1 节。\n\n安装 Web Server 组可以提供更多的支持程序。\n\n```\nCentOS/Fedora:dnf\
  \ group install 'Web Server'dnf group upgrade 'Web Server'\n```\n\n如果你想获得最新的 Apache\
  \ 版本，或者你没有 root 权限，可以按照第 9.16 节所述手动安装 Apache。\n\n### 运行 Apache Web 服务器\n\n网络服务器（包括\
  \ Web 服务器）会在 Linux 启动时自动启动，并在 Linux 关闭时自动停止。为了确保这一点，启动 `system-config-services`\
  \ 并在列出的服务条目中查找 `httpd`（ 8.3 节）。\n\n或者，可以使用 `systemctl` 命令来启用/禁用、启动/重启服务。\n\n```\n\
  systemctl enable httpd.service\nsystemctl disable httpd.service\nsystemctl start\
  \ httpd.service\nsystemctl stop httpd.service\nsystemctl restart httpd.service\n\
  ```\n\n启用服务将在系统启动时自动启动它。服务可以在不启用的情况下启动。\n\n你通常会在 `/var/www/html/` 找到文档根，Apache 主配置文件位于：\n\
  \n`/etc/httpd/conf/httpd.conf` (CentOS/Fedora)\n`/etc/apache2/apache2.conf` (Ubuntu/Debian)\n\
  \n通常，主配置文件会包含其他组件配置文件，如 `php.conf` 和 `ssl.conf`。\n\n要检查 `httpd` 或任何其他进程正在运行，你可以使用\n\
  \n```\npidof httpd\npidof process_Name\n```\n\n并查看是否找到一个或多个进程 ID (pid)。\n\n### 控制\
  \ Apache 服务器\n\n命令 `apachectl` (CentOS/Fedora) 或 `apache2ctl` (Ubuntu/Debian) 通常位于\
  \ `/usr/sbin`，可控制 `httpd`\n\n```\napachectl action\napache2ctl action\n```\n\n`apachectl`\
  \ 的动作\n\n| Action (动作) | 含义 (Meaning) |\n| :--- | :--- |\n| start | 如果 httpd 未在运行则启动它\
  \ |\n| stop | 如果 httpd 正在运行则停止它 |\n| restart | 启动/重启 httpd |\n| graceful | 重启 httpd，并尊重正在进行的\
  \ HTTP 请求 |\n| configtest or -t | 检查配置文件的语法 |\n\n可能的动作列在 表 9.1 中。\n\n### 9.7 Apache\
  \ 运行时配置\n\nApache `httpd` 的功能和行为可以通过位于配置文件中的指令（directives）来控制。主配置文件通常是 `httpd.conf`（或\
  \ `apache2.conf`）。当 `httpd` 启动时，它会先读取。在对配置进行更改后，需要重启 `httpd` 以使新配置生效。除非你作为普通用户安装了了自己的\
  \ Apache（第 9.16 节），否则你需要 root 权限来修改 Apache 配置或重启它。\n\n### Apache 配置文件基础\n\nApache\
  \ 配置文件（例如 `httpd.conf`）是一个包含配置指令的文本文件。每个指令单独占一行，可以通过行尾的字符延续到下一行。\n\n以字符 `#` 开头的行是注释，会被忽略。注释必须占据整行。不允许在行尾写跟注释。有许多不同的指令。指令名称不区分大小写，但它们的参数通常区分大小写。除非指令放置在限制其作用范围的容器中，否则它是全局应用的。当发生冲突时，局部指令将覆盖全局指令。\n\
  \n主配置文件是 `httpd.conf`，可能存在其他组件配置文件，主文件通过 `Include` 指令包含这些文件。例如，在许多 Linux 系统上，配置目录\
  \ `/etc/httpd/conf.d/` 存储了组件配置文件，例如用于支持 HTTPS 的 SSL（安全套接层）`ssl.conf` 以及用于 PHP 的\
  \ `php.conf`（第 9.17 节）。指令\n\n```\nInclude conf.d/*.conf\n```\n\n用于包含所有此类组件配置文件。\n\
  \n要测试你的 Apache 配置是否有语法错误，请使用以下命令之一：\n\n```\napachectl configtest\nhttpd -t\n```\n\
  \n除了中心（主和组件）配置文件外，还存在目录内的配置文件，被称为“访问文件”（access files）。访问文件通常命名为 `.htaccess`，放置在任何\
  \ Web 绑定文件夹中（例如你的 `public_html`），用于为以该特定文件夹为根的文件层次结构提供配置设置。访问文件中的指令会覆盖中心配置文件中的设置。访问文件的可能性及其可能包含的指令由主配置文件中的\
  \ `AllowOverride` 指令控制。`.htaccess` 文件对于个人用户配置自己的 Web 空间（通常是其家目录下的 `public_html`）特别有用。\n\
  \n### 关于配置指令\n\n配置指令控制 Apache Web 服务器的许多方面。`httpd.conf` 文件有三个主要部分：全局环境、主服务器配置和虚拟主机配置。每个配置指令都提供了注释以指导其用法。Apache\
  \ 为所有指令都了合理且实用的默认设置，使得配置典型服务器变得简单。常用的指令包括：\n\n*   服务器属性：主机标识（`ServerName name`）、文件位置（`ServerRoot`、`DocumentRoot`、`ScriptAlias`）、网络参数（`Listen\
  \ [IP:]port`）和资源管理（`StartServers`、`KeepAlive`）\n*   启用可选服务器功能（`Options`）和目录配置覆盖（`AllowOverride`）\n\
  *   访问限制和用户认证（`Allow`、`Deny`、`Require`、`Satisfy`、`AuthName`、`AuthType`、`AuthFile`）\n\
  *   内容处理（`AddHandler`、`AddType`、`AddOutputFilter`）\n*   HTTP 缓存和内容压缩（`DeflateCompressionLevel`、`ExpiresActive`、`ExpiresByType`、`AddOutputFilterByType\
  \ DEFLATE`）\n*   虚拟主机（`NameVirtualHost`）\n\n例如，指令\n\n```\nDirectoryIndex index.html\
  \ index.php\n```\n\n表示 `index.html`（或 `index.php`）是目录索引文件，如果包含它的文件夹是传入 URI 的目标资源，则显示该文件。如果没有索引文件，将生成该文件夹的文件列表（仅在启用了\
  \ `Indexes` 选项的情况下），否则，将返回错误。\n\n### 加载模块\n\nApache 是一个模块化服务器。核心 `httpd` 只包含最基本的功能。许多扩展功能通过动态可加载模块（`.so`）实现，可以在服务器启动时选择性地加载到内核中。这种组织方式非常高效且灵活。\n\
  \n可加载模块放置在服务器根目录下的 modules 文件夹中，该目录通过主配置文件中的 `ServerRoot` 指令定义。要加载特定模块，请使用指令\n\n\
  \n\n\n\n`LoadModule name_module modules/moduleFileName.so`\n\n例如，\n\n```\nLoadModule\
  \ dir_module modules/mod_dir.so loads module dir\n```\n\n```\nLoadModule php5_module\
  \ modules/libphp5.so (loads module php5)\n```\n\n`dir` 模块允许 Apache 生成目录列表。`php5`\
  \ 模块支持使用 PHP 脚本语言动态 Web 页面（第 9.17 节）。\n\n配置指令可以根据条件包含，取决于特定模块是否存在，可以通过将其封装在 `< IfModule>`\
  \ 容器中。例如，\n\n```\n<IfModule mod_userdir.c><UserDir public_html></IfModule>\n```\n\
  \n表示如果我们正在使用 `userdir` 模块，则每个 Linux 用户的 Web 文件夹为 `public_html`。\n\n## 全局指令\n\n表\
  \ 9.2 显示了更多与 Apache 服务器全局工作方式相关的指令（例如：`ex09/apacheGlobal.conf`）。`Alias` 和 `ScriptAlias`\
  \ 指令将传入的 URI 映射到指定的本地文件夹。\n\n## 容器指令\n\n配置指令可以放在容器指令内部，以受到某些条件的限制，或将其适用范围限制在特定的目录、文件、位置（URL）或主机。如果不受限制，指令将全局生效。\n\
  \n### Apache 全局指令\n\n![image](img/00115.jpeg)\n\n例如，\n\n```\n<IfModule mod_userdir.c><UserDir\
  \ public_html></IfModule>\n```\n\n启用了每个用户的 Web 空间（例如：`ex09/peruser.conf`），并且仅在加载了\
  \ `userdir` 模块时将用户文件夹指定为 `public_html`。\n\n此外，考虑这些针对文档根 `/var/www/html` 的典型设置（例如：`ex09/docroot.conf`）：\n\
  \n```\n<Directory \"/var/www/html\"><Options Indexes FollowSymLinks (1)Order allow,deny\
  \ (2)Allow from all (3)AllowOverride None (4)</Directory>\n```\n\n在 `/var/www/html`\
  \ 目录下，我们允许生成索引并跟随符号链接（第 1 行）。应用访问控制指令的顺序是先 `allow` 后后 `deny`（第 2 行），除非后续被拒绝，否则允许所有传入的请求（第\
  \ 3 行+）。\n\n`AllowOverride`（第 4 行）允许在 `.htaccess` 文件中使用某些指令。其参数可以是 `None`、`All`\
  \ 或关键字 `Options`、`FileInfo`、`AuthConfig` 和 `Limit` 的组合。我们将在详细讨论访问控制时回到这个话题（第 9.8\
  \ 节）。\n\n你还会在你的 `httpd.conf` 中发现以下典型设置（例如：`ex09/htprotect.conf`）：\n\n```\n<Files\
  \ ~ \"^\\.ht\"><Order allow,denyDeny from all</Files>\n```\n\n它拒绝对任何以 `.ht` 开头的文件进行\
  \ Web 访问（第 4 章，第 4.4 节）。这对安全性很有好处，因为像 `.htaccess` 等文件可以被 Apache Web 服务器读取，但我们希望其内容暴露给\
  \ Web 访问者。\n\n由于`< Directory>` 和 `< Files>` 作用于计算机上的文件路径，而 `< Location>` 容器作用于 URI。我们还有\
  \ `< DirectoryMatch>`、`< FileMatch>` 和 `< LocationMatch>`，它们使用如 `egrep` 中定义的正则表达式（第\
  \ 4 章，第 4.4 节）。\n\n## 9.8 Apache 下的访问控制\n\n### 什么是访问控制？\n\n在你的 Linux 系统上运行 Web 服务器意味着你可以让某些文件和文件夹从\
  \ Web 可访问。然而，你也想控制这些文件如何被访问以及谁访问。\n\n要从 Web 访问文件/文件夹，你必须将其放置在为 Web 服务器配置的文档空间处。这通常意味着将文件/文件夹放在文档根目录下或你自己的\
  \ `public_html` 内部，并通过 `chmod a+r file`（`chmod a+rx folder`）让 Web 服务器可读该文件（文件夹可读且可执行）。系统上未放在服务器文档空间下或未具有正确访问模式的文件（第\
  \ 6 章）将将无法从 Web 访问。\n\n可以配置 Web 服务器以进一步限制访问。访问控制指定了可以使用什么 HTTP 请求方法访问网站的哪个部分。访问控制可以根据\
  \ IP 数字、域名、主机以及密码来指定。访问限制可以应用于整个站点、特定目录或单个文件。\n\nApache 访问控制指令包括 `Allow`、`Deny`、`Order`、`AuthName`、`AuthType`、`AuthUserFile`、`AuthGroupFile`、`Require`、`Satisfy`、`<\
  \ Limit>` 和 `< LimitExcept>`。\n\n### 主机访问控制\n\n如果服务器文档空间中的文件没有访问控制，则授予访问。`order`\
  \ 指令指定了应用 `allow` 和 `deny` 控制的顺序。例如，\n\n`order allow,deny`\n\n仅允许允许但未被拒绝的访问。在接下来，如果访问先被拒绝后被允许，则它是允许的。\n\
  \n```\norder deny,allowdeny from allallow from host1 host2 . . .\n```\n\n在 `monkey.cs.kent.edu`\
  \ 上，我们有一组页面留供部门局域网（LAN）内部使用。它们被放置在 `/var/www/html/internal` 文件夹下。它们的访问具有以下限制（例如：`ex09/folderprotect.conf`）：\n\
  \n```\n<Location /internal<order deny,allowdeny from allallow from .cs.kent.edu>/Location>\n\
  ```\n\n因此，只有 `.cs.kent.edu` 域名的主机被允许访问。可以使用主机 IP 地址。例如，\n\n`allow from 131.123`\n\
  \n授予来自前缀 `131.123` 的 IP 的访问。\n\n要允许用户控制其 Web 空间（`public_html`）的文件和文件夹，可以使用如下内容（例如：`ex09/htaccess.conf`）：\n\
  \n```\n<Directory /home/*/public_html<AllowOverride AllOrder allow,denyAllow from\
  \ all></Directory>\n```\n\n位于 `httpd.conf`。这意味着用户可以在 `/public_html/.htaccess` 文件中放置自己的访问控制和其他指令。\n\
  \n## 9.9 需要密码\n\n仅从某些域名或主机访问是好的，但我们仍然需要一种方法来限制注册用户访问整个站点或其部分。网站受密码控制的每个部分被称为一个安全域。用户在访问其内容之前，需要正确的\
  \ `userid` 和密码登录任何安全域。因此，在访问安全域内的资源时，用户必须首先通过身份验证验证其身份。Apache Web 服务器支持两种不同的 HTTP\
  \ 认证方案：基础认证和摘要认证。某些浏览器不支持摘要认证，后者仅比基础认证安全一点。\n\n让我们看看如何设置用户登录。\n\n### Apache 下设置用户登录\n\
  \n为了说明如何保护 Web 文件和文件夹，让我们看一个特定的示例，其中位置 `/WEB/csnotes/` 是我们要保护的文件夹。\n\n我们首先在 `httpd.conf`\
  \ 文件中添加以下认证指令（例如：`ex09/validuser.conf`）：\n\n```\n<Location \"/WEB/csnotes/\"<AuthName\
  \ \"WDP-1 Notes\"AuthType BasicAuthUserFile /var/www/etc/wdp1prequire valid-user>/Location>\n\
  ```\n\n`AuthName` 给安全域命名。在请求用户登录时会显示安全域名称。因此，使安全域名称非常具体很重要这样用户就会知道他们正在哪里登录。图 9.3\
  \ 显示了访问本书网站上示例包的此类登录面板。\n\n![image](img/00116.jpeg)\n\n图 9.3 HTTP 基础认证示例\n\n\n\n\
  \n\n`AuthType` 可以是 `Basic` 或 `Digest`。`AuthUserFile` 指定包含已注册用户的文件的完整路径。可选的 `AuthGroupFile`\
  \ 指定包含组名及这些组内用户的文件的完整路径。`Require` 指令定义了哪些注册用户可以访问此域（realm）。\n\n```\nvalid-user (AuthUserFile\
  \ 中的所有用户)\nuser id1 id2 id3 ... (给定的用户)\ngroup grp1 grp2 ... (给定组中的所有用户)\n```\n\n\
  `AuthUserFile` 列出了每个注册用户的 `userid` 和 `password`，每行一个用户。以下是 `/var/www/etc/wdp1` 中的示例条目。\n\
  \n```\nPWang:RkYf8U6S6nBqE\n```\n\nApache 工具 `htpasswd` (``htdigest` ) 帮助为 `Basic`（`Digest`）身份验证方案创建密码文件并添加注册用户。（请参阅这些工具的\
  \ man 页面了解用法）。例如：\n\n```\nhtpasswd -c /var/www/etc/wdp1 PWang\n```\n\n这会创建文件并为用户\
  \ `PWang` 添加条目，同时交互式询问 `PWang` 的密码。如果你想设置组文件，可以遵循 `/etc/group` 的格式，即每行看起来如下：\n\n\
  ```\ngroup-name: userid1 userid2 ...\n```\n\n也可以通过 `.htaccess` 文件设置登录。例如，在用户 `pwang`\
  \ 的 `public_html` 下的 `.htaccess` 中放入：\n\n```\nAuthUserFile /home/pwang/public_html/.htpassword\n\
  AuthName \"Faculty Club\"\nAuthType Basic\nRequire valid-user\n```\n\n然后在 `.htpassword`\
  \ 中放置任何已注册的用户。\n\n如果对特定的受保护资源指定了多个 `Require` 和/或 `allow` 条件，则会给出 `satisfy any`（满足任一条件）或\
  \ `satisfy all`（必须满足所有条件）指令。例如（例：`ex09/flexibleprotect.conf`）：\n\n```\n<Location\
  \ /internal>\n<order deny,allow\ndeny from all\nallow from .cs.kent.edu\nAuthName\
  \ \"CS Internal\"\nAuthType Basic\nAuthUserFile /var/www/etc/cs\nrequire valid-user\n\
  satisfy any\n</Location>\n```\n\n这意味着 `/internal` 下的资源可以由任何来自 `cs.kent.edu` 域的请求访问（无需登录），或者用户必须登录。\n\
  \n### 9.10 HTTP Basic 身份验证的工作原理\n\n当收到受 Basic 身份验证保护的域的未授权资源请求时，Web 服务器会发布挑战：\n\n\
  ```\nHTTP/1.0 401 Unauthorized\nWWW-Authenticate: Basic realm=\"CS Internal\"\n\
  ```\n\n收到挑战后，浏览器会显示登录对话框，请求给定域的 `userid` 和 `password`。看到登录框后，用户输入 `userid` 和 `password`。浏览器随后带有添加的授权\
  \ HTTP 请求头再次发送相同的资源请求：\n\n```\nAuthorization: Basic QWxhZGRpbjpvcGVuIHNlc2FtZQ==\n\
  ```\n\n其中 `base6` 编码的 basic cookie 解码为 `userid:password`。从现在起，浏览器会在向给定域的每个后续请求中自动包含该\
  \ basic cookie。这种行为将持续到浏览器实例关闭。\n\n### 9.11 HTTP Digest 身份验证的工作原理\n\n除非通过安全连接（如\
  \ `HTTPS` 使用的 `SSL` 安全套层），否则 Basic 身份验证并不安全。`userid` 和 `password` 在 HTTP 上很容易被窃听。Digest\
  \ 身份验证是一种新兴的 HTTP 标准，提供了一种比 Basic 身份验证稍安全的方法。\n\n使用 Digest 身份验证时，服务器发送一个单行挑战：\n\n\
  ```\nHTTP/1.1 401 Unauthorized WWW-Authenticate:Digest realm=\"Gold Club\" nonce=\"\
  3493u4987\"\n```\n\n其中 `nonce` 是服务器生成的任意字符串。`nonce` 的推荐形式是 `MD5` 哈希值，它包含了客户端的 IP\
  \ 地址、时间戳和只有服务器才知道的私钥。\n\n收到挑战后，浏览器计算：\n\n```\nstr1 = MD5(userid + password)\nstr2\
  \ = MD5(str1 + nonce + Resource_URI)\n```\n\n浏览器发送授权 HTTP 请求头（单行）：\n\n```\nAuthorization:\
  \ Digest realm=\"Gold Club\", nonce=\"...\",username=\"pwang\", uri=\"/www/gold/index.html\"\
  ,response=\"str2\"\n```\n\n服务器通过使用存储的密码计算来验证响应。从现在起，浏览器会在向同一域的每个请求中包含 Digest 身份验证头。服务器可能随时选择使用不同的\
  \ `nonce` 重新挑战。\n\n#### Basic 与 Digest 身份验证\n\nBasic 身份验证简单且适用于所有主流浏览器。Digest 身份验证稍微安全一些，但浏览器的支持不够完善。包括\
  \ Apache 在内的 Web 服务器倾向于支持这两种方案。当考虑安全性时，最佳实践是通过 `HTTPS` 从 Basic 身份验证迁移。。\n\n### 9.12\
  \ 密码加密\n\nApache 提供的 `htpasswd` 工具使用 `crypt` 相同的 Linux/UNIX 函数。在这种加密方案中，密钥通过取每个字符的位形成。原始密码永远不会存储。在验证密码时，从加密密码中提取盐（salt），并用于前面的算法以检查是否重新生成了加密密码。如果是，则密码正确。\n\
  \n### 9.13 文件自动压缩\n\nApache 利用许多 HTTP 特性来使 Web 页面更快。其中一个特性是在网络传输之前对页面进行自动压缩，从而显著减少文件大小和传输时间。对于压缩率可达到\
  \ 85% 或更高的文本页面来说尤其如此。你的浏览器会自动解压缩压缩页面。\n\nApache 2.0 的 `mod_deflate` 模块通过 HTTP `Content-Encoding`\
  \ 和 `Accept-Encoding` 头部支持自动（动态）文件压缩。这两个配置指令（例：`ex09/deflate.conf`）：\n\n```\nDeflateCompressionLevel\
  \ 6\nAddOutputFilterByType DEFLATE text/html text/plain text/xml text/css application/x-javascript\
  \ application/xhtml+xml application/xslt+xml application/xml application/xml-dtd\
  \ image/svg+xml\n```\n\n指示了指定压缩级别下动态压缩（使用 `zlib`）的内容类型列表。压缩会在服务器端增加一些处理负载，压缩级别越高，处理负载越重。只有当传入的\
  \ HTTP 请求指示了接受的压缩编码时才会进行压缩。浏览器压缩偏好的检测以及发送压缩或未压缩的数据是自动的。当然，任何压缩的输出页面将带有适当的 `Content-Encoding`\
  \ 响应头。\n\n`AddOutputFilterByType` 指令在 `.htaccess` 中需要 `AllowOverride FileInfo` 才能工作。\n\
  \n### 9.14 HTTPS 和 SSL/TLS\n\nWeb 服务器支持 `HTTPS` 实现客户端与服务器之间的安全通信。\n\n![image](img/00117.jpeg)\n\
  \n图 9.4 HTTP 和 HTTPS\n\n\n\n\nHTTPS 是基于安全套接层（SSL）或更新的传输层安全（TLS）协议的 HTTP（超文本传输协议）（图\
  \ 9.4）。注意 HTTP 和 HTTPS 使用不同的服务器网络端口，通常分别为 80 和 443。`SSL/TLS` 从 `SSL` 1.0、2.0 和 3.0\
  \ 发展到 `TLS` 1.0、1.1 和 1.2。`SSL/TLS` 通过允许双向身份验证、使用数字签名确保完整性以及使用数据加密确保机密性，为客户端和服务器提供了安全通信。要启用\
  \ HTTPS，服务器需要安装有效的 Web 服务器证书（章节 7.9）并启用 `SSL/TLS`。\n\n`SSL/TLS` 可以放置在可靠面向连接的传输协议层（如\
  \ `TCP/IP`）与应用协议层（如 `HTTP`）之间（图 9.5）。\n\n![image](img/00118.jpeg)\n\n图 9.5 HTTPS\
  \ 协议层\n\n基本上，`TLS` 分两个步骤建立安全通信：\n\n1. 握手阶段——双向身份验证，并安全地约定一个随机生成的会话密钥，该密钥将在下一阶段中使用\n\
  2. 会话数据阶段——遵循记录（Record）层协议，使用会话密钥对客户端和服务器之间的消息进行对称加密（章节 7.8）\n\n握手阶段使用公钥加密（章节 7.9）为了安全性，而会话数据阶段使用更高效的对称加密来提高速度。每个新的\
  \ `SSL/TLS` 连接将建立一个新的会话密钥。图 9.6 展示了从用户角度看到的 `TLS` 握手过程。\n\n![image](img/00119.jpeg)\n\
  \n图 9.6 基础 TLS 握手\n\n对于初学者来说，这些内容可能有些复杂。别担心，我们将在本章稍后的部分讨论密码学、数字签名等内容。但首先，让我们来看数字证书。\n\
  \n### 9.15 HTTPS 支持\n\n按照以下三个步骤为 Apache HTTPD 设置 `SSL/TLS` 服务器证书，以便 Web 服务器监听端口\
  \ 443 并处理入站的 HTTPS 请求。\n\n1. 确保你已安装了必要的包 `openssl` 和 `mod_ssl`。\n2. 从如 `DigiCert`\
  \ 或 `Etrust` 等 CA 获取服务器证书，并将编码后的证书 `myserver.crt` 和私有密钥 `myserver.key` 安装在 `/etc/pki/tls/certs/`\
  \ 目录下。\n3. 针对 `httpd` 修改 `SSL` 配置 `/etc/httpd/conf.d/ssl.conf` 如下：\n\n```\nDocumentRoot\
  \ \"/var/www/html\"\nServerName mydomain:443\nSSLCertificateFile /etc/pki/tls/certs/myserver.crt\n\
  SSLCertificateKeyFile /etc/pki/tls/certs/myserver.key\n```\n\n然后重启 `httpd`\n\n```bash\n\
  systemctl restart httpd\n```\n\n同时，确保防火墙没有拦截 `https` 或端口 443（章节 8， 章节 8.5）。\n\n\
  出于本地或测试目的，你可以如下所示生成自签名服务器证书。\n\n生成 RSA 私有密钥：\n\n```bash\ncd /etc/pki/tls/certs;\
  \ make myserver.key\nopenssl rsa -in myserver.key -out myserver.key\n```\n\n填写证书签名请求（CSR）：\n\
