  \n\n\n\n\n\n\n\n\n```\n\n将为你列出疑似拼写错误的单词。或者你可以使用\n\n```\naspell -c file\n```\n\n\
  交互地对给定文件进行拼写检查。要查找单词，在大多数 Linux 系统上你可以使用\n\n```\nlook prefix\n```\n\n字典中所有具有给定前缀的单词都会显示出来。\n\
  \n另一个有用的命令是 `passwd`。输入\n\n```\npasswd\n```\n\n更改你的密码。此命令将提示如下：\n\n```\nChanging\
  \ password for your userid\nOld password:\n\nNew password:\n\nRetype new password:\n\
