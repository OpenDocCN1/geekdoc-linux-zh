  #### 附录：使用 SSH 和 SFTP 进行安全通信\n\nSSH 是一种安全的远程登录程序。它让你登录并访问远程计算机。SFTP 是一个安全的文件传输程序，允许你向另一计算机上传和下载文件。\n\
  \n#### 附录：使用 awk 进行模式处理\n\n`awk` 程序是一个强大的过滤器。它逐行处理输入，对每行执行指定的 `awk` 动作。\n\n####\
  \ 附录：使用 vim 处理文本\n\n创建和编辑文件是计算机上许多任务的基础。Linux 有许多文本编辑器，但 `vim`（vi Improved）是一个广受欢迎的视觉交互式编辑器。\n\
  \n#### 附录：使用 vi 编辑文本\n\n提供了关于 `vi` 编辑器的文本编辑概念、技术的深度介绍。\n\n#### 附录：Vi 快速参考\n\n`vi`\
  \ 中有很多可用命令，这张快速参考卡非常有用。\n\n#### 附录：emacs 编辑器\n\n不像 `vi` 具有不同的输入和命令模式，`emacs` 只在一个模式下运行：打印字符插入到光标位置。命令通过控制字符给出，或以\
  \ `ESC` 或 `ctrl+x` 为缀。\n\n# 参考文献\n\n[1]Richard. Linux Command Line and Shell Scripting\
