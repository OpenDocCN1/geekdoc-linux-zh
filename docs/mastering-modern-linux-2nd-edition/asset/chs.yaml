  \ Hall` 发布，其描述如下：\n\n> Perl 是一种解释型语言，专门为扫描任意文本文件、从这些文本文件中提取信息并根据这些信息打印报告进行了优化。它也是处理许多系统管理任务的良好语言。该语言的设计初衷是实用（易用、高效、完整），而不是美观（小巧、优雅、极简）。在作者看来（至少），它结合了\
  \ `C`、`sed`、`awk` 和 `sh` 的一些最佳特性，因此熟悉这些语言的人使用它应该不会有困难。（语言历史学家还会注意到 `csh`、`Pascal`\
  \ 甚至 `BASIC-PLUS` 的痕迹。）表达式语法与 `C` 表达式语法非常接近。如果你有一个通常会使用 `sed` 或 `awk` 或 `sh` 处理的问题，但它超出了它们的能力范围或者必须运行得快一点，而你又不想用\
  \ `C` 写愚蠢的东西，那么 `Perl` 可能正适合你。⋯\n\n`Perl 5.0` 是 `Perl` 的完全重写，增加了对象和模块化组织，于 1994\
