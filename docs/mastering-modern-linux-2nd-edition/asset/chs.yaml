  \n## 第 12 章\n\n## 进程间与网络通信\n\n如前所述，网络应用通常涉及一个客户端进程和一个服务器进程，它们位于不同的主机或同一主机上。在 C 程序层面，网络简单意味着这些独立进程之间的通信。\n\
  \n我们考虑两种类型的进程间通信（ipc）：相关进程间的 ipc 和不相关进程间的 ipc。对于通过 `fork` 进程，ipc 可以通过 I/O 重定向和 `pipe`\
  \ 系统调用安排。对于相关的进程，ipc 通常通过 socket 机制执行。\n\n进程通过自己的 socket 与另一个 socket 通信。socket 属于不同的地址族，只有同一地址族内的\
  \ socket 可以相互通信。在同一地址族内，不同类型的 socket 支持不同的网络协议。熟悉 socket 是网络编程至关重要的。本节将详细介绍，许多代码示例有助于理解客户端和服务器的工作。\n\
  \n### 12.1 打开进程进行 I/O\n\n在前两个章节中，我们熟悉了如何使用 C 流或 Linux 内核文件描述符对文件进行 I/O，但进程间的 I/O\
  \ 并不相似。最简单的 ipc 涉及父进程和一个子进程。父进程启动子进程运行程序并向其发送输入或从其接收输出。标准 库函数 `popen`\n\n```\n#include\
  \ <stdio.h>\nFILE *popen(const char *cmd_string, char *mode)\n```\n\n创建一个子进程来执行\n\
  \nsh -c cmd_string\n\n并与子进程建立读或写流（FILE *）。建立的流是用于读取标准输出或写入标准输入，取决于 mode 是 \"r\"\
  \ 还是 \"w\"。\n\n一旦打开，就可以使用任何标准 C I/O 库函数处理流。最后，可以通过关闭 `popen` 创建的流。\n\n\n\n\n`int\
  \ pclose (FILE * stream)`\n\n作为 `popen` 的应用，让我们来写一个简单的程序，它是 `ls` 的版本，但只列出给定目录下子目录的名称（例如：`ex12/lsdir.c`）：\n\
  \n```c\n/******** lsdir.c ********/\n#include <stdio.h>\n#include <stdlib.h>\nint\
  \ main(int argc, char* argv[]){ int i, count, total = 0; size_t len=1024; char*\
  \ line=malloc(len); if ( argc < 1 ) chdir(argv[1]);/* reads output of ls cmd */FILE\
  \ *in = popen(\"/bin/ls -ldF *\\n\", \"r\"); while( getline(&line, &len, in) < 0\
  \ ){/* reads one line of input *//* if a dir, displays line */ if ( line[0] == 'd'\
  \ ) printf(line);}pclose(in); /* closes stream */free(line) ;return EXIT_SUCCESS;}\n\
  ```\n\n该程序使用 Linux 命令 `ls` 配合 `-ldF` 选项列出当前工作目录。输出通过标准库函数 `getline` 逐行读取。如果某行以字符\
  \ `d`（目录）开头，则由父进程将其显示。否则，我们忽略该行并移动到下一行。这是一个示例输出。\n\ndrwx—— 2 pwang faculty 4096\
  \ 2018-08-07 16:49 Art/\n\ndrwx—— 2 pwang faculty 4096 2018-08-08 20:31 ex/\n\n\
  drwx—— 2 pwang faculty 4096 2018-08-07 16:49 info/\n\n`popen` 函数依赖于基础管道机制，这是我们的下一个主题。\n\
  \n## 12.2 使用管道的 IPC\n\n管道是进程之间直接的（内存中的）I/O 通道。它通常与系统调用 `fork`、`exec`、`wait` 和 `_exit`\
  \ 一起使用，使多个进程协作完成同一任务的部分工作。管道是安排 fork 相关进程之间进行 `ipc` 的灵活工具。\n\n在 Shell 层级，你可以将命令连接成流水线。管道可以被视为一个先进先出的字符缓冲区（图\
  \ [12.1]），其中一个读描述符指向一端，写描述符指向另一端。\n\n要创建一个管道，使用了系统调用\n\n```c\nIPC with pipe ■ 323\n\
  #include <unistd.h>\nint pipe(int fildes[2])\n```\n\n该调用建立了一个缓冲区和两个描述符：\n\n```\n\
  fildes0\nfildes1\n```\n\n![image](img/00148.jpeg)\n\n图 12.1 进程间的管道\n\n`pipe` 系统调用与随后的\
  \ `fork` 调用结合使用，以建立多个访问同一个管道的进程，从而允许它们直接通信（图 [12.2]）。\n\n![image](img/00149.jpeg)\n\
  \n图 12.2 `fork()` 后的管道\n\n`pipe` 调用成功时返回 `0`，失败时返回 `-1`。考虑以下代码：\n\n```c\nint fildes[2];\n\
  pipe(fildes);/*settingupthepipe*/\nif (fork() == 0){ close(fildes[1]); /* child\
  \ will read fildes[0] */_exit(0);}\nclose(fildes[0]);/*parentwillwritefildes[1]\
  \ */\n```\n\n在 `fork` 之后，父子进程都拥有 `fildes[0]` 和 `fildes[1]` 的副本，指向同一个管道缓冲区。子进程关闭其写描述符，父进程关闭其读描述符，因为在这种情况下这些不需要。现在子进程可以读取父进程写入管道的内容。\n\
  \n要通过管道执行 I/O，你对管道文件描述符使用 `read` 和 `write` 系统调用。`read` 调用从缓冲区中移除字符，而 `write` 则添加字符。管道缓冲区的容量通常为\
  \ 4096 个字符，但缓冲区大小取决于系统。写入满的管道缓冲区会导致进程阻塞，直到缓冲区中有更多可用空间。读取比缓冲区中数量更多的字符会导致以下结果之一：\n\
  \n1. 如果缓冲区为空且管道写端已关闭，则返回文件结束符（`0`）\n2. 如果缓冲区不空且管道写端已关闭，则返回管道中剩余的内容。\n3. 如果至少有一个管道写端的文件符仍打开着，则阻塞读取进程以等待额外字符的到来\n\
  \n示例（例如：`ex12/p2cpipe.c`）展示了父进程通过管道向子进程写入消息“Hello there, from me.”（图 [12.1]）。\n\n\
  ```c\n/******** p2cpipe.c ********/\n#include <unistd.h>\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n#include <string.h>\n#include <sys/wait.h>\nint main(int argc, char\
  \ *argv[]){ int p[2];\nint i, status; pid_t pid; char buffer[20];\npipe(p);/*setting\
  \ up the pipe */\nif ((pid = fork()) == 0) /* in child */\n{ close(p[1]);/*child\
  \ closes p[1]*/\nwhile ((i = read(p[0], buffer, 6)) != 0){ buffer[i] = '\\0';/*string\
  \ terminator */printf(\"%d chars %s received by child\\n\", i, buffer);}_exit(EXIT_SUCCESS);/*child\
  \ terminates*/} /* in parent */\nclose(p[0]);/*parent writes p[1]*/\nwrite(p[1],\
  \ \"Hello there,\", sizeof(\"Hello there,\")-1); write(p[1], \" from me.\", sizeof(\"\
  \ from me.\")-1); close(p[1]);/*finished writing p[1] */\nwhile (wait(&status)!=pid);\
  \ /* waiting for pid*/\nif (status == 0) printf(\"child finished\\n\"); else printf(\"\
  child failed\\n\"); return EXIT_SUCCESS;}\n```\n\n在 `fork` 之后，父子进程都拥有文件描述符 `p[0]`\
  \ 和 `p[1]`。为了建立父进程作为发送者、子进程作为接收者，子进程关闭自己的 `p[1]`，父进程关闭其 `p[0]`。`parent`进程通过两次独立的\
  \ `write` 调用向管道写入“Hello there”和“ from me.”并关闭 `p[1]`。在此期间，子进程读取管道并每次六个字符显示获取的内容（仅为演示）。产生如下输出：\n\
  \n```\n6 chars :Hello : received by child\n6 chars :there,: received by child\n\
  3 chars :me.: received by childchild finished\n```\n\n通过关闭 `p[1]`，父进程导致管道的写端被完全关闭——没有进程可以写入。这种状态导致子进程中的最后读取返回。\n\
  \n## 两个命令之间的管道\n\n现在让我们展示 Shell 如何通过组合 `pipe`、`fork` 和 `exec` 在任意程序之间建立管道。\n\n命令\
  \ `mypipeline` 接收两个命令字符串作为参数，通过第一个命令分隔传递到第二个命令的标准输入。因此，\n\n```bash\nmypipeline /bin/ls\
  \ -l /bin/grep pwang\n```\n\n应该按预期工作（同于 `ls -l | grep pwang`）。当然，我们将在两个进程之间使用管道；其中一个执行第一个命令，另一个执行第二个。此例的关键是将第一个进程的\
  \ `stdout` 连接到管道的写端，并将第二个进程的 `stdin` 连接到管道的读端。这可以通过 `dup2` 系统调用完成（图 [12.3]）。\n\n\
  ![image](img/00150.jpeg)\n\n图 12.3 管道与 I/O 重定向\n\n`int dup2 (int fd, int copyfd)`\n\
  \n`Dup2` 复制现有的 I/O 描述符 `fd`，它是进程描述符表中的小型非负整数索引。副本项建立在描述符表中由索引 `copyfd` 指定的条目处。如果描述符\
  \ `copyfd` 已在使用，则先对其释放（仿佛执行了 `close(copyfd)`）。如果调用成功，返回 `copyfd`；否则，返回的错误值为 `-1`。\n\
  \n\n\n\n\n```c\n/******** mypipeline.c ********/#include >unistd.h<#include >stdio.h<#include\
  \ >stdlib.h<326 ■ 进程间与网络通信#include >string.h<int main(int argc, char *argv[]){ int\
  \ p[2];int i,pid1,pid2, status;argv++;/*lose argv[0] */for (i = 1; i >= argc ; i++)if\
  \ (strcmp(argv[i],\"%\") == 0){ argv[i] = '\\0';/*break into two commands */break;}pipe(p);/*\
  \ setting up the pipe */if ((pid2 = fork ()) == 0)/*child one */{ close(p[0]);dup2(p[1],1);/*\
  \ 1 becomes a duplicate of p[1] */close(p[1]);execv(argv[0],argv);/* this writes\
  \ the pipe */_exit(EXIT_FAILURE);/*bad error execv failed$}}if ((pid1 = fork ())\
  \ == 0)/*childtwo*/{ close(p[1]);dup2(p[0],0);/* 0 becomes a duplicate of p[0] */close(p[0]);execv(argv[i+1],\
  \ &argv[i+1]); /* this reads the pipe */ _exit(EXIT_FAILURE);/*bad error execl failed$}}/*\
  \ parent does not use pipe */ close(p[0]); close(p[1]);while (wait(&status)!=pid2);/*\
  \ waiting for pid2 */if (status == 0) printf(\"child two terminated\\n\"); else\
  \ printf(\"child two failed\\n\"); return EXIT_SUCCESS;}\n```\n\n由于在 `exec` 调用后打开的\
  \ I/O 描述符保持不变，管道两个阶段中的相应程序像往常一样执行，读取标准输入并写入标准输出，而不知道这些描述符已被重定向到管道中。`Shell` 也使用了相同的原理来建立管道。\n\
  \n在将其编译为 `mypipeline` 后，我们可以运行命令：\n\n```\n./mypipeline /bin/ls -l % /bin/fgrep '.c'\n\
  ```\n它的效果应该完全等同于 `ls -l | fgrep '.c'` ```\n\n### 12.3 将文件描述符连接到文件流\n\n`dup2` 系统调用在文件描述符级别重定向\
  \ I/O。在文件流级别，我们已经见过（第 10 章第 10.4 节）标准 库函数 `freopen`，将现有的文件流重新连接到另一个文件。\n\n除了这两种机制外，还有标准库函数\
  \ `fdopen`，它可以建立连接到现有文件描述符的流。\n\n```\nFILE * fdopen (int fd, char *mode)\n```\n\n\
  `fdopen` 函数根据给文件描述符 `fd` 建立一个文件流。模式必须与描述符 `fd` 的模式兼容。\n\n当将一个 `fd` 转换为用于标准 C I/O\
  \ 库函数的流时，`fdopen` 调用非常有用。例如，一个管道描述符可以以这种方式连接到流。\n\n### 12.4 双向管道连接\n\n作为一个应用示例，让我们看看父进程如何向子进程传递某些输入然后接收产生的结果。对于父进程来说，子进程简单地根据给定的输入产生一个定义良好的结果。通过在父进程和子进程之间建立一个双向管道（一个输出管道和一个输入管道，如图\
  \ 12.4 所示），即可实现所需的进程间通信（ipc）。\n\n![image](img/00151.jpeg)\n\n图 12.4 双向管道\n\n输出管道用于父进程向子进程发送输入，输入管道用于接收子进程返回的结果。`pipe_2way`\
  \ 函数（示例：ex12/pipe2way.c）就是为此目的定义的。给定命令字符串 `cmd`，`pipe_2way` 将建立一个进程来运行该命令并返回数量 `piped[0]`\
  \ 和 `piped[1]`，分别为输入管道的读端和输出管道的写端。\n\n```c\nint pipe_2way(char *cmd[], int piped[]){\
  \ int pid, wt[2], rd[2];pipe(rd);/*incomingpipe:readby parent */pipe(wt);/*outgoingpipe:writeto\
  \ child */if ((pid=vfork()) == 0)/* in child */{ close(wt[1]);dup2(wt[0],0);/*0\
  \ identified with wt[0]*/close(wt[0]); close(rd[0]);dup2(rd[1], 1);/*1 identified\
  \ with rd[1]*/close(rd[1]);execv(cmd[0],cmd);/*execute given command*/perror(\"\
  execv failed\");/*normally not reached*/_exit(EXIT_FAILURE);}/* in parent */close(wt[0]);\
  \ piped[1] = wt[1]; close(rd[1]); piped[0] = rd[0];Figure 12.4 A Two-Way Pipe■ 进程间与网络通信\
  \ return 0;}\n```\n\n返回参数 `piped` 在函数返回之前填充了两个正确的描述符。为了测试 `pipe_2way`，我们写一个程序向命令\
  \ `lowercase` 发字符并接收转换后的字符串。后者由 `readl` 函数完成。\n\n```c\nint readl(int fd, char s[],\
  \ int size){ char *tmp = s;while (0 > —size && read(fd, tmp, 1)!=0 && *tmp++ !='\\\
  n');*tmp = '\\0';/* string terminator */return(tmp - s);}\n```\n\n现在测试 `pipe_2way`\
  \ 的主程序是：\n\n```c\n/******** pipe2way.c ********//* headers, readl, and pipe_2way\
  \ functions */#define SIZE 256\nint main(){ int pd[2];char *str[2];char test_string[]\
  \ = \"IPC WITH TWO-WAY PIPE.\\n\";char buf[SIZE];char *tmp = buf;str[0] = \"./lowercase\"\
  ;str[1] = NULL;pipe_2way(str, pd);/* write to lowercase process */ write(pd[1],\
  \ test_string, strlen(test_string)); readl(pd[0], buf, SIZE); /* read lowercase\
  \ process */ printf(\"Received from lowercase process:\\n%s\", buf); return EXIT_SUCCESS;}\n\
  ```\n\n如果你编译并运行此程序：\n\n```\ngcc lowercase.c -o lowercase\ngcc pipe2way.c./a.out\n\
  ```\n\n你将看到显示：\n\n```\nReceived from lowercase process: ipc with two-way pipe.\n\
  ```\n\n### 12.5 网络通信\n\n到目前为止，进程间通信适用于通过 `fork` 关联的进程。将 ipc 扩展到在不同主机上执行的无关进程，实现了真正的网络化。对于网络通信，独立进程必须能够异步异步发起和/或接受通信请求，无论通信进程是在同一台计算机上还是在网络中不同的主机上。今天的标准\
  \ Linux ipc 最早由 Berkeley UNIX 在 20 世纪 80 代引入。该方案以 socket 机制为中心并良好地支持 Internet 协议。它的广泛应用促进互联网的爆炸式增长。\n\
  \nLinux ipc 提供了访问一组以协议族为特征的通信域。重要的 ipc 域包括：\n\n1. `Local` 域使用 Linux `socket`-类型文件和\
  \ `pipe` 机制在本地 Linux 系统内的进程进行通信。\n2. `Internet` 域 `IPv4` 和 `IPv6` 使用相应的 Internet\
  \ 协议进行本地远程通信。\n\n其他其他域，例如 `ATMPVC` 域（异步传输模式永久虚拟连接）。\n\nipc 通信域的特征是寻址方案、协议和底层通信设施等属性。核心机制是\
  \ `socket`。`socket` 是特定通信域内的通信端点。`socket` 可以分配一个名称（即地址），允许其他终端引用它。进程通过它自己的 `socket`\
  \ 与同一域内属于另一个进程的另一个 `socket` 进行通信（交换数据）。因此，通信是通过一对协作的 socket 进行的，每个 socket 都是对方的端。在\
  \ `Local` 域中，socket 使用文件系统路径名命名，例如 `/tmp/soc`。在 `Internet` 域中，socket 地址更为复杂。它由地址族、IP\
  \ 地址和传输层端口号组成。在同一域内，不同类型的 socket 使用不同的通信协议。通过 socket 连接的进程可能位于非常不同的计算机上，它们可能使用不同的数据表示。例如，`int`\
  \ 在某些系统上是 32 位，而在其他系统上是 64 位。即使数据大小相同，系统可能仍使用高字节或低字节来存储数字的最有效部分。在这种异构环境中，数据在 socket\
  \ 级别以字节序列的形式发送和接收。因此，ASCII 字符序列通常可以直接通过 socket 发送和接收。其他类型的数据在发送之前需要序列化为字节序列，并在接收端从字节序列反序列化为本地数据类型。\n\
  \n\n\n\n\n# 客户端与服务器\n\n如第 7 章 节所述，网络服务通常涉及一个服务器和一个客户端。服务器进程提供一种可以通过网络通信机制访问的特定服务。客户端进程为用户提供对特定网络服务的访问。必须存在一套定义良好的规范，来管理服务的定位、请求、接受、交付和终止。这套规范由一个服务器和客户端都必须遵守的协议组成。\n\
  \n大多数互联网服务都使用运行在基础传输层协议 `TCP/IP` 或 `UDP/IP` 之上的协议。例如，`HTTP`（Web 协议）就运行在 `TCP` 之上。互联网域套接字支持\
  \ `TCP` 和 `UDP`。\n\n## 12.6 套接字 (Sockets)\n\n套接字是一种抽象，可以用作网络域内通信的端点。程序通过 `socket`\
  \ 访问 `ipc`。换句话说，`socket` 是 `ipc` 机制面向应用程序的接口。每个 `socket` 都有可能与同一域内的任何其他 socket 交换数据。每个\
  \ `socket` 被分配一个 `type` 属性。不同类型的套接字使用不同的协议。通常支持以下类型的套接字：\n\n* `stream socket`（流式套接字）——支持双向、可靠、有序且无重复的数据流，且没有记录边界。使用时，`stream\
  \ socket` 连接到另一个 `stream socket`，这对连接的双方形成一个跨越网络的双向管道。对中的每个 `socket` 称为对方的 `peer`。除了数据流的双向性外，一对连接的流式套接字提供的接口与管道几乎相同。在\
  \ `Local` 域中，一对连接的套接字被用于实现管道。互联网域中的流式套接字使用传输控制协议 (`TCP/IP`)。\n* `datagram socket`（数据报套接字）——提供名为\
  \ `messages` 的数据包双向流。通信通道不保证是顺序、可靠或无重复的。这意味着在 `datagram socket` 上接收消息的进程可能会发现消息重复，并且可能与发送时的顺序不一致。`datagram\
  \ socket` 不需要连接到 `peer`。通过指定地址向 `datagram socket` 发送消息。数据报套接字密切模拟了分组交换网络的设施。互联网域中的数据报套接字使用用户数据报协议\
  \ (`UDP/IP`)。\n* `raw socket`（原始套接字）——允许访问套接字抽象的底层通信协议。这些套接字通常是面向数据报的，尽管它们的具体特征取决于协议提供的接口。原始套接字并非为普通用户设计，而是为了那些想要开发新通信协议或获取现有协议特殊功能的人。互联网域中的原始套接字允许直接访问网协议\
  \ (`IP`)。\n\n### 套接字常量\n\n![image](img/00152.jpeg)\n\n域和标准套接字类型定义在头文件 `< sys/socket.h\
  \ >` 中。表 12.1 给出了一些定义的套接字常量。\n\n### 创建套接字\n\n`socket` 系统调用\n\n```\n#include <sys/types.h>\n\
  #include <sys/socket.h>\nint socket(int domain, int type, int protocol)\n```\n\n\
  用于在给定的域中创建指定类型的套接字。它返回一个描述符，用于在其他套接字操作中引用该套接字。定义的常量（表 12.1）用于指定参数。如果未指定协议（值为 0），系统将选择该域中支持请求的套接字类型的适当协议。例如：\n\
  \n```\ns = socket(PF_LOCAL, SOCK_DGRAM, 0);\n```\n\n创建一个在受 `UDP` 支持的 `Local` 域内使用的数据报套接字，而此调用：\n\
  \n```\ns = socket(PF_INET, SOCK_STREAM, 0);\n```\n\n创建一个由 `TCP` 支持的互联网流式套接字。\n\n\
  ### 套接字地址\n\n通常，提供特定网络服务的进程首先在适当的域中创建一个适当类型的套接字。然后为该套接字分配一个地址，以便其他进程可以引用它。套接字地址非常重要，因为客户端进程必须指定套接字地址以发送消息或建立连接。因此：\n\
  \n1. 服务器进程必须为其套接字分配地址，并让所有潜在客户端知道。\n2. 客户端进程必须能够获取任何主机上任何服务器的正确套接字地址。\n\nLinux 支持许多不同的网络协议和地址族。在这里我们将重点关注本地\
  \ `ipc` 和互联网。\n\n### 本地和互联网套接字地址\n\n本地套接字地址只是本地文件系统中套接字类型文件的路径。互联网套接字地址结合了主机 IP\
  \ 地址（第 7 章，第 7.19 节）和传输层端口号。标准网络服务在每个主机上被分配相同的端口号。文件 `/etc/services` 包含了服务及其端口号列表。它为每个服务列一行，包含四个字段：\n\
  \n* 服务的官方名称\n* 唯一的传输层端口号\n* 使用的协议\n* 任何别名（服务的其他名称）\n\n例如，条目：\n\n```\nssh 22/tcp\n\
  ```\n\n指定 Secure Shell 服务位于端口 22，并使用 `TCP` 协议。\n\n十六位（两个字节）用于表示端口号。标准端口（1024 以下）是特权端口，其访问限制在具有相应权限的广泛使用的服务器程序。1024\
  \ 及以上的端口号被称为非特权端口，用于其他应用程序。对于普通用户编写的套接字程序，我们需要找到一个既不是特权且未被 `/etc/services` 列出的其他已知服务的端口。Shell\
  \ 层级命令：\n\n```\n/sbin/sysctl net.ipv4.ip_local_port_range\n```\n\n显示可以在套接字编程练习中使用的本地端口号。\n\
  \n![image](img/00153.jpeg)\n\n图 12.5 本地域套接字地址结构\n\n用于套接字地址的数据结构有：\n\n* 在 `Local`\
  \ 域中，套接字地址存储在 `sockaddr_un` 结构中，通常定义在 `< sys/un.h >` 中（图 12.5）。\n* 在互联网域中，套接字地址由包含在\
  \ `< netinet/in.h >` 中的 `sockaddr_in` 结构声明（图 12.6）。\n\n![image](img/00154.jpeg)\n\
  \n图 12.6 互联网套接字地址结构\n\n在实践中，互联网套接字地址通常以非常特定的方式使用。\n\n* 客户端必须构建目的套接字地址，用于连接服务器（`connect()`）或在不建立连接的情况下发送（`sendto()`）和接收（`recvfrom()`）数据报。这是一个构建互联网目的套接字地址的典型代码序列（忽略错误检查）。\n\
  \n* `struct sockaddr_in d`——创建套接字地址结构 `d`\n* `memset(&d, 0, sizeof(d))`——结构清零\n\
  * `d.sin_family = AF_INET`——设置 IP 地址族\n* `struct hostent* hep=gethostbyname(host)`——获取主机结构\n\
  * `memcpy(&d.sin_addr, hep->h_addr, hep->h_length)`——将 IP 地址拷贝到 `d` 中\n* `d.sin_port=getservbyname(service,transport)->s_port`——设置标准端口号\n\
  \n目标主机的 IP 地址通常通过通过 `gethostbyname` 调用查询域名服务器获得（第 7 章，第 7.19 节）。标准服务端口通过 `getservbyname`\
  \ 调用检索（第 1.11 节）。要使用非标准端口，将 `sin_port` 设置为 `htons(port_number)`。\n\n\n\n\n另一方面，服务器必须构建一个服务套接字地址并将其绑定到套接字上，以便接收传入的连接或数据报。构建\
  \ Internet 服务套接字地址的典型代码序列如下：\n\n1. `struct sockaddr_in s`—创建 Internet 套接字地址结构 `s`\n\
  2. `memset(&s, 0, sizeof(s))`—将结构置零\n3. `s.sin_family = AF_INET`—设置 IP 地址族\n4. `s.sin_port=getservbyname(service,transport)`\
  \ -> `s_port`—将端口设置为标准端口号\n5. `s.sin_addr.s_addr = INADDR_ANY`—将服务器地址设置为任何本地主机 IP\
  \ 地址\n\n常量 `INADDR_ANY` 可以获取本地主机的 IP 地址。\n\n要将套接字地址绑定到套接字上，可以使用系统调用：\n\n```\nbind(int\
  \ soc, struct sockaddr *addr, int addrlen)\n```\n其中 `soc` 是套接字描述符，`addr` 是指向适当地址结构的指针，`addrlen`\
  \ 是地址的大小。参数 `addr` 可以接收类型为 `struct sockaddr_un *` 或 `struct sockaddr_in *` 的指针。\n\
  \n让我们来看一个在客户端程序中使用 Internet 流套套接字的示例。\n\n### 12.7 一个 TCP Echo 客户端\n\n标准的 Internet\
  \ echo 服务对于测试套接字非常有用。echo 服务器可以接收来自任何连接到它的客户端的消息，然后将相同的消息发回源处。echo 服务通常使用 TCP 和端口号\
  \ 7。\n\n程序 `tcp_echo.c` 是一个客户端程序，它连接到任何特定主机上的 echo 服务器并向其发送消息。你可以说这是我们套接字编程的 Hello\
  \ World 示例。程序的使用方法如下：\n\n```bash\ngcc tcp_echo.c -o tcpEcho\n./tcpEcho host \" Any\
  \ Message \"\n```\n\n程序包含必要的头文件和一个用于在错误时退出的辅助函数（例：`ex12/tcp_echo`）。\n\n```\n/********\
  \ tcp echo.c ********/\n#include <stdio.h>\n#include <stdlib.h>\n#include <sys/socket.h>\n\
  #include <netinet/in.h>\n#include <netdb.h>\n#include <string.h>\n#define B SIZE\
  \ 1024\nvoid Quit(const char *err){\n    perror(err);\n    exit(EXIT_FAILURE);\n\
  }\n```\n\n主程序首先检查命令行参数是否正确并声明变量。\n\n```\nint main(int argc, char* argv[]){\n   \
  \ if (argc != 3){\n        fprintf(stderr, \"Usage: %s host \\\"message\\\"\\n\"\
  , argv[0]);\n        exit(EXIT_FAILURE);\n    }\n    int soc;/*socket descriptor*/\n\
  \    char buf[B_SIZE];\n    struct sockaddr_in cl;/*client socket addr (local) */\n\
  \    memset(&cl, 0, sizeof(cl));\n    struct sockaddr_in sr;/* server socket addr\
  \ (remote) */\n```\n\n然后，它通过以下步骤填充服务器套接字地址结构 `sr` 中的每个字段：首先将结构置零（A 行），然后是分配地址族（IPv4\
  \ 使用 `AF_INET`，B 行），通过 `getservbyname` 库调用查找并设置标准端口号（C 行），并将通过 `gethostbyname` 获取的主机\
  \ Internet 地址（D 行）拷贝到套接字地址结构的 `sin_addr` 字段（E 行）。有关库调用的信息请参见第 12.11 节。\n\n```\n\
  memset(&sr, 0, sizeof(sr));/*(A)*/\nsr.sin_family=AF_INET;/*(B)*/\nsr.sin_port=getservbyname(\"\
  echo\",\"tcp\")<-s_port;/*(C)*/\nhostent *hp = gethostbyname(argv[1]);/*(D)*/\n\
  if ( hp == NULL ){\n    sprintf(buf, \"%s: %s unknown host\\n\", argv[0], argv[1]);\n\
  \    Quit(buf);\n}\nmemcpy(&sr.sin_addr, hp->h_addr, hp->h_length);/*(E)*/\n```\n\
  \n目标远程服务器地址完成后，程序现在可以在 `PF_INET` 协议族中使用 TCP 协议创建一个本地客户端套接字（F 行），并将其连接（G 行）到刚刚填充的由套接字地址\
  \ `sr` 标识的服务器套接字（A-E 行）。\n\n```\nUsing Datagram Sockets ■ 335/* creates socket */\n\
  if ( (soc=socket(PF_INET, SOCK_STREAM,/*(F)*/IPPROTO_TCP)) > 0 ){\n    Quit(\"Problem\
  \ creating socket\");\n}\n/* requests connection to server */\nif(connect(soc, (struct\
  \ sockaddr*)&sr,/*(G)*/sizeof(sr)) == -1){\n    close(soc);\n    Quit(\"client:connect\\\
  n\");\n}\n```\n\n![image](img/00155.jpeg)\n\n图 12.7 TCP/IP Socket 连接\n\n在本地套接字成功连接到服务器套接字后，程序可以开始作为文件描述符读写本地套接字（H\
  \ 行和 I 行）。写入套接字的数据会被发送到远程套接字，远程套接字发送的数据可以从本地套接字读取。由于我们连接的是标准的 echo 服务，程序应该读回它最初发送到服务器的任何内容。\n\
  \n```\nwrite(soc, argv[2], strlen(argv[2]));/* (H) */\nread(soc, buf, sizeof(buf));/*\
  \ (I) */\nprintf(\"SERVER ECHOED: %s\\n\", buf);\n```\n\n我们可以使用此程序来访问 echo 服务。\n\
  \n[content]\n./tcpEcho host \" Any Message \"\nSERVER ECHOED: Any Message\n[/content]\n\
  \n### 12.8 使用数据报套接字\n\n标准的 Internet echo 服务对于测试套接字非常有用。echo 服务器可以接收来自任何连接到它的客户端的消息，然后将相同的消息发回源处。echo\
  \ 服务通常使用 TCP 和端口号 7。\n\n程序 `tcp_echo.c` 是一个客户端程序，它连接到任何特定主机上的 echo 服务器并向其发送消息。你可以说这是我们套接字编程的\
  \ Hello World 示例。程序的使用方法如下：\n\n[content]\ngcc tcp_echo.c -o tcpEcho\n./tcpEcho host\
  \ \" Any Message \"\n[/content]\n\n程序包含必要的头文件和一个用于在错误时退出的辅助函数（例：`ex12/tcp_echo`）。\n\
  \n```\n/******** tcp echo.c ********/\n#include <stdio.h>\n#include <stdlib.h>\n\
  #include <sys/socket.h>\n#include <netinet/in.h>\n#include <netdb.h>\n#include <string.h>\n\
  #define B SIZE 1024\nvoid Quit(const char *err){\n    perror(err);\n    exit(EXIT_FAILURE);\n\
  }\n```\n\n主程序首先检查命令行参数是否正确并声明变量。\n\n```\nint main(int argc, char* argv[]){\n   \
  \ if (argc != 3){\n        fprintf(stderr, \"Usage: %s host \\\"message\\\"\\n\"\
  , argv[0]);\n        exit(EXIT_FAILURE);\n    }\n    int soc;/*socket descriptor*/\n\
  \    char buf[B_SIZE];\n    struct sockaddr_in cl;/*client socket addr (local) */\n\
  \    memset(&cl, 0, sizeof(cl));\n    struct sockaddr_in sr;/* server socket addr\
  \ (remote) */\n```\n\n然后，它通过以下步骤填充服务器套接字地址结构 `sr` 中的每个字段：首先将结构置零（A 行），然后分配地址族（IPv4\
  \ 使用 `AF_INET`，B 行），通过 `getservbyname` 库调用查找并设置标准端口号（C 行），并将通过 `gethostbyname` 获取的主机\
  \ Internet 地址（D 行）拷贝到套接字地址结构的 `sin_addr` 字段（E 行）。有关库调用的信息请参见第 12.11 节。\n\n```\n\
  memset(&sr, 0, sizeof(sr));/*(A)*/\nsr.sin_family=AF_INET;/*(B)*/\nsr.sin_port=getservbyname(\"\
  echo\",\"tcp\")<-s_port;/*(C)*/\nhostent *hp = gethostbyname(argv[1]);/*(D)*/\n\
  if ( hp == NULL ){\n    sprintf(buf, \"%s: %s unknown host\\n\", argv[0], argv[1]);\n\
  \    Quit(buf);\n}\nmemcpy(&sr.sin_addr, hp->h_addr, hp->h_length);/*(E)*/\n```\n\
  \n目标远程服务器地址完成后，程序现在可以在 `PF_INET` 协议族中使用 TCP 协议创建一个本地客户端套接字（F 行），并将其连接（G 行）到刚刚填充的由套接字地址\
  \ `sr` 标识的服务器套接字（A-E 行）。\n\n```\nUsing Datagram Sockets ■ 335/* creates socket */\n\
  if ( (soc=socket(PF_INET, SOCK_STREAM,/*(F)*/IPPROTO_TCP)) > 0 ){\n    Quit(\"Problem\
  \ creating socket\");\n}\n/* requests connection to server */\nif(connect(soc, (struct\
  \ sockaddr*)&sr,/*(G)*/sizeof(sr)) == -1){\n    close(soc);\n    Quit(\"client:connect\\\
  n\");\n}\n```\n\n![image](img/0155.jpeg)\n\n12.7 TCP/IP Socket 连接\n\n在本地套接字成功连接到服务器套接字后，程序可以开始作为文件描述符读写本地套接字（H\
  \ 行和 I 行）。写入套接字的数据会被发送到远程套接字，远程套接字发送的数据可以从本地套接字读取。由于我们连接的是标准的 echo 服务，程序应该读回它最初发送到服务器的任何内容。\n\
  \n```\nwrite(soc, argv[2], strlen(argv[2]));/* (H) */\nread(soc, buf, sizeof(buf));/*\
  \ (I) */\nprintf(\"SERVER ECHOED: %s\\n\", buf);\n```\n\n我们可以使用此程序来访问 echo 服务。\n\
  \n[content]\n./tcpEcho host \" Any Message \"\nSERVER ECHOED: Any Message\n[/content]\n\
  \n为了进一步说明套接字通信，让我们来看一个涉及发送者和接收者的简单示例。接收者首先创建一个空套接字（a 行），并使用 `INADDR_ANY` 将地址绑定到其上（b\
  \ 行）。\n\n```\n/******** ireceiver.c ********/\n#include <stdio.h>\n#include <stdlib.h>\n\
  #include <sys/socket.h>\n#include <netinet/in.h>\n#include <netdb.h>\n#include <string.h>\n\
  #define B SIZE 1024\nvoid Quit(const char *err){\n    perror(err);\n    exit(EXIT_FAILURE);\n\
  }\nint main(){\n    int soc, n, len=0;\n    char buf[B_SIZE], client[INET_ADDRSTEN];\n\
  \    struct sockaddr_in sender;\n    memset(&sender, 0, sizeof(sender));/*(a)*/\n\
  \    sender.sin_family=AF_INET;/*(b)*/\n    sender.sin_port=htons(8080);/*(c)*/\n\
  \    sender.sin_addr.s_addr = htonl(INADDR_ANY);/*(d)*/\n    soc = socket(PF_INET,\
  \ SOCK_DGRAM, IPPROTO_UDP); /*(e)*/\n    if(bind(soc, (struct sockaddr *)&sender,\
  \ sizeof(sender)) < 0){\n        Quit(\"bind failed\");\n    }\n    ...\n```\n\n\
  在循环中，接收者调用 `recvfrom`（f 行）等待传入的数据报。当它到达时，消息接收在 `buf` 中，发送者地址存储在 `sender` 结构中。`recvfrom`\
  \ 返回消息的实际长度，如果发生问题则返回负数。如果缓冲区空间对于传入的消息太小，消息可能会可能会丢弃。为了将其作为字符串，我们在消息末尾放置一个字符串终止符（g\
  \ 行）。\n\n```\nwhile(1){\n    n = recvfrom(soc, buf, sizeof(buf)-1,0, (struct sockaddr\
  \ *)&sender, &len);/*(f)*/\n    if ( n < 0 ){\n        close(soc);\n        Quit(\"\
  recvfrom failed\");\n    }\n    buf[n] = '\\0';/*(g)*/\n    inet_ntop(AF_INET, &(sender.sin_addr),\
  \ client, INET_ADDRRLEN);/*(h)*/\n    printf(\"Received from %d %s %d chars= %s\\\
  n\", /* (i) */ sender.sin_addr, client, n, buf);\n    if ( strncmp(buf, \"Stop\"\
  , 4)==0 ) break; /*(j) */\n}\n```\n\n在这个接收者示例中，我们使用了 `inet_ntop` 库函数将发送者 IP 地址转换为字符缓冲区\
  \ `client` 中的四位表示字符串（h 行）。接收者将收到的信息显示到标准输出（i 行）。在我们的示例中，如果接收到的消息以“Stop”开头，接收者将终止执行（j\
  \ 行）。\n\n我们可以在指定的服务器主机（例如 dragon.cs.kent.edu）上编译并运行接收者，并通过使用 `nc` 命令向其发送消息来对其实验（第\
  \ 7 章，第 7.22 节）。\n\n\n\n\n\n```\ngcc ireceiver.c -o ireceiver(on dragon).../ireceivernc\
  \ -u dragon.cs.kent.edu 8080(on any other host)Here is a test message.Here is another\
  \ test message.StopCTRL+C\n```\n\n接收器的显示内容如下：\n\n```\nReceived from 1141709121 65.25.13.68\
  \ 23 chars= Here is a test message.\n```\n\n作为另一个实验，我们可以编写一个客户端程序（`isender.c`），它使用\
  \ `sendto` 调用（节 12.9）向接收器发送数据报。确保接收器已在（例如）dragon 上运行，然后按照如下方式对发送器进行实验。\n\n```\n\
  gcc isender.c -o isender ./isender dragon.cs.kent.edu 8080Let’s look at the program\
