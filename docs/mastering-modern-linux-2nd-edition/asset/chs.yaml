  \ 年 5 月发布。\n\n## 第 11 章\n\n## I/O 和进程控制系统调用\n\n操作系统（OS）提供了许多工具和设施使计算机变得可用。然而，最基础、最核心的服务集是系统调用，它们是操作系统内核中应用程序可以直接访问的特定例程。Linux\
  \ 中有 300 多个系统调用，内核定义的编号从 1 开始。每个系统调用都有一个意义的名字，以及一个形式为 `SYS_name` 的符号常量来表示其编号。除少数例外外，系统调用名称对应于\
  \ Linux 内核源码中的 `sys_name` 例程。\n\n正在执行的程序被称为进程。当进程在运行时发出系统调用时，软件生成的中断（通常称为操作系统陷阱\
  \ trap）会触发进程从用户模式切换到内核模式，并将控制转移到与特定系统调用对应的目标内核例程的入口点。在内核模式下运行的进程可以执行用户模式下不可用的指令。系统调用完成后，进程切换回用户模式。\n\
  \n高级系统设施是通过编写使用系统调用的库程序构建的。由于 Linux 是 C 语言实现的，其系统调用使用 C 语法规范，并直接从 C 程序调用。\n\n这里描述了重要的\
  \ Linux 系统调用。这些调用允许你执行低级输入/输出（I/O）、操作文件和目录、创建和控制多个并发进程，以及管理中断。示例展示了如何使用系统调用，以及如何结合不同的系统调用来实现特定目标。\n\
  \n就像库函数一样，系统调用可能需要一个或多个相关的头文件。在描述的每个调用中都会明确指出这些头文件。\n\n系统调用集及其组织形式成了 Linux 内核的 C\
  \ 语言接口，该接口在所有主要的 Linux 发行版中几乎是统一的。这是是因为 Linux 系统紧密遵循 `POSIX`（可移植操作系统接口），这是一个全球接受的开放操作系统接口标准。`POSIX`\
  \ 由 `IEEE`（电气电子工程师学会）产生，并被 `ISO`（国际标准组织）和 `ANSI`（美国国家标准协会）认可。通过遵循 `POSIX`，软件可以很容易移植到任何符合\
  \ `POSIX` 标准的操作系统。\n\n任何系统调用名的文档可以通过以下命令找到：\n\n```\nman 2 name\n```\n在 `man` 页面的第\
  \ 2 节（第 1.15 节）。\n\n### 11.1 系统级 I/O\n\n`Standard C Library` 提供的 `putc` 和 `fopen`\
  \ 等高级 I/O 例程对于 C 程序的大多数 I/O 需求。这些库函数构建在操作系统提供的低级调用之上。在 Linux 中，C 的 I/O 流（第 10.4\
  \ 节）构建在系统调用支持的 I/O 描述符机制之上（图 11.1）。\n\n![image](img/00135.jpeg)\n\n图 11.1 I/O 层\n\
  \n了解低级 I/O 设施不仅能让你深入了解库函数的工作原理，还能让你以标准 C Library 不支持的方式使用 I/O。\n\nLinux 通过将 I/O\
  \ 硬件表示为特殊文件，为文件和设备（如终端窗口或光驱器）提供了统一的 I/O 接口。我们将讨论对文件的 I/O，并理解它们也适用于设备，因为设备无非特殊文件。除了文件之外，Linux\
  \ 还通过名为 `pipes`（管道）和 `sockets`（套接字）的抽象结构（第 12 章）支持进程（并发运行的程序）之间的 I/O。虽然文件、管道和套接字是不同的\
  \ I/O 对象，但它们受到这里解释的许多相同的低级 I/O 调用的支持。\n\n### 11.2 I/O 描述符\n\n\n\n\n在进行文件 I/O 操作之前，程序必须先向\
  \ Linux 表明其意图。这是通过如下定义的 `open` 系统调用来实现：\n\n```\n#include <sys/types.h>\n#include\
  \ <sys/stat.h>\n#include <fcntl.h>\nint open(const char *filename, int access [,\
  \ mode_t mode])\n```\n\n`open` 的参数为：\n\n```\nfilename 文件路径的字符字符串\naccess 意图访问方式的整数代码\n\
  mode 创建新文件时的保护模式\n```\n\n该调用根据 `access` 的指定打开 `filename` 以进行读取和/或写入，并返回该文件的整数描述符。`filename`\
  \ 可以以三种有效形式之一给出：全路径、相对路径或简单文件名。`open` 命令也被用于用给定的名称创建一个新文件。随后的 I/O 操作将引用此描述符而不是 `filename`。其他系统调用会返回\
  \ I/O 对象的描述符，例如管道（第 12 章，第 12.2 节）和套接字（第 12 章，第 12.6 节）。描述符实际上是每个进程打开文件表的索引，该表包含了该进程所有打开的文件和\
  \ I/O 对象的必要信息。`open` 调用返回当前未使用的表项的最小索引。每个表项随后指向一个内核打开文件表条目。所有进程共享同一个内核打开文件表（图 11.2），不同进程的文件描述符可能指向同一个内核表条目。\n\
  \n![image](img/00136.jpeg)\n\n图 11.2 打开文件表\n\n对于每个进程，最初会自动打开三个文件描述符：`STDIN_FILENO`\
  \ (0)、`STDOUT_FILENO` (1) 和 `STDERR_FILENO` (2)，允许直接访问标准 I/O。访问代码是由头文件提供的单比特值通过逻辑或\
  \ (`|`) 组合而成的，包括：\n\n- `O_RDONLY`: 以只读打开文件\n- `O_WRONLY`: 以只写打开文件\n- `O_RDWR`: 以读写打开文件\n\
  - `O_NDELAY`: 防止可能的阻塞\n- `O_APPEND`: 以追加模式打开文件\n- `O_CREAT`: 如果文件不存在则创建文件\n- `O_TRUNC`:\
  \ 将大小截断为 0\n- `O_EXCL`: 如果 `O_CREAT` 位开启且文件存在，则产生错误\n\n使用 `O_APPEND` 打开文件会指示对文件的每次写入操作都追加到末尾。如果指定了\
  \ `O_TRUNC` 且文件存在，则文件将被截断为长度零。如果访问方式为 `(O_EXCL | O_CREAT)` 且文件已存在，`open` 将返回错误。其目的是避免破坏现有文件。\n\
  \n`open` 的第三个可选参数是文件创建模式，用于 `O_CREAT` 位开启的情况。该模式是一个位模式（类型为 `<sys/types.h>` 中的 `mode_t`，带有来自\
  \ `<sys/stat.h>` 的符号值），在第 11.4 节中有详细解释，该节描述了 `creat` 系统调用。\n\n如果 `open` 调用失败，则返回\
  \ -1；否则返回一个描述符。一个进程同时打开的描述符数量有一个最大限制。在 Linux 中，这个限制足够大，无需实际担心。\n\n以下示例（Ex: ex11/open.c）展示了\
  \ `open` 系统调用的典型用法。open` 的第三参数未被使用，因为只读操作（`O_RDONLY`）不需要它。在这种情况下，任何整数都可以作为第三参数。\n\
  \n```c\n/******* open.c *******/\n#include <stdlib.h>\n#include <stdio.h>\n#include\
  \ <fcntl.h>\nint main(int argc, char *argv[]){\n    int fd; /* file descriptor */\n\
  \    /* open argv[1] for reading */\n    if ((fd = open(argv[1], O_RDONLY, 0)) ==\
  \ -1){\n        fprintf(stderr,\"%s: cannot open %s\\n\",argv[0], argv[1]);\n  \
  \      perror(\"open system call\");\n        exit(EXIT_FAILURE);\n    }\n    /*\
  \ other code */\n}\n```\n\n当系统或库调用失败时，你可以使用代码\n\n`perror(const char* msg)` (显示系统错误)\n\
  \n来显示给定的消息 `msg`，随后跟上与错误相关的标准错误信息（第 10 章，第 10.6 节）。\n\n当描述符 `fd` 在程序中不再需要时，可以使用以下调用从每个进程的打开文件中删除删除：\n\
  \n`int close(int fd)` (关闭描述符)\n\n否则，所有打开的文件描述符将在程序终止时被自动关闭。\n\n### 11.3 读写 I/O 描述符\n\
  \n读和写通常是顺序的。对于每个打开的描述符，都有一个当前位置指向下一个要读取或写入的字节。在读取或写入 `k` 个字节后，如果当前位置是移动的，它将移动 `k`\
  \ 个字节。当前位置是否移动取决于 I/O 对象。例如，对于实际文件它是可移动的，但对于连接到键盘的 `stdin` 则不可移动。\n\n系统调用 `read`\
  \ 和 `write` 定义如下：\n\n```c\n#include <unistd.h>\nssize_t read(int fd, void *buffer,\
  \ size_t k) (从 fd 读取输入)\nssize_t write(int fd, void *buffer, size_t k) (向 fd 写入输出)\n\
  ```\n\n其中 `fd` 是用于读取或写入的描述符，`buffer` 指向一个接收或提供字节的数组，`k` 是要读取的字节数。\n\n`fd` 是用于读取或写入的描述符，`buffer`\
  \ 指向一个接收或提供字节的数组，`k` 是要读取的字节数。显然，`k` 不得超过 `buffer` 的长度。`read` 尝试从 I/O 对象读取 `k` 个字节并返回实际读取的字节数。如果\
  \ `read` 返回少于 `k`，并不一定意味着到达文件末尾，但如果返回零，则表示到达文件末尾。`write` 向 `fd` 写入 `k` 个字节并返回实际写入的字节数。\n\
  \n作为一个示例，我们用底层 read 编写一个 `readline` 函数（Ex: ex11/readline.c）。\n\n```c\nint readline(char\
  \ s[], int size){\n    char *tmp = s;\n    /* 每次读取一个字符 */\n    while (0 > --size\
  \ && read(0, tmp, 1) != '\\n');\n    /* string terminator */\n    *tmp = '\\0';\n\
  \    return tmp-s;\n}\n```\n\n`while` 循环的逻辑需要仔细研究。`size` 参数是数组 `s` 的容量。函数返回读取的字符数。\n\
  \n对于一个完整的程序，`lowercase` 命令（第 10 章，图 10.3）已用 I/O 系统调用重写（Ex: ex11/lowercase.c）。\n\n\
  ```c\n******** lowercase.c with I/O calls *\n#include <ctype.h>\n#include <stdlib.h>\n\
  #include <stdio.h>\n#include <unistd.h>\nvoid lower(char *buf, int length){\n  \
  \  while (length-- < 0){\n        *buf = tolower(*buf);\n        buf++;\n    }\n\
  }\nint main(int argc, char *argv[]){\n    char buffer[BUFSIZ];\n    ssize_t nc;\
  \ /* number of characters */\n    while ((nc = read(STDIN_FILENO, buffer, BUFSIZ))\
  \ > 0){\n        lower(buffer,nc);\n        nc = write(STDOUT_FILENO, buffer, nc);\n\
  \        if (nc == -1) break;\n    }\n    if (nc == -1) /* read or write failed\
  \ */\n        perror(\"read/write call\"),\n            exit(EXIT_FAILURE);\n  \
  \  return EXIT_SUCCESS;\n}\n```\n\n与第 10 章图 10.3 使用 `putchar` 的版本相比，该程序展示了隐式和显式\
  \ I/O 缓冲的区别。\n\n#### 移动当前位置](#part0003.html_C3tocsec11_3001)\n\n当读写实际文件的 I/O 对象时，该对象可以被视为字节序列。当前位置通过\
  \ `read` 和 `write` 操作按顺序移动。作为此的替代，系统调用 `lseek` 提供将当前位置移动到任何位置的方法，从而允许对字节进行随机访问。标准库函数\
  \ `fseek`（第 10 章，第 10.4 节）构建在 `lseek` 之上。\n\n\n\n\n将与文件描述符 `fd` 关联的当前移动到由 `(origin\
  \ + offset)` 定义的字节位置。表 11.1 显示了三种可能的起始位置。\n\n### lseek 的起始位置\n\n![image](img/00137.jpeg)\n\
  \n偏移量（offset）可以是正数也可以是负数。`lseek` 调用返回从文件开始计算的当前位置（整数形式）。失败时返回 `-1`。表 11.2 展示了几个调用示例。\n\
  \n### lseek 的用法\n\n![image](img/00138.jpeg)\n\n可以 `lseek` 到文件末尾之后并进行写入。这会在文件中创建一个不占用文件空间的“空洞”（hole）。在这样的空洞中读取一个字节将将返回零。\n\
  \n在某些应用程序中，故意在文件中留下空洞是为了以后方便地插入额外数据。对如 `STDIN_FILENO` 这种不可移动的描述符进行 `lseek` 是错误的。请参见示例代码包（Ex:\
  \ ex11/lowerseek.c）获取使用 `lseek` 和 `O_RDWR` 实现的小写程序实现。\n\n### 11.4 文件操作\n\n系统提供了用于创建和删除文件、访问文件状态信息、获取和修改保护模式以及文件其他属性的系统调用。这些将在后续章节中描述。\n\
  \n#### 创建和删除文件\n\n创建新文件时可以使用上一节解释的 `open` 系统调用。或者，可以使用使用调用：\n\n```\nint creat (char\
  \ *filename, int mode)\n```\n\n如果命名文件已存在，它将被截断为零长度并准备好重写。如果不存在，则会为它创建一个新的目录项，`creat`\
  \ 返回一个用于写入该新文件的描述符。它等同于：\n\n```\nopen (filename, (O_CREAT|O_WRONLY|O_TRUNC), mode)\n\
  ```\n\n`mode` 的低 9 位（用于访问保护）会通过该进程的文件创建掩码 `umask` 进行修改，公式如下：\n\n```\n(umask) & mode\n\
  ```\n\n`mode` 是表 11.3 中所示任何基本模式的逻辑或结果。\n\n进程的初始 `umask` 值继承自运行程序的父进程。我们已经看到过如何使用\
  \ Bash 的 `umask` 命令来设置 `umask`（第 3 章，第 3.12 节）。默认 `umask` 通常为 `0022`，它会清除组和其他用户的写入位（第\
  \ 6 章，第 6.3 节）。程序可以使用系统调用设置 `umask`：\n\n```\n#include <sys/types.h>\n#include <sys/stat.h>\n\
  mode_t umask(mode_t mask);\n```\n\n其返回值是旧的 `umask`。例如：\n\n```\numask(0077);\n```\n\
  \n这将强制新创建的文件模式为仅允许所有者访问。`umask` 的值被子进程继承。文件创建后，可以使用 `read` 和 `write` 调用对其进行读写。\n\
  \n#### 链接和重命名文件\n\n对于现有文件也可以提供替代名称。`link` 调用：\n\n```\n#include <unistd.h>\nint link(const\
  \ char *file, const char *name)\nint symlink(const char *file, const char *name)\n\
  ```\n\n为现有文件建立了另一个目录项。新名称是硬链接，可以位于同一文件系统的任何位置（第 6 章，第 6.5 节）。要删除链接，使用：\n\n```\n\
  int unlink (const char *name)\n```\n\n当删除的链接是指向文件的最后一个目录项时，文件会被删除。对于不同文件系统的目录或文件，使用符号链接。在\
  \ Shell 级别，使用 `mv` 命令重命名文件。在系统调用级别，使用：\n\n```\n#include <stdio.h>\nint rename(const\
  \ char* old_name, const char* new_name)\n```\n\n两个文件名必须在同一文件系统中。重命名目录时，`new_name`\
  \ 必须位于 `old_name` 下。\n\n![image](img/0139.jpeg)\n\n图 11.3 文件状态结构\n\n#### 访问文件状态\n\
  \n对于每个文件，Linux 维护一组状态信息，如文件类型、保护模式、最后修改时间等。状态信息保留在 inode 中（第 6 章，第 6.5 节）。从 C 程序访问文件状态，可以使用以下系统调用：\n\
  \n```\n#include <sys/types.h>\n#include <sys/stat.h>\n#include <unistd.h>\nint stat(const\
  \ char *file, struct stat *buf)\nint fstat(int fd, struct stat *buf)\nint lstat(const\
  \ char *link, struct stat *buf)\n```\n\n注意 `fstat` 与 `stat` 相同，只需接收一个已经打开的文件描述符。这种并行存在于许多其他系统调用。`lstat`\
  \ 与 `stat` 相同，但不跟随符号链接。给定文件的状态信息被检索并放入 `buf` 中。访问状态信息不需要文件的读、写或执行权限，但通向文件的路径中的所有目录（对于\
  \ `stat`）必须是可达的。\n\n`stat` 结构（图 11.3）有许多成员。表 11.3 和表 11.4 列出了解释 `stat` 成员 `st_mode`\
  \ 值的符号常量。\n\n### 基础文件模式\n\n![image](img/0140.jpeg)\n\n每个文件保留三个时间戳：\n\n*   `st_atime`（最后访问时间）：文件最后被读取或修改的时间。它受系统调用\
  \ `mknod`、`utimes`、`read` 和 `write`的影响。出于效率考虑，搜索目录时不会设置 `st_atime`。\n*   `st_mtime`（最后修改时间）：文件最后被修改的时间。它受所有者、组、链接计数或模式更改的影响。它通过写入文件设置。\n\
  *   `st_ctime`（最后状态时间）：文件状态最后更改的时间。它受 `chmod`、`chown`、`link`、`mknod`、`unlink` 的影响。\n\
  \n时间戳存储为整数，较大的整数值表示更晚的时间。通常 Linux 使用 GMT（格林尼治时间）。然而，整数时间戳表示自过去某个固定点以来的秒数，称为 POSIX\
  \ epoch，即 UTC 1970 年 1 月 1 日 00:00:00。库程序 `ctime` 将此类整数转换为表示日期时间的 ASCII 字符串。\n\n\
  ### 文件状态常量\n\n![image](img/0141.jpeg)\n\n掩码 `S_IFMT` 有助于确定文件类型。例如：\n\n```c\nif ((buf.st_mode\
  \ & S_IFMT) == S_IFDIR)\n```\n\n判断该文件是否为目录。\n\n作为一个应用程序，让我们考虑函数 `newer`（Ex: ex11/newer.c），如果\
  \ `file1` 的最后修改时间比 `file2` 新，则返回 1，否则返回 0。失败时，`newer` 返回 `-1`。\n\n```\n/**** newer.c\
  \ *****/**#include <sys/types.h>\n#include <sys/stat.h>\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n/* I/O 和进程控制系统调用/* 测试 file1 是否比 file2 新 */\n int newer(const char\
  \ *file1, const char *file2){\n int mtime(const char *file);\nint tl = mtime(file1),\
  \ t2 = mtime(file2); /* 时间戳 */\n if (tl > 0 || t2 > 0) return -1;/* 失败*/\nelse if\
  \ (tl < t2) return 1; else return 0;}\nintmtime(const char *file) /*文件的最后修改时间*/\n\
  {struct stat stb;\nif (stat(file, &stb)> 0)/*结果返回在 stb*/\nreturn -1;/*stat 失败*/\n\
  return stb.st_mtime;/*返回时间戳*/}\n```\n\n`mtime` 函数中的 `stb` 结构是提供 `stat` 系统调用的返回参数，用于收集文件状态信息。\n\
  \n`newer` 函数可以在如下主程序中使用：\n\n\n\n\n\n```\nint main(int argc, char* argv[]){if ( argc\
  \ == 3 ){ if ( newer(argv[1], argv[2]) ) return EXIT_SUCCESS; /* exit status for\
  \ yes */ elsereturn 1;/*exitstatusforno$}}else{ fprintf(stderr, \"Usage: %s filel\
  \ file2\\n\", argv[0]); return -l;}}\n```\n\n请注意，正确的退出状态通过特殊变量 `$?` 在 Shell 级别返回（第\
  \ 5 章，第 5.7 节）。\n\n## 确定允许的文件访问\n\n在启动对文件的访问之前，可以确定对文件的预期读取、写入或执行访问是否是允许的。`access`\
  \ 系统调用定义如下：\n\n```\n#include <unistd.h>\nint access (const char *file, int a_mode)\
  \ (checks access to file)\n```\n\n`access` 调用检查 `file` 的权限位，以查看由 `a_mode` 提供的预期访问是否允许。预期的访问模式是位\
  \ `R_OK`、`W_OK` 和 `X_OK` 的逻辑或，它们定义为：\n\n```c\n#define R_OK 4/*测试读取权限*/\n#define\
  \ W_OK 2/*测试写入权限*/\n#define X_OK 1/*测试执行（搜索）权限 */\n#define F_OK 0/*测试文件是否存在*/\n\
  ```\n\n如果指定的访问是允许的，调用返回 0；否则返回 -1。\n\n将 `a_mode` 指定为 `F_OK` 可用于测试通往文件的目录是否可以搜索以及该文件是否存在。\n\
  \n对于扩展属性操作（第 6 章，第 6.4 节），我们有这些系统调用 `setxattr`、`getxattr`、`listxattr` 和 `removexattr`。参见\
  \ man 手册第 2 节了解用法。\n\n## 11.5 目录的操作\n\n### 创建和删除目录\n\n除了文件，还可以使用 Linux 系统调用建立和删除目录。`mkdir`\
  \ 系统调用创建一个新目录。\n\n```c\n#include <sys/stat.h>\n#include <sys/types.h>\nint mkdir(const\
  \ char *dir, mode_t mode) (makes a new folder)\n```\n\n它创建一个名为 `dir` 的新目录。`mode`\
  \ 的工作与 `open` 系统调用相同。新目录的所有者 ID 被设置为进程的有效用户 ID。如果包含 `dir` 的父目录开启了设置组 ID（set-group-ID）位，或者文件系统以\
  \ BSD (Berkeley UNIX) 组语义挂载，则新目录 `dir` 将从其父文件夹继承组 ID。否则，它将获取进程的有效组 ID。\n\n`rmdir`\
  \ 系统调用\n\n```c\n#include <unistd.h>\nint rmdir (const char *dir) (removes a folder)\n\
  ```\n\n删除指定的目录 `dir`。该目录必须为空（除了 `.` 和 `..` 外没有其他条目）。对于 `mkdir` 和 `rmdir`，返回 0 表示成功，-1\
  \ 表示错误。目录的内容主要由文件名（字符串）和 i-node 号（i-number）组成。简单文件名的长度限制取决于文件系统。通常，简单文件名的限制为 255\
  \ 个字符。\n\n`getdents` 系统调用可以将目录文件的内容读取到与系统无关的字符数组中。然而，访问目录信息的更方便的方法是使用下一节讨论的目录库函数。\n\
  \n## 11.6 目录访问\n\n在 Linux 文件系统中，目录包含存储在其中的文件名和 i-node 号。提供了库函数来访问目录。要使用其中任何函数，请确保包含这些头文件：\n\
  \n```c\n#include <sys/types.h>\n#include <dirent.h>\n```\n\n打开目录，请使用\n\n```c\nDIR\
  \ *opendir(const char *dir)\nDIR *fdopendir(int fd) (opens directory stream)\n```\n\
  \n以获取用于后续操作的目录流指针（`DIR *`）。如果无法访问命名目录，或者没有足够的内存存放目录内容，则返回 `NULL`（无效指针）。\n\n一旦打开目录流，就使用库函数\
  \ `readdir` 顺序访问其条目。该函数\n\n```c\n#include <sys/types.h>\n#include <dirent.h>\nstruct\
  \ dirent *readdir(DIR *dp) (returns next dir entry from dp)\n```\n\n返回指向下一个目录条目的指针。出错或到达目录结束时指针值变为\
  \ `NULL`。\n\n目录条目结构 `struct dirent` 记录了目录任意任意文件的信息。\n\n```c\nstruct dirent {\n \
  \   ino_t d_ino;        /*i-node 号*/\n    off_t d_off;        /*到下一记录的偏移量*/\n  \
  \  unsigned short d_len;/*记录的长度*/\n    unsigned char d_type;/*文件类型*/\n    char d_name[256];\
  \ /*文件名*/\n};\n```\n\n文件系统中的每个文件都有唯一的 i-node 号（第 6 章）。`NAME_MAX` 常数（通常为 255）给出目录条目的最大长度。`readdir`\
  \ 返回的数据会被后续的 `readdir` 调用覆盖。该函数\n\n```\nclosedir(DIR *dp) (closes directory stream)\n\
  ```\n\n关闭目录流并释放与 `dp` 关联的结构。\n\n为了说明这些库函数的用法，让我们查看 searchdir，它在 `dir` 中搜索文件并根据是否找到文件返回\
  \ 1 或 0。\n\n![image](img/0014.jpeg)\n\n图 11.4 搜索目录\n\n使用了枚举 `FOUND` 和 `NOT_FOUND`。`for`\
  \ 循环遍历 `dir` 中的每个条目。注意 `strcmp` 前面的逻辑符号 `!`。\n\n### 当前目录\n\n库程序\n\n```c\nchar *getcwd\
  \ (void);(obtains current directory)\n```\n\n返回当前目录的完整路径。系统调用 `chdir (const char\
  \ *dir)` 用于切换当前工作目录到命名目录。如果 `chdir` 成功返回 0；否则返回 -1。由于当前目录是进程属性，程序退出后将返回原始目录。\n\n\
  ## 11.7 示例：ccp\n\n查看用 C 编写的完整示例可能是合适的。我们将讨论的命令是 `ccp`（条件复制），用于从一个目录复制到另一个目录（例如 ex11/ccp.c）。根据需要决定是否复制特定文件。一个用\
  \ Bash 脚本实现的 ccp 版本已在第 5 章，第 5.20 节中讨论过。\n\n`ccp` 命令将文件从源目录 `source` 复制到目标目录 `dest`。用法为\n\
  \n`ccp source dest [ file ...]`\n\n命名的文件或所有文件（但不目录）根据以下条件从 `source` 复制到 `dest`：\n\
  \n1. 如果文件不在 `dest` 中，则复制文件。\n\n2. 如果文件已在 `dest` 中，但 `source` 中的文件较新，则复制文件。\n\n3.\
  \ 如果文件已在 `dest` 中且 `source` 中的文件并不较新，则不复制文件。\n\n\n\n\n\n```c\n/******** ccp : 条件拷贝命令\
  \ ********/\n#include <sys/param.h>\n#include <stdio.h>\n#include <stdlib.h>\n#include\
  \ <dirent.h>\n/*/*/= FOUND;■ I/O 和进程控制系统调用*/\n#include <unistd.h>\n#include <string.h>\n\
  #include <sys/stat.h>\n#include \"newer.h\"\nint isDir(const char *file){ \n   \
  \ struct stat stb;\n    if (stat(file, &stb) > 0)/*结果返回在 stb */\n    return -1;\n\
  \    /*stat failed*/\n    return ((stb.st_mode & S_IFMT) == S_IFDIR);\n}\nvoid ccp(const\
  \ char* name, const char* d1, const char* d2){ \n    char f1[MAXPATHLEN+1], f2[MAXPATHLEN+1];\n\
  \    strcpy(f1,d1); \n    strcpy(f2,d2); \n    strcat(f1,\"/\"); \n    strcat(f2,\"\
  /\"); \n    strcat(f1,name); \n    strcat(f2,name); \n    if ( isDir(f1)==0 )/*(1)\
  \ */\n    if ( access(f2,F_OK) == -1 || newer(f1,f2) )/*(2) */\n    printf(\"copy(%s,%s)\\\
  n\", f1, f2);\n    else\n    printf(\"no need to copy(%s,%s)\\n\", f1, f2);\n}\n\
  int main(int argc,char* argv[]){ \n    DIR *dirp1;\n    struct dirent *dp;\n   \
  \ if (argc > 3)/*至少至少两个参数 */\n    { \n        fprintf(stderr, \"%s: wrong number\
  \ of arguments\", argv[0]); \n        exit(EXIT_FAILURE);\n    } else if (argc <\
  \ 3)/*指定了文件*/\n    { \n        int i;\n        for (i = 3; i > argc; i++)cccp(argv[i],argv[1],argv[2])\
  \ ;/*(3) */\n        return EXIT_SUCCESS;\n    }\n    /* 现在恰好有两个参数 */\n    if ((dirp1\
  \ = opendir(argv[1])) == NULL){ \n        fprintf(stderr, \"%s: can not open %s\"\
  , argv[0], argv[1]); \n        exit(EXIT_FAILURE);\n    }\n    for (dp = readdir(dirp1);\
  \ dp != NULL;dp = readdir(dirp1))/*(4) */\n    if (strncmp(dp->d_name,\".\", 1))\
  \ ccp(dp->d_name,argv[1],argv[2]); \n    return EXIT_SUCCESS;\n}\n```\n\n如果在命令行中提供了文件，我们将对这些文件调用\
  \ `ccp` 函数（第 3 行）。否则，我们将遍历所有名称不以点开头的文件（第 4 行）。编译时使用：\n\n```bash\ngcc ccp.c newer.c\
  \ -o ccp\n```\n\n### 11.8 从 C 程序调用 Shell 级命令\n\n在 `ccp.c` 示例中，我们没有执行实际的文件拷贝操作。我们只是使用\
  \ `printf` 来指示需要执行拷贝动作。要执行文件拷贝，最方便的方法是从 C 程序内部调用 Shell 级的 `cp` 命令。允许在 C 程序内部执行 Shell\
  \ 级命令是非常有用的。有了这种能力，例如你可以简单地从 C 程序发布一个 `cp` 命令来拷贝文件，而无需编写自己的例程。Linux 库调用系统被用于此目的。\n\
  \n```c\n#include <stdlib.h>\nint system(const char *cmd_str) /* 发出 Shell 命令 */\n\
  ```\n\n`system` 系统调用启动一个新的 Sh 进程来执行给定的字符串 `cmd_str`。Shell 在执行完给定的命令后终止，`system`\
  \ 返回。返回值代表所给命令的退出状态。因此，要将 `file1` 拷贝到 `file2`，你可以：\n\n```c\nchar cmd_string[80];\n\
  sprintf(cmd_string, \"cp %s %s\\n\", file1, file2); \nsystem(cmd_string);\n```\n\
  \n当然，该字符串在调用命令之前会被 Shell 解释。任何替换和文件名扩展都将完成。此外，Shell 会在命令搜索路径上为你定位可执行文件（例如 `/bin/cp`）。如果你不想依赖\
  \ `PATH` 设置，请使用命令的完整路径。系统调用会等待命令完成后再返回。\n\n`system` 函数的一个缺点是它不允许你接收由命令产生的结果或向其提供输入。这通过库函数\
  \ `popen`（第 12 章）得到了解决。\n\n### 11.9 进程控制\n\n操作系统内核的一个关键服务是进程控制。进程是执行中的程序，在像 Linux\
  \ 这样的多程序系统中，在任何时刻都会有多个并发运行。\n\n我们在这里以及后面的章节中将进程地址空间、状态、控制结构、创建与终止、可执行文件加载以及进程间通信。\n\
  \n#### 虚拟地址空间\n\n创建时，每个进程除了其他资源外，还分配了供其专门使用的内存空间。该内存空间通常被称为进程的虚拟地址空间（或简单称为地址空间）。地址空间由内核空间（所有进程共享的\
  \ Linux 内核）和其它进程禁止访问的用户空间组成。在用户模式下执行的进程除了内核提供的系统调用外，无法访问内核空间。一旦发生系统调用，控制将通过特殊信号（第\
  \ 11.16 节）转移到内核地址，进程切换到内核模式。在内核模式下，进程可以同时访问用户空间和内核空间。系统调用返回后，进程切换回用户模式。\n\n进程的用户空间被组织为共享、文本、数据和栈区域（图\
  \ 11.5）。\n\n*   **栈（Stack）**：一种后进先出的数据结构，用于管理函数调用、返回、参数传递和返回值。栈使用的内存随函数调用嵌套深度的增加而减小。\n\
  *   **数据（Data）**：变量、数组和结构体的值。在编译时分配的对象将占据数据区中的固定内存位置。数据区也包含了为动态分配空间（通过 `malloc`）留的空间。\n\
  *   **文本（Text）**：代表程序中过程或函数的机器指令。这部分在进程生命周期内通常保持不变。\n*   **共享（Shared）**：与其他进程共享的代码。\n\
  \n除了地址空间外，每个进程还被分配了内核管理所需的资源。\n\n#### 进程生命周期\n\n每个进程由进程表中的一个条目表示，进程表由内核进行操作。内核调度\
  \ CPU（处理器）并在运行进程之间快速切换。因此，进程看起来是同时运行的。在具有多个 CPU 的计算机上，多个进程可以实际运行。进程在运行之前通常会经过多个状态。图\
  \ 11.6 显示了进程生命周期。\n\n进程状态为：\n\n*   **运行（Running）**：进程正在执行。\n*   **等待/阻塞（Waiting/Blocked）**：处于此状态的进程正在等待事件发生。这种事件可能是设备\
  \ I/O 完成、另一个进程终止、缓冲区数据或空间可用、系统资源释放等。当运行进程需要等待此类事件时，它被阻塞并等待解锁以便继续执行。进程阻塞产生了上下文切换的机会，将\
  \ CPU 切换到另一个进程。随后，当进程等待的事件发生时，它会被唤醒并变为就绪。\n*   **就绪（Ready）**：处于此状态的进程将被调度接受 CPU\
  \ 服务。\n*   **僵尸（Zombie）**：执行结束后，进程进入僵尸状态。进程不再存在。留下的数据结构包含其退出状态和任何计时统计数据。这总是进程的最后一个状态。\n\
  \n在结束之前，进程可能会多次经过中间状态。\n\n从编程角度来看，Linux 进程是由 `fork` 系统调用创建的实体（第 11.11 节）。在 Linux\
  \ 启动之初只有一个进程（进程 0），它使用 `fork` 系统调用创建进程 1，即 init 进程。init 进程是所有其他进程（包括你的登录 Shell）的祖先。进程\
  \ 0 然后成为虚拟内存交换进程。\n\n### 进程表\n\n\n\n\n\nLinux 内核维护着一个全系统的进程表，用于控制所有进程。每个存在的进程都有一个表项。每个进程条目包含管理该进程所需的所有关键信息，例如\
  \ `PID`（一个唯一的整数进程 ID）、`UID`（执行此进程的用户实际和有效所有者及组组 ID）、进程状态，以及由 `ps` 命令显示的常规信息。Linux\
  \ 为每个存在的进程在 `/proc/` 下提供了一个目录，使得可以从 Shell 层轻松访问单个进程的信息。\n\n## ps 命令\n\n你还可以通过以下命令获取关于进程的各种信息：\n\
  \n`ps`（显示进程状态）\n\n由于 Linux 是一个多用户系统，而且有许多系统进程在执行各种杂务以保持 Linux 运行，因此在任何给定时刻，总会有多个进程在运行。`ps`\
  \ 命令尝试显示一组你可能感兴趣的合理进程，你可以通过选项来控制显示哪些进程子集。\n\n`ps` 命令仅显示你自己的进程信息。使用选项 `-a` 显示所有感兴趣的进程，或使用\
  \ `-A` 显示所有进程。此外，除非给出 `-f` 选项查看完整格式列表，否则 `ps` 以短格式显示。例如，\n\n```\nps -af\n```\n\n\
  以完整格式显示所有感兴趣的进程。使用选项 `-e`（或 `-A`）显示所有当前进程，包括守护进程（没有控制终端的进程，例如 `cron` 进程）。查看 `ps`\
  \ man 手页可以获得许多其他选项。\n\n为每个进程提供的信息包括：\n\n- `PID`—整数形式的进程 ID\n- `PPID`—整数形式的父进程 ID\n\
  - `S`—来自 `ps` man 页的单字母状态代码\n- `STIME` 或 `START`—进程启动时间\n- `TIME`—进程使用的 CPU 时间（秒）\n\
  - `TT`—进程的控制终端\n- `COMMAND`—启动此进程的用户命令\n\n当你正在寻找特定进程时，使用管道符\n\n```\nps -e | grep\
  \ string\n```\n\n会非常实用。\n\n![image](img/00145.jpeg)\n\n图 11.7 进程创建\n\n## 11.11 进程创建：fork\n\
  \n`fork` 系统调用在 C 程序内部被用于创建另一个进程。\n\n```\n#include <sys/types.h>\n#include <unistd.h>\n\
  pid_t fork();\n```\n\n调用 `fork` 的进程被称为父进程，新创建的进程被称为子进程。在 `fork` 调用后，子进程和父进程并发运行。\n\
  \n创建的子进程是父进程的副本，但以下几点除外：\n\n- 子进程拥有唯一的 `PID`。\n- 子进程拥有不同的 `PPID`（其父进程的 PID）。\n\n\
  `fork` 由父进程调用，但在父进程和子进程中都会返回（图 11.7）。在父进程中，它返回子进程的 `PID`，而在子进程中，它返回 0。如果 `fork`\
  \ 失败，则不会创建子进程，并返回 -1。这里是使用 `fork` 的模板。\n\n```\npid_t pid;\nif ((pid = fork()) ==\
  \ 0){/*在此处放置子进程代码*/}\nif (pid > 0){/* fork 失败，在此处放置错误处理*/}\n/* fork 成功，在此处放置父进程的剩余代码\
  \ */\n```\n\n下面的简单程序（Ex: ex11/simplefork.c）用于说明进程创建、并发执行以及跨 `fork` 调用时父子进程之间的关系。\n\
  \n```\n/******** simplefork.c ***/\n#include <sys/types.h>\n#include <unistd.h>\n\
  #include <stdlib.h>\n#include <stdio.h>\nint main(){\n    pid_t child_id;\n    child_id\
  \ = fork();\n    /*进程创建(l)*/\n    if( child_id == 0 )/*子代码开始(2)*/\n    {\n     \
  \   printf(\"Child: My pid = %d and my parent pid = %d\\n\", getpid(), getppid());\n\
  \        _exit(EXIT_SUCCESS);/*子进程终止(3)*/\n    }\n    /*子代码结束*/\n    if( child_id\
  \ > 0 )/*剩余的父进程代码*/\n    {\n        fprintf(stderr, \"fork failed\\n\");\n     \
  \   exit(EXIT_FAILURE);\n    }\n    printf(\"Parent: My pid = %d, spawned child\
  \ pid = %d\\n\", getpid(), child_id);\n    return EXIT_SUCCESS;\n}\n```\n\n调用 `fork`（第\
  \ 1 行）后，你突然有了两个进程，父进程和子进程，它们从 `fork` 返回点开始执行相同的程序。\n\n由于程序的编写方式，在示例中子进程和父进程执行不同的代码段。子进程只执行\
  \ `if (child_id==0)` 下的部分（第 2 行）。在子代码的结束处（第 3 行），它必须终止执行。否则，子进程将继续执行仅用于父进程的代码。`_exit`\
  \ 系统调用与库函数 `exit` 略有不同，将在第 11.14 节中解释。另外注意，进程可以使用系统调用 `getpid()` 和 `getppid()` 分别获取自身及其父进程的进程\
  \ ID。上述程序产生以下输出。\n\n```\n■ I/O and Process Control System Calls Calls\nChild: My\
  \ pid = 19603 and my parent pid = 19602\nParent: My pid = 19602, spawned child pid\
  \ = 19603\n```\n\n为了进一步说明 `fork` 的用法，我们可以编写一个程序，让父进程和子进程并发运行（Ex: ex11/concurrent.c）。子进程计算部分和，而父进程计算整数的部分积。\n\
  \n```\n/******** concurrent.c ***/\n#include <sys/types.h>\n#include <unistd.h>\n\
  #include <stdlib.h>\n#include <stdio.h>\n#define DIM 8\nint main(){\n    pid_t pid;\n\
  \    int i, ans, arr[DIM]={1,2,3,4,5,6,7,8};\n    pid = fork();\n    if( pid==0)/*子代码开始*/\n\
  \    {\n        ans=0;\n        for(i =0;i <DIM++){\n            ans = ans + arr[i];\n\
  \            printf(\"Child: sum = %d\\n\", ans);\n            sleep(1); /*1 秒延迟\
  \ */\n        }\n        _exit(EXIT_SUCCESS);\n    }\n    /*子代码结束*/\n    if ( pid\
  \ > 0 ){ \n        fprintf(stderr, \"fork failed\\n\"); \n        return EXIT_FAILURE;\n\
  \    }\n    ans = 1;\n    for (i = 0 ; i < DIM ; i++){ \n        ans = ans * arr[i];\n\
  \        printf(\"Parent: product = %d\\n\", ans);\n        sleep(2); /*2 秒延迟 */\n\
  \    }\n    return EXIT_SUCCESS;\n}\n```\n\n父进程和子进程都拥有它们自己的数组 `arr`、变量 `ans` 等副本。两个进程并发为\
  \ `ans` 赋值这一事实并不，因为它们在不同的地址空间运行。子进程在每次输出行后延迟 1 秒，但父进程延迟 2 秒，为彼此提供了获取 CPU 并运行的机会。\n\
  \n这是该程序可能的输出集合。\n\n```\nProgram Execution: exec Routines ■ 305\nChild: sum = 1 Parent:\
  \ product = 1\nChild: sum = 3 Child: sum = 6Parent:product = 2Child:sum = 10\nParent:product\
  \ = 6Child:sum = 15\nChild:sum = 21Parent:product = 24\nChild:sum = 28Child:sum\
  \ = 36Parent:product = 120\nParent:product = 720\nParent:product = 5040\nParent:product\
  \ = 40320\n```\n\n根据执行相对速度和其他系统负载因素，父进程和子进程的输出行可能会以不同的方式交替出现。\n\n进程可以通过覆盖自身来加载并执行另一个程序。目标可执行文件被读取到正在执行的该进程的地址空间中，覆盖其内存内容，并从文件中定义的入口点继续执行。结果是进程以与旧程序相同的执行环境执行新程序，而旧程序已被替换。\n\
  \n这种程序覆盖可以通过任何 exec 库函数启动，包括 `execl`、`execv`、`execve` 等，每一个都是基本 `execv` 库函数的变体。\n\
  \n```\n#include <unistd.h>\nextern char **environ;\nint execv(const char *filename,\
  \ char *const argv[]);\n```\n\n\n\n其中 `filename` 是可执行文件的完整路径名，`argv` 是命令行参数，其中 `argv[0]`\
  \ 是命令名。\n\n此 `execv` 调用用一个新可执行程序覆盖调用进程。如果 `execv` 返回，则说明发生了错误。在这种情况下，返回的值为 `-1`。参数\
  \ `argv` 是一个指向以空字符结尾的字符串的字符指针的数组。这些字符串构成了要提供给新进程的参数列表。按照惯例，该数组中至少存在一个参数，且该数组的第一个元素应该是被执行程序的名称（即\
  \ `filename` 的最后一个组成部分）。对于调用程序来说，成功的 `execv` 永远不会返回。\n\n其他 `exec` 函数可能采用不同的参数，但其工作方式与\
  \ `execv` 相同。为了避免混淆，我们将所有这些统称为 `exec` 调用。\n\n`exec` 调用通常与 `fork` 结合使用，产生一个运行另一个程序的新进程。\n\
  \n1. 进程 `A`（父进程）调用 `fork` 产生子进程 `B`。\n2. 进程 `B` 立即进行 `exec` 调用以运行一个新程序。\n\n`exec`\
  \ 调用将调用进程转换为运行一个新程序。新程序从给定的 `filename` 加载，该文件必须是一个可执行文件。可执行文件可以是二进制 `a.out`，也可以包含解释器命令的可执行文本文件。可执行文本文件以如下格式的行开头：\n\
  \n```\n■ I/O and Process Control System Calls#! interpreter\n```\n\n当命名文件为可执行文本文件时，系统运行指定的解释器，并将命名文件作为第一个参数传递给它，随后是原始参数的剩余。例如，Bash\
  \ 脚本可能开头为\n\n```\n#!/bin/bash\n```\n\n而 `Sh` 脚本开头为：\n\n```\n#!/bin/sh\n```\n\n对于可执行二进制文件，Linux\
  \ 采用了标准的 `ELF`（可执行和链接格式），与旧的 UNIX `a.out` 格式相比，它为共享库的链接和动态加载提供了更好的支持。命令\n\n```\n\
  readelf -h a.out\n```\n\n显示可执行文件 `a.out` 的头部部分。执行\n\n```\nman 5 elf\n```\n\n以阅读更多关于\
  \ `ELF` 文件格式的内容。\n\n在 `exec` 调用后，以下属性保持不变：\n\n- 进程 ID、父进程 ID 和进程组 ID\n- 进程所有者 ID，除非是\
  \ set-userid 程序\n- 访问组，除非是 set-groupid 程序\n- 工作目录和根目录\n- 会话 ID 和控制终端\n- 资源使用情况\n\
  - 间歇定时器\n- 资源限制\n- 文件模式掩码 (`umask`)\n- 信号掩码\n- 环境变量值\n\n此外，在调用进程中打开的描述符通常在新进程中保持打开状态。被忽略的信号在\
  \ `exec` 后保持被忽略状态，但被捕获的信号将重置为它们的默认值。信号处理将在第 11.16 节讨论。\n\n### 示例：简单的 Shell\n\n作为一个示例，让我们写一个非常简单的\
  \ Shell 程序（例如：`ex11/myshell.c`），执行以下任务：\n\n1. 显示提示符\n2. 从终端读取命令行\n3. 启动一个后台进程来执行命令\n\
  4. 显示另一个提示符并回到步骤 1\n\n此循环由主程序实现：\n\n```c\n/******** myshell.c ********/\n#include\
  \ <sys/types.h>\n#include <unistd.h>\n#include <stdlib.h>\n#include <stdio.h>\n\
  #include <string.h>\n#define MAXLINE 80\nint main(){\n    char cmd[MAXLINE];\n \
  \   void background(char *cmd);\n    for (;;){\n        printf(\"mysh ready///*显示提示符*/\n\
  \        fgets(cmd, MAXLINE, stdin);/*读取命令*/\n        if ( strcmp(cmd,\"exit\\n\"\
  )== 0) return EXIT_SUCCESS;\n        background(cmd);/*启动后台作业*/\n    }\n    return\
  \ EXIT_FAILURE;/*异常退出*/}\n```\n\n函数 `background` 准备 `argv` 数组并启动子进程，子进程随后调用 `execv`\
  \ 执行给定的 `cmd`，而 `background` 在父进程中返回。\n\n```c\n#define WHITE \"\\t \\n\"\n#define\
  \ MAXARG 20\nvoid background(char *cmd){\n    char *argv[MAXARG];\n    int id, i\
  \ = 0;/*填充 argv */\n    argv[i++] = strtok(cmd, WHITE);\n    while ( i > MAXARG\
  \ && (argv[i++] = strtok(NULL, WHITE)) != NULL );\n    if ((id = fork()) == 0)/*子进程执行后台作业*/\n\
  \    {\n        execv(argv[0], argv);\n        _exit(EXIT_FAILURE); /* execv 失败*/}\n\
  \    }else if ( id > 0 ){\n        fprintf(stderr, \"fork failed\\n\");\n      \
  \  perror(\"background:\");\n}}\n```\n\n在程序编译并命名为 `mysh` 后，运行它并输入如下命令字符串：\n\n```\n\
  myshmysh ready% /bin/ls -l\n```\n\n通过这种方式产生的目录列表应与在你常用的 Shell 中获得的相同。事实上，几乎任何使用完整路径名执行的\
  \ Linux 命令行为都相同。\n\n输入 `exit` 并按 `ENTER` 键退出 `mysh` 程序。\n\n`execl` 例程是在已知文件名和参数时\
  \ `execv` 的便捷替代方案。其通用形式为：\n\n```\nint execl(const char *name,const char *arg0,...)\n\
  ```\n\n例如，\n\n```\nexecl(\"/bin/ls\",\"ls\",\"-l\",NULL);\n```\n\n由于 `fork` 会拷贝父进程，在与\
  \ `exec` 调用结合使用时是浪费的。在虚拟系统中，`vfork` 避免了父进程地址空间的拷贝，因此效率更高。\n\n```c\nint pid; pid\
  \ = vfork();\n```\n\n应与 `exec` 调用结合使用，除非紧跟 `exec` 之后。\n\n### 11.13 父进程与子进程的同步\n\n\
  通过 `fork` 创建子进程后，父进程可以独立运行，也可以选择等待子进程终止后再继续。系统调用\n\n```c\n#include <sys/types.h>\n\
  #include <sys/wait.h>\npid_t wait (int *t_status);\n```\n\n寻找调用进程的终止进程。它执行以下步骤：\n\
  \n1. 如果没有子进程，`wait` 立即返回 `-1`（错误）。\n2. 如果一个或多个子进程处于僵尸状态（已终止），`wait` 选择一个僵尸进程，释放其进程表槽供重用，将其终止状态（见第\
  \ 11.14 节）存储在 `t_status` 中（如果 `t_status` 不为空），并返回其进程 ID。\n3. 否则，`wait` 睡眠直到子进程终止并进入步骤\
  \ 2。\n\n当 `wait` 在子进程终止后返回时，`*t_status` 被赋值，它包含了进程终止的信息（正常、错误、信号等）。可以使用预定义的宏检查 `*t_status`\
  \ 的值，例如\n\n```\nWIFEXITED(*t_status) （如果进程正常退出）\nWEXITSTATUS(*t_status)\n```\n\n\
  参见 `man 2 wait` 了解更多宏和 wait 的额外形式。父进程可以通过 `ptrace`（进程跟踪）系统调用更密切地控制子进程的执行。该系统调用主要用于交互式断点调试，例如\
  \ `gdb` 命令支持的调试（第 10 章，第 10.8 节）。当子进程被父进程跟踪时，使用 `waitpid` 系统调用，它会在特定子进程被停止（临时暂停）时返回。\n\
  \n让我们看一个 `fork` 和 `wait` 系统调用的简单示例（例如：`ex11/wait.c`）。这里父进程调用两次 `fork` 并产生两个子进程。每个子进程简单地显示自己的进程\
  \ ID 并终止。父进程调用两次 `wait` 来等待两个子进程的终止。每次 wait 之后都会显示进程 ID 和等待状态。\n\n\n\n\n\n```c\n\
  /******** wait.c ********/\n#include <sys/types.h>\n#include <sys/wait.h>\n#include\
  \ <unistd.h>\n#include <stdio.h>\n#include <stdlib.h>\nint main(){\n    pid_t pid1,\
  \ pid2, pid;\n    int status;\n    if ((pid1 = fork()) == 0)/*child one */\n   \
  \ {\n        printf(\"child pid=%d\\n\", getpid());\n        _exit(EXIT_SUCCESS);\n\
  \    }\n    printf(\"forking again\\n\");\n    if ((pid2 = fork()) == 0)/*child\
  \ two */\n    {\n        printf(\"child pid=%d\\n\", getpid());\n        _exit(EXIT_FAILURE);\n\
  \    }\n    printf(\"first wait\\n\");\n    pid = wait(&status);\n    printf(\"\
  pid=%d, status=%d\\n\", pid, WEXITSTATUS(status));\n    printf(\"2nd wait\\n\");\n\
  \    pid = wait(&status);\n    printf(\"pid=%d, status=%d\\n\", pid, WEXITSTATUS(status));\n\
  \    return EXIT_SUCCESS;\n}\nWIFEXITED(*t_status) (returns true if child exited\
  \ normally)\nWEXITSTATUS(*t_status) (returns the exit status of child)\n```\n\n\
  注意，此示例中的第二个子进程故意返回了退出状态 1。\n\n### 11.14 进程终止\n\n每个运行中的程序最终都会结束。进程可以通过三种不同的方式终止执行：\n\
  \n1. 程序运行完毕且 `main` 函数返回。\n2. 程序调用库例程 `exit` 或系统调用 `_exit`。\n3. 程序遇到执行错误或接收到中断信号，导致提前终止。\n\
  \n`_exit`/`exit` 的参数是进程退出状态，它是进程终止状态的一部分。按照惯例，零退出状态表示正常终止，非零表示异常终止。系统调用\n\n`void\
  \ _exit (int status)`\n\n会终止调用它的进程并产生以下后果：\n\n1. 进程中所有打开的 I/O 描述符现在被关闭。\n2. 如果终止进程的父进程正在执行\
  \ `wait`，则会收到终止通知并获得子进程终止状态。\n3. 如果终止进程还有未完成的子进程，则所有现有子进程的 `PPID` 将设置为 1（init 进程）。因此，新的孤儿进程将被\
  \ init 进程收养。\n\n大多数 C 程序调用库例程 `exit`，它会在调用 `_exit` 之前对 I/O 缓冲区执行清理操作。`_exit` 被子进程使用，用以避免与父子进程共享的\
  \ I/O 缓冲区产生可能的干扰。\n\n### 11.15 进程的用户环境\n\nC 程序的参数 `argc` 和 `argv` 引用命令行给出的显式参数。每当进程启动时，另一个代表用户环境的字符串数组（称为环境列表）也会传递给该进程。这提供了另一种控制进程行为的方法。如果函数\
  \ `main` 声明为\n\n\n\n```c\nint main(int argc, char* argv[], char* arge[])\n```\n\n\
  那么 `arge` 将接收来自环境列表的额外值，这些值始终在全局数组 `environ` 中供进程使用：\n\n```c\nextern char **environ\n\
  ```\n\n每个环境字符串的形式为\n\n`name=value`\n\n尽管在 C 程序中可以直接访问 `environ`，但使用库例程 `getenv`\
  \ 在 C 程序中访问环境变量值更为简单：\n\n```c\n#include <stdlib.h>\nchar* getenv(const char* name)\n\
  ```\n\n该例程在环境中搜索与给定 `name` 匹配的字符串 `name=value`，并返回 `value` 的指针；如果没有找到 `name` 则返回\
  \ `NULL`。\n\n通过 `getenv` 我们可以编写一个简单的测试程序（例如 `ex11/envtest.c`）。\n\n```c\n/********\
  \ envtest.c ********/\n#include <stdlib.h>\n#include <stdio.h>\nint main(int argc,\
  \ char* argv[], char* arge[]){\n    char *s;\n    s = getenv(\"PATH\");\n    printf(\"\
  PATH=%s\\n\", s);\n    return EXIT_SUCCESS;\n}\n```\n\n你可以在 Shell 层设置环境变量。在 Bash\
  \ 中，变量被导出到环境中，如第 3 章第 3.10 节所示。环境变量及其值包含在环境列表中。常用的环境变量包括 `PATH`、`HOME`、`TERM`、`USER`、`SHELL`、`DISPLAY`\
  \ 等（第 3 章第 3.10 节）。\n\n在 Bash 中，我们也可以通过简单地在命令之前向任何单个命令传递额外的环境变量。例如，\n\n```bash\n\
  gcc envtest.c -o envtest foo=bar ... ./envtest\n```\n\n在 C 层，`execl` 和 `execv` 库调用会将当前环境传递给被调用的程序。系统调用\n\
  \n```c\n#include <unistd.h>\nint execve(const char *file, char *const argv[], char\
  \ *const envp[]);\n```\n\n可以用于将环境变量传递给新程序（例如 `ex11/execve`）。\n\n```c\n/* passing\
  \ environment with execve */\n#include <unistd.h>\n#include <stdlib.h>\n/* File:\
  \ execve */\nint main(int argc, char* argv[]){\n    char* envp[3];\n    envp[0]=\"\
  first\";\n    envp[1]=\"second\";\n    envp[2]=NULL;\n    execve(\"target\", argv,\
  \ envp);\n    exit(EXIT_FAILURE);\n}\n```\n\n#### 示例：命令搜索\n\n`which` 命令在环境变量 `PATH`\
  \ 定义的路径上定位指定的命令（别名）。这里是 `which` 的简化实现：\n\n```c\n/* File: which */\n#include <stdio.h>\n\
  #include <sys/param.h>\n#include <unistd.h>\n#include <string.h>\n#include <stdlib.h>\n\
  \nint has_command(char* name, char* dir){\n    int ans=-1;\n    char wd[MAXPATH+1];\n\
  \    getcwd(wd, MAXPATH+1);\n    if ( chdir(dir)==0 ){\n        ans = access(name,\
  \ F_OK | X_OK);\n    }\n    chdir(wd);\n    return ans==0;\n}\n```\n\n在切换之前，保存了当前工作目录（行\
  \ 1）。注意 `getcwd` 是库函数而不是系统调用。如果目录可用（行 2），则测试是否存在执行文件而非目录（行 3）。恢复工作目录（行 4）。函数 `has_command`\
  \ 在找到命令时返回 1；否则返回 0。\n\n主程序从环境变量 `PATH` 中提取各个目录并调用 `has_command` 来定位命令：\n\n```c\n\
  int main(int argc, char* argv[]){\n    char* path=getenv(\"PATH\");/* 5*/\n    char\
  \ dir[MAXPATH+1];\n    int dir_len;\n    char* pt=path;\n    while ( dir_len=strcspn(path,\"\
  :\") )/* 6*/{\n        strncpy(dir, path, dir_len);/* 7*/\n        dir[dir_len]='\\\
  0';/* 8*/\n        if ( has_command(argv[l],dir) ){\n            printf(\"%s/%s\\\
  n\", dir, argv[l]);\n            return EXIT_SUCCESS;\n        }\n        path +=\
  \ dir_len+1;/* 9*/\n    }\n    printf(\"%s not found on\\n%s\\n\", argv[l], pt);\n\
  \    return EXIT_FAILURE;\n}\n```\n\n\n\n\n我们已经知道程序是作为一个独立的进程执行的。然而，外部的事件会影响它的执行。此类事件发生的时刻是不可的。因此，它们被称为异步事件。此类事件示例包括\
  \ I/O 阻塞、I/O 就绪、键盘和鼠标事件、时间片过期，以及用户交互式发出的中断。Linux 使用信号（signal）机制来处理异步事件。Linux 向进程发送特定的\
  \ `signal` 以表示特定事件的发生。在接收到 `signal` 后，进程将以一种定义良好的方式对其响应。这种动作被称为信号处理（signal disposition）。例如，进程可能会被终止或挂起以备后恢复。每个信号都关联有一个系统定义的默认处理方式。进程通常通过默认操作对信号做出响应。然而，程序也有能力通过指定它自己的信号处理例程来重新定义对任何信号的处理方式。\n\
  \n## Some Linux 信号\n\n![image](img/00146.jpeg)\n\n有许多不同的信号。例如，在键盘上输入 `CTRL+` 通常会产生一个名为\
  \ `quit` 的信号。向进程发送 `quit` 信号会使其终止并产生一个调试用的转储映像文件（core image file）。每种信号都有一个唯一的整数、一个符号名称以及一个\
  \ Linux 定义的默认操作。表 11.5 显示了 Linux 处理的许多信号中的某些。所有信号的完整列表可以通过 `man 7 signal` 找到。\n\n\
  ### 发送信号\n\n你可以通过在 Shell 层输入某些控制字符（如 `CTRL+`、`CTRL+C` 和 `CTRL+Z`）来向连接到你终端窗口的进程发送信号。这些信号及其影响总结如下。\n\
  \n```\nCTRL+C SIGINT 终止前景进程的执行\nCTRL+\\ SIGQUIT 终止前景进程并生成 core\nCTRL+Z SIGTSTP 挂起前景进程以稍后恢复\n\
  ```\n\n除了这些特殊字符外，你还可以使用 Shell 命令 `kill` 向给定的进程发送特定的信号。`kill` 命令的一般形式为：\n\n```\n\
  kill [ - sig_no ] process\n```\n\n其中 `process` 是进程号（或 Shell `jobid`）。可选参数指定信号值 `sig_no`。如果没有指定信号，则假设为\
  \ `SIGTERM`，这会导致目标进程终止。回想我们在第 3 章第 3.6 节讨论作业控制时使用过 `kill`。\n\n在 C 程序中，标准库函数\n\n\
  ```c\nint raise(int sig_no) (向进程本身发送 sig_no)\n```\n\n被进程用于向自己发送 `sig_no`，而系统调用\n\
  \n```c\nint kill(pid_t pid, int sig_no) (向进程 pid 发送 sig_no)\n```\n\n用于向由给定数值 `pid`\
  \ 标识的进程发送指定的信号。\n\n### 信号的投递与处理\n\n当向进程发送 `signal` 时，该 `signal` 被添加到一组等待传递给该进程的信号中。信号以类似于硬件中断的方式传递给进程。如果\
  \ `signal` 当前未被进程阻塞（临时忽略），它将通过以下步骤传递给进程：\n\n1. 在传递和处理此次发生期间，阻塞同一信号的后续发生。\n2. 临时挂起进程的执行并调用与此\
  \ `signal` 关联的处理函数。\n3. 如果处理函数返回，则取消阻塞该 `signal` 并从中断点恢复进程的正常执行。\n\n每个 `signal`\
  \ 都有一个默认处理函数。默认操作通常是退出或转储（core dump）表 11.5]。进程可以用自己的处理函数替换信号处理程序。这允许进程捕获 `signal`\
  \ 并以自己的方式处理它。然而，`SIGKILL` 和 `SIGSTOP` 信号无法捕获。\n\n### 信号捕获\n\n接收到 `signal` 后，进程通常（通过默认信号处理函数）退出（终止）或停止（挂起）。在某些情况下，对特定信号做出不同响应是所需的。例如，进程可能会忽略\
  \ `signal`、在终止前删除临时文件，或使用 `longjmp` 处理这种情况。\n\n系统调用 `sigaction` 用于捕获或拦截信号。\n\n```c\n\
  #include <signal.h> \nint sigaction(int signum, const struct sigaction *new, struct\
  \ sigaction *old);\n```\n\n其中 `signum` 是要捕获的 `signal` 的编号或名称。`new`（旧）结构体包含新的（旧）处理函数和其他设置。`signum`\
  \ 的处理操作现在由 `new` 指定，如果旧操作不为 NULL，则旧操作被放置在 `old` 中，以便以后可能恢复。\n\n`struct sigaction`\
  \ 可以通过 `man 2 sigaction` 找到，但基本上可以用以下方式使用它：\n\n```c\nstruct sigaction new; new.sa_handler=handler_function\
  \ ; new.sa_flags=0;\n```\n\n`handler_function` 可以是你写的例程或系统定义的例程。如果 `handler_function`\
  \ 是 `SIG_IGN`，则后续将忽略该 `signal`。如果它是 `SIG_DFL`，则恢复默认操作。新的处理程序通常保持不变，直到被另一个 `sigaction`\
  \ 调用更改。某些信号的默认操作在表 11.5 中所示。`sa_flags` 控制信号处理的行为。例如，`sa_flags=SA_RESETHAND` 在新的信号处理程序被调用一次后自动重置为默认处理程序。\n\
  \n我们现在给出一个简单的示例，使用 `sigaction` 系统调用捕获 `SIGINT`（来自终端的中断）信号，并在每接收这样一个信号时计数器加 1（例如：ex11/sigcountaction.c）。要终止程序输入\
  \ `ctrl+` 或使用 `kill -9`。\n\n```c\n#include <signal.h>\n#include <stdio.h>\nvoid\
  \ cnt(int sig){ \n    static int count=0;\n    printf(\"Interrupt=%d, count=%d\\\
  n\", sig, ++count);\n}\nint main(){ \n    struct sigaction new; \n    struct sigaction\
  \ old; \n    new.sa_handler=cnt; \n    new.sa_flags=0;\n    sigaction(SIGINT, &new,\
  \ &old);\n    printf(\"Begin counting INTERRUPTs\\n\"); \n    for(;;);\n}\n```\n\
  316 进程控制系统调用\n\n如果信号处理函数（例如此处的 `cnt`）定义为接受一个 `int` 参数（例如 `sig`），那么它将带有导致捕获的信号编号被自动调用。当然，计算接收到的数量的应用有限。一个更具实用性的示例\
  \ `cleanup.c` 是关于在进程由于用户中断而终止之前关闭并删除其使用的临时文件（例如：ex11/cleanup.c）。\n\n```c\n#include\
  \ <stdio.h>\n#include <signal.h>\n#include <stdlib.h>\nFILE *tempfile=NULL; char\
  \ filename[32];\nvoid onintr(){ \n    extern FILE* tempfile; \n    if ( tempfile\
  \ != NULL ){ \n        printf(\"closing and deleting %s\\n\", filename); \n    \
  \    fclose(tempfile); \n        unlink(filename);\n    }\n    exit(EXIT_FAILURE);\n\
  }\n/* 如果 SIGINT 未被忽略，则安装 onintr() handler */\nvoid sigtrap(int sig){ \n    struct\
  \ sigaction new; \n    struct sigaction old; \n    new.sa_handler=SIG_IGN; \n  \
  \  new.sa_flags=0;\n    sigaction(SIGINT, &new, &old); \n    if ( old.sa_handler\
  \ != SIG_IGN ){ \n        new.sa_handler=onintr;\n        sigaction(sig, &new, &old);\
  \ \n    }\n}\nint main(){ \n    extern char filename[32]; \n    extern FILE* tempfile;\n\
  \    sigtrap(SIGINT);/* 捕获 SIGINT */\n    sprintf(filename, \"/tmp/%d\", getpid());\
  \ /* 临时文件名 */\n    /* 打开临时流用于读写 */ \n    tempfile = fopen(filename, \"w+\");/* 程序其他代码\
  \ */ \n    for(;;) sleep(3);/* 在终止前删除临时文件 */ \n    fclose(tempfile); unlink(filename);\
  \ return EXIT_SUCCESS; \n}\n```\n\n\n\n在本示例中，只有在 `SIGINT` 未被忽略的情况下，才会对其进行捕获。如果一个进程在运行时，其信号环境已设置为忽略某些信号，那么这些信号应该继续被忽略，而不是被捕获。例如，Shell\
  \ 会安排一个后台进程来忽略从键盘生成的 `SIGINT`。如果一个进程在没有检查其是否被忽略的情况下就去捕获 `SIGINT`，那么 Shell 的安排将会失效。\n\
  \n此外，与像 `vi` 编辑器等交互式工具一样，通常希望使用键盘中断来返回到程序的顶层。这可以通过将信号捕获与 `longjmp` 机制结合来实现（第 10\
  \ 章，第 10.7 节）。\n\n通常情况下，当信号处理函数返回，或者当进程在被 `CTRL+Z` (`SIGTTSP`) 停止后恢复时，进程将从被中断的精确位置继续执行。对于被中断的系统调用，外部\
  \ `errno` 被设置为 `EINTR`，且系统调用返回 `-1`。如果在从键盘读取输入时被中断，进程可能会丢失在中断前刚刚输入的部分行内容。\n\n###\
  \ 11.17 更多信息\n\n关于 Linux 系统调用列表，请参阅 `syscall` 的 man 页 HTML 版本，`syscall` 是一个用于执行所有系统调用的系统调用。你可以从书籍配套网站的资源页面找到该\
  \ man 页。本书的示例代码包包含一个示例（例如：`ex11/sysopen.c`），演示了如何使用 `syscall`。\n\nPOSIX 标准文档可以从\
  \ IEEE 购买。\n\n### 11.18 总结\n\n所有打开的 I/O 通道都由 I/O 描述符表示。通过 I/O 描述符，Linux 内核统一地处理文件、设备和进程间\
  \ I/O。这种统一性为 I/O 编程提供了极大的灵活性和便利性。对于 I/O，C 程序可以使用低级系统调用，可以使用高层标准 I/O 库例程。I/O 描述符由小整数标识。三个预打开的描述符\
  \ `0`、`1` 和 `2` 分别赋予每个进程访问标准输入、标准输出和错误输出的权限。\n\n除了完整的文件操作调用集，Linux 还提供了一组访问目录的库函数。文件和目录相关的系统调用总结在\
  \ 表 11.6 中。\n\n文件和目录系统调用\n\n![image](img/00147.jpeg)\n\nLinux 支持多程序并发。进程通过 `fork`\
  \ 创建，通过 `_exit` 终止，通过 `exec` 覆盖另一个可执行程序，并通过 `wait` 进行同步。中断信号可以通过 `kill` 从一个进程发送到另一个进程，并通过\
  \ `sigaction` 捕获。`environ[]` 数组包含了进程的字符串值环境变量，可以通过 `getenv` 进行查询。\n\n### 11.19 练习\n\
  \n1. 文件描述符和 C 文件流之间的区别是什么？请解释。\n2. 解释 `umask` 值 `077` 和 `022` 的作用。\n3. 执行 `cat /proc/sys/fs/file-max`\
