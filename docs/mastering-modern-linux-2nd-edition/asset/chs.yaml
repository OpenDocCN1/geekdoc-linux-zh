  \n`man` 命令用于查阅大多数命令的手页。因此，\n\n```\nman command\n```\n\n将显示给定命令的文档。尝试运行：\n\n```\n\
  man passwd\n```\n\n看看你会得到什么。通过以下命令学习关于 `man` 命令：\n\n```\nman man\n```\n\n关于 `man`\
  \ 命令的详细信息请参见第 1.15 节。\n\n`man` 命令记录普通命令（应用程序），但通常不记录内置于 Shell 或或其他应用程序的命令。对于 Bash，你可以使用\n\
  \n```bash\nhelp builtin_command\n```\n\n来查看任何特定 Bash 内置命令的摘要。许多 Linux 系统添加了 `Bash_Builtins`\
  \ 手页，因此 `man` 命令也可以适用于 Bash 内置命令。\n\n### 纠正拼写错误\n\n在你输入上述命令时，可能至少有一次按键错误，或者你可能想要重新发送之前输入过的命令。Linux\
  \ Shell 提供了纠正错误和重用之前命令的简单方法。基本上，你可以使用方向键在命令行上左右移动字符光标，或者向上移动到上一个命令，向下移动到下一个命令。\n\
  \n删除键（backspace）删除光标所在（或之前）的字符。回车键（enter/ret）无论光标在行的什么位置，都会执行该命令。\n\nBash Shell\
  \ 对编辑命令行有很好的支持。它实际上允许你选择一个文本编辑器来协助工作。我们将在第 3 章第 3.3 节回到这个问题。\n\n### 终止命令\n\n除了纠正拼写错误外，你还可以对与\
  \ Linux 的交互进行其他控制。例如，你可以在命令完成之前终止它，或者你可能希望停止、恢复和丢弃终端窗口的输出。\n\n有时，你可能执行命令后发现自己犯了错。也许你给出了命令但没有任何发生，或者它显示了大量不需要的信息。这些是你希望终止命令执行的情况。\n\
  \n要要终止，只需输入中断字符，通常是 `ctrl+c`。这将中断（终止）执行并让你返回到 Shell 层。尝试以下操作：\n\n1. 输入命令的一部分。\n\
  2. 在终止命令之前，按下 `ctrl+c`。\n\n这会取消该命令并给你一个新的新提示符。\n\n### 1.4 练习 A\n\n1. 如何启动终端窗口？\n\
  2. 应该使用什么命令和选项来列出主目录下的所有文件？\n3. 将 `ctrl+alt+T` 设置为运行终端窗口的快捷键。\n4. 使用什么命令更改你的密码？你能将其更改为类似\
  \ 123 这样的密码吗？为什么要设置一个更长的密码并更改你的密码？为什么这次你必须输入两次密码？\n5. 尝试在 Bash 下使用方向键进行输入编辑。在执行命令\
  \ `ls -l` 后，按一次向上箭头和两次向左箭头。现在光标在哪里？现在，按一次向箭头，光标应该落在字母 `l` 上，它是命令行的最后一个字符。你能再次按右箭头让光标移动到\
  \ `l` 之外吗？如果不能，你能找到方法吗？（提示：限制使用方向键。）\n6. 你运行的是什么 Linux 发行版？你的 Linux 计算机主机名是什么？如何获取这些信息？\n\
  \n![image](img/00009.jpeg)\n\n图 1.7 示例文件树\n\n### 1.5 使用文件和目录\n\n与其他现代操作系统一样，Linux\
  \ 将用户、应用程序和操作系统本身的文件存储在磁盘上以便随时访问。用于存储和管理此类文件的结构称为文件系统。Linux 下的文件组织成树形结构，根目录由单个字符\
  \ `/` 命名。\n\n普通文件存储程序或数据。目录或文件夹包含文件以及可能的其他目录。Linux 文件树上的内部节点表示目录；叶子节点表示普通文件。这种分级文件结构被不同的操作系统广泛使用。示例\
  \ Linux 文件树如图 1.7 所示。\n\n可视化文件浏览器（图 1.8\n\n当你在 Linux 系统获得用户 ID 和账户时，你会获得一个个人文件目录，称为主目录。你的主目录将以你的用户\
  \ ID 命名，它通常是名为 home 的目录的子目录。你的文件和文件夹都保存在你的主目录中。\n\n![image](img/00010.jpeg)\n\n\
  图 1.8 Linux 文件浏览器\n\n要从命令行访问文件系统中的文件或目录，你必须通过其名称调用它，有几种方法可以实现。指定文件名最通用也最麻烦的方法是列出从根目录到你想要的文件或目录节点路径上的所有节点。该路径以字符字符串指定，称为文件或目录的绝对路径（或全路径）。在初始的\
  \ `/` 之后，路径中的所有组件都用字符 `/` 分隔。例如，图 1.7 中的文件 `note.txt` 绝对路径为：\n\n```\n/home/pwang/note.txt\n\
  ```\n\n全路径是文件的完整名称。然而，你可以想象，这个名称通常很长。幸运的是，也可以相对于当前工作目录（称为工作目录或当前目录）指定文件名。因此，对于文件\
  \ `/home/pwang/note.txt`，如果当前工作目录是 `/home`，那么名称 `pwang/note.txt` 就足够了。相对路径提供了从工作目录到目标文件的树路径。访问文件的第三种最简单的方法是在工作目录与文件所在目录相同时使用的。在这种情况下，你只需使用文件名即可。因此，一个\
  \ Linux 文件有三个名称：\n\n* 全路径（例如 `/home/pwang/note.txt`）\n* 相对路径（例如 `pwang/note.txt`）\n\
  * 简单名称（例如 `note.txt`）\n\n使用相对路径和简单文件名的能力取决于更改当前工作目录的能力。例如，如果你的工作目录是 `/tmp` 且你想访问文件\
  \ `note.txt`，你可以指定绝对路径：\n\n```\n/home/pwang/note.txt\n```\n\n或者你可以将工作目录更改为 `pwang`\
  \ 并直接通过名称 note.txt 文件。当你登录时，工作目录会自动设置为主目录。命令\n\n```\npwd\n```\n\n显示当前工作目录的绝对路径。命令（Bash\
  \ 命令）\n\n```bash\ncd directory\n```\n\n将你的工作目录更改为指定的目录（通过简单名称、绝对路径或相对路径给出）。\n\n\
  每个目录都保留两个特殊文件，它们作为指针：\n\n| 文件 | . | 指向文件所在的目录（目录自身指针）。 |\n| 文件 | .. | 指向文件所在目录的父目录（父目录指针）。\
  \ |\n\n\n\n\n\n这些指针为当前目录及其父目录提供了标准的缩写，无论你处于文件树的哪个位置。当你想要引用一个目录而又不想使用甚至不知道它的名称时，你也可以使用这些指针作为简写。例如，命令\n\
  \n```\ncd .\n```\n\n没有任何效果，而命令\n\n```\ncd ..\n```\n\n会切换到当前目录的父目录。例如，如果你的工作目录是 `jdoe`，而你想访问\
  \ `pwang` 目录下的文件 `sort.c`，可以使用 `../pwang/sort.c`。为什么这样做可行呢？\n\n你的主目录已经有一个名字，即你的\
  \ `userid`。然而，你在创建文件和子目录时会为它们命名。Linux 在文件名限制方面非常宽容。在 Linux 中，你可以使用除字符 `/` 以外的任何字符串来命名文件。但建议避免使用空格字符和任何开头的连字符（`-`）。\n\
  \n## 处理文件和目录\n\n通常有两种普通文件：文本文件和二进制文件。Linux 文本文件使用 `ASCII` 或 `UNICODE` 存储字符，并用换行符标记行结束。二进制文件存储字节序列。文件可以被复制、重命名、移动和删除；目录也提供类似的操作。`cp`\
  \ 命令用于复制文件，其形式为\n\n```\ncp source destination\n```\n\n将文件 `source` 复制到名为 `destination`\
  \ 的文件中。如果 `destination` 文件不存在，则会创建它；如果它已经存在，其内容将被覆盖。`mv`（移动）命令\n\n```\nmv oldname\
  \ newname\n```\n\n用于将文件 `oldname` 更改为 `newname`。这不涉及文件内容的复制。新名称可能位于不同的目录——因此被称为“移动”。如果\
  \ `newname` 已经存在，其原始内容将会丢失。\n\n一旦某个文件或子目录不再有用，你可能就想将其从文件系统中删除掉。Linux 提供了用于文件的 `rm`\
  \ 命令和用于目录的 `rmdir` 命令\n\n```\nrm filenamel filename2\nrmdir directoryname1 directoryname2\
  \ ...\n```\n\n`rm` 的参数是一个一个或多个待删除的文件名列表。`rmdir` 的参数是一个一个或多个目录名称列表；但请注意，`rmdir` 只能删除空目录。通常，要删除一个目录，你必须先使用\
  \ `rm` 将其清空。\n\n要创建一个新目录，使用 `mkdir` 命令，其参数是要创建的目录名称\n\n```\nmkdir name\n```\n\n\
  在指定文件或目录名称作为命令的参数时，你可以使用概述的任何一种形式。也就是说，你可以使用完整路径、相对路径或文件的简单名称，任凭你的喜好。\n\n## 标准个人目录\n\
  \n切换到主目录很容易，只需执行：\n\n| 命令 | 描述 |\n| :--- | :--- |\n| `cd` | (进入你的主目录) |\n| `cd`\
  \ | (进入 `userid` 的主目录) |\n\n在 Linux 中，每个用户的主目录下都有许多标准文件夹，通常包括\n\n*   `Desktop`——此文件夹中的文件以图标形式显示在你的图形桌面上，包括普通文件和应用程序启动器（文件名后缀为\
  \ `.desktop`）\n*   `Documents`——文本文档，如 PDF 文件以及使用 Apache OpenOffice 和 LibreOffice\
  \ 等工具创建的文件。\n*   `Download`——从网络下载的文件\n*   `Music`——音频和音乐文件\n*   `Pictures`——来自数字相机的照片\n\
  *   `public_html`——此文件夹下的文件通过 Linux 系统上的 HTTP 服务器向 Web 提供\n*   `Videos`——来自摄像机和录像机的文件\n\
  \n除了这些，你还可以考虑为自己的可执行文件设置一个 `bin/`，为临时文件设置一个 `tmp/`，为可用文件设置一个 `templates/`，为课程设置一个\
  \ `homework/` 等。\n\n## 1.6 文件保护：访问控制\n\n每个文件都有所有者和一个组标记。Linux 使用 9 位代码来控制每个文件的访问。这些位被称为保护位，指定了三类用户对文件的访问权限。用户可以是超级用户、文件所有者、文件组的成员，或者以上皆不是。超级用户访问文件没有任何限制。\n\
  \n| 代码 | 描述 |\n| :--- | :--- |\n| `u` | (文件的所有者或创建者) |\n| `g` | (文件组的成员) |\n| `o`\
  \ | (其他) |\n\n前三个保护位涉及 `u` 访问，接下来的三个涉及 `g` 访问，最后三个涉及 `o` 访问。`g` 类型的用户将在第 6 节中进一步讨论。\n\
  \n指定用户类访问权限的三个位中的每一个都有不同的含义。文件可能的访问权限有：\n\n| 位 | 描述 |\n| :--- | :--- |\n| `r` |\
  \ (读取权限，第一位设置) |\n| `w` | (写入权限，第二位设置) |\n| `x` | (执行权限，第三位设置) |\n\n### 超级用户\n\n\
  Root 指一类不受任何文件访问限制的超级用户。通过以 `userid` `root`（或其他指定的 root `userid`）身份登录或通过 `su` 命令获得超级用户权限。无论保护位如何，超级用户对系统中的所有文件都有读写权限。此外，超级用户对任何人具有执行权限的文件也具有执行权限。通常，只有系统管理员和少数其他选定用户（有时被称为“专家”）可以访问超级用户密码，出于显而易见的原因，密码被视为秘密。\n\
  \n### 检查权限设置\n\n九个保护位可以用一个三位八进制数表示，称为文件的保护模式。只有文件的所有者或超级用户可以设置或更改文件的保护模式；但任何人都可以查看。`ls\
  \ -l` 列出的文件显示文件类型和访问权限。例如，\n\n```\n-rw-rw- 1 smith 127 Jan 20 1:24 primer\n-rw-r–r–\
  \ 1 smith 58 Jan 24 3:04 update\n```\n\n是针对 `primer` 和 `update` 文件的 `ls -l` 输出。`primer`\
  \ 的所有者是 `smith`，后面是文件最后一次修改的日期（1 月 20 日）和时间（凌晨 1:24）。数字 127 是文件中包含的字符数。文件类型、访问权限和链接数位于文件所有者的\
  \ `userid` 之前（图 1.9）。在 `ls` 的前的模式显示中有十个位置。第一个位置指定文件类型；接下来三个位置指定 `u` 的 `r`、`w` 和\
  \ `x` 权限，依此类推（图 1.9）。`primer` 的保护设置赋予了 `u`、`g` 和 `o` 读写权限。文件 `update` 允许 `u` 读写，但仅\
  \ `g` 和 `o` 读取。两个文件都没有赋予执行权限。尝试查看你系统系统中某些真实文件的访问权限。执行命令\n\n```\nls -l /bin\n```\n\
  \n查看 `/bin` 目录下的文件列表。\n\n![image](img/00011.jpeg)\n\n图 1.9 文件属性\n\n### 设置权限\n\n\
  用户不仅可以对文件指定不同类型的访问，还可以对目录指定。用户需要 `x` 权限进入目录，需要 `r` 权限列出目录中的文件名，需要 `w` 权限在目录中创建/删除文件。\n\
  \n通常，创建文件时的默认保护为\n\n```\n-rw——-\n```\n\n因此只有文件所有者可以读写该文件。要更改文件的保护模式，使用命令\n\n```\n\
  chmod mode filename\n```\n\n其中 `mode` 可以是一个八进制（基 8）数字（例如 `644` 代表 `rw-r–r–`），用于设置所有\
  \ 9 位，也可以指定对文件现有权限的修改，在这种情况下 `mode` 的形式如下：\n\n```\nwho op permission op2 permission2\
  \ ...\n```\n\n\n\n\n\n代表受更改影响的用户类（或类）；它可以是字母 `u`、`g` 和 `o` 的组合，也可以用字母 `a` 代表这三者。`Op`（操作，operation）代表要执行的更改；它可以是\
  \ `+` 添加权限，`-` 取消权限，以及 `=` 重置权限。权限（Permission）代表正在分配或移除的权限类型；它可以是字母 `r`、`w` 和 `x`\
  \ 的任意组合。例如，\n\n```\nchmod o-w filename\nchmod a+x filename\nchmod u-w+x filename\n\
  chmod a=rw filename\n```\n\n第一个示例拒绝了其他用户的写入权限。第二个示例使所有用户都可执行文件。第三个示例为所有者取消了写入权限并授予了执行权限。第四个示例为所有类用户提供了读取和写入权限（但没有执行权限），无论之前分配了什么种权限。\n\
  \n关于 Linux 文件系统的详细讨论可以参阅第 6 章。\n\n### 1.7 练习 B\n\n1. 回到你的主目录并列出所有文件（包括隐藏文件）以及权限设置。\n\
  2. 使用 `ls` 命令按时间顺序列出你的文件（最近优先）。\n3. 列出你主目录的权限设置。使用 `chmod` 命令确保禁止 `g` 和 `o` 的读取和写入权限。\n\
  4. 在你的主目录下直接创建一个名为 `public_html` 的文件夹，并确保该文件夹开启读取和执行权限。\n5. 将你的数码相机连接到 Linux 并下载照片。照片存放在哪里？你能在\
  \ `Pictures` 文件夹下找到它们吗？\n\n![image](img/00012.jpeg)\n\n图 1.10 Gedit\n\n### 1.8 文本编辑\n\
  \n创建和编辑文件是计算机许多任务的基础。Linux 有许多文本编辑器，包括 `gedit`、`nano`、`vim/gvim/vi` 和 `emacs`。\n\
  \n编辑器 `gedit`（图 1.10）随 GNOME 桌面自带。使用它几乎不需要指令。从开始菜单的“文本编辑器”或通过命令启动它：\n\n```\ngedit\
  \ file &\n```\n\n一个编辑器窗口将会显示。然后你可以输入内容；使用方向键或鼠标移动光标；使用鼠标选择文本；使用 `delete` 或 `backspace`\
  \ 键删除文本；通过提供的按钮或编辑菜单选项查找、剪切、复制和粘贴文本。它非常直观。\n\n`gedit` 是一个 GUI 应用。如果你想要基于终端窗口的编辑器，可以考虑\
  \ `nano`，它非常容易学习，但功能没有 `vim` 或 `emacs` 强大或方便。`vim` 和 `emacs` 的指南可以在配套网站（mml.sofpower.com）的附录中找到。\n\
  \n除去编辑能力，对于简单任务，一个简单直观的编辑器是有价值的，特别是如果你是初学者。无论如何，选择一个文本编辑器并学会它。它会让 Linux 生活变得简单得多。\n\
  \n![image](img/00013.jpeg)\n\n图 1.11 Nano\n\n要调用编辑器 `nano` 编辑文件，请在 Shell 层输入：\n\n\
  ```\nnano file    (启动 nano)\nnano -w file (启动不带自动换行的 nano)\n```\n\n如果文件存在，`nano`\
  \ 会显示它进行编辑。否则，你正在创建一个该名称的新文件。当你输入文本时，当文本行接近编辑器窗口右边缘时，`nano` 会自动开始新行。`-w` 选项要求不进行自动换行。建议始终使用\
  \ `-z` 选项，它允许你挂起 `nano` 并返回 Shell 层。\n\n一旦进入 `nano`内部，你就在一个由 `nano` 控制的文本编辑环境中工作，你可以创建文本、做出更改、移动文本等。常见操作由\
  \ `nano` 编辑器窗口指示（图 1.11）。以下是帮助你入门的列表。\n\n* 保存文件，输入 `ctrl+o`。\n* 退出并终止 `nano`，输入\
  \ `ctrl+x`。你可以选择保存缓冲区或取消以改变退出主意。\n* 移动光标，使用方向键。\n* 剪切和粘贴整行，`ctrl+k` 一次剪切一行，`ctrl+u`\
  \ 粘贴剪切的行。\n* 剪切和粘贴选中文本，输入 `ctrl+6`，移动光标高亮选中文本，然后使用 `ctrl+k` 和 `ctrl+u`。\n* 在缓冲区中查找文本，输入\
  \ `ctrl+w` (where)、要查找的文本，然后按回车或返回键。\n* 获取操作帮助，输入 `ctrl+g`。\n\n### 1.9 获取打印/保存副本\n\
  \n要获取文件的打印副本，使用：\n\n```\nlpr [ options ] filename\n```\n\n此命令将 `filename` 发送到打印机。你的打印请求将加入队列。注意\
  \ `w` 命令显示已登录的请求。只有支持的文件（纯文本、`pdf`）可以通过这种方式打印。使用打印选项发送不支持的文件（如编译文件 `.`.o`）压缩文件。\n\
  \n``      这种 。\n\n这种多行输出包含一个 project 字段，它是用户主目录下 `.project` 文件的第一行。plan 字段显示的是用户的\
  \ `.plan` 文件。这两个文件为 finger 数据库提供了额外信息。示例中的 `no plan` 行表示 `csmith` 没有 `.plan` 文件。\n\
  \n使用打印选项可以轻松避免浪费纸张。你可以通过电子邮件共享结果文件（`pdf`）。`SFTP`（安全文件传输协议，第 5.27）。\n\n### 1.10 与他人通信\n\
  \n一旦你登录，就可能与他人互动，无论他们是在同一台 Linux 计算机上还是其他主机（计算机）上。诸如 `who`（谁已登录）和 `finger` 的命令有助于识别用户成员；电子邮件允许发送和接收消息；即时消息（IM）程序实现了互联网上任何在线用户之间的立即互动。\n\
  \n#### 系统中是谁：finger\n\n如果你是一个新用户，你可能不认识系统中的许多人，尽管 `who` 和 `w` 提供的信息很有用，但你不知道这些用户是谁。你只知道他们的\
  \ `userid`，这些可能与他们的真实姓名完全不像。`finger` 命令为你提供全名、办公室、地址和电话；这有时被称为 finger 数据库，因为 `finger`\
  \ 用于从该数据库查找信息。通用格式为：\n\n```\nfinger name ...\n```\n\n此命令将显示 finger 数据库中包含与给定参数匹配的\
  \ `userid` 以及名、中间名或姓。例如，finger smith` 或 `finger clyde` 都会导致图 1.12 所示的条目。\n\n![image](img/00014.jpeg)\n\
  \n图 1.12 示例 finger 输出\n\n![image](img/00015.jpeg)\n\n图 1.13 Thunderbird 电子邮件程序\n\
  \n#### 电子邮件\n\n电子邮件让你能够即时发送和接收消息。通过电子邮件发送的消息会立即投递，并保存在每个接收者的特定用户邮箱箱中。你可以向同一台计算机上的用户或互联网上其他计算机上的用户发送电子邮件。\
  \ \n\n\n\n\n\nLinux 上有许多用于电子邮件的程序，包括流行的 `thunderbird`（图 1.13）、`Evolution` 和 `Kmail`。这些全\
  \ GUI 界面的电子邮件程序在你位于 Linux 控制台时非常好用。而命令行电子邮件程序如 `elm` 和 `mutt` 在终端窗口中非常有用。让我们来解释一下如何使用\
  \ `mutt`。\n\n```\nmutt userid@host-address    (互联网邮件)\nmutt userid    (本地邮件)\n```\n\
  \n然后只需按照指示操作，输入邮件主题并输入/编辑你的消息。`mutt` 允许你使用最喜欢的文本编辑器来编辑消息。对于 `mutt` 以及许多其他需要文本编辑的应用程序，可以通过给环境变量\
  \ `EDITOR` 赋值来设置你喜喜欢的编辑器（第 3 章，节 3.10）。\n\n```\nEDITOR=vim+ or EDITOR=emacs\nexport\
  \ EDITOR\n```\n\n当你完成消息编辑后，它将自动发送。\n\n```\nmutt –help | more\n```\n显示更多关于 `mutt`\
  \ 使用的信息。在这里，输出通过 `+|+` 符号传递给 `more` 分页器（第 3 章，节 3.5），一次显示页信息。\n\n要接收邮件（检查你的邮箱），不带任何参数输入\
  \ `mutt` 并按照指示操作。尝试给自己发送一些邮件以熟悉其用法。\n\n电子邮件很快，但不是即时或交互式的。在 Linux 上，你可以进行 IM（即时通讯）。`Skype`\
  \ 和 `Google_Hangout` 非常流行。它们在包括 Linux 在内的所有系统中运行良好。\n\n对于 Linux 上的 IM，你也可以选择 `pidgin`\
  \ 或 `empathy`。\n\n### 1.11 浏览网页\n\n任何计算机系统中最重要的工具之一就是 Web 浏览器。在 Linux 上，你有不同的 Web\
  \ 浏览器可供选择。流行的选择包括 `Google Chrome` 和 `Firefox`。`firefox` 命令随大多数 Linux 发行版提供。在图 1.14\
  \ 中，我们看到了我们教材网站的首页。\n\n![image](img/00016.jpeg)\n\n图 1.14 访问教材网站\n\n你可以在浏览器的位置窗口中输入\
  \ URL（统一资源定位符）来访问特定的 Web 地址。格式为 `file://full_pathname` 的本地文件 URL 可用于访问本地文件系统。\n\n\
  通常，Web 浏览器是用于交互的全 GUI 程序，但 Linux 还提供了一个名为 `lynx` 的命令行 Web 浏览器，这是一个不显示图片的纯文本浏览器。然而，可以在终端窗口中使用\
  \ `lynx`，使用箭头键交互式浏览 Web，或从 Web 下载文件。\n\n### 1.12 练习 C\n\n1.  尝试使用 `mutt` 电子邮件程序。用它发送邮件并附加文件。使用\
  \ `Thunderbird` 执行同样的操作。\n2.  使用 `nano` 创建一个文本文件。\n3.  尝试 `vim` 或 `emacs` 编辑器。阅读书籍网站上的相关附。\n\
  4.  如果可能，将 `Thunderbird` 设置为你的电子邮件程序，并将 `Firefox` 或 `Chrome` 设置为你的 Web 浏览器。\n5.\
  \  使用 `lynx` 从 Web 下载文件。\n\n### 1.13 创建并运行你自己的程序\n\n如果你没有立即用通用编程语言（如 `C`）编写程序的兴趣，请跳过本节。你以后可以返回此节。Linux\
  \ 系统提供了许多语言：`C`、`C++`、`Java`、`Fortran 77/95`、`Python`、`Ruby` 和 `Perl`，仅列举几个。你还可以编写\
  \ `Shell` 脚本来自动化频繁的操作。\n\n#### 文件名后缀\n\nLinux 遵循一套命名不同类型文件的约定。表 1.1 展示了一些常用的文件名后缀。源代码文件不能直接执行。程序通常必须先编译成机器码然后才能执行。编译的替代方案是使用解释器直接解释高级语言程序。\n\
  \n表 1.1 组织中的负责人 受访者\n\n![image](img/00017.jpeg)\n\n我们将遵循一个创建并运行简单 `C` 语言程序的示例。使用你最喜欢的文本编辑器并创建一个\
  \ `C` 源文件 `try.c`（例如：`ex01/try.c`），并包含以下代码：\n\n```c\n#include <stdio.h>\nint main(){\
  \ printf(\"running my C program\\n\");return 0;}\n```\n\n这是一个简单的 `C` 源程序，显示行“running\
  \ my C program”。符号 `\\n` 代表换行符（NEWLINE）。\n\n#### [编译]\n\n在运行 `try.c` 之前，必须对其进行编译。编译是将用\
  \ `C` 或 `Pascal` 等高级语言编写的程序翻译成可在特定计算机上执行的低级语言的过程。在许多系统中，编译器将输出一个目标代码文件，该文件必须由一个称为链接器（linker）的独立程序进行链接（与系统库提供的例程结合）。一旦链接完成，该文件就被视为可执行文件，并准备好加载到内存中执行。\n\
  \n基于 Linux 的编译器将处理程序的编译和链接，除非你明确告诉它们不要这样做，它们的输出的可执行文件。可用的编译器产生目标文件（`.o`）。\n\n| gcc\
  \ | GNU C 编译器 |\n| :--- | :--- |\n| `g++` | GNU C++ 编译器 |\n| `javac` | Java 编译器\
  \ |\n| `gfortran` | GNU Fortran 77/95 编译器 |\n\n让我们尝试编译 `try.c` 文件中的示例程序\n\n```bash\n\
  gcc try.c\n```\n\n这将产生一个可执行文件 `a.out`，只需通过将其输入为命令即可调用它（第 3 章，节 3.5）。\n\n```bash\n\
  a.out\n```\n\n注意，在 Linux 中，运行程序的命令仅仅是可执行文件的路径。因此，\n\n```bash\n./a.out\n```\n在某个时刻，你可能想给你的可执行文件起一个\
  \ `a.out` 以外的名字，特别是当你下次在此工作目录下调用编译器时，`a.out` 将被覆盖。我们已经知道 `mv` 命令可以重命名文件，但 `gcc`\
  \ 或 `g++` 的 `-o` 选项可以提供一个名称代替默认的 `a.out`。例如，\n\n```bash\ngcc -o mytry try.c\n```\n\
  产生可执行文件 `mytry`。\n\n无论你运行什么种语言的程序，你可能都想记录你的结果（例如作为作业提交）。此此的一种方法是使用输出重定向。例如，\n\n\
  ```bash\n./a.out > results\n```\n\n符号 `>` 告诉 `Shell` 将 `a.out` 的输出从终端重定向到一个名为 `results`\
  \ 的新文件中。因此，在执行该命令后，你将在终端窗口看不到输出。相反，你将在 `results` 文件中找到输出。关于 `Shell` 重定向的完整说明可以在第\
  \ 3 章节 3.5 中找到。\n\n此此另一种方法是使用 `script` 命令\n\n```bash\nscript record_file\n```\n\
  将你的终端会话记录到 `record_file` 中。在 `script` 激活期间，终端的所有输入输出都会写入你指定的文件（如果你不带参数输入 `script`，则写入名为\
  \ `typescript` 的文件）。录制将持续直到你在命令行输入 `ctrl+d`。然后可以使用文本编辑器查看该文件或将其发送给他人。例如，使用 script\
  \ 运行 C 程序，可以使用以下命令序列：\n\n```bash\nscript display_record\ncc myprogram.c\na.out\n\
  ctrl+d\n```\n`script` 命令请求后续所有的输入输出记录在文件 `display_record` 中。最后行的 `ctrl+d` 停止记录并退出\
  \ `script` 回到 `Shell` 级别。\n\n使用 `script` 简单重定向输出的优势是，`script` 产生的文件将包含程序的输入和输出。重定向输出创建的文件仅包含输出。\n\
  \n### 1.14 练习 D\n\n1.  输入一个简单的程序（用你喜欢的编程语言）打印出消息：Linux is nice once you know it.。编译并运行它。使用\
  \ `script` 获取程序执行的显示记录。\n\n\n\n\n2. 使用 `more` 或 `nano` 查看脚本生成的文件，然后通过电子邮件将文件发送给他人。\n\
  \n### 1.15 咨询 Linux 文档\n\n`yelp` 命令（普通命令）提供了一个用于浏览 Linux 文档的 GUI，在不带任何参数时，它会启动 `GNOME\
  \ Help` 实用程序，这是初者的很好的指南（图 [1.15]）。\n\n![image](img/00018.jpeg)\n\n图 1.15 GNOME Help\n\
  \nLinux 文档项目网站 [`tldp.org`](http://tldp.org) 为 Linux 的几乎所有方面提供了全面的文档。你可以在那里找到常见问题解答（FAQs）、特定主题的逐步说明（称为\
  \ `HOWTOs`）、指南以及命令的手册页。搜索功能让你能够轻松找到你需要的内容。\n\n你也可以找到由你自己的 Linux 系统提供的文档。GUI 应用程序工具栏上的\
  \ `Help` 菜单（例如 `File Browser`、`Terminal Emulation Window` 和 `Pidgin`）提供了特定工具文档。\n\
  \n命令行程序通常通过 `--help` 命令选项提供简明扼要的使用信息。例如，尝试：\n\n```\nls --help\n```\n\n`man` 命令显示以标准\
  \ UNIX 定义格式设置的手册页。有关 Linux 手册页的更多信息，请参见第 3 节第 [3.11] 节。\n\n### 1.16 练习 E\n\n1. 如何请求命令帮助你使用它？\n\
  2. 访问 `ls` 的 `man` 页并从头到尾阅读。\n3. 说明如何向 Linux 手册页的“用户命令”章节显示介绍部分。\n\n### 1.17 汇总常用命令\n\
  \n在本章中，我们只遇到了许多可用 Linux 命令中的一小部分。Linux 命令的丰富性和多样性是系统的主要优势。然而，许多用户并不可能了解所有命令；你只需要学习那些完成你所需的命令命令。本节收集了新用户基础储备中应该包含的命令。\n\
  \n在 Linux 中，大写和小写字母均使用，且它们是不互换的。所有系统定义的 Linux 命令都用小写输入。此外，有两种命令：(1) 内置 `Shell` 命令，它们是\
  \ `Shell` 中的子程序；(2) 作为由 `Shell` 控制的任务启动的普通命令。这种区别的重要性将变得清晰。在接下来的命令列表中，用户提供的参数用*斜体*显示。可选参数括在方括号\
  \ `[ ]` 中。可能重复的参数用省略号 `(...)` 表示。这些约定将贯穿全书。仅给出这些命令最常用的用法。这里的信息旨在让你入门，绝非完备。详细将在稍后的章节中提供，你应该查阅在线手册以获取每个这些命令的完整描述。\n\
  \n### 1.18 总结\n\nLinux 同时提供了全 GUI 应用程序和命令行程序。GUI 是视觉化的，使用更直观，但许多基础 Linux 实用程序在命令行下更方便。运行在终端窗口中的\
  \ `Shell`（通常是 `Bash`）提供了一个用于输入和执行命令的 CLI。学会有效使用 GUI 和 CLI 将让 Linux 之旅变得简单得多。对于使用\
  \ `SSH` 远程访问 Linux，CLI 特别重要。\n\n桌面主菜单指向许多实用操作。图 2 展示了 Linux 桌面。\n\n`Shell` 执行你从键盘输入的命令并在终端窗口中显示结果。输入错误可以通过输入编辑来纠正。\n\
  \n系统和用户都将数据存储在由 Linux 文件系统管理的文件中，该系统具有树形结构。每个文件可以通过完整（绝对）路径、相对路径或简单文件名来引用。每个用户都有一个家目录，可以在其中存放个人文件和目录。可以创建、移动、复制、列出和删除文件及目录。读、写、执行权限用于控制\
  \ `u`（所有者）、`g`（组）和 `o`（其他）访问文件。所有者可以设置和更改文件的访问权限。\n\n你可以通过使用 `talk` 直接聊天、电子邮件以及即时消息（`Skype`、`Google\
  \ Hangout`、`Pidgin`）与其他。\n\nLinux 提供了多个文本编辑器。全 GUI 的 `gedit` 是很好的选择。对于终端窗口，简单易用的\
  \ `nano` 适合初学者和轻量编辑任务。严肃的编辑使用 `vim` 等编辑器更高效。本文已经介绍了简单 C 程序的编辑、编译和运行。\n\nLinux 提供了许多设施和全套手册。可以使用\
  \ `man` 命令查阅手册页，Linux 文档项目网站提供了各种全面的 Linux 文档。\n\n参见第 [1.17] 节获取 Linux 初学者的可用命令列表。\n\
  \n[1] 在 Windows 或 DOS 系统上，行尾由回车后加换行符表示。\n\n## 第 2 章\n\n## 桌面环境\n\n操作系统为用户提供一个方便的界面来执行和管理任务是非常重要的。起初，Linux/UNIX\
  \ 系统完全通过键盘通过命令行界面（CLI）使用。通过添加图形用户界面（GUI），Linux 系统变得使用上更加直观，并且对于熟悉 Microsoft Windows®\
  \ 或 Mac OS® 系统的用户来说更容易学习。\n\n图形用户界面（GUI）采用基于像素的图形显示，并添加了指向设备（如鼠标、触控板或触摸屏）来与用户交互。第一个在廉价个人电脑上有效的\
  \ GUI 由 `Apple Lisa` 在 20 世纪 80 年代初引入。\n\n桌面环境（简称桌面）通过提供工作区、窗口、面板、图标和菜单，以及点击、滚动、复制粘贴和拖放操作来支持\
  \ GUI。今天，很难想象计算机用户离开桌面 GUI。尽管如此，当你成为更资深的 Linux 专家时，你可能会发现许多情况下 CLI 更方便。正确的方法是结合\
  \ GUI 和 CLI，以获得两者之长。\n\n### 2.1 桌面概述\n\n在工作站登录后，你看到的第一的是桌面，通过桌面你可以启动应用程序、管理文件、控制你的\
  \ Linux 系统并执行许多其他任务。桌面通过模拟物理对象的桌面比喻，让操作计算机变得更加直观。重叠的窗口可以像纸张一样移动和洗牌。按钮（图标）可以被按下（点击）以启动操作。\n\
  \n与 MS Windows® 或 Mac OS® 不同，Linux 提供了许多替代桌面，具有高度的用户自定义性。流行的桌面包括 `KDE Plasma`、`GNOME\
  \ 3`、`Cinnamon`、`MATE`、`Unity`、`Xfce` 等。桌面通常构建在窗口系统之上，例如 `X Windows System` 或较新的\
  \ `Wayland`。除了提供完整的桌面 GUI 外，Linux 发行版通常还提供一套基本应用程序，包括时钟/日历、音量控制、电子邮件客户端、Web/文件浏览器、即时消息工具、图像显示器、媒体播放器、地址簿、PDF\
  \ 阅读器、照片管理器、偏好/配置编辑器等。\n\n深入理解桌面以及如何有效地使用它可以让 Linux 生活变得简单得多。我们这里的讨论经常以 `GNOME Desktop`\
  \ 为特色，它是 Linux 发行版中最流行的桌面之一。其他 Linux 桌面以类似的方式运行。\n\n![image](img/00019.jpeg)\n\n\
  图 2.1 Linux Mint 菜单和面板\n\n\n\n\n### 2.2 桌面组件\n\n桌面通常显示以下组件：\n\n*   **根窗口（Root Window）**——登录后，整个图形显示屏幕会被桌面的根窗口覆盖。它是放置和操作所有其他\
  \ GUI 对象（桌面组件和应用程序窗口）的空间。\n*   **桌面面板（Desktop Panel）**——桌面通常会在根窗口的顶部或底部边缘以任务栏的形式显示面板。面板显示重要的控制控件和启动图标，通过该图标可以进入几乎所有任务的启动菜单，包括检查系统状态和自定义。面板还可能显示仍在运行的应用程序，以便你快速返回它们。面板还可以显示用于调用特定应用程序的启动器，以及小部件（小型应用程序），如时钟或音频量控制。请参图查看\
  \ Mint 面板和开始菜单。你也可以通过右键点击面板中的任何空白区域向面板添加对象。\n*   **开始菜单（Start Menu）**——点击面板末端的启动图标（通常根据你的\
  \ Linux 版本显示 GNOME、Red Hat、Fedora 或 Ubuntu 的标志）即可显示开始菜单。开始菜单的快捷键通常是 `ALT+F1`。通过开始菜单，你可以执行几乎所有的操作，并访问文件、网络、已安装的应用、命令和偏好设置。面板上可能还有额外的菜单。\n\
  *   **通知区域（Notification Area）**——通常是面板的一部分，显示某些应用程序的状态图标；例如，扬声器量图标、网络状态图标、系统更新可用图标、新邮件图标等。鼠标悬停或点击通知图标可查看更多信息和可用操作。通知区域通常位于面板的右侧。\n\
  *   **应用程序窗口（Application Program Windows）**——每个 GUI 应用程序都在自己的窗口中运行。此类窗口作为子窗口显示在根窗口中。多个应用程序窗口可以重叠。你可以通过更改输入焦点（第\
  \ 2.4 节）从一个窗口切换到另一个窗口来切换不同的应用，并根据喜意移动、调整大小、最大化、最小化、取消最大化或关闭每个窗口。\n*   **窗口列表（Windows\
  \ List）**——显示在面板上的按钮列表（图 2.1），每个按钮代表根窗口中的一个应用程序窗口。点击窗口按钮可以最小化或恢复窗口。在较新的 GNOME 桌面上，按下\
  \ `SUPER` 键 [²] 会显示活动概览屏幕，其中带有所有活动窗口的大图标以便于切换（第 2.3 节）。将鼠标快速移动到桌面左上角也可以显示活动概览屏幕。\n\
  *   **工作区切换器（Workspace Switcher）**——工作区切换器允许你使用多个工作区并在之间切换。工作区本质上是复制的根窗口，为放置额外的应用程序窗口提供更多空间。通过多个工作区，你可以分散应用程序窗口以便于使用。可以在面板上或通过进入活动概览屏幕找到工作区切换器。你的根窗口一次显示一个工作区。可见的工作区就是你当前的工作区。点击切换器更改当前的工作区。\n\
  *   **桌面对象（Desktop Objects）**——在根窗口中由面板留出的宽敞空间内，你通常可以放置对象（图标），如文件、文件夹和应用程序启动器以便于访问。桌面对象通常包括：（1)\
  \ 用于访问文件和可移动介质的“计算机”或“位置”图标，(2) 用于主文件夹的“主”图标，以及 (3) 用于恢复删除文件的“垃圾桶”图标。这些桌面图标代表用户\
  \ $Desktop 文件夹中的文件。换句话说，将文件放在 Desktop 文件夹中可以在桌面上创建一个相应的图标。\n\n### 2.3 GNOME 3 桌面\n\
  \n与之前的设计有本质不同，GNOME 3（2016 年 9 月发布版本 3.22）桌面在 GUI 设计中采用了整体方法。因此，GNOME 3 的工作方式与许多传统的桌面环境有所不同。它引入了图形化的\
  \ GNOME Shell 作为用户控制 GNOME 3 桌面的唯一地方，提供了简单高效的操作，如应用查找/启动、窗口/工作区切换以及访问收藏应用。\n\n![image](img/00020.jpeg)\n\
  图 2.2 带有扩展的 GNOME 3 面板\n\n在顶部面板下方（图 2.2），GNOME Shell 使用了两个全尺寸显示区域：\n\n*   **应用窗口显示（App\
  \ Windows Display）**——这是根窗口，专门显示当前活动应用程序的重叠窗口。在启动任何应用之前，默认情况下，你会看到面板下方的空白。\n*  \
  \ **活动概览（Activities Overview）**——显示左侧用于启动收藏应用的 Dash（启动栏）、一个应用搜索框、图标化的活动应用窗口以及右侧的工作区切换器（图\
  \ 2.3）。\n\n![image](img/00021.jpeg)\n图 2.3 GNOME 3 活动概览\n\n将鼠标快速移动到屏幕左上角（或按下 `SUPER`\
  \ 或 `WINDOWS` 键）可以在上述两个显示之间切换。\n\nGNOME Shell 可以以许多方式配置和自定义。你可以使用 `gnome-tweak-tool`\
  \ 配置设置并添加 Shell 扩展（图 2.2）。例如，你可以启用桌面图标来显示 Desktop 文件夹中的文件。\n\n在 GNOME 3 中，多功能的 Shell\
  \ 扩展机制取代了在面板上添加小部件和菜单的 applet。例如，你有扩展可以为顶部面板提供应用程序菜单、位置菜单、天气指示器等。\n\n面板上显示有一个偏好小部件用于管理扩展。命令\
  \ `gnome-shell-extension-prefs` 具有相同的作用。\n\n集成 GNOME 3 的发行版包括 openSUSE、Fedora、Ubuntu\
  \ Gnome、Debian 和 Linux Mint Cinnamon。\n\n### 2.4 理解 GUI\n\n图形用户界面允许用户通过鼠标移动、按下按钮、触控板（触摸屏）手势以及键盘按键进行控制。这些被称为用户输入事件。GUI\
  \ 通过监控此类事件、将其与屏幕上显示的图形元素相关起来，并快速处理每个事件以实现所需效果。\n\n当启动 GUI 应用程序（如 Web 或文件浏览器）时，它通常会在新窗口中创建一个良好的图形显示，然后除了等待用户输入外什么都不做。当发生此类输入事件时，GUI\
  \ 应用程序会对事件做出反应，快速处理它，并回到无操作状态——准备好处理下一个事件。\n\n当输入事件发生时，GUI 环境会创建一个事件对象（数据结构），其中包含事件属性（例如事件类型、鼠标位置、按钮\
  \ ID 或键码），并将事件对象传递给应该接收并处理该事件的程序。\n\n在处理多个窗口工作时，始终有一个窗口具有输入焦点，被称为当前窗口。所有输入事件都将传递给当前窗口及其其中运行的应用程序。桌面允许用户通过点击或选择窗口来轻松更改当前窗口。\n\
  \n当前窗口内的特定部分实际上可能会获得输入焦点。例如，点击显示的三个按钮之一会将事件发送给被点击的按钮，而不是其他按钮。在填写表单时，按键会被传递到具有输入焦点的输入字段（如名称、电子邮件或地址）。通常，点击鼠标会将输入焦点移动到点击位置，按下\
  \ `TAB` 键会将输入焦点移动到窗口内的下一个元素。\n\n\n\n\n\n当你的输入没有得到响应时，通常是因为你的输入被发送到了一个无法识别的地方。换句话说，输入焦点位于错误的位置。纠正你的输入焦点即可解决此问题。\n\
  \n## 2.5 使用桌面\n\n熟悉桌面的最佳方法之一是学习如何使用它完成特定任务。以下是一些对新 Linux 用户来说重要的任务。\n\n### 会话控制与系统设置\n\
  \n你可以通过点击面板（Panel）上的电源开关图标（通常在右侧）来控制登录会话，允许你管理网络连接、当前用户、音量、锁屏、注销登录、重启和系统关机。图 2.4\
  \ 显示了 Linux Mint 会话控制。\n\n![image](img/00022.jpeg)\n\n图 2.4 系统控制\n\n你还可以控制许多其他系统设置，如鼠标、键盘、显示器和设备（打印机、扫描仪、摄像头等）。点击时间/日期显示进行设置。图\
  \ 2.5 显示了系统设置界面。\n\n![image](img/00023.jpeg)\n\n图 2.5 系统设置\n\n### 启动应用程序\n\n桌面最主要的目的可能是帮助你运行和管理应用程序。Linux\
  \ 提供了大量的应用程序。你可以在开始菜单中找到许多程序，它们被组织成几个通用组，如附件、办公、图形、Internet、编程、多媒体、游戏等。此外，还有许多可以在终端窗口的命令行调用的命令。\n\
  \n事实上，你有多种方法启动应用程序：\n\n* 使用应用搜索查找并启动可用应用。如果系统中未安装某应用，可以从 Linux 软件商店下载并安装。\n* 单击启动器图标（你可以为任何喜欢的程序添加启动器）。\n\
  * 根据你的偏好设置，单击或双击桌面或文件浏览器上显示的可执行对象/文件。\n* 从开始菜单或其子菜单中选择应用程序。\n* 在终端窗口或从命令弹出对话框中发布命令（尝试\
  \ `ALT-F2`）。\n\n如果你为尚未安装的程序发布命令，你的 Linux 甚至可能会为你自动下载并安装它。\n\n要从命令行启动图形化应用程序（例如 `gedit`）且不让\
  \ Shell 等待其完成或涉及 Shell 作业控制机制，请使用：\n\n```\n(gedit filename &)\n```\n\n通过这种方式，子 shell\
  \ 将图形化应用程序放在后台运行，使其与终端窗口分离，并将命令提示符还给你。\n\n### 管理文件\n\n文件管理对任何用户来说都是重要的。点击 `Places->Home`\
  \ 浏览用户的文件/文件夹。点击 `Places->Computer` 浏览整个系统的文件/文件夹，包括插入的驱动器。\n\n每个用户的家目录通常包含这些标准文件夹：文档（Documents）、下载（Downloads）、音乐（Music）、图片（Pictures）、视频（Videos）和垃圾（Trash）。如果你的\
  \ Linux 提供 Web 服务，每个用户可能还有一个 `public_html` 文件夹，用于存放个人网页。在操作 Linux 电脑时，还可以建立其他文件和文件夹。\n\
  \n文件和文件夹可以移动到垃圾箱，并在清空垃圾箱时（通过垃圾箱的文件菜单）最终被丢弃。也可以从垃圾箱中恢复项目。垃圾箱文件夹位于用户的家目录下，有时位于隐藏文件夹下（例如\
  \ `.local/share/Trash`）。\n\n右键点击桌面对象可以对其重命名、移动到垃圾箱、设置访问权限或其他进行管理。\n\n![image](img/00024.jpeg)\n\
  \n图 2.6 路径菜单\n\n### 多工作工作空间\n\n当你操作 Linux 时，桌面工作空间可能会因为多个应用程序窗口而迅速变得拥挤。幸运的是，你可以设置多个工作空间，并在它们之间进行切换以处理不同的任务。例如，你可以设置一个工作空间用于网页浏览，另一个用于电子邮件和即时消息，再一个用于文本编辑和文字处理，此类推。\n\
  \n对于基于 GNOME 3 的系统，可以在活动概览（activity overview）的右侧找到工作空间切换器。使用它可以添加、切换和删除工作空间。快捷键（通常为\
  \ `ALT-UP` 和 `ALT-DOWN`）可以快速切换工作空间。\n\n当你进入不同的工作空间时，活动显示会变化，显示当前工作空间中的窗口。\n\n在其他桌面系统中，你可以在面板中添加工作空间切换器。这将为你默认提供四个工作空间。右键点击切换器以根据喜好进行自定义。\n\
  \n### 桌面外观\n\n你可以自定义桌面显示的外观感受。在桌面工作区域的空白处右键点击并选择“更改桌面背景”来寻找你喜欢的背景。\n\n对于 GNOME Shell，你可以使用\
  \ GNOME 优化工具（`gnome-tweak-tool`）来自定义 GNOME 桌面外观的许多方面，包括从许多设计精美的主题中选择。\n\n## 2.6\
  \ 窗口\n\n### X 窗口系统\n\n在 Linux/Unix 中，图形应用程序使用 X 窗口系统（最初开发于马萨诸塞学院）来创建 GUI。窗口软件如 `X`\
  \ 允许基于像素的图形显示，并允许窗口、菜单和鼠标与应用程序交互。X 窗口系统作为 GUI 服务器（`X server`）工作，允许客户端程序（`X clients`）通过\
  \ GUI 与用户交互。`X clients` 可以连接到运行在同一主机上的本地 `X server` 或运行在网络远程主机上的远程 `X server`。此外，`X\
  \ server` 可以处理多个站点，每个站点可能有多个显示器。（有人想给你的 Linux 桌面电脑配两个或三个 20 英的 LCD 显示器吗？）\n\n对于\
  \ Linux，`X server` 是基础性的，并在启动序列中启动。如果 `X server` 未运行，没有任何 GUI 程序可以工作。图中显示了 X 窗口系统的架构。\n\
  \n![image](img/00025.jpeg)\n\n图 2.7 X 窗口系统架构\n\n当一个 `X client` 启动时，它需要连接到运行在本地主机或远程计算机上的\
  \ `X server`。`X server` 始终通过 `display` 指定。例如，\n\n```\nxclock -display hostname :\
  \ s . m\n```\n\n表示 `xclock` 的显示将在 `hostname` 上渲染，站点号为 `s`，显示器编号为 `m`。计算机上的站点由键盘、指针设备（鼠标）和一个或多个图形显示器组成。一台计算机可以有一个或多个站点，每个站点各有一个或多个显示器。\n\
  \n如果 `X server` 是本地的（与客户端在同一主机上），则可以省略 `hostname` 部分。对于单显示器计算机，显示器站点标记 `:0.0` 通常也可以省略。\n\
  \nShell 环境变量 `DISPLAY` 指定了任何未使用显式 `-display` 选项启动的客户端程序的默认 `X server`。尝试命令：\n\n\
  ```\necho $DISPLAY\n```\n\n很可能的结果是字符串 `:0.0`。\n\nX11 已经使用了多年，经验告诉我们它在许多方面都可以改进。Wayland\
  \ 是正在开发的新窗口系统之一，旨在实现紧凑、高效且与硬件有更好的连接性。Fedora 是一个正在转向支持 Wayland 作为 X11 替代方案的 Linux\
  \ 发行版。然而，此时 X11 仍然是大多数 Linux 发行版的标准窗口系统。\n\n### 窗口管理器\n\n\n\n\n\n你通过窗口管理器（window\
  \ manager）来控制显示在桌面桌面上的窗口。窗口管理器是 X Window 系统环境中控制显示窗口的软件。任何窗口的打开、关闭、尺寸、位置、边框和装饰都由窗口管理器管理。X\
  \ Window System 要求窗口管理器作为一个客户端而非内置程序。通过这种方式 X 可以与许多不同类型的窗口管理器配合工作。原始窗口管理器之一是 `twm`。\n\
  \n你的桌面环境与窗口管理器配合，在屏幕上显示应用程序窗口（图 ）。\n\n`Mutter` 是 GNOME 3 的默认窗口管理器，取代了 `Metacity`。GNOME\
  \ Shell（第 1.3 部分）作为 `Mutter` 的插件实现，专门为大屏幕工作站设计。其他许多窗口器的示例包括 `i3`、`XMonad`、`AwesomeWM`、`Enlightenment`\
  \ 和 `Fluxbox`。\n\n你可以使用标题栏上的普通按钮轻松最小化、最大化/还原或关闭窗口。如果你关闭应用程序的所有窗口，该应用程序将被关闭。右键点击窗口标题栏通常会显示窗口菜单，你可以从中控制窗口。通过按住标题栏并拖动可以移动窗口，通过按住并拖动框架侧边或角落可以调整窗口大小。\n\
  \n窗口位于创建时所在的工作区，但你可以根据需要将其移动到另一个工作区。工作区中的窗口可能会重叠。点击窗口或其活动图像会将输入焦点转移到该窗口并将其置于顶层。\n\
  \n### 窗口信息 (#part0003.html_C3tocsec2_3008)\n\n在 X Windows 下，所有窗口形成一个包含层次，其中根窗口（root\
  \ window）位于顶端。每个窗口都有唯一的窗口 ID。根窗口的 ID 为 `root`。`xwininfo` 命令显示窗口 ID 以及关于任何窗口的许多其他信息。运行\
  \ `xwininfo`，然后点击任何目标窗口即可显示信息。这里是 Firefox 窗口的示例（例: ex02/xwininfo）。\n\n```\nxwininfo:\
  \ Window id: 0x1800010Absolute upper-left X: 470Absolute upper-left Y: 64Relative\
  \ upper-left X: 10Relative upper-left Y: 45Width: 1448Height: 984Depth: 24Visual:\
  \ 0x304Visual Class: TrueColorBorder width: 0Class: InputOutput. . .Corners: +470+64\
  \ -2+64 -2-32 +470-32-geometry 1448x984--8+19\n```\n\n注意窗口 ID 是一个十六进制 `0x1800010`。\n\
  \n现在让我们来看 Linux 上一些实用的 GUI 应用程序。\n\n### 2.7 文件浏览器 (#part0003.html_C2tocsec2_2007)\n\
  \n任何操作系统的一个重要方面都是存储和管理文件的能力。Linux 文件系统具有分级结构。在 Linux 文件系统中，普通文件、目录（文件夹）或硬件设备（特殊文件）都被视为文件。目录（文件夹）是一个记录其包含的文件名称和属性的文件。包含的任何文件反过来是文件夹。\n\
  \nLinux 文件系统是包万物的，因为 Linux 中的几乎所有内容在文件系统中都有表示。第 6 章详细讨论了 Linux 文件系统。\n\n文件浏览器或文件管理器提供了一个管理文件的\
  \ GUI。它帮助你导航 Linux 文件系统并视觉化地管理你的文件。`Nautilus`（图 ）是随 GNOME Shell 附带浏览器。\n\n![image](img/00026.jpeg)\n\
  \n图 2.8 Nautilus 文件管理器\n\n使用如下命令：\n\n```\nnautilus folderLocation\n```\n\n来浏览任何所需的文件夹。像这些特殊的\
  \ URI（资源标识符）也是起作用的：\n\n```\nnautilus computer:///\nnautilus trash:///\nnautilus\
  \ network:///\nnautilus smb:///\n```\n\n其他文件管理器包括 `Konqueror`、`Dolphin`、`GNU Midnight\
  \ Commander` 和 `PCManFM`。文件浏览器允许你交互式导航文件系统、管理文件和文件夹、访问计算机上的特殊位置、使用光驱并到达可用的网络位置。\n\
  \n#### 浏览文件树 (#part0003.html_C3tocsec2_3009)\n\n你通过遵循文件夹-子文件夹路径来浏览文件系统，直到找到目标文件。因此，在任何给定时间，你都位于当前目录。当前目录的内容可以用列表视图或图标视图显示，你可以轻松在它们之间切换。建议使用图标视图以获得更方便的视觉交互。\n\
  \n双击文件夹打开它并查看其中的文件，点击向上按钮移动到当前文件夹的父文件夹。位置框（Location box）显示从根目录 `/` 到当前目录的路径。通常情况下，任何以点（`.`）开头命名的文件都是隐藏的。选择“查看->显示隐藏文件”来揭露它们。\n\
  \n#### 打开文件或文件夹 (#part0003.html_C3tocsec2_3010)\n\n双击文件夹打开它并显示其内容。双击普通文件用默认应用程序打开它，例如，用\
  \ `evince` 打开 PDF 文件，用 `gedit` 打开 `.txt` 文件，或使用你偏好的 Web 浏览器打开 `.html` 文件。右键点击普通文件用你选择的任何应用程序打开它，该应用程序将被记住运行该特定类型文件的选项。通过右键点击，你还可以选择将文件/文件夹移到垃圾桶、用所需的应用程序打开它或更改其属性，包括访问权限（见第\
  \ 1.7.5 部分）。\n\n#### 查找文件 (#part0003.html_C3tocsec2_3011)\n\n点击搜索按钮获取搜索框。在要查找的文件名或内容中输入字符串并按\
  \ `ENTER`。将显示搜索结果。如果找到的文件太多，你可以通过文件类型或创建时间缩小搜索范围（图 ）。\n\n![image](img/00027.jpeg)\n\
  \n图 2.9 Nautilus 文件搜索\n\n#### 管理文件和文件夹 (#part0003.html_C3tocsec2_3012)\n\n从文件显示区域，你选择一个或多个文件进行管理。点击（或按\
  \ `CTRL` 点击）文件或文件夹以选择它。使用 `CTRL` 点击选择额外项目。被选中的项目会被高亮显示。在图标视图中，你可以在在一组图标周围拖动一个矩形来选择它们。\n\
  \n做出新选择将取消之前的选择。如果你在高亮项目上按 `CTRL` 点击或点击文件显示区域的空白处，选择也将被取消。\n\n做出选择后，你可以对选中的文件执行操作。\n\
  \n*   将选中的项目拖动到文件夹（或桌面，本质也是文件夹）中将其移动到那里。\n*   抓取选择，然后按住 `ALT` 并拖动到一个新文件夹并释放鼠标。然后选择你想要的操作，包括移动到此处、复制到此处或在此处创建链接。链接是指向实际文件的快捷方式或指针（见章节）。\n\
  *   在你的选择上右键点击以查看可用操作。这些包括移动到垃圾桶、打开方式、复制、发送到和更改文件属性（名称、权限、打开此类类型文件的应用程序列表等）。\n\n\
  #### 文件和文件夹的访问控制 (#part0003.html_C3tocsec2_3013)\n\n在 Linux 上，文件由创建它的用户所有。文件所有者可以设置文件权限以控制哪些用户对其具有什么访问权限。\n\
  \n\n\n\n用户也被组织成组。一个用户可以属于多个组。`/etc/groups` 文件列出了所有组及其成员。文件所有者还可以将组属性设置为所有者所所属的任何组。\n\
  \n作为文件所有者，你可以为三组不重交的用户设置读（r）、写（w）和执行（x）权限：文件所有者（u）、文件组中的其他用户（g）以及所有其他（o）。每个权限都独立于其他权限。例如，一个文件可能对\
  \ `u` 没有权限，但对 `o` 具有 `r` 和 `w` 权限。这在实践中可能意义不大，但它确实说明了 `u`、`g` 和 `o` 权限是独立的这一观点。每个权限的含义如下：\n\
  \n- `r`—打开文件或查看文件夹内容的权限\n- `w`—修改文件或在文件夹中创建或删除文件的权限\n- `x`—作为程序运行文件或进入文件夹以访问其中包含文件的权限\n\
  \n你可以通过右键点击文件并选择属性对话来设置/更改权限并管理与文件相关的应用程序（图 2.10）。\n\n![image](img/00028.jpeg)\n\
  图 2.10 文件属性\n\n根用户是系统管理员，拥有文件系统中所有文件的所有权限，无论文件权限设置如何。\n\n### 刻录 CD 或 DVD\n\n要创建数据\
  \ CD，请点击 菜单上的 CD/DVD 创建器选项，或直接将空白光盘插入光驱。这将打开一个特殊文件夹（`burn:/ / /`）。将你想要写入光盘的文件和文件夹拖入\
  \ burn 文件夹。准备好后，点击“刻录到磁盘”按钮。\n\n要复制 CD/DVD，只需将光盘插入光驱驱动器，右键点击生成的桌面图标（或从“计算机”图标找到它），并选择“复制光盘”。\n\
  \n或者你可以启动如 `Brasero` 等 CD/DVD 工具来执行所需的操作。\n\n### 更改你的默认文件管理器\n\n当你点击/双击文件、文件夹、位置（Places）或计算机时，系统会自动使用默认文件管理器。如果你想使用当前默认之外的文件管理器，可以按照以下步骤更改你的默认文件管理器。\n\
  \n1. 下载并安装你喜欢的文件管理器。最方便的方法是使用包管理器（章节 8.2）。如果你没有根权限，请要求管理员为你操作。\n2. 在 `/usr/share/applications`\
  \ 中找到已安装的文件管理器。例如，`ls /usr/share/applications` 可能显示两个可用的文件管理器：\n\n```\norg.gnome.Nautilus.desktop\n\
  org.kde.dolphin.desktop\n```\n\n要将默认文件管理器更改为 `dolphin`，执行此命令：\n\n`xdg-mime default\
  \ org.kde.dolphin.desktop inode/directory application/x-gnome-saved-search`\n\n\
  这将 `Dolphin` 设置为打开任何文件夹类型 `inode/directory` 文件的默认应用程序。\n\n### 2.8 终端窗口\n\n由于 Linux\
  \ 基于 UNIX，并提供了许多在字符终端下运行的程序，因此提供了字符终端仿真程序来运行此类应用程序。流行的终端仿真器包括 `Gnome Terminal`、`konsole`、`Terminator`、`Sakura`、`Gnome\
  \ Guake` 以及最近的 `Tilix`。在某些系统上，键盘快捷键 `CTRL+ALT+T` 可以启动默认终端。\n\n需要终端窗口的 Linux 命令包括\
  \ `bash`（默认 Linux Shell）、`vim`（文本编辑器）、`ssh`（安全远程登录）、`sftp`（安全文件传输）以及许多其他命令行应用程序，如\
  \ `ls`（目录列表）、`rm`、`mv`、`more`、`man`（显示手册页）等。\n\n经典的 `xterm` 终端仿真器在大多数 Linux 发行版可用，但用户通常倾向于使用\
  \ `gnome-terminal` 等替代方案。\n\n我们在这里讨论 `GNOME Terminal`。其他终端的工作方式非常相似。\n\n![image](img/00029.jpeg)\n\
  图 2.11 启动终端\n\n### 启动 GNOME Terminal\n\n`GNOME Terminal` 仿真基于字符的计算机终端，允许你运行 Shell\
  \ 或命令行应用程序。其工作原理如下：`GNOME Terminal` 仿真来自 X 联盟的 `xterm`，而后者又可以仿真各种 DEC（数字设备公司）终端，如\
  \ `VT220` 和 `VT320`。\n\n从开始菜单、应用程序菜单或活动仪表（Activity Dash），你可以轻松启动 GNOME 终端，它将默认运行\
  \ `Bash`（图 2.11）。在没有自定义的情况下，终端属性由默认配置指定。你可以通过 `Edit -> Current Profile` 菜单选项自定义终端窗口的尺寸、字体、颜色和其他属性。\n\
  \n通过创建不同的终端窗口配置并为它们命名，你可以将它们用于运行的多个 `GNOME Terminals` 实例。假设你已经将喜爱的窗口配置保存为 `main`。\n\
  \n由于快速访问终端非常方便，我们建议你添加一个终端启动器来启动你自定义的终端窗口。按照以下步骤创建一个新的应用程序启动器：\n\n1. 从命令行执行 `cd\
  \ $HOME/.local/share/applications`\n2. 创建新启动器 `vi my-new-launcher.desktop`\n3. 在文件中写入以下行：\n\
  \n```\n[Desktop Entry]Type=ApplicationEncoding=UTF-8Name=My-Gnome-TerminalComment=defined\
  \ manually by Paul WangExec=gnome-terminal --window-with-profile=monkey --title=Main-WindowIcon=utilities-terminalTerminal=falseStartupNotify=true\n\
  ```\n\n赋予 `Exec` 属性的值是在点击启动器图标时调用的命令。\n\n有关启动器的更多示例，请查看 `/usr/share/applications`\
  \ 文件夹中的 `.desktop` 文件。\n\n### 终端窗口与 Shell\n\n当你启动一个终端窗口时，你指定的 Shell（默认为 `bash`）将是窗口中运行的应用程序。Shell\
  \ 可以作为普通 Shell 或登录 Shell 在窗口中运行。`GNOME Terminal` 允许你在窗口配置设置中做出此选择。区别在于，普通 Shell\
  \ 只读取 Shell 初始化文件，而登录 Shell 还会读取 Shell 登录初始化文件（章节 3.13）。\n\n在某些情况下，你可能想启动终端窗口来运行\
  \ Shell 以外的其他程序。例如：\n\n`gnome-terminal -e \"ssh -X pwang@tiger.cs.kent.edu\"`\n\n\
  这会在终端窗口中运行 `ssh` 命令而不是 Shell。结果是打开一个 `GNOME Terminal` 连接到远程主机 `pwang@tiger.cs.kent.edu`\
  \ 以供用户 `pwang` 登录。\n\n当应用程序（无论是 Shell 还是其他程序）终止时，终端窗口将关闭。\n\n### 选择、复制和粘贴\n\n通常情况下，使用屏幕上已经显示的内容避免重复输入信息是节省时间并保持准确性的良好做法。通过\
  \ `GNOME Terminal` 以及其他文本显示窗口（如浏览器窗口或文本编辑器窗口），你可以轻松地选择、复制和粘贴文本。\n\n- `Select`—按下左鼠标键，点击一个字符、双击一个单词或三击一行，然后将鼠标拖过文本区域以高亮并选择所需的文本。\n\
  - `Copy`—只需选中文本即可将其复制到剪贴板。你也可以右键点击高亮文本（或使用 `Edit -> Copy` 菜单选项）显式地将文本复制到缓冲区。剪贴板或缓冲区中的任何之前的内容都会丢失。\n\
  - `Paste`—进入目标应用程序，在需要的地方放置输入光标，然后点击鼠标中间键从剪贴板粘贴。或者使用目标应用程序窗口的 `Edit -> Paste` 选项从缓冲区粘贴。\n\
  \n`GNOME Terminal` 会记录已显示的文本行（默认为 500 行）。使用滚动条来回查看文本。\n\n### 网页与电子邮件链接\n\n\n\n\n\
  \nGNOME Terminal 可以识别 Web 地址和电子邮件地址。例如，它可以识别 [`www.kent.edu`](http://www.kent.edu)\
  \ 和 pwang@cs.kent.edu。\n\n将鼠标光标悬停在此类地址上，它会自动变为下划线，表明 GNOME Terminal 已识别该地址。右键点击并选择“打开链接（发送电子邮件至）”选项，可以直接启动\
  \ Web 浏览器（电子邮件应用程序）。此功能非常方便。\n\n响应此类用法启动的应用程序由你在开始菜单下的“首选应用程序”设置定义。\n\n## 2.9 访问帮助和文档\n\
  \n`gnome-help` 命令或等效的 `yelp` 命令可以让你轻松访问 GNOME 桌面的信息。Web 搜索将带你找到特定 Linux 发行版的文档。\n\
  \n通常情况下，任何应用程序菜单栏上的“帮助”按钮都会引导你进入该特定应用程序的文档和用户指南。\n\n## 2.10 总结\n\nLinux 的 GUI 支持通过桌面提供，桌面一直在不断演进和改进。现代\
  \ Linux 发行版获得更广泛的认可，在很大程度上归于良好的 GUI 和实用的 GUI 应用程序。\n\nGNOME 和 KDE 是 Linux 上两个广泛使用的\
  \ GUI 环境。它们都依赖于底层的窗口系统来实现图形显示和窗口支持。熟悉并熟练使用 GUI 可以让 Linux 生活变得更简单，提高你的效率。GNOME 3\
  \ 是最最新、强大且流行的桌面。\n\n主要的桌面组件包括面板（Panel）、启动按钮、应用程序菜单、系统偏好菜单、根窗口、活动应用窗口、Dash、应用搜索框和工作区切换器。\n\
  \n`gnome-terminal` 可以自定义，你的设置可以保存到配置文件中重复使用。一个舒适的终端窗口可以让 Linux 生活变得简单得多。\n\nGNOME\
  \ Nautilus 文件浏览器提供了一个视觉环境，用于浏览文件树以及管理文件、文件夹及其属性。其他实用的 GUI 应用程序包括图像处理、文档准备/查看、音视频播放以及创建\
  \ CD 和 DVD。第 4 章将讨论更多的 GUI 应用程序。\n\n## 2.11 练习\n\n1. 你如何将面板移动到根窗口的顶部或底部？在 GNOME\
  \ 3 中可以实现吗？\n2. 你如何让面板跨越根窗口的整个宽度或在顶部/底部居中？\n3. 在面板上或面板内找到注销图标。有切换用户的方法吗？\n4. 找出如何锁定屏幕以及如何让系统进入睡眠。\n\
  5. 你的桌面有工作区切换器吗？如果没有，请描述如何创建一个。\n6. 可以添加/删除工作区吗？如何操作？\n7. 描述如何在你的桌面上查找并启动应用程序。你有权限访问“应用搜索”功能吗？你如何找到可以在你的发行版上安装的应用程序？\n\
  8. 如何在桌面上放置一个模拟时？\n9. 描述如何在桌面上放置电源管理启动器。\n10. `eog` 是什么？在桌面上放置它的启动器。\n11. `evince`\
  \ 是什么？在桌面上放置它的启动器。\n12. 正确设置终端窗口可以极大提高你使用 Linux 命令行界面的舒适度。考虑命令 `gnome-terminal --geometry=80x30+350+150\
  \ --window-with-profile=main` 并解释其含义。为自己创建一个包含颜色、字体和其他偏好的命名配置文件。为自己创建一个面板启动器来启动你自定义的\
  \ `gnome-terminal`。\n13. 在 Linux 上，哪种 GUI 应用程序可以处理 MS Word 和 Excel 文档？在电脑上安装它并在桌面上放置图标。\n\
  14. 刻录数据 CD 并描述你的步骤。\n\n[1] 1983 年的成本约为 1 万美元。\n[2] 也称为 WINDOWS 键。\n\n## 第 3 章：与\
  \ BASH Shell 交互\n\n正如我们所说的，除了 GUI 之外，Linux 还提供了高效且强大的命令行界面 (CLI)。起初，Unix/Linux 系统没有\
  \ GUI，只有 CLI。现在，许多命令也有对应的 GUI 版本，因此它们更易于使用。\n\nCLI 由一个名为 Shell 的程序提供，仍然是 Linux 用户的的重要接口。Shell\
  \ 通常运行在诸如 `gnome-terminal` 或 `konsole`（第 1 章，第 1.2 节）之类的终端窗口中。它接收用户（键盘）的输入，并作为命令解释器来启动应用程序并执行所有其他可用操作。\n\
  \n许多 Linux 应用程序源自 UNIX，并在图形显示成为标准之前编写。其他程序则选择不使用任何 GUI。这些命令行应用程序往往更高效（对计算机的负担较小、更容易与其他程序结合、且跨网络访问简单），但对初学者来说可能更困难。GUI\
  \ 应用程序在交互学习和使用上通常更直观，但在其他程序内部控制或运行可能较困难。\n\n当从另一个主机（如 PC（Windows 或 Mac）或 Linux 盒子）通过远程登录程序如\
  \ `SSH`（第 1 章，第 1.2 节）或 `Telnet` 访问 Linux 系统时，全 GUI GUI（第 2 章）很难实现，Shell 通常是唯一可行的用户界面选择。\n\
  \n我们已经知道 Linux 提供许多不同的 Shell，包括 `Sh`（原始的 Bourne Shell）、`Ksh`（Korn Shell）、`Csh`（Berkeley\
  \ C Shell）、`Tcsh`（TC Shell，改进的 C Shell）和 `Bash`（Bourne-Again Sh）。用户可以选择使用哪种 Shell。尽管这些\
  \ Shell 有可比性，但 `Bash` 是 Linux 系统上的标准和首选 Shell。\n\n我们将在本章介绍 Bash 的交互式用法。Bash 编程将在第\
  \ 5 章介绍。\n\n### 3.1 Bash\n\n`Bash` 于 1987 年为 GNU 项目（自由软件基金会）开发，是一个基于原始 `Sh`（Bourne\
  \ Shell, 1978）的免费 Shell。`Bash` Shell 整合了 `Sh`、`Ksh`、`Csh` 和 `Tcsh` 的特征；添加了新功能如 Shell\
  \ 定义函数；并符合 IEEE POSIX 规范。\n\n今天，`Bash` 是 Linux 系统上流行的 Shell。Bash 的改进版本定期发布。通常，你的默认\
  \ Shell 是 `/bin/bash`。如果不是，始终可以使用命令将默认 Shell 设置为 `/bin/bash`（推荐）：\n\n```bash\nchsh\
  \ -s /bin/bash\n```\n\n在 Bash Shell 中，命令\n\n```bash\necho $BASH_VERSION\n```\n\n\
  显示其版本信息。在阅读本章时，准备好 Bash 进行实验是一个好主意。\n\n### 3.2 与 Bash 交互\n\n在终端模拟器窗口内部，`Bash` 作为你的命令解释器并不断执行命令解释周期：\n\
  \n1. 显示提示符\n2. 允许用户输入、编辑并进入下一行命令行\n3. 将命令行拆分为标记（单词和操作符）并执行定义良好的 Shell 扩展，转换命令行\n\
  4. 执行（通过调用 Shell 级函数）或启动（通过启动外部程序）请求的操作\n5. 等待启动的操作完成\n6. 回到第 1 步\n\nBash 的默认提示符是\
  \ `$`，但可以自定义以变得更有用（第 3.9 节）。\n\n\n\n\n\n命令行由一个或多个由空格（空格或制表符）分隔的单词组成。按下 `ENTER` 键完成输入并将\
  \ Shell 发到下一步。`ENTER` 键（产生 `NEWLINE` 字符）完成一个命令，除非其前面有一个反斜字符（`\\`），在这种情况下 `ENTER`\
  \ 会被转义。命令中的第一个单词是命令名，指示要执行的程序；其他单词是参数。命令有两种类型：内置命令和普通命令。内置命令调用的是 Shell 的一部分例程（例如\
  \ `cd`）或由用户定义的函数。要执行内置命令，Shell 简单地调用其内部适当的子程序。普通命令是 Linux 中任何未内置到 Shell 的其他可执行程序。这些包括\
  \ `ls`、`rm` 和 `cp` 等系统命令，以及你自己的可执行程序。每个执行中的程序都称为由操作系统控制和管理的进程。你的交互式 Shell 是一个进程。Shell\
  \ 会派生（启动）一个独立的子进程（称为子 Shell）来执行普通命令。正如你将发现的，内置命令和普通命令之间的区别非常重要。\n\n简单的命令只是命令名后跟其参数。如果多个命令之间用分号（`;`）分隔，可以在单行内给出多个命令。Shell\
  \ 将从左到右顺序执行命令。两个用竖线（`|`）分隔的命令形成管道。或运算符（`||`）和与运算符（`&&`）指定命令的条件执行：\n\n`cmd1 || cmd2`（仅在\
  \ `cmd1` 失败时执行 `cmd2`）\n\n`cmd1 && cmd2`（仅在 `cmd1` 成功时执行 `cmd2`）\n\n在 Linux 中，命令成功返回零退出状态，否则返回非零。如果你将一个或多个命令放在括号\
  \ `()` 中，这些命令将由子 Shell 作为一组执行。在发布命令后，不需要在输入额外输入之前等待。这种特性被称为“预输入”（type ahead）。你预输入的内容将在\
  \ Shell 准备好接收下一个命令时就在那里。你也可以通过在命令末尾输入 `&` 来指示 Shell 不要等待命令完成。在这种情况下，Shell 会立即返回你的下一个命令，而之前的命令将在脱离\
  \ Shell 的情况下继续运行。这些脱离的进程继续执行，并被称为在后台运行。例如，\n\n`firefox &` 将启动浏览器并让你回到 Shell 级别，无需等待其完成。后台进程可以通过命令\
  \ `fg` 重新连接到 Shell——即带到前台。请参考第 3.6 节了解作业 ID 和作业控制。前台程序从键盘接收输入。如果我们把作业带到前台，例如可以输入\
  \ `CTRL+C` 来终止它。在任何时刻只能有一个运行的前台程序。\n\n### 3.3 命令行编辑与补全\n\n让我们看看向 Bash 输入内容。我们在第\
  \ 1 章节中已经看到，方向键如何结合 `DELETE` 和 `BACKSPACE` 用于纠正输入错误并重用之前的命令。这些以及其他命令行编辑功能由 `readline`\
  \ 库提供。事实上，你有选择使用 `vi` 或 `emacs`（参见辅助网站的附录）来编辑命令行：\n\n```\nset -o vi\nset -o emacs\n\
  ```\n\n在 `vi` 模式下，你将输入 `ESC` 进入 `vi` 命令模式，然后使用 `vi` 命令进行任何编辑。当你完成命令行编辑后，按下 `RETURN`（或\
  \ `ENTER`）发布命令。在输入命令行时，Bash 以各种有用方式帮助你完成输入。基本上，你通过按下 `TAB` 键触发补全功能。如果有唯一的补全，将完成。如果有多种完成输入的方法，第二个\
  \ `TAB` 将显示选项。例如，如果你输入 `un` 后跟两个 `TAB`，将显示选项列表：\n\n```\nalias uniq unlink uname\n\
  ```\n\n这种技术不仅节省了输入时间，还能向你显示所有给定前缀的 Bash 内置和普通命令，如果你忘记了要使用的确切命令名，这将非常有用。\n\n某些用户喜欢通过在\
  \ `/.inputrc` 的 readline 初始化文件中放入以下内容，在第一次按下 `TAB` 时直接获取列出的选项：\n\n```\nset show-all-if-ambiguous\
  \ on\n```\n\n执行的标准补全包括：\n\n*   命令名补全——补全 Shell 内置命令、别名、函数以及普通命令；在命令行的第一个标记上执行。\n\
  *   文件名补全——补全文件名；在命令的参数上执行。\n*   用户名补全——补全你 Linux 系统上所有用户的用户 ID；在任何以 `~` 开头的单词上执行。\n\
  *   主机名补全——补全域名；在任何以 `@` 开头的单词上执行。\n*   变量名补全——补全现有 Shell 变量名；在任何以 `$` 开头的单词上执行。\n\
  \n此外，`bash-completion` 包（包含在大多数 Linux 发行版）允许你对常用命令的参数进行 `TAB` 补全。例如，`ssh` 命令的参数\n\
  \n```bash\nssh pwang@mTAB TAB\n```\n\n显示\n\npwang@magicalmoments.info pwang@mapleglassblock.com\n\
  pwang@monkey.cs.kent.edu\npwang@mathedit.org\n\n在这些补全之上，你还可以使用 Bash 内置命令 `complete`\
  \ 定义自己的补全，该命令实现了一个可编程补全 API。详见完整文档。\n\nreadline 转义字符 `CTRL+V` 用于引用下一个字符并防止其被 `readline`\
  \ 解析。因此，为了在输入中获得 `TAB` 而不是调用补全函数，你需要输入 `CTRL+V` 后跟 `TAB`。例如，你可以用以下内容定义 `CTRL+L`\
  \ 别名：\n\n```\nalias CTRL+L=clear\n```\n\n### 3.4 Bash 命令执行\n\n命令行由一个或多个由空格（空格或制表符）分隔的单词组成。按下\
  \ `ENTER` 键完成输入并将 Shell 发到下一步。`ENTER` 键（产生 `NEWLINE` 字符）完成一个命令，除非其前面有一个反斜字符（`\\\
  `），在这种情况下 `ENTER` 会被转义。命令中的第一个单词是命令名，指示要执行的程序；其他单词是参数。命令有两种类型：内置命令和普通命令。内置命令调用的是\
  \ Shell 的一部分例程（例如 `cd`）或由用户定义的函数。如果不是，则命令名调用独立于 Shell 的程序实现的普通命令。\n\n在普通命令中，命令名指示一个可执行文件并以两种形式之一存在。可以是可执行文件的绝对或相对路径，或者如果可执行文件在命令搜索路径上，直接使用文件名即可。Shell\
  \ 查找可执行文件的过程如下：\n\n1.  如果命令名是绝对或相对路径，则可执行文件的名称已显式给出，不需要搜索。\n\n2.  如果命令名是简单文件名（不包含\
  \ `/` 字符），则通过命令搜索路径指定的有序目录序列来查找可执行文件。使用沿此搜索路径找到的第一个文件。\n\n\n\n\n\n如果找不到可执行文件，或者找到了文件但未设置文件的执行权限，则会显示相应的错误信息。错误信息可能是“文件未找到”（file\
  \ not found）或“拒绝访问”（permission denied）。\n\nShell 环境变量 `PATH`（第 3.10 节）定义了命令搜索路径，即包含执行命令的目录列表。Shell\
  \ 会按顺序在这些目录中查找你在命令行中输入的任何命令。`PATH` 通常包含系统文件夹 `/bin`、`/sbin`、`/usr/bin` 和 `/usr/sbin`，大多数系统提供的可执行程序都在这里。可以修改搜索路径以包含额外的目录。例如，\n\
  \n```\nexport PATH=$PATH:/usr/local/bin:$HOME/bin\n```\n\n这在 `PATH` 的末尾添加了两个目录：`/local/bin`（你在此处为\
  \ Linux 安装额外的应用程序）以及家目录下的 `bin`。。[¹ 现在，你可以使用简单的文件名来运行其可执行文件位于 `$HOME/bin` 目录的程序。\n\
  \nBash 使用哈希表来加速命令搜索，只有当表中未找到命令时，才需要搜索 `$PATH`（并更新表）。内置命令 `hash`允许你显示和操作此表（参见帮助命令\
  \ `hash`）。\n\n特殊的点符号 `.` 通常被放在搜索路径的末尾，以便你通过简单的文件名调用当前目录下的任何命令。\n\n```\nexport PATH=$PATH:.\n\
  ```\n\n内置命令 `export` 告诉 Shell 将此值传递到执行环境（第 3.10 节），该环境将被后续的普通命令继承。\n\n由于别名（第 3.7\
  \ 节）、用户定义函数（第 3.15 节）以及命令搜索，实际执行的命令可能与你预期的不完全相同。为了确保这一点，你可以通过以下命令进行检查：\n\n```\n\
  which command_name\n```\n\n显示 `command_name` 所调用的别名/函数或可执行文件的完整路径。例如，\n\n```\nwhich\
  \ gnome-terminal\n```\n\n显示\n\n```\n/usr/bin/gnome-terminal\n```\n\n一旦找到可执行文件，Shell\
  \ 会产生一个子进程来运行程序，分为以下三个步骤：\n\n1. 创建一个新的（子）进程，它是 Shell 的副本。\n2. 在子进程上覆盖可执行文件。然后将命令名以及任何参数传递给它。\n\
  3. 交互式 Shell 等待子进程终止后返回接收下一个命令，除非命令末尾带有安培符号（`&`）。如果命令以 `&` 结尾，Shell 将在不等待的情况下直接返回，该命令将在后台运行。\n\
  \n### 3.5 Bash 输入/输出重定向](#part0003.html_C2tocsec3_2005)\n\n到目前为止，我们对 Linux 的使用仅限于发布命令并观察其输出。然而，你肯定希望结果以更有用的形式，无论是纸质打印还是存储在文件中。此外，在许多情况下，你可能希望输入来自键盘以外的地方，例如文件，或者可能来自另一个正在运行的命令或程序。Linux\
  \ 提供了一个优雅的解决方案：输入/输出重定向。\n\n在处理命令行时，Shell 会在执行命令行包含的命令之前安排任何 I/O 重定向。\n\n#### 标准输入和输出](#part0003.html_C3tocsec3_3001)\n\
  \n作为一个操作系统，Linux 为进程提供输入和输出（I/O）服务。对于每个进程，使用一组编号为 0、1、2 等的文件描述符用于进程与操作系统之间的 I/O\
  \ 事务。当进程打开一个文件或设备进行 I/O 时，会为进程分配一个文件描述符，以识别进程与打开的文件或设备之间的 I/O 通道。当创建一个进程时，它的前三个文件描述符会自动分配默认的\
  \ I/O 通道。\n\n- 文件描述符 0，标准输入或简称 `stdin`，连接到键盘用于输入。\n- 文件描述符 1，标准输出或简称 `stdout`，连接到终端窗口用于输出。\n\
  - 文件描述符 2，标准错误或简称 `stderr`，连接到终端窗口用于错误输出。\n\n大多数 CLI 命令从标准输入接收输入，向标准输出产生输出，向标准错误发送错误消息。Shell\
  \ 提供的 I/O 重定向可用于重定向标准 I/O 通道。\n\n#### I/O 重定向](#part0003.html_C3tocsec3_3002)\n\n\
  特殊字符 `>`、`<` 和 `|` 用于 Shell 重定向通过 Shell 用的任何命令的标准 I/O 通道（图 3.1）。\n\n![image](img/00030.jpeg)\n\
  \n图 3.1 I/O 重定向\n\n让我们来看简单的例子。命令行\n\n```\nls > filelist\n```\n\n会在你的当前目录下创建一个名为\
  \ `filelist` 的文件，其中包含 `ls` 命令的输出。符号 `>` 指导 Shell 将 `ls` 的 `stdout` 从屏幕重定向到文件 `filelist`。如果已存在同名文件，它将被删除并用同名新文件替换，除非使用\
  \ Bash 内置命令 `set` 设置了 `noclobber` 选项\n\n``````\nset -o noclobber (开启 noclobber 选项)\n\
  set +o noclobber (关闭 noclobber 选项)\nset -o (显示所有选项)\n```\n\n当 `noclobber` 选项开启时，使用\
  \ `>` 重定向输出到现有文件将导致错误。此功能防止了通过输出重定向意外丢失文件。如果你确实想删除该文件，请在 `>` 之后添加竖线（`|`）。例如，\n\n\
  ```\nls > | filelist\n```\n\n许多用户会在 Bash 初始化文件 `.bash_profile` 中设置 `noclobber` 变量（参见第\
  \ 3.13 节）。一个例外是 `/dev/null` 是一个特殊的数据汇。重定向到它的输出会无痕地消失。当你希望丢弃命令的输出时非常有用。\n\n符号 `>>`\
  \ 的操作方式与 `>` 相似，但它是追加到文件末尾而不是覆盖。例如，\n\n```\ncat file1 >> file2\n```\n\n将 `file1`\
  \ 追加到 `file2` 的末尾。如果 `file2` 不存在，则会创建它。\n\n到为止，我们只讨论了重定向标准输出。但重定向标准错误遵循相同的规则，只是你需要使用\
  \ `2>` 和 `2>>` 来明确指示被重定向的文件描述符。要同时重定向标准输出和标准错误，使用\n\n```\nsomeCommand > file 2>&1\
  \ (stderr 将 stdout 合入文件)\nsomeCommand > file1 2>file2 (发送到不同的文件)\n```\n\n让我们来看另一个例子。\n\
  \n```\ncat > file\n```\n\n在输入此命令后，你在键盘上输入的内容（或复制粘贴的内容）会被放入 `file` 中。键盘输入通过在行开头输入\
  \ `CTRL+D` 终止。\n\n接下来，让我们考虑 `stdin` 的重定向。使用运算符 `<`，可以指示一个从键盘获取交互式输入的命令改为从文件获取输入。例如，\n\
  \n```\nvi textfile < cmd-file\n```\n\n其中 `cmd-file` 包含给 `vi` 文本编辑器的命令。假设 `cmd-file`\
  \ 包含\n\n```\ndd\nZZ\n```\n\n那么 `textfile` 的第一行将被删除。许多 Linux 命令在给出参数时从文件获取输入（例如 `sort\
  \ file`）；使用 `sort < file` 是正确的但没有必要的。\n\n#### 管道](#part0003.html_C3tocsec3_3003)\n\
  \n除了可以将 I/O 重定向到文件和从文件重定向之外，你还可以将一个程序的输出作为另一个程序的输入。竖线符号（`|`）用于建立管道，将第一个命令的输出连接到第二个命令的输入（图\
  \ 3.2）。\n\n![image](img/00031.jpeg)\n\n图 3.2 管道\n\n因此，\n\n```\nls -lt | more\n```\n\
  \n\n\n\n将 `ls -lt` 的标准输出管道到 `more` 的标准输入。由此产生的命令被称为管道（pipeline）。有时对于新用户来说，很难理解 `|`\
  \ 和 `>` 之间的区别。只需记住，管道 `|` 的接收端始终另一个程序，而 `>` 或 `>>` 的接收端始终是一个文件。你可以使用 `|&` 代替 `|`\
  \ 将标准错误与标准输出一起管道化。关于管道的更详尽的示例，请参阅第 4 章第 4.7 节。\n\n# Bash I/O 重定向\n\n![image](img/00032.jpeg)\n\
  \n表 3.1 总结了 Bash I/O 重定向。符号中的可选部分包含在方括号中。\n\n### 3.6 Bash 作业控制\n\n在桌面上，我们知道可以运行多个应用程序，每个运行在不同的窗口中，我们可以将输入焦点从一个窗口切换到另一个。\n\
  \n在单个终端窗口内，Shell 也允许你启动并控制多个命令（称为作业，jobs）。在任何时候，都有一个作业在前台运行并连接到终端窗口的键盘输入。其他作业则在后台运行。我们已经提到过，如果你在\
  \ Shell 级别的命令末尾添加一个 `&`，Shell 将在后台运行该作业。这里是另一个例子。\n\n```\nxclock (在后台运行 xclock)\n\
  ```\n\n然后你可以通过以下命令启动另一个作业，例如用于文本编辑：\n\n```bash\nnano -z notes.txt\n```\n\n该作业在前台运行，允许你通过键盘控制\
  \ `nano` 并执行编辑功能。在任何时候，你你都可以输入 `CTRL+Z` 来挂起前台作业并返回 Shell 级别。如果你这样做了，你将看到 ²\n\n```\n\
  [2]+ Stopped nano -z notes.txt\n```\n\n一个新的 Shell 提示符出现在你的终端窗口中，以确认当前作业已挂起并在后台等待恢复。现在你可以发布任何\
  \ Shell 级别的命令，包括一个启动另一个作业的命令（该作业本身也可以同样地通过 `CTRL+Z` 挂起）。\n\n假设你接着启动了第三个作业，\n\n```bash\n\
  gimp picture.jpg\n```\n\n对图片进行图像处理，然后也挂起它。通过这种方式，可以启动然后挂起或放入后台相当数量的作业，很容易看出这会如何迅速变得难以管理。幸运的是，如果你发布\
  \ Shell 内置命令\n\n```bash\njobs\n```\n\n你将看到显示的所有作业：\n\n```\n[1] 13519 Running xclock\
  \ &\n[2]- 12656 Stopped nano -z notes.txt\n[3]+ 13520 Stopped gimp picture.jpg\n\
  ```\n\n在这种情况下，有有两个作业编号为 `2` 和 `3` 的挂起作业，以及有一个作业编号为 `1` 的作业在后台运行。Shell 还允许你恢复挂起的作业、将后台作业拉入前台，或完全杀死某个作业。\n\
  \n要标识一个作业，使用 `jobid`，它可以通过多种方式给出：`%job-number`、`%name-prefix`、`%+` 和 `%-`。例如，作业\
  \ `%3`、`%+` 和 `%g` 都指向上述示例中的同一个作业。作业 `%+` 总是最近被挂起的（当前作业），而 `%-` 总是上一个被挂起的（上一个作业）。当两个作业之间来回切换时，`%-`\
  \ 非常有用。使用名称前缀形式时，你只需要足够的命令名称前缀来与其他作业区分开。例如，`%vim`、`%vi` 或 `%v` 都指向作业 2。\n\n作业可以通过\
  \ Shell 级别的命令恢复（带回前台）：\n\n```bash\nfg jobid\n```\n\n你可以将命令缩写为直接 `jobid`。例如，`%1`\
  \ 将将作业 1 带到前台，`%+`（或直接使用 `fg`）将恢复当前作业，而 `%-` 将恢复上一个作业。如果没有指定 `jobid`，则最近挂起的作业将被激活并在后台运行。\n\
  \n如果后台作业向 `stdout` 输出内容，它将显示在终端窗口中并干扰任何前台作业的输出。此外，如果后台作业需要终端的输入，它将停止并等待被带回前台以接收所需的输入。因此，为了让作业在后台高效运行，将标准\
  \ I/O 重定向到文件通常是关重要的。\n\n当后台作业终止时，Shell 会显示消息通知用户：\n\n```\n[ jobnumber ] Done command\
  \ as given\n```\n\n该消息在后台进程正常完成后显示。当后台进程异常终止时，会显示以下消息：\n\n```\n[ jobnumber ] Exit\
  \ 1 command as given\n```\n\n要将挂起的作业切换到后台运行，请使用命令\n\n```bash\nbg jobid\n```\n\n\
  使用 `CTRL+Z` 挂起作业与退出或终止它不同。在注销之前，正确地退出所有作业并关闭所有窗口是一个良好的习惯。每个作业都有自己的退出（quit）方式；例如，`nano`\
  \ 使用 `CTRL+X`，`vim` 使用 `:q!` 或 `ZZ`，`mutt` 使用 `q`，以及 Shell 使用 `exit`。\n\n有时你可能需要强制终止一个在前台运行的程序。这可以通过输入中断字符（通常是\
  \ `CTRL+C`）来实现，它会中止执行中的作业并返回 Shell 级别。如果中断字符由于某些原因没有停止你的程序，最后的手段是使用 `kill` 命令。使用\
  \ `CTRL+Z` 挂起作业并进入 Shell 级别，然后输入\n\n```bash\nkill -9 jobid\n```\n\n终止作业。可选参数 `-9`\
  \ 指示 `kill` 向进程发送特定信号，强制其终止。信号在第 11 章第 11.6 节中进一步描述。\n\n除了 jobid，`kill` 还可以接受进程号。命令\n\
  \n```bash\njobs -l\n```\n\n给出所有作业的进程号。\n\n这里讨论的 `kill` 命令是 Bash 内置的。还有一个普通的命令 `/bin/kill`\
  \ 可以使用。除了其他区别外，`/bin/kill` 仅对进程号有效。表 3.2 列出了常用的作业控制。\n\n## 作业控制命令\n\n![image](img/00033.jpeg)\n\
  \n总结来说，作业可能处于三种状态之一：在前台运行、在后台运行或已停止（挂起）。任何时间至多只有一个作业在前台运行，但许多作业可以在后台并发运行。许多也可以被停止。要查看你的\
  \ Shell 控制的作业状态，请使用命令 `jobs`。使用 `fg` 配合 `jobid` 将特定作业从挂起或后台带入前台。使用挂起字符（通常是 `CTRL+Z`）挂起前台作业。使用中断字符（通常是\
  \ `CTRL+C`）杀死前台作业。如果作业已停止或在后台运行，可以通过发布命令 `kill [-9] jobid` 来杀死。\n\n如果你在还有未完成作业的情况下给出\
  \ `exit`（注销）命令，Shell 会提醒你。在退出 Shell 之前结束所有未完成作业是最好的。然而如果你坚持立即退出，Shell 将中止你所有的未完成作业，你的终端窗口将关闭。\n\
  \n### 3.7 Bash Shell 展开\n\n每条命令在被 Shell 执行之前都会经过多次转换。这些转换被称为 Shell 展开，旨在为用户提供功能和便利。例如，你可以使用\n\
  \n```bash\nls -l *html\n```\n\n查看所有以 html 结尾的文件列表。这是因为有了文件名展开（Filename Expansion）。让我们看看这些展开是如何工作的。\n\
  \n![image](img/00034.jpeg)\n\n图 3.3 Bash 展开\n\nBash 通过顺序应用以下展开（见图 3.3）来转换每条命令：\n\
  \n1. 历史展开（History expansion）允许重用以前命令的部分\n2. 别名展开（Alias expansion）将命令别名替换为定义\n3.\
  \ 大括号展开（Brace expansion）处理大括号内的表达式\n4. 波浪号展开（Tilde expansion）将带有 前缀的词展开为特定的目录名称\n\
  \n\n\n\n\n### 5. 变量扩展—将变量替换为其值\n\n### 6. 字符串扩展—解释字符串中的标准转义字符，例如 `n`（换行）、`r`（回车）和\
  \ `t`（制表符），格式为 `$ ’xyz’` 的字符串，例如 `$ ’Name tAge r n’`\n\n### 7. 命令扩展—将命令的输出插入到命令行\n\
  \n### 8. 算术扩展—在命令中包含算术表达式的结果（此功能主要用于 Shell 脚本，将在第 5 章第 5.11 节介绍）\n\n### 9. 进程扩展—指定命令产生的输出作为另一个命令的文件名参数\n\
  \n### 10. 文件名扩展—通过模式匹配将文件名添加到命令行\n\n在完成所有转换后，生成的命令行将被执行。鼓励你在阅读这些扩展描述时尝试这些扩展。用于显示参数扩展后状态的内置命令\
  \ `echo` 非常有用。通过在命令行前加上 `echo`，可以检查除别名（alias）扩展以外的所有扩展效果。\n\n#### 历史扩展](#part0003.html_C3tocsec3_3004)\n\
  \nBash 历史机制记录之前的命令以便重复使用。你发出的每一条命令行（无论成功失败，无论由一个或多个命令组成）都会作为历史列表中的一个项保留，可以使用内置命令\
  \ `history` 显示。历史列表中的每个项被称为一个历史事件，每个事件由一个序列号标识。历史列表中保留的事件总数有一个限制（默认为 500），由以下项设置：\n\
  \n##### 常见历史扩展\n\n![image](img/00035.jpeg)\n\n`HISTSIZE= number`\n\n通常，保留 50 个左右的事件就足够。在\
  \ `.bash_profile` 文件中输入你自己的 `HISTSIZE` 设置（第 3.13 节）是有很有意义的。我们已经从第 1 章了解到，可以使用向上和向下方向键在历史列表中来回移动并重复使用之前的命令。此外，历史扩展允许你只需几次击键即可将历史事件替换到当前命令行中。它还让修改和重新发布过去的命令（或其部分）变得简单。\n\
  \n历史扩展通过感叹号字符（`!`）触发（激活），它通过从历史列表中恢复项来工作。可以从列表中恢复并替换到当前命令中的项包括任何历史事件、任何事件的任何单词或多个单词，以及某些单词的部分。这些项在引入当前命令之前还可以进行修改。表\
  \ 3.3 显示了一些常见的历史扩展。表 3.4 包含了历史扩展在命令中的一些应用。\n\n##### 历史示例\n\n![image](img/00036.jpeg)\n\
  \n此处描述了每个示例，数字对应 表 3.4 中的数字。\n\n1. 重复名称 `file3`。\n2. 名字实际上是一个目录。\n3. 输错了命令名 `sort`。\n\
  4. 目标文件不在当前目录，而在 `dir` 目录中。\n5. `dir` 不在当前目录，而在主目录下。\n6. 注意，字符串替换中允许空格。\n\n在看到许多示例后，你准备好进入历史扩展的通用格式了：\n\
  \n`event [: word designator] [: modifier … ]`\n\n事件通过以下方式之一给出：\n\n| 事件编号 | 描述 |\n\
  | :--- | :--- |\n| 事件编号 | `!12` 提供历史列表上的第 12 个事件。 |\n| 相对位置 | `!-2` 提供最近的第二个事件。特殊情况是\
  \ `!!`，它指上一个事件。 |\n| 命令前缀 | `!nano` 提供前缀为 `nano` 的最近事件。 |\n| 匹配字符串 | `!?string?`\
  \ 提供在任何位置包含字符串的最近事件。 |\n| str1 str2 | `str1 str2` 重复最后一次命令，但用 `str2` 替换 `str1`。\
  \ |\n\n事件之后是可选的单词指示符（word designator）。单词指示符的目的是从历史事件选择某些单词。如果没有使用单词指示符，将选择整个事件。可以使用以下单词指示符：\n\
  \n还可以使用可选的修饰符序列。常用的用法是\n\n`event:s/xx/yy/`\n\n在 `event` 中将字符串 `xx` 替换为 `yy`。如果一个单词是长路径，有时使用修饰符提取它的部分很方便，但大多数修饰符很少交互使用。使用\
  \ Shell 语言编写程序（Shell 过程）将在第 5 章讨论，到那时你就能明白为什么需要修饰符。表 3.5 列出了许多修饰符；请参考 Bash 手册获取完整列表。命令行经过历史扩展后，它也将作为最近事件成为历史列表的一部分。\n\
  \n##### 历史修饰符\n\n![image](img/00037.jpeg)\n\nBash 内置命令 `fc`（修复命令）将范围历史项放入你喜爱的文本编辑器中，允许你随意修改任何部分，然后在退出编辑器时自动执行生成的命令。\n\
  \n```\nfc first_event last_event\n```\n\n最后，当你完成交互并退出时，Bash 将命令历史保存到环境变量 `$HISTFILE`\
  \ 指定的历史文件中，该文件默认为家目录下的 `.bash_history`。下次启动 Bash 时，保存的历史记录将从历史文件中恢复。\n\n可以通过以下方式禁用历史文件功能：\n\
  \n```bash\nexport HISTFILE=\n```\n\n#### 别名扩展](#part0003.html_C3tocsec3_3005)\n\n\
  别名功能允许你为常用的命令定义简写，使其更容易输入。要创建一个别名（任何单个单词）并赋予其一个值（字符字符串），使用 Bash 内置命令 `alias`。符号如下\n\
  \n`alias name=value`\n\n将给定名称定义为指定字符串的别名。允许多个名称-值定义。值部分通常需要引号括起来以防止意外的 Shell 扩展（关于何时以及如何使用引号，请参见第\
  \ 3.14 节）。这里是一些简单但实用的别名定义。\n\n`alias dir=\"ls -l\"`\n\n`alias back='cd $OLDPWD'`\n\
  \n`alias monkey=\"ssh -l monkey.cs.edu\"`\n\n`alias append2=\"cat > \"`\n\n定义了这些别名后，命令\
  \ `dir` 可以工作，因为它扩展为 `ls -l`。别名 `back` 起作用是因为 Bash 变量 `$OLDPWD` 始终保留上一个工作目录。别名扩展意味着如果简单命令的第一个单词是别名，Bash\
  \ 将替换该单词为别名值。替换文本的第一个单词会再次测试别名，但与别名完全相同的单词不会进行第二次扩展。这意味着以下是正确的且不会导致无限循环。\n\n```bash\n\
  alias ls='ls -F'\n```\n\n因此，`ls` 命令始终带有 `-F` ，这在其他方面使得目录名称以 `/` 结尾，符号链接以 `@` 结尾，可执行文件（具有执行权限；参见第\
  \ 1 章第 1.6 节）以 `*` 结尾。\n\n要显示现有别名，使用\n\n```bash\nalias (显示所有别名) alias name (显示别名)\n\
  ```\n\n要删除别名定义，使用\n\n```bash\nunalias name ...\n```\n\n#### 大括号和大波号扩展](#part0003.html_C3tocsec3_3006)\n\
  \n大括号扩展为类似的相似单词提供了简写。通过大括号扩展，命令行\n\n`nano memoSep, Oct, Nov2018.txt`\n\n变为\n\n`nano\
  \ memoSep2018.txt memoOct2018.txt memoNov2018.txt`\n\n而 `lpr chap2..5.pdf` 变为\n\n\
  `lpr chap2.pdf chap3.pdf chap4.pdf chap5.pdf`\n\n序列符号（`..`）适用于数字和单个字母，例如 `a..z`。\n\
  \n\n\n\n\n字符 `TILDE` (~) 会扩展为用户自身的家目录，`userid` 扩展为其他用户的家目录，`+` 代表当前文件夹，而 `-` 代表上一个文件夹。\n\
  \n因此，之前定义的别名 `back` 也可以定义为：\n\n`alias back=\"cd -\"`\n\n## 变量扩展 (Variable Expansion)\n\
  \nShell 允许使用变量，也称为参数。变量的值是一个字符串。某些变量是保留给 Shell 使用的。例如，`USER`、`HOME`、`PATH` 和 `HISTSIZE`\
  \ 是 Bash 中具有规定含义的 Shell 变量（参见第 [3.9] 节）。此外，你也可以设置和使用自己的自定义用户变量。\n\n通常情况下，变量标识符可以是任何第一个字符为字母、其余部分由字母、数字和下划线字符组成的单词。使用\n\
  \n`var=value` （设置变量值）\n\n来给变量赋值。值可以单个单词，也可以是带引号的多个单词，且在等号 (`=`) 前后不允许有空格。设置变量后，可以在后续命令中使用该变量。例如，\n\
  \n`ldir=/usr/local`\n\n给变量 `ldir` 赋值字符串 `/usr/local`。设置该变量后，你可以输入\n\n`cd $ldir`\n\
  \n这是一个包含变量的命令。变量扩展后，该命令变为\n\n`cd /usr/local`\n\n如你所见，变量扩展是以字符 `$` 为键触发的。也就是说，以 `$`\
  \ 开头的单词是一个变量。如果 `$` 后面跟着空格或前面有反斜杠 (`\\`)，则它表示本身。可以使用 `echo` 命令来显示变量的值。例如，\n\n`echo\
  \ $ldir`\n\n显示 `/usr/local`。使用 `unset var` 来移除任何变量 `var`。\n\n变量名的范围可以通过大括号（`(` 和\
  \ `)`）来界定。例如，\n\n`x=abc`\n\n`echo $xde`\n\n显示字符串 `abcde`，而\n\n`echo $xde`\n\n会显示一个空行，因为变量\
  \ `$xde` 没有值。\n\n变量通常具有字符串值。然而，它们也可以具有整数值。在 `$(( ... ))` 内部，你可以使用 C 语言语法对变量进行整数算术操作（包括\
  \ `+ - * / +% ** ++ --`）。例如，\n\n```\ncount=7\necho $(( 3*count )) (显示 21)\necho\
  \ $(( count%5 )) (显示 2)\necho $(( count++ )) (显示 7，将 count 设置为 8)\n```\n\n你可以通过以下命令显示变量（Shell\
  \ 内置和用户定义）以及函数定义（第 [3.15] 节）：\n\n```\nset (显示所有变量和函数)\ndeclare (显示所有变量和函数)\ndeclare\
  \ -f (显示所有函数)\n```\n\n## 命令扩展 (Command Expansion)\n\n命令扩展使得将命令的标准输出作为另一个命令中的单词字符串成为可能。可以使用\
  \ `$(command)` 或 `` `command` ``（注意是反引号）进行命令扩展。例如，\n\n```bash\ndir1=$(pwd) (或 dir1=`pwd`)\n\
  ```\n\n将 `pwd`（打印工作目录）命令的输出赋值给用户变量 `dir1`。另一个例子是，\n\n`files=$(ls)`\n\n将 `ls` 命令产生的单词赋值给\
  \ `files`，即当前目录下的文件名。命令扩展的替换字符串也可以形成单个单词的一部分，例如：\n\n`file1=$(pwd)/test.c`\n\n替换字符串通常会在空格、制表符和换行符处分成单独单词，空单词会被丢弃。\n\
  \n## 进程扩展 (Process Expansion)\n\nBash 将 I/O 重定向的想法进一步推了一步，允许使用表示法\n\n```bash\n<(command\
  \ args ...)\n```\n\n在命令需要文件名参数的地方。因此，表示法 `< (...)` 会产生一个临时文件，其中包含内部命令产生的输出，该输出可以交给另一个命令。\n\
  \n例如，\n\n```bash\nnano <(ls -l -F)\n```\n\n打开 `nano` 来查看/编辑给定 `ls` 命令产生的结果。这种能力有时非常有用。可以通过这种方式提供多个文件。例如，\n\
  \n```bash\ndiff -u <(ls -F /usr/bin) <(ls -F /usr/bin.old)\n```\n\n显示两个目录列表之间的差异。\n\
  \n## 文件名扩展 (Filename Expansion)\n\n由于命令参数经常引用文件，Shell 提供了文件名扩展以便更方便地指定文件。当命令行中使用文件名模式或通配符模式（glob\
  \ pattern）时，该模式会被扩展为所有匹配该模式的文件名。模式可以匹配当前工作目录中的简单文件名，也可以匹配完整或相对路径名。如果模式不匹配任何文件，则它表示本身且不进行扩展。通配符模式使用特殊字符\
  \ `*`、`?` 和 `[ ]` 指定。`*` 匹配零或多个字符的序列。例如，\n\n```bash\nls -l *.c\n```\n\n产生所有以 `.c`\
  \ 结尾的文件列表。`*.c` 是一个模式，它扩展为匹配当前工作目录下所有以 `.c` 结尾的文件。命令\n\n```bash\nls -l ../*.c\n\
  ```\n\n对父文件夹中的文件执行相同的操作。命令\n\n```bash\nls ~/Pictures/2018*/*.jpg\n```\n\n方便地显示 `/Pictures`\
  \ 目录下以 2018 为前缀的文件夹下，所有以 `.jpg` 结尾的图片列表。\n\n文件名模式与现有的文件名进行匹配。文件名模式的规则如下：\n\n```text\n\
  * 匹配长度为零或多个任意字符字符串（“通配符”）。\n? 匹配任何单个字符。\n[…] 匹配 [ 和 ] 之间包含的字符中的任意一个（范围模式）。例如，a[rxz]b\
  \ 匹配 arb、axb 或 azb。模式 chapter[0-9] 匹配 chapter0、chapter1 等。\n[^…] 匹配不在 [ 和 ] 中的任何字符。可以使用\
  \ ! 字符代替 ^。 \n[[:class:]] 匹配字符类中的任意字符。该类可以是 alnum（字母数字）、alpha（字母）、digit（数字）、lower（小写）或\
  \ upper（大写）。\n```\n\n例如，在命令中\n\n```bash\nls [[:digit:]]*\n```\n\n模式匹配所有以数字开头的文件。\n\
  \n文件名扩展也称为 globbing。可以使用 Bash 内置命令禁用文件名扩展\n\n```bash\nset -f (或 -o noglob，关闭文件名扩展)\n\
  set +f (或 +o noglob，开启文件名扩展)\n```\n\n在交互式使用 Shell 时，文件名扩展扩展通常应该是开启的。\n\n文件名开头的 `.`\
  \ 必须显式匹配，除非设置了 `dotglob` 选项。\n\n```bash\nshopt -s dotglob (启用匹配点)\nshopt -u dotglob\
  \ (禁用匹配点)\nshopt (列出 Bash 选项)\n```\n\n因此，命令 `ls *` 通常不会列出以点开头的文件。\n\n此外，文件名中的 `/`\
  \ 必须显式匹配。\n\n文件名模式可以包含多个模式字符。当匹配到多个文件名时，该模式会被扩展为排序后的文件名列表。匹配是区分大小写的，除非你执行 `shopt\
  \ -s nocaseglob`。如果模式没有匹配任何文件名（匹配失败），则不会被扩展（在命令行中保持不变），除非\n\n```bash\nshopt -s failglob\
  \ (匹配失败会导致错误)\nshopt -s nullglob (匹配失败扩展为空字符串)\n```\n\n## 3.8 Bash 内置命令\n\n我们已经看到了许多置置命令。本节将介绍更多。要查看所有\
  \ Bash 内置命令的列表，可以使用内置命令 `help`。\n\n```bash\nhelp (列出所有内置命令)\nhelp commandName (描述指定的命令)\n\
  help help (告诉如何使用 help)\n```\n\nBash 维护一个目录栈，默认包含当前工作目录。内置命令 `pushd dir` 切换到指定的目录并将其推入栈。内置命令\
  \ `popd` 从栈中弹出并切换到栈顶的目录。因此，序列\n\n`pushd dir`\n\n`popd`\n\n可以让你回到之前的地方而不改变目录栈。内置命令\
  \ `dirs` 列出栈中的文件夹。\n\n\n\n\n\n虽然交互式输入通常来自键盘，但在文件中保存并编辑命令，然后让 Shell 从该文件执行这些命令会更方便。Bash\
  \ 内置命令 `source`（或直接简写为点符号 `.`）可以读取 Bash 命令文件并逐个处理它们。Shell 命令文件被称为 Shell 脚本（Shell\
  \ script）。因此，以下任一操作：\n\n*   `source script`\n*   `. script`\n\n都会使你的交互式 Bash 从指定的脚本中读取命令，就像这些命令是单独从键盘输入的一样。由于\
  \ `source` 是内置命令，因此脚本不会在子 shell 中读取（第 3.2 节）。\n\n### 3.9 Shell 变量\n\nBash 使用了一系列具有特定用途的特殊变量，这些变量名均全大写字母。设置特殊变量可以控制某些\
  \ Bash 操作的执行方式。例如，将 `CDPATH` 设置为常用目录列表，可以让你在使用 `cd` 命令时使用简单的文件夹名（`cd simpleFolderName`）。Bash\
  \ 将会在 `CDPATH` 下的目录中搜索目标文件夹。务必在 `CDPATH` 中包含 `.`。这里列出影响 Shell 交互使用的一些变量。其他影响 Shell\
  \ 脚本处理的特殊变量将在第 5 章中讨论。\n\n### 3.10 程序的环境\n\n程序运行的确切方式取决于其执行任务时的执行环境。例如，文本编辑器 `nano`\
  \ 或 `vim` 需要知道它们正在处理的终端模拟器的功能，`more` 命令也是如此。当前工作目录是几乎所有程序在运行时都会想要获取的信息。出于文件访问权限的考虑，任何访问文件的程序都需要知道调用它的用户\
  \ ID（`userid`）。每个进程的执行环境由两部分组成：用户定义和系统定义。`userid`、当前工作目录、打开的文件等是由系统确定的并从你的 Shell\
  \ 传递给任何调用的应用程序；而像主目录、命令搜索路径和默认编辑器等量值则由用户定义。这些被称为环境变量。许多应用程序使用它们特定的特定环境变量；例如，任何 GUI\
  \ 应用程序的 `DISPLAY`，Java 编译器的 `CLASSPATH` 和 `JAVA_HOME`，Firefox 的 `MOZILLA_HOME` 以及\
  \ mutt 的 `EDITOR`。\n\n### 命令执行环境\n\nShell 的一项主要任务是通过解释用户命令来启动应用程序。当 Bash 启动应用程序时，它会创建一个子进程（另一个运行中的程序），并向其传递执行环境（图\
  \ 3.4），该环境包含以下属性：\n\n*   标准输入输出和其他打开的文件\n*   当前工作目录\n*   文件创建掩码（第 3.12 节）\n*   已在\
  \ Shell 自身执行环境中的环境变量以及用户定义的额外变量\n\n子进程（例如一个应用程序）被认为从其父进程（例如 Shell）继承其初始环境。子进程环境的任何变化都不会影响父进程的环境。\n\
  \n![image](img/00038.jpeg)\n\n图 3.4 进程执行环境\n\n假设 `XYZ` 为任意变量。你可以通过以下方式使其成为 Shell\
  \ 环境的一部分：\n\n```\nexport XYZ\n```\n\n因此，Shell 稍后启动的任何子进程对该变量都可用。如果一个变量被取消设置（unset），那么它自然也会从\
  \ Shell 环境中移除。\n\n与其导出一个变量后再取消设置，你可以按命令将变量添加到环境中。当你发布任何普通命令时，可以在命令名称前面设置变量，将它们添加到传递给命令的环境中，而不会影响\
  \ Shell 本身的环境。例如，如果我们通过以下命令启动一个子 shell：\n\n```\nYEAR=2018 bash\n```\n\n该子 shell\
  \ 将有一个环境变量 `YEAR` 设置为值 `2018`，而你的 Shell 保持不变。\n\n环境变量 `TERM` 记录终端类型。对于 Linux 用户，`TERM`\
  \ 最可能由如 `gnome-terminal` 等终端窗口程序设置为 `xterm`（X Terminal）（参见第 3 章，第 2.8 节）。命令搜索路径是另一个环境变量，其值包含在环境变量\
  \ `PATH` 中。此外，X Windows 客户端程序使用变量 `DISPLAY` 的设置（参见第 2 章，第 2.6 节）。Bash 内置命令 `printenv`（或\
  \ `env`）显示所有当前设置的环境变量及其值。这里是一些常见的环境变量。\n\n| TERM | 终端类型 |\n| :--- | :--- |\n| EDITOR\
  \ | 默认文本编辑器 |\n| DISPLAY | X 服务器和物理显示设备标识 |\n| MANPATH | 命令 man 搜索路径 |\n\n记住，在 Bash\
  \ 中，任何变量都可以通过 `export` 命令变成环境变量。然而，对环境变量使用全大写字母是一种良好的习惯。\n\n### 3.11 Bash 使用示例\n\
  \n通过学习示例，你可以更深入地理解 Shell 如何工作以及如何使用各种扩展。这里给出的几乎所有示例都有实用价值，你可以考虑采纳其中任何或全部示例供自己使用。\n\
  \n### 自定义提示符\n\nShell 在准备好接收下一个命令时会显示提示符。对于 GNU Linux，默认的 Bash 提示符为 `PS1=' s- v\
  \ $ '`，意味着 `-Shell_base 名-version$`。例如：\n\n```bash\n-bash-3.2$\n```\n\n如果用户是 root，结尾的\
  \ `$` 会自动替换为 `#`。\n\n许多用户选择自定义提示符以显示更多信息。一个很好的例子是 `PS1=' u@ h: W '`，它指定了 `用户名@主机名:目录$`\
  \ 并产生如下提示符：\n\n```\npwang@acerwang:03$\n```\n\n你还可以设置特殊变量 `PROMPT_COMMAND`，在显示每个提示符之前执行任何命令。\n\
  \n### 安全删除文件\n\n意外删除文件并不罕见。这在使用 Shell 强大且简洁的符号时尤其如此。完全可能误打命令：\n\n```\nrm *.o (删除所有\
  \ .o 结尾的文件)\nrm * .o (删除所有文件和 .o 文件)\n```\n\n在 `.o` 前不小心打了一个空格。\n\n建议你定义一个别名：\n\n\
  ```\nalias rm=\"rm -i\"\n```\n\n`-i` 选项在删除任何文件之前需要交互式确认。考虑将此别名放在 `.bash_profile`\
  \ 中（参见第 3.13 节）。\n\n有些用户喜欢更安全的替代方案，将不需要的文件移动到垃圾桶而不是直接删除。你的主目录下应该有一个垃圾桶，或者你可以通过以下命令创建一个：\n\
  \n```\nmkdir /Trash\n```\n\n现在，定义一个函数 `rm`（第 3.15 节），使用 `mv` 将任何给定文件移动到 `/Trash`（参见练习\
  \ 20）。\n\n### 复制、粘贴与输入输出重定向\n\n你可以将复制-粘贴（使用鼠标，参见第 2 章，第 2.8 节）与 I/O 重定向相结合，使某些操作更容易。例如，你可以标记并复制包含保存信息的显示文本，并直接输入文件。只需输入：\n\
  \n```\ncat > notes.txt\n```\n\n然后粘贴标记的内容，并在新行按 CTRL+D（向 cat 信号输入结束）。要将某些屏幕输出邮件给另一个用户，只需执行：\n\
  \n```\ncat | mail userid -s subject\n```\n\n然后粘贴素材。\n\n\n\n\n\n## 显示手册页 (Manual\
  \ Pages)\n\n每个手册页都提供了 Linux 命令的简要描述。手册页的正文分为若干章节。虽然章节的具体组织结构可能会根据特定的 Linux 系统而异，但以下是一个典型的结构：\n\
  \n1. 用户级命令\n2. C 语言中的 Linux 系统调用\n3. 用于 C、Fortran、网络等其他目的系统库函数\n4. 特殊文件、相关设备驱动函数和网络支持\n\
  5. 可执行文件和系统数据库文件的格式\n6. 杂项有用信息\n7. Linux 维护、操作和管理\n\n你可以使用命令\n\n`man man`\n\n来查看手册页的结构。要显示第\
  \ `n` 章节的介绍，输入\n\n`man n intro`\n\n要显示 `command_name` 的手册，输入\n\n`man [ n ] command_name`\n\
  \n其中章节数字 `n` 是可选的。\n\n一个典型的手册页包含以下信息：名称（NAME，及主要用途）、用法 SYNOPSIS、描述（DESCRIPTION）、选项（OPTIONS）、相关文件（FILES）以及相关（SEE\
  \ ALSO，相关命令）。\n\n如果手册页太大无法在一个屏幕上显示，程序将一次显示一页，直到显示整个条目。你可以输入 `q` 退出 `man` 并返回 Shell\
  \ 提示符。如果手册页很大而你不想看到全部内容，这种方法特别有用。手册页的 SYNOPSIS 部分提供了命令语法的简要描述。在摘要中，使用命令时，某些字符需要原字输入；其他字符或字符串则应由用户提供的适当单词或文件名替换。括括号内包含的部分是可选的，且括号本身不是命令的一部分。省略号（`…`）在摘要中表示可能的重复。大多数\
  \ Linux 命令都接受修改命令行为的选项。如前所述，选项通常以由连字符（`-`）开头的单个字符给出，但也可能存在更详细的选项。\n\n手册页的 FILES\
  \ 部分给出了与特定命令相关的文件位置。SEE ALSO 部分给出了你可能感兴趣的相关命令。BUGS 部分列出了该命令的一些已知问题。\n\n`man` 命令还可以通过通过手册页的名称和用途部分进行关键字搜索，显示包含任何一个给定关键字的每一行。这是通过使用\
  \ `-k` 选项完成的：\n\n```\nman -k keyword ...\n```\n\n当你想要执行某操作但记不起相应的命令时，此功能非常有用。例如，为了弄清楚如何复制文件，你可以尝试\
  \ `man -k copy`。关键字可以是任何字符序列。因此，如果你只记得命令名称或描述的一部分，也可以找到它。\n\nLinux 手册页也有 Web 版本（例如\
  \ `linuxmanpages.com`），它们作为参考要易用得多。此外，你也可以使用 Yelp 文档浏览器\n\n```\nyelp ’man:name_of_command’\n\
  ```\n\n来方便地查看任何手册页。例如，图 3.5 显示了 `yelp man:chmod` 的显示。\n\n![image](img/00039.jpeg)\n\
  \n图 3.5 浏览手册页\n\n## 设置你的个人 Web 文件夹\n\n学校或办公室的 Linux 系统通常也会提供 服务。如果是这样，Linux 系统通常也支持每个用户的\
  \ Web 页面。这意味着你可以按照以下方式在主目录下设置一个 `public_html` 文件夹：\n\n```\ncd (进入主目录)\nchmod a+x\
  \ . (允许 Web 服务器访问)\nmkdir public_html (创建新文件夹)\nchmod a+x public_html (允许 Web 服务器访问)\n\
  ```\n\n现在，你可以在你的 `public_html` 中创建 Web 页面（`filename.html`）并让每一个变为 Web 可读：\n\n```\n\
  chmod a+r public_html/filename.html\n```\n\n然后，你可以通过 Web 地址访问它们：\n\n`http://hostname/\
  \ your_userid/filename.html`\n\n## 3.12 默认文件权限\n\n文件保护在第 1 章第 1.6 节中描述。当你创建一个新文件时，Linux\
  \ 会赋予文件一个默认保护模式。通常，此默认设置会拒绝 `g`（组）和 `o`（其他）的写权限，并授予所有其他权限。默认文件保护设置存储在一个名为 `umask`\
  \ 的系统变量中。Shell 内置命令 `umask` 以八进制数字显示 `umask` 值。`umask` 位模式指定了要拒绝的哪些访问权限（第 11 章第\
  \ 11.4 节）。1 位的位置表示被拒绝的权限。例如，`umask` 值 `0022`（八进制 `022`）具有位模式 `000010010`，它指定拒绝 `g`\
  \ 和 `o` 的写权限。Shell 内置命令 `umask` 也可以设置 `umask` 值。例如，\n\n```\numask 0077\n```\n\n\
  将 `umask` 设置为拒绝 `g` 和 `o` 的所有权限。如果你发现自己频繁使用 `chmod go-rwx`（第 2 章第 2.7 节），你可能想考虑将\
  \ `umask 0077` 放入你的 `.bash_profile` 和 `.bashrc` 文件中（3.13 节）。\n\n## 3.13 Shell 启动与初始化\n\
  \n如所述，Shell 本身是一个用户程序。用户程序是指未构建在 Linux 操作系统内核中的程序。内核例程示例包括文件系统例程、内存管理程序、进程管理程序和网络支持。命令\
  \ `ls`、`nano`、`mail` 和 `cat` 以及 Shell `bash`、`csh` 等都是程序。事实上，所有的 Linux 命令都是用户程序。\n\
  \n登录 Shell 是按用户选择的，并在用户密码文件 `/etc/passwd` 中指定。该文件包含每个授权用户的一个条目。每个 passwd 条目由以下字段组成：\n\
  \n* 登录名称（无大写字母）\n* 加密密码或 `x`\n* 数字型 userid\n* 数字型 groupid\n* 用户真实姓名、办公室、扩展和家\n*\
  \ 用户的主目录\n* 作为 Shell 的程序\n\n字段由冒号（`:`）分隔。例如，一个 passwd 条目可能如下：\n\n```\npwang:x:500:500::home/pwang:/bin/bash\n\
  ```\n\n密码 `x` 表示使用影子密码文件来保护和管理用户密码。结尾的 `/bin/bash` 指定了用户的登录 Shell。\n\n登录窗口启动后，会调用用户的登录\
  \ Shell（第 2 章第 2.8 节）。passwd 条目中指定的登录 Shell 可以使用命令 `chsh`（更改 Shell）进行更改。例如，\n\n\
  ```\nchsh -s /bin/bash\n```\n\n这将你的登录 Shell 修改为 `/bin/bash`。在 Shell 级别，命令\n\n```\n\
  echo $0\n```\n\n显示当前 Shell 的名称。\n\n当 Shell 启动时，首先执行初始化文件中的命令，允许 Linux 安装和个人用户自定义\
  \ Shell 以满足其需求。具体 加载哪些初始化文件取决于它是如何被调用的。\n\n* 登录 Bash——如果 bash 通过登录窗口调用或给出 `-l` 或\
  \ `--login` ，则它就是登录 Shell。作为登录 Shell，Bash 首先加载系统级初始化文件 `/etc/profile`，其中定义了环境变量\
  \ `PATH`、`USER`、`HOSTNAME` 和 `TERM`。然后加载用户级初始化文件，即用户目录下找到的 `.bash_profile`、`.bash_login`\
  \ 和 `.profile` 中的第一个。登录 Bash 退出时会执行用户清理文件 `.bash_logout`。\n\n\n\n\n\n*   非登录交互式\
  \ Bash——当 `Bash` 从命令行运行时，它是一个交互式 Shell（标准输入/输出连接到终端窗口），但不是登录 Shell。这种 `Bash` 会先加载系统范围的\
  \ `/etc/bash.bashrc`，然后加载每个用户的 `/.bashrc`。\n*   非交互式 Bash——Bash 启动以运行一个命令（`bash\
  \ -c cmd`）或脚本（第 5 章）的 `Bash` 是非交互式的。这种 `Bash` 默认不会加载任何初始化文件。它会加载由环境变量 `BASH_ENV`\
  \ 指定的文件。\n\n不同的 Linux 发行版在 Shell 初始化文件上存在一些差异。例如，`CentOS/Fedora/Red Hat` 还提供了一个系统范围的\
  \ `/etc/bashrc` 文件，用户在需要时可以通过条件表达式加载它：\n\n```\nif [ -f /etc/bashrc ]; then . /etc/bashrc;\
  \ fi\n```\n\n注意 `.` 命令与 `source` 相同。编写 `Bash` 程序是第 5 章的内容。\n\n此外，`/etc/bashrc` 通常会将\
  \ `umask` 设置为默认值（节 3.12）。如果你的系统提供了 `/etc/bashrc`，将其包含进去是一个好主意。这是一个 `.bashrc` 示例。\n\
  \n```\n## Source system definitions\nif [ -f /etc/bashrc ]; then . /etc/bashrc;\
  \ set -o noclobber; umask 0007\n```\n\n`.bashrc` 通常包含在 `.bash_profile` 中，后者添加了对\
  \ Shell 交互式使用重要的其他设置。图 3.6 显示了一个 `.bash_profile` 示例（例如：`ex03/bash_profile`）。\n\n\
  ![image](img/00040.jpeg)\n\n图 3.6 示例 .bash_profile\n\n非交互式 `Bash` 是子壳，执行任何 `Bash`\
  \ 脚本（第 5 章）都会涉及子壳 `Bash`。因此，用于 Shell 过程的别名、函数和 `PATH` 设置应该放在 `.bashrc` 中而不是 `.bash_profile`。\n\
  \n### 3.14 Shell 特殊字符与引号\n\nShell 在建立命令语言语法时使用了许多特殊字符，并将其作为各种扩展的键。一些常见的特殊字符列在表 3.6\
  \ 中。\n\nBash 特殊字符\n\n![image](img/00041.jpeg)\n\n特殊字符有助于实现许多 Shell 功能。然而，由于 Shell\
  \ 对特殊字符的解释与普通字符不同，除非进行额外的安排，否则特殊字符无法表示自身。例如，如果有一个名为 `f&g.c` 的文件，你如何在 Shell 命令中引用它呢？解决这个问题的方法是使用更多的特殊字符，即引号字符。如果你觉得\
  \ Linux 中有很多特殊字符，那么你是完全正确的。事实上，键盘上任何不是字母或数字的字符可能在某种意义上都是特性的。值得注意的例外是点（`.`）和下划线（`_`）。\n\
  \n#### Bash 中的引用\n\nBash 提供了反斜线（`\\`）转义字符、单引号（`'...'`）、双引号（`\"...\"`）和 ANSI-C 引号（$'...'`）。\n\
  \n引号转义下一个字符。例如，\n\n```\nnano f&g.c\n```\n\n以及\n\n```\ngrep US$ report.*\n```\n\n\
  当 `&` 和 `$` 前面有 `\\` 时，它们会失去其特殊含义。相反，它们代表字符本身。如果空格或制表符的前前面有 `\\`，那么它就变成单词的一部分（也就是说，它失去了划分单词的特殊含义）。如果\
  \ `NEWLINE` 字符前面有 `\\`，则它等同于空格。因此，在行尾使用 `\\` 可以将 Shell 命令延续到下一行。若要在不转义下一个字符的情况下获取该字符，请使用\
  \ `\\\\`。\n\n当 `\\` 转义下一个字符时，一对单引号（`''`）则引用包含其中的整个字符字符串。\n\n```\necho 'a+b >= c*d'\n\
  ```\n\n当被单引号包裹时，所有字符都会被转义。引用的字符串形成单词全部或部分。在前面的示例中，引用的字符串连空格在内形成了一个单词。命令\n\n```bash\n\
  cat /user/pwang/ 'my>=.c'\n```\n\n用于在文件 `/user/pwang/my >=.c` 中输入一个 C 程序。在这个示例中，引用的字符串形成单词的一部分。要在字符串中包含单引号，需使用\
  \ `\\'`，如\n\n```bash\necho 'It\\'s a good day'\n```\n\n由于 `\\` 转义下一个字符，而一对单引号（`''`）则引用包裹的整个字符字符串。\n\
  \n```\necho 'a+b >= c*d'\n```\n\n当被单引号包裹时，所有字符都会被转义。引用的字符串形成单词全部或部分。在前面的示例中，引用的字符串连空格在内形成了一个单词。命令\n\
  \n```bash\ncat /user/pwang/ 'my>=.c'\n```\n\n用于在文件 `/user/pwang/my >=.c` 中输入一个 C\
  \ 程序。在这个示例中，引用的字符串形成单词的一部分。要在字符串中包含单引号，需使用 `\\'`，如\n\n```bash\necho 'It\\'s a good\
  \ day'\n```\n\n由于 `\\` 转义下一个字符，而一对单引号（`''`）则引用包裹的整个字符字符串。\n\n```\necho 'a+b >= c*d'\n\
  ```\n\n当被单引号包裹时，所有字符都会被转义。引用的字符串形成单词全部或部分。在前面的示例中，引用的字符串连空格在内形成了一个单词。命令\n\n```bash\n\
  cat /user/pwang/ 'my>=.c'\n```\n\n用于在文件 `/user/pwang/my >=.c` 中输入一个 C 程序。在这个示例中，引用的字符串形成单词的一部分。要在字符串中包含单引号，需使用\
  \ `\\'`，如\n\n```bash\necho 'It\\'s a good day'\n```\n\n由于 `\\` 转义下一个字符，而一对单引号（`''`）则引用包裹的整个字符字符串。\n\
  \n```\necho 'a+b >= c*d'\n```\n\n当被单引号包裹时，所有字符都会被转义。引用的字符串形成单词全部或部分。在前面的示例中，引用的字符串连空格在内形成了一个单词。命令\n\
  \n```bash\ncat /user/pwang/ 'my>=.c'\n```\n\n用于在文件 `/user/pwang/my >=.c` 中输入一个 C\
  \ 程序。在这个示例中，引用的字符串形成单词的一部分。要在字符串中包含单引号，需使用 `\\'`，如\n\n```bash\necho 'It\\'s a good\
  \ day'\n```\n\n现在，我们仍然需要一种简单的方法在字符串中包含困难字符。这就是 ANSI-C 引号大有用场。形式为 `$'...'` 的字符串允许你使用\
  \ ANSI-C 转义字符。例如，你可以使用 `\\a`（响铃）、`\\b`（退格）、`\\f`（换页）、`\\n`（换行）等。例如，\n\n```bash\n\
  alias f=clear\n```\n\n定义了一个方便的别名，允许你通过输入 `CTRL+L` 命令清除屏幕。\n\n### 3.15 简单函数\n\n你可以提取难以输入的命令或特定任务的一系列命令并构建一个函数来简化该任务。定义函数使用以下语法\n\
  \n```bash\nfunction fnName () {command 1;command 2;...command n;}\n```\n\n函数中的命令可以是\
  \ Shell 内建命令、普通命令或对函数的调用。别名在函数内部不起作用。定义中的每个命令必须以分号结束。\n\n在和 command 1 之间某些空格是必要的。\n\
  \n一旦定义，你可以将函数名作为命令名，并传递函数参数。例如，\n\n```bash\nfunction office (){ /usr/bin/libreoffice\
  \ $1; }\n```\n\n定义了函数 `office`。然后你可以通过命令对文档运行 libreoffice：\n\n```bash\noffice note.doc\n\
  ```\n\n函数定义中的特殊变量 `$1` 指向函数调用中的第一个参数。通常，位置参数 `$1`、`$2`、... 用于访问传递给函数调用的参数。\n\n事实上，如果给了\
  \ `()`，则 `function` 关键字是不必要的。例如，\n\n```bash\ndir(){ls -lF --color=auto --color=always\
  \ \"$@\" | less -r;}\n```\n\n\n\n\n\n为你提供了一个类似 DOS 的 `dir` 命令。[³] 特殊变量 `$@` 指函数调用中的所有参数（第\
  \ [3] 章，第 [5.3] 节）。\n\n函数通常不会被子 Shell 继承，除非使用 `export -f functionName` 将其导出。\n\n\
  你可以使用以下命令删除函数：\n\n``` evenunset -f functionName\n```\n\n并使用以下命令显示所有函数：\n\n```bashdeclare\
  \ -f\n```\n\n没有内置命令可以显示特定的函数，但以下函数可以胜这项工作：\n\n```bash\nfunction which (){ (alias;\
  \ declare -f) | /usr/bin/which --tty-only -i --read-functions $@;}\n```\n\n`(alias;\
  \ declare -f)` 外围的圆括号像 `;` 一样将命令分组，不同之处它会调用一个子壳（subshell）来执行这些命令。该子壳的标准输出（stdout）被传递给\
  \ `/usr/bin/which` 命令。\n\n定义此函数后，`which fname` 命令将显示给定 `fname` 的任何别名或函数定义。如果没有这样的函数或别名，它还将在\
  \ `$PATH` 中查找 `fname`。特殊变量 `$@` 的值为传递给函数的所有参数。还要注意，我们使用了 `/usr/bin/which` 而不是简单的\
  \ `which`，因为我们的目的不是递归调用该函数。[⁴]\n\n以下是 `which which` 输出的内容。\n\n```bash\nwhich (){\
  \ ( alias;declare -f ) | /usr/bin/which --tty-only -i --read-functions --show-tilde\
  \ --show-dot $@;}\n```\n\n在第 [5] 章第 [5.18] 节将介绍更多关于函数的知识。\n\n### 3.16 更多信息\n\n你可以使用\
  \ Bash 命令：\n\n```bash\nhelp | more\n```\n\n来获取内置命令列表以及如何获取它们的更多详情。\n\nBash man 手页\n\
  \n```bash\nman bash\n```\n\n是关于 Bourne-Again Shell 的一个很好的参考。\n\nGNU 的 Bash 手册可以在此处找到：\n\
  \nwww.gnu.org/software/bash/manual.\n\n### 3.17 总结\n\nBash Shell 运行在终端窗口，为你的 Linux\
  \ 系统提供了一个命令行界面（CLI）。你通过“输入-处理-执行-提示”循环与 Shell 交互。命令行在执行之前会经过一组定义良好的扩展。Shell 内置命令由\
  \ Shell 自身执行。非内置命令或普通命令涉及在文件系统中定位可执行程序，在子进程中运行它，并向其传递任何命令行参数和任何环境变量（包括导出的 Shell\
  \ 变量和函数）。\n\n命令名称可以是简单名称，也可以是路径。在前者情况下，如果存在相应的 Shell 别名或函数，命令可能会调用它们。否则，将通过搜索命令路径来找到命令——该路径是由环境变量\
  \ `PATH` 提供的目录列表。\n\nI/O 重定向允许你将命令的 `stdin`、`stdout` 和 `stderr` 重定向到/或从文件或其他命令（形成管道）。作业控制（Job\
  \ control）使得启动多个任务、暂停它们、将它们放入后台或将任何任务带回前台以重新获得对终端的控制成为可能。\n\n输入通过输入编辑、TAB 补全、历史记录替换和文件名扩展得到帮助。\n\
  \nBash 在启动时加载配置文件。将你喜好的设置保存在适当的初始化文件 `.bashrc` 和 `.bash_profile` 中是非常重要的。\n\nShell\
  \ 使用许多特殊字符，如 `*`、`=`、`()`、`[]`、空格、`;` 等。使用单引号和双引号进行引用以及使用 `\\` 进行字符转义对于消除此类字符的影响是必要的。在发布需要使用此类字符的命令时，记住这一点尤为重要。\n\
  \nBash 还支持函数定义。函数将变成一个新的内置命令。函数可以接受参数并作为位置参数访问它们。如果你喜欢 Shell 别名，你也会喜欢函数。关于函数的更多信息可以在第\
  \ [5] 章找到。\n\n### 3.18 练习\n\n1. `cd` 命令是内置在 Shell 中的。为什么它不能实现为普通命令？\n2. 寻找并描述一种对\
