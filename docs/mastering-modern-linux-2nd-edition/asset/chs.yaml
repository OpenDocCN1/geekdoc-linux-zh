  10. 如何设置 Bash 命令行编辑使用的编辑器？显示代码。\n11. 列出至少两个既是 Bash 内置又是普通 Linux 命令的命令。\n12. 给出一个命令，使用\
  \ `nano` 编辑当前目录下所有以 `.txt` 结尾且包含字符串 `Linux` 的文件。（提示：考虑 `grep` 的 `-l` 选项。）\n13. 什么是前台作业、后台作业和挂起作业？如何显示所有作业的列表，或在不同作业之间切换？\n\
