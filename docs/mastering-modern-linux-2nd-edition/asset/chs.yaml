  \ chap[0-9]` 和 `ls chap0..9`。\n17. 什么是 Bash 中的命令扩展？给出用于命令扩展的两种表示法。\n18. 什么是 Bash\
  \ 中的字符串扩展？解释并给出两个例子。\n19. 尝试：\n    ```bash\n    country=\"usa\"; echo ${country^^}\n\
  \    ```\n    了解更多关于变量扩展中 Bash 大小写修改的信息。解释并给出两个例子。\n20. 考虑两个 Bash 初始化文件：`.bashrc`\
