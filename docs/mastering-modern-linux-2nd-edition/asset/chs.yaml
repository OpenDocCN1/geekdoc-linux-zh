  \ 在某些发行版中，`Sh` 是 `Bash` 的符号链接。\n\n[2] 较期的 Bash 结构 `[ ]` 仍然可以使用，但被 `[[ ]]` 取代。\n\n\
  [3] 遗憾的是，在 `[[ ]]` 内部普通的 `<` 和 `>=` 不被识别。\n\n[4] 如果你的 Linux 没有包含 `fortune` 命令，你可以通过安装\
  \ `fortune-mod` 包来获取（第 [8] 章，第 [8.2] 节）。\n\n## 第 6 章\n\n## 文件系统\n\n将数据存储为程序可以立即访问的文件对于现代操作系统是至关重要的。文件通过文件名识别，并可能包含多种数据。例如，一个文件可以包含字母、一份报告、用高级语言编写的程序、一个编译后的程序、一个组织的数据库、数学例程库、一张图片或一段音视频。\n\
  \n操作系统提供了一系列一致的设施，允许用户创建、存储、检索、修改、删除和其他操作文件。物理存储介质（通常是高速磁性或固态磁盘驱动器）被分为许多逻辑存储区域块。文件使用这些块中的一个或多个，取决于文件中数据量。随着文件的创建和删除，块会被使用和释放。创建、存储、检索、保护和管理文件的程序是文件存储系统（或简称为文件系统），它是任何现代操作系统内核的一部分。\n\
  \n从历史上看，UNIX 操作系统演变自当时贝尔实验室的一个设计新计算机数据存储系统的项目。这种分层文件存储系统是 UNIX 的标志。随着 UNIX 的演进，其文件存储系统的实现也在演进。Linux\
  \ 基本上采用了相同的 UNIX 文件存储系统实现。文件系统通常由一个或多个自包含的文件管理单元组成，每个单元被称为 `filesystem`。此外，Linux\
  \ 文件层次通常遵循文件系统标准 (FSSTND)，允许用户在任何符合标准的 Linux 系统的相同位置找到重要的系统文件。\n\n文件系统影响操作系统的几乎方面。在本章中，将详细讨论文件系统，包括文件类型和状态、访问保护、文件系统结构、实现、扩展属性\
  \ (`xattr`)、特殊文件和网络文件系统。清晰理解 Linux 如何处理文件对任何 Linux 用户都有帮助。\n\n### 6.1 文件位置路线图\n\n\
  Linux 中的文件系统不仅仅是一个存储用户文件的地方。它包含了操作系统本身、应用程序、编译器、网络服务器、共享库、文档、系统配置和管理数据文件、媒体挂载点、日志文件、临时缓存区域等。换句话说，启动计算机并保持其运行所需的几乎每一个比特的数据和程序必须保存在文件系统中。\n\
  \nLinux 系统通常遵循 FSSTND 来组织文件层次结构。这使得 Linux 用户很容易在不同的 Linux 系统上找到路径。\n\n根目录：`/`\n\n\
  ![image](img/00069.jpeg)\n\n[表 6.1] 显示了文件树根文件夹 (`/`) 的典型组织结构。从桌面点击“计算机”图标然后选择“文件系统”链接即可进入根目录。在命令行上，执行\
  \ `cd /` 即可。我们已经知道文件和文件夹形成了一个以 `/` 为根的树形层次结构。文件树上的每个文件都通过其完整路径唯一标识，正如我们在第 [1] 章第\
  \ [1.5] 节中提到的那样。\n\n在每个用户的家目录下，你经常会发现这些标准文件夹：Documents、Downloads、Music、Pictures、Videos、Desktop\
  \ 以及隐藏的 `.Trash`。\n\n当文件和文件夹堆积时，定位你需要的文件可能会变得困难。请参见第 [6.9] 节和第 [6.10 节获取实用的命令。\n\
  \n### 6.2 文件类型\n\n文件树包含不同类型的文件。\n\n1. 包含文本、程序或其他数据的普通文件\n2. 包含其他文件名称和地址的目录\n3. 代表\
  \ I/O 设备、磁盘驱动器或文件系统分区的特殊文件\n4. 指向另一个文件的符号链接\n5. 用于进程间通信的套接字（或域套接字）\n6. 一种不需要套接字语义的进程间通信方法——命名管道\n\
  \n在 `ls -l` 列出的文件列表中，文件的第一个字符是文件类型符号。[表 6.2] 列出了不同的文件类型符号。\n\n文件类型符号\n\n| 符号 | 含义\
  \ | 符号 | 含义 |\n| - | 普通文件 | d | 目录 |\n| l | 符号链接 | c | 字符特殊文件 |\n| b | 块特殊文件 | s\
  \ | 套接字 |\n| p | 命名管道 | | |\n\n现在，让我们逐一描述五种文件类型。套接字和命名管道将在后文第 [12] 章第 [12.6] 节中讨论。\n\
  \n#### 普通文件\n\n普通文件存储各种内容类型的数据。整个文件存储系统设计用于存储、检索和管理普通文件。你的家目录通常是你存储自己文件的地方。\n\n\
  文件名是字符字符串（最好不要使用任何空格）。尽管 Linux 文件名不要求空格，但不同内容类型的文件通常使用不同的扩展名。例如，图片可能使用 `.jpg` 扩展名。\n\
  \n多用途互联网邮件扩展类型 (MIME) 为文件内容类型提供了标准的分类和命名。不同内容类型的文件通常使用已知的文件名扩展名，以便识别和处理。今天有数百种内容类型在使用。许多流行类型与标准文件扩展名相关联。[表\
  \ 6.3] 给出了一些示例。\n\n内容类型与文件后缀\n\n![image](img/00070.jpeg)\n\n要获得更完整的内容类型和文件后缀列表，请查看你\
  \ Linux 系统上的 `/etc/mime.types` 文件。\n\n#### 目录\n\n文件存储在目录中，这就是为什么它们也被称为文件夹。目录是一个文件，其内容是由放置在目录中的文件的目录条目组成的。每个文件有一个目录条目。每个目录条目包含文件名及其文件信息节点（i-node）的位置。\n\
  \n\n\n\n\n文件名是一个不包含 `/` 的字符序列。最大序列长度取决于 Linux 系统的版本。在大多数系统中，它最多可达 255 个字符，但在某些旧版本上不超过\
  \ 14 个字符。`i-node` 的位置是一个整数索引，称为 `i-number`，指向一个名为 `i-list` 的表。`i-list` 中的每个条目都是\
  \ `i-node`，它包含了关于文件的状态和地址信息，或者指向尚未使用的空闲块。整个文件系统可能涉及几个独立且自包含的部分，每个部分称为文件系统。每个单独的文件系统都有自己的\
  \ `i-list`。\n\n#### 特殊文件\n\n通过将图形显示器、终端模拟器、打印机、CD/DVD 驱动器和硬盘等物理和逻辑 I/O 设备表示为文件系统特殊文件，Linux\
  \ 实现了兼容的文件 I/O 和设备 I/O。这意味着应用程序可以用相同的方式处理文件和设备 I/O，提供了极大的简单性和灵活性。在 FSSTND 下，所有 Linux\
  \ 特殊文件都在 `/dev` 目录下。特殊文件有两种类型：字符特殊文件和块特殊文件。字符特殊文件表示面向字节的 I/O 设备，如显示器或打印机。块特殊文件表示以块（许多字节）传输数据的高速\
  \ I/O 设备，如硬盘。典型的块大小为 1024 字节和 2048 字节。\n\n特殊文件通常由超级用户（`root`）所有。终端模拟器特殊文件（位于 `/dev/pts/`\
  \ 下）的所有权在终端会话期间设置为该终端的用户。\n\n#### 链接\n\nLinux 允许目录项作为指向另一个文件的指针。这种文件指针被称为链接。链接有两种类型：硬链接和符号链接。普通文件是目录中一个具有名称和\
  \ `i-number` 的条目。硬链接（或简单称为链接）是目录中一个具有名称和另一个文件 `i-number` 的条目。因此，硬链接与原始文件是不可分的。换句话说，在对文件创建硬链接后，你无法区分文件和链接。最终结果是，你有两个不同的目录项指向同一个\
  \ `i-node`。一个文件可以有多个指向它的链接。硬链接不能指向目录，也不能对位于另一个文件系统上的文件创建。\n\n因此，硬链接允许你在同一个文件系统内为同一个文件赋予不同的名称。例如，你可能有一个名为\
  \ `report` 的文件，并输入：\n\n```bash\nln report report.txt\n```\n\n那么 `report` 也以文件名 `report.txt`\
  \ 存在。\n\n使用普通命令 `ln` 创建链接。`ln` 命令的一般形式如下：\n\n| `ln file` | 在当前文件夹中为文件创建链接 |\n| :---\
  \ | :--- |\n| `ln file linkname` | 将 `linkname` 建立为指向现有文件的链接 |\n| `ln file1 ...\
  \ dir` | 在 `dir` 中创建指向给定文件（s）的链接 |\n\n默认情况下 `ln` 创建硬链接。即使你不是该文件的所有者也允许建立指向该文件的链接。在删除文件（使用\
  \ `rm` 命令）时，该文件的目录项会被删除。要使 `rm file` 成功，你对该文件的父目录具有写权限，而不是对文件本身。只有当文件的最后一个链接被 `rm`\
  \ 删除时，文件才会被从文件系统中物理删除。指向一个文件的硬链接总数作为文件状态的一部分被保留（第 6.4 节）。\n\n#### 符号链接\n\n符号链接是一个包含另一个文件路径的目录项。因此，符号链接是一个作为指向另一个文件的间接指针的文件。对于大多数命令，如果将符号链接作为参数，则将使用所指向的文件。例如，如果文件\
  \ `abc` 是指向文件 `xyz` 的符号链接，那么：\n\n```bash\ncat abc\n```\n\n将显示 `xyz` 的内容。有一些例外：\n\
  \n```bash\nrm abc\n```\n\n会移除目录项 `abc`（即使它是符号链接）。同样，\n\n```bash\nls -l abc\n```\n\
  \n会显示 `abc` 的状态信息（而不是 `xyz`）。如果你执行命令：\n\n```bash\nrm xyz\n```\n\n那么符号链接 `abc` 将指向一个不存在的文件。如果\
  \ `abc` 是硬链接，这种情况就不会发生。\n\n符号链接可以与文件本身区分开来，可以指向目录，并且可以跨文件系统。`-s` 选项导致 `ln` 创建符号链接：\n\
  \n```bash\nln -s filename linkname\n```\n\n与硬链接不同，这里的 `filename` 甚至不需要是一个存在的文件。\n\
  \n命令 `ls -F` 会显示末尾带有 `@` 的符号链接。`ls -l` 命令以这种形式显示符号链接。\n\n让我们来看符号链接的应用。假设你在自己的主目录下有一个\
  \ `clean.sh` Shell 脚本，你希望让 Linux 系统上的所有其他人都能使用它。实现这一点的一种方法是在系统目录中创建一个指向你程序的链接。例如，你可以执行以下命令：\n\
  \n```bash\nln -s $HOME/cmd/clean.sh /usr/local/bin/clean\n```\n\n这在系统目录 `/usr/local/bin`\
  \ 中建立了指向你的 `clean.sh` 的符号链接命令 `clean`。假设目录 `/usr/local/bin` 在用户的命令搜索路径上，一旦链接建立，新命令\
  \ `clean` 就会对所有用户可用。注意，由于文件保护，`/usr/local/bin` 等系统目录通常只允许超级用户写入。\n\n### 6.3 更多文件访问控制\n\
  \n从第 1 章中我们知道文件具有访问控制，文件类型和访问权限可以通过文件浏览器工具或使用 `ls -l` 命令来显示。此外，你可以使用 `chmod` 命令（第\
  \ 1 章，第 1.6 节和图 1.9）或文件浏览器（第 2 章，第 2.7 节）更改你自己的文件和文件夹的权限。\n\n在下面的 `ls` 显示示例中：\n\n\
  ```\n-rw-r—– 1 pwang faculty 46433 2018-03-06 15:35 report\n```\n\n四个文件模式部分（`- rw-r–\
  \ —`）显示了普通文件类型、对 `u`（文件所有者）的读写权限、对 `g`（教师组中的任何人）的读取权限，以及对 `o`（其他人）无访问权限。文件模式中有十个位置：\n\
  \n| 位置 1 | 文件类型：见表 6.2 |\n| :--- | :--- |\n| 位置 2-4 | 对所有者（u`）的 `r`（读）、`w`（写）和 `x`（执行）权限，`-`\
  \ 表示无权限；对于设置了 setuid 位的可执行文件，用 `s` 代替 `x`（第 6.4 节） |\n| 位置 5-7 | 对组（g`）的 `r`、`w`\
  \ 和 `x` 权限，`-` 表示无权限；对于设置了 setgid 位的可执行文件，用 `s` 代替 `x`（第 6.4 节） |\n| 位置 8-10 | 对其他人（o`）的\
  \ `r`、`w` 和 `x` 权限，`-` 表示无权限 |\n\n正如第 3 章第 3.12 节所述，你可以使用 Shell 命令 `umask` 设置/显示默认文件权限。\n\
  \n## 目录权限的含义\n\n\n\n\n对于普通文件，读、写、执行权限的含义是显而易见的。但对于目录，它们的含义有所不同。访问目录时，执行权限是关重要的。目录没有执行权限意味着你甚至无法对该目录执行\
  \ `pwd` 或 `cd`。这意味着你无法访问以该目录为根的目录层次结构中的任何文件，无论该文件本身的权限设置如何。这是因为你需要对目录拥有执行权限才能访问目录中存储的文件名和地址。由于文件是通过遵循路径上的目录来定位的，因此你需要对路径上的所有目录都拥有执行权限才能定位文件。定位文件后，由文件自身的访问模式来决定是否允许特定的访问。\n\
  \n访问目录通常需要同时具备读取权限和执行权限。对目录没有读取权限仅意味着你无法读取目录文件的内容。例如，`ls` 命令将失败，你无法查看目录中包含的文件名。任何文件名扩展尝试也会因相同原因而失败。然而，使用显式名称仍然可以访问此类目录中的文件。\n\
  \n对目录的写权限用于在目录中创建或删除文件。之所以需要此权限是因为文件的创建或删除是通过进入或删除目录条目实现的。因此，仅对文件本身具有写权限不足以删除该文件。事实上，从目录中删除一个文件不需要在该文件具有写权限！相反，如果你对一个文件有写权限，但对其目录没有写权限，你可以修改该文件甚至将其置为空文件，但无法删除该文件。\n\
  \n### 6.4 文件状态\n\n对于 Linux 文件系统中的每个文件，一组文件状态项保存在文件的 i-node 中，并由操作系统维护。文件的 i-node\
  \ 是一种记录文件元数据（关于文件的信息）的数据结构，Linux 使用它来访问和操作文件。文件状态项包括\n\n命令\n\n```bash\nls -l file\n\
  ```\n\n显示给定文件的许多状态项。C 程序中可以使用系统调用 `stat` 来访问文件状态信息。\n\n现代 Linux 系统实现了 `ext4`（由 `ext2`、`ext3`\
  \ 演变而来），它使用 extents 代替固定大小块，更好地支持大容量磁盘并提高了性能。`ext4` 文件系统还支持扩展属性（`xattr`），即以键值对存储的元数据。此类属性可以由用户或操作系统附加到文件。名称部分可以属于不同的\
  \ `xattr` 命名空间。例如，SELinux 安全上下文作为扩展属性附加到文件，名称为 `security.selinux`（security 是命名空间）。`attr`\
  \ 命令默认在 `user` 命名空间中获取和设置文件的扩展属性。你也可以使用 `getfattr` 和 `setfattr` 命令。\n\n#### 文件模式\n\
  \n文件模式由 16 位组成。文件模式的高四位（图 6.1 中的 C-F）指定文件类型。接下来的三位定义了可执行文件的运行方式。文件模式的低九位指定了所有者、组和其他人的读、写和执行权限。文件类型在文件创建时是固定的。运行位和访问位可文件所有者设置。\n\
  \n![image](img/00071.jpeg)\n\n图 6.1 文件模式位\n\n你已经知道如何使用 `chmod` 命令设置这九位访问位。可以通过 `chmod`\
  \ 命令使用数值模式设置与访问位一起设置运行位，例如：\n\n```bash\nchmod mode file\n```\n\n可设置的文件模式\n\n![image](img/00072.jpeg)\n\
  \n数值模式是一个八进制数，是任意数量可设置文件模式的逻辑或结果。对于执行时的设置 ID（set-id-on-execution），可以使用符号模式 `u+s`\
  \ 和 `g-s`。只有文件所有者或超级用户可以更改文件的模式。在大多数 Linux 系统上，`-R` 会导致 `chmod` 对给定目录下的所有文件执行请求的模式设置。\n\
  \n#### 文件 Userid 和 Groupid\n\n在 Linux 中，每个文件都有一个 `userid` 和 `groupid`。文件的 `userid`\
  \ 是创建该文件的所有者的 `userid`。每个用户可以属于一个或多个（上限为合理限制，例如八个）用户组。每个组都有一个名称。密码文件 `/etc/passwd`\
  \ 中的每个用户条目包含组关系。默认情况下，新用户属于一个 `groupid` 与 `userid` 相同的组。如果一个用户属于多个组，则额外的组关系在 `/etc/group`\
  \ 文件中指定。\n\n文件的 `groupid` 可以设置为文件所有者所属的任何组。组权限控制指定组组成员对文件的访问。当文件被首次创建时，它默认被赋予包含它的目录的\
  \ `groupid`。命令\n\n```bash\nchgrp groupid filename ...\n```\n\n用于为指定文件分配指定的 `groupid`。例如，如果\
  \ research 是组名，那么\n\n```bash\nchgrp research *\n```\n\n将将当前目录下每个文件的 `groupid` 更改为\
  \ research。文件的 `userid` 只能由超级用户更改。命令\n\n```bash\nchown ownerid filename ...\n```\n\
  \n用于更改指定文件的所有权。例如，命令\n\n```bash\nchown -R pwang .\n```\n\n将层次结构（以 `.` 为根）中所有文件的所有权更改为\
  \ pwang。`chgrp` 和 `chown` 都接受 `-R` 选项来递归处理文件和文件夹。\n\nBash 提供了一系列查询命令来确定文件的类型、访问权限等。此外，还可以可以使用的\
  \ Linux 命令 `test` 来获取有关文件类型和模式的信息。`test` 命令是一个通用的条件命令，经常用于 Shell 脚本。\n\n#### 访问控制强制\n\
  \n文件总是通过进程访问的，例如 `ls`、`cat`、`rm`、`vim` 或你的 Shell。为了实施访问控制，Linux 使用进程的 `userid` 和\
  \ `groupid` 根据文件的访问模式授予或拒绝对文件的访问。进程的 `userid` 和 `groupid` 通常是调用该进程的用户。用户可能属于多个组；因此进程还保留了一个补充\
  \ `groupid` 列表。\n\n具体来说，如果进程的 `userid` 与文件的 `userid` 相同，则应用 `u` 访问权限。否则，如果文件的 `groupid`\
  \ 匹配进程的 `groupid`，则应用 `g` 权限。否则，应用 `o` 设置（图 6.2）。\n\n![image](img/00073.jpeg)\n\n\
  图 6.2 访问权限强制\n\nSetuid 和 Setgid 模式\n\n如果可执行文件开启了 `setuid` (setgid) 位，则它将在可执行文件的\
  \ `userid` (groupid) 下运行，而不是调用进程的。\n\n`setuid` 和 `setgid` 位通常用于为某些任务授予临时提升权限，这些任务涉及普通用户无法访问的文件/程序。\n\
  \n以更改密码为例。`passwd` 命令开启了 `setuid` 位\n\n```\n-rwsr-xr-x 1 root root 35480 Jul 16\
  \ 2018 /usr/bin/passwd\n```\n\n因此，当你调用 `passwd` 时，它会获得 root 的有效 uid，并修改存储的密码数据文件（通常为\
  \ `/etc/shadow`）。\n\n\n\n\n为目录设置 setgid 位会导致在该目录下创建的新文件和文件夹 继承该目录的 `gid`，而不是创建用户的原始\
  \ `gid`。这对于由参与同一项目的成员共同使用的共享目录非常有用。\n\n目录上的 `setuid` 位通常没有作用。\n\n粘滞位（sticky bit）在旧版系统中曾用于让某些程序加载得更快，现在已很大程度上过时。在某些\
  \ Linux 系统中，此位变为目录的限制删除标记。设置该位后，它可以防止非权限用户删除或重命名目录中的文件，除非该用户是目录或该文件的所有者。在 `ls` 列表中，第\
  \ 10 个权限位置的 `t`（`T`）表示粘滞位已开启，而对于 `o` 的 `x` 则开启（关闭）。\n\n## 建立组\n\n作为文件访问控制功能的一个示例应用，让我们考虑建立一个组，成员可以通过访问彼此选定的文件来协作项目。要建立该组，首先要确定一个名称。在示例中，`groupid`\
  \ 为 `projectx`。接下来，你必须决定谁是该组的成员。在示例中，组成员为 `pwang`、`rsmith`、`jdoe`、`sldog` 和你自己。现在请你的系统管理员创建组\
  \ `projectx`。系统管理员可以直接编辑 `/etc/group`，或者使用诸如 `groupadd` 或 `system-config-users`\
  \ 的命令来设置新组并添加成员。一旦完成，`projectx` 就会作为一个有效组存在于你的系统上。一旦 `projectx` 建立，成员就可以为选定的文件分配所需的访问权限，以便在组内共享。你执行此操作的一种简单方法如下：\n\
  \n1. 在你的主目录下创建一个名为 `alpha` 的目录。`alpha` 中的所有文件都将与 `projectx` 中的其他成员共享。\n2. 通过 `chgrp\
  \ projectx alpha` 将 `alpha` 的 `groupid` 改为 `projectx`。\n3. 现在为 `alpha` 目录设置组访问权限。根据你想要提供的权限，使用以下命令之一：`chmod\
  \ g+rwxs alpha`（或简单的 `g+rws`）、`chmod g=rx alpha`、`chmod g=x alpha`。这些权限之间的差异在第 6.4\
  \ 节中已描述。\n4. 可选地，使用 `chmod +t alpha` 为 `alpha` 文件夹设置限制删除标记。\n5. 你必须确保 `alpha` 中的每个文件都带有\
  \ `groupid` `projectx`，特别是通过 `cp` 或 `mv` 创建的文件。如所述，文件的 `groupid` 通过 `ls -gl` 显示。根据文件的性质，你应当分配相应的组权限。只有当你允许\
  \ `projectx` 中的其他人修改文件时，才赋予组写权限。\n\n## DAC 和 MAC\n\n这里描述的利用文件模式和用户/组 ID 的文件访问控制方案为用户和管理员提供了一种使\
  \ Linux 系统安全的机制。但仍然取决于相关人员根据自己的意愿设置权限位以及用户和组 ID。因此，该方案被称为**自主访问控制 (DAC)**。\n\n通过添加**强制访问控制\
  \ (MAC)**，可以进一步增强 Linux 的安全性，Linux 系统将自带一套将自动应用的安全规则。`SELinux`（安全增强型 Linux）由美国国家安全局（NSA）和\
  \ Linux 社区开发，是实现 MAC 的方法。\n\n现代 Linux 发行版都内置了 `SELinux` 或提供了安装选项。`SELinux` 可以帮助增强安全性，对\
  \ Linux 服务器而言尤为重要。`SELinux` 规则在 DAC 规则之后应用，即使 DAC 允许也可以拒绝访问。如果你遇到了“拒绝访问”但没有发现 DAC\
  \ 方面的原因，那么很有可能是你的 Linux 正在强制 `SELinux`。\n\n我们将在第 8 章第 8.9 节讨论 `SELinux`。\n\n###\
  \ 6.5 文件系统实现\n\n如本章前面所述，文件系统是操作系统对物理数据存储媒介（通常是硬盘）施加的逻辑组织。这种组织结合操作系统提供的例程，允许对文件进行系统的存储、检索和修改。\n\
  \n### 文件系统结构\n\n通常对于 Linux 而言，整个存储系统由一个或多个文件系统组成。每个文件系统都是一个自包含单元，由特定存储分区中的一组数据块组成（第\
  \ 8 章第 8.6 节）。文件可以被视为一个一维字节数组。这些字节存储在给定文件系统的多个块中。\n\n现代磁盘驱动器为数据提供了巨大的存储空间。的数据块大小为\
  \ 1024、2048 和 4096 字节。文件系统可以通过使用更大的块来提高速度。块大小在文件系统创建时确定。\n\n对于每个文件系统，数据块的地址（位置）、状态以及可能的文件的属性信息存储在一个名为\
  \ `i-node`（索引节点）的数据结构中。文件系统所有的 `i-nodes` 都存储在一个名为 `i-list`（或 `i-table`）的线性列表中，它存储在物理存储媒介的已知地址上。`I-node`\
  \ 和 `i-list` 在第 6.4 节中提到过。\n\n`i-node`（图 6.3）存储文件的元信息，包括文件长度（字节）、设备、所有者和组 ID、文件模式以及时间戳。`i-node`\
  \ 还包含指向文件数据块的指针（地址）。例如，`ext2` 文件系统允许 12 个直接指针、一个一级间接指针、一个双级间接指针和一个三级间接指针。`ext3`\
  \ 和 `ext4` 文件系统允许更大的单个文件和整个文件系统大小。\n\n![image](img/00074.jpeg)\n\n图 6.3 i-Node\n\
  \n直接指针是存储文件内容数据的块的地址。间接指针指向一个包含直接指针的块。双级间接指针指向一个包含间接指针的块。三级间接指针指向一个包含双级间接指针的块。通过这种安排，可以容纳非常大的文件。\n\
  \n`i-node` 包含了文件的所有关键元信息。因此，文件系统的实现围绕访问 `i-node` 展开。目录项中的 `i-number` 用于索引 `i-list`\
  \ 并访问文件的 `i-node`。因此，文件路径通过一系列 `i-nodes` 最终到达文件的 `i-node`。图 6.4 显示了路径 `/bin/ls`\
  \ 如何通过一系列 `i-nodes` 和目录项从根目录 `/` 导向文件 `ls`。\n\n![image](img/00075.jpeg)\n\n图 6.4\
  \ 文件地址映射\n\n指向文件的硬链接可以简单地视为另一个包含相同 `i-number` 的目录项。一旦找到文件的 `i-node`，它就会被读入主内存并保持在活动\
  \ i-node 表中，直到文件访问关闭。`i-list` 还包含用于创建新文件的空 `i-nodes`。\n\n`ls` 命令从 `i-nodes` 获取并显示文件状态信息。请参见第\
  \ 11 章第 11.4 节了解如何从 C 程序直接访问 `i-node` 数据。\n\n### 挂载的文件系统\n\n\n\n\n\n在 Linux 中，文件系统指的是由单个\
  \ `i-list` 表示的逻辑存储设备。整个 Linux 文件系统可能包含一个或多个文件系统。其中之一是根文件系统（root filesystem），其他的则是挂载的文件系统（mounted\
  \ filesystems）。根文件系统的 `i-list` 位置操作系统始终已知。挂载的文件系统被挂载（mounted）到根文件系统中的任意目录。可以通过 `umount`\
  \ 命令通过卸载（unmounting）来移除挂载的文件系统。\n\n超级用户（super user）可以使用命令\n\n`mount [-r] devfile\
  \ directory`\n\n将存储在块设备文件 `devfile` 上的文件系统挂载到指定的目录，该目录通常是为此目的而创建的空目录。该目录被称为被挂载文件系统的根目录。如果给了选项\
  \ `-r`，则文件系统将以只读方式挂载。不带任何参数的 `mount` 命令会显示所有已挂载文件系统的名称以及它们在文件树中的挂载点。`df` 命令显示文件系统空间使用情况和所有文件系统的空闲磁盘空间。以下是一个典型的\
  \ `df` 输出。\n\n```\ndf -h\n```\n\n| Filesystem | Size | Used | Avail | Use% | Mounted\
  \ on |\n| /dev/sda6 | 140G | 18G | 115G | 14% | / |\n| /dev/sda3 | 99M | 20M | 75M\
  \ | 21% | /boot |\n| tmpfs | 376M | 68K | 376M | 1% | /dev/shm |\n| /dev/sda2 |\
  \ 146G | 32G | 115G | 22% | /media/ACER |\n\n显示了一个具有四个文件系统的 Linux/MS Windows® 双启动计算机。\n\
  \n`/media/ACER` 是 MS Windows® 侧 `NTFS`（NT 文件系统）的挂载点。大多数 Linux 系统内置了对 `NTFS` 支持，因此\
  \ `NTFS` 分区中的文件和文件夹可以从 Linux 或 MS Windows® 使用。这非常方便。执行 `man -k ntfs` 可以查看你的系统对 `NTFS`\
  \ 的支持。\n\n## 文件系统超级块与块组 (Filesystem Super Block and Block Groups)\n\nLinux `ext2`\
  \ (`ext3`, `ext4`）文件系统由多个块组（block groups）组成。每个块组除了自身的块位图（block bitmap）、`i-node bitmap`、`i-list`\
  \ 以及当然还有数据块外，还包含一份关键文件系统控制信息（超级块和组描述符）的副本。\n\n超级块（super block）定义了一个文件系统。它记录了关于文件系统配置、组织和操作的关键信息：\n\
  \n* 文件系统类型和块设备引用\n* 文件系统的总大小和块大小\n* `i-node list` 的长度\n* 空闲块和空闲的 `i-nodes`\n* `i-nodes`\
  \ 的读、写及其他方法\n\n组描述符（group descriptor）存储了每个块组的块位图、`i-node bitmap` 的位置以及 `i-node table`\
  \ 的起始位置；而这些信息又存储在组描述符表中。超级块和组描述符表对于文件系统至关重要，它们存储在每个块组的开头以提供冗余。\n\n## 6.6 文件系统表 (The\
  \ Filesystem Table)\n\nLinux 上的每个不同文件系统都有自己的块类型特殊文件。这些特殊文件的名称以及控制和管理整个文件系统的其他信息保留在文件系统表（通常为\
  \ `/etc/fstab`）中。该文件每个文件系统有一行，指定了块特殊文件名、挂载的目录名、文件系统类型（本地、`NFS` 或用于内存交换）、挂载/交换选项以及其他信息。\n\
  \n在文件系统表包含的所有文件系统中，在任何给定时间，全部或部分集都可以被挂载。挂载表（`/etc/mtab`）包含当前已挂载文件系统的列表。挂载表通过 `mount`\
  \ 和 `umount` 命令修改。\n\n## 6.7 创建特殊文件 (Creating Special Files)\n\n如前所述，Linux 系统使用特殊文件来表示物理和逻辑\
  \ I/O 设备，并实现统一的文件 I/O 和设备 I/O。特殊文件通常仅创建在系统目录 `/dev` 下。使用命令\n\n`mknod filename [b\
  \ or c] major minor`\n\n通过给定的 `filename` 建立特殊文件。如果设备是块 I/O 设备（硬盘），则使用字符 `b`。如果设备是字符\
  \ I/O 设备（如终端模拟器或打印机），则使用字符 `c`。Linux 上的每个物理 I/O 设备根据其类型分配一个主设备号（major device number）和一个表示相同类型设备内单元的次设备号（minor\
  \ device number）。这些数字是整数。例如，两个打印机 `lp0` 和 `lp1`\n\n```\ncrw-rw—- 1 root lp 6, 0\
  \ 2018-03-06 11:48 lp0\ncrw-rw—- 1 root lp 6, 1 2018-03-06 11:48 lp1\n```\n\n分别具有主设备号\
  \ `6` 和次设备号 `0` 和 `1`。只有超级用户才能创建特殊文件。\n\n## 6.8 网络文件系统 (Network Filesystem)\n\n\
  许多 Linux 系统不仅允许对本地文件系统进行操作，还允许通过网络连接的远程文件系统。网络文件系统（NFS）允许对远程文件进行透明访问。换句话说，NFS 为文件组织带来了许多优势，例如在不同主机上重复存储相同的文件可以被避免，通过将其集中在文件服务器上来实现。为了让事情更加方便，`NFS`\
  \ 可以与不同的硬件和操作系统工作。本地主机上的文件系统通过导出使其变为远程可用。`/etc/exports` 指定了可以导出的文件系统。在修改 `/etc/exports`\
  \ 后必须运行 `exportfs` 命令。\n\n`/var/lib/nfs/etab`（或 `xtab`）列出了正在导出的文件系统。文件系统可以导出给客户端列表并允许只读或读写访问。客户端通过\
  \ `mount` 命令访问远程文件系统\n\n`mount remote-filesystem local-directory` 将由 `host:directory`\
  \ 指定远程文件系统挂载到本地目录。\n\n在大多数 Linux 系统上，甚至挂卸载通过内核直接协助的 `autofs` 机制自动完成。当挂载点发生实际文件访问时，内核调用\
  \ `automount` 程序来挂载远程文件系统。自动挂载的文件系统在一段时间没有访问后会被卸载。\n\n## 6.9 搜索文件树：find (Searching\
  \ the File Tree: find)\n\n我们知道 Linux 文件系统被组织成树形结构。有时需要搜索树的一部分并访问子树中的所有节点。这意味着访问给定目录中的所有文件，并递归地访问子目录中的所有文件。`find`\
  \ 命令提供了这样的树搜索机制。\n\n`find` 命令访问子树中的所有文件并根据给定的布尔表达式选择文件。选择功能允许我们找到的文件并对其进行操作。任何使给定布尔表达式为真的文件都将被选中。\n\
  \n`find` 命令可以定位名称匹配给定模式的文件（显示其路径）。例如，\n\n```\nfind . -name .c -print\n```\n\n在这个示例中，`find`\
  \ 命令被给了两个布尔表达式 `-name .c` 和 `-print`。该命令搜索以当前目录为根的树中的每个文件。正在访问的文件被称为当前文件。如果当前文件的名称匹配模式\
  \ `*.c`（文件名以 `.c` 结尾），则评估下一个表达式（`-print`）。`-print` 表达式只是在标准输出上显示当前文件的路径。因此，上述示例的效果是找到当前目录下所有的\
  \ C 源文件并显示它们的路径。\n\n\n\n\n\n`find` 命令的通用格式为\n\n```\nfind filename … expression ...\n\
  ```\n\n命令名 `find` 后面跟着一个或多个文件名（每个文件名可以是普通文件或目录），然后是一个或多个表达式。系统会对给定的每个文件和目录进行树形搜索。每个表达式都是针对当前文件的谓词，并且始终产生一个真/假值，尽管该表达式也可能产生其他影响。只有当所有之前的表达式都为真时，才会对表达式进行评估。换句话说，针对当前文件的表达式评估会在遇到第一个假表达式时终止，然后搜索过程将继续子树中的下一个文件。\n\
  \n`find` 中使用的表达式是基本表达式或基本表达式的布尔组合。这里在这里解释了一些重要的基本表达式，并描述了每个表达式的作用和布尔值。（由于某些表达式可能涉及我们目前尚未涵盖的概念和功能，如果你愿意，可以暂时跳过这些表达式。）在描述中，参数\
  \ `n` 被用作十进制整数，可以通过以下三种方式之一指定：一个整数、一个前加 `+` 的整数或一个前加 `-` 的整数。指定 `+ n` 表示大于 `n`，`-\
  \ n` 表示小于 `n`，`n` 表示精确等于 `n`。\n\n可以使用以下布尔操作（按优先级递减排序）来组合任何有效表达式 `e1` 和 `e2`。\n\n\
  这里是一些额外的示例。要删除你主目录下目录下所有名为 `a.out` 或 `*.o` 且至少四周未被访问过的文件，请输入（例如：`ex06/findrm`）：\n\
  \n```\nfind (-name a.out -o -name '*.o') -atime +28 -exec rm \"\" \\;\n```\n\n你可以通过在单行命令中输入所有内容来避免换行符。\n\
  \n考虑另一个示例。要显示当前目录下所有不属于 smith 用户的文件名，请输入\n\n```bash\nfind . -user smith -print\n\
  ```\n\n注意，这些示例中使用的许多字符都加了引号以避免被 Shell 解释。\n\n现在，看第三个示例（例如：`ex06/findstr`），假设你的个人\
  \ Web 空间（`$HOME/public_html`）下有几个包含 Linux 单词的 HTML 文件，但你不确定具体是哪些文件。你可以使用 `find`\
  \ 对每个 HTML 文件应用 `fgrep`。\n\n```bash\nfind public_html -name '*.html' -exec fgrep\
  \ Linux {} -print\n```\n\n## 6.10 locate 命令\n\n虽然 `find` 很好且强大，但 `locate` 命令可能更容易使用且速度更快。你给\
  \ `locate` 提供一个 Glob 模式或正则表达式，它就可以显示文件树中所有包含匹配节点名的路径。例如，\n\n```\nlocate gnome (包含\
  \ gnome 的路径)\nlocate -b \\gnome (文件名恰好为 gnome)\nlocate --regex \\.html$ (以 .html\
  \ 结尾的文件名)\n```\n\n`locate` 命令运行更快，因为它搜索的是系统上名为 `updatedb` 的文件和文件夹数据库，该数据库每天会自动更新。\n\
  \n## 6.11 文件的保存、压缩和分发\n\n有时需要将许多文件打包成一个整洁的包并发送到另一台计算机。`tar` 命令用于将一组文件收集到一个文件中称为\
  \ `tar` 文件（该名称源于 tape archive，磁带存档）。`tar` 命令复制整个目录层次结构。目录层次是指文件树子树中包含的所有文件和目录。它通过将多个文件打包成\
  \ `tar` 格式的单个文件来工作，稍后可以使用 `tar` 解压并保留原始的文件文件夹结构。`tar` 文件可以保存为备份，或通过电子邮件或 ftp 轻松传输（第\
  \ 7 章第 7.6 节）。`tar` 命令通常与常用的文件压缩方案如 `gzip` (GNU Zip)、`bzip2` 和 `xz` 一起使用。后者通常提供更好的压缩率。\n\
  \n让我们先看看 `tar` 最简单的用法。\n\n*   (A) `tar cvf tarfile.tar name1 name2 ...`\n*   (B)\
  \ `tar zcvf tarfile.tgz name1 name2 ...`\n*   (C) `tar jcvf tarfile.tbz name1 name2\
  \ ...`\n*   (D) `tar Jcvf tarfile.txz name1 name2 ...`\n\n将命的文件层次结构保存到指定的 `tarfile`\
  \ 中，不进行压缩 (A)、`gzip` 压缩 (B)、`bzip2` 压缩 (C) 或 `xz` 压缩 (D)。选项为 `c`（创建 tar 文件）、`v`（详细）、`f`（tar\
  \ 文件名紧随其后）、`z`（使用 `gzip`）和 `j`（使用 `bzip2`）。\n\n相应的命令\n\n```bash\ntar xvf tarfile.tar\n\
  tar zxvf tarfile.tgz\ntar jxvf tarfile.tbz\ntar Jxvf tarfile.txz\n```\n\n提取 `tarfile`\
  \ 中包含的文件。如果你希望保留文件权限和其他属性，在用 `tar` 打包和解包时使用 `p` 选项。许多 `tar` 格式的软件包可以下载到你的 Linux\
  \ 系统。\n\n在 Windows 平台上常用的 `zip` 实用程序 Linux 上也可用。`zip` 和 `unzip` 命令方便与其他平台交换存档文件。\n\
  \n```bash\nzip -r archive.zip name1 name2 ...\n```\n\n将文件和文件夹打包到指定的存档中，而 `unzip`\
  \ 则解包。\n\n在提供供下载的存档文件时，同时提供一个指纹（finger print）以检查下载的完整性良好做法。为你的存档文件创建 `MD5`（消息摘要算法\
  \ 5）指纹非常简单。命令\n\n```\nmd5sum archivefile > archivefile.md5\n```\n\n将存档文件的名称和它的 `MD5`\
  \ 指纹放在指纹文件 `archivefile.md5` 中。\n\n`md5sum` 更安全的替代方案使用了美国国家安全局发布的 SHA 2 算法。在 Linux\
  \ 上，这些包括命令 `sha224sum`、`sha256sum`、`sha384sum` 和 `sha512sum`，它们产生不同长度的指纹。\n\n###\
  \ 使用 shar 打文件\n\n`tar` 是保存和检索文件的常用命令，因为它恢复了所有文件属性，如所有权访问保护模式。`shar` 命令是另一种将多个文件打包成一个的方法，它不需要担心保留文件属性信息，而且更容易使用。\n\
  \n基本上，`shar` 将文件打包成一个 `sh` 命令的单个文件。通过让 `sh` 处理该文件来解包打包的文件。\n\n```bash\nshar file1\
  \ file2 ... > outfile.sh\n```\n\n将命名的文件（包括目录）打包到一个文件中并发送到标准输出。生成的 `outfile.sh` 文件可以通过电子邮件发送或上传到另一台\
  \ Linux 计算机。\n\n解包只需执行\n\n```bash\nsh < outfile.sh\n```\n\n## 6.12 Samba 文件共享\n\n\
  `Samba` 是一套用于 Linux/Unix 与 MS Windows 系统共享文件和打印机的程序。大多数 Linux 发行版都带有 Samba。\n\n\
  ![image](img/0076.jpeg)\n\n图 6.5 Samba 共享\n\n要访问共享文件，只需在文件浏览器中进入网络 > Samba 或网络 >\
  \ 工作组，或者使用这些命令（图 6.5）：\n\n```bash\nnautilus smb:/ / /\ndolphin smb:/ / /\n```\n\n\
  这也是访问通过 USB 连接到家庭路由器的共享磁盘的简单方法。\n\n## 6.13 更多文件命令\n\n这里列出了一些处理文件和管理文件系统的额外命令。这里提供了每个命令的功能。关于这些命令的选项，请参考相应的帮助页面。\n\
  \n*   `basename` 去掉文件名的前缀后缀。\n*   `chroot` 临时更改根目录 (/) 以测试程序。\n*   `cmp` 比较两个文件以查看它们是否相同。\n\
  *   `comm` 在两个排序文件中选择或拒绝共同的行。\n*   `df` 显示所有文件系统的可用磁盘空间。\n*   `diff` 比较两个文件或目录并输出差异。\n\
  *   `du` 显示目录层次结构中所有文件的大小（以 KB 为单位）。\n*   `size` 显示对象文件的大小。\n*   `split` 将文件分成碎片。\n\
  *   `touch` 更新文件的最后修改时间；如果文件不存在，则创建一个空文件。\n*   `uniq` 报告文件中重复的行。\n\n\n\n\n\n*  \
  \ `wc` 用于统计给定文件的单词数和行数。\n\n### 6.14 更多信息\n\n关于文件系统标准 (FSSTD)，请参阅 Daniel Quinlan\
  \ 编写的《Linux Journal》文章，可在 ACM 网站上找到：\n\nportal.acm.org/citation.cfm?id=324517\n\n\
  关于 Linux 文件系统层次结构的完整信息，请参阅 Linux Documentation Project 的在线文章：\n\ntldp.org/LDP/Linux-Filesystem-Hierarchy/html\n\
  \n有关文件系统内部原理和实现的更多细节，请参考 SourceForge SourceForge.net 《Design and Implementation\
  \ of the Second Extended Filesystem》以及《Linux NFS-HOWTO》。\n\n另见 fossbytes.com 的《Linux\
  \ Filesystems Explained – EXT2/3/4, XFS, Btrfs, ZFS》。\n\n### 6.15 总结\n\n文件系统是任何操作系统的核心，也是\
  \ Linux 内核的一部分。Linux 文件系统层次结构包含了以树形结构排列的文件和目录，从根目录 `/` 向下生长。Linux 文件层次结构在很大程度上遵循\
  \ FSSTND。\n\n不同的文件类型包括目录、特殊文件、链接、普通文件、套接字和命名管道。链接有两种：硬链接和符号链接。符号链接可以指向目录并可以跨越文件系统。对文件和目录的访问受\
  \ `rwx` 权限控制，分别针对文件所有者 (`u`)、文件组用户 (`g`) 和其他人 (`o`)。\n\n可执行文件的 set-userid 位（setuid\
  \ 标识）是一个重要概念。当进程执行 set-userid 文件时，其有效 uid 将变为文件所有者的 uid。\n\n整个文件系统由一个根文件系统和可能的额外挂载文件系统组成。Linux\
  \ 支持不同的文件系统实现，包括 `ext2` 及其扩展（目前为 `ext4`），后者支持以键值对形式存在的扩展属性 (`xattr`)。\n\n每个文件系统由一个\
  \ `i-list` 组织，它是一个 `i-nodes` 列表，包含了每个文件的状态和地址信息以及文件系统中的所有空闲。文件状态信息包括 `userid`、访问组\
  \ `groupid`、`mode`、时间戳和磁盘地址。文件模式的某些指定了文件访问权限。这些属性被用于实施强制访问控制 (DAC)。SELinux（第 8 章）可以通过提供强制访问控制\
  \ (MAC) 来进一步增强系统安全性。\n\nNFS 允许对远程 (NFS) 和本地文件系统的透明访问，便于跨网络共享文件。Samba 使得与网络上的 Windows\
  \ 系统共享文件成为可能。\n\n要对文件层次结构进行系统搜索，请使用 `find` 命令。根据名称快速定位文件/文件夹，使用 `locate` 命令。使用简单的\
  \ `shar` 命令或更高效的 `tar` 命令（配合 `gzip`、`bzip2` 或 `xz` 压缩）将多个文件打包压缩成归包以便于传输。使用 `zip`\
  \ 管理跨不同计算机系统的归文件。\n\n### 6.16 练习题\n\n1. 尝试 `umask` 命令。它关于你创建的文件告诉了你什么？尝试设置 `umask`\
  \ 值然后创建一些文件。查看它们的保护位。\n\n2. 如果你还没有这样做，请从 www.tldp.org/manpages/man-html/ 下载 Linux\
  \ 手册的最新 HTML 版本到你的计算机。解压它以便用 浏览器使用。\n\n3. “filesystem”（文件系统）一词与“file system”（文件系统）短语不同。你能清楚地说明它们的含义吗？\n\
  \n4. 为什么硬链接与原始文件本身无法区分？如果 `rm` 一个硬链接会发生什么？为什么无法指向不同文件系统中的文件的硬链接？\n\n5. 清楚说明目录 `rwx`\
  \ 权限的含义。如果你对具有读取权限但没有执行权限的 `dir` 执行 `ls dir` 会发生什么？为什么？\n\n6. 写一个用于 Web 的 Shell\
  \ 脚本，接收文件夹名称 `fname`，并将以 `fname` 为根目录的文件层次结构中的所有文件设置为 `o+r`，所有文件夹设置为 `o+rx`。\n\n\
  7. 什么是 `xattr`？用于什么目的？`xattrs` 存储在哪里以及以什么形式存储？\n\n8. 用户使用什么命令获取、设置、列出和删除扩展属性？请给出示例。\n\
  \n9. 哪个命令显示文件/目录的 `i-number`？\n\n10. 命令 `rm` 和 `ls` 如何作用于普通文件是很清楚的。描述它们如何作用于符号链接。符号链接必须指向存在的文件吗？如果符号链接的实际文件被删除会发生什么？符号链接可以指向另一个符号链接吗？\n\
  \n11. 考虑 `.` 和 `..` 特殊文件。说这些文件是系统创建的目录硬链接正确吗？\n\n12. 考虑 Bash 脚本 `clean.sh`（第 5 章，第\
  \ 5.20 节）。如果在尝试清理的目录中存在符号链接，脚本还能正常工作吗？如果有问题，你会如何修复？\n\n13. 尝试 `rm` 一个你没有写权限的文件。`rm`\
  \ 给出了什么信息？你是如何响应的？能够删除该文件吗？为什么？\n\n14. 当调用可执行文件时，新进程总是假设调用它的用户的 userid 吗？解释原因。\n\
  \n15. 你正在家目录下的某处寻找一个包含 `zipcode` 字符串的文件。如果你知道/不知道哪个目录包含该文件，描述你如何定位该文件。如果该文件可能是以点开头的隐藏文件怎么办？\n\
  \n16. 究竟如何创建一个 `.tgz` 文件？如何从 `.tgz` 文件中提取内容？`.tbz` 和 `.txz` 文件呢？\n\n17. 找出如何在你的\
  \ Linux 家目录中设置 Samba 共享文件夹。解释每一步。\n\n1 读作 S E Linux。\n\n2 参见第 6.8 节。\n\n# 第 7 章](#part0003.html_tocchapter7)\n\
  \n# 网络、互联网与万网](#part0003.html_tocchapter7)\n\n早期的包交换计算机网络涉及几家研究机构和政府机构，于 20 世纪 60\
  \ 年代末和 70 年代初开始。今天，很难判断计算机在哪里结束，网络从哪里开始。“网络即计算机”这一观点比以往任何时候都有效。大多数人无法忍受几分钟的互联网连接中断。\n\
  \n计算机网络是连接许多（可能不同的）计算机或主机的高速通信介质。网络是计算机和电信硬件及软件的结合。其目的是在主机之间提供快速可靠的信息交换。网络提供的典型服务包括\n\
  \n*   电子邮件\n*   在线聊天和网络电话\n*   文件传输\n*   远程登录\n*   分布式数据库\n*   网络文件系统\n*   音频和视频流\n\
  *   网络上的语音和电话\n*   万维网、电子业务、电子商务和社交网络\n*   远程过程调用和对象访问\n\n除了主机计算机外，网络本身可能涉及执行网络功能的专用计算机：集线器、交换机、桥、路由器和网关。网络极大地扩展了连接主机的功能。而专用服务器主机通过提供高效的服务极大地了网络的力量和实用性。\n\
  \n良好的基础网络概念、命令、信息安全以及 Web 的工作原理，对于任何 Linux 用户、程序员和服务器管理员来说都是重要的。\n\n### 7.1 网络协议](#part0003.html_C2tocsec7_2001)\n\
  \n\n\n\n为了让不同供应商、不同操作系统的程序和计算机在网络上进行通信，必须为所有参与方建立一套详细的规则和惯例。这些规则被称为网络协议。我们为不同的目的使用不同的网络服务；因此，每个网络服务都遵循其特定的协议。协议规定了此类细节：\n\
  \n*   主机和进程的地址格式\n*   数据格式\n*   数据传输方式\n*   消息的排序和寻址\n*   连接的启动和终止\n*   服务的建立\n\
  *   服务的访问\n*   数据完整性、隐私性和\n\n因此，一个主机上的进程要与另一个主机上的进程进行通信，这两个进程必须遵循相同的协议。开放系统互连（OSI）参考模型（图\
  \ 7.1）为网络协议及其相互依赖关系提供了一个标准的分层视图。不同主机以及网络基础设施内部相应的层执行互补任务，以建立通信进程（图 7.1 中的 `P1` 和\
  \ `P2`）之间的连接。\n\n![image](img/00077.jpeg)\n图 7.1 网络层\n\n在常见的网络协议中，IP 协议族使用最广泛。基础的\
  \ `IP`（互联网协议）是一种网络层协议。`TCP`（传输控制协议）和 `UDP`（用户数据报协议）位于传输层。Web 是一种服务，它使用称为 `HTTP`（超文本传输协议）的应用层协议。\n\
  \n网络协议并不神秘。想一下拨电话的协议。你（客户端进程）必须拿起电话，听拨号音音，拨打一个有效的电话号码，并等待对方（服务器进程）接听电话。然后你必须说“你好”，介绍自己的身份，等等。如果你想通过电话网络成功拨通，就不能偏离这个协议，这为什么需要这种协议是显而易见的。计算机程序尝试通过计算机网络与另一个计算机程序通信，情况也是如此。为不同的网络服务设计高效有效的网络协议是计算机科学的一个重要领域。\n\
  \n你的 `Linux` 系统很可能连接到一个接入互联网的局域网（LAN）上。这意味着你能够无需离开工作站座椅，几乎瞬间跨越远距离获取信息、交换消息、上传/下载文件、与他人互动、进行文献检索等更多操作。如果你的计算机没有直接连接到网络，而是有电话或或调制解调器，那么你可以通过互联网服务提供商（ISP）访问互联网。\n\
  \n## 7.2 互联网\n\n互联网是一个使用互联网协议（`IP`）连接计算机网络的全球网络。计算机网络之间的连接被称为互联（internetworking），因此名为\
  \ Internet（互联网）。互联网连接了世界各地的组织：大学、政府机构、公司、图书馆、超级计算机中心、实验室和个人家庭。互联网上的连接数量巨大且正在迅速增长。\n\
  \n互联网演变自 ARPANET，¹，这是一项由美国国防部高级研究计划署（DARPA）赞助的网络，该网络开发了 `IP` 以及更高级的传输控制协议（`TCP`）和用户数据报协议（`UDP`）网络协议。其架构和协议的设计是为了支持能够抵御战争攻击的可靠且灵活的网络。\n\
  \nARPANET 向互联网的过渡发生在 20 世纪 80 年代后期，美国国家科学基金会（NSF）的大学和超级计算机中心网络 NSFnet 帮助产生了大量的基于\
  \ `IP` 的本地和区域网络及连接。互联网现在占据主导地位，以至于几乎消除了如 `BITNET` 和 `DECnet` 等所有历史对手。\n\n互联网名称与数字分配机构（`ICANN`;\
  \ www.icann.org）是一个非盈利组织，负责 IP 地址空间分配、协议参数分配、域名系统管理以及维护根服务器系统功能。\n\n### 网络地址\n\n\
  主机计算机的地址就像电话的号码。互联网上的每个主机都有自己的网络地址，用于识别通信目的的主机。寻址技术是网络及其协议的重要部分。互联网地址（`IPv4` 地址）由\
  \ 32 位数量的 4 个字节表示。例如，肯塔州立大学的主机 `tiger` 的 `IP` 地址为 `131.123.41.83`（图 7.2）。这种点表示法（或四位表示法）给出每个字节十进制值（0\
  \ 到 255）。为了适应连接设备数量的爆炸式增长，互联网正在向 `IPv6` 迁移，它支持 128 位地址。`IP` 地址在另一个方面与电话号码相似：前导数字类似于区号，末尾数字类似于本地号码。\n\
  \n![image](img/00078.jpeg)\n图 7.2 IPv4 地址\n\n由于其数值性质，点表示法对机器来说很容易但对用户来说很困难。因此，每个主机可能还有一个由单词组成的域名，类似于邮政地址。例如，`tiger`\
  \ 的域名是 `tiger.zodiac.cs.kent.edu`（位于肯塔州立大学计算机科学系）。`Linux` 命令 `host` 可以显示任何给定主机的\
  \ `IP` 和域名。例如，\n\n```\nhost tiger.zodiac.cs.kent.edu\n```\n\n显示\n\n```\ntiger.zodiac.cs.kent.edu\
  \ has address 131.123.41.83\n```\n\n通过域名，主机的整个互联网名称空间在层次树中被递归划分为不相交的域（图 7.3）。`tiger`\
  \ 的地址将其置于 `cs` 本地域、`zodiac` 子域内，然后位于 `kent` 子域内，而 `kent` 属于美国教育机构的 `edu` 顶级域（TLD）。其他顶级域包括\
  \ `org`（非营利组织）、`gov`（美国政府部门）、`mil`（美国军事设施）、`com`（商业机构）、`net`（网络服务供应商）、`uk`（英国）、`cn`（中国）等。在本地域（例如\
  \ `cs.kent.edu`）内，你可以通过主机引用机器（例如 `monkey`、`dragon`、`tiger`），但外部机器必须使用完整地址。关于互联网域名的更多信息可以参见章节\
  \ 7.19。\n\nICANN 认证域名注册商，注册商为客户注册域名以保持其唯一性。所有网络应用程序都接受以域名或 IP 地址形式给出的地址。事实上，域名在使用之前会先翻译为数值\
  \ IP 地址。\n\n### 分组交换\n\n互联网上的数据以数据包的形式发送和接收。数据包将传输数据与地址信息封装，以便数据可以通过网络上的中间计算机进行路由。由于从源主机到目标主机有多条路由，互联网非常可靠，即使网络部分出现故障也能运行。\n\
  \n### 客户端和服务器\n\n最常见的情况下，网络应用程序涉及一个服务器和一个客户端（图 7.4）。\n\n\n\n\n\n-   服务器进程在提供此类服务的宿主机上提供特定的服务。示例服务包括电子邮件（SMTP）、安全远程主机访问（SSH）、安全文件传输（SFTP）以及万维网（HTTP）。每种互联网标准服务都有其唯一的端口号，该端口号在所有主机上都是相同的。端口号结合主机的\
  \ Internet 地址，可以标识网络上任何位置的特定服务器程序（见图 7.4）。例如，SFTP 的端口号为 115，SSH 为 22，HTTP 为 80。在你的\
  \ Linux 系统上，文件 `/etc/services` 列出了标准和额外的网络服务，并指出了它们的协议和端口号。\n\n-   宿主机上的客户端进程连接到另一台宿主机上的服务器以获取其服务。因此，客户端程序是获取特定网络服务的代理。不同的服务通常需要不同的代理。\n\
  \n像 Firefox 这样的 Web 浏览器是一个 HTTP 客户端。它运行在你的计算机上访问任何互联网主机上的 Web 服务器。Linux 的 `wget`\
  \ 命令是另一个实用的客户端，可以使用 HTTP 或 FTP 协议从互联网下载文件。\n\n![image](img/00080.jpeg)\n\n图 7.4\
  \ 客户端与服务器\n\n### 7.3 域名系统\n\n如 7.2 节所述，互联网上的每个主机都有一个唯一的 IP 地址和域名。网络命名空间（所有域名及其关联\
  \ IP 地址的集合）随着主机的添加和删除、本地工作组的重组、网络子部分的重新配置、系统和网络的维护等随时间发生动态变化。因此，新的域名、新的 IP 地址以及新的域名到\
  \ IP 关联可以随时引入命名空间，而无需集中控制。域名系统（DNS）是一种支持对分布式命名空间中包含的信息进行动态更新和检索的网络服务（见图 7.5）。网络客户端程序（例如\
  \ Firefox 浏览器）在与服务器联系之前，通常会使用 DNS 获取目标主机的 IP 地址信息。动态 DNS 还提供了一种检索有关主机和个人用户的各种信息的通用机制。\n\
  \n![image](img/00081.jpeg)\n\n图 7.5 域名到 IP\n\n以下是关于 DNS 命名空间的注意事项：\n\n-   DNS 将整个互联网命名空间组织成一个巨大的树形结构。树的每个节点代表一个域名，并有一个标签和一个资源列表。\n\
  \n-   标签是字符字符串（目前不区分大小写），且兄弟标签必须是唯一的。根由空字符串标记。根的紧下方是顶级域名（TLD）：edu、com、gov、net、org、info\
  \ 等。顶级域名还包括国家名称，如 at（奥地利）、ca（加拿大）和 cn（中国）。例如，在 edu 下有子域名 berkeley、kent、mit、uiuc\
  \ 等（见图 7.3）。\n\n-   节点的完整全限定域名名（FQDN）是一个由点分隔的标签列表，从该节点通到根（例如，`cs.kent.edu.`）。\n\n\
  -   相对域名是全限定域名名的的前缀，表示相对于源域名的节点。因此，`cs.kent.edu` 实际上是相对于根的名称。\n\n-   标签是域名的正式或规范名称。允许使用替代名称，称为别名。例如，主\
  \ Web 服务器主机信息具有别名 `www`，因此它也被 `www.cs.kent.edu`。要将 Web 服务器移动到不同的主机，本地系统管理员会将别名重新分配给另一个主机。\n\
  \n访问第 7.19 节获取更多关于 DNS 和域名服务器的信息。\n\n### 7.4 Nautilus 中的网络\n\n我们首先在第 2 章第 2.7 节中引入了\
  \ GNOME Nautilus 文件管理器。启动 Nautilus 并进入“+ 其他位置”（+ Other Locations）（见图 7.6\n\n图 7.6\
  \ Nautilus 中的网络\n\nLinux 系统是逐一列出的。运行其他操作系统的系统被归类在不同的图标下，例如 Windows 网络图标。当然，你可以只浏览你有权限的机器。通常除非你安排了无密码登录，否则需要登录（见第\
  \ 7.6 节）。\n\n你也可以连接到你有访问权限的新服务器。这里是一些示例连接：\n\n-   `sftp://pwang@tiger.zodiac.cs.kent.edu`—安全\
  \ FTP，tiger.zodiac.cs.kent.edu 上 pwang 的家目录。\n\n-   `ssh://pwang@tiger.zodiac.cs.kent.edu`—安全\
  \ shell，与上面相同。\n\n-   `sftp://pwang@tiger.zodiac.cs.kent.edu/Pictures`—安全 FTP，pwang\
  \ 的 Pictures 文件夹（见图 7.7）。\n\n![image](img/00083.jpeg)\n\n图 7.7 通过 Nautilus SFTP\n\
  \n#### 访问共享文件\n\n通常，你会在本地网络中找到 Linux 和 Windows 系统。Nautilus 可以轻松访问 Samba 共享文件，它是\
  \ SMB（服务器消息块）协议的后续者。Linux 系统使用 Samba，作为服务器和客户端访问 Windows 共享，以确保目标主机的 IP 地址。这里是本地网络的一些示例：\n\
  \n`smb://host`\n\n通过 SMB 访问共享文件夹\n\n`smb://host/share_folder`\n\n```\nsmb://192.168.102/Shared\n\
  smb://192.168.107/Public\n```\n\n### 7.5 网络命令\n\nLinux 提供了许多网络命令。这里描述了一些常用命令供你入门。在前面的章节中，我们简要提到了\
  \ `hostname` 显示你正在使用的计算机的域名。如果给定参数，该命令还可以设置域名（以 root 身份运行时）。要从 DNS 获取你的计算机或另一个主机的\
  \ IP 地址和其他关键信息，你可以使用\n\n```\nhost $(hostname) (你的计算机)\nhost target (目标主机)\n```\n\
  \n例如，`host google.com` 输出：\n\n```\ngoogle.com 有地址 74.125.45.100\ngoogle.com 有地址\
  \ 74.125.67.100\ngoogle.com 有地址 209.85.171.100\ngoogle.com 邮件由 10 smtp4.google.com\
  \ 处理\ngoogle.com 邮件由 10 smtp1.google.com 处理\ngoogle.com 邮件由 10 smtp2.google.com\
  \ 处理\ngoogle.com 邮件由 10 smtp3.google.com\n```\n\n对于任何给主机，其 DNS 数据提供 IP 地址、规范域名、别名、DNS\
  \ 服务器和邮件主机。其他从命令行访问 DNS 数据的命令包括 `nslookup` 和 `dig`（DNS 信息）。例如，\n\n`dig tiger.zodiac.cs.kent.edu`\n\
  \n给出\n\n```\n; >>< DiG 9.10.5-P2-RedHat-9.10.5-2.P2.fc25 >>< tiger.zodiac.cs.kent.edu;;\
  \ global options: +cmd;; Got answer:;; -<<HEADER>>- opcode: QUERY, status: NOERROR,\
  \ id: 60868;; flags: qr rd ra; QUERY: 1, ANSWER: 1, AUTHORITY: 0, ADDITIONAL: 1;;\
  \ OPT PSEUDOSECTION:; EDNS: version: 0, flags:; udp: 8192;; QUESTION SECTION:;tiger.zodiac.cs.kent.edu.\
  \ IN A;; ANSWER SECTION:tiger.zodiac.cs.kent.edu. 43200 IN A 131.123.41.89;; Query\
  \ time: 41 msec;; SERVER: 209.18.47.62#53(209.18.47.62);; WHEN: Wed Sep 20 11:14:17\
  \ EDT 2017;; MSG SIZE rcvd: 69\n```\n\n所需的信息（ANSWER 部分）以及提供数据的名称服务器（SERVER）的身份将被显示。\n\
  \n\n\n\n\n`dig` 命令对于验证主机是否存在以及查找主机的 IP 地址或域名别名非常实用。一旦知道了主机的名称，你还可以使用 `ping` 命令从网络角度测试该主机是否正在运行。\n\
  \n```\nping host\n```\n\n该命令会向给定的远程主机发送一条消息，请求其在存活且正常时响应以回显（echo）。\n\n要查看任何远程主机是否正在运行，你可以使用\
  \ `ping`，它会向远程主机发送一个回显互联网控制消息（ICMP）。如果收到回显，你就知道该主机已启动并连接到互联网。你还将获得往返时间（RTT）和丢包统计数据。在成功后，`ping`\
  \ 命令会继续发送回显包。输入 `CTRL+C` 退出。\n\n### 7.6 带有 X11 转发的 SSH\n\n网络允许你方便地远程访问 Linux 系统。大多数\
  \ Linux 发行版都内置了 OpenSSH。正如第 [1] 章第 [1.2] 节所述，你可以 `ssh` 连接到远程 Linux 并在命令行中使用它。此外，你可以\n\
  \n```\nssh -X userid@remoteHostname\n```\n\n通过 X11 转发/隧道登录到给定的远程主机，这允许你\n\n![image](img/00084.jpeg)\n\
  \n图 7.8 数字签名\n\n在远程主机上启动任何 X 应用（例如 `gedit` 或 `gnome-terminal`），并让图形显示出现在你的本地桌面上。\n\
  \n如果你的本地主机是 Linux/UNIX/MacOS 系统，此方法有效。它也可以在 MS Windows 上运行。按照以下步骤操作：\n\n1. 在 Windows\
  \ 上获取并安装 X11 服务器，例如 `Xming` 或功能更强大的 `Cygwin`。\n2. 假设你已经下载并安装了 `Xming`，点击 `Xming`\
  \ 图标启动 X11 服务器。X11 服务器会在启动面板上显示一个图标，让你知道它正在运行。\n3. 在你的 MS Windows® 系统上设置 `SSH` 或\
  \ `Putty`：\n    * `Putty` 设置——进入 `Connection` -> `SSH` -> `X11` 并勾选 `Enable X11\
  \ forwarding` 复选框。同时将 `X display location` 设置为 `127.0.0.1:0`。\n    * `SSH` 设置——勾选\
  \ `Tunneling` -> `Tunnel X11 Connections` 复选框。同时勾选 `Authentication` -> `Enable SSH2\
  \ connections` 复选框。\n4. 使用 `Putty` 或 `SSH` 连接到远程 Linux/Unix 计算机。确保你的远程账户登录脚本（如 `.bash_profile`）没有设置\
  \ `DISPLAY` 环境变量。当你通过 `SSH` 连接时，系统会自动将该变量设置为类似 `localhost:10.0` 的值。\n5. 确保你的 X11\
  \ 服务器（例如 `Xming`）正在运行。现在，如果你在远程 Linux 系统上启动一个 X 应用，该图形程序将通过 `SSH` 隧道到你的计算机，并使用你电脑上的\
  \ X11 服务器来显示图形用户界面（GUI）。例如，你可以启动 `gedit`、`nautilus –no-desktop` 甚至 `firefox`。\n\n\
  注意，与远程 CLI 相比，使用带有远程 GUI 的应用程序由于网络负载大得多，可能会缓慢。\n\n#### 免密 ssh, sftp, 和 scp\n\n`ssh`、`sftp`\
  \ 和 `scp` 命令分别用于远程登录、安全 FTP 和安全远程复制。在使用这些任何一个命令时，你通常需要交互式地输入远程系统的密码。当你需要频繁执行此类任务时，这会很麻烦。幸运的是，你可以轻松避免输入密码。只需遵循以下步骤即可。\n\
  \n大多数 Linux 系统都安装了 OpenSSH。这意味着你已经拥有了 `SSH` 命令套。这些命令允许你从一台计算机（作为 `host 1`  `user\
  \ 1`）安全地通信到另一台计算机（作为 `host 2`  `user 2`）。我们假设你已以 `user 1` 身份登录到 `host 1`（你的本地主机），并希望与远程主机上的账户\
  \ `user 2` 安全通信。\n\n`SSH` 可以使用密钥加密进行数据安全和用户身份验证（第 [7.9] 节）。如果你还没有这样做，安排免密登录的第一步是生成自己的\
  \ SSH 密钥。执行命令\n\n```\nssh-keygen\n```\n\n系统会要求你输入保存密钥的文件夹以及访问密钥的短语。在这种情况下，不要对 `ssh-keygen`\
  \ 的这些问题提供任何输入。只需对每个问题按 `ENTER` 键即可。\n\n密钥生成需要一些时间。然后你会看到一条消息，告诉你你的身份（私钥）是 `id_rsa`，公钥是\
  \ `id_rsa.pub`，它们保存在在你主目录下的标准文件夹 `.ssh/` 中。\n\n第二步是将你的 `id_rsa.pub` 拷贝到目标远程主机的账户上。执行命令\n\
  \n```\nssh-copy-id -i ~/.ssh/id_rsa.pub your_userid@remote-host\n```\n\n将你的公钥 SSH\
  \ 密钥附加到远程主机上的 `userid/.ssh/authorized_key` 文件中。\n\n现在你已经准备好了。你可以无需输入密码即可登录远程主机。\n\
  \n```\nssh userid@remote-host\n```\n\n相同的设置在你在使用 `sftp` 或 `scp` 时也能避免密码。\n\n####\
  \ 远程文件同步\n\n`rsync` 命令可以轻松保持两个主机之间的文件同步。它非常高效，因为它使用远程更新协议仅跨网络连接传输两组文件之间的差异。对于没有差异的文件不进行任何更新。通过命令\n\
  \n```\nrsync -az userid @ host:source destDir (远程到本地同步)\nrsync -az source userid\
  \ @ host:destDir (本地到远程同步)\n```\n\n给定的源文件/文件夹用于更新目标文件夹 `destDir` 下相同的内容。当源是一个文件夹且末尾没有\
  \ `/` 时，将更新以该文件夹为根的整个层次结构。使用 `source /` 格式可以将源文件夹内的所有文件同步到目标文件夹。\n\n`-az` 表示常用的归档模式（保留文件类型和模式）以及\
  \ gzip 数据压缩（第 [6] 章第 [6.11] 节），节省网络带宽。`rsync` 工具通常使用 `ssh`（第 [7.6] 节）进行安全数据传输，如果两个主机之间已建立免密\
  \ SSH，则不需要密码。例如，以下任一命令\n\n```bash\nrsync -az pwang@tiger.zodiac.kent.edu:/linux_book\
  \ /projects\nrsync -az pwang@tiger.zodiac.kent.edu:/linux_book/ /projects/linux_book\n\
  ```\n\n都会通过在远程主机 `tiger.zodiac.kent.edu` 上以 `pwang` 登录，根据远程文件夹 `/linux_book` 更新本地文件夹\
  \ `/projects/linux_book`。完整的文档请参阅 `rsync` 手页。\n\n### 7.7 密码学\n\n密码系统通过加密技术保持通信安全，这种技术在互联网或数字计算机发明很久以前就有了。原理很简单：明文（原始消息）在通信之前被加密成密文。只有接收者知道如何将密文还原为明文。\n\
  \n例如，`rot13`（图 [7.8]）是一种简单的字母替换密码，明文中的每个字母都被替换为其后 13 个位置的字母，假设只有 26 个字母且最后一个字母之后是循环的第一个字母。`rot13`\
  \ 密文可以通过再次对其应用加密算法来解密。\n\n![image](img/00085.jpeg)\n\n图 7.9 Rot13 转盘\n\n另一个例子是，一个开有孔、信纸大小的模板可以用于发送秘密信件。发送者通过模板的孔在普通信纸上写下明文。然后发送者会撰写一封听起来正常的信，将明文的单词嵌入到信中的许多其他词中。接收者使用相同模板的副本即可轻松地恢复明文。\n\
  \n\n\n\n或者，发送者和接收者可以约定使用一本书。密文将包含页码、行号和单词数，以识别书中的任何特定单词。只有知道是哪一本书以及这些数字含义的人才能解密信息。此外，许多数字中的一个可能表示在几个可能的书籍中指定某一本。\n\
  \n在第二次世界大战之前和期间，德国人大量使用了各种名为 `Enigma` 的机电机械转子密码机。\n\n这些是对称加密系统的示例（第 7.8 节），它们使用相同的密钥对消息进行加密和解密。通信双方必须提前知道密钥。密钥必须对他人保密。显然，在上述示例中，`rot13`、纸质模板、书籍加编号方案以及\
  \ `Enigma` 机器就是密钥。\n\n然而，公钥加密系统是非对称的，使用的不是一个密钥而一对密钥——一个用于加密，另一个用于解密。解密密钥保密，而加密密钥可以公开共享（第\
  \ 7.9 节）。\n\n### 7.8 对称加密系统\n\n现代电子对称加密系统（图 7.9）需要处理数字数据。它们中的大多数（如果不是全部的话）使用公开的加密/解密算法和保密的密钥。\n\
  \n*   加密/解密算法：该算法对明文或密文的块（通常是 128 位或 256 位块）执行各种替换和置换。\n*   秘密密钥：明文（密文）和秘密密钥输入到加密（解密）算法中。执行的精确转换取决于所使用的密钥。算法根据给定的密钥产生不同的输出。在密文上使用相同的密钥，解密算法会产生原始明文。\n\
  \n![image](img/00086.jpeg)\n\n图 7.10 对称加密系统\n\n对称加密系统通常具有以下两个特征：\n\n1.  公开算法：加密/解密算法可以公开描述。已知算法但不知道秘密密钥的情况下，解码任何密文是不现实的。\n\
  2.  秘密密钥：发送者和接收者必须提前安全地获得密钥，并且必须对密钥保密。\n\n秘密密钥通常是足够长度的位模式。秘密密钥的质量非常重要。它应该是随机生成的，长度为\
  \ 256 位或更长，以至于尝试所有可能的密钥的暴力攻击变得不可。\n\n当使用密码（或短语）作为密钥时，通常会通过密钥派生函数，该函数将其压缩或扩展到所需的密钥长度。通常在将密码或短语转换为实际密钥之前，还会添加一段名为\
  \ `salt`（盐值）的随机生成的数据。\n\n高级加密标准 (`AES`）是由美国国家标准与技术研究院 (`NIST`）于 2001 年建立的用于电子数据的对称加密系统。`AES`\
  \ 已被美国政府采用并在全球范围内使用。它取代了 1977 年发布的数据加密标准 (`DES`）。还有其他对称密码。\n\n\n\n系统将提示你输入 `keytype`（选择默认值）、`keysize`（选择\
  \ 2048）以及密码短（选择一个你既不会忘记，但别人很难猜到的密码）。每次访问私钥时都需要输入该密码短，以防止他人使用你的私钥。\n\n密钥对生成后，系统会显示一个\
  \ `keyid`。你的密钥和其他信息默认存储在 `$HOME/.gnupg` 文件夹中。使用以下命令\n\n```\ngpg –list-public-keys\n\
  ```\n\n来显示你的公钥。例如：\n\n```\npub 1024D/FCF2F84D 2018-07-25\nuid Paul Wang (monkeykia)\
  \ < pwang@cs.kent.edu >\nsub 1024g/B02C4B40 2018-07-25\n```\n\n`pub` 行表示 Paul 的公主密钥（用于签名）是一个\
  \ ID 为 `FCF2F84D` 的 1024 位 DSA 密钥，而他的公子密钥（用于数据加密）是一个 1024 位 ElGama 密钥。\n\n`key uid`\
  \ 为 `\"Paul Wang\"`、`monkeykia` 或列出的电子邮件地址。\n\n为了让他人能够加密发送仅供你查看的信息，你应该将你的公钥发送到公钥服务器。使用命令\n\
  \n```\ngpg –send-keys your_keyid\n```\n\n会将你的公钥发送到默认的 `gpg` 密钥服务器，例如\n\n`hkp://subkeys.pgp.net`\n\
  \n此外，你也可以通过发送以下命令生成的 ASCII 密文文件将公钥发送给任何人：\n\n```\ngpg –armor –export your_keyid\
  \ > mykey.asc\n```\n\n`.asc` 后缀仅表示该文件是一个 ASCII 文本文件。`mykey.asc` 包含使用 `base64` 编码的密钥，这种方法使用\
  \ 64 个 ASCII 字符（A–Z、a–z、0–9 以及 `+/`）对非 ASCII 文件进行编码，以便在网络上（尤其是通过电子邮件）进行通信。Linux\
  \ 的 `base64` 命令对任何文件执行此编码/解码操作。更多信息请参见 `man base64`。\n\n此类 ASCII 密文密钥文件可以发送给他人，或发送到另一台计算机并使用如下命令导入到另一个\
  \ GnuPG 密钥环：\n\n```\ngpg –import mykey.asc\n```\n\n此外，编辑你的 `$HOME/gnupg/gpg.conf`\
  \ 文件并追加该行\n\n```\ndefault-key your_keyid\n```\n\n## 使用 GnuPG 进行解密\n\n使用 `key_uid`\
  \ 的公钥加密文件：\n\n```\ngpg –encrypt -r key_uid filename\n```\n\n将生成一个加密文件 `filename.gpg`，该文件可以发送给目标用户，他是唯一可以解密它的人。\n\
  \n即使你不打算向任何人发送文件，仍然可以将你文件中的秘密信息保护起来，以防有人未经授权访问你的计算机账户。你可以：\n\n```\ngpg –encrypt\
  \ -r \"your_key_uid\" filename\nrm filename\n```\n\n生成加密后的 `filename.gpg` 并删除原始的\
  \ `filename`。你可以通过以下命令轻松查看加密版本：\n\n```\ngpg –decrypt filename.gpg | more\n```\n\n\
  为了让维护加密文件变得更加简单，你可以配置 `vi/vim` 使其与 `gpg` 透明工作，允许你使用 `vim` 查看和编辑明文以及 `gpg` 加密文件。VIM\
  \ 扩展 `tGpg`（另一个用于 `gpg` 加密文件的插件）是此目的良好选择。\n\nSeahorse 工具方便于管理你的加密密钥。\n\n## 7.11\
  \ 安全电子邮件\n\n现代电子邮件客户端（如 Microsoft Outlook 和开源 Thunderbird）支持由 S/MIME（安全多用途互联网邮件扩展）标准指定的安全电子邮件。一旦设置好，你就可以发送和接收加密邮件以及签名消息。当邮件消息被加密时，邮件内容和附件将转换为密文。当然，邮件主题或其他邮件头信息不会被加密。\n\
  \n当邮件被签名时，没有任何内容被加密，除了附加了签名消息摘要。通常情况下，我们不想对邮件签名。但也可以对邮件同时进行加密和签名。\n\nS/MIME 的前提是每位联系人必须必须在安全电子邮件客户端中安装电子邮件证书。\n\
  \n商业个人电子邮件 (S/MIME) 证书很容易从 CA（证书颁发）获取。你甚至可以找到提供免费电子邮件证书的 CA。但认证申请和验证过程对许多用户来说可能复杂且繁琐。\n\
  \nS/MIME 的良好替代方案是 PGP/MIME（优良隐私），它不需要 CA 颁发的证书。免费的 GnuPG（GNU Privacy Guard；GPG）是\
  \ OpenPGP 标准的实现。使用 GPG，你可以生成并发布自己的密钥对以用于安全电子邮件。\n\n让我们看看如何为 GnuPG 配置 Thunderbird\
  \ 用于安全电子邮件。其他电子邮件客户端（如 `evolution` 和 `mutt`）也可以类似地与 GnuPG 工作。\n\n### 使用 Thunderbird\
  \ 使用安全电子邮件\n\n首先，确保你的 Linux 发行版已安装了 Thunderbird 和 GnuPG。然后按照此简单程序启用 Thunderbird\
  \ 安全电子邮件 (PGP/MIME)。\n\n1. 打开 Thunderbird 并使用 `tools -> Add-ons` 选项搜索并安装 `Enigmail`\
  \ 插件。\n2. 遵循 `Enigmail` 设置向导设置你的密钥对（使用正确的名称和电子邮件地址）。电子邮件地址应与你的 Thunderbird 电子邮件身份对应。你可以选择密钥永不过期。还建议在高级选项中选择\
  \ `4096 RSA/RSA` 密钥。\n3. 可选，你可以将密钥与一张 JPG 图片关联。这以后也可以完成。\n\n![image](img/00090.jpeg)\n\
  \n图 7.14 添加了 Enigmail 的 Thunderbird\n\n现在，你的 Thunderbird 设置好了。但在发送和接收加密邮件之前，你需要：\n\
  \n(A) 将你的公钥发送给你认识的人，以便他们向你发送加密邮件。\n(B) 接收/安装他们的公钥，以便你可以向他们发送加密邮件。\n\n对于 (A)，执行以下操作：\n\
  \n1. 从 Thunderbird 菜单（点击 Thunderbird 栏右侧的三杠图标），选择 `OpenPGP -> Key Management` 弹出密钥管理对话框。\n\
  2. 在密钥管理对话框中，勾选 `Display All Keys by Default`（默认显示所有密钥）。你应该能看到列出的密钥。\n3. 右键点击你想要的密钥，选择\
  \ `Send Public Key by Email`（通过电子邮件发送公钥）。该选项也可以从 `File` 菜单可用。\n4. 打开一个邮件编辑窗口，其中已附加密钥文件（`.asc`）。正常发送此邮件即可。就这样。\n\
  \n![image](img/00091.jpeg)\n\n图 7.15 发送公钥\n\n对于 (B)，执行以下操作：\n\n1. 打开来自朋友的包含其公钥附件的传入邮件。\n\
  2. 打开（双击）密钥文件附件（`.asc`），Thunderbird 将自动安装该公钥。\n\n现在你真的准备好使用安全电子邮件了。\n\n### 7.12\
  \ 消息摘要\n\n消息摘要是消息文件的数字指纹。已经设计了各种算法来获取任何长度的消息（文件）并将其还原为短的固定长度的哈希值，称为原始消息或文件的摘要（图\
  \ 7.15）。\n\n![image](img/00092.jpeg)\n\n图 7.16 MD5 消息摘要\n\n这些算法的设计目的是为了确保如果消息的任何部分被更改，就会产生不同的摘要。根据摘要信息几乎无法推断出原始消息。然而，由于可能的消息是无限的，而不同摘要的数量是有限的，完全不同的消息可能会产生相同的摘要。\n\
  \n\n\n\n消息摘要对于验证文件的完整性（未被篡改性）非常有用。当在网上分发软件时，一种做法是显示文件的指纹，这允许你检查下载内容的完整性，并避免任何木马代码。\n\
  \nMD5 是一种流行的生成 128 位消息摘要的算法。MD5 哈希值通常显示为 32 位十六进制数字组成的序列。在 Linux 上，你可以使用 `md5sum`\
  \ 命令生成 MD5 摘要。\n\n```\nmd5sum filename > digestFile\n```\n\n你将得到一个 `digestFile`\
  \ 文件，其中仅包含哈希值和文件名 `filename`。在同时下载了 `filename` 和 `digestFile` 后，用户可以使用以下命令检查文件完整性：\n\
  \n```bash\nmd5sum -c digestFile\n```\n\n其他广泛使用的摘要算法还包括 `SHA-1` 等。Linux 命令 `sha1sum`\
  \ 是 `md5sum` 的替代方案。\n\n## 软件与消息签名\n\n对特定的消息（或文件）进行数字签名而不必加密整个消息，这通常是理想的。要做到这一点，首先需要使用合适的消息摘要哈希函数创建消息或文件的摘要。\n\
  \n![image](img/00093.jpeg)\n\n图 7.17 数字签名\n\n对特定的消息或软件进行数字签名时，首先创建一个摘要或哈希值。然后使用签名者的私钥对摘要进行加密，生成数字签名。任何签名消息/软件的接收者都可以从收到的消息生成消息摘要，并将其与使用签名者公钥解密签名得到的摘要进行比对。匹配则验证了所收消息的完整性和真实性（见图\
  \ [7.16]，源：Wikipedia）。\n\n以下是使用 `gpg` 进行数字签名的方法。\n\n```\ngpg --sign file (产生签名的二进制文件\
  \ .gpg)\ngpg --clearsign file (产生签名的 ASCII 文件 .asc)\n```\n\n`--decrypt` 会自动验证任何附带签名。\n\
  \n### 7.13 Web\n\n在所有的网络应用中，Web 可能是最重要的应用之一，值得我们特别关注。\n\nWeb 并没有中央控制或管理。任何人都有可能在\
  \ Web 上发布材料，并从中检索信息。Web 由一组位于世界各地计算机上的海量文档集合组成。这些文档由学术、专业、政府和商业机构以及个人创建。文档以特殊格式准备，并通过\
  \ Web 服务器传送，Web 服务器是响应传入请求并返回文档的程序。Linux 系统经常用于运行 Web 服务器。本章提供了 Web 的介绍。第 9 章讨论了\
  \ Web 服务。\n\nWeb 文档主要用超文本标记语言（`HTML`，章节 [7.16]）编写。每个 `HTML` 文档都可以包含（可能多个）指向由其他位置服务器服务的文档的链接，因此成为跨越全球的网络的一部分。新材料不断被放到\
  \ Web 上，立即访问这一信息集合可能具有巨大的优势。随着 Web 的增长，MIT（马萨诸塞理工学院，马萨诸塞州）和 INRIA（法国计算机科学与控制国家研究所）同意成为\
  \ W3 联盟的联合主机，这是一个 Web 社区的标准机构。\n\nWeb 浏览器是一个帮助用户从 Web 获取并显示信息的程序。给定目标文档的位置，浏览器会连接到正确的\
  \ Web 服务器并检索和显示所需的文档。你可以点击文档中的链接来获取其他文档。使用浏览器，你可以检索互联网上任何 Web 服务器提供的信息。\n\n通常，Firefox\
  \ 等 Web 浏览器支持显示标准格式的 `HTML` 文件和图像。辅助应用程序或插件可以增强浏览器，使其能够处理包含音频、视频、动画和数学公式等多媒体内容的页面。\n\
  \n### 超文本标记语言\n\nWeb 浏览器通过高效的协议（`HTTP`）与 Web 服务器通信，该协议旨在处理可能包含正文、图像、音频和视频的超文本和超媒体文档。原生网页用\
  \ `HTML`（章节 [7.16]）编写，通常保存为带有 `.html`（或 `.htm`）后缀的文件。\n\n`HTML` 组织了网页内容（文本、图形和其他媒体数据），并允许指向\
  \ Web 上任何位置其他页面的超链接。点击此类链接会导致你的 Web 浏览器遵循它并检索另一个页面。Web 采用开放寻址方案，允许链接到由 Web、电子邮件、文件传输、音频/视频和新闻组服务器提供的对象及。。因此，Web\
  \ 空间是许多流行互联网服务的超集。因此，Web 浏览器提供了访问互联网上各种信息和服务的能力。\n\n### URLs\n\nWeb 使用统一资源定位符（`URLs`）来识别（定位）互联网上可用的资源（文件和服务）。一个\
  \ `URL` 可能会标识主机、服务器端口以及存储在该主机上的目标文件。例如，浏览器使用 `URL` 来检索信息，`HTML` 使用 `URL` 链接到其他资源。\n\
  \n完整的 `URL` 通常具有以下形式：\n\n```\nscheme://server:port/pathname\n```\n\n`scheme` 部分指示信息服务类型，因此指示要使用的协议。常见的方案包括\
  \ `http`（Web 服务）、`ftp`（文件传输服务）、`mailto`（电子邮件服务）、`file`（本地文件系统）、`https`（安全 Web 服务）和\
  \ `sftp`（安全文件传输服务）。例如，\n\n```\nsftp://pwang@tiger.zodiac.cs.kent.edu/users/cs/faculty/pwang\n\
  ```\n\n将获取 `/users/cs/faculty/pwang` 的目录列表。这在 Firefox 和 Linux 文件浏览器 `nautilus` 上均有效，前提是你已经设置了\
  \ `SSH/SFTP`（章节 [7.6]）。许多其他方案可以在 `www.w3.org/addressing/schemes` 找到。\n\n对于通用的 `URLs`\
  \ 而言，服务器标识主机和服务器程序。可选的端口号只有在服务器不使用默认端口（例如 FTP 的 21 和 HTTP 的 80）时才需要。`URL` 的剩余部分（如果给出）是文件\
  \ `pathname`。如果此 `pathname` 以尾带有 `/` 字符，它代表一个目录而不是数据文件。数据文件的后缀（`.html`、`.txt`、`.jpg`\
  \ 等）指示文件类型。`pathname` 也可以指向一个可执行程序，该程序动态生成返回的 `HTML` 或其他有效文件。\n\n在 `HTML` 文档中，你可以通过提供\
  \ `URL` 的 `pathname` 部分来链接到同一服务器服务的另一个文档。此类 `URLs` 是部分指定的。带有 `/` 前缀的部分 `URL`（例如\
  \ `/file_xyz.html`）指向服务器根目录文件，即由 Web 服务器控制的顶层目录。没有前导 `/` 的部分 `URL` 指向相对于包含该 `URL`\
  \ 的文档位置的文件。因此，简单的 `file_abc.html` 指向当前文档所在目录下的该文件。在构建网站时，建议尽可能使用相对于当前页的 `URL`，以便于将整个网站文件夹移动到本地文件系统的另一个位置或不同的服务器主机上。\n\
  \n### 访问 Web 上的信息\n\n你可以通过在浏览器的位置框中提供任何 Web 文档、目录或服务的 `URL` 直接访问它。给定指定目录的 `URL`\
  \ 时，Web 服务器通常返回该目录的索引文件（通常为 `index.html`）。否则，它可能会返回该目录中的文件名列表。\n\n你可以使用如 Google\
  \ 等搜索引擎快速在 Web 上查找信息。\n\n\n\n\n\n# 7.14 处理不同内容类型\n\n在 Web 上，可以放置和检索不同媒体类型的文件。Web\
  \ 服务器和 Web 浏览器使用标准的内容类型标识来指示文件的媒体类型，以便正确地处理它们。\n\nWeb 借用了互联网电子邮件系统中的内容类型标识，并使用了相同的由\
  \ MIME（多用途互联网邮件扩展）定义的内容类型。如今有数百种内容类型在使用。许多流行类型与标准的文件扩展名相关联。第 6 节表 6.3 给出了一些示例。\n\
  \n当 Web 服务器向浏览器返回一个文档时，会指明其内容类型。内容类型信息允许浏览器决定如何处理传来的内容。通常，HTML、文本和图像由浏览器直接处理。其他类型（如音频和视频）通常由插件或外部辅助程序处理。\n\
  \n![image](img/00094.jpeg)\n\n图 7.18 Web 服务器功能\n\n# 7.15 在 Web 上发布信息\n\n现在，让我们关注信息是如何在\
  \ Web 上提供的。对这些的理解有助于我们更深入地了解 Web 的工作原理，以及提供信息需要什么。\n\nWeb 将出版的权力交给了任何连接到互联网的计算机用户。你只需要在这台机器上运行一个\
  \ Web 服务器，并为它建立提供服务的文件。\n\n主要的计算机供应商随其计算机系统提供商业级 Web 服务器。Apache 是一种广泛使用的开源 Web 服务器，可以从\
  \ Apache 软件基金会（www.apache.org）免费获取。\n\nLinux 系统作为 Web 托管计算机特别受欢迎，因为 Linux 是免费、健壮且安全的。此外，还有许多有用的\
  \ Web 相关应用程序，如 Apache、PHP（活动 Web 页面）、MySQL（数据库服务器）等，均免费提供。\n\n一旦 Web 服务器在你的机器上启动运行，就可以提供所有类型的文件（图\
  \ 7.17）。在典型的 Linux 系统上，按照以下简单步骤来创建你的个人 Web 页面。\n\n1. 在你的主目录中创建一个目录（`userid /public_html`），用于存放你的\
  \ Web 文件。这是你的个人 Web 目录。将此目录设置为公共可访问：`chmod a+x userid /public_html`。如果有疑问，请询问你的系统管理员关于个人\
  \ Web 目录应使用的确切名称。\n\n2. 在你的 Web 目录中，创建一个 HTML 格式的首页，通常为 `index.html`。首页通常充当带注释的目录。将此文件设置为公共可读：`chmod\
  \ a+r userid /public_html/index.html`\n\n3. 将包含所需信息的文件和目录放在你的个人 Web 目录中。像以前一样使每个目录和每个文件都变得可访问。在首页和其他页面中通过链接引用这些文件。\n\
  \n4. 让人们知道你首页的 URL，通常为 `http://your-sever your-userid`\n\n在 Web 页面中，你可以通过一个包含相对\
  \ URL 的简单链接（`< a href=\"filename\" >`）引用你的另一个文件，其中 `filename` 可以是简单的名称也可以是相对于当前文档的路径。\n\
  \n在所有 Web 文件格式中，超文本是至重要的，因为它为文档链接到其他文档提供了手段。\n\n# 7.16 什么是 HTML？\n\nHTML（超文本标记语言）用于标记\
  \ Web 页面的内容，提供页面结构，以便接收端的 Web 客户端轻松处理。从 HTML 4.0 以来，该语言已经标准化。XHTML（兼容 XML 的 HTML）是目前的稳定版本。然而，一个新的标准\
  \ HTML5 即将到来。\n\n用 HTML 编写的文档包含夹杂着标记标记的普通文本，并使用 `.html` 文件扩展名。标记将文本部分标记为标题、章节标题、段落、其他文档的引用等。因此，一个\
  \ HTML 文件由两种信息组成：内容和 HTML 标签。浏览器遵循 HTML 标签来布局页面内容进行显示。正因如此，内容中的换行和单词之间的额外空格大部分被忽略了。除了结构化和格式化内容外，HTML\
  \ 标签还可以引用图形、链接到其他文档、标记引用点、生成表单或问卷，并调用某些程序。目前有各种视觉编辑器或页面制作工具可用，它们提供了用于创建和设计 HTML\
  \ 文档的 GUI。对于大型网站创建项目，使用如 Macromedia Dreamweaver 这样的集成开发环境将会有帮助。如果你无法直接访问此类工具，普通的文本编辑器也可以创建或编辑\
  \ Web 页面。HTML 标签的形式为 `< tag >`。起始标签如 `< h1 >`（一级章节标题）与结束标签（在此例中为 `< / h1 >`）配对，标记中间的内容。表\
  \ 7.1 列出了一些常用的标签。\n\n一些 HTML 标签\n\n![image](img/00095.jpeg)\n\n以下是一个 HTML 页面示例（例:\
  \ ex07/Fruits）：\n\n```html\n>html<>head< >title<A Basic Web Page>/title< >/head<>body<>h1<Big\
  \ on Fruits>/h1<>p<水果味道很好，对你健康有益 ...>/p<>p< 有很多品种, ...而且这里有一份短列表: >/p<>ol<> Apples\
  \ >/li<> Bananas >/li<> Cherries >/li<>/ol<>/body<>html\n```\n\n图 7.18 显示了 Firefox\
  \ 显示的“Big on Fruits”页面。\n\n### 7.17 Web 托管\n\nWeb 托管是一种存储和提供文件及程序的服务，以便在 Web 上访问。因此，在\
  \ Web 上发布涉及：\n\n1. 设计并构建页面并编写程序\n2. 将完成的站点放入托管服务\n\n大学和学院免费为学生和教师托管个人站点。Web 托管公司收费提供服务。\n\
  \n![image](img/00096.jpeg)\n\n图 7.19 示例 Web 页面\n\n商业 Web 托管可以提供安全的数据中心（建筑）、快速可靠的互联网连接、经过调优的\
  \ Web 托管计算机（大多为 Linux）、服务器程序和工具、网络和系统安全、每日备份以及技术支持。每个托管账户提供磁盘空间、每月网络流量额、电子邮件帐户、基于\
  \ Web 的站点管理和维护工具，以及其他如 FTP 和 SSH 的。\n\n要在指定的域名托管站点，托管服务会将该域名关联到分配给托管站点的 IP。域名到 IP\
  \ 的关联通过托管服务管理的 DNS 服务器和 Web 服务器配置实现\n\n### 7.18 域名注册\n\n要获取域名，你需要域名注册商的服务。大多数注册商愿意以很廉的年度费用注册你的新域名。一旦注册，域名就是属于注册者的财产。只要当前注册者保持注册良好，其他人无法注册该特定域名。\n\
  \nICANN 认证了常用 TLD 的商业注册商，包括 `.com`、`.net`、`.org` 和 `.info`。附加 TLD 包括 `.biz`、`.pro`、`.aero`、`.name`\
  \ 和 `.museum`。限制域名（例如 `.edu`、`.gov` 和 `.us`）由特殊注册机构处理（例如 `net.educause.edu`、`nic.gov`\
  \ 和 `nic.us`）。国家代码 TLD 通常由各自国家的注册机构处理。\n\n## 访问域名注册数据\n\n域名的注册记录通常是公开的。标准的 Internet\
  \ whois 服务允许轻松访问这些信息。在 Linux 系统上，通过 `whois` 命令可以轻松访问 whois：\n\n```\nwhois domain_name\n\
  ```\n\n\n\n\n\n`whois` 列出在注册局处保留的域名注册记录。例如，\n\n`whois kent.edu`\n\n产生以下信息\n\n```\n\
  Domain Name: KENT.EDURegistrant:Kent State University500 E. Main St. Kent, OH 44242\
  \ UNITED STATESAdministrative Contact:Philip L ThomasNetwork & TelecommKent State\
  \ UniversitySTH Kent, OH 44242 UNITED STATES(330) 672-0387 pki-admin@kent.eduTechnical\
  \ Contact:Network Operations CenterKent State University120 Library Bldg Kent, OH\
  \ 44242 UNITED STATES(330) 672-3282 noc@kent.eduName Servers:NS.NET.KENT.EDU 131.123.1.1DHCP.NET.KENT.EDU\
  \ 131.123.252.2Domain record activated: 19-Feb-1987Domain record last updated: 17-Feb-2016Domain\
  \ expires: 31-Jul-2018\n```\n\n在 Linux 系统上，`whois` 命令通常是指向 `jwhois` 的链接。\n\n###\
  \ 7.19 DNS\n\nDNS 提供了互联网上不断变化的域名到 IP 的映射信息。我们提到过，DNS 提供了一种分布式数据库服务，支持对命名空间中包含的信息进行动态检索。浏览器和其他互联网客户端应用程序在通过互联网与服务器建立联系之前，通常会使用\
  \ DNS 获取目标主机的 IP。\n\nDNS 包含三个元素：DNS 命名空间（第 7.2 节）、DNS 服务器和 DNS 解析器。\n\n#### DNS\
  \ 服务器\n\n分布式 DNS 中的信息被划分为多个区域（zones），每个区域由运行在不同主机上的一个或多个名称服务器支持。一个区域与域名树上的一个节点关联，并涵盖该节点处的全部或部分子树。拥有某个特定区域完整信息的名称服务器被称为该区域的权威服务器（authority）。权威信息会自动分发到为同一区域提供冗余服务的其他名称服务器。服务器依赖低级服务器获取其子域内的其他信息，并依赖外部服务器获取域名树中其他区域的信息。与域名树根关联的服务器是根服务器，它可以引导至\
  \ DNS 中任何地方的信息。权威服务器使用本地文件存储信息，用于在域内外定位关键服务器，并缓存来自其他服务器的查询结果。启动文件（通常为 `/etc/named.boot`）配置名称服务器及其数据文件。\n\
  \n每个区域的管理也可以自由指定运行名称服务器的主机，并更改其权威数据库。例如，主机 `ns.cs.kent.edu` 可能运行为 `cs.kent.edu`\
  \ 域名的名称服务器。\n\n名称服务器回答来自解析器的查询，并提供确定性答案或指向其他名称服务器的引用。DNS 数据库用于处理网络地址、邮件交换、主机配置和其他类型的查询，其中某些将在未来实现。\n\
  \nICANN 和其他机构维护与 DNS 树根节点关联的根服务器。事实上，VeriSign 主机 `a.root-servers.net` 运行根服务器。实际上，字母\
  \ `a` 范围延伸到 `m`，目前共有 13 台根服务器。\n\n域名注册商、公司、组织、Web 托管公司和其他互联网服务提供商（ISP）运行名称服务器，将其特定区域内的\
  \ IP 与域名关联。互联网上的所有名称服务器都协作即时执行域名到 IP 的映射。\n\n#### DNS 解析器\n\nDNS 解析器是一个向名称服务器发送查询并从中获取回复的程序。在\
  \ Linux 系统上，解析器通常以 C 库函数的形式存在。解析器可以访问至少一个名称服务器，并使用该名称服务器的信息直接回答查询，或通过对其他名称服务器的引用继续查询。\n\
  \n解析器以网络库例程的形式存在，用于将域名转换为实际的 IP 地址。这些库例程反过来请求指定的名称服务器解析域名。任何特定主机使用的名称服务器通常指定在文件\
  \ `/etc/resolv.conf` 或 `/usr/etc/resolv.conf` 中。\n\n#### 常见 DNS 记录/请求类型\n\n![image](img/00097.jpeg)\n\
  \nDNS 服务不仅为互联网上的主机提供 IP 地址和域名信息。它还可以提供其他有用信息。表 7.2 显示了常见的 DNS 记录和请求类型。\n\n### 7.20\
  \ Web 页面的动态生成\n\nWeb 上的可用文档通常是提前准备并设置，以提供某些固定内容，可以是 HTML 或其他格式（如纯文本、PDF 或 JPEG）。这些固定文档是静态的。Web\
  \ 服务器还可以即时生成文档，从而带来这些和其他优势：\n\n*   根据检索文档的时间、地点、人员以及使用的程序对文档进行自定义\n*   收集用户输入（通过\
  \ HTML 表单）并对传入的信息提供响应\n*   对输出文档强制某些策略\n*   提供如游戏比分和股票报价等本质上是不断变化的内容\n\n动态 Web 页面并非魔法。Web\
  \ 服务器不是检索固定文件，而是调用另一个程序来计算要返回的文档。正如你可能猜到的，并不是每个程序都能这样被 Web 服务器使用。添加服务器编程有两种方法：\n\
  \n*   将程序直接加载到 Web 服务器中，以便需要时使用。\n*   从服务器调用外部程序，向其传递参数（通过程序的 `stdin` 和环境变量）并接收由此生成的结果（通过程序的\
  \ `stdout`）。此类程序必须符合规定 Web 服务器与外部程序交互的通用网关接口（CGI）规范（图 7.19）。\n\n![image](img/00098.jpeg)\n\
  \n图 7.20 通用网关接口\n\n#### 动态服务器页面\n\n通过允许 Web 页面包含活动部分（这些部分由 Web 服务器处理并在页面检索和返回给客户端时即时转换为所需内容），页面的动态生成变得更加简单，并与\
  \ Web 页的设计和构建更加集成。\n\n页面中的活动部分用某种记法编写，以将其区别于页面的静态部分。`ASP`（活动服务器页面）、`JSP`（Java 服务器页面）以及流行的\
  \ `PHP`（超文本预处理器；第 9 章第 9.17 节）都是示例。\n\n由于活动页面由加载到 Web 服务器的模块处理，与 CGI 程序相比，处理速度更快更高效。`PHP`\
  \ 等活动页面技术还提供了表单处理、HTTP 会话以及对数据库的轻松访问。因此，它们为动态 Web 页面提供了完整的服务器端支持。\n\nCGI 和服务器页面都可以用于支持\
  \ HTML 表单，即你在 Web 上常见的填写表单。\n\n### 7.21 简述 HTTP\n\n在 Web 上，浏览器与之间的通信遵循 HTTP。对 HTTP\
  \ 的基本了解对于 Linux 程序员来说非常重要，因为 Linux 系统是非常流行的 Web 服务器主机。\n\nHTTP 的起源可以追溯到 20 世纪 90\
  \ 年代初 Web 的诞生。HTTP/1.0 在 1996 年标准化。改进和新功能不断推出，HTTP/1.1 现在是稳定版本。\n\n以下是一个 HTTP 事务的概述：\n\
  \n1.  连接——浏览器（客户端）与服务器建立连接。\n2.  查询——客户端请求由服务器控制的资源。\n3.  处理——服务器接收并处理请求。\n4.  响应——服务器将请求的资源返回给客户端。\n\
  \n\n\n\n\n## 5. 终止\n\n事务已完成，除非客户端和服务器之间立即发生另一个事务，否则连接将关闭。\n\nHTTP 了查询和响应消息的格式（见图\
  \ 7.20）。\n\n头部部分是文本格式，头部中的每行应以 `RETURN` 和 `NEWLINE` 结束，但也可以仅以 `NEWLINE` 结束。\n\n\
  起始行标识消息是查询还是响应。\n\n*   查询行包含三个由空格分隔的部分：查询方法名、请求资源的本地路径，以及一个 HTTP 版本号。例如，`GET /path/to/file/index.html\
  \ HTTP/1.1` 或 `POST /path/script.cgi HTTP/1.1`。`GET` 方法请求指定的资源且不允许包含消息体。`GET` 方法可以通过指定\
  \ CGI 或活动页面路径、问号以及查询字符串来调用服务器端程序：`GET /cgi-bin/newaddr.cgi?name=value1&email=value2\
  \ HTTP/1.1 Host: tiger.zodiac.cs.kent.edu`。与 `GET` 不同，`POST` 方法允许消息体，并设计用于与 HTML\
  \ 表单配合以收集 Web 用户的输入。\n\n*   响应（或状态）行也包含三个由空格分隔的部分：HTTP 版本号、状态码和对状态的文本描述。典型的状态行包括成功查询的\
  \ `HTTP/1.1 200 OK`，或者当请求的资源无法找到时的 `HTTP/1.1 404 Not Found`。\n\n*   HTTP 响应发送请求的文件以及其内容类型（见第\
  \ 7.14 节）和长度（可选），以便客户端知道如何处理它。\n\n### 7.22 真实的 HTTP 体验\n\n让我们手动发送一个 HTTP 请求并获取一个\
  \ HTTP 响应。为此，我们将使用 `nc` 命令。`ncat` 命令提供了命令行（以及脚本）访问基本 TCP 和 UDP（（第 12 章节，第 12.6 节），因此允许你建立任何\
  \ TCP 连接或发送任何 UDP 数据包。此类能力通常仅留给 C 语言层级设置 socket 的程序（第 12 章节，第 12.6 节）。\n\n例如，简单的\
  \ Bash 管道线（例：ex07/poorbr.sh）：\n\n```bash\necho $’GET /WEB/test.html HTTP/1.0 n’\
  \ |\nncat tiger.zodiac.cs.kent.edu 80\n```\n\n检索 Web 页面 `tiger.zodiac.cs.kent.edu/WEB/test.html`。在这个示例中，我们应用了\
  \ Bash 字符串扩展（第 3 章节，第 3.7 节）。\n\n注意，HTTP get 请求请求的是 tiger 上的 Web 服务器所管理的文档根文件夹下的\
  \ `/WEB/test.html` 文件。根据 HTTP 协议的要求，请求由一个空行结束。\n\n尝试一下，你将看到结果的显示。\n\n```\nHTTP/1.1\
  \ 200 OKDate: Tue, 20 Mar 2018 19:45:03 GMTServer: Apache/2.4.27 (Fedora)X-Powered-By:\
  \ PHP/7.0.23Cache-Control: max-age=86400Expires: Wed, 21 Mar 2018 19:45:03 GMTVary:\
  \ Accept-EncodingContent-Length: 360Connection: closeContent-Type: text/html; charset=UTF-8>!DOCTYPE\
  \ HTML<>html xmlns=\"http://www.w3.org/1999/xhtml\" lang=\"en\" xml:lang=\"en\"\
  <AND THE REST OF THE HTML PAGE>/html<\n```\n\n如你从 HTTP 响应所示，tiger 上的 Web 服务器是运行在\
  \ Fedora（一种 Linux 系统）上的 Apache 2 版本。\n\n从 Web 下载内容不需要依赖我们的小管道。`wget` 命令很好地处理了这一需求。`wget`\
  \ 支持 HTTP、HTTPS 和 FTP 协议，可以下载单个文件，也可以跟踪 HTML 文件中的链接并递归下载整个网站以便离线查看。`wget` 命令可以在你登录后继续工作，因此你可以下载大量数据而无需等待。\n\
  \n### 7.23 更多信息\n\n*   IPv6 是下一代互联网协议。访问 www.ipv6.org/ 了解概述。\n\n*   Gnu Privacy\
  \ Guard 的官方网站是 www.gnupg.org，OpenSSH 的网站是 www.openssh.com。\n\n*   公钥加密标准 (PKCS)\
  \ 可以在 RSA 实验室 (www.rsa.com/rsalabs) 找到。\n\n*   HTML5 是即将推出的 HTML 新标准。请在 W3C 查看规范。\n\
  \n*   DNS 是保持互联网和 Web 服务运行的基础。在 www.dns.net/dnsrd/docs/ 查找更多关于 DNS 的信息。\n\n*   HTTP\
  \ 是 Web 的基础。查看 RFC 1945 获取 HTTP 1.0，查看 RFC 2068 获取 HTTP 1.1。\n\n### 7.24 总结\n\n\
  在现代计算环境中，计算机和网络是不可分的。网络是任何操作系统的重要方面，特别是 Linux，因为互联网源于 UNIX/Linux，且 Linux 系统是出色的服务器主机。\n\
  \n在互联网上，每台主机计算机都通过其 IP 地址和域名进行标识。TCP/IP 和 UDP/IP 协议是互联网的基础。基于网络的服务通常遵循客户端服务器模型，客户端程序（如\
  \ Web 浏览器）使用协议与服务器程序（如 Web 服务器）通信。\n\n### 7.25 练习\n\n1.  什么是计算机网络？列出计算机网络的主要组件。\n\
