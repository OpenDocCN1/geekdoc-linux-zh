  \ 使用 PHP 内置的 `SQLite` 建立一些数据库表。在网页中用 PHP 代码测试你的设置。\n\n12. 在你的主目录下安装自己的 `MySQL`。你将成为\
  \ root 数据库用户。使用 `mysql` 工具创建一个新的测试数据库和一些表。\n\n13. 安装 `phpMyAdmin` 工具。使用它来管理你的 `MySQL`\
  \ 数据库。\n\n14. 使用你的 `phpMyAdmin` 工具在 `MySQL` 中为 Web 设置一些数据库表。在网页中用 PHP 代码测试你的设置。\n\
  \n15. 了解 PHP 的 `PEAR` 库。如果尚未安装，请安装它。\n\n1 伊利诺伊大学厄巴纳-香槟堡分校，国家超级计算应用中心。\n\n2 不要与同样称为\
  \ root 的 Linux 超用户混淆。\n\n# 第 10 章\n\n# Linux 下 C 语言编程\n\n在对命令、Shell 使用、编程、文件系统结构、网络和\
  \ Web 托管有了基础理解后，你现在已经准备好探索 Linux 系统编程了，这正是第 9 章和第 11 章的主题。\n\n早在第 1 章（第 1.13 节），我们简要提到了创建、编译和运行用\
  \ C 语言编写的程序。Linux 支持 C、C++¹、Java、Fortran 等语言，但 C 对于 Linux 来说仍然是特殊的。\n\nLinux 系统及其许多命令是用\
  \ C 语言编写的。C 是一种紧凑且高效的通用编程语言，随着 UNIX 和 Linux 一起演进。因此，C 被视为 Linux 的原生语言。Linux 的可移植性很大程度上归于\
  \ C 的可移植性。\n\n由于其重要性，C 已由美国国家标准协会（ANSI）以及后的国际标准组织（ISO）标准化。最新标准被称为 ISO C99。C99 标准规定了语言结构以及用于常用操作（如\
  \ I/O 输入输出和字符串处理）的标准 C 库 API（应用程序接口）。书中的代码示例与 ISO C99 兼容。\n\n在大多数 Linux 发行版中，你会找到：\n\
  \n- `gcc`（或 `g++`）——来自 GNU 的编译器，用于编译 C（或 C++）程序。这些包含了对 ISO C99 和 ISO C++ 代码的支持。\n\
  - `glibc`——来自 GNU 的符合 POSIX ² 标准的 C 库。库将通用代码保留在一个地方供许多程序共享。`glibc` 库包包含了最重要的共享库集：符合标准的\
  \ C 库、数学库，以及本地语言（locale）支持。\n\n在 Linux 上，编写一个 C 程序、用 `gcc` 编译它并运行生成的可执行文件是非常容易的。对于创建和编辑短程序（如书中的示例），像\
  \ `gedit` 和 `nano` 这样简单的文本编辑器就足够了。像 `vim` 和 `emacs` 这样功能强大的编辑器具有 C 编辑模式，更易于编码。Linux\
  \ 上 C/C++ 的集成开发环境（IDE），如 `kdevelop`、`Anjuta` 和 `Borland C++` 也用于管理更大的编程项目。\n\n在本章和接下来的两章中，我们将学习\
  \ C 语言级别的编程设施，并编写 C 代码来执行重要的操作系统任务，包括 I/O、文件访问、管道、进程控制、进程间通信和网络。所介绍的内容将使你能够用 C 实现新命令，并通过其\
  \ C 接口控制并利用 Linux 内核。\n\n本章探索了与在 Linux 下编写 C 代码相关的系列基础主题：\n\n- 命令行参数规范\n- C 编译器的行为\n\
  - 标准 C 库\n- 程序库的使用与维护\n- 错误处理与恢复\n- 使用 `gdb` 调试器\n\n### 10.1 命令行参数\n\nLinux 中的命令通常被写成\
  \ Shell 脚本或 C 程序。在 Shell 层级传递给命令的参数将作为字符字符串传递给 C 程序的 `main` 函数。一个期望参数的 `main` 函数通常声明如下：\n\
  \n```c\nint main(int argc, char *argv[])\n```\n\n参数 `argc` 是一个整数。符号 `char *argv[]`\
  \ 声明形式数组参数 `argv` 的元素类型为 `char *`（字符指针）。换句话说，数组元素 `argv[0]`、`argv[1]`、...`argv[argc-1]`\
  \ 中的每一个都指向一个字符字符串。形式参数 `argc` 和 `argv` 的含义如下：\n\n- `argc`——命令行参数的数量，包括命令名\n- `argv[n]`——指向第\
  \ n 个命令行参数的字符字符串指针\n\n如果命令名是 `cmd`，且如下被调用：\n\n```\ncmd arg1 arg2\n```\n\n那么：\n\n\
  | argc | 为 3 |\n| :--- | :--- |\n| `argv[0]` | 指向命令名 `cmd` |\n| `argv[1]` | 指向字符串\
  \ `arg1` |\n| `argv[2]` | 指向字符串 `arg2` |\n| `argv[3]` | 为 0 (NULL) |\n\n如果不需要，可以省略函数\
  \ `main` 的参数（`int main()`）。\n\n现在让我们来写一个接收命令行参数的程序（例如 `ex10/echo.c`）。为了保持简单，程序所做的只是将命令行参数回显到标准输出。\n\
  \n```c\n/****** echo 命令 ******/\n#include <stdlib.h>\n#include <stdio.h>\nint main(int\
  \ argc, char *argv[]){ \n    int i = 1; \n    /* 从 1 开始 */\n    while (i < argc){\
  \ \n        printf(\"%s\", argv[i++]); /* 输出字符串 */\n        printf(\" \"); /* 输出空格\
  \ */\n    }\n    printf(\"\\n\"); /* 结束输出行 */\n    return EXIT_SUCCESS; /* 返回退出状态\
  \ */\n}\n```\n\n#### 关于退出状态的说明\n\n程序显示 `argv` 的每一个项，但 `argv[0]` 除外，它实际上是命令名本身。使用了\
  \ `printf` 的字符串格式 `%s`。为了分离字符串，程序在每个 `argv[i]` 之后显示一个空格，最后一个参数后面跟着一个换行符。\n\n####\
  \ 退出状态\n\n注意 `main` 被声明返回 `int`，且上示例中的最后语句返回了 `<stdlib.h>` 中的常量：\n\n```c\nreturn\
  \ EXIT_SUCCESS;\n```\n\n当程序终止时，一个称为退出状态的整数值会返回程序的调用环境（例如 Shell）。退出状态向程序的调用者指示程序是否成功执行并正常终止。退出状态\
  \ `EXIT_SUCCESS`（Linux 上为 0）是正常的，而 `EXIT_FAILURE`（Linux 上为 1）或任何其他小的正整数表示异常终止。在\
  \ Linux Shell 层级，例如，可以根据命令的退出状态（`$?` 的值）采取不同的行动。对于 C 程序，`main` 的返回值或调用 `exit` 时的参数指定了退出状态。因此，即使程序本身不需要该数值，`main`\
  \ 也应该始终返回一个整数退出状态。（有关退出状态的更多讨论，请参阅第 11 章，第 11.14 节。）\n\n\n\n\n\n## 编译与执行\n\n编译 C\
  \ 程序，请使用 `gcc`。例如：\n\n```\ngcc echo.c -o myecho\n```\n\n在这里，生成的可执行文件命名为 `myecho`，可以通过以下命令运行：\n\
  \n```\nmyecho To be or not to be\n```\n\n输出显示：\n\nTo be or not to be\n\n在这种情况下，`argv[0]`\
  \ 是 `myecho`。\n\n`gcc` 命令运行的是 GNU C 编译器 (`GCC`)。有关 `GCC` 的更多信息，请参阅章节 10.3。\n\n###\
  \ 10.2 Linux 命令参数约定\n\n通常情况下，Linux 命令使用以下约定来指定参数：\n\n`command [ options ] [ files\
  \ ]`\n\n选项以单连字符或双连字符（`-`）作为前缀。\n\n- `-char`\n- `--word`\n\n其中 `char` 是单个字母，`word`\
  \ 是一个完整的单词。例如，`ls` 命令具有单字母选项 `-F` 和完整单词选项 `--classify`。一个命令可以接受零或多个选项。当给出多个选项时，单字母选项可以通过在它们前面加一个单连字符\
  \ `-` 来组合。例如：\n\n```\nls -l -g -F\n```\n\n可以改写为：\n\n```\nls -lgF\n```\n\n某些命令（如\
  \ `ps` 和 `tar`）使用选项但不需要前导连字符。其他选项可能需要额外的字符或单词来完成规范。`sed` 命令的 `-f`（脚本文件）选项就是一个例子。\n\
  \n文件参数可以用三种有效的文件名形式之一给出：简单名称、相对路径和全路径。程序不应期望特定的受限的文件名，也不应对用户将提供何种形式做任何假设。\n\n###\
  \ 10.3 GCC 编译器\n\n使用 C 语言进行编程时，明确 C 编译器的作用以及如何使用它至关重要。编译器不仅将程序翻译成可在特定计算机上运行的机器码，还通过提供\
  \ I/O、文件访问以及与其他操作系统的接口来为程序安排合适的运行时支持。因此，编译器不仅特定于计算机硬件，也特定于操作系统。\n\n在 Linux 上，C 编译器很可能是\
  \ `GCC`，它是 GNU 编译器集的一部分。³。C 编译器将整个编译过程分为五个阶段（图 10.1\n\n1. **预处理**——第一阶段由 `cpp`（C\
  \ 预处理器）程序（或 `gcc -E`）执行。它处理常量定义、宏展开、文件包含、条件和其他预处理器指令。\n2. **编译**——以上一个阶段的输出作为输入，编译阶段执行语法检查、解析和汇编代码（`.s`\
  \ 文件）的生成。\n3. **优化**——此可选阶段针对计算机硬件架构对代码进行专门优化，并提高生成代码的速度和紧凑性。\n4. **汇编**——汇编程序获取\
  \ `.s` 文件并创建对象文件（`.o`），该文件包含二进制代码和重定位信息，供链接器/加载器使用。\n5. **链接**——`collect2/ld` 程序是链接器/加载器，它合并所有对象文件并链接必要的库子程序以及运行时支持程序，以生成可执行程序（`a.out`）。\n\
  \n`gcc` 命令可以自动执行所有阶段，也可以仅执行指定的阶段。\n\n![image](img/00124.jpeg)\n\n图 10.1 Linux C\
  \ 编译阶段\n\n### gcc 命令\n\n由于 C 语言与 Linux 之间紧密的关系，`gcc` 命令是任何 Linux 系统的关键部分。`gcc` 支持传统的\
  \ C 标准以及标准的 ISO C99。\n\n通常情况下，`gcc` 命令接受 C 源文件（`.c` 和 `.h`）、汇编源文件（`.s`）和对象文件（`.o`），并生成一个默认名为\
  \ `a.out` 的可执行文件。编译过程通常还会为每个给源文件生成对应的对象文件（但不生成汇编文件）。\n\n编译完成后，就可以执行 C 程序。命令名称即为该可执行文件的名称（如果它在命令搜索路径\
  \ `PATH` 中）。对于所有实际用途而言，可执行文件都是一个 Linux 命令。\n\n### gcc 选项\n\n你可以通过命令行选项来控制 `gcc`\
  \ 的行为。这里描述了可用选项的一个选子集。\n\n请注意，某些选项（如 `-D` 和 `-I`）在选项与其后的值之间没有空格。\n\n### C 预处理器\n\
  \nC 预处理器（`cpp` 命令）执行编译过程的第一阶段。预处理器提供了重要的功能，对于编写系统程序尤为重要。C 预处理器指令以第一列的字符 `#` 开始。指令\n\
  \n`#include`\n\n用于在实际编译之前将其他文件包含到源文件中。被包含的文件通常包含常量、宏和数据结构定义，这些定义通常用在多个源文件中。指令\n\n\
  `#include \"filename\"`\n\n指示 `cpp` 包含 `filename` 的全部内容（注意 `\"` 标记是命令的一部分）。如果未以全路径给出\
  \ `filename`，则首先在包含 `#include` 语句的源文件所在的目录中查找；如果在那里没有找到，则会搜索一些标准系统目录。如果你在非标准位置有头文件，请使用\
  \ `-I` 选项添加额外的头文件搜索目录。指令\n\n`#include < filename >`\n\n具有相同的效果，但给定的 `filename` 在标准系统目录中查找。其中一个目录是\
  \ `/usr/include`。例如，I/O 的标准头文件通常在每个源文件的开头包含：\n\n`#include < stdio.h >`\n\n正如你将看到的，编写系统程序的重要部分是按正确顺序包含\
  \ Linux 提供的正确头文件。\n\n`cpp` 指令 `#define` 用于定义常量和宏。例如，在定义之后：\n\n```\n#define TRUE\
  \ 1\n#define FALSE 0\n#define TABLE_SIZE 1024\n```\n\n这些名称可以在随后的源代码中使用，以代替实际数字。通用形式为：\n\
  \n`#define identifier token ...`\n\n预处理器会将源代码中的 `identifier` 替换为给定的标记。如果没有给出任何标记，则\
  \ `identifier` 被定义为 1。带参数的宏也可以使用以下形式定义：\n\n`#define identifier ( arg1 , arg2 , …\
  \ ) token ...`\n\n例如：\n\n```c\n#define MIN(x,y) ((x) > (y) ? (y) : (x))\n```\n\n\
  定义了宏 `MIN`，它接受两个参数。宏调用\n\n`MIN(a + b, c - d)`\n\n会被预处理器展开为\n\n```c\n((a+b) > (c-d)\
  \ ? (c-d) : (a+b))\n```\n\n宏的右侧可能涉及符号常量或其他宏。可以通过 `#undef identifier` 移除已定义的标识符并使其取消。\n\
  \n预处理器还处理条件包含，根据预处理器可以检查的某些条件，源代码的部分可以包含或排除在编译过程中。条件包含通过以下通用形式指定：\n\n`#if-condition`\n\
  \n源代码行 A\n\n[#else\n\n源代码行 B ]\n\n`#endif`\n\n如果满足条件，则包含源代码行 A；否则，包含源代码行 B（如果给出）。可能的条件列在\
  \ 表 10.1 中。\n\n条件包含\n\n![image](img/00125.jpeg)\n\n条件包含可以用于包含调试代码，如下所示：\n\n```c\n\
  #ifdef DEBUG\nprintf( ... )\n#endif\n```\n\n如要激活此类条件调试语句，你可以在源文件开头添加行\n\n`#define\
  \ DEBUG`\n\n或者使用以下命令编译源文件：\n\n```bash\ngcc -DDEBUG file\n```\n\n\n\n\n在较大的 C 程序中，通常会有许多源文件和头文件。头文件通常包含\
  \ `#include` 语句来包含其他头文件。这种情况经常导致某些头文件在预处理阶段被读取多次的几率增加。这不仅浪费了资源，还可能引入预处理错误。为了避免可能的重复包含，可以将头文件写成一个大大的条件包含结构。\n\
  \n符号 `__xyz_SEEN__` 在该文件 `xyz.h` 被 `cpp` 读取后会被定义一次（例如：`ex10/gcd.h`）。这一事实通过 `#ifndef`\
  \ 机制防止了该文件再次被读取。该宏使用下划线前缀和后缀，以尽可能地减少与其他宏或常量名称冲突的概率。\n\n#### 编译\n\n编译阶段获取预处理阶段的输出并执行解析和代码生成。如果给出了\
  \ `-O` 选项，则代码生成将调用代码优化例程来提高生成代码的效率。编译阶段的输出是汇编代码。\n\n#### 汇编\n\n汇编代码由汇编器处理，以产生可定位的对象代码（`.o`）。\n\
  \n#### 链接与加载\n\n链接/加载通过将用户提供的对象文件与库中系统提供的对象模块（章节 10.5）以及所需的初始化代码相结合，生成一个可执行程序（`a.out`\
  \ 文件）。GCC 使用 `collect2` 从对象代码文件中收集所有的初始化代码，然后调用加载器 `ld` 执行实际的链接/加载。`collect2/ld`\
  \ 程序按照给顺序处理其命令行参数。如果参数是一个对象文件，则该对象文件将被重定位并添加到正在构建的可执行二进制文件的末尾。对象文件的符号表将与二进制文件的符号表合并。如果参数是库名，则扫描库的符号表以寻找与二进制文件符号表中的未定义名称匹配的符号。找到的任何符号都会导致库中的对象模块被加载。此类库对象模块以相同的方式加载和链接。因此，在引用库中定义符号的对象文件名称之后给出库参数是非常重要的。\n\
  \n为了形成可执行文件，必须加载运行时支持代码（例如 `/usr/lib/` 或 `/usr/lib64/` 中的 `crt1.o`、`crti.o`、`crtbegin.o`、`crtend.o`）和\
  \ C 库代码（例如 `libgcc.a`）。`gcc` 生成正确的 `collect2/ld` 调用。\n\n在处理完所有对象和库参数后，会对二进制文件的符号表进行排序，寻找任何剩余的未解析引用。只有在没有剩余的未解析引用时，才会产生最终的可执行模块。\n\
  \n`collect2/ld` 接受许多选项。这里列出了其中重要的几个：\n\n| -lname | 加载库文件 `libname.a`，其中 `name` 是字符字符串。加载器在标准系统目录（通常为\
  \ `/lib`、`/usr/lib` 和 `/usr/local/lib`）以及由 `-L` 选项指定的附加目录查找库文件。`-l` 选项可以出现在命令行的任何位置，但通常出现在\
  \ `gcc` 或 `collect2/ld` 命令的末尾。 |\n\n| -L dir | 将目录 `dir` 添加到查找库文件的目录列表之前。 |\n\n\
  | -s | 从可执行文件中移除符号表和重定位位以节省空间。这用于已经调试过的代码。 |\n\n| -o name | 使用指定的名称作为可执行文件。 |\n\n\
  ### 10.4 C 库](#part0003.html_C3tocsec10_3010)\n\nC 库提供了许多用于 I/O 和字符串处理的函数，如 10.2\
  \ 所示。标准头文件包含 `stdin`、`stdout` 和 `stderr` 的定义。`stdout` 的输出是缓冲的（直到遇到 `\\n`），但 `stderr`\
  \ 直接发送到终端窗口。标准流可以重定向到文件或管道。例如，\n\n`putc(c, stderr)` 向标准错误写入一个字符。`getchar` 和 `putchar`\
  \ 宏可以 10.3 所示定义为：\n\n```\n#define getchar() getc(stdin)\n#define putchar(c) putc(c,\
  \ stdout)\n```\n\n这里是另一个显示当前本地时间的示例（例如：`ex10/timow.c`）。\n\n```c\n#include <stdlib.h>\n\
  #include <stdio.h>\n#include <time.h>\nint main(){\n    time_t now=time(NULL); //\
  \ 获取当前时间\n    printf(ctime(&now)); // 显示其字符串格式\n    printf(\"\\n\");\n    return\
  \ EXIT_SUCCESS;\n}\n```\n\n#### fopen 函数\n\nI 库例程 `fopen` 用于后续的 I/O 打开文件：\n\n`FILE\
  \ *fopen(char *filename, char *access_mode)`\n\n该函数原型描述了 `fopen` 的参数和返回值。我们将使用原型表示引入\
  \ C 库和 Linux 系统调用。\n\n为了打开作为第二个命令行参数的文件，例如，你将使用：\n\n`FILE *fp = fopen(argv[2], \"\
  r\");`\n\n允许的访问模式列在 表 10.3 中。除非在初始模式字母（`r`、`w` 或 `a`）之后给出模式字母 `b`，否则假设文件是文本文件。二进制文件的\
  \ I/O 对于某些应用程序可能非常高效，正如我们在下一节中看到的。\n\nfopen 模式\n\n由于 C 流提供了自己的缓冲，有时需要强制将 I/O 缓冲区中留的任何输出数据立即发送。为此，使用了函数\n\
  \n`int fflush (FILE * stream)`\n\n该函数不用于控制输入缓冲。\n\n\n\n\n当使用 `r+`、`w+` 和 `a+` 模式之一以读写方式打开同一个文件时，文件将在原地进行更新；即你正在修改文件的内容。在更新模式下同时执行读取和写入操作，在从读取切换到写入或反之时必须小心。在任何方向的切换之前，通常需要对流执行\
  \ `fflush` 或文件定位函数（例如 `fseek`），以为下一次读/写操作设置位置。当我们解释更新模式如何工作时，这些这些说明将会变得清晰。\n\n`r+`\
  \ 模式在对文件进行一对一的字符替换时效率最高。在 `r+` 模式下，如果不进行显式修改，文件内容将保持不变。修改是通过移动文件位置指示（类似于文本编辑器中的光标）到文件中的所需位置，并用修改后的字符覆盖已有的现有字符来实现的。可以通过以下步骤实现一个基于文件更新的小写转换命令（示例：`ex10/lower.c`）：\n\
  \n1. 使用 `fopen` 的 `r+` 模式打开给定文件。\n2. 读取字符，直到遇到大写字母。\n3. 用小写字母覆盖大写字母。\n4. 重复步骤 2\
  \ 和 3，直到到达文件尾。\n\n```\n/******** lower.c ********/\n#include <stdlib.h>\n#include\
  \ <stdio.h>\n#include <ctype.h>\n#define SEEK_SET 0\nint main(int argc, char *argv[]){\n\
  \    FILE *update;\n    int fpos; /* 文件中的读取或写位置 */\n    char c;\n    if ((update\
  \ = fopen(argv[1], \"r+\")) == NULL){\n        fprintf(stderr, \"%s: cannot open\
  \ %s for updating\\n\",argv[0], argv[1]);\n        exit(EXIT_FAILURE);\n    }\n\
  \    while ((c = fgetc(update)) != EOF){\n        if ( isupper(c) ){\n         \
  \   ungetc(c, update); /* 回退 1 个字符 (a) */\n            /* 或者使用 getcfpos = ftell(update);\
  \ 获取当前位置 (b) */\n            fseek(update, fpos-1, SEEK_SET); /* 写入位置 (c) */\n \
  \           fputc(tolower(c), update);\n        }\n    } /* (d) */\n    fclose(update);\n\
  \    return EXIT_SUCCESS;\n\n```\n\n在检测到大写字符后，文件位置位于下一个要读取的字符上。因此，我们需要将写入指示重新定位到上一个字符以便覆盖它。在这里，是通过在输出小写字符之前使用\
  \ `ungetc` 回退一个字符（行 a）来实现的。使用 `ungetc` 仅能保证一次回退。或者，记录当前位置（行 b）然后使用 `fseek` 设置写入位置（行\
  \ c）在通常情况下也是行的。\n\n文件位置设置函数 `fseek` 的通用形式为：\n\n`int fseek (FILE * stream , long\
  \ offset , int origin )`\n\n该函数通常返回 0，出错时返回 -1。在 `fseek` 之后，随后的读取或写入将从新位置开始访问数据。对于二进制文件，位置被设置为相对于指示的\
  \ `origin` 偏移 `offset` 字节，该 `origin` 可以是以下符号常量之一：\n\n```\nSEEK_SET (通常为 0) 文件开头\n\
  SEEK_CUR (通常为 1) 当前位置\nSEEK_END (通常为 2) 文件末尾\n```\n\n对于文本流，`offset` 必须是 0 或 `ftell`\
  \ 返回的值，`ftell` 提供当前位置相对于文件开头的偏移。\n\n到达文件尾后，任何后续输出都将附加到文件末尾。因此，如果我们的示例中（行 e）之后还有更多输出语句，输出将附加到文件中。\n\
  \n`w+` 模式用于对文件进行更重大的修改。用 `w+` 打开的文件会被读取到内存缓冲区，然后被减为空文件。随后的读取操作读取缓冲区，写入操作向空文件添加内容。`a+`\
  \ 模式也赋予你读写文件的能力，但最初将写入位置置在文件末尾。\n\n#### I/O 重定向\n\n标准库函数 `freopen`：\n\n`FILE * freopen\
  \ (char * file , char * mode , FILE * stream )` 将现有的流（如 `stdin`、`stdout` 或 `stderr`）连接到给定文件。基本上这是通过通常方式打开给定文件实现的，但不是创建一个新流，而是将\
  \ `stream` 分配给它。连接到 `stream` 的原始文件会被关闭。例如，语句：\n\n`freopen(\"mydata\", \"r\", stdin);`\n\
  \n会导致你的 C 程序开始将 \"mydata\" 作为标准输入读取。成功的 `freopen` 返回一个 `FILE *`。\n\n例如，在之前的 `freopen`\
  \ 之后，代码：\n\n`char c = getc(stdin);`\n\n从文件 `mydata` 读取下一个字符，而不是从键盘。\n\n类似的库函数 `fdopen`\
  \ 以相同的方式将文件描述符（而不是流）连接到文件。\n\nLinux 系统提供了标准 C 库、X Window 系统库、网络库等。所有可用库函数都在 man\
  \ 手页的第 3 部分进行了描述。\n\n### 10.5 创建库和归档\n\n我们提到过 `ld` 在构建可执行二进制文件时也会链接库。让我们来看看库是如何创建和维护的。尽管我们的讨论面向\
  \ C 语言，但 Linux 下其他语言的库也非常相似。子程序库通常包含函数的对象代码版本，这些函数具有通用性，或者对特定项目具有重要性。其思想是避免重复造轮子，将已经在程序库中编写、测试和调试过的代码收集起来，就像实际库中的书籍一样供所有人使用。\n\
  \n在 Linux 上，对象文件库实际上是归档的一种形式，是一组排列成归档文件的独立文件集合。标识归档格式的魔数数字后面是组成文件，每个文件之前都有一个头文件。头文件包含如文件名、所有者、组、访问模式、最后修改时间等信息。对于对象文件归档（库），开头还有一个目录表，用于标识在哪些对象文件中定义了哪些符号。\n\
  \n`ar` 命令用于创建和维护库。`ar` 命令的通用形式为：\n\n`ar key [ position ] archive-name file ...`\n\
  \n`ar` 将根据指定的 `key` 创建、修改、显示或从 `archive-name` 提取信息。归档名称通常使用 `.a` 后缀。这里列出了一些更重要的\
  \ `key`（操作模式）。\n\n例如，该命令（示例：`ex10/makibme`）：\n\n`ar qcs libme.a file1.o file2.o\
  \ file3.o`\n\n通过组合给定的对象文件创建新的归档文件 `libme.a`。`c` 修符告诉 `ar` 创建新归档，而 `s` 修符导致包含目录表（或索引）。\n\
  \n命令：\n\n`ar tv libme.a`\n\n显示 `libme.a` 的目录表。\n\n```\nrw-rw-r-- 0/0 1240 Jul 9\
  \ 16:18 2018 file1.o\nrw-rw-r-- 0/0 1240 Jul 9 16:18 2018 file2.o\nrw-rw-r-- 0/0\
  \ 1240 Jul 9 16:18 2018 file3.o\n```\n\n如果你不想或没有权限在系统库目录中定位 `libme.a` 文件，可以将库放在自己的目录中，并显式地向\
  \ `gcc` 提供库名进行加载。例如：\n\n`gcc -c myprog.c`\n\n`gcc myprog.o libme.a`\n\n注意 `myprog.c`\
  \ 需要 `libme.a` 的头文件，例如 `me.h`，才能成功编译。\n\n### 10.6 C 程序中的错误处理\n\n\n\n\n系统编程的一个重要方面是预见并处理程序执行过程中可能发生的错误。运行时可能会发生多种错误。例如，调用程序时提供的参数数量不对或使用了未知的选项。程序应该防止此类错误并显示适当的错误消息。面向用户的错误消息应写入\
  \ `stderr`，这样即使 `stdout` 流被重定向，它们也会显示在终端上。例如：\n\n```\nfprintf (stderr, \"%s: cannot\
  \ open %s n\", argv[0], argv[i]);\n```\n\n这会提示用户命令行提供的文件无法打开。请注意，惯例做法是标明显示错误信息的程序名称。在显示错误消息后，程序可以继续执行、返回一个特定值（例如\
  \ -1），或选择终止。要终止执行，可以使用库例程：\n\n```\nexit ( status );\n```\n\n其中 `status` 的类型为 `int`。对于正常终止，`status`\
  \ 应为 0。对于异常终止（如错误），则使用正整数 `status`（通常为 1）。`exit` 例程在执行系统调用 `_exit` 之前，会先对每个打开的文件调用\
  \ `fclose`，这会导致立即终止且不刷新缓冲区。如果需要，C 程序可以直接使用：\n\n```\n_exit ( status );\n```\n\n请参阅第\
  \ [11]](#part0016.html_F8900-5f30517cbae74ef497aa2df968393592) 章第 11.14 节了解关于 `_exit`\
  \ 的讨论。\n\n## 来自系统和库调用的错误\n\n错误的可能来源是系统调用或库调用失败。系统调用是对 Linux 内核中例程的调用。Linux 提供了许多系统调用，理解它们是学习\
  \ Linux 系统编程的一部分。当系统调用或库调用失败时，被调用的例程通常不会终止程序执行。相反，它返回一个无效值或设置一个外部错误标志。返回的错误指示必须与函数声明的返回值类型一致。同时，错误值不能是该函数在无失败情况下可能返回的任何值。对于库函数，标准错误值为：\n\
  \n- `EOF`——错误值 `EOF`（通常为 -1）用于通常返回非负数的函数。\n- `NULL`——错误值 `NULL`（通常为 0）用于通常返回有效指针（非零）的函数。\n\
  - `nonzero`——非零错误值用于通常返回 0 的函数。\n\n由你的程序来检查此类返回的值并采取适当措施。以下是常用的惯用法：\n\n```\nif (\
  \ (value = call(...)) == errvalue ){ /* 在此处处理错误 *//* 向 stderr 输出任何错误消息 */}\n```\n\
  \n失败的 Linux 系统调用返回类似的标准错误，如 -1、0 等。\n\n为了妥善处理系统和库调用的错误，应该包含头文件 `<errno.h>`。\n\n\
  ```\n#include <errno.h>\n```\n\n该头文件定义了符号错误数字及其相关的标准错误消息。对于 Linux 系统，这些数值中的一些显示在表\
  \ 10.4 中。你可以在标准 C 头文件中找到所有错误常量，通常位于 `/usr/include` 文件夹下。\n\n### 基础 Linux 错误代码\n\n\
  ![image](img/00130.jpeg)\n\n在系统或库调用失败后，外部变量 `errno` 被设置为这些错误数字之一，但在调用成功后不会被清除。该变量可供你的程序检查。系统/库调用\n\
  \n```\nperror (const char * s )\n```\n\n可以用于显示标准错误消息。调用 `perror(str)` 会输出到标准错误：\n\
  \n1. 参数字符串 `str`\n2. 冒号（`:`）字符\n3. 与当前 `errno` 值相关的标准错误消息\n4. 换行符（`'\\n'`）字符\n\n\
  给 `perror` 的字符串参数通常是 `argv[0]` 或该字符串加上检测到错误的函数名。\n\n有时显示标准错误消息的变体是理想的。为此，可以通过标准库函数获取错误消息：\n\
  \n```\nchar * strerror (int n ) /* 获取错误消息字符串 */\n```\n\n该函数返回指向与错误 `n` 相关的错误字符串的指针。\n\
  \n此外，每个 I/O 流都关联错误和文件结束指示。标准 I/O 库函数在发生错误或文件结束时设置这些指示。可以使用库函数在程序中显式地测试或设置这些状态指示：\n\
  \n```\nint ferror(FILE *s) 如果错误指示被设置，则返回真（非零）\nint feof(FILE *s) 如果文件结束指示被设置，则返回真\n\
  void clearerr(FILE *s) 清除文件结束和错误指示\n```\n\n## 来自数学函数的错误指示\n\n变量 `errno` 也被标准数学函数用于指示定义域和范围错误。如果传递给函数的参数值超出该特定函数的有效范围，就会发生定义域错误。例如，对于\
  \ `log` 函数，只有正参数是有效的。当计算结果太大或太小而无法表示为 `double` 时，就会发生范围错误。\n\n当发生定义域错误时，`errno`\
  \ 被设置为 `EDOM`（`<errno.h>` 中定义的符号常量），返回的值取决于实现。另一方面，当发生范围错误时，`errno` 被设置为 `ERANGE`，并返回\
  \ 0（下溢）或 `HUGE_VAL`（溢出）。\n\n### 10.7 错误恢复\n\n运行时错误可以通过三种方式之一处理：\n\n1. 退出——显示适当的错误消息并终止执行。\n\
  2. 返回——带有定义良好的错误值返回到调用函数。\n3. 恢复——将控制权转移到程序的保存状态以继续执行。\n\n前两种方法已为人理解。第三种方法错误恢复，以\
  \ `vi` 等程序为典型，它在发生错误时会返回到顶层。这种控制转移通常是从一个函数中的某一点到程序中早得多的某一点。这种非局部控制转移无法通过在函数内部工作的\
  \ `goto` 语句实现。提供了两个标准库例程 `setjmp` 和 `longjmp` 用于非局部跳转。要使用这些例程，必须包含头文件 `setjmp.h`。\n\
  \n```\n#include <setjmp.h>\n```\n\n`setjmp` 例程声明为：\n\n```\nint setjmp (jmp_buf env\
  \ ) /* 设置 longjmp 位置 */\n```\n\n它在被调用时会在缓冲区 `env` 中保存定义当前程序状态的关键数据，供以后可能的 `longjmp`\
  \ 使用。首次调用 `setjmp` 的值为 0。`longjmp` 例程使用保存的 `env` 将控制权抛回给 `setjmp` 语句。\n\n```\nvoid\
  \ longjmp (jmp_buf env , int val )\n```\n\n![image](img/00131.jpeg)\n\n图 10.4 长跳转\n\
  \n当带有保存的 `env` 和整数 `val`（必须非零）调用时，`longjmp` 将恢复保存的状态 `env` 并导致执行恢复，就像原始的 `setjmp`\
  \ 调用刚刚返回值 `val` 一样。为了让这种回溯正确发生，`longjmp` 必须从调用 `setjmp` 的函数的嵌套函数调用序列中的某个函数调用（见图\
  \ 10.4）。换句话说，`setjmp` 将 `env` 建立为非局部 goto 标签，`longjmp` 用于将控制权传回由 `env` 标记的点。\n\n\
  在 `longjmp` 操作后，所有可访问的全局和局部数据均为调用 `longjmp` 刻的值。ANSI 标准规定 `setjmp` 调用不会保存数据值。\n\n\
  由于其工作方式，`setjmp` 可以单独独立存在，也可以出现在 `if`、`switch` 或 `while` 的测试条件部分。以下是一个简单的示例，展示了如何使用\
  \ `setjmp` 和 `longjmp`（例：ex10/longjumptest.c）。\n\n\n\n\n\n```c\n#include <stdio.h>\n\
  #include <errno.h>\n#include <setjmp.h>\njmp_buf env;\nvoid recover(int n){ /* 如果需要调整变量的值\
  \ */\nlongjmp(env, n);}\nvoid func_2(int j){ /* 正常处理 */\nrecover(j);}\nvoid func_1(int\
  \ i){ /* 正常处理 */\nfunc_2( i * 2);}\nint main(){ /* 在此处初始化并设置 *//* 然后调用 setjmp */\n\
  int err=0;\nif ( (err = setjmp(env)) != 0){ /* longjmp 的返回点 *//* 在 longjmp 之后进行任何调整\
  \ */\nprintf(\"Called longjmp\\n\");\nprintf(\"Error No is %d\\n\", err);\nreturn\
  \ err;}/* 继续正常处理 */\nprintf(\"After initial setjmp()\\n\");\nprintf(\"Calling func_1\\\
  n\");\nfunc_1(19);}\n```\n\n在这个示例中，`main` 函数设置了最终由 `recover` 函数调用的 `longjmp`。请注意\
  \ `recover` 永远不会返回。可以使用 `setjmp` 标记多个位置 `env1`、`env2`......，并使用 `longjmp` 将控制转移到这些标记位置之一。\n\
  \n除了错误恢复外，非局部跳转（non-local jump）还可以直接从深层嵌套函数调用返回返回值。这比通过所有中间函数的系列返回要更高效。然而，非局部控制转移往往会使程序结构复杂，应该谨慎使用。\n\
  \n### 10.8 使用 GDB 调试\n\n虽然 C 编译器在语法层级识别问题，但你仍然需要一个良好的工具在运行时进行调试。GDB（GNU 调试器）是一个用于源码级调试和程序控制执行的方便实用。你的\
  \ Linux 发行版通常已安装它。命令是 `gdb`。\n\nGDB 可用于调试用 C、C++ 和 f90 等许多源语言编写的程序，前提是对象文件已编译并包含供\
  \ gdb 使用的适当符号信息。这意味着你使用了 `gcc` 的 `-g` 或更好的 `-ggdb` 选项（见第 [10.3] 节）。\n\nNemiver 是\
  \ GDB 的 GUI 前端。如果你倾向于使用窗口菜单导向的环境来使用 `gdb`，可以在你的 Linux 上下载并安装。\n\n其他常见的调试器包括 `dbx`\
  \ 和 `sdb`。它们通常没有 `gdb` 那么易用。我们将描述如何使用 `gdb` 调试 C 程序。一旦学会，`gdb` 应该作为调试程序的例行工具使用。它比在源代码中插入\
  \ `fprintf` 行要高效得多。该工具同样适用于许多其他编程语言。\n\n#### 交互式调试\n\nGDB 提供了一个交互式调试环境，并将运行时活动与程序源代码中的语句相关起来。这就是为什么它被称为源码级调试器。调试是在\
  \ `gdb` 工具的控制下运行目标程序实现的。`gdb` 的主要功能列如下。\n\n1. 源码级跟踪——当对程序的一部分进行跟踪时，每当执行该部分，就会显示有用信息。如果你跟踪一个函数，每次调用被跟踪的函数时，都会显示调用函数的名称、传递参数的值以及返回值。你还可以跟踪特定的代码行甚至单个变量。在后的情况下，每当变量值变化时，你都会收到通知。\n\
  2. 设置源码级断点——程序中的断点会在到达该点时暂停执行。在断点处，你可以与 `gdb` 交互并使用其全套命令在恢复执行之前调查情况。\n3. 单源码行步进——当你仔细检查某段代码时，你可以让执行每次通过一条源码继续进行。（注意，一行可能包含几条机器指令。）\n\
  4. 显示源代码——你可以要求 `gdb` 显示来自任何文件的程序源码的任何部分。\n5. 检查值——标识符的值、声明和其他属性也可以被显示。\n6. 对象级调试——还提供了机器指令级的执行控制以及内存内容或寄存器值的显示。\n\
  \n要使用 `gdb` 调试 C 程序，请确保每个对象文件都已编译，并使用 `gcc -ggdb` 生成了最终的可执行文件。实现此点的一种简单方法是一次性编译所有源（`.c`）文件：\n\
  \n```\ngcc -ggdb source_files\n```\n\n这将产生一个适用于在 `gdb` 控制下运行的可执行文件 `a.out`。因此，要在\
  \ `lowercase.c` 上使用 `gdb`，你必须先对其进行准备：\n\n```\ngcc -g lowercase.c -o lowercase\n\
  ```\n\n然后，要调用 `gdb`，只需输入\n\n```\ngdb lowercase\n```\n\n来调试该命名的的可执行文件。如果没有给出文件，则假设为\
  \ `a.out`。当你看到提示符\n\n`(gdb)`\n\n表示调试器已准备好进行交互会话。当你完成后，只需输入 `gdb` 命令\n\n```\nquit\n\
  ```\n\n退出 `gdb`。一个典型的调试会话应该遵循以下步骤：\n\n1. 对用 `-ggdb` 选项编译的可执行文件调用 `gdb`。\n2. 设置断点。\n\
  3. 在 `gdb` 下运行程序。\n4. 检查调试输出，并在断点处显示程序值。\n5. 安装新断点以定位 bug，根据需要删除旧断点。\n6. 恢复或重启执行。\n\
  7. 重复步骤 4-7 直到满意。\n\n在了解 `gdb` 能做什么之后，我们现在准备好查看 `gdb` 提供的实际命令。\n\n#### 基本 gdb 命令\n\
  \n作为一种调试工具，`gdb` 提供了丰富的命令集。本节介绍了最常用的命令。这些对于除了最晦涩的 bug 之外的所有情况都足够了。完整的命令集列在 `gdb`\
  \ 手页中。\n\n要在 `gdb` 内部开始目标程序的执行，使用\n\n```\n(gdb) run [ args ] [ > file1 ] [ < file2\
  \ ] (在 gdb 中启动执行)\n```\n\n其中 `args` 是二进制文件所需的任何命令行参数。允许使用 `>` 和 `<` 进行 I/O 重定向。如果正在调试\
  \ `lowercase`，那么\n\n```\n(gdb) run > input_file < output_file\n```\n\n是有意义的。\n\n\
  然而，在运行程序之前，你可能希望先设置断点。[表 10.5] 列出了用于跟踪的命令。\n\n简单的 GDB 断点命令\n\n![image](img/00132.jpeg)\n\
  \n`break` 命令可以缩写为 `br`。通过行号指定，行可以通过这些命令显示。\n\n| `list` | 显示下 10 行。 |\n| `list line1,line2`\
  \ | 显示行范围。 |\n| `list function` | 显示函数前后的几行。 |\n\n当程序执行在 `gdb` 下到达断点时，执行停止，你将获得\
  \ `(gdb)` 提示符，以便你可以决定做什么以及检查哪些值。在断点处有效的命令在 [表 10.6] 中，其中命令 `bt` 是 `backtrace` 的缩写，与命令\
  \ `where` 。\n\n断点内的 GDB 命令\n\n![image](img/00133.jpeg)\n\n到达断点后，你还可以通过 `step`（执行下一行源码）和\
  \ `next`（执行到下一行源码）单步执行源码行。`step` 和 `next` 的区别在于，如果该行包含对函数的调用，`step` 将在该函数块的开始停止，而\
  \ `next` 则不会。随着调试的进行，会设置和移除断点以尝试定位 bug。已经给了设置断点的命令。要禁用或删除断点，使用\n\n```\ndisable number\
  \ ... (禁用指定的断点)\nenable number ... (启用已禁用的断点)\ndelete number ... (删除指定的断点)\n```\n\
  \n每个断点都通过一个序列号识别。`gdb` 在每次 `break` 命令后都会显示序列号。如果你不记得这些数字，输入\n\n```\ninfo breakpoints\
  \ (显示断点信息)\n```\n\n来显示所有当前存在的断点。\n\n如果你反复使用一组 `gdb` 命令，考虑将它们放在文件中，例如 `mycmds`，并以这种方式运行\
  \ `gdb`：\n\n```\ngdb -x mycmds a.out\n```\n\n#### gdb 的示例调试会话\n\n\n\n\n让我们使用源代码\
  \ `low.c` 展示一个完整的调试过程。该文件是 `lowercase.c` 的一个版本，它使用了 Linux I/O 系统调用 `read` 和 `write`（第\
  \ [11] 章，第 [11.1] 节）来执行 I/O（例如 ex10/low.c）。\n\n```\n#include <unistd.h>\n#include\
  \ <stdlib.h>\n#include <stdio.h>\n#include <ctype.h>\n#define MYBUFSIZ 1024\nint\
  \ main(int argc, char* argv[]){ char buffer[MYBUFSIZ];void lower(char*, int);int\
  \ nc; /* number of characters */while ((nc = read(STDIN_FILENO, buffer, MYBUFSIZ))\
  \ < 0){ lower(buffer,nc);nc = write(STDOUT_FILENO, buffer, nc);if (nc == -1) break;}if\
  \ (nc == -1) /* read or write failed */{ perror(argv[0]);exit(EXIT_FAILURE);}return\
  \ EXIT_SUCCESS; /* normal termination *}void lower(char *buf, int length){ while\
  \ (length-- < 0){ if ( isupper( *buf ) )*buf = tolower( *buf );buf++;}}\n```\n\n\
  现在我们展示如何使用 `gdb` 来控制此程序的执行。用户输入显示在提示符 (gdb) 之后。`gdb` 的输出会有缩进。\n\n我们首先对 `lowercase.c`\
  \ 进行调试编译，并调用 `gdb`（例如 ex10/debug）。\n\n```bash\ngcc -ggdb low.c -o low\ngdb low\n\
