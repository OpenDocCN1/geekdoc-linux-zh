  \ Linux 版本。（提示：`uname` 命令。）\n\n[1] Shell 变量 `$HOME` 的值是你的家目录的文件名。\n[2] 注意，除非给出 `-z`\
  \ ，否则 `nano` 会忽略 `CTRL+Z`。\n[3] 注意 Linux 已经有一个列出目录的普通命令 `dir`。\n[4] 如果你的 BASH Shell\
  \ 带有 `which` 的别名，取消该别名以便使用该函数。\n\n## 第 4 章\n\n## 使用命令和应用程序\n\nLinux 提供了丰富的命令和应用程序，可以完成你想要的任何事情。有效使用\
  \ Linux 涉及了解可用哪些应用程序和命令。通过软件搜索和包管理，可以很容易地找到、安装、更新和删除应用程序以及系统软件。\n\n\n\n\n此外，现有的命令可以很容易地组合在命令行或\
  \ Shell 脚本中形成新命令（参见第 5 章 ）。\n\n我们将讨论一组常用的 GUI 应用和 CLI 命令。我们还将向你展示如何将命令组合成新命令，以及选择正确的命令进行应用。在本书中，我们将介绍许多实用的\
  \ Linux 命令，并演示如何单独或结合地使用它们。\n\n许多命令都是过滤器。过滤器通常对其输入执行简单且定义良好的转换，并遵循某些约定，以便与其他程序连接。过滤器可以使用管道连接在一起（参见第\
  \ 3 章，第 3.5 节），成为可以对数据执行复杂函数的流水线。本章介绍了许多实用的过滤器。示例展示了如何在实践中构建流水线。\n\n例如，`sort` 命令是一个对其输入行进行排序的过滤器。`tr`\
  \ 命令将输入中的特定字符翻译其他字符。你可以将这两个过滤器与其他过滤器结合，创建并维护一个简单的地址数据库。\n\n利用和处理人类可读的文本数据一直是 Linux\
  \ 的重点。在文本数据中，我们经常需要识别必须转换或操作的精确位置。正则表达式提供了指定文本数据中模式的标准方法。熟悉正则表达式非常重要，因为它们频繁出现并且是编程的基础。我们将解释正则表达式符号以及它们如何在\
  \ `grep` 和 `sed/vi` 等应用程序中使用。\n\n### 4.1 实用的 GUI 应用](#4.1-part0003.html_C2toc4001)\n\
  \nLinux 提供了大量的应用程序。用户只需要知道哪些可用，确保已安装，然后学习如何使用它们。\n\n用于查找、安装和管理应用的 GUI 工具，例如 GNOME\
  \ 软件 (`gnome-software`) 和 Ubuntu 软件中心 (`software-center`)，它们被分为可搜索的类别，使得应用管理变得简单（图\
  \ 4.1）。此外，还有面向命令行的 `DNF` 和 `APT` 包管理器（参见第 8 章，第 8.2 节）。\n\n![image](img/00042.jpeg)\n\
  \n图 4.1 GNOME 软件\n\n我们将讨论一些通常很有用的应用程序。\n\n#### 文字处理](#Word-Processing-part0003.html_C3toc41)\n\
  \n对于学校或工作，文字处理是一项频繁的任务。在 Linux 上，我们没有昂贵的 Microsoft Office，但有免费的 Apache OpenOffice\
  \ 和 LibreOffice。`libreoffice` 命令（图 4.2）安装在许多 Linux 发行版中。\n\n![image](img/00043.jpeg)\n\
  \n图 4.2 LibreOffice\n\n使用免费软件进行文字处理、电子表格、幻灯片演示、编辑 PDF 文件、导入/导出到不同格式（包括文本、PDF）。\n\
  \n在 Linux 上查看 PDF 还可以使用 `Okular`、`Evince` 或 `Foxit Reader`。通常 `evince` 是预安装的 PDF\
  \ 查看器。要选择、分割和删除 PDF 页面，可以考虑 `qpdf`。它还可以合并一个或多个 PDF 文件，并为 PDF 文件添加密码保护。\n\n#### 文档格式化与排版](#Document-Formatting-and-Typesetting-part0003.html_sec42)\n\
  \n为了准备技术论文等较大的文档，LaTeX 系统通常很有帮助，甚至可能是科学会议和出版社的要求。LaTeX 是一种高质量的排版系统和标记语言，允许使用纯文本标记文档布局、字体、颜色等。例如，`mydoc.tex`\
  \ 文件（示例：04/mydoc）\n\n```\n\\documentclass{article}\\title{A Sample Document}\\author{Paul\
  \ S. Wang}\\date{2018-09-01}\\begin{document}\\maketitle\\section{Introduction}\
  \ More text here . .\\section{Background} More text here . .\\end{document}\n```\n\
  \n可以由命令 ¹ 处理以生成图 4.3 所示的 `mydoc.pdf`。\n\n```bash\npdflatex mydoc.tex\n```\n\n![image](img/00044.jpeg)\n\
  \n图 4.3 LaTeX 生成的文档\n\n除了所有标准的文档格式化功能外，LaTeX 在以下功能方面表现：\n\n*   数学公式的专业排版\n*   章节、节、页面和图片的自动编号\n\
  *   交叉引用\n*   目录和索引的生成\n\n事实上，本教科书使用了出版社提供的模板进行设置。以下是安装 LaTeX 的方法（选择 `texlive` 或\
  \ `texstudio`）：\n\n```bash\ndnf install texlive-scheme-full\napt-get install texlive-scheme-full\n\
  dnf install texstudio\napt-get install texstudio\n```\n\n#### 绘图与制图](#Drawing-and-Diagramming-part0003.html_sec43)\n\
  \n绘制点、线、箭头、矩形、圆形/椭圆和其他曲线以形成图表的工具通常使用矢量图形，其中坐标、角度和距离被用于绘图。与使用像素形成形状的位图不同，矢量图形可以放大或缩小（缩放或缩小）而不会丢失清晰度（变得像素化）。\n\
  \nLibreOffice Draw 作为绘图和制图工具非常好。`dia`（图 4.4）是一个类似于 Microsoft Visio 的程序，非常适合制作各种图表。\n\
  \n![image](img/00045.jpeg)\n\n图 4.4 使用 Dia 制图\n\n`Xfig` 是另一个简单高效的绘图工具。`Inkscape`（图\
  \ 4.5）是一个强大的工具，类似于 Adobe Illustrator 或 CorelDraw，让你能够基于矢量图形创建精美的绘画。\n\n![image](img/00046.jpeg)\n\
  \n图 4.5 Inkscape\n\n`sK1` 是一种强大的矢量图形工具，用于为专业出版准备高质量绘画。`Flow` 是另一个用于流程图、网络图等的应用。\n\
  \n`Asymptote` 是一种矢量图形语言和系统，允许你使用纯文本指令指定绘图，并生成不同格式（Postscript, PDF, SVG, 3D PRC）的图形文件。例如，文本文件\
  \ `line.asy`（示例：ex04/line.asy）\n\n```asy\ndraw((0,0)–(50,50));\n```\n\n表示从原点到 (50,50)\
  \ 绘制一条直线。该文件可以由命令 `asy` 处理：\n\n```bash\nasy -V line    （生成 line.eps 并显示结果）\nasy\
  \ -f pdf line    （生成 PDF 文件 line.pdf）\n```\n\n#### 位图与图像处理](#Raster-Graphics-and-Image-Processing-part0003.html_sec44)\n\
  \n在 Linux 上，你可以使用 `eog` (Eye of Gnu) 查看照片并使用 `shotwell` 管理它们。\n\n也许 Linux 上最知名且最广泛使用的位图像创建和处理应用程序是\
  \ `GIMP`（GNU 图像处理程序）。与 Adobe Photoshop 相比，GIMP 功能丰富且能力强大。此外，GIMP 设计上用于通过插件和扩展进行增强。图\
  \ 4.6 显示了使用 `gimp` 命令设计本书网站的顶部横幅。\n\nGIMP 还可以通过截图直接创建要处理的图像。或者你可以使用 `PRINTSEEN`\
  \ 键（全屏）、`ALT+PRINTSEEN`（当前窗口）和 `SHIFT+PRINTSEEN`（光标选择区域）。结果图像放置在你的图片文件夹中。`gnome-screenshot`\
  \ 命令提供了截图提供了更多控制。\n\n\n\n\n我们已经知道 Nautilus 支持文件的本地和远程访问（见第 2.7 节）。FileZilla 是一个用于\
  \ FTP 和 SFTP 的图形界面工具，对于初学者和偶尔使用的用户更容易上手。使用以下命令安装 FileZilla：\n\n```bash\ndnf filezilla\n\
  apt-get filezilla\n```\n\n![image](img/00048.jpeg)\n\n图 4.7 FTP 工具 FileZilla\n\n\
  并使用 `filezilla` 启动它（图 4.7 章，第 7.10 节）。查找应用程序 > 实用工具 > 密码和密钥，或输入命令：\n\n```bash\n\
  seahorse\n```\n\n![image](img/00049.jpeg)\n\n图 4.8 Seahorse 工具\n\n启动 Seahorse（图\
  \ 4.8）。选择“登录”并点击加号添加新条目。点击锁形图标来锁定/解锁存储的信息。在退出 Seahorse 之前确保所有内容都已锁定。要在 Seahorse\
  \ 中解锁内容，请使用你的 Linux 登录密码。\n\n另一个强大的密码管理器是 keepassx2。安装请执行：\n\n```bash\ndnf install\
  \ keepassx\napt-get install keepassx\n```\n\n## 云存储\n\n将文件和文件夹存储在云端（互联网上的服务器上）可以为你提供额外的存储空间，让与他人共享文件变得简单，并为重要文件提供安全备份方法。\n\
  \n对于 Linux，有一项特定的云存储服务脱颖而出，即 DropBox。免费账户为你提供 2GB 的存储空间，可以通过 Web 端和本地文件夹 `$HOME/Dropbox`\
  \ 访问。安装 DropBox 非常简单：\n\n```bash\ndnf install dropbox\napt-get install nautilus-dropbox\n\
  ```\n\n安装后，你可以使用以下命令启动 DropBox：\n\n```bash\ndropbox start -i\n```\n\n这将引导你安装 DropBox\
  \ 守护进程 (`dropboxd`) 并将 Linux 与你的 DropBox 账户链接。守护进程是在后台运行的程序，随时准备提供特定服务。Linux 系统通常有很多守护进程来支持许多有用服务。\n\
  \n现在你可以使用你的 `$HOME/Dropbox` 文件夹，它会自动镜像到你的 DropBox 云存储中。阅读同一文件夹包含的“入门指南”以获取使用信息。\n\
  \nLinux 还有许多其他云存储选项，包括 Amazon S3、Google Cloud Storage、Spider Oak 和 SeaFile。\n\n\
  ## 3D 建模与 3D 打印\n\nLinux 上也提供了用于 3D 建模和 3D 打印的免费应用。强大的 Blender 支持动画、建模、游戏开发、3D 打印等功能。安装它后，你就拥有了\
  \ `blender` 命令。\n\n虽然 Blender 更多用于艺术项目，但 FreeCAD 帮助帮助你在工程项目中进行参数化的 3D 设计。FreeCAD\
  \ 可以输入和输出许多标准文件格式，并可以使用 Python 接口进行编程。它是初级和经验 CAD（计算机辅助设计）工程师的良好选择。\n\n图 4.9 显示\
  \ FreeCAD 网站的截图。\n\n![image](img/00050.jpeg)\n\n图 4.9 FreeCAD\n\n## 数学计算\n\n`expr`\
  \ 命令可以对整数进行简单的计算和比较。详情请见 `man expr`。\n\n![image](img/00051.jpeg)\n\n图 4.10 Gnome\
  \ 计算器\n\n对于桌面计算器，`gnome-calculator` 用于交互式使用非常方便，并提供了几种不同的输入模式（图 4.10）。`gcalccmd`\
  \ 是其命令行版本。\n\n对于极其强大的数学工具，可以考虑 MAXIMA，它是一个源自 MIT Macsyma（Project MAC 的 SYmbolic\
  \ MAnipulator）的免费符号计算系统，是一种设计用于执行精确和近似数学计算的通用计算机系统（图 4.11）。\n\nMAXIMA 提供了令人深刻目的数学能力集合，可以与经过良好训练的工程师和数学家竞争。作者博士工作的一部分贡献了\
  \ Macsyma 的开发，包括多项式分解和最大公约数（GCD）、复数、极限、定积分、线性代数、Fortran 和 LaTeX 代码生成。查看书籍网站上的在线演示。\n\
  \n![image](img/00052.jpeg)\n\n图 4.11 MAXIMA\n\n安装 MAXIMA 非常简单。\n\n```bash\ndnf install\
  \ wxmaxima\napt-get install wxmaxima\n```\n\n然后使用 `wxmaxima` 调用 GUI 版本，或使用 `maxima`\
  \ 调用 CLI 版本。\n\n现在让我们把注意力转向命令行应用程序以及如何使用它们。\n\n## 4.2 命令与过滤器\n\n简单来说，过滤器是任何通过遵循一组定义良好的约定来转换其输入并产生输出的命令。这些约定使得过滤器很容易与管道中的其他程序组合（图\
  \ 4.2）。\n\n![image](img/00053.jpeg)\n\n图 4.12 过滤器\n\n过滤器通过以下特征与其他命令区分开来：\n\n1. 过滤器从标准输入\
  \ (`stdin`) 接收输入。因此，当我们调用过滤器时，它不需要文件参数。\n2. 过滤器将其结果发送到标准输出 (`stdout`)。因此，它不需要输出文件参数。\n\
  3. 过滤器对输入执行定义良好的转换，并产生不带头部、尾部、标签或其他格式的输出。\n4. 过滤器不会尝试以任何方式解释其输入数据。因此，它绝不会将输入视为指令或命令。\n\
  5. 少数例外外，过滤器不会就命令行提供的额外参数之外与用户进行交互。\n6. 过滤器产生的任何错误或诊断输出都会发送到标准错误输出 (`stderr`)。因此，错误信息永远不会与产生的结果混合。\n\
  \n这些特征使得过滤器很容易适应管道。总目的是让程序产生可以作为输入馈给另一个程序并可以直接处理的输出。通常，此类输入包含不带装饰性标签、注释或额外格式的文本行。每个数据条目使用单独的一行。例如，如果数据条目是单词，那么输入应该是每行一个单词。对于更复杂的数据条目（例如由\
  \ `ls -l` 产生的），行可能由多个由空格、制表符或冒号分隔的字段组成（例如 `/etc/passwd`）。\n\n许多 Linux 命令都是过滤器，它们也可以作用于文件。约定是：如果提供文件名作为参数，命令可以使用它们作为输入/输出。否则，如果没有提供文件，该命令将作为过滤器运行。\n\
  \n进程扩展（第 3 章，第 3.7 节）的 Bash 功能使得将过滤器的输出作为其他命令的输入文件成为可能。\n\n让我们来看一些过滤器，然后展示如何使用它们构建管道。\n\
  \n#### 头部和尾部行：head 和 tail\n\n`head` 和 `tail` 命令分别用于显示文件的头部和尾部行。命令如下：\n\n```bash\n\
  head [ -k ] [ file ... ]\n```\n\n\n\n\n将每个给定文件的前 k 行（默认 10 行）输出到标准输出。如果没有给出文件参数，则使用标准输入。`head`\
  \ 命令是查看文件前几行的快速方法，这通常就是你需要的全部。\n\n`tail` 命令则是相反的，它在屏幕上显示文件的最后部分：\n\n```\ntail [\
  \ starting-point ] [ file ... ]\n```\n\n将每个给定文件的最后部分（从 `starting-point` 到结束，或者默认为最后\
  \ 10 行）输出。如果未指定文件，则使用标准输入。起始点指定为：\n\n`+k`（从开始的第 k 行）\n\n`-k >`（从末尾倒数第 k 行）\n\n如果整数\
  \ `k` 后面紧跟字符 `b` 或 `c`，则 `tail` 将分别计算块或字符而不是行。`-f` 选项指示 `tail` 在显示文件末尾后继续运行，反复探测文件以防有新行追加。此选项提供了一种监控正另一个程序写入的文件的方法。\n\
  \n在管道中，`head` 和 `tail` 可用于从输入中选择某些行并排除其他行。`more` (less) 命令可用于管道末尾以管理长输出。\n\n## 字符翻译：tr\n\
  \n`tr` 命令将标准输入复制到标准输出，替换或删除指定的字符。例如，\n\n```\ntr A-Z a-z < file1 > file2\n```\n\n\
  创建 `file2` 作为 `file1` 的副本，并将所有大写字母翻译为对应的小写字母。另一个例子是\n\n```\ntr 'tab' % < file1 >\
  \ file2\n```\n\n在输入此命令时，`TAB` 必须通过 `CTRL+V` 转义。这种方法允许你将 `file1` 中的每个 `TAB` 视作 `file2`\
  \ 中的 `%` 字符（假设 `file1` 不包含任何 `%` 字符）。通常，\n\n```\ntr string1 string2\n```\n\n将 `string1`\
  \ 字符翻译为对应的 `string2` 字符，假设两个字符串长度相同。如果 `string2` 较短，则会被处理为通过重复其最后一个字符进行足够的填充，使其与\
  \ `string1` 等长。可以给出一个字符范围，如 `x-y`。也可以通过八进制的 ASCII 码指定字符（例如，`040` 代表 `% SPACE`，`011`\
  \ 代表 `TAB`，`012` 代表 `NEWLINE`）。例如，要将一组空格替换为 `NEWLINE`，请使用\n\n```\ntr -s ’ 040 011’\
  \ ’ 012’\n```\n\n`-s`（压缩）选项将 `string1` 中所有连续重复的字符字符串缩短为单个字符。`-c`（补集）选项通过指定不在 `string1`\
  \ 中的字符来定义 `string1`。因此，\n\n```\ntr -cs 0-9A-Za-z ’ 012’\n```\n\n创建输入中所有单词的列表（每行一个）。在本例中，`string1`\
  \ 是除数字和字母以外的所有字符。\n\n当给出选项 `-d`（删除）时，输出中将删除 `string1` 中的字符，且不需要 `string2`。例如，要从输入中删除所有的\
  \ CR 字符，我们可以使用\n\n```\ntr -d \"\\015\" < file\n```\n\n## 制表符扩展 (Tab Expansion)\n\
  \n制表符通常需要扩展为等数量的空格或反之。然而，这种转换并不是由 `tr` 执行的，因为每个 `TAB` 必须替换为足够的空格，以便将输出列移动到下一个制表位停止。制表符扩展及其逆转换比简单的逐字符替换要复杂一些。过滤器\n\
  \n`expand`（用空格替换制表符）\n\n`unexpand`（用制表符替换空格）\n\n用于这些目的。例如，\n\n```\nexpand -t 6 <\
  \ file\n```\n\n将 `file` 中的每个 `TAB` 替换为空格，假设制表位停止间隔为 6（默认 8）空格。\n\n## 文本行折行 (Folding\
  \ Text Lines)\n\n有时需要确保文本行在特定长度内以便于显示、查看或打印。`fold` 过滤器通过在需要的地方插入 `NEWLINE` 字符来折断长行。\n\
  \n```\nfold < file\n```\n\n默认将行限制为 80 个字符。常用的选项包括\n\n`-w n`（将宽度设置为 `n` 列）\n\n`-s`（仅在空格处折行）\n\
  \n例如，\n\n```\nfold -w 72 -s report > new_report\n```\n\n创建 `new_report` 作为 `report`\
  \ 的版本，其所有行在空格处折叠并限制在 72 个字符以内。\n\n## 邮件日历提醒\n\n在 Linux 上，你有像 Evolution、California\
  \ 和 Lightning for Thunderbird 等精美的 GUI 工具。然而，使用简单的管道，还有另一种方法获取日历提醒，并在目标活动前一天通过邮件发送给你。\n\
  \n`calendar` 命令是一个过滤器，读取日历文件（`./calendar` 或 `$HOME/.calendar/calendar`）并写入今天和明天所有的事件。日历文件每行列出一个事件，格式如下\n\
  \n`date TAB any text description`\n\n例如，\n\n```\n4/15 pay tax1/21 Reminder: Chinese\
  \ New Year 1/28/201709/01 reminder: Sister's birthday (9/08)Saturday weekly file\
  \ backup\n```\n\n管道\n\n```\ncalendar | mail -s MyReminder emailAddress\n```\n\n\
  通过邮件发送所需的提醒。请查看 `calendar` 手页以获取可能的日期格式。\n\n## 文本行排序 (Sorting Text Lines)\n\n数据通常按某种顺序排序以便于访问和处理。你可能希望对姓名和地址列表按字母排序、将多个此类列表合并为一个、在列表中查找条目，或比较两个已经排序的列表。\n\
  \n`sort` 命令接收输入行并按排序顺序将其写入标准输出。排序的单元是整行。每行可能包含一个或多个字段，由一个或多个空格（空格或制表符）分隔。例如，名为 `students`\
  \ 的文件（例如：`ex04/students`）可能包含以下行：\n\n```\nF. Smith 21 3.75 PhysicsJ. Wang 23 2.00\
  \ AccountingR. Baker 20 3.20 Chemical EngineeringS. Doe 24 3.20 BusinessP. Wang\
  \ 22 4.00 Computer Science\n```\n\n第一行包含五个字段（空格分隔）；第三行包含六个字段。`sort` 命令允许你使用字段位置来指定用于行排序的排序键。排序键由行的起始和结束字段位置定义。比较不同行中的排序键以对行进行排序。\n\
  \n因此，如果你将排序键指定为第二个字段来排序文件 `students`，则行将根据姓氏进行排序，默认使用 ASCII 排序序列。在没有任何指定的情况下，排序键是整行。多个排序键按重要性顺序给出。在比较任何两行时，只有当发现之前的所有排序键相等时，`sort`\
  \ 才会使用下一个排序键。\n\n命令的一般形式为\n\n```\nsort [options] [–key=key ...] [file ...]\n```\n\
  \n给定文件中所有行都在一起排序。名为 `\"-\"` 的文件是标准输入。如果没有给出文件，`sort` 使用标准输入。它默认写入标准输出。键按重要性顺序给出。键由两个字段位置给出：\n\
  \n`begin[,end]`\n\n它们指定了一个由起始和结束位置之间的所有字符组成的排序键（不包括字段分隔符）。如果省略，`end` 变为行末尾。每个位置的格式为\n\
  \n`f [.c]`\n\n其中 `f` 是字段数，可选的 `c` 是字符数。例如，位置 `2.3` 表示第二个字段的第三个字符。如果省略，`c` 则为 `1`。因此，位置\
  \ `3` 等同于 `3.1`。[表 4.1] 了一些排序键规范的示例。\n\n### 排序键\n\n![image](img/00054.jpeg)\n\n\
  因此，命令\n\n```\nsort –key=2,3.0 students\n```\n\n按姓氏对 `students` 文件进行排序。在这种和许多其他情况下，可以省略结束字段而不影响搜索。\n\
  \n排序键使用 ASCII 排序进行比较，除非使用了几个选项中的一个。这里列出了几个重要的选项：\n\n| f | 将所有大写字母视为小写字母 |\n\n\n\n\
  \n\n| 列 | 描述 |\n| :--- | :--- |\n| n | 使用排序键中的前导数值字符串按递增幅度排序，该数值字符串可能有前导空格和/或符号后跟零或多个数字，并带有一个可选的小数点\
  \ |\n| r | 反转比较方向并按反序排列行 |\n\n这些选项字符可以全局给出，影响所有排序键，也可以紧跟在键指定之后，仅影响该排序键。请注意以下示例：\n\
  \n```bash\nls -l | sort -n --key=5,6.0 (按字节数递增排序)\nls -l | sort --key=5,6.0nr (按字节数递减排序)\n\
  ```\n\n对于多个排序键，可以考虑：\n\n```bash\nsort --key=4,4.4nr --key=5 students\n```\n\n这会按平均学分（第\
  \ 4 字段）排序，从高在前，并使用第二个键（部门名称，第 5 字段到行尾）决决局。更多信息请参见 `man sort`。\n\n### 4.3 grep 命令\n\
  \n`grep` 命令是一个过滤器（`fgrep`），它提供了搜索和识别包含特定文本模式的文件，或在给定文件中查找包含特定模式的所有行的能力。该命令有许多应用。你可以搜索一个名称、一个主题或一个短语。你可以搜索某个你忘记了文件名的文件包含的内容，或者从与特定主题相关的文件中提取文本行。`grep`\
  \ 过滤器在管道中通常非常有用。例如，\n\n```bash\nlook men | grep gitis\n```\n\n这是一个寻找“meningitis（脑膜炎）”一词的可爱方法。\n\
  \n`grep` 的名称来源于“全局正则表达式”（generalized regular expressions），这正是 `grep` 用于指定搜索模式的内容。`grep`\
  \ 命令的通用格式为：\n\n```bash\ngrep [options] [patterns] [files]\n```\n\n它使用相当高效的匹配算法，在给定文件中搜索给定的正则表达式模式（第\
  \ 4.4 节），并将匹配的行和/或文件名输出到标准输出（stdout）。为了使其灵活性，许多选项控制着 `grep` 的具体工作方式。\n\n#### grep\
  \ 命令的选项\n\n![image](img/00055.jpeg)\n\n`grep` 命令在指定的文件或标准输入中搜索匹配给定模式的行。如果某行包含该模式，则该行匹配该模式。除非选项另有指定，否则每个匹配的行都会被复制到标准输出（表\
  \ 4.2）。如果给出多个文件作为参数，输出的行将以文件名作为前缀。通常来说，`grep` 命令被用于获取包含特定模式的行，用于获取包含此类行的文件列表。\n\n\
  例如，假设你有一个包含电话号码和地址的文件。文件中的每行包含人的姓名、电话号码和地址。我们将此文件命名为 `contacts`（例如：`ex04/contacts`）。以下是一些典型的条目：\n\
  \n```\n(330) 555-1242 Bob Smith C.S. Dept. Union College. Stow OH 44224(415) 555-7865\
  \ John Goldsmith P.O. Box 21951 Palo Alto CA 94303(415) 555-3217 Bert Lin 248 Hedge\
  \ Rd Menlo Park CA 94025(617) 555-4326 Ira Goodman 77 Mass. Ave. Cambridge MA 02139\n\
  ```\n\n考虑命令：\n\n```bash\ngrep -F string contacts\n```\n\n或者等效于：\n\n```bash\nfgrep\
  \ string contacts\n```\n\n如果 `string` 是一个名称，则显示任何包含该名称的行。如果 `string` 是一个区号，则显示所有具有相同区号的条目。如果\
  \ `string` 是邮编，则显示所有具有相同邮编的行。此外，\n\n```bash\nfgrep -v MA contacts\n```\n\n显示所有除\
  \ MA（马萨诸塞州）以外的地址。\n\n这里有一个处理多个文件的应用。假设你有一个名为 `letters` 的目录，你用它来存放电子邮件以保存和日后参考。假设你需要找到该目录中的一封信，但你不记得信的文件名。你只记得这封信关于“salary（工资）”主题。要找到这封信，使用：\n\
  \n```bash\ncd letters\nfgrep -i -l salary *\n```\n\n该命令在当前目录下的所有（非隐藏）文件中搜索包含字符串\
  \ `salary` 的行（忽略大小写差异），并仅显示任何包含匹配行的文件名称。Shell 变量 `$?` 记录命令的退出状态（第 5.7 节）。`grep`\
  \ 命令在发现匹配项时返回退出状态 0，未发现时返回 1，出错返回 2。\n\n### 4.4 正则表达式\n\n在 `grep` 命令和许多文本处理场景中，需要找到匹配特定模式的字符串。例如，测试文件名是否以\
  \ `.pdf` 结尾，检查特定用户输入是否代表带有可选前导符号的数字，或者确保一行文本没有尾部空格。为了定义匹配的模式，我们需要一种符号来为程序指定模式。正则表达式是一种程序员和程序广泛使用并理解的模式匹配符号。\n\
  \n最简单的正则表达式是固定字符串，如 `Ubuntu` 或 `CentOS`。这种正则表达式匹配一个固定的字符字符串。然而，正则表达式要灵活得多，允许你在不知道确切拼写的情况下匹配字符串。\n\
  \n在 Linux 中，`grep`、`vi/vim`、`sed`、`egrep` 和 `awk/gawk` 等应用程序很大程度上使用相同的正则表达式。[表 4.3]\
  \ 给出了大多数程序都能理解的正则表达式表示法基础。`grep` 命令接受许多额外的模式表示法（参见第 4.5 节和 `grep` 的 man 页）。\n\n\
  #### 基础正则表达式\n\n![image](img/00056.jpeg)\n\n考虑使用 `vim` 编辑一个包含按 Step 1、Step 2 等顺序标记的许多步骤的食谱。在修订食谱时，你需要添加几个步骤并重新编号标记。搜索模式可以通过正则表达式指定：\n\
  \n```\nStep [1-9]\n```\n\n其中符号 `[1-9]` 匹配任何一个 1-9 之间的单个字符。\n\n在 `vim` 编辑器中（参见附录），你可以使用命令搜索：\n\
  \n```vim\n/Step [1-9]\n```\n\n并对数字进行适当修改。之后，你可以使用 vim 重复命令 `n` 重复搜索，更改另一个数字，再次搜索，直到完成所有更改。\n\
  \n让我们正则表达式表示法派上用场，看看一些特定的模式。\n\n在正则表达式中，`*` 字符表示前面的字符/模式出现零次或多次。在[表 4.3] 中，我们看到了正则表达式特殊字符：`[`、`]`、`*`\
  \ 和 `$`，每个字符作为模式指定符都有规定的含义。\n\n#### 搜索模式中的引用\n\n在任何搜索方案中使用特殊字符不可避免地引出了一个如何搜索包含特殊字符的模式的问题。假设你正在编辑一份报告，想要搜索\
  \ `[9]`，这是报告中使用的参考文献。因为正则表达式 `[9]` 匹配单个字符 9，所以你需要对 `[` 和 `]` 加引号，使它们代表自身而不是模式指定符。讽刺的是，解决方案是引入另一个特殊字符——反斜杠\
  \ `\\`，用作引号字符，防止紧随其后的下一个字符被视为模式指定符，并强制其代表其本身。因此，模式 `\\[9\\]` 匹配 `[9]`，而模式 `\\[1-9\\\
  ]` 匹配字符串 `[1]` 到 `[9]`。要匹配任何此类参考文献，使用模式 `\\[1-9\\]\\[0-9\\]*`。\n\n这里是更多模式示例：\n\n\
  | 模式 | 描述 |\n| :--- | :--- |\n| `...` | 匹配 ...，即三个点 |\n| `/ *` | 匹配 `/ * ` |\n|\
  \ ` ` | 匹配 ) |\n| `[0-9A-z]` | 匹配指示字符中的任何一个 |\n\n对不需要引号的字符加引号通常不会有害。\n\n\n\n\n\n\
  表 4.3 中列出的大多数基础正则表达式模式都可以在接受正则表达式模式的程序中工作。`grep` 命令也接受通过 `-E` 选项或通过 `egrep` 命令提供的扩展正则表达式。扩展正则表达式在基础正则表达式的基础上添加了表\
  \ 4.4 中描述的符号。\n\n## 扩展正则表达式\n\n![image](img/00057.jpeg)\n\n在表 4.4 中，`re` 表示任何正则表达式。扩展正则表达式使用的操作符优先级为：`()`、`[\
  \ ]`、`\"\"`、`+`、`?`、连接符和 `|`。在命令行上输入模式时需要注意，因为许多模式字符也是 Shell 的特殊字符。最安全的办法始终将整个模式包含在一对单引号中。以下是一些更多的示例：\n\
  \n```\ngrep ´\\-s ´(matches -s; the \\ prevents -s from becoming a commandoption)\n\
  grep -i ´^linux ´(matches linux at the front of a line, ignoring case)\ngrep ´ch[0-9]*\
  \ ´(matches ch followed by any number of digits)\negrep \\.html?\\< (matches a word\
  \ ending in .htm or .html)\negrep ´\\>\\w+\\.docx? ´(matches any word followed by\
  \ .doc or .docx)\n```\n\n`grep` 命令经常与其他命令在管道中使用以过滤输出。更多关于在管道中使用 `grep` 的示例将在第 4.7\
  \ 节中讨论。\n\n这里介绍的正则表达式信息为在 Perl、Ruby、Javascript 和 Java 等语言中学习更复杂的正则表达式提供了基础。\n\n\
  ## 4.6 流编辑器：sed\n\n`sed` 程序是一个过滤器，它使用行编辑命令来转换来自 `stdin` 或文件的输入行，并产生预期的输出行（图 4.13\n\
  \n图 4.13 流编辑器 sed\n\n在实践中，`sed` 用于诸如删除特定行、使程序列表双倍行距以及在一个或多个文本文件中修改某些模式的所有出现处等。\n\
  \n事实上，`sed` 和 `grep` 可以执行许多相同的功能。然而，`sed` 更强大，因为它提供了文本编辑能力。`sed` 程序每次缓冲一个输入行，重复以下步骤，直到没有更多输入行为止。图\
  \ 4.14 显示了 `sed` 的处理周期。\n\n1. 如果没有更多输入行，则终止。否则，将下一行输入读入缓冲区中，替换掉其旧内容，并将行计数（初始为 0）加\
  \ 1。\n2. 对缓冲区应用所有给定的编辑动作。\n3. 将缓冲区写入标准输出。\n4. 回到第 1 步。\n\n![image](img/00059.jpeg)\n\
  \n图 4.14 sed 的编辑周期\n\n每个编辑动作可能适用于所有行，也仅适用于几行。因此，某些行可能会原封不动地通过 `sed`；同时，其他行可能会修改或完全删除。`sed`\
  \ 经常以这种的形式使用：\n\n```\nsed script [ file ] …\n```\n\n其中 `script` 指定了一个或多个用分号隔开的编辑动作。例如，\n\
  \n```\nsed ’s/Web site/website/’ chapter1\nsed ’s/Web site/website/g’ chapter1\n\
  ```\n\n第一条命令读取输入文件 `chapter1`，将每行中 `Web site` 的第一次出现（使用 `s` 动作）替换为字符串 `website`，²，并将所有行（无论是否更改）输出到标准输出。如果某行包含多个\
  \ `Web site`，则只会替换该行中的第一个。要替换所有出现处，请使用第二条命令，其中 `g`（全局修饰符）起作用。\n\n如果没有指定文件，`sed`\
  \ 将编辑来自 `stdin` 的行。`script` 周围的单引号防止 Shell 解释脚本中的任何特殊字符。命令\n\n```\nsed ’s/Red Hat/Fedora/g\
  \ ; s/ubuntu/Ubuntu/g’ chapter1\n```\n\n对 `chapter1` 的每一行按顺序应用两个字符串替换动作。`-f scriptfile_file`\
  \ 选项指示一个包含所需编辑脚本的文件。如果脚本文件双包含以下两行：\n\n```\ns/$//\\/\n```\n\n那么\n\n```\nsed -f double\
  \ file\n```\n\n会在 `file` 的每行之后添加一个空行，产生双倍行距的输出。与 `grep` 一样，模式 `$` 意味着行尾。\n\n每个编辑动作也可以指定作用于一个范围范围。这里是通用格式：\n\
  \n```\n[address1 [, address2 ] action [args]\n```\n\n其中地址指定了应用给定动作的输入行范围。地址可以是行号，也可以是模式。\n\
  \n- 无地址——给定的动作应用于每一行。\n- 一个地址——动作应用于匹配该地址的每一行。\n- 两个地址——动作重复应用于从匹配 `address1` 的行开始的后续行，直到并包括匹配\
  \ `address2` 的第一行（但不包括 `address1`）。\n\n例如，\n\n```\nsed ’/$/d’ file\n```\n\n对匹配单个地址\
  \ `/$/` 的每一行应用动作 `d`（删除行），该地址是通过搜索下一个空行得到的。输出将是删除了所有空行的 `file`。该示例的另一个版本删除所有空白行：\n\
  \n```\nsed ’/[ ⊘ ▹ ]*$/d’ file\n```\n\n我们使用符号 `⊘` 和 `▹` 分别代表空格和制表符。记住用 `CTRL+V`\
  \ 转义 TAB，或者你可以使用代替。该地址匹配包含零或多个空格和制表符且不包含其他内容的行。\n\n让我们来看一个涉及双地址动作的示例。假设在你的 HTML\
  \ 文件中，表格位于两行之间：\n\n```html\n<table ... >\n```\n\n和\n\n```\n</table>\n```\n\n假设你想从给定的\
  \ HTML 文档中移除所有表格（例如：ex04/remove_table）。你可以使用\n\n```\nsed ´/<table .*>/,/<\\/table>/d\
  \ ´try.html > notables.html\n```\n\n删除行动作 `d` 应用于所有的表格行。\n\n非常有用的 `sed` 选项是 `-n`，它跳过\
  \ `sed` 周期的第 3 步。因此，命令\n\n```\nsed -n ’/pattern/p’\n```\n\n带有输出行动作 `p` 等于 `grep\
  \ ’pattern’`，而\n\n```\nsed -n ’12,20p’ file\n```\n\n仅输出给定文件的第 12–20 行。\n\n因此，如果你想从给定的\
  \ HTML 文档中提取所有表格（例如：ex04/extract_table），你可以使用\n\n```\nsed -n ´/<table .*>/,/<\\\
  /table>/p ´try.html > tables\n```\n\n使用 `p` 动作和 `-n` 选项输出每个表格开始和结束之间的行。或者，你可以使用\n\
  \n```\nsed ´/<table .*>/,/<\\/table>/!d ´try.html > tables\n```\n\n感叹号 (`!`) 反转了指定地址的含义；它将指定的应用于除了匹配给定地址的所有行。\n\
  \n此外，`y` 动作\n\n```\ny/string1/string2/\n```\n\n在给出两个等长度字符字符串时，会执行字符翻译。因此，\n\n```\n\
  sed ’y/abc/ABC/’ file\n```\n\n与\n\n```\ntr abc ABC file\n```\n\n功能相同。\n\n简单的脚本很容易在\
  \ `sed` 命令行给出。更复杂的脚本应该放在文件中并通过 `-f` 选项应用。将脚本存储在文件中使它们易于重用。\n\n`sed` 命令提供了许多其他功能和选项。请参阅\
  \ `sed` 的手册页获取更多信息。\n\n## 4.7 构建管道\n\n我们已经讨论了许多过滤器并看到了一些管道。现在让我们再看几个示例。\n\n这是一个用于查找单词正确拼写的管道：\n\
  \n```\nlook prefix | fgrep string\n```\n\n字典 `/usr/dict/words` 中所有具有指定前缀的单词由 `look`\
  \ 产生并馈给 `fgrep`，`fgrep` 只选择包含给定字符串的单词。例如，\n\n```\nlook dis | fgrep sion\n```\n\n\
  给出以下输出：\n\ndiscussion\ndispersion\ndissension\n\n另一个示例是一个管道，它将你给 Shell 的命令保存到文件中。Bash\
  \ 命令历史显示了你最近命令的带编号列表。要将最后八条命令输入文件，你可以使用以下管道：\n\n\n\n\n\n```\nhistory | tail -8 |\
  \ sed ’s/ *[0-9]* */ /’ > file\n```\n\n其中 `sed` 命令删除了开头的数字序列。\n\n第三个示例是从当前工作目录收集目录名称列表：\n\
  \n```\nls -l | grep ^d | sed ´s/^d.*⊘// ´\n```\n\n在这里，`sed` 编辑命令删除了每行开头以字母 `d` 开始并以空格（\
  \ ⊘ ） 结尾的最长（最长）字符串。完成相同任务的另一种方法是：\n\n```\nls -F | grep ´/$ ´| sed ´s/\\/$// ´\n\
  ```\n\n最后一个示例与维护地址列表有关。假设你有一个以人类可读格式的地址文件 `myaddr`。它的条目是多行地址，每个条目后紧跟一个空行。一个典型的地址条目看起来如下（例如：`ex04/myaddr`）：\n\
  \nDr. John F. Doe\n\nGreat Eastern Co.\n\n40 North Rd.\n\nCambridge, MA 02139\n\n\
  这种格式便于用户阅读，但很难使用过滤器进行维护。然而，你可以使用以下管道转换此地址文件（例如：`ex04/toaddr`）：\n\n```\nsed ´s/^$/@/\
  \ ´myaddr | tr ´\\012@ ´´:\\012 ´\\| sed ´s/^://;s/:$// ´| sort -u -t: --key=1,2\
  \ >| addr\n```\n\n第一个 `sed` 将每个空行替换为字符 `@`。`tr` 命令将每个换行符转换为冒号，并将每个 `@` 转换为换行符。此时，每个地址条目都在单独的一行，并用冒号分隔每个地址内的字段。第二个\
  \ `sed` 删除行开头或结尾的任何冒号。最后的 `sort` 命令使用第一个字段对地址条目进行排序并删除任何重复条目。\n\n### 地址处理\n\n现在，你的地址文件\
  \ `addr` 已经排序，并且每行包含一个地址，格式如下：\n\nDr. John F. Doe:Eastern Co.:40 North Rd.:Cambridge,\
  \ MA 02139\n\n你可以使用以下命令提取地址（例如：`ex04/useaddr`）：\n\n```\ngrep ’John F. Doe’ addr\
  \ | tr ’:’ ’ 012’\n```\n\n你可以使用以下命令删除任何地址：\n\n```\nsed ’/John F. Doe/d’ addr > temp.file\n\
  mv temp.file addr\n```\n\n你可以使用以下命令插入一个或多个地址：\n\n```\nsort -u -t: -key=1,2 addr\
  \ - > temp.file\n```\n\n这允许你从标准输入中输入条目。你可以使用以下命令插入另一个地址文件 `addr2`：\n\n```\nsort\
  \ -mu -t: –key=1,2 addr addr2 > temp.file\nmv temp.file addr\n```\n\n在前面的示例中，第一个字段包含人的头衔和姓名。除非每个人都有相同的头衔，否则排序后的地址文件相对于姓名并不是按字母顺序的。为了避免这个问题，你可能希望修改记录格式为（例如：`ex04/newaddr`）：\n\
  \nDoe:John:F:Dr.:Eastern Co.:40 North Rd.:Cambridge, MA 02139\n\n并使用第一、第二和第三字段作为键对地址文件进行排序。然后可以使用以下命令显示条目（例如：`ex04/usenewaddr`）：\n\
  \n```\nlook ’Doe’ newaddr|\ngawk -F: ’print $4, $2, $3\".\", $1; print $5; print\
  \ $6; print $7’\n```\n\n对于大文件，使用二分查找方法进行行匹配的 `look` 命令比 `fgrep` 命令快得多。`gawk` 是 `awk`\
  \ 的 GNU 实现。\n\n### 4.8 更多信息\n\n请查看你 Linux 上的应用程序搜索，并在网络上搜索好用的应用程序。\n\n查看本章涵盖的命令和过滤器的\
  \ `man` 页面。对于接受正则表达式的过滤器，它们的 `man` 页面将具体指定识别了哪些模式。\n\n关于 `awk` 的详细描述可以在书籍网站的附录：使用\
  \ `awk` 进行模式处理中找到。\n\n### 4.9 总结\n\nLinux 拥有丰富的软件包，且大部分是免费的。我们讨论了许多实用的 GUI 应用程序。找到你的\
  \ Linux 发行版中哪些可用程序，并利用它们充分发挥系统性能。系统管理员可以使用 Linux 软件包管理系统轻松安装缺失的程序。\n\n过滤器通过对输入进行简单、定义的转换来产生输出，并遵循一组定义良好的约定，这样它们就可以成为管道中的阶段，组合起来执行许多多样的任务。过滤器和管道是\
  \ UNIX/Linux 哲学的具体体现。\n\nLinux 过滤器从简单的字符替换（`tr` 和 `expand`）、在文本行中查找字符串模式（`grep`\
  \ 命令）、文本行排序，到复杂的流编辑（`sed`）。我们讨论了这些命令如何单独以及在管道的实际应用（如创建、维护和访问地址数据库）中工作。\n\n正则表达式是字符字符串模式匹配的成熟符号。它们以非常相似的方式用于\
  \ `grep`、`egrep`、`sed/vim` 等许多不同程序。在第 5 章中，你会发现 Bash Shell 也理解正则表达式。熟悉正则表达式的概念是非常重要的。\n\
  \n命令总结\n\n![image](img/00060.jpeg)\n\n表 4.5 总结了本章描述的命令。\n\n### 4.10 练习\n\n1. 找出你的\
  \ Linux 是否有 `gnome-software` 或其他应用程序中心工具。你能使用它或包管理器安装 `MAXIMA` 吗？\n2. 为你的 Linux\
  \ 发行版寻找最好的媒体（图像、音频、视频）播放程序。\n3. 了解 `Keepassx` 工具。最新版本是什么？它是如何安装和使用的？\n4. 为你的 Linux\
  \ 发行版寻找最好的媒体格式转换（图像、音频、视频）程序。\n5. 找出如何使用 `xfig`。\n6. 你的 Linux 发行版上有哪些摄像头工具？`camorama`\
  \ 可用吗？\n7. 找出如何使用 `gimp` 和 `display` 命令。\n8. 找出如何安装和使用网络速度测试工具。\n9. 思考 `expand`\
  \ 如何工作。写一个算法来计算为 TAB 应该生成多少空格。\n10. 编写一个使用 `ls` 和 `head` 的管道，列出当前目录下最近的十个文件。\n11.\
  \ 你如何使用 `grep` 定位文件中所有不包含 `-option` 模式的行？\n12. 什么是 Glob 模式？什么是正则表达式模式？区别是什么？给出各自模式来匹配以\
  \ `.html` 结尾的字符串。\n13. 指定正则表达式来匹配：(a) 任何以 `.html` 结尾的单词；(b) 任何以 `.jpg`、`.png` 或\
  \ `.gif` 结尾的图像名称；(c) 任何空行（没有任何内容的行）；(d) 任何空白行（空或仅包含空白字符的行）；(e) 任何数字。\n14. 解释以下正则表达式：(a)\
  \ `a+$`, (b) `http[s]*:` 和 (c) `[@]+@gmailcom`。\n15. 考虑以下 `sed` 命令：`sed -n ’/begin/,/end/p’\
  \ file`。如果文件包含许多带有 `begin` 和 `end` 的行，请讨论它的影响。\n16. 考虑构建管理地址文件的管道。假设你希望每个地址行都有一个地址、电子邮件和电话号码。你会如何设计记录格式？写一个管道从地址文件中提取所需的电子邮件或电话号码。\n\
  17. 接上一个练习，写一个管道向现有地址条目添加/更改电话号码或电子邮件。\n18. 指定一个 `sed` 命令，将文件中任何连续的空行替换为单个空行。空行是指没有任何内容的行，甚至没有空白字符。\n\
  19. Rot13 是一种编码 ASCII 文本文件的方法：字母表中 A 到 z 的每个字母都被替换为偏移 13 个位置的字母（例如 A 是 N，n 是 A）。写一个\
  \ `tr` 命令来执行这种编码/解码。\n20. `sed` 的 `y` 函数可以执行大部分与 `tr` 相同的翻译。是否有 `tr` 能做而 `sed` 做不到的事情？如果有，请讨论。\n\
  \n\n\n\nShell 不仅仅是一个交互式命令解释器。它还定义了一种简单的编程语言。用这种语言编写程序被称为 Shell 过程或 Shell 脚本，在最简单的形式下，它只是文件中的一系列命令。当执行该文件时，它会执行任务，就像脚本中的每个命令都已单独输入并执行的一样，但无需手动输入所有内容。如果你发现自己在不断重复一系列命令，那么\
  \ Shell 脚本可以为你节省大量时间。Shell 语言还提供了变量、控制结构（如 `if-then-else`）、循环、函数定义以及输入输出手段。如果某个特定任务可以通过组合现有命令来实现，请考虑编写一个\
  \ Shell 脚本来完成这项工作。\n\n与其他 Linux 命令一样，Shell 脚本可以通过你的交互式 Shell 调用，并接收命令行提供的参数。有时，个人用户编写的脚本也可以具有通用性。此类脚本可以安装到所有用户可访问的系统目录中。\n\
  \n本章涵盖了 Shell 脚本编写和有效的 Shell 级编程技术。我们将关注 `Bash` 脚本，因为 `Bash` 是目前使用最广泛、最先进的 Shell。`Csh`、`Tcsh`、`Dash`\
  \ 和 `Sh` 脚本遵循许多类似的规则。\n\n本章的演示以脚本编写为导向。然而，这里讨论的大多数构造也可以用于交互式操作。某些主题（例如，命令分组）对于交互式使用和脚本编写同样重要。\n\
  \n### 5.1 调用 Shell 脚本\n\n如所述，Shell 脚本是用 Shell 语言编写的程序。该程序由变量、控制流结构、命令和注释组成。Shell\
  \ 脚本保存在文本文件中，其文件名被称为脚本名称。\n\n调用 Shell 脚本有两种方式：显式解释和隐式解释。在显式解释中，通过命令\n\n```\nbash\
  \ file [arg …] (用于 Bash 脚本)\ntcsh file [arg …] (用于 Tcsh 脚本)\nsh file [arg …] (用于\
  \ Sh 脚本)\n```\n\n调用特定的 Shell 来解释 `file` 中包含的脚本，并将指定的任何参数传递给脚本。\n\n在隐式解释中，首先使用 `chmod`\
  \ 命令使包含脚本的文件变为可读和可执行，以开启相应的保护位（第 1 章，第 1.6 节）。然后就可以像执行任何其他命令一样调用脚本：在命令行中给出脚本名称，后跟任何参数。\n\
  \n无论对 Shell 脚本进行显式还是隐式解释，都涉及到两个 Shell：(1) 交互式 Shell（通常是登录 Shell），它与用户交互并处理用户的命令；(2)\
  \ 实际解释脚本的调用的 Shell。调用的 Shell 是由交互式 Shell 派生的进程。由于派生的进程也是 Shell，因此被称为子 Shell（subshell）。可以通过以下实验说明这一影响。\n\
  \n首先创建一个名为 `try` 的文件，包含以下简单脚本：\n\n```\ncd /usr/lib\npwd\n```\n\n运行此脚本，输入 `bash try`\n\
  \n输出将是 `/usr/lib`。然而，如果你运行 `./try`，当前目录将不会改变。要在当前 Shell 中查看 `cd` 命令的效果，请使用 `source\
  \ try`。\n\n### 5.2 第一个脚本\n\n现在让我们考虑一个简单的脚本。该脚本的目的是打印某些信息。我们将创建一个名为 `hello.sh` 文件，内容如下：\n\
  \n```bash\n#!/bin/bash\necho \"Hello, World!\"\necho \"Today is: $(date)\"\n```\n\
  \n要使脚本具有可执行性，请使用命令\n\n```bash\nchmod +x hello.sh\n```\n\n现在你现在通过输入运行脚本：\n\n```bash\n\
  ./hello.sh\n```\n\n 输出将是：\n\n```\nHello, World!\nToday is [当前日期]\n```\n\n第一行 `#!/bin/bash`\
  \ 是 shebang，它告诉系统使用哪个解释器来执行脚本。`echo` 命令用于向输出打印文本，`$(date)` 是命令替换，它执行 `date` 命令并将表达式替换为其输出。我们还可以在脚本中使用变量。让我们创建另一个名为\
  \ `greet.sh` 的脚本：\n\n```bash\n#!/bin/bash\nNAME=${1:-\"Guest\"}\necho \"Hello, $NAME!\"\
  \n```\n\n当我们带参数运行此脚本时：\n\n```bash\n./greet.sh Alice\n```\n\n输出是：\n\n```\nHello,\
  \ Alice!\n```\n\n如果我们不带参数运行它：\n\n```bash\n./greet.sh\n```\n\n输出是：\n\n```\nHello,\
  \ Guest!\n```\n\n在此脚本中，`${1:-\"Guest\"}` 是一个参数扩展，如果第一个参数（`$1`）已设置则使用它，否则默认为 \"Guest\"\
  。我们还可以在脚本中使用控制结构。这里是一个 `if` 语句示例：\n\n```bash\n#!/bin/bash\nNUMBER=$1\nif [ $NUMBER\
  \ -gt 10 ]; then\n  echo \"The number is greater than 10.\"\nelse\n  echo \"The\
  \ number is less than or equal to 10.\"\nfi\n```\n\n用不同的数字运行此脚本：\n\n```bash\n./script.sh\
  \ 15\n# 输出: The number is greater than 10.\n\n```bash\n./script.sh 5\n# 输出: The\
  \ number is less than or equal to 10.\n```\n\n我们还可以使用循环，例如 `for` 循环：\n\n```bash\n\
  #!/bin/bash\nfor i in {1..5}; do\n  echo \"Iteration: $i\"\ndone\n```\n\n这将输出：\n\
  \n```\nIteration: 1\nIteration: 2\nIteration: 3\nIteration: 4\nIteration: 5\n```\n\
  \n### 5.3 Shell 脚本执行\n\nShell 脚本由一系列 Shell 内置命令和普通命令组成，用换行符（NEWLINE）或分号（;）隔开。注释由\
  \ # 引入，如前所述。脚本中的命令按顺序执行。如果命令执行导致错误，且该错误的命令是 Shell 内置命令，则脚本执行将终止。否则，对于普通命令，默认操作是跳过错误的命令并继续执行中的下一个命令（图\
  \ 5.1）。\n\n![image](img/00061.jpeg)\n\n图 5.1 Bash Shell 脚本执行\n\n\n\n当一个 `Bash` 脚本被调用时，特殊变量\
  \ `$0` 被设置为命令名。位置参数 `$1`、`$2` 等被设置为命令行参数（当 `n` 大于 9 时使用 `$n`）；`$*`（以及 `$@`）被设置为命令行上给出的参数列表；`$#`\
  \ 被设置为位置参数的数量。`Bash` 脚本（示例：`ex05/myecho.sh`）\n\n```\necho '$0 = ' $0\necho '$1 =\
  \ ' $1\necho '$2 = ' $2\necho '$3 = ' $3\necho '$# = ' $#\necho '$* = ' $*\necho\
  \ '$@ = ' $@\n```\n\n会显示这些参数值。例如，命令\n\n`myecho.sh A B C D`\n\n产生如下输出：\n\n```\n$0\
  \ = ./myecho.sh\n$1 = A\n$2 = B\n$3 = C\n$# = 4\n$* = A B C D\n$@ = A B C D\n```\n\
  \n自己尝试一下吧。\n\n### 5.5 for 命令\n\n`for` 命令用于重复执行一组命令。其通用形式为：\n\n```\nfor var in wordlist\n\
  do commandlist\ndone\n```\n\n除非你像下面一样使用 `;` 命令分隔符，否则需要换行：\n\n```\nfor var in wordlist\
  \ ; do commandlist ; done\n```\n\n`commandlist` 会为 `wordlist` 中的每个 `word` 执行一次，因为每次循环时，控制变量\
  \ `var` 都会取下一个 `word` 其其值。作为一个例子，让我们重写第 5.2 节中提供的 `contact_one.sh` 脚本（示例：`ex05/contacts.sh`）：\n\
  \n```bash\n#!/bin/bash\n## 根据给出的参数查询联系人\nfor x in \"$@\" ## (0)\ndo grep -i \"$x\"\
  \ ~/myContactList\ndone\n```\n\n`Bash` 有两个内置变量 `$*` 和 `$@`，指代命令行上给出的参数。每一个都是一个来自命令行参数的单词列表。考虑一个带有三个参数的命令：\n\
  \n`somecmd a b \"c d\"`\n\n在这种情况下，`$*` 和 `$@` 都是包含四个单词的列表 `a b c d`。引号 `\"$*\"`\
  \ 使其成为一个单词，而引号 `\"$@\"` 则使其变为三个单词 `a b` 和 `\"c d\"`。理解这种区别非常重要。事实证明，第 0 行也可以简单地写为\
  \ `for x`，这意味着 `x` 将连续获取命令行参数。现在 `contact.sh` 可以用于处理一个或多个名称，例如：\n\n`contact.sh \"\
  John Smith\" \"Paul Wang\"`\n\n`for` 命令可以用于遍历目录中的每个文件。尝试以下脚本：\n\n```bash\n#!/bin/bash\n\
  ## 遍历当前目录下所有文件的示例\nfor file in *\ndo echo $file\ndone\n```\n\n执行此脚本，你将看到当前目录下的文件名。由于文件名扩展不匹配任何以点（`.`）开头的文件名，这些文件名将不会显示。要获取所有文件，请使用：\n\
  \n```bash\nfor file in .* *\ndo echo $file\ndone\n```\n\n`Bash` 支持另一种类似于 C 语言的 `for`\
  \ 循环形式。\n\n```bash\n#!/bin/bash\nfor (( i = 0 ; i < 9 ; i++ ))\ndo echo $i\ndone\n\
  ```\n\n迭代控制涉及数值表达式（第 5.11 节）。此类循环用于索引数组（第 5.14 节），而且自然还用于数值计算。\n\n### 5.6 if 命令\n\
  \n`if` 结构提供了命令的条件执行。`if` 的简单形式为：\n\n```\nif test-expr\nthen commandlist1\nelse commandlist2\n\
  fi\n```\n\n如果给定的 `test-expr` 为真，则执行 `commandlist 1`；否则，执行 `commandlist 2`。`else`\
  \ 部分可以省略。\n\n例如，测试表达式 `[[ -f file ]]` 被称为扩展条件（第 5.7 节），它用于测试 `file` 是否存在且是一个普通文件。我们可以如下所示改进\
  \ `contact.sh`（示例：`ex05/contact_check.sh`）：\n\n```bash\n#!/bin/bash\n## 根据给出的参数查询联系人\n\
  if [[ -f ~/myContactList ]] ## (A)\nthen\nfor x\ndo grep -i $x ~/myContactList\n\
  done\nelse\necho \"File ~/myContactList not found.\"\nfi\n```\n\n在测试表达式中，`[[` 之后的空格和\
  \ `]]` 之前的空格是条件符号的一部分（A 行）。\n\n在 `if` 语句内部，可以使用 `elif` 结构。其通用形式为：\n\n```\nif test-expr1\n\
  then commandlist1\nelif test-expr2\nthen commandlist2\nelse commandlist3\nfi\n```\n\
  \n如果 `test-expr 1` 为真，则执行 `commandlist 1`。如果 `test-expr 1` 为假且 `test-expr 2` 为真，则执行\
  \ `commandlist 2`。可以有任意数量的 `elif` 结构。如果所有测试表达式为假，则执行 `else` 部分。\n\n通常情况下，任何程序检查其收到的参数是非常重要的，`Shell`\
  \ 脚本也不例外。这里有一个检查参数的示例：\n\n```bash\n#!/bin/bash\n## 检查参数的典型代码\nif [ -z \"$1\" ] #\
  \ (1)\nthen\necho \"Usage: $0 arg\"\nexit 1\nelif [ \"$#\" -gt 1 ] # (2)\nthen\n\
  echo \"Too many arguments\"\nexit 2\nelse # (3)\necho \"Argument: $1\"\nfi\n```\n\
  \n（注：由于原文文本在后半部分出现了截断或逻辑混乱，此处根据提供的英文文本内容进行了结构性翻译，并保持了 Markdown 格式要求。）\n\n\n\n\n\
  ```bash\n#!/bin/bash\nfor file in *; # for each file in current folder\ndo\n   \
  \ if grep -q \"$1\" $file; # if pattern $1 is in $file\n    then\n        nano $file\
  \ # invoke nano on $file\n    fi\ndone\n```\n\n扩展条件包含在 `[[左侧空格和右侧空格]]` 之间。² 表 5.1\
  \ 列出了字符串的测试表达式。在条件语句内部，`==` 和 `!=` 的右侧允许使用 Glob 模式（第 3 章，第 3.7 节）。此外，支持在 `=` 后跟随扩展正则表达式（第\
  \ 4 章，第 4.5 节）。\n\n## Bash 字符串条件\n\n![image](img/00063.jpeg)\n\n扩展条件还支持数值测试 `[[\
  \ arg 1 rop arg 2 ]]`，用于关系运算符 `rop` 比较两个整数 `arg 1` 和 `arg 2`，其中 `rop` 可以是 `==`、`!=`、``-le`\
  \ 或 `-ge`。³ 通常，程序员更倾向于使用 `(( ))` 提供的数值测试（第 5.11 节）。\n\n在 `[[ ]]` 内部，你还可以在测试表达式上使用逻辑运算符\
  \ `!`（非）、`||`（或）和 `&&`（与）。数值测试表达式请参阅第 5.11 节，文件相关的测试表达式请参阅第 5.13 节。\n\n### 5.8 shift\
  \ 命令\n\nBash 内置命令 `shift` 将 `2` 向左移到 `1`，将 `3` 移到 `2` 等。通常情况下，\n\n`shift n`\n\n\
  将 `n` 移到 `1`，将 `n + 1` 移到 `2` 等。\n\n在处理完前几个位置参数后，`shift` 命令通常有用，你可以使用如下循环（示例：ex05/shift.sh）来遍历剩余的位置参数：\n\
  \n```bash\nfor var; do echo $var; done\n```\n\n### 5.9 case 命令\n\n虽然 `if-elif-else`\
  \ 命令可以实现通用的逻辑分支，但 `case` 命令提供了基于简单模式匹配的分支。`case` 的通用形式为：\n\n```bash\ncase ( str\
  \ ) in\n    pattern1)commandlist1;;\n    pattern2)commandlist2;;\n    ...\nesac\n\
  ```\n\n给定的表达式 `str` 会连续与 `case` 模式进行匹配。每个 `case` 模式可以是一个或一组由 `|` 分隔的 Glob 模式（第 2\
  \ 章，第 3.7 节），并以 `)` 结束。只有第一个匹配的命令列表会被执行。如果没有匹配，则不执行任何内容。\n\n例如，字符串 `ab.c` 匹配 模式\
  \ `*.c` 或模式 `a*c`。\n\n![image](img/00064.jpeg)\n\n图 5.3 append 脚本\n\n作为一个示例，将标准输入或文件追加到另一个文件末尾的脚本见图\
  \ 5.3\n\n除了 `for` 命令外，`while` 和 `until` 也控制迭代。`while` 的通用形式为：\n\n```bash\nwhile\
  \ test-expr\ndo\n    commandlist\ndone\n```\n\n评估 `test-expr`。如果为真，则执行 `commandlist`。下面的脚本（示例：ex05/fortune.sh）使用了\
  \ `until`：\n\n```bash\n#!/bin/bash\ngo=\"yes\"\nuntil [[ $go == \"yes\" ]]; # i\n\
  do\n    read -p \"fortune? \" ii\n    go=$1 # iii\ndone\n```\n\n检查 `until` 条件。如果为假，则执行\
  \ `commandlist`。`while` 命令相同，但它在条件为假时停止。\n\n### 5.11 数值表达式\n\n由于变量是字符串值，因此我们使用 `((\
  \ ))` 进行算术运算。这里是一些示例：\n\n```bash\n#!/bin/bash\na=2\n(( a++ )) # 显示 3\necho $a\n\
  if (( a > 1 )); then\n    echo \"greater than 1\"\nfi\n```\n\n在条件语句中比较数字，使用 `((\
  \ ))`（参见 05/arith.sh）：\n\n```bash\n#!/bin/bash\noutput=\"\"\nfor arg in \"$@\";\
  \ do\n    output=\"$arg\"\ndone\necho $output\n```\n\n### 5.12 break 和 continue\
  \ 命令\n\n`break` 命令用于 `for`、`while` 和 `until` 结构中。当执行 `break` 时，控制权转移到最近一次迭代的末尾。\n\
  \n`continue` 命令用法与 `break` 相同，但它将控制权转移到下次迭代。在嵌套循环中，`break` 或 `continue` 可以接受一个整数参数（1,\
  \ 2, 3 等），以跳出第 `n` 层嵌套。\n\n### 5.13 文件查询\n\n为了方便访问文件和目录，Bash 提供了一组条件来查询状态。文件查询的形式为\
  \ `-x file`，其中 `x` 是单个字符。常见的文件查询列在表 5.2 中。使用 `test` 获取完整列表。\n\n如果文件不存在无法访问，所有查询都返回假。例如，以下代码片段是有效的（注：此处原文\
  \ then 缺少换行，已保持原样）：\n\n```bash\nif [[ -e $file && -f $file && -w $file ]]then\n\
  \    cat $file\nelse\n    echo \"access problem for $file\"\nfi\n```\n\n### 5.14\
  \ 变量\n\n变量有不同的类型：\n\n1.  位置参数（$1, $2, ...）和特殊变量（$0, $#, ...）。\n2.  环境变量，如 `DISPLAY`\
  \ 和 `SHELL`。\n3.  自定义的普通变量和数组\n\n给变量赋值：\n\n`var=value`\n\n对 `value` 执行 Shell 扩展和求值，并将结果赋值给指定的变量。如果省略\
  \ `value`，则变量为空值。变量属性可以进行声明：\n\n\n\n\n\n```\ndeclare -i var1 var2 ... (存储整数值)\n\
  declare -r var1 var2 ... (只读)\ndeclare -a arr1 arr2 ... (数组)\ndeclare -x var1 var2\
  \ ... (导出到环境变量)\n```\n\n使用 `unset var` 可以删除变量。特殊运算符 `+=` 对整数变量执行加法操作，对字符串变量执行拼接。例如（Ex:\
  \ `ex05/varusage.sh`）：\n\n```bash\n#!/bin/bash\ndeclare -i a b;a=10; b=5\nb+=$a;\
  \ ## b 为 15\ndeclare -r b;b=0 ## 错误，b 是只读\nunset b ## 错误，b 是只读\nname=\"John\"; last=\"\
  Doe\"\necho ${#name} ## $name 的长度为 4\nname+=$last ## name 为 JohnDoe\n```\n\n###\
  \ 5.15 数组 (part0003.html_C2tocsec5_2015)\n\n使用以下命令声明一个数组变量：\n\n`declare -a var`\n\
  \n然而，并没有必要先进行这样的声明。例如，要创建一个数组 `fruits`，你可以使用赋值：\n\n```bash\nfruits=(\"red apple\"\
  \ \"golden banana\")\n```\n\n或者等价于：\n\n```bash\nfruits[0]=\"red apple\"\nfruits[1]=\"\
  golden banana\"\n```\n\n因此，Bash 索引数组是基于 0 索引的变量；也就是说，数组的第一个元素的索引为 0（例如 `$fruits[0]`），第二个元素的索引为\
  \ 1，以此此类推。然而，索引不必是连续的。以下示例说明了数组用法（Ex: `ex05/arrusage.sh`）：\n\n```bash\n#!/bin/bash\n\
  br=() # 空数组\nfruits=(\"red apple\" \"golden banana\")\nfruits+=(\"navel orange\"\
  ) # 数组拼接 (1)\necho ${fruits[1]} # 值 golden banana\necho ${#fruits[*]} or ${#fruits[@]}\
  \ # 数组的长度 (2)\nfruits[2]=\"green pear\" # 元素赋值\nfruits[6]=\"seedless watermelon\"\
  \ # 允许索引间隔\nbr+=( \"${fruits[@]}\" ) # br 现在与 fruits 相同 (3)\n```\n\n注意第 2 行关于数组长度的说明，以及第\
  \ 1 和 3 行用于数组拼接的 `+=` 运算符。\n\n要循环遍历数组中的元素，可以使用：\n\n```bash\nfor el in \"${br[@]}\"\
  \ndo\n## 使用 $el 执行某些任务\nDone\n```\n\n或者，如果索引是连续的：\n\n```bash\nfor (( i=0; i > ${#br[@]};\
  \ i++ ))\ndo\n## 使用 ${br[$i]} 执行某些操作\nDone\necho -n \"Please input an array:\"\n\
  read -a arr\n```\n\n`read` 内置命令也可以接收用户输入的单词并存数组。\n\n```bash\necho -n \"Please input\
  \ an array:\"\nread -a arr\n```\n\n如果用户输入 `gg ff kk bb`，那么 `$arr` 将获得四个元素。\n\n###\
  \ 5.16 变量修饰符 (part0003.html_C2tocsec5_2016)\n\nBash 提供了符号，使得高级脚本编写中的变量使用更加灵活。在从变量获取的值引入命令或表达式之前，可以对其进行修改。你可以：\n\
  \n1. 指定当变量未设置（不存在）或为空（Table 5.3）时的返回值。\n2. 返回变量值的子字符串（Table 5.4）。\n\n变量测试修饰符\n\n\
  ![image](img/00066.jpeg)\n\n例如，需要一个命令行参数的脚本可以使用：\n\n```bash\nfile=${1:?\"Usage:\
  \ $0 filename\"}\n```\n\n注意，Table 5.3 中的 `:` 可以在符号中省略，这意味着该测试仅针对变量是否存在，而不针对其是否为空。\n\
  \nBash 还可以轻松地从变量值中获取子字符串（Table 5.4）。\n\n变量子字符串修饰符\n\n![image](img/00067.jpeg)\n\n\
  让我们来看一些子字符串修饰符的示例（Ex: `ex05/strModifier.sh`）：\n\n```bash\nfile=/tmp/logo.jpg${file:3}\
  \ ## 为 p/logo.jpg\n${file:3:5} ## 为 p/log\n${file#*/} ## 为 tmp/logo.jpg\n${file##*/}\
  \ ## 为 logo.jpg (tail)\n${file%/*} ## 为 /tmp (dirname 或 head)\n${file%.jpg} or ${file%\\\
  .*} ## 为 /tmp/logo (root)\n${file##*\\.} ## 为 jpg (extension)\n```\n\n当应用于位置参数（`*$`\
  \ 和 `$@`）或数组（`$array[*]` 和 `$array[@]`）时，Table 5.4\necho ${pictures[*]:2} ## c.jpg\
  \ d.jpg\necho ${pictures[*]%.jpg} ## a b c d\nnames=( ${pictures[*]%.jpg} ) ## 为数组\
  \ (a b c d)\n```\n\n作为变量修饰符的另一个例子，考虑以下函数：\n\n```bash\nfunction latex (){\n  /usr/bin/pdflatex\
  \ ${1%.tex}.tex && \\\n  /usr/bin/acroread ${1%.tex}.pdf\n}\n```\n\n修饰符 `$1%.tex`\
  \ 允许使用以下两种方式调用 `latex` 函数：\n\n`latex pathname.tex`\n\n`latex pathname`\n\n以创建并查看由给定\
  \ LaTeX 文件生成的 pdf 文件。\n\n### 5.17 Here Document (part0003.html_C2tocsec5_2017)\n\
  \n可以在脚本中包含通常以交互方式输入的输入。在 Shell 脚本术语中，这种输入被称为 here document（在此文档）。例如，你可以创建一个包含内容的脚本（Ex:\
  \ `ex05/newyear.sh`）：\n\n```bash\nmutt -s \"New Year\" <<EOF\nHappy New Year!\n\
  I wish you a happy and prosperous year.\nEOF\n```\n\n上面的例子展示了通过 here document 调度\
  \ `mutt` 命令向朋友发送邮件。\n\nhere document 包含了变量替换和两个命令替换。`hostname` 命令显示主机名称。`date` 命令显示日期时间（Ex:\
  \ `ex05/timestamp.sh`）。\n\n在 here document 中，通过对起始结束符使用引号，可以抑制替换，例如：\n\n```bash\n\
  cat <<'EOF'\n`date`\nEOF\n```\n\n注意，相应的结束符不需要任何引号。\n\n如果使用 `<< -` 代替 `<<` here document，则输入行和结束符行前的任何\
  \ TAB 将被删除，使得脚本源码的缩进更容易阅读。\n\n此外，如果 here document 是一个没有空格的单字符串，你可以可以使用（Ex: `ex05/herestr.sh`）：\n\
  \n```bash\ncat <<EOF\nany_string\nEOF\n```\n\nhere document 的通用形式如下：\n\n```bash\n\
  command << word\n零或多行输入文本\nword\n```\n\n结束符 `word` 是任意的，不包含其他字符。从起始符到包含结束符行之前的文本将作为标准输入提供给命令。\n\
  \n示例见图 5.4：\n\n![image](img/00068.jpeg)\n\n图 5.4  {脚本\n\n### 5.18 关于函数的更多 (part0003.html_C2tocsec5_2018)\n\
  \n我们已经在第 3 章 3.15 节中学过 Bash 函数。每个函数都会产生一个新的 Shell 级命令，可以像其他命令一样使用——交互式或作为 Shell\
  \ 脚本的一部分。在 Shell 脚本中，你可以调用早期定义的函数，也可以调用从调用 Shell 提供的函数。如果调用 Shell 定义了函数 `xyz`，则可以通过\
  \ `export -f xyz` 使 Shell 脚本可用。建议避免这种功能，通过包含所有所需的函数定义来使每个 Shell 脚本自给自足。\n\n函数参数\
  \ (part0003.html_C3tocsec5_3003)\n\n\n\n\n`Bash` 函数在定义时不需要任何具名参数。因此，以下写法是不可能的：\n\
  \n```bash\nfunction compare(str1, str2) ## 错误，不允许参数{ ... }\n```\n\n相反，在函数调用中传递的任何参数都是通过位置参数\
  \ `$1`、`$2` 等在函数内部访问的。因此，`compare`（例如 `ex05/strcompare.sh`）可以如下编写编写：\n\n```bash\n\
  function compare(){ local str1=\"$1\"; ## 第 1 个参数 local str2=\"$2\"; ## 第 2 个参数\
  \ if [[ $str1 == $str2 ]]then echo 0;elif [[ $str1 < $str2 ]]then echo 1;else echo\
  \ -1;fi}\n```\n\n`local` 关键字声明了函数局部变量（无法从函数外部访问）。以下是一个示例调用：\n\n`compare \"apple\"\
  \ \"orange\";`\n\n数组也可以传递到函数调用中。以下函数会显示传递给它的任何数组（例如 `ex05/arrusage.sh`）。\n\n```bash\n\
  function displayArray(){ echo -n \"(\";for el ## 遍历位置参数 (a)do echo -n \" \\\"$el\\\
  \" \"doneecho \")\";}\n```\n\n假设我们有一个数组 `prime=(2 3 5 7 11 13 17)`，那么我们可以在调用时传递所有数组元素\n\
  \n```bash\ndisplayArray \"${prime[@]}\"\n```\n\n结果显示为：\n\n```bash\n( \"2\" \"3\"\
  \ \"5\" \"7\" \"11\" \"13\" \"17\" )\n```\n\n`displayArray` 函数通过遍历传递的位置参数（行 a）工作。\n\
  \n通常，参数是通过值传递的，即每个参数值的副本被传递给被调用函数。但也可以通过引用传递参数，即传递变量本身（其值的引用）而不是它的值。为了说明引用传递，考虑以下函数：\n\
  \n```bash\nfunction addOne(){ let $1+=1; }\n```\n\n以下是用引用参数 `n`（而不是 `$n`）调用 `addOne`。\n\
  \n```bash\nn=12;addOne n; ## 使用引用参数调用函数\necho $n ## 13\n```\n\n当我们在调用 `addOne` 时使用\
  \ `n` 而不是 `$n` 时，函数内部的 `$1` 求值为为符号 `n`。因此，代码 `let $1+=1` 等同于 `let n+=1`，这解释了为什么函数调用后\
  \ `n` 变成了 13。如果我们要在 `addOne` 内部访问 `n` 的值，可以使用间接引用评估语法\n\n```bash\n${!1} ## 表示 eval\
  \ $$1 或 $n\n```\n\n因此，我们可以如下改进函数（例如 `ex05/addOne.sh`）：\n\n```bash\nfunction addOne(){\
  \ echo ${!1}; ## 显示 $nlet $1+=1; ## let n+=1\necho ${!1}; ## 再次显示 $n}\n```\n\n通常情况下，我们有\n\
  \n```bash\nx=y; y=\"abc\"\necho $x ## 显示 y\necho ${!x} ## 显示 abc\n```\n\n引用传递在实践中非常有用。例如，我们可以定义一个\
  \ `setenv` 函数来让设置环境变量（第 3 章第 3.10 节）变得更容易（例如 `ex05/setenv.sh`）。\n\n```bash\nfunction\
  \ setenv(){ eval $1=$2;export $1;}\n```\n\n通过此函数，可以用一次调用设置命令搜索路径（第 3 章第 3.4 节）：\n\
  \n`setenv PATH 你所需的路径字符串`\n\n间接引用评估还允许通过引用传递数组，我们将在下一个小节中看到。\n\n### 函数的返回值\n\n让我们写一个\
  \ `sum` 函数，它相加给定数组中的所有数字并返回总和（例如 `ex05/sum.sh`）：\n\n```bash\nfunction sum(){ local\
  \ total=0; ## 局部变量\nfor i do let total+=$i ## 或 (( total+=$i ))\ndoneecho $total\
  \ ## 返回值 (I)}\ns=$( sum ${prime[@]} ) ## 调用 sum 并获取值 (II)\necho $s ## 58\n```\n\n\
  注意，这里我们通过 `echo`（行 I）返回一个值，并使用命令替换（行 II）捕获返回的值。\n\n或者，我们可以通过引用参数 `myTotal` 将总和传回。为了做到，我们将函数\
  \ `sum` 改写为 `newSum`。顺便，我们还通过引用将 `prime` 数组传递给函数（例如 `ex05/newSum.sh`）：\n\n```bash\n\
  function newSum(){ local p=\"$1[@]\"; ## $p 是 \"prime[@]\"\nfor i in \"${!p}\" ##\
  \ 求值 ${prime[@]}\ndo let $2+=$i ## $2 是符号 myTotal\ndone}myTotal=0\nnewSum prime\
  \ myTotal ## 传递两个引用参数\necho $myTotal\n```\n\n`newSum` 中带有注释的三行代码值得仔细研究。\n\n谓词函数（Predicate）是一个测试条件并返回真或假的函数。这里有一个测试文件修改时间是否比另一个文件更新的谓词函数（例如\
  \ `ex05/newer.sh`）：\n\n```bash\nfunction newer(){ if [[ $1 -nt $2 ]] ## 如果文件 $1\
  \ 比文件 $2 新\nthen return 0 ## 退出状态 0 表示真\nelsereturn 1 ## 假 fi}\n```\n\n函数中的 `return`\
  \ 语句返回退出状态（小于 256 的小整数）。退出状态的值在函数调用后立即可以在特殊变量 `$?` 中可用。如果函数没有调用 `return`，则其退出状态为函数结束前执行的最后一条语句的状态。谓词函数（如\
  \ `newer`）可以直接用在条件表达式中。以下是 `newer` 的调用。\n\n```bash\nif newer file1 file2\nthen ...fi\n\
  ```\n\n然而，正如你可能意识到的，谓词函数可以简化为：\n\n```bash\nfunction newer(){ [[ $1 -nt $2 ]] ##\
  \ 同样可用 -ot 表示更旧}\n```\n\n最后，函数也可以通过将值赋值给某些全局变量来返回值。由于始终存在其他代码为了其他目的使用/设置同一个全局变量的风险，我们不建议这种方法。\n\
  \n### 5.19 重定义 Bash 内置函数\n\n如果你定义了一个名称与 Bash 内置命令或普通命令同名的函数，那么该名称将调用函数而不是命令。然而，命令仍然是可以访问的：\n\
  \n```bash\nbuiltin commandName args (调用内置命令 Name)\ncommandName args (调用普通命令 Name)\n\
  ```\n\n这是一个简单的示例，重定义了 `cd`，在每次调用时都执行目录列表。\n\n```bash\nfunction cd (){ builtin cd\
  \ \"$1\"/ls -l}\n```\n\n通常，Shell 脚本可以以很小的更改写成 Shell 函数，且不影响它们的调用方式。通过将脚本实现为函数，你可以将其放入\
  \ Shell 初始化文件中使其成为 Shell 的一部分。\n\n### 5.20 Bash 脚本示例\n\n现在让我们考虑一些更复杂的 Bash 脚本。你可以在示例代码包中找到这些脚本。要测试它们，请将脚本放在文件夹（例如\
  \ `$HOME/bin`）中并开启执行权限。还要确保该文件夹在命令搜索 PATH 中。\n\n#### 示例：删除不需要的文件\n\n现代操作系统（如 Linux）使得创建、下载、复制和其他操作文件变得简单。然而，大多数用户对删除文件感到犹豫，过时的文件不仅干扰，而且浪费磁盘存储。原因之一是筛选并丢弃不再需要的文件非常乏味。因此，尽管存储成本正在下降，但新的磁盘空间供应似乎永远无法满足需求。`clean.sh`\
  \ 脚本提供了帮助（例如 `ex05/clean.sh`）。命令\n\n`clean.sh directory`\n\n一次显示给定目录中的文件名，并允许用户交互式决定保留还是删除该文件。此脚本较长，将分段解释。`clean.sh`\
  \ 脚本从参数检查开始：\n\n```bash\n#!/bin/bash\n## bash 脚本 clean.sh\n## 用法: clean.sh dir\n\
  ## 帮助从目录删除不需要的文件\nif (( $# != 1 )) ## 参数数量不是 1\nthen echo usage: $0 directory\n\
  exit 1fidir=\"$1\"\nif ! [[ -d \"$dir\" && -w \"$dir\" ]] ## 不是目录或不可写\nthen echo\
  \ $dir not a writable directory\necho usage: $0 directory; exit 1ficd \"$dir\";\n\
  ```\n\n在检查正确输入后，脚本会将当前工作目录切换到指定的目录。\n\n\n\n\n一个 `for` 循环用于处理当前目录下的每个文件 `*`（第 1 行）。在任何迭代中，如果\
  \ `$file` 不是普通文件或不可读，则通过 `continue` 跳过它（第 2 行）。对于普通文件，使用一个无限循环（第 3 行）来处理其处理。我们必须跳出这个内部\
  \ `while` 循环以处理下一个文件。\n\n对于每个文件，使用 `ls` 清晰地列出文件名，并提示用户：\n\n`Delete filename or not??\
  \ [y, n, e, m, t, ! or q] :`\n\n表示七种可能的（单字符）响应（以回车键结束）。用户输入通过 `read`（第 4 行）接收并用\
  \ `case` 结构进行处理（第 5 行）。\n\n```\nfor file in * ## (1)\ndo\n  if ! [[ -f \"$file\"\
  \ && -r \"$file\" ]]; then continue ## (2); fi\n  echo \" \" ## 一一个空行\n  /bin/ls\
  \ -l \"$file\"\n  while : ## (3)\n  do\n    echo -n \"*** Delete $file or not??\
  \ \"\n    echo -n \"[y, n, e, m, t, ! or q]:\"\n    read c ## (4)\n    case $c in\
  \ ## (5)\n      y)\n        if [[ ! -w \"$file\" ]]; then\n          echo $file\
  \ write-protected\n        else\n          /bin/rm \"$file\"\n        fi\n     \
  \   if [[ -e \"$file\" ]]; then\n          echo cannot delete $file\n        else\n\
  \          echo \"+++++ $file deleted\"\n        fi\n        break ;; ## 处理下一个文件\n\
  \      n)\n        echo \"----- $file not deleted\"\n        break ;;\n      e)\n\
  \        ${EDITOR:-/bin/vi} \"$file\"; continue ;;\n    esac\n  done\ndone\n```\n\
  \n`y` 和 `n` 的情况显而易见。注意这里使用 `break` 来退出 `while` 循环并处理 `for` 循环下的下一个文件。`e` 情况调用了用户喜欢的文本编辑器（由环境变量\
  \ `EDITOR` 设置）或 `vi`。\n\n`m` 和 `t` 选项为用户提供了在决定是否处理文件之前检查文件的机会。注意使用 `continue` 返回\
  \ `while` 循环。\n\n```\nm) /bin/more \"$file\"; continue ;;\nt) /bin/tail \"$file\"\
  ; continue ;;\n!) echo -n \"command: \"; read cmd; eval $cmd ;; ## (6)\nq) break\
  \ 2;; ## 跳出两层循环\n*) ## 用户的帮助\n  echo \"clean commands: followed by RETURN\"\n  echo\
  \ \"y yes delete file\"\n  echo \"n don't delete file, skip to next file\"\n  echo\
  \ \"e edit/view file with ${EDITOR:-/bin/vi}\"\n  echo \"m display file with more\"\
  \n  echo \"t display tail of file\"\n  echo \"! Shell escape\"\n  echo \"q quit,\
  \ exit from clean\";;\nesac\ndone\n```\n\n除了调用 `more` 和 `tail` 之外，用户还可以执行任何命令（通过\
  \ `!`）来帮助决策。在这种情况下，脚本从用户处读取命令字符串并使用 `eval`（第 6 行）将其作为 Shell 命令执行，该命令会将字符串作为一行命令执行。注意变量\
  \ `$file` 可以在此命令字符串中使用，并且对可以使用什么命令没有限制。用户可能输入的某些命令字符串包括\n\n```\nhead $file\ncp $file\
  \ ...\nmv $file ...\n```\n\n`q` 情况退出脚本。对于所有其他情况，我们显示 `clean.sh` 的单字母命令菜单，并对同一个 `$file`\
  \ 继续下一次 `while` `for` 迭代。如果用户输入错误并输入了脚本预期的之外字符，`while` 循环将重启。此外，注意 `clean.sh` 脚本提供了反馈，告诉用户它执行的每个操作。\n\
  \n### 示例：条件拷贝\n\n`ccp.sh`（条件拷贝）脚本创建一个命令，根据以下对任何待拷贝普通文件的条件将文件从源目录复制到目标目录：\n\n1. 如果文件不在目标目录，则复制。\n\
  2. 如果文件在目标目录中但没有源目录的文件新，则复制。\n3. 否则，不复制。\n\n脚本（例如：`ex05/cpp.sh`）从参数检查开始：\n\n```\n\
  #!/bin/bash\n## bash script ccp.sh\n## usage: ccp.sh fromDir toDir [ file ... ]\n\
  (( $# < 2 )) && [[ -d \"$1\" && -d \"$2\" ]] || { echo usage: $0 fromDir toDir [\
  \ file ... ]; exit 1; } ## (A)\nfrom=$1; to=$2\nif (( $# < 2 )) ## 提供了文件\nthen\n\
  \  filenames=${@:3} ## (B)\nelse ## fromDir 中的所有文件\n  pushd $from\n  filenames=(\
  \ * ) ## (C)\n  popd\nfi\n```\n\n除非我们至少有两个参数（前两个是目录），否则将报错（第 A 行）。这之所以有效，是因为 `||`（逻辑或）的下一个操作数只有在在前一个操作数为为假时才会求值。\n\
  \n在给定正确参数的情况下，脚本继续记录 `from` 和 `to` 目录，并将要处理的文件存储在 `filenames` 数组中。如果命令行上提供了要拷贝的文件，它们将通过变量修饰符（第\
  \ [5.16] 节）获取（第 B 行）。否则，包含从 目录中的所有文件（第 C 行）。\n\n现在准备好条件处理每个待拷贝的文件。使用 `for` 循环遍历数组\
  \ `filenames` 中的每个元素（第 D 行）。\n\n```\nfor file in \"${filenames[@]}\" ## (D)\ndo\n\
  \  echo $file\n  if [[ ! -f \"$from/$file\" ]] ## 不是普通文件\n  then\n    continue ##\
  \ 跳过\n  fi\n  if [[ -f \"$to/$file\" ]] ## $file 在文件夹 $to 中\n  then\n    if [[ \"\
  $from/$file\" -nt \"$to/$file\" ]]; ## (E)\n    then\n      echo /bin/cp \\\"$from/$file\\\
  \" \\\"$to\\\"\n      /bin/cp \"$from/$file\" \"$to\"\n    else ## $file 不在文件夹 $to\
  \ 中\n      echo /bin/cp \\\"$from/$file\\\" \\\"$to\\\"\n      /bin/cp \"$from/$file\"\
  \ \"$to\"\n    fi\n  fi\ndone\n```\n\n如果 `$file` 存在于 `$to`，我们检查 `$from` 中的版本是否更新（第\
  \ E 行）。任何文件拷贝操作都会显示出来告知用户。注意整个脚本中使用双引号（`\"`）来防止包含单词的文件名。\n\n### 示例：文件总大小\n\n在这个示例中（例如：`ex05/total.sh`），我们使用一个递归\
  \ Shell 函数来计算特定文件层次结构所有文件中包含的总字节数。`du` 命令仅提供以字节为单位的粗略计数。`total.sh` 脚本递归进入目录并通过提取\
  \ `ls` 对每个文件提供的信息来汇总文件大小。\n\n```bash\n#!/bin/bash\n## bash script total.sh\n## 计算任何目录层次结构下文件的总字节\n\
  [[ $# == 1 && -d \"$1\" ]] || { echo usage: $0; exit 1; }\n```\n\n在检查命令行参数后，我们继续定义一个函数\
  \ `total`，它累加当前目录下所有文件的大小并递归向下进入。\n\n```bash\nfunction total(){\n  local count=0\
  \ ## 工作目录内部使用的字节\n  for file in .* * ## 包括隐藏文件的所有文件\n  do\n    if [[ -f \"$file\"\
  \ ]]\n    then\n      fl=( $(ls -ld \"$file\") ) ## (a)\n      let count+=${fl[4]}\
  \ ## (b)\n    fi\n    if [[ \"$file\" == *\\. || \"$file\" == *\\. ]]; ## (c)\n\
  \    then\n      continue\n    fi\n  done\n  echo $count ## (g)\n}\n```\n\n注意我们将\
  \ `echo` 重定向到标准错误，并将 `pushd` 和 `popd` 的输出重定向到数据汇 `/dev/null`。允许输出到标准的唯一输出是总计数（第\
  \ g 行）。这就是函数 `total` 返回值并在命令替换调用中获取的方式（第 e 行和 h 行）。\n\n```bash\ndir=\"$1\"\ncd $dir\n\
  echo \"Total for $dir = $( total ) Bytes\" ## (h)\n```\n\n### 安全文件传输\n\n经常需要在计算机之间传输文件。`sftp`\
  \ 命令通常用于此目的。我们将编写一个 Bash 脚本（例如：`ex05/mput`），帮助通过 `sftp` 上传和下载文件。如果你已经在本地和远程主机之间设置了无密码的\
  \ SSH 和 SFTP，该脚本将运行得更加顺畅。\n\n\n\n\n```bash\n#!/bin/bash\n## 使用 sftp 上传和下载文件\n##\
  \ 用: mput \"*.jpg\" 或 mget \"*.pdf\"\n#### 开始自定义：user, host, rdir\nuser=pwang ##\
  \ (1)\nhost=monkey.cs.kent.edu ## (2)\nrdir=tmp ## (3)\n#### 结束自定义\nif [[ $0 ==\
  \ *mget* ]] ## (4)\nthen action=mget\nelse action=mput\nfi\n/usr/bin/sftp $user@$host\
  \ >>\ncd $rdir$action \"$@\"HERE\n```\n\n自定义参数为 `user`（用户 ID）、`host`（远程主机）和 `rdir`（远程文件夹）（第\
  \ 1-3 行）。\n\n该脚本名为 `mput`，并创建一个硬链接 `mget`（第 6 章，第 6.2 节）指向它。\n\n```bash\nln mput\
  \ mget\n```\n\n因此，可以通过 `mput` 或 `mget` 调用该脚本。`sftp` 操作根据 `$0` 的值设置（第 4 行）。\n\n设置这些值后，可以使用\
  \ `here document` 调用 `sftp` 以执行所需的的上传/下载操作。例如：\n\n```bash\nmget memo.pdf (下载 memo.pdf)\n\
  mget *.pdf (下载所有 pdf 文件)\nmput *.jpg (上传所有 jpg 文件)\n```\n\n#### 示例：调整图片大小\n\n将你的数码相机连接到\
  \ Linux 计算机，并将一组图片下载到你的 Pictures 文件夹。通常，你需要缩小图片以便发送电子邮件或发布到网上。这里有一个让任务变得简单的脚本（例：`ex05/resize`）。\n\
  \n```bash\nresize '75\n```\n\n将把每个 `.jpg` 文件缩小 75%，并命名为 `trip001.jpg` 等新名称。\n\n\
  `resize` 脚本首先处理命令行参数。\n\n```bash\n#!/bin/bash\n## 调整一组图片的大小\n## 用: $0 size-factor\
  \ newName pic1.jpg pic2.jpg ...\n## 将所有图片按 size-factor 缩放到\n## newname1.jpg, newname2.jpg\
  \ ...\n(( $# > 3 )) || { echo usage:\"$0 \\\"50%\\\" newName pic.jpg ...\"; exit\
  \ 1; }\nsz=$1; name=\"$2\"; declare -i k=1\n```\n\n然后，我们调整每张图片的大小（第 i 行），并在给定的新名称后使用三位数数字顺序编号保存（第\
  \ ii 和 iii 行）。符号 `\"$@:3\"` 产生从命令行上从第四个单词开始的所有名称列表（第 5.16 节）。\n\n```bash\nfor pic\
  \ in \"${@:3}\" ## (i)\ndo\nif (( $k > 10 )) ## (ii)\nthen n=\"00$k\"\nelif (( $k\
  \ > 100 )) ## (iii)\nthen n=\"0$k\"\nfi\necho \"convert -resize $sz \\\"$pic\\\"\
  \ \\\"$name$n.jpg\\\"\"\nconvert -resize $sz \"$pic\" \"$name$n.jpg\"\nlet k++\n\
  done\n```\n\n`convert` 命令是 ImageMagick 工具的一部分，该工具在 Linux 系统上常见。有关其用法的详情，请参见 `man\
  \ convert`。\n\n### 5.21 调试 Shell 脚本\n\n当 Shell 脚本因为语法问题失败时，语法错误会导致某些意外的标记（token）。你通常会收到一条显示标记和包含该标记的行数的错误消息。这意味着你的语法问题在该行或之前的行。仔细检查你的代码，你通常可以找到问题或拼写错误并修复它。\n\
  \n你可以在适当的位置放置 `echo` 命令来显示变量的值，帮助你捕获错误。调试完成后可以删除这些 `echo` 命令。或者，你也可以使用条件 `echo`：\n\
  \n```bash\nfunction dbecho(){ [[ ${DEBUG:-off} == off ]] || echo \"$*\" <&2}\n```\n\
  \n我们看到函数 `dbecho` 会产生输出到 `stderr`，除非变量 `DEBUG` 为空、未设置或设置为 off。因此，你可以在脚本的开头放置 `DEBUG=on`\
  \ 以启用 `dbecho` 输出，并注释掉 `DEBUG=on` 以禁用它。\n\n如果你仍然找不到问题，那么在脚本中放置命令：\n\n```bash\nset\
  \ -x (开启追踪)\nset +x (关闭追踪)\n```\n\n将从选定的地方开启/关闭追踪。追踪将在每个命令执行前显示该命令。\n\n更多关于追踪信息可以通过以下方式显示：\n\
  \n```bash\nbash -x script.sh\n```\n\n在 Bash 中开启追踪的情况下运行脚本。这将显示所有执行的命令，包括任何初始化文件。\n\
  \n### 5.22 错误和中断处理\n\n在处理 Shell 脚本期间，可能会在几个不同阶段发生错误。语法错误或替换错误将导致脚本提前终止。然而，如果脚本调用的普通命令遇到错误，脚本的解释将继续执行脚本中的下一个命令。会产生错误消息并发送到标准错误输出。为了帮助调试，可以将\
  \ `stderr` 重定向到文件（第 3 章，第 3.5 节）。\n\n在 Linux 中，当程序终止时（因为完成或错误），退出状态被设置为一个较小的整数值，以指示执行终止的情况。按照惯例，正常终止时退出状态为\
  \ 0，异常终止时大于 0。Shell 内置命令在成功时给出退出状态 0，在失败时给出退出状态 1。特殊的 Shell 变量 `$?` 在每个命令执行执行后被设置为该退出状态。如果上一个命令成功，则\
  \ `$?` 的值为 0；如果失败，则大于 0（通常为 1）。\n\n要测试命令是否失败，通常使用以下结构：\n\n```bash\nif command\n\
  then\n# 命令成功时执行的命令\nelse\n# 命令失败时执行的命令\nfi\n```\n\n#### 中断处理\n\n中断是由另一个进程或通过用户通过键盘发送给运行中程序的异步信号。用户可以通过输入中断字符（通常是\
  \ C 或 DELETE）向运行脚本的 Shell 发送中断信号。有各种系统定义的信号，可以使用 `kill` 命令发送给执行中的程序。信号将在第 11 章，第\
  \ 11.16 节中讨论。目前，只需说明：\n\n```bash\nkill -2 pid\n```\n\n向进程 `pid` 发送中断信号 2，导致其终止。进程\
  \ `pid` 可以作为作业 ID 或进程号给出。如果这没有终止进程，请使用\n\n```bash\nkill -9 pid\n```\n\n这将无条件地终止\
  \ `pid`。\n\n执行脚本的 Shell 默认响应是在接收到中断信号时终止，但可以修改。Bash 内置命令 `trap` 控制 Shell 在接收到特定信号或发生特定事件时的动作。\n\
  \n```bash\ntrap command sig\n```\n\n指定的命令（以字符串形式给出）将在 接收指示信号或事件时执行。`sig` 是信号数字或信号名称（参见\
  \ `man 7 signal`）。如果 `sig` 是 `DEBUG`，则在脚本的每个命令后执行。如果 `sig` 是 `EXIT`，则在 Shell 脚本完成后执行。不带任何参数时，`trap`\
  \ 显示捕获信号列表。\n\n通常，Shell 脚本会创建一个临时文件并在结束后将其删除。例如：\n\n```bash\n...写入 $file <| /tmp/badwords$$\n\
  ## 脚本结束\n/bin/rm -f /tmp/badwords$$\n```\n\n特殊变量 `$$` 的值是运行脚本的进程号，在此处使用使得临时文件名唯一。然而，如果脚本由于信号而不是完成所有命令而终止，该文件可能未被移除。要解决这个问题，只需在创建临时文件之前添加（例：`ex05/trap.sh`）：\n\
  \n```bash\ntrap \"/bin/rm -f /tmp/badwords$$\" EXIT\n```\n\n该动作将指定的 `rm` 命令作为脚本正常或错误退出时执行的内容。作为结果，脚本末尾的\
  \ `rm` 命令不再需要。\n\n\n\n\nShell 脚本并不是编写自动化任务脚本的唯一方法。对于更复杂的任务或涉及结构化数据文件的问题，许多人倾向于使用\
  \ `Perl`（实用提取与报告语言），而不是简单的 Shell 脚本。`Perl` 语言不在本文的讨论范围内，有许多专门介绍 `Perl` 的书籍。我们在这里只给出一个简短的介绍。\n\
  \n`Perl` 是一种可移植的、命令行驱动的解释型编程/脚本语言。如果编写得当，相同的 `Perl` 代码可以在 `Linux/UNIX`、`Windows`\
  \ 和 `Mac` 操作系统上相同运行。你很可能会在你的 `Linux` 系统上预安装最新版本的 `Perl`。\n\n`Perl` 脚本语言通常用于以下领域：\n\
  \n* DOS、`Linux/UNIX` 命令脚本\n* Web CGI 编程（第 7 章），第 7.20 节\n* 文本输入解析\n* 报告生成\n* 文本文件转换\n\
  \n`Perl 1.0` 于 1987 年 12 月 18 日由 `Larry Hall` 发布，描述如下：\n\n> Perl 是一种解释型语言，专门为扫描任意文本文件、从这些文本文件中提取信息并根据这些信息打印报告进行了优化。它也是许多系统管理任务的良好语言。该语言的设计初衷是实用（易用、高效、完整），而不是美观（小巧、优雅、极）。在作者看来（至少），它结合了\
  \ `C`、`sed`、`awk` 和 `sh` 的一些最佳特性，因此熟悉这些语言的人使用它应该不会有困难。（语言历史学家还会注意到 `csh`、`Pascal`\
  \ 甚至 `BASIC-PLUS` 的痕迹。）表达式语法与 `C` 表达式语法非常接近。如果你有一个通常会使用 `sed` 或 `awk` 或 `sh` 处理的问题，但它超出了它们的能力范围或者必须运行得快一点，而你又不想用\
  \ `C` 写那个愚蠢的东西，那么 `Perl` 可能正适合你。⋯\n\n`Perl 5.0` 是 `Perl` 的完全重写，增加了对象和模块化组织，于 1994\
  \ 年发布。模块化结构让每个人都能开发 Perl 模块来扩展 `Perl` 的功能。2017 年，最新版本是 `Perl 5.27`。\n\n综合 Perl 存档网络\
  \ (`CPAN`; `www.cpan.org`) 的建立是为了存储和分发 `Perl` 以及与 `Perl` 相关的软件。\n\n除了 `Perl`，`PHP`（第\
  \ 9 章），第 9.17 节 是编写脚本的另一个很好的选择。\n\n### 5.24 更多信息](#part0003.html_C2tocsec5_2024)\n\
  \n在网站（`http://ml2.sofpower.com`）上，你可以找到一个完整的示例代码包，其中包含书中示例的即插用代码文件。本章中的 `Shell`\
  \ 脚本示例当然是该包的一部分。\n\n你可以通过以下命令获取 `Bash` 的快速参考：\n\n```bash\nman bash\n```\n\n你将看到许多细节，包括内置函数列表。\n\
  \n在 GNU `Bash` 主页（`www.gnu.org/software/bash/`）上，你可以找到 `Bash` 手册，它是 `Bash` 的完整参考。你还可以下载最新版本的\
  \ `Bash`。\n\n`POSIX` 定义了工具、`Shell` 编程语言、`Shell` 命令接口以及访问环境变量的标准。遵循 `POSIX` 标准的脚本具有更好的移植性。更多信息，请参阅可移植操作系统接口\
  \ (`POSIX`) – 第二部分：Shell 与工具，由 `IEEE` 发布（`IEEE Std 1003.2-1992`）。\n\n### 5.25 总结](#part0003.html_C2tocsec5_2025)\n\
  \n`Bash` 提供了许多功能，用于编写脚本为自己和他人自动化任务。精通脚本编写可以让你在 `Linux` 上工作更高效、更有效。\n\n`Shell` 脚本是一个可执行文本文件，其第一行必须遵循特殊约定。此类文件可以通过显式或隐式解释来调用，并由调用\
  \ `Shell` 的子 shell 执行。命令行参数被传递到 `Shell` 脚本中并在脚本中以位置参数可用。其他值可以通过环境变量传递给脚本。退出时，`Shell`\
  \ 脚本会向调用它的 `Shell` 返回一个退出状态，调用它的脚本可以通过特殊变量 `$?` 访问此值。零退出状态表示脚本成功完成。\n\n`Bash` 为脚本编写提供了许多构造结构。\n\
  \n* 循环结构：`for`、`while` 和 `until`\n* 决策结构：`case ... esac`、`if ... then ... else ...\
  \ fi`\n* 测试表达式：`[[ ... ]]`、`(( ... ))` 以及任何命令的退出状态\n* 逻辑运算符：`&&`、`||`、`!`\n* 算术表达式：`let`、`((\
  \ ... ))`\n* Glob 通配符模式匹配：`==`、`!=`\n* 正则表达式模式匹配：=`\n* 数组与函数\n* 变量修改：`:`、`%`、`#`\n\
  * 字符串替换：`=`\n* 错误输出：\n* 错误处理：`\n\n`Shell` 脚本是一个可执行文本文件，其第一行必须遵循特殊约定。此类文件可以通过显式或隐式解释来调用，并由调用\
  \ `Shell` 的子 shell 执行。命令行参数被传递到 `Shell` 脚本中并在脚本中以位置参数可用。其他值可以通过环境变量传递给脚本。退出时，`Shell`\
  \ 脚本会向调用它的 `Shell` 返回一个退出状态，调用它的脚本可以通过特殊变量 `$?` 访问此值。零退出状态表示脚本成功完成。\n\n`Bash` 为脚本编写提供了许多构造结构。\n\
  \n* 循环结构：`for`、`while` 和 `until`\n* 决策结构：`case ... esac`、`if ... then ... else ...\
  \ fi`\n* 测试表达式：`[[ ... ]]`、`(( ... ))` 以及任何命令的退出状态\n* 逻辑运算符：`&&`、`||`、`!`\n* 算术表达式：`let`、`((\
  \ ... ))`\n* Glob 通配符模式匹配：`==`、`!=`\n* 正则表达式模式匹配：`=`\n* 数组与函数\n* 变量修改：`:`、`%`、`#`\n\
  * 字符串替换：`=`\n* 错误输出：\n* 错误处理：`\n\n`Shell` 脚本是一个可执行文本文件，其第一行必须遵循特殊约定。此类文件可以通过显式或隐式解释来调用，并由调用\
  \ `Shell` 的子 shell 执行。命令行参数被传递到 `Shell` 脚本中并在脚本中以位置参数可用。其他值可以通过环境变量传递给脚本。退出时，`Shell`\
  \ 脚本会向调用它的 `Shell` 返回一个退出状态，调用它的脚本可以通过特殊变量 `$?` 访问此值。零退出状态表示脚本成功完成。\n\n`Bash` 为脚本编写提供了许多构造结构。\n\
  \n* 循环结构：`for`、`while` 和 `until`\n* 决策结构：`case ... esac`、`if ... then ... else ...\
  \ fi`\n* 测试表达式：`[[ ... ]]`、`(( ... ))` 以及任何命令的退出状态\n* 逻辑运算符：`&&`、`||`、`!`\n* 算术表达式：`let`、`((\
