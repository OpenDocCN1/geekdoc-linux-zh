- pgno: 6
  md: '![](img/12d790664598bbf390261087fbe55bbc_6_0.png)


    # # Introduction


    This book is targeted towards a Windows® user who wants to migrate to Linux. That
    means that this book is written with the Linux novice in mind. However, although
    you may be a novice to Linux, it is assumed that you are certainly not a novice
    to Windows. This book assumes that you are an experienced Windows users, what
    many would call a Windows power user. You have probably spent some time experimenting
    with Windows, changed options in the Control Panel, changed screen resolution,
    and perhaps even added some new hardware.


    Many, if not most, Linux books are written for very technical people. In blunt
    terms, they are written for computer nerds like the author! Don''t worry, most
    technical people don''t consider the appellation nerd to be derogatory. The reason
    why so many books for Linux are so technical is that for many years Linux has
    been the exclusive purview of the tech heads. Linux has been used as the operating
    system of choice for Web servers and for computer science enthusiasts. As the
    Linux operating system moves more into the mainstream of computing, more people
    are not extremely technical want to learn about it. This necessitates books like
    this one that bring Linux to the masses.


    The purpose of this book is to take what you already know as a moderately experienced
    Windows user and apply that knowledge to Linux, thus making you a knowledgeable
    Linux user. Frequently, concepts in Linux will be related to their counterparts
    in Windows, thus helping Windows users learn Linux.


    This book makes only few assumptions about you, the reader. It assumes that you
    are an experienced Windows user who has used a computer for some time on a somewhat
    regular basis, perhaps in your office or at home. It assumes that this computer
    was most likely running some version of Microsoft Windows. It assumes that you
    have used Web browsers, e-mail, and probably some business applications such as
    a word processor or spreadsheet tool. In essence, it assumes that you are a fairly
    competent PC/Windows user. You probably use a PC and some applications at work
    or school and are a fairly savvy computer user. It does not assume that you have
    any extensive knowledge of hardware or operating systems, but you do know what
    a hard drive is and may have even added some hardware to your PC at some point.
    It does not assume that you are a system administrator or any type of computer
    professional, although some professionals may also find this book useful. Basically,
    if you are an experienced Windows user who has been curious about Linux but have
    been reluctant to take the plunge, this book is for you. The reason why you must
    be experienced with Windows to follow this book is that most topics are compared
    and contrasted with their Windows counterparts. If you are well acquainted with
    Windows, this book will be easy for you to follow, and you will quickly become
    a competent Linux user.


    To put it more simply, and directly, if you can easily get onto and navigate the
    Internet, know what RAM is, know what a folder is, understand the fundamentals
    of using a personal computer, and are pretty comfortable with your computer, you
    probably will be able to follow along with this book. The enthusiastic and experienced
    Windows power user is perfectly suited for this book.


    If you are completely unfamiliar with basic PC hardware, you may find Appendix
    D to be useful. It is designed to give a basic overview of PC hardware to novice
    PC users. If you feel that your understanding of hardware is too scant to effectively
    understand the Linux operating system, perhaps you should consider starting with
    that appendix.


    The more computer experience you have, the quicker you will absorb the material
    in this book. It must be clear that this book is aimed primarily at a computer
    user who has a fair amount of experience. Novice computer users will struggle
    with some material in this book, but they should be able to follow along with
    most of it. They will need to re-read some sections and perhaps spend more time
    practicing techniques shown. Computer professionals, network administrators, and
    programmers might find some of this material a bit remedial. Such people will
    probably be able to skim over some sections of the book and will absorb material
    quite quickly.


    Although this book is not a textbook, per se, it does have some features much
    like a textbook. Every chapter ends with a brief summary and a set of review questions.
    These are provided for two reasons. The first is as a study aid to ensure that
    you are getting the salient points of the chapter. Second, while not specifically
    intended as a textbook, this book could be used as an introductory Linux text.


    It is very important to note that, while this book uses Red Hat Linux 9.0 as an
    example, the only real difference between Linux distributions is the installation
    process and the extra software that comes with the distribution. All software
    mentioned in this book comes with Red Hat 9.0. If you are using some other version
    of Linux that does not include one or more of these applications, you can download
    that application from the Internet. The Web site for each of these applications
    is included in the appendices at the back of the book. If you are using a Linux
    distribution other than Red Hat, your installation process might be slightly different,
    but it should be very similar. The rest of the topics we discuss will be common
    to all Linux distributions.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '**Note** *The following note is so critical, that it is partially repeated
    near the end of Chapter 2. Each Linux distribution (SuSE, Red Hat, Mandrake, etc.)
    has the same core operating system and functionality. However, each distribution
    may bundle different applications with Linux. As you go through this book, you
    will be introduced to several applications that are used in Linux. If you do not
    include the appropriate packages during the installation, or if you are using
    a different Linux distribution or a different version of Red Hat, you will not
    have all of the applications installed. However, most of these applications can
    be downloaded from the Internet for free. When each application is introduced,
    the appropriate Web address is provided if one is available. Many applications
    for KDE can even be found at www.kde.org/*.


    One final note. Some computer terms are used interchangeably throughout the computer
    industry. Therefore, they are used interchangeably here. Every effort is made
    to mention this directly in the text, so as to avoid confusion. However, a few
    terms are shown here:


    **Program**—Also called an application or software. Very small programs, particularly
    those that perform some system task, are sometimes called utilities.


    **Desktop Environment**—This is the graphical user interface that you see and
    interact with. It is sometimes called simply the desktop, a graphical environment,
    or a GUI (graphical user interface).


    **Web Address**—A Web address is in the format www.chuckeasttom.com and is also
    called a URL (uniform resource locator).


    **Memory**—Your computer’s memory is also called its RAM (random access memory)


    **User**—The person using a computer, program, or Web site is often called the
    user.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# # Section I: Linux Fundamentals


    # ## Chapter List


    +   1. [Chapter 1: Making the Move from Windows to Linux](#)

    +   2. [Chapter 2: Installing Linux](#)

    +   3. [Chapter 3: Basics of the Linux Operating System](#)


    This section is designed to give you your first exposure to Linux. All of the
    basic concepts are explained in detail. No prior knowledge of operating systems
    or installations is assumed. The only assumption made is that you are a competent
    computer user with experience with Windows, the Internet, and some office applications.
    As you read through the chapters in this section, you will be shown the fundamentals
    of the Linux operating system.


    [Chapter 1](#) introduces you to the concepts underlying the Linux operating system.
    You are given a brief history of the operating system, as well as a basic introduction
    to the world of Linux. Perhaps most importantly, this chapter gives you a comparison
    between Microsoft Windows and Linux.


    [Chapter 2](#) takes you step by step through the entire process of installing
    Red Hat 9.0, the most popular Linux distribution. Each step is carefully explained,
    with pictures showing you what you will see during your install. Underlying concepts
    such as disk partitions and boot loaders are explained.


    [Chapter 3](#) introduces you to some basics of the Linux operating system. You
    will learn about shells and graphical user interfaces. You will also learn to
    do a few simple shell commands and learn how to find things on the KDE desktop.'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Chapter 1: Making the Move from Windows to Linux


    # Introduction


    If you are reading this book, then probably you are a Microsoft® Windows® user
    who is considering switching to Linux®. You may be considering this change for
    any number of factors. Perhaps your employer is starting to use Linux. Or it might
    be that you are intrigued by all the media attention Linux has received recently.
    Whatever your reasons for considering changing from Windows to Linux, it is likely
    that you are contemplating this change with a fair amount of trepidation. You
    have probably grown quite comfortable with Microsoft Windows, and regardless of
    any advantages Linux may have or how curious you may be, you probably have a lot
    of questions. Will the transition be difficult? Will you be able to do all the
    things you want to do with your computer? Will you need to be a complete computer
    geek in order to understand Linux?


    The answers to those questions, in order, are no, yes, and no. It won''t be difficult.
    You will be able to do all the things you want to do. The best part about transitioning
    to Linux is that you don''t have to be a computer wizard or a computer professional
    to be able to do so. You do need to be comfortable with computers. An experienced
    Windows user who routinely uses a computer for work or recreation will probably
    suffice. In fact, this book simply assumes that you are a relatively experienced
    computer user with some exposure to Microsoft Windows, the Internet, and some
    office applications such as word processors or spreadsheets. The reader for whom
    this book was designed is a competent and experienced computer user, one who is
    comfortable with some basic configuration tasks such as changing screen resolution,
    finding items in the Control Panel, and perhaps even adding on some hardware.
    Perhaps the best description for the target audience of this book would be a Windows
    power user. However, you don''t need to be a computer professional to use this
    book.


    One common misconception about Linux is that it is hard to understand and difficult
    to use. This simply is not true. Contrary to what you may have heard, Linux is
    no more difficult to use than Windows or Macintosh®. It just takes a little guidance,
    which this book will endeavor to provide, and some patience on your part. The
    purpose of this book is to answer your questions about Linux and ease you through
    that transition. This chapter is the beginning of your journey.


    This chapter is designed to introduce you to the world of Linux. That means that
    this chapter is a sort of smorgasbord of Linux concepts and terminology. The concepts
    you see will be introduced here briefly and expounded upon in more depth later
    in the book. The purpose of this chapter is to give you an initial overview of
    Linux. That means a few advanced topics will be touched upon in this chapter.
    If you feel that some topic in this chapter is still not completely clear to you,
    don''t worry—it will be explained in much more detail in a later chapter.


    The following pages will take you through the fundamental concepts of Linux. You
    will find out what Linux is and what it is not. You also will be introduced to
    a brief history of Linux and a few thoughts on its future. Some of the information
    in this chapter may already be familiar to you, but it is hoped that you will
    learn a few new things about Linux. This material will set the stage for subsequent
    chapters. Therefore, it is imperative that you thoroughly master the concepts
    of this chapter before proceeding with subsequent chapters.'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# What Is Linux?


    Linux is one of the hottest buzzwords in the world of computers, but beyond that,
    what is it? Simply put, Linux is an operating system. Which of course begs the
    question, “what is an operating system?” In simple terms, an operating system
    is software that runs your PC. Microsoft Windows is another operating system,
    as is the Apple OS X®. Of course, we are familiar with the various applications
    you run on your PC, such as word processors, graphics utilities, spreadsheets,
    and even games. An operating system is like these other applications, except that
    rather than create a document or play a game, it actually runs your PC. When you
    move a file, delete a file, create a directory, load software, etc., it is your
    operating system that performs all of these tasks. Without an operating system,
    your PC is really just a pile of useless circuits, worth less to you than a toaster.
    The operating system is what is running your machine. In addition to communicating
    with your printer, displaying output to your monitor, and running your CD-ROM,
    it has other functions. Your operating system provides a context within which
    your applications run. For example, your favorite word processor must run within
    the context of your computer’s operating system. When you print, your word processor
    talks to the operating system, which in turn handles the printing. The operating
    system is, essentially, the soul of your computer.


    There are other operating systems available for you to use. You are probably familiar
    with Microsoft Windows (Windows 98, 2000, or XP). Windows is a very popular operating
    system for home users and small businesses. In fact, in its various versions,
    Windows is the predominant desktop operating system. It is hard to find a modern
    office without computers running Windows. Most home users have a Windows PC. This
    is obvious when you go to any store that sells computer software. Most commercial
    software stores carry predominantly Windows software, with only a small selection
    of titles for other operating systems. Another popular operating system is Apple
    Macintosh OS (short for operating system). As of this writing, the Macintosh OS
    is up to version 10, popularly referred to as OS X. Macintosh is easy to use and
    has been particularly popular with the graphics and computer animation industries.
    Many very high-end computer graphics companies use Apple computers. Many of the
    special effects you see in movies were probably created, or at least augmented,
    with Apple computers. Another operating system that generally is used for high-end
    servers, not for desktops, is Unix, which is known for its stability and security,
    but also for its expense.


    This brings us to Linux. Linux is a variant of Unix. In fact, many people now
    use the term nix to refer to Unix and its variants. Linux is an operating system
    that has some rather unique features. First, it is very stable and robust, being
    based on the time-honored Unix operating system (more on that in the next part
    of this chapter). Second, it is distributed under an open source license. Open
    source licensing is rather simple, yet elegant. Open source means that once you
    obtain a piece of software, it is yours to do with as you please. Would you like
    to make a copy or change the source code? Under open source, the source code of
    the software is open to the public, and when you purchase a product, it is yours
    to do with as you will. In case you did not realize it, this is radically different
    from Microsoft, Oracle®, Sun®, and most commercial software. For example, when
    you buy Microsoft Windows, the manufacturer’s licensing agreement that comes with
    the product places rather significant restrictions on what you can do with that
    product. Violating the license agreement can result in losing the license to that
    software and, in some extreme cases, in lawsuits. Each vendor’s licensing agreement
    stipulates what is acceptable use of its software and what is not. Most commercial
    vendors do not allow you to alter their software, nor do they allow you to have
    access to the source code for the software. Most vendors also do not allow you
    to make or distribute copies of their software after you purchase it. One example
    of software licensing restrictions is that if you purchase a computer that comes
    with Windows, you cannot later sell that copy of Windows, even if you have disposed
    of the machine. Several eBay® sellers have been shut down by Microsoft for just
    that sort of activity. Also, you most certainly do not have access to its source
    code. With open source software, you can do anything you want with the software
    once you get it, and you have complete access to the source code.


    Note


    For those readers who may not know what source code is, it is the programming
    commands that were written to create a piece of software. With commercial software,
    source code is usually carefully guarded. With open source software, it is freely
    distributed.


    Access to source code may not be particularly intriguing to many readers. You
    have to be a rather highly skilled programmer to make much use of it. However,
    if you have skilled programmers on staff, they can take the Linux source code
    and make modifications to customize the operating system for your particular needs.


    One note of caution is in order. What you can do with open source software is
    not completely unlimited. For example, you cannot put your own label on open source
    software and resell it. The open source license does not give you that right.
    If you put Red Hat® Linux and your name on a CD-ROM and then started selling copies,
    you might find yourself the target of litigation and possible criminal charges.
    The author does not claim to be an attorney and recommends that with any software,
    you read the licensing agreement carefully. Open source software has the least
    restrictive licensing of any software you can find, far less restrictive than
    commercial software. However, there are still some limitations. It is recommended
    that you look at www.opensource.org to see a wealth of information and links on
    open source software.


    One advantage of an open source operating system is that a lot of the software
    written for the operating system also is open source. This'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'means that, although the software selection for Linux in an average retail
    store might be slim, the selection of freely downloadable software on the Internet
    is vast.


    You will also find that the Linux community is rather supportive of itself. You
    will find several links in the appendices of this book, and it is even possible
    that you might find a Linux users group in your area, especially if you live in
    a major metropolitan area. These people can be quite helpful to the Linux novice.'
  merge: -1
