- pgno: 402
  md: '# Chapter 20: Basic Shell Scripting


    # Introduction


    The *previous chapter* discussed administering your computer via shell commands.
    You will find that frequently multiple commands are used together to accomplish
    some tasks. For example, if you really want to get a picture of your computer''s
    performance, you might use several different shell commands to get a complete
    view of your system. Normally, shells are interactive. This means that a shell
    will accept a command from you via your keyboard and execute that command. If
    you use certain commands on a routine basis, it can be tedious to retype the same
    series of commands each time you need them. You can store this sequence of commands
    to a text file and instruct the shell to execute this text file instead of entering
    the commands. This is what is known as a *shell script*.


    Windows has something quite similar to this, although it is not used much anymore.
    In Windows you can use a standard text editor to create what is called a *batch
    file* and execute that file from the command prompt. Batch files were very popular
    when DOS and Windows 3.1 were the current operating systems, but they have fallen
    out of use in recent years. So that you understand the concept, let''s examine
    how to write a simple batch file in Windows.


    The first step is to open Notepad and enter the following lines:


    ```

    ```

    cd\windows

    dir *.log

    cd\

    ```

    ```


    These are the commands to change directories to the `windows` directory, list
    all files that end with `.log`, and then change back to the root directory (`c:\`).
    Then choose *File* and *Save As*, and save the file to the root directory with
    the name `test.bat`. Make certain that you change the file type to *All Files*,
    rather than *Text*, as you see in **Figure 20.1**.


    ![](img/12d790664598bbf390261087fbe55bbc_402_0.png)


    Now open a command prompt and change to the `c:\` directory (you can do this by
    typing in `cd\` and pressing the Enter key). Then enter `test.bat` and then press
    the Enter key. You should see something very much like what is shown in **Figure
    20.2**.'
  merge: -1
  img_proc: true
- pgno: 403
  md: '![](img/12d790664598bbf390261087fbe55bbc_403_0.png)


    You can see that in essence a batch file is simply a way to execute a number of
    commands by typing in only a single command at the prompt. Batch files are sometimes
    used if there is a series of commands that is routinely executed in sequence.
    The Linux script performs just about the same purpose as the batch file, except
    that Linux scripts have more versatility and can be used in much the same manner
    as many standard programming languages.


    Shell scripts, in essence, are miniature programs. They can do many of the things
    that traditional programming languages such as C, C++, BASIC, and others do. This
    makes them very powerful and versatile. There are entire books written just on
    shell scripting, and that should give you some idea of how deep this topic can
    be. In this chapter we will be exploring only the basics of writing shell scripts.
    If you are planning to use your Linux machine for a server, perhaps for a small
    office, or if you want to delve deeper into the world of Linux, then you will
    want to study this chapter carefully. However, if you are a casual Linux user
    who just wants to surf the Internet and use the Office tools, you should feel
    free to skip this chapter.'
  merge: -1
  img_proc: true
- pgno: 404
  md: '# # Script Basics


    As we have already mentioned, if you have a series of commands you want to automate,
    the most efficient way to do that is via a script. Scripts can be written in any
    basic text editor. You can use Kate, KWrite, or any other text editor that you
    want. The only problem to keep in mind when writing a script is that scripts are
    generally written for a particular shell (bash, C shell, Korn, etc.). For this
    reason, all the shells have an agreed upon standard that the first line of a script
    declares what type of shell it runs in. Then that shell will be used to run the
    script.

    For example, if you want a script run by the C shell, your first line would be
    this:


    ```

    ```bash

    #!/bin/csh

    ```

    ```


    If you want your script to run in bash:


    ```

    ```bash

    #!/bin/sh

    ```

    ```


    > **Note** Keep in mind that any line, other than the first line of the script,
    that has a `#` is considered a comment and is ignored. In case you are unfamiliar
    with this use of the word comments, they are used by programmers to leave notes
    for any other programmer who might look at their code. A comment is not executed
    and has no effect on the workings of the program or script. It is just an explanatory
    note for other programmers.


    What this first line of the script is saying is that the subsequent lines should
    be executed with the designated shell. The `!` symbol, in this case, means to
    execute, so this line literally says execute the following lines in the designated
    shell.


    It might be helpful to see a few scripts in action. Let’s take a look at a couple
    of simple scripts. While these scripts are quite simple, they illustrate the basics
    of script writing and should help you begin to get comfortable with the concept
    of scripts. You can use any text editor you like. When you are done typing your
    script, read through it carefully for spelling errors or typos. Beginners often
    miss basic errors that will cause a script to behave in unpredictable ways or
    not run at all. Here is a sample script, seen in Figure 20.3:


    ![](img/12d790664598bbf390261087fbe55bbc_404_0.png)


    **Figure 20.3: Saving your script file.**


    ```

    ```bash

    #!/bin/sh

    hostname

    who

    exit 0

    ```

    ```


    If you save this with the name `scriptone.sh`, you can then go to the shell, change
    to whatever directory you saved your script to, and run the `ls` command. You
    should see `scriptone.sh` in green print among the other contents of that directory,
    as you see in Figure 20.4. You can now enter `bash scriptone.sh` and see output
    similar to what is shown in Figure 20.5.'
  merge: -1
  img_proc: true
- pgno: 405
  md: '# Script Basics


    ![](img/12d790664598bbf390261087fbe55bbc_405_0.png)


    Figure 20.4: Script files in green print.


    ![](img/12d790664598bbf390261087fbe55bbc_405_1.png)


    Figure 20.5: Running script one.


    Notice the last line of the script. It is not one of the shell commands we have
    previously discussed. This command tells a script that it is done and to exit.
    If you omit this line, your script may not run at all; if it does run, it will
    have unpredictable results.


    You might also be wondering why the name of your script was in green. This indicates
    an executable script. All such scripts appear in green, just as all directories
    appear in blue, and tar files in red. In older versions of Linux a script file
    was not immediately executable. You had to first use the `chmod` command (an abbreviation
    for *change mode*) to change the file''s mode to an executable one. For example,
    after saving your script you would have had to enter the following at the shell:


    ```

    ```

    chmod 777 scriptone.sh

    ```

    ```


    If you are using an older version of Linux you may still have to do this. If you
    try typing in the name of your script and an error occurs, try using `chmod`,
    as shown above, to change the mode to an executable script. That was not too difficult,
    was it?


    Let’s try one more script. In this script we will introduce some interesting new
    additions to our repertoire of shell commands. As you know, you can run an `ls`
    command and list everything in a directory. However, if you use the command prompt
    in Windows very much, you might be wondering if you can filter the results. In
    Windows, for example, you could enter `dir *.exe` and get only files ending with
    an `.exe` extension. Can you do the same thing in Linux? Yes, you certainly can.
    In fact, the asterisk wildcard works the same way. There is also another wildcard
    character you can use, the question mark. A question mark indicates a single character.
    So if you type `ls *.txt` at the shell, you will see all text files. If you enter
    `??.txt`, you will see only text files with a one-character name. There are several
    wildcards, and we will use them in our next script. Several of the commonly used
    wildcards are summarized in Table 20.1.


    Table 20.1: Wildcards


    | Wildcard | Purpose |

    | --- | --- |

    | * | This means any character and any number of characters. For example, `*.sh`
    means any shell, any file that ends in the `.sh` extension, regardless of how
    many characters are in the name. |

    | ? | This denotes one character. For example, `????.txt` means all text files
    that have a four-character name. |

    | ! | This means *not*, or negation. |'
  merge: -1
