- pgno: 20
  md: '# # Chapter 2: Installing Linux


    # ## Introduction


    We now have taken a broad overview of the world of Linux, including a brief history
    and an examination of the advantages and disadvantages of Linux versus Windows.
    However, we won’t be able to do much of anything with Linux unless we install
    it. Although this is not a particularly difficult process, you should realize
    that installing any operating system is a very important step.


    The most obvious reason is that you cannot use the operating system until you
    install it. However, there are other reasons why the installation is very important.
    The manner in which you install the operating system and the options you select
    during installation will determine what features your operating system has and,
    to some extent, how it behaves on your machine. For this reason, you must pay
    very close attention to this process. This process is critical, but it’s not particularly
    difficult if you proceed carefully; still, there are pitfalls you will need to
    avoid. It is recommended that you read this entire chapter before attempting the
    install. You should not simply start at the beginning of the chapter and follow
    along as you read. Read through the entire *chapter one* time, making certain
    that you understand all the issues involved; and then go through the chapter a
    second time while you actually perform an installation. Pay particular attention
    to any Notes in the text. These Notes are designed to highlight potential problems
    or specific issues that will require particularly close attention on your part.
    That way, you will be aware of any potential problems before you start the installation
    process. If after reading this chapter you still are not comfortable with the
    install process, it might be a good idea to also read the installation instructions
    that came with your version of Linux. After you carefully read this chapter and
    are certain you understand the material, then simply pay attention to the installation
    process itself and you should do just fine.


    It may seem odd to recommend that you pay attention to the installation process,
    but this admonition comes from long experience. It is not uncommon for beginners
    to rush through parts of the install and end up doing some things very wrong.
    If you simply pay careful attention to each screen and read any instructions,
    you should be fine. The install process is not that difficult; in fact, it is
    no more difficult than installing Windows and, in some ways, even less difficult.
    Of course in the worst-case scenario, should you totally botch the installation,
    you can simply reinstall the operating system. You cannot damage the hardware
    by doing a bad installation. However, you can render your machine unusable until
    a reinstall is accomplished.


    > If you really botch the installation, you will have to repartition your hard
    drive and reinstall the operating system. This chapter discusses the process of
    partitioning a hard drive. It is a very good idea either to perform your first
    Linux installation on an old machine that does not have any important data or
    to make sure you have made backups of all your data before beginning the installation
    process. In fact, if you are not using an old machine that has no data, it is
    absolutely critical that you back up all data before starting. Failing to do so
    can lead to a loss of all of your data.


    This introduction might have left you frightened. Remember that if you first carefully
    read the instructions in this chapter and perhaps any documentation that came
    with your Linux distribution, you should be fine. Most readers who read and follow
    the instructions carefully will have no problems installing. However, for those
    readers who just don’t want to try it, there are a number of major computer stores
    that offer PCs that come with Linux already installed. Usually they are much cheaper
    than a Windows PC. You can always purchase one of those and skip the installation
    process. The key, if you choose to install yourself, is to read this chapter and
    your distribution’s documentation before installing.


    This book uses Red Hat Linux for all examples; however, the installation of other
    distributions such as SuSE or Mandrake will have a great many similarities. In
    fact, the installation process of any Linux distribution is likely to have more
    similarities than differences. If you are using one of the other major Linux distributions,
    don’t worry. The material in this chapter, combined with the documentation that
    came with your particular Linux distribution, should still be enough for you to
    install Linux. Also keep in mind that when you are through the installation, the
    other tasks in this book are common to all major Linux distributions.


    Before you embark on the installation of Red Hat 9.0, or any software for that
    matter, you should make sure that your system will support it. The minimum hardware
    specifications to run a particular software package are also referred to as its
    *system requirements*. These minimum requirements are usually determined by the
    operating system vendor. System requirements are yet another reason to consider
    moving to Linux. The Linux operating system does not require an expensive high-end
    PC in order to run. In fact, Linux has been successfully installed and run on
    machines that literally were thrown away by small businesses. Red Hat puts the
    specifications for its Professional Edition at a Pentium II 400MHz or faster processor,
    28 megabytes of RAM, 1.3 gigabytes of hard drive space, a mouse, and a CD-ROM.
    The Personal Edition, which this book focuses on, can be installed on a Pentium
    II 200MHz processor with only 64 megabytes of RAM. To give you a perspective on
    how low these system requirements are, remember that these are Pentium II machines.
    Pentium IV is the current model of Intel processor as of this writing. You also
    would have a difficult time finding a new computer that had less than 128 megabytes
    of RAM.'
  merge: -1
  img_proc: true
