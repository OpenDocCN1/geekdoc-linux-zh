- pgno: 300
  md: '# ## Summary


    This chapter has been a very important one. Most people spend much of their computer
    time on the Internet. In this chapter we have taken a rather close look at Web
    browsers, e-mail clients, FTP clients, and chat software. You should now be ready
    to effectively use Linux to accomplish all the Web activities you previously accomplished
    in Windows.'
