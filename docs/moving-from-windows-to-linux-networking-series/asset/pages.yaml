- pgno: 234
  md: '# Review Questions


    +   1. Does Open Office Impress support automatic slide show presentation?


    +   2. What drop-down menu would you use to change the toolbars that are displayed?


    +   3. What drop-down menu would you use to add three-dimensional effects to text?


    +   4. What is the purpose of the Slides view?


    +   5. What is the difference between reharase timings in PowerPoint and in Impress?


    # Answers


    +   1. No


    +   2. Go to View, then select Toolbars.


    +   3. Go to Format and then select Text.


    +   4. To arrange your slides in some particular order.


    +   5. In Impress it is simply for your own rehearsal. In PowerPoint the timings
    are recorded.'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# **Chapter 11: Other Open Office Applications**


    # **Introduction**


    Throughout this section we have been discussing the three most commonly used Open
    Office applications. You have seen how to create documents, spreadsheets, and
    presentations. These applications closely parallel the functions of Microsoft
    Word, Microsoft Excel, and Microsoft PowerPoint. However, Writer, Calc, and Impress
    are not the only things that Open Office has to offer.


    There are several less commonly used applications. These applications form part
    of the Open Office suite and can be quite useful. In this chapter we will briefly
    examine each of these and explore their basic functionality. After this chapter
    you should be able to use these applications with relative ease.'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# # Draw


    Open Office Draw® is a very useful application. With this application you can
    create your own drawings. When you first launch Draw, you might notice that the
    toolbar on the left is identical to the one found in Impress. If you recall, that
    toolbar contained various graphical elements, so it should be no surprise that
    this application has the same toolbar.


    As with any graphics-related application, you can open various graphics files
    and then edit or alter them as you see fit. When you go to File on the drop-down
    menu and select Open, you will see something like what is shown in Figure 11.1.


    ![](img/12d790664598bbf390261087fbe55bbc_236_0.png)


    **Figure 11.1**: The Open menu.


    Notice that there is a plethora of graphics types that Draw can open. You can
    open GIFs, JPEG, BMP, WMF, ICO, and even Kodak Photo CD files. This means that
    you have a number of graphics types you can work with. For our purposes we will
    open any image file on your PC and begin altering it using the Draw program. The
    images in this book might use a different image than you have on your machine.
    That is not important as long as you have some image you can work with.


    For demonstration purposes this book is using a rather simple image, a black and
    gray yin and yang symbol, shown in Figure 11.2. This figure is rather simple,
    but it will enable us to explore the things you can do with the image once you
    have it opened in Draw.


    ![](img/12d790664598bbf390261087fbe55bbc_236_1.png)


    **Figure 11.2**: The sample picture.


    Keep in mind that the images you create in Draw will often be used later in a
    Writer document or an Impress slide show presentation. This means that, while
    you cannot do complex image manipulation, you can create logos and the sort of
    graphics often used in brochures and'
  merge: -1
  img_proc: true
- pgno: 237
  md: '# Draw


    fliers.


    As was previously mentioned, the toolbar on the left is identical to the one you
    were introduced to with Impress, so there is no need to examine it again. However,
    the toolbar at the top is not identical to the toolbars you have previously seen.
    You get a new set of options when you have an image selected.


    Let’s examine some of its functionality with our sample image. The first item
    of interest on the upper toolbar is the first drop-down box. If you click on it
    you see that it has four options: default, grayscale, black and white, and watermark.
    Each of these changes your image. For example, the black and white option, when
    applied to our yin and yang symbol, is shown in Figure 11.3.


    ![](img/12d790664598bbf390261087fbe55bbc_237_0.png)


    The next three buttons are not of much use with a black and white image or with
    the grayscale images used in most books. These three buttons enable you to alter
    the amount of red, green, and blue in an image. Most computer graphics colors
    are created by mixing reds, greens, and blues. Therefore, altering the levels
    of these colors in your image will enable you to alter the image’s overall color.
    These buttons are shown in Figure 11.4.


    ![](img/12d790664598bbf390261087fbe55bbc_237_1.png)


    The next two buttons, shown in Figure 11.5, enable you to alter the brightness
    and contrast of a picture. Careful alteration of both brightness and contrast
    can help clear up an otherwise difficult picture.


    ![](img/12d790664598bbf390261087fbe55bbc_237_2.png)


    The next two buttons, shown in Figure 11.6, enable you to alter the gamma and
    the transparency of an image. The transparency setting is the one that we will
    be taking a closer look at.


    ![](img/12d790664598bbf390261087fbe55bbc_237_3.png)


    There are times when you might want an image to have varying degrees of opaqueness.
    You may want the image to be at least partially transparent. That is where the
    transparency setting comes in. A setting of zero indicates that your image is
    completely opaque with no transparency at all. A setting of 100 indicates that
    your image is completely transparent and in fact not visible. Figure 11.7 shows
    a few different transparency settings for our yin and yang symbol.'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'As we learned earlier, many of the tools and settings in this application are
    identical to the ones found in Impress, which is why we don''t need an entire
    chapter for this application. Let''s examine a few drop-down menu items that Draw
    does not share with Impress. In **Figure 11.8** you can see the drop-down menu
    for flipping an image. This is found by going to the **Modify** drop-down menu
    and selecting **Flip**. You can completely flip an image, either horizontally
    or vertically.


    ![](img/12d790664598bbf390261087fbe55bbc_238_0.png)


    There are some other interesting options under the **Modify** menu. For example,
    you will find the **Arrange** menu item. If you have more than one object on your
    drawing, you can use the **Arrange** options to alter the positioning of the objects.
    For example, in **Figure 11.9** there is a cube in front of our image. If you
    go to **Modify** on the drop-down menu, select **Arrange**, and choose **Bring
    to Front**, the image you have selected will be brought to the front. If you click
    once on our yin and yang emblem, you can then bring it back to the front, as it
    is in **Figure 11.10**.


    ![](img/12d790664598bbf390261087fbe55bbc_238_1.png)


    ![](img/12d790664598bbf390261087fbe55bbc_238_2.png)


    The next option under **Modify** is **Alignment**. This menu item is self-explanatory.
    It enables you to align the image you have selected. You can give it a horizontal
    alignment of left, right, or center. You also can give it a vertical alignment
    of top, bottom, or center.


    This is not everything you can do with the Draw application, of course. Combining
    what we have covered here with what you learned about Impress, you should be able
    to use Draw to create basic graphics for purposes such as brochures, fliers, and
    more.'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# HTML Editor


    Most computer users like to surf the Web. In previous chapters you were briefly
    introduced to the browser that comes with Red Hat Linux 9.0. You probably already
    have a lot of experience visiting Web sites using Microsoft Internet Explorer
    or Netscape Navigator. What are those Web pages you visit, and how would you make
    one of your own? Eventually, most avid computer users and even many novice users
    ask themselves these questions. A Web site is one or more documents written in
    a language called HTML (HyperText Markup Language). This language is something
    Web browsers understand. When they go to a Web address and see HTML documents,
    the browsers can interpret those documents and display the contents to you in
    your browser.


    This leaves the question of how you might make your own Web pages. You could take
    a course at a local community college and learn how to use HTML. You also could
    purchase several HTML books and study them. Fortunately, if you have neither the
    time nor the inclination for such an in-depth study of HTML, Open Office has an
    alternative. One of the applications in Open Office is HTML Editor. That editor,
    depicted in *Figure 11.11*, looks much like a standard word processor.


    ![](img/12d790664598bbf390261087fbe55bbc_239_0.png)


    You can insert text, change fonts, insert pictures, and do many of the things
    you have always done in word processors like Open Office Writer and Microsoft
    Word. However, the HTML Editor takes what you are writing and inserting and generates
    the HTML language code for you. You then have a Web page without actually knowing
    anything at all about HTML! This probably has your interest, so let’s jump right
    in.


    # HTML Editor Basics


    When you first open the HTML Editor, you will notice that the toolbar at the top
    looks very much like the toolbar from Open Office Writer. This should be expected.
    Web pages often include text. That text might be bold, italicized, centered, or
    formatted in some other way. You will need the same text manipulation tools that
    you would in any word processor. Even the toolbar at the side is very similar
    to what you saw in Open Office Writer. It enables you to insert tables, images,
    and other items.


    The first button on the side toolbar enables you to insert many common items.
    This button is shown in *Figure 11.12*.


    ![](img/12d790664598bbf390261087fbe55bbc_239_1.png)


    Some of these options should be familiar to you. Inserting graphics or a table
    works in exactly the same way as it did with Open Office Writer. However, inserting
    a frame may sound strange to you. A frame is a way to organize elements in any
    document into logical groupings. When'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# Some Advanced Features


    you choose this option, you then drag your mouse on the document to create the
    frame. If you then right-click on the frame, you will see a pop-up menu with several
    options. The most important is about midway down the list and says Frame. If you
    click on this option you will see a screen, much like the one in Figure 11.13,
    where you can alter a number of your frame''s properties.


    ![](img/12d790664598bbf390261087fbe55bbc_240_0.png)


    **Figure 11.13:** Frames.


    Under that is a button for inserting various fields. This button''s options are
    shown in Figure 11.14. You can insert date fields, page number, author, and more.
    This is a rather simple but useful item to add to any Web page.


    ![](img/12d790664598bbf390261087fbe55bbc_240_1.png)


    **Figure 11.14:** Inserting special fields.


    The rest of the buttons on this left toolbar, except for the very last button,
    have been discussed in previous chapters. These buttons are identical to the ones
    you find in Open Office Writer. However, the last button is quite different. You
    have already learned that one way to create HTML pages for the Web is to learn
    the HTML language and type in all that code. The last button on this toolbar enables
    you to view the HTML code you have generated with this HTML Editor. That code
    will look similar to what you see in Figure 11.15.


    ![](img/12d790664598bbf390261087fbe55bbc_240_2.png)


    **Figure 11.15:** HTML source code.


    Some of the HTML code should make sense to you because it is very close to plain
    English. Other elements of it will seem peculiar. However, the real point here
    is that you don''t have to know anything at all about HTML code to create some
    pretty decent Web pages using the Open Office HTML Editor.


    Next you should turn your attention to the drop-down menu at the top of the screen.
    Take a moment to examine the Insert menu shown in Figure 11.16. The first few
    items duplicate options you have seen in the toolbar buttons, either on the left
    or at the top. It is common practice in many applications, including both Open
    Office and Microsoft Office, to duplicate functions. This way you can use whatever
    method you prefer, a toolbar or a drop-down menu.'
  merge: -1
  img_proc: true
- pgno: 241
  md: '![](img/12d790664598bbf390261087fbe55bbc_241_0.png)


    **Figure 11.16**: The Insert menu.


    The third option down, however, is not duplicated in the toolbar. It enables you
    to insert a hyperlink. A hyperlink is a link to an e-mail address, a file, or
    another Web site. It is certain that you have at some point clicked your mouse
    on a link on some Web page and been taken to another Web page. This is a hyperlink.
    When you click on that option in the drop-down menu, you will see a screen like
    the one in Figure 11.17.


    ![](img/12d790664598bbf390261087fbe55bbc_241_1.png)


    **Figure 11.17**: Inserting a hyperlink.


    The buttons on the left enable you to determine what type of link this is. It
    might be an Internet link to a Web site or perhaps a link to an e-mail address,
    or even a link to a document. For our purposes we will stick with Internet links.
    You then need only to type in the Web address in the Target text field. Then in
    the Text field you can put whatever text you want the reader of your Web page
    to see. For our purposes we will put in the Web site of this book''s author, www.chuckeasttom.com
    in Target, and for the text we will put click here to visit Chuck''s web page.
    This is all shown in Figure 11.18.


    ![](img/12d790664598bbf390261087fbe55bbc_241_2.png)


    **Figure 11.18**: Setting up a hyperlink.


    You click the Apply button and then the Close button, and this link will be inserted
    into your HTML document. Inserting links is rather important. Most Web pages have
    links of one sort or another. When you are done, your link will look much like
    the one you see in Figure 11.19.'
  merge: -1
  img_proc: true
- pgno: 242
  md: '![](img/12d790664598bbf390261087fbe55bbc_242_0.png)


    Figure 11.19: A hyperlink in your Web page.


    # # A Basic Web Page


    With all of the basics out of the way, let’s create a very basic Web site. So
    that all readers are on the same page, so to speak, we will create a Web page
    about Linux. The only image we will use will be the Linux penguin Tux. You can
    do a Web search using Google™ or Yahoo!™ and easily find this image. With most
    Web browsers you right-click on an image in a Web page and select Save As from
    the drop-down menu.


    Starting with a blank HTML document in the HTML Editor, we will type in the phrase
    *Linux is Cool*. We will then make that text centered, bold, italicized, and a
    much larger font using the toolbar at the top (remember the common text formatting
    buttons found in all word processors). Then use the Enter key to skip down a few
    lines. You can then use the drop-down menu to select Insert and Graphics and insert
    an image. For the purposes of this example we will insert the previously downloaded
    Tux image. You should note that your image is surrounded by small dots, enabling
    you to resize it if you want. Right now your Web page should look much like what
    is shown in *Figure 11.20*.


    ![](img/12d790664598bbf390261087fbe55bbc_242_1.png)


    Figure 11.20: The basic Web page.


    Now we are going to add a table. Recall that the toolbar on the left side of your
    screen is where you will go to do this. Click on the uppermost button and then
    select the button that looks like a table. You then drag your mouse over the same
    number of cells you want your table to have, as depicted in *Figure 11.21*.


    ![](img/12d790664598bbf390261087fbe55bbc_242_2.png)


    Figure 11.21: Adding a table.


    Now we are going to practice creating links. Each of these cells is going to have
    a link to some Linux-related Web site. In case you have forgotten, put your mouse
    in one of the cells, click once, then go to the drop-down menu and select Insert
    and Hyperlink. Each of our cells'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'will have a different link. The links are listed here:


    +      1. **Linux Online:** *www.linux.org/*

    +      2. **Linux.Com:** *www.linux.com/*

    +      3. **Red Hat:** *www.redhat.com/*

    +      4. **Open Office:** *www.openoffice.org/*


    We now have a relatively simple Web page, but one that shows the basics of developing
    a Web page. Obviously there is a lot more you can do with the HTML Editor, but
    this gives you enough to create a basic résumé Web page or personal Web page.
    You can see the Web page we created in Figure 11.22.


    ![](img/12d790664598bbf390261087fbe55bbc_243_0.png)


    **Figure 11.22:** Our sample Web page.


    Once you have created a Web page, you might want to make it available on the Web.
    To do that you will need to have some Web server host your Web site. Fortunately,
    Web hosting, much like Linux and Open Office, can be obtained at little or no
    charge. Two very popular free Web hosting services are *www.geocities.com* and
    *www.angelfire.com*. For business sites, *www.netfirm.com* is very popular. If
    you visit any of these sites you will find complete instructions for obtaining
    free Web space and uploading your Web page.


    Obviously this short segment will not make you a professional Web developer. It
    would be virtually impossible for you to do that without some extensive knowledge
    of HTML and at least one scripting language such as JavaScript. However, it is
    not the purpose of the Open Office HTML Editor or this book to make you a professional
    Web developer. The purpose is to make you competent enough to put up a simple
    Web page with very little difficulty. It is recommended that you spend some time
    experimenting with the HTML Editor.


    # Some Advanced Features


    For some of you, the previous elements of a Web page are not enough. You want
    more. Let’s explore just a few additional items you can use in your Web pages.
    First let’s examine using images for links. You have probably been to Web sites
    where you clicked on a link in order to visit some other Web page. If you will
    right-click on any image, such as our Tux image, and choose Graphics, you will
    see a screen that enables you to alter almost any facet of that image. We are
    interested in the fourth tab, labeled Hyperlink. Enter your Web address, as you
    see in Figure 11.23, and your picture is now a link to a Web site.'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# # Some Advanced Features


    ![](img/12d790664598bbf390261087fbe55bbc_244_0.png)


    **Figure 11.23:** Making a picture a Web link.


    An even more interesting option can be found by right-clicking on your picture
    and selecting Image Map. An image map is when one picture links to more than one
    Web site. Different regions of the image are linked to different sites. When you
    select the Image Map option, you are presented with the Image Map Editor shown
    in **Figure 11.24**.


    ![](img/12d790664598bbf390261087fbe55bbc_244_1.png)


    **Figure 11.24:** The Image Map Editor.


    Now you can select any of the shape tools in the toolbar and drag your mouse across
    an area. That area will be highlighted with that shape. You then assign that area
    a Web address, as you see in **Figure 11.25**. Just remember not to have any overlap
    in your regions.


    ![](img/12d790664598bbf390261087fbe55bbc_244_2.png)


    **Figure 11.25:** Creating an image map.


    The addition of image links and image maps should really increase both the functionality
    and the appeal of your Web site. And all of this was done without any need for
    you to know anything at all about HTML.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Open Office Setup


    When you first run Open Office or when you first install it, you get an opportunity
    to set the various parameters and settings of the Open Office suite. However,
    if you are anything at all like most people, you may have forgotten some settings
    or changed your mind. Fortunately, you can select Open Office Setup from the Open
    Office Setup menu option. In the same location all Open Office applications are
    found, and go through a wizard, changing anything you want. The first screen of
    this is shown in *Figure 11.26*.


    ![](img/12d790664598bbf390261087fbe55bbc_245_0.png)


    *Figure 11.26*: The Open Office setup.


    This utility will enable you to modify any of the settings you would normally
    set during installation. This can be very valuable, as you may not know how to
    change those settings without reinstalling.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# Math


    If you have ever needed to create a document that contained mathematical equations,
    then you know it is not easy to find an application that combines the required
    formatting and printing of word processing and the representation of mathematical
    equations. Most word processors have very limited capability in this regard. Even
    Microsoft Word and its companion Math Equation Editor do not fully accomplish
    this goal. This is another area in which Open Office has a superior performance.
    Open Office Math is essentially a mathematical word processor. You can use it
    to create documents that contain mathematical equations. This is very useful for
    mathematicians, engineers, astronomers, chemists, physicists, or students taking
    courses in any of these disciplines. You can see the basic Open Office Math screen
    shown in Figure 11.27.


    ![](img/12d790664598bbf390261087fbe55bbc_246_0.png)


    **Figure 11.27:** Open Office Math.


    Notice the small box in the upper-right corner with various mathematical symbols
    in it. In this box you can select various types of symbols. The top row contains
    the types. As you pass your mouse over them, as shown in **Figure 11.28**, a tool
    will show you what type it is. If you click on that type, you will see a different
    set of symbols in the main window.'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/12d790664598bbf390261087fbe55bbc_247_0.png)


    **Figure 11.28:** The symbol types.


    You can then use a combination of those symbols and your own typing to create
    mathematical formula documents that you can save, edit, open, or print just like
    any standard text document. So with Open Office Math, you have a word processor
    for mathematics.'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# # Global


    You may well be wondering what this option is for. When you launch the Global
    application, you see something much like what is shown in **Figure 11.29**. It
    looks quite a bit like a word processor, but it is not. This application is for
    storing and organizing global data, data that can be shared among your various
    Open Office applications. The document you are looking at is the master document
    for your word processor, but many functions in it are common to all of your Open
    Office applications. You can alter this document and save it. It will then be
    the template for new word processing documents you create.


    ![](img/12d790664598bbf390261087fbe55bbc_248_0.png)


    **Figure 11.29**: Global.


    You already saw this application used a bit in the last chapter to import templates.
    That is just the beginning of what you can do with this application. Recall that
    we went to File and then Templates and chose Import. You also can alter your Address
    Book. When you look under File and Templates, you should see Address Book. When
    you select this you are taken to the screen shown in **Figure 11.30**, and you
    can adjust the format of your Address Book.


    ![](img/12d790664598bbf390261087fbe55bbc_248_1.png)


    **Figure 11.30**: The Address Book.


    You can see that Global is exactly what its name implies. It is a utility that
    gives you access to the Global shared elements of Open Office. It is here that
    you can create the basic template for new documents, as well as import templates
    for use in Excel and Impress.'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/12d790664598bbf390261087fbe55bbc_249_0.png)'
  merge: -1
  img_proc: true
- pgno: 250
  md: '# **Summary**


    In this chapter, we examined some of the extra applications that ship with Open
    Office. Perhaps the most important is the HTML Editor. We examined the basics
    of how to use this application to develop your own Web pages and discussed how
    to find free or low-cost Web hosting for your Web page. This information is of
    use to virtually any computer user.


    We also took a look at how to change the Open Office settings using the Open Office
    Setup utility. It has a very user-friendly wizard that will enable you to change
    any settings you would normally set during installation.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# # Review Questions


    +   1. What is an image map?

    +   2. How would you make a picture into a link to a Web site?

    +   3. Name at least one free Web hosting site.

    +   4. List three graphics types that you can insert into your Web page.

    +   5. What is the purpose of the Open Office Setup utility?

    +   6. What is the purpose of Open Office Math?

    +   7. What is the purpose of Open Office Global?


    ![](img/12d790664598bbf390261087fbe55bbc_251_0.png)


    # ## Answers


    +   1. An image map is created when different regions of a single image link to
    different addresses.

    +   2. Right-click on the picture to change its properties to include a link.

    +   3. [www.angelﬁre.com](http://www.angelfire.com) and [www.geocities.com](http://www.geocities.com)

    +   4. GIF, JPG, BMP

    +   5. To alter options normally configured during the initial setup.

    +   6. To provide a word processor for mathematical formulas.

    +   7. To set up global parameters that are used throughout Open Office.'
  merge: -1
  img_proc: true
- pgno: 252
  md: '# Section IV: Important Linux Applications


    # Chapter List


    Chapter 12: Moving from Adobe Photoshop to GIMP

    Chapter 13: Web Browsers, E-Mail, and Internet Applications

    Chapter 14: Miscellaneous Linux Applications

    Chapter 15: Web Servers in Linux

    Chapter 16: Linux FTP Servers

    Chapter 17: Fun and Games in Linux


    This section will show you how to use several applications. There are a number
