- pgno: 377
  md: '# Network Utilities


    Whether your computer is on a local network or using the Internet, there are several
    network commands that you may find quite useful. There are several basic network-oriented
    commands you probably need to be familiar with. Each of these can provide very
    useful information about your connection to a network or the Internet, as well
    as help diagnose specific connectivity problems.


    # ifconfig


    This is the first network command we will examine. The Windows equivalent is `ipconfig`,
    and it provides virtually identical information to `ifconfig`. The `ifconfig`
    command just gives a little extra data. Basically, the information it supplies
    regards the status of your network card and your connection to the Internet. The
    output of this command is shown in Figure 18.11.


    ![](img/12d790664598bbf390261087fbe55bbc_377_0.png)


    The `ifconfig` command will tell you if your network card is up and running. If
    you are currently connected to a local network or the Internet, it will send out
    packets periodically to ensure that you still are connected. This command also
    will display the IP address of your computer’s network card. `ifconfig` is discussed
    in more detail in Chapter 19, “Linux Administration from the Shell.”


    # ping


    The `ping` utility is much like a SONAR ping on a submarine. It sends out packets
    to a given IP address, as shown in Figure 18.12, and tells you whether or not
    they were received. One of the first things to check if you are having trouble
    getting on a network or the Internet is to try and ping a known IP address. You
    also can ping Internet sites by their names. For example, you can try to ping
    www.chuckeaston.com. If you find that you cannot get a response from any site
    you ping, then you are probably not connected to the Internet. If you can get
    some sites to respond and not others, then the problem most likely lies with those
    sites. The `ping` command works exactly the same from a Windows command prompt
    as it does in a Linux or Unix shell.'
  merge: -1
  img_proc: true
- pgno: 378
  md: '# # Network Utilities


    ![](img/12d790664598bbf390261087fbe55bbc_378_0.png)


    # ## tracroute


    This command is essentially an improved `ping`. Instead of just telling you if
    it got to a given IP address, it will tell you how it got there. When you go to
    an Internet Web site, the odds are that your package goes through several intermediary
    sites. The `tracroute` command will tell you where it''s going and how long each
    hop takes. This is very important diagnostic information. If you are having slow
    response time from Web sites and find that the slowest hop is from your Internet
    service provider to the next hop, your ISP might be having a problem. You can
    see an example of `tracroute` in Figure 18.13.


    ![](img/12d790664598bbf390261087fbe55bbc_378_1.png)


    The `tracroute` command is not unique to Linux and Unix. Windows provides the
    same functionality via its `tracert` command. It is called in the exact same manner,
    by typing in `tracert` followed by the IP address, and it returns the same information.


    **Note**

    In the figures for the preceding examples, you may have noticed the address 127.0.0.1
    to `ping` or `tracroute` to. This is called the loopback address. It is used to
    check your own machine. It is often viewed as being a way to address your own
    network interface card; however, you should realize that you will have a loopback
    address even if no NIC is found in your machine. It is commonly used to diagnose
    network problems. If you cannot successfully ping your network card, then you
    may have a bad network card.'
  merge: -1
  img_proc: true
- pgno: 379
  md: '# Miscellaneous Commands


    There are several useful commands that do not fit neatly into any one category.
    We will examine several of these commands here. These commands include finger,
    who, whois, and date. The date command is the simplest, as it returns the current
    date and time. Enter date in all lowercase letters at the shell, and you should
    see something like what is shown in Figure 18.14.


    ![](img/12d790664598bbf390261087fbe55bbc_379_0.png)


    Figure 18.14: The date command.


    The finger command is used to get back information regarding a specific user.
    This often is useful for a system administrator. For example, if you run top and
    see that one specific user is spawning several processes on your server and those
    processes are consuming resources, you may want to find out about that user. In
    Figure 18.15, you can see the finger command used on the root user.


    ![](img/12d790664598bbf390261087fbe55bbc_379_1.png)


    Figure 18.15: The finger command.


    The who command is also quite useful for a system administrator. It will give
    you a list of all the users currently logged on to your system. This can be very
    important. You will want to know who is on your system. You can see the output
    of the who command in Figure 18.16.'
  merge: -1
  img_proc: true
- pgno: 380
  md: '![](img/12d790664598bbf390261087fbe55bbc_380_0.png)


    One common trick used by hackers is to log on to a system after hours using a
    valid user account. Some administrators create a script (we will discuss scripts
    in detail later in this book) that runs the `who` command and dumps the output
    to a file. You can then schedule that script to run at night, after hours. If
    you find that at 2 a.m. a user was shown to be logged in, and you know that user
    was not in the building, then you should suspect a hacker is using that user account.
    You can delete that account and issue the user a new account with a different
    password.


    The `whois` command is quite similar to the `finger` command, except that normally
    it is used with Internet addresses. You might ask `whois www.chuckeasttom.com`.
    If the information is available, this command will return information about the
    party that registered that domain name. You may not be aware, but when you register
    a domain, the information you provide is public domain. Anyone can look up the
    registration information about any domain.


    There is another very simple command. It is the `uname` command. When you enter
    `uname` at the shell, it will tell you what operating system you are using. This
    may seem like an entirely useless command until you consider that these shells
    can be used with Linux or Unix. You may not be sure whether you are sitting at
    a Unix machine or a Linux machine.'
  merge: -1
  img_proc: true
