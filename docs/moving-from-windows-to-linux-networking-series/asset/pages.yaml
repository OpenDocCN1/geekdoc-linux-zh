    screen in Figure 5.7.


    ![](img/12d790664598bbf390261087fbe55bbc_95_1.png)


    Figure 5.7: KWrite.


    You probably noticed that the KWrite screen looks very much like the Kate screen.
    Under the Settings drop-down menu you will see Show Icon Border and Show Line
    Numbers, just as you did with Kate. The difference between the two is that KWrite
    offers a few more tools than Kate. To begin with, under the Tools drop-down menu
    option you will find a spell checker, shown in Figure 5.8 . A spell checker, for
    many people, is an indispensable tool. In fact, without a spell checker, the book
    you are holding in your hands would not have been possible!'
  merge: -1
  img_proc: true
- pgno: 96
  md: '![](img/12d790664598bbf390261087fbe55bbc_96_0.png)


    **Figure 5.8:** The KWrite spell checker.


    There is another tool available in KWrite that is not available in Kate, Notepad,
    or WordPad. This tool probably will be of use only to the more technically savvy
    readers, but it is worth mentioning in any case. If you look under *Settings*,
    you will find an option to set **Highlight Mode**. This mode enables you to direct
    KWrite to highlight text in accordance with the structure of certain scripting
    languages, markup languages, and programming languages. This option is shown in
    **Figure 5.9a**.


    ![](img/12d790664598bbf390261087fbe55bbc_96_1.png)


    **Figure 5.9A:** The Highlight mode setting.


    For example, if you want to use a text editor to write your own HTML documents,
    you can use this feature to detect errors in the document you write.


    **Note** HTML, or Hypertext Markup Language, is the language that Web pages are
    written in. If you use one of the popular Web page development tools such as Microsoft
    FrontPage, Macromedia Dreamweaver, or Adobe PageMill, they are actually generating
    HTML code for you. If you know HTML or learn it, you can develop your own Web
    sites using a basic text editor, with no need to invest in an expensive Web development
    tool.


    We have now examined two of KDE’s built-in text editors and compared them to Microsoft’s
    WordPad and Notepad. You should now be able'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Text Editors


    to do simple text editing in Linux as easily as you did it in Windows. More technically
    inclined readers can now use KWrite for editing source code for HTML, documents
    and many programming languages. Please keep in mind that Linux has several fully
    functioning word processors that are on a par with Microsoft Word. We will be
    exploring one of these later in this book.


    # KWord


    As mentioned earlier, the latest version of the KDE interface comes with its own
    word processor, called KWord. You can get to KWord by going to Office, selecting
    More Office Applications, and clicking on KWord. Remember that, if you are using
    an earlier version of Linux, you might find this under the older Extras category.
    When you launch KWord, you will be prompted to choose what type of document to
    start with. This is shown in *Figure 5.9b*.


    ![](img/12d790664598bbf390261087fbe55bbc_97_0.png)


    **Figure 5.9B**: The opening screen for KWord.


    As you can see, you have several options for how to start. For our purposes we
    will start with an empty plain text document. This takes you to the main working
    screen of KWord, shown in *Figure 5.9c*. We will examine some of the options you
    have available to you to manipulate and format text. First, you will need to enter
    a few sentences so that we have some text to work with.


    ![](img/12d790664598bbf390261087fbe55bbc_97_1.png)'
  merge: -1
  img_proc: true
- pgno: 98
  md: '**Figure 5.9C:** The working screen for KWord.


    Much of the toolbar should look familiar to you. Most word processors have similar
    functionality, so all word processors'' toolbars also have some commonality. You
    can see the buttons that enable you to select the font, font size, bold, italic,
    and underline. These are very basic word processing functions found in almost
    all word processors, including Microsoft''s Word and WordPad, as well as Corel
    WordPerfect . The drop-down menu at the top of KWord offers some standard options
    as well. The most interesting part to examine in most word processors is the objects
    you can insert into your document. If you click on Insert in the drop-down menu,
