    **Figure 13.26:** The Action menu.


    The last aspect of Evolution that we will examine is found under **Tools** by
    selecting Settings. You are then presented with the screen shown in **Figure 13.27**.
    Here you can set up the e-mail accounts to use, what servers to connect to and
