    # diff and cmp


    These two commands are used to compare two files and determine what differences
    the two files have. In order to demonstrate these commands, we will have to create
    two sample text files. For demonstration purposes you can open up any Linux text
    editor (Kate or KWrite, for example) and type in the following three lines:


    ```

    ```

    Linux is very cool

    I love Linux

    It is awesone

    ```

    ```


    Save that as `file1.txt`. Start a new text file and enter these three lines:


    ```

    ```

    Linux is very cool

    I love Linux

    It is great

    ```

    ```


    Save that as `file2.txt`. You should notice that, except for the last line, these
    two files are identical. This is intentional, as it gives us a chance to explore
    the `diff` and `cmp` commands and find the differences between these two files.
    Now we can use both the `diff` command and the `cmp` command and see what they
    tell us about these two files. Figure 18.3 shows the output from running the `cmp`
    command. Figure 18.4 shows the output from running the `diff` command.


    ![](img/12d790664598bbf390261087fbe55bbc_371_0.png)


    **Figure 18.3:** The `cmp` command.'
  merge: -1
  img_proc: true
- pgno: 372
  md: '![](img/12d790664598bbf390261087fbe55bbc_372_0.png)


    **Figure 18.4:** The `diff` command.


    You are probably thinking that the `diff` command gives you more information than
    the `cmp` command, but that is not exactly accurate. The two commands give different
    output because they compare the files differently. The `cmp` command compares
    the files byte by byte in their binary format. Remember that ultimately everything
    in your computer is stored as ones or zeros (binary format). Therefore, it reports
    the specific bytes that are different. The `diff` command performs a textual comparison
    and returns what line or lines of text are different. Both of these commands can
    be quite useful. For example, if you have two versions of the same file and want
    to know exactly what is different between the two, either the `diff` or the `cmp`
    command can tell you.


    # # spell, head, cat, and redirect


    The next four commands we will look at are very useful when you are working with
    text files. The first of these commands, the `spell` command, is used frequently
    by most Linux users. You use this command to find any misspelled words in a file.
    When you run the `spell` command, it will return all words in that file that are
    misspelled. The misspelled words will be listed vertically as they are in Figure
    18.5.


    ![](img/12d790664598bbf390261087fbe55bbc_372_1.png)


    **Figure 18.5:** The `spell` command.


    The `head` command is very useful for searching through files. If you are seeking
    a particular file and do not recall what the filename is, in Windows you would
    have to open each file that you think might be it and scan it to see if it is
    indeed the file you are looking for. The `head` command will return just the first
    few lines of a file, and that is usually enough to determine if it is the file
    you are seeking. This is shown in Figure 18.6.'
  merge: -1
  img_proc: true
