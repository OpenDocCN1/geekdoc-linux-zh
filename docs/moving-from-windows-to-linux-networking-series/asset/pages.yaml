- pgno: 301
  md: '# Review Questions


    +   1. What Microsoft product is Evolution most like?

    +   2. What is POP3?

    +   3. What is the most useful feature of KMail?

    +   4. What is the default port for FTP?

    +   5. What is the process to retrieve your e-mail in KMail?


    ![](img/12d790664598bbf390261087fbe55bbc_301_0.png)


    # Answers


    +   1. Microsoft Outlook

    +   2. Post Office Protocol Version 3, used to retrieve e-mail. A bookmark in
    Mozilla is most like Favorites in Internet Explorer. Mozilla is most like the
    Netscape Navigator browser.

    +   3. The ability to filter incoming mail.

    +   4. 21

    +   5. Go to File, and choose Check Mail.'
  merge: -1
  img_proc: true
- pgno: 302
  md: '# # Chapter 14: Miscellaneous Linux Applications


    # ## Introduction


    The purpose of this chapter is to bring to your attention several Linux applications
    that have not been previously covered. Some of these may not have fit neatly into
    a preceding category, or were omitted to keep from making certain chapters much
    too long. Whatever the reason, there are still a few interesting Linux applications
    that we have not examined, but will examine now. There are several of these applications,
    each with its own purpose. Hopefully this chapter will not only expose you to
    them but will also encourage you to look deeper into Linux at other facets that
    we cannot cover in the space of a single book.


    # ## Sound Utilities


    In Windows you probably became used to having access to a variety of sound and
    video applications, each with its own unique purpose. Linux has several of these
    as well. In fact, in the Start menu you will see an entire category called Sound
    and Video. Obviously these applications depend on the presence of a sound card,
    speakers, and in some cases a microphone.


    # ## Sound Recorder


    This small application, shown in Figure 14.1, is virtually identical to the Windows
    Sound Recorder. If you press Record, it begins recording any sound that is currently
    playing on your computer or coming in through the microphone. When you are done
    recording, you press Stop and then select Save As from the File menu to save the
    file. That''s how easy it is to make a WAV file.


    ![](img/12d790664598bbf390261087fbe55bbc_302_0.png)


    **Note**  One of the most common sound file types is the WAV file. These files
    end in the extension .wav.


    # ## KsCD


    This application, shown in Figure 14.2, is a CD player. It is used to play music
    from any standard CD. Many people find playing their favorite music while working
    on their computer to be quite relaxing. You might notice that the interface is
    very similar to the Windows Media Player or RealPlayer. This is because all of
    these applications require the same functionality you might find on a conventional
    CD player in your home. They need to be able to play, skip a track, stop, pause,
    and eject.'
  merge: -1
  img_proc: true
- pgno: 303
  md: '![](img/12d790664598bbf390261087fbe55bbc_303_0.png)


    **Figure 14.2:** KsCD.


    # Volume Control


    No discussion of sound and video would be complete without discussing the Volume
    Control application shown in Figure 14.3. This application allows you to control
    the way sound is played and recorded on your Linux PC. Very similar functionality
    is also available in Windows.


    ![](img/12d790664598bbf390261087fbe55bbc_303_1.png)


    **Figure 14.3:** Volume Control.'
  merge: -1
  img_proc: true
- pgno: 304
  md: '# GNOME Pilot


    This is an application that was designed for GNOME. However, if you installed
    both GNOME and KDE, as was suggested in Chapter 2 “Installing Linux,” you will
    have access to it in KDE as well. Many people these days use personal digital
    assistants (PDAs), and GNOME Pilot is a neat little application that will help
    you synchronize your PDA with your PC, allowing the transfer of data between the
    two. Of course this application will not be of much use to you if you do not have
    a PDA, and you might consider skipping this part. If you are continuing, it will
    be important that you have your PDA connected before launching this wizard.


    When you launch GNOME Pilot for the first time, a wizard will walk you through
    the process of setting up your PDA-Linux connection. The first screen of this
    wizard is shown in Figure 14.4.


    ![](img/12d790664598bbf390261087fbe55bbc_304_0.png)


    **Figure 14.4:** The GNOME Pilot Wizard, screen one.


    The second screen of the wizard, shown in Figure 14.5, begins gathering important
    information about your PDA and its cradle. In case you are not aware, cradle is
    the term for the stand you mount your PDA in. This screen will ask you what you
    want to name that cradle, what type of connection you have, and what speed you
    connect at.'
  merge: -1
  img_proc: true
- pgno: 305
  md: '![](img/12d790664598bbf390261087fbe55bbc_305_0.png)


    **Figure 14.5:** The GNOME Pilot Wizard Cradle Settings.


    The next two screens inquire as to whether or not you have ever used the sync
    software to synchronize your PDA with GNOME and then starts the process of querying
    your PDA, via the connection you have defined. This is why it is critical to have
    your PDA connected when you run this wizard.


    Once you are done you will be taken to the main screen for GNOME Pilot, shown
    in Figure 14.6. This screen displays the various PDAs you have set up and their
    current status. You can set up GNOME Pilot to handle more than one PDA. You also
    can add new PDAs and edit existing ones from this screen without using the wizard.
    The wizard will launch only the first time you start GNOME Pilot.


    ![](img/12d790664598bbf390261087fbe55bbc_305_1.png)


    **Figure 14.6:** The GNOME Pilot screen.'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# KDEPrintFax


    Also found under Accessories is the KDEPrintFax application. This application,
    shown in Figure 14.7, allows you to send faxes from your computer. Of course this
    is dependent upon you having a fax modem installed. However, this should not be
    any great concern. Most personal computers made in the last several years have
    included a fax modem as standard equipment.


    ![](img/12d790664598bbf390261087fbe55bbc_306_0.png)


    Let''s begin with the Personal Settings screen, shown in Figure 14.8 and found
    under Settings and Configure KDEPrintFax. The setup is relatively easy. On this
    screen you put in information about yourself and your company. The Page Setup
    and System settings under that are there to help you configure how your fax modem
    will work. The settings for the fax modem itself are dependent upon the manufacturer''s
    specifications. The settings for how to format the fax are a matter of your personal
    preference.


    ![](img/12d790664598bbf390261087fbe55bbc_306_1.png)


    When you are ready to send a fax, the process is actually quite simple. You first
    click on the Add File button. You will then be able to browse your machine''s
    hard drive and attach any file you want. In the field marked Fax Number, type
    in the number you want to fax to. You then go'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'to Fax and select **Send Fax**. You can fax word processing documents, image
    files, spreadsheet files, and more through this application.


    You should also take note of the **View Log** button. KDEPrintFax keeps a record
    of all the faxes it sends. If a recipient claims not to have received a fax, you
    can easily check to see if it was sent and exactly when it was sent.'
  merge: -1
  img_proc: true
- pgno: 308
  md: '# ## Configure Panel


    This handy little application, shown in **Figure 14.9**, allows you to reconfigure
    the panel at the bottom of your screen. What KDE calls a panel, Windows calls
    a taskbar. In either case it is the background bar at the bottom of your screen
    where you find certain application icons, as well as the Start menu. To get to
    this utility, go to the Start menu, select Preferences, and choose Configure Panel.


    ![](img/12d790664598bbf390261087fbe55bbc_308_0.png)


    The Position section in the upper-left part of the screen allows you to decide
    where on your screen the panel will be. It does not have to appear at the bottom
    if you don''t want it to. Just below this is a place where you can set the length
    of the panel. By default it stretches across the entire bottom of the screen,
    but you can certainly change that if you wish .


    The second tab on this screen allows you to decide whether or not the panel should
    hide when not in use, and if so, allows you to set the parameter for hiding. This
    screen is shown in **Figure 14.10**. Notice that you can set how fast the panel
    will hide, whether or not other applications can appear over it, and other settings.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '![](img/12d790664598bbf390261087fbe55bbc_309_0.png)


    # **Figure 14.10:** The Panel Hide configuration.


    The third tab is even more interesting and is shown in **Figure 14.11**. This
    tab allows you to set what if any submenus your panel will have. You also can
    decide how long the History will be. The History in any application is a list
    of the most recently used files. For most applications in Linux and Windows the
    default is four. But you can set that to whatever you want.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '![](img/12d790664598bbf390261087fbe55bbc_310_0.png)


    Figure 14.11: Menus.


    The second tab, shown in Figure 14.12, allows you to take panel configuration
    to a much deeper level. You can select to have tooltips on your panel, a background
    image for your panel, and many other exciting things. You can even change the
    way the Start menu looks.


    ![](img/12d790664598bbf390261087fbe55bbc_310_1.png)


    Figure 14.12: The second panel screen.'
  merge: -1
  img_proc: true
- pgno: 311
  md: 'The **final section** of this application, Taskbar, shown in **Figure 14.13**,
    allows you to configure a few more settings in your panel. You can decide what
    mouse clicks on the panel will do, as well as how items will be grouped on the
    panel.


    ![](img/12d790664598bbf390261087fbe55bbc_311_0.png)'
  merge: -1
