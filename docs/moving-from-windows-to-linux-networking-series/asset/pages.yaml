    on any image. We have discussed the use of the various drop-down menus, tools,
    and the Toolbox. Each of these tools has been shown and its basic use explained.
    At this point you should be comfortable working with GIMP. The only thing you
    need now is some practice with GIMP and a bit of creative flair.


