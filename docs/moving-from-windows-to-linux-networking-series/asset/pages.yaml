    ![](img/12d790664598bbf390261087fbe55bbc_373_0.png)


    # **Figure 18.6:** The *head* command.


    The *cat* command, shown in Figure 18.7, takes two files and appends one onto
    the end of the other. This is a very commonly used shell command. There is no
