    what is going to happen and tell you a little about Red Hat. If this is your first
    time installing Linux, it is recommended that you carefully read this screen before
    pressing the Next button at the bottom of the screen. It will give you an overview
    of what the installation process will be doing.


    The next two screens are very simple. They ask what language you want to use and
    what keyboard setup you want. Select your language from the options provided.
    These steps are shown in *Figures 2.4* and 2.5. It is interesting to notice the
    plethora of languages you have to select from. Linux is now available to users
    in a variety of nations, using a wide range of languages.


