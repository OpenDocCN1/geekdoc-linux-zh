- pgno: 211
  md: '# # Working Through a Spreadsheet


    Now that you have had several pages to examine the basic features of Calc, it
    is probably an appropriate time to work through the mechanics of creating a spreadsheet
    with all of the various features we have discussed so far. For the purposes of
    demonstrating the capabilities of Calc, we will create a spreadsheet for a basic
    home budget spreadsheet. We will begin by creating a simple spreadsheet with row
    headings of Rent, Food, Utilities, Credit Cards, and Miscellaneous. We then have
    column headings for each month. You can then put in some sample data. Your spreadsheet
    should look like the one in **Figure 9.23**.


    ![](img/12d790664598bbf390261087fbe55bbc_211_0.png)


    **Figure 9.23**: The basic spreadsheet with data.


    Now we have some basic data. To the right of the last month, June, we will create
    a Sub Total column. You do this by giving that column an appropriate label. Then
    you put your cursor in the first empty cell on the row for the first category,
    Rent, and press the summation symbol. If you then put your cursor on the bottom-right
    corner of this cell and drag it down, you will copy the summation formula to all
    the subsequent rows. They will automatically be incremented to fit the various
    rows. You will have something like what you see in **Figure 9.24**.


    ![](img/12d790664598bbf390261087fbe55bbc_211_1.png)'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'Figure 9.24: Adding subtotals to your spreadsheet.


    Now, just to demonstrate the various capabilities of Calc, we will add a column
    with average values for each row. Label the next available common average, then
    click in the first available cell. Then click on the button to the left of the
    summation button, as we saw earlier in this chapter. Then select the AVERAGE function.
    You then need to specify the cells you want to average, as is shown in Figure
    9.25.


    ![](img/12d790664598bbf390261087fbe55bbc_212_0.png)


    Figure 9.25: Adding an AVERAGE function.


    Now you can simply click and drag the corner of that cell down and repeat the
    function for all the subsequent rows, just as you did previously with the summation
    function. You should be aware that the capability to click in a corner of a cell
    and drag, thus replicating the value or the formula in the cell, is also available
    in Microsoft Excel. Your spreadsheet should now look like the one shown in Figure
    9.26.


    ![](img/12d790664598bbf390261087fbe55bbc_212_1.png)


    Figure 9.26: Replicating the AVERAGE function.


    Now we can add some formatting to your spreadsheets. You should make the headings
    for the rows and columns bold. It is also important to add a chart. As we previously
    mentioned, the chart is a very important part of any spreadsheet because it adds
    a tremendous visual impact to your data. When you press the Insert Chart button,
    you will see your data highlighted automatically, and the cursor will change to
    a small chart. This means that the basic data has already been fed into a chart.
    Just click where you want it to appear. You then will be taken to a wizard that
    will create a chart for you, and it will already have the data entered. You can
    skip directly to the second screen of the wizard and select the chart type. Choose
    a bar graph. When you are done with the wizard, your spreadsheet will look like
    the one shown in Figure 9.27.'
  merge: -1
  img_proc: true
- pgno: 213
  md: '![](img/12d790664598bbf390261087fbe55bbc_213_0.png)


    **Figure 9.27: Adding a spreadsheet.**


    You can see that Calc offers most of the functionality that you are used to in
    Excel, and much of it is accomplished in the same, or at least a similar, manner.
    This means that if you are an experienced Excel user, moving to Calc should be
    easy for you. If you are not an experienced Excel user, this chapter should give
    you the basics and get you started.'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# # Configuration


    As with any application, you may want to configure Calc to suit your own preferences
    and needs. In Chapter 8, ''Moving from Microsoft Word to Open Office,'' we saw
    that configuring and customizing Writer was relatively easy, and you have a plethora
    of choices. You should not be surprised when you find a similar array of choices
    available to you in Calc. In fact, you have the same two options, Configure and
    Options, found under the Tools menu. If you look at these, they even offer nearly
    identical options to the configuration options you saw in Writer. There are really
    only two differences. When you go to Options in Calc, you have a set of options
    that are specifically for setting spreadsheet options. This is shown in Figure
    9.28.


    ![](img/12d790664598bbf390261087fbe55bbc_214_0.png)


    From this screen you can change the grid lines on your spreadsheet, set the default
    date format, and more. The other item that is different from Writer is the formula
    settings. With these settings you can change how formulas in your spreadsheet
    are formatted and sized.


    As you can see, Calc, just like Writer, is pretty customizable. You can change
    configurations and options to make the application appear and perform in a manner
    that is most effective and most appealing to you.'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# # Summary


    In this chapter, we examined various aspects of using Open Office Calc. We looked
    at data entry, data formatting, performing calculations, creating charts, and
    a variety of other spreadsheet functions. After studying this chapter, you should
    be comfortable creating basic spreadsheets with Open Office Calc.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Review Questions


    +   1. Name one feature found in Calc, not present in Microsoft Excel.

    +   2. Why might you want to add some drawing to your spreadsheet?

    +   3. What would you find on the Object toolbar?

    +   4. What is one thing that Excel and all Microsoft Office products do that
    Calc does not do?

    +   5. How would you compute the standard deviation of a column or row?

    +   6. How do you customize the toolbars in Calc?

    +   7. What is the difference using autofill on numbers and dates?


    # Answers


    +   1. The ability to insert Java applets and plug-ins.

    +   2. To add visual impact to your data.

    +   3. The Object toolbar consists a set of tools that are specific to calculation
    and cell formatting.

    +   4. Keep a recently opened files list.

    +   5. By clicking the Autopilot button and selecting the stdev function, after
    highlighting the cells you want to compute the function for.

    +   6. Right-click on the button on the toolbar.

    +   7. Dates are incremented to the next month or day, whereas numbers are simply
    incremented by one.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# ## Chapter 10: Moving from Microsoft PowerPoint to Open Office Impress


    # ## Introduction


    In the preceding two chapters you were shown how to do word processing and how
    to work with spreadsheets using Open Office. Windows users are often quite familiar
    with both Microsoft Word and Microsoft Excel. You have now seen how to accomplish
    the same tasks in Linux using Open Office. Word processing and spreadsheets are
    core functions in any business and are even quite useful in a home computing environment.
    But they are not the whole story.


    Another one of the Microsoft office applications that has been quite popular with
    Windows users is Microsoft PowerPoint. This application enables you to make dynamic
    multimedia presentations. This product originally was intended for business presentations
    and has become quite popular with salespeople and others who frequently need to
    capture an audience''s attention with a powerful and dynamic presentation. Over
    the years, PowerPoint also has become quite popular with educators. Teachers,
    instructors, and college professors often found that PowerPoint presentations
    added an entirely new dimension to their classroom lectures. This eventually led
    to students, both college and secondary school, using PowerPoint for their classroom
    presentations. Now it is quite common to see anyone who makes a presentation,
    be it sales, classroom, or neighborhood watch, use PowerPoint.


    As you make the transition to Linux, you certainly don''t want to lose the capability
    to create dynamic and exciting presentations. You have already seen that the move
    to Linux won''t cause you to lose the capability to create powerful documents
    or to work with spreadsheets. Neither will you be losing any presentation capabilities.
    One of the applications in the Open Office suite is Open Office Impress®. This
    very aptly named program helps you make the same sort of multimedia presentations
    you formerly created with Microsoft PowerPoint. In short, it is likely to impress
    both you and your audience. In fact, Open Office Impress even is able to open
    PowerPoint presentations. This means you can convert old presentations over to
    Linux.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# ## Getting Started with Impress


    The best place to start is to just dive right in. When you first launch Impress
    you will see the screen in **Figure 10.1**. You are prompted to choose whether
    you want to start with a blank presentation, use a template, or open an existing
    presentation.


    ![](img/12d790664598bbf390261087fbe55bbc_218_0.png)


    **Figure 10.1:** Getting started with Impress.


    This screen is strikingly similar to the Microsoft PowerPoint opening screen,
    shown in **Figure 10.2**. You have essentially the same choices to make. For our
    purposes we will choose a blank presentation. Later in this chapter we will revisit
    templates. Press the Create button in the bottom-right corner.


    ![](img/12d790664598bbf390261087fbe55bbc_218_1.png)


    **Figure 10.2:** Opening PowerPoint.


    You are immediately presented with the screen shown in **Figure 10.3**. From this
    screen you can choose what sort of slide you want for your first slide. As you
    can see, there are a number of options. In fact, these are the same sort of options
    you are presented with when you start a new presentation with PowerPoint. To make
    certain that you are completely comfortable with Impress, we will select the completely
    blank slide.'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# Getting Started with Impress


    ![](img/12d790664598bbf390261087fbe55bbc_219_0.png)


    **Figure 10.3:** Selecting the type of slide.


    Now you are looking at a blank screen with a number of drop-down menus and toolbars.
    The options under the File and Edit drop-down menus are the same options you have
    seen throughout Open Office. It has the basic opening, saving, closing, cutting,
    copying, and pasting options. In fact, in many applications, both Windows applications
    and Linux applications, you will find these same options in the same locations.
    As you have already noted and we have already discussed, File and Edit menus are
    pretty much the same in most applications.


    Let’s begin our examination with those options that are not common to all of Open
    Office applications. If you select View from the drop-down menu, you will see
    the image in **Figure 10.4**. You can see that there are several options here.
    The first that you should note is Toolbars. You can select which toolbars are
    visible and which are not.


    ![](img/12d790664598bbf390261087fbe55bbc_219_1.png)


    **Figure 10.4:** The View drop-down menu.


    After that you can see that you can elect to have the ruler and the status bar
    visible or not. The next option is the Master View. This will enable you to select
    how your workspace appears to you. There are several options under this heading,
    including Drawing View, Outline View, Slides View, and Notes View. Each of these
    gives you a different view of your project. Usually, people use the Drawing or
    Outline view while working on a project. The Slides view enables you to see all
    of your slides in sequence and to drag and drop slides so that you can change
    their order. The Notes view shows the notes for your presentation.


    The next item in the drop-down menu is the Insert menu, shown in **Figure 10.5**.
    This option enables you to insert a new slide into your presentation, a duplicate
    of the current slide, a field, a hyperlink, a spreadsheet, a graphic, or an object.
    Each of these can help make your presentation much more dynamic and informative.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '![](img/12d790664598bbf390261087fbe55bbc_220_0.png)


    **Figure 10.5:** The Insert menu.


    Next is the Format menu, shown in Figure 10.6. This is a very extensive menu that
    offers you a number of options for altering the format of various elements in
    your presentation. You can format entire lines, text sections, characters, paragraphs,
    a slide’s layout, or even add three-dimensional effects.


    ![](img/12d790664598bbf390261087fbe55bbc_220_1.png)


    **Figure 10.6:** The Format menu.


    The Tools menu, shown in Figure 10.7, is similar to the Tools menu in Open Office
    Writer or the one in Microsoft PowerPoint. It enables you to perform spell checking,
    set options for Impress, or configure your presentation. We will examine the options
    and configuration settings in more detail a little later in this chapter.


    ![](img/12d790664598bbf390261087fbe55bbc_220_2.png)


    **Figure 10.7:** The Tools menu.


    The next menu option, and the last that we will examine for now, is the Slide
    Show menu, seen in Figure 10.8. This menu is almost identical to the Slide Show
    menu found in Microsoft PowerPoint. This menu option enables you to set the various
    settings for your presentation. You can set timings, establish transitions between
    slides, and more. We will look at this option more extensively as we continue
    in this chapter.


    ![](img/12d790664598bbf390261087fbe55bbc_220_3.png)


    **Figure 10.8:** The Slide Show menu.'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'Next you should direct your attention to the toolbar at the left of the screen
    and shown in Figure 10.9. This toolbar has a number of interesting tools that
    enable you to create some dynamic features in your presentation.


    ![](img/12d790664598bbf390261087fbe55bbc_221_0.png)


    The first tool on the toolbar that you should look closely at is the Text tool.
    It looks like a capital letter T. Even though Open Office Impress is not a word
    processor, you will probably want to add text to your presentations. You do this
    by using the Text tool. Click on it and a small box will appear on your slide.
    As you type text, your box will resize to accommodate the additional text. You
    will then have something like what is shown in Figure 10.10A. You can drag the
    box with your mouse to any place on your slide you would like it.


    ![](img/12d790664598bbf390261087fbe55bbc_221_1.png)


    The next three tools, shown in Figure 10.10B, enable you to make shapes. The first
    is for rectangular shapes, the second for circular shapes, and the third for three-dimensional
    shapes.


    ![](img/12d790664598bbf390261087fbe55bbc_221_2.png)


    When you click and hold on any of these three tools, you are shown several options.
    For example, with the rectangular tool you can have your shape filled, unfilled,
    rounded, and so on. This is shown in Figure 10.11.


    ![](img/12d790664598bbf390261087fbe55bbc_221_3.png)


    Once you have selected the shape you want, you drag your mouse across the slide,
    and that shape will be drawn. A few shapes from each of the three Shape tools
    are shown in Figure 10.12.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/12d790664598bbf390261087fbe55bbc_222_0.png)


    **Figure 10.12:** Examples of shapes.


    You can see that adding interesting shapes to your slide is a very easy task using
    Open Office Impress. Using Microsoft PowerPoint, you accomplish the same task
    by using either the Shape tools on the toolbar at the bottom of your screen, or
    by choosing Insert from the drop-down menu and selecting Pictures, then choosing
    AutoShapes. Both Open Office and Microsoft Office make creating shapes a very
    simple task.


    The next two tools enable you to create curves and lines. With Microsoft PowerPoint
    this is accomplished either by using the AutoShape option found under Insert.
    Pictures, or by using the Line tool at the bottom of the screen. With Impress
    you use the two buttons on the left toolbar, shown in *Figure 10.13*.


    ![](img/12d790664598bbf390261087fbe55bbc_222_1.png)


    **Figure 10.13:** The line and curve tools.


    Much like the shape tools previously described, the line and curve tools have
    a number of options for altering a line or curve. This enables you to make numerous
    lines and curves like the ones shown in *Figure 10.14*.


    ![](img/12d790664598bbf390261087fbe55bbc_222_2.png)


    **Figure 10.14:** Types of lines and curves.


    As you can see, there are a number of options you can use to enhance the appearance
    of your presentation. Of particular interest to business users might be the arrows.
    These can be crucial to creating organizational charts, flow charts, and other
    diagrams needed to demonstrate various concepts.


    You can alter any of the shapes, lines, or curves after they have been placed
    on the slide. If you right-click on a shape, curve, or line, you will see a pop-up
    menu like the one shown in *Figure 10.15*.


    ![](img/12d790664598bbf390261087fbe55bbc_222_3.png)


    **Figure 10.15:** Pop-up menu.


    With this menu, you can change the position, type, style, and more for any shape
    or line. You can even add effects. Effects determine how the item will appear
    on your slide when you run the slide show. Effects will be treated in some detail
    later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 223
  md: '![](img/12d790664598bbf390261087fbe55bbc_223_0.png)'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# ## Creating a Basic Slide Show


    Now that we have spent several pages discussing the fundamentals of using Open
    Office Impress and comparing it to Microsoft PowerPoint, it is time to walk through
    an Impress presentation with a few slides. You are encouraged to follow along
    and do this exercise. We will be examining a fictitious company, Pete''s Linux
    Widgets, and doing a sales presentation for that company. The same techniques
    could readily be applied to creating a presentation for a club, church, class
    assignment, or dozens of other applications.


    We will begin by launching Impress and selecting the blank presentation. You will
    then be prompted to select your first slide. Earlier, when we were touring the
    fundamental functionality of Impress, we used a blank slide. This time we will
    use the second slide option, Title Slide, shown in Figure 10.16.


    ![](img/12d790664598bbf390261087fbe55bbc_224_0.png)


    **Figure 10.16**: Inserting a title slide.


    You can then click on one of the boxes on the slide and enter your text. For our
    example we will enter some information for our Linux Widget company. You can see
    this in Figure 10.17.


    ![](img/12d790664598bbf390261087fbe55bbc_224_1.png)


    **Figure 10.17**: Inserting text into the title slide.


    You can highlight any text and change its font, color, and other properties, just
    as you would in Microsoft Office. This enables you to create more interesting
    slides. As you can see in Figure 10.17, we used some different font properties.
    You can accomplish this by dragging your mouse across the text to highlight it
    and then selecting Format from the drop-down menu. Then you will select Character,
    and you can then change the font, size, color, and more.


    This makes the title slide for our presentation. Let''s add another slide. If
    you select Insert from the drop-down menu and then choose New Slide, you will
    again be prompted to select the type of slide you want. We are going to select
    the slide that has a chart and a title, as you see'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'in **Figure 10.18**.


    ![](img/12d790664598bbf390261087fbe55bbc_225_0.png)


    **Figure 10.18**: A slide with a chart.


    You can then click on the title to add some text and click on the chart to start
    the Chart Wizard to create a chart. You have probably noticed by now that the
    Chart Wizard is much the same in all the various Open Office applications. In
    our case we are going to add a few simple pieces of data. Remember that once you
    have a chart, you right-click on it and choose Chart Data from the pop-up menu.
    When we are done, our chart looks something like what you see in **Figure 10.19**.


    ![](img/12d790664598bbf390261087fbe55bbc_225_1.png)


    **Figure 10.19**: The chart slide completed.


    Now we are going to add the effects mentioned earlier in this chapter. To add
    an effect to any object, just click on it once to make certain it is the object
    with focus, then go to the drop-down menu and choose Slide Show, then Effects.
    In this case we are going to add effects to the chart. You will see a screen like
    the one shown in **Figure 10.20** where you will select the effect you want to
    add.


    ![](img/12d790664598bbf390261087fbe55bbc_225_2.png)


    **Figure 10.20**: Adding effects.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'You can select any effect you want. You then click the button with the checkmark
    to add that effect to that object. You have a button in the upper-right corner
    of the Effects window that will preview that effect for you.


    Now we are going to add another slide. This time we will pick one with a title
    section, bulleted list section, and a graphic section. We then will click on each
    of the objects, adding text, items, or images until the slide looks similar to
    what you see in Figure 10.21.


    ![](img/12d790664598bbf390261087fbe55bbc_226_0.png)


    **Figure 10.21:** The third slide.


    You can continue adding as many slides with charts, images, effects, and anything
    else as you want. As a design tip, remember to keep your audience in mind. A presentation
    to a group of elementary school students should probably contain lots of effects
    and movement. Make it as dynamic as possible. On the other hand, a presentation
    to your city council would probably need to be much more subdued but inundated
    with data.


    Now that you have created a simple slide show, how do you show it? We will examine
    how to set up your slide show’s presentation in the next section.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# Setting Up Your Slide Show


    Once you have created your presentation, you will need to run it. A presentation
    is not much use unless you present it. If you have used Microsoft PowerPoint,
    you should have no trouble setting up your slide show with Impress. This is because
    Open Office Impress runs a slide show the same way that PowerPoint does. If you
    choose the Slide Show option from the drop-down menu, you will see a list of choices
    like the ones displayed in *Figure 10.22*.


    ![](img/12d790664598bbf390261087fbe55bbc_227_0.png)


    **Figure 10.22:** Slide Show choices.


    The first choice, labeled Slide Show, will run your slide show. Nothing will occur
    until you click your mouse. Each mouse click will cause the next action to occur.
    That action might be an effect on an object or perhaps a change to a new slide.
    Some people prefer to do their presentations in this manner. That way they don''t
    have to time their speaking closely, since they will change the slide themselves
    whenever they reach an appropriate point in their presentation.


    The second option, Rehearse Timings, works the same way, but a small timer shows
    at the bottom, enabling you to see exactly how long each action takes. It should
    be noted that in Microsoft PowerPoint, the Rehearse Timings option records the
    actions you take when walking through the presentation and will later play back
    the presentation automatically at that speed. Open Office Impress does not support
    this functionality.


    The next option is Slide Show Settings. When you select this, you will be presented
    with the Settings screen, seen in *Figure 10.23*, and you can set various settings.
    You can change the mouse pointer, decide whether or not the Navigator should be
    visible, and choose whether or not to make the presentation show on top of all
    other application windows that might be open at that time.


    ![](img/12d790664598bbf390261087fbe55bbc_227_1.png)


    **Figure 10.23:** The Slide Show Settings window.


    The Animation and Custom Slide Show options are somewhat advanced and a bit beyond
    the scope of an introductory text, so we will be skipping them here. However,
    the [www.openoffice.org](http://www.openoffice.org) Web site has resources on
    these and other Open Office options. We have already worked with the Effects option.


    The last option we will look at is Slide Transitions. When you choose this you
    will be presented with the window shown in *Figure 10.24*. This is quite similar
    to the Effects screen. Here you can decide how one slide will transition into
    the next. Instead of just having one disappear and the next appear, you can have
    slide-ins, fade-ins, and such. Essentially, you have all the slide transition
    options you are used to in Microsoft PowerPoint.'
  merge: -1
  img_proc: true
- pgno: 228
  md: '![](img/12d790664598bbf390261087fbe55bbc_228_0.png)


    **Figure 10.24:** Slide transitions.'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# # Formatting and Configuring


    Just as with Microsoft Office and other Open Office applications you have worked
    with, you can configure and change Open Office Impress to suit your needs and
    preferences. If you choose **Tools** from the drop-down menu and select **Configure**,
    you will see an image much like that shown in *Figure 10.25*.


    ![](img/12d790664598bbf390261087fbe55bbc_229_0.png)


    This screen, as you can see, has several tabs that enable you to customize what
    menu items you see, what shortcut keys there are, what toolbars are displayed,
    and more. This screen is useful in helping you to reconfigure Open Office Impress
    to meet your individual preferences.


    The other option we are going to examine is *Options*, also found under the **Tools**
    drop-down menu. This screen, shown in *Figure 10.26*, is replete with numerous
    options that enable you to set the behavior of Open Office Impress. For most readers,
    leaving the defaults will be adequate. The author works with default settings,
    but people often have different tastes, and you might find you want to change
    certain things. Any configuration options will be found within these two menu
    choices in the **Tools** menu.


    ![](img/12d790664598bbf390261087fbe55bbc_229_1.png)'
  merge: -1
  img_proc: true
- pgno: 230
  md: "# ## Templates\n\nIf you have ever used Microsoft PowerPoint, then you are\
    \ familiar with templates. A template is a preset layout for a presentation. The\
    \ layout, graphics, and design are already done, and you have to put in your text\
    \ and images. Open Office has this same capability. You need to go out on the\
    \ Web and download templates, which are free. The following list, while certainly\
    \ not exhaustive, will give you a place to start in finding and downloading Open\
    \ Office templates. The directory you installed Open Office into will have a subdirectory,\
    \ `\\share\\template`, where you should place all templates.\n\n+   - http://csip.ece.gatech.edu/Information/StarOffice_Templates/index.shtml\n\
    +   \n+   - http://whiteboard.openoffice.org/doc/Samples_Templates/User/template/\n\
    +   \n+   - www.getopenoffice.org/templates.html\n+   \n+   - www.ex.ac.uk/~knackaer/ooo.htm\n\
    \n**Note** Some of these templates will be in compressed files, TAR for Linux,\
    \ ZIP for Windows. You will need to uncompress them.\n\nAfter you have downloaded\
    \ these templates, you will need to use an Open Office utility to include them\
    \ in your applications. If you look under Open Office in the Start menu, you will\
    \ see an application named Global. We will discuss this application a bit more\
    \ in Chapter 11, “Other Open Office Applications,” but for now you need to know\
    \ that this is the appropriate utility for incorporating templates. Once you launch\
    \ that utility, go to File, choose Templates, and select Organize. You will see\
