  md: "# Getting Input from the User\n\nAs was previously mentioned, variables will\
    \ often get their values from user input. We need some method to take the data\
    \ that the user types in at the keyboard and put it into the variables in our\
    \ script. The vehicle for accomplishing this is the read statement. The read statement\
    \ takes whatever is typed in, up to the point of the user pressing the Enter key,\
    \ and puts that value into the designated variable. The following is an example\
    \ of the syntax:\n\n```\nsomevariable= \nread somevariable\n```\n\nLet's examine\
    \ a script that has the user enter data and uses the echo statement to print the\
    \ data to the screen. Type the following into your favorite text editor and save\
    \ it as scriptsix.sh:\n\n```\n#! /bin/bash\nlastname=smith\nfirstname=john\necho\
    \ Please type in your first name\nread firstname\necho Please type in your last\
    \ name\nread lastname\necho\necho Hello $firstname $lastname it is good to meet\
    \ you.\nexit 0\n```\n\nWhen you run this script you should see something similar\
    \ to what is shown in Figure 20.11, although your display will vary, of course,\
    \ depending on the name you enter.\n\n![](img/12d790664598bbf390261087fbe55bbc_412_0.png)\n\
    \nFigure 20.11: Getting user input.\n\nYou see this is a rather friendly script!\
    \ It also demonstrates how to create a variable and how to fill that variable\
    \ with data the user provides. Notice that when we display the values of the variables\
    \ to the screen, we get the values the user typed in, not the initial values we\
    \ put in our script. The contents of the variables were overwritten by the data\
    \ the user entered. If you will recall, we stated earlier that they are called\
    \ variables because their content can vary."
  merge: -1
  img_proc: true
- pgno: 413
  md: '# Math in Scripts


    In addition to getting input from the user, you often will want to perform some
    basic arithmetic operations. This is a place where scripts can be particularly
    useful. If you have some calculations you need to perform on a regular basis,
    you can use a script to automate that task. The generic syntax used is this:


    ```

    expr operator1 math-operator op2

    ```


    For example, you can add two numbers by typing in


    ```

    expr 20 +2

    ```


    The math you can do in a Linux shell script is very limited. Essentially you can
    do very simple arithmetic operations on two operators. One or both of the operators
    can be a variable, so you could write a script that asks the user for two numbers
    and adds or subtracts them. For more advanced math you will need a more advanced
    scripting language, and that is beyond the scope of this book. However, let’s
    take a moment to look at a script that does use the limited math capabilities
    available. Type the following into the text editor of your choice and save it
    as scriptseven.sh:


    ```

    ```

    #!/bin/bash

    numone=0

    numtwo=0

    echo Please enter the first number

    read numone

    echo Please enter the second number

    read numtwo

    echo $numone added to $numtwo is `expr $numone + $numtwo`

    exit 0

    ```

    ```


    When you run this script, you should see something much like what is displayed
    in Figure 20.12.


    ![](img/12d790664598bbf390261087fbe55bbc_413_0.png)


    Admittedly this is not particularly advanced math or even very interesting! But
    it does illustrate the very basic arithmetic capabilities of a Linux shell script.
    You may have noticed what appear to be single quotes on each side of the expr
    $numone + $numtwo statement. These are not actually single quotes, they are backquotes.
    On most keyboards, to the left of the number one key, you will see a key that
    has a `~` and a `` ` `` mark. The first is called a tilde, and the second is the
    backquote. It is imperative that you use the backquote rather than the single
    quote that is to the right of your colon/semicolon key.'
  merge: -1
  img_proc: true
- pgno: 414
  md: '# # if Statements in Scripts


    In any programming or scripting language, you need to take alternative actions
    depending on some input. If some condition is true, then execute one set of code,
    and if it''s not, execute a different set. The following is a generic example
    of the syntax used:


    ```

    ```

    if condition

    then

    condition is zero (true - 0)

    execute these commands


    else

    if condition is not true then

    execute these commands

    fi

    ```

    ```


    > **Note** `fi` indicates a finished `if` statement.


    Let''s look at a script that illustrates this. In your favorite text editor, enter
    the following lines and save it as `scripteight.sh`:


    ```

    ```

    #!/bin/bash

    num=0

    echo Please enter an integer

    read num

    if test $num -gt 0

    then

    echo $num is positive

    else

    echo $num is a negative number

    fi

    exit 0

    ```

    ```


    If you run this script from the shell, you should see something similar to what
    is displayed in Figure 20.13.


    ![](img/12d790664598bbf390261087fbe55bbc_414_0.png)


    There are several items in this particular script that we need to pay attention
    to. The first line that is different from what we have previously seen is `if
    test $num -gt 0`. This line says to see if the variable `num` is greater than
    (gt) zero. If it is, then proceed to the code found under the `then` statement.
    If it is not, then proceed to the code found under the `else` statement. Complete
    the `if` with the `fi` statement.


    The `if` statement is a construct that is common to virtually all scripting and
    programming languages. Whether you are doing a Linux shell script, a Windows batch
    file, a JavaScript, or a C++ program, you will have `if` statements that follow
    essentially the same structure as you see here. The syntax will be a bit different
    from one language to the next, but the basic structure is essentially the same.


    You also can have an entire `if` statement, including the `fi`, inside of another
    `if` statement. These are referred to as **nested `if`** statements. If you think
    about this for a moment, it''s not so strange. You use nested `if` statements
    in your day-to-day thinking. For example, before going to work in the morning,
    you might say to yourself that if the freeway is busy, take a side route. Then
    if the freeway is busy, you'
  merge: -1
