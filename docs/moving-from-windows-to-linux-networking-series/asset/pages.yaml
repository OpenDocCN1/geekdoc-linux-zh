- pgno: 111
  md: '# Accessibility


    The term *accessibility*, in the world of information technology, generally refers
    to making a system more accessible to individuals with some disability. This can
    be anything from incorporating sound queues, text to speech, or large icons for
    the visually impaired to using text rather than sound for the hearing impaired.
    Microsoft Windows XP has made accessibility a prominent feature of its operating
    system. If you look under Start, Programs, Accessories, you will see a group called
    Accessibility. It has several options as shown in Figure 5.24.


    ![](img/12d790664598bbf390261087fbe55bbc_111_0.png)


    **Figure 5.24**: Microsoft Accessibility options.


    Microsoft provides several features to make your PC more accessible to people
    with various disabilities. One such feature is the Magnifier. When you use this,
    you can put your mouse over any area of the screen and that portion of the screen
    will be magnified. This is very useful to visually impaired users. If a user is
    even more seriously visually impaired, you can turn on the Narrator, which will
    read all written commands or captions that the user passes his mouse over, provided
    the application running is designed to work with Windows Accessibility features.


    As you can probably guess, Linux also offers some accessibility features to users
    using the KDE interface. You get to the Accessibility control panel by going to
    Preferences and selecting Personalization, and then choosing Accessibility. You
    will then see something like the screen shown in Figure 5.25.'
  merge: -1
  img_proc: true
- pgno: 112
  md: '![](img/12d790664598bbf390261087fbe55bbc_112_0.png)


    **Figure 5.25:** KDE Accessibility control panel.


    The first option that really stands out is that you can select to use an audible
    or a visual bell for system alerts. You have probably heard your computer beep
    or make a similar sound when certain events occur. This can be a very useful cue
    to a person unless that person is hearing impaired. With KDE you can set up visual
    bells so that a hearing-impaired person can still receive system alert notifications.


    The second tab of the KDE Accessibility control panel enables you to change how
    the keyboard will react. One such feature is sticky keys. You are probably familiar
    with commands executed by entering more than one key simultaneously. For example,
    in most programs the shortcut key to copy is Ctrl-C pressed simultaneously. Some
    people are unable to press multiple keys simultaneously. Sticky keys causes the
    machine to remember any key press for a few seconds and put it with the subsequent
    key press if the combination creates a command the software recognizes.


    Another accessibility feature that KDE offers is Bounce Keys. Have you ever meant
    to press a key once but accidentally pressed it two or more times? This is referred
    to as bouncing. With Bounce Keys turned on, the software will ignore the second
    press of the same key if it occurs within a specified number of seconds. You set
    this specified number of seconds by setting the delay. KDE enables you to set
    it in milliseconds (thousandths of a second).


    The third tab enables you to control the mouse using the numeric pad. Some people
    may lack the motor skills required to operate a mouse, and you can set up your
    Linux machines so that they can still use the mouse, via the number pad. On this
    screen you set the speed of response and any other factors that affect mouse performance.
    These settings will take some experimentation to find the right settings for a
    particular person.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Other Office Applications


    Perhaps the most commonly used Windows application is Microsoft Office. This suite
    of applications contains word processors, spreadsheets, presentation tools, database
    management systems, and more. We have already examined some alternative word processors
    available with the KDE interface. We have also mentioned that several chapters
    later in this book are devoted to Open Office, an office suite that is distributed
    as open source and free of charge. However, there are some other interesting office
    applications that ship with KDE that are not part of Open Office and are not word
    processors. Let''s examine a few of them. Recall that if you encounter any application
    in the text that is not included on your system, you can go to Add and Remove
    Programs and add it.


    # GNU Cash


    Like many Windows users, you might currently use a product such as Microsoft Money
    or Quicken to handle your various financial accounts. The KDE interface includes
    a money management application called GNU Cash. GNU Cash is a very interesting
    open source program that is used to manage personal finances. It has a number
    of exciting features that we will examine. You can manage all of your personal
    accounts via GNU Cash. This includes savings accounts, checking accounts, 401(k)
    accounts, mutual fund accounts, and more. When you first launch GNU Cash, you
    will see something much like what is shown in Figure 5.26.


    ![](img/12d790664598bbf390261087fbe55bbc_113_0.png)


    Figure 5.26: The GNU Cash opening screen.


    If you choose New Accounts, GNU Cash will take you through a very user-friendly
    wizard that will help you set up your accounts. The first screen of that wizard
    is shown in Figure 5.27. Notice that some Linux software refers to certain wizards
    or utilities as "druids." This is one more example of the quirky sense of humor
    common to the Linux community.'
  merge: -1
  img_proc: true
