- pgno: 312
  md: '# # GNOME Toastmaster


    In this modern day of computing, many people have a CD writer, also often called
    a CD burner, on their PC. They often want to save files and even back up important
    information by burning it to a CD. To do this you will need two things. The first
    is the appropriate CD writer hardware installed on your computer. The second is
    some sort of CD writer software. GNOME Toastmaster is a CD writing application,
    and it is shown in **Figure 14.14**.


    ![](img/12d790664598bbf390261087fbe55bbc_312_0.png)


    **Figure 14.14: GNOME Toastmaster.**


    You drag files from the directory at the top to the small box at the bottom right.
    When all the files you want to write to a CD are collected, you are ready to create
    your CD. You click the Record button on the toolbar at the top. As with many applications,
    you can alter the way this one behaves in order to suit your individual needs
    or preferences. The configuration screen is found by going to Edit and Preferences
    and is shown in **Figure 14.15**.


    ![](img/12d790664598bbf390261087fbe55bbc_312_1.png)


    **Figure 14.15: Configuring GNOME Toastmaster.**'
  merge: -1
  img_proc: true
- pgno: 313
  md: 'The various tabs allow you to configure several different types of settings.
    There are a number of settings you can change here, but most of them are rather
    complicated and you are probably better off leaving the default settings.


    ![](img/12d790664598bbf390261087fbe55bbc_313_0.png)'
  merge: -1
  img_proc: true
- pgno: 314
  md: '# # Video and Multimedia


    We previously talked about some sound applications that come with Red Hat Linux,
    and we just recently discussed how to create your own CDs. Now we will go into
    video and multimedia applications. It is very common today to be able to download
    and view movie clips from the Internet. Often movie producers will release short
    clips of an upcoming movie as a way of generating excitement about the movie.
    You will also occasionally find manufacturers that will put out how-to videos
    on the Internet. For that reason, being able to play video files is very important
    if you truly want to get the maximum efficiency out of your Internet experience.


    Under the **Sound and Video** category, in the subcategory **Other Sound and Video
    Applications**, you will see an item entitled Multimedia Player. This is much
    like Windows Media Player or QuickTime. It allows you to open and play a variety
    of video formats. This application is shown in **Figure 14.16**.


    ![](img/12d790664598bbf390261087fbe55bbc_314_0.png)


    **Figure 14.16: The Multimedia Player**.


    This application will allow you to play WAV sound files, MPEG3 video files as
    well as other multimedia file formats. Like all the applications we have looked
    at, this one can be configured to your personal tastes. Go to **Settings** and
    select **Configure**, and you will be looking at a screen very similar to the
    one you see in **Figure 14.17**.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '![](img/12d790664598bbf390261087fbe55bbc_315_0.png)


    **Figure 14.17:** Configuring the Multimedia Player.


    From this screen you can configure the default directory for downloading and playing
    files, you can set up plug-ins that allow you to play other multimedia formats,
    and more. The third tab of the Plugins screen, shown in **Figure 14.18**, shows
    some sample multimedia effects.


    ![](img/12d790664598bbf390261087fbe55bbc_315_1.png)


    **Figure 14.18:** Configuring the Multimedia Player''s look.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Kandalf’s Tips


    This is a very useful application for the Linux beginner. Kandalf’s Tips, shown
    in Figure 14.19, will show you all of the various tips that you might normally
    see when the system starts up. You can peruse these tips and learn many interesting
    things about Linux. For any beginner, it is a very good idea to spend a bit of
    time perusing these tips.


    ![](img/12d790664598bbf390261087fbe55bbc_316_0.png)


    **Figure 14.19:** Kandalf’s Tips.'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# ## Digital Camera Tool


    If you look under the Graphics category, you will find a Digital Camera tool.
    This tool can interface with a digital camera, including a Web camera, that you
    might have attached to your computer. This application, shown in Figure 14.20,
    is relatively easy to use.


    ![](img/12d790664598bbf390261087fbe55bbc_317_0.png)


    Figure 14.20: The Digital Camera tool.


    The first step is to set up a camera. To do this you must first have the camera
    attached to your computer. Then you can go to Camera and select Add Camera. You
    will see the screen shown in Figure 14.21. You can enter all of the specific details
    about your camera here, or you can press the Detect button and have the application
    attempt to detect your camera.


    ![](img/12d790664598bbf390261087fbe55bbc_317_1.png)


    Figure 14.21: Configuring your camera.


    Once your camera is connected and configured, when you take shots with it, they
    will appear in this application, and you can then choose to save or delete them.
    And of course if you do save them on your PC, you can use one of the other applications
    we have covered in this book to either e-mail or fax the picture to any interested
    parties.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# ## Adding Packages


    This process was briefly discussed in Chapter 6, “Linux Administration from KDE,”
    but will be discussed again here, in more depth this time. Adding and removing
    packages is a critical skill that you will absolutely need in order to able work
    with Linux successfully. It is entirely possible that you might find that there
    were applications you need but did not install. Conversely, you may have installed
    applications you find you no longer need. Fortunately, in KDE you can easily add
    or remove packages. Go to the Start menu, select System Settings, and choose Package
    Management. The computer will then take a little time determining what is already
    installed on your computer. How long this takes will depend on how fast your computer
    is. You will then see something much like what is depicted in Figure 14.22.


    ![](img/12d790664598bbf390261087fbe55bbc_318_0.png)


    You scroll up and down to see what packages you have installed. If there is an
    entire group you want to add, then click the checkmark beside it. If you want
    to add only one application in a group, click on the word Details to the right
    of that package and you will see a screen like the one shown in Figure 14.23 that
    shows all the applications in that package. Check the check box beside the application
    you want to add.'
  merge: -1
  img_proc: true
- pgno: 319
  md: '![](img/12d790664598bbf390261087fbe55bbc_319_0.png)


    **Figure 14.23:** Adding applications.


    Now click the **Update** button and you will see a screen like the one shown in
    **Figure 14.24**. The utility is seeing how many packages and applications you
    selected and how much space they will take up. When it''s done, it will give you
    a summary of what you selected and you click OK.


    ![](img/12d790664598bbf390261087fbe55bbc_319_1.png)


    **Figure 14.24:** Preparing to install.


    After a few moments you will be prompted to insert the appropriate installation
    disk, and your packages will be added. As you can see, adding new applications
    or entire groups of applications is not hard at all. Deleting them is just as
    easy. Uncheck the group or application you want to remove, then press the **Update**
    button. The only difference is that you will not be prompted to insert any disks
    when removing applications.


    You also can enable your system to automatically download and install the latest
    updates from Red Hat (assuming you are using the Red Hat distribution). This is
    a really useful feature of Red Hat and will keep your system up to date. This
    requires you to register your system with Red Hat (and that process is free).
    The Red Hat page on this subject, with complete instructions, can be found at
    *www.redhat.com/docs/manuals/RHNetwork/ref-guide/3.2/intro.html*.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# # Utilities


    There are a number of small but useful utilities you will find in Linux. Let''s
    take a moment to look at just a few of them here. Hopefully, after reading this,
    you will have found at least one that will prove useful to you.


    # ## KFind


    In Windows 2000 and Windows XP you have probably seen the Search option under
    the Start menu. This option is used to search the drives and folders for files
    matching given criteria. Linux has a very similar option called KFind. The KFind
    utility, shown in **Figure 14.25**, works in much the same way.


    ![](img/12d790664598bbf390261087fbe55bbc_320_0.png)


    **Figure 14.25:** The KFind utility.


    As you can see, you enter the filename, select the directory you want to look
    in, and click Find. However, you can customize your search by using some of the
    options on the other tabs. For example, on the Contents tab, shown in **Figure
    14.26**, you can look only in certain types of files containing the provided text.'
  merge: -1
  img_proc: true
- pgno: 321
  md: '![](img/12d790664598bbf390261087fbe55bbc_321_0.png)


    **Figure 14.26:** Refining your search.


    There are several ways you can continue to refine your search in a variety of
    interesting ways. This tool can be very valuable. If you are anything like the
    author, you will periodically forget where you have placed a file! You could then
    benefit from this search utility.


    # GDM Setup


    Throughout this book the login screen has been referred to several times. You
    have been admonished to go to the Session section to alter what desktop environment
    you are using. But you may not have realized that you can even customize this
    login screen to suit your individual tastes and preferences. To accomplish this,
    you go to the Start menu, choose System Settings, and select Login Screen. You
    will then be looking at a screen much like the one shown in **Figure 14.27**.


    ![](img/12d790664598bbf390261087fbe55bbc_321_1.png)


    **Figure 14.27:** GDM Setup.


    As you can see, there are a number of settings you can alter even on this first
    tab. You can select whether or not to have a graphical screen for login. Most
    users will probably prefer this. You can then select to have the system automatically
    log on after a certain waiting period. You'
  merge: -1
  img_proc: true
- pgno: 322
  md: 'can even choose whether or not to use the 24-hour clock.


    The second tab allows you to configure the Standard Greeter. You can see this
    tab in Figure 14.28. On this screen you can select to have the Standard Greeter
    use a solid color background, an image background, or no background at all. You
    also can select what greeting to use.


    ![](img/12d790664598bbf390261087fbe55bbc_322_0.png)


    Figure 14.28: The Standard Greeter tab of GDM Setup.


    The third tab, shown in Figure 14.29, allows you to configure the graphical greeting
    the way you configured the standard greeting. You can select a theme for your
