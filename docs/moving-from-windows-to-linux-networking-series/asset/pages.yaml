- pgno: 27
  md: '# Getting Started


    ![](img/12d790664598bbf390261087fbe55bbc_27_0.png)


    The next step is to select packages. A *package* is a logical grouping of a number
    of separate applications. The various applications that you can install with Linux
    are grouped so that you can easily pick the set of applications you are most likely
    to need, depending on how you intend to use the machine. Your choice of packages
    will determine what software gets installed on your PC. The options are:


    +   - Personal Desktop

    +   - Workstation

    +   - Server

    +   - Custom


    Each of these is designed for a specific type of user. These various package configurations
    are summarized in [Table 2.1](#).


    Table 2.1: Installation Packages

    | Package | Contents/Purpose |

    | :--- | :--- |

    | Personal Desktop | This includes things the average home user would want, including
    Internet software such as Web browsers and e-mail clients. It also includes graphics
    programs and games. |

    | Workstation | This is intended for the business user and includes productivity
    tools such as Open Office. |

    | Server | This option is for servers. It will install a Web server, an FTP server,
    an e-mail server, and other server software. |

    | Custom | This option allows you to pick any packages you want to install. |


    Each of these packages is provided to make installation for a certain type of
    machine simple. However, this simplicity comes at a cost. If you choose Personal
    Desktop or Workstation, you will not be installing the Web server, FTP server,
    or other server packages. Conversely, if you select Server, you will not be installing
    many personal use items such as games. Since each of the preset options has some
    limitations, for our purposes we will choose Custom because we want several elements
    drawn from more than one package. When you select Custom, you will be prompted
    during the installation to select individual packages and applications to install.
    Later in this chapter we will cover the options you should select. For now, select
    Custom. This screen is shown in Figure 2.8.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '![](img/12d790664598bbf390261087fbe55bbc_28_0.png)


    **Figure 2.8:** Selecting packages.


    The next screen will take you into the process of disk partitioning. This is probably
    the most important and complex part of the installation. As such, it warrants
    a separate part of this chapter, which will explain exactly what disk partitions
    are and how to partition.'
