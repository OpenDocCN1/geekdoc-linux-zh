- pgno: 416
  md: "# # Loops in Scripts\n\nFrom time to time anyone who writes scripts will find\
    \ an occasion to repeat a set of commands for a certain number of times. This\
    \ is referred to as a *loop*. The type of loop used most often in Linux shell\
    \ scripts is the *for* loop. The general concept of a *for* loop is *for as long\
    \ as some condition is true, keep looping*. The general concept of a *while* loop\
    \ is similar. It is *while some condition is true, keep looping*.\n\nThere are\
    \ a few rules that apply to all loops in shell scripts.\n\n+   - The variable\
    \ used in the loop condition must be initialized before execution of the loop\
    \ begins.\n+   - A test to see if the loop's conditions are met is made at the\
    \ beginning of each iteration.\n+   - The body of a loop ends with a statement\
    \ that modifies the value of the test variable.\n\nThe basic syntax of a *for*\
    \ loop is this:\n\n```\n```\nfor { variable name } in { list }\ndo\n\n    execute\
    \ one for each item in the list until the list is\n    not finished (and repeat\
    \ all statement between do and done)\ndone\n```\n```\n\nLet's take a look at a\
    \ script that illustrates the *for* loop. Type the following lines into the text\
    \ editor of your choice and save it as `scriptten.sh`:\n\n```\n```bash\n#!/bin/bash\n\
    echo Count down\nfor i in 1 2 3 4 5\ndo\n    echo $i\ndone\necho blast off!\n\
    exit 0\n```\n```\n\nIf you run this from the shell, you should see something like\
    \ what is displayed in Figure 20.15.\n\n![](img/12d790664598bbf390261087fbe55bbc_416_0.png)\n\
    \n**Figure 20.15**: *The* for *loop*.\n\nYou can see that a *for* loop is simple.\
    \ Take a variable named *i* and count through the numbers 1 through 5, assigning\
    \ that variable to *i* in each loop. Each time, *echo* that value to the screen.\
    \ In other words, take the variable *i*, start it off with a value of 1, and keep\
    \ incrementing through a value of 5."
  merge: -1
  img_proc: true
