- pgno: 383
  md: '# ## Chapter 19: System Administration from the Shell


    # ### Introduction


    In one of the previous chapters we examined Linux system administration from within
    the KDE interface. While it is true that administering your Linux machine from
    a graphical desktop environment is easy and quite convenient, it is important
    for you to be aware that many Linux administrators prefer using shell commands
    for system administration. There are several reasons for this. The first being
    that, once you become comfortable working with the shell, you often can accomplish
    tasks much faster than you can through a graphical interface. Another reason is
    that there are occasions when you may want to run your Linux machine without any
    graphical interface at all, and that would necessitate administering it via shell
    commands. Although most people, especially those coming from a Windows background,
    prefer the graphical interface, you should be aware that it is quite possible,
    and in some instances even desirable, to run Linux without any graphical interface.
    If, for example, your Linux machine is used as a Web server, mail server, or file
    server, there may be no need for any of the features present in a graphical user
    interface like KDE or GNOME. You should bear in mind that any program, including
    a desktop environment, uses resources. Therefore, running a graphical desktop
    environment will use some of your system’s processor time and memory. If you can
    run the system without the desktop environment, you will free more of those resources
    for the tasks the server must perform. This means that if you are working with
    a very old machine that has limited resources or if you are pushing your machine
    to its maximum performance, you can improve that machine’s performance by working
    entirely from the shell and foregoing the graphical interface.


    Of course there are some significant disadvantages to working without a graphical
    interface. Without KDE, GNOME, or some other desktop environment, you would not
    have access to any of the interesting applications we have explored in previous
    chapters. You would normally want to use a desktop interface for any system that
    will be an individual’s home computer or business workstation. Working purely
    from the shell with no desktop environment is generally appropriate only for machines
    that will be used as specialized servers.


    In this chapter we will examine how to perform basic Linux system administration
    from the shell. This will include activities ranging from managing users and groups
    to configuring and activating your network interface card. What this means is
    that we will expand on the shell commands you previously learned. We will add
    several new commands and explore some previous commands in more depth.'
  merge: -1
  img_proc: true
- pgno: 384
  md: '# ## Run Levels and init


    This chapter is about Linux administration from the shell, and the most fundamental
    administrative task would be to shut down or reboot the machine. As even a casual
    Windows user, you realize that turning the power off repeatedly is not very good
    for your system. With Windows XP you would go to the Start menu and choose Turn
    Off the Computer, and you would be presented with a screen like what you see in
    Figure 19.1.


    ![](img/12d790664598bbf390261087fbe55bbc_384_0.png)


    Before the advent of Windows 95, Windows 3.1 was a desktop environment separate
    from the underlying operating system, DOS, and you could invoke Windows from DOS
    by typing in `win`. With a shell in Linux, you will still need a way to shut down
    the machine, reboot the machine, or invoke the desktop environment. In the shell
    you accomplish all of this with run levels.


    # ### Run Levels


    A run level is the level at which your system is currently running or operating.
    You can change the run level any time you like from the shell by typing in `init`
    followed by the number designating the run level you want to use. There are six
    run levels in all. Each designates that progressively more of the system is functioning.
    Run level 0 designates that the system is shut down. Run level 1 indicates the
    system is running in shell mode only, no graphical interface and no network support.
    This moves progressively to run level 5, which means that full network support
    and a graphical desktop environment such as KDE or GNOME is running. The last
    run level is 6, which designates a reboot. All of the run levels are summarized
    in Table 19.1.


    Table 19.1: Run Levels


    | Run Level | Purpose |

    | :--- | :--- |

    | 0 | This is a complete system shutdown. You invoke this run level by typing
    `init 0` at the shell. In Windows you can accomplish the same thing by clicking
    on the Start button and then clicking on Shut Down. |

    | 1 | This is single-user mode. There is no support for any network or Internet
    connection and no support for any graphical desktop environment. This is similar
    to the Safe Mode in Windows. You invoke this run level by typing `init 1` at the
    shell. |

    | 2 | This is multiuser mode without any graphical interface and without network
    support. You invoke this run level by typing `init 2` at the shell. |

    | 3 | This is full multiuser mode with all functionality except a graphical desktop.
    This run level is often used for servers that do not require a graphical interface.
    You invoke this run level by typing `init 3` at the shell. |

    | 4 | This run level is unused at this time. |

    | 5 | This run level is a complete system with multiuser capability, full network
    support, and a graphical desktop environment. This is most often used for personal
    workstations. You invoke this run level by typing `init 5` at the shell. |

    | 6 | This is a system reboot. You invoke this run level by typing `init 6` at
    the shell. |


    What all of this means is that if you type `init 0` from the shell, the machine
    will commence its shutdown process. However, if you type `init 6`, the machine
    will reboot. This may lead you to ask, what is this `init`? The `init` command,
    like all shell commands, is a'
  merge: -1
  img_proc: true
- pgno: 385
  md: 'program built into Linux shells. The `init` program is very important. In fact,
    it is absolutely essential to the operation of a Linux system. The `init` program
    literally initializes your system. When used as a shell command, it initializes
    your system to the specified run level. This is why it is also used to invoke
    certain specified run levels. When you type in `init 6`, you are saying to initialize
    the machine to run level 6. You can see this in Figure 19.2.


    ![](img/12d790664598bbf390261087fbe55bbc_385_0.png)


    # init


    It is important that you recall that all shell commands are actually programs.
    As was previously mentioned, the `init` program just happens to be a very important
    one. What is it that `init` does that is so important and how does it work? Some
    readers may not want this level of detail about `init` and should feel free to
    skip the following paragraphs. However, for the curious reader who wants to understand
    what is happening in the background, the following few paragraphs will explain
    quite a bit. The `init` program works to initialize the machine. It takes over
    the boot process as soon as the Linux kernel is done loading into memory. The
    Linux kernel finishes its part of the boot process by starting the `init` program.
    This means that `init` is always the first process on your machine, and that is
    why its process number is always 1. `init`, like all commands is really a program,
    and can be found in the directory `/sbin/init`. If the kernel can''t find `init`,
    it tries to run `/bin/sh`, and if that also fails, the startup of the system fails.


    When `init` starts, it completes the boot process by performing a number of administrative
    tasks. The `init` program will start by checking filesystems, starting various
    services, and starting they `getty` process. The `getty` process handles input
    from the keyboard. You might not have thought about it before, but there must
    be a process on your machine to handle everything your computer needs to do. With
    operating systems such as Windows, all of that is transparent to you. You cannot
    access background system processes, and even system administrators are often unaware
    of their existence. However, Linux and all Unix-like systems allow you to access
    many fundamental system processes.


    **Note**  Most university computer science programs include coursework on Unix
    or Linux. It often is either required or highly recommended. The reason for this
    emphasis on Unix-like systems is the aforementioned access to the underlying processes.
    For a computer science student, even one who may never professionally work with
    Linux or Unix, the ability to look into the fundamental mechanisms of the operating
    system is crucial to his learning process.'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# # The Filesystem


    Every operating system must organize the files on the computer in some fashion.
    You may recall that early on in this book we discussed file systems. Every operating
    system has certain directories that are of paramount importance. In Windows, the
    actual operating system is stored in the `windows` directory on your root drive,
    usually your `C` drive. In most cases, you will find Windows in `c:\windows`.
    Beneath the `windows` directory you will see a number of subdirectories, such
    as `system` and `system32`. The entire `windows` directory, with its subdirectories,
    contains files that are critical to your computer functioning. Unless you have
    some advanced knowledge of the Windows operating system, you should not tamper
    with anything in these directories.


    Other important directories include `Program Files` shown in Figure 19.3. This
    is where most programs will be installed by default. This is also generally on
    the root drive. You also have probably noticed a default `document` directory
    on Windows machines. This is a directory that the operating system creates for
    you. It is meant to contain items that are considered crucial or fundamental to
    the system’s normal operation.


    ![](img/12d790664598bbf390261087fbe55bbc_386_0.png)


    **Note** It was mentioned briefly earlier in this book but must be emphasized
    again that Windows refers to a directory as a folder. They are the same things.
    In this book we will use the terms interchangeably.


    Since we are using the phrase *root drive*, it might be prudent to define that
    term. Do not confuse the root drive of any operating system with the root user.
    The root user, in Unix and Unix-like systems, is the system administrator. In
    Windows the root user is referred to as the administrator. The root drive or director,
    for any operating system, is the main directory. For example, if you have three
    hard drives in your system, or one hard drive divided into three partitions, the
    one that contains the operating system is the root drive.


    As was mentioned previously, in any operating system there are certain key directories.
    These directories hold certain types of files. This is true in Linux as well as
    Windows. Let’s examine some of those directories and what they contain. There
    are several directories in Linux, each with its own particular purpose. The File
    Manager, shown in Figure 19.4, is showing all the top-level directories. We will
    examine several of these in the following pages.'
  merge: -1
  img_proc: true
- pgno: 387
  md: '# # The FileSystem


    ![](img/12d790664598bbf390261087fbe55bbc_387_0.png)


    Figure 19.4: Directories in the File Manager.


    /root:  The /root directory is the home directory for the root user. It usually
    is not accessible to other users on the system.


    /bin: The /bin directory holds binary files. Compiled programs are binary files.
    You will find a number of programs/applications in this directory. In fact, many
    shell commands are stored in this directory.


    /sbin: This directory is very much like /bin, but the commands are not intended
    for the average computer user. For that reason, /sbin is not usually in the default
    path of normal users but will be in root’s default path. That means that most
    users who log on cannot access /sbin or any commands stored there.


    /etc: The /etc folder contains configuration files. Most applications require
    some configuration when they start up. All of those configuration files can be
    found in this directory. This directory has several subdirectories, each containing
    a different type of configuration file. Let’s look at a few of those subdirectories:


    /etc/passwd: In this subdirectory you will find the user database, with fields
    giving the username, real name, home directory, encrypted password, and other
    information about each user. Note that the password is encrypted. You cannot go
    to this directory and read other people’s passwords. That means that when the
    user manager runs, it is actually reading its information from this directory.


    /etc/group: This subdirectory is quite similar to /etc/passwd, except that it
    describes groups instead of users. All the information about a group, including
    a list of user accounts that are members of that group, are stored in this directory.


    /etc/inittab: This is where you change the configuration file for `init`. If you
    will recall, we previously discussed the pivotal role that `init` plays in a Linux
    system. It is recommended that you do not reconfigure this unless you are very
    sure of what you are doing. A novice user should not touch this directory.


    /etc/motd: You may have noticed that after logon you get a brief message. This
    is called the message of the day, and it is found in this directory. This message
    is often used by system administrators to send information to all users.


    /dev: This directory contains device files. Remember that Linux treats all the
    drives as files. All hard drives start with `hd`, and floppy drives start with
    `fd`. The main hard drive might be named /dev/hd0. The floppy drive would be called
    /dev/fd0.


    /mnt: Although you may not be aware of it, any drive must be mounted prior to
    its use. The process of mounting a drive involves the operating system accessing
    it and loading it into memory. In Windows, this is all completely transparent.
    In modern versions of Linux, it is almost transparent. Most temporary storage
    drives, such as CD-ROMs and floppy drives, are mounted. The operating system does
    this for you, however. In older Linux/Unix systems, you had to use shell commands
    to mount the floppy drive before you could access it. This is no longer the case.
    However, you will find your floppys in a subdirectory of the /mnt directory, where
    all mounted temporary storage devices are found.'
  merge: -1
  img_proc: true
- pgno: 388
  md: '# The Filesystem


    /boot : This directory contains those files that are used by the bootstrap loader.
    This means that LILO will look here for files it needs, as will GRUB (remember
    that with Linux 9.0, GRUB is the default boot loader instead of LILO). Kernel
    images are often kept here instead of in the root directory. This directory is
    critical to the boot process. It is another area that the novice user should leave
    alone.


    /usr: Some commands are in /bin or in /usr/local/bin. This directory also contains
    /usr/share/man, /usr/share/info, and /usr/share/doc, where you will find documentation.
    This is where you will find all of those manual pages accessed by the man command.


    It is not important that you memorize all of these directories. However, a basic
    familiarity with what is in the directories would be useful. This also leads us
    to the topic of maneuvering around the directories from the shell. There are a
    few rather simple commands that you can use to maneuver in the shell. You have
    seen the cd command. You can type in cd followed by the name of the directory
    and you will change to that directory. If you then type in just cd and press Enter,
    you will go to your home directory. Both of these commands are shown in Figure
    19.5.


    ![](img/12d790664598bbf390261087fbe55bbc_388_0.png)


    If you want to use the shell to get to any of the directories we have mentioned,
    you must first be at the root directory. You then type in cd /mnt: (or whatever
    directory you want to change to). In Figure 19.6 you can see a change to the /mnt
    directory followed by the ls command being used to list files and subdirectories.'
  merge: -1
  img_proc: true
- pgno: 389
  md: '![](img/12d790664598bbf390261087fbe55bbc_389_0.png)


    Figure 19.6: Using `cd` to peruse directories.


    # # Managing Users and Groups


    Windows provides only very limited capability to manage users or groups from the
    command line. This is due the fact, previously mentioned, that Windows is designed
    to be used from the graphical interface. Linux, however, can be used just as effectively
    from the shell as it can from the graphical desktop environments. In fact, some
    Linux enthusiasts might argue that it is better to use Linux from the shell. Whether
    you are using a desktop environment such as KDE or GNOME or are working from the
    shell, you will still need to manage users and groups.


    # ## loginame


    Though it may seem odd, the first shell command we need to examine is the `loginame`
    command. This command will tell you what user is currently logged on to a terminal.
    This might sound odd, but it is necessary. Especially in multiuser environments,
    you may not know what username was used to log on to a system. This means you
    will not know what privileges he has. The `loginame` command is typed in just
    as you see in Figure 19.7, and it tells you the username that is currently logged
    on to that system.


    ![](img/12d790664598bbf390261087fbe55bbc_389_1.png)


    Figure 19.7: The `loginame` command.


    # ## Useradd and grouppadd


    Another command you need to be familiar with is `useradd`. This command is used
    to add users from the shell. This command also has a number of flags you can use
    with it. In Figure 19.8 you can see the display for `useradd --help`. As you can
    see, there are several flags you can pass to it.'
  merge: -1
  img_proc: true
- pgno: 390
  md: '![](img/12d790664598bbf390261087fbe55bbc_390_0.png)


    **Figure 19.8:** The useradd flags.


    You can specify a group for the user to belong to, expiration date, password,
    and everything you might specify through KDE''s user and group manager. However,
    in many cases you will just specify a username and password. Figure 19.9 shows
    a new user, named someusername, with the password of password, being added with
    the useradd command.


    ![](img/12d790664598bbf390261087fbe55bbc_390_1.png)


    **Figure 19.9:** Adding a user with useradd.


    As you may have guessed, you also can add groups with a very similar command,
    groupadd. This command has fewer flags. You can essentially specify the group
    name and group ID and very little else. Figure 19.10a shows a new group named
    somenewgroup being added.


    ![](img/12d790664598bbf390261087fbe55bbc_390_2.png)


    **Figure 19.10A:** Using the groupadd command.


    Once you have executed this command, you have a new user account with a home directory
    and the capability to log on to and use the system. You can verify this by using
    File Manager to look in the home directory and see if a subdirectory has been
    created for this new user. This would be a sure sign that the user was added successfully.
    As Figure 19.10b shows, the user has been added successfully.'
  merge: -1
  img_proc: true
- pgno: 391
  md: '![](img/12d790664598bbf390261087fbe55bbc_391_0.png)


    **Figure 19.10B**: The new user’s home directory.


    Another interesting command that is closely related to `useradd` and `groupadd`
    is the `groups` command. This command will tell you what groups the currently
    logged-on user is a member of. You can see this command used on the root user
    in Figure 19.11.


    ![](img/12d790664598bbf390261087fbe55bbc_391_1.png)


    **Figure 19.11**: The `groups` command.


    As you can see, managing users and groups from the shell is not really any more
    difficult than from the graphical desktop environments. It may be a little less
    visually appealing, but you can still perform the required functions.'
  merge: -1
  img_proc: true
- pgno: 392
  md: '# Configuring and Activating Network Cards


    In addition to adding users and groups, it is likely that you will need to activate,
    configure, and manage your network cards. A lot of this can be done by giving
    the `ifconfig` command, previously introduced, a more thorough examination. There
    are several flags that you can pass to `ifconfig` that alter the behavior of the
    network interface card. The most commonly used flags are discussed in Table 19.2.


    **Table 19.2: `ifconfig` Flags**


    | Flag | Purpose |

    | :--- | :--- |

    | `-a` | This flag is used to display all the information about your IP addresses,
    including the loopback address. |

    | `add <address>` | This allows you to add additional IP addresses to your card.
    The syntax is `ipconfig add 10.10.10.55.` |

    | `delete <address>` | This does just the opposite of the `add` command. It deletes
    one of the addresses you have added. An example is `ifconfig delete 10.10.10.55.`
    |

    | `up` | This command turns the network card on. An example is `ifconfig -up.`
    |

    | `down` | This command, as you might guess, turns a network card off. An example
    is `ifconfig -down.` |




    As with all shell commands, there are plenty of flags you can pass to `ifconfig`
    to make it work in the manner you require. However, the commands listed in Table
    19.2 are the essential flags for `ifconfig` that you must know. Combining a thorough
    knowledge of `ifconfig` with `who`, `ping`, `whois`, `finger`, and `traceroute`
    will enable you to do basic network operations and troubleshooting from the shell.'
  merge: -1
  img_proc: true
- pgno: 393
  md: '# ## Miscellaneous Shell Commands


    There are a number of shell commands that do not neatly fit into any category
    but may prove useful for any Linux system administrator. The commands can provide
    you with useful information about your system or assist you in performing certain
    tasks. In the next few paragraphs we will take look at some of these commands.


    # ### du and free


    It can be quite important for you to find out information about your machine''s
    current state. In KDE or GNOME you would use the System Information utility to
    view the use of memory and free diskspace. From the shell we have a few commands
    we can use. The `du` command, short for disk usage, will tell you how many bytes
    of disk space the current directory is occupying. You can see this command in
    Figure 19.12.


    ![](img/12d790664598bbf390261087fbe55bbc_393_0.png)


    Figure 19.12: The du command.


    You can also use shell commands to determine how much free memory your system
    has available. The `free` command, shown in Figure 19.13, will display the total
    memory, memory in use, and free memory in bytes. This is quite useful in diagnosing
    slow or inadequate performance on your machine, which is often caused by too little
    memory.


    ![](img/12d790664598bbf390261087fbe55bbc_393_1.png)


    Figure 19.13: The free command.


    # ### pwd


    When you are looking at your prompt, it usually lists the name of the current
    directory and the current user. It does not list the complete path to your directory.
    If you are in a directory that is a subdirectory of yet another subdirectory,
    it can get quite easy to forget where you actually are. The `pwd` command, shown
    in Figure 19.14, will display the complete path to your current location. It is
    the shell equivalent of leaving a trail of bread crumbs so you can find your way
    back home.'
  merge: -1
  img_proc: true
- pgno: 394
  md: '![](img/12d790664598bbf390261087fbe55bbc_394_0.png)


    **Figure 19.14:** The `pwd` command.


    # dmesg


    This is a very interesting command and may prove quite useful if you need to diagnose
    system problems. When your system boots up, you see a lot of information telling
    you what processes are starting, what processes failed, what hardware is being
    initialized, and more. Unfortunately, you may not have watched the bootup process
    carefully, or you may not remember what you saw. If, for example, your sound card
    is not working, it would be a good idea to know if it was properly initialized
    during bootup. You can use the `dmesg` command, shown in Figures 19.15a and 19.15b,
    to view all the messages that were displayed during bootup.


    ![](img/12d790664598bbf390261087fbe55bbc_394_1.png)


    **Figure 19.15A:** The `dmesg` command.'
