- pgno: 100
  md: '# # Calculators


    Word processing is perhaps one of the most common activities on any computer.
    Another very common activity is mathematical calculations of one sort or another.
    The need for number crunching is a fact of life. We all have occasion to need
    the accurate processing of numbers. Even if you are not an accountant, you will
    still need to balance checkbooks, compute interest rates on your credit card,
    and perform dozens of other functions with a calculator. You have probably used
    the Windows Calculator program before. This program is found by selecting Start,
    choosing Programs, going to Accessories, and selecting the Calculator, shown in
    Figure 5.10.


    ![](img/12d790664598bbf390261087fbe55bbc_100_0.png)


    The Windows Calculator is well suited for basic arithmetic operations. The mathematics
    involved in bookkeeping, computing a loan interest rate, or working with your
    budget, for example, can readily be accomplished with this calculator. However,
    if everyday math is not suited to your task, you can select View from the drop-down
    menu and switch to a scientific calculator, shown in Figure 5.11.


    ![](img/12d790664598bbf390261087fbe55bbc_100_1.png)


    The scientific calculator enables you to work with various exponents, roots, scientific
    notation, and more. This calculator is appropriate for the mathematics associated
    with general chemistry courses (either in secondary school or for freshmen college
    courses) as well as algebra-based physics courses. You have probably already guessed
    that Linux has an answer to your calculator needs. If you look under Accessories,
    you will find a scientific calculator, shown in Figure 5.12. An important side
    note should be made at this juncture. You have probably already noticed that Linux
    has applications that are comparable to all of the applications you have found
    in Windows. You should also notice that very often they are even found in the
    same place! Notice how the calculators in both operating systems are located under
    Accessories.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '![](img/12d790664598bbf390261087fbe55bbc_101_0.png)


    By examining the Windows scientific calculator and the Linux Scientific Calculator,
    or simply by looking closely at Figures 5.11 and 5.12, you should note a number
    of similarities. Both have the option to select hexadecimal, decimal, octal, or
    binary number systems. Both also give you the option of having angles represented
    in one of three different ways. This option is of particular interest if you intend
    to use your calculator for trigonometry. Both give you buttons for basic trigonometry
    functions (sine, cosine, tangent), raising a number to a certain power, computing
    the logarithm or the natural logarithm of a number, and more. In fact, you may
    be tempted to claim that the two have identical functionality and only slightly
    differing layouts. If you made such a claim, you would be almost correct, but
    only almost. If you notice the Configure button that is prominent in the upper-left
    corner of the Linux calculator and conspicuously absent from the Windows Calculator,
    you will find the difference between the two. This button may seem a small difference,
    but it offers a great deal of flexibility. Clicking it takes you to the Configuration
    screen, shown in Figure 5.13.


    ![](img/12d790664598bbf390261087fbe55bbc_101_1.png)


    There are four tabs on this screen, each enabling you to alter a different aspect
    of the Linux Scientific Calculator. The middle two options merely alter the appearance
    of your calculator. You may select any font or color combination that you find
    appealing. The first tab, Settings, is the one that enables you to change how
    the calculator will behave. Here you can alter the precision with which mathematical
    calculations are done. This is of critical importance to students in science classes,
    where the precision of a calculation is of paramount importance to successfully
    solve a given. You also can customize the calculator for either trigonometric
    or statistical use. Finally, you can elect to have the'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'calculator beep if an error occurs.


    As you can see, Linux offers all the calculator functionality you have grown accustomed
    to in Windows. In fact, using the Scientific Calculator that comes with KDE, you
    have some functionality not present in the Windows scientific calculator. We have
    found again that in Linux, not only can you perform all the tasks you are used
    to doing in Windows, but you may even be able to perform some tasks you could
    not do in Windows. Of course, some readers may be wondering what some of the mathematical
    functions listed do. You might not be familiar with natural logarithms or measuring
    an angle in radians. If this is the case, rest comfortably knowing that Linux
    not only is ready to meet your current mathematical needs, but is capable of doing
    even more!


    ![](img/12d790664598bbf390261087fbe55bbc_102_0.png)'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# ## Paint Programs and Screen Capture


    Simple graphics manipulation is another common task. In this age of Web cameras,
    digital cameras, and even cameras on cell phones, many people find they need to
    alter digital images. You probably used Windows'' built-in graphics program, Microsoft
    Paint. Simply choosing Start, selecting Programs, going to Accessories, and clicking
    on Paint takes you to the Paint program, shown in Figure 5.14.


    ![](img/12d790664598bbf390261087fbe55bbc_103_0.png)


    **Figure 5.14:** Microsoft Paint.


    The toolbars on the left and at the bottom enable you to select colors, paint
    styles, and more. You can then paint simple graphics. You also can open up and
    alter most basic graphics files, including JPEG, GIF, bitmap, and others. Once
    open, you can alter them as you see fit. If you routinely use a Web camera or
    digital camera, you have probably at least used Paint to crop an image before
    sending it to someone else. Not only do you have access to similar graphics programs
    in Linux with the KDE graphical interface, you have more than one graphics application
    to choose from. We will examine a few of the more popular graphics applications
    available to you with the KDE graphical user interface for Linux.


    Simply going to the Start menu and choosing Graphics you can find a plethora of
    graphics applications. There is a subheading under Graphics labeled More Graphics
    Applications. In this group you will find many additional interesting graphics
    programs.


    **Note** With previous versions of KDE, not all graphics applications were found
    here. While you will find some graphics-related utilities here, you will not find
    tools similar to Microsoft Paint. What you will find are very specialized tools.
    There is a digital camera tool for interfacing with a digital camera that is connected
    to your PC. There is also a scanning tool for use with scanners, and a screen
    capture tool, which we will examine later. For the basic graphics manipulation
    tools included with KDE, those that are similar in function to Microsoft Paint,
    you will need to look under Extras and Graphics. Here you will see several graphics
    programs. Let''s take a moment to review the features and functionality of a few
    of these applications.


    # ## Paint Program


    This is KDE''s basic all-purpose graphics program. It is also the KDE application
    that is most similar to Microsoft Paint. When you launch the Paint program, you
    will see an image much like what is displayed in Figure 5.15. This looks remarkably
    similar in many ways to Microsoft Paint.'
  merge: -1
  img_proc: true
- pgno: 104
  md: '![](img/12d790664598bbf390261087fbe55bbc_104_0.png)


    Figure 5.15: The KDE Paint program.


    With KDE Paint, you still have the same basic functionality you had in Microsoft
    Paint. From the toolbar at the top right you can select to draw ellipses, rectangles,
    straight lines, curved lines, text, or to simply highlight a portion of the image
    to crop. For demonstration purposes we will draw a simple picture using the tools
    on the upper-right side of the toolbar, along with the color selections at the
    right side. The color on the left is the foreground color. Using the Ellipse tool,
    we can drag and draw a basic red ellipse. If you then click on the red box, you
    are shown a dialog screen much like the one shown in Figure 5.16, where you can
    select whatever color you prefer. We are going to select black.


    ![](img/12d790664598bbf390261087fbe55bbc_104_1.png)


    Figure 5.16: Selecting colors.


    Use the buttons on the right side of the toolbar or the drop-down menu items found
    under Tool to select the Pen tool or the Spray Paint tool and begin painting.
    For our purposes, we will select the Spray Paint tool and being painting in the
    ellipse. This is shown in Figure 5.17.'
  merge: -1
  img_proc: true
- pgno: 105
  md: '![](img/12d790664598bbf390261087fbe55bbc_105_0.png)


    **Figure 5.17:** Using the spray paint tool.


    Clearly, this is not a high-end graphics package, like Corel Draw or Adobe Photoshop,
    but it is comparable to Microsoft’s Paint program. It is also adequate for most
    basic image manipulation activities. You can do some simple image manipulation
    and drawings with this program. If you select File and Save As, the Paint program
    will save as a PNG (Portable Network Graphics) image by default. However, you
    can change that to save it as a TIFF, JPEG, bitmap, or other image type.


    # # Image Magick


    The Paint program is not the only graphics manipulation program available to you
    with the KDE interface. In fact, it is not even the one with the most functionality.
    There is a more robust graphics application called _Image Magick_. In some earlier
    versions of KDE it is found under Extras and Graphics. In newer versions it may
    be found under Graphics and the subcategory Additional Graphics Programs. In other
    versions of KDE, Image Magick is not included. If your distribution or your installation
    did not include Image Magick, you can get it from _www.imagemagick.org_. This
    application is a very useful and robust graphics program. If it does not come
    with your version of KDE, it is highly recommended that you obtain a copy. When
    you launch this application you will see the Image Magick screen. If you then
    click on the screen, the toolbar will appear on the left side. This is shown in
    _Figure 5.18_.


    ![](img/12d790664598bbf390261087fbe55bbc_105_1.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# Figure 5.18: Image Magick. Image Magick logo © Pineapple USA, Inc.


    Image Magick is a pretty robust graphics program with a lot of basic functionality
    for creating or altering images. While it may not be up to the demands of a professional
    graphic artist, it is more than adequate for typical PC users. Let’s try a little
    test run with Image Magick and see what it can do. For the purposes of this book,
    we will open one of the figures you saw earlier in the book, and you can follow
    along by opening any image you like on your PC. Simply choose File and Open, and
    you can use the dialog box to locate and open any image on your PC.


    **Note** The toolbar with Image Magick is a floating toolbar. This means you can
    move it around independently of the image you are working with.


    Just to see what a few of these tasks do, you should select the button in the
    toolbar labeled F/X (this option is for special effects) and then select Oil Paint.
    You will be asked to give a number; for this example, give 15. Your image is altered
    to look like an oil painting, and this process can take quite a few seconds. We
    will be converting the image used for Figure 5.5 to an oil painting. You can see
    the results in Figure 5.19.


    ![](img/12d790664598bbf390261087fbe55bbc_106_0.png)


    This effect is even more startling when used with a digital photograph of a person.
    It essentially converts the photo so that it looks like an oil painting. This
    is a really interesting way to add some spice to old family photos! You probably
    also noticed several other special effect options, such as Charcoal. Each of these
    different special effects alters the image’s appearance in some significant manner.
    Using these special effect tools, you can do some very exciting things with digital
    photos. More importantly, none of these options are available with Microsoft’s
    Paint program.


