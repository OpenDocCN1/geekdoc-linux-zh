- pgno: 366
  md: '# ## Section V: Advanced Linux


    # ### Chapter List


    +   - [Chapter 18:](link) Linux Shell Commands

    +   - [Chapter 19:](link) System Administration from the Shell

    +   - [Chapter 20:](link) Basic Shell Scripting

    +   - [Chapter 21:](link) Advanced Shell Functions

    +   - [Chapter 22:](link) Samba, Printing, and More


    Much of this section is concerned with how to use a Linux shell. Although you
    can use Linux with a very slick-looking graphical interface, in fact there are
    several graphical interfaces to choose from, and many Linux aficionados feel more
    at home with command-line interfaces. The various command-line interfaces, or
    shells, available for Linux have far more functionality than the Windows command
    prompt. The reason for this is quite simple. Windows was designed to be used via
    a graphical interface. It was not meant to be used via a command-line interface.
    The graphical interface and the operating system are one. With Linux, the exact
    opposite is true. It was meant to be used through a command-line interface. The
    graphical interface is simply a tool that many Linux users find convenient.


    In the next several chapters we will examine various aspects of using the shell.
    We will look at many shell commands, explore administering a Linux machine via
    shell commands, and even look into the basics of writing your own shell scripts.
    This section should provide you with the tools you need to be competent at using
    the shell to perform most tasks in Linux.


    It should be noted that the following section is rather advanced. Some readers
    may want to skip it altogether. If you are a casual computer user who just wants
    basic Internet and word processing, it is perfectly okay for you to skip this
    section. However, if you want to use Linux to manage your small office as a server
    or you want to understand Linux on a deeper level, this section is for you.


    The section also will show you some advanced features of Linux that can be used
    through the KDE desktop. This includes file sharing with Windows and running the
    Linux machine as a network server.'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# # Chapter 18: Linux Shell Commands


    # ## Introduction


    Shells were briefly introduced in *Chapter 3, "Basics of the Linux Operating System,"*
    and we examined a few very basic shell commands in that chapter. However, we did
    not delve deeply into how to work within a shell. In this chapter we will explore
    shells in more depth. Some of the previous commands may be covered briefly again,
    and you will be introduced to a number of new shell commands.


    Using the shell is an important part of working with a Linux machine. Before there
    were graphical interfaces such as KDE and GNOME, shell commands were the only
    way to use Linux or Unix. Many Linux aficionados still find the shell to be the
    most efficient way to perform many tasks.


    In this chapter we will examine a variety of shell tasks, grouped together by
    functionality. That way we can look at a series of shell commands that all have
    similar operations. At the end of this chapter, if you follow along and execute
    these commands on your own Linux machine, you should be familiar with Linux shell
    commands. It is highly recommended that you use each of the commands mentioned
    in this chapter. Reading them without any experience using them will not help
    you to learn them.


    It has been 15 chapters since we discussed shells, and it might be prudent to
    review what a shell is. A shell, if you will recall, is a simple text-based interface
    with your computer. You enter text, and it appears in a screen. That screen usually
    has a simple mono color background (often blue or black), and the text is a simple
    font. The response you get back from the computer is also in this plain font on
    the same simple screen. There are no fancy buttons, drop-down menus, or other
    graphical elements. In Windows NT, 2000, and XP you have a shell called the command
    prompt. In Windows 95 and Windows 98 it was called the DOS prompt.


    As was previously mentioned, in Linux there are several different shells you can
    work with, including Bourne, Bourne-again (bash), and C shell. The vast majority
    of commands are common to all shells. In this chapter we will explore only those
    commands that are shared by all shells. Therefore, you can select any shell as
    your default shell. If you will recall, when you establish a user account, you
    can set that user''s default shell. That is the shell he will get when he invokes
    the terminal window. However, unless you have some compelling reason to select
    one of the other shells, it is probably best to leave the default as the bash
    shell.'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# # The Shell Itself


    First we should get familiar with the actual shell interface. To use the shell,
    you need to go to System Tools and select Terminal. As you get more comfortable
    with Linux, you will discover alternate ways to invoke the shell, but for now
    we can use this route. When you start a shell, you will see something much like
    what is shown in Figure 18.1. Notice that the cursor prompt you see is actually
    the username of the user who is currently logged on. There are shell commands
    to change even that, but for our purposes it''s just fine.


    ![](img/12d790664598bbf390261087fbe55bbc_368_0.png)


    **Figure 18.1:** The terminal.


    The drop-down menu at the top should look familiar to you. It is quite similar
    to the drop-down menu of many Web browsers and is the common interface you have
    seen in almost all KDE applications. Two particular menu items are of special
    importance. The first is the File menu. Under this you can see options to start
    a new session. A session is an individual instance of a shell. You can have multiple
    sessions running at one time, all controlled from this single terminal window.
    This enables you to work with several different shell commands at the same time
    if you want. You should also note the Settings menu. Under this you see a number
    of options for customizing the terminal window. You can change the size, color
    combination, and other aspects of the terminal.


    The first commands we will look at involve the shell itself and how it behaves.
    All shells have an interesting feature called History. The `history` command enables
    you to see the commands that have been entered previously. By default, this command
    will return the last 500 shell commands. This may be far more than you want to
    view. This brings us to a related command, `HISTSIZE`. Before we continue discussing
    this command, you should note that is typed in all capital letters, intentionally.
    It is one of the very few shell commands that is typed in all uppercase. By typing
    in `HISTSIZE=5`, as shown in Figure 18.2, you are telling the shell to only return
    the last five commands when the `history` shell command is executed.'
  merge: -1
  img_proc: true
- pgno: 369
  md: '![](img/12d790664598bbf390261087fbe55bbc_369_0.png)


    Figure 18.2: The HISTSIZE command.


    +   Note Technically speaking, HISTSIZE is not a command per se. It is actually
    an environmental variable. However, for our purposes here it works like and can
    be used like other commands.


    +   Note You must type in the shell commands exactly as you see them in this text
    or they will not work. For example, HISTSIZE=5 is all uppercase letters with no
    spaces. Typing it in any other way will not work. Most shell commands are all
    lowercase. These commands are case sensitive.


    The history and HISTSIZE commands can be very useful. There may be occasions when
    you need to know what was done a few commands back. Another useful command is
    clear. Enter the word clear and press Return and it will clear the current view
    of the shell. This can be useful when you have to run several commands and the
    shell is appearing a bit cluttered.


    While we will be working with the bash shell, you may be curious as to how you
    would go about invoking the other shells that we have mentioned. One obvious way
    is to set up that shell as the default shell for that user. However, there should
    be some way to change what shell you are using while the terminal is open. Fortunately,
    there is a way to do that very thing. You enter the abbreviation for that shell,
    and you will then be using that shell. For example, if you want to use the C shell,
    type in csh and then press Enter. You will not see any dramatic change in the
    appearance of the shell itself. In fact, you will see very little change. The
    cursor prompt will change slightly, indicating that you are using a different
    shell. In fact, that will be the only immediate indication that you have invoked
    a different shell. All the shell commands we will work with in this book will
    work in any shell. However, if you switch to C shell, you can do all the commands
    that are unique to that shell. When you are ready to switch back to bash, just
    enter bash. You can invoke the various other shells with just as much ease. Typing
    in ksh will invoke the Korn shell, and sh will invoke the Bourne shell. Changing
    between shells is a very easy thing to do.


    There are two other very important shell commands you need to be aware of. Both
    of these will provide valuable information about other commands. The first is
    the man command, which was discussed briefly earlier in this book. Linux has a
    built-in manual. When you enter man followed by a particular command, you will
    display the manual page for that command.


    For example, if you want to know about the ls command, enter man ls. You will
    immediately discover that most commands have several flags you can pass to them
    to make them behave differently. A flag is a character such as a letter that tells
    the command to modify its behavior in some way. You also will need to know how
    to exit the manual page when you are done reading it. That is simple; just enter
    the letter q, and you will quit the manual page.


    Another useful command is help. If you enter a command followed by two dashes
    and the word help, you will see a brief list of flags you can pass to that command.
    help is sort of like an abbreviated manual page. An example of using help is shown
    here:


    ```

    ls-help

    ```'
  merge: -1
  img_proc: true
- pgno: 370
  md: '# File and Directory Management


    In *Chapter 3* you were briefly introduced to some file and directory management
    commands. You were shown how to create directories, copy files, list contents
    of a directory, and remove files and directories. Several of the commands explored
    in *Chapter 3*, and a few new ones that we will examine now, are shown in *Table
    18.1*.


    **Table 18.1: File and Directory Management Commands**


    | Linux Command | Explanation and Example | Windows Command Prompt Equivalent
    |

    | :--- | :--- | :--- |

    | `ls` | This lists the contents of the current directory. **Example:** `ls` |
    The `dir` command is equivalent to the `ls` command. **Example:** `dir` |

    | `cp` | This copies one file to another directory. **Example:** `cp filename.txt
    directoryname` | The `copy` command is equivalent to the `ls` command. **Example:**
    `copy filename.txt directoryname` |

    | `mkdir` | The `mkdir` command creates a new directory. **Example:** `mkdir directoryname`
    | The `md` command is the equivalent of the `mkdir` command. Its syntax is identical
    to `mkdir`. **Example:** `md directoryname` |

    | `cd` | The `cd` command is used to change directories. **Example:** `cd directory
    name` | The `cd` command is also used in Windows, and its syntax is identical.
    **Example:** `cd directoryname` |

    | `rm` | The `rm` command is used to delete or remove a file. **Example:** `rm
    filename` | The `del` command is the equivalent to the `rm` command. **Example:**
    `del filename` |

    | `rmdir` | The `rmdir` command is used to remove or delete entire directories.
    **Example:** `rmdir directoryname` | The `rd` command is the equivalent of the
    `rmdir` command. **Example:** `rd directoryname` |

    | `mv` | This command is used to move a file. **Example:** `mv myfile.txt myfolder`
    | The equivalent command in Windows is `move`. **Example:** `move myfile.txt myfolder`
    |

    | `diff` | This command performs a byte by byte comparison of two files and tells
    you what is different about them. **Example:** `diff myfile.txt myfile2.txt` |
    The `comp` command will perform a binary comparison of two files. |

    | `cmp` | This command performs a textual comparison of two files and tells you
    the difference between the two. **Example:** `cmp myfile.txt myfile2.txt` | There
    is no equivalent command in Windows. |

    | `spell` | This command performs a spell check on a target file and tells you
    if any words are misspelled. **Example:** `spell myfile.txt` | There is no equivalent
    command in Windows. |'
  merge: -1
  img_proc: true
