- pgno: 29
  md: '# Disk Partitioning


    The first question you might be asking yourself at this point is: what, exactly,
    is a disk partition? Partitioning is literally the process of dividing your hard
    drive into one or more useable segments. Simply put, you can divide your hard
    drive into several *logical drives*. A logical drive is simply a part of your
    hard drive that is treated as if it were a separate device. In other words, you
    can treat your hard drive as if it were several different hard drives. This is
    particularly useful for very large hard drives, and in cases where people wish
    to organize their computer more efficiently. You might have one partition that
    is designated for business, and another for home use or entertainment. A partition
    that is created to look like a separate hard drive is called a *logical drive*.
    Your computer might have only one actual hard drive, but several logical drives.
    Partitions and logical drives are not applicable only to Linux. All operating
    systems have partitions and can be divided into logical drives. Even if you are
    not going to partition your hard drive into multiple logical drives, you will
    still need to partition it. The only difference is that you will partition it
    into a single logical drive.


    This brings us to the topic of partitioning a hard drive that will run Linux.
    Your hard drive must have at least one main partition. This primary partition
    is the starting point when your computer turns on. This is called the *root partition*.
    It must also have one *swap partition*. This of course brings us immediately to
    the question of what is a swap partition and why do you need one? A swap partition
    is a pretty incredible innovation. Essentially, it is a small segment of your
    hard drive that is set aside as a sort of backup for your PC’s memory. The way
    it works is rather simple. As you open up programs, they are loaded into memory.
    So, as you open more programs, you utilize use more and more of your memory and
    there is less free memory for other programs to use. When a program has been idle
    for a while, the program is taken out of memory and moved to this swap file. If
    you later activate that program, for instance by clicking on it, it is moved from
    the swap file portion of the hard drive back into memory. By placing it into a
    special segment of the hard drive, it can be more quickly reloaded into memory
    than if you simply loaded it off the normal hard drive partition. Thus the name
    ‘swap’, since it swaps programs from memory to a special segment of the hard drive.


    All operating systems support swap partitions. The swap partition’s size should
    be at least equal to the amount of RAM your machine has, but no more than two
    and one half times the RAM. That means if you have 128 megabytes of RAM, your
    swap partition should be at least 128 megabytes in size but no more than 320 megabytes.


    Now that you understand disk partitions, at least in a rudimentary fashion, you
    are ready to partition your hard drive. You will notice that the Red Hat Linux
    installation gives you three options. The first is to partition your hard drive
    automatically. You can choose this option if you have no intention of dual booting
    your machine.


    Caution If you choose to automatic partition, all existing partitions will be
    erased and one root partition, one boot partition, and one swap partition will
    be created.


    The second option is to use Disk Druid. Disk Druid is a graphical disk partitioning
    program specifically designed for Linux.


    The final option is FDisk. FDisk is a program that will be familiar to some Windows
    users because it is used to partition Windows machines. However, it is rather
    complicated to use and does not provide a nice graphical interface. For our purposes,
    we will use Disk Druid.


    Note While it is certainly possible to dual boot a system with both Windows and
    Linux, it is much simpler just to have a Linux machine. Less-experienced readers
    would probably have an easier time using their entire machine for a single Linux
    partition, using the Automatic Partition option. Those readers who want to dual
    boot are advised to read the following paragraphs and any documentation that came
    with their Linux distribution carefully.


    When you select Disk Druid, you will be taken to a screen displaying your current
    partitions. There are two courses of action you might take. First, if you are
    not going to dual boot your system (have more than one operating system on it),
    then it is probably best to highlight each partition, one by one, and delete it.
    Then you can start fresh. Then you will choose the New button, which will take
    you to a screen where you can set the parameters for this new drive. This is shown
    in Figure 2.9a.'
  merge: -1
  img_proc: true
- pgno: 30
  md: '![](img/12d790664598bbf390261087fbe55bbc_30_0.png)


    Figure 2.9A: Setting up partitions.


    Note You also are taken to this screen if you choose to edit an existing partition.


    If you are planning to dual boot with an operating system that is already installed—for
    example, should you wish to install Linux on your Windows machine and keep both
    operating systems—then you will not delete all the existing partitions. You will
    delete all partitions except for the one that contains Windows. This means that
    when we are done you will have one Windows partition and one Linux partition.
    The important point to remember is that you should leave the partition that has
    Windows completely untouched. The real question is, how do you know which partition
    has Windows? Linux and Disk Druid identify partitions differently than Windows
    does, but both Disk Druid and Windows list the size of the partition. The trick
    is to boot up your system before you begin the install and use My Computer to
    note the size of the partition you want to install Linux on. For example, consider
    Figure 2.9b.


    ![](img/12d790664598bbf390261087fbe55bbc_30_1.png)


    Figure 2.9B: My Computer.


    Note This is one more reason why you were advised to read this entire chapter
    before attempting to perform the installation.


    Here we see there is a single large partition of 13.6 gigabytes, and it is called
    the C drive. When you start the Linux install and get to Disk Druid, you will
    not see a drive labeled C, but you will see a drive that is about 56.6 gigabytes
    in size.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '**Note**

    The best way to do a dual boot with Windows is to have a separate partition created
    to hold Linux. This partition should be created before you begin the Linux installation.
    If you are uncomfortable with partitioning your hard drive, you might consider
    using a commercial product such as Partition Magic™, available from www.powerquest.com.
    If that were present on the machine depicted in Figure 2.9b, you would also see
    a D or an E drive. Also note that it is much simpler to have one operating system
    per machine. In other words, it’s easier and simpler to have a separate Linux
    and Windows PC than to try to install both on one machine.


    One significant problem with Disk Druid, however, is that you cannot resize the
    partitions. If your machine already has two partitions of about the right size
    to handle Windows and Linux, then this is fine. If it does not, you could be in
    for a problem. As we already discussed, one of the easiest and relatively least
    expensive routes is to obtain some utility such as Partition Magic, install it
    in Windows, and resize your partitions as you see fit. Then when you reboot and
    install Linux, the partitions will already be set up for you. If you want to repartition
    your machine manually so that you can dual boot, the best option for you is to
    follow Microsoft’s recommendations. The Microsoft Web site www.microsoft.com/exchange/techinfo/tips/StorageTip2.asp
    may be of some help to you.


    Another option is to use the FDisk utility, previously mentioned, to repartition
    your drive. FDisk does not actually allow you to resize your partitions as you
    need to. However, it does let you delete one partition and create one or more
    partitions from that freed space. One of the best Web pages on the Internet on
    the FDisk utility can be found at www.computerhope.com/fdskhelp.htm. You can also
    access the Linux FDisk manual at www.die.net/doc/linux/man/man8/fdisk.8.html.
    FDisk is more versatile, but also more complex. For this reason, this book will
    focus on Disk Druid. Readers who want to learn more about FDisk are encouraged
    to use the Web sites previously mentioned and perhaps do a search in their favorite
    search engine for FDisk for even more resources.


    Assuming that you are not dual booting, you will probably want to use Disk Druid
    to create only two partitions: a swap partition, described earlier, and a single
    large partition for your operating system. This is the simplest setup and is highly
    recommended for beginners. Once you have made those selections, you click to tell
    Disk Druid you are done. You also can select a check box indicating that you want
    the installation process to check the actual physical disks before creating the
    partitions. This is a very good idea. It is time consuming, but it ensures that
    you won’t be installing Linux on a bad hard drive.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# ## Continuing with the Installation


    Once you have finished with Disk Druid, there are still some steps to take before
    installation is complete. The next screen will list the operating systems on your
    PC. If you are not dual booting, you should see just one, Linux. If you are dual
    booting, you can select which operating system you want to be the default. This
    is shown in Figure 2.10.


    ![](img/12d790664598bbf390261087fbe55bbc_32_0.png)


    **Figure 2.10: Selecting an operating system.**


    When your machine first starts, you will be given a display listing these operating
    systems, and you will be given a few moments to select one. If you do not make
    a selection, the default will be selected for you. You should note that what this
    screen is doing is configuring your *boot loader*. A boot loader is just a small
    program that loads the operating system into memory. During your boot phase, it
    loads the operating system, thus the name boot loader. Many Linux distributions
    use the *LILO* (Linux load) boot loader software. Red Hat 9.0 uses a newer boot
    loader, *GRUB* (Grand Unified Boot Loader). Among other things, GRUB makes dual
    booting much easier.


    The next stage of the installation is to configure your network adapter. The network
    adapter, also called a NIC (network interface card), is simply the card that you
    plug a network cable into. If this is a stand-alone home machine, leave the default
    settings shown in Figure 2.11.'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/12d790664598bbf390261087fbe55bbc_33_0.png)


    Figure 2.11: Network configuration.


    If this is not a stand-alone machine but instead is a machine that will be used
    on a network, you will need to set the IP address assigned to you by your network
    administrator.


    **Note** If you are not on a network but are going to log on to the Internet,
    the chances are that your Internet service provider (ISP) assigns you an IP each
    time you log on (this is referred to as a dynamic IP). This is the default setting
    for Linux, so you should be fine. If your ISP assigns you a static IP, a rather
    unusual step for an ISP to take, it will have to tell you what that IP address
    is.


    **Note** An IP address consists of four numbers, each between 0 and 255 and separated
    by periods. An example of an IP address is 10.32.0.43.


    Don''t panic if you either don''t know the proper network settings right now or
    put them in wrong. You can change them at any time, once you have Linux up and
    running. Chapter 4, "System Configuration in KDE," shows you in detail exactly
    how to do it.


    After you have configured your network card, the next phase is to set up the firewall.
    You might be wondering what a firewall is. A *firewall* is a barrier between your
    computer and the outside world. It is your first line of defense with hackers.
    A firewall can be a separate device (such as a router or another PC) or software
    that filters incoming packets. In this case it is software that filters incoming
    packets. If you do not have extensive knowledge of firewalls, your best bet is
    to leave the default settings. This firewall, however, is one more of the many
    strengths of the Red Hat Linux distribution. It is bundled with and installs a
    firewall, and that makes your PC much more secure from the various dangers posed
    by the Internet. The default configuration is shown in Figure 2.12.'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'Continuing with the Installation


    ![](img/12d790664598bbf390261087fbe55bbc_34_0.png)


    Figure 2.12: Firewall configuration.


    **Note** The network interface cards (NICs) in your PC are listed in order as
    *eth0*, *eth1*, and so on. *eth* is short for Ethernet. Most home PCs have only
    one card.


    Once you have set up your firewall, the next screen will ask if there are additional
    languages you want to install. You can have support for multiple languages on
    your Linux PC. If you are using only one language, you won''t need to do anything
    at this stage.


    The next few screens are very simple. In fact, they are pretty self explanatory,
    but we will discuss them briefly. The very next screen has you select your time
    zone. If you get this wrong, don''t worry; as with the network configuration,
    you can reconfigure this after your PC is up and running. You can see the time
    zone screen in Figure 2.13.


    ![](img/12d790664598bbf390261087fbe55bbc_34_1.png)


    Figure 2.13: Selecting the time zone.


    The next screen is simple but important. Here you do two things, set the root
    password and add user accounts. The main action taken at this point and depicted
    in Figure 2.14 is to set the root password.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '![](img/12d790664598bbf390261087fbe55bbc_35_0.png)


    This is critical. In Linux and Unix, root is like the system administrator in
    Windows. Anyone who logs on to your PC as root can do anything to the machine.
    This means you must select a good password. It should be at least eight characters
    in length and contain a combination of letters and numbers. Make certain you write
    it down somewhere. If you forget it, you are in really deep trouble. Your only
    option will be to reinstall completely and wipe out the previous Linux installation.


    On this screen, you also can add user accounts. These are important because you
    can define users with specific permissions, allowing them to do only the tasks
    you want them to do. You must set a root password before leaving this screen,
    but adding users can be done later if you prefer. In fact, many Linux administrators
    add users after the machine is fully installed and configured. However, you do
    have the option of adding user accounts right now if you so desire. Either way,
    it is probably a good idea to take a minute and add a user account for yourself.
    That way, you can log on without needing to do so as root. A common system for
    usernames is to use the first initial of the first name with the last name. For
    example, the author’s username might be easttom.


    Note It is usually unwise to simply log on as root every time you use your PC.
    The reason is that root has complete and unfettered access to the entire system.
    However, in this book we will be covering some basic administrative duties that
    will require you to log on as root. It is recommended that you log on as the username
    you just created anytime you are just using your Linux machine, but log on as
    root when trying the administrative exercises found later in this book.


    The next screen is a bit more complex. It allows you to set various encryption
    schemes for your PC. Unless you have some significant understanding of these various
    encryption methodologies, you should leave the default settings and move past
    this screen, which is shown in Figure 2.15.'
  merge: -1
  img_proc: true
- pgno: 36
  md: '![](img/12d790664598bbf390261087fbe55bbc_36_0.png)


    **Figure 2.15**: Setting encryption schemes.


    After setting up the encryption schemes, you will be on to choosing packages.
    This is a rather lengthy topic in itself and will be covered in the next section.
    You are now, however, done with the essential configuration of your PC and have
    reached a significant milestone in the installation process.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# # Choosing Packages


    What packages you choose to install is a very important topic. Next to the Disk
    Druid, this is probably the most important part of the installation. There are
    a number of packages you could select, each with a different purpose. They are
    divided into categories such as desktops, servers, and development. Each of those
    categories will be explored in this part, and specific package groups will be
    explained. At the end of this section there is a list of the packages it is recommended
    you select. The Package Group Selection screen is shown in Figure 2.16.


    ![](img/12d790664598bbf390261087fbe55bbc_37_0.png)


    **Figure 2.16: Package selection.**


    # ## Desktops


    You can use Linux in a simple command-line mode (also called shell mode). This
    means that you type on everything on a plain black screen, but why would you want
    to? As a Windows user, you are used to a rich graphical interface, and you probably
    want to continue using such an interface. Linux not only provides you with a very
    easy-to-use graphical interface, it provides you with more than one to choose
    from. There are three packages listed in this section: X Window System, GNOME
    (GNU Object Model Environment), and KDE (K Desktop Environment). Each of these
    is a complete graphical window interface that operates in a fashion similar to
    Microsoft Windows. Which one you choose is a matter of preference. In this book
    we will use the KDE user interface. Whether you choose KDE or GNOME, it should
    be chosen in conjunction with X Window System. In order to follow along with this
    book, you should select GNOME, KDE, and X Window System.


    # ## Applications


    This part is going to be very important to you. It lists the various types of
    applications Linux can install. Most of it is self explanatory. For example, the
    Office Productivity package includes word processors, spreadsheets, and so on.
    The Games and Entertainment package includes games for Linux. A complete list,
    with explanation, is provided in Table 2.2.


    | Package | Purpose |\n| :--- | :--- |\n| Editors | This package provides a variety
    of text editors, many of which have functionality far beyond text editors such
    as Notepad, which you may have used. |\n| Engineering and Scientific | This package
    contains a number of programs for scientist and engineers. |'
  merge: -1
  img_proc: true
- pgno: 38
  md: '|  |  |

    |---|---|

    | Graphical Internet | Including this package will provide you with access to
    a variety of Internet tools, including a Web browser, chat software, and e-mail
    clients. |

    | Text-Based Internet | You will need this package only if you will be running
    without a desktop graphical user environment. It will allow you to check e-mail
    and do some Internet activities. |

    | Office Productivity | This package includes a wide array of word processors,
    spread sheets, presentation tools, and more. |

    | Sound and Video | Installing this package gives you access to several programs
    used to record sound and video, play video, and more. |

    | Authoring and Publishing | These programs are specifically for desktop publishing
    and Web page development. |

    | Graphics | In this package you will find applications for image manipulation.
    Some of these applications are on a par with commercial products such as Adobe
    Photoshop. |

    | Games and Entertainment. | Red Hat Linux 9.0 comes with several games you can
    use to amuse yourself |


    # # Servers


    There are a number of different server-related packages available. These include
    Web servers, database servers, and news servers. Some of these packages will apply
    only to network servers, but some may be applicable to small businesses and personal
    use. The individual packages are described in Table 2.3.


    # Table 2.3: Server Packages


    | Package | Purpose |

    |---|---|

    | Server and Configuration Tools | This is a vital package that contains many
    tools for configuring a server. If you are installing any of the other server
    packages, it is a good idea to install this one as well. |

    | Web Server | This package contains the software you will need to turn your PC
    into your own personal Web server. |

    | Windows File Server | This contains software that will enable you to share files
    with machines that are running Windows. If your Linux PC will interact in a heterogeneous
    network environment (a network with more than one operating system), you will
    probably need this package. |

    | DNS Name Server | If your Linux server is going to be a DNS (Domain Name System)
    server for a network, you will need this package. |

    | FTP Server | This package enables you to upload and download files to and from
    your PC over a network or the Internet. |

    | SQL Database Server | This is a very robust, fully functional database server.
    If you are running a small-to-medium size business, you may need this package.
    |

    | News Server | This package enables you to host discussion groups/newsgroups
    on your PC. This is not recommended for most users. |

    | Network Servers | This package includes a variety of applications used in running
    a network server. |


    # # Development


    If you are a programmer, then you will absolutely love Red Hat 9.0. It offers
    a wide range of development tools that you can install for free. You will have
    everything you need to develop Linux software of your own. The individual packages
    are described in Table 2.4.


    # Table 2.4: Development Packages


    | Package | Purpose |

    |---|---|'
  merge: -1
  img_proc: true
- pgno: 39
  md: '| Development Tools | This package contains a number of generic development
    tools for creating programs in C, C++, Lisp, Java, and other programming languages.
    Compilers, editors, and all required tools are in this package. |


    | Kernel Development | This package contains the tools and the code to the Linux
    kernel. If you are a skilled programmer and want to alter the Linux operating
    system, you can do it. |


    | X Software Development | This package is specifically for developing software
    to run with X Window System. |


    | GNOME Software Development | This package includes everything you need to develop
    software to run with GNOME. |


    | KDE Software Development | This package has everything you need to develop software
    that runs with KDE. |


    # ## System


    The various system packages are useful for administering your Linux PC. It is
    recommended that you install each of the three packages. They are administrative
    tools, system tools, and printing support.


    # ## Miscellaneous


    This is not really a set of packages so much as it is two additional choices.
    If your PC is short of hard drive space, you can select Minimal. With this option,
    you won''t get many of the interesting and useful applications that come with
    Red Hat, but you will have the bare essentials. The other option, Everything,
    is exactly what you think it is, all packages. This option requires over four
    gigabytes of hard drive space.


    Different Linux users will find different combinations of packages to their liking.
    However, this book concentrates on certain applications that you must install.
    For that reason, please ensure that you select everything in Table 2.5.


    Table 2.5: Recommended Packages


    This set of packages is a good mix of server, workstation, and personal options.
    You have the office productivity of a business workstation, the entertainment
    and graphics of a personal workstation, and the Web and FTP server software of
    a server. Together, these packages, many of which will be covered in this book,
    will give you a wide range of applications you can choose from. However, if your
    hard drive is significantly larger than five gigabytes, as many current ones are,
    you would be well advised to select the Everything option and install all packages.
    Of course, this will make your installation take longer.'
