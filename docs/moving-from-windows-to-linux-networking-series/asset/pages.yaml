  md: 'pico filename


    If the filename you designate does not already exist, a new file with that name
    will be created. Changes made to a file do not become permanent until you write
    them to the system. The command to do this is the Ctrl key followed by lowercase
    o. You can then exit Pico using the Ctrl key followed by the x key.


    # Emacs


    According to the Emacs manual, Emacs is an extensible, customizable, self- documenting
    real-time display editor. The name Emacs was originally an abbreviation of Editor
    MACroS. This is because Emacs was originally used strictly to edit macros. Macros
    are, in essence, mini programs, not unlike the shell scripts we previously explored.
    The original Emacs implementation was written for a rather specific system called
    the Incompatible Timesharing System (ITS). There was a custom of giving such macro
    packages names ending in the syllable mac or macs.


    Emacs is perhaps the most powerful of the editors, but also the most complex.
    Entire books have been written on Emacs. This means that we will be looking into
    only the basics in this chapter. You also will find a lot of documentation on
    Emacs on the Internet. You can find some help from Web sites listed in Appendix
    A, “Other Resources,” or you can enter “Emacs” into your favorite search engine,
    and you will get quite a few responses. The Emacs documentation uses some specific
    terminology. You need to understand some of these terms to be able to use all
    the free help available on the Internet. Table 21.4 summarizes the more commonly
    used terms.


    **Table 21.4: Emacs Terminology**


    | Emacs Term | Meaning |

    | :--- | :--- |

    | **buffers** | *Emacs* loads files into internal *buffers*. A buffer is a temporary
    area in memory often used in many programs and operating systems to hold files
    that are currently being worked on. In some *Emacs* documentation, the file you
    are editing may be referred to as a *buffer*. |

    | **frames** | One *Emacs* process can produce a number of *separate* windows.
    *Emacs* calls each of these windows a *frame*. |

    | **windows** | Each frame can be split into sections that *Emacs* calls *windows*.
    |

    | **point** | This designates the actual *point* where the text cursor currently
    is. |

    | **meta keys** | *Emacs* documentation often refers to the Escape key as a *meta*
    key. |

    | **Lisp** | *Emacs* is not a self-contained binary. Many of *Emacs’* commands
    are written in a language called Lisp. To call one of these functions by name,
    *type M-x function name*. The files containing these functions are in the directory
    */usr/src/editors/Emacs/lisp*. You can write your own Lisp functions, but nearly
    all users will be able to do what they want without having to do this. |


    The syntax for opening a file with Emacs is much like the syntax for opening a
    file with Pico or vi:


    ```

    emacs filename

    ```


    When you open a file, such as one of the script files from the previous chapter,
    you should see something like what is shown in Figure 21.8.'
  merge: -1
  img_proc: true
- pgno: 428
  md: '![](img/12d790664598bbf390261087fbe55bbc_428_0.png)


    **Figure 21.8:** Opening a file with Emacs.


    You should note that when you do this, you launch a new window (if you are using
    a terminal within some desktop environment such as KDE or GNOME). The Emacs editor
    is split into two areas. The top area is where you edit your text, and the bottom
    area is the echo area. The echo area displays the commands you issue and any messages
    the Emacs editors have for you. You can abort a command by pressing the Ctrl key
    and the g key in combination.


    The text area and the echo area are separated by a line called the mode line.
    This line shows the current status information of Emacs. Emacs uses a number of
    symbols to communicate information about the file you are editing. For example,
    the Emacs editor will place two asterisks (`**`) in front of the buffer name if
    changes have been made but not yet saved. Two percent signs (`%%`) will appear
    if the file is read-only. Next to the buffer name will be the major mode of the
    buffer. These modes control the way Emacs behaves with your text and consist of
    the text, lsp, and c modes. Next to the major mode will be a list of the minor
    options that can be altered. Next to this will be a display showing the percentage
    of the file displayed.


    Most Emacs commands are based on the use of the Ctrl key or the Escape key (meta
    key). However, each of these keys works slightly differently. The Ctrl key should
    be held down while the next key is pressed. The Escape key, however, should be
    pressed and then released before entering the next key sequence. Also, the Ctrl
    key should be held only for the next character. For example, the command Ctrl-X
    U means hold down the Ctrl key and press x and then release the Ctrl key and press
    the u key. Some commands do not have key sequences assigned to them and must be
    entered by hand. You can exit the Emacs editor by either using Ctrl-X or Ctrl-C.'
  merge: -1
  img_proc: true
- pgno: 429
  md: "# # Advanced Shell Scripting\n\nIn the preceding chapter we looked at shell\
    \ scripting. If you will recall, we examined the basics of scripting as well as\
    \ how to write some basic programming techniques in a script. After studying that\
    \ chapter, you should be basically competent at writing simple shell scripts in\
    \ Linux. If you will recall, we mentioned that entire books have been written\
    \ on scripting. That means that a single chapter touched the basics. This chapter\
    \ certainly won't make you an expert at writing shell scripts. However, we should\
    \ take a moment to examine a few items that you might find useful in script writing.\n\
    \n# ## case Statements\n\nWe looked at *if* statements when we initially examined\
    \ shell scripts. *if* statements work for many situations where you need to make\
    \ some sort of decision in the execution of your script. However, what happens\
    \ when you have a series of decisions to make? Do you simply write a series of\
    \ five, six, or more *if* statements? Yes that works, but it is certainly not\
    \ an elegant choice. This is where *case* statements come in. A *case* statement\
    \ allows you take one of many choices.\n\nThe basic format of a *case* statement\
    \ is that you put the word *case*, followed by the variable, then the word *in*.\
    \ After that you list the choices. Each choice is followed by a parenthesis and\
    \ two semicolons. The entire *case* statement ends with the keyword *esc*. Here\
    \ is a generic example:\n\n```\ncase somevariable in\n    choice one));\n    choice\
    \ two));\n    choice three));\nesac\n```\n\nLet's look at an example script:\n\
    \n```\n#!/bin/bash\necho 1. Windows\necho 2. Macintosh\necho 3. Linux\necho 4.\
    \ OS2\necho Please choose your operating system\nread opsys\ncase $opsys in\n\
    \    1) echo What? Haven't you been reading this book;;\n    2) echo Good grief...;;\n\
    \    3) echo Alright! Now you got it!;\n    4) echo What planet are you on;;\n\
    esac\nexit 0\n```\n\nIf you type this into your favorite text editor, you can\
    \ save it as *scriptcase.sh*, then run it from the shell. If you run it from the\
    \ shell, you should see something like what is shown in **Figure 21.9**."
  merge: -1
  img_proc: true
- pgno: 430
  md: '![](img/12d790664598bbf390261087fbe55bbc_430_0.png)


    This may look a little complicated, and there are several rules to remember. Each
    choice must end with a double semicolon, the entire *case* statement must end
    with *esac*, and each choice is followed by a parenthesis. This may seem like
    a lot to remember, but with a little practice it will become very natural. This
    is also another technique that is common to most programming languages.


    # Multiple Statements on One Line


    Sometimes in your script you might have several related statements to write. You
    might want to put them all on one line. You could do this either to save space
    or to group commands that belong together logically. For whatever reason, doing
    it is simple. You separate each command on the line with a single semicolon, as
    you see here:


    ```

    ```python

    statement one; statement two; statement three

    ```


    ```


    Open your favorite text editor and enter the following. Then save it as *scriptmultiple.sh*
    and run it.


    ```

    ```

    #!/bin/bash

    ls; ps;who;logname;

    exit 0

    ```


    ```


    When you run this, it will work just as if you had placed each command on a separate
    line. You can see the results in Figure 21.10.


    ![](img/12d790664598bbf390261087fbe55bbc_430_1.png)'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# Advanced Shell Scripting


    Whether or not to place your commands on a single line or space them out is a
    matter of preference. Linux scripts allow you to do either. Let’s take another
    look at putting multiple commands on a single line. What we will do is to put
    echo statements in the previous script to explain to the user what we are doing.
    Your script should look something like this:


    ```

    ```bash

    #!/bin/bash

    echo running ls; ls; echo running ps; ps; echo running who; who;

    echo running logname; logname;

    exit 0

    ```

    ```


    If you run your script now, you will see something like what is shown in Figure
    21.11.


    ![](img/12d790664598bbf390261087fbe55bbc_431_0.png)'
  merge: -1
