- pgno: 326
  md: '# **Chapter 15: Web Servers in Linux**


    # **Introduction**


    A Web server is a computer that runs software that serves up Web pages. When you
    visit a Web site such as that for this book''s publisher, www.charlesriver.com/,
    your browser connects to that machine, probably after connecting to your Internet
    service provider and a veritable host of intermediate sites or routers, and requests
    an HTML document from that machine. That machine then serves up that HTML document,
    and thus we have a Web server. That explains what a Web server is, but not why
    you might want one. In earlier chapters we discussed briefly how to develop our
    own Web pages, using some of the tools that come with Red Hat Linux 9.0. You can
    then use a commercial or free Web hosting service. But what if you want to host
    those Web pages from your home machine? Or what if you are administering a small
    network in an office and want to provide a Web site for the office, or just an
    internal Web site for people in that office to use? In any of these scenarios
    you might want your own Web server. Fortunately for you, Linux provides such Web
    servers.


    Red Hat ships with a very popular Web server, the Apache server, which we will
    examine in detail in this chapter. There are also several free or low-cost Web
    servers you can download from the Internet. We will briefly discuss some of these
    later in this chapter. At the end of this chapter you should have a basic understanding
    of what Web servers are, how they work, and how to set up the Apache Web server.


    # How Do Web Servers Work?


    It is possible that you could set up and run the Apache Web server and not really
    understand how it is working. Such a course of action is bound to be fraught with
    problems. Anytime you are operating technology and have no idea how or why it
    works, you are asking for problems. For this reason we will take a few moments
    to discuss how Web servers work and communicate.


    To begin with, recall that every type of communication that a computer does is
    handled by some sort of protocol. You have already learned that e-mail is sent
    using SMTP (Simple Mail Transfer Protocol) on port 25 and received using POP3
    (Post Office Protocol Version 3) on port 110. You also learned that files are
    uploaded or downloaded on the Internet using FTP (File Transfer Protocol), and
    it works on port 21. Web communication is no different. It uses HTTP (Hypertext
    Transfer Protocol) and works on port 80.


    HTTP works by requests and responses. A Web browser sends a specific request to
    an address. That address can be either an IP address such as 10.10.10.01 or a
    URL such as www.chuckeasttom.com. The Web server that is at that address then
    sends back a specific response. In essence a Web server is any computer that has
    some program on it that can listen to port 80 and respond to the HTTP requests
    it receives.


    **Note** Just for your information, IP stands for Internet Protocol, and URL stands
    for Uniform Resource Locator. It is basically just a technical way of saying Web
    address.


    How does a Web server respond when it gets this request? It begins by sending
    back a numeric code to the Web browser that sent the request. That code tells
    the browser what is happening on the server side. Have you ever seen a Web page
    response like "HTTP 404 - File Not Found," as shown in Figure 15.1a? The number
    404 is the error code that all Web servers send to browsers if they cannot find
    the Web page that the browser requested.'
  merge: -1
  img_proc: true
- pgno: 327
  md: '![](img/12d790664598bbf390261087fbe55bbc_327_0.png)


    # Figure 15.1A: Error message 404.


    If the response is that the request was OK and the server is processing it, then
    the server will respond by sending the appropriate HTML document to the Web browser
    that was requesting that document. The browser then loads that document into memory
    and displays it in the browser. The basic process of sending and receiving requests
    between a Web browser, your ISP, and a Web server is diagrammed in Figure 15.1b.


    ![](img/12d790664598bbf390261087fbe55bbc_327_1.png)


    # Figure 15.1B: The process.


    There are a number of codes that a Web server can send back to a browser. Some
    of the more common codes are listed in Table 15.1. It is important that you remember
    two facts. The first is that these error codes are the same regardless of the
    browser making the request or the Web server answering the request. An Internet
    Explorer browser connecting to a Microsoft Internet Information Server® Web server
    will get the same codes that a Mozilla browser connecting to an Apache Web server
    will get. The second fact to keep in mind is that the browser will'
  merge: -1
  img_proc: true
- pgno: 328
  md: 'not display some codes to you. For example, if the code indicates that the
    Web page was found and is being sent, then that code will not be displayed. Usually
    your browser will only display those codes that indicate an error of some type
    has occurred.


    # Table 15.1: HTTP Return Codes


    | Code | Meaning |

    | :--- | :--- |

    | 101 | This is an indication that the browser has asked to switch protocols (maybe
    to download a file, so it is switching to FTP) and the server is agreeing. |

    | 200 | This is just an OK message. |

    | 202 | The request has been accepted. |

    | 301 | The page has been moved and you are being redirected to the new address.
    |

    | 401 | The browser is not authorized to do whatever it is attempting. |

    | 404 | The requested file could not be found. |

    | 504 | Server timed out. |


    Some of these response codes you would never see. The browser would process them.
    Some, like 401, 404, and 504, you will probably see at some point in your Web
    surfing. It is not necessary for you to commit this list to memory. What is important
    is that you understand what is going on in the background when you use your Web
    browser to visit some Web site. Messages are being sent from your browser to the
    server. On the server end, some software is listening in to port 80 for standard
    browser requests and then responding. That is the essence of a Web server. Now
    keep in mind that commercial Web servers are generally run on very high-end computers
    with backup hard drives, lots of memory, and lots of processor power. However,
    you can certainly run a Web site from your personal computer. It just won’t be
    able to handle thousands of visitors every day.


    This leads us to the Web server software. There are several programs available
    that will listen on port 80 and respond to HTTP requests. Some are easier to use
    than others. Also, some work on one operating system but not another. The two
    most commonly used are Microsoft’s Internet Information Server, commonly called
    IIS, and the Apache Web Server from www.apache.org. Since IIS is strictly for
    Windows, we will devote much of this chapter to Apache.


    **Note** You can go to www.netcraft.org and type in any Web site’s address. It
    will then tell you what kind of Web server that Web site is using.'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# # The Apache Web Server


    Apache is a full-featured robust Web server that is available, free of charge,
    for Unix, Linux, and even for Windows. This software is completely open source
    and is free to download from www.apache.org. It also ships with Red Hat Linux.
    The fact that it is included in the Red Hat installation makes it ideal for our
    purposes. The Apache Project is a collaborative software development project whose
    aim is to produce a robust, professional-level, full-featured HTTP (Web) server.
    The project is managed by a group of volunteers located around the world, using
    the Internet and the Web to communicate. These volunteers are known as the Apache
    Group. It is important to realize that the entire process is done by volunteers
    donating their time and expertise. In addition, hundreds of Apache users have
    contributed ideas to the project.


    # ## Apache History


    Before we delve into the intricacies of working with Apache, it might be a good
    idea to explore its history just a little. In February 1995, the most popular
    server software on the Web was an HTTP daemon developed by Rob McCool at the National
    Center for Supercomputing Applications, University of Illinois, Urbana-Champaign.
    Recall that a daemon is just a program that runs in the background without interaction
    from the user sitting at the computer. In Windows these are called services. Unfortunately,
    development of that Web server stalled after Mr. McCool left NCSA in 1994. However,
    since it was open source, many Webmasters developed their own extensions to the
    Web server as they were needed. A small group of these Webmasters decided that
    they should coordinate their efforts into a standard release of the software.
    Brian Behlendorf and Cliff Skolnick put together a mailing list and set up a server
    to hold extensions written by the core development team. At that point these eight
    core contributors formed the foundation of the original Apache Group. The names
    of these individuals are


    +   - Brian Behlendorf

    +   - Roy T. Fielding

    +   - Rob Hartill

    +   - David Robinson

    +   - Cliff Skolnick

    +   - Randy Terbush

    +   - Robert S. Thau

    +   - Andrew Wilson


    They started with Version 1.3 of the NCSA Web server as a base and then added
    all of the published bug fixes and enhancements they could find. Apache was an
    immediate success. Webmasters loved the price: free! And developers loved the
    open source concept. This enabled any competent programmer to make modifications
    and submit them for release as part of the next version of Apache.


    Apache exists today for a few rather simple reasons. It is a robust, professional-grade
    Web server that is free of charge. Apache was originally available only for Unix-based
    systems, but has since been ported to Windows. This brings us to one last but
    very humorous point in the history of Apache, the name. Some people seem to think
    the name is derived from the Native American tribe, but this is not true. Since
    this Web server was originally the work of several different developers patched
    together, it was called A-Patchy-Server. This name eventually morphed into Apache
    Server.'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# # How to Set Up Apache


    If you have Red Hat Linux, then Apache comes with it. And if you followed the
    instructions in Chapter 2, then it is already installed on your system. However,
    in case you are not sure, remember that you can go to the Start menu, select System
    Tools, and choose Packages to see if it is installed. You can add it if it''s
    not already installed.


    Now we are going to need to modify a few files. To find them it would be best
    to use the File Manager, so your next step is to launch that application. If you
    will recall, when we first discussed File Manager, you where admonished to spend
    some time getting comfortable with it, as it would be used later in this book.
    If you still don''t feel comfortable with the File Manager, take the following
    steps slowly, consulting the images provided in this chapter to ensure that you
    are on the right track.


    You will need to first find the /etc/httpd/conf directory. Use the File Manager
    to locate the etc directory, then open it. Within that directory you will find
    a subdirectory named httpd. Then you look under that directory for yet another
    subdirectory named conf. Browse through this until you find the httpd.conf file.
    When you find it, right-click on it and open it with Text Editor. This directory
    and file are shown in Figure 15.2.


    ![](img/12d790664598bbf390261087fbe55bbc_330_0.png)


    **Note** Do not double-click on the file. If you do that, the document will be
    opened in a read-only mode, and you won''t be able to make any changes. Recall
    that many applications, including the File Manager, work like a Web browser. If
    you double-click on a file, it will open like a Web page, for viewing only.


    You will see that this is a large text file with a lot of information in it. You
    may even feel a bit overwhelmed. There are dozens of settings available in this
    file. However, most of them are not required for basic Web server operation. These
    settings are important for advanced Web server operations that are beyond the
    scope of this book. Entire books have been written on Apache, and you would need
    to consult such a book to go deeper into Apache. There are only a few settings
    in this that you even care about. The most important is ServerName. Follow these
    steps and you can have your server running.


    **Note** It will only be accessible from your machine. This is a test mode to
    see if the Apache server itself works properly. If all goes well, we will go back
    and change a few things to make it accessible from the entire Internet. Also note
    that the ServerName setting is sometimes commented out with a pound symbol in
    front of it. Delete the pound symbol.


    +   1. Set the ServerName = localhost. This is shown in Figure 15.3.'
  merge: -1
  img_proc: true
- pgno: 331
  md: '![](img/12d790664598bbf390261087fbe55bbc_331_0.png)


    Figure 15.3: The ServerName setting.


    +   2. Save the file.


    +   3. From a shell, `type /etc/init.d/httpd start`. The server should start and
    you get an OK message. This is shown in Figure 15.4.


    ![](img/12d790664598bbf390261087fbe55bbc_331_1.png)


    Figure 15.4: Starting the HTTPD service.


    +   4. Open your browser and go to `http://localhost/`. You should see the Apache
    default Web site. The screen you should see is depicted in Figure 15.5. If you
    do not see this screen, then one of the steps was executed in error; most likely
    your changing of the httpd.conf file. Common errors and their resolutions are
    discussed in just a few paragraphs.'
  merge: -1
  img_proc: true
- pgno: 332
  md: '![](img/12d790664598bbf390261087fbe55bbc_332_0.png)


    If your test worked and you can see the basic Apache default page, it is time
    to make your server go live. To do this, there are just a few steps to follow.


    +   1. First stop the server. You do this by going to a shell and typing in `/etc/init.d/httpd
    stop`. This is shown in Figure 15.6.


    ![](img/12d790664598bbf390261087fbe55bbc_332_1.png)


    +   2. In the `/etc/httpd/conf/httpd.conf` file, change the following settings:


    +   a. Change `servername` to your registered URL or to your IP port such as `10.10.10.117:80`.
    If you don''t remember your IP address, don''t worry. Just go to the shell and
    type in `ifconfig`. This will give you your IP address.


    +   b. Change `listen` to reflect the IP and port you want.


    +   3. Check the `documentroot` directory to make certain that is where you want
    your Web pages to be served from. The default is `/var/www/html`. Whatever directory
    you put as your `documentroot` is where Apache will look for Web pages.


    +   4. From a shell, type `/etc/init.d/httpd start`.


    You should now be running a Web server. Go to any other machine that is connected
    to the Internet and point the browser to `http://yourserverrorip`. For example,
    you might point the browser to `http://10.10.10.01` if that is the IP of your
    machine.


    If you are running this from your home, then the chances are that you use an Internet
    service provider to get to your machine. For this to work all of the time, you
    will have to do two things:


    +   1. Leave your Internet connection running. If you are not connected to the
    Internet, no one can reach your Web server.


    +   2. Ask your ISP for a static IP address. Recall from our previous discussions
    of network configuration that this means you have the same IP address every time
    you log on. Without this, your IP may change, and then people trying to visit
    your Web site won''t find it.'
  merge: -1
  img_proc: true
- pgno: 333
  md: "**Note**\tAny time you change the configuration file, you must stop the Web\
    \ server and restart it.\n\nIf you want to use a URL rather than an IP address,\
    \ you will need to go through the appropriate company to register a domain name.\
    \ For example, the author has his Web site registered as www.chuckeasttom.com.\
    \ There are several companies that will perform this service for you for a small\
    \ fee. A list of a few of the more widely known companies is provided here:\n\n\
    +   - www.networksolutions.com\n+   \n+   - www.register.com/\n+   \n+   - www.cheap-domainregistration.com/\n\
    +   \n+   - www.nic.us/\n+   \n+   - www.easyspace.com/\n+   \n+   - www.aitdomains.com/\n\
    \nYou also can do a Web search using a search engine such as Yahoo! or Google\
    \ to find other places to register your domain. This list is not an endorsement\
    \ of any of these sites, it is only a starting point in case you don’t know where\
    \ to go to register a domain name.\n\nAt this point your Apache Web server is\
    \ almost ready to go. There is only one small hurdle to overcome. When you first\
    \ installed Linux, you probably left the firewall settings at their default values.\
    \ With many distributions, this blocks HTTP and FTP, and that will keep your Web\
    \ server from being able to communicate. It is probably a good idea to go to your\
