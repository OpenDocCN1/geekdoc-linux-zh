- pgno: 398
  md: '# File Compression from the Shell


    Many people find that from time to time they need to compress several files into
    one archived file. There can be many reasons for doing this. One reason is to
    archive old files that you don''t use but do not want to destroy. Most archiving
    tools also compress the files, so that the archived file takes up less disk space
    than the original file did. However, you should be aware that compression is not
    always part of compiling files into an archive file. With some archive tools,
    compression is an option that you choose to add or not to add. Another reason
    to archive files is to send them over the Internet. If you have five files to
    send, compressing them into a single archive would make it easier to send them.


    There are several programs available for Windows that do this sort of archiving.
    Perhaps the most popular is WinZip®. WinZip is a shareware program, which means
    you can download a free trial version. It has a very user-friendly graphical interface
    that enables you to compress files into an archive and extract them from that
    archive with ease.


    Just as Windows users need the capability to archive and extract files, so do
    Linux users. There is a very interesting Linux utility that works from the shell
    called `tar`. The `tar` program can be used to compress files and to extract them.
    It comes with all Linux distributions, so if you send a `tar` file to a friend
    or colleague who is using Linux, you can rest assured that he will have the necessary
    tools to extract the files.


    Since `tar` is a shell command, you might have guessed that there are several
    flags you can pass to it to make it do what you require. **Table 19.3** illustrates
    the most important of these flags. You can get a complete list at the shell by
    typing in `tar -help`.


    # **Table 19.3: The tar Flags**


    | The Flag | The Flag''s Purpose |

    | :--- | :--- |

    | `-c` | This flag is used to create a new archive file. |

    | `-x` | This flag is used to extract files from an archive. |

    | `-r` | This flag is used to append new files to an existing archive. |

    | `-f` | This is used in working with a file. |

    | `-t` | This is used simply to list the contents of an archive file. |

    | `-t` | This is used to list the contents of an archive file. |

    | `-v` | This is often used with `-t`. It designates a verbose response. |

    | `-z` | This flag directs the `tar` to use gzip compression. |


    Let''s take a look at these files in action. In **Figure 19.19** you can see that
    an `ls` command was executed to see what files were in the current directory.
    Then the `tar` command was used to create a new archive file. This was done by
    typing `tar`, followed by the flags for create (`c`) and file (`f`) and the new
    archive file''s name, then the files to add to this archive were listed.'
  merge: -1
  img_proc: true
