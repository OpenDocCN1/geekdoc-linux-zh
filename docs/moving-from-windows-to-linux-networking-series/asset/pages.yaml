  md: 'processes that are currently running. Every program, utility, or daemon on
    your PC is a process. The `ps` command, shown in Figure 18.8, shows only those
    processes that you, the current user, initiated.


    ![](img/12d790664598bbf390261087fbe55bbc_375_0.png)


    The `top` command shows all the processes, even those you did not initiate. Your
    system starts a number of processes for you. The `top` command also tells you
