- pgno: 207
  md: 'Inserting a chart, which you can do in Microsoft Excel, is a very common task
    in any spreadsheet tools. A spreadsheet is an excellent way to organize data and
    perform calculations. However, most people respond best to visual cues such as
    charts. If you select Insert and then choose Chart, you will see a screen, shown
    in **Figure 9.16**, that prompts you to choose what cells to include in your chart.
    You can also select which rows and columns you want to use as labels for your
    chart.


    ![](img/12d790664598bbf390261087fbe55bbc_207_0.png)


    **Figure 9.16:** The Chart Wizard step one.


    The next step, shown in **Figure 9.17**, enables you to select the various settings
    for your chart. You can select from bar charts, pie charts, line graphs, and 3D
    charts. There are a number of options at your disposal. You also can choose whether
    to display your data in rows or columns. For our purposes we will choose columns
    and a bar chart, then press Next.


    ![](img/12d790664598bbf390261087fbe55bbc_207_1.png)


    **Figure 9.17:** The Chart Wizard step two.


    The next screen enables you to choose whether you want horizontal (X) and/or vertical
    (Y) grid lines. You then move to the next screen, shown in **Figure 9.18**, where
    you can enter a title for your chart and titles for the X and Y axes.'
  merge: -1
  img_proc: true
- pgno: 208
  md: '![](img/12d790664598bbf390261087fbe55bbc_208_0.png)


    **Figure 9.18:** The Chart Wizard step three.


    When you are done and press the Create button, you will have created a chart,
    much like the one shown in Figure 9.19. Charts are a very important addition to
    any spreadsheet. For most people, a chart is required to make the data really
    come alive.


    ![](img/12d790664598bbf390261087fbe55bbc_208_1.png)


    **Figure 9.19:** Your chart.


    You can see that creating a chart is a relatively simple thing to do with Open
    Office Calc. Charts are a very important part of any spreadsheet application.
    Storing data, running calculations, and creating charts are the essential elements
    of any spreadsheet application.


    The next button on this toolbar enables you to add simple drawings to your spreadsheet.
    This may seem like an unnecessary or even frivolous addition to a spreadsheet
    application, but that is not necessarily correct. The various drawing options,
    seen in Figure 9.20, enable you to add even more visual impact to your data presentation.
    When appropriately combined with a chart, this can make the presentation of your
    data far more compelling than it otherwise would be. Any graphical representation
    of your data has an important impact on the way others will receive and form conclusions
    based on that data.'
  merge: -1
  img_proc: true
- pgno: 209
  md: '![](img/12d790664598bbf390261087fbe55bbc_209_0.png)


    **Figure 9.20:** The drawing options.


    Further down the toolbar we come to an option not present in Microsoft Excel.
    That option is themes. When you place your mouse over that button, the caption
    says Choosing Themes. When you click this button, you see the image in *Figure
    9.21*. This enables you to select a theme for your spreadsheet.


    ![](img/12d790664598bbf390261087fbe55bbc_209_1.png)


    **Figure 9.21:** Open Office Theme Selection.


    For example, the Sun theme shown in *Figure 9.22* is just one of the several themes
    you can select. Of course, these themes do not offer any new functionality to
    your spreadsheet, but just like charts and drawings, themes can add a new dimension
    to the presentation of your data.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '![](img/12d790664598bbf390261087fbe55bbc_210_0.png)


    **Figure 9.22:** The Sun theme.'
  merge: -1
