    \ may be a seemingly endless number of possibilities, there are a few common problems\
    \ and their resolution. For your convenience, they are listed in Table 15.2. Of\
    \ course, the very first step in troubleshooting is to check the basics. The following\
    \ are the four basic Apache troubleshooting steps. Check these before checking\
    \ anything else:\n\n+   1. Is your Web server running?\n+   2. Is it connected\
    \ to the Internet?\n+   3. Did you type in the address correctly without misspelling\
    \ it?\n+   4. Have you checked the error log for error messages?\n\nIf these steps\
    \ don’t uncover your problem, then consider the options in Table 15.2.\n\n# Table\
    \ 15.2: Common Problems\n\n| Problem | Resolution |\n| :--- | :--- |\n| When connecting\
    \ to the IP address, the browser says Cannot Resolve IP Address, Already in Use.\
    \ | If you have ServerName and Listen set to the same IP address, this error will\
