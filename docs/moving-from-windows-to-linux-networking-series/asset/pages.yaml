- pgno: 138
  md: '# System Administration


    You may have noticed a section entitled System Administration. This section is
    for some of the more common system administration tasks. We will take a look at
    the ones that are most likely to be of use to you on a routine basis.


    # Login Manager


    The Login Manager allows you to establish how the login screen is presented to
    the user when he logs in. This screen has six tabs that enable you to specify
    every aspect of the login process and appearance. You can see the screen in Figure
    6.16.


    ![](img/12d790664598bbf390261087fbe55bbc_138_0.png)


    The first tab allows you to set the greeting, whether or not to show the logo
    (Tux the penguin), to show a clock, and what color scheme to use for the login
    screen. You can also change what character appears when someone is typing in a
    password. Most people are used to seeing one asterisk appear for each character
    they type, so it''s probably a good idea to stick with this format, but you can
    change it if you want. The next two tabs allow you to further customize the login
    screen by setting the font and the background. These tabs handle purely cosmetic
    properties of the login screen and should be set to whatever you find pleasing.


    The fourth tab, labeled Sessions and shown in Figure 6.17, is not cosmetic at
    all. This tab deals with the options the user will be presented with when he gets
    to the logon screen and what he can do from this screen.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/12d790664598bbf390261087fbe55bbc_139_0.png)


    Figure 6.17: The fourth tab of the Login Manager.


    As you can see, the first two settings allow you to determine what users can use
    the console/shell and what users can log on remotely. The second set of options,
    Commands, determines what happens when you halt or reboot. You should leave these
    with the default settings unless you have some very compelling reason to alter
    them. The third section simply determines whether or not to show the boot options
    on the login screen. This will make very little difference unless your machine
    is set to dual boot with two or more alternative operating systems (such as Linux
    and Windows).


    The fourth section is the most interesting. Here is where you decide what startup
    options the user has. You will note that under Available Types there are four
    different settings for the user interface. As was mentioned earlier, while KDE
    and GNOME are the most popular graphical user interfaces, they are not the only
    ones available for Linux.


    The Users tab allows you to select an image to display and to choose whether or
    not to show a list of users for the person to pick from. This would mean that
    instead of simply typing in their usernames and passwords, they could pick from
    a list of users and then enter the appropriate password.


    This sixth and final tab, labeled Convenience, allows you to set some items that
    you may find convenient. However, you should remember that convenience almost
    always comes at a price. On this screen you can choose to allow people to log
    on without a password. Unless the machine is a home machine, such an option would
    be very foolish. Even if it is a home machine, you should think very hard before
    choosing this option. Do you really want your 10-year-old to be able to log on
    as root and have complete system administration privileges?'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# # Regional and Accessibility


    This section allows you to set some accessibility options, which we have examined
    previously. However, it also allows you to reconfigure your machine for a given
    region. After you have chosen Regional & Accessibility, click on Country/Region
    & Language, and you should see a screen much like that in Figure 6.18.


    ![](img/12d790664598bbf390261087fbe55bbc_140_0.png)


    **Figure 6.18:** Country/Region & Language.


    The first tab, Locale, allows you to set what nation and language settings to
    use. You can see at the bottom of this tab that your current settings are shown.
    The second tab determines how you will display numbers. The third tab is probably
    the most important for setting up your machine for a different country. This tab
    allows you to change how money is displayed. Obviously, currency is quite different
    from one nation to the next, so this tab can be quite important. The fourth tab
    establishes how you will display times and dates. This tab is more a matter of
    preference than regions. The final tab will allow you to choose paper format and
    measurement systems. If you are traveling abroad, you should remember that most
    countries use the metric system.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# # Scheduling Tasks


    One very useful feature of Linux is the capability to schedule certain tasks to
    take place at some future date and time. If you will recall, earlier we discussed
    programs that run in the background and accomplish tasks. In Linux and Unix these
    are referred to as daemons, and in Windows they are called services. Most daemons
    in Linux end in a letter d. The daemon that is responsible for handling scheduled
    tasks is called cron**d**, for chronological daemon. You can completely manage
    cron**d** via shell commands, and we will visit that topic in Chapter 8, “*Moving
    from Microsoft Word to Open Office*,” but right now we will see how to do this
    through the KDE interface. Like most tasks, scheduling tasks via the KDE interface
    is a lot easier and more user friendly than doing it via shell commands. To get
    to the Task Scheduler, you can go to System Tools and select Task Scheduler. You
    should see something much like what is displayed in Figure 6.19.


    ![](img/12d790664598bbf390261087fbe55bbc_141_0.png)


    **Figure 6.19:** The Task Scheduler.


    To schedule a new task, you simply expand the category appropriate to your task
    and right-click on New Tasks, as shown in Figure 6.20.


    ![](img/12d790664598bbf390261087fbe55bbc_141_1.png)


    **Figure 6.20:** New Tasks.


    When you do this you will see a screen like the one shown in Figure 6.21. On this
    screen you can decide when you want this task to run. You can pick months, days,
    time of day, even down to the exact minute when you want the task to run. Then
    use the Browse button to select the program you want to run.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '![](img/12d790664598bbf390261087fbe55bbc_142_0.png)


    **Figure 6.21:** Scheduling a new task.


    That is all that is required to schedule any task. You can have any program you
    want run automatically at a certain time and date. This is very useful for system
    administrators who want particular programs or scripts to run when they are away.
    This allows you to have certain cumbersome administrative tasks take place when
    you are away from the computer.'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# Kickstart Configurator


    Linux, being a descendent of Unix, was designed with a powerful high-end server
    in mind. For that reason, Linux, like many Unix variants, comes with a wide assortment
    of configuration utilities. Some of these, such as the System Monitor, have Windows
    analogs you can relate to. However, some utilities, such as Kickstart Configurator,
    do not have any close analog in the Windows world. The Kickstart Configurator
    is a very useful KDE program. It is found under System Tools, and the main screen
    is shown in Figure 6.22. The Red Hat official documentation describes Kickstart
    in this manner: “Kickstart Configurator allows you to create a kickstart file
    using a graphical user interface, so that you do not have to remember the correct
    syntax of the file.” This means it allows you to generate a configuration script
    via a very easy to use graphical interface. It allows you to reconfigure all the
    things you set up in Chapter 2. It is often used by system administrators to create
    a single install script to be used for installs across an organization. From the
    basic configuration screen, you can change the language, mouse, keyboard, time
    zone, and other important settings.


    ![](img/12d790664598bbf390261087fbe55bbc_143_0.png)


    The next screen that is of particular interest to us is the Boot Loader Options
    screen, shown in Figure 6.23. As you can see, this screen allows you to choose
    which boot loader to use. Even though GRUB is the newest boot loader, you don’t
    have to use it. You can use LILO if you so desire. You can also choose to have
    a password on GRUB if you like.'
  merge: -1
  img_proc: true
- pgno: 144
  md: '![](img/12d790664598bbf390261087fbe55bbc_144_0.png)


    **Figure 6.23:** The Boot Loader Options screen.


    After that, you come next to the Partition Information screen, shown in **Figure
    6.24**. This screen should be used with great caution. You can readily see that
    one option is to remove all existing partitions. If you select this, you would
    wipe out your entire hard drive. This screen is of use only in certain restricted
    cases. For the most part, you will want to avoid altering anything on this screen.


    ![](img/12d790664598bbf390261087fbe55bbc_144_1.png)


    **Figure 6.24:** The Partition Information screen.'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'The next two screens, Network Configuration and Authentication, provide yet
    another way to configure options we have already explored. We have seen three
    different ways to configure your network card after installation. Also recall
    from our earlier discussion of authentication that, if you lack any substantial
    familiarity with security, you should probably leave the authentication at default
    settings.


    The Firewall Configuration screen, like the two preceding screens, provides yet
    another way to configure a particular part of your system. We mentioned firewall
    configuration during the initial install and noted that you could always reconfigure
    the firewall settings at a later date, as you learned more about networks. The
    Kickstart Configurator is one of the vehicles you can use to reconfigure your
    firewall.


    The X Configuration screen, shown in Figure 6.25, is quite interesting. With this
    screen you can reconfigure your system’s screen resolution, video card, monitor,
    and default desktop. This screen is likely to be of interest even to casual users.
    One setting that people on any system (Windows, Macintosh, or Linux) seem inclined
    to change from time to time is their display settings.


    ![](img/12d790664598bbf390261087fbe55bbc_145_0.png)


    The final three sections of Kickstart Configurator are used only to alter how
    an installation proceeds. Since we have already installed, these particular settings
    are not important to us at this time. If at some later date you want to install
    a new version of Red Hat, you can follow the installation instructions.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# ## Summary


    This chapter has shown you the essentials of system administration via the KDE
    interface. There are certainly many more tasks you can do in KDE, but these are
    some of the most common. After studying this chapter, you should be able to add
    new users, manage groups, use the System Monitor, add and remove programs, use
    the KDE Control Center, and schedule tasks. Whether you are a casual home user
    or the system administrator for your office, these are common tasks that you will
    find yourself using with some frequency.


    Of course, there are more system tools and administrative utilities in the KDE
    desktop interface that you may want to use. The utilities presented in this chapter
    are the most commonly encountered utilities. It is recommended that you take some
    time to experiment with these various utilities and become familiar with them.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# ## Review Questions


    +   1. What is a daemon?


    +   2. What daemon is responsible for scheduling tasks?


    +   3. Why is your birth date not a good password?


    +   4. What protocol is used for sending e-mail?


    +   5. What protocol is used for receiving e-mail?


    +   6. What KDE utility would you use to find out how much memory is being used
    by your system?


    +   7. What is the purpose of the KDE control center?


    # ## Answers


    +   1. A program that runs in the background. In Windows, this is called a service.


    +   2. crond


    +   3. It would be too easy for someone to guess.


    +   4. SMTP (Simple Mail Transfer Protocol)


    +   5. POP3 (Post Office Protocol)


    +   6. The System Monitor


    +   7. To provide a single, convenient location from which to accomplish many
    common administration tasks.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Chapter 7: The GNOME Interface


    # Introduction


    As was previously mentioned, there are a number of different graphical interfaces
    you can use with Linux. Rather than have a single desktop environment choice as
    you have in Windows and Macintosh, you have several to choose from. Obviously,
    some of these are more commonly used than others. Some are rather obscure and
    rarely encountered. For the purposes of this book, we can ignore the more obscure
    desktop environments. KDE and GNOME are the two most commonly used desktop environments
    for Linux. Most of this book will focus on the KDE interface. This choice of KDE
    over alternative interfaces is strictly a matter of popularity. There is no technical
    reason to prefer KDE over GNOME. Both are very easy to use graphical interfaces
    and have several things in common. In fact, they even have many facets of their
    desktops in common. If you become proficient with one, learning the other should
    not be difficult. In fact, you can install both KDE and GNOME on your PC. At the
    login screen, simply click on Session at the bottom of the screen and select which
    interface you prefer to use during a session. Since GNOME and KDE can work side
    by side, and because it is so easy to switch back and forth between them, it seems
    prudent to examine GNOME, at least briefly. It should also be pointed out that
    GNOME is also quite popular, and many Linux users like it. If we at least look
    at both, then you might decide which interface you prefer. Remember that one of
    the cornerstones of the open source software philosophy is that you, the computer
    user, should have lots of choices. Even if you still prefer KDE, you will at least
    have a basic familiarity with GNOME. If you followed the instructions for installation
    in Chapter 2, "Installing Linux," then you should have both KDE and GNOME on your
    computer. If you did not, then skip to Chapter 14, "Miscellaneous Linux Applications,"
    which has a section on adding new packages.


    GNOME is part of the GNU project and is itself an open source application. GNOME
    is an acronym for GNU Network Object Model Environment. The GNOME project was
    officially started in August 1997, and the first release was in December of the
    same year. However, this release was just a barebones development release. It
    was intended for programmers to examine, improve upon, and submit changes, if
    they so desired. GNOME 1.0, the first version for the general public, was released
    in March 1999. GNOME is based on an underlying engine called GTX. This means that
    it can run on any Unix-like platform that uses GTX. You can find out more about
    GNOME at [www.GNOME.org/](http://www.gnome.org/).'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# ## Getting Around in GNOME


    The first objective we must achieve is to help you get acclimated to GNOME. Before
    you can start using GNOME applications, you need to get used to moving around
    in the GNOME interface. You will need to know where to find things before you
    will be able to effectively use GNOME. Fortunately, the GNOME layout is not radically
    different from KDE, and by this point in this book, you should be comfortable
    with KDE. When you first launch GNOME, you will see a screen much like the one
    shown in Figure 7.1.


    ![](img/12d790664598bbf390261087fbe55bbc_149_0.png)


    **Figure 7.1:** The GNOME interface.


    As you can see, it is very similar to the KDE screen, and in fact it is almost
    identical. You also will find that the Start menu has almost identical options
    to those you saw in KDE. Still, there are several differences. The first is in
    some of the applications that ship with the interface. There are some applications
    that ship with KDE that do not ship with GNOME, and vice versa. For example, if
    you use Red Hat and KDE, then you have access to Image Magick. If you use Red
    Hat and GNOME, you do not. However, GNOME ships with Eye of GNOME Image Viewer,
    which KDE does not have. Both interfaces, however, ship with Gimp, which we will
    be exploring in some detail later in this book. You will probably also notice
    as you proceed through this book that when you install both GNOME and KDE, as
    we did in Chapter 2, you find applications mingled. If a KDE application can run
    in GNOME, and you have both GNOME and KDE installed, then you will see that KDE
    applications when you run GNOME. The reverse is also true. If you have an application
    designed for GNOME, and both GNOME and KDE are installed, you will see that GNOME
    application even when you are using KDE.


    Another difference between the two desktop environments is in how the interface
    itself behaves. With KDE, the Print Screen button on the keyboard does nothing.
    With GNOME, it works; in fact, it works better than it does in Windows. In Windows,
    the Print Scrn button simply copies the current screen to the Clipboard. You then
    would have to open some graphics program, such as Microsoft Paint, and paste that
    image into it before you could save it, alter it, or work with it in any way.
    With GNOME, when you click the Print Screen button, a small graphics program is
    launched containing the current screen.


    You should be thrilled to know that the default Web browser and e-mail client
    in GNOME are the same as the ones in KDE. Mozilla is the default Web browser,
    and Evolution is the default e-mail client. There is absolutely no difference
    in how Mozilla works in KDE and how it works in GNOME. Incidentally, you also
    can get Mozilla for Windows; just go to www.mozilla.org. That allows you to use
    the same type of Web browser in GNOME, KDE, and Windows. This is probably more
    convenient than trying to keep current with two or more Web browsers.


    In a later chapter, we will look carefully at the things you can do with Mozilla.
    There are other applications available with GNOME. For example, GNOME also has
    a Web browser called Galeon, as well as an e-mail client named Balsa. But it still
    has Mozilla and Evolution, which you learned to use with KDE, so you may choose
    to continue to use those applications.


    All the basic groups you found in KDE are still here in GNOME. You have Accessories,
    Games, Graphics, Internet, Office, Preferences, Programming, Sound and Video,
    System Settings, and System Tools. Many of the same applications and utilities
    are found in these groups. In short, if you are comfortable with KDE, you should
    be able to move around in GNOME without much difficulty. However, there are a
    few key differences, especially in regard to certain utilities or programs that
    exist with one interface but not the other. In this chapter we will look at some
    of these.'
  merge: -1
  img_proc: true
