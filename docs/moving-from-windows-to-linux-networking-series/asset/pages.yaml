- pgno: 253
  md: '# # Chapter 12: Moving from Adobe Photoshop to GIMP


    # ## Introduction


    Like many Windows users, you probably have come to expect a lot of powerful graphics
    capability on your PC. Some Windows users are satisfied with the Paint and Photo
    Editor applications that come with Windows and are found under Accessories in
    the Programs menu. However, neither of these applications is a full-featured,
    robust, graphics package. Neither of these packages is of professional caliber.
    They are quite limited in what they enable you to do with an image. This of course
    leads to the question of what graphics application is of professional caliber?
    Many Windows users, as well as Macintosh users, turn to Adobe Photoshop as their
    choice for graphics applications. Adobe Photoshop is one of the most widely used
    graphics applications on the market today. It is hard to imagine anyone involved
    in graphics design, digital photography, or a related field who has not used Adobe
    Photoshop. However, there is no version of Photoshop available for Unix or Linux
    machines. It should also be pointed out that Adobe Photoshop is a commercial product
    and can cost several hundred dollars. Even if there were a version of Adobe Photoshop
    released for Linux (and as of this writing there are not even any hints or rumors
    to that effect), there is still another reason why you might want to search for
    an alternative product. If you are a home user, not a graphic artist, who wants
    a professional caliber program for your own use, it may seem unreasonable for
    you to pay several hundred dollars for a graphics application.


    This is where GIMP comes in. GIMP is a graphics application that can do virtually
    everything that Adobe Photoshop can do. In fact, if you are experienced with Photoshop,
    you will probably be able to master GIMP within a matter of a few hours. The two
    applications are that similar. There are two real advantages to GIMP. The first
    is price. GIMP is open source and is available as a free download from [www.gimp.org](www.gimp.org).
    The second advantage is the platforms that GIMP is available for. GIMP was designed
    for Unix and Linux, but there is also a Windows version available. Much like Open
    Office, you can get GIMP for free and use it on both Windows and Linux machines.'
  merge: -1
  img_proc: true
- pgno: 254
  md: '# What Is GIMP?


    GIMP is an acronym for General Image Manipulation Program. As we already mentioned,
    GIMP is an open source software application and is available free of charge. It
    was originally a project of Spencer Kimball and Peter Mattis, two students who
    were undergraduates at the University of California, Berkeley, when they created
    GIMP. It began as a project for one of their classes. They actually started out
    to write a LISP compiler. Frustration with the project caused the two students
    to move in a new direction. They decided to write an image manipulation project
    in C. The result has quickly grown into a full-fledged image editing program.
    As of this writing, GIMP releases are being orchestrated by Manish Singh. You
    can find out more on the history, current status, and future of GIMP by going
    to [www.gimp.org](http://www.gimp.org). You can also download your own copy of
    GIMP for Linux or for Windows from this Web site.


    GIMP is a complete, fully functional graphics program. It is on a par with Adobe
    Photoshop and shares many features with that product. GIMP enables you to do professional-level
    graphics manipulation. It is ideal for a graphic artist, advertising professional,
    or any person that needs top-quality graphics. In this chapter we will examine
    using GIMP and walk you through the basics. If you followed the installation instruction
    in Chapter 2, "Installing Linux," then GIMP is already on your PC. If you did
    not, you can use the Packages option to add GIMP, or you can download it from
    the GIMP site.'
  merge: -1
  img_proc: true
- pgno: 255
  md: '# ## GIMP Basics


    When you first launch GIMP, you will see a splash screen, shown in Figure 12.1.
    This screen is there to let you know the progress of GIMP in loading its various
    components and tools. How long this process takes depends on your computer. However,
    even on slow computers it is usually less than one minute. Of course, if you have
    several applications running simultaneously, this will slow things down quite
    a bit.


    ![](img/12d790664598bbf390261087fbe55bbc_255_0.png)


    **Figure 12.1:** The GIMP splash screen.


    Once the splash screen is done, you are shown a tip screen, depicted in Figure
    12.2. There is a small check box on the bottom of this screen where you can elect
    to have tips show up at startup all the time. As a beginner it is probably a good
    idea to keep these tips showing. You will probably learn a lot about GIMP by reading
    these tips when learning GIMP. After you are more comfortable with GIMP, you can
    then decide to stop the tips from showing up every time you start GIMP.


    ![](img/12d790664598bbf390261087fbe55bbc_255_1.png)'
  merge: -1
  img_proc: true
- pgno: 256
  md: '**Figure 12.2:** The GIMP tip screen.


    Once GIMP is running and you have made it past the splash screen and tip screen,
    you should immediately notice one major difference between GIMP and Adobe Photoshop.
    Photoshop, shown in **Figure 12.3**, has all the various tools together on one
    screen.


    ![](img/12d790664598bbf390261087fbe55bbc_256_0.png)


    **Figure 12.3:** Adobe Photoshop.


    GIMP has each set of tools in a separate window, shown in **Figure 12.4**. These
    windows can be moved or even closed in any manner you want. Some people find this
    layout a little confusing, but once you get used to it, you may come to realize
    that it provides you with a great deal of flexibility. You will find that many
    professional graphics programs choose this sort of layout. This is due to its
    flexibility. It enables the software user to place things in any way that he finds
    convenient.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '![](img/12d790664598bbf390261087fbe55bbc_257_0.png)


    Figure 12.4: GIMP.


    In a single chapter we will not be able to make you a master of GIMP, and no book
    will be able to give you creativity or artistic talent if you happen to be lacking
    in that area. However, this chapter can provide you with a basic understanding
    of the tools available to you in GIMP. Even without artistic inclinations, a person
    with a firm grasp of the basics of any graphics tool can create some interesting
    and compelling images. The author is lacking in artistic talent but has been able
    to create interesting and exciting Web graphics using both Adobe Photoshop and
    GIMP. This means that even if you are not an artist, don''t give up; you might
    find that GIMP gives you the right tools so you can at least fake it!


    # # GIMP Drop-Down Menu


    Let''s begin our exploration of GIMP by examining the drop-down menu at the top.
    This is actually a good place to begin examining any software package you are
    new to. Usually the drop-down menu provides access to an application''s core functionality.
    You will find many useful menu items here. Start with the File menu, shown in
    Figure 12.5a. As you can see, this menu offers some basics you probably expected,
    such as Open, Close, New, and Exit.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '![](img/12d790664598bbf390261087fbe55bbc_258_0.png)


    **Figure 12.5A:** The File menu.


    Most of these are standard menu options that you have undoubtedly seen in countless
    applications, with both Microsoft Windows applications and Linux. The Open menu,
    however, will present a dialog box that looks just a little different from the
    one you may be used to in Microsoft Windows. This dialog box, shown in Figure
    12.5B, works just like any other dialog box but has a slightly different look
    and feel than the standard Windows dialog box.


    ![](img/12d790664598bbf390261087fbe55bbc_258_1.png)


    **Figure 12.5B:** The dialog box.


    This menu also has a few items you might not be familiar with. The first is the
    Acquire menu, shown in Figure 12.6. This menu item is for acquiring images directly
    from some source, usually a device attached to your computer such as a scanner,
    Web cam, or digital camera. The sources include a screen shot of your current
    screen, the clipboard (items that were previously copied from some source), and
    a scanner you might have connected to your PC.'
  merge: -1
  img_proc: true
- pgno: 259
  md: '![](img/12d790664598bbf390261087fbe55bbc_259_0.png)


    After you start GIMP you will be working with either a new image or an existing
    image. The most common choice is to modify an existing image. Working with an
    existing image, you can alter and enhance that image, and very little artistic
    ability is required. To create an image completely from scratch requires a certain
    level of artistic competence. In this chapter we will concentrate on how you can
    alter existing images, with only moderate coverage of creating new images. This
    emphasis is because many readers lack the artistic skills to create images from
    scratch; as was previously mentioned, it is certain that the author is lacking
    in that regard!


    To follow along with this chapter, you can open any image you like. In the figures
    in this book, you will see that we will be working with a picture of an eagle.
    But it should be stressed that for our purposes, any image will do. Our eagle
    image is shown in Figure 12.7.


    ![](img/12d790664598bbf390261087fbe55bbc_259_1.png)


    Before we jump into all of those interesting-looking tools you see in your toolbox,
    we want to find out what we can do with this image by clicking a few options (without
    any artistic acumen at all). Don''t worry, we will be experimenting with them
    in due course. But first, let''s examine what you can do with a few quick clicks
    of your mouse. If you right-click your mouse on the image, you will see a pop-up
    menu'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'like the one shown in Figure 12.8. This pop-up menu gives you access to a lot
    of options that we will explore.


    ![](img/12d790664598bbf390261087fbe55bbc_260_0.png)


    **Figure 12.8:** The pop-up menu.


    As you can see, there are several options, and most of them have submenu items
    under them. That means that there is a lot to explore in this pop-up menu. The
    same functions you see in the pop-up menu are also available in Adobe Photoshop.
    However, in Photoshop they are available from the drop-down menu at the top of
    the screen. You will find that in many cases the menu items even have the same
    names. They are just in a different location. The first option, File, repeats
    what you found under the File menu. Once again we see an application giving you
    multiple avenues to the same functionality. This is common practice in any application
    whose aim is to be user friendly. The second option, Edit, shown in Figure 12.9,
    should also be familiar to you. Most of its options are standard to all Edit menus.
    You can cut, copy, paste, undo, and so on. There are only a few items that you
    may not have seen before, and their functions are obvious. For example, Fill with
    BG Color fills the entire image with whatever color it has in its background.'
  merge: -1
  img_proc: true
- pgno: 261
  md: '![](img/12d790664598bbf390261087fbe55bbc_261_0.png)


    Figure 12.9: The Edit menu.


    The next item on this pop-up menu may be quite new to you. It is the Select menu,
    shown in Figure 12.10. This menu enables you to take a selected portion of the
    image and invert it, grow it, and more. You also can choose to select the entire
    image or none of the image or invert your selection (select the area you did NOT
    drag your mouse around). In case you are wondering how to select an area of an
    image, the default tool for GIMP (and for Photoshop) is the Selection tool. Just
    drag your mouse anywhere around the image and it will draw a dotted-line rectangle.
    The area inside the rectangle is selected.


    ![](img/12d790664598bbf390261087fbe55bbc_261_1.png)'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# **Figure 12.10**: The Select menu.


    The View menu, shown in Figure 12.11, is also quite important. You can zoom in
    or out, turn the toolbars on or off, toggle the status bar on or off, and more.
    Often, people using a graphics application—GIMP, Photoshop, or some other program—find
    that zooming in enables them to make changes easier. They can then zoom back out
    to normal size when done making those changes.


    ![](img/12d790664598bbf390261087fbe55bbc_262_0.png)


    Next we come to the Image menu, shown in Figure 12.12. This menu enables you to
    change the image itself in a number of interesting ways. The Image Mode, the first
    option you have, determines if this image is RGB (Red Green Blue), which is how
    JPEG and bitmap images are, or indexed, which is how GIF images are. This is actually
    quite important. It is not at all uncommon for people using graphics applications
    to want to change an image from one type to another. This can be done for many
    reasons. It is common on Web pages to want the smallest image possible. That is
    usually a JPEG. Any image that is a GIF or BMP file, when converted to a JPEG,
    will be significantly smaller. In order to change an image, you must first make
    certain that its mode is correct. You cannot save an image as a JPEG if its mode
    is not RGB. In many cases you can change the mode of the image, thus enabling
    you to save the image as a different file format. The Decompose option enables
    you to extract layers from the image. A layer is when you have sections that were
    pasted into your current image. These different sections are layers. This is a
    task that the casual user will not likely perform, but one a graphics designer
    might use quite frequently.


    ![](img/12d790664598bbf390261087fbe55bbc_262_1.png)'
  merge: -1
  img_proc: true
- pgno: 263
  md: '**Figure 12.12**: The Image menu.


    Next we come to the Layers menu, seen in **Figure 12.13**. This menu enables you
    to work with the various layers in your image. As we previously mentioned, when
    you copy and paste image fragments from different images into a single image,
    you have layers. Each image that is brought in is in its own layer. The Layers
    menu enables you to work with these layers.


    ![](img/12d790664598bbf390261087fbe55bbc_263_0.png)


    **Figure 12.13**: The Layers menu.


    The Tools menu, shown in **Figure 12.14**, gives you access to the same tools
    found in the Toolbox. After we have worked with the Toolbox, if you find you prefer
    using the drop-down menu, you can use this menu item to accomplish most of the
    tasks you would otherwise use the Toolbox for. We will skip examining the use
    of tools for now and return to that topic when we examine the Toolbox.


    ![](img/12d790664598bbf390261087fbe55bbc_263_1.png)


    **Figure 12.14**: The Tools menu.


    The Dialogs menu enables you to select patterns, gradients, and brushes. For example,
    when you look under Dialog and select Brushes, you see the screen in **Figure
    12.15**. You have quite a range of options in selecting your Brush settings before
    you begin painting. We will examine brushes in more detail when we get to the
    Toolbox.'
  merge: -1
  img_proc: true
- pgno: 264
  md: '![](img/12d790664598bbf390261087fbe55bbc_264_0.png)


    **Figure 12.15**: Brushes.


    Now to the Filters menu. This menu, shown in *Figure 12.16*, is full of very interesting
    filters you can apply to your images. These filters enable you to alter the appearance
    of your image completely and radically. You have access to everything from blur
    effects to artistic effects. We will examine a few of them here, but it is highly
    recommended that you take some time to see what each of the filters looks like.
    That way you can become more familiar with the images and discover which ones
    you find particularly attractive.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '![](img/12d790664598bbf390261087fbe55bbc_265_0.png)


    **Figure 12.16:** The Filters menu.


    These filters provide a very easy to use method to add an artistic flair to any
    image. With the simple click of a mouse, you can add very interesting effects
    to your images. Filters are also used frequently with Adobe Photoshop. In Photoshop
    you will find them on the drop-down menu under Filters.


    Let’s take a look at a few of the filters and see what they can do for our eagle
    image. Let’s begin with one of the artistic filters, cubism. You go to Filters,
    select Artistic, and choose Cubism. You are presented with a screen, shown in
    Figure 12.17, enabling you to alter the parameters of this filter. For our example,
    we will use the default settings, and we produce the image shown in Figure 12.18.


    ![](img/12d790664598bbf390261087fbe55bbc_265_1.png)


    **Figure 12.17:** The Cubism filter settings.'
  merge: -1
  img_proc: true
- pgno: 266
  md: '![](img/12d790664598bbf390261087fbe55bbc_266_0.png)


    **Figure 12.18:** The Cubism filter applied to our eagle.


    As you can see, an artistic filter makes it quite easy to add a very interesting
    flair to any image. There are other artistic filters, including the Van Goh filter
    and the Oilify filter. The Oilify filter changes your image so that it looks like
    an oil painting. **Figure 12.19** shows our image after the Oilify filter has
    been applied.


    ![](img/12d790664598bbf390261087fbe55bbc_266_1.png)


    **Figure 12.19:** The Oilify filter.


    Another interesting set of filters is found under the Distort menu, shown in **Figure
    12.20**. You can add some pretty dramatic effects to any image. Some of your choices
    are the Ripple, lWarp, and Emboss effects. Figure 12.21 shows our image, this
    time with the Ripple effect.


    ![](img/12d790664598bbf390261087fbe55bbc_266_2.png)


    **Figure 12.20:** The Distort menu.'
  merge: -1
  img_proc: true
- pgno: 267
  md: '![](img/12d790664598bbf390261087fbe55bbc_267_0.png)


    **Figure 12.21** : The Ripple effect.


    It should be clear that filters are a very powerful way to alter any image. You
    can create some startling effects in your pictures with the filter effects. One
    popular way to use these is to scan in a photo of some person and render it as
    an Oil Painting or some other effect. You can really jazz up old family photos
    with a scanner and GIMP. The filters we mentioned are just a few of those available
    with GIMP. Even a cursory glance at the toolbar will show you several other filters.
    Which filters should be used is purely a matter of personal taste.


    ![](img/12d790664598bbf390261087fbe55bbc_267_1.png)'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# The Toolbox


    One problem with the effects we have examined is that they apply to the entire
    image. They don''t enable you to pick and choose what you want to alter. For this
    or for the creation of new images, we need to take a look at the GIMP Toolbox,
    shown in Figure 12.22. You can see that it is not very different from the Photoshop
    toolbox shown in Figure 12.23.


    ![](img/12d790664598bbf390261087fbe55bbc_268_0.png)


    **Figure 12.22:** The GIMP Toolbox.'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# The Toolbox


    ![](img/12d790664598bbf390261087fbe55bbc_269_0.png)


    **Figure 12.23:** The Photoshop toolbox.


    The first two tools, shown in Figure 12.24, are Selection tools. They enable you
    to select a portion of your image. You can then cut that portion, copy it, fill
    it in, or in some cases apply a filter to just that portion. The first Selection
    tool selects rectangular sections, and the second tool selects elliptical sections.
    You click on the tool you want, then drag your mouse across the image to select
    a region.


    ![](img/12d790664598bbf390261087fbe55bbc_269_1.png)


    **Figure 12.24:** Selection tools.


    The third tool is also a Selection tool. However, it does freehand selection.
    You click on the tool and then draw with your mouse around the region you want
    to select. This tool is very useful for those with an artistic leaning, but perhaps
    not as useful for those of us who have some difficulty drawing.


    The next three tools are all also selection tools. These three, shown in Figure
    12.25, are quite a bit more complicated. They enable you to select contiguous
    regions, regions defined by curves, and shapes. These tools are probably not for
    the beginner.


    ![](img/12d790664598bbf390261087fbe55bbc_269_2.png)


    **Figure 12.25:** More selection tools.'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# The Toolbox


    The next three tools, shown in Figure 12.26, are very interesting. These enable
    you to move, zoom, or crop your image. The Move tool is rather simple. If you
    have pasted in an image, perhaps one cut or copied from another image, you can
    move it around until it is where you want. The second tool enables you to zoom
    in on an area of your image. If you are touching up an image, it is often a good
    idea to zoom in to do so.


    ![](img/12d790664598bbf390261087fbe55bbc_270_0.png)


    The third tool, the Crop tool, is a little more complex. After you select this
    tool and drag across a region of your image, you will see something like what
    is shown in Figure 12.27. You can now choose to crop the image so that only the
    area that is selected remains. You also can resize your image. Then the entire
    image will remain, but it will shrink to the size of the region you have selected.


    ![](img/12d790664598bbf390261087fbe55bbc_270_1.png)


    The next tool enables you to rotate your image in any fashion you wish. Our image
    is shown with the Rotation tool in Figure 12.28.'
  merge: -1
  img_proc: true
- pgno: 271
  md: '![](img/12d790664598bbf390261087fbe55bbc_271_0.png)


    **Figure 12.28:** The Rotation tool.


    The next tool, shown in *Figure 12.29* is the Flip tool. It enables you to flip
    your image.


    ![](img/12d790664598bbf390261087fbe55bbc_271_1.png)


    **Figure 12.29:** The Flip tool.


    The next tool is very useful. It is the Text tool. This tool is used to add text
    to your image. When you use this tool and click on your image, you will be presented
    with a screen much like the one shown in *Figure 12.30*. The Font tab on this
    screen enables you to select the font and font size. The Font Information tab
    gives information about the font. This may seem a bit odd, but graphics professionals
    often want rather in-depth information about the fonts they use. Remember that
    GIMP is designed to be a useful tool for the graphics professional as well as
    the casual home user. The Filter tab enables you to make the font bold, italic,
    and so on.


    ![](img/12d790664598bbf390261087fbe55bbc_271_2.png)


    **Figure 12.30:** Using the Text tool.


    Once you have chosen your settings, you enter the text you want. This brings us
    to the next tool, which is a very important tool. It is the Eyedropper tool. Anyone
    who has used Photoshop has probably used this tool. When you use the Eyedropper,
    you place it over a portion of the image and click, as shown in *Figure 12.31*.
    You will have the exact color of that portion of the image and can use that color
    with any paint tools. Basically this tool enables you to match the exact color
    of some portion of your image so that you can do touchups with a matching color.'
  merge: -1
  img_proc: true
- pgno: 272
  md: '![](img/12d790664598bbf390261087fbe55bbc_272_0.png)


    Figure 12.31: The Eyedropper tool.


    The next two tools, shown in **Figure 12.32**, enable you to use the currently
    selected color (perhaps one you got with the Eyedropper) and either splash an
    entire area with that color (using the Paint Bucket tool) or paint a background
    that color.


    ![](img/12d790664598bbf390261087fbe55bbc_272_1.png)


    Figure 12.32: The Paint Bucket and Background tools.


    While we are on the topic of color selection, it is a good time to point out that
    you can select the color for any painting tool by using the squares at the bottom-left
    side. Click on the square, and you are presented with the Color Selection screen
    shown in **Figure 12.33**, where you can select the color for that tool to paint
    with. This is exactly the same way Adobe Photoshop does color selection.


    ![](img/12d790664598bbf390261087fbe55bbc_272_2.png)'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# The Toolbox


    ![](img/12d790664598bbf390261087fbe55bbc_273_0.png)


    Selecting colors brings us to painting and drawing with those colors, and the
    next four tools, shown in *Figure 12.34*, enable us to do this. Each of these
    tools is used frehand. Drag your mouse, and you are drawing. The first is the
    Pencil tool and draws a thin line. The Paint tool will make strokes in the same
    manner as a paint brush would.


    ![](img/12d790664598bbf390261087fbe55bbc_273_1.png)


    ![](img/12d790664598bbf390261087fbe55bbc_273_2.png)


    It is important to remember that you can change the settings for the pencil, paint
    brush, or eraser. If you go to File, select Dialogs, and choose Brushes, you will
    be presented with a screen like the one shown in *Figure 12.35*, where you can
    select the type of strokes you want your tool to make.


    ![](img/12d790664598bbf390261087fbe55bbc_273_3.png)


    ![](img/12d790664598bbf390261087fbe55bbc_273_4.png)


    The third tool is the Erase tool. It erases something you have previously drawn.
    Then we come to the Airbrush tool. The Airbrush tool acts like a conventional
    airbrush, appearing to blow the paint onto the image. You can set it by going
    to File, selecting Dialogs, and choosing Tool Options, after selecting the Airbrush,
    of course. This dialog box is shown in *Figure 12.36*. As you can see, it is easy
    to change the pressure and the opacity of the airbrush. These are probably the
    two most important properties when airbrushing.'
  merge: -1
  img_proc: true
- pgno: 274
  md: '![](img/12d790664598bbf390261087fbe55bbc_274_0.png)


    **Note** The Tool Options window is one that works with any tool. You will get
    different settings for different tools.


    Next is the Clone tool. It appears as a rubber stamp in the Toolbox. This tool
    works exactly the same as the Clone tool found in Adobe Photoshop. You use it
    to copy a section of an image to another place. You clone a portion of an image.
    This is very useful for restoring old photographs.


    Next we come to the Blur tool. This tool can be used to blur or sharpen an image
    or a section of an image. The Tool Options for this tool are shown in Figure 12.37.


    ![](img/12d790664598bbf390261087fbe55bbc_274_1.png)'
  merge: -1
  img_proc: true
- pgno: 275
  md: '**Figure 12.37**: The Blur tool.


    The last four tools, shown in Figure 12.38, are pretty simple. The first draws
    in ink. It is much like the Pencil, Paintbrush, and Airbrush tools. The next tool,
    the Burn tool, is used to burn off shaded or dark areas. This can be especially
    useful in restoring scanned photographs. The Smudge tool does exactly what its
    name suggests, it smudges an area of a picture. The Measure tool is used to measure
    the distance between points on your image.


    ![](img/12d790664598bbf390261087fbe55bbc_275_0.png)


    **Figure 12.38**: The Ink, Burn, Smudge, and Measure tools.


    As you can see, GIMP offers you a full range of functional and artistic graphics
    tools. It gives you virtually every option that Photoshop does, but it is free
    of charge. One area that Photoshop does surpass GIMP in is add-ons. You can find
    a number of add-on utilities for Photoshop that enable you to do even more with
    it. Unfortunately, there are almost no such add-ons for GIMP.'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# Summary


    In this chapter, we examined the GIMP software packages. If you are an experienced
    Adobe Photoshop user, then you should master GIMP in very little time. Even if
