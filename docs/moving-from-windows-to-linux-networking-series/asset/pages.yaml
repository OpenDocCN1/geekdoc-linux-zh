- pgno: 151
  md: '# GNOME Graphics Applications


    Now we will examine a few of the graphics applications that come with GNOME. Recall
    that many of the applications for KDE are also available in GNOME, but we will
    only be looking at those that are specific to GNOME.


    # The Paint Program


    Just as with Windows and KDE, you will probably want to do some simple graphics
    manipulation with GNOME. GNOME’s paint program can be found by selecting Graphics
    from the Start menu and then More Graphics Applications. This paint program, shown
    in *Figure 7.2*, is quite similar to the paint programs in KDE and Windows. All
    three applications offer very simple graphics editing and creating capabilities.
    However, it should be noted that none of these paint programs is a professional
    graphics program. They are basic home use graphics utilities.


    ![](img/12d790664598bbf390261087fbe55bbc_151_0.png)


    Figure 7.2: The GNOME paint program.


    Even though GNOME’s paint program is very similar to KDE and Windows Paint, let’s
    take a few moments to look at some basic functionality in GNOME’s paint program.
    The applications, while similar, are not identical. When you click on the large
    block of color in the upper portion of the application’s screen, you will be presented
    with a Color dialog, much like the one shown in *Figure 7.3*. This dialog lets
    you select from among a wide range of colors and shades. You may have noticed
    by now that the dialog boxes you saw in KDE and you now see in GNOME are almost
    identical to the dialog boxes you see in Windows. This is because the dialog box
    is a common way of getting input from the user and is not unique to any operating
    system.


    ![](img/12d790664598bbf390261087fbe55bbc_151_1.png)


    Figure 7.3: The Color dialog box.


    When you click once on any of the tools in the toolbox, such as the Ellipse or
    Airbrush tool, you have selected that tool. You can then choose'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'Tools from the drop-down menu and click on **Tool Properties**. This will allow
    you to change the behavior of a specific tool. For example, if you select one
    of the Shape tools, such as the Ellipse, you have several options as to how that
    shape should be filled, if you want it filled at all. The options are shown in
    **Figure 7.4**.


    ![](img/12d790664598bbf390261087fbe55bbc_152_0.png)


    For example, you can choose to have a shape completely fill when drawn or fill
    to a certain percentage. You also can have it filled with horizontal, vertical,
    diagonal, or crossed lines. There are several other choices for how that shape
    can be filled. **Figure 7.5** shows three circles, each filled in a different
    manner.


    ![](img/12d790664598bbf390261087fbe55bbc_152_1.png)


    As you can see, the GNOME paint application is quite similar to the KDE and Windows
    paint applications. They all offer very similar functionality. The real difference
    between the three applications is not in what tools they offer, but in where the
    tools are found.


    # gThumb Image Viewer


    This is an interesting graphics program. While it only has basic graphics manipulation
    tools, it has other interesting features that we will explore. This application
    does not have the very advanced graphics tools you might expect to find in commercial
    products like Adobe Photoshop, or CorelDRAW. For example, it has none of the special
    effects such as blur or oil paint we saw with Image Magick. You can find gThumb
    by going to Graphics and selecting gThumb Image Viewer. You will see something
    like what is shown in **Figure 7.6**.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/12d790664598bbf390261087fbe55bbc_153_0.png)


    **Figure 7.6:** gThumb Image Viewer.


    While gThumb does not have advanced graphics tools, it does have a few basic tools.
    If you look under the **Image** option on the drop-down menu, you will see that
    you can rotate, flip, mirror, or resize the image. You also can change the color
    balance and saturation, as well as create a negative of the image. These few options
    are rather basic, but they provide some simple graphics manipulation functionality.
    The real interesting thing about gThumb is found under **Tools**. If you go to
    the drop-down menu and select **Tools**, you will see several items of interest.
    One option that should catch your attention right away is the option to set the
    current image as the wallpaper. If you like the image you are viewing, you can
    make it the background/wallpaper for your current desktop. The options for using
    the currently selected image as the desktop wallpaper are shown in Figure 7.7.


    ![](img/12d790664598bbf390261087fbe55bbc_153_1.png)


    **Figure 7.7:** Setting the current image as wallpaper.


    More interesting than this is the capability to include comments. If you select
    **Edit** from the drop-down menu, you should see the option to add comments, as
    shown in Figure 7.8.'
  merge: -1
  img_proc: true
- pgno: 154
  md: '![](img/12d790664598bbf390261087fbe55bbc_154_0.png)


    **Figure 7.8:** Adding comments to an image.


    You might wonder why you would add comments to a graphics file. There are several
    reasons. A professional photographer or journalist might want to add notes to
    a particular image. Since the comments are part of the image file, it is impossible
    to lose them. Even a casual home user might want to comment on certain images,
    noting the time, date, and occasion. The Comment option is probably the single
    most interesting aspect of gThumb. It is not the best package for graphics manipulation,
    but it is an excellent tool for cataloging your images.


    # ## GQView


    GQView is a simple image viewing program. You find GQView by selecting Graphics
    from the Start menu and choosing More Graphics Applications. GQView, shown in
    Figure 7.9, is primarily for previewing images. It has very limited image manipulation
    capabilities. You can rotate, mirror, or flip the image, and that is about the
    extent of its image editing functionality.


    ![](img/12d790664598bbf390261087fbe55bbc_154_1.png)


    **Figure 7.9:** GQView.'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'You might wonder, given its limited editing capabilities, why it is being mentioned
    at all. It is being mentioned because it has one very interesting feature. When
    you are viewing an image, if you look under Edit in the drop-down menu, you will
    see that you can choose to edit the image with one of several graphics programs,
    including GIMP, Electric Eye, and more. Although GQview is not ideal for editing
    images, it is great for previewing an image, and then, from inside GQview, you
    can then choose the appropriate graphics program to edit your image with.


    These are just a few of the graphics-related programs that ship with the GNOME
    desktop environment. It also ships with a very powerful graphics tool called Gimp,
    which will be discussed later in this book. Also, if you will recall, when you
    install KDE and GNOME on the same machine, you will have access to some KDE programs
    in GNOME. You should note, however, that not all KDE and GNOME applications are
    compatible. Some applications written for one interface (KDE or GNOME) will not
    run in the other.'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# GNOME Office Applications


    Office-type applications are among the most common programs for a computer user
    to work with. Word processing, spreadsheets, database management, and presentation
    software are elements of most office packages. Most Windows users are familiar
    with Microsoft Office and will need similar functionality in Linux. As was previously
    mentioned, later in this book we will give extensive coverage of Open Office,
    which is a full-featured office suite available free to Linux users. In a previous
    chapter we explored some other office applications such as KWord, KSpread, and
    GNU Cash that are available with KDE. If you installed both KDE and GNOME on your
    system, you will have access to many of these KDE applications, even under GNOME.
    Even if you did not install KDE and are strictly running GNOME, there are a few
    office applications that ship with GNOME that you can use. We will examine a few
    of these here.


    # AbiWord


    GNOME ships with a very interesting word processor named AbiWord. If for some
    reason you do not have AbiWord on your PC, you can get it for free from www.abisource.com/.
    It is worthwhile to note that AbiWord is also available for Windows and Macintosh.
    This makes it a very useful word processor. Once you are comfortable with it,
    you can use the same word processor in a variety of operating systems. What makes
    AbiWord, shown in Figure 7.10a, so interesting for Windows users trying to make
    the transition to Linux is how similar the interface is to Microsoft Word. In
    fact, the AbiWord interface is virtually identical to some of the earlier versions
    of Microsoft Word. This means that learning to use AbiWord should be rather simple
    if you are already familiar with Microsoft Word.


    ![](img/12d790664598bbf390261087fbe55bbc_156_0.png)


    Figure 7.10A: AbiWord.


    If you compare this to Microsoft Word, shown in Figure 7.10b, you will see that
    the two have very similar layouts.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '![](img/12d790664598bbf390261087fbe55bbc_157_0.png)


    The toolbar and general layout of AbiWord should look quite familiar to Microsoft
    Word users. If you take a look at some of the more commonly used drop-down menus,
    you will find that they not only have many of the same options that Microsoft
    Word has, but in many cases they are found in the same place. For example, if
    you choose Format from the drop-down menu in Microsoft Word, as you see in Figure
    7.10c, the first three options are Font, Paragraph, and Bullets. If you look under
    Format in AbiWord, you will see that its first three options are also Font, Paragraph,
    and Bullets.


    ![](img/12d790664598bbf390261087fbe55bbc_157_1.png)


    This remains the case for many of the drop-down menus. In both Microsoft Word
    and AbiWord you will find that under Insert you have Page Number, Break, and Picture.
    With both software packages you will find the spell checker under Tools. Essentially,
    AbiWord''s strength is that it is so similar to Microsoft Word that any competent
    Word user should have no problem changing to AbiWord.


    One of the most important features of AbiWord is its import capabilities. It can
    import documents that are in a Microsoft Word, Rich Text, HTML, or plain text
    format. This means that you can read documents that were written with other word
    processors. This is an invaluable feature because it is unlikely that all of your
    friends and colleagues are going to drop their current favorite word processors
    in favor of AbiWord.


    # GNumeric Worksheet


    In addition to word processing, many people frequently find that they need to
    do some type of numeric calculation. Number crunching is a'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'fact of life for everyone, not just bookkeepers and accountants. With GNOME,
    you have access to GNumeric Worksheet, a versatle and user-friendly spreadsheet
    program. This program is found by selecting Office from the Start menu and looking
    under More Office Applications. If for any reason your machine does not have GNumeric
    Worksheet, you can download it for free from www.GNOME.org/projects/gnumeric/.
    You can see GNumeric Worksheet in Figure 7.11. As you can see, it has a fairly
    standard interface, not much different from Microsoft Excel or KSpread.


    ![](img/12d790664598bbf390261087fbe55bbc_158_0.png)


    Figure 7.11: GNumeric Worksheet.


    We will look at a few of its key features, enough that you should be able to effectively
    use GNumeric Worksheet. The basic data entry is the same for all spreadsheets;
    simply type data directly into a given cell. If you want to put in new rows, columns,
    cells, or even graphs, you can do that from the Insert drop-down menu. The Format
    drop-down menu is fairly standard. It allows you to change font, alignment, and
    related properties of columns, rows, or individual cells.


    The most interesting thing about GNumeric Worksheet is under the Tools menu. Here
    you will find a rich assortment of very valuable tools. The first thing to direct
    your attention to is the Statistical Analysis option. Under this you have several
    categories that allow you to do a variety of statistical workups on your data,
    including an ANOVA (for readers not well versed in statistics, you will probably
    not find these statistical function options of particular interest). There also
    are options to generate standard descriptive statistics (mean, median, mode, standard
    deviation, and so on) and to do regression analysis. Math and physics aficionados
    will be thrilled to see that GNumeric Worksheet will even do a Fourier analysis.


    What may be of even more interest to you is that GNumeric Worksheet can import
    files from Microsoft Excel, Lotus 1-2-3, and Quattro Pro. This ability to import
    files from other spreadsheet applications is a very important feature. Just because
    you have elected to move to Linux does not mean that all of your business colleagues
    have. For that reason, you will need to be able to read files they produce.'
  merge: -1
  img_proc: true
- pgno: 159
  md: '# ## System Tools


    Any operating system, or desktop interface, must have some tools for administering
    the system. An entire chapter of this book was devoted to administering a Linux
    machine via the KDE interface. You will find that many of the same system tools
    are available in GNOME, and in the same place. However, there are a few tools
    either that come only with GNOME and do not come with KDE or that work with both
    GNOME and KDE, but that we did not examine in our exploration of KDE-based systems
    administration. Let’s take a look at a few of these now.


    # ### GKrell System Monitor


    In the preceding chapter we looked at one of KDE’s system monitors. If you will
    recall, we found a great deal of information with this tool, including the current
    central processor use, memory use, and more. We also explored how this information
    could be very useful in diagnosing system problems and determining what if any
    hardware your system might need upgraded.


    GNOME has its own system monitor, called GKrell system monitor. GKrell, shown
    in Figure 7.12, has its own unique features. To launch GKrell, you go to the Start
    menu, select System Tools, and choose GKrell System Monitor. Once you have launched
    it, you can see that it displays current CPU use, memory use, and date and time.


    ![](img/12d790664598bbf390261087fbe55bbc_159_0.png)


    Figure 7.12: GKrell system monitor.


    The first thing you probably notice about GKrell that differentiates it from either
    the KDE System Monitor or the Windows System Information screen is that it is
    a floating bar. This means that you can position it anywhere on the screen. You
    can even leave it open when you are working with other applications. This can
    be a wonderful asset when trying to diagnose what application is consuming the
    most resources. GKrell is meant to be a running system monitor. That means that
    it is meant to be left open and running during normal operations. That is why
    this tool is very popular with system administrators. They can keep an ongoing
    view of their system’s performance, thus helping to diagnose problem areas.


    If you right-click on GKrell, you can then select the Configure option. This brings
    you to the Configuration screen, shown in Figure 7.13. This screen allows you
    to configure many aspects of GKrell’s appearance and performance. You can use
    the options on tab one to determine whether or not to display the hostname, system
    name, and more. The second tab allows you decide whether GKrell should be included
    on top of all other windows or not.'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/12d790664598bbf390261087fbe55bbc_160_0.png)


    **Figure 7.13**: The GKrell Configuration screen.


    As you can see, GKrell provides the same information as the KDE System Monitor
    did. Its real advantages is that it is very easy to keep up and running on one
    portion of the screen, allowing you to keep a vigilant watch on system resources.
    This is often quite popular with system administrators.


    # # Miscellaneous


    There are several interesting utilities that are simple but interesting. A few
    of these will be examined here. You should be aware that under any of the major
    groups, such as System Tools or Accessories, there is a plethora of small but
    useful utilities. It would take a book several thousand pages in length to cover
    all of them. In this book we will try to touch on the more commonly used utilities,
    but you should not feel at all shy about exploring and experimenting. Most of
    these utilities are fairly self explanatory. You are very unlikely to do any harm
    to your system if you simply read whatever dialog boxes or instructions a utility
    presents you with.


    # # Desktop Switching Tool


    You already know by now that you can use either GNOME or KDE and that you can
    have both installed on the same system at the same time. You also know that you
    can log out of the system and, when you log back in, use the Session settings
    to change what desktop environment to use. What you don''t know but are about
    to find out is that there is a quicker way to switch desktops. Under System Tools,
    you will see something called the Desktop Switcher, shown in Figure 7.14. When
    you click on this option, you can select any desktop environment installed on
    your machine and switch to it immediately. This is very convenient for users who
    like more than one desktop environment.


    ![](img/12d790664598bbf390261087fbe55bbc_160_1.png)


    **Figure 7.14**: The Desktop Switcher.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '![](img/12d790664598bbf390261087fbe55bbc_161_0.png)


    **7.15:** The Floppy formatter.


    Consider that Linux gives you multiple desktop environments that you can easily
    switch back and forth between, as well as multiple desktops within a single environment.
    This should begin to impress upon you a theme that will be repeated throughout
    this book. The open source software philosophy is all about choice. You, the computer
    user, should have a plethora of choices for anything you want to do. Once you
    have made a choice, the open source licensing model allows you to do just about
    anything you want with the application you have chosen.


    # ## Floppy Formatter


    Formatting floppy disks is still a task that needs to be done from time to time.
    Most floppy disks come preformatted, but there are many reasons why you may want
    to reformat a disk. You might want to reformat it to change the filesystem it
    uses, or simply to scan it to check for errors. If you look under System Tools,
    you will find the Floppy formatter, shown in Figure 7.15.


    You should notice two separate areas of this screen. One area lets you determine
    what filesystem you want to use. The choices are FAT and ext2. ext2 is strictly
    used with Linux systems. If you format the disk as ext2, then no other operating
    system will be able to read the disk. If you plan to share the contents of the
    disk with anyone using Windows, then you should format the disk with FAT.


    It is also important to notice that you have three different formatting options.
    You can select to do a Quick format, which is really just a matter of completely
    erasing the disk. You also may select the Standard format. Finally, you have the
    Thorough format. This final option checks for any bad sectors on your disk. If
    you are concerned about disk errors, use the Thorough format option.


    # ## Desktop Sharing


    The Desktop Sharing feature, found under Preferences, is truly an amazing utility.
    Have you ever wanted to show someone, a person not in the room with you, exactly
    what is on your computer screen? You might be calling a friend and asking him
    a technical question and want him to see exactly what is going on, or even have
    him fix the problem for you. You can do this with the Desktop Sharing tool. When
    you launch the Desktop Sharing tool, shown in Figure 7.16, you can e-mail an invitation
    to the person you want to log on to your system, or you can simply call him and
    give the settings the utility tells you to. The items the person will be given
    are your machine''s IP address, a password, and the expiration date and time.'
  merge: -1
  img_proc: true
- pgno: 162
  md: '![](img/12d790664598bbf390261087fbe55bbc_162_0.png)


    If you are connected to the Internet and the person you want to log on is connected
    and using Linux, he can log on to your system and take control of your desktop.
    The reason for the password is to ensure that only someone you authorize can log
    on to your system. The expiration date is to ensure that this person does not
    have indefinite carte blanche to hijack your system at his whim. While this tool
    can be dangerous because it gives another person control of your computer and
    should be used with care, it can be an incredible tool. If you are working remotely
    with someone, the ability for one of you to take control of the other''s desktop
    and collaborate directly is invaluable.'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# ## Summary


    In this chapter we have examined the basics of the GNOME user interface. We have
    explored its similarities with KDE. We also have looked at a variety of applications
    available for GNOME. This is critical because the interface is not of much use
    without powerful applications to run in it. At this point you should be comfortable
    with the GNOME interface. However, keep in mind that throughout most of this book
    we will be focusing on KDE.


    This chapter also introduced you to several system tools that either ship only
    with GNOME and not with KDE or ship with both but were not previously explored.
    We examined a new system monitor and several small but very useful utilities,
    and finally we looked at desktop sharing in GNOME.'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# **Review Questions**


    +   1. Which Linux word processor has an interface most like Microsoft Word?


    +   2. What file types can GNumeric Worksheet import?


    +   3. Which graphics program is ideal for cataloging images?


    +   4. What does GNOME stand for?


    +   5. When was GNOME 1.0 released?


    +   6. Can GNOME run on non-Linux machines?


    +   7. GNOME''s equivalent of Microsoft Paint is called what?


    # **Answers**


    +   1. AbiWord


    +   2. Microsoft Excel, Quatro Pro, and Lotus 1-2-3


    +   3. gThumb


    +   4. GNU Network Object Model Environment


    +   5. March 1999


    +   6. Yes, GNOME can run on any Unix-like system that uses GTK.


    +   7. GPaint'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Section III: Moving from Microsoft Office to Open Office


    # Chapter List


    +   *   Chapter 8: Moving from Microsoft Word to Open Office

    +   *   Chapter 9: Spreadsheets with Open Office Calc

    +   *   Chapter 10: Moving from Microsoft PowerPoint to Open Office Impress

    +   *   Chapter 11: Other Open Office Applications


    For many readers, this will be the part of the book you have been waiting for.
    Many PC users are not too concerned with their system or how it works. What they
    really want to do is perform productive work. At some point, most people find
    basic office utilities such as word processors and spreadsheets to be quite useful.
    For many people that is the primary reason for purchasing a computer. The next
    several chapters of this book are devoted to showing you just how to do this.


    Open Office® is an office suite that is distributed under an open source license.
    That means it is available as a free download. You can even get a Windows version
    of it. It comes with Red Hat and many other distributions of Linux. But you can
    also download a free version, as well as find out more about Open Office at www.openoffice.org.


    We will start by examining word processing with Open Office in Chapter 8. Chapter
    9 will show you how to work with spreadsheets using Open Office. Chapter 10 will
    introduce you to using Open Office for presentations you formerly did in Microsoft
    PowerPoint®. Finally, Chapter 11 will show you some of the extra utilities that
    are part of the Open Office suite.'
  merge: -1
  img_proc: true
- pgno: 166
  md: '# Chapter 8: Moving from Microsoft Word to Open Office


    # Introduction


    Word processing, as we mentioned earlier, is a very common task, perhaps the most
    common task performed on a PC. At some point, virtually every computer user will
    need to do some type of word processing. For a home user this might mean writing
    a letter or composing a school report. For the business PC user this can mean
    creating business reports, keeping records, or generating memos. When you need
    to generate some type of text, of course you can use the limited capabilities
    of a standard text editor such as Microsoft’s Notepad or WordPad, or perhaps the
    KWrite and Kate that come with KDE. We spent some time earlier in this book examining
    these text editors, and you should be basically competent with them by this point
    in the book. However, most people eventually find these applications to be inadequate
    and want something more. For most Windows users, that usually means using Microsoft
    Word. There are other word processors for Windows, such as Corel’s WordPerfect,
    but most Windows users are familiar with Microsoft Word. You can see the familiar
    Microsoft Word interface in Figure 8.1.


    ![](img/12d790664598bbf390261087fbe55bbc_166_0.png)


    Figure 8.1: Microsoft Word.


    The chances are, even if you are only a novice Windows user, that you are probably
    familiar with the basics of Word. Even beginners usually have at least a cursory
    understanding of the essential toolbar functions found in Word. Right on the toolbar
    you can see buttons for saving, printing, changing the font, and aligning your
    text. In fact, you would have quite a time finding any word processor that did
    not have a toolbar that was very similar to this one. If you have used Microsoft
    Word at all, you are probably aware of the plethora of other functions available
    to you from the various drop-down menus. This chapter is aimed at making you just
    as familiar and comfortable with Open Office’s Writer program. It is a full-fledged
    and functional word processor.


    As you progress through the material in this chapter, you will find that Writer
    has most of the features you are used to in Word. What makes the transition even
    easier is that many of these functions are found in the similar locations, with
    similar looking buttons to access them. This should come as no surprise. Both
    Open Office Writer and Microsoft Word are trying to accomplish the same goal,
    that of word processing, so it is no wonder that their functionality is quite
    similar. You will, however, find some instances where one word processor possesses
    some advantage over the other. Of course the primary advantage for Open Office
    will be price. It is a free download from www.openoffice.org. Perhaps more importantly,
    there are versions for both Linux and Microsoft Windows. That means that if you
    become enamored with Open Office on your Linux machine, you can also use the exact
    same product with a Windows machine!'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# Open Office Address Book


    Open Office, much like Microsoft Office, is not a single application. Rather,
    it is an integrated suite of applications. Each of these applications can be used
    separately, but there are functions that work with all of the applications. There
    are some utilities that are cross functional and work with all of the Open Office
    applications. The same is true with Microsoft Office, which has made a concerted
    effort over the years to tightly integrate all of the Microsoft Office applications
    into one cohesive unit.


    When you first launch Open Office Writer or any of the Open Office applications
    for the first time, you will see one of the shared utilities in action. The very
    first thing that happens when you launch Open Office for the first time is that
    the Open Office Address Book Wizard appears. This wizard will set up a common
    address book that can be used in Open Office Writer as well as the various other
    Open Office applications. The first step of the wizard will ask you what type
    of existing address book you would like to use. This is shown in Figure 8.2.


    ![](img/12d790664598bbf390261087fbe55bbc_167_0.png)


    The next phase of the wizard process is to select what address list from that
    address book you would prefer to use. You can see this step in Figure 8.3.


    ![](img/12d790664598bbf390261087fbe55bbc_167_1.png)'
  merge: -1
  img_proc: true
- pgno: 168
  md: '**Note** Many e-mail applications allow you to have multiple, separate address
    lists inside your address book. This is why you need to select a specific list
    from within an address book.


    The last step is simply to give your address book a name. That name can be used
    in the future to access this address book. You can see this phase in Figure 8.4.


    ![](img/12d790664598bbf390261087fbe55bbc_168_0.png)


    **Figure 8.4:** Choosing a name for your address book.


    That''s all there is to setting up your address book. We will return to the address
    book a bit later and examine how to use it. You will find that it can be a useful
    product with many different Open Office applications.'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# # Essentials of Open Office Writer


    After you have finished setting up your address book, you will see a blank document
    waiting for you to start writing. This is also what you will see when you open
    Writer on subsequent occasions. The Address Book Setup Wizard runs only the very
    first time you launch an Open Office application. You can see the basic screen
    in Figure 8.5a.


    ![](img/12d790664598bbf390261087fbe55bbc_169_0.png)


    **Figure 8.5A:** The Open Office Writer screen.


    This screen is not very different from the Microsoft Word screen shown in Figure
    8.1. Both word processors’ basic functions are in similar locations. What this
    means for you is that mastering the basics of Open Office Writer, if you already
    know your way around Microsoft Word, is not going to be particularly difficult.


    # ## The Top Toolbar


    Let’s take a moment to examine the toolbar at the top of the screen. You will
    note that it is divided into two toolbars. This is one very obvious difference
    between Open Office and Microsoft Word. That difference is that Microsoft Word
    condenses all the same buttons into a single toolbar.


    **Note When locations of toolbars and buttons are discussed, the default locations
    and buttons are what is being discussed. In many applications, including Microsoft
    Word, it is possible to drag a toolbar to a new location or customize the buttons
    displayed.


    The top toolbar has an open folder icon that is used to open existing documents.
    You might notice that this is the same icon used in Microsoft Word for the same
    task. You will also notice a printer icon, obviously used to print, and a small
    envelope icon. In both Microsoft Word and Open Office, the envelope icon is used
    to attach the current document to an e-mail so you can send it. It will automatically
    launch your default e-mail client, so you can send your document to a friend or
    colleague. And, of course, in both applications the printer icon is used to print.


    The second toolbar, the one on the lower half, contains the essential word processing
    functions. The first drop-down box allows you to select a style, such as text
    body or header. The second drop-down box allows you to choose your font. Then
    you can select a font size from the third drop-down box. The next three buttons,
    shown in Figure 8.5b, allow you to make whatever text is currently selected bold,
    italic, or underlined. These three basic text formatting buttons are found in
    the exact same order in both Open Office Writer and Microsoft Word.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# **Figure 8.5B**: The basic three text formatting buttons.


    Of course you can combine the functions of the three formatting buttons in order
    to make your text any combination, such as *bold* and underlined or *bold, italicized,*
    and underlined. The next three buttons, shown in Figure 8.5c, allow you to align
    text. You can make your text either left aligned, centered, or right aligned.
    Then we come to two buttons that allow you to create bulleted or numbered lists.
    Lists are very common in many documents and are therefore present in all word
    processors. Already you might notice something quite familiar about all of these
    buttons. These are the same buttons, in the same order, as you find in Microsoft
    Word. That means that maneuvering among basic word processing functions is not
    going to be difficult.


    ![](img/12d790664598bbf390261087fbe55bbc_170_0.png)


    # **Figure 8.5C**: Aligning text.


    Just as the previous buttons were virtually identical to the buttons found on
    the Microsoft Word toolbar, so are the following buttons. You next come to two
    buttons that allow you to increase or decrease the indentation of a particular
    piece of text. Then you have a button that allows you to select font color. If
    you click on this button and hold it down for just a moment, you should see something
    much like what is shown in Figure 8.6a.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '![](img/12d790664598bbf390261087fbe55bbc_171_0.png)


    **Figure 8.6A:** The color palette.


    Unfortunately, this is one area in which Microsoft Word still has a slight edge
    over Open Office Writer. The number of colors you can choose from in Open Office
    is not as extensive as that found in Microsoft Word. When you select colors in
    Microsoft Word, you see a palette similar to the one shown in *Figure 8.6A*, but
    you can also select More Colors and see an additional palette, shown in Figure
    8.6B.


    ![](img/12d790664598bbf390261087fbe55bbc_171_1.png)


    **Figure 8.6B:** Additional colors in Microsoft Word.


    This is a small but significant difference between Microsoft Word and Open Office.
    There are other differences, which we shall explore as we encounter them. Next
    you come to a button that allows you to highlight text. This marks the end of
    the upper toolbar. As you can see, all the essential word processing functions
    you find in Microsoft Word are here. Many of these functions are found in the
    same or similar locations and with nearly identical functionality.'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Obviously this is just a quick overview of the toolbars at the top of Open
    Office Writer. You may be wondering why the cursory treatment of the upper toolbars.
    The reason is that since many of them offer functionality that is almost identical
    to Windows, you should have no trouble using these buttons. Also, the functionality
    of most of these buttons is self explanatory. It should be obvious that the bold
    button makes text bold. A long explanation is not only unnecessary but would probably
    be considered a bit pedantic. But don''t worry, we will walk through an example
    later in this chapter that uses many of these basic functions, along with some
    more advanced functionality of Open Office Writer.


    # ## The Side Toolbar


    In addition to the functions you will find along the top two toolbars, you should
    also notice a side toolbar that also offers functionality you will find quite
    useful. This toolbar, unlike the previous ones, is not found in Microsoft Word.
    However, Word does offer similar functionality; you just don''t have a convenient
    toolbar along the side to help you find that functionality.


    This toolbar is located along the left side and is seen in **Figure 8.6c**. We
    will examine this toolbar in the following paragraphs. Since at least some of
    these buttons offer functionality that is not exactly mirrored in Microsoft Word,
    a more extensive explanation will be afforded this toolbar than was given to the
    upper toolbars.


    ![](img/12d790664598bbf390261087fbe55bbc_172_0.png)


    The uppermost button, if you hover your mouse over it, simply shows Insert. If
    you press and hold down the button just a moment, you will be presented with a
    series of choices, shown in **Figure 8.7a**. These choices include the option
    to insert tables, graphics, documents, footnotes, and header notes. Let''s examine
    a few of the more common of these.'
  merge: -1
  img_proc: true
- pgno: 173
  md: '![](img/12d790664598bbf390261087fbe55bbc_173_0.png)


    Figure 8.7A: The Insert button.


    Tables are a very common tool used in documents to organize data in an easily
    read format. You have probably noticed a few tables in this book. Most word processors
    allow you to insert tables. With Microsoft Word, you insert a table by choosing
    the Table option from the drop-down menu and then selecting Insert and choosing
    Table. With Open Office Write, once you choose to insert a table you must set
    up the columns, rows, and other properties. You will be presented with a screen,
    shown in Figure 8.7b, where you can set up these properties.


    ![](img/12d790664598bbf390261087fbe55bbc_173_1.png)


    Figure 8.7B: Setting a table''s properties.


    Once you are satisified with the settings you have chosen, you can press OK. If
    you have changed you mind about placing a table into your document, then just
    press Cancel. A table with properties like you saw in Figure 8.7b will appear,
    much like what you see in Figure 8.7c.'
  merge: -1
  img_proc: true
- pgno: 174
  md: '![](img/12d790664598bbf390261087fbe55bbc_174_0.png)


    **Figure 8.7C:** A table in a document.


    If you place your cursor in one of the cells of your table and press the *Insert*
    button again, you will be presented with the Table Format screen. This screen
    allows you to reset previous table settings, as well as to format your table.
    This screen is shown in Figure 8.7d. This screen has several tabs. Each tab allows
    you to set something different about your table. In this picture the *Background*
    tab is shown. This tab allows you to change the background color. Note that in
    addition to selecting a color from the palette, you can also select whether that
    color is applied to a single cell, a row, or the entire table.


    ![](img/12d790664598bbf390261087fbe55bbc_174_1.png)


    **Figure 8.7D:** Formatting the table.


    This is not that much different from inserting a table in Microsoft Word; it’s
    really just where you find the functions that is different. Recall that in Microsoft
    Word you go to the Table drop-down menu and then choose *Insert* and *Table*.
    You would then be presented with the screen shown in Figure 8.7e. Here you would
    set the rows and columns of your table.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '![](img/12d790664598bbf390261087fbe55bbc_175_0.png)


    **Figure 8.7E**: Inserting a table in Microsoft Word.


    You could then place your cursor anywhere on the table and select Table from the
    drop-down menu and choose Table Properties. This would allow you to change many
    of your table''s settings. You could also select Auto Format Table, also found
    under Table on the drop-down menu, to set up your table in a variety of predefined
    formatting schemes. You can see that option in Figure 8.7f.


    ![](img/12d790664598bbf390261087fbe55bbc_175_1.png)


    **Figure 8.7F**: Formatting a table in Microsoft Word.


    You can see that inserting a table is not much different in Open Office than with
    Microsoft Office. There are a few subtle differences, such as where you find the
    functions to insert and manipulate tables. It is also a fact that Microsoft Word
    offers a few table formatting options that are not available with Open Office,
    particularly the options shown in the preceding paragraph regarding the Autoformat
    option.


    The next option under the Insert button is Insert Graphics. To insert graphics
    in Microsoft Word, you select Insert from the drop-down menu and choose Picture.
    You then select Word Art, Graphics from File, or Clip Art. When using Open Office
    Writer, you can still go to the drop-down menu, select Insert, and choose Graphics,
    or you can use the Insert button on the side toolbar and select Graphics. When
    you choose this option, you will be presented with a dialog box much like the
    one shown in Figure 8.8. This dialog will allow you to peruse your hard drive
    and find any image you might want to insert into your document.'
  merge: -1
  img_proc: true
- pgno: 176
  md: '![](img/12d790664598bbf390261087fbe55bbc_176_0.png)


    **Figure 8.8:** Inserting graphics.


    You might notice that, by default, this dialog box starts in the gallery subdirectory
    of Open Office. This gallery is similar to the clip art option in Microsoft Word.
    Open Office Writer simply combines the clip art and graphics from file options,
    that are separate in Word. Although current versions of Open Office do not ship
    with as many graphics images as Microsoft Office does, they are not without a
    few images to display to the user.


    Another option you will find under the Insert button is to insert a special character.
    From time to time you may require some character not present on your keyboard.
    Mathematical symbols such as the summation symbol ∑ and various other symbols
    can be found by clicking the Insert button and choosing Special Characters. When
    you select this you will see something much like what is shown in Figure 8.9.
    The same task can be accomplished in Microsoft Word by choosing Insert from the
    drop-down menu, and selecting Symbol.


    ![](img/12d790664598bbf390261087fbe55bbc_176_1.png)


    **Figure 8.9:** Inserting special characters.


    The next item we find as we move down the toolbar on the left side of the screen
    is the button to insert fields. Fields include date fields, time fields, author''s
    name, and more. When you click this button, you will see something very much like
    what is shown in Figure 8.10a.'
  merge: -1
  img_proc: true
- pgno: 177
  md: '![](img/12d790664598bbf390261087fbe55bbc_177_0.png)


    Figure 8.10A: Inserting fields.


    This is a relatively straightforward option. You simply select the field that
    you want to insert, and it will be inserted at the point where you last had your
    cursor. This can be quite convenient for inserting dates, times, and more. Microsoft
    Word has a similar function, found by selecting Insert from the drop-down menu
    and then going to Field. You are then presented with an image much like the one
    shown in Figure 8.10B. As you can see, Microsoft Word has more field options that
    the current version of Open Office Writer.


    ![](img/12d790664598bbf390261087fbe55bbc_177_1.png)


    Figure 8.10B: Inserting fields in Microsoft Word.


    As we traverse the left toolbar going down, we next encounter the Insert Object
    button, seen in Figure 8.11. This option allows you to insert charts, plug-ins,
    and even Java applets.'
  merge: -1
  img_proc: true
- pgno: 178
  md: '![](img/12d790664598bbf390261087fbe55bbc_178_0.png)


    Figure 8.11: Inserting objects.


    Let''s take a moment to examine the first of these options, inserting a chart.
    This can also be accomplished in Microsoft Word by selecting Insert from the drop-down
    menu, then choosing Object, and selecting the appropriate chart. With Writer,
    once you have selected Insert Object and Chart, you will see the screen in Figure
    8.12.


    ![](img/12d790664598bbf390261087fbe55bbc_178_1.png)


    Figure 8.12: Inserting a chart.


    If you press the Create button at this point, a basic chart will be inserted into
    your document. This is shown in Figure 8.13.'
  merge: -1
  img_proc: true
- pgno: 179
  md: '![](img/12d790664598bbf390261087fbe55bbc_179_0.png)


    **Figure 8.13**: Configuring a chart.


    If you then right-click on this chart, you will be presented with the option to
    change the chart type, data, and other factors about the chart. This is shown
    in Figure 8.14. Working with charts is very important for the business user of
    Open Office. For any presentation or report, you will probably be expected to
    show various charts and graphs that illustrate your data more clearly. It is highly
    recommended that you spend some time experimenting with charts in any word processor
    you choose. Make certain that you are completely comfortable with how to create
    a chart since it is such a valuable tool for adding impact to your presentation.
    In a later chapter you will also see that we can add charts to spreadsheets, and
    the technique is very similar. Therefore, if you learn how it works now, you will
    be ahead when we discuss that aspect of spreadsheets.


    ![](img/12d790664598bbf390261087fbe55bbc_179_1.png)


    **Figure 8.14**: Changing your chart.


    In addition to charts, you can draw basic lines and shapes. In Microsoft Word
    you can do this by selecting Insert from the drop-down menu and then choosing
    Picture, and finally selecting AutoShapes. With Writer, the next button down on
    the left side toolbar will accomplish this goal for you. Simply press this button
    and you are presented with several different choices for shapes and lines you
    can insert into your document. The choices are shown in Figure 8.15.'
  merge: -1
  img_proc: true
- pgno: 180
  md: '![](img/12d790664598bbf390261087fbe55bbc_180_0.png)


    **Figure 8.15:** Inserting lines and shapes.


    The next two buttons are a bit more complex and go beyond the scope of this chapter.
    They allow you to insert form-like items as you might see on a graphical program.
    Their use could occupy several chapters by itself. Remember that we are trying
    to ensure that you are a competent Open Office user who is comfortable with the
    essentials of the various Open Office products. We are not endeavoring to make
    you an expert on all of these issues. If you look in Appendix A, “Other Resources,”
    you will find a variety of resources to take you into a deeper study of many of
    the topics in this book. Some of these resources are Web pages, and others are
    books. We will move down a bit to the button with the checkmark and the letters
    abc above it, shown in Figure 8.16.


    ![](img/12d790664598bbf390261087fbe55bbc_180_1.png)


    **Figure 8.16:** The spell check.


    Clicking this button will initiate a spelling check on your document. You perform
    the same function in Microsoft Word by selecting Tools and then choosing Spelling
    and Grammar, or by pressing the F7 shortcut key. Just below the spell check button,
    you see another similar button. This button toggles automatic spell checking on
    and off in your document. This will cause the small red squiggly lines to appear
    under misspelled words as you type. Finally, we come to the binoculars. This enables
    you to search your document for a word or phrase. When you click this button,
    you are presented with something like what is shown in Figure 8.17.'
  merge: -1
  img_proc: true
- pgno: 181
  md: '![](img/12d790664598bbf390261087fbe55bbc_181_0.png)


    **Figure 8.17**: Searching the document.


    You perform a search in Microsoft Word by selecting **Edit** and **Find** from
    the drop-down menu or using the shortcut keys **Ctrl-F**.'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Creating a Document


    We have looked at various features and utilities within Open Office Writer (although
    certainly not all of its features). The best way to get you comfortable with Writer
    is to walk you through the process of creating a complex document that includes
    all of the various techniques we have seen so far, and perhaps a few more. We
    will use a fictitious company Lenny’s Linux Widgets and create a report for that
    company.


    Begin by opening up Writer and typing in the following paragraph:


    ```

    ```

    Lenny’s Linux Widgets

    Quarterly Report for the first quarter of 2004.

    Summary - This quarter we have met or exceeded all goals for both

    production and sales of Widgets for Linux. Our widgets work with

    either KDE, GNOME, or Ximian and are selling quite well.

    ```

    ```


    Now we are going to highlight the first two lines and center them. You highlight
    text by dragging your mouse across it. You can then use the toolbar to make this
    text bold, font size 14, and centered. Your document should then look like what
    is seen in Figure 8.18.


    ![](img/12d790664598bbf390261087fbe55bbc_182_0.png)


    Now skip down a few lines by pressing the Enter/Return key. You are going to insert
    an image from your hard drive. We previously discussed how to insert graphics
    using the toolbar on the side of the screen. You can also select Insert from the
    drop-down menu, then choose Graphics, and finally From File. Although some business-
    or Linux-oriented image would be best, you can select any image you want from
    your hard drive. For the example image you will see in just a bit, the image selected
    was a picture of the author.


    Now we are going to add a graph. Again use the Enter key to skip down a few lines,
    and then you can add your graph. This was also discussed previously in the context
    of the toolbar at the right. Recall that you choose Insert Object and then choose
    the Chart option. Then, once you have a chart in your document, right-click on
    it and choose Chart Data. You can then alter the data and titles placed on your
    chart. This is shown in Figure 8.19. For our purposes, the columns should be months,
    and the rows should be any random business category you might think of. When you
    are done, press the checkmark button and then close the window.'
  merge: -1
  img_proc: true
- pgno: 183
  md: '![](img/12d790664598bbf390261087fbe55bbc_183_0.png)


    **Figure 8.19:** Creating a new chart.


    Now for a few finishing touches. First we will go to the drop-down menu and select
    **Insert**. Then we will insert page numbers. Choose Insert and select Horizontal
    Line. You should see an image like the one in **Figure 8.20**.


    ![](img/12d790664598bbf390261087fbe55bbc_183_1.png)


    **Figure 8.20:** Inserting a horizontal line.


    You can see that there are several types of lines you can select.  You should
    select any line you find aesthetically pleasing.  Now go to Format and choose
    Page.  You will see an image like the one shown in **Figure 8.21**.  From this
    screen you can format many things about the document’s appearance.'
  merge: -1
  img_proc: true
- pgno: 184
  md: '![](img/12d790664598bbf390261087fbe55bbc_184_0.png)


    **Figure 8.21:** Formatting the document.


    We are going to set only a few of the page properties. From the Background tab,
    we will set the background color of the document to a light yellow color. From
    the Border tab, we will set the border to 1.00 pt and shadowed. Now your document
    should look like what you see in [Figure 8.22](#).'
  merge: -1
  img_proc: true
- pgno: 185
  md: '![](img/12d790664598bbf390261087fbe55bbc_185_0.png)


    Figure 8.22: Your final document.


    As you can see, it is quite easy to set up a very interesting and dynamic document,
    with a lot of extra features, using Writer. It''s not really any more difficult
    than using Microsoft Word. Fortunately, for anyone trying to migrate from Windows
    to Linux, the layout of many of the Open Office applications is similar to Microsoft
    Office applications.


    ![](img/12d790664598bbf390261087fbe55bbc_185_1.png)'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Extra Features


    What we have covered in this chapter, up to this point, is more than enough to
    enable you to create a variety of different documents for personal or business
    use. We have looked at all the basic text formatting, inserting images and charts,
    and more. However, much like Microsoft Word, Open Office Writer has a number of
    extra features. These extra features are not critical to creating documents but
    can be very helpful in enhancing your documents. We won''t be covering all of
    the extra features available in Open Office Writer, but we will touch on a few
    and hopefully add something to your documents in the process.


    Let''s take a look at a simple, but very useful extra feature first—the Thesaurus.
    In Microsoft Word, you can right-click on a word and select Synonyms from the
    pop-up menu. In Open Office Writer you have the same functionality under the label
    of Thesaurus. If you highlight a word and then go to Tools in the drop-down menu
    and select Thesaurus, you will see the screen in Figure 8.23.


    ![](img/12d790664598bbf390261087fbe55bbc_186_0.png)


    **Figure 8.23:** The Thesaurus.


    You can use this screen to scroll through words that are synonyms for the word
    you have highlighted. Anyone who has done any writing at all is aware that it
    is too easy to fall into the trap of using the exact same word repeatedly. A thesaurus
    can be invaluable in helping you vary the words you use in any document.


    In this electronic age, documents are frequently sent in electronic format rather
    than in printed format. For that reason it sometimes can be quite useful to have
    a link to a file, Web site, or another document embedded directly into your document.
    This is called a hyperlink. In Microsoft Word you would choose Insert from the
    drop-down menu and then select Hyperlink. The process is exactly the same with
    Open Office Writer. When you choose Insert and then select Hyperlink in Writer,
    you will see a screen like the one in Figure 8.24.


    ![](img/12d790664598bbf390261087fbe55bbc_186_1.png)


    **Figure 8.24:** Inserting a hyperlink.


    You then have a number of options for your link. If it is an Internet link, you
    must decide whether you want to link to a Web site, FTP site, or e-mail. You also
    can link to another document. For our purposes we will make a link to a Web site
    (the author''s Web site). In the screen, select Internet, then type in http://www.chuckeasttom.com.
    You will note that this text appears below in the space marked Text. The text
    is'
  merge: -1
  img_proc: true
- pgno: 187
  md: 'what the readers of your document will see. We would like them to see something
    a bit more aesthetically pleasing than a Web address, so replace that text with
    **Chucks Web Page**. Then press the Apply button and the Close button. In your
    document you will now see a link with the text we gave it. This is shown in *Figure
    8.25* as it would appear in a document.


    ![](img/12d790664598bbf390261087fbe55bbc_187_0.png)


    **Figure 8.25:** A hyperlink in your document.'
