- pgno: 188
  md: '# ## Formatting and Configuring


    As with most professional applications, you can customize and configure Open Office
    Writer so that it suits your needs. In Microsoft Word you went to Tools on the
    drop-down menu and could select either Customize or Options. Each gave you access
    to slightly different aspects of the word processor you could alter. The good
    news is that the procedure is almost identical in Open Office Writer. If you select
    Tools from the drop-down menu, you will see both Configure and Options, as shown
    in *Figure 8.26*.


    ![](img/12d790664598bbf390261087fbe55bbc_188_0.png)


    Let’s examine Configuration first. When you choose this option you will see something
    like the image shown in *Figure 8.27*. The Toolbars tab happens to be the one
    that is initially showing. This is because it is probably the most commonly used.
    This tab allows you to select which toolbars will be visible. If you find that
    some toolbar is no longer showing, simply go here and add it. Conversely, if you
    find that you don’t often use a toolbar, you can go here and remove it.'
  merge: -1
  img_proc: true
- pgno: 189
  md: '![](img/12d790664598bbf390261087fbe55bbc_189_0.png)


    Figure 8.27: The Toolbars tab.


    The Status Bar tab, shown in Figure 8.28, allows you to decide what items will
    be shown in the toolbar at the bottom of the Writer screen. By default, items
    such as Page Number and Insert Mode are shown. You can customize the status bar
    to show the elements that are important to you.


    ![](img/12d790664598bbf390261087fbe55bbc_189_1.png)


    Figure 8.28: The Status Bar tab.


    The Keyboard tab is shown in Figure 8.29. This tab allows you to alter the keyboard
    functionality. In Writer, as with many applications, you can access various functions
    via shortcut keys on the keyboard. One of the things you can do with this tab
    is to alter which shortcut keys work for which functions. This allows you to really
    customize Open Office Writer to suit your needs and preferences.'
  merge: -1
  img_proc: true
- pgno: 190
  md: '![](img/12d790664598bbf390261087fbe55bbc_190_0.png)


    Figure 8.29: The Keyboard tab.


    The Menu tab allows you to customize the drop-down menu. This tab is depicted
    in Figure 8.30. With this tab you can customize the current Writer menu and even
    add your own menu items to it.


    ![](img/12d790664598bbf390261087fbe55bbc_190_1.png)


    Figure 8.30: The Menu tab.


    The final tab of the Configuration screen is Events. This is an advanced setting
    that you should probably leave with its defaults, and we will not be delving into
    it. You can see that Open Office Writer offers you a lot of different configuration
    options.


    This brings us to Options, also found under Tools. This screen, shown in Figure
    8.31, allows you to customize other aspects of your application. By using the
    various options on the side of this screen you can alter the default colors, date
    format, printing behavior, and more. This screen combined with the Configuration
    screen should allow you to fully customize the behavior and appearance of Open
    Office Writer so that it suits your personal needs and preferences.'
  merge: -1
  img_proc: true
- pgno: 191
  md: '![](img/12d790664598bbf390261087fbe55bbc_191_0.png)


    Figure 8.31: The Options screen.


    Also under the Tools menu you will find the Auto Correct/Auto Format screen shown
    in Figure 8.32. This screen allows you to change how Writer goes about correcting
    spelling and formatting.


    ![](img/12d790664598bbf390261087fbe55bbc_191_1.png)


    Figure 8.32: Auto Correct/Auto Format.


    The tab on this utility that is of most interest to us is the Word Completion
    tab. This is shown in Figure 8.33. Different people have very different views
    on any word processor performing word completion. Word completion simply means
    that as you are typing, as soon as the word processor recognizes that you are
    typing a word it knows, it will complete the word for you. Some people love this
    feature, others hate it. This tab will allow you to turn that feature on or off
    and customize how it behaves should you leave it on.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '![](img/12d790664598bbf390261087fbe55bbc_192_0.png)


    **Figure 8.33:** Word completion.


    Obviously there are more features and details in Open Office Writer. An entire
    book could probably be written on just this one product. However, this chapter
    should be enough to give you a basic start using this word processor. If you read
    this chapter carefully and try the various techniques mentioned, you should be
    a competent user of Open Office Writer.'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# **Summary**


    In this chapter, we have seen the basics of how to use Open Office Writer. We
    have looked at the toolbars, text formatting, inserting objects, and more. You
    have seen how to create tables, insert charts, and format your document. After
    reading this chapter you should be basically proficient with Open Office Writer.
    You should also be aware of just how powerful this free word processor is.'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# **Review Questions**


    +   1. What three common text formatting buttons are found in the exact same order
    in both Microsoft Word and Open Office Writer?


    +   2. What type of functions are found on the second toolbar in Writer?


    +   3. Name an advantage that Microsoft Word has over Open Office Writer.


    +   4. What is a common document tool used to organize data in an easily read
    format?


    +   5. Does Open Office Writer have more field options than Microsoft Word?


    # **Answers**


    +   1. Bold, italic, and underline.


    +   2. Common or standard word processing functions.


    +   3. MS Word has more graphics.


    +   4. A table. Inserting a symbol in Microsoft Word is duplicated in Open Office
    Writer by inserting a special character.


    +   5. No'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Chapter 9: Spreadsheets with Open Office Calc


    # Introduction


    Now that you have been given a tour of the Open Office Writer, you are ready to
    move on to the next application in the Open Office suite, the spreadsheet application,
    Calc. While word processing is probably the most common task performed on a PC
    by both home and business users, spreadsheets are by far the most commonly used
    business applications. Virtually any business of any size needs to keep financial
    records and perform financial calculations. For most Windows users, this means
    using Microsoft Excel, which is shown in Figure 9.1.


    ![](img/12d790664598bbf390261087fbe55bbc_195_0.png)


    **Figure 9.1: Microsoft Excel**


    Open Office offers the same functionality via its spreadsheet tool named Calc.
    Calc is short for calculation, which is what you normally do with any spreadsheet
    application, perform calculations. Calc is shown in Figure 9.2.'
  merge: -1
  img_proc: true
- pgno: 196
  md: '![](img/12d790664598bbf390261087fbe55bbc_196_0.png)


    **Figure 9.2:** Open Office Calc.


    The first thing that you should notice is the similarities between these two figures.
    The basic layout and functionality of the two applications are nearly identical.
    This should not be surprising. All spreadsheet applications are an attempt to
    automate a bookkeeper’s spreadsheet, so the general layout should be similar.
    As with the word processor, the spreadsheet tool in Open Office divides the toolbar
    into rows. There will be some differences, but you still have essentially the
    same functionality with very similar icons in both Open Office and Excel. The
    buttons for opening files, saving files, printing, and formatting text are virtually
    identical. If you will note, even the drop-down menus have the same names and
    are in identical order in both Calc and Excel.


    ![](img/12d790664598bbf390261087fbe55bbc_196_1.png)


    ![](img/12d790664598bbf390261087fbe55bbc_196_2.png)


    ![](img/12d790664598bbf390261087fbe55bbc_196_3.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: '# ## Calc Basics


    The toolbars in Open Office Calc are in a particular order with each toolbar containing
    specific tools for specific functions. The toolbars are listed here:


    +   - A Menu toolbar

    +   - A Function toolbar

    +   - An Object toolbar

    +   - A Calculation toolbar


    The Menu toolbar contains Calc''s main menus. The Menu toolbar provides user access
    to basic functions such as Open, Save, Copy, Cut, Paste, and so on. These functions
    are common to all Open Office applications. In fact, with almost any application,
    you will see the same or very similar items grouped under the File menu. The Object
    toolbar consists of a set of tools that are specific to calculation and cell formatting
    (number format, text alignment, borders). These are the buttons that are unique
    to Calc and will not be found in other Open Office applications. Finally, the
    Calculation toolbar enables a user to enter his own specific formulas for calculations.
    This toolbar also displays the current cursor position within the spreadsheet
    .


    These toolbars can be customized. One way to do this is to right-click on any
    of the toolbars and select Visible Buttons, as shown in Figure 9.3. This enables
    you to choose what buttons are shown in the toolbar and which buttons are not
    shown.'
  merge: -1
  img_proc: true
- pgno: 198
  md: '![](img/12d790664598bbf390261087fbe55bbc_198_0.png)


    # **Figure 9.3:** Choosing Visible Buttons.


    When you right-click on any toolbar, all the toolbars are displayed in a list.
    The visible toolbars have a checkmark by their names on the list. You can choose
    to display or not display an entire toolbar by checking or unchecking it in the
    list. You can also right-click on any toolbar and select Configure. This will
    enable you access to all of the configuration options in one convenient screen.


    On the left of the screen you will see the toolbar, shown in Figure 9.4. This
    toolbar provides a number of specialized tools for use with a spreadsheet. We
    will explore these functions in more depth later in this chapter.'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/12d790664598bbf390261087fbe55bbc_199_0.png)


    **Figure 9.4:** The toolbar.


    The spreadsheet is represented as a grid composed of rows and columns creating
    cells. A cell is referenced by its column (vertical reference), given as a letter
    such as A, B, …Z, and its line (horizontal reference) is given as a number such
    as 1, 2,…300. A particular cell might be identified as B10. This is the same as
    identifying a specific cell within Microsoft Excel. An individual cell contains
    some sort of data. You will usually place a number in a cell, as numeric data
    is usually used in a spreadsheet. However, you also can enter text directly into
    any cell. This is useful for labeling data.


    # Basic Calculations


    Performing calculations is the reason for a spreadsheet program. Therefore, we
    should probably delve right into entering data and performing calculations. First
    we are going to create a simple spreadsheet for a small business. We will organize
    our spreadsheet in rows that designate types of expenses and columns that indicate
    months, as shown in Figure 9.5. Remember that you need to click inside a cell
    and then you can enter text or numbers. You should also note that if you enter
    January in the first month cell and then click on the lower-right corner of that
    cell and drag across, the subsequent cells will be filled automatically with the
    appropriate month, as you also see in Figure 9.5. This particular feature of Calc
    behaves in exactly the same manner as Excel. You can do the same thing with numeric
    values in a cell and drag your mouse. The values will be incremented by 1 in each
    cell. This works very much the same in Excel, but the actual values will be duplicated
    to subsequent cells rather than a steady increment of the value. In both Excel
    and Calc this function is called AutoFill, since it automatically fills in appropriate
    data.


    ![](img/12d790664598bbf390261087fbe55bbc_199_1.png)


    **Figure 9.5:** A simple spreadsheet.'
  merge: -1
  img_proc: true
- pgno: 200
  md: 'Now enter some figures for the various cells. For our purposes, the actual
    numbers you enter are irrelevant, but of course those numbers would be very important
    in a real-world business situation. You can make your column headers a different
    font, perhaps bold. This will help them stand out from your actual data. You can
    accomplish this by highlighting an individual cell or an entire row and then selecting
    the formatting options you want to implement. This is how formatting cells is
    done in Excel, so you should have no problem with this task. Once you are done,
    your spreadsheet should look very much like the one in Figure 9.6.


    ![](img/12d790664598bbf390261087fbe55bbc_200_0.png)


    Now we have our data in a very neat looking spreadsheet, but that is only the
    beginning of what anyone wants from spreadsheets. Simply typing in the data is
    not particularly exciting. We want to manipulate the data and produce statistics,
    answers, and such. In short, we want to do some number crunching. Now we will
    begin to manipulate the data in a variety of ways. The simplest calculation we
    can do is to total the values in a given row or column. If you click once in the
    first blank cell after a row or column of numbers, you can then go to the toolbar
    and click on the summation symbol, shown in Figure 9.7. Notice that we mentioned
    rows or columns. You can total up either a row or a column. In fact, all of the
    functions available in either Calc or Excel can be executed against data from
    either a row or a column.


    ![](img/12d790664598bbf390261087fbe55bbc_200_1.png)


    You will then be shown a formula in the formula bar, and you can choose to either
    accept it or reject it, as shown in Figure 9.8. If you choose to accept it, the
    answer to that formula will be displayed in the cell you initially clicked on.


    ![](img/12d790664598bbf390261087fbe55bbc_200_2.png)'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# Calc Basics


    This is very similar to how summation works in Excel. The buttons even look the
    same in both applications. The difference is that in Excel you don''t have the
    option to accept or reject the choice you make. Once you click the summation button,
    the formula is inserted, and the calculation is done.


    This, however, is a rather simple calculation. You will probably require more
    advanced calculations. Before we move on to other calculations, we want to make
    sure we will remember what this column we just generated represents. Numbers without
    labels quickly become meaningless. For that reason, you probably want to label
    the column you put the sum in. You might give it some label such as Total. Once
    you have done that, you might notice the button to the left of the summation button.
    It is referred to as the AutoPilot button. When you press it you will be shown
    a list of built-in functions you can insert into your spreadsheet, as shown in
    Figure 9.9.


    ![](img/12d790664598bbf390261087fbe55bbc_201_0.png)


    Figure 9.9: Functions.


    There are literally dozens of calculations/functions listed here. Many, if not
    most, of the calculations you will require are listed here. For our purposes,
    scroll down the list until you find a function named STDEV. This is the standard
    deviation. If you are not familiar with basic statistics, don''t worry. Calc will
    do all the number crunching for you. Conceptually, standard deviation is simply
    an average of how much each individual item in a sample deviates from the sample''s
    average. This tells us whether or not the mean is a useful statistic. A high standard
    deviation means that there really was no norm for that data group.


    When you have selected the STDEV function, press the next button and you will
    see a screen like the one in Figure 9.10, where you can enter the various cells
    you want to compute standard deviation for.


    ![](img/12d790664598bbf390261087fbe55bbc_201_1.png)


    Figure 9.10: Performing calculations.


    You should notice that on the right side, in the lower third of the screen, the
    result for the numbers you picked is already being displayed. When you click OK,
    this result will be put into the spreadsheet. If you should later change the value
    of any of the cells that you included in the standard deviation calculation, the
    calculation''s total will automatically be revised to match the changed or new
    data. Also note that you can also get to these functions from the drop-down menu
    by selecting Insert and Functions. This is the way you get to similar functions
    in Microsoft Excel. In addition to average and standard deviation, you can see
    that there are dozens of other built-in functions you can use.


    There is a large number of functions you can choose in Calc, some of which might
    be beyond some readers'' mathematical understanding.'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'However, Table 9.1 lists many of the commonly used functions and what they
    do.


    # Table 9.1: Calc Functions


    | Function | Purpose |

    | :------- | :------ |

    | AVERGE | This is the statistical mean for a set of data points. |

    | CHITEST | This performs the Chi squared test, a common statistical function.
    |

    | COS | This returns the trigonometric function cosine. |

    | SIN | This returns the trigonometric function sine. |

    | TAN | This returns the trigonometric function tangent. |

    | COUNT | This returns the number of elements in a set of data points. |

    | COVAR | This calculates the covariance for a set of data points. |

    | EXP | This function calculates the exponent for a base number. |

    | LOG | This function gives the logarithm. |

    | PEARSON | This function returns the Pearson correlation coefficient. This is
    another common statistical function. |

    | STDEV | This will return the standard deviation of a set of numbers. This is
    often presented with the mean. |


    This list is by no means exhaustive, but it does contain the more commonly used
    functions. Just as a point of information, there are two other ways you can get
    to the function list other than by using the Autopilot button. The first is to
    go to the drop-down menu, choose Insert, and select Functions. The second is to
    use the shortcut keys Ctrl-F2.


    # Drop-Down Menu


    Everything we have done so far has been with the toolbars at the top of the screen.
    However, you have undoubtedly noticed the drop-down menus as well. Some people
    prefer to use drop-down menus rather than toolbars. Fortunately, you can accomplish
    most tasks with either approach, depending on your personal preferences.


    The first drop-down menu, File, is much like the File menu in most Microsoft Office
    programs. When you click on the File drop-down menu, you are presented with a
    screen, like the one shown in Figure 9.11. You can see that you have the basic
    options you would expect. This includes options to create a new file, open an
    existing file, or save a file.'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/12d790664598bbf390261087fbe55bbc_203_0.png)


    Figure 9.11: The File drop-down menu.


    You can see that this is almost identical to the File drop-down menu in Microsoft
    Excel, shown in Figure 9.12. There is very little difference between these two
    menus. Remember that we had previously mentioned that in most applications you
    will find similar items under the File menu.'
  merge: -1
  img_proc: true
- pgno: 204
  md: '![](img/12d790664598bbf390261087fbe55bbc_204_0.png)


    The biggest difference between the two is that Excel, like all Microsoft Office
    applications, lists your most recently opened files so that you can quickly access
    them. The current version of Open Office does not do this.


    Next we come to the Edit menu, shown in Figure 9.9. This too is a standard drop-down
    menu, similar to what you might find in most Open Office or Microsoft Office applications.
    You can undo your last action, cut, copy, paste, select all, or find items. This
    is very close to what you see in Excel under the Edit menu.


    The View drop-down menu, which we encounter next, is very important. This menu
    enables you to change various facets of the way you view the current worksheet.
    Of particular interest is the third option, Toolbar. This option enables you to
    select which toolbars will be displayed. You can remove any toolbar you don’t
    want by unselecting it here. The last option is to choose to view Full Screen.
    This means without any toolbars, menus, or other items. The Microsoft Excel drop-down
    menu is nearly identical to this.'
  merge: -1
  img_proc: true
- pgno: 205
  md: '![](img/12d790664598bbf390261087fbe55bbc_205_0.png)


    **Figure 9.13:** The Edit menu.


    When we reach the Insert drop-down menu, we begin to get to some really interesting
    functionality. It is from this menu, shown in Figure 9.14, that you will be able
    to add new rows, columns, cells, graphics, and more. The addition of rows and
    columns is relatively straightforward and does not require much explanation. A
    row or column will be inserted at the spot where your cursor is.'
  merge: -1
  img_proc: true
- pgno: 206
  md: 'Calc Basics


    ![](img/12d790664598bbf390261087fbe55bbc_206_0.png)


    **Figure 9.14:** The Insert menu.


    You also can see the Insert Function option. This will insert the same built-in
    functions that we examined previously in this chapter. After that you can see
    the Graphics option. This option will present you with a dialog box, shown in
    **Figure 9.15**, where you can insert any standard image file on your machine.


    ![](img/12d790664598bbf390261087fbe55bbc_206_1.png)


    **Figure 9.15:** Inserting graphics.


    Of even more interest is the Insert Object option. This option enables you to
    insert sounds, videos, OLE objects, Java applets, and more. This enables you to
    add a whole new dimension to your spreadsheets. For example, if you are doing
    a budget spreadsheet for a construction project, you could add a video of a building
