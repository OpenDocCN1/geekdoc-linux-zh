- pgno: 341
  md: '# Chapter 16: Linux FTP Servers


    # Introduction


    In an earlier chapter we introduced you to an FTP client application for Linux.
    You could use this client to connect to any FTP server, regardless of the operating
    system the FTP server was running on, and upload or download files. Linux doesn''t
    just supply you with FTP client software, it also provides you with the server
    software as well. In this chapter we will explore some FTP server options for
    Linux.


    You might be wondering why you want an FTP server: Some readers won''t need one.
    However, if you had an FTP server running on your home machine, you could upload
    and download files from anywhere with an Internet connection. If, for example,
    you are on a business trip and forgot to bring along some documents on your home
    computer, you could log on to your home PC''s FTP server and download them.


    Another reason to run an FTP server is to do so in conjunction with the Web server
    described in the preceding chapter. For example, if you set up a Web server for
    a club, organization, church group, or perhaps neighborhood association that you
    are a member of, you would need to have some method for letting members of that
    group upload their own Web pages. You could simply have them hand you a disk with
    the files on it, then you would upload them. However, this is not very efficient.
    With an FTP server running on your machine, you could give each member of your
    group a login ID and password, and they could then log on and upload their own
    files. In this chapter you will learn how to set up your own FTP server in Linux.
    You will also be given some information on what an FTP server is and how it works.'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# # What Is an FTP Server?


    An FTP server is simply software that can respond to FTP requests, just as a Web
    server is a computer that has an application listening to and responding to HTTP
    requests on port 80. With FTP servers, the software must listen for FTP requests
    on port 21. Microsoft''s Internet Information Server package includes an FTP server.
    It basically allows users to upload files to your computer. Bear in mind that
    this can be the source of significant security risks. If you allow users to upload
    any file they like to your Web site, then someone could upload harmful software
    to your system. It is best to go to the Web site for the FTP server you prefer
    and read all of the documentation they have before trying to run an FTP server.
    This chapter is meant to give you an introduction to the topic and show you how
    to set up the basic configuration options.'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# VSFTP


    We will start with one of the easiest FTP servers to configure. VSFTP is very
    easy to configure, and it ships with Red Hat 9.0. That means that you should already
    have it. Recall from Chapter 14, “Miscellaneous Linux Applications,” how to look
    under packages and ensure that this application is properly installed on your
    computer. Once it is installed, you are ready to configure and run it. There are
    just a few simple steps to follow.


    +   1. Find the file `/etc/vsftpd/vsftpd.conf`. This is shown in **Figure 16.1**.


    ![](img/12d790664598bbf390261087fbe55bbc_343_0.png)


    **Figure 16.1:** Finding the configuration file for VSFTP.


    +   2. Check to ensure that it has the following properties set:


    +   a. `disabled` is set to `no`.


    +   b. Make sure it has `local_enabled = yes`.


    +   c. Make sure that `allow_anonymous = yes`. This is shown in **Figure 16.2**.'
  merge: -1
  img_proc: true
- pgno: 344
  md: '![](img/12d790664598bbf390261087fbe55bbc_344_0.png)


    +   3. Find the `/etc/hosts.allow` file. You can see it in Figure 16.3. It should
    have the setting `vsftp: ALL`. That is shown in Figure 16.4.


    ![](img/12d790664598bbf390261087fbe55bbc_344_1.png)'
  merge: -1
  img_proc: true
- pgno: 345
  md: '![](img/12d790664598bbf390261087fbe55bbc_345_0.png)


    **Figure 16.4:** hosts.allow settings.


    +   4. From a shell, type chkconfig --add xinetd. Then type /etc/init.d/xinetd
    start. This is shown in Figure 16.5.


    ![](img/12d790664598bbf390261087fbe55bbc_345_1.png)


    **Figure 16.5:** Starting your FTP server.


    What your shell command did was add your VSFTP server to the xinetd process. That
    process governs Internet and network connections. The second line started your
    FTP server. Your FTP server is now running. You should be able to go to any other
    machine and log in using any FTP client. Bear in mind that the FTP protocol is
    not dependent upon the operating system. You can go to a Windows machine and use
    FTP to connect to your Linux FTP server. The easiest way to log on would be anonymously:


    ```

    ```

    username  = anonymous

    password  = anye-mail@anywhere.com

    ```

    ```


    If you assign any usernames and passwords to VSFTP, then you could use those to
    log on. If you examined the configuration file for VSFTP, you probably noted that
    there were several additional settings you could alter. The basic settings for
    VSFTP are shown in Table 16.1, along with a brief explanation.


    **Table 16.1:** VSFTP Settings


    | Setting | Purpose |  |

    | --- | --- |  |'
  merge: -1
  img_proc: true
- pgno: 346
  md: '| `anonymous_enable` | Determines whether or not anonymous users are allowed
    to log in. |


    | `local_enable` | Determines if a local user can log in. |


    | `write_enable` | Can a connected user perform write operations? |


    | `dirmessage_enable` | Do you want messages to display when the user connects
    to certain directories? |


    | `ascii_upload_enable` | Do you want to allow the upload of ASCII files? |


    | `ascii_download_enable` | Do you want to allow the download of ASCII files?
    |


    | `ftpd_banner` | Do you want a banner to display when a user first logs on? |


    There is another file that you may want to consider examining. This file is `/etc/vsftpd.users`,
    and it contains a list of users who are not allowed to log in to the FTP server
    under any circumstances. Adding a username to this list will block that user from
    ever logging in to your FTP server. If you have a particular user who is unable
    to log in, you might consider checking this file to see if he is there for some
    reason. There are several users that are listed by default. The default listing
    for this file is shown in Figure 16.6.


    ![](img/12d790664598bbf390261087fbe55bbc_346_0.png)


    **Figure 16.6: The `vsftpd.users` file.**


    This is just a basic setup for VSFTP. It will run and allow people to upload and
    download. It is recommended that after you finish this chapter you pick one FTP
    server that seems to be your favorite and spend some time learning it in more
    depth. A good place to start is a simple Web search for that FTP server.'
  merge: -1
  img_proc: true
- pgno: 347
  md: '# # ProFTPD


    ProFTPD does not come with the Red Hat installation CD-ROM, but it is a very popular
    FTP server, and for that reason it would be a mistake not to discuss it here.
    It can be obtained from http://proftpd.linux.co.uk/.


    The most commonly used server is WU-FTPD. However, the designers of ProFTPD thought
    that, while WU-FTPD provides excellent performance and is generally a good product,
    it lacked certain features found in newer Win32 FTP. With this in mind, they set
    out to create an FTP server for Unix and Linux systems that had the features they
    felt should be there.


    Installing ProFTPD is relatively simple. After you have downloaded the package
    from a Web site (the one previously mentioned would be a good place to start),
    you can go to a shell, change to the directory where the package is located, and
    type in `rpm -install proftpd-{version}.rpm`.


    This will place the configuration file for ProFTPD in either `/usr/local/etc/
    proftpd.conf` or `/etc/proftpd.conf`. With this and any other software that does
    not come with Red Hat, your best place to look for more information is the documentation
    of that vendor. We are listing FTP servers here that are not included in the Red
    Hat installation to give you an idea of what alternatives are available.'
  merge: -1
  img_proc: true
- pgno: 348
  md: '# ## PureFTpd


    PureFTpd does not ship with Red Hat, but it is a very useful and popular FTP server.
    You can find it at the Web address www.pureftpd.org/. You can then download and
    install it on your machine. One of the biggest advantages of this FTP server is
    that it is quite easy to set up.'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# # WU-FTP


    WU-FTP (Washingston University FTP Server) ships with Red Hat Linux 9.0. It is
    one of the most commonly used FTP servers in the world of Linux. If you followed
    the instructions in Chapter 2, it should be installed on your machine. You can
    check your packages, and if it is not installed, you can add it. Your first step
    in configuring this FTP server will be to find the configuration file. That can
    be found at `/etc/xinetd.d/wu-ftpd`. Change `disable = yes` to `disable = no`.


    To change the permissions so that various users can access your FTP server, you
    will need to go to the access permission file found at `/etc/ftpaccess` directory.
    To allow a given user access you must make the following settings: `allow-uid
    ftp` (uid is the user ID) `allow-gid ftp` (gid is the group ID).


    It is imperative that you make certain that users you have added match actual
    users on your system. Then make certain that the users'' home directories are
    the ones where you want them to put their uploads. When you manage users and groups,
    you set each user''s home directory. This will be the directory that he will first
    see when he connects with FTP. If you are using FTP to allow customers of a Web
    server to upload pages, then user `jdoe` would probably have a home directory
    something like `/var/www/html/users/jdoe/`.


    The following entries in the configuration file are not critical, but it might
    be a good idea to take a look at them:


    +   - `readme`: This setting in the `config` file identifies a readme file that
    users have access to.

    +   - `e-mail root@localhost`: This is the admin''s e-mail address.

    +   - `loginfails 5`: How many login attempts before failure?

    +   - `message`: This is the welcome message file you want to display.


    Now you can start WU-FTP by typing `>/etc/init.d/xinetd restart` at the shell.
    To stop the FTP server, type `ftpshtut now`.


    The configuration you have just seen is very basic. You would be well advised
    to spend some time reading the documentation on the WU-FTP Web site.


    As a final word of caution, you should bear in mind what was stated at the beginning
    of this chapter. FTP servers can be a significant security risk. If this chapter
    is your first introduction to FTP servers, then you are advised to not set one
    up on a commercial or business server without first reviewing all of the documentation
    for that Web server. Go to that Web server''s home page and read the online documentation,
    with particular attention to the security notes.'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# # Summary


    In this chapter, you saw the essentials of three different FTP servers. You saw
    where to get an FTP server and in some cases how to configure and start it. All
    of these FTP servers are open source and can be found on the Internet and downloaded
    free of charge. With each of the FTP servers that we actually configured, we did
    a basic configuration. It would be advisable for you to spend some time studying
    any FTP server you want to use in more detail. This chapter was meant to get you
    started with FTP servers. Also, you should note that you should have only one
    FTP server running at a time. If you have more than one running, they will conflict
    with each other and neither will work.'
  merge: -1
  img_proc: true
