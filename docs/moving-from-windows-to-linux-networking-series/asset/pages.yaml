    Chapter 14 is a sort of smorgasbord. Many of the small applications and utilities
    that did not seem to fit anywhere else are covered here. Chapters 15 and 16 will
    show you how to set up your own Web server or FTP server. Finally, Chapter 17
    shows you around the world of gaming in Linux. We will look at some of the games
