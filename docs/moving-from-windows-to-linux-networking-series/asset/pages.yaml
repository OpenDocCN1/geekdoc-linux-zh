- pgno: 295
  md: 'Figure 13.27: The Settings screen.


    For example, under the Mail Preferences option, you can decide whether to have
    Trash automatically deleted when you exit Evolution or to have some sound play
    when new mail arrives. Essentially, this screen enables you to customize your
    entire e-mail experience.


    # # KMail


    The KMail e-mail client is a very interesting and useful application and is shown
    in Figure 13.28. However, it is strictly an e-mail client. It does not have a
    contact manager or calendar like Evolution and Outlook. When you first look at
    KMail, you can see the basic mail boxes: Inbox, Outbox, Sent, Trash, and so on.


    ![](img/12d790664598bbf390261087fbe55bbc_295_0.png)


    There are a few differences between KMail and Evolution, besides the absence of
    a contact manager or calendar, that we should explore. To begin with, in order
    to check mail, in KMail you go to File and choose Check Mail. This will query
    your e-mail server for any e-mail you have. To create a new message, you go to
    Message and select New Message. All of the basic e-mail functionality that you
    found in Evolution and Outlook is still present, it is just in a different place.


    One real advantage that KMail has over many e-mail clients is its filtering capability.
    If you go to Settings on the drop-down menu and select Configure Filters, you
    will see the screen shown in Figure 13.29. You can use this to filter out unwanted
    messages based on any number of criteria. This is perhaps the most useful feature
    of KMail.'
  merge: -1
  img_proc: true
- pgno: 296
  md: '![](img/12d790664598bbf390261087fbe55bbc_296_0.png)


    **Figure 13.29**: The KMail Filter.


    The other item you need to be aware of in KMail is the KMail Settings screen,
    also found under Settings and shown in Figure 13.30. It is here that you would
    go to configure your incoming and outgoing e-mail servers. You can also configure
    how your outgoing mail will appear and many other facets of your KMail experience.


    ![](img/12d790664598bbf390261087fbe55bbc_296_1.png)


    **Figure 13.30**: KMail settings.


    You can find even more e-mail applications that install with Red Hat Linux, including
    Mozilla Mail and Korn. Each of these has certain advantages and disadvantages.
    If you are looking for a Linux e-mail client that is most like Microsoft Outlook,
    Evolution is your solution.'
  merge: -1
  img_proc: true
- pgno: 297
  md: '# **FTP Clients**


    FTP (File Transfer Protocol) is how you get files across the Internet. If you
    have ever downloaded something from a Web page, you were using FTP from within
    the Web browser. You can also use FTP client applications that are for connecting
    to a specific Web site and uploading or downloading files. If you decide to put
    up your own Web site, it is likely that the Internet service provider or Web hosting
    company will give you an FTP address. You would then use your FTP client application
    to upload new Web pages, change names, alter files, and so on. With Linux you
    have several options for FTP clients, and we will look at one such option, gFTP,
    shown in **Figure 13.31**.


    ![](img/12d790664598bbf390261087fbe55bbc_297_0.png)


    **Figure 13.31**: The gFTP application.


    On the left side you see a list of all the directories and files on your computer.
    Once you connect, the right side will show those directories and files on the
    FTP host computer that you have access to. You can then drag and drop files from
    one side to another. How do you get connected in the first place? Notice at the
    top of the screen the boxes labeled Host, Port, User, and Pass. In the Host box
    you will enter the address of the FTP host computer. This could be a URL, much
    like a standard Web address, or it could be an IP address like 10.10.10.x. You
    then type in the port.


    **Note** Throughout this book you will see IP addresses much like this one. Real
    IP addresses on the Web are not generally 10.10.10.x. However, there are a lot
    of IP addresses in use, and it was necessary to make certain that a real IP address
    for a real server on the Web was not used.


    The host and port information will have to be given to you by whoever is giving
    you access to the FTP server. However, if no port information is given, the default
    port for FTP is 21. The Username and Password fields are rather self explanatory.
    Once you have filled these in, click on the Computer icon to the left of Host,
    and it will attempt to connect.


    For those readers who have an interest in developing Web pages, the FTP client
    will be very important. Without it, you may have trouble accessing your Web server
    to upload your Web pages. Many Web hosting services give you a login name and
    password and ask you to use FTP to upload files to their Web server. Also, in
    a later chapter, we will be exploring the use of FTP servers in Linux.'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# Chat


    A lot of people like to go into chat rooms on the Internet, and it would be a
    gross oversight if we did not at least give this topic a cursory overview. The
    idea of chat software is simple. You connect to some chat server, and everyone
    connected can participate in a live conversation via the Internet. To that you
    must have access to a chat server and a chat client. (Just do a Web search for
    chat room on Google or Yahoo! You should find quite a few.) Linux comes with one
    called IRC Chat, shown in Figure 13.32.


    ![](img/12d790664598bbf390261087fbe55bbc_298_0.png)


    Once you have located a chat server you want to use, you will need to enter that
    server''s information into the Chat application. If you click on the New Server
    button at the bottom of the screen, you will be presented with a screen like the
    one shown in Figure 13.33, where you can enter all the server''s particulars.


    ![](img/12d790664598bbf390261087fbe55bbc_298_1.png)


    You should notice that many popular chat servers are already listed in the software.
    At the top of the screen you list your real name and any nickname you may want
    to use. When you are ready to chat, click the server you want to use and click
    the Connect button. You will be ready to chat away the hours!


    On a more technical note, a chat room actually uses channels, not unlike your
    television, in order to accommodate the various chats going on. A typical chat
    server will host multiple channels, each dedicated to a particular topic. You
    will find a channel dedicated to virtually any topic you might like. A simple
    place to start would be to go to any search engine you like and type in your topic
    and the words “IRC channel.” For example, you could type in “Linux IRC channel,”
    and you would find a plethora of chat channels ready for you to use.'
  merge: -1
  img_proc: true
