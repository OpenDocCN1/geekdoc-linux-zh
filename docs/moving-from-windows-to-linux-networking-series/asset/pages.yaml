- pgno: 434
  md: '# # Chapter 22: Samba, Printing, and More


    # ## Introduction


    During the time you have been reading this book, you have seen a lot that Linux
    can do, all at a very low cost and in many cases free. You might feel a rush of
    excitement and want to completely convert all computers in your home or office
    over to Linux. Slow down just a moment and let reality tap you gently on the shoulder.
    It is very unlikely that you will dispense with Windows in one fell swoop. It
    is not even clear that such a move would be desirable, even if it were possible.
    The fact is that Linux often is found in a mixed environment, one with both Windows
    and Linux machines and occasionally Macintosh machines as well. This means that
    sooner or later you are going to need to share files between a Linux machine and
    a Windows machine. That is where Samba comes in. Samba is a program that facilitates
    sharing a Linux drive so that Windows can use it and enabling Linux to access
    shared drives on Windows machines.'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# What Is Samba?


    Samba is a file and print server for Windows-based clients using TCP/IP. TCP/IP
    is a suite of protocols that is used in most Internet and network communication.
    This means that Samba is a utility that enables Windows machines to access files
    and even printers that are connected to a Linux machine. This is an important
    service because Linux often will be found in mixed environments. Samba was originally
    developed by Andrew Tridgell but is now being developed by a global team of about
    30 active programmers.


    You can find a lot of useful details about Samba, if you are interested, at **www.samba.org**.
    However, the documents you find will use some terminology you should be familiar
    with. These terms are explained in *Table 22.1*.


    # **Table 22.1: Samba Terminology**


    | Term | Meaning |

    | :--- | :--- |

    | SMB | This stands for Server Message Block. It is the protocol that Microsoft
    uses for file and print sharing. |

    | IPC | This means Inter Process Communication. It is a technical way of communicating
    between different programs. |

    | NetBIOS | This stands for Network Basic Input/Output System. This is a method
    for communicating on a network that is used by Microsoft. |

    | W2K | Short for Windows 2000. |


    In much of the Samba documentation you will find, these terms are used but not
    defined. We define them here so that you can use the online Samba documentation
    available on the Internet. It is certainly possible to configure and use Samba
    without going into any extensive research on the topic. In fact, in this chapter
    you will see how to set up Samba and run it. However, some readers will want to
    go a little deeper on this topic.'
  merge: -1
  img_proc: true
- pgno: 436
  md: '# # Configuring Samba


    In the past the only way to configure Samba was via shell commands. Fortunately,
    that is no longer the case. You can go to the Start menu, find Server Settings,
    select More Server Settings, and choose Samba Settings. You will then see a screen
    like the one shown in Figure 22.1.


    ![](img/12d790664598bbf390261087fbe55bbc_436_0.png)


    **Figure 22.1:** The Samba Server Configuration screen.


    This screen is simple. Adding a Samba service to your Linux machine with this
    utility is probably easier than many of the other tasks we have performed. At
    this point you can either click the Add button on the toolbar or select File and
    Add Share from the drop-down menu. When you choose that you will see a screen
    much like the one shown in Figure 22.2.


    ![](img/12d790664598bbf390261087fbe55bbc_436_1.png)


    **Figure 22.2:** Adding a new share.


    On this first tab you can use the Browse button to find a directory that you want
    to share. You also can give this directory a description and set whether or not
    users who access it can write files to it or only read files from it. The Access
    tab, shown in Figure 22.3, enables you to'
  merge: -1
  img_proc: true
- pgno: 437
  md: 'decide whether all the users can access this shared drive, or just certain
    users that you list.


    ![](img/12d790664598bbf390261087fbe55bbc_437_0.png)


    When you are satisfied, click OK, and this share will appear on the main screen
    with its properties listed, as you see in Figure 22.4.


    ![](img/12d790664598bbf390261087fbe55bbc_437_1.png)


    If you want to add users to the list of people who can access Samba, go to Preferences
    and choose Samba Users. You can add any user who exists on your machine. You can
    see the Add User screen in Figure 22.5. It is important that you realize that
    you can add only users who have a user account on this machine, so first you will
    need to add a user account for the person you want to access the Samba shared
    directory. This makes perfect sense if you think about it. A person cannot access
    a directory on a machine if he is not first given access to that machine. Remember
    in earlier chapters we discussed adding users both from KDE and from the shell.'
  merge: -1
  img_proc: true
- pgno: 438
  md: '![](img/12d790664598bbf390261087fbe55bbc_438_0.png)


    That''s all it takes to create a Samba shared directory and give users access
    to it. Sharing a printer is much simpler than you think. If you will recall, early
    in this book you were told that Linux views devices as files. Your floppy drive
    is actually `/dev/fd0` to Linux. Your printer is a device file as well. When you
    want to share a printer, go to the `/dev` folder and pick your printer!


    Like most applications, Samba can be configured. If you go to Settings and choose
    Samba Settings, you will see a screen like the one displayed in Figure 22.6. On
    the first tab of this screen you can choose the workgroup and username that Samba
    runs as. Remember when we discussed Apache Web Server? It also runs as a special
    user account. With user accounts for applications, like the ones for Samba and
    Apache, it is best to leave the default setting unless you have some pressing
    reason to do otherwise.


    ![](img/12d790664598bbf390261087fbe55bbc_438_1.png)


    There is also a second tab under settings, shown in Figure 22.7. This tab enables
    you to set the security settings. You can choose how to authenticate login attempts,
    whether or not to encrypt transmissions, and more.'
  merge: -1
  img_proc: true
- pgno: 439
  md: '![](img/12d790664598bbf390261087fbe55bbc_439_0.png)


    Figure 22.7: Samba Security tab.'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# Other Services


    Although Samba is an interesting service and very useful, it is not the only one
    available in Linux. Remember that the words *service* and *daemon* can be used
    interchangeably. Both words refer to a program that runs in the background and
    provides some service to the system. In the case of Samba, it is providing access
    to Windows machines.


    Also under *Server Settings* you will find Service Management. This screen is
    shown in **Figure 22.8**. Through this utility you can see every service running
    on your machine. You also can start or stop any service you want. However, you
    cannot configure these services from this screen, you can only start or stop them.


    ![](img/12d790664598bbf390261087fbe55bbc_440_0.png)


    **Figure 22.8**: The Service Configuration screen.


    One of the most important services for your computer is printing. In our discussion
    of Samba we mentioned that you can even share your printer with Windows users.
    It would probably be prudent to make certain that you can add printers to your
    Linux machine. We discussed this briefly in a previous chapter but not in any
    depth.


    If you go to the *Start* menu and select *System Settings* and then *Printing*,
    you will see a screen much like the one in **Figure 22.9**. This screen lists
    all of the documents waiting in the print queue and the printers. As you can see,
    we have none connected at this time.


    ![](img/12d790664598bbf390261087fbe55bbc_440_1.png)


    **Figure 22.9**: The print manager.


    Let''s add a printer. Click on the *New* button on the toolbar. Your computer
    will take a few minutes to find out about any printers that are attached and then
    will start a wizard to set up the print queue. For this exercise we will set up
    an actual printer. This is not meant as an endorsement of that particular printer
    model. It is the printer that is connected to the machine the author is using.
    The first screen of the Print Queue Wizard, shown in **Figure 22.10**, tells you
    what is about to happen.'
  merge: -1
  img_proc: true
- pgno: 441
  md: '![](img/12d790664598bbf390261087fbe55bbc_441_0.png)


    **Figure 22.10**: The Print Queue Wizard screen one.


    The next screen, seen in **Figure 22.11**, asks you to give this printer a name
    and a short description. The name is absolutely required. This is how you will
    refer to your printer in various applications you want to print from. The description
    is optional.


    ![](img/12d790664598bbf390261087fbe55bbc_441_1.png)


    **Figure 22.11**: The Print Queue Wizard screen two.


    The third screen, shown in **Figure 22.12**, is the most important. Here you see
    a list of all locally connected printers that Linux can detect. In this case there
    is only one. You also can use the drop-down menu at the top to change from looking
    for locally controlled printers to looking for networked printers. Click once
    on the printer you want and then click the Forward button.'
  merge: -1
  img_proc: true
- pgno: 442
  md: '![](img/12d790664598bbf390261087fbe55bbc_442_0.png)


    Figure 22.12: Picking a printer.


    If you know technical details about your printer, you can select the type of printer
    it is from the list shown in Figure 22.13. However, if you are not sure, or your
    printer specifics don''t appear in the list, choose the Generic printer option.


    ![](img/12d790664598bbf390261087fbe55bbc_442_1.png)


    Figure 22.13: Printer type.


    Once you have selected your specific printer model and type, you can complete
    the wizard. You will then be asked if you want to print a test page. It usually
    is a wise idea to do so. As you can see, setting up a printer in Linux is not
    a difficult task.'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# Summary


    A few very important topics were covered in this chapter. We discussed Samba,
    a critical utility if you want your Linux machine to be accessible from Windows
    machines. Samba enables you to run a mixed environment that combines Windows and
    Linux machines. We also discussed the Service Configuration utility. This is very
    useful for finding out what services are started, and stopping or starting them
    as needed.


    We completed the chapter with a discussion of adding printers. At some point,
    most people will want to print from their computers. Using the Print Queue Wizard,
    you should have no trouble hooking up most printers to your Linux machine.'
  merge: -1
  img_proc: true
