  md: '# Miscellaneous Shell Commands


    ![](img/12d790664598bbf390261087fbe55bbc_395_0.png)


    Figure 19.15B: The dmesg command, continued.


    As you can see, this command produces a tremendous amount of output. It can be
    quite daunting to read through this entire series of screens searching for a single
    item. This is where the **redirect** command can be quite helpful. If you type
    in `dmesg > boot.txt`, the `dmesg` output will be redirected to a file. You can
    then use any text editor you like to open that file and search for the items you
    need to check. This is just one example of how, using various shell commands together,
    you can make the system easy to manage.


    # fsck


    Hard drives eventually age and begin to encounter problems. It is important to
    be able to diagnose and correct problems before they become too severe. Every
    computer needs a process to check the system. With Windows, you can run a Scan
    Disk on any drive from the Windows Explorer. You right-click on the drive, and
    under Properties choose Tools. This is shown in Figure 19.16.


    ![](img/12d790664598bbf390261087fbe55bbc_395_1.png)


    Figure 19.16: The Windows Scan Disk.


    In Linux you can run `fsck` on any drive from the shell. This is short for filesystem
    check. It will check the integrity of the filesystem. This'
