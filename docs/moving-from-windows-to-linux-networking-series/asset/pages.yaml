    **Figure 2.5**: Keyboard setup.


    The next screen, shown in *Figure 2.6a*, asks what type of mouse you have. If
    you don''t see your model, select either the two-button PS2 generic mouse or the
    two-button serial generic mouse. There is also a check box labeled "Emulate a
    Three Button Mouse" that is checked by default. You can choose to leave it checked
    or not.'
