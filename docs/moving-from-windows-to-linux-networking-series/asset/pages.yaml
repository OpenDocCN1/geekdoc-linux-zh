    | -i | This instructs grep to ignore case. |

    | -w | This tells grep to look for whole word matches only. |

    | -l | This instructs grep to look for entire line matches only. |

    | -s | This suppresses error messages. |


    As with all shell commands, you can pass more than one flag to grep. This makes
    it a very flexible and popular search tool. It is probable that there has never
