- pgno: 53
  md: '# Shell Basics


    There is one last simple but very useful feature of the shell that needs to be
    covered before we continue. The shell has access to Linux manuals built into it.
    These are frequently called man pages (short for manual). Man pages enable you
    to look up the specifics for any Linux command. For example, if you forget how
    the mkdir command works, you can simply enter man mkdir at the shell, and you
    will be shown an entire section of the Linux manual on this command. Man pages
    are very useful, and no Linux aficionado would dream of not using them.'
