- pgno: 363
  md: '# Finding Other Linux Games


    What you are probably most interested in is finding the big-name commercial games
    in a Linux format. While many are not available for Linux, some certainly are,
    and in this section we want to make certain that you can find them. The following
    list has some wonderful Web sites where you can obtain lots of Linux games, including
    Linux versions of major commercial games such as Quake III and Castle Wolfenstein,
    two names that are likely to be etched in the mind of any avid gamer. The site
    www.lokigames specializes in Linux versions of mainstream games.


