  md: '# **Review Questions**


    +   1.  What does the GIMP acronym stand for?


    +   2.  What does the Oilify filter do?


    +   3.  What does the Freehand Selection tool do?


    +   4.  What does the Eyedropper do?


    +   5.  How do you change settings for the Airbrush tool?


