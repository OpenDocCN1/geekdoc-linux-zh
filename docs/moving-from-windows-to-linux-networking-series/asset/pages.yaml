- pgno: 42
  md: '# # Summary


    This chapter walked you through the installation of Red Hat 9.0 Linux. You were
    shown the steps needed to install Linux successfully. This chapter also explained
    the concept of partitioning and gave suggestions as to how you should partition
    your drive. Finally, each of the major packages was explained, and you were given
    a list of what packages you should consider installing. It is recommended that
    you read this chapter carefully before attempting to install Linux on your PC.


    The installation process requires some practice. The chances are that once your
    PC is up and running with Linux, you will not have occasion to install Linux again
    for quite some time. In fact, you may not install Linux again unless someone asks
    you to help him install it. For this reason, it is a good idea for you to repeat
    the entire installation process once or twice. Once your PC is in use, you will
    have data on it that would be wiped out by a reinstallation. If you want to practice
    the installation a few more times, do it now, before you personalize your PC or
    begin to save any data. If you choose not to practice the installation, you should
    at least read this chapter once thoroughly before you install and review it again
    after the installation. This will help to ensure that you have a firm understanding
    of the installation process.'
