  md: 'command can be quite useful in ensuring that your computer is optimized to
    perform its best. You can see this command in Figure 19.17. However, with later
    versions of Linux using ext3 as the file system, optimization is rarely if ever
    required, so you may not use this command very often.


    ![](img/12d790664598bbf390261087fbe55bbc_396_0.png)


    Figure 19.17: The fsck command.


    # logout and shutdown


    When we discussed run levels and init, you saw that you could use the command
    init 0 to shut down the system. However, many users cannot use the init command.
    It is meant to be the tool of the root user, not all users. How do you reboot
    or shut down the system from the shell if you are not logged on as the root user?
    The answer is to go to KDE and choose the Logout option from the Start menu. However,
    if you are logged on as root or use the su command for superuser mode, there are
    other commands that also will work for shutting down the system. The shutdown
    command does exactly what init 6 does. Just type in shutdown at the shell, and
    the system will shut down. You can also log out using the command logout typed
    in at the shell. logout works for any user, but remember that shutdown will work
    only for root.


    # passwd and su


    You also may need to change the password of the user currently logged on. This
    can be done with the passwd command. If you type in the command passwd, as shown
    in Figure 19.18, you will be prompted to enter a new password. If the system feels
    that this password is too easy to crack, because either it is a standard dictionary
    word or too short, the system will tell you that it is a bad password. You then
    retype the password to confirm it.'
