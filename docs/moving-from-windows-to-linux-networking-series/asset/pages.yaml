  md: '# ## The File Manager


    You might be thinking that we already discussed this in a previous chapter. You
    are correct, we did. However, the File Manager is a very important tool that we
    will be using later in this book, so it seems prudent to go over it again, perhaps
    in a little more detail. The File Manager is a program that is literally used
    to manage files and directories, thus the name. It is commonly used to browse
    your machine''s hard drive, view the contents, open files, create new directories,
    and more. You have probably used Windows Explorer many times to accomplish similar
    tasks. The File Manager in KDE has much of the same functionality as Windows Explorer.
    You can see Windows Explorer depicted in Figure 5.22.


    ![](img/12d790664598bbf390261087fbe55bbc_109_0.png)


    Figure 5.22: The Windows Explorer.


    In all versions of KDE, you can invoke the File Manager by simply double-clicking
    on the small icon on your desktop labeled Home. If you have the most recent version
    of KDE, you can find the File Manager by going to System Tools, then selecting
    More System Tools, then clicking on File Manager. In some older versions of KDE,
    the File Manager for KDE is found by going to Extras, selecting System Tools,
    and choosing File Manager. You can see what the KDE File Manager looks like in
    Figure 5.23.'
  merge: -1
  img_proc: true
- pgno: 110
  md: '![](img/12d790664598bbf390261087fbe55bbc_110_0.png)


    As you probably already guessed, with the KDE user interface, you can use the
    File Manager to do all the tasks you previously did with Windows Explorer. To
    create a new directory (also called a folder) with Windows Explorer, you simply
    went to the drop-down menu File, selected New, and then chose Folder. Creating
    a new directory with the KDE File Manager is not much different. You go to Edit
    on the drop-down menu, select New, and choose Directory. With both Windows Explorer
