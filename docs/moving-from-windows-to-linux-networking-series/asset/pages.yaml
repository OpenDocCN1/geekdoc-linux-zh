- pgno: 420
  md: '# # Advanced Shell Commands


    We have looked at a lot of shell commands in this book. Most were pretty easy
    to work with. You could devote an entire book just to Linux shell commands, so
    obviously we will not be examining all of them. However, there are a few more
    interesting ones that we will take a look at in this section. You may be wondering
    why these commands were held off until now. Some did not fit neatly into any previous
    category. Others are a bit more complex and probably are best shown to you after
    you have had a little experience with shell commands.


    # ## cal


    This is an interesting command and quite useful. From a purely aesthetic view
    point, it probably is the most appealing of the shell applications. The `cal`
    command displays a calendar in your shell. This can be very useful. If you enter
    `cal` at the shell, you should see a calendar much like the one shown in Figure
    21.1.


    ![](img/12d790664598bbf390261087fbe55bbc_420_0.png)


    This command is very easy to use. However, like most shell commands, it has several
    flags you can pass to it if you want. Table 21.1 lists several of the more common
    flags used with `cal`.


    # Table 21.1: `cal` Flags


    | Flag | Purpose |

    | :--- | :--- |

    | -3 | This causes the calendar to show the previous, current, and next month.
    The number three causes three months to be displayed. |

    | -s | This causes the calendar to use Sunday as the first day of the week. |

    | -m | This causes the calendar to use Monday as the first day of the week. |

    | -j | This will cause the calendar to display using Julian dates. |



    There are more flags than this, of course, and you can see them all by entering
    `man cal` at the shell. However, these flags are enough to demonstrate how the
    calendar works differently with different flags. For example, the `cal -m` command
    is shown in Figure 21.2.'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# # Advanced Shell Commands


    ![](img/12d790664598bbf390261087fbe55bbc_421_0.png)


    In Figure 21.3 you can see the past, current, and next month displayed using the
    `cal -3` command.


    The `cal` command may be one of the easiest to use shell commands we have discussed.
    However, it is quite useful and does not fit into any previous category.


    ![](img/12d790664598bbf390261087fbe55bbc_421_1.png)


    # ## grep


    The `grep` command is one of the most widely used commands in the Unix/Linux world.
    It is a search command. It is used to search a file for a particular occurrence.
    You can search for a single character, entire word, sentence, or more. The format
    is quite simple:


    ```

    grep [item to search for] filename

    ```


    If you want to search one of your previously written script files from the preceding
    chapter for the occurrence of the word `else`, you could simply type in


    ```

    grep else scripteight.sh

    ```


    You should see something much like what is shown in Figure 21.4.'
