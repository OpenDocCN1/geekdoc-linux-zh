- pgno: 63
  md: '# # Section II: The Linux Graphical User Interface


    # ## Chapter List


    +   - Chapter 4: System Configuration in KDE

    +   - Chapter 5: Using KDE for Everything You Used to Do in Windows

    +   - Chapter 6: Linux Administration from KDE

    +   - Chapter 7: The GNOME Interface


    If you are used to Microsoft Windows, you are used to the ease of a graphical
    user interface. There are several such interfaces available for Linux. The two
    most popular are KDE and GNOME. This book will emphasize the KDE interface but
    also introduce you to GNOME. In this section you will find out how to navigate
    through the KDE interface, how to administer your system via the KDE interface,
    and how to do many of the common tasks you used to do in Windows. Finally, you
    will get a brief introduction to the GNOME interface.


    After finishing this section, you should be comfortable with KDE. This means you
    should be able to perform basic administrative tasks with KDE, know where to find
    applications you need, and be familiar with a few of the programs that are included
    with KDE. You should also have at least a passing familiarity with GNOME.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# ## Chapter 4: System Configuration in KDE


    # ### Introduction


    Any computer system that you might purchase will require some configuration. Whether
    it is a Windows system, Apple Macintosh, or Linux, you will still need to configure
    it so that it recognizes and uses your hardware. During the installation, most
    operating systems, including Linux, will detect and configure many types of hardware.
    However, you might still need to reconfigure certain settings at a later date.
    Reconfiguration can be required because you add new hardware, change your Internet
    connection, or simply want a different look to your interface. For this reason,
    knowing how to configure your system properly is critical.


    This chapter will walk you through the essential configuration tasks you might
    need to perform in Linux. In this chapter you will learn to reconfigure your desktop
    settings, set up hardware, configure your network, connect to the Internet, and
    more.


    This chapter will focus on using the graphical interface, KDE. If you followed
    the installation instructions in *Chapter 2, “Installing Linux,”* then your machine
    should boot up to KDE automatically. If you choose at some later date to use GNOME
    as your graphical interface, you will find most of the same features, only they
    may be in different locations. Also recall that we discussed what to do if your
    machine has KDE installed but is booting to GNOME or some other interface. Go
    to the Start menu (the large K or Red Hat symbol in the bottom-left corner of
    the screen) and log out. Once you are logged out, you will be at the login screen.
    Find the word *System* at the bottom of the screen and click on it. You can then
    choose which of the installed desktops you want to use.


    > **Note** Throughout this book, the graphical interface we will be concerned
    with is KDE. However, *Chapter 7, “The GNOME Interface,”* will give you a brief
    overview of the GNOME graphical interface.


    Before we get too far into our exploration of KDE, perhaps a brief history lesson
    is in order. The KDE project, which is the primary graphical interface used in
    this book, was founded by Matthias Ettrich in 1996. KDE stands for K Desktop Environment.
    The first version was released in July 1998. The most recent version, 3.1.2, was
    released in May 2003. KDE is simply a modern, user-friendly, graphical desktop
    environment for Unix or Linux workstations. KDE seeks to fill the need for an
    easy-to-use desktop for Unix workstations, similar to the graphical interface
    PC users can find with Microsoft Windows or Apple Macintosh. You can find out
    more about KDE history and get the latest version of KDE at [www.kde.org](http://www.kde.org).'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# ## Desktop Preferences


    Configuring your desktop to be appealing and convenient is a task most computer
    users eventually have to undertake. The more you use your computer, the more important
    it will be to have it configured in a manner that you find convenient and aesthetically
    pleasing. With earlier versions of Linux, those prior to KDE or GNOME, your graphical
    user interface options were limited. However, with recent versions you have a
    very rich graphical user interface, one that you can easily reconfigure and adjust
    to meet your personal preferences. Inside KDE are a number of options for altering
    desktop appearance and behavior. We will start with the simplest and most commonly
    used.


    Just as in Windows, KDE enables you to right-click on the desktop and select Configure
    Desktop. This is one more thing that you will find works in Linux just as it did
    in Windows. You can then set a wide array of settings. This is shown in *Figures
    4.1* and 4.2.


    ![](img/12d790664598bbf390261087fbe55bbc_65_0.png)


    Figure 4.1: Right-clicking to configure the desktop.


    ![](img/12d790664598bbf390261087fbe55bbc_65_1.png)'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'Figure 4.2: Desktop configuration.


    As you can see, the first tab, Desktop, enables you to set what occurs when a
    particular mouse button is selected, what files to display, and how to display
    them. Most people will leave these with the default settings, but you can reconfigure
    them to behave in any manner you think is appropriate or convenient for you. You
    have probably noticed that the Desktop section has several tabs. The second tab
    enables you to set up the appearance of your desktop, including font and text
    color, as shown in Figure 4.3. This tab is very useful if you want to customize
    the look of your desktop. While many users, this author included, stick with the
    default settings, being able to change them is important. Not only can a different
    font make your desktop more appealing, it can also make it more readable if the
    default configuration is difficult for you to read.


    ![](img/12d790664598bbf390261087fbe55bbc_66_0.png)


    Figure 4.3: Desktop Appearance.


    Setting fonts and icons is something you probably are familiar with from Windows.
    You can set all of that using KDE as well. However, KDE offers some features that
    Windows does not. One such feature is the use of multiple desktops. This is a
    feature that many Linux users find to be very useful. You can have more than one
    desktop and simply switch back and forth between them. The third tab on the Desktop
    screen enables you to configure the number of desktops and name them. You probably
    noticed that in the taskbar is a series of squares numbered 1 through 4; these
    enable you to set the various desktops. You can see the number of desktop settings
    as well as the Desktop options in the taskbar in Figure 4.4.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '![](img/12d790664598bbf390261087fbe55bbc_67_0.png)


    We will explore setting different desktops in just a moment. First, we must finish
    examining the desktop configuration. You should also notice a fourth tab, labeled
    Paths. The paths simply tell you where on your hard drive the Trash Bin, Desktop,
    and other items are stored. For the most part you need not alter these settings
    at all. However, if you should need to change the path to trash, the desktop,
    or documents, this is where you would do it. A word of caution here. If you don''t
    have a compelling reason to alter these paths, it is better that you don''t. An
    error could make your Trash Bin or some other item unreachable.


    On the far left side of the screen you probably noticed that you can set the background
    for the desktop. You can even set different backgrounds for each desktop. You
    simply highlight the name of the desktop and set the background. We will set the
    backgrounds for Desktop 1 and Desktop 4 so that you can see how it is done.


    Simply uncheck the Common Background check box and click once on the desktop you
    want to alter. It is critical that you uncheck that box because if you leave it
    checked, it tells KDE to use the same background for all desktops. Next, select
    a mode and color. For our example we will choose Pyramid Gradient with gold and
    blue for the colors, as shown in Figure 4.5.


    ![](img/12d790664598bbf390261087fbe55bbc_67_1.png)


    file://D/I/7278/DDU0028.html (3 von 5) [29.11.2007 13:17:31]'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'Now we will set the background for a second desktop and examine how that looks.
    Simply click once on the fourth desktop, and then choose the Wallpaper tab. Then,
    click the Single Wallpaper button and use the Browse button to find any appropriate
    image on your machine you like. When you finish, it should look much like what
    is shown in Figure 4.6.


    ![](img/12d790664598bbf390261087fbe55bbc_68_0.png)


    Figure 4.6: Setting the background for Desktop 2.


    Now click the Apply button. You should see the background change behind your Desktop
    configuration screen. That should be the background for Desktop 1.


    That brings us the last option on the desktop configuration, that of screensavers.
    This is probably somewhat familiar to you because it is quite similar to selecting
    and configuring screensavers in Windows. You simply select the screensaver you
    want and the number of minutes KDE should wait before launching the screensaver.
    For our example, we will pick six minutes. You then decide whether or not to require
    a password. At this point, your screen should look very much like the one shown
    in Figure 4.7. KDE has a number of different screensavers already in it, and you
    can find other screensavers written for Linux on the World Wide Web.


    ![](img/12d790664598bbf390261087fbe55bbc_68_1.png)


    Figure 4.7: Configuring the screensaver.'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# Desktop Preferences


    At this point, simply click the Setup button to configure the individual screensaver
    you choose. Each screensaver has different options, depending on the type of screensaver
    you selected. For example, the Star Field screensaver enables you to select how
    many stars are displayed and how fast they move.


    As you can see, you have all the options for configuring your desktop that you
    are used to accessing in Windows. You also have a few additional options you probably
    are not used to, since those options do not exist in Windows. One such option
    is the capability to use multiple desktops. You can now switch desktops merely
    by clicking on the number in the taskbar. By default, you have four desktops to
    choose from. This gives you the option of setting up different desktop configurations
    for four different users. Of course, you might simply have multiple configurations
    for the same user to use in different situations.


    Now you have seen how to configure your desktop preferences, establish screensavers,
    and even switch between multiple desktops. This information should enable you
    to configure your KDE desktop in the manner most appealing to you.'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# # Setting Preferences


    In addition to desktop settings, there is a variety of other preferences you might
    want to set. These preferences can be found under the Preferences group in the
    Start menu. Under the Preferences category you will find numerous subcategories.
    The first of these is File Browsing. In this subcategory you can select what files
    are associated with what applications. For example, you might want all files ending
    in a .pdf extension to be opened with Adobe Acrobat Reader®.


    The second subcategory is Information. This category provides a lot of useful
    information regarding various hardware devices in your computer. This will be
    dealt with in some detail in the next section. For now, we will move on to the
    third subcategory, Look & Feel.


    You will notice that under Look & Feel you can set some of the same settings you
    accessed by right-clicking your mouse on the desktop. You can set the desktop
    settings, backgrounds, and even screensavers. However, you also can set a few
    other items here. For example, if you select Taskbar, you have several options
    you can set regarding the look and behavior of your taskbar. These options can
    be seen in Figure 4.8. They include whether to group similar tasks, whether windows
    should be shown on all desktops, and how the mouse behaves when a certain mouse
    button is clicked.


    ![](img/12d790664598bbf390261087fbe55bbc_70_0.png)


    **Figure 4.8:** Taskbar settings.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Hardware Information


    You can find all the detailed information you might need by looking in the Preferences
    category, under the Information subcategory. You can see the various hardware
    options shown in Figure 4.9.


    ![](img/12d790664598bbf390261087fbe55bbc_71_0.png)


    Figure 4.9: Hardware Information.


    We will not delve deeply into these various settings because they depend on a
    thorough knowledge of PC hardware, and that is beyond the scope of this book.
    A good rule of thumb to remember on any computers settings is if you don''t know
    much about it, leave it alone. You are more likely to cause problems than you
    are to improve your system.


    You may wonder why this is even mentioned, since it is given such cursory treatment.
    The answer is twofold. To begin with, should you ever be speaking to a technical
    support person over the phone, he will probably ask about your hardware settings.
    You should at least know how to find them. Second, some readers will choose to
    expand their PC knowledge and learn more about Pc hardware. The PC hardware is
    the same whether you run Windows or Linux. However, most PC hardware books have
    a strong bias toward Windows and will probably tell you where to find these settings
    in Windows but not in Linux.


    # Configuring Network Settings


    Configuring your network settings is something you will probably have to do. Whether
    your PC is connected to a local area network (LAN) or simply connected to a cable
    modem or DSL (digital subscriber line) modem, you will need to configure your
    network settings. There are two ways to configure your network card settings.
    Both are found under the System Tools group, shown in Figure 4.10.'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# Hardware Information


    ![](img/12d790664598bbf390261087fbe55bbc_72_0.png)


    Figure 4.10: Network settings.


    The first method is to go to Network Device Control and manually set all the parameters
    there. The second is to use the Internet Configuration Wizard. In this section,
    we will examine both methods.


    Let us begin with the Internet Connection Wizard. We begin with this option because
    it is the easiest to follow, and because you certainly will want to get on the
    Internet as soon as possible. As with any wizard you have used in Windows, this
    wizard is simply a series of screens that walk you through the required steps
    to accomplish a goal. It is assumed that you have minimal knowledge of the task
    at hand, so the wizard helps you. The first screen of this wizard is shown in
    Figure 4.11. The entire purpose of any wizard is to walk you through some process
    in an easy-to-follow, step-by-step manner.


    ![](img/12d790664598bbf390261087fbe55bbc_72_1.png)


    Figure 4.11: The Internet Configuration Wizard, screen one.


    The first step in this wizard is to select what type of Internet connection you
    have. The list contains several items, and some are more likely to be found on
    the typical machine than others. We will walk through the most commonly used Internet
    connections step by step so that you will be able to set up your Internet connection
    regardless of the network connection type. There are three types we will not look
    at. The first two are the Token Ring connection and the VPN (virtual private network)
    connection. It is highly unlikely that you have either of these in your home,
    and if it is a work environment, you will need your network administrator to assist
    in setting up either of them. Token Ring, in particular,'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# ## Hardware Information


    is an older technology that was popular with certain companies, notably IBM, but
    is not widely used in business any longer. It is also virtually unheard of to
    have a Token Ring network in a home. We also will not discuss the ISDN because
    it is not very uncommon in the U.S., and if it is used in Europe you will need
    to contact your Internet service provider to find out what settings to use.


    Let us begin with the Ethernet connection. Ethernet is the most common type of
    network connection. Most office networks and virtually all home networks use Ethernet.
    Ethernet connections are the basic network cards you probably have seen many times.
    The connection to an Ethernet card is an RJ-45 connection. RJ-45 connectors essentially
    look like rather large phone connectors. In fact, they are very much like the
    telephone connector, except that RJ-45 connectors have eight wires in them, whereas
    the standard telephone connector has four wires. Just for your information, the
    standard telephone connector is called an RJ-11. The RJ stands for *Registered
    Jack*. If you use a cable Internet connection, it probably comes into your home
    and connects with normal coaxial cable (the same cable used for television, round
    wire about 1/4-inch thick with a connector that has a single needle-like protrusion
    in the middle) to a box, and then a network cable (also called CAT 5—category
    5—cable) comes to your computer''s network interface card (NIC). This means you
    have an Ethernet connection. You also are using an Ethernet connection if your
    PC gets to the Internet via a local area network (LAN) such as in an office environment.


    Note If you are not familiar with these hardware terms, remember to look in Appendix
    D, “PC Hardware,” which provides a basic crash course in PC hardware. It won''t
    make you a trained PC service technician, but at least it will make you a computer
    user who understands basic PC hardware and terminology.


    The next screen takes you to a list of the network cards that Linux has detected
    on your PC. You should see your card somewhere on the list. If you do not, your
    card may not be supported in Linux. That means that you will need to contact your
    card''s manufacturer to find out if it supports Linux and, if so, where to obtain
    the appropriate driver for the network interface card. This screen is shown in
    Figure 4.12.


    ![](img/12d790664598bbf390261087fbe55bbc_73_0.png)


    **Figure 4.12:** Selecting your Ethernet card.


    Note You will see the terms network card, NIC, NIC card, and Ethernet card used
    interchangeably in most computer books. They all refer to the same thing.


    The next screen is used to configure your IP address. All computers on the Internet
    must have a unique IP address. Your Internet service provider (ISP) either assigns
    you an IP dynamically each time you log on or assigns you a static IP address
    that is always the same. If the former is true, simply select the option Automatically
    Obtain IP Address Settings with: DHCP. DHCP stands for Dynamic Host Configuration
    Protocol. It means that when you dial up to your ISP or log on to your network,
    an IP address is assigned to your PC automatically from a pool of available addresses.
    If your IP address is permanently assigned, referred to as a static IP, then select
    Statically Set IP Address. You will then need to set the three fields with information
    that your ISP or network administrator gives you. The final screen, shown in Figure
    4.13, simply verifies your settings and lets you apply, cancel, or back up and
    change something.'
  merge: -1
  img_proc: true
- pgno: 74
  md: '![](img/12d790664598bbf390261087fbe55bbc_74_0.png)


    **Figure 4.13:** Confirming your settings.


    That''s it; your network card is set up and ready to go. Congratulations! That
    wasn''t that hard, was it?


    The next most commonly found connection type in homes and small offices is a modem
    connection. If your phone line plugs into the back of your PC, you are using a
    modem. When you select the Modem option on the first screen of the wizard and
    then move forward, you will be presented with a list of modems detected on your
    PC. Like the Ethernet configuration, it is possible that your modem will not show.
    If that is the case, you will have to contact the manufacturer of the modem to
    verify that your modem is supported by Linux.


    The next screen asks you to set modem properties. This screen is shown in **Figure
    4.14**.


    ![](img/12d790664598bbf390261087fbe55bbc_74_1.png)


    **Figure 4.14:** Selecting modem settings.


    The first setting is the Modem Device. Linux refers to all modems as `tty` followed
    by a number. For example, your modem might be `tty1`. If you have two modems,
    you will have `tty1` and `tty2`. If you have more than one modem, you can select
    the one you want to use here. The other two settings, Baud Rate and Flow Control,
    are specific to your modem. The box it came in or the owner''s manual would have
    that information. Next you set Modem Volume to whatever setting you prefer (it
    will work the same either way). Finally, you may notice that the Use Touch Tone
    Dialing setting is selected by default. Very few people have rotary phones these
    days, but if you do, deselect this option.'
  merge: -1
  img_proc: true
- pgno: 75
  md: 'Now press the Forward button, and you are taken to information regarding your
    provider. This is shown in Figure 4.15.


    ![](img/12d790664598bbf390261087fbe55bbc_75_0.png)


    **Figure 4.15:** Your provider settings.


    You can select a particular nationality here, if that is appropriate for your
    situation. Then you enter the phone number your ISP gave you to dial for Internet
    services. You will then put in your provider''s name, and the login name and password
    that your ISP provided. This is shown in Figure 4.16.


    ![](img/12d790664598bbf390261087fbe55bbc_75_1.png)


    **Figure 4.16:** Entering the appropriate provider settings.


    You are then taken to a screen that is identical to the final screen of the Ethernet
    setup. You will see the setting you selected and have a choice to apply the settings,
    cancel the settings, or back up and change your settings.


    Another type of connection you might have is wireless. In the coming years, the
    odds of you using a wireless connection will increase. More and more businesses
    and even homes are going to wireless networks. Most consumer electronics stores
    now sell wireless kits for your home at a very reasonable price. For this reason,
    it is important that you know how to set this up in Linux.'
  merge: -1
  img_proc: true
- pgno: 76
  md: 'The first screen of the wireless setup, shown in Figure 4.17, asks you to set
    various hardware settings for your connection. These settings include the IRQ
    and IO for your wireless network card. Previously we discussed where you could
    find all hardware settings on your machine. You may need to return to that section
    in KDE to find out what the appropriate settings are for your machine.


    ![](img/12d790664598bbf390261087fbe55bbc_76_0.png)


    Figure 4.17: Setting up a wireless connection.


    You also will select what type of adapter you have. There are several that Linux
    supports, and you can click on the drop-down list to see if your wireless adapter
    is on the list. If it is not, you will need to contact the manufacturer. The list
    is fairly large, however, as you can see in Figure 4.18.


    ![](img/12d790664598bbf390261087fbe55bbc_76_1.png)


    Figure 4.18: Wireless adapters.


    As you have guessed by now, regardless of which device you are setting up, the
    wizard always ends by presenting you with the choices you made and giving you
    a chance to apply those settings, back up and make changes, or cancel the entire
    process. Setting up your Internet'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'connect, as you have seen, is not particularly difficult. However, there are
    times when it is not sufficient. For example, if you purchase a new network card
    and install it, you will need to configure it before you can connect to the Internet.


    Fortunately, the Internet Configuration Wizard is not the only way to configure
    Internet or network settings. There is also Network Device Control. This is found
    under System Tools just like the Internet Configuration Wizard. The initial screen
    of the Network Device Control shows any network cards you have, their names, and
    their current status. This is seen in Figure 4.19.


    ![](img/12d790664598bbf390261087fbe55bbc_77_0.png)


    **Figure 4.19:** Network Device Control.


    You will notice the buttons on the right side. With these you can activate or
    deactivate the network device or configure it with a single click. Obviously,
    it must be properly configured before you can successfully activate it. Let''s
    click on the Configure button and take a look at how to configure a network card
    in Linux. When you click on the Configure button, you are taken to a screen such
    as the one in Figure 4.20. The plethora of choices, buttons, and tabs may seem
    daunting at first, but don''t worry, we will walk through all of them.


    ![](img/12d790664598bbf390261087fbe55bbc_77_1.png)


    **Figure 4.20:** The Devices tab of Network Device Control.


    The first tab, Devices, lists the various network cards on your machine and their
    current status and types. In case you were not aware, it is'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'entirely possible to have more than one network card in a PC, although most
    home PCs probably only have one NIC card. The second tab, Hardware, is where one
    goes to add, change, or delete a particular network card. This screen is seen
    in Figure 4.21.


    ![](img/12d790664598bbf390261087fbe55bbc_78_0.png)


    **Figure 4.21:** The Hardware tab of the Network Device Control.


    The last two tabs, Hosts and DNS, are where your configuration takes place. The
    Hosts tab is where you will set the IP address for your network card.


    **Note**     All PCs have what is called a loop back address, which is 127.0.0.1.
    Linux treats this address as an actual physical network card. That way, even if
    you have only one NIC in your machine, you will see two Ethernet devices listed.


    To set the IP address for your NIC manually, select Add or Edit, depending on
    whether you are adding a new IP address or editing an existing one. You will see
    something much like what is shown in Figure 4.22.


    ![](img/12d790664598bbf390261087fbe55bbc_78_1.png)


    **Figure 4.22:** Adding and editing IP addresses.


    If you clicked Add, the three fields will be blank. If you highlight an existing
    Ethernet device and press Edit, the three fields shown will have'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'that device’s current settings. You can then enter whatever IP address and
    hostname you have been assigned by your ISP or network administrator. Aliases
    can be any name or names you select. This is simply a name that should be easy
    for you to recall.


    Virtually all local area networks must use DNS service in order to use the World
    Wide Web. DNS is a networking protocol that translates the URL you enter (such
    as www.chuckeasttom.com) into an IP address. If you are on a network that uses
    DNS, you can enter the settings for it on the DNS tab. These settings will be
    provided by your network administrator. The screen is shown in Figure 4.23.


    ![](img/12d790664598bbf390261087fbe55bbc_79_0.png)


    Figure 4.23: Setting the DNS settings.


    Your network card should now be configured. You can communicate on your local
    network, if you are on one. As you can see, this is not particularly difficult.'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# Internet Settings


    You might be thinking that we already covered this when we went through the Internet
    Connection Wizard. What that wizard did was set up your connection to the Internet.
    However, the various Internet software that you might want to use, such as a browser
    or an e-mail client, will also need to be set. There are a number of Internet-related
    software packages that either ship with Red Hat or can be downloaded for free.
    Many of these will be covered later in this book, but most readers will want to
    be able to surf Web pages and check their e-mail right away. With that in mind,
    we will examine how to configure the default browser (Mozilla) and the default
    e-mail client (Evolution) that come with Red Hat Linux 9.0. That way, you can
    start using the Web and e-mail right away. However, keep in mind that what we
    cover here is just the basics for these Web applications, enough to get you started.
    There also are a number of really useful Web sites in **Appendix A** that you
    can use to expand your Linux knowledge, but of course, your browser will be essential
    to accessing those sites.


    If you are a Microsoft user, you probably use Microsoft Internet Explorer to visit
    Web sites. There is good news and bad news for the reader who is used to Internet
    Explorer. The bad news is that there is no version of Internet Explorer for Linux.
    The good news is that there is a plethora of other browsers you can use (Netscape,
    Mozilla, Opera), all of which are free. In this section we will examine the basic
    configuration of Mozilla. If you do not have Mozilla, you can go to a machine
    that is connected to the Internet and download it from **www.mozilla.org**.


    If you use Red Hat Linux 9.0 (or even an earlier version) and followed the instructions
    in Chapter 2, "Installing Linux," then Mozilla is already on your machine. You
    simply need to go to K, then Internet, and then Web Browser. When you first launch
    Mozilla, it will look much like what you see in **Figure 4.24**. First it displays
    a Red Hat Linux help page. It is probably a good idea to bookmark this page for
    later use. Bookmarks in Mozilla work just like Favorites in Internet Explorer.
    You simply go to the drop-down menu at the top of the browser and select Add Bookmark.
    You can also use the shortcut key Ctrl-D.


    ![](img/12d790664598bbf390261087fbe55bbc_80_0.png)


    **Figure 4.24**: Mozilla’s opening screen.


    The most important thing to learn is how to set up the browser’s home page and
    make certain it connects to the Internet properly. With Internet Explorer, you
    accomplished this by going to Tools and then selecting Internet Options. The same
    thing is accomplished in Mozilla by going to Edit on the drop-down menu and selecting
    Preferences. You will then see something like what is depicted in **Figure 4.25**.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '![](img/12d790664598bbf390261087fbe55bbc_81_0.png)


    You can see that you have a host of settings you can configure at this screen.
    We will not attempt to explore all of them, just the ones you will most likely
    need. On the main Preferences screen you can set how Mozilla starts up, what home
    page is displayed, and what buttons are displayed. You select a home page simply
    by typing it in the Look I n box in the middle of the screen. You can also use
    the page you are currently on by clicking on the Use Current Page button. This
    will cause the URL of the current page to be displayed in the location box.


    If your PC is on a local area network, it is very likely that your network has
    a firewall and a proxy server. A proxy server is a device that hides all the internal
    IP addresses from the outside world. You must go through it in order to connect
    to any Internet resource. In essence, the proxy server is your gateway to the
    Internet and its gateway to you. If you first select Edit from the drop-down menu,
    then Preferences, and choose Advanced and then select Proxies, you will be at
    a screen that looks like Figure 4.26, and you can enter the settings for your
    proxy server. Normally, you will need to enter the IP address of your proxy server
    only into the HTTP Proxy and FTP Proxy boxes. You will also need to enter a port
    number. You can get the IP and port numbers from your network administrator. Usually,
    FTP is on port 21, and HTTP on port 80.


    ![](img/12d790664598bbf390261087fbe55bbc_81_1.png)


    file://D//17278/DDU0031.html  (2 von 7) [29.11.2007 13:17:34]'
  merge: -1
  img_proc: true
- pgno: 82
  md: "If you are not using a proxy server, you will select the Direct Connection\
    \ to the Internet button at the top of the screen. Of course, all of this talk\
    \ of proxy servers may be leaving some readers scratching their heads and wondering\
    \ what in the world a proxy server is. A proxy server is a device that provides\
    \ a barrier between a network and the Internet. You will find a proxy server in\
    \ many, if not most, business networks. The outside world can see only the proxy\
    \ server and cannot see the network behind it. The computers on that network get\
    \ all of their external access through the proxy server and receive only the packets\
    \ that the proxy server lets through.\n\nAnother important setting you will want\
    \ to look at is the History setting. That screen is found by selecting Navigator\
    \ and then History, and you will see something similar to Figure 4.27.\n\n![](img/12d790664598bbf390261087fbe55bbc_82_0.png)\n\
    \nFigure 4.27: History settings.\n\nAt this screen you can choose how long you\
    \ want to keep sites you have visited in your history. You can clear the location\
    \ bar of sites you have entered and clear your history. If privacy is a concern,\
    \ set your History to one day and then clear the location bar and the history\
    \ frequently. This will prevent others from determining sites you have visited.\n\
    \n**Note**\t If your company is using a proxy server, most proxy servers are capable\
    \ of logging every site you visit. You will not be able to prevent this. This\
    \ should make you reconsider visiting any illicit sites from your office computer;\
    \ Big Brother may be watching.\n\nThis should enable you to use your browser to\
    \ navigate Web pages. It probably is a good idea with this browser, or any software\
    \ you are unfamiliar with, to explore and experiment a little bit.\n\nConfiguring\
    \ the e-mail client is even easier. When you go to the Start menu and select Internet\
    \ and select E-mail, the Evolution Setup Assistant will start. You should see\
    \ something much like what is in Figure 4.28. At this point, simply click the\
    \ Next button and get ready to enter your e-mail settings."
  merge: -1
  img_proc: true
- pgno: 83
  md: '![](img/12d790664598bbf390261087fbe55bbc_83_0.png)


    Of course, your e-mail settings will be different from any other user’s. However,
    to assist you in following along, this text used the author’s e-mail settings
    as an example. This also will help should you want to e-mail the author. The first
    screen asks you to enter your full name and your e-mail address. You also can
    connect to a signature file. A signature file can be either a text document or
    an HTML document that contains a signature block you would like to appear at the
    bottom of all of your outgoing e-mails. This screen is shown in Figure 4.29.


    ![](img/12d790664598bbf390261087fbe55bbc_83_1.png)


    The next screen asks you to enter information about your incoming e-mail servers.
    The e-mail server is a machine at your ISP or in your company that handles incoming
    and outgoing e-mail. The overwhelming majority of e-mail servers use Post Office
    Protocol (POP) for incoming e-mail, and it usually works on port 110. POP is simply
    the protocol that computers use to receive e-mail. Some computers use a protocol
    called IMAP. Conversely, all computers use Simple Mail Transfer Protocol (SMTP)
    to send e-mail, and that protocol works on port 25. You will find that there is
    a protocol for every type of communication between one computer and another. The
    e-mail server screen is seen in Figure 4.30. The screens for setting up your SMTP
    server and POP server are identical.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/12d790664598bbf390261087fbe55bbc_84_0.png)


    **Figure 4.30**: Your incoming e-mail server.


    The next screen, shown in **Figure 4.31**, asks your preferences regarding checking
    e-mail. You are asked to indicate how often you want to check for new e-mail and
    whether to leave a copy on the server. This means that even after you read your
    e-mail, it is still on the server. This is usually preferred by people who might
    check their e-mail from more than one machine. If you leave the e-mail on the
    server, you can access it from any e-mail client on any machine. Of course, if
    you get a large volume of e-mail, this volume might exceed limits that your ISP
    or network administrator has set on your e-mail inbox.


    ![](img/12d790664598bbf390261087fbe55bbc_84_1.png)


    **Figure 4.31**: Preferences for receiving e-mail.


    The following screen, shown in **Figure 4.32**, is to set up your outgoing e-mail.
    Recall that we previously mentioned that e-mail is sent using SMTP, which usually
    works on port 25.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '![](img/12d790664598bbf390261087fbe55bbc_85_0.png)


    The next two screens have you enter your e-mail address and select your time zone.
    You are now ready to start using the Evolution e-mail client. In fact, you will
    be taken to the main e-mail client screen, shown in Figure 4.33. In the future,
    when you launch the e-mail client, you will go directly to this screen.


    ![](img/12d790664598bbf390261087fbe55bbc_85_1.png)


    You can see that using Evolution for your e-mail client will be no more difficult
    that using Microsoft Outlook® or Outlook Express®. In fact, the initial setup
    is considered easier by many people. This is just one of many alternative applications
    that were mentioned in previous chapters.


    There is an option you may have noticed, called Leave messages on server. This
    is just a little check box that you either check or uncheck. It simply directs
    the e-mail software to leave the e-mail on the server, even after you have read
    it. If you intend to check your e-mail from more than one PC or e-mail client,
    then you may wish to leave the e-mail on the server. If you don''t, then when
    you log on with another e-mail program, you won''t see any of your e-mails. You
    might think they are gone! However, they were simply downloaded by the e-mail
    client Evolution.


    Note The option of whether or not to leave e-mail on the server is hardly unique
    to Evolution. You are likely to find that option somewhere in almost any e-mail
    client program you may choose to use.'
  merge: -1
  img_proc: true
