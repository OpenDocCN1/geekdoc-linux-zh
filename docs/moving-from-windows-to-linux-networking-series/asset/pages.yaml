- pgno: 335
  md: '# # The Apache Configuration File


    We have changed a few items in the `httpd.conf` file, but we offered no explanation
    of what those items meant. Let’s take just a moment to examine this file closer.
    Also keep in mind that this file is heavily commented. Reading through the comments
    after you are finished with this chapter might be helpful for some readers. For
    now let’s take a look at a few items and what they mean. Table 15.3 will also
    mention some settings we have not worked with. Recall that the `httpd.conf` file
    has dozens of settings, many of them unnecessary for basic Web server operation.


    **Table 15.3: The `httpd.conf` file**


    | Item | Purpose |

    | :--- | :--- |

    | DocumentRoot | This is the root Web folder. It is here that Apache will look
    for Web pages. |

    | ServerRoot | This is the root folder for log files. Apache keeps various log
    files of what is occurring. |

    | Port | This is what port to listen in on. Normally this will be set to 80. |

    | Listen | This is an alternative IP address and port to listen to. This is important
    if you have more than one NIC with different IP addresses and you want both to
    respond to connections. |

    | MaxClients | The maximum number of Web browsers that can simultaneously connect
    to your Web server. |

    | ServerName | The name of your server. |

    | ServerAdmin | This is the e-mail address for the Webmaster. |


    In this case that would be you. This is a very exciting topic. Not only can you
    create your own Web pages with Linux, but you can put them up for the entire world
    to see. You should now be able to set up and run Apache. If you wish to delve
    deeper into the intricacies of the Apache Web server, then it is suggested that
    you begin with **www.apache.org**. After that you might consider looking into
    books explicitly about Apache.


    A few points about Web pages and Web servers. All Web servers by default look
    for the Web page `index.html` or `index.htm`. In other words, if you were to register
    **www.mydomain.com**, when someone typed in **www.mydomain.com**, your Web server
    would look in the document root directory for a file named either `index.htm`
    or `index.html`. This is what you should always name your starting page. That
    page can then have links to any other pages. Also remember that the most common
    error on the Internet is misspelled Web addresses. Always check that before spending
    time checking to see if your server is configured and running properly.'
  merge: -1
  img_proc: true
- pgno: 336
  md: '# Configuring Apache from Within KDE


    Like many things in Linux, you can configure your Apache Web server manually,
    as we have already discussed, or you can use a convenient graphical utility to
    configure and start your Apache Web server. To do this, you go to the Start menu,
    choose System Settings, then More System Settings, and then select HTTP Settings.
    You will then be looking at a screen like the one in Figure 15.7.


    ![](img/12d790664598bbf390261087fbe55bbc_336_0.png)


    The first tab is where you would set the Server Name and server admin settings.
    This utility will then write the values you select into the httpd.conf file. If
    you were trying to test this server for local connection, you would put localhost
    into the text field labeled Server Name. If you were trying to prepare the server
    to go live, you would, of course, put your machine’s actual IP address or URL
    here.


    The second tab, shown in Figure 15.8, is for setting up virtual hosts. A virtual
    host is an advanced feature of many Web servers, and configuring one is beyond
    the scope of this book. However, a simple definition is in order. A virtual host
    is what you have when your machine is host to more than one Web address. For example,
    if your Linux machine were the Web server for an ISP, you might find several customers
    who want Web hosting space and want to register domains for their Web addresses.
    This could be done with virtual hosts.


    ![](img/12d790664598bbf390261087fbe55bbc_336_1.png)


    The third tab enables you to customize the server settings and is shown in Figure
    15.9. Several of these may be unfamiliar to you and are a bit advanced. You probably
    should leave these with the default settings. However, you should note the User
    and Group fields at the bottom'
  merge: -1
  img_proc: true
- pgno: 337
  md: 'of this tab. Your Web server must run as some user with the rights given to
    that user. In this case there is a special user called Apache and a group called
    Apache. The reason for having a separate user and group for your Web server is
    that if you run it as whatever user was logged in, then anyone who hacked into
    your Web server would have all the rights of that user. If you are logged in as
    root, then they would essentially own your system. Even with the separate user
    and group, it is recommended that you generally avoid running your Web server
    as root. It is important to realize that Apache will start as root no matter what
    settings you have. However, it will then change to the user/group you defined
    before it begins responding to requests.


    ![](img/12d790664598bbf390261087fbe55bbc_337_0.png)


    The Performance Tuning tab, shown in Figure 15.10, enables you to adjust items
    such as the maximum number of connections and the maximum requests per connection.
    These settings are not so important in a Web server being used for a very small
    group or by an individual as a hobby. However, if the number of visits to your
    Web server grows and begins to tax the resources of your machine, you might consider
    adjusting these settings.


    ![](img/12d790664598bbf390261087fbe55bbc_337_1.png)


    The specifics of how to adjust performance settings are a bit advanced. If you
    begin to get that much traffic to your Web site, then it is probably time to do
    some more advanced study on the topic of Apache Web server. This chapter is interested
    only in getting a basic Web server up and running, not in equipping you to be
    a Web hosting service!'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# Other Web Servers for Linux


    Apache is, by far, the most commonly used Web server for Linux. It also has a
    Windows version, and it is not uncommon to find Windows machines running Apache
    Web server. If you were to choose a single Web server to study, Apache would be
    the one. However, it is not the only Web server available for Linux. *Table 15.4*
    lists some other Web servers and tells you a bit about them, including where you
    might download them from the Internet. We will not be examining any of these in
    depth because they do not come with the Red Hat installation. However, it is important
    that you be aware that there are alternatives to Apache and know where to look
    for them.


    # Table 15.4: Alternative Web Servers


    | Web Server | Address to Download | Features |

    |---|---|---|

    | Essentia Web | [www.essencomp.com/](http://www.essencomp.com/) | High-performance
    HTTP/1.1 1–compliant multithreaded server. Supports thousands of virtual servers.
    Browser-based server management. Access control on each directory, based on users
    or groups. Built-in Java servlet and JSP engine |

    | Abyss | [www.aprelium.com/abyssws/](http://www.aprelium.com/abyssws/) | Abyss
    Web Server X1 is a free personal Web server available for Windows and Linux operating
    systems. It supports HTTP/1.1, CGI, Server Side Includes (SSI), custom error pages,
    and user access control. It also has a remote Web management interface that makes
    its configuration as easy as browsing a Web site. |

    | Dune | [ftp://metalab.unc.edu/pub/Linux/apps/www/servers/server](ftp://metalab.unc.edu/pub/Linux/apps/www/servers/server)
    | This is a small, easy to use Web designed for personal use, not commercial use.
    The server itself is less than 300 bytes, which means it is quite small and takes
    up virtually no appreciable amount of hard drive space. |



    As you can see, you have a number of choices when it comes to setting up a Web
    server on your Linux machine. While Apache is the most common choice, it is not
    the only one. By this point in this book you should begin to realize that this
    is what the open source movement is all about, choice. The idea is that you should
    have several choices, and you pick the one you like the best.'
  merge: -1
  img_proc: true
