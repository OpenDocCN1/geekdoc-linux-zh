  md: 'K Desktop Environment. A commonly used GUI for Linux.


    **kernel**

    The core of an operating system.


    **LAN**

    Local area network.


    **Lilo**

    A commonly used boot loader for Linux.


    **mbr**

    Master boot record, which is the first sector of the disk; this is the sector
    that the BIOS reads in and starts when the machine is first booted.


    **mkdir**

    This makes a new directory.


    **mv**

    Moves or renames files or directories.


    **Mozilla**

