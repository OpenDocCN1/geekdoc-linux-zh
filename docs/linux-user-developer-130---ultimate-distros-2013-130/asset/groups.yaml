    \ (ACL) 来永久拒绝来自该 ISP 所有者的访问，或通知管理员攻击。\n\n## 12 接下来是什么？\n\n由于我们使用常用的用户名 root，不要让你的管理员面临风险。此外，我们使用的用户名\
    \ (admin) 完全没有权限，所以自我保护更安全。\n\n你可以编写脚本来管理日志文件并将你需要的信息发送到远程 syslog 服务器。\n\n你不应该忘记轮转\
    \ cisco 日志。你应该在 /etc/logrotate.conf 中为其添加条目。当你开始探索它时，会发现 syslog 服务有很多功能。\n\n##\
    \ 13 额外脚本\n\n上面的脚本调用 failed.perl，它读取 cisco 日志，搜索登录尝试并统计每个 IP 的失败登录次数。\n\n运行脚本产生了我们我们系统的输出：\n\
