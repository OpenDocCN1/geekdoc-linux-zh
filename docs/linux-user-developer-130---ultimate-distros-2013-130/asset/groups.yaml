    # How to create a basic rule


    All rules are added in the same way, just add and modify each rule to fit yours.
    Click the left ''+'' symbol from the Rules page to start creating one. We can
    add below as needed.

    Set action to allow (unless you want to set up a rule to block traffic). Choose
    your source (WAN, LAN). Choose your protocol to use (TCP, UDP but things like
    DNS require UDP). Set destination to OPT3. Select the destination using interfaces
    for external traffic (WAN) or subnet or address, depending on your requirements.


    Setting destination is straightforward: you can choose the destination either
    using the drop-down menus or enter your ranges (for now, just select HTTP). Using
    multiple ports is common.

    One set of rules defines for both networks is both HTTP and HTTPS rules for browsing.
    Name it ''allow all''. As the rule name, this drops all traffic. This makes no
    escapes out of the network that you need to define. To do this, just set a rule
    for each action, networks and port ranges to any TCP/UDP on the protocols. For
    this however


    # No need for multiple rules – just one can be used to ensure correct ports are
    opened


    # Aliases make life easier


    Aliases allow you to group ports. As you name them, lately you can use aliases
    in your rules that can refer to groups of items. An example could be used for
    ports. In one alias, no need for multiple rules as one can be used to ensure correct
    ports are opened!

    From the menu, select Aliases Use it on the right. Implement HTTP and HTTPS together,
    give it a name like Web_browsing_ports – ensure it is correct. Select ports from
    the Type drop-down. Hit the


    with the bottom ports and add 80 in the port and HTTP. To add HTTPS, click the
    ‘+’ button, use port 443 and apply changes. Aliases are not limited to ports,
    but can also be used for hosts and networks. To implement an alias, select the
    alias (that has been created) in the rule type Port drop-select and then the name
    of the alias. If the alias name changes the rule is re created. Similar rules
    can be created between networks. An example would be SSH, implement it this same
    way


