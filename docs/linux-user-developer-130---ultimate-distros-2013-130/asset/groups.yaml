    ### 缺点

    - 主体昂贵、App 好、套件和扩展器价格高


    Russell Burns


    # 总结


    你认为这个值值吗？如果你在家里一个尴尬的角落设置了家庭办公室，那么 Wi-Fi 范围、以太网端口和电源插座会让它物超连城。


