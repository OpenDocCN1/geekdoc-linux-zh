    # News

    The latest in the Linux community


    ## OPEN SOURCE


    ## What can Rapiro do?


    ![](img/42a435dd97fa37bf0839d8abe967b91b_6_0.png)


    ### ARTICULATE

    Using the Arduino controller, Rapiro can be programmed to perform simple tasks.
    It has enough fidelity in its fingers to hold a pen, and can walk around


    ### SENSE

    Rapiro will be able to see and hear its owner through optional Raspberry Pi camera
    and microphone upgrades - it already understands some speech


    ![](img/42a435dd97fa37bf0839d8abe967b91b_6_1.png)


    > “This project started with two keywords in mind: 3D printing and the Raspberry
    Pi”


    ### COMMUNICATE

    With a speaker attached and the right software, Rapiro can talk to people. It
    can also be connected to the Internet of Things to post updates to Twitter and
    such


    ![](img/42a435dd97fa37bf0839d8abe967b91b_6_2.png)


    # Your source of Linux news and views


    ## Contact us...

    Register and post your comments... Email directly... www.linuxuser.com/forum/
    linuxuser@imagine-publishing.co


    ## OpenSource

    The Rapiro robot was initially conceived due to two popular subjects, according
    to Ishiwatari: ''At first, this project started with keywords: 3D printing and
    the Raspberry Pi. Both of these interested me around the same time. So, I decided
    to develop a robot (Rapiro) as a way to make use of both.''


    using Arduino, with an eye to reuse the source code for demo software, and even
    give people freedom to build it themselves. ''I believed that the Raspberry Pi
    and Arduino were both globally popular and useful,'' Ishiwatari says the move
    to open source, ''I was not trying to get a free ride on open source. The current
    demonstrations are running on Raspberry and Arduino IDE, and I believe we are
    using only Raspberry and Arduino to do this. We are also using pocketsph for speech
    recognition.''


    From here, the robot developed into a mostly open source project — running on
    the Pi,


    The Rapiro is controlled by both the Raspberry Pi and a control board - but what''s
    the reason? ''The services are all controlled by the control board, which is Arduino-compatible,''
    Ishiwatari explains, ''The Raspberry Pi is running the AI Pi Camera, microSD,
    microphone, and other parts that we need''


    Hardware is only one part of the equipment, software needs to be implemented to
    get the robot to work. Again, all the Ishiwatari tells us what consists of...


