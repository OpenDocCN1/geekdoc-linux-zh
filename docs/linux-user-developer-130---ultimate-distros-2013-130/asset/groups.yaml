    # 最佳用于


    ## 教育


    ## UbuntuStudent


    UbuntuStudent 创建于 2010 年，是一个 64 位发行版，重点侧重于中学和高等教育的教育用途。


    将每位学生的需求都置于指尖，UbuntuStudent 让学习变得几乎异常简单。


    近年来，Linux 增长的一个主要领域是教育市场，特别是在那些学校可以低预算轻松配备笔记本电脑的发展中国家。Ubuntu 的目标是更进一步，提供一组预装的针对学生的特定软件包。2010
    年，UbuntuStudent 是一个仅限 64 位的发行版——排除了那些尝试为旧硬件寻找用途的用户——基于 Debian 和 Ubuntu 的混合体，并包含了通用计算的软件包（常见的媒体播放器、网络浏览器和办公套件）以及针对教育市场的软件包，例如
    Zotero 研究助手和 Keynote 笔记。另一个补充是 Artha，这是一款开源论文管理器，它允许通过 Worksheet 数据库对任何文本进行高亮和分析。


    随后，Stephen Edouard 创立并支持了这一真正关于软件的项目——它允许一些选择，例如在桌面环境中包含 LibreOffice。即使 Steve
    声称他们设计为仅使用从源码获取的“必要”内容？


    由于这些细微方面，今年的最新版本——“Plato”（已于今年 6 月发布）已经过时了，不值得尝试，尽管它似乎在 Linux 兼容工具和安装到其他发行版方面有一些实用的想法。


    ## Puppy


    对于寻求翻新设备的机构来说，Puppy 的低要求意味着它必须有一个发行版。


    ## Eubuntu


    Ubuntu 的一个分支，提供多种教育用途，并专为 Linux 服务器环境设计。


    ## OLPC OS


    作为笔记本电脑项目的一部分，基于 Debian 的 OLPC OS 为学校教育提供了良好的界面。


    ![](img/42a435dd97fa37bf0839d8abe967b91b_29_0.png)


    # 最佳用于


    ## 老旧或回收的计算


    ## 竞争者


    ## Puppy


    它不是那种极其华丽的操作系统，但 Puppy 让最旧的 PC 焕发生机。


    Puppy 的设计考虑了旧式和移动硬件。它速度快，意味着高性能和低开销。


    ## Damn Small Linux


    Debian 紧凑版，Damn Linux 仅需 500MB 的 ISO 镜像，并支持所有 4 位系统。


    ## Debian


    最老的发行版之一，Debian 理论上除了基于 386 的系统外，无胜一切。


    ## Tiny Core Linux


    Tiny Core Linux 仅重 12MB，是一个基于 TIFT 和 KLVM 的完整图形环境。


    Puppy Linux 由 Barry Kauler 创立，从未打算与 Linux Mint 和 Ubuntu 等大型发行版竞争。它构建在 Debian Ubuntu
    之上，作为一个轻量、简单的平台，允许用户无需麻烦即可完成任务。


    因此，Puppy 是那些拥有旧废弃硬件的极佳选择。Puppy 可以进行长期支持，但从 2.6 版本开始，它切换到了最新的轻量级网络浏览、文字处理、电子表格、艺术和电子邮件应用程序，并在小于
    140MB 的尺寸下付出了惊人的努力。


    结果是，可以安装一个带有通常用于 Linux 的应用程序的用户友好操作系统。对于较旧的现代系统，Puppy 的表亲 Puppy 包含一个内核——内置系统可以在网络上运行，也可以在没有存储的情况下运行，或从
    USB 或旧硬盘上从 RAM 启动。


    即使对于那些没有旧 PC Linux 的人，Puppy 也值得一看。它的轻量级特性意味着它和世界上最好的发行版一样快，且容量更大——以增加系统要求为代价——可以从
    Ubuntu 和 Racy 版本中选择。


    对于仍然依赖 Windows 系统的用户，Puppy 是双启动的极佳选择，带有一个 Windows 安装应用程序，并能够在非常有限的存储空间中运行。


    30 www.linuxuser.com


    # 展望 2014 及以后


    回望 Linux 世界的过去 12 个月很容易，但未来如何呢？


    短期内的事情很容易预测：Linux Mint 可能会继续是最流行的通用发行版，而 Ubuntu 获取用户的增长速度将与树莓派相当。


    然而，市场正在寻找更长期趋势。一种日益增长的趋势是，大多数发行版试图获得独特的卖点，使其脱颖而出——现在较少因为某个特定的独特功能或应用程序而选择某个发行版了。


    因此，发行版采取自主开发路线变得越来越普遍。Elementary OS 3 是一个关键示例，它尽可能使用自定义编写的应用程序以及如网络浏览器等更多软件的项目。在这种极端环境之外，其他情况依然存在。Ubuntu
    正在将显示管理技术从 X 阶段迁移到 Mir 服务器，而 Fedora 变得更适合专业工具市场。


    从长远来看，Linux 可能会变得比竞争对手日益多样，这无疑会导致更多新发行版的诞生，每个版本都旨在提供所有可能世界中最好的部分。我们在 Linux 历史中见过的一个循环正接近中点，新发行版将在未来二到三年内发生爆发。


    然而，下一次转变将转向低成本计算，而专有操作系统供应商被得措手不及。Apple 意识到树莓派将出数百万台。


