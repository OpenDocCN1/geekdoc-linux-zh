    # No spam


    My ISP has had of occasional flagging of my emails as spam. This is extremely
    inconvenient although hasn''t luckily caused any serious issues yet. To try and
    counteract this before anything else, I decided to use EvespeGlu to send outbound
    SMTP emails.


    However, I''m not sure of what it''s called when the server must send outbound
    emails by looking up the target domain''s MX record instead of simply forwarding
    emails to a specific (each ISP''s) SMTP server.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_90_1.png)


    I guess the letter is a store-forward and ''relay'' MTA, but what''s the result
    for a full-fledgedged MTA, what that will look up MX records directly?


    Hannah Smith


    Running your emails through a web client like Gmail might help you down on mislabeled
    spam


    91. linuxux.co.uk'
