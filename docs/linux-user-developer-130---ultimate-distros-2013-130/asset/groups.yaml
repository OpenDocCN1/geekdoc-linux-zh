    # 开源


    您的 Linux 新闻与观点来源


    # 开源专栏


    ## JON MASTERS


    Linux 今日宣布发布了 3.11-rc1 内核，指出这是在早期发布周期中发布的，在该周期内允许某些更改。根据 Linux 的说法，这次合并窗口比 3.10
    小，但我们实际上为新代码提供了更多特性（实验性驱动程序）。Lustre 是一个为了扩展而设计的文件系统，终于开始合并入内核核心。随后的 RC2 版本添加了“未命名临时文件”（TMPFILE），我们将在本期中讨论——以及一个晚期更改）


    在 3.11-rc1 中，合并了两个特别值得的特性：用户空间追踪、新的延迟查询，以及一个新的 /proc（文件系统 API），用户（或程序）可以通过它请求延迟。未来所有对运行内核代码和数据的页（内存块）的更改将通过用户空间追踪来实现。


    低延迟查询是 3.11 的另一个特性。对网络吞吐量有特殊需求的用户（例如，股票市场）可以通过内核以性能损失为代价，换取更低的延迟。


    Lustre 在不同层面都有所有权变更的历史，包括学术研究人员、独立公司、太阳微、甲骨文（Oracle）和英特尔。由于 Lustre 被用于 TOP500
    超级计算机，我们将观察近期对开发和上游投入是否会带来更广泛的应用。


    Jon Masters 是一位深耕 Linux 18 年的内核黑客，他在 33 岁时才上大学。他住在马萨诸塞剑并在一家大型非营利机构工作。他每周发布一次邮件列表摘要。


