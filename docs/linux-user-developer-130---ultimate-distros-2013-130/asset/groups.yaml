    ## 使用命令行


    要在 Linux 中建立坚实的基础，掌握良好的命令行知识至关重要。我们回答了 14 个最常见的问题……


    在本文中你将找到 14 个实用的 Linux 命令行技巧和技巧——以方便的问答形式呈现——旨在为初学者提供价值信息。


    例如，你可以删除 Linux 命令/二进制文件、更改系统配置文件、更改用户密码、修改网络设置、更改防火墙等。这就是为什么 root 如此强大的原因。


    这里有一些简单的方法，可以验证你是否不小心登录了 root 用户：


    > **注意：** 本文以 Ubuntu Linux 为参考，所有示例均在 Bash shell 中经过测试。


    -   我是 Linux 新手。专家建议：无论你是否过，永远不要以 root 身份登录。


    由于你是 Linux 新手，你应该做的第一件事是创建自己的用户。专家说，你不应该以 root 身份登录（除非绝对必要）。


    > UID（用户标识）是一个正整数，对于 Linux 系统上的每个用户都是唯一的。root 账户的 UID 为零。运行命令 `id` 来检查它是否为零。


    root 是可以执行系统上几乎任何操作的用户账户。该用户默认存在于每个 Linux 发行版（包括 Ubuntu）中但在但在之前需要激活。


    root 的家目录是 /。以 root 登录后，如果你在命令行看到这个，绝对意味着你以 root 身份登录了。


    由于 root 账户拥有无限权限，以 root 身份登录时你可以在 Linux 系统上做任何事情。


    通常，root 账户的命令行提示符以 ''#'' 开头并 ''$'' 结尾。如果你的命令行提示符看起来完全如此，那么你就以 root 身份登录了。


    whoami 命令打印与登录账户关联的用户名。如果返回 ''root''，说明你正以 root 身份登录。


    > **注意：** 要了解更多关于 sudo 和 su 的信息，请阅读以下文章 – linuxbook.com/sudo-vs-su-in-ubuntu/


    ## 常见问题 (FAQ)

    ## 你最常问的问题


    有时我从命令行启动一个程序，提示符会被阻塞，直到我关闭它。每当你在 Linux 中运行命令时，在命令完成之前命令行提示符都不会释放。一个命令可能需要几分钟，取决于你正在操作的内容。例如，如果你尝试运行一个大型文件系统，耗的时间可能比尝试查找简单目录要长得多。与高质量电影相比，一个小文本文件会很快完成。


    现在，要检查它是否在后台运行，请使用 ''jobs'' 命令。


    问题 2：如何在后台运行命令？


    ```

    $ jobs

    & running

    & binary

    ```


    问题 5：如何加快我在 Linux 中的工作？


    观察显示 ''binary'' 及其状态的输出。要将其带回前台，使用 ''fg'' 命令。


    这里有几个命令行快捷键：在操作命令时，你可以将光标移动到命令的开头或结尾。传统方法在这些情况下非常慢。替代方案是按 Ctrl+A 回到命令开头或按 Ctrl+E
    回到命令末尾。


    ```

    /binary

    ```

    所以，你可以看到命令执行回到了前台。


    在命令行中为现有文件或目录输入名称可以使用 Tab 键来加速。只需输入前几个字符并按 Tab 键，它就会补全名称。如果有多个同名文件，按两次 Tab 键显示所有选项。


    有时用户可能不想在后台运行命令以继续在终端进行其他工作。有多种方法可以实现这一点：


    -   使用 ''&'' 执行你的命令以便在后台运行。

    -   要将后台命令带回前台，使用 ''fg''。

    -   将后台命令置于后台，使用 ''bg''。

    -   如果有多个命令在后台运行，你可以使用 ''jobs'' 命令（列在 ''jobs'' 的输出中）将特定命令带回前台。

    -   如果你想停止正在运行的命令，按 Ctrl+Z 挂起它然后使用 ''fg'' 或 ''bg'' 将其推到后台。例如，如果一个名为 ''binary''
    的可执行文件无限运行：


    ```

