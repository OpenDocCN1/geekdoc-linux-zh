    Wi-Fi 网络。然而，电力线虽然没有缺陷，但仍然昂贵（我们正在测试的套件也不例外）。此外，适配器没有直通插座，它们会占用电源，导致你急切需要插电的最后一个设备没有电源。在这方面，它并不特别经济；或者说电力线技术以敏感著称，这意味着我们不能随心所欲地插入——当你将它们连接到四位扩展线时，它们可能会失效或无法工作。实际上，只要它们靠近墙壁插座通常是没问题的，但偶尔在某些家里也会这样。Devolo
    dLAN 500 AV+ 起套件的价格为 140 英镑，两个 AV 适配器的价格为 89 英镑，用于连接许多其他电源插座。它的核心是在家中任何地方提供 500Mbps
    的连接，优于目前无线-N 标准的 300Mbps 的最高速度。


    AV+ 套件中的“基础”单元和“扩展器”都提供直通插座，允许你直接插上而无需牺牲插座空间。在测试中，我们将“基础”单元连接到墙上和一个六位扩展插板，配备了墙壁以及各种电视、机顶盒、游戏机和数字电话——一切都符合预期。


    虽然这已经足以向即使是最狂热的电力线检测者推销该套件的优势了，但一些额外功能即将登场。只需按方便的方式设置套件；对于 Wi-Fi 名称建议，Devolo 的新套件还考虑了“扩展器”另一侧的
    Wi-Fi 设置。对于任何网络配置，它启动其双无线接入点——理论上，允许你将 Wi-Fi 网络扩展到房间，即使是房屋的另一端。结合“扩展器”单元上至少三个以太网口，你就有一个极其强大的电力线解决方案，可以赢得


