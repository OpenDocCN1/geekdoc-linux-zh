    Ctrl+L 清除屏幕并返回提示符。使用鼠标进行复制粘贴操作并不总是可能的。在行上进行快速编辑可以确保你的光标位于文本开头，然后可以使用 Ctrl+V 进行粘贴。你可能想运行你最近执行的一个复杂/长命令。通常我们使用鼠标向下和向上滚动。要搜索命令，按
    Ctrl+R 并开始输入你正在查找的命令名称。如果你仍然没有得到结果，尝试按 Ctrl+R 循环查找（img/42a435dd97fa37bf0839d8abe967b91b_52_0.png)。


