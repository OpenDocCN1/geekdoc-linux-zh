    使用忙循环、轮询新到达的网络，而不是等待其传统的拆分：Linux 通常使用中断驱动的 I/O，这对于小流量来说会成为性能瓶颈；然而，在高流量情况下，中断驱动的
    I/O 可能不够，切换到频繁的轮询算法，并通过新的接口应用程序调用来指定请求（poll）系统调用，以便内核可以检查新到达的调用进行即时处理。


