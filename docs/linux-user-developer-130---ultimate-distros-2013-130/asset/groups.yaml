    # 构建你自己的专业级防火墙


    使用 pfSense 创建多网络硬件防火墙


    ## 教程


    与之前相同，只需选择 `WIRELESS`（无线）作为源，并将 `LAN`（局域网）网络作为目标。允许通过端口 22 SSH 连接到别名（aliases）中定义的框以外的任何设备。规则越具体越好。你还需要对希望应用相同规则的
    LAN 进程进行限制。要防止一个网络通过特定端口和协议与另一个网络通信，请在规则中使用 `NOT` 选项。例如，如果你允许浏览但将目标设为 `LAN`，那么你将无法访问网络上的任何
    Web 服务器，与互联网隔离开。


    点击 `Traffic Shaper`（流量整形）上的 `Enable`（启用），选择任何允许/阻止的协议。编辑准备好的设置并点击 `Next`（下一步）。在
    `Finish`（完成）时根据需要配置预设选项。你可以对某些应用程序执行相同的操作，例如 DNS、VNC 等。点击 `Finish`。将规则移动到 `Traffic
    Shaper` 菜单并选择 `Remove shaper`（移除整形器）。


    ![](img/42a435dd97fa37bf0839d8abe967b91b_36_0.png)


    | 防火墙：别名 (Aliases) | 名称 (Name) | 描述 (Description) | 类型 (Type) | 地址 (Address) |

    | :--- | :--- | :--- | :--- | :--- |

    | WiFi | 无线网络 | 网络 | 192.168.1.0/24 |

    | LAN | 局域网 | 网络 | 192.168.1.0/24 |

    | UDP | 用户流量 | 网络 | 53 (DNS) |

    | TCP | 用户流量 | 网络 | 21 (TFTP) |

    | TCP | 用户流量 | 网络 | 3389 (MS RDS) |

    | TCP/UDP | 本地流量 | 网络 | |


