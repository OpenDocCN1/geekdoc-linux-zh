    top of the back comes away so you can slot your micro SIM and microSD card in
    place. The Fonepad comes with 16GB of internal storage and 15GB of free space
    is out of the box. It''s good enough to be on with until you get hold of a microSD
    card.


    Ports and connectors are the usual, run-of-the-mill sorts. Hearst and USB-on,
    the power and volume rocker on the turned curved edge could be a little bit protruding
    so they are annoying. There is no NFC or MHL, but there is. The absence of the
    latter will limit your ability to use the Fonepad as a full-media device, which
    could be a drawback.


    More often than not for the lack of NFC or MHL is the lacking stretchy screen.
    With 800x800 pixels it does for itself, and it has good viewing angles, especially
    once compared to the Nexus 7. But below par, lately there is a slight air gap
    between the display panel and the glass. This has been eradicated from most modern
    phones and tablets.


    Interestingly, Asus has for an Intel processor inside the Fonepad. Its 1.2GHz
    single-core processor seems pretty well, but it''s not as fast as some of the
    common ARM-based processors. Intel''s processor uses ''Hyper-Threading'' technology,
    which enables the processor to handle multiple tasks simultaneously as well as
    multi-core CPUs. We found that the Fonepad, running Android 4.1, runs smoothly
    during our testing,


    Asus has pre-installed a number of apps to bolster Android. Some, like MyPainter,
    a drawing app, could be replicated by others from the Google Play Store and it
    is annoying that they can''t be deleted to free up any of internal memory. Others,
    like Asus Spidlend, are also useful. We dislike the display''s colour but we found
    these help us make up for the slightly negative feeling about the screen.


    There is a range of pop-up apps which includes a calculator, camera, also memo
    and more. We like these. It allows us to use Asus to make photo-stories but the
    screen of the Fonepad is an imperfect 1.2megapixel front-facing screen, so your
    creative touch might not follow freely anyway.


    > Sandra Vogel


