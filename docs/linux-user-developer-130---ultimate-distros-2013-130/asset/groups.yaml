    \ 还提供了更多选择\n\n搜索功能对于查找应用程序和文档都非常好用\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_79_0.png)\n\
    \n设置在结果中单独显示，可以快速访问某些选项\n\n蓝牙：开启和关闭蓝牙并连接你的设备\n\n为你的设备着色，例如显示器、摄像头和打印机\n\n详情视图：关于你系统的信息\n\
    \n![](img/42a435dd97fa37bf0839d8abe967b91b_79_1.png)\n\n# 发行版\n\n# 最适合：前沿特性\n\n\
    # Fedora 19 薛定谔的猫\n\n最低配置：CPU 1 GHz 内存 1GB 存储 10GB\n\n在经历了长期延迟且充满争议的 Fedora 18\
    \ 之后，最新版本的 Fedora 表现究竟如何？\n\n著名的薛定谔的猫是历史上在文化中被误读的流行之一——就像周王试图挡住洪水，或者比尔·盖斯说 Windows\
    \ 已经足够了。薛定谔的实验是为了解释量子力学的某些解释如何违背直觉。虽然这并不是因为互联网，但它某种程度上反映了人们在过去几次迭代中对该发行版默认状态所产生的问题。多年来，GNOME\
    \ 一直快速背离传统的桌面隐喻，其更新背离了鼠标和键盘的工作流。\n\n来自 Fedora 18 的 Anaconda 安装程序为了更美观的体验限制了一些选项。该发行版也并不特别稳定，系统问题让某些人感到头疼。在\
    \ Fedora 19 中，即刻问题得到了解决，列表上还有新问题吗？\n\n# 升级的安装程序\n\n新的安装程序比以前更好，新的 3D 打印功能是一个很棒的增项\n\
    \n# 缺点\n\n仍然在剥离一些引起问题的争议性前沿功能\n\n你在 Fedora 19 中体验到的第一件事就是经过升级的安装程序。硬件识别感觉良好，但对分区和编辑存储位置的控制并不多，这正是人们在\
    \ Fedora 18 中遇到的问题。然而，操作方法并不直观。想要还是活着：最新版本。\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_80_0.png)\n\
    \n# ## 对分区和存储位置的编辑有了得多的控制\n\n与其他图形化工具一样，你可以选择你想要使用的硬盘；然而，选择推荐位置意味着你必须开始“回收”空间。这可以通过调整现有分区或从头开始创建自己的分区来实现，否则最终将无法释放所有需要的空间。现有的交换\
    \ 分区会被忽略，19 变得更容易管理了。在开始创建根分区或软件之前就可以开始，节省了时间，但这清楚地表明这个新版本还没有准备好，在某些方面还需要更多时间。还有经典的搜索结果，但它们之间没有了必要的分割，也没有包含亚马逊的广告。\n\
    \n### 保持更新\n\n桌面也与官方术语“软件”（Software）包管理器分离了，正如所有应用程序一样，这使得访问所有不同的选项变得更容易，尽管有三套额外的软件需要更新。至于其中一个，轻量级的\
    \ XFCE 和 LXQt，以及像 Cinnamon 和 MATE 等桌面在仓库中可用。在 GNOME 上工作要容易得多，所以你不需要下载。\n\n###\
    \ GNOME 3.8\n\n如果该发行版要根据 GNOME 的简单性获得支持，那它做得很好，GNOME 3.8 相比 3.6 有许多重大变化，尽管在许多方面它被“精简”了。至于新界面，需要一些时间来学习使用\
    \ GNOME。值得肯的是，随处启动搜索是一个加分项，而且一直如此。如果这应该是大量工作流的益处，那么搜索功能比周围更快，并且现在已经升级到在你的搜索中包含一些结果。这是\
    \ Unity 相同功能之间的一种混合体。\n\n该发行版在某些方面比 Fedora 18 更修复，但在其他方面，我们遇到了一些明显的缓慢和微小的图形错误。对于部署之前可能需要做的，Fedora\
    \ 并不是最好的，尤其是与之前的版本相比。对于没有遇到问题的 Fedora 18 用户来说，这是一个非常好的升级；对于早期迁移的用户来说，这并不需要担心。盒子只包含了波动——而且对于那只猫来说并不好。\n\
    \n# 评\n\n# Simplicity Linux 桌面 13.7\n\n# 新功能：基于 Puppy Linux • 切换到 LXDE • Gs 包管理器\
    \ • Firefox 22.0 • 原生 LibreOffice\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_81_0.png)\
    \ # 发行版\n\n# Simplicity Linux 桌面 13.7\n\n# 最适合：旧硬件\n\n最低配置：CPU 1.7GHz 双核 内存1GB\
    \ 存储 400MB\n\n这个轻量级发行版是名其实虚，还是引起了困惑数组？\n\n基于 Puppy Linux，Simplicity 是一种运行在旧和现代硬件上的小型轻量发行版。Simplicity\
    \ 桌面 13.7 是第一个基于 Puppy 使用 Cairo 或 LXDE 的版本。这是一种回归基础的用户界面，这意味着 Cairo-Dock 被标准的\
    \ LXDE dock 取代了。我们在 GNOME 2.x 时一直对 LXDE 有青，所以对它的包含感到相当满意。\n\n### 引入 Gs\n\n13.7\
    \ 还为包管理带来了变化，从 Puppy 包管理器变为 Gs。团队指出，这种变化旨在改进处理依赖的能力。事实是 Apt 包管理器在这一方面做得更好，但我们许多软件包无法正常安装。我们无法弄清楚为什么某些软件包没有安装，但最可能是因为\
    \ Gs 在第一次提到依赖处理时没有正确处理。对于 13.7，Simplicity 已从 Cairo 移动到 LXDE。Cairo-Dock 消失了，开发团队没能及时赶上\n\
    \n# 优点\n\nSimplicity 是一种运行在旧硬件上的小型轻量发行版。\n\n# 缺点\n\n软件管理存在问题；与竞争对手相比成就有限\n\n#\
    \ 评审\n\n# Simplicity Linux 桌面 13.7\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_82_0.png)\n\
    ![](img/42a435dd97fa37bf0839d8abe967b91b_82_1.png)\n![](img/42a435dd97fa37bf0839d8abe967b91b_82_2.png)\n\
    ![](img/42a435dd97fa37bf0839d8abe967b91b_82_3.png)\n\n默认桌面整洁简单。然而，控制面板并不特别易读。Simplicity\
    \ 13.7 拥有更更新的 Firefox（版本 22.0）；遗憾的是，连接性的缺失表明了发行版的稳定性。由于许多 Puppy 发行版往往受旧版本软件包的困扰，Simplicity\
    \ 团队投入了大量精力为用户带来更新的选择。Firefox 带有 22.0 版本（平均 Puppy 发行版为 18.0），而 LibreOffice 5.2\
    \ 已经过时。我们看到 Skype（运行版本 4）非常惊讶，我们更倾向于开源替代方案。这解释了为什么团队要辩护“波动”界面。Simplicity 还有一个功能——\
    \ Subdivision，它是专门为从专有操作系统迁移的用户设计的，在这样一个非常特殊的母发行版上，它们的用用体验变得不那么清晰。\n\n## 版本混乱\n\
    \nSimplicity 第一次运行时令人印象深刻，它做得很好。虽然稳定、alpha 和 beta 版本列在页面左侧，点击将直接从 SourceForge\
    \ 下载而没有更多信息。要发现 Obsidian 和 Subdivision 是什么，提到桌面、网络管理器和版本之间的区别是页面顶部的错误，那里只包含了几句话。\n\
    \n事实证明，Obsidian 是 Simplicity 的剪裁版本。有了 Linux，你获得了一个网络管理器、一个包管理器和一个类似的网络浏览器（除非你必须在命令行中安装），操作系统重量为\
    \ 168MB。\n\n## 不受欢迎的重复\n\n除了 Skype 之外，软件选择对于这种尺寸来说是令人赞的。相反，你会发现某些现有应用程序有多个选项，另一些有三个。他们以牺牲更详尽的软件选择为代价提供这些功能，这并没有损害\
    \ Simplicity 的信誉。虽然他们使用自己喜欢的应用很特别，但利用发行版的错误来做选择是该发行版及其用户（并非所有人）无法为了更全面的软件选择而接受的。\n\
    \nSimplicity 有少量的软件（主要是云端），而发行版的其他部分提供了功能。我们喜欢桌面版本 13，它对于那些功能比 Obsidian 少的账户很有用。由于我们不需要\
    \ Simplicity 版本不来删除未来，对于它真正需要的脸也是如此。\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_82_4.png)\n\
    \n 截图\n\n画廊\n\nbitmap/ubuntu.png\n\n我们将关注 13，因为当前版本的许多错误，但对于它真正需要的脸也是如此。\n\n现在下载\n\
    \nsimplicity.linux.org\n\nRussell Barnett\n\n正如我们很多用 Simplicity 的软补丁时，它真的\n\n"
