    # # Build Gentoo from scratch


    Create a custom build of the Gentoo distro from the ground up, to your preferences
    and speed up your system


    Gentoo can be a double-edged sword; it''s probably the most customizable Linux
    distribution available, leaving you to build from the ground up to be exactly
    what you want to be. However, it''s not all easy to get grips with and serious
    skills required in Linux.


    Once you have, Gentoo can be very rewarding. Building packages from source and
    compiling the kernel yourself feels like you''re making the most out of your Linux,
    and can actually help make your system


    lot faster than some of more popular, preconfigured distros. In this tutorial,
    we''ll be covering image and the first-time setup. While we''ll be relying on
    the minimal installation disc and downloading stages from the internet, you''ll
    learn how to create a rudimentary setup.

    A lot of the steps will be the same, however, if you get stuck, the Gentoo website
    has great resources and manuals to guide you through any differences.


