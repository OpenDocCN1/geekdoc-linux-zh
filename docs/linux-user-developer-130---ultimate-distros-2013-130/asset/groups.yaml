    # On the DVD


    Find out what lies in store for you on issue 130''s Linux User & Developer dual
    DVDs...


    # Distros


    This month we have no fewer than ten of the hottest distros across two live-booting
    DVDs for you test!


    ![](img/42a435dd97fa37bf0839d8abe967b91b_95_0.png)


    # Tutorial Files


    If you want to follow some of our tutorials, selected project files are available
    here


    # Tutorial Archive archive


    Our extensive archive of previous tutorials contains essential help for beginners
    and more besides


    ![](img/42a435dd97fa37bf0839d8abe967b91b_95_1.png)


    # Welcome to the Linux User & Developer DVD


    This issue have an amazing ten distros for you-test, with the vast majority of
    them-booting direct from the DVD. This being the case, we''ve included a second
    DVD (DVD2) Disc is where you''ll find our complete index across the discs, but
    not to mention the


    files you''ll need if you''re following along with our Python GUI masterclass
    or our Cisco logging tutorial.


    Remember - all you''ll need to insert one of the DVDs into your disc and reboot
    your computer to test our live-booting. If you''re not met by a boot menu, ensure


    your computer''s BIDS is set to read the DVD before your booting drive. Besides
    Raspbian, you can burn the other distros to disc using the instructions at the
    bottom of this page.


    Enjoy the disc!


    Russell Barnes, Editor


    # How to burn an ISO Want to try a new ISO? Here''s how get started...


    ![](img/42a435dd97fa37bf0839d8abe967b91b_95_2.png)


    STEP 1: Grab an ISO Copy the ISO from our cover disc to your hard drive; go to
    the Tabs, click ISO and choose to save. Alternatively, find an ISO online to download.
    If you''re not sure you need a 32-bit or 64-bit version, go former to be safe.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_95_3.png)


    STEP 2: Open or Install Brasero Brasero is the most popular open source disc utility.
    If it''s already installed on your distro, locate it in your repository and install
    it. Then open the project and select ''Burn image'' from the Projects tab on the
    left.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_95_4.png)


    STEP 3: Burn your disc image On the Imaging Setup menu, click the first box -
    marked ''here'' to select a disc image - and navigate to the ISO you just put
    on your hard drive. Once selected, you''ve got a CD or DVD writable disc and click
    ''Create Image''.'
