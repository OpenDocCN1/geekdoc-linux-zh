- md: "\n# Your view\n\nYour source of Linux news and views\n\nContact us...\nRegister\
    \ and post your comments... Email directly...\nwww.linuxux.co.uk/forum/ / linuxux@imagine-publishing.co.uk\n\
    \n# YOUR VIEW\n\n# Linux User Letters\n\nYour opinions about the magazine, Linux\
    \ and open source\n\nsuccess. And that's life. The vision developers have not\
    \ always been in sync with what users expect or want. The freedom developers receive\
    \ nothing more than user feedback. It's the ways they express themselves... If\
    \ this were a commercial product for a company, they would have questioned the\
    \ direction they were going all off, because they need to sell.\n\nBut this is\
    \ a FLOSS project and as is not like, it's driven by passion. If they are losing\
    \ users it is not what users need or like. And at some GNOME developers will have\
    \ to acknowledge this and they can start all off. \n\nThere are plenty of projects\
    \ that matter year after year with a smaller user base. But of course.\n\nI'm\
    \ not sure what to do with GNOME. It's such a big project that needs development\
    \ and that means having to attract developers, and momentum fueled by users.\n\
    \nI would say that, reflecting on all the criticism received and planning a revised\
    \ version for GNOME would warrant a brighter future for GNOME. it would be a new\
    \ start which means all over again.\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_93_0.png)\n\
    \n- GNOME is still proving to be controversial, but some people are giving the\
    \ project the benefit of doubt\n\nCarlos James\n\nSomeone was wishing until recently\
    \ that there be no failures to drive innovation. We wouldn't always agree philosophically\
    \ but we didn't want it, as would be a move go into this direction and continue\
    \ with it. It was too soon, as touch-screen PCs and laptops have not taken off\
    \ like some companies had.\n\n# A different view of GNOME\n\nI read Richard Nicholas's\
    \ opinion on GNOME from issue 127. Having clearly understood the need to evolve\
    \ GNOME 2, from both the technical and the motivational perspectives. But with\
    \ all commercial or not, some others aren't. It is the case that this project\
    \ GNOME didn't a\n\n# THREAD BASE\n\n# AV Linux, not so perfect?\n\nWe really\
    \ liked Linux 6.01 last issue, thanks to a series of decisions regarding the core\
    \ and the UI that made it much easier. Professional others share our thoughts\
    \ on this, when we posted the review to. Join the conversation: bit.ly/1bGEZ55\n\
    \n![](img/42a435dd97fa37bf0839d8abe967b91b_93_1.png)\n\n+ Michael Murphy:\n- Nothing\
    \ is perfect.\n- I can tell you the right now\n- I can already tell you that the\
    \ desktop environment and panel look seem dated and confusing.\n\n+ Guest:\n-\
    \ If I use it for look (like engineers do), then it doesn't mean as much to them\
    \ as they do to you. Looks dated to you?\n\n+ Michael Murphy:\n- How do you think\
    \ the engineers of today and tomorrow feel? They will be subject to the pressure\
    \ of a horrifying dated interface that's quite confusing? No The moment everything\
    \ is perfect moment you become sensible.\n\n+ AV Linux looked dated? And does\
    \ it matter?\n\n+ Grove Dragon said:\n- You say it looks dated. You didn't try\
    \ using the interface at all. Even the Pretty interface is perfect. And looks\
    \ are less important to somebody who wants functions and results. It doesn't a\
    \ perfect interface that works like that. Meanwhile me, so older is better than\
    \ broken new interface. AV Linux is actually perfect to use. Using it right now\
    \ while promising to your comment, I hope the engineers of today and tomorrow\
    \ be using it so it will help them to create better versions of AV Linux in the\
    \ future. And hopefully they are smart enough to learn a system before it gets\
    \ confusing. Pro tools are confusing if you never open a manual. Hopefully people\
    \ using this system have. By the way, I'm 25 and a hardware engineer; I am an\
    \ engineer of today.\n\n94 www.linuxux.co.uk\n\n# Tutorial files\n\nWhile I do\
    \ read your magazine, I don't always get it personally. I'm not too bothered about\
    \ missing out on the distros on the disc, the tutorial files are something I like\
    \ to look over. Do you plan on releasing some for people who buy digital copies\
    \ of the magazine?\n\nWe do actually ready the tutorial files up on the Linux\
    \ User & Developer website (www.linuxuser.com). You can currently access past\
    \ issues' tutorial files from the relevant blog posts for each issue. We're also\
    \ trying to make it to the ISOs are fully accessible and maybe to generally make\
    \ the process of making the tutorial files much easier. Watch this space.\n\n\
    Ken White\n\n# Save on back issues\n\nWant to catch up on the Linux User & Developer?\
    \ Well you'll be happy to hear that all issues older than six months have been\
    \ free at www.imageshop.net. A temporary offer either an issue hits the old age\
    \ of a year or will knock 50% off the price in the Image Shop. Now sign up and\
    \ get Issue123 for £29 - our issue with the greatest Raspberry Pi project, so\
