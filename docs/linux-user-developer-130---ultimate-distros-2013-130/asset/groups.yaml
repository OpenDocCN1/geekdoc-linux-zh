    ## 欢迎阅读 Linux User & Developer 第 130 期


    Mihalis Tsoukallas 拥有 15 年以上的 UNIX 系统管理和编程经验，并自 1993 年起就开始使用 Linux。他一名精通的 Linux
    管理员、Cisco 和 Ghost 专家。Mihalis 在第 62-65 页的专栏中带我们如何处理 Cisco 日志。


    - 本期内容

    - Python GUI 大师

    - 终极发行版揭秘

    - 制作专业级防火墙

    - 从零开始构建


    > 每期仅需 £4.19 即可购买 Linux User。见第 32 页


    Stuart Burns 是一位丰富的 Linux 用户，任职于一家世界五百强公司，并热爱编写关于 Linux 文章。Stuart 在第 34-37 页向我们介绍了如何使用简单的开源包构建强大的防火墙。


    Michael Reed 是一名技术作家，离开 Linux 已超过 15 年。他带着其他事物回归了 Linux。Michael Reed 从第 48 页开始向我们展示如何使用
    Linux 管理系统以及我们能发现的内容。


    Jon Masters 是一位 Linux 内核黑客，从上大学起就开始从事 Linux 工作已有 18 年。他现在住在马萨诸塞州剑桥，在一家大型 Linux
    供应商工作。一如既常，他在第 16-19 页有自己的常规专栏。


    Gareth Halreece 是我们的新常驻成员，从第 12 页开始报道最新的开源生态和企业动态。此外，Alice Guest 带领我们通过长达 12 页的内容探讨
    Linux 世界的热点与冷点。你可以阅读第 22 页开始的专题。


    欢迎阅读 Linux User & Developer 最新一，这是英国和美国最喜爱的开源与 Linux 杂志。


    我们关于计算机世界的专题之一是最令人沮丧的：技术在不断演进，我们与技术交互的方式也是如此。例如，移动设备的飞速崛起改变了一切——它将 ARM 从受尊敬的英国处理器设计者变成了与
    Intel 和 AMD 并列的 CPU 超强国之一。得益于 Android，Linux 内核就在全球数百万人的手中。显著的是，它正在彻底改变我们交互技术的方式，而不仅仅是使用它。尽管这让爱好者来说是一个非常兴奋的时代，但也可能相当令人恼火；随着市场对日益多样化用途的需求增加，我们已经摸索出了人们应该如何使用
    Linux，而 PRIME 3 是我们在这一新领域早期斗争中最明显的例子，前路依然漫长。


    对你来说，答案是什么？——我们写了一篇精彩的专题来赞扬现代源码计算的每一个方面，它让我们感觉好多了……

    **编辑：**

    Russell Baxter, 编辑


    与团队联系：linuxuser@imagine-publishing.co.uk


    [图片：Robert Zwielt](path_to_image1.jpg)


    Robert Zwielt 在大学期间学习软件工程，使用 Python 进行复杂的模拟。Robert 在第 72 页告诉我们应该从哪个 IRC 工具开始，他带我们介绍了
    Gentoo Linux 的过程并完成了他的 Python 教程。


    [图片：Linux 桌面](path_to_image2.jpg)


    [图片：数据统计图](path_to_image3.jpg)


