    # Ultimate IRC client super-test


    Four of the best clients battle it out


    # REVIEW


    # In brief: Compare and contrast our verdicts


    | Xchat | Irssi | Konversation | Smuxi |

    | --- | --- | --- | --- |

    | Installation | Easy to find on most distributions, default on some | There are
    no issues finding and installing Irssi in most distro | On a lot of KDE desktops,
    easy to find otherwise | Available in most major repos |

    | Ease of use | Very simple interface with a lot of options | Completely manual
    setup, and instructions are on the web | A more complex than Xchat, but you get
    used to it | Incredibly simplistic design makes it easy to use |

    | Customisation | You can customise aspects of Xchat | Very little compared to
    others | Every part of the client is fully customised | Very little to customise
    other the basics |

    | Features | A wealth of options to personalise your experience | Very few features
    compared to the others here | A huge amount to do just anything with IRC | As
    well as features, the front-end client function is perfect |

    | Overall | A fantastic default for the many distro you use | A good command-line
    IRC client, but not as good as the others in this test | The kind of application
    that feels like the best version for its function | A decent IRC, but not in the
    league of the best two |


    # Konversation


    Konversation just had to take it. It was very close between Xchat and Xchat, the
    extra functionality made it win the group test. Konversation pushed it over the
    edge. Indeed, every of Konversation is not only highly customise, but also designed
    in such a way that most of these customised are not present in front of the user
    unless they''re specifically looking for it.


    Rust, quite good as a command-line only, which is extremely limited by the amount
    of features and also by the style of the client can be customised, although the
    front-end is more of an interesting addition that can help some.


    Overall then, while Xchat is still a great default choice in some stores, Konversation
    will allow you to truly have personal experience on IRC.


    Rob Zweetlist


