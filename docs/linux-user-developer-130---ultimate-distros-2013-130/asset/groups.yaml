    # # Closing the door on updates


    Should a good software update leave a way back, wonders Simon...


    ![](img/42a435dd97fa37bf0839d8abe967b91b_15_0.png)


    **Simon Brew** is a technology writer and editor working across Linux, Windows
    and Mac OS platforms.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_15_1.png)


    By its very nature, software needs to **evolve**. For an instance of updates,
    the reasons are a mix of the nature of the beast and the frustration that they
    cause. As such, I generally cannot help but feel that when an update is offered
    for a piece of software, my immediate reaction is to consider it, rather than
    click on Cancel, as I was once a time more than I now.


    Sadly, the process of such updates is driven by the powers that are in the world—market
    forces. That is, a delivery mechanism by which decisions made by well-behaved
    people in boardrooms help themselves to to expensive coffee. It seems that gating
    is the de-liverance itself.


    Microsoft, you won''t be surprised to hear, but they are rolling out a new version
    of Internet Explorer via the Windows Update service. Once upon a


    Windows Update was just for that: updating Windows, keeping the bugs out, keeping
    features up to date. Sadly, over time, it became something of a software mainly,
    at one stage deactivating things, and at the next it''s de-activating you. Do
    you remember the now defunct Windows Genuine Advantage?


    +   - There was a time when Windows Update was just for: updating Windows


    I''m increasingly feeling that there''s a really naughty step that should be reserved
    for those who need their software, with no whatever to roll back. It''s the kind
    of thing that happens when you''re users, that you''re keeping your software up
    to date. All I see is written up about things that are irreversible, and most
    highly-level people would simply wonder why they should not bother.


    The update that the gate locks behind you, and closes off a path is evil, and
    not


    necessary one. There are times when security needs updates, but there''s an inherent
    risk in the assumption that said update is going to fix leaks without introducing
    new ones. That, said, when a vulnerability is found, it makes some sense to come
    into play. But the update that brings new features are being brought in isn''t
    exactly that right.


    +   - I list right here, to any extent, that causality that seems like the thing
    that''s been living in my life is the Yahoo! Or the Big Bad Apple. Ask one. What''s
    wrong with a matter of demands?


    Ultimately, what I want from software is that it''s not worth making it in the
    first place, and part and parcel of it am also wanting to know that if all goes
    not quite to plan, I''ve got an escape to the version of the application as I
    was using to before. It sounds like something like a pipe dream. However, in some
    very expensive buildings it''s merely collateral damage in the greater quest of
    biscuit consumption.


    > “The update where the gate locks behind you is not an evil”


