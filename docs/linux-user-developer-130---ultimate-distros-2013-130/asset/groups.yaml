    # 自由软件专栏


    ## 以少胜多


    自由软件桌面缺乏 Apple 或微软那种受控的极简主义和打磨，但它受益于（或受苦于）多元化的……登场，带来了新的动态和紧迫感。这种动力是将任何能运行的东西带到桌面，它演变成了一个小圈子且急躁的黑客行为，使用了随机补丁的小部件代码树”；结果是“事物变化太快了，同时破坏了开源和闭源软件，而由于
    Linux 发行版之间缺乏兼容性而加剧了这一点。


    这“杀死了第三方开发者针对桌面版 Linux 的体验，对你来说也是如此，如果你正感到‘顶级’，而且由于 Linux 发行版之间缺乏兼容性而加剧了这一点。”


