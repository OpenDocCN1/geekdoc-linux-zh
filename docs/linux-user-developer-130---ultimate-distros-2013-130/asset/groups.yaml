    beginning the process of merging into the kernel core after more than a decade.
    This was followed by an RC2 that added "unnamed temporary file" (TMPFILE), we''ll
    write about in this issue — and a late change) now


    Two features of particular note have been merged into 3.11: the user-space tracking,
    the new Latency polling, and a new /proc (file-system API) through which a user
    (or program) can request page latency. All future changes to the pages (chunks
    of memory) that contain kernel code and data for running will be implemented via
