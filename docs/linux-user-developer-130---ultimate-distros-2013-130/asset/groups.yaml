    ## FAQ

    ## Using the command line


    To build a strong foundation in Linux, good knowledge of the command line is essential.
    We''ve answered 14 of the most commonly asked questions...


    In this article you will find a list of 14 practical Linux command-line tips and
    tricks – in handy Q&A form – aimed to provide valuable information for beginners.


    For example, you can delete a Linux command/binary, change a system configuration
    file, change user passwords, after network settings, change firewalls and much
    more. This is why root is so powerful.


    Here are some easy ways with which you can verify whether you have accidentally
    logged in as root or not:


    > **NOTE:** Ubuntu Linux was used as the reference for this article and all the
    examples have been tested on Bash shell.


    - I am new to Linux. Experts: Never log in as root, no matter you have logged
    in as root or not.


    As you are new to Linux, the first thing you should do is create your own user.
    Experts say you should never log in as root (unless it is absolutely necessary).


    > UID (which stands for identification) is a positive integer that is unique for
    every user on a Linux system. The UID for the root account is zero. Run the command
    `id` to check whether it is zero or not.


    The root is the user account that can execute virtually anything on the system.
    This user exists by default on every Linux distribution (including Ubuntu) but
    it is to be activated before use.


    The home directory for root is /. After logging in as root, if you land this on
    the command line it definitely means you have logged in as root.


    Since the root account has unlimited privileges, you can do anything on a Linux
    system while logged in as root.


    Usually, the command prompt in line of a root account starts with ''#'' and ends
    with ''$''. If this is exactly how your command prompt looks, then you have logged
    in as root.


    The whoami command prints the username associated with the logged-in user account.
    If this returns ''root'' then you are logged in as root.


    > **NOTE:** To read more about sudo and su, read the following article – linuxbook.com/sudo-vs-su-in-ubuntu/


    ## FAQ

    ## Your most frequently asked questions


    Sometimes I start a program from the command line, the prompt gets blocked until
    I close it. Whenever you run a command in Linux, the command prompt does not get
    free until the command completes. A command can take minutes, depending on what
    you are doing. For example, if you are trying to run a large file system it might
    take much longer than trying to find a simple directory. A small text file will
    finish quickly compared to a high-quality movie.


    Now, to check if it is running in the background, use the ''jobs'' command.


    Q2: How to run a command in the background?


    ```

    $ jobs

    & running

    & binary

    ```


    Q5: How can I speed up my work in Linux?


    Observe the output that shows the ''binary'' and the state in which it is. To
    bring it back to the foreground, use the ''fg'' command.


    Here are a few command-line shortcuts: While working with commands, you can move
    the cursor to the start or end of the command. The traditional method is very
    slow in these cases. The alternative is to press Ctrl+A to go to the start of
    the command or Ctrl+E to go to the end.


    ```

    /binary

    ```

    So, you can see the command execution comes to the foreground.


    Writing names for existing files or directories on the command line can be made
    faster by using the Tab key. Just by typing the first few characters and pressing
    Tab, it will complete the name. If there are multiple files with the same name,
    then press Tab twice to show all of the options.


    Sometimes a user might not want to run a command in the background to continue
    other work in the terminal. There are multiple ways to achieve this:


    - Execute your command with ''&'' to run it in the background.

    - To bring a background command to the foreground, use ''fg''.

    - To bring a background command to the background, use ''bg''.

    - If there are multiple commands running in the background, you can use the ''jobs''
    command (which is listed in the output of ''jobs'') to bring a specific command
    to the foreground.

    - If you want to stop a running command, press Ctrl+Z to suspend it then use ''fg''
    or ''bg'' to push it to the background. For example, if an executable is named
    ''binary'' that runs infinitely:


    ```

    $binary

    ```

    Now, to push this command to the background, use ''bg'' command.


    ```

    $bg

    & binary

    ```

    Observe that the command ''binary'' is pushed to run in the background. While
    working with commands, you can move the cursor to any part of the command. Using
    some shortcuts will save a lot of time. For example, press Ctrl+A to go to the
    start of the line and Ctrl+E to go to the end. Yes, for traversing command, you
    can move both forwards and backwards. Use the combination of Ctrl+right arrow
    to move cursor word at a time, or Ctrl+left arrow to move word backwards.


    Is there any shortcut to kill a running command without root?


    ```

    $ find = /name

    $ find /home/user Permission denied

    $ find /root Permission denied

    $ find /bin Permission denied

    $ find /root/ Permission denied

    ```

    As you see in the example above, we are using the ''find'' command to search for
    a file. Everyone knows the ''clear'' command can be used to clear the screen,
    but this does not stop a running command from the prompt. If you want to stop
    a running command, use Ctrl+L to clear the screen and get back to the prompt.
    Using the mouse for copy-paste operations is not always possible. A quick edit
    on the line can make sure your cursor is at the beginning of the text to which
    paste can be done using Ctrl+V. You may want to run a complex/long command that
    you executed lately. Usually we use the mouse to scroll down and up. To search
    through commands, press Ctrl+R and start typing the name of command you''re looking
    for. If you still don''t get the required result, try Ctrl+R to repeat through
    loops (img/42a435dd97fa37bf0839d8abe967b91b_52_0.png).


    ## FAQ

    ## Using the command line


    named ''abc'', but it''s giving ''permission denied'' errors as it cannot access
    locations on the system. Now, to rerun this command with root privileges, you
    can use the following shortcut:


    ```bash

    $ sudo

    $ sudo find "abc"

    ```

    So you can see that using sudo will allow running the command. This is useful
    when the command is complex or long.


    I want to know more about my Linux system. How can I get detailed information?
    I was learning about the ''uname'' command with various options. Here are the
    details available:


    Execute ''uname'' without options to get the kernel name:


    ```bash

    $ uname -r

    3.8.0-23-generic

    ```

    Execute ''uname'' with the -v option to get the version:


    ```bash

    $ uname -v

    #1-Ubuntu-4 SMP May 29 22:58 2013

    ```

    Execute ''uname'' with the -m option to get the hardware architecture:


    ```bash

    $ uname -m

    x86_64

    ```

    Execute ''uname'' with the -o option to get the operating system:


    ```bash

    $ uname -o

    Linux

    ```

    To display all information in one, use the option with -a:


    ```bash

    $ uname -a

    Linux-himanshu 3.8.0-23-generic #1-Ubuntu-SMP x86_64 x86_64 GNU/Linux 3.8.0-23-generic

    ```


    Q7: Sometimes I roam here and there eventually want to come back to a certain
    directory. How do I make Shell remember a directory?


    For cases where you change only a single directory, you can go back to the previous
    directory using the cd command:


    ```bash

    $ pushd

    ~/Desktop

    $ cd ~/practice/

    $ cd /home/himanshu/

    $ cd home/

    $ popd

    ~/Desktop

    $ pushd

    /home/himanshu

    ```

    So you can see that using ''cd -'', one can easily switch back to the last directory.
    This is true, but in a real-world scenario we need to go between various directories.
    If we want to get back to all the previous directories in order, the commands
    ''pushd'' and ''popd'' can be used.


    You can see that a ''pushd'' followed by ''-'' represents the current directory,
    which was /home/himanshu/Desktop in this case which was made initially. This is
    what the user wants to accomplish. Subsequently, many directories were changed,
    and then ''popd'' will switch control back to the /home/himanshu/Desktop to which
    the user wanted to return.


    Q8: I want to know about directories name begin with a dot (.).


    There are files in Linux that use system-wide and user configuration. Usually
    of these files have a dot (.) and are hidden. These files are not visible if you
    just use ls in your home directory.


    ```bash

    ls -a

    .bashrc .bash_history .bash_login .bash_profile .bashrc .viminfo .bashvideo

    ```

    You can see in the example above that ''ls'' in your home directory does not list
    file with a dot. But if you use ''ls -a'' it will show all them.


    ```bash

    .bashrc .Downloads .kde .authority .thunderbird local ~/.cache ~/.bashrc ~/.config

    ```

    In order to show hidden files in the current directory, use ''ls -a'' with the
    -a:


    Q9: When I use ''ls'' in a certain directory and directories in various colours,
    what do these colours mean?


    Different colours are used so that a user can easily identify the type of file.


    Color support is added through the user-specific.bashrc - specifically through
    the following:


    ```bash

    ls=''ls --color=auto''

    ```


