    # How to create a basic rule


    All rules are added in the same way, just add and modify each rule to fit. Click
    the ''+'' symbol from the Rules page to start creating one. Set action to allow
    (unless you want to block traffic). Choose your source (WAN, LAN). Choose your
    protocol to use (TCP, UDP but things like DNS require UDP). Set destination to
    OPT3. Select the destination using interfaces or enter address. To add HTTPS,
    click the ‘+’ button, use port 443 and apply changes. Aliases are not limited
    to ports, but can also be used for hosts and networks. To implement an alias,
    select the alias (that has been created) in the rule type Port drop-select and
    then the name of the alias. If the alias name changes the rule is re created.
    Similar rules can be created between networks. An example would be SSH, implement
    it this same way.


