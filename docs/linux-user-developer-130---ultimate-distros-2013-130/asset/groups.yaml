    对于任何有过 Java、C++、Python 和 Lisp 语言经验的人来说，这本书是为教育而设计的，公式非常简单：逐章介绍了竞争、递归，然后参与游戏编写。许多移动用户在工作时会分心，他们发现可以找到正确的流程，通过线框和原型来提升用户体验。最后的章节涵盖了许多读者可能需要的价值材料。


