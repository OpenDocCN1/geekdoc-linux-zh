    * To bring a background command to the foreground, use ''fg''.

    * To bring a background command to the background, use ''bg''.

    * If there are multiple commands running in the background, you can use the ''jobs''
    command (which is listed in the output of the ''jobs'' command) to bring a specific
    command to the foreground.


    If you want to stop a running command, press Ctrl+Z to suspend it and then use
    ''fg'' or ''bg'' to push it to the background.


    For example, if an executable is named ''binary'' that runs infinitely:


    ```

    $binary

    ```


    Now, to push this command to the background, use the ''bg'' command.


    ```

    $bg

    ```


    ```

    & binary

    ```


    ```

    [+] binary

    ```


    Observe that now the command ''binary'' is pushed to run in the background.


