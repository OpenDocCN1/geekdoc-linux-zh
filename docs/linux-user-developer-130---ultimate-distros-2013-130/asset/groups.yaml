    观察到命令 ''binary'' 被推后台运行。在操作命令时，你可以将光标移动到命令的任何部分。使用一些快捷键将节省大量时间。例如，按 Ctrl+A 到行首，按
    Ctrl+E 到行尾。是的，在遍历命令时，你可以向前或向后移动。使用 Ctrl+右箭头每次移动光标单词，或使用 Ctrl+左箭头向后移动单词。


