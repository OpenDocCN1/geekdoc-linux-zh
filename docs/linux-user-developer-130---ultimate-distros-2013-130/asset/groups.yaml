  mdcn: "\n\n# 终极 IRC 客户端超级评测\n\n# 超级测试 IRC 客户端\n\n在不断寻找 Linux 上最佳 IRC 客户端的同时，关注社区动态\n\
    \n对于从用户转变为贡献者和/或从 Windows 转向 Linux 的人来说，他们有一个如此的工具来依赖 IRC 可能会有些奇怪。但是，他们还能用什么呢？聊天室消息服务拥有一些顶级的功能，兼容所有内容，而且不需要你注册任何账户。\n\
    \n连接 IRC 的方式有非常多，从像 Pidgin 这样的全能即时消息客户端到 Firefox 或 Chromium 上的 IRC 扩展。不过，也有很多专用客户端，它们由于独立于任何其他类型的应用程序，轻量且功能丰富，对经常使用\
    \ IRC 的人们非常有益。\n\n在这次分组测试中，我们将专注于这些专用 IRC 客户端。或者，正如我们之前提到的，Pidgin 是一个包含 IRC 的优秀客户端端即时消息服务，而\
    \ ChatZilla 和 Kiwi IRC 分别是针对 Firefox 和 Chromium 相当不错的扩展。\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_67_0.png)\n\
    \n# 终极 IRC 客户端-super\n\n四款最佳 IRC 客户端之战\n\n# 评测\n\n# Xchat\n\nIRC 客户端 Xchat 目前安装在所有的\
    \ Linux 发行版中，同时带有图形界面和命令行界面。图形界面基于 GTK+，采用了相当极简且轻量的设计，但还不至于让你觉得导航你想要的界面很费劲。这并不容易。\n\
    \n启动时，一个简单的连接界面允许你连接到许多预设服务器，或快速连接到不在列表中的服务器。每个主要的 IRC 服务器都可以在这里找到，尽管精简该列表可能有点棘手，因为有许多项需要编辑和删除。每天开始你的编辑，对不同的昵称设置优先级，并根据你的用户名提供通用建议。限制为五个，但\n\
    \n> “轻量、易于使用，且具有丰富的选项可以快速自定义”\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_68_0.png)\n\
    \n对于服务器来说绰绰足够。我们可以设置服务器中公告的默认频道，这与标签页界面配合得很好。启动非常迅速，在多个桌面工作流上的通知也令人印象深刻。\n\nXchat\
    \ 中也有许多值得发现的内容，具有丰富的通知、图形显示和字体选择。通知是多样的，带有视觉选项和声音选项，以确保你知道特定操作何时发生。这起了作用，但它让它\n\
    \n![](img/42a435dd97fa37bf0839d8abe967b91b_68_1.png)\n\n有一些默认的高级编辑选项\n\n由于还包括的，Xchat\
    \ 是一个非常坚实的客户端基础，你还需要将其添加到你的 \n\n由于包括的，这基本上应该被设定为与其他项对比的标准。轻量、易于使用且具有如此多的功能，允许你以自己想要的方式工作，同时保持一个稳健的基础界面。虽然它可能不是最好的\
    \ IRC 客户端，但它绝对是优点并存的绝佳选择。\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_68_2.png)\n\
    \n# 评分\n\n| | | |\n|---|---|---|\n| 安装 | 在大量发行版中可用；GTK，巨大的 | 9 |\n| 易用性 | 界面易于理解，所有选项都包含在一个\
