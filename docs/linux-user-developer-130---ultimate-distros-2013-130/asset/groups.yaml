    # # Tutorial


    # Send Cisco logs to a remote machine

    LinuxDeveloper


    # 06 Making changes to /etc/rsyslog


    For the rsyslog service to listen on UDP port 514, you have to add the following
    lines:


    ```

    @local

    UDPServerAddress 109.74.19.253

    UDPServerRun 514

    ```


    To save all local logging to a separate file, you should add the following line
    in the /etc/rsyslog.conf:


    ```

    local.* /var/log/rsyslog.log

    ```


    After that restart the rsyslog service for the cisco file to be created:


    ```

    # touch /var/log/cisco.log

    ```


    Now restart the rsyslog service for changes to take effect. On a Debian 7, you
    can restart the service with:


    ```

    # restart rsyslog

    ```


    You should also configure the Cisco router to send logs by executing the following
    command:


    ![](img/42a435dd97fa37bf0839d8abe967b91b_63_0.png)


    # 07 Opening UDP ports on the Linux machine


    After restarting rsyslog you have to make sure that UDP port 514 is open. You
    can check which ports are open with the following command:


    By default, if the port is not open, the Linux firewall would have dropped all
    network packets coming from the Cisco router.


    Note: You can also log via TCP, but this is not the desired configuration for
    rsyslog logging.


    # 08 Making further changes


    After making sure everything works as your router is configured, you should use
    memory on your Cisco router. The router saves the current configuration in startup
    RAM.


    The current configuration is correct. If you want to set up another configuration,
    you will have to restart your router after a Cisco reboot.


    The IP address of the Linux server you use is your own IP and is passed to the
    Cisco router.


    The logging level for messages is emergencies, critical, errors, notifications,
    informational and debugging. You should choose which filters you want to process.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_63_1.png)


