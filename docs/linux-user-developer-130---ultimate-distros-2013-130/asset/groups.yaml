    ## RAPIRO

    ### 机器人背后 - Rapiro 的创造者

    Rapiro 的创造者不仅仅是一个对机器人学感兴趣的爱好者——他以制造创新自动机器而闻名。“我的专业是机械工程。他曾参加过许多机器人大战、比赛，并在 2005
    年首届国际机器人杯大赛（RoboCup）中获胜。救援组让搜索与救援机器人相互竞争，他在 2015 年获得了移动性第一名。”


    基础流程图显示，虽然是必要的，但 Rapiro 可以控制


    ## Rairo 规格

    - 舵机：12 x 2.5kg-cm, 6 x 1.5kg-cm

    - 舵机运行速度：0.12 秒/60°

    - 舵机角度：180°

    - 全彩：彩色 LED

    - 舵机控制器：兼容 Arduino 的 ATmega328P 芯片

    - 额外处理：树莓派（不包含）

    - 光学：树莓派摄像头（不包含）

    - 分发关系语言：Python, Arduino IDE

    - 底盘结构：3D 打印塑料

    - 组装要求：螺丝刀

    - 所需技能水平：无

    - 可选配件：Wi-Fi 或蓝牙适配器、麦克风、红外 LED、PSD 传感器、扬声器


    这不是他第一次进入机器人领域——他之前创建了 Necomimi，一种日语“猫耳朵”的小马，它能根据用户的情绪做出情感动作。“Necomimi 的成功给了我巨大的信心和良好的口碑，”石渡说。从那以后，他以类似于
    Necomimi 的方式迎接机械挑战，这让他能够尝试使用 Kickstarter 筹资金。


