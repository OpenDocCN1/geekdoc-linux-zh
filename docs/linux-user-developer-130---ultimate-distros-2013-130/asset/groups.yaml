  mdcn: "\n\n# 您的观点\n\n您的 Linux 新闻与观点来源\n\n联系我们...\n注册并发布您的评论... 直接发送邮件...\nwww.linuxux.co.uk/forum/\
    \ / linuxux@imagine-publishing.co.uk\n\n# 您的观点\n\n# Linux 用户来信\n\n您对杂志、Linux 和开源的看法\n\
    \n成功。这就是生活。开发者的愿景并不总是与用户的期望或需求保持一致。开发者所获得的自由无非用户反馈。这是他们表达自己的方式……如果这是一个某个公司的商业产品，他们会质疑自己所处的方向，因为他们需要销售。\n\
    \n但这是一个 FLOSS（自由开源软件）项目，不像那样，它是由激情驱动的。如果他们正在失去用户，那不是用户需要的或喜爱的。在某些时候，GNOME 的开发者将承认这一点，然后他们可以从头开始。\n\
    \n有很多项目年复一年地都很重要，尽管用户群较小。不过这当然如此。\n\n我不确定该对 GNOME 怎么办。它是一个巨大的项目，需要开发，这意味着必须吸引开发者，并由用户提供动力。\n\
    \n我想说，反思收到的批评并为 GNOME 规划一个修订版本，将为 GNOME 带来更光明的未来。这将是一个全新的开始，意味着一切重新来。\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_93_0.png)\n\
    \n- GNOME 仍然证明是有争议的，但有些人正在给这个项目疑疑之机\n\nCarlos James\n\n直到最近，一直有人希望不要通过失败来驱动创新。我们在哲学上并不总是达成一致，但我们并不希望看到那样，因为那将向那个方向移动并持续下去。这还太早了，因为触摸屏电脑和笔记本电脑并没有像公司预测的那样流行起来。\n\
    \n# 对 GNOME 的不同观点\n\n我读了 Richard Nicholas 在第 127 期中关于 GNOME 的观点。他从技术和动力两个角度都清楚地理解了演进\
    \ GNOME 2 的必要性。但无论是否商业化，另一些情况并不是这样。GNOME 这个项目并没有一个\n\n# 帖子基础\n\n# AV Linux，并不那么完美？\n\
    \n我们非常喜欢上期的 Linux 6.01，这得益于对核心和 UI 的系列决定，这使其变得容易许多。专业人士也对此有我们相似的想法，当我们把评论发布到那里时。加入对话：bit.ly/1bGEZ55\n\
    \n![](img/42a435dd97fa37bf0839d8abe967b91b_93_1.png)\n\n+ Michael Murphy:\n- 没有什么是完美的。\n\
    - 我现在可以告诉你\n- 我已经可以告诉你，桌面环境和面板看起来很过时且令人困惑。\n\n+ Guest:\n- 如果我为了外观使用它（像工程师那样），那么它对他们来说并不像对你来说那么重要。你觉得看起来过时了吗？\n\
    \n+ Michael Murphy:\n- 你认为今天和未来的工程师会有什么感觉？他们会承受令人恐惧的过时且相当困惑的界面的压力吗？不，一切完美的瞬间你就变得理智。\n\
    \n+ AV Linux 看起来过时了吗？这重要吗？\n\n+ Grove Dragon 说:\n- 你说它看起来过时。你根本没有尝试使用那个界面。即使是漂亮的界面也是完美的。对于想要功能和结果的人来说，外观并不那么重要。一个能那样工作的界面并不完美。同时对我来说，旧的比坏掉的新界面好。AV\
    \ Linux 实际上非常好用。现在使用它，并对你的评论承诺，我希望今天和未来的工程师能使用它，这样可以帮助他们在未来创建更好版本的 AV Linux。希望他们足够聪明，在系统变得困惑之前学会它。如果你从不看手册，专业工具是让人困惑的。希望使用这个系统的人看了。顺便说一下，我\
    \ 25 岁，是一名硬件工程师；我是今天的工程师。\n\n94 www.linuxux.co.uk\n\n# 教程文件\n\n虽然我读你们的杂志，但我并不总是从个人上理解它。我并不太在意错过光盘上的发行版，但教程文件是我喜欢过的的内容。你们计划为购买杂志数字版的人发布一些教程吗？\n\
    \n我们实际上已经在 Linux User & Developer 网站（www.linuxuser.com）上准备好了教程文件。你目前可以从每期相关的博客文章文中访问过去期的教程文件。我们还在尝试让\
    \ ISO 文件完全可访问，也许可能通地让制作教程文件的过程变得简单得多。请关注。\n\nKen White\n\n# 节省旧期费用\n\n想追上 Linux\
    \ User & Developer 吗？好吧，你会高兴地听到，所有比六个月之前的杂志在 www.imageshop.net 都是免费的。这是一个临时优惠，要么杂志期满一年，要么在\
    \ Image Shop 中打 5 折。现在注册并以 29 英镑获取第 123 期——我们关于最棒的树莓派项目的内容，即 LEGO 输出计算机套件。今天就购物并挑选你的优惠商品。\n\
    \n![](img/42a435dd97fa37bf0839d8abe967b91b_94_0.png)\n\n从 LUDE 网站获取期期的教程文件\n\n\
    # 在 facebook 上关注 Linux User & Developer，在 twitter 上关注我们\n\nLinux User-Mozilla\
    \ Firefox\n\n文件 编辑 查看历史记录 书签 工具 帮助 http://www.linuxuser.co.uk/ Google \n\nLinux\
    \ User & Developer 官方网站\n\n# LinuxUser.co.uk\n\n开源爱好者和专业人士的终极资源\n\n- 最新新闻\n- 评论\n\
    - 教程\n- 观点\n\n![](img/42a435dd97fa37bf0839d8abe967b91b_94_1.png)\n\n绝不要错过更新，订阅我们的\
    \ RSS 馈！\n\n完成\n\n# 在 DVD 上\n\n你的光盘\n\n# 在 DVD 上\n\n查看第 123 期 Linux User & Developer\
    \ 中有什么内容...\n\n# 发行版\n\n本月我们有少于十个热门的发行版，通过两个启动 DVD 供你测试！\n\n*(注：由于原文中存在大量 OCR\
    \ 错误导致的重复碎片，译文已根据要求提取核心内容并去重翻译)*\n\n"
