    ## Welcome to issue 130 of Linux User & Developer


    Mihalis Tsoukallas has over 15 years of UNIX system administration and programming
    experience and has been using Linux since 1993. He is also a proficient Linux
    administrator, Cisco and Ghost expert. Mihalis walks us through dealing with Cisco
    logs in his features on pages 62-65.


    - This issue

    - Python GUI masterclass

    - Ultimate distros revealed

    - Make a pro-grade firewall

    - Build from scratch


    > Get Linux User for £4.19 per issue. Page 32


    Stuart Burns is an experienced Linux User who works for a Fortune 500 company
    and enjoys writing about Linux. Stuart introduces us to powerful firewalls using
    effortless open source packages started on pages 34-37.


    Michael Reed is a technical writer, and has been away from Linux for over 15 years.
    He returns to Linux along with other things. Michael Reed shows us how to administer
    systems using Linux and what we can find starting on page 48.


    Jon Masters is a Linux kernel hacker who has been working on Linux for 18 years,
    since he first attended university. He now lives in Cambridge, Massachusetts,
    and works for a major Linux vendor. As usual, he finds his Regular Column on pages
    16-19.


    Gareth Halreece is our new resident member and reports on the latest open source
    ecosystem, enterprise started on page 12. Also, Alice Guest leads our 12-page
    look at what''s hot and what''s not in the world of Linux. You can catch the feature
    starting on page 22.


    Welcome to the latest issue of Linux User & Developer, the UK and America''s favourite
    open source and Linux magazine.


    One of our features about the computer world is one of the most frustrating: technology
    continues to evolve, so does the way we interact with it. For example, the meteoric
    rise of mobile devices changed things—it has transformed ARM from a respected
    British processor designer into one of the CPU superpowers, alongside Intel and
    AMD. It has the Linux kernel in the hands of millions of people around the world,
    thanks to Android. Significantly, it''s revolutionising the way we need to interact
    with technology and not just use. Although this makes it a very exciting time
    to be an enthusiast, it can also be rather exasperating; as the market demands
    increasingly marketplaces for increasingly diverse purposes, we''ve worked out
    how people should use Linux, and PRIME 3 are the most obvious examples of our
    early battles in this new territory and there''s a long road ahead.


    What''s the answer for you? — we write a great feature that celebrates every facet
    of modern source computing, it makes us feel better...

    Russell Baxter, Editor


