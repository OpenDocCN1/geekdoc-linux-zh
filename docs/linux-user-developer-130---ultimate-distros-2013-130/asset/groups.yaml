    # # Rapiro – the little RasPi robot that could


    Kickstarter success Rapiro is not the first Raspberry Pi-powered robot, but it’s
    one of the most important


    The tech world is always moving on. Two of the newest additions have been the
    successful Raspberry Pi and the concept of Kickstarter and crowdfunding. While
    the Raspberry Pi takes its inspiration from early computers, it has a lot of modern
    conveniences, such as size, a HDMI port and low-power draw.


    comics, books and much more, there are people everyday finding an audience for
    their dream, and getting this audience to fund it.


    It’s Kickstarter where we find the latest tech project, the Rapiro. Short for
    Raspberry Pi, this robot powered by Arduino and Raspberry Pi. With promotion from
    the Raspberry Pi Foundation, the project’s funding goal was hit quickly, and at
    the time of writing is 300 per cent funded at 20 days to go. Kickstarter campaigns
    usually


    get most of their funding within the first few days, and the last few days, so
    there may be more money to come for a robot’s developer.


