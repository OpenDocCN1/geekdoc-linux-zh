    ## 问题与解答，

    解决你的所有技术问题 Q/A


    嗯，Toby，根据你的描述，你可能面临着几个问题。首先，请确保包已通过以下命令实际安装：


    ## 丢失的家目录


    我有一个问题，你可能可以帮我解决。我的家人决定开始使用主电脑（运行的是 Ubuntu）来查看照片并进行一些处理，在此过程中，我的孩子们用它们做了一些好玩的图片。不幸的是，这导致主目录（home
    folder）被删除了。


    ![](img/42a435dd97fa37bf0839d8abe967b91b_88_0.png)


    ## 需要单独安装某些依赖项


    ```bash

    $ rpm -ql opensql

    ```


    如果是这种情况，你需要寻找另一种安装方法。其他一些依赖项（如 OpenSSL）需要单独安装。你也可以顺便轻松获取它们，以修复你想要的的密钥管理。


    我一直在尝试在 CentOS 5.9（这是一个虚拟机服务器）上安装该包。我已经将所有内容更新到最新，并收到了一些错误；但我仍然无法直接执行 `yum install
    opensql`


    ## 神奇的错误


    可以运行，但目录中没有可执行文件。我记得几个月前我曾安装过这个，从另一个目录移动了一些文件，这可能导致了我的构建和密钥损坏。


    当在带有 LS 硬件 RAID 控制器的 RHEL 6.2 安装上运行时。每隔 10 分钟，我的 syslog 中出现一条错误消息——虽然没有引起任何问题，但它会淹没日志，导致我在需要时搜索时不方便。消息内容是：


    ## 包问题

    非优化 RAID 状态


    现在我卡在这里了。我唯一的猜测是我是不是漏掉了回复？


    手动检查时，mctl-status 报告一切正常：


    ```bash

    [root@hostname ~]# apt-status -1 5

    ```


    Peter Lewis


    Phil，你采取了正确的步骤，但顺序稍有错误。你应该备份文件结构/home，而你把 home 移动到了根分区上——这就是导致你得到 /home/me/home/me
    的原因。


    ![](img/42a435dd97fa37bf0839d8abe967b91b_88_1.png)


    由于 home 分区用于登录你的配置，所以所有随你的文件都传输到了分区根目录下的 home 和文件夹中。你复制了所有的 home 目录和文件夹，以防在过程中丢失任何设置。


    或者，你只需将分区移动到 home 文件夹，从而整体增加 home 文件夹的空间，而无需移动任何东西——尽管听起来你的主分区可能已经满了，所以目前这是最好的方法。


    在 Linux 中进行分区和挂载只要操作得当就是有效的


    ![](img/42a435dd97fa37bf0839d8abe967b91b_88_2.png)


    CentOS 非常适合服务器


    www.linuxuser.com


    ## 问题与问答


    与我们联系 @linuxusermag


    ![](img/42a435dd97fa37bf0839d8abe967b91b_89_0.png)


    ![](img/42a435dd97fa37bf0839d8abe967b91b_89_1.png)


    ioc0 vol_id 5 type IM, 2 phy. 118

    gb, state OPTIMAL, flags ENABLE

    ioc0 phy 1 scsi_id 6 ATA

    tMFDAK18-MAR-1J MA44, 119, state

    ONLINE, flags NONE

    ici0 phy 1 scsi_id 1 ATA

    tMFDAK18-MAR-1J MA44, 119, state

    ONLINE, flags NONE


    ## RAID 5


    | A1 | A2 | A3 | Ap |

    |---|---|---|---|

    | B1 | B2 | | B3 |

    | C1 | Cp | C2 | C3 |

    | D1 | D2 | | D3 |


    我在网上搜索过，只发现

    那些没有 RAID 控制的人

    遇到了这个问题，并且他们停止/禁用了

    写入


    对我来说这不是一个选项，因为我需要

    监控我的 RAID 阵列状态，以防磁盘发生故障。我测试过了，它与我的监控系统运行得非常完美，我我很想继续使用它。


    如果你对我如何

    从我的 syslog 中跟踪这些无缘故的消息有任何问题，将不胜感激。


    | Disk 0 | Disk 1 | Disk 2 | Disk 3 |


    James Turner


    没错，虽然这是一件简单的事，但需要一点时间来“修复”。如果你为此

    **一头撞墙**，那么它可能是值得的。


    首先，我检查了 SCSI ID 状态，需要

    检查路径上的 RAID 阵列——

    如下所示：


    ```bash

    # mpt-status - -

    Checking for SCSI ID:0

    Checking for SCSI ID:1

    Checking for SCSI ID:2

    Checking for SCSI ID:3

    Found SCSI id3, use ''mpt-status''

    ```


    类似：


    ```bash

    # mpt-status -i [ID]

    ```


    一旦你获取了 ID 信息，编辑

    /etc/mpt-status。然后将 ''ID=0'' 改为

    上述的 ID 数字，以便

    在 Debian 发行版上

    .deb 版本，或者直接从源码编译。


    ```bash

    MAILroot # 报告

    PERIOD=60 # 检查间隔秒（默认10分钟）

    REMIND=720 # 重启间隔秒（默认2小时）

    RUN_DEMONS

    ID=

    ```


    John Park


    > 有一个工具可以用来

    转换 RPM 到 DEB 文件，它非常

    叫做 alien。你也可以将其用于

    其他类型，发行版，如果你以后开始使用的话。


    由于你正在使用基于 Debian 的发行版，

    可以通过以下命令安装它：


    ```bash

    # sudo apt-get install alien

    ```


    一旦完成，进入

    你想转换的目录。-d 选项告诉它

    转换为 DEB 包。你也可以添加


    ```bash

    $ alien -d [package]

    ```


    虽然这对于你尝试做的任何事情可能有效，但值得注意的是，开发者表示此工具始终是实验性的，因为创建的包不会像真正的 DEB 包那样好，或者说。


    Hannah，你被归类为 MTA、用户代理，你确实在通过你的 SMTP 配置发送邮件。这就是为什么邮件投递看起来。


    如果 MDA 不是由你的 ISP 运行，它就不会被视为垃圾邮件或骚扰信息。除非你想变成这样，当然。


    感谢你的来信，Fran。MyTracker 在 ProTracker 等应用中是一个流行的来源，它更多基于 FastTracker II，那个 DOS 程序运行得非常好，所以听起来非常适合记录。


    ## 无垃圾邮件


    我的 ISP 偶尔会将我的邮件标记为垃圾邮件。这非常不方便，尽管尚未造成任何严重问题。为了在其他事情之前尝试应对这一点，我决定使用 EvespeGlu 发送外部
    SMTP 邮件。


    然而，我不确定服务器通过查找目标域名的 MX 记录来发送外部邮件的行为（而不是简单地将邮件转发到特定的（每个 ISP 的）SMTP 服务器）叫什么。


    ![](img/42a435dd97fa37bf0839d8abe967b91b_90_0.png)


    > “如果 MDA 不是由你的 ISP 运行，它就不会被视为垃圾邮件或骚扰信息”


    Hannah Smith


    通过 Gmail 等 Web 客户端发送你的邮件可能帮助你减少被误标记的垃圾邮件


    91. linuxux.co.uk


    '
