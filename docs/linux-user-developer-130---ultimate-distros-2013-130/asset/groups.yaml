    最终用一个“修复”请求标记了这一点，他在其中写：“窗口开启第一周的一半时间里，人们都在抱怨你们推销了我多少东西，并指责我显然直接发送了开发窗口，这可能应该等到下一次发布。但没有人去去饮水机旁说八卦。”


    Sarah 特别指出了 Linus，尽管这需要许多人才能传达这一观点并保持她成员的目标。然而，Linus 回复说，他“不相信礼貌或正确”是指：“但要正确”，而且他“不希望在没有方法撤销合并导致的回归的情况下，去骚扰维护者，并要求他们在不破坏所有工作的情况下修复这些问题”。


