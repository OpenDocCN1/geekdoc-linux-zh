    # Java 编程第 4 版 (Learning Java 4th Edition)


    | 作者 | ISBN | 出版社 | 价格 |

    | :--- | :--- | :--- | :--- |

    | Patrick Niemeyer, Daniel Chuck | 978-0321469234 | O''Reilly | £38.50 |


    Java 的内容极其庞杂，无法一次精通。让我们通过一个项目，采用其他语言书籍那种“在实中学学”的方法。O''Reilly 出版的《Java 编程》针对 Java
    6 和 7 进行了更新，在 1000 多页的内容中涵盖了从实现 Eclipse 到理解并发的内容。


    ![](img/42a435dd97fa37bf0839d8abe967b91b_84_0.png)


    # Asterisk 权威指南 (Asterisk: The Definitive Guide)


    电话技术的未来已来：灵活且强大


    Asterisk 是一款杀手级应用，十多年来一直为电信企业创造了巨大财富。凭借其强大的功能并展现出多维度的复杂性，《Asterisk》第四版可以帮助你快速上手所需的任何电话解决方案。


    在进入配置和安装之前，作者首先介绍了 Asterisk 社区从早期到现代的发展历史。这至关重要，因为尽管 Asterisk 仍是 PBX（程控交换机）中的难点，你仍然需要知道如何发现并维护为你自己的环境设计并实现的内容。


    书中有几个章节介绍了配置、显示和命令行的基础要点，随后详细介绍了如何处理各项事务，从语音、会议和 LDAP 集成，到自动应答系统以及一些经典的修复方案。如果你使用
    Asterisk，这些内容依然至关重要。


