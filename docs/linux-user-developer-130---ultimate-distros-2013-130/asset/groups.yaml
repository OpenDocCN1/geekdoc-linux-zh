    # Create a cron job


    We''re going to create a nightly job that deletes the contents of /var/log/mylogs
    using the Scheduled Cron jobs page. Select the ''Create a new cron job'' section
    on the job edit page. In the job details section, type `rm /var/log/mylogs` into
    the Command text box. Add a description for the job. In the ''execute'' section,
    select Simple schedule Daily (at midnight). Finally, click Create.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_39_1.png)


    # 08 Configure your router


    Now you can access access from the internet securely. For your router, you''ll
    need to examine the instructions for your router or visit portforward.com. In
    short, you need to allow incoming connections for port 10000 and forward it to
    the IP address of your router. This is usually very straightforward, but since
    every router is, it''s impossible to enable it in detail.


    # 10 Package Installation


    We''ll install Apache on Ubuntu in this example, but this works in the same way
    on other platforms. On the main page, select the package from APT and enter default-jf
    into the next box. Like many others, you will get a lot of useful text output.
    At the top it will show the command that it will execute (apt-get --force-y install
    default-jf). This shows the output of APT and below it, a summary table of all
    installed.


    # 13 Search system documentation


    The System documentation module (accessed from within the System section) offers
    a complete man page browser, searching through man files. To use it, simply enter
    a search term. It operates much the same as the ''man'' command, but many will
    find the web-based interface more convenient.


    # 09 Webmin package management


    To install Apache2 machine using the Webmin package management facilities. Open
    the System menu from the sidebar and select Packages. Note that in this section,
    each button opens a window that allows searching of the APT database.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_39_2.png)


    ![](img/42a435dd97fa37bf0839d8abe967b91b_39_3.png)


    ![](img/42a435dd97fa37bf0839d8abe967b91b_39_4.png)


    # 11 Manage cron jobs


    The syntax of scheduling a new UNIX job, or cron job, is notoriously fiddly, and
    Webmin offers a neat front-end for this. Begin by entering the System/Scheduled
    Cron Jobs page. On this page, you can create new jobs or edit ones already present.


    # 14 View logs


    The Web Actions Log is a serious feature in Webmin''s cap. If you don''t add anything
    to the default log and click on search, you will find a summary of configuration
    changes made that day. You can further refine your search by, for example, using
    the date range.


