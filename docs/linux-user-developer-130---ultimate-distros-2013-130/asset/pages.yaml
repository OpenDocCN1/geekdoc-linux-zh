  md: '# # Send Cisco to a remote machine


    Learn commands for Cisco router logs and send them to a remote Linux PC


    UTORIAL


    # ## The whole process will not take more than 30 minutes


    # ### 02 Examine open TCP ports on the Linux machine


    While making changes to the service is not difficult, there is a possibility of
    unintentionally opening ports to potential attackers. To prevent this, run Numpy
    before any changes, to check open TCP ports of the Linux machine.


    You should do same after finishing the process and if you get the same results,
    then you can be sure nothing was opened by mistake and your Linux system is secure
    as it was before.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_62_0.png)


    # ### 01 Set up the Cisco ADSL router


    You must be very careful if you are unfamiliar with Cisco commands, especially
    when using IOS commands and the 7 key options available.


    Cisco send syslog messages to their logging server with default of local, but
    it might be a bad idea to hard-code it by using the local facility command


    The facility values are local1, local2, local3, local4 and local5.


    logging trap notification defines the logging level. The specified level filters
    traffic without overly important, or critical information.


    ```

    mount nfs syslog /root -o numpy

    Starting May 25 10:04:27 2024 192.168.1.253

    Nmap scan for host (192.168.1.253)

    Host is up (1 host response)

    Not all 1000 ports are filtered

    PORT SERVICE

    22/tcp open

    53/udp open

    80/tcp open

    ```


    ![](img/42a435dd97fa37bf0839d8abe967b91b_62_1.png)


    # ### 03 Check open UDP ports


    By default, syslog uses UDP port 514 to get messages other than local, but you
    have to change if it''s already set to do it up. Make Numpy to finish the full
    UDP port scan, but it''s worth to check the localhost - the Numpy output not showing
    open UDP port 514.


    Note: You need a service process to catch the incoming traffic for UDP port 514.


    # ### 04 Run tcpdump to catch UDP traffic


    There is always something going wrong. One major issue is that you cannot be sure
    if a given packet is caught by an error in the Cisco config, the log filter or
    debugging with the tcpdump utility.


    # ### 05 The syslog service


    It replaces the original Linux syslog service. The configuration file is /etc/rsyslog.conf
    and you should have root privileges to make changes to it. Available


    kern: Messages from the system kernel. auth: Authentication and authorization.
    daemon: Messages related to system processes. mail: Messages sent to the mail
    server. local: Messages to printing. user: General messages from user processes.
    cron: Messages related to the cron daemon.


    local0: Custom logging messages. Note: Syslog saving the log messages to the corresponding
    file.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_62_2.png)


    63 www.linuxux.com'
