  md: '# Questions & answers


    All your technical problems solved


    Q/A


    ![](img/42a435dd97fa37bf0839d8abe967b91b_90_0.png)


    > “If the MDA is not run by your ISP, it won''t be tagged as spam or junk as it
    goes through”


    # Music tracker


    I loved to using ProTracker for Amiga - a great little piece of software for crafter
    creation - I''ve been wondering recently if there are any alternatives to this
    tracker? I haven''t been able to properly find any, do you know of any?


    Frank Johnson


    Alien is getting better, but should not be used often


    keep the version number, as alien will increase the version number by 1 for most
    packages. That''s done, you can install it using dpkg like so:


    ```

    $ dpkg -i [package]

    ```


    While this may work well whatever you''re trying to do, it''s worth noting that
    this should only be used as a last resort. The developer says the converter will
    always be experimental, as the packages created will not be as good as a true
    DEB package, or properly version of the application.


    Hannah, you are classified as the MTA, user agent, and you are indeed sending
    emails off the MTA you are using in your SMTP configuration. This is why the mail
    delivery seems to be off to.


    If the MDA is not run by your ISP, it will be treated as spam or junk as it goes
    through. Unless you want to be, of course,


    Thanks for writing in, Fran. MyTracker is a popular source on apps like ProTracker,
    it''s also more based on FastTracker II, the DOS program works very well, so it
    sounds like right for getting in track.


    # No spam


    My ISP has had of occasional flagging of my emails as spam. This is extremely
    inconvenient although hasn''t luckily caused any serious issues yet. To try and
    counteract this before anything else, I decided to use EvespeGlu to send outbound
    SMTP emails.


    However, I''m not sure of what it''s called when the server must send outbound
    emails by looking up the target domain''s MX record instead of simply forwarding
    emails to a specific (each ISP''s) SMTP server.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_90_1.png)


    I guess the letter is a store-forward and ''relay'' MTA, but what''s the result
    for a full-fledgedged MTA, what that will look up MX records directly?


    Hannah Smith


    Running your emails through a web client like Gmail might help you down on mislabeled
    spam


