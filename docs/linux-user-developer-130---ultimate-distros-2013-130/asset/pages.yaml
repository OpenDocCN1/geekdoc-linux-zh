    # # GitHub simplifies licensing decisions


    # # Choosing an OSS license doesn''t need to be scary


    **Which of the following best describes your situation?***


    ChooseALice.com exactly what it sounds like


    +   I want a license that is permissive.


    +   I''m concerned about patents.


    +   I care about sharing improvements


    Collaborative version control and repository GitHub branching out with the launch
    of ChooseALice.com, a site that aims to simplify the selection of an open source
    license for new and existing projects.


    The MIT License is a permissive license that lets people do anything they want
    with your code as long as they include the copyright notice and dont hold you
    liable.


    The Apache License is a permissive license that allows modification, but also
    provides an express grant of patent rights from contributors.


    The GPL (V2 or V3) is a copyleft license that requires you to release your code
    under the same license if you distribute it in binary form. It''s similar to the
    VPL but forbids software alternatives.


    By default, there are three licences based on simple use cases: ''it simple''
    gives me the MIT License; ''I''m concerned about patents'' gives me the Apache
    License; ''I care about sharing improvements'' gives me the GPL in V2 or V3.


    Apache, SVL and Mozilla use Apache


    Linux, Git and WordPress use GPL.


    Users are also given a choice of licence types - including the Mozilla Public
    License, LGPL BSD and with colour - choosing a design that matches each need


    Created by ChooseALice.com is designed to make picking one easy with linking between
    the two sites.


    The GPL allows and forbids. No licence option is as easy to use, for retaining
    all rights, including releasing code into the public domain under the so-Commons
    license.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_13_0.png)


    If you already know what you''re doing, and have a license you prefer, that is,


