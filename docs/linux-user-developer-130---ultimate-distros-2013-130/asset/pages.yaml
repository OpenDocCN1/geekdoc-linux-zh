  md: '# A look ahead to 2014 and beyond


    Looking back over the last 12 months in the world of Linux is easy, but what of
    the future?


    Short-term things are easy to predict: Linux Mint will likely remain the most
    popular general distribution around and Ubuntu will gain users at approximately
    the same rate as the Raspberry Pi.


    The market looks for longer-term trends, however. There''s an increasing trend
    for the most distributions to attempt to gain unique selling points that make
    them stand out from the crowd—now less of a distribution being chosen for its
    desktop environment because of a particular unique feature or application.


    As a result, it is becoming increasingly common for distributions to take development
    of choice. Elementary OS 3 is a key example of this using custom-written applications
    as much as possible and projects for more software such as the web browser. Outside
    this extreme environment remains elsewhere. Ubuntu is making in-display management
    technologies move to the Mir server in phase of X, and Fedora is becoming better
    suited to the professional tool market.


    In the long term, Linux will likely become increasingly diverse from its rivals,
    and as will certainly result in the birth of more distributions which are coming
    along, each aiming to offer the best of all possible worlds. A cycle that we''ve
    seen before in Linux history is now approaching the mid point with the explosion
    of new districts to occur within the next two to three years.


    The next shift, however, is going to be towards low-cost computing, where the
    proprietary operating system vendors have been caught unprepared. Apple realized
    that the Raspberry Pi was going to


    blast millions of units shipped with no support of paying, if they might have
    paid more attention, as they, the market has already been ceded to Linux and other
    open source platforms.


    The growth of single-board computers (SBCs) for the market is opposed to the distributions.
    Companies like UA, Beagleboard and Samsung-Run are releasing ARM-based SBCs seeing
    every month, and many of them come with open hardware designs of their own, evolving
