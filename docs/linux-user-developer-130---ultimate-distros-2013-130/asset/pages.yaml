    other the basics |

    | Features | A wealth of options to personalise your experience | Very few features
    compared to the others here | A huge amount to do just anything with IRC | As
    well as features, the front-end client function is perfect |

    | Overall | A fantastic default for the many distro you use | A good command-line
    IRC client, but not as good as the others in this test | The kind of application
    that feels like the best version for its function | A decent IRC, but not in the
    league of the best two |


    # Konversation


