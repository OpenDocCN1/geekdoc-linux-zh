    It seems the ''find'' and ''locate'' commands do the same thing.


    # Q14: What is the difference between find and locate?


    Both the ''find'' and ''locate'' commands perform the same job: search for files.
    However, there is a difference between them: find searches for files on the disk,
    while ''locate'' searches a database. The database is updated by the ''updatedb''
    command.


    So, here if you remove a file from disk ''locate'' will not be able to find the
    new file until the database is updated. The command will still show the file in
    its search results until the database is updated.


    Since ''locate'' searches a database, it is faster to execute than find but it
    depends on the database. Suppose you create a new file in the disk, but do not
    update the database report with the command; in this case ''locate'' will not
    be able to find the new file.


    In this case you can use >> >>, the new text is appended to the file.


    ```

    ```bash

    $ > /filename To clear all the content of a file, use the command >

    ```

    ```


    Q11: I experience problems reading lines using cat, as the text will scroll the
    screen. How can I stop this from happening?


    Use ''less'' in this case. All you need to do is replace the ''cat command with
    the following:


    ```

    ```bash

    $ cat [filename] | less

    ```

    ```


    ```

    ```bash

    $ ls is_file

    $ new_file

    $ ls -l new_file

    $ sudo updatedb

    $ locate new_file

    $ /home/himanshu/practice/new_file

    ```

    ```


    So, you can see even after the file new_file was removed, the ''locate'' command
    kept a non-existent file in its search results until the database was updated.


