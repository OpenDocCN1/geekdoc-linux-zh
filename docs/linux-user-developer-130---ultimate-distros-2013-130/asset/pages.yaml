    Q10: What is the difference between > and >> when using the command?

    Both are used to redirect output files in the fact that one overwrites the current
    content while the other appends to.


    What if I want to shut down or restart my Linux box from?

    You can use the ''shutdown'' and ''reboot'' commands for shutting down or restarting
    it.


    ```

    ```bash

    $ cat > output

    $ hi, this is test file

    $ echo "this is overwritten" > output

    $ cat > output

    $ echo "this text is not overwritten" >> output

    ```

    ```


