    # ## SELLING EXCEPTIONS


    Richard Stallman refers to dual licensing as ''selling exceptions'', and has broadly
    approved of the practice where it has enabled projects like Qt and MySQL, because
    it maintains freedom of free software.


    Selling exceptions means that the copyright holder of the code releases to the
    public under a free software license, then lets customers pay permission to use
    the same code under different terms, for allowing its inclusion in proprietary
    applications.


    We must distinguish between selling exceptions from proprietary versions of software.
    These two events, if activated simultaneously, concern different issues. In selling
    exceptions, the code that the exception allows to be available under general free
    software, or a modified version that is only available under a proprietary license
    is proprietary software. This article covers cases that involve firstly and strictly
    the software itself.


    > "We considered selling exceptions as exceptions in one occasion I''ve seen it
    companies. Sometimes this approach has not been helpful for important programs
    to become free software...


    Selling exceptions depends fundamentally on the copyright license, such as the
    GPL, for free software. A copyleft license embedding the free code ensures that
    the whole program is released under this license unless it is licensed under even
    stricter terms.


    We want to make the combined program grant the same rights that the copyright
    holder can grant, and selling exceptions is something only they can do. The code
    under the GPL, or any copyleft license, cannot grant an exception.


