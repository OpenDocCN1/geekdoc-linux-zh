  md: '# # System administration with Webmin


    Use Webmin GUI to configure and manage your system


    # TUTORIAL


    # ## 01 Fetch the latest version


    Head on to www://www.webmin.com and proceed to the Download page to fetch the
    latest version of Webmin. Alternatively, download the DEB file by typing


    ```

    wget http://www.webmin.com/download/webmin-current.deb

    ```


    Or type `http://www.webmin.com/download/webmin-current.rpm` for RPM.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_38_0.png)


    # ## 02 Install (Webmin)


    In the case of Debian-based distributions, like Ubuntu, install the DEB file by
    typing `sudo dpkg -i [name of deb downloaded]`. Note that not all dependencies
    will be satisfied so you may worry if it throws some errors. To fix this, type


    ```

    sudo apt-get install webmin

    ```


    ![](img/42a435dd97fa37bf0839d8abe967b91b_38_1.png)


    # ## 03 Install (Webmin for)


    In the case of Red Hat-based distributions as CentOS, first make yourself root
    and then type `sudo yum install [name of RPM file you''ve downloaded]`.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_38_2.png)


    # ## 04 Connect to Webmin


    Fierced Crossmin is now working. You can test it by navigating to https://yourserver:10000.
    You can discover your hostname by typing `hostname` command. If everything is
    working, you will see the interface for Webmin.


    # ## 05 Log in with user


    Webmin will give you your ''root'' username and password. When using Ubuntu as
    a system that has no root account, you should use the username and password of
    your regular user so long as you can execute sudo.


    # Login to


    You must enter your username and password to log in to the Webmin service at 192.168.1.2.


    ![](img/42a435dd97fa37bf0839d8abe967b91b_38_3.png)


    # ## 06 Set a static IP address


    For convenience, you need to assign a static IP address to the host, so that it
    can be identified easily. Go to Configuration>Network Interfaces to see a list
    of currently activated network interfaces. Click on the name of your network (eth0
    or similar for


    # ## 07 Configure your firewall


    If you want to access Webmin from other machines on your network (by using http://your:ip:10000/),
    don''t panic it means a local firewall is blocking access. To allow Webmin using
    Webmin, go to Networking>Firewall and add more button. Find the fields on the
    next page, select TCP and UDP port to equal 10000.


