    Interface Dot11Radio0, Deauthenticating Station 40b.5.95d.a70 Reason: Sending
    session has left the BSS(homenet)

    ```


    # 09 The /var/log/rsyslog.log


    The /var/log/rsyslog.log is a regular text log file. It contains all local log
    messages specified inside the /etc/rsyslog.conf file.


    You should watch this file to see the syslog messages:


    ```

    Jul 9 14:50:26 ppp-2-8g-218.home.onet cinet 3116: Jul 9 14:50:25:565: %%SEC-6-IPACCESSLOGN:
    list 23 terminated by 0 219.148.230.128->0.0.0.5

    ```


