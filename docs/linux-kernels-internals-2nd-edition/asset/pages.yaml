    # 4.1.6 The page table


    An entry in the page table is denoted by the data type pte_t . As before, there
    is a macro pte_val(),, which provides access to the value of the data type. The
    most important task of the page table entry is to address a page in physical memory.


    In addition, a page table entry contains a number of flags which describe the
    legal access modes to the memory page and its states. Linux must map these architecture-dependent
    flags onto architecture-dependent attributes. The ''present'' attribute indicates
    whether or not the page is present in the virtual address space. There is one
    attribute for reading and writing to the memory page and for executing code. One
    attribute indicates whether the memory page has been accessed - in other words,
    this attribute describes the ''age'' of the page. The ''dirty'' attribute is set
    when the contents of the memory page has been modified.


    The following attribute combinations are defined as macros of the pgprot_t type:


    +   - PAGE_NONE

    No memory page is referenced by the page table entry.

    - PAGE_SHARED

    All types of access are permitted.

    - PAGE_COPY

    This macro is historical and identical to PA6E_READONLY.

    - PAGE_READONLY

    Only read or execute access is allowed to this page of memory. With write access,
    an exception is generated which allows this to be handled. The memory page can
    be copied, and the page table entry can be set to the physical address of the
    new page and its attributes to PAGE_SHARED. This is exactly what is meant by ''copy-on-write''.


    +   - PAGE_KERNEL

    Access to this page of memory is only allowed in the kernel segment.'
