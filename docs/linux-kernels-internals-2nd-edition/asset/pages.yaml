  md: '# Linux kernel internals - 198 -


    As a number of device drivers have to exist side by side in the LINUX kernel,
    they are uniquely identified by their major numbers. A device driver may be controlling
    a number of physical and virtual devices, for example a number of hard disks and
    partitions; thus, the individual device is accessed via its minor number, an integer
    between 0 and 255.


    The exception to this rule is the device driver for terminals and serial interfaces,
    which uses the two major numbers 4 and 5. The devices with the major number 4
    are virtual consoles, serial interfaces (call-in devices) and pseudoterminals.
    Virtual consoles are given the minor numbers 0 (for tty0) to 6. The special device
    /tty0 or /dev/console is the current virtual console.


    For every serial interface there are two logical devices, the dial-in device ttySn
    and the call-out device cu. When the dial-device is opened, a process, such as
    getty, will be blocked until the DTR line at the interface is active. A process
    opening the call-out device, usually a dial-out program, will be given immediate
    access to the serial interface if no other process is using it. This will also
    continue to block the dial-in device. The dial-devices are given the minor numbers
    64 (for ttyS0) to 127.


    The remaining minor numbers from 128 to 255 are used for pseudo-terminals. The
    master terminal tyn is given the minor number 128+n, and the corresponding slave
    terminal tyn has the minor number 192+n.


    Major number 5 is reserved for the current terminal and for the call-out devices.
    The device/tty with the minor number 0 is always the terminal belonging to the
    process. The call-out devices cu have the corresponding minor numbers 64+n and
    thus differ from their ''twins'' only in their major numbers.


    In the same way for file systems, device drivers need to be made known to the
    LINUX kernel. This is done when the system is started up or when the driver modules
    are initialized, and using one of the functions


    ```

    int register_chrdev(unsigned int major, const char * name, struct

    file_operations *fops);

    int register_blkdev(unsigned int major, const char * name, struct

    file_operations *fops);

    ```


    The file operations specified and their symbolic names are entered under the major
    numbers given in the table chrdevs[] (for character devices) or


    > Pseudoterminals are pairs of master and slave terminals, acting together like
    one terminal unit. The slave terminal is the interface, acting like a terminal
    as as the user program is concerned, while the master represents the other end
    of the link (on a terminal, this is the user) (see Stevens (1992b)).'
