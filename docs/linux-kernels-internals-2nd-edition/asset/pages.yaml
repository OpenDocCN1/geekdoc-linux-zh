  md: '# Linux kernel internals - 330 -


    The values pers_low and pers_high are not are, as one might think, the higher
    and lower byte values of personality; they represent, instead, a (numerical) upper
    and lower limit for the operating system located in personality. The personality
    parameter is divided into two areas. The upper word contains flags for known bugs,⁶
    the lower word contains the operating system. The values can be found in the header
    file <linux/personality.h>


    By means of sys_personality(), a certain domain can be set or the current domain
    can be interrogated. If the all bits in personality are set (0xffffff), the current
    value is returned. Otherwise a domain that matches personality is sought. For
    this, the lower 2 bytes of personality must lie between the low and the high value.


    This domain is entered, together with personality, in the task structure of the
    current process. The counter of the old domain (use_count) is decremented, that
    the new domain is incremented. The return value is the old value of personality.


