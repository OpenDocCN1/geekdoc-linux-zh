    the code and data have been installed, and within this the relevant function should
    also be called.


    The return value determines whether or not the installation procedure is judged
    to have been successful. The second administration function cleanup() is called
    when the module is uninstalled, and invokes the relevant unregister function.


    The symbol table for the kernel is denied in the file kernel/ksym.c. Each exported
    function has an entry in the symbol table. The name of the function or variable
    in each case is transferred to symbol_table by the macro X(). The module''s own
    symbol table lists only the symbols to be exported, but also references to symbols
    in the kernel which have been used by the module. This enables the mutual dependence
    of the modules to be gauged. As a result, a module which is still used by another
    module will not be deinstalled.


    An additional aid in avoiding problems when uninstalling modules after use is
    the USE_COUNT mechanism. If, for example, we have implemented a device driver
    as a module and it has been loaded, the use counter will be incremented every
    time the module is opened and decremented every time it is closed. This means
    that when uninstalling the module we can find out it is still in use. It should
    be mentioned that the locations where the use counter is changed are in some cases
    difficult or impossible to find.


    A final recourse in particularly difficult cases, it is of course possible to
