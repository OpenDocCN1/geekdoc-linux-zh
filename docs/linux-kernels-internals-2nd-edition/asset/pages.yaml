    Figure 3.2 Chart of states within a process.


    # Running


    The task is active and running in the non-privileged User Mode. In this case the
    process will go through the program in a perfectly normal way. This state can
    only be exited via an interrupt or a system call. In Section 3.3 we will see that
    system calls are in fact no more than special cases of interrupts. In either case,
    the processor is switched to the privileged System Mode and the appropriate interrupt
    routine is activated.


    # Interrupt routine


    The interrupt routines become active when the hardware signals an exception condition,
    which may be new characters input at the keyboard or the clock generator issuing
    a signal every 10 milliseconds. Further information on interrupt routines is provided
    in Section 3.2.2.


    # System call


    System calls are initiated by software interrupts. Details of these are given
    in Section 3.3. A system call is able to suspend the task to wait for an event.


    # Waiting


    The process is waiting for an external event. Only after this has occurred it
    will continue its work.


    # Return from system call


    This state is automatically adopted after every system call and after some interrupts.
    At this point checks are made as to whether the scheduler needs to be called and
    whether there are signals to process. The scheduler can switch the process to
    the ''Ready'' state and activate another process.'
