  md: "As long as 1970, the classical forms of inter-process communication -semaphores,\
    \ message queues and shared memory - were implemented in a special variant of\
    \ UNIX. These were later integrated into System V and are now known as System\
    \ V IPC. LINUX supports these variants, although are not included in POSIX. At\
    \ present, shared memory is the only way of allowing more than one process to\
    \ access the same area of memory under LINUX. The original LINUX implementation\
    \ was produced by Krishna Balasubramanian, but it has been modified by Eric Schenk,\
    \ Bruno Haible and Bjorn Ekwall.\n\n# 5.5.1 Access permissions, names and keys\n\
    \nIn System V IPC, objects are created in the kernel. These must be assigned identifiers\
    \ to ensure that operations activated by the user process are carried out on the\
    \ right objects. The simplest form of identifier is a:\nthese numbers are dynamically\
    \ generated and returned to the process generating the object. A process entirely\
    \ separate from the creator cannot access the object, as it does not know the\
    \ number. In a case of sort, the two processes will have to agree a static key\
    \ by which they can reference the IPC object. The C library offers the ft function,\
    \ which generates a unique key from a filename and a character. A special key\
    \ is IPC_PRIVATE, which guarantees that no existing IPC object is referenced.\
    \ Access to objects generated using PRIVATE is only possible via their object\
    \ numbers.\nAs with System V, access permissions are managed by the kernel in\
    \ the structure ipc_perm.\n\n```\nstruct ipc_perm {\n    key_t key;\n    /* owner\
    \ */\n    ushort uid;\n    ushort gid;\n    /* owner */\n    ushort cuid;\n  \
    \  /* creator */\n    ushort cgid;\n    /* creator */\n    ushort mode; /* access\
    \ modes **/\n    ushort seq; /* counter, to calculate the identifier */ };\n```\n\
    \nIf a process accesses an object, the routine ipcperms is called, once again\
    \ using the standard UNIX access flags for the user, the group and others. The\
    \ superuser, of course, has access at all times. The uid for the process attempting\
    \ access matches that of the owner or the creator, the user access permissions\
    \ are checked. The same applies to checks on group access permissions."
