  md: 'device files, FIFOs (*named pipes*), symbolic links and sockets. These enable
    all the resources of the system to be accessed via files.


    From a programming point of view, files are simply data flows of unspecified content
    containing no further structuring. The file system takes on the task of managing
    these ''data flows'' efficiently and allowing the representation of different
    file types (including pseudo-files).


    IN UNIX, the information required for management is kept strictly apart from the
    data and collected in a separate inode structure for each file. Figure 6.2 shows
    the arrangement of a typical inode. The information contained includes access
    times, access rights and the allocation of data blocks to the physical media.
    As shown in the figure, the inode already contains a few block numbers to ensure
    access to small files (which are often encountered under UNIX). Access to larger
    files is provided via indirect blocks, which also contain block numbers. Every
    file is represented by just one inode, which means, within a file system, each
    inode has a unique number and the file itself can also be accessed using this
    number.


    Directories allow the file system to be given a hierarchical structure. These
    are also implemented as files, but the kernel assumes them to contain pairs consisting
    of a filename and its inode number. There is no reason why a file cannot be accessed
    via a number of names, which can be held in


    ![](img/04698aadad5d50fd4b3564ae373ff0bd_160_0.png)


    Figure 6.2 Structure of a UNIX inode.'
