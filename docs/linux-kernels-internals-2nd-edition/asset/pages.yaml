  md: '# 7.3 The hardware


    If we are proposing to write a device driver for the internal loudspeaker, we
    cannot avoid taking a look at the hardware concerned and its control system.


    Although it has been part of the package since the earliest days of the PC, the
    internal speaker is not well suited to reproducing samples. As Figure 7.1 shows,
    the construction and programming of the speaker are both very simple.


    The 8253 timer chip has three internal timers. Timer 2 is designed for use with
    the speaker, for which the output from timer 2 is connected via an AND gate to
    bit 1 of the system control latch at I/O address 0x61, with bit 0 for starting
    or restarting timer 2. Thus the speaker can only be fully turned on or switched
    off. The normal procedure is for timer 2 to be programmed as a frequency divider
    (meaning that both bits are set). It generates square waves, which account for
    the ‘typical’ sound of the internal speaker. The frequency is given by dividing
    the timer’s basic frequency of 1.193MHz (= 4.77 MHz/4) by the timer constant that
    has been set.


    To output an analog signal via the speaker, pulse-length modulation is employed.
    By rapid variation between on and off phases of different lengths, corresponding
    to the instantaneous analog value to output, the mechanical inertia of the speaker
    can be exploited to give an analog output. However, pulse-length modulation is
    very sensitive; even one missing sample will produce an annoying click from the
    speaker.


    The central problem in using pulse-length modulation proceeds to lie in determining
    and implementing the required time intervals.


    ![](img/04698aadad5d50fd4b3564ae373ff0bd_210_0.png)


    **Figure 7.1** Block diagram of PC speaker connections.


    > ⁷ This also accounts for the extraneous noise sometimes accompanying floppy
    disk access or even mouse movements. If even a single interrupt fails to be handled,
    the dynamics of the speaker break down.'
