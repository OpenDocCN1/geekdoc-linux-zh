    # 10.3.3 Message exchange between processors


    Messages in the form of inter-processor interrupts are handled via interrupts
    13 and 16. In 386 processors, interrupt 13 had the task of informing the system
    about FPU errors. Since the 486, which is the smallest processor supported by
    the Intel MP specification, this is now carried out exception 16 which is the
    only one used in SMP mode. Interrupt 13 is defined as a fast interrupt, however,
    does not need the kernel lock and can always be processed. This interrupt cannot
    be used to trigger the scheduler, but only to distribute messages. Interrupt 16,
    on the contrary, is a slow interrupt which waits for the kernel lock and can trigger
    scheduling. It is used to start the schedulers on other


    # 10.3.4 Entering kernel mode


    As already described, the kernel is protected by a single semaphore. All interrupt
    handlers, syscall routines and exception handlers need this semaphore and wait
    in a processor loop until the semaphore is free. This could lead to a deadlock
    problem when the processor that is running in kernel mode changes the memory mapping
    and waits to inform all other processors about this fact. It triggers an IPI and
    waits until all processors have carried out a TLB flush.² Processors that wait
    for the kernel lock with deactivated interrupts do not handle the IPI. For this
    reason, while waiting for the kernel lock, each processor checks its own bit in
    the variable smp_invalidate_needed and carries out a TLB flush when it is set.
    If at a later stage the IPI is handled, the handler routine sees that the flush
    has already been carried out and does nothing.


    The code for the kernel is defined in the ENTER_KERNEL assembler macro and the
    Lock_kernel() function.


    Since Intel processors possess a cache (Translation Lookaside Buffer) for paging,
    this cache must be adjusted when the paging is changed. On the 386 this was only
    possible by emptying the entire cache (TLB flush). Since the 486, it is also possible
    to change individual cache entries.'
