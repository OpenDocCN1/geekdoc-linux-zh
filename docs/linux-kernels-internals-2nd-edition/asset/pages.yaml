    such as multiple saving of registers to the stack, saving of areas of memory,
    and so on.

    If processes were able to share areas of memory, inter-process communication would

    be more efficient.


    This concept of shared memory is not restricted to communication with processes.
    For

    areas of files could also be mapped into a process''s memory--this could often
