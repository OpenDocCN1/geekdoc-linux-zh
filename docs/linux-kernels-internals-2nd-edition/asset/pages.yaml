    There are many applications in which processes need to cooperate with each other.
    This is always the case, for example, if processes have to share a resource (such
    as a printer). It is important to make sure that no more than one process is accessing
    the resource - that is, sending data to the printer - at any given time. This
    situation is known as a race condition and communication between processes must
    prevent it. However, eliminating race conditions is only one use of inter-process
    communication, which we take in this book to simplify the exchange of information
    between processes on one or more computers.

    There are many different types of inter-process communication. They differ in
