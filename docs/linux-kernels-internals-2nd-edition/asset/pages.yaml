  md: '# 8.5 IP


    The IP layer is the most important section of all the communication software,
    as all of the network traffic is carried by this layer. What are the tasks assigned
    to it?


    # 8.5.1 IP - general introduction


    The IP layer provides a packet transfer service - that is, it can be given a packet
    and the addressees and it will take care of the transfer. IP, however, does not
    guarantee safe and correct arrival of the packet at its intended destination:
    secure transfer of packets is ensured by the TCP, which is dependent in turn on
    the services of the IP layer.


    In principle, the packets transferred can be divided into two categories. Those
    in one category are generated by the local host and have to be sent to others.
    The other category of packets are generated by other hosts, and the local host
    is merely a link in the transmission chain. This process is known as IP forwarding.


    The following simplified picture describes the tasks of the IP layer. This description
    does not include any true error handling, but is sufficient for a general understanding.


    The schematic flow of the outgoing packet stream of IP is as follows:


    +   * Receipt of a packet.

    * Option handling.

    * Routing to the destination address.

    * Generating the hardware header.


    During the routing process, the device through which the packet has to be sent
    is determined. A header for the hardware type of this device is


    +   * then constructed, containing the hardware address of the next recipient.

    * Creating the IP packet.


    This involves generating an IP header, which is simply added to the hardware header
    along the data packet.


    +   * Fragmenting the IP packet.

    * If the IP packet is too large for the device, it will need to be broken down
    into smaller packets.


    +   * Passing the IP packet to the appropriate network device.


    The schematic flow of the incoming packet stream of IP is:


    +   * Checking the IP header.'
