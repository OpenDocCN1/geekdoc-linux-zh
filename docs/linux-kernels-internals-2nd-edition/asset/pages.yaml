  md: 'Once again, an expansion of the GNU C compiler will serve excellently.

    This permits C preprocessor macros to be used with a variable number of arguments.

    A debugging macro can then be defined along the following lines:


    ```

    #ifdef DEBUG

    #define MY_PRINTK(format, a ...) printk(format, ## a)

    #else

    #define MY_PRINTK(format, a ...)

    #endif // DEBUG */*

    ```


    Defined in this way, MY_PRINTK can be used in exactly the same way as the function

    printK. However, it allows a decision on whether or not test prints should be

    produced to be made at compile-time. A second advantage is that it saves a lot
    of

    writing in comparison with ordinary C macros. If, in addition, the prints are
    made

    dependent on a flag in the kernel, the process becomes even more dynamic. The
    flag

    then needs to be set by an external event: for this we can fall back on a system
    call

    or or an iot command.


    As described in Appendix E, only prints with a lower level than the kernel

    variable console_LogLevel are also displayed on the console. As it is sometimes

    useful to have the information there, because the kernel crashes immediately

    afterwards or for some similar reason, the value of consoleLe_LogLevel will need
    to be

    changed appropriately. There are a number of ways of doing this:


    +   - using the system call syslog

    - by direct modification of the variable.


    When serious problems (traps) occur, the kernel automatically sets the level to
    the

    highest value, so all messages appear at the console.


    The user of modules should also be aware that direct manipulation of the variable

