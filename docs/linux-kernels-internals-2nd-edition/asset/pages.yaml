  md: 'active, and the individual DREQ signals are therefore given different priorities.
    Usually it is DREQ0 which has the highest and DREQ3 the lowest priority. By modifying
    the request register, DMA transfer can be activated ''by hand'', as if the relevant
    DREQ signal had been received. However, this facility is not normally used; it
    is provided in the PC/XT and other machines to allow a memory-to-memory transfer,
    but this is not possible on the AT, DMA channel 0 of the master controller, which
    is required for this mode, is used to cascade the slave controller.


    In all, each DMA controller possesses 12 registers governing its operation. However,
    the functions in the LINUX kernel fully encapsulate these registers, so any further
    explanation is unnecessary.


    The DMA controller also supports a number of transfer modes, which must be set
    in the mode register for each channel. These include the following operation modes:


    +   **Demand transfer**\In this mode, the DMA controller continues transferring
    data until the terminal count is reached or the device deactivates the DREQ. The
    transfer is suspended until the device reactivate the DREQ.


    +   **Single transfer**\In this mode, the DMA controller transfers one value at
    a time and returns the bus to the processor. Each further transfer must be requested
    by the DREQ signal or access to the request register. This mode is used for slow
    devices, such as floppy disks and scanners.


    +   **Block transfer**

    in this mode, the DMA controller carries out a block transfer without relinquishing
    the bus. The transfer is initiated by a DREQ.


    +   **Cascade**

    cading of another DMA controller: in this mode the DMA controller passes on the
    DMA requests it receives and enables more than one controller to be used. By default,
    DMA channel 0 of the second controller (or DMA channel 4 in consecutive numbering),
    which is the master in the AT, is in this mode.


    These basic modes may be used in both read and write transfers. The DMA controller
    can both increment and decrement the memory addresses, enabling a transfer to
    start with the highest address. In addition, auto-initialization can be selected
    and deselected. If it is selected, the relevant DMA channel will automatically
    be reinitialized to the starting value when the terminal count is reached. This
    allows constant amounts of data to be transferred or from a fixed buffer in memory.


