    # Int sys_ptrace(long request, long pid, long addr, long data);


    By means of the system call ptrace a process can monitor the execution of another
    process. This system call is used, for example, in the implementation of debug
    algorithms. A process whose task structure the PF_TRACED flag is set, is stopped
    upon a signal. It halts and its parent process is informed via the system call
    wait. The memory of the halted process can then be read and written to. The parent
    process can make the child process continue.


    In pid, the PID of the required process is specified. Obviously, not every arbitrary
    process can be monitored; one should generally keep one''s hands off; init; further
    conditions depend on the desired request. The value in request determines the
    exact meaning of the **call:**


    TRACE_TRACENE - The process sets the PF_TRACED. The parent process is requested
    to monitor the process. If this flag is already set, an error occurs.


    > ⁶It would be more correct to refer to them not as bugs, but as features of the
    operating systems concerned. For example is the flag STICKY_TIMEOUTS; see also
    Appendix A.2.'
