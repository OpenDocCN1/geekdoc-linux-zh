  md: 'Linux kernel internals


    - 13 -


    # 1.1 Main characteristics


    LINUX will meet all the demands made nowadays of a modern, UNIX-type operating
    system.


    +   - Multi-tasking

    LINUX supports true preemptive multi-tasking. All processes run entirely independently
    of each other. No process needs to be concerned with making processor time available
    to other processes.


    +   - Multi-user access

    LINUX allows a number of users to work with the system at the same time.


    +   - Multi-processing

    Since version 2.0, LINUX also runs on multi-processor architectures. This means
    that the operating system can distribute several applications (in true parallel
    fashion) across several processors.


    +   - Architecture independence

    LINUX runs on severe hardware platforms, from the Amiga to the PC to DEC Alpha
    workstations. Such hardware independence is achieved by no other serious operating
    system.


    +   - Demand load executables

    Only those parts of a program actually required for execution are loaded into
    memory. When a new process is created using ~forkO, memory is not requested immediately,
    but instead the memory for the parent process is joined jointly by both processes.
    If the new process subsequently accesses part of the memory in write mode, this
    is copied before being modified. This concept is known as ~copy-on-write~.


    +   - Paging

    Despite the best efforts to use physical memory efficiently, it can happen that
    the available memory is fully taken up. LINUX then looks for 4 Kbyte pages which
    can be freed. Pages whose contents are already stored on hard disk (for example,
    program files) are discarded. All other pages are copied out to hard disk. If
    one of these pages of memory is subsequently accessed, it has to be reloaded.
    This procedure is known as *paging*. It differs from the *swapping* used in older
    variants of UNIX, where the entire memory for a process is written to disk, which
    is certainly less efficient.


    +   - Dynamic cache for hard disk

    Users of MS-DOS will be familiar with the problems resulting from the need to
    reserve memory of a fixed size for hard disk cache programs such as SMARTDRIVE.
    LINUX dynamically adjusts the size of cache memory in to suit the current memory
    usage situation. If no more memory is'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'available at a given time, the size of the cache is reduced to free memory.
    Once memory is again released, the area of the cache is increased.


    +   * Shared libraries

    Libraries are collections of routines needed by a program for processing data.
    There are a number of standard libraries used by more one process at the same
    time. It therefore makes sense to load the program code for these libraries into
    memory only once, rather than once for each process. This is made possible by
    shared libraries. As these libraries are loaded only when the process is run,
    they are also known as dynamically linked libraries or, in other operating system
    environments, as dynamic link libraries.


    +   * Support for POSIX 1003.1 standard and in system V and BSD

    POSIX 1003.1 defines a minimum interface to a UNIX-type operating system. This
    standard is now supported by all recent and relatively sophisticated operating
    systems. LINUX (since version 1.2) fully supports POSIX 1003.1. Meanwhile there
    are even LINUX distributions that have gone through the official certification
    process and therefore have the right to call themselves officially ''POSIX compatible''.
    Additional system interfaces for the UNIX V and BSD development lines are also
    implemented. Software written for UNIX can generally be ported directly to LINUX.


    +   * Various formats for executable files

    It is naturally desirable to be able to run under LINUX programs which run in
    different system environments. For this reason, emulators for MS-DOS and MS-Windows
    are currently under development. LINUX can also execute programs from other UNIX
    systems conforming to the iBS2 standard. This includes, for example, many commercial
    programs used by SCO UNIX. Also, in ports to other hardware architectures (for
    example Spare and Alpha), care is taken that the individual ''native binaries''
    can be executed. Thus, there is a wealth of commercial software available to the
    LINUX user without its having specially ported to LINUX.


    +   * Memory protected mode

    LINUX uses the processor''s memory protection mechanisms to prevent the process
    from accessing memory allocated to the kernel or other processes. This is a major
    contribution to the security of the system. An erroneous program can therefore
    (theoretically) no longer crash the system.


    +   * Support for national keyboards and fonts

    Under LINUX, a wide range of national keyboards and character sets can be used:
    for example, the Latini set defined by the International Organization for Standardization
    (ISO) which also includes European special characters.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '+   Different file systems

    LINUX supports a variety of file systems. The most commonly used file system at
    present is the Second Extended (Ext2) File System. This supports filenames of
    up to 255 characters and has a number of features making it more secure than conventional
    UNIX file systems.


    +   Other file systems implemented are the MS-DOS file system and the VFAT system
    for accessing MS-DOS or Windows 95 partitions, the ISO file system for accessing
    CD-ROMs and the NFS for accessing the file systems of other UNIX computers in
    the network. Less widely spread are the AFF file system for accessing the Amiga
    Fast file system, the UPS and the SysyV file systems for accessing Unix file systems
    of other manufacturers, HPFS for accessing OS/2 partitions and the Samba file
    system for accessing file systems exported from Windows computers. Other file
    systems, such as the Windows NT file system used under Windows NT, are under development
    and available as beta versions. What commercial operating system can offer such
    a range?


    +   TCP/IP, SLIP and PPP support

    LINUX can be integrated into local UNIX networks. In principle, all network services,
    such as the Network File System and Remote Login, can be used. SLIP and PPP support
    the use of the TCP/IP protocol over serial lines. This means that it is possible
    to link into the Internet via the public telephone network using a high-speed
    modem.


    # 1.2 LINUX distributions


    To install LINUX, the user requires a distribution. This consists of a boot diskette
    and other diskettes or a CD-ROM. Installation scripts enable inexperienced users
    to install runnable systems. It helps many software packages are already adapted
    to LINUX and appropriately configured; this saves a lot of time. Discussions are
    constantly taking place within the LINUX community on the quality of the various
    distributions; but these frequently overlook the fact that compiling a distribution
    of this sort is a very lengthy and complex task.


    Internationally widely used are the RedHat, the Debian and the Slackware distributions.
    Which of these distributions used is just a matter of taste. Distributions can
    be obtained from FTP servers, e-mail systems, public-domain distributors and some
    bookstores. Sources of supply can be found by consulting specialist magazines
    or the LINUX newsgroups in Usenet.'
  merge: -1
