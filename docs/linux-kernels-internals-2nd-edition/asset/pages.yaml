    # 8.1.1 The layer model of the network implementation


    As communication with network components presents a fairly complex task, it uses
    a layer structure like the file system. The individual layers correspond to levels
    of abstraction, with the level of abstraction from layer to layer, starting with
    hardware.

    When a process communicates via the network, it uses the functions provided by
    the BSD socket layer. This layers carry a range of tasks similar to those handled
    by the Virtual File System and administer a general structure for sockets which
    we shall call BSD sockets. The BSD socket interface has been selected by virtue
    of its widespread use, which simplifies the porting of INET applications, most
    of which are already complex. Below this layer manages the communication end points
    for the IP-based protocols TCP and UDP. These are represented by the data structure
    sock, which we shall call INET sockets.

    In the layers we have mentioned so far, no type distinction is as yet made between
    the sockets in the AF_INET address family. The layer that underlies the INET socket
    layer, on the other hand, is determined by the type of socket, and may be the
    UDP or TCP layer or the IP layer directly. The UDP layer implements the User Datagram
    Protocol on the basis of IP, and the TCP layer similarly implements the Transmission
    Control Protocol for reliable communication links. The IP layer contains the code
    for the Internet Protocol. This is where all the communication streams from the
    higher layers come together.

    Sockets of the SOCK_PACKET type are not included in this survey. Below the IP
    layer is the network devices, to which the IP passes the final packets. True communication
    takes place between two devices, producing a two-way flow of information. For
    this reason, the various layers are also connected in the opposite direction.
    This means that when IP packets are received, they are passed to the IP layer
    by the network devices and processed. The interaction between the different layers
    is illustrated in Figure 8.1.'
