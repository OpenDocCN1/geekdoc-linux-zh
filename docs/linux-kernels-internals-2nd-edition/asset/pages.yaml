  md: '# 4.3 Block device caching


    When judging the performance of a computer system, the speed of access to block
    devices plays a decisive role. LINUX makes use of a dynamic cache system which
    employs primary memory unused by the kernel and the processes as buffer for block
    devices. If the requirement for primary memory increases, the space allowed for
    buffering is reduced. Since version 2.0, block device caching is complemented
    by the file-oriented memory page described further below. Thus, for block devices
    there is not a very unorthodox division of tasks between the two cache systems:
    file-oriented memory page caching is used for read operations, whereas write operations
    recur to the buffer cache. Memory page caching can, in a way, be interpreted as
    an addition to buffer caching, using temporary buffer buffer heads (see below)
    for reading in order to avoid administering data in two cache systems simultaneously.
    In connection with write operations this can lead to additional copying of data
    into the memory page cache. This does not really matter because, compared to read
    operations, write operations occur far less frequently. One can, still think about
    optimization, which would finally lead to management of the same data in the two
    cache systems.


    # 4.3.1 Block buffering


    Files are held on block devices, which can process requests to read or write blocks
    of data. The block size for a given device may be 512, 1024, 2048 or 4096 bytes.
    These blocks must be held in memory via a buffering system. The device itself
    should only be accessed in two events: a block may be loaded if it is not yet
    held in the buffer; and a block may be written if the buffer contents for the
    block no longer match what is held on the external medium. To handle the latter
    case, the respective block in the buffer is marked as ''dirty'' after a modification.
    There may be a delay in performing this write operation, however, as the valid
    contents of the block are held in cache. A special case applies for blocks taken
    from files opened with the flag 0_SYNC. These are transferred to disk every time
    their contents are modified.


    The implementation of the buffer cache in LINUX was originally based, with slight
    modifications, the concept described by Maurice J. Bach (1986) in The Design of
