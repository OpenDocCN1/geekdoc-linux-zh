  md: "# 5.5.2 Semaphores\n\nThe use of semaphores under System V expands the classical\
    \ semaphore model. An array of semaphores can be set up using a system call. It\
    \ is possible to modify a number of semaphores in an array in a single operation.\
    \ A process can set semaphores to any chosen value, and they can be incremented\
    \ or decremented in steps greater than one. The programmer can specify that operations\
    \ are reserved at the end of the process.\nLINUX provides the following data structure\
    \ for every reserved semaphore array:\n\n```\nstruct sendnd_ds {\n    struct ipc_perm\
    \ sem_perm;      /* access permissions */ time_t\n    sem_otime;      /* time\
    \ of Last Semaphore\n                    * operation */ time_t           sem_ctime;\
