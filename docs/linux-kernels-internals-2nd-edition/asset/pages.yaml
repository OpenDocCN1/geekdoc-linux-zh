  md: 'A filter consists of a list of packet patterns. If a packet matches a pattern
    in the list it will be recognized by the corresponding filter. The semantics of
    a filter must however be specified externally.


    Users are provided with a variety of ways of specifying a packet pattern. For
    example, exactly one connection may be specified. In this case, the source and
    destination addresses will be given. The associated masks indicate the entire
    address range (0ffff). The user may specify in addition whether all packet types
    are to be included. However, this can also be restricted to TCP and/ UDP. For
    the UDP and TCP types, the port numbers of the protocol can be specified. For
    each match, the packet counter and counter are incremented by the appropriate
    values.


    ```

    struct ip_fw *fw_next; /* Linking */

    struct in_addr fw_src, fw_dst; /* source and destination *

    struct in_addr fw_smsk, fu_dmsk;

    struct in_addr fw_via;

    struct device *fw_viadev; /* TCP/UDP */

    unsigned short fw_fig;

    unsigned short fw_nsp, fw_ndp;

    unsigned short fw_pts[IP_FW_MAX_PORTS];

    unsigned Long fw_pcnt, -fw_bcnt;

    unsigned char fw_tosand, fw_tosxor;

    char fw_vianame[IFNAMSIZ];

    ```


    But this is not all a pattern can do. Taking the source and destination addresses
    together with the masks, whole networks can be used as patterns. Also, the ports
    for TCP and UDP can be omitted.


