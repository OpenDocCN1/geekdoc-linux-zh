    stored in the process table will be read by the


    function.

    The requests PTRACE_POKEDATA and PTRACE_POKETEXT allow the user area for the process
    under to be modified. If the area is modified protected, the relevant page is
    saved by copy-on-write. This is used, for example, to write a special instruction
