    # 6.4.1 The structure of the Ext2 file system


    The design of the Ext2 file system was very much influenced by BSD''s Fast File
    System (BSD FFS). Thus, a partition is divided into a number of block groups,
    corresponding to the cylinder groups in FFS, with each block group holding a copy
    of the superblock and inode data blocks, as shown in Figure 6.4. The block groups
    are employed with the aim of keeping


    +   * data blocks close to their inodes, and

    * inode blocks to their directory inode


    and thus reducing positioning to a minimum, thereby speeding up access to data.
    As well as this, every group contains the superblock, along with information on
    all the block groups, allowing the file system to be restored in an emergency.

    The physical superblock - defined as the structure ext2_super_block - is shown
    in Figure 6.5. It contains the control information on the file system, such as
    the number of inodes and blocks. The block size used is not held directly, but
    as the dual logarithm of the block size minus the block size supported by the
    Ext2 file system - in a standard case 0. To use this, all that needs to be done
    is ''shift'' the minimum block size

    EXT2_MIN_BLOCK_SIZE by the value given. In addition, the superblock includes information
    on the number of inodes and blocks per block group, along with the times of the
    last mount operation, the last write to the superblock and the last file system
    test.


    | Boot block | Block group 0 | Block group 1 | ... | Block group n |

    |---|---|---|---|---||

    | Superblock | Group descriptors | Block bitmap | Inode bitmap | Inode table |
    Data blocks |


