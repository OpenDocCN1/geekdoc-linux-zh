    # 4.3.2 The update and bflush processes


    The update process is a LINUX process which at periodic intervals calls the system
    call bflush with an appropriate parameter. All modified block buffers that have
    not been used for a certain time are written back to disk, together with all superblock
    and inode information. The interval used by update as a default under LINUX is
    five seconds.


    bflush is implemented as a kernel thread and is started during kernel initialization
    init/main.c. In an endless loop, it writes back the number of blocks marked ''dirty''
    given in the bflush parameter (default 500). Once this is completed, a new loop
    starts immediately if the proportion of modified (''dirty'') blocks to the total
    number of buffers in the cache becomes too high. Otherwise, the process switches
    to the TASK_INTERRUPTIBLE state.


    The kernel can be woken by using the wakeup_bdfLush() function. If the wait parameter
    is set when this function is called, the function will wait until the bflush process
    has completed a circuit of the loop.


    The bflush kernel thread is always activated when a block is released by means
    of brelease(). It is also activated whenever new block buffers are requested or
    the size of the buffer cache needs to be reduced, meaning that old block buffers
    - but not ''dirty'' ones - have to be discarded.'
