    # 9.2.1 Signatures of symbols


    A common problem in module implementation is the module''s rapid dependence on
    the version of the kernel. Because of the continued rapid development of the LINUX
    kernel, exported structures and functions are also in continuous change. For every
    new version of the kernel, therefore, all the modules should be registered to
    make sure that symbols are used in accordance with their definitions. A way out
    of this dilemma is offered by symbol names containing a signature to the associated
    C object (the function or elements of the structure). A similar mechanism is used
    in C++;; for example, for functions and name spaces, where it is unequivocal.


    In the Linux kernel a different model is used, in which the symbols to be exported
    are expanded to their full definitions and 32-bit checksums are calculated on
    the results, which are then added to the original symbol. Although this procedure
    is not unequivocal, the likelihood of a clash is sufficiently small. However,
    this mechanism must be used when configuring the kernel. This is achieved by answering
    ''yes'' to the question


    # Set version information on all symbols for modules


    The creation of this special symbol information is handled by the gensymbols program,
    which is included in the module tools.


    The insmod program included in this automatically tests for matching checksums
    when a module is loaded with signature information. This avoids the situation
    in which a module is loaded that is liable to call a function with the wrong parameters
    or access a structure for which the definition has changed.


    # 9.3 What can be implemented as a module?


    As a basic rule, the aim should always be to use as few symbols or functions from
    the kernel or other modules as possible. In addition, the facility to register
    and unregister module dynamically should be retained. It can be taken as a general
    rule of thumb that there should be a registering and unregistering function for
    the functions implemented by a module. This condition is met by a number of kernel
    elements; the best-known example of this is offered by file system implementations,
    for which there are the register_filesystem() and unregister_filesystem() functions.
    These satisfy all the conditions, including suitable points where the use counter
    can be'
