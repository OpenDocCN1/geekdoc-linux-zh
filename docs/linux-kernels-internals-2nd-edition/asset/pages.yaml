  md: '# PREFACE


    This is the second edition of our book about the LINUX kernel. The book has been
    updated to cover the 2.0 version of the kernel, which is a milestone in the development
    of LINUX. LINUX 2.0 is now the standard UNIX desktop operating system, giving
    you all the power of free UNIX software which has been developed over more than
    25 years, together with a growing number of commercial applications. It is both
    stable and open. There are no hidden secrets. If you want to solve a problem,
    you can get the source code. Such a philosophy is exactly what this book is about.
    We tell you about the LINUX kernel so, you, the experienced computer user, are
    always in control.


    It seems that lot of early LINUX hackers, like ourselves, are now professional
    software developers. As such, it is always helpful to know something about operating
    systems. At least you will have some pieces of really good code. When we started
    to play with LINUX, we did it for fun. Now there is a real return. Seen in this
    light, this book is a good investment.


    Recently some hackers told us that LINUX is boring. They want to have the excitement
    of something really cool and, the joy of seeing something grow from scratch. To
    us, though, developments such as a project to develop a LINUX graphical user interface
    supporting a unique look-and-feel still seem very exciting. Such developments
    will make LINUX usable for the famous ''rest of us''. For a lot of people LINUX
    is a better UNIX than UNIX. We would really love to make a better Windows than
    Windows. Or to put it another way:


    simply make LINUX more like the Macintosh.


    As in every preface, we want to thank all the people who made this edition possible.
    We have to mention Fiona Kinnear from Addison Wesley Longman. This edition would
    not have been published without her commitment.'
