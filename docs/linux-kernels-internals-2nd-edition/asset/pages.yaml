    # 5.2 Communication via files


    Communication via files is in fact the oldest way of exchanging data between programs.
    Program A writes data to a file and Program B reads the data out again. In a system
    in which only one program can be run at any given time,


    this does not present any problems.

    In a multi-tasking system, however, both programs could be run as processes at
    least quasi-parallel to each other. Race conditions then usually produce inconsistencies
    in the data, which result from one program reading a data area before the other
    has completed modifying it, or both processes


    The situation therefore calls for locking mechanisms. The simplest method, of
    course, would be to lock the whole file. For this LINUX, unlike UNIX derivatives,
    offer a range of facilities. More common and more efficient, however, is the practice
    of locking file areas. This locking of file access can be either *mandatory* or
    *advisory*. Advisory locking allows reading and writing to


    the file to continue after the lock has been set.

    However, lock mutually exclude each other, depending on the semantics during their
    respective types. Mandatory locking blocks read and write operations throughout
    the entire area. With advisory locking, all processes accessing the file for read
    or write operations have to the appropriate lock and release it again. If a process
    does not keep to this rule inconsistencies are possible. Mandatory locking provides
    no better protection against malfunctions within processes: if processes have
    write authorization to a file, they can produce inconsistencies by unlocking unrelated
    areas. The problems produced by faulty programs when mandatory locking is employed
    are extremely critical, because locked files cannot be modified as long as the
    process in question is running. Since version 2.0, LINUX supports mandatory locking,
    and the corresponding kernel configuration parameter is by default disabled. For
    the reasons given above and POSIX 1003.1 does not require mandatory locking, this
    is perfectly acceptable.


    If mandatory locking is supported by a generated LINUX kernel, for each file that
    to support mandatory locking the group execution bit must be unset and the SGDI
    bit shared. Mandatory locking does not function with files mapped with mmap()
    and the MAP_SHARED flag.


