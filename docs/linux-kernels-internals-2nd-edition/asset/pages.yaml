  md: '# Linux kernel internals - 210 -


    transfers the data directly from memory to a device without involving the processor.
    The device will generally trigger an IRQ after the transfer, so that the next
    DMA transfer can be prepared in the ISR handling the procedure. This mode is ideal
    for multi-tasking, as the CPU can take care of other tasks during the transfer.
    Unfortunately, there are a number of devices suitable for DMA operation which
    do not support IRQs; some hand-held scanners fall into this category. In device
    drivers for this class of device, the DMA controller must be polled to check for
    the end of a transfer.


    As well as this, DMA operation of devices throws quite a different set of problems,
    deriving in part from compatibility with the ''original'' PCs.


    +   As the DMA controller works independently of the processor, it can access
    physical addresses.


    +   The base address register in the DMA controller is only 16 bytes wide, which
    means that DMA transfers cannot be carried beyond a 64 K boundary. As the first
    controller in the AT performs an 8-bit transfer, no more than 64 Kbytes at a time
    can be transferred using the first four channels. The second controller in the
    AT performs a 16-bit transfer - that is, two bytes are transferred in each cycle.
    As the base address register for this is also only 16 bits wide, the second controller
    attaches a zero, meaning that the transfer must always start at an even address
    (in other words, the contents of the register are multiplied by 2). This allows
    the second controller to transfer a maximum of 128 Kbytes, but not to go over
    any 128 Kbyte boundary.


    +   In addition to the base address register, there is a DMA page register to
    take care of address bits from A 15 upwards. As this register is only 8 bits wide
    in the AT, the DMA transfer can only be carried out within the first 16 Mbytes.
    Although this restriction was removed by the EISA bus and a number of chip sets
    (but not, unfortunately, in a compatible way), LINUX does not support this.


    To overcome this problem, the sound driver of earlier LINUX functions, for example,
    reserved the buffer for DMA transfer to the sound card by means of a special function.


    As the physical addresses in protected mode interfere with the DMA concept, DMA
    can only be used by the operating system and device drivers. Accordingly, the
    sound driver first copies the data to the DMA buffer with the aid of the processor,
    and then transfers them to the sound card via DMA. Although this procedure is
    in conflict with the idea of transferring data without involving the processor,
    it nevertheless makes sense, as it means that attention does not have to be given
    to the use of sound card or other devices. We take a more detailed look at the
    use of DMA below.'
