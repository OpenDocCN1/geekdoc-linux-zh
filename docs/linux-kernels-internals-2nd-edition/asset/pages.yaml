  md: 'The system call pipe creates a pipe, which involves setting up a temporary
    node and allocating a page of memory. The call returns one file descriptor for
    reading and for writing: this is achieved by the use of separate file operation
    vectors.


    For FIFOs there is an open function that allocates the page in memory and returns
    a file descriptor that has been assigned an operation vector with read and write
    operations. Its behaviour is summarized in Table 5.3.


    FIFOs and pipes use the same read and write operations, with the memory assigned
    to the pipe/FIFO interpreted as a circular buffer over which len bytes have been
    written, at start, yet having been read back. These operations always take into
    account the O_NONBLOCK for the descriptor has been set or not: if it is, the read
    and write operations must not block. Unless the number of bytes to be written
    exceeds the internal buffer size for the pipe (4096 bytes as default), the write
    operation must be carried out atomically - that is, if a number of processes are
    writing to the pipe/FIFO, byte sequences for the individual write operations are
    not interrupted. The semantics implemented in LINUX are shown in Tables 5.4 and
    5.5.


