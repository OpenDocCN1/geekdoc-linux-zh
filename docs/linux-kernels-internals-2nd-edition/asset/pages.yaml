    # 5.3 Pipes


    Pipes are the classical method of inter-process communication under UNIX. Users
    of UNIX should not be unfamiliar with a command line such as


    % Is -l | more


    Here, the shell runs the processes Is and, which are linked via a pipe. The first
    process writes data to the pipe, and the second process reads it.

    Another variant of pipes consists of named pipes, also known as FIFOs (pipes also
    operate on the ''First In, First Out'' principle). In the following pages, the
    terms ''named pipe'' and ''FIFO'' will be used interchangeably. Unlike pipes,
    FIFOs are not temporary objects existing only as long as one file descriptor is
    still open for them. They can be set up in a file system using the command


    ```

    mkfifo pathname or

    ```


    ```

    % mkfifo fifo

    % Is -l - fifo

    prw-r--r-- 1 kunitz users 0 Feb 27 22:47 fifo|

    ```


    Linking the standard inputs and outputs of two processes is a little more complicated
    with FIFOs.

    % Is -l >fifo & more <fifo

    There are obviously many similarities between pipes and FIFOs, and these are exploited
    by the LINUX implementation. The inodes have the same specific components for
    pipes and FIFOs.'
