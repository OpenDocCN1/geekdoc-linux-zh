  md: "inode->i_sb->s_op->statfs(inode->i_sb, but, ^sizeof(struct staffs));\n\n```\n\
    return 0;\n}\n```\n\n# Implementation\n\nThe system call is converted via the\
    \ syscall macro.\n\n# Errors\n\nEBADF - if fd is not a valid descriptor. EFAULT\
    \ - if buf points to an invalid address.\n\n| System call | sync | SVR4 |\n| fsync\
    \ | fdatasync | 4.3BSD |\n\nFile: fs/buffer.c\n\n```\nint sys_sync(void);\nint\
    \ sys_fsync(unsigned int fd);\nint sys_fdatasync(unsigned int fd);\n```\n\nsys_sync()\
    \ writes all information stored in memory, such as buffers, super-blocks and inodes,\
    \ to the disk. The function always returns 0.\n\n```\nvoid sync_dev(dev_t dev)\n\
    {\n    sync_buffers(dev, 0); sync_supers(dev);\n    sync_inodes(dev); sync_buffers(dev,\
    \ 0);\n}\n```\n\n```\nasmlinkage Int sys_sync_dev(void) {\n    sync_dev(0);\n\
    \    return 0;\n}\n```\n\nThe function works via sync_dev(0). The specification\
    \ 0 as device means that all block devices are to be synchronized. The parameter\
    \ 0 in sync_buffers() means that waiting for successful execution of write operations\
    \ is not required."
