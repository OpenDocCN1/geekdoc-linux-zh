  md: '# 6 The LINUX file system


    > "My dear Watson, coming by good information is not difficult.

    What is far more difficult is finding it again."

    Conan Doyle, The Adventures of Sherlock Holmes


    # Basic principles 6.3 The Proc file system The representation of file

    6.4 The Ext2 file systems in the kernel


    In the PC field, variety in file systems is common; practically every operating
    system has its own file system, and each of these naturally claims to be ''faster,
    better and more secure'' than its predecessors.


    The large number of file systems supported by LINUX is undoubtedly one of the
    main reasons why LINUX has gained acceptance so quickly in its short history.
    Not every user is in a position to put in the time and effort to convert his/her
    old data to a new file system.


    The range of file systems supported is made possible by the unified interface
    to the LINUX kernel. This is the Virtual File System Switch (VFS), which will
    be referred to below simply as the ''Virtual File System'', although we are not
    dealing with a file system so much as an interface providing a clearly defined
    link between the operating system kernel and the different file systems (as illustrated
    in Figure 6.1).


    The Virtual File Supplies the applications with the system calls for file management
    (see Section A.2), maintains internal structures and passes tasks to the appropriate
    actual file system. Another important job of the VFS is performing standard actions.
    As a rule, for instance, no file system implementation will actually provide an
    lseek function, as the functions of lseek are provided by a standard action of
    the VFS. We are therefore justified in calling VFS a file system.'
