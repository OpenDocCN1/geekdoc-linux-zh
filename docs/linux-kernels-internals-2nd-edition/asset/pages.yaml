    # 5.4 Debugging using ptrace


    No programmer is capable of writing bug-free programs first time. Any freshly
    written software needs to be tested. UNIX provides the system call ptrace, which
    gives a process control over another process. The process under its control can
    be run step by step and its memory can be read and modified. Data can also be
    read from the process table. Debuggers such as gdb are based on the ptrace() system
    call.'
