  md: '# 9 Modules and debugging


    **''Good luck guys,'' chirped the computer, ''impact minus thirty seconds...''**

    Douglas Adams


    +   9.1 What are modules?

    9.2 Implementation in the kernel

    9.3 What can be implemented as a module?

    9.4 Parameter passing

    9.5 The kernel daemon

    9.6 An example module

    9.7 Debugging


    The LINUX kernel is increasing in size as version follows. This is a result of
    both the continuous improvement and expansion of kernel functions and the addition
    of new device drivers, file systems and emulations such as iBCS2. As LINUX is
    a monolithic system, however, all the device drivers and file systems are permanently
    incorporated into the kernel. This means on one hand that when the configuration
    is changed the kernel has to be recompiled, and on the other hand that drivers
    and file systems occupy permanent space in memory even if they are used very rarely.
    One disadvantage makes itself to developers of new kernel code: however trivial
    the modification, it means that a new kernel has to be created and installed and
    the computer rebooted. These and many other reasons have led to the develop ment
    of modules. To begin with, this raises the question: what are modules?


    # 9.1 What are modules?


    From the point of view of the kernel, modules consist of object code linkable
    and removable at run-time, usually comprising a number of functions (at least
    two). This object code is integrated into the already running kernel with equal'
  merge: -1
