    the pointer type is used to determine the number of bytes to be copied. The additional
    functions memcp_bufs() and memcpy_fromfs() are denied to allow the copying of
    any number of bytes and to the user segment.


    The segment selectors for the kernel data (KERNEL_DS) and the user data (USER_DS)
    are defined in asm/segment.h. Functions to read the current data segment selector
    (get_ds()) and to read and set the segment register for the user segment in the
    kernel (get_fs() and set_fs()) are available. These allow system functions within
    the kernel to be called. For this system function all the pointers to the function
