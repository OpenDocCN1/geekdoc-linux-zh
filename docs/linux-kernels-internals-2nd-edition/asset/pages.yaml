    # 4.2 The virtual address space for the process


    As we have already mentioned in the last section, the virtual address space of
    a LINUX process is segmented: a distinction is made between the kernel segment
    and the user segment. for the x86 processor, two selectors along with their descriptors
    must be defined for each of these segments. The data segment selector only permits
    data to be read or modified, while the code segment selector allows code in the
    segment to be executed and data to be read.


    In x86 architecture, the user process can modify its local descriptor table, which
    holds the segment descriptors, by making use of the system call modify_ld. This
    enables a process to enlarge its local address space by additional segments. This
    facility is used, for example, by the Windows emulator WINE to imitate MS-Windows
    segment-based memory management.


