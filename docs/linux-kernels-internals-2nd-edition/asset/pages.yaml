    Figure 2 The directory structure of the LINUX sources.


    For the most part, the LINUX kernel is nothing other than a ''standard'' C program.
    The usual entry function, familiar in C programs as maindt, char **argv), appears
    in LINUX start_kernel(void) and is not given any arguments. In addition, the entry
    for the ''program'' does not exist. This means there is a little preparatory work
    to be done before the first function is called. The assembler routines take care
    of this and are held in the directory apch/i386/boot/. They also configure the
    hardware, so this section is highly machine-specific.


    The appropriate assembler routine loads the kernel. It installs the interrupt
    service routines, the global descriptor tables and the interrupt descriptor tables,
    which are only used during the initialization phase. Address line A20 is enabled,
    and the processor switches to Protected Mode.


    The init/ kernel contains all the functions needed to start the kernel. Among
    the functions held here is start_kernel(), which was mentioned above. Its task
    is to initialize the kernel correctly, taking into account the boot parameters
    passed to it. As we said, this first process is created without using the system
    call fork, that is ''manually''.


    The directories kernel/ and arch/i386/kernel/ contain, as their names suggest,
