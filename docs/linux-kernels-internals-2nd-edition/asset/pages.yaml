    this list contains elements consisting only of the public section of the device
    structure, which runs from the start of the structure to the init component. The
    pointer dev_base points to the start of this list. By modifying this list it can
    determine which initialization functions are used. This is especially important
    for the different types of Ethernet card, as the separate card types are tested
    in sequence in the ethif_probe function.


