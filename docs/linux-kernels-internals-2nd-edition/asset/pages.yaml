    # Figure 9.3 Operation of the User file system.


    Device drivers communicating with the hardware via interrupts need, at the very
    least, purposeful support by the LINUX kernel, as this alone has the right to
    handle interrupts. Only the really necessary functions are implemented in the
    kernel; the actual work should be handled by a normal process. The User file system
    is a rather good example of this approach. However, it is not part of the standard
    kernel: it can be found in the directory src/extensions/userfs-0.8.1 on the CD-ROM
    accompanying this book.


    The logical grouping of data on a physical device is traditionally carried out
    in the operating system kernel, although strictly speaking this is not where it
    belongs. The User file system enables this set of functions to be located in an
    ordinary process. The kernel merely contains an interface for the queries, which
    are then forwarded to the process. One advantage is immediately obvious: the greater
    part of the code is in a normal process, which means that it can be debugged using
    the standard tools. A further advantage becomes apparent when we consider why
    the file system implementation always has access to a hard disk or similar. The
    process can make data it likes available as a file system. Thus, in the current
    implementation of the User file system there is also an FTP file system, which
    accesses the data via the FTP protocol. This means any FTP server be made available
    to the user as he/she were accessing it via NFS. This is one disadvantage of the
    User file system architecture that should not be ignored, however: access to data
    is not particularly fast.


