- img_proc: true
  md: '# Linux kernel internals - 162 -


    different directories (in the form of a hard link). In older versions of UNIX
    it was still possible to modify directory files using a simple editor, to ensure
    consistency this is no longer permitted in recent versions. LINUX file systems
    will not even allow these to be read with normal system calls.


    The basic structure is the same for all the UNIX file systems (see Figure 6.3).
    Each file system starts with a boot block. This block is reserved for the code
    required to boot the operating system (see Appendix D). As file systems should
    be able to exist on any block-oriented device, and on each device, in principle,
    they will always have the same structure (to ensure uniformity), the boot block
    will be present whether not the computer is booted from the device in question.


    All the information which is essential for managing the file system is held in
    the superblock. This is followed by a number of inode blocks containing the inode
    structures for the file system. The remaining blocks for the device provide the
    space for the data. These data blocks contain ordinary files and directory entries
    and the indirect blocks. As file systems must also be implemented on different
    devices, the implementation of the file system must also adapt to device-level
    characteristics, such as block size, and so on. At the same time, all operating
    systems aim for device independence, which will make it whatever media the data
    have been stored on. In Linux, this task is handled by the respective file system
    implementation, enabling the Virtual File System to work with device-independent
    structures.


    In UNIX, the separate file systems are not accessed via device identifiers (such
    as drive numbers), as is the case for other operating systems, but combined into
    a hierarchical directory tree.


    This arrangement is built up by the action of mounting the file system, which
    adds another file system (of whatever type) to an existing directory tree. A new
    file system can be mounted onto any directory. This original directory is then
    known as the mount point and is covered up by the root directory of the new file
    system with its subdirectories and files. Unmounting the file system releases
    the hidden directory structure again.


    A further aspect of major importance to the quality of a file system is data security.
    On the one hand, this comprises facilities to maintain consistency and mechanisms
    ensuring data protection. On the other hand, the file system should behave robustly
    in the event of system faults, corruption of data or program crashes.


    | Boot block | Superblock | Inode blocks | Data blocks |

    |---|---|---|--|

    |0 | | 2... | |


