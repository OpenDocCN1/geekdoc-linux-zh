  md: "# 8.3.1 Ethernet\n\nLINUX supports two groups of adapters for Ethernet. These\
    \ include on the one hand the classic Ethernet cards connected to the PC bus,\
    \ and the other adapters linked to the PC via the parallel interface or the PCMCIA\
    \ bus.\n\nThe network devices for Ethernet cards are named 'eth0', ..., 'eth3'.\
    \ This also applies for pocket adapters operated via the PCMCIA bus, which included\
    \ as a module. LINUX assigns cards to devices in the sequence in which the hardware\
    \ is detected. On start-up, the kernel outputs a message on the cards detected\
    \ and their allocation to the network devices. For modules, of course, this output\
    \ only takes place at the time of loading.\n\nInformation on which cards and/or\
    \ adapters LINUX supports can be found in the 'Ethernet HOWTO'. Cards compatible\
    \ with the WD8013 and NE2000 cards are supported, a large number of inexpensive\
    \ Ethernet adapters are available.\n\nLet us take a look at the Ethernet device\
    \ held in the field dev_addr. Every Ethernet adapter has a completely unique address.\
    \ These addresses are 6 bytes long; for example, represented as text, would be\
    \ 0:0:c0:9b:13:29. After the network device has been configured with an IP address,\
    \ in the entry in the ARP table is generated when the card is selected (see ifconfig\
    \ Appendix B.8).\n\nA field in the hardware header of an Ethernet packet allows\
    \ various types of Ethernet packet to be differentiated. There are types for IP,\
    \ ARP, IPX and other protocols. The type determines which receive function the\
    \ packet is passed to.\n\nThe allocation of packet types is carried out with the\
    \ aid of a list. It is possible to carry out dynamic modifications on the known\
    \ packet types. For IP, for example, there is a list element as follows:\n\n```\n\
    static struct packet_type ip_packet_type = {\nhtons(ETH_P_IP),\n  ip-rcv, NULL,\
    \ NULL };\n```\n\nThis entry contains both the Ethernet packet type and the associated\
    \ receive function. The first zero indicates that no copies are to be made of\
    \ packets of this type. At the position of the NULL pointer, there may be a pointer\
    \ to special data. The final pointer links the elements in the list of all packet\
    \ types.\n\n> The 'Ethernet HOWTO' is located in the file docs/HOMTO/Ethernet-HOWTO\
    \ on the CD-ROM accompanying this book."
