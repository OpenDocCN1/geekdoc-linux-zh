  md: '# # 10 Multi-processing


    +   10.1 The Intel multi-processor specification

    10.2 Problems with multi-processor systems

    10.3 Changes to the kernel

    10.4 Compiling LINUX SMP


    Even though ever more advanced and faster processors are entering t market, there
    will always be applications that require still more process power. In multi-tasking
    systems, a solution to this problem is to employ sevel processors in order to
    achieve true parallel processing of tasks. As in tru parallel systems, performance
    does not increase linearly with the number processors employed. Rather, it is
    the operating system that bears an increas responsibility to distribute all tasks
    among the processors in such a way that few processors as possible hamper each
    other. This chapter deals with Symmetric Multi Processing (SMP) which is supported
    by LINUX version 2.0.


    # ## 10.1 The Intel multi-processor specification


    Most of the currently available multi-processor main boards for PCs use i4 Pentium
    or Pentium Pro processors. The Pentium already has inter functions which support
    multi-processor operation, such as cache synchro zation, inter-processor interrupt
    handling and atomic operations for check setting and exchanging values in main
    memory. Cache synchronization particular greatly facilitates SMP implementation
    in the kernel.'
