  md: 'Pre-allocation

    If a free block is found, up to eight following blocks are reserved (if they are
    free). When the file is closed, the remaining blocks still reserved are released.
    This also guarantees that as many data blocks as possible are collected into one
    cluster. Preallocation of blocks can be deselected by removing the definition
    of EXT2_PREALLOC from the <linux>/ext2_fs.h.


    How is the target block itself determined? Let n be the relative number in the
    file of the block to be allocated and the I block number of the last block allocated.
    The block allocation algorithm then applies the following heuristics in the order:


    +   * The last block allocated has the relative number n-1. The target block is
    therefore 1+1.

    * All existing blocks in the file, starting at block n-1, are scanned to confirm
    that they have been assigned logical blocks (that is, the block is not a ''gap'').
    The target block is given by the number I of the first already allocated block
    found.

    * The target block is the first block in the group in which the inode for the
    file is located.


    # 6.4.4 Extensions of the Ext2 file system


    The Ext2 file system has additional file attributes beyond those which exist in
    standard UNIX file systems (see Table 6.4). In version 0.5a, which is current
    at the time of writing, these are:


    # EXT2_SECRM_FL


    If a file has this attribute, its data blocks are first overwritten with random
    bytes before they are released via the truncate function. This ensures the content
    of the file cannot possibly be restored after it has been deleted.


    # EXT2_UNRM_FL


    This attribute will eventually be used to implement the restoration of deleted
    files. At present, however, this function is not implemented. EXT2_COMPR_FL this
    attribute will be used to indicate that the file has been compressed. Up to the
    present, online compression has not yet been implemented.


    # EXT2_SYNC_FL


    If a file has this attribute, all write requests are performed synchronously,
    that is, not delayed by the buffer cache.'
