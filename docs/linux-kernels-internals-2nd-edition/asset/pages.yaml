    # 7.3.2 Automatic interrupt detection


    On many expansion cards, the IRQ used has to be set by means of jumpers. Only
    the latest expansions, such as PCI or Plug-and-Play, allow the configuration of
    the expansion card to be set up and read out. As a result, programmers are often
    faced with the problem of determining the IRQs used during kernel initialization.
    However, automatic interrupt detection constitutes a factor of insecurity and
    can lead to a system crash, it should be avoided during the loading of modules.


    The methodology for detecting IRQs used is always the same, and simply involves
    assigning all possible IRQs and ''forcing'' the relevant device or expansion card
    to trigger an IRQ. If only one of the previously IRQs is triggered, the answer
    has in all probability found. All that remains to release all the other IRQs.

