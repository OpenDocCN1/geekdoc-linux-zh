  md: '# Linux kernel internals – – 308 –


    local APICS, together with the I/O APICS, constitute a unit which deals with the
    distribution of incoming interrupts.



    One processor is chosen by the BIOS; it is the boot processor (BSP) and is used
    for system initialization. All other processors are called application processors
    (AP) and are initially halted by the BIOS. The MP specification defines a configuration
    structure which is filled by the BIOS and informs the operating system about the
    existing MP system. The BIOS initially forwards all interrupts to the boot processor,
    so that single-processor systems see no difference and run only on the BSP.


    # 10.2 Problems with multi-processor systems


    For the correct functioning of a multi-tasking system it is important that data
    in the kernel can only be changed by one processor so identical resources cannot
    be allocated. In Unix-like systems, there are two approaches to the solution of
    this problem. Traditional UNIX systems use a relatively coarse-grained locking;
    sometimes even the whole kernel is locked so that only one process can be in the
    kernel. Some more advanced systems implement a finer-grained locking, which, is
    normally used for multi-processor and real-time operating systems. In the latter,
    fine-grained locking reduces the time that a lock must be kept, allowing a reduction
    of the particularly critical latency time.


    In the LINUX kernel implementation, various rules were established. One of them
    is that no process running in kernel mode is interrupted by another process running
    in kernel mode, except when it releases control and sleeps. This rule ensures
    that large areas of the kernel code are atomic with respect to other processes
    and thus simplifies many functions in the LINUX kernel.


    A further rule establishes that interrupt handling can interrupt a process running
    in kernel mode, but that in the end control is returned to this same process.
    A process can block interrupts and make sure that it will not be interrupted.


    The last rule is that for us states interrupt handling cannot be interrupted by
    a process running in kernel mode. This means that interrupt handling will be processed
    completely, or at most interrupted by another interrupt of higher priority.


    In the development of the multi-processor LINUX kernel a decision was made to
    maintain these three basic rules, on the one hand to facilitate the first implementation,
    on the other to allow a simple integration of already existing code. Each single
    semaphore is used by all processors to monitor the transition to kernel mode.
    Each processor that owns this lock can always enter kernel mode, for example for
    interrupt handler. Soon as the process no longer owns the lock, it is no longer
    allowed to change to kernel mode.'
