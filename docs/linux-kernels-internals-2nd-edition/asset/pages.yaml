    sys_link() and sys_symlink create references (hard links) and symbolic references
    (soft links) with the name we refer to oldname. sys_link() first checks the old
    inode using the function name(t), copies name to the kernel segment (for reasons
    of runtime performance) and then calls the function do_link() with the inode.

    sys_symlink() copies oldname and newname and then calls the function do_symLink().
    In addition, the quota structure of the directory in which the reference is created
    initialized.


    sys_rename recreates the file under the name newname and deletes the old file.
    Here too, the quota structure of the directory in which the reference is created
    initialized.

    The sys_unlink() function deletes, with the appropriate rights, the file name

    sys_rmdir() works similarly to sys_unlink(), but removes the directory.


    These kernel functions are internally converted into the corresponding inode operations
    after the necessary rights have been tested.


    # Implementation


    The system calls are converted via the syscall macro.


    # Errors


    +   EACCES - if the directory has no execution rights.

    ENOTENT - if oldname does not exist or the path name is invalid.

    ENOTDIR — if in sys_rmdir() is not a directory.

    EPERM - if the inode of the file does not permit the link, newname is invalid
    or the file system does not support the operation.

    EXDEV if in sys_link0 oldname and newname lie on different file systems.'
