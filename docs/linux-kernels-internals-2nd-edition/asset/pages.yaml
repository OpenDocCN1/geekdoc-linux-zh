  md: '# Linux kernel internals - 319 -


    | System call | fork clone | POSIX Linux |


    File: kernel/fork.c


    Int sys_fork(struct pt_regs regs);

    int sys_clone(struct pt_regs regs);


    sys_fork() generates a new process (child process) as a copy of the current process
    (parent process). In order to be able to distinguish between parent and child
    process, the PID of the child process is returned in the parent process, while
    a 0 is returned in the child process. In LINUX, copy-on-write is used, so that
    only the page tables and the task structure are duplicated. The maximum number
    of processes is limited to the value specified in NR_TASKS. The termination signal
    of the child process is SIGCHLD.


    In order to extend the semantics of the fork system call, LINUX provides a system
    call. By means of the registers, two parameters are passed:


    +   - in regs.ebx this is a pointer used as the stack pointer of the child. If
    it is zero, the stack pointer of the parent process is used. The register regs.exc
    contains the flags and the signal. The signal is located in the lower two bytes
    and is passed to the parent process upon termination of the child. Interestingly
    enough, the signal is later masked out Ox-ft, which would allow up to 255 signals.
    The flags control the ''nursery'' of the new process:


    CLONE_VM - Parent and child process share the same memory pages. If this flag
    is not specified, the memory pages of the child are generated via copy-on-write.


    CLONE_FILES - Parent and child process use the same descriptors. Otherwise, the
    file descriptors are copied.


    CLONE_FS - Parent and child process use the same file system (with the counter
