    \ of queue_xmit is to send the packet in the skb buffer. This action is illustrated\
    \ in Figure 8.5.\n\nThe retransmit function is responsible for a repeat send of\
    \ the packets located at the socket. This is only meaningful for TCP, however.\
    \ The behaviour of this function is controlled by the parameter all, which specifies\
    \ whether packets are to be retransmitted or only the first.\n\nThis is another\
