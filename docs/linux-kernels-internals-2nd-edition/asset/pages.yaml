    # fork


    The system call fork is the only way of starting a new process. This is done by
    creating a (nearly) identical copy of the process that has called fork.


    As a matter of fact, fork is a very demanding system call. All of the process
    have to be copied, and these can easily run to a few megabytes. In the course
    of developing UNIX, a number of methods were adopted to keep the demands of fork
    as small as possible. In the frequently occurring case where fork is followed
    directly by a call to exit, it is not necessary to copy the data, as they are
    not needed. In the UNIX systems from the BSD family, vfork has been set up. Like
    fork, it creates a new process, but shares the data segment between the two processes.
    This is a rather dubious approach, as one process can affect the data of the other
    process. To keep this interference as limited as possible, further execution of
    the process is halted until the child process has either terminated by _exit or
    has started a new program with exec.


    New UNIX systems, as Linux, for example, take a different approach, using the
    copy-on-write technique. The thinking behind this is that a number of processes
    may very well access the same memory at the same time -provided they do not modify
    it.


