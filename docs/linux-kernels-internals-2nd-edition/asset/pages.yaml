    Connectionless and connection-oriented data exchange differ from the first two
    variants by different semantic models. In these models, a process sends messages
    to a process or a specific group of processes.


    In connection-oriented data exchange, the two parties to the communication must
    set up a connection before communication can start. In connectionless data exchange
    a process simply sends data packets, which may be given a destination address
    or a message type, and leaves it to the infrastructure to deliver them. The reader
    will be familiar with these models from everyday life:


    when we make a telephone call we are using a connection-oriented data exchange
    model, and when we send a letter we rely on a connectionless model.


    It is possible to implement one concept (for example, semaphores) based on another
    (for example, connectionless data exchange). LINUX implements all the forms of
    inter-process communication between processes in the same system by using shared
    resources, kernel data structures and the ''wait queue'' synchronization mechanism.
    Although semaphores are available in the kernel for synchronization, themselves
    rely on wait queues.


    LINUX processes can share memory by means of the System V shared memory facility.
    The file system has been implemented from the start to allow files and devices
