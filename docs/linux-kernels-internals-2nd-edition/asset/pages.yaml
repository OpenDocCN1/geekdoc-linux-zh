    # 9.7 Debugging


    Only in vanishing few cases will a section of program code free of bugs soon

    as it is. Usually the program will need debugging, for which it will be loaded

    to a debugger such as gdb and run step by step until the error has been found.

    Unfortunately, software exists which cannot be debugged so easily. This includes
    real-

    time applications, (quasi-) parallel processes and software which runs without
    a host

    operating system. Unfortunately, the Linux kernel (like all operating system kernels)

    matches all three of these conditions. It hardly stresses that changes to an

    operating system kernel are equally -and particularly liable to error. This section

    suggests ways out of the dilemma.


    # 9.7.1 Changes are the beginning of the end


    A useful tip is: Try not to change the kernel, because if you do not amend the

    LINUX kernel, you will not have to debug it and you will save yourself lots of

    problems. Simple though this statement, it is not without meaning for the kernel

    programmer.


    We have no to prevent people carrying out creative work on the Linux kernel.

    However, anyone contemplating this seriously ask him/ herself whether the

    expansion that is planned really has any business in the kernel. It is often possible
    to

    implement it wholly or partly as an external program, or at least to divert some
    of

    functions to an external process. A privileged process (that is, with a UID of
    0) can do

    practically anything a driver in the kernel can do. As often as, communication
    with the

    hardware is only carried out via I/O ports, and a privileged process can do that.
    This

    approach is used in the svgalib library, which takes care of controlling the graphic
    modes

    for various SVGA cards. Of course, there are also cases where this approach does
    not

    achieve the desired result.'
