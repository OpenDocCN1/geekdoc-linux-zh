    Apart from the elements necessary for linking the entries, an entry in the ARP
    table contains the protocol address and, if, a reference to the list of hardware
    headers. The use of an entry is largely determined by flags. If ATF_COM remains
    unset, this means it has not yet been possible to determine the hardware addresses.
    As the ARP is hardware-dependent information, each element is assigned to a network
    device. The device to be used can be determined via the protocol''s routing function;
    also all queries are sent via this device. To resolve hardware addresses, it is
    sometimes necessary to send the query several times. When a query is generated,
    the timer (is) is set. If it has expired and no further repeat is indicated, the
    query is considered not to have been answered. To make it simple to generate individual
    replies, the buffer that contains the packet at the chart has not yet been given
    a reply


    marked.

    Proxy entries are marked with an ATF_PUBL flag and of course permanent. With ''proxy''
    ARP it is also possible to use subnet entries, which are then given an ATF_NETMASK
    flag. We also find the netmask belonging


    to the subnetwork.

    The following tasks are assigned to the ARP software:


    +   * Address resolution for its own IP layer.

    * Address resolution for queries from other hosts in the network.

    * If the resolution of the machine''s IP address is required by another host,
    a reply packet is sent to the remote enquirer.

    * Query generation for IP addresses not contained in the table.'
