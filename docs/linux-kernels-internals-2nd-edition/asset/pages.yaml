  md: '# APPENDIX A


    # System calls


    Call unto me, and I will answer thee, and show thee great and mighty things whichich
    thou knowest not.


    Jeremiah 33:3


    This appendix describes the implementation of all system calls in LINUX. With
    regard to architecture-dependent implementations, the emphasis'' is on the LINUX
    system running on the Intel PC. A description of the other architectures is not
    possible for several reasons (including time and the lack of documentation). A
    basic knowledge is given in the previous chapters. We also recommend having a
    look at the corresponding source files of the kernel.


    A precise distinction has to be made between the system call^2 and its corresponding
    kernel function. A system call is the transition of a process from user mode to
    system mode. In LINUX this is done by calling the interrupt 0x80, with the actual
    register values. The kernel (in system mode) calls a kernel function out of the
    _sys_call_table table. These functions, which in the source text begin with _sys_
    , are described in the following sections.


    The conversion from a function used by a program to the system call is carried
    out in the C library. This allows, for example, several functions to be handled
    with one single kernel function, as is so rather noticed by sys_syscall(). Such
    functions have a typical characteristic: parameters whose structure can be passed
    to the kernel function as unsigned Long, which is then used as an address. In
    LINUX it is common to provide generally known system calls as library functions
    - which blurs the borderline between system calls and C library functions.


    > * It is, however, explicitly mentioned when a system call is not available for
    a different architecture.


    > ^2 The discussion ''What is a system call?'' kept us busy tore for a while!'
