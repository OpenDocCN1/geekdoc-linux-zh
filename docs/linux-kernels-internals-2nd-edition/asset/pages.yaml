    # 4.4 Paging under LINUX


    The RAM memory in a computer has always been limited and, compared to fixed disks,
    relatively expensive. Particularly in multi-tasking operating systems, the limit
    of working memory is quickly reached. It was not long before someone hit on the
    idea of offloading unused areas of primary storage (RAM) to secondary storage
    (for example, a hard disk).


    The traditional procedure was the so-called ''swapping'', which involves saving
    every process from memory to a secondary medium and reading them in. This approach
    does not solve the problem of running processes with large memory requirements
    in the available primary memory. Besides this, saving and reading in while processes
    is very inefficient.


    When hardware architectures (VAX) were introduced, the concept of demand paging
    was developed. Under the control of a memory management unit (MMU) the entire
    memory is divided into pages, with only complete pages of memory being read or
    saved. As all modern processor architectures, including the x86 architecture,
    support of managed memory, demand paging is employed by LINUX. Pages of memory
    which have been mapped directly to the virtual address of a process using _mmap()
    without write authorization are not saved, but simply discarded. Their contents
    can be read from the files with which they were modified. Modified memory pages,


    in contrast the kernel segment cannot be saved, for the simple reason that routines
    and data structures which read memory pages from secondary storage must be present
    in primary memory. The most straightforward way of making sure that this is the
    lock of all of the kernel segment pages against saving.


