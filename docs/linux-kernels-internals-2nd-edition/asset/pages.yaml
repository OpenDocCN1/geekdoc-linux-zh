  md: '# Linux kernel internals


    If the entry being made is already in the cache, it is revised to make it the
    youngest in its list, and the function terminates. A new entry, however, is always
    inserted in level 1. This involves the oldest element, pointed to by the pointer
    level1_head, being first removed from the hash table and then overwritten with
    the new directory entry. The pointer level1_head is moved by one entry, so that
    the newly inserted entry becomes the youngest.


    The function


    ```

    Int dcache_lookup(struct mode * dir, const char * name, int Len, unsigned long
    ino);

    ```


    is used to interrogate the cache. If the entry name cannot be found, the function
    returns zero. If the entry is found in the cache, it is promoted to level 2, where
    it is entered (or updated, if it was already there). The inode number of the directory
    entry is returned in the argument i, and the function returns a 1.


    Special importance is attached to the component i_version in the inode structure.
    This component is compared with the version component in the cache entry, and
    only if the two match is the cache entry still valid. Every file system implementation
    must give due attention to the fact that this version is incremented each time
    the inode of a directory is modified; otherwise it could happen that a directory
    entry which is no longer in the cache. Fortunately, however, this version can
    be simply updated by the line:


    ```

    dir->i_version = ++event;

    ```


    The variable event is defined in <linux/sched.h> as an unsigned long. This range
    of values is wide enough to exclude any risk of overlap.


    The directory cache serves to speed up the lookup function specific to a file
    system, although it is at present used only by the Ext2 and ISO 9660 file systems.
    Finally, it should be mentioned that the directory cache is particularly effective
    in speeding up file access in systems with relatively little memory. On systems
    with larger memory, this is used for caching block devices anyway, and therefore
    also maintains directories in memory.


