    sys_llseek(unsigned int fd, unsigned long offset_high,

    unsigned long offset_low, Loff_t * result,

    unsigned int inorigin);


    sys_lseek() sets a new current position in the file relative to offset and origin.

    LIN first tries to use the sys_lseek() function of the file system to check the
    file it belongs. If this does not possess an seek function, the kernel calculates
    the new position itself. The following values are permitted for origin:


    +   - SEEK_SET - offset indicates the absolute position.

    - SEEK_CUR - the new position is the sum of offset and the current position.

    - SEEK_END - sys_lseek0 positions relative to the end of the file.


    The new absolute address is returned. Current position and file size can then
    be easily determined

    pos = lseek(fd, 0, SEEK_CUR); size = lseek(fd, -1, SEEK^END);

    The sys_llseek() function is used to position in larger files. To do this, a new
    offset of type long is assembled from offset_high and offset_low.

    offset = (loff_t))(((unsigned long)offset_high << 32) | offset_low);


    If the file system supports a SeekO inode operation, this is called. Then, however,
    the offset values are limited to the long range; higher values return an error!.
    Otherwise, the function tries to calculate the new position itself. This function
    returns 0 on success. The new position is stored in result.


    # Implementation


    While the system call (see* is converted, as usual, via the syscall macro, exists
    only a restricted implementation in the C library for sys_llseek() on

    Intel computers.


