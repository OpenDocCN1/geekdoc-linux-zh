  md: '# Device drivers under LINUX


    > A computer terminal is not an old lump of a television

    with a typewriter keyboard sitting in front of it.

    It is an interface

    connecting body and spirit with the universe

    and enabling bits of it to be moved around.

    Douglas Adams


    I Character and block devices 7.4 Implementing a driver ! Polling and interrupts
    7.5 An example of DMA $ The hardware operation


    There is a wide variety of hardware available for LINUX computers. This means
    that a wide variety of software is required to operate this hardware. This is
    the job of device drivers. Without these, an operating system like LINUX would
    have no means of input or output (such as a keyboard and a monitor) and no file
    systems. Device drivers are the nuts and bolts of any operating system.


    In addition, the computer hardware in UNIX systems is to be hidden from the user,
    limiting its functions. This is done by having physical devices represented by
    files, which allows portable programs to be developed that can access both the
    various devices and the files with the same system calls, for example read and
    write. To handle this, device drivers are integrated into the LINUX kernel and
    given exclusive control of the hardware.


    As a result, if a device driver has been properly implemented, the corresponding
    device can never be used wrongly by the user. This protective function of a device
    driver should not be underestimated.


    In this chapter, we shall demonstrate the functioning and the correct implementation
    of device drivers. The example chosen is the PC speaker driver, which supports
    the output of sound samples to the internal speaker or a digital-analog converter
    connected to the parallel interface. It is also designed to be compatible with
    the sound card driver.'
  merge: -1
