    \n# Errors\n\nEBADF - if fd is invalid. ENOENT - if file_name does not exist.\n\
    \n| System call | statfs | SVR4 |\n| --- | --- | --- |\n| fstatfs | | |\n\nFile:\
    \ fs/open.c\n\n```\n#include <sys/vfs.h>\n\nint sys_stats(const char *path, struct\
    \ staffs *buf);\n sys_fstatfs(unsigned int fd, struct staffs *buf);\n```\n\nThe\
    \ sys_stats(f) function returns the information about the file system on which\
    \ the path is located. In sys_fstat0 a descriptor is specified instead of the\
    \ name. The structure is defined in <linux/vfs.h>:\n\n```\nstruct staffs {\nlong\
    \ f_type;   /* type of file system */\nlong f_bsize;  /* optimum block size */\n\
    long f_blocks; /* number of blocks */\n long f_bfree;  /* total number of free\
    \ blocks */\n long f_bavail; /* free blocks for user */\n long f_files;  /* number\
    \ of inodes */\n long f_free;   /* number of free inodes */\ntsid_t f_fsid;  /*\
    \ file system ID */\nlong f_namelen;/* max. file name length */\nlong f_sparseC63;/*\
    \ not used */\n};\n```\n\nFields are not defined in the file system are set to\
    \ -1. The data are read using the superblock operations (see Section 6.2.2).\n\
    \n```\nasmlinkage int sys_stats(const char * path, struct staffs * but)\ncrpor=nameT(path,&inode);\
    \ if (error) return error;\n```"
