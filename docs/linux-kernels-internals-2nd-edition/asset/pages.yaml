  md: '# #2 Compiling the kernel


    > A system is anything with no system to it,

    hardware is anything that clatters when you drop it,

    and software is anything/or which there is a logical explanation

    why it''s not working.

    Johannes Leckebusch


    Before we go on to study the inner life of the LINUX kernel in the following chapters/we
    first take a look at the source and compiled versions of the kernel.


    # ## 2.1 Where is everything?


    As the source codes have already grown to a quite considerable size," different
    parts of the kernel can be found in different directories.

    In the LINUX system, the sources normally be found under /usr/src/Linux. In the
    following chapters, therefore, the pathnames given are always relative to this
    directory.

    The exact directory structure is shown in Figure 2.1.

    The exact directory structure is shown in Figure 2.1.

    Ongoing porting to other architectures has resulted in changes as compared with
    version 1.0 of the kernel. Architecture-dependent code is held in the subdirectories
    of arch/. This at present contains the directories arch/alpha/ for the DEC Alpha,
    arch/1386/ for the Intel 386 and compatible processors, arch/nips/ for the MIPS
    architecture, arch/ppc/ for the PowerPC architecture and arch/spare/ for the port
    to Spare workstations.

    As LINUX is mainly used on PCs, we will only be considering this architecture
    in what follows.'
  merge: -1
