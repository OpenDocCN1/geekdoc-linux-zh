    # 3.2.4 Timer interrupt


    All operating systems use a way of measuring time and keeping a system time. The
    system is usually implemented by arranging the hardware to trigger an interrupt
    at specified intervals. These interrupt routines take over the time ''counting''.
    Under LINUX, system time is measured in ''ticks'' since the system was started.
    One tick represents 10 milliseconds, so the timer interrupt is triggered 100 times
    per second. The time is stored in the variable


    ```

    unsigned Long volatile jiffies;

    ```


    which should only be modified by the timer interrupt. However, this method provides
    only an internal time base. Applications, on the other hand, are more interested
    in the ''actual time''. This is held in the variable


    ```

    volatile struct timeval;

    ```


    which is updated by the timer interrupt. The timer interrupt is called relatively
    often and is therefore somewhat time-critical. Therefore, its implementation in
    the 2.0 kernel is no longer clear as it was in version 1.0. The interrupt routine
    properly updates the variable jiffies and marks the bottom half routine (see Section
    7.2.4) of the timer interrupt as active. This is called by the system at a later
    point (after handling other interrupts) and carries out the rest of the work.
    Since several timer interrupts can occur before the handling routines become active,
    the timer interrupt also


    increments the variables


    ```

    unsigned long Lost_ticks;

    unsigned long lost_ticks_system;

    ```


    so that these can later be evaluated in the bottom half routines.

    lost_ticks counts the timer interrupts that have passed since the last call of
    the bottom half routine, whereas lost_ticks_system counts the timer interrupts
    during whose occurrence the interrupted process was in System Mode.'
