    address space is structured as a kernel segment plus a user segment. Code and
    data for the kernel can be accessed in the kernel segment, and code and data for
    the user segment. A virtual address is given by reference to a segment selector
    and the offset within the segment. When code is being processed, the segment selector
    is already set and only offsets are:


