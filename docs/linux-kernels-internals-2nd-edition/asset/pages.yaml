  md: 'rights, which means that it runs in system mode. The monolithic structure of
    the kernel is not changed: unlike the microkernel, the newly added functions do
    not run as processes in their own right. One advantage of implementing device
    drivers or file systems as modules is that only the documented interfaces can
    be used.


    For the user, modules enable a small and compact kernel to be used, with others
    only being added and when required. With the kernel daemon support of version
    2.0, it is even possible to load atomically, without the user having to attend
    to him/herself. As a further example we can mention the PCMCIA


    The structure of the source text for the LINUX kernel is described in Section
    2.1. The C files are organized in directories comprising functional groupings
    of various kinds. On compilation, the functional sub-units are collected into
    an object file, so that when the kernel is subsequently loaded as a whole there
    is no need to access every object file individually. These functional units can
    be used as modules.


    # 9.2 Implementation in the kernel


    Now that we have the advantages of using modules, we will consider their implementation.
    This, LINUX provides three system calls: create_module, init_module and delete_module.
    A further system is called by the user process to obtain a copy of the kernel''s
    symbol table.


    The administration of modules under LINUX makes of a list in which all the modules
    loaded are included. The form of the entries is shown on page 299. This list also
    administers the modules'' symbol tables and references.


    As far as the kernel is concerned, modules are loaded in two steps corresponding
    to the system calls module and init_module. For the user process, this procedure
    divides into four phases.


    +   (1) The process fetches the content of the object file into its own address
    space. In a normal object file the code and the data are arranged as if they started
    from address 0 after loading. To get the code and data into a form in which they
    can actually be executed, the actual load address must be added at various points.
    This process is known as relocating. References to the required points are included
    in the object file. There may also be unresolved references in the object file.
    When the object file is analysed, the size of the object module is also obtained
    (see Figure 9. la).


    > * Further details on the structure and use of object files can be found in Gircys
    (1990) and ELF (executable and linkable format).'
