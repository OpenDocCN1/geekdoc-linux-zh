  md: '# # Memory management


    Data memories consist of thousands of memory cells. This means that the individual
    cells must be arranged according to a purposeful and as far as possible simple
    system.


    John S. Murphy


    +   - 4.1 The architecture-independent memory model in LINUX

    - 4.2 The virtual address space fora process

    - 4.3 Block device caching

    - 4.4 Paging under LINUX


    > The quotation above is taken from a book originally published in 1958. The demands
    made of memory management systems have changed radically since then, and hardly
    any applications can get by only a few thousand memory cells. But the need for
    simplicity and purposefulness is as relevant as ever.


    A multi-tasking system like LINUX makes particular demands of memory management.
    The memory belonging to a process and that used by the kernel need to be protected
    against access by other processes. This protection is vital to the stability of
    a multi-tasking operating system. It prevents a process from writing at random
    into other processes'' areas of memory, causing them to crash. This can be caused
    in a C program, for example, simply by exceeding


    The limits of a field variable.

    Durious programming methods, as uncontrolled modification of system data, will
    certainly be used if they are not specifically excluded. Memory protection stops
    programmers affecting the stability of the system as a


    result of programming tricks.


    Primary memory (RAM) has always been a scarce resource, and still is.

    As the amount of working memory regularly available has grown, the memory'
