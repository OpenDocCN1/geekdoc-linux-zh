  md: "It might be asked what a network device of this sort is. It is mostly used\
    \ to present a functioning network device to the higher-level areas of the network\
    \ implementation when there is not actually one present. By the higher-level areas\
    \ of the network implementation we also mean user processes.\n\n# 8.4 ARP - the\
    \ Address Resolution Protocol\n\nAs the names imply, the task of the ARP is to\
    \ convert the abstract IP addresses into real hardware addresses; this conversion\
    \ is required because a hardware network cannot do anything with IP addresses.\
    \ The ARP is not restricted to one hardware type, but can resolve addresses for\
    \ a number of types of network (for example, FDDI, Ethernet and so). The only\
    \ condition made on the hardware is a facility to send a packet to all the other\
    \ stations on the network (in other words, to broadcast). The LINUS ARP is capable\
    \ of mapping Ethernet addresses, archnet addresses and AX.25 addresses to the\
    \ corresponding IP addresses. This is the reason for the rather odd position in\
    \ which the ARP is drawn in Figure 8.1: it does not belong directly to the IP,\
    \ although to now only IP addresses have been considered as protocol addresses.\n\
    \nThe reverse function is handled by RARP (reverse ARP). Unlike ARP, the RARP\
    \ in LINUX is at present only convert Ethernet addresses into IP addresses.\n\n\
    A further facility offered by LINUX is 'proxy' ARP. This enables subnetworks which\
    \ should really be directly interconnected by hardware to be separated. The separate\
    \ parts are usually provided in each subnet with gateways to communicate with\
    \ each other. The gateway in each subnet responds to ARP requests from local computers\
    \ with its own hardware address. If packets for a remote computer are received\
    \ at the gateway, it forwards these to the appropriate gateway.\n\nThe central\
    \ element in address resolution is the ARP table, which consists of a field of\
    \ pointers to structures of the type arp table. The size of the table is ARP_TABLE_SIZE,\
    \ which is defined in net/arp.h. It must always be a power of 2, as this is assumed\
    \ by the hash function. In LINUX, there is only one such table and not, as might\
    \ be expected, for each network interface. This makes the ARP entries easier to\
    \ administer.\n\n```\nstruct arp_table {\n    struct arp_table      *next;\n \
    \   volatile unsigned long last_used;\n    volatile unsigned long last_updated;\n\
    \    unsigned int          flags;\n    u32                  ip;\n    u32     \
    \             mask;\n}\n```"
