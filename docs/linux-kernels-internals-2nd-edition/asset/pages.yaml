    # 7.1 Character and block devices


    There are two basic types of devices: block-oriented devices and character-oriented
    devices.³ Block devices are those to which there is random access, which means
    that any block can be read or written to at will. In LINUX, these read and write
    accesses are handled transparently by the cache. Random access is an absolute
    necessity for file systems, which means they can only be mounted on block devices.

    Character devices, on the other hand, are devices which can usually only be processed
    sequentially without a buffer. This class includes the most common hardware, such
    as sound cards, scanners, printers and so on, even where their internal operations
    uses blocks.⁴ These blocks, however, are sequest in nature, and cannot be accessed
    randomly.

    Beyond this, LINUX deviates from the general UNIX philosophy, as it does not draw
    such a strict distinction between block and character devices. Thus, in other
    systems there are character devices corresponding to each of the block devices
    - that is, character-oriented interfaces to block devices which are primarily
    used to control⁵ the device itself. In LINUX, the interface (VFS) to block and
    character devices is the same, which means that no additional character devices
    are required.


    > ² After when this position is without an incumbent, the job has now been taken
    over by H. Peter Anvin (Peter.Anvin3Linux.org). ³ Referred to below simply as
    "block devices" and "character devices". ⁴ If largeamounts of data need to be
    transferred, block transfer, for example DMA, is preferable.

    5 Control programs for block devices in other UNIX systems, such as mkfs or fsck,
    operate on the corresponding character-oriented raw device.'
