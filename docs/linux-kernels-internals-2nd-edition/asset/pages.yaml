    \ memory or a notebook, a computer has to resort to other means. A central demand\
    \ made of a file system is the purposeful structuring of data. When selecting\
    \ a purposeful structure, however, two factors not to be neglected are the speed\
    \ of access to data and a facility for random access.\nRandom access is made possible\
    \ by block-oriented devices, which are divided into a specific number of equal-sized\
    \ blocks. When using these, LINUX also has at its disposal the buffer cache described\
    \ in Section 4.3. Using the functions of the buffer cache, it is possible to access\
    \ any of the sequentially numbered blocks in a given device. The file system itself\
    \ must be capable of ensuring unique allocation of the data to the hardware blocks.\n\
