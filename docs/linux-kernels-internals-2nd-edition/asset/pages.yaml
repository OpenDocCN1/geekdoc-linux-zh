  md: '# Linux kernel internals - 299 -


    Communication between the Linux kernel and the kernel daemon is carried out by
    means of IPC. The kernel daemon opens a message queue with the new flag IPC_KERNEL.
    This queue is then automatically used by the kernel as a message queue for the
    kernel daemon. For this purpose, the existing IPC implementation extended with
    the function


    ```

    int kerneld_send(int msgtype, int return_size, int msgsz,

    const chap *text, const char *return_value);

    ```


    which is responsible for sending messages to the kernel daemon. The following
    structure is transmitted:


    ```

    struct kerneld_msg {

    long mtype;

    long id;

    short version;

    short pid;

    char textC13;

    };

    ```


    The mtype component contains the message; id indicates whether the kernel expects
    an answer. If id is not equal to zero, then after termination of the requested
    operation, the kernel daemon sends a message with the contents of id as mtype
    and passes the return value of the executed command as the new id value. The pid
    component holds the PID of the process that triggered the kernel request. The
    kernel daemon passes this PID to all programs it starts by entering it into the
    environment variable KERNEL_TRIGGER. This could be a way to call a just-in-time
    debugger automatically, when a process triggers an exception.


    Responsibility for loading and releasing modules lies with the functions


    ```

    int request_module(const char *name)

    int release_module(const char *name, int wait_flag);

    int delayed_release_modLe(const char *name);

    int cancel_LRelease_module(const char *name);

    ```


