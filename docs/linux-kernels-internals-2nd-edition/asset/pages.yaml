    \ Otherwise, a free block is sought within 32 blocks of the target block, and\
    \ if found, it is allocated. If this fails, the block allocation routine tries\
    \ to find a tree block which is at least in the same block group as the target\
    \ block. Only after these avenues have been exhausted are other block groups investigated."
