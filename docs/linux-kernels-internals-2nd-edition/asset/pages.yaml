  md: 'This list thus represents the interface between the network devices and the
    separate protocols as far as the devices are concerned. Packets which do not match
    any of the types registered in the list are discarded.


    # 8.3.2 SLIP and PUP


    Now let us turn to some more ''exotic-looking'' devices. The only significant
    difference between SLIP and PLIP is that the one protocol uses the computer''s
    serial interface for data transfer while the other transfers data via the parallel
    port. When we speak of the parallel interface here, we do not mean Ethernet packet
    adapters but the ''bare'' interface.


    PLIP enables a very powerful link to be set up between two computers. SLIP is
    the simplest way of connecting a computer or a local network to the Internet via
    a serial link (a modem connection to a telephone network). SLIP and PLIP differ
    from Ethernet in that they can only transmit IP packets. For simplicity, SLIP
    does not even use a hardware handler. Nor does PLIP make great demands: it simply
    sets the hardware address to ''fd:fd'' plus the IP address and uses the Ethernet
    functions for the protocol header (see Figure 8.7).


    # 8.3.3 The loopback device


    The loopback device provides communication facilities to applications to the local
    computer using sockets in the INET address family. It can be implemented with
    little effort, as it immediately returns to the upper layers the packets to be
    sent. It can also be used to test network applications on a computer: this excludes
    the possibility of faults in the network hardware. The loopback device ''Lo''
    is generally assigned to the IP address 127.0.0.1.


    # 8.3.4 The dummy device


    In the dummy device we encounter a rather exotic representative of network devices.
    It behaves in fact like any other device, except that no real data transfer takes
    place.


    ![](img/04698aadad5d50fd4b3564ae373ff0bd_266_0.png)


    Figure 8.7 The relationship of SLIP and PLIP packets to IP packets.'
