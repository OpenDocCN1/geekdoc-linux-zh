- img_proc: true
  md: '# - 307 -


    Intel''s multi-processor specification Version 1.4 (Intel, 1997) defines the interaction
    between hardware and software in order to facilitate the development of SMP-capable
    operating systems and to create the possibility of making these systems run on
    new hardware. The aim of the specification is to create a multi-processor platform
    which remains 100% compatible with the PC/AT. It defines a highly symmetrical
    architecture in terms of:


    +   - Memory symmetry

    All processors share the same main memory; in particular, all physical addresses
    are the same. This means that all processors execute the same operating system,
    all data and applications are visible to all processors and can be used on every
    processor.


    +   - I/O symmetry

    All processors share the same I/O subsystem (including the I/O port and the interrupt
    controller). I/O symmetry allows reduction of a possible I/O bottleneck. However,
    some MP systems assign all interrupts to one


    Figure 10.1 shows the hardware overview of a typical SMP system with two processors.
    Both are connected via the ICC (Interrupt Controller Communications) bus with
    one or more I/O APICs (Advanced Programmable Interrupt Controller). Pentium processors
    have their own integrated local APIC. These


    ![](img/04698aadad5d50fd4b3564ae373ff0bd_306_0.png)


    Figure 10.1 A typical SMP system with two Pentium processors.'
