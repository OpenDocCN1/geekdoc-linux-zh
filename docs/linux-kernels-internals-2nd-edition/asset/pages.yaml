  md: '# # LINUX - the operating system


    Linux is obsolete! Andrew S. Tanenbaum


    # ## 1.1 Main characteristics


    # ## 1.2 LINUX distributions


    LINUX is a freely available UNIX-type operating system. Originally developed only
    for the PC, it now runs on Digital Alpha and Spare workstations as well. Further
    ports, example to the Amiga and the PowerPC, are under development and are already
    relatively stable.


    LINUX is compatible with the POSIX 1003.1 standard and includes large areas of
    the functions of UNIX System V and BSD 4.3. Substantial parts of the LINUX kernel
    with which we will be concerned in this book were written by Linus Torvalds, a
    Finnish student of computer science. He placed the program codes under the GNU
    Public License, which means that everyone has the right to use, copy and modify
    the programs free of charge.


    The first version of the LINUX kernel was available on the Internet in November
    1991. A group of LINUX activists quickly formed, and continues to spur on the
    development of this operating system. Numerous users test new versions and help
    clear the bugs out of the software.


    The LINUX software is developed under open and distributed conditions. ''Open''
    means that anyone can become involved if they are able. This requires LINUX activists
    to be able to communicate quickly, efficiently and above all globally. The medium
    for this is the Internet. It is therefore no surprise that many of the developments
    are product of gifted students with access to the Internet at their universities
    and colleges. The development systems available to these students tend to be relatively
    modest; and it is no doubt for this reason'
  merge: -1
  pgno: 10
- img_proc: true
  md: '# Chapter 1 LINUX - the 32-bit operating system


    LINUX is the 32-bit operating system that uses the smallest resources, without
    sacrificing functionality.


    LINUX is distributed under the conditions of the GNU Public License, the full
    source code is available to users. This allows anyone to find out how the system
    works and trace and remove any bugs. However, the real attraction for the authors
    of this book lies in ''experimenting'' with the system.


    Needless to say, LINUX has its drawbacks. It is just much as of ''programmer''s
    system'' as UNIX. Crypt commands, configurations which are difficult to find and
    documentation which is not always comprehensive the system far from easy to use
    - and not for beginners. However, it appears that many users accept this to escape
    the number of limitations (technical as well as financial) found in proprietary
    systems such as MS-DOS, Windows, or commercial UNIX derivatives for the PC. In
    the meantime many books on LINUX accessible to beginners have been written in
    addition to the Linux Documentation Project (LDP).


    LINUX systems are used in software houses, by Internet providers, in schools and
    universities and in private homes. There is no computer magazine that regularly
    report on their operating system. The German Linux market alone is worth several
    million Marks per year. Considering LINUX simply as a pure hackers'' toy no longer
    justice to reality.


    Although there ports to other hardware architectures, most users still run LINUX
    on Intel 386 or compatible systems. Owing to the wide availability of these systems,
    there are almost no problems under LINUX with peripheral device drivers. As soon
    as a new PC expansion board is on the market, some Linux user will implement a
    driver for that board.'' Since version 2.0, LINUX also supports multi-processor
    systems based on Intel and Spain architectures.


    To ensure reasonable performance under LINUX, the PC should have at least 8 Mbytes
    of RAM, if the X Window system is being used as the graphical interface, at least
    16 Mbytes are needed. With that amount, performance remains acceptable even when
    you are running several servers in the background and trying to edit a text in
    the .foreground. However, for special applications such as mod/fax servers or
    firewalls, 4 Mbytes are sufficient.


    In principle, LINUX supports any readily available UNIX system. Object-oriented
    programs can be written in GNU C++ or graphics created under the X Window system.
    Games as Tetris will run, as development systems for graphical interfaces. With
    their built-in network support, LINUX computers can be linked into existing networks
    without problems.


    > Manufacturers who do not release information on the functioning of their hardware
    do not benefit from this.'
