  md: 'Linux kernel internals - 331 -


    PTRACE_ATTACH - Sets the PF_TRAC flag in the process specified by pid. For this,
    one of the following conditions must be met: the UID (GID) of the current process
    match the UID, EUID and SUID (GID, EGID and SGID) of the desired process, the
    child is ''willing'' (dumpable) or the user is the superuser. Furthermore, the
    flag must not be set yet. If all these have been surmounted, the flag is set,
    the current process becomes the father of the child and sends the SIGSTOP signal.


    PTRACE_PEEKTEXT, PTRACE_PEEKDATA - Reads a word (32 bits) from the address addr.
    The value is stored in data and returned. As, there is no distinction between
    text and data segment.


    PTRACE_PEKUSR - Reads a word from the address out of the user structure of the
    process. The value is stored in data and returned.


    PTRACE_POKETEXT, PTRACE_POKEDATA - Writes the value contained in data to the address
    addr.


    PTRACE_POKEUSR - Writes the value contained in data to the address addr of the
    user structure. Great care is taken to ensure that no register or task structure
    information is overwritten. A few debug registers are allowed.


    PTRACE_SYSCALL, PTRACE_CONT - Continues the child process. With PTRACE_SYSCALL,
    the PF_TRACESYS flag is set. This causes processing to stop after the return of
    the next system call. With PTRACE CONT, this flag is deleted. Then the contents
    of data are entered into the code of the child and it is woken up. Finally, the
    *trap* flag is deleted.


    PTRACE_KILL - Sends a SIGKILL signal to the child process. In addition, the trap
    flag is deleted.


    PTRACE_SINGLESTEP - The PF_TRACESYS flag is deleted. The trap flag is set instead
    and data is entered as the exit code.


    PTRACE_DETACH - Releases the process stopped by PTRACE_ATTACH. The PF_TRACED and
    PF_TRACESYS flags of task structure are deleted, the process is woken up, data
    as the exit code, the original father is re-entered as the parent process, and
    finally the trap in the EFlags register is deleted.


    # Implementation


    Since the peek calls the value of the data parameter is not used but is nevertheless
    placed on the stack (for the interrupt), the C library provides a secure pointer
    by placing a dummy value on the stack.


