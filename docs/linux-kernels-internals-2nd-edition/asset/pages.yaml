    To achieve the greatest possible degree of flexibility, the modules themselves
    can add symbols to the kernel''s symbol table. This allows another module to use
    functions from one loaded earlier. This mechanism is known as module stacking.
    All the symbols exported by a module are collected in a separate symbol table
