    In this chapter, we deal with the characteristics of the LINUX implementation
    of TCP/IP. It is not the authors'' intention to provide a description of how TCP/IP
    works; but rather to look at the design of its implementation under Linux. The
    chapter therefore assumes that the reader is familiar with the basics of TCP/IP.


    # 8.1 Introductory summary


    For the ''normal'' programmer, access to network services is available via sockets.
    Under LINUX, these have an extended functionality. The interface consists of the
    following C library routines:


    ```

    int socket(int addr_fami Ly,int type,int protocol);

    int bind(int s,struct sockaddr *address,int address_len);

    int listen(int s,int backlog);

    int connect(int s,struct sockaddr *address,int address_len);

    int accept(int s,struct sockaddr *address,int *address_len);

    int send(int s,char *msg,int len,int flags);

    int sendto(int s,char *msg,int len,int flags, struct sockaddr *to, int len);

    int recv(int s,char *buf,int len,int flags);

    int recvfrom(int s,char *buf,int len,int flags,struct sockaddr *froto,int fromlen);

    int getsockopt(int s,int level,int oname,char *value,int *olen);

    int setsockopt(int s,int level,int oname,char *value,int *olen);

    ```


    All of these functions are based on the system socketcall (see page 371). In addition,
    the system call 7-oct to socket file descriptors enables network-specific configurations
    to be changed.


    As the C library routine socket returns 0 a file descriptor, the usual I/O system
    calls, such as read and write, are of course also applicable.


    A computer can be connected to a network via a great variety of hardware including,
    for example, Ethernet cards and D-Link adapters.


    > '' For detailed reading on the subject of TCP/IP, we recommend Comer (1991)
