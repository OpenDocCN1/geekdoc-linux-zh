  md: '# 4.1 The architecture-independent memory model in LINUX


    A typical computer today has at its disposal a number of levels of memory with
    different access times. The first level mostly consists of cache memory within
    the processor. A second level of cache is frequently implemented, using SRAM with
    a fast access time of around 20 ns. In almost all cases, the actual working memory
    consists of inexpensive DRAM chips with access times around 70s. As far as longterm
    is concerned, the cache levels are transparent once they have been initialized
    by the BIOS code. For this reason, the cache levels are not mapped by the architecture-independent
    memory model and the term physical memory is used to refer to RAM in general.


    # 4.1.1 Pages of memory


    The physical memory is divided into pages. The size of a memory page is denoted
    by the PAGE_SIZE macro in asm/page.h file. For the x86 processor, the size is
    set to 4 Kbytes, while the Alpha processor uses 8 Kbytes.


    # 4.1.2 Virtual address space


