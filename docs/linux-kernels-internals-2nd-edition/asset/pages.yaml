    Nowadays, support for network communication is one of the basic made of an operating
    system. For LINUX, this requirement existed from the start. Such communication
    lays the foundations for a range of network ser- vices, including services familiar
    to most users such as ftp (file transfer), telnet and rlogin (remote log-in).
    In addition, there are facilities to use file systems on other computers (NFS),
    receive e-mail and NetNews and much more. The type of network used (OSI, IPX,
    UUCP and so on) is a secondary consideration as far as the user is concerned.


    In the UNIX world, the dominating protocols are all collected under the name of
    TCP/IP. LINUX is modelled on UNIX and so, as might be expected, an implementation
    of TCP/IP is provided which concentrates mainly on communication via Ethernet.
    But using SLIP (Serial Line Interface Protocol) or FLIP (Parallel Line Interface
    Protocol) it is possible to link computers via their serial or parallel interfaces.
    The capabilities of the SLIP protocol are particularly impressive, as it can use
    modems and telephone lines to set up network links to anywhere in the world.


    In its AX.25 protocol, LINUX even provides a way of communicating between computers
    by radio. Communication via IPX, a protocol developed by'
