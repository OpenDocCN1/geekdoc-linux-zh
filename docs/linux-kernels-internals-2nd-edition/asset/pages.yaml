    All the

    locks are then tested to check whether they conflict with the current lock, for
    which fcntl_setlk(in)

    also uses the

    posix_lock_conflict(in).


    If such a conflict is found, the function returns EAGAIN if called using SET_LK
    or

    if SET_LWK is used. In the latter, the current process is entered in the wait
    queue

    for the lock. When this lock is removed, all the processes in the wait queue are
    woken up

    and retest the existing locks for conflicts. If no conflict can be found, the
    lock is entered in

    the table.


    Let us consider a simple scenario. In Figure 5.1, Process 1 has locked the first
    byte in

    file for read access and Process 2 has locked the second byte. Process 1 then
    attempts to

    place a lock on the second byte, but is blocked by Process 2. Process 2 in turn

    attempts to lock the first byte and is likewise blocked. Both processes would
    now wait for

    t other to release its lock, producing a deadlock situation. The scenarios for
    deadlocks are

    generally more complex, as a number of processes may be involved. LINUX tracks
    down

    of this type and the system call fcntl returns the error EADLOCK.


