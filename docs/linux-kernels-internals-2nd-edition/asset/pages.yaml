  md: "# 6.2.8 The directory cache\n\nThe directory cache originates in the Ext2 file\
    \ system. Since LINUX version 1.1.37 it has been part of the VFS and can be used\
    \ by all file system implementations. This cache maintains directory entries which\
    \ help to speed up access when reading directories, which is necessary when opening\
    \ files. The entries in the cache have the following structure:\n\n```\nstruct\
    \ dir_cache_entry {\n    struct hash_list h;      /* hash list management */\n\
    \    unsigned long dev;        /* device number */\n    unsigned long dir;   \
    \      /* directory mode number */\n    unsigned long version;     /* directory\
    \ version */\n    unsigned long ino;        /* inode number of file */\n    unsigned\
    \ char name_Len;   /* length of directory entry */\n    char name[DCACHE_NAME_LEN];\
    \  /* directory entry */\n    struct dir_cache_entry **Iru; /* ptr to head of\
    \ list */\n    struct dir_cache_entry *next_Iru; /* links in list */\n};\n```\n\
    \nOnly directory entries up to a length of DCACHE_NAME_LEN (that, is 15) are held\
    \ in the cache. This is not a severe limitation, however, as the most frequently\
    \ used files and directories will have short names.\n\nThe directory cache is\
    \ a two-level cache, with both levels operating according to the LRU (Least Recently\
    \ Used) algorithm. Each of the levels consists of a doubly circular list, which\
    \ always contains DCACHE_SIZE entries. The pointers Level1_head and level2_head\
    \ point to the oldest element in each list, which will be the next to be overwritten.\
    \ The component Iru_head is also a pointer to this, enabling every cache entry\
    \ to 'know' which cache it is in.\n\nFor rapid location of an entry in the cache,\
    \ use is made, as regularly occurs in the LINUX kernel, of an open hash list.\
    \ The hash key is formed from the device dev, the inode number dir of the directory\
    \ and a hash function of the name. To access the directory cache, two functions\
    \ are exported. The function\n\n```\nvoid dcache_add(struct In *dir, const char\
    \ *name, int len, unsigned long ino);\n```\n\nenters the directory entry name\
    \ of length len, located in the directory with the cache. The number In is the\
    \ inode number of the directory entry."
