  md: 'On receipt of the signal, the child process informs the parent process and
    halts. The parent process can now continue the child process and decide whether
    it should handle the signal. If the data argument is null, the child process will
    not process any signal.


    The request PTRACE_SYSCALL causes the child process to resume in the same way
    as PTRACE_CONT, but only until the next system call. The sys_ptrace() function
    will also set the PF_TRACESYS flag. When the child process arrives at the next
    system call, it halts and receives the SIGTR signal. The parent process could
    do this, for example, inspect the arguments for the system call. If the process
    is continued with a further PTRACE_SYSCALL request, the process will halt on completing
    the system call; the result and (eventually) the error variable can be read by
    the parent process.


    The request PTRACE_SINGLESTEP defers from PTRACE_CONT in setting the processor''s
    trap flag. The process executes only one machine code instruction and generates
    a debug interrupt (No. 1). This sets the SIGTRAP signal for the process, which
    is interrupted again. In other words, the PTRACE_SIN-GLESTEP allows the machine
    to be processed by instruction. The request PTRACE_KILL continues the child process
    with the signal SIGKILL. The process is aborted.


    The PTRACE_DETACH request separates the process under control from the controlling
    process. The former process is cancelled along with its old parent and the flags
    PF_TRACED and PF_TRACESYS.


    A debugger uses ptrace in the following way: It executes the system call fork
    and calls the function in the child process with PTRACE_TRACE. There, the program
    to be inspected is then started by execve. As the PF_TRACED flag is set, the execve
    sends a SIGTRAP signal to itself. It will not allow ptrace to process programs
    for which an S bit is set. It is not difficult to imagine the possibilities that
    would otherwise be open to hackers. On return from execve the SIGTRAP signal is
    processed, the process is halted and the parent process is informed by sending
    a SIGCH signal. The debugger will wait for this via the system call wait. It can
    then inspect the process''s memory, modify and set breakpoints. The simplest way
    of doing this on x86 processors is to write an int3 instruction at the appropriate
    address in the machine code. This instruction is only one byte long.


    If the debugger calls PTRACE_CONT, the child process will continue running until
    it hits the int3 instruction, at which Point the relevant handler routine sends
    a SIGTRAP signal to the child, the child process is interrupted and the debugger
    is informed. It could then, for example, simply abort the program to be inspected.


    There are, of course, other ways of using this system call. The strace Program
    provides a report (''trace'') on all the system calls that have been carried out.
    This is illustrated below by the output listing of strace cat motd. Naturally,
    strace uses PTRACE_SYSCALL.'
