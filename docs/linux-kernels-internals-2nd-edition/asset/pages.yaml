  md: '# Linux kernel internals


    OPERATING SYSTEMS/LINUX


    # LINUX KERNEL INTERNALS


    SECOND EDITION


    M BEC, H BÖHME, M DZIADSKA, U KUNITZ, R MAGNUS, D WERWERORNER


    "If you intend to write kernel code or a kernel module, or just want to know how
    the kernel of a Linux system works, this book is an excellent source of information...
    I highly recommend this book for anyone who is serious about writing code or who
    wants to know what is in the Linux kernel." - PHIL HUGHES, LINUX JOURNAL


    Since the introduction of Linux version 1.2 in March 1995, a worldwide community
    has evolved from programmers who were attracted by the reliability and flexibility
    of this completely free operating system. Now at version 2.0, Linux is no longer
    simply the operating system for clerks and hackers, but is being successfully
    employed in commercial software development, by Internet providers and in research
    and teaching.


    SECOND EDITION OF LINUX KERNEL INTERNALS:



    This book is written for anybody who wants to learn more about Linux. It explains
    the inner mechanisms of Linux from process scheduling to memory management and
    file systems, and will tell you all you need to know about the structure of the
    kernel, the heart of the Linux operating system.


    +   - has been thoroughly updated to cover Linux 2.0

    - shows you how the Linux operating system actually works so that you can start
    to program the Linux kernel yourself

    - introduces the kernel sources and describe basic algorithms and data structures,
    such as scheduling and task structure

    - helps you to understand file systems, networking and how systems boot


    The accompanying CD-ROM contains the Slack distribution 3.1 with its complete
    source code, the Linux kernel sources up to version 2.0.27, the PC speaker driver,
    and a wealth of documentation.


