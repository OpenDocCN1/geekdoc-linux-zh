    # Processes and tasks


    As by a process running under LINUX, the kernel is a provider of services. Individual
    processes exist independently alongside each other and cannot affect each other
    directly. Each process''s own area of memory is protected against modification
    by other processes.


    The internal viewpoint of a running LINUX system is a different matter. Only one
    program - the operating system - running on the computer, and can access all the
    resources. The various tasks are carried out by co-routines -that is, every task
    decides for itself whether and when to pass control to another task. One consequence
    of this is that an error in the kernel programming can block the entire system.
    Any task can access all the resources


    other parts of a task run in the processor''s privileged User Mode. These parts
    of the task appear from the outside (to someone looking into the kernel) to be
    processes. From the viewpoint of these processes, true multitasking is taking
    place. Figure 3.1 should make this clear.


    In the following pages, we will not be making any precise distinction between
    the concepts of tasks and processes, but using the two words to mean the same
    thing. When a task is running in the privileged System Mode, it can take one of
    a number of states. Figure 3.2 shows the most important of these. The arrows in
    this diagram show the possible changes of state. The following states are possible:


