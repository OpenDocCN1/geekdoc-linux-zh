  md: '# 6.2.1 Mounting


    Before a file can be accessed, the file system containing the file must be mounted.
    This can be done using either the system call mount or the function


    The mount_root() function takes care of mounting the first file system (the root
    file system). It is called by the system call setup (see page 378) after all the
    file system implementations included in the kernel have been registered. The setup
    call itself is called just once, immediately after the init process is created
    by the kernel function init() (file init/main.c). This system call is necessary
    because access to kernel structures is not allowed from user mode (which is the
    status of the init process).


    Every mounted system is represented by a super block structure. These structures
    are held in the static table blocks[] and limited in number to NR_SUPER.

    The superblock is initialized by the function read_super() in the Virtual File
    System. It interrogates floppy disks and CD-ROM for a change of media, tests whether
    the superblock is already present and, if so, returns it. If it finds no superblock
    in existence it searches for a new entry in the superblock table and calls the
    function to create a superblock which is provided by every file system implementation.
    This file-system-specific function will have been made on registering the implementation
    with the VFS. When called, it will contain:


