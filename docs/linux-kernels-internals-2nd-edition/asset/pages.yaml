    communication between processes in one computer. The socket programming interface
    provides for communication via a network as well as locally on a single computer.
    The advantage of this interface is that it allows network applications to be programmed
    using the long-established UNIX concept of file descriptors. A particularly good
    example of this is the INET domain. The daemon waits for incoming network service
    requests and then calls the appropriate service program with the socket descriptor
    as standard input and output. For very simple services, the program called need
    not contain a single line of network-relevant code.


