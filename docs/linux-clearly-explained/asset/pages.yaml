    # Configuring Your Sound Card


    To hear sound on your system, you''ll need to run the Sound Configuration Utility,
    a text-based program that searches for a compatible sound card and enables sound
    on your system.


    # Understanding Digital Audio


    Computer sound falls into two general categories: waveform sounds and synthesized
    sounds. Waveform sounds are recordings of actual or music. To represent sounds
    in digital form, digital recording technology takes a “snapshot” of the sound
    many times per second; this snapshot is called a sample. The higher the sampling
    rate, the better the quality. Audio CDs are recorded with a'
  merge: -1
  pgno: 215
- img_proc: true
  md: 'sampling rate of more than 44,000 samples per second. Digitized waveform sounds
    are recorded in a variety of file formats, including MP3, the Windows WAV format,
    the Sun/NeXT format (files with a *.au extension), and SND (a Macintosh sound
    format); most of these formats offer a variety of sampling rates, as well as the
    choice of mono or stereo. Although waveform sounds can approach or equal the quality
    of audio CDs, they require very large files. (An exception is the MP3 format,
    which uses an advanced compression technique to cut file sizes dramatically.)


    Synthesized sounds require very small files that contain text-based instructions
    that tell the synthesizer what to play. (These instructions are written in a language
    called MIDI.) However, synthesized sounds lack the quality of waveform sounds.
    To play synthesized sounds, you need a sound card equipped with synthesizer circuitry.
    The oldest (and least satisfactory) type of sound synthesis is called FM synthesis.
    This technique produces the low-quality music you associate with a cheap video
    game or a child''s electronic keyboard. Wavetable synthesis relies on actual recordings
    of real musical instruments to generate sounds, and offers better quality. Most
    of today’s sound cards support wavetable synthesis.


    To run the Sound Configuration Utility, follow these steps:


    +   1. Click the Main Menu button, and choose Run Program.


    +   2. In the Run Program dialog box, type /usr/sbin/sndconfig and click Run.


    You’ll see the text-based Sound Configuration Utility.


    +   3. Press Enter to scan for your soundcard. If the scanning software finds
    your card, you’ll see a message that the probe was successful. If not, you will
    be asked to choose your sound card from a list.'
