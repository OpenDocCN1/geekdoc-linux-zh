  md: '# Using Midnight Commander


    Midnight Commander (MC) is a text-based file management program that you can run
    at the shell prompt or, within the X Window System, in a terminal emulation window.
    Either way, it provides easy-to-use tools for performing all of the major file
    management tasks discussed in Chapter 15—and what''s more, with a margin of safety,
    in that Midnight Commander-automatically asks for confirmation before wiping files.


    Why should you bother learning Midnight Commander, when your Red Hat 6.0 system
    includes the GNOME File Manager? There are two good reasons. First, the GNOME
    File Manager lacks some of Midnight Commander''s advanced features, which aren''t
    yet available with the GNOME File Manager.'
  merge: -1
  pgno: 493
- img_proc: true
  md: '464 PART FIVE LEARNING COMMAND PROMPT ESSENTIALS


    Second, the GNOME File Manager doesn’t enable you to switch to superuser status
    when you’re logged in using your user account. As a result you cannot modify files
    outside your home directory unless you logout of your user account and log in
    as root user. But this isn’t very convenient if you need to make just one small
    change to a configuration file. If you open a terminal window and switch to superuser
    status, you can start Midnight Commander and perform system modifications without
    logging out of your user account. Midnight Commander includes a built-in file
    viewer and editor, so it’s convenient to use for editing configuration files.


    # Running Midnight Commander


    To run Midnight Commander, open a terminal emulation window, type mc, and press
    Enter. You’ll see Midnight Commander on-screen.


    # Understanding the MC Interface


    The Midnight Commander screen (Figure 17.1) has four parts:


    +   - Menu Bar At the top of the screen you’ll find the menu bar, from which you
    can choose any of MC’s commands.

    - Directory Panels By default, this panel is the active one (it contains the highlight).

    - Shell Command Line This line, the second from the bottom of the screen, enables
    you to type shell commands'
  merge: -1
  pgno: 494
- img_proc: true
  md: '# CHAPTER 17 USING MIDNIGHT COMMANDER 465


    (such as discussed in the previous chapter) without leaving MC.


    +   - Function Key Map This line, the last on the screen, shows what the function
    keys do in the current context. The effect of a given function key changes depending
    on what you’re doing.)


    # Using a Mouse with Midnight Commander


    Whether you’re running Midnight Commander within the X Window System or at the
    shell prompt, you can use a mouse with the program. (Support at the shell level
    depends on the gpm package, which is installed by default with Red Hat Linux.)


    ![](img/21d32b84086223524c8766042726779d_495_0.png)


    Figure 17. Midnight Commander uses a two-panel display.'
  merge: -1
  pgno: 495
- img_proc: true
  md: 'With the mouse, you can do the following:


    +   * Select a file Point to the file’s name and click the right mouse button.

    * Mark a file For certain operations (such as copying or moving more than one
    file), you will want to mark files. To mark a file, point to the file’s name and
    click the left mouse button.

    * Initiate an action Double-click a program name to run the program.


    > TIP To carry out an action assigned to a function key, you can point to the
    function key on the screen''s bottom line, and click the left mouse button.


    # Midnight Commander’s Heritage


    If Midnight Commander seems like a classic Unix program, think again. It’s inspired
    by a very influential MS-DOS file manager, first released in 1986: Norton Commander
    (Bezroukov 1997). Just as Norton Commander made MS-DOS much easier to use, Midnight
    Commander brings the same benefits to Linux users: it’s fast, capable, and designed
    so that you can perform most operations with very little learning involved.


    # Navigating Within a Directory


    By default, Midnight Commander displays the directory that was current when you
    started the program. (Both panels show the same directory, but only one of these
    panels is active.) Within the active panel, you can use the keys listed in Table
    17.1 to navigate within the file list.'
