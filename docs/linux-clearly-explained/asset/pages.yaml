  md: 'CHAPTER 10 • PERSONALIZING GNOME


    # Enabling Sound within GNOME


    If your computer is equipped with a Linux-compatible sound card and speakers,
    you can make GNOME come alive with sounds that are keyed to system events. You
    can also listen to audio CDs, play digital sound files


    # Understanding Sound on Your Linux System


    Compared to Windows and Mac OS systems, UNIX and Linux systems have been sound-impaired.
    In the past, UNIX workstations could play some waveform sound files (recorded
    sounds), but could not play synthesized (MIDI) sounds. These capabilities were
    brought to UNIX workstations by the Open Sound System (OSS), a commercial venture;
    a free version, called Free/OSS, is currently implemented in the Linux kernel.
    However, Free/OSS did not provide Linux systems with the capabilities any sound-enabled
    Windows or Mac OS system has, such as the capacity to play more than one sound
    at a time, and the ability to work with a wide variety of sound files.


    Thanks to the Enlightenment Sound Daemon (EsounD), Linux systems now have outstanding
    sound capabilities. EsounD can play more than one sound at a time. In addition,
    it works with audiofile, a utility that enables sound applications to work with
    a wide variety of sound file formats. EsounD and audiofile are integrated with
    GNOME.


    To take advantage of EsounD, GNOME enables you to assign sounds to system events,
    such as starting up and logging out. In addition, GNOME comes with a variety of
    ready-to-use sound utilities, including an audio CD player.'
  merge: -1
  pgno: 309
- img_proc: true
  md: 'In addition to these utilities, you can obtain copies copies of many additional
    sound utilities that are EsounD-compatible, as the following:


    +   * eMusic A sound player that can handle just any digitized waveform file you''ll
    encounter, including MP3, WAV, UAU, and more.

    * x11amp A Linux version of the popular Windows MP3 player (Winamp).

    * xcdroast A great application for creating audio or data CD-ROMs using inexpensive
    CD-R discs.

    * grip A GNOME-compatible application for reading audio data from CD-ROM discs
    and transforming this data into WAV or MP3 files.


    > TIP For the latest information on EsounD, see the EsounD home page at www.tux.org/~riclude/EsounD.html.


