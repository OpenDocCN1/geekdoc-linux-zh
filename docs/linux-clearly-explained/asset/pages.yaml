  md: 'CHAPTER 17 • USING MIDNIGHT COMMANDER 489


    # Deleting Directories


    You can delete an entire directory, but please note that you should avoid doing
    so unless you are certain what you are doing. For example, suppose you have created
    subdirectories for your data files. You can safely move one of these subdirectories,
    as long as they contain no automatically generated configuration files required
    by an application. Never move a directory that contains one or more files beginning
    with a period.


    To move a directory, follow these steps:


    +   - Click Left or Right on the menu bar, and choose Tree.

    - Select the directory you want to delete.

    - From the File menu, choose Delete, or press F8.


    If the directory isn''t empty, you''ll see an alert box asking if you would like
    to delete the directory recursively. Think twice before accepting this option,
    because it will delete all the subdirectories and all the files within the current
    directory.


    # Editing Files


    One of Midnight Commander''s most useful features is its built-in file editor,
    which you can use to edit system configuration files (see Chapter 9), a task you''ll
    perform in order to get your Linux system running smoothly. Although Linux and
    Unix users may prefer to run some version of emacs, a powerful (but confusing)
    text editor designed for programmers, most users are much happier working with
    a simple text editor that accomplishes straightforward editing tasks without forcing
    you to learn complicated commands and'
  merge: -1
  pgno: 519
- img_proc: true
  md: 'procedures. Midnight Commander''s text editor fits this requirement very well.


    > > **TIP** It''s easiest to use the internal text editor when you''re running
    Midnight Commander from the Linux command line (rather than in a window manager).
    You''ll be able to use the convenient text-editing shortcuts listed in Table 17.5,
    which aren''t available when you''re running Midnight Commander in an X terminal
    emulation window.


    # Basics of Text Editing with the Internal Editor


    To edit a file with Midnight Commander, do the following


    +   1. In the Midnight Commander file list, select the file.

    2. Press F4. You''ll see the file in the editing window (see Figure 17.11).

    3. At the top of the screen, you''ll see a status line containing information
    (including the name of the file and the cursor''s location within the file). At
    the bottom of the screen, you will see the function key assignments for the internal
    editor.

    4. Use the mouse or arrow keys to position the cursor where you want to edit the
    file, and use the Backspace and Delete keys to perform the editing. Type corrected
    or new text.

    5. To save the file, press F2.

    6. To quit the editor, press F10.'
  merge: -1
  pgno: 520
- img_proc: true
  md: 'CHAPTER 17 • USING MIDNIGHT COMMANDER 491


    # Advanced Text Editing with the Internal Editor


    The internal editor offers many features, including search, search and replace,
    macros (stored keystroke sequences), a spelling checker, and date/time insertion.
    You can learn what''s available by looking at the editor''s menus; to display
    them, press F9.


    Tables 17.2 through 17.5 list the keyboard shortcuts you can use while you''re
    editing files with the internal editor. If you''re using Midnight Commander at
    the Linux prompt rather than running it from within a window manager, you can
    use the editing shortcuts listed in Table 17.5.


