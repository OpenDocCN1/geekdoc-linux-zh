  md: '# 12

    Keeping Your System Running Smoothly


    Traditionally, large, multi-user Unix systems are run by two kinds of people:
    users and system administrators. Users rarely venture out of their home directories
    and do not have root privileges—perish the thought! Users with root privileges
    could copy sensitive information to disk drives, create havoc among system configuration
    settings, and even shut down the system maliciously, cutting off computer access
    for other users. That''s why there''s such a sharp distinction between users and
    system administrators. And that''s also why Linux defaults to a configuration
    in which you can''t do much damage from your user account.'
  merge: -1
  pgno: 355
- img_proc: true
  md: 'Sooner or later, though, you’ll need to step into the role of system administrator.
    You’ll need to switch to the root user, and perform tasks such as mounting external
    filesystems (such as disk drives), archiving and compressing files, and performing
    regular system backups.


    In this chapter, you’ll learn how to take off your “user hat,” and take on the
    system administrator’s role. If that sounds scary, read on. Thanks to GNOME, such
    tasks are no longer the nightmare they once were. In this chapter, you’ll learn
    how to use GNOME and other easy-to-use tools to perform routine system administration
    tasks.


    # Mounting Disks and Filesystems


    To use the files on external storage devices, such as CD-ROM drives, ZIP drives,
    and floppy disks, you must mount them. When you mount a disk, Linux adds the disk’s
    contents to the Linux filesystem, using a mount point such as /mnt/floppy or /mnt/cdrom.


    > TIP Remember, Linux requires you to log on as root user in order to mount disk
    drives. If you haven’t already done so, turn to Chapter 7 and follow the instructions
    for making your disk drives available to users (including yourself).


    # Mounting Disks with GNOME


    When you’ve configured GNOME (see Chapter 7) so that users can access disk drives,
    you’ll see all the mountable drives represented by folders on the desktop. If
    the folders aren’t there, try right-clicking the desktop background, and choose
    Recreate Desktop Shortcuts from the pop-up menu.'
  merge: -1
  pgno: 356
