    # # Accessing FTP Sites with File Manager


    The File Transfer Protocol (FTP) is another of the Internet''s most popular services.
    By means of anonymous FTP, individuals or organizations can make files freely
    available for public download. Anonymous FTP is one of the chief vehicles for
    distributing open source software. Other FTP servers require a username and password.
    If you plan to publish a Web page on your ISP''s computers, you will need to learn
    how to use FTP for uploading files to a password-protected server.


    ![](img/21d32b84086223524c8766042726779d_415_0.png)


    Figure 14.6 The Gnome File Manager can directly access FTP sites.'
  merge: -1
  pgno: 415
- img_proc: true
  md: '386 PART FOUR • GETTING CONNECTED TO THE INTERNET


    You can use a separate program (such as gFTP) to access FTP servers, but you can
    also use the GNOME File Manager (see Figure 14.6). What''s so cool about using
    File Manager for FTP is best understood by trying it; as you''ll discover, File
    Manager''s virtual file system (VFS) enables you to add the files and directories
    of a remote FTP server to File Manager''s directory list, as if these files and
    directories were part of your computer system. Once you''ve opened the FTP server''s
    directory structure, you can use all the File Manager techniques you''ve already
    learned to work with files. For example, to download a file, you simply copy it
    to your home directory.


    The following sections show you how to access FTP site''s with File Manager''s
    VFS, starting with anonymous FTP servers. You''ll go on to learn how to access
    password-protected sites.


    # Accessing Anonymous FTP Sites


    To access an anonymous FTP site with the GNOME File Manager, do the following:


    +   1. In the directories list, click the root directory symbol (/).


    +   2. In the Location box, type the following URL: ftp://followed by the Internet
    address of the FTP site (such as gnomeftp.wgn.net).


    +   3. Press Enter.


    File Manager attempts to access the site, which may take a while. Once the site
    has been accessed, you''ll see the ftp server''s name in the directory window.
    Click on the server name to see the available files and directories.'
  merge: -1
  pgno: 416
- img_proc: true
  md: '# Accessing Password-Protected Sites


    To access a password protected site, you embed your login name and password into
    the URL, as follows:


    ```

    ftp://logname:password@servername

    ```


    For example, suppose you''re accessing ftp.september.org; your user name is brenda
    and your password is 339jjqq. You would type the following in File Manager''s
    Location box:


    ```

    ftp://brenda:339jjqq@ftp.september.org

    ```


    The connection works the same way. Depending on the permissions established at
    this server, you may be able to upload files as well as download them.


    # Exploring Additional Internet Applications


    Currently, a number of promising GNOME utilities are under development. Check
    the GNOME home page frequently (http://www.gnome.org) for news about these and
    other GNOME-compatible Internet utilities.


    Here''s an overview of some utilities that were well into the development cycle
    at this writing:


    +   - gFTP You can use File Manager for occasional downloading or uploading from
    FTP sites. For work with FTP, you''ll find it easier to use a utility, such as
    gFTP, that''s designed expressly for FTP usage. Created by Brian Masney, gFTP
    is a GNU GPL-licensed program that is fully compatible with GNOME. When you access
    an FTP site with gFTP, you''ll see two file panels (see Figure 14.7): on the left,
    you see your local files and directories; the right panel shows the remote server''s
    files and directories.'
  merge: -1
  pgno: 417
- img_proc: true
  md: '# 388 PART FOUR GETTING CONNECTED TO THE INTERNET


    Downloading or uploading a file is as simple as selecting the file and clicking
    the download or upload arrow.

    GnomeICU This program is ICQ-compatible, “buddy list” program’s fully integrated
    with the GNOME desktop. A buddy list program enables you to tell when your friends
    or contacts are logged on to the Internet (and they, in, can tell when you’re
    logged in). When you and a buddy are both online, you can send messages to each
    other by means of text chatting. You can use GnomeICU whether or not you''ve already
    signed up for ICQ. If you signed up for ICQ on another computer, jot down your
    ICQ number, your password, and other identifying GnomeICU will reestablish your
    connection to the ICQ network. If you haven''t already signed up, you can use
    GnomeICU to create a new ICQ membership.


    ![](img/21d32b84086223524c8766042726779d_418_0.png)


    Figure 14.7 gFTP makes FTP usage easy.'
  merge: -1
  pgno: 418
- img_proc: true
  md: '+   **X-Chat** Internet Relay Chat (IRC) is a popular text-based chatting network,
    with hundreds of servers (and dozens of networks) in use throughout the world.
    X-Chat is a GNOME-compatible IRC client that is clearly destined to become one
    of the best available in any format. It''s exceptionally easy to use, and the
    interface is very well thought out.


    On the horizon are a GNOME Web browser, a full-featured email client, and much
    more. By the time you read this book, these projects may have produced preliminary
    versions (called *beta versions*) that are far enough along to try out on your
    system.


    # From Here


    Lurking beneath the attractive surface of GNOME is Linux, a powerful and complex
    operating system. Sometimes, you''ll find that it''s actually faster and easier
    to talk to Linux directly. To do so, you use the text-based, command-line interface,
    which you can access in any terminal window (including the GNOME Terminal). In
    Part Five of this book, you''ll learn all that''s necessary to use the command-line
    interface.'
