  md: '# 15


    # Using the Shell and File Utilities


    If you’re shooting for mastery of Linux, it’s wise to learn the basics of using
    Linux with the text-only interface. Sometimes it’s more convenient or faster to
    use this interface for certain operations, and for some operations there’s no
    alternative (yet). In addition, using the text-only interface enables you to take
    advantage of command options that aren’t available with more user-friendly graphical
    interfaces.


    Despite the arrival of GNOME, knowledge of the text-only, command-line interface
    is part of any Linux user’s basic skill set. So be sure to read this chapter and
    try all of the commands and programs discussed. But don’t feel that you must memorize
