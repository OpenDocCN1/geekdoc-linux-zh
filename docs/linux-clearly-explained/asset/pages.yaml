  md: '# Deleting Files


    To delete files, use the rm command. But bear in mind that this command is dangerous,
    especially when you''re logged in as the root user.


    > CAUTION Never use rm when you are logged in as the root user. If you are not
    careful with your use of this command, you could delete configuration files, shell
    scripts, or other essential files that will cause your Linux system to cease functioning.
    A well-known Linux disaster involves using rm to erase all subdirectories that
    have names beginning with a dot; the disaster-inducing command (rm.*) expands
    to include the parent directory (.), and wipes out your entire hard drive.


    To delete files, log in your username, if necessary, and always use the interactive
    mode (the -i option). In the following, you see the dollar sign (ordinary user)
    prompt instead of the pound sign (root user) prompt; don''t use rm if you see
    the pound sign!


    To remove a file called file-1, you would type the following:


    ```

    $rm -i file-1

    ```


    You can name more than one file if you separate the filenames with spaces:


    ```

    $rm -i file-1 file-2 file-3

    ```


    To remove two or more files, you can use wildcards, but be sure to use the -i
    option; this option confirms each file''s deletion. The following command uses
    the ? wildcard, which stands for any one character:


    ```

    $rm -i file-?

    ```'
