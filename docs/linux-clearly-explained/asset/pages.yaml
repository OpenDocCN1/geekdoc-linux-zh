  md: '# PART ONE • INTRODUCING LINUX


    items for programs, you may have to edit configuration files.


    +   **Color map flashing** In Microsoft Windows and Mac OS, the desktop configuration
    imposes a given color depth (the number of bits set aside for representing colors),
    resulting in a fixed color palette (consisting of 16, 256, 16,536, or more than
    16 million colors). All applications are displayed using the available colors,
    whether they like it or not. In X, there''s a default colormap (generally 256
    different colors), but applications can request this list of 256 colors that aren''t
    used by other applications (including the window manager). The result is a distortion
    called colormap flashing, which occurs when you move the cursor into a window
    that uses a different colormap. Surround windows, as well as the window, display
    distorted colors and may become completely illegible. The result is a display
    that looks like the result of a decidedly amateur programming project.


    +   **Lack of support for drag and drop** Because this capability is now expected
    in professional applications, programmers have been implementing their own versions
    of it, with the result that procedures aren''t consistent from one program to
    another (and you can''t use drag and drop between applications). Thanks to efforts
    to establish drag and drop standards, this situation is about to change.


    +   **Lack of support for TrueType fonts** The X Windows system has its methods
    of specifying fonts for on-screen display, but the reality is that the rest of
    the world is using the TrueType font standard. TrueType support is only now finding
    its way into X.


    In the past few years, various vendors have attempted to resolve these problems
    by creating proprietary extensions of the X Window System, such as the Motif window
    manager.'
