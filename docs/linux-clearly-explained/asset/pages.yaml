  md: '# Choosing a Password


    Now you need to create a password for this user.


    > TIP Be sure to enter a password longer than six characters; avoid common words,
    and mix letters and numbers. Write down the password so you won''t forget! (If
    you type a password that doesn''t meet security standards, you''ll see an error
    message with suggestions about how to improve your password. However, Linux doesn''t
    stop you from creating a bad password, if you really wish to do so.)


    At the Linux prompt, type password followed by the new user’s login name, as in
    this example:


    ```

    #password susanne

    ```


    Press Enter to start creating the password. You''ll see the following message:


    New UNIX password:


    Type the password, and press Enter. You''ll see the following message:


    Retype new UNIX password:


