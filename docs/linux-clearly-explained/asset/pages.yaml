  md: '# Adjusting Keyboard Bell Properties


    Some of GNOME’s events sound the keyboard bell, a tone that sounds like a beep.
    You can control the bell’s volume, pitch, and duration. To do so, open the GNOME
    Control Center, click Keyboard Bell, and adjust the bell properties. Click the
    Test button to see the bell sounds. When you''re finished, click OK.


