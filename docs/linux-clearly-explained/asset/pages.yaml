  md: '# Understanding the Partitioning Scheme


    In the following instructions, you''ll create these partitions:


    +   - /(root) This 200MB partition stores the files Linux needs to start your
    system. It also includes configuration files. 200 MB provides plenty of room for
    these files; you could reduce the figure to 150MB if you''re short on space.

    - /usr stores the software that is accessible to everyone with an account on your
    computer. For a workstation-class installation, you need at least 300MB; for a
    server-class installation, 700MB. If you have plenty of disk space, double these
    figures (600MB or 1400MB).

    - Swap Partition Linux uses this partition as an extension of your computer''s
    main (RAM) memory. You should create a swap partition that equals the amount of
    memory in your computer, up to a maximum of 127MB.

    - /home In this partition, you''ll store your data files, as well as any programs
    that you want to make available to yourself (but not to other users). You can
    create accounts for additional users; their data and programs are stored here.
    In the procedure to follow, you''ll use an option that assigns all the remaining
    space on the drive to this partition. You''ll need plenty of room for the /home
    partition; you should have a minimum of 250MB (1GB is better).

    - /usr/local This partition is used to store the noncommercial programs you''ll
    install on your system. It needs its own partition so that you can protect these
    programs from being overwritten if you reinstall your system software. Ideally,
    you''ll want at least 500MB for this partition—more, if you have the available
    space.

    - /opt This partition is used to store commercial programs. Like /usr/local, it
    needs its own partition so that you can protect it from being overwritten if you
    reinstall your'
  merge: -1
