    interface for Red Hat Linux 6.0. Designed to work with the X Window System, GNOME
    requires a window manager—preferably, a GNOME-compatible window manager, such
    as the default window manager, Enlightenment.


    Going far beyond the functionality that window managers alone can provide, GNOME
    provides the desktop functionality that has been available previously only in
    commercial software (the Common Desktop Environment).


