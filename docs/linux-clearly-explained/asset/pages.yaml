  md: '# Back Up, Back Up, Back Up!


    Before following the steps in the next two sections, be sure to back up all the
    important data in your Windows partition. Should you inadvertently press the wrong
    key, you could wipe out all your data.


    # Dividing an Existing, Large Partition


    This approach is called nondestructive repartitioning. Choose this approach if
    your computer has a single physical hard drive, and this hard drive contains only
    one partition that occupies the entire disk.


    Think twice before performing a nondestructive repartitioning. Do you really have
    enough space on your drive? You should consider that operating systems gobble
    up enormous of disk space, and applications consume even more. If you try to install
    Linux and Windows, you may find that you run out of disk space with one or both
    systems. Considering future software installations and the growth of data files,
    you will need at least 4 GB for Windows and 4 GB for Linux—and even then, you''ll
    probably sooner or later run out of disk space for one or both systems.


    In the following procedure, you''ll back up your drive, defragment it, and run
    the FIPS utility (provided in this book''s CD-ROM) to divide the existing DOS
    partition into two new partitions. Once you''ve created the new partition using
    FIPS, you''ll need to delete it so there''s space for the Red Hat installation
    software to create new partitions (as discussed in the next chapter).


    To prepare for a two-OS system in which Windows and Linux will share a single,
    large hard drive:'
