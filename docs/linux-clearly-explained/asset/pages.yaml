  md: '# Creating User Accounts


    In Chapter 7, you learned how to set up a user account for yourself using LinuxConf,
    the GNOME-compatible configuration utility. In this section, you''ll learn how
    to create and manage accounts using the text-mode file utilities.


    To create and modify accounts, you''ll need to log in as the root user or switch
    to superuser status. To switch to superuser status, type su and supply the root
    password.


    # Creating a New Account


    The useradd command creates a new user account, including a new home directory
    for the new user.


    At the Linux prompt, type useradd followed by a space and the login name of the
    user you want to add, as in the following example:


    ```

    [root@localhost /root]#useradd suanne

    ```


    > TIP If bash can''t find the useradd utility, it''s possible that the program''s
    location (/usr/sbin) isn''t in the default path. The default path is set up by
    initialization scripts when you log in. To deal with this problem, specify the
    program path as well as its name when you start the program. To start useradd,
    type /usr/sbin/useradd followed by the new user''s name, and press Enter.


    Press Enter to confirm the new user''s name. Although you see no confirmation
    of this, Linux adds the user and creates a home directory for this user.'
