  md: 'From the user’s perspective, however, the shell’s second-fiddle, independent
    status, coupled with the proliferation of varying Unix flavors, means that there’s
    no single, universal skill for Unix use. As you’ll learn in the next chapter,
    universities and vendors have developed graphical user interfaces (GUIs) for Unix
    computers, but they vary considerably from one interface to the next. For example,
    the non-defunct brilliant NeXT workstation and Sun SPARCStations both run Unix,
    but their user interfaces are as different, arguably, as the difference between
    Mac OS and Microsoft Windows.


    For most users, though, the worst of Unix lies in the near-impossibility of avoiding
    command-line shells, which requires users to type commands such as the following:


    ```

    mv GUILG0.bin GUILG0.tar.gz; gunzip

    GUILG0.tar.gz; tar -xvf GUILG0.tar

    ```


    This is the command used to install a downloaded copy of Corel WordPerfect for
    Linux. Do you think that current Windows or Macintosh users would appreciate having
    to type such a command?


    Looking at Unix, we see not only the technically powerful operating system, but
    also the various accumulated strata of its historical development: the wealth
    of infrequently-used text commands left over from Unix’s early justification as
    text-management system; the original, cryptic commands that can be chained together,
    but only by a highly experienced user; and the earliest Internet software, such
    as Telnet and the trn newsreader, with their nongraphic user interfaces and terse
    documentation. Unix is often taught as if learning to use these artifacts is part
    and parcel of Unix literacy. That may be true in a historical sense, but it flies
    in the face of the user interface technology that it deserves.'
