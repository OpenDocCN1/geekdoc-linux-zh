- img_proc: true
  md: 'PART TWO • INSTALLING RED HAT LINUX


    system software. Reserve at least 500MB for this partition, if you can.


    The partitioning scheme is recommended by experienced Linux users and experts
    (e.g., Welsh et al., 1992-1998: 44–47; Bailey 1998: 26–27). It’s far superior
    to creating one huge root directory and a swap partition, as many beginning Linux
    users do. With this partitioning scheme, you can easily upgrade or reinstall Linux
    without fear of interfering with your installed applications or user directories.


    > TIP Be sure to write down the list of partitions, as well as their mount points
    (the place on the file system where the partition appears in the directory tree).
    If you misconfigure Linux and find that you must reinstall the operating system
    to recover functionality, you will find that your partitions still exist as you
    created them, but you must re the mount points. In particular, note which partition
    (i.e., hda5) is assigned to /home; you must be very careful to avoid reformatting
    this directory when you reinstall or upgrade Linux.


