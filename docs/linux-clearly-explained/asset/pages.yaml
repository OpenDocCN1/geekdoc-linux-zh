    # X''s Beginnings


    At the Massachusetts Institute of Technology (MIT),

    researchers working on the Argus Project were attempting to

    develop a programming language that could be used on a vari-

    tety of computers, and they soon realized that they needed a

    terminal that could display the results of computations on

    more than one computer.


    A second project, called Project Athena, involved MIT

    researchers with sponsorship from Digital Equipment Corpo-

    ration (DEC) and IBM. Project Athena sought to create an

    easy-to-use user interface that would work on a variety of

    computers.


    Argus and Athena researchers discovered their common inter-

    ests, and the result was the X Window System. (It is called X

    because its predecessor was called W.) It''s interesting to look

    at X''s history, because it helps to explain why X is designed the

    way it is. As you''ll see, X succeeds for both Argus and Athena;

    for Argus, it''s a networked windowing system that really can

    open windows to applications running on two or more com-

    puters. For Athena, it''s a graphical user interface that estab-

    l at least some consistency for different types of

    computers, provided that they''re all running Unix or a Unix-

    like operating system. What''s not clear, still, is whether X suc-

    ceds for users.


