    to reboot. In Chapter 7, you''ll get your first taste of Linux on-screen.


    # Reinstalling Linux


    To operate correctly, Linux depends on the integrity of many text-based configuration
    and script files, which are located in the /etc directory. If you run your system
    as the root user, you could inadvertently modify one of these files, with results
    that vary from minor inconveniences to a complete system shutdown. If you can''t
    repair the damage, your best bet is in reinstalling Red Linux by repeating the
    installation described in this and the previous chapters.


    Will you lose your work? No, if you followed this book''s recommendation to create
    a separate partition for the /home directory, which contains your data files,
    many directories, configuration information, and other essential files. When you
    reinstall Linux, you''ll find that your partitions are still there, but you need
    to resupply the mount points. Make sure you assign the /home directory''s mount
    point correctly (assign it to the same device to which it was assigned in the
    previous installation). And be sure to skip reformatting this directory when you''re
    repeating the installation!'
  merge: -1
