    # From Here


    This chapter concludes Linux Clearly Explained. You''ve now learned all the concepts
    and skills you need to become a proficient user of Red Hat Linux. You''ve created
    a credible alternative to the Windows and Mac OS desktops, and you''ve learned
    how to manage this sophisticated, powerful operating system. With this solid foundation
    behind you, you''ll be able to take full advantage of the coming deluge of outstanding
    Linux applications—and you can say goodbye to the constant, oppressive cycle of
    expensive operating system upgrades. Congratulations!'
