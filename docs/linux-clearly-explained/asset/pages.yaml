    # Deleting One File


    To delete a single file, do the following:


    +   1. In the File list, select the file you want to delete.


    +   2. From the File menu, choose Delete, or press F8. You''ll see the Delete
    dialog box, asking you to confirm deletion of the file.


    +   3. To delete the file, click Yes. To cancel deletion, click No.


    # Deleting Multiple Files


    When you want to delete more than one file, you begin by tagging the files, just
    as you do when you''re copying or moving multiple files.


    To delete more than one file, do the following:


    +   1. Tag the files you want to delete (see “Tagging Files,” e-lier in this chapter).


    At the bottom of the panel, you see the number of files you''ve marked, and the
    number of bytes these files contain.


    +   2. From the File menu, choose Delete, or press F8. You''ll see the Delete
    dialog box.


    +   3. Choose Yes to delete the files.'
