    # Resistance to Computer Viruses


    Hardly a week goes by without new reports of computer viruses, such as Melissa,
    that spread by exploiting the tight integration between Microsoft Windows and
    Windows applications. Windows and Macintosh systems are also afflicted by boot
    viruses, which infect the portion of the hard disk used to start the computer.
    Computer virus victims may devastating work losses and even public embarrassment;
    one particularly nasty virus surreptitiously posts a user''s Microsoft Word files
    to Internet newsgroups with the subject heading “Child pornography!”


    Although no operating system provides total immunity from computer viruses and
    other destructive programs, Linux offers the best available protection. First,
    Linux applications do not integrate tightly with the operating system in the way
    that Windows applications do. In Windows, this tight integration gives malicious
    program authors many ways to create destructive programs. In addition, Linux enforces
    a distinction between ordinary users and the root user, or system administrator.
    When you use Linux after logging in as an ordinary'
