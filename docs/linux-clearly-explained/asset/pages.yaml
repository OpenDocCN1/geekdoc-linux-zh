  md: '# Organizing and Sorting a Submenu


    Once you’ve added items and folders to your menus, you can organize them by moving
    them up and down, or by sorting them.


    To move an item up or down, select the item, and click Move up or Move down.


    To sort a submenu, you need to log in as the root user. Log out of your user account,
    if necessary, and log in as root.


    To sort a submenu, select the submenu name (try selecting User Menus), and click
    Sort Submenu. (You can also use the Ctrl + S keyboard shortcut). This button sorts
    the submenu in alphabetical order.


    > TIP If you’ve created additional submenus within the current submenus, you can
    sort all of them at the same time. Select the topmost submenu, click Sort on the
    menu bar, and choose Sort Submenu Recursive. (You can also use the Ctrl + R keyboard
    shortcut.)


    # Editing Your Menus


    If you would like to delete an item you’ve added, select it and click Delete.
    (You can also use the Ctrl + D keyboard shortcut, or just press Del.)


    # Starting Programs Automatically


    When you exit GNOME, you have the option of saving the current setup. (This option
    is turned off, by default.) If you activate this option, GNOME saves information
    about the applications you’re running, and you’ll see these applications'
