    | | |

    |---|---|

    | 1965 | Bell Laboratories joins MIT and General Electric in bid to create a multi-user
    operating system called Multics |

    | 1969 | AT&T drops out of Multics project; Thompson and Ritchie create first
    versions of Unix on a disused PDP-7 microcomputer. |

    | 1973 | Unix rewritten in C, a new high-level programming language. |

