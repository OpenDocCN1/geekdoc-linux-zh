  md: '# Understanding Terminal Emulators


    Should you wish to type commands at the Linux prompt, you can use a terminal emulator
    program. Such a program enables you to work in the text-only mode without having
    to exit the X Window System.


    If you''ve used Microsoft Windows, you''ve probably used the MS-DOS window to
    enter DOS commands directly. Terminal emulators provide much the same function,
    but with an important difference. Because the X Window System is completely independent
    of the Linux kernel, the terminal emulator provides a means of communication with
    the kernel that'' established on a session-by-session basis. For this reason,
    you can have several terminal emulators running at the same time, should you wish
    to do so. You can also choose which terminal emulator you''d like to run.


    In GNOME, you can choose from the following terminal emulators:


    +   - Regular Xterm A monochrome, text-only terminal emulator.


    +   - Color Xterm Uses colored text against a black-ground.


    +   - GNOME terminal A nifty terminal emulator that enables you to load a bit-mapped
    graphic image in the window background.


    # Understanding Multiple Desktop Areas


    Window managers can define a virtual desktop that''s larger than the area your
    monitor can display. For example, Enlightenment''s default settings create a virtual
    desktop that''s four times the size of your display screen; you''ll find desktop
    areas (two across and two down). (Enlightenment enables you'
  merge: -1
  pgno: 226
- img_proc: true
  md: 'CHAPTER 8 • EXPLORING GNOME


    to define up to 64 desktop areas, eight across and eight deawn.) When you start
    Enlightenment, you''ll view the top left desk-top area.


    If you''ve never used a system with a virtual desktop before, you''ll find that
    the concept takes some getting used to. If you move the mouse pointer to a screen
    that borders on another desktop area, you''ll find that the screen jumps to the
    next desktop area——which can be disconcerting if you don''t realize what''s happening.
    (If you dislike this behavior, you can disable edge flipping, as explained later
    in the section titled “Configuring Enlightenment.")


    Chances are you''ll grow to like the virtual desktop. Instead of keeping lots
    of windows all stacked up on one confining screen, try running applications in
    their own desktop areas. Thanks to GNOME''s Pager, part of the GNOME Panel that''s
    discussed in the next section, you can easily move from one desktop area to the
    next. Each desktop area shows the same background, and each has the GNOME Panel.


    # Exploring GNOME’s On-Screen Features


    Now that we''ve got the fundamentals out of the way, it’s time to explore the
    GNOME desktop. Start by looking at the overall structure of the screen (see Figure
    8.1); you’ll see the GNOME Panel at the bottom of the screen.


    > TIP The GNOME desktop is almost infinitely customizable, so bear in mind that
    the rather plain-looking screen shots in this chapter show the default GNOME settings.
    You can add backgrounds, sounds, new custom panels, and much more. You''ll learn
    how in Chapter 10.'
