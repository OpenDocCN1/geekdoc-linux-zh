    # Starting the Installation


    If you''re prepared for installing Linux as described in Chapter 4, you''re ready
    to install the Linux operating system on your computer. This chapter walks you
    through the steps you follow to install Red Hat Linux 6.0 on your PC.


    # Making Room for Red Hat Linux


    Before you run the installation software, you need to make sure that you have
    made room for Red Hat Linux.


    You can do so in two ways:


    +   - If you want to create a two-OS system as described in the previous chapter,
    you need at least 700MB of free,'
  merge: -1
