  md: '# Accessing Disk Drives


    If you configured your system so that users can access disk drives (see Chapter
    7), you’ll see disk drive icons on the left side of your screen. Try right-clicking
    one of these icons. You’ll see a pop-up menu that enables you to do the following:


    +   - **Open** This option mounts the disk, if necessary, and plays the disk’s
    contents in File Manager.

    - **Mount** This option mounts the disk, but without opening a File Manager window.
    If the disk is already mounted, this option is called Unmount.

    - **Eject** If the device uses ejectable media (such as a Zip disk or CD-ROM),
    you can choose this option to unmount the drive and eject the disk.


    > TIP If you don’t see the disk drive options, right-click the desktop background,
    and choose Recreate Desktop Shortcuts. If you still don’t see them, you need to
    configure your system so that users can access disk drives, as explained in Chapter
    7.


    # From Here


    Now that you’ve mastered the fundamentals of the GNOME File Manager, you’re ready
    to choose your preferences for the way GNOME works. Find out how in the next chapter.'
