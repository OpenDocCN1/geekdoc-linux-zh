  md: '# Modifying User Settings


    If you need to change user information or privileges, including changing passwords,
    click User accounts in LinuxConf’s left panel, and click the user’s name. Make
    the changes you want, and click Accept and Quit to confirm them.


    # From Here


    In this chapter, you’ve learned the fundamentals of system administration for
    a desktop Linux system. There’s more to system administration—much more—if you’re
    running a multi-user system, especially one that’s connected to the Internet via
    a permanent, full-time connection. On such systems, security becomes more than
    a passing concern. Still, you’ve learned enough to manage a desktop system.


    From here, there’s just one chapter to go: Chapter 17, which shows you how to
    use the text-based version of Midnight Commander to perform many system administration
    tasks.


    # References and Further Reading


