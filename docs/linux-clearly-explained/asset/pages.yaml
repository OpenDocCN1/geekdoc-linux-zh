  md: '# # Adding Drawers to GNOME Panels


    Need room for more applets? You can create drawers to hold them. A drawer looks
    like a button. However, when you click it, it “pulls out” the drawer to reveal
    a new Panel section, at right angles to the existing Panel.


    # ## Adding a Drawer


    To add a drawer, click the Main Menu button, point to Panel, and choose Add drawer.
    You’ll see the drawer button on the Panel; it’s pulled out slightly so you can
    add applets to it. To close the drawer, click the hide button on the end of the
    drawer; to open the drawer, click the drawer button (see Figure 10.12).


    To add applets to a drawer:


    +   1. Open the drawer by clicking the drawer button.

    2. Click the Main Menu button, point to Panel, point to Add Applet, point to one
    of the applet categories (such as Amusements or Utilities), and select an applet
    from the submenu.


    > TIP Chances are you created the drawer because your existing Panel is getting
    too crowded. To move existing applets to the drawer, right-click the applet button,
    choose Move applet, and click within the drawer.


    If you would like to remove the drawer, right-click the drawer button and choose
    Remove from panel. Bear in mind that you’ll lose the applets you’ve added to this
    panel, so you may wish to move the applets to another panel before you remove
    the drawer.'
  merge: -1
