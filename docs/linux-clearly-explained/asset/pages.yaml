    menu, you can select Move Here or Copy Here. Note: be sure to click the mouse
    button before you press the Alt key; otherwise, you''ll move the whole window
    when you drag.


    You can use drag-and-drop to move or copy files or directories to another folder
    within your home directory; just drag the selected file or directory to one of
    the folders in the Tree View. As you drag, you''ll see an icon indicating that
    you''re moving or copying something. In the Tree View, you can scroll the panel
    by moving the pointer to the top or to bottom of the panel. To open a collapsed
    folder, just position the pointer over the folder; File Manager will expand the
    display to reveal the hidden directories.


    You can also move or copy files or directories between two File Manager windows.
    To open a new File Manager window, click File on the menu bar and choose Create
    New Window. After opening the source directory in one window and the other, you
    can drag the file from the source window to the destination window; drop the file
    on the folder where you wanted the copied or moved file to appear.


    > TIP To make frequently used files more accessible, you can move or copy them
    to the desktop. Use drag-and-drop to move or copy the file, and release the mouse
    button where you want the file to appear.


