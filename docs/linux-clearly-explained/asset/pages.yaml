    the commands discussed in this chapter require root user or superuser status;
    you shouldn''t experiment with these commands unless you''re sure you know what
    you''re doing.


    # Understanding Virtual Consoles


    Unlike MS-DOS, Windows 95/98, or Mac OS, Linux is a true multi-user operating
    system. When you''re using the console (a keyboard and monitor that are working
    with Linux), you are only one of many people who could be using the system in
    the same way. Of course, you probably have only one keyboard monitor hooked up
    to your computer right now. But you can still see for yourself what Linux''s multi-user
    capabilities are all about, thanks to virtual consoles. Virtual consoles'
