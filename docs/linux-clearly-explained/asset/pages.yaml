    # Understanding File Ownership and Permissions


    Because Linux is a multi-user operating system, it’s important that some files
    are accessible to every user, while others—particularly configuration and password
    files—are accessible only to the system administrator. In addition, users need
    to be given full access to their own files, while such access should be restricted
    or prevented entirely for other users.'
  merge: -1
  pgno: 281
- img_proc: true
  md: '252


    PART THREE • RUNNING GNOME


    For these reasons, every Linux file is stored with *attributes* (settings) that
    define the following:


    +   **File ownership** A file is owned by the person who creates it. When you
    create a file in your home directory, you are the owner, and you automatically
    have permission to read and alter this file. However, your rights to read or alter
    files outside your home directory may be restricted.


    +   **Permissions** A file''s *permissions* specify just who can do what the file.
    For a given type of user, permissions specify whether the user can read the file,
    write to the file (including deleting the file), or execute the file (if it is
    an executable file).


    The following sections explain these concepts in more detail; subsequently, you’ll
    learn how to adjust file ownership and permissions with File Manager.


    # Types of Files


    Linux defines the following categories of file owners:


    +   **User** The user who owns the file. Normally, this is the person who created
    the file, but the root user (system administrator) can change file ownership,
    as explained in Chapter 15.


    +   **Group** When you create user accounts, you can place two or more users into
    a *group*. Groups are very useful when two or more people need to work on the
    same file or within the same directory.


    +   **Others** This category includes all other users *except* the user and group.'
  merge: -1
  pgno: 282
- img_proc: true
  md: '# Types of Permissions


    For each type of file owner, you can define the following permissions:


    +   - **Read** Determines whether a given category of users can read a file.

    - **Write** Determines whether a given category of users can alter a file (including
    deleting the file).

    - **Execute** Determines whether a given category of users can launch (execute)
    a program or script. Applied to directories, this term is equivalent to directory
    access.


    > NOTE Executable (program) has two additional permission types called set userid
    (Set UID) and set group userid (Set Guid). Of use system administrators, these
    permissions specify that the program will start with the permissions available
    to the owner of the file. This is often a useful feature (and sometimes it is
    essential for security reasons). For example, suppose you''ve installed WordFor
    Linux 8.0, and you want to make a public document directory available for all
    users. So you create a user account called wp. You also create a directory /home/wp.
    When users start WordPerfect, the program runs so that everyone has access to
    the documents in /home/wp.


    # Examining and Changing Ownership and Permissions


    As the owner of all the files within your home directory, you can change the ownership
    and permissions of any of these files. However, you cannot adjust the ownership
    or permissions of files outside your home directory, unless you specifically set
    up your system to give users this right—which isn''t a very good idea. One of
    the basic reasons for creating user accounts is to prevent users from making a
    mess of permissions outside their home directories.'
  merge: -1
  pgno: 283
- img_proc: true
  md: '# 254 PART THREE • RUNNING GNOME


    To view a file''s ownership and permissions, right-click the file icon or name
    of a file within your home directory, and choose Properties from the pop-up menu.
    You''ll see the Properties dialog box. Click the Permissions tab. You''ll see
    the Permissions page, shown in Figure 9.19. You see the current file permissions
    and ownership settings in the two areas.


    In the Permissions area, you can change the permissions for any owner type, including
    User (that''s you, if you''re looking at a file in your home directory), Group,
    and Other.


    In the File ownership area, you see the current file owners. (You can''t change
