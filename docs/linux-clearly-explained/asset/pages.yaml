    # Freedom from Licensing Hassles


    Commercial operating systems specify severe penalties for failure to remain in
    compliance with licensing terms; should a company breach these terms, the result
    could be an expensive, time-consuming lawsuit or even criminal charges. An organization
    may violate commercial software licenses inadvertently; for example, some commercial
    Internet transaction programs specify a maximum number of concurrent transactions,
    but this number may be exceeded should the service experience an unexpected surge
    in demand. If the transgression is detected by the vendor''s monitoring software,
    the organization could find itself threatened with hefty fee increases or a lawsuit.
    Commercial software licenses expose organizations to unwanted liabilities; Linux
    carries no such burden.


