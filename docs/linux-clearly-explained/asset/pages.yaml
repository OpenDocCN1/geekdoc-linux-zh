    | File system | Description |

    |---|---|

    | ext | Older Linux filesystem |

    | ext2 | Today''s standard Linux filesystem |

    | hfs | Hierarchical File System (Mac OS) |

    | hpfs | OS/2 filesystem |

    | iso9660 | CD-ROM filesystem |

    | msdos | MS-DOS filesystem (no long file names) |

    | nfs | Network File System (NFS) |

    | ntfs | Windows NT |

    | ufs | BSD Unix filesystem |

    | vfat | Windows 95/98 filesystem with long file names |


    > NOTE Filesystem support is built into the Linux kernel, and your kernel may
    not support all these filesystems without modification. see which filesystems
    your kernel supports, type less /proc/filesystems and press q to exit the list.'
