  md: '# Table 9.3 Sound file formats (default configuration)


    | Format | Description |

    |---|---|

    | AIFF | Apple sounds This sound format enables recordings using a variety of
    sampling rates; quality varies, but can be very good. |

    | AU | Sun/NeXT sounds Originally developed for UNIX workstations, this sound
    format enables recordings using a variety of sampling rates; most often, these
    are low-quality mono sounds intended for low-fidelity applications (such as providing
    a brief sample of a higher-quality sound that takes longer to download). |

    | MOD | Amiga sounds Like MIDI sounds, MOD files contain a transcription of the
    notes to be played by a synthesizer. But they also contain samples of the synthesized
    sounds, so they''re larger than MIDI files (but smaller than recorded sounds).
    |

    | MP3 | MPEG Level 3 sounds This sound format offers exceptionally high quality
    (CD audio quality) with excellent compression. |

    | RAM | Real Audio sounds This sound format is generally used to enable real-time
    (streaming) delivery of low-quality sounds over the Internet. |

    | S3M | Amiga sounds This format is a derivative of the Amiga MOV format. |

    | SND | Macintosh sounds This sound format closely resembles the AIFF and WAV
    formats and is used for system and other sounds on Macs. |

    | VOC | Soundblaster sounds A sound recording format created by the makers of
    the Soundblaster cards. Infrequently used. |

    | WAV | Windows sounds Like AIFF sounds, this sound file format enables a variety
    of quality levels for recorded sounds; quality can be excellent, but WAV files
    are generally very large. |'
  merge: -1
