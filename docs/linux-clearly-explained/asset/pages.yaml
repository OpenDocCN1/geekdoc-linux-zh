    # The Berkeley Software Distribution (BSD)


    Although the number of Unix installations grew steadily during the mid- to late-1970s,
    the operating system gained a reputation for being extremely difficult to use.
    One called it a “guru-friendly operating system,” pointing out that the cryptic
    commands were close to useless unless you had considerable experience with Unix.


    Unix''s user-unfriendliness derived, in part, from the memory limitations of the
    PDP-7 minicomputer that served as the original development platform. The original
    Unix command set is'
