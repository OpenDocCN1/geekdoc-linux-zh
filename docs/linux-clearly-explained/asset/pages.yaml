  md: '# The GNU Project and the General Public License (GPL)


    In 1984, Richard Stallman, then a professor of computer science at MIT, resigned
    his position to found a new, nonprofit organization called the Free Software Foundation
    (FSF). Its goal is to develop a new, copyright-free version of the Unix operating
    system, called GNU’s Not Unix (Free Software Foundation 1999, Fraser 1990). Harnessing
    the efforts of hundreds of volunteer programmers, the GNU Project has created
    copyright-free code that emulates each of the Unix operating system. They have
    also created an new concept of intellectual property, often called open source
    software (FSF) prefers the term “free software”.


    > TIP Open source software isn''t necessarily free; companies can and charge money
    for open source software. What is free about open source software is the source
    code, the programming that underlies a product’s functionality. A software company
    can charge money for compiled open source software, but they must make the source
    code freely available to others.


    The GNU Project releases software under the terms of the GNU General Public License
    (GPL), which specifies a form of intellectual ownership that FSF calls copyleft.
    In brief, GPL gives software licensees the right to use, copy, and redistribute
    the software. It also gives users the right to view and modify the source code,
    the programming code that underlies the software’s functioning.


    What GPL expressly forbids, however, is the inclusion of any GPL-licensed code
    in a commercial software product that does not come with open, modifiable source
    code. In other words, if you obtain GPL-licensed code, and wish to distribute
    to others, you must give others the same rights you were initially given; you
    can’t incorporate GPL-licensed code in a product'
  merge: -1
  pgno: 44
- img_proc: true
  md: '# CHAPTER 1 • THE UNIX HERITAGE


    and then deny others the GPL-mandated right to your source code. According to
    FSF, the General Public License directly addresses the deficiencies of the BSD
    license, which did not forbid licensees from incorporating the code into commercial
    products that denied access to the underlying code.


    > TIP Note that GPL terms do not prohibit software developers from receiving money
    for their efforts; open source software isn''t necessarily free in a monetary
    sense. Open source developers can and do receive payment for their work, but they
    must allow those who obtain their programs to get the source code, and they must
    also permit licensees to modify and redistribute the source code. In practice,
    all or most open source software can be obtained without charge, but it''s often
    more convenient to pay a small fee to obtain the software in an easy-to-install
    collection called a distribution. You''ll learn more about distributions in Chapter
    9.


    The GNU Project did not succeed in its goal to create a Unix clone. Although Stallman
    succeeded in creating copyright-free versions of most of the associated software,
    he was sidelined by an incapacitating repetitive strain injury and never finished
    the Unix kernel, the core of the operating system (Mann 1999).


    # The Need for Standardization


    The legal wrangling over Unix has ended, but no single, standard version of Unix
    has emerged in the marketplace. Most current versions of Unix are influenced by
    either AT&T''s System V or Berkeley BSD, but the derivatives are numerous. According
    to one estimate, more than 200 versions (or "flavors") of Unix exist, each with
    its own, sometimes idiosyncratic command set.


    In the commercial UNIX marketplace, several commercial versions vie for the enterprise
    computing marketplace, but the'
  merge: -1
