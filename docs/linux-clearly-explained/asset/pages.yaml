  md: '# Copying Files


    To copy files, use the cp command. Like mv, it''s dangerous; by default, the command
    gives you no confirmation if you''re about to overwrite a file. You might accidentally
    overwrite a file if you specify a destination file name that is the same as an
    existing file. To avoid overwriting a file accidentally, always use cp with the
    -b (backup) or -i (interactive) options.


    The cp command uses the following syntax:


    ```

    cp -i source-file destination-file

    ```


    For example, the following command makes a copy of file-1, and names it file-2;
    the -i option provides confirmation if file-2 already exists and would be overwritten
    if you proceeded with the command:


    ```

    cp -i file-1 file-2

    ```


    If you type a directory instead of a destination filename, cp copies the source
    file to the named directory, as in this example:


    ```

    cp -i file-1 /home/suzanne/backup

    ```


    You can copy two or more files at a time using the * wildcard, which stands for
    any character or any group of characters. The following command copies all the
    files in /home/mike/docs to /home/mike/backup:


    ```

    cp -i /home/mike/docs/* /home/mike/backup

    ```'
