    In August, 1996, Linux Journal and a number of other Linux-related publications
    received a letter from attorneys of a Mr. William R. Della Croce, Jr., informing
    them that Della Croce owned the Linux trademark and that further use of the trademark
    would require licensing. Della Croce reportedly attempted to collect 10% royalties
    from firms selling Linux products. You can imagine the Linux community’s outrage.


    In association with several Linux companies and Linux International, Torvalds
    petitioned the U.S. Patent and Trademark Office to cancel Della Croce’s trademark.
    Assisting the petitioners was a high-powered California intellectual property
    law firm, Davis & Schroeder, of Monterey, CA, which handled the case at reduced
    fees as a service to the Linux community. In August, 1997, Della Croce settled,
    transferring the trademark to Linux Torvalds.


