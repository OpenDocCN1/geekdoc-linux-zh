  md: '# Finding Out Where You Are


    If you''re not sure which directory you''re in, type pwd and press Enter. You''ll
    see the directory''s full pathname, such as /home/bryan/myfiles.


    # Displaying Directory Contents


    To work with Linux files, you will want to display lists of the files a directory
    contains. You can perform this task using a variety of commands, including ls
    and dir, the two discussed in this section.


    # Listing Directories


    You can use the ls command to display a simple list of the files and subdirectories
    that a directory contains. To do so, use ls or dir and press Enter. You''ll see
    a display such as the following:


    ```

    yosemite.xbm   soundoff      junk.doc

    chapter1.txt    old-stuff      resume

    ```


    One drawback of ls is that you can''t tell which of these items is a file and
    which is a subdirectory. To cure this problem, you can use the -F option (note
    that you must type a capital "F\). Trying ls -F within the same directory:


    ```

    yosemite.xbm   soundoff*     junk.doc

    chapter1.txt   old-stuff/

    ```


    Note that the subdirectories are marked by a following slash. If there are any
    executable files (programs) in the directory, they’re marked with a following
    asterisk.'
