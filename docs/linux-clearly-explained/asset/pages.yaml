- img_proc: true
  md: 'the ls command is piped to the less command, enabling you to page through a
    lengthy directory listing:


    ```

    #ls | less

    ```


    Note the vertical bar character (|), the symbol that creates the pipe. Also, notice
    that this expression is evaluated from left to right; the first command is ls,
    and its output is piped to less.


    # Redirecting Output and Input


    With a pipeline, you can direct the output of one program to the input of another
    program. With output redirection, in contrast, you can direct the output of a
    program to a file. With input redirection, a file can provide input to the shell.


    Here''s a simple example of output redirection, signified by > symbol:


    ```

    ls -l >directory.txt

    ```


    This command tells the ls command to direct its output to a file called directory.txt
    rather than the display screen.


    Here''s a simple example of input redirection, signified by < symbol:


    ```

    ls - 1 <directory.txt

    ```


    This command starts the ls program, and tells it to receive input from the file
    called directory.txt.


    # Shell Scripts


    A shell script is a plain text file that contains shell commands, including the
    simple commands you type at the keyboard. You can create a shell script, make
    it an executable file (see Chap-'
  merge: -1
  pgno: 462
- img_proc: true
  md: '# CHAPTER 15 • USING THE SHELL AND FILE UTILITIES 433


    ter 9), and run it by typing its name and pressing Enter. All the commands in
    the file execute, just as if you had typed them.


    Shell scripts can be much more complex than a sequence of commands. Because bash
    incorporates the control structures of a full-fledged programming language, shell
    scripts can act like programs in their own right. (A control structure provides
    programmers the means to create alternative to simple program sequences; for example,
    one control structure keeps repeating a procedure until a condition is met.)


    To configure your Linux system or one of your applications, a manual may instruct
    you to locate and edit a shell script. Be careful to make only the specified change.
    It''s a wise practice to make a backup copy of the original script, so that you
    can restore the original in case you make a change that leads to unwanted consequences.


    # From Here


    In this chapter, you’ve learned how to use the GNU file utilities and the bash
    shell. You’ll surely find it easier to use the GNOME File Manager (Chapter 9)
    and the text-mode Midnight Commander (Chapter 17) for most of these operations,
