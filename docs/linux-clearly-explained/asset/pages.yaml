- img_proc: true
  md: 'lack of standardization—especially user interface standardization—has created
    a tremendous market opportunity for Microsoft Windows NT. Offering the familiar
    and easy-to-use Windows interface, NT is targeted directly at the client/server
    networks where Unix current preominates.


    In an effort to standardize UNIX that can fend off the NT threat, commercial UNIX
    vendors rallied around the Open Group, an industry consortium formed in 1996 by
    merging the Open Software Foundation (OSF) and the X/Open Company. The Open Group
    promotes the Single UNIX Specification, which specifies a common application programming
    interface (API) for Unix operating systems. By conforming to this interface, a
    programmer can be confident that an application will run on any Unix system that
    conforms to these guidelines. Conforming operating systems and applications can
    apply for, and use, the UNIX trademark under license from the Open Group. In addition,
    the Open Group promotes and supports the Common Desktop Environment (CDE), a desktop/windowing
    interface for Unix computers. Although official Linux organizations cannot refer
    to the Open Group standards without paying licensing fees, Linux conforms to these
    standards (Irwin 1998).


    Standardization is proceeding along another, compatible avenue, thanks to the
    Portable Operating System Interface for Unix (POSIX) standard, jointly developed
    by the Institute for Electrical and Electronic Engineering (IEEE) and the International
    Organization for Standardization (ISO), which isn''t an acronym but rather the
    Greek word iso, POSIX defines a standard application programming interface (API)
    for Unix operating systems, giving programmers some assurance that their programs,
    when compiled on a POSIX-compliant platform, will run properly. Linux is a POSIX-compatible
    version of Unix.'
