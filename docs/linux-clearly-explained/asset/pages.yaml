  md: '# The X Philosophy


    Experts agree there''s a reason Microsoft Windows and the Mac OS are so popular:
    consistency. If you''ve learned Windows, for example, you can sit down at just
    any Windows system, and use skills you''ve already learned. To be sure, Windows
    allows some customization, but not that much. X is different. With X, you''ve
    the freedom to choose the screen from a variety of window managers, each of gives
    the screen a different ''look and feel''. Although there are, some fundamental
    skills that are useful on any system running X, it''s indisputable consistency
    isn''t one of X''s strong points.


    The lack of consistency is quite deliberate. It stems from the X philosophy, which
    is summed up by the following phrase: "mechanism, not policy." This means, "give
    people powerful tools—but don''t force them to adopt a specific look and feel."
    In the X philosophy, you''ve a right to design your workstation just as you please,
    even if means you come up with a system that even another X user would have difficulty
    using!


    The lack of consistency may be slowing down X''s market penetration, but that
    other philosophy we''ve discussed—the philosophy (see Chapter 1)—holds that X
    is doing the Right Way. In contrast to Windows and Mac OS, X isn''t tightly coupled
    to the operating system; in fact, it''s completely independent. With well-written
    code, this augers for greater system stability, and that''s something that may
    prove more important than interface consistency for millions of users.


    # An X Window User''s Peeves List


    Here are some of the shortcomings of X that prove particularly galling to most
    users:


    +   * Configuration X is notoriously difficult to configure. For example, there''s
    no user-friendly procedure for adding applications to menus. In Mac OS and Windows,
    items automatically appear after you install a program, but that''s not the necessarily
    case in X.'
  merge: -1
