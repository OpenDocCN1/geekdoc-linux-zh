  md: 'CHAPTER 7 • SYSTEM CONFIGURATION ESSENTIALS


    > **CAUTION** Never quit Linux by skipping the shutdown procedure and shutting
    down the power. You may scramble the data on your hard drive—so badly, in fact,
    that you may not be able to restart your system. The reason you might lose data
    has to do with Linux''s disk caching system. This system writes cached data to
    the disk every few seconds (rather than continuously). This gives better performance,
    but it also entails the risk of data loss should you switch off the power while
    the cache software is writing data to the disk. Should you experience a system
    crash or a failed component (such as a dead keyboard) that prevents you from shutting
    down properly, wait several minutes before you switch off the power so that the
    cache software can write cached data to the drive.


