    # Understanding the Linux Filesystem


    Now that you''ve inventoried your system, you''re almost ready to start. What
    you need now is a bit of conceptual orientation regarding the Linux filesystem.
    If you''re used to MS-DOS, Microsoft Windows, or Mac OS, you''ll find much that''s'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'CHAPTER 4 • PREPARING TO INSTALL RED HAT LINUX


    familiar in the Linux filesystem: there’s a hierarchy of directories and subdirectories
    (or folder and subfolders, if you prefer), and the directories are used to organize
    files. But there are some important differences, too (elegantly explained in Welsh,
    et al. 1992-1998: 44–47); they’re summarized in this section.


    # Introducing Linux Directories


    Let’s start with concepts that do not depart radically from the knowledge you
    already have. As in Windows or MS-DOS, a directory is a named storage area that’s
    used to group related files.


    A directory can contain one or more subdirectories, which in turn can contain
    files and additional subdirectories. The directory structure is a hierarchy, with
    the root directory positioned at the top. The root directory is symbolized by
    a forward mark (/), and is analogous to the C\ directory in MS-DOS.


    # Understanding Partitions


    A partition is a portion of a disk drive that has been electronically modified
    so that it can be treated as a separate unit for formatting and data storage purposes.


    In the Windows and MS-DOS world, the operating system gives each partition its
    own drive letter. For example, disks are often divided into two partitions, called
    drive C and drive D. It is not possible for a directory to span two or more partitions.
    As a result, Windows and MS-DOS users must necessarily confront the physical realities
    of disk drives and partitions.'
  merge: -1
  pgno: 127
- img_proc: true
  md: '# Directories and Partitions in Linux


    Linux directories and partitions differ from their Windows and MS-DOS counterparts
    in two important ways:


    +   - A single directory can span two or more partitions—and indeed, two or more
    disk drives.

    - A partition doesn''t appear as a separate disk drive. Instead, it can be mounted
    at any point within the overall directory structure, so that it appears to be
    a seamless partition of this structure.


    By breaking the tight link between directories and partitions, Linux enables system
    administrators to create seamlessly integrated filesystems that span several partitions
    and disk drives. Users no longer need to worry (as they must with MS-DOS and Windows)
    just where data is physically located. On a network, this advantage becomes even
    more significant. Network administrators can create seamless filesystems that
    span a number of separate computer systems; yet these filesystems appear to users
    to be a seamless whole. Without realizing, a given user might be working with
    a directory that is physically located on a different computer.


    # Mounting Partitions and Disk Drives


    When you mount a partition, Linux includes the partition''s directories and files
    within the directory tree structure that you see on-screen. The point where the
    partition is mounted is called the mount point.


    Although some Linux users install Linux in one large partition on their hard drives,
    it''s a better practice to divide the drive into several partitions. For example,
    it''s a good practice to create separate partitions for your personal files and
    for any software that you install. You can then install or upgrade'
  merge: -1
  pgno: 128
- img_proc: true
  md: '# CHAPTER 4 • PREPARING TO INSTALL RED HAT LINUX


    system software with the assurance that your personal files and installed software
    will not be overwritten.


    If you create more than one Linux partition on your hard drive, as this book recommends,
    you don''t need to worry about mounting these partitions every time you use Linux.
    The installation software automatically configures Linux so that the partitions
    on your hard drive are automatically mounted.


    What about disk drives and CD-ROM drives? Like partitions, they''re conceptualized
    as an extension of the filesystem. Instead of assigning drive letters, as MS-DOS
    does, devices are treated as if they were partitions. They''re mounted within
    the /mnt directory. Generally, disk drives aren''automatically mounted when the
    system starts. In order to access the data on disk drives, you''ll need to mount
    them, using system commands provided for this purpose.


    # The Filesystem Hierarchy Standard (FHS)


    One obstacle to the wider acceptance of Linux is the incompatibility of filesystem
    structures among competing Linux versions. Recognizing this situation is disadvantageous
    to everyone, a group of volunteers created the Filesystem Hierarchy Standard,
    currently available in version 2.0 (Quinlan 1997).


    The major Linux distributors, including Red Hat and Debian, have agreed to support
    this standard, which is summarized in Table 4.4.


    > TIP Be sure to study Table 4.4 carefully and make sure you understand the organization
    of the Linux filesystem, as specified by the FHS standard. In particular, note
    that you should install new commercial programs in /opt and new, noncommercial
    programs in /usr/local. As you''ll learn subsequently, it is very wise to assign
    these'
  merge: -1
  pgno: 129
- img_proc: true
  md: '# PART TWO • INSTALLING RED HAT LINUX


    directories to their own partitions so that you can protect them

    being overwritten when you install operating system upgrades.


    | Table 4.4 Structure of the standard Linux filesystem |

    | Directory | Contents |

    | / | This symbol stands for the root directory, the top-most directory in the
    Linux filesystem. The root directory must not contain any subdirectories besides
    the ones specified in the standard (bin, boot, dev, etc, home, lib, mnt, opt,
    root, sbin, tmp, usr, and var). |

    | /bin | Short for “binaries,” this directory contains many essential system utilities
    that need to be accessible to all users as well as the system administrator. It''s
    not supposed to contain subdirectories. |

    | /boot | This directory stores the files needed to start your computer. |

    | /dev | Short for “devices,” this directory contains the files that represent
    the peripheral devices installed on your system, such as network interface cards,
    modems, and your mouse. |

    | /etc | You''ll find most of the important system configuration files in this
    directory. This directory isn''t supposed to contain any executable files (bin).
    |

    | /home | This directory is reserved for users'' home-directories. |

    | /lib | This directory stores shared libraries, which contain programming instructions
    that one or more applications use in common. |

    | /mnt | Here''s where you''ll find representing disk drives and other peripheral
    storage devices, such as Zip drives. |

    | /opt | This directory is optional; it''s used for installing commercial software.
    Ideally, this directory'
  merge: -1
  pgno: 130
- img_proc: true
  md: 'should be installed on its own partition, so that you can safeguard it from
    being overwritten if you install a system software upgrade.


    /proc


    This directory''s contents change depending on which programs, or processes, you''re
    running. Each process is represented as if it were part of the filesystem. Everything''s
    a file, remember?


    /root


    Don''t confuse this directory with the root directory (/); it''s actually just
    a home directory for the system administrator, who logs in with the user name
    "root".


    /sbin


    This directory includes non-vital system utility programs (the indispensable ones
    are stored in /bin).


    /tmp


    This directory is used to store temporary information needed by the programs you''re
    using.


    /usr


    This read-only directory contains most of your system''s software, including the
    executable files (binaries) and documentation. An important directory is /usr/local,
    where you''ll install the non-commercial software you add to your system. Like
    the /opt directory, it''s wise to place in its own partition so that it''s /usr/local
    directory in its own protected from being overwritten when you upgrade system
    software.


    /var


    This directory includes log files, print spooling files, and other files that
    typically grow in size.


    # Choosing Your Installation Class


    When you install Red Hat Linux, you''ll need to specify how you want the installation
    software to set up your Linux filesystem. Take a few minutes now to understand
    your options here.'
