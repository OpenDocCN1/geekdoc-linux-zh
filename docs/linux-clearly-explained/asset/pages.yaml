  md: '# Not Just for Intel-Powered PCs


    Offering all the advanced features of Unix (summarized in Chapter 1), Linux is
    best known as a version of Unix for PCs running Intel hardware, but this characterization
    is inaccurate; although initially developed for Intel hardware, Linux (in line
    with the Unix philosophy, explained in Chapter 1) is written mostly in a high-level
    programming language, and is therefore easily ported to other computer platforms.
    Versions of Linux are now available for a wide variety of computers, including
    Sun, Digital, and Silicon Graphics workstations and the Power PC. Projects are
    under way to port Linux to many additional computer platforms. Because Linux excels
    in nearly every performance category, even when compared with very expensive commercial
    UNIX systems, some experts believe that Linux may become the most widely-used
    Unix-like system in the coming years.


    # The Respectability Factor


    Any operating system created by part-time, volunteer programmers will necessarily
    struggle for legitimacy. At South-western Bell, engineers chose Linux for a mission-critical
    installation that monitors switches, fibers, and call centers. The legal department
    objected, asking how they could sue if something went wrong. The IT department
    also observed, calling Linux “hackerware.” But the skeptics became believers when
    the installation cut maintenance costs by 90 percent. Clearly, Linux is winning
    the battle for legitimacy. Linux has been deployed in mission-critical settings
    with excellent results. For example, the U.S. Postal Service has been running
    Linux systems since 1997 to detect destination addresses.'
