  md: '# Outstanding Performance


    In head-to-head tests on inexpensive Intel hardware, Linux outperforms most other
    versions of Unix, including expensive commercial versions, and outperforms all
    other versions in certain key areas. In most tests, Linux also outperforms its
    chief competitor, Microsoft Windows NT.


    An exception was a 1999 test conducted by Minecraft, in which NT server was found
    to be more than twice as fast as Linux. It was subsequently revealed that the
    test, funded by Microsoft, pitted an expertly configured NT workstation against
    a poorly configured Linux system. Microsoft’s own internal tests, revealed in
    a memo that was leaked to the Internet (see Raymond 1998), show a contrasting
    picture. The memo records a test in which Linux and Windows NT were run in a head-to-head
    competition on identical systems; for Web browsing, Linux and Netscape Communicator
    4.5 outperformed NT and Internet Explorer by a factor of 40 percent.


    Benchmarking is an inexact science, at best, and test results are sometimes manipulated
    or inaccurately reported by interested parties. Still, the evidence shows that
    Linux performs as well or better than competing commercial operating systems,
    particularly on inexpensive Intel hardware.


