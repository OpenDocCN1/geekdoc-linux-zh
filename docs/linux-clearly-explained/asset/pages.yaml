  md: '# A Note on Defragmentation


    The term defragmentation refers to a process in which pieces of a file become
    separated from one another during the course of normal operations. (This doesn''t
    prevent the files from being used, since the disk utilities keep track of where
    the various pieces are located.) However, defragmentation slows down a disk drive
    because the drive head must do more work to find and assemble the various components
    of a file.


    Windows users are accustomed to running defragmentation utilities on their hard
    drives at regular intervals—often as once per day, for heavily used systems. The
    ext3 rules out fragmentation, thanks to its advanced design. In ext2, the various
    portions of a file are automatically kept together as much as possible, so fragmentation
    seldom becomes an issue.


    # Installing and Upgrading Software


    Unix-like operating systems have a poor reputation for ease of use, one reason
    is the difficulty users experience when it comes to installing and upgrading software.
    Happily, that''s changed thanks to Red Hat Software''s Red Hat Package Manager
    (RPM), which provides easy-to-use facilities for installing, uninstalling, and
    upgrading software provided in rpm packages (files with an *.rpm extension). In
    the spirit of open source software, Red Hat Software has made the Package Manager
    available in the form of open source code licensed under the GNU public license
    (GPL).


    You can use RPM by typing commands at the command line, if you wish. And as you''ll
    see, there are some command line options that aren''t available if you run the
    program using friendlier interfaces. For most operations, though, you''ll probably
    prefer to run Goplus, the GNOME manager for RPM files. It''s a nifty utility,
    as you''ll see—especially when you learn how it''s integrated with RPM archives
    located on the Internet.'
  merge: -1
  pgno: 363
- img_proc: true
  md: '# Understanding Package Installation


    As you''ll quickly learn when you begin installing RPM packages, a single program
    often requires you to install two separate RPM files. And the order is critical.
    That because many packages have package dependencies, a term that refers to a
    package''s need to have one or more other packages installed before its own installation
    becomes possible. If you try to install the packages in the wrong order, you''ll
    get an error message, informing you that a package dependency error has occurred.
    You''ll also see a note informing you which package needs to be installed in order
    to install the current package.


    To make sure you''re installing all the packages in the correct order, consult
    the program''s documentation or installation tips prior to installing the RPMs.
    If the documentation isn''t available, you can sometimes work backwards through
    the error messages to determine the correct order, but this process can get very
    tedious if the program requires a dozen or more RPMs (which is sometimes the case).


    # Introducing GnoRPM


    GnoRPM is a useful utility that enables you to work with RPM files in a variety
    of ways. You can do the following with:


    +   * View the list of currently installed packages.

    * Find out more information about a given package.

    * Verify that all of the software associated with the package is correctly installed.

    * Create a desktop launcher for a package.

    * Install or upgrade a package on the Red Hat Linux CD-ROM.

    * Locate and install an RPM package on the Internet.'
  merge: -1
  pgno: 364
