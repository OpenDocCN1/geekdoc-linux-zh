    # Setting Permissions


    In Chapter 15, you learned the use of the chmod command, which enables you to
    alter the permissions assigned to a file. You also learned that permissions are
    difficult to read. Luckily, Midnight Commander enables you to work with file permissions
    easily (see Figure 17.12).


    To change file permissions, do the following:


    +   1. In the file list, select the file.

    2. From the File menu, choose chmod. You can also press Ctl + x, c.

    3. In the Chmod command dialog box, choose the permissions you want for the file.

    4. Click Set.'
  merge: -1
  pgno: 523
- img_proc: true
  md: '# # Creating Links


    Chapter 15 introduced the important Linux concepts of hard links (two or more
    names for the same physical file) and symbolic links (alias names for a file).
    You can easily create either kind of link with Midnight Commander.


    To create a hard link, do the following:


    +   1. In the file list, select the name of the file for which you would like
    to create an additional name (a hard link).


    +   2. From the File menu, choose Link. You can also use the Ctrl + x, l keyboard
    shortcut.


    +   3. In the Link dialog box, type the new name for the file.


    ![](img/21d32b84086223524c8766042726779d_524_0.png)


    Figure 17.12 You can easily change file permissions.'
  merge: -1
