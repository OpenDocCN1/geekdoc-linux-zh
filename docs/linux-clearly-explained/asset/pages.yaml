  md: '# Filtering the File Display


    You can use wild filters to cut down a lengthy file display to just the files
    that match the filter. For example, suppose you''re looking for files that contain
    netscape somewhere in the file name. If you create a filter with asterisk wild
    cards before and after netscape (*netscape*), Midnight Commander will display
    only those files with these characters (netscape) somewhere in the filename (such
    as netscape-communicator or netscape-navigator).


    To filter the file display, do the following:


    +   1. From the File menu, choose Filtered view. You can also use the Alt + !
    shortcut.


    You''ll see the Filtered view dialog box.


    +   2. Type the filter, and click OK.


    > CAUTION Don''t forget that you''ve filtered the view. In filtered view, the
    only files that appear are those that match the filter. To cancel filtering, repeat
    these steps, but delete the filter before clicking OK.


    > TIP To exit a dialog box and cancel your selections within it, you can click
    Cancel or press Esc twice.


    # Finding Files


    Midnight Commander offers a file-finding utility that makes locating files a snap.
    You can specify the start directory. If you wish, you can search the entire Linux
    filesystem, including all the mounted filesystems (such as CD-ROM and floppy drives).'
