  md: '# The Unix Heritage


    To grasp the Linux phenomenon, it''s helpful to begin with its progenitor and
    inspiration, the operating system called Unix. Created by a small group of researchers
    at Bell Laboratories starting in 1969, Unix is unquestionably the most influential
    operating system ever developed; it has influenced virtually every subsequent
    operating system, including MS-DOS, Mac OS, Sun''s Solaris, and many more.


    In this chapter, you''ll learn what operating systems do, how Unix developed,
    and why many experts believe Unix to be the best operating system ever created.
    You''ll also learn about the struggle to create a free version of Unix. This background
    will enable you to grasp the significance of Linux, a version of'
  merge: -1
