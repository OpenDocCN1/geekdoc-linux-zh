  md: '# # Mastering System Administration


    In Chapter 12, “Keeping Your System Running Smoothly,” you learned to perform
    some system administration tasks using GNOME and other user-friendly accessories.
    In this chapter, you learn how to perform many of the same tasks by using the
    command-line interface. As you’ll conclude after reading this chapter, learning
    this material is a good way to gain more understanding of the Linux operating
    system that lies underneath GNOME’s pretty face. What’s more, you may conclude
    that some tasks—such as decoding tar archives—are actually easier and faster to
    accomplish by using the shell.'
  merge: -1
