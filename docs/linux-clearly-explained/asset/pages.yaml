  md: 'CHAPTER 9 • MANAGING FILES


    235


    # Viewing Compressed Files


    The GNOME File Manager is configured to work with two types of compressed files:


    +   * gzip (gz) files These compressed files are created with the gzip utility,
    a mainstay on UNIX and Linux systems. Files compressed with gzip are often stored
    in archives (a single file that contains two or more files) by using the tar.gz
    extension).

    * WinZip (zip) files These compressed files are popular in the Windows world.
    A zipped file may contain one compressed file or an archive containing two or
    more compressed files.


    If you double-click a compressed file within File Manager, you’ll see what appears
    to be a subdirectory, showing you the contents of the file. You can then double-click
    a file icon to view the contents of the file. Note that File Manager hasn’t actually
    decompressed the file; the “subdirectory” that you’re viewing is part of File
    Manager’s virtual file system (VFS) capabilities, which enable the program to
    present certain types of data as if they were seamless extensions of the Linux
    file system.


    To extract the files from a zip or tar archive and store the files in a subdirectory
    beneath the current directory, right-click the file’s icon and choose Extract
    from the popup menu. If you would like to work with a tar.gz archive, turn to
    Chapter 12 and read the section titled, “Working with Compressed Files and Archives.”


