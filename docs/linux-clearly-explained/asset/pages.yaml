- img_proc: true
  md: '# Understanding GNOME Customization


    > CAUTION Please remember that you should not use GNOME as the root user. Customize
    GNOME''s appearance within your user account.


    As you''ve already learned, GNOME enables you to work with more than one window
    manager. By default, your Red Hat 6.0 installation enables you to work with either
    of two GNOME-compatible window managers, Window Maker or Enlightenment (the default).
    Both of these offer features that duplicate GNOME desktop configuration options,
    such as the ability to choose a background graphic. Although the ability to define
    such options in two different ways reflects the Unix philosophy of giving users
    a choice, it can also prove confusing to new users.


    Here''s a simple solution: If a customization option is available in both the
    window manager and GNOME, define it within GNOME. GNOME works best when the window
    manager is restricted to a limited set of functions (such as defining the appearance
    of window borders).


    To customize GNOME, you can do the following:


    +   Customize the GNOME Environment using the GNOME Control Center. You can choose
    backgrounds, enable a screen saver, choose a theme, select a window manager, choose
    a default text editor, specify MIME types, specify the sound of the keyboard bell,
    assign sounds to system events, and choose options for your mouse and keyboard.'
