- img_proc: true
  md: '# CHAPTER 8 • EXPLORING GNOME


    If you find the default focus behavior annoying, Enlightenment enables you to
    reconfigure it that it more closely approximates the way Microsoft Windows and
    Mac OS work. To change the default focus behavior, click the Main Menu icon in
    GNOME, point to Settings, and choose Window Manager. Run Configuration for Enlightenment,
    and select Behavior from the last. All new windows that appear get the keyboard
    focus, All new pop-up windows get the keyboard focus, and Send the pointer to
    windows when switching focus with the keyboard.


    # Using the Keyboard


    Because the X Window System is designed for use on a wide variety of computer
    systems, X uses abstract names for certain keys that have different names on different
    keyboards. One such name is meta. On PC keyboards, meta (abbreviated M) corresponds
    to the Alt key. If you see a keyboard command as Meta + F, it means the same thing
    as Alt + F (hold down the Alt key and press F).


    # Using a Mouse


    In the X Window System world, mice have three buttons. X applications frequently
    use the third button to implement certain procedures, such as pasting text and
    graphics from the clipboard. However, most PCs are equipped with mice that have
    only two buttons. If you selected three-button emulation when you installed Red
