  md: '# SCSI Configuration


    If your system is equipped with a SCSI adapter, and the automatic probing software
    failed to detect it, you''ll see a dialog box asking whether you have any SCSI
    devices. If so, choose Yes, and do the following:


    +   In the Load module dialog box, choose the device’s name from the list, and
    select OK.


    > TIP If you''re installing a Zip Zoom SCSI adapter for an internal lomega Zip
    drive, choose Adaptec 152x.


    +   In the Module options dialog box, select Autoprobe, and choose OK. The installation
    software will probe your card to determine its settings. If the probe is successful,
    you''ll see a dialog box asking whether you have additional SCSI cards. Click
    No to proceed, or click Yes if you have an additional card, and repeat Steps 1
    and 2.


    > TIP If the autoprobe fails to detect your card, you may have changed the IRQ
    and input/output (IO) settings from the default. In order to configure the card,
    you''ll need to specify module parameters. To do so, go back to Step 1, choose
    your device''s name, and click OK. In Step 2, choose Specify options, and select
    OK. In the Module Parameters dialog box, type the name of the module, followed
    by an equal sign, the I/O address, a comma, and the card''s current IRQ setting,
    a comma, and the card''s current SCSI address. For example, the following sets
    up the aha152x driver to work with an adapter at I/O 0x340, IRQ 12, and SCSI address
    5: aha152x=0x340,12,5.'
