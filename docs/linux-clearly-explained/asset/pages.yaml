    as the ability to drag icons onto the desktop, an integrated file manager, a unified
    help system for applications, and utilities such as clocks, calendars, and calculators.


    Once you''ve understood the deficiencies of X, you''ll grasp the significance
    of GNOME, the new desktop environment that''s included with Red Hat Linux 6.0.
    GNOME is perhaps as-significant as Linux itself, in that—like Linux—it provides
