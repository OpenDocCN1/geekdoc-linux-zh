  md: 'Unix that has been developed for a wide variety of computing platforms (including
    PCs with Intel processors).


    > **NOTE** In this chapter, I use the term "Unix”—with an initial capital letter
    and lowercase letters following—to refer to the family of operating systems that
    derive directly or indirectly from the code originally developed at AT&T Bell
    Laboratories, including Unix clones (such as Linux) that mimic Unix but do not
    incorporate any of the code developing from AT&T''s versions of Unix or code subsequently
    developed by companies that held the rights to AT&T''s code. When I use the term
    "UNIX”—all capital letters—I am referring only to the copyrighted code that derives
    directly from the AT&T code. The rights to UNIX are currently held by X/Open,
    Inc.


    # Introducing Operating Systems


    An operating system (Tanenbaum 1987) is a type of computer software that is loaded
    automatically at the beginning of an operating session. In today''s computers,
    operating systems are devoted to the following essential tasks:


    +   * Handling input and output operations from peripherals, such as hard disks,
    printers, and modems, so that these operations do not conflict with each other
    or interfere with the execution of programs.

    * Managing the computer''s memory so that two or more programs can use memory
    without interfering with each other.

    * Managing processor usage so that each application is given a turn in an efficient
    way.

    * Interacting with the user (by means of a user interface) so that the user can
    initiate operations and deal with errors.


    In the beginning of the computer era, operating systems did not exist. A computer
    was programmed to process data in a'
  merge: -1
  pgno: 34
- img_proc: true
  md: '# CHAPTER 1 • THE UNIX HERITAGE 5


    rigid, four-step operation: input, storage, processing, and output. Called batch
    processing, this technique is extremely inefficient because the processing unit
    is idle most of the time.


    In the 1960s, IBM began work on a massive new operating system, System/360, that
    would run on all of its new computers. To make more efficient use of the processor,
    System/360 introduced a number of innovations, including multiprogramming and
    time-sharing. In multiprogramming (also multitasking), the operating system allows
    two or more applications to take turns gaining access to the processor. In time-sharing,
    two or more users can operate the computer independently, and each of them is
    given the illusion of having sole control of the computer.


    In collaboration with General Electric and Massachusetts Institute of Technology
    (MIT), AT&T''s Bell Labs also initiated work on an equally massive operating system,
    called Multics, that could support hundreds of simultaneous time-sharing users.
    However, the Multics project ran into difficulties, and by the late 1960s it had
    become apparent that the “bigger is better” philosophy of operating system development
    posed enormous risks. IBM eventually delivered System/360, but only after encountering
    massive cost overruns and lengthy delays.


    # A Brief History of Unix


    Unix developed in the aftermath of the Multics fiasco (Ceruzzi 1998, Salus 1994).
    If bigger wasn’t necessarily better, there was another way: “Small is beautiful,”
    a saying popularized by ecologist E.F. Shumaker in a widely read 1960s best-seller
    by the same name.'
  merge: -1
