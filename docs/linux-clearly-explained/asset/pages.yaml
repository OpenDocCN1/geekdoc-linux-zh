  md: '# Renaming Files and Directories


    You can use two techniques to rename files or directories. The first technique,
    familiar to Mac OS and Windows users, enables you to edit the file name directory,
    but this technique works only in the Icons view. In other views, as well as Icons
    view, you can use the second technique, which requires you to display and edit
    the Properties box for the file or directory that you''re renaming.


    To rename a file or directory in the Icons view, do the following:


    +   1. Select the file or directory that you want to rename.


    +   2. Slowly double-click the file or directory''s name. If you double-click
    too fast, you''ll launch the file or open the directory. When you''ve performed
    the slow double-click successfully, File Manager will select the text of the name.


    Note that this renaming technique works only in Icons view and only within the
    Directory window.


    +   3. Edit the file name.


    > CAUTION If the file has an extension (such as .pdf), do not change it. Otherwise,
    File Manager may not be able to determine which application created the file.


    +   4. Important: When you are finished editing the file name, press Enter to
    confirm.


    You can also rename a file by right-clicking the file and displaying the file''s
    Properties dialog box (see Figure 9.7). Edit the text in the File Name box, and
    click OK. This technique'
  merge: -1
  pgno: 259
- img_proc: true
  md: 'works in the Brief, Detailed, and Custom views as well as the Icons view.


    # Creating Directories


    To create a directory, follow these steps:


    +   - In the Tree View, select the directory within which you would like to create
    a new directory.


    +   - Click File on the menu bar, point to New, and choose Directory. You''ll
    see the Create a New Directory dialog box.


    +   - Type a name for the new directory, and click OK.


    ![](img/21d32b84086223524c8766042726779d_260_0.png)


    Figure 9.7 You can also rename a file by editing the file''s Properties.'
