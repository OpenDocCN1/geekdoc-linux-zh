- img_proc: true
  md: '# Troubleshooting Your Connection


    If the modem dials the number, but the connection hangs up soon afterwards, start
    netcfg and check the following:


    +   - Did you enter the telephone number correctly?

    - Did you type your username (login name) and password correctly?

    - Did you place the expect/send statements in the correct order?

    - Do the expect/send statements match the text that is actually transmitted by
    the server?

    - Did you enter the correct modem initialization string?


    If the modem dials the number and seems to connect, but you can''t ping to work,
    try the following:


    +   - In netcfg, click Names and check the DNS (nameserver) entries. They should
    consist of four numbers, separated by dots (but no spaces). Did you type them
    correctly?

    - Does your ISP require a command in order to activate PPP? If so, make sure to
    append a line to the expect/send pairs. (In netcfg, select your PPP connection,
    click Edit, and click the Communication tab.)


    If all else fails, try inserting a blank expect/send pair at the beginning of
    the expect/send list; sometimes, this produces enough of a delay to eliminate
    the risk of dropped characters.


    Remember that most connection problems are caused by typos that you just didn''t
    see when you proofread your work. One letter or number out of place—in your password,
    for example, or in the expected text entry—and your connection won''t work.'
  merge: -1
  pgno: 396
- img_proc: true
  md: '# Using Other Connection Methods


    Telephone and cable companies are increasingly making high-speed connections available
    to home and SOHO (small office/home office) users. These services include ISDN
    (digital telephone service, offering Internet connectivity with speeds up to 128
    Kbps, a variety of Digital Subscriber Line services (including ADSL, with Internet
    connectivity at speeds up to 1.5 Mbps), and cable modems (with varying speeds,
    averaging roughly 256 Kbps).


    If you''d like to connect your Linux system to one of these services, it''s possible,
    and sometimes it''s even easy. That''s because ADSL and cable modem services work
    with Ethernet cards, and you hook up to the service using a standard Ethernet
    cable. Since Linux is designed to work with Ethernet networks from the get-go,
    there''s no reason (in principle) that you can''t connect a Linux box to these
    advanced, high-speed services.


    As usual, the devil is in the details. Many of these high-speed services insist
    on providing a certain Ethernet card, and most of them are plug-and-play cards—which
    means that the Linux installation software probably won''t recognize the card.
    To get these cards to work, you need to restart your computer in DOS or Windows,
    and use the utilities disk provided with the adapter to disable the plug-and-play
    mode.


    Another problem: These services are not nearly as well standardized as PPP; it''s
    one thing to hook up Linux to an Adelphia cable modem, and quite another to do
    the same with the RoadRunner service.


    Although a full discussion of connecting to these services is beyond the scope
    of this book, the following sections provide'
  merge: -1
  pgno: 397
- img_proc: true
  md: 'an overview of what''s required. As long as you''re willing to read some online
    documentation (and scan the newsgroups for specific tips), you should be able
    to get most of these connections working without too much difficulty.


    # Connecting with ISDN


    Short for Integrated Services Digital Network, ISDN is more popular in Europe
    and Japan than the United States, thanks to an earlier start (U.S. vendors couldn''t
    agree on an ISDN standard until quite recently). As a result, the ISDN market
    had only begun to develop when it encountered stiff competition from much faster
    services, including ADSL and cable modems. If you''re looking at ISDN, be aware
    that you might be able to get much faster connection speeds by skipping ISDN in
    favor of a Digital Subscriber Line connection or a cable modem.


    ISDN can handle voice and data, and makes use of existing telephone wires. Most
    vendors offer two service levels: a single 56 or 64 Kbps voice/data line, or two
    56 or 64 Kbps voice/data lines, for a maximum bandwidth of 128 Kbps. For the two
    options, the two-line service is the best, and not because it''s faster: The equipment
    can automatically detect an incoming or outgoing telephone call, and makes one
    available seamlessly. If you''re connecting to the Internet at 128 Kbps, you can
    still make and receive phone calls, and the only thing you''ll notice is that
    your connection speed drops some-what.


    For Linux Systems, the ISDN adapter of choice is one made by SpellCaster (http://www.spellcast.com/products.html),
    a leader in Linux support. However, you can get Linux to work with just any "ISDN
    modem" (the term is technically a misconception since no digital-analog translation
    takes places). Such adapters are designed to work just like analog modems, and
    you should be able to install and configure one by following'
  merge: -1
  pgno: 398
- img_proc: true
  md: '# Connecting with PPP


    the instructions in this chapter. You''ll run into a challenge getting the two-channel
    (112 or 128 Kbps) ISDN connection to work; to make use of both channels, you must
    configure PPP to run in the multilink mode (see PhoneBoy 1998 for instructions).


    # Connecting with ADSL


    Short for Asymmetric Digital Subscriber Line, ADSL is one of a grab-bag of technologies
    grouped under the Digital Subscriber Line (DSL, or xDSL) rubric. Using ordinary
    telephone lines, ADSL can deliver Internet data at speeds of up to 1 Mbps; uploads
    are slower, which is why this service is called “asymmetric.” ADSL isn''t widely
    available because ADSL signals don''t travel more than a couple of miles from
    the local switching station, so the service is available mainly in upscale urban
    markets.


    A problem with ADSL is lack of standardization, so the vendor will provide you
    with the equipment you need to connect to the service. This will probably include
    an Ethernet card, which you may have trouble getting Linux to recognize. Once
    you solve that problem, configuring Linux to work with ADSL is much hooking up
    your system to a local area network. One difficulty you''ll encounter is that
    most of these services require that you configure your computer to work with DHCP;
    fortunately, it''s easy to configure Linux for this service (see Vuksan 1998a).


    # Connecting with a Cable Modem


    Like ADSL, most Internet cable services require you to use an Ethernet card; the
    challenges you''ll face are very much like hooking up to ADSL (getting Linux to
    recognize your Ethernet card and configuring Linux to work with DHCP). For an
    excellent overview of cable modems for Linux systems, see'
  merge: -1
  pgno: 399
- img_proc: true
  md: 'Vuksan 1998b. Some especially enlightened providers are tar-getting Linux users;
    Adelphia offers a comprehensive HOWTO (see Sigler 1998) as well as an installation
    script.


    # From Here


    At this point, you''ve got a super Linux system for the desktop. You''ve got sound,
    a graphical user interface, and an Internet connection. In the next chapter, you''ll
    learn how to configure your Internet applications so that you can make the most
    out of your Internet connection.


