    # # Linking Files


    As you''ve learned, Linux files have names—but not the thing as the file. In fact,
    Linux files have their own “real” names, which are internally encoded. As a result,
    it''s quite possible to have two different names that refer to exactly the same
    file—or, in Linux terminology, a hard link. In addition, you can create symbolic
    links, which are like the aliases used in MS-DOS, Windows, or Mac OS: they refer
    to another file. In this section, you''ll learn how to create and symbolic links,
    and you''ll learn why you may want to do so.


    # # Creating a Hard Link


    As just explained, a hard link enables you to define more than one name for a
    file. Note that this isn''t the same as making a copy of the file; there''s no
    copy made. Rather, your system has more than one name for a single file.


    Why would you want to create more than one name for a file? The reason lies in
    Linux''s heritage as a multi-user operating system. Suppose two users, Michael
    and Julia, are collaborating on a document called proposal.txt. The original copy
    of'
  merge: -1
  pgno: 458
- img_proc: true
  md: '# CHAPTER 15 • USING THE SHELL AND FILE UTILITIES 429


    the document is kept in /home/michael. Since Julia doesn’t want to bother with
    typing all that lengthy path information when she opens /home/michael/proposal.txt,
    she creates a hard link to proposal.txt and calls it big-horrible-job.txt, and
    places big-horrible-job.txt in her home directory (/home/julia). Now she can open
    the document as if it were a file in her home directory—but it’s exactly the same
    file that’s stored in Michael’s home directory. Note that any changes made to
    either “copy” of the file are reflected in “both files”—and that there’s really
    only one file.


    > TIP When you create more than one name for a file, you must delete all the names
    if you wish to remove the file from your system. Suppose Michael deletes proposal.txt
    in his directory. That’s the “original” file. But big-horrible-job.txt still remains
    in Julia’s directory. The file still exists.


    To create a hard link, you use the ln command, followed by the name of the existing
    file and the name of the new file. In the following example, the command creates
    a new file (bhorrible-job.txt) that’s a hard link to /home/michael/proposal.txt:


    ```

    ln /home/michael/proposal.txt big-horrible-job.txt

    ```


    After you create the hard link, the file shows up in the current directory (the
    one that was open when you gave the command) as if it were a “normal” file.


    > TIP If you want to make sure you don’t erase an incredibly valuable file (such
    as your Ph.D. dissertation), put a bunch of hard links to the file in various
    directories. The file isn’t really deleted unless somebody erases all the links.'
  merge: -1
  pgno: 459
- img_proc: true
  md: 'Note that hard links are subject to the following limitations:


    +   - You can''t create hard links to directory names.

    - Hard links can''t cross partitions. If you set up your hard drive as Chapters
    4 and 5 recommend, for example, you can''t make a hard link from your home directory
    (in the /home partition) to a file in the /usr partition.

    - Hard links won''t work on a network file.


    # Creating Symbolic Links


    Hard links are useful indeed, but their limitations mean that many times you can''t
    create them. For this reason, Linux enables you to create symbolic links, which
    are nothing but pointers to a file that exists elsewhere.


    Symbolic links have some of the advantages of hard links; for example, you can
    place a symbolic link in your directory, and use it to refer to a file elsewhere
    on the system or network. In doing so, you save yourself the trouble of typing
    a lengthy path name.


    However, symbolic links don''t have the key advantages of hard links. For example,
    suppose the original file gets deleted. The symbolic link''s existence doesn''t
    prevent the deletion, even though it doesn''t point to anything anymore. If you
    try to use a link that points to a deleted file, you''ll get an error message,
    which might not be very informative.


    To create a symbolic link, use the ln command with the -s option, followed by
    the name of the existing file and the name of the new symbolic link:'
