  md: '# 10


    # # Personalizing GNOME


    Windows and Mac OS users enjoy personalizing their systems. They choose a default
    desktop font, paint their displays with a cool background graphic, and assign
    sounds to system events, such as the Star Trek door sound when they open or close
    a window. Customization options such as these aren''t all fun and games, of course.
    Anyone with impaired vision will appreciate being able to enlarge the default
    desktop font, for example. Thanks to GNOME, desktop customization is now available
    for Linux users. This chapter shows you how to customize the GNOME environment.'
