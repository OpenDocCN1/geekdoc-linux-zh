  md: '# Running Applications with GNOME


    By now, you''ve got Linux and GNOME running to your tastes, and it''s time to
    get down to business: running applications. This chapter introduces the wealth
    of software that''s available for personal information management (PIM) and productivity
    purposes; Chapter 14 discusses Internet software for your Linux system.


    Thanks to GNOME''s well-conceived design, you''re not restricted to running GNOME
    applications. You can run any of the many applications developed for the KDE desktop
    environment. You can also run any program designed to work with the X Window System.
    As you''ll learn in this chapter,'
  merge: -1
  pgno: 335
- img_proc: true
  md: 'there is indeed a wealth of software available for your Linux system, and much
    more is on the way.


    This chapter begins by examining some of the GNOME desktop utilities and applications,
    and continues by examining the much broader slate of KDE software offerings. You''ll
    also learn how to run X Window System applications under GNOME.


    # Where''s GNOME Headed?


    As this has stressed, it''s important to understand that GNOME is a work in progress,
    and the progress is very rapid indeed. Still, at present, some major pieces are
    missing from the GNOME pie, including GNOME printer support, interprocess communication,
    modular software resources, and vector graphics support. By the time you read
    this book, some of these missing pieces may well be in place, so you may wish
    to check the GNOME site to see whether you can obtain more recent versions of
    the GNOME applications (and the GNOME desktop itself). You''ll find the GNOME
    home page at www.gnome.org.


    # Introducing the GNOME Desktop Accessories


    GNOME comes with a number of desktop accessories that can help you get organized,
    including a calendar, address book, time tracker, and calculator. As you''ll quickly
    discover, these aren''t throwaway utilities, but full-featured programs that measure
    up well against the commercial competition. At this writing, however, missing
    are some important features, the least of which is printing; GNOME printing support
    wasn''t completed at this writing.


    The GNOME Calendar is a full-featured time management program (see Figure 11.1).
    You can view your schedule in'
  merge: -1
  pgno: 336
- img_proc: true
  md: '# CHAPTER 11 • RUNNING APPLICATIONS WITH GNOME 307


    daily, weekly, monthly, and annual views. What’s more, you can create recurrent
    appointments, set alarms, and even send yourself automatic e-mail reminders. Because
    Calendar’s format conforms to the vCalendar standard, the information you create
    and save with GNOME Calendar can be used by any other vCalendar application, including
    intranet scheduling managers that enable team members to share schedules on a
    network.


    # GNOME Time Tracker


    The GNOME Time Tracker (GTT, shown in Figure 11.2) enables you to define projects,
    and then to measure the time you spend on one of them. You can use GTT’s capabilities
    to track the time you spend on tasks compensated by the time you spend, but there
    are other uses. If you’d really like to find


