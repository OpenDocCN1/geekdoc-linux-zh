  md: '# Managing Files


    The GNOME File Manager is the centerpiece of the GNOME desktop, and rightly so.
    Finally, Linux users can manage files without learning lengthy, convoluted commands.
    File Manager is a drag-and-drop capable program that presents a simple, familiar
    interface. Also called GNOME Midnight Commander (GMC), File Manager is a GNOME
    version of the respected Midnight Commander, a text-mode file management utility
    (see Chapter 16).


    File Manager’s apparent simplicity belies a powerhouse of technical innovation.
    File Manager transforms the wilderness of Linux files into terrain that’s both
    manageable and understandable. For example, thanks to an impressive technical'
  merge: -1
