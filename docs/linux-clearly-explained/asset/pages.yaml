    12), avoid copying or moving any files to your home directory. If you do, you
    will find that you may not be able to write or execute these files after you logout
    and login using your account! If you''ve messed up the permissions of files within
    your home directory, log in as root user and use the Properties dialog box to
    change the file ownership back to your user account.'
