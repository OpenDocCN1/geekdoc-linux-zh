  md: 'PART TWO • INSTALLING RED LINUX


    unpartitioned space on your hard drive, or a second hard drive from which you''ve
    deleted all the partitions. For more information, see “Preparing Your System for
    a Two-OS Installation,” in Chapter 4.


    +   - If you''re creating an all-Linux system, you can use the Red Hat installation
    software to delete the existing DOS partition on your hard disk.


    # Deciding How to Boot Your System


    In order to install Red Hat Linux, you must boot your system with the CD-ROM packaged
    with this book, or a floppy disk on which a minimal version of Linux has been
    installed.


    # Configuring Your PC to Boot from a CD-ROM


    If your PC is fairly new (two years old or less), you may be able to configure
    your system to boot from a CD-ROM. To find out, restart your system, and press
    the key (usually Delete) that enables you to change your computer''s BIOS settings.
    Page through the setting options until you find one that enables you to specify
    the boot disk order. (By default, most systems are set up to boot from the A drive,
    and the C drive.) If you can change this setting so that the first boot drive
    is a CD-ROM, you can install Linux directly from the CDROM packaged with this
    book. Change the setting so that your computer will boot first from a CD-ROM.


    If your computer can''t boot from a CD-ROM, then you need to make a boot disk.
    You learn how in the next section.


    # Creating a Boot Disk


    This section is for users whose systems can''t boot directly from a CD-ROM. You''ll
    need to create a boot disk, as explained in this section. To do so, you use the
    rawwrite.exe program, which'
  merge: -1
  pgno: 146
- img_proc: true
  md: 'you''ll find in the \dosutils directory. You use this program to transfer a
    file called boot.img (stored in the \images directory) to the floppy disk. This
    file transforms the floppy into a Linux boot disk.


    To create the Linux boot disk:


    +   1. Format a 3.5 inch diskette.

    2. Insert the diskette in your computer’s floppy disk (drive A).

    3. Insert this book’s CD-ROM into your CD-ROM drive.

    4. Use Windows Explorer to view the contents of the CD-ROM disk.

    5. Display the \dosutils directory.

    6. Locate and double-click write.exe. You’ll see an MS-DOS application window.
    The program asks you to specify the name of the image file you want to copy.

    7. Type ..\images\boot.img and press Enter. (Don’t forget the two initial periods.)

    8. To identify the destination of the file, type a: and press Enter.


    The rewrite program transfers the boot image file to the floppy disk in drive
    A.'
