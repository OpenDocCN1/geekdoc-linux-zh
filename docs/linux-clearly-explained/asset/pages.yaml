  md: 'CHAPTER 13 • CONNECTING WITH PPP 365


    # Determining Whether Your Connection Is Working


    It''s an eerie sensation to log on for the first time—you can''t tell whether
    you''ve succeeded in making the connection, because absolutely nothing happens.
    To determine whether you''re connected, open xterm window. At the Linux prompt,
    type ping followed by the Internet address of one of your ISP''s nameservers (for
    example, you could type ping 206.205.42.254). Press Enter. If you''re on the Internet,
    you''ll see responses from the computer you''ve contacted, indicating that packets
    have been received. If the transmission fails, something''s wrong (see “Troubleshooting
    Your Connection,” below).


    Assuming all''s well with your connection, open Netscape Communicator by clicking
    the big green Netscape icon on your Panel. You''ll see a Red Hat welcome page
    that''s actually stored on your computer. To access the Internet, click Home,
    which takes you to Netscape''s home page. You''re on the Internet!


    # Activating and Deactivating Connections


    Thanks to GNOME, the task of activating and deactivating your connection is quite
    easy; just install the PPP Dialer. To do so, click the Main Menu button, point
    to Panel, point to Add Applet, point to Network, and choose PPP Dialer. You''ll
    see the PPP dialer applet on the Panel.


    To initiate your connection, just click the Start button (the right-facing triangular
    arrow) on the PPP Dialer applet.


    To hang up, click the Stop button (the square one).'
