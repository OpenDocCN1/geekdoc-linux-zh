  md: '# Logging Out and Logging In


    To log out of an account and log in as a different user, type logout and press
    Enter. You''ll see the login prompt. Type your user login name, and press Enter.
    When you see the Password prompt, type your password, and press Enter. Try logging
    in to your user account.


    Note that the prompt looks slightly different:


    ```

    [suzanne@localhost suanne]$

    ```


    When you''re logged in with a user account, you see your user-name instead of
    root (i.e., suanne@localhost), and the default directory is your home directory.
    In addition, the prompt changes from a pound sign (#) to a dollar sign ($).


    > TIP Always run application programs from your user account, never run them as
    root. When you run application programs, you will create data files as well as
    program configuration files. These are saved by default to your home directory,
    which is within the /home partition that you created when you installed Linux.
    Should you upgrade Linux to a new version, this directory will not be affected
    by the reinstallation process. In, the root directory will be overwritten, and
    you''ll lose any configuration or data files that are stored within the root directory.


    # Switching to Superuser Status


    When you''re logged in with your user account, you can''t do the following:


    +   * Shut down the system

    * Modify system configuration files'
