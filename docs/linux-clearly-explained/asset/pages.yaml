  md: '# 14


    # # Using Internet Applications


    Now that you’ve connected to the Internet (as explained in Chapter 13), you’re
    ready to use Internet applications, such as Netscape Communicator. Chances are
    you’ve already browsed the Web with Netscape. As you’ll quickly learn, though,
    you’ll need to do some configuration in order to get Netscape to work the way
    you expect—that is, as well as a browser works on a Windows or Macintosh system.
    For example, Netscape isn’t set up to display multimedia, such as movies and videos.
    In addition, you’ll need to configure Netscape to access your e-mail.


    This chapter introduces the Internet applications that are available on your system.
    It also shows you how to configure'
  merge: -1
  pgno: 403
- img_proc: true
  md: 'these applications, if necessary. The chapter doesn''t attempt to teach you
    all the fundamentals of Internet use; if you''re not familiar with the essentials
    of Web browsing, e-mail, and other Internet services, you should read a good general
    introduction to the Internet before proceeding with this chapter.


    > TIP If you''re new to Netscape Communicator, check out Netscape Communicator
    (AP Professional), which covers the nearly identical Windows version.


    Here’s what you’ll find in this chapter:


    +   - Configuring Helper Applications Learn how to set up your system''s default
    Web browser, Netscape Communicator, so that it can work with animations, movies
    and sounds.


    +   - Configuring Netscape Communicator for E-Mail Access Set up your Communicator
    package to access your e-mail account.


    +   - Configuring Netscape Communicator for Newsgroup Access Set up your Communicator
    package to access Usenet newsgroups.


    +   - Accessing FTP Sites with File Manager Create virtual file systems for frequently
    accessed FTP sites; you’ll love this feature.


    +   - Exploring Additional Internet Applications Introduced are gFTP (a GNOME-compatible
    FTP client), GNOME-icu (an ICQ “buddy list” program), and X-Chat, the nifty GNOME
    application for accessing Internet Relay Chat (IRC).'
  merge: -1
  pgno: 404
- img_proc: true
  md: '# # Configuring Netscape Helper Applications


    Netscape Communicator is a full-featured suite of Internet applications that includes
    a browser (Netscape Navigator), email- and newsgroups (Netscape Messenger), and
    Composer, a program that enables you to create Web pages. This section doesn’t
    attempt to teach you how to use Netscape Communicator—that’s a subject for a book
    in itself. Instead, it focuses on configuring the program for Internet use. In
    this section, you learn how to configure helper applications, navigator needs
    in order to display certain types of data.


    # ## Understanding Which Applications Navigator Needs


    Netscape Navigator needs help to display data types that it doesn’t recognize
    internally. If you configure the program as recommended in this section, Navigator
    will automatically start the correct helper application when you encounter the
    specified type of data (such as sound or a video). Table 14.1 lists the data types
    that you may encounter on the Internet, as well as the applications I recommend
    you associate with these data types. For each application, you’ll find the recommended
    startup command (the command that starts the application). This includes the command
    needed to start the application (such as esdplay) by recommended options, if any,
    and %s (a variable that automatically inserts the URL of the remote file you are
    accessing).


    Table 14.1 Data types and recommended application settings


    | Data Type | Application | Startup Command |

    | --- | --- | --- |

    | AIFF Audio | Esound | esdplay %s |

    | IEF Image | Electric Eyes | ee %s |

    | MPEG Audio | Electric Eyes | mpg123 -b 4096 %s |'
  merge: -1
