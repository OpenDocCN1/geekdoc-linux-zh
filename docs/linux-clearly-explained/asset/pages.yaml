  md: '# Adding Drive Mount Buttons to Panels


    GNOME automatically detects mountable disk drives, including floppy drives and
    CD-ROM drives, and creates folders for these drives on your desktop.


    > TIP If you don’t see the drive folders, your system may not be configured to
    enable users to access drives. To fix this problem, see Chapter 7.


    As explained in Chapter 9, you can open, mount, and unmount disk drives by right-clicking
    the drive icons on the desktop. However, you may wish to add drive mount buttons
    to your Panel. Once you’ve done so, you’ll be able to mount and unmount drives
    without having to display the desktop, which might not be visible if you’ve opened
    application windows.


    Begin by adding a floppy drive mount button, which is the default disk drive icon.
    Continue by adding icons for additional drives, such as Zip drives and CD-ROM
    drives. As you’ll see, these icons look like floppy disk icons by default, but
    you can change the icon (and the drive assigned to the icon) by changing the icon’s
    properties. Let’s get started with a floppy disk icon.


    To add a floppy disk mount button to the Panel, follow these steps:


    +   - Click the Main Menu button, point to Panel, point to Add applet, point to
    Utility, and choose Drive Mount.


    You’ll see the floppy disk mount button on the Panel.'
