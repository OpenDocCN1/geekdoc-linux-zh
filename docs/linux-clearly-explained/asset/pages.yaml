    # Linux vs Windows 95/98/NT


    As thousands of computer users are discovering, Linux is more stable than any
    version of Windows. The reasons are attributable to severe deficiencies in Windows’
    technical design. For example, Windows enables programmers to use DLLs (Dynamic
    Link Libraries) to store program code that is used by two or more applications.
    However, Windows does not track to and control the DLLs. If you install a program
    that overwrites an existing DLL with a new version, you may inadvertently destabilize
    your system. Linux also uses DLLs (in Linux, they''re called shared libraries),
    but the operating system automatically tracks them by version number, and links
    them to the applications that need them. Another example: Windows permits some
    programs to use the computer’s memory in a way that can interfere with other running
    programs, and even the operating system itself. In Linux, such interference is
    impossible; every program runs in its own, rigorously separated memory space.


