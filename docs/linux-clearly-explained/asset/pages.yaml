    # The TCP/IP Factor


    At Berkeley, Unix joined paths with another phenomenon of the computing industry:
    the Internet protocols, called TCP/IP. Developed under funding from the U.S. Advanced
    Research Projects Agency (ARPA), TCP/IP enables computers of differing makes or
    models to network efficiently over a wide variety of transmission media. Inherently
    a multipatform networking technology, TCP/IP would seem to have a natural affinity
    to Unix—and at Berkeley, the two crossed paths, thanks to an ARPA grant in support
    of BSD development. Version 4.2 BSD included TCP/IP support for this first time,
    and its widespread acceptance at colleges and universities launched the Internet
    on its spectacular upward trajectory.


    # UNIX Goes Commercial


    With Unix installations proliferating like wildfire, AT&T’s management soon realized
    that its research had created technology that could prove lucrative if the U.S.
    government freed AT&T from entering the computer and software markets. The company
    awarded the rights to UNIX to the Unix Systems Laboratories (USL), which—unlike
    AT&T—was free to pursue commercial development. USL developed Unix System V, a
    commercial product that could cost a corporate buyer up to $100,000 in software
    licensing fees (Martin 1993).


    For more than a decade, USL tolerated the Berkeley Software Distribution, presumably
    because the distribution seemed to pose no threat to USL’s lucrative corporate
    sales. However, when Berkeley faculty formed a startup firm called Berkeley Software
    Design, Inc. (BSDI), and proposed to market the BSD distribution, USL filed suit.
    But AT&T sold the'
