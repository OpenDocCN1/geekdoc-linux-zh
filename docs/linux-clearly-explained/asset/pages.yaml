    # Exploring Advanced Shell Capabilities


    Although this chapter covered the essentials of shell usage, this has barely scratched
    the surface of the subject. This section briefly introduces some advanced aspects
    of shell usage, focusing on the ones that may come into play when you are installing
    and configuring applications. When you obtain a new application for your Linux
    system, you will also obtain documentation that tells you what to type in order
    to install your new software. You can simply type these commands without knowing
    what they''re doing; if you''d prefer to understand what''s going on, read this
    section for a short introduction to the essential concepts.


    # Grouping Commands


    The bash shell enables users to type more than one command on a single line. To
    type more than one command, you separate the commands with semicolons; the shell
    executes them sequentially, going from left to right. Here''s an example:


    ```

    #mkdir backup; cp /home/mike/* backup

    ```


    This command creates a directory called backup, and copies all the files in /home/mike
    to the new directory.


    # Using Pipes


    In a pipe, the output of one command becomes the input for another. In the following
    (very useful) example, the output of'
  merge: -1
