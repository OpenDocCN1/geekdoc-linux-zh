- img_proc: true
  md: '# The Little-Used Machine in a Corner


    After Bell Labs pulled out of the Multics project, two Multics veterans—Ken Thompson
    and Dennis Ritchie—were hoping to find a computer they could use to play a game
    they had developed, called Space Travel. They found a disused PDP-11 minicomputer
    (a “little-used machine in a corner”), and soon succeeded in powering a miniaturized
    version of Multics to their computer (as well as Space Travel). Because their
    reduced version of the giant operating system could support only one user at a
    time, they called it “Unix,” a pun on Multics.


    As they experimented with the machine, Thompson and Ritchie developed a multi-user
    file system so that they could avoid interfering with each other’s files. Soon,
    the two realized that they had the germ of an effective operating system—founded
    on principles of simplicity and economy—and the Unix philosophy began to take
    shape: keep programs small and simple, and combine programs to do complicated
    tasks.


    To develop the nascent operating system, Thompson and Ritchie needed a better
    computer. However, they knew they could not persuade the Bell Labs to purchase
    such a computer to support operating system development. So they developed a proposal
    to create a text-processing system, and wound up with a brand-new PDP-11 minicomputer.
    This is the reason you’ll find so many text-processing programs included with
    a standard Unix distribution.


    From its beginnings, Unix was developed as a platform for programming as well
    as an operating system. Thompson and Ritchie developed the C programming language,
    so named because it was the successor to the B language, and rewrote much of the
    core of Unix (called the kernel) in C.'
  merge: -1
  pgno: 36
- img_proc: true
  md: 'CHAPTER 1 • THE UNIX HERITAGE


    # # The Unix Philosophy


    Thompson and Ritchie developed not only an operating system and a programming
    language; they also developed a coherent philosophy of software design, and did
    an excellent job of conveying this philosophy to their colleagues in colleges
    and universities.


    As outlined by Mike Gancarz in Unix Philosophy (Digital Press, 1995) and by others,
    the essential tenets of the Unix philosophy can be summarized as follows:


    +   * **Keep programs small; each should accomplish just one task well.** Small
    programs are easy to create, debug, and reuse. You should focus on creating small
    programs that function perfectly; only then should you put them together to do
    more complicated things.


    +   * **Portability is better than efficiency.** You can write operating system
    software in assembly code for maximum efficiency, but assembly language is difficult
    to maintain and cannot be translated to function on new hardware. For this reason,
    it''s best to write code—even operating system code—in high-level programming
    languages, which can be translated easily from one computing platform to another.
    Any losses in efficiency will be compensated by gains in the speed of the next
    generation of computer hardware.


    +   * **Enable programs to transfer data to each other.** Instead of designing
    programs so that they process data and write results to a file, you should enable
    programs to pass data to other programs as a data stream that does not require
    interim storage. In this way several simple programs can be grouped in a series
    to perform complex operations.'
  merge: -1
  pgno: 37
- img_proc: true
  md: '+   Don''t reinvent the wheel. Program code should be openly shared so that
    programmers can gain leverage from each others'' efforts.


    +   Get a prototype running as soon as possible, and use it. The only real testing
    is real-world testing.


    +   Make the operating system as small as possible. This tenet is yet another
    variant on the “small is beautiful” theme. Small operating systems are much more
    likely to be stable. In Unix, the core operating system components are called
    the *kernel*. If complexity is needed, it can be added at a higher level of abstraction.


    +   Permit users to choose their own shell. The *shell*, or user interface, should
    be completely separate from kernel. Users should be able to choose their own shell
    or switch between shells transparently, as needs arise.


    +   Store configuration data in ASCII text. Doing so makes it easy to edit and
    process these files using text-manipulation software.


    +   Use a simple, overarching metaphor. In Unix, the computer is conceptualized
    as a stream of data that can be grouped and understood as a file —and this includes
    peripherals, such as CD-ROM drives, floppy disks, and more. This is one of the
    most confusing things about Unix for first-time users.


    The Unix philosophy can be summarized by the phrase “worse is better.” This phrase
    implies that technology incorporates working compromises is more likely to gain
    market acceptance than technology that tries to excel in all areas.


    The“worse is better” philosophy is admittedly, far from universally admired. At
    universities such as MIT and Stanford, some computer scientists recoil in the
    face of Unix’s willingness to compromise; for example, Unix sacrifices efficiency
    for portability. Here, Thompson and Ritchie’s working'
