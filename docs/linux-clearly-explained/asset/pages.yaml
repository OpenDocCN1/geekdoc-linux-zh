  md: '# CHAPTER 7 SYSTEM CONFIGURATION ESSENTIALS


    ous, here’s a brief overview of the boot process with Red Hat Linux:


    +   * Kernel The first step involves booting the kernel of the Linux operating
    system. The kernel loads the device drivers for all of your peripherals, including
    your hard disk and other disk drives. Device drivers tell the kernel how to operate
    the specific hardware components installed on your system. As each driver is loaded
    and initialized for peripherals such as sound cards, Ethernet cards, and modems,
    you’ll see confirmation messages, and a green-colored “OK” message (assuming,
    that is, everything went well with your installation).

    * init After the device drivers load, a program called init comes into play. Init
    runs a variety of programs and scripts that serve to configure your system. Among
    the programs loaded is getty, which enables (and other users) to open a terminal
    device and interact with the Linux kernel.

    * X Window System Next to load is the X Window System, assuming you followed the
    last chapter’s advice and configured X to start automatically.

    * gdm Last to load is the GNOME Display Manager (GDM), which starts your GNOME
    Session and the Enlightenment window manager.


    Once the boot process has finished, you’ll see the Red Hat logo and a Welcome
    dialog box. The Welcome dialog box indicates your computer’s name, and includes
    text boxes where you supply your login name and password.


