    # Understanding Basic X Concepts


    The Window System distinguishes between servers and clients, but it does so in
    a way that fundamentally differs from the use of these concepts in other areas
    of computing (such as databases and the Internet). If you''ve used the Internet,
    you probably know that you run some sort of client program (such as an e-mail
    program or a Web browser) that knows how to obtain information from a remote server.
    In the X Window'
