  md: '# Unix in the Enterprise


    In spite of these standardization efforts, the various versions or flavors of
    Unix continue to differ, and Unix still has an unviable reputation of being difficult
    to learn and use.


    Unix continues to win adherents in corporate information systems (IS) departments,
    where Unix possesses an excellent reputation for scalability (the capacity to
    cope with a rapid growth in the number of users). To free themselves from expensive
    mainframes, corporations developed Unix-powered client/server networks. In a client/server
    network, powerful computers called servers dish out data and applications to networked
    workstations, where users run programs to tap into the central data repository.
    Because Windows NT is essentially restricted to PCs running Intel hardware, Unix
    will continue to prevail in the high-end server market (Baddock 1995). Windows
    NT also is making inroads, particularly on smaller networks that don’t need Unix’s-industrial-strength
    server capability (Greenfield 1997). As the next chapter explains, Linux is also
    moving into this niche.


    Despite the rapid growth of Windows NT, you shouldn''t write off Unix in the enterprise
    just yet. In 1999, the Unix market will generate an estimated $23 billion in sales,
    as against $12.8 billion for its closest competition, Windows NT. According to
    a recent report, Unix is widening its lead against Windows NT in the server market
    (Patrizio 1998); the Unix share of the server market grew from 36 percent to nearly
    43 percent from 1996 to 1998, and NT’s share grew from nearly 10 percent to 16.2
    percent (half Unix’s rate). Linux will accelerate this trend by bringing Unix
    capabilities to inexpensive Intel-based processors.'
