  md: '# #2


    # # The Linux Phenomenon


    With an estimated 16 million installations at the time of this book’s writing,
    Linux is the fastest-growing operating system in today’s computer marketplace.
    In this chapter, you’ll learn what Linux is, how it developed, and examine its
    strengths and weaknesses. You’ll also learn how to harness the rich Linux support
    resources that you’ll find on the Internet.


    # # What Is Linux?


    Linux (pronounced LIH-nucks) is the *kernel* of a Unix-like operating system that
    is distributed on open source principles. A kernel alone doesn’t make a complete
    operating system. Linux could not have succeeded without the availability of'
  merge: -1
  pgno: 59
- img_proc: true
  md: 'many open source utilities, including support for TCP/IP networking and the
    file utilities created by the GNU project. To give proper credit to GNU, some
    prefer the term GNU/Linux when referring to the complete operating system rather
    than just the kernel.


    Linux is not the only open source Unix kernel. Also available are offshoots of
    the Berkeley Software Distribution (BSD), such as FreeBSD. Although these competing
    systems have have their adherents, Linux has the lion''s share of the market and
    attracts the greatest number of volunteer programmers.


    # Linux Distributions


    To transform the Linux kernel into a complete operating system, you need to supplement
    the kernel with hundreds of system programs and utilities. You also need to prepare
    your system with the proper disk format and directory structure. Because these
    tasks are beyond the expertise level of most potential Linux users, companies
    such as Red Hat, Inc. create Linux distributions. A distribution typically includes
    the latest version of the Linux kernel plus all the additional software and utilities
    needed for a successful installation. Distributions also include installation
    software, which guides the user through installation and configuration tasks.


    In keeping with open source principles, the companies that sell Linux distributions
    make them available for free downloading via the Internet. However, most users
    find it more convenient to purchase a CD-ROM containing the complete distribution.
    This book focuses on the leading Linux distribution, Red Hat Linux 6.0.'
