  md: '# # Afterword


    You’ve installed Red Hat Linux 6.0, learned how to use the GNOME desktop, and
    mastered all the fundamentals of Linux system administration. Congratulations!


    Now it''s time to graduate. As you''ve learned in this book, Linux isn''t just
    an operating system; it''s a powerful, multi-user operating system with advanced
    networking capabilities built right in. If you''re not sure networking is for
    you, consider this:


    +   - Using the knowledge base you already possess, you can set up a network in
    your home that will enable every user to access the Internet by means of a single
    modem.

    - Suppose you''re running a small business. You don''t have the cash to hire a
    pricey system consultant, but you need to set up a computer network that will
    enable your employees to share Web access and exchange e-mail. Surprise! It''s
    all built into Linux, and ready to go.

    - You want to create a small computer network for your home, a school, or a small
    business, but you''ve got just one problem: Some people are using Windows or Mac
    OS, and they don''t want to switch to Linux. Here''s very good news: With Linux
    networking software, you can easily get the Linux, Windows, and Macintosh boxes
    to network effectively.


    This book’s companion volume, Linux Networking Clearly Explained (Academic Press,
    1999), shows you how to accom-'
  merge: -1
  pgno: 529
- img_proc: true
  md: 'plish all of these networking tricks, and many more. With what you''ve already
    learned, you''ll be ready to start making Linux jump through hoops. Got a couple
    of disused 386 or 486 computers at home? Connect them, and try it! You''ll be
    amazed at how easy it is to get going with Linux networking, and Linux Networking
    Clearly Explained provides just the information you need.


    As you''re expanding your knowledge of Linux, don''t forget to keep up with Linux
    and GNOME. There will be new versions of Red Hat Linux, of course, and you''ll
    be wise to upgrade; the new version will sport new features, of course, but it
    may also include bug fixes, including solutions to security problems that weren''t
    known when the current version was released. (For security reasons, it''s always
    a good idea to keep your system software up to date.) Keep your eye on GNOME,
    too (see http://www.gnome.org). Under rapid development, GNOME is acquiring new
    features (and new applications) almost on a daily basis. Without upgrading to
    a new version of Linux, you can download and install the RPM packages for new
    GNOME software, ranging from the core GNOME programs to new and upgraded GNOME
    applications.'
  merge: -1
