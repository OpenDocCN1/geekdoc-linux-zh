  md: '# Ordinary Users and the Superuser (Root User)


    Even if you plan to install Linux on a single-user system, you should understand
    that Linux is a multi-user operating system. To ensure system security and efficient
    administration, Linux creates a distinction between the following:


    +   * Root user (also called superuser) The root user has full access to all of
    the files on the entire system. In order to get root user status, you must log
    on to the Linux system by typing the root user’s password.

    * Users Users automatically see their own section of the filesystem, and cannot
    view or modify portions of the filesystem that the superuser employs in to ensure
    system security. To log on as a user, you type the user’s username and password.


    If you’re the only user of your Linux system, does this distinction matter to
    you? Yes, it does. When you log on as the root user, you can modify system settings—and,
    if you''re not careful, you can do a lot of damage. You should log on to your
    system as the root user only when you need to make changes to the Linux system
    configuration. For ordinary use, you should log on as a user, so you don’t do
    any inadvertent damage.


    # Deciding which Installation Class to Use


    To determine how to divide your disk into Linux partitions, you need to choose
    between three basic types of Linux installations:


    +   * Workstation Class Installation This automatically creates three partitions:
    a 32MB swap partition, a 16MB boot partition, and a root partition that uses all
    of the rest of the available space on the drive. To create a'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'CHAPTER 4 • PREPARING TO INSTALL RED HAT LINUX 103


    workstation-class installation, you need a minimum of 600MB of disk space.


    +   * Server-Class Installation This is the recommended option if you are setting
    up a Linux system to be used as a file or Web server. This installation automatically
    creates three partitions: a 64MB swap partition, a 16MB boot partition, and a
    root partition that uses all of the rest of the available space on the drive.
    The root partition is an extended partition, and it is further subdivided into
    two 512MB partitions (a /usr partition for software and /home partition for individual
    users), (/var) for log files. You''ll need 1.6GB of disk space to create a server-class
    installation.


    +   * Custom Installation This enables you to choose installation options individually.
    Although the installation option is somewhat more complex than the Workstation
    or Server installations, you gain by being able to specify the programs you want
    to run. Chapter 4 walks you through the entire Custom installation process. You''ll
    need between 700MB and 1.6GB of disk space for a custom installation.


    > TIP Do not choose the server-class installation if you are planning to run two
    operating systems on your computer. Use the workstation-class installation instead.
    The workstation installation automatically enables you to choose which operating
    system you want to use at the beginning of an operating session.


    # # Preparing Your System for a Two-OS Installation


    This section should be read only by those who plan create a system that enables
    you to choose between two operating systems (OS), Microsoft Windows and Linux.
    You should attempt such an installation only if you have a very large hard'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'PART TWO • INSTALLING RED HAT LINUX


    drive with a lot of free space, (I recommend at least 2 or 3 GB), or a system
    with two or more physical hard drives installed.


    > TIP Some computers with a single, large hard drive are configured with what
    appears to be two drives, generally called drive C and drive D. If you''ve havent
    made much of drive D, and if it has sufficient free space, you can use drive D
    for Linux.


    # Deciding Whether to Attempt a Two-OS System


    With the software provided with Red Hat Linux, you can configure your system so
    that you can continue to run Microsoft Windows well as Linux. In this way, you
    can work with Microsoft Windows applications where necessary, and use Linux whenever
    you wish. In addition, you can configure your Linux system so that you can mount
    (access) data files within your Windows directories.


    If the notion of running Linux and Windows on the same system, bear in mind that
    choosing this option makes the installation process more difficult and risky.
    The reason lies in the fact that the two operating systems use different file
    storage systems. In order to run Linux, you must do one of the following:


    +   * Repartition an existing large drive to make room for Hat Linux. You should
    attempt this only if you have a truly enormous hard drive with lots of free space.

    * Delete an existing extended DOS partition to make room for Red Hat Linux. On
    many older PCs with large drives, there''s a 2.1GB limit to the size of a DOS
    partition. To use all the space on the drive, the system was configured with two
    partitions, a primary DOS partition (the boot partition) and an extended DOS partition.
    These show up as drive C and drive D, but you really have only'
  merge: -1
  pgno: 134
- img_proc: true
  md: '# CHAPTER 4 • PREPARING TO INSTALL RED HAT LINUX


    one physical hard drive installed. If you haven''t used drive D, the extended
    DOS partition, you can delete this partition to make room for Red Hat Linux.


    +   Delete the DOS partition on a second hard drive to make room for Red Hat Linux.
    If your system has two hard drives, and you haven''t made much use of the second
    one, you can delete the DOS partition on this second drive to make room for Red
    Hat Linux.


    # Windows First, Linux Later


    If you''re installing Windows 95 or Windows 98 as well as Linux, start with Windows.
    Here''s why: When you create a two-OS system, Linux will add information to your
    hard drive''s master boot record that enables you to choose between two operating
    systems. The software that enables this choice is called LILO (Linux Loader).
    When you start your system, you''ll see a prompt that asks you to choose the operating
    system you want to load (dos or linux). But here''s the problem. When you install
    Windows 95 or Windows 98, the installation software rather cavalier wipes out
    the master boot record. So install Windows first.


    Because Windows wipes out the 4 upon installation, you''ll run into problems should
    you create a two-OS installation and subsequently upgrade your Windows operating
    system.


    > TIP To prevent problems when you upgrade to a new version of Windows, you may
    wish to install a commercial OS switching utility, such as System Commander Deluxe
    (V Communications). This software also enables you to repartition your hard disk
    safely. If you purchase System Commander Deluxe, you won''t need to run the FIPS
    utility, discussed in this section.'
  merge: -1
