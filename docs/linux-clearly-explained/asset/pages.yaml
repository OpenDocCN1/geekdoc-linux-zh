    # Deleting Files and Directories


    Midnight Commander enables you to delete files with all the features and versatility
    with which you can copy and move them, but it''s best to remember that file deletion
    can be a dangerous business. Should you inadvertently delete a configuration file,
    you could lose important configuration information or your applications might
    not run at all.


    > TIP To make sure that you do not inadvertently erase configuration files, consider
    hiding them during the time you''re experimenting with deletion commands. To do
    so, click Options on the menu bar, choose Configuration, and uncheck the Show
    Hidden Files option. OK to confirm this option without saving it. Configuration
    files will remain hidden during the remainder of your Midnight Commander session,
    but they will appear again the next time you start the program.


    # Enabling Safe Delete


    To make sure you do not inadvertently delete important files beyond recovery,
    take advantage of the Safe Delete feature. When you enable this feature, Midnight
    Commander selects'
