  md: '# The Nature of Unix


    Unix’s popularity is simply explained: It is arguably the most sophisticated,
    robust, scalable, and stable operating system ever developed. In this section,
    you learn more about the technical design and capabilities of today’s Unix operating
    systems.


    # The Three Levels of Unix


    To understand Unix’s design philosophy, it’s useful to think of Unix as being
    composed of three independent levels:


    +   - Kernel This is the operating system in the strict sense, the core of the
    code that manages the computer’s resources, handles input/output operations, and
    allocates access to the memory and processor.


    +   - File system More than just a way of organizing files, the Unix file system
    provides the overarching metaphor for conceptualizing all aspects of the computer
    system, including peripherals (which are represented as if they were files). Founded
    on a concept of the file system as a hierarchy of objects (with directories and
    subdirectories), the Unix file system model profoundly influenced subsequent operating
    system development (for example, MS-DOS directories and subdirectories are modeled
    expressly on Unix file system concepts.


    +   - Shell Completely separate from the operating system proper, the shell accepts
    user input and displays messages from the system. Because the shell is totally
    independent from both the file system and the kernel, users can use the shell
    of their choice.


    “divide and conquer” approach enables system programmers to focus on keeping each
    component as small and manageable as possible.'
  merge: -1
