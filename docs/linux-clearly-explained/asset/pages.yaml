  md: '# Switching to Superuser Status


    If you’ve used Unix or Linux previously, you know that it’s possible to switch
    to superuser status without logging out of your user account. Superuser status
    gives you all the privileges of the root user, including the ability to modify
    file ownership and permissions outside the root directory. Superuser status can
    come in very handy when you need to make some small change to a configuration
    file outside your home directory. However, the File Manager does not enable you
    to switch to superuser status. Such access would leave security holes open that
    a knowledgeable intruder could exploit.


    To switch to superuser status, you’ll need to open a terminal user and use the
    text-mode commands that give you superuser access. For more information on these
    commands, (see Chapter 15) You can then use text-mode commands (or the text-mode
    version of File Manager, called Midnight Commander (see Chapter 16), to modify
    files outside your home directory.


    You can accomplish the same by logging out of your user account and logging in
    as the root user. When you’re running File Manager as root, you can open and modify
    files anywhere on your system.


    > CAUTION Please not modify files outside your home directory unless you’re absolutely
    sure you know what you’re doing. It’s quite easy to make some small change to
    a configuration file that will degrade your system’s functionality—or at the extreme,
    render it unstable that you will not be able to access your files!'
  merge: -1
