  md: '# CHAPTER 15 USING THE SHELL AND FILE UTILITIES 401


    If you need to shutdown or configure the system, you don''t need to go through
    the whole cycle of logging off as an ordinary user and logging in as root. You
    can use the superuser command (su) to log in temporarily with root privileges.


    Log in as superuser while you''re in your user account, type su and press Enter.
    You''ll see the Password: prompt. Type the superuser password, and press Enter.
    You''ll see the root prompt, with the pound sign.


    Now you can perform whatever operations you need to perform while logged in as
    root. When you''re done, switch back to the shell (that is, exit the window manager,
    if you''re in X); then type exit and press Enter. Once again, you''re logged in
    as a user (not as root).


    > TIP Confused about whether you''re logged in under your username or root? Type
    whoami, and press Enter.


    # Shutting Down and Rebooting


    You can shut down or reboot the system only when you''re logged in as the root
    user or superuser. To shut down the system, type shutdown now and press Enter.
    To reboot the system, type shutdown -r now and press Enter.


    # Understanding Linux Directories


    The Linux file system is hierarchically organized, like a tree with its trunk
    and branches. At the top level of the directory tree is the root directory (symbolized
    by a single forward slash mark, /). Branching off the root are directories, each
    of which can contain one or more subdirectories. For example, the /home directory
    is located on the first branch off the root.'
