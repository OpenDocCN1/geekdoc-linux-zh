    that aren’t displayed, you see a plus sign next to the directory’s name. To see
    the subdirectories within a directory), click the plus sign. When the plus sign
    changes to a minus, you know that you are viewing all the subdirectories one level
    below the selected directory.


    Within the directory window, you’ll see icons representing directories and files.
    Directories are represented by folder icons. Note that one of these is named ..
    (two dots). This'
