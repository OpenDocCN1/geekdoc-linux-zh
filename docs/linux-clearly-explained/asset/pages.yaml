  md: '# Exploring GNOME Applications


    tures such as tables and frames, this utility is adequate for creating simple
    Web pages.


    At this writing, GNOME applications are in their infancy; the GNOME project is
    substantially behind KDE in this respect (see “Exploring KDE Applications,”) later
    in this chapter. Now that the GNOME desktop version 1.0 is completed, you can
    expect to see further development in this area.


    # The GNU Image Processor (GIMP)


    Developed by Peter Mattis and Spencer Kimball, the GNU Image Processor (GIMP)
    is not only an outstanding program in its own right, but the inspiration for the
    entire GNOME project. GIMP’s developers created the GTK+ interface tool, which
    became the basis for the entire GNOME project. Released under the terms of the
    GNU General Public License (GPL), The GIMP (as it’s affectionately known) is nothing
    less than a professional-quality program for photo retouching, image composition,
    and image editing. Graphic artists say that The GIMP rivals the functionality
    of the pricier commercial product PhotoShop (see Figure 11.5 for a taste of The
    GIMP in action). Features include a full-suite of painting tools, a plug-in architecture
    for accessory programs, dozens of posted file formats, multiple levels of undo
    and redo, and much, much more.


    If you’re not familiar with PhotoShop-quality image processing software, there’s
    a steep learning curve. Like Photoshop, GIMP enables artists to create illustrations
    using independently editable layers, and includes an armada of image manipulation
    tools. In Figure 11.5, for instance, you see a photograph that’s been altered
    by the addition of painterly effects. For pro-'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'fessional applications, GIMP can handle preprocess concerns, such as color
    mapping; these and other professional features require a bit of experience to
    understand.


    > TIP GIMP is one of the few open source applications that has decent online documentation.
    Visit http://manual.gimp.org to access an outstanding, 500-page GIMP manual that
    comprehensively documents GIMP’s many features. For the latest on GIMP, visit
    http://www.gimp.org.


    # Scanning in the Linux Environment


    Until recently, the words “scanners” and “Linux” rarely appeared in the same sentence.
    That’s no longer the case, thanks to SANE (Scanner Access Now Easy, with headquarters
    at http://www.mostang.com/sane/). Essentially an interface to scanning and digital


    ![](img/21d32b84086223524c8766042726779d_341_0.png)


    Figure 11.5 The GIMP is an outstanding photo editing program.'
  merge: -1
  pgno: 341
- img_proc: true
  md: 'camera hardware, SANE is released under the GNU General Public License (GPL)
    and is true open-source software.


    Recently in a stable version 1.0, SANE provides support for a wide variety of
    digital cameras and scanners, including scanners made by Asfa, Apple, Canon, Epson,
    HP, MicroTek, Nikon, Polaroid, Tamarack, Umax, and more (for a complete list,
    see http://www.mostang.com/sane-backends.html).).


    In contrast to the TWAIN interface used in Windows and Macintosh scanning, the
    SANE standard separates the scanning user interface from the underlying code that
    connects to the scanner. As a result, SANE enables network access to scanners,
    a new development that will ultimately make Linux the preferred environment for
    scanning purposes. Graphics applications as GIMP are designed to work directly
    with SANE. For example, Xsane, a front end program for Sane, is designed to work
    as a GIMP plug-in. For more information on Xsane, see http://www.wolfsburg.de/~rauch/xsane-xsane.html.


    # The Gnumeric Spreadsheet


    The GIMP points the way to the future of GNOME software, it''s going to be very
    bright indeed. Much of this promise is already evident in Gnumeric (see Figure
    11.6), a project spearheaded by GNOME leader Miguel de Icaza.


    Gnumeric aims for nothing less than feature-to-feature rivalry with leading commercial
    spreadsheet packages, replaces the basic values of open source software: compliance
    with recognized standards and freedom from proprietary file formats. Gnumeric
    stores data in eXtensible Markup Language (XML), an ASCII-based format that can
    be used by an XML-compliant application. Gnumeric can also read and write Microsoft
    Excel files.


    In very early beta (version 0.25, at this writing), Gnumeric is still a work in
    progress; there''s no support for printing, for example, and chart capabilities
    await the devel-'
  merge: -1
  pgno: 342
- img_proc: true
  md: '# CHAPTER 11 • RUNNING APPLICATIONS WITH GNOME 313


    Opment of a GNOME-wide vector graphics architecture. Still, it''s clear that Gnumeric
    is following the path laid down by GIMP; it may become one of the most highly
    regarded software achievements in personal computing if the Gnumeric team achieves
    its goals.


    To find out the latest information about Gnumeric (and to download the latest
    version), visit http://www.gnome.org/gnumeric.


    # GNUCash


    Another ambitious project, GNUCash (http://www.gnucash.org) aims to create a GPL-licensed
    personal finance and checkwriting program, with all the features of the leading
    commercial products such as Quicker or Microsoft Money.


