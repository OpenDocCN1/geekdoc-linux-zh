    # Running KDE Applications with GNOME


    As you''ll discover when you launch a KDE application, KDE programs run just fine
    under GNOME. You''ll be able to make use of GNOME features such as detachable
    menus. Note, that the KDE applications aren''t saved along with GNOME''s session
    management information; if you want KDE applications to start automatically when
    you launch GNOME, select Session Manager in the GNOME Control Center, and click
    Add to add the program to the list of nonsession-managed startup programs.


    # Running X Applications with GNOME


    GNOME runs X Window System applications—and that means you can take advantage
    of a huge collection of useful software. You won''t get the benefit of GNOME''s
    inner workings, which means you can''t detach menus or count on automatic session
