  md: '# Using Windows


    To anyone who has used Microsoft Windows, the windows you''ll see in GNOME (see
    Figure 8.3) are easy to use. And that''s no accident. These windows are generated
    by the Enlightenment window manager, using a theme that''s designed to resemble
    the functionality of Microsoft Windows. (You can choose other themes, if you wish,
    you''ll be wise to stick with the default themes until you''ve learned all the
    basics.)


    Although the default Enlightenment theme resembles Microsoft Windows features,
    you''ll also find some nifty features that show the influence of the Finder, the
    window manager that''s built into Mac OS. One example is the window shade/unshade
    feature, which enables you to “roll up” the window so that only the title bar
    is visible.


    # Exploring Window Features


    Note the following window features, shown in Figure 8.4:


    ![](img/21d32b84086223524c8766042726779d_233_0.png)


    Figure 8.4 Window control features on the title bar'
