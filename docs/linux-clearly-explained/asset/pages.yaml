    see “Moving an Applet,” the following section.


    If you’ve added the applet, you may wish to adjust the applet’s properties, if
    any. To do so, right-click the applet button, and choose Properties. What you’ll
    see next depends on which applet you’ve clicked. Make your selections, and click
    OK.


    # Moving an Applet


    To move an applet, right-click and choose Move Applet from the pop-up menu. Move
    the pointer where you want the applet to appear, and click the left mouse button.


