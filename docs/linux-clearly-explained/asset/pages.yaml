    popup menu, and choose one of the following: Height (to adjust the window height),
    Width (to adjust the window width), or Size (to adjust both height and width).


    # Stacking


    By default, GNOME windows are on top when they''re active. To change the clicking
    level, click the Window Control Menu button, point to Set Stacking, and choose
    one of the following: Beneath all other windows, except you click within the window
    and hold down the mouse button), Normal (the default setting, in which windows
    are above active and below when they''re inactive), Above (above other inactive
    windows even when inactive), or On Top (above all other windows, even active ones).


    # Stick/Unstick


    Click the Window Control Menu button, and choose Stick/Unstick.


    > TIP To view the previous window you viewed in the current-top area, hold down
    the Alt key and press Tab. Press Alt + Tab again to return to the previous window.


    > TIP Here''s another way to show, hide, shade, unshade, close, or annihilate
    a window: In the Pager, right-click the window''s button, and choose one of the
    following from the popup menu: Show/Hide, Shade/Unshade, Close, or Nuke.


