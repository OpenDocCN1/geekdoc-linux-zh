  md: '# Understanding Default Permissions


    When you create a new file or directory, Linux assigns default permissions to
    it. If you''d like to find out what these permissions are, type umask and press
    Enter. You''ll see a number, such as 022.


    To find out what this number means, subtract it from 666 (read/write permissions
    for owner, group, and other)—note that this isn''t the sort of subtraction you
    learned in grade school. For each digit, if the subtraction results in a quantity
    less than zero, put zero. Suppose the umask is 027:


    ```

    666

    -027

    640

    ```


    The numeric value 640 corresponds to read/write permission for the owner, read
    permission for the owner''s group, and no permissions for others. Equivalents
    are:


    ```

    r w - r - r - -

    nu=rw,g=r,o=

    ```


    For directories, you subtract the umask value from 777:


    ```

    777

    -027

    750

    ```


    In symbolic mode, the directory permission 750 is the same as:


    ```

    r w x r - x - -

    u=rwx,g=rx,o=

    ```


    Table 15.7 provides a list of typical umask values and their equivalents.'
