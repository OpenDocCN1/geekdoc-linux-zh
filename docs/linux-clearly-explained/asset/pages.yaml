  md: '# Getting More Information


    To see all the available information about the files in a directory, use **ls
    -f** or **vdir** and press Enter. You’ll see a display such as the one shown in
    Figure 15.1.


    From left to right, here''s what you’re seeing:


    +   * **Permissions flags** The odd-looking codes (such as -rw-r--) indicate the
    file’s type, as well as which you may read, modify, delete, or run the file. You’ll
    learn more about permissions in Chapter 9.

    * **Links** The number (such as 1 or 2) indicates the number of links the file
    possesses to other files on your system. Links provide a way to access the contents
    of one file by typing the name of another.

    * **Owner name** In the next column, you see the name of the file’s owner (here,
    the owner is the root user). You’ll learn more about file owners in Chapter 9.

    * **Group name** This column indicates the name of the group to which the user
    belongs. If the user has not been included within a group, the group name is the
    same as the owner name. Chapter 9 discusses groups.

    * **File size** The file’s size is indicated in bytes.

    * **Date of creation or last modification** This column shows the date and time
    when the file was created or last modified.

    * **File name** The last column on the right indicates the file’s name.


    > TIP Remember that all the commands discussed in this chapter have many additional
    command-line options, which you may find convenient to use. To see a list of command-line
    options, view the command’s man page. (To do so, type **man** followed by a space
    and the command’s name, and press Enter.)'
