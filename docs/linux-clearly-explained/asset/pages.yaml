  md: 'ally, UNIX and Linux software keeps these operations separate-


    +   **Compression** Of the several UNIX and Linux programs in common use, gzip
    is by far the most popular. However, other compression formats are in use, including
    the zip format (identical to the WinZip/PKZip format in Windows and DOS).


    +   **Archiving** The archive program of choice for UNIX and Linux is tar, a program
    originally developed for archiving data to backup tapes (the name "tar" stands
    for "tape archiver").


    A compressed file that contains a tar archive generally has two extensions (.tar.gz).
    At the command prompt, decompressing the file and extracting the files from the
    archive is a two-step operation, but that''s no longer necessary, thanks to GNOME
    utilities. An example is gxTar, a GNOME-compatible compression and archiving utility.
    This program seeks to become nothing less than the WinZip of the Linux world;
    seamlessly combines decompression and archive extraction functions. Still in early
