- img_proc: true
  md: '# Mounting an External Filesystem


    To mount an external filesystem, such as the files on a floppy disk, a ZIP disk,
    or a CD-ROM, you use the mount command. If there''s an entry for the device in
    /etc/fstab, you can use the short version of the mount command, as in the following
    example:


    ```

    #mount /dev/cdrom

    ```


    When you press Enter, Linux mounts the disk in the CD-ROM drive using the defaults
    specified in /etc/fstab, such as the iso9660 filesystem (which is the standard
    filesystem for CD-ROM data).


    > TIP the device you''re trying to mount is not listed in /etc/fstab, you must
    use the mount command''s options, (among other things) enable you to specify the
    filesystem. However, you should not need to do so, since the Red Hat installation
    software creates entries for these devices automatically.


    Once the device is mounted, you can access the files it contains. You do so by
    going through the mount point (such as /mnt/cdrom). For example, in Midnight Commander
    (Chapter 17), you access your floppy drive by selecting the /mnt directory and
    then choosing the /cdrom directory. To access your floppy drive, you select /mnt
    and then choose /floppy.


    > CAUTION After you''ve mounted a floppy disk, backup tape, ZIP disk, or any other
    read/write media, don''t remove the disk from the drive without first unmounting
    it! If you do, you could wipe out the data that the device contains. See the next
    section to learn how to unmount a device.'
  merge: -1
  pgno: 469
- img_proc: true
  md: '# Unmounting an External File System


    Don’t pop a disk out of a drive without first unmounting it. To do so, use the
    unmount command, as in the following example:


    ```

    umount /dev/fd0

    ```


    Instead of specifying the device name, you could use the mount point, as in the
    following example:


    ```

    umount /mnt/floppy

    ```


    # Mounting an MS-DOS Disk


    By default, the Red Hat installation software configures /etc/fstab so that Linux
    assumes you’re using the ext2 (Linux) filesystem on floppy disks. If you would
    like to access files on an MS-DOS disk, you need to mount the disk using a command
    that specifies the correct filesystem (msdos), as in the following example:


    ```

    #mount -t msdos /dev/fd0 /mnt/floppy

    ```


    Note that you must type all the elements in this command, and you must type them
    in order: the -t option is followed by a space and the filesystem identifier (msdos);
    next comes the device name, and finally the mount point.


    There’s an easier way, thanks to Mtools, a nifty collection of utilities for users
    of MS-DOS disks (see Knaff 1999). You’ll need to know basic MS-DOS commands in
    order to use Mtools, because the Mtools utilities emulate DOS commands. For example,
    to see a list of the files on an MS-DOS disk in the floppy drive, just type the
    following and press Enter:


    ```

    md a:

    ```'
  merge: -1
  pgno: 470
- img_proc: true
  md: '# CHAPTER 16 • MASTERING SYSTEM ADMINISTRATION 441


    Note that you don’t need to mount the floppy; this command takes care of everything
    automatically. You can format MS-DOS disks using mformat, delete files using mdel,
    copy files (to and from Linux) using mcopy, and even manipulate ZIP disks with
    the mzip command. See Knaff 1999 for more information on these nifty utilities.


    # Mounting an MS-DOS Partition Automatically at Start-Up


    If you’ve set up Linux to run on a two-OS system, you may wish to access your
    MS-DOS or Windows files from within Linux. To do so, first determine which partition
    contains the MS-DOS or Windows files. To see a list of current partitions, type
    cfdisk at the Linux prompt, and press Enter. You’ll see a partition list. Look
    for the partition with an MS-DOS or Windows FS (filesystem) type, and note the
    device name. Type q to exit this program.


    If you have an MS-DOS partition containing Windows, you can add this partition
    to your Linux filesystem. If your Windows partition is located in /dev/hda1, you
    would add the following line to your /etc/fstab file:


    ```

    /dev/hda1 /windows mdsos user,default 0 0

    ```


    This line specifies the following: the device name of the MS-DOS or Windows partition
    (here, /dev/hda1), the mount point (here, /windows), the filesystem (here, mdsos),
    the settings (“user”) enables non-root users to access the Windows files, and
    “default” specifies several access options, including mounting this filesystem
    automatically when Linux starts.


    # Configuring Linux to Allow Users to Mount Devices


    If you’re using Linux on a single-user system, you’ll want to configure your /etc/fstab
    file so that your user—you, that is,'
  merge: -1
  pgno: 471
- img_proc: true
  md: 'after you''ve logged in using your user account—can mount external devices,
    such as the floppy and CD-ROM drives. To do so, use Midnight Commander (see Chapter
    17) to edit your /etc/fstab file. Find the device set to noauto, and change this
    setting to user,noauto for read/write drives or user,noauto,ro for read-only drives,
    in the following example:


    ```

    /dev/fd0 /mnt/floppy ext2 user,noauto

    /dev/cdrom /mnt/cdrom iso9660 user,noauto,ro

    ```


    Save the configuration file. Log on to Linux using your user account (instead
    of root); you''ll be able to access the floppy and CD-ROM drives by using the
    following commands:


    ```

    mount /dev/cdrom

    mount /mnt/cdrom

    mount /dev/fd0

    mount /mnt/floppy

    ```


    # Formatting a Floppy Disk


    Before you can use floppy disks with your Linux system, you must format them.
    In the Linux world, formatting refers to the process of preparing the disk for
    use by establishing magnetic patterns on the disk''s surface; the term is synonymous
    with low-level formatting in the MS-DOS and Windows worlds. Low-level formatting
    alone isn''t sufficient for disk usage; you must also create the Linux filesystem
    on the freshly formatted disk.


    > CAUTION Be aware that formatting wipes out all the data that may be present
    on a disk. If a disk contains data, be sure to remove it before formatting the
    disk.'
  merge: -1
  pgno: 472
- img_proc: true
  md: 'CHAPTER 16 • MASTERING SYSTEM ADMINISTRATION 443


    To format a floppy disk from the Linux prompt, use the fdformat utility. With
    this program, you can''t use the generic floppy disk identifiers (fd0 or fd1);
    you must use one of the device names that indicates the disk''s capacity, as shown
    in Table 16.3.


    # Table 16.3 Floppy disk device names for formatting


    | Device name | Description |

    |---|---|

    | fd0D720 | Double-density disk (720K), floppy #1 |

    | fd0H1440 | High-density disk (1440K), floppy #1 |

    | fd1D720 | Double-density disk (720K), floppy #2 |

    | fd1H1440 | High-density disk (1440K), floppy #2 |


    To format a high-density floppy disk in the first floppy drive (/dev/fd0), type
    the following and press Enter:


    ```

    #fdformat /dev/fd0H1440

    ```


    You''ll see a progress indicator that informs you when the disk has been formatted.


    Formatting alone isn''t sufficient to prepare a Linux disk; you must also create
    the filesystem using the mkfs command. so, type the following and press Enter:


    ```

    #mkfs /dev/fd0

    ```


    This command creates the ext2 filesystem on the first floppy drive (use the /fd1
    device name if you''re creating a filesystem on a second floppy drive).


    # Maintaining Disks


    To keep floppy disks and ZIP disks running smoothly, you need to know the basics
    of disk maintenance. In this section,'
  merge: -1
  pgno: 473
- img_proc: true
  md: 'you learn how to check for bad sectors (bad blocks), check the filesystem’s
    integrity, and determine the amount of free space remaining on a disk.


    # Checking for Bad Sectors


    To check a disk for surface errors (called bad blocks or bad sectors), you can
    use the badblocks command. The following command checks a 1440K floppy:


    ```

    #badblocks /dev/fd0 1440

    ```


    If all’s well, you see the Linux prompt again. Should the program report any bad
    sectors, move the data off the disk and discard the disk.


    Because this command is somewhat dangerous to use, you shouldn’t run it on your
    hard drive. One of the command’s options could wipe out all the data on your entire
    disk!


    # Checking File System Integrity


    You may have noticed that, when you start Linux, a utility called fsck runs automatically.
    This utility, comparable to the MS-DOS and Windows Scandisk utility, checks the
    filesystem’s integrity and makes needed repairs automatically.


    > CAUTION Never run fsck manually on your hard drive unless you know what you’re
    doing. This program can be dangerous if you run it on a mounted drive, since the
    Linux disk caching software might write information to the mounted drive while
    fsck is running, leading- to a scrambled filesystem. Always unmount a device before
    running fsck on it.'
  merge: -1
  pgno: 474
- img_proc: true
  md: '# CHAPTER 16


    # MASTERING SYSTEM ADMINISTRATION


    # 445


    To run fsck on a floppy disk, first unmount the disk. Then type the following
    (for the first floppy drive, /dev/fd0):


    ```

    fsck -r /dev/fd0

    ```


    If all''s well, you''ll see a message indicating that the disk’s filesystem is
    clean. Should fsck encounter any errors, you''ll be asked to confirm the repairs
    before they''re made.


    # Determining the Amount of Space Left on a Device


    To determine the amount of space left on a device, you can use the df utility,
    of the GNU file utilities. If you type df at the Linux prompt, you''ll see a list
    of all currently mounted devices. You''ll also see the total amount of available
    storage for each device (expressed in K, or blocks of 1,024 characters), as well
    as the amount of used space (expressed both in K and a percentage of used space).


    To see how much space is left on a single device (such as a floppy disk), make
    sure the disk is mounted. Then type df followed by the device name, as in the
    following example:


    ```

    df /dev/fd0

    ```


    # Determining the Amount of Space Used by a Directory


    If you''d like to know how much storage space is consumed by a specific directory,
    use the du command. Don''t forget the summarize option (abbreviated -s), unless
    you''re content to examine what could be a very lengthy list of files! The following
    command tells you how much space (in kilobytes) has been taken up by the files
    in the /home/bryan directory:


    ```

    du -s /home/bryan

    ```'
  merge: -1
  pgno: 475
- img_proc: true
  md: '# Creating and Extracting Archives


    You won’t spend long in the Unix and Linux world before you hear of tar, a file
    archiving utility. Originally designed for backing up data on tapes (the name
    “tar” stands for “tape archiver”), the program is still widely used for storing
    a collection of files as a related unit, backing up data to backup disks or tapes,
    and transferring a collection of files to another computer. In this section, you’ll
    learn basic tar concepts, and then learn how to perform the most used tar operations:
    creating an archive, listing an archive’s contents, and extracting files from
    an archive. Discussed here is GNU tar (see Weisshaus et al. 1997), the most recent
    and advanced version of this program, and the one that’s provided with Red Hat
    distributions.


    # Understanding Fundamental tar Concepts


    If you’re using Windows archiving programs such as WinZip, you need to understand
    that tar doesn’t include file compression capabilities; it’s strictly an archiving
    program, which means that it collects one or more files and stores them as a unit.
    (When stored in an archive, the archived files are called file members.) Once
    you’ve created the archive, you can compress the archive using gzip, the GNU compression
    utility discussed in the next section.


    # Creating an Archive


    To create an archive with tar, you’ll make use of three basic command options:
    --create, --verbose, and --file.


    +   Create (--create or -c) The --create option tells tar to make a new archive
    file.'
  merge: -1
  pgno: 476
- img_proc: true
  md: '# CHAPTER 16 • MASTERING SYSTEM ADMINISTRATION 447


    +   - Verbose (--verbose or -v) The --verbose option tells tar to give you information
    about what it''s doing.


    +   - File (--file or -f) The --file option enables you to specify the name of
    the file to be created.


    In addition, you must also list the files to be archived. You can do so by listing
    them individually, separated by a space. Alternatively, you can use wildcards.
    For example, the following command creates an archive containing all the GIF graphics
    in the current directory:


    ```

    tar -cvf gif-collection.tar *.gif

    ```


    Note that you can use the short form of the option names (-cvf) instead of typing
    the lengthier versions (--create --file). When you use the short version, type
    just one hyphen, not two.


    You can create an archive containing all the files in a directory. To do so, follow
    these steps:


    +   1. Move to the directory above the directory that you want to archive (to
    do so from the directory to be archived, type cd .. and press Enter).


    +   2. At the Linux prompt, type tar -cvf followed by the name of the archive
    you want to create, a space, and the name of the subdirectory that you want to
    archive. For example, to archive all the files in the subid called art, you would
    type tar -cvf artfiles.tar art.'
  merge: -1
  pgno: 477
- img_proc: true
  md: '# PART FIVE • LEARNING COMMAND PROMPT ESSENTIALS


    > TIP When you archive an entire directory, tar automatically archives all the
    subdirectories contained in this directory, if any, and preserves the directory
    structure. This is a feature that makes tar valuable for backup purposes. For
    example, you should periodically back up the entire /home directory, and all its
    subdirectories. Users should wipe out their files inadvertently, you''ll be able
    to restore them from the archive.


    # Listing the Files in an Archive


    You can use the text-based tar commands to list the files in an archive; for example,
    the following command lists the files contained in the archive called art.tar:


    ```

    tar -lt art.tar

    ```


    Rather than using tar to list these files, try using Midnight Commander (see Chapter
    17 for an introduction to Midnight Commander). This program can read tar archives
    directly, and shows you the names of the files contained in the archive.


    To view the contents of an archive with Midnight Commander, do the following:


    +   1. In the file list, select the tar archive that you would like to examine.


    +   2. Press F3. You''ll see a window listing the files in the archive.


    > TIP To view the actual contents of all the files in the archive, select the
    archive filename and press F4 (Edit).'
  merge: -1
  pgno: 478
- img_proc: true
  md: '# Extracting Files from an Archive


    If you’ve created or received an archive, you may wish to extract the files that
    it contains. To do so, you use the --extract option, as in the the following example
    (note that this example also uses the --verbose option and the required --file
    option):


    ```

    tar -xvf art.tar

    ```


    By default, this command extracts the entire archive, and places the files in
    the current directory.


    > CAUTION Be careful when you’re extracting archives. If any file in the current
    directory has the same name as a file in the tar archive, the program will overwrite
    the existing file, even if it’s more recent than the archived version. Play it
    safe: Create a new subdirectory, place the tar archive within the new subdirectory,
    and extract the archive there.


    You can extract individual files from an archive. For example, suppose you created
    a work called great-art.jpg. Subsequently, you archived your entire home directory—and
    then you accidentally deleted great-art.jpg. To restore it, place its name at
    the end of the command you use to extract files from a tar archive. The following
    command extracts only one file, great-art.jpg, from the archive called home.tar:


    ```

    tar -xvf home.tar great-art.jpg

    ```


    # Creating a Backup Routine


    To safeguard the work you create on your Linux system, you should perform regular
    backups.'
  merge: -1
  pgno: 479
- img_proc: true
  md: '# Full Backups and Incremental Backups


    A good backup routine begins with a full backup, which makes a copy of all your
    valuable files. If you have a backup tape drive, you can back up your entire hard
    disk—and that’s not a bad idea, unless you''re comfortable starting almost from
    scratch (reinstalling everything) in the event of a hard disk failure. At the
    minimum, though, you should make a full-up of your home directory. This directory
    contains the work you''ll do with Linux applications, as well as the configuration
    files reflecting all the choices you''ve made as you set up Linux and the applications
    you''re using.


    > TIP It’s not a bad idea to perform a full backup on your /etc directory. This
    directory contains system-wide configuration files, including settings for the
    X Window system and the Internet. These files can be a bear to configure sometimes,
    so it''s wise to back them once you''ve got them working.


    Once you''ve performed a full backup, you do not need to back up all your files
    every time you perform a backup operation. You only need to backup the files that
    have been altered or created since the last backup occurred. Called an incremental
    backup, this procedure is much less time-consuming—which means you''re more likely
    to do it, instead of putting it off (and risking the total loss of all of your
    work).


    # Performing the Full Backup


    For a full backup, use a command such as the following. This command makes an
    archive of all the files in the /home/bryan directory, and stores them on a ZIP
    disk (in /dev/sda4):


    ```

    #tar -cvf /dev/sda4 /home/bryan

    ```'
  merge: -1
  pgno: 480
- img_proc: true
  md: 'If you suspect that the backup will consume more than one backup tape or disk,
    you can use the --multi-volume option, abbreviated -M, as in the following example
    of backing up to floppies:


    ```

    #tar -cvmf /dev/fd0 /home/bryan

    ```


    When you run out of space on the first disk or tape, you’ll be prompted to supply
    the second one. Be sure to number each disk or tape.


    # Verifying the Backup


    Don’t skip this step, unless you like taking big risks! In it, you’ll run tar
    with the --compare (-d) option, which verifies that the backup has been bit-perfect.
    To verify the full backup to a ZIP disk (in /dev/sda4), type the following and
    press Enter:


    ```

    #tar -dvf /dev/sda4

    ```


    If this utility finds any discrepancies, repeat the full backup and check again.


    Once you’ve successfully finished the full backup and verified that the files
    are correct, make a disk label that says “Full Backup,” followed by the date and
    the directories you’ve backed up.


    # Performing an Incremental Backup


    Once you’ve performed a full backup, put the backup disks and tapes away for safekeeping,
    and perform incremental backups. These backups make copies of only files that
    have changed since the last full backup was made.'
  merge: -1
  pgno: 481
- img_proc: true
  md: 'To perform an incremental backup, use the --newer (-N) option. The following
    example backs up all the files in the /home/bryan directory created after March
    12, 1999, the date of the last full backup:


    ```

    #tar -cvN ''12 Mar 1999'' /dev/fd0

    ```


    Be sure to verify the backup:


    ```

    #tar -dvf /dev/fd0

    ```


    When you''ve successfully completed the incremental backup, make a disk label
    that says “Incremental Backup of Full Backup,”” followed by the date of the full
    backup and this incremental backup.


    How often should you perform an incremental backup? If you were running a multi-user
    Linux system, you''d perform incremental backups every day. On a single-user system,
    it makes sense to do so only when you''ve created new files or altered existing
    ones, and don''t want to risk losing this work.


    How many incremental backups should you perform before you perform another full
    backup, and start all again? It depends on how many backup disks you have, essentially.
    At some point, you''ll conclude that you''re ready to start again and re-use all
    those disks.


    # Restoring Files from Backup Devices


    Let’s say a catastrophe has occurred—you’ve just wiped out a document (dissertation.doc)
    that took months of work to create. Fortunately, you made a backup.


    To see whether the file’re after is on a given backup disk, use the following
    command:


    ```

    #tar -lf /dev/fd0 dissertation.doc

    ```'
  merge: -1
  pgno: 482
- img_proc: true
  md: '# CHAPTER 16 • MASTERING SYSTEM ADMINISTRATION 453


    This command looks for the file called “dissertation.doc” on a floppy disk.


    Once you’ve found the disk containing the file, you can extract it using a command
    such as the following:


    ```

    #tar -xvf /dev/fd0 dissertation.doc

    ```


    This command uses the --extract option (abbreviated -x), and extracts the file
    named “dissertation.doc” from the floppy disk. The file is written to its original
    directory location.


    If the ultimate catastrophe has occurred—a hard drive failure—you’ll need to get
    a new hard drive, and re-install Linux. To restore all of your backed-up data,
    use a command such as the following:


    ```

    #tar -xvf /dev/sda4

    ```


    This command extracts all the archived files from a ZIP disk, and replaces them
    in their original locations.


    # File Archiving Horizons


    Although you can set up a backup system with tar and protect your data reasonably
    well, the software does have its limitations. For example, tar doesn’t detect
    when you’ve changed a file’s name, and it also doesn’t handle deleted files well;
    if you’ve deleted a file that contains unwanted information, it will reappear
    when you perform a restore operation. In addition, tar doesn’t incorporate compression,
    which means that it eats up backup media quickly. Due to these and other shortcomings,
    this is an area where commercial software is making inroads.'
  merge: -1
  pgno: 483
- img_proc: true
  md: '# Compressing and Decompressing Files


    As you''ve just learned, file archiving and compression are two different operations
    in the Linux world. When you archive a file, you group one or more files together
    in a single archive file. However, this file is very large—somewhat larger, in
    fact, than the original files. If you need to make a backup copy to a secondary
    storage medium (such as a floppy disk) with limited storage space, you may wish
    to compress the archive after you create it. Additionally, you may wish to compress
    the archive if you plan to transfer it via the Internet. The same goes for any
    large file, whether it''s an archive or not. A compressed file is smaller than
    the original file—sometimes 50 percent or more—yet none of the data is lost.


    Among the many available compression programs for Linux, the standouts are the
    gzip (compression) and gunzip (decompression) utilities (see Gailly 1993). Gzip
    uses the same compression technique found in the popular Windows compression utility
    called WinZip. A gzipped file has the .gz extension. Gunzip can decompress files
    that were compressed with gzip or about any other compression utility in the Linux
    world.


    # Compressing Files


    To compress a file, type the gzip followed by a space, -v (the verbose option),
    another space, and the name of the file you want to compress. The following command
    compresses art.tar.


    ```

    #gzip -v art.tar

    ```


    Note that the result of a gzip operation is the replacement of the original file;
    gzip erases art.tar and replaces it with art.tar.gz.'
  merge: -1
  pgno: 484
- img_proc: true
  md: Linux enables system administrators to provide accounts not only to users, but
    also to groups of users. On a single-user system, you'll probably have little
    need for groups. However, if
  merge: -1
  pgno: 485
- img_proc: true
  md: 'your computer is used by more than one person, you may discover that groups
    come in very handy. For example, suppose you and another user are working on a
    project together. by creating a group consisting of the two of you, and assigning
    permissions to this group, both of you will be able to access each other''s home
    directories, and modify the files contained there.


    # Understanding How Linux Tracks Passwords


    When you create a user, you assign a password. These passwords are stored in /etc/passwd.
    In older Unix systems, these passwords were stored in plain text, meaning that
    intruders could obtain them without too much trouble. Later, the passwords were
    encrypted, but this also presented a security risk, because too many users choose
    simple or short passwords that can be guessed by brute-force (repeated guessing)
    techniques. The /etc/passwd file must be accessed by many applications, so there
    was no way to protect them by restricting the file to only those programs executable
    by the root user.


    To safeguard system security, Red Linux uses shadow passwords. These encrypted
    passwords are stored in a separate file, which can be accessed only by the root
    user. Applications can still get the information they need from /etc/passwd, but
    users can''t see the passwords at all. However, the system is still at risk if
    an intruder gains superuser status.


    # Starting LinuxConf


