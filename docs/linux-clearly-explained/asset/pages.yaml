    # Using an Existing Partition on a Single, Large Drive


    Because many PCs need software help to work with drives over 2.1GB in size, many
    PCs com configured with what appear to be two hard drives, normally called drive
    C and drive D. Actually, these aren''t drives but two DOS partitions, each smaller
    than 2.1GB. If you still have space on drive C and haven''t used drive D much,
