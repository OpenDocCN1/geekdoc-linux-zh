    or some other X-compatible terminal emulator program. A terminal emulator program
    simulates an old-fashioned computer with no graphical user interface.

    * You can also work with the shell directly by exiting your window manager and
    returning to the text-only shell interface. To exit a window manager, press Ctrl
    + Alt + Backspace.


    > TIP To work through this chapter''s exercises, open the GNOME terminal. To start
