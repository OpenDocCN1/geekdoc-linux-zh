  md: '# Killing a Process


    If a process is no longer responding, you may need to kill the process in order
    to resume working with other programs. To do so, use the kill command. Type **kill**
    followed by a space, a percentage sign, and the name of the process or the job
    number, as in the following example:


    ```

    kill &1

    ```


    > **TIP** Some processes are designed to run in the background, checking for events
    that cause them to leap into action. These processes, called daemons, are initiated
    by shell scripts that load automatically when you start Linux.


    # Changing File Ownership and Permissions


    Chapter 8 introduced the basic concepts of file ownership and permissions, which
    are concepts of fundamental importance in Linux. (See the section titled "Understanding
    File Ownership and Permissions.") In this section, you learn how to manipulate
    file ownership and permissions using the text-mode file utilities.


    # Changing File Ownership with chown


    To change the ownership of files or directories, use the chown command. To use
    chown, type **chown** followed by a space, the user or group name, and the name
    of the file or directory. Here''s an example:


    ```

    chown bryan mydoc.txt

    ```


    A very neat option is -R, which changes ownership recursively. This option enables
    you to change file ownership through-'
