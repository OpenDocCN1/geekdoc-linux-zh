  md: '# Learning Basic Window Manipulation Tasks


    With Microsoft Windows or Mac OS, you can move and size windows, as well as minimize
    them or zoom them to full size. Thanks to GNOME’s default window manager, Enlightenment,
    you can perform all of these tasks, plus many more. You’ll find when you experiment
    with on-screen windows, Enlightenment enables several additional cool window maneuvers
    that you may wish to use frequently:


    +   - Shade/Unshade Borrowed from the Mac OS interface, this feature collapses
    a window (that is, “rolls it up” a window shade) so that only the title bar is
    visible. To roll up the shade, double-click the title bar. To pull down the shade,
    double-click the title bar again.

    - Stick/Unstick As you’ve learned, Enlightenment enables you to define multiple
    desktop areas. By default, such areas are defined. If you “stick” a window, it
    appears in all the desktop areas. You can “unstick” a window so it appears only
    in the desktop area where you last placed it. To stick or unstick a window, click
    the Window Control Menu button, and choose Stick/Unstick.

    - Moving a window to another desktop area As you grow more comfortable with desktop
    areas, you’ll find that it’s convenient to run applications in their own desktop
    area. You can then switch among applications by clicking a desktop area within
    the Panel. To move applications to other desktop areas, click the Window Control
    Menu, point to Desktop, and choose where to move the window.


    > TIP When you minimize a window with Enlightenment, you’re identifying the window,
    according to Enlightenment’s terminology. However, you won’t see an icon anywhere
    on the desktop. Instead, look for a button in the Pager area.'
  merge: -1
