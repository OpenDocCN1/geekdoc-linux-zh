    # Unix Escapes from the Lab


    Unix first came to the attention of the computer science community in 1973, when
    Thompson and Ritchie gave a paper at a symposium on operating system principles.
    The paper was subsequently published in the influential Communications of the
    ACM, the flagship journal of the Association for Computing Machinery. In response
    to a flood of requests from colleagues in computer science departments, Thompson
    and Ritchie began to distribute computer tapes containing the operating system
    code.


    Despite the excitement created by Unix, AT&T couldn''t sell the nascent operating
    system. Before the court-mandated breakup of AT&T in 1981, the company was under
    a court order that prohibited its involvement in the commercial computing market.
    In exchange, the company retained its lucrative telephone service monopoly throughout
    the United States.


    These restrictions did not prevent Bell Labs from distributing Unix to colleges
    and universities, however. For a nominal fee, AT&T made Unix available to computer
    science departments'
