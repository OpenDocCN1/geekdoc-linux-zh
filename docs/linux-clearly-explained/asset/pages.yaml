  md: '# Tagging Files Individually


    If you plan to perform an operation on just one file (such as copying or moving
    it), you do not need to tag the file. However, you will sometimes need to tag
    a group of files one by one because they occur here and within a directory.


    To tag files one at a time, point to a file’s name and do one of the following:


    +   * Press the Insert key

    * or

    * Press Ctrl + t

    * or

    * Right-click the filename.


    To untag a file, just repeat one of these commands.


    # Tagging Two or More Files


    If you would like to tag all the files in a directory, press * (asterisk). To
    untag the files, press * again.


    More commonly, you’ll want to tag just those files that conform to a pattern,
    such as all the files with the .txt extension.


    To tag multiple files by specifying a pattern , do the following:


    +   1. Display the directory containing the files you want to mark.'
  merge: -1
  pgno: 511
- img_proc: true
  md: '+   2. Press the plus (+) key on the numeric keypad. You can also press the
    plus key within the alphanumeric part of the keyboard.


    You''ll see the Select dialog box.


    +   3. Type an expression using wildcards that will match all the files you want
    to mark. For example, to mark all the .doc files in a directory, type *.doc.


    +   4. Click OK to tag the files.


    Once you''ve tagged another files, use the Copy command to copy them to another
    directory, following the instructions given earlier in this section.


    > TIP If you have tagged many files and then decide not to copy or move them,
    you need to untag them. To do so quickly, click File on the menu bar, and choose
    Unselect Group. In the Unselect dialog box, type the same expression you used
    to tag the files, and click OK.


    # Copying Files and Directories


    Midnight Commander offers many options for copying files and directories—enough
    to confuse an inexperienced user. Until you become comfortable with Linux file
    management tasks, stick to the basics, as described in this section.


    # Copying One File


    To copy a single file, do the following:


    +   1. In the file list, select the file you want to copy.'
