- img_proc: true
  md: '# Moving Files and Directories


    The procedures you follow to move files and directories closely resemble those
    you use to copy them. However, Midnight Commander deletes the original file or
    directory after moving the data to its new location. For this reason, you should
    be very careful when using the command described in this section. If you''re not
    careful, you could move a directory containing crucial configuration files, which
    would interfere with Linux''s operation. Until you are certain you have learned
    enough to move files and directories safely, do not experiment with moving data
    when you''re logged in as root user!


    > CAUTION Do not move files or directories that have names beginning with a period.
    These files and directories are used by Linux applications. These applications
    may not work correctly if you move them to a new location.


    # Moving One File


    To move a single file, do the following:


    +   1. In the file list, select the file you want to copy.

    2. From the File menu, choose Rename/Move, or press F6. Note that MC has added
    the current directory path name to the to: box.

    3. In the to: box, type the full path name of the directory to which you want
    to move the file. For example, to move tar.ps to /home/mike, type /home/mike.'
  merge: -1
