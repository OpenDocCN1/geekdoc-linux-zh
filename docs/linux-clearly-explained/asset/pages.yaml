  md: '# Preparing to Install Red Hat Linux


    Contrary to what you''ve probably heard, Linux is *not* difficult to install—at
    least, no more than any other full-featured operating system. However, you''ll
    find it much easier to install Linux if you do some advanced planning. In this
    chapter, you''ll learn how to prepare for your Red Hat Linux 6.0 installation
    so that the whole process is trouble-free.


    > TIP Because Linux is more efficient than Microsoft Windows, you can get excellent
    performance from older computers that have been lightly used or stored since a
    system upgrade. A Pentium system running at 166 MHz makes an excellent Linux workstation!'
  merge: -1
  pgno: 113
- img_proc: true
  md: The next sections of this chapter guide guide you through this planning process.
  merge: -1
  pgno: 114
- img_proc: true
  md: '# Understanding Linux System Requirements


    Like any operating system, Linux requires a system equipped with a supported microprocessor,
    a minimum amount of memory, and a minimum amount of hard disk space. However,
    a system that meets but does not exceed these minimums does not prove of much
    use.


    In this section, you’ll see the minimum requirements, but you’ll also find my
    recommendations for a system that be able to run Linux so that you can fully explore
    the applications discussed in this book.


    # The Bare-Bones Minimum


    To run Red Hat Linux, the following are the minimum requirements:


    +   * An Intel 386 or later microprocessor. Versions of Linux are available for
    the DEC Alpha, Sun SPARC, PowerPC, and other processors. This book focuses on
    the installation and use of Red Hat Linux 6.0 in the Intel environment.

    * 4MB of RAM (main memory). This is truly a bare-bones minimum. With so little
    RAM, you cannot run the X Window system or GNOME.

    * 200 MB of free hard disk space. Again, this is the bare-bones minimum, and would
    require installing just the basics of Linux.


    These requirements are best ignored in favor of this book’s recommendations, detailed
    in the next section.'
  merge: -1
  pgno: 115
- img_proc: true
  md: '# The Recommended System


    To run Red Hat Linux so that you can fully explore all the applications discussed
    in this book, your system should meet the following requirements:


    +   * A PC equipped with a 486 or later Intel microprocessor. For the best performance,
    run Linux on a Pentium or Pentium II system. Although Red Hat Linux does run on
    systems powered with Cyrix and AMD processors, installation problems are more
    common. You''ll be wise to stick with Intel processors to run Red Hat Linux 5.2.

    * At least 32MB of RAM (main) memory. For the best performance with GNOME, equip
    your system with 48MB or 64MB of RAM.

    * At least 2 GB of disk space. Although you can run Linux with as little as 200MB
    of free disk space, you will surely want much more to install Linux applications.
    To get the most out of Linux, you''ll want a system with 2 GB or more of disk
    space. You''ll need a minimum of 2.6GB if you would like to set up Linux as a
    file or web server.


    > NOTE To install Linux on a PC using the CD-ROM packaged with this book, the
    computer must have MS-DOS or Microsoft Windows installed and running.


