  md: 'CHAPTER 12 • KEEPING YOUR SYSTEM RUNNING SMOOTHLY 343


    # Backing Up Your Work


    When you’re using Linux, it’s very, very important to back up your work. Should
    the power to your system fail, you could be left with scrambled data. Don’t do
    serious, professional work with Linux without developing a backup routine.


    Here are some backup software options:


    +   * gxTar If your system is equipped with a Zip or some other removable drive,
    you can use gxTar to perform backups of your important files. Just create a compressed
    archive on /mnt/zip, and add the files you have backed up.

    * PerfectBACKUP This nifty X utility can handle a variety of backup media, including
    tape drives and Zip disks. You can create schedules and perform a variety of backup
    operations, including full, incremental, and differential backups.

    * X-CD-Roast This program can back up data to inxpensive CD-R disks.


    > TIP It’s wise to perform a full backup of your entire hard disk and perform
    additional backups on changed files. However, it’s inconvenient to perform a full
    hard drive backup unless your computer is equipped with a backup tape drive. For
    this reason, you may wish to back up only the /home directory. This directory
    contains all the user configuration files. Should your Linux drive fail, you can
    rebuild your system by reinstalling Red Hat Linux and restoring your /home directory,
    you’ll have saved all your configuration information and data files.


    # Changing Your Password


    Should you wish to change your password, click the Main Menu button, point to
    System, and choose Change Password.'
  merge: -1
