- img_proc: true
  md: '# CHAPTER 15 USING THE SHELL AND FILE UTILITIES 421


    When you use chmod, you change the file’s current permissions. You can change
    the current permissions in the following ways:


    +   - (add) Adds the specified permission to whatever permissions currently exist
    for the file. If a file currently has read and write permissions, and you add
    an execute permission, the file now has read, write, and execute permissions.

    - (remove) Takes away the specified permission from whatever permissions currently
    exist for the file. If a file currently has read and write permissions, and you
    take away an execute permission, the file now has only the read and write permissions.

    - (equals) Erases all current permissions and assigns the specified permissions
    for the file. If you specify a read permission for a file that formally had all
    permissions (read, write, and execute), the file is now restricted to read-only
    access.


    # Using chmod


    When you use the chmod command to change file permissions, you first type chmod
    and press the space bar. Then you type the user category, the operation, and the
    permission. Finally, you type the filename or directory name.


    Here’s an example:


    ```

    chmod +w recipes.txt

    ```


    This command says, in effect, “add the write permission to recipes.txt for all
    users, no matter what other permissions might exist for the file.”'
