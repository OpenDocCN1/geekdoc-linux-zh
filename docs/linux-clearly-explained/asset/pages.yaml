    # Compatibility Levels


    Red Hat extensively tests Intel hardware for compatibility with its software distributions,
    and rates individual components according to the following scheme:


    +   - **Tier 1 Compatibility** Linux can detect and use these components, which
    are known to install and work reliably on Linux systems.

    - **Tier 2 Compatibility** Although Linux should be able to detect and use these
    components they are known to have some quirks that cause some users problems.
    Such problems can normally be resolved by doing a bit of system tweaking.

    - **Tier 3 Compatibility** Linux can work successfully with many of these components.
    However, the drivers may be buggy or experimental, or the components may cause
    problems that are difficult or impossible to resolve.

    - **Incompatible Hardware** These components do not work with Red Hat Linux.


    > **TIP** To see the current list of supported hardware, visit Red Hat''s site
    (http://www.redhat.com), click Support, and follow the links to the Hardware Compatibility
    Lists.'
