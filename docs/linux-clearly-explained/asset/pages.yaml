  md: '# X Servers and X Clients


    System, these terms have different meanings, as the following sections explain.


    In the X Window System, a server is software running on a specific type of computer,
    equipped with a specific video card, mouse, keyboard, and monitor. The server
    is configured to take advantage of this equipment. Like other types of servers,
    an X server is designed to act on requests from clients, discussed in the next
    section.


    In the X Window System, a client is any program that requests some sort of service
    that the X server knows how to provide, such as redrawing the screen, moving the
    mouse pointer, or accepting keyboard input. Two important clients are the window
    manager, the program that enables the user to control the size and appearance
    of windows on the computer''s display, and X applications, which can''t display
    anything without the X server''s.


    Here''s where Argus and Athena come together, and in a very interesting way. Because
    the X Window System distinguishes between workstation-server and clients, and
    because it''s also designed to work in a networked environment, there''s no particular
    reason why the clients and the server have to be located on the same computer.
    You''re sitting in front of your workstation, you''re making use of this workstation''s
    server, but you could be running clients on several different machines located
    elsewhere on the network (see Zweije 1998).


    "So what," you''re probably saying—and rightly so, considering that you''re probably
    setting up your Linux system as a single-user, nonworked workstation. I could
    point out that you might want to set up a network someday, and X could start to
    have advantages. But the reality is that X''s underlying'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'design is far from ideal for single-user, nonnetworked workstations. X gives
    you a lot of complexity, and there isn''t much of a compensating tradeoff; X is
    best thought of as a lowest-common-denominator windowing system, designed to work
    on a huge variety of computer systems, but very far from optimized for any one
    of them.


    # Windowing Systems vs Desktops


    To grasp the limitations of X fully, it''s helpful to distinguish between windowing
    systems and desktops. X is a windowing system—which means that it''s limited to
    providing windowing functions for applications. X provides the services that enables
    applications to appear in windows on a huge variety of computer systems; for this
    reason, programmers don''t have to worry about the details of the window display.
    That''s about all it does. In a desktop, the user interface software provides
    support for copying and pasting between applications, drag-and-drop procedures,
    file management integration, and interprocess communication (the means by which
    one application can send instructions to another application, such as “start up
    and display this file”). X passes a job as a windowing system; it''s a disaster
    as a desktop.


    Window managers do not begin to approach the capabilities of the Mac OS and Microsoft
    Windows desktops. A special kind of X client, they are restricted to providing
    very basic tools for users. With a window manager, you can manipulate windows
    by moving them, resizing them, minimizing them to an icon, and closing them. Some
    window managers enable you to choose themes, which give the screen a different
    visual appearance. Window managers are very much more limited than desktops.'
