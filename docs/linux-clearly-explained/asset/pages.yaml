    of the Unix philosophy is that the output of one program could be useful as the
    input for another. For this reason, programs did not generate a lot of verbose
    messages, which would be useful to the user but not to the program to which the
    output was being piped.


    During the 1970s, minicomputers steadily gained more memory and processing power,
    presenting an opportunity to create a more user-friendly version of Unix. At the
    University of California, Berkeley, a computer science graduate student named
    Bill Joy created a more accessible version of Unix, one designed to take advantage
    of CRT-based terminals. In 1978, Joy and his colleagues started offering tapes
    of the Berkeley Software Distribution (BSD) at a nominal cost. Soon, BSD acquired
    momentum as de facto “standard” version of Unix. For the next 15 years, Berkeley’s
    Computer Systems Research Group (CSRG), which emerged from Joy’s efforts, released
    a series of influential BSD distributions that served to define the nature and
    capabilities of Unix.


    In creating the BSD distribution model, CSRG achieved more than an improved version
    of Unix, one that today considered by many to be one of the best ever created.
    Joy and his colleagues also created a powerful model for effective, noncommercial
    software development. With each BSD release, worldwide would receive the latest
    versions of the Unix kernel and associated software; if they improved an existing
    module or created a new one, they sent it to Berkeley, and it would be included
    in the next distribution. The only incentive offered to participating programmers
