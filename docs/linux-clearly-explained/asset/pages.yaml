    # The Bourne-Again Shell (bash)


    Most Linux distributions (including Red Hat Linux) default to the Bourne-Again
    Shell (bash), created by the GNU project. Compliant with the POSIX specification
    (see Chapter 1), bash is downwardly compatible with the commands of the Bourne
    shell (sh), created by Steve Bourne. However, it includes many useful features
    from other shells, such as the Kom (ksh) and C (csh) shells. Although you can
    set Linux to run a different shell, you should begin learning bash, which is by
    far the most widely used shell on Linux.


    # Understanding Shells


    A shell is a program that enables you to communicate with the heart of Linux,
    the kernel, by typing commands at the keyboard. For this reason, a shell is a
    command interpreter, very much like the MS-DOS program command.com. Unlike Unix
    shells are much more than command interpreters. They are full-fledged programming
    languages, which a knowledgeable user can employ to create customized and highly
    automated systems. Files can contain commands—such a file is known as a shell
    script—and these files can be kicked into action by startup programs, automatically
    scheduled'
  merge: -1
  pgno: 424
- img_proc: true
  md: '# CHAPTER 15 • USING THE SHELL AND FILE UTILITIES 395


    maintenance routines, and applications. To describe a shell''s complexity fully
    would require an entire book—or better, a series of books.


    Happily, most users won''t need to delve into the shell''s complexities. This
    chapter teaches the fundamentals of shell usage that every Linux user should know,
    and these fundamentals suffice for all but the most advanced system administration
    purposes.


    Many shells work with Linux, but most Linux distributions (including Red Hat Linux)
    install the bash shell by default. The bash shell represents a good compromise
    among the usability and programming features that distinguish the shells from
    one another (Greenfield 1996: 21–22).


    # Pointers for Shell Usage


    To use the shell, you type characters after the Linux prompt. Note the following:


    +   Shell commands are case-sensitive. The command Xconfigurator differs from
    xconfigurator.

    Shell commands have options, which are preceded by a hyphen (-). For example,
    you can use the -i (interactive) or -b (backup) options with the cp (copy) command.
    Some commands have dozens of options; in practice, you need to learn only two
    or three of them, on average. They''re discussed in this chapter, which you can
    use as a reference.

    You must carefully follow the syntax rules of each command, which specify the
    parts of the command are sequenced when you type them. For example, the cp command''s
    syntax requires you to type the command name followed by any options you use,
    the location and name of the source file, and the location and name of the destination
    file.'
