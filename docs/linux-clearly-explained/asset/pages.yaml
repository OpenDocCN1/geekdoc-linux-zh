- img_proc: true
  md: '# Mounting Disks and Filesystems


    To use the files on external storage devices, such as CD-ROM drives, ZIP drives,
    and floppy disks, you must mount them. This section introduces basic mounting
    concepts, shows you how to use the mount command, and concludes by showing you
    how to configure Linux to mount storage devices (and other external filesystems)
    automatically.


    > Tip By default, Linux requires that users have root access to mount external
    storage devices and filesystems. To work through the examples in this section,
    you should log on as the root user. For a single user system, it isn''t a security
    risk to allow regular users (such as your user account) to mount external storage
    devices and filesystems, so you should configure Linux to enable users to mount
    devices. You''ll learn how at the end of this section.


    # Understanding Mounting Concepts


    When you install Red Hat Linux, the installation software automatically configures
    your system to mount the various partitions on your hard drive automatically.
    As a result, the filesystems within these partitions become part of one larger,
    overarching filesystem. If you installed Red Hat Linux as Part II of this book
    suggested, you created a usr partition. It is joined to the rest of the filesystem
    at a mount point. The /usr filesystem is mounted at the root (/).


    As you''ve probably already realized, the various partitions on your hard drive
    are mounted automatically when Linux starts. That''s because Linux is following
    the instructions found in an important configuration file, called /etc/fstab.'
  merge: -1
  pgno: 466
- img_proc: true
  md: '# CHAPTER 16 • MASTERING SYSTEM ADMINISTRATION 437


    Here’s an example of what this file looks like (I’ve added headers to explain
    what the columns mean):


    | Device | Mount Point | File system | Settings |

    | :--- | :--- | :--- | :--- |

    | /dev/hda6 | / | ext2 | defaults |

    | /dev/hda7 | /home | ext2 | defaults |

    | /dev/hda8 | /usr | swap | defaults |

    | /dev/fd0 | /mnt/floppy | ext2 | noauto |

    | /dev/cdrom | /mnt/cdrom | iso9660 | noauto |


    Here’s an quick explanation of the settings in this file:


    +   - **Device** Instead of drive names, Linux refers to storage and other peripherals
    using device names (see Table 16.1 for a list of common storage device names).

    - **Mount Point** In this column, you see where the external storage device is
    mounted. For example, the /home partition is mounted at the root (/), while the
    CD-ROM drive is mounted at /mnt/cdrom.

    - **File System** Linux can work with many filesystems, including the native Linux
    system (ext2). Table 16.2 lists some of the filesystems that Linux can access.
    As you’ll see, Linux can directly access an amazing variety of filesystems.

    - **Settings** These settings determine whether Linux mounts the filesystem automatically
    at the beginning of a session, and they also determine other options. The default
    setting mounts the filesystem automatically. The noauto setting requires the user
    to mount the filesystem manually before using it. As you can see the floppy and
    CD-ROM drives must be mounted before you use them.


    Why does Linux require users to mount and unmount external disk drives manually?
    Simple: There might not be a disk in the drive. When you put in a disk, the mount
    command forces'
  merge: -1
  pgno: 467
- img_proc: true
  md: 'Linux to read the disk and add its files to the filesystem. For floppies, there''s
    an additional reason having to do with the disk caching system that Linux uses.
    If you were to remove a floppy disk from the disk drive without first unmounting
    it, the disk caching software might not have written changes to the disk, which
    would scramble its contents.


    # Table 16.1 Device names for storage peripherals


    | Device name | Description |

    |---|---|

    | /dev/fd0 | Floppy drive #1 |

    | /dev/fd1 | Floppy drive #2 |

    | /dev/cdrom | CD-ROM drive |


