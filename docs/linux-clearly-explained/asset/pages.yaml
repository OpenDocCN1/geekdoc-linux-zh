    start LinuxConf, click the Main Menu button, point to System, and choose LinuxConf.
    You will see LinuxConf onscreen (see Figure 16.1). In the left panel, you''ll
    see a tree diagram of the various services available. To work with users, scroll
    down to Users accounts, and click the + sign, if'
