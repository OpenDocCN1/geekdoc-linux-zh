    # Exploring Window Managers


    As you’ve already learned, window managers are just another client within the
    X Window System; like applications, window managers must ask the X server to redraw
    the screen and perform other operations. Because the client and server layers
    in X are completely independent, you can use any window manager, as long as it
    knows how to “talk” to the X server. The following sections explore some of the
    more popular window managers, including those provided with Red Hat Software’s
    Linux distributions.


