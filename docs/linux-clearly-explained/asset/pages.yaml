  md: '# Finding Out What’s in a File


    Thanks to GNOME’s ability to tell (in most cases) what kind of data a file contains,
    you can quickly view or listen to the contents of a file. GNOME will choose the
    file viewer that is associated by default with the type of data the file contains.
    To launch the default file viewer for a given type of file, just double-click
    the file’s icon or name.


    # Listening to Audio Files


    GNOME works with the EsounD daemon, which can play a wide variety of audio file
    formats (see Table 9.3 for a list of these formats). If a sound file is supported,
    you’ll know this fact because the File Manager will display the file using the
    Audio icon.


    > **NOTE** To enable sound within GNOME, you must install your sound card (see
    “Configuring Your Sound Card,” in Chapter 7), and you must also turn on GNOME
    by using the GNOME Control Panel (see “Enabling Sounds within GNOME,” in Chapter
    10).


    To listen to an audio file, just double-click the sound file’s icon or file name.
    The sound starts playing.


    To gain more control over sounds, you may prefer to play them with a sound player
    application. Included in your Red Hat 6.0 installation is Xms (formerly called
    X11 Amp), a sound player that looks like the popular WinAmp MP3 player (see Figure
    9.8). However, Xms can just play any type of sound file; it can even play CDs.You
    can play files one at a time, or create playlists that enable you to listen to
    hours of beautiful music while you’re working with your computer.'
  merge: -1
  pgno: 261
- img_proc: true
  md: 'Mmms fully implements the popular skins feature of the Windows application.
    This feature enables you to change the look of the player by downloading skin
    packages from the Internet (for more information, see http://www.xmms.org).


    > TIP To hear sound on your system, you must install sound support (see “Configuring
    Sound Card Support,” in Chapter 7), and you must also enable sound support within
    GNOME. To enable GNOME sound support, click the Main Menu button, point to Settings,
    and choose Multimedia. Click the General tab, if necessary, and activate GNOME
    sound support. Click OK to confirm.


    # Adjusting Sound Volume


    To adjust listening volume, you can make use of the Audio Mixer. This GNOME application
    (also called gmix), shown in Figure 9.9, enables you to adjust the sound volume
    from all the sound sources in your system, including sounds from sound files,
    audio CDs, a microphone, and the sound card''s line input. You can adjust the
    stereo balance, mute sources selectively, and adjust the tone.


    ![](img/21d32b84086223524c8766042726779d_262_0.png)


    Figure 9.8 Mmms is a sound player for many types of sounds.'
  merge: -1
  pgno: 262
- img_proc: true
  md: '# CHAPTER 9 • MANAGING FILES 233


    ![](img/21d32b84086223524c8766042726779d_263_0.png)


    Figure 9.9 You can combine sound inputs with the Audio Mixer.


    To use Audio Mixer, click the Main Menu icon, point to Multimedia, and choose
    Audio Mixer.


    # Are MP3s illegal?


    Contrary to what you may have heard, the MP3 file format is not illegal. The notoriety
    of MP3s lies in the fact that thousands of MP3 recordings of copyrighted music
    are available for downloading on the Internet. Too many Internet users seem to
    think there''s nothing wrong with making MP3 recordings of copyrighted music and
    distributing these recordings. It is illegal, not to mention unethical, whether
    to distribute or download any recording of copyrighted music, whether such recordings
    are in the MP3 or some other format. It is legal to make an MP3 recording, intended
    strictly for your own use on computer system, of a copyrighted CD that you''ve
    lawfully obtained and paid for? Such a recording would appear to be legal under
    the provisions of the U.S. Audio Home Recording Act (Title 17, chapter 10, of
    the U.S. Code), passed by both houses of Congress and signed into law by President
    Bush in October, 1992, as well as a 1984 U.S. Supreme Court decision that home
    videotaping does not constitute copyright infringement. Considering that audio
    CDs are expensive and highly vulnerable to damage due to scratches or heat exposure,
    consumers ought be able to exercise their lawful rights to make archival backup
    copies of recorded music that they have lawfully obtained. For more information,
    see the home page of the Home Rights Coalition (www.hrcc.org).'
  merge: -1
  pgno: 263
