  md: '# CHAPTER 2 • THE LINUX PHENOMENON 33


    code on the Internet and invited other programmers to modify and expand the code.
    Many were attracted to the project: by the end of the first year, 100 developers
    were working with Torvalds, and by the end of the second year, this number had
    grown to 1,000. Torvalds became the central communication point for this developing
    effort; programmers mailed buggy fixes, changes, and additions to Torvalds, who
    worked them into the kernel and re-released it to the growing community. Although
    Torvalds has since taken a job with a Silicon Valley firm, he remains the focus
    of Linux development efforts.


    # The Right Mix


    Torvalds distributes the Linux kernel by means of the General Public License (GPL)
    discussed in Chapter 1. As any result, one is free to obtain the Linux source
    code and make modifications; however, they must release the modified code and
    make this code available at no cost. In theory, there''s nothing to stop Microsoft
    from obtaining Linux, modifying the code, and releasing a version of the Linux
    operating system—they''d have to release the source code too.


    Although Torvalds chose to license Linux using GPL, he did not adopt the anticommercialism
    exhibited by some open source advocates. For example, he chose not to display
    hostility towards individuals and companies who attempt to make money from Linux
    by selling compilations of Linux software (such compilations, called distributions,
    are introduced in the next section). Torvalds''s moderation played a key role
    in winning converts to the Linux cause; programmers could easily engage themselves
    in Linux development without having to fear castigation were they to try to figure
    out some way to make money from their activities within the confines of GPL framework.'
