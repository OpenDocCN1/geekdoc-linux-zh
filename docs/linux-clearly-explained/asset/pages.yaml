    | 1984 | AT&T divestiture; AT&T free to compete in marketplace. |

    | 1991 | Linux Torvalds creates Linux kernel as part of a master’s thesis in Finland.
    |

    | 1992 | AT&T sues BSDI for copyright infringement, but sells UNIX to Novell;
