  md: '# Running Programs in the Background


    In Linux, a running program is called a process. Processes can run in the background,
    which means that you do not see any evidence of the running process on-screen
    (also called the foreground). Some programs are designed to run effectively in
    the background; for example, a file finding utility can compile a database of
    all the files on your system while running in the background, freeing you to run
    other programs in the foreground. In practice, you will rarely find it necessary
    to run programs in the background, but it''s wise to understand the essential
    concepts.


    # Initiating a Background Process


    To start a program and run it in the background, use the ampersand (&) operator.
    For example, the following command starts an e-mail program called Pine, and runs
    it in the background:


    ```

    #pine &

    ```


    You''ll see a confirmation, indicating the job number (in brackets) and the process
    ID (an identification number):


    ```

    [1] 650

    ```


    # Returning a Process to the Foreground


    To bring the program into the foreground again, you can use the fg command, followed
    by a space, a percentage sign, and the job number, as in the following example:


    ```

    #fg %1

    ```'
  merge: -1
  pgno: 447
- img_proc: true
  md: '> TIP If you have forgotten a background program''s job number, you can see
    a list of current job numbers by typing ps and pressing Enter.


    # Suspending a Process


    In addition to running programs in the background, you can also suspend a running
    program so that you can do something else, and later return to the program where
    you left off. To suspend a running program, press Ctrl + z. For example, suppose
    you are running less to read a lengthy text file, but you would like to pause
    and do something else at the prompt. Press Ctrl + z within less to suspend the
    program.


    # Viewing a List of Processes


    To see which programs are running in the background, you can use the ps command.
    If you type ps and press Enter, you''ll see a list like the following:


    | PID TTY S TIME COMMAND |

    | 484 1 S 0:00 -bash |

    | 485 1 T 0:00 pine |

    | 486 1 R 0:00 ps |


    In the first column, you see the process ID (PID), a unique number that bash assigns
    to all running processes (including itself). The TTY column indicates which virtual
    console controls the process. In the STAT column, you see one of the following:


    +   * A runnable process

    * A sleeping (paused) process

    * A stopped (suspended) process

    * A zombie (crashed) process'
