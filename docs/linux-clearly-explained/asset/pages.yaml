  md: '# Choosing a View


    In the directory window, you may choose from the following views:


    +   - Icons This is the default view (see Figure 9.2). You see icons representing
    files and directories. Data files look like documents; in many cases File Manager
    can tell what type of data the file contains, and the data type is indicated in
    a small black text box superimposed on the icon. Compressed files and tar archives
    show up like a cardboard box stuffed with items, while RPM packages appear with
