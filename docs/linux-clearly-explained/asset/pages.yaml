    the process.


    When you see the prompt “New UNIX password,” type the password, and press Enter.
    You''ll see a message confirming that the authentication tokens have been updated
    successfully.


    > TIP If you''ve forgotten how to spell a command name (“Is password or password?),
    type the part of the command you know, and then press Tab. You''ll see a list
