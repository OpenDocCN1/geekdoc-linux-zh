    +   3. Type the full path name of the directory to which you would like to copy
    the files, and click OK.


    # Moving Directories


    You can move an entire directory, but please note that you should avoid doing
    so unless you are certain you know what you are doing. For example, suppose you
    have created subdirectories for your data files. You can safely move one of these
    subdirectories, as long as they contain no automatically configuration files required
    by an application. Never move a directory that contains one or more files beginning
    with a period.


    To move a directory, follow these steps:


    +   1. Click Left or Right on the menu bar, and choose Tree.'
