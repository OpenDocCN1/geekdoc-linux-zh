    # # AbiWord


    If you’re like most people who use word processing software, you probably work
    with Microsoft Word files—and not necessarily because you want to. You just don’t
    have any choice. Your coworkers use Word, so you must use Word when you work collaboratively.
    Perhaps you’re working for a publisher that requires Word files. You’d love to
    make the transition to Linux, but you can’t work effectively without a program
    that can read and write Word files and support the major Word features, such as
    styles.


    A pre-release (0.71) version of AbiWord (http://www.abisuite.com) looks very much
    like it might solve this problem for Linux users. Capable of reading Word 97 as
    well as RTF (Rich Text Format) files, AbiWord won’t equal Microsoft Word in feature
    richness, but it will offer most of the features that Word users actually use,
    including multiple columns. Released on open source principles (AbiWord is licensed
    with GPL), the program will be available for Windows and Mac systems as well as
    Linux.


