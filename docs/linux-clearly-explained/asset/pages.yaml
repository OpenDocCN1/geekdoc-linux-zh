  md: '# CHAPTER 1 • THE UNIX HERITAGE 19


    The Unix design philosophy contrasts sharply with Microsoft’s recent efforts to
    incorporate more features into the inner workings of its operating systems. In
    Windows 98, for example, the shell is irretrievably tied to the kernel and file
    system—users have no choice of shells—and the company bent on incorporating applications
    as well, such as the Internet Explorer web browser.


    Viewed from the perspective of Unix design philosophy, Microsoft’s strategy embodies
    a serious and potentially fatal technical design mistake. Trying to weave so many
    components into the operating system could lead to a bloated, unstable, bug-ridden
    monstrosity that can’t be delivered on time and on budget (like Multics).


    According to Microsoft’s critics (among them the U.S. Department of Justice),
    Microsoft has pursued this approach, not on its technical merits, but rather in
    the hope of putting competitors out of business. In response, Microsoft argues
    that its customers want features such as browsers to be included as tightly integrated
    components of the operating system. Unix, in contrast, goes to the other extreme,
    giving users almost total freedom to define their operating environment—so much
    freedom that there is less consistency from one Unix workstation to the next than
    one finds in the Windows or Macintosh worlds.


    # The Achievements of Unix


    Simply put, Unix defines what a high-quality operating system should do. One by
    one, competing systems (such as Microsoft Windows) have been upgraded so that
    they match a feature set that Unix achieved more than a decade ago. These features
    include the following:


    +   * Multitasking Unix can run two or more programs at the same time. When running,
    these programs are called'
  merge: -1
  pgno: 49
- img_proc: true
  md: 'processes. They can communicate with each other. processes, called daemons,
    are configured to run regularly, or at regular times.


    +   - Preemptive multitasking Unix controls multitasking processes so that an
    abnormal process can be terminated (“killed”) without crashing the computer.


    +   - Symmetric multiprocessing Unix can work with computers that have more than
    one users using one unit (CPU).


    +   - Time-sharing Two more users can use the system independently, with each
    of them having the illusion of being the sole users of the system.


    +   - Virtual memory By using part of the computer’s hard disk, Unix can make
    the computer’s RAM memory larger than it. The portion of disk space used for this
    purpose is called the swap file.


    +   - Built-in TCP/IP and Ethernet support Unix supports the Internet protocols
    (TCP/IP) and Ethernet networking at the operating system level, making the system
    ideal for Internet and local area network (LAN) use.


    +   - Portability Because Unix is written mostly in C, a high-level programming
    language, it can be easily ported (translated) to many computer platforms. Today,
    Unix runs on more different types of computers than any other operating system.


    # The Shortcomings of Unix


    Despite the technical achievements of Unix, the system’s design philosophy pushes
    the shell out of the operating system property. This design philosophy makes good
    technical sense, and as you’ll learn in the next chapter, it opens up important
    possibilities for shell configuration that stretch most people’s understanding
    of what a user interface is about.'
