  md: '# CHAPTER 10 • PERSONALIZING GNOME 295


    on-screen the next time you log in to your account. This capability is called
    session management. As this section explains, session management applies only
    to GNOME-compatible applications. If you would like other programs to start automatically
    when you log in to your account, you need to identify these programs using the
    Session Manager, one of the options in the GNOME Control Center.


    # Understanding Session Management


    Session management is convenient because it enables you to resume working where
    you left off, with all the open GNOME-compatible applications restored to their
    on-screen positions. However, it''s important to understand that GNOME does not
    save the data you''ve created with these applications. Before you exit your GNOME
    session, be sure to save the data you''ve created with these applications.


    # Choosing Session Management Options


    You can choose from the following session management options:


    +   - Prompt on Logout: This option asks whether you''d like to save the current
    session when you log out. (This option is enabled by default.)

    - Automatically save changes to session: This option automatically saves your
    GNOME session. Although it is not enabled by default, I recommend that you enable
    it.


    To modify these options, click the GNOME Configuration tool icon, select Session
    Manager, and click the options you want (see Figure 10.14). Click OK to confirm.'
