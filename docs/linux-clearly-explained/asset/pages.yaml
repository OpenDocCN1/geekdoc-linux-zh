  md: '# Using Plug-Ins


    Helper applications display data in a separate window. In contrast, plug-ins enable
    Netscape Navigator to display certain types of data inline—that is, within the
    Web page. Hundreds of plug-ins exist for the Windows and Macintosh versions of
    Netscape Navigator, but only a handful are available for Linux. Worse, installing
    them isn''t easy; unless the plug-in is available in an RPM file that''s expressly
    designed for Red Hat Linux, you will need the command-line skills introduced in
    Part Five of this book.


    Here''s a sample of what''s available:


    +   * **Adobe Acrobat Reader** (Adobe, www.adobe.com) displays Portable Document
    Format (PDF) files within pages.

    * **Plugger** (Fredrik Hübinette, fredik.hubbe.net/blogger.html) Organizes sound
    and video helper applications so that they play inline. Note: The glibc2 RPM version
    available at this writing installs the needed file, called plug.so, in an incorrect
    location (/usr/ local/lib/netscape/plugins/); copy this file to the .netscape
    directory within your home directory. You''ll also need to configure Plugger to
    work with the various sound and video applications on your system; in order to
    do this, you''ll need to switch to root user and edit the file etc/pluggerrc.
    Examine the file carefully to see where it mentions specific applications, and
    replace these application names with the ones installed on your system. Not for
    the faint of heart!

    * **Macromedia Shockwave** (Macromedia, www.macromedia.com) Plays Shockwave animations.'
  merge: -1
