  md: '# 13


    # Connecting with PPP


    In this chapter, you''ll learn how to connect your Linux system to the Internet
    by means of a modem, a telephone line, the Port-to-Port Protocol (PPP) communication
    standard, and an Internet subscription with an Internet service provider (ISP).
    Although it''s possible to connect to ISPs that still use the older Serial Line
    Interface Protocol (SLIP), it''s much more difficult to configure Linux to use
    SLIP, which isn''t recommended for beginners. Almost all ISPs use PPP nowadays—and
    if your ISP doesn''t, consider switching to one that offers more modern technology.
    (If you''re hoping to connect via cutting-edge technologies such as ISDN, ADSL,
    or a cable modem, see “Using Other Connection Methods,” at the end of this chapter.)'
  merge: -1
  pgno: 379
- img_proc: true
  md: 'Thanks to user-friendly utilities such as netcfg (discussed in this chapter),
    this chapter’s tasks are much easier to perform than they were in the past, but
    there’s still a chance you’ll run into problems—particularly if you’re using unsupported
    equipment. You’ll be wise to stop right now if your modem isn’t on the list of
    supported peripherals (see Chapter 3). In particular, you can’t use any modem
    that uses software to emulate compression (such as any modem described as a “win-modem”).
    Rather than spending days trying to get an unsupported modem to work, wouldn''t
    it be smarter to spend $59 on one that will work instantly?


    There’s more to success here than electronics, though. To connect successfully,
    you’ll need to follow this chapter’s instructions carefully. In particular, you
    need all the information discussed in the next section. To obtain it, you’ll need
    to speak to your ISP’s technical support representatives. When you do, you might
    want to think twice before mentioning that you’re trying to connect with a Linux
    system. You’ll probably be told, rather icy, “We don’t support Linux,” and that’s
    that. Instead, focus on getting your specific questions answered (see the next
    section for a detailed list). Once you’ve obtained this information, you’ll be
    connected—and surfing—in short order.


    > TIP If your computer connects to a local network (LAN) by means of a network
    interface card, you may already have an Internet connection. Check with your network
    administrator to find out whether Internet access is available through your LAN.


    # Getting the Information You’ll Need


    To connect your Linux system to the Internet, you’ll need the information about
    your modem listed in Table 3.1, in Chapter 4. You’ll also need the following information
    from your ISP:'
  merge: -1
  pgno: 380
- img_proc: true
  md: '# CHAPTER 13 CONNECTING WITH PPP 351


    +   **Telephone number** What number do you dial to reach your Internet service
    provider (ISP)?


    +   **Authentication information** When you connect to your ISP''s computer, what
    user name do you supply? What is your password?


    +   **IP address** Does your ISP assign a static (fixed) IP address to your computer?
    If so, what is this address? Most ISP''s use dynamic addressing, but check to
    make sure. In dynamic addressing, your ISP assigns a temporary IP number to your
    computer automatically.


    +   **DNS numbers** What are the IP addresses of the primary and secondary DNS
    servers?


    +   **Password authentication** Must you use a password authentication protocol
    when you log in, such as PAP or CHAP? Or is the initial login accomplished in
    plain text?


    +   **Login procedure** Exactly what prompts are presented when your computer
    makes a connection, and what must you type to log in?


    +   **PPP connection startup** Does the PPP connection start automatically after
    you have supplied your user name and password, or do you have to type a command?
    If so, what is the command?


    +   **Mail server** What is the Internet address of the server used for incoming
    mail (also called the POP server or POP3 server)? What is the Internet address
    of the server used for outgoing mail (also called the SMTP server)? Sometimes
    the incoming and outgoing mail servers have the same address; sometimes they''re
    different.


    +   **E-mail information** What is your e-mail address? What is the password you
    use to access your e-mail?


    +   **News server** What is the Internet address of the news server? Is it necessary
    to supply a user name and password to access the news server? If so, what are
    these?'
  merge: -1
  pgno: 381
- img_proc: true
  md: '352 PART FOUR • GETTING CONNECTED TO THE INTERNET


    With all this information in hand when you begin, you''ll have a much better chance
    of connecting successfully. If you guess at any of these, chances are your connection
    will work.


    # Configuring Your Modem


    Provided you''re using a Linux-compatible modem (see Chapter 4), it''s a simple
    task to configure your modem to work with Linux. In this section, you use the
    Linux configuration utility (modtool) to perform an essential first step: Establishing
    the link between the Linux device name for your modem (/dev/modem) and the serial
    port to which your modem is connected. If this sounds difficult, relax: You need
    to know just one crucial bit of information, namely, the serial port to which
    your modem is connected.


    # Determining the Serial Port


    In the MS-DOS and Windows world, serial ports are described as COM1, COM2, COM3,
    or COM4. Chances are good that your modem is connected to COM2, since many systems
    use COM1 for a mouse. In Chapter 3, you noted the COM port that your modem is
    currently using. In Table 13.1, you''ll learn the nomenclature that Linux uses
    to describe serial ports.


    Table 13.1 Serial port device names


    | MS-DOS | Port | IRQ | Linux Device name |

    |---|---|---||}{

    | COM1 | 0x3f8 | 4 | /dev/cua0 or /dev/tty00 |

    | COM2 | 0x2f8 | 3 | /dev/cua1 or /dev/tty01 |

    | COM3 | 0x3e8 | 4 | /dev/cua2 or /dev/tty02 |

    | COM4 | 0x2e8 | 3 | /dev/cua3 or /dev/tty03 |'
  merge: -1
