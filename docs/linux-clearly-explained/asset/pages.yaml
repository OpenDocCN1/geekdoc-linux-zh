    # Learning GNOME


    GNOME is easy to learn, but it''s important to remember that GNOME relies on the
    X Window System for application windowing services. Accordingly, you''ll be wise
    to spend a few minutes reading about some of the peculiarities of using the X
    Window System, as explained in the next section.


    # Using the X Window System


    No matter which window manager and desktop system you''re using, X imposes some
    common user interface features. If you''re used to Mac OS or Microsoft Windows,
    some of these require that you learn some new concepts.


    # Understanding the Input Focus


    To do anything in an on-screen window, you must first move the focus to this window.
    When you''ve moved the focus to the window, it becomes active, and you can type
    within it. With most window managers, simply moving the mouse pointer within the
    window is sufficient to move the focus to the window, but sometimes you must click
    within the window. You''ll learn this concept quickly enough, but it can be frustrating
    at first; start typing in a text box, and nothing happens. There''s nothing wrong.
    You just haven''t moved the pointer within the window.'
  merge: -1
