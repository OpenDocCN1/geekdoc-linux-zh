    optional contact information) that Messenger will add automatically to your outgoing
    messages. To do so, click the Main Menu button, point to Applications, and choose
    gEdit. Type your signature information, and then click Save. Save the file using
    name .signature (the dot in front of the filename), and place this file in the
    top-level directory of your home directory.


