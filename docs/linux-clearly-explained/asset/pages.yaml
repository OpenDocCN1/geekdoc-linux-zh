  md: '# A Brief History of Linux


    The story has all the makings of a legend—and it’s getting plenty of press (for
    example, Eisenberg 1998, Levy 1998), including a write-up in Economist, a periodical
    not noted for indulgence in fads. But then again, Linux''s installed user base
    grew in 1998 at a 212% annual clip (Shankland 1998)—and those are precisely the
    kind of numbers that transformed the Internet from an obscure university and military
    network into the world''s newest mass medium.


    # A "Real" Operating System


    1991, Linus Torvalds, a computer science student at the University of Helsinki,
    Finland, bought a new computer—a PC powered by an Intel 386 processor—but didn’t
    think much of the operating system that came with the machine (MSDOS). Rather
    than working around the bugs in MS-DOS, Torvalds decided that he’d run a real
    operating system (in other words, Unix).


    What appealed to Torvalds about Unix was its philosophy, and 25 years of history,
    and the reliability of its core (kernel). Unlike the patched-together operating
    systems for personal computers, Unix exhibits an architectural design that struck
    Torvalds as not only the right way to create an operating system, but deeply pleasing
    in an aesthetic sense. For Torvalds, nothing less would do for his new machine.


    # A Benevolent Dictatorship


    Using his own code, the brilliant young programmer began work in earnest. But
    he didn’t start entirely from scratch. A key inspiration was Minix, a small Unix-like
    system for Intel CPUs created by Andy Tanenbaum. Torvalds posted the source'
