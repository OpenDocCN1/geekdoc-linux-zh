  md: '# Linux and Year 2000 (Y2K) Issues


    The Year 2000 (Y2K) problem dates from the early days of computing, when computer
    hardware designers and programmers reserved only two digits for storing dates.
    As a result, many computers, operating systems, and applications will not be able
    to distinguish between the year 2000 and the year 1900. This problem could cause
    havoc; imagine receiving a bill from your electrical company, for example, informing
    you that your bill is 100 years overdue and assessing a $688,000 penalty!


    Like any Unix-like operating system, Linux is a good bet if you''re worried about
    Year 2000 issues. In general, Unix systems track dates by using programming libraries
    that store dates as 32-bit integers. For Unix, time begins on January 1, 1970,
    and each subsequent second gets its own integer. There is enough to count all
    the seconds until the year 2038. Before that time, the operating system will have
    to be rewritten so that there are 64 bits reserved for date storage.


    > TIP Even though Linux can handle the year 2000, this doesn''t necessarily mean
    that Linux applications are Y2K-compliant. Check your application''s documentation
    or Web site for information on Y2K issues pertinent to the software you''re using.


