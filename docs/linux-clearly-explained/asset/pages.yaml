  md: '# Running Disk Druid


    Disk Druid, part of the installation software you’re using, is an easy-to-use
    program that enables you to partition your hard drive with ease. Before Disk Druid
    appears, you’ll see a dialog box asking which partitioning tool you want to use.
    You can choose between Red Hat’s Disk Druid or the older Linux fdisk program.
    You want Disk Druid.


    > > Don''t choose fdisk. This older Linux program requires advanced technical
    knowledge of disk partitioning. Particularly if you’re trying to create a two-OS
    system, choosing fdisk could leave you with an unbootable system.


    Select Disk Druid, and you’ll see the Disk Druid window shown in Figure 5.5. Essentially,
    Disk Druid is a tool that enables you to add, edit, or delete partitions for your
    Linux installation. You create the partition structure interactively; you can
    make changes and get thing just right before the software actually writes the
