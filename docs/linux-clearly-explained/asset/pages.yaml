  md: '# Introduction


    Welcome to Linux Clearly Explained, your guide to mastery of Red Hat Linux 6.0.
    In the pages to follow, you''ll find every-thing you need to join the ranks of
    Linux converts, including a CD-ROM disc containing Red Hat Linux 6.0. As you''ll
    learn in this book, this CD-ROM contains everything you need to get started with
    Linux, including GNOME, the beautiful new desktop system that finally makes Linux
    easy to use. What''s more, you''ll find a free evaluation copy of Corel WordPerfect
    8.0 for Linux. Able to read and write Microsoft Word files, WordPerfect is a full-featured
    word processing program that runs beautifully in the Linux environment. In fact,
    this book’s CD-ROM contains just about all the software that the average person
    needs to perform the computing tasks they do most'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'xviii


    INTRODUCTION


    often. And this book shows you how to install this software

    and keep it humming.


    # # What’s the Goal of This Book?


    Simple: To show you how to break your dependence on

    Microsoft Windows.


    Until now, Linux has had its greatest success as an alternative

    to Windows NT, Microsoft’s enterprise operating system,

    thanks to Linux’s built-in networking capabilities. Thanks to

    the GNOME desktop (shown below), Linux is now poised to

    make serious inroads into the desktop operating system mar-

    ket as well.


    ![](img/21d32b84086223524c8766042726779d_18_0.png)


    The GNOME desktop combines the best of Mac OS and Windows.'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# INTRODUCTION


    xix


    This book shows you how to create a Red Hat Linux 6.0 system right now that may
    take care of all of your computing needs. If you''re like most PC users, you use
    your system for word processing, and you may occasionally run a few other productivity
    applications. You connect to the Internet by means of a dial-up modem connection;
    while you''re online, you use e-mail, you browse the Web, and you chat with computer
    users with such as Internet Relay Chat (IRC) or “buddy list” systems such as ICQ.


    By reading this book, you can create a Linux system that includes all of these
    computer uses. The software is outstanding. It''s so efficient that it will make
    an older PC run as fast as the latest, priciest Windows systems.) The interface
    is elegant, a joy to use, and very cool. And the price is: Free.


    # Stop Paying for Software!


    Think about the money you''ve plowed into pricey, commercial programs that are
    full of work-destroying bugs. As you discover Linux, you''ll be pleased to discover
    a world of free programs that often exceed the quality of commercial offers. And
    all the while, you''ll be saving money. This book could pay off handsomely, should
    you succeed in breaking your Windows habit!


    # Why All the Excitement About Linux?


    Linux is an operating system for computers—notably, IBM PC-compatible computers
    that use Intel processors. Linux is also available for Power PCs and certain other
    computers, but it''s the IBM PC/Intel version is the one that''s causing all fuss.)
    a version of the powerful Unix operating systems that have powered much larger
    computers for years. It''s exceptionally well programmed and remarkably free from
    system-freezing bugs. Although Linux is copyrighted, it is distributed under'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'the terms of a license that enables anyone to distribute the software freely,
    provided that they include the underlying source code and a copy of the license
    itself.


    # Free Software: Worth Only What You Pay?


    Not necessarily, as millions of Linux users will readily agree. With built-in
    support for networking, Internet access, multiple users, and industrial-strength
    security, Linux rivals and even surpass Microsoft Corporations flagship operating
    system, Windows NT. What''s more, many people are tired of forking over so much
    money to Microsoft every time a new version of the Windows operating system appears.
    The constant cycle of upgrades forces people to purchase ever-more-powerful computers,
    and they must upgrade their applications, too.


    # The Goal: World Domination


    As mentioned, Linux has already made significant inroads into the NT market; Linux
    is winning acclaim as a server operating system for networks large and small.
    (A server is a computer configured to dish out information to other computers,
    on demand.) However, Linux is just starting its assault on the much larger user
    market, currently dominated by Microsoft Windows 98. The reason is simply that,
    until recently, Linux was just too hard to learn and use.


    Thanks to the GNOME desktop, that''s no longer true. When you install this book''s
    CD-ROM and restart your system, you''ll be treated to an easy-to-use interface
    that disguises the underlying complexity of Linux. If you''ve already learned
    Mac OS or Microsoft Windows, you can use the skills you''ve already learned, and
    you''ll be up and running in no time at all.'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Who Should Read This Book?


    This book is for anyone who has previously used a Macintosh or Windows system,
    and would like to try using Linux.


    You don’t have to make a major investment here; as this book explains, Linux is
    so efficient that it can bring a used 486 computer back to life. If you have a
    relatively large hard disk (say, 8GB or more), you can install Linux within the
    free space remaining on your hard disk. At start-up, you can choose whether to
    run Linux or Microsoft Windows. There''s little to lose here; if you try Linux
    and decide it''s not for you, the 486 can go back in the closet, or you can reformat
    the Linux part of your disk so it''s useful to Windows again. But I''ll bet you
    keep Linux around.


    # What’s So Special about This Book?


    GNOME makes Linux easier to use, but GNOME’s pretty face cannot hide all of the
    underlying complexities of Linux. Some of Linux’s underlying quirks show up in
    GNOME, too. GNOME looks a lot like Mac OS or Windows, but you’ll need to understand
    some fundamental Linux concepts in order to use GNOME productively. A book that
    tells you little more than where to click within GNOME won’t help you understand
    Linux fully, and you won’t know what to do when you encounter GNOME’s limits.


    Linux Clearly Explained teaches the concepts as well as the procedures of Linux
    usage. After you’ve read this book, you’ll possess the understanding that will
    enable you to make the most of GNOME.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Which Version of Linux Does This Book Cover?


    This book focuses squarely on Red Hat Linux 6.0, the version of Linux you''ll
    find on the included CD-ROM.


    Although this book may prove of value to users of earlier Red Hat versions, and
    of other versions of Linux, I do not attempt to discuss the differences between
    these various "flavors" of Linux. It''s not that I hold the other versions in
    low regard; rather, I want to get you up and running with a powerful, useful Linux
    system. It makes good sense, to focus on the software that''s included in this
    book''s CD-ROM. If you''ve messed about with other Linux versions unsuccessfully,
    install this book''s software, and learn Red Hat Linux 6.0. Once you''ve mastered
    the fundamentals of Linux and GNOME usage, you won''t have any trouble switching
    to a different version of Linux, should you be so inclined.


    # How This Book Is Organized


    Unlike most of the Linux books on the market, this book was written from scratch
    to teach the concepts and usage of Red Hat Linux 6.0, which defaults to the GNOME
    desktop. Accordingly, it''s organized to do the best possible job of getting you
    up and running with Red Hat Linux 6.0. What''s more, this book is written from
    a "Mac-and-Windows-up" perspective, rather than a "Unix-down" perspective. I will
    not drag you through dozens of outmoded Linux commands just because doing so is
    "good for you." If you can accomplish something the easy way, that''s the way
    you learn.


    # Part I: Introducing Linux


    To grasp Linux and use it well, it''s important to understand Linux''s background.
    In these three chapters, you''ll learn how'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# INTRODUCTION


    to put Linux into perspective. Chapter 1 introduces the Unix family of operating
    systems, and explains why Unix has dominated in every computer market except personal
    computers. In Chapter 2, you''ll learn how Linux came to be, thanks to the efforts
    of a young Finnish programmer named Linux Torvalds. Chapter 3 chronicles the struggle,
    culminating in GNOME, to make Linux easy to use.


    # Part II: Installing Red Hat Linux 6.0


    Contrary to what you''ve heard, Linux isn’t much more difficult to install than
    other operating systems, and that ever true when you''re talking about Red Hat
    Linux 6.0. Still, it''s nice to have a guide. In Chapter 4, you''ll learn how
    to perform a system inventory, so you''ll know how your system is suitable for
    Red Hat Linux (and how you should answer questions that come up when the installation
    is underway). In Chapter 5, you''ll get started with the installation, and in
    Chapter 6, you complete it. At the end of Part II, you''ll restart your system,
    and you''ll see for yourself just how impressive Red Hat Linux 6.0 and GNOME look
    on-screen.


    # Part III: Running GNOME


    Other Linux books get to GNOME toward the end of the book, in keeping with long-standing
    Linux prejudices that the command-line (text) interface is “good for you.” It’s
    time to put such notions aside. In Part III, you''ll learn how to make full use
    of GNOME for virtually everything you''ll do with your computer.


    Chapter 7 shows you how to configure your system so that you can use it safely;
    you’ll learn how to set up a user account for yourself, and why it’s so dangerous
    to run Linux as the root user. (Don’t worry if these concepts don’t mean much'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'right now; they’re easy to learn.) You’ll learn how to get GNOME’s beautiful
    sound system running.


    In Chapter 8, you explore the GNOME desktop, which combines the best features
    of Mac OS and Microsoft Windows. You''ll learn about some underlying quirky characteristics
    of Linux that could give you fits if you didn''t understand them. By the time
    you''ve finished Chapter 8, you''ll learn how to work around these quirks and
    you''ll quickly gain confidence in the GNOME desktop environment.


    Chapter 9 introduces the GNOME File Manager (also called GNU Midnight Commander,
    or GMC), which the first time—enables Linux users to manage files without having
    to learn complex commands.


    Chapter 10 shows you how to personalize GNOME, creating an interface that’s alive
    with your aesthetic sensibilities. And in Chapter 11, you’ll learn how to run
    applications with GNOME, including WordPerfect 8.0 for Linux, which is included
    on this book’s CD-ROM. Chapter 12 shows you how to use GNOME utilities to perform
    basic system administration tasks, such as formatting disks and checking the amount
    of free disk space.


    # Part IV: Getting Connected to the Internet


    Now that you’ve mastered the fundamentals of GNOME, it’s time to get connected
    to the Internet. Chapter 13 shows you how to create a dialup modem connection
    to your Internet service provider (ISP). In Chapter 14, you’ll explore the world
    of Internet applications for Linux, including Netscape Communication (included
    with this book’s CD-ROM) and the new GNOME Internet utilities.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Part V: Learning Command Prompt Essentials


    As you’ve learned, the complexity of Linux lurks beneath GNOME’s good-looking
    exterior. And sometimes, it makes good sense to leave GNOME aside and go mano-a-mano
    with the Linux command-line interface. Some jobs are actually accomplished more
    easily at the Linux prompt, a symbol that tells you that Linux is waiting for
    you to type something. And there’s no other way to install new software than follow
    the instructions detailing what to type at the command prompt. Accordingly, Part
    V teaches the fundamentals of command prompt usage.


    In Chapter 15, you’ll learn how to use the default Red Hat shell, the program
    that provides a text-based interface to Linux. You’ll also learn how to use the
    file utilities with Red Hat Linux. You don’t have to memorize the information
    in this chapter, but it may come in very handy for inference purposes.


    In Chapter 16, you’ll learn how to perform system administration tasks with the
    command prompt interface. As you’ll learn, there are still certain operations
    that can only be performed using the command-prompt approach, whereas others are
    more conveniently performed at the command prompt.


    Chapter 17 fully teaches the use of Midnight Commander, the text-based version
    of the GNOME File Manager. With more features than the GNOME version, Midnight
    Commander is the utility of choice for quick, effective system administration.
    With Midnight Commander, you can safely perform powerful system maintenance operations
    and increase your understanding of Linux.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# What’s On the CD-ROM?


    This book’s CD-ROM includes Red Hat Linux 6.0 and Word-Perfect 8.0 for Linux.
    In this section, you’ll learn how to install this software on your computer.


    # Installing Red Hat Linux 6.0


    To install Red Hat 6.0 on your system using this book’s CD, please follow the
    instructions in Chapters 4, 5, and 6.


    # Installing WordPerfect 8.0 for Linux


    After you’ve installed Red Hat Linux 6.0, you can install WordPerfect for Linux
    8.0. I’d suggest that you work through Chapters 7 through 9 before you attempt
    to install WordPerfect-fect.


    > CAUTION Do not install WordPerfect for Linux 8.0 in the root directory (/).
    Doing so could create a security hole that intruders could exploit. Please install
