  md: '# Selecting Files and Directories


    To perform actions on files and directories, you begin by selecting them. You
    can use these techniques in any of File Manager’s views (Icons, Brief, Detailed,
    or Custom).


    Here’s a quick rundown on the techniques you can use to select files and directories:


    +   - Selecting a single file or directory. Point to the name or icon and click
    the left mouse button.

    - Selecting a group of files or directories. Click just outside the first file
    or directory that you want to select, hold down the mouse button, and drag. You’ll
    see a “rubber band” selection rectangle. Adjust the rectangle’s size until you’ve
    selected all the files or directories you want, and release the mouse button.

    - Selecting two or more files or directories that aren’t in a group. If you need
    to select two or more files or directories that aren’t located close together,
    hold down the Ctrl key and left-click the names or icons of the files or directories
    that you want to select.

    - Selecting a group of files or directories in a list. To select a group of files
    or directories in the Detailed or Custom list, select the first file or directory
    name in the list. Then move the mouse pointer to the last file or directory name,
    hold down the Shift key, and click the last file or directory name.

    - Selecting all the files or directories in the Directory View panel. Press Ctrl
    + A. You can also click Edit on the menu bar, and choose Select All.


    You can also select files using wildcards. To select all the files in a directory
    with the .jpg extension, for example, click Edit on the menu bar, and choose Select
    Files. You’ll see the Select'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'dialog box (see Figure 9.4). In the text box, type the pattern you want to
    match. For example, to match all the files you have the jpg extension, type *.jpg.
    Click OK to select the files.


    # Managing Files and Directories


    Once you''ve selected files, you can move or copy them with drag-and-drop, or
    you can use the Move or Copy dialog boxes. You can also delete and rename files
    and directories, and you can create new directories, as the following sections
    describe.


    # Moving and Copying with Drag-and-Drop


    Be aware that you cannot move or copy files if you do not have the correct file
    ownership. You can move or copy all you like within your home directory because
    you all the files this directory contains. For more information on basic file
    ownership concepts, see “Understanding File Ownership and Permissions,” later
    in this chapter.


    By default, File Manager moves files or directories when you use drag-and-drop.
    To copy files or directories with drag-and-drop, hold down the Shift key.


    ![](img/21d32b84086223524c8766042726779d_252_0.png)


    Figure 9.4 To select a group of files, type a matching pattern here.'
