    # WHAT DOES IT DO


    It creates a database from the regular expression rules that finds from the config
    files. Once the database is created it is used to check the integrity of the files.
    It uses several message digest algorithm that are used to check the integrity
    of the file, and they can detect the version of files.


    # FEATURES


    - supported message digest algorithms: md5, sha1, rmd160, tiger, crc32, sha256,
    sha512, whirlpool (additionally with libmhash: gost, haval, crc32b)

    - supported file attributes: File type, Permissions, Inode, Uid, id, Link name,
    Size, Block count, Number of links, Mtime, Ctime and Atime

    - support for Posix ACL, SELinux, XAttrs and Extended file system attributes if
    support is compiled in

    - plain text configuration files and database for simplicity

    - powerful regular expression support to selectively include or exclude files
    and directories to be monitored

    - gzip database compression if zlib support is compiled in

    - stand alone static binary for easy client/server monitoring configurations


    # SETTING AIDE IN CENTOS


    ### STEP 1


    give the server a static ip address. centos server ip address:


    ```

    IP:192.168.0.100

    SUBNET MASK:255.255.255.0

    GATEWAY:192.168.0.1

    DNS:8.8.8.8

    ```


    your ip address can be different.


    ### STEP 2


    update the repository of the centos

    =>yum update


    ### STEP 3


    install the epel-release


    # UBUNTU $ CENTOS ADMINISTRATOR


    =>yum install epel-release -y


    =>yum update


    ### STEP 4


    install the aide package


    => yum install aide -y


    ### STEP 5


    Create the database

    =>aide -init


    [This may take some time]


    ### STEP 6


    Once the database is created you can move and rename it like the original one
    to make it work


    =>mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz


    # TESTING THE APPLICATION


    ### STEP 7


    For Testing we make a binary file inside the /usr/sbin/ directory


    =>touch /usr/bin/testbin


    ### STEP 8


    Check the database again


    =>aide -check


