    | 表头名称 | 描述 |

    |--- | --- |

    | us | 代表用户空间。它代表用户空间中的 CPU 活动。这些活动实际上是由用户名的不同命令启动的。 |

    | sy | 代表系统空间中的 CPU 活动。这些实际上是内核例程。它们通常代表守护进程（Daemons）执行工作。 |


    ni 表示处理低优先级进程所花费的时间 ni


    CPU 空闲。高值实际上显示系统未在执行任何操作 id


    它表示 CPU 等待输入（连接到系统的 I/O 硬件，如硬盘、键盘、鼠标）的时间 wa


    CPU 用于与硬件通信的时间 he。例如，如果你从闪存器读取数据，此时该值将较高 hi


    CPU 用于与软件通信的时间。通常情况下，它应该很低 si


    此参数表示虚拟化监视程序（Hypervisor）从虚拟机中窃取的时间。如果你的系统没有虚拟机，此值为 0


    **第四行：** 它显示 `free` 命令的确切输出（当前系统的内存统计）


    **第五行：** 这部分是 top 窗口的下半部分。它提供了关于 CPU 使用率最活跃的进程详细信息。


    | 表头名称 | 描述 |

    |--- |--- |

    | PID | 每个进程都有唯一的进程 ID（称为 PID），进程 ID 非常重要。例如，如果你想杀死一个进程，你需要提供该进程的进程 ID。 |

    | USER | 使用该进程的用户名。许多进程以 root 身份运行，因此你会经常看到它。 |


    PR 显示进程的优先级。这个数字表示进程何时再次获得 CPU 周期。值越低，优先级越高。优先级较高的进程将更早获得 CPU 周期，而低优先级进程将较晚获得
    CPU 周期。


    进程的 NICE 值。通过 NICE 值的帮助，我们可以更改进程的优先级 NI


    进程占用的内存总量 VIRT


    进程当前正在使用的内存大小 RES


    SHR 进程与其他进程共享的共享内存量


    +   S 显示进程的状态

    -''R'' 表示它正在运行

