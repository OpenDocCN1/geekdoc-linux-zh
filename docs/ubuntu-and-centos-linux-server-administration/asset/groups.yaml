    \ (m for help): w\nThe partition table has been altered!\nCalling ioctl() to re-read\
    \ partition table.\nSyncing disks.\n[root@server2 ~]# \n```\n[查看块设备]\n\n### 第\
    \ 10 步：对 'sdc' 和 'sdd' 重复第 8 步\n=>fdisk /dev/sdc\n=>fdisk /dev/sdd\n\n### 第 11\
    \ 步：使用 'lsblk' 检查\n=>lsblk\n\n```\n[root@localhost ~]# lsblk\nNAME MAJ:MIN RM\
    \ RO TYPE MOUNTPOINT\nsda 8:0 0 70G 0 disk\n├─sda1 8:1 0  1G 0 part /boot\n└─sda2\
    \ 8:2 0  69G 0 part\n  ├─centos-root 253:0 0  45G 0 lvm /\n  ├─centos-swap 253:1\
    \ 0  26G 0 lvm [SWAP]\n  └─centos-home 253:2 0  22G 0 lvm /home\nsdb 8:16 0  20G\
    \ 0 disk\n  └─sdb1 8:17 0  20G 0 part\nsdc 8:32 0  20G 0 disk\n  └─sdc1 8:33 0\
    \  20G 0 part\nsdd 8:48 0  20G 0 disk\n  └─sdd1 8:49 0  20G 0 part\nsr0 11:0 \
    \   1  4.3G 0 rom\n```\n\n### 第 12 步：创建 RAID 设备\n=>mdadm --create /dev/md0 --level=5\
    \ --raid-devices=3 /dev/sdb /dev/sdc /dev/sdd\n\n### 第 13 步：查看 RAID 详情\n=>mdadm\
    \ --detail /dev/md0\n\n### 第 14 步：格式化卷\n=>mkfs.ext4 /dev/md0\n\n### 第 15 步：挂载卷\n\
    =>mkdir /mnt/raid\n=>mount /dev/md0 /mnt/raid\n\n### 第 16 步：检查挂载的卷\n=>df -h\n\n"
