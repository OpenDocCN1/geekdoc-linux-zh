    \ 用于提取包\n\n**命令名：gzip**\n\n**描述：**\n对普通文件或存档进行压缩\n\n**语法：**\ngzip <file_name>\n\
    \n**命令名：gunzip**\n\n**描述：**\n用于解压缩压缩文件\n\n**语法：**\ngunzip <compressed_file>\n\n\
    **命令名：lsmod**\n\n**描述：**\n显示内核使用的模块列表\n\n**语法：**\nlsmod\n\n**命令名：rmmod**\n\n**描述：**\n\
