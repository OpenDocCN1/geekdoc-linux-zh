    ### ## htop


    大多数熟悉 Linux 的系统管理员都使用过 TOP 命令行工具来查看哪个进程占用了最多的 CPU 或内存。有一个名为 htop 的类似工具，对于普通任务来说用得多。它是交互式的、实时的，最重要的是它非常用户友好，你可以一眼看出
    CPU 利用率。


    但要使用 htop 工具，我们必须先安装它。因为默认情况下系统中没有安装。


    **在 Linux 中安装 htop 的步骤（使用不同的包管理器）：**


    # Ubuntu:


    ```

    => sudo apt install htop

    ```


