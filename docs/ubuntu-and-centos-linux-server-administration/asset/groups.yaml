    # Tanvir Rahman


    在两个不同的设备上使用电脑，因为它没有与电子邮件服务器同步。


    但这并不是 pop3 协议的邮件问题，主要问题在于当你从设备上通过 pop3 从邮件服务器下载邮件时，它将从邮件服务器上删除。服务器上不会保留邮件的副本。因此假设你有两台设备，一个是移动设备，另一个是带有相同电子邮件账户和
    pop3 协议的桌面电脑，如果你在移动设备上下载了邮件，那么你就无法在桌面电脑上下载相同的邮件，因为在你移动设备上下载邮件的那一刻，它就被从服务器上删除了。所以如果你使用多个设备来管理邮件，这就是
    pop3 的缺点。


    # IMAP


    IMAP 代表互联网消息访问协议（Internet message access protocols）。IMAP 比 pop3 复杂一点。它非常适合多设备管理邮件，因为它在邮件服务器上留下了缓存（本地副本）。它会同步文件夹结构及其每一个文件。因此，如果邮件客户端配置了
    IMAP，你将在用于访问的每台设备上看到相同的文件夹结构。但它也有一个缺点：如果你在其中一个设备上删除了任何邮件，为了保持同步，服务器和其他设备上的邮件也会被删除。如果你在文件夹结构中添加了文件夹，所有其他客户端也会执行操作。


    要设置协议，你需要更改邮件客户端的设置。例如，如果你想从邮件服务器使用 pop 或 imap，你需要在入邮件服务器设置中添加 "pop.example.com"
    或 "imap.gmail.com"。


    # IMAP VS POP3


    pop3 优点：


    - 1) 如果你只在一个设备上使用，pop3 更好

    - 2) pop3 保存邮件服务器的位置

    - 3) 节省互联网带宽，因为它只在有新邮件时才使用互联网


    pop3 缺点：


    - 1) 邮件没有备份

    - 2) 无法同时与多个客户端使用

    - 3) 由于整个文件和附件都被下载了，你的设备可能会被病毒感染


    IMAP 优点：


    - 1) 所有邮件都存储在邮件服务器上

    - 2) 你可以使用多个设备进行管理

    - 3) 同步


    IMAP 缺点：


    - 1) 没有网络连接时无法查看邮件


    # SMTP


    SMTP 是发送邮件的协议。而 pop3 和 IMAP 是接收邮件的。SMTP 是一组用于验证和传输你邮件的命令。当你从邮件客户端发送邮件时，它将通过 SMTP
    协议发送到邮件服务器。你的邮件服务器也称为 SMTP 服务器，例如 gmail (smtp.gmail.com)。然后你的 SMTP 服务器将再次通过 smtp
    协议将邮件发送接收者的 SMTP 服务器。然后你可以通过 pop3 或 IMAP 下载邮件，或者直接通过 WEBMAIL 从服务器上读取。


    SMTP 使用 TCP 协议，这是一种面向连接的协议。这意味着它能确保传输的可靠性。因此，如果由于某种原因邮件未送到目的地，你将收到相关通知。和 pop3
