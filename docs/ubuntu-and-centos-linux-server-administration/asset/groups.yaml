- md: "\nThat's the basic configuration of setting a squid proxy server in centos\
    \ 7.\n\n# NFS SERVER\n\n## WHAT IS NFS SERVER\n\nLinux provides a lot of different\
    \ tools for accessing file on other computer system. For sharing file with a Linux\
    \ based OS we actually use NFS (that includes Mac OS too because Mac OS is based\
    \ on the BSD Unix based system). and when we want to use share file between windows\
    \ and Linux we use SAMBA. NFS allows you to connect and directly access the resource\
    \ of other devices that resides on the other computer. The network information\
    \ service(NIS) maintains the configuration files for all the system on a network.\
    \ By using NFS you can mount a file system and work with it just like your computer\
    \ own system.\n\n## NFS DAEMONS\n\nNFS operates over a TCP/IP protocol..the remote\
    \ computer that holds the file system makes it available on the network. actually\
    \ done by exporting the file system .you have to make entry for that file system\
    \ in the '/etc/exports' and you have to run several daemons to support that access\
    \ The NFS daemons are the following:\n\n- rpc.bind : it takes NFS request from\
    \ the remote system and translate to the local system.\n- rpc.mountd : performs\
    \ the mount and unmount option\n- rpc.portmapper : Maps remote request to the\
    \ appropriate NFS daemon\n- rpc.quotad : provides user disk quote management\n\
    - rpc.statd : provides locking services when a remote host reboots\n- rpc.lockd\
    \ : Handles lock recovery for a system that gone down\n\n> [ It is recommended\
    \ to use the NFS server only in the local network if you use it over the internet\
    \ your system will be open for non secure access ]\n\n# SETTING NFS SERVER IN\
    \ CENTOS\n\n## SERVER SIDE CONFIGURATION\n\n### REQUIRIMENTS\n\n- CENTOS SERVER\n\
    - CENTOS CLIENT\n- SERVER IP ADDRESS: 192.168.0.7/24\n\n### STEP 1\n\nFirst install\
    \ the kernel modules in the centos system\n\n```\n=>yum update\n=> yum install\
    \ nfs-utils nfs-utils-lib -y\n```\n\n### STEP 2\n\nwe have to add the service\
    \ to the firewall\n\n```\n=> firewall-cmd -add-service=nfs -permanent\n=>firewall-cmd\
    \ -reload\n```\n\n### STEP 3\n\nEnable the nfs service at boot time\n\n```\n=>systemctl\
    \ enable nfs\n=>systemctl start nfs\n```\n\n### STEP 4\n\nCreate two directory\n\
    \n1) one for root in /var/lib/nfsroot\n2) one for public user in /var/lib/nfsspub\n\
    \n```\n=>mkdir -p /var/lib/nfsroot\n=>mkdir -p /var/lib/nfsspub\n```\n\n### STEP\
    \ 5\n\nGiving the permission to the public directory\n=>chmod 777 /var/lib/nfsspub\n\
    \n### STEP 6\n\nEdit the /etc/exports file for the file system share\n=>vim /etc/exports\n\
    \n```\n/var/lib/nfsroot 192.168.0.7/24(rw,sync,no_root,root_squash)\n/var/lib/nfspub\
    \ *(rw,sync,root_squash)\n```\n\n- * -> everyone can use it\n- rw -> writing power\n\
    - sync -> data will be synced in both side if the data is modified\n- root_squash\
    \ -> when logged in with it will logged as a user nobody:nobody\n\n### STEP 5\n\
    \napply the change\n=> exportfs -ra\n\n## CLIENT SIDE CONFIGURATION\n\n### STEP\
    \ 1\n\ninstall the necessary packages\n=>yum install nfs-utils nfs-utils-lib\n\
    \n### STEP 2\n\nmount the volume\n=> mount -t nfs 192.168.0.7:/var/lib/nfsspub\
    \ /mnt\nit will mount the public directory to the /mnt folder\n\n# SETTING NFS\
    \ SERVER IN UBUNTU\n\n## SERVER SIDE CONFIGURATION\n\n### REQUIRIMENTS\n\n- UBUNTU\
    \ SERVER\n- CENTOS CLIENT\n- SERVER IP ADDRESS: 192.168.0.7/24\n\n### STEP 1\n\
    \nFirst install the kernel modules in the ubuntu system\n\n```\n=>apt update\n\
    => apt install nfs-kernel-server\n```\n\n### STEP 2\n\nwe have to add the service\
    \ to the firewall\n=> ufw allow from 192.168.0.7/24 to any port nfs\n\n### STEP\
    \ 3\n\nEnable the nfs service at boot time\n=>systemctl enable nfs\n=>systemctl\
    \ start nfs\n\n### STEP 4\n\nCreate two directory\n1) one for root in /var/lib/nfsroot\n\
    2) one for public user in /var/lib/nfsspub\n=>mkdir -p /var/lib/nfsroot\n=>mkdir\
    \ -p /var/lib/nfsspub\n\n### STEP 5\n\nGiving the permission to the public directory\n\
    =>chmod 777 /var/lib/nfsspub\n\n### STEP 6\n\nEdit the /etc/exports file for the\
    \ file system share\n=>vim /etc/exports\n\n```\n/var/lib/nfsroot 192.168.0.7/24(rw,sync,no_root,root_squash)\n\
    /var/lib/nfspub *(rw,sync,root_squash)\n```\n\n- * -> everyone can use it\n- rw\
    \ -> writing power\n- sync -> data will be synced in both side if the data is\
    \ modified\n- root_squash -> when logged in with it will logged as a user nobody:nobody\n\
    \n### STEP 5\n\napply the change\n=> exportfs -ra\n\n## CLIENT SIDE CONFIGURATION\n\
    \n### STEP 1\n\ninstall the necessary packages\n=>yum install nfs-utils nfs-utils-lib\n\
    \n### STEP 2\n\nmount the volume\n=> mount -t nfs 192.168.0.7:/var/lib/nfsspub\
    \ /mnt\nit will mount the public directory to the /mnt folder\n\n# SAMBA\n\n##\
    \ WHAT IS SAMBA\n\nSamba is an open source software that is used to communicate\
    \ with windows client and share resources mount the file system like own system.\
    \ Samba provides this functionality by using Common File System (CIFS) Samba provides\
    \ the following service:\n\n- File services\n- Authentication and Authorization\n\
    - Name resolution\n- Service announcement (browsing)\n\n# SETTING SAMBA IN CENTOS\n\
    \n## SERVER SIDE CONFIGURATION\n\n### REQUIRIMENTS\n\n1) CENTOS SERVER, IP: 192.168.0.50\n\
    2) CLIENT (UBUNTU OR CENTOS), IP: 192.168.0.100\n3) INTERNET CONNECTION\n\n###\
    \ STEP 2\n\nupdate repository and install the necessary packages\n\n```\n=> yum\
    \ update -y\n=>yum install samba-client samba-common\n```\n\n### STEP 3\n\ncreate\
    \ a group and add user in that group who can use the samba share.\n\n```\n[root@localhost\
    \ ~]# groupadd test\n[root@localhost ~]# useradd user1\n[root@localhost ~]# useradd\
    \ user2\n[root@localhost ~]# usermod -a -G test user1\n[root@localhost ~]# usermod\
    \ -a -G test user2\n```\n\n### STEP 4\n\nCreate a directory and give proper permission\
    \ for that user and group UBUNTU $ CENTOS ADMINISTRATOR\n\n=>mkdir /share\n=>chmod\
    \ 777 /share\n=>chgrp test /share\n\n```\n[root@localhost -]# mkdir /share\n[root@localhost]#\
    \ chmod 777 /share\n[root@localhost]# chgrp test /share\n```\n\n### STEP 5\n\n\
    Configure SELinux .you can either disable the SELinux or set the proper Boolean\
    \ value and security otherwise will not let you connect to the server .In this\
    \ we are not going to disable SELinux we will change the Boolean value.\n\n=>\
    \ setsebool -P samba_export_all_ro=1 samba_export_all_rw=1\n=> getsebool -a |\
    \ grep samba_export\n=> semanage fcontext -at samba_share_t \"/share/(.*)\\*\"\
    \n=> restorecon /share\n\n```\n[root@localhost -]# setsebool -P samba_export_all_ro=1\n\
    [root@localhost -]# setsebool -P samba_export_all_rw=1\n[root@localhost -]# getsebool\
    \ -a | grep samba\nsamba_export_all_ro --on\nsamba_export_all_rw --on\n[root@localhost\
    \ -]# semanage fcontext -at samba_share_t \"/share/(.*)?*\"\n[root@localhost -]#\
    \ restorecon /share\n```\n\n### STEP 6\n\nwe have to change the firewall settings\
    \ for allowing the connection\n\n=>firewall-cmd -permanent -add-service=samba\n\
    =>firewall-cmd -reload\n\n```\n[root@localhost ~]#\n[root@localhost #] firewall-cmd\
    \ --permanent --add-service=samba\nsuccess\n[root@localhost #] firewall-cmd --reload\n\
    success\n[root@localhost ~]# \n```\n\n### STEP 7\n\nThis is the most important\
    \ path of the part .we need to edit the configuration of the samba share\n\n=>\
    \ vim /etc/samba/smb.conf\n\n```\n[share]\ncomment=Directory for samba share\n\
    browsable=yes\npath=/share\npublic=no\nvalid users=@test\nwrite list=@test\nwriteable=yes\n\
    create mask=0770\nForce create mode=0770\nforce group=test\n```\n\n```\n[share]\n\
    comment = Directory for samba share\ncreate mask = 0770\nforce create mode = 0770\n\
    force group = test\npath = /share\nvalid users = @test\nwrite list = @test\n[root@localhost\
    \ ~]#\n```\n\n### STEP 8\n\nTest the configuration with the ‘testparm’ command.if\
    \ there is any any error in the configuration this command will tell you that\n\
    \n=>testparm\n"
  mdcn: "\n这是在 CentOS 7 中设置 squid 代理服务器的基础配置。\n\n# NFS 服务器\n\n## 什么是 NFS 服务器\n\nLinux\
    \ 提供了许多不同的工具来访问其他计算机系统上的文件。对于与基于 Linux 的操作系统共享文件，我们实际上使用 NFS（这也包括 Mac OS，因为 Mac\
    \ OS 是基于 Unix 的）。在 Windows 和 Linux 之间共享文件时，我们使用 Samba。NFS 允许你直接访问位于其他计算机上的资源。网络信息服务（NIS）维护网络上所有系统的配置。使用\
    \ NFS，你可以像操作本地系统一样挂载文件系统。\n\n## NFS 进程\n\nNFS 在 TCP/IP 协议上运行。通过导出文件系统使其在网络上可用。你需要在\
    \ `/etc/exports` 中创建条目并运行多个守护进程以支持访问：\n\n- rpc.bind：接收来自远程系统的请求并将其到本地系统。\n- rpc.mountd：执行挂载和卸载操作。\n\
    - rpc.mapper：将请求映射到相应的 NFS 进程。\n- rpc.quota：提供磁盘配额管理。\n- rpc.statd：当远程主机重启时提供锁定服务。\n\
    - rpc.lockd：处理系统崩溃时的锁恢复。\n\n> 建议仅在本地网络中使用 NFS 服务器，如果要在互联网上使用，系统将是不安全的。\n\n# 在\
    \ CentOS 中设置 NFS 服务器\n\n## 服务器端\n\n### 要求\n\n- CentOS 服务器\n- 客户端\n- 服务器 IP：192.168.0.7\n\
    \n### STEP 1\n\n首先在 CentOS 系统中安装内核模块\n\n```\n=>yum update\n=> yum install nfs-utils\
    \ nfs-lib -y\n```\n\n### STEP 2\n\n我们需要向防火墙添加服务\n\n```\n=> firewall-cmd --permanent\
    \ --add-service=nfs\n=> firewall-cmd --reload\n```\n\n### STEP 3\n\n启动时启用 NFS\
    \ 服务\n\n```\n=>systemctl enable nfs\n=>systemctl start nfs\n```\n\n### STEP 4\n\
    \n创建两个目录\n\n1) 用于 root 的 /var/lib/nfsroot\n2) 用于 public 的 /var/lib/nfspublic\n\
    \n```\n=>mkdir -p /var/lib/nfsroot\n=>mkdir -p /var/lib/nfspublic\n```\n\n###\
    \ STEP 5\n\n给 public 目录赋予权限\n\n```bash\n=>chmod 777 /var/lib/nfspublic\n```\n\n\
    ### STEP 6\n\n编辑 `/etc/exports` 文件进行文件系统共享\n\n=>vim /etc/exports\n\n```\n/var/lib/nfsroot\
    \ 192.168.0.7/24(rw,sync,no_root_squash)\n/var/lib/nfspublic *(rw,sync,root_squash)\n\
    ```\n\n- *：所有人可以使用\n- rw：写入权限\n- sync：当数据被修改时，双方都会同步数据\n- root_squash：登录时将以 nobody\
    \ 用户身份登录\n\n### STEP 5\n\n应用更改\n\n=>exportfs -ra\n\n## 客户端配置\n\n### STEP 1\n\n\
    安装必要的包\n\n```bash\n=>yum install nfs-utils nfs-utils-lib\n```\n\n### STEP 2\n\n\
    挂载卷\n\n```bash\n=> mount -t nfs 192.168.0.7:/var/lib/nfspublic /mnt\n```\n这会将公共目录挂载到\
    \ /mnt 文件夹。\n\n# 在 Ubuntu 中设置 NFS 服务器\n\n## 服务器端配置\n\n### 要求\n\n- Ubuntu 服务器\n\
    - CentOS 客户端\n- 服务器 IP：192.168.0.7/24\n\n### STEP 1\n\n首先在 Ubuntu 系统中安装内核模块\n\n\
    ```bash\n=>apt update\n=> apt install nfs-kernel-server\n```\n\n### STEP 2\n\n\
    我们需要向防火墙添加服务\n\n```bash\n=> ufw allow from 192.168.0.7/24 to any port nfs\n```\n\
    \n### STEP 3\n\n启动时启用 NFS 服务\n\n```bash\n=>systemctl enable nfs\n=>systemctl start\
    \ nfs\n```\n\n### STEP 4\n\n创建两个目录\n\n1) 用于 root 的 /var/lib/nfsroot\n2) 用于 public\
    \ 的 /var/lib/nfspublic\n\n```bash\n=>mkdir -p /var/lib/nfsroot\n=>mkdir -p /var/lib/nfspublic\n\
    ```\n\n### STEP 5\n\n给 public 目录赋予权限\n\n```bash\n=>chmod 777 /var/lib/nfspublic\n\
    ```\n\n### STEP 6\n\n编辑 `/etc/exports` 文件进行文件系统共享\n\n=>vim /etc/exports\n\n```\n\
    /var/lib/nfsroot 192.168.0.7/24(rw,sync,no_root_squash)\n/var/lib/nfspublic *(rw,sync,root_squash)\n\
    ```\n\n- *：所有人可以使用\n- rw：写入权限\n- sync：当数据被修改时，双方都会同步数据\n- root_squash：登录时将以 nobody\
    \ 用户身份登录\n\n### STEP 5\n\n应用更改\n\n=>exportfs -ra\n\n## 客户端配置\n\n### STEP 1\n\n\
    安装必要的包\n\n```bash\n=>yum install nfs-utils nfs-utils-lib\n```\n\n### STEP 2\n\n\
    挂载卷\n\n```bash\n=> mount -t nfs 192.168.0.7:/var/lib/nfspublic /mnt\n```\n这会将公共目录挂载到\
    \ /mnt 文件夹。\n\n# Samba\n\n## 什么是 Samba\n\nSamba 是一种开源软件，用于与 Windows 客户端通信并像本地系统一样共享文件系统资源。Samba\
    \ 通过通用文件系统 (CIFS) 提供这种功能。Samba 提供以下服务：\n\n- 文件服务\n- 身份验证与授权\n- 名称解析\n- 服务公告（浏览）\n\
    \n# 在 CentOS 中设置 Samba\n\n## 服务器端配置\n\n### 要求\n\n1) CentOS 服务器，IP：192.168.0.50\n\
    2) 客户端 (Ubuntu 或 CentOS)，IP：192.168.0.100\n3) 互联网连接\n\n### STEP 2\n\n更新仓库并安装必要的包\n\
    \n```bash\n=> yum update -y\n=>yum install samba-client samba-common\n```\n\n\
    ### STEP 3\n\n创建一个组，并将可以使用 Samba 共享的用户加入该组。\n\n```\n[root@localhost ~]# groupadd\
    \ test\n[root@localhost ~]# useradd user1\n[root@localhost ~]# useradd user2\n\
    [root@localhost ~]# usermod -a -G test user1\n[root@localhost ~]# usermod -a -G\
    \ test user2\n```\n\n### STEP 4\n\n创建一个目录并为该用户和组赋予适当权限\n\nUbuntu管理员\n\n```bash\n\
    =>mkdir /share\n=>chmod 777 /share\n=>chgrp test /share\n```\n\n```\n[root@localhost\
    \ -]# mkdir /share\n[root@localhost]# chmod 777 /share\n[root@localhost]# chgrp\
    \ test /share\n```\n\n### STEP 5\n\n配置 SELinux。你可以禁用 SELinux 或设置正确的布尔值，否则安全设置将不允许连接到服务器。在这里我们不会禁用\
    \ SELinux，而是更改布尔值。\n\n=> setsebool -P samba_export_all_ro=1 samba_export_all_rw=1\n\
    => getsebool -a | grep samba_export\n=> semanage fcontext -at samba_share_t \"\
    /share/(.*)\\*\"\n=> restorecon /share\n\n```\n[root@localhost -]# setsebool -P\
    \ samba_export_all_ro=1\n[root@localhost -]# setsebool -P samba_export_all_rw=1\n\
    [root@localhost -]# getsebool -a | grep samba_export\nsamba_export_all_ro --on\n\
    samba_export_all_rw --on\n[root@localhost -]# semanage fcontext -at samba_share_t\
    \ \"/share/(.*)\\*\"\n[root@localhost -]# restorecon /share\n```\n\n### STEP 6\n\
    \n更改防火墙设置以允许连接\n\n=>firewall-cmd --permanent --add-service=samba\n=>firewall-cmd\
    \ --reload\n\n```\n[root@localhost ~]#\n[root@localhost #] firewall-cmd --permanent\
    \ --add-service=samba\nsuccess\n[root@localhost #] firewall-cmd --reload\nsuccess\n\
    [root@localhost ~]# \n```\n\n### STEP 7\n\n这是最重要的部分。我们需要编辑 Samba 共享的配置\n\n=> vim\
    \ /etc/samba/smb.conf\n\n```\n[share]\ncomment=Directory for samba share\nbrowsable=yes\n\
    path=/share\npublic=no\nvalid users=@test\nwrite list=@test\nwriteable=yes\ncreate\
    \ mask=0770\nForce create mode=0770\nforce group=test\n```\n\n```\n[share]\ncomment\
    \ = Directory for samba share\ncreate mask = 0770\nforce create mode = 0770\n\
    force group = test\npath = /share\nvalid users = @test\nwrite list = @test\nwriteable\
    \ = yes\n```\n\n### STEP 8\n\n用 `testparm` 命令测试配置。如果配置中有任何错误，该命令将告诉你。\n\n=>testparm\n"
