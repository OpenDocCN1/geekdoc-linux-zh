  mdcn: "\n\n## 为什么代理服务器非常重要\n\n### 缓存 (CACHE)\n\n代理服务器提供的缓存可以提高你的网络性能。现在的问题是，什么是缓存？缓存是存储在代理服务器上的网站或数据的本地副本。因此，当你请求类似“www.youtube.com”时，代理服务器会检查服务器中是否保存了该网站的最新副本，然后将保存的副本发送给用户。所以，如果有\
    \ 100 人通过代理服务器访问 YouTube，代理服务器只会发送一次请求，然后将本地副本发送给用户。这节省了带宽并提高了性能。不仅如此，如果你下载了一个文件，而另一个用户尝试下载同一个文件，代理服务器可以通过第一个用户下载文件时保存的本地副本提供服务。假设你的公司有数千名员工，他们都使用\
    \ Windows 系统，该系统需要定期更新，而更新需要大量时间。但如果通过代理，计算机就可以以极快的速度下载更新的本地副本，因为在创建本地副本后就不需要连接互联网。\n\
    \n### 提高安全性\n\n代理服务器在提供隐私优势之外提供了安全优势。你可以配置代理服务器对你的网络请求进行加密，以防止窥探读取你的交易信息。你还可以防止已知的恶意网站通过代理服务器进行访问。另一个重要功能是轻松阻止有害网站。例如，我们可以使用\
    \ OpenDNS 阻止此网站，但在路由器级别配置会有点困难。但通过在代理服务器中使用 ACL（访问控制列表），我们可以自定义他们可以访问哪些网站以及不能访问哪些网站。配置非常简单。\n\
    \n### 访问被屏蔽的\n\n代理服务器允许用户绕过公司或政府实施限制。假设你处于一个国家，你想访问的某些网站被运营商屏蔽了。但你可以轻松地连接到另一个国家的代理服务器，并通过该代理服务器轻松上网。代理服务器将为你访问被屏蔽的网站并将数据发送到你的计算机。\n\
    \n### 监控流量\n\n如果你是系统管理员，有时需要监控用户通过代理服务器产生的流量。你可以轻松地监控服务器的流量和缓存。\n\n## 在 UBUNTU\
    \ 中设置 SQUID 代理服务器\n\n### 服务器端配置\n\n### 第 1 步\n\n在 centos 中更新仓库（注：原文命令为 apt，通常用于\
    \ Ubuntu/Debian）\n=> apt update -y\n或者，\n=> apt-get update\n\n### 第 2 步\n\n安装\
    \ squid 软件包\n=> apt install squid -y\n或者，\n=> apt-get install squid -y\n\n###\
    \ 第 3 步\n\n设置开机启动并启动 squid 服务\n\n```\n=> systemctl enable squid\n=> systemctl\
    \ start squid\n```\n\n### UBUNTU $ CENTOS 管理员\n\n### 第 4 步\n\n检查进程状态 => systemctl\
    \ status squid\n\n### 第 5 步\n\n编辑 squid 配置文件。在此配置中 -> 我们可以为可以使用代理服务器的客户端编写 acl\n\
    \n- 我们可以选择缓存内存\n- 使用 acl 允许或拒绝特定网络\n- 为代理服务器客户端阻止或允许特定网站\n\n=> vim /etc/squid/squid.conf\n\
    \n* 默认情况下，squid 监听 3128 端口，你可以更改并设置一个不同的端口。如果我们想更改端口，必须更改 http_port 行并指定新端口\n\n\
    ```\n# Squid 正常监听端口 3128 \nhttp_port 3128\n\n# TAG: https_port\n# 注意：此选项仅在 Squid\
    \ 重新编译时启用了\n# --with-openssl 时才可用\n```\n\nhttp_port : 端口号\n\n你可以通过 acl（访问控制列表）控制\
    \ squid 服务器的访问。\n\n你可以创建一个包含允许的 IP 地址列表的文本文件，将其包含在 acl 中并拒绝所有其他 IP 地址，以防止其他客户端连接到代理服务器。\n\
    \n创建一个名为“allowed_ips.txt”的包含允许 IP 地址的文件。\n\n```\n192.168.0.100\n192.168.0.99\n\
    192.168.0.122\n~\n~\n~\n```\n\n=>vim allowed_ips.txt\n\n### UBUNTU $ CENTOS 管理员\n\
    \n192.168.x.x\n192.168.x.x\n192.168.x.x\n192.168.x.x\n192.168.x.x\n\n*现在将文件添加到\
    \ acl 中。\n\n```\n# 在此处插入你自己的规则，以允许来自你的客户端的访问\n#\nacl Allowed_ips src \"/etc/squid/allowed_ips.txt\"\
    \nhttp_access allow Allowed_ips\n```\n\n=> vim /etc/squid/squid.conf\n\n## ##\
    \ 语法\n\n#acl <name> src \"<filepath>\"\n#http_access allow <name>\n\n### Tanvir\
    \ Rahman\n\nacl Allowed_ips src '/etc/squid/allowed_ips.txt'\nhttp_access allow\
    \ Allowed_ips\n\n或者你可以通过允许所有客户端给所有客户端提供访问权限\n\n```\n# http_access allow localnet\n\
    http_access allow localhost\n# 最后拒绝对此代理的所有其他访问\nhttp_access allow all\n```\n\n\
    http_access allow all\n\n更改配置后，我们必须重启服务，以便配置更改成功加载。\n\n=>systemctl restart squid\n\
    \n# 监控服务器的访问和缓存\n\n# 第 1 步\n\n监控用户的访问情况\n进入文件 '/var/log/squid/access.log'\n\n\
    ```\n=> tail -f access.log\n=> cat -f access.log | more\n```\n\n# 第 2 步\n\n监控用户的缓存情况\n\
    进入文件 '/var/log/squid/cache.log'\n\n```\n=> tail -f cache.log\n=> cat -f cache.log\
    \ | more\n```\n\n"
