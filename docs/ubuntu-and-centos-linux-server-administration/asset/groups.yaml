    ## Apt 仓库


    当我们使用 apt 命令安装或搜索软件包时，它会从某些在线仓库搜索该软件包。该 URL 列表存储在 `/etc/apt/sources.list` 文件中，以及包含
    `/etc/apt/sources.list.d` 目录下的文件中。


    如果我们使用以下命令查看 ''sources.list'' 文件


    ```bash

    => cat /etc/apt/sources.list

    ```


    我们将看到类似下面的内容


    从配置源获取的可用信息是通过 ''apt update'' 或另一个 apt 前端的等命令获取的。用户可以在该文件中手动添加仓库 URL。添加仓库后，你必须执行
    ''apt update'' 命令使其可用。


    或者，你也可以直接在 `/etc/apt/sources.list.d` 目录下创建一个文件。该文件必须以 .list 扩展结尾。apt 软件包管理器也会从那里读取仓库配置。


    ## Tanvir Rahman


    例如：

    首先使用 vim 编辑器在 sources.list.d 仓库中打开文件


    ```bash

    => vim /etc/apt/sources.list.d/games.list

    ```


    在该文件中添加仓库路径


    ```bash

    deb http://archive.getdeb.net/ubuntu wily-getdeb games

    ```


    或者用户可以通过交互式命令添加仓库。


    使用 `add-apt-repository`（或 `symlink-add-repository`）命令来添加仓库。你只需要按照以下命令提供引用地址。


    ```bash

    => add-apt-repository ''deb http://archive.getdeb.net/ubuntu wily-getdeb games''

    ```


    使用以下命令移除任何仓库


    ```bash

    => add-apt-repository -r ''deb http://archive.getdeb.net/ubuntu wily-getdeb games''

    ```


    > [每当你对仓库进行更改时，你都必须应用 ''apt update'' 命令以使更改生效]


    ## CENTOS 软件包管理


    Rpm (Red Hat Package Manager) 和 Yum(Yellowdog Updater) 软件包管理工具基本上用于 Centos/Redhat、fedora
    等操作系统。


    类似于 debian 体系操作系统中的 dpkg。Rpm 是本地软件包管理工具（低级软件包管理工具），而 Yum 是在线软件包管理工具（高级软件包管理工具）。Yum
    类似于 ubuntu 操作系统中的 apt。


    [就像 dpkg 一样，rpm 命令在安装软件时可能会遇到依赖问题，而 yum 会自动搜索依赖项并安装它们。]


