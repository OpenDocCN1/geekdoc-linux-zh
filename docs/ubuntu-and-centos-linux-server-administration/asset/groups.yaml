    使用此命令通过 rpm 移除此软件包


    ```bash

    => rpm -e <package_name>

    ```


    [如果一个软件包依赖于另一个软件包，你无法通过 rpm 命令删除它，除非你先删除依赖于它的其他软件包。例如，如果你想移除 openssh 软件包，因为 ‘open-ssh
    client’ 软件包依赖于它，你必须先移除它。但如果你使用 yum 命令移除任何软件包，这将自动发生。]


