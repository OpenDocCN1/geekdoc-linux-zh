- md: '

    ## Why proxy server is important


    ### CACHE


    proxy server gives you a cache that will improve your network performance. Now
    the question is what is a cache?? cache is a local copy of the web site or data
    that is stored in the proxy server. So when you ask for something like “www.youtube.com”
    the proxy server will check that if the most recent copy of the site is saved
    in the servers and then send the saved copy to the user. So if 100 people go to
    the youtube through the proxy server then the proxy server will send only one
    request and then send the local copy to the user . Thats save the bandwidth and
    improve the performance not only that if you downloaded a file and it goes the
    other user try to download the same file then it can be server by the proxy server
    by the local copy that is saved when the first user downloaded the file. Suppose
    your company has thousands employee and they all are using windows OS that needs
    regular updates and the updates take a lot of time. but if it goes through a proxy
    then this computer can download the local copy of the updates with a great speed
    because it does not using the internet after the local copy is made.


    ### Improved Security


    Proxy servers provide security benefits on top of the privacy benefits. You can
    configure your proxy server to encrypt your web requests to keep prying eyes reading
    your transactions. You can also prevent known malware sites from any access through
    the proxy server. And another important feature is block harmful website easily
    .for example we can block this website using opendns but it is a little hard to
    configure in the router level. but using acl in the proxy server we can customize
    which site they can go ans which site they cant go.its really easy to configure.


    ### Get Access To Blocked Resource


    Proxy servers allow users to circumvent content restrictions imposed by companies
    or governments. suppose you are in a country where some website you want to go
    is blocked by the provider .but you can easily connect to a proxy server in other
    country and easily surf the internet through the proxy server .the proxy server
    will surf the blocked website for you and send the data to your computer.


    ### Monitor The Traffic


    if you are a system administrator and sometimes you need to monitor the traffic
    that the user made through the proxy server. you can easily monitor the traffic
    and cache of the server.


    ## SETTING SQUID PROXY SERVER IN UBUNTU


    ### SERVER SIDE CONFIGURATION


    ### STEP 1


    update the repository in centos

    => apt update -y

    or,

    => apt-get update


    ### STEP 2


    install squid packages

    => apt install squid -y

    or,

    => apt-get install squid -y


    ### STEP 3


    enable and start the squid service in boot time


    ```

    => systemctl enable squid

    => systemctl start squid

    ```


    ### UBUNTU $ CENTOS ADMINISTRATOR


    ### STEP 4


    check the status of the process => systemctl status squid


    ### STEP 5


    Edit the squid configuration file in This configuration ->we can write acl for
    the client who can use the proxy server


    - we can select the cache memory

    - allow or deny specific network for using acl

    - block or allow specific website for the proxy server client


    => vim /etc/squid/squid.conf


    * by default squid listen to the port 3128 you can change it and set a different
    port. If we wnt to change the prt we have to change the line http_port and specify
    the new port


    ```

    # Squid normally listens to port 3128

    http_port 3128


    # TAG: https_port

    # Note: This option is only available if Squid is reuniilt with the

    # --with-openssl

    ```


    http_port : port


    you can control the access of the squid server with acl (Access Control List)


    you can create a text file with the list of the ip address with the allowed ip
    address and include with the acl and deny all other ip address that will prevent
    the other client to connect to the proxy server.


    create a file with allowed ip address name “allowed_ips.txt”


    ```

    192.168.0.100

    192.168.0.99

    192.168.0.122

    ~

    ~

    ~

    ```


    =>vim allowed_ips.txt


    ### UBUNTU $ CENTOS ADMINISTRATOR


    192.168.x.x

    192.168.x.x

    192.168.x.x

    192.168.x.x

    192.168.x.x


    *now add the file to the acl.


    ```

    # INSERT YOUR OWN RULE(S) HERE TO ALLOW ACCESS FROM YOUR CLIENTS

    #

    acl Allowed_ips src "/etc/squid/allowed_ips.txt"

    http_access allow Allowed_ips

    ```


    => vim /etc/squid/squid.conf


    ## ## syntax


    #acl <name> src "<filepath>"

    #http_access allow <name>


    ### Tanvir Rahman


    acl Allowed_ips src ''/etc/squid/allowed_ips.txt''

    http_access allow Allowed_ips


    or you can give access to all the client by allowing all the clients


    ```

    # http_access allow localnet

    http_access allow localhost

    # And finally deny all other access to this proxy

    http_access allow all

    ```


    http_access allow all


    after changing the configuration we have to restart the service so that the configuration
    change successfully loaded.


    =>systemctl restart squid


    # Monitor Access and Cache of the Server


    # STEP 1


    monitor the access of the user

    we go to the file ''/var/log/squid/access.log''


    ```

    => tail -f access.log

    => cat -f access.log | more

    ```


    # STEP 2


    monitor the cache of the user

    we go to the file ''/var/log/squid/cache.log''


    ```

    => tail -f cache.log

    => cat -f cache.log | more

    ```

