    ***


    # COMMAND LINE IN LINUX


    Every workstation version of Linux has a Beautiful GUI (Graphical Interface) but
    most of the server Ubuntu or Centos root can do anything command line mode. you
    can add graphical user interface to that but without the command line you can''t
    manage the server properly. Once you learn Command line you will find that it
    is more powerful and flexible for user to manage your server than a graphical
    mode.


    ## WORKING AS ROOT


    By default every Linux OS creates a user root. Many operating system like CentOS
    ask for a root password. But Ubuntu server don''t do that. There is a very good
    reason behind that. in Linux OS root has a limitless power. root can do anything,
    change anything even delete anything from the server. so it is very important
    to be careful when you work as root. That''s why in Tanvir ubuntu server every
    time you do anything that need superuser privileges you use the command ‘sudo’.
    This command allows the normal user so they can perform task that needs superuser
    privileges. you type sudo then your command it may ask for password after providing
    the password it will perform the action with the superuser privileges. But if
    you want the root shell then type this command:


    ```

    => sudo su

    ```


    But it is not recommended to work with the root shell. Do not use the root shell
    unless it is absolutely necessary. work with sudo if you need superuser privilege.


    # TERMINAL & SHELL


    ### What is Terminal


    Terminal is a program that opens a window and lets you play with the shell. There
    are a bunch of different terminal emulators that you can see in the Linux Distribution.
    such as Gnome terminal, konsole, xterm, rxvt, nxterm, eterm, Tilikix etc. Terminal
    lets you interact with the shell.


    ### What is shell


    Shell itself is a program that takes command from the keyboard and gives them
    to the operating system to perform. You can work with the graphical user interface
    but if the server you are using no graphical user interface this will be the only
    interface you got and you have to do all of your work in the cli.


    there are different types of shell:


    - tsh -> tsh is a shell with a scripting language similar to the C programming
    language

    - sash -> stand alone shell.its a very minimal shell runs almost every system
    .it is basically popular for troubleshooting the system

    - zsh -> zsh is a shell which is compatible with bash but has a lot of extra functionality

    - fish -> fish stands for friendly interactive shell .mostly popular in desktop.
    It has a very good auto completion feature

    - Bash -> bash stands for Bourne Again Shell that is the enhanced version of the
    original UNIX program sh .it is written by the Steve Bourne. It is the most popular
    shell and the default shell of the most Linux operating system.


    We will use the Bash all over the example.


    ***


    # BASIC LINUX COMMANDS


    These are the basic command to operate a Linux operating system.


    **Command name: ls**


    **description:**

    ls command used to see the files and folder inside a directory . it is the most
    used command in Linux.


    **syntax:**

    ls [-option] <directory>


    - 1) ls -m will show the files and folder with comma

    - 2) ls -a show the hidden files also

    - 3) ls -l will show the files and folder in listing format

    - 4) ls -lh will show the file with size

    - 5) ls -i will show the list of folders with Inode

    - 6) ls -t will show the modification time with directory listing


    **Command name: more**


    **description:**

    It works like more command .it also give scrolling options


    **syntax:**

    ```

    more <options> <file_name>

    ```


    - 1) less -E : automatically exit the first time it reaches end of file.

    - 2) less -f : forces non-regular file to open.

    - 3) less -F : exit if entire file can be displayed on screen

    - 4) less -g : highlight the string which was found by search

    - 5) less -G : suppresses all highlighting of strings found by search commands

    - 6) less -i : case line numbers

    - 7) less <pattern> : it tells less to start at the first occurrence of pattern
    in the file

    - 8) less -s : causes consecutive blank lines into a single line

    - 9) less -n : suppresses line numbers

    - 10) less <pattern> : it tells less to start at the first occurrence of pattern
    in the file

    - 11) less -s : causes consecutive blank lines squeezed

    - 12) less -N : shows line number


    **Command name: strings**


    **description:**

    To display the content of the file


    **syntax:**

    strings <filename>


    **Command name: tree**


    **description:**

    To display the Directory in tree format


    **syntax:**

    tree <directory>

    [you may have to install tree with package manager]


    **Command name: dir**


    **description:**

    To display the files and folder inside the directory


    **syntax:**

    dir <directory_name>

    [you have to install before this command]


    **Command name: cal**


    **description:**

    To display the calendar


    **syntax:**

    cal <month> <year>


    **Command name: clear**


    **description:**

    clear the screen


    **syntax:**

    ```

    clear

    ```


    **Command name: bc**


    **description:**

    basic calculator


    **syntax:**

    ```

    bc

    ```


    **Command name: mkdir**


    **description:**

    making directory


    **syntax:**

    ```

    mkdir <directory> : for making single directory

    mkdir -p <directory>: for making recursive directory

    ```


    **Command name: rmdir**


    **description:**

    Remove empty directory you cant remove any directory which has file in it with
    this command


    **syntax:**

    rmdir <empty_directory>


    **Command name: file**


    **description:**

    display the file type


    **syntax:**

    file <filename>


    **Command name: ln**


    **description:**

    Create a link of the filename. In case hard link you delete the main file link
    wont remove but in case soft link if you delete the main file the linked file
    will be removed


    **syntax:**

    ln <option> <source_file> <shortcut_file>


    - ln -s : for creating soft link

    - ln -P : for creating hard link


    **Command name: history**


    **description:**

    Shows users command history it will show the last 1000 command of the user you
    can set the limit if you like


    **syntax:**

    history


    **Command name: locate**


    **description:**

    It will search the entire system for that file [you need to apply the command
    ‘updateddb’ for getting latest entry]


    **syntax:**

    locate <file_name>


    **Command name: uname**


    **description:**

    Show all the information about the kernel , OS and hardware-platform


    **syntax:**

    - uname -a : all information, in the following order

    - uname -s : print the kernel name

    - uname -n : print host name

    - uname -r : print the kernel release

    - uname -v : print the kernel version

    - uname -m : print the machine hardware name

    - uname -p : print the processor type

    - uname -i : print the hardware platform

    - uname -o : print the operating system


    **Command name: tar**


    **description:**

    For creating archive and extracting archive hardware-platform


    **syntax:**

    - tar -cvf <archive_name> <source> : for creating archive

    - tar -xvf : for extracting archive


    **Command name: gzip**


    **description:**

    For compressing normal file or archive file


    **syntax:**

    gzip <file_name>


    **Command name: gunzip**


    **description:**

    It is used for uncompromising a compressed file


    **syntax:**

    gunzip <compressed_file>


    **Command name: lsmod**


    **description:**

