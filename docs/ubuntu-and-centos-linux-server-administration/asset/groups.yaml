- md: '

    # Tanvir Rahman


    Machine can''t escape or tamper with the host OS. That''s why virtual machine
    is a perfect platform for testing application. Even different kind of server can
    be installed on a single host.


    ## Virtual Machine Category


    ### system virtual machine

    System virtual machine mimics all the properties of a real computer and shares
    the host physical resources. Its virtualization technique is provided by a software
    called hypervisor. hypervisor can run on top of operating system or on hardware
    base.


    ### process virtual machine

    Process virtual machine is used to run only a single application on purpose. This
    virtual machine does not exist when the application is not used. This virtual
    machine is mainly used to run program that incompatible with the underlying operating
    system.


    ## Hypervisor


    ### Type 1 virtual machine

    Hypervisor software that falls under Type 1 has direct contact with physical hardware.
    Direct handling of hardware increased the efficiency and performance of guest
    operating system running over it. Such kind of virtualization also called Bare
    metal Hypervisor. Mostly they are used in Data centres or in cloud environment
    or by enterprises.


    - 1) Oracle OVM

    - 2) SPARC

    - 3) Hyper-V

    - 4) KVM


    ### Type 2 virtual machine

    Type 2 virtualization has an extra layer over the hardware the guest os share
    the hardware though it needs permission of host OS for accessing physical resources.
    This basically adds an extra layer of complexity.


    Why type one has better performance than type 2:


    - 1) Virtualbox

    - 2) VMware

    - 3) QEMU


    ## CONTAINERS


    When we first read about containers we thought the container and VM are the same
    thing. But the truth they are not exactly the same containers are not the same
    concept. In 1979 UNIX added a service to the operating system called chroot. Its
    provide an isolated environment where the application and the service run. In
    2008 Linux brought the LXC called linux container which is also used today this
    is popular open source app that creates isolated environment for process monitoring.
    In 2013 DOCKER company brought this to the light. Docker containers has powerful
    application programming interface (API) CLI efficient model and cluster management.


    When compared to Virtual machines, the Docker platform moves up the abstraction
    of resources from hardware level to Operating System level. This allows for the
    realization of various benefits of Containers e.g. application portability, infrastructure
    separation, and self-contained microservices. In other words, while Virtual Machines
    abstract the entire server, Containers abstract the Operating System kernel. This
    is a whole different approach to virtualization and results in much faster and
    more lightweight instances so the main concept is Docker does not isolate the
    environment with a separate operating system.


    ## Container Based Implementation vs Virtual Machine Implementation


    You can integrate the hypervisor and the docker at the same time to use better
    resource usages.


    ## Why Use Docker instead of a virtual machine


    The main reason of deploying docker is the efficient utilization of the hardware
    resources. If we don''t use any of the virtualization most servers are the 5%
    to 10% of the hardware resources. But with proper virtualization technique we
    can raise workload density.


    ## BUT THERE ARE PROBLEMS TOO


    First problem is portability. When you try to migrate an application from one
    location to another location we have to transfer an entire operating system and
    an operating system running on VMware don’t natively run on Virtualbox and that’s
    not fully portable.


    Another problem is waste of resources when you deploy an application on a server
    even on virtual machine that requires a lot of resources only for the operating
    system. That''s a lot of waste of hardware resources. You will find that you are
    wasting most of your resources just the operating system. In docker you don''t
    have to do that.


    ***


    ## CREATING UBUNTU VIRTUAL SERVER


    We can use the KVM, libvirt to make a virtual server.


    ### Install packages


    If you are in ubuntu:

    ```bash

    sudo apt install kvm libvirt-bin virt-manager virt-viewer virt-top virtwhat

    ```


    If you are in CentOS/RedHat:

    ```bash

    sudo yum install groupinstall "virtualization"

    ```


    ### Install the OS


    [syntax]

    ```bash

    virt-install -name=<name_of_os> -vcpus=<how_many_cpu_use> -memory=<ram_size> -cdrom=<path_of_the_iso>
    --disk size=<how_many_disk_space_you_allocate> --os-variant=''debian/arch/centos<choose_the_flavour>''

    ```

    ```bash

    virt-install -name=my_os -vcpus=1 -memory=2048 -cdrom=<path_of_the_iso> --disk
    size=5 --os-variant=''debian/arch/centos''

    ```

    After that the virtual machine will boot up. You can find the detail of the os
    using this command:

    ```bash

    osinfo

    ```


    [important]

    The os you just installed will be stored in "/home/share/libvirt/images". So if
    you want to delete the os completely you have to manually delete the files inside
    the folder. Find the list of all installed OS:

    ```bash

    virsh list

    ```

    To start a VM:

    ```bash

    virsh start <VM_name>

    ```

    To shutdown a VM:

    ```bash

    virsh shutdown <VM_name>

    ```

    To forcibly shutdown a VM:

    ```bash

    virsh destroy <VM_name>

    ```

    To delete a VM:

    ```bash

    virsh undefine <VM_name>

    ```


    ***


    ## APACHE WEB SERVER


    Web server are computers that are usually built to store websites so that people
    can visit them on internet. The files stored on a web server are read by the browsers
    in the client computer. Browser communicate with the web servers to bring you
    information from the internet. Web server can communicate with multiple computer
    all at the same time. Computer hardware play very important role in the server.
    How fast the server is determined by how fast the processor speed. Dedicated computer
    is used for this serving purpose. A program is also needed to perform this action.
    This program is also known as web server.


    So web server are actually the hardware with the server software running on them.
    This software program is slightly different than other software. These software
    or programs are called the daemons. They run in the background. They are not in
    the


    Mordan web server comes with some extra functionality like serve email, file transfer
    protocol. The web server also run program which are installed in them like wordpress,
    joomla, database etc. There are different web server in linux:


    - 1) Apache HTTP server

    - 2) NGINX web server

    - 3) Apache Tomcat web server

    - 4) Lghttpd web server

    - 5) Open lite speed web server


    Among the web server Apache web server is the most used web server all over the
    world. 52% of all the websites in the world is ran in Apache. Apache web server
    is most often seen running on Linux. It has a great documentation and integrated
    support fro other software projects.

