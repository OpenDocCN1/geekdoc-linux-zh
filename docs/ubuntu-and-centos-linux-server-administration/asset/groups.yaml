    ## KERNEL MANAGEMENT


    The kernel is the operating system.It performs all the core task like managing
    memory and disk access it will connect to all the hardware that makes your system.
    It gives you the multitasking and multi user support .It handles all the communication
    with all the devices like CD ROM USB drive .Basically user sends the request signal
    that go through the kernel to the device .Based on different different hardware
    the configuration of the kernel will vary .Suppose you have to add a new device
    to the system then you have to change the kernel support for the specific devices.
    you can download the binary version of the kernel or you can download the source
    code and compile it. Its now the job of the system administrator to worry for
    the code of the kernel but you must know how to add and remove kernel module and
    detect if any kernel module not working or malfunctioning .And he must know how
    to compile and add new kernel to the system


    kernel sets up several presses some process are internal to the


    kernel.

    We can see the internal process with this command


    => ps aux | egrep ''\[''


    ```

    [root@localhost #] ps aux | egrep ''\[''

    root      2 0.0 0.0  0 ? S 16:11 0:00 [kthread]

    root      3 0.0 0.0  0 ? ? S 16:11 0:00 [koftirqd/0]

    root      5 0.0 0.0  0 ? ? S< 16:11 0:00 [kworker/u2:0H]

    root      6 0.0 0.0  0 ? ? S 16:11 0:00 [u256:0]

    root      7 0.0 0.0  0 ? ? S 16:11 0:00 [migration/0]

    root      8 0.0 0.0  0 ? ? S 16:11 0:02 [rcu-sched]

    root      9 0.0 0.0  0 ? ? R 16:11 0:00 [webback]

    root     10 0.0 0.0  0 ? ? S 16:11 0:00 [kswapd]

    root     11 0.0 0.0  0 ? ? SN 16:11 0:00 [ksmd]

    root     13 0.0 0.0  0 ? ? S 16:11 0:00 [netns]

    root     14 0.0 0.0  0 ? ? S 16:11 0:00 [kthread]

    root     15 0.0 0.0  0 ? ? S 16:11 0:00 [webback]

    root     16 0.0 0.0  0 ? ? S 16:11 0:00 [bioset]

    root     17 0.0 0.0  0 ? ? S 16:11 0:00 [kintegrity]

    root     18 0.0 0.0  0 ? ? S 16:11 0:00 [bioset]

    root     19 0.0 0.0  0 ? ? S 16:11 0:00 [bioset]

    root     20 0.0 0.0  0 ? ? S< 16:11 0:00 [biosd]

    root     21 0.0 0.0  0 ? ? S< 16:11 0:00 [blockd]

    root     22 0.0 0.0  0 ? ? S 16:11 0:00 [md]

    root     23 0.0 0.0  0 ? ? S< 16:11 0:00 [dac-poller]

    root     24 0.0 0.0  0 ? ? S< 16:11 0:00 [watchdog]

    root     30 0.0 0.0  0 ? ? S 16:11 0:00 [kswapd0]

    root     31 0.0 0.0  0 ? ? SN 16:11 0:00 [ksmd]

    ```


    this process are all kernel process. Some of these are very important for the
    system administrator to know.


    For example


    *kthread manages the kernel thread*


    md/0 manages the raid subsystem

    kswapd manages the swap space available for the system


    [this generally don''t impact the system administrator .some times the system
    can misbehave and can occur memory overflow if it happens you will see the kswapd
    process on the top of the process list which you can find in the ''top'' command
    ]


