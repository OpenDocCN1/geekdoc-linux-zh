- md: "\n## GNU PROJECT\n\nGNU Stands for (GNU is NOT UNIX). To make a free clone\
    \ of the UNIX OS, the GNU project started in 1984. To maintain the free software,\
    \ FSF (Free Software Foundation) was created. It creates the GNU C compiler, EMACS\
    \ Text editor, and many other software.\n\nThe GNU General Public License (GPL)\
    \ is a very creative license that is used to copyright to protect the freedom\
    \ of the software user. When a software is licensed under the GPL, recipients\
    \ are bound by the copyright to respect the freedom of anyone to use and share\
    \ the software and also change the source code if necessary.\n\n## HISTORY OF\
    \ LINUX\n\nLinux is a clone of the UNIX-based operating system. Unix was created\
    \ at BELL LABS for AT&T corporation. To make a free clone of the Unix, Linus Torvalds\
    \ created MINIX. He wrote the kernel which is the heart of the Linux. After that,\
    \ a lot of developers helped him to add more features and functionality, and at\
    \ that time the GNU Project was making free software for the computer and to make\
    \ an OS they needed a functional kernel which can communicate with the hardware.\
    \ They took the Linux kernel and added the GNU software on top of the kernel and\
    \ made the GNU/LINUX Operating system.\n\nLinus Torvalds is still considered as\
    \ the dictator of the Linux kernel. He ultimately determines which features will\
    \ be added in the Linux kernel and what features are not.\n\n## Packaging Linux:\
    \ Distribution\n\nA complete Linux system is called a distribution. A Linux distribution\
    \ contains the Linux kernel, the GNU project tools, and any number of software\
    \ that can make the OS diverse functionality.\n\nThere are a lot of distributions\
    \ on Linux. Some of them specifically for servers and some of them Desktop. Every\
    \ customized distribution includes software packages for different users.\n\n\
    A single Linux distribution often appears in different versions. For example,\
    \ Centos distribution comes with a full core distribution and a LIVE CD version.\n\
    \nUbuntu is based on Debian Distribution and Centos is community version of the\
    \ Commercial RedHat linux distribution.\n\n## Core Linux Distribution\n\nCore\
    \ Linux distribution contains the Linux Kernel and GNU operating system, one or\
    \ more DE (Desktop Environment) and applications that are available ready to install\
    \ and run. The core Linux Distributions are the complete Linux distributions.\
    \ These are the popular distributions:\n\n- Red Hat linux\n- Fedora Core\n- Centos\
    \ Linux\n- SUSE linux\n- Ubuntu Linux\n- Gentoo Linux\n- Debian Linux\n- Slackware\
    \ Linux\n- Mandriva Linux\n- Turbo Linux\n- Puppy Linux\n\nWe use the Ubuntu Linux\
    \ and the Centos Linux to illustrate how the servers work.\n\n## PRINCIPLE OF\
    \ LINUX\n\n- Everything works as a file, even the system hardware\n- Small work\
    \ is done by the individual program\n- Any completed work will be divided into\
    \ smaller parts and then processed by different modules.\n- All the configuration\
    \ will be stored in a text file\n- linux OS use a standard hierarchical file structure\
    \ in which the files/user files are arranged\n\n## UBUNTU SERVER\n\nUbuntu is\
    \ built on the Debian architecture and comprised linux server and Desktop. Ubuntu\
    \ release updates every six months; Ubuntu packages are based on packages from\
    \ Debian’s unstable branch. Ubuntu is currently funded by the Canonical LTD. And\
    \ GENOME 3 is the default GUI interface for the ubuntu from the 17.10 version.\
    \ We are going to use Ubuntu Server 18.04.3 LTS for our work. You can download\
    \ the latest long-term version of ubuntu server in this URL:\n\nhttps://ubuntu.com/download/server\n\
    \n## CENTOS SERVER\n\nThe CentOS Project is a community-driven free software effort\
    \ focused on delivering a robust open source ecosystem around a Linux platform.\
    \ Its Basically a clone of Redhat. CentOS Linux is a consistent, manageable platform\
    \ that suits a wide variety of deployments. For some open source communities,\
    \ it is a solid, predictable base to build upon. You can download the latest long-term\
    \ version of CentOS server in this URL:\n\nhttps://centos.org/download/\n\n##\
    \ VMWARE INSTALLATION\n\n### Step 1\n\nInstall the required build packages\n=>\
    \ sudo apt install build-essential\n\n### Step 2\n\nDownload VMware workstation\
    \ player from the website.\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_17_0.png)\n\
    \n### Step 3\n\nGo to the installed directory, make the file executable\n=> chmod\
    \ 777 vmware-Player*\n\n## Tanvir Rahman\n\n[we will talk about the chmod 777\
    \ later for now just use it]\n\n### Step 4\n\nExecute the program with sudo\n\
    => sudo ./Vmware-Player*\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_18_0.png)\n\
    \n[no license key is required. If you want to install vmware workstation instead\
    \ of vmware player you need to have the license key]\n\nAfter a successful installation\
    \ screen will show to you:\n\n12\n\n## UBUNTU $ CENTOS ADMINISTRATOR\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_19_0.png)\n\
    \n*** \n\n## UBUNTU SERVER INSTALLATION\n\nUbuntu\n\n### REQUIREMENTS:\n\n1) HOST\
    \ PC WITH AT LEAST 4GB OF RAM\n2) VMWARE WORKSTATION/VIRTUALBOX\n3) UBUNTU SERVER\
    \ ISO IMAGE\n\n### Step 1\n\nLaunch VMware Workstation New Virtual Machine Wizard\n\
    \n![](img/b48bb5eea64d70d0c5160c63325a327c_20_0.png)\n\n### Step 2\n\nSelect the\
    \ installation media or source.\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_21_0.png)\n\
    \n## Tanvir Rahman\n\n### Step 3\n\nFinal configuration of the Vmware will be\
    \ like:\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_22_0.png)\n\n### Step 4\n\n\
    Start the installation, first set the language:\n\n- English\n- Castellano\n-\
    \ Français\n- Deutsch\n- Eesti\n- Hungarian\n- Dutch\n- Norwegian\n- Polski\n\
    - Русский\n- Español\n\n### Step 5\n\nFrom the software selection select server\
    \ with a GUI\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_23_0.png)\n\n## Tanvir\
    \ Rahman\n\n### Step 6\n\nSelect the volume for installing. In this installation\
    \ we go for the entire disk guided partition:\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_24_0.png)\n\
    \n### Step 7\n\nThere are three types of partition:\n\n- Guided: use entire disk\n\
    - Manual: In manual partition user have to allocate the space:\n  1) /boot\n \
