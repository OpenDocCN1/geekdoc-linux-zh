    # Tanvir Rahman


    computer in two different devices because it is not synchronize with the email
    server.


    But this is not the mail issue with the pop3 protocols, the main problem is when
    you download mail with pop3 in your devices from the email server. it will get
    deleted from the mail server. no copy of the email is kept on the server. so consider
    you two devices one is mobile device and another with a desktop with the same
    email account with pop3 protocol and you download email with your mobile device
    then you can not download the same email in your desktop because the moment you
    download the mail in your mobile devices it is deleted from the server. so that''s
    a downside of the pop3 if you use multiple device to manage your email.


    # IMAP


    imap stands for Internet message access protocols. IMAP is a little bit complicated
    than pop3. It is perfect for managing email from multiple devices because it leaves
    a cache (local copy) in the mail server. And it synchronizes the folder structure
    and every file inside it. so if the mail client is configured with the IMAP you
    will see the same folder structure on every devices you used to access it. But
    it has a downside if you delete any email from one of your devices your mail will
    be deleted in the server and the other devices to maintain the synchronization.
    If you added a folder in the folder structure all other client will do that too.


    To set the protocols you have to change the settings of the mail client for example
    if you want to use the pop or imap from a mail server you have to add "pop.example.com"
    or "imap.gmail.com" in the incoming mail server settings.


    # IMAP VS POP3


    pop3 advantage:


    - 1) pop3 is better if you use it from only one devices

    - 2) pop3 saves the mail server location

    - 3) saves internet bandwidth because it only use the internet when new mail come


    pop3 disadvantage:


    - 1) no backup for email

    - 2) cant use with multiple client simultaneously

    - 3) your devices can be infected with virus since the whole file with attachment
    is downloaded


    IMAP advantage:


    - 1) All the mail is stored in the mail server

    - 2) you can manage it with multiple devices

    - 3) Synchronization


    IMAP disadvantage:


    - 1) you cant see the email without an internet connection


    # SMTP


    SMTP is the protocols for sending email. while pop3 and IMAP is for receiving
    email. SMTP is a set of command that authenticate and transfer your email. When
    you send email from your email client it will send to the email server with SMTP
    protocols. Your mail server is also known as SMTP server like the gmail (smtp.gmail.com).
    Then your SMTP server will send the email again with smtp protocols with the receivers
    SMTP server. Then you can download the email with pop3 or IMAP or you can read
    it directly from the server with WEBMAIL.


    SMTP uses the TCP protocol which is a connection oriented protocol. That means
    it assure you in delivery. So if by any chance the email wont deliver to the destination
    you will get notification about that. And and just like the pop3 and IMAP you
    have to configure it to your email client for example if you use the Gmail. you
    have to add the ''smtp.gmail.com'' in your outgoing mail service.


