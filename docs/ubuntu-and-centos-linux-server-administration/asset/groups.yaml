    # SAMBA SERVER


    # WHAT IS SAMBA


    Samba is an open source software that is used to communicate with the windows
    client and share its resources mount the file system like hosts own file system.
    Samba provides this functionality by using the Common Internet File System (CIFS)
    SAMBA provides the following service


    +   - File & print services

    - Authentication and Authorization

    - Name resolution

    - Service announcement (browsing)'
