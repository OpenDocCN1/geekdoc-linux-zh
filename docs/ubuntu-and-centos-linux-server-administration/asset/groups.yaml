    \ pub 目录中的文件，如果你给予权限，他们也可以上传文件。所有默认配置都应用于这些目录，但 vsftpd 不创建任何可以上传文件的目录。我们通常称之为目录。你必须创建该目录并将其添加到默认\
    \ ftp 组，授予写入权限，以便用户在该目录中上传文件。\n\n# FTP 用户\n\n在文件服务器中拥有账户的普通用户可以通过其凭据登录以获得完全访问。该用户可以在其访问的所有目录中传输文件（包括上传和下载）。你还可以创建用户并限制他们对公共文件夹的访问。\n\
