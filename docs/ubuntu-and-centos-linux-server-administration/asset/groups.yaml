    → main configuration is in the file\nServerRoot \"/etc/httpd\"\n\n## ServerName:\n\
    → this is the one settings that you have to change to get your server running.\
    \ this is where you declare the name of your website\n\n## DocumentRoot:\n→ DocumentRoot\
    \ shows you the location where the documents (html, css, images) are located .\
    \ its also possible to redirect to other directory using aliases and symbolic\
    \ link. default is /var/www/html\n\n## ErrorLog:\nErrorLog tells you where the\
    \ log containing all servers errors is located .This file is necessary for solving\
    \ misconfiguration and determine the traffic shape .by default all messages with\
    \ the value of warning will be logged. the default location is /etc/httpd/logs/error_log\
    \ there is also a symbolic link to /var/log/httpd\n\n## Listen:\n→ the Listen\
    \ command tells the web server what ports use for connection .by default 80 is\
    \ used .several port is used for non-secure web communication . Secure connection\
    \ is used for 443\n\n## Starting Apache server\n\nin red hat based system:\n\n\
    ```bash\n=>service httpd start\n```\n\nor\n\n```bash\n=>systemctl start httpd\n\
    ```\n\nin debian based system:\n\n```bash\n=>systemctl start apache2\n```\n\n\
    or\n\n```bash\n=>service apache2 start\n```\n\nTo find the process of the web\
    \ server command is:\n\nredhat based system:\n\n```bash\n=>service httpd status\n\
    ```\n\nin debian based system:\n```bash\n=>service apache2 status\n```\n\nanother\
    \ method is redhat based system:\n\n```bash\n=>ps -ef | grep httpd\n```\n\ndebian\
    \ based system:\n```bash\n=>ps -ef | grep httpd\n```\n\n## Accessing web server\
    \ locally\n\nyou can just visit the website using the browser typing the url \"\
    localhost\". most of the time we will see testing page will show that apache server\
    \ is running if we correctly installed the web server. we can give it a name using\
    \ the /etc/hosts file:\n\n```bash\n=>vim /etc/hosts\n127.0.0.1 www.example.com\n\
    ```\n\nthen we can access the website locally using the name \"www.example.com\"\
    \n\n## Accessing web server Externally\n\nwe can access this website from the\
    \ other machine if the ip address is in the same subnet we can just access the\
    \ website by putting the ip address .but in this case using the name \"www.example.com\"\
    \ does not help because in the other machine the ip address of the particular\
    \ computer, we can also resolve it by putting the same name in the hosts file.\
    \ theoretically we can do that in host of the network .but it is not practical\
    \ .it is impossible to add the domain to every hosts file .and even we do this\
    \ thing we cannot access the website from outside. this problem can be solved\
    \ by figuring and running DNS.\n\n## ADVANCE APACHE WEB SERVER CONFIGURATION\n\
    \nApache web server is highly customization .there are a lot of directives that\
    \ we can customize. we will discuss the following:\n\n- Directory Tags\n- Order(allow,deny)\n\
    - Indexes\n- Directory Match\n- Files tags\n- Directory, File and Locations tags\n\
    - Redirect\n\nwe also cover:\n\n- configuring setting one ip for websites\n- configuring\
    \ two ip for different websites\n\n### directory tags\n\ndirectory tags allow\
    \ you to specify the configurations separately for separate folder can customize\
    \ each pages with each configuration process is like the <Directory> tag we use\
    \ tag for different block folder. directory tags take the following form:\n\n\
    ```apache\n<Directory directory_path>\nseries of options that control accessing\
    \ web pages\n</Directory>\n```\n\nbasic directory configuration applied to the\
    \ \"/\" directory:\n\n```apache\n<Directory />\nOptions FollowSymLinks\nAllowOverride\
    \ none\n</Directory>\n```\n\n- Options FollowSymLinks: it allows the web pages\
    \ to use the symbolic links to point to the files located anywhere under the root\
    \ (/) directory\n\n- AllowOverride none: it tells that if the restriction imposed\
    \ by the option is controlled by the .htaccess file or not . default value is\
    \ none so there will be no security breaches due to misconfiguration\n\n### Order(allow\
    \ and deny)\n\nthe Order directive specify how the allow and deny work. The order\
    \ of (allow,deny) create a default allow it is used for creating a blacklist .the\
    \ Order(deny,allow) create a default deny .used to create a whitelist. allow and\
    \ deny govern the access to the directory .we can allow or deny client from accessing\
    \ the server using:\n\n- hostname\n- domain name\n- ip address\n- partial ip address\n\
    - subnet and more\n\nfor an example if the ip of their server is \"192.168.10.200\"\
    \ IN THE LAN and we want to allow only the ip and deny all others the syntax will\
    \ be:\n\n```apache\n<Directory />\nOrder deny,allow\nDeny from all\nAllow from\
    \ 192.168.10.200\n</Directory>\n```\n\nAfter changing this we have to reload the\
    \ server. [remember if you do not add the allow statement no one can access the\
    \ website not even you].\n\n```bash\n=> service httpd restart\nor\n=> service\
    \ apache2 restart\n```\n\n### Indexes\n\nThe indexes directive actually tells\
    \ what to display the list of directory when asked. its depends on another directive\
    \ is called \"DirectoryIndex\". Directory index actually tells the server whats\
    \ the default pages of the server .Basically clients trying to access the web\
    \ pages by just typing the name not typing the exact page url like index.php or\
    \ index.html. server actually look in the \"DirectoryIndex\" and automatically\
    \ present to the user. If no file is found then it shows the whole file listing\
    \ if the \"Options Indexes\" is not in the directory tag then it will not show\
    \ any directory listing\n\n### DirectoryMatch:\n\nthe statement that is inside\
    \ the **DirectoryMatch** will apply to all directory and the sub directory .if\
    \ any one try to customize their rules even more then it is used .main difference\
    \ is in the **DirectoryMatch** you have to use the regular expression\n\n### Files\
    \ tags\n\nit is very similar to the directory tags .the main difference is directory\
    \ tag controls the permission by the enclosed directives in the directory level\
    \ and the Files tags do the same at the files level in a short the Files tags\
    \ can be used to manage the behavior of a single files or can be a lot of files.\
    \ for example:\n\n```apache\n<Files \"ht*\">\n  Require all denied\n</Files>\n\
    ```\n\nthese directives inside the Files will prevent the web clients from accessing\
    \ the .htaccess and .htpasswd file.\n"
  mdcn: "\n\n# 在 Linux 中安装 Apache Web 服务器：\n\n在某些操作系统中，Apache Web 服务器已经安装了。\n\n##\
    \ 第一步\n\n首先，我们必须验证基于 redhat/centos 的系统中是否安装了 Apache：\n\n```bash\n=>sudo rpm -q\
    \ httpd\n```\n\n```bash\n=>sudo rpm -qa | grep httpd\n```\n\n或者\n\n```bash\n=>sudo\
    \ rpm -q apache2\n```\n\n在基于 Debian 的系统中：\n\n```bash\n=>sudo dpkg -l apache2\n\
    ```\n\n```bash\n=>sudo dpkg -l | grep 'apache2'\n```\n\n如果你得到空提示符或提示软件包未安装，则你必须安装它。\n\
    \n## 第二步 安装 Apache Web 服务器\n\n在 CentOS 中：\n\n```bash\n=>sudo yum install httpd\n\
    ```\n\n或者你也可以直接下载包并手动安装：\n\n```bash\n=>sudo rpm -i <apache packages>\n```\n\n\
    在基于 Debian 的系统中：\n\n```bash\n=>sudo apt install apache2\n```\n\n手动安装：\n\n```bash\n\
    =>sudo dpkg --install <apache packages>\n```\n\n### Apache 应用的文件结构\n\n/usr/sbin/httpd\n\
    - 包含服务器二进制文件\n\n/etc/httpd\n→ 包含服务器配置文件\n\n/etc/httpd/conf\n→ 目录包含主配置文件\n\n/etc/httpd/conf.d\n\
    → 此目录下存储了如 ssl.php、perl 等模块的配置文件\n\n/etc/httpd/logs\n→ 包含登录信息，它实际上是 /var/log/httpd\
    \ 的符号链接\n\n/etc/httpd/modules\n指向 /usr/lib/httpd/modules/ 的符号链接，其中包含服务器模块\n\n\
    /var/run/httpd.pid:\n→ 服务器进程 ID\n\n/var/www/html\n→ 包含公共 html 文件。所有的应用程序和 html\
    \ css 文件都存储在这里，并且公共用户可以访问\n\n/etc/httpd/conf/httpd.conf\n→ 主配置位于在该文件中\nServerRoot\
    \ \"/etc/httpd\"\n\n## ServerName:\n→ 这是你必须更改的设置以运行你的服务器。这是你声明网站名称的地方。\n\n## DocumentRoot:\n\
    → DocumentRoot 显示文档（html, css, images）所在的位置。也可以使用别名（aliases）和符号链接重定向到其他目录。默认值是\
    \ /var/www/html\n\n## ErrorLog:\nErrorLog 告诉你包含所有服务器错误的日志所在位置。此文件对于解决配置错误和确定流量状况至关重要。默认情况下，所有值为\
    \ warning 的消息都会记录。默认位置是 /etc/httpd/logs/error_log，还有一个指向 /var/log/httpd 的符号链接。\n\
    \n## Listen:\n→ Listen 命令告诉 Web 服务器使用哪些端口进行连接。默认使用 80。多个端口用于非安全 Web 通信。安全连接使用\
    \ 443\n\n## 启动 Apache 服务器\n\n基于 red hat 的系统中：\n\n```bash\n=>service httpd start\n\
    ```\n\n或者\n\n```bash\n=>systemctl start httpd\n```\n\n基于 debian 的系统中：\n\n```bash\n\
    =>systemctl start apache2\n```\n\n或者\n\n```bash\n=>service apache2 start\n```\n\
    \n查找 Web 服务器进程的命令是：\n\n基于 redhat 的系统：\n\n```bash\n=>service httpd status\n```\n\
    \n基于 debian 的系统：\n```bash\n=>service apache2 status\n```\n\n另一种方法基于 redhat 的系统：\n\
    \n```bash\n=>ps -ef | grep httpd\n```\n\n基于 debian 的系统：\n```bash\n=>ps -ef | grep\
    \ httpd\n```\n\n## 本地访问 Web 服务器\n\n你可以直接通过浏览器输入 URL \"localhost\" 来访问网站。大多数情况下，如果我们正确安装了\
    \ Web 服务器，我们看到的测试页面将显示 Apache 服务器正在运行。我们可以通过 /etc/hosts 文件为它起一个名字：\n\n```bash\n\
    =>vim /etc/hosts\n127.0.0.1 www.example.com\n```\n\n然后我们就可以使用名称 \"www.example.com\"\
    \ 在本地访问网站。\n\n## 外部访问 Web 服务器\n\n如果 IP 地址在同一子网内，我们可以从其他机器访问此网站，只需通过输入 IP 地址即可访问。但在这种情况下，使用名称\
    \ \"www.example.com\" 并没有帮助，因为在另一台机器上是特定计算机的 IP 地址，我们也可以在 hosts 文件中放置相同的名称来解析它。理论上，我们可以在网络主机上这样做，但这并不实际。向每个\
    \ hosts 文件中添加域名是不可能的。即使我们这样做了，也无法从外部访问网站。这个问题可以通过配置和运行 DNS 来解决。\n\n## 高级 Apache\
    \ Web 服务器配置\n\nApache Web 服务器具有高度的可定制性。有很多我们可以自定义的指令。我们将讨论：\n\n- Directory 标签（Directory\
    \ Tags）\n- Order(allow,deny)\n- Indexes\n- Directory Match\n- Files 标签（Files tags）\n\
    - Directory, File and Locations 标签\n- Redirect（重定向）\n\n我们还涵盖了：\n\n- 为网站配置单个 IP\n\
    - 为不同的网站配置两个 IP\n\n### directory 标签\n\ndirectory 标签允许你为不同的文件夹单独指定配置，可以使用每个配置自定义每个页面，每个配置的过程就像我们用于不同块文件夹的\
    \ <Directory> 标签一样。directory 标签采用以下形式：\n\n```apache\n<Directory directory_path>\n\
    控制访问 Web 页面的一系列选项\n</Directory>\n```\n\n应用到 \"/\" 目录的目录目录配置：\n\n```apache\n<Directory\
    \ />\nOptions FollowSymLinks\nAllowOverride none\n</Directory>\n```\n\n- Options\
    \ FollowSymLinks：它允许网页使用符号链接。\n- AllowOverride none：它告知是否由 .htaccess 文件控制该限制。默认值为\
    \ none。\n\n### Order(allow,deny)\n\nOrder 指令指定了允许和拒绝如何工作。(allow,deny) 创建了默认允许，用于创建黑名单。Order(deny,allow)\
    \ 创建了默认拒绝，用于创建白名单。Order 管理对目录的访问。我们可以使用以下方式允许或拒绝客户端访问服务器：\n\n- 主机名\n- 域名\n- IP\
    \ 地址\n- 部分 IP 地址\n- 子网\n\n例如，如果服务器的 IP 为 \"192.168.1.200\"，位于局域网，我们只想允许该 IP 而拒绝其他所有，语法如下：\n\
    \n```apache\n<Directory />\nOrder deny,allow\nDeny from all\nAllow from 192.168.1.200\n\
    </Directory>\n```\n\n更改后我们必须重启服务器。[记住，如果不添加 allow 语句，将无人访问网站]。\n\n```bash\n=>\
    \ service httpd restart\n或\n=> service apache2 restart\n```\n\n### Indexes\n\n\
    Indexes 指令实际上告诉在请求时显示目录的列表。它取决于另一个名为 \"DirectoryIndex\" 的指令。DirectoryIndex 实际上告诉服务器服务器的默认页面。基本上客户端通过输入名称访问\
    \ Web ，而不是输入具体的页面 URL（如 index.php 或 index.html）。服务器实际上查找 \"DirectoryIndex\" 并自动呈现给用户。如果没有找到文件，则显示整个文件列表，如果目录标签中没有\
    \ \"Options Indexes\"，则不会显示任何目录列表。\n\n### DirectoryMatch:\n\n位于 **DirectoryMatch**\
    \ 内部的语句将适用于所有目录和子目录。如果任何人都尝试进一步自定义规则，则使用它。主要区别在于在 **DirectoryMatch** 中你必须使用正则表达式。\n\
    \n### Files 标签\n\n它与 directory 标签非常相似。主要区别是 directory 标签通过其包含的指令在目录级别控制权限，而 Files\
    \ 标签在文件级别执行相同的操作。简而言之，Files 标签可以用于管理单个文件，也可以用于许多文件。例如：\n\n```apache\n<Files \"\
    ht*\">\n  Require all denied\n</Files>\n```\n\n这些位于 Files 内部的指令将防止 Web 客户端访问 .htaccess\
    \ 和 .htpasswd 文件。\n\n"
