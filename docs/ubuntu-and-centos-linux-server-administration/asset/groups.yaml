    # DATABASE SERVER


    Database is an application where data is stored in a very organised way in a computer
    system. Complex data with complex design can be easily stored in the database
    application and almost all the web application uses some kind of database. There
    are different kinds of database: SQL, NoSQL database. Sql Database use the SQL
    to query, update, store and delete the Data. SQL is a language for managing database.


    There are a lot of SQL Database like:


    - mariadb

    - PostgreSQL

    - MS SQL Database

    - Sqlite


    NoSQL Database are:


    - MongoDB

    - Redis

    - LMDB

    - CouchDB

    - Cassandra


    we will talk about the mariaDB installation and Configuration.


    # MARIADB SERVER INSTALLATION AND CONFIGURATION IN CENTOS & UBUNTU


    # STEP 1


    Update the repository and install the mariadb server and enable it on boot time


    [in centos]

    =>yum update && yum install mariadb-server -y

    =>systemctl enable mariadb

    =>systemctl restart mariadb


    [in ubuntu]

    =>apt update && apt install mariadb-server mariadb-client -y

    =>systemctl enable mariadb

    =>systemctl restart mariadb


    # STEP 2


    For Production you have Hardening the Security. To do that you have to apply this
    command


    ```

    =>mysql_secure_installation

    ```


    [root@localhost ~]# mysql_secure_installation


    NOTE: RUNNING ALL PARTS OF THIS SCRIPT IS RECOMMENDED FOR ALL MariaDB SERVERS
    IN PRODUCTION USE! PLEASE READ EACH STEP CAREFULLY!


    In order to log into MariaDB to secure it, we''ll need the current password for
    the root user. If you''ve just installed MariaDB, and you haven''t set the root
    password yet, the password will be blank, so you should just enter here.


    - Remove anonymous users? [Y/n] Y ... Success!

    - Normally, root should only be allowed to connect from ''localhost''. This ensures
    that anyone cannot get access at the root password from the network.

    - Disallow root login remotely? [Y/n] Y ... Success!

    - By default, MariaDB comes with a database named ''test'' that anyone can access.
    This is also intended for testing, and should be removed before moving into a
    production environment.

    - Remove test database and access to it? [Y/n]


    # Tanvir Rahman


    And you have to Enter the password for root login and then configure it


    # STEP 4


    All done! If you''ve completed all of the above steps, your MariaDB installation
    should now be secure.


    Thanks for using MariaDB!


    After a Successful installation this Message will be shown


    # STEP 5


    ```

    login with the root password

    =>mysql -u root -p

    ```


