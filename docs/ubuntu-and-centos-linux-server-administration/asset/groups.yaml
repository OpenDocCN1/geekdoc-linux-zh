  mdcn: "\n\n2) 当程序在以前台（Foreground）运行时，我们使用 'CTRL+Z' 中断程序，然后使用 'bg' 命令在后台恢复该程序。\n\n\
    ```bash\nvagrant@localhost ~$\nvagrant@localhost ~$ ping 8.8.8.8 > out1.txt\n\
    Z\n[1]+ Stopped ping 8.8.8.8 > out1.txt\nvagrant@localhost ~$ bg\n[1]+ ping 8.8.8.8\
    \ > out1.txt &\nvagrant@localhost ~$\nvagrant@localhost ~$ jobs\n[1]+ Running\
    \ ping 8.8.8.8 > out1.txt &\nvagrant@localhost ~$ \n```\n\n在将程序发送到后台后，如果我们实际上想查看它们的活动，我们使用\
    \ 'jobs' 命令来它们的运行状态。\n\n```bash\n[vagrant@localhost ~]-$ ping 8.8.8.8 > out1.txt\
    \ &\n[1] 23599\n[vagrant@localhost ~]-$ ping 8.8.4.4 > out2.txt &\n[2] 23600\n\
    [vagrant@localhost ~]-$ jobs\n[1]- Running      ping 8.8.8.8 > out1.txt &\n[2]+\
    \ Running      ping 8.8.4.4 > out2.txt &\n[vagrant@localhost ~]-$ \n```\n\n# 将进程从后台移到前台\n\
    \n要将任何后台进程带回前台，我们使用 ‘fg’ 命令。\n如果只输入 fg，它会将上一个后台作业带到前台。要将特定作业带到前台，我们在使用 ‘fg’ 命令后使用进程\
    \ ID。\n\n例如\n=>fg %1\n=>fg %2\n\n# Tanvir Rahman\n\n# 进程管理\n\n对于 Linux 操作系统，有很多优秀的性能监控工具。\n\
    下面解释了其中一些：\n\n# ps\n\n与进程管理相关最常用且最简单的命令是 'ps' 命令。通过 ps 命令，你可以查看当前系统上正在运行的进程列表。它会显示进程名称和进程\
    \ ID (PID)；\n\n```bash\n[vagrant@localhost ~]$ ps\nPID TTY           TIME CMD\n\
    4613 pts/0       00:00:00 bash\n23890 pts/0    00:00:00 ps\n[vagrant@localhost\
    \ ~]$ \n```\n\n通过 ps 命令，我们可以尝试不同的开关，例如如果我们使用 'ps -e'，我们可以看到系统中的所有进程，或者你也可以使用此命令查看一个\n\
    => ps -e | more\n\n# UBUNTU CENTOS 管理员\n\n```bash\n[vagrant@localhost ~]$ ps -e\
    \ | more\nPID TTY TIME CMD\n1 ? 00:00:03 systemd\n2 ? 00:00:08 kthreadadd\n3 ?\
    \ 00:00:08 ksoftirqd/0\n5 ? 00:00:00 worker/2:0\n6 ? 00:00:00 worker/u2:0\n7 ?\
    \ 00:00:00 migration/0\n8 ? 00:00:00 rcu_bh\n9 ? 00:00:02 rcu_sched\n10 ? 00:00:00\
    \ lru-add-drain\n11 ? 00:00:00 watchdog/0\n13 ? 00:00:00 kdevtmpfs\n14 ? 00:00:00\
    \ netns\n15 ? 00:00:00 khuntaskd\n16 ? 00:00:00 writeback\n17 ? 00:00:00 integrityityd\n\
    18 ? 00:00:00 bioset\n```\n\n如果我们想以完整格式列出输出，应该使用这些命令\n=> 'ps -ef'.\n\n```bash\n\
    [vagrant@localhost ~]$ ps -ef | more              TIME CMD\nUID PID PPID C STIME\
    \ TTY\nroot 1 0 0 00:00:03 ? /usr/lib/systemd/systemd --system\nroot 2 0 0 00:00:08\
    \ ? kthreadadd\nroot 3 0 0 00:00:08 ? ksoftirqd/0\nroot 5 0 0 00:00:00 ? worker/2:0\n\
    root 6 0 0 00:00:00 ? worker/u2:0\nroot 7 0 0 00:00:00 ? migration/0\nroot 8 0\
    \ 0 00:00:00 ? rcu_bh\nroot 9 0 0 00:00:02 ? rcu_sched\nroot 10 0 0 00:00:00 ?\
    \ lru-add-drain\nroot 11 0 0 00:00:00 ? watchdog/0\nroot 13 0 0 00:00:00 ? kdevtmpfs\n\
    root 14 0 0 00:00:00 ? netns\nroot 15 0 0 00:00:00 ? khuntaskd\nroot 16 0 0 00:00:00\
    \ ? writeback\nroot 17 0 0 00:00:00 ? integrityd\nroot 18 0 0 00:00:00 ? bioset\n\
    ```\n\n如果我们想以完整格式列出输出，应该使用这些命令：\n=> 'ps -ef'.\n\n# Tanvir Rahman\n\n或者你可以使用 ps\
    \ -el\n你也可以使用 ps -ax\n或者 ps -aux\n\n# 使用 ps 按用户查找进程\n\n通过 ps 命令查找进程是可能的，因此作为管理员，你可以监控其他用户在做什么。\n\
    ```\n[vagrant@localhost ~]$ ps -u vagrant\nPID TTY TIME CMD\n4612 ? 00:00:00 sshd\n\
    4613 pts/0 00:00:00 bash\n23954 pts/0 00:00:00 ps\n[vagrant@localhost ~]$\n```\n\
    \n在张图中显示了三个进程。其中一个\n\n# UBUNTU CENTOS 管理员\n\nuptime 命令为我们提供了关于服务器运行了多久的信息，并提供了关于负载平均值的详细信息，此输出开头为\n\
    1) 当前时间\n2) 运行时间（服务器运行了多久）\n3) 当前登录用户数\n4) 负载平均值\n\n最后是最重要的参数。\n\n| 数字 | 描述 |\n\
    | :--- | :--- |\n| 第一个数字 | 1分钟的负载平均 |\n| 第二个数字 | 过去5 分钟的负载平均 |\n| 第三个数字 | 过去15\
    \ 分钟的负载平均 |\n\n# Tanvir Rahman\n\n负载平均值显示了等待处理的进程数量。在这种情况下，数字 1 表示 CPU 被完全占用。如果服务器是双核或双\
    \ CPU，那么理想数字将是 2。\n\n```bash\n[vagrant@localhost ~]$ uptime\n06:33:58 up 4:14,\
    \ 1 user, load average: 0.00, 0.01, 0.05\n[vagrant@localhost ~]$\n\n# free\n\n\
    free 命令提供当前 RAM 和交换空间的信息。交换空间越少越好，因为交换是不利的。交换基本上是使用物理空间来补偿内存不足，这比实际 RAM 慢得多。还有缓存内存和缓冲区内存。缓存内存是可以立即释放的内存。缓冲区内存是进程使用的内存，在不终止进程无法释放。\n\
    \n```bash\n[vagrant@localhost ~]$ free\ttotal used shared/cache available\nMem:\
    \ 1014972 76908 636732 6792 301332 765736\nSwap: 2097148 0 2097148\n[vagrant@localhost\
    \ ~]$\n```\n\n# Top\n\n最有用且常用的提供几乎所有信息的命令是 top 命令。\n\n# Tanvir Rahman\n\ntop -\
    \ 06:46:41 4:26, 1 user, load average: 0.15, 0.05, 0.06\nTasks: 79 total, 1 running,\
    \ 78 sleeping, 0 stopped, 0 zombie\n%Cpu(s): 0.3 us, 0.3 us, 0.0 ni, 99.3 id,\
    \ 0.0 wa, 0.0 hi, 0.0 si, 0.0 st\n0 used.\nKiB Mem: 1014972 total, 635976 free,\
    \ 77348 used, 301648 buff/cache\nKiB Swap: 2097148 total, 2097148 free, 0 used,\n\
    \n"
