    # SSH: THE SECURE SHELL


    # WHAT IS SSH?


    SSH is a cryptographic network protocol for secure services


    # USES


    - It is used for the remote login

    - Secure File Transfer (SFTP/SCP)

    - SOCKS protocols for web browsing through encrypted proxy

    - Secure remote mounting via SSHFS


    # Login With SSH Using Password


    requirements:


    - we have two server

    - 1) server1, ip: 192.168.0.10/24

    - 2) server2, ip : 192.168.0.11/24


    # Step 1


    we need to install the openssh-server in server2 [in centos server its pre-installed]


    ```

    =>yum update -y

    =>yum install sshd -y

