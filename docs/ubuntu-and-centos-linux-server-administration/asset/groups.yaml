    \ nobody:nogroup /var/ftp/pub\n\n# 第 4 步\n\n配置匿名访问\n=>vim /etc/vsftpd.conf\n设置：\n\
    anonymous_enable=YES\n=>local_enable=NO 因为我们不希望本地用户通过 FTP 上传文件\n\n# 第 5 步\n\n\
    在下方添加一些自定义配置，首先设置用户目录\n=>anon_root=/var/ftp\n停止密码检查：\n=>no_password=YES 这是最重要的一点，无论用户如何，都显示用户和组为\
