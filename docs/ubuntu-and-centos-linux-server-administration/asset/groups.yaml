  - '[PAGE 385]


    # Why proxy server is important


    # CHACHE


    proxy server gives you a cache that will improve your network performance. Now
    the question is what is a cache?? cache is a local copy of the web site or data
    that is stored in the proxy server. So when you ask for something like “www.youtube.com”
    the proxy server will check that if the most recent copy of the site is saved
    in the servers and then send the saved copy to the user. So if 100 people go to
    the youtube through the proxy server then the proxy server will send only one
    request and then send the local copy to the user . Thats save the bandwidth and
    improve the performance not only that if you downloaded a file and it goes the
    other user try to download the same file then it can be server by the proxy server
    by the local copy that is saved when the first user downloaded the file. Suppose
    your company has thousands employee and they all are using windows OS that needs
    regular updates and the updates take a lot of time. but if it goes through a proxy
    then this computer can download the local copy of the updates with a great speed
    because it does not using the internet after the local copy is made'
  - '[PAGE 386]


    # Improved Security


    Proxy servers provide security benefits on top of the privacy benefits. You can
    configure your proxy server to encrypt your web requests to keep prying eyes reading
    your transactions. You can also prevent known malware sites from any access through
    the proxy server. And another important feature is block harmful website easily
    .for example we can block this website using opendnbs but it is a little hard
    to configure in the router level. but using acl in the proxy server we can customize
    which site they can go ans which site they cant go.its really easy to configure.


    # Get Access To Blocked Resource


    Proxy servers allow users to circumvent content restrictions imposed by companies
    or governments. suppose you are in a country where some website you want to go
    is blocked by the provider .but you can easily connect to a proxy server in other
    country and easily surf the internet through the proxy server .the proxy server
    will surf the blocked website for you and send the data to your computer'
