    # TELNET


    # CENTOS CONFIGURATION


    # What is Telnet?


    Telnet is a network protocol that is used to connect to remote computer over TCP/IP
    based network .it use port 23 by default. Its basically used for remote administration
    .when you connect to the other computer with telnet it will allow you to communicate
    with the host from your local system.


    # Problems With Telnet


    There are some security vulnerability in telnet Because


    +   - It Transmit login data in a clear format .Its not encrypted. Everything
    is sent in plain text

    - it is not recommended to use telnet over public network (WAN)

    - better alternative is the SSH which is encrypted.'
  - '[PAGE 183]


    # Telnet Server Install(Centos)


    # Step 1


    1) install the telnet client and the telnet server


    ```

    => yum install telnet telnet-server

    ```


    # Step 2


    2) enable the telnet service in boot time


    ```

    => systemctl enable telnet.socket

    => systemctl start telnet.socket

    ```


    # Step 4


    3) Enable Telnet in Firewall


    ```

    => firewall-cmd -premanent --add-port=23/tcp

    => firewall-cmd --reload

    ```


    # Step 5


    4) Create user [root login is disabled by default]


    ```

    => useradd <user_name>

    => passwd <user_name>

    ```'
