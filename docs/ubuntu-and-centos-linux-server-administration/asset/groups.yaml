    # Raid 0


    Raid 0 is not a fault tolerant .Even the Raid 0 should not be called RAID cause
    it does not fulfill the main target of RAID. Its actually called Striping .In
    RAID 0 data is stored or spread into two separate disk .It treats the two hard
    drive like a single hard drive and store the data.So By any chance if any of the
    disk failed or data is removed or


    ![](img/b48bb5eea64d70d0c5160c63325a327c_200_0.png)'
- md: '

    data become damaged there is no way that the data even get recovered, so now the
    question arrives why we use the RAID 0.


    The main advantage of using RAID 0 is “SPEED”. Because when you use multiple disk
    controller instead of one Access data become faster.


    ## Raid 1


    Raid 0 is fault tolerant. RAID 1 is called MIRRORING. In mirroring data is written
    to each RAID device. Each disk has a complete copy of data of the other. so if
    one disk fails you can access the same data from the other disk.


    # Tanvir Rahman


    ## RAID 1


    ![](img/b48bb5eea64d70d0c5160c63325a327c_202_0.png)


    Its is extremely safe. But it is very inefficient. Because it consumes double
    the size of space for data. For example to store 80GB of data you need 160GB of
    storage and since data has to be written in multiple disk that''s why it''s a
    slow process.


    ## Raid 5


    Raid 5 is also fault tolerant. Its alternative to the mirroring. It does not save
    the data with full duplication but with parity information. Parity information
    takes one drive that can be used to recover the data in case of data loss. That''s
    why you need to have three or more disks for RAID 5. That''s the very popular
    method for storing disk. The parity information is evenly spread through the disk.
    The downside of the data is that the parity takes a complete 1 drive equivalent.
    That means if you gave 4 disks of 1TB then you can only store 3TB of data in the
    disk with RAID 5.


    # UBUNTU $ CENTOS ADMINISTRATOR


    This is the combination of


    ![](img/b48bb5eea64d70d0c5160c63325a327c_203_0.png)


    the striping and the parity. RAID provides faster access and recover capability
    making it the most used redundancy approach for servers.


    ## Raid 10(1+0)


    Raid 10 is actually RAID 1 + RAID 0. It used both techniques for storing data.
    you have to use a minimum 4 disks to implement RAID 10. In RAID 10 data is stripped
    in multiple disks like RAID 0 but each disk has an exact copy in another disk
    like raid 1.


    ## RAID 10


    ![](img/b48bb5eea64d70d0c5160c63325a327c_204_0.png)


    So it''s a combination of striping and mirroring. So RAID 10 gives us the fault
    tolerance of the RAID 1 and speed of the RAID 0. But the downside is you can only
    use the half of your total storage if you implement RAID 10.


