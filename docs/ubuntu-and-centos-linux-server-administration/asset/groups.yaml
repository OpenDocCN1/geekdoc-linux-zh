    # IPA SERVER


    IPA server is an integrated security information management solution combining


    +   - Linux (OS)

    - 389 Directory Server

    - MIT Kerberos

    - NTP (Network Time Protocol)

    - DNS (Domain Name Server)

    - Dogtag (Certificate System)

    - web interface (Apache web server)

    - command-line tools


    [SAMBA, NFS AND ,MAIL SERVER CAN ALSO BE INCLUDED MANUALLY IN THIS SYSTEM]'
  - '[PAGE 496]


    # Tanvir Rahman


    IPA is an integrated Identity and Authentication solution for Linux/UNIX networked
    environments. A IPA server provides centralized authentication, authorization,
    and account information by storing data about user, groups, hosts and other objects
    necessary to manage the security aspects of a network of computers.


    IPA is built on top of well known Open Source components and standard protocols
    with a very strong focus on ease of management and automation of installation
    and configuration tasks.


    Multiple IPA servers can easily be configured in a IPA Domain in order to provide
    redundancy and scalability. The **389 Directory Server** is the main data store
    and provides a full multi-master **LDAPv3** directory infrastructure. Single-Sign-on
    authentication is provided via the **MIT Kerberos KDC**. Authentication capabilities
    are augmented by an integrated Certificate Authority based on the **Dogtag project**.
    Optionally Domain Names can be managed using the integrated **ISC Bind server**.


    Security aspects related to access control, delegation of administration tasks
    and other network administration tasks can be fully centralized and managed via
    the Web UI or the **ipa** Command Line tool.'
