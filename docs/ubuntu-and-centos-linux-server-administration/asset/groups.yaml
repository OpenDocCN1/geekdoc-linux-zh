    \ 20GB 磁盘\n必须关闭虚拟机以减少内存占用。\n\n### 第 2步：启动机器\n### 第 3 步：打开终端（或直接 ssh 到服务器）\n###\
    \ 第 4 步：应用 'lsblk' 命令查看块设备\n=>lsblk\n\n```\n[root@localhost ~]# lsblk\nNAME  \
    \    MAJ:MIN RM RO TYPE MOUNTPOINT\nsda       8:0    0  70G 0 disk\n├─sda1   8:1\
    \    0  1G 0 part /boot\n└─sda2   8:2    0  69G 0 part\n  ├─centos-root 253:0\
    \ 0  45G 0 lvm /\n  ├─centos-swap 253:1 0  26G 0 lvm [SWAP]\n  └─centos-home 253:2\
    \ 0  22G 0 lvm /home\nsdb       8:16   0  20G 0 disk\n  └─sdb1   8:17   0  20G\
    \ 0 part\nsdc       8:32   0  20G 0 disk\n  └─sdc1   8:33   0  20G 0 part\nsdd\
    \       8:48   0  20G 0 disk\n  └─sdd1   8:49   0  20G 0 part\nsr0       11:0\
    \    1  4.3G 0 rom\n```\n有三个额外的设备 'sdb' 和 'sdc]，我们使用这三块硬盘来创建一个 raid 5。\n\n###\
    \ 第 5 步：安装 mdadm 包\n```\n=>yum update\n=>yum install mdadm -y\n```\n\n### 第 6\
    \ 步：检查软件包的版本\n```\n=>mdadm -version\n```\n\n### 第 7 步：使用 mdadm 检查硬盘\n=>mdadm --examine\
    \ /dev/sd[b-d]\n\n```\n[root@localhost ~]# mdadm --examine /dev/sd[b-d]\nmdadm:\
    \ No md superblock detected on /dev/sdb.\nmdadm: No md superblock detected on\
