    # Synthetic File System


    There are two different type of file system. one is the real file system that
    lies on some disk, like ''/root'', ''/boot'' these are the real file system.


    There are another file system that are fake file system that are created by the
    kernel. Its useful for the system administrator to access the internal variable
    within the kernel. one of the file system is ''/proc''. This is meant for process
    information. Inside the directory there are a lot of directory with numbers.


