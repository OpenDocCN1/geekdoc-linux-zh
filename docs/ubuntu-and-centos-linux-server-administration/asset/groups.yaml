  mdcn: "\n显示处理后的状态\n'R' 表示正在运行（running）\n'S' 表示处于睡眠模式（sleeping）\n'Z' 表示僵尸进程（zombie\
    \ process）\n'T' 表示停止，可能是被作业控制信号停止\n'D' 表示不可中断睡眠\n\nS\n\n%CPU\n\n上一个轮询周期（通常为 5\
    \ 秒）所使用的内存量\n\n%MEM\n\n表示该进程自启动以来已使用的 CPU 时间总和\n\nTIME\n\n这是启动该进程的命令\n\nCOMMAND\n\
    \n最有用的选项是底部的选项。屏幕底部有 10 个选项。\n\n| 名称 | 描述 |\n|---|---|\n| F1 | 帮助选项。它包含了其他所有选项的描述和短代码。\
    \ |\n| F2 | 设置选项。通过此选项你可以自定义 htop 工具的外观。你还可以通过此选项设置输出颜色以及你所需的选项。你可以设置哪些列应该显示，哪些列不显示。\
    \ |\n| F3 | 通过此选项你可以搜索特定的进程，只需输入 F3 和进程名称即可找到它。 |\n| F4 | 你可以使用此命令过滤进程，如果你输入进程名称，它将显示所有具有相同命令名称的进程。\
    \ |\n\nF6 是排序选项。你可以根据不同的选项对进程排序。你可以根据 PID、USER、优先级（Priority）、时间（Time）等排序。\n\n\
    F7 用于降低任何进程的 Nice 值，Nice 值越低，优先级越高。\n\nF8 用于增加任何进程的 Nice 值，Nice 值越高，优先级越低。\n\n\
    它是 kill 命令。你选择一个进程并按 F9，它将向你显示想要发送给该进程的信号列表。这就是你如何杀死任何进程。\n\nhtop 的退出命令。\n\n你也可以像使用\
    \ top 命令一样，通过命令按用户过滤进程。\n\n```\n=>htop -u <username>\n```\n\n## Fuser\n\nFUSER\
    \ 命令基本上用于识别使用文件、目录或套接字（sockets）的进程。该工具基本上显示使用作为命令参数传递的文件的进程 PID。假设你被分配了一个任务来识别使用特定文件的进程，`fuser`\
    \ 命令让你根据进程所处的文件（或目录、套接字）来识别它们。对于块特殊设备，该命令列出使用该设备上任何文件的进程。不仅如此，该工具还允许你杀死这些进程，因此你不需要单独使用\
    \ KILL 或 KILLALL 命令。\n\nFuser 命令输出显示进程 PID 列表，后跟着一个字母，表示进程如何使用文件。因为 fuser 命令不仅显示进程，还显示访问类型。\n\
    \n每种访问类型由字母表示\n\n| 项目 | 描述 |\n|---|---|\n| c | 将文件作为当前目录。 |\n| e | 将文件作为程序的执行对象。\
    \ |\n| r | 将文件作为根目录。 |\n| m | 将文件作为共享库（或其他加载对象）。 |\n\n[记住 Linux 将一切都视为文件]\n\n\
    假设你想查看哪个进程正在使用根目录\n\n```\n=>fuser /\n```\n\n```bash\nroot@localhost vagrant #\
    \ fuser /\n1rc 2rc 3rc 4rc 5rc 6rc 7rc 8rc 9rc 10rc 11rc 14rc\n15rc 16rc 17rc\
    \ 18rc 19rc 20rc 21rc 22rc 23rc 24rc 25rc 26rc 33rc 34rc\n35rc 36rc 37rc 38rc\
    \ 39rc 40rc 41rc 42rc 43rc 44rc 45rc 46rc 47rc 48rc 49rc 50rc\n51rc 52rc 53rc\
    \ 54rc 55rc 56rc 57rc 58rc 59rc 60rc 61rc 62rc 63rc 64rc 65rc\n66rc 67rc 68rc\
    \ 69rc 70rc 71rc 72rc 73rc 74rc 75rc 76rc 77rc 78rc 79rc 80rc\n81rc 82rc 83rc\
    \ 84rc 85rc 86rc 87rc 88rc 89rc 90rc 91rc 92rc 93rc 94rc 95rc 96rc 97rc 98rc 99rc\
    \ 100rc\n101rc 102rc 103rc 104rc 105rc 106rc 107rc 108rc 109rc 110rc 111rc 112rc\
    \ 113rc 114rc 115rc 116rc 117rc 118rc\nroot@ vagrant]#\n```\n\n但这只显示了 PID，而且很难理解。所以我们添加冗余标志\
    \ - ( v ) 让结果现在包含更多信息\n\n```bash\nroot@localhost vagrant # fuser -v /\nUSER PID\
    \ ACCESS COMMAND\nroot kernel mount /\nroot 1rc.. systemd\nroot 2rc.. kthread\n\
    root 3rc.. ksoftirqd/0\nroot 5rc.. worker/0:0\nroot 6rc.. worker/u2:0\nroot 7rc..\
    \ migration/0\nroot 8rc.. rcu_bh\nroot 9rc.. rcu_sched\nroot 10rc.. lru-add-drain\n\
