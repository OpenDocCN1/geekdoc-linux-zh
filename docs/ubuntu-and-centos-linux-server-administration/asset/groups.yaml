    # Tanvir Rahman


    机器无法逃逸或篡改宿主机。这就是为什么虚拟机是测试应用程序的完美平台。即使是不同的服务器也可以安装在单个宿主机上。


    ## 虚拟机分类


    ### 系统虚拟机

    系统虚拟机模拟真实计算机的所有属性并共享宿主机的物理资源。它的虚拟化技术由一种名为 hypervisor（虚拟机监控器）的软件提供。hypervisor 可以运行在操作系统之上，也可以运行在硬件之上。


    ### 进程虚拟机

    进程虚拟机专门用于运行单个应用程序。当应用程序不使用时，该虚拟机就不存在。这种虚拟机主要用于运行与底层操作系统不兼容的程序。


    ## Hypervisor


    ### 1 型虚拟机

    属于 1 型的 hypervisor 软件与物理硬件直接接触。对硬件的直接处理提高了运行在其上的客系统的效率和性能。这种虚拟化也称为裸金属虚拟机监控器（Bare
    metal Hypervisor）。它们主要用于数据中心、云环境或企业。


    - 1) Oracle OVM

    - 2) SPARC

    - 3) Hyper-V

    - 4) KVM


    ### 2 型虚拟机

    第 2 型虚拟化在硬件之上多了一个层，客操作系统共享硬件，但访问物理资源需要宿主机操作系统的权限。这基本上增加了一个额外的复杂性。


    为什么 1 型的性能优于 2 型：


    - 1) Virtualbox

    - 2) VMware

    - 3) QEMU


    ## 容器


    当我们第一次读到容器时，我们认为容器和虚拟机是一回事。但事实上它们并不完全相同，容器不是同一个概念。1979 年，UNIX 为操作系统添加了一个名为 chroot
    的服务。它提供了一个运行应用程序和服务的隔离环境。2008 年，Linux 引入了称为 LXC 的 Linux 容器，现在仍在使用，这是一个为进程监控创建隔离环境的流行开源应用。2013
    年，DOCKER 公司将其引入了视野。Docker 容器具有强大的应用程序编程接口 (API)、CLI、高效的模型和集群管理。


    与虚拟机相比，Docker 平台将资源的抽象从硬件级提升到了操作系统级。这允许实现容器的各种优势，例如：应用程序的可移植性、基础设施分离和自包含的微服务。换句话说，虚拟机抽象了整个服务器，而容器抽象了操作系统内核。这是一种完全不同的虚拟化方法，并产生更快、更轻量级的实例，因此核心概念是
    Docker 不通过独立的操作系统来隔离环境。


    ## 容器的实现 vs 虚拟机实现


    你可以同时集成 hypervisor 和 docker 以获得更好的资源利用率。


    ## 为什么使用 Docker 而不是虚拟机


    部署 Docker 的主要原因是硬件资源的高效利用。如果我们不使用任何虚拟化，大多数服务器的硬件资源利用率为 5% 到 10%。但通过适当的虚拟化技术，我们可以提高负载密度。


    ## 但也有问题


    第一个问题是可移植性。当你尝试将应用程序从一个位置迁移到另一个位置时，我们必须传输整个操作系统，而且运行在 VMware 上的操作系统无法原生运行在 Virtualbox
    上，这完全不可移植。


    另一个问题是资源浪费，当你在服务器上部署应用程序时，即使是在虚拟机上，操作系统本身就需要大量的资源。这是硬件资源的极大浪费。你会发现你浪费了大部分资源仅仅在操作系统上。在
    Docker 中，你不需要那样做。


    ***


    ## 创建 UBUNTU 虚拟服务器


    我们可以使用 KVM、libvirt 来创建一个虚拟服务器。


    ### 安装软件包


    如果你在 ubuntu 中：

    ```bash

    sudo apt install kvm libvirt-bin virt-manager virt-viewer virt-top virtwhat

    ```


    如果你在 CentOS/RedHat 中：

    ```bash

    sudo yum install groupinstall "virtualization"

    ```


    ### 安装操作系统


    [syntax]

    ```bash

    virt-install -name=<name_of_os> -vcpus=<how_many_cpu_use> -memory=<ram_size> -cdrom=<path_of_the_iso>
    --disk size=<how_many_disk_space_you_allocate> --os-variant=''debian/arch/centos<choose_the_flavour>''

    ```

    ```bash

    virt-install -name=my_os -vcpus=1 -memory=2048 -cdrom=<path_of_the_iso> --disk
    size=5 --os-variant=''debian/arch/centos''

    ```

    之后虚拟机将启动。你可以使用此命令查找操作系统的详情：

    ```bash

    osinfo

    ```


    [important]

    你刚刚安装的操作系统将存储在 "/home/share/libvirt/images"。因此，如果你想完全删除操作系统，必须手动删除文件夹内的文件。查找所有已安装操作系统的列表：

    ```bash

    virsh list

    ```

    启动一个虚拟机：

    ```bash

    virsh start <VM_name>

    ```

    关闭虚拟机：

    ```bash

    virsh shutdown <VM_name>

    ```

    强制关闭虚拟机：

    ```bash

    virsh destroy <VM_name>

    ```

    删除虚拟机：

    ```bash

    virsh undefine <VM_name>

    ```


    ***


    ## APACHE WEB 服务器


    Web 服务器是通常用于存储网站的计算机，以便人们可以在互联网上访问它们。存储在 Web 服务器上的文件由客户端计算机上的浏览器读取。浏览器与 Web 服务器通信，从互联网为你获取信息。Web
    服务器可以同时与多台计算机通信。计算机硬件在服务器中起着至关重要的作用。服务器快慢取决于处理器的速度。专用计算机用于这种服务目的。还需要一个程序来执行此操作。该程序被称为
    Web 服务器。


    所以 Web 服务器实际上是运行服务器软件的硬件。这种软件程序被称为守护进程（daemon）。它们在后台运行。


    现代 Web 服务器带有一些额外功能，如提供电子邮件、文件传输协议。Web 服务器还运行安装在上面的程序，如 wordpress、jooomla、数据库等。Linux
    中有不同的 Web 服务器：


    - 1) Apache HTTP server

    - 2) NGINX web server

    - 3) Apache Tomcat web server

    - 4) Lghttpd web server

    - 5) Open lite speed web server


    在所有 Web 服务器中，Apache Web 服务器是全球使用最广泛的。世界上 52% 的网站运行在 Apache 上。Apache Web 服务器常见于
    Linux 上。它拥有良好的文档和对其他软件项目的集成支持。


    '
