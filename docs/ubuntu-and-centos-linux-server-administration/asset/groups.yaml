    # COCKPIT


    Cockpit is a free open source system monitoring application which is considered
    a basic web based tool to monitor and configure basic services, system health
    and monitor multiple servers and their performances. it will let you start/stop
    services, generate diagnostic report, manage users, network, vlan, multiple servers
    with a graphical user interface. you can monitor multiple servers with a single
    interface. its a very important tool for the beginner system administrator and
    lets you monitor almost everything of a system.


    # SETTING COCKPIT FOR SERVER IN UBUNTU


    # STEP 1


    Assign static ip address of your UBUNTU system [you can find them way in the ip
    address section]


    # STEP 2


    update the repository => apt update -y


    # STEP 3


    install cockpit => apt install cockpit -y [you can directly fetch the source code
    from the github and compile too ]


    # STEP 4


    enable the service in the boot time

    =>systemctl enable cockpit.socket


    # STEP 5


    restart the service

    =>systemctl restart cockpit.socket


    # STEP 6


    go to web browser and type <ip_address>:9090

    [port: 9090]


    # STEP 7


    Enter the root user and password to login


    # STEP 8


    This page you can monitor


    - → system memory

    - Disk I/O

    - network traffic

    - CPU performance


    # Tanvir Rahman


    # STEP 9


    This page you can monitor system logs


    # UBUNTU CENTOS ADMINISTRATOR


    # STEP 10


    This page you can monitor networking and firewall network interface, you can add
    vlan, bridge and team


    # Tanvir Rahman


    # STEP 11


    You can also monitor the user, you can add or remove the user from this page.


    # STEP 12


    you can monitor and control all the service


    # UBUNTU CENTOS ADMINISTRATOR


    # SETTING COCKPIT FOR SERVER IN CENTOS


    # STEP 1


    Assign static ip address of your centos system [you can find them in the ip address
    section]


    # STEP 2


    install "epel-release" repository in the system => yum install epel-release -y


    # STEP 3


    update the repository => yum update -y


    # STEP 4


    install cockpit [you can directly fetch the source code from the github and compile
    too but in centos is in epel-release you need to do that]


    # STEP 5


    enable the service in the boot time

    =>systemctl enable cockpit.socket


    # STEP 6


    Edit the configuration and disable the SSL

    ```ini

    =>vim /lib/systemd/system/cockpit.service

    [Unit]

    Description=Cockpit Web Service

    Documentation=man-cockpit

    Requires=cockpit.socket


    [Service]

    ExecPre=/usr/sbin/runctl --ensure --user=root --group=cockpit-ws --selinux-type=etc_t

    ExecStart=/usr/libexec/cockpit --no-tls

    PermissionsStart=true

    User=cockpit-ws

    Group=cockpit-ws

    ```


    # Tanvir Rahman


    add `--no-tls` after the `ExecStart=/usr/libexec/cockpit` line will disable the
    SSL.


    ```ini

    [Unit]

    Description=Cockpit Web Service

    Documentation=man-cockpit

    Requires=cockpit.socket


    [Service]

    ExecPre=/usr/sbin/runctl --ensure --user=root --group=cockpit-ws --selinux-type=etc_t

    ExecStart=/usr/libexec/cockpit --no-tls

    PermissionsStart=true

    User=cockpit-ws

    Group=cockpit-ws

    ```


    # STEP 7


    restart the service

    =>systemctl restart cockpit.socket


    # STEP 8


    go to web browser and type <ip_address>:9090

    [port: 9090]


    # STEP 9


    Enter the root user and password to login


    # STEP 10


    This page you can monitor


    - system memory

    - Disk I/O

    - network traffic

    - CPU performance


    # Tanvir Rahman


