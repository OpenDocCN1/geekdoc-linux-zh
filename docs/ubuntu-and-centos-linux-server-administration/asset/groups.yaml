  mdcn: "\n\n# UBUNTU CENTOS 管理员\n\n![](img/b48bb5eea64d70d0c5160c63325a327c_31_0.png)\n\
    \n# 第 8 \n\n等待安装完成。完成后重启系统。\n\n# 第 9 \n\n使用 root 凭登录\n\nTanvir Rahman\n\n# 总结：\n\
    \n我们学习了如何使用引导分区在 VMware 虚拟机上设置 CentOS 服务器。\n\n***\n\n# LINUX 命令行\n\n每个 Linux 工作站版本都有漂亮的\
    \ GUI（图形用户界面），但大多数 Ubuntu 或 Centos 服务器的 root 可以在命令行模式下完成任何操作。你可以为它添加图形用户界面，但如果没有命令行，你就无法妥善地管理服务器。一旦学会了命令行，你会发现它比图形模式更强大、更灵活管理服务器。\n\
    \n## 以 root 身份运行\n\n默认情况下，每个 Linux 操作系统都会创建一个 root 用户。许多操作系统（如 CentOS）会要求 root\
    \ 密码。但 Ubuntu 服务器不会这样做。这有一个非常好的理由。在 Linux 操作系统中，root 拥有无限权限。root 可以做任何事情，更改任何事情，甚至从服务器上删除任何事情。因此，以\
    \ root 身份工作时非常小心。这就是为什么在 Tanvir 的 ubuntu 服务器中，每次执行任何需要超级用户权限的操作都要使用 `sudo` 命令。此命令允许普通用户执行需要超级用户权限的任务。你输入\
    \ sudo 然后输入你的命令，可能会提示输入密码，提供密码后它将以超级用户权限执行操作。但如果你想要 root shell，请输入此命令：\n\n```\n\
    => sudo su\n```\n\n但不建议使用 root shell 工作。除非绝对必要，否则不要使用 root shell。如果需要超级用户权限，请使用\
    \ sudo。\n\n# 终端与 shell\n\n### 什么是终端\n\n终端是一个打开窗口并让你操作 shell 的程序。在 Linux 发行版中你可以许多不同的终端模拟器，例如\
    \ Gnome terminal, konsole, xterm, rxvt, nxterm, eterm, Tilikix 等。终端让你与 shell 交互。\n\
    \n### 什么是 shell\n\nShell 本身是一个程序，它接收键盘上的命令并将其交给操作系统执行。你可以使用图形用户界面工作，但如果你使用的服务器没有图形用户界面，这将是你获得的唯一界面，你必须在\
    \ CLI（命令行界面）中完成所有工作。\n\n有不同类型的 shell：\n\n- tsh -> tsh 是一种带有类似于 C 语言的脚本语言的 shell\n\
    - sash -> 独立 shell。这是一个非常极简的 shell，运行于几乎所有系统。它主要用于系统故障排除\n- zsh -> zsh 是一个与 bash\
    \ 兼容但具有许多额外功能的 shell\n- fish -> fish 代表 friendly interactive shell（友好交互 shell）。主要在桌面流行。它有非常好的自动补全功能\n\
    - Bash -> bash 代表 Bourne Again Shell，它是原始 UNIX 程序 sh 的增强版本。它由 Steve Bourne 编写。它是最流行的\
    \ shell，也是大多数 Linux 操作系统的默认 shell。\n\n我们将在所有示例中使用 Bash。\n\n***\n\n# 基础 LINUX 命令\n\
    \n这些是操作 Linux 操作系统的基本命令。\n\n**命令名：ls**\n\n**描述：**\nls 命令用于查看目录内部的文件和文件夹。它是 Linux\
    \ 中最常用的命令。\n\n**语法：**\nls [-option] <directory>\n\n- 1) ls -m 将用逗号分隔显示文件和文件夹\n\
    - 2) ls -a 也会显示隐藏文件\n- 3) ls -l 将以列表格式显示文件和文件夹\n- 4) ls -lh 将显示带有大小的文件\n- 5) ls\
    \ -i 将显示带有 Inode 的文件夹列表\n- 6) ls -t 将在目录列表运行时显示修改时间\n\n**命令名：more**\n\n**描述：**\n\
    它的工作方式类似于 more 命令。它还提供了滚动选项。\n\n**语法：**\n```\nmore <options> <file_name>\n```\n\
    \n- 1) less -E : 第一次到达末尾时自动退出\n- 2) less -f : 强制打开非普通文件\n- 3) less -F : 如果整个文件都能显示在屏幕上则退出\n\
    - 4) less -g : 高亮显示搜索到的字符串\n- 5) less -G : 抑制搜索命令找到的所有字符串高亮\n- 6) less -i : 忽略大小写\n\
