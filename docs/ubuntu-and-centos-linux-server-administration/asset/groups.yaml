    # RAID 10


    ![](img/b48bb5eea64d70d0c5160c63325a327c_204_0.png)


    So its a combination of striping and mirroring . So RAID 10 gives us the fault
    tolerance of the RAID 1 and speed of the RAID 0 .But the downside is you can only
    use the half of your total storage of you implement RAID 10.'
