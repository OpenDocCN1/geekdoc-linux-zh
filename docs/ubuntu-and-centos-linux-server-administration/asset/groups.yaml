    \ package webmin.\n(Reading database ... 65008 files and directories currently\
    \ installed.)\nPreparing to unpack webmin_1.920_all_deb ...\nUnpacking webmin\
    \ (1.920) ...\ndpkg: dependency problems prevent configuration of webmin:\nwebmin\
    \ depends on libnet-ssleay-perl; however:\nPackage libnet-ssleay-perl is not installed.\n\
    webmin depends on libauthen-pam-perl; however:\nPackage libauthen-pam-perl is\
    \ not installed.\nwebmin depends on libio-pty-perl; however:\nPackage libio-pty-perl\
    \ is not installed.\nwebmin depends on apt-show-versions; however:\nPackage apt-show-versions\
    \ is not installed.\nwebmin depends on python; however:\nPackage python is not\
    \ installed.\ndpkg: error processing package webmin (--install):\ndependency problems\
    \ - leaving unconfigured\nProcessing triggers for rereadhead (0.100.8-21) ...\n\
    Processing triggers for systemd (237-3ubuntu10.23) ...\nErrors were encountered\
    \ while processing:\nwebmin\nroot@ubuntu-bionic: #\n```\n\n[To fix this problem\
    \ we can use the online package management system\n=>sudo apt-get install -f ]\n\
    \nit will search the dependencies and install them.\n\n## Remove packages:\n\n\
    to remove packages from the system this command is used\n\n```bash\n=>dpkg -r\
    \ <package_name>\n```\n\n## Completely remove package and configuration file:\n\
    \nto completely remove package and the related configuration file this command\
    \ is used\n\n```bash\n=>dpkg -P <package_name>\n```\n\nIf you find a file and\
    \ want to know which package it belongs to use this command\n\n```bash\n=>dpkg\
    \ -S <file_path>\n```\n\n## UBUNTU $ CENTOS ADMINISTRATOR\n\n```bash\nroot@ubuntu-bionic:~#\
    \ dpkg -S /bin/cp\ncoreutils:/bin/cp\nroot@ubuntu-bionic:~# dpkg -S /bin/cat\n\
    coreutils:/bin/cat\nroot@ubuntu-bionic:~# dpkg -S /bin/ping\niputils-ping:/bin/ping\n\
    root@ubuntu-bionic:~# _\n```\n\n## Reconfigure packages:\n\nif you face any problem\
    \ in your package configuration. You can reconfigure the package with this command\
    \ =>dpkg-reconfigure <package_name>\n\nBut to do this you need to know the exact\
    \ name of the package. It will automatically rewind the installation process and\
    \ give you chance to reconfigure.\n\n```bash\nroot@ubuntu-bionic: # dpkg-reconfigure\
    \ webmin\nWebmin install complete. You can now login to https://ubuntu-bionic:10000/\n\
    as root with your root password, or as any user who can use sudo\nto run commands\
    \ as root.\nroot@ubuntu-bionic: # _\n```\n\n## Installing packages with apt\n\n\
    The apt utility is a powerful and free package management command line program,\
    \ that is used to work with Ubuntu’s APT (Advanced Packaging Tool) library to\
    \ perform installation of new software packages, removing existing software packages,\
    \ upgrading of existing software packages and even used to the entire operating\
    \ system\n\nOn ubuntu server or any debian based OS there is a list repository\
    \ url which is populated during the installation in /etc/apt/sources.list' but\
    \ you can add repository.\n\n## Update repository:\n\nBefore installing any package\
    \ you need to update the software repository.\n\nCommand\nsudo apt update\n\n\
    [you need to be root to perform the action]\n\n## Upgrade existing Software:\n\
    \nTo upgrade every package in the latest version use this command\n=>sudo apt\
    \ upgrade\n\n## Update OS distribution\n\nto upgrade the distribution for example\
    \ upgrading ubuntu 16 version this command is used\n=>sudo apt dist-upgrade\n\n\
    ## Install Packages\n\nfor installing packages this command is used\n\nTanvir\
    \ Rahman\n\n```bash\n=>sudo apt install <package_name>\n```\n\nfor example\nto\
    \ install vim editor use this command\n=>sudo apt install vim\n\n## Remove Packages\n\
    \nfor removing packages this command is used\n=>sudo apt remove <package_name>\n\
    \nfor example\nto remove vim editor use this command\n=>sudo apt remove vim\n\n\
    this command will remove the packages but not the dependencies. To remove this\
    \ command is used\n=>sudo autoremove\n\n## apt-cache command\n\nThe apt-cache\
    \ command line tool is used for searching software package cache. In simple words,\
    \ this tool is used to search software packages, collects information of packages\
    \ and\n\n## UBUNTU $ CENTOS ADMINISTRATOR\n\nalso used to search for what available\
    \ packages are ready for installation on Ubuntu based systems.\n\n## Apt-cache\
    \ search\n\n```bash\n=>sudo apt-cache search <package_name>\n```\n\nThis command\
    \ show all the program will show all the program that depends on the packages.\
    \ suppose you install gmail this command\n\n```bash\n=>sudo apt-cache search gmail\n\
    ```\n\nwill show all the packages that depends on this packages like 'thunderbird'\n\
    \n## Package Details\n\nYou can also see the details of any packages with apt\
    \ just like the dpkg -s command.\n\n```bash\n=>sudo apt-cache show vim\n```\n\n\
    ## Find Unmet Dependencies:\n\nThis command will find all the unmet dependencies\
    \ of the system\n\n```bash\n=>sudo apt-cache unmet\n```\n\n## Find Specific Dependency\
    \ of Packages:\n\n```bash\n=>sudo apt-cache depends <package_name>\n```\n\nThis\
    \ command will give all the dependencies of the Packages.\n\n## Find Reverse Dependencies:\n\
    \n```bash\n=>sudo apt-cache rdepends <package_name>\n```\n\nThis command will\
    \ find the reverse dependencies of the program. That means it will show all the\
    \ packages that depends on that packages.\n\nFor example:\n\n```bash\n=>sudo apt-cache\
    \ rdepends git\n```\n\n## Aptitude package management tool:\n\nThere is a new\
    \ package management tools called aptitude, to use that first you have to install\
    \ it with this command\n\n```bash\n=>sudo apt install aptitude\n```\n\n## Install\
    \ package via aptitude:\n\ninstalling command with aptitude is\n\n```bash\n=>sudo\
    \ aptitude install <package_name>\nexample:\n=>sudo aptitude install emacs\n```\n\
    \n# Search package via aptitude\n\nFor searching any packages this command is\
    \ used\n\n```bash\n=>sudo aptitude search <package_name>\n```\n"
