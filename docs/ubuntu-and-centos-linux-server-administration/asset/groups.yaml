    \ management and Process Monitoring is a way of increasing and optimizing the\
    \ performance of the server.\n\n# Different Kinds of Process\n\n- Linux basically\
    \ has two kinds of Process:\n1) Automatic Process (Background Process)\n2) Interactive\
    \ Process\n\n# Automatic Process\n\nAutomatic Process also known as Daemons. Automatic\
    \ Process starts when the system starts (When the server is booted). This Process\
    \ is not under the direct control of the User. In other words, it does not write\
    \ output directly to the standard output.\n\n# Interactive Process\n\ninteractive\
    \ process is the processes that started by the user using different commands.\
    \ the process starts in a shell and it writes the output directly to the standard\
    \ output. To start an interactive process the user has to type command in a shell.\
    \ systemd and the process is started as a child process from the shell in which\
    \ the user entered the command, when we terminate the child process this process\
    \ gives an exit status to the parent process and then it safely exits. If the\
    \ parent process died then it will not be possible for monitoring; it's called\
    \ a zombie process. zombie Process is a result of bad Programming. The process\
    \ is the first process which starts; other process is a child process of the process.\n\
    \n# Some Background Process (Daemons)\n\n| Process Name(Daemons) | Descriptions\
    \ |\n|---|---|\n\n# UBUNTU $ CENTOS ADMINISTRATOR\n\nsystemd\n\nSystemd is the\
    \ Unix program which spawns all other processes.\n\nSystemd replaced the Init\
    \ process. It is the first process that starts during boot. It manages all other\
    \ processes on the system.\n\n# cron and anacron\n\ncron is a job scheduler that\
    \ allows users to schedule jobs at specific times. anacron is a version of cron\
    \ that handles jobs that were missed while the computer was off.\n\n# dhcp\n\n\
    dhcp is a protocol used to automatically assign IP addresses to devices on a network.\n\
    \n# httpd\n\nhttpd is the web server process that serves web content over HTTP.\n\
    \n# ntpd\n\nntpd is the Network Time Protocol daemon that synchronizes the clocks\
    \ of computer systems.\n\n# sshd\n\nsshd is the Secure Shell daemon that allows\
    \ remote login to the server.\n\n# syslog\n\nsyslogd is a system logging service\
    \ that collects and logs system messages.\n\n# ftpd\n\nftpd is the File Transfer\
    \ Protocol daemon used for transferring files between a client and a server.\n\
