  mdcn: '

    如果数据损坏，没有任何办法可以恢复数据，因此现在的问题是，为什么要使用 RAID 0。


    使用 RAID 0 的主要优势是“速度”。因为当你使用多个磁盘控制器而不是一个时，访问数据的速度会更快。


    ## Raid 1


    RAID 0 具有容错能力。RAID 1 被称为镜像（MIRRORING）。在镜像中，数据被写入每个 RAID 设备。每块磁盘都拥有另一块磁盘数据的完整副本。因此，如果一个磁盘故障，你可以从另一块磁盘访问相同的数据。


    # Tanvir Rahman


    ## RAID 1


    ![](img/b48bb5eea64d70d0c5160c63325a327c_202_0.png)


    它极其安全。但效率非常低。因为它消耗了数据大小两倍的空间。例如，为了存储 80GB 的数据，你需要 160GB 的存储空间，由于数据必须写入多个磁盘中，因此这是一个缓慢的过程。


    ## Raid 5


    RAID 5 同样具有容错能力。它是镜像的替代方案。它不是通过完全复制保存数据，而是通过校验位信息（parity information）。校验信息占用一个驱动器，以便在数据丢失时用于恢复数据。这就是为什么
    RAID 5 需要三个或更多磁盘。这是一种非常流行的磁盘存储方法。校验信息均匀地分布在所有磁盘中。数据的缺点是，校验位占据了整个一个磁盘容量的空间。这意味着如果你提供了
    4 块 1TB 的磁盘，那么在 RAID 5 磁盘中你只能存储 3TB 的数据。


    # UBUNTU $ CENTOS 管理员


    这是


    ![](img/b48bb5eea64d70d0c5160c63325a327c_203_0.png)


    条列（striping）和校验的结合。RAID 提供了更快的访问和恢复能力，使其成为服务器最常用的冗余方案。


    ## Raid 10(1+0)


    RAID 10 实际上是 RAID 1 + RAID 0。它使用了这两种技术来存储数据。你必须使用至少 4 块磁盘来实现 RAID 10。在 RAID 10
    中，数据像 RAID 0 一样在多个磁盘上进行条列，但每块磁盘像 RAID 1 一样在另一块磁盘上有一个完全副本。


    ## RAID 10


    ![](img/b48bb5eea64d70d0c5160c63325a327c_204_0.png)


    它是条列和镜像的结合。因此 RAID 10 为我们提供了 RAID 1 的容错能力和 RAID 0 的速度。但缺点是，如果你实现了 RAID 10，只能使用总存储容量一半。


    ## 在 CENTOS 7 中创建 RAID 0


    RAID 0 不具备容错能力，但它有一些优势：


    - 它是高性能的

    - 不会浪费空间

    - 读写速度会很快


