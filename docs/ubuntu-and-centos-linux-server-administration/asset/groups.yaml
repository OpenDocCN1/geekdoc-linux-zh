  - '[PAGE 181]


    +   → you can change the port from 22 to any port you want but

    default is 22


    +   → password authentication is set to no for some cloud server

    Because the use public private key pair which is more secure


    +   → X11 forwarding is by default set to yes. if you want to work

    with a gui interface this will let you do this


    +   → Permit root login is set to no. It should be always set to no

    because root login can make major security risk'
