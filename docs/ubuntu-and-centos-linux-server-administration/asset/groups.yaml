    # PACKAGE MANAGEMENT\IN LINUX


    As a server administrator you will need to install different software on your
    server on different occasion .Most of the Linux operating system(Ubuntu Server/Centos
    server/Open SUSE server) has two different ways of installing software. First
    are the software packages that contain the programs that are ready to install
    and that integrate with the server easily. The server keeps the list of installed
    packages in the database that makes maintaining very easy. The second option to
    install software via tarball. Which basically just an archive of the software.
    Archive can be anything (can be any record of the data) but it can b used to deliver
    software. The first method is proffered most of the time Because server can keep
    track of the software that are installed via packages .Software installed via
    tarball are not tracked. There is a second difference between packages and tarballs
    for working properly (this is called dependency),both tarball and packages have
    program installed that check if the'
- md: "\ndependencies are met but only the software packages interact with the package\
    \ manager. And in that way it can install the missing dependencies which other\
    \ installation system can't do. So nowadays software packages are preferred. Software\
    \ packages are mostly made in two different formats. On Red Hat and openSUSE and\
    \ similar distribution rpm packages is used. And deb-based operating system like\
    \ ubuntu server deb package is used. But these packages can be converted. And\
    \ the other advantage is software can be install by compiling the source code\
    \ too.\n\n## High level and Low level Package management Tools \n\nin order to\
    \ interact with the software packages there are two types of available tools.\
    \ low level package management also known as local package management system.\
    \ and the high-level tools are known as online package management tools.\n\nTanvir\
    \ Rahman\n\n| Distribution | Low-Level Tools | High Level Tools |\n| :--- | :---\
    \ | :--- |\n| Debian based distribution | dpkg | apt/aptitude |\n| Centos/Red\
    \ Hat | rpm | yum |\n| Open SUSE | rpm | zypper |\n\n[do not use red hat rpm file\
    \ in openSUSE system]\n\nIf you already download or create your own .deb package\
    \ you can manage it with dpkg command.\n\n## UBUNTU PACKAGE MANAGEMENT\n\n###\
    \ Installing package with dpkg\n\nFor installing packages with dpkg, command is\n\
    \n```bash\n=>dpkg -i <package_name>\n```\n\n## List of current package:\n\nTo\
    \ list all the current packages that are currently installed in Ubuntu server\
    \ the command is =>>dpkg -L\n\nit will show the name, version, architecture and\
    \ a small description.\n\n## Check packages installation status\n\nif you need\
    \ to know any packages installed or not then following command can show if the\
    \ package installed or not\n\n```bash\n=>dpkg --get-selections <package_name>\n\
    ```\n\n```bash\nroot@ubuntu-bionic: # dpkg --get-selections git\ngit install\n\
    root@ubuntu-bionic: # dpkg --get-selections postgresql\npostgresql install\nroot@ubuntu-bionic:\
    \ # dpkg --get-selections java\ndpkg: no packages found matching java\nroot@ubuntu-bionic:\
    \ # \n```\n\n## Check Details information about packages:\n\nTo check details\
    \ about a installed packages use this command\n\n=>sudo dpkg -s <package_name>\n\
